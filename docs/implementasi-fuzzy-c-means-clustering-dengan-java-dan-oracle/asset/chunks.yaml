    ```


    其中：


    *   `![](img/0023.jpeg)Ht`: 现期股票总价格。

    *   `![](img/0024.jpeg)Ho`: 基准期股票总价格。


    #### 2.4.2.2 加权综合股票指数计算方法


    与之前的方法不同，这种方法考虑了股票对市场的影响力，这意味着某些特定股票价格的变化会影响所有价格。正是基于这种影响权重，计算了加权 IHSG。股票影响权重的确定取决于上市股票的数量。上市数量越多，该股票形成
    IHSG 的能力越强。加权方法包含四种 IHSG 计算模型：Laspeyres、Paasche、Irving Fisher 和 Drobisch。每种加权模型将详细说明并附带其公式。


