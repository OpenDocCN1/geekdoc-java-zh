    #### 2.4.2.3 抽样综合股票指数计算方法


    如果将交易所上市的所有股票全部纳入，IHSG 的计算效率将会降低。这是因为如果上市股票数量达到数万只，计算 IHSG 将非常复杂。


    世界上一些资本市场如道琼斯指数（the Dow Jones Industrial Average），仅使用 30 只工业部门的股票作为样本。同样，标准普尔
    500 指数（the Standard & Poor’s 500 Composite）所使用的股票指数使用了 500 只股票，由 400 只工业公司股票、40
    只公用事业股票、20 只运输公司股票和 40 只金融公司股票组成。


    ### 2.4.3 IHSG 波动中的术语


    与资本市场相关的术语有很多，但书中仅讨论一些与本书相关的术语。以下是相关讨论。


    #### 2.4.3.1 牛市市场（Bullish Market）


    基于 IHSG 指标值波动的牛市市场特征如下：


    * IHSG 数值随时间推移呈现上升趋势

    * 新的高点始终高于之前的最高点，直到第三阶段结束。

    * 在 IHSG 数值波动中，新的低点始终高于之前的指数低点。


    #### 2.4.3.2 熊市市场（Bearish Market）


    熊市市场是牛市市场的反，特征如下：


    * IHSG 数值随时间推移呈现下降趋势。

    * 新的指数高点始终低于之前的最高点，直到第三阶段结束。

    * 在 IHSG 数值波动中，新的低点始终低于之前的指数低点。

    * 在熊市中，进行交易的投资者并非真实投资者，而大部分是投机者，他们只希望从短期价格波动中获利。

    * 在熊市中，通常会出现一种观点：“Good news is no news and bad news is nightmare”（好消息就是没消息，坏消息就是噩梦），这意味着大多数投资者的态度更加悲观。

    * 在熊市中，交易频率往往较小，因为在高风险下可能获得的利润较小。

    * 在熊市中，股票价格下跌发生在几乎所有高价值股票上[[Wid96]](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)。


    ## 2.5 雅加达交易所综合股票指数


    为了向公众提供有关交易所发展的更完整信息，BEJ 已通过纸质和电子媒体传播股票价格波动数据。该股票价格波动的指标是 IHS。


    目前，BEJ 有 4 种股票指数：


    1. `IHSG`，使用所有上市股票作为指数计算的组件。

    2. `行业指数`，使用每个行业中的所有股票。

    3. `LQ45 指数`，经过若干筛选阶段后使用的 45 只特定股票。

    4. `个体指数`，即基于基础价格的每只股票指数。


