    Pada contoh di atas menggunakan kasus K-Means dan FCM. Bisa diperhatikan bahwa
    pada kasus pertama (K-means), koefisiennya selalu satu (unitary). Hal ini mengindikasikan
    bahwa masing-masing data hanya pada satu klaster. Sedangkan FCM koefisiennya bisa
    selalu lebih dari satu. Hal ini berarti data bisa menjadi anggota lebih dari satu
    klaster dengan derajat keanggotaan yang berbeda pula. Derajat keanggotaan yang
    paling tinggi nilainya akan diambil sebagai suatu acuan dimanakah suatu data masuk
    menjadi anggota klaster.


    FCM lebih baik daripada K-Means dalam hal fleksibilitas. FCM lebih fleksibel karena
    memiliki toleransi keanggotaan data terhadap tiap klaster. Hal ini tidak terjadi
    pada algoritme K-Means.


