    ## 2. Skenario 2: Skenario Uji Coba 2


    Pada uji ini diberikan suatu skenario yang ditujukan untuk mengetahui fungsionalitas
    aplikasi yang dibuat.


    ### 5.3.1 Garis Besar Skenario 2


    Suatu studi kasus dilakukan pada sudut pandang pengguna yang akan melakukan benchmarking
    nilai IHSG BEJ jenis LQ45 pada tahun 2005.


    Penyusun memilih LQ45 karena terdapat suatu produk pasar dari `PT Bursa Efek Surabaya`
    yang menjual poin dari indeks LQ45. Tiap poin dari indeks tersebut diberikan harga
    tertentu oleh pihak yang mengeluarkan produk tersebut (dalam hal ini `PT Bursa
    Efek Surabaya`). Investor melakukan aksi jual dan beli dari poin indeks tersebut.
    Investor mendapatkan keuntungan dari selisih jual beli poin indeks tersebut. Namanya
    adalah `LQ Futures` dan `Mini LQ Futures`. `LQ Future` diluncurkan pada tanggal
    13 Agustus 2001 dan menjadi pelopor dari produk `derivative` khususnya untuk indeks
    `future` di `Bursa Efek`. `LQ Futures` menggunakan `IHSG BEJ` yang berjenis `LQ45`
    sebagai `underlying`.

