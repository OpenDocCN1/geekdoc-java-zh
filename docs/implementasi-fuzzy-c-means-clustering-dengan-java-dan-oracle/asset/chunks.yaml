  trans: "\n\n![](img/00095.gif)\n\n图 5.24 场景 3 索引类型输入\n\n## 5.4.2.2 基准测试过程。\n\n执行基准测试需要经过几个过程。该过程是模糊\
    \ C 均值聚类（Fuzzy C-Mean Clustering）的阶段。首先，点击 `Generate` 按钮初始化隶属度，这将随机值初始化隶属度变量。\n\
    \n![](img/00096.gif)\n\n图 5.25 场景 3 数据生成数据\n\n然后点击 `Run` 按钮执行后续过程，即寻找质心以及每个数据相对于每个簇的隶属度，并持续更新隶属度直到达到精度极限。\n\
    \n![](img/00097.gif)\n\n图 5.26 场景 3 运行过程 \n\n### 1. 1. 1. 1. 基准测试输出\n\n在基准测试过程经过若干阶段后，可以通过图\
    \ 5.27 的图形表示查看结果。该图表是 IHSG BEJ Agriculture 数据相对于每个簇隶属度的图表。图中的不同颜色代表不同的簇。图中共有 3\
    \ 种颜色，意味着有 3 个簇。\n\n![](img/00098.jpeg)\n\n图 5.27 场景 3 隶属度图表\n\n而图 5.28 图表是表示每个聚类数据与时间变量（索引发生时）连接的图表。每个簇通过颜色区分。图中还可以看到每个簇的质心。红色点群是簇\
    \ C，蓝色是簇 B，绿色是簇 C。\n\n![](img/00099.jpeg)\n\n图 5.28 场景 3 聚类数据图表\n\n图 5.29 是数据在每个簇中具有隶属度的聚类结果。\n\
    \n![](img/00100.jpeg)\n\n图 5.29 场景 3 最大隶属度输出\n\n在图 5.29 中可以看到看到什么？该图提供了每条数据在特定簇中的隶属度信息。从这些隶属度中可以获得特定索引点的趋势。例如，数据\
    \ 303,318。该数据的最高隶属度位于簇 0，值为 0.994，而第二高隶属度位于簇 1，值为 0.004。观察图 5.28，簇 0 为红色而簇 1 为蓝色，这提供了索引点\
    \ 303,318 属于簇 0 并倾向于簇 1 的信息。\n\n图 5.30 是升序排序后的聚类结果，以及带有时间变量的每个数据的最大隶属度：\n\n![](img/00101.jpeg)\n\
    \n图 5.30 场景 3 与时间相关的数据输出\n\n### 1. 1. 1. 1. 输出分析\n\n以下是盲图，图中指定的数据属于哪一组，是属于 A 组、B\
    \ 组还是 C 组？\n\n![](img/00102.gif)\n\n图 5.31 场景 3 盲图\n\n但是，通过图 5.32 中的图表可以清楚地看到该数据位于\
    \ A 组，因为它属于上方的第一个簇。可以清楚地看到数据属于哪一组。\n\n![](img/00103.jpeg)\n\n图 5.32 场景 3 基准测试图表\n\
    \n通过查看几个图表可以获得信息。指数在 10 月、11 月和 12 月处于较高水平（位于 A 组）。根据这些信息可以得出一个依据，即农业股市在这些月份处于高位。这可以作为信息和经验教，供资本市场参与者（特别是投资者）在明年应对此类情况的参考。\n\
    \n以下图 5.33 是 IHSG BEJ agriculture 的基准：\n\n![](img/00104.jpeg)\n\n图 5.33 场景 3 基准范围\n\
