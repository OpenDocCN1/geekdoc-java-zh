    `A = {1,2,3}`；`B = {3,4,5}` 可以说：


    *   项目 2 在集合 `A` 中的隶属值 `μA[2]` 为 1，

    *   项目 3 在集合 `A` 中的隶属值 `μA[3]` 为 1，

    *   项目 3 在集合 `B` 中的隶属值 `μB[3]` 为 1，

    *   项目 4 在集合 `B` 中的隶属值 `μB[4]` 为 1，

    *   项目 5 在集合 `B` 中的隶属值 `μB[5]` 为 1。


