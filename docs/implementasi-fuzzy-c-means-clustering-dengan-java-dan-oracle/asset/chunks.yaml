    | :--- | :--- |

    | A 类 | 此类意味着存在极高点的 `IHSG BEJ Main Board` 数值，意味着市场处于牛市（Bullish）。 |

    | B 类 | 此类意味着 `IHSG BEJ Main Board` 数值仍处于良好，交易仍处于平均水平。 |

    | C 类 | 此类意味着存在极低且低迷的 `IHSG BEJ Main Board` 数值，意味着市场处于熊市（Bearish）。 |


    ### 1. 场景 5 的执行


    通过执行上述场景中编写的内容来进行测试。场景执行将通过几个阶段，即参数输入阶段、基准测试处理、查看基准测试输出以及对输出进行分析。


