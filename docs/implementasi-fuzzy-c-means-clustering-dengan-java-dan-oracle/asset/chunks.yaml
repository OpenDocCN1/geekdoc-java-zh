    \ FCM. Berikut ini adalah alurnya:\n\n![](images/00033.gif)\n\n               \
    \                         Gambar 3.3  Diagram Alur Proses\n\n### 3.2.1 Fase Preprocessing\n\
    \n       Pada tahap ini, data masukan diolah sesuai dengan keinginan pengguna.\
    \ Data masukan diproses sesuai dengan parameter yang di-input-kan pengguna. Parameter\
    \ yang di-input-kan pengguna yakni,  jenis indeks, jumlah klaster, batas ketelitian,\
    \ dan fuzziness. Semua input tersebut merupakan syarat parameter metode pengklasteran\
    \ Fuzzy C-Means kecuali jenis indeks. Jenis indeks mempengaruhi data masukan yang\
    \ akan diolah. Tiap masukkan nantinya akan diberi persyaratan masukan sehingga\
    \ masukan yang masuk ke aplikasi adalah masukan yang benar dan sesuai dengan masukan\
    \ yang disyaratkan oleh algoritme FCM. Diagram dibawah ini akan menjelaskan proses\
    \ tersebut.\n\n       ![](images/00034.gif)\n\nGambar 3.4 Diagram Preprocessing\n\
    \n### 3.2.2 Fase Proses Klasterisasi\n\n        Proses klasterisasi adalah proses\
    \ inti dari aplikasi yang nantinya akan dibuat. Proses ini memiliki alur seperti\
    \ Gambar 3.5 berikut ini.\n\n![](images/00035.gif)\n\n                       \
    \     Gambar 3.5 Diagram Alir Proses Klasterisasi\n\n#### 3.2.2.1 Proses Generate\
    \ Data Input\n\nProses ini merupakan proses untuk inisialisasi derajat keanggotaan\
    \ tiap data. Inisialisasi dari proses ini didapatkan dari bilangan generate random\
    \ (bilangan acak).\n\n#### 3.2.2.2 Komputasi Pusat Klaster\n\nDisini data masukan\
    \ diolah sehingga menjadi beberapa pusat klaster  yang jumlahnya sesuai dengan\
    \ jumlah klaster yang diinputkan oleh pengguna. Fase ini melalui tahap rumus berikut\
    \ ini:\n\n![](images/00036.gif)             (3.1)\n\n#### 3.2.2.3 Komputasi Derajat\
    \ Keanggotaan\n\nDisini data hasil proses pada fase pencarian pusat klaster diolah\
    \ dengan data masukan berupa data mentah indeks. Melakukan komputasi untuk menghitung\
    \ derajat keanggotaan masing-masing data terhadap klaster, dengan rumus sebagai\
    \ berikut:\n\n![](images/00037.gif)             (3.2)\n\n#### 3.2.2.4 Fase Pemberhentian\n\
    \nMelakukan pengambilan keputusan, yakni bila terdapat nilai selisih derajat keanggotaan\
    \ data yang lebih kecil dari batas ketelitian (dari fase preprocessing) maka proses\
    \ akan berhenti, bila tidak maka akan dilanjutkan ke tahap komputasi pusat klaster.\n\
    \n       Hal tersebut sesuai dengan rumus sebagai berikut:\n\n![](images/00038.gif)\
    \             (3.3)\n\n### 3.2.5 Fase Pencarian Derajat Keanggotaan Optimal\n\n\
    Disini data hasil proses pada fase update derajat keanggotaan diolah dengan algoritme\
    \ perbandingan untuk mendapatkan derajat keanggotaan optimal untuk masing-masing\
    \ klaster. Kemudian diambil derajat keanggotaan dari data yang paling tinggi nilainya.\n\
    \n### 3.2.6 Fase Pengelompokkan Berdasarkan Klaster\n\n       Pada fase ini data\
    \ hasil dari fase pencarian derajat keanggotaan optimal akan dikelompokkan sesuai\
    \ dengan persamaan klasternya. Data akan dikelompokkan sesuai dengan data yang\
    \ lainnya yang memiliki kemiripan klaster. Pengelompokkan nanti menggunakan algoritme\
    \ sorting.\n\n### 3.2.7 Fase Pembuatan Grafik Data Terklaster\n\n       Data yang\
    \ sudah mengelompok berdasarkan kemiripan klaster dibuatkan sebuah grafik yang\
    \ merupakan representasi dari data pada klaster tertentu. Grafik ini nantinya\
    \ akan dibuat dengan berwarna. Hal ini untuk memudahkan pengguna dalam membedakan\
    \ daerah klaster dan memudahkan mendapatkan informasi.\n\nCreated with the Personal\
    \ Edition of HelpNDoc: [Free Qt Help documentation generator](http://www.helpndoc.com)\n\
    \n# Perancangan Antarmuka\n\n## Perancangan Antarmuka\n\n       Perancangan antarmuka\
    \ dimaksudkan untuk memudahkan pengguna dalam menjalankan perangkat lunak. Interaksi\
    \ antar pengguna dengan perangkat lunak menggunakan mouse dan keyboard. Pengguna\
    \ bisa memilih jenis IHSG yang diinginkan, memasukkan data input serta menekan\
    \ tombol untuk memulai proses baik untuk melakukan generate maupun untuk melakukan\
    \ run proses serta juga untuk melakukan proses secara step by step (proses perlangkah)\
    \ . Selain input untuk proses klasterisasi, juga terdapat input untuk melihat\
    \ grafik hasil dari pengklasteran data. Input tersebut berupa radio button yang\
    \ bisa di klik sesuai dengan keinginan pengguna. Radio button tersebut bisa dipilih\
    \ bila pengguna bermaksud melihat data dan grafik, pilihan-pilihannya adalah sebagai\
    \ berikut:\n\n*   Grafik IHSG, yakni pengguna bisa melihat grafik poin indeks\
    \ terhadap waktu sebelum data indeks diklaster.\n\n*   Derajat keanggotaan, pengguna\
    \ bisa melihat nilai keanggotaan data indeks terhadap masing-masing klaster beserta\
    \ grafiknya.\n\n*   Data terklaster, pengguna bisa melihat grafik poin indeks\
    \ terhadap waktu setelah data indeks diklaster.\n\n*   Detail data tersortir,\
    \ pengguna bisa melihat data indeks terklaster secara detail yang sudah tersortir\
    \ secara ascending."
