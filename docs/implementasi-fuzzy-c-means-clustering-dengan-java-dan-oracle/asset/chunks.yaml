    图 5.51 场景 5 隶属度输出


    从图 5.51 中可以看到什么呢？该图提供了每个数据在特定簇中的隶属度信息。这是 `FCM` 具有灵活性的特征。从这些隶属度可以获得特定指数点的趋势。例如，数据
    `269,281`。该数据具有最高隶属度位于簇 1，数值为 `0,837`，而第二高隶属度位于簇 2，数值为 `0,123`。观察图 5.50，簇 1 为蓝色，而簇
    2 为红色，这表明指数点 `269,281` 进入了簇 1 并趋向于簇 2。


