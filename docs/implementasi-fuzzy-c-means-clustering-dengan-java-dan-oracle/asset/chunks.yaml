    在清晰集合（crisp set）中，隶属度只有 2 种可能，即 0 或 1；而在模糊集合（fuzzy set）中，隶属度处于 0 到 1 之间。如果 `x`
    的模糊隶度 `μA[x] = 0`，意味着 `x` 不属于集合 A；同理，如果 `x` 的模糊隶度 `μA[x] = 1`，意味着 `x` 是集合 A 的完全成员。


    另一个例子是当该集合应用于指数点时，假设指数水平变量被分为三类，即：


    低：`0 ≤ indeks < 105`；正常：`1050≤ umur ≤ 1250`；高：`indeks > 1250`


    ![](img/00019.jpeg)


    图 2.10 清晰集合：低、正常和高


    在图 2.10 中，可以解释为：


    *   如果索引值为 1049，则称为低（`μRENDAH[1049] = 1`）；

    *   如果索引值为 1050，则称为非低（`μRENDAH[1050]=0`）；

    *   如果索引值为 1050 缺少 0.001 点，则称为非正常（`μNORMAL[ 1050 – 0,001 ] = 0`）；

    *   如果索引值为 1050，则称为正常（`μNORMAL[1050] = 1`）；

    *   如果索引值为 1250，则称为正常（`μNORMAL[1250] = 1`）；

    *   如果索引值为 1250 缺少 0.001 点，则称为非高（`μTINGGI[ 1250 – 0,001 ] = 0`）。


    由此可以说，使用清晰集合表示指数是非常不的，数值的微小变化就会导致显著的类别差异。


    ![](img/00020.jpeg)


    图 2.11 模糊隶属度函数：指数水平


    在图 2.11 中，可以看到：


    *   值为 1100 的索引属于低集合，其 `μRENDAH[1100] = 0,25`；但同时也属于正常集合，其 `μNORMAL[1100] = 0,5`。

    *   值为 1200 的索引属于高集合，其 `μTINGGI[1200] = 0,25`；但它也属于正常集合，其 `μPAROBAYA[1200] = 0,5`。


    # IHSG (综合股票指数)


    ## 综合股票指数


    关于股票指数（IHS）的知识被比作进入房屋的门。如果想进入房子，当然必须经过门。为此，投资者必须知道门在哪里以及如何打开。因此，如果想在资本市场进行投资，投资者必须先了解
    IHS。成功打开门后，投资者必须确定位置，是去客厅、餐厅还是卧室。为了确定位置，投资者需要了解市场状况。在资本市场，尤其是股市中，市场状况由牛市、正常市场和熊市市场组成的市场周期所示。因此，如果想在资本市场进行投资，投资者必须先了解可用于分析该资本市场状况的指标
    [[Wid96]](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)。


    以下将提供关于股票指数和综合股票指数的一些知识。


    ### 2.4.1 定义


    IHS 实际上是一个经过专门编制和计算的股票价格指数，旨在产生趋势（倾向）。指数数字是经过处理的数字，用于比较活动或事件，这些活动可以是股票价格随时间推移的变化。


    在计算这些指数数字时，使用了两个时间基准，即基准期（base period）和现期/执行期（current period）。基准期是将某一事件作为与现期对比的时间。而现期是某个活动或事件发生的时间，之后将与其基准期进行比较。


    综合股票指数（IHSG）用于衡量和报告所有上市（listing）股票总价值相对于总基础价格价值变化的指标。因此，确定指数数字必须有于一组数据，因为必须确定基础价格和交易所有效的股票价格
    [[Wid96]](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX).


    根据 Jack Clark Francis 的观点，IHSG 的作用包括：


    1. 快速了解市场价格（IHSG）对资本市场投资价值的影响。

    2. 此 IHS 也用于历史分析。通过分析市场指数（IHSG）和其他其他经济指标，分析师可以检测指数与经济部门之间的关系。如果该指数是 `dependable
    indicator`（依赖指标），这种关系类型将非常有用，有助于做出预测 [[Fra93].](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    ### 2.4.2 综合股票指数的计算方法


    原则上讲，IHSG 的计算与个体 IHS 的计算没有区别。个体 IHS 是用于单一公司股票的 IHS。每只公司的股票都有个体 IHS。个体 IHS 有助于评估公司状况。个体
    IHS 有助于评估上市股票的状况。


    个体 IHS 使用公式如下：


    ![](img/0021.jpeg) (2.4)


    其中：


    *   `IHS` : 股票指数。

    *   `Ht` : 现期（current period）。

    *   `Ho` : 基准期（base period）。


    其标准如下：


    *   如果指数值 = 100，表示市场正常。

    *   如果指数值 > 100，表示市场处于牛市。

    *   如果指数值 < 100，表示市场处于熊市。


    IHSG 的计算有三种方法，接下来是各方法的讨论。


