    该指数包含 45 只股票，经过若干标准筛选后产生，因此该指数由高流动性股票组成，并考虑了这些股票的市值。


    ### 2.5.2.1 LQ45 指数股票筛选标准


    为了入选该指数，股票必须满足特定标准并通过以下主要筛选：


    1. 进入常规市场股票总交易额的前 60 名（过去 12 个月的平均交易额）。

    2. 进入基于市值价值的排名（过去 12 个月的平均市值）。

    3. 在 `BEJ` 上市至少 3 个月。

    4. 公司的财务状况、公司增长前景、以及在常规市场的交易频率和数量。


    ### 2.5.3 指数评估与股票换换


    `BEJ` 持续监控进入 `LQ45` 计算的股票成分的发展情况。每 3 个月对进入 `LQ45` 指数计算的股票排名进行回顾。股票换换每 6 个月进行一次，即每年的
    2 月和 8 月初。


    如果某只股票不符合标准，该股票将从指数计算中剔除，并由符合标准的股票取代。


    排名 1-35 的股票在指数计算中被快速计算。而排名 36-45 的股票则不需要纳入指数计算。


    #### LQ45 指数基准日与计算开始（1994 年 7 月 13 日 - 1996 年）`LQ45` 指数回溯至 1994 年 7 月 13 日作为基准日，基值为
    100。初始筛选使用了 1993 年 7 月至 1994 年 6 月的市场数据。结果显示，这 45 只股票涵盖了总市值的 72% 以及常规市场交易额的 72.5%。


    ### 2.5.5 雅加达伊斯兰指数 (JII)


    为了满足对投资感兴趣的投资者，`BEJ` 和 `Danareksa Investment Management` (`DIM`) 推出了一个基于伊斯兰教律法的指数，被称为雅加达伊斯兰指数
    (`JII`)。


    `JII` 于 2000 年 7 月 3 日发布。`JII` 回溯至 1995 年 1 月 1 日作为基准日，基值为 100。


    `JII` 由 30 只符合伊斯兰教法的股票组成。`PT DIM` 的伊斯兰教监督委员会参与了进入 `JII` 股票的标准制定。


    #### 2.5.5.1 不进入 JII 的股票标准


    根据 `PT DIM` 伊斯兰教监督委员会的指示，发行人违反伊斯兰教法的主要活动类型包括：


    * 属于赌博或禁止交易的赌博和游戏业务。

    * 传统金融机构（利息）业务，包括传统银行和保险。

    * 生产、分销及贸易属于哈禁（haram）食品饮料的业务。

    * 生产、分销和/或提供破坏道德且有害物品或服务的业务。


    #### 2.5.5.2 JII 成分股票的确定


    确定进入 `JII` 指数计算的股票筛选顺序如下：


    1. 选择主营业务不违反伊斯兰教原则且上市超过 3 个月的股票池（市值前 10 名的除外）。

    2. 根据最新的年度或中期财务报表选择股票，其负债率率最高为 90%。

    3. 根据过去一年平均市值（`market capitalization`）从大到小的顺序从上述股票中选出 60 只。

    4. 根据过去一年平均交易价值的流动性水平选出 30 只。


    进入 `JII` 的股票对那些只想投资于清真（halal）公司的民众具有很高的吸引力。许多国内外穆斯林投资者投资了这些股票。


    ### 2.5.6 主板指数 (Main Board Index/MBX) 与开发板指数 (Development Board Index)


    2000 年 7 月 13 日，`BEJ` 发布了关于上市领域的新规定，即“双板上市系统”。该系统的实施是为了推动印尼交易所。


    上市板块分类包括：


    * 主板：用于具有良好业绩记录（`track record`）的大型公司。

    * 开发板：用于涵盖尚未满足主板要求但属于有前景类别的公司。此外，开发板也适用于经历重组或业绩恢复的公司。


    为了提供监控进入各板块类别股票的指标，`BEJ` 于 2002 年 4 月 8 日发布了两个新指数：主板指数和开发板指数。这两个指数使用与其他指数类似的计算方法，例如使用市值加权法。主板和开发板指数的计算基准日为
    2001 年 12 月 28 日，基值为 100。当时 24 只股票在主板，28 只股票在开发板。这两个指数的市值占比分别为 62% 和 38%。


    # 软件设计


    ## 软件设计


    本章描述了以软件形式开发的理论和算法的核心内容。软件设计中需要注意的三个方面是数据设计、过程设计和界面设计。为了使其更简单，软件设计被分为以下几个阶段：


    1. 数据设计

    2. 过程设计

    3. 界面设计


    # 数据设计


    软件中使用的数据可以分为三类：输入数据、过程数据和输出数据。这些数据类型将在后续章节中解释。数据处理成信息的流向是必要的。。这些数据流流如图所示：


    ![](img/00031.gif)


    图 3.1 数据信息流


    ### 3.1.1 输入数据


    输入数据是软件运行所需的数据。应用程序中处理的原始数据由输入组成，即 `IHSG` `BEJ` 数据，其类型与用户输入的相同。在成为合适的输入数据之前，数据经过了若干过程：


    #### 3.1.1.1 选择所需数据并转换为 CSV 格式。


    本书中所需的数据是 2005 年的 `IHSG` `BEJ` 数据。这些数据是扩展名为 `txt` 的文件，格式如图 3.2 所示：


    ![](img/0032.jpeg)


    图 3.2 IHSG BEJ 原始数据格式


    文本文件的数量为 238 个，这意味着一年内（2005 年）大约发生了 238 次 `trading time`（交易时间）。


    指数列是指数名称，表格显示共有 15 个指数。每个指数都有其自身的特性，根据其特性和行业划分。

