    在图 2.6 中，红色标记的数据显示其位置比在聚类 A 中更靠近聚类 B。`m` 的值 0.2 表示该数据在 A 中的隶属度。


    现在，利用图形表示，可以构建一个矩阵 `U`，其因子取自隶属函数。该矩阵 `U` 如图 2.7 所示。


    ![](img/00011.gif) ![](img/00012.gif)


    图 2.7 U 矩阵


    行列数取决于数据和聚类的数量。具体来说，如果有一列 `C = 2` 和行 `N`，那么 `C` 是聚类的总数，`N` 是由 `uij` 表示的数据数量。


    上面的示例使用了 K-Means 和 FCM 情况。可以注意到，在第一种（K-means）中，系数始终为 1（单位）。这表明每条数据只属于一个聚类。而 FCM
    的系数可以始终大于 1。这意味着数据可以根据不同的隶属度成为多个聚类的成员。隶属度最高将被作为参考，说明该数据属于哪个聚类的成员。


    在灵活性方面，FCM 优于 K-Means。FCM 更灵活，因为它对数据到每个聚类的隶属具有容差。这在 K-Means 算法中是不存在的。


