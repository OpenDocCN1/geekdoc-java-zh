    然而，根据问题限制，聚类对象是 2005 年的 IHSG 数据，这意味着所需的数据是所有类型 IHSG 且位于“today”列的数据。完成数据选择后，将数据转换为
    `CSV`（逗号分隔值）格式。这样做是为了便于后续转换到数据库。


    ### 3.1.1.2 转换为 Oracle 数据库

    仍处于 `CSV` 格式的输入数据需要转换并存储到数据库中。这有助于应用程序的开发，因为应用程序可以通过数据库访问数据。使用的 DBMS（数据库管理系统）是
    `Oracle Database 10G`。


    ### 3.1.1.3 根据索引类型划分数据

    进入数据库的输入数据尚未经过良好筛选，不同类型的索引数据仍然混合在一起。因此，需要根据每种索引类型进行数据划分。这可以通过为每种索引类型创建 `view`
    来实现。


    ### 3.1.2 处理数据

    处理数据是指在聚类过程中使用的数据，即通过 FCM 聚类算法寻找聚类中心的过程以及寻找最优隶属度的过程。这些数据由输入数据处理并用于生成输出数据。输入数据经过两个阶段的处理：


    #### 1.1.1.1 寻找聚类中心

    在此阶段，对原始输入数据进行处理以生成每个聚类的聚类中心。聚类中心的计算符合模糊 C 均值（Fuzzy C-Means）聚类的寻找中心公式（公式 2.2）。


    #### 1.1.1.1 寻找最优隶属度

    此阶段包括寻找每个原始数据在每个聚类中的隶属度阶段，以及寻找最优隶属度数据的阶段。


    ##### 隶属度寻找阶段

    在此阶段，将聚类中心寻找阶段的处理数据与原始输入数据结合处理。每个聚类的隶属度计算是通过 Fuzzy C-means 聚类方法中的隶属度 `update`
    公式计算的（公式 2.3）。


    ##### 最优隶属度寻找阶段

    在此阶段，寻找最优隶属度阶段的结果数据被查找并存储在一个矩阵中。执行比较算法以获得最优值。


    ### 3.1.3 输出数据

    输出数据是软件在经过聚类结果显示过程后为用户产生的信息。该信息通过 FCM 聚类方法对原始数据进行聚类处理。在此阶段，用户可以清晰地看到数据，因为每个聚类及其输出数据都有不同的颜色。在此阶段，处理后的数据在图表中被着色，因此使用户更容易区分聚类区域。


    # 流程设计


    ## 流程设计

    该软件的设计针对 FCM 聚类所经历的各个阶段。流程如下：


    ![](img/00033.gif)

    图 3.3 流程图


    ### 3.2.1 预处理阶段

    在此阶段，根据用户的要求对输入数据进行处理。输入数据根据用户输入的参数进行处理。用户输入的参数包括：索引类型、聚类数量、精度界限和 `fuzziness`。除了索引类型外，所有这些输入都是
    Fuzzy C-Means 聚类方法的参数条件。索引类型影响将要处理的输入数据。每个输入后续都将被赋予输入要求，以确保进入应用程序的输入是正确的且符合 FCM
    算法要求的。下图将阐述该过程。


    ![](img/00034.gif)

    图 3.4 预处理图


    ### 3.2.2 聚类过程阶段

    聚类过程是即将开发的应用程序的核心过程。该过程的流程如图 3.5 所示。


    ![](img/00035.gif)

    图 3.5 聚类流程图


    #### 3.2.2.1 输入数据生成过程

    该过程是初始化每个数据隶属度的过程。此过程的初始化获取自 `generate random`（随机数）。


    #### 3.2.2.2 聚类中心计算

    在此处，输入数据被处理成若干聚类中心，其数量与用户输入的聚类数量一致。此阶段通过以下公式进行：


    ![](img/00036.gif)

    (3.1)


    #### 3.2.2.3 隶属度计算

    在此处，聚类中心寻找阶段的结果数据与原始索引数据的输入数据相结合处理。通过计算计算每个数据对每个聚类的隶属度，公式如下：


    ![](img/00037.gif)

    (3.2)


    #### 3.2.2.4 停止阶段

    执行决策，即如果数据隶属度的差值小于精度界限（来自预处理阶段），则过程停止；否则继续进入聚类中心计算阶段。


    这符合以下公式：


    ![](img/00038.gif)

    (3.3)


    ### 3.2.5 最优隶属度寻找阶段

    在此阶段，隶属度更新阶段的结果数据通过比较算法进行处理，以获得每个聚类的最优隶属度。然后获取值最大的隶属度。


    ### 3.2.6 根据聚类分组阶段

    在此阶段，最优隶属度寻找阶段的数据将根据其聚类等进行分组。数据将根据具有相似聚类的数据进行分组。分组后续将使用 `sorting` 算法。


    ### 3.2.7 聚类数据图表制作阶段

    根据聚类相似性分组的数据将被创建一个图表，代表特定聚类的数据。该图表后续将是彩色的。这有助于用户区分聚类区域并便于获取信息。


    # 界面设计


    ## 界面设计

    界面设计旨在方便用户运行软件。用户与软件的交互使用鼠标和键盘。用户可以选择所需的 IHSG 类型，输入数据，并点击按钮开始过程，包括生成数据、运行过程以及按步执行（step
    by step）执行过程。除了聚类过程的输入，还有查看数据聚类结果图表的输入。这些输入是 `radio button`，可以根据用户的意愿进行点击。当用户想要查看数据和图表时，可以选择这些选择按钮，选项如下：


    *   IHSG 图表，即用户可以查看数据聚类前的索引随时间图。

    *   隶属度，用户可以查看索引数据对每个聚类的隶属度值及其图表。

    *   聚类数据，用户可以查看数据聚类后的索引随时间图。

    *   排序数据详情，用户可以查看按 `ascending` 排序的聚类索引数据详情。


