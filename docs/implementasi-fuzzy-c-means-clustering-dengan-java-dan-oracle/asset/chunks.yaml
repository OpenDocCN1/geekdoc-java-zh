    Namun sesuai dengan batasan masalah, bahwa yang diklaster adalah data IHSG pada
    tahun 2005, berarti data yang dibutuhkan adalah data dari seluruh jenis IHSG dan
    yang berada pada kolom ‘today’. Setelah pemilihan data selesai, data kemudian
    dikonversi ke bentuk `CSV` (Comma Separated Value). Hal tersebut untuk memudahkan
    konversi ke dalam database.


    ### 3.1.1.2 Konversi ke Database Oracle

    Data masukan yang masih dalam bentuk `CSV` perlu untuk dikonversi dan simpan ke
    dalam database. Hal ini untuk memudahkan dalam pembuatan aplikasi karena aplikasi
    dapat mengakses data melalui database. DBMS (Database Management System) yang
    dipakai adalah `Oracle Database 10G`.


    ### 3.1.1.3 Pemilahan Data Sesuai dengan Jenis Indeks

    Data masukan yang masuk ke dalam database masih belum tersaring dengan baik, masih
    campur antara jenis indeks satu dengan jenis indeks lainnya. Oleh karena itu diperlukan
    pemilahan data yang sesuai dengan jenis indeks masing-masing. Hal ini dapat dilakukan
    dengan membuat `view` untuk masing-masing jenis indeks.


    ### 3.1.2 Data Proses

    Data proses adalah data-data yang digunakan selama proses klasterisasi yaitu proses
    pencarian pusat klaster dengan algoritme pengklasteran FCM dan proses pencarian
    derajat keanggotaan optimal. Data ini diolah dari data masukan dan digunakan untuk
    menghasilkan data keluaran. Data masukan diproses dengan dua tahap, yakni:


    #### 1.1.1.1. Pencarian pusat klaster

    Pada tahap ini data mentah masukan diolah untuk menghasil pusat klaster dari masing-masing
    klaster. Penghitungan pusat klaster sesuai dengan rumus penghitungan pencarian
    pusat klaster pada pengklasteran Fuzzy C-Means (rumus 2.2).


    #### 1.1.1.1. Pencarian derajat keanggotaan optimal

    Pada tahap ini terdiri atas fase pencarian derajat keanggotaan tiap data mentah
    pada tiap klaster dan fase pencarian data derajat keanggotaan optimal.


    ##### Fase pencarian derajat keanggotaan

    Pada tahap ini, data proses hasil proses pencarian pusat klaster diolah dengan
    data mentah masukan. Penghitungan derajat keanggotaan masing-masing klaster dihitung
    dengan rumus `update` derajat keanggotaan pada metode pengklasteran Fuzzy C-means
    (rumus 2.3).


    ##### Fase pencarian derajat keanggotaan optimal

    Pada tahap ini, data hasil pada fase pencarian derajat keanggotaan optimal dicari
    dan disimpan dalam sebuah matriks. Dilakukan algoritme perbandingan untuk mendapatkan
    yang optimal.


    ### 3.1.3 Data Keluaran

    Data keluaran adalah informasi yang dihasilkan oleh perangkat lunak untuk pengguna
    setelah melalui proses penampilan data hasil klasterisasi. Informasi didapat dari
    proses pengklasteran data mentah dengan metode pengklasteran FCM. Pada tahap ini,
    data dapat dilihat oleh pengguna dengan jelas karena ada perbedaan warna untuk
    masing-masing klaster dan data keluaran didalamnya. Pada tahap ini data yang telah
    diproses diberikan warna pada grafik, sehingga pengguna lebih mudah membedakan
    daerah klaster.


    # Perancangan Proses


    ## Perancangan Proses

    Perangkat lunak ini didesain dengan penyesuaian terhadap tahapan-tahapan yang
    dilalui oleh pengklasteran FCM. Berikut ini adalah alurnya:


    ![](images/00033.gif)

    Gambar 3.3 Diagram Alur Proses


    ### 3.2.1 Fase Preprocessing

    Pada tahap ini, data masukan diolah sesuai dengan keinginan pengguna. Data masukan
    diproses sesuai dengan parameter yang di-input-kan pengguna. Parameter yang di-input-kan
    pengguna yakni, jenis indeks, jumlah klaster, batas ketelitian, dan `fuzziness`.
    Semua input tersebut merupakan syarat parameter metode pengklasteran Fuzzy C-Means
    kecuali jenis indeks. Jenis indeks mempengaruhi data masukan yang akan diolah.
    Tiap masukkan nantinya akan diberi persyaratan masukan sehingga masukan yang masuk
    ke aplikasi adalah masukan yang benar dan sesuai dengan masukan yang disyaratkan
    oleh algoritme FCM. Diagram dibawah ini akan menjelaskan proses tersebut.


    ![](images/00034.gif)

    Gambar 3.4 Diagram Preprocessing


    ### 3.2.2 Fase Proses Klasterisasi

    Proses klasterisasi adalah proses inti dari aplikasi yang nantinya akan dibuat.
    Proses ini memiliki alur seperti Gambar 3.5 berikut ini.


    ![](images/00035.gif)

    Gambar 3.5 Diagram Alir Proses Klasterisasi


    #### 3.2.2.1 Proses Generate Data Input

    Proses ini merupakan proses untuk inisialisasi derajat keanggotaan tiap data.
    Inisialisasi dari proses ini didapatkan dari bilangan `generate random` (bilangan
    acak).


    #### 3.2.2.2 Komputasi Pusat Klaster

    Disini data masukan diolah sehingga menjadi beberapa pusat klaster yang jumlahnya
    sesuai dengan jumlah klaster yang diinput-kan oleh pengguna. Fase ini melalui
    tahap rumus berikut ini:


    ![](images/00036.gif)

    (3.1)


    #### 3.2.2.3 Komputasi Derajat Keanggotaan

    Disini data hasil proses pada fase pencarian pusat klaster diolah dengan data
    masukan berupa data mentah indeks. Melakukan komputasi untuk menghitung derajat
    keanggotaan masing-masing data terhadap klaster, dengan rumus sebagai berikut:


    ![](images/00037.gif)

    (3.2)


    #### 3.2.2.4 Fase Pemberhentian

    Melakukan pengambilan keputusan, yakni bila terdapat nilai selisih derajat keanggotaan
    data yang lebih kecil dari batas ketelitian (dari fase preprocessing) maka proses
    akan berhenti, bila tidak maka akan dilanjutkan ke tahap komputasi pusat klaster.


    Hal tersebut sesuai dengan rumus sebagai berikut:


    ![](images/00038.gif)

    (3.3)


    ### 3.2.5 Fase Pencarian Derajat Keanggotaan Optimal

    Disini data hasil proses pada fase update derajat keanggotaan diolah dengan algoritme
    perbandingan untuk mendapatkan derajat keanggotaan optimal untuk masing-masing
    klaster. Kemudian diambil derajat keanggotaan dari data yang paling tinggi nilainya.


    ### 3.2.6 Fase Pengelompokkan Berdasarkan Klaster

    Pada fase ini data hasil dari fase pencarian derajat keanggotaan optimal akan
    dikelompokkan sesuai dengan persamaan klasternya. Data akan dikelompokkan sesuai
    dengan data yang lainnya yang memiliki kemiripan klaster. Pengelompokkan nanti
    menggunakan algoritme `sorting`.


    ### 3.2.7 Fase Pembuatan Grafik Data Terklaster

    Data yang sudah mengelompok berdasarkan kemiripan klaster dibuatkan sebuah grafik
    yang merupakan representasi dari data pada klaster tertentu. Grafik ini nantinya
    akan dibuat dengan berwarna. Hal ini untuk memudahkan pengguna dalam membedakan
    daerah klaster dan memudahkan mendapatkan informasi.


    # Perancangan Antarmuka


    ## Perancangan Antarmuka

    Perancangan antarmuka dimaksudkan untuk memudahkan pengguna dalam menjalankan
    perangkat lunak. Interaksi antar pengguna dengan perangkat lunak menggunakan mouse
    dan keyboard. Pengguna bisa memilih jenis IHSG yang diinginkan, memasukkan data
    input serta menekan tombol untuk memulai proses baik untuk melakukan generate
    maupun untuk melakukan run proses serta untuk melakukan proses secara step by
    step (proses perlangkah). Selain input untuk proses klasterisasi, juga terdapat
    input untuk melihat grafik hasil dari pengklasteran data. Input tersebut berupa
    `radio button` yang bisa di klik sesuai dengan keinginan pengguna. Radio button
    tersebut bisa dipilih bila pengguna bermaksud melihat data dan grafik, pilihan-pilihannya
    adalah sebagai berikut:


    *   Grafik IHSG, yakni pengguna bisa melihat grafik poin indeks terhadap waktu
    sebelum data indeks klaster.

    *   Derajat keanggotaan, pengguna bisa melihat nilai keanggotaan data indeks terhadap
    masing-masing klaster beserta grafiknya.

    *   Data terklaster, pengguna bisa melihat grafik poin indeks terhadap waktu setelah
    data indeks dikaster.

    *   Detail data tersortir, pengguna bisa melihat data indeks terklaster secara
    detail yang sudah tersortir secara `ascending`.

