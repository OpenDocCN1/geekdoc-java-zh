    \ implementasi dari perancangan data yang ada pada bab 3\\. Seperti pada perancangan\
    \ data, implementasi data dibagi menjadi 3 yaitu data masukan, data proses dan\
    \ data keluaran.  \n\n### 4.2.1 Data Masukan\n\nData masukan yang dalam bentuk\
    \ teks, diproses dengan melakukan konversi ke dalam bentuk file CSV (Comma Separated\
    \ Value). Data yang dikonversi adalah data yang diperlukan saja. Konversi ini\
    \ dilakukan agar data dapat lebih mudah untuk dimasukkan ke dalam suatu database.\
    \ Pemilihan ke dalam bentuk CSV karena data dalam bentuk seperti itu bisa dikonversi\
    \ ke dalam beberapa database, artinya beberapa database mendukung bentuk tersebut\
    \ dalam proses import ke database tersebut.\n\nData masukan yang dibutuhkan dipindahkan\
    \ ke dalam database (Oracle Database  10G), dengan beberapa atribut berikut ini:\n\
    \n![](images/00040.gif)\n\nGambar 4.1 Atribut Tabel IHSG BEJ\n\nDDL (Data Definition\
    \ Language) dari tabel yang akan dibuat adalah sebagai berikut:\n\n![](images/00041.gif)\n\
    \nGambar 4.2 Create Table IHSG BEJ\n\nBerikut ini adalah beberapa data setelah\
    \ dilakukan pemindahan ke dalam database Oracle.\n\n![](images/00042.gif)\n\n\
    \          Gambar 4.3 Data IHSG BEJ Oracle\n\nAgar efisien dalam menggunakan waktu\
    \ dalam pem-filter-an data yang benar pada master data saham maka dibuat beberapa\
    \ view yang hasilnya adalah data yang dibutuhkan yakni IHSG yang sesuai dengan\
    \ jenis masing-masing indeks. View adalah tabel secara virtual/bayangan atau query\
    \ yang tersimpan dan tidak menyimpan data secara fisik View merupakan bagian dari\
    \ DDL(Data Definition Language).\n\nView dari masing-masing jenis indeks memiliki\
    \ beberapa atribut sebagai berikut:\n\n![](images/00043.gif)\n\nGambar 4.4 Atribut-atribut\
    \ View\n\nBerikut ini adalah beberapa jenis view yang digunakan untuk masing –masing\
    \ IHSG:\n\n*   VIEW_COMP2\n\nView ini digunakan untuk mendapatkan IHSG BEJ yang\
    \ berjenis composite index\n\n![](images/00044.gif)\n\nGambar 4.5 View Composite\
    \ Index\n\n*   VIEW_AGRI\n\nView ini digunakan untuk mendapatkan IHSG BEJ yang\
    \ termasuk dalam indeks sektoral yakni sektor pertanian.\n\n![](images/00045.gif)\n\
    \n                Gambar 4.6 View Agriculture Index\n\n*   VIEW_MINING\n\nView\
    \ ini digunakan untuk mendapatkan IHSG BEJ yang termasuk dalam indeks sektoral\
    \ yakni sektor pertambangan.\n\n![](images/00046.gif)\n\n             Gambar 4.7\
    \ View Mining Index\n\n*   VIEW_BASIC\n\nView ini digunakan untuk mendapatkan\
    \ IHSG BEJ yang termasuk dalam indeks sektoral yakni sektor industri dasar dan\
    \ kimia.\n\n![](images/00047.gif)\n\n                Gambar 4.8 View Basic Industry\
    \ Index\n\n*   VIEW_MISCELL\n\nView ini digunakan untuk mendapatkan IHSG BEJ yang\
    \ termasuk dalam aneka industri.\n\n![](images/00048.gif)\n\n         Gambar 4.9\
    \ View Miscellanous Index\n\n*   VIEW_CONSUME\n\nView ini digunakan untuk mendapatkan\
    \ IHSG BEJ yang termasuk dalam indeks sektoral yakni sektor industri barang konsumsi.\n\
    \n![](images/00049.gif)\n\n          Gambar 4.10 View Consumer Good Index\n\n\
    *   VIEW_FINANCE\n\nView ini digunakan untuk mendapatkan IHSG BEJ yang termasuk\
    \ dalam indeks sektoral yakni sektor keuangan.\n\n![](images/00050.gif)\n\n  \
    \         Gambar 4.11 View Finance Index\n\n*   VIEW_INFRA\n\nView ini digunakan\
    \ untuk mendapatkan IHSG BEJ yang termasuk dalam indeks sektoral yakni sektor\
    \ transportasi dan infrastruktur.\n\n![](images/00051.gif)\n\n             Gambar\
    \ 4.12 View Infrastructure Index\n\n*   VIEW_PROPERTY\n\nView ini digunakan untuk\
    \ mendapatkan IHSG BEJ yang termasuk dalam indeks sektoral yakni sektor properti\
    \ dan real estate.\n\n![](images/00052.gif)\n\n                Gambar 4.13 View\
    \ Property Index\n\n*   VIEW_TRADE\n\nView ini digunakan untuk mendapatkan IHSG\
    \ BEJ yang termasuk dalam indeks sektoral yakni sektor perdagangan, jasa dan investasi.\n\
    \n![](images/00053.gif)\n\n           Gambar 4.14 View Trade Index\n\n*   VIEW_LQ\n\
    \nView ini digunakan untuk mendapatkan IHSG BEJ yang termasuk dalam LQ45.\n\n\
    ![](images/00054.gif)\n\n             Gambar 4.15 View LQ45 Index\n\n*   VIEW_MAIN\n\
    \nView ini digunakan untuk mendapatkan IHSG BEJ yang termasuk dalam indeks papan\
    \ utama.\n\n![](images/00055.gif)\n\n           Gambar 4.16 View Main Board Index\n\
    \n*   VIEW_ISLAM\n\nView ini digunakan untuk mendapatkan IHSG BEJ yang termasuk\
    \ dalam JII.\n\n![](images/00056.gif)\n\n                     Gambar 4.17 View\
    \ Jakarta Islamic Index\n\n*   VIEW_DEVELOP\n\nView ini digunakan untuk mendapatkan\
    \ IHSG BEJ yang termasuk dalam indeks papan pengembangan.\n\n![](images/00057.gif)\n\
    \n                    Gambar 4.18 View Development Board Index\n\n### 4.2.2 Data\
    \ Proses\n\nImplementasi dari perancangan data proses adalah membuat suatu matriks\
    \ untuk menampung isi dari dari data masukan setelah di proses. Data masukan diproses\
    \ dengan dua tahap, yakni:\n\n1\\.  Pencarian  pusat klaster\n\nPusat klaster\
    \ disimpan dalam sebuah matriks satu dimensi setelah proses pencarian matriks\
    \ dilakukan. Matriks ini jumlah barisnya sesuai dengan jumlah klaster yang diinputkan\
    \ oleh pengguna. Matriks ini dinamakan dengan clustercentroid.\n\n2\\.   Pencarian\
    \ derajat keanggotaan optimal\n\nPada tahap ini terdiri atas fase pencarian derajat\
    \ keanggotaan tiap data masukan pada tiap klaster dan fase pencarian data derajat\
    \ keanggotaan optimal.\n\n          a. Fase pencarian derajat keanggotaan\n\n\
    Pada tahap ini, data proses hasil proses pencarian pusat klaster diolah dengan\
    \ data masukan. Hasil dari proses ini dimasukkan kedalam matriks dua dimensi yang\
    \ masing-masing indeksnya menunjukkan indeks dari data dan indeks dari klaster.\
    \ Matriks ini berisi derajat keanggotaan tiap data pada klaster tertentu. Matriks\
    \ ini diberi nama dengan matriks u1.\n\n1.  Fase pencarian derajat keanggotaan\
    \ optimal\n\nPada tahap ini, data hasil pada fase pencarian derajat keanggotaan\
    \ optimal dicari dan disimpan dalam sebuah matriks. Matriks ini merupakan matriks\
    \ satu dimensi yang isinya adalah indeks dari klaster yang derajatnya optimal.\n\
    \n### 4.2.3 Data Keluaran\n\nData keluaran adalah informasi yang dihasilkan oleh\
    \ perangkat lunak untuk pengguna. Data yang sudah terproses sehingga mendapatkan\
    \ keanggotaan pada klaster tertertentu dibuat tampilan grafiknya dengan warna\
    \ yang berbeda untuk tiap klaster. Hal ini ada pada metode createDataset yang\
    \ menampung data hasil proses klasterisasi.\n\nCreated with the Personal Edition\
    \ of HelpNDoc: [Benefits of a Help Authoring Tool](http://www.helpauthoringsoftware.com)\n\
    \n# Implementasi Proses\n\n## Implementasi Proses\n\n       Sub bab ini menjelaskan\
    \ tentang implementasi dari perancangan proses yang ada pada bab 3.\n\n### 4.3.1\
    \ Fase Preprocessing  "
