    analisis dari output.


    ### 5.2.2.1 Input Parameter


    Sesuai dengan skenario di atas, harus di-input-kan beberapa parameternya. Input
    parameter yang harus dimasukkan adalah:


    `Jumlah Cluster = 6` ; `Fuzziness (m) = 2`; `Batas ketelitian = 0.03`


