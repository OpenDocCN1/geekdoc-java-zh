    # Cover


    IMPLEMENTASI FUZZY C-MEANS CLUSTERING DENGAN JAVA DAN ORACLE

    oleh Eko Heryanto


    ![](images/00001.jpeg)


    # Abstrak


    Benchmarking, yaitu proses memberi batasan yang jelas antara poin Indeks Harga
    Saham Gabungan Bursa Efek Jakarta (IHSG BEJ), adalah suatu hal yang penting untuk
    menentukan dan mengetahui poin indeks mana yang termasuk di dalam kelompok yang
    bisa dikatakan tinggi, rendah atau rata-rata. Hal ini diperlukan sebagai suatu
    standar bahwa poin indeks tertentu akan masuk ke dalam kelompok yang mana. Tanpa
    benchmarking, permasalahan akan timbul seiring dengan adanya pelbagai persepsi
    manusia yang tentu saja berbeda dalam memberikan penilaian terhadap poin indeks
    (berdasarkan perkiraan dari masing-masing individu), apakah poin indeks tertentu
    masuk dalam kategori tinggi, rendah atau rata-rata?. Tidak ada batasan yang jelas
    antara poin indeks satu dengan yang lainnya. Fuzzy C-Means, yaitu suatu metode
    untuk mengklaster set data menjadi beberapa kelompok data dengan membagi rata
    set data, menjadi salah satu metode untuk melakukan benchmarking terhadap IHSG
    BEJ. Fuzzy C-Means -yang didasari dengan logika fuzzy- mengelompokkan data berdasarkan
    jarak antara centroid dengan data. Setiap data memiliki derajat keanggotaan terhadap
    tiap klaster. Data dengan derajat keanggotaan paling tinggilah yang akan menjadi
    anggota dari klaster dimana derajat keanggotaan tersebut tertuju.


    Dalam Buku ini, akan diimplementasikan Fuzzy C-Means Clustering yang melakukan
    benchmarking terhadap IHSG BEJ tahun 2005 sehingga memudahkan pengguna untuk melakukan
    analisis data teknikal historis dari data tersebut.


    Dari hasil ujicoba terhadap beberapa jenis IHSG BEJ, didapatkan suatu kesimpulan
    bahwa benchmarking bisa dilakukan terhadap pelbagai jenis IHSG BEJ dan bisa didapatkan
    beberapa informasi yang berguna bila pola IHSG BEJ dianalisis lebih dalam dan
    menghubungkannya dengan variabel waktu.


    Kata Kunci: Benchmarking, Fuzzy C-Means Clustering, IHSG, IHSG BEJ.


    # Kata Pengantar


    Buku ini bukanlah hasil karya yang sempurna, meskipun begitu penyusun berharap
    semoga masih bisa bermanfaat bagi pembaca. Segala tegur sapa dari para pembaca
    akan penyusun sambut dengan baik demi kemajuan ilmu pengetahuan khususnya di bidang
    informatika.


    Penyusun mengucapkan selamat membaca, semoga bermanfaat bagi seluruh umat manusia.


    Sidoarjo,13 September 2016

    Eko Heryanto


    # Teori Penunjang


    # Benchmarking


    ## Benchmarking


    Sebelum melangkah lebih jauh dalam pengerjaan buku ini, mari pertajam konsep yang
    ada dengan mengetahui definisi dari benchmarking, kebenaran benchmark sebagai
    suatu standar?. Berikut ini adalah definisi dari benchmark dari pelbagai sumber:


    * [www.askoxford.com](http://www.askoxford.com)


    Benchmark adalah (1) a standar or point of reference, (2) a surveyor’s mark cut
    in a wall and used as a reference point in measuring altitudes.


    Dari sumber diatas dapat diperoleh bahwa benchmark adalah (1) sebuah standar atau
    batas referansi (2) Sebuah tanda potongan pada tembok sebagai batas referansi
    dalam pengukuran ketinggian.


    * [www.encarta.msn.com](http://www.encarta.msn.com)


    Benchmark adalah (1) standard: a standard against which something can be measured
    and assessed, (2) test of computer performance: a standard test to measure the
    performance of computer hardware or software.


    Sumber diatas menyatakan definisi dari benchmark, yakni (1) standar: sebuah standar
    pada sesuatu yang dapat diukur dan dinilai, (2) tes dari kinerja komputer: sebuah
    standar pengujian untuk mengukur kinerja perangkat keras dan perangkat lunak komputer.


    * [http://www.investorwords.com](http://www.investorwords.com)


    Benchmark is a standard, used for comparison. For example, the Nasdaq may be used
    as a benchmark against which the performance of a technology stock is compared.


    Pengertian benchmark menurut `http://www.investorwords.com` adalah sebuah standar,
    digunakan untuk perbandingan. Contohnya, `Nasdaq` bisa digunakan sebagai `benchmark`
    terhadap kinerja `IHSG BEJ` yang dibandingkan.


    Dari definisi diatas didapatkan beberapa poin penting dari benchmark, yakni standar,
    sesuatu yang bisa diukur dan dinilai, digunakan untuk perbandingan. Bila digabungkan
    poin-poin tersebut maka definisi benchmark adalah sebuah standar/baku dari sesuatu
    yang bisa diukur dan dinilai yang digunakan untuk perbandingan dengan sesuatu.
    Sedangkan benchmarking sendiri adalah suatu proses untuk melakukan benchmark.


    Dari penjelasan diatas, maka pengertian benchmarking IHSG BEJ adalah suatu proses
    untuk melakukan standarisasi yang digunakan sebagai penilaian terhadap suatu poin
    sehingga dapat membandingkan nilai dari poin IHSG BEJ satu dengan yang lainnya.


    # Clustering


    ## Clustering atau Pengklasteran


    Pengklasteran adalah proses mengelompokkan data ke dalam beberapa kelas atau klaster
    sehingga objek dan sebuah klaster memiliki similaritas/persamaan yang tinggi jika
    dibandingkan dengan yang lainnya, namun berbeda (dissimilar) dengan objek di lain
    klaster. Umumnya, `distance measure` (ukuran jarak) yang digunakan dalam pengklasteran.
    Pengklasteran bisa digunakan dalam pelbagai bidang, misalnya data mining, statistik,
    biologi, dan machine learning.


    Klaster adalah sebuah kumpulan dari objek data yang memiliki persamaan (similaritas)
    dengan yang lainnya dalam klaster yang sama dan tidak/kurang memiliki persamaan
    (dissimilaritas) kepada objek yang ada di klaster lain.


    Analisis dalam pengklasteran adalah sebuah hal penting dalam aktivitas manusia.
    Semasa muda, manusia belajar tentang perbedaan karakter antara kucing dan anjing,
    atau antara hewan dan tumbuhan, yang secara berulang-ulang sehingga akan timbul
    suatu skema pengklasteran dibawah sadar. Analisis klaster telah digunakan secara
    luas dalam banyak aplikasi.


    Ada beberapa aplikasi dari pengklasteran, berikut ini contohnya dalam pelbagai
    bidang:


    * Bisnis, pengklasteran bisa membantu pemasar mendapatkan grup yang berbeda dalam
    basis pelanggan mereka dan mengkarakteristikkan grup pelanggan berdasarkan pada
    pola pembelian.

    * Biologi, bisa digunakan untuk memperoleh taksonomi dari tanaman dan hewan, kategori
    gen dengan fungsionalitas yang sama, dan memperoleh informasi struktur yang ada
    di dalam suatu populasi.

    * Pengklasteran juga bisa membantu dalam mengidentifikasi daerah yang sama untuk
    pertanian yang dapat dimasukkan kedalam database observasi bumi.

    * Mengidentifikasi kumpulan dari rumah-rumah dalam sebuah kota berdasarkan tipe
    rumahnya, harga dan lokasi geografis.

    * Membantu dalam mengklasifikasikan dokumen-dokumen pada web untuk pencarian informasi.


    # Fuzzy C-Means Clustering


    ## Fuzzy C-Means Clustering


    Fuzzy C-Means (FCM) adalah sebuah metode untuk mengklaster data, membuat satu
    data menjadi anggota dua klaster atau lebih. Metode ini dibuat oleh `Dunn` pada
    1973 dan dikembangkan oleh `Bezdek` pada tahun 1981. FCM dibuat berdasarkan minimisasi
    dari fungsi objektif dibawah ini:


