    Apa yang bisa dilihat pada Gambar 5.29? Gambar itu memberikan informasi derajat
    keanggotaan tiap data pada klaster tertentu. Dari derajat keanggotaan tersebut
    bisa didapatkan suatu kecenderungan dari poin indeks tertentu. Contohnya pada
    data 303,318. Data tersebut memiliki derajat keanggotaan tertinggi ada pada klaster
    0 yang bernilai 0,994 sedangkan derajat keanggotaan tertinggi kedua ada pada klaster
