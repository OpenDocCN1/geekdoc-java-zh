    `PT Bursa Efek Surabaya`）给出特定价格。投资者对该索引点进行买卖操作。投资者从该索引点的买卖差价中获利。名称为 `LQ Futures`
    和 `Mini LQ Futures`。`LQ Future` 于 2001 年 8 月 13 日推出，是交易所特别是 `future` 索引 `derivative`
    产品的先驱。`LQ Futures` 使用 `LQ45`  `IHSG BEJ` 作为 `underlying`。


