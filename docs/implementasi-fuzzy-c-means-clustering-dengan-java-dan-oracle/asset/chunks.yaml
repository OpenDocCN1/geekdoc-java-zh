    0,5`.

    *   Seseorang yang berusia 50 tahun, termasuk dalam himpunan Tua dengan `TUA[50]
    = 0,25; namun dia juga termasuk dalam himpunan Parobaya dengan `PAROBAYA[50] =
    0,5`.

