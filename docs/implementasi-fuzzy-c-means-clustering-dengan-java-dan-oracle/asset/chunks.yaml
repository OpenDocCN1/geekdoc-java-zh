    # Skenario 4


    ## Skenario Uji Coba 4


    Pada uji coba ini diberikan suatu skenario yang ditujukan untuk mengetahui fungsionalitas
    aplikasi yang dibuat.


    ### 5.5.1 Garis Besar Skenario 4


    Terdapat suatu studi kasus dalam sudut pandang pengguna yang akan melakukan benchmarking
    terhadap nilai IHSG BEJ. Kali ini yang di ujicoba adalah IHSG BEJ yang jenisnya
    JII (Jakarta Islamic Index). Saham-saham yang masuk ke dalam JII memiliki daya
    tarik yang tinggi bagi masyarakat yang memiliki niat untuk melakukan investasi
    hanya pada perusahaan yang bersifat halal. Banyak investor baik dari dalam maupun
    dari luar negeri yang beragama Islam yang berinvestasi pada saham-saham tersebut.
    Perusahaan yang sahamnya termasuk dalam JII ada pada lampiran E.


    Tabel 5.5 Kelompok Skenario 4


    | Kelompok /Kelas | Keterangan |


    | Kelas A | Kelas ini berarti terdapat nilai-nilai IHSG JII dengan poin yang sangat
    tinggi yang berarti pasar dalam keadaan Bullish. |


    | Kelas AB | Kelas ini berarti terdapat nilai-nilai IHSG JII yang masih sangat
    baik, perdagangan masih dalam keadaan rata-rata atas. |


    | Kelas B | Kelas ini berarti terdapat nilai-nilai IHSG JII yang masih dalam keadaan
    baik, perdagangan masih dalam keadaan rata-rata. |


    | Kelas BC | Kelas ini berarti terdapat nilai-nilai IHSG JII yang masih dalam
    keadaan cukup baik, perdagangan masih dalam keadaan rata-rata bawah. |


    | Kelas C | Kelas ini berarti terdapat nilai-nilai IHSG JII yang masih dalam keadaan
    cukup, dan cenderung untuk terpuruk, dana kan ke dalam kondisi pasar Bearish.
    |


    | Kelas D | Kelas ini berarti terdapat nilai-nilai IHSG JII dengan poin yang sangat
    rendah dan terpuruk, kondisi berarti pasar dalam keadaan Bearish. |


    ### 5.5.2  Pelaksanaan Skenario


    Uji coba dilaksanakan dengan melakukan apa yang telah dituliskan dalam skenario
    diatas. Pelaksanaan skenario ini akan melalui beberapa tahap, yakni tahap input
    parameter, proses benchmarking, melihat output dari benchmarking dan melakukan
    analisis dari output. Masing-masing tahapan tersebut akan dijelaskan lebih lanjut
    pada sub bahasan yang ada dibawah ini.


