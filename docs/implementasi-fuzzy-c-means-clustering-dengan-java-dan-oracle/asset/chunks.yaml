    ### 2.5.1 行业指数


    行业指数是 IHSG 的一部分。BEJ 上市的所有公司根据 BEJ 规定的定的行业分类分为 9 个部门，称为 `JASICA`（雅加达交易所工业分类）。这九个部门是：


    A. 主要部门（产生原材料的行业）


    * `部门 1`: 农业。

    * `部门 2`: 矿业。


    B. 第二部门（加工/制造业）


    * `部门 3`: 基础工业与化工。

    * `部门 4`: 综合工业。

    * `部门 5`: 消费品工业。


    C. 第三部门（服务业）


    * `部门 6`: 产房地产。

    * `部门 7`: 交通与基础设施。

    * `部门 8`: 金融。

    * `部门 9`: 贸易、服务与投资。


    除了这九个部门外，BEJ 还计算了一个制造业指数，代表了归类为第 3 部门、第 4 部门和第 5 部门的股票集合。


