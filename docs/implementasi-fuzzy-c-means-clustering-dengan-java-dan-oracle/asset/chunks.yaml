    data terklaster yang dihubungkan dengan variabel waktu (saat terjadinya indeks
    berlangsung). Tiap klaster dibedakan dengan warna. Pada grafik tersebut juga terlihat
    centroid dari masing-masing klaster. Gugusan titik yang berwarna merah adalah
    klaster C, biru adalah klaster B, sedangkan hijau adalah klaster C.


