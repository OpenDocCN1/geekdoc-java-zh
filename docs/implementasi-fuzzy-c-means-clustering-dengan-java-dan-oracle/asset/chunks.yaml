    图 5.46 场景 5 指类型输入


    #### 5.6.2.2 基准测试处理


    执行基准测试需要经过几个过程。这些过程是 `FCM` 的阶段。首先，通过点击 `Generate` 按钮初始化隶属度，这会将变量 `derajat keanggotaan`
    初始化为随机值。


