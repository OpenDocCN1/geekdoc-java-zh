    # Skenario 5


    ## Skenario Uji Coba 5


    Pada uji coba ini diberikan suatu skenario yang ditujukan untuk mengetahui fungsionalitas
    aplikasi yang dibuat. Terdapat sebuah skenario yang diujikan pada aplikasi ini.


    ### 5.6.1 Garis Besar Skenario 5


    Suatu studi kasus dilakukan pada sudut pandang pengguna yang akan melakukan benchmarking
    sebagai alat bantu dalam pengambilan keputusan dan atau untuk melakukan suatu
    laporan terhadap nilai `IHSG BEJ` jenis `Main Board` pada tahun 2005.


    `IHSG BEJ` jenis `Main Board` dibagi ke dalam kelompok-kelompok/kelas-kelas berikut
    ini:


    Tabel 5.6 Kelompok Skenario 5


    | Kelompok /Kelas | Keterangan |

    | :--- | :--- |

    | Kelas A | Kelas ini berarti terdapat nilai-nilai `IHSG BEJ Main Board` dengan
    poin yang sangat tinggi yang berarti pasar dalam keadaan Bullish. |

    | Kelas B | Kelas ini berarti terdapat nilai-nilai `IHSG BEJ Main Board` yang
    masih dalam keadaan baik, perdagangan masih dalam keadaan rata-rata. |

    | Kelas C | Kelas ini berarti terdapat nilai-nilai `IHSG BEJ Main Board` dengan
    poin yang sangat rendah dan terpuruk, kondisi berarti pasar dalam keadaan Bearish.
    |


    ### 1. Pelaksanaan Skenario 5


    Uji coba dilaksanakan dengan melakukan apa yang telah dituliskan dalam skenario
    diatas. Pelaksanaan skenario ini akan melalui beberapa tahapan, yakni tahap input
    parameter, proses benchmarking, melihat output dari benchmarking dan melakukan
    analisis dari output.


    #### 5.6.2.1 Input Parameter


    Sesuai dengan skenario diatas, harus di-input-kan beberapa parameternya. Input
    parameter yang harus dimasukkan adalah:


    `Jumlah Cluster = 3`; `Fuzziness (m) = 2`; `Batas ketelitian = 0.03`


    ![](images/00116.gif)

    Gambar 5.45 Input Parameter Skenario 5


    Pilihlah ”Main Board” pada combo box disamping label Nama Index. Hal ini karena
    akan dilakukan benchmarking terhadap `IHSG BEJ` jenis ”Main Board” Hal itu bisa
    dilihat pada Gambar 5.46 berikut ini.


    ![](images/00117.jpeg)

    Gambar 5.46 Input Jenis Index Skenario 5


    #### 5.6.2.2 Proses Benchmarking


    Ada beberapa proses yang harus dilalui untuk melakukan benchmarking. Proses ini
    merupakan tahap-tahap dari `FCM`. Pertama, inisialisasi derajat keanggotaan dengan
    melakukan klik pada tombol `Generate`, yang nantinya akan melakukan inisialisasi
    pada variabel `derajat keanggotaan` dengan nilai random.


    ![](images/00118.jpeg)

    Gambar 5.47 Generate Data Skenario 5


    Kemudian klik tombol `Run` untuk melakukan proses selanjutnya, yakni mencari pusat
    klaster dan mencari derajat keanggotaan masing-masing data terhadap masing-masing
    klaster serta melakukan update derajat keanggotaan secara terus menerus hingga
    batas ketelitiannya tercapai.


    ![](images/00119.jpeg)

    Gambar 5.48 Run Proses Skenario 5


    ### 1. Output Benchmarking


    Setelah beberapa tahapan dilalui dalam proses benchmarking, dapat dilihat hasilnya
    dari representasi grafik pada Gambar 5.49 berikut ini.


    ![](images/00120.jpeg)

    Gambar 5.49 Derajat Keanggotaan Skenario 5


    Grafik tersebut adalah grafik data `IHSG BEJ Main Board` terhadap derajat keanggotaannya
    kepada tiap klaster. Beberapa warna yang ada merepresentasikan tiap klaster. Didalam
