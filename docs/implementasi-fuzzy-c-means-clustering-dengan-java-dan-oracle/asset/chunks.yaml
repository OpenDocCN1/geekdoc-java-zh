    `random` yang sudah tersedia.


    ![](images/00061.gif)


    #### 4.3.2.2 Komputasi Pusat Klaster


    Berikut ini adalah kode program untuk mendapatkan pusat klaster seperti pada rumus
    pengklasteran dengan `Fuzzy C-Means`.


    ![](images/00062.gif)


    #### 4.3.2.3 Komputasi Derajat Keanggotaan


    Derajat keanggotaan tiap data perlu untuk dihitung nilainya untuk masing-masing
    klaster. Tiap data selalu melakukan update derajat keanggotaan hingga kondisi
    pemberhentian terpenuhi. Berikut ini adalah kode program dari rumus mendapatkan
    derajat keanggotaan data pada masing-masing klaster.


    ![](images/00063.gif)


    #### 4.3.2.4 Fase Pemberhentian


    Berikut ini adalah kode program dari fase pemberhentian seperti yang dijelaskan
    pada bab 3.


    ![](images/00064.gif)


    ### 4.3.3 Fase Pencarian Derajat Keanggotaan Optimal


    Fase ini adalah fase untuk mendapatkan data dengan derajat keanggotaan optimal.
    Berikut ini adalah kode program dari fase ini. Pada fase ini dilakukan sebuah
    algoritme perbandingan. Algoritme ini melakukan seleksi terhadap data pada suatu
    matriks yang memiliki derajat keanggotaan paling tinggi. Jikalau derajat keanggotaan
    paling tinggi didapatkan maka indeks matriks dari klaster akan disimpan sebagai
    nilai pengembaliannya. Nilai pengembalian ini yang berguna untuk proses selanjutnya.


    ![](images/00065.gif)


    ### 4.3.4 Fase Pengelompokkan Berdasarkan Klaster


    Kode program untuk mengelompokkan data berdasarkan klasternya adalah sebagai berikut:


    ![](images/00066.gif)


    ### 4.3.5 Fase Pembuatan Grafik Data Terklaster


    Ada beberapa grafik dalam aplikasi pada buku ini. Masing-masing akan dijelaskan
    berikut ini.


    #### 4.3.5.1 Kelas `hariFrame`


    Kelas `hariFrame` berfungsi untuk menampilkan data hasil dari klasterisasi. Kelas
    ini akan menampilkan derajat keangotaan masing-masing data yang sudah terklaster
    beserta tanggal.


    ![](images/00067.gif)


    #### 4.3.5.2 Kelas `chartFrame`


    Kelas `chartFrame` berfungsi untuk menampilkan grafik dari data IHSG BEJ yang
    masih belum terklaster. Kelas ini terdiri dari 3 hal utama, yakni:


    - `createDataSet`: untuk menampung data yang akan digunakan.

    - `createChart`: untuk membuat grafik dari data yang tertampung dalam `DataSet`.

    - `createDemoPanel`: sebagai tempat dari grafiknya.


    ![](images/00068.gif)


    #### 4.3.5.3 Kelas `markerFrame`


    Kelas `markerFrame` berfungsi untuk menampilkan grafik dari data-data IHSG BEJ
    yang telah terklaster. Kelas ini memiliki 3 hal utama yang sama dengan kelas `chartFrame`.
    Hanya bedanya adalah terletak pada marker. Marker ini digunakan sebagai pembeda
    antara klaster satu dengan yang lainnya. Hal ini untuk memudahkan pengguna agar
    bisa melihat informasi secara jelas. Berikut ini adalah implementasi dari kelas
    `markerFrame` dalam Java.


    ![](images/00069.gif)


    #### 4.3.5.4 Kelas `MbfFrame`


    Kelas `MbfFrame` ini berfungsi untuk menampilkan derajat keanggotaan masing-masing
    IHSG BEJ secara detil dan menyeluruh. Kelas ini sekilas sama dengan `hariFrame`,
    tetapi tetapi berbeda. Bedanya terletak pada jumlah derajat keanggotaan masing-masing
    IHSG BEJ. Kelas ini akan menampilkan derajat keanggotaan dari IHSG BEJ dari masing-masing
    klaster, sedangkan `hariFrame` hanya menampilkan derajat keanggotaan yang paling
    besar saja.


    ![](images/00070.gif)


    #### 4.3.5.5 Kelas `degreeFrame`


    Kelas `degreeFrame` digunakan untuk menampilkan grafik dari data-data derajat
    keanggotaan dari masing-masing IHSG BEJ pada tiap klaster.


    ![](images/00070.gif)

