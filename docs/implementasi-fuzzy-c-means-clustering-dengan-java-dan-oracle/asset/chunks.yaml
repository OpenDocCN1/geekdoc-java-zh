    # 场景 3


    ## 测试场景

    本次测试是所测试的场景。涉及所属行业的 IHSG BEJ。


    ### 5.4.1 场景大纲

    在雅加达证券交易所（BEJ）上市的公司被分为 9 个行业，即 `JASICA`（雅加达证券交易所行业分类）。每个行业都有与其领域相对应的特征。在此场景中，选择了
    `Agriculture`（农业）作为多个行业的代表。


    IHSG BEJ 分为以下组别：


    表 5.4 场景分组


    | 组别/类别 | 说明 |

    | :--- | :--- |

    | A 类 | 此类意味着 IHSG BEJ Agriculture 的数值处于极高点，意味着市场处于牛市（Bullish）。 |

    | B 类 | 此类意味着 IHSG BEJ Agriculture 的数值仍处于良好状态，交易仍处于平均水平。 |

    | C 类 | 此类意味着 IHSG BEJ Agriculture 的数值极低且低迷，这种状态意味着市场处于熊市（Bearish）。


    ### 5.4.2 场景执行

    测试通过执行上述场景的内容来进行测试。该场景的执行将经过几个阶段，即参数输入阶段、基准测试过程、查看基准测试输出以及对输出进行分析。每个阶段将在下下面的子章节中详细说明。


    #### 5.4.2.1 参数输入

    根据上述场景，必须输入某些参数。


    必须输入的参数为：


    `Jumlah Cluster = 3`; `Fuzziness (m)     = 2`; `Batas ketelitian � = 0.03`


    ![](img/00094.gif)


    图 5.23 场景 3 参数输入


    然后，在“索引名称”标签旁边的组合框中选择 `Agriculture`。这是因为将对 `Agriculture` 类型的 IHSG BEJ 进行基准测试。


    '
