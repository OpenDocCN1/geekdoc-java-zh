    ## 1. 方案 1 的执行


    通过执行上述方案中编写的内容进行测试。该方案的执行将通过几个阶段，即参数输入阶段、基准测试阶段、查看基准输出以及对输出进行分析。


    ### 5.2.2.1 参数输入


    根据上述方案，必须输入某些参数。必须输入的参数为：


    `Jumlah Cluster = 6` ; `Fuzziness (m) = 2`; `Batas ketelitian = 0.03`


    ![](img/00073.gif)

    图 5.1 方案 1 输入


    然后，在 `Nama Index` 标签旁边的组合框中选择“Composite Index”。这是因为对“Composite Index” IHSG BEJ
    进行基准测试。


    ![](img/00074.gif)

    图 5.2 方案 1 索引类型输入


    ### 5.2.2.2 基准测试过程


    进行基准测试时需要经过几个过程。这些过程是 `Fuzzy C-Mean Clustering` 的阶段。首先，通过点击 `Generate` 按钮初始化隶属度，这将使用随机值初始化隶属度变量。


    ![](img/00075.gif)

    图 5.3 生成随机数据


    然后点击 `Run` 按钮进行后续过程，即寻找 `centroid` 并寻找每个数据相对于每个簇的隶属度，并不断更新隶属度直到达到精度限制。


    ![](img/00076.gif)

    图 5.4 运行基准测试过程


    ### 1. 基准测试输出


    在基准测试过程经历几个阶段后，可以通过下图 5.5 和 5.6 中的图表表示查看结果：


    ![](img/00001.jpeg)

    图 5.5 方案 1 隶属度


    图 5.5 是 IHSG BEJ 数据相对于每个簇隶属度的图表。图中存在的若干颜色区域代表各个簇。图中共有 6 种颜色，意味着有 6 个簇。每个数据可以成为多个簇的成员。如果用图表表示，每个数据可以进入多个颜色区域。


    而下方的图表是一个表示每个聚类数据的图表，它与 `variable waktu`（索引发生时）相连。还可以看到每个簇的 `centroid`。


    ![](img/00077.jpeg)

