    sedangkan klaster 1 yang berwarna biru maka diberikan informasi bahwa poin indeks
    303,318 masuk ke dalam klaster 0 dan cenderung ke dalam klaster 1.


    Gambar 5.30 adalah hasil dari klasterisasi yang sudah tersortir ascending beserta
    derajat keanggotaan maksimum tiap data dengan variabel waktu:


