    # Skenario 2


    ## Skenario Uji Coba 2


    Pada uji coba ini diberikan suatu skenario yang ditujukan untuk mengetahui fungsionalitas
    aplikasi yang dibuat.


    ### 5.3.1 Garis Besar Skenario 2


    Suatu studi kasus dilakukan pada sudut pandang pengguna yang akan melakukan benchmarking
    nilai IHSG BEJ jenis LQ45 pada tahun 2005\.


    Penyusun memilih LQ45 karena terdapat suatu produk pasar modal dari PT. Bursa
    Efek Surabaya yang menjual poin dari indeks LQ45\. Tiap poin dari indeks tersebut
    diberikan harga tertentu oleh pihak yang mengeluarkan produk tersebut (dalam hal
    ini adalah PT Bursa Efek Surabaya). Investor melakukan aksi jual dan beli dari
    poin indeks tersebut. Investor mendapatkan keuntungan dari selisih jual beli poin
    indeks tersebut. Namanya adalah LQ Futures dan Mini LQ Futures. LQ Future diluncurkan
    pada tanggal 13 Agustus 2001 dan menjadi pelopor dari produk derivative khususnya
    untuk indeks future di Bursa Efek Surabaya. LQ Futures menggunakan IHSG BEJ yang
    berjenis LQ45 sebagai underlying (dasar/barang). LQ45 terkenal sebagai suatu benchmark
    pada saham yang tergolong blue chip pada bursa saham Indonesia. Pada pasar modal
    Indonesia yang cepat perkembangannya, indeks LQ45 menjadi sangat efektif untuk
    melakukan track pada bursa saham Indonesia pada umumnya. Hal ini karena ada korelasi
    yang sangat dekat antara indeks LQ45 dan IHSG BEJ yang berjenis composite index.


    IHSG BEJ jenis LQ45 dibagi ke dalam kelompok-kelompok/kelas-kelas berikut ini:


    Tabel 5.3 Kelompok Skenario 2


    | Kelompok /Kelas | Keterangan |


    | Kelas A | Kelas ini berarti terdapat nilai-nilai IHSG BEJ LQ45 dengan poin yang
    sangat tinggi yang berarti pasar dalam keadaan Bullish.  |'
