    ![](img/00128.jpeg)


    # 封面


    使用 JAVA 和 ORACLE 实现 Fuzzy C-Means 聚类

    作者：Eko Heryanto


    ![](img/00001.jpeg)


    # 摘要


    基准测试（Benchmarking），即在雅加达证券交易所综合价格指数（IHSG BEJ）点之间设定明确界限的过程，这对于确定和了解哪些指数点属于高、低或平均水平组至关重要。这作为一种标准，用于确定特定的指数点进入哪一组。如果没有基准测试，随着人类对指数点评估产生的各种不同感知（基于每个个人的估算），将会产生问题，即某个特定指数点到底属于高、低还是平均类别？一个指数点与另一个指数点之间没有明确的界限。Fuzzy
    C-Means，即一种通过平均划分数据集将其划分为若干个数据组的方法，是对 IHSG BEJ 进行基准测试的方法之一。Fuzzy C-Means 基于模糊逻辑，根据质心与数据之间的距离对数据进行分组。每条数据对每个簇都有一个隶属度。隶属度最高的数据将成为其隶属度所指向的簇的成员。


    在书中，将实现对 2005 年 IHSG BEJ 进行基准测试的 Fuzzy C-Means 聚类，以便用户对这些数据进行历史技术数据分析。


    通过对多种 IHSG BEJ 进行测试得出结论：基准测试可以适用于多种 IHSG BEJ，如果深入分析 IHSG BEJ 的模式并将其与时间变量起来，就可以获得一些有用信息。


    关键词：基准测试、Fuzzy C-Means 聚类、IHSG、IHSG BEJ。


    # 前言


    本书并非完美之，尽管如此，作者希望它能对读者有所帮助。作者将欢迎读者的任何建议，以促进科学特别是信息学领域的进步。


    作者祝读者阅读愉快，希望对全人类有所益。


    Sidoarjo，2016 年 9 月 13 日

    Eko Heryanto


    # 理论


    # 基准测试


    ## 基准测试


    在深入撰写本书之前，让我们通过了解基准测试的定义以及基准作为标准的正确性来完善现有概念。以下是来自多个来源的基准（benchmark）定义：


    * [www.askoxford.com](http://www.askoxford.com)


    Benchmark 是 (1) 一个标准或参考点，(2) 刻在墙上的测量员标记，用作测量高度的参考点。


    从上述来源可以获得 benchmark 是 (1) 一个标准或参考界限 (2) 刻在墙上的切割标记，作为测量高度的参考界限。


    * [www.encarta.msn.com](http://www.encarta.msn.com)


    Benchmark 是 (1) 标准：用于衡量和评估某物的基准标准，(2) 计算机性能测试：用于衡量计算机硬件或软件性能的测试测试。


    上述来源说明了 benchmark 的定义，即 (1) 标准：一个可以对事物进行衡量和评估的标准，(2) 计算机性能测试：用于衡量计算机硬件和软件性能的标准测试。


    * [`www.investorwords.com`](http://www.investorwords.com)


    Benchmark 是一个标准，用于比较。例如，Nasdaq 可以用作基准，用来比较科技股票的性能。


    根据 `http://www.investorwords.com` 的定义，benchmark 是一个标准，用于比较。例如，`Nasdaq` 可以用作对比
    `IHSG BEJ` 性能的 `benchmark`。


    从上述定义中得到了 benchmark 的几个要点：标准、可衡量和评估的事物、用于比较。如果将这些点结合起来，benchmark 的定义就是用于与某物比较的可衡量和评估的标准/基准。而基准测试（benchmarking）本身是一个执行基准测试的过程。


    根据上述解释，IHSG BEJ 基准测试的定义是一种标准化的过程，用于对某点进行评估，以便比较 IHSG BEJ 点之间的值。


    # 聚类


    ## 聚类（Clustering）


    聚类是将数据分为若干类或簇的过程，使得对象与某个簇与其他簇相比具有高度的相似性（similarity），但与其他簇的对象具有差异性（dissimilar）。通常在聚类中使用
    `distance measure`（距离量）。聚类可应用于多个领域，例如数据挖掘、统计学、生物学和机器学习。


    簇（Cluster）是数据对象的集合，同一簇内的对象之间具有相似性，而与其他簇的对象则不具有或缺乏相似性（不相似性）。


    聚类分析是人类活动中重要的一点。在年轻时，人类反复学习猫和狗、动物和植物之间的性格差异，这会产生一种潜意识聚类方案。聚类分析已广泛应用于许多领域。


    聚类有多种应用，以下是各个领域的示例：


    * 商业：聚类可以帮助营销人员在客户基数中获取不同的群体，并根据购买模式对客户群体进行特征分析。

    * 生物学：可用于植物动物的分类学、具有相同功能的基因分类，并获取种群内部结构信息。

    * 聚类还可以帮助识别用于农业的相同区域，并将其纳入地球观测数据库。

    * 根据房屋类型、价格和地理位置识别城市中房屋的集合。

    * 帮助对网页文档进行分类以进行信息。


    # Fuzzy C-Means 聚类


    ## Fuzzy C-Means 聚类


    Fuzzy C-Means (FCM) 是一种数据聚类方法，它使单条数据成为两个或多个簇的成员。该方法由 `Dunn` 于 1973 年提出，并由 `Bezdek`
    于 1981 年开发。FCM 的基于以下目标函数的最小化：


