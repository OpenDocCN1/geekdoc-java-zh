    # IHSG


    ## Indeks Harga Saham Gabungan


    Pengetahuan tentang Indeks Harga Saham (IHS) diibaratkan pintu masuk ke dalam
    rumah. Kalau ingin masuk rumah, tentu harus melewati pintu. Untuk itu, investor
    harus tahu dimana letak pintu itu dan bagaimana cara membukanya. Jadi, bila ingin
    melakukan investasi di pasar modal, investor harus mengetahui terlebih dahulu
    IHS. Setelah berhasil membuka pintu, investor harus menentukan posisi, apakah
    harus datang ke ruang tamu, ke ruang makan, atau ke kamar tidur. Untuk menentukan
    posisi, investor perlu mengetahui kondisi pasar. Dalam pasar modal, terutama pasar
    saham, kondisi pasar ditunjukkan oleh siklus pasar yang terdiri dari pasar bullish,
    normal dan bearish. Jadi bila ingin melakukan investasi di pasar modal, investor
    harus mengetahui terlebih dahulu indikator yang dapat digunakan untuk menganalisis
    kondisi pasar modal tersebut. [[Wid96]](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX).


    Berikut ini akan diberikan beberapa pengetahuan tentang Indeks Harga Saham dan
    Indeks Harga Saham Gabungan.


    ### 2.4.1 Definisi


    IHS sebenarnya merupakan angka indeks harga saham yang telah disusun dan dihitung
    sedemikian rupa sehingga menghasilkan trend (kecenderungan). Angka indeks adalah
    angka yang diolah sedemikian rupa sehingga dapat dipergunakan untuk membandingkan
    kegiatan atau peristiwa, yang bisa berupa perubahan harga saham dari waktu ke
    waktu.


    Dalam perhitungan angka indeks ini digunakan dua dasar waktu, yaitu waktu dasar
    (`base period`) dan waktu yang berlaku/berjalan (`current period`). Waktu dasar
    adalah waktu dimana suatu peristiwa dipergunakan sebagai dasar perbandingan dengan
    waktu berjalan. Sedangkan waktu berjalan adalah waktu berlakunya suatu kegiatan
    atau peristiwa yang nantinya akan dibandingkan dengan waktu dasarnya.


    Indeks Harga Saham Gabungan (IHSG) adalah suatu indikator yang digunakan untuk
    mengukur dan melaporkan perubahan seluruh nilai saham yang terdaftar (`listing`)
    dibandingkan dengan total nilai harga dasarnya. Jadi untuk menentukan angka indeks
    harus tersedia data lebih dari satu, sebab harus ditentukan harga dasar dan harga
    saham yang berlaku di bursa [[Wid96]](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)[.](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    Manfaat dari IHSG menurut Jack Clark Francis, antara lain:


    1.  Untuk mengetahui secara cepat pergerakan harga pasar (IHSG) dalam mempengaruhi
    nilai pasar investasi di pasar modal.

    2.  IHS ini juga berguna untuk analisis historis. Dengan menganalisis indeks pasar
    (IHSG) dan indikator ekonomi yang lain, seorang analis bisa mendeteksi hubungan
    antara indeks dan sektor-sektor ekonomi. Jenis hubungan ini akan sangat berguna
    jika indeks tersebut merupakan `dependable indicator` (indikator terikat), ini
    akan berguna untuk membuat ramalan [[Fra93].](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    ### 2.4.2 Metode Perhitungan Indeks Harga Saham Gabungan


    Pada prinsipnya, perhitungan IHSG tidak berbeda dengan perhitungan IHS individu.
    IHS individu adalah IHS yang digunakan untuk saham perusahaan tunggal. Tiap saham
    perusahaan memiliki IHS individu. IHS individu bermanfaat untuk menilai keadaan
    saham suatu perusahaan yang tercatat pada bursa saham.


    IHS individu menggunakan rumus sebagai berikut:


    ![](images/00021.gif) (2.4)


    Dimana:


    *   `IHS` : Indeks Harga Saham.

    *   `Ht` : harga pada waktu berlaku (`current period`).

    *   `Ho` : harga pada waktu dasar (`base period`).


    Dengan kriteria sebagai berikut:


    *   Jika nilai `IHS = 100`, menunjukkan bursa dalam kondisi normal.

    *   Jika nilai `IHS > 100`, menunjukkan bursa dalam kondisi bergairah.

    *   Jika nilai `IHS < 100`, menunjukkan bursa dalam kondisi lesu.


    Perhitungan IHSG ada tiga metode yang lazim digunakan, berikutnya adalah masing-masing
    pembahasan tersebut.


    #### 2.4.2.1 Metode Perhitungan Ind Harga Saham Gabungan Sederhana


    Metode perhitungan ini menggunakan data seluruh saham yang `listing` (tercatat)
    di bursa saat itu. Asumsinya seluruh saham memiliki peran yang sama dalam mempengaruhi
    pasar.


    Berdasarkan rumus dasar, dapat ditemukan rumus umum menghitung IHSG, yaitu:


    ```

    IHSG = ![](images/00022.gif) (2.5)

    ```


    Dimana:


    *   `![](images/0023.gif)Ht`: total harga saham pada waktu yang berlaku.

    *   `![](images/0024.gif)Ho`: total harga saham pada waktu dasar.


    Dengan kriteria sebagai berikut:


    *   Jika nilai `IHSG = 100`, menunjukkan bursa dalam kondisi normal.

    *   Jika nilai `IHSG > 100`, menunjukkan bursa dalam kondisi bergairah.

    *   Jika nilai `IHSG < 100`, menunjukkan bursa dalam kondisi lesu.


    #### 2.4.2.2 Metode Perhitungan Indeks Harga Saham Gabungan Tertimbang


    Berbeda dengan metode sebelumnya, metode ini mempertimbangkan kekuatan saham dalam
    mempengaruhi pasar, artinya jika terjadi perubahan terhadap harga saham tertentu
    seluruh harga saham akan terpengaruh. Atas dasar bobot kekuatan mempengaruhi inilah
    perhitungan IHSG tertimbang. Penentuan bobot kekuatan saham adalah besarnya kecilnya
    jumlah saham yang didaftarkan. Semakin banyak jumlah saham didaftarkan, semakin
    kuat kemampuan suatu saham dalam membentuk IHSG. Metode tertimbang terdiri dari
    empat model perhitungan IHSG yaitu Laspeyres, Paasche, Irving Fisher, dan Drobisch.
    Masing-masing model tertimbang akan dijelaskan lebih lanjut yang disertai dengan
    rumusnya.


    Model Perhitungan Laspeyres


    Dalam model perhitungan ini, kriteria jumlah saham yang digunakan adalah jumlah
    saham saat penawaran perdana atau waktu dasar. Jika menggunakan jumlah saham yang
    beredar pada waktu dasar sebagai kriteria maka digunakan rumus yang dikemukakan
    Laspeyres. Rumus umum dari Laspeyres adalah sebagai berikut:


    ```

    IHSG = ![](images/0025.gif) (2.6)

    ```


    Dimana:


    *   `Ht`: harga saham pada waktu yang berlaku.

    *   `Ho`: harga saham pada waktu dasar.

    *   `Ko`: jumlah seluruh saham yang beredar pada waktu dasar.


