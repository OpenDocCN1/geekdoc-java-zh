    #### 2.4.2.3 Metode Perhitungan Indeks Harga Saham Gabungan Sampling


    Perhitungan IHSG kurang efisien apabila memasukkan seluruh saham yang listing
    di bursa. Hal ini karena jika jumlah saham yang listing sudah mencapai puluhan
    ribu, maka sangat rumit untuk menghitung IHSG.


    Beberapa pasar modal dunia seperti Dow Jones (the Dow Jones Industrial Average),
    hanya menggunakan 30 saham sektor industri sebagai sampel. Demikian pula indeks
    harga saham yang dipakai oleh Standard & Poor’s 500 (the Standard & Poor’s 500
    Composite), indeks sahamnya menggunakan 500 saham, terdiri dari 400 saham perusahaan
    industri, 40 saham perusahaan utilitas, 20 saham perusahaan transportasi dan 40
    saham perusahaan keuangan.


    ### 2.4.3 Beberapa Istilah dalam Pergerakan IHSG


    Ada banyak sekali istilah-istilah yang berhubungan dengan pasar modal, akan tetapi
    dalam buku ini akan dibahas beberapa saja yang tentu saja berhubungan dengan buku
    ini. Berikut ini pembahasannya.


    #### 2.4.3.1 Pasar Bullish


    Ciri-ciri kondisi pasar bullish jika didasarkan pergerakan nilai indikator IHSG
    adalah sebagai berikut:


    * Terjadi trend kenaikan pada nilai IHSG dari waktu ke waktu

    * Nilai tertinggi yang baru selalu lebih tinggi dari nilai tertinggi sebelumnya
    hingga pada akhir fase ketiga.

    * Dalam pergerakan nilai IHSG baru yang terendah selalu lebih tinggi dari nilai
    indeks terendah sebelumnya.


    #### 2.4.3.2 Pasar Bearish


    Pasar bearish merupakan kebalikan dari pasar bullish dengan ciri-ciri sebagai
    berikut:


    * Terjadi trend penurunan pada nilai IHSG dari waktu ke waktu.

    * Nilai indeks tertinggi yang baru selalu lebih rendah dari nilai tertinggi sebelumnya
    sampai pada akhir fase ketiga.

    * Dalam pergerakan nilai IHSG baru yang terendah selalu lebih rendah dari nilai
    indeks terendah sebelumnya.

    * Pada pasar bearish investor yang melakukan transaksi bukan merupakan real investor,
    melainkan sebagian besar merupakan spekulan yang hanya mengharapkan keuntungan
    dari fluktuasi harga dari waktu ke waktu dalam jangka pendek.

    * Pada pasar bearish biasanya timbul anggapan bahwa : ”Good news is no news and
    bad news is nightmare” (berita baik adalah tidak ada berita dan berita buruk adalah
    mimpi buruk), yang artinya kebanyakan investor lebih bersikap pesimis.

    * Pada pasar bearish frekuensi perdagangan cenderung kecil, akibat kecilnya profit
    yang mungkin diperoleh dengan risiko yang tinggi.

    * Pada pasar bearish jatuhnya harga saham terjadi pada hampir seluruh saham dengan
    nilai yang tinggi[[Wid96]](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX).


