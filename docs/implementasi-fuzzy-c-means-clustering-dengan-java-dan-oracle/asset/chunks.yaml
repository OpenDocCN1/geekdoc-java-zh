    ![](img/00078.jpeg)

    图 5.7 方案 1 隶属度输出


    在图 5.7 中可以看到什么？该图提供了每个数据在每个簇中的隶属度信息。这是 `FCM` 具有灵活性的典型特征。从这些隶属度中可以获得特定索引点的趋势。例如，数据
    `1000,877`。该数据的最大隶属度位于簇 4，值为 `0,716`，而第二高隶属度位于簇 3，值为 `0,147`。观察图 5.6，簇 4 为棕色，而簇
    3 为黄色，则表明索引点 `1000,877` 属于簇 4 并倾向于簇 3。


    数据表结果为已升序 `ascending` 排序的聚类 IHSG BEJ 复合数据，以及每个数据的最大隶属度及其对应的 `variable waktu`，见下图
