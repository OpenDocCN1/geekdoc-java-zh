    ## 测试场景 5


    在本次测试中，提供了一个旨在了解所创建应用程序功能的场景。该应用程序上测试了一个场景。


    ### 5.6.1 场景 5 概述


    从用户视角进行了案例研究，该用户将作为决策辅助工具，或对 2005 年 `Main Board` 类型的 `IHSG BEJ` 数值进行报告。


