    通过图 2.5，可以从两个密集数据中识别出两个相邻的聚类。这些聚类被命名为聚类‘A’和聚类‘B’。在第一种方法——K-Means 算法中，每个数据仅连接到一个质心。其隶属函数将如图
    2.5 所示：


    ![](img/00009.jpeg)


    图 2.5 K-Mean 隶属度图


    在 Fuzzy C-Means（模糊均值）方法中，相同的数据不再排他地属于某个聚类，而是数据可以位于中间。在这种情况下，隶属函数遵循特殊路径，指示每条数据都可以以不同的隶属度存在于多个聚类中。


