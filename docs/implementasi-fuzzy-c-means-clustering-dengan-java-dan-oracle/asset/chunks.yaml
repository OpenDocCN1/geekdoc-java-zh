  trans: "\n以下是界面设计，并对表单中的每个组件都进行了说明。所有内容见图 3.6。\n\n![](img/00039.gif)\n图 3.6 界面设计\n\
    \n# 软件实现\n\n本章将阐述所创建软件设计的实现。讨论内容包括软件实现环境、过程实现和类实现。\n\n## 4.1 应用环境\n\n实现环境包括所使用的硬件和软件。实现中所使用的硬件和软件规格见表\
    \ 4.1：\n\n表 4.1 软件实现环境\n\n| 硬件 | 详情 |\n| :--- | :--- |\n| 处理器 | `Intel(R) Pentium(R)\
    \ 4 CPU 2.8 GHz`，内存：`1024 MB RAM` |\n| 软件 | 操作系统：`Microsoft Windows Server 2003`，IDE\
    \ 软件：`NetBeans 5`，Java 组件：`JFreeChart`，驱动：`JDBC Oracle 10G` |\n\n# 数据实现\n\n数据实现章节解释了第\
    \ 3 章中数据设计的实现。与数据设计一样，数据实现分为三部分：输入数据、处理数据和输出数据。\n\n### 4.2.1 输入数据\n\n文本形式的输入数据通过转换为\
    \ `CSV`（逗号分隔值）文件格式进行处理。仅转换所需的数据。进行此类转换是为了使数据更容易录入到数据库中。选择 `CSV` 格式是因为这种格式的数据可以转换为多个数据库，这意味着某些数据库在导入到数据库的过程中支持该格式。\n\
    \n所需的输入数据被迁移到数据库（`Oracle Database 10G`）中，具有以下属性：\n\n![](img/00040.gif)\n图 4.1\
    \ IHSG BEJ 表属性\n\n将创建的表对应的 `DDL`（数据定义语言）如下：\n\n![](img/00041.gif)\n图 4.2 创建表 IHSG\
    \ BEJ\n\n以下是数据迁移到 Oracle 数据库后的若干部分数据。\n\n![](img/00042.gif)\n图 4.3 Oracle IHSG\
    \ BEJ 数据\n\n为了提高在股票主数据中正确过滤数据的效率，创建了几个视图（View），其结果为所需的即符合各索引类型的 IHSG 数据。`View`\
    \ 是虚拟/影子表或存储的查询，不物理存储数据。`View` 是 `DDL`（数据定义语言）的一部分。\n\n各索引类型的 `View` 具有以下属性：\n\
    \n![](img/00043.gif)\n图 4.4 视图属性\n\n以下是用于各 IHSG 的视图类型：\n\n* `VIEW_COMP2`: 用于获取复合索引（composite\
    \ index）类型的 BEJ IHSG 视图\n![](img/00044.gif)\n图 4.5 复合视图\n* `VIEW_AGRI`: 用于获取属于农业行业部门索引的\
    \ BEJ IHSG 视图\n![](img/00045.gif)\n图 4.6 农业视图\n* `VIEW_MINING`: 用于获取属于矿业行业部门索引的\
    \ BEJ IHSG 视图\n![](img/00046.gif)\n图 4.7 矿业视图\n* `VIEW_BASIC`: 用于获取属于工业和化工行业部门索引的\
    \ BEJ IHSG 视图\n![](img/00047.gif)\n图 4.8 基础工业视图\n* `VIEW_MISCELL`: 用于获取属于杂项行业的\
    \ BEJ IHSG 视图\n![](img/00048.gif)\n图 4.9 杂项索引视图\n* `VIEW_CONSUME`: 用于获取消费品行业部门索引的\
    \ BEJ IHSG 视图\n![](img/00049.gif)\n图 4.10 消费品视图\n* `VIEW_FINANCE`: 用于获取金融行业部门索引的\
    \ BEJ IHSG 视图\n![](img/00050.gif)\n图 4.11 金融视图\n* `VIEW_INFRA`: 用于获取属于交通和基础设施部门索引的\
    \ BEJ IHSG 视图\n![](img/00051.gif)\n图 4.12 基础设施视图\n* `VIEW_PROPERTY`: 用于获取属于房地产和地产行业部门索引的\
    \ BEJ IHSG 视图\n![](img/00052.gif)\n图 4.13 房地产索引视图\n* `VIEW_TRADE`: 用于获取属于贸易、服务和投资部门索引的\
    \ BEJ IHSG 视图\n![](img/00053.gif)\n图 4.14 贸易索引视图\n* `VIEW_LQ`: 用于获取属于 LQ45 的 BEJ\
    \ IHSG 视图\n![](img/00054.gif)\n图 4.15 LQ45 索引视图\n* `VIEW_MAIN`: 用于获取属于主板（main\
    \ board）索引的 BEJ IHSG 视图\n![](img/00055.gif)\n图 4.16 主板视图\n* `VIEW_ISLAM`: 用于获取属于\
    \ JII 的 BEJ IHSG 视图\n![](img/00056.gif)\n图 4.17 雅兰视图\n* `VIEW_DEVELOP`: 用于获取属于开发板（development）索引的\
    \ BEJ IHSG 视图\n![](img/00057.gif)\n图 4.18 开发板索引视图\n\n### 4.2.2 处理数据\n\n数据设计的实现创建一个矩阵来存储处理后的输入数据。输入数据通过两个阶段进行处理：\n\
    \n1. **聚类中心查找**：在矩阵查找后，将聚类中心存储在一个维矩阵中。该矩阵的行数与用户输入的簇数量对应。该矩阵命名为 `clustercentroid`。\n\
    2. **最优隶属度查找**：此阶段包括每个簇中每个输入数据的隶属度查找，以及最优隶属度数据的查找。\n\n   a. **隶属度查找**：在此阶段，将聚类中心查找的处理数据与输入数据进行处理。处理结果进入二维矩阵，其每个索引分别表示数据索引和簇索引。矩阵包含每个数据在特定簇中的隶属度。该矩阵命名为\
    \ `u1`。\n\n   1. **最优隶属度查找**：在此阶段，查找并存储最优隶属度阶段的结果到一个矩阵中。该矩阵是一个维矩阵，其内容为最优簇的索引。\n\
    \n### 4.2.3 输出数据\n\n输出数据是软件为用户产生的信息。经过处理并获得特定簇成员的数据被设计为每个簇具有不同的显示颜色。这存在于 `createDataset`\
    \ 方法中，该方法存储聚类处理后的数据。\n\n"
