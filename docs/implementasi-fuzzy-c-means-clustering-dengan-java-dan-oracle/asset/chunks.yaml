    | 数据 | 硬性隶属 | 模糊隶属度 |

    | --- | --- | --- |

    | `xi` | `yi` | | | |

    | 1 | 7 | 1 | 0 | 0,8737 | 0,1262 |

    | 2 | 8 | 1 | 0 | 0,9292 | 0,0707 |

    | 3 | 9 | 1 | 0 | 0,7047 | 0,2952 |

    | 4 | 10 | 0 | 1 | 0,2952 | 0,7047 |

    | 5 | 11 | 0 | 1 | 0,0707 | 0,9292 |

    | 6 | 12 | 0 | 1 | 0,1262 | 0,8737 |


    FCM 的灵活性示例如下：有一个如表 2.1 所示的数据集。使用 FCM 和 K-Means 两种方法将数据分为 2 个聚类。表 2.2 是聚类过程的结果。硬性方法（在
    K-Mean 中）提供 1 或 0 的隶属度，这意味着该方法将每条数据精确地放置在一个聚类中。但在 FCM 中，每条数据都成为两个聚类的成员，并具有各自的隶属度。


    在硬性集合（crisp set）中，项目 `x` 在集合 `A` 中的隶属值（通常写为 `μA[x]`）有两种可能性：


    *   一 (1)，意味着该项目成为集合的成员，或

    *   零 (0)，意味着该项目不是集合的成员。


