    *   Jika seseorang berusia 34, maka ia dikatakan Muda (MUDA[34] = 1);

    *   Jika seseorang berusia 35 tahun, maka ia dikatakan Tidak Muda (MUDA[35] =
    0);

    *   Jika seseorang berusia 35 tahun kurang 1 hari, maka ia dikatakan Tidak Parobaya
    (PAROBAYA[35 tahun – 1 hari] = 0);

    *   Jika seseorang berusia 35 tahun, maka ia dikatakan Parobaya (PAROBAYA[35]
    = 1);

    *   Jika seseorang berusia 55 tahun, maka ia dikatakan Parobaya (PAROBAYA[55]
    = 1);

    *   Jika seseorang berusia 55 tahun kurang 1 hari, maka ia dikatakan Parobaya
    (PAROBAYA[55 tahun – 1 hari] = 1);

    *   Jika seseorang berusia 55 tahun lebih 1 hari, maka ia dikatakan Tua (TUA[55
    tahun + 1 hari] = 1);

    *   Jika seseorang berusia 55 tahun lebih dari 1 jam, maka ia dikatakan Tua (TUA[55
    tahun + 1 jam] = 1);


    Dari sini bisa dikatakan bahwa pemakaian himpunan crisp untuk menyatakan umur
    sangat tidak adil, adanya perubahan kecil pada suatu nilai mengakibatkan perbedaan
    kategori yang cukup signifikan.


    Himpunan fuzzy digunakan untuk mengantisipasi hal tersebut. Seseorang dapat masuk
    dalam 2 himpunan yang berbeda, Muda dan Parobaya, Parobaya dan Tua, dsb. Seberapa
    besar eksistensinya dalam himpunan tersebut dilihat pada derajat keanggotaannya.
    Gambar 2.9 berikut ini menunjukkan himpunan fuzzy untuk variabel umur.


    ![](images/00018.jpeg)


    Gambar 2.9 Fungsi Derajat Keanggotaan Fuzzy Variabel Umur


