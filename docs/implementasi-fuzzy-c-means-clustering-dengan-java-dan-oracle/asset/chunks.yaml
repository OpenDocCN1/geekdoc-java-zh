    \ yang memiliki derajat keanggotaan paling tinggi. Jikalau derajat keanggotaan\
    \ paling tinggi didapatkan maka indeks matriks dari klaster akan disimpan sebagai\
    \ nilai pengembaliannya. Nilai pengembalian ini yang berguna untuk proses selanjutnya.\n\
