    ### 2.5.2.1 Kriteria Pemilihan Saham Indeks LQ45


    Untuk masuk dalam pemilihan tersebut, sebuah saham harus memenuhi kriteria tertentu
    dan lolos dari seleksi utama sebagai berikut:


    1. Masuk dalam top 60 dari total transaksi saham di pasar regular (rata-rata nilai
    transaksi selama 12 bulan terakhir).

    2. Masuk dalam ranking yang didasarkan pada nilai kapitalisasi pasar (rata-rata
    kapitalisasi pasar selama 12 bulan terakhir).

    3. Telah tercatat di `BEJ` sekurang-kurangnya 3 bulan.

    4. Kondisi keuangan perusahaan, prospek pertumbuhan perusahaan, frekuensi dan
    jumlah transaksi di pasar regular.


    ### 2.5.3 Evaluasi Indeks dan Pergantian Saham


    `BEJ` secara terus menerus memantau perkembangan komponen saham yang masuk dalam
    perhitungan `LQ45`. Setiap 3 bulan, di-review pergerakan ranking saham yang masuk
    dalam perhitungan Indeks `LQ45`. Penggantian saham akan dilakukan setiap 6 bulan
    sekali, yakni pada setiap awal bulan Februari dan Agustus.


    Bila ada satu saham yang tidak memenuhi kriteria, saham tersebut akan dikeluarkan
    dari perhitungan indeks dan digantikan dengan saham yang memenuhi kriteria.


    Saham-saham yang masuk dalam kriteria rangking 1-35 dikalkulasikan dengan cepat
    dalam perhitungan indeks. Sedangkan saham yang masuk pada rangking 36-45 tidak
    perlu dimasukkan dalam perhitungan indeks.


    #### Hari Dasar Indeks LQ45 dan Awal Perhitungan (13 Juli 1994 - 1996) Indeks
    `LQ45` dihitung mundur hingga tanggal 13 Juli 1994 sebagai Hari Dasar, dengan
    Nilai Dasar 100. Untuk seleksi awal digunakan data pasar Juli 1993-Juni 1994.
    Hasilnya, ke-45 saham tersebut meliputi 72% total market kapitalisasi pasar dan
    72,5% nilai transaksi di pasar regular.


    ### 2.5.5 Jakarta Islamic Index (JII)


    Dalam rangka mengakomodasi investor yang tertarik untuk berinvestasi, `BEJ` dan
    `Danareksa Investment Management` (`DIM`) meluncurkan sebuah indeks yang didasarkan
    pada Syariah Islam, dikenal dengan nama Jakarta Islamic Index (`JII`).


    `JII` diluncurkan pada tanggal 3 Juli 2000. `JII` dihitung mundur hingga tanggal
    1 Januari 1995 sebagai Hari Dasar dengan Nilai Dasar 100.


    `JII` terdiri dari 30 saham yang sesuai dengan Syariah Islam. Dewan Pengawas Syariah
    `PT DIM` terlibat dalam menetapkan kriteria saham-saham yang masuk dalam `JII`.


    #### 2.5.5.1 Kriteria Saham-Saham yang Tidak Masuk dalam JII


    Berdasarkan arahan Dewan Pengawas Syariah `PT DIM`, jenis kegiatan utama emiten
    yang bertentangan dengan Syariah adalah:


    * Usaha perjudian dan permainan yang tergolong judi atau perdagangan yang dilarang.

    * Usaha lembaga keuangan konvensional (ribawi) termasuk perbankan dan asuransi
    konvensional.

    * Usaha yang memproduksi, mendistribusi serta merperdagangkan makanan dan minuman
    yang tergolong haram.

    * Usaha yang memproduksi, mendistribusi dan/atau menyediakan barang-barang ataupun
    jasa merusak moral dan bersifat mudarat.


    #### 2.5.5.2 Penetapan Saham-Saham yang Masuk JII


    Untuk menetapkan saham-saham yang masuk dalam perhitungan indeks `JII` dilakukan
    dengan urutan seleksi sebagai berikut:


    1. Memilih kumpulan saham dengan jenis usaha utama yang tidak bertentangan dengan
    prinsip Syariah dan sudah tercatat lebih dari 3 bulan (kecuali termasuk dalam
    10 kapitalisasi besar).

    2. Memilih saham berdasarkan laporan keuangan tahunan atau tengah tahunan terakhir
    yang memiliki rasio kewajiban terhadap aktiva maksimal sebesar 90%.

    3. Memilih 60 saham dari susunan saham diatas berdasarkan urutan rata-rata kapitalisasi
    pasar (`market capitalization`) terbesar selama satu tahun terakhir.

    4. Memilih 30 saham dengan urutan berdasarkan tingkat likuiditas rata-rata nilai
    perdagangan selama satu tahun terakhir.


    Saham-saham yang masuk ke dalam `JII` memiliki daya tarik yang tinggi bagi masyarakat
    yang memiliki niat untuk melakukan investasi hanya pada perusahaan yang bersifat
    halal. Banyak investor baik dari dalam maupun dari luar negeri yang beragama Islam
    yang berinvestasi pada saham-saham tersebut.


    ### 2.5.6 Indeks Papan Utama (Main Board Index/MBX) dan Indeks Papan Pengembangan
    (Development Board Index)


    Pada tanggal 13 Juli 2000, `BEJ` meluncurkan peraturan baru di bidang pencatatan,
    yaitu Sistem Pencatatan 2 Papan. Sistem ini diimplementasikan untuk mendorong
    bursa Indonesia.


    Klasifikasi Papan Pencatatan terdiri dari:


    * Papan Utama untuk perusahaan besar dengan `track record` yang baik.

    * Papan Pengembangan, untuk mengakomodasi perusahaan-perusahaan yang belum bisa
    memenuhi persyaratan Papan Utama, tetapi masuk pada kategori perusahaan berprospek.
    Disamping itu, Papan Pengembangan diperuntukkan bagi perusahaan yang mengalami
    restrukturisasi atau pemulihan kinerja.


    Dalam rangka menyediakan indikator untuk mengawasi saham-saham yang masuk dalam
    kategori setiap papan, pada tanggal 8 April 2002, `BEJ` telah meluncurkan 2 indeks
    baru: Indeks Papan Utama dan Indeks Papan Pengembangan. Kedua Indeks tersebut
    menggunakan metode perhitungan seperti indeks lainnya, contoh menggunakan pembobotan
    berdasarkan kapitalisasi pasar. Hari Dasar untuk perhitungan indeks papan utama
    dan papan pengembangan adalah tanggal 28 desember 2001 dengan Nilai Dasar 100.
    Pada tanggal tersebut 24 saham tercatat di Papan Utama dan 287 saham tercatat
    di Papan Pengembangan dengan komposisi kapitalisasi pasar untuk kedua indeks tersebut
    adalah 62 % dan 38% berturut-turut.


