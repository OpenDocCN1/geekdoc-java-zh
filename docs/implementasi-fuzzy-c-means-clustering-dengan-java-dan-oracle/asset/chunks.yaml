    ### 2.5.1 Indeks Sektoral


    Indeks Sektoral merupakan bagian dari IHSG. Semua perusahaan yang tercatat di
    BEJ diklasifikasikan dalam 9 sektor yang didasarkan pada klasifikasi industri
    yang ditetapkan oleh BEJ yang disebut `JASICA` (Jakarta Stock Exchange Industrial
    Classification). Kesembilan sektor tersebut adalah:


    A. Sektor Utama (industri yang menghasilkan bahan-bahan baku)


    * `Sektor 1`: Pertanian.

    * `Sektor 2`: Pertambangan.


    B. Sektor Kedua (industri pengolahan/manufaktur)


    * `Sektor 3`: Industri Dasar dan Kimia.

    * `Sektor 4`: Aneka Industri.

    * `Sektor 5`: Industri Barang Konsumsi.


    C. Sektor ketiga (jasa)


    * `Sektor 6`: Properti dan Real Estate.

    * `Sektor 7`: Transportasi dan Infrastruktur.

    * `Sektor 8`: Keuangan.

    * `Sektor 9`: Perdagangan, Jasa dan Investasi.


    Indeks Sektoral diperkenalkan pada tanggal 2 Januari 1996 dengan Nilai Dasar 100
    untuk setiap sektor dan menggunakan Hari Dasar 28 Desember 1995. Disamping kesembilan
    sektor tersebut, BEJ menghitung indeks industri manufaktur/pengolahan yang merepresentasikan
    kumpulan saham yang diklasifikasikan kedalam sektor 3, sektor 4, dan sektor 5.


