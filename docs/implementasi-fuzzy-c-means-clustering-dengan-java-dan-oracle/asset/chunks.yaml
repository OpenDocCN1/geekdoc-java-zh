    ### 5.2.2.2 Proses Benchmarking


    Ada beberapa proses yang harus dilalui dalam melakukan benchmarking. Proses ini
    merupakan tahap-tahap dari `Fuzzy C-Mean Clustering`. Pertama, inisialisasi derajat
    keanggotaan dengan melakukan klik kepada tombol `Generate`, yang nantinya akan
    melakukan inisialisasi pada variabel derajat keanggotaan dengan nilai random.


    ![](images/00075.gif)

    Gambar 5.3 Generate Data Random


    Kemudian klik tombol `Run` untuk melakukan proses selanjutnya, yakni mencari `centroid`
    dan mencari derajat keanggotaan masing-masing data terhadap masing-masing klaster
    serta melakukan update derajat keanggotaan secara terus menerus hingga batas ketelitiannya
    tercapai.


    ![](images/00076.gif)

    Gambar 5.4 Run Proses Benchmarking


    ### 1. Output Benchmarking


    Setelah terjadi beberapa tahapan dalam proses benchmarking, dapat dilihat hasilnya
    dengan representasi grafik-grafik pada Gambar 5.5 dan 5.6 berikut ini:


    ![](images/00001.jpeg)

    Gambar 5.5 Derajat Keanggotaan Skenario 1


    Gambar 5.5 adalah grafik data IHSG BEJ terhadap derajat keanggotaannya pada tiap
    klaster. Beberapa daerah warna yang ada merepresentasikan masing-masing klaster.
    Pada grafik terdapat 6 warna yang berarti ada 6 klaster. Tiap data bisa menjadi
    anggota lebih dari satu klaster. Hal ini bila direpresentasikan dengan grafik,
    tiap data bisa masuk ke dalam lebih dari satu daerah warna.


    Sedangkan grafik dibawah adalah sebuah grafik yang merepresentasikan masing-masing
    data yang terklaster yang dihubungkan dengan `variable waktu` (saat terjadinya
    indeks berlangsung). Juga terlihat `centroid` dari masing-masing klaster.


    ![](images/00077.jpeg)

    Gambar 5.6 Grafik Data Terklaster Skenario 1


    Dibawah ini adalah sebuah tabel data berisi data IHSG BEJ Composite terklaster
    beserta derajat keanggotaan data pada masing-masing klaster berikut ini:


    ![](images/00078.jpeg)

    Gambar 5.7 Output Derajat Keanggotaan Skenario 1


    Apa yang bisa dilihat pada Gambar 5.7? Gambar tersebut memberikan informasi derajat
    keanggotaan tiap data pada tiap klaster. Ini merupakan ciri khas dari `FCM` yang
    memiliki sifat fleksibilitas. Dari derajat keanggotaan tersebut bisa didapatkan
    suatu kecenderungan dari poin indeks tertentu. Contohnya pada data `1000,877`.
    Data tersebut memiliki derajat keanggotaan maksimalnya ada pada klaster 4 yang
    bernilai `0,716` sedangkan derajat keanggotaan tertinggi kedua ada pada klaster
    3 yang bernilai `0,147`. Bila melihat pada Gambar 5.6 klaster 4 yang berwarna
    coklat sedangkan klaster 3 yang berwarna kuning maka diberikan informasi bahwa
    poin indeks `1000,877` masuk ke dalam klaster 4 dan cenderung ke dalam klaster
    3.


    Hasil tabel data berupa data IHSG BEJ Composite terklaster yang sudah tersortir
    `ascending` beserta derajat keanggotaan paling maksimum masing-masing data dengan
    `variable waktu` pada Gambar 5.8 berikut ini:


    ![](images/00079.jpeg)

    Gambar 5.8 Output Data Terkorelasi Waktu Skenario 1


