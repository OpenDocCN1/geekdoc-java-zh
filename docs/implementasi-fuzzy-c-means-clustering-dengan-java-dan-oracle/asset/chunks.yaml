    \ Board Index\n\n### 4.2.2 Data Proses\n\nImplementasi dari perancangan data proses\
    \ adalah membuat suatu matriks untuk menampung isi dari data masukan setelah proses.\
    \ Data masukan diproses dengan dua tahap, yakni:\n\n1. **Pencarian pusat klaster**:\
    \ Pusat klaster disimpan dalam sebuah matriks satu dimensi setelah proses pencarian\
    \ matriks dilakukan. Matriks ini jumlah barisnya sesuai dengan jumlah klaster\
    \ yang diinputkan oleh pengguna. Matriks ini dinamakan dengan `clustercentroid`.\n\
    2. **Pencarian derajat keanggotaan optimal**: Pada tahap ini terdiri atas fase\
    \ pencarian derajat keanggotaan tiap data masukan pada tiap klaster dan fase pencarian\
    \ data derajat keanggotaan optimal.\n\n   a. **Fase pencarian derajat keanggotaan**:\
    \ Pada tahap ini, data proses hasil proses pencarian pusat klaster diolah dengan\
    \ data masukan. Hasil dari proses ini dimasukkan kedalam matriks dua dimensi yang\
    \ masing-masing indeksnya menunjukkan indeks dari data dan indeks dari klaster.\
    \ Matriks ini berisi derajat keanggotaan tiap data pada klaster tertentu. Matriks\
    \ ini diberi nama dengan matriks `u1`.\n\n   1. **Fase pencarian derajat keanggotaan\
    \ optimal**: Pada tahap ini, data hasil pada fase pencarian derajat keanggotaan\
    \ optimal dicari dan disimpan dalam sebuah matriks. Matriks ini merupakan matriks\
    \ satu dimensi yang isinya adalah indeks dari klaster yang derajatnya optimal.\n\
    \n### 4.2.3 Data Keluaran\n\nData keluaran adalah informasi yang dihasilkan oleh\
    \ perangkat lunak untuk pengguna. Data yang sudah terproses sehingga mendapatkan\
    \ keanggotaan pada klaster tertertentu dibuat tampiliknya dengan warna yang berbeda\
    \ untuk tiap klaster. Hal ini ada pada metode `createDataset` yang menampung data\
    \ hasil proses klasterisasi.\n"
