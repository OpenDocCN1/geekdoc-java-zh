    data yang terklaster yang dihubungkan dengan variabel waktu (saat terjadinya indeks
    berlangsung). Juga terlihat centroid dari masing-masing klaster.


    ![](images/00121.jpeg)

    Gambar 5.50 Grafik Data Terklaster Skenario 5


    Gambar 5.51 adalah sebuah tabel berisi data terklaster beserta derajat keanggotaan
    data pada tiap klaster:


    ![](images/00122.jpeg)

    Gambar 5.51 Output Derajat Keanggotaan Skenario 5


    Apa yang bisa dilihat pada Gambar 5.51 ?. Gambar itu memberikan informasi derajat
    keanggotaan tiap data pada klaster tertentu. Ini merupakan ciri khas dari `FCM`
    yang memiliki sifat fleksibilitas. Dari derajat keanggota tersebut tersebut bisaapatkanapatkan
    kecenderungan dari poin indeks tertentu. Contohnya pada data `269,281`. Data tersebut
    memiliki derajat keanggotaan tertinggi ada pada klaster 1 yang bernilai `0,837`
    sedangkan derajat keanggotaan tertinggi kedua ada pada klaster 2 yang bernilai
    `0,123`. Bila melihat pada Gambar 5.50 klaster 1 yang berwarna biru sedangkan
    klaster 2 yang berwarna merah maka diberikan informasi bahwa poin indeks `269,281`
    masuk ke dalam klaster 1 dan cenderung ke dalam klaster 2.

