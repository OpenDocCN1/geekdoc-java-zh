    # 结论与建议


    本章解释了已进行测试的结论以及对本书的改进建议。


    ## 6.1 结论


    第 5 章对 5 种不同类型的 IHSG（印尼股票综合指数）进行了测试。所测试的 IHSG 类型包括综合指数（Composite Index）、LQ45、农业板块（Agriculture
    Sector）、JII 和主板指数（Main Board Index）。在查看上述第 5 章的测试结果后，可以得出测试结论。以下结论已获得资本市场从业者的认可。


    从书中可以得出的结论是：


    * 实施 `Fuzzy C-Means Clustering` 对 BEJ IHSG 进行聚类，可以用于基准测试过程，即在 BEJ IHSG 数据点之间设定明确界限的过程。

    * 在完成基准测试后，可以对 BEJ IHSG 的历史数据进行分析，然后将其与指数发生的时间变量关联。


    ## 6.2 建议


    建议是追求人类工作成果完美时必须的努力。因此，本书非常需要建议。本书的建议来自资本市场从业者。以下是针对本书的建议：


    * `Fuzzy C-Means Clustering` 的实施不不应仅限于单一维度（指数维度），而可以与其他变量联系起来，从而支持基准测试过程。

    * 使用的数据不应仅限于 2005 年，而应该是更长的时间跨度。


