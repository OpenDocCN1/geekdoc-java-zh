    # Perancangan Perangkat Lunak


    # P erancangan Perangkat Lunak


    Bab ini merupakan uraian mengenai inti penerapan teori dan algoritme yang dikembangkan
    dalam bentuk perangkat lunak. Ada tiga hal yang harus diperhatikan dalam perancangan
    perangkat lunak ini yaitu perancangan data, perancangan proses dan perancangan
    antarmuka. Untuk menjadikannya lebih sederhana, maka perancangan perangkat lunak
    ini dibagi ke dalam beberapa tahapan meliputi:


    1.  Perancangan Data


    2.  Perancangan Proses


    3.  Perancangan Antarmuka


    Created with the Personal Edition of HelpNDoc: [Free Qt Help documentation generator](http://www.helpndoc.com)


    # Perancangan Data


    ## Perancangan Data


    Data-data yang digunakan dalam perangkat lunak ini dapat dibedakan menjadi tiga
    yaitu data masukan, data proses dan data keluaran. Beberapa jenis data tersebut
    akan dijelaskan pada sub bab berikutnya. Alur dari informasi diprosesnya suatu
    data sehingga menjadi suatu informasi memang perlu diketahui. Adapun  alur dari
    aliran informasi dari data-data tersebut dapat dilihat pada diagram berikut ini:


    ![](images/00031.gif)


                                 Gambar 3.1 Alur informasi dari data


    ### 3.1.1 Data Masukan


    Data masukan adalah data-data yang diperlukan agar perangkat lunak dapat bekerja.
    Data mentah yang dapat diolah dalam aplikasi ini terdiri dari data input yaitu
    data IHSG BEJ dengan jenis yang sesuai dengan yang diinputkan pengguna. Sebelum
    menjadi data input  yang sesuai, data melewati beberapa proses yaitu:


    #### 3.1.1.1\. Pemilihan data yang diperlukan dan konversi ke dalam bentuk CSV.


    Data masukan yang diperlukan dalam buku ini adalah data IHSG BEJ pada periode
    2005\. Data tersebut berupa file yang berekstensi txt, dengan format pada Gambar
    3.2 sebagai berikut:


    ![](images/00032.jpeg)


                                          Gambar 3.2 Bentuk data asli IHSG BEJ


    Jumlah dari file teks yang didapat adalah 238 file yang berarti dalam waktu satu
    tahun (tahun 2005) terjadi sekitar 238 trading time (waktu perdagangan saham).


    Kolom indeks adalah nama dari jenis indeks, tertera dalam tabel bahwa terdapat
    15 indeks. Masing-masing indeks memiliki karakteristik sendiri-sendiri, dibagi
    menurut karakternya dan sektoral.'
