    2 metode yakni FCM dan K-Means. Tabel 2.2 adalah hasil dari proses klasterisasi.
    Metode crisp (pada K-Mean) memberikan derajat keanggotaan 1 atau 0, artinya, metode
    ini menempatkan tiap data tepat pada satu klaster. Namun, pada FCM, tiap data
    menjadi anggota pada kedua klaster dengan derajat keanggotaan masing-masing.


    Pada himpunan tegas (crisp), nilai keanggotaan suatu item `x` dalam suatu himpunan
    `A`, yang sering ditulis dengan `μA[x]`, memiliki 2 kemungkinan, yaitu:


    *   satu (1), yang berarti bahwa suatu item menjadi anggota dalam suatu himpunan,
    atau

    *   nol (0), yang berarti bahwa suatu item tidak menjadi anggota dalam suatu himpunan.


    Contoh 1 metode crisp: diketahui: `S = {1,2,3,4,5,6}` adalah semesta pembicaraan.


    `A = {1,2,3}`; `B = {3,4,5}`; bisa dikatakan bahwa:


    *   Nilai keanggotaan 2 pada himpunan `A`, `μA[2] = 1`, karena 2 ∈ `A`.

    *   Nilai keanggotaan 3 pada himpunan `A`, `μA[3] = 1`, karena 3 ∈ `A`.

    *   Nilai keanggotaan 4 pada himpunan `A`, `μA[4] = 0`, karena 4 ![](images/00013.gif)
    `A`.

    *   Nilai keanggotaan 2 pada himpunan `B`, `μB[2] = 0`, karena 2 ![](images/00014.gif)
    `B`.

    *   Nilai keanggotaan 3 pada himpunan `B`, `μB[3] = 1`, karena 3 ∈ `B`.


    Contoh 2 metode crisp: misalkan variabel umur dibagi menjadi 3 kategori, yaitu:


    Muda : `0 ≤ umur < 35` tahun; Parobaya : `35 ≤ umur ≤ 55`; Tua : `umur > 55` tahun


    Nilai keanggotaan secara grafis, himpunan Muda, Parobaya, dan Tua ini dapat dilihat
