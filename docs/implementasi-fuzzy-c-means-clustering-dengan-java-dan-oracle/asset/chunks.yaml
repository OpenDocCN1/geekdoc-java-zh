    \ Kelas ini akan menampilkan derajat keangotaan masing-masing data yang sudah\
    \ terklaster beserta tanggal.\n\n![](images/00067.gif)\n\n#### 4.3.5.2 Kelas chartFrame\n\
    \nKelas chartFrame berfungsi untuk menampilkan grafik dari data IHSG BEJ yang\
    \ masih belum terklaster. Kelas ini terdiri dari 3 hal utama, yakni:\n\n*   createDataSet:\
    \ untuk menampung data yang akan digunakan.\n\n*   createChart: untuk membuat\
    \ grafik dari data yang tertampung dalam DataSet.\n\n*   createDemoPanel: sebagai\
    \ tempat dari grafiknya.\n\n![](images/00068.gif)\n\n#### 4.3.5.3 Kelas markerFrame\n\
    \n       Kelas markerFrame berfungsi untuk menampilkan grafik dari data-data IHSG\
