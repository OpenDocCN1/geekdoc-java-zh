    ### 4.3.2 Fase Proses Klasterisasi


    Pada fase proses klasterisasi terdapat beberapa tahap yang sudah dijelaskan pada
    bab perancangan perangkat lunak. Berikut ini adalah beberapa kode program yang
    mencerminkan tahap perancangan tersebut.


    #### 4.3.2.1 Proses Generate Data Input


    Berikut ini adalah kode program untuk mendapatkan nilai random yang dipersyaratkan
