  trans: "\n\n滚动到屏幕底部，选择按类别筛选 `Book Example` 并添加任务 `Update Location and Ext Number\
    \ (BookBasicUpdateLocAndExtNo)`。\n\n| ![](img/image_rsrc8RV.jpg) |\n\n| 图 2-29\
    \ 显示了我们选择的任务。 |\n\n## 2.3 配置 (Provisioning)\n\n本主题的目标是理解配置（配置）是如何运作的。实现配置需要 4\
    \ 个配置步骤：\n\n*   步骤 1：获取端点 (Endpoint)\n    *   `Endpoint` 可以是 `Microsoft Active\
    \ Directory` 或数据库。\n*   步骤 2：创建账户模板 (Account Template)\n    *   关联到 `endpoint`。\n\
    \    *   `Account template` 定义了全局用户与账户之间的属性映射。\n*   步骤 3：创建配置角色 (Provisioning\
    \ Role)\n    *   关联到 `account templates`。\n    *   一个配置角色可以拥有多个 `account templates`。\n\
    *   步骤 4：将用户添加到配置角色中\n\n整个步骤如图所示。\n\n| ![](img/image_rsrc8RW.jpg) |\n\n| 图 2-30\
    \ 显示了所有步骤和相关界面。 |\n\n### 2.3.1 账户模板与属性映射\n\n`Account templates` 定义了（全局）用户如何在受管的\
    \ `endpoint` 中表示。默认情况下，`account templates` 使用 `Rule String`（规则字符串）定义映射，例如 `%USA%`\
    \ 或 `%UC%`。你可以在官方文档 `Administration Guide` 中查看更多详情。定义映射有两种方式：\n\n1.  `Rule String`：官方文档为某些属性定义了\
    \ `Rule String`，并非所有属性。\n2.  `Global User attributes`（全局用户属性）：如果没有 `Rule String`\
    \ 映射，你可以使用这种。格式为 `%#<attribute name>%`。\n\n例如，账户模板中的城市（city）属性，你可以放置：\n\n*   `Rule\
    \ String`: `%UC%`\n*   `Global User attributes`: `%eTCity%`\n\n两种方式得到的结果相同。下图显示了账户模板中全局用户属性的城市（city）值。\n\
    \n| ![](img/image_rsrc8RX.jpg) |\n\n| 图 2-31 显示了账户模板中的全局用户属性。 |\n\n另一个使用全局用户属性的示例是图中的账户容器（account\
    \ container）。例如，如果 `eTGlobalUser` 具有 `eTLocation=northamerica`，那么容器将是 `eTADSOrgUnitName=Users`,\
    \ `eTADSOrgUnitName=NorthAmerica`。这些值都是全局用户属性。\n\n| ![](img/image_rsrc8RY.jpg)\
    \ |\n\n| 图 2.32 显示了账户模板和全局用户属性界面 |\n\n### 2.3.2 配置目录 (Provisioning Directory)\n\
    \n你可以从配置目录中获取全局用户属性。你必须使用 `Client LDAP`（如 `JXplorer`）连接配置目录。你可以从 `Management Console`\
    \ 获取配置存储信息。选择 `Provisioning store` 并检查 `URL`。\n\n| ![](img/image_rsrc8RZ.jpg)\
    \ |\n\n| 图 2-33 显示了配置目录的连接性。 |\n\n全局用户 (Class: `eTGlobalUser`)\n\n在配置目录内部，浏览到路径\
    \ `eTGlobalUserContainerName=Global Users, eTNamespaceName=CommonObjects, dc=im,\
    \ dc=eta`，该位置保留了所有全局用户。\n\n选择一个用户，你可以看到属性名称和值。（你可以在账户模板中使用此属性名称）\n\n| ![](img/image_rsrc8S0.jpg)\
    \ |\n\n| 图 2-34 显示了全局用户的路径和属性 `eTCity`。 |\n\n账户 (Class: `eTADAccount`)\n\n如果你已经在端点\
    \ `Active Directory` 中拥有一些账户，那么请浏览路径 `eTADSDirectoryName=<Endpoint Name>, eTNamespaceName=ActiveDirectory,\
    \ dc=im, dc=eta`。它代表 `Endpoint (Active Directory)`。\n\n| ![](img/image_rsrc8S1.jpg)\
    \ |\n\n| 图 2-35 显示了账户对象的属性 |\n\n位于 `eTADSDirectory` 路径下的对象 `eTADAccount` 代表账户（Account）。如果你直接在账户对象（`eTADAccount`）中修改某些值，该值将立即反映在\
    \ Active Directory 的值上。例如，我们将 `eTADSl`（代表城市 City）的值从“New York”更改为“New York Test”，并查看\
    \ Active Directory，值也会随之改变。\n\n| ![](img/image_rsrc8S2.jpg) |\n\n| 图 2-36 显示了\
    \ eTADAccount 与 AD Account 关系 |\n\n我们不建议直接在账户对象（`eTADAccount`）内部更改任何值，因为 CA IdentityMinder\
    \ 将其视为内部处理。当你进行编程并尝试修改值但遇到错误时，这可能对调试有用。你可能会打印该值并直接放入账户对象中。看看是否允许。\n\n访问全局用户或账户的另一种选择是使用\
    \ `Provisioning Manager`，但你无法从界面看到属性名称。\n\n### 2.3.3 属性映射：用户 - 全局用户 - 账户\n\n为了更好地理解，本节描述了从用户到全局用户以及从全局用户到账户的属性映射。\n\
    \n用户存储 (User Store)\n\n从 `Management Console` 检查用户存储连接信息，并使用任何 LDAP 客户端（如 `JXplorer`）登录用户存储。\n\
    \n| ![](img/image_rsrc8S3.jpg) |\n\n| 图 2.-37 显示了用户存储的连接性 |\n\n我们可以在 `Management\
    \ Console` 中看到属性映射：用户属性到全局用户属性。在 `Management Console` 中，选择 `Environment > your\
    \ environment > Advanced Settings > Provisioning > Attribute Mappings`。\n\n| ![](img/image_rsrc8S4.jpg)\
    \ |\n\n| 图 2-38 显示了 Management Console 中的映射 |\n\n图中显示了从用户到账户的属性映射。在 `Management\
    \ Console` 中，用户将全局用户属性 `eTCity` 映射到账户模板（Account Template）。\n\n| ![](img/image_rsrc8S5.jpg)\
    \ |\n\n| 图 2-39 显示了映射 |\n\n### 2.3.4 同步 (Synchronization)\n\n我们学习了用户到账户的属性映射，接下来需要学习它是如何工作的。\n\
    \n当全局用户创建时？\n\n在配置角色（provisioning role）中，我们使用默认值 = all。\n\n| ![](img/image_rsrc8S6.jpg)\
    \ |\n\n| 图 2-40 显示了全局用户创建时 |\n\n属性同步时？\n\n在任务中选择“Account Synchronization”选项将触发配置。\n\
    \n| ![](img/image_rsrc8S7.jpg) |\n\n| 图 2-41 显示了同步下拉菜单 |\n\n什么是用户同步？\n\n用户同步下拉菜单将涉及配置策略集。我们将讨论配置策略集。\n\
    \n| ![](img/image_rsrc8S8.jpg) |\n\n| 图 2-42 显示了同步下拉菜单 |\n\n## 2.4 配置策略集 (Policy\
    \ Set) 和 Xpress\n\n回到我们的示例，我们创建：\n\n*   `Policy Set` 映射城市到国家\n*   `Policy Xpress`\
    \ 拼接号码和扩展\n\n| ![](img/image_rsrc8S9.jpg) |\n\n| 图 2-43 显示了如何实现需求 |\n\n### 2.4.1\
    \ 配置策略集 (Policy Set)\n\n配置策略是在用户满足特定条件时发生的业务变更。打开 CA IdentityMinder 控制台并选择 `Policies`\
    \ 标签页，点击菜单 `Create Policy Set`。\n\n| ![](img/image_rsrc8SA.jpg) |\n\n| 图 2-44\
    \ 显示了“Create Policy Set”菜单 |\n\nProfile 标签卡\n\n第一个标签卡 Profile，放置如下值：\n\n| Field\
    \ Name | Value | Description |\n| :--- | :--- | :--- |\n| Name | Set Address |\
    \ 策略集名称 |\n| Category | Book Example | 类别名称 |\n| Description | Set Address | |\n\
    \n不要点击提交，点击 `Policies Tab`。\n\n| ![](img/image_rsrc8SB.jpg) |\n\n| 图 2-45 显示了“Profile”标签页中的值\
    \ |\n\nPolicies 标签页\n\n此标签页包含两个部分：`Policy Set Member Rule` 和 `Identity Policies`。`Policy\
    \ Set Member Rule` 说明配置策略适用于谁？在我们的示例中，我们使用默认值 = all，这意味着所有用户都符合此成员规则。\n\n| ![](img/image_rsrc8SC.jpg)\
    \ |\n\n| 图 2-46 显示了成员规则等于所有用户 |\n\n接下来，我们需要创建一个配置策略：当城市为“New York”时设置地址。点击 `Add`\
    \ 按钮，放置值：\n\n| Field Name | Value |\n| :--- | :--- |\n| Policy Name | New York\
    \ Address |\n| Policy Condition | |\n| City | New York |\n| Action on Apply Policy\
    \ | |\n| Country | United States |\n\n| ![](img/image_rsrc8SH.jpg) |\n\n| 图 2-47\
    \ 显示了定义配置策略的界面 |\n\n点击“OK”，将返回 `Policies` 界面。\n\n| ![](img/image_rsrc8SJ.jpg)\
    \ |\n\n| 图 2-48 显示了 Policies 任务的完成 |\n\n"
