  trans: "\n\n*   步骤 3：`ProviderAccessor` 将城市属性值提交为“New Town”（新镇）。现在城市属性已更改为“New Town”。\n\
    *   步骤 4：当修改 `User` 事件完成时，`CA IdentityMinder` 从由 `BLTHContext` 修改过的任务中提交城市属性值。\n\
    \n步骤 1 – 3 发生在同步阶段。步骤 2 和 3 由业务逻辑任务处理器执行。步骤 4 属于异步阶段。\n\n| ![](img/image_rsrc8UG.jpg)\
    \ |\n| :--- |\n| 图 4-26 显示了修改的执行序列 |\n\n### 4.4.5 业务逻辑任务处理器和屏幕\n\n在本示例中，我们将编写程序从管理员任务（admin\
    \ task）的屏幕中获取数据。此用示展示了：\n\n*   如何获取当前分机号码并显示在屏幕上。\n*   验证用户输入。分机号码必须存在且仅为数字。\n\
    *   展示如何向用户回传错误消息。\n*   使用会话属性（session attribute）在方法之间共享分机号码。\n\n#### 代码\n\n1.\
    \ 编译我们的 Java 代码：`com.book.idm.blth.ModifyUserAndScreen`\n2. 将类（包含包文件夹 `com.book.idm.blth`）拷贝到文件夹\
    \ `\\IdentityMinder.ear\\custom`。\n\n#### 配置\n\n1. 以管理员身份登录 `Identity Manager\
    \ User Console`。\n2. 选择标签页 `Roles` 和 `Tasks`，并选择菜单 `modify admin task`。\n3. 搜索并选择我们的管理员任务名称：`Update\
    \ Location and Ext Number`（更新位置和分机号）。\n4. 点击 `Business Logic Task Handlers` 按钮，然后点击图标\
    \ `pencil`。\n5. 按照如下所示修改值。\n\n| 字段名称 | 值 |  |\n| :--- | :--- | :--- |\n| Java\
    \ Class | `com.book.idm.blth.ModifyUserAndScreen` | 我们放在 custom 文件夹中的 Java 类 |\n\
    \n#### 工作原理\n\n我们可以通过以下步骤通过管理员任务执行我们的代码：\n\n1. 以管理员身份登录 `Identity Manager User\
    \ Console`。\n2. 选择标签页：`Book Example` 并选择菜单：`Basic`。\n3. 选择管理员任务：`Update Location\
    \ and Ext Number`。\n4. 然后搜索并选择一些用户。\n\n#### handleSetSubject(): 在屏幕上显示当前电话号码\n\
    \n`handleSetSubject()` 方法在屏幕初始化显示时调用。因此我们在此方法内部实现设置显示分机号。\n\n| ![](img/image_rsrc8UH.jpg)\
    \ |\n| :--- |\n| 图 4-27 分机号的当前值已显示在屏幕上 |\n\n设置分机号码，我们需要做两件事：\n\n*   获取当前电话号码\n\
    *   设置屏幕逻辑属性的值：`|ExtNumber|`\n\n获取当前电话号码并不新奇，我们使用 `ProviderAccessor` 获取该值。\n\n\
    ```java\nString userid = blthContext.getUser().getUniqueName();\nUser user = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null);\nString telephoneNumber = (String)user.getAttribute(\"telephoneNumber\"\
    );\n```\n\n请想象管理员任务的屏幕。当我们定义管理员任务时：\n\n*   在管理员任务内部，有标签页（tabs）。\n*   我们的管理员任务有一个配置标签页（profile\
    \ tab）。\n*   在标签页内部，有一个屏幕（screen）。\n*   在屏幕内部，有字段（fields）。\n\n| ![](img/image_rsrc8UJ.jpg)\
    \ |\n| :--- |\n| 图 4-28 显示了管理员任务配置中的标签页屏幕 |\n\n在管理员任务内部，我们有标签页。我们调用方法 `getTaskTabHandlers()`\
    \ 返回此管理员任务的所有标签页。\n\n```java\nVector<TabHandler> tabs = blthContext.getTaskTabHandlers();\n\
    for (TabHandler tab : tabs) {\n```\n\n我们的管理员任务有一个配置标签页，所以我们需要检查 `ProfileTabHandler`\
    \ 的类型。如果你有多个配置标签页，你需要条件来检查屏幕的标签名（tag name）。我们检查屏幕标签名 `BookBasicUpdateLocationAndExtNo`。（在我们的示例中只有一个标签页，你可以跳过此条件）\n\
    \n```java\n// 检查标签类型\nif (tab instanceof ProfileTabHandler) {\n    ProfileTabHandler\
    \ profileTab = (ProfileTabHandler) tab;\n    String screenName = profileTab.getScreenHandler().getScreen().getTag();\n\
    \    if(screenName.equals(\"BookBasicUpdateLocationAndExtNo\")){\n```\n\n我们可以通过使用\
    \ `updateRawData()` 方法设置屏幕上的值。\n\n```java\nHashMap<String, String> data = new\
    \ HashMap<String, String>();\ndata.put(\"|ExtNumber|\", telephoneNumber.substring(telephoneNumber.indexOf(\"\
    x\") + 1));\n...profileTab.updateRawData(data);\n```\n\n在屏幕内部，我们有字段。我们创建一个新的 `HashMap`\
    \ 对象。我们放入键值对，键的名称 `|ExtNumber|` 来自于管理员任务中的屏幕定义。如果你想设置城市属性，可以使用与用户存储（user store）相同的属性名。城市属性使用“l”作为键。\n\
    \n#### handleValidation (): 验证用户输入\n\n在用户提交管理员任务后，如果分机号码为空或输入了某些字符，将显示错误。\n\n\
    | ![](img/image_rsrc8UK.jpg) |\n| :--- |\n| 图 4-29 显示了错误消息 |\n\n我们必须重写 `handleValidation()`\
    \ 方法。我们可以通过 `getRawData()` 方法从屏幕获取任何字段。如果你不确定字段名称，可以通过该方法打印。\n\n"
- fmt: "\nCA IdentityMinder is shipped with a predefined business logic task handler\
    \ that checks for possible duplication of objects before object creation. For\
    \ example, the name of a newly created role must be unique. When a role is about\
    \ to be created, the predefined business logic task handler validates whether\
    \ the name of the new role already exists. If the name does exist, the handler\
    \ throws an exception indicating that the role name must be unique, and the administrator\
    \ has the opportunity to change the name and resubmit the task.\n\nWe can write\
    \ code by using `ProviderAccessor` search role name.\n\n```java\nboolean isUnique\
    \ = false;\ntry{\n    //Search by friendlyName\n    AccessRole role = blthContext.getAccessRoleProvider().findAccessRole(roleName);\n\
    } catch(NoSuchObjectException e){\n    isUnique = true;\n}\nif(!isUnique){\n \
    \   IMSException imsEx = new IMSException();\n    imsEx.addUserMessage(\"The role\
    \ name must be unique\");\n    throw imsEx;\n}\n```\n\n### Disable a user account\
    \ after the maximum failed login attempts\n\nAfter a user fails to log in three\
    \ consecutive times, the account is immediately disabled in the data store. Because\
    \ the account is updated directly in the data store rather than in the task session,\
    \ CA IdentityMinder does not generate an event for this action, and any workflow\
    \ approval process, auditing, and security checks that may be associated with\
    \ this action are bypassed. After the final login attempt, a custom message advises\
    \ the user that the account is disabled.\n\nThe use case said the user account\
    \ is updated (disable) directly in the data store. This use case mean using `ProviderAccessor`\
    \ update user attributes directly. (For update account attribute directly, please\
    \ see book volume II)\n\n### Assign a user to a group during self-registration\n\
    \nA user who self-registers with the job title Benefits Administrator is assigned\
    \ to the group HR. This update is made in the task session, through a call to\
    \ `assignResources()` in `RelationshipTabHandler`. This update triggers the event\
    \ `AddToGroupEvent`, allowing the group assignment to be subject to auditing and\
    \ workflow approval.\n\nWe use business logic task handler modify the value in\
    \ tab as below code.\n\n```java\nFor (TabHandler tab : tabs) {\n    RelationshipTabHandler\
    \ rTab = (RelationshipTabHandler)tab;\n    rTab.assignResources(groups);\n}\n\
    ```\n\n### Assign “manager” attribute for a new user\n\nAn administrator wants\
    \ to set a value of “manager” before the profile is displayed on the screen. A\
    \ business logic task handler could be written that would implement the `handleSetSubject()`\
    \ method for initialization. This method would assign the administrator’s name\
    \ to the attribute for the manager’s name. If the name of the administrator is\
    \ not available, an exception is thrown.\n\nWe write code in method `handleSetSubject`\
    \ to initial the manager attribute.\n\n```java\npublic void handleSetSubject(BLTHContext\
    \ blthContext) throws Exception {\n    String managerId = blthContext.getAdminFriendlyName();\n\
    \    if(managerId == null){\n        throw new IMSException(\"administrator’s\
    \ name is not available\");\n    }\n    HashMap<String, String> screenFields =\
    \ new HashMap<String, String>();\n    screenFields.put(\"managerId\", managerId);\n\
    \    tab.updateRawData(screenFields);\n}\n```\n\n## 4.6 Conclusion\n\nThis chapter\
    \ we learn basic programming of Business Logic Task Handler API Concepts. We can\
    \ make short note as follow:\n\n#### Implement business logic task handler\n-\
    \ There are 2 steps: coding and configuration.\n- For Coding, you have to write\
    \ java class that extends `BLTHAdapter` and override methods as need.\n    - `handleStart()`,\
    \ it will call when user select admin task.\n    - `handleSetSubject()` for setting\
    \ field before display.\n    - `handleValidation()` for validating.\n    - `handleSubmission()`\
    \ will execute when user submit, after validation.\n    - Compile and copy to\
    \ folder `\\IdentityMinder.ear\\custom`.\n- There are 2 levels of BLTH configuration:\
    \ global and task-specific.\n\n#### Access to managed objects\n- There are 2 ways:\
    \ by `ProviderAccessor` and `BLTHConext` (task session)\n- BLTH, we have to consider:\n\
    \    - What is primary object?\n    - The modified attributes are defined in admin\
    \ task?\n\n#### Programming Note\n- The user’s attribute names in code are the\
    \ physical names in user store.\n- You can use `getRawData()` and `setRawData()`\
    \ access the values on screen.\n- We can display message on screen by `IMSException`\
    \ object.\n- We can use session keeps value and share between methods.\n\nThe\
    \ Business Logic Task Handler API performs business logic in synchronous phase.\
    \ In asynchronous phase, we use workflow perform business logic. The next chapter\
    \ is workflow.\n\n# Chapter 5 Workflow\n\nThe CA IdentityMinder official document\
    \ does not have much detail about work flow. We learned some basic concepts from\
    \ previous chapter:\n- If requirement requires approver, you need workflows.\n\
    - Workflow runs under asynchronous phase.\n- Workflows can have a long life. It\
    \ may take time up to an hour or month.\n- The Business Logic Task Handler has\
    \ been done before workflow start.\n\nThis chapter, you will learn both workflow\
    \ API and how to create custom workflow.\n\n## 5.1 Workflow Concepts\n\nYou must\
    \ enable workflow in Management Console. By default, workflow is disabled.\n\n\
    #### Configuration: Management Console\n1. In the Management Console, select an\
    \ Environment.\n2. Go to Advanced Settings, Workflow.\n3. Select the `Enabled`\
    \ check box, and click Save.\n4. Restart the application server.\n\n![](OEBPS/image_rsrc8UM.jpg)\n\
    \nFigure 5-1 shows workflow properties in Management Console.\n\nIn the event\
    \ mappings table, there are some default mappings between event and global workflow.\n\
    \n### 5.1.1 Default Workflow Features\nThis section, we will learn default workflow\
    \ features in CA IdentityMinder. We cover these topics:\n- Workflow Level: workflow\
    \ can run admin task or event.\n- Select Workflows: which workflow can execute.\n\
    - Policy Base: it is condition to start workflow.\n- Task and screen for Approver.\n\
    - Approver: who is approver.\n- Expected Outcome: the final result: approve or\
    \ reject.\n\n#### Workflow Level\nWorkflow can run at admin task and/or Event\
    \ level. What level should be? It is depending on requirements. For example, we\
    \ have admin task “Modify User”, our admin task has 2 tabs: Profile Tab and Access\
    \ Role. So events will be generated from this admin task divides as 2 groups:\n\
    - The first group of events came from profile tab; events will be generated when\
    \ user’s attributes have been modified.\n- The second group of events came from\
    \ access role tab; events will be generated when we add or remove access role.\n\
    \n![](OEBPS/image_rsrc8UN.jpg)\n\nFigure 5-2 shows all events from example admin\
    \ task.\n\nWe have 2 requests: request to modify user’s attributes from the profile\
    \ tab and another one request to add/remove role from the access role tab.\n-\
    \ Scenario1: all requests (both modify user’s attributes and add/remove role)\
    \ need only one workflow for approval, we should specific workflow as Admin Task\
    \ Level.\n- Scenario2: only modify user’s attributes request (profile’s tab) require\
    \ approver, we should specific workflow at Event Level: `ModifyUserEvent`. \n\
    - Scenario3: only add role (access role tab) request requires approver, we should\
    \ specific workflow at Event Level: `AssignAccessRoleEvent`. \n- Scenario4: Any\
    \ requests (modify user’s attributes and add/remove role) require Manager as first\
    \ approver.\n    - Modify user’s attributes request requires HR manager as second\
    \ approver.\n    - Adding role request requires IT manager second approver.\n\n\
    We specific the first approver workflow at Admin Task Level and the HR and IT\
    \ workflow at Event Level: `ModifyUserEvent` and `AssignAccessRoleEvent`. This\
    \ case shows in the picture below.\n\n![](OEBPS/image_rsrc8UP.jpg)\n\nFigure 5-3\
    \ shows workflow of Scenario4.\n\nAdmin Task Level\n"
