    \ current = new Date();\n    Calendar calendar = Calendar.getInstance();\n   \
    \ calendar.setTime(current);\n    calendar.set(Calendar.MINUTE, calendar.get(Calendar.MINUTE)+10);\n\
    \    //yyyy-MM-dd HH:mm:ss\n    SimpleDateFormat simpleDateFormat = new SimpleDateFormat(\"\
    yyyy-MM-dd HH:mm:ss\");\n    String executeTime = simpleDateFormat.format(calendar.getTime());\n\
    \    SymbolData r1 = symbolTable.add(\"Result1\");\n    r1.addValue(executeTime);\n\
    }\n```\n\n延迟节点支持在评估日期选项页中通过配置延迟时间。详情请参阅工作点文档。\n\n## 节点提交 (Node Commit)\n\n我们有一条规则：在完成工作流之前必须进行通过或拒绝。在这个示例中，我们只需要一条路径。因此我们只需要通过状态，但我们将名称命名为“Commit（提交）”。\n\
    \n## 错误工作流\n\n有时，你在工作流上进行编程会遇到一些错误。你应该取消你的任务或事件。我们不应该在系统中留下未完成的流程。你可以在“查看已提交的任务（View\
    \ Submitted task）”中取消。\n\n| ![](img/image_rsrc8X1.jpg) |\n| 图 5-73 显示了查看提交任务屏幕中的取消事件按钮\
    \ |\n\n### 5.3.3 分类 (Category)\n\n分类是对象的组组。我们可以使用分类来过滤对象。这对于管理我们的工作流非常有用。在这个示例中，你将学习：\n\
    \n* 如何创建分类并将对象添加到分类中。\n* 使用库搜索对象。\n* 导出工作流。\n\n### 创建分类\n\n1. 点击菜单 `Library（库）`\
    \ > `Category（分类）`。\n\n| ![](img/image_rsrc8X2.jpg) |\n| 图 5-74 显示了库菜单中的分类菜单 |\n\
    \n2. 点击新建（new）按钮并输入名称“BookExample” |\n\n| ![](img/image_rsrc8X3.jpg) |\n| 图 5-75\
    \ 显示了新建按钮。 |\n\n### 将对象添加到分类\n\n选择我们的流程和脚本并添加分类。\n\n* 流程（Process）\n* 在画布上点击右键\n\
    * 选择属性（properties）并选择标签页：`category（分类）`\n* 选择“BookExample”并点击添加按钮\n* 节点（`Activity`,\
    \ `Automated`, `Server Automated`, `Delay`, `Transition`），你不需要操作，它将遵循流程的分类。\n\
    * 节点或转换内部的脚本\n* 编辑脚本\n* 选择标签页 `category（分类）`\n* 选择“BookExample”并点击添加按钮\n\n| ![](img/image_rsrc8X4.jpg)\
    \ |\n| 图 5-76 显示了脚本的分类 |\n\n### 按分类过滤\n\n在我们添加分类后，我们可以在转换的条件或节点的代理人（agents）中进行过滤。\n\
    \n| ![](img/image_rsrc8X5.jpg) |\n| 图 5-77 显示了用于过滤的分类按钮 |\n\n### 导出工作流\n\n我们可以导出工作流并导入到\
    \ UAT 或生产环境。\n\n* 选择菜单 `File（文件）` > `Export（导出）`\n* 输入文件名并点击下一步。\n* 你可以使用分类进行过滤。\n\
    * 我们通常导出我们过的对象：`Category（分类）`, `Process（流程）` 和 `Script（脚本）`\n\n| ![](img/image_rsrc8X6.jpg)\
    \ |\n| 图 5-78 显示了导出菜单和按分类过滤的导出屏幕\n\n请查看附录 A，我们有关于导入工作流的详情。\n\n## 5.4 工作点编程 (WorkPoint\
    \ Programming)\n\n现在你学习了一些 Workpoint 示例。这一部分在你学习了一些示例代码后，包含额外的概念。\n\n### 5.4.1\
    \ Activity, Server Automated 和 Automated\n\n有 3 种节点：`Activity`![](img/image_rsrc8X7.jpg),\
    \ `Server Automated`![](img/image_rsrc8V8.jpg) 和 `Automated`![](img/image_rsrc8V7.jpg)。我们有\
    \ 3 种活动、自动化和服务器自动化的类型。在“常规（general）”标签页中有复选框。下面的图片显示了复选框与节点类型之间的关系。\n\n| ![](img/image_rsrc8X8.jpg)\
    \ |\n| 下图 5-79 显示了复选框与节点类型之间的关系 |\n\n### 5.4.2 Server Automated 和 Automated 的脚本\n\
    \n`Server Automated`![](img/image_rsrc8V8.jpg) 和 `Automated`![](img/image_rsrc8V7.jpg)\
    \ 的脚本是不同的。如果你使用节点 `Automate` 来实现业务逻辑，你必须编写额外的代码通过代码完成活动。下面的图片显示我们使用了 Automate\
    \ 节点“Check City Value”，在逻辑完成后流程没有继续移动。\n\n| ![](img/image_rsrc8X9.jpg) |\n| 图\
    \ 5-80 显示流程停止在自动化节点且不再移动。 |\n\n我们可以通过添加代码完成活动来修复上面的图片。\n\n```java\npublic void\
    \ completeActivity(ClientContext cc,ActivityInstData ad,SymbolTable st) throws\
    \ Exception{\nshort workitem = Short.parseShort((String)st.getSymbol(\"WorkItemIteration\"\
    ).getPrimaryValue());\nWorkItemEntry workItemEntry = WorkItemEntry.queryByID(cc,\
    \ ad.getActivityInstID(),workitem);\nshort currentState = workItemEntry.getWorkStateID();\n\
    if (currentState == WorkItemConst.WORK_STATE_AVAILABLE) {workItemEntry.changeState(WorkItemConst.WORK_STATE_OPEN);}workItemEntry.changeState(WorkItemConst.WORK_STATE_COMPLETE);}\n\
    ```\n\n注意 3：使用服务器自动化实现业务逻辑。（推荐）\n\n关于这个主题，我们建议使用服务器自动化。你不需要担心完成活动。\n\n### 5.4.3\
    \ (此处重复标题)\n\n`Server Automated`![](img/image_rsrc8V8.jpg) 和 `Automated`![](img/image_rsrc8V7.jpg)\
    \ 的脚本是不同的。如果你使用节点 `Automate` 实现业务逻辑，你必须编写额外的代码通过代码完成活动。下面的图片显示我们使用了 Automate 节点“Check\
    \ City Value”，在逻辑完成后流程没有继续移动。\n\n| ![](img/image_rsrc8X9.jpg) |\n| 图 5-80 显示流程停止在自动化节点且不再移动。\
    \ |\n\n我们可以通过添加代码完成活动来修复上面的图片。\n\n```java\npublic void completeActivity(ClientContext\
    \ cc,ActivityInstData ad,SymbolTable st) throws Exception{\nshort workitem = Short.parseShort((String)st.getSymbol(\"\
    WorkItemIteration\").getPrimaryValue());\nWorkItemEntry workItemEntry = WorkItemEntry.queryByID(cc,\
    \ ad.getActivityInstID(),workitem);\nshort currentState = workItemEntry.getWorkStateID();\n\
    if (currentState == WorkItemConst.WORK_STATE_AVAILABLE) {workItemEntry.changeState(WorkItemConst.WORK_STATE_OPEN);}workItemEntry.changeState(WorkItemConst.WORK_STATE_COMPLETE);}\n\
    ```\n\n注意 3：使用服务器自动化实现业务逻辑。（推荐）\n\n关于这个主题，我们建议使用服务器自动化。你不需要担心完成活动。\n\n### 5.4.3\
    \ Server Automated 和 Automated 的脚本\n\n代理脚本可以是同步的（Synchronous）或异步的（Asynchronous）。了解什么是同步或异步：\n\
    \n* 同步脚本意味着脚本的状态规则。\n* 异步脚本意味着脚本的脚本脚本。\n\n| ![](img/image_rsrc8XA.jpg) |\n| 图\
    \ 5-81 显示了代理脚本 |\n\n同步脚本与状态更改在同一事务中执行。异步脚本独立执行。需要知道：\n\n* 如果你使用脚本修改 `User Data`，脚本必须同步执行。\n\
    * 如果你想完成活动，脚本必须异步执行。\n\n注意 4：服务器自动化的代理脚本应指定为同步。\n\n### 5.4.4 保存作业对象 (Saving Objects)\n\
    \n在官方文档：编程指南中，工作流中有一个“保存作业”主题。\n\n什么是保存对象？`Job` 是流程的实例。保存作业意味着你想在节点之间共享某些值。例如：\n\
    \n* 你有节点 1 连接节点 2，节点 2 连接节点 3。\n* 节点 1 修改值 `X=1`\n* 节点 3 可以看到 `X`\n\n因此我们需要在流程级别的用户数据中声明变量\
    \ `X`。这与为工作流指定 `TASK_LEVEL` 的步骤相同。\n\n| ![](img/image_rsrc8XB.jpg) |\n| 图 5-82\
    \ 显示了流程属性中的用户数据标签页 |\n\n官方文档告诉开发者在异步时保存 `Job 的 User Data`。这需要特殊的代码。\n\n所有同步脚本必须使用\
    \ `ThisJobData` 或 `ThisActivityInstData` 来获取 `User Data`。\n\n当你在异步脚本中保存作业时，必须编写如下代码：\n\
    \n```javascript\nvar jobTableId = ThisJobData.getJobID();\nvar job = Job.queryByID(ClientContext,jobTableId,true);\n\
    job.setUserData(\"Test\",\"Pass\");\njob.save();\n```\n\n### 5.4.5 搜索引用 (Search\
    \ reference)\n\n有时，由于某些引用，你无法删除某些对象。例如，你想删除脚本，但由于引用而报错。你想知道哪个流程或作业使用了该脚本。点击菜单\
    \ `library` > `scripts`，对 `script` 点击右键并选择 `search references（搜索引用）` 或 `search\
    \ dialog（搜索对话框）`。搜索对话框提供了更多选项，如果你想搜索作业，请勾选对话框中的 `jobs` 选项。\n\n| ![](img/image_rsrc8XD.jpg)\
    \ |\n| 图 5-84 显示搜索引用 |\n\n注意 5：在删除流程之前删除相关的作业。\n\n"
- fmt: "\nIf you deleted process before job, you will get complicated when you want\
    \ to delete script. You select script and search references; you will see some\
    \ jobs refer to scripts. You can’t access all relate jobs because you already\
    \ deleted process. You have to open job one by one and delete each job.\n\nSo\
    \ we suggest delete all related jobs before delete process.\n\n## 5.5 Use cases\
    \ examples\n\nIn the official CA IdentityMinder document talked about use case\
    \ examples. Please see Programming Guides › Programming Guide for Java › Workflow\
    \ API › Workflow API Overview › Use Case Examples for full details\n\n### Determine\
    \ workflow direction based on a `User` object attribute\n\nThe first activity\
    \ in a workflow process for a `CreateUserEvent` is an automated activity with\
    \ three conditional transitions leading from it. The condition script in each\
    \ transition retrieves the email attribute from the `User` object contained in\
    \ the event. The next activity that the workflow process performs is determined\
    \ by the outcome of the condition scripts, as follows:\n\n*   The transition `CA.COM\
    \ SUFFIX`, goes to one approver: HR Manager.\n*   The transition `SECURITY.COM\
    \ SUFFIX`, goes to 2 approvers: HR Manager and IT Manager.\n*   The transition\
    \ `EMAIL INVALID`, reject workflow\n\nThe document said using condition script\
    \ in each transition retrieves the email. You can write the transition’s condition\
    \ with java code.\n\n| ![](OEBPS/image_rsrc8XE.jpg) |\nFigure 5-85 shows workflow\
    \ of use case\n\n### Update a CA IdentityMinder object during a workflow process\n\
    \nIn the previous use case example, suppose the condition script for the transition\
    \ `CA.COM SUFFIX` is updated to check whether the email attribute is blank. If\
    \ it is blank, the script constructs an email address from the user’s ID and the\
    \ default suffix `ca.com`. The script assigns the address to the `email` attribute\
    \ of the `User` object. The script then returns `true`, and the transition is\
    \ performed as in the previous example. The updated object is saved when CA IdentityMinder\
    \ completes the execution of the event.\n\nThere are 2 interesting things:\n\n\
    *   The condition script for the transition `CA.COM SUFFIX` is updated to check\
    \ whether the email attribute is blank.\n    *   You can do the logic inside condition\
    \ script of transition “CA.COM SUFFIX”\n*   The script assigns the address to\
    \ the `email` attribute of the `User` object.\n    *   We can assign the address\
    \ to `email` attribute by `ProviderAccessor` and `Workflow Context`. For this\
    \ case, we have to use `Workflow context` because of 2 reasons. The first one\
    \ is `CreateUserEvent`. I means user not created until event has been done. The\
    \ second reason, this workflow requires approver. If it rejected, we have to concern\
    \ outcome.\n\nWe plan to modify `email` attribute in `workflow context`, you have\
    \ to make sure you define `email` attribute in `fields` tab when you create admin\
    \ task.\n\n### Validate an object from a workflow process using third-party data\n\
    \nThe workflow process for a `CreateUserEvent` contains an automated activity\
    \ that retrieves the new user’s credit score from a third-party database. First,\
    \ the activity script calls the `Workflow API` to retrieve the event and the `User`\
    \ object within the event. Then, after the script retrieves the user’s credit\
    \ score, it uses the workflow engine’s `API` to write the credit score to the\
    \ `User Data` for the activity, and finally completes the activity. Transition\
    \ scripts leading from the activity then use the workflow engine’s `API` to retrieve\
    \ the credit score from the `User Data` and evaluate it to determine the subsequent\
    \ course of the workflow process.\n\nWe can use script in server automated to\
    \ call third party data. For example, you call the third party to get type and\
    \ determine path.\n\n| ![](OEBPS/image_rsrc8XF.jpg) |\nFigure 5-86 shows workflow\
    \ calls the third party data\n\n## 5.6 Conclusion\n\nThis chapter, you learned\
    \ `workflow context API` or how to create custom workflow. We can conclude concept\
    \ of workflow as:\n\nThe check list before create work flow:\n\n*   What is level\
    \ of workflow? admin task level or event level\n*   Which workflow? Choose from\
    \ 3 default workflow or create new custom workflow?\n*   Do we need policy (or\
    \ condition) before workflow starts?\n*   What screen (task) for approver?\n*\
    \   Who is approver?\n*   What is outcome?\n\nRule of custom work flow\n\n*  \
    \ Rule 1: Must start with a “Start” node and end with a “Stop” node\n*   Rule\
    \ 2: Must have `Approve` or `Reject` before go to Stop node\n*   Rule 3: `Approver\
    \ Configuration` (If you require approver)\n*   Rule 4: workflow at admin task\
    \ level (Optional)\n\nNote for custom workflow\n\n*   Note 1: `WorkflowContext`,\
    \ calling method from the parent class (`EventContext`) properly.\n*   Note 2:\
    \ Keep transition’s condition simple\n*   Note 3: Using server automated implement\
    \ business logic. (Recommendation)\n*   Note 4: `Agent script` of server automated\
    \ should designate as synchronous.\n*   Note 5: Delete related jobs before delete\
    \ process.\n\nYou may think `workflow API` is difficult, my suggesting you just\
    \ remember rules and notes in this chapter. For programming detail, please see\
    \ book volume II contains a lot of examples. You will familiar it. The business\
    \ logic task handler and workflow is useful in real project. The next chapter,\
    \ we will go the rest of APIs.\n\n# Chapter 6: Additional APIs\n\nWe learned 2\
    \ main `API` to develop business logics; business logic task handler under synchronous\
    \ phase and workflow under asynchronous phase. These APIs in this chapter is helpers\
    \ to achieve the goals.\n\nThere are a lot of details in this chapter. You may\
    \ not need to pay attention to all APIs. My opinion, I give summary the table\
    \ below:\n\n| API Name | Frequency | Purpose |\n| :--- | :--- | :--- |\n| `Participant\
    \ Resolver API` | sometimes | Determines who is approver |\n| `Event Listener\
    \ API` | often | Performs custom business logic when event occurs |\n| `Logical\
    \ Attribute API` | rarely | Convert between physical and logical attributes |\n\
    | `Validation Rules` | sometimes | Validate values |\n| `Email & Notification\
    \ Rule API` | sometimes | Sending email |\n| `Task Execution Web Service` | sometimes\
    \ | Enable admin task as web services |\n\n## 6.1 Participant Resolver API\n\n\
    The `Participant Resolver API` is a part of workflow. The `Participant Resolver\
    \ API` determines the participants in a workflow activity. A participant is a\
    \ person who is authorized to approve in workflow.\n\nIf workflow requires approver\
    \ (for example SingleStepApproval), you need to select the participant resolver\
    \ in configuration screen.\n\n| ![](OEBPS/image_rsrc8XG.jpg) |\nFigure 6-1 shows\
    \ the participant resolver screen\n\nCA IdentityMinder provides configurable condition\
    \ for participant resolver, see official document “Types of Participant Resolvers”\
    \ for more details. We need the participant resolver API, when configurable condition\
    \ is not support.\n\n### 6.1.1 Programming\n\nUsing the `ParticipantResolver API`,\
    \ you must create class extend `ParticipantResolverAdapter` and override method\
    \ `resolve()`; The return value is a vector of user objects containing the list\
    \ of participants.\n\n```\npublic Vector resolve(ParticipantResolverContext ctx,\
    \ Hashtable data, String approvalNodeName)\n```\n\nThere are 3 parameters passed\
    \ from workflow. The first one is context same as `BLTHContext` or `WorkflowContext`.\
    \ The second parameter `HashTable` has key value `TASK_TAG` contain admin task\
    \ name. The last parameter string contain node name in workflow.\n\n### 6.1.2\
    \ Code Example: Participant Resolver API\n\nThis example uses the workflow; SingleStepApproval.\
    \ The SingleStepApproval workflow has 2 approvers; the primary approver and default\
    \ approver. The primary approver calls our `ParticipantResolver` code. For default\
    \ approver, we use our administrator.\n\nOur requirement want the primary approver\
    \ is manager or manager is approver. If user does not have manager of manager,\
    \ use manager. If user does not have manager, skip to default approver.\n\nCode\n\
    \n3.  Compile our java code: `com.book.idm.etc.MgrOfMgrParticipantResolver`\n"
