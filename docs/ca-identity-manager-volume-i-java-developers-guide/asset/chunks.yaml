  trans: "\n\n*   任务执行 Web 服务允许管理员任务作为 Web 服务提供程序\n\nCA 通过书架 > CA IdentityMinder >\
    \ 编程 > Javadoc 编程参考提供每个 API 的 Java 文档。下一章将详细介绍业务逻辑任务处理器 API。\n\n# 第 4 章 业务逻辑任务处理器\n\
    \n业务逻辑任务 Handler API（或 `BLTH`）用于在管理员任务层级执行业务逻辑的 API。业务逻辑任务处理器具有以下独特特性：\n\n*  \
    \ 业务逻辑任务 Handler API 在管理员任务会话级别工作。\n*   业务逻辑任务 Handler API 在同步阶段执行。\n    *   这意味着用户必须等待逻辑执行完成。\n\
    *   业务逻辑任务 Handler API 必须在任何事件创建之前完成。\n*   业务逻辑任务 Handler API 适用于：\n    *   验证和格式化任务屏幕字段。\n\
    \    *   强制执行需要立即响应（同步）的自定义业务逻辑。\n\n## 4.1 编程与配置概念\n\n业务逻辑任务 Handler API 可以通过\
    \ Java 或服务器端 JavaScript 实现。本本书仅使用 Java 语言。对于服务器端 JavaScript，可以查阅详细的官方文档。我们将使用\
    \ `java` 作为所有 API 的统一语言，并且还可以从 Java 工具库中受益。\n\n### 4.1.1 编程\n\n实现业务逻辑任务 Handler\
    \ API，我们只需创建一个 `java` 类并扩展 `BLTHAdapter` 类并重写方法。每个方法都是回调方法，将在管理员任务的生命周期内执行。你可以根据需求实现部分或所有方法：\n\
    \n*   `handleStart()`：在任务开始时执行。\n*   `handleSetSubject()`：在从搜索结果中选择主体（例如选择用户）后执行。它用于设置屏幕上的初始值。\n\
    *   `handleValidation()`：在用户提交任务后执行。用于验证逻辑。\n*   `handleSubmission()`：在 `handleValidation()`\
    \ 之后执行。用于执行逻辑处理。\n\n#### 开发步骤\n\n1.  编写扩展 `BLTHAdapter` 的 `java` 代码。\n2.  编译并确保没有错误，且使用的\
    \ `JDK` 版本与服务器版本一致。\n3.  将类文件（包括包文件夹）复制到文件夹 `\\IdentityMinder.ear\\custom` 中。\n\
    \n### 4.1.2 配置\n\n业务逻辑任务处理器可以通过两种范围进行配置：\n\n*   **全局业务逻辑任务处理器**：此级别意味着它将应用于所有管理员任务。当调用任何管理员任务时，我们的\
    \ `java` 代码都会执行。\n*   **特定任务的业务逻辑任务处理器**：此 `java` 代码将在配置的特定管理员任务中执行。此范围在本书中使用频率最高。\n\
    \n#### 全局业务逻辑任务处理器\n\n它们在管理台中配置，选择 Home > Environments > `<your server>` > Advanced\
    \ Settings > Business Logic Task Handlers。\n\n| ![](img/image_rsrc8TR.jpg) |\n\
    | 图 4-1 显示了全局业务逻辑任务处理器的屏幕 |\n\n|\n\n你可以点击 `New` 按钮配置业务逻辑任务处理器。配置屏幕上的每个字段与特定任务业务逻辑任务处理器相同。\n\
    \n#### 特定任务的业务逻辑任务处理器\n\n此级别适用于特定的管理员任务。步骤如下：\n\n1.  以管理员身份登录 Identity Manager\
    \ 用户控制。\n2.  搜索管理员任务名称。\n3.  点击 `Business Logic Task Handlers` 按钮，然后点击 `Add` 按钮指定特定的\
    \ `java` 类名。\n\n| ![](img/image_rsrc8TS.jpg) |\n| 图 4-2 显示了任务特定性的 `Business Logic\
    \ Task Handlers` 按钮 |\n\n## 4.2 任务会话\n\n任务会话是执行任务的实例。在任务执行期间，业务逻辑任务处理器可以访问当前任务会话中的信息。任务会话信息可以通过\
    \ `BLTHContext` 获取。接口提供了检索当前任务会话中托管对象运行时实例的方法，例如：\n\n*   方法 `getUser()`：获取参与当前任务的\
    \ `User` 对象。\n    *   请注意，如果管理员任务的主对象是 `User`（例如修改用户），则 `getUser()` 将有效。如果你的管理员任务是修改端点，则调用\
    \ `getUser()` 没有意义。\n*   获取任何关系对象（如角色和组组）。\n\n`BLTHContext` 继承自许多父接口：\n\n*   `TaskInfo`：关于当前任务的信息，例如：`getSubject()`\
    \ 返回主对象。\n*   `IMContext`：提供关于会话的方法，用于在 API 之间共享会话。该接口还提供了 `getAuxDataRoot()`\
    \ 方法访问辅助数据树的根节点。\n*   `ProviderAccessor`：提供直接访问数据存储中任何托管对象的权限。我们将在下一节中讨论托管对象。\n\
    \n## 4.3 访问托管对象\n\n托管对象是指数据存储中的对象，如用户或帐户。业务逻辑任务处理器可以通过以下 2 方式访问托管对象：\n\n#### 通过\
    \ ProviderAccessor\n\n`Provider Access` 是 `BLTHContext` 的父类：\n\n*   可以访问任何托管对象。\n\
    *   可以访问托管对象的任何属性。\n*   当调用 `modifyObject()` 时，对托管对象进行的任何更改都会立即持久化到数据存储中。\n  \
    \  *   不会生成事件，也不会执行工作流审批、审计或安全检查。\n\n#### 通过 Context\n\n本章中的 `Context` 指 `BLTHContext`，其他章节指\
    \ `WorkflowContext`、`EventContext` 等。\n\n*   限制访问任务会话，包括任务的主体（主对象）和主体的关系。\n  \
    \  *   例如管理员任务：修改用户。上下文可以访问 `User` 对象。\n*   限制访问属性\n    *   例如如果管理员任务只定义了城市属性，则无法访问国家属性。\n\
    *   更改在事件完成后将提交。\n    *   例如你使用 `BLTHContext` 修改城市，但用户事件（内部事件）会被拒绝。城市属性将不会提交。\n\
    CA IdentityMinder 为任务生成事件，并可以执行工作流审批、审计和安全检查。\n\n| ![](img/image_rsrc8TT.jpg)\
    \ |\n| 图 4-3 显示了访问托管对象的 2 种方式 |\n\n下表比较了 `BLTHContext` 和 `ProviderAccessor` 的区别：\n\
    \n| 主题 | ProviderAccessor | BLTHContext |\n| :--- | :--- | :--- |\n| 访问对象 | 可以访问任何托管对象\
    \ | 仅访问任务会话相关的对象 |\n| 访问属性 | 可以访问任何属性 | 限制访问，取决于你如何定义管理员任务 |\n| 修改值 | 调用 `modifyObject()`\
    \ 时，修改的值立即提交到数据存储中 | 在事件完成之前，值不会提交 |\n| 事件 | 不生成额外的事件 | 与任务相关的事件 |\n\n我们将在下一节和后续章节中通过示例涵盖更多托管对象的细节。\n\
    \n## 4.4 代码示例\n\nCA IdentityMinder 编程部分，我们使用名为 `IdmCode` 的 `java` 项目。我们重用上一节的管理员任务。我们将仅使用业务逻辑任务\
    \ Handler API 执行管理员任务，因此我们需要禁用上一节的 Identity Policy Set 和 policy Xpress。\n\n| ![](img/image_rsrc8TU.jpg)\
    \ |\n| 图 4-4 显示通过取消勾选启用框来禁用 Identity Policy Set 和 Policy Xpress |\n\n### 4.4.1\
    \ 基础编程：BLTHAdapter 和生命周期\n\n此示例逐步演示了业务逻辑任务处理器的基础编程。CA IdentityMinder 编程始终两个部分：编码和配置。此示例仅演示业务逻辑任务\
    \ Handler API 的生命周期。我们将打印到日志文件中。\n\n#### 代码\n\n1.  运行 eclipse 并选择 `java` 类：\n\
    \    *   包：`com.book.idm.blth`\n    *   类：`BasicLifeCycle`\n    *   扩展 `BLTHAdapter`\n\
    \n以下列表显示了我们的代码\n\n"
- fmt: "\n```java\npackage com.book.idm.blth;\nimport com.netegrity.imapi.BLTHAdapter;\n\
    import com.netegrity.imapi.BLTHContext;\n\npublic class BasicLifeCycle extends\
    \ BLTHAdapter {\n    @Override\n    public void handleStart(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleStart\"\
    );\n    }\n\n    @Override\n    public void handleSetSubject(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleSetSubject\"\
    );\n    }\n\n    @Override\n    public void handleValidation(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleValidation\"\
    );\n    }\n\n    @Override\n    public void handleSubmission(BLTHContext blthContext)\
