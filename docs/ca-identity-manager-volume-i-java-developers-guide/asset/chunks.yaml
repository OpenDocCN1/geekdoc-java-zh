  trans: "\n\n如果你在删除作业之前先删除了进程（process），当你想要删除脚本时会遇到麻烦。你选择脚本并搜索引用；你会看到某些作业引用了脚本。由于你已经删除了进程，你无法访问所有相关的作业。你必须一个一个打开作业并删除每一个作业。\n\
    \n因此，我们建议在删除进程之前删除所有相关的作业。\n\n## 5.5 用例示例\n\n官方 CA IdentityMinder 文档讨论了用例示例。请参阅“Programming\
    \ Guides › Programming Guide for Java › Workflow API › Workflow API Overview ›\
    \ Use Case Examples”获取完整详细信息。\n\n### 根据 `User` 对象属性确定工作流方向\n\n`CreateUserEvent`\
    \ 工作流过程中的第一个活动是一个自动化活动，它引出了三个条件条件跳转。每个跳转的条件脚本从事件包含的 `User` 对象中获取电子邮件（email）属性。工作流过程执行的下一个活动由条件脚本的结果决定，如下所示：\n\
    \n*   跳转 `CA.COM SUFFIX` 指向一个审批者：HR 经理（HR Manager）。\n*   跳转 `SECURITY.COM SUFFIX`\
    \ 指向 2 个审批者：HR 经理和 IT 经理（IT Manager）。\n*   跳转 `EMAIL INVALID` 拒绝工作流。\n\n文档提到，在每个跳转中使用条件脚本来获取电子邮件。你可以使用\
    \ Java 代码编写跳转的条件。\n\n| ![](img/image_rsrc8XE.jpg) |\n图 5-85 显示了用例的工作流\n\n### 在工作流过程中更新\
    \ CA IdentityMinder 对象\n\n在在上一个用例示例中，假设跳转 `CA.COM SUFFIX` 的条件脚本已更新，用于检查电子邮件属性是否为空。如果为空，脚本将根据用户的\
    \ ID 和 默认后缀 `ca.com` 构造电子邮件地址。脚本将该地址分配给 `User` 对象的 `email` 属性。然后脚本返回 `true`，并按照上一个示例中的方式执行跳转。当\
    \ CA IdentityMinder 完成事件的执行时，更新后的对象将被保存。\n\n这里有 2 个很有意思的点：\n\n*   跳转 `CA.COM SUFFIX`\
    \ 的条件脚本已更新，用于检查电子邮件属性是否为空。\n    *   你可以在跳转“CA.COM SUFFIX”的条件脚本内部编写逻辑。\n*   脚本将地址分配给\
    \ `User` 对象的 `email` 属性。\n    *   我们可以通过 `ProviderAccessor` 和 `Workflow Context`\
    \ 将地址分配给 `email` 属性。对于这种情况，我们必须使用 `Workflow context`，原因有两个。第一个是 `CreateUserEvent`。我的意思是事件完成之前用户尚未被创建。第二个原因是，此工作流需要审批者。如果被拒绝，我们需要考虑结果。\n\
    \n我们计划修改 `workflow context` 中的 `email` 属性，你必须在创建管理任务时在 `fields` 标签页中定义 `email`\
    \ 属性。\n\n### 使用第三方数据从工作流过程中验证对象\n\n`CreateUserEvent` 工作流过程包含一个自动化活动，该活动从第三方数据库获取新用户的评分。首先，活动脚本调用\
    \ `Workflow API` 获取事件以及事件中的 `User` 对象。然后，在脚本获取用户评分后，它使用工作流引擎的 `API` 将评分写入活动的 `User\
    \ Data` 中，最后完成活动。引导该活动的跳转脚本随后使用工作流引擎的 `API` 从 `User Data` 中检索评分并对其进行评估，以确定工作流过程的后续走向。\n\
    \n我们可以使用服务器自动化（server automated）中的脚本来调用第三方数据。例如，你调用第三方来获取类型并确定路径。\n\n| ![](img/image_rsrc8XF.jpg)\
    \ |\n图 5-86 显示了工作流调用第三方数据\n\n## 5.6 结论\n\n在本章中，你学习了 `workflow context API` 或如何创建自定义工作流。我们可以将工作流的概念总结为：\n\
    \n创建工作流之前的检查列表：\n\n*   工作流的级别是什么？管理任务级别（admin task level）还是事件级别\n*   哪一个工作流？从\
    \ 3 个默认工作流中选择还是创建一个新的自定义工作流？\n*   工作流开始之前是否需要策略（或条件）？\n*   审批者使用哪个界面（任务）？\n* \
    \  谁是审批者？\n*   结果是什么？\n\n自定义工作流的规则\n\n*   规则 1：必须以“Start”（开始）节点开始并以“Stop”（停止）节点结束\n\
    *   规则 2：在进入 Stop 节点之前必须有 `Approve`批准）或 `Reject`拒绝）\n*   规则 3：`Approver Configuration`审批者配置（如果你需要审批者）\n\
    *   规则 4：工作流位于管理任务级别（可选）\n\n自定义工作流的注意事项\n\n*   注意 1：`WorkflowContext` 正确调用来自父类（`EventContext`）的方法。\n\
    *   注意 2：保持跳转条件的简单。\n*   注意 3：使用服务器自动化实现业务逻辑。（建议）\n*   注意 4：服务器自动化的 `Agent script`\
    \ 应该被指定为同步。\n*   注意 5：在删除进程之前删除相关作业。\n\n你可能认为认为 `workflow API` 很难，我建议你只需记住本章中的规则和注意事项。关于编程细节，请参阅包含大量示例的第二卷书籍。你会熟悉它的。业务逻辑任务处理器（business\
    \ logic task handler）和工作流在实际项目中非常有用。下一章，我们将介绍其余 API。\n\n# 第 6 章：其他 API\n\n我们学习了用于开发业务逻辑\
    \ 2 个主要的 `API`：同步阶段下的业务逻辑任务处理器和异步阶段下的工作流。本章中的这些 API 是实现目标的工具。\n\n本章中有很多细节。你可能不需要关注所有的\
    \ API。我的观点如下表所示：\n\n| API 名称 | 频率 | 用途 |\n| :--- | :--- | :--- |\n| `Participant\
    \ Resolver API` | 有时 | 确定审批者 |\n| `Event Listener API` | 经常 | 事件发生时执行自定义业务逻辑 |\n\
    | `Logical Attribute API` | 罕见 | 在物理和逻辑属性之间转换 |\n| `Validation Rules` | 有时 | 验证值\
    \ |\n| `Email & Notification Rule API` | 有时 | 发送邮件 |\n| `Task Execution Web Service`\
    \ | 有时 | 将管理任务启用 Web 服务 |\n\n## 6.1 Participant Resolver API\n\n`Participant Resolver\
    \ API` 是工作流的一部分。`Participant Resolver API` 决定工作流中的参与者。参与者是被授权审批的人员。\n\n如果工作流需要审批（例如\
    \ SingleStepApproval），你需要在配置界面选择参与者。\n\n| ![](img/image_rsrc8G.jpg) |\n图 6-1 显示了参与者界面\n\
    \nCA IdentityMinder 为参与者提供了配置条件，详情请参官方文档“Types of Participant Resolvers”。当不支持配置条件时，我们需要参与者\
    \ API。\n\n### 6.1.1 编程\n\n使用 `Participant Resolver API`，你必须创建一个扩展 `ParticipantResolverAdapter`\
    \ 的类并重写 `resolve()` 方法；返回包含参与者列表的。\n\n```\npublic Vector resolve(ParticipantResolverContext\
    \ ctx, Hashtable data, String approvalNodeName)\n```\n\n工作流传递了 3 个参数。第一个类似于 `BLTHContext`\
    \ 或 `WorkflowContext`。第二个参数 `HashTable` 具有键值 `TASK_TAG` 包含任务名称。最后一个参数字符串包含工作流中的节点名称。\n\
    \n### 6.1.2 代码示例：Participant Resolver API\n\n此示例使用了工作流；SingleStepApproval。SingleStepApproval\
    \ 工作流有 2 个审批者；主审批者和默认审批者。主审批者调用我们的 `ParticipantResolver` 代码。对于默认审批者，我们使用管理员。\n\
    \n我们的需求是主审批者是经理或经理是审批者。如果用户没有经理，则使用经理。如果用户没有经理，则跳到默认审批者。\n\n代码\n\n3.  编译我们的 Java\
    \ 代码：`com.book.idm.etc.MgrOfMgrParticipantResolver`\n\n"
- fmt: "\n# 4. Copy class (include package folder `com.book.idm.etc`) to folder `\\\
    <server>\\IdentityMinder.ear\\custom`\n\n## Configuration: Management Console\n\
    \n1. In the Management Console, click `Environments`.\n2. Click the name of the\
    \ environment.\n3. Click `Advanced Settings`.\n4. Click `Workflow Participant\
    \ Resolvers`.\n5. Click `new` button and put value as the below table:\n\n| Field\
    \ Name | Value | Description |\n| :--- | :--- | :--- |\n| Name | `MgrOfMgrParticipantResolver`\
    \ | Name of Participant Resolver |\n| Class | `com.book.idm.etc.MgrOfMgrParticipantResolver`\
    \ | Name of our java class |\n\n## Configuration: Identity Manager User Console\n\
    \n1. Log into the Identity Manager User Console as `administrator`.\n2. Search\
    \ our admin task name: `Update Location and Ext Number`.\n   * Please disable\
    \ business logic task handler, `policy Xpress` or workflow from previous example.\n\
    3. Select tab `event` and click `ModifyUserEvent`.\n4. Select Non-Policy Based\
    \ workflow: `singleStepApproval`.\n   * For Primary Approver:\n     * Approval\
    \ Task drop down, select `Approve Modify User`\n     * Participant Resolver drop\
    \ down, select `Custom: MgrOfMgrParticipantResolver`\n   * For Default Approver:\n\
    \     * Approval task drop down, select `Approve Modify User`\n     * Participant\
    \ Resolver drop down, select your `administrator`.\n\n| ![](OEBPS/image_rsrc8XH.jpg)\
    \ |\n| :--- |\n| Figure 6-2 shows workflow configuration |\n\n## How it works\n\
    \nYou have to prepare 3 users: `user A`, `user B` and `user C`. Login to user\
    \ data store and check attribute `managerID`:\n* `User A` has `managerID` = `user\
    \ B`\n* `User B` has `managerID` = `user C`\n* `User C` has `managerID` = “”\n\
    \nLog into the Identity Manager User Console as `administrator`, Select tab: `Book\
    \ Example`.\n\n### Case 1: Modify user A, participant is Manager of Manager\n\n\
    4. Select Admin Task: `Update Location and Ext Number`, then search and select\
    \ `user A`. Modify city’s attribute and submit admin task.\n5. Login as `user\
    \ C`, you should see request for approval.\n\n### Case 2: Modify user B, Participant\
    \ is Manager\n\n1. Select Admin Task: `Update Location and Ext Number` again and\
    \ select `user B`. Modify city’s attribute and submit admin task.\n2. Login as\
    \ `user C`, you should see request for approval.\n\n### Case 3: Modify user C,\
    \ There is no manager\n\n1. Select Admin Task: `Update Location and Ext Number`\
    \ again and select `user C`. Modify city’s attribute and submit admin task.\n\
    2. Login as `administrator`, you should see request for approval.\n\n## Find manager\
    \ of manager\n\nWe use `ProviderAccess` find the manager. We get user then we\
    \ look up attribute `managerID`, and search manager by `managerID` and so on until\
    \ we get manager of manager. \n\n```java\nString userId = ctx.getSubject().getFriendlyName();\n\
    User user = ctx.getUserProvider().findUser(userId, null);\nString managerID =\
    \ user.getAttribute(\"managerID\");\nUser managerUser = ctx.getUserProvider().findUser(managerID,\
    \ null);\nString mgrOfMgrID = managerUser.getAttribute(\"managerID\");\nUser mgrOfMgrUser\
    \ = ctx.getUserProvider().findUser(mgrOfMgrID, null);\nresolver.add(mgrOfMgrUser);\n\
    ```\n\n## Add participants\n\nThe code is pretty straightforward. We create `Vector`\
    \ object and add object `User` who is participant to object.\n\n```java\nVector\
    \ resolver = new Vector();\nresolver.add(mgrOfMgrUser);\n```\n\n## No manager\
    \ of manager\n\nIf user does not have manager of manager, we will return manager.\n\
    \n```java\nif(mgrOfMgrID == null || mgrOfMgrID.trim().length()==0){\n    System.out.println(userId+\"\
    \ has only manager \"+managerID);\n    resolvers.add(managerUser);\n    return\
    \ resolvers;\n}\n```\n\nIf there are no approver, just return empty vector.\n\n\
    ### 6.1.3 Use Case Example\n\nIn official document (Programming Guide for Java\
    \ > Workflow API > Participant Resolver API > Participant Resolver Overview >\
    \ Use Case Example) give one use case example.\n\n### Assign a group’s administrators\
    \ as participants\n\nWorkflow approval is required whenever a user is added to\
    \ the group `HR`. A `custom participant resolver` assigns the administrators of\
    \ the group as participants in the workflow activity. When a user is added to\
    \ `HR`, the event `AddToGroupEvent` comes under workflow control, and cannot be\
    \ completed successfully until a designated participant approves the activity.\n\
    \nThis workflow runs specific event level `AddToGroupEvent`. We can write the\
    \ condition, if group’s name equals “HR”, return approver. If group’s name does\
    \ not equal “HR”, return empty vector.\n\n```java\npublic Vector resolve(ParticipantResolverContext\
    \ ctx, Hashtable userData, String approvalNodeName) throws Exception {\n    Vector\
    \ resolver = new Vector();\n    AddToGroupEvent event = (AddToGroupEvent)ctx.getEvent();\n\
    \    String groupName = event.getGroup().getFriendlyName();\n    if(groupName.equals(\"\
    HR\")){\n        resolver = event.getGroup().getAdmins(null);\n    }\n    return\
    \ resolver;\n}\n```\n\nWe get group from event. We can get administrator of this\
    \ group by method `getAdmins()`. Please see java doc for more details.\n\n## 6.2\
    \ Event Listener API\n\nWhen `CA IdentityMinder` executes an admin task, it breaks\
    \ down the task into its component events. Each event represents a specific action\
    \ to be performed during the execution of the task, for example a `CreateUserEvent`\
    \ is adding the new user.\n\nAn event listener listens to a specific event or\
    \ a group of events. When the event occurs, the event listener performs custom\
    \ business logic that is appropriate for the event and the current event state.\n\
    \n### 6.2.1 Programming\n\nFor Event Listener API, you must create `java class`\
    \ extend `EventListener`.\n\n### 6.2.2 Code Example: Event Listener\n\nOur example\
    \ shows life cycle of listener. It use standard out.\n\n```java\npublic void before(EventContext\
    \ ctx) {\n    // Performs custom logic during Pre-approval\n}\npublic void approved(EventContext\
    \ ctx) {\n    // Performs custom logic during Approved state\n}\npublic void rejected(EventContext\
    \ ctx) {\n    // Performs custom logic during Rejected state\n}\npublic void after(EventContext\
    \ ctx) {\n    // Performs custom logic during Post-execution\n}\npublic void failed(EventContext\
    \ ctx) {\n    // Performs custom logic after execution state\n}\n```\n\nEvery\
    \ method return constant of `EventListenerAdapter`; `BREAK` or `CONTINUE`. One\
    \ event can have many listeners. If return `BREAK` means no more listeners are\
    \ processed for the current state. If return `CONTINUE` means processing for this\
    \ event listener is complete. My suggestion we should always return `CONTINUE`,\
    \ it will not break other listeners in future.\n"
  raw: "4.  Copy class (include package folder ” com.book.idm.etc” ) to folder “<server>\\\
    IdentityMinder.ear\\custom”\n\nConfiguration: Management Console\n\n1.  In the\
    \ Management Console, click Environments.\n\n2.  Click the name of the environment.\n\
    \n3.  Click Advanced Settings.\n\n4.  Click Workflow Participant Resolvers.\n\n\
    5.  Click new button and put value as the below table\n\n| Field Name | Value\
    \ | Description |\n\n| Name | MgrOfMgrParticipantResolver | Name of Participant\
    \ Resolver |\n\n| Class | com.book.idm.etc.MgrOfMgrParticipantResolver | Name\
    \ of our java class |\n\nConfiguration: Identity Manager User Console\n\n1.  Log\
    \ into the Identity Manager User Console as administrator.\n\n2.  Search our admin\
    \ task name: Update Location and Ext Number.\n\n*   Please disable business logic\
    \ task handler, policy Xpress or workflow from previous example.\n\n3.  Select\
    \ tab event and click ModifyUserEvent.\n\n4.  Select Non-Policy Based workflow:\
    \ singleStepApproval\n\n*   For Primary Approver:\n\n*   Approval Task drop down,\
    \ select Approve Modify User\n\n*   Participant Resolver drop down, select Custom:\
    \ MgrOfMgrParticipantResolver\n\n*   For Default Approver:\n\n*   Approval task\
    \ drop down, select Approve Modify User\n\n*   Participant Resolver drop down,\
    \ select your administrator.\n\n| ![](OEBPS/image_rsrc8XH.jpg) |\n\n| Figure 6-2\
    \ shows workflow configuration |\n\nHow it works\n\nYou have to prepare 3 users: \
    \ user A, user B and user C. Login to user data store and check attribute managerID:\n\
    \n*   User A has managerID = user B\n\n*   User B has managerID = user C.\n\n\
    *   User C has managerID = “”\n\nLog into the Identity Manager User Console as\
    \ administrator, Select tab: Book Example\n\nCase 1: Modify user A, participant\
    \ is Manager of Manager\n\n4.  Select Admin Task: “Update Location and Ext Number”,\
    \ then search and select user A. Modify city’s attribute and submit admin task.\n\
    \n5.  Login as user C, you should see request for approval\n\nCase 2: Modify user\
    \ B, Participant is Manager\n\n1.  Select Admin Task: “Update Location and Ext\
    \ Number” again and select user B. Modify city’s attribute and submit admin task.\n\
    \n2.  Login as user C, you should see request for approval\n\nCase 3: Modify user\
    \ C, There is no manager\n\n1.  Select Admin Task: “Update Location and Ext Number”\
    \ again and select user C. Modify city’s attribute and submit admin task.\n\n\
    2.  Login as administrator, you should see request for approval\n\nFind manager\
    \ of manager\n\nWe use ProviderAccess find the manager. We get user then we look\
    \ up attribute managerID, and search manager by managerID and so on until we get\
    \ manager of manager.\n\n| String userId = ctx.getSubject().getFriendlyName();User\
    \ user = ctx.getUserProvider().findUser(userId, null);String managerID = user.getAttribute(\"\
    managerID\");User managerUser = ctx.getUserProvider().findUser(managerID, null);String\
    \ mgrOfMgrID = managerUser.getAttribute(\"managerID\");User mgrOfMgrUser = ctx.getUserProvider().findUser(mgrOfMgrID,\
    \ null);resolver.add(mgrOfMgrUser); |\n\nAdd participants\n\nThe code is pretty\
    \ straightforward. We create vector object and add object User who is participant\
    \ to object.\n\n| Vector resolver = new Vector();resolver.add(mgrOfMgrUser); |\n\
    \nNo manager of manager\n\nIf user does not have manager of manager, we will return\
    \ manager\n\n| if(mgrOfMgrID == null&#124;&#124;mgrOfMgrID.trim().length()==0){System.out.println(userId+\"\
    \ has only manager \"+managerID);resolvers.add(managerUser);return resolvers;}\
    \ |\n\nIf there are no approver, just return empty vector.\n\n### 6.1.3 Use Case\
    \ Example\n\nIn official document (Programming Guide for Java > Workflow API >\
    \ Participant Resolver API > Participant Resolver Overview > Use Case Example)\
    \ give one use case example.\n\nAssign a group’s administrators as participants\n\
    \n| Workflow approval is required whenever a user is added to the group HR. A custom\
    \ participant resolver assigns the administrators of the group as participants\
    \ in the workflow activity. When a user is added to HR, the event AddToGroupEvent\
    \ comes under workflow control, and cannot be completed successfully until a designated\
    \ participant approves the activity. |\n\nThis workflow runs specific event level\
    \ AddToGroupEvent. We can write the condition, if group’s name equals “HR”, return\
    \ approver. If group’s name does not equal “HR”, return empty vector.\n\n| public\
    \ Vector resolve(ParticipantResolverContext ctx, Hashtable userData, String approvalNodeName)\
    \ throws Exception {Vector resolver = new Vector();AddToGroupEvent event = (AddToGroupEvent)ctx.getEvent();String\
    \ groupName = event.getGroup().getFriendlyName();if(groupName.equals(\"HR\")){resolver\
    \ = event.getGroup().getAdmins(null);}return resolver;} |\n\nWe get group from\
    \ event. We can get administrator of this group by method getAdmins(). Please\
    \ see java doc for more details.\n\n## 6.2 Event Listener API\n\nWhen CA IdentityMinder\
    \ executes an admin task, it breaks down the task into its component events. Each\
    \ event represents a specific action to be performed during the execution of the\
    \ task, for example a CreateUserEvent is adding the new user.\n\nAn event listener\
    \ listens to a specific event or a group of events. When the event occurs, the\
    \ event listener performs custom business logic that is appropriate for the event\
    \ and the current event state.\n\n### 6.2.1 Programming\n\nFor Event Listener\
    \ API, you must create java class extend EventListenerAdapter and override methods\
    \ as needs.\n\n*   int  before(EventContext evtCtx)\n\n    *   Performs custom\
    \ business logic during the Pre-approval state.\n\n*   int  approved(EventContext\
    \ evtCtx)\n\n    *   Performs custom business logic during the Approved state.\n\
    \n*   int  rejected(EventContext evtCtx)\n\n    *   Performs custom business logic\
    \ during the Rejected state.\n\n*   int  after(EventContext evtCtx)\n\n    * \
    \  Performs custom business logic during the Post-execution state.\n\n*   int \
    \ failed(EventContext evtCtx)\n\n    *   Performs custom business logic after\
    \ execution failure state.\n\nEvery method return constant of EventListenerAdapter;\
    \ BREAK or CONTINUE. One event can has many listeners. If return BREAK means no\
    \ more event listeners are processed for the current event state. If return CONTINUE\
    \ means processing for this event listener is complete. CA IdentityMinder processes\
    \ the next event listener in the same event state. My suggestion, we should always\
    \ return CONTINUE, it will not break other listeners in future.\n\n### 6.2.2 Code\
    \ Example: Event Listener API\n\nOur example shows life cycle of listener. It\
    \ use standard out printing message.\n\nCode\n\n1.  Compile our java code: com.book.idm.etc.LifeCycleEventListener\n\
    \n2.  Copy class (include package folder ” com.book.idm.etc” ) to folder “\\IdentityMinder.ear\\\
    custom”\n\nConfiguration\n\n1.  In the Management Console, click Environments.\n\
    \n2.  Click the name of the environment where the event listener will be used.\n\
    \n5.  Click Advanced Settings.\n\n6.  Click Event Listeners.\n\n7.  Click new\
    \ button and put value as the below table\n\n| Field Name | Value | Description\
    \ |\n\n| Name | LifeCycleEventListener | Name of event listener |\n\n| Class |\
    \ com.book.idm.etc.LifeCycleEventListener | Name of our java class |\n\n| Listener\
    \ Level | ModifyUserEvent | Event that class is listening to |\n\n| ![](OEBPS/image_rsrc8XJ.jpg)\
    \ |\n\n| Figure 6-3 shows event listener configuration |\n\n8.  Click Restart\
    \ Environment.\n\nConfiguration: Identity Manager User Console\n\n1.  Log into\
    \ the Identity Manager User Console as administrator.\n\n2.  Search our admin\
    \ task name: Update Location and Ext Number.\n\n*   Please disable business logic\
    \ task handler, policy Xpress or workflow from previous example.\n\n3.  We require\
    \ one workflow for testing our event listener in case of reject or approve. Select\
    \ tab event and click ModifyUserEvent.\n\n*   Select Non-Policy Based: singleStepApproval.\n\
    \n*   For primary approver and default approver\n\n*   Approval Task drop down,\
    \ select Approve Modify User\n\n*   Participant Resolver drop down, select your\
    \ administrator.\n\nHow it works\n\nExecute admin task: Update Location and Ext\
    \ Number."
