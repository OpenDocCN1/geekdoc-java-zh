    ### 5.3.2 Workflow: Delay by city


    This example shows advance techniques. We do programming in `activity`, `delay`
    and `transition`. Our requirement is user modify the city. If new value of city
    equals `New York`, the process will delay for 10 minutes. If new value of city
    is some things else, it will not delay. Our flow will show in the picture:


    | ![](OEBPS/image_rsrc8W6.jpg) |

