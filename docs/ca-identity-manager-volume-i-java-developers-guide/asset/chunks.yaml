    | ctx.setLogicalAttributeValue(officeCode, officeCodeValue); |


    Method: toPhysical()


    This method is reverse of toLogical(). The steps are same but reverse.


    *   Step 1: Look up logical attribute value.


    *   Step 2: Mapping, convert to be physical value.


    *   Step 3: Set value back to physical attribute.


    | @Overridepublic void toPhysical(LogicalAttributeContext ctx) throws Exception
    {//step 1String officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);String
    officeCodeValue = ctx.getLogicalAttributeValue(officeCode);//step 2String cityValue
    = indexLogicalAsKey.get(officeCodeValue);//step 3String city = ctx.getPhysicalAttributeName(ATTR_REFER_PHY);ctx.setPhysicalAttributeValue(city,
    cityValue);} |


    Attributes in admin task


    We declare 3 fields on screen:


    *   2 logical attributes:|officeCode| (dropdown) and |officeCodeList| (hidden)
    are required for dropdown.


    *   1 physical attribute: City (hidden) we need because we populate city attribute.
    So city attribute must be present in admin task context.


    Method: initializeOptionList()


    If you want dropdown for this logical attribute, you have to implement this method.
    You just set vector to logical attribute value.


    | ctx.setLogicalAttributeMultiValue(officeCodeList,officeCodes); |


    Make sure you check option list in configuration page.


    | ![](OEBPS/image_rsrc8XV.jpg) |


    | Figure 6-12 shows check box for option list |


    Method: initialize()


    This method will be execute for task create only, for example create user, create
    account. This method used for initial value for logical attribute.


    For modification task, this method has never been executed. Our example never
    called this method. If you want to execute this method, you have to change action
    to be “create”. (The primary object is user) And then you execute this admin task
    again, you will see this method set default value “006NY”.


    | @Overridepublic void initialize(LogicalAttributeContext ctx) throws Exception
    {String officeCodeName = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);String
    officeCodeValue = ctx.getLogicalAttributeValue(officeCodeName);if(officeCodeValue
    == null&#124;&#124;officeCodeValue.trim().length()==0){ctx.setLogicalAttributeValue(officeCodeName,
    "006NY");}} |


    Method: validate()


    Validate() method will be execute when user submit task. You can test our code
    by select empty value and clicks submit.


    | @Overridepublic void validate(LogicalAttributeContext ctx) throws Exception
    {String officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);String officeCodeValue
    = ctx.getLogicalAttributeValue(officeCode);if(officeCodeValue==null&#124;&#124;officeCodeValue.trim().length()==0){IMSException
    e = new IMSException();e.addUserMessage("Invalid office value");throw e;}} |


    | ![](OEBPS/image_rsrc8XW.jpg) |


    | Figure 6-13 shows exception during validate() method |


    Screen-Defined Logical Attributes vs. our Logical Attribute


    When you create screen, you can create screen-Defined Logical Attributes. The
    screen-Defined Logical Attributes are defined for only one screen. They can’t
    share with other screens but the logical attributes can share.


    ### 6.3.3 Use Case


    Refer to the official document, Progamming guide > Logical Attribute > Use Case
    Examples


    Format data from a data source


    | In the user directory, a telephone number is stored as the physical attribute
    phone. It has 10 digits—for example, 9785551212\. This physical attribute is associated
    with the logical attribute formatted_phone. |


    This use case need to override toLogical(), to return formatted phone and override
    method toPhysical() to convert from formatted phone to be number.


    Validate data entry


    | The physical attribute employeeNumber exists in a data source, and it is mapped
    to the logical attribute validEmployeeNumber. After a user assigns an employee
    number to the validEmployeeNumber attribute on the task screen and clicks Submit,
    CA IdentityMinder calls a custom logical attribute handler to query the data source
    to be sure that the supplied employee number exists in employeeNumber. If it does
    not exist, the logical attribute handler throws an exception. |


    This use case queries the database to convert between logical attribute and physical
    attribute.


    | @Overridepublic void toLogical(LogicalAttributeContext ctx) throws Exception
    {//step 1String empNo = ctx.getPhysicalAttributeName(“employeeNumber”);String
    empNoValue = ctx.getPhysicalAttributeValue(empNo);//step2String validEmpNoValue
    = queryByPhysicalID(validEmpNoValue);//step 3if(validEmpNo!=null){String validEmpNo
    = ctx.getLogicalAttributeName(“validEmployeeValue”);ctx.setLogicalAttributeValue(validEmpNo,
    validEmpNoValue);return;}throw new IMSException(“invalid employee number”);} |


    Add a drop-down list to a task screen


    | A task screen requires a customer to provide the type of service they have purchased—Gold,
    Silver, or Bronze. These options are presented in a drop-down list associated
    with the logical attribute serviceType. When the customer chooses a service level
    and clicks Submit, CA IdentityMinder calls a logical attribute handler that converts
    the selected service level to the corresponding physical attribute value (1, 2,
    or 3) and assigns the value to the physical attribute type. |


    This use case is same as our example. You have to implement initializeOptionList()
    returns type of service: Gold, Silver, or Bronze and implement method toPhysical()
    and toLogical() convert the value between type of service(Gold, Silver, or Bronze)
    to be number (1,2, or 3).


    ## 6.4 Validation Rules


    Attribute validation rules help validate value that user types on screen meet
    the right format. Validation of user data entry can be regular expression, JavaScript,
    or Java implementations. In this book will focus on Java programming. For regular
    expression and JavaScript, you can see example from official document (but validation
    rules by Java programming is missing details).


    Types of Validation Rules


    *   Task-level validation: validation rule directly to a field on a particular
    task screen. You can define rule during task-screen configuration.


    *   Directory-level validation: validate the attribute’s value but It has been
    applied all tasks. It is global scope. You have to define the rule in directory.xml


    ### 6.4.1 Programming


    For task-level validation, you have to implement TaskValidator and override method
    validate().


    | public boolean validate(BLTHContext ctx, String attrValue,StringRef changedValue,
    StringRef errorMsg) throws AttributeValidationException |


    For directory-level validation, you have to extend AttributeValidator and override
    method validate(). It is almost same as task-validation but there are some details.
    You will see in our examples.


    | public boolean validate(Object attrValue, StringRef changedValue, StringRef
    errorMsg)throws AttributeValidationException |


    ### 6.4.2 Code Example: Task-level validation


    This example require attribute Employee Number, please check your user store.
    Our requirement uses employee number attribute. The validate rule is


    *   Employee number must be number only.


    *   Maximum is 4 Digits.


    *   If user types 1-3 digits, the format fill in 0 as prefix. For example: 2,
    the right format will be 0002


    | ![](OEBPS/image_rsrc8XX.jpg) |


    | Figure 6-14 shows user’s screen for updating employee number  |


    Code


    1.  Compile our java code: com.book.idm.etc.EmployeeNumberTaskValidator


    2.  Copy class (include package folder ”com.book.idm.etc” ) to folder “\IdentityMinder.ear\custom”'
