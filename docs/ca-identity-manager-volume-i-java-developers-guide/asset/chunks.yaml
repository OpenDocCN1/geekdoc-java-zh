    \ and Add Task `Update Location and Ext Number (BookBasicUpdateLocAndExtNo)`.\n\
    \n| ![](OEBPS/image_rsrc8RV.jpg) |\n\n| Figure 2-29 shows selecting our task.\
    \ |\n\n## 2.3 Provisioning\n\nThe goal of this topic is understand how provisioning\
    \ works. To implement provisioning requires 4 configuration steps:\n\n*   Step1:\
    \ Acquire Endpoint\n    *   `Endpoint` can be `Microsoft Active Directory` or\
    \ database.\n*   Step2: Create Account Template\n    *   Link to `endpoint`.\n\
    \    *   `Account template` defines attribute mapping between global user and\
    \ account.\n*   Step3: Create Provisioning Role\n    *   Link to `account templates`.\n\
    \    *   One provisioning role can have many `account templates`.\n*   Step4:\
    \ Add user to Provisioning Role\n\nThe whole steps show in the picture below.\n\
    \n| ![](OEBPS/image_rsrc8RW.jpg) |\n\n| Figure 2-30 shows all steps and related\
    \ screen. |\n\n### 2.3.1 Account Template and Attribute Mapping\n\n`Account templates`\
    \ define how a (global) user is represented in a managed `endpoint`. By default,\
    \ `account templates` define mapping using `Rule String`, for example, `%USA%`\
    \ or `%UC%`. You can see in official document `Administration Guide` for more\
    \ details. There are 2 ways to define mapping:\n\n1.  `Rule String`, the official\
    \ document defines `Rule String` for some attributes, not all.\n2.  `Global User\
    \ attributes`, you can use this one if there is no `Rule String` mapping. The\
    \ format will be `%#<attribute name>%`.\n\nFor example, city attribute in account\
    \ template, you can put:\n\n*   `Rule String`: `%UC%`\n*   `Global User attributes`:\
    \ `%eTCity%`\n\nBoth give the same result. The picture below shows global user’s\
    \ attribute city value in account template.\n\n| ![](OEBPS/image_rsrc8RX.jpg)\
    \ |\n\n| Figure 2-31 shows global user’s attribute in account template. |\n\n\
    Another example that uses global user attributes is account container in picture\
    \ below. For example, if `eTGlobalUser` has `eTLocation=northamerica`, then container\
    \ will be `eTADSOrgUnitName=Users`, `eTADSOrgUnitName=NorthAmerica`. All these\
    \ values is global user attributes.\n\n| ![](OEBPS/image_rsrc8RY.jpg) |\n\n| Figure\
    \ 2.32 shows screen Account Template and Global User attribute |\n\n### 2.3.2\
    \ Provisioning Directory\n\nYou can get Global User attributes from provisioning\
    \ directory. You have to use `Client LDAP`, such as `JXplorer`, connect provisioning\
    \ directory. You can get provisioning store information from `Management Console`.\
    \ Select `Provisioning store` and check `URL`.\n\n| ![](OEBPS/image_rsrc8RZ.jpg)\
    \ |\n\n| Figure 2-33 shows provisioning directory connectivity. |\n\nGlobal User\
    \ (Class: `eTGlobalUser`)\n\nInside the provisioning directory, browse to path\
    \ `eTGlobalUserContainerName=Global Users, eTNamespaceName=CommonObjects, dc=im,\
    \ dc=eta` is location keeps all global users.\n\nSelect one user, you can see\
    \ attribute name and value. (You can use this attribute name in account template)\n\
    \n| ![](OEBPS/image_rsrc8S0.jpg) |\n\n| Figure 2-34 shows path and attribute `eTCity`\
    \ of global user. |\n\nAccount (Class: `eTADAccount`)\n\nIf you already have some\
    \ account in endpoint: `Active Directory`, then let browse path `eTADSDirectoryName=<Endpoint\
    \ Name>, eTNamespaceName=ActiveDirectory, dc=im, dc=eta`. It represents `Endpoint\
    \ (Active Directory)`.\n\n| ![](OEBPS/image_rsrc8S1.jpg) |\n\n| Figure 2-35show\
    \ attributes of account object |\n\nThe object `eTADAccount` under `eTADSDirectory`\
    \ path represent Account. If you modify some values directly in account object\
    \ (`eTADAccount`), it will reflect value in Active Directory immediately. For\
    \ Example, we change value of `eTADSl` (it means City) from “New York” to be “New\
    \ York Test” and look at Active Directory, value will be changed also.\n\n| ![](OEBPS/image_rsrc8S2.jpg)\
    \ |\n\n| Figure 2-36 shows relationship between eTADAccount and AD Account |\n\
    \nWe do not suggest change any value directly inside account object (`eTADAccount`)\
    \ because CA IdentityMinder keeps it as internal process. It may useful for debug\
    \ when you do programming and try to modify the value and get error. You may print\
    \ the value and put into Account object directly. Let see it allowed or not.\n\
    \nAnother choice to access Global user or account, you use `Provisioning Manager`\
    \ but you cannot see attribute name from screen.\n\n### 2.3.3 Attribute mapping:\
    \ User- Global User - Account\n\nTo understand better, this section describes\
    \ attribute mapping from user to global user and from global user to account.\n\
    \nUser Store\n\nCheck user store connectivity information from `Management Console`,\
    \ and login to User Store by any LDAP client such as `JXplorer`.\n\n| ![](OEBPS/image_rsrc8S3.jpg)\
    \ |\n\n| Figure 2.-37 shows user store connectivity |\n\nWe can see attribute\
    \ mapping: User attributes to Global user attributes in `Management Console`.\
    \ In the Management Console, select `Environment > your environment > Advanced\
    \ Settings > Provisioning > Attribute Mappings`.\n\n| ![](OEBPS/image_rsrc8S4.jpg)\
    \ |\n\n| Figure 2-38 shows attribute mappings in Management Console |\n\nThe picture\
    \ below show how attribute city mapping from user to account. The user’s attribute\
    \ “l” map to global user attribute `eTCity` in `Management Console`. The user’s\
    \ attribute maps to `Account Template`.\n\n| ![](OEBPS/image_rsrc8S5.jpg) |\n\n\
    | Figure 2-39 shows mapping to account |\n\n### 2.3.4 Synchronization\n\nWe learned\
    \ how attribute mapping from user, the next thing we have to learn when it works.\n\
    \nWhen Global User created?\n\nGlobal user will be created when `provisioning\
    \ role`. If you just create, Global user will not be.\n\n| ![](OEBPS/image_rsrc8S6.jpg)\
    \ |\n\n| Figure 2-40 shows when global user created |\n\nWhen attributes synchronization?\n\
    \nIt will start synchronization, if you select option “Account Synchronization”\
    \ in admin task every event.\n\n| ![](OEBPS/image_rsrc8S7.jpg) |\n\n| Figure 2-41\
    \ shows dropdown Account Synchronization |\n\nWhat is User Synchronization?\n\n\
    The User Synchronization drop down in admin task will trigger `Identity Policy\
    \ Set`. We will talk about `Identity Policy Set` next.\n\n| ![](OEBPS/image_rsrc8S8.jpg)\
    \ |\n\n| Figure 2-42 shows dropdown User Synchronization |\n\n## 2.4 Identity\
    \ Policy Set and Policy Xpress\n\nGo back to our example‘s requirement, we create:\n\
    \n*   `Policy Set` maps city to country\n*   `Policy Xpress` concatenate office\
    \ number and extension\n\n| ![](OEBPS/image_rsrc8S9.jpg) |\n\n| Figure 2-43 show\
    \ how to implement requirement. |\n\n### 2.4.1 Identity Policy Set\n\nAn Identity\
    \ policy is a set of business changes that occurs when a user meets a certain\
    \ condition. To Open CA IdentityMinder Admin Console and select tab `Policies`,\
    \ and click sub menu `Create Identity Policy Set`.\n\n| ![](OEBPS/image_rsrc8SA.jpg)\
    \ |\n\n| Figure 2-44 shows menu “Create Identity Policy Set” |\n\nProfile Tab\n\
    \nThe first tab Profile, put value below:\n\n| Field Name | Value | Description\
    \ |\n| :--- | :--- | :--- |\n| Name | Set Office Address | Name of policy set\
    \ |\n| Category | Book Example | Category name |\n| Description | Set Office Address\
    \ | |\n\nDo not click submit, click `Policies Tab`.\n\n| ![](OEBPS/image_rsrc8SB.jpg)\
    \ |\n\n| Figure 2-45 shows value in tab “Profile” |\n\nPolicies Tab\n\nIn this\
    \ tab has 2 parts: `Policy Set Member Rule` and `Identity Policies`. The `Policy\
    \ Set Member Rule` tells who is the identity policy applies to? In our example\
    \ we use default value = all that means all users meet this member rule.\n\n|\
    \ ![](OEBPS/image_rsrc8SC.jpg) |\n\n| Figure 2-46 shows Member Rule == all users\
    \ |\n\nNext, we have to create Identity policy: when city = “New York” then set\
    \ address. To click button `Add`, put values:\n\n| Field Name | Value |\n| :---\
    \ | :--- |\n| Policy Name | New York Address |\n| Policy Condition | |\n| City\
    \ | New York |\n| Action on Apply Policy | |\n| Country | United States |\n\n\
    | ![](OEBPS/image_rsrc8SH.jpg) |\n\n| Figure 2-47 shows screen defines Identity\
    \ Policy |\n\nAnd click “OK”, it will be back to screen `Policies`.\n\n| ![](OEBPS/image_rsrc8SJ.jpg)\
