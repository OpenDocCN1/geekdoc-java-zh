    \ |\n\n| Figure 2-35show attributes of account object |\n\nThe object eTADAccount\
    \ under eTADSDirectory path represent Account. If you modify some values directly\
    \ in account object (eTADAccount), it will reflect value in Active Directory immediately. \
    \ For Example, we change value of “eTADSl” (it means City) from “New York” to\
