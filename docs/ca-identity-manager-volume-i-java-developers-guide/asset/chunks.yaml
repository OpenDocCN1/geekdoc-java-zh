  trans: "\n逻辑属性处理器的执行发生在任务处理的同步阶段。如果与第三方系统交互时的响应时间存在问题，可以在 `Pre-approval`（预审批）状态下使用事件监听器来实现相同的目标。\n\
    \n这意味着，如果你想调用第三方来转换属性值，你应该关注响应时间，因为逻辑属性 API 是在同步阶段执行的。\n\n### 步骤 3：最后一行代码将值设置回逻辑属性值\n\
    \n```\nctx.setLogicalAttributeValue(officeCode, officeCodeValue);\n```\n\n####\
    \ 方法：`toPhysical()`\n\n该方法是 `toLogical()` 的反操作。步骤相同，但方向相反。\n\n*   步骤 1：查找逻辑属性值。\n\
    *   步骤 2：映射，将其转换为物理值。\n*   步骤 3：将值设置回物理属性。\n\n```java\n@Override\npublic void\
    \ toPhysical(LogicalAttributeContext ctx) throws Exception {\n    //step 1\n \
    \   String officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n    String\
    \ officeCodeValue = ctx.getLogicalAttributeValue(officeCode);\n    //step 2\n\
    \    String cityValue = indexLogicalAsKey.get(officeCodeValue);\n    //step 3\n\
    \    String city = ctx.getPhysicalAttributeName(ATTR_REFER_PHY);\n    ctx.setPhysicalAttributeValue(city,\
    \ cityValue);\n}\n```\n\n#### 管理任务中的属性\n\n我们在屏幕上声明了 3 个字段：\n\n*   2 个逻辑属性：`officeCode`（下拉列表）和\
    \ `officeCodeList`（隐藏）对于下拉列表是必须的。\n*   1 个物理属性：City（城市，隐藏），我们需要它，因为我们要填充城市属性。因此，城市属性必须存在于管理任务上下文中。\n\
    \n#### 方法：`initializeOptionList()`\n\n如果你想为此逻辑属性提供下拉列表，你必须实现此方法。你只需要将向量设置为逻辑属性值。\n\
    \n```\nctx.setLogicalAttributeMultiValue(officeCodeList,officeCodes);\n```\n\n\
    请确保你检查了配置页面中的选项列表。\n\n| ![](img/image_rsrc8XV.jpg) |\n\n图 6-12 显示了选项列表的复选框\n\n\
    #### 方法：`initialize()`\n\n此方法仅在任务创建时执行，例如创建用户、创建账户。此方法用于逻辑属性的初始值。\n\n对于修改任务，此方法从不执行。我们的示例从未调用过此方法。如果你想执行此方法，必须将操作更改为“create”（创建）（主对象是用户）。然后再次执行此管理任务，你将看到此方法设置了默认值“006NY”。\n\
    \n```java\n@Override\npublic void initialize(LogicalAttributeContext ctx) throws\
    \ Exception {\n    String officeCodeName = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n\
    \    String officeCodeValue = ctx.getLogicalAttributeValue(officeCodeName);\n\
    \    if(officeCodeValue == null || officeCodeValue.trim().length()==0) {\n   \
    \     ctx.setLogicalAttributeValue(officeCodeName, \"006NY\");\n    }\n}\n```\n\
    \n#### 方法：`validate()`\n\n`validate()` 方法将在用户提交任务时执行。你可以通过选择空值并点击提交来测试我们的代码。\n\
    \n```java\n@Override\npublic void validate(LogicalAttributeContext ctx) throws\
    \ Exception {\n    String officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n\
    \    String officeCodeValue = ctx.getLogicalAttributeValue(officeCode);\n    if(officeCodeValue==null\
    \ || officeCodeValue.trim().length()==0) {\n        IMSException e = new IMSException();\n\
    \        e.addUserMessage(\"Invalid office value\");\n        throw e;\n    }\n\
    }\n```\n\n| ![](img/image_rsrc8XW.jpg) |\n\n图 6-13 显示了 `validate()` 方法执行期间异常\n\
    \n#### 屏幕定义的逻辑属性 vs 我们的逻辑属性\n\n当你创建屏幕时，可以创建屏幕定义的逻辑属性。屏幕定义的逻辑属性仅针对一个屏幕定义。它们不能与其他屏幕共享，但逻辑属性是可以共享的。\n\
    \n### 6.3.3 用例\n\n请参考官方文档：Programming guide > Logical Attribute > Use Case Examples\n\
    \n##### 从数据源格式化数据\n\n在用户目录中，电话号码存储在物理属性 `phone` 中。它有 10 位数字——例如 9785551212。此物理属性与逻辑属性\
    \ `formatted_phone` 关联。\n\n此用例需要重写 `toLogical()` 以返回格式化后的电话，并重写方法 `toPhysical()`\
    \ 以从格式化后的电话转换为数字。\n\n```java\n@Override\npublic void toLogical(LogicalAttributeContext\
    \ ctx) throws Exception {\n    //step 1\n    String empNo = ctx.getPhysicalAttributeName(\"\
    employeeNumber\");\n    String empNoValue = ctx.getPhysicalAttributeValue(empNo);\n\
    \    //step2\n    String validEmpNoValue = queryByPhysicalID(validEmpNoValue);\n\
    \    //step 3\n    if(empNo!=null) {\n        String validEmpNo = ctx.getLogicalAttributeName(\"\
    validEmployeeValue\");\n        ctx.setLogicalAttributeValue(validEmpNo, validEmpNoValue);\n\
    \        return;\n    }\n    throw new IMSException(\"invalid employee number\"\
    );\n}\n```\n\n##### 验证数据输入\n\n物理属性 `employeeNumber` 存在于数据源中，并映射到逻辑属性 `validEmployeeNumber`。当用户在任务屏幕上的\
    \ `validEmployeeNumber` 属性分配员工编号并点击提交后，CA IdentityMinder 会调用自定义逻辑属性处理器进行查询，以确保该员工编号在数据源中。如果不存在，将抛出异常。\n\
    \n##### 为任务屏幕添加下拉列表\n\n此用例要求用户提供他们购买的服务类型——Gold（金）、Silver（银）或 Bronze（铜）。这些选项以下拉列表的形式呈现。此用例与我们的示例相同。你需要实现\
    \ `initializeOptionList()` 返回服务类型 Gold、Silver 或 Bronze。\n\n## 6.4 验证规则\n\n属性验证规则有助于验证用户在屏幕上输入的值是否符合格式。用户输入可以是正则表达式、JavaScript\
    \ 或 Java 实现。本书将重点关注 Java 编程。对于正则表达式和 JavaScript，可以查看官方文档示例（但缺少 Java 编程验证规则）。\n\
    \n##### 验证规则类型\n\n*   任务级验证：直接针对特定任务屏幕的验证规则。你可以在任务配置期间定义规则。\n*   目录级验证：验证属性值，但应用于所有任务。它是全局范围的。你需要在\
    \ `directory.xml` 中定义规则。\n\n### 6.4.1 编程\n\n对于任务级验证，你需要实现 `TaskValidator` 并重写\
    \ `validate()` 方法。\n\n```java\npublic boolean validate(BLTHContext ctx, String\
    \ attrValue, StringRef changedValue, StringRef errorMsg) throws AttributeValidationException\n\
    ```\n\n对于目录级验证，你需要扩展 `AttributeValidator` 并重写 `validate()` 方法。它与任务验证几乎相同，但有一些细节。你将在我们的示例中看到。\n\
    \n```java\npublic boolean validate(Object attrValue, StringRef changedValue, StringRef\
    \ errorMsg) throws AttributeValidationException\n```\n\n### 6.4.2 代码示例：任务级验证\n\
    \n此示例需要 Employee Number 属性，请检查你的用户存储。我们的需求使用的是员工编号属性。验证规则为\n\n*   员工编号必须是数字。\n\
    *   最大 4 位。\n*   如果用户输入 1-3 位，格式将填充 0 作为前缀。例如：2，正确的格式将是 0002。\n\n| ![](img/image_rsrc8XX.jpg)\
    \ |\n\n图 6-14 显示了更新员工编号的用户屏幕\n\n#### 代码\n\n1. 编译我们的 Java 代码：`com.book.idm.etc.EmployeeNumberTaskValidator`\n\
    2. 将类（包括包文件夹 `com.book.idm.etc`）复制到 `\\IdentityMinder.ear\\custom` 文件夹中\n\n"
- fmt: "\n# Configuration: Identity Manager User Console\n\n1. Log into the Identity\
    \ Manager User Console as administrator.\n2. Select tab `Roles` and `Tasks`, and\
    \ select menu `create admin task`.\n3. Create `admin task`, put value as below:\n\
    \n| Field Name | Value | Description |\n| :--- | :--- | :--- |\n| **Tab: Profile**\
    \ | | |\n| Name | Update Employee Number | Name of admin task |\n| Tag | BookBasicUpdateEmployeeNumber\
    \ | Tag name of admin task |\n| Description | Example for Validation | Description\
    \ of admin task |\n| Category | Book Example | Where admin task will show. |\n\
    | Category Order | 11 | |\n| Category 2 | Task | |\n| Category 3 | Basic | |\n\
    | Primary Object | User | We want to update the employee number, so you have to\
    \ choose object user, and action modify. |\n| Action | Modify | |\n| | | For testing,\
    \ you can disable some values. <br>* `User Synchronization` and `Account Synchronization`:\
    \ off.<br>* `Enable Auditing`, `Enable Workflow`, `Enable Web Services`: uncheck\
    \ |\n| **Tab: Search** | | |\n| Search Screen | Default User Search | Screen for\
    \ searching user |\n\n4. For **Tab: Tabs**:\n   - Select standard tab controller.\n\
    \   - Select `Profile(UserProfile)` from list, and click symbol `+`.\n   - Select\
    \ browse button at screen text field.\n   - Click `new` button to create new screen,\
    \ and select choice standard profile screen.\n   - Put value:\n     - `Name`:\
    \ `Update Employee Number`\n     - `Tag`: `BookBasicUpdateEmployeeNumber`\n  \
    \ - Add attribute: `Employee Number`\n     - `Attribute Name`: `Employee Number`\n\
    \     - `Style`: `Text`\n     - `Name`: `Employee Number`\n     - `Validation\
    \ Java Class`: `com.book.idm.etc.EmployeeNumberTaskValidator`\n   - Click `apply`\
    \ button to finish.\n   - Click `ok`\n\n!![](OEBPS/image_rsrc8XY.jpg)\nFigure\
    \ 6-15 shows configuration of employee number attributes\n\n5. Submit to finish\
    \ creating task.\n\n## Add task to admin role\n\n1. Select tab: `Roles` and `Tasks`,\
    \ and select menu `modify admin role`.\n2. Select role `system manager`.\n   -\
    \ Select tab: `task`\n   - Select filter by category: `Book Example`\n   - Select\
    \ add task: `Update Employee Number`\n3. Click `submit` to finish modify admin\
    \ role.\n\n## How it works\n\nExecute admin task: `Update employee number`.\n\n\
    1. Log into the Identity Manager User Console as administrator.\n2. Select tab:\
    \ `Book Example`, and select menu `update employee number`.\n3. Search a user,\
    \ the screen will show employee number as text field.\n4. Modify employee number\
    \ attribute, and click `submit`.\n\n## Method `validate()`\n\nThere are 2 cases\
    \ of error:\n* Put 5 digits of employee number.\n\n!![](OEBPS/image_rsrc8XZ.jpg)\n\
    Figure 6-16 shows error by return value\n\n* Put any characters.\n\n!![](OEBPS/image_rsrc8Y0.jpg)\n\
    Figure 6-17 shows error by exception\n\nThere are 2 ways to return error message,\
    \ you can pick one:\n* Return `false` and set message back by `errorMsg.reference`.\n\
    ```\nif(attrValue.trim().length()>4){errorMsg.reference = \"Employeer Number can\
    \ not more than 4 digits\";return false;}\n```\n* Throw exception and put message\
    \ as parameter.\n```\ntry{...int employeeNo = new Integer(attrValue);...}catch(Exception\
    \ e){throw new AttributeValidationException(\"Employeer Number:invalid format\"\
    );}\n```\n\nTry to put number one digit, for example `1`, and submit. Login to\
    \ user store, employee number will display as `0001`. We can modify value by using\
    \ `changedValue.reference` parameter.\n\n```\nint employeeNo = new Integer(attrValue);DecimalFormat\
    \ format = new DecimalFormat(\"0000\");changedValue.reference = format.format(employeeNo);\n\
    ```\n\nTask-level validation provides `BLTHContext` as parameter. You can use\
    \ `BLTHContext` to search some attribute from managed object, for example you\
    \ have to check the new value must be unique.\n\n### 6.4.3 Code Example: Directory-level\
    \ validation\n\nThis example will use same requirement as task-level validation.\
    \ Please disable task-level validation from admin task: `update employee number`.\n\
    \n* Search admin task: `update employee number`\n* Go to tab: `tabs` and modify\
    \ screen: `Update Employee Number`.\n* Remove value of validation java class:\
    \ `com.book.idm.etc.EmployeeNumberTaskValidator`.\n\n### Code\n1. Compile our\
    \ java code: `com.book.idm.etc.EmployeeNumberDirValidator`\n2. Copy class (include\
    \ package folder `com.book.idm.etc`) to folder `\\IdentityMinder.ear\\custom`\n\
    \n## Configuration: Management Console\n\n1. In the Management Console, click\
    \ `Directory`.\n2. Click the name of the user store directory.\n3. Click `export`\
    \ button at bottom page. You will get the `xml` file.\n4. Using text editor to\
    \ open the `xml` file.\n5. You have to modify 2 places:\n   - Add validation rule\
    \ under element `<ImsManagedObjectAttrValidation>`. Please go check xml schema\
    \ from official document.\n```xml\n<ValidationRule name=\"Employee Number pattern\"\
    \ description=\"Validates employee number\" messageid=\"4002\"><Java class=\"\
    com.book.idm.etc.EmployeeNumberDirValidator\"/></ValidationRule><ValidationRuleSet\
    \ name=\"Employee Number format\"description=\"validate employee number format\"\
    ><ValidationRule name=\"Employee Number pattern\"/></ValidationRuleSet>\n```\n\
    \   - 5.2 add attribute `validationruleset =”Employee Number format\"` for `employeeNumber`.\n\
    ```xml\n<ImsManagedObjectAttrValidation physicalname=\"Employee Number\"description=\"\
    Employee Number\"valuetype=\"String\"maxlength=\"0\"validationruleset=\"Employee\
    \ Number format\"/>\n```\n6. Go back to user store.\n7. Click `next` and select\
    \ our `xml` file.\n\n## How it works\n\nExecute admin task: `Update employee number`.\n\
    \n1. Log into the Identity Manager User Console as administrator.\n2. Select tab:\
    \ `Book Example`, and select menu `update employee number`.\n3. Search a user,\
    \ the screen will show employee number as text field.\n4. Modify employee number\
    \ attribute, and click `submit`.\n\n## Method `validate()`\n\nThere are 2 ways\
    \ to show error. It is almost same as task-level validation the difference is\
    \ how to get message:\n* If you return `false`, you do not need to set message.\
    \ The message came from the `xml` file.\n* If you throw exception, the message\
    \ came from property file: `IMSException.properties`.\n```\ntry{...}catch(Exception\
    \ e){throw new AttributeValidationException(\"Employee Number\",attrValue.toString(),\"\
    4002\",\"invalid format\");}\n```\n\n!![](OEBPS/image_rsrc8Y1.jpg)\nFigure 6-18\
    \ shows error from messageid in `IMSException.properties` file\n\n## Validation\
    \ rule set\n\nIn the Management Console, and click user store directory. Scroll\
    \ down until section validation rule set. Click link inside, you will see the\
    \ details.\n\n!![](OEBPS/image_rsrc8Y2.jpg)\nFigure 6-19 shows validation sets\
    \ in management console\n\nPlease disable directory-level validation after testing.\
    \ We will use employee number in book II.\n\n## 6.5 Email Notification\n\nThis\
    \ section is special topic. It needs it for the next API: `Notification Rule API`.\
    \ The CA IdentityMinder official document has topic email notification in administration\
    \ guide, not in the programming guide.\n\n### Configure SMTP\n\nYou need to check\
    \ SMTP configuration before starting email notification. There are 2 things to\
    \ check before working with email notification. The first one is SMTP configuration,\
    \ what is SMTP server:\n* Jboss: check `jboss_home\\server\\default\\deploy\\\
    mail-service.xml`\n* WebLogic: check a mail session with JNDI name `nete/Mail`\n\
    * WebSphere: check mail session object called `mailMail`\n\nPlease see the official\
    \ document administration guide > email notifications > configure SMTP Setting.\n\
    \nThe second one is file `email.properties` in folder `iam_im.ear\\config\\com\\\
    netegrity\\config`. This file is used for specific return email address.\n"
  raw: "Configuration: Identity Manager User Console\n\n1.  Log into the Identity\
    \ Manager User Console as administrator.\n\n2.  Select tab Roles and Tasks, and\
    \ select menu create admin task.\n\n3.  Create admin task, put value as below\n\
    \n| Field Name | Value | Description |\n\n| Tab: Profile |\n\n| Name | Update\
    \ Employee Number | Name of admin task |\n\n| Tag | BookBasicUpdateEmployeeNumber\
    \ | Tag name of admin task |\n\n| Description | Example for Validation | Description\
    \ of admin task |\n\n| Category | Book Example | Where admin task will show. |\n\
    \n| Category Order | 11 |\n\n| Category 2 | Task |\n\n| Category 3 | Basic |\n\
    \n| Primary Object | User | We want to update the employee number, so you have\
    \ to choose object user, and action modify. |\n\n| Action | Modify |\n\n| For\
    \ testing, you can disable some values. \n\n*   User Synchronization and Account\
    \ Synchronization: off.\n\n*   Enable Auditing, Enable Workflow, Enable Web Services:\
    \ uncheck\n\n |\n\n| Tab: Search |\n\n| Search Screen | Default User Search |\
    \ Screen for searching user |\n\n|  |  |  |\n\n4.  For Tab: Tabs\n\n    Select\
    \ standard tab controller.\n\n    Select Profile(UserProfile) from list, and click\
    \ symbol (+)\n\n    Select browse button at screen text field.\n\n    Click new\
    \ button to create new screen, and select choice standard profile screen.\n\n\
    \    Put value\n\n*   Name: Update Employee Number\n\n*   Tag: BookBasicUpdateEmployeeNumber\n\
    \n    Add attribute: Employee Number\n\n*   Attribute Name: Employee Number\n\n\
    *   Style: Text\n\n*   Name:  Employee Number\n\n*   Validation Java Class: com.book.idm.etc.EmployeeNumberTaskValidator\n\
    \n*   Click apply button to finish.\n\n    Click ok\n\n| ![](OEBPS/image_rsrc8XY.jpg)\
    \ |\n\n| Figure 6-15 shows  configuration of employee number attributes |\n\n\
    5.  Submit to finish creating task.\n\nAdd task to admin role\n\n1.  Select tab:\
    \ Roles and Tasks, and select menu modify admin role.\n\n2.  Select role system\
    \ manager.\n\n*   Select tab: task\n\n*   Select  filter by category:  Book Example\n\
    \n*   Select add task: Update Employee Number\n\n3.  Click submit to finish modify\
    \ admin role.\n\nHow it works\n\nExecute admin task: Update employee number.\n\
    \n1.  Log into the Identity Manager User Console as administrator.\n\n2.  Select\
    \ tab: Book Example, and select menu update employee number.\n\n3.  Search a user,\
    \ the screen will show employee number as text field.\n\n4.  Modify employee number\
    \ attribute, and click submit.\n\nMethod validate()\n\nThere are 2 cases of error:\n\
    \n*   Put 5 digits of employee number.\n\n| ![](OEBPS/image_rsrc8XZ.jpg) |\n\n\
    | Figure 6-16 shows error by return value |\n\n*   Put any characters.\n\n| ![](OEBPS/image_rsrc8Y0.jpg)\
    \ |\n\n| Figure 6-17 shows error by exception |\n\nThere are 2 ways to return\
    \ error message, you can pick one.\n\n*   Return false and set message back by\
    \ errorMsg.reference.\n\n| if(attrValue.trim().length()>4){errorMsg.reference\
    \ = \"Employeer Number can not more than 4 digits\";return false;} |\n\n*   Throw\
    \ exception and put message as parameter.\n\n| try{...int employeeNo = new Integer(attrValue);...}catch(Exception\
    \ e){throw new AttributeValidationException(\"Employeer Number:invalid format\"\
    );} |\n\nTry to put number one digit, for example 1, and submit. Login to user\
    \ store, employee number will display as 0001\\. We can modify value by using\
    \ changedValue.reference parameter.\n\n| int employeeNo = new Integer(attrValue);DecimalFormat\
    \ format = new DecimalFormat(\"0000\");changedValue.reference = format.format(employeeNo);\
    \ |\n\nTask-level validation provides BLTHContext as parameter. You can use BLTHContext \
    \ to search some attribute from managed object, for example you have to check\
    \ the new value must be unique.\n\n### 6.4.3 Code Example: Directory-level validation\n\
    \nThis example will use same requirement as task-level validation. Please disable\
    \ task-level validation from admin task: update employee number.\n\n*   Search\
    \ admin task: update employee number\n\n*   Go to tab: tabs and modify screen:\
    \ Update Employee Number.\n\n*   Remove value of validation java class: com.book.idm.etc.EmployeeNumberTaskValidator\n\
    \nCode\n\n1.  Compile our java code: com.book.idm.etc.EmployeeNumberDirValidator\n\
    \n2.  Copy class (include package folder ”com.book.idm.etc” ) to folder “\\IdentityMinder.ear\\\
    custom”\n\nConfiguration: Management Console\n\n1.  In the Management Console,\
    \ click Directory.\n\n2.  Click the name of the user store directory.\n\n3.  Click\
    \ export button at bottom page. You will get the xml file.\n\n4.  Using text editor\
    \ to open the xml file.\n\n5.  You have to modify 2 places:\n\n    Add validation\
    \ rule under element <ImsManagedObjectAttrValidation>. Please go check xml schema\
    \ from official document.\n\n| <ValidationRule name=\"Employee Number pattern\"\
    \ description=\"Validates employee number\" messageid=\"4002\"><Java class=\"\
    com.book.idm.etc.EmployeeNumberDirValidator\"/></ValidationRule><ValidationRuleSet\
    \ name=\"Employee Number format\"description=\"validate employee number format\"\
    ><ValidationRule name=\"Employee Number pattern\"/></ValidationRuleSet> |\n\n\
    5.2  add attribute validationruleset =”Employee Number format” for employeeNumber\
    \ attribute.\n\n| <ImsManagedObjectAttr physicalname=\"employeeNumber\"description=\"\
    Employee Number\"displayname=\"Employee Number\"valuetype=\"String\"maxlength=\"\
    0\"validationruleset=\"Employee Number format\"/> |\n\n6.  Go back management\
    \ console, and select our use store directory.\n\n7.  Click update button and\
    \ select our xml file. Click next and finish button. The screen will show message\
    \ in console, and click continue and restart environment.\n\nHow it works\n\n\
    Execute admin task: Update employee number.\n\n4.  Log into the Identity Manager\
    \ User Console as administrator.\n\n5.  Select tab: Book Example and select menu\
    \ update employee number.\n\n6.  Search a user, the screen will show employee\
    \ number as text field.\n\n7.  Modify employee number attribute, and click submit.\n\
    \nMethod validate()\n\nThere are 2 ways to show error message. It is almost same\
    \ as task-level validation but the difference is how to get message.\n\n*   If\
    \ you return false, you do not need to set any message. The message came from\
    \ the xml file. The attribute messageid=\"4002\" in element < ValidationRule >\
    \ indicate value. The value of message came from property file:IMSException.properties\
    \ in directory custom\\resourceBundle.\n\n*   If you throw exception, the message\
    \ came from message id in constructor. Our code use value 4002\\. You can change\
    \ to be another number.\n\n| try{...}catch(Exception e){throw new AttributeValidationException(\"\
    Employee Number\",                                                          attrValue.toString(),\"\
    4002\",\"invalid format\");} |\n\n| ![](OEBPS/image_rsrc8Y1.jpg) |\n\n| Figure\
    \ 6-18 shows error from messageid in IMSException.properties file |\n\nValidation\
    \ rule set\n\nIn the Management Console, and click user store directory. Scroll\
    \ down until section validation rule set. Click link inside, you will see the\
    \ details.\n\n| ![](OEBPS/image_rsrc8Y2.jpg) |\n\n| Figure 6-19 shows validation\
    \ rule sets in management console |\n\nPlease disable directory-level validation\
    \ rule after testing. We will use employee number in book volume II.\n\n## 6.5\
    \ Email Notification\n\nThis section is special topic. It needs it for the next\
    \ API: Notification Rule API. The CA IdentityMinder official document has topic\
    \ email notification in administration guide, not in the programming guide.\n\n\
    Configure SMTP\n\nYou need to check SMTP configuration before starting email notification.\
    \ There are 2 things to check before working with email notification. The first\
    \ one is SMTP configuration, what is SMTP server.\n\n*   Jboss: check jboss_home\\\
    server\\default\\deploy\\mail-service.xml\n\n*   WebLogic: check a mail session\
    \ with JNDI name “nete/Mail”\n\n*   WebSphere: check mail session object called\
    \ mailMail\n\nPlease see the official document administration guide > email notifications\
    \ > configure SMTP Setting. JBoss, WebSphere and WebLogic have different configuration.\n\
    \nThe second one is file email.properties in folder iam_im.ear\\config\\com\\\
    netegrity\\config. This file is used for specific return email address.\n\n###\
    \ 6.5.1 How to implement email notification"
