  trans: "\n有 2+1 种实现电子邮件通知的方法。官方文档介绍了 2 种发送邮件的方法。本书提供了另一种发送邮件的方法。\n\n## 1. 邮件通知策略\n\
    \n- 无需编码即可创建电子邮件通知。\n- 邮件通知策略是 `Policy Xpress` 策略。你可以创建策略何时应该运行的条件（入口规则）。\n- 位于\
    \ `System` 选项卡下，选择 `Email` 菜单。\n\n## 2. 邮件模板\n\n- 需要代码（`JSP/java` 语法）。\n- 支持动态内容（在内容中包含\
    \ if-else 条件判断）。\n- 支持 `Notification Rule API`。\n\n邮件通知策略和邮件模板都依赖于任务的完成或事件的结果（通过、拒绝或失败）。你不能在任何随想的时间发送邮件。例如，你可能有很长的流程步骤：\n\
    \n- 步骤 1：HR 员工更新用户的办公室地址。\n- 步骤 2：发送邮件提醒经理审批。\n- 步骤 3：发送修复工单，然后向 HR 员工发送关于工单号的邮件。\n\
    - 步骤 4：向设施系统发送 Web 服务请求以申请访问办公室的权限。Web 服务响应成功后向 HR 员工发送邮件。如果请求失败，向 IT 管理员发送邮件。\n\
    - 步骤 5：等待到预期的入职日期，发送邮件确认用户和 HR 员工。\n\n对于长流程，你必须分析何时需要通知邮件。本书有一个通过 `java` API 发送邮件的技巧。\n\
    \n## 3. 服务 API\n\n- 可以随时发送邮件。\n- 支持动态内容。你可以使用任何流行的框架，如 `velocity`。\n- 请注意，`CA\
    \ IdentityMinder` 文档未提到这种方法。请自担风险使用。\n\n## 6.5.2 代码示例：邮件模板\n\n此示例展示了如何实现邮件模板。理解邮件模板对于下一个主题\
    \ `Notification Rule API` 是必须的。我们的示例代码将在管理员成功执行管理员任务：`Update Location and Ext\
    \ Number` 后发送邮件。\n\n### 代码\n\n1. 定位文件 `Update Location and Ext Number.tmpl`\n\
    2. 将文件拷贝到文件夹 `<server>\\IdentityMinder.ear\\custom\\emailTemplates\\default\\\
    completed`\n\n### 配置：管理控制台\n\n1. 在 `Management Console` 中，点击 `Environments`。\n\
    2. 点击环境名称。\n- 点击 `Advanced Settings`。\n- 点击 `Email`。\n- 勾选选择框 `Tasks e-mail enabled`。\n\
    \n| ![](img/image_rsrc8Y3.jpg) |\n| 图 6-20 显示任务邮件启用配置 |\n\n6. 向下滚动直到看到 `Send e-mail\
    \ when the following tasks are completed or during workflow`\n   - 在 `Admin Task\
    \ Name` 中，从下拉列表中选择 `Equal` 并输入值：`Update Location and Ext Number`\n   - `Update\
    \ Location and Ext Number` 将显示在搜索结果中。选中该任务复选框并点击添加按钮。\n   - 你应该在任务表中看到任务 `Update\
    \ Location and Ext Number`\n\n| ![](img/image_rsrc8Y4.jpg) |\n| 图 6-21 显示为邮件模板添加任务\
    \ |\n\n7. 点击保存按钮。\n8. 点击 `Restart Environment` 按钮。\n\n### 工作原理\n\n执行管理员任务：`Update\
    \ Location and Ext Number`。\n\n6. 以管理员身份登录 `Identity Manager User Console`。\n\
    7. 选择选项卡：`Book Example`，并选择菜单 `Update Location and Ext Number`。\n8. 搜索一个用户，屏幕将显示城市下拉列表。\n\
    9. 修改城市属性并点击提交。\n\n### 接收邮件\n\n在管理员提交后，用户应该收到内容如下所示的邮件：\n\n| ![](img/image_rsrc8Y5.jpg)\
    \ |\n| 图 6-22 显示邮件内容 |\n\n打开文件 `Update Location and Ext Number.tmpl`，你将看到邮件内容的代码。它们有特殊的变量，如\
    \ `_to` 或 `_taskContextInformation`。`_to` 表示邮件的接收者。我们将在 `notification rule API`\
    \ 中涵盖更多细节。`_taskContextInformation` 是任务上下文。有关更多详情请参阅管理指南。\n\n```java\n<%_to =\
    \ _util.getNotifiers(\"USER\", \"\");_cc = \"\";_bcc = \"\" ;_subject = \"Update\
    \ Location and Ext Number\";%>User:<%var imsEventContexts  = _taskContextInformation.getExposedEventContexts();if(imsEventContexts\
    \ != null){var eventContext = imsEventContexts.get(0);template.add(eventContext.getPrimaryObjectName());}%>has\
    \ been updated location and ext number successfully.\n```\n\n如果你没有收到邮件或屏幕上显示错误，请检查日志文件。`SMTP`\
    \ 可能不正确。\n\n如果你没有收到邮件，但管理员收到了邮件且主题为 `Update Location and Ext Number Completed`，这意味着\
    \ `CA IdentityMinder` 使用默认模板：`defaultTask.tmpl` 发送邮件。请检查文件夹名称 `default/completed`，且管理员任务应与我们的模板名称完全匹配。某些修改可能需要重启服务器或环境。\n\
    \n## 6.5.3 代码示例：通过 Service API 邮件通知\n\n此示例展示了如何通过 `CA IdentityMinder` 服务发送邮件。我们将使用业务逻辑任务处理器来发送邮件。请禁用上一个示例中的邮件模板。\n\
    \n### 代码\n\n1. 编译我们的 Java 代码：`com.book.idm.etc.SendEmail`\n2. 将类（包括包文件夹 `com.book.idm.etc`）拷贝到文件夹\
    \ `<server>\\IdentityMinder.ear\\custom`\n\n### 配置：Identity Manager User Console\n\
    \n1. 以管理员身份登录 `Identity Manager User Console`。\n2. 选择选项卡：`Roles and Tasks`，并选择管理员任务。\n\
    3. 搜索管理员任务：`Update Location and Ext Number`。\n4. 点击按钮 `Business Handlers`。\n5.\
    \ 点击添加并输入以下值：\n\n| 字段名 | 值 | 描述 |\n| :--- | :--- | :--- |\n| Name | `SendEmail`\
    \ | 逻辑处理器名称 |\n| Class | `com.book.idm.etc.SendEmail` | Java 类 |\n\n6. 点击确定并提交任务。\n\
    \n### 工作原理\n\n执行管理员任务：`Update Location and Ext Number`。\n\n1. 以管理员身份登录用户控制台。\n\
    \n### Service API\n\n代码非常直接。你可以通过 `sendMail()` 方法发送邮件。\n\n```java\nInternalServiceAccessor.getEmailProvider().sendMail(from,to,cc,bcc,encoding,priority,subject,body);\n\
    ```\n\n我们可以通过配置 `email.properties` 中的调用 `getAdminEmailID()` 获取管理员邮箱。\n\n```java\n\
    String adminEmail = InternalServiceAccessor.getEmailProvider().getAdminEmailID();\n\
    String from = adminEmail;\n```\n\n我们可以通过 `ProviderAccessor` 获取收件者邮箱（因为管理员任务中不存在邮件属性）。\n\
    \n```java\nUser user = ctx.getUserProvider().findUser(ctx.getUser().UniqueName(),\
    \ null);\nString toEmail = user.getAttribute(\"mail\");\nString to = toEmail;\n\
    ```\n\n此示例使用业务逻辑任务处理器发送邮件（在任务完成前发送）。如果你想在任务完成后发送邮件，请通过监听器中的 `after()` 方法发送邮件。\n\
    \n## 6.6 Notification Rule API\n\n此 API 仅用于邮件模板。它决定了谁接收邮件通知。\n\n### 6.6.1 编程\n\
    \n你需要创建一个扩展 `NotificationRuleAdapter` 的 Java 类并重写 `evaluate()` 方法。\n\n`public\
    \ Vector evaluate(NotificationRuleContext ctx, Hashtable templateParams)`\n- 将邮件地址放入\
    \ Vector 对象并返回。第一个参数上下文与其他 API 基本相同。第二个参数 `templateParams` 保留了邮件模板中可能指定的自定义数据键值对。\n\
    \n### 6.6.2 代码示例\n\n此示例需要上一个示例：邮件模板。因此你需要在任务完成时启用邮件模板。我们的需求是当管理员执行管理员任务：`Update\
    \ Location and Ext Number` 时，必须向用户发送邮件并抄送经理。如果他们没有经理，可以跳过抄送邮件。\n\n### 代码\n\n1.\
    \ 编译我们的 Java 代码：`com.book.idm.etc.ManagerNotificationRule`\n2. 将类（包括包文件夹 `com.book.idm.etc`）拷贝到文件夹\
    \ `<server>\\IdentityMinder.ear\\custom`\n"
- fmt: "\n### 3. Modify file `Update Location and Ext Number.tmpl` in folder `email\
    \ template`. Add notification rule name for `_cc`.\n\n```\n_cc = _util.getNotifiers(\"\
    ManagerNotificationRule\",\"param1=A,param2=B\");\n```\n\n#### Configuration:\
    \ Management Console\n\n1. In the Management Console, click `Environments`.\n\
    2. Click the name of the environment.\n3. Click `Advanced Settings`.\n4. Click\
    \ `Notification Rules`.\n\n| Field Name | Value | Description |\n| :--- | :---\
    \ | :--- |\n| Name | `ManagerNotificationRule` | Name of notification rule |\n\
    | Class | `com.book.idm.etc.ManagerNotificationRule` | Name of java class |\n\n\
    5. Click save and restart environment.\n\n#### How it works\n\nExecute admin task:\
    \ `Update Location and Ext Number`.\n\n1. Log into the Identity Manager User Console\
    \ as administrator.\n2. Select tab: `Book Example`, and select menu `Update Location\
    \ and Ext Number`.\n3. Search a user, the screen will show city drop down.\n4.\
    \ Modify city attribute, and click submit.\n\n#### Email Recipient\n\nWe user\
    \ `ProviderAccessor` and look up manager of user and then you get attribute “mail”\
    \ and add email address into vector and return.\n\n```java\nString emailManager\
    \ = manager.getAttribute(\"mail\");if (emailManager != null || emailManager.trim().length()\
    \ != 0) {emails.add(emailManager);}\n```\n\n#### Template parameters\n\nIn email\
    \ template, we add notification rule.\n\n```\n_cc = _util.getNotifiers(\"ManagerNotificationRule\"\
    ,\"param1=A,param2=B\");\n```\n\n`\"param1=A,param2=B\"` is template parameter.\
    \ We can get these values from parameters `templateParams`.\n\n```java\npublic\
    \ Vector evaluate(NotificationRuleContext ctx,Hashtable templateParams){\n   \
    \ Enumeration keys = templateParams.keys();\n    while (keys.hasMoreElements())\
    \ {\n        Object key = keys.nextElement();\n        System.out.println(\"parameter:\
    \ \" + key + \"=\"+ + templateParams.get(key));\n    }\n}\n```\n\n### 6.6.3 Use\
    \ Case\n\nWe implement use case example in the official document (Programming\
    \ Guide for Java › Notification Rule API › API Overview > Use Case Examples).\n\
    \n#### Notify a single user\n\n| When user data is being modified, retrieve the\
    \ user’s name and cc the user with the status of the request. |\n\nForm notification\
    \ rule code, you can get user name from context and add suffix as email. You have\
    \ to call notification rule in `_cc` of email template.\n\n```java\nString userName\
    \ = ctx.getSubject().getFriendlyName();String email = userName+\"@somedomain.com\"\
    ;emails.add(email);\n```\n\n#### Notify a group\n\n| When a user is being created\
    \ and added to a group, retrieve the group name (from the context information\
    \ passed into the notification rule) and cc the group about the new group member.\
    \ |\n\nWe write the email template under event: `AddToGroupEvent`, so primary\
    \ object is group. We get group name and add group name as context information\
    \ in email template and pass to notification rule.\n\n```java\nString groupName\
    \ = _eventContextInformation.getPrimaryObjectName();_cc = _util.getNotifiers(\"\
    NotificationRule\",\"group=\"+groupName);\n```\n\n### 6.6.3 Notification Rule\
    \ and Email Template Limitation and Service API\n\nThere are some issues about\
    \ email template and notification rules:\n\n- The Notification Rule works with\
    \ email template only, and Notification Rule is not necessary for Service API.\n\
    - The goal of notification rule is who email recipients are. While we can use\
    \ service API (`InternalServiceAccessor.getEmailProviderService()`), we can access\
    \ recipients: `to`, `cc` and `bcc`. We can use context to search email attribute.\n\
    - The email template support dynamic content but you need to learn new JSP tag\
    \ lib.\n- If you use email template, you may have to learn new tag lib, for example\
    \ `_taskContextInformation`. If you choose service API, you can use simple java\
    \ code or the popular template java framework likes Apache Velocity generate email\
    \ content.\n- The email template works under conditions of task or event, fail,\
    \ complete, etc.\n- While as service API can called any time in code.\n\n## 6.7\
    \ Task Execution Web Service (TEWS)\n\nMany people confuse about Task Execution\
    \ Web Service.  The task execution web service or TEWS make admin task as web\
    \ services producer. It is not consumer. The TEWS is a web service interface that\
    \ allows third-party client applications to submit remote tasks to CA IdentityMinder.\n\
    \n![](OEBPS/image_rsrc8Y6.jpg)\n\nFigure 6-23 shows how TEWS works\n\n### 6.7.1\
    \ Code Example\n\nWe develop java client to consume TEWS. We want to execute our\
    \ admin task: `Update Location and Ext Number` by java web services.\n\nPlease\
    \ disable all previous code: Policy Xpress, workflow, validation and email notification.\n\
    \n#### Configuration: Management Console\n\n1. In the management console, click\
    \ `Environments`.\n2. Click the name of the environment where the web services\
    \ used.\n3. Click `Advanced Settings`.\n4. Click `Web Services`.\n5. Put value\
    \ as below\n\n| Field Name | Value | Description |\n| :--- | :--- | :--- |\n|\
    \ Enable Execution | Check | Check to enable the Task Execution Web Service (TEWS)\
    \ for the environment. |\n| Enable WSDL Generation | Check | Check to enable WSDL\
    \ generation for the environment. |\n| Enable admin_id | Check | TEWS uses the\
    \ admin ID found in the SOAP message sent to the web service to authenticate the\
    \ request.If this option is not selected, the ID of the user who generated the\
    \ request is used to authenticate the request. |\n| SiteMinder Authentication\
    \ | none | For authentication, in our example we use none. |\n\n![](OEBPS/image_rsrc8Y7.jpg)\n\
    \nFigure 6-24 shows management console\n\n#### Configuration: Identity Manager\
    \ User Console\n\n1. Log into the User Console.\n2. Select `Roles` and `Tasks`.\
    \ Select `Admin Tasks`.\n3. Select `Update Location and Ext Number`.\n4. Select\
    \ `Enable Web Services`.\n5. Click `Submit` to save changes.\n\n![](OEBPS/image_rsrc8Y8.jpg)\n\
    \nFigure 6-25 shows admin task\n\n#### Code\n\nWe. ` java from byWS.. the admin\
    \ task: `Update Location and Ext Number`.\n\n```bash\njava -cp lib/axis.jar;lib/log4j-1.2.jar;lib/wsdlj-1.5.jar;lib/commons-logging-1.0.jar;lib/commons-discovery...../.............................\n\
    \n......................................................................jar;lib/commons-discovery-0.2.jar;lib/jaxrpc.jar;lib/axis.jar;lib/axis.jar;lib/log4j-1.2.jar;lib/wsdl4.jar;lib/jaxrpc.jar;\
    \ org.apache.axis.wsdl.WSDL2Java -wrapArrays=true http://<host>:8080/idm/TEWS?wsdl\n\
    ```\n\n2. Copy the generated code to eclipse.\n3. Open java code in eclipse: `com.book.idm.etc.TEWSClient`\n\
    4. Check the required parameters.\n    - `userId` is user you want to modify.\n\
    \    - `adminDN` is name who execute this task. We will go more detail.\n    -\
    \ `City` and `extNumber` are the values we want to modify.\n\n```java\nString\
    \ userId = \"allmi01\";String adminDN = \"uid=superuser,ou=users,ou=na,dc=host,dc=com\"\
    ;\nString city = \"New York\";\nString extNumber = \"1234\";\n```\n\n#### How\
    \ it works\n\n1. Execute our java code from eclipse : `com.book.idm.etc.TEWSClient`\n\
