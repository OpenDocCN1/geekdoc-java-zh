    4.  Synchronization


    This section describes synchronization behavior after submitted this task. There
    are 2 type of synchronization:


    *   User Synchronization means task will synchronize users with “identity policies
    set”.


    *   Account Synchronization means any modification in this task will synchronizes
    with global user and accounts.


    There are 3 choices to tell when we want synchronization execute:


    *   None: do nothing, do not synchronization.


    *   On Task completion: means when task complete, it will trigger synchronization.


    *   On Every Event: when task has been submitted, many events will be generated.
    Synchronization will occur on every event complete.  This option may impact performance
    because synchronization may occur more than one time.


    | Field Name | Value | Description |


    | User Synchronization | On Task completion | It will synchronize users with “identity
    policies” after task complete |


    | Account Synchronization | On Task completion | It will synchronize account in
    endpoint after task complete |


