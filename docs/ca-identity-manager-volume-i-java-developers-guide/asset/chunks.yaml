  trans: "\n\n* 如果用户的办公室在纽约，则此任务需要 2 个审批者。如果用户的办公室在伦敦，则此任务需要额外一个审批者。\n* 该需求要求在入职日期启用账户。\n\
    \n### 3.1.3 参与者解析 API (Participant Resolver API)\n\n该 API 作为工作流的一部分。参与者解析 API\
    \ 回问题：谁是审批者。我们可以为查找审批者实现条件。\n\n示例：\n\n* 我们希望经理的经理作为审批者。\n\n| ![](img/image_rsrc8TH.jpg)\
    \ |\n| 图 3-4 显示工作流具有需要参与者解析 API 的审批者 |\n\n### 3.1.4 事件监听器 API (Event Listener\
    \ API)\n\n我们可以实现自定义监听器来监听事件。当事件发生时，事件监听器会在特定的执行状态下执行业务逻辑：之前、之后、失败、批准、拒绝。事件监听器在异步阶段运行。\n\
    \n示例：\n\n* 用户创建成功后，向消息队列（MQ）发送消息。\n* 如果管理员在任何修改用户事件上选择拒绝，监听器将写入日志文件。\n\n| ![](img/image_rsrc8TJ.jpg)\
    \ |\n| 图 3-5 显示事件监听器 API 可以监听事件。 |\n\n### 3.1.5 逻辑属性 API (Logical Attribute API)\n\
    \n逻辑属性 API 显示属性的方式与其在用户目录中物理存储的方式不同。当你的属性在多个屏幕中共享，且你不想在每个屏幕上对值进行翻译逻辑处理时，应使用此 API。\n\
    \n示例：\n\n* 你有一个物理属性 `BusinessCategory`，其值为代码形式：1001、2001 或 3001，但在屏幕上显示为广告、零售或电信。\n\
    \n| ![](img/image_rsrc8TK.jpg) |\n| 图 3-6 显示逻辑属性 API 在屏幕上将物理值转换为逻辑值。 |\n\n###\
    \ 3.1.6 验证规则 (Validation Rules)\n\n它用于在屏幕上验证字段的值。你可以在以下位置编写规则：\n\n* 任务级：它将在特定屏幕上进行验证。\n\
    * 目录级：它将在任何屏幕上每次对该字段进行验证。\n\n示例：\n\n* 员工编号必须全为数字。\n\n### 3.1.7 邮件模板 (Email Template)\n\
    \n从 CA IdentityMinder 发送邮件有 2 种方式。\n\n* 邮件通知策略。\n* 邮件模板\n\n邮件模板 API 是其中之一。我们可以通过编写模板文件来实现。\n\
    \n### 3.1.8 通知规则 (Notification Rule)\n\n通知规则决定谁接收邮件。通知规则仅在邮件模板未使用。\n\n示例：\n\n\
    * 在任务更新位置完成后向 HR 经理发送邮件。\n    * 邮件模板用于生成邮件内容以及 Determine 何时该发送邮件。\n    * 通知规则用于获取\
    \ HR 经理的电子邮箱地址。\n\n### 3.1.9 任务执行 Web 服务 (TEWS)\n\n如果我们希望第三方系统执行我们的管理任务，必须启用 TEWS\
    \ 功能。TEWS 将管理任务作为 Web 服务提供者启用。\n\n示例：\n\n* 用户使用 Web 门户修改地址。门户调用企业服务总线 (ESB)，然后\
    \ ESB 调用管理任务的 Web 服务来更新地址。\n\n## 3.2 任务阶段\n\n我们已经讨论过同步阶段和异步阶段的概述。本节将解释管理任务执行的阶段细节，以及每个\
    \ API 何时会被执行。\n\n你现在不需要记住所有内容，当你练习书中的示例时，你会自然地记住它们。\n\n### 3.2.1 同步阶段操作\n\n1.\
    \ 用户选择要执行的管理任务。\n* 业务逻辑任务处理程序 API：调用 `handleStart()` 方法。\n2. 选择了管理任务主体，但尚未显示。\n\
    * 业务逻辑任务处理程序 API：调用 `handleSetSubject()` 方法。\n* 字段的默认值可以使用 JavaScript 或硬编码初始化。\n\
    * 与物理属性关联的字段将自动从数据存储中填充相应的数据。\n3. CA IdentityMinder 显示并填充任务屏幕。\n* 逻辑属性：调用方法 `toLogical()`\
    \ 来转换物理属性。\n4. 当用户点击验证按钮（如果你有）或用户更改标签页或你有在更改时进行验证的逻辑时，CA IdentityMinder 在数据输入期间调用验证规则。\n\
    5. 用户提交任务屏幕。\n* 调用验证规则。\n* 逻辑属性 API：调用方法 `validate()` 执行字段级验证。\n* 逻辑属性 API：调用方法\
    \ `toPhysical()` 将逻辑属性转换回相应的物理属性。\n* 业务逻辑任务处理程序 API：调用方法 `handleValidation()`\
    \ 执行任务级验证。\n6. 用户提交任务屏幕。\n如果发生验证错误，错误将立即报告给用户。允许用户纠错误并重新提交任务。\n7. CA IdentityMinder\
    \ 为任务实例化事件。\n在成功完成所有验证后，CA IdentityMinder 会创建事件。每个事务由一个事件表示。\n8. 任务进入异步阶段进行处理。\n\
    有 3 个主要的 API：业务逻辑任务处理程序、验证规则和逻辑属性在同步阶段执行。下面的图片显示提交管理任务后的屏幕。消息“任务待处理 (Task pending)”意味着该任务后面有事件在处理，或者异步阶段从现在开始。\n\
    \n| ![](img/image_rsrc8TM.jpg) |\n| 图 3-7 显示显示任务待处理的屏幕 |\n\n### 3.2.2 异步阶段操作\n\
    \n1. CA IdentityMinder 发布事件。\n2. 事件监听器执行审批前的更新\n* 事件监听器 API：调用 `before()`。\n3.\
    \ 自定义对象在处理期间执行操作\n* 参与者解析 API：如果工作流指定了工作流活动的参与者（审批者），调用方法 `resolve()`。\n* 工作流\
    \ API：`start`。如果启用了工作流，且事件映射到工作流过程，则工作流中的活动必须完成。\n4. 事件监听器执行执行前的更新\n* 工作流导致关联事件的批准或拒绝。\n\
    * 当工作流被批准时，CA IdentityMinder 执行关联事件。\n    * 事件监听器 API：调用 `approve()` 或 `reject()`。\n\
    5. CA IdentityMinder 执行事件\n6. 事件监听器执行后续操作\n* 事件监听器 API：调用 `after()`。\n7. CA IdentityMinder\
    \ 生成邮件通知\n* 调用邮件模板 API 和通知规则。\n\n有 5 个 API：事件监听器、工作流、参与者解析、邮件模板和通知规则在异步阶段使用。\n\
    \n## 3.3 配置 IDE\n\n我们使用 Eclipse 开发代码。请从书中下载。\n\n类路径\n\n请检查项目属性 (Properties) >\
    \ Java 构建路径 (Build Path)。\n\n如果你使用的是版本 12.6：\n* 创建类路径变量：`IDM_LIB`\n    * 选择窗口\
    \ > 首选项 > 类路径变量 > 新建\n    * 设置路径为 `/server\\IdentityMinder.ear\\library`\n   \
    \     * 如果使用 WebLogic，所有的 jar 位于 APP-INF\\lib\n\n| ![](img/image_rsrc8TN.jpg)\
    \ |\n| 图 3-8 显示类路径变量 |\n\n如果你使用的是版本 12.5，移除所有我的 jar：\n* 从部署文件夹 `/server\\IdentityMinder.ear\\\
    library` 添加所有 jar\n    * 如果使用 WebLogic，所有的 jar 位于 APP-INF\\lib\n* 从 `/server>IdentityMinder.ear\\\
    user_console.war\\WEB-INF\\lib` 添加 `identitymanager.jar`\n\n导入项目\n* 运行 Eclipse\
    \ 并选择导入 > 将现有项目导入工作区。\n* 浏览归文件，选择项目并点击完成。\n\n| ![](img/image_rsrc8TP.jpg) |\n\
    | 图 3-9 显示导入项目 |\n\n"
- fmt: "\n*   The Task Execution Web Service enables the admin task as web services’\
    \ provider\n\nCA provides java doc of each APIs through bookshelf > CA IdentityMinder\
    \ > programming > Javadoc Programming Reference. The next chapter will go in details\
    \ of Business Logic Task Handler API.\n\n# Chapter 4 Business Logic Task Handler\n\
    \nBusiness Logic Task Handler API or `BLTH` is the API to perform business logic\
    \ at admin task level. There are the unique characters of Business Logic Task\
    \ Handler:\n\n*   Business Logic Task Handler API works at admin task session\
    \ level.\n*   Business Logic Task Handler API executes under synchronized phase\n\
    \    *   It means users have to wait until the logic complete.\n*   Business Logic\
    \ Task Handler API must be complete before any events created.\n*   Business Logic\
    \ Task Handler API is good for:\n    *   Validating and formatting task screen\
    \ fields.\n    *   Enforcing custom business logic that require response immediately\
    \ (synchronous)\n\n## 4.1 Programming and Configuration Concepts\n\nBusiness Logic\
    \ Task Handler API can implement by Java or server side Java script. Our book\
    \ use only Java language. For server side Java script, you can see in the details\
    \ official document. We will use `java` as the one language for every APIs and\
    \ we can gain benefit from java utility library also.\n\n### 4.1.1 Programming\n\
    \nImplementation Business Logic Task Handler API, we just create `java` class\
    \ and extend `BLTHAdapter` class and override the methods. Each methods is call-back\
    \ method will be execute during admin task‘s life cycle. You can choose implement\
    \ some or all of the methods depending on your requirement:\n\n*   `handleStart()`:\
    \ will execute at the beginning of the task.\n*   `handleSetSubject()`: will execute\
    \ after selecting the subject (for example select user) from the search result.\
    \ It uses set initial value on screen.\n*   `handleValidation()`: will execute\
    \ after the user has submitted the task. It is validation.\n*   `handleSubmission()`:\
    \ will execute after `handleValidation()`. It uses to perform logic.\n\n#### Development\
    \ Steps\n\n1.  Writing `java` code which extends `BLTHAdapter`.\n2.  Compiling\
    \ and make sure there is no error and use `JDK` version same as server version.\n\
    3.  Copy class file (include package folder) to folder `\\IdentityMinder.ear\\\
    custom`\n\n### 4.1.2 Configuration\n\nBusiness logic task handlers can be configured\
    \ by 2 ways of scope:\n\n*   Global business logic task handlers: this level means\
    \ it will be applied to all admin tasks. Our `java` code will be executed every\
    \ time when any admin tasks are called.\n*   Task-specific business logic task\
    \ handlers: this `java` code will be executed with specific admin tasks that are\
    \ configured. This scope will be used frequency in this book.\n\n#### Global business\
    \ logic task handlers\n\nThey are configured in the Management Console and select\
    \ Home > Environments > `<your server>` > Advanced Settings > Business Logic Task\
    \ Handlers\n\n| ![](OEBPS/image_rsrc8TR.jpg) |\n| Figure 4-1 shows screen for\
    \ global business logic task handlers |\n\nYou can click button `New` configure\
    \ Business Logic Task Handler. The each field on configuration screen is same\
    \ as the task-specific business logic task handlers.\n\n#### Task-specific business\
    \ logic task handlers\n\nThis level will apply to on specific admin tasks. There\
    \ are steps:\n\n1.  Log into the Identity Manager User Console as administrator.\n\
    2.  Search admin task name\n3.  To click button `Business Logic Task Handlers`,\
    \ then click `Add` button to specific `java` class name.\n\n| ![](OEBPS/image_rsrc8TS.jpg)\
    \ |\n| Figure 4-2 shows button `Business Logic Task Handlers` for task specific\
    \ |\n\n## 4.2 Task Session\n\nA task session is an instance of an executing task.\
    \ During task execution, business logic task handlers can access to the information\
    \ in the current task session. Task session information is available through the\
    \ `BLTHContext`. The Interface provides methods for retrieving the run-time instances\
    \ of managed objects in the current task session, for example:\n\n*   Method `getUser()`:\
    \ retrieves the `User` object involved in the current task.\n    *   Please note,\
    \ `getUser()` will work, if admin task has primary object is `User`, for example\
    \ modify user. If your admin task is modify endpoint, it does not make sense to\
    \ call `getUser()`.\n*   Get any relationship objects (such as roles and groups).\n\
    \n`BLTHContext` inherit from many parent interfaces:\n\n*   `TaskInfo`: information\
    \ about the current task for examples: `getSubject()` return primary object.\n\
    *   `IMContext`: provides method about session that uses to share session between\
    \ APIs. This interface provides method `getAuxDataRoot()` to access the root of\
    \ the auxiliary data tree also.\n*   `ProviderAccessor`: provides direct access\
    \ to any managed objects in the data store. We will talk about the managed object\
    \ in next section.\n\n## 4.3 Access to Managed Objects\n\nManaged object means\
    \ object in the data store such as user or account. A business logic task handler\
    \ can access a managed object in the following 2 ways:\n\n#### By ProviderAccessor\n\
    \nThe `Provider Access` is parent class of `BLTHContext`:\n\n*   Can access any\
    \ managed object.\n*   Can access any attributes in managed object.\n*   When\
    \ call `modifyObject()`, any changes made to a managed object are immediately\
    \ persist to the data store.\n    *   No events are generated, and no workflow\
    \ approvals, auditing, or security checks are performed.\n\n#### By Context\n\n\
    The `Context` in this chapter means `BLTHContext` but other chapters mean `WorkflowContext`,\
    \ `EventContext` etc.\n\n*   Limit access to the task session includes the subject\
    \ (primary object) of the task and the subject’s relationships.\n    *   For example\
    \ admin task: Modify User. The context can access only `User` object is the managed\
    \ objects of this task.\n*   Limit access the attributes\n    *   For example\
    \ if admin task defines only city attributes of user object, you cannot access\
    \ country of user object.\n*   Any changes will commit when event is complete.\n\
    \    *   For example you use `BLTHContext` to modify city, but user modify event\
    \ (inside event) are rejected. The city attribute will not commit.\n    *   CA\
    \ IdentityMinder generates events for the task, and workflow approvals, auditing,\
    \ and security checks can be performed.\n\n| ![](OEBPS/image_rsrc8TT.jpg) |\n\
    | Figure 4-3 shows 2 ways to access managed object. |\n\nThe below table compare\
    \ the different between `BLTHContext` and ProvideAccessor\n\n| Topic | ProviderAccessor\
    \ | BLTHContext |\n| :--- | :--- | :--- |\n| Access Object | Can access any managed\
    \ objects. | Access only objects that are related in task session. |\n| Access\
    \ Attributes | Can access any attributes. | Limit access, depending when you define\
    \ admin task. |\n| Modify values | When call `modifyObject()`, modified values\
    \ are immediately committed in the data store. | The values are not committed,\
    \ until the event has been complete. |\n| Events | No additional events are generated.\
    \ | Relate to event associated with the task |\n\nWe will cover more details of\
    \ managed object by example in next section and next chapters.\n\n## 4.4 Code\
    \ Examples\n\nCA IdentityMinder programming part, we use `java` project named:\
    \ `IdmCode`. We reuse admin task from previous chapter. We will execute admin\
    \ task with Business Logic Task Handler API only, so we need to disable Identity\
    \ Policy Set and policy Xpress from previous chapter.\n\n| ![](OEBPS/image_rsrc8TU.jpg)\
    \ |\n| Figure 4-4 shows disable Identity Policy Set and Policy Xpress by uncheck\
    \ enable check box\n\n### 4.4.1 Basic programming: BLTHAdapter and life cycle\n\
    \nThis example shows step by step the basic programming of Business Logic Task\
    \ Handler. The CA IdentityMinder programming always requires 2 parts: coding and\
    \ configuration. This example just show Business Logic Task Handler API life cycle.\
    \ We will print in log file.\n\n#### Code\n\n1.  Run the eclipse and select `java`\
    \ class:\n    *   Package: `com.book.idm.blth`\n    *   Class: `BasicLifeCycle`\n\
    \    *   Extend `BLTHAdapter`\n\nThe list below show our code\n"
