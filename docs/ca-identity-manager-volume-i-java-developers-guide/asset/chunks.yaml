    \ | 0 |\n\n| ![](OEBPS/image_rsrc8R4.jpg) |\n\n| Figure 2-6 shows category value.\
    \ |\n\n3.  What is primary object and action?\n\nIt is very important. It is kind\
    \ of questions: what you want to do? I want to modify user information. So primary\
