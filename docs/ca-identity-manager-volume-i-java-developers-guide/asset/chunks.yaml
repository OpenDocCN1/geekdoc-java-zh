    import com.netegrity.imapi.BLTHContext;\n\npublic class BasicLifeCycle extends\
    \ BLTHAdapter {\n    @Override\n    public void handleStart(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleStart\"\
    );\n    }\n\n    @Override\n    public void handleSetSubject(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleSetSubject\"\
    );\n    }\n\n    @Override\n    public void handleValidation(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleValidation\"\
    );\n    }\n\n    @Override\n    public void handleSubmission(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleSubmission\"\
    );\n    }\n}\n```\n\n2. 编译并复制类（包括包文件夹 `com.book.idm.blth`）到文件夹 `\\IdentityMinder.ear\\\
    custom`。\n\n## 配置\n\n有两种类型的配置：全局业务逻辑任务处理器和特定任务的业务逻辑任务处理器。我们在所有示例中都选择了特定任务的业务逻辑任务处理器。\n\
    \n1. 搜索我们的管理任务名称：`Update Location and Ext Number`。\n2. 点击 `Business Logic Task\
    \ Handlers` 按钮，然后点击 `Add` 按钮指定 Java 类名。\n3. 如下所示填写值：\n\n| 字段名称 | 值 | 描述 |\n| :---\
    \ | :--- | :--- |\n| Name | BLTHExample | 业务逻辑任务处理器的名称 |\n| Java Class | com.book.idm.blth.BasicLifeCycle\
    \ | 我们放在 custom 文件夹中的 Java 类名 |\n\n| ![](img/image_rsrc8TV.jpg) |\n| 图 4-5 显示了业务逻辑任务处理器的详情界面\
    \ |\n\n4. 点击 ok 并提交此管理任务。\n\n## 工作原理\n\n我们可以通过以下步骤通过管理任务执行我们的代码：\n\n1. 以管理员身份登录\
    \ Identity Manager 用户控制台。\n2. 选择标签页：`Book Example` 并选择菜单：`Basic`。\n3. 选择管理任务：`Update\
    \ Location and Ext Number`。\n\n| ![](img/image_rsrc8TW.jpg) |\n| 图 4-6 显示了选择管理任务\
    \ |\n\n日志文件显示：\n\n`| INFO [STDOUT]UpdateLocationExtNumber:handleStart`\n\n4. 然后，搜索并选择一些用户。当管理任务显示时，日志文件将显示：\n\
    \n`| INFO  [STDOUT]  UpdateLocationExtNumber:handleSetSubject`\n\n| ![](img/image_rsrc8TX.jpg)\
    \ |\n| 图 4-7 显示了管理任务的显示界面 |\n\n5. 修改城市属性（你必须修改城市值）并提交管理任务，日志将显示：\n\n`| INFO [STDOUT]\
    \ UpdateLocationExtNumber:handleValidationINFO [STDOUT] UpdateLocationExtNumber:handleSubmission`\n\
    \n你将看到业务逻辑任务处理器的生命周期，以及 `BLTHAdapter` 的每个方法何时何时执行。\n\n### 4.4.2 通过 BLTHContext\
    \ 修改用户属性\n\n此示例将演示如何使用 `BLTHContext`：\n\n* 将城市属性修改为“New City”。\n* 从父接口获取有关当前任务的信息：`TaskInfo`。\n\
    \n## 代码\n\n1. 编译我们的 Java 代码：`com.book.idm.blth.ModifyUserByBLTHContext`。\n2. 复制类（包括包文件夹\
