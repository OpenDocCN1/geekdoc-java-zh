  trans: "\n\n如果你需要审批人，你必须执行以下操作：（你可以在示例代码中查看详情）\n\n- 将活动节点拖入到画布\n- 在 `resources`\
    \ 标签页中：选择 `IMApprovers`\n- 在 `agents` 标签页中：选择 `Nobody AutoComplete` 为异步\n- 在 `user\
    \ data` 标签页中，按下表设置值：（我们在示例中有详细的步骤说明：基础自定义工作流。）\n\n| Name | Type | Description\
    \ |\n| :--- | :--- | :--- |\n| ACTION_PERFORMED | Text | 用于转换 |\n| PARTICIPANT_ID\
    \ | Text | 审批人 ID |\n| PARTICIPANT_NAME | Text | 链接到属性文件 |\n| PARTICIPANT_DESCRIPTION\
    \ | Text | 链接到属性文件 |\n\n## 规则 4：在管理员任务级别的工作流（可选）\n\n默认情况下，工作流可以在事件级别运行。如果你想让工作流在管理员任务级别运行，你必须：\n\
    \n- 选择流程的 `User Data` 并添加 `TASK_LEVEL = true`\n\n### 5.2.2 工作点组件\n\n我们将介绍 Workpoint\
    \ Designer 的基本组件。\n\n#### 活动节点\n活动代表业务流程中的一个步骤。根据活动完成的方式，共有 3 类型的活动。节点的显示方式有所不同。\n\
    \n| Node | Type | Description |\n| :--- | :--- | :--- |\n| ![](img/image_rsrc8V6.jpg)\
    \ | 人工自动 | 它将由人员完成，用于审批人。 |\n| ![](img/image_rsrc8V7.jpg) | 活动自动 | 需要特殊的代码来完成活动\
    \ |\n| ![](img/image_rsrc8V8.jpg) | 服务器自动 | WorkPoint Server 自动完成此活动 |\n\n如果你需要审批人，请选择节点类型\
    \ `Automated by a person`。\n\n如果你必须执行任何逻辑或调用任何后端，请选择节点类型 `Automated by server`。例如，你有逻辑来调用\
    \ Web 服务，当逻辑完成时，Workpoint 将移动到下一个节点。你编写任何特殊代码。\n\n如果你选择节点类型 `Automated by activity`\
    \ 来调用 Web 服务，当逻辑完成后，它不会移动到下一个节点。流程将停止。你必须编写特殊代码来完成该节点的活动，然后 Workpoint 才会移动到下一个节点。（`Approve`\
    \ 和 `Reject` 节点已有用于完成活动的代码）\n\n下图显示了 3 种活动/节点。\n\n- 节点 `App Admin` 是活动：人工自动。\n\
    - 节点 `Call Web Servcies` 是活动：服务器自动。\n- 节点 `Approve` 和 `Reject` 是活动：活动自动。\n\n|\
    \ ![](img/image_rsrc8V9.jpg) |\n| 图 5-18 显示了 3 种活动 |\n\n#### 转换 (Transition)\n\
    转换是工作图中连接两个不同节点的线。转换可以是无条件的，也可以是有条件的。有条件的转换与转换选择脚本相关联。\n\n我们使用转换作为工作流中的选择路径。下图显示了带有条件的转换。例如，如果部门等于中心，则进入发送工单，然后发送邮件并完成工作流。\n\
    \n| ![](img/image_rsrc8VA.jpg) |\n| 图 5-19 显示了 3 个有条件的转换。 |\n\n#### 延迟节点\n延迟代表业务流程中的暂停或保持。例如，在配置过程中，我们创建了用户，但必须等待到入职日期，然后才会启用该用户。如果用户的城市是纽约，我们将在早上\
    \ 6 点为用户添加角色。\n\n| ![](img/image_rsrc8VB.jpg) |\n| 图 5-20 显示了延迟的示例 |\n\n#### 分类\
    \ (Category)\n类别是对象的组。类别可用于过滤设计器中的告警、邮件、脚本、流程和节点模板列表。类别帮助我们导入和导出工作流。\n\n#### 参数\
    \ (Parameters)\n当我们编写代码时，Workpoint 提供了一些参数：\n\n- `ClientContext`：对于 CA IdentityMinder，`ClientContext`\
    \ 是构建 `WorkflowContext` 的必需参数。`WorkflowContext` 是 `ProviderAccessor` API 的子类。\n\
    - `SymbolTable`：它用于向 WorkPoint Server 返回结果值。我们通常在 `Delay` 节点中使用 `SymbolTable`\
    \ 来回答延迟多久。\n- `JobData`：它包含任务级别的数据。我们使用 `JobData` 在节点之间共享数据。\n- `ActivityInstData`：它包含节点级的数据。我们通常在\
    \ `Transition` 中使用 `ActivityInstData`。\n\n## 5.3 代码示例\n\n本章的示例将包含 2 部分： \n\n-\
    \ Workpoint 和代码\n- 配置。\n\n我们将使用上一章中的管理员任务。请禁用上一章中与管理员任务 `Update Location and Ext\
    \ number` 相关的 Identity Policy Set、`policy Xpress` 和 `Business Logic Task Handler\
    \ API`。\n\n| ![](img/image_rsrc8VC.jpg) |\n| 图 5-21 显示了管理员任务 |\n\n我们可以通过以下方式移除\
    \ `Business Logic Task Handler`：\n\n- 搜索我们的管理员任务名称：`Update Location and Ext Number`\n\
    - 点击 `Business Logic Task Handlers` 按钮，然后点击减号图标移除 Business Logic Task Handler\n\
    - 点击确定并提交。\n\n| ![](img/image_rsrc8VD.jpg) |\n| 图 5-22 显示了移除 Business Logic Task\
    \ Handler 的图标 |\n\n### 5.3.1 工作流：单个审批人\n我们将创建一个有一个审批人的基本工作流并将其部署到 CA IdentityMinder。此示例仍然不需要任何编程。\n\
    \n如果你不想手动创建工作流，可以导入工作流，请参见附录 A。\n\n#### Workpoint 和代码\n1. 运行 Workpoint 设计。\n2.\
    \ 创建新流程，点击顶部的\n| ![](img/image_rsrc8VE.jpg) |\n| 图 5-23 显示“New Process” |\n3.\
    \ 在 general 标签页中按如下表填写值：\n\n| Name | Value | Description |\n| :--- | :--- | :---\
    \ |\n| Name | One Approver | Name 字段包含工作流名称 |\n| Reference | Example | Reference\
    \ 字段包含唯一标识 |\n4. 点击 `OK`。下图显示了 general 标签页中的值。\n\n| ![](img/image_rsrc8VF.jpg)\
    \ |\n| 图 5-24 显示 general 标签页中的值 |\n5. 根据规则 1，流程必须以 `Start` 节点开始并以 `Stop` 节点结束。从菜单拖节点到画布。\n\
    \n| ![](img/image_rsrc8VG.jpg) |\n| 图 5-25 显示“Start”和“Stop” |\n6. 根据规则 2，流程在 Stop\
    \ 节点之前必须有 Approve 或 Reject 状态。从菜单拖 `Activity` 节点。\n\n| ![](img/image_rsrc8VH.jpg)\
    \ |\n| 图 5-26 显示“Activity” |\n\n点击节点（`Node3`）并按下表填写：\n\n| Tab | Field Name | Value\
    \ | Description |\n| :--- | :--- | :--- | :--- |\n| General | Approve | Name 字段包含活动名称\
    \ |\n| Resources | Assignment | External | Resource 页面识别执行活动的资源。对于 CA IdentityMinder，选择\
    \ External。 |\n| Agents | Asynchronous | Notify Approve | 此值对于 CA IdentityMinder\
    \ 是必需的。选择脚本 `Notify Approve`。 |\n\n| ![](img/image_rsrc8VJ.jpg) |\n| 图 5-27 显示带有脚本\
    \ Notify Approve 的 resources 标签页 |\n\n然后点击确定。下一步我们将做 Reject 状态（`Node4`）。它与审批活动几乎相同，但脚本代理是\
    \ `Notify Reject`。\n\n| Tab | Field Name | Value | Description |\n| :--- | :---\
    \ | :--- | :--- |\n| General | Reject | Name 字段包含活动名称 |\n| Resources | Assignment\
    \ | External | 对于 CA IdentityMinder，选择 External。 |\n| Agents | Asynchronous |\
    \ Notify Reject | 此值对于 CA IdentityMinder 是必需的。选择脚本 `Notify Reject`。 |\n\n| ![](img/image_rsrc8VK.jpg)\
    \ |\n| 图 5-28 显示带有脚本 Notify Reject 的 agents 标签页 |\n\n完成此步骤后，我们的画布应显示所示。\n\n| ![](img/image_rsrc8VM.jpg)\
    \ |\n| 图 5-29 显示画布 |\n\n7. 对于审批人，将 `Activity` 节点拖入画布\n\n| ![](img/image_rsrc8VN.jpg)\
    \ |\n| 图 5-30 显示活动节点 |\n\n规则 3：如果我们有审批人，我们必须设置某些属性。右键点击审批节点并选择属性。审批人节点需要如下配置：\n\
    \n| Tab | Field Name | Value | Description |\n| :--- | :--- | :--- | :--- |\n\
    | General | Name | Approver | Name 字段包含活动名称 |\n| Resources | Assignment | Any\
    \ | 此值对于 CA IdentityMinder 是必需的。选择资源：`IM Approvers`。 |\n| Include | IM Approvers\
    \ | | |"
