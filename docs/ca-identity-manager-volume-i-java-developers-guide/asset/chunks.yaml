- fmt: "\n![](OEBPS/image_rsrc8PK.jpg)\n\n# Preface\n\nCA IdentityMinder Volume I:\
    \ Java Developer's Guide will guide you java programming to extend the functionality\
    \ of CA IdentityMinder. You will learn basic administration concept, CA IdentityMinder’s\
    \ APIs, how to create custom workflow, and examples.\n\nMy CA IdentityMinder (formerly\
    \ CA Identity Manager) Programming is a series of three books:\n\n* CA Identity\
    \ Manager Volume I: Java Developer's Guide, for beginning level.\n* CA Identity\
    \ Manager Volume II: Learn by Example Code, for advanced level.\n* CA Identity\
    \ Manager: Custom Connectors Guide, for the custom connector developer.\n\nPlease\
    \ visit book’s web site for more details.\n\n## About This Book\n\nYou will learn:\n\
    \n* CA IdentityMinder Administration Concepts\n* CA IdentityMinder Programming\
    \ Concepts\n* How to develop Business Logic Task Handler and example codes.\n\
    * How to create Custom Workflows and Workflow API example codes.\n* How to implement\
    \ Participant Resolver API and example code.\n* How to implement Event Listener\
    \ API and example code.\n* How to implement Logical Attribute API and example\
    \ code.\n* How to implement Validation Rules and example code.\n* How to implement\
    \ Email Notification and example code.\n* How to implement Notification Rule API\
    \ and example code.\n* How to implement Task Execution Web Service (TEWS) and\
    \ example code.\n\n## Who this book for\n\nThis book is intended for beginners\
    \ who know a little about Java programming and would like to learn how to implement\
    \ CA IdentityMinder requirements by API.\n\n![](OEBPS/image_rsrc8PM.jpg)\n\n##\
    \ Convention\n\nThe following text conventions are used in this document:\n\n\
