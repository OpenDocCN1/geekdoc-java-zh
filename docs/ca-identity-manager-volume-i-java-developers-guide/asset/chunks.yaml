    \ HR manager as second approver\n\n    *   Adding role request requires IT manager\
    \ second approver.\n\nWe specific the first approver workflow at Admin Task Level\
    \ and the HR and IT workflow at Event Level: ModifyUserEvent and AssignAccessRoleEvent.\
    \ This case shows in the picture below.\n\n| ![](OEBPS/image_rsrc8UP.jpg) |\n\n\
    | Figure 5-3 shows workflow of Senario4 |\n\nAdmin Task Level"
