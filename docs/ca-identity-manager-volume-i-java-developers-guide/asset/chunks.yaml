  trans: "\n\n```java\npublic static WorkflowContext getWorkflowContext(ClientContext\
    \ clientContext,JobData thisJobData) throws WorkPointEJBException,Exception{\n\
    \    TableID jobTableId = thisJobData.getJobID();\n    Job job = Job.queryByID(clientContext,\
    \ jobTableId, true);\n    //Get the idJobUserDataTable \n    imsIdUD = job.getUserData(\"\
    ims-id\");\n    String imsId = (String)imsIdUD.getVariableValue();\n    String\
    \ envOid = (String)job.getUserData(\"ime-id\").getVariableValue();\n    WorkflowContext\
    \ workflowContext = (new WorkflowCallbackHelper()).generateWorkflowContext(imsId,envOid);\n\
    \    return workflowContext;\n}\n```\n\n`WorkflowCallbackHelper.generateWorkflowContext`\
    \ 需要 2 个参数：`ims-id` 和 `ime-id`。这些 ID 在任务创建时生成。你可以搜索该任务（流程实例），在画布上点击右键并查看任务的 user\
    \ data（用户数据）标签卡。我们的代码通过 `queryByID()` 方法获取当前任务，然后通过 `getUserData()` 方法获取 `ims-id`\
    \ 和 `ime-id`。\n\n顺带一下，获取 `WorkflowContext` 的代码模式可以直接复制并复用。\n\n![](img/image_rsrc8WU.jpg)\n\
    \n图 5-66 显示了 user data 标签卡中的 `ims-id` 和 `ime-id`。\n\n下一行显示了如何从 workflow context\
    \ 中获取 User 对象。我们创建了返回用户对象的工具方法 `getUser()`。\n\n```java\nuser = WorkpointHelper.getUser(workflowContext);\n\
    ```\n\n我们使用 `getSubject()` 方法返回管理员任务的主对象。我们的管理员任务以 `User` 为主对象。如果你尝试在主对象不是用户的的管理员任务中调用此方法，你将得到错误。\n\
    \n```java\npublic static User getUser(WorkflowContext workflowContext) throws\
    \ Exception{\n    ManagedObject managedObject = workflowContext.getSubject();\n\
    \    if(managedObject instanceof User){\n        return (User)managedObject;\n\
    \    }else{\n        throw new IllegalArgumentException(\"Managed Object is not\
    \ User\");\n    }\n}\n```\n\n`WorkflowContext` 继承了 `IMContext`、`IMPersistentContext`、`ProviderAccessor`、`ServiceProvider`\
    \ 和 `TaskInfo`。更多细节请参考官方 Java 文档。它与 `BLTHContext` 几乎相同，但区别在于 `WorkflowContext`\
    \ 继承了 `EventContext`。\n\n请注意，流程有两个级别：管理员任务级别和事件级别。如果你的流程运行在管理员任务级别，并尝试调用父类 `EventContext`\
    \ 的任何方法，你将得到意外的结果。\n\n我们有另一个方法 `getUser(EventContext context)`。你必须确保你的流程运行在用户事件上。下面的代码显示了如何从事件获取用户对象。\n\
    \n```java\nIMEvent evt= workflowContext.getEvent();      User user = ((UserEvent)evt).getUser();\n\
    ```\n\n我们在 `WorkpointHelper.java` 中的 `getUser()` 方法可以在你的项目中复用。我们对流程编程有额外的说明。\n\
    \n### 注意事项 1：`WorkflowContext`，如何正确调用父类（`EventContext`）中的方法。\n\n*   如果流程运行在管理员任务级别，不要调用父类\
    \ `EventContext` 的方法。\n*   确保你进行了正确的类型转换。例如：\n    *   流程关联到事件 `ModifyUserEvent`，你可以通过\
    \ `UserEvent` 转换对象（`ModifyUserEvent` 是 `UserEvent` 的子类）：\n        ```java\n  \
    \      User user = ((UserEvent)evt).getUser();\n        ```\n    *   流程关联到事件 `AddToGroupEvent`，你可以通过\
    \ `GroupEvent` 转换（`AddToGroupEvent` 是 `GroupEvent` 的子类）：\n        ```java\n  \
    \      Group group = ((GroupEvent)evt).getGroup();\n        ```\n\n这与 `BLTHContext`\
    \ 相同，当你使用 `getSubject()` 方法时，请检查管理员任务的主对象。\n\n我们代码的下一行打印了值。它演示了如何访问新值和旧值。\n\n\
    ```java\nSystem.out.println(\"City : New Value =\"+user.getAttribute(\"l\"));System.out.println(\"\
    City : Old Value =\"+user.getLastCommittedAttribute(\"l\"));\n```\n\n下一行代码显示了如何在\
    \ user data 标签卡中设置值。在 user data 标签卡中，我们添加了键值对（`city=none`）。这段代码将值修改为新用户的城市属性。\n\
    \n```java\n//将新值放入 User Data\nthisactivityInstData.setUserData(\"city\",user.getAttribute(\"\
    l\").toLowerCase());\n```\n\n跳转（Transition）使用 User Data 中的 `city` 来决定路径。如果发生异常（默认值为“none”），它将进入“City\
    \ != New York”路径。因此你应该注意流程内部的异常。\n\n![](img/image_rsrc8WV.jpg)\n\n图 5-67 显示了用户数据与跳转之间的关系。\n\
    \n### 跳转 (Transition)\n\n跳转是节点之间的连接。你可以通过点击条件标签卡中的笔图标来编辑跳转中的条件。\n\n![](img/image_rsrc8WW.jpg)\n\
    \n图 5-68 显示了用于编辑条件的铅笔图标\n\n在我们的示例中，我们使用了条件向导（condition wizard）。在条件标签卡中，有许多创建条件的方法你也可以进行编程（但不推荐）。\n\
    \n提交后无法编辑条件，但你可以更改语句类型或删除此脚本并创建一个新的。（某些情况下，由于存在引用你无法删除，如果你不想删除引用，建议更改名称）\n\n![](img/image_rsrc8WX.jpg)\n\
    \n图 5-69 显示了语句类型的列表\n\n### 跳转条件中使用 Java 代码\n\n### 跳转条件 Java 代码\n\n跳转可以使用 Java\
    \ 代码；你需要在 `SymbolTable` 中设置 TRUE 或 FALSE。例如，跳转“City == New York”，我们可以这样写：\n\n\
    ```java\nboolean result = false;if(city.equalsIgnoreCase(\"new york\")){result\
    \ = true;}symbolTable.add(\"Result1\").setValue(0);\n```\n\n关于 `SymbolTable` 的更多细节请参\
    \ Workpoint 文档。我们需要从 User Data 获取城市值。跳转是“源节点”和“目标节点”之间的连接。\n\n图 5-70 显示了两种方法从源节点访问城市值。\n\
    \n第一种方法：传递参数。`SourceActivity` 表示源节点，`UD` 表示 User Data，你需要填写 `city`。\n\n![](img/image_rsrc8WZ.jpg)\n\
    \n图 5-71 显示了参数中的 `SourceActivity.UD`\n\n对于编程，你只需声明 `String` 参数\n\n```java\npublic\
    \ void isCityEqualNewYork(String city,SymbolTable symbolTable,JobData thisJobData,JobTranData\
    \ jobTransData){System.out.println(\"通过传递 SourceActivity.UD 获取的城市:\"+city);}\n\
    ```\n\n第二种方法，通过源节点 ID 查询。这种方法你需要两个参数：`JobData` 和 `JobTranData`。\n\nOEBPS/image_rsrc8X0.jpg)\n\
    \n图 5-72 显示了参数中的 `JobData` 和 `JobTranData`\n\n`ThisJobData` 表示流程实例。`ThisJobTransitionData`\
    \ 表示此跳转的实例。下面的代码显示了如何从源节点访问用户数据。\n\n```java\nTableID sourceJobNodeID = jobTransData.getSourceJobNodeID();\n\
    ActivityInstData sourceActivity = thisJobData.getActivityByNodeID(sourceJobNodeID);\n\
    String cityUD = sourceActivity.getUserData(\"city\").getVariableValue();\nSystem.out.println(\"\
    通过 sourceJobNodeID 获取的城市:\"+cityUD);\n```\n\n我们使用 `jobTransData` 获取源 ID，然后通过它查询源节点。当我们获取源节点时，就可以获取\
    \ User Data。\n\n### 注意事项 2：保持跳转条件简单\n\n我的建议是保持跳转条件简单。你应该使用条件向导。避免在跳转中使用任何复杂的逻辑。例如，我们有两个跳转：“City\
    \ == New York”和“City != New York”。如果你在“City == New York”跳转中进行编程计算，你需要在另一个跳转中也进行编程。这意味着你做了两次。\n\
    \n建议在源节点中进行逻辑处理或计算，并在用户数据中保留纯结果。跳转只使用结果来确定路径。这样更容易维护。\n\n### 延迟 (Delay)\n\n延迟的概念非常直观：你希望该节点持续到何时。你只需要在\
    \ `SymbolTable` 的 `result1` 中放入格式为“yyyy-MM-dd HH:mm:ss”的日期时间值即可。\n\n"
- fmt: "\n```java\npublic void delay10Minutes(SymbolTable symbolTable){\n    Date\
    \ current = new Date();\n    Calendar calendar = Calendar.getInstance();\n   \
    \ calendar.setTime(current);\n    calendar.set(Calendar.MINUTE, calendar.get(Calendar.MINUTE)+10);\n\
    \    //yyyy-MM-dd HH:mm:ss\n    SimpleDateFormat simpleDateFormat = new SimpleDateFormat(\"\
    yyyy-MM-dd HH:mm:ss\");\n    String executeTime = simpleDateFormat.format(calendar.getTime());\n\
    \    SymbolData r1 = symbolTable.add(\"Result1\");\n    r1.addValue(executeTime);\n\
    }\n```\n\nDelay node support delay time by configuration in evaluation date tab.\
    \ Please see Workpoint document for more details.\n\n## Node Commit\n\nWe have\
    \ the rule; we must do approve or reject before finish the workflow. In this example\
