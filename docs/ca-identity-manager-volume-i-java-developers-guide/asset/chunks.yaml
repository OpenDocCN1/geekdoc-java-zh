    \ Policies.\n* Email templates\n\nThe email template API is the one of them. We\
    \ can implement by writing template file.\n\n### 3.1.8 Notification Rule\n\nThe\
    \ notification rule determines who receive an email. The notification rule use\
    \ within email template only.\n\nExample:\n\n* Sending email to HR manager after\
    \ task update location complete.\n    * The email template is used for generating\
    \ email content and when email should send.\n    * The notification rule is used\
    \ for getting HR manager’s email.\n\n### 3.1.9 Task Execution Web Service (TEWS)\n\
    \nWe want the the third party system execute our admin task, we have to enable\
    \ TEWS feature. The TEWS enables the admin task as web services’ provider.\n\n\
    Examples:\n\n* A user uses a web portal to modify address. The portal calls the\
    \ enterprise service bus (ESB) and then ESB calls web services of admin task to\
    \ update address.\n\n## 3.2 Task Phases\n\nWe already talked about overview Synchronous\
    \ and Asynchronous Phase. This section will explain phase details of admin task\
    \ execution and when each APIs will be executed.\n\nYou do not need to memorize\
    \ the whole things right now, when you practice example in this book, you will\
    \ memorize them automatically.\n\n### 3.2.1 Synchronous Phase Operations\n\n1.\
    \ The user selects an admin task to perform.\n* Business Logic Task Handler API:\
    \ call `handleStart()` method.\n2. The admin task subject is selected but not\
    \ yet displayed.\n* Business Logic Task Handler API: call `handleSetSubject()`\
    \ method.\n* Default values for fields can be initialized with JavaScript or hard-code.\n\
    * Fields associated with physical attributes are automatically populated with\
    \ the corresponding data from the data store.\n3. CA IdentityMinder displays and\
    \ populates the task screen.\n* Logical Attribute: call method `toLogical()` to\
    \ convert physical attributes.\n4. CA IdentityMinder invokes Validation Rules\
    \ during data entry when user click validate button (if you have) or user change\
    \ tab or you have logic to validate on change.\n5. User submits the task screen.\n\
    * Invoke Validation Rules.\n* Logical Attribute API: call method `validate()`\
    \ to performs field-level validation.\n* Logical Attribute API: call method `toPhysical()`\
    \ to converts logical attributes back to their corresponding physical attributes.\n\
    * Business Logic Task Handler API: call method `handleValidation()` to perform\
    \ task-level validation\n6. User submits the task screen.\nIf validation errors\
    \ occur, the errors are reported to the user immediately. The user is allowed\
    \ to correct the errors and resubmit the task.\n7. CA IdentityMinder instantiates\
    \ events for the task.\nAfter all validation is performed successfully, CA IdentityMinder\
    \ creates events. Each transaction is represented by an event.\n8. The task enters\
    \ the asynchronous phase for processing.\nThere are 3 major APIs: Business Logic\
    \ Task Handler, Validation Rules and Logical Attribute execute under synchronous\
    \ phase. The picture below shows the screen after submit admin task. The message\
    \ “Task pending” means there are event processing behind this task or asynchronous\
    \ phase is starting from now on.\n\n| ![](OEBPS/image_rsrc8TM.jpg) |\n| Figure\
    \ 3-7 shows screen display Task pending |\n\n### 3.2.2 Asynchronous Phase Operations\n\
    \n1. CA IdentityMinder posts the events.\n2. Event Listeners Perform Pre-Approval\
    \ Updates\n* Event Listener API: call `before()`.\n3. Custom Objects Perform Operations\
    \ During Processing\n* Participant Resolver API: If workflow specify the participants\
    \ (approvers) for a workflow activity, call method `resolve()` to return list\
    \ of participants.\n* Workflow API: `start`. If workflow is enabled, and an event\
    \ is mapped to a workflow process, the activities in workflow process must be\
    \ completed.\n4. Event Listeners Perform Pre-Execution Updates\n* A workflow process\
    \ results in either the approval or rejection of the associated event.\n* When\
    \ a workflow process is approved, CA IdentityMinder executes the associated event.\n\
    \    * Event Listener API: call `approve()` or `reject()`.\n5. CA IdentityMinder\
    \ Executes the Event\n6. Event Listeners Perform Post-Execution Operations\n*\
    \ Event Listener API: call `after()`.\n7. CA IdentityMinder Generates Email Notifications\n\
    * Email Template API, Notification Rule API are called.\n\nThere are 5 APIs: Event\
    \ Listener, Workflow, Participant Resolver, Email Template, and Notification Rule\
    \ are used under asynchronous phase.\n\n## 3.3 Configuring IDE\n\nWe use Eclipse\
    \ as IDE to develop code. Please download from book’s site.\n\nClass path\n\n\
    Please check Project Properties > Java Build Path.\n\nIf you use version 12.6:\n\
    * Create class path variable: `IDM_LIB`\n    * Select windows> preference> class\
    \ path variable > new\n    * Set to path `/server\\IdentityMinder.ear\\library`\n\
    \        * If you use WebLogic, all jars locate at APP-INF\\lib\n\n| ![](OEBPS/image_rsrc8TN.jpg)\
    \ |\n| Figure 3-8 shows class path variable |\n\nIf you use version 12.5, remove\
    \ all my-jars:\n* Add all jar from deploy folder `/server\\IdentityMinder.ear\\\
    library`\n    * If you use WebLogic, all jars locate at APP-INF\\lib\n* Add `identitymanager.jar`\
    \ from `/server>IdentityMinder.ear\\user_console.war\\WEB-INF\\lib`\n\nImport\
    \ projects\n* Run Eclipse and select import > Existing projects into Workspace.\n\
    * Browse archive file, select a project, and click finish.\n\n| ![](OEBPS/image_rsrc8TP.jpg)\
    \ |\n| Figure 3-9 shows import project |\n\n## 3.5 Conclusions (Wait, corrected\
    \ to 3.4)\n### 3.4 Conclusions\n\nThis chapter introduces 9 APIs of CA IdentityMinder:\
    \ what they are and when they execute. We have already explained about task phase:\
    \ synchronous and asynchronous phase.\n\n* Synchronous phase: Business Logic Task\
    \ Handler, Validation Rules and Logical Attribute.\n* Asynchronous phase: Event\
    \ Listener, Workflow, Participant Resolver, Email Template, and Notification Rule.\n"
