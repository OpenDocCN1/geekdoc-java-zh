  trans: "\n\n连接器（Connector）是与端点的软件接口。`Provisioning Server` 使用 `connector` 与端点进行通信。它将\
    \ `Provisioning Server` 的操作转换为端点的更改，例如“在 Microsoft Exchange 端点上创建一个新的电子邮件账户”。\n\
    \n`Connector Servers` 是一个管理连接器的服务器组件。连接器服务器有两种类型：\n\n* `CA IAM Connector Server`\
    \ (`CA IAM CS`) 管理用 Java 编写的连接器\n* `C++ Connector Server` (`CCS`) 管理用 C++ 编写的连接器\n\
    \n连接器和代理（Connectors and Agents），某些连接器需要在其管理的系统中安装代理程序，以便完成通信周期。\n\n`Connector\
    \ Xpress` 是 `CA IdentityMinder` 的一个实用，用于管理动态连接器、将动态连接器映射到端点以及为端点建立路由规则。你可以使用它来配置动态连接器，允许对\
    \ SQL 数据库和 LDAP 目录进行配置和管理。\n\n### 附加组件\n\n在安装 `CA IdentityMinder` 时，会自动安装 `WorkPoint`\
    \ 工作流引擎和 `WorkPoint Designer`。这些组件允许你将 `CA IdentityMinder` 任务置于工作流控制之下，并修改现有的工作流过程定义或创建新定义。\n\
    \n`Provisioning Manager` 是管理全局用户和配置服务器选项的图形化界面。你也可以使用 `Provisioning Manager` 来管理端点或账户。\n\
    \n## 1.5 服务器配置\n\n本书假设你已经安装并配置了：\n\n* `CA IdentityMinder` 和用户存储库（user store）。\n\
    * `Provisioning Server`、`provisioning manager` 和 `provisioning directory`。\n*\
    \ `Connector server`\n* `Wokpoint designer`\n\n我的建议是配置一个 `Microsoft Active Directory`\
    \ 端点、账户模板以及配置角色（provisioning role）。你应该在 `IDM` 系统中拥有一些用户和账户。\n\n### 用户存储属性\n\n\
    在书中，我们要求 `City`（城市）和 `telephone number`（电话号码）作为主要属性，但其他章节还需要额外的属性。我们将创建 3 个管理任务：\n\
    \n* `Update Location and Ext Number`（更新位置和分机号），几乎用于每个章节。\n    * 需要属性：`L`（或 `City`）\n\
    \    * 需要属性：`telephoneNumber`。\n    * 在第 2 章中，我们的 `Express` 策略示例需要 `state`（州）。\n\
    * `Update office`（更新办公室），用于第 6 章：仅限 `Logical Attribute API`\n    * 需要属性：`L`（或\
    \ `City`，与上一个相同）\n* `Update Employee Number`（更新员工编号），用于第 6 章：仅限 `Validation Rule`\n\
    \    * 需要属性：`employee number`\n\n请检查 `Management Console`（管理控制台），选择 `Directory\
    \ > User Store (Cooperate Store) > User` 并检查属性。\n\n| ![](img/image_rsrc8PT.jpg)\
    \ |\n| 图 1-4 显示显示名称 |\n\n### 全局用户属性\n\n在 `Management Console` 中，选择 `Directory\
    \ > Provisioning Store > Global User` 并检查属性 `Physical Name`（物理名称）和 `eTCity`。\n\
    \n| ![](img/image_rsrc8PU.jpg) |\n| 图 1-5 显示 `eTCity` 的显示名称 |\n\n### 属性映射\n\n\
    在 `Management Console` 中，选择 `Environment > your environment > Advanced Settings\
    \ > Provisioning` 并检查属性映射：`User Attribute l` 映射到 `Provisioning Attribute eTCity`。\n\
    \n| ![](img/image_rsrc8PV.jpg) |\n| 图 1-6 显示属性映射 |\n\n## 1.6 结论\n\n我们介绍了自定义代码和服务器配置的优势。在下一章中，你将学习\
    \ `CA IdentityMinder` 管理的基本概念。\n\n# 第 2 章管理概念\n\n如果你熟悉 `CA IdentityMinder`，可以快速跳过这一章。在本章中，你将学习：\n\
    \n* 如何创建 `admin task`（管理任务）\n* 配置（provisioning）是如何运作的\n* `Identity Policy Set`（身份策略集）和\
    \ `Policy Xpress` 如何工作\n* 理解提交的任务和事件\n\n要在一个章节中解释所有的管理功能是困难的。我们将只关注与编程相关的某些部分。如果你是\
    \ `CA IdentityMinder` 的新手，可能会因为功能太多而容易迷失。我们将使用 `admin task` 作为主要主题。\n\n## 2.1\
    \ \n\n在本章中，我们将通过管理员工具实现需求。\n\n### 需求\n\n我们的需求需要一个界面来修改城市和分机电话号码。需求可以写为如下步骤：\n\n\
    * `Step1`：以管理员身份登录 `Identity Manager User Console`，并选择表单“Update location and Ext\
    \ Number”\n    * 从下拉菜单中选择 `city`\n    * 填写 `extension number`\n    * 点击 `submit`（提交）\n\
    * `Step 2`：系统更新用户属性：\n    * 根据 `city value` 更新 `city` 属性并设置 `country`。\n    *\
    \ 连接 `office number` 和 `extension number`。\n* `Step 3`：系统更新账户属性；`city` 和 `telephone\
    \ number`。\n\n### 设计\n\n我们将通过以下方式实现每个需求的步骤：\n\n* `Step 1`：提供界面\n    * 创建 `admin\
    \ tasks` 和带有 2 个属性的界面；`city` 和 `extension number`\n* `Step 2`：处理\n    * 我们使用 `Policy\
    \ Set` 将 `city` 映射到 `country`。\n    * 我们使用 `Policy Xpress` 拼接 `office number`\
    \ 和 `extension number`。\n* `Step 3`：配置（Provisioning）\n    * 配置 `attribute mapping`（属性映射）\n\
    \    * 执行 `account synchronization`（账户同步）\n\n| ![](img/image_rsrc8PW.jpg) |\n\
    | 图 2-1 显示如何实现需求。 |\n\n## 2.2 创建管理任务\n\n`Admin tasks` 是主要功能之一。几乎所有需求都从管理任务开始。`Admin\
    \ task` 是用户在 `CA IdentityMinder` 中可以执行的行政功能。`Admin Tasks` 可能是 `Create User`、`View\
    \ User`、`Modify User`、`Reset User` 等。我们在 `home > tasks` 下可以看到。\n\n| ![](img/image_rsrc8PX.jpg)\
    \ |\n| 图 2-2 显示控制台中的任务 |我们将从管理任务开始。\n\n* 登录 `Admin Console`。\n* 点击 `Admin Tasks`。\n\
    * 然后选择 `Create new Admin Task` 并点击 `OK`。\n\n| ![](img/image_rsrc8PY.jpg) |\n|\
    \ 图 2-3 显示菜单 |选择管理任务后，将显示 5 个标签页（见下）：\n\n1. `Profile tab`（配置标签页）包含基本信息（`name`），如何在菜单中显示，主对象和操作，当同步工作时。\n\
    2. `Search tab`（搜索标签页），涉及 `profile tab` 中的主对象，如何搜索主对象。\n3. `Tabs tab`（标签标签页）用于添加标签。\n\
    4. `Fields tab`（字段标签页）显示此管理任务中的字段。\n5. `Events tab`（事件标签页）显示提交任务后将生成哪些事件。\n\n\
    | ![](img/image_rsrc8PZ.jpg) |\n| 图 2-4 显示创建任务时的 5 个标签页### 2.2.1 Profile Tab\n\
    \n在 `profile tab` 中有 5 个部分：\n\n1. `General Information`（常规信息）\n有 3 个字段\n| Field\
    \ Name | Value | Description |\n| :--- | :--- | :--- |\n| Name | Update Location\
    \ and Ext Number | 任务将显示在菜单中 |\n| Tag | BookUpdateLocNo | 任务的唯一值 |\n| Description\
    \ | Example for Administrative | 描述 |\n\n| ![](img/image_rsrc8R0.jpg) |\n| 图 2-5\
    \ 显示菜单上的名称。 |2. 如何在菜单中显示？\n`Admin Task` 有界面，因此我们必须决定界面在哪里。有 3 个字段\n\n| Field Name\
    \ | Value | Description |\n| :--- | :--- | :--- |\n| Task Order | 1 | 指定在菜单中的显示顺序。![](img/image_rsrc81.jpg)\
    \ |\n| Category | Book Example | 类别作为屏幕顶部的标签显示，按数字降序排列![](img/image_rsrc8R2.jpg)\
    \ |\n| Category Order | 11 |\n| Category 2 | Tasks | 指定二级/三级类别，作为标签列表下方的链接出现![](img/image_rsrc8R3.jpg)\
    \ |\n| Category 2 Order | 0 |\n| Category 3 | Basic |\n| Category 3 Order | 0\
    \ |\n\n| ![](img/image_rsrc8R4.jpg) |\n| 图 2-6 显示类别值.3. 主对象和操作是什么？\n\n非常重要。这就像是在问问题：你想做什么？我想修改用户信息。所以主对象应该是\
    \ `user`，操作应该是 `modify`。\n\n| Field Name | Value | Description |\n| :--- | :---\
    \ | :--- |\n| Primary Object | User | 指定任务的操作的对象。 |\n\n"
