  trans: "\n\n1. 以管理员身份登录 Identity Manager 用户控制。\n2. 选择标签页：`Book Example`，并选择菜单 `Update\
    \ Location and Ext Number`。\n3. 在 `Book Example` 标签页中选择管理员任务：`Update Location\
    \ and Ext Number`，然后搜索某些用户。修改城市属性并提交管理员任务。你可以在日志文件中看到消息。该消息不会立即出现，你必须等待事件开始。\n\
    \n```\n| 2013-10-27  INFO  [STDOUT] =============>LifeCycleEventListener:before\
    \ |\n```\n\n4. 以审批者身份登录，你将看到审批任务并点击批准。查看日志文件中的消息。\n\n```\n| 2013-10-27  INFO \
    \ [STDOUT] =============>LifeCycleEventListener:approved2013-10-27  INFO  [STDOUT]\
    \ =============>LifeCycleEventListener:after |\n```\n\n## 监听器级别 (Listener Level)\n\
    \n我们将监听器级别设置为 `ModifyUserEvent`。这意味着我们的程序只监听一种事件类型：`ModifyUserEvent`。如果我们将监听器级别更改为\
    \ `User`，则意味着它监听所有与用户相关的事件。\n\n| ![](img/image_rsrc8XK.jpg) |\n| 图 6-4 显示了事件监听器级别配置\
    \ |\n\n如果你选择 `*`，则意味着此监听器将监听所有事件。\n\n### 6.2.3 代码示例：事件生成 (Event Generating)\n\n\
    事件生成不是监听器的功能，而是上下文（context）的特性。我们的示例将展示如何事件生成新事件；将用户添加到组。此示例代码需要一个名为“IT”的组。如果你没有该组，可以创建一个新组或修改代码来更改组名。\n\
    \n我们可以通过 `EventContext` 生成新事件。`EventContext` 可以在当前任务中生成次级事件。`EventContext` 拥有\
    \ `generateEvent()` 方法。\n\n```\n| void generateEvent(java.lang.String className,java.lang.Object\
    \ primary,java.lang.Object secondary,java.lang.String workflowID)throws java.lang.Exception\n\
    ```\n\n第一个参数 `className` 是为要生成的事件进行实例化的类的全限定名。事件类位于 `com.netegrity.ims.events`\
    \ 包中。你可以在 Java 文档中查看详情，但我建议在管理控制台 > Environments > Advance Settings > Event List\
    \ 查看，那里是最新的。\n\n```\n| ![](img/image_rsrc8XM.jpg) |\n| 图 6-5 显示了事件列表 (Event List)\
    \ |\n```\n\n第二个和第三个参数是 `primary` 和 `secondary` 对象，你可以查看上面的图片。最后一个参数是 `workflowID`。工作流过程名称（例如\
    \ `SingleStepApproval`）映射到正在生成的事件。如果你不需要任何工作流，只需传递 `null`。\n\n此示例显示了如果城市属性 ==\
    \ “new york”，则我们将用户添加到组“IT”。\n\n#### 代码 (Code)\n\n1. 编译我们的 Java 代码：`com.book.idm.etc.NewYorkCityEventListener`\n\
    2. 将类（包括包文件夹 `com.book.idm.etc`）复制到文件夹 `\\IdentityMinder.ear\\custom`\n\n####\
    \ 配置 (Configuration)\n\n1. 在管理控制台中，点击 `Environments`。\n2. 点击将使用该事件监听器的环境名称。\n\
    3. 点击 `Advanced Settings`。\n4. 点击 `Event Listeners`。\n5. 点击 `new` 按钮并按下表填值\n\n\
    | 字段名称 | 值 |  |\n| :--- | :--- | :--- |\n| Name | `NewYorkCityEventListener` |\
    \ 事件监听器的名称 |\n| Class | `com.book.idm.etc.NewYorkCityEventListener` | Java 类的名称\
    \ |\n| Listener Level | `ModifyUserEvent` | 该类监听的事件 |\n6. 点击 `Restart Environment`。\n\
    \n#### 配置：Identity Manager 用户控制 (Configuration: Identity Manager User Console)\n\
    \n1. 以管理员身份登录 Identity Manager 用户控制。\n2. 检查我们的管理员任务名称：`Update Location and Ext\
    \ Number`：\n   * 移除所有业务逻辑任务处理器和 Policy Xpress。\n   * 移除上一个示例中的工作流。\n\n## 工作原理\
    \ (How it works)\n\n执行管理员任务：`Update Location and Ext Number`。\n\n1. 以管理员身份登录 Identity\
    \ Manager 用户控制。\n2. 在 `Book Example` 标签页中选择管理员任务：`Update Location and Ext Number`，然后搜索某些用户。将城市属性更改为“New\
    \ York”并提交管理员任务。\n3. 转到已提交的任务并选择详情。你将看到事件“Add user to group”。\n\n```\n| ![](img/image_rsrc8XN.jpg)\
    \ |\n| 图 6-6 显示了生成的事件 \"Add user to group\" |\n```\n\n你可以搜索组“IT”并查看成员关系以检查结果。\n\
    \n### 特定的管理员任务 (Specific admin task)\n\n我们通过配置指定事件，通过代码指定管理员任务。我们添加了条件来检查管理员任务标签。\n\
    \n```\n| if(!\"BookBasicUpdateLocAndExtNo\".equalsIgnoreCase(evtCtx.getAdminTask().getTaskTag())){return\
    \ CONTINUE;} |\n```\n\n### 事件生成 (Event generation)\n\n此代码显示了事件生成：`AddToGroupEvent`。我们查找组\
    \ `IT` 并传递给方法 `generateEvent()`。结果是用户被添加到组“IT”。\n\n```\n| if(city.equalsIgnoreCase(\"\
    new york\")){Group group = evtCtx.getGroupProvider().findGroup(\"IT\",null);evtCtx.generateEvent(\"\
    com.netegrity.ims.events.AddToGroupEvent\",user,group, null);} |\n```\n\n### 6.2.4\
    \ 用例示例 (Use Case Examples)\n\n我们查看了官方文档中所有用例示例的代码（Programming Guide for Java >\
    \ Event Listener > Event Listener API > Use Case Examples）。\n\n#### 将用户添加到 Microsoft\
    \ Exchange (Add a user to Microsoft Exchange)\n\n| 当用户成功添加到 Exchange 时，IdentityMinder\
    \ 调用与 `AssignRoleEvent` 相关的监听器的 `after()` 方法。`after()` 方法的实现使用 Exchange API 将用户添加。访问\
    \ Exchange 需要的信息（`SERVER_NAME`、`ADMIN_ID`、`ADMIN_PASSWORD` 等）包含在 IdentityMinder\
    \ 的自定义属性中。 |\n在 `EventListenerAdapter` 的 `init()` 方法中获取自定义属性。参见本章末。\n\n#### 为组分配创建规则\
    \ (Create a rule for group assignments)\n\n| 当创建用户时，IdentityMinder 调用与 `CreateUserEvent`\
    \ 相关的监听器的 `after()` 方法。`after()` 方法的实现评估用户属性如 `Job Title`、`Security Level` 和 `Department`，将用户分配到一个或多个组。对于每个组分配，实现生成次级事件\
    \ `AddToGroupEvent`。该次级事件可以接受工作流审批和审计。 |\n在此用例中，你必须通过检查职位来编写条件。如果匹配，你可以生成新事件：`AddToGroupEvent`。这与我们的事件生成示例相同。\n\
    \n#### 使用用户数据更新 RDBMS (Update an RDBMS with user data)\n\n| 假设用户信息如 `user ID`、`user\
    \ name`、`email address` 和组成关系存储在 RDBMS 中。每当发生用户级事件（`CreateUserEvent`、`ModifyUserEvent`\
    \ 等）时，必须更新 RDBMS 中的用户记录。事件执行后，IdentityMinder 调用与用户事件相关的监听器的 `after()` 方法。该方法的实现从传入\
    \ `init()` 方法的 IdentityMinder 环境中检索 RDBMS 连接参数，然后更新 RDBMS 中的用户记录。 |\n我们在 `after()`\
    \ 方法中实现更新数据库。在管理控制台配置中，我们选择监听 `user` 级别。这意味着 Java 类将执行于所有用户的事件（`CreateUserEvent`、`ModifyUserEvent`\
    \ 等）。\n\n#### 将事件发布到 JMS 队列 (Post events to a JMS queue)\n\n| 在任何事件成功执行后，IdentityMinder\
    \ 调用与所有事件相关的监听器的 `after()` 方法。该监听器将所有事件写入特定的 Java Message Service (JMS) 队列。队列的\
    \ Java 命名和目录接口 (JNDI) 名称以及 `jndi.properties` 文件中的信息可以通过 IdentityMinder 环境的属性进行配置。`after()`\
    \ 方法实现使用 JNDI 信息向队列发布一个简单的对象消息。 |\n\n"
- fmt: "\nThis one is the same as previous, override method `after()` and send message\
    \ to JMS. For configuration in management console select `*`, it will execute\
    \ when every event occurs.\n\n## 6.3 Logical Attribute API\n\nLogical Attribute\
    \ API is used to convert between logical attribute (shows on screen) and physical\
    \ attribute (keeps in user data store). Logical attribute handler execution occurs\
    \ in the synchronous phase of task processing.\n\n### Logical Attributes\n\nA\
    \ logical attribute value is presented in a task screen field. A logical attribute\
    \ name appears within vertical bars (`|`). For example, an Extension logical attribute\
    \ appears as `|Extension|`.\n\n| ![](![](OEBPS/image_rsrc8XP.jpg) |\n\n| Figure\
    \ 6-7 shows logical attribute |\n\nLogical attribute values are not directly associated\
    \ with or written to the data store. It needs processing by a logical attribute\
    \ handler.\n\n### Predefined Logical Attributes\n\nCA IdentityMinder has predefined\
    \ logical attributes for some purposes for example `|passwordConfirm|`, `|oldPassword|`.\
    \ We can use or customized them. Please see office document for more detail.\n\
    \n### Physical Attributes\n\nPhysical attributes are attributes of the underlying\
    \ data store (a user directory such as LDAP). If a task screen field is configured\
    \ with a physical attribute, a value entered into the field is written to the\
    \ data store.\n\n### 6.3.1 Programming\n\nCreate java class extends `LogicalAttributeAdapter`\
    \ and override methods:\n\n*   `public void toLogical(LogicalAttributeContext\
    \ apiContext) throws java.lang.Exception`\n    *   Convert value from physical\
    \ attribute to be logical attribute.\n\n*   `public void toPhysical(LogicalAttributeContext\
    \ apiContext) throws java.lang.Exception`\n    *   Convert value from logical\
    \ attribute to be physical attribute.\n\n*   `public void initializeOptionList(LogicalAttributeContext\
    \ apiContext) throws java.lang.Exception`\n    *   If you want to render value\
    \ as list, you need to implement this method and return `Vector` as display value\
    \ list on screen.\n\n*   `public void initialize(LogicalAttributeContext apiContext)\
    \ throws java.lang.Exception`\n    *   In case of create user or create any object,\
    \ this method set initial value of attribute.\n\n### 6.3.2 Code Example\n\nOur\
    \ example show convert city (physical attribute) to be office code (logical attribute).\
    \ The screen will display office as code. When users select office code, it will\
    \ convert value from office code as city value.\n\n| ![](![](OEBPS/image_rsrc8XR.jpg)\
    \ |\n\n| Figure 6-8 shows user’s screen for updating office |\n\n#### Code\n\n\
    1.  Compile our java code: `com.book.idm.etc.OfficeCodeLogicalAttr`\n2.  copy\
    \ class (include package folder `com.book.idm.etc`) to folder `<server>\\IdentityMinder.ear\\\
    custom`\n\n#### Configuration: Management Console\n\n1.  In the Management Console,\
    \ click `Environments`.\n2.  Click the name of the environment where the logical\
    \ attribute will be used.\n3.  Click `Advanced Settings`.\n4.  Click `Logical\
    \ Attribute Handlers`.\n5.  Click new button and put value as below\n\n| Field\
    \ Name | Value | Description |\n| :--- | :--- | :--- |\n| Name | `OfficeCodeLogicalAttr`\
    \ | Name of logical attribute |\n| Class | `com.book.idm.etc. OfficeCodeLogicalAttr`\
    \ | Name of java class |\n| Object Type | User | Type of object that has logical\
    \ attribute |\n| Logical Attributes | | |\n| Name | `officeCodeList` | Name that\
    \ uses in code. |\n| Attribute Name | `|officeCodeList|` | Name that shows in\
    \ admin task’s screen |\n| Option List | Check | Tell CA IdentityMinder, this\
    \ attribute is list |\n| Name | `officeCode` | Name that uses in code. |\n| Attribute\
    \ Name | `|officeCode|` | Name that shows in admin task’s screen |\n| Physical\
    \ Attributes | | |\n| Name | `officeCodePhyAttr` | Name that uses in code. |\n\
    | Attribute Name | `l` | (lower case of L) Name of attribute city in user store.\
    \ |\n\n| ![](![](OEBPS/image_rsrc8XS.jpg) |\n\n| Figure 6-9 shows logical attribute\
    \ configuration in management console |\n\n6.  Click `Restart Environment` button.\n\
    \n#### Configuration: Identity Manager User Console\n\n1.  Log into the Identity\
    \ Manager User Console as administrator.\n2.  Select tab `Roles and Tasks`, and\
    \ select menu `create admin task`.\n3.  Create admin task, put value as below\n\
    \n| Field Name | Value | Description |\n| :--- | :--- | :--- |\n| Tab: Profile\
    \ | | |\n| Name | `Update Office` | Name of admin task |\n| Tag | `BookBasicUpdateOffice`\
    \ | Tag name of admin task |\n| Description | `Example for Logical Attribute`\
    \ | Description of admin task |\n| Category | `Book Example` | Where admin task\
    \ will show. |\n| Category Order | 11 | |\n| Category 2 | Task | |\n| Category\
    \ 3 | Basic | |\n| Primary Object | User | We want to update the city, so you\
    \ have to choose object user, and action modify. |\n| Action | Modify | |\n| For\
    \ testing, you can disable some values. | | |\n| User Synchronization and Account\
    \ Synchronization: off | | |\n| Enable Auditing, Enable Workflow, Enable Web Services:\
    \ uncheck | | |\n| Tab: Search | | |\n| Search Screen | Default User Search |\
    \ Screen for searching user |\n\n4.  For Tab: Tabs\n    *   Select standard tab\
    \ controller.\n    *   Select `Profile(UserProfile)` from list, and click symbol\
    \ `(+)`.\n    *   Select browse button at screen text field.\n    *   Click new\
    \ button to create new screen, and select choice standard profile screen.\n  \
    \  *   Put value:\n        *   Name: `Book Example: Update Office`\n        *\
    \   Tag: `BookBasicUpdateOffice`\n    *   Add attribute: `|officeCode|`\n    \
    \    *   Attribute Name: `|officeCode|`\n        *   Style: Drop down\n    * \
    \  Add attribute: `|officeCodeList|`\n        *   Attribute Name: `|officeCodeList|`\n\
    \        *   Style: Hidden\n    *   Add attribute: `City`\n        *   Attribute\
    \ Name: `City`\n        *   Style: Hidden\n\n| ![](![](OEBPS/image_rsrc8XT.jpg)\
    \ |\n\n| Figure 6-10 shows configuration of each |\n\n5.  Submit to finish creating\
    \ task.\n\nAdd this task to admin role.\n1.  Select tab `Roles and Tasks`, and\
    \ select menu `create admin task`.\n2.  Select role manager.\n    *   Select tab\
    \ `task`\n    *   Select filter by category: `Book Example`\n    *   Select add\
    \ task: `Update Office`\n3.  Click submit to finish modify role.\n\n#### How it\
    \ works\n\nExecute admin task: `Update Office`.\n1.  Log into the Identity Manager\
    \ User Console as administrator.\n2.  Select tab `Book Example`, and select menu\
    \ `update office`.\n3.  Search a user, the screen will show office drop down.\n\
    4.  Modify office code attribute, and click submit.\nYou can check the result\
    \ by login to the user store, search the modified user, and check city attribute.\
    \ The city attribute in user store is `l`.\n\n#### Method: `toLogical()`\n\nThis\
    \ method converts the value from physical to be logical attribute. The code has\
    \ 3 steps:\n\n*   Step 1: Get the value from physical attribute.\n*   Step 2:\
    \ Mapping, convert from physical to logical attribute. You may have other ways\
    \ to convert.\n*   Step 3: Set the value back to logical attribute.\n\n```java\n\
    private String ATTR_REFER_PHY = \"officeCodePhyAttr\";\n\n@Override\npublic void\
    \ toLogical(LogicalAttributeContext ctx) throws Exception {\n    //get physical\
    \ attribute value\n    String city = ctx.getPhysicalAttributeName(ATTR_REFER_PHY);\n\
    \    String cityValue = ctx.getPhysicalAttributeValue(city);\n    //mapping from\
    \ physical value to logical\n    String officeCodeValue = indexPhysicalAsKey.get(cityValue);\n\
    \    if(officeCodeValue!=null) {\n        //Set value for logical\n        String\
    \ officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n        ctx.setLogicalAttributeValue(officeCode,\
    \ officeCodeValue);\n    }\n}\n```\n\nIn our code can explain as step by steps:\n\
    \nStep 1: We get value from physical attribute, variable `officecodePhyAttr` link\
    \ to attribute `l` in user data store when we do configuration.\n\n| ![](![](OEBPS/image_rsrc8XU.jpg)\
    \ |\n\n| Figure 6-11 shows attribute mapping for physical attributes |\n"
