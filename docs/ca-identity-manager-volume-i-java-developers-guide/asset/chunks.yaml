  trans: "\nCA IdentityMinder 自带了一个预定义的业务逻辑任务处理器，它会在创建对象之前检查对象可能存在的重复。例如，新创建的角色（role）的名称必须是唯一的。当角色即将被创建时，预定义的业务逻辑任务处理器会验证新角色的名称是否已经存在。如果名称已存在，该处理器将抛出一个异常，指示角色名称必须唯一，管理员借此更改名称并重新提交任务。\n\
    \n我们可以通过 `ProviderAccessor` 搜索角色名称。\n\n```java\nboolean isUnique = false;\ntry{\n\
    \    //Search by friendlyName\n    AccessRole role = blthContext.getAccessRoleProvider().findAccessRole(roleName);\n\
    } catch(NoSuchObjectException e){\n    isUnique = true;\n}\nif(!isUnique){\n \
    \   IMSException imsEx = new IMSException();\n    imsEx.addUserMessage(\"The role\
    \ name must be unique\");\n    throw imsEx;\n}\n```\n\n### 在达到最大登录次数后禁用用户账户\n\n\
    当用户连续登录失败三次后，该账户在数据存储中会被立即禁用。由于账户是直接在数据存储中更新的，而不是在任务会话中，因此 CA IdentityMinder 不会为此操作生成事件，且可能与此操作相关的任何工作流审批、审计和安全检查都会被跳过。在最后登录尝试后，会通过自定义消息提示用户账户已禁用。\n\
    \n用例说明用户账户直接在数据存储中更新（禁用）。此用例意味着使用 `ProviderAccessor` 直接更新用户属性。（如需直接更新账户属性，请参阅第二卷）\n\
    \n### 在自注册期间将用户分配到组\n\n一个以“福利管理员”（Benefits Administrator）职衔进行自注册的用户将被分配到 HR 组。此更新是在任务会话中完成，通过调用\
    \ `RelationshipTabHandler` 中的 `assignResources()` 实现。此更新会触发 `AddToGroupEvent`\
    \ 事件，使得组分配可以受审计和工作流审批。\n\n我们使用业务逻辑任务处理器按如下代码修改标签页中的值值。\n\n```java\nFor (TabHandler\
    \ tab : tabs) {\n    RelationshipTabHandler rTab = (RelationshipTabHandler)tab;\n\
    \    rTab.assignResources(groups);\n}\n```\n\n### 为新用户分配“经理”（manager）属性\n\n管理员希望在屏幕上显示配置之前设置“经理”值。可以编写一个业务逻辑任务处理器，实现\
    \ `handleSetSubject()` 方法进行初始化。该方法会将管理员的名称分配给经理名称属性。如果管理员名称不可用，则抛出异常。\n\n我们在 `handleSetSubject`\
    \ 方法中编写代码来初始化经理属性。\n\n```java\npublic void handleSetSubject(BLTHContext blthContext)\
    \ throws Exception {\n    String managerId = blthContext.getAdminFriendlyName();\n\
    \    if(managerId == null){\n        throw new IMSException(\"administrator’s\
    \ name is not available\");\n    }\n    HashMap<String, String> screenFields =\
    \ new HashMap<String, String>();\n    screenFields.put(\"managerId\", managerId);\n\
    \    tab.updateRawData(screenFields);\n}\n```\n\n## 4.6 结论\n\n在本章中，我们学习了业务逻辑任务处理器\
    \ API 概念的基本编程。我们可以总结如下笔记：\n\n#### 实现业务逻辑任务处理器\n- 包含两个步骤：编码和配置。\n- 对于编码，你必须编写一个扩展\
    \ `BLTHAdapter` 的 Java 类并根据需要重写方法。\n    - `handleStart()`：当用户选择管理员任务时调用。\n   \
    \ - `handleSetSubject()`：用于在显示前设置字段。\n    - `handleValidation()`：用于验证。\n    -\
    \ `handleSubmission()`：当用户提交并在验证后执行。\n    - 编译并复制到文件夹 `\\IdentityMinder.ear\\\
    custom`。\n- BLTH 配置有两个级别：全局配置和特定任务配置。\n\n#### 访问托管对象\n- 有两种方式：通过 `ProviderAccessor`\
    \ 和 `BLTHConext`（任务会话）。\n- 对于 BLTH，我们必须考虑：\n    - 什么是主对象？\n    - 修改的属性是否在管理员任务中定义？\n\
    \n#### 编程笔记\n- 代码中的用户属性名称是用户存储器中的物理名称。\n- 你可以使用 `getRawData()` 和 `setRawData()`\
    \ 访问屏幕上的值。\n- 可以通过 `IMSException` 对象在屏幕上显示消息。\n- 可以使用 session 保持值并在方法之间共享。\n\n\
    业务逻辑任务处理器 API 在同步阶段执行业务逻辑。在异步阶段，我们使用工作流来执行业务逻辑。下一章是工作流。\n\n# 第 5 章 工作流\n\nCA IdentityMinder\
    \ 官方文档关于工作流的细节并不多。我们从前面的章中学习了一些基本概念：\n- 如果需求需要审批者，则你需要工作流。\n- 工作流在异步阶段运行。\n- 工作流可以有很长的寿命。可能花费一小时或一个月的时间。\n\
    - 业务逻辑任务处理器在工作流开始之前完成。\n\n在本章中，你将学习工作流 API 以及如何创建自定义工作流。\n\n## 5.1 工作流概念\n\n你必须在管理控制（Management\
    \ Console）中启用工作流。默认情况下，工作流是禁用的。\n\n#### 配置：管理控制\n1. 在管理控制台中，选择一个环境（Environment）。\n\
    2. 进入高级设置（Advanced Settings），工作流（Workflow）。\n3. 勾选 `Enabled` 复选框并点击保存（Save）。\n\
    4. 重启应用程序服务器。\n\n![](img/image_rsrc8UM.jpg)\n\n图 5-1 显示了管理控制中的工作流属性。\n\n在事件映射表中，事件与全局工作流之间有一些映射。\n\
    \n### 5.1.1 默认工作流功能\n在本节中，我们将学习 CA IdentityMinder 中的默认工作流功能。我们涵盖以下主题：\n- 工作流级别（Workflow\
    \ Level）：工作流可以运行管理员任务或事件。\n- 选择工作流（Select Workflows）：哪些工作流可以执行。\n- 策略基础（Policy\
    \ Base）：启动工作流的条件。\n- 审批者的任务和屏幕。\n- 审批者（Approver）：谁是审批者。\n- 结果（Expected Outcome）：最终结果：批准或拒绝。\n\
    \n#### 工作流级别\n工作流可以在管理员任务和/或事件级别运行。应该选择哪个级别？取决于需求。例如，我们有一个管理员任务“修改用户”，我们的管理员任务有两个标签页：配置标签页（Profile\
    \ Tab）和访问角色（Access Role）。因此，事件将从此管理员任务生成并分为两组：\n- 第一组事件来自配置标签页；当用户属性被修改时会生成事件。\n\
    - 第二组事件来自访问角色标签页；当我们添加或删除访问角色时会生成事件。\n\n![](img/image_rsrc8UN.jpg)\n\n图 5-2 显示了示例管理员任务的所有事件。\n\
    \n我们有两个请求：从配置标签页修改用户属性的请求，以及另一个从访问标签页添加/删除角色的请求。\n- 场景 1：所有请求（修改用户属性和添加/删除角色）都需要一个工作流进行审批，我们应该指定工作流为管理员任务级别。\n\
    - 场景 2：仅修改用户属性请求（配置标签页）需要审批者，我们应该指定工作流为事件级别：`ModifyUserEvent`。\n- 场景 3：仅添加角色请求（访问标签页）需要审批者，我们应该指定工作流为事件级别：`AssignAccessRoleEvent`。\n\
    - 场景 4：任何请求（修改用户属性和添加/删除角色）都需要经理作为第一个审批者。\n    - 修改用户属性请求需要 HR 经理作为第二个审批者。\n \
    \   - 添加角色请求需要 IT 经理作为第二个审批者。\n\n我们将第一个审批工作流指定管理员任务级别，并将 HR 和 IT 工作流指定事件级别：`ModifyUserEvent`\
    \ 和 `AssignAccessRoleEvent`。此情况如下所示。\n\n![](img/image_rsrc8UP.jpg)\n\n图 5-3 显示了场景\
    \ 4 的工作流。\n\n管理员任务级别\n\n"
- fmt: "\nThe workflow at admin task requires to set an attribute `TASK_LEVEL=true`.\
    \ You will see it in the example code. Enable work flow at admin task level, you\
    \ have to configure:\n\n* On the `Profile` tab, check `Enable Workflow` checkbox.\n\
    * On the `Profile` tab, click the pencil icon at workflow process label. The workflow\
    \ configuration screen display.\n\n| ![](OEBPS/image_rsrc8UR.jpg) |\n| Figure\
    \ 5-4 shows how to configure workflow at admin task level |\n\n## Event Level\n\
    \nEnable work flow at event level, you have to configure:\n\n* On the `Profile`\
    \ tab, verify that `Enable Workflow` is checked.\n* On the `Events` tab, click\
    \ pencil icon on events. The workflow mapping screen display, and select a process\
    \ template.\n\n| ![](OEBPS/image_rsrc8US.jpg) |\n| Figure 5-5 shows how to configure\
    \ workflow at event level |\n\n## Select Workflows\n\nYou can select workflow\
    \ from drop down. CA IdentityMinder provides three default process templates:\n\
    \n* `SingleStepApprovalProcess` for one primary approver and default participant\
    \ when primary approver is not found.\n* `TwoStageApprovalProcess` for two primary\
    \ approvers and default participant when primary approver is not found.\n* `EscalationApprovalProcess`\
    \ for one primary approver and default participant when primary approver is not\
    \ found. This workflow primary approver can escalate to another approver.\n\n\
    You can create more custom workflow, so we will go details later.\n\n## Policy\
    \ Base\n\nThe policy-based is condition before start workflow. The picture below\
    \ show Policy Base: if user’s city is New York, it requires workflow: `TwoStageApprovalProcess`.\
    \ \n\n| ![](OEBPS/image_rsrc8UT.jpg) |\n| Figure 5-6 shows screen of workflow’s\
    \ policy base |\n\nIf request is not met any condition, event or admin task will\
    \ execute without workflow.\n\n## Approver’s Task\n\nIf workflow requires approver,\
    \ we need screen for approver to perform action approve or reject. The picture\
    \ below show screen to select Approval Task:\n\n| ![](OEBPS/image_rsrc8UU.jpg)\
    \ |\n| Figure 5-7 shows configuration for approver’s screen. |\n\nThe picture\
    \ below shows the example approver’s screen. The icon ![](OEBPS/image_rsrc8UV.jpg`\
    \ means that value has been changed. You can click to rollback the value.\n\n\
    | ![](OEBPS/image_rsrc8UW.jpg) |\n| Figure 5-8 shows screen for approver |\n\n\
    You can create new approver task by create new admin task. You have to choose\
    \ action as “Approve Event” or “Approve Task”.\n\n## Approver\n\nIf workflow requires\
    \ approver, we have to specific who is approver. We can select type of approver\
    \ form drop down `Participant Resolver`. It provides condition to get approver.\n\
    \n| ![](OEBPS/image_rsrc8UX.jpg) |\n| Figure 5-9 shows drop down: Participant\
    \ Resolver |\n\nIf your requirement getting approver is complicated, you can do\
    \ programming by using `Participation Resolver API`. We will learn `Participation\
    \ Resolver API` in the next chapter.\n\n## Expected Outcome\n\nWorking with workflow,\
    \ we should always aware outcomes: approve or reject. For example, we have admin\
    \ task with 2 tabs: `Profile` tab and `Access Role` tab. We have one `Business\
    \ Logic Task Handler` and we set 3 workflows: one at admin task level, one for\
    \ `ModifyUserEvent` and one for `AssignAccessRoleEvent`. The picture below shows\
    \ all outcomes.\n\n| ![](OEBPS/image_rsrc8UY.jpg) |\n| Figure 5-10 shows all outcomes\
    \ examples |\n\nIf you use `ProviderAccessor API`, you have to aware `ProviderAccessor`\
    \ updates user store directly and not depend on workflow. The picture below shows\
    \ initial value of `City` is Toronto. And then we use `ProviderAccessor API` modify\
    \ `City` attribute to be New York. Whatever workflows will be rejected or approved,\
    \ the final value of city is New York.\n\n| ![](OEBPS/image_rsrc8UZ.jpg) |\n|\
    \ Figure 5-11 shows ProviderAccessor API modify attribute’s value |\n\n### 5.1.2\
    \ Workpoint Designer Concept\n\nThe workflows inside of CA IdentityMinder are\
    \ created by tools `WorkPoint Designer`. `WorkPoint Designer` is 3rd party software\
    \ and integrated with CA IdentityMinder. You can run Workpoint Designer by command\
    \ in `<admin_tools>\\WorkPoint\\bin\\Designer.bat`.\n\n| ![](OEBPS/image_rsrc8V0.jpg)\
    \ |\n| Figure 5-12 shows starter screen of Workpoint Designer\n\nYou have to check\
    \ configuration file `workpoint-client.properties`. The file is located in folder\
    \ `<admin_tools>\\WorkPoint\\conf`. The J2EE Client Configuration must match with\
    \ your application server.\n\n## Processes vs. Jobs\n\nProcess and Job is technical\
    \ term of Workpoint.\n\n* Processes are a function that a business conducts and\
    \ normally repeats.\n* Jobs are the process instance.\n\nFor example, if the `Process`\
    \ is a plan for an order fulfillment process, the specific cases (or `Jobs`) are\
    \ the actual orders. Process looks like a `Class` in `java` and job is an object\
    \ or instance of `java class`.\n\n### Processes\n\nRun Workpint Designer, select\
    \ “Open Process” from menu. Double click on process named “SingleStateApproval”,\
    \ you will see the process. \n\n| ![](OEBPS/image_rsrc8V1.jpg) |\n| Figure 5-13\
    \ shows processes “SingleStateApproval” |\n\n### Jobs\n\nSelect “Open Job” from\
    \ menu. Double click on process named “SingleStateApproval”, you will see the\
    \ process. (If the Process is a plan for an order fulfillment process, the specific\
    \ cases (or Jobs) are the actual orders. Process looks like a Class in java and\
    \ job is an object or instance of java class.)\n\n| ![](OEBPS/image_rsrc8V2.jpg)\
    \ |\n| Figure 5-14 shows job |\n\n### Help\n\nClick menu “Help”, help contents\
    \ will display. You can select “process definition” and “job definition”.\n\n\
    | ![](OEBPS/image_rsrc8V3.jpg) |\n| Figure 5-15 shows help of Workpoint Designer\n\
    \nAnother Workpoint document located in `<admin_tools>\\Workpoint\\docs`.\n\n\
    ## 5.2 Custom Workflow\n\nThe official IdentityMinder documents do not tell exactly\
    \ how to create custom workflow. All the rest of this chapter will show how to\
    \ create.\n\n### Why we need custom workflow?\n\nThe first reason, the default\
    \ template workflows do not fit our requirements. For example, you may want 3\
    \ approvers, the default supports up to 2.\n\nThe second reason, we need integration\
    \ with other systems or perform some business logic during workflow process. For\
    \ example:\n\n* During workflow, we need to call web services.\n* If user’s location\
    \ is North America, it requires second approver. We have to create routing path\
    \ to check user’s.\n\nThis section contains 2 parts:\n\n* Workflow for CA IdentityMinder,\
    \ you will learn the rule of workflow that relates to CA IdentityMinder.\n* Workpoint\
    \ Programming, we introduce some Workpoint API features.\n\n### 5.2.1 Workflow\
    \ and CA IdentityMinder\n\nWhen you create workflow for CA IdentityMinder, you\
    \ have to follow these rules:\n\nRule 1: Must start with a node `Start` and end\
    \ with a node `Stop`. It makes sense rule, workflow must have start and end point.\
    \ In Workpoint designer, you drag node from menu.\n\n| ![](OEBPS/image_rsrc8V4.jpg)\
    \ |\n| Figure 5-16 shows Start and Stop node in Workpoint\n\nRule 2: Must have\
    \ Node `Approve` or `Reject` before go to Node `Stop`. (The work flow has only\
    \ one reject node does not make sense)\n\nAny workflow, you need to set state\
    \ to be `Approve` or `Reject` before complete workflow. We need to tell the final\
    \ result to CA IdentityMinder, it is approved or rejected.\n\nDrag automate node\
    \ and set configuration: (You will see details in example code, do not worry)\n\
    \n* In the resources tab: select external\n* In the agents tab, for approve state,\
    \ select “Notify IM Approver” and for reject state, select “Notify IM Reject”\n\
    \n| ![](OEBPS/image_rsrc8V5.jpg) |\n| Figure 5-17 shows Approve and Reject state\
    \ before Stop\n\nRule 3: Approver Configuration (If you require approver)\n"
  raw: 'The workflow at admin task requires to set an attribute TASK_LEVEL=true. You
    will see it in the example code. Enable work flow at admin task level, you have
    to configure:


    *   On the Profile tab, check Enable Workflow checkbox.


    *   On the Profile tab, click the pencil icon at workflow process label. The workflow
    configuration screen display.


    | ![](OEBPS/image_rsrc8UR.jpg) |


    | Figure 5-4 shows how to configure workflow at admin task level |


    Event Level


    Enable work flow at event level, you have to configure:


    *   On the Profile tab, verify that Enable Workflow is checked


    *   On the Events tab, click pencil icon on events. The workflow mapping screen
    display, and select a process template.


    | ![](OEBPS/image_rsrc8US.jpg) |


    | Figure 5-5 shows how to configure workflow at event level |


    Select Workflows


    You can select workflow from drop down. CA IdentityMinder provides three default
    process templates:


    *   SingleStepApprovalProcess for one primary approver and default participant
    when primary approver is not found.


    *   TwoStageApprovalProcess for two primary approvers and default participant
    when primary approver is not found.


    *   EscalationApprovalProcess for one primary approver and default participant
    when primary approver is not found. This workflow primary approver can escalate
    to another approver.


    You can create more custom workflow, so we will go details later.


    Policy Base


    The policy-based is condition before start workflow. The picture below show Policy
    Base: if user’s city is New York, it requires workflow: TwoStageApprovalProcess.              


    | ![](OEBPS/image_rsrc8UT.jpg) |


    | Figure 5-6 shows screen of workflow’s policy base |


    If request is not met any condition, event or admin task will execute without
    workflow.


    Approver’s Task


    If workflow requires approver, we need screen for approver to perform action approve
    or reject. The picture below show screen to select Approval Task:


    | ![](OEBPS/image_rsrc8UU.jpg) |


    | Figure 5-7 shows configuration for approver’s screen. |


    The picture below shows the example approver’s screen. The icon ![](OEBPS/image_rsrc8UV.jpg)
    means that value has been changed. You can click to rollback the value.


    | ![](OEBPS/image_rsrc8UW.jpg) |


    | Figure 5-8 shows screen for approver |


    You can create new approver task by create new admin task. You have to choose
    action as “Approve Event” or “Approve Task”.


    Approver


    If workflow requires approver, we have to specific who is approver. We can select
    type of approver form drop down Participant Resolver. It provides condition to
    get approver.


    | ![](OEBPS/image_rsrc8UX.jpg) |


    | Figure 5-9 shows drop down: Participant Resolver |


    If your requirement getting approver is complicated, you can do programming by
    using Participation Resolver API. We will learn Participation Resolver API in
    the next chapter.


    Expected Outcome


    Working with workflow, we should always aware outcomes: approve or reject. For
    example, we have admin task with 2 tabs: Profile tab and Access Role tab. We have
    one Business Logic Task Handler and we set 3 workflows: one at admin task level,
    one for ModifyUserEvent and one for AssignAccessRoleEvent. The picture below shows
    all outcomes.


    | ![](OEBPS/image_rsrc8UY.jpg) |


    | Figure 5-10 shows all outcomes examples |


    If you use ProviderAccessor API, you have to aware ProviderAccessor updates user
