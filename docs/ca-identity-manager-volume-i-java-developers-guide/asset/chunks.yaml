    \ and click add button\n\n| ![](OEBPS/image_rsrc8X4.jpg) |\n| Figure 5-76 shows\
    \ category of script |\n\n### Filter by category\n\nAfter we add category, we\
    \ can do filter in condition of transition or agents of node.\n\n| ![](OEBPS/image_rsrc8X5.jpg)\
    \ |\n| Figure 5-77 shows category button for filter |\n\n### Export workflow\n\
    \nWe can export workflow and import to UAT or production.\n\n* Select menu `File`\
    \ > `Export`\n* Put file name, and click next\n* You can use category to filter.\n\
    * We usually export object we did: `Category`, `Process` and `Script`\n\n| ![](OEBPS/image_rsrc8X6.jpg)\
    \ |\n| Figure 5-78 shows menu export and export screen filter by category\n\n\
    Please see appendix A, we have detail about import workflow.\n\n## 5.4 WorkPoint\
    \ Programming\n\nNow you learned some Workpoint examples. This section has additional\
    \ concepts after you learn some example code.\n\n### 5.4.1 Activity, Server Automated\
    \ and Automated\n\nThere are 3 type of node: `Activity`![](OEBPS/image_rsrc8X7.jpg),\
    \ `Server Automated`![](OEBPS/image_rsrc8V8.jpg) and `Automated`![](OEBPS/image_rsrc8V7.jpg).\
    \ We have 3 types of activity, automated and server automated. There are checked\
    \ boxes in general tab. The picture below shows relationship between checkbox\
    \ and node type.\n\n| ![](OEBPS/image_rsrc8X8.jpg) |\n| Figure 5-79 below shows\
    \ relationship between checkbox and node type |\n\n### 5.4.2 Script for Server\
    \ Automated and Automated\n\nScript for `Server Automated`![](OEBPS/image_rsrc8V8.jpg)\
    \ and `Automated`![](OEBPS/image_rsrc8V7.jpg) are different. If you use node `Automate`\
    \ implement business logic, you have to do additional code to complete activity\
    \ by code. The picture below shows we use Automate node “Check City Value” and\
    \ flow does not move on after logic completed.\n\n| ![](OEBPS/image_rsrc8X9.jpg)\
    \ |\n| Figures 5-80 shows the flow stops at automated node and not move on. |\n\
    \nWe can fix the picture above by adding code to complete activity.\n\n```java\n\
    public void completeActivity(ClientContext cc,ActivityInstData ad,SymbolTable\
    \ st) throws Exception{\nshort workitem = Short.parseShort((String)st.getSymbol(\"\
    WorkItemIteration\").getPrimaryValue());\nWorkItemEntry workItemEntry = WorkItemEntry.queryByID(cc,\
    \ ad.getActivityInstID(),workitem);\nshort currentState = workItemEntry.getWorkStateID();\n\
    if (currentState == WorkItemConst.WORK_STATE_AVAILABLE) {workItemEntry.changeState(WorkItemConst.WORK_STATE_OPEN);}workItemEntry.changeState(WorkItemConst.WORK_STATE_COMPLETE);}\n\
    ```\n\nNote 3: Using server automated implement business logic. (Recommendation)\
    \ \n\nThis topic, we suggest to use the server automated. You don’t need to worry\
    \ to complete activity.\n\n### 5.4.3 Script for Server Automated and Automated\n\
    \n... Agent scripts can be Synchronous or Asynchronous. Let understand what is\
    \ Synchronous or Asynchronous:\n\n*   Synchronous scripts mean `’s scripts, and\
    \ state rules.\n*   Asynchronous scripts mean `’s scripts, and alert’s scripts.\n\
    \n| ![](OEBPS/image_rsrc8XA.jpg) |\n| Figure 5-81 shows agent script |\n\nSynchronous\
    \ agent scripts are executed in the same transaction as state change. Asynchronous\
    \ agent scripts are executed independently. need to know:\n\n* If you use script\
    \ modify `User Data`, script must execute in synchronous.\n* If you want to complete\
    \ activity, script must execute in asynchronous.\n\nNote 4: agent script of server\
    \ automated should designate as synchronous.\n\n### 5.4.4 Saving Job Objects\n\
    \nIn official document: programming guide, there is topic “Saving Job Objects”\
    \ in Workflow.\n\nWhat is saving object? `Job` is instance of process. Saving\
    \ job object means you want to keep some value for sharing between nodes. For\
    \ example\n\n* You have node 1 connect to node 2, and node 2 connect to node 3.\n\
    * Node 1 modify value `X =1`\n* Node 3 can see value `X`\n\nSo we have to declare\
    \ variable `X` in user data at process level. It is same step as when you specific\
    \ `TASK_LEVEL` for workflow.\n\n| ![](OEBPS/image_rsrc8XB.jpg) |\n| Figure 5-82\
    \ shows user data tab in process properties |\n\nThe official document tell develop\
    \ cache when they save `Job’s User Data` in asynchronous. It requires special\
    \ code.\n\nAll synchronous scripts must use the `ThisJobData` or `ThisActivityInstData`\
    \ to fetch `User Data`.\n\nWhen you want to save job in Asynchronous scripts you\
    \ must write code as:\n\n```javascript\nvar jobTableId = ThisJobData.getJobID();\n\
    var job = Job.queryByID(ClientContext,jobTableId,true);\njob.setUserData(\"Test\"\
    ,\"Pass\");\njob.save();\n```\n\n### 5.4.5 Search reference\n\nSometimes, you\
    \ cannot delete some object because there are some references. For example, you\
    \ want to delete script, but you get error because of references. You want to\
    \ know which process or jobs use this script. Click menu `library` > `scripts`,\
    \ and does right click on `script`, and select `search references` or `search\
    \ dialog`. The search dialog gives more option, if you want to search jobs, please\
    \ check option on `jobs` check box in search dialog.\n\n| ![](OEBPS/image_rsrc8XD.jpg)\
    \ |\n| Figure 5-84 shows search references\n\nNote 5: Delete related jobs before\
    \ delete process.\n"
