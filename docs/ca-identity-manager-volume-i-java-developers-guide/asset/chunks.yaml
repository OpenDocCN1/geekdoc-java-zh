    # Owners Tab


    This tab tells who can manage this `Identity Policy Set`. We want to add admin
    role “System Manager” to manage this policy.


    | ![](OEBPS/image_rsrc8SK.jpg) |

    | Figure 2-49 shows screen that add “System Manager” to be owner |


    When user change city and submit admin task, `Identity Policy Set` will evaluate
    `Member Rule` and `Policy Set`.


    | ![](OEBPS/image_rsrc8SM.jpg) |

    | Figure 2-50 shows how Identity Policy Set works. |


    `Identity Policy Set` has some limitation because condition base on user’s attribute
    or role membership. The next, we will create `Policy Xpress` provide more features.


    ## 2.4.2 Policy Xpress


    `Policy Xpress` allows you to create complex business logic (policies) in `CA
    IdentityMinder` without the need to develop custom code. `Policy Xpress` is more
    flexible than `Identity Policy Set`. It can access logical attributes and capture
    events. This section, we will create `Policy Xpress` to solve the requirement.
    When user put extension number then we will update phone number in format `<phone
    number>x<extension number>`.


    Select tab “Policies” and sub menu “Create Policy Xpress Policy”. Select “Create
    a new object of type Policy Xpress”.


    | ![](OEBPS/image_rsrc8SN.jpg) |

    | Figure 2-51 shows menu Create Policy Xpress Policy |


    ### Profile Tab


    We put value of `Policy Xpress` as below table:


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | Name | Set Telephone Number | Name of policy |

    | Policy Type | Submitted Task | Defines the listeners that trigger the policy.
    Our Policy Xpress will execute when task submitted. |

    | Category | Book Example | Category name |

    | Priority | 0 | The lower the number, the higher the priority |

    | Enable | Check | This policy is active in CA IdentityMinder |

    | Run Once | Do not Check | Specifies if the policy runs only once. For our policies
    do not check and run every time they meet criteria. |


    | ![](OEBPS/image_rsrc8SP.jpg) |

    | Figure 2.52 shows the values of profile’s screen |


    Click tab “Events”.


    ### Events Tab


    `Policy Xpress` can capture events of Admin Task include UI and task submitted.
    This tab tells when this `Policy Xpress` will be executed. We want this `Policy
    Xpress` execute when our task complete, so we put value below:


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | State | Task completed | Tells when this Policy Xpress execute |

    | Event Name | Update Location and Ext Number (BookBasicUpdateLocAndExtNo) | Select
    task name from dropdown |


    | ![](OEBPS/image_rsrc8SR.jpg) |

    | Figure 2-53 displays event of Policy Xpress |


    ### Data Tab


    This tab is designed for getting data. We have to capture some value before set
    it back. We plan to create condition like:


    `If city == “New York” then set Telephone number + “x” + extension number from
    screen`


    So we need to get data: City, Telephone number and extension number (Logical attribute).
    Click “Add Data Element” to add data. For city attribute, select value as below
    table:


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | Name | City | Name of data |

    | Category | Attributes | Group of data elements. |

    | Type | User Attribute | Specifies the data element type based on the category
    selected. |

    | Function | Get | Defines possible variations of the same data. Most data elements
    only support the Get function. |

    | Attribute Name | City (l) | Required attribute |


    | ![](OEBPS/image_rsrc8SS.jpg) |

    | Figure 2-54 shows screen, getting data: City |


    For Telephone Number, select value as below table:


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | Name | TelephoneNumber | Name of data |

    | Category | Attributes | Group of data elements. |

    | Type | User Attribute | Specifies the data element type |

    | Function | Get | Get function. |

    | Attribute Name | Business Phone (Telephone Number) | Required attribute |


    For Extension Number, select value as below table:


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | Name | ExtensionNumber | Name of data |

    | Category | Attributes | Group of data elements. |

    | Type | User Attribute | Specifies the data element type |

    | Function | Get | Get function. |

    | Attribute Name | `|ExtNumber|` | Our logical attribute |


    | ![](OEBPS/image_rsrc8ST.jpg) |

    | Figure 2-55 shows screen get data: Telephone and Logical Attribute `|ExtNumber|`
    |


    When you complete this step, click tab Entry Rule.


    ### Entry Rules Tab


    Entry Rules are main condition. It tells what we are interested. Our example is
    interested city value not blank.


    | ![](OEBPS/image_rsrc8SU.jpg) |

    | Figure 2-56 shows Entry Rule |


    ### Action Rules Tab


    This tab, we will create condition:


    `If city == “New York” then set Telephone number + “x” + extension number from
    screen`


    We define IF in Action Rule and THEN in Add Action.


    | ![](OEBPS/image_rsrc8SV.jpg) |

    | Figure 2-57 shows condition when city |


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | Name | Set New York Telephone | Name of action |

    | Action Rule Conditions | | |

    | City | New York | Kind of If |

    |  | | |


    To click “Add Match” button, put value as below:


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | Name | Set Telephone Number | Name of action |

    | Category | Attributes | Group of data elements |

    | Type | User Attribute | Specifies the data element type |

    | Function | Set | Set function |

    | Attribute Name | Business Phone (Telephone Number) | Our attribute |


    Add condition for other cities in table:


    | Action Rule Conditions | Set Business Phone (telephoneNumber) |

    | :--- | :--- |

    | City =Toronto | |

    | Buenos Aires | |

    | Tokyo | |

    | London | |

    | Sao Paulo | |

    | Dubai | |

    | Melbourne | |


    | ![](OEBPS/image_rsrc8SW.jpg) |

    | Figure 2-58 shows conditions of Action Rules |


    Click submit button to create Policy Xpress. We left Advanced Tab as default value.


    ## 2.5 How it works


    ### 2.5.1 How UI works


    #### Form

    We have 2 screens: Search screen and Form.


    #### Search Screen


    We define Search screen when we create admin task:


    *   In profile tab, we select primary object as User and action is Modify.

    *   In search tab, we select default search screen “Default User Search”.


    | ![](OEBPS/image_rsrc8SX.jpg) |

    | Figure 2-59 shows screen of Default User Search. |


    The number of result is depending on your scope of Admin Role. You can check from
    Tab “Roles and Tasks”, and select Menu “Modify Admin Role Members/Administrators”
    and select Tab “Members”. Look at item “Which User objects does this role manage?”

