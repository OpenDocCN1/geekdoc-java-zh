    # Chapter 1 Introduction


    The key feature of CA IdentityMinder is customization without custom code but
    in this book we are talking about custom code. There are 2 main reasons why I
    wrote this book:


    *   Some requirements need programming. (some can implement by programming only)


    *   The lack of programming document, while as we have a lot of installation,
    configuration, and administration document. This book describe both concept and
    example steps by step.


    ## 1.1 Why we need custom code


    My advice is let implement by powerful features such as ConfigXpress, PolicyXpress,
    and ConnectorXpress as the first choice. If there are some limitations, goes custom
    code.             


    Calculation logic


    If you have a lot of calculation logic, programming may better than PolicyXpress.


    Performance


    If you implement 30-40 PolicyXpress for one requirement, it may impact performance. 
    Custom code can reduce number of PolicyXpress.


    Custom workflow


    PolicyXpress cannot create custom workflow. You feel free to create workflow dynamically
    by programming. You can take advantages of workflow API such as create routing
    path in workflow, delay process, define approver, etc.


    Exception handling


    Handling exception by programming is easier. We can write java code try/catch,
    implement workflow path for error or use Listener to capture event failure.


    Integration


    Some requirements, we need custom code call web services or database inside CA
    IdentityMinder.


    Complex requirement


    Some requirements have many steps and long process, programing is good helper.
    We can do programing for validation, business logic under both synchronous and
    asynchronous phase.


    No Limitation


    You can use programming generate event, generate workflow, call other admin tasks
    ,etc. These advanced examples are in book volume II.


    ## 1.2 What this book covers


    Chapter 1: Introduction or this one you are reading. We explain big picture of
    CA IdentityMinder component, server configuration.


    Chapter 2: Administration Concepts. This chapter is written for beginner or programmer
    who has a few administrator experiences.


    Chapter 3: Programming Concepts. We will introduce each type of API and concept
    of synchronous and asynchronous phase.


    Chapter 4: Business Logic Task Handlers. This chapter will cover concepts of Business
    Logic Task Handlers API. 


    Chapter 5: Workflows. You will learn how to customize workflow and Workpoint features.


    Chapter 6: Additional APIs. We will cover other APIs and example code such as;
    TEWS, Notification Rule, Event Listener, Participation Resolver, Logical Attribute
    API, etc.


    ## 1.3 Technical Terms


    There are some technical terms for new comer, avoid confusing.


    Endpoint


    It  is destination of user data after provisioning. Examples of endpoints can
    be Microsoft Active Directory, SAP, Database, UNIX workstation, Windows PC, or
    an application.


    | ![](OEBPS/image_rsrc8PP.jpg) |


    | Figure 1-1 Example of Endpoints |


    User vs. Global User vs. Account


    In CA IdentityMinder, there are 2 major server inside are CA IdentityMinder Server
    and CA IdentityMinder Provisioning Server (We will call “Provisioning Server”
    for short)


    User means user information maintained by CA IdentityMinder Server. User is stored
    in CA IdentityMinder User Store.


    Global User means user information maintained by the Provisioning Server. It is
    stored in Provisioning Director.


    Account means user information in Endpoint.  For example account in Active Directory 


    In figure below shows relationship between user, global user and accounts. Some
    users have a corresponding global user. When a user receives a provisioning role,
    the Provisioning Server will creates a global user. When server start provisioning
    process, some attributes from global user will been provisioned to accounts in
    endpoints.


    | ![](OEBPS/image_rsrc8PR.jpg) |


    | Figure 1-2 User vs. Global User vs. Account |


    ## 1.4 CA IdentityMinder Components


    We will explain only some components that relate to custom code.


    Servers


    There are 2 required servers when you install CA IdentityMinder:


    CA IdentityMinder Server executes tasks within CA IdentityMinder. CA IdentityMinder
    is the Java EE application includes the Management Console and the User Console.


    CA Provisioning Server manages accounts on endpoint systems. This server is required
    if the CA IdentityMinder installation will support account provisioning.


    User Store and Provisioning Directory


    CA IdentityMinder User Store is the user store maintained by CA IdentityMinder
    Server. Typically, this is an existing store that contains the user identities
    that a company needs to manage.


    Provisioning Directory, the user store maintained by the Provisioning Server.
    It is an instance of CA Directory and includes global users, which associate users
    in the Provisioning Directory with accounts on endpoints such as Microsoft Exchange,
    Active Directory, and SAP.


    | ![](OEBPS/image_rsrc8PS.jpg) |


    | Figure 1-3 display relationship between CA IdentityMinder Server, Provisioning
    Server, User Store and Provisioning Directory |


