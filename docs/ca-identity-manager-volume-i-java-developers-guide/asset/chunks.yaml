    |


    We can set the value on screen by using method updateRawData().


    | HashMap<String, String> data = new HashMap<String, String>();data.put("&#124;ExtNumber&#124;",
    telephoneNumber.substring(telephoneNumber.indexOf("x") + 1));...profileTab.updateRawData(data);
    |


    Inside of screen, we have fields. We create new HashMap object. We put key and
    value pair, key’s name |ExtNumber| came from the screen definition in admin task.
    If you want to set city attribute, you can use attribute name same as user store. 
    The city’s attribute uses “l” as key.


    handleValidation (): validate user input


    After user submit the admin task, if extension number is blank or put some characters,
    the error will be display.


    | ![](OEBPS/image_rsrc8UK.jpg) |


    | Figure 4-29 shows error messages |


    We have to override method handleValidation (). We can get any fields from screen
    by method getRawData(). If you are not sure about fields’ name, you can print
    by method getRawData(). It is a HashMap object that key represent by field’s name.


    | String extNumber = (String) profileTab.getRawData().get("&#124;ExtNumber&#124;");
    |


    You can get the values from the screen and perform the validation logic as code
    below.


    | String extNumber = (String) profileTab.getRawData().get("&#124;ExtNumber&#124;");if
    (extNumber == null) {...} else {try {int number = new Integer(extNumber);  } catch
    (NumberFormatException ne) {...}} |


    Shows the error message


    We show error by throwing IMSException object. You can put message display on
    screen by method addUserMessage().


    | IMSException imsEx = new IMSException();imsEx.addUserMessage("Telephone number
    can''t be empty");throw imsEx; |


    Session attributes: pass the value between methods


    We have already validated telephone number and we can pass the valid telephone
    value to method handleSubmission() by session. BLTHContext provide session attribute
    for sharing data between method and other CA IdentityMinder APIs.


    | public void handleValidation(BLTHContext blthContext) throws Exception {// Setting
    value to sessionblthContext.setSessionAttribute("extNumber", number);…}public
    void handleSubmission(BLTHContext blthContext) throws Exception {// Getting value
    from sessionint extNumber = (Integer) blthContext.getSessionAttribute("extNumber");}
    |


    ## 4.5 Use cases examples


    The official CA IdenityMinder document gave use cases examples but not provide
    detail of programming. This section will give you some idea of those examples.


    Please see full description from Programming Guides › Programming Guide for Java
    › Business Logic Task Handler API › Business Logic Task Handler API Overview ›
    Use Case Examples.


    Check whether a group membership limit is reached


    | When an administrator attempts to add a member to a group by submitting a Modify
    Group task for execution, access the Group managed object to determine the number
    of current members. If the group has the maximum number of members, throw an exception.
    |


    The modify group task, we can use BLTHContext,getGroup(). We call method getMembers()
    return all members inside group. We can check size.  


    | Vector users = blthContext.getGroup().getMembers(ObjectType.USER, null);System.out.println(“user
    size : “+users.size()); |


    Please note, the Group class has method getUsers() and getMembers():


    *   Method getUsers() return only user object


    *   Method getMembers() can return any object depending parameters: ObjectType
    . Please see java document: ObjectType for details.


    Verify the job title of a new administrator


    | When a user submits a Create Administrator task for execution, access a third-party
    database to determine the job title of the administrator being created. If this
    particular person does not have the job title Supervisor (the only job title authorized
    to be an administrator), throw an exception. |


    We can write java code access the database in handleSubmission().  You pass administrator
    id as argument and get job title.


    | //Get administrator who is executing the taskUser admin = blthContext.getAdministrator();//Call
    the third party to get titleString jobTitle = callDB(admin.getFriendlyName());
    |


