  trans: "\n\n这与之前相同，重写方法 `after()` 并向 JMS 发送消息。在管理控制台中配置时选择 `*`，它将在每个事件发生时执行。\n\n\
    ## 6.3 逻辑属性 API\n\n逻辑属性 API 用于在逻辑属性（显示在屏幕上）和物理属性（存储用户数据存储中）之间进行转换。逻辑属性处理程序的执行发生在任务处理的同步阶段。\n\
    \n### 逻辑属性\n\n逻辑属性值显示在任务屏幕字段中。逻辑属性名称出现在竖线（`|`）之间。例如，扩展逻辑属性显示为 `|Extension|`。\n\
    \n| ![](img/image_rsrc8XP.jpg) |\n\n| 图 6-7 显示了逻辑属性 |\n\n逻辑属性值不直接与数据存储关联或写入数据存储器。它需要通过逻辑属性处理程序进行处理。\n\
    \n### 预定义逻辑属性\n\nCA IdentityMinder 为某些目的预定义了逻辑属性，例如 `|passwordConfirm|`、`|oldPassword|`。我们可以使用或对其进行自定义。更多细节请参阅办公文档。\n\
    \n### 物理属性\n\n物理属性是底层数据存储（如 LDAP 用户目录）的属性。如果任务屏幕字段配置了物理属性，则输入字段字段的值将写入数据存储器。\n\
    \n### 6.3.1 编程\n\n创建一个扩展 `LogicalAttributeAdapter` 的 Java 类并重写方法：\n\n*   `public\
    \ void toLogical(LogicalAttributeContext apiContext) throws java.lang.Exception`\n\
    \    *   将值从物理属性转换为逻辑属性。\n\n*   `public void toPhysical(LogicalAttributeContext\
    \ apiContext) throws java.lang.Exception`\n    *   将值从逻辑属性转换为物理属性。\n\n*   `public\
    \ void initializeOptionList(LogicalAttributeContext apiContext) throws java.lang.Exception`\n\
    \    *   如果你想将值渲染为列表，则需要实现此方法并返回一个 `Vector` 作为屏幕上的显示值列表。\n\n*   `public void initialize(LogicalAttributeContext\
    \ apiContext) throws java.lang.Exception`\n    *   在创建用户或创建任何对象时，此方法设置属性的初始值。\n\
    \n### 6.3.2 代码示例\n\n我们的示例展示了如何将城市（物理属性）转换为办公室代码（逻辑属性）。屏幕将显示办公室代码。当用户选择办公室代码时，它将把办公室代码的值转换为城市值。\n\
    \n| ![](img/image_rsrc8XR.jpg) |\n\n| 图 6-8 显示了用户更新办公室的屏幕 |\n\n#### 代码\n\n1. \
    \ 编译我们的 Java 代码：`com.book.idm.etc.OfficeCodeLogicalAttr`\n2.  将类（包括包文件夹 `com.book.idm.etc`）复制到文件夹\
    \ `<server>\\IdentityMinder.ear\\custom` \n\n#### 配置：管理控制台\n\n1.  在管理控制台中，点击 `Environments`。\n\
    2.  点击将使用逻辑属性的环境名称。\n3.  点击 `Advanced Settings`。\n4.  点击 `Logical Attribute Handlers`。\n\
    5.  点击新建按钮并输入如下值：\n\n| 字段名称 | 值 | 说明 |\n| :--- | :--- | :--- |\n| Name | `OfficeCodeLogicalAttr`\
    \ | 逻辑属性名称 |\n| Class | `com.book.idm.etc. OfficeCodeLogicalAttr` | Java 类名 |\n\
    | Object Type | User | 具有逻辑属性的对象类型 |\n| Logical Attributes | | |\n| Name | `officeCodeList`\
    \ | 代码中使用的名称。 |\n| Attribute Name | `|officeCodeList|` | 在管理员任务屏幕上显示的名称 |\n| Option\
    \ List | Check | 告诉 CA IdentityMinder，此属性是列表 |\n| Name | `officeCode` | 代码中使用的名称。\
    \ |\n| Attribute Name | `|officeCode|` | 在管理员任务屏幕上显示的名称 |\n| Physical Attributes\
    \ | | |\n| Name | `officeCodePhyAttr` | 代码中使用的名称。 |\n| Attribute Name | `l` |\
    \ (小写 L) 用户存储中城市属性的名称。 |\n\n| ![](img/image_rsrc8XS.jpg) |\n\n| 图 6-9 显示管理控制台中的逻辑属性配置\
    \ |\n\n6.  点击 `Restart Environment` 按钮。\n\n#### 配置：Identity Manager 用户控制台\n\n\
    1.  以管理员身份登录 Identity Manager 用户控制台。\n2.  选择标签 `Roles and Tasks`，并选择菜单 `create\
    \ admin task`。\n3.  创建管理员任务，输入如下值：\n\n| 字段名称 | 值 | 说明 |\n| :--- | :--- | :---\
    \ |\n| Tab: Profile | | |\n| Name | `Update Office` | 管理员任务名称 |\n| Tag | `BookBasicUpdateOffice`\
    \ | 管理员任务标签 |\n| Description | `Example for Logical Attribute` | 管理员任务描述 |\n|\
    \ Category | `Book Example` | 管理员任务显示的位置。 |\n| Category Order | 11 | |\n| Category\
    \ 2 | Task | |\n| Category 3 | Basic | |\n| Primary Object | User | 我们想更新城市，所以你必须选择对象\
    \ user，以及操作 modify。 |\n| Action | Modify | |\n| 为了为了测试，你可以禁用某些值。 | | |\n| User\
    \ Synchronization and Account Synchronization: off | | |\n| Enable Auditing, Enable\
    \ Workflow, Enable Web Services: uncheck | | |\n| Tab: Search | | |\n| Search\
    \ Screen | Default User Search | 搜索用户的屏幕 |\n\n4.  对于 Tab: Tabs：\n    *   选择标准标签控制器。\n\
    \    *   从列表中选择 `Profile(UserProfile)`，并点击符号 `(+)`。\n    *   选择屏幕文本字段处的浏览按钮。\n\
    \    *   点击新建按钮创建新屏幕，并选择标准配置配置界面。\n    *   输入值：\n        *   Name: `Book Example:\
    \ Update Office`\n        *   Tag: `BookBasicUpdateOffice`\n    *   添加属性：`|officeCode|`\n\
    \        *   Attribute Name: `|officeCode|`\n        *   Style: Drop down\n  \
    \  *   添加属性：`|officeCodeList|`\n        *   Attribute Name: `|officeCodeList|`\n\
    \        *   Style: Hidden\n    *   添加属性：`City`\n        *   Attribute Name: `City`\n\
    \        *   Style: Hidden\n\n| ![](img/image_rsrc8XT.jpg) |\n\n| 图 6-10 显示了各项的配置\
    \ |\n\n5.  提交以完成任务创建。\n\n将此任务添加到管理员角色。\n1.  选择标签 `Roles and Tasks`，并选择菜单 `create\
    \ admin task`。\n2.  选择角色管理器。\n    *   选择标签 `task`\n    *   按类别 `Book Example`\
    \ 过滤\n    *   选择添加任务：`Update Office`\n3.  提交以完成角色修改。\n\n#### 工作原理\n\n执行管理员任务：`Update\
    \ Office`。\n1.  以管理员身份登录 Identity Manager 用户控制台。\n2.  选择标签 `Book Example`，并选择菜单\
    \ `update office`。\n3.  搜索用户，屏幕将办公室下拉列表。\n4.  修改代码属性并提交。\n你可以通过登录用户存储器、搜索修改后的用户来检查结果。用户存储中的城市属性为\
    \ `l`。\n\n#### 方法：`toLogical()`\n\n该方法将值从物理属性转换为逻辑属性。代码包含三个步骤：\n\n*   第一步：从物理属性获取值。\n\
    *   第二步：映射，从物理转换为逻辑。你可以有其他方式进行转换。\n*   第三步：将值设置回逻辑属性。\n\n```java\nprivate String\
    \ ATTR_REFER_PHY = \"officeCodePhyAttr\";\n\n@Override\npublic void toLogical(LogicalAttributeContext\
    \ ctx) throws Exception {\n    //获取物理属性值\n    String city = ctx.getPhysicalAttributeName(ATTR_REFER_PHY);\n\
    \    String cityValue = ctx.getPhysicalAttributeValue(city);\n    //从物理值到逻辑的映射\n\
    \    String officeCodeValue = indexPhysicalAsKey.get(cityValue);\n    if(officeCodeValue!=null)\
    \ {\n        //设置逻辑值\n        String officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n\
    \        ctx.setLogicalAttributeValue(officeCode, officeCodeValue);\n    }\n}\n\
    ```\n\n我们的代码中可以逐步解释：\n\n第一步：当我们进行配置时，从物理属性获取值，变量 `officecodePhyAttr` 链接到用户数据存储中的属性\
    \ `l`。\n\n| ![](img/image_rsrc8XU.jpg) |\n\n| 图 6-11 显示了物理属性的属性映射 |\n\n"
- fmt: "\nLogical attribute handler execution occurs in the synchronous phase of task\
    \ processing. If response time during interaction with a third-party system is\
    \ an issue, the same objective can be performed using an event listener during\
    \ the `Pre-approval` state.\n\nIt means if you want to call third-party to convert\
    \ attribute value, you should concern response time because logical attribute\
    \ API execute under synchronous phase.\n\n### Step 3: The last line of code is\
    \ set value back to logical attribute value\n\n```\nctx.setLogicalAttributeValue(officeCode,\
    \ officeCodeValue);\n```\n\n#### Method: `toPhysical()`\n\nThis method is reverse\
    \ of `toLogical()`. The steps are same but reverse.\n\n*   Step 1: Look up logical\
    \ attribute value.\n*   Step 2: Mapping, convert to be physical value.\n*   Step\
    \ 3: Set value back to physical attribute.\n\n```java\n@Override\npublic void\
    \ toPhysical(LogicalAttributeContext ctx) throws Exception {\n    //step 1\n \
    \   String officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n    String\
    \ officeCodeValue = ctx.getLogicalAttributeValue(officeCode);\n    //step 2\n\
    \    String cityValue = indexLogicalAsKey.get(officeCodeValue);\n    //step 3\n\
    \    String city = ctx.getPhysicalAttributeName(ATTR_REFER_PHY);\n    ctx.setPhysicalAttributeValue(city,\
    \ cityValue);\n}\n```\n\n#### Attributes in admin task\n\nWe declare 3 fields\
    \ on screen:\n\n*   2 logical attributes: `officeCode` (dropdown) and `officeCodeList`\
    \ (hidden) are required for dropdown.\n*   1 physical attribute: City (hidden)\
    \ we need because we populate city attribute. So city attribute must be present\
    \ in admin task context.\n\n#### Method: `initializeOptionList()`\n\nIf you want\
    \ dropdown for this logical attribute, you have to implement this method. You\
    \ just set vector to logical attribute value.\n\n```\nctx.setLogicalAttributeMultiValue(officeCodeList,officeCodes);\n\
    ```\n\nMake sure you check option list in configuration page.\n\n| ![](OEBPS/image_rsrc8XV.jpg)\
    \ |\n\nFigure 6-12 shows check box for option list\n\n#### Method: `initialize()`\n\
    \nThis method will be execute for task create only, for example create user, create\
    \ account. This method used for initial value for logical attribute.\n\nFor modification\
    \ task, this method has never been executed. Our example never called this method.\
    \ If you want to execute this method, you have to change action to be “create”.\
    \ (The primary object is user) And then you execute this admin task again, you\
    \ will see this method set default value “006NY”.\n\n```java\n@Override\npublic\
    \ void initialize(LogicalAttributeContext ctx) throws Exception {\n    String\
    \ officeCodeName = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n    String\
    \ officeCodeValue = ctx.getLogicalAttributeValue(officeCodeName);\n    if(officeCodeValue\
    \ == null || officeCodeValue.trim().length()==0) {\n        ctx.setLogicalAttributeValue(officeCodeName,\
    \ \"006NY\");\n    }\n}\n```\n\n#### Method: `validate()`\n\n`validate()` method\
    \ will be execute when user submit task. You can test our code by select empty\
    \ value and clicks submit.\n\n```java\n@Override\npublic void validate(LogicalAttributeContext\
    \ ctx) throws Exception {\n    String officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n\
    \    String officeCodeValue = ctx.getLogicalAttributeValue(officeCode);\n    if(officeCodeValue==null\
    \ || officeCodeValue.trim().length()==0) {\n        IMSException e = new IMSException();\n\
    \        e.addUserMessage(\"Invalid office value\");\n        throw e;\n    }\n\
    }\n```\n\n| ![](OEBPS/image_rsrc8XW.jpg) |\n\nFigure 6-13 shows exception during\
    \ `validate()` method\n\n#### Screen-Defined Logical Attributes vs. our Logical\
    \ Attribute\n\nWhen you create screen, you can create screen-Defined Logical Attributes.\
    \ The screen-Defined Logical Attributes are defined for only one screen. They\
    \ can’t share with other screens but the logical attributes can share.\n\n###\
    \ 6.3.3 Use Case\n\nRefer to the official document, Progamming guide > Logical\
    \ Attribute > Use Case Examples\n\n##### Format data from a data source\n\nIn\
    \ the user directory, a telephone number is stored as the physical attribute `phone`.\
    \ It has 10 digits—for example, 9785551212. This physical attribute is associated\
    \ with the logical attribute `formatted_phone`.\n\nThis use case need to override\
    \ `toLogical()`, to return formatted phone and override method `toPhysical()`\
    \ to convert from formatted phone to be number.\n\n```java\n@Override\npublic\
    \ void toLogical(LogicalAttributeContext ctx) throws Exception {\n    //step 1\n\
    \    String empNo = ctx.getPhysicalAttributeName(\"employeeNumber\");\n    String\
    \ empNoValue = ctx.getPhysicalAttributeValue(empNo);\n    //step2\n    String\
    \ validEmpNoValue = queryByPhysicalID(validEmpNoValue);\n    //step 3\n    if(empNo!=null)\
    \ {\n        String validEmpNo = ctx.getLogicalAttributeName(\"validEmployeeValue\"\
    );\n        ctx.setLogicalAttributeValue(validEmpNo, validEmpNoValue);\n     \
    \   return;\n    }\n    throw new IMSException(\"invalid employee number\");\n\
    }\n```\n\n##### Validate data entry\n\nThe physical attribute `employeeNumber`\
    \ exists in a data source, and it is mapped to the logical attribute `validEmployeeNumber`.\
    \ After a user assigns an employee number to the `validEmployeeNumber` attribute\
    \ on the task screen and clicks Submit, CA IdentityMinder calls a custom logical\
    \ attribute handler to query the data source to be sure that the supplied employee\
    \ number exists in `employeeNumber`. If it does not exist, the logical attribute\
    \ handler throws an exception.\n\nThis use case queries the database to convert\
    \ between logical attribute and physical attribute.\n\n##### Add a drop-down list\
    \ to a task screen\n\nA task screen requires a customer to provide the type of\
    \ service they have purchased—Gold, Silver, or Bronze. These options are presented\
    \ in a drop-down list.\n\nThis use case is same as our example. You have to implement\
    \ `initializeOptionList()` returns type of service: Gold, Silver, or Bronze and\
    \ implement method `toPhysical()` and `toLogical()` convert the value between\
    \ service(Gold, Silver, or Bronze) to number (1,2, or 3).\n\n## 6.4 Validation\
    \ Rules\n\nAttribute validation rules help validate value that user types on screen\
    \ meet the right format. Validation of user entry can be regular expression, JavaScript,\
    \ or Java implementations. In this book will focus on Java programming. For regular\
    \ expression and JavaScript, you can see example from official document (but validation\
    \ rules by Java programming is missing).\n\n##### Types of Validation Rules\n\n\
    *   Task-level validation: validation rule directly to a field on a particular\
    \ task screen. You can define rule during task-screen configuration.\n*   Directory-level\
    \ validation: validate the attribute’s value but It has been applied all tasks.\
    \ It is global scope. You have to define the rule in `directory.xml`.\n\n### 6.4.1\
    \ Programming\n\nFor task-level validation, you have to implement `TaskValidator`\
    \ and override method `validate()`.\n\n```java\npublic boolean validate(BLTHContext\
    \ ctx, String attrValue, StringRef changedValue, StringRef errorMsg) throws AttributeValidationException\n\
    ```\n\nFor directory-level validation, you have to extend `AttributeValidator`\
    \ and override method `validate()`. It is almost same as task-validation but there\
    \ are some details. You will see in our examples.\n\n```java\npublic boolean validate(Object\
    \ attrValue, StringRef changedValue, StringRef errorMsg) throws AttributeValidationException\n\
    ```\n\n### 6.4.2 Code Example: Task-level validation\n\nThis example require attribute\
    \ Employee Number, please check your user store. Our requirement uses employee\
    \ number attribute. The validate rule is\n\n*   Employee number must be number\
    \ only.\n*   Maximum is 4 Digits.\n*   If user types 1-3 digits, the format fill\
    \ in 0 as prefix. For example: 2, the right format will be 0002\n\n| ![](OEBPS/image_rsrc8XX.jpg)\
    \ |\n\nFigure 6-14 shows user’s screen for updating employee number\n\n#### Code\n\
    \n1.  Compile our java code: `com.book.idm.etc.EmployeeNumberTaskValidator`\n\
    2.  Copy class (include package folder `com.book.idm.etc` ) to folder `\\IdentityMinder.ear\\\
    custom`\n"
