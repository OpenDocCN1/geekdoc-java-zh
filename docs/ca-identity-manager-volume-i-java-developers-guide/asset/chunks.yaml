- fmt: "\nA connector is the software interface to an endpoint. The `Provisioning\
    \ Server` uses the `connector` to communicate with the endpoint. It translates\
    \ `Provisioning Server` actions into changes on the endpoint, such as “Create\
    \ a new email account on a Microsoft Exchange endpoint.”\n\n`Connector Servers`\
    \ is a Server component that manages connectors. There are two types of connector\
    \ servers:\n\n* `CA IAM Connector Server` (`CA IAM CS`) manages connectors written\
    \ in Java\n* `C++ Connector Server` (`CCS`) manages connectors written in C++\n\
    \nConnectors and Agents, some connectors require an agent on the systems they\
    \ manage in order to complete the communication cycle.\n\n`Connector Xpress` is\
    \ `CA IdentityMinder` utility for managing dynamic connectors, mapping dynamic\
    \ connectors to endpoints, and establishing routing rules for endpoints. You can\
    \ use it to configure dynamic connectors to allow provisioning and management\
    \ of SQL databases and LDAP directories.\n\n### Additional Components\n\n`WorkPoint`\
    \ workflow engine and `WorkPoint Designer` are installed automatically when you\
    \ install `CA IdentityMinder`. These components enable you to place a `CA IdentityMinder`\
    \ task under workflow control, and to modify existing workflow process definitions\
    \ or create new definitions.\n\n`Provisioning Manager` is a graphical interface\
    \ to manage global user and provisioning server options. You may also use the\
    \ `Provisioning Manager` to manage endpoint or account.\n\n## 1.5 Server Configuration\n\
    \nThis book assumes you should have already installed and configure:\n\n* `CA\
    \ IdentityMinder` and user store.\n* `Provisioning Server`, `provisioning manager`\
    \ and `provisioning directory`.\n* `Connector server`\n* `Wokpoint designer`\n\
    \nMy suggestion is to configure one endpoint `Microsoft Active Directory`, account\
    \ template and provisioning role is a plus. You should have some users and account\
    \ in `IDM` system.\n\n### User Store attributes\n\nIn this book, we require attribute\
    \ `City` and `telephone number` as the main, but other chapters require additional.\
    \ We will create 3 admin tasks:\n\n* `Update Location and Ext Number` used in\
    \ almost every chapter.\n    * Requires attribute: `L` (or `City`)\n    * Requires\
    \ attribute: `telephoneNumber`.\n    * In chapter 2, our policy `Express` example\
    \ requires `state`.\n* `Update office`, used in chapter 6: `Logical Attribute\
    \ API` only\n    * Requires attribute: `L` (or `City` same as previous)\n* `Update\
    \ Employee Number` used in chapter 6: `Validation Rule` only\n    * Requires attribute:\
    \ `employee number`\n\nPlease check the `Management Console`, select `Directory\
    \ > User Store (Cooperate Store) > User` and check attributes.\n\n| ![](OEBPS/image_rsrc8PT.jpg)\
    \ |\n| Figure 1-4 shows display name |\n\n### Global user attributes\n\nIn the\
    \ `Management Console`, select `Directory > Provisioning Store > Global User`\
    \ and check attribute, `Physical Name` `eTCity`.\n\n| ![](OEBPS/image_rsrc8PU.jpg)\
    \ |\n| Figure 1-5 shows display name of `eTCity` |\n\n### Attributes mapping\n\
    \nIn the `Management Console`, select `Environment > your environment > Advanced\
    \ Settings > Provisioning` and check attributes mapping: `User Attribute l` maps\
    \ to `Provisioning Attribute eTCity`.\n\n| ![](OEBPS/image_rsrc8PV.jpg) |\n| Figure\
    \ 1-6 shows attribute mapping |\n\n## 1.6 Conclusions\n\nWe introduced the benefit\
    \ of custom code and server configuration. The next chapter you will learn the\
    \ basic concepts of `CA IdentityMinder` administration.\n\n# Chapter 2 Administration\
    \ Concepts\n\nIf you familiar with `CA IdentityMinder`, you can pass this chapter\
    \ quickly. This chapter, you will learn:\n\n* How to create `admin task`\n* How\
    \ provisioning works\n* How `Identity Policy Set` and `Policy Xpress` works\n\
    * Understand submitted task and events\n\nIt is difficult to explain all administration\
    \ features in one chapter. We will focus only some part that relate to programming.\
    \ If you are new to `CA IdentityMinder`, you may easily to get lost because of\
    \ many features. We will use `admin task` as major topic.\n\n## 2.1 Requirement\n\
    \nThis chapter, we will implement requirement by administrator’s tools.\n\n###\
    \ Requirement\n\nOur requirement need screen to modify city and extension telephone\
    \ number. The requirements can be written as steps below:\n\n* `Step1`: log into\
    \ the `Identity Manager User Console` as administrator, and select form “Update\
    \ location and Ext Number” \n    * Select `city` from dropdown\n    * Put `extension\
    \ number`\n    * Click `submit`\n* `Step 2`: System updates user attributes:\n\
    \    * Update `city` attribute and set `country` by `city value`.\n    * Concatenate\
    \ `office number` and `extension number`.\n* `Step 3`: System updates account\
    \ attributes; `city` and `telephone number`\n\n### Design\n\nWe will implement\
    \ each requirement’s step by:\n\n* `Step 1`: Provide screen\n    * Create `admin\
    \ tasks` and screen with 2 attributes; `city` and `extension number`\n* `Step\
    \ 2`: Processing\n    * We use `Policy Set` maps `city` to `country`.\n    * We\
    \ use `Policy Xpress` to concatenate `office number` and `extension number`.\n\
    * `Step 3`: Provisioning\n    * Configure `attribute mapping`\n    * Execute `account\
    \ synchronization`\n\n| ![](OEBPS/image_rsrc8PW.jpg) |\n| Figure 2-1 shows how\
    \ to implement requirement. |\n\n## 2.2 Create Admin Task\n\n`Admin tasks` are\
    \ the one of main feature. Almost of all requirements start from the admin tasks.\
    \ `Admin task` is an administrative function that a user can perform in `CA IdentityMinder`.\
    \ `Admin Tasks` can be `Create User`, `View User`, `Modify User`, `Reset User`,\
    \ etc. We can see admin tasks under menu `home` or `users > tasks`.\n\n| ![](OEBPS/image_rsrc8PX.jpg)\
    \ |\n| Figure 2-2 displays admin tasks in console |\n\nWe will start from create\
    \ `Admin Tasks`.\n\n* Log in `Admin Console`.\n* Click `Roles and Tasks > Admin\
    \ Tasks`.\n* Then select `Create a new Admin Task` and click `OK`\n\n| ![](OEBPS/image_rsrc8PY.jpg)\
    \ |\n| Figure 2-3 shows menu |When you select admin task, screen will display\
    \ 5 tabs (see below):\n\n1. `Profile tab` contains general information (`name`),\
    \ how to display in menu, what is primary object and action, when Synchronization\
    \ work and extension programming.\n2. `Search tab`, relates to primary object\
    \ in `profile tab`, how do you search primary object.\n3. `Tabs tab` used for\
    \ adding tab.\n4. `Fields tab` shows how many fields in this admin task. These\
    \ fields came from screens.\n5. `Events tab` shows how many events will be generated\
    \ after `submit admin tasks`.\n\n| ![](OEBPS/image_rsrc8PZ.jpg) |\n| Figure 2-4\
    \ shows 5 tabs when create admin task\n\n### 2.2.1 Profile Tab\n\nIn `profile\
