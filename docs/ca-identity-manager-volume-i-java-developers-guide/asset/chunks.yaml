    | Tab | Field Name | Value | Description |


    | General | Name | Approve | The Name field contains the name of the activity
    |


    | Resources | Assignment | External | The Resource page identifies resources (human
    or automated) that can perform the activity.For CA IdentityMinder, select External.
    See the picture below |


