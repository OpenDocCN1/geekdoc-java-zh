    \ inside account object (eTADAccount) because CA IdentityMinder keeps it as internal\
    \ process. It may useful for debug when you do programming and try to modify the\
    \ value and get error. You may print the value and put into Account object directly.\
    \ Let see it allowed or not.\n\nAnother choice to access Global user or account,\
    \ you use Provisioning Manager but you cannot see attribute name from screen.\n\
    \n### 2.3.3 Attribute mapping: User- Global User - Account\n\nTo understand better,\
    \ this section describes attribute mapping from user to global user and from global\
    \ user to account.\n\nUser Store\n\nCheck user store connectivity information\
    \ from Management Console, and login to User Store by any LDAP client such as\
    \ JXplorer.\n\n| ![](OEBPS/image_rsrc8S3.jpg) |\n\n| Figure 2.-37 shows user store\
    \ connectivity |\n\nWe can see attribute mapping: User attributes to Global user\
    \ attributes in Management Console. In the Management Console, select Environment\
    \ > your environment > Advanced Settings > Provisioning > Attribute Mappings\n\
    \n| ![](OEBPS/image_rsrc8S4.jpg) |\n\n| Figure 2-38 shows attribute mappings in\
    \ Management Console |\n\nThe picture below show how attribute city mapping from\
    \ user to account. The user’s attribute “l” map to Global user’s attribute “eTCity”\
    \ by Attribute Mappings in Management Console. The Global user’s attribute maps\
    \ to account by Account Template.\n\n| ![](OEBPS/image_rsrc8S5.jpg) |\n\n| Figure\
    \ 2-39 shows attribute mappings from user to account |\n\n### 2.3.4 Synchronization\n\
    \nWe learned how attribute mapping from user, the next thing we have to learn\
    \ when it works.\n\nWhen Global User created?\n\nGlobal user will be created when\
    \ user has provisioning role. If you just create user, Global user will not be\
    \ created.\n\n| ![](OEBPS/image_rsrc8S6.jpg) |\n\n| Figure 2-40 shows when global\
    \ user created |\n\nWhen attributes synchronization?\n\nIt will start synchronization,\
    \ if you select option “Account Synchronization” in admin task: on task complete\
    \ or on every event complete.\n\n| ![](OEBPS/image_rsrc8S7.jpg) |\n\n| Figure\
