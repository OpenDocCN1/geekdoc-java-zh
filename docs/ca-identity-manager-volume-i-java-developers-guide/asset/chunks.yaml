    | ![](OEBPS/image_rsrc8SY.jpg) |

    | Figure 2-60 shows form |


    ### 2.5.2 View Submitted Task


    View Submitted Task is very important for developer to understand CA IdentityMinder
    behavior. After admin task was submitted, you can go check status in View Submitted
    Task. Select tab “System”, select menu “View Submit Task” and select `Search`.


    | ![](OEBPS/image_rsrc8SZ.jpg) |

    | Figure 2-61 shows View Submitted Tasks screen |


    Find your summited task, it should be the latest one. And click icon `![](OEBPS/image_rsrc8T0.jpg)`
