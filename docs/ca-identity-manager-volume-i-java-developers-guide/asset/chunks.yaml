  trans: "\n\n# 4. 拷贝类（包含包文件夹 `com.book.idm.etc`）到文件夹 `\\<server>\\IdentityMinder.ear\\\
    custom`\n\n## 配置：管理控制台\n\n1. 在管理控制台中，点击`Environments`环境。\n2. 点击环境名称。\n3. 点击`Advanced\
    \ Settings`高级设置。\n4. 点击`Workflow Participant Resolvers`工作流参与者解析器。\n5. 点击`new`\
    \ 按钮并按表赋值：\n\n| 字段名称 | 值 | 说明 |\n| :--- | :--- | :--- |\n| Name | `MgrOfMgrParticipantResolver`\
    \ | 参与者解析器的名称 |\n| Class | `com.book.idm.etc.MgrOfMgrParticipantResolver` | 我们\
    \ Java 类名称 |\n\n## 配置：Identity Manager 用户控制台\n\n1. 以 `administrator` 登录 Identity\
    \ Manager 用户控制台。\n2. 搜索我们的管理员任务：`Update Location and Ext Number`。\n   * 请禁用业务逻辑任务处理器\
    \ `policy Xpress` 或上一个示例中的工作流。\n3. 选择标签页 `event` 并点击 `ModifyUserEvent`。\n4. 选择非策略策略的工作流：`singleStepApproval`。\n\
    \   * 对于主审批者：\n     * 审批任务下拉菜单，选择 `Approve Modify User`。\n     * 参与者解析器下拉菜单，选择\
    \ `Custom: MgrOfMgrParticipantResolver`。\n   * 对于默认审批者：\n     * 审批任务下拉菜单，选择 `Approve\
    \ Modify User`。\n     * 参与者解析器下拉菜单，选择您的 `administrator`。\n\n| ![](img/image_rsrc8XH.jpg)\
    \ |\n| :--- |\n| 图 6-2 显示了工作流配置 |\n\n## 工作原理\n\n你必须准备 3 个用户：`user A`、`user B`\
    \ 和 `user C`。登录用户数据存储并检查属性 `managerID`：\n* `User A` 的 `managerID` = `user B`\n\
    * `User B` 的 `managerID` = `user C`\n* `User C` 的 `managerID` = “”\n\n以 `administrator`\
    \ 登录 Identity Manager 用户控制台，选择标签页：`Book Example`。\n\n### 用例 1：修改用户 A，参与者是经理的经理\n\
    \n4. 选择管理员任务：`Update Location and Ext Number`，然后搜索并选择 `user A`。修改城市属性并提交管理员任务。\n\
    5. 以 `user C` 登录，你应该能看到审批请求。\n\n### 用例 2：修改用户 B，参与者是经理\n\n1. 再次选择管理员任务：`Update\
    \ Location and Ext Number` 并选择 `user B`。修改城市属性并提交管理员任务。\n2. 以 `user C` 登录，你应该能看到审批请求。\n\
    \n### 用例 3：修改用户 C，没有经理\n\n1. 再次选择管理员任务：`Update Location and Ext Number` 并选择 `user\
    \ C`。修改城市属性并提交管理员任务。\n2. 以 `administrator` 登录，你应该能看到审批请求。\n\n## 查找经理的经理\n\n我们使用\
    \ `ProviderAccess` 查找经理。获取用户，然后查找属性 `managerID`，通过 `managerID` 搜索经理，以此此类推，直到找到经理的经理。\n\
    \n```java\nString userId = ctx.getSubject().getFriendlyName();\nUser user = ctx.getUserProvider().findUser(userId,\
    \ null);\nString managerID = user.getAttribute(\"managerID\");\nUser managerUser\
    \ = ctx.getUserProvider().findUser(managerID, null);\nString mgrOfMgrID = managerUser.getAttribute(\"\
    managerID\");\nUser mgrOfMgrUser = ctx.getUserProvider().findUser(mgrOfMgrID,\
    \ null);\nresolver.add(mgrOfMgrUser);\n```\n\n## 添加参与者\n\n代码非常直观。我们创建一个 `Vector`\
    \ 对象并将作为参与者的 `User` 对象添加到该对象中。\n\n```java\nVector resolver = new Vector();\nresolver.add(mgrOfMgrUser);\n\
    ```\n\n## 没有经理的经理\n\n如果用户没有经理的经理，我们将返回经理。\n\n```java\nif(mgrOfMgrID == null ||\
    \ mgrOfMgrID.trim().length()==0){\n    System.out.println(userId+\" has only manager\
    \ \"+managerID);\n    resolvers.add(managerUser);\n    return resolvers;\n}\n\
    ```\n\n如果没有审批者，直接返回空 vector。\n\n### 6.1.3 用例示例\n\n在官方文档（Programming Guide for\
    \ Java > Workflow API > Participant Resolver API > Participant Resolver Overview\
    \ > Use Case Example）中提供了一个用例示例。\n\n### 将组的管理员分配为参与者\n\n每当用户被添加到组 `HR` 时，都需要工作流审批。`custom\
    \ participant resolver` 将该组的管理员分配为工作流活动中的参与者。当用户被添加到 `HR` 时，事件 `AddToGroupEvent`\
    \ 进入工作流控制范围，在指定的参与者批准活动之前，该活动无法成功完成。\n\n此工作流运行特定事件级别的 `AddToGroupEvent`。我们可以编写条件：如果组名等于“HR”，则返回审批者；如果组名不等于“HR”，则返回空\
    \ vector。\n\n```java\npublic Vector resolve(ParticipantResolverContext ctx, Hashtable\
    \ userData, String approvalNodeName) throws Exception {\n    Vector resolver =\
    \ new Vector();\n    AddToGroupEvent event = (AddToGroupEvent)ctx.getEvent();\n\
    \    String groupName = event.getGroup().getFriendlyName();\n    if(groupName.equals(\"\
    HR\")){\n        resolver = event.getGroup().getAdmins(null);\n    }\n    return\
    \ resolver;\n}\n```\n\n从事件中获取组。我们可以通过 `getAdmins()` 方法获取该组的管理员。更多详情请参 Java 文档。\n\
    \n## 6.2 事件监听器 API\n\n当 `CA IdentityMinder` 执行管理员任务时，它会将任务分解为各个组件事件。每个事件代表任务执行期间要执行的特定操作，例如，`CreateUserEvent`\
    \ 是添加新用户。\n\n事件监听器监听特定的事件或一组事件。当事件发生时，事件监听器会执行适用于该事件和当前事件状态的自定义业务逻辑。\n\n### 6.2.1\
    \ 编程\n\n对于事件监听器 API，你必须创建一个扩展 `EventListener` 的 `java class`。\n\n### 6.2.2 代码示例：事件监听器\n\
    \n我们的示例展示了监听器的生命周期。它使用标准输出。\n\n```java\npublic void before(EventContext ctx) {\n\
    \    // 在预审批期间执行自定义逻辑\n}\npublic void approved(EventContext ctx) {\n    // 在已批准状态下执行自定义逻辑\n\
    }\npublic void rejected(EventContext ctx) {\n    // 在已拒绝状态下执行自定义逻辑\n}\npublic\
    \ void after(EventContext ctx) {\n    // 在执行后执行自定义逻辑\n}\npublic void failed(EventContext\
    \ ctx) {\n    // 在执行状态后执行自定义逻辑\n}\n```\n\n每个方法返回 `EventListenerAdapter` 的常量；`BREAK`\
    \ 或 `CONTINUE`。一个事件可以有多个监听器。如果返回 `BREAK`，意味着不再处理当前状态的后续监听器。如果返回 `CONTINUE`，则意味着该事件监听器的处理完成。我的建议是始终返回\
    \ `CONTINUE`，这不会破坏未来的其他监听器。\n\n"
- fmt: "\n1. Log into the Identity Manager User Console as administrator.\n2. Select\
    \ tab: `Book Example`, and select menu `Update Location and Ext Number`.\n3. Select\
    \ Admin Task: `Update Location and Ext Number` from tab `Book Example`, Then search\
    \ some users. Modify city’s attribute and submit admin task. You can see message\
    \ in log file. The message does not appear immediately, you have to wait until\
    \ event start.\n\n```\n| 2013-10-27  INFO  [STDOUT] =============>LifeCycleEventListener:before\
    \ |\n```\n\n4. Log in as approver, you will see approve task and click approve.\
    \ Look at message in log file.\n\n```\n| 2013-10-27  INFO  [STDOUT] =============>LifeCycleEventListener:approved2013-10-27\
    \  INFO  [STDOUT] =============>LifeCycleEventListener:after |\n```\n\n## Listener\
    \ Level\n\nWe set listener level equal to `ModifyUserEvent`. It means our program\
    \ listen to only one event type: `ModifyUserEvent`. If we change listener level\
    \ as `User`, it means it listens to all events that relate to user.\n\n| ![](OEBPS/image_rsrc8XK.jpg)\
    \ |\n| Figure 6-4 shows event listener level configuration |\n\nIf you select\
    \ `*`, it means this listener will listen every events.\n\n### 6.2.3 Code Example:\
    \ Event Generating\n\nEvent generating is not feature of Listener, but it is feature\
    \ of context. Our example will show how to event generate new event; Add user\
    \ to group. This example code requires group named “IT”. If you do not have, you\
    \ can create new group or modify code to change group name.\n\nWe can generate\
    \ new event by `EventContext`. An `EventContext` can generate a secondary event\
    \ within the current task. The `EventContext` has method `generateEvent()`.\n\n\
    ```\n| void generateEvent(java.lang.String className,java.lang.Object primary,java.lang.Object\
    \ secondary,java.lang.String workflowID)throws java.lang.Exception\n```\n\nThe\
    \ first parameter `className` is the fully qualified name of the class to be instantiated\
    \ for the event being generated. Event classes are in the package `com.netegrity.ims.events`.\
    \ You can see details in java doc, but I suggest to see in management console\
    \ > Environments > Advance Settings > Event List. It is up to date.\n\n```\n|\
    \ ![](OEBPS/image_rsrc8XM.jpg) |\n| Figure 6-5 shows Event List |\n```\n\nThe\
    \ second and third parameters are `primary` and `secondary` object type, you can\
    \ see the picture above. The last parameter is `workflowID`. The name of the workflow\
    \ process (such as `SingleStepApproval`) map to the event being generated. If\
    \ you do not require any workflow, you just pass `null`.\n\nThis example shows\
    \ if city attribute == “new york”, then we will add user to group “IT”.\n\n####\
    \ Code\n\n1. Compile our java code: `com.book.idm.etc.NewYorkCityEventListener`\n\
    2. Copy class (include package folder `com.book.idm.etc` ) to folder `\\IdentityMinder.ear\\\
    custom`\n\n#### Configuration\n\n1. In the Management Console, click `Environments`.\n\
    2. Click the name of the environment where the event listener will be used.\n\
    3. Click `Advanced Settings`.\n4. Click `Event Listeners`.\n5. Click `new` button\
    \ and put value as the below table\n\n| Field Name | Value | Description |\n|\
    \ :--- | :--- | :--- |\n| Name | `NewYorkCityEventListener` | Name of event listener\
    \ |\n| Class | `com.book.idm.etc.NewYorkCityEventListener` | Name of java class\
    \ |\n| Listener Level | `ModifyUserEvent` | Event that class is listening to |\n\
    6. Click `Restart Environment`.\n\n#### Configuration: Identity Manager User Console\n\
    \n1. Log into the Identity Manager User Console as administrator.\n2. Check our\
    \ admin task name: `Update Location and Ext Number`:\n   * Remove all business\
    \ logic task handlers and policy Xpress.\n   * Remove workflow from previous example.\n\
    \n## How it works\n\nExecute admin task: `Update Location and Ext Number`.\n\n\
    1. Log into the Identity Manager User Console as administrator.\n2. Select Admin\
    \ Task: `Update Location and Ext Number` from tab `Book Example`, Then search\
    \ some users. Change city’s attribute to be “New York” and submit admin task.\n\
    3. Go to view submitted task, and select details. You will see event “Add user\
    \ to group”.\n\n```\n| ![](OEBPS/image_rsrc8XN.jpg) |\n| Figure 6-6 shows generated\
    \ event \"Add user to group\" |\n```\n\nYou can search group “IT” and see the\
    \ membership for checking the result.\n\n### Specific admin task\n\nWe specific\
    \ an event by configuration and admin task by code. We add condition to check\
    \ admin task tag.\n\n```\n| if(!\"BookBasicUpdateLocAndExtNo\".equalsIgnoreCase(evtCtx.getAdminTask().getTaskTag())){return\
    \ CONTINUE;} |\n```\n\n### Event generation\n\nThis code shows event generating:\
    \ `AddToGroupEvent`. We look up group `IT` and pass to method `generateEvent()`.\
    \ The result is user added to group `IT`.\n\n```\n| if(city.equalsIgnoreCase(\"\
    new york\")){Group group = evtCtx.getGroupProvider().findGroup(\"IT\",null);evtCtx.generateEvent(\"\
    com.netegrity.ims.events.AddToGroupEvent\",user,group, null);} |\n```\n\n### 6.2.4\
    \ Use Case Examples\n\nWe go through the code for all use case examples from official\
    \ document (Programming Guide for Java > Event Listener API > Event Listener API\
    \ Overview > Use Case Examples).\n\n#### Add a user to Microsoft Exchange (specific\
    \ event listener)\n\n| When a user is successfully added to the admin role Exchange,\
    \ CA IdentityMinder calls the `after()` method in an event listener associated\
    \ with the `AssignRoleEvent`. The implementation of the `after()` method uses\
    \ an Exchange API to add the user to the Exchange system. The information required\
    \ to access the Exchange server (`SERVER_NAME`, `ADMIN_ID`, `ADMIN_PASSWORD`,\
    \ and so on) is included in the user-defined properties of the CA IdentityMinder\
    \ environment. |\nIn the `init()` method of the `EventListenerAdapter`, you get\
    \ the user-defined properties. Please see the example code at the end of this\
    \ chapter.\n\n#### Create a rule for group assignments (specific event listener)\n\
    \n| When a user is created, CA IdentityMinder calls the `after()` method in an\
    \ event listener associated with the `CreateUserEvent`. The implementation of\
    \ the `after()` method evaluates user attributes such as `Job Title`, `Security\
    \ Level`, and `Department` to assign the user to one or more groups. For each\
    \ group assignment, the implementation generates the secondary event `AddToGroupEvent`.\
    \ This secondary event can be subject to workflow approvals and auditing. |\n\
    In this use case, you have to write condition by checking job title, etc. If it\
    \ is match, you can generate new event: `AddToGroupEvent`. It is same as our example:\
    \ event generation.\n\n#### Update an RDBMS with user data (class-level event\
    \ listener)\n\n| Suppose that user information such as `user ID`, `user name`,\
    \ `email address`, and `group membership` is stored in an RDBMS. Whenever any\
    \ user-level event occurs (`CreateUserEvent`, `ModifyUserEvent`, and so on), the\
    \ user’s record in the RDBMS must be updated. After the event is executed, CA\
    \ IdentityMinder calls the `after()` method in an event listener associated with\
    \ user events. The implementation of this method retrieves the RDBMS connectivity\
    \ parameters from the CA IdentityMinder environment passed into the `init()` method,\
    \ and then updates the user record in the RDBMS. |\nIn this use case, we implement\
    \ logic to update database in method `after()`. In configuration in management\
    \ console, we choose to listen to `user` level. It means java class will execute\
    \ on every events about users (`CreateUserEvent`, `ModifyUserEvent`, etc).\n\n\
    #### Post events to a JMS queue (all event listener)\n\n| After any event is successfully\
    \ executed, CA IdentityMinder calls the `after()` method in an event listener\
    \ associated with all events. This event listener writes all events to a specific\
    \ Java Message Service (JMS) queue. The Java Naming and Directory Interface (JNDI)\
    \ name for the queue and the information in the `jndi.properties` file is configurable\
    \ through the properties of the CA IdentityMinder environment. The `after()` method\
    \ implementation uses the JNDI information to post a simple object message to\
    \ the queue. |\n"
