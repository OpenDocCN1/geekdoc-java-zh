    ![](img/image_rsrc8PK.jpg)


    # 前言


    《CA IdentityMinder 第一卷：Java 开发者指南》将引导你通过 Java 编程来扩展 CA IdentityMinder 的功能。你将学习基础管理概念、CA
    IdentityMinder API、如何创建自定义工作流以及相关示例。


    我的《CA IdentityMinder（原 CA Identity Manager）编程》系列由三本书组成：


    * 《CA Identity Manager 第一卷：Java 开发者指南》，适用于入门级别。

    * 《CA Identity Manager 第二卷：通过示例代码学习》，适用于进阶水平。

    * 《CA Identity Manager：自定义连接器指南》，为自定义连接器开发者编写。


    请访问书籍网站获取更多详情。


    ## 关于本书


    你将学习到：


    * CA IdentityMinder 管理概念

    * CA IdentityMinder 编程概念

    * 如何开发业务逻辑任务处理程序（Business Logic Task Handler）及示例代码。

    * 如何创建自定义工作流及工作流 API 示例代码。

    * 如何实现参与者解析 API（Participant Resolver API）及示例代码。

    * 如何实现事件监听器 API（Event Listener API）及示例代码。

    * 如何实现逻辑属性 API（Logical Attribute API）及示例代码。

    * 如何实现验证规则（Validation Rules）及示例代码。

    * 如何实现电子邮件通知及示例代码。

    * 如何实现通知规则 API（Notification Rule API）及示例代码。

    * 如何实现任务执行 Web 服务（TEWS）及示例代码。


    ## 本书适用对象


    本书适用于具备少量 Java 编程基础，并希望学习如何通过 API 实现 CA IdentityMinder 要求的初。


    ![](img/image_rsrc8PM.jpg)


    ## 规范


    本文档使用了以下文本规范：


    | 规范 | 含义 |

    | :--- | :--- |

    | **粗体** | 粗体表示书名 |

    | *斜体* | 斜体表示强调或占位符变量 |

    | `等宽` | 等宽字体表示语言和语法元素 |


    ## 客户支持


    我们随时欢迎读者的反馈。请告诉我们你对这本书的看法。请访问网站获取更多详情：


    * 书籍网站：[`www.caidentitymanagerbook.com`](http://www.caidentitymanagerbook.com)

    * 博客及更新内容：[`caidentitymanager.blogspot.com`](http://caidentitymanager.blogspot.com)


    如需向我们发送普通反馈或问题，请直接发送电子邮件。请查看网站上的我的邮箱。


    ## 下载源代码


    请访问我们的网站：[`www.caidentitymanagerbook.com`](http://www.identitymanagerbook.com)


    ## 商标


    CA IdentityMinder、CA Identity Manager 和 CA SiteMinder 是 CA Technologies 的注册商标。


    | ![](img/image_rsrc8PN.jpg)请接受我的歉意：延迟：我原计划在 2013 年 9 月发布这本书，但推迟了近一年时间。语法错误：请对我的语法错误表示歉意。审核过程可能需要
    3 个月。希望我的下一次发布能解决这个问题。没有 Policy Xpress 策略：Policy Xpress 很容易学习。我们可能不需要入门级的书籍。示例：我知道有些示例可以通过
    Policy Xpress 实现，但我通过编程实现了所有示例，因为我想展示如何使用 API。没有基础级别说明：对于某些读者可能抱怨这本书不适合初学者，我深表歉意。我将通过添加额外章节和视频演示来修复。请访问我的博客。支持：我是一名全职程序员。我可能无法立即回复您的邮件。请留出
    24 小小时等待回复。我的时区是纽约 EST。此致，Kosakarika | | | 关于作者我是一名 Java 开发者，住在纽约。经验：

    * 前端：ExtJS, JQuery, 内容管理(WebSphere Portal) 以及 Portlet (WebSphere/Weblogic/SUN
    Portal)

    * SOA：Rule JBoss Drools/Guvnor, ESB(ServiceMix/Camel) 和 BPEL(WebSphere Process
    Server)

    * IDM 和 SSO：CA IdentityMinder, CA SiteMinder 以及 SUN Access Manager。

    * 实现过多线程、高并发实时经纪项目。


    * 认证：

    * Sun Certified Java Programmer 1.2

    * Sun Certified Business Component Developer 1.3

    * IBM Certified Developer - IBM WebSphere Portal Developer V6.1

    * IBM Certified Developer - Web Services Development for WebSphere V6.1

    * IBM System Administrator - WebSphere Application Server V6.1

    * IBM Enterprise Developer - IBM WebSphere Studio V5.0 | |


