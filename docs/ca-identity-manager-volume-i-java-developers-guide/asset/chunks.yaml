  raw: "A connector is the software interface to an endpoint. The Provisioning Server\
    \ uses the connector to communicate with the endpoint. It translates Provisioning\
    \ Server actions into changes on the endpoint, such as “Create a new email account\
    \ on a Microsoft Exchange endpoint.”             \n\nConnector Servers is a Server\
    \ component that manages connectors. There are two types of connector servers:\n\
    \n*   CA IAM Connector Server (CA IAM CS) manages connectors written in Java\n\
    \n*   C++ Connector Server (CCS) manages connectors written in C++\n\nConnectors\
    \ and Agents, some connectors require an agent on the systems they manage in order\
    \ to complete the communication cycle.\n\nConnector Xpress is CA IdentityMinder\
    \ utility for managing dynamic connectors, mapping dynamic connectors to endpoints,\
    \ and establishing routing rules for endpoints. You can use it to configure dynamic\
    \ connectors to allow provisioning and management of SQL databases and LDAP directories.\n\
    \nAdditional Components\n\nWorkPoint workflow engine and WorkPoint Designer are\
    \ installed automatically when you install CA IdentityMinder. These components\
    \ enable you to place a CA IdentityMinder task under workflow control, and to\
    \ modify existing workflow process definitions or create new definitions.\n\n\
    Provisioning Manager is a graphical interface to manage global user and provisioning\
    \ server options. You may also use the Provisioning Manager to manage endpoint\
    \ or account.\n\n## 1.5 Server Configuration\n\nThis book assumes you should have\
    \ already installed and configure:\n\n*   CA IdentityMinder and user store.\n\n\
    *   Provisioning Server, provisioning manager and provisioning directory.\n\n\
    *   Connector server\n\n*   Wokpoint designer\n\nMy suggestion is to configure\
    \ one endpoint Microsoft Active Directory, account template and provisioning role\
    \ is a plus. You should have some users and account in IDM system.\n\nUser Store\
    \ attributes\n\nIn this book, we require attribute City and telephone number as\
    \ the main, but other chapters require additional. We will create 3 admin tasks:\n\
    \n*   Update Location and Ext Number used in almost every chapter.\n\n    *  \
    \ Requires attribute:  L (or City)\n\n    *   Requires attribute:  telephoneNumber.\n\
    \n    *   In chapter 2, our policy Express example requires state.\n\n*   Update\
    \ office, used in chapter 6: Logical Attribute API only\n\n    *   Requires attribute:\
    \ L (or City same as previous)\n\n*   Update Employee Number used in chapter 6:\
    \ Validation Rule only\n\n    *   Requires attribute: employee number\n\nPlease\
    \ check the Management Console, select Directory > User Store (Cooperate Store)\
    \ > User and check attributes.\n\n| ![](OEBPS/image_rsrc8PT.jpg) |\n\n| Figure\
    \ 1-4 shows display name |\n\nGlobal user attributes\n\nIn the Management Console,\
    \ select Directory > Provisioning Store > Global User and check attribute, Physical\
    \ Name eTCity.\n\n| ![](OEBPS/image_rsrc8PU.jpg) |\n\n| Figure 1-5 shows display\
    \ name of eTCity |\n\nAttributes mapping\n\nIn the Management Console, select\
    \ Environment > your environment > Advanced Settings > Provisioning and check\
    \ attributes mapping: User Attribute l maps to Provisioning Attribute eTCity.\n\
    \n| ![](OEBPS/image_rsrc8PV.jpg) |\n\n| Figure 1-6 shows attribute mapping |\n\
    \n## 1.6 Conclusions\n\nWe introduced the benefit of custom code and server configuration.\
    \ The next chapter you will learn the basic concepts of CA IdentityMinder administration.\n\
    \n# Chapter 2 Administration Concepts\n\nIf you familiar with CA IdentityMinder,\
    \ you can pass this chapter quickly. This chapter, you will learn:\n\n*   How\
    \ to create admin task\n\n*   How provisioning works\n\n*   How Identity Policy\
    \ Set and Policy Xpress works\n\n*   Understand submitted task and events\n\n\
    It is difficult to explain all administration features in one chapter. We will\
    \ focus only some part that relate to programming.  If you are new to CA IdentityMinder,\
    \ you may easily to get lost because of many features. We will use admin task\
    \ as major topic.\n\n## 2.1 Requirement\n\nThis chapter, we will implement requirement\
    \ by administrator’s tools.\n\nRequirement\n\nOur requirement need screen to modify\
    \ city and extension telephone number. The requirements can be written as steps\
    \ below:\n\n*   Step1: log into the Identity Manager User Console as administrator,\
    \ and select form “Update location and Ext Number”\n\n    *   Select city from\
    \ dropdown\n\n    *   Put extension number\n\n    *   Click submit\n\n*   Step\
    \ 2:  System updates user attributes:\n\n    *   Update city attribute and set\
    \ country by city value.\n\n    *   Concatenate office number and extension number.\n\
    \n*   Step 3:  System updates account attributes; city and telephone number\n\n\
    Design\n\nWe will implement each requirement’s step by:\n\n*   Step 1: Provide\
    \ screen\n\n    *   Create admin tasks and screen with 2 attributes; city and\
    \ extension number\n\n*   Step 2: Processing\n\n    *   We use Policy Set maps\
    \ city to country.\n\n    *   We use Policy Xpress to concatenate office number\
    \ and extension number.\n\n*   Step 3: Provisioning\n\n    *   Configure attribute\
    \ mapping\n\n    *   Execute account synchronization\n\n| ![](OEBPS/image_rsrc8PW.jpg)\
    \ |\n\n| Figure 2-1 shows how to implement requirement. |\n\n## 2.2 Create Admin\
    \ Task\n\nAdmin tasks are the one of main feature. Almost of all requirements\
    \ start from the admin tasks. Admin task is an administrative function that a\
    \ user can perform in CA IdentityMinder.  Admin Tasks can be Create User, View\
    \ User, Modify User, Reset User Password, etc. We can see admin tasks under menu\
    \ home or users > tasks. \n\n| ![](OEBPS/image_rsrc8PX.jpg) |\n\n| Figure 2-2\
    \ displays admin tasks in console |\n\nWe will start from create Admin Tasks.\n\
    \n*   Log in Admin Console as administrator.\n\n*   Click tab Roles and Tasks\
    \ > Admin Tasks > Create Admin Task.\n\n*   Then select “Create a new Admin Task”\
    \ and click OK\n\n| ![](OEBPS/image_rsrc8PY.jpg) |\n\n| Figure 2-3 shows menu\
    \ create admin task |\n\nWhen you select create admin task, screen will display\
    \ in 5 tabs (see figure below):\n\n1.  Profile tab contains general information\
    \ (name), how to display in menu, what is primary object and action, when Synchronization\
    \ work and extension programming.\n\n2.  Search tab, relates to primary object\
    \ in profile tab; how do you search primary object.\n\n3.  Tabs tab used for adding\
    \ tab and screen.\n\n4.  Fields tab shows how many fields in this admin task.\
    \ These fields came from screens in tabs tab.\n\n5.  Events tab shows how many\
    \ events will be generated after submit admin tasks.\n\n| ![](OEBPS/image_rsrc8PZ.jpg)\
    \ |\n\n| Figure 2-4 shows 5 tabs when create admin task |\n\n### 2.2.1 Profile\
    \ Tab\n\nIn profile tab, there are 5 sections:\n\n1.  General Information\n\n\
    There are 3 fields\n\n| Field Name | Value | Description |\n\n| Name | Update\
    \ Location and Ext Number | Task name  will show on menu |\n\n| Tag | BookBasicUpdateLocAndExtNo\
    \ | It is unique value of the task. |\n\n| Description | Example for Basic Administrative\
    \ | It is description |\n\n| ![](OEBPS/image_rsrc8R0.jpg) |\n\n| Figure 2-5 shows\
    \ name on menu. |\n\n2.  How to display in menu?\n\nAdmin Task has screen, so\
    \ we have to decide where screen is.  There are 3 fields\n\n| Field Name | Value\
    \ | Description |\n\n| Task Order | 1 | Specifies the display order in menu.![](OEBPS/image_rsrc8R1.jpg)\
    \ |\n\n| Category | Book Example | Categories are displayed as tabs at the top\
    \ of the screen, order by number descending.![](OEBPS/image_rsrc8R2.jpg) |\n\n\
