    You can see details in java doc, but I suggest to see in management console >
    Environments > Advance Settings > Event List. It is up to date.


    | ![](OEBPS/image_rsrc8XM.jpg) |


    | Figure 6-5 shows Event List |


    The second and third parameters are primary and secondary object type, you can
    see the picture above. The last parameter is workflowID. The name of the workflow
    process (such as SingleStepApproval) map to the event being generated. If you
    do not require any workflow, you just pass null.


    This example shows if city attribute == “new york”, then we will add user to group
    “IT”.


    Code


    1.  Compile our java code: com.book.idm.etc.NewYorkCityEventListener


    2.  Copy class (include package folder ”com.book.idm.etc” ) to folder “\IdentityMinder.ear\custom”


    Configuration


    1.  In the Management Console, click Environments.


    2.  Click the name of the environment where the event listener will be used.


    3.  Click Advanced Settings.


    4.  Click Event Listeners.


    5.  Click new button and put value as the below table


    | Field Name | Value | Description |


    | Name | NewYorkCityEventListener | Name of event listener |


    | Class | com.book.idm.etc.NewYorkCityEventListener | Name of java class |


    | Listener Level | ModifyUserEvent | Event that class is listening to |


    6.  Click Restart Environment.


    Configuration: Identity Manager User Console


    1.  Log into the Identity Manager User Console as administrator.


    2.  Check our admin task name: Update Location and Ext Number:


    *   Remove all business logic task handlers and policy Xpress.


    *   Remove workflow from previous example.


    How it works


    Execute admin task: Update Location and Ext Number.


    1.  Log into the Identity Manager User Console as administrator.


    2.  Select Admin Task: “Update Location and Ext Number” from tab “Book Example”,
    Then search some users. Change city’s attribute to be “New York” and submit admin
    task.


    3.  Go to view submitted task, and select details. You will see event “Add user
    to group”.


    | ![](OEBPS/image_rsrc8XN.jpg) |


    | Figure 6-6 shows generated event "Add user to group" |


    You can search group “IT” and see the membership for checking the result.


    Specific admin task


    We specific an event by configuration and admin task by code. We add condition
    to check admin task tag.


    | if(!"BookBasicUpdateLocAndExtNo".equalsIgnoreCase(evtCtx.getAdminTask().getTaskTag())){return
    CONTINUE;} |


    Event generation


    This code shows event generating: AddToGroupEvent. We look up group IT and pass
    to method generateEvent(). The result is user added to group IT.


    | if(city.equalsIgnoreCase("new york")){Group group = evtCtx.getGroupProvider().findGroup("IT",null);evtCtx.generateEvent("com.netegrity.ims.events.AddToGroupEvent",user,group,
    null);} |


    ### 6.2.4 Use Case Examples


    We go through the code for all use case examples from official document (Programming
    Guide for Java > Event Listener API > Event Listener API Overview > Use Case Examples).


    Add a user to Microsoft Exchange (specific event listener)


    | When a user is successfully added to the admin role Exchange Users, CA IdentityMinder
    calls the method after() in an event listener associated with the event AssignAdminRoleEvent.
    The implementation of the after() method uses an Exchange API to add the user
    to the Exchange system. The information required to access the Exchange server
    (SERVER_NAME, ADMIN_ID, ADMIN_PASSWORD, and so on) is included in the user-defined
    properties of the CA IdentityMinder environment. CA IdentityMinder environment
    properties are passed to the init() method of the EventListenerAdapter. |


    This use case, you just override method after() and do programming to add user
    to Microsoft exchange. For init() method, you can get in the user-defined properties.
    Please see the example code at the end of this chapter.


    Create a rule for group assignments (specific event listener)


    | When a user is created, CA IdentityMinder calls the after() method in an event
    listener associated with the event CreateUserEvent. The implementation of the
    after() method evaluates user attributes such as Job Title, Security Level, and
    Department to assign the user to one or more groups. For each group assignment,
    the implementation generates the secondary event AddToGroupEvent. This secondary
    event can be subject to workflow approvals and auditing. |


    This use case you have to write condition by checking job title, etc. If it is
    match, you can generate new event: AddToGroupEvent. It is same as our example:
    event generation.


    Update an RDBMS with user data (class-level event listener)


    | Suppose that user information such as user ID, user name, email address, and
    group membership is stored in an RDBMS. Whenever any user-level event occurs (CreateUserEvent,
    ModifyUserEvent, and so on), the user’s record in the RDBMS must be updated. After
    the event is executed, CA IdentityMinder calls the method after() in an event
    listener associated with user events. The implementation of this method retrieves
    the RDBMS connectivity parameters from the CA IdentityMinder environment properties
    passed into the init() method, and then updates the user record in the RDBMS.
    |


    This use case, we implement logic to update database in method after(). In configuration
    in management console, we choose listen to “user” level. It means java class will
    execute on every events about users. (CreateUserEvent, ModifyUserEvent, etc)


    Post events to a JMS queue (all event listener)


    | After any event is successfully executed, CA IdentityMinder calls the method
    after() in an event listener associated with all events. This event listener writes
    all events to a specific Java Message Service (JMS) queue. The Java Naming and
    Directory Interface (JNDI) name for the queue and the information in the jndi.properties
    file is configurable through the properties of the CA IdentityMinder environment.
    The after() method implementation uses the JNDI information to post a simple object
    message to the queue. |'
