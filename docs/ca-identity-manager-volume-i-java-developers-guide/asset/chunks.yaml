  trans: "\n\n3. 选择管理员任务：“更新位置和分机（Update Location and Ext Number）”。\n\n4. 搜索并选择某些用户。\n\
    \n5. 修改城市属性（必须修改城市值）并在电话分机号中输入值“xxxxxx”。提交管理员任务。\n\n| ![](img/image_rsrc8U6.jpg)\
    \ |\n| 图 4-16 显示了我们任务的值 |\n\n## 使用 ProviderAccessor\n\n使用 `providerAccessor` 意味着\
    \ `ProviderAccessor` 的任何方法都是 `BLTHContext` 的父类。例如：`getUserProvider()`、`getGroupProvider()`\
    \ 等。方法名将以单词 `provider` 结尾。每个托管对象类型（如 `User`、`Group` 和 `Organization`）都与一个程序对象关联，您使用它来访问托管对象的数据。\n\
    \n```java\nUser user = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null);\n```\n\n`BLTHContext` 有父接口：`ProviderAccessor`。当我们调用 `getUserProvider`\
    \ 时，它返回 `UserProvider`。`UserProvider` 拥有方法 `findUser()`。\n\n```java\nfindUser(TSContext\
    \ context, java.lang.String name, AttributeRightsCollection attributes)\n```\n\
    \n此方法需要 3 个参数：\n\n*   `context`: 当前任务会话的上下文。我们的代码使用了 `BLTHContext`。\n*   `name`:\
    \ 要检索的用户名。该名称可以是唯一名称，也可以是友好名称。我们的代码使用了用户的唯一名称。\n\n```java\n// 从 taskString 获取唯一名称\
    \ \nuserid = blthContext.getUser().getUniqueName();\n```\n\n*   `attributes`:\
    \ `AttributeRight` 对象的集合，每个对象包含一个属性名称和权限请求。我们的代码传递了空值。\n\n我们从 `ProviderAccessor`\
    \ 获取用户对象。我们可以修改电话号码属性。该属性名称与用户存储中物理属性的名称相同。\n\n```java\nuser.setAttribute(\"telephoneNumber\"\
    , \"212-222-2222x1234\");user.modifyObject();\n```\n\n我们通过 `ProviderAccessor`\
    \ 修改托管对象时，更改的是对象的本地（内存中）表示。要将更改持久化到数据存储中，我们需要调用 `modifyObject()`。更改将直接应用于数据存储。此时不会生成\
    \ Identity Manager 事件，也不会执行工作流审批、审计或安全检查。\n\n## 在用户存储中检查结果\n\n我们做了两件事：更改城市属性以及我们的\
    \ Java 代码使用 `AccessProvider` 修改了电话号码。使用 LDAP 客户端连接用户存储，我们将看到电话号码值已经更改。\n\n| ![](img/image_rsrc8U7.jpg)\
    \ |\n| 图 4-17 显示电话号码属性已更改 |\n\n## 在已提交任务屏幕中检查结果\n\n选择菜单：查看提交的任务（view submitted\
    \ task），在标签页下：系统（system）。选择我们的任务，你将看到内部的事件。\n\n| ![](img/image_rsrc8U8.jpg) |\n\
    | 图 4-18 显示所有事件 |\n\n点击 `Modify User` 事件查看属性更改：\n\n*   城市属性来自屏幕，用于修改用户存储中的值。\n\
    *   电话号码，我们使用 `ProviderAccessor` 修改的。因此，`Modify User` 事件中的属性发生了变化，我们看不到来自 `ProviderAccessor`\
    \ 的值，而只能看到来自屏幕的值。\n\n| ![](img/image_rsrc8U9.jpg) |\n| 图 4-19 显示提交后属性的更改 |\n\n\
    ## 修改的顺序\n\n现在有两个属性需要配置（provisioning）：城市和电话号码：\n\n*   城市值来自屏幕。\n*   电话号码值来自 `ProviderAccessor`。\n\
    \    *   在屏幕上，我们输入了值“xxxxxx”。\n    *   最终结果是“212-222-2222x1234”。\n\n如果你的环境配置了配置和\
    \ Active Directory（AD）账户，你将看到端点中的电话属性为“212-222-2222x1234”。\n\n| ![](img/image_rsrc8UA.jpg)\
    \ |\n| 图 4-20 电话号码已配置到端点 |\n\n我们可以逐步解释为如下：\n\n*   步骤 1：当用户提交管理员任务时，执行 `handleSubmission()`\
    \ 方法。当调用 `modifyObject()` 方法时，电话号码将完成提交。\n*   步骤 2：已生成 `modify user` 事件。当 `modify\
    \ user` 事件完成时，CA IdentityMinder 将提交城市值。\n*   步骤 3：`Synchronize User` 事件，与此无关。它将触发\
    \ `Policy Set`。\n*   步骤 4：`Synchronize User Attribute with Account` 将从配置目录并将属性配置到端点。\n\
    \n| ![](img/image_rsrc8UB.jpg) |\n| 图 4-21 显示配置的步骤 |\n\n### 4.4.4 BLTHContext\
    \ 和 ProviderAccessor\n\n这个例子是一个为了更好地理解 `BLTHContext` 和 `ProviderAccessor` 的实验。我们将尝试同时使用这两个\
    \ API 更新城市和电话属性。让我们看看发生了什么。\n\n### 代码\n\n1.  编译我们的 Java 代码：`com.book.idm.blth.ModifyUserByBoth`\n\
    2.  将类（包括包文件夹 `com.book.idm.blth`）复制到文件夹 `\\IdentityMinder.ear\\custom`。\n\n###\
    \ 配置\n\n1.  以管理员身份登录 Identity Manager 用户控制台。\n2.  选择标签 `Roles and Tasks`（角色与任务），选择菜单\
    \ `modify admin task`（修改管理员任务）。\n3.  搜索并选择我们的管理员任务名称：`Update Location and Ext\
    \ Number`。\n4.  点击按钮 `Business Logic Task Handlers`（业务逻辑任务处理器），然后点击图标 `pencil`（铅笔）。\n\
    5.  按如下所示修改值。\n\n| 字段名称 | 值 | 说明 |\n| :--- | :--- | :--- |\n| Java Class | `com.book.idm.blth.ModifyUserByBoth`\
    \ | 我们放在 custom 文件夹中的 Java 类 |\n\n我们可以通过以下步骤通过管理员任务执行我们的代码：\n\n1.  以管理员身份登录 Identity\
    \ Manager 用户控制台。\n2.  选择标签页：`Book Example` 并选择菜单：`Basic`。\n3.  选择管理员任务：“Update\
    \ Location and Ext Number”。\n4.  然后搜索并选择某些用户。\n\n## 使用 BLTHContext 修改属性\n\n让我们看看代码在\
    \ `handleSubmission()` 方法中的第一个版本。我们注释了所有关于 `ProviderAccessor` 的内容。\n\n```java\n\
    //Using BLTHConext\nUser user1 = blthContext.getUser();\nuser1.setAttribute(\"\
    l\", \"New City\");\nuser1.setAttribute(\"telephoneNumber\", \"111111\");\n//Using\
    \ ProviderAccessor\n```\n\n```java\n//Using BLTHConext\nUser user1 = blthContext.getUser();\n\
    user1.setAttribute(\"l\", \"New City\");\nuser1.setAttribute(\"telephoneNumber\"\
    , \"111111\");\n//Using ProviderAccessor\n/*\nString userid = user1.getUniqueName();\n\
    User user2 = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null);\nuser2.setAttribute(\"l\", \"New Town\");\nuser2.setAttribute(\"\
    telephoneNumber\", \"2222222\");\nuser2.modifyObject();\n*/\n```\n\n执行管理员任务：`Update\
    \ Location and Ext Number`。我们将得到电话属性错误。\n\n| ![](img/image_rsrc8UC.jpg) |\n| 图\
    \ 4-22 显示了错误 |\n\n我们得到了关于 `telephoneNumber` 的错误。当你使用 `BLTHContext` 修改属性时，你必须关注管理员任务中定义的字段。\n\
    \n| ![](img/image_rsrc8UD.jpg) |\n| 图 4-23 显示管理员任务中定义的所有属性 |\n\n`BLTHContext`\
    \ 可以修改管理员任务中定义的任何属性。如果你尝试修改范围之外的任何属性（例如：电话号码），将得到异常。\n\n## 使用 ProviderAccessor\
    \ 修改属性\n\n在我们代码的下一个版本中，我们注释了问题的行（修改电话号码）并取消了 `ProviderAccessor` 部分。编译并部署到服务器。\n\
    \n```java\npublic void handleSubmission(BLTHContext blthContext) throws Exception\
    \ {\nUsing BLTHConext\nUser user1 = blthContext.getUser();\nuser1.setAttribute(\"\
    l\", \"New City\");\n//user1.setAttribute(\"telephoneNumber\", \"111111\");\n\
    //Using ProviderAccessor\nString userid = user1.getUniqueName();\nUser user2 =\
    \ blthContext.getUserProvider().findUser(blthContext.getTSContext(), userid, null);\n\
    user2.setAttribute(\"l\", \"New Town\");\nuser2.setAttribute(\"telephoneNumber\"\
    , \"2222222\");\nuser2.modifyObject();\n}\n```\n\n再次执行管理员任务并查看结果。在屏幕上，我们选择了城市值：Toronto。\n\
    \n| ![](img/image_rsrc8UE.jpg) |\n| 图 4-24 我们更改城市值为 Toronto |\n\n现在我们有三个地方设置了城市属性：\n\
    \n1.  屏幕上设置为“Toronto”。\n2.  `BLTHContext` 修改城市值为“New City”。\n3.  `ProviderAccessor`\
    \ 修改城市值为“New Town”。\n\n哪一个是获胜者？最终结果是：\n\n*   城市是“New City”\n*   电话号码是“2222222”\n\
    \n| ![](img/image_rsrc8UF.jpg) |\n| 图 4-25 显示了最终结果 |\n\n我们可以逐步看到：\n\n*   步骤 1：用户输入城市属性值为“Toronto”。\n\
    *   步骤 2：`BLTHContext` 覆盖城市属性值为“New City”但未提交。\n\n"
- fmt: "\n*   Step 3: `ProviderAccessor` commit city attribute value as “New Town”.\
    \ Now city attribute has been already change to be “New Town”\n*   Step 4: When\
    \ modify `User` event complete, `CA IdentityMinder` commit the city attribute\
    \ value from task that has been modify by `BLTHContext`.\n\nStep 1 – 3 are occurred\
    \ in synchronous phase. Step 2 and 3 are occurred by business logic task handler.\
    \ The step 4 is asynchronous phase.\n\n| ![](OEBPS/image_rsrc8UG.jpg) |\n| :---\
    \ |\n| Figure 4-26 shows sequence of modification |\n\n### 4.4.5 Business Logic\
    \ Task Handler and screen\n\nIn this example, we will do programming to get data\
    \ from admin task’s screen. This example shows:\n\n*   How to get current extension\
    \ telephone number and display on screen.\n*   Validate user input. The extension\
    \ telephone number must be present and be number only.\n*   Shows how to send\
    \ error message back to user.\n*   Using session attribute to share the extension\
    \ telephone number between methods.\n\n#### Code\n\n1. Compile our java code:\
    \ `com.book.idm.blth.ModifyUserAndScreen`\n2. Copy class (include package folder\
    \ `com.book.idm.blth` ) to folder `\\IdentityMinder.ear\\custom`.\n\n#### Configuration\n\
    \n1. Log into the `Identity Manager User Console` as administrator.\n2. Select\
    \ tab `Roles` and `Tasks`, and select menu `modify admin task`.\n3. Search and\
    \ select our admin task name: `Update Location and Ext Number`\n4. Click button\
    \ `Business Logic Task Handlers`, then icon `pencil`.\n5. Modify value as below.\n\
    \n| Field Name | Value | Description |\n| :--- | :--- | :--- |\n| Java Class |\
    \ `com.book.idm.blth.ModifyUserAndScreen` | Our java class that we put in custom\
    \ folder |\n\n#### How it works\n\nWe can execute our code by admin task following\
    \ these steps:\n\n1. Log into the `Identity Manager User Console` as administrator.\n\
    2. Select tab: `Book Example` and select menu: `Basic`.\n3. Select Admin Task:\
    \ `Update Location and Ext Number`.\n4. Then search and select some users.\n\n\
    #### handleSetSubject(): display the current telephone number on screen\n\nThe\
    \ method `handleSetSubject()` is called, when screen initial display. So we implement\
    \ to set the show extension number inside this method.\n\n| ![](OEBPS/image_rsrc8UH.jpg)\
    \ |\n| :--- |\n| Figure 4-27 the current value of extension number has been show\
    \ on screen |\n\nSetting extension number, we have to do 2 things:\n\n*   Get\
    \ current telephone number\n*   Set the value of screen logical attribute: `|ExtNumber|`\n\
    \nGetting the current telephone number is not new, we use the `ProviderAccessor`\
    \ get the value.\n\n```java\nString userid = blthContext.getUser().getUniqueName();\n\
    User user = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null);\nString telephoneNumber = (String)user.getAttribute(\"telephoneNumber\"\
    );\n```\n\nPlease imagine the screen of admin task. When we define the admin task:\n\
    \n*   Inside of admin task, we have tabs.\n*   In our admin task has one profile\
    \ tab.\n*   Inside of tab, we have a screen.\n*   Inside of screen, we have fields.\n\
    \n| ![](OEBPS/image_rsrc8UJ.jpg) |\n| :--- |\n| Figure 4-28 shows tab screen in\
    \ admin task configuration |\n\nInside of admin task, we have tabs. We call method\
    \ `getTaskTabHandlers()` return all tabs of this admin task.\n\n```java\nVector<TabHandler>\
    \ tabs = blthContext.getTaskTabHandlers();\nfor (TabHandler tab : tabs) {\n```\n\
    \nIn our admin task has one profile tab, so we have to check type of `ProfileTabHandler`.\
    \ If you have many profile tabs, you need condition to check screen’s tag name.\
    \ We check screen’s tag name `BookBasicUpdateLocationAndExtNo`. (In our example\
    \ has only one tab, you can skip this condition)\n\n```java\n// Check tab type\n\
    if (tab instanceof ProfileTabHandler) {\n    ProfileTabHandler profileTab = (ProfileTabHandler)\
    \ tab;\n    String screenName = profileTab.getScreenHandler().getScreen().getTag();\n\
    \    if(screenName.equals(\"BookBasicUpdateLocationAndExtNo\")){\n```\n\nWe can\
    \ set the value on screen by using method `updateRawData()`.\n\n```java\nHashMap<String,\
    \ String> data = new HashMap<String, String>();\ndata.put(\"|ExtNumber|\", telephoneNumber.substring(telephoneNumber.indexOf(\"\
    x\") + 1));\n...profileTab.updateRawData(data);\n```\n\nInside of screen, we have\
    \ fields. We create new `HashMap` object. We put key and value pair, key’s name\
    \ `|ExtNumber|` came from the screen definition in admin task. If you want to\
    \ set city attribute, you can use attribute name same as user store. The city’s\
    \ attribute uses “l” as key.\n\n#### handleValidation (): validate user input\n\
    \nAfter user submit the admin task, if extension number is blank or put some characters,\
    \ the error will be display.\n\n| ![](OEBPS/image_rsrc8UK.jpg) |\n| :--- |\n|\
    \ Figure 4-29 shows error messages |\n\nWe have to override method `handleValidation()`.\
    \ We can get any fields from screen by method `getRawData()`. If you are not sure\
    \ about fields’ name, you can print by method `getRawData()`. It is a `HashMap`\
    \ object that key represent by field’s name.\n\n```java\nString extNumber = (String)\
    \ profileTab.getRawData().get(\"|ExtNumber|\");\n```\n\nYou can get values from\
    \ screen and perform the validation logic as code.\n\n```java\nString extNumber\
    \ = (String) profileTab.getRawData().get(\"|ExtNumber|\");\nif (extNumber == null)\
    \ {\n} else {\n    try {\n        int number = new Integer(extNumber);\n    }\
    \ catch (NumberFormatException ne) {\n    }\n}\n```\n\n#### Shows the error message\n\
    \nWe show error by throwing `IMSException` object. You can put message on screen\
    \ by method `addUserMessage()`.\n\n```java\nIMSException imsEx = new IMSException();\n\
    imsEx.addUserMessage(\"Telephone number can't empty\");\nthrow imsEx;\n```\n\n\
    #### Session attributes: pass the value between methods\n\nWe have already validated\
    \ telephone number and we can pass the valid value to method `handleSubmission()`\
    \ by session. `BLTHContext` provide session attribute for sharing data between\
    \ method and other `IdentityMinder` APIs.\n\n```java\npublic void handleValidation(BLTHContext\
    \ blthContext) throws Exception {\n    // Setting value to session\n    blthContext.setSessionAttribute(\"\
    extNumber\", number);\n}\n\npublic void handleSubmission(BLTHContext blthContext)\
    \ throws Exception {\n    // Getting value from session\n    int extNumber = (Integer)\
    \ blthContext.getSessionAttribute(\"extNumber\");\n}\n```\n\n### 4.5 Use cases\
    \ examples\n\nThe official `CA IdentityMinder` document gave use cases examples\
    \ but not provide detail of programming. This section will give you some idea\
    \ of those examples.\n\nPlease see full description from `Programming Guides ›\
    \ Programming Guide for Java › Business Logic Handler API › Business Logic Handler\
    \ API Overview › Use Case Examples`.\n\n#### Check whether a group membership\
    \ limit is reached\n\nWhen an administrator attempts to add a member to a group\
    \ by submitting a `Modify Group` task for execution, access the `Group` managed\
    \ object to determine the number of current members. If the group has the maximum\
    \ number of members, throw an exception.\n\nThe modify group task, we can use\
    \ `BLTHContext.getGroup()`. We call method `getMembers()` return all members inside\
    \ group. We can check size.\n\n```java\nVector users = blthContext.getGroup().getMembers(ObjectType.USER,\
    \ null);\nSystem.out.println(\"user size : \"+users.size());\n```\n\nPlease note,\
    \ the `Group` class has method `getUsers()` and `getMembers()`:\n\n*   Method\
    \ `getUsers()` return only user object\n*   Method `getMembers()` can return any\
    \ object depending parameters: `ObjectType`. Please see java document: `ObjectType`\
    \ for details.\n\n#### Verify the job title of a new administrator\n\nWhen a user\
    \ submits a `Create Administrator` task for execution, access a third-party database\
    \ to determine the job title of the administrator being created. If this particular\
    \ person does not have the job title `Supervisor` (the only job title authorized\
    \ to be an administrator), throw an exception.\n\nWe can write java code access\
    \ the database in `handleSubmission()`. You pass administrator id as argument\
    \ and get job title.\n\n```java\n//Get administrator who is executing the task\n\
    User admin = blthContext.getAdministrator();\n//Call the third party to get title\n\
    String jobTitle = callDB(admin.getFriendlyName());\n```\n\nCheck for duplicate\
    \ objects\n"
