    \ scope (for example: telephone number), you will get exception.\n\nModify attributes\
    \ by using ProviderAccessor\n\nThe next version of our code, we comment the problem\
    \ line (modify telephone number) and uncomment ProviderAccessor part. Compile\
    \ and deploy code to server.\n\n| public void handleSubmission(BLTHContext blthContext)\
    \ throws Exception {//Using BLTHConextUser user1 = blthContext.getUser();user1.setAttribute(\"\
    l\", \"New City\");//user1.setAttribute(\"telephoneNumber\", \"1111111\");//Using\
    \ ProviderAccessorString userid = user1.getUniqueName();User user2 = blthContext.getUserProvider().findUser(      blthContext.getTSContext(),\
    \ userid, null);user2.setAttribute(\"l\", \"New Town\");user2.setAttribute(\"\
    telephoneNumber\", \"2222222\");user2.modifyObject();} |\n\nExecute our admin\
    \ task again and see the result. On the screen, we select city value as: Toronto.\n\
    \n| ![](OEBPS/image_rsrc8UE.jpg) |\n\n| Figure 4-24 we change city value as Toronto\
    \ |\n\nNow we have 3 places set one city attribute:\n\n1.  On screen set value\
    \ as“Toronto”.\n\n2.  BLTHContext modify city value as “New City”.\n\n3.  ProviderAccessor\
    \ modify city value as “New Town”.\n\nWhich one is the winner? The final result\
    \ is:\n\n*   City is “New City”\n\n*   Telephone Number is “2222222”\n\n| ![](OEBPS/image_rsrc8UF.jpg)\
    \ |\n\n| Figure 4-25 shows the final result |\n\nWe can see step by steps:\n\n\
    *   Step 1: User entry city attribute value as “Toronto”.\n\n*   Step 2: BLTHContext\
    \ override city attribute value as “New City” but not commit."
