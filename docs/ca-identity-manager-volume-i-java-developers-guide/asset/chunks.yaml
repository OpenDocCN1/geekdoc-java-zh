    ### 5.1.2 Workpoint Designer Concept


    The workflows inside of CA IdentityMinder are created by tools WorkPoint Designer.
    WorkPoint Designer is 3rd party software and integrated with CA IdentityMinder.
    You can run Workpoint Designer by command in <admin_tools>\WorkPoint\bin\Designer.bat


    | ![](OEBPS/image_rsrc8V0.jpg) |


    | Figure 5-12 shows starter screen of Workpoint Designer |


    You have to check configuration file “workpoint-client.properties”. The file is
    located in folder <admin_tools>\WorkPoint\conf. The J2EE Client Configuration
    must match with your application server.


    Processes vs. Jobs


    Process and Job is technical term of Workpoint.


    *   Processes are a function that a business conducts and normally repeats.


    *   Jobs are the process instance.


    For example, if the Process is a plan for an order fulfillment process, the specific
    cases (or Jobs) are the actual orders. Process looks like a Class in java and
    job is an object or instance of java class.


    Processes


    Run Workpint Designer, select “Open Process” from menu. Double click on process
    named “SingleStateApproval”, you will see the process.             


    | ![](OEBPS/image_rsrc8V1.jpg) |


    | Figure 5-13 shows processes “SingleStateApproval” |


    Jobs


    Select “Open Job” from menu. Double click on process named “SingleStateApproval”
    you will see the jobs of this process. (If you executed some admin task that contains
    workflow SingleStateApproval) You can see the current status of job date created,
    date started. Select one of them.


    | ![](OEBPS/image_rsrc8V2.jpg) |


    | Figure 5-14 shows job |


    The selected nodes appear as blue color; in picture is node “Approval” and node
    “IM Reject”. The selected line paths appear as green line.


    Using Help


    Click menu “Help”, help contents will display as pop up. You can select topic
    “process definition” and “job definition”.  It shows “What is a Process?” and
    “What is a Job?”


    | ![](OEBPS/image_rsrc8V3.jpg) |


    | Figure 5-15 shows help of Workpoint Designer |


    Another Workpoint document located in <admin_tools>\Workpoint\docs.


    ## 5.2 Custom Workflow


    The official CA IdentityMinder documents do not tell exactly how to create custom
    workflow step by steps. The all the rest of this chapter will show how to create
    custom workflow.


    Why we need custom workflow?


    The first reason, the default template workflows do not fit our requirements.
    For example, you may want 3 approvers, the default supports up to 2 approvers.


    The second reason, we need integration with other systems or perform some business
    logic during workflow process. For example:


    *   During workflow, we need to call web services.


    *   If user’s location is North America, it requires second approver. We have
    to create routing path to check user’s location.


    This section contains 2 parts.


    *   Workflow for CA IdentityMinder, you will learn the rule of workflow that relates
    to CA IdentityMinder. 


    *   Workpoint Programming, we introduce some Workpoint API features.


    ### 5.2.1 Workflow and CA IdentityMinder


    When you create workflow for CA IdentityMinder, you have to follow these rules:


    Rule 1: Must start with a node “Start” and end with a node “Stop”


    It makes sense rule, workflow must have start and end point. In Workpoint designer,
    you drag node from menu.


    | ![](OEBPS/image_rsrc8V4.jpg) |


    | Figure 5-16 shows Start and Stop node in Workpoint Designer |


    Rule 2: Must have Node “Approve” or “Reject” before go to Node “Stop”


    Any workflow, you need to set state to be “Approve” or “Reject” before complete
    workflow. We need to tell the final result to CA IdentityMinder, it is approved
    or rejected.


    Drag automate node and set configuration:  (You will see details in example code,
    do not worry)


    *   In the resources tab: select external


    *   In the agents tab, for approve state, select “Notify IM Approver” and for
    reject state, select “Notify IM Reject”


    | ![](OEBPS/image_rsrc8V5.jpg) |


    | Figure 5-17 shows Approve and Reject state before Stop |


    Workflow does not always require both approve and reject but workflow must have
    at least one approve node before node stop. (The work flow has only one reject
    node does not make sense)


    Rule 3: Approver Configuration (If you require approver)'
