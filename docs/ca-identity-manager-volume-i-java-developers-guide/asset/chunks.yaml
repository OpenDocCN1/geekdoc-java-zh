  trans: "\n\n# 配置：身份管理器用户控制台\n\n1. 以管理员身份登录身份管理器用户控制台。\n2. 选择 `Roles`（角色）和 `Tasks`（任务）选项卡，选择菜单\
    \ `create admin task`（创建管理员任务）。\n3. 创建 `admin task`，输入如下值：\n\n| 字段名称 | 值 | 描述\
    \ |\n| :--- | :--- | :--- |\n| **Tab: Profile（标签页：配置）** | | |\n| Name | Update\
    \ Employee Number | 管理员任务名称 |\n| Tag | BookBasicUpdateEmployeeNumber | 管理员任务标签名称\
    \ |\n| Description | Example for Validation | 任务描述 |\n| Category | Book Example\
    \ | 任务显示的位置。 |\n| Category Order | 11 | |\n| Category 2 | Task | |\n| Category\
    \ 3 | Basic | |\n| Primary Object | User | 我们想更新员工编号，因此必须选择对象 user（用户）和操作 modify（修改）。\
    \ |\n| Action | Modify | |\n| | | 为了测试，你可以禁用某些值。<br>* `User Synchronization` 和\
    \ `Account Synchronization`: 关闭。<br>* `Enable Auditing`, `Enable Workflow`, `Enable\
    \ Web Services`: 取消勾选 |\n| **Tab: Search（标签页：搜索）** | | |\n| Search Screen | Default\
    \ User Search | 搜索用户的界面 |\n\n4. 对于 **Tab: Tabs（标签页：标签）**：\n   - 选择标准标签控制器。\n \
    \  - 从列表中选择 `Profile(UserProfile)`，并点击符号 `+`。\n   - 点击屏幕文本字段处的浏览按钮。\n   - 点击 `new`\
    \ 按钮创建新界面，并选择标准配置配置界面。\n   - 输入值：\n     - `Name`: `Update Employee Number`\n \
    \    - `Tag`: `BookBasicUpdateEmployeeNumber`\n   - 添加属性：`Employee Number`\n \
    \    - `Attribute Name`: `Employee Number`\n     - `Style`: `Text`\n     - `Name`:\
    \ `Employee Number`\n     - `Validation Java Class`: `com.book.idm.etc.EmployeeNumberTaskValidator`\n\
    \   - 点击 `apply` 按钮完成。\n   - 点击 `ok`\n\n!![](img/image_rsrc8XY.jpg)\n图 6-15 显示了员工编号属性的配置\n\
    \n5. 提交完成任务创建。\n\n## 将任务添加到管理员角色\n\n1. 选择选项卡：`Roles` 和 `Tasks`，选择菜单 `modify admin\
    \ role`。\n2. 选择角色 `system manager`。\n   - 选择选项卡：`task`\n   - 按分类过滤：`Book Example`\n\
    \   - 选择添加任务：`Update Employee Number`\n3. 点击 `submit` 完成管理员角色的修改。\n\n## 工作原理\n\
    \n执行管理员任务：`Update employee number`。\n\n1. 以管理员身份登录身份管理器用户控制台。\n2. 选择选项卡：`Book\
    \ Example`，选择菜单 `update employee number`。\n3. 搜索一个用户，屏幕将显示员工编号的文本字段。\n4. 修改员工编号属性，并点击\
    \ `submit`。\n\n## 方法 `validate()`\n\n有 2 种错误情况：\n* 输入了 5 位员工编号。\n\n!![](img/image_rsrc8XZ.jpg)\n\
    图 6-16 显示了通过返回值的错误\n\n* 输入了任意字符。\n\n!![](img/image_rsrc8Y0.jpg)\n图 6-17 显示了通过异常的错误\n\
    \n有 2 种返回错误消息的方法，你可以选择一种：\n* 返回 `false` 并通过 `errorMsg.reference` 设置消息。\n```\n\
    if(attrValue.trim().length()>4){errorMsg.reference = \"Employeer Number can not\
    \ more than 4 digits\";return false;}\n```\n* 抛出异常并将消息作为参数。\n```\ntry{...int employeeNo\
    \ = new Integer(attrValue);...}catch(Exception e){throw new AttributeValidationException(\"\
    Employeer Number:invalid format\");}\n```\n\n尝试输入一个数字，例如 `1`，并提交。登录用户存储库，员工编号将显示为\
    \ `0001`。我们可以使用 `changedValue.reference` 参数修改值。\n\n```\nint employeeNo = new Integer(attrValue);DecimalFormat\
    \ format = new DecimalFormat(\"0000\");changedValue.reference = format.format(employeeNo);\n\
    ```\n\n任务级验证提供了 `BLTHContext` 作为参数。你可以使用 `BLTHContext` 从托管对象中搜索某些属性，例如你必须检查新值必须是唯一的。\n\
    \n### 6.4.3 代码示例：目录级验证\n\n此示例将使用与任务级验证相同的需求。请从管理员任务 `update employee number` 中禁用任务级验证。\n\
    \n* 搜索管理员任务：`update employee number`\n* 转到选项卡：`tabs` 并修改界面：`Update Employee Number`。\n\
    * 移除验证 Java 类的值：`com.book.idm.etc.EmployeeNumberTaskValidator`。\n\n### 代码\n1.\
    \ 编译我们的 Java 代码：`com.book.idm.etc.EmployeeNumberDirValidator`\n2. 将类（包括包 `com.book.idm.etc`）复制到文件夹\
    \ `\\IdentityMinder.ear\\custom`\n\n## 配置：管理控制台\n\n1. 在管理控制台中，点击 `Directory`。\n\
    2. 点击用户存储目录的名称。\n3. 点击底部的 `export` 按钮。你会得到一个 `xml` 文件。\n4. 使用文本编辑器打开 `xml` 文件。\n\
    5. 你需要修改 2 个地方：\n   - 在元素 `<ImsManagedObjectAttrValidation>` 下添加验证规则。请查阅官方文档检查\
    \ xml 架构。\n```xml\n<ValidationRule name=\"Employee Number pattern\" description=\"\
    Validates employee number\" messageid=\"4002\"><Java class=\"com.book.idm.etc.EmployeeNumberDirValidator\"\
    /></ValidationRule><ValidationRuleSet name=\"Employee Number format\"description=\"\
    validate employee number format\"><ValidationRule name=\"Employee Number pattern\"\
    /></ValidationRuleSet>\n```\n   - 5.2 为 `employeeNumber` 添加属性 `validationruleset\
    \ =”Employee Number format\"`。\n```xml\n<ImsManagedObjectAttrValidation physicalname=\"\
    Employee Number\"description=\"Employee Number\"valuetype=\"String\"maxlength=\"\
    0\"validationruleset=\"Employee Number format\"/>\n```\n6.返回用户存储库。\n7. 点击 `next`\
    \ 并选择我们的 `xml` 文件。\n\n## 工作原理\n\n执行管理员任务：`Update employee number`。\n\n1. 以管理员身份登录身份管理器用户控制台。\n\
    2. 选择选项卡：`Book Example`，选择菜单 `update employee number`。\n3. 搜索一个用户，屏幕将显示员工编号的文本字段。\n\
    4. 修改员工编号属性，并点击 `submit`。\n\n## 方法 `validate()`\n\n有 2 种显示错误的方法。这与任务级验证几乎相同，区别在于如何获取消息：\n\
    * 如果你返回 `false`，则不需要设置消息。消息来自 `xml` 文件。\n* 如果你抛出异常，消息来自属性文件：`IMSException.properties`。\n\
    ```\ntry{...}catch(Exception e){throw new AttributeValidationException(\"Employee\
    \ Number\",attrValue.toString(),\"4002\",\"invalid format\");}\n```\n\n!![](img/image_rsrc8Y1.jpg)\n\
    图 6-18 显示了来自 `IMSException.properties` 文件的 messageid\n\n## 规则集\n\n在管理控制台中，点击用户存储目录。向下滚动直到规则集部分。点击内部链接，即可看到详情。\n\
    \n!![](img/image_rsrc8Y2.jpg)\n图 6-19 显示了管理控制台中的设置\n\n测试后禁用目录级验证。我们将在第二本书中使用员工编号。\n\
    \n## 6.5 邮件通知\n\n本节是一个特殊主题。它是下一个 API：`Notification Rule API` 的。CA IdentityMinder\
    \ 官方文档在管理指南中有邮件通知主题，而不是在编程指南中。\n\n### 配置 SMTP\n\n在启动邮件通知之前，你需要检查 SMTP 配置。在处理邮件通知之前要检查两项。第一项是\
    \ SMTP 配置，即 SMTP 服务器：\n* Jboss：检查 `jboss_home\\server\\default\\deploy\\mail-service.xml`\n\
    * WebLogic：检查 JNDI 名称为 `nete/Mail` 的邮件会话\n* WebSphere：检查名为 `mailMail` 的邮件会话对象\n\
    \n请参官方文档管理指南 > email notifications > configure SMTP Setting。\n\n第二项是 `iam_im.ear\\\
    config\\com\\netegrity\\config` 文件夹下的 `email.properties` 文件。该文件用于特定的发件人地址。\n\n"
- fmt: "\nThere are 2+1 ways to implement email notification. The official document\
    \ introduces 2 ways to send email. This book offers another way to send email.\n\
    \n## 1. Email Notification Policies\n\n- No coding is required to create email\
    \ notifications.\n- Email notification policies are `Policy Xpress` policies.\
    \ You can create condition (entry rule) when policy should run.\n- It is under\
    \ the `System` tab, select `Email` menu.\n\n## 2. Email templates\n\n- Require\
    \ code (`JSP/java` syntax)\n- Support dynamic content (include if-else condition\
    \ in content).\n- Support `Notification Rule API`.\n\nBoth email notification\
    \ policies and email templates are depending on task completion or event outcome\
    \ (approve, reject or fail). You cannot send email any time you want. For example,\
    \ you may have long process steps:\n\n- Step 1: HR staffs update user’s office.\n\
    - Step 2: Send email to remind manager for approval.\n- Step 3: Send remedy ticket\
    \ and then send email to HR staff about ticket number.\n- Step 4: Send web services\
    \ request to facility system to request permission to access the office. Send\
    \ email to HR staff after web services response successfully. If request fail,\
    \ send email to IT administrator.\n- Step 5: Wait until expected hire date, Send\
    \ email to confirm user and HR staff.\n\nFor long flow process, you have to analysis\
    \ solutions when email has to be notified. This book has a trick to send email\
    \ by `java` API.\n\n## 3. Service API\n\n- It can send email anytime.\n- Support\
    \ dynamic content. You can use any popular framework such as `velocity`.\n- Please\
    \ note, `CA IdentityMinder` document do not mention this way. Please use with\
    \ your own risk.\n\n## 6.5.2 Code Example: Email Template\n\nThis example shows\
    \ how to implement email template. Understanding email template is requires for\
    \ next topic `Notification Rule API`. Our example code will send email after administrator\
    \ execute admin task: `Update Location and Ext Number` successfully.\n\n### Code\n\
    \n1. Locate file `Update Location and Ext Number.tmpl`\n2. Copy file to folder\
    \ `<server>\\IdentityMinder.ear\\custom\\emailTemplates\\default\\completed`\n\
    \n### Configuration: Management Console\n\n1. In the `Management Console`, click\
    \ `Environments`.\n2. Click the name of the environment.\n- Click `Advanced Settings`.\n\
    - Click `Email`.\n- Select check box `Tasks e-mail enabled`.\n\n| ![](OEBPS/image_rsrc8Y3.jpg)\
    \ |\n| Figure 6-20 shows task e-mail enabled configuration |\n\n6. Scroll down\
    \ until you see `Send e-mail when the following tasks are completed or during\
    \ workflow`\n   - In `Admin Task Name`, select `Equal` from drop down and put\
    \ value: `Update Location and Ext Number`\n   - `Update Location and Ext Number`\
    \ will be displayed in search result. Select check box on that task and click\
    \ add button.\n   - You should see task `Update Location and Ext Number` in task\
    \ table\n\n| ![](OEBPS/image_rsrc8Y4.jpg) |\n| Figure 6-21 shows adding task for\
    \ email template |\n\n7. Click save button.\n8. Click `Restart Environment` button.\n\
    \n### How it works\n\nExecute admin task: `Update Location and Ext Number`.\n\n\
    6. Log into the `Identity Manager User Console` as administrator.\n7. Select tab:\
    \ `Book Example`, and select menu `Update Location and Ext Number`.\n8. Search\
    \ a user, the screen will show city drop down.\n9. Modify city attribute, and\
    \ click submit.\n\n### Got the Email\n\nAfter administrator submitted, the use\
    \ should get email that has content as below:\n\n| ![](OEBPS/image_rsrc8Y5.jpg)\
    \ |\n| Figure 6-22 shows email content |\n\nOpen file `Update Location and Ext\
    \ Number.tmpl`, you will see code for email content. They have special variables\
    \ likes `_to` or `_taskContextInformation`. `_to` means receiver of email. We\
    \ will cover more detail in `notification rule API`. For `_taskContextInformation`\
    \ is a task context. Please see administration guide for more details.\n\n```java\n\
    <%_to = _util.getNotifiers(\"USER\", \"\");_cc = \"\";_bcc = \"\" ;_subject =\
    \ \"Update Location and Ext Number\";%>User:<%var imsEventContexts  = _taskContextInformation.getExposedEventContexts();if(imsEventContexts\
    \ != null){var eventContext = imsEventContexts.get(0);template.add(eventContext.getPrimaryObjectName());}%>has\
    \ been updated location and ext number successfully.\n```\n\nIf you are not getting\
    \ email or error display on screen, please check log file. `SMTP` may not correct.\n\
    \nIf you do not get email but administrator gets email instead and subject is\
    \ `Update Location and Ext Number Completed`, that means `CA IdentityMinder` uses\
    \ default template: `defaultTask.tmpl` sending email. Please check folder name\
    \ `default/completed` and admin task should matches with our template name exactly.\
    \ Restart server or environment may is required for some modification.\n\n## 6.5.3\
    \ Code Example: Email notification by Service API\n\nThis example shows how to\
    \ send email by `CA IdentityMinder` service. We will send email by using business\
    \ logic task handler. Please disable email template from previous example.\n\n\
    ### Code\n\n1. Compile our java code: `com.book.idm.etc.SendEmail`\n2. Copy class\
    \ (include package folder `com.book.idm.etc` ) to folder `<server>\\IdentityMinder.ear\\\
    custom`\n\n### Configuration: Identity Manager User Console\n\n1. Log into the\
    \ `Identity Manager User Console` as administrator.\n2. Select tab: `Roles and\
    \ Tasks`, and select menu modify admin task.\n3. Search admin task: `Update Location\
    \ and Ext Number`.\n4. Click button `Business Logic Handlers`.\n5. Click add and\
    \ put value as below:\n\n| Field Name | Value | Description |\n| :--- | :--- |\
    \ :--- |\n| Name | `SendEmail` | Name of logic task handler |\n| Class | `com.book.idm.etc.SendEmail`\
    \ | Name of java class |\n\n6. Click ok and submit task.\n\n### How it works\n\
    \nExecute admin task: `Update Location and Ext Number`.\n\n1. Log into the `Identity\
    \ Manager User Console` as administrator.\n\n### Service API\n\nThe code is pretty\
    \ straightforward. You can send email by method `sendMail()`.\n\n```java\nInternalServiceAccessor.getEmailProvider().sendMail(from,to,cc,bcc,encoding,priority,subject,body);\n\
    ```\n\nWe can access administrator email in configuration: `email.properties`\
    \ by calling `getAdminEmailID()`.\n\n```java\nString adminEmail = InternalServiceAccessor.getEmailProvider().getAdminEmailID();\n\
    String from = adminEmail;\n```\n\nWe can get email recipient by `ProviderAccessor`.\
    \ (We cannot get email by BLTH because email attribute does not presence in admin\
    \ task)\n\n```java\nUser user = ctx.getUserProvider().findUser(ctx.getUser().getUniqueName(),\
    \ null);\nString toEmail = user.getAttribute(\"mail\");\nString to = toEmail;\n\
    ```\n\nThis example sends email using business logic task handler (Email has been\
    \ sent before task complete). If you want to send email after task complete, please\
    \ send email by event listener in method `after()`.\n\n## 6.6 Notification Rule\
    \ API\n\nThis API is used with email template only. It determines who receive\
    \ an email notification.\n\n### 6.6.1 Programming\n\nYou have to create java class\
    \ extend `NotificationRuleAdapter` and override method `evaluate()`.\n\n`public\
    \ Vector evaluate(NotificationRuleContext ctx, Hashtable templateParams)`\n- put\
    \ email address into vector object and return. The first parameter is context\
    \ is almost same as other APIs. The second parameter `templateParams` keeps name/value\
    \ pairs of user-defined data that may be specified in the email template.\n\n\
    ### 6.6.2 Code Example\n\nThis example require previous example: email template.\
    \ So you need to enable email template on task completion. Our requirement is\
    \ when administrator executes admin task: `Update Location and Ext Number`, it\
    \ has to send email to user and cc manager. If they do not have manager, you can\
    \ skip cc email.\n\n### Code\n\n1. Compile our java code: `com.book.idm.etc.ManagerNotificationRule`\n\
    2. Copy class (include package folder `com.book.idm.etc` ) to folder `<server>\\\
    IdentityMinder.ear\\custom`\n"
  raw: "There are 2+1 ways to implement email notification. The official document\
    \ introduces 2 ways to send email. This book offers another way to send email.             \n\
    \n1.  Email Notification Policies.\n\n*   No coding is required to create email\
    \ notifications.\n\n*   Email notification policies are Policy Xpress policies.\
    \ You can create condition (entry rule) when policy should run.\n\n*   It is under\
    \ the System tab, select Email menu.\n\n2.  Email templates\n\n*   Require code\
    \ (JSP/java syntax)\n\n*   Support dynamic content (include if-else condition\
    \ in content).\n\n*   Support Notification Rule API.\n\nBoth email notification\
    \ policies and email templates are depending on task completion or event outcome\
    \ (approve, reject or fail). You cannot send email any time you want. For example,\
    \ you may have long process steps:\n\n*   Step 1: HR staffs update user’s office.\n\
    \n*   Step 2: Send email to remind manager for approval.\n\n*   Step 3: Send remedy\
    \ ticket and then send email to HR staff about ticket number.\n\n*   Step 4: Send\
    \ web services request to facility system to request permission to access the\
    \ office. Send email to HR staff after web services response successfully.  If\
    \ request fail, send email to IT administrator.\n\n*   Step 5: Wait until expected\
    \ hire date, Send email to confirm user and HR staff.\n\nFor long flow process,\
    \ you have to analysis solutions when email has to be notified. This book has\
    \ a trick to send email by java API.\n\n3.  Service API\n\n*   It can send email\
    \ anytime.\n\n*   Support dynamic content. You can use any popular framework such\
    \ as velocity.\n\n*   Please note, CA IdentityMinder document do not mention this\
    \ way. Please use with your own risk.\n\n### 6.5.2 Code Example: Email Template\n\
    \nThis example shows how to implement email template. Understanding email template\
    \ is requires for next topic Notification Rule API. Our example code will send\
    \ email after administrator execute admin task: Update Location and Ext Number\
    \ successfully.\n\nCode\n\n1.  Locate file “Update Location and Ext Number.tmpl”\n\
    \n2.  Copy file to folder “<server>\\IdentityMinder.ear\\custom\\emailTemplates\\\
    default\\completed”\n\nConfiguration: Management Console\n\n1.  In the Management\
    \ Console, click Environments.\n\n2.  Click the name of the environment.\n\n3.\
    \  Click Advanced Settings.\n\n4.  Click Email.\n\n5.  Select check box Tasks\
    \ e-mail enabled.\n\n| ![](OEBPS/image_rsrc8Y3.jpg) |\n\n| Figure 6-20 shows task\
    \ e-mail enabled configuration |\n\n6.  Scroll down until you see “Send e-mail\
    \ when the following tasks are completed or during workflow”\n\n    In Admin Task\
    \ Name, select Equal from drop down and put value: Update Location and Ext Number\n\
    \n    Update Location and Ext Number will be displayed in search result. Select\
    \ check box on that task and click add button.\n\n    You should see task Update\
    \ Location and Ext Number in task table\n\n| ![](OEBPS/image_rsrc8Y4.jpg) |\n\n\
    | Figure 6-21 shows adding task for email template |\n\n7.  Click save button.\n\
    \n8.  Click Restart Environment button.\n\nHow it works\n\nExecute admin task:\
    \ Update Location and Ext Number.\n\n6.  Log into the Identity Manager User Console\
    \ as administrator.\n\n7.  Select tab: Book Example, and select menu Update Location\
    \ and Ext Number.\n\n8.  Search a user, the screen will show city drop down.\n\
    \n9.  Modify city attribute, and click submit.\n\nGot the Email\n\nAfter administrator\
    \ submitted, the use should get email that has content as below:\n\n| ![](OEBPS/image_rsrc8Y5.jpg)\
    \ |\n\n| Figure 6-22 shows email content |\n\nOpen file “Update Location and Ext\
    \ Number.tmpl”, you will see code for email content. They have special variables\
    \ likes _to or _taskContextInformation. _to means receiver of email. We will cover\
    \ more detail in notification rule API. For _taskContextInformation is a task\
    \ context. Please see administration guide for more details.\n\n| <%_to = _util.getNotifiers(\"\
    USER\", \"\");_cc = \"\";_bcc = \"\" ;_subject = \"Update Location and Ext Number\"\
    ;%>User:<%var imsEventContexts  = _taskContextInformation.getExposedEventContexts();if(imsEventContexts\
    \ != null){var eventContext = imsEventContexts.get(0);template.add(eventContext.getPrimaryObjectName());}%>has\
    \ been updated location and ext number successfully. |\n\nIf you are not getting\
    \ email or error display on screen, please check log file. SMTP may not correct.\n\
    \nIf you do not get email but administrator gets email instead and subject is\
    \ “Update Location and Ext Number Completed”, that means CA IdentityMinder uses\
    \ default template: defaultTask.tmpl sending email. Please check folder name “default/completed”\
    \ and admin task should matches with our template name exactly. Restart server\
    \ or environment may is required for some modification.\n\n### 6.5.3 Code Example:\
    \ Email notification by Service API\n\nThis example shows how to send email by\
    \ CA IdentityMinder service. We will send email by using business logic task handler.\
    \ Please disable email template from previous example.\n\nCode\n\n1.  Compile\
    \ our java code: com.book.idm.etc.SendEmail\n\n2.  Copy class (include package\
    \ folder ” com.book.idm.etc” ) to folder “<server>\\IdentityMinder.ear\\custom”\n\
    \nConfiguration: Identity Manager User Console\n\n1.  Log into the Identity Manager\
    \ User Console as administrator.\n\n2.  Select tab Roles and Tasks, and select\
    \ menu modify admin task.\n\n3.  Search admin task: Update Location and Ext Number.\n\
    \n4.  Click button Business Logic Task Handlers.\n\n5.  Click add and put value\
    \ as below\n\n| Field Name | Value | Description |\n\n| Name | SendEmail | Name\
    \ of business logic task handler |\n\n| Class | com.book.idm.etc.SendEmail | Name\
    \ of java class |\n\n6.  Click ok and submit task.\n\nHow it works\n\nExecute\
    \ admin task: Update Location and Ext Number.\n\n1.  Log into the Identity Manager\
    \ User Console as administrator.\n\n2.  Select tab: Book Example, and select menu\
    \ Update Location and Ext Number.\n\n3.  Search a user, the screen will show city\
    \ drop down.\n\n4.  Modify city attribute, and click submit.\n\nService API\n\n\
    The code is pretty straightforward.  You can send email by method sendMail().\n\
    \n| InternalServiceAccessor.getEmailProviderService().sendMail(from,to,cc,bcc,encoding,contentType,priority,subject,body);\
    \ |\n\nWe can access administrator email in configuration: email.properties by\
    \ calling getAdminEmailID().\n\n| String adminEmail = InternalServiceAccessor.getEmailProviderService().getAdminEmailID();String\
    \ from = adminEmail; |\n\nWe can get email recipient by ProviderAccessor. (We\
    \ cannot get email by BLTH because email attribute does not presence in admin\
    \ task)\n\n| User user = ctx.getUserProvider().findUser(ctx.getUser().getUniqueName(),\
    \ null);String toEmail = user.getAttribute(\"mail\");String to = toEmail; |\n\n\
    This example sends email using business logic task handler (Email has been sent\
    \ before task complete) If you want to send email after task complete, please\
    \ send email by event listener in method after().\n\n## 6.6 Notification Rule\
    \ API\n\nThis API is used with email template only. It determines who receive\
    \ an email notification.\n\n### 6.6.1 Programming\n\nYou have to create java class\
    \ extend NotificationRuleAdapter and override method evaluate().\n\n*   public\
    \ Vector evaluate(NotificationRuleContext ctx, Hashtable templateParams)\n\n \
    \   *   You have to put email address into vector object and return. The first\
    \ parameter is context is almost same as other APIs. The second parameter telmplateParams\
    \ keeps name/value pairs of user-defined data that may be specified in the email\
    \ template.\n\n### 6.6.2 Code Example\n\nThis example require previous example:\
    \ email template. So you need to enable email template on task completion. Our\
    \ requirement is when administrator executes admin task: Update Location and Ext\
    \ Number, it has to send email to user and cc manager. If they do not have manager,\
    \ you can skip cc email.\n\nCode\n\n1.  Compile our java code: com.book.idm.etc.ManagerNotificationRule\n\
    \n2.  Copy class (include package folder ” com.book.idm.etc” ) to folder “<server>\\\
    IdentityMinder.ear\\custom”"
