    # Chapter 1 Introduction


    The key feature of CA IdentityMinder is customization without custom code but
    in this book we are talking about custom code. There are 2 main reasons to use
    custom code:


    *   The Management Console for administration.

    *   The User Console for interaction.


    ## 1.1 Why we need custom code


    The key feature of CA IdentityMinder is customization without custom code but
    in this book we are talking about custom code. There are 2 main reasons to use
    custom code:


    *   Customizing complex business logic.

    *   Flexible workflow management.


    In CA IdentityMinder, you can use custom code to extend the functionality of the
    platform. There are several ways to implement custom code in CA IdentityMinder:


    *   CA IdentityMinder is a platform for identity lifecycle management.

    *   CA IdentityMinder provides a powerful framework for automating identity-related
    processes.


    CA IdentityMinder also allows you to integrate with other third-party systems
    through APIs and connectors. This ensures that identity data is synchronized across
    the entire enterprise.


    ## 1.2 What this book covers


    This book provides a comprehensive guide to using custom code in CA IdentityMinder.
    We will cover the following topics:


    *   Chapter 1: Introduction to CA IdentityMinder and custom code.

    *   Chapter 2: Administration of CA IdentityMinder.

    *   Chapter 3: Workflow Concepts - Understanding how workflows work.

    *   Chapter 4: Business Logic Task Handlers - How to implement custom logic.

    *   Chapter 5: Workflows - How to design and manage workflows.

    *   Chapter 6: Additional APIs - Using the available APIs for custom development.


    ## 1.3 Technical Terms


    There are some technical terms for newcomers to avoid confusion:


    Endpoint


    An endpoint is a destination where user data is stored or managed. Examples of
    endpoints can be Microsoft Active Directory, SAP, database, Unix workstation,
    or application.


    User vs. Global User vs. Account


    In CA IdentityMinder, there are three types of entities related to identities:


    User means user information maintained by CA IdentityMinder Server. User is stored
    in CA IdentityMinder User Store.


    Global User means user information maintained by the Provisioning Server. It is
    stored in the Provisioning Directory.


    Account means user information in Endpoint. For example, an account in Active
    Directory.


    The figure below shows the relationship between user, global user, and accounts.
    Some users have a corresponding global user. When a user receives a provisioning
    role, the Provisioning Server creates a global user. When the server starts the
    provisioning process, some attributes from global user are provisioned to accounts.

