  trans: "\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<soapenv:Envelope\
    \ xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">\n  <soapenv:Body>\n\
    \    <TaskContext xmlns=\"http://tews6/wsdl\">\n      <admin_id>uid=superuser,ou=users,ou=na,dc=host,dc=com</admin_id>\n\
    \    </TaskContext>\n    <BookBasicUpdateLocAndExtNo xmlns=\"http://tews6/wsdl\"\
    >\n      <BookBasicUpdateLocAndExtNoSearch>\n        <Filter index=\"0\">\n  \
    \        <Field>%USER_ID%</Field>\n          <Op>EQUALS</Op>\n          <Value>allmi01</Value>\n\
    \        </Filter>\n      </BookBasicUpdateLocAndExtNoSearch>\n      <BookBasicUpdateLocAndExtNoUserProfileTab>\n\
    \        <l>New York</l>\n        <_BAR_ExtNumber_BAR_>1234</_BAR_ExtNumber_BAR_>\n\
    \      </BookBasicUpdateLocAndExtNoUserProfileTab>\n    </BookBasicUpdateLocAndExtNo>\n\
    \  </soapenv:Body>\n</soapenv:Envelope>\n```\n\nSOAP 响应\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \ xmlns=\"http://tews6/wsdl\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:SOAP-ENC=\"\
    http://schemas.xmlsoap.org/soap/encoding/\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xsi:schemaLocation=\"http://schemas.xmlsoap.org/soap/envelope/ http://schemas.xmlsoap.org/soap/envelope/\"\
    >\n  <soapenv:Body>\n    <ImsStatus version=\"6.0\">\n      <transactionId>cb40e808-a5029bf5-aeacf1a7-1401ca</transactionId>\n\
    \    </ImsStatus>\n  </soapenv:Body>\n</soapenv:Envelope>\n```\n\n## 身份验证与授权\n\
    \n在管理控制台中：Web 服务属性中，由于我们检查了 `enable admin_id` （允许身份冒充），我们可以传递任何管理员 DN 作为执行管理员任务的用户。\n\
    \n```java\nctx.setAdmin_id(adminDN);\n```\n\n如果你取消勾选 `enable admin_id`（允许身份冒充），则你需要进行身份验证。你必须选择\
    \ SiteMinder 身份验证，并修改代码进行身份验证。\n\n```java\nTews6SoapBindingStub stub = (Tews6SoapBindingStub)\
    \ _port;stub.setUsername(\"SuperAdmin\");stub.setPassword(\"test\");stub.setMaintainSession(true);stub._setProperty(\"\
    Cookie\",\"SMCHALLENGE=YES\");\n```\n\n对于授权，你可能需要在 `web.xml` 中进行配置。请参考官方文档《Java\
    \ 编程指南 > 执行 Web 服务 > 授权》。\n\n## 公共任务\n\n当你定义管理员任务时，有一个复选框：`public task`（公共任务）。公共任务意味着对于未登录\
    \ CA IdentityMinder 的用户可用。默认的公共任务是忘记密码和自我注册。公共任务可以用于第三方在无需身份验证的情况下从 CA IdentityMinder\
    \ 查询或获取数据。\n\n![](img/image_rsrc8Y9.jpg)\n\n图 6-26 显示了管理员任务配置中的公共任务复选框\n\nTEWS\
    \ 公共任务的客户端代码需要修改 3 个地方：搜索、端口类型和上下文。如果你修改了 `public task` 复选框，需要从 WSDL 重新生成 Java\
    \ 代码。\n\n对于搜索，你不能使用搜索过滤器。你必须使用搜索主题（search subject），因为公共任务的设计是为了自修改的。\n\n```java\n\
    BookBasicUpdateLocAndExtNoSearchSubject[] subjects = newBookBasicUpdateLocAndExtNoSearchSubject[1];BookBasicUpdateLocAndExtNoSearchSubject\
    \ subject = newBookBasicUpdateLocAndExtNoSearchSubject();subject.setUID(\"uid=allmi,ou=users,ou=northamerica,dc=server,dc=com\"\
    );subject.setIndex(new BigInteger(\"0\"));subjects[0] = subject;search.setSubject(subjects);task.setBookBasicUpdateLocAndExtNoSearch(search);\n\
    ```\n\n端口类型和上下文必须更改公共任务。\n\n```java\nTews6PublicPortType portType = locator.getTews6PublicPort();//Tews6PortType\
    \ portType = locator.getTews6Port();PublicTaskContext ctx = new PublicTaskContext();//TaskContext\
    \ ctx = new TaskContext();ctx.setAdmin_id(adminDN);\n```\n\n## 6.8 补充概念\n\n###\
    \ 访问用户自定义属性\n\n业务逻辑任务处理器、逻辑属性、事件监听器等都有自定义属性。\n\n![](img/image_rsrc8YA.jpg)\n\n\
    图 6-27 显示了自定义属性\n\n我们可以通过重写 `com.netegrity.imapi.LifeCycle` 接口的 `init(java.util.Hashtable\
    \ imeProperties)` 方法来访问这些属性。你可以将这些值存储在类变量并在其他方法中使用。\n\n```java\n@Override\npublic\
    \ void init(Hashtable imeProperties) throws Exception {System.out.println(imeProperties.get(\"\
    param1\"));\n```\n\n### 访问托管对象\n\n`EventContext`、`LogicalAttributeContext`、`NotificationRuleContext`、`ParticipantResolverContext`\
    \ 等扩展了 `ProviderAccessor`。它们可以像 BL（业务逻辑）一样执行或修改托管对象。\n\n`Logger` 类提供了以下方法：\n\n\
    ```java\nlogDebugMessage(String message)\nlogErrorMessage(String message)\nlogInfoMessage(String\
    \ message)\nlogWarningMessage(String message)\n```\n\n## 6.9 总结\n\n在本章中，我们完成了所有的\
    \ API。见下表：\n\n| API 名称 | 阶段 | 类型 | 备注 |\n| --- | --- | --- | --- |\n| Participant\
    \ Resolver | 确定工作流参与者 | A | 在工作流配置 |\n| Event Listener | 监听事件 | A | 事件组 |\n| Logical\
    \ Attribute | 逻辑属性与物理属性之间的转换 | S | 共享；目录级适用于所有 |\n| Validation Rule | 验证用户在屏幕上输入的值符合符合格式\
    \ | S | 任务级或目录级 |\n| Email Notification | 发送邮件 | S 或 A | 收件者和内容 |\n| Notification\
    \ Rule | 决定哪些用户接收邮件 | S | 与邮件模板配合使用 |\n\n建议获取第二卷，其中包含许多高级示例。主要的 API 是业务逻辑任务处理器和工作流。\n\
    \n# 附录 A：导入工作流\n\n从书籍网站下载代码。请使用代码 `120140924`。\n\n### 工作流\n\n* 启动 IdentityMinder\
    \ Server\n* 运行 WorkPoint Designer\n* 选择文件 > 导入\n* 选择文件 `IdmCodeWorkflow.zip`\n\
    * 选择全部\n\n![](img/image_rsrc8YB.jpg)\n\n图 A-1 显示导入界面\n\n* 当屏幕询问是否导入到空数据库时，选择“否”。点击下一步\n\
    * 当屏幕显示此导入将，选择“将所有对象视为新对象”。点击下一步\n* 屏幕询问“如果遇到重复名称或引用”，选择重命名导入的名称或引用以确保唯一。点击下一步\n\
    * 对话框将显示我们导入的代码列表，点击完成\n* 选择打开进程并验证。你应该看到一个以“BookEx.”开头的进程。\n\n![](img/image_rsrc8YC.jpg)\n\
    \n"
- fmt: "\n| Figure A-2 shows all processes |\n\n# Appendix B: Hot Deployment\n\nCA\
    \ IdentityMinder does not support hot deployment. When you update code in folder\
    \ `<IdentityMinder>/custom`, application server will not load your class. There\
    \ are a few ways to fix:\n\n## Restart Server or Redeploy IdentityMinder.ear\n\
    \nYou have to restart or redeploy after you update code. This solution takes time\
    \ and not suitable for development process.\n\n## OSGi\n\nThe new version of application\
    \ server supports OSGi specification. OSGi enable class load dynamically at runtime.\
    \ Please check your application server document.\n\n## Rename Code\n\nI prefer\
    \ this way. It is pretty simple and does not take time. CA IdentityMinder requires\
    \ 2 things: configuration and code. For example, my code is `MyCode.java`.\n\n\
    *   **BLTH**\n    *   **Code**: I rename code to `MyCode1.java`, compile and copy\
    \ to folder `“custom”`.\n    *   **Configuration**: update java class name in\
    \ admin task’s `BLTH`.\n*   **Workflow**\n    *   **Code**: I rename code to `MyCode1.java`,\
    \ compile and copy to folder `“custom”`.\n    *   **Configuration**: update agent\
    \ script in node.\n\nYou can do the same in `Listener` and other APIs.\n\n# CODE\
    \ : DGUJK101\n```\nDGUJK101\n```\n"
