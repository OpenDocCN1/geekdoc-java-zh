    ## How it works


    1. Log into the Identity Manager User Console as administrator.

    2. Select tab: Book Example and select Admin Task: “Update Location and Ext Number”,
    Then search and select some users.

    3. Modify city’s attribute and submit admin task.


    ### View submitted task


    Select “View submitted task” under tab “System”, select our task. Click icon pencil
    to see detail inside.


    ![](OEBPS/image_rsrc8WP.jpg)


    | Figure 5-62 show our task |


    Scroll down until you see event name: Modify user. Click icon “pencil” to see
    workflow detail.


    ![](OEBPS/image_rsrc8WR.jpg)


    | Figure 5-63 shows ModifyUserEvent |


    Look at section “Event Workflow Job View” and select pencil icon to see workflow.
    If you change city attribute to be New York, you will see the flow stop and node
    delay for 10 minutes. Waiting until 10 minutes, it will complete workflow.


    ![](OEBPS/image_rsrc8WS.jpg)


    | Figure 5-64 shows job, when user update city to be New York |


    If you change the city attribute to be something else, it will go node commit
    directly without waiting 10 minutes.


    ### Node: Check City Value


    This node, we have these configurations:


    * In user data tab, we set name and value: `city=none`.

    * In agents tab, we select script `IsNewYorkCity`

    * Java Class Name: `com.book.idm.workflow.DelayForNYFlow`

    * Method name: `isNewYorkCity`

    * Parameters: `ClientContext`, `SymbolTable`, `ThisJobData`, `ThisActivityInstData`


    ![](OEBPS/image_rsrc8WT.jpg)


    | Figure 5-65 shows configuration of automated node |


    In method `checkCityValue`, the arguments must have exactly match with script’s
    parameters both sequence order and values. (`ClientContext clientContext`, `JobData
    thisJobData`, `ActivityInstData thisactivityInstData`)


    * `ClientContext` – it needs to construct `WorkflowContext`

    * `JobData` – it needs to construct `WorkflowContext`.

    * `ActivityInstData` – it is used to access value “city” in user data tab.


    ```java

    public void checkCityValue(ClientContext clientContext, JobData thisJobData,ActivityInstData
    thisactivityInstData){User user = null;WorkflowContext workflowContext = null;try{//
    Get ContextworkflowContext = WorkpointHelper.getWorkflowContext(clientContext,thisJobData);user
    = WorkpointHelper.getUser(workflowContext);System.out.println("City : New Value
    ="+user.getAttribute("l"));System.out.println("City : Old Value ="+user.getLastCommittedAttribute("l"));//Put
    new value to User DatathisactivityInstData.setUserData("city",user.getAttribute("l").toLowerCase());}catch(Exception
    e){e.printStackTrace();}}

    ```


    We have to get `WorkflowContext`. `WorkflowContext` is the main API to interact
    with CA IdentityMinder.


    ```java

    workflowContext = WorkpointHelper.getWorkflowContext(clientContext,thisJobData);

    ```


    CAIdentityMinder provides class `WorkflowCallbackHelper. generateWorkflowContext()`
    to get the workflow context. We create utility class: `WorkpointHelper` andmethod
    `generateWorkflowContext`. You can reuse this class in your project.

