  trans: "\n\n### 3. 修改 `email template` 文件夹下的文件 `Update Location and Ext Number.tmpl`。为\
    \ `_cc` 添加通知规则名称。\n\n```\n_cc = _util.getNotifiers(\"ManagerNotificationRule\"\
    ,\"param1=A,param2=B\");\n```\n\n#### 配置：控制台 (Management Console)\n\n1. 在管理控制台中，点击\
    \ `Environments`（环境）。\n2. 点击环境名称。\n3. 点击 `Advanced Settings`（高级设置）。\n4. 点击 `Notification\
    \ Rules`（通知规则）。\n\n| 字段名称 | 值 | 说明 |\n| :--- | :--- | :--- |\n| Name | `ManagerNotificationRule`\
    \ | 通知规则名称 |\n| Class | `com.book.idm.etc.ManagerNotificationRule` | Java 类名 |\n\
    \n5. 点击保存并重启环境。\n\n#### 工作原理\n\n执行管理员任务：`Update Location and Ext Number`。\n\n\
    1. 以管理员身份登录 Identity Manager User Console。\n2. 选择标签页：Book Example，并选择菜单 `Update\
    \ Location and Ext Number`。\n3. 搜索用户，屏幕将显示城市下拉列表。\n4. 修改城市属性并点击提交。\n\n#### 邮件收件者\n\
    \n我们使用 `ProviderAccessor` 查找用户的经理，然后获取属性“mail”，并将电子邮件地址添加到向量中返回。\n\n```java\n\
    String emailManager = manager.getAttribute(\"mail\");if (emailManager != null\
    \ || emailManager.trim().length() != 0) {emails.add(emailManager);}\n```\n\n####\
    \ 模板参数\n\n在邮件模板中，我们添加通知规则。\n\n```\n_cc = _util.getNotifiers(\"ManagerNotificationRule\"\
    ,\"param1=A,param2=B\");\n```\n\n`\"param1=A,param2=B\"` 是模板参数。我们可以从参数 `templateParams`\
    \ 获取这些值。\n\n```java\npublic Vector evaluate(NotificationRuleContext ctx,Hashtable\
    \ templateParams){\n    Enumeration keys = templateParams.keys();\n    while (keys.hasMoreElements())\
    \ {\n        Object key = keys.nextElement();\n        System.out.println(\"parameter:\
    \ \" + key + \"=\"+ + templateParams.get(key));\n    }\n}\n```\n\n### 6.6.3 用例\n\
    \n我们在官方文档中实现了用例示例（Programming Guide for Java › Notification Rule API › API Overview\
    \ > Use Case Examples）。\n\n#### 通知单个用户\n\n| 当用户数据被修改时，获取用户姓名并根据请求状态抄送（cc）该用户。\
    \ |\n\n编写通知规则代码时，你可以从上下文中获取用户名并添加后缀作为邮件地址。你必须在邮件模板的 `_cc` 中调用通知规则。\n\n```java\n\
    String userName = ctx.getSubject().getFriendlyName();String email = userName+\"\
    @somedomain.com\";emails.add(email);\n```\n\n#### 通知用户组\n\n| 当用户被创建并添加到组中时，获取组名（从传递到通知规则的上下文中信息），并关于新组成员抄送（cc）该组。\
    \ |\n\n我们在事件 `AddToGroupEvent` 下编写邮件模板，因此主对象是组。我们获取组名，并将组名作为上下文中信息添加到邮件模板中，然后传递给通知规则。\n\
    \n```java\nString groupName = _eventContextInformation.getPrimaryObjectName();_cc\
    \ = _util.getNotifiers(\"NotificationRule\",\"group=\"+groupName);\n```\n\n###\
    \ 6.6.3 通知规则与邮件模板的限制及服务 API\n\n关于邮件模板和通知规则存在一些问题：\n\n- 通知规则仅与邮件模板配合工作，对于服务 API\
    \ 并不是必需的。\n- 通知规则的目标是确定邮件收件者。虽然我们可以使用服务 API (`InternalServiceAccessor.getEmailProviderService()`)，我们可以访问收件者：`to`、`cc`\
    \ 和 `bcc`。可以使用上下文搜索邮件属性。\n- 邮件模板支持动态内容，但你需要学习新的 JSP 标签库。\n- 如果使用邮件模板，可能需要学习新的标签库，例如\
    \ `_taskContextInformation`。如果你选择服务 API，可以使用简单的 Java 代码或流行的 Java 框架（如 Apache Velocity）来生成邮件内容。\n\
    - 邮件模板在任务或事件（失败、完成等）条件下运行。\n- 而服务 API 可以在代码中的任何时间调用。\n\n## 6.7 任务执行 Web 服务 (TEWS)\n\
    \n许多人对任务执行 Web 服务感到困惑。任务执行 Web 服务（或称 TEWS）将管理员任务作为 Web 服务的生产者。它不是消费者。TEWS 是一个\
    \ Web 服务接口，允许第三方客户端应用程序向 CA IdentityMinder 提交远程任务。\n\n![](img/image_rsrc8Y6.jpg)\n\
    \n图 6-23 显示了 TEWS 如何工作\n\n### 6.7.1 代码示例\n\n我们开发了一个 Java 客户端来消费 TEWS。我们想通过 Java\
    \ Web 服务执行管理员任务：`Update Location and Ext Number`。\n\n请禁用所有之前的代码：Policy Xpress、工作流、验证和邮件通知。\n\
    \n#### 配置：控制台\n\n1. 在管理控制台中，点击 `Environments`。\n2. 点击使用 Web 服务的环境名称。\n3. 点击 `Advanced\
    \ Settings`。\n4. 点击 `Web Services`。\n5. 填写如下值：\n\n| 字段名称 | 值 | 说明 |\n| :--- |\
    \ :--- | :--- |\n| Enable Execution | Check | 勾选启用该环境的任务执行 Web 服务 (TEWS)。 |\n\
    | Enable WSDL Generation | Check | 勾选启用该环境的 WSDL 生成。 |\n| Enable admin_id | Check\
    \ | TEWS 使用发送到 Web 服务的 SOAP 消息中的管理员 ID 来验证请求。如果未选择此选项，则使用生成请求的用户 ID 来验证请求。 |\n\
    | SiteMinder Authentication | none | 对于身份验证，在我们的示例中我们 none。 |\n\n![](img/image_rsrc8Y7.jpg)\n\
    \n图 6-24 显示管理控制台\n\n#### 配置：Identity Manager User Console\n\n1. 登录 User Console。\n\
    2. 选择 `Roles` 和 `Tasks`。选择 `Admin Tasks`。\n3. 选择 `Update Location and Ext Number`。\n\
    4. 选择 `Enable Web Services`。\n5. 点击 `Submit` 保存更改。\n\n![](img/image_rsrc8Y8.jpg)\n\
    \n图 6-25 显示管理员任务\n\n#### 代码\n\n我们通过 BWS 使用 Java 调用管理员任务：`Update Location and Ext\
    \ Number`。\n\n```bash\njava -cp lib/axis.jar;lib/log4j-1.2.jar;lib/wsdlj-1.5.jar;lib/commons-logging-1.0.jar;lib/commons-discovery...../.............................\n\
    \n......................................................................jar;lib/commons-discovery-0.2.jar;lib/jaxrpc.jar;lib/axis.jar;lib/axis.jar;lib/log4j-1.2.jar;lib/wsdl\
    \ org.axis.wsdl.WSDL2 -wrapArrays=true http://<host>:8080/idm/TEWS?wsdl\n```\n\
    \n2. 将生成的代码复制到 eclipse。\n3. 在 eclipse 中打开 Java 代码：`com.book.idm.etcClient`。\n\
    4. 检查必需参数。\n    - `userId` 是你想修改的用户。\n    - `adminDN` 是执行此任务的人。我们将详细说明。\n    -\
    \ `City` 和 `extNumber` 是我们想要修改的值。\n\n```java\nString userId = \"allmi01\";String\
    \ adminDN = \"uid=superuser,ou=users,ou=na,dc=host,dc=com\";\nString city = \"\
    New York\";\nString extNumber = \"1234\";\n```\n\n#### 工作原理\n\n1. 从 eclipse 中执行我们的\
    \ Java 代码：`TEWSClient`。\n2. 登录到用户存储目录并检查城市属性。\n\n代码开始的 Java 类名与管理员任务的标签相同：`BookLocAndExtNumber`。该任务代码有两个标签页：搜索标签页和配置标签页。\n\
    \n```java\nBookBasicLocAndExtNumber task = new BookLocAndExtNumber();...task.setBookLocAndExtNumberSearch(search);...task.setBookLocAndExtNumberUserProfileTab(profileTab);\n\
    ```\n\n对于搜索标签页，我们使用过滤器按 ID 进行搜索。\n\n```java\n11.SearchFilter[] filters = newBookBasicLocAndExtNumberSearchFilter[1];BookBasicLocAndExtNumberSearchFilter\
    \ filter = newBookBasicLocAndExtNumberSearchFilter();filter.setIndex(new BigInteger(\"\
    0\"));filter.setField(\"%USER_ID%\");filter.setOp(OperatorType.EQUALS);filter.setValue(userId);filters[0]\
    \ = filter;search.setFilter(filters);\n```\n\n我们在配置标签页对象中设置城市和 `extNumber` 属性。\n\
    \n```java\nBookBasicLocAndExtNumberUserProfileTab profileTab = newBookBasicLocAndExtNumberUserProfileTab();profileTab.setL(city);profileTab.set_BAR_ExtNumber_BAR_(extNumber);\n\
    ```\n\n在我们的代码中，还有两个额外的文件：`LogHandler.java` 和 `client-config.wsdd`。这些文件是 Axis 客户端日志器的辅助工具。你可以看到服务器和客户端之间的\
    \ SOAP 消息。可以使用此 XML 作为 SOAP UI 或任何 Web 服务工具中的请求。\n\nSOAP 请求\n\n"
- fmt: "\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<soapenv:Envelope xmlns:soapenv=\"\
    http://schemas.xmlsoap.org/soap/envelope/\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">\n  <soapenv:Body>\n\
    \    <TaskContext xmlns=\"http://tews6/wsdl\">\n      <admin_id>uid=superuser,ou=users,ou=na,dc=host,dc=com</admin_id>\n\
    \    </TaskContext>\n    <BookBasicUpdateLocAndExtNo xmlns=\"http://tews6/wsdl\"\
    >\n      <BookBasicUpdateLocAndExtNoSearch>\n        <Filter index=\"0\">\n  \
    \        <Field>%USER_ID%</Field>\n          <Op>EQUALS</Op>\n          <Value>allmi01</Value>\n\
    \        </Filter>\n      </BookBasicUpdateLocAndExtNoSearch>\n      <BookBasicUpdateLocAndExtNoUserProfileTab>\n\
    \        <l>New York</l>\n        <_BAR_ExtNumber_BAR_>1234</_BAR_ExtNumber_BAR_>\n\
    \      </BookBasicUpdateLocAndExtNoUserProfileTab>\n    </BookBasicUpdateLocAndExtNo>\n\
    \  </soapenv:Body>\n</soapenv:Envelope>\n```\n\nSOAP Response\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \ xmlns=\"http://tews6/wsdl\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:SOAP-ENC=\"\
    http://schemas.xmlsoap.org/soap/encoding/\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xsi:schemaLocation=\"http://schemas.xmlsoap.org/soap/envelope/ http://schemas.xmlsoap.org/soap/envelope/\"\
    >\n  <soapenv:Body>\n    <ImsStatus version=\"6.0\">\n      <transactionId>cb40e808-a5029bf5-aeacf1a7-1401ca</transactionId>\n\
    \    </ImsStatus>\n  </soapenv:Body>\n</soapenv:Envelope>\n```\n\n## Authentication\
    \ and Authorization\n\nIn management console: web services properties, because\
    \ we check option `enable admin_id` (allow impersonation), we can pass any administrator\
    \ DN as who execute admin task.\n\n```java\nctx.setAdmin_id(adminDN);\n```\n\n\
    If you uncheck option `enable admin_id` (allow impersonation), you need to do\
    \ authentication. You have to select SiteMinder Authentication, you have to modify\
    \ code for authentication.\n\n```java\nTews6SoapBindingStub stub = (Tews6SoapBindingStub)\
    \ _port;stub.setUsername(\"SuperAdmin\");stub.setPassword(\"test\");stub.setMaintainSession(true);stub._setProperty(\"\
    Cookie\",\"SMCHALLENGE=YES\");\n```\n\nFor Authorization, you may need configuration\
    \ in `web.xml`. Please see the official document `Programming Guide for Java >\
    \ Task Execution Web Service > Authorization`.\n\n## Public Task\n\nWhen you define\
    \ admin task, there is one check box: `public task`. The public task means the\
    \ task available to users who have not logged in to CA IdentityMinder. The default\
    \ public tasks are forgotten password and self-registration. The public task can\
    \ use in requirement for the third party want to query or get data from CA IdentityMinder\
    \ without authentication.\n\n![](OEBPS/image_rsrc8Y9.jpg)\n\nFigure 6-26 shows\
    \ public task check box in admin task configuration\n\nThe client coding for the\
    \ public task TEWS need to change 3 places are search, port type and context.\
    \ If you modify check box `public task`, it needs to regenerate java code from\
    \ WSDL.\n\nFor search, you can’t use search filter. You have to use search subject\
    \ because public task design for self-modification.\n\n```java\nBookBasicUpdateLocAndExtNoSearchSubject[]\
    \ subjects = newBookBasicUpdateLocAndExtNoSearchSubject[1];BookBasicUpdateLocAndExtNoSearchSubject\
