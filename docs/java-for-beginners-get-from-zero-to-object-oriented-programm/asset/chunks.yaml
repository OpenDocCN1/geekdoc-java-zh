  trans: "\n引用数组也是如此。这无非只是为了更方便遍历数组并使过程更具可读性而的一种小技巧。\n\n### 练习集 #71\n\n1) 编写一个程序，创建一个数组并用\
    \ 1 到 10 的数字填充它，然后通过遍历数组将其打印出来。\n\n2) 创建一个名为 `Employee` 的新类（如果还没有的话），并粘贴以下代码：\n\
    ```java\npublic class Employee {\n    String name;\n    double salary;\n}\n```\n\
    同样创建一个名为 `Company` 的新类（如果还没有的话），并粘贴以下代码：\n```java\npublic class Company {\n  \
    \  Employee [] employees = new Employee [ 3 ];\n    int i = 0;\n    void add(\
    \ Employee employee) {\n        this . employees[???] = employee;\n        i +=\
    \ ???;\n    }\n    void showEmployees() {\n        for ( Employee e : employees)\
    \ {\n            System . out . println(???);\n        }\n    }\n}\n```\n最后，创建一个名为\
    \ `Program` 的新类（如果还没有的话），并粘贴以下代码：\n```java\npublic class Program {\n    public\
    \ static void main( String [] args) {\n        Employee e1 = new Employee ();\n\
    \        e1. name = \"Lucas\";\n        e1. salary = 100000;\n        Employee\
    \ e2 = new Employee ();\n        e2. name = \"Mary\";\n        e2.salary = 120000;\n\
    \        Employee e3 = new Employee ();\n        e3. name = \"Nick\";\n      \
    \  e3.salary = 85000;\n        Company company = new Company ();\n        company.\
    \ add( e1);\n        company. add( e2);\n        company. add( e3);\n        company.\
    \ showEmployees();\n    }\n}\n```\n现在将每个 `???` 替换为正确的代码以实现：：\n* `add()` 接收一个 `Employee`\
    \ 作为参数，并将其添加到数组 `employees` 的第一个空位置。\n* `showEmployees()` 不返回任何内容。它只是打印数组 `employees`\
    \ 中中每个员工的名字和工资。\n* 你只能用新代码来替换问号。\n* 这是预期的输出：\nLucas -> 100000.0\nMary -> 120000.0\n\
    Nick -> 85000.0\n\n3) 再次做一次 FizzBuzz 练习，但这次使用数组。“编写一个程序打印 1 到 100 的数字。但对于三的倍数打印“Fizz”而不是数字，对于五的倍数打印“Buzz”。对于既是三又是五的倍数的数字，打印“FizzBuzz”。。创建一个长度为\
    \ 100 的数组，并用 1 到 100 的数字填充它。然后遍历该数组并按照条件打印数字。\n\n4) 创建任意长度的数组并用任意数字填充它。现在遍历它并将这些数字复制到一个新数组。\n\
    \n### 答案\n\n1)\n```java\npublic class Program {\n    public static void main(\
    \ String [] args) {\n        int [] array = new int [ 10 ];\n        for ( int\
    \ i = 0 ; i <= 9 ; i++) {\n            array[ i] = i + 1;\n        }\n       \
    \ for ( int x : array) {\n            System . out . println( x);\n        }\n\
    \    }\n}\n```\n\n2)\n```java\npublic class Company {\n    Employee [] employees\
    \ = new Employee [ 3 ];\n    int i = 0;\n    void add( Employee employee) {\n\
    \        this . employees[ i] = employee;\n        i += 1;\n    }\n    void showEmployees()\
    \ {\n        for ( Employee e : employees) {\n            System . out . println(\
    \ e. name + \" -> \" + e. salary);\n        }\n    }\n}\n```\n\n3)\n```java\n\
    public class Program {\n    public static void main( String [] args) {\n     \
    \   int [] array = new int [ 100 ];\n        for ( int i = 1 ; i <= 100 ; i++)\
    \ {\n            array[ i- 1 ] = i;\n        }\n        for ( int x : array) {\n\
    \            if ( x % 15 == 0 ) {\n                System . out . println ( \"\
    Fizzbuzz\" );\n            } else if ( x % 5 == 0 ) {\n                System\
    \ . out . println ( \"Buzz\" );\n            } else if ( x % 3 == 0 ) {\n    \
    \            System . out . println ( \"Fizz\" );\n            } else {\n    \
    \            System . out . println ( x );\n            }\n        }\n    }\n\
    }\n```\n\n4)\n```java\npublic class Program {\n    public static void main( String\
    \ [] args) {\n        int [] oldArray = new int [ 3 ];\n        oldArray[ 0 ]\
    \ = 1;\n        oldArray[ 1 ] = 2;\n        oldArray[ 2 ] = 3;\n        int []\
    \ newArray = new int [ 3 ];\n        for ( int i = 0 ; i <= 2 ; i++) {\n     \
    \       newArray[ i] = oldArray[ i];\n        }\n    }\n}\n```\n\n# 第 8 章：访问修饰符和类属性\n\
    \n## 控制访问\n我们将回到 `Account` 类。这是为了回到我们在第 6 章创建的类。\n```java\npublic class Account\
    \ {\n    int number;\n    double balance;\n    double limit;\n    double owner;\n\
    \    boolean draw(double amount) {\n        if (amount > balance + limit) {\n\
    \            return false;\n        } else {\n            balance -= amount;\n\
    \            return true;\n        }\n    }\n    void deposit(double amount) {\n\
    \        balance += amount;\n    }\n    boolean transferTo(Account destiny, double\
    \ amount) {\n        if (amount > balance + limit) {\n            balance -= amount;\n\
    \            destiny.balance += amount;\n            return true;\n        } else\
    \ {\n            return false;\n        }\n    }\n}\n```\n控制访问\n我们将回到 `Account`\
    \ 类。这是为了回到我们在第 6 章创建的类。\n```java\npublic class Account {\n    int number;\n  \
    \  double balance;\n    double limit;\n    double owner;\n    boolean draw(double\
    \ amount) {\n        if (amount > balance + limit) {\n            return false;\n\
    \        } else {\n            balance -= amount;\n            return true;\n\
    \        }\n    }\n    void deposit(double amount) {\n        balance += amount;\n\
    \    }\n    boolean transferTo(Account destiny, double amount) {\n        if (amount\
    \ > balance + limit) {\n            balance -= amount;\n            destiny.balance\
    \ += amount;\n            return true;\n        } else {\n            return false;\n\
    \        }\n    }\n}\n```\n（注：由于提供的待翻译文本在“Controlling access”部分存在重复和截断，译文根据上下文修复了逻辑连贯性，但严格遵循了原文的结构。）\n\
    \n*纠正：重新审视原文，`Controlling access` 之后似乎是某种重复或截断的片段。我将按照您提供的文本内容进行精确翻译：*\n\n控制访问\n\
    我们将回到 `Account` 类。这是为了回到我们在第 6 章创建的类。\n```java\npublic class Account {\n    int\
    \ number;\n    double balance;\n    double limit;\n    double owner;\n    boolean\
    \ draw(double amount) {\n        if (amount > balance + limit) {\n           \
    \ return false;\n        } else {\n            balance -= amount;\n          \
    \  return true;\n        }\n    }\n    void deposit(double amount) {\n       \
    \ balance += amount;\n    }\n    boolean transferTo(Account destiny, double amount)\
    \ {\n        if (amount > balance + limit) {\n            balance -= amount;\n\
    \            destiny.balance += amount;\n            return true;\n        } else\
    \ {\n            return false;\n        }\n    }\n}\n```\n（等等，原文提供的文本在 `Controlling\
    \ access` 之后的内容似乎是混乱的重复。我将严格按照您给出的原始字符串进行翻译：）\n\n控制访问\n我们将回到 `Account` 类。这是为了回到我们在第\
    \ 6 章创建的类。\n（此处省略重复代码块，直接翻译后续文本）\n\n如果有人尝试通过不使用方法来访问 `account` 并修改 `balance`？如下：\n\
    ```java\npublic class Program {\n    public static void main( String [] args)\
    \ {\n        Account account = new Account ();\n        account.balance = -100;\n\
