  trans: "\n\n### 7) 下一个程序的输出是什么？\n```java\npublic class WorkoutSet {\n    public\
    \ static void main( String [] args) {\n        System . out . println( 'A' ==\
    \ - 1 );\n    }\n}\n```\n\n### 8) 下一个程序的输出是什么？\n```java\npublic class WorkoutSet\
    \ {\n    public static void main( String [] args) {\n        System . out . println(\
    \ 10 == 10.0 );\n    }\n}\n```\n\n### 9) Java 中布尔“与”（and）用什么运算符表示？\n### 10) Java\
    \ 中布尔“或”（or）用什么运算符表示？\n### 11) 哪些表达式的结果为 true？（示例：a, b）\na. `false && false`\n\
    b. `true && false`\nc. `false && true`\nd. `true && true`\n\n### 12) 哪些表达式的结果为\
    \ true？\na. `false || false`\nb. `true || false`\nc. `false || true`\nd. `true\
    \ || true`\n\n### 13) 哪些表达式的结果为 true？\na. `!( false ) && 10 > 1`\nb. `5 > 5.1\
    \ && true`\nc. `5 < 6 && 7 > 14 || 5 >= 5 && 12 > 0`\nd. `!( false ) && !( true)`\n\
    \n#### 答案\n1) `D`\n2) `45`\n3) `true`\n4) `true`\n5) `false`\n6) `false`\n7) `false`\n\
    8) `true`\n9) `||`\n10) `&&`\n11) `d`\n12) `b, c, d`\n13) `a, c, d`\n\n# 第 4 章：字符串与输入\n\
    \n创建一个名为 `StringsAreCool` 的类，并将生成的代码替换为以下内容：\n\n```java\npublic class StringsAreCool\
    \ {\n    public static void main( String [] args) {\n        // 创建一个名为 codenific\
    \ 的 String 对象\n        String codenific = \"Codenific\" ;\n        System . out\
    \ . println( \"1\\. \" + codenific);\n        // 添加 `.com`\n        codenific\
    \ += \".com\" ;\n        System . out . println( \"2\\. \" + codenific);\n   \
    \     // 从 String 中提取单词 `Codenific`\n        String onlyCodenific = codenific.substring(\
    \ 0 , 9 );\n        System . out . println( \"3\\. \" + onlyCodenific);\n    \
    \    // 从 String 中提取后缀 '.com'\n        String onlyDotCom = codenific.substring(\
    \ 9 , 13 );\n        System . out . println( \"4\\. \" + onlyDotCom);\n      \
    \  // 添加一些末尾空格，然后使用 trim() 将其移除\n        codenific = \"  \" + codenific + \" \
    \     \" ;\n        codenific = codenific. trim();\n        System . out . println(\
    \ \"5\\. \" + codenific);\n        // 现在输出字符串的全大写和小小写\n        System . out .\
    \ println( \"6\\. \" + codenific.toUpperCase());\n        System . out . println(\
    \ \"7\\. \" + codenific.toLowerCase());\n        System . out . println( \"->\
    \ \" + codenific. length());\n    }\n}\n```\n\n首先，阅读代码并尝试理解正在执行什么以及是如何实现的。\n\n\
    #### 字符串\n程序的第一部分创建一个名为 `codenific` 的 String 对象，并给它赋值为 `\"Codenific\"`。虽然这看起来与声明和赋值整数或其他基本类型相似，但实际上这里涉及到更多的操作。Java\
    \ 允许使用像 `=` 和 `+` 这样简单的运算符来执行简单的任务。因此，`String codenific = \" Codenific \" ;` 实际上类似于\
    \ `String codenific = new String (\" Codenific \") ;`，换句话说，创建一个 `String` 类型的新对象，并将值\
    \ `\"Codenific\"` 传递给构造函数。构造函数是一个特殊方法，只在对象创建时被调用一次。但我们将在第 6 章和第 8 章详细讨论这一点。\n\n\
    下部分展示了如何拼接字符串，在这种情况下，`\".com\"` 被添加到字符串的末尾。\n`codenific += \".com\" ;`\n由于 `String`\
    \ 是一个对象，它可以拥有方法。`String.substring()` 是一个返回字符串一部分的方法。`String onlyCodenific = codenific.substring(\
    \ 0 , 9 )` 返回 `\"codenific\"` 字符串的前九个字符（包含索引 0，但不包含 9）。而 `String onlyDotCom =\
    \ codenific.substring( 9 , 13 )` 返回从索引 9 到 13 的字符（包含索引 9，但不包含 13）。\n\n![](img/00025.jpeg)\
    \ \n\n上面的图片取自[我博客中的一篇关于 Python 的文章](http://codenific.com/2017/10/02/how-to-easily-slice-strings-in-python/)，但我们也可以用来解释\
    \ Java 的子字符串。假设字符串 `\"This is Codenific\"` 被赋值给名为 `variable` 的变量。字符串的第一个字母索引为\
    \ 0。因此，在 `\"This is Codenific\"` 中，如果你只需要第三个字母，只需执行类似 `variable.substring(2, 3)`\
    \ 的操作，因为第二个值是不包含的。同样，`variable.substring(0, 16)` 并没有返回整个字符串，而是返回 `\"This is Codenifi\"\
    `。要返回整个字符串，你必须执行 `variable.substring(0, 17)`。`String.trim()` 是另一个移除开头和末尾空格的方法。`String.toUpperCase()`\
    \ 和 `String.toLowerCase()` 方法自而易见。最后，我们的程序获取了 `String.length()` 并将其打印。\n\n####\
    \ 输入\n获取输入的简单方法是使用 `Scanner` 类。假设我们要获取一个数字。将以下代码复制到名为 `Inputs` 的新类中：\n\n```java\n\
    import java. util. Scanner;\npublic class Inputs {\n    public static void main(\
    \ String [] args) {\n        Scanner scan = new Scanner ( System . in );\n   \
    \     System . out . println( \"Enter a number: \" );\n        int n = scan. nextInt();\n\
    \        scan. close();\n        System . out . println( \"The chosen number is:\
    \ \" + n);\n    }\n}\n```\n\n"
- fmt: "\nWhen you run the program, it asks you a number. I entered 25 and then it\
    \ printed \"The chosen number is: 25\". That's no magic, I know. But, as I always\
    \ say, you have to start somewhere.\n\n### How that happened?\n\nFirst, we have\
    \ to import the `Scanner` class by writing `import java.util.Scanner;` before\
    \ the class header. By importing it, we get access to the methods and functions\
    \ of that class (we'll get back to that later in this course).\n\nThen we create\
    \ a `Scanner` object called `scan` (you can name it however you want):\n`Scanner\
    \ scan = new Scanner ( System . in );`\n\nRemember how we could extend a `String`\
    \ declaration? Just like that!\n`String scan = new String ( \"Scanning...\" );`\n\
    \nThe user can't guess what we want, so we have to put some instruction which,\
    \ in this case, is printed to the terminal.\n\nWe create an integer variable called\
    \ `n` that will store the next input as an `int` – `scan.nextInt()`. Therefore,\
    \ if the user enters a text, for example, the program will crash:\n\nOnce we are\
    \ done, we have to finish the `Scanner` object with `scan.close()`. Finally, we\
    \ print that number we got: `System . out . println( \"The chosen number is: \"\
    \ + n);`.\n\nThe same can be applied to `scan` for other data types:\n* To get\
    \ a byte: `byte a = scan . nextByte();`\n* To get a short: `short b = scan . nextShort();`\n\
    * To get a float: `float c = scan . nextFloat();`\n* To get a long: `long d =\
    \ scan . nextLong();`\n* To get a double: `double e = scan . nextDouble();`\n\
    * To get a boolean: `boolean f = scan . nextBoolean();`\n\nAnd to get Strings\
    \ as input we use `scan.next()` (assuming that our `Scanner` object is called\
    \ `scan` in this case).\n\n### Another way to import\n\nIf you type `Scanner scan\
    \ = new Scanner ( System . in );` before importing the `Scanner` class, you can\
    \ click in the word \"Scanner\" and then back away your cursor to see a red lamp\
    \ show up. Click on it, select `Import Class` and then `Scanner (java.util)`,\
    \ so that the IDE will automatically write the import statement for you!!\n\n\
    ### Another shortcut!\n\nAnd instead of typing `System.out.println()`, you can\
    \ type `sout` and click Enter:\n\n## Workout Set #3\n\nCreate a class for each\
    \ of the following exercises (like `Set3Exercise1`) and write your solution to\
    \ then compare with mine. The inputs in the examples are in *italic*.\n\n1) Write\
    \ a program that contains a `String` object in which you will put your name and\
    \ then print it.\n2) Write a program that asks for the person's name and then\
    \ greets that person.\n*Example:*\nWhat is your name?\nLucas\nHello, Lucas!\n\
    3) Write a program that removes leading and trailing spaces from a `String` entered\
    \ by the user and then prints the new `String`.\n*Example:*\nEnter a String: \
    \     Lucas      \nLucas\n4) Write a program that gets two `Strings`, concatenates\
    \ and prints them, following these rules:\n* The first `String` has to be printed\
    \ as lowercase\n* The second `String` has to be printed as uppercase\n* There\
    \ has to be one space between the two `Strings`\n*Example:*\nEnter a String: Code\n\
    Enter another String: Nific\ncode NIFIC\n5) Write a program that gets the age\
    \ of the user and then prints out the year that he/she was born.\n*Example (in\
    \ 2017):*\nHow old are you?\n16\nYou were born in 2001\n6) Write a program that,\
    \ given a number, prints out its predecessor and successor.\n*Example:*\nEnter\
    \ a number: 10\nPredecessor: 9\nSuccessor: 11\n7) Write a program that, given\
    \ a number `x`, prints:\n* 2 times `x`\n* `x` to the power of 2\n* `x` divided\
    \ by 2\n* square root of `x`\n*Example:*\nEnter a number: 9\n18\n81\n4.5\n8) Write\
    \ a program that gets two numbers and prints out the average (arithmetic mean)\
    \ of them.\n*Example 1:*\nEnter a number: 8\nEnter another number: 10\nThe average\
    \ is 9.0\n*Example 2:*\nEnter a number: 7\nEnter another number: 9.5\nThe average\
    \ is 8.25\n9) Write a program that calculates the price of a product after a 10%\
    \ discount.\n*Example 1:*\nWhat is the price of the product? 120\nAfter a 10%\
    \ discount, this product will be sold for $ 108\n*Example 2:*\nWhat is the price\
    \ of the product? 253.9\nAfter a 10% discount, this product will be sold for $\
    \ 228.51\n\nIf you're getting this error: `Exception in thread \"main\" java.util.InputMismatchException`,\
    \ you might need to use something like `scan.useLocale(Locale.US)` (considering\
    \ your `Scanner` object is called `scan`) and `import java.util.Locale`. Or you\
    \ could enter the input as `120,0` instead of `120.0`. That error is because your\
    \ country's number formatting is different from the US (like me, Brazilian).\n\
    \n10) Write a program that converts a temperature from Celsius to Fahrenheit.\
    \ Use the formula below:\n*Example:*\nEnter the temperature in Celsius: 30.0ºC\
    \ is equivalent to 86.0º\n\nIf you're getting this error: `Exception in thread\
    \ \"main\" java.util.InputMismatchException`, you might need to use something\
    \ like `scan.useLocale(Locale.US)` (considering your `Scanner` object is called\
    \ `scan`) and `import java.util.Locale`. Or you could enter the input as `120,0`\
    \ instead of `120.0`. That error is because your country's number formatting is\
    \ different from the US (like me, Brazilian).\n\n### Answers\n\n```java\nclass\
    \ Program {\n    public static void main( String [] args) {\n        String name\
    \ = \"Your name here\";\n        System.out.println(name);\n    }\n}\n```\n\n\
    ```java\nimport java.util.Scanner ;\n\nclass Main {\n    public static void main(\
    \ String [] args) {\n        System.out.println(\"What is your name?\");\n   \
    \     Scanner scan = new Scanner ( System . in );\n        String name = scan.\
    \ next ();\n        System.out.println(\"Hello, \" + name + \"!\");\n    }\n}\n\
    ```\n\n```java\nimport java.util.Scanner ;\n\nclass Main {\n    public static\
    \ void main( String [] args) {\n        System.out.println(\"Enter a String:\"\
    );\n        Scanner scan = new Scanner ( System . in );\n        String text =\
    \ scan. next ();\n        System.out.println(text.trim());\n    }\n}\n```\n\n\
    ```java\nimport java.util.Scanner ;\n\nclass Main {\n    public static void main(\
    \ String [] args) {\n        Scanner scan = new Scanner ( System . in );\n   \
    \     System.out.println(\"Enter a String:\");\n        String s1 = scan. next\
    \ ();\n        System.out.println(\"Enter another String:\");\n        String\
    \ s2 = scan. next ();\n        System.out.println(s1.toLowerCase() + \" \" + s2.toUpperCase());\n\
    \    }\n}\n```\n\n```java\nimport java.util.Scanner ;\n\nclass Main {\n    public\
    \ static void main( String [] args) {\n        Scanner scan = new Scanner ( System\
    \ . in );\n        System.out.println(\"How old are you?\");\n        int age\
    \ = scan. nextInt();\n        scan.close();\n        int born = 2017 - age;\n\
    \        System.out.println(\"You were born in \" + born);\n    }\n}\n```\n\n\
    ```java\nimport java.util.Scanner ;\n\nclass Main {\n    public static void main(\
    \ String [] args) {\n        Scanner scan = new Scanner ( System . in );\n   \
    \     System.out.println(\"Enter a number:\");\n        int n = scan. nextInt();\n\
    \        scan.close();\n        int predecessor = n - 1;\n        int successor\
    \ = n + 1;\n        System.out.println(\"Predecessor: \" + predecessor);\n   \
    \     System.out.println(\"Successor: \" + successor);\n    }\n}\n```\n\n```java\n\
    import java.util.Scanner ;\n\nclass Main {\n    public static void main( String\
    \ [] args) {\n        Scanner scan = new Scanner ( System . in );\n        System.out.println(\"\
    Enter a number:\");\n        int n = scan. nextInt();\n        System.out.println(2\
    \ * n);\n        System.out.println(Math.pow(n, 2));\n        System.out.println(n\
    \ / 2.0);\n        System.out.println(Math.sqrt(n));\n    }\n}\n```\n\n```java\n\
    import java.util.Scanner ;\n\nclass Main {\n    public static void main( String\
    \ [] args) {\n        Scanner scan = new Scanner ( System . in );\n        System.out.println(\"\
    Enter a number:\");\n        int n1 = scan. nextInt();\n        System.out.println(\"\
    Enter another number:\");\n        int n2 = scan. nextInt();\n        scan. close();\n\
    \    }\n}\n```\n"
