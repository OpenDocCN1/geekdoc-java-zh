  trans: "\n\n```java\nSystem.out.println( 6.0 % 4.0 ); // 2.0\n```\n\n### 递增\n与其编写\
    \ `i = i + 1;` 甚至 `i += 1;` ……，你可以编写 `i++;`。这就是递增运算符的作用：给变量中存储的数字加 1。\n\n### 递减\n\
    该运算符执行相反的操作。与其编写 `i = i - 1;` 甚至 `i -= 1;` …… 而是你可以编写 `i--;`。这就是递减运算符的作用：从变量中存储的数字减去\
    \ 1。\n\n### 关系运算符\n关系运算符用于比较具有定义顺序的数据类型，例如数字（因为数字要么比其他数字小，要么比它们大）。\n\n- **等于：`==`**\
    \ - 检查两个操作数的值是否相等，如果是，则条件变为真。\n  ```java\n  System.out.println( 1 == 1 ) // true\n\
    \  System.out.println( 3 == 0 ) // false\n  ```\n  *注意！等号运算符 `==` 与赋值运算符 `=` 不同。*\n\
    \n- **不等于：`!=`** - 检查两个操作数的值是否相等，如果值不相等，则条件变为真。\n  ```java\n  System.out.println(\
    \ 3 != 1 ) // true\n  System.out.println( 10 != 10 ) // false\n  ```\n\n- **大于：`>`**\
    \ - 检查左操作数的值是否大于右操作数的值，如果是，则条件变为真。\n  ```java\n  System.out.println( 3 > 1 ) //\
    \ true\n  System.out.println( 10 > 10 ) // false\n  System.out.println( 1 > 10\
    \ ) // false\n  ```\n\n- **小于：`<`** - 检查左操作数的值是否小于右操作数的值，如果是，则条件变为真。\n  ```java\n\
    \  System.out.println( 1 < 40 ) // true\n  System.out.println( 12 < 6 ) // false\n\
    \  System.out.println( 1 < 1 ) // false\n  ```\n\n- **大于等于：`>=`** - 检查左操作数的值是否大于或等于右操作数的值，如果是，则条件变为真。\n\
    \  ```java\n  System.out.println( 12 >= 6 ) // true\n  System.out.println( 7 >=\
    \ 7 ) // true\n  System.out.println( 1 >= 5 ) // false\n  ```\n\n- **小于等于：`<=`**\
    \ - 检查左操作数的值是否小于或等于右操作数的值，如果是，则条件变为真。\n  ```java\n  System.out.println( 6 <= 12\
    \ ) // true\n  System.out.println( 7 <= 7 ) // true\n  System.out.println( 6 <=\
    \ 4 ) // false\n  ```\n\n### 逻辑运算符\n也称为逻辑运算符，用于比较布尔值（`true` 和 `false`），这些值可以是我们程序逻辑的一部分。\n\
    \n#### 与：`&&`\n与逻辑运算符在 Java 中用 `&&` 表示。只有当 `&&` 两侧的表达式都为真时，它才返回布尔值 `true`。\n```java\n\
    System.out.println( true && true ); // prints true\nSystem.out.println( false\
    \ && false ); // prints false\nSystem.out.println( false && true ); // prints\
    \ false\nSystem.out.println( true && false ); // prints false\n```\n我们也可以将布尔运算符\
    \ `&&` 用于如下所示的布尔表达式：\n```java\nSystem.out.println( 5 > 0 && 9 < 10 );\n```\n上面的示例将打印出\
    \ `true`，因为“5 大于 0”和“9 小于 10”这两个语句都是真的。\n\n#### 或：`||`\n或逻辑运算符在 Java 中用 `||` 表示。当\
    \ `||` 任意一侧至少有一个表达式为真时，它会返回布尔值 `true`。\n```java\nSystem.out.println( false ||\
    \ false ); // prints false\nSystem.out.println( false || true ); // prints true\n\
    System.out.println( true || false ); // prints true\nSystem.out.println( true\
    \ || true ); // prints true\n```\n我们也可以将布尔运算符 `||` 用于如下所示的布尔表达式：\n```java\nSystem.out.println(\
    \ 5 > 2 || 1 > 34 );\n// 等于：\nSystem.out.println( true || false );\n```\n上面的示例将打印出\
    \ `true`，因为至少有一个语句——“5 大于 2”是真的，即使另一个语句——“1 大于 34”是假的。\n\n#### 非：`!`\n非逻辑运算符在\
    \ Java 中用 `!` 表示。它将返回紧随其后的表达式的相反值。如果表达式为 `true`，它返回 `false`；如果表达式为 `false`，它返回\
    \ `true`。\n```java\nSystem.out.println(! false ); // \"Not false\" - prints true\n\
    System.out.println(! true ); // \"Not true\" - prints false\n```\n我们也可以将布尔运算符\
    \ `!` 用于如下所示的布尔表达式：\n```java\nSystem.out.println( !( 5 <= 25 ) );\n```\n上面的示例将输出\
    \ `false`，因为 `5 <= 25` 是真的。\n\n### 运算符优先级\n运算符的优先级决定了表达式计算的顺序。括号 `()` 可以强制改变计算顺序。\n\
    \n在 Java 中，运算符的优先级顺序如下：\n1. 括号 `()`\n2. 递增/递减运算符 `++`, `--`\n3. 一元运算符（如 `!`, `-`）\n\
    4. 乘除运算符 `*`, `/`, `%`\n5. 加减运算符 `+`, `-`\n6. 关系运算符 `<`, `<=`, `>=`, `>=`, `==`,\
    \ `!=`\n7. 逻辑与运算符 `&&`\n8. 逻辑或运算符 `||`\n9. 赋值运算符 `=`, `+=`, `-=` 等\n\n#### 递增和递减运算符\n\
    `++` 和 `--` 通常用于改变变量的值。\n```java\nint i = 5;\ni++; // i 变为 6\ni--; // i 变为 5\n\
    ```\n\n#### 赋值运算符\n赋值运算符用于将值赋给变量。\n```java\nint x = 10;\nx += 5; // 等同于 x = x\
    \ + 5;\nx -= 3; // 等同于 x = x - 3;\nx *= 2; // 等同于 x = x * 2;\nx /= 4; // 等同于 x\
    \ = x / 4;\nx %= 3; // 等同于 x = x % 3;\n```\n\n"
- fmt: "\n### 7) What will be the output of the following program?\n```java\npublic\
    \ class WorkoutSet {\n    public static void main( String [] args) {\n       \
    \ System . out . println( 'A' == - 1 );\n    }\n}\n```\n\n### 8) What will be\
    \ the output of the following program?\n```java\npublic class WorkoutSet {\n \
    \   public static void main( String [] args) {\n        System . out . println(\
    \ 10 == 10.0 );\n    }\n}\n```\n\n### 9) Boolean \"and\" is represented in Java\
    \ by what operator?\n### 10) Boolean \"or\" is represented in Java by what operator?\n\
    ### 11) Which expressions evaluate to true? (example: a, b)\na. `false && false`\n\
    b. `true && false`\nc. `false && true`\nd. `true && true`\n\n### 12) Which expressions\
    \ evaluate to true?\na. `false || false`\nb. `true || false`\nc. `false || true`\n\
    d. `true || true`\n\n### 13) Which expressions evaluate to true?\na. `!( false\
    \ ) && 10 > 1`\nb. `5 > 5.1 && true`\nc. `5 < 6 && 7 > 14 || 5 >= 5 && 12 > 0`\n\
    d. `!( false ) && !( true)`\n\n#### Answers\n1) `D`\n2) `45`\n3) `true`\n4) `true`\n\
    5) `false`\n6) `false`\n7) `false`\n8) `true`\n9) `||`\n10) `&&`\n11) `d`\n12)\
    \ `b, c, d`\n13) `a, c, d`\n\n# Chapter 4: Strings and Getting Input\n\nCreate\
    \ a new class called `StringsAreCool` and replace the generated code with the\
    \ following:\n\n```java\npublic class StringsAreCool {\n    public static void\
    \ main( String [] args) {\n        // Create a String object called codenific\n\
    \        String codenific = \"Codenific\" ;\n        System . out . println( \"\
    1\\. \" + codenific);\n        // Add `.com`\n        codenific += \".com\" ;\n\
    \        System . out . println( \"2\\. \" + codenific);\n        // Extract the\
    \ word `Codenific` from the String\n        String onlyCodenific = codenific.substring(\
    \ 0 , 9 );\n        System . out . println( \"3\\. \" + onlyCodenific);\n    \
    \    // Extract the sufix '.com' from the String\n        String onlyDotCom =\
    \ codenific.substring( 9 , 13 );\n        System . out . println( \"4\\. \" +\
    \ onlyDotCom);\n        // Add some trailing spaces and then remove them with\
    \ trim()\n        codenific = \"  \" + codenific + \"      \" ;\n        codenific\
    \ = codenific. trim();\n        System . out . println( \"5\\. \" + codenific);\n\
    \        // Now output the string all in UPPERCASE and lowercase\n        System\
    \ . out . println( \"6\\. \" + codenific.toUpperCase());\n        System . out\
    \ . println( \"7\\. \" + codenific.toLowerCase());\n        System . out . println(\
    \ \"-> \" + codenific. length());\n    }\n}\n```\n\nFirst of all, read the code\
    \ and try to figure out what is being done and how is that happening.\n\n####\
    \ Strings\nThe first part of the program creates a String object called `codenific`\
    \ and gives it a value of `\"Codenific\"`. Although this may look similar to how\
    \ you declare and assign an integer or another primitive type, actually there\
    \ is a lot more going on here. Java allows simple operators like `=` and `+` to\
    \ be assigned simple tasks. So really `String codenific = \" Codenific \" ;` is\
    \ actually something like `String codenific = new String (\" Codenific \") ;`,\
    \ in other words, create a new object of type `String` and pass in the value `\"\
    Codenific\"` to the constructor. The constructor is a special method called only\
    \ once, at the moment that the object is created. But we will talk more about\
    \ that on Chapters 6 and 8.\n\nThe next part shows how you can concatenate strings,\
    \ in this case `\".com\"` is added to the end of the string.\n`codenific += \"\
    .com\" ;`\nSince `String` is an object, it can have methods. `String.substring()`\
    \ is a method which returns part of a string. `String onlyCodenific = codenific.substring(\
    \ 0 , 9 )` returns the first nine characters of the `\"codenific\"` String (it\
    \ includes index 0, but not 9). And `String onlyDotCom = codenific.substring(\
    \ 9 , 13 )` returns the characters from indexes 9 to 13 (it includes index 9,\
    \ but not 13).\n\n![](images/00025.jpeg) \n\nThe image above was taken from [a\
    \ Python post in my blog](http://codenific.com/2017/10/02/how-to-easily-slice-strings-in-python/),\
    \ but we can use it to explain Java substrings as well. Consider the String `\"\
    This is Codenific\"` was assigned to a variable called `variable`. The first letter\
    \ of a String has a zero index. So, in `\"This is Codenific\"`, if you want only\
    \ the third letter, you just have to do something like `variable.substring(2,\
    \ 3)` because the second value isn't inclusive. In the same way, `variable.substring(0,\
    \ 16)` doesn't return the entire String above, it returns `\"This is Codenifi\"\
    `. To return the entire String, you have to do `variable.substring(0, 17)`. `String.trim()`\
    \ is another method which removes leading and trailing spaces. `String.toUpperCase()`\
    \ and `String.toLowerCase()` methods are very self-explaining. Lastly, our program\
    \ gets the `String.length()` and prints it.\n\n#### Input\nThe easiest way to\
    \ get input is by using the `Scanner` class. Suppose we wanted to get a number.\
    \ Copy and paste the following code into a new class called `Inputs`:\n\n```java\n\
    import java. util. Scanner;\npublic class Inputs {\n    public static void main(\
    \ String [] args) {\n        Scanner scan = new Scanner ( System . in );\n   \
    \     System . out . println( \"Enter a number: \" );\n        int n = scan. nextInt();\n\
    \        scan. close();\n        System . out . println( \"The chosen number is:\
    \ \" + n);\n    }\n}\n```\n"
