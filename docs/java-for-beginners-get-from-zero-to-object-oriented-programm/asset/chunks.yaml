    That results in an infinite while loop.8) -Chapter 6: Intro to Object-Oriented
    JavaObject-oriented programming (OOP) is a programming language model organized
    around objects rather than "actions" and data rather than logic. Examples of objects
    range from human beings (described by name, address, and so forth) to buildings
    and floors – whose properties (attributes ) can be described and modified (through
    methods ) down to the little.What are the advantages of programming in object-oriented
    languages like Java?●        Being more organized●        Writing less●      
    Concentrating responsibilities at the right points, making your application more
    flexible, encapsulating business logic.Soon we will see all this advantage, but
    first you need to know a bit more about the syntax and creation of types and references
    in Java.Classes x ObjectsIn a banking software, a crucial part of the system is
    an account . The idea is to generalize some information, along with functionalities
    that every bank account must have. Like…●        Bank account number●        Name
    of the owner●        Bank account balance●        Limit (to withdraw)What every
    account does that is important to us? That is, what would we like to ask the account
    to do?●        Draw an amount of x dollars●        Deposit an amount of x dollars●
           Print out the name of the owner●        Get the current balance●       
    Get the limit●        Transfer an amount of x dollars to another account●       
    Get the type of accountWith those things in mind, we have the project of a bank
    account. Can we take that project and get its current balance? No. What we have
    is just a project. First, we have to build an actual account in order to access
    it and ask it to do something.![](images/00032.jpeg)Notice the image: although
    the paper on the left side specifies an Account, is it an Account? Do we deposit
    and take money out of that paper? No. We use the Account specification to be able
    to create instances that really are accounts, where we can perform the operations
    we create.Even though we declare that every account has a balance, a number, and
    an agency on the piece of paper (as on the left in the image), it is in the instances
    of this project that there is room to store those values.That “project” (specifications
    for a bank account) is called a class . And what we can construct from that class
    are called objects .The word class in this context comes from biology’s taxonomy.
    All living things that belong to the same biological class have a series of attributes
    and behaviors in common, but they aren’t equal, because the values of these attributes
    and behaviors can differ from one living being to another.Homo sapiens sapiens
    defines a group of beings that have characteristics in common, but is the definition/idea/concept
    of a Homo sapiens sapiens an actual human being? Everything is specified in Homo
    sapiens sapiens class, but in order to ask a person to run, eat or jump, we’ll
    need to instantiate that class, by creating an object of type Homo sapiens sapiens
    .Another example: a cake recipe. We don’t eat a cake recipe, but we use it to
    make an actual cake. The recipe is the class and the cake is the object . We can
    create thousands of cakes based on that single recipe. Some cakes may be similar
    and some might even be identical, but they are different objects .Think about
    a class as a blueprint and the object as the tangible thing.Creating a classOpen
    your IDE, create a new Java class called Account and start typing what you see
    next. Let’s start with what an account has:public class Account {int number;String
    owner;double balance;}These are the attributes that every created account will
    have. Note that those variables were not declared inside a block, like we did
    when we had the main method. When a variable is declared directly inside the scope
    of a class, it’s called an object variable, or attribute. The balance will be
    a double, but it shouldn’t be used for currencies.Creating and using an objectWe
    already have a class in Java that specifies what every object of that class must
    have. But how can we use it? Besides that class, we will have Program.java, in
    which we’ll use the Account class.To create (construct, instantiate) an Account,
    we have to use the keyword new and parenthesis.public class Program {public static
    void main( String [] args) {new Account ();}}Well, the code above creates an object
    of type Account , but how can we access that object? We need a way to reference
    it. We need a… variable! In this case, a variable of type Account.public class
    Program {public static void main( String [] args) {Account myAccount;myAccount
    = new Account ();}}Through myAccount , we can access the newly created object
    to change its owner , balance , limit , etc.public class Program {public static
    void main( String [] args) {Account myAccount;myAccount = new Account ();myAccount.
    owner = " Lucas ";myAccount. balance = 10000.0;System . out . println(" Current
    balance: " + myAccount. balance);}}It’s important to say that the dot was used
    to access something in myAccount . In the code above, myAccount belongs to Lucas
    – me! – and has 10,000 dollars.MethodsInside the class, we’ll also declare what
    each account does and how it’s done – its behaviors. For example, if there’s a
    specific way to draw an amount of money, we’re going to put it inside the Account
    class itself. That’s why those “functions” are called methods , because they are
    a way to do some operation with an object.We want to create a method that draws
    an amount of money from the account and doesn’t retrieve any information to whom
    uses this method.public class Account {// other attributes and methods...void
    draw( double amount) {double newBalance = this . balance - amount;this . balance
    = newBalance;}}The keyword void indicates that no information is going to be sent
    back to whom asked to draw from the account.When someone asks to draw from the
    account, that person will also say how much he/she wants to draw. That’s why we
    have to declare the method with something inside the parenthesis. And what goes
    inside it is called the method’s argument (or parameter ). You can have multiple
    parameters in the same method. That variable is also called a temporary or local
    variable that no longer exists once the method is done executing.We declared a
    variable inside the method (newBalance ) that will be destroyed by the end of
    the method, because that is its scope. We used the keyword this to show that balance
    was an attribute, not just a simple variable.Note that the person can violate
    the limit that was fixed by the bank, because there’s no actual limitation so
    far. But we’re going to fix that soon.We can also have a method to make a deposit:public
    class Account {// other attributes and methods...void deposit( double amount)
    {this . balance += amount;}}Do you see how we didn’t declare more variables this
    time? And we also used the operator += to keep things short.We also use the dot
    to send a message to the object and ask it to execute a method. That’s called
    method invocation .The following code withdraws money from the account and then
    deposits another amount.public class Program {public static void main( String
    [] args) {Account myAccount;myAccount = new Account ();myAccount. number = 12345;myAccount.
    owner = "Lucas";myAccount. balance = 1000.0;myAccount. draw( 200.0 );myAccount.
    deposit( 500.0 );System . out . println( myAccount. balance);}}Methods that return
    somethingWhen a method does not return anything, we use the keyword void . But
    we can return some value of any data type. In our draw method, we could return
    a boolean value to tell if the operation was completed successfully.public class
    Account {// other attributes and methods...boolean draw( double amount) {if (
    this . balance < amount) {return false;} else {this . balance -= amount;return
    true;}}}In the code above, the operation won’t happen if there isn’t enough money
    in the account. In this case, the method will return false . Else, the operation
    will happen and true will be returned.Note that I replaced void with boolean ,
    to indicate the new return type. And inside the method there are return statements
    that return the value we want. Don’t forget the semicolon. Our method stops once
    something is returned.Therefore…public class Account {// other attributes and
    methods...boolean draw( double amount) {if ( this . balance < amount) {return
    false;System . out . println (" False ");} else {this . balance -= amount;return
    true;System . out . println (" True ");}}}With the code above, nothing would be
    ever printed, because the System.out.println() statements are placed after the
    return statements.Here’s how we could use that new draw method:public class Program
    {public static void main( String [] args) {Account myAccount = new Account ();myAccount.
    balance = 1000.0;boolean success = myAccount. draw( 200.0 );if ( success) {System
    . out . println (" I got my money !");} else {System . out . println (" Where
    is my money ?");}}}I can even eliminate the intermediate variable (success ):public
    class Program {public static void main( String [] args) {Account myAccount = new
    Account ();myAccount. balance = 1000.0;if ( myAccount. draw( 200.0 )) {System
    . out . println (" I got my money !");} else {System . out . println (" Where
    is my money ?");}}}And, of course, you can have multiple accounts in the same
    program:public class Program {public static void main( String [] args) {Account
    myAccount = new Account ();myAccount. balance = 1000.0;Account mySecondAccount
    = new Account ();mySecondAccount. balance = 500.0;}}Objects are accessed through
    referencesWhen we declare a variable and assign it an object, the variable does
    not hold the object itself, but rather a way to access it, which is called a reference
    .That’s why we need to use new when declaring the variable, unlike what we do
    with primitive data types like int and long .Account a1;'
