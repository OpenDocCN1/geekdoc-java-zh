  raw: 'We’re not diving into the details of each access modifier now (I haven’t even
    talked about Protected yet!). I just want you to know for now that there are some
    differences between each keyword and you don’t have to memorize them. Keep in
    mind that they are like security levels for your attributes and methods.It is
    very common to make your attributes private and almost all your methods public,
    although that’s not a rule.EncapsulationWhat we began to see in this chapter is
    the idea of encapsulating , that is, hiding all members of a class, as well as
    hiding how the routines (methods) of our system work.Encapsulating is key to making
    your system susceptible to changes: we will not need to change a business rule
    in multiple places, but in only one place, since that rule is encapsulated. (see
    the draw() method example).The set of public methods in a class is also called
    the class interface , since they are the only way you can communicate with objects
    of that class. See how that’s represented in the image below:![](images/00043.jpeg)It
    is always a good idea to program with the interface of your class in mind – how
    your users will be using it – and not just how it will work.The implementation
    itself (the content of the methods) doesn’t not matter so much to the user of
    the class, since he/she only needs to know what each method does, not how it does
    (as it may change with time). Whenever we are going to access an object, we use
    its interface. There are several analogies in the real world. Here’s one:When
    you drive a car, what matters to you are the pedals and the steering wheel (interface)
    - not the engine you are using (implementation). Of course a different engine
    can give you better results, but what it does is the same as a less powerful engine,
    the difference lies in how it does. If you get a new engine, you don’t have to
    relearn how to drive! Changing the implementation does not imply in changing the
    interface, which allows other classes to continue using it the same way.Getters
    and SettersThe private modifier causes no one to be able to modify, or even read,
    a desired attribute. So how can we show the balance of an Account, if we can no
    longer access it?Let’s use a method then! It makes sense to call it getBalance()
    :public class Account {// ...private double balance;public double getBalance()
    {return this . balance;}// ...}Here’s how we can access the balance of an account:public
    class Program {public static void main( String [] args) {Account account = new
    Account ();account. deposit( 250 );System . out . println( "Balance = " + account.
    getBalance());}}To allow access to the attributes (since they are private) in
    a controlled way, the most common practice is to create two methods: one that
    returns the value and another that changes the value.The convention is that they
    start with the words get and set , respectively. This is how our class would look
    like if we wanted to write getters and setters for balance , limit and owner :public
    class Account {private double balance;private double limit;private Client owner;public
    double getBalance() {return balance;}public void setBalance( double balance) {this
    . balance = balance;}public double getLimit() {return limit;}public void setLimit(
    double limit) {this . limit = limit;}public Client getOwner() {return owner;}public
    void setOwner( Client owner) {this . owner = owner;}}But you don’t have to write
    all those methods by yourself. Use your IDE! Let your cursor in an empty line
    in which you want to put the getters and setters. Select Code >> Generate...![](images/00044.jpeg)Select
    Getter and Setter.![](images/00045.jpeg)Use Shift or Ctrl (Windows) to select
    the attributes you want to generate getter/setter for (balance , limit and owner
    in this case) and then hit OK.![](images/00046.jpeg)There you go!It is a bad practice
    to create a class and then create getters and setters for all its attributes.
    You should only create a getter or setter if you really need it . Note that in
    this example setBalance() should not have been created, since we want everyone
    to use deposit() and draw() .Another important detail: a getX method does not
    necessarily return the value of an attribute called X that belongs to the respective
    object. This is interesting for encapsulation. Imagine this situation: we want
    the bank to always show the balance as limit + balance (a common practice among
    banks to deceive their customers).We could always call account.getLimit() + account.getBalance()
    , but this could generate a "replace all" situation when we needed to change how
    the balance is shown. Let’s encapsulate it inside the getBalance() itself. Look:public
    double getBalance() {return this . balance + this . limit;}And we also shouldn’t
    create getLimit() and setLimit() or even getOwner() and setOwner() right now since
    we don’t need those yet. That leaves us with just the necessary for now:public
    class Account {// attributes...public double getBalance() {return this . balance
    + this . limit;}// methods...}Using getters and setters not only helps you protect
    your attributes, but it also allows you to make changes in just one place – what
    we call encapsulating –, because it hides the way objects store their data. It
    is a very important practice!There is still another issue with our class. If a
    person deposits a negative amount (even though it doesn’t exist in real life,
    it can happen here), the balance will be negative. Like this:public class Program
    {public static void main( String [] args) {Account account = new Account ();account.
    deposit(- 250 );}}What method should we fix in order to prevent that from happening?The
    deposit() method, of course! It has to check if the amount entered is positive
    before depositing it. And thanks to encapsulation, that’s the only change we need
    to do. Go ahead and do that.…void deposit( double amount) {if ( amount > 0 ) {this
    . balance += amount;}}ConstructorsWhen we use the new keyword, we’re constructing
    an object. new always runs the class constructor , which is a block of code with
    the same name of the class:public class Account {// attributes...// constructor:Account
    () {System . out . println( "Constructing an account..." );}// methods...}So when
    we do:public class Program {public static void main( String [] args) {Account
    account = new Account ();}}“Constructing an account…” gets printed. It’s like
    a initialization routine for whenever we create a new object. A constructor is
    not a method! (even though it looks like one)Default constructorWhen you don’t
    declare a constructor in your class, Java creates one for you. This constructor
    is the default constructor, it receives no arguments and its body is empty.That’s
    why we could create new objects earlier, even without having specified any constructor.
    Now the default constructor is no longer in use, because we provided ours.Constructors
    with argumentsConstructors can receive arguments, to initialize some kind of information.
    Look how awesome is that:public class Account {// attributes…Account ( Client
    owner) {this . owner = owner;System . out . println( "Constructing an account
    for " + owner. name + "..." );}// methods...}this.owner = owner means that the
    owner of the new account (this.owner) will be the client that is entered as argument
    (owner).Now you have to enter a Client when creating a new Account object:public
    class Program {public static void main( String [] args) {Client myClient = new
    Client ();myClient. name = "Lucas";Account account = new Account ( myClient);}}And
    this is printed: Constructing an account for Lucas...Awesome!Why do we need a
    constructor?We survived before having a constructor. So why do we need one?Since
    every Account needs an owner , the best thing you can do is to require an owner
    at the moment you’re creating an object of type Account.That’s what a constructor
    does. It gives possibilities or forces the user to enter some data when creating
    a new object.Multiple ConstructorsYou can have multiple constructors in your class
    and the appropriate one will be chosen.public class Account {int number;private
    double balance;private double limit;Client owner;Account ( Client owner) { //
    #1this . owner = owner;}Account ( int number, Client owner) { // #2this . owner
    = owner;this . number = number;}}--------------------------------------------public
    class Program {public static void main( String [] args) {Client c1 = new Client
    ();c1. name = "Olivia";Account a1 = new Account ( c1);   // #1Client c2 = new
    Client ();c2. name = "Fitz";Account a2 = new Account ( 199525 , c2); // #2}}Note
    that Account a1 uses the constructor #1 and Account a2 uses the constructor #2
    .But there is some repetition in constructor #2: this . owner = owner; gets repeated.To
    solve that, we call constructor #1 within constructor #2, like this:public class
    Account {int number;private double balance;private double limit;Client owner;Account
    ( Client owner) {this . owner = owner;}Account ( int number, Client owner) {this
    ( owner); // !!!this . number = number;}}In this ( owner) , you can think of this
    ( ) as Account ( ) . And since it’s only taking owner as argument, it’s calling
    the constructor #1 – Account ( Client owner) .Class attributesSuppose our Bank
    also wants to control the quantity of existing accounts. How could we implement
    that?A simple idea would be:public class Program {public static void main( String
    [] args) {int totalOfAccounts = 0;Client c1 = new Client ();c1. name = "Olivia";Account
    a1 = new Account ( c1);totalOfAccounts += 1;}}But doing that would spread statements
    all over our code, making it hard to track them and change stuff. Imagine having
    to increment that variable manually every time we created a new Account object!
    It would be hard to remember, right? So why don’t we automate that?What about
    this…?public class Account {private int totalOfAccounts;// ...Account ( Client
    owner) {this . owner = owner;totalOfAccounts += 1;}}If we create two objects,
    for example, each one will have its own totalOfAccounts variable that will be
    equal to 1\. That’s not what we wanted.We want this variable to be unique , shared
    by all objects in that class . In this way, when you change it through an object,
    another object would see the same value. To do this in Java, we declare the variable
    as static .private static int totalOfAccounts;When we declare an attribute as
    static , it becomes a class attribute , which is stored by the class, not by a
    single object. To access a static attribute, we don’t use the keyword this , but
    rather the name of the class itself.public class Account {private static int totalOfAccounts;//
    ...Account () {Account . totalOfAccounts += 1;}}Since the attribute totalOfAccounts
    is private , we need a getter to access its value from outside the Account class.
    Let’s create one:public class Account {private static int totalOfAccounts;// ...Account
    () {Account . totalOfAccounts += 1;}public int getTotalOfAccounts() {return Account
    . totalOfAccounts;}}How can we know how many accounts were created?public class
    Program {public static void main( String [] args) {Client c1 = new Client ();c1.
    name = "Olivia";Account a1 = new Account ( c1);int total = a1. getTotalOfAccounts();}}But
    there’s a problem: we have to create an account in order to get the total of accounts.
    We want to access that value without depending on an object.getTotalOfAccounts(
    ) should belong to the whole class, not each object. Just like we did with variable
    totalOfAccounts .public class Account {private static int totalOfAccounts;// ...public
    static int getTotalOfAccounts() {return Account . totalOfAccounts;}// ...}And
    this is how we access it now:public class Program {public static void main( String
    [] args) {int total = Account . getTotalOfAccounts();}}Workout Set #81)Employee.javapublic
    class Employee {private String name;private double salary;}Program.javapublic
    class Program {public static void main( String [] args) {Employee e1 = new Employee
    ();e1. name = "Lucas";e1. salary = 100000;}}What is wrong with those codes in
    the way they are presented? Write down your answer.2) Create a new class called
    “Client” (if don’t have one yet) and paste the following code:class Client {String
    name;String lastName;String address;}Now manually create getters and setters for
    all attributes.Attention! That’s not something you should do when creating a real
    program. We’re just doing this to practice. Only create getters and setters when
    they are needed!3) Paste the following codes in the appropriate Java classes and
    replace the question marks with the correct code to produce the desired output:public
    class Program {public static void main( String [] args) {Employee e1 = new Employee
    ( "Lucas" , 100000 );Employee e2 = new Employee ( "Olivia" , 120000 );Employee
    e3 = new Employee (???); // Enter your name and salary}}public class Employee
    {String name;double salary;Employee (???) {System . out . println(???);}}Output:Lucas
    --- 100000.0Olivia --- 120000.0…4) What will be printed after Program.java gets
    executed?Employee.javapublic class Employee {String name;double salary;Employee
    () {System . out . println( "Creating employee..." );}Employee ( String name)
    {System . out . println( "Creating employee " + name + "..." );}}Program.javapublic
    class Program {public static void main( String [] args) {String name = "Luke";Employee
    employee = new Employee ();}}5) What happens when you declare something as static
    ?Answers1) The attributes name and salary are private , so they can’t be accessed
    directly from outside the class Employee . We need getters/setters to do that.2)class
    Client {String name;String lastName;String address;public String getName() {return
    name;}public void setName( String name) {this . name = name;}public String getLastName()
    {return lastName;}public void setLastName( String lastName) {this . lastName =
    lastName;}public String getAddress() {return address;}public void setAddress(
    String address) {this . address = address;}}3)public class Program {public static
    void main( String [] args) {Employee e1 = new Employee ( "Lucas" , 100000 );Employee
    e2 = new Employee ( "Olivia" , 120000 );Employee e3 = new Employee ( "Your name"
    , 0 );}}public class Employee {String name;double salary;Employee ( String name,
    double salary) {System . out . println( name + " --- " + salary);}}4) “Creating
    employee…”. Since no argument is given to the constructor, the object will be
    created by using the following:Employee () {System . out . println( "Creating
    employee..." );}5) When we declare an attribute as static , it becomes a class
    attribute , which is stored by the class, not by a single object. Something static
    in Java is unique , shared by all objects in that class . In this way, when you
    change it through an object, another object would see the same value. To access
    a static attribute, we don’t use the keyword this , but rather the name of the
    class itself.Chapter 9: Inheritance and PolymorphismInheritanceIn Workout Set
    #6, you created a class called Employee. Now we’re going to use it, but with less
    attributes:public class Employee {String name;String id;double salary;}This is
    what your project structure should look like:![](images/00047.jpeg)Go ahead and
    delete classes that we’re no longer using / create new ones that are missing.Besides
    regular employees, a bank has job titles like managers. They have the same data
    that other employees have plus extra information like a password to access the
    internal banking system and the number of employees that are managed.public class
    Manager {String name;String id;double salary;int password;int numberOfEmployeesManaged;public
    boolean authenticate( int password) {if ( this . password == password) {System
    . out . println ( "Access granted!" );return true;} else {System . out . println
    ( "Access denied!" );return false;}}// ...}Do we really need another class?Well,
    you could think “Why don’t we put all those attributes inside the Employee class
    and some of them woul be just optional?”. That’s a possibility, but if there are
    so many optional attributes, the class would start looking weird and not very
    readable. Think about the methods: authenticate() doesn’t even make sense in the
    Employee class.So, we need another class, but this way we’re copying and pasting
    a bunch of code that is the same in both classes. Imagine if we had to create
    another one for a different job title!There is a way, in Java, of connecting classes
    in such a way that one of them inherits everything the other has. In our case,
    we would like to make the Manager have everything an Employee has, we would like
    it to be an extension of the class Employee . We do this through the keyword extends
    .public class Manager extends Employee {int password;int numberOfEmployeesManaged;public
    boolean authenticate( int password) {if ( this . password == password) {System
    . out . println ( "Access granted!" );return true;} else {System . out . println
    ( "Access denied!" );return false;}}// password setter...}When we create an object
    of type Manager , it has all the attributes that objects of type Employee have.
    Because, after all, a manager is an employee in the bank.The Manager class inherits
    all the attributes and methods of the parent class (Employee). It also inherits
    private attributes and methods, but can not access them directly . In order to
    access a private member in the “child” indirectly, it would be necessary for the
    “parent” to expose another visible method that invokes this private attribute
    or method.Super and subclassThe most used nomenclature is:●        Employee is
    the superclass of Manager●        Manager is the subclass of EmployeeIt’s another
    way of saying that Employee is the parent and Manager is the child .ProtectedWhat
    do we do if we need to access the attributes we inherited? Leaving them public
    is not an option, because everyone would be able to access them. There’s another
    access modifier that is between private and public: protected .protected attributes
    are visible to its class and subclasses. There are more details about protected
    , but you can see the table and search for more.public class Employee {protected
    String name;protected String id;protected double salary;}In the same way, you
    can create a class called Director that extends Manager , or whatever makes sense
    in the business logic. A class can have multiple “children”, but only one “parent”!Rewriting
    a methodAt the end of the year, our imaginary Employees get a raise of 10% and
    Managers get a raise of 15%. Let’s write a public method in Employee that can
    be accessed in Manager .public class Employee {protected String name;protected
    String id;protected double salary;public double getRaise() {return this . salary
    * 0.10;}}Manager class will inherit that method, but we’re not there yet. Managers
    get a bigger raise, so let’s implement that by rewriting the method getRaise()
    inside our Manager class.public class Manager extends Employee {int password;int
    numberOfEmployeesManaged;public boolean authenticate( int password) {// ...}public
    double getRaise() {return this . salary * 0.15;}}Now the method fits our needs.![](images/00048.jpeg)See
    how an icon appears next to the method to say that it overrides a method in Employee.
    Which leads us to another thing: you can explicit that fact by using the annotation
    @Override above our code:![](images/00049.jpeg)The advantage of using @Override
    is that we have to rewrite an existing method, that is, we couldn’t change the
    name of the method, for example. And that prevents us from creating a new method
    and leaving “duplicates”.See what happens if I change the name to getTheRaise()
    .![](images/00050.jpeg)![](images/00051.jpeg)After overriding a method, you can’t
    access the original method from the superclass!Now imagine that Manager s always
    get a raise of $1000 more than Employee s. So, if Employees get a raise of $500,
    Managers get $1500\. Employees $1500, Managers $2500, and so forth. We could do
    something like this for Managers:@Overridepublic double getRaise() {return this
    . salary * 0.10 + 1000;}But if Employees start to get a bigger or smaller raise
    (different than 10%), we would have to change the method in Manager to keep up
    with the Employess’ raise.Remember: in this case we would like to just complement
    the original method, by adding an extra 1000 dollars to the raise that was calculated
    for Employees.To do that, we can access the getRaise() that is in the Employee
    class by using the keyword super :@Overridepublic double getRaise() {return super
    . getRaise() + 1000;}PolymorfismIn inheritance, we said that every Manager is
    an Employee, because the Manager class extends the Employee class . We can refer
    to a Manager as being an Employee. That’s the semantics of inheritance.Polymorphism
    is the ability of an object to be referenced in various ways . Polymorphism does
    not mean that the object gets transformed. Remember: objects belong to the same
    type, from the moment they get created until they get destroyed – what can change
    is the way we refer to it.Manager manager = new Manager ();Employee employee =
    manager;employee. setSalary( 5000.0 );What do you think will happen if I do the
    following?employee. getRaise();What does that method return? 500? 750?In Java,
    method invocation will always be decided at runtime. Java will look for the object
    in memory and then decide which method to call, always relating to its true class,
    not the one we are using to reference it . Although we are referring to this Manager
    as being an Employee , the method executed is the Manager’s. The return is 750.It
    seems weird to create a Manager object and refer to it as an Employee . Why would
    we do that? In fact, we could use that to send the Manager as an argument to a
    method that requires an Employee :public class PaymentRecord {'
