    \ 变量要求你使用单引号。\n\n// 示例\n```java\nchar firstLetter = 'A' ;\nchar lastLetter = 'Z'\
    \ ;\nchar digit = '0' ;\nchar num = '9';\n```\n\n## 其他原始数据类型\n作为初学者，并不是所有类型都具有同等的重要性。目前，`int`、`double`、`boolean`、`char`\
    \ 类型变量（以及 `Strings` - 在第 4 章）会对你非常有帮助。但你必须知道还有其他数据类型可以满足程序员可能的不同需求。\n\n### byte\n\
    它的最小值为 `-128`，最大值为 `127`（包含）。在需要节省内存的地方，`byte` 数据类型可以非常有用。\n\n// 示例\n```java\n\
    byte x = - 128 ;\nbyte y = 127;\n```\n\n### short\n它的最小值为 `-32,768`，最大值为 `32,767`（包含）。与\
    \ `byte` 一样，适用相同的原则：你可以使用 `short` 来节省内存。\n\n// 示例\n```java\nshort n = - 32768\
    \ ;\nshort p = 32767;\n```\n\n### long\n它的最小值为 `-263`，最大值为 `263 -1`。当你需要比 `int`\
    \ 提供的范围更大的数值时，请使用此数据类型。\n\n### float\n它用于表示浮点数，例如 `3.14159`、`25.0` 和 `0.0075`。该值末尾应该有一个\
    \ `f`，表示它是一个 `float`。否则，它将被视为 `double`。\n\n// 示例\n```java\nfloat n = 1.5f;\n```\n\
    如果你不在要存储到 `float` 变量中的数字末尾加上 `f`，你会得到一个错误：\n![](img/00024.jpeg)\n\n这种数据类型永远不应该用于非常精确的值，例如货币。对于这种情况，你需要使用\
    \ [java.math.BigDecimal](https://docs.oracle.com/javase/8/docs/api/java/math/BigDecimal.html)\
    \ 类。\n\n## 注释\n想象你今天写完了一个大型而复杂的程序。当然，明天你仍然记得每个变量存储了什么，以及程序的每个部分是做什么。但一个月后你还会记得吗？一年后呢？你可能不会，尤其是如果你在此期间没有修改代码。\n\
    \n还有另一种情况。大多数时候，你不是为自己写代码：别人会阅读它，甚至可能对其进行补充。不幸的是，其他程序员无法读取你的想法（我们还没到那一步）。那么，我们做什么呢？注释我们的代码。\n\
    \n```java\npublic class Variables {\n    public static void main( String [] args)\
    \ {\n        int a = 20 ; // 创建名为 a 的变量\n        int b = 2 ; // 创建名为 b 的变量\n \
    \       int c = 3 ; // 创建名为 c 的变量\n        int x = a + b + c; // 计算变量 a、b 和 c\
    \ 的和\n        System . out . println( x);  // 输出和\n    }\n}\n```\n在上面的代码中，你可以看到以\
    \ `//` 开头的单行注释示例。编译器会忽略 `//` 到行尾的所有内容，因此你可以编写任何想要的内容，而不会产生干扰。这种类型的注释在你想要解释某个语句的作用时非常有用。\n\
    \n```java\npublic class Variables {\n    public static void main( String [] args)\
    \ { {/* 我仍然想实现一个计算任意变量集和的函数 */\n        int a = 20 ;\n        int b = 2 ;\n  \
    \      int c = 3 ;\n        int x = a + b + c;\n        System . out . println(\
    \ x);\n    }\n}\n```\n在上面的代码中，你可以看到以 `/*` 开头并 `*/` 结尾的多行注释示例。编译器会忽略 `/*` 到 `*/`\
    \ 之间的所有内容。当你想要写一个单行无法容更大的注释时，它们非常有用。\n\n## 练习集 #1\n将你的答案写在纸上，然后在答案页进行检查。\n1) 哪种原始数据类型类似于灯开关？\n\
    2) 对或错：“整数变量只能存储正数”\n3) “所有数据类型都需要相同的内存空间”\n4) 哪些声明包含错误？\n5) 编写一个包含两个 `Integer`\
    \ 变量的程序。给它们赋值并打印和。\n\n**答案**\n1) Boolean\n2) False\n3) False\n4) `a`, `c`, `d`,\
    \ `f`\n5)\n```java\npublic class Variables {\n    public static void main(String[]\
    \ args) {\n        int a = 10;\n        int b = 5;\n        System.out.println(a\
    \ + b);\n    }\n}\n```\n\n# 第 3 章：运算符与数学\n操作远比加减法多，这正是我们在本章中要探索的内容。\n\n## 算术运算符\n\
    \n### 加法：`+`\n```java\nint a, b, c; // 这样你可以声明多个同类型的变量\na = 3;\nb = 4;\nc = a\
    \ + b;\nSystem . out . println( c); // 7\nSystem . out . println( a + c); // 10\n\
    System . out . println( 15 + 10 ); // 25\n```\n\n### 减法：`-`\n```java\nint a, b,\
    \ c;\na = 10;\nb = 3;\nc = a - b;\nSystem . out . println( c); // 7\nSystem .\
    \ out . println( a - c); // 3\nSystem . out . println( 27 - 17 ); // 10\n```\n\
    \n### 乘法：`*`\n```java\nint a, b, c;\na = 5;\nb = 3;\nc = a * b;\nSystem . out\
    \ . println( c); // 15\nSystem . out . println( a * a); // 25\nSystem . out .\
    \ println( 2 * 7 ); // 14\n```\n为了让结果为 double，至少有一个数字是 double。因此，以下所有表达式的结果均为\
    \ `10.0`。\n- `2.0 * 5`\n- `2 * 5.0`\n- `2.0 * 5.0`\n\n不要与 `float` 混淆，它末尾有一个 `f`（参见第\
    \ 2 章）。此规则适用于其他操作。\n\n### 除法：`/`\n```java\nSystem . out . println( 10 / 3); //\
    \ 3\nSystem . out . println( 10 / 3.0); // 3.3333333333333335\nSystem . out .\
    \ println( 10.0 / 3); // 3.3333333333333335\nSystem . out . println( 10.0 / 3.0);\
    \ // 3.3333333333333335\n```\n再次！为了让结果为 double，至少有一个数字是 double。否则，像 `10 / 3` 这样的操作只会返回结果的整数部分。\n\
    \n### 取模：`%`\n`%` 被称为模或取余运算符，返回两个数的余数。例如 `10 % 3` 是 `1`，因为 `10` 除以 `3` 余数为 `1`。你可以像使用\
    \ `+`、`-`、`*` 和 `/` 一样使用 `%`。\n\n```java\nint i, j;\ni = 6 ;\nj = 4 ;\nSystem\
    \ . out . println( i % j); // 2\n```\n\n"
- fmt: "\n```java\nSystem.out.println( 6.0 % 4.0 ); // 2.0\n```\n\n### Increment\n\
    Instead of writing `i = i + 1;` or even `i += 1;`… you can write `i++;`. That’s\
    \ what the increment operator does: adding 1 to the number stored in a variable.\n\
    \n### Decrement\nThis operator does the opposite. Instead of writing `i = i -\
    \ 1;` or even `i -= 1;`… you can write `i--;`. That’s what the decrement operator\
    \ does: subtracting 1 from the number stored in a variable.\n\n### Relational\
    \ Operators\nRelational operators are used to compare data types that have a defined\
    \ ordering, like numbers (since numbers are either smaller or larger than other\
    \ numbers).\n\n- **Equal to: `==`** - Checks if the values of two operands are\
    \ equal or not, if yes then condition becomes true.\n  ```java\n  System.out.println(\
    \ 1 == 1 ) // true\n  System.out.println( 3 == 0 ) // false\n  ```\n  *Attention!\
    \ The equality operator `==` is different from the assignment operator `= `.*\n\
    \n- **Not equal to: `!=`** - Checks if the values of two operands are equal or\
    \ not, if values are not equal then condition becomes true.\n  ```java\n  System.out.println(\
    \ 3 != 1 ) // true\n  System.out.println( 10 != 10 ) // false\n  ```\n\n- **Greater\
    \ than: `>`** - Checks if the value of left operand is greater than the value\
    \ of right operand, if yes then condition becomes true.\n  ```java\n  System.out.println(\
    \ 3 > 1 ) // true\n  System.out.println( 10 > 10 ) // false\n  System.out.println(\
    \ 1 > 10 ) // false\n  ```\n\n- **Less than: `<`** - Checks if the value of left\
    \ operand is less than the value of right operand, if yes then condition becomes\
    \ true.\n  ```java\n  System.out.println( 1 < 40 ) // true\n  System.out.println(\
    \ 12 < 6 ) // false\n  System.out.println( 1 < 1 ) // false\n  ```\n\n- **Greater\
    \ than or equal to: `>=`** - Checks if the value of left operand is greater than\
    \ or equal to the value of right operand, if yes then condition becomes true.\n\
    \  ```java\n  System.out.println( 12 >= 6 ) // true\n  System.out.println( 7 >=\
    \ 7 ) // true\n  System.out.println( 1 >= 5 ) // false\n  ```\n\n- **Less than\
    \ or equal to: `<=`** - Checks if the value of left operand is less than or equal\
    \ to the value of right operand, if yes then condition becomes true.\n  ```java\n\
    \  System.out.println( 6 <= 12 ) // true\n  System.out.println( 7 <= 7 ) // true\n\
    \  System.out.println( 6 <= 4 ) // false\n  ```\n\n### Logical Operators\nAlso\
    \ known as Boolean Operators, they are used to compare boolean values (`true`\
    \ and `false`), which can be part of our program’s logic.\n\n#### And: `&&`\n\
    The and operator is represented in Java by `&&`. It returns a boolean value of\
    \ `true` only when the expressions on both sides of `&&` are true.\n```java\n\
    System.out.println( true && true ); // prints true\nSystem.out.println( false\
    \ && false ); // prints false\nSystem.out.println( false && true ); // prints\
    \ false\nSystem.out.println( true && false ); // prints false\n```\nWe can also\
    \ use the Boolean operator `&&` with Boolean expressions such as the following:\n\
    ```java\nSystem.out.println( 5 > 0 && 9 < 10 );\n```\nThe example above will print\
    \ out `true` because the statements \"5 is greater than 0\" and \"9 is less than\
    \ 10\" are both true.\n\n#### Or: `||`\nThe or operator is represented in Java\
    \ by `||`. It returns a Boolean value of `true` when at least one expression on\
    \ either side of `||` is true.\n```java\nSystem.out.println( false || false );\
    \ // prints false\nSystem.out.println( false || true ); // prints true\nSystem.out.println(\
    \ true || false ); // prints true\nSystem.out.println( true || true ); // prints\
    \ true\n```\nWe can also use the Boolean operator `||` with Boolean expressions\
    \ such as the following:\n```java\nSystem.out.println( 5 > 2 || 1 > 34 );\n//\
    \ Equivalent to:\nSystem.out.println( true || false );\n```\nThe example above\
    \ will print out `true` because at least one statement — \"5 is greater than 2\"\
    \ — is true even though the other statement — \"1 is greater than 34\" — is false.\n\
    \n#### Not: `!`\nThe not operator is represented in Java by `!`. It will return\
    \ the opposite of the expression immediately after it. It will return `false`\
    \ if the expression is `true`, and `true` if the expression is `false`.\n```java\n\
    System.out.println(! false ); // \"Not false\" - prints true\nSystem.out.println(!\
    \ true ); // \"Not true\" - prints false\n```\nWe can also use the Boolean operator\
    \ `!` with Boolean expressions such as the following:\n```java\nSystem.out.println(\
    \ !( 5 <= 25 ) );\n```\nThe example above will print out `false` because the statement\
    \ \"4 is less than or equal to 10\" is true, but the `!` operator will return\
    \ the opposite value, which is `false`.\n\n### Precedence\nThe three Boolean operators\
    \ `&&`, `||`, and `!` can also be used together and used multiple times to form\
    \ larger Boolean expressions. However, just like numerical operators, Boolean\
    \ operators follow rules that specify the order in which they are evaluated. This\
    \ order is called Boolean operator precedence.\n\nThe precedence of each Boolean\
    \ operator is as follows:\n1. `!` is evaluated first.\n2. `&&` is evaluated second.\n\
    3. `||` is evaluated third.\n\nLike numerical expressions, every expression within\
    \ parentheses is evaluated first. Expressions are also read from left to right.\
    \ The following statement demonstrates how Boolean operator precedence works:\n\
    ```java\nSystem.out.println( !( false ) || false && true );\n```\n**Step-by-step\
    \ explanation:**\nThe example above will print out `true`. In order, the expression\
    \ is evaluated as follows:\n1. First, the `!( false )` returns `true`.\n2. Second,\
    \ `false && true` evaluates to `false`.\n3. Finally, the remaining `true || false`\
    \ evaluates to `true`.\n\n### Other assignment Operators\nWe have already seen\
    \ some of the assignment operators (`=`, `+=`, `-=` [implied]), but there are\
    \ others that will help shorten our code:\n\n- **`*=` Multiply assignment operator**:\
    \ It multiplies right operand with the left operand and assigns the result to\
    \ left operand.\n  ```java\n  a *= b;\n  ```\n- **`/=` Divide assignment operator**:\
    \ It divides left operand with the right operand and assigns the result to left\
    \ operand.\n  ```java\n  a /= b;\n  ```\n- **`%=` Modulus assignment operator**:\
    \ It takes modulus using two operands and assigns the result to left operand.\n\
    \  ```java\n  a %= b;\n  ```\n\n### Intro to the Math class\nTo do other operations\
    \ like potentiation and square root, we have to use the `Math` class, which contains\
    \ the needed methods.\n\n#### Potentiation\nTo do potentiation, we use `Math.pow()`.\n\
    ```java\nint base = 4;\nint exponent = 3;\nSystem.out.println( Math.pow(base,\
    \ exponent)); // 64.0\n```\n\n#### Square root\nTo do square root, we use `Math.sqrt()`.\n\
    ```java\nSystem.out.println( Math.sqrt(4) ); // 2.0\nSystem.out.println( Math.sqrt(25)\
    \ ); // 5.0\nint x = 100;\nSystem.out.println( Math.sqrt(x)); // 10.0\n```\nThere\
    \ are a lot of other methods in the `Math` class. Here are some things you can\
    \ do: calculate the absolute value of a number, sine, cosine, tangent, logarithms\
    \ and make conversions between degrees and radians.\n\n### Workout Set #2\nWrite\
    \ down your answers in a piece of paper to check them in the Answers page.\n\n\
    1. What will be the output of the following program?\n   ```java\n   class Program\
    \ {\n       public static void main(String[] args) {\n           int a = 3;\n\
    \           int b = 8;\n           int c = (a + b) / 2;\n           System.out.println(c\
    \ / 1.0);\n       }\n   }\n   ```\n   a) 6\n   b) 6.0\n   c) 5.5\n   d) 5\n\n\
    2. What will be the output of the following program?\n   ```java\n   class WorkoutSet\
    \ {\n       public static void main(String[] args) {\n           int a = 3;\n\
    \           int b = 17 + a - 5;\n           int c = a * b;\n           System.out.println(c);\n\
    \       }\n   }\n   ```\n\n3. What will be the output of the following program?\n\
    \   ```java\n   class WorkoutSet {\n       public static void main(String[] args)\
    \ {\n           System.out.println(5.1 > 5);\n       }\n   }\n   ```\n\n4. What\
    \ will be the output of the following program?\n   ```java\n   class WorkoutSet\
    \ {\n       public static void main(String[] args) {\n           System.out.println(2\
    \ >= 0);\n       }\n   }\n   ```\n\n5. What will be the output of the following\
    \ program?\n   ```java\n   class WorkoutSet {\n       public static void main(String[]\
    \ args) {\n           System.out.println(-10 > -5);\n       }\n   }\n   ```\n\n\
    6. What will be the output of the following program?\n   ```java\n   class WorkoutSet\
    \ {\n       public static void main(String[] args) {\n           System.out.println(\"\
    Hello\" == \"hello\");\n       }\n   }\n   ```\n"
