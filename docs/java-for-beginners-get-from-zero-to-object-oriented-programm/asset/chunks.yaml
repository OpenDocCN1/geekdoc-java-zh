  trans: "\n\n```java\nprivate double totalOfPayments = 0;\n\npublic void register(Employee\
    \ employee) {\n    this.totalOfPayments += employee.getRaise();\n}\n\npublic double\
    \ getTotalOfPayments() {\n    return this.totalOfPayments;\n}\n```\n\n在我们的程序的某个地方，我们可以调用这些方法：\n\
    \n```java\nPaymentRecord record = new PaymentRecord();\nManager employee1 = new\
    \ Manager();\nemployee1.setSalary(6000.0);\nrecord.register(employee1); // !!!\n\
    Employee employee2 = new Employee();\nemployee2.setSalary(2000.0);\nrecord.register(employee2);\n\
    System.out.println(record.getTotalOfPayments());\n```\n\n# 练习题 #91\n\n### 1) 在类\
    \ `Car` 和 `Ferrari` 之间表示继承正确方式是什么？\n\n**选项 A**\n```java\npublic class Ferrari\
    \ {/* ...}\npublic class Car extends Ferrari {/* ...}\n```\n\n**选项 B**\n```java\n\
    public class Car {/* ...}\npublic class Ferrari extends Car {/* ...}\n```\n\n\
    ### 2) 创建一个 `Dog` 类和一个继承 `Dog` 的 `GoldenRetriever` 类。在 `Program` 类中创建实现结果所需的属性和方法：\n\
    \n![](img/00052.jpeg)\n\n以下是给的一些提示：\n- 在 `Dog` 中，创建两个构造函数：一个是包含所有参数并将它们赋值给新对象的构造函数；另一个是内部没有指令的默认构造函数。\n\
    - 创建一个 `public int canineToHumanAge()` 方法，返回狗的年龄对应的人类年龄。如果一只狗在一年前出生，那么它就相当于 9\
    \ 岁（大约值）。\n- 创建一个 `public void bark()` 方法，打印出“Woof woof!!! I’m ” + 狗的名字。\n- `GoldenRetriever`\
    \ 的构造函数不接受 `color` 作为参数，因为它会自动将其设置为“Golden”（不要忘记实现这一点）。\n\n### 3) 下面代码有什么什么问题？\n\
    \n**Employee.java**\n```java\npublic class Employee {\n    protected double salary;\n\
    \    public double getRaise() {\n        return this.salary * 0.10;\n    }\n}\n\
    ```\n\n**Manager.java**\n```java\npublic class Manager extends Employee {\n  \
    \  @Override\n    public double getValueOfRaise() {\n        return this.salary\
    \ * 0.15;\n    }\n}\n```\n\n### 4) 一位程序员正在为两个类编写属性：`Person` 和 `Dog`。他/注意到这两个类都拥有\
    \ `name`、`age` 和 `gender` 属性。因如此，程序员决定让 `Dog` 类继承 `Person` 类的属性，以节省几行代码。\n\n```java\n\
    public class Person {\n    String name;\n    int age;\n    char gender;\n}\npublic\
    \ class Dog extends Person {// ...}\n```\n\n考虑到你学到的关于继承的知识，这合理吗？为什么？\n\n## 答案\n\
    \n1) 当然，是**选项 B**。每一辆 `Ferrari` 都是汽车，但并不是每辆汽车都是 `Ferrari`。而且与普通汽车相比，`Ferrari`\
    \ 有额外的功能。\n\n2) **Dog.java**\n```java\npublic class Dog {\n    String name;\n\
    \    String color;\n    char gender;\n    int canineAge;\n    Dog() {}\n    Dog(String\
    \ name, String color, char gender, int canineAge) {\n        this.name = name;\n\
    \        this.color = color;\n        this.gender = gender;\n        this.canineAge\
    \ = canineAge;\n    }\n    public int canineToHumanAge() {\n        return this.canineAge\
    \ * 9;\n    }\n    public void bark() {\n        System.out.println(\"Woof woof!!!\
    \ I'm \" + this.name);\n    }\n}\n```\n\n**GoldenRetriever.java**\n```java\npublic\
    \ class GoldenRetriever extends Dog {\n    GoldenRetriever(String name, char gender,\
    \ int canineAge) {\n        this.name = name;\n        this.color = \"Golden\"\
    ;\n        this.gender = gender;\n        this.canineAge = canineAge;\n    }\n\
    }\n```\n\n3) 在 `Manager.java` 中，我们试图重写父类中不存在的 `getValueOfRaise()` 方法。我们实际上是在创建一个新方法，但\
    \ `@Override` 注解不允许我们这样做。这个人可能更改了方法的名称但忘记了重构所有出现的地方。\n\n4) 这不是一个好的做法，因为从层级上来说，`Dogs`\
    \ 和 `People` 之间没有任何关系。狗不是人，人也不是狗。尽管它们有一些共同特征，但它们之间有更多的差异。可以[在此处查阅更多关于继承中某些错误的信息](https://www.thoughtworks.com/pt/insights/blog/composition-vs-inheritance-how-choose)。\n\
    \n"
