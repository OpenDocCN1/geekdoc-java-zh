  trans: "\n\n哦！而且数组的大小不可改变。一旦你创建了数组，在它存在期间，其大小（位置数量）将保持不变。如果你需要更多空间，必须创建一个新数组并将元素从旧数组复制过去。\n\
    \nJava 5.0 引入了一种新的语法，用于在不需要临时变量来跟踪当前索引时遍历数组。这是一种增强型 for 循环（enhanced-for loop）。请看下面的代码示例：\n\
    \n```java\npublic class MyClass {\n  public static void main( String [] args)\
    \ {\n    int [] ages = new int [ 10 ];\n    for ( int i = 0 ; i < 10 ; i++) {\n\
    \      ages[ i] = i * 10 ;\n    }\n    // print all the items in the array\n \
    \   for ( int x : ages) {\n      System . out . println( x);\n    }\n  }\n}\n\
    ```\n\n这里是同一个函数但使用增强型 for 循环写法：\n\n```java\nvoid printArray( int [] array) {\n\
    \  for ( int x : array) {\n    System . out . println( x);\n  }\n}\n```\n"
- fmt: "\nThe same is true for reference arrays. This is for nothing more than a trick\
    \ to make it easier to iterate through arrays and make the process more readable.\n\
    \n### Workout Set #71\n\n1) Write a program that creates an array and populates\
    \ it with the numbers from 1 to 10 and then prints them out by iterating through\
    \ the array.\n\n2) Create a new class called `Employee` (if don’t have one yet)\
    \ and paste the following code:\n```java\npublic class Employee {\n    String\
    \ name;\n    double salary;\n}\n```\nAlso create a new class called `Company`\
    \ (if don’t have one yet) and paste the following code:\n```java\npublic class\
    \ Company {\n    Employee [] employees = new Employee [ 3 ];\n    int i = 0;\n\
    \    void add( Employee employee) {\n        this . employees[???] = employee;\n\
    \        i += ???;\n    }\n    void showEmployees() {\n        for ( Employee\
    \ e : employees) {\n            System . out . println(???);\n        }\n    }\n\
    }\n```\nFinally, create a new class called `Program` (if don’t have one yet) and\
    \ paste the following code:\n```java\npublic class Program {\n    public static\
    \ void main( String [] args) {\n        Employee e1 = new Employee ();\n     \
    \   e1. name = \"Lucas\";\n        e1. salary = 100000;\n        Employee e2 =\
    \ new Employee ();\n        e2. name = \"Mary\";\n        e2. salary = 120000;\n\
    \        Employee e3 = new Employee ();\n        e3. name = \"Nick\";\n      \
    \  e3. salary = 85000;\n        Company company = new Company ();\n        company.\
    \ add( e1);\n        company. add( e2);\n        company. add( e3);\n        company.\
    \ showEmployees();\n    }\n}\n```\nNow replace every `???` with the correct code\
    \ in order to do this:\n* `add()` takes an `Employee` as argument and adds it\
    \ to the array `employees` in the first empty position of the array.\n* `showEmployees()`\
    \ does not return anything. It just prints out the employee’s name and salary\
    \ for every employee in the array `employees`.\n* You can only replace the question\
    \ marks with new code\n* This is the desired output:\nLucas -> 100000.0\nMary\
    \ -> 120000.0\nNick -> 85000.0\n\n3) Let’s do the FizzBuzz exercise again, but\
    \ now using arrays. \"Write a program that prints the numbers from 1 to 100\\\
    . But for multiples of three print “Fizz” instead of the number and for the multiples\
    \ of five print “Buzz”. For numbers which are multiples of both three and five\
    \ print “FizzBuzz”.\" Create an array of length 100 and populate it with the numbers\
    \ from 1 to 100\\. Then iterate through that array to print the numbers by following\
    \ the conditions.\n\n4) Create an array of any length and populate it with any\
    \ numbers. Now iterate through it to copy those numbers to a new array.\n\n###\
    \ Answers\n\n1)\n```java\npublic class Program {\n    public static void main(\
    \ String [] args) {\n        int [] array = new int [ 10 ];\n        for ( int\
    \ i = 0 ; i <= 9 ; i++) {\n            array[ i] = i + 1;\n        }\n       \
    \ for ( int x : array) {\n            System . out . println( x);\n        }\n\
    \    }\n}\n```\n\n2)\n```java\npublic class Company {\n    Employee [] employees\
    \ = new Employee [ 3 ];\n    int i = 0;\n    void add( Employee employee) {\n\
    \        this . employees[ i] = employee;\n        i += 1;\n    }\n    void showEmployees()\
    \ {\n        for ( Employee e : employees) {\n            System . out . println(\
    \ e. name + \" -> \" + e. salary);\n        }\n    }\n}\n```\n\n3)\n```java\n\
    public class Program {\n    public static void main( String [] args) {\n     \
    \   int [] array = new int [ 100 ];\n        for ( int i = 1 ; i <= 100 ; i++)\
    \ {\n            array[ i- 1 ] = i;\n        }\n        for ( int x : array) {\n\
    \            if ( x % 15 == 0 ) {\n                System . out . println ( \"\
    Fizzbuzz\" );\n            } else if ( x % 5 == 0 ) {\n                System\
    \ . out . println ( \"Buzz\" );\n            } else if ( x % 3 == 0 ) {\n    \
    \            System . out . println ( \"Fizz\" );\n            } else {\n    \
    \            System . out . println ( x );\n            }\n        }\n    }\n\
    }\n```\n\n4)\n```java\npublic class Program {\n    public static void main( String\
    \ [] args) {\n        int [] oldArray = new int [ 3 ];\n        oldArray[ 0 ]\
    \ = 1;\n        oldArray[ 1 ] = 2;\n        oldArray[ 2 ] = 3;\n        int []\
    \ newArray = new int [ 3 ];\n        for ( int i = 0 ; i <= 2 ; i++) {\n     \
    \       newArray[ i] = oldArray[ i];\n        }\n    }\n}\n```\n\n# Chapter 8:\
    \ Access Modifiers and Class Attributes\n\n## Controlling access\nWe’re going\
    \ to get back to the `Account` class we created earlier in Chapter 6.\n```java\n\
    public class Account {\n    int number;\n    double balance;\n    double limit;\n\
    \    Client owner;\n    boolean draw( double amount) {\n        if ( this . balance\
    \ < amount) {\n            return false;\n        } else {\n            this .\
    \ balance -= amount;\n            return true;\n        }\n    }\n    void deposit(\
    \ double amount) {\n        this . balance += amount;\n    }\n    boolean transferTo(\
    \ Account destiny, double amount) {\n        if ( this . draw( amount)) {\n  \
    \          destiny. deposit( amount);\n            return true;\n        } else\
    \ {\n            return false;\n        }\n    }\n}\n```\nWe fixed the `draw()`\
    \ method with an `if-else` to prevent it from taking money that wasn’t in the\
    \ account and leaving a negative balance. But what if someone (another programmer)\
    \ tries to draw money from the account or change its balance not by using the\
    \ method we created, but by modifying the `balance` variable directly? Like this:\n\
    ```java\npublic class Program {\n    public static void main( String [] args)\
    \ {\n        Account account = new Account ();\n        account.balance = -100;\n\
    \    }\n}\n```\nThe best way to solve that is by making the `balance` variable\
    \ private we no longer access that. In Java, we use the keyword `private`. It’s\
    \ called an access modifier or visibility modifier.\n```java\npublic class Account\
    \ {\n    private double balance;\n    private double limit;\n    // ...\n```\n\
    In object-oriented programming (OOP), protecting your attributes with `private`\
    \ is almost an obligatory practice. Each class is responsible for controlling\
    \ its attributes, so it must judge whether the new value for an attribute is valid.\
    \ This validation should not be done by those who are using the class, but by\
    \ the class itself, centralizing that and making future changes a lot easier.\
    \ Note that anyone who invokes `draw()` method has no idea that there is `limit`\
    \ that is being checked. A person that is to use this class just needs to know\
    \ what the method does and not how it does, because changing the implementation\
    \ is easy, but changing the signature of a method will generate problems. A method\
    \ signature is part of the method declaration. It is the combination of the method\
    \ name and the parameter list. The `private` keyword can also be used to modify\
    \ access to a method. This functionality is used in several scenarios, the most\
    \ common being: a) when there is a method that is only used to assist the class\
    \ itself and b) when there is code repeated within two methods of the class. We\
    \ should always expose as few functionalities as possible to create low coupling\
    \ between our classes. On the other hand, we also have the `public` access modifier,\
    \ which allows everyone to access a particular attribute or method:\n```java\n\
    public class Account {\n    // ...\n    public boolean draw( double amount) {\n\
    \        // anyone can access this method\n        if ( amount > this . balance\
    \ + this . limit) {\n            return false;\n        } else {\n           \
    \ this . balance -= amount;\n            return true;\n        }\n    }\n}\n```\n\
    Note that our classes were declared with the modifier `public`, in which case\
    \ those classes are visible to all classes everywhere. See how the IDE shows open\
    \ and closed locks to represent public and private things, respectively: images/0041.jpeg\n\
    What about methods/attributes that don’t have an access modifier, like `deposit()`,\
    \ `owner`, `number` and `transferTo()`? They are neither public nor private. They\
    \ are `default`, as you can see below.\n\n| Visibility | Public | Protected |\
    \ Default | Private |\n| :--- | :--- | :--- | :--- | :--- |\n| From the same class\
    \ | Yes | Yes | Yes | Yes |\n| From any class in the same package | Yes | Yes\
    \ | Yes | No |\n| From a subclass in the same package | Yes | Yes | Yes | No |\n\
    | From a subclass outside the same package | Yes | Yes, through inheritance |\
    \ No | No |\n| From any non-subclass class outside the package | Yes | No | No\
    \ | No |\n"
