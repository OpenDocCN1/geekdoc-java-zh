  trans: "\n\n一个看似无限的 `while` 循环看起来如下：\n\n```java\nimport java.util.Scanner;\npublic\
    \ class Main {\n    public static void main(String [] args) {\n        Scanner\
    \ scan = new Scanner(System.in);\n        System.out.println(\"Enter a word:\"\
    );\n        String s;\n        while (true) {\n            s = scan.next();\n\
    \            if (s.equals(\"Hello\")) {\n                System.out.println(\"\
    Correct!\");\n                break;\n            } else {\n                System.out.println(\"\
    Try again!\");\n                continue;\n            }\n        }\n    }\n}\n\
    ```\n\n### 逐步解释：\n首先，我创建了一个 `Scanner` 对象并将其命名为 `scan`。我打印了“Enter a word:”让用户知道我正在请求输入，并且创建了一个\
    \ `String` 变量来存储该输入。然后我使用了 `while (true)`，这基本上意味着除非我们使用 `break` 终止它，否则循环不会停止。接下来，如果输入等于“Hello”，就会打印“Correct!”并通过\
    \ `break` 语句跳循环。否则，如果输入不等于“Hello”，就会打印“Try again!”并通过 `continue` 语句继续循环，直到用户输入“Hello”为止。\n\
    \n### For 循环\n`for` 是一种常用的循环，甚至比 `while` 更好用。它的语法如下：\n\n```java\nfor ( initialization;\
    \ condition; increment) {\n    // 在此处执行操作\n}\n```\n\n这里是我们之前用 `while` 循环做的相同示例（打印\
    \ 10 次“Hello”）：\n\n```java\nfor ( int i = 0 ; i < 10 ; i++) {\n    System.out.println(\
    \ i + \" Hello\");\n}\n```\n\n或者你可以这样写：\n\n```java\nfor ( int i = 1 ; i <= 10\
    \ ; i++) {\n    System.out.println( i + \" Hello\");\n}\n```\n\n让我们看看每个部分的含义：\n\
    ```java\nfor(int i = 0; i < 10; i++ ) {\n    System.out.println(i + \" Hello\"\
    );\n}\n```\n它创建了一个类型为 `int` 的临时变量 `i`。当 `i` 小于 `10` 时，会打印 `i + “Hello”` 并且变量 `i`\
    \ 加一。同样，如果你想打印从 10 到 20 的数字：\n\n```java\nfor ( int i = 10 ; i <= 20 ; i++) {\n\
    \    System.out.println( i);\n}\n```\n\n// 或者\n\n```java\nfor ( int i = 10 ; i\
    \ < 21 ; i++) {\n    System.out.println( i);\n}\n```\n注意，这种类型的循环不需要你“手动”跟踪计数变量，因此它更容易设置。\n\
    \n### 控制你的循环\n假设我们只想打印 10 到 20 之间的偶数。这意味着有一个条件：“如果数字是偶数，则打印 10 到 20 范围内的数字”。以下是我们如何使用\
    \ `while` 和 `for` 循环来实现它的。\n\n```java\nfor ( int i = 10 i <= 20 ; i++) {\n   \
    \ if ( i % 2 == 0 ) {\n        System.out.println( i);\n    }\n}\nint i = 0;\n\
    while ( i < 10 ) {\n    if ( i % 2 == 0 ) {\n        System.out.println(\"Hello\"\
    );\n    }\n    i++;\n}\n```\n\n还有一种被称为**嵌套循环**的结构。它发生在将一个循环放在另一个循环内部时。比如在一个 `for`\
    \ 循环内部另一个 `for` 循环。\n\n### 练习题 #4\n\n1) 下一个程序的输出是什么？\n```java\npublic class Main\
    \ {\n    public static void main(String [] args) {\n        int age = 20;\n  \
    \      boolean isMinor = age < 21;\n        if (isMinor) {\n            System.out.println(\"\
    You can NOT buy drinks in the US\");\n        } else {\n            System.out.println(\"\
    You can buy drinks in the US\");\n        }\n    }\n}\n```\n\n2) 下一个程序的输出是什么？\n\
    ```java\npublic class Main {\n    public static void main(String [] args) {\n\
    \        boolean boo = 5 > 4.7 && 3.9 > 8.2;\n        if (boo) {\n           \
    \ System.out.println(\"Boo!\");\n        } else {\n            System.out.println(\"\
    Nope\");\n        }\n    }\n}\n```\n\n3) 下一个程序的输出是什么？\nP.S. `equals()` 方法测试一个\
    \ `String` 是否等于另一个并返回一个 `boolean`。在这种情况下，它测试存储在变量 `t` 中的 `String` 是否等于 \"Te\"\
    。\n```java\npublic class Main {\n    public static void main(String [] args) {\n\
    \        String s = \"Text\";\n        String t = s.substring(0, 2);\n       \
    \ if (t.equals(\"Te\")) {\n            System.out.println(\"OOO\");\n        }\
    \ else {\n            System.out.println(\"UUU\");\n        }\n    }\n}\n```\n\
    \n4) 下一个程序的输出是什么？\n```java\npublic class Main {\n    public static void main(String\
    \ [] args) {\n        boolean x, y;\n        x = 2 * 4 > 2 && 10 / 2 < 5;\n  \
    \      y = 32 < 31;\n        System.out.println(\"Boom\");\n        if (x || y)\
    \ {\n            System.out.println(\"Yay\");\n        } else {\n            System.out.println(\"\
    Wow\");\n        }\n        System.out.println(\"OK\");\n    }\n}\n```\n\n5) 写一个程序，获取一个数字并判断它是偶数还是奇数。\n\
    示例 1：\n输入一个数字：\n4\n是偶数\n示例 2：\n输入一个数字：\n3\n是奇数\n记住使用取余运算符！\n\n6) 写一个程序，获取用户的姓名、出生年份，然后告诉他/她是否在美国开车。如果年龄大于或等于\
    \ 16 岁，就可以开车。\n示例（2017 年）：\n你的名字是什么？\nLucas\n出生于哪？\n2001\nLucas，你 16 岁了，可以在美国开车\n\
    \n7) 写一个程序，获取一个字母（`String`）。如果是 \"Y\" 或 \"y\"，打印 \"Yes\"。如果是 \"N\" 或 \"n\"，打印\
    \ \"No\"。否则，打印 \"Invalid letter\"。\n示例 1：\n输入一个字母：\ny\nYes\n示例 2：\n输入一个字母：\nN\n\
    No\n示例 3：\n输入一个字母：\nL\nInvalid letter\n\n8) `for` 循环结束后，`x` 的值是多少？\n```java\n\
    public class Main {\n    public static void main(String [] args) {\n        int\
    \ x = 0;\n        for ( int i = 1 ; i < 4 ; i++) {\n            x += i;\n    \
    \    }\n    }\n}\n```\n\n9) `for` 循环结束后，`n` 的值是多少？\n```java\npublic class Main\
    \ {\n    public static void main(String [] args) {\n        int n = 10;\n    \
    \    for ( int i = 0 ; i < 3 ; i++) {\n            n -= i;\n        }\n    }\n\
    }\n```\n\n10) 执行以下程序会发生什么？\n```java\npublic class Main {\n    public static void\
    \ main(String [] args) {\n        int n = 10;\n        while ( n > 10 ) {\n  \
    \          System.out.println(\"Hello\");\n        }\n    }\n}\n```\na) 发生错误\n\
    b) \"Hello\" 将打印 10 次\nc) \"Hello\" 将打印 9 次\nd) 什么都不打印\ne) \"Hello\" 将打印一次\n\n\
    11) \"n is greater than 0\" 会打印多少次？\n```java\npublic class Main {\n    public\
    \ static void main(String [] args) {\n        int n = 2;\n        n++;\n     \
    \   while ( n > 0 ) {\n            System.out.println(\"n is greater than 0\"\
    );\n            n--;\n        }\n    }\n}\n```\na) 0\nb) 1\nc) 2\nd) 3\ne) 4\n\
    \n12) `for` 循环结束后，`y` 的值是多少？\n```java\npublic class Main {\n    public static\
    \ void main(String [] args) {\n        int y = 2;\n        while ( y < 20 ) {\n\
    \            y += 2;\n        }\n    }\n}\n```\na) 20\nb) 19\nc) 22\nd) 18\ne)\
    \ 21\n\n13) 这段代码是做什么的？\n```java\npublic class Main {\n    public static void main(String\
    \ [] args) {\n        for ( int i = 1 ; i <= 10 ; i++) {\n            System.out.println(i);\n\
