    \ `Clients` 所做的那样。这不很酷吗？\n\n## 练习集 #6 - 第一部分\n\n以下员工模型将用于后续章节的练习。这里的目标是创建一个管理银行员工的系统。本章的练习极其重要。\n\
    \n### 1) 创建名为 `Employee` 的类，它包含以下属性：\n- `name` (`String`)\n- 他的/她的出生日期 (`String`)\n\
    - 入职日期 (`String`)\n- `job` (`String`)\n- `salary` (`double`，代表月薪）。\n\n**示例：**\n\
    - `name`: “Lucas”\n- `dateOfBirth`: “25/10/2001”\n- `wasHiredOn`: “01/09/2017”\n\
    - `job`: “CEO”\n- `salary`: 50000.0\n\n**创建一些方法：**\n- `promote`：根据传入的参数 `amount`\
    \ 增加员工工资。无返回值。\n- `calculateAnnualSalary`：不接收任何参数；返回工资乘以 12（个月）。\n\n### 2) 创建一个类来测试你的\
    \ `Employee` 类。\n我会把我的类命名为 `TestEmployee`，但你可以随需重命名。这个类必须包含 `main` 方法。创建一个 `Employee`\
    \ 类型的新对象，并赋予它你想要的属性。\n\n#### 答案\n1)\n```java\npublic class Employee {\n    String\
    \ name;\n    String dateOfBirth;\n    String wasHiredOn;\n    String job;\n  \
    \  double salary;\n    void promote(double amount) {\n        this.salary += amount;\n\
    \    }\n    double calculateAnnualSalary() {\n        return this.salary * 12;\n\
    \    }\n}\n```\n2) 这里是你的测试类可能的样子示例：\n```java\npublic class TestEmployee {\n  \
    \  public static void main(String[] args) {\n        Employee e = new Employee();\n\
    \        e.name = \"Lucas\";\n        e.dateOfBirth = \"25/10/2001\";\n      \
    \  e.wasHiredOn = \"01/09/2017\";\n        e.job = \"CEO\";\n        e.salary\
    \ = 50000.0;\n        e.promote(1000.0);\n        double annualSalary = e.calculateAnnualSalary();\n\
    \        System.out.println(\"Annual Salary = \" + annualSalary);\n    }\n}\n\
    ```\n\n## 练习集 #6 - 第二部分\n\n### 3) 创建一个 `show()` 方法，它既不接收也不返回任何参数，只需打印我们员工的所有属性。这样，你就不需要为对每个员工进行的每次更改和测试而不断复制粘贴大量的\
    \ `System.out.println()`。有了这个方法，你只需要执行：\n```java\nEmployee employee = new Employee();\n\
    // …\nemployee.show();\n```\n![](img/00036.jpeg)\n\n#### 答案\n3)\n```java\nvoid\
    \ show() {\n    System.out.println(\"Name: \" + this.name);\n    System.out.println(\"\
    Date of Birth: \" + this.dateOfBirth);\n    System.out.println(\"Hired on: \"\
    \ + this.wasHiredOn);\n    System.out.println(\"Job: \" + this.job);\n    System.out.println(\"\
    Salary: \" + this.salary);\n    System.out.println(\"Annual Salary: \" + this.calculateAnnualSalary());\n\
    }\n```\n\n## 练习集 #6 - 第三部分\n\n是时候训练你的学习肌肉了！创建以下具有相应属性和方法的类。不要害怕尝试，现在是时候你自己去发现问题了！\n\
    \n### 1) 类：`Person`\n- **属性：**\n    - `name` - `String`\n    - `age` - `int`\n\
    - **方法：**\n    - `void oneMoreYear()` - 将人的年龄增加 1 \n创建一个人，设置她的/他的名字和初始年龄，过生日（增加年龄）并打印人的名字和年龄。\n\
    \n***\n\n### 2) 类：`Door`\n- **属性：**\n    - `opened` - `boolean`\n    - `color`\
    \ - `String`\n    - `dimensionX` - `double`\n    - `dimensionY` - `double`\n \
    \   - `dimensionZ` - `double`\n- **方法：**\n    - `void open()` - 开启门\n    - `void\
    \ close()` - 关闭门\n    - `void paint(String s)` - 用颜色 `s` 漆门\n    - `boolean isOpen`\
    \ - 如果门是开启的返回 true，如果门是关闭的返回 false\n创建一个门，开启并关闭它，用不同的颜色漆它，改变它的尺寸，并使用 `open()`\
    \ 方法检查它是否开启。\n\n***\n\n### 3) 类：`House`\n- **属性：**\n    - `color` - `String`\n\
    \    - `door1` - `boolean`\n    - `door2` - `boolean`\n    - `door3` - `boolean`\n\
    - **方法：**\n    - `void paint(String s)` - 用颜色 `s` 漆门\n    - `int countDoors()`\
    \ - 返回开启门的数量\n创建一个房子，漆它，开启并关闭门，使用 `countDoors()` 方法查看开启了多少门。\n\n## 练习集 #6 - 第四部分\n\
    \n（注：原文此处未提供第四部分具体内容，已按要求结束翻译）\n\n"
- fmt: "\nOh! And Arrays can’t change its size. Once you create an array, it will\
    \ have the same size (number of positions) as long as it exists. If you need more\
    \ spaces, you’ll have to create a new array and copy the elements from the old\
    \ array.\n\nJava 5.0 has a new syntax to iterate through arrays when you don’t\
    \ need a temporary variable to keep track of the current index. It’s an enhanced-for\
    \ loop. See the code example:\n\n```java\npublic class MyClass {\n  public static\
    \ void main( String [] args) {\n    int [] ages = new int [ 10 ];\n    for ( int\
    \ i = 0 ; i < 10 ; i++) {\n      ages[ i] = i * 10 ;\n    }\n    // print all\
    \ the items in the array\n    for ( int x : ages) {\n      System . out . println(\
    \ x);\n    }\n  }\n}\n```\n\nHere’s that same function but written with an enhanced-for\
    \ loop:\n\n```java\nvoid printArray( int [] array) {\n  for ( int x : array) {\n\
    \    System . out . println( x);\n  }\n}\n```\n"
