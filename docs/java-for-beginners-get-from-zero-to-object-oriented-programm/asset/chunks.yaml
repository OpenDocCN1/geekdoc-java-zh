    \ class Main {\n    public static void main(String [] args) {\n        int n =\
    \ 10;\n        while (n == 10) {\n            System.out.println(n);\n       \
    \ }\n    }\n}\n```\n\n### 8) 如果你已经看到这里，恭喜你！现在你将构建一个涉及变量、输入处理、关系操作符、循环、条件判断以及用于生成伪随机数的\
    \ `Random` 类的游戏。请仔细注意以下指令，并在编写任何代码之前反复阅读直到完全理解要求。\n\n它的工作原理是：计算机生成一个 1 到 10（包含\
    \ 1 和 10）之间的（秘密）随机整数。用户不断尝试猜测秘密数字，直到猜中。每当用户输入的值不对时，他们会得到提示（“数字比那个大”或“数字比那个小”）。一旦输入正确的数字，游戏结束，用户将收到消息“恭喜！你赢了！”\n\
    \n我不提供此题的答案，但我可以给你一些建议：\n- 在数字不正确时持续请求输入，使用 `while (true)` 循环，它会不断请求输入并引导用户，只有当用户输入的数字等于计算机生成的数字时才会跳出。\n\
    \n#### 答案\n1) E\n2) O\n3) Access granted\n4) c\n5) a\n6) 变量 `c` 在 `for` 循环内部创建，因此无法从外部访问（即在循环完全执行后它就不再存在了）。for\
    \ 循环之后的行超出了 `c` 的作用范围。\n7) 条件 `(n == 10)` 始终结果为真，因为 `n` 既没有增加也没有减小。这导致了无限 `while`\
    \ 循环。\n8) - \n\n## 第 6 章：面向对象 Java 简介\n\n面向对象编程 (OOP) 是一种围绕“对象”而非“动作”和数据来组织的编程语言模型。对象的示例从人类（通过名称、地址等描述）到建筑和楼层（通过属性描述和修改）。\n\
    \n像 Java 这样面向对象的语言的优点是什么？\n- 更有组织性\n- 代码量更少\n- 将职责集中在正确的地方，使应用程序更灵活，封装业务逻辑。我们很快就会看到这些，但首先需要了解\
    \ Java 的语法和创建。\n\n### 类 x 对象\n\n在银行软件中，系统的关键部分是账户。想法是泛化每个账户必须具备的功能。例如……\n- 银行账号\n\
    - 所有者姓名\n- 账户余额\n- 限额（用于取款）\n\n账户做什么对我们来说很重要？也就是说，我们希望账户做什么？\n- 取出金额\n- 存入金额\n\
    - 所有者姓名\n- 获取当前余额\n- 转账金额\n\n考虑到这些，我们有了银行账户。我们可以获取那个项目并获取它的余额吗？不。我们拥有的只是一个项目。首先，我们需要创建一个真实的账户以便访问并让它执行。（images/032.jpeg）注意：尽管指定了\
    \ `Account`，它是一个 `Account` 吗？我们存入钱还是取出钱？在存储这些值的地方，那个“项目”（账户的规范）被称为 `class`。而从该类中构造的被称为\
    \ `objects`。\n\n#### 创建类\n\n打开你的 IDE，创建一个名为 `Account` 的 Java 类并开始输入。注意，这些变量并不是在\
    \ `main` 方法中声明的。当变量直接在类的作用域内声明时，被称为对象变量或属性。余额将是 `double` 类型，但它不应该用于货币。\n\n```java\n\
    public class Account {\n    int number;\n    String owner;\n    double balance;\n\
    }\n```\n\n#### 创建并使用对象\n\n我们已经有一个类指定了每个对象必须具备什么。但如何使用它？为了创建（实例化）一个 `Account`，我们需要使用关键字\
    \ `new` 和括号。\n\n```java\npublic class Program {\n    public static void main(String\
    \ [] args) {\n        new Account ();\n    }\n}\n```\n\n嗯，上面的代码创建了一个 `Account`\
    \ 类型的对象，但我们如何访问那个对象？我们需要一种方式来引用它。我们需要一个……变量！在这种情况下是一个 `Account` 类型的变量。\n\n```java\n\
    public class Program {\n    public static void main(String [] args) {\n      \
    \  Account myAccount;\n        myAccount = new Account ();\n    }\n}\n```\n\n\
    通过 `myAccount`，我们可以访问新创建的对象并改变它的 `owner`、`balance`、`limit` 等。\n\n```java\npublic\
    \ class Program {\n    public static void main(String [] args) {\n        Account\
    \ myAccount;\n        myAccount = new Account ();\n        myAccount.owner = \"\
    \ Lucas \";\n        myAccount.balance = 10000.0;\n        System.out.println(\"\
    \ Current balance: \" + myAccount.balance);\n    }\n}\n```\n\n重要的是，点符号被用于访问 `myAccount`\
    \ 中的某些内容。在上面的代码中，`myAccount` 属于 Lucas —— 我！并且拥有 10,000 元。\n\n### 方法\n\n在类内部，我们还会声明每个账户做什么以及如何执行——它的行为。例如，如果有一种特定的取款方法，我们会把它放在\
    \ `Account` 类内部。这就是为什么那些“函数”被称为“方法”（methods），因为它们是对对象执行某些操作的方法。\n\n我们想创建一个方法，从账户中提取金额，而不向使用该方法的人返回任何信息。\n\
    \n```java\npublic class Account {\n    // 其他属性和方法...\n    void draw(double amount)\
    \ {\n        double newBalance = this.balance - amount;\n        this.balance\
    \ = newBalance;\n    }\n}\n```\n\n`void` 关键字表示方法不返回任何内容。但我们可以返回某些值。在我们的 `draw`\
    \ 方法中，可以返回一个 `boolean` 值来告知操作是否完成。此语境下 `class` 一词源于生物分类学。所有属于同一生物学类的生物都共有一系列属性和行为，但它们并不等同。`Homo\
    \ sapiens`（人类）定义了一组具有共同特征的生物，但人类的定义/想法/概念是一个真实的人吗？所有内容都指定在 `Homo sapiens` 类中，但为了让一个人跑步、吃饭或跳跃，我们需要实例化该类，创建一个\
    \ `Homo sapiens` 类型的对象。\n\n另一个例子：蛋糕食谱。我们不吃食谱，但我们用它来制作真正的蛋糕。食谱是 `class`，蛋糕是 `object`。\n\
    \n#### 返回值的方法\n\n当方法返回内容时，如果账户内没有资金，操作就不会发生。在这种情况下，方法会返回 `false`。我将 `void` 替换为\
    \ `boolean`，以指示返回类型。\n\n```java\npublic class Account {\n    // 其他属性...\n    boolean\
    \ draw(double amount) {\n        if (this.balance < amount) {\n            return\
    \ false;\n        } else {\n            this.balance -= amount;\n            return\
    \ true;\n        }\n    }\n}\n```\n\n在上面的代码中，什么都不会被打印，因为 `System.out.println()`\
    \ 语句位于 `return` 语句之后。这里是如何使用那个新 `draw` 方法的：\n\n```java\npublic class Program {\n\
    \    public static void main(String [] args) {\n        Account myAccount = new\
    \ Account ();\n        myAccount.balance = 1000.0;\n        boolean success =\
    \ myAccount.draw(200.0);\n        if (success) {\n            System.out.println(\"\
    \ I got my money!\");\n        } else {\n            System.out.println(\" Where\
    \ is my money?\");\n        }\n    }\n}\n```\n\n我甚至可以消除中间变量（`success`）：\n\n```java\n\
    public class Program {\n    public static void main(String [] args) {\n      \
    \  Account myAccount = new Account ();\n        myAccount.balance = 1000.0;\n\
    \        if (myAccount.draw(200.0)) {\n            System.out.println(\" I got\
    \ my money!\");\n        } else {\n            System.out.println(\" Where is\
    \ my money?\");\n        }\n    }\n}\n```\n\n当然，你可以在同一个程序中拥有多个账户，每个账户都有自己的属性集。\n\
    \n```java\npublic class Program {\n    public static void main(String [] args)\
    \ {\n        Account myAccount = new Account ();\n        myAccount.balance =\
    \ 1000.0;\n        Account mySecondAccount = new Account ();\n        mySecondAccount.balance\
    \ = 500.0;\n        System.out.println(\"Account 1 balance: \" + myAccount.balance);\n\
    \        System.out.println(\"Account 2 balance: \" + mySecondAccount.balance);\n\
    \    }\n}\n```\n\n"
- fmt: "\na1 = new Account ();\n\n`Account a2;`\n\na2 = new Account ();\n\nIn the\
    \ code above, we can not say that `a1` is an object, because `a1` is a variable\
    \ that references an object . So keep in mind that, in Java, a variable is never\
    \ an object .![](images/00033.jpeg)\n\nOn the inside, `a1` and `a2` will keep\
    \ a number that identifies in which position of the memory the `Account` is. This\
    \ way, by using `.` to navigate, Java will access the `Account` that is in the\
    \ desired position, not another one.\n\n```java\npublic class TestReferences {\n\
    \    public static void main( String args[]) {\n        Account a1 = new Conta\
    \ ();\n        a1. deposit( 100 );\n        Account a2 = a1;  // !!!\n       \
    \ a2. deposit( 200 );\n        System . out . println( a1. balance);\n       \
    \ System . out . println( a2. balance);\n    }\n}\n```\n\nWhat happens when you\
    \ run the code above? The operator `=` copies the value of a variable. But what\
    \ is the value of variable `a1` ? Is it the object? No. Actually, the stored value\
    \ is the reference (address) of the object in the memory.\n\n```java\nAccount\
    \ a1 = new Account ();\nAccount a2 = a1;\n```\n![](images/00034.jpeg)\n\nSo, when\
    \ I wrote `a2 = a1`, `a2` now references that same object that is referenced by\
    \ `a1`. Hence, in this particular case, it doesn’t matter if we use `a1` or `a2`,\
    \ because they both reference to the same object! That means the expression `a1\
    \ == a2` would evaluate to true. Another way to see that happening is knowing\
    \ that we used the keyword `new` only once, so there is only one `Account` object\
    \ in the memory.\n\n```java\npublic static void main( String [] args) {\n    Account\
    \ a1 = new Account ();\n    a1. owner = \"Luke\" ;\n    a1. balance = 250 ;\n\
    \    Account a2 = new Account ();\n    a2. owner = \"Luke\" ;\n    a2. balance\
    \ = 250 ;\n    if ( a1 == a2) {\n        System . out . println( \"Equal accounts!\"\
    \ );\n    }\n}\n```\n\nThe operator `==` compares the value that is stored inside\
    \ the variables `a1` and `a2`, but those variables don’t hold an object, they\
    \ hold its address . Since two different `Accounts` were created and each variable\
    \ references to one of them, they have different addresses. Therefore, `a1 ==\
    \ a2` evaluates to false because we’re talking about different objects in the\
    \ memory. It’s a little tricky, because we tend to compare their attributes which,\
    \ in this case, are identical.![](images/00035.jpeg)\n\n### transfer() method\n\
    \nWhat if we want to transfer money from one account to another? This is how it\
    \ would look like:\n\n```java\npublic class Account {\n    // other attributes\
    \ and methods...\n    void transfer( Account destiny, double amount) {\n     \
    \   this . balance -= amount;\n        destiny. balance += amount;\n    }\n}\n\
    ```\n\nWe could be tempted to get 2 parameters of type `Account` (`account1` and\
    \ `account2`), but that would be a procedural way of programming. We want to call\
    \ the `transfer()` method on an object of type `Account` (which will be `this`\
    \ ), therefore the method gets only one parameter of type `Account` – the destiny\
    \ of the money.\n\nLet’s use that method and transfer some money.\n\n```java\n\
    public class Program {\n    public static void main( String [] args) {\n     \
    \   Account a1 = new Account ();\n        a1. balance = 1000.0;\n        Account\
    \ a2 = new Account ();\n        a2. balance = 500.0;\n        a1. transfer( a2,\
    \ 250 ); // !!!\n        System . out . println( \"a1 = \" + a1. balance);\n \
    \       System . out . println( \"a2 = \" + a2. balance);\n    }\n}\n```\n\nSee\
    \ how I did `a1. transfer( a2, 250 )` to transfer 250 dollars to `a2` ? In this\
    \ case, `a1` is that “this ” I talked about and `a2` is the destination. We might\
    \ as well call that method `transferTo` because it makes more sense.\n\nLet’s\
    \ also implement some logic to avoid transferring money from an account that doesn’t\
    \ have enough funds. And make the method return a boolean to tell if the operation\
    \ was completed successfully. I know we’re not in a Workout Set, but try to implement\
    \ those things on your own. Come on!…This is how it will look like after those\
    \ changes:\n\n```java\nboolean transferTo( Account destiny, double amount) {\n\
    \    if ( this . balance < amount) {\n        return false;\n    } else {\n  \
    \      this . balance -= amount;\n        destiny. balance += amount;\n      \
    \  return true;\n    }\n}\n```\n\nWe should go even further and use the methods\
    \ we’ve created earlier to draw money from `a1` and make a deposit to `a2`. Try\
    \ to implement that too!…\n\n```java\nboolean transferTo( Account destiny, double\
    \ amount) {\n    if ( this . draw( amount)) {\n        destiny. deposit( amount);\n\
    \        return true;\n    } else {\n        return false;\n    }\n}\n```\n\n\
    ### Attributes again\n\nRemember those attributes we created for the `Account`\
    \ class?\n\n```java\nclass Account {\n    int number;\n    String owner;\n   \
    \ double balance;\n    // methods…\n}\n```\n\nWhen we create an object, these\
    \ variables get a default value. Numeric variables get `0`, booleans get `false`,\
    \ and objects get `null`. But you can also set your default values, like this:\n\
    \n```java\npublic class Account {\n    int number = 12345;\n    String owner =\
    \ “Lucas”;\n    double balance = 0;\n    // methods…\n}\n```\n\nIn this case,\
    \ the attributes will be populated when you create a new `Account` object. Imagine\
    \ we start to grow our class and want to put other information such as the person’s\
    \ last name and address. Should we put it in the `Account` class? Actually, an\
    \ `Account` does not have a name, or address. You know who has all these attributes?\
    \ A `Client`. So we should create another class for `Clients`. Soon we’ll make\
    \ the connections.\n\n```java\npublic class Client {\n    String name;\n    String\
    \ lastName;\n    String address;\n}\n```\n\nAnd this is how the `Account` class\
    \ should be now:\n\n```java\npublic class Account {\n    int number;\n    double\
    \ balance;\n    double limit;\n    Client owner; // !!!\n    // methods...\n}\n\
    ```\n\nIf you try to access a method or attribute of an object that hasn’t been\
    \ assigned any value yet (i.e., it points to `null`), you will get an error during\
    \ execution: `NullPointerException`.\n\nBesides the `Bank` that we are creating,\
    \ let's see how certain classes related to a car factory would look like. Let's\
    \ create a `Car` class, with certain attributes that describe its characteristics\
    \ and certain methods that describe its behavior.\n\n```java\npublic class Car\
    \ {\n    String color;\n    String model;\n    double currentSpeed;\n    double\
    \ maxSpeed;\n    // turns on the car\n    void on() {\n        System . out .\
    \ println( \"The car is on\" );\n    }\n    // accelerates a certain amount\n\
    \    void accelerate( double amount) {\n        double newSpeed = this . currentSpeed\
    \ + amount;\n        if ( newSpeed <= maxSpeed) {\n            currentSpeed =\
    \ newSpeed;\n        }\n    }\n}\n```\n\nLet’s test our car in a new program:\n\
    \n```java\npublic class TestCar {\n    public static void main( String [] args)\
    \ {\n        Car myCar = new Car ();\n        myCar. color = \" Green \";\n  \
    \      myCar. model = \" Lamborghini \";\n        myCar.currentSpeed = 0;\n  \
    \      myCar.maxSpeed = 70;\n        // Turns on the car\n        myCar. on();\n\
    \        // Accelerates the car\n        myCar.accelerate( 20 );\n        System\
    \ . out . println(\" Current Speed : \" + myCar.currentSpeed);\n    }\n}\n```\n\
    \nWe know our car has an engine. So why don’t we create a class to describe it?\n\
    \n```java\npublic class Engine {\n    int power;\n    String type;\n}\n```\n"
