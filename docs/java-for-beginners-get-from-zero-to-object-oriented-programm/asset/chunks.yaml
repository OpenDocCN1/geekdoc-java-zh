    \n## IntelliJ IDEA\n医生有像医院或诊所这样的环境，为他们提供一系列工具和物品来帮助他们工作。医生可以在病人家里检查病人，但如果没有特定的环境，他就无法手术。\n\
    \n就像医生需要手术室一样，开发者需要一个 `IDE`，全称 `Integrated Development Environment`（集成开发环境）。根据维基百科，“一个\
    \ `IDE` 是一种为计算机程序员提供软件开发全面设施的软件应用程序。一个 `IDE` 通常由源代码编辑器、构建自动化工具和调试器组成。大多数现代 IDE\
    \ 都具有智能代码补全。”\n\n### 我应该下载哪个 IDE？\n我在书中将使用 `IntelliJ IDEA`，但你可以使用任何 `IDE`。可以是\
    \ `NetBeans`、`Eclipse` 等任何工具。实际上，有些人可能会认为由于某些原因，这些是更好的 `IDEs`。但作为初学者，这不会产生太大影响，所以这不是这里最重要的事情，你不应该花费超过几秒钟来决定。\n\
    \n如果你要下载 `IntelliJ`，在 Google 上搜索“IntelliJ IDEA”，点击第一个链接，并按照相同的步骤下载与你的 `OS` 兼容的\
    \ `Community Edition`（免费版）。![](img/00004.jpeg)\n\n## 你的第一个程序\n在编程世界，第一次使用某种语言或工具时编写一个“Hello\
    \ World”程序是一个传统。有些人甚至会说，否则你会受到诅咒。总之，防患胜于就医。一个“Hello World”程序是一个会在屏幕上显示信息——“Hello\
    \ World”的程序。\n\n打开你的 `IDE`。点击 `Create New Project`（新建项目）。![](img/00005.jpeg)\n\
    \n确保左侧标签页上选中了 `Java`。然后选择 `Project SDK`。如果没有可用的 `Project SDK`，点击 `New...` 并选择\
    \ `jdk-9` 文件夹。它可能有这个路径（如果你使用的是 `Windows`）：`C:\\Program Files\\Java\\jdk-9\\`。如果你在这样做时遇到任何困难，不要担心。你可以随时在\
    \ Google 上搜索。\n\n然后点击 `Next`。（images/00006.jpeg）\n\n再次点击 `Next`。（我们将从零开始构建程序——现在不使用快捷模板！）![](img/00007.jpeg)\n\
    \n在 `Project Name`（项目名称）中，输入 `My First Program`。你可以保持 `Project Location`（项目位置）不变。然后点击\
    \ `Finish`。（images/00008.jpeg）\n\nIDE 现在已经为我们处理好了一切。你的计算机上创建了一个文件夹，用于存储你将为程序创建的文件。\n\
    \n你看到下一张图中 `My First Program` 旁边那个小三角形了吗？如果你点击它，它会显示项目的项目的其他部分：`.idea`、`src` 和\
    \ `My First Program.iml`。这就是你如何浏览项目结构的方法。![](img/00009.jpeg)\n\n现在右键点击 `src`，进入\
    \ `New` 然后选择 `Java Class`。我们正在我们的项目内部创建一个新的 `Java Class`。稍后我们会理解这意味着什么。(images/00010.jpeg)\n\
    \n让我们给我们的类起个名。输入 `MyFirstClass` 并按击 `OK`。类名使用大驼峰命名法（upper camel case）。\n\n###\
    \ 什么是驼峰命名法？\n驼峰命名法（Camel Case）之所以有这个名字，是因为它类似于驼的驼。它是各种编程语言之间非常常见的约定。![File:CamelCase.svg](img/00011.jpeg)\n\
    \n它是编写复合词或短语的做法，每个单词的首字母大写且不加空格地合并。例如：\n- `ClassesWithUppercaseLetter`\n- `MyClass`\n\
    - `CodeificIsGreat`\n\n小驼峰命名法（lower camel case）：整个单词的首字母是小写的，但随后的字母是大写的。例如：\n\
    - `functionsAndVariablesDoNot`\n- `variableName`\n- `dateOfBirth`\n\n我们现在有一个全新的类正等待编码。注意，我们刚刚创建了以\
    \ `.java` 结尾的文件 `MyFirstClass`。这是一个 Java 文件。(images/00012.jpeg)\n\n## 主方法 (Main\
    \ Method)\n让我们让 `main` 方法看起来如下：\n\n```java\npublic class MyFirstClass {\n\n  \
