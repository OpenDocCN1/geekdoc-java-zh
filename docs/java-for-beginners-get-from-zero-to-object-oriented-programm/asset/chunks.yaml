  trans: "\n当你运行程序时，它会要求你输入一个数字。我输入了 25，然后它打印出“The chosen number is: 25”。我知道这没什么什么魔法。但正如我常说的的，你必须从某处开始。\n\
    \n### 它是如何发生的？\n\n首先，我们必须在类头之前通过 `import java.util.Scanner;` 来导入 `Scanner` 类。通过导入它，我们就可以访问该类的方法和函数（我们将在课程的稍后部分回到这一点）。\n\
    \n然后，我们创建一个名为 `scan` 的 `Scanner` 对象（你可以随需为其命名）：\n`Scanner scan = new Scanner (\
    \ System . in );`\n\n还记得我们可以如何扩展 `String` 声明吗？就是这样！\n`String scan = new String\
    \ ( \"Scanning...\" );`\n\n用户无法猜到我们想要什么，所以我们必须放置一些指令，在这种情况下，这些指令会打印到终端。\n\n我们创建了一个名为\
    \ `n` 的整数变量，它将下一个输入作为 `int` 存储——`scan.nextInt()`。因此，如果用户输入文本，例如，程序将会崩溃：\n\n完成后，我们必须使用\
    \ `scan.close()` 完成 `Scanner` 对象。最后，我们打印出得到的那个数字：`System . out . println( \"The\
    \ chosen number is: \" + n);`\n\n同样的方法也适用于其他数据类型的 `scan`：\n* 获取字节型：`byte a = scan\
    \ . nextByte();`\n* 获取短整型：`short b = scan . nextShort();`\n* 获取单浮点型：`float c =\
    \ scan . nextFloat();`\n* 获取长型：`long d = scan . nextLong();`\n* 获取双精度型：`double\
    \ e = scan . nextDouble();`\n* 获取布尔型：`boolean f = scan . nextBoolean();`\n\n为了获取字符串作为输入，我们使用\
    \ `scan.next()`（假设在这种情况下我们的 `Scanner` 对象名为 `scan`）。\n\n### 另一种导入方式\n\n如果你在导入 `Scanner`\
    \ 类之前输入 `Scanner scan = new Scanner ( System . in );`，你可以点击 \"Scanner\" 单词，然后将光标移回，就会看到一个红灯。点击它，选择\
    \ `Import Class` 然后选择 `Scanner (java.util)`，这样 IDE 就会自动为你编写导入语句！！\n\n### 另一个快捷键！\n\
    \n与其输入 `System.out.println()`，你可以输入 `sout` 并按回车：\n\n## 练习集 #3\n\n为以下每个练习题创建一个类（例如\
    \ `Set3Exercise1`），并编写你的解决方案，然后与我的进行比较。示例中的输入是*斜体*的。\n\n1) 编写一个程序，包含一个 `String`\
    \ 对象，你在其中放入你的名字并将其打印出来。\n2) 编写一个程序，询问人的名字然后问候该个人。\n*示例：*\nWhat is your name?\n\
    Lucas\nHello, Lucas!\n3) 编写一个程序，移除用户输入的 `String` 前后的空格，然后打印出新的 `String`。\n*示例：*\n\
    Enter a String:      Lucas      \nLucas\n4) 编写一个程序，获取两个 `Strings`，按照以下规则连接并打印它们：\n\
    * 第一个 `String` 必须以小写打印\n* 第二个 `String` 必须以大写打印\n* 两个 `Strings` 之间必须有一个空格\n*示例：*\n\
    Enter a String: Code\nEnter another String: Nific\ncode NIFIC\n5) 编写一个程序，获取用户的年龄然后打印出他/她出生年份。\n\
    *示例（在 2017 年）：*\nHow old are you?\n16\nYou were born in 2001\n6) 编写一个程序，给定一个数字，打印它的前驱和后继。\n\
    *示例：*\nEnter a number: 10\nPredecessor: 9\nSuccessor: 11\n7) 编写一个程序，给定一个数字 `x`，打印：\n\
    * `x` 的 2 倍\n* `x` 的平方\n* `x` 除以 2\n* `x` 的平方根\n*示例：*\nEnter a number: 9\n18\n\
    81\n4.5\n8) 编写一个程序，获取两个数字并打印它们的平均值（算术平均值）。\n*示例 1：*\nEnter a number: 8\nEnter\
    \ another number: 10\nThe average is 9.0\n*示例 2：*\nEnter a number: 7\nEnter another\
    \ number: 9.5\nThe average is 8.25\n9) 编写一个程序，计算打 10% 折后的产品价格。\n*示例 1：*\nWhat\
    \ is the price of the product? 120\nAfter a 10% discount, this product will be\
    \ sold for $ 108\n*示例 2：*\nWhat is the price of the product? 253.9\nAfter a 10%\
    \ discount, this product will be sold for $ 228.51\n\n如果你遇到了这个错误：`Exception in\
    \ thread \"main\" java.util.InputMismatchException`，你可能需要使用类似 `scan.useLocale(Locale.US)`（假设你的\
    \ `Scanner` 对象名为 `scan`）并 `import java.util.Locale`。或者你可以输入 `120,0` 而不是 `120.0`。该错误是因为你国家的数字格式与美国不同（像我一样，是巴西人）。\n"
