- fmt: "\nDon't worry! You don't understand anything now and it might look very confusing,\
    \ I know. If I were to give me any advice when I started programming, I'd say\
    \ \"Get used to not knowing what everything means. It's completely OK. It just\
    \ means you have things to learn!\".\n\n## 2. You compile it\nThen there's `javaC`,\
    \ which is our `Java Compiler`. It checks for errors and won't let you compile\
    \ until it's satisfied that everything will run correctly. The compiler creates\
    \ a new document, coded into `Java bytecode`. Any device capable of running Java\
    \ will be able to interpret/translate this file into something it can run. The\
    \ compiled bytecode is platform-independent. And that's where `JVM` comes in.\n\
    \n## 3. The JVM runs it\nThe `JVM` (`Java Virtual Machine`) interprets the bytecode\
    \ that was created and gives instructions that the device will understand. Each\
    \ `OS` (whether it's `Windows`, `MacOS`, `Linux` or even a mobile platform) can\
    \ have its own `JVM` in order to run Java programs. No matter in what `OS` the\
    \ bytecode gets created, it can run on any device that has a `JVM`. That's what\
    \ is called \"Write Once, Run Anywhere\".\n\n# Chapter 1: Getting Started\n\n\
    - `JVM` = `Java Virtual Machine`.\n- `JRE` = `Java Runtime Environment`, which\
    \ contains everything you need in order to execute Java applications.\n- `JDK`\
    \ = `Java Development Kit`, which contains everything you need in order to develop\
    \ Java applications. That’s what we need to download.\n\n**WARNING**: Unless you\
    \ have a secret fetish that involves downloading and preparing stuff, things will\
    \ be a little bit boring for now. But that's something we just have to do once.\
    \ Then you'll only need to do something like this again if you're updating these\
    \ tools, which doesn't happen all the time.\n\nBy the time I'm writing this, the\
    \ newest `JDK` version is `JDK 9`. Do a little research and if there's a newer\
    \ and also stable version, download it.\n\nLet's start by googling \"JDK 9\" and\
    \ clicking on the first result. To download, you have to Accept License Agreement\
    \ and then you can select a file that fits your `OS` (`Windows`, `MacOS` or `Linux`).![](images/00003.jpeg)\n\
    \nIt might take a while for the download to finish. Then, install it. Leave all\
    \ the settings as default, unless you really know what you're doing.\n\n## IntelliJ\
    \ IDEA\nDoctors have an environment such as a hospital or clinic, that provides\
    \ them with a bunch of tools and things that will help them do their work. A doctor\
    \ might be able to examine a patient in that person's house, but (s)he can't do\
    \ a surgery without a specific environment.\n\nJust like doctors need a surgery\
    \ room, developers need an `IDE`, which stands for `Integrated Development Environment`.\
    \ According to Wikipedia, \"an `IDE` is a software application that provides comprehensive\
    \ facilities to computer programmers for software development. An `IDE` normally\
    \ consists of a source code editor, build automation tools and a debugger. Most\
    \ modern IDEs have intelligent code completion.\"\n\n### What IDE should I download?\n\
    I'll use `IntelliJ IDEA` in this book, but you can use any `IDE`. It can be `NetBeans`,\
    \ `Eclipse`, whatever. Actually, some might argue that these are better `IDEs`\
    \ for some reason. But as a beginner, that won't make much of a difference, so\
    \ that's not the most important thing here and you shouldn't spend more than a\
    \ few seconds to decide.\n\nIf you'll download `IntelliJ`, google \"IntelliJ IDEA\"\
    , click on the first link, and follow the same steps to download the `Community\
    \ Edition` (for free) that is compatible with your `OS`.![](images/00004.jpeg)\n\
    \n## Your First Program\nIt’s been a tradition in the programming world to do\
    \ a “Hello World” program for the first time you’re using some language or tool.\
    \ Some might even say you’ll be cursed otherwise. Anyway, better safe than sorry.\
    \ A “Hello World” program is a program that will show a message on the screen\
    \ – “Hello World”.\n\nOpen your `IDE`. Click on `Create New Project`.![](images/00005.jpeg)\n\
    \nMake sure `Java` is selected on the left tab. Then select the `Project SDK`.\
    \ If no `Project SDK` is available, click on `New...` and select the `jdk-9` folder.\
    \ It probably has this path (if you're using `Windows`): `C:\\Program Files\\\
    Java\\jdk-9\\`. If you have any trouble doing that, don't worry. You can always\
    \ google it.\n\nThen click `Next`.![](images/00006.jpeg)\n\nClick `Next`. (We're\
    \ gonna build the program from scratch – no shortcuts templates for now!)![](images/00007.jpeg)\n\
    \nIn `Project Name`, type `My First Program`. You can leave the `Project Location`\
    \ as it is. Then click `Finish`.![](images/00008.jpeg)\n\nThe IDE now has handled\
    \ everything for us. A folder was created on your computer to store the files\
    \ you’re going to create for you program.\n\nDo you see that little triangle next\
    \ to `My First Program` in the next image? If you click on it, it'll show other\
    \ things that are a part of your project: `.idea`, `src` and `My First Program.iml`.\
    \ That’s how you can navigate through your project structure.![](images/00009.jpeg)\n\
    \nNow right-click on `src`, go to `New` and then `Java Class`. What we're doing\
    \ is to create a new `Java Class` inside our project. Later we'll understand what\
    \ that means.![](images/00010.jpeg)\n\nLet's give a name to our class. Type `MyFirstClass`\
    \ and hit `OK`. Classes names use upper camel case.\n\n### What is Camel Case?\n\
    Camel Case has this name because it is similar to the humps of a camel. It's a\
    \ very common convention between various programming languages.![File:CamelCase.svg](images/00011.jpeg)\n\
    \nIt is the practice of writing compound words or phrases, where each word is\
    \ capitalized and merged without spaces. Examples:\n- `ClassesWithUppercaseLetter`\n\
    - `MyClass`\n- `CodeificIsGreat`\n\nLower camel case: the first letter of the\
    \ entire word is lowercase, but subsequent letters are uppercase. Examples:\n\
    - `functionsAndVariablesDoNot`\n- `variableName`\n- `dateOfBirth`\n\nWe now have\
    \ a brand-new class just waiting to be coded. Note that we’ve just created file\
    \ `MyFirstClass` that ends with `.java`. It's a Java file.![](images/00012.jpeg)\n\
    \n## The Main Method\nGo ahead and make your code look like this:\n\n```java\n\
    public class MyFirstClass {\n    public static void main(String[] args) {\n\n\
    \    }\n}\n```\n\nOK, you've just copied the main method into your program. I'll\
    \ explain it soon.\n\nYou're probably wondering: \"Do I have to write these weird\
    \ words EVERY TIME I want to create a new program?\". Well, they do have to be\
    \ there. But you don't have to write them all. Let the IDE do that. Just write\
    \ the initial letters of the main method declaration, hit Enter, and the magic\
    \ will happen.![](images/00013.jpeg)\n\nNow you get to be lazy again! Right-click\
    \ on the tab (MyFirstClass.java as you can see in last image) and select `MyFirstClass.main()`.\
    \ After a few seconds, a window will pop up. When you see a message like `Process\
    \ finished with exit code 0` it means the program ran and finished. Apparently,\
    \ nothing happened. We only created a class and put the main method inside it.\
    \ There's no instruction for the computer to do anything.\n\nWe have to ask the\
    \ computer to do things for us, such as showing messages, doing calculations,\
    \ creating and modifying files, etc. Let's start printing some stuff. High priority\
    \ in our To-do list: get rid of the Hello curse. We have to print it, otherwise\
    \ we will never learn Java. There are some commands that can print a message on\
    \ the screen. `System.out.print()` and `System.out.println()` are the most used\
    \ ones. The difference between them is that `System.out.println()` jumps to a\
    \ new line after printing the message. Since we're going to print out only one\
    \ line of text, there's no problem in using `System.out.print()`. But in the next\
    \ chapters, we're going to use `System.out.println()`.\n\nGo ahead and type `System.out.print(\"\
    Hello, World!\");` inside the main method (see image below).![](images/00014.jpeg)\n\
    \nNow the file does three things:\n1. **It declares a class called MyFirstClass**:\
    \ The reserved word `public` indicates that this class/file is public, i.e. it\
    \ can be invoked from any point in the program. The word `class` introduces a\
    \ class definition in Java, i.e. defines that the code between the curly braces\
    \ will be a class. Then we have the class name.\n2. **It defines the main method**:\
    \ The reserved word `void` is our return type in this case; it indicates that\
    \ this method will perform a task (print the line of text on the screen, in this\
    \ case) but will NOT return any information when finished. The term `String[]\
    \ args` inside the parentheses are arguments passed to this program and are required\
    \ in `main`, although we will not use it here.\n3. **The main method calls System.out.print\
    \ to output some text**: In Java, and in all object-oriented programming languages,\
    \ a class defines an object. An object is a self-contained item that interacts\
    \ with other objects. In Android, such object would include elements in the UI,\
    \ a network connection, some location data, and so on.\n\nEach Java program must\
    \ define a method called `main` in at least one class. It is the entry point,\
    \ where the program starts executing. In the example above the main method has\
    \ just one line of code, a call to `System.out.print` to output “Hello, World!”.\
    \ `print()` is a method that belongs to the `PrintStream` class and is included\
    \ as part of the `System` class.\n\nHere are some things I want you to notice\
    \ about that code:\n- **Curly braces `{}`**: They are used to indicate the beginning\
    \ and the ending of a class/method definition body. Every time you open a curly\
    \ brace `{`, you have to close it `}`, otherwise you get a compilation error.\n\
    - **Indentation**: Do you see that whitespace before `System.out ...` and also\
    \ before `public static void main...`? It is called indentation. In Java, your\
    \ program will run even if you don't indent correctly. For example, the code below\
    \ will produce the exact same output.![](images/00015.jpeg)\n\nSo... why don't\
    \ we write it like that to save lines? Because it's a TERRIBLE thing to do!!!\
    \ (Yes, I AM screaming!) Not only should you indent your code, but you have to\
    \ do it. I mean it. Indentation makes your code a lot more readable (for you and\
    \ for others) and, consequently, facilitates the maintenance. The IDE helps you\
    \ automatically with that, but if you ever need to put that whitespace, hit Tab\
    \ on your keyboard.\n- **Double quotes `\" \"`**: That message was between double\
    \ quotes, which means it's a `String`. We'll learn about Strings in Chapter 4.\n\
    - **Semicolon at the end `;`**: At the end of every line, we have to put a semicolon\
    \ (except for lines that contain an opening or closing bracket). Java statements\
    \ end with a semicolon and our code won't even compile if that kind of error (missing\
    \ semicolon) is found.\n"
