  trans: "\n让我们运行它吧！右键点击打开的 `MyFirstClass.java` 标签，并像我们之前的那样选择运行 `MyFirstClass.main()`。在\
    \ Windows 上，执行上一次运行文件的快捷键是 `Ctrl+Shift+F10`![](img/00016.jpeg)\n\n你刚刚完成了你的第一个\
    \ Java 程序。恭喜你！从现在起，我假设你已经知道如何进行所有操作（打开 IDE、启动新项目、创建类并编写 main 方法）。\n\n# 第 2 章：变量与数据类型\n\
    \n考虑以下程序：\n```java\npublic class Main {\n    public static void main( String []\
    \ args) {\n        System . out . println(\" Score = \" + 10 );\n        System\
    \ . out . println(\" Good job!\");\n    }\n}\n```\n\n这个程序打印出“Score = 10”，然后打印出“Good\
    \ job!”。但到第三行结束时，计算机甚至已经不记得打印出来的那个分数了。这就像我们不想听某人说话时，避免在大脑中保存任何信息，我们直接忽略了它。但我们可以使用名为\
    \ `variable`（变量）的东西将该分数存储在程序中。把它想象一个盒子，你可以在里面放入一些数据，稍后回来提取它们。\n\n由于数据有不同的形式，变量需要用一种\
    \ `type`（类型）来定义，这告诉 Java 存储的是什么。Java 的一些原始数据类型包括 `int`（整数）、`float`、`double`（双精度浮点数）和\
    \ `boolean`（布尔/真假值）。\n\n打开你的 IDE 并在 `src` 文件夹内创建一个名为 `Variables` 的新类。用 `main`\
    \ 方法完成代码（挑战：不要使用我在上一节课中教给你的技巧，尝试尽可能记住尽可能多的内容）。如果你愿意，也可以删除 `MyFirstClass`![](img/00017.jpeg)\n\
    \n将以下代码段复制并粘贴到 `main` 方法中：\n```java\nint i;\ni = 0 ;\nSystem . out . println(\
    \ i);\n```\n\n要运行它，右键点击 `Variables.java` 标签并选择运行 `Variables.main()`。完成一次后，你就可以通过那个漂亮的绿色播放按钮快速运行了![](img/00018.jpeg)你也可以选择最近执行过的类，比如\
    \ `MyFirstClass`![](img/00019.jpeg)\n\n运行 `Variables.java` 后，将显示此窗口![](img/00020.jpeg)该程序以某种方式打印了数字\
    \ 0。让我们看看是如何发生的。完整代码看起来应该是这样的：\n```java\npublic class Variables {\n    public\
    \ static void main( String [] args) {\n        int i;\n        i = 0 ;\n     \
    \   System . out . println( i);\n    }\n}\n```\n\n* 这是我们的类头\n* 这里有 `main` 方法\n\
    * `main` 方法内部有 3 条语句。第一条声明了一个类型为 `int`（整数）、名为 `i` 的变量（即创建了一个变量）\n* 第二条通过将值 0 存储在其中来初始化该变量\n\
    * 第三条打印存储在变量 `i` 中的值。注意，我们打印的不是字母“i”，而是变量 `i` 的值。\n\n**重要**：你必须在使用变量之前对其进行声明！因此，以下代码是错误的：\n\
    ```java\n// 错误！\npublic class Variables {\n    public static void main( String\
    \ [] args) {\n        System . out . println( i);\n        int i;\n        i =\
    \ 0 ;\n    }\n}\n```\n如果你犯了那个错误，你的 IDE 会警告你![](img/00021.jpeg)`Cannot resolve\
    \ symbol ‘i’` 意味着 IDE 找不到关于 ‘i’ 的任何内容。它在 `System.out.println()` 调用之前没有被声明。\n\n\
    ***\n\n人类：嘿，你能打印一张 Hannah 的照片吗？\n计算机（思考中）：Hannah 是谁？我从未听说过她。我怎么能打印 Hannah 的照片呢？愚蠢的人……）\n\
    计算机说：无法解析  符号 ‘HANNAH’\n\n***\n\n开玩笑的！犯错没关系。实际上，在你的学习路径和职业生涯中你会犯**许多**错误。\n\n\
    ## 变量声明\n\n这里是变量声明的通用方法：![](img/00022.jpeg)这就是我们在程序中做的做法。但我们可以将声明和初始化合并到一条语句中，这样更实用，像这样![](img/00023.jpeg)\n\
    \n值是可以改变的。你可以更改变量内部的值。将你当前的代码替换为以下内容，然后运行它看看发生了什么：\n```java\npublic class Variables\
    \ {\n    public static void main( String [] args) {\n        int i = 10 ;\n  \
    \      System . out . println( i);\n        i = i + 5 ;\n        System . out\
    \ . println( i);\n    }\n}\n```\n我在等……这是输出：\n10\n15\n首先，我声明了一个名为 `i` 的整数变量，给它赋值\
    \ 10 然后打印它。然后，我给 `i` 加上 5，结果得到 15，这是被打印的第二个值。\n\n与其使用 `i = i + 5;`，不如使用 `i +=\
    \ 5;`。\n你也可以改变变量 `i` 的值：\n```java\npublic class Variables {\n    public static\
    \ void main( String [] args) {\n        int i = 10 ;\n        System . out . println(\
    \ i);\n        i = i + 5 ;\n        System . out . println( i);\n    }\n}\n```\n\
    变量在程序中存储的：\n```java\npublic class Variables {\n    public static void main( String\
    \ [] args) {\n        int i = 10 ;\n        System . out . println( i);\n    \
    \    i -= 5 ;\n        System . out . println( i);\n    }\n}\n```\n赋值的：\n```java\n\
    public class Variables {\n    public static void main( String [] args) {\n   \
    \     int i = 10 ;\n        System . out . println( i);\n        i -= 5 ;\n  \
    \      System . out . println( i);\n    }\n}\n```\n赋值的：\n```java\npublic class\
    \ Variables {\n    public static void main( String [] args) {\n        int i =\
    \ 10 ;\n        System . out . println( i);\n        i -= 5 ;\n        System\
    \ . out . println( i);\n    }\n}\n```\n赋值的：\n```java\npublic class Variables {\n\
    \    public static void main( String [] args) {\n        int i = 10 ;\n      \
    \  System . out . println( i);\n        i -= 5 ;\n        System . out . println(\
