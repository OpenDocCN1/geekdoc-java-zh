    \ Variables {\n    public static void main( String [] args) {\n        int i =\
    \ 10 ;\n        System . out . println( i);\n        i += 5 ;\n        i = 7 ;\n\
    \        System . out . println( i);\n    }\n}\n```\nActually, looking closer\
    \ at the raw text: \"On the sixth line, the IDE assigned a new value of 7. Wait,\
    \ the output is 1015\". The text seems to have merged versions. I will stick to\
    \ the literal strings provided.\n\nRe-formatting the final block based on the\
    \ text:\n```java\npublic class Variables {\n    public static void main( String\
    \ [] args) {\n        int i = 10 ;\n        System . out . println( i);\n    \
    \    i += 5 ;\n        i = 7 ;\n        System . out . println( i);\n    }\n}\n\
    ```\nWait, the text says: \"On the sixth line, the IDE assigned a new value of\
    \ 7. Wait, the output is 1015\". This looks like a corruption in the source text.\
    \ I will present the sentences as clearly as possible.\n\n## Primitive Data Types\n\
    \nWe’ve created variables of type `int` earlier in this chapter. But, as I said,\
    \ there are other types, which are `primitive data types`, a data type provided\
    \ by the language as a building block. They are not some kind of add-on, but rather\
    \ a simple component of the language.\n\nLet’s see a little bit of Java’s primitive\
    \ data types.\n\n`int` They have a minimum value of -231 and a maximum value of\
    \ 231 -1. That’s a lot! Int variables can be used to store your age, a game score\
    \ and the number of times you were stupid (if it’s less than 231-1 LOL ), for\
    \ example.\n\n`double` It can be used to store larger integers or more precise\
    \ floating-point numbers (which range from approximately 4.94e-324 to 1.803ee308\
    \ ) when compared to other data types. It’s accurate to 14 or 15 significant digits.\
    \ In other words, double is the most used type to store [real numbers](https://en.wikipedia.org/wiki/Real_number)\
    \ but it can also store integers.\n\n`boolean` The boolean data type has only\
    \ two possible values: true and false . Use this data type for simple flags that\
    \ track true/false conditions. This data type represents one bit of information,\
    \ but its “size” isn’t something that’s precisely defined.\n\nExamples:\n```java\n\
    boolean isOn = true ;\n```\n"
