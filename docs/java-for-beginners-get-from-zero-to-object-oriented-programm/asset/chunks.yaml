  trans: "\n\n```java\ndouble average = ( n1 + n2) / 2.0 ;\nSystem.out.println(\"\
    The average is \" + average);\n```\n\n```java\nimport java.util.Locale;\nimport\
    \ java.util.Scanner;\n\npublic class Main {\n    public static void main(String\
    \ [] args) {\n        Scanner scan = new Scanner(System.in); // 如果你遇到 java.util.InputMismatchException，请使用此方法\n\
    \        scan.useLocale(Locale.US);\n        System.out.println(\"What is the\
    \ price of the product?\");\n        double price = scan.nextDouble();\n     \
    \   scan.close();\n        double newPrice = price * 0.9;\n        System.out.println(\"\
    After a 10% discount, this product will be sold for $ \" + newPrice);\n    }\n\
    }\n```\n\n```java\nimport java.util.Locale;\nimport java.util.Scanner;\n\npublic\
    \ class Main {\n    public static void main(String [] args) {\n        Scanner\
    \ scan = new Scanner(System.in); // 如果你遇到 java.util.InputMismatchException，请使用此方法\n\
    \        scan.useLocale(Locale.US);\n        System.out.println(\"Enter the temperature\
    \ in Celsius:\");\n        double c = scan.nextDouble();\n        scan.close();\n\
    \        double f = 9 / 5.0 * c + 32;\n        System.out.println(c + \"ºC is\
    \ equivalent to \" + f + \"ºF\");\n    }\n}\n```\n\n# 第 5 章：条件与控制流\n\n我们每天都在做决定。无论是早餐吃什么，还是应该去哪里旅行，我们通常根据某些条件做出这些决定。例如：如果下雨，你就会打伞；如果你饿了，你就去吃；如果你想过马路，只有在确定车辆停止后才会过去。我可以一直说下去，但你懂的。如果满足预定义的条件，某些事情就会发生或不发生。可以将相同的原理应用于程序的控制流。\n\
    \n## If - Else\n\n在 Java 中，`if` 关键字是条件表达式的第一部分。它后面跟着括号内的一个布尔表达式，然后是一个代码块。如果布尔表达式求值为\
    \ `true`，则将执行后续的代码块。\n\n```java\nif (condition) {\n    // 在此处执行操作\n}\n```\n\n\
    例如：\n```java\nif (10 > 7) {\n    System.out.println(\"Codenific.com\");\n}\n```\n\
    \n### 逐步解释\n在上面的示例中，`10 > 7` 是被检查的布尔表达式。由于布尔表达式“10 大于 7”为 `true`，因此 `\"Codenific.com\"\
    ` 将打印到控制台。`if` 语句后面没有跟分号（`;`）。相反，它使用大括号（`{` 和 `}`）来包裹在布尔表达式为真时执行的代码块。\n\n有时，当\
    \ `if` 关键字后的布尔表达式为 `true` 时，执行一个代码块。其他时候，我们可能希望在布尔表达式为 `false` 时执行另一个代码块。我们可以写一个与第一个相反的布尔表达式的第二个\
    \ `if` 语句，但 Java 提供了一个名为 `if /else` 的条件快捷方式。\n\n如果 `if /else` 条件的布尔表达式求值为 `true`，将运行与\
    \ `if` 语句相关的代码块。否则，如果布尔表达式求值为 `false`，它将运行 `else` 关键字之后的代码块。\n\n这是一个 `if /else`\
    \ 语法的示例：\n```java\nboolean isRaining = false;\nif (isRaining) {\n    System.out.println(\"\
    I will stay at home\")\n} else {\n    System.out.println(\"I will go to the beach\"\
    ); // 打印这个\n}\n```\n\n在某些情况下，我们需要根据不同的布尔表达式执行单独的代码块。对于这种情况，我们可以使用 Java 中的 `if\
    \ / else if / else` 语句。如果 `if` 语句后的布尔表达式求值为 `true`，它将运行紧随其后的代码块。否则，如果 `else if`\
    \ 语句后的布尔表达式求值为 `true`，将运行紧随其后的代码块。最后，如果之前所有的布尔表达式都为 `false`，则运行 `else` 块中的代码。\n\
    \n这是一个使用 `if / else if / else` 语句控制流的示例：\n```java\nint age = 17;\nif (age >= 21)\
    \ {\n    System.out.println(\"You can drive. And you can buy an alcoholic drink\"\
    );\n} else if (age >= 16) {\n    System.out.println(\"You can drive\");\n} else\
    \ {\n    System.out.println(\"You will have to wait\");\n}\n```\n\n### 逐步解释\n\
    在上面的示例中，`int` 变量 `age` 等于 `17`，它不大于等于 `21`，但大于或等于 `16`。因此，将运行第二个代码块。\n\n## 三元运算符\n\
    \n当你仅仅想根据表达式返回一个值时，`if / else` 语句可能会变得很长。幸运的是，Java 提供了一个快捷方式，允许你在单行内编写 `if / else`。它被称为三元运算符。它包含：\n\
    * 一个布尔表达式\n* 一个在为 `true` 时执行的单一语句\n* 一个在为 `false` 时执行的单一语句\n\n示例：\n```java\nint\
    \ points = 10;\nString gameResult = (points >= 10) ? \"Winner\" : \"Loser\";\n\
    System.out.println(gameResult);\n\nchar justLetter = (points >= 10) ? 'W' : 'L';\n\
    System.out.println(justLetter);\n```\n\n### 逐步解释\n在上面的示例中，`points >= 10` 求值为 `true`。这将返回\
    \ `\"Winner\"`，并被赋值给变量 `gameResult` 然后打印。同样的情况也适用于其他类型，不仅仅是字符串。\n\n## 循环\n\n想象你想打印两次“Hello”。复制和粘贴该语句很容易。但如果你想打印\
    \ 100 次相同的消息呢？不要只是去复制所有内容。有更好的方法方法：使用循环。循环基本上是一组执行若干次数的指令集。\n\n```java\nwhile\
    \ (condition) {\n    System.out.println(\"Hello\");\n    i++; // 等于 i + 1\n}\n\
    ```\n\n### 逐步解释\n首先，我创建了一个 `int` 变量 `i` 来记录打印了 \"Hello\" 的次数。只要 `i` 小于 `10`，就会打印\
    \ `\"Hello\"` 并且 `i` 递增。经过几次递增后，会出现 `i` 等于 `9` 的点。将打印 `\"Hello\"`；`i` 再次递增并变为\
    \ `10`。此时循环中断，因为条件 `i < 10` 不再满足。这是输出：\n```\nHello\nHello\nHello\nHello\nHello\n\
    Hello\nHello\n```\n\n### 死循环 while 循环\n如果不递增那个 `i` 变量，它将始终小于 `10`。因此，条件将始终满足，循环永远不会中断。这可能是一个坏事——除非你希望它在特定环境中发生（我稍会谈到这一点）。程序将无限地打印\
    \ \"Hello\"。以下是发生这种情况的一些示例：\n\n```java\npublic class Main {\n    public static\
    \ void main(String [] args) {\n        int i = 0;\n        while (i < 10) {\n\
    \            System.out.println(\"Hello\");\n            i++;\n        }\n   \
    \ }\n}\n```\n\n***\n\n```java\npublic class Main {\n    public static void main(String\
    \ [] args) {\n        while (true) {\n            System.out.println(\"Hello\"\
    );\n        }\n    }\n}\n```\n"
- fmt: "\nThis is what an apparently infinite while loop looks like:\n\n```java\n\
    import java.util.Scanner;\npublic class Main {\n    public static void main(String\
    \ [] args) {\n        Scanner scan = new Scanner(System.in);\n        System.out.println(\"\
    Enter a word:\");\n        String s;\n        while (true) {\n            s =\
    \ scan.next();\n            if (s.equals(\"Hello\")) {\n                System.out.println(\"\
    Correct!\");\n                break;\n            } else {\n                System.out.println(\"\
    Try again!\");\n                continue;\n            }\n        }\n    }\n}\n\
    ```\n\n### Step-by-step explanation:\nAt the beginning, I created a `Scanner`\
    \ object and gave it a name of `scan`. I printed out “Enter a word:” to let the\
    \ user know that I’m asking for an input and I also created a `String` variable\
    \ to store that input. Then I have `while (true)` which basically means that the\
    \ loop won’t stop UNLESS we `break` it. Moving on, if the input is equal to “Hello”,\
    \ “Correct!” gets printed out and the loop breaks with the `break` statement.\
    \ Else, if the input is not equal to “Hello”, “Try again!” gets printed out and\
    \ the loop continues with the `continue` statement until “Hello” is entered by\
    \ the user.\n\n### For Loop\n`for` is a commonly used loop and even better than\
    \ `while`. This is its syntax:\n\n```java\nfor ( initialization; condition; increment)\
    \ {\n    // Do stuff here\n}\n```\n\nHere’s that same example we did with a while\
    \ loop (print \"Hello\" 10 times):\n\n```java\nfor ( int i = 0 ; i < 10 ; i++)\
    \ {\n    System.out.println( i + \" Hello\");\n}\n```\n\nOr you can do it like\
    \ this:\n\n```java\nfor ( int i = 1 ; i <= 10 ; i++) {\n    System.out.println(\
    \ i + \" Hello\");\n}\n```\n\nLet’s see what each part means:\n```java\nfor(int\
    \ i = 0; i < 10; i++ ) {\n    System.out.println(i + \" Hello\");\n}\n```\nIt\
    \ creates a temporary variable of type `int` called `i`. While `i` is less than\
    \ `10`, `i + “Hello”` will be printed and the variable `i` will be increased by\
    \ one. Similarly, if you wanted to print the numbers from 10 to 20:\n\n```java\n\
    for ( int i = 10 ; i <= 20 ; i++) {\n    System.out.println( i);\n}\n```\n\n//\
    \ OR\n\n```java\nfor ( int i = 10 ; i < 21 ; i++) {\n    System.out.println( i);\n\
    }\n```\nNote that this type of loop does not require you to keep track of a count\
    \ variable “manually”, so it’s easier to set up.\n\n### Controlling your Loops\n\
    Suppose we wanted to print out only the even numbers from 10 to 20. That means\
    \ there will be a condition: “Print the numbers in the range of 10 to 20 IF the\
    \ number is even”. Here’s how we can do it with both `while` and `for` loops.\n\
    \n```java\nfor ( int i = 10 i <= 20 ; i++) {\n    if ( i % 2 == 0 ) {\n      \
    \  System.out.println( i);\n    }\n}\nint i = 0;\nwhile ( i < 10 ) {\n    if (\
    \ i % 2 == 0 ) {\n        System.out.println(\"Hello\");\n    }\n    i++;\n}\n\
    ```\n\nThere’s also something called a **nested loop**. It happens when you put\
    \ a loop inside another loop. Like a `for` loop inside another `for` loop.\n\n\
    ### Workout Set #4\n\n1) What is the output of the following program?\n```java\n\
    public class Main {\n    public static void main(String [] args) {\n        int\
    \ age = 20;\n        boolean isMinor = age < 21;\n        if (isMinor) {\n   \
    \         System.out.println(\"You can NOT buy drinks in the US\");\n        }\
    \ else {\n            System.out.println(\"You can buy drinks in the US\");\n\
    \        }\n    }\n}\n```\n\n2) What is the output of the following program?\n\
