    ![](img/00001.jpeg) Java 入门：从零开始学习对象化编程 作者：Lucas Barzan


    ## 引言

    我付出了巨大的努力才为你编写这本书，因为我知道学习编程是多么困难，尤其是当你刚开始的时候。所以，我想按照我自己的学习方式来教你，那就是通过实践来学习。


    ## 本本书适合谁看

    这本书适合所有想学习 Java 但对编程一无所知或略有了解的人。如果你想成为一名程序员并想从学习 Java 开始，那么这本书就是你的第一步。如果你想开发 Android
    应用，这本书就是你的第一步。如果你想学习一些新东西，这本书就是你的第一步。


    ## 谁应该避开这本书

    首先，这本书是给那些愿意学习新事物的人的。在过程中，你会很多时候感到困惑或不知所措，但如果你想实现最终目标，就必须应对这种挫败感。你的动力（WHY）必须足够强大，否则你才会在读这本书的过程中放弃。此外，如果你正在寻找一本涵盖
    Java 语言所有内容的高级指南，我不推荐这本书。


    ## 如何学习 Java

    有些书只给你理论，甚至都懒得让你去练习。我认为这是一种糟糕的教学方法（至少对于编程而言）。你应该尽快获得实践经验，正因如此，你经常会在 IDE 中编写和运行代码。所以，我建议你坐在电脑旁。把它看作一门课程，而不是一本可以在床上或沙滩上读的浪漫小说。练习应该被认真对待。这是成为优秀程序员的唯一途径，如果你不做练习题，我无法保证你能够学到任何东西。我是认真的。没有捷径。练习章节被称为“训练组（Workout
    Sets）”，因为我们的智力就像肌肉一样：我们使用得越多，它就生长得越强壮。在读完这本书时，你将完成 70 道练习题。尽管在大多数情况下我都提供了练习题的答案，但仅仅思考某道题并直接跳到答案并不算练习。如果你那样做，你只是在自欺欺人。所以，如果你已经下载了这本书，你就必须对自己做出承诺：阅读。思考。做练习。重复。相信这个过程，美好的结果将会到来！


    ## 第 0 章：Java？

    ### 什么是 Java？

    根据官方网站，“Java 是由 Sun Microsystems 在 1995 年首次发布的编程语言和计算平台。除非你安装了 Java，否则很多应用程序都无法运行，而且每天都有新的应用诞生。Java
    安全且可靠。从笔记本电脑到数据中心，从游戏机到超级计算机，从手机到互联网，Java 无处不在！”Java 是一种通用语言，这意味着它可以用于构建任何东西（即它不是为了解决某种特定的编码问题而设计的）。在我忘记之前，Java
    和 JavaScript 除了名字相似且都是著名的语言之外没有任何关系。我不会向你灌输 Java 的历史，因为那超出了本书的范围。你只需要知道 Java 很有名，已经在市场上存在很久，所以没有消失的计划。这让我们进入下一个章节……


    ### 为什么要学习 Java？

    虽然 Java 不是最对初友友语言，但它提供了其他优势，例如：

    - 用 Java 编写的程序便于维护；

    - Java 拥有巨大的社区，你永远不会孤单。如果你遇到错误，很可能其他人也遇到过；

    - 掌握 Java 编程的人拥有极好的职业机会。谷歌或亚马逊等科技巨头也使用 Java 开发其网站的后端，由于它的性能良好，许多达到扩展期的初创公司会将其应用程序集成到
    Java 中，以支持需要高性能的功能；


    ## 如果出现问题了怎么办？

    在编程时犯错是非常常见的，尤其是在刚阶段。所以，如果你有任何书中未涵盖的问题，可以按照以下步骤解决问题：

    - 首先，搜索你的问题。我几乎可以保证其他人也经历过同样的情况。如果你遇到了错误，搜索该错误。如果你想知道如何实现某个功能，搜索该功能。你可能会在 `StackOverflow`
    上找到答案，那是开发者领域最大的问答网站。

    - 如果你没有找到任何答案——尽管这种可能性极小——你可以在 `StackOverflow` 上创建一个新问题并等待回答（这是互联网，发生不会花很长时间）。遵循网站的说明发布你的问题，而且首先，要确保没有任何可以帮助你的相似问题，否则你的问题会被作为重复内容而删除。


