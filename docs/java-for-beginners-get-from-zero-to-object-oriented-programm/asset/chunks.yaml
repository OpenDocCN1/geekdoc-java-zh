  trans: "\n\na1 = new Account ();\n\n`Account a2;`\n\na2 = new Account ();\n\n在上面的代码中，我们不能说\
    \ `a1` 是一个对象，因为 `a1` 是一个引用对象的变量。所以请记住，在 Java 中，变量永远不是对象。![](img/00033.jpeg)\n\n\
    在内部，`a1` 和 `a2` 将存储一个数字，用于标识 `Account` 位于内存的哪个位置。这样，通过使用 `.` 符号进行导航，Java 将访问位于目标位置的\
    \ `Account` 对象，而不是另一个。\n\n```java\npublic class TestReferences {\n    public static\
    \ void main( String args[]) {\n        Account a1 = new Conta ();\n        a1.\
    \ deposit( 100 );\n        Account a2 = a1;  // !!!\n        a2. deposit( 200\
    \ );\n        System . out . println( a1. balance);\n        System . out . println(\
    \ a2. balance);\n    }\n}\n```\n\n运行上述代码时会发生什么？`=` 运算符复制变量的值。但变量 `a1` 的值是什么？是对象吗？不是。实际上，存储的值是内存中对象的引用（地址）。\n\
    \n```java\nAccount a1 = new Account ();\nAccount a2 = a1;\n```\n![](img/00034.jpeg)\n\
    \n所以，当我写下 `a2 = a1` 时，`a2` 现在引用了与 `a1` 相同的同一个对象。因此，在这种特定情况下，使用 `a1` 还是 `a2` 并不重要，因为它们都引用同一个对象！这意味着表达式\
    \ `a1 == a2` 的求值结果为真。观察这种现象的另一种方法是知道我们只使用了一次 `new` 关键字，所以内存中只有一个 `Account` 对象。\n\
    \n```java\npublic static void main( String [] args) {\n    Account a1 = new Account\
    \ ();\n    a1. owner = \"Luke\" ;\n    a1. balance = 250 ;\n    Account a2 = new\
    \ Account ();\n    a2. owner = \"Luke\" ;\n    a2. balance = 250 ;\n    if ( a1\
    \ == a2) {\n        System . out . println( \"Equal accounts!\" );\n    }\n}\n\
    ```\n\n`==` 运算符比较存储在变量 `a1` 和 `a2` 内部的值，但这些变量并不持有对象，它们持有对象的地址。由于创建了两个不同的 `Accounts`\
    \ 且每个变量引用了其中一个，它们的地址不同。因此，`a1 == a2` 的求值结果为假，因为我们谈论的是内存中不同的对象。这有点微妙，因为我们倾向于比较它们的属性，而在这种情况下，这些属性是相同的。![](img/00035.jpeg)\n\
    \n### transfer() 方法\n\n如果我们想从一个账户转账到另一个账户该怎么办？它看起来是这样：\n\n```java\npublic class\
    \ Account {\n    // 其他属性和方法...\n    void transfer( Account destiny, double amount)\
    \ {\n        this . balance -= amount;\n        destiny. balance += amount;\n\
    \    }\n}\n```\n\n我们可能会想要获取两个 `Account` 类型的参数（`account1` 和 `account2`），但那是过程化的编程方式。我们想要在\
    \ `Account` 类型的对象上调用 `transfer()` 方法（这将是 `this`），因此该方法只获取一个 `Account` 类型的参数——资金的去向。\n\
    \n让我们使用该方法转账一些钱。\n\n```java\npublic class Program {\n    public static void main(\
    \ String [] args) {\n        Account a1 = new Account ();\n        a1. balance\
    \ = 1000.0;\n        Account a2 = new Account ();\n        a2. balance = 500.0;\n\
    \        a1. transfer( a2, 250 ); // !!!\n        System . out . println( \"a1\
    \ = \" + a1. balance);\n        System . out . println( \"a2 = \" + a2. balance);\n\
    \    }\n}\n```\n\n看到我如何通过 `a1. transfer( a2, 250 )` 向 `a2` 转账 250 美元了吗？在这种情况下，`a1`\
    \ 就是我谈到的那个“this”，而 `a2` 是目的地。我们大可以把该方法命名为 `transferTo`，因为它更符合逻辑。\n\n让我们也实现一些逻辑以避免从资金不足的账户转账。并让方法返回一个布尔值，以告知操作是否成功完成。我知道我们现在不在练习题集中，但请尝试自己实现这些内容。加油！……经过这些更改后将如下：\n\
    \n```java\nboolean transferTo( Account destiny, double amount) {\n    if ( this\
    \ . balance < amount) {\n        return false;\n    } else {\n        this . balance\
    \ -= amount;\n        destiny. balance += amount;\n        return true;\n    }\n\
    }\n```\n\n我们应该更进一步，使用我们之前创建的方法从 `a1` 中提款并向 `a2` 存款。也尝试实现一下那个吧！……\n\n```java\n\
    boolean transferTo( Account destiny, double amount) {\n    if ( this . draw( amount))\
    \ {\n        destiny. deposit( amount);\n        return true;\n    } else {\n\
    \        return false;\n    }\n}\n```\n\n### 属性\n\n再次记得我们为 `Account` 类创建的属性吗？\n\
    \n```java\nclass Account {\n    int number;\n    String owner;\n    double balance;\n\
    }\n```\n\n当我们创建一个对象时，这些变量获得默认值。数值变量获得 `0`，布尔型获得 `false`，而对象获得 `null`。但你也可以这样设置默认值：\n\
    \n```java\npublic class Account {\n    int number = 12345;\n    String owner =\
    \ “Lucas”;\n    double balance = 0;\n}\n```\n\n如果你尝试访问一个尚未赋值的对象（即它指向 `null`）的方法或属性，你在执行期间将得到一个错误：`NullPointerException`。\n\
    \n除了我们正在创建的 `Bank`，让我们看看与汽车相关的某些类是什么样的。让我们创建一个 `Car` 类，带有描述其特征的属性和描述其行为的方法。\n\n\
    ```java\npublic class Car {\n    String color;\n    String model;\n    double\
    \ currentSpeed;\n    double maxSpeed;\n    // 启动汽车\n    void on() {\n        System\
    \ . out . println( \"The car is on\" );\n    }\n    // 加速\n    void accelerate(\
    \ double amount) {\n        double newSpeed = this . currentSpeed + amount;\n\
    \        if ( newSpeed <= maxSpeed) {\n            currentSpeed = newSpeed;\n\
    \        }\n    }\n}\n```\n\n让我们在一个程序中测试我们的汽车：\n\n```java\npublic class TestCar\
    \ {\n    public static void main( String [] args) {\n        Car myCar = new Car\
    \ ();\n        myCar. color = \" Green \";\n        myCar. model = \" Lamborghini\
    \ \";\n        myCar.currentSpeed = 0;\n        myCar.maxSpeed = 70;\n       \
    \ // 启动汽车\n        myCar. on();\n        // 加速\n        myCar.accelerate( 20 );\n\
    \        System . out . println(\" Current Speed : \" + myCar.currentSpeed);\n\
    \    }\n}\n```\n\n我们知道汽车有一个引擎。所以我们为什么不创建一个类来描述它呢？\n\n```java\npublic class Engine\
    \ {\n    int power;\n    String type;\n}\n```\n\n"
