    \ class Main {\n    public static void main(String [] args) {\n        Scanner\
    \ scan = new Scanner(System.in); // Use this if you're getting java.util.InputMismatchException:\n\
    \        scan.useLocale(Locale.US);\n        System.out.println(\"Enter the temperature\
    \ in Celsius:\");\n        double c = scan.nextDouble();\n        scan.close();\n\
    \        double f = 9 / 5.0 * c + 32;\n        System.out.println(c + \"ºC is\
    \ equivalent to \" + f + \"ºF\");\n    }\n}\n```\n\n# Chapter 5: Conditionals\
    \ and Control Flow\n\nWe make decisions on a daily basis. Whether it’s about what\
    \ you’re eating for breakfast or where should you travel to, we often make those\
    \ decisions based on certain conditions. For example: if it’s raining, you use\
    \ an umbrella; if you’re hungry, you eat; if you want to cross the street, you\
    \ only do it after you’re sure that the cars have stopped. I could do this forever,\
    \ but you get it. If a predefined condition is met, something happens or not.\
    \ We can apply the same principle to the control flow of our programs.\n\n## If\
    \ - Else\n\nIn Java, the keyword `if` is the first part of a conditional expression.\
    \ It is followed by a Boolean expression inside parenthesis and then a block of\
    \ code. If the Boolean expression evaluates to `true`, the block of code that\
    \ follows will be run.\n\n```java\nif (condition) {\n    // Do stuff here\n}\n\
    ```\n\nFor example:\n```java\nif (10 > 7) {\n    System.out.println(\"Codenific.com\"\
    );\n}\n```\n\n### Step-by-step explanation\nIn the example above, `10 > 7` is\
    \ the Boolean expression that gets checked. Since the Boolean expression \"10\
    \ is greater than 7\" is `true`, `\"Codenific.com\"` will be printed to the console.\
    \ The `if` statement is not followed by a semicolon (`;`). Instead, it uses curly\
    \ braces (`{` and `}`) to surround the code block that gets run when the Boolean\
    \ expression is true.\n\nSometimes we execute one block of code when the Boolean\
    \ expression after the `if` keyword is `true`. Other times we may want to execute\
    \ a different block of code when the Boolean expression is `false`. We could write\
    \ a second `if` statement with a Boolean expression that is opposite the first,\
    \ but Java provides a shortcut called the `if /else` conditional.\n\nThe `if /else`\
    \ conditional will run the block of code associated with the `if` statement if\
    \ its Boolean expression evaluates to `true`. Otherwise, if the Boolean expression\
    \ evaluates to `false`, it will run the block of code after the `else` keyword.\n\
    \nHere's an example of `if /else` syntax:\n```java\nboolean isRaining = false;\n\
    if (isRaining) {\n    System.out.println(\"I will stay at home\")\n} else {\n\
    \    System.out.println(\"I will go to the beach\"); // this one gets printed\n\
    }\n```\n\nIn some cases, we need to execute a separate block of code depending\
    \ on different Boolean expressions. For that case, we can use the `if / else if\
    \ / else` statement in Java. If the Boolean expression after the `if` statement\
    \ evaluates to `true`, it will run the code block that directly follows. Otherwise,\
    \ if the Boolean expression after the `else if` statement evaluates to `true`,\
    \ the code block that directly follows will run. Finally, if all previous Boolean\
    \ expressions evaluate to `false`, the code within the `else` block will run.\n\
    \nHere's an example of control flow with the `if / else if / else` statement:\n\
    ```java\nint age = 17;\nif (age >= 21) {\n    System.out.println(\"You can drive.\
    \ And you can buy an alcoholic drink\");\n} else if (age >= 16) {\n    System.out.println(\"\
    You can drive\");\n} else {\n    System.out.println(\"You will have to wait\"\
    );\n}\n```\n\n### Step-by-step explanation\nIn the example above, the `int` variable\
    \ `age` is equal to `17`, which is not greater than or equal to `21`, but it is\
    \ greater or equal to `16`. Therefore, the second block will run.\n\n## Ternary\
    \ Conditional\n\n`if / else` statements can become lengthy when you simply want\
    \ to return a value depending on an expression. Fortunately, Java provides a shortcut\
    \ that allows you to write `if / else` in a single line. It is called the ternary.\
    \ It has:\n* A Boolean expression\n* A single statement executed if true\n* A\
    \ single statement executed if false\n\nExample:\n```java\nint points = 10;\n\
    String gameResult = (points >= 10) ? \"Winner\" : \"Loser\";\nSystem.out.println(gameResult);\n\
    \nchar justLetter = (points >= 10) ? 'W' : 'L';\nSystem.out.println(justLetter);\n\
    ```\n\n### Step-by-step explanation\nIn the example above, `points >= 10` evaluates\
    \ to `true`. This will return `\"Winner\"`, which is assigned to the variable\
    \ `gameResult` and then printed. The same applies to other types, not just Strings.\n\
    \n## Loop\n\nImagine you want to print \"Hello\" twice. It's easy to copy and\
    \ paste the statement. But what if you wanted to print the same message 100 times?\
    \ Don't just go out copying everything. There's a better way to do that: using\
    \ a loop. A loop is basically a set of instructions that get executed for a number\
    \ of times.\n\n```java\nwhile (condition) {\n    System.out.println(\"Hello\"\
    );\n    i++; // same as i + 1\n}\n```\n\n### Step-by-step explanation\nFirst,\
    \ I created an `int` variable `i` to keep track of the times \"Hello\" was printed.\
    \ While `i` is less than `10`, `\"Hello\"` will be printed and `i` will be incremented.\
    \ After several incrementations, there will be a point in which `i` is equal to\
    \ `9`. `\"Hello\"` will be printed; `i` will be incremented again and have a value\
    \ of `10`. That's when the loop breaks, because the condition `i < 10` is no longer\
    \ satisfied. This is the output:\n```\nHello\nHello\nHello\nHello\nHello\nHello\n\
    Hello\nHello\n```\n\n### Infinite while loop\nIf we didn't increment that `i`\
    \ variable, it would always be less than `10`. Hence, the condition would be always\
    \ met and the loop would never break. That can be a bad thing – except when you\
    \ want it to happen in a specific environment (I’ll talk about that later). The\
    \ program would keep printing \"Hello\" indefinitely. Here are some examples where\
    \ that happens:\n\n```java\npublic class Main {\n    public static void main(String\
    \ [] args) {\n        int i = 0;\n        while (i < 10) {\n            System.out.println(\"\
    Hello\");\n            i++;\n        }\n    }\n}\n```\n\n***\n\n```java\npublic\
    \ class Main {\n    public static void main(String [] args) {\n        while (true)\
    \ {\n            System.out.println(\"Hello\");\n        }\n    }\n}\n```\n"
