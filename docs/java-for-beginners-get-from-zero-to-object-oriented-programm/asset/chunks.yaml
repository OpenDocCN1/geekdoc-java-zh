  trans: "\n\n我们现在不深入探讨每个访问修饰符的细节（我甚至还没有谈到 `Protected`！）。我只是想让你们知道，每个关键字之间存在某些差异，你们不需要死记硬背它们。请记住，它们就像是你的属性和方法的安全级别。将属性设置为\
    \ `private` 而将几乎所有方法设置为 `public` 是非常常见的，尽管这并不是一条规定。\n\n## 封装\n我们在本章中开始看到的是“封装”的概念，即隐藏类的所有成员，并隐藏系统例程（方法）的工作方式。封装是使你的系统易于更改的关键：我们不需要在多个处修改业务规则，而只需要在一个地方修改，因为该规则被封装起来了（参见\
    \ `draw()` 方法示例）。\n\n类中的公共方法集也被称为“类接口”，因为它们是你与该类对象通信的唯一方式。看下图是如何表示的：\n![](img/00043.jpeg)\n\
    \n在编程时，始终考虑类的接口——即你的用户将如何使用它——而不仅仅是它是如何工作的，这是一个好习惯。实现本身（方法的内容）对类的用户来说并不重要，因为他/她只需要知道每个方法做什么，而不是如何做（因为这可能会随时间改变）。每当我们访问一个对象时，都会使用它的接口。现实世界中有几个类比。这里是其中：\n\
    \n当你开车时，对你重要的是踏板和方向盘（接口）——而不是你正在使用的引擎（实现）。当然，不同的引擎可以给你带来更好的结果，但它的功能与功率较小的引擎是一样的，区别在于它的实现方式。如果你换了一个新引擎，你不需要重新学习如何开车！实现的改变并不意味着接口的改变，这允许其他类继续以相同的方式使用它。\n\
    \n## Getter 和 Setter\n`private` 修饰符导致没有人能够修改甚至读取某个特定的属性。那么，如果我们无法访问它，如何显示账户（`Account`）的余额呢？让我们用一个方法吧！将其命名为\
    \ `getBalance()` 是有合理的：\n\n```java\npublic class Account {\n// ...\n    private\
    \ double balance;\n    public double getBalance() {\n        return this . balance;\n\
    \    }\n// ...\n}\n```\n\n这就是我们如何访问账户余额：\n```java\npublic class Program {\n  \
    \  public static void main( String [] args) {\n        Account account = new Account\
    \ ();\n        account. deposit( 250 );\n        System . out . println( \"Balance\
    \ = \" + account. getBalance());\n    }\n}\n```\n\n为了以控制的方式访问属性（因为它们是 `private`\
    \ 的），最常见的做法是创建两个方法：一个返回值，另一个更改值。惯例是它们分别以 `get` 和 `set` 单词开头。如果我们想为 `balance`、`limit`\
    \ 和 `owner` 编写 getter 和 setter，我们的类看起来像这样：\n\n```java\npublic class Account {\n\
    \    private double balance;\n    private double limit;\n    private Client owner;\n\
    \    public double getBalance() {\n        return balance;\n    }\n    public\
    \ void setBalance( double balance) {\n        this . balance = balance;\n    }\n\
    \    public double getLimit() {\n        return limit;\n    }\n    public void\
    \ setLimit( double limit) {\n        this . limit = limit;\n    }\n    public\
    \ Client getOwner() {\n        return owner;\n    }\n    public void setOwner(\
    \ Client owner) {\n        this . owner = owner;\n    }\n}\n```\n\n但你不需要自己写所有这些方法。使用你的\
    \ IDE！！在你想放置 getter 和 setter 的空行中放置光标。选择 `Code >> Generate...`\n![](img/00044.jpeg)\n\
    选择 Getter and Setter。\n![](img/00045.jpeg)\n使用 `Shift` 或 `Ctrl` (Windows) 选择你想生成\
    \ getter/setter 的属性（在此情况下为 `balance`、`limit` 和 `owner`），然后按 `OK`。\n![](img/00046.jpeg)\n\
    好了！\n\n创建一个类然后为其所有属性创建 getter 和 setter 是一种坏做法。你只有在真正需要时才创建 getter 或 setter。注意，在这个例子中，不应该创建\
    \ `setBalance()`，因为我们希望每个人都使用 `deposit()` 和 `draw()`。\n\n另一个重要的细节：`getX` 方法并不一定返回属于相应对象的名为\
    \ `X` 的属性值。这对于封装来说很有趣。想象一下这种情况：我们希望银行始终显示余额为 `limit + balance`（这是银行欺骗客户的常见做法）。\n\
    \n我们可以一直调用 `account.getLimit() + account.getBalance()`，但当我们需要更改余额显示方式时，这可能会产生“全部替换”的情况。让我们将其封装在\
    \ `getBalance()` 内部。看：\n\n```java\npublic double getBalance() {\n    return this\
    \ . balance + this . limit;\n}\n```\n\n我们现在也不应该创建 `getLimit()` 和 `setLimit()`\
    \ 甚至 `getOwner()` 和 `setOwner()`，因为我们现在不需要它们。这给我们留下了必要的部分：\n```java\npublic class\
    \ Account {\n// attributes...\n    public double getBalance() {\n        return\
    \ balance + limit;\n    }\n}\n```\n\n使用 getter 和 setter 不仅有助于保护属性，还允许你在某一个地方进行更改——因为这隐藏了对象存储数据的方式。这是一个非常重要的实践！\n\
    \n我们的类还有另一个问题。如果一个人存入负数金额（尽管这在现实生活中并不存在，但在这里可能会发生），余额将是负数。例如：\n```java\npublic\
    \ class Program {\n    public static void main( String [] args) {\n        Account\
    \ account = new Account ();\n        account. deposit(-250 );\n    }\n}\n```\n\
    \n为了防止这种情况，我们应该修复哪个方法？`deposit()` 方法！！在存入前检查金额是否为正。得益于封装，这是我们需要做的更改：\n```java\n\
    void deposit( double amount) {\n    if ( amount > 0 ) {\n        this . balance\
    \ += amount;\n    }\n}\n```\n\n## 构造函数\n当我们使用 `new` 关键字时，我们正在构造一个对象。`new` 总是运行类的构造函数，如下：\n\
    ```java\npublic class Account {\n// attributes...\n// constructor:\n    Account\
    \ () {\n        System . out . println( \"Constructing account...\" );\n    }\n\
    // methods...\n}\n```\n当我们这样做时：\n```java\npublic class Program {\n    public static\
    \ void main( String [] args) {\n        Account account = new Account ();\n  \
    \  }\n}\n```\n“Constructing account…”被打印出来。这就像是我们创建一个新对象时的初始化例程。构造函数不是方法！（尽管它看起来像方法）。\n\
    \n### 默认构造函数\n当你不在类中声明构造函数时，Java 会为你创建一个。这个构造函数是默认构造函数，它不接收参数且其体为空。这就是为什么我们之前可以在没有构造函数的情况下创建新对象。由于我们提供了自己的，默认构造函数不再使用。\n\
    \n### 带参数的构造函数\n构造函数可以接收参数来初始化某些信息。看有多棒：\n```java\npublic class Account {\n//\
    \ attributes…\n    Account ( Client owner) {\n        this . owner = owner;\n\
    \        System . out . println( \"Constructing an account for \" + owner.name\
    \ + \"...\" );\n    }\n// methods...\n}\n```\n`this.owner = owner` 意味着新账户的所有者（`this.owner`）将是参数输入的（`owner`）。现在你在创建新的\
    \ `Account` 对象时，必须输入一个 `Client`：\n```java\npublic class Program {\n    public\
    \ static void main( String [] args) {\n        Client myClient = new Client ();\n\
    \        myClient. name = \"Lucas\";\n        Account account = new Account (\
    \ myClient);\n    }\n}\n```\n打印结果：Constructing an account for Lucas... 太棒了！\n\n\
    ### 多个构造函数\n你可以在类中拥有多个构造函数，系统将选择合适的一个。\n```java\npublic class Account {\n    int\
    \ number;\n    private double balance;\n    private double limit;\n    Client\
    \ owner;\n    Account ( Client owner) { // #1\n        this . owner = owner;\n\
    \    }\n    Account ( int number, Client owner) { // #2\n        this . owner\
    \ = owner;\n        this . number = number;\n    }\n}\n```\n----------------------------\n\
    ```java\npublic class Program {\n    public static void main( String [] args)\
    \ {\n        Client c1 = new Client ();\n        c1. name = \"Olivia\";\n    \
    \    Account a1 = new Account ( c1); // #1\n        Client c2 = new Client ();\n\
    \        c2. name = \"Fitz\";\n        Account a2 = new Account ( 19525 , c2);\
    \ // #2\n    }\n}\n```\n注意 `a1` 使用构造函数 #1，而 `a2` 使用构造函数 #2。但构造函数 #2 中存在重复：`this.owner\
    \ = owner` 被重复了。为了解决这个问题，我们在构造函数 #2 内部调用构造函数 #1，如下：\n```java\npublic class Account\
    \ {\n    int number;\n    private double balance;\n    private double limit;\n\
    \    Client owner;\n    Account ( Client owner) {\n        this . owner = owner;\n\
    \    }\n    Account ( int number, Client owner) {\n        this ( owner); // !!!\n\
    \        this . number = number;\n    }\n}\n```\n在 `this (owner)` 中，你可以将 `this()`\
    \ 视为 `Account()`。由于它只接收 `owner` 作为参数，它正在调用构造函数 #1 —— `Account(Client owner)`。\n\
    \n## 类属性\n假设我们的银行还想控制现有账户的数量。我们如何实现这一点？一个简单的想法是：\n```java\npublic class Program\
    \ {\n    public static void main( String [] args) {\n        int totalOfAccounts\
    \ = 0;\n        Client c1 = new Client ();\n        c1. name = \"Olivia\";\n \
    \       Account a1 = new Account ( c1);\n        totalOfAccounts += 1;\n    }\n\
    }\n```\n但这样做会将语句散布在代码的各个地方，使其难以跟踪和更改。想象一下每次当我们创建一个新的 `Account` 对象时都要手动增加该变量！这很难记住，对吧？所以我们为什么不自动化呢？关于这个……：\n\
    ```java\npublic class Account {\n    private int totalOfAccounts;\n// ...\n  \
    \  Account ( Client owner) {\n        this . owner = owner;\n        totalOfAccounts\
    \ += 1;\n    }\n}\n```\n如果我们创建两个对象，每个都将有一个自己的 1 的 `totalOfAccounts` 变量。这并不是我们想要的。我们希望这个变量是唯一的，由所有对象共享。这样，当你通过对象更改它时，另一个对象将看到相同的值。在\
    \ Java 中，我们将变量声明为 `static`。\n```java\nprivate static int totalOfAccounts;\n```\n\
    当我们把属性声明为 `static` 时，它变成了一个类属性，由类存储而不是单个对象存储。要访问静态属性，我们不使用 `this` 关键字，而是使用类的名称。\n\
    ```java\npublic class Account {\n    private static int totalOfAccounts;\n// ...\n\
    \    Account () {\n        totalOfAccounts += 1;\n    }\n    public static int\
    \ getTotalOfAccounts() {\n        return totalOfAccounts;\n    }\n}\n```\n我们可以知道创建了多少账户吗？\n\
    ```java\npublic class Program {\n    public static void main( String [] args)\
    \ {\n        Client c1 = new Client ();\n        c1. name = \"Olivia\";\n    \
    \    Account a1 = new Account ( c1);\n        int total = a1.getTotalOfAccounts();\n\
    \    }\n}\n```\n但有一个问题：我们必须创建一个账户才能获取总数。`getTotalAccounts()` 应该属于整个类，而不是每个对象。\n\
    ```java\npublic class Account {\n    private static int totalOfAccounts;\n// ...\n\
    \    public static int getTotalAccounts() {\n        return totalOfAccounts;\n\
    \    }\n}\n```\n这就是我们访问它的方式：\n```java\npublic class Program {\n    public static\
    \ void main( String [] args) {\n        int total = Account.getTotalAccounts();\n\
    \    }\n}\n```\n\n## 第 9 章：继承与多态\n### 继承\n在练习集 #6 中，你创建了一个名为 `Employee` 的类。现在我们将使用它，但属性较少：\n\
    ```java\npublic class Employee {\n    String name;\n    String id;\n    double\
    \ salary;\n}\n```\n这是你的项目结构应该这样的：\n![](img/00047.jpeg)\n删除我们没有使用的类 / 创建缺失的类。除了普通员工，银行还有经理这样的职位。他们拥有其他员工相同的数据，加上额外的信息，如访问内部系统的密码和所管理的员工数量。\n\
    ```java\npublic class Manager {\n    String name;\n    String id;\n    double\
    \ salary;\n    int password;\n    int numberOfEmployeesManaged;\n    public boolean\
    \ authenticate( int password) {\n        if ( this . password == password) {\n\
    \            System . out . println( \"Access granted!\" );\n            return\
    \ true;\n        } else {\n            System . out . println( \"Access denied!\"\
    \ );\n            return false;\n        }\n    }\n}\n// ...\n```\n我们真的需要另一个类吗？嗯，你可能会想：“我们为什么不把所有属性放在\
    \ `Employee` 类中，让其中一些成为可选的呢？”这是一种可能，但如果有许多可选属性，类将开始变得很奇怪且不可易读。考虑一下方法：`authenticate()`\
    \ 在 `Employee` 类中甚至没有意义。所以，我们需要另一个类，但这样做我们就在两个类中复制粘贴了大量相同的代码。想象一下我们必须为不同的职位再创建一个！\n\
    \n在 Java 中，有一种方法连接类，使得其中一个继承另一个所有的一切。在我们的情况下，我们希望 `Manager` 拥有 `Employee` 拥有的一切。\n\
    ```java\npublic class Manager extends Employee {\n    int password;\n    int numberOfEmployeesManaged;\n\
    \    public boolean authenticate( int password) {\n        if ( this . password\
    \ == password) {\n            System . out . println( \"Access granted!\" );\n\
    \            return true;\n        } else {\n            System . out . println(\
    \ \"Access denied!\" );\n            return false;\n        }\n    }\n}\n```\n\
    ```\n`extends` 关键字被用于继承类。在我们的情况下，我们希望 `Manager` 拥有 `Employee` 拥有的一切。（注：此处后续为原文重复内容，已去重）\n\
    \n### 练习集 #8\n1) `Employee.java`\n```java\npublic class Employee {\n    private\
    \ String name;\n    private double salary;\n}\n```\n`Program.java`\n```java\n\
    public class Program {\n    public static void main( String [] args) {\n     \
    \   Employee e1 = new Employee ();\n        e1.name = \"Lucas\";\n        e1.salary\
    \ = 10000;\n    }\n}\n```\n这些代码的呈现方式有什么问题？\n答案\n1) 属性 `name` 和 `salary` 是 `private`\
    \ 的，因此无法从 `Employee` 类外部直接访问。我们需要 getter 和 setter。\n\n"
- fmt: "\n```java\nprivate double totalOfPayments = 0;\n\npublic void register(Employee\
    \ employee) {\n    this.totalOfPayments += employee.getRaise();\n}\n\npublic double\
    \ getTotalOfPayments() {\n    return this.totalOfPayments;\n}\n```\n\nAnd somewhere\
    \ in our program we could invoke those methods:\n\n```java\nPaymentRecord record\
    \ = new PaymentRecord();\nManager employee1 = new Manager();\nemployee1.setSalary(6000.0);\n\
    record.register(employee1); // !!!\nEmployee employee2 = new Employee();\nemployee2.setSalary(2000.0);\n\
    record.register(employee2);\nSystem.out.println(record.getTotalOfPayments());\n\
    ```\n\n# Workout Set #91\n\n### 1) What is the correct way of representing inheritance\
    \ between classes `Car` and `Ferrari`?\n\n**Option A**\n```java\npublic class\
    \ Ferrari {/* ...}\npublic class Car extends Ferrari {/* ...}\n```\n\n**Option\
    \ B**\n```java\npublic class Car {/* ...}\npublic class Ferrari extends Car {/*\
    \ ...}\n```\n\n### 2) Create a `Dog` class and a `GoldenRetriever` class that\
    \ extends `Dog`. Create the attributes and methods that are necessary to get this\
    \ result in the `Program` class:\n\n![](images/00052.jpeg)\n\nHere are some tips\
    \ for you:\n- In `Dog`, create two constructors: the one where you put all those\
    \ arguments and assign them to your new object; and a default one that has no\
    \ instructions inside.\n- Create a `public int canineToHumanAge()` method that\
    \ returns the human equivalent to the age of the dog. If a dog was born a year\
    \ ago, it’s as if he/she had 9 years old (approximately).\n- Create a `public\
    \ void bark()` method that prints out “Woof woof!!! I’m “ + the name of the dog.\n\
    - The `GoldenRetriever`’s constructor doesn’t get `color` as argument because\
    \ it sets it automatically to “Golden” (don’t forget to implement that).\n\n###\
    \ 3) What is wrong with the following code?\n\n**Employee.java**\n```java\npublic\
    \ class Employee {\n    protected double salary;\n    public double getRaise()\
    \ {\n        return this.salary * 0.10;\n    }\n}\n```\n\n**Manager.java**\n```java\n\
    public class Manager extends Employee {\n    @Override\n    public double getValueOfRaise()\
    \ {\n        return this.salary * 0.15;\n    }\n}\n```\n\n### 4) A programmer\
    \ was writing attributes for two classes: `Person` and `Dog`. He/She noticed that\
    \ both classes would have the attributes `name`, `age` and `gender`. Because of\
    \ that, the programmer decided to make the `Dog` class inherit the attributes\
    \ from the `Person` class in order to save a few lines of code.\n\n```java\npublic\
    \ class Person {\n    String name;\n    int age;\n    char gender;\n}\npublic\
    \ class Dog extends Person {// ...}\n```\n\nConsidering what you’ve learned about\
    \ inheritance, does that make sense? Why?\n\n## Answers\n\n1) **Option B**, of\
    \ course. Every `Ferrari` is a car, but not every car is a `Ferrari`. And a `Ferrari`\
    \ has extra features when compared to a regular car.\n\n2) **Dog.java**\n```java\n\
    public class Dog {\n    String name;\n    String color;\n    char gender;\n  \
    \  int canineAge;\n    Dog() {}\n    Dog(String name, String color, char gender,\
    \ int canineAge) {\n        this.name = name;\n        this.color = color;\n \
    \       this.gender = gender;\n        this.canineAge = canineAge;\n    }\n  \
    \  public int canineToHumanAge() {\n        return this.canineAge * 9;\n    }\n\
    \    public void bark() {\n        System.out.println(\"Woof woof!!! I'm \" +\
    \ this.name);\n    }\n}\n```\n\n**GoldenRetriever.java**\n```java\npublic class\
    \ GoldenRetriever extends Dog {\n    GoldenRetriever(String name, char gender,\
    \ int canineAge) {\n        this.name = name;\n        this.color = \"Golden\"\
    ;\n        this.gender = gender;\n        this.canineAge = canineAge;\n    }\n\
    }\n```\n\n3) In `Manager.java`, we’re trying to override a `getValueOfRaise()`\
    \ method that does not exist in the super class. We are actually creating a new\
    \ method, but the `@Override` annotation doesn’t allow us to do that. The person\
    \ probably changed the name of the method and forgot to refactor every occurrence.\n\
    \n4) That’s not a good practice, because `Dogs` and `People` aren’t related in\
    \ any way (hierarchically speaking). A dog is not a person and a person is not\
    \ a dog. Even though they have some characteristics in common, there are a lot\
    \ more differences between them. Read more about some mistakes on inheritance\
    \ [here](https://www.thoughtworks.com/pt/insights/blog/composition-vs-inheritance-how-choose).\n"
