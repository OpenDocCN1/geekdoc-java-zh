    \ = 1 ; b <= 5 ; b++) {\n            int c = 5;\n            System.out.println(b);\n\
    \        }\n        System.out.println(c);\n    }\n}\n```\n\n### 7) What is wrong\
    \ with the code below?\n\n```java\npublic class Main {\n    public static void\
    \ main(String [] args) {\n        int n = 10;\n        while (n == 10) {\n   \
    \         System.out.println(n);\n        }\n    }\n}\n```\n\n### 8) If you've\
    \ come this far, congratulations! Now you're going to build a game that involves\
    \ variables, input manipulation, relational operators, loops, conditionals and\
    \ a class called `Random` to generate pseudorandom numbers. Pay close attention\
    \ to the following instructions and read them until you completely understand\
    \ what is asked, before writing any code.\n\nThis is how it works: the computer\
    \ generates a (secret) random integer in the range of 1 to 10 (including 1 and\
    \ 10). The user keeps trying to guess the secret number, until he/she gets it\
    \ right. Every time the user doesn't type the right value, he/she gets a tip (\"\
    The secret number is greater than that\" or \"The secret number is less than that\"\
    ). Once the correct number is entered, the game ends and the user receives a message\
    \ of \"Congratulations! You won!\".\n\nI won't provide you the answer to this\
    \ question, but I can give you some advice:\n- To keep asking for input while\
    \ the given number is not correct use a `while (true)` loop that will keep asking\
    \ for input, guiding the user, and will only break when the number is correct\
    \ (when the number entered by the user is equal to the number generated by the\
    \ computer).\n\n#### Answers\n1) E\n2) O\n3) Access granted\n4) c\n5) a\n6) The\
    \ variable `c` gets created inside the `for` loop, therefore it can't be accessed\
    \ from the outside (i.e., it no longer exists after the loop is completely executed).\
    \ The lines after the for loop are out of the scope of `c`.\n7) The condition\
    \ `(n == 10)` will always evaluate to true, because `n` is never increased or\
    \ decreased. That results in an infinite while loop.\n8) - \n\n## Chapter 6: Intro\
    \ to Object-Oriented Java\n\nObject-oriented programming (OOP) is a programming\
    \ language model organized around objects rather than \"actions\" and data rather\
    \ than logic. Examples of objects range from human beings (described by name,\
    \ address, and so forth) to buildings and floors – whose properties (attributes)\
    \ can be described and modified (through methods) down to the little.\n\nWhat\
    \ are the advantages of programming in object-oriented languages like Java?\n\
    - Being more organized\n- Writing less\n- Concentrating responsibilities at the\
    \ right points, making your application more flexible, encapsulating business\
    \ logic. Soon we will see all this, but first you need to know a bit about the\
    \ syntax and creation of types in Java.\n\n### Classes x Objects\n\nIn a banking\
    \ software, crucial part of the system is an account. The idea is to generalize\
    \ some information, with functionalities that every account must have. Like…\n\
    - Bank account number\n- Name of the owner\n- Bank account balance\n- Limit (to\
    \ withdraw)\n\nWhat every account does is important to us? That is, what would\
    \ we like the account to do?\n- Draw an amount of dollars\n- Deposit an amount\
    \ of dollars\n- Print the name of the owner\n- Get the current balance\n- Get\
    \ the limit\n- Transfer an amount of dollars to another account\n\nWith those\
    \ things in mind, we have the project of a bank account. Can we take that project\
    \ and get its current balance? No. What we have is just a project. First, we have\
    \ to build an actual account in order to access it and ask it to do. (images/0032.jpeg)\n\
    \nNotice the image: although the paper on left specifies an `Account`, is it an\
    \ `Account`? Do we deposit and take money out of that paper? No. We use the `Account`\
    \ specification to be able to create instances that really are accounts where\
    \ we can perform the operations. Even though we declare that every account has\
    \ a balance, a number on the piece of paper (as left in the image), it is in the\
    \ instances of this project there is room to store those values. That “project”\
    \ (specifications for a bank account) is called a `class`. And what we can construct\
    \ from that class are called `objects`.\n\n#### Creating a class\n\nOpen your\
    \ IDE, create a new Java class called `Account` and start typing. Note that those\
    \ variables were not declared inside a block, like we did when we had the `main`\
    \ method. When a variable is declared directly inside the scope of a class, it’s\
    \ called an object variable, or attribute. The balance will be a `double`, but\
    \ it shouldn’t be used for currencies.\n\n```java\npublic class Account {\n  \
    \  int number;\n    String owner;\n    double balance;\n}\n```\n\n#### Creating\
    \ and using an object\n\nWe already have a class in Java that specifies what every\
    \ object of that class must have. But how can we use it? Besides that class, we\
    \ will have `Program.java`, in which we’ll use the `Account` class. To create\
    \ (construct, instantiate) an `Account`, we have to use the keyword `new` and\
    \ parenthesis.\n\n```java\npublic class Program {\n    public static void main(String\
    \ [] args) {\n        new Account ();\n    }\n}\n```\n\nWell, the code above creates\
    \ an object of type `Account`, but how can we access that object? We need a way\
    \ to reference it. We need a… variable! In this case, a variable of type `Account`.\n\
    \n```java\npublic class Program {\n    public static void main(String [] args)\
    \ {\n        Account myAccount;\n        myAccount = new Account ();\n    }\n\
    }\n```\n\nThrough `myAccount`, we can access the newly created object to change\
    \ its `owner`, `balance`, `limit`, etc.\n\n```java\npublic class Program {\n \
    \   public static void main(String [] args) {\n        Account myAccount;\n  \
    \      myAccount = new Account ();\n        myAccount.owner = \" Lucas \";\n \
    \       myAccount.balance = 10000.0;\n        System.out.println(\" Current balance:\
    \ \" + myAccount.balance);\n    }\n}\n```\n\nIt’s important to say that the dot\
    \ was used to access something in `myAccount`. In the code above, `myAccount`\
    \ belongs to Lucas – me! – and has 10,000 dollars.\n\n### Methods\n\nInside the\
    \ class, we’ll also declare what each account does and how it’s done – its behaviors.\
    \ For example, if there’s a specific way to draw an amount of money, we’re going\
    \ to put it inside the `Account` class itself. That’s why those “functions” are\
    \ called `methods`, because they are a way to do some operation with an object.\n\
    \nWe want to create a method that draws an amount of money from the account and\
    \ doesn’t retrieve any information to whom uses this method.\n\n```java\npublic\
    \ class Account {\n    // other attributes and methods...\n    void draw(double\
    \ amount) {\n        double newBalance = this.balance - amount;\n        this.balance\
    \ = newBalance;\n    }\n}\n```\n\nThe keyword `void` indicates that the method\
    \ does not return anything. But we can return some value. In our `draw` method,\
    \ we could return a `boolean` value to tell if the operation was completed. The\
    \ word `class` in this context comes from biology’s taxonomy. All living things\
    \ that belong to the same biological class have a series of attributes and behaviors\
    \ in common, but they aren’t equal. Homo sapiens defines a group of beings that\
    \ have characteristics in common, but is the definition/idea/concept of Homo sapiens\
    \ an actual human being? Everything is specified in `Homo sapiens` class, but\
    \ in order to ask a person to run, eat or jump, we’ll need to instantiate that\
    \ class, by creating an object of type `Homo sapiens`.\n\nAnother example: a cake\
    \ recipe. We don’t eat a cake recipe, but we use it to make an actual cake. The\
    \ recipe is the `class` and the cake is the `object`. We can create thousands\
    \ of cakes based on that single recipe. Some cakes may be similar and some might\
    \ be identical, but they are different objects. Think about a `class` as a blueprint\
    \ and the `object` as the tangible thing.\n\n#### Methods that return something\n\
    \nWhen a method returns something, the operation won’t happen if there isn’t enough\
    \ money in the account. In this case, the method will return `false`. Else, the\
    \ operation will happen and `true` will be returned. Note that I replaced `void`\
    \ with `boolean`, to indicate the new return type.\n\n```java\npublic class Account\
    \ {\n    // other attributes and methods...\n    boolean draw(double amount) {\n\
    \        if (this.balance < amount) {\n            return false;\n        } else\
    \ {\n            this.balance -= amount;\n            return true;\n        }\n\
    \    }\n}\n```\n\nWith the code above, nothing would be ever printed, because\
    \ the `System.out.println()` statements are placed after the `return` statements.\
    \ Here’s how we could use that new `draw` method:\n\n```java\npublic class Program\
    \ {\n    public static void main(String [] args) {\n        Account myAccount\
    \ = new Account ();\n        myAccount.balance = 1000.0;\n        boolean success\
    \ = myAccount.draw(200.0);\n        if (success) {\n            System.out.println(\"\
    \ I got my money!\");\n        } else {\n            System.out.println(\" Where\
    \ is my money?\");\n        }\n    }\n}\n```\n\nI can even eliminate the intermediate\
    \ variable (`success`):\n\n```java\npublic class Program {\n    public static\
    \ void main(String [] args) {\n        Account myAccount = new Account ();\n \
    \       myAccount.balance = 1000.0;\n        if (myAccount.draw(200.0)) {\n  \
    \          System.out.println(\" I got my money!\");\n        } else {\n     \
    \       System.out.println(\" Where is my money?\");\n        }\n    }\n}\n```\n\
    \nAnd, of course, you can have multiple accounts in the same program, each with\
    \ its own set of attributes.\n\n```java\npublic class Program {\n    public static\
    \ void main(String [] args) {\n        Account myAccount = new Account ();\n \
    \       myAccount.balance = 1000.0;\n        Account mySecondAccount = new Account\
    \ ();\n        mySecondAccount.balance = 500.0;\n        System.out.println(\"\
    Account 1 balance: \" + myAccount.balance);\n        System.out.println(\"Account\
    \ 2 balance: \" + mySecondAccount.balance);\n    }\n}\n```\n"
