    \n### Switch\n下面的代码示例取自官方文档。它声明了一个名为 `month` 的 `int` 类型变量，其值代表月份。代码使用 `switch`\
    \ 语句根据 `month` 的值显示月份名称。\n\n```java\npublic class SwitchDemo {\n    public static\
    \ void main( String [] args) {\n        int month = 8 ;\n        String monthString;\n\
    \        switch ( month) {\n            case 1 :   monthString = \"January\" ;\n\
    \                break ;\n            case 2 :   monthString = \"February\" ;\n\
    \                break ;\n            case 3 :   monthString = \"March\" ;\n \
    \               break ;\n            case 4 :   monthString = \"April\" ;\n  \
    \              break ;\n            case 5 :   monthString = \"May\" ;\n     \
    \           break ;\n            case 6 :   monthString = \"June\" ;\n       \
    \         break ;\n            case 7 :   monthString = \"July\" ;\n         \
    \       break ;\n            case 8 :   monthString = \"August\" ;\n         \
    \       break ;\n            case 9 :   monthString = \"September\" ;\n      \
    \          break ;\n            case 10 :  monthString = \"October\" ;\n     \
    \           break ;\n            case 11 :  monthString = \"November\" ;\n   \
    \             break ;\n            case 12 :  monthString = \"December\" ;\n \
    \               break ;\n            default:   monthString = \"Invalid month\"\
    \ ;\n                break ;\n        }\n        System.out.println( monthString);\n\
    \    }\n}\n```\n\n在这种情况下，输出了 \"August\"，因为 `month` 等于 8。因此，这就是 `switch` 的基础语法：\n\
    \n```java\nswitch ( variable) {\n    case value: action;\n        break ;\n  \
    \  case value2: action2;\n        break ;\n    // ...\n    default : defaultAction;\n\
    \        break ;\n}\n```\n\n### 变量作用域\n还记得我们如何把变量的概念比作盒子吗？你可以在盒子里放入一些数据，以后再取回它们。如果你把那个盒子锁在一个房间里，你就无法从外部（例如，你的厨房）访问它——因为你的房间就是作用域。这是一个解释变量作用域的隐喻，作用域是指变量存在且可以被访问的代码片段名称。\n\
    \n```java\n// 在这里变量 i 不存在\nint i = 5 ;\n\n// 变量 i 从现在开始存在\n\nwhile ( condition)\
    \ {\n    //在这里可以访问变量 i\n    int j = 7 ;\n    // 变量 j 从现在开始存在\n}\n```\n\n"
