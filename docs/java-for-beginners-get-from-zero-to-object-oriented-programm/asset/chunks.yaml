    \ to execute the last executed file is `Ctrl+Shift+F10`.![](images/00016.jpeg)\n\
    \nYou've just finished your first Java program. Congratulations!For now on, I'm\
    \ gonna assume that you know how to do all this (open your IDE, start a new project,\
    \ create a class and write the main method).\n\n# Chapter 2: Variables and Data\
    \ Types\n\nConsider the following program:\n```java\npublic class Main {\n   \
    \ public static void main( String [] args) {\n        System . out . println(\"\
    \ Score = \" + 10 );\n        System . out . println(\" Good job!\");\n    }\n\
    }\n```\n\nThis program prints out “Score = 10” and then “Good job!”. But by the\
    \ end of the third line, the computer doesn’t even remember that score that was\
    \ printed. Kind of like when we don’t want to listen to someone and we avoid saving\
    \ any information in our brains, we just ignore it. But we could store that score\
    \ in our program by using something called a `variable`. Think of it as a box\
    \ in which you can put some data and then come back later to retrieve it.\n\n\
    Since data comes in different forms, a variable needs to be defined with a `type`,\
    \ which tells Java what is being stored. Some of Java’s primitive data types include\
    \ `int` (for integer), `float`, `double` (for double precision floating point\
    \ number), and `boolean` (for a true/false value).\n\nOpen your IDE and create\
    \ a new class called `Variables` inside the `src` folder. Complete the code with\
    \ the `main` method (challenge: don’t use the trick I taught you in the previous\
    \ lesson and try to remember as much as you can). You can also delete `MyFirstClass`\
    \ if you want.![](images/00017.jpeg)\n\nCopy and paste the following snippet into\
    \ the `main` method:\n```java\nint i;\ni = 0 ;\nSystem . out . println( i);\n\
    ```\n\nTo run it, right-click on the `Variables.java` tab and select Run `Variables.main()`.\
    \ After you’ve done it once, you can quickly do it through that beautiful and\
    \ green play button:![](images/00018.jpeg)You can also select a class that was\
    \ executed recently, like `MyFirstClass`:![](images/00019.jpeg)\n\nAfter running\
    \ `Variables.java`, this window will show up:![](images/00020.jpeg)That program\
    \ somehow printed the number 0. Let’s see how that happened. Here’s how the full\
    \ code should look like:\n```java\npublic class Variables {\n    public static\
    \ void main( String [] args) {\n        int i;\n        i = 0 ;\n        System\
    \ . out . println( i);\n    }\n}\n```\n\n* There’s our class header\n* There’s\
    \ the `main` method\n* There are 3 statements inside the `main` method. The first\
    \ one declares a variable (i.e. creates a variable) of type `int` (integer) named\
    \ `i`\n* The second one initializes that variable by storing the value of 0 inside\
    \ it\n* The third one prints out the value that is stored in the variable `i`.\
    \ Notice that we’re not printing out the letter “i”, but the value of the variable\
    \ `i`.\n\n**Important**: You have to declare a variable before using it! Therefore,\
    \ the following code is WRONG:\n```java\n// WRONG!\npublic class Variables {\n\
    \    public static void main( String [] args) {\n        System . out . println(\
    \ i);\n        int i;\n        i = 0 ;\n    }\n}\n```\nIf you make that mistake,\
    \ your IDE will warn you:![](images/00021.jpeg)`Cannot resolve symbol ‘i’` means\
    \ the IDE couldn’t find anything about ‘i’. It’s not declared anywhere before\
    \ the `System.out.println()` call.\n\n***\n\nHuman: Hey, can you print out a picture\
    \ of Hannah?\nComputer (thinking): (Who is Hannah? I’ve never heard about her.\
    \ How could I print a picture of Hannah? Stupid human…)\nComputer says: CANNOT\
    \ RESOLVE SYMBOL ‘HANNAH’\n\n***\n\nJust kidding! It’s OK to make mistakes. Actually,\
    \ you’ll make PLENTY of them throughout your learning path and career.\n\n## Variable\
    \ Declaration\n\nSo here’s a generalization about variables declaration:![](images/00022.jpeg)That’s\
    \ how we did it in our program. But we can join declaration and initialization\
    \ in one single statement, which is more practical, like this:![](images/00023.jpeg)\n\
    \nValues change. And you can change the values that are inside your variables.\
    \ Replace your current code with the following one and then run it to see what\
    \ happens:\n```java\npublic class Variables {\n    public static void main( String\
    \ [] args) {\n        int i = 10 ;\n        System . out . println( i);\n    \
    \    i = i + 5 ;\n        System . out . println( i);\n    }\n}\n```\nI’m waiting…This\
    \ is the output:\n10\n15\nFirst, I declared a variable called `i` that is an integer,\
    \ assign it the value of 10 and then print it. Then, I add 5 to `i`, which results\
    \ in 15, which is the second value that gets printed.\n\nInstead of `i = i + 5;`\
    \ you can write `i += 5;`.\nYou can also subtract the value of a variable:\n```java\n\
    public class Variables {\n    public static void main( String [] args) {\n   \
    \     int i = 10 ;\n        System . out . println( i);\n        i = i - 4 ;\n\
    \        System . out . println( i);\n    }\n}\n```\nThe output of the code above\
    \ is10. Again, instead of `i = i - 4;` you can write `i -= 4;`. Sometimes you\
    \ want to do more than adding and subtracting. Sometimes you want to change the\
    \ value of a variable completely:\n```java\npublic class Variables {\n    public\
    \ static void main( String [] args) {\n        int i = 10 ;\n        System .\
    \ out . println( i); // 10\n        i += 5 ;\n        i = 7 ;\n        System\
    \ . out . println( i); // 7\n    }\n}\n```\nWait, let me re-examine the provided\
    \ text logic for the final section. The text has some repetitive/jumbled segments\
