- fmt: "\n`boolean hasWhippedCream = false;`\n\n`char` they are used to store a single\
    \ character. Unlike `Strings` (that require double quotes) `char` variables require\
    \ you to use single quotes.\n\n// Examples\n```java\nchar firstLetter = 'A' ;\n\
    char lastLetter = 'Z' ;\nchar digit = '0' ;\nchar num = '9';\n```\n\n## Other\
    \ primitive data types\nAs a beginner, not everything has the same level of importance.\
    \ For now you’ll be well served by variables of type `int`, `double`, `boolean`,\
    \ `char` (and `Strings` - in Chapter 4). But you must know that there are other\
    \ data types to satisfy different needs that programmers may have.\n\n### byte\n\
    It has a minimum value of `-128` and a maximum value of `127` (inclusive). The\
    \ `byte` data type can be useful for saving memory where it’s necessary.\n\n//\
    \ Examples\n```java\nbyte x = - 128 ;\nbyte y = 127;\n```\n\n### short\nIt has\
    \ a minimum value of `-32,768` and a maximum value of `32,767` (inclusive). As\
    \ with `byte`, the same guidelines apply: you can use a `short` to save memory.\n\
    \n// Examples\n```java\nshort n = - 32768 ;\nshort p = 32767;\n```\n\n### long\n\
    It has a minimum value of `-263` and a maximum value of `263 -1`. Use this data\
    \ type when you need a range of values wider than those provided by `int`.\n\n\
    ### float\nIt’s used to represent floating-point numbers such as `3.14159`, `25.0`\
    \ and `0.0075`. The value should have a `f` at the end, indicating that it is\
    \ a `float`. Otherwise, it’ll be considered a `double`.\n\n// Example\n```java\n\
    float n = 1.5f;\n```\nHere’s how you can get an error if you don’t put the `f`\
    \ at the end of a number that’s going to be stored in a `float` variable:\n![](images/00024.jpeg)\n\
    \nThis data type should never be used for really precise values, such as currency.\
    \ For that, you will need to use the [java.math.BigDecimal](https://docs.oracle.com/javase/8/docs/api/java/math/BigDecimal.html)\
    \ class instead.\n\n## Comments\nImagine you finished writing a big and complex\
    \ program today. Of course tomorrow you will still remember what each variable\
    \ stores and what each part of the program does. But will you remember it a month\
    \ from now? A year from now? You probably won’t, especially if you don’t edit\
    \ the code in the meanwhile.\n\nThere’s another situation. Most of the times,\
    \ you won’t write code to yourself: someone else will read it and maybe even complement\
    \ it. Unfortunately, other programmers can’t read your thoughts (we’re not there\
    \ yet). So, what do we do? we comment our code.\n\n```java\npublic class Variables\
    \ {\n    public static void main( String [] args) {\n        int a = 20 ; // Creates\
    \ a variable called a\n        int b = 2 ; // Creates a variable called b\n  \
    \      int c = 3 ; // Creates a variable called c\n        int x = a + b + c;\
    \ // Calculates the sum of variables a, b and c\n        System . out . println(\
    \ x);  // Prints out the sum\n    }\n}\n```\nIn the code above, you can see examples\
    \ of single line comments that start with `//`. The compiler ignores everything\
    \ from `//` to the end of the line, so you can write whatever you want and it\
    \ will not interfere. This type of comment comes in handy when you want to explain\
    \ what a statement does.\n\n```java\npublic class Variables {\n    public static\
    \ void main( String [] args) { {/* I still want to implement a function that calculates\
    \ the sum of any set of variables */\n        int a = 20 ;\n        int b = 2\
    \ ;\n        int c = 3 ;\n        int x = a + b + c;\n        System . out . println(\
    \ x);\n    }\n}\n```\nIn the code above, you can see an example of a multiple\
    \ line comment that starts with `/*` and ends with `*/`. The compiler ignores\
    \ everything from `/*` to `*/`. They come in handy when you want to make a bigger\
    \ comment that wouldn’t fit in a single line.\n\n## Workout Set #1\nWrite down\
    \ your answers in a piece of paper to check them in the Answers page.\n1) What\
    \ primitive data type is similar to a light switch?\n2) True or False: \"Integer\
    \ variables can only store positive numbers\"\n3) \"All data types demand the\
    \ same memory space\"\n4) Which declarations contain some error?\n5) Write a program\
    \ that contains two `Integer` variables. Assign them and then print the sum.\n\
    \n**Answers**\n1) Boolean\n2) False\n3) False\n4) `a`, `c`, `d`, `f`\n5)\n```java\n\
    public class Variables {\n    public static void main(String[] args) {\n     \
    \   int a = 10;\n        int b = 5;\n        System.out.println(a + b);\n    }\n\
    }\n```\n\n# Chapter 3: Operators and Math\nThere are a lot more operations than\
    \ adding and subtracting and that's what we're to explore in this chapter.\n\n\
    ## Arithmetic Operators\n\n### Addition: `+`\n```java\nint a, b, c; // That's\
    \ how you can declare multiple variables of the same type\na = 3;\nb = 4;\nc =\
    \ a + b;\nSystem . out . println( c); // 7\nSystem . out . println( a + c); //\
    \ 10\nSystem . out . println( 15 + 10 ); // 25\n```\n\n### Subtraction: `-`\n\
    ```java\nint a, b, c;\na = 10;\nb = 3;\nc = a - b;\nSystem . out . println( c);\
    \ // 7\nSystem . out . println( a - c); // 3\nSystem . out . println( 27 - 17\
    \ ); // 10\n```\n\n### Multiplication: `*`\n```java\nint a, b, c;\na = 5;\nb =\
    \ 3;\nc = a * b;\nSystem . out . println( c); // 15\nSystem . out . println( a\
    \ * a); // 25\nSystem . out . println( 2 * 7 ); // 14\n```\nFor the result to\
    \ be a double, at least one of the numbers must be double. Therefore, all the\
    \ expressions below result in `10.0`.\n- `2.0 * 5`\n- `2 * 5.0`\n- `2.0 * 5.0`\n\
    \nDo not confuse with `float`, which has an `f` at the end (see Chapter 2). This\
    \ rule is applied to the other operations as well.\n\n### Division: `/`\n```java\n\
    System . out . println( 10 / 3); // 3\nSystem . out . println( 10 / 3.0); // 3.3333333333333335\n\
    System . out . println( 10.0 / 3); // 3.3333333333333335\nSystem . out . println(\
    \ 10.0 / 3.0); // 3.3333333333333335\n```\nAgain! For the result to be a double,\
    \ at least one of the numbers must be double. Otherwise, an operation like `10\
    \ / 3` will only return the integer part of the result.\n\n### Modulus: `%`\n\
    `%` is known as the modulus or remainder operator, and returns the remainder of\
    \ two numbers. For instance `10 % 3` is `1` because `10` divided by `3` leaves\
    \ a remainder of `1`. You can use `%` just as you might use `+`, `-`, `*` and\
    \ `/`.\n\n```java\nint i, j;\ni = 6 ;\nj = 4 ;\nSystem . out . println( i % j);\
    \ // 2\n```\n"
