    your age, a game score and the number of times you were stupid (if it’s less than
    231 -1 LOL ), for example.doubleIt can be used to store larger integers or more
    precise floating-point numbers (which range from approximately 4.94-324 to 1.80308
    ) when compared to other data types. It’s accurate to 14 or 15 significant digits.In
    other words, double is the most used type to store [real numbers](https://en.wikipedia.org/wiki/Real_number)
    but it can also store integers.// Examples


    double bigNumber = 97502250450954097967129782.0 ;


    double smallNumber = 1500;According to Oracle’s documentation, this data type
    should never be used for things like currency.Being able to store larger and more
    precise values is like having a bigger and better box which, consequently, demands
    more [memory] space.booleanThe boolean data type has only two possible values:
    true and false . Use this data type for simple flags that track true/false conditions.
    This data type represents one bit of information, but its “size” isn’t something
    that’s precisely defined.// Examples


    boolean isOn = true ;'
