    \n### Switch\nThe following code example was taken from the official documentation.\
    \ It declares an `int` named `month` whose value represents a month. The code\
    \ displays the name of the month, based on the value of `month`, using the `switch`\
    \ statement.\n\n```java\npublic class SwitchDemo {\n    public static void main(\
    \ String [] args) {\n        int month = 8 ;\n        String monthString;\n  \
    \      switch ( month) {\n            case 1 :   monthString = \"January\" ;\n\
    \                break ;\n            case 2 :   monthString = \"February\" ;\n\
    \                break ;\n            case 3 :   monthString = \"March\" ;\n \
    \               break ;\n            case 4 :   monthString = \"April\" ;\n  \
    \              break ;\n            case 5 :   monthString = \"May\" ;\n     \
    \           break ;\n            case 6 :   monthString = \"June\" ;\n       \
    \         break ;\n            case 7 :   monthString = \"July\" ;\n         \
    \       break ;\n            case 8 :   monthString = \"August\" ;\n         \
    \       break ;\n            case 9 :   monthString = \"September\" ;\n      \
    \          break ;\n            case 10 :  monthString = \"October\" ;\n     \
    \           break ;\n            case 11 :  monthString = \"November\" ;\n   \
    \             break ;\n            case 12 :  monthString = \"December\" ;\n \
    \               break ;\n            default:   monthString = \"Invalid month\"\
    \ ;\n                break ;\n        }\n        System.out.println( monthString);\n\
    \    }\n}\n```\n\nIn this case, \"August\" is printed out, because `month` is\
    \ equal to 8. So, this is the `switch` basic syntax:\n\n```java\nswitch ( variable)\
    \ {\n    case value: action;\n        break ;\n    case value2: action2;\n   \
    \     break ;\n    // ...\n    default : defaultAction;\n        break ;\n}\n\
    ```\n\n### Variable Scope\nRemember how we associated the idea of variables with\
    \ boxes in which you can put some data and then come later to retrieve it? If\
    \ you lock that box in a room, you can’t access it from the outside – your kitchen,\
    \ for example – because your room is the scope. That’s a metaphor to explain variable\
    \ scope, which is the name given to the code snippet where that variable exists\
    \ and where it can be accessed.\n\nIf you declare a variable inside a block of\
    \ code (a piece that is surrounded by curly braces) you can only access the variable\
    \ within that block. Otherwise, it’s like it never existed. Look:\n\n```java\n\
    // here variable i does not exist\nint i = 5 ;\n\n// variable i exists from now\
    \ on\n\nwhile ( condition) {\n    // variable i can be accessed here\n    int\
    \ j = 7 ;\n    // variable j exists from now on\n}\n```\n"
