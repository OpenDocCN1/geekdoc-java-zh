- fmt: "\nWe’re not diving into the details of each access modifier now (I haven’t\
    \ even talked about `Protected` yet!). I just want you to know for now that there\
    \ are some differences between each keyword and you don’t have to memorize them.\
    \ Keep in mind that they are like security levels for your attributes and methods.\
    \ It is very common to make your attributes `private` and almost all your methods\
    \ `public`, although that’s not a rule.\n\n## Encapsulation\nWhat we began to\
    \ see in this chapter is the idea of encapsulating , that is, hiding all members\
    \ of a class, as well as hiding how the routines (methods) of our system work.\
    \ Encapsulating is key to making your system susceptible to changes: we will not\
    \ need to change a business rule in multiple places, but in only one place, since\
    \ that rule is encapsulated. (see the `draw()` method example).\n\nThe set of\
    \ public methods in a class is also called the class interface , since they are\
    \ the only way you can communicate with objects of that class. See how that’s\
    \ represented in the image below:\n![](images/00043.jpeg)\n\nIt is always a good\
    \ idea to program with the interface of your class in mind – how your users will\
    \ be using it – and not just how it will work. The implementation itself (the\
    \ content of the methods) doesn’t not matter so much to the user of the class,\
    \ since he/she only needs to know what each method does, not how it does (as it\
    \ may change with time). Whenever we are going to access an object, we use its\
    \ interface. There are several analogies in the real world. Here’s one:\n\nWhen\
    \ you drive a car, what matters to you are the pedals and the steering wheel (interface)\
    \ - not the engine you are using (implementation). Of course a different engine\
    \ can give you better results, but what it does is the same as a less powerful\
    \ engine, the difference lies in how it does. If you get a new engine, you don’t\
    \ have to relearn how to drive! Changing the implementation does not imply in\
    \ changing the interface, which allows other classes to continue using it the\
    \ same way.\n\n## Getters and Setters\nThe `private` modifier causes no one to\
    \ be able to modify, or even read, a desired attribute. So how can we show the\
    \ balance of an `Account`, if we can no longer access it? Let’s use a method then!\
    \ It makes sense to call it `getBalance()`:\n\n```java\npublic class Account {\n\
    // ...\n    private double balance;\n    public double getBalance() {\n      \
    \  return this . balance;\n    }\n// ...\n}\n```\n\nHere’s how we can access the\
    \ balance of an account:\n```java\npublic class Program {\n    public static void\
    \ main( String [] args) {\n        Account account = new Account ();\n       \
    \ account. deposit( 250 );\n        System . out . println( \"Balance = \" + account.\
    \ getBalance());\n    }\n}\n```\n\nTo allow access to the attributes (since they\
    \ are `private`) in a controlled way, the most common practice is to create two\
    \ methods: one that returns the value and another that changes the value. The\
    \ convention is that they start with the words `get` and `set`, respectively.\
    \ This is how our class would look like if we wanted to write getters and setters\
    \ for `balance`, `limit` and `owner` :\n\n```java\npublic class Account {\n  \
    \  private double balance;\n    private double limit;\n    private Client owner;\n\
    \    public double getBalance() {\n        return balance;\n    }\n    public\
    \ void setBalance( double balance) {\n        this . balance = balance;\n    }\n\
    \    public double getLimit() {\n        return limit;\n    }\n    public void\
    \ setLimit( double limit) {\n        this . limit = limit;\n    }\n    public\
    \ Client getOwner() {\n        return owner;\n    }\n    public void setOwner(\
    \ Client owner) {\n        this . owner = owner;\n    }\n}\n```\n\nBut you don’t\
    \ have to write all those methods by yourself. Use your IDE! Let your cursor in\
    \ an empty line in which you want to put the getters and setters. Select `Code\
    \ >> Generate...`\n![](images/00044.jpeg)\nSelect Getter and Setter.\n![](images/00045.jpeg)\n\
    Use `Shift` or `Ctrl` (Windows) to select the attributes you want to generate\
    \ getter/setter for (`balance`, `limit` and `owner` in this case) and then hit\
    \ `OK`.\n![](images/00046.jpeg)\nThere you go!\n\nIt is a bad practice to create\
    \ a class and then create getters and setters for all its attributes. You should\
    \ only create a getter or setter if you really need it. Note that in this example\
    \ `setBalance()` should not have been created, since we want everyone to use `deposit()`\
    \ and `draw()`.\n\nAnother important detail: a `getX` method does not necessarily\
    \ return the value of an attribute called `X` that belongs to the respective object.\
    \ This is interesting for encapsulation. Imagine this situation: we want the bank\
    \ to always show the balance as `limit + balance` (a common practice among banks\
    \ to deceive their customers).\n\nWe could always call `account.getLimit() + account.getBalance()`,\
    \ but this could generate a \"replace all\" situation when we needed to change\
    \ how the balance is shown. Let’s encapsulate it inside the `getBalance()` itself.\
    \ Look:\n\n```java\npublic double getBalance() {\n    return this . balance +\
    \ this . limit;\n}\n```\n\nAnd we also shouldn’t create `getLimit()` and `setLimit()`\
    \ or even `getOwner()` and `setOwner()` right now since we don’t need those yet.\
    \ That leaves us with just the necessary for now:\n```java\npublic class Account\
    \ {\n// attributes...\n    public double getBalance() {\n        return this .\
    \ balance + this . limit;\n    }\n// methods...\n}\n```\n\nUsing getters and setters\
    \ not only helps you protect your attributes, but it also allows you to make changes\
    \ in just one place – what we call encapsulating –, because it hides the way objects\
    \ store their data. It is a very important practice!\n\nThere is still another\
    \ issue with our class. If a person deposits a negative amount (even though it\
    \ doesn’t exist in real life, it can happen here), the balance will be negative.\
    \ Like this:\n```java\npublic class Program {\n    public static void main( String\
    \ [] args) {\n        Account account = new Account ();\n        account. deposit(-\
    \ 250 );\n    }\n}\n```\n\nWhat method should we fix in order to prevent that?\
    \ The `deposit()` method, of course! It has to check if the amount is positive\
    \ before depositing. And thanks to encapsulation, that’s the only change we need\
    \ to do. Go ahead and do that:\n```java\nvoid deposit( double amount) {\n    if\
    \ ( amount > 0 ) {\n        this . balance += amount;\n    }\n}\n```\n\n## Constructors\n\
    When we use the `new` keyword, we’re constructing an object. `new` always runs\
    \ the class constructor, which is a block of code with the same name of the class:\n\
    ```java\npublic class Account {\n// attributes...\n// constructor:\n    Account\
    \ () {\n        System . out . println( \"Constructing account...\" );\n    }\n\
    // methods...\n}\n```\nSo when we do:\n```java\npublic class Program {\n    public\
    \ static void main( String [] args) {\n        Account account = new Account ();\n\
    \    }\n}\n```\n“Constructing account…” gets printed. It’s like a initialization\
    \ routine whenever we create a new object. A constructor is not a method! (even\
    \ though it looks like one)\n\n### Default constructor\nWhen you don’t declare\
    \ a constructor in your class, Java creates one for you. This constructor is the\
    \ default constructor, it receives no arguments and its body is empty. That’s\
    \ why we could create new objects earlier without having any constructor. Now\
    \ the default constructor is no longer in use because we provided ours.\n\n###\
    \ Constructors with arguments\nConstructors can receive arguments, to initialize\
    \ some kind of information. Look how awesome is that:\n```java\npublic class Account\
    \ {\n// attributes…\n    Account ( Client owner) {\n        this . owner = owner;\n\
    \        System . out . println( \"Constructing an account for \" + owner.name\
    \ + \"...\" );\n    }\n// methods...\n}\n```\n`this.owner = owner` means that\
    \ the owner of the new account (`this.owner`) will be the client entered as argument\
    \ (`owner`). Now you have to enter a `Client` when creating a new `Account` object:\n\
    ```java\npublic class Program {\n    public static void main( String [] args)\
    \ {\n        Client myClient = new Client ();\n        myClient. name = \"Lucas\"\
    ;\n        Account account = new Account ( myClient);\n    }\n}\n```\nAnd this\
    \ is printed: Constructing an account for Lucas... Awesome!\n\n### Multiple Constructors\n\
    You can have multiple constructors in your class and the appropriate one will\
    \ be chosen.\n```java\npublic class Account {\n    int number;\n    private double\
    \ balance;\n    private double limit;\n    Client owner;\n    Account ( Client\
    \ owner) { // #1\n        this . owner = owner;\n    }\n    Account ( int number,\
    \ Client owner) { // #2\n        this . owner = owner;\n        this . number\
    \ = number;\n    }\n}\n```\n--------------------------------------------\n```java\n\
    public class Program {\n    public static void main( String [] args) {\n     \
    \   Client c1 = new Client ();\n        c1. name = \"Olivia\";\n        Account\
    \ a1 = new Account ( c1); // #1\n        Client c2 = new Client ();\n        c2.\
    \ name = \"Fitz\";\n        Account a2 = new Account ( 19525 , c2); // #2\n  \
    \  }\n}\n```\nNote that `a1` uses the constructor #1 and `a2` uses the constructor\
    \ #2. But there is some repetition in constructor #2: `this.owner = owner` gets\
    \ repeated. To solve that, we call constructor #1 within constructor #2, like\
    \ this:\n```java\npublic class Account {\n    int number;\n    private double\
    \ balance;\n    private double limit;\n    Client owner;\n    Account ( Client\
    \ owner) {\n        this . owner = owner;\n    }\n    Account ( int number, Client\
    \ owner) {\n        this ( owner); // !!!\n        this . number = number;\n \
    \   }\n}\n```\nIn `this (owner)`, you can think of `this()` as `Account()`. And\
    \ since it’s only taking `owner` as argument, it’s calling the constructor #1\
    \ – `Account(Client owner)`.\n\n## Class attributes\nSuppose our Bank also wants\
    \ to control the quantity of existing accounts. How could we implement that? A\
    \ simple idea would be:\n```java\npublic class Program {\n    public static void\
    \ main( String [] args) {\n        int totalOfAccounts = 0;\n        Client c1\
    \ = new Client ();\n        c1. name = \"Olivia\";\n        Account a1 = new Account\
    \ ( c1);\n        totalOfAccounts += 1;\n    }\n}\n```\nBut doing that would spread\
    \ statements all over our code, making it hard to track them and change stuff.\
    \ Imagine having to increment that variable manually every time we created a new\
    \ `Account` object! It would be hard to remember, right? So why don’t we automate\
    \ that? What about this…?\n```java\npublic class Account {\n    private int totalOfAccounts;\n\
    // ...\n    Account ( Client owner) {\n        this . owner = owner;\n       \
    \ totalOfAccounts += 1;\n    }\n}\n```\nIf we create two objects, for example,\
    \ each one will have its own `totalOfAccounts` variable that will be equal to\
