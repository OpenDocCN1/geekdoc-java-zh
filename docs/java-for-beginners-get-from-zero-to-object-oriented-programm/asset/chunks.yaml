    \ engine; // !!!\n    // methods...\n}\n```\nWe can create multiple cars and engines,\
    \ just like we did with `Accounts` and `Clients` in our imaginary Bank. How cool\
    \ is that?\n\n## Workout Set #6 - Part One\n\nThe following employee model will\
    \ be used in the exercises of the next chapters. The goal here is to create a\
    \ system for managing Bank employees. The exercises in this chapter are extremely\
    \ important.\n\n### 1) Create a class called `Employee` that will have these attributes:\n\
    - `name` (`String`)\n- his/her date of birth (`String`)\n- the day he/she was\
    \ hired (`String`)\n- `job` (`String`)\n- `salary` (`double`, represents the monthly\
    \ payment).\n\n**Example:**\n- `name`: “Lucas”\n- `dateOfBirth`: “25/10/2001”\n\
    - `wasHiredOn`: “01/09/2017”\n- `job`: “CEO”\n- `salary`: 50000.0\n\n**Create\
    \ some methods:**\n- `promote`: increases the employee's salary according to the\
    \ parameter `amount` passed as argument. No return.\n- `calculateAnnualSalary`:\
    \ does not receive any parameters; returns the salary multiplied by 12 (months).\n\
    \n### 2) Create a class to test your `Employee` class.\nI’ll call mine `TestEmployee`,\
    \ but you can call it whatever you want. This class must have the `main` method.\
    \ Create a new object of type `Employee` and give it the attributes you want to.\n\
    \n#### Answers\n1)\n```java\npublic class Employee {\n    String name;\n    String\
    \ dateOfBirth;\n    String wasHiredOn;\n    String job;\n    double salary;\n\
    \    void promote(double amount) {\n        this.salary += amount;\n    }\n  \
    \  double calculateAnnualSalary() {\n        return this.salary * 12;\n    }\n\
    }\n```\n2) Here’s an example of how your test class might look like:\n```java\n\
    public class TestEmployee {\n    public static void main(String[] args) {\n  \
    \      Employee e = new Employee();\n        e.name = \"Lucas\";\n        e.dateOfBirth\
    \ = \"25/10/2001\";\n        e.wasHiredOn = \"01/09/2017\";\n        e.job = \"\
    CEO\";\n        e.salary = 50000.0;\n        e.promote(1000.0);\n        double\
    \ annualSalary = e.calculateAnnualSalary();\n        System.out.println(\"Annual\
    \ Salary = \" + annualSalary);\n    }\n}\n```\n\n## Workout Set #6 - Part Two\n\
    \n### 3) Create a `show()` method, which neither receives nor returns any parameters\
    \ and simply prints all the attributes of our employee. That way, you don’t have\
    \ to keep copying and pasting a bunch of `System.out.println()` for every changes\
    \ and testings you do with each of your employees. With that method, you're simply\
    \ going to do:\n```java\nEmployee employee = new Employee();\n// …\nemployee.show();\n\
    ```\n![](images/00036.jpeg)\n\n#### Answers\n3)\n```java\nvoid show() {\n    System.out.println(\"\
    Name: \" + this.name);\n    System.out.println(\"Date of Birth: \" + this.dateOfBirth);\n\
    \    System.out.println(\"Hired on: \" + this.wasHiredOn);\n    System.out.println(\"\
    Job: \" + this.job);\n    System.out.println(\"Salary: \" + this.salary);\n  \
    \  System.out.println(\"Annual Salary: \" + this.calculateAnnualSalary());\n}\n\
    ```\n\n## Workout Set #6 - Part Three\n\nIt's time to train your learning muscles!\
    \ Create the following classes with the respective attributes and methods. Don’t\
    \ be afraid to play around, it’s time to discover things on you own!\n\n### 1)\
    \ Class: `Person`\n- **Attributes:**\n    - `name` - `String`\n    - `age` - `int`\n\
    - **Method:**\n    - `void oneMoreYear()` - increases the age of the person by\
    \ 1\nCreate a person, put her/his name and initial age, make birthdays (increase\
    \ age) and print the person’s name and age.\n\n***\n\n### 2) Class: `Door`\n-\
    \ **Attributes:**\n    - `opened` - `boolean`\n    - `color` - `String`\n    -\
    \ `dimensionX` - `double`\n    - `dimensionY` - `double`\n    - `dimensionZ` -\
    \ `double`\n- **Methods:**\n    - `void open()` - opens the door\n    - `void\
    \ close()` - closes the door\n    - `void paint(String s)` - paints the door with\
    \ color `s`\n    - `boolean isOpen` - returns true if the door is open, and false\
    \ if the door is closed\nCreate a door, open and close it, paint it in different\
    \ colors, change its dimensions, and use the `open()` method to check if it is\
    \ open.\n\n***\n\n### 3) Class: `House`\n- **Attributes:**\n    - `color` - `String`\n\
    \    - `door1` - `boolean`\n    - `door2` - `boolean`\n    - `door3` - `boolean`\n\
    - **Methods:**\n    - `void paint(String s)` - paints the door with color `s`\n\
    \    - `int howManyDoorsOpened()` - returns the number of doors that are opened\n\
    Create a house and paint it. Open and close the three doors as desired. Use `howManyDoorsOpened()`\
    \ method to print the number of open doors.\n\n#### Answers\nNo answers this time!\n\
    \n## Chapter 7: Arrays\n\n### Primitive Data Type Array\nImagine you want to store\
    \ your age in a variable. You probably thought of something like this:\n```java\n\
    int age;\n```\nAnd you’re correct. But what if you need to store the ages of a\
    \ big group of people? Let’s say 10.\n```java\nint age1;\nint age2;\nint age3;\n\
    int age4;\nint age5;\n//…\n```\nThat doesn’t seem very practical, right? Because\
    \ it really isn’t. I’m glad you noticed that.\n\nSo, what is the solution? **Arrays**.\
    \ In this case, integer arrays, which you can declare like this:\n```java\nint\
    \ [] ages;\n// or:\nint ages[];\n```\n`int[]` is a type. An array is always an\
    \ object, therefore, variable `ages` is a reference. Let’s create an object to\
    \ use that array with 10 ages:\n```java\nages = new int [ 10 ];\n```\nThe statement\
    \ above created an array.\n\n![](images/0037.jpeg)\nNotice how `ages` references\
    \ the array. We can access an element of the array by its index. Let’s say we\
    \ want to put 32 in the first position.\n```java\nages[0] = 32;\n```\nIn Java,\
    \ array indexes range from 0 to `n-1` (where `n` is the size). If you try to access\
    \ a position that is outside that range, you get an error. A common mistake is\
    \ to access the last index using the size of the array (`n`) instead of `n-1`.\n\
    \n### Object Arrays\nInstead of storing numeric values, an array stores stores..\n\
    ,,,,, to to0:\n```java\nAccount[] myAccounts;\nmyAccounts = new Account 10];\n\
    ```\n\n,,,,,,,,,\n\n\n\n\n, to to to to placed to placed to to to to to to to\
    \ to to\nnull.\nThe first position of the array is pointing to `null`. You have\
    \ to populate your array before trying to access its positions.\n```java\nAccount\
    \ a = new Account();\na.balance = 2500.0;\nmyAccounts[0] = a;\n```\nOr you can\
    \ do it more directly:\n```java\nmyAccounts[1] = new Account();\n```\n![](images/0039.jpeg)\n\
    So this is the array represented graphically:\n![](images/0040.jpeg)\n\nIterate\
    \ through an array\nImagine you want to print out all the values in your array,\
    \ or plenty of them, for example. It’s unsustainable to do:\n```java\nSystem.out.println(myArray[0]);\n\
    System.out.println(myArray[1]);\nSystem.out.println(myArray[2]);\n```\nInstead,\
    \ we use a `for` loop (Chapter 5).\n```java\npublic static void main( String []\
    \ args) {\n    int [] ages = new int [ 10 ];\n    for ( int i = 0 ; i < 10 ; i++)\
    \ {\n        ages[ i] = i * 2;\n    }\n    for ( int i = 0 ; i < 10; i++) {\n\
    \        System.out.println(ages[ i]);\n    }\n}\n```\nFirst, I populated the\
    \ array:\n```java\nfor ( int i = 0 ; i < 10; i++) {\n    ages[ i] = i * 2;\n}\n\
    ```\nFor every `i` in the range of 0 to 10 (including 0 but not 10), the respective\
    \ position in the array (`ages[ i ] ) will be assigned a value of `i * 2`.\nSo,\
    \ this is the array represented graphically:\n![](images/0040.jpeg)\n\n### Passing\
    \ Arrays to a Function\nHowever, in many cases, we get arrays we didn’t create\
    \ and we might not know how big they are. So, when should our for loop stop? Here’s\
    \ an example with a function that would print the items of a given array.\n```java\n\
    void printArray( int [] array) {\n    for ( int i = 0 ; i < ????; i++) {\n   \
    \     System.out.println(array[ i]);\n    }\n}\n```\n```\nTo solve that problem,\
    \ we can use an attribute that every array in Java has: `length`.\n```java\nvoid\
    \ printArray( int [] array) {\n    for ( int i = 0 ; i < array. length; i++) {\n\
    \        System.out.println(array[ i]);\n    }\n}\n```\n"
