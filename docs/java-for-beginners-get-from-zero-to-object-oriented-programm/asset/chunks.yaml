    ![](images/00001.jpeg) Java For Beginners: Get From Zero to Object-Oriented Programming
    by Lucas Barzan


    ## Introduction

    I have worked really hard to make this book for you because I know how difficult
    can be to learn programming, especially when you’re starting out. So I want to
    teach you in the way I’ve learned, which is by doing.


    ## Who is this book for

    This book is for everyone who wants to learn Java and knows nothing or little
    about programming If you want to be a programmer and you want to start by learning
    Java, this book is your first step. If you want to develop Android apps, this
    book is your first step. If you want to learn something new, this book is your
    first step.


    ## Who should back away from this book

    First of all, this book is for people who are willing to learn something new.
    There will be many times in which you’ll feel confused or overwhelmed, but you
    have to able handle that frustration if you want to achieve your final goal. Your
    WHY has to be strong so that you won’t give up in the middle of this book. Also,
    I don’t recommend this book if you’re looking for an advanced guide that will
    cover everything about the Java language.


    ## How to Learn Java

    Some books only give you the theory and don’t even bother to make you practice.
    I think that’s a terrible way to teach (programming, least). You should get hands-on
    experience as soon as possible and because of that you’ll often be writing and
    running code in your IDE. So I recommend you to be next to a computer. Think of
    it as a course, not a romance to read on your bed or on the beach. practicing
    should be taken seriously. It’s the one and only way to be a great programmer
    and I can’t guarantee that you’ll learn anything if you don’t do the exercises.
    I mean it. There’s no shortcut. The exercise sections are called Workout Sets
    because our intelligence is like a muscle: the more we use it, the more we grow
    it. By the end of this book, you’ll have done 70 exercises. Although I provide
    the answers to the exercises in most cases, just thinking about an exercise and
    jumping to the answer is not practicing. And if you do that, you’ll just lying
    to yourself. So, if you’ve downloaded this book, you have to make a commitment
    to yourself. Read. Think. Do the exercises. Repeat. Trust the process and great
    results will come!


    ## Chapter 0: Java?

    ### What is Java?

    According to its official website, “Java is a programming language and computing
    platform first released by Sun Microsystems in 1995. There are lots of applications
    and websites that will not work unless you have Java installed, and more are created
    every day. Java is fast, secure, and reliable. From laptops to datacenters, game
    consoles to scientific supercomputers, cell phones to the Internet, Java is everywhere!”.
    Java is a general-purpose language, which means it is used to build almost anything
    (i.e. it wasn’t created to solve only one type of coding problem). And before
    I forget, Java has nothing to do with Javascript except for the similar name and
    the fact that they are both famous programming languages. I will not spam you
    with pages of Java’s history because that’s out of the scope of this book. All
    you need to know is that Java is famous and has been on the market for a long
    time, so there isn’t any plans for its death. Which brings us to the next section...


    ### Why Learn Java?

    Although Java is not the most beginner-friendly language out there, it offers
    other benefits, such as:

    - Programs written in Java are easy to maintain;

    - Java has a huge community and you’ll never be alone. If you get an error, it’s
    very likely that it happened to other people as well;

    - People who know how to program in Java have access to great career opportunities.
    Many tech giants such as Google or Amazon also use Java to develop the backend
    of their websites, and because it has pretty good performance, a lot of startups
    who reach the scaling point would integrate their apps with Java to power features
    that need to have good performance;


    ## What if something goes wrong?

    It’s very common to make mistakes when programming, especially in the beginning.
    So, if you have any questions that are not covered in this book, you can follow
    these steps to solve your problem:

    - First, search for your problem. I can almost guarantee you that someone else
    has been through the same situation. If you get an error, search for that error.
    If you want to know how to implement something, search for that. You’re probably
    going to find some answers on `StackOverflow`, which is the biggest Q&A website
    for developers.

    - If you haven’t found any answer – although that’s very unlikely –, you can create
    a new question on `StackOverflow` and wait until someone answers it (it’s the
    internet, it won’t take much time to happen). Follow the website’s instructions
    to post your question and, first of all, be sure that there isn’t any similar
    questions that can help you, otherwise yours will be removed as a duplicate.

