    # 字节 (Byte)


    `byte` 可以被视为内存大小的单位，它实际上是一组位（bits）或二进制单元，通常为 8 位，并作为一个单元进行操作。这对于你使用 Java 意味着什么？在
    Java 中，它的最小值为 `-128`，最大值（包含边界）为 `127`，并且默认值为 0。这种类型的 `byte` 数据在 Java 中实际上被用于在大型数组中节省空间——大多数时候用于替代整数，因为
    `byte` 实际上比整数小四倍。通常，你会看到 `byte` 的表示方式如下——例如 `-100 byte`。


    # 短整数 (Short)


    当 `byte` 数据需要完整的整数时，你可以使用 `short` 数据来包含实际上不需要或不需要整个整数宽度的整数值。在某些情况下，`short` 数据可以将你的
    `short` 变量紧密排列在一起，以节省内存消耗。在 Java 中，`short` 数据类型是 16 位数据，最小值为 `-32.768` 或最大值为 `32,767`，同样默认值为
    `0`。这些数值实际上是两个简单的方程——分别为 `(-2¹⁵` 和 `2¹⁵ -1)`）。这种类型的数据也适用于节省内存，就像我们在之前的字节节中讨论的
    `byte` 类型数据一样。尽管如此，`short` 数据也可以用于节省内存，因为它比整数小两倍。你可能会看到 `short` 数据的表示方式示例，例如 `short
    s= 20000` 或 `short r = -100000`。


    # 整数 (Int)


    这种数据以完整、未缩写的形式实际上被称为整数数据（integer data）。整数数据的定义是数学整数的一个非常小的子集，可以被视为一组所谓的二进制位（通常称为
    `bits`）。计算机硬件总是希望有一种方式让用户用整数表示数据（如内存地址或处理器寄存器）。在 Java 的用途方面，`integer` 或 `int`
    数据是 32 位有符号补码整数，最小值为 `-2,147,483,648`，最大值（包含边界）为 `2,147,483,647`，默认值为 `0`。这些可以分别由方程
    `-2³¹` 和 `2³¹ -1` 表示。整数数据是整数值最常用的数据类型，事实上，它经常被用作默认数据类型。然而，如果担心内存，你可能不想使用这种方法（如你所，最小值和最大值远大于前两种数据类型）。你还会看到这种数据以此格式表示，例如
    `int a= 200000` 和 `int b = -100000`。


    # 长整数 (Long)


    正如其名称所暗示的那样，`long` 数据在其利用的最小值和最大值实际上非常大。`long` 数据的最小值为 `-9,223,372,036,854,775,808`，最大值为
    `9,223,372,036,854,775,807` 且包含边界，默认值为 `0L`。这些由方程 `-2⁶³` 和 `2⁶³ -1` 表示。当需要比整数数据宽得多的范围时，使用
    `long` 数据。你会看到像这些示例这样的 `long` 格式数据——`long a = 200000L` 或 `long b=-100000L`。


    # 浮点数 (Float)


    `Float` 数据我们看的是单精度 32 位 IEEE 754 浮点数。当你想要节省内存时，你可能想要考虑这个选项以节省更多数据。这种数据的默认值为 `0.0f`，这种类型的数据永远不会用于被视为精确的值，例如货币。你会看到它的表示方式如
    `float f1= 345.6f`。


    # 双精度浮点数 (Double)


    `Double` 数据是一种双精度、64 位 IEEE 754 浮点数据。这种类型的数据是存储小数值的默认类型。始终记住，当你处理精确值或整数时，不应使用这些类型的数据。这种类型的数据默认值为
    `0.0d`，示例——`double d1= 567.8`。


    # 布尔值 (Boolean)


    我们之前简要提到过 `Boolean` 数据。`Boolean` 数据是只有两种结果的数据类型：`true`（真）或 `false`（假）。它被用于查找和跟踪真、假条件。始终记住，与你可能想的那样，该数据集中实际默认值不是某些形式的零，而是
    `false`。当你将真和假视为唯一可能的输出时，这是很合理的。你会看到这种类型的数据在示例中表示为如 `Boolean one =true`。


    # 字符 (Char)


    这种 `char`（或字符）类型的数据是单个的 16 位 Unicode 字符。这种数据由最小值 `\u0000`（或 `0`）表示，最大值为 `\uffff`（或
    `65,535`），且最大值包含边界。这种类型的数据用于存储任何字符。你看到这种数据的表示示例是 `char letterB =”B”`。现在在讨论数据之前，我写过这些是原始数据类型。在思考数据时，对你有帮助的是参考我们上面关于非原始数据类的内容。然而，它们都是我们编码中的两种方式。


    ## 引用数据 (Reference Data)


    在 Java 的世界中，我们还会看到被称为引用的对象。我们可以将引用变量视为实际上通过构造函数创建的变量。这些是无法改变的。一个示例是 `Animal =
    new animal()`。


    任何原始类型数据都可以被视为字面量（literal）。字面量源码是具有固定值的。基本上你不能在值内部进行任何计算。这些字面量可以赋值给任何原始类型，示例 `char
    d = “D”`。当你思考字面量时，有些所谓的 `String` 和 `char` 字面量支持一些特殊的转义序列。这些如 `\n`（换行）、`\b`（退格）、`\s`（空格）、`\\`（反斜杠）、`\t`（制表符）、`\’`（单引号）、`\"`（双引号）、`\r`（回车）、`\f`（分页）以及
    `\ddd`（八进制字符）。这些特殊的转义序列将来对你可能会有用。现在只需参考它们即可。


    ## 变量 (Variables)


    正如在任何数学活动中一样，你可以在 Java 中操作变量，以便有助于的方式命名特定的变量。每个变量都有与其相关的不同规则集，可以应用于当前的变量。在 Java
    中，你必须在使用变量之前对其进行声明。有我们可以使用的三种不同类型的变量，以便对变量本身进行适当的分类组织。在上一章节中，我们详细讨论了变量。


