    # Java：初学者快速学习 Java 编程完全指南


    ## 目录

    - 介绍

    - 第 1 章 什么是编程？

    - 第 2 章 什么是 Java？

    - 第 3 章 条件与控制流

    - 第 4 章 面向对象 Java

    - 第 5 章 数据结构

    - 第 6 章 有用提示与资源

    - 结语


    ## 介绍

    本书的目的是帮助你学习什么是编程以及什么是 `Java`。我们大多数人都听过“计算机编程”和“编码”这些术语，但可能并不了解其他。计算机编程自计算机发明以来就存在了——它是组织计算机以运行各种程序的方式。编码是指人们通过计算机编程语言与计算机交流的能力。就像人类一样，计算机也有多种可以用来相互交流的语言。


    如果第一段话激发了你的兴趣，那么这本书绝对是为你准备的。我们大多数人非常感兴趣为什么以及我们如何学习获得对特定主题或事物的更多控制权——一旦我们了解了基本原理，计算机其实非常简单！通过本书的学习，我希望让你对编程领域以及在编码和编程世界中使用
    `Java` 的术语和基础功能感到熟悉。虽然我不能保证你会掌握关于 `Java` 和计算机的一切——但我保证你将拥有足够的技能和对基本原理的理解，让你能够在自己的计算机沙箱中大显身手（在第一章会有详细介绍）！


    在书的末尾，我将介绍许多有助于提示和资源，这些资源可以帮助更好地掌握 `Java` 本身以及如何使用它。虽然其中的许多提示和术语现在对你来说可能没什么意义，但请记住，你正在建立一个基础和资源列表，当你在编码编程之旅中遇到波折时，可以回来查看。我鼓励你阅读所有内容，并尝试记住你能记住的部分——并在需要时回来查看剩下的。


    我鼓励你在 `Java` 程序中实践书中的一些想法。将本书作为一份编程经验指南，并结合使用，为学习新事物创造最长期的记忆。确保尝试多次，以确保你完全理解了这些概念，并能够在任何时候轻松复制它们，即使你需要查阅资源来准确找到你正在寻找的内容。虽然人类不可能记住所有内容，但本书应该带给你一些你可以使用的通用知识，让你觉得自己已经稳固地掌握了
    `Java` 的入门概念。


    如此，我期待你逐章完成这些章节。学习计算机编程等技能的能力，真的受限于你愿意投入其中的精力。我们将从 `Java` 开启编程之旅，并用整一章专门介绍编程的基本术语和功能，为你在虚拟计算机世界打下坚实的基础。


    ## 第 1 章 什么是编程？

    你很可能在生活中以前就听过“编程”这个词，无论是在互联网上，还是在与人讨论技术时。如果你像我一样，你可能只是微笑并点头，好让自己看起来听懂对方在说什么——而不是承认你对其包含的内容完全没有坚实的了解。涉及到计算机编程时，`Java`
    是我们在计算机编程世界中所关注的语言。在我们深入研究 `Java` 的细节之前，对编程有一个基本的理解是非常重要的。


    大多数人可以通过点击图标来操作计算机上的基础图形界面，或者在 Word 文档中打字来为学校准备论文或准备简历以获得工作。然而，原始的计算机没有这些图形图标，看起来更像是由不同文本块连接而成的块。为了理解屏幕上所有无数字符的含义，人们必须学习如何使用计算机的语言。这就是编程（或正式术语中的计算机编程）的本质——理解如何通过计算机的语言来让它执行你想让它完成的任务。


    当你编程时，你始终要记住，尽管有语言规则和结构语法规则只允许你做某些事情，但如果你愿意，你可以对现有的基础上进行改进。某些方法对别人有效，但对你可能效果一般。如果由于某种原因，某事的处理方法对你来说不合逻辑，请参考外部资源，以了解为什么要那样处理。在本书的书中，我的目标是让你很好地理解
    `Java` 中事情是如何做的以及为什么这样做；然而，由于这是一本初学者指南，确实缺乏你可能在短时间内就准备好的中级和高级选项及描述。


    为了学习如何向计算机说 `Java` 以对其进行编程，对于一个接受训练的新程序员来说，首先对计算机编程什么是相当深入的想法是无价的。计算机编程的基本活动包括对编程本身的理解、如何生成算法、理解计算机分析的能力、如何验证你的算法正确的想法，最后实现（或编码）你所需的算法，在这里是
    `Java`。首先是一些在开发计算机编程技能时非常有用的关键术语。


    ### 常用术语与定义

    - `Algorithm`（算法）：一种使用逻辑或数学技能解决问题的方法。

    - `API`：应用程序编程接口。它本质上是一组允许代码与其他网站或软件通信的规则。

    - `Code`（代码）：也称为源代码。它是使用编程语言编写的指令集。

    - `Code Editor`（代码编辑器）：一种专门为计算机程序员设计的文本编辑器程序。可以作为应用程序使用，也可以集成到软件或浏览器中。你基本上可以检查你编写的代码，就像报纸或杂志的传统文字编辑一样，只不过是数字化！

    - `Compiler`（编译器）：这种程序允许将你编写的代码翻译成所谓的二进制（即构成实际机器码的 0 和 1）。

    - `Concatenation`（拼接）：这是将字符串字符串（例如两个列表）合并的能力。

    - `Control Flow`（控制流）：这是计算机对代码段运行顺序的控制。本质上它是数据流流动的规则。

    - `Dump`（转储）：这是数据列表或类似于程序崩溃时保存的文本文件。它对于诊断问题（为什么会崩溃）非常有帮助。

    - `Floating point`（浮点数）：基本上它是一个小数，其中小数本身被称为浮点（例如 4.56）。

    - `Function`（函数）：获取特定结果的编写指令，可以通过简单的编写它们或“调用”它们来使用。


