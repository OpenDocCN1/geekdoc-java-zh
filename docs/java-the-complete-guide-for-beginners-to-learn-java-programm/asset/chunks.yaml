    我想再次强调，所有这些类别可能并不是你现在已经准备好完全掌握的内容。你正处于学习阶段，并且在考虑你认为合理的范围时，绝对要考虑到你自己的舒适度。我鼓励你认真学习前几章的内容，对
    `Java` 的基础方方面有一个透彻的理解。


    # 资源


    在辅助学习过程的资源方面，真的有成千上万的选择，这在起初可能会让你感到无从从。有时你很难确定到底什么对你会有帮助。我想给出的第一条建议是，你应该目标寻找能解决你特定问题的资源。在正在阅读的书籍或文章的标题中直接看到问题或答案是非常重要的。如果你使用这个简单的策略，我保证你在回答自己可能遇到的问题时会轻松得多。这不是一个万无一失的策略，但这是一个很好的起点。


    如果你陷入了编程的瓶颈，你可能想看一些循序渐进的教程。这些教程可以提供步骤，分解说明如何以及为什么要使用某些术语、间距甚至数据类型。你可以通过搜索诸如“初学者
    `Java` 入指南”之类的内容轻松地找到它们。如果这本书中的任何内容不像你所需的那么详细，那么需要更多帮助并寻找能帮你澄清或巩固想法的东西并不可羞耻。


    我们还看到许多人通过论坛获得帮助。这些是极佳的获取渠道，因为实际上会有成千上万的人针对你正在研究的任何话题提供意见。在大多数情况下，在编程和编码社区中，人们通常想要帮助新手，因为他们知道曾经处在你的境地是什么感觉。记住，并不是所有的建议或代码示例对你都有帮助，现阶段请留在新手论坛，以免被那里海量的可能性让你应接不暇。


    还有大量的文章或杂志可以阅读或订阅，以帮助你建立知识体系。我认为由于我们身处这样一个数字化时代，许多人忽视了实际的纸质媒体，但现在仍然有很多流行的杂志可以为你提供最新的、实用的提示和建议。在这些流行的杂志中，我发现
    `Wired` 和 `PC World` 在我追求知识的途中非常有帮助。它们的写作水平通常是任何初学者都能理解的，如果他们没理解，它们还会提供供你理解的资源。这是一件很棒的事，因为媒体是，这些杂志旨在向对计算机、编码和编程感兴趣的各行各业的人提供信息。也不要忽视主要出版商的在线文章，你永远不知道有用信息会在何时何出现。


    此外，永远不要低估库或代码编辑器的力量。这些工具的每一种都可以帮助你发现可能需要的代码，并确保这些代码不会充斥错误。这些资源提供了大量的可用代码，可以帮助你解决编码和编程过程中可能遇到的任何潜在问题源。然而，我提醒你要完全理解代码，以防出现任何问题时，你能够弄清楚在哪里以及如何解决它们。


    YouTube 视频是寻找资源的另一个很棒的地方。这些视频让你能在更真实的场景中观察编程示例，这对你可能大有帮助。虽然阅读并获取信息很棒，但视频的魅力在于你可以直观地看到别人对你的要求以及他们是如何做的。无论我在书中如何努力，我都无法给你提供那样的演示，所以利用
    `YouTube` 是一个很好的选择。至于视频质量，就像寻找任何资源一样，可能需要筛选掉没帮助的视频，以找到你真正可以使用的视频。给你的建议与在 `Google`
    之类的搜索类似，让你的搜索描述尽可能接近你想看的内容。这使得结果有望包含那些词的组合。从我们讨论过的语句的角度来思考搜索函数，你需要指定你想要的数据，以便计算机返回你想要的结果。再次记住，计算机不会像人类那样推断含义——它们直率到近乎刻板。


    记住同时利用你的大脑以及可能也对计算机编程和编码感兴趣的朋友，来为潜在问题脑暴解决方案。永远不要低估你自己，不要低估自己通过在自己的沙箱中尝试不同的解决方案来玩代码和编程来寻找答案的能力。如果起初没有成功，请再次尝试！


    # 结论


    这本书的目标是为你提供一份指南，说明什么是 `Java` 编程以及你如何学习将其应用到你自己的计算机编程技能工具箱中。虽然这是一本初学者指南，但我为你提供了一组非常好的通用术语、规则以及
    `Java` 工作原理的示例。通过这本书的内容，我希望你能够获得一些易于理解的术语、观点和方法，并在继续学习更多知识时带上它们。


    从概述计算机编程基础的第一章开始，我这本书的目标是让这些材料成为任何人都能理解的内容。我写作的目的是确保即使是完全的新手也能理解基础，并能够（即使你从不使用它们）更多地了解计算机的实际运作方式。由于技术（特别是计算机是我们日常生活中的重要组成部分），我强烈认为我们更多地了解它们，让我们的生活变得更容易。涉及到编程和编码，这可能不是每个人都喜欢的嗜爱好——但一旦你开始学习这种语言，它真的非常有趣。


    就像学习任何新事物，尤其是一种语言一样，总会有学习曲线。如果你读了这本书仍然对编程世界感到疲倦，也许可以花几天时间反思一下内容，然后回来重读。我总是使用这种策略，让内容发酵一段时间后，通常会有更好的意义。对于那些在第一遍就完全掌握了内容的人，为你们点赞！


