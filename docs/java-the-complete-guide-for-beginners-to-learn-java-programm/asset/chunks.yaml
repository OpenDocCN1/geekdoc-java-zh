    As the word analysis suggests, computer analysis consists of looking and troubleshooting
    for problems or software issues within your system or programs. Essentially, being
    able to understand how a computer works is a key component to be able to isolate
    any issue and solve it. This part of the programming is something you should have
    a good firm grasp on, as with any new task to learn, it is good to be very familiar
    with how and why your hardware or tools operate. This is the same with computer
    analysis. Keeping up with the newest technologies, programs and incorporating
    how and why you should use a method or program is important to know. Picking up
    this book and reading it is a great start to learning how coding and programming
    works. After you have mastered `Java`, do not fear! There are many different languages
    and systems to explore and master as well. The greatest thing about technology
    is that it is constantly being innovated into the best possible thing it can be.
    Knowing how to secure systems and resolve issues will get you very far in many
    aspects of life, particularly, when sensitive issues or data may be at stake,
    eventually something you will deal with as a programmer.


    ## How to Verify you Code is Correct


    One sure way to verify if your code is correct is to try and run it. However,
    if the code is something you are doing outside of your sandbox, you have several
    other methodologies to use to ensure you are getting your correct message across.
    There are many different online websites, serving as code editors that you can
    utilize in order to check code. These are websites such as `Tinkerbin`, `Write
    Code Online` or `Codepad`. Basically, if you do a google search for a code editing
    program for any language you are using, you will be able to find a suitable interface
    to do so.


    Having a sandbox to play around with your coding is a very efficient way in which
    to check your code. By utilizing this method you are able to create a virtual
    environment to test out code to make sure it will complete the proper function.
    This is important if you are going to code something that will effect the ability
    of a program, software or even website that you are attempting to build.


    Another great resource you can use to help insure you have proper code is something
    called a `library`. As you are probably familiar with a library of books, this
    is similar as it is a large virtual library that contains code. Using this method
    can be great if you need to make sure something is up to par and working. However,
    I would caution that you always be able to understand the code you are using—even
    check that code with a code editor. You should be able to understand the code
    in order to fix it if a problem arises. If you just copy and paste from a `library`,
    without understanding, it could lead to huge potential issues down the road.


    Now that you have a great, general foundation for what programming is, let us
    move on to `Java` specifically. I will lay out in the next few chapters some important
    understand of what and how to use `Java` and its functions. This will all build
    on the information in this chapter, so hopefully you have a fairly firm understanding
    of some of the main parts of the world of coding and programming.


    ## Chapter 2- What is Java?


    Now that you have a better idea of what programming is, let us move into learning
    about exact what `Java` is and how it fits into the world of coding and programming.
    As a computer programming language, which is what `Java` is, it is designed to
    be a language that it class based, object oriented, concurrent and has the least
    implementation dependencies as possible. Essentially, any platform that supports
    `Java` can run `Java` without a need for recompilation. This is one of the reasons
    that `Java` is one of the most popular languages in use today. One phrase that
    developers use to describe the multi-platform use of `Java` is “Write once, run
    anywhere” also known by the acronym `WORA`.


    As a language, you may have a learning curve when it comes to the understanding
    of why and how certain things are done within the language. Typically within this
    book, I try to give as many explanations to you as possible without getting into
    unnecessary detail for you at the beginner level. With that being said, as with
    the English language, there will probably be rules and situations you do not fully
    understand why they are formatted or done in a certain way. Rather than spending
    time and effort into understanding these things, I encourage you to just accept
    them as they are. Although you may want a better answer than that, unfortunately
    I think only the creators themselves know the reasoning behind them—and it may
    even just boil down to their preference or the computers ability to understand.


    `Java` was created by a man named `James Gosling` in 1995. He designed `Java`
    as a programming language that has fewer low level facilities than languages like
    `C` and `C++`. Essentially meaning that it focuses on the high level, essentials
    for running computer programs rather than the more minute and micro details that
    these other programming languages have. There are five main goals that `Gosling`
    used to guide him in the creation of `Java`, These are that 1) it must be threaded,
    interpreted and dynamic, 2) it must be object oriented, simple and familiar, 3)
    it must be secure and robust, 4) it must execute with high performance and 5)
    it must be portable and architecture-neutral.


    These five goals explain why it is such a commonly used language. These are goals
    that allow for users to have a mainstream, useable and effective method for building
    anything from software to a website. User friendly programs are something that
    bring the complexities of computer programming into a more relatable experience,
    especially for new users and those just starting out learning. This is why I personally
    recommend and find it important for beginners to have a firm grasp on. It is very
    widely used and therefore pretty important to know and understand for anyone trying
    to work, or even just have as a hobby, computer programming and coding.


    Now that there is a little background on `Java`, how do you get the actual program
    running on your own system? Basically, one of the more difficult things to start
    coding `Java` is acquiring all of the necessary tools to run it. `Java` is an
    independent platform, which means it will run on just any operating system. The
    reason for this is a program called `Java Virtual Machine` (also called `Java
    Runtime Environment`). In order to start coding in `Java`, you need to download
    this program in order to do so. You can actually make sure you have this program,
    as some computers do have it installed, or install it through the `Java` website.
    There are options for many operating systems so you should be good to go once
    you are able to locate it and download it.


    So now you have downloaded (or discovered you had) this program—what does it mean?
    It means that you can run `Java` on your computer, we will get to the actual program
    to download the coding now. That is known as `Java`’s Software Development Kit,
    it can be downloaded off the `Oracle` website (it is the company that owns `Java`).
    The one you want to use called `Java SE` (Standard Edition). For the purposes
    of being able to code, we are going to do so using something called `NetBeans`,
    so once you find `Java SE` you will want to find an option that is called `JDK
    8 with NetBeans`. You are also going to want to go to the `NetBeans` website and
    download software there. After you have gained access to the software, we are
    ready to code!

    '
