    正如字面意思所暗示的，计算机分析包括在你的系统或程序内部进行查找和排除查故障或软件问题。本质上，理解计算机如何工作是能够隔离任何问题并解决它的关键组成部分。编程中的这部分是你应该牢牢掌握的，就像学习任何新任务一样，非常熟悉你的硬件或工具如何运行以及为什么运行是有益的。计算机分析也是如此。跟上最新的技术、程序，并将理解如何以及为什么要使用某种方法或程序融入其中是至关重要的。拿起这本书并阅读它是学习编码和编程工作原理的绝佳开始。当你掌握了
    `Java` 之后，不要害怕！还有许多不同的语言和系统供你探索和掌握。技术最伟大的点在于，它在不断创新，成为它可以达到的最好。了解如何保护系统和解决问题将让你在生活的许多方面走得很远，特别是在涉及敏感问题或数据时，这最终将是你作为一名程序员需要处理的问题。


    ## 如何验证你的代码是否正确


    验证代码是否正确的一种可靠方法是尝试运行它。然而，如果你是在沙箱之外进行代码，你还有几种其他方法论可以使用，以确保你传达了正确的信息。有很多不同的在线网站作为代码编辑器，你可以利用它们来检查代码。这些网站如
    `Tinkerbin`、`Write Code Online` 或 `Codepad`。基本上，如果你对你正在使用的任何语言进行代码编辑程序的谷歌搜索，你就能找到一个合适的界面来操作。


    拥有一个沙箱来玩你的编码是检查代码的一种非常高效的方法。通过利用这种方法，你可以创建一个虚拟环境来测试代码，以确保它能够完成适当的功能。如果你要编写的代码会影响你尝试构建的程序、软件甚至网站的能力，那么这一点是非常重要的。


    另一个你可以用来帮助确保拥有正确代码的绝佳资源是被称为 `library`（库）的东西。由于你可能对书库熟悉，这很相似，因为它包含代码的大型虚拟库。如果你需要确保某些东西符合标准并运行正常，使用这种方法是非常棒的。然而，我提醒你，要始终能够理解你正在使用的代码——甚至用代码编辑器检查这些代码。你应该能够理解代码，以便在出现问题时对其进行修复。如果你只是从
    `library` 中复制和粘贴而不理解，可能会在未来导致巨大的潜在问题。


    现在你已经对编程是什么有了很好的通用基础，让我们专门转向 `Java`。我将在接下来的章节中列出关于什么是以及如何使用 `Java` 及其功能的重要理解。这些都将建立在本章信息的基础上，因此希望你对编码和编程世界的一些主要部分有相当牢固的理解。


    ## 第 2 章 - 什么是 Java？


    现在你对编程是什么有了更好的了解，让我们开始学习 `Java` 到底是什么以及它是如何融入编码和编程世界的。作为一种计算机编程语言（这也是 `Java` 的本质），它被设计成一种基于类、面向对象、并发且具有尽可能少实现依赖项的语言。本质上，任何支持
    `Java` 的平台都可以运行 `Java` 而无需重新编译。这是 `Java` 成为今天最流行的语言之一的原因之一。开发者用来描述 `Java` 多平台使用的一个短语是“一次编写，到处运行”（Write
    once, run anywhere），也被缩写为 `WORA`。


    作为一种语言，在理解语言内部某些事情的为什么以及如何做的时，你可能会遇到学习曲线。通常在本书书中，我尝试尽可能为你提供多的解释，而不会让初学者陷入不必要的细节中。尽管如此，就像英语语言一样，可能会出现你无法完全理解为什么以某种特定方式格式化或处理的规则和情况。与其花费精力理解这些事情，我鼓励你直接接受它们的本来面貌。虽然你可能想要一个更好的答案，但遗憾的是，我认为只有创建者自己才知道它们背后的逻辑——这可能仅仅归结为他们的偏好或计算机的理解能力。


    `Java` 是由一个名叫 `James Gosling` 的人于 1995 年创建的。他将 `Java` 设计为一种编程语言，它比 `C` 和 `C++`
    等语言具有更低级的设施。本质上意味着它关注的是运行计算机程序的高级基本要素，而不是这些其他编程语言拥有的更微小的微观细节。`Gosling` 在创建 `Java`
    时使用了五个主要目标，这些目标是：1) 它必须是线程化的、解释的和动态的；2) 它必须是面向对象的、简单且熟悉的；3) 它必须是安全且健壮的；4) 它必须以高性能执行；5)
    它必须是可的且架构中性的。


    这五个目标解释了为什么它是如此被广泛使用的语言。这些目标允许用户拥有一种主流、可用且有效的方法来构建从软件到网站的任何东西。用户友好程序将计算机编程的复杂性带来了更易理解的体验，特别是对于新用户和那些刚开始学习的人来说。这就是为什么我个人建议并发现对于初学者牢牢掌握这一点很重要。它被非常广泛地使用，因此对于任何尝试工作甚至只是作为爱好计算机编程和编码的人来说，了解和理解它都非常重要。


    现在有了关于 `Java` 的一点背景，如何在你的系统上获取实际程序呢？基本上，编写 `Java` 最困难的事情之一是获取运行它所需工具。`Java` 是一个独立的平台，这意味着它可以在任何操作系统上运行。其原因是名为
    `Java Virtual Machine` 的程序（也称为 `Java Runtime Environment`）。为了编码 `Java`，你需要下载这个程序才能。你可以实际上确保你拥有这个程序，因为有些计算机已经安装了它，或者通过
    `Java` 网站安装。许多操作系统都有选项，所以一旦你找到并下载了它，就准备就绪了。


