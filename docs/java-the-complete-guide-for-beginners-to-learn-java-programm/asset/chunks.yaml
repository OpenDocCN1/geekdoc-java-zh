    # 初始化技巧与建议


    注意某些可能阻碍未完全初始化内容的关键变量。这可能是在构造函数中传递了可疑参数，甚至是在构造函数本身中存在有问题的调用，最后是一个在初始化期间使用的静态非空变量。如果不处理这些问题，所有这些都可能给您带来问题或故障。


    # JDK 迁移支持


    在此类别中，我们查看了可以让您获得需要注意的潜在问题警告。这包括诸如不使用注解作为父接口、通过将不同的资源（如 `finally` 块）转换为 `try-with-resources`
    来尝试解决给定的问题等。有一个 `@Override` 注解可以警告您处于重写状态。在所有的编程工具中都会出现许多类似类型的警告和问题。在此类别中，术语具有很强的解释性，并且基本上会在消息本身中告诉您如何修复该问题。


    # Java 代码指标


    Java 代码指标是一系列针对代码中出现问题的潜在警报。这可以是任何情况，例如类拥有过多的构造函数、字段或方法，甚至是类本身过于复杂或耦合性。请记住，你在任何时候都可能让代码变得过于复杂，导致系统可能无法正确处理你的数据。你还会看到关于匿名类拥有过多方法或复杂度以及算术表达式的提示。


    # Java 持久化 API (JPA)


    你将真正使用 Java Persistence API 来检查和验证不同的类等。在此部分，有很多短语会以 `verify` 开头，让你弄清楚诸如查找位置或子类以及验证访问级别或其他属性等问题。你还可以对实体表名或实体拥有的序列化变量进行操作。此外，还需要关于哪些类需要具有默认的公共/保护构造函数的说明。


    # JavaDoc


    JavaDoc 需要了解的两个良好术语是 `create JavaDoc`（创建 JavaDoc）或 `error in JavaDoc`（JavaDoc
    错误）。这两个基础短语允许你在 JavaDoc 中创建内容，或者获知并意识到一个你需要检查的错误。


    # JavaServer Faces


    与其使用 JavaServer Faces（因为它将在下一个版本中弃用），建议使用 `CDI` 和 `Java EE`。


    # 日志


    你可能通过计算机上的各种实例进行登录和登录。在 Java 中，你会看到诸如 `multiple loggers`（多个日志器）、`no loggers`（无日志器）或
    `logger declaration is not static final`（日志声明不是静态 final）之类的短语。这些都是基于类的提示，要么是为了提供信息信息，要么是为了对你创建的日志过程进行某些更改。


    # Maven


    这实际上用于解决缺失的类依赖。它会提醒你向项目中添加内容。


    # NetBeans 开发


    你可能会在 NetBeans 中看到一些术语，它们让你看到正在工作的错误或问题。这些短语可能是 `empty cancel for cancelable tasks`（可取消任务的空取消）或
    `HelpCtx issues issues`（HelpCtx 问题，这些警告了误用或 `.org.openide.util.HelpCtx`），或 `instanceOf`
    运算符非法使用的实例。使用短语 `@NbBundle.Messages` 来封装属性。所有这些都应该在 NetBeans 内部进一步探索。由于我们没有涵盖
    NetBeans 的内部细节，在他们的库中有许多学习更多知识的机会。


    # 性能


    有很多性能提示可以帮助你改进编码方法。诸如创建新的 `Boolean` 短语和对已经装箱的值进行装箱（boxing）等操作会在某种程度上降低你的性能，而且从时间角度来看非常不划算。当你开始调用诸如
    `String.toString` 之类的方法时，某些方法无法实现最佳性能。大多数情况下没有必要重造轮子，否则你可能会陷入麻烦。通常最有效的方法是直接利用
    `String` 而不要让它过于复杂——尤其是当你正在学习时。


    # 潜在错误


    有一份非常长的潜在错误列表，实际上非常多，我只需列出它们是什么，因为你可以根据此发现问题。（此处省略原文中未翻译内容或根据指令逻辑处理的重复部分，但需确保不漏翻译逻辑）你还可以对实体表名或实体拥有的序列化变量进行操作。
    还需要关于哪些类需要具有默认 public/protected 构造函数的说明。你还可以对实体表名或实体拥有的序列化变量进行操作。 还需要关于哪些类需要具有默认
    public/protected 构造函数的说明。


    （注：由于原文文本在 Probable Bugs 之后存在大量重复的描述，译文已根据“不要重复输出原文”的原则进行了处理。）

