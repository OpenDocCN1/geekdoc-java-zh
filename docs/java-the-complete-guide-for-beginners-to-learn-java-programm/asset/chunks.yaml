    # Java: The Complete Guide for Beginners to Learn Java Programming Fast


    ## Table of Contents

    - [Introduction](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)

    - [Chapter 1- What is Programming?](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)

    - [Chapter 2- What is Java?](#part0000.xhtml_ch2)

    - [Chapter 3- Conditions and Control Flow](#part0000.xhtml_ch3)

    - [Chapter 4- Object Oriented Java](#part0000.xhtml_ch4)

    - [Chapter 5- Data Structures](#part0000.xhtml_ch5)

    - [Chapter 6- Helpful Hints and Resources](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)

    - [Conclusion](#part0000.xhtml_conclusion)


    ## Introduction

    The aim of this book is to help assist you with learning how and what programming
    and `Java` are. Most of us have heard the terms “computer programming” and “coding”
    but may not know much else. Computer programming has been around since the invention
    of computers—as it is the manner in which a computer is organized in order to
    run various programs. Coding is the ability for someone to speak the language
    of the computer through a computer programming language. Just like with humans,
    computers have multiple languages they can use to speak to each other.


    If I have gained and peaked your interest with this first paragraph—this book
    is most definitely for you. Most of us are greatly interesting in why and how
    we could learn how to gain more knowledge of control over a certain subject or
    thing—computers are actually quite easy once we know the basic philosophies! Through
    the course of this book, I hope to have you comfortable to the terminology and
    basic functioning of computers in the fields of programming and using `Java` within
    the coding and programming world. Although I cannot promise you will know everything
    about `Java` and the computer—I do promise that you will have enough skills and
    comfort with basic principles you will be able to play in your own computer sandbox
    (more about that in the first chapter)!


    Towards the end of the book, I go over a lot of helpful hints and resources that
    can be used to get a greater grasp on `Java` itself and how to use it. Although
    some of the many hints and terms may not make much sense to you know, remember
    that you are building a foundation and resource list to come back to as you run
    into speed bumps in your coding and programming journey. I encourage you to read
    through all of them and try to retain what you can—and come back for the rest
    when you need it.


    I encourage you to follow along with some of the ideas in this book in the `Java`
    program itself. Using this book as a how to guide through your programming experience
    that can be used in tandem to create the most long term memory for learning new
    things. Make sure to try things multiple times to make sure you understand the
    concepts completely and can easily replicate them at any given time, even if you
    need to look up a resource to be able to find exactly what you are looking for.
    Although it is not humanly possible to memorize everything, this book should give
    you general knowledge you can use in order to feel like you have a firm grasp
    on the beginning concepts of `Java`.


    With that, I look forward to you working your way through these chapters. The
    aptitude for learning skills like computer programming are really only inhibited
    by the amount of work you want to put into them. We shall start the adventure
    into programming with `Java` with an entire chapter devoted to the basic terms
    and functions of programming, giving you a firm foundation in the virtual computer
    world.


    ## Chapter 1- What is Programming?

    More than likely, you have heard the term “programming” before in your life, either
    on the internet or in a conversation with someone about technology. If you are
    like me, you may have just smiled and nodded your head, in order to appear that
    you may know what the person is talking about—rather than admitting that you have
    absolutely no firm knowledge of what it entails. When it comes to computer programming,
    `Java` is the language we are looking at within the world of computer programming.
    It is important to have a basic understanding of programming before we can start
    getting into the nitty gritty of what `Java` is.


    Most people can operate a basic graphic interface on a computer by clicking on
    icons or typing in a Word document to prepare a paper for school or a resume to
    gain employment. However, the original computers did not have these graphic icons
    and looked more like blocks and blocks of different texts strung together. In
    order to understand what all of these countless characters on the screen meant,
    people had to learn how to speak the language of the computer. This is what programming
    (or computer programming in formal terms) really boils down to—an understanding
    of how to speak a computer’s language to get it to carry out the tasks you want
    it to do.


    When you program, you always want to remember that although there are language
    rules and structural syntax rules that only allow you to do certain things, you
    can always improve upon the existing if you want to. There may be something that
    works well for others and not so much for you. If for whatever reason the way
    something is done does not make sense to you, look to outside resources in order
    to inform you as to why things are done in a certain way. Within the pages of
    this book, my goal is to give you a pretty good understanding of why and how things
    are done in `Java`; however since this is a beginners guide, there are certainly
    a lack of more intermediate and advanced options and descriptions that you may
    be ready for in a short period of time.


    In order to learn how to speak `Java` to a computer in order to program it, first
    a somewhat in depth idea of what computer programming is invaluable for a new
    programmer in training. The basic activities of computer programming are developing
    an understanding of programming itself, how to generate algorithms, ability to
    understand the computer analysis, idea of how to verify that your algorithms are
    correct and finally to implement (or code) your desired algorithms, in this case,
    `Java`. First here are some key terms that are also helpful to get used to while
    developing your computer programming skills.


    ### Common Helpful Terms and Definitions

    - `Algorithm`: a way in which to use logically or mathematical skills in order
    to solve problems

    - `API`: stands for application programming interface. It is essentially a set
    of rules that allow code to communicate with other websites or software

    - `Code`: also known as source code. It is a collection of computer instructions
    written using a programming language

    - `Code Editor`: a type of text editor program specifically designed for computer
    programmers. Can be used as an application or can be integrated into software
    or a web browser. You essentially are able to check the code you have written,
    like a traditional copy editor in a newspaper or magazine, just computerized!

    - `Compiler`: This is a program that allows for you to take code written by you
    and is translated into what is known as binary (essentially ones and zeros that
    make up the actual machine code)

    - `Concatenation`: this is the ability to combine strings of text together (things
    like two lists)

    - `Control Flow`: this is the computers control over the order that sections of
    coding are run. Essentially it is like rules of how the flow of data moves

    - `Dump`: this is a list of data or something like a text file that is saved in
    the event of your program crashing. It can be very helpful in diagnosing problems
    (why the crash occurred)

    - `Floating point`: basically it is a decimal number where the decimal itself
    is referred to as the floating point (ex 4.56)

    - `Function`: written instructions that obtain a particular result with the ability
    to be used simply by writing them or “calling” them

    '
