- fmt: "\n- **GIT**: this is a portion of distributed software used for revision control\
    \ that is used as a source code management system (also referred to by the acronym\
    \ `SCM`).\n- **GUI**: this acronym stands for General User Interface referring\
    \ to the software you are able to see and interact with (the icons or programs\
    \ you would generally think of i.e. internet browser).\n- **IDE**: this is an\
    \ acronym that stands for integrated development environment. It is slightly more\
    \ advance than your basic code editor.\n- **Interpreter**: this is something that\
    \ allows for translations of the computer coding (machine code) when a program\
    \ is in use.\n- **Iteration**: instructions that are repeated.\n- **JSON**: this\
    \ is a format used to transmit information to and from locations.\n- **Libraries**:\
    \ pre written code that is used to implement common coding features which you\
    \ do not have to write yourself.\n- **Logical Operation**: using Boolean logic\
    \ (`and`, `or` and `not` are the key words when using this type of operative computer\
    \ coding).\n- **Loop**: the use of a piece of code that runs until a condition\
    \ placed on it is filled.\n- **Markup Language**: a language format, like `HTML`,\
    \ that is relatively simple and used to format pages.\n- **Nested**: an instance\
    \ where one thing is contained inside of another.\n- **Pseudo code**: general\
    \ description of the pathway between code and written language. This is code written\
    \ in English that allows for a message to be sent to tell a given piece of code\
    \ what to do.\n- **Recursion**: this occurs when something actually refers to\
    \ itself.\n- **Run time**: this is the time that a program is in use, or running.\n\
    - **Sandbox**: testing ground in which to run a program test.\n- **SDK**: an acronym\
    \ that stands for software development kit. `SDK` is a bundle of software tools\
    \ that allow you to create new applications for specific framework or platforms.\n\
    - **Subroutine**: a portion of code or a function that can be run anywhere inside\
    \ of a program.\n- **Syntax**: the set of rules in a computer language that guide\
    \ usage or correct structure.\n- **Variable**: this is data stored that has the\
    \ ability to be modified by the user whenever they would like to.\n\nNow that\
    \ you have a small dictionary of terms to help you understand key concepts, I\
    \ will now provide more thorough descriptions of how and what programming works\
    \ and what it is. These next few paragraphs will give you an excellent foundation\
    \ of knowledge for what and how to program. This beginner’s guide to understanding\
    \ will have you set on a proper knowledge and explanation of basic programming\
    \ principles.\n\n## What is Programming?\n\nComputer programming is defined as\
    \ a process where one takes a computing problem and turns it into executable computer\
    \ programs. The end goal of programming is to be able to discover instructions\
    \ in a given programming language that will allow for solving a problem or automate\
    \ performing a specific task. In order to fully understand how to execute this\
    \ process, one should have good analytic skills, an understanding of how a computer\
    \ works, be able to understand and generate algorithms and finally implement (or\
    \ code) algorithms of a given programming language. Keep in mind that there is\
    \ more than one language, so the world of programming is much, much larger than\
    \ the scope of this book.\n\nIn addition to these basic principles, I want to\
    \ reiterate how learning computer programming code is really laying the foundation\
    \ for either the system itself or a program to be used in it. When you are programming\
    \ you need to be debugging and testing while maintain the source code. Essentially,\
    \ once you start doing coding for yourself of a program or system, you need to\
    \ be able to problem solve and diffuse the issues with code quickly. This book\
    \ should serve as an excellent beginner’s guide and give you skills you may need\
    \ to trouble shoot issues you may have while starting the process.\n\nAlso with\
    \ programming and coding you are learning how to build and implement the system.\
    \ These terms are often used interchangeably to describe programming of the computer\
    \ itself, creating source code or implementing said programming or coding. Once\
    \ you get more familiar with what programming and coding can do you will learn\
    \ how they really work together in order to create the virtual environment, buy\
    \ also be able to identify the subtle differences.\n\n## How to Generate Algorithms\n\
    \nAlgorithms are important because they allow for us to do things, in the computer\
    \ world, like schedule tasks, design computer algorithms and even solve other\
    \ optimization issues. Essentially, they are something a computer does to instruct\
    \ it to complete a task in an efficient manner. Sometimes people even refer to\
    \ them as recipes because they are similar in the structure and the fact that\
    \ if you find a good way to carry out a certain task, it can be very rewarding\
    \ (much like warm chocolate chip cookies are from a traditional recipe).\n\nAs\
    \ for you and creating your own algorithms, this can be a complex task for any\
    \ computer developer, even more so when you are first starting out. The good news\
    \ is that you probably will not be dealing with high level algorithms for a long\
    \ time. Those algorithms that you will be using are things like creating everyday\
    \ functions or writing loops. Essentially, you are writing an algorithm to complete\
    \ a task for you. There is a simple test list for creating an efficient algorithm\
    \ design:\n\n- You want to use language features that enable you to reduce operations.\n\
