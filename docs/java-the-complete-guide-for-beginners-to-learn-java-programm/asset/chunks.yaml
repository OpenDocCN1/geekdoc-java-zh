- fmt: '

    # Byte


    A `byte` is what can be considered a unit of memory size that is actually a group
    of bits, or binary units, typically eight that is operated on as a unit. What
    does this mean for your usage of Java? Well, within Java it has a minimum value
    of `-128` and a maximum, inclusive value of `127`, as well as has a default value
    of zero. This type of `byte` data is actually used in Java to save space in large
    arrays—most of the time in the place of integers as a `byte` is actually four
    times smaller than an integer. Typically you will see `byte` represented in a
    similar fashion to this—ex `-100 byte`.


    # Short


    Where `byte` data requires full integers, you can use `short` data to contain
    integer values that do not actually need or require the entire width of integer.
    `short` data can, in some cases, pack your `short` variables closely together
    in an effort to save memory consumption. Within Java, `short` data type is 16
    bit data with a minimum values of `-32.768` or maximum value of `32,767` also
    with a default value of `0`. These amounts are actually two simple equations—`(-2^15`
    and `2^15 -1` respectively). This type of data is also good for saving memory
    as a `byte` type data we spoke about in the previous byte section. That being
    said, `short` data can be used in an effort to save memory as the `byte` type
    data as it is two times smaller than an integer. A couple of examples of how you
    may see `short` data are `short s= 20000` or `short r = -100000`.


    # Int


    This type of data, in long, unabbreviated form, is actually referred to as integer
    data. The definition of integer data is that it is a very small subset of mathematical
    integers that can be seen as a group of what is known as binary digits (often
    referred to as `bits`). Computer hardware always wants to have a way for the user
    to represent data (like memory address or processor regester) as an integer In
    terms of its uses in Java, `integer` or `int` data is a 32 bit signed two’s complement
    integer with a minimum value of `-2,147,483,648` and a maximum, inclusive value
    of `2,147,483,647` and has a default value of `0`. These can be represented by
    the equations `-2^31` and `2^31 -1` respectively. Integer data is the most commonly
    used data type for integer values, in fact it is often used as the default type
    of data. If there is a concern about memory, however, you may not want to use
