    What is Programming?


    Computer programming is defined as a process where one takes a computing problem
    and turns it into executable computer programs. The end goal of programming is
    to be able to discover instructions in a given programming language that will
    allow for solving a problem or automate performing a specific task. In order to
    fully understand how to execute this process, one should have good analytic skills,
    an understanding of how a computer works, be able to understand and generate algorithms
    and finally implement (or code) algorithms of a given programming language. Keep
    in mind that there is more than one language, so the world of programming is much,
    much larger than the scope of this book.


    In addition to these basic principles, I want to reiterate how learning computer
    programming code is really laying the foundation for either the system itself
    or a program to be used in it. When you are programming you need to be debugging
    and testing while maintain the source code. Essentially, once you start doing
    coding for yourself of a program or system, you need to be able to problem solve
    and diffuse the issues with code quickly. This book should serve as an excellent
    beginner’s guide and give you skills you may need to trouble shoot issues you
    may have while starting the process.


    Also with programming and coding you are learning how to build and implement the
    system. These terms are often used interchangeably to describe programming of
    the computer itself, creating source code or implementing said programming or
    coding. Once you get more familiar with what programming and coding can do you
    will learn how they really work together in order to create the virtual environment,
    buy also be able to identify the subtle differences.


    How to Generate Algorithms


    Algorithms are important because they allow for us to do things, in the computer
    world, like schedule tasks, design computer algorithms and even solve other optimization
    issues. Essentially, they are something a computer does to instruct it to complete
    a task in an efficient manner. Sometimes people even refer to them as recipes
    because they are similar in the structure and the fact that if you find a good
    way to carry out a certain task, it can be very rewarding (much like warm chocolate
    chip cookies are from a traditional recipe).


    As for you and creating your own algorithms, this can be a complex task for any
    computer developer, even more so when you are first starting out. The good news
    is that you probably will not be dealing with high level algorithms for a long
    time. Those algorithms that you will be using are things like creating everyday
    functions or writing loops. Essentially, you are writing an algorithm to complete
    a task for you. There is a simple test list for creating an efficient algorithm
    design:


    *   You want to use language features that enable you to reduce operations


    *   You want to reduce iterative loop nesting as best as you can


    *   You want to have the ability to define variables outside of loops when it
    is possible


    *   Try to use automatic loop indexing instead of manually doing so


    *   Try to use clever reduction techniques (things like conquer and query optimization)
    in an effort to minimize the size of recursive processes


    Basically, when you are creating or using an algorithm, you want to settle on
    something that not only completes a task and solves a problem—you also want this
    to be done in the most efficient way possible. One way to gain insight to what
    is efficient is to look at the work that has already been done by others. Within
    this book, I will not be able to give you a complete understanding of algorithms
    but I most certainly want to give you a good place to start. I am going to give
    you an examples and, from here, I hope that you will have a good jumping off point
    for your future projects.


    This example is a very simple and somewhat standard example of an algorithm. It
    is often referred to as the “Hello World” program and the following will be an
    example of it. In the next chapters, I will go over how to use and run Java, this
    is just an example of something you may want to input and try (beginner algorithm).


    Sample Algorithm


    public class HelloWorld


    {


        public static void main (String[ ] args)


         {


                System.out.println(“Helloworld!”) ;


         }


    }


    That is a very basic example of an algorithm you may use to start to understand
    how your programming skills can be used. If ever you are trying to get an algorithm
    to function and not having any luck, check something simple like the spacing or
    wrong character or symbol—it usually boils down to a simple error.


    Understanding Computer Analysis'
