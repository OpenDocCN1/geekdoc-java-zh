    to guide him in the creation of Java, These are that 1) it must be threaded, interpreted
    and dynamic, 2) it must be object oriented, simple and familiar, 3) it must be
    secure and robust, 4) it must execute with high performance and 5) it must be
    portable and architecture-neutral.


    These five goals explain why it is such a commonly used language. These are goals
    that allow for users to have a mainstream, useable and effective method for building
    anything from software to a website. User friendly programs are something that
    bring the complexities of computer programming into a more relatable experience,
    especially for new users and those just starting out learning. This is why I personally
    recommend and find it important for beginners to have a firm grasp on. It is very
    widely used and therefore pretty important to know and understand for anyone trying
    to work, or even just have as a hobby, computer programming and coding.


    Now that there is a little background on Java, how do you get the actual program
    running on your own system? Basically, one of the more difficult things to start
    coding Java is acquiring all of the necessary tools to run it. Java is an independent
    platform, which means it will run on just about any operating system. The reason
    for this is a program called Java Virtual Machine (also called Java Runtime Environment).
    In order to start coding in Java, you need to download this program in order to
    do so. You can actually make sure you have this program, as some computers do
    have it installed, or install it through the Java website. There are options for
    many operating systems so you should be good to go once you are able to locate
    it and download it!


    So now you have downloaded (or discovered you had) this program—what does it mean?
    It means that you can run Java on your computer, we will get to the actual program
    to download the coding now. That is known as Java’s Software Development Kit,
    it can be downloaded off the Oracle website (it is the company that owns Java).
    The one you want to use it called Java SE (Standard Edition). For the purposes
    of being able to code, we are going to do so using something called NetBeans,
    so once you find Java SE you will want to find an option that is called JDK 8
    with NetBeans. You are also going to want to go to the NetBeans website and download
    software there. After you have gained access to the software, we are ready to
    code!'
