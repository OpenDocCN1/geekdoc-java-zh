    Essentially once you have all the correct software, you are going to begin to
    write your code in a text editor. If you choose a different option than `NetBeans`,
    you will find the place where you write the source code saved under the file extension
    `.java`. There is a program known as `Javac` that then turns source code into
    Java Byte Code. This process is called compiling, just FYI. After `Javac` has
    completed its task, it creates a new file with the extension of `.class` instead
    of `.java`. That is, if no errors are detected in your code—otherwise you will
    have to go back and find that probably small error you made and fix it. Finally,
    at this point, you can run your code on the Java Virtual Machine! In case it is
    more helpful for you, here are the three basic steps you will use to get your
    code running—first is to create your source code with the `.java` extension, then
    you will use `Javac` to create a file ending in `.class` and third you run the
    complied class.


    Now that you have a greater understanding of how you will create and complete
    actual coding within Java, you should be able to begin the process of creating
    your own codes! Within the suggested `NetBeans` software, it is a great environment
    to teach yourself some of the ins and outs of Java. This chapter really serves
    as a basic description of the software and a very general overview of a way to
    download and begin to use it. Throughout the remainder of this book, I will talk
    more about some of the technicalities that help you understand how and why you
    must do certain things in Java (I.E. learn to speak the language fairly fluently,
    with the knowledge of how things work to back up your fluency of language).


    # Chapter 3- Conditions and Control Flow


    In order to properly be able to utilize Java, it is important to understand the
    rules of the language, like grammar and spelling in the English language. In order
    to properly tell the computer what to do, we need to understand what the terms
    `conditions` and `control flow` really mean within the coding and programming
    world. For conditional statements, we can think of these as if/then statements
    that are used to tell the computer different actions to perform or computations
    to make. As for control flow, it is the order in which instructions, statements
    or function calls of a program are executed or evaluated. You can think of these
    as sort of the rules for sentence structure and the usage of a common, semi colon
    or other literary symbolically represented rule. These are very important in programming
    because computers, unlike humans, do not have deductive reasoning skills. They
    carry out the functions exactly as they are told to do so.


    Both the `conditions` and `control flow` work together in order to create the
    proper environmental flow of data. Without either of these concepts, it would
    be difficult to have Java work in the user friendly manner that it does. A key
    component of a computer is that it is reliable as well as straightforward without
    multiple interpretations of the same thing. Computers do not read minds, they
    execute tasks as their function.


    ## Conditions


    If you have taken an English class in high school or college, you probably have
    heard the term `conditional statement` within that context. Although this is obviously
    a different context than an English classroom, the basic functionality is roughly
    the same. There are two different types of programming languages, functional and
    imperative, Java falls into the imperative category so we will be covering the
    specific conditions of this type of programming.


    When we look at imperative programming languages, we see the term “conditional
    statement” typically used. These essentially are structures having one or more
    conditions that need to be executed if the statement or statements have determined
    to be true, some are also executed if they are false, depending on the statement.
    In Java we see four types of statements that are made. These four statements are
    `if/else` statements, `if` statements, `switch` statements or finally nested `if`
    statements. There are `if` statements that are a `Boolean` expression (`Boolean`
    is when there are two outcomes, like true or false). Whereas `if/else` statement
    occurs when and if `if` statement is followed by an `else` statement when it is
    executed in the code it will return the answer of false. A `nested if` statement
    is something that is two statements with one “nestled” inside of the other; these
    are either `if` or `else` statements. Finally a `switch` statement is one that
    takes a variable and tests it against a list of given variables.


    These statements are all made up of questions that a computer can process and
    execute functions that are, at each of their essences, made up of `Boolean` (or
    two outcome) expressions—except for `switch` statements which compare one variable
    against a list (for example, what is the greatest number (maximum number) in a
    given list. Although multiple statements may be wrapped inside of another with
    the `if` statement format of any kind, it is important to remember that at their
    core they are asking simple two answer questions. As I stated before, computers
    are incapable of inference and this really drives this point to home, these questions
    demand either of two responses, or it will create the third option of an error.


    Next we will address more about `control flow` and how these statements are executed
    in the programming. It will also have some overlap with these conditional statements,
    as they are both methods of communicating (coding) what the computer should do
    and how it should do it.


    ## Control Flow


    As I stated earlier, `control flow` is the manner in which a given program executes
    or evaluates statements. As with any language, there are a lot of rules you have
    to follow in order to communicate properly to another person (in this case, machine).
    It is important to understand the reasoning behind these things in order to properly
    speak the language of the computer. Learning about `control flow`, even if we
    are specifically talking about Java, can easily be applied to other languages,
    although specifics may not be exactly the same. This is another part of building
    the foundation for your programming and coding future so it is important to make
    sure you understand it as well as possible.


    `Control flow` statements are different in each different programming language,
    however they can be categorized by the effect they have. There are five unique
    categories that these statements can fall into. These five statements are:

    1. a set of statements executed only if a condition is met

    2. continuation of execution at a different statement

    3. a set of statements executed zero or more times until a specific condition
    is met

    4. a set of distance statements after they are executed the flow will return

    5. stopping of the program, this will prevent any further execution.


    Now in Java, when we are dealing with something like a common loop control statement;
    specifically we are looking at the change a loop statement makes from its normal
    sequence. Java specifically supports two different types of control statements
    in this scenario, `break` statements and `continue` statements. `break` statements
    are those that terminate the loop (also known as the aforementioned `switch` statement
    I discussed above) in which the actually execution moves on to whatever immediately
    follows the loop/switch. A `continue` statement is one that tells the program
    to essentially skip any code following it and retest the condition.

