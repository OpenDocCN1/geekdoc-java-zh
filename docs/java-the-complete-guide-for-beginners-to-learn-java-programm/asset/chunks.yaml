    I want to reiterate again that all of these categories may not be something you
    are ready to have complete knowledge of at this time. You are learning and definitely
    take your own comfort level into consideration with what you feel is a reasonable
    scope. I encourage you to really study the material in the first few chapters
    and gain a great understanding as to the basic ins and outs of `Java`.


    # Resources


    There are literally thousands of options when it comes to resources to assist
    in your learning process, which can be overwhelming at first. Sometimes it is
    hard to know exactly what will be helpful to you. The first piece of advice I
    would like to give is that you should aim to find resources that address your
    specific problem. It is important to see the problem, or answer, in the title
    of the book or article you are reading. If you use this simple strategy, I guarantee
    that you will have a much easier time answering the questions you may have. This
    isn’t a fool proof strategy but it is a good place to start.


    There are a lot of step by step tutorials that you may want to look at if you
    get caught up in a programming rut. These tutorials can provide you with steps
    that breakdown how and why you should use certain terminology, spacing or even
    data types. They can easily be found by searching for something like a basic `Java`
    walkthrough for beginners. In case any of the content in this book is not quite
    as step by step as you need, there is no shame in needing more help and finding
    something that will help clarify or cement ideas for you.


    We also see lots of people getting help through forums. These are great places
    to access because you literally have thousands of people putting their input into
    whatever topic you are researching. Most of the time, within the programming and
    coding community, people generally want to help newbies because they know what
    it was like to once be in your shoes. Remember that not all advice or coding examples
    may be helpful to you, stick to beginner forums at this point in order to not
    overwhelm yourself with the amount of possibilities out there.


    There are also a ton of articles or magazines you could look to or subscribe to
    in order to assist you with building your knowledge. I think a lot of people disregard
    actual printed media, because we are in such a digital age, however there are
    still many popular magazines out there that can provide up date, useful tips and
    suggestions for you. Among the most popular of these magazines are `Wired` and
    `PC World` that I have found to be helpful in my quest for knowledge. The generally
    write at a level that any beginner can understand and, if they do not, they will
    provide resources for you to understand. Which is a great thing as media is widespread
    and these magazines are meant to be informative to those of all walks of life
    interested in computers and coding and programming. Do not discount online articles
    from major publishers either, you never know where and when there will be useful
    information.


    Also, never discount the power of things like libraries or code editors. Each
    of these types of tools can assist you with finding out code you may want to use
    and want to make sure will not be riddled fill of errors. These resources provide
    you with a plethora of useable code that can assist you with any potential trouble
    source you may run into with your coding and programming. I do caution, however,
    that you fully understand the code, in case there are any issues with it you can
    figure where and how to address them.


    Another great place to find resources in YouTube videos. These videos are ways
    for you to watch programming examples in more of a real life scenario that may
    be of great assistance to you. Although it is great to read and have the information,
    the beauty of a video is that you can visually see what is expected of you and
    how another person does it. No matter how hard I try in this book, I am unable
    to give you that kind of demonstration, so that is a great place to utilize `YouTube`.
    When it comes to the quality of videos, just like with finding any resource, it
    can be a bit of sifting through unhelpful videos in order to find ones that you
    can actually use. My advice to you is similar to that of a search on `Google`
    or something, make your search description as close to the content you would like
    to see. This enables the results to, hopefully, contain those words together.
    Think of the search function in terms of the statements we have talked about,
    you need to specify the data you want in order for the computer to return the
    results you want. Once again, remember that computers do not infer meaning like
    humans can—they are straightforward to a fault.


    Remember also to use your both your own brain and perhaps friends that also are
    interested in computer programming and coding in order to brainstorm solutions
    to potential issues. Never discount yourself and your own ability to look for
    answers in simply trying out different solutions within your own sandbox to play
    with coding and programming in. If at first you don’t succeed, try again!


    # Conclusion


    The aim of this book was to give you a how to guide for what and how `Java` programming
    is and how you can learn to apply it in your own computer programming skill tool
    box. Although this is a beginner’s guide, I have given you a great general set
    of terms, rules and examples of how `Java` works. Through the pages of this book,
    I hope you have been able to get easy to understand terminology, ideas and methodologies
    you will be able to take with you as your continue to learn more.


    From the first chapter where I outlined the basics of computer programming, the
    goal of my book was to make the material something anyone could understand. The
    aim of my writing was to ensure that even a total novice could understand the
    basics and be able to (even if you never use them) understand a little more about
    how computers actually function. As technology, and computers in particular, are
    a huge part of our daily lives, I feel strongly that we should understand them
    more to make our own lives easier. When it comes to programming and coding, it
    may not be something everyone has an affinity to as a hobby—but it really is quite
    enjoyable once you begin to speak the language.


    As with learning new anything, particularly a language, there is always a learning
    curve. If you have read this book and still feel weary of the programming world,
    maybe take a few days and just reflect on the content and come back and read it
    again. I always use this tactic and it typically makes more sense if you let the
    content marinate for a while. For those of you that have fully grasped the content
    on the first go round, more power to you!


    It is always important to remember that you cannot remember everything, all the
    time, and there are great resources out there for you to refer to when you may
    not be able to recollect something. I hope that this will be a book you will come
    back in the future to get a greater understanding of the beginner concepts we
    can sometimes forget as we get into more advanced programming techniques or situations.

