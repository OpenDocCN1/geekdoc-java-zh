    本质上，一旦你拥有了所有软件，就会开始在文本编辑器中编写代码。如果你选择的是 `NetBeans` 以外的选项，你会发现编写源代码的地方被保存为 `.java`
    扩展名的文件。有一个名为 `Javac` 的程序，它会将源代码转换为 Java 字节码。这个过程被称为编译，仅供你参考。在 `Javac` 完成任务后，它会创建一个扩展名为
    `.class` 的新文件，而不是 `.java`。也就是说，如果你的代码中没有检测到任何错误——否则你将不得不回回去寻找并修复你可能犯的那个微小错误。最后，到这一步，你就可以在
    Java 虚拟机上运行你的代码了！如果这对你更有帮助的话，这里是运行代码将将用到的三个基本步骤——首先创建带有 `.java` 扩展名的源代码，然后你将使用
    `Javac` 创建一个以 `.class` 结尾的文件，最后你运行编译后的类。


    现在你已经对如何在 Java 中创建和完成实际编码有了更深入的理解，你应该可以开始创建自己的代码的过程了！在建议的 `NetBeans` 软件中，它是自学
    Java 某些门道的绝佳环境。这一章实际上是对该软件的基础性描述，以及关于如何下载和开始使用的通用概述。在本书的剩余部分中，我将更多地讨论帮助你理解在 Java
    中必须这样做以及为什么要做的某些技术的技术细节（即：学会流利地使用这种语言，并用事物运行原理的知识来支撑你的流利度）。


    # 第 3 章 - 条件与控制流


    为了能够正确利用 Java，理解语言的规则非常重要，就像英语中的语法和拼写一样。为了正确地告诉计算机做什么，我们需要理解编码和编程世界中`条件（conditions）`和`控制流（control
    flow）`这些术语的具体含义。对于条件语句，我们可以将其看作“如果/那么”语句，用于告诉计算机执行不同的动作或进行计算。至于控制流，它是程序中的指令、语句或函数调用被执行或评估的顺序。你可以将这些看作是句子结构规则，以及常用分号或其他文学符号表示规则的用法。这些规则在编程中非常重要，因为计算机与人类不同，它们没有演绎推理能力。它们完全按照指令来执行功能。


    `条件`和`控制流`共同工作，以创建合适的数据环境流。如果没有这两个概念中的任何一个，Java 就很难以这种用户友好的方式运行。计算机的一个关键特性是它是可靠且直接的，不会对同一事物产生多种解释。计算机不读心，它们执行任务是其功能。


    ## 条件


    如果你在高中或大学上过英语课，你可能在该背景下听过`条件语句（conditional statement）`这个术语。尽管这与英语教室的语境显然不同，但基本功能大致相同。编程语言有两种不同的类型：函数式和命令式，Java
    属于命令式类别，因此我们将涵盖这种类型编程的特定条件。


    当我们观察命令式编程语言时，通常会看到“条件语句”这一术语。这些语句本质上是具有一个或多个条件的结构，如果语句或多个语句被确定为真，则需要执行；取决于语句的情况，某些在判定为假时也会执行。在
    Java 中，我们可以看到四种语句。这四种语句是 `if/else` 语句、`if` 语句、`switch` 语句或最后的嵌套 `if` 语句。存在带有 `Boolean`
    表达式的 `if` 语句（`Boolean` 是当有两个结果时，比如真或假）。而 `if/else` 语句发生在 `if` 语句后面跟着一个 `else`
    语句时，当它在代码中执行时会返回假的结果。`嵌套 if` 语句是指两个语句中的其中一个“嵌套”在另一个内部；这些要么是 `if` 或 `else` 语句。最后，`switch`
    语句接收一个变量并针对一组给定的变量对其进行测试。


    这些语句都由计算机可以处理的问题组成，并执行功能，这些功能在每个本质上都是由 `Boolean`（或双结果）表达式组成的——`switch` 语句除外，后者将一个变量与列表进行比较（例如，给定列表中的最大数字（最大值）是多少）。尽管多个语句可以用任何形式的
    `if` 语句格式封装在另一个语句内部，但重要的是记住，它们的核心是在问一个简单的二一问题。正如我之前所说的，计算机不具备推理能力，这有力地强调了这一点：这些问题要么要求两种响应之一，要么就会产生第三种选择——即错误。


    接下来我们将介绍更多关于`控制流`以及这些语句在编程中是如何执行的。它与这些条件语句也有一些重叠，因为它们都是向计算机通信（编码）它应该做什么以及应该怎么做的方法。


    ## 控制流


    正如我之前提到的，`控制流`是给定程序执行或评估语句的方式。与任何语言一样，你必须遵循许多规则才能与另一个人（在这种情况下是机器）进行适当的通信。理解这些事情背后的逻辑对于正确地使用计算机语言至关重要。学习`控制流`，即使我们专门谈论
    Java，也可以很容易应用到其他语言，尽管具体细节可能不完全相同。这是构建你编程和编码未来的另一个部分，因此确保你尽可能地理解它非常重要。


    `控制流`语句在每种编程语言中都不同，但可以根据它们产生的影响进行分类。这些语句可以属于五种独特的类别。这五种语句是：

    1. 仅在满足条件时执行的一组语句

    2. 跳转到另一个语句继续执行

    3. 在满足特定条件之前执行零或多次的一组语句

    4. 执行一组语句后，流将返回

    5. 停止程序，这将防止进一步的执行。


