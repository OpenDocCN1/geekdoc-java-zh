    # Chapter 4- Object Oriented Java


    In this type of an object oriented language, which is what Java can be described
    as, you are looking at a program paradigm that is really based on the concept
    of “objects”. These objects can contain data, in the form of fields (often called
    attributes) and code that is in the form of procedures (often referred to as methods).
    One of the features of an object is that the object’s procedures have the ability
    to access and often modify the data fields of a given object they are associated
    with.


    As Java is an object oriented language, there are fundamental concepts that it
    utilizes in order to fall into this class of language. The concepts of classes
    and objects are of particular importance and what we will discuss and analyze
    in this chapter. In terms of Java, an object has both states and behaviors. When
    we talk about class in this programming context, we are looking at the outline
    that allows for a description of the state or behavior that the object supports.
    Essentially, class is what you use to define what the object is. Now let’s get
    a little clearer understanding of what each of these things are, starting with
    objects.


    When we think about “real world” objects, we probably think about things like
    dogs, other people or cars. Each of these objects we think of does have a state
    as well as a behavior, just as it does within Java. If we want to look at a human,
    for example, they have different states (names, skin colors, and ethnicity) and
    they also have behavior (speaking, working or sleeping). Each of these states
    and behaviors can be thought of as different parts of the same person. In fact,
    every person has a different set of behaviors and states, just as with most objects
    we interact with on a daily basis.


    In comparison with real world objects, there can be very similar characteristics
    in some instances. The state of software object is stored within the fields and
    behavior is shown in the methods. So basically, methods are internally operating
    both the singular object and allowing the communication to happen via a method
    between objects. Just as with the human example, we have internal communication
    happening within ourselves and we use these internally stored methods to gain
    access to other objects (whether that be a car, computer or another human).


    So what about class? It can be defined as the blueprint that individual objects
    are created from. There are three different types of variables that any class
    can contain. These variables are local variables, instance variables and class
    variables. Local variables are those that are localized, or within your method.
    They are initialized and declared locally—or within the method. When the method
    is completed, the variable will them be destroyed. Instance variables are those
    that inside of a class but actually are outside of methods. They occur when the
    class itself is instantiated. The instance variables have the ability to be accessed
    from any blocks or constructors of the class they are a part of. The last variable
    type, class variables, are those that, as the name suggests, are within the class.
    They operate outside of any method however they can use methods in order to access
    values.


    What do we do if we would like to create an object from a class itself? There
    are actually three different steps that will allow us to do just that. These steps
    are declaration, initialization and instantiation. A variable declaration is when
    a variable has both an object type with a name for the variable. An instantiation
    is the `new` keyword that you would use to create a given object. Finally initialization
    is what is used to call a given constructor and has the ability to initialize
    the new object. For example, you could create a person (object) in the human class
    and then name the puppy Spot, giving name to the constructor and creating a new
    object. Let me give you a little more clarification on constructors in the next
    paragraph.


    When we look more into classes, we have to also talk about constructors. Constructors
    are a bit of code allowing you to create a given object from a class. Constructors
    are a necessity in every class. If you do not include one, the Java complier actually
    creates a default constructor for the class at hand. You can always be certain
    that if you create an object, one or more constructors will be invoked for that
    object. Technically constructors should really have a name that is the same as
    the class they are in; however, classes can have more than one given constructor.
    For example, if you had a class known as `puppy`, the constructors could be `lab`
    or `bulldog`—or like the example in the previous paragraph of a name like `Spot`.
    Now let us talk a little bit about some rules that are needed to be followed when
    you are declaring classes.


    ## Source File Declaration Rules


    These source file declaration rules are actually essential when you are doing
    things with your different source file statements or import statements. They are
    also important when you are declaring given classes (which is a Java class file
    with the `.class` extension).


    - You can only have one `public` class per source file

    - The `package` statement should always appear first inside of a `package`

    - One source file is able to have multiple nonpublic classes

    - When dealing with `import` statements, you always need to remember that statements
    are written sandwiched between both the class declaration and the package statement.
    If you do not have any `package` statement the very first line in the given source
    file should be the `import` statement

    - If you have both source files and public class files you should have them both
    be the same name. They should also be appended by `.java` at the end of the file.
    Example- `administrator.java`

    - When you have both `import` and `package` statements, the classes they are associate
    with will be applicable fully in any source file that you using


    # Chapter 5- Data Structures


    Within Java there are certain types of data that are used and defined by the program.
    I am sure that, in some form or another, you have heard of data—it could be the
    gigabytes of megabytes of data used by your cell phone or maybe you have a backup
    for your computer that stores data in terabytes. Each of these different terms
    tells you how much data your device or backup can support and use.


    Java actually can support eight different primitive data types. These data types
    are `byte`, `short`, `integer` (referred to as `int`), `long`, `float`, `double`,
    `Boolean` and `char`. Now that you have heard these types of data, let us break
    them down and tell you what they mean and what they can do for a user.


    ### Byte

