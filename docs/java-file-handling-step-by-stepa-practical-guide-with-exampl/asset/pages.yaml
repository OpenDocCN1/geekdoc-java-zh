  md: 'When dealing with file streams, the reading process involves opening a stream
    directed at a file and then pulling data from it. Each read operation retrieves
    a portion of the file''s contents until the end of the file is reached. Similarly,
    writing to a file opens a stream that directs data to a file and then sending
    data through that stream. These operations are performed sequentially; the system
    processes a continuous stream of bytes or characters, ensuring that data is transferred
    reliably from the storage medium to the application and vice versa.


    Handling file streams requires attention to resource management. Streams maintain
    a connection to relatively scarce system resources, such as file descriptors.
    Failure to close streams after use can result in resource leaks, which may eventually
    exhaust system limits and degrade performance or stability. Java offers structured
    methods, such as the try-with-resources statement, which ensures that streams
    are automatically closed when they are no longer needed. The following example
    demonstrates how a FileInputStream can be used within a try-with-resources block
    to ensure the stream is closed even if an exception occurs:


    In the code above, a FileInputStream is created to read from "example.txt". The
