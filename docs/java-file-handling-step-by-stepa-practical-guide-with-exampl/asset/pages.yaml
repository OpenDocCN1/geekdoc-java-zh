    absolute path specifies the complete directory address from the root of the file
    system to the target file or directory, while a relative path defines the location
    in relation to another, typically the current working directory. Java uses these
    file path concepts to provide a standardized approach for file manipulation, enabling
    applications to access, read, and write files reliably across different platforms.


    Java initially provided file handling through the java.io package, which included
    the Class for representing file and directory pathnames. However, one of the main
    drawbacks of the older approach was the inconsistency and limited functionality
