  md: 'At the core of the Java IO package are streams, which represent channels through
    which data can be transmitted. Streams are one of the most fundamental abstractions
    in Java''s approach to input and output. They provide a standardized way to handle
    data, regardless of its origin or destination. Streams are divided into two major
    categories: byte streams and character streams. Byte streams, which are based
    on the InputStream and OutputStream classes, are designed for raw binary data.
    This is particularly useful for reading and writing files that contain binary
    content, such as images or executable files. Character streams, on the other hand,
    are built around the Reader and Writer classes. These classes handle character
    data and are the preferred choice when working with textual data because they
    automatically handle character encoding.


    The InputStream and OutputStream classes serve as the base classes for all byte-oriented
    input and output operations. Every subclass of InputStream adheres to a common
    protocol involving reading blocks of bytes from a data source. Similarly, subclasses
    of OutputStream are responsible for writing bytes to a destination. These abstractions
    allow Java developers to perform low-level I/O operations in a consistent manner.
    For instance, FileInputStream and OutputStream are two subclasses that provide
    mechanisms to read and write to files, respectively. These classes are essential
    when the task at handling binary data without any translation or transformation.


    Character streams provide a more specialized abstraction for text-based data.
    The Reader and Writer classes are abstract classes that form the foundation of
    all character-based I/O. Classes such as FileReader and FileWriter offer means
    to read from and write to files that contain text. Unlike byte streams, character
    streams are designed to interpret the bytes in a file as characters according
    to a specified character encoding scheme. This distinction is critically important
    when dealing with internationalization or working with files where the text data
    must be rendered correctly according to locale-specific rules and standards.


    Buffered streams are an enhancement over the basic streams in the Java IO package.
    The BufferedInputStream and BufferedOutputStream classes, along with their character
    stream counterparts BufferedReader and BufferedWriter, wrap around existing stream
    objects to improve performance. These buffered streams internally maintain a buffer—block
    of memory that temporarily holds data. When reading from a file, buffered streams
    minimize the number of physical I/O operations by reading larger chunks of data
    at once. Conversely, when writing to a file, these classes accumulate data in
    memory and write in larger, more efficient blocks. This buffering mechanism generally
    enhances the performance of applications, especially when dealing with large data
    files or frequent read/write operations are required.


    An example that demonstrates the utility of both basic and buffered streams is
    the process of reading a text file line by line. The FileReader, in conjunction
    with Buffered,'
