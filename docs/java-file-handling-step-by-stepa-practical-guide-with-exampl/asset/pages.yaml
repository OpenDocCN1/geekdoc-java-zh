    # 5.2 Manipulating Paths with Java NIO


    The NIO framework introduces significant improvements over its predecessor by
    providing a modern, flexible, and powerful mechanism for handling file paths.
    The Path interface in the java.nio.file package encapsulates a hierarchical path
    structure. Developers can create, modify, and inspect paths using an extensive
    set of methods. This section explains how to work with the Path class using concrete
    examples, illustrating common operations such as creation, normalization, resolution,
    and relativization of paths.


    The primary method for creating a Path instance is through the static method in
    the Paths class. To generate a Path, a developer can use the method Paths.get(
    ), passing either a single path string or multiple strings that represent distinct
    path elements. The resulting Path object encodes information such as the directory
    hierarchy, the file or directory name, and platform-specific separators. For instance,
    in a UNIX-like system, the forward slash (/) is used as a separator, while in
    Windows, the backslash (\) is typical.


