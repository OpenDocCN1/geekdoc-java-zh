    absolute and relative paths. An absolute path provides the complete directory
    location starting from the root of the file system. A relative path, contrast,
    denotes a location relative to the current working directory. Converting between
    these two states is straightforward in Java NIO. The Path method toAbsolutePath()
    transforms a relative path into an absolute one based on the current system, a
    critical step when file operations require a full path reference.


