    \ 封装了 `FileWriter` 并允许高效地写入字符数据。通过在缓冲区中累积字符序列，`BufferedWriter` 最小化了文本输出的写入次数。下面是使用\
    \ `BufferedWriter` 的示例：\n\n```java\nimport java.io.BufferedWriter;\nimport java.io.FileWriter;\n\
    import java.io.IOException;\n\npublic class BufferedTextWriter {\n    public static\
