    \ 的典型用法涉及使用一个有效路径初始化对象。一旦文件打开，流就会提供读取单个字节或字节数组的方法。`read` 方法返回一个整数，操作通常在循环中执行，直到返回文件结束指示符（-1）。使用\
    \ `FileInputStream` 的一个关键方面是适当的资源管理，这需要细致的处理。下面是一个代码示例，演示了一个简单的按字节读取文件的过程：\n\n\
    ```java\nimport java.io.FileInputStream;\nimport java.io.IOException;\n\npublic\
    \ class BasicByteReader {\n    public static void main(String[] args) {\n    \
    \    InputStream fis = null;\n        try {\n            fis = new FileInputStream(\"\
