    # 3.1 Basic Reading Methods


    Java provides a versatile input/output (IO) infrastructure that allows for reading
    data from files using various types of streams. In the context of file input,
    streams are abstract representations that enable programs to read raw data from
    files with minimal dependency on the underlying file system. This section explores
    several methods available in Java for reading files, focusing especially on techniques
    that employ stream classes. Understanding these methods is fundamental for developing
    reliable applications that require direct interaction with file.


    File reading in Java typically involves two approaches: reading bytes and characters.
    The byte stream approach uses classes such as FileInputStream, which is designed
    for reading raw binary data. This method is suitable for files such as images,
    audio files, or any file where a byte-by-byte reading is required. The character
    stream approach, on the other hand, focuses on converting byte sequences into
    characters using a predefined or specified encoding. Classes such as FileReader
    fall into this category and are more appropriate when the file content is textual.
    The fundamental difference between these approaches lies in their treatment of
    data: byte streams do not process any encoding, whereas character streams are
    inherently encoding-aware. This distinguishes their usage and application in real-world
    scenarios, making it important for developers to choose the method that best aligns
    with their file''s content.


    A typical use of FileInputStream involves initializing an object of this class
    by providing a valid path. Once the file is open, the stream offers methods to
    read individual bytes or arrays of bytes. The read methods return an integer or
    the actual array of bytes retrieved from the file, and the operations are usually
    performed in a loop until the end-of-file indicator is returned. A key aspect
    of using FileInputStream is the proper management of resources, necessitating
    careful handling of the file''s closing operation either manually or by using
    constructs that automate resource management. A typical code snippet demonstrates
    a simple byte-by-byte file reading process is presented below.


    ```

    import java.io.FileInputStream;

    import java.io.IOException;

