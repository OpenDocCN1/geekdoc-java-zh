    \ `BufferedReader` 和 `BufferedWriter`。这些类特别适用于文本数据，因为它们促进了字符、数组和行的高效读写。例如，`BufferedReader`\
    \ 包含一个名为 `readLine()` 的方便方法，它可以从文件中读取整行文本，而不需要开发者显式处理单个字符的转换。\n\n考虑以下使用 `BufferedReader`\
