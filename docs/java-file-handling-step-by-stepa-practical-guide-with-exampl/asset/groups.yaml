  mdcn: "\n在这个示例中，`BufferedInputStream` 封装了用于 \"largeFile.dat\" 文件的 `FileInputStream`。与直接从文件每次读取一个字节相比，缓冲方法减少了文件访问的次数。操作系统的调用频率有所降低，从而提升了整体性能。\n\
    \n对于数据写入，`BufferedOutputStream` 以类似的方式工作，在将数据提交到文件之前先将其在内部缓冲区中累积。这种方法在应用程序需要多次写入操作时特别具有优势。通过延迟写入，直到缓冲区填满或刷新缓冲区（flush），减少了与每个单独写入操作相关的开销。下面的代码示例了如何使用\
    \ `BufferedOutputStream` 写入文件：\n\n```java\nimport java.io.BufferedOutputStream;\n\
    import java.io.FileInputStream;\nimport java.io.IOException;\n```\n\n```java\n\
    public class BufferedFileWriter {\n    public static void main(String[] args)\
    \ throws {\n        byte[] data = \"Buffered streams in Java improve performance\
