    \ 语句通过将资源声明与自动关闭结合，简化了这一过程，只需要极少的额外语法。\n\n考虑一个打开文件读取的示例。使用传统的 `try-catch-finally`\
    \ 块，资源管理涉及在 `finally` 块中手动关闭 `BufferedReader`：\n\n```\nBufferedReader reader =\
