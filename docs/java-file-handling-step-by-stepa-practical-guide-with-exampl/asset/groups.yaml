    # 2.1 File Streams


    File streams form a fundamental component within Java file handling by providing
    a unified interface for reading and writing to files. In Java, a stream is an
    abstraction that represents a continuous flow of data. File streams, in particular,
    connect your program to files stored on disk. They allow the application to perform
    input and output operations in a sequential manner, reading or writing one byte
    or character at a time. This approach abstracts the complexities of unifying file
    devices and operating systems, thereby simplifying file operations for developers.


    At its core, a stream is an open channel through which data can be transferred
    between a file and a Java program. When a file is established, the program either
    gains access to the data contained within the file (in case of reading) or obtains
    a conduit through which data can be stored (in case of writing). The operating
    system handles the management of the file, while the Java runtime manages the
    conversion between the program''s data types and the raw bytes stored in the file.


    In the Java programming environment, reading or writing to files typically involves
    creating an instance of a stream class. These classes are designed to provide
    a consistent interface for file operations, ensuring that data transfer occurs
    in an efficient and controlled manner. For example, the FileInputStream is commonly
    used to read raw byte data from a file. Conversely, the FileOutputStream is used
    to write raw byte data to a file. These classes form the basis of file handling
    in Java, allowing programmers to manipulate binary data directly.


    A critical role of file streams is the handling of different data types. Files
    can contain various forms of data, ranging from plain text to multimedia content.
    Byte streams, which work with raw binary data, are particularly suited for non-text
    data such as images and audio files. On the other hand, character streams are
    intended for reading and writing text data. They handle encoding and decoding,
    translating binary data to character representations based on a specified character
    set. By doing so, character streams facilitate text processing, enabling developers
    to work naturally with strings and other textual formats.'
