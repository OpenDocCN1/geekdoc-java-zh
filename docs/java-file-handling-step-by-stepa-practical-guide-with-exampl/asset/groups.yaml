  mdcn: "\n以及更新元数据。本节提供了访问和修改元数据的技术的详细说明，并展示了适合初学者的相关示例。\n\n元数据可以大致分为几类。基本属性包括文件大小、创建时间、最后修改时间和最后访问时间。此外，还存在特定文件的属性，例如可执行、可读或可写权限。操作系统进一步扩展了这些属性，包含\
