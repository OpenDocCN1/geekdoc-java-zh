    \ are accessed via attribute views, which map a group of related metadata to a\
    \ type interface. One of the most common views is BasicFileAttributes, which supplies\
    \ a standardized interface for file metadata.\n\nTo read file metadata, the File.readAttributes\
    \ method returns an instance of BasicFileAttributes when provided with a specific\
