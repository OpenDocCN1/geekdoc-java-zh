    \ `data\\files\\example.txt`。此示例强调了 API 如何在没有开发者干预的情况下无缝管理文件分隔符的差异。\n\n跨平台兼容性的另一个方面是一致地处理绝对路径和相对路径。虽然“绝对”和“相对”的含义可能根据操作系统文件系统的结构略有不同，但\
    \ Java NIO 提供了 `toAbsolutePath()` 方法将相对路径转换为绝对路径。\n\n```java\nimport java.nio.file.Path;\n\
    import java.nio.file.Paths;\n\npublic class AbsolutePathExample {\n    public\
    \ static void main(String[] args) {\n        // 创建相对路径\n        Path relativePath\
    \ = Paths.get(\"config\", \"settings.properties\");\n        // 将相对路径转换为绝对路径\n\
    \        Path absolutePath = relativePath.toAbsolutePath();\n        System.out.println(\"\
    Absolute Path: \" + absolutePath);\n    }\n}\n```\n\n规范化路径是跨平台开发中的另一个重要功能。`normalize()`\
    \ 方法会移除路径中的冗余元素，例如代表当前目录的 `.` 或代表父目录的 `..`。这在文件路径根据用户输入或动态生成时至关重要。\n\n```java\n\
    import java.nio.file.Path;\nimport java.nio.file.Paths;\n\npublic class NormalizePathExample\
    \ {\n    public static void main(String[] args) {\n        // 创建包含冗余元素的路径\n  \
    \      Path rawPath = Paths.get(\"data\", \"files\", \"..\", \"example.txt\");\n\
    \        // 规范路径\n        Path normalizedPath = rawPath.normalize();\n       \
    \ System.out.println(\"Normalized Path: \" + normalizedPath);\n    }\n}\n```\n\
