    # 6.3 Using Try-with-Resources


    try-with-resources statement is a language feature introduced in Java 7 that simplifies
    resource management when performing file operations. It is designed to ensure
    that each resource, typically an object that implements the AutoCloseable interface,
    is closed automatically after the program has finished it. This mechanism significantly
    reduces the likelihood of resource leaks, which may occur if a file stream or
    other I/O resource is not properly closed.'
