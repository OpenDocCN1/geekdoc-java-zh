    \ reading file metadata using the BasicFileAttributes view.\n\n```\nimport java.nio.file.Path;\n\
    import java.nio.file.Paths;\nimport java.nio.file.Files;\nimport java.nio.file.attribute.BasicFileAttributes;\n\
