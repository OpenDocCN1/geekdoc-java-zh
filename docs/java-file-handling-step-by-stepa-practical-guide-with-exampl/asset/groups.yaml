    \ `try-catch` 块来管理 `IOException`。正确处理这些异常对于构建健壮的应用程序至关重要。获取资源、处理资源并释放资源的模式在两种方法中是通用的。许多\
    \ Java 程序通过使用 `try-resources` 来简化这一点。虽然上面的示例没有使用 `try-resources`，但理解手动资源管理对于掌握其机制至关重要。\n\
    \n开发者在选择 FileInputStream 和 FileReader 时也应考虑大小和系统性能。对于小文件，逐个读取是可以接受的。但对于大文件，迭代块会导致性能瓶颈。在这种情况下，建议采用缓冲区方法。缓冲区流（如\
