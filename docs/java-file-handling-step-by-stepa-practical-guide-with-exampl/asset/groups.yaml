    \n### 3.1 读取方法\n\nJava 提供了一套通用的输入/输出（IO）基础设施，允许使用各种类型的流从文件中读取数据。在文件输入语境下，流是抽象的表示，它使程序能够在对底层系统依赖最少的情况下从文件中读取原始数据。本节探索了\
    \ Java 中可用于读取文件的几种方法，特别关注了相关技术。\n\nJava 中的文件读取通常涉及两种方法：读取字节和字符。字节流方法使用如 `FileInputStream`\
