    \ 4.2 目录管理技术\n\n在构建与文件系统交互的应用程序时，管理目录是 Java 编程中的一项基本任务。`java.io.File` 类提供了用于创建、删除和列目录目录的方法。本节详细解释了这些操作，并配有技术说明和说明性代码示例，演示了\
    \ Java 中目录管理的过程。\n\n要考虑的第一操作是创建目录。`File` 类区分了创建单个目录和创建目录树。要创建单个目录，可以使用 `mkdir()`\
    \ 方法。该方法尝试创建在实例化 `File` 对象时提供的路径所对应的目录。如果操作成功，`mkdir()` 返回 `true`。相反，如果由于父目录不存在或权限不足而无法创建目录，它将返回\
    \ `false`。在必须设置完整目录路径（包括不存在的中间目录）的场景下，应该使用 `mkdirs()` 方法。该方法会根据需要递归创建整个文件路径。\n\
    \n```java\nimport java.io.File;\n\npublic class CreateDirectoryExample {\n   \
    \ public static void main(String[] args) {\n        // 创建单个目录\n        File singleDir\
    \ = new File(\"exampleDir\");\n        if (singleDir.mkdir()){\n            System.out.println(\"\
    单级目录创建成功：\" + singleDir.getName());\n        } else {\n            System.out.println(\"\
    创建单目录失败或该目录已存在\");\n        }\n\n        // 创建目录树\n        File dirTree = new\
    \ File(\"parentDir/subDir1/subDir2\");\n        if (dirTree.mkdirs()){\n     \
    \       System.out.println(\"目录树创建成功：\" + dirTree.getName());\n        } else\
    \ {\n            System.out.println(\"创建目录树失败或该目录已存在\");\n        }\n    }\n}\n\
    ```\n\n上面的代码演示了 `mkdir()` 和 `mkdirs()` 方法。在第一个示例中，创建了一个单个目录 `exampleDir`。第二个示例显示了目录树的创建，通过调用\
    \ `mkdirs()` 确保所有不存在的父目录都被创建。\n\n创建之后，有效的管理通常需要列出目录内容的能力。Java 提供了几种方法来实现此目标。`File`\
    \ 类的 `list()` 方法返回一个 `File` 对象所代表目录内部的文件和目录的名称字符串数组。或者，`listFiles()` 方法返回一个包含发现的每个文件或目录的\
    \ `File` 对象数组。每个方法有不同的用途；`list()` 适用于获取名称，而 `listFiles()` 则允许对这些对象进行进一步交互，从而实现检查每个条目是文件还是子目录等操作。\n\
    \n```java\nimport java.io.File;\n\npublic class ListDirectoryContents {\n    public\
    \ static void main(String[] args) {\n        File directory = new File(\"exampleDir\"\
    );\n\n        // 使用 list() 方法列出\n        String[] items = directory.list();\n\
    \        if (items != null) {\n            System.out.println(\"使用 list() 列出的\
    \ \" + directory.getName() + \" 内容:\");\n            for (String item : items)\
    \ {\n                System.out.println(item);\n            }\n        } else\
    \ {\n            System.out.println(\"目录为空或不存在.\");\n        }\n\n        // 使用\
    \ listFiles() 方法列出\n        File[] files = directory.listFiles();\n        if\
    \ (files != null) {\n            System.out.println(\"使用 listFiles() 列出的 \" +\
    \ directory.getName() + \" 内容:\");\n            for (File file : files) {\n  \
    \              if (file.isDirectory()) {\n                    System.out.println(\"\
    [目录] \" + file.getName());\n                } else {\n                    System.out.println(\"\
    [文件] \" + file.getName());\n                }\n            }\n        } else {\n\
    \            System.out.println(\"目录为空或不存在.\");\n        }\n    }\n}\n```\n\n\
    在示例中，如果 `exampleDir` 存在，代码将两次打印其内容：第一次是来自 `list()` 的字符串数组，第二次是来自 `listFiles()`\
    \ 的 `File` 对象数组。随后，通过 `isDirectory()` 方法检查其是否为目录来识别每个文件或子目录。当在获取目录列表后需要额外的文件操作时，这种技术非常有用。\n\
    \n目录删除是目录管理的另一个关键方面。Java 的 `File` 类包含一个 `delete()` 方法，尝试删除由 `File` 对象表示的文件或目录。当该方法应用于目录时，只有在目录为空时删除才会成功。因此，在删除包含文件和子目录的目录时，必须递归删除其内容或使用替代方法清理目录。递归方法通常用于此目的，其中遍历目录树并删除每个文件。\n\
    \n```java\nimport java.io.File;\n\npublic class DeletedRecursively {\n    public\
    \ static void main(String[] args) {\n        File directory = new File(\"parentDir\"\
    );\n        if (deleteDirectory(directory)) {\n            System.out.println(\"\
    目录删除成功.\");\n        } else {\n            System.out.println(\"删除目录失败.\");\n\
    \        }\n    }\n\n    // 递归删除目录及其所有内容\n    public static boolean deleteDirectory(File\
    \ dir) {\n        if (dir.isDirectory()) {\n            File[] children = dir.listFiles();\n\
    \            if (children != null) {\n                for (File child : children)\
    \ {\n                    // 递归删除子节点\n                    if (!deleteDirectory(child))\
    \ {\n                        return false;\n                    }\n          \
    \      }\n            }\n        }\n        // 删除目录或文件；返回成功状态\n        return\
    \ dir.delete();\n    }\n}\n```\n\n递归代码首先检查 `File` 对象是否表示目录。如果是，方法通过 `listFiles()`\
    \ 获取所有子节点，并对每个子节点递归调用 `deleteDirectory()`。当对象不再是目录（即它表示文件）时，将调用 `delete()` 方法。这种过程确保了即使是嵌套目录和文件被正确移除。递归方法返回一个布尔值，指示删除最终是否成功。\n\
