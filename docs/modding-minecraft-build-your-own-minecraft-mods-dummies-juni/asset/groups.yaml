  - '[PAGE 72]


    # PROJECT 3 MONSTER ARENA


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_72_0.png)


    MONSTER ARENA IS A MULTILEVEL MINECRAFT MINIGAME WHERE THE PLAYER IS IN A LARGE
    ARENA WITH MONSTERS THAT SPAWN AROUND A MELON CUBE BLOCK. The player''s goal is
    to reach the melon cube without being attacked by the monsters. Every time the
    player reaches the melon cube, he moves on to the next level, which has more monsters
    that are harder to beat.


    In this project you make a Monster Arena mod. Then you can play Monster Arena
    with your friends and see who can defeat the most monsters!


    # DRAW THE GAMEPLAY LOOP


    Draw the gameplay loop (see the next page) for the Monster Arena game. It will
    work just how it it did in the project before one.


    +   - Start: Build the arena.

    - Goal: Break the melon block.'
  - '[PAGE 73]


    # PROJECT 3 MONSTER ARENA


    +   ** Challenge: Add monsters.


    +   ** Reward: Level up.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_73_0.png)


    This project helps you make each iteration of the gameplay loop harder to beat.
    To start, you have a simple arena with one melon block, one monster, and one level.


    Iterate means to do something over and over. Every time you do that something,
    you make progress. For example, if you iterate on the gameplay loop, you add a
    feature (like a new challenge or reward).


    # ITERATION 1: MAKE MONSTER ARENA


    Here''s one way to tackle the first iteration of the gameplay loop:


    +   1  Start: Create a basic arena enclosed by a fence.


    In Monster Arena, the arena is round. A large fence surrounds the arena to keep
    the player and monsters inside it.


    +   2  Goal: Add a melon block to break.'
  - '[PAGE 74]


    For this minigame, you also need to write code to reset the arena when the player
    breaks the melon block.


    # Challenge: Add monsters to the arena.


    You add one monster to the arena, and the player has to avoid the monster while
    trying to break the melon block. If the player breaks the melon block, the game
    resets.


    Ask your friends to test your game after you add monsters. They''ll probably say
    that it isn''t hard to play, but they can tell you what kinds of challenges they
    like. Do they want more monsters or a bigger arena?


    # Reward: Replay the first level.


    In the first iteration, the user who breaks the melon block is the one who gets
    to play Level 1 again. In Iteration 2, you add more levels.


    After you plan out the gameplay loop in Steps 1–4, it''s time to build Monster
    Arena.


    > Whenever you build any game, the first thing you need is a basic scene.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_74_0.png)'
  - '[PAGE 75]


    # PROJECT 3 MONSTER ARENA


    # START: CREATE A BASIC ARENA WITH A FENCE


    You may already know that the radius is the line from the middle of a circle to
    any point on the circle’s edge. Everything in Minecraft is made with blocks.


    > Just count the blocks between the center and the edge of the circle — that is
    the arena’s radius.


    Monster Arena needs this stuff:


    +   - A place for the player and monster to run around

    - A way to make sure that the monsters and player can’t leave the area


    For this basic scene, you create


    +   - A platform

    - A fence


    In the Spleef project you built an arena using the LearnToMod library named sarah-ArenaBuilder.
    That library makes square arenas. This time you need a round one. Use WorldEdit
    commands to make the arena in LearnToMod!


    A WorldEdit command can run in Minecraft to edit the world.


    > You can explore lots of WorldEdit commands online. Search for the term minecraft
    worldedit commands using a search engine. Visit wiki.sk89q.com/wiki/WorldEdit
    (the official WorldEdit wiki) to see a list of all WorldEdit commands for Minecraft.
    Just click a link to a category (like Filling Pits, which is under Utilities).'
  - '[PAGE 76]


    WorldEdit commands work when you''re connected to the LearnToMod Minecraft Server.
    Follow the instructions on the Minecraft Connect badge if you don''t know how
    to connect to the LearnToMod Minecraft Server.


    # # TEST WORLDEDIT COMMANDS IN MINECRAFT


    Before you make the arena, test out the WorldEdit commands in Minecraft.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_76_0.png)


    > # WIKI WIKI WIKI

    A wiki is an information website that people can add to and edit. Wikipedia, for
    example, is a website that has pages on thousands of topics. Each page (like the
    Minecraft page) is added and edited by people who know about Minecraft.


    Cylinders and circles


    +   - /cyl <radius> <height>

    - /cylblock <radius> <height>


    WorldEdit is capable of producing both hollow and filled cylinders as well as
    hollow and filled circles. It uses a fast algorithm to generate the objects and
    the algorithm is capable of creating nice and symmetrical edges. The cylinders
    are created at your feet and extend upwards. If you are creating a circle, you
    simply need to create a cylinder of height 1.


    ```

    Example: Creating a hollow glass cylinder of radius 5 and height 10

    /cyl glass 5 10


    Example: Creasing a hollow glass circle of radius 5

    /cyl glass 5 1

    ```


    To make the round area, you create a cylinder (like a tube) and a circle. Those
    WorldEdits are in the Generation category on the wiki. (It''s towards the bottom
    of the page.)'
