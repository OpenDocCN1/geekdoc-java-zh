    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_10_5.png)


    # KNOW WHAT MINECRAFT MODDING IS


    Video games are made up of code. Thousands of lines of code. Code that lets players
    — like you — explore new worlds and interact with characters. Some games, like
    Minecraft, let players add their own code to create new worlds or characters.


    # PROJECT 1 START MODDING


    Mods, which is short for modifications (or changes), can be almost any task. A
    task is something you do, like create a tower or make a mountain explode with
    TNT.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_11_0.png)


    You can make these tasks mods:


    - Texture: Change the way the world looks by loading a new texture pack.

    - Block interaction: Cause an explosion whenever the player destroys a block type.

    - New block: Create new blocks, like an ultra-TNT block that makes a bigger explosion.

    - Minigame: Create a minigame within a world. The projects in this book help you
    that.

    - Large structure: Create huge structures (that would take a long time to make
    by hand but take no time with code).


    # USE THE LEARNMOD ONLINE SOFTWARE


    The LearnToMod online software walks you through coding challenges. When you complete
    a challenge, you earn a badge. Check out the next sections to get started with
    LearnToMod.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_11_1.png)


    > Get the LearnToMod online software at mod.learntomod.com.


    This is the software that you''ll use for the projects in this book. The badges
    will lead you through learning coding and different ways to make neat mods.


    # SIGN UP FOR LEARNMOD


    It takes about five minutes to sign up for LearnToMod. To sign up for the software,
    follow these steps:


    - In a web browser, go to mod.learntomod.com.

    - Fill out the Sign Up Form.

    - Another dialog box opens.

    - In the top of the dialog box, type the access key that you got in this book.

    - Make a nickname.

    - The dashboard (also known as the home screen) opens.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_12_0.png)


    > Here''s my clever nickname


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_12_1.png)


    People will see your nickname anytime you share your mods, so don''t use your
    real name.


    # PROJECT 1 START MODDING


    # USE THE LEARNMOD BADGES


    To access the LearnToMod coding challenges, follow these steps:


    - 1 Go to mod.learntomod.com.

    - 2 Fill in the Log In form. Use the email address and password you signed up
    with. The home screen opens.

    - 3 To see the list of challenges, click the Learn tab.


    The first set of coding challenges appears.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_13_0.png)


    # CONNECT YOUR MODS TO MINECRAFT


    Just click the first badge: Minecraft Connect. This badge tells LearnToMod what
    your Minecraft account is. That way, when you open up Minecraft and connect to
    the LearnToMod server, your mods will be there waiting for you. I explain more
    about that later.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_14_0.png)


    In this project, I explain how to use the LearnToMod online software. I also explain
