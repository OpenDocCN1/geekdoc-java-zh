- md: "\n# REWARD: ADD FIVE MORE LEVELS\n\nAdding levels is pretty easy because you\
    \ already set up the levels to be based on a list. To make more levels, follow\
    \ these steps:\n\n- 1 Change the conditional statement so it's based on the list\
    \ length.\n\n> To refactor means to change the way code looks without changing\
    \ what it does.\n\nYou're making sure that you iterated through all the monsters\
    \ in the Monster List (instead of a specific number, like 2).\n\nThe code shows\
    \ how to change the conditional statement to have it based on the list length.\
    \ Figure out the one place you should change your code. (Hint: You aren't checking\
    \ if Level is less than 2. You're checking if Level is less than the length of\
    \ a list.)\n\n```\nfunction on_block_break with:info\nset event_block to info's\
    \ block\nset event_block_type to event_block's type\nif event_block_type = MELON_BLOCK\n\
    \  Send message \"Yay! You broke the Melon Block!\" to me\nchange Level by 1\n\
    if Level > length of Monsters\n  Send message \"Yay! You beat all the levels!\
    \ Good job!\" to me\nelse\n  ResetGame\n```\n\n# PROJECT 3 MONSTER ARENA\n\nA\
    \ conditional statement is one that compares two things. You can read it like\
    \ a sentence. For example, if level is greater than the length of monsters, then\
    \ send a message; otherwise, reset the game.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_99_0.png)\n\
    \nChange the SetupGame function to add monsters to your Monster List.\n\nThe code\
    \ shows the updated SetupGame function. Add entities to the Monster List. You\
    \ can find them under Minecraft and then Entities. Change which one you're adding\
    \ by clicking the yellow arrow and choosing from the list.\n\nTo add more positions\
    \ into a list, click the star next to the words create list with and drag item\
    \ blocks into the list block.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_99_1.png)\n\
    \n```\nfunction SetupGame\nset d to new Drone\nMove Drone in direction backward\
    \ distance 18\nMove Drone in direction up distance 2\nTeleport me to location\
    \ of d\nset PlayerStartLocation to d's location\nMove Drone in direction forward\
    \ distance 33\nDrone d to places block of type MELON_BLOCK\nset MelonBlockLocation\
    \ to d's location\nset Level to 1\nset Monsters to * create list with EntityType\
    \ creeper\nEntityType zombie\nEntityType spider\nEntityType blaze\nEntityType\
    \ skeleton\nEntityType cave spider\nEntityType witch\nspawn_monster\nperfrom command\
    \ \"gamemodes\" for player me\n```\n\n# 3 Change the spawn_monster function.\n\
    \nThis code shows how to spawn more monsters as the levels get harder.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_100_0.png)\n\
    \n# MAKE MORE ITERATIONS: BE CREATIVE AND UNIQUE\n\nIf you followed the steps\
    \ in this project, you created an entire multilevel Monster Arena minigame! (Yay!\
    \ You made so many levels! Good job!)\n\nKeep iterating on the gameplay loop to\
    \ make more challenges, new rewards, and different goals. You can change the arena\
    \ by adding patterns to the platform.\n\n> A more challenging addition is to add\
    \ random monsters at each level.\n\nFor example, at Level 1 you add five creepers,\
    \ and at Level 2 you add ten monsters that are (randomly) creepers or zombies.\
    \ At Level 3, you add a total of 15 monsters that are (randomly) creepers, zombies,\
    \ or spiders.\n\nThis code shows how to add randomness to the spawn_monster function.\n\
    \n# PROJECT 3 MONSTER ARENA\n\n```\nfunction spawn_monster\n  Move Drone d in\
    \ direction backward distance 2\n  repeat (5) times\n    set Monster to list (Monsters\
    \ get) # set random integer from 1 to Level\n    Drone d d spawns mob of type\
    \ Monster\n```\n\n# PROJECT 4 CAPTURE THE FLAG\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_102_0.png)\n\
    \nHAVE YOU EVER PLAYED CAPTURE THE FLAG? You play like this: Each player gets\
    \ at least one flag (actually a glowstone block). Each player hides her flag in\
    \ the world, and if the player dies (maybe because she fell into some lava), she\
    \ could respawn anywhere there's a flag. The trick is to make sure you hide your\
    \ flags well. If you run out of flags, you won't be able to respawn anywhere.\n\
    \nIn this project you're going to make a basic Capture the Flag game, play it\
    \ with a friend, then add magic wand to make the game even more fun. Everyone\
    \ needs a bit more magic, right?\n\n# USE THE CAPTURE THE FLAG LIBRARY\n\nTo set\
    \ up your game using the Capture the Flag library, follow these steps:\n\n# PROJECT\
    \ 4 CAPTURE THE FLAG\n\n- 1 Create a new mod called Magical_Capture_The_Flag.\n\
    - 2 Go to the code page.\n\nYou should see a blank mod.\n\n- 3 Go into the Misc\
    \ category and drag the import block into the coding area.\n\nNow you've imported\
    \ my Capture the Flag mod.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_103_0.png)\n\
    \nYou have to spell and capitalize my Capture the Flag library exactly like you\
    \ see here. Otherwise, it won't work.\n\n- 4 Import sarah-CaptureTheFlag.\n\n\
    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_104_0.png)\n\nYou should see some new\
    \ functions under the Functions category. You can start making your Capture the\
    \ Flag mod!\n\n# MAKE A BASIC CAPTURE THE FLAG\n\nYou're going to play your game\
    \ with a friend. These steps help set up your main function so that you and one\
    \ other person can play together:\n\n- Create a variable called PlayerNames.\n\
    - Drag the create list block out of List category. It has three positions, but\
    \ you need two.\n- Click the star and drag one item blocks out of list.\n- Click\
    \ the star again to close it.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_104_1.png)\n\
    \n# PROJECT 4 CAPTURE THE FLAG\n\nTRY IT OUT, TOO\n\nCapture the Flag is an old\
    \ game based on war. For a long time, kids played the game outside. In the early\
    \ 1980s, Scholastic released Capture the Flag–style game on one of the first computers.\
    \ Since then, lots of makers used it to make their own games (like Halo and Team\
    \ Fortress 2).\n\n- 5 In the list, type your Minecraft username and your friend’s\
    \ username.\n\n```\nimport sarah-CaptureTheFlag\nfunction main\nset PlayerNames\
    \ to create list with YOUR MINECRAFT YOUR FRIENDS USERN\n```\n\n> REMEMBER You\
    \ have to spell and capitalize usernames exactly right. Otherwise, they won't\
    \ work.\n\n- 6 Bring the sarah-CaptureTheFlag.init function into your main function.\n\
    \n```\nimport sarah-CaptureTheFlag\nfunction main\nset PlayerNames to create list\
    \ with \"YOUR USERNAME\", \"YOUR FRIENDS USERNAME\"\nsarah-CaptureTheFlag.init\n\
    ``` 7 Use a for each item in list block from Loop category.\n- 8 Rename i as PlayerName.\n\
    - 9 Add the PlayerName variable to the end of the block.\n- 10 Add a call to sarah-CaptureTheFlag.give_flag\
    \ function from Functions category.\n- 11 Pass glowstone, PlayerName, and 1 as\
    \ parameters.\n- 12 Add a perform command block from Players category. The game\
    \ mode changes to Survival for each player.\n- 13 Add the entire loop to your\
    \ main function.\n\n```\nimport sarah-CaptureTheFlag\nfunction main\nset PlayerNames\
    \ to create list with \"YOUR MINECRAFT USERNAME\", \"YOUR FRIENDS MINECRAFT USERNAME\"\
    \nsarah-CaptureTheFlag.init\nfor each item PlayerName in list PlayerNames\ndo\
    \ sarah-CaptureTheFlag give_flag\nflag_type GLOWSTONE Magical_Capt\nplayer_name\
    \ PlayerName\nnumber_of_flags 1\nperform command \"gamodes s\" for player named\
    \ PlayerName own```\n\n# TEST YOUR TWO-PLAYER CAPTURE THE FLAG\n\nNow it's time\
    \ to test your game. Follow these steps:\n\n- 1 Click the Mod button at the top\
    \ of your mod.\n- 2 Join your LearnToMod server by opening Minecraft, clicking\
    \ Multiplayer, and clicking LearnToMod server.\n\nIt's the server that you created\
    \ in the first project.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_107_0.png)\n\
    \n# 3 Type /open.\n\n```\nYou have opened your server,\nTell your friends to join\
    \ play.learntomod.com\nAnd run the command /join 227\n/open_\n```\n\n# 4 Have\
    \ your friend join the LearnToMod server on his own computer and type in /join\
    \ ##.\n\nYour friend has to have his own LearnToMod account for this work, so\
    \ make sure he is signed up at mod.learntomod.com.\n\nInstead of typing ##, your\
    \ friend should type the number that appeared in your server. For example, if\
    \ you were joining my server, you'd type /join 227.\n\n# 5 Run your mod.\n\nYou\
    \ and your friend should each get one glowstone block in your HotBar. You should\
    \ both be in Survival mode. You can tell that because you'll see hearts above\
    \ your HotBar.\n\n# 6 Put your glowstone block somewhere.\n\nWhen you die and\
    \ respawn, you wind up at your glowstone block after two seconds. If this doesn't\
    \ work, head to forum.learntomod.com and see if anyone there has run into the\
    \ same problem. You can also carefully go through each block that you made and\
    \ the pictures in this book to see what's different between the two. Multiplayer\
    \ games are tricky!\n"
