    - 3 Click the Minecraft icon. It''s on your computer''s taskbar.


    You''re still in the testing world, so your mod chest is in the inventory.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_25_1.png)


    Now you’re going to put stuff in your mod and use it.


    - Press the 9 key and then click the mouse button.


