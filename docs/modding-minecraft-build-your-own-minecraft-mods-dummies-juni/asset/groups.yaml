    ## 编写 Minecraft 模组


    ## 项目 1 开始模化


    当你准备好编写第一个模组时，请遵循步骤操作。


    在本节中，我将帮助你获得第二个勋章。你可以在勋章的左栏找到这些步骤。只需观看视频。


