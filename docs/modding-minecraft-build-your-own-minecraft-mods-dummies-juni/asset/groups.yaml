    你会看到消息“Hello, World!”


    > 如果模拟器（或其他任何地方）运行异常，请访问 forum.learntomod.com 查看是否有人找到了解决方案。或者，你可以发帖告诉 LearnToMod
    的开发者你发现了一个 bug。他们会帮你修复。


    - 13 当勋章弹出时，点击“Back to Badges”。


