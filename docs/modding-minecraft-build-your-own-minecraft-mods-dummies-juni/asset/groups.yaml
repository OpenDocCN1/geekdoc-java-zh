- md: "\n- Add an enemy (another challenge for players).\n- Add fireworks (a reward).\n\
    \n## START: ADD A LAVA PLATFORM\n\nAfter you have a working game, you can add\
    \ lava to the scene. Everyone knows what happens when you fall into lava.\n\n\
    Because you're using the ArenaBuilder library, you don't have to make many changes\
    \ to the Sleef code. You can see here what call to add to the arena function.\
    \ When you add it, you get a different scene.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_68_0.png)\n\
    \n## GOAL: DESTROY AT LEAST 200 BLOCKS\n\nYour mod already counts the number of\
    \ blocks that the player destroys. You can reward your players even more by adding\
    \ to\n\nthe removeBlock function.\n\n## PROJECT 2 SPLEEF\n\nCongratulate the player\
    \ on becoming a Master Spleefer.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_69_0.png)\n\
    \n## CHALLENGE: ADD AN ENEMY\n\nNobody needs enemies, but they do make games more\
    \ lively. You can add an enemy to the arena. Then add the melon block as the spawning\
    \ point.\n\n**Spawn a creeper** in a random spot the player has to avoid the creeper\
    \ and try not to fall before destroying 200 blocks.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_69_1.png)\n\
    \n## REWARD: ADD FIREWORKS\n\nYou've challenged your players plenty, so make sure\
    \ they get plenty of rewards. Besides congratulating players, you can give them\
    \ a fireworks show!\n\nAdd the Fireworks block **to the removeBlock function.**\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_70_0.png)\n\n## PROJECT 2 SLEEF\n\n\
    The Fireworks block is under the World category.\n\n- Minecraft\n  - Entities\n\
    \  - Players\n  - Item\n  - Drone\n- SteveBot\n- World\n  - Particles\n  - Recipes\n\
    \  - Block\n  - Events\n- Music\n  - Materials [A - C]\n  - Materials [D - G]\n\
    \  - Materials [H - M]\n  - Materials [N - R]\n  - Materials [S - Z]\n- Misc\n\
    \  - Logic\n  - Loops\n  - Math\n  - Text\n  - Lists\n  - Colour\n- Variables\n\
    - Functions\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_71_0.png)\n\nJavascript\n\
    \n## PROJECT 3 MONSTER ARENA\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_72_0.png)\n\
    \nMONSTER ARENA IS A MULTILEVEL MINECRAFT MINIGAME WHERE THE PLAYER IS IN A LARGE\
    \ ARENA WITH MONSTERS THAT SPAWN AROUND A MELON CUBE BLOCK. The player's goal\
    \ is to reach the melon cube without being attacked by the monsters. Every time\
    \ the player reaches the melon cube, he moves on to the next level, which has\
    \ more monsters that are harder to beat.\n\nIn this project you make a Monster\
    \ Arena mod. Then you can play Monster Arena with your friends and see who can\
    \ defeat the most monsters!\n\n## DRAW THE GAMEPLAY LOOP\n\nDraw the gameplay\
    \ loop (see the next page) for the Monster Arena game. It will work just how it\
    \ it did in the project before one.\n\n- Start: Build the arena.\n- Goal: Break\
    \ the melon block.\n\n## PROJECT 3 MONSTER ARENA\n\n- Challenge: Add monsters.\n\
    - Reward: Level up.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_73_0.png)\n\n\
    This project helps you make each iteration of the gameplay loop harder to beat.\
    \ To start, you have a simple arena with one melon block, one monster, and one\
    \ level.\n\nIterate means to do something over and over. Every time you do that\
    \ something, you make progress. For example, if you iterate on the gameplay loop,\
    \ you add a feature (like a new challenge or reward).\n\n## ITERATION 1: MAKE\
    \ MONSTER ARENA\n\nHere's one way to tackle the first iteration of the gameplay\
    \ loop:\n\n- 1 Start: Create a basic arena enclosed by a fence.\n\nIn Monster\
    \ Arena, the arena is round. A large fence surrounds the arena to keep the player\
    \ and monsters inside it.\n\n- 2 Goal: Add a melon block to break.\n\nFor this\
    \ minigame, you also need to write code to reset the arena when the player breaks\
    \ the melon block.\n\n## Challenge: Add monsters to the arena.\n\nYou add one\
    \ monster to the arena, and the player has to avoid the monster while trying to\
    \ break the melon block. If the player breaks the melon block, the game resets.\n\
    \nAsk your friends to test your game after you add monsters. They'll probably\
    \ say that it isn't hard to play, but they can tell you what kinds of challenges\
    \ they like. Do they want more monsters or a bigger arena?\n\n## Reward: Replay\
    \ the first level.\n\nIn the first iteration, the user who breaks the melon block\
    \ is the one who gets to play Level 1 again. In Iteration 2, you add more levels.\n\
    \nAfter you plan out the gameplay loop in Steps 1–4, it's time to build Monster\
    \ Arena.\n\n> Whenever you build any game, the first thing you need is a basic\
    \ scene.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_74_0.png)\n\n## PROJECT 3\
    \ MONSTER ARENA\n\n## START: CREATE A BASIC ARENA WITH A FENCE\n\nYou may already\
    \ know that the radius is the line from the middle of a circle to any point on\
    \ the circle’s edge. Everything in Minecraft is made with blocks.\n\n> Just count\
    \ the blocks between the center and the edge of the circle — that is the arena’s\
    \ radius.\n\nMonster Arena needs this stuff:\n\n- A place for the player and monster\
    \ to run around\n- A way to make sure that the monsters and player can’t leave\
    \ the area\n\nFor this basic scene, you create\n\n- a platform\n- a fence\n\n\
    In the Spleef project you built an arena using the LearnToMod library named sarah-ArenaBuilder.\
    \ That library makes square arenas. This time you need a round one. Use WorldEdit\
    \ commands to make the arena in LearnToMod!\n\nA WorldEdit command can run in\
    \ Minecraft to edit the world.\n\n> You can explore lots of WorldEdit commands\
    \ online. Search for the term minecraft worldedit commands using a search engine.\
    \ Visit wiki.sk89q.com/wiki/WorldEdit (the official WorldEdit wiki) to see a list\
    \ of all WorldEdit commands for Minecraft. Just click a link to a category (like\
    \ Filling Pits, which is under Utilities).\n\nWorldEdit commands work when you're\
    \ connected to the LearnToMod Minecraft Server. Follow the instructions on the\
    \ Minecraft Connect badge if you don't know how to connect to the LearnToMod Minecraft\
    \ Server.\n\n## TEST WORLDEDIT COMMANDS IN MINECRAFT\n\nBefore you make the arena,\
    \ test out the WorldEdit commands in Minecraft.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_76_0.png)\n\
    \n> # WIKI\nA wiki is an information website that people can add to. Wikipedia,\
    \ for example, is a website with thousands of topics.\n\nCylinders and circles\n\
    \n- /cyl <radius> <height>\n- /cylblock <radius> <height>\n\nWorldEdit is capable\
    \ of producing both hollow and filled cylinders as well as hollow and filled circles.\
    \ If you are creating a circle, you simply need to create a cylinder of height\
    \ 1.\n\n```\nExample: Creating a hollow cylinder of radius 5 and height 10\n/cyl\
    \ glass 5 10\n\nExample: Creating a hollow circle of radius 5\n/cyl glass 1\n\
    ```\n\nTo make the round area, you create a cylinder (like a tube) and a circle.\
    \ Those WorldEdits are in Generation category on the wiki. (It's towards the bottom\
    \ of the page.)\n\n## PROJECT 3 MONSTER ARENA\n\nFirst you type the code to make\n\
    \n- a platform\n- made of stone\n- with a radius of 20\n\nType this: //cyl stone\
    \ 20. Then you see the platform.\n\n```\n//cyl stone 20\n```\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_77_0.png)\n\
    \n> REMEMBER\n\nWhen you're trying to build a large structure, double-click the\
    \ spacebar to hover, and then click your mouse and hold the spacebar to move up\
    \ into the sky. This action creates the large platform in the sky and makes it\
    \ easier to see the arena.\n\nTry making the fence with WorldEdit commands. If\
    \ you don't move, you can make a wooden fence inside the stone fence. Just enter\
    \ the code that follows the kind of fence:\n\n- Stone fence: //hcyl stone 20 4\n\
    - Wooden fence: //hcyl fence 19 4\n\nIf you move after you create the platform\
    \ and before you create the fence, your fence won't fit perfectly around the platform.\n\
    \n```\n//hcyl stone 20 4\n//hcyl fence 19 4\n```\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_78_0.png)\n\
    \nIf you call //hcyl stone 20 and //hcyl stone 20 4 and // without moving, you\
    \ wind up with an arena with a fence around it.\n\nCalling code means that Minecraft\
    \ will handle that task. You don't have to build the cylinder by hand, one block\
    \ at a time.\n"
  mdcn: "\n\n- 添加一个敌人（给玩家增加另一个挑战）。\n- 添加烟花（一种奖励）。\n\n## 开始：添加岩浆平台\n\n在你完成一个可以运行的游戏后，可以向场景中添加岩浆。大家都知道掉进岩浆会发生什么。\n\
    \n因为你使用了 ArenaBuilder 库，所以你不需要对 Sleef 代码做很多改动。你可以在这里看到向 `arena` 函数中添加哪个调用。当你添加了它后，你会得到一个不同的场景。\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_68_0.png)\n\n## 目标：破坏至少 200 个方块\n\n\
    你的模组已经在统计玩家破坏的方块数量。你可以通过向 `removeBlock` 函数添加内容来为玩家提供更多奖励。\n\n## 项目 2 SPLEEF\n\n\
    祝贺玩家成为一名 Spleef 大师（Master Spleefer）。\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_69_0.png)\n\
    \n## 挑战：添加一个敌人\n\n没有人讨厌敌人，但它们确实让游戏变得生动。你可以向竞技场添加一个敌人。然后将西瓜块作为生成点。\n\n在随机位置**生成一个苦力怕**，玩家必须避开苦力怕，并在破坏\
    \ 200 个方块之前尽量不要掉落。\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_69_1.png)\n\n##\
    \ 奖励：添加烟花\n\n你已经充分挑战了你的玩家，所以确保他们获得足够的奖励。除了祝贺玩家，你还可以给他们举办烟花表演！\n\n**在 removeBlock\
    \ 函数中添加烟花块。**\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_70_0.png)\n\n## 项目 2\
    \ SLEEF\n\n烟花块位于“世界”（World）类别下。\n\n- Minecraft\n  - 实体 (Entities)\n  - 玩家 (Players)\n\
    \  - 物品 (Item)\n  - 无人机 (Drone)\n- SteveBot\n- 世界 (World)\n  - 粒子 (Particles)\n\
    \  - 配方 (Recipes)\n  - 方块 (Block)\n  - 事件 (Events)\n- 音乐 (Music)\n  - 材料 [A -\
    \ C]\n  - 材料 [D - G]\n  - 材料 [H - M]\n  - 材料 [N - R]\n  - 材料 [S - Z]\n- 其他 (Misc)\n\
    \  - 逻辑 (Logic)\n  - 循环 (Loops)\n  - 数学 (Math)\n  - 文本 (Text)\n  - 列表 (Lists)\n\
    \  - 颜色 (Colour)\n- 变量 (Variables)\n- 函数 (Functions)\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_71_0.png)\n\
    \nJavascript\n\n## 项目 3 怪物竞技场\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_72_0.png)\n\
    \n怪物竞技场是一个多层级的 Minecraft 迷你游戏，玩家在一个巨大的竞技场内，怪物会在一个西瓜块周围生成。玩家的目标是在不被怪物攻击的情况下到达西瓜块。每当玩家到达西瓜块时，他就会进入下一层，下一层会有更多更强力、更难对付的怪物。\n\
    \n在这个项目中，你将制作一个“怪物竞技场”模组。然后你就可以和朋友一起玩怪物竞技场，看看谁能击败最多的怪物！\n\n## 绘制游戏流程循环\n\n为怪物竞技场游戏绘制游戏流程循环（见下一页）。它的工作方式与上一个项目中的完全一样。\n\
    \n- 开始：建造竞技场。\n- 目标：破坏西瓜块。\n\n## 项目 3 怪物竞技场\n\n- 挑战：添加怪物。\n- 奖励：升级。\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_73_0.png)\n\
    \n这个项目帮助你让游戏循环的每一次迭代变得更加困难。开始时，你拥有一个带西瓜块、一个怪物和一个关卡的简单竞技场。\n\n迭代（Iterate）意味着重复执行某事。每当你这样做时，你就取得了进展。例如，如果你对游戏循环进行迭代，就会添加新功能或奖励。\n\
    \n## 迭代 1：制作怪物竞技场\n\n处理游戏循环第一次迭代的方法如下：\n\n- 1 开始：创建一个由围栏围绕的基础竞技场。在怪物竞技场中，竞技场是圆形的。一个巨大的围栏围绕着竞技场，将玩家和怪物留在里面。\n\
    - 2 目标：添加一个西瓜块。对于这个迷你游戏，你还需要编写在西瓜块时重置竞技场的代码。\n\n## 挑战：向竞技场添加怪物\n\n你向竞技场添加一个怪物，玩家在尝试破坏西瓜块时必须避免怪物。如果玩家破坏了西瓜块，游戏将重置。\n\
    \n添加怪物后让你的朋友测试游戏。他们可能会说游戏不好玩，但你可以告诉他们什么样的挑战。他们想要更多的怪物还是更大的竞技场？\n\n## 奖励：重玩第一关\n\
    \n在第一次迭代中，破坏西瓜块的用户可以再次玩第一关。在迭代 2 中，你添加更多关卡。\n\n在规划了步骤 1 到 4 的游戏循环后，是时候建造怪物竞技场了。\n\
    \n> 每当你建造任何游戏时，首先需要一个基础场景。\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_74_0.png)\n\
    \n## 项目 3 怪物竞技场\n\n## 开始：创建一个带围栏的基础竞技场\n\n你可能已经知道，半径是从圆心到圆边缘任意一点的距离。Minecraft\
    \ 中的一切都是由方块构成的。\n\n怪物竞技场需要这些东西：\n\n- 一个玩家和怪物运行的地方\n- 一个让怪物和玩家无法离开区域的方法\n\n在这个基础场景中，你创建一个：\n\
    \n- 一个平台\n- 一个围栏\n\n在 Spleef 项目中，你使用名为 `ArenaBuilder` 的 LearnToMod 库建造了一个竞技场。该库制作的是方形竞技场。这次你需要一个圆形的。使用\
    \ WorldEdit 命令在 LearnToMod 中制作竞技场！\n\nWorldEdit 命令可以在 Minecraft 中运行以编辑世界。\n\n\
    > 你可以在网上探索大量的 WorldEdit 命令。使用搜索引擎搜索“minecraft worldedit commands”。访问 wiki.sk89q.com/wiki/WorldEdit（官方\
    \ WorldEdit wiki）查看所有适用于 Minecraft 的 WorldEdit 命令。只需点击某个类别（例如位于“Utilities”下的“Filling\
    \ Pits”）。\n\n当你连接到 LearnToMod Minecraft 服务器时，WorldEdit 命令即可生效。如果你不知道如何连接 LearnToMod\
    \ Minecraft 服务器，请遵循 Minecraft 连接标志上的说明。\n\n## 在 Minecraft 中测试 WorldEdit 命令\n\n\
    在制作竞技场之前，先在 Minecraft 中测试 WorldEdit 命令。\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_76_0.png)\n\
    \n> # Wiki\nWiki 是人们可以添加内容的信息网站。例如，Wikipedia 是包含数千个主题的网站。\n\n圆柱和圆\n\n- /cyl <radius>\
    \ <height>\n- /cylblock <radius> <height>\n\nWorldEdit 能够生成空心和实心的圆柱，以及空心和实心的圆。如果你创建一个圆，只需要创建一个高度为\
    \ 1 的圆柱。\n\n```\n示例：创建一个半径为 5、高度为 10 的空心圆柱\n/cyl glass 5 10\n\n示例：创建一个半径为 5 的空心圆\n\
    /cyl glass 1\n```\n\n要制作圆形区域，你需要创建一个圆柱（像管子）和一个圆。这些 WorldEdit 命令位于 wiki 的“生成”（Generation）类别下（在页面底部）。\n\
    \n## 项目 3 怪物竞技场\n\n首先，你输入代码来制作：\n\n- 一个平台\n- 由石头制成\n- 半径为 20\n\n输入：//cyl stone\
    \ 20。然后你就能看到平台。\n\n```\n//cyl stone 20\n```\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_77_0.png)\n\
    \n> 记住\n\n当你尝试建造一个大型结构时，双击空格键进入悬浮模式，然后点击鼠标并按住空格键移动到空中。这个动作会在空中创建一个大型平台，并让你更容易看到竞技场。\n\
    \n尝试用 WorldEdit 命令制作围栏。如果你不移动，可以在可以在围围栏内部制作木质围栏。只需在围栏类型后面输入代码即可：\n\n- 石围栏：//hcyl\
    \ stone 20 4\n- 木围栏：//hcyl fence 19 4\n\n如果你在创建平台之后、创建围栏之前移动，你的围栏将无法完美地环绕平台。\n\
    \n```\n//hcyl stone 20 4\n//hcyl fence 19 4\n```\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_78_0.png)\n\
    \n如果你在不移动的情况下调用 //hcyl stone 20 和 //hcyl stone 20 4，你将得到一个带有围栏的竞技场。\n\n调用代码意味着\
    \ Minecraft 将处理该任务。你不需要一个一个方块地手动构建圆柱。\n\n"
