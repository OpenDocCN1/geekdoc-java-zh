- md: '

    ## Type a title for your mod.


    It''s best to name your mods something meaningful. For example, if your mod is
    going to cause Ender Dragons to fill the sky, you might call it Ender_Dragon_Attack.


    In coding, spaces sometimes confuse computers — but spaces help people read. Instead
    of spaces, coders/modders use _ in their names. For example, ender_dragon_attack
    is much easier to read than enderdragonattack!


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_28_0.png)


    ## Click the Blockly (Multiplayer) button.


    That creates a server-side, or multiplayer, mod. A new mod block appears.


    ## Click the new mod block to see the mod''s description page.


    ## Click the Code button.


    You see the coding environment.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_28_1.png)


    ## PROJECT 1 START MODDING


    6 Now you can write a mod.


    For example, you could write one that says "Hi" to you. Mine says, "Hi Sarah!",


    ## SHARE A MOD WITH FRIENDS


    Writing and testing mods is fun, but having your friends test them in their Minecraft
    worlds helps you both come up with more creative ideas.


    Sharing a mod with fellow LearnToMod modders is easy. Just follow these steps:


    - 1 Click the Back button in your mod.

    - 2 Click the image box on the top left.


    If you haven''t already added image, the box will be a solid color and say Edit
    This when you hover over it with your mouse.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_29_0.png)


    - 3 Add a picture and description for the mod.


    Just follow the steps on the screen.


    ## Click the button to make the mod public.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_30_0.png)


    ## Click the Save button.


    It''s smart to share mods with friends and ask them to test for you. It''s a good
    way to find bugs and become a better modder.


    ## HOW YOUR FRIEND FINDS YOUR MOD


    From here, your friend might need help from you.


    - 1 On her own computer, your friend goes to mod.learntomod.com and logs in with
    her LearnToMod email and password.

    - 2 Your friend clicks the Find a Mod button.

    - 3 Your friend types your mod name in the Public Mods text box.


    ## PROJECT 1 START MODDING


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_31_0.png)


    Your mod appears. In this example, the mod is named Say_Hello.


    - Your friend clicks and tests your mod.


    Your friend also can see your code. Hopefully you''ll get some good feedback:
    What works? What doesn''t work? What''s really fun or really boring?


    If your friend doesn''t have a LearnToMod account, you can copy and send the URL
    (the web address) to him. Then he can see your mod, but he can''t edit or test
    it.


    ## BUGS BESIDES BEETLES


    Bugs (mistakes in your code) are a part of coding. Because you''re human, you
    will make mistakes — and that''s okay! No coder, not even the best ones, writes
    code perfectly the first time. Code always has bugs in it. To become a better
    coder/modder, you have to test your code. And ask your friends to test your code,
    so that you can find the bugs and get rid of them as soon as possible!


    ## EARN MODDING BADGES


    > You should definitely earn the first six badges under the Learn tab.


    ## EARN SCRAMBLE BADGES


    Scramble challenges have all the code blocks you need, and they''re already in
    the programming area — they''re just scrambled around on the screen.


    To earn a Scramble badge, follow these steps:


    - 1 Test.


    Test the right version of the code in the simulator or in Minecraft to see what
    it''s supposed to do.

    - 2 Gather.


    Put together all the blocks that have been scrambled on the screen. Just drag
    them near each other.


    ## PROJECT 1 START MODDING


    ## 3 Unscramble.


    Unscramble the blocks and test your mod to see whether it matches the version
    that you test in Step 1.


    > To find all the blocks you need for the badge (sometimes, the blocks that have
    been scrambled are offscreen), move around by using the scroll bars on the right
    side and bottom.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_33_0.png)


    ## EARN THE SAVING HELLO BADGE: SCRAMBLE EDITION


    You can find the Saying Hello (Scramble) challenge under the Learn tab in the
    Learning To Program category, and then under Functions. You see ten blocks scrambled
    on the screen.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_34_0.png)


    Follow these steps to earn the badge:


    - 1 Test the right version of the code in the simulator or in Minecraft.

    - 2 Gather all the blocks that have been scrambled on the screen.

    - 3 Unscramble the blocks and test your mod.

    - 4 Click the button to make the mod public.


    (Note: The OCR for page 34-35 was highly fragmented; the logic above has been
    reconstructed based on the context of the Scramble challenge).

