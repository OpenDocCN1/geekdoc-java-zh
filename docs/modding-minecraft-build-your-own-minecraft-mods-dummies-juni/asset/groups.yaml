  mdcn: "\n# 项目 3 怪物竞技场\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_79_0.png)\n\n\
    ## 在 LEARNTOMOD 中制作竞技场\n\n在你测试完 WorldEdit 命令后，从 LearnToMod 插件中调用它们。这是一个疯狂的想法——我明白。\n\
    \n> 要在 LearnToMod 中调用 WorldEdit 命令，你必须使用 PerformCommand 模块。它位于 Players（玩家）分类下。\n\
    \n## MonsterArena (怪物竞技场)\n\n- Minecraft\n  - 实体 (Entities)\n    - 玩家 (Players)\n\
    \    - 物品 (Item)\n    - 无机 (Drone)\n  - SteveBot\n  - 世界 (World)\n  - 粒子 (Particles)\n\
    \  - 配方 (Recipes)\n  - 方块 (Block)\n  - 事件 (Events)\n  - 音乐 (Music)\n  - 材料 [A\
    \ - C]\n  - 材料 [D - G]\n  - 材料 [H - M]\n  - 材料 [N - R]\n  - 材料 [S - Z]\n- 杂项 (Misc)\n\
    \  - 逻辑 (Logic)\n  - 循环 (Loops)\n  - 数学 (Math)\n  - 文本 (Text)\n  - 列表 (Lists)\n\
    \  - 颜色 (Colour)\n  - 变量 (Variables)\n  - 函数 (Functions)\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_80_0.png)\n\
    \n当你使用 PerformCommand 模块时，第一个斜杠（/)已经包含了，所以你只需要一个斜杠来制作平台和围栏。你在这里看到初始场景的主函数样式。\n\
    \n```\nfunction main\nperform command //cyl stone 20 for player me\nperform command\
    \ //hcyl stone 20 4 for player me\nperform command //hcyl fence 19 4 for player\
    \ me\n```\n\n测试你的插件以确保它是正确的竞技场类型。\n\n## 项目 3 怪物竞技场\n\n## 重构：将竞技场代码移动到函数\n\n添加目标之前，重构你的代码，使主函数保持简单。你可以在这里看到如何重构代码以清理主函数。\n\
    \n```\nfunction main\n  arena\nfunction arena\nperform command //cyl stone 20\
    \ for player me\nperform command //hcyl stone 24 for player me\nperform command\
    \ //hcyl fence 19 for player me\n```\n\n这对于一名程序员来说是有用的，因为它可以让你以后更容易理解代码。\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_81_0.png)\n\
    \n## 目标：添加一个可破坏的西瓜块\n\narena 函数保持不变，但现在在玩家相对于竞技场对面添加一个西瓜块。\n\n这是新的函数 SetupGame，它放置西瓜块并将玩家放在起始位置。接下来的步骤将帮助你制作\
    \ SetupGame 函数。\n\n```\nfunction main\n  arena\nSetupGame\n```\n\n```\nfunction\
    \ SetupGame\nset d to new Drone\nMove Drone d in direction backward distance 18\n\
    Move Drone d in direction up distance 2\nTeleport me to location of d\nMove Drone\
    \ d in direction forward distance 33\nDrone d pieces block of type MELON_BLOCK\n\
    ```\n\n```\nperform command /cyl stone 20 for player me\nperform command /hcyl\
    \ stone 20 for player me\nperform command /hcyl fence 19 for player me\n```\n\n\
    要添加西瓜块，请遵循以下步骤：\n\n- 1 创建 SetupGame 函数并在 main 中添加 SetupGame 的调用。\n- 2 添加一个名为 d\
    \ 的新无人机并将其移动到竞技场的一侧。\n\n无人机只需移动 18 个格，因为石头和围栏占据了 2 个格，而且你想让玩家在围栏内部。\n- 3 将无人机向上移动\
    \ 2 格。\n\n这会让玩家从平台上方开始掉进竞技场。\n- 4 将玩家传送到无人机的位置。\n\n现在玩家位于了起始点。\n- 5 将无人机移动 33\
    \ 格到竞技场的对面。\n\n这在西瓜块和围栏之间留下了两个格的空白。\n- 6 放置西瓜块并将无人机向后移动 1 个格。\n\n目前，当玩家破坏西瓜块时什么都不会发生。你将在迭代\
    \ 2 中编写该代码。\n\n## 测试：确保你的游戏正常运行\n\n通过将插件从你的插件箱拖入快捷栏然后点击运行来测试你的插件。当你运行插件时，你应该看到这个场景。\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_83_0.png)\n\n## 挑战：在竞技场中添加怪物\n\n当你的游戏设置好后，你可以开始让它变得可玩。在游戏循环的第一次迭代中，添加一个怪物供玩家击败（或者至少避开）。\n\
    \n这一次，从一开始就编写在独立函数中生成怪物的代码。这段代码会让怪物在西瓜块附近生成。无人机位于西瓜块，所以它向后移动（朝玩家方向）然后生成苦力怕。\n\n\
    ```\nfunction main\n  arena\n    SetupGame\n\nfunction Setup Drone\n  set d to\
    \ new Drone\n  Move Drone d in direction backward distance 18\n  Move Drone d\
    \ in direction up distance 2\n  Teleport me to location of d\n  Move Drone d in\
    \ direction forward distance 33\n  Drone d pieces block of type MELON_BLOCK\n\
    \  spawn_monster\n\nfunction spawn_monster\n  perform command /hcyl stone 20 for\
    \ player me\n  perform command /hcyl stone 20 for player me\n  perform command\
    \ /hcyl fence 19 for player me\n```\n"
