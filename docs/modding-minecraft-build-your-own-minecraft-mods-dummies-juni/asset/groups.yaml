    there would be no enemies. That’s when you add the simplest feature: the hearts.
    And you add logic to the game to ask players whether they want'
  - '[PAGE 44]


    to respawn whenever they run out of hearts. Again, at this point the game might
    not be much fun, but when you reach the next steps (the challenge, followed by
    the reward), you start to add enemies and ways that players can earn back hearts.


    # CHALLENGE: MAKE IT HARDER TO WIN


    Your game gets interesting when you start making it hard to beat. At first, you
    might want to offer a small challenge. Don’t worry: You can iterate up to the
    more difficult challenges as you go through the gameplay loop.


    For example, in a simple game, the first challenge could be one creeper that tries
    to attack. This challenge makes the game more difficult. As you iterate through
    the gameplay loop, you can start adding more creepers or even creatures, and then
    add items for the player to use as defense.


    # REWARD: MAKE PLAYERS WANT TO WIN


    Who doesn’t like to get rewards? A sticker, some candy, a No Homework pass?


    Rewarding your players makes your game fun for them. If they’re not going to get
    rewards, what’s the point of playing?


    Lots of things can be rewards:


    +   - Moving to the next level.


    +   - Items like stars and coins.


    +   - Coins for buying items that help them beat other levels.


    In a simple game, you can give a player full health after finding an Instant Health
    potion. Along the same lines, if the player is playing at the Peaceful difficulty
    level, just staying alive and not getting hurt is rewarded with health.'
  - '[PAGE 45]


    # PROJECT 2 SLEEF


    # PLAN AND TRY TEST CASES


    Before playing your mod, figure out the different test cases to make sure that
    your game is working properly.


    Test cases are different ways to check your mod to make sure it''s working.


    Before you write a test case, make two lists that say


    +   ** What you''ll test:** For example, breaking the melon block.


    +   ** What you think will happen:** For example, the game mode switches to Survival,
    and blocks below you disappear after one second.


    If your test case passes, you know that the mod is correct. If something doesn''t
    do what you thought it should, debug your code.


    In Minecraft, you can''t tell the game that you no longer want to trigger events.


    To trigger an event means that Minecraft recognizes the event has happened and
    then calls the function that was set up in the event call.


    For example, the SetupPlayer function has an event setup block in it. When the
    player respawns, this event is triggered after two seconds, and then it sends
    the player to the middle of the arena.


    But you don''t always want events to be triggered when you''re testing. For example,
    in Spleef you replace only the block below with air if you''re walking on the
    arena''s diamond blocks. If you''re playing the Sleef mod and then decide to explore
    a cave, you start to fall through the ground.'
