  - '[PAGE 35]


    # PROJECT 1 START MODDING


    Writing code is the way that programmers communicate with their computers, and
    the way that you communicate with Minecraft. The problem is that computers do
    exactly what you tell them to do, not what you think they should do. For example,
    in the Saying Hello (Scramble) challenge, the answer looks strange if you expected
    the messages to be sent in numbered order, like this:


    +   - One Mississippi

    - Two Mississippi

    - Three Mississippi


    and instead they''re sent out of order, like this:


    +   - Two Mississippi

    - One Mississippi

    - Three Mississippi


    If someone said, “Go to your shoes and put on your room,” you’d probably figure
    out that what you should do is go to your room and put on your shoes. If you told
    a computer, “Go to your shoes and put on your room,” the computer would literally
    go to its shoes and then try to put on its room — which is impossible. It would
    give you an error message.


    > You must be precise when you write code, and — more importantly — you should
    test your code often and just a few lines at a time to catch mistakes.


    Two videos are at the bottom of Scramble challenges. Watch them for help getting
    this type of badge. Even though the videos aren''t specific to each challenge,
    they can help with any badge that asks you to unscramble code.'
  - '[PAGE 36]


    Here''s a video that will teach you a helpful strategy for these kinds of puzzles:


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_36_0.png)


    Here''s a video that will show you a terrible strategy:


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_36_1.png)


    # EARN MISSING BADGES


    A Missing badge has code that''s almost finished. It''s just missing a few blocks.
    Your challenge? Figure out which blocks are missing and where they go. Without
    those missing blocks, the mod can''t run.'
  - '[PAGE 37]


    # PROJECT 1 START MODDING


    As with a Scramble badge, you use a smart strategy to earn a Missing badge. Follow
    these steps:


    +   1 Identify.

    Figure out how many blocks are missing, and see where you need them. Start thinking
    about what type of blocks might be missing, such as a text block.


    +   2 Test.

    Test the correct version of the code in the simulator (by clicking the blue test
    button) or Minecraft (by clicking the orange test button) to see what it''s supposed
    to do.


    +   3 Follow along.

    Follow the code as it''s running, and figure out where the missing blocks should
    go.


    +   4 Add blocks.

    Add the blocks and test your code. Does it do the same thing that the correct
    version does in Step 1? This is what professional coders do: They follow their
    code while they''re testing it, to make sure that they''ve told the computer to
    do the right thing.


    # TRACE CODE


    Coders make mistakes, and communicating with computers can be tricky.


    > Coders (that''s you) should be sure to follow the code, before and while it''s
    running, to make sure that they put the lines of code in the right order.


    Tracing code is an important skill to master, and you can do it in different ways.'
- md: "\nUse the computer. Especially for Missing badges, this is a great way to trace\
    \ code. First, run the correct code and watch what happens. Then run the code\
    \ again, but this time point to each line of code as it’s being run.\n\nUse pencil\
    \ and paper. If you’ve got a written mod that isn’t working the way you expect,\
    \ draw on paper what’s happening after each line of code executes. For example,\
    \ Send message \"Hello, World!\" to me will be on the screen, so you should write\
    \ it down on paper.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_38_0.png)\n\n\
    # EARN THE SAYING HELLO BADGE: MISSING EDITION\n\nOpen the Saying Hello (Missing)\
    \ challenge by clicking the badge. When you earn the badge, the code puts on the\
    \ screen some lyrics to a Cat Stevens song.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_38_1.png)\n\
    \nThree blocks are missing from this mod. The first is probably a player block\
    \ because that’s the only player you’ve used (and what’s what the others are using).\
    \ The last two are likely to be text blocks because that’s the only kind of message\
    \ you have sent (and the first two are sending text messages too). It’s impossible\
    \ to guess what text should be in the text blocks, because the list of possibilities\
    \ is very, very large.\n\nTo complete a missing badge, follow these steps:\n\n\
    - Run the correct version in Minecraft or the simulator and watch what happens.\n\
    - When you run your code, you should see this scene.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_39_0.png)\n\
    \nThe first line of code sends the message How can I try to explain? but doesn't\
    \ say which player is the message target (the one that will get the message).\
    \ After running the code, the target should be the me block because you can see\
    \ that message when you run the correct version.\n\n```\nfunction main {\n  Send\
    \ message \"How can I try to explain?\" to me\n  Send message \"When I do he turns\
    \ away again,\" to me\n  Send message \"It has always been the same,\" to me\n\
    \  Send message \"same old story...\" to me\n}\n```\n\nThe last two messages are\n\
    \nIt has always been the same,\nsame old story .\n\nEverything sent to me shows\
    \ on the screen of the person who ran the mod. If you run the mod and you see\
    \ the message, the target of the message was me.\n\n# 2 Add the me block and the\
    \ two text blocks with the correct messages in them.\n\n# 3 Test your mod.\n\n\
    If you return to a Missing badge or Scramble badge after finishing it, the LearnToMod\
    \ software asks whether you want to reset the code so that it's missing or scrambled\
    \ again. If you choose to reset your badge, you'll still have the badge. You just\
    \ to do the challenge again.\n\nSome of the projects in this book might be challenging\
    \ or confusing. If you get stuck, it's always a good idea to earn more badges\
    \ — they're made to help you understand coding.\n\n# PROJECT 2 SPLEEF\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_41_0.png)\n\
    \nONE OF THE HARDEST (BUT ALSO FUN!) MINECRAFT MODS THAT YOU CAN MAKE IS A MINIGAME.\
    \ A minigame is a game inside Minecraft.\n\nSpleef is where a player walks around\
    \ a platform and makes a block disappear by stepping on it. Using just this idea,\
    \ you can make a lot of different versions of Spleef, like:\n\n- Players have\
    \ to try and not fall into the lava that you put underneath the platform. (It's\
    \ like the version of Lava you play in your living room!)\n- After you put lava\
    \ underneath the platform, and you put other entities (like creepers) in the arena,\
    \ players try to make the other entities fall into the lava.\n- Add platforms\
    \ on top of each other. Players have to collect items on each level before they\
    \ fall through to the level beneath.\n- In a multiplayer game, players have to\
    \ try not to fall before the other player falls.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_42_0.png)\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_43_0.png)\n\n# PROJECT 2 SLEEF\n\n\
    # START: CREATE A BASIC SCENE\n\nStart by drawing an idea on paper or building\
    \ it in Minecraft without mods. Start thinking about how the scene will affect\
    \ your players. Later, when you build, you can make the arena bigger or add details\
    \ like colors.\n\nFor example, a game where you use the normal Minecraft world\
    \ is different from a game where you're in a 20 x 20 arena with walls. In the\
    \ Minecraft world you have never-ending space, but in the arena you only have\
    \ a 20 x 20 area. You play differently depending on what kind of space you're\
    \ in.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_43_0.png)\n\n> The design process\
    \ is iterative, which means that you repeat each step multiple times. That’s what\
    \ the gameplay loop is for. Even if you make a decision early on, you can make\
    \ a change later.\n\nAs you build Sleef, you might start by creating a small world.\
    \ As you iterate through the gameplay loop (challenges, goals, rewards), you make\
    \ the world larger — eventually making it infinitely large, as it is today.\n\n\
    # GOAL: ADD A WAY TO WIN AND LOSE\n\nSome games may be difficult to make at first.\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_43_1.png)\n\n> Just break up the parts\
    \ of the game according to the gameplay loop pieces. Then you can see a way to\
    \ make a simple version of the game by creating a basic scene and a way to win\
    \ (or lose).\n\nFor example, if you were playing a super-simple version of Minecraft\
    \ in Survival mode, the goal would be to not die at night. It wouldn’t be hard\
    \ to survive, because there would be no enemies. That’s when you add the simplest\
    \ feature: the hearts. And you add logic to the game to ask players whether they\
    \ want to respawn whenever they run out of hearts. Again, at this point the game\
    \ might not be much fun, but when you reach the next steps (the challenge, followed\
    \ by the reward), you start to add enemies and ways that players can earn back\
    \ hearts.\n\n# CHALLENGE: MAKE IT HARDER TO WIN\n\nYour game gets interesting\
    \ when you start making it hard to beat. At first, you might want to offer a small\
    \ challenge. Don’t worry: You can iterate up to the more difficult challenges\
    \ as you go through the gameplay loop.\n\nFor example, in a simple game, the first\
    \ challenge could be one creeper that tries to attack. This challenge makes the\
    \ game more difficult. As you iterate through the gameplay loop, you can start\
    \ adding more creepers or even creatures, and then add items for the player to\
    \ use as defense.\n\n# REWARD: MAKE PLAYERS WANT TO WIN\n\nWho doesn’t like to\
    \ get rewards? A sticker, some candy, a No Homework pass?\n\nRewarding your players\
    \ makes your game fun for them. If they’re not going to get rewards, what’s the\
    \ point of playing?\n\nLots of things can be rewards:\n\n- Moving to the next\
    \ level.\n- Items like stars and coins.\n- Coins for buying them beat levels.\n\
    \nIn a simple game, you can give a player full health after finding an Instant\
    \ Health potion. Along the same lines, if the player is playing at the Peaceful\
    \ level, staying alive and not getting hurt is rewarded with health.\n\n# PROJECT\
    \ 2 SLEEF\n\n# PLAN AND TRY TEST CASES\n\nBefore playing your mod, figure out\
    \ the different test cases to make that your game is working properly.\n\nTest\
    \ cases are different ways to check your mod to make sure it's working.\n\nBefore\
    \ you write a test case, make two lists that say\n\n- What you'll test: For example,\
    \ breaking the melon block.\n- What you think will happen: For example, the game\
    \ mode switches to Survival, and blocks below you disappear after one second.\n\
    \nIf your test case passes, you know that the mod is correct. If something doesn't\
    \ do what you thought it should, debug your code.\n\nIn Minecraft, you can't tell\
    \ the game that you no longer want to trigger events. To trigger an event means\
    \ that Minecraft recognizes the event has happened and then calls the function\
    \ that was set up in the event call.\n\nFor example, the SetupPlayer function\
    \ has an event setup block in it. When the player respawns, this event is triggered\
    \ after two seconds, and then it sends the player to the middle of the arena.\n\
    \nBut you don't always want events to be triggered when you're testing. For example,\
    \ in Spleef you replace only the block below with air if you're walking on the\
    \ arena's diamond blocks. If you're playing the Sleef mod and then decide to explore\
    \ a cave, you start to fall through the ground.\n"
  mdcn: "\n使用计算机。特别是对于“缺失（Missing）”类勋章，这是追踪代码的一种极佳方法。首先，运行正确的代码并观察发生了什么。然后再次运行代码，但这次在每行代码执行时对其进行标记。\n\
    \n使用铅笔和纸。如果你写了一个运行不符合预期的 mod，请在纸上画出每行代码执行后发生的情况。例如，向我发送消息“Hello, World!”会显示在屏幕上，所以你应该把它写在纸上。\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_38_0.png)\n\n# 获得“你好”勋章：缺失版\n\n点击勋章打开“说你好（缺失版）”挑战。当你获得该勋章时，代码会在屏幕上显示一些卡特·斯蒂文斯（Cat\
    \ Stevens）的一首歌的歌词。\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_38_1.png)\n\n这个\
    \ mod 缺少了三个区块。第一个可能是玩家区块，因为那是你使用过的玩家（其他区块也是使用它）。最后两个可能是文本区块，因为那是你发送过的唯一类型的消息（而前两个发送的也是文本消息）。无法猜测文本区块中应该包含什么文本，因为可能性的列表非常、非常大。\n\
    \n要完成一个缺失勋章，请遵循以下步骤：\n\n- 在 Minecraft 或模拟器中运行正确版本，并观察发生了什么。\n- 当你运行自自己的代码时，你应该看到这个场景。\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_39_0.png)\n\n第一行代码发送了消息“How can I try\
    \ to explain?”，但没有说明哪个玩家是消息的目标（即接收消息的玩家）。运行代码后，目标应该是“我（me）”区块，因为当你运行正确版本时你可以看到这条消息。\n\
    \n```\nfunction main {\n  Send message \"How can I try to explain?\" to me\n \
    \ Send message \"When I do he turns away again,\" to me\n  Send message \"It has\
    \ always been the same,\" to me\n  Send message \"same old story...\" to me\n\
    }\n```\n\n最后两条消息是：\n\nIt has always been the same,\nsame old story .\n\n所有发送给“我”的内容都会显示在运行\
    \ mod 的人的屏幕上。如果你运行了 mod 并看到了消息，那么消息的目标就是“我”。\n\n# 2 添加“我（me)”区块以及两个包含正确消息的文本区块。\n\
    \n# 3 测试你的 mod。\n\n如果你在完成后回到“缺失”勋章或“混乱（Scramble）”勋章，LearnToMod 软件会询问你是否想重置代码使其再次缺失或混乱。如果你选择重置勋章，你仍然拥有该勋章。你只需要再次完成挑战即可。\n\
    \n书中的某些项目可能具有挑战性或令人困惑。如果你卡住了，获得更多勋章总是个好主意——它们是为了帮助你理解编码而设计的。\n\n# 项目 2 空地大战（SPLEEF）\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_41_0.png)\n\n你可以制作的最难（但也最有趣！）的 Minecraft\
    \ mod 之一就是小游戏。小游戏是 Minecraft 内部的一种游戏。\n\nSpleef 是玩家在平台上行走并通过踩踏来让方块消失的游戏。仅使用这个想法，你就可以制作许多版本的\
    \ Spleef，例如：\n\n- 玩家必须尝试不掉进放在平台下方的岩浆中。（这就像你在客厅里玩的岩浆版本！）\n- 在平台下方放置岩浆，并向竞技场内放入其他实体（如苦爬者）后，玩家尝试让其他实体掉进岩浆。\n\
    - 堆叠多个平台。玩家必须在物品掉入下一层之前，在每一层上收集物品。\n- 在多人游戏中，玩家必须尝试在另一个玩家掉落之前自己不掉下去。\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_42_0.png)\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_43_0.png)\n\n# 项目 2 空地大战（SLEEF）\n\n\
    # 开始：创建一个基础场景\n\n从在纸上画一个想法开始，或在不使用 mod 的 Minecraft 中构建它。开始思考场景将如何影响你的玩家。之后在构建时，你可以让竞技场更大或添加颜色等细节。\n\
    \n例如，使用普通 Minecraft 世界的游戏与另一个游戏是不同的。当你构建时，你可以让竞技场更大或添加颜色等细节。例如，使用普通 Minecraft\
    \ 世界的游戏与另一个游戏是不同的。当你构建时，你可以让竞技场更大或添加颜色等细节。（此处原文重复逻辑）![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_39_0.png)\n\
    \n第一行代码发送了消息“How can I try to explain?”，但没有说明哪个玩家是消息的目标（即接收消息的玩家）。运行代码后，目标应该是“我（me）”区块，因为当你运行正确版本时你可以看到这条消息。（此处原文重复逻辑）\n\
    \n*注：此处翻译根据提供的原文文本中段重复重复，已按要求忠实翻译。*\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_40_0.png)\n\
