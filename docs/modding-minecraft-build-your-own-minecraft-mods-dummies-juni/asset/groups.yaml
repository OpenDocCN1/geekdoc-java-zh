    ## 为你的模（mod）输入标题。


    最好为你的模起一个有意义的名字。例如，如果你的模会让末影龙填满天空，你可以将其命名为 Ender_Dragon_Attack。


    在编码中，空格有时会让计算机产生困惑——但空格有助于人类阅读。编码人员/模组制作者会在名称中使用 `_` 代替空格。例如，`ender_dragon_attack`
