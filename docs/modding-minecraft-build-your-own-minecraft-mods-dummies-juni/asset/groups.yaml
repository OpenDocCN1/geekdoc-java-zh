    ## PROJECT 1 START MODDING


    When you''re ready to write your first mod, follow the steps.


    In this section, I help you earn the second badge, Write First Mod. You can find
    these steps in the left column of the badge. Just watch the video or read the
    instructions.


    Make sure you''re logged in at mod.learntomod.com before starting with these steps:


    - 1 Click the Learn tab.

    - 2 Click the Write First Mod badge.

    - 3 Click and watch the video.


    It''s on the bottom left of the screen.


    To earn the second badge, follow these steps:


    - 1 Drag a function into the coding environment.

    - 2 Click something.

    - 3 Type main to create a main function.

    - 4 Click the Minecraft category and then Players.

    - 5 Click the Send message block and drag it to the main function.

    - 6 Click the Text category.

    - 7 Drag the text block to connect it to the Send message block.

    - 8 Type Hello, World! inside the text block.

    - 9 Click the Minecraft category and then Players.

    - 10 Drag the me block to the second space on the Send message block.


