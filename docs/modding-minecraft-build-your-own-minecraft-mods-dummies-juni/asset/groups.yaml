    badges.


    > The bottom left has instructions. A short video is always there to explain the
    coding challenge, and it''s followed by a list of steps that tell you what to
    do.


    > The right side shows the coding environment. In this book, you can read how
    to code using a block-based language that''s visual, but you can also try a text-based
    language.


    To get to the block-based code, click one of the code categories (such as Minecraft).
    Then click and drag a block into the blank coding area. I explain this in the
    next section.


    The bottom center has two buttons: Mod and Simulator.


    - The Mod button sends your mod to the Minecraft testing world.

    - The Simulator button opens a Minecraft simulated world in your browser.


    ## TEST YOUR MOD


    You haven''t finished your challenge yet. You do that in the next section. Use
    the Minecraft simulator to test your mod and earn the badge:


    - 1 Click the Learn tab at the top of the LearnToMod website.

