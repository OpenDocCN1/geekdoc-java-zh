    \n等等，参数是不一样的。让我们再次查看函数定义。\n\n```javascript\nArenaWithFence(\n  5,\n  20,\n  1,\n\
    \  \"DIAMOND_BLOCK\",\n  \"AIR\"\n);\n```\n\n如果你输入正确，就可以运行你的代码。\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_50_0.png)\n\
    \n```javascript\nfunction main() {\n  init();\n}\n\nfunction init() {\n  ArenaWithFence(\n\
    \    5,\n    20,\n    1,\n    \"DIAMOND_BLOCK\",\n    \"AIR\"\n  );\n}\n```\n\n\
    现在，运行你的模组！你应该能在 Minecraft 中看到你的竞技场了。恭喜你，你完成了第一个版本的 Spleef！\n"
