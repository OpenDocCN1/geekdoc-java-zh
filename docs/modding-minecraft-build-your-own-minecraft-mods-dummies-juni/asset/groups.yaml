- md: "\n# PROJECT 4 CAPTURE THE FLAG\n\n## ADD WANDS\n\nWands can make your game\
    \ more interesting. Follow these steps to add some:\n\n- 1. Drag the import block\
    \ into your mod.\n- 2. Type `sarah-magic-wands` in the space.\n\n```\nimport sarah-magic-wands\n\
    import sarah-CaptureTheFlag\nfunction main\n  set PlayerNames to create list with\
    \ \"YOUR MINECRAFT USERNAME\", \"YOUR FRIENDS MINECRAFT USERNAME\"\n  for each\
    \ item PlayerName in PlayerNames\n    do\n      sarah-CaptureTheFlag.give_flag\n\
    \      flag_type GLOWSTONE\n      player_name PlayerName\n      number_of_flags\
    \ 1\n      perform command \"gamemode\" for player named PlayerName\n```\n\nWhen\
    \ you open the Functions category, you'll see a lot of functions about magic wands.\n\
    \n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_110_0.png)\n\n- 3. Add a call to the\
    \ `sarah-magic-wands.give_wand_to_player` function into your main function.\n\n\
    You can find the function in the Functions category now that you've imported my\
    \ magic_wands library.\n\n# PROJECT 4 CAPTURE THE FLAG\n\n4. Pass in these as\
    \ parameters:\n\n- ExplosionWand\n- `sarah-magic-wands.light-green` (in the Functions\
    \ category)\n- Player named PlayerName\n\n| sarah-magic-wands.give_wand_to_player\
    \ name | ExplosionWand |\n| :--- | :--- |\n| wand | sarah-magic-wands.light-green\
    \ |\n| casting_player | Player named PlayerName |\n| sarah-CaptureTheFlag.give_flag\
    \ flag_type | GLOWSTONE |\n| player_name | PlayerName |\n| number_of_flags | 1\
    \ |\n\n## 5 Test your game again.\n\nYou and your friend should get a wand (which\
    \ looks like a disc) and a flag.\n\nWell that's cool! A wand shaped like a bagel.\
    \ The only thing is that the wand doesn't do anything. The next section shows\
    \ you how to attach magic to your wand.\n\n![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_111_0.png)\n\
    \n## ATTACH MAGIC TO YOUR WANDS\n\nWhat's a wand without magic? A bagel, that's\
    \ what. It's time to make your Capture the Flag a magical game:\n\n- 1. Import\
    \ the `sarah-Exploding_Projectile` library.\n- 2. Grab a js block from the Misc\
    \ category.\n- 3. Type `events.when(\"player.PlayerInteractEvent,CastSpells, player,\
    \ false)`.\n\n```\nimport sarah-Exploding-Projectile\nimport sarah-magic-wands\n\
    import sarah-CaptureTheFlag\nfunction main {\n```\n\n```\nset PlayerNames to create\
    \ list with \"YOUR MINECRAFT USERNAME\" \"YOUR FRIENDS MINECRAFT USERNAME\"\n\
    sarah-CaptureTheFlag.init\nfor item PlayerName in list PlayerNames\ndo sarah-magic-wands.give_wand_to_player\
    \ \"ExplosionWand\"\nname wand sarah-magic-wands.light_green\ncasting_player Player\
