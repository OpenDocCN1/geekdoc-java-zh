    HAVE YOU EVER PLAYED CAPTURE THE FLAG? You play like this: Each player gets at
    least one flag (actually a glowstone block). Each player hides her flag in the
    world, and if the player dies (maybe because she fell into some lava), she could
    respawn anywhere there''s a flag. The trick is to make sure you hide your flags
    well. If you run out of flags, you won''t be able to respawn anywhere.


    In this project you''re going to make a basic Capture the Flag game, play it with
    a friend, then add magic wand to make the game even more fun. Everyone needs a
    bit more magic, right?


