  md: '# PROJECT 2 SPLEEF


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_41_0.png)


    ONE OF THE HARDEST (BUT ALSO FUN!) MINECRAFT MODS THAT YOU CAN MAKE IS A MINIGAME.
    A minigame is a game inside Minecraft.


    Spleef is where a player walks around a platform and makes a block disappear by
    stepping on it. Using just this idea, you can make a lot of different versions
    of Spleef, like:


    +   - Players have to try and not fall into the lava that you put underneath the
    platform. (It''s like the version of Lava you play in your living room!)


    +   - After you put lava underneath the platform, and you put other entities (like
    creepers) in the arena, players try to make the other entities fall into the lava.


    +   - Add platforms on top of each other. Players have to collect items on each
    level before they fall through to the level beneath.


    +   - In a multiplayer game, players have to try not to fall before the other
    player falls.'
