  md: '# PROJECT 1 START MODDING


    # CONNECT TO THE LEARNTOMOD SERVER


    With LearnToMod, you can play in either Creative mode or Survival mode, whichever
    you prefer.


    Follow the steps that you see onscreen in the Minecraft Connect badge:


    +   1 Click Play on the Minecraft home screen.


    +   2 Choose Multiplayer.


    +   3 Click Add Server.


    +   4 Type Learn To Mod As as the server name.


    +   5 Type play.learntomod.com as the server address.


    +   6 Click Done.


    +   7 Click Join Server.


    This world is what you should see. It''s like a waiting room. You can explore
    this world while Minecraft finds a new world (where you can test your mods). You
    probably won''t have to wait more than 5 minutes. Be patient — it''s not too long!


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_17_0.png)'
