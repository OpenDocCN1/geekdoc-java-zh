    **IN THIS PROJECT, I EXPLAIN HOW TO USE THE LEARNTOMOD ONLINE SOFTWARE.** I also
    explain how to connect to the LearnToMod multiplayer Minecraft Server, and show
    you how to use the basic tools, such as invisible robots, that you need in order
    to make your own, fun-filled mods.


    # KNOW WHAT MINECRAFT MODDING IS


    Video games are made up of code. Thousands of lines of code. Code that lets players
    — players like you — explore new worlds and interact with characters.


    Some games, like Minecraft, let players add their own code to create new worlds,
    challenges, or characters.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# PROJECT 1 START MODDING


    Mods, which is short for modifications (or changes), can be almost any task. A
    task is something you do, like create a tower or make a mountain explode with
    TNT.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_11_0.png)


    You can make these tasks using mods:


    +   - Texture: Change the way the world looks by loading a new texture pack.


    +   - Block interaction: Cause an explosion whenever the player destroys a wood
    block type.


    +   - New block: Create new blocks, like an ultra-TNT block that makes a bigger
    explosion.


    +   - Minigame: Create a minigame within a world. The projects in this book help
    you do that.


    +   - Large structure: Create huge structures (that would take a long time to
    make by hand but take no time with code).


    # USE THE LEARNTMOD ONLINE SOFTWARE


    The LearnToMod online software walks you through coding challenges. When you complete
    a challenge, you earn a badge. Check out the next sections to get started with
    LearnToMod.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_11_1.png)


    > Get the LearnToMod online software at mod.learntomod.com.


    This is the software that you''ll use for the projects in this book. The badges
    will,lead you through learning coding and different ways to make neat mods.'
  merge: -1
  pgno: 11
