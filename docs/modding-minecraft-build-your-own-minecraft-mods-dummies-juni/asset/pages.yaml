- img_proc: true
  md: '# PROJECT 2 SLEEF


    # START: CREATE A BASIC SCENE


    Start by drawing an idea on paper or building it in Minecraft without mods. Start
    thinking about how the scene will affect your players. Later, when you build,
    you can make the arena bigger or add details like colors.


    For example, a game where you use the normal Minecraft world is different from
    a game where you''re in a 20 x 20 arena with walls. In the Minecraft world you
    have never-ending space, but in the arena you only have a 20 x 20 area. You play
    differently depending on what kind of space you''re in.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_43_0.png)


    > The design process is iterative, which means that you repeat each step multiple
    times. That’s what the gameplay loop is for. Even if you make a decision early
    on, you can make a change later.


    As you build Sleef, you might start by creating a small world. As you iterate
    through the gameplay loop (challenges, goals, rewards), you make the world larger
    — eventually making it infinitely large, as it is today.


    # GOAL: ADD A WAY TO WIN AND LOSE


    Some games may be difficult to make at first.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_43_1.png)


    > Just break up the parts of the game according to the gameplay loop pieces. Then
    you can see a way to make a simple version of the game by creating a basic scene
    and a way to win (or lose).


    For example, if you were playing a super-simple version of Minecraft in Survival
    mode, the goal would be to not die at night. It wouldn’t be hard to survive, because
    there would be no enemies. That’s when you add the simplest feature: the hearts.
    And you add logic to the game to ask players whether they want'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'to respawn whenever they run out of hearts. Again, at this point the game might
    not be much fun, but when you reach the next steps (the challenge, followed by
    the reward), you start to add enemies and ways that players can earn back hearts.


    # CHALLENGE: MAKE IT HARDER TO WIN


    Your game gets interesting when you start making it hard to beat. At first, you
    might want to offer a small challenge. Don’t worry: You can iterate up to the
    more difficult challenges as you go through the gameplay loop.


    For example, in a simple game, the first challenge could be one creeper that tries
    to attack. This challenge makes the game more difficult. As you iterate through
    the gameplay loop, you can start adding more creepers or even creatures, and then
    add items for the player to use as defense.


    # REWARD: MAKE PLAYERS WANT TO WIN


    Who doesn’t like to get rewards? A sticker, some candy, a No Homework pass?


    Rewarding your players makes your game fun for them. If they’re not going to get
    rewards, what’s the point of playing?


    Lots of things can be rewards:


    +   - Moving to the next level.


    +   - Items like stars and coins.


    +   - Coins for buying items that help them beat other levels.


    In a simple game, you can give a player full health after finding an Instant Health
    potion. Along the same lines, if the player is playing at the Peaceful difficulty
    level, just staying alive and not getting hurt is rewarded with health.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# PROJECT 2 SLEEF


    # PLAN AND TRY TEST CASES


    Before playing your mod, figure out the different test cases to make sure that
    your game is working properly.


    Test cases are different ways to check your mod to make sure it''s working.


    Before you write a test case, make two lists that say


    +   ** What you''ll test:** For example, breaking the melon block.


    +   ** What you think will happen:** For example, the game mode switches to Survival,
    and blocks below you disappear after one second.


    If your test case passes, you know that the mod is correct. If something doesn''t
    do what you thought it should, debug your code.


    In Minecraft, you can''t tell the game that you no longer want to trigger events.


    To trigger an event means that Minecraft recognizes the event has happened and
    then calls the function that was set up in the event call.


    For example, the SetupPlayer function has an event setup block in it. When the
    player respawns, this event is triggered after two seconds, and then it sends
    the player to the middle of the arena.


    But you don''t always want events to be triggered when you''re testing. For example,
    in Spleef you replace only the block below with air if you''re walking on the
    arena''s diamond blocks. If you''re playing the Sleef mod and then decide to explore
    a cave, you start to fall through the ground.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'You can get an event to stop triggering. You have two ways to do that:


    +   - Disconnect from the server and reconnect.

    - Open your mod chest. Click the End Events icon.


    # DEBUG YOUR CODE


    Debugging is another step in coding. Not even the best coders write something
    perfectly the first time. And when a coder — even an expert — makes a mistake,
    she debugs to find the mistake and fix it.


    To debug means to go through code, block by block, and make sure it''s working.
    You might have to disable some blocks to run the mod. (Do that by clicking the
    block and then clicking Disable Block.)


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_46_0.png)


    One of the best ways to debug is to disable all the code expect for a small part,
    then run the mod to see if it does what it should. (Test it!) If it does work,
    enable one more line of code and test it again. Keep doing this until you find
    the one line (or block) of code that gives into the error.


    You''re going to run into different errors, so I can''t fix the problems for you.
    I can tell you that when you find the block, you''ll probably be able to figure
    out what''s wrong by reading your code and comparing what''s actually happening
    to what you want to have happen.'
  merge: -1
