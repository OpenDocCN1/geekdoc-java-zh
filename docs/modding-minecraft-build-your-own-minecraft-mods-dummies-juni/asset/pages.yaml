  md: '# PROJECT 2 SLEEFE


    # 3 Look through the code and see what it''s doing


    Notice a couple things:


    +   - There''s no main function, because this mod can''t run on its own in Minecraft.
    Mods that don''t have a main function have to be called from other mods. I explain
    in the next section.


