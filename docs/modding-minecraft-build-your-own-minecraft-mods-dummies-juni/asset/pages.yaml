  md: '# INTRODUCTION


    SO YOU WANT TO MOD MINECRAFT – THAT’S A GREAT IDEA!

    You''re about to be transformed from a Minecraft player into a Minecraft modder.
    To get there, you have to code. You can handle it, because you''ll use skills
    you already have — logic, creativity, math, gaming, and problem solving — to design,
    build, test, and share Minecraft mods. This book tells you everything, from building
    a large arena to making a multiplayer game that you can play inside Minecraft
    with your friends.


    # ABOUT MINECRAFT AND LEARNTOMOD


    Minecraft modding used to be only for expert coders. Not anymore. LearnToMod helps
    students just like you through the challenges of Minecraft modding. It explains
    coding ideas and shows how much fun it can be to start making mods. LearnToMod
    has over 200 badges that guide you, but you can make your own mods.


    The LearnToMod online software teaches you how to make modifications, or mods,
    that you can run in the multiplayer version of Minecraft on your very own Minecraft
    server.


    Get LearnToMod at mod.learntomod.com. With this book, you get free access to LearnToMod
    for 60 days. Go to www.dummies.com/go/moddingminecraft for the trial information.


    # ABOUT THIS BOOK


    Modding Minecraft has projects that help you design, build, and test each mod,
    from start to finish. You can play these minigames inside Minecraft. The earlier
    mods are simpler, so you might want to try the projects in order.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'How are you going to see what code to enter if I''m not there with you? I''ll
    show instructions and code examples — actual pictures of my screen.


    Code is in monoFont. If you''re reading this as an ebook, you can tap web addresses
    to visit websites, like this: www.dummies.com.


    Some figures will have a magnifying glass, like the glass is drawing attention
    to the parts of the screen that you use. The highlighted text draws your attention
    to the figure.


    Working with LearnToMod is super simple: I just give you steps like "Drag a function
    into the programming environment" or "Click the Minecraft category and then Players."
    Or I may tell you to click a link or a tab.


    # ABOUT YOU


    Everybody has to start somewhere, right? I had to start writing this book by assuming
    that you''re comfortable doing this stuff:


    +   Typing on a computer and using a mouse. You may know how to use a Windows
    system or a Mac; either one will do. All coding takes place in a web browser —
    and on any browser on either platform. This book shows LearnToMod on a Mac using
    the Chrome browser.


    +   Getting around on a website. You can click a link or find a website easy peasy.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_8_0.png)'
