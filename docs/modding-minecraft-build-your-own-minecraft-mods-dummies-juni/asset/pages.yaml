  md: '# INTRODUCTION


    **Playing Minecraft.** You don''t need to be a Minecraft expert and you don''t
    have to know how to code. You can play on Windows or a Macintosh, The Pocket Edition,
    which is played on mobile devices, doesn''t work with LearnToMod.


    **Doing basic math.** That includes adding whole numbers (like 2+2), and logical
    operations (like knowing that 3 is more than 2).


    # ABOUT THE ICONS


    As you read through the projects in this book, you''ll see a few icons. The icons
    point out different things:


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_9_0.png)


    Watch out! This icon comes with important information that may save you from trouble
    that modders sometimes have.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_9_1.png)


    The Remember icon comes with ideas that you should keep in mind.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_9_2.png)


    The Tip icon marks advice and shortcuts that can make modding easier.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_9_3.png)


    The Fun with Code icon describes how the modding you''re doing relates to the
    bigger picture of coding.'
