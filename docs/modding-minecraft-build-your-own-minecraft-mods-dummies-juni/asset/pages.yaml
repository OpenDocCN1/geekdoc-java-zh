  md: '# PROJECT 3 MONSTER ARENA


    # CLEAN YOUR ROOM


    Variables are just a way of naming a piece of information, data, or an object.
    It''s kind of like my name is Sarah and when my mom wants me to do something she
    says, "Sarah, clean your room." That lets me know that I have to be the one to
    clean my room.


    Computers work the same way! You, as a coder, will name information. When you
    want the computer to use that information, use its name. For example, you made
    a variable that keeps track of the block that''s broken. That way you can ask
    the computer to test whether it was the same type as a MELON_BLOCK.


    This code shows how to create these two variables in the Setup function.


