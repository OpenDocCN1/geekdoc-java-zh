    follow these steps:


    +   In a web browser, go to mod.learntomod.com.


    +   Fill out the Sign Up Form.


    +   Another dialog box opens.


    +   In the top of the dialog box, type the access key that you got in this book.


    +   Make a nickname.


    +   The dashboard (also known as the home screen) opens.


