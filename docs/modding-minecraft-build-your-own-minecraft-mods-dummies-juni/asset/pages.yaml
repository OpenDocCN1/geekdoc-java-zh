  md: '# PROJECT 1 START MODDING


    When you''re ready to write your first Minecraft mod, follow the steps here.


    In this section, I help you earn the second badge, Write Your First Mod. You can
    find these steps in the left column of the badge. Just watch the video or read
    the instructions.


    Make sure you''re logged in at mod.learntomod.com before starting with these steps:


    +   1 Click the Learn tab.


    +   2 Click the Write Your First Mod badge.


    ![](img/5dcf8597fd9b2cbf8b4cc83e4c8a6e95_21_0.png)


