  md: '# # 4.1 HTTP and the Internet


    Some basic knowledge of how the Internet functions may be helpful on the off chance
    that you haven''t programmed for the Web recently. The HyperText Transfer Protocol
    (HTTP) identifies how site pages are exchanged over the Internet. HTTP is the
    system used to exchange or pass on data on the World Wide Web. Its unique reason
    for existing was to give an approach to publish, distribute and recover HTML pages.
    The World Wide Web Consortium (W3C) and the Internet Engineering Task Force harmonized
    the development of HTTP, which are request-and-response protocols that join customers
    and servers. The client at the starting point, normally a web browser, is alluded
    to as the user agent. The destination server, which stores or builds resources
    as well as enclosing HTML documents and pictures, is known as the original server.
    Between the user agents and root server, there may be few intermediaries such
    as proxies. A HTTP customer starts a request by setting up a Transmission Control
    Protocol (TCP) connection to a specific port on a remote host (port 80 is the
    default). An HTTP server listening on that port waits for the customer to send
    a request message.


    After accepting the request, the server sends back a status line, as “HTTP/1.1
    200 Alright,” and its own particular response. Contingent upon the status, this
    reactionary response could be the request file, an error message, or some other
    data. HTTP is made on top of TCP, which is itself layered on top of Internet Protocol
    (IP).


    The two are often termed as TCP/IP. Applications on organized hosts can make associations
    with each other, and afterward exchange of information. The protocol ensures solid
    conveyance of information from sender to collector. TCP underpins a hefty portion
    of the Internet’s most prominent application protocols and applications, comprising
    of the Web, email, and Secure Shell (SSH).'
  merge: -1
