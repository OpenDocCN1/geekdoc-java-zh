    HTML document to the server. On the off chance that the result incorporates an
    external CSS style sheet, the program issues a different request for that style
    sheet putting the page on display.


    Handling PHP on the server is called server-side processing. When you ask for
    a web page, you trigger an entire chain of reactions. Figure represents this association
    between your PC and the web server, which is the host of the web website.


    Here is the process of server-side processing:


    +   1. You enter a web page address in your browser''s location bar.

    2. Your browser separates that address and sends the name of the page to the web
    server. For instance, http://www.phone.com/directory.html would request the page.html
    from www.phone.com.

    3. A program on the web server, called the web server process, takes the request
    for directory.html and searches for this particular file.

    4. The web server reads the directory.html from the web server''s hard drive.

    5. The web server gives back the content of directory.html to your browser.

    6. Your web program utilizes the HTML markup that was returned from the web server
    to construct the interpretation of the web page on your PC.


    The HTML file named directory.html is known as a static web page on the grounds
    that everybody who requests the directory.html page gets precisely the same page.


    For the web server to alter the returned page, PHP and MySQL are added to the
    blend.


