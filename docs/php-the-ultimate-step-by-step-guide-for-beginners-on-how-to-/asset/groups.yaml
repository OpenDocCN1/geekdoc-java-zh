    ## Including and Requiring PHP Files


    To make your code easier to read, you can put your functions in a different file.
    Numerous PHP add-ons that you download off the Internet contain functions which
    have been put into the records by now that you basically include in your PHP program.
    On the other hand, PHP gives four functions that empower you to embed code from
    different files:


    - incorporate

    - require

    - include_once

    - require_once


    Each and every one of the include and require functions are quite similar in their
    functionality irrespective the way in which they handle a resource which cannot
    be retrieved. For instance, include and include_once give a notice if the resource
    isn''t retrievable and tries to proceed with execution of the program. The require
    and require_once functions give stop preparing of the specific page if they can’t
    recover the resource. Presently we’re going to get more specific about these four
    functions.


    ## The include Statement


    The include statement permits you to incorporate and join other PHP scripts to
    your script. You can consider it just taking the included record and embedding
    it into your PHP document. Case 7.7 is called add.php.


    Illustration 7.7. A sample include document called add.php


    ```php

    <?php

    function add($x, $y) {

    return $x + $y;

    }

    ?>

    ```


    Illustration 7.8 presumes that add.php is in the same directory as the script.

    Illustration 7.8. Utilizing the include function


    ```php

    <?php

    include(''add.php'');

    echo add(2, 2);

    ?>

    ```


