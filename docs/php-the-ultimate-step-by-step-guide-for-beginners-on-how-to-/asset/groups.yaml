    注册成功!\");</script>'; // 提示用户\n    echo '<script>window.location.assign('register.php');</script>';\
    \ // 跳转到 register.php\n}\n?>\nmysql_connect(\"Server name\",\"Server Username\"\
    ,\"Server Password\") - 用于连接我们的 XAMPP 服务器的结构。localhost 或 127.0.0.1 是服务器名称。默认用户名是\
