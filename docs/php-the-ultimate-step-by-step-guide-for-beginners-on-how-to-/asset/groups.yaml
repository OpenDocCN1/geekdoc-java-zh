    # INTRODUCTION


    Are you inspired by the idea of making your own website? Ever thought about how
    cool it is to have a website that has a log-in/log-out functionality? Need to
    figure out how to Create, Read, Update or Delete (CRUD) records in a database?
    Have you lost track of your past instructional exercises? Having considered all
    these questions, I''m going to show you how to make a website without any outside
    help where you will know each every subtle element on the PHP website code functions.
    If you are new to back-end web development, this instructional book is for you.


    I''ll clarify everything in your point of interest so that you won''t need to
    research some specific techniques being used in PHP. To keep things as straightforward
    as possible, we won''t be using any complex systems. Additionally, I won''t be
    concentrating on the websites we design after the functionalities. However, it''s
    anything but difficult to execute the design. What this book will be doing is
    an easy yet exhaustive analysis of the entire PHP Coding process.


    So, what is PHP? In the event that you need a site designed, you may need to know
    the response to this question. Consider in 1999 it was assessed there were more
    than 100,000 sites utilizing PHP to upgrade their own site. Today, there are more
    than 1,000,000 sites utilizing PHP.


    PHP is a common and widely used programming language for web development. PHP
    stands for Hypertext Preprocessor. In the early years of the Internet, most destinations
    were static content pages. As the Internet advanced, people needed sites with
    more functionality, for example blogs and forums. PHP was the ideal instrument
    and still today, PHP is an exceptionally strong and experienced programming language.
    It was initially released in 1995 and has developed into one of the favored languages
    for site development. It runs on the server side and is exceptionally secure.
    Now that it''s out in the open, most organizations give PHP bundles.


    In the event that you require an interactive site with components like blogs and
    forms, you can learn PHP yourself. A great number of people don''t have room or
    capability to take in a programming language e.g. PHP and choose to acquire sites.
    These packs, however, offer fundamental sites that can work for few individuals,
    have little functionality and offer restricted highlights. In the wake of battling
    with it, this customer developed the site. After finishing it, now has a site
    that is lovely and has interactive elements beyond what a site pack could ever
    give. This is the difference of PHP!


    # CHAPTER 1: SETTING UP YOUR SERVER


    Since now you have everything set and ready to go, as the nuts and bolts of programming
    goes, we should begin by making a basic output of “hello world” on the server.


    To start with, go to the catalog where you introduced XAMPP (commonly in C:\xampp).
    From that point, go to the htdocs envelope (commonly in C:\xampp\htdocs) and make
    a folder named “MyFirstWebsite”. From that point, you have now made a URL for
    your website. That envelope will be utilized to supply all website records (.html,
    .php, .css, .js, etc.). Open up your content manager and we can now begin!


    img/8e0a31fe30a159a13fdfed1340b5ed7_8_0.png


    Use Sublime Text. If you’re using Notepad++ or any other processors, it’s alright.
    It’s not much of a major component yet because it’s only an inclination which
    one might want to utilize.


    What we will do is a basic HTML page and presentation “hello world” from the server,
    utilizing essential PHP language. We will then sort the following:


    # ABOVE CODING:


    ```html

    <html>

    <head>

    <title>My first PHP Website</title>

    </head>

    <body>

    <?php

    echo "<p>Hello World!</p>";

    ?>

    </body>

    </html>

    ```


    Save the document to the "MyFirstWebsite" folder and name it as "index.php". (Index
    as seen on the top bar of the picture)


    Given you have the record, we should now open your XAMPP control board. If it
    doesn''t show up on your desktop, it is situated in your XAMPP folder as seen
    on the picture:


    img/8e0a31fe30a159a13fdfed1340b5ed7_9_0.png


    Now that it''s there, Run Apache and MySQL by tapping the "Start" catch on the
    activities segment. You ought to see a PID(s) and the default port number. Apache
    is the name of our web server in which it will handle every one of the documents
    and also serve as the correspondence to the web program. MySQL is our database
    which will store the majority of our data.


    Open up your web program and in the location bar, click localhost. You ought to
    see the menu of XAMPP.


    On the event that it''s the first time when you run it, it will ask what language
    you would incline toward, just pick one and it will lead you to the menu. On the
    event that you will see the index is localhost/xampp, it''s the place the default
    page drives regardless of the whether you write in localhost.


    img/8e0a31fe30a159a13fdfed1340b5ed7_10_0.png


    On the event that you will see that the URL is MyFirstWebsite, it is gotten from
    the htdocs folder and it naturally parses documents that are named “index” (Be
    it index.html, index.aspx, and so on), which serves as the default page. However,
    writing localhost/MyFirstWebsite/index.php is important. You can also make your
    custom name for the URL by essentially renaming the folder, but how about we simply
    stick to MyFirstWebsite for now.


    Note: If you don''t have a record named index and you enter the URL, you will
    get a slip 404 for not having the document on the server. In case you do have
    distinct documents that are not named index<extension>, you need to determine
    the particular record name. E.g: localhost/MyFirstWebsite/page.php.

