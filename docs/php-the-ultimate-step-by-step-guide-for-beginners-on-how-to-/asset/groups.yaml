    PHP 提供了几个函数让你了解不同的记录属性。PHP 能够从你的框架记录中读取信息，并向记录中写入信息。另一方面，它的功能并不止于此。它还配备了一套完整的、高亮的文档和目录控制
    API，允许你：


    - 查看和修改文档特征

    - 读取并列出目录内容

    - 修改文档权限

    - 将文档内容检索到各种本地信息结构中

    - 根据特定示例搜索文档


    这种通过 API 进行的大部分文档控制功能都是强强大且灵活的。PHP 拥有大量的特有命令，包括所有的文档控制命令。


    ## 13.3 文件操作


    既然你知道一个文件存在，你可能认为你已经完成了，但实际上并非如此。仅仅文件在那里并不意味着你可以读取、写入或执行它。要检查这些属性，请使用 `is_readable`
    检查读取权限，使用 `is_writable` 检查写入权限，并使用 `is_executable` 检查执行文件的能力。每个函数都接受一个文件名作为参数。除非你确定文件与你的脚本在同一个目录中，否则你必须在文件名中指定文件的完整路径。你可以使用连接符将路径和文件名结合在一起，例如：


    ```

    $file_name = $path_to_file . $file_name_only;

    ```


    URL 包装器


    PHP 构建了两个用于文件系统函数的 URL 约定，包括 `open` 和 `duplicate`。除了这两个包装器外，从从 PHP 4:3.0 开始，你可以利用
    PHP 脚本和 `stream_wrapper_register` 创建自己的包装器。默认包装器是 `file://`，用于 PHP，并且它是本地文件系统。如果你指定一个相对路径（即不以
    `/`、`\` 或 Windows 驱动器号如 `C://` 开头的路径），则该路径相对于当前工作目录。


    通常情况下，这是脚本所在的地方，除非显然它被更改了。通过一些函数，例如 `fopen` 和 `file_get_contents`，`include_path`
    也可以用来查找相对路径。


    ## 13.4 调用系统调用


    对于一个基于 PHP 的网站来说，允许文件传输是一个非常基本的要求。例如，在一个网络博客页面上，客户端可能需要传输一张图片来配合他的帖子。


    由于你将在第 17 节中计划一个网站，我们将逐步介绍传输文件的步骤。PHP 允许你通过数据结构来实现此。


    当你使用文件传输表单字段时，客户端程序会弹出一个文件选择对话框，所以你不需要担心处理这一点。在文件传输字段中包含的代码是 `<input type="file"
    name="file">`。你应该在结构标签中包含 `enctype="multipart/form-data"`。这允许随表单提交发送文件。


    ## 第 14 章：XHTML


    既然你已经学习使用 PHP 和 MySQL 构建动态页面的基础，早点研究构建你网站页面基础的 HTML 标记的变化。你将了解到 XHTML、它的要求以及为什么它值得投入额外的精力来创建。请记住，为了从你的
    PHP 脚本创建高质量的 Web 内容，标记必须符合标准。将 XHTML 输出视为在 PHP 和数据库函数处理后请求页面时的完成品。我们还将检查你的脚本生成的
    XHTML 输出以捕获任何错误。


    XHTML 代表可扩展超文本标记语言（Extensible Hyper-Text Markup Language）。XHTML 是一种类似于 HTML 的标记语言，但根据
    XML 的要求，它具有更严格的语法。HTML 是基于 SGML 的，SGML 虽然灵活但处理起来复杂，而 XML 简化了 SGML，使其在稍微灵活的情况下更容易转换。XHTML
    语言结构看起来非常像 HTML 语言，使用更明显且较少的符号（`<`、`>`）来描述标签，但对标签如何传递有更严格的要求。满足这些语法要求的 XHTML 文被称为良好的（well-formed），而满足语言结构以及
    DTD 中包含的辅助规则 HTML 文被称为有效的。可以使用任何标准 XML 库自然处理 XHTML，而大多数 HTML 使用通常使用为 HTML 处理修改的宽松解析器。你可以从许多方面将
    XHTML 视为 HTML 和 XML 的交汇，因为它是两者的重构。展示变化的最简单方法是显示一个 HTML 文档及其对应的 XHTML 文档。首先，这是一个简单的
    HTML 4.0 文档：


    这里发生了什么变化？


    - 在开头有另一个 XML 声明，标识文档为 XML 1.0，使用 UTF-8 字符编码。如果你的文档使用 UTF-8 编码（或 ASCII，它是其子集），你可以完全跳过它。

    - `DOCTYPE` 呈现发生了细微变化。

    - 所有的 HTML 标记现在都是小写的。（XHTML 规范要求小写。）

    - `html` 元素包含一个 `xmlns` 属性（描述本文后面描述的 XHTML 命名空间），以及一个 `xml:lang` 属性，补充了用于 XML
    处理器的 `lang` 属性。

    - `<BR>` 标签现在是 `<br/>` 标签，结尾的斜杠（`/`）表示它是一个“空元素”且不会有结束标签。

    - 有另一个结束标签 `</p>`，它结束了 `body` 内部第一行的 `<p>`。XHTML 不允许你在没有结束标签的情况下拥有开始标签，除非使用用于
    `<br/>` 的空元素文档。尽管这太短了无法展示很多，但打开和关闭标签的要求也需要是对称的；`<b>` 是正确的，而 `<i>` 是错误的。

