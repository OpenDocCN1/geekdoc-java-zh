    # 绪言


    你是否被创建自己网站的想法所启发？是否曾想过拥有一个具有登录/退出功能的网站有多酷？你是否需要学会如何在数据库中创建、读取、更新或删除（CRUD）记录？你是否已经忘记了过去的教学练习？在考虑了这些问题后，我将向你展示如何在没有任何外部帮助的情况下制作网站，你将了解
    PHP 网站代码函数中的每一个细微元素。如果你是后端 Web 开发的新手，这本教程正是为你准备的。


    我将澄清你感兴趣的每一个点，这样你就不需要研究 PHP 中使用的某些特定技术了。为了尽可能保持简单，我们不会使用任何复杂的系统。此外，我不会专注于功能实现后的网站设计。然而，执行这些设计绝非难事。这本书将对整个
    PHP 编码过程进行简单而详尽的分析。


    那么，什么是 PHP 呢？如果你需要设计一个网站，你可能需要这个问题的答案。回想 1999 年，估计有超过 100,000 个网站使用 PHP 来升级自己的网站。今天，有超过
    1,000,000 个网站在使用 PHP。


    PHP 是 Web 开发中常用且广泛使用的编程语言。PHP 代表超文本处理器（Hypertext Preprocessor）。在互联网早期，大多数目标都是静态内容页面。随着互联网的发展，人们需要具有更多功能的网站，例如博客和论坛。PHP
    是理想的工具，直到今天，PHP 仍然是一门非常强大且成熟的语言。它最初于 1995 年发布，已成为网站开发最受欢迎的语言之一。它运行在服务器端，极其安全。现在它已经开源，大多数机构都提供
    PHP 运行包。


    如果你需要一个包含博客和表单等组件的交互式网站，你可以自己学习 PHP。许多人没有空间或能力学习编程语言（例如 PHP），并选择购买网站包。然而，这些包提供的基础网站只能供少数人使用，功能有限，且亮点受限。在与它斗争之后，这位客户自己开发了网站。完成之后，他现在拥有了一个精美且具有交互元素的网站，这些元素超出了网站包能提供的任何功能。这就是
    PHP 的区别！


    # 第一章：设置你的服务器


    既然现在你已经准备就绪，从编程的螺丝和螺母来说，我们应该从在服务器上输出一个简单的“hello world”开始。


    从首先，进入你安装 XAMPP 的目录（通常在 `C:\xampp`）。从那里开始，进入 `htdocs` 文件夹（通常在 `C:\xampp\htdocs`）并创建一个名为“MyFirstWebsite”的文件夹。从现在起，你就为你的网站创建了一个
    URL。该文件夹将用于存放所有的网站记录（.html, .php, .css, .js 等）。打开你的内容管理器，我们现在开始吧！


    img/8e0a31fe30a159a13fdfed1340b5ed7_8_0.png


    使用 Sublime Text。如果你在使用 Notepad++ 或任何其他编辑器，也可以。它现在还不是一个主要组件，因为这只是人们可能想要使用的偏好。


    我们将做的是使用基础 PHP 语言创建一个简单的 HTML 页面，并从服务器展示“hello world”。然后我们将进行以下操作：


    # 上述代码：


    ```html

    <html>

    <head>

    <title>My first Website</title>

    </head>

    <body>

    <?php

    echo "<p>Hello World!</p>";

    ?>

    </body>

    </html>

    ```


    将文件保存到“MyFirstWebsite”文件夹中，并将其命名为 `index.php`。（如图顶部的地址栏所示）


    既然你有了文件，我们现在应该打开 XAMPP 控制面板。如果它没有出现在桌面上，它位于你的 XAMPP 文件夹中，如下：


    img/8e0a31fe30a159a13fdfed1340b5ed7_9_0.png


    既然它已经在那里，点击服务部分的“Start”按钮运行 Apache 和 MySQL。你应该看到 PID(s) 和默认端口号。Apache 是我们的 Web
    服务器名称，它将处理每一个文件。MySQL 是存储大部分数据的数据库。


    打开你的浏览器，并在地址栏输入 `localhost`。你应该能看到 XAMPP 的菜单。


    如果是第一次运行，它会询问你倾向于哪种语言，只需选择一个，它将引导你进入菜单。如果你看到索引是 `localhost/xampp`，这是无论你是否输入 `localhost`
    都会显示的默认页面。


    img/8e0a31fe30a159a13fdfed1340b5ed7_10_0.png


