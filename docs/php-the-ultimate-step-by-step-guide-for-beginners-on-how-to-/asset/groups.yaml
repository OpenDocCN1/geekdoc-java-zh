    Web 功能。虽然 PHP 非常适合 Web 应用程序开发，但它本身并不存储数据。为此，你需要一个数据库。PHP 工程师的首选数据库是 MySQL，它的作用类似于广泛认可的任务，涉及存储和恢复特定的客户端数据到你的供应标准中。PHP
    可以轻松地访问 MySQL，并且它们运行得非常好。一个内置优势是 PHP 和 MySQL 可以运行在不同类型的 PC 和工作框架上，包括 Mac OS X、基于
