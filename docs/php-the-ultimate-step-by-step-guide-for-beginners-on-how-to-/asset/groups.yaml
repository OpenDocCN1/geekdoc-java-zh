    16


    在第二个表达式中，由于括号覆盖了默认优先级，乘法最后执行。


    PHP 有几个优先级级别，多到如果不查阅参考资料很难记录。


    # 结合性


    所有运算符按照特定的方向处理其运算符。这种方向被称为结合性（associativity），它取决于运算符的类型。大多数运算符从左到右处理，这被称为左结合。例如，在表达式
    `3 + 5 - 2` 中，先处理 3 和 5，然后从结果中减去 2，得到 8。虽然左结合意味着表达式从左到右评估，而右结合则意味着相反。


    由于赋值运算符具有右结合性，它是例外之一，因为右结合性并不常见。表达式 `a=$b=$c` 的形成是因为 `$b` 被赋值为 `$c`，然后 `$a` 被赋值为
    `$b`。这为大多数变量分配了相同的值。如果赋值运算符是右结合的，变量可能没有值。


    如果你认为这不可理解，请不要担心。这些原则在你无法理清指令时才会发挥作用。请记住，你应该始终在表达式中使用括号来使你的真实含义更清晰。这既有助于 PHP，也有助于其他想要阅读你代码的人。


    如果你不小心使用了 `&` 而不是 `&&` 或 `|` 而不是 `||`，你将误解运算符。`&` 和 `|` 一次只查看二位信息。


    PHP 将将你的操作数转换为二进制并应用运算符。


    # 关系运算符


    在第 3 章中我们查看了赋值和数学运算符。关系运算符提供了查看两个操作数并根据检查返回 TRUE 或 FALSE 的能力。评估为 TRUE 或 FALSE
    的表达式被称为布尔表达式，我们在上一个节中讨论过。这些检查包含了对相等、小于或大于的测试。这些比较运算符允许你决定何时执行某事。


    # 等于


    相等运算符双等号 (`==`) 被经常使用。使用单等号 `=` 是程序中的典型错误。


    如果操作数相等，则返回 TRUE；否则返回 FALSE。


    你经常可能需要验证两个事物是否不同。不等运算符（等号前的感叹号 `!`）检查相等的反面。


    -   “1” != “A”/有效

    -   “1” != “1”/虚假


    # 比较运算符


    你可能需要检查的不仅仅是相等。比较运算符测试两个值之间的关系。你可能在中学数学中接触过这些。它们包含了小于 (`<`)、小于等于 (`<=`)、大于 (`>`)
    和大于等于 (`>=`)。


    例如，`3<4` 是 TRUE，而 `3<3` 是 FALSE，且 `3<=3` 是 TRUE。


    # 逻辑运算符


    逻辑运算符与逻辑运算符的布尔结果配合，以构建更多的逻辑表达式；有四个逻辑运算符也是布尔运算符。


    要测试两个操作数是否都为真，使用 AND 运算符，也写为双 ampersand (`&&`)。双 ampersand 和 AND 都是逻辑运算符；主要区别是双
    ampersand 在 AND 运算符之前被评估。如果两个操作数都是 TRUE，则返回 TRUE；通常情况下，返回 FALSE。


    要测试是否其中一个操作数为为 TRUE，使用 OR 运算符，它也被写为双竖线或管道符 (`||`)。如果两个操作数中的一个或都为 TRUE，则返回 TRUE。


    要测试是否仅有一个操作数为 TRUE，请利用 XOR（异或）。当仅有一个操作数为 TRUE 时，XOR 返回 TRUE。如果两个操作数都是 TRUE，它返回
    FALSE。


    要使布尔值无效，使用 NOT 运算符，写为感叹号 (`!`)。如果操作值为 FALSE，它返回 TRUE。如果操作值为 TRUE，它返回 FALSE。


