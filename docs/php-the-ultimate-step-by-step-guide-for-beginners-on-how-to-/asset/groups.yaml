    \n```\n<?php\nsession_start();\n\n$username = mysql_real_escape_string($_POST['username']);\n\
    \n$password = mysql_real_escape_string($_POST['password']);\n\n$bool = true;\n\
    \nmysql_connect(\"localhost\", \"root\", \"\") or die (mysql_error()); // 连接服务器\n\
    mysql_select_db(\"first_db\") or die (\"无法连接到数据库\"); // 连接数据库\n\n$query = mysql_query(\"\
