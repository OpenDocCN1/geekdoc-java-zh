    use the .php extension given that if you name them something else, for example,
    .inc, it''s possible that a client can ask for the .inc record and the web server
    will give back the code stored in it. This is a security hazard, as it may expose
    passwords or insights about how your system functions can expose shortcomings
    in your code. This is on the grounds that the PHP interpreter parses just marked
    plainly as PHP.


