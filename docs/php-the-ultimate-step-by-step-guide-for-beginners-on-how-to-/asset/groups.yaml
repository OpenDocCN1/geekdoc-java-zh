    例如，如果你需要返回一个连接标题和页数的单一字段，你可以使用 `CONCAT`。


    事务


    事务强制对数据库的不同更改作为单个工作单元进行处理。要么所有进展被提交，要么全部被丢弃。当你开启事务对该表实施改进时，其他会话无法访问该表。在你的会话中，如果在升级后选择相同的信息，你可以迅速看到任何进展。


    两个命令控制你的事务。`COMMIT` 命令将进展保存到数据库。`ROLLBACK` 命令放弃进展。


