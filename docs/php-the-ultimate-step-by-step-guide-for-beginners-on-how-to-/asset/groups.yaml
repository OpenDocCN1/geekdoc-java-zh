    是用于在万维网上交换或传递数据的系统。它存在的独特理由是为发布、分发和恢复 HTML 页面提供一种方法。万维网联盟（W3C）和互联网工程任务组（IETF）协调了
    HTTP 的开发，HTTP 是一种连接客户端和服务器的请求与响应协议。位于起始点的客户端（通常是网络浏览器）被称为用户代理（user agent）。存储或构建资源（并包含
    HTML 文档和图片）的目标服务器被称为源服务器（original server）。在用户代理和源服务器之间，可能存在少数中间节点，如代理（proxies）。HTTP
    客户端通过在远程主机的特定端口（默认端口为 80）建立传输控制协议（TCP）连接来启动请求。监听该端口的 HTTP 服务器等待客户端发送请求消息。


    在接受请求后，服务器会回传一个状态行，例如“HTTP/1.1 200 Alright”，以及其特定的响应。根据状态的不同，这种反应性响应可能是请求的文件、错误消息或其他数据。HTTP
    构建在 TCP 之上，而 TCP 本身又构建在网络协议（IP）之上。


    这两者通常被称为 TCP/IP。组织化主机上的应用程序可以相互建立关联，随后交换信息。该协议确保了信息从发送者到收集者的稳健传输。TCP 支撑了互联网许多最主要的应用程序协议和应用，包括
    Web、电子邮件（email）和安全外壳（SSH）。


