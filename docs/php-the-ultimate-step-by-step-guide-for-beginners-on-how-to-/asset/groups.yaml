    输入密码： <input type=\"password\" name=\"password\" required=\"required\" /><br>\n\
    <input type=\"submit\" value=\"注册\"/>\n</form>\n</body>\n</html>\n```\n\n$_SERVER[\"\
    REQUEST_METHOD\"] == \"POST\" - 检查是否在点击提交按钮时获取了 POST 方法。POST 方法是在 html method=\"\
    POST\" 中制作的。\n\n$_POST 从表单中获取信息。对于我们的例子，是用户名和密码。\n\nmysql_real_escape_string()\
    \ - 将信息转换为字符串以防止 SQL 注入。\n\n之后，进入你的 register.php 尝试输入数据然后点击“注册”。对于我的例子，输入了 123456。它应该显示输入。这里是示例：\n\
    \n![](img/8e0a31fe30a159a13fdfed13405b5ed7_17_0.png)\n\n通过部分你已经看到了通过表单获取信息的正确方法以及如何将其添加到数据库。在你的\
