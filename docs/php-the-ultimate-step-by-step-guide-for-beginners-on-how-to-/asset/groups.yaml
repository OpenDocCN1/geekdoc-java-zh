    \n## 7.3 面向对象编程\n\n面向对象的目标与我们在讨论函数时考察的目标相同，基本上是为了让代码重用变得简单。它使用类将函数和变量组合在一起形成对象。你可以将对象看作是一个小秘密盒子，它们可以在不需要知道具体运作方式的情况下工作。\n\
