    \ have replaced flat files. They sustain various tables, connected together as\
    \ required.\n\n## 9.5 Structured Query Language\n\nSince you've characterized\
    \ a table, you can add information to it. MySQL will keep track of all details.\
    \ To manage information, use the Structured Query Language (SQL) commands.\n\n\
    Since it's been intended to effortlessly portray the relationship between rows\
    \ and tables, the database uses SQL to modify information in the tables.\n\nSQL\
    \ is a standard language used with most databases e.g. MySQL, Oracle, or Microsoft\
    \ SQL Server. It was created specifically as a language to recover, include, and\
    \ manage information that stays in databases. We'll get into the details of MySQL\
    \ in the next chapter, but we'll start with some simple commands that are easy\
    \ to use. We're going to commence with making tables.\n\n### Making Tables\n\n\
    Make use of the table commands to specify the structure of new database tables.\
    \ When you make a database table, every segment has a couple of choices as well\
    \ as data types and column names. Values that must be supplied when adding information\
    \ to a table are specified through the NOT NULL keyword. The PRIMARY KEY keyword\
    \ tells MySQL which segment to use as a key field. Subsequently, you have MySQL\
    \ assign key values using the AUTO_INCREMENT keyword automatically.\n\nTo make\
    \ tables, later chapters contain essential data if you're occupied with running\
    \ the SQL code. It clarifies how to access the MySQL client, allot security permissions,\
