    specializations do away with the need for autoboxing and hence improve performance.

    The following code demonstrates this:


    ```

    Supplier<Integer> integerSupplier = () -> new Integer(

    Random().nextInt());

    ```


    This code creates a Supplier that returns a random integer less than 100. Since
    the primitive specialization is not used, the value returned by Random class needs
    to be wrapped as an Integer.

