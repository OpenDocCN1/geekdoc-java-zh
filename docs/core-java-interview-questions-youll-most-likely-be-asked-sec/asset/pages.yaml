    Data Types, Variables and Arrays


    021. **What are the possible ways of declaring an array of short data type?**


    Answer:


    You can declare an array of short data type in any of the following ways:


    +   a. `short a1[];`

    b. `short [] a2;`

    c. `short b1[] [];`

    d. `short [] [] b2;`

    e. `short [] c1 = {2,3,4};`

    ff. `short c2[] = {2,3,4};


    Approaches **a** and **b** declare a single dimensional short array.

    Approaches **c** and **d** declare a two–dimensional short array.

    Approaches **e** and **f** declare a single dimensional short array and initialize
    it. In all the approaches, the square brackets can be placed either after the
    variable name or after the short keyword.


