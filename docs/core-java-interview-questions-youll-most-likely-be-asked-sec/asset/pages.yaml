  md: '# CHAPTER 07


    # Inner Classes


    080. What is an inner class? What are the different types of inner classes?


    Answer:


    An inner class is any class defined inside the body of another class. There are
    4 types of inner classes as follows:


    +   Nested class: Class is defined within the body of another class. It has access
    to all the members of the outer class.


    +   Static nested class: A nested class that is known as a static nested class.
    It cannot access non–static members of the outer class.


    +   Method local inner class: A class that is defined inside a method of another
    class is known as a method local inner class. Such an inner class can only access
    final members of the outer class.


    +   Anonymous inner class: A class that has no name and can be instantiated only
    once it is defined is known as an anonymous inner class. It does not have a constructor
    as it does not have a name. It cannot be static. The class definition ends with
    a semicolon.


