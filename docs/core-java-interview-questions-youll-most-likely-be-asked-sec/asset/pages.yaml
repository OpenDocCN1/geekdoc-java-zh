    # 013. How will you define an Identifier?


    Answer:


    Identifier is the name given to a class, method, variable or interface. There
    are several rules for Java identifiers. These are as follows:


    +   - Identifiers must start with an alphabet, the dollar sign ($), or an underscore
    character (_)

    - Identifiers can contain alphabets, digits, $ and _

    - Identifiers cannot contain special characters

    - Identifiers are case sensitive


    Some of the examples of legal identifiers are shown below:


    +   - b

    - $a

    - book

    - author1

    - myName

    - __1_c


