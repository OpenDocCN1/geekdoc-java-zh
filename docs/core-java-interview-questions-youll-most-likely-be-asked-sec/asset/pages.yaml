  md: '# Answer:


    Polymorphism literally means "many forms". It is the ability to use the same interface
    to execute different code. Java achieves polymorphism via method overloading and
    method overriding. Method overloading occurs when there are many methods in a
    class with the same name but different number/type of arguments. The version of
    an overloaded method that will be invoked is determined at compile time based
    on the number/type of arguments passed in. Method overriding occurs when a sub-class
    has a method with the same name and type signature as a method in the super class.
    The version of an overridden method that will be invoked is determined at run
    time on the type of object that invokes the method.


    # 010. Explain how Java achieves abstraction.


    # Answer:


    Abstraction is an OOPs concept whereby only the necessary information is exposed
    to the end user and the internal implementation details are hidden. Java achieves
    abstraction via abstract classes and interfaces. So, you can declare the methods
    that you want to be exposed to the outside world in an abstract class or interface.
    The actual implementation will be within concrete classes that extend the abstract
    classes or implement the interfaces. The outside code is not aware of the implementing
    classes, they interact with your code via the interfaces or abstract classes.'
