  md: '# CHAPTER 06


    # Static and Default Interface Methods


    242. What are static and default methods? Why were they introduced by Java 8?


    Answer:


    Before Java 8, interfaces could only have abstract methods. So, they could not
    have methods with method bodies. Java 8 allows interfaces to have methods with
    method bodies as static and default methods. These were added for the following
    reasons:


    +   - Default interface methods help to keep code backward compatible. Prior to
    Java 8, if a new method was added to an interface, all the classes that implement
    the interface needed to be modified. Default methods overcome this restriction.
    So, they allow you to add a method with a method body in the interface. So, all
    implementing classes do not need to be modified.


    +   - Static interface methods help to group utility methods. Static interface
    methods cannot be overridden in the classes that implement the method. So, this
    avoids unwanted results due of incorrect implementation and provides an additional
    level of security.


    243. What is the difference between abstract class and an interface after Java
    8?


    Answer:'
