    # 129. Explain the differences between Error and Exception.


    Answer:


    The java.lang.Throwable is the superclass of all the exception classes. It has
    two sub-classes, Exception and Error. There are several differences between the
    two:


    +   - An Exception represents programmatic errors that are caused by the application
    itself like accessing a null value, dividing by 0, error while writing to a file,
    An Error represents errors that occur outside your code within the runtime environment
    like running out of memory, etc.

    - Exceptions are conditions that an application can handle and recover from. Errors
    on the other hand are abnormal conditions that indicate serious problems that
    an application cannot recover from.

    - Exceptions are both checked as well as unchecked. Checked exceptions need to
    be handled or specified within the throws clause in the method declaration. Errors
    on the other hand are always unchecked and need not be declared in the throws
    clause.


