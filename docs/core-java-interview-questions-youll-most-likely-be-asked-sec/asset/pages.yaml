  md: '# Tell me about a time when you had a dispute with another 343. employee. How
    did you resolve the situation?


    Answer:


    Make sure to use a specific instance, and explain step-by-step the scenario, what
    you did to handle it, and how it was finally resolved. The middle step, how you
    handled the dispute, is clearly the most definitive - describe the types of communication
    you used, and how you used compromise to reach a decision. Conflict resolution
    is an important skill for any employee to have and is one that interviewers will
    search for to determine both how likely you are to be involved in disputes, and
    how likely they are to be forced to become involved in the dispute if one arises.


    As an example:


    When I had a dispute with a coworker I asked if we could talk about the issue.
    They clearly were not interested at first. I let them their space and checked
    back a couple of days later, while gently pushing the fact that I respected them
    and wanted to put the issue behind us so we can both move forward and work together
    better. I proposed a few different times to meet to discuss the issue and allowed
    them to choose the time that worked best for them. This made them feel as they
    were in some position of control and had buy in. Once we met, I explained again
    I wanted to move forward and focused on the positive traits about them and asked
    them how they felt we should resolve the issue. I listened intently and offered
    my input once they were finished. We moved forward and put it behind us after
    that and were able to effectively communicate better than ever before We were
    also more comfortable to approach each other with any other issues that arose
    from then on out.'
