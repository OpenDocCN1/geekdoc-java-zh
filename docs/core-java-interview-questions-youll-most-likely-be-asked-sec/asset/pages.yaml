    # Optionals


    247. What is an Optional and why was it added by Java 8?",


    Answer:


    An Optional is used to represent a value that can either be present or absent.
    It has methods that can be used to retrieve the underlying value if present. The
    following code demonstrates an Optional:


    ```

    Optional<Integer> number;

    ```


    So here, number is an Optional of type Integer. It may or may not contain a value.


    Optionals were added by Java 8 to avoid the boilerplate code associated with null
    checks. Sometimes, a method may return a null. This can result in a NullPointerException.
    In order to avoid the exception, the code that invokes the method needs to have
    explicit null checks. This can make the code difficult to read. Java 8 Optionals
    help to avoid this boilerplate code. So instead of having an explicit null check,
    an optional can be used. If the value is present it can be retrieved.


