    add functional programming support to Java. Since Java is an object-oriented language,
    lambda expressions cannot be written on their own. They need to be associated
    with an object. So, Java 8 introduced functional interfaces and made it compulsory
    for lambda expressions to be used only with functional interfaces. By making a
    lambda expression implement a functional interface method, the lambda expression
    becomes an implementation of the functional interface. Functional interfaces and
    lambda expressions together help to write clean and concise code.


    # 209. Explain the syntax of a lambda expression.


    Answer:


    The following is the syntax of a lambda expression:


    ```

    (parameters) -> {lambda body}

    ```


    So, a lambda expression consists of the parameters to the expression, the lambda
    operator (->) and the expression body. A lambda expression can receive zero or
    more parameters. If it does not accept any parameters, an empty parenthesis needs
    to be used. If it accepts a single parameter, the parameter need not be specified
    in parenthesis. If it accepts multiple parameters, they need to be specified in
    parenthesis and separated by commas. The lambda body is ordinary Java code and
    can contain any number of statements. If there is a single statement in the lambda
    body, the curly braces around the body may be skipped, otherwise they need to
    be specified.


