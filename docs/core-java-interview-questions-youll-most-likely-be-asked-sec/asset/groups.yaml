    \ reduce the size of an application.\n\n- Modules offer better security. Before\
    \ modules, the only way to make a class reusable in other packages was to make\
    \ it public. However, this poses a security issue since public classes are accessible\
    \ to everyone. Grouping packages into modules ensures that the class is not accessible\
    \ outside the module.\n\n- Since there were no modules before Java 9, the Java\
    \ API jar files like rt.jar were very big in size. Instead Java 9 has split this\
