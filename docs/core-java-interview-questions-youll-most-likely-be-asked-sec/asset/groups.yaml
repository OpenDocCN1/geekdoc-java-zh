- md: "\n# Answer:\n\nThe `java.lang.RuntimeException` is a sub-class of the `java.lang.Exception`\
    \ class. The RuntimeException and its sub-classes are also known as unchecked\
    \ exceptions. This is because the compiler does not force you to handle such exceptions.\
    \ So even if code might potentially throw an unchecked exception is written, the\
    \ compiler does not cause an error. Some examples of RuntimeExceptions are ArithmeticException,\
    \ NullPointerException, ArrayIndexOutOfBoundsException.\n\n# CHAPTER 12\n\n# String\
    \ Handling\n\n131. What is a string literal? Give an example.\n\nAnswer:\n\nA\
    \ string literal is a set of characters enclosed in double quotes. It can be assigned\
    \ to a String variable with the help of the assignment operator (=). The following\
    \ line of code shows the string literal “I’m a literal” is assigned to the string\
    \ variable called 'name'.\n\n```\nString name = “I’m a literal\";\n```\n\n132.\
    \ What will be the output of the following code? Explain why.\n\n```java\nclass\
    \ StringDemo {\n    public static void main (String strArgs[]) {\n        String\
    \ strVar = \"Welcome\";\n        strVar.concat(\" to Java\");\n        System.out.println(strVar);\n\
    \    }\n}\n```\n\nAnswer:\n\nThis code prints the following output:\n\n```\nWelcome\n\
    ```\n\nJava strings are immutable objects so unless explicitly assigned, the string's\
    \ value does not change. The method concat () simply appends the value to Java\
    \ to strVar but does not assign the appended String back to the variable strVar.\n\
    \nIn order for the String Welcome to Java to be printed, the code needs to be\
    \ modified as follows:\n\n```java\nstrVar = strVar.concat(\" Java\");\n```\n\n\
    133. What will be the output when the following code is executed?\n\n```java\n\
    StringBuilder StringBuffer = new StringBuilder();\nStringBuffer.append(\"Core\
    \ \");\nStringBuffer.append(\"Java\");\nSystem.out.println(\"The resultant StringBuilder\
    \ Value is-\" + StringBuffer);\n```\n\n# Answer:\n\nOn executing the code above,\
    \ it will print the following output:\n\n> The resultant StringBuilder Value is:\
    \ Core Java\n\nThe StringBuilder.append() method appends the specified value to\
    \ the value in the StringBuilder.\n\n134. What will be the output of the following\
    \ code snippet?\n\n```java\nString xValue = \"xyz\";\nString yValue = xValue.concat(\"\
    qrs\").toUpperCase().replace('Z', 'c');\nSystem.out.println(yValue);\n```\n\n\
    # Answer:\n\nThe code above prints the following output:\n\n```\nXYcQRS\n```\n\
    \nFirst, xValue is concatenated with the value qrs and so the value becomes xyzqr.\
    \ Then, the value is converted to uppercase and so, the value becomes XYZQRS.\
    \ Then, the character Z is replaced with c and so, the value becomes ZYQRS.\n\n\
    # 135. What are the various ways of assigning a string literal to a String variable?\n\
