    # CHAPTER 02


    # Stream/Collection Improvements


    **268. What are some of the improvements made by Java 9 on the Stream Interface?


    **Answer:**


    The following are some of the improvements made by Java 9 on the Stream interface:


    +   a. `Stream.ofNullable`: Java 9 has added `Stream.ofNullable()` method on the
    Stream interface. This helps to create a Stream with a value that may be null.
    So, if a non–null value is passes to this method, it creates a Stream with that
    method, otherwise it creates an empty stream.


    +   b. `takeWhile`, `dropWhile`: Both the `takeWhile()` and `dropWhile()` methods
    operate on a Stream. They can be used to obtain a subset of the input Stream.


    +   c. `Stream.iterate`: Java 9 has added an overloaded version of the `Stream.iterate()`
    method that accepts a `Predicate` and terminates the Stream when the condition
    specified by the `Predicate` is true.


