    \ `Predicate` 的内置函数式接口。该接口接受任何数据类型的参数并返回一个布尔值。因此，它基本上被用于测试某个条件。在这里，代码创建了一个名为 `numberChecker`\
    \ 的 `Predicate`，它接受一个整数值。它通过 lambda 表达式实现，检查输入数字是否大于 20。第 1 行将 `Predicate` 应用于值\
    \ 10，而第 2 行将 `Predicate` 应用于值 40。因此，代码打印出以下输出：\n\n```\n10 greater than 20:false\n\
    40 greater than 20:true\n```\n\n# 202. 你会使用哪种内置函数式接口将字符串转换为大写字母？\n\n答案：\n\n有一个名为\
    \ `UnaryOperator` 的内置函数式接口。它接受任何数据类型的参数并返回相同数据类型的结果。它有一个名为 `apply` 的方法，该方法可以对输入值进行操作。因此，你可以使用它将字符串转换为大写字母。以下代码演示了这一点：\n\
    \n```\nUnaryOperator<String> converter = str -> str.toUpperCase();\nSystem.out.println(converter.apply(\"\
    hello world\"));\n```\n\n在这里，代码创建了一个名为 `converter` 的 `UnaryOperator` 实现，它对字符串值进行操作。使用了\
    \ lambda 表达式将字符串转换为大写。因此，此代码打印出以下输出：\n\n```\nHELLO WORLD\n```\n\n# 203. 下述代码有效吗？请解释。\n\
    \n```\n@FunctionalInterface\npublic interface Interface1 {\n    public void doSomething();\n\
    }\npublic interface Interface2 extends Interface1 {\n    public void doSomethingElse();\n\
    }\n```\n\n# 答案：\n\n上述代码声明了一个名为 `Interface1` 的函数式接口，包含一个名为 `doSomething` 的抽象方法。然后定义了另一个名为\
    \ `Interface2` 的函数式接口，它扩展了 `Interface1` 并有一个名为 `doSomethingElse` 的抽象方法。这段代码完全有效。`Interface2`\
    \ 现在有两个抽象方法：`doSomething()` 和 `doSomethingElse()`。由于它没有标记 `@FunctionalInterface`\
    \ 注解，因此拥有多个抽象方法是可以的。如果在 `Interface2` 上使用了 `@FunctionalInterface` 注解，代码将会导致编译错误。\n\
    \n# 204. 请列出一些 Java 8 之前但被 Java 8 变为函数式接口的接口。\n\n# 答案：\n\n在 Java 8 之前，有一些接口已经拥有单个抽象方法。Java\
    \ 8 通过在这些接口上指定 `@FunctionalInterface` 注解，将它们指定为函数式接口。因此，这些接口中的抽象方法可以通过 lambda\
    \ 表达式来实现。这些接口如下：\n\n- a. java.lang.Runnable: 用于创建线程\n- b. java.util.concurrent.Callable:\
    \ 用于创建返回值的线程\n- c. java.util.Comparator: 用于比较值\n- d. java.io.FileFilter: 用于过滤文件\n\
    \n# 205. 为什么 Java 8 增加了像 IntSupplier、BooleanSupplier 等内置函数式接口的原始类型特化版本？\n\n答案：\n\
    \nJava 增加像 `IntSupplier`、`BooleanSupplier` 等内置函数式接口的原始类型特化版本是为了提高性能。原始类型特化版本消除了自动装箱（autoboxing）的需求，从而提高了性能。\n\
    以下代码演示了这一点：\n\n```\nSupplier<Integer> integerSupplier = () -> new Random().nextInt();\n\
    ```\n\n这段代码创建了一个返回小于 100 的随机整数的 `Supplier`。由于没有使用原始类型特化，`Random` 类返回的值需要被包装成 `Integer`。\n\
    现在考虑以下代码：\n\n```\nIntSupplier integerSupplier2 = () -> new Random().nextInt();\n\
    ```\n\n在这种情况下，使用了返回整数的 `Supplier` 的原始类型特化版本 `IntSupplier`。因此，没有需要将返回值包装成 `Integer`。由于避免了自动装箱，这段代码产生了更好的性能。\n\
    \n# 206. 内置函数式接口通常在哪里使用？\n\n答案：\n\nJava 8 增加了 Stream API，帮助对集合（Collections）进行批量操作。内置函数式接口通常用作\
