    # 344. Do you build relationships quickly with people, or take more time to get
    to know them?


    Answer:


    Either of these options can display good qualities, so determine which style is
    applicable to you. Emphasize the steps you take in relationship-building over
    the particular style and summarize briefly why this works best for you.


    As an example:


    I feel I get along with anyone quickly and easily build effective working relationships.
    I am always careful to not get comfortable too fast, as certain aspects of any
    relationship time to develop. While I may run in people throughout the course
    of my career that I do not mesh with well, I am still able to maintain a professional
    working relationship and mutual respect with them.


