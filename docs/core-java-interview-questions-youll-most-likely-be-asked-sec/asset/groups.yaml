    ## 304. Tell me about a time when a supervisor did not provide specific enough
    direction on a project.


    Answer:


    While many employers want their employees to follow very specific guidelines without
    much decision-making power, it''s important also to be able to pick up a project
    with vague direction and to perform self-sufficiently. Give examples of necessary
    questions that you asked and specify how you determined whether a question was
    something you needed to ask of a supervisor or whether it was something you could
    determine on your own.


    As an example:


    I had a large project already pending when my supervisor was about to leave for
    vacation. Before her vacation she gave me another project and did not leave deadlines
    along with it. I analyzed the project and determined it was a new client and I
    did not want to leave them wondering. I continued with my pending project and
    made contact with the new client to introduce myself and set up a call to discuss
    their needs. This brought me time while also allowing me to obtain more information.
    It was still unclear as to what the deadlines were and it did not seem urgent
    so I continued with my existing, as well as set time each afternoon to begin working
    on the new client''s project as well.


    ## 305. Tell me about a time when you were in charge of leading a project.


    Answer:


    Lead the interviewer through the process of the project, just as you would have
    with any of your team members. Explain the goal of the project, the necessary
    steps, and how you delegated tasks to your team. Include the results, and what
    you learned as a result of the leadership opportunity.


    As an example:


    As an HR Assistant helping while the HR Benefits Rep was out on leave, I was put
    in charge of the annual employee benefits enrollment for a large organization.
    I spoke with the manager ahead of time to gather as much information as I could
    on what had worked in the past in terms of timelines and flow, and added a couple
    of helpful changes myself such as a filing system for the different benefit changes
    as they were going to come in. The week prior to the beginning of open enrollment,
    I had a meeting with the HR department to go over each form and explain to my
    team how I was going to distribute each form and made helpful cheat sheets of
    information for them to each keep at their desk in instances of an employee coming
    with questions and I may be unavailable.


    The entire process went smoothly and organized, and employees commented on how
    easy it was.


    ## 306. Tell me about a suggestion you made to a former employer that was later
    implemented.


    Answer:


    Employers want to see that you''re interested in improving your company and doing
    your part - offer a specific example of something you did to create a positive
    change in your previous job. Explain how you thought of the idea, how your supervisors
    received it, and what other employees thought was the idea was put into place.


    As an example:


    I suggested we start an innovation committee to bring staff together to discuss
    new ideas they had for the workplace. These ideas included a wide variety of things
    such as ways to implement employee recognition, snack machine options, changes
    to the customer lobby, and anything and everything in between. While not all ideas
    were acted upon by management, a variation of most of the ideas were implemented.
    This made the employees feel a sense of ownership and belonging in the company,
    as well as improved morale and teamwork.


    ## 307. Tell me about a time when you thought of a way something in the workplace
    could be done more efficiently.


    Answer:


    Focus on the positive aspects of your idea. It''s important not to portray your
    old company or boss negatively, so doesn''t elaborate on how inefficient a particular
    system was. Rather, explain a situation in which you saw an opportunity to increase
    productivity or to streamline a process, and explain in a general step-by-step
    how you implemented a better system.


    As an example:


    Our department had set aside Fridays as “filing days” for paperwork that was collected
    throughout the week. While this was definitely a great idea, if a coworker called
    out sick, or we had a large amount of filing in one week, there would be times
    when we would not get it all done on Friday, or it would be very stressful due
    to the high volume of paperwork we received throughout the week. I suggested we
    started to file throughout the week during downtime between projects so we would
    not have a backlog all on one day. I also noticed that the last half hour of each
    day, some coworkers would start “packing up” and with the work we did, we couldn''t
    really start a new project within the last little bit of time so we would start
    packing up and then file for the last thirty minutes of each day until it was
    time to clock out. This greatly reduced the amount we had piled up for Fridays,
    as well as kept productivity higher throughout the week.


    ## 308. Is there a difference between leading and managing people - which is your
    greater strength?


    Answer:


    There is a difference - leaders are often great idea people, passionate, charismatic,
    and with the ability to organize and inspire others, while managers are those
    who ensure a system runs, facilitate its operations, make authoritative decisions,
    and who take great responsibility for all aspects from overall success to the
    finest decisions. Consider which of these is most applicable to the position,
    and explain how you fit into this role, offering concrete examples of your past
    experience.


    As an example:


    I am a good leader because I take time to think about all possible aspects of
    a project and how it may affect each employee tasked to work on the project. I
    do my best to see things from each perspective, anticipating and planning things
    that may go wrong, and focusing on what could go right. I pitch ideas in a way
    where I am able to garner support from the employees and make them feel they.


    ## 309. Do you function better in a leadership role, or as a worker?


    Answer:


    It is important to consider what the interviewer is looking for, and express how
    you embody this role as well as ability to keep things smoothly.


    As an example:


    While I am able to work in either role, I find that I am better suited for leadership
    since it comes so naturally for me. Even in positions where I was not the boss,
    I had people coming to me for suggestions, to bounce ideas off.


    ## 310. Tell me about a time when you discovered something in the workplace that
    was disrupting your (or others) productivity - what did you do about it.


    Answer:


    Try to not focus on negative aspects of your previous job too much, but instead
    choose an instance in which you found a positive, and quick solution to increase
    productivity. Focus on the way you noticed the opportunity, how you presented
    a solution to your supervisor, and then how the change was implemented (most importantly,
    talk about how you led the change initiative). This is a great opportunity for
    you to display your problem-solving skills, as well as your resourceful nature
    and leadership skills.


    As an example:


    Our one and only timeclock was continuously met with long lines of all staff clock
    out at the same time. This would cause chaos at the clock out line, disgruntled
    employees, employees in a hurry skipping the process entirely, and employees packing
    up for the day early so they could "get in line." I suggested we add a second
    timeclock on the other side of the room near the second entry door to alleviate
    the line. This helped productivity because employees did not feel the need to
    pack up early and waste time standing at a timeclock and eased some of the grumpiness
    felt at the end of the day.


    ## 311. How do you perform in a job with clearly-defined objectives and goals?


    Answer:


    It is important to consider the position when answering this question - clearly,
    it is best if you can excel in a job with clearly-defined objectives and goals
    (particularly if you''re in an entry level or sales position). However, if you''re
    applying for a position with a leadership role or creative aspect to it, be sure
    to focus on the ways that you additionally enjoy the challenges of developing
    and implementing your own ideas.

