    +   281. Suppose you create a new thread by extending the Thread class and you
    invoke the start method multiple times. What do you think will happen?


    Answer:


    When you invoke the start() method the first time, a new Thread will be spawned
    and the code specified within the run method will get executed in the body of
    the thread. However, on subsequent invocation of the start method, an IllegalThreadStateException
    will occur. This is because you cannot start the same thread more than once. Threads
    follow a life cycle and have certain states during the life-cycle. When a thread
    is created the first time, it is in the NEW state. After the start() method is
    invoked it enters the RUNNABLE state and once the run method completed, it enters
    the TERMINATED state. So, when you invoke the start method on a running thread,
    it is already in the RUNNABLE state. This causes the IllegalThreadStateException.
    If you want to execute the code in the thread again, you need to create a new
    thread.


    +   282. Suppose you have a method that returns an integer value. The code is
    present within a try/catch/finally. There is a return statement in the try, catch
    and finally blocks. The return statement in the try block returns 1, the return
    statement in the catch block returns-1 and the return statement in the finally
    block returns 0. If an exception occurs, which value will be returned?'
- md: '

    ## Answer:


    In the scenario described above, the return statement within the finally block
    will get executed; the value **0** will be returned. Since an exception occurs
    in the try block, the rest of the body of the try block is skipped. So, the return
    statement within the try block is not executed. Since an exception occurs, the
    code within the catch block will get executed. However, since a finally block
    is present, the return statement within the catch block is also not executed.
    The code within the finally block gets executed and the return statement from
    the finally block gets executed. If the finally block was not present, the return
    statement from the catch block would have been executed.


    283. Suppose you have a static method in the Base class. And suppose you have
    a method with the same name in the sub-class. And suppose you create a Base class
    object and assign it a reference of the sub-class object and invoke the static
    method. Is this valid? If so, which version of the static method gets invoked?


    ## Answer:


    The above scenario is perfectly valid and will not cause any error. When this
    code is executed, the static method in the base class gets invoked. Normally,
    when you define a variable of the super-class type and assign it a sub-class object
    and invoke an overridden method, the method defined in the sub-class gets invoked.
    This is because Java uses the object assigned and not the reference variable to
    determine the version of an overridden method to invoke. However, in the scenario
    described above, the methods in the super-class and sub-class are static. Static
    methods cannot be overridden. So, if you have a static method in the base class
    and a method with the same name in the sub-class, this would not be an example
    of overriding. Rather, this is known as method hiding. In such a scenario, the
    version of the method invoked is not determined by the type of object assigned
    to the reference variable but by the type of the reference variable. In this case,
    a base class reference variable is used. So, the static method in the base class
    gets invoked.


    - 284. Suppose you have a method in a base class that throws an ArrayIndexOutOfBoundsException.
    And suppose this method is overridden in the sub-class and declares that it throws
    a RuntimeException. What do you think will happen?


    ## Answer:


    The scenario above states that a base class method throws an ArrayIndexOutOfBoundsException
    which is an unchecked exception. The sub-class method overrides this method and
    declares that it throws a RuntimeException. This situation is valid and will not
    cause any error. In method overriding, a sub-class method is not allowed to throw
    a checked exception that is new or broader than the exception declared in the
    super-class method. However, this rule does not apply to unchecked exceptions.
    So, a sub-class method is free to declare any unchecked exception and this will
    not cause any error. If the subclass method had declared java.lang.Exception or
    any of its sub-classes in the throws clause, a compile time error would have occurred.
    This is because java.lang.Exception is a checked exception.


    - 285. Suppose you have a List of objects. You want to send it to a client application
    but want to ensure that the client application does not make changes to it. How
    can you achieve this?


    ## Answer:


    In order to ensure that a client application does not make changes to a List,
    you need to obtain a read-only copy of the List and return that copy to the client
    application. The Collections class has several utility methods that return a read-only
    copy of a Collection. For example, it has a method called Collections.unmodifiableList.
    This method accepts a List as parameter and returns a List which is a read-only
    copy of the input List. Once a read-only copy of a Collection is obtained via
    this method, any attempt to modify the List (like adding or removing data) throws
    an UnsupportedOperationException. So, if the client application tries to modify
    this List, the exception will occur.


    286. Suppose you are reading 10000 String values from the database. You need to
    create a concatenated String with these values. Which is the most efficient way
    to achieve this?


    ## Answer:


    There are several ways in which you can concatenate String values. The most commonly
    used method is to use the concatenation operator (+). However, this is not efficient
    in terms of performance and should be avoided when you have a large number of
    Strings. This is because the String class is immutable. So, using the + operator
    results in the creation of a large number of Strings. Java provides the StringBuilder
    class. This has a method append that can be used to create concatenated Strings.
    This has better performance since it is a mutable class. There is also another
    class called StringBuffer which is very similar to StringBuilder. The only difference
    is that StringBuffer is synchronized while StringBuilder is not. StringBuilder
    has a slightly better performance compared to StringBuffer. So, if synchronization
    is not an issue, you can use StringBuilder, otherwise you can use StringBuffer.


    - 287. Suppose you are developing an application that performs a lot of mathematical
    calculations involving very large decimal numbers. Which data type will you use
    for your variables given that precision is important?


    ## Answer:


    Normally, programmers use float or double data types while dealing with decimal
    numbers. However, these data types have a downside. While dealing with large or
    small numbers, a loss of precision can occur with these data types leading to
    inaccurate results. So, using these data types in situations where precision is
    important is not a good idea. Java provides a class called java.lang.BigDecimal.
    This class overcomes the limitations of the float and double data types. It does
    not lose precision while dealing with large or small numbers and therefore provides
    exact results. It has methods corresponding to all the arithmetic operations like
    addition, subtraction, multiplication and division. In addition, it supports a
    lot of other operations as well. So, it can be used to perform all mathematical
    operations and provide precise results. The only downside of BigDecimal is performance.
    However, if precision is a priority over performance, then BigDecimal should be
    used.


    - 288. Suppose you are working on a multi-threaded application. A new requirement
    comes in where you need to store key-value pairs. Which is the most appropriate
    Collection to be used in such a scenario?


    ## Answer:


    The java.util.Map interface supports storing data as key-value pairs. The most
    commonly used implementation of the Map interface is HashMap. However, the problem
    with HashMap is that it is not thread safe and so not appropriate to be used in
    a multi-threaded application. There is a utility method on the Collections class
    called synchronizedMap(). It accepts a Map as an input and returns a thread-safe
    map corresponding to the Map object passed in. So, such a synchronized map can
    be used in a multi-threaded environment. There is also another implementation
    called ConcurrentHashMap. This is a thread-safe implementation of the Map interface
    and suitable for use in a multi-threaded environment. ConcurrentHashMap has a
    slightly better performance than a synchronized Map. A synchronized Map synchronizes
    the complete Map object, so even a read operation is not allowed while some other
    thread is using the Map. The ConcurrentHashMap on the other hand does not synchronize
    the whole map, so it allows read operations while some other thread is writing
    to the Map. So, both synchronized Map and ConcurrentHashMap are suitable in a
    multi-threaded environment; ConcurrentHashMap should be used if performance is
    a consideration.


