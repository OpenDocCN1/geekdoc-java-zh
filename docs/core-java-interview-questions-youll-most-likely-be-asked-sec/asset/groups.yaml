    # 创意


    **291. 你从哪里寻找灵感？**


    **答案：**


    灵感可以来自任何地方，面试官希望看到你的灵感同样是化的。提到你获取灵感的多个地方，或者你进行头脑风暴的环境。此外，详细说明你是如何记录灵感或稍后对其进行扩展的。


    **例如：**


    我整天都会不断在笔记本上或手机里记录我以后想回顾的内容。我在工作会议期间、通过听同事面临的困难和进展时获得灵感，做记录并在稍后研究我们如何改进工作流。当我的人脉发布他们在职场追求的新创新成果时，我也会通过他们获得灵感，并思考我如何能在自己的公司里应用这些创新。


    **292. 你在工作中如何实现创造力？**


    **答案：**


    向面试官展示你在工作中能够善用资源并具有创新精神是重要的，同时不要超出公司价值观的范畴。解释你的灵感通常源于何（例子可以包括列清单或思维导图等练习），并将其与工作中某项你你发挥创造力的特定任务联系起来。


    **例如：**


    > 我被分配到了一个安全与健康工作小组。大多数人在休息时其实都在走路，只是没有聚在一起。我参加了一个为期三个月的托管步行挑战，在休息期间，人们仍然可以自己散步，但被鼓励与同事互动，并在跟踪进度方面进行一些健康的竞争。这最终让更多的人站起来运动，同时也增强了士气和团队合作精神。


    ** 293. 你如何推动他人创造灵感？**


    **答案：**


    如果你处于管理职位，这可能要求员工提交特定数量的创意，或者完成定期的灵感产生练习，以锻炼他们的创意肌肉。然而，你也可以通过创造更多自己的灵感来简单地推动周围的人创造创意。此外，与面试官讨论提问人的重要性，这是激发灵感和改变的一种方式。


    **例如：**


    在每次员工会议上，我都会鼓励员工带上他们自我们上次会议以来一直面临或遇到的问题或挑战，并附带解决方案。我鼓励员工参加定期的职业发展机会，无论是免费的网络研讨会、培训，甚至是阅读他们所在领域新发表的文章，并与团队分享他们学到的东西或热门话题。


    ** 294. 描述你的创造力。**


    **答案：**


    尽量将这个答案控制在专业领域内，但如果你在职业经历之外的某些创意领域拥有令人印象的背景，不要害怕将其纳入答案中。关于创意的最佳答案将与解决问题的能力、目标设定以及在工作中应对项目或完成销售的创新方法有关。办公室之外的热情也很棒（只要它们不会占用你的工作时间或心理空间）。


    **例如：**


    我参加了一个工作之外的志愿者小组，为无家归者提供食物。我工作过的公司正在寻求与社区的联系，以及员工参与比其特定工作角色更大事务的方法，因此在公司的许可下，我举办了一场公司内部的募款活动，员工举办意大利面晚餐以为无家归者筹集资金。这提升了团队合作和目标感。


