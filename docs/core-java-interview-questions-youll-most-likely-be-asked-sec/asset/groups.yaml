    # CHAPTER 04


    # Customer Service


    331. What is customer service?


    Answer:


    Customer service can be many things - and the most important consideration in
    this question is that you have a creative answer. Demonstrate your ability to
    think outside the box by offering a confident answer that goes past a basic definition,
    and that shows you have truly considered your own individual view of what it means
    to take care of your customers. The thoughtful consideration you hold for customers
    will speak for itself.


    As an example:


    Customer Service is basically any interaction you have with other people during
    the course of a work day. If you are working in customer service it''s simple—
    you answer the phone, take payments, solve problems. If you work in HR, your customers
    may be the employees you serve. If you work in sales, your customers may be the
    people you sell to. Customer Service is show you work with others, your attitude,
    and your problem-solving abilities. It is wanting to always provide the best service
    possible, in any capacity you can, to whoever you encounter while work.


    332. Tell me about a time when you went out of your way for a customer.


    Answer:'
- md: '

    It''s important that you offer an example of a time you truly went out of your
    way - be careful not to confuse something that felt like a big effort on your
    part, with something your employer would expect you to do anyway. Offer an example
    of the customer''s problems, what you did to solve it, and the way the customer
    responded after you took care of the situation.


    ## As an example:


    I was working with a new client on a large construction job. The client was ready
    to go with their job and then fell on financial hardship. I wanted to be sure
    to help the client out so I worked out a payment plan where they did not have
    to pay for it all upfront. They had sign a contract noting that I adjusted the
    payment plan and that it was a one-time situation so they were aware if they used
    again in the future it may be payment up again. The new client was appreciative
    and the project was completed. We were able to maintain a long-standing relationship
    with the client and ended up getting more work from them down the road as well
    as good reviews and increased visibility within the community as a result of word
    spreading.


    ## 333. How do you gain confidence from customers?


    ### Answer:


    This is a very open-ended question that allows you to show your customer service
    skills to the interviewer. There are many possible answers, and it is best to
    choose something that you''ve had great experience with, such as “by handling
    situations with transparency,” “offering rewards,” or “focusing on great communication.”
    Offer specific examples of successes you''ve had.


    ## As an example:


    Open communication is always good in gaining customer confidence. Instead of just
    giving any answer just for the sake of providing an answer, I am sure to let the
    customer know if I don''t have an immediate answer to their question and assure
    them that I will get the right answer and get back with them. Then, I make sure
    to follow through. Without communication and follow you will lose trust and they
    will take their business elsewhere. The customer appreciates honesty and the time
    you take in delivering the right answer and the best service.


    ## 334. Tell me about a time when a customer was upset agitated - how did you
    handle the situation?


    ### Answer:


    Similarly, to handling a dispute with another employee, the most important part
    of answering this question is first set up the scenario, offer a step-by-step
    guide to your particular conflict resolution style, and end by describing the
    way the conflict was resolved. Be sure that in answering questions about your
    own conflict resolution style, that you emphasize the importance of open communication
    and understanding from both parties, as well as a willingness to reach a compromise
    or other solution.


    ## As an example:


    Customers who are upset just want to be heard. It is important to listen. I had
    a customer call when I worked in a billing call center, complaining that she felt
    she was charged too much on her monthly bill. She was already agitated when she
    called and I quickly realized that the more I tried to talk, the more upset she
    got. I took the time to listen and allow her to fully explain the situation. It
    became apparent to me that she had not been keeping up to date with the notices
    that were sent out explaining that there were rate increases. I informed her of
    the rate increase and waived the first month rate increase, then sent her the
    notices via e-mail for her to review. I called her the next day to follow up and
    see if she had any questions.


    ## 335. When can you make an exception for a customer?


    ### Answer:


    Exceptions for customers can generally be made when in accordance with company
    policy or when directed by a supervisor. Display an understanding of the types
    of situations in which an exception should be considered, such as when a customer
    has endured a particular hardship, had a complication with an order, or at a request.


    ## As an example:


    Typically, there are protocols and policies in place to assure that operations
    are running smoothly and that all customers are being treated fairly while making
    sure the company is profitable and not being taken advantage of. There may be
    times when a customer has an unusual or unexpected hardship that makes it difficult
    for them to keep up on their payments, and in these situations an extension should
    be given as a one time courtesy. If the issue continues into the next month, I
    review the policy manual to see if there is anything else that can be offered
    and if not, I go to the supervisor for assistance and guidance. At that point
    it is typically up to the supervisor to make the next call.


    ## 336. What would you do in a situation where you were needed by both a customer
    and your boss?


    ### Answer:


    While both your customer and your boss have different needs of you and are very
    important to your success as a worker, it is always best to try to attend to your
    customer first - however, the key is explaining to your boss why you are needed
    urgently by the customer, and then to assure your boss that you will attend to
    or her needs as soon as possible (unless it''s absolutely an urgent matter).


    ## As an example:


    The customer always comes first, and bosses know this most of the time. In situations
    where a boss may request your assistance at the same time as a customer, it''s
    easy to approach the boss to see what it is they need, get the information, and
    explain to them that you will be jumping on that task as soon as you are finished
    assisting the customer. The customer is your source of business and you need to
    be sure they are taken care of in a timely manner.


    ## 337. What is the most important aspect of customer service?


    ### Answer:


    While many people would simply state that customer satisfaction is the most important
    aspect of customer service, it''s important to be able to elaborate on other important
    techniques in customer service situations. Explain why customer service is such
    a key of business and be sure to expand on the aspect that you deem to be the
    most important in a way that is reasoned and well-thought out.


    ## As an example:


    The most important aspect of customer service is being genuine. If you do not
    have a product that genuinely helps the customer, or you are not genuine in your
    delivery of customer service, the company will fail. Having the ability to enjoy
    delivering the best customer service and being excited about helping the customer
    makes the customer also feel excited to do business with you and they feel confident
    they are being taken care of. Having a pleasant attitude sets the tone for any
    conversation with a customer and being sure to follow through and do your job
    to the best of your ability makes the customer feel confident in your services.


    ## 338. Is it best to create low or high expectations for a customer?


    ### Answer:


    You may answer this question either way (after, of course, determining that the
    company does not have a clear opinion on the matter). However, no matter which
    way you answer the question, you must display a thorough thought process, and
    very clear reasoning for the option you chose. Offer pros and cons of each and
    include the ultimate point that tips the scale in favor of your chosen answer.


    ## As an example:


    It''s good to create high expectations from the beginning of any relationship
    with a new customer. This shows you have confidence and makes the customer excited
    to be on the journey with you. While creating such expectations though, you should
    be sure to communicate realistic processes and timeframes so the customer knows
    while you are their best choice and they will be glad they chose your company,
    that things don''t happen overnight and a certain level of patience and understanding
    will need to be by the customer while they wait for their product to be delivered.
    Be sure to let them know the wait will be worth it, because you are the best!
    High expectations, creating excitement, and open communication so they know what
    to expect, are all important.

