    283. 假设你在 Base 类中有一个静态方法。假设你在子类中有一个同名的方法。假设你创建了一个 Base 类对象，并给它赋值子类对象的引用，然后调用该静态方法。这有效吗？如果有效，调用的是哪个版本的静态方法？


    ## Answer:


    上述场景是完全有效的，不会引起任何错误。当执行此代码时，将调用基类中的静态方法。通常，当你定义一个父类类型的变量并给它赋值一个子类对象且调用被重写的方法时，调用的是子类中定义的方法。这是因为
    Java 使用赋值的对象而不是引用变量来确定要调用的重写方法版本。然而，在上述场景中，父类和子类的方法都是静态的。静态方法不能被重写。因此，如果你在基类中有一个静态方法而在子类中有一个同名方法，这并不属于重写的例子。相反，这被称为方法隐藏（method
    hiding）。在这样的情况下，调用的方法版本不是由赋值给引用变量的对象类型决定，而是由引用变量的类型决定。在这种情况下，使用的是基类引用变量。因此，调用的是基类中的静态方法。


