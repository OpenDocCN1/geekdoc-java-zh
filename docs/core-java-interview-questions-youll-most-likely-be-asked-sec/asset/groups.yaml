    ## CHAPTER 05

    Communication


    339. Describe a time when you communicated a difficult or complicated idea to
    a co-worker.


    Answer:


    Start by explaining the idea briefly to the interviewer, and then give an overview
    of why it was necessary to break it down further to the coworker. Finally, explain
    the idea in succinct steps, so the interviewer can see your communication abilities
    and skill in simplification.


    As an example:


    > I had the idea of a new job scheduling system and needed to present it to the
    team. I had limited resources and we had not obtained the necessary software yet,
    so what I did was type up a brief overview of the idea and add main bullet points
    with images and screen shots of the software from the internet and compiled into
    a PowerPoint presentation. I attempted to think of all potential questions that
    may come up during the meeting and different perspectives so I would be ready
    to answer questions and present it in a way that would appeal to everyone. I included
    a list of pros and cons, to include solutions to each that may come up as well
    as the team understood I had thought out and was well prepared.


    340. What situations do you find it difficult to communicate in?


    Answer:


    Even great communicators will often find particular situations that are more difficult
    to communicate effectively in, so don''t be afraid to answer this question honestly.
    Be sure to explain why the particular situation you name is difficult for you
    and try to choose an uncommon answer such as language barrier or in time of hardship,
    rather than a situation as speaking to someone of higher authority.


    As an example:


    It can sometimes be difficult to communicate effectively when delivering bad news.
    It is easy to become stressed, or worried about how the person will react. It
    is important not to attempt to communicate until you feel prepared. Be ready to
    listen instead of just talk, answer questions you have the answers to, and offer
    a sense of empathy for what the person is thinking or feeling. Above all it''s
    important to communicate openly and confidently, so the person feels comfortable
    and has confidence in you or the situation.


    341. What are the key components of good communication?


    Answer:


    Some of the components of good communication include an environment that is free
    from distractions, feedback from the listener, and revision or clarification from
    the speaker when necessary. Refer to basic communication models where necessary
    and offer to go through a role-play sample with the interviewer in order to show
    your skills.


    As an example:


    I find it best to be sure to make eye contact and avoid distractions such as the
    phone or computer while having a serious conversation. Knowing it''s ok to ask
    for clarification is important so there are not any instances of misunderstandings.
    Reflective listening is a great tool in any communication, where you show the
    person you were listening to them by repeating back certain things they said when
    appropriate (For example “I hear you saying you need more support with this project.
    Let’s work on how we can fix it and get you the support you need.)


    342. Tell me about a time when you solved a problem through communication.


    Answer:


    Solving problems through communication is key in the business world, so choose
    a specific situation from your previous job in which you navigated a messy situation
    by communicating effectively through the conflict. Explain the basis of the situation,
    as well as the communication steps you took, and end with a discussion of why
    communicating through the problem was so important to its resolution.


    As an example:


    My department was having too many misunderstandings due to lack of in person communication
    and only speaking through e-mail. We never checked our e-mail at the same time
    and were never on the same page. We continued to overlap on work and tasks were
    not evenly distributed, with many tasks falling through the cracks. Additionally,
    there were instances where directives were not clear via e-mail. I requested my
    department make time for at least bi-weekly department meetings to make sure we
    were all on the same page and allow time without distraction to address each other
    and provide updates on department projects. This time together built camaraderie
    among the team and provided an effective way to open more lines of communication.


    343. Tell me about a time when you had a dispute with another employee. How did
    you resolve the situation?


    Answer:


    Make sure to use a specific instance, and explain step-by-step the scenario, what
    you did to handle it, and how it was finally resolved. The middle step, how you
    handled the dispute, is clearly the most definitive - describe the types of communication
    you used, and how you used compromise to reach a decision. Conflict resolution
    is an important skill for any employee to have and is one that interviewers will
    search for to determine both how likely you are to be involved in disputes, and
    how likely they are to be forced to become involved in the dispute if one arises.


    As an example:


    When I had a dispute with a coworker I asked if we could talk about the issue.
    They clearly were not interested at first. I let them their space and checked
    back a couple of days later, while gently pushing the fact that I respected them
    and wanted to put the issue behind us so we can both move forward and work together
    better. I proposed a compromise and we reached an agreement that worked for both
    of us.


    344. Do you build relationships quickly, or take time to develop?


    Answer:


    Either of these options can work, so determine which style is best. Emphasize
    the steps you take and summarize why it works for you.


    As an example:


    I find that I build relationships quickly because I am approachable and open to
    meeting new people. However, I also take to maintain professional boundaries and
    ensure that there is mutual trust.


    345. Describe a time when you had to work through office politics to solve a problem.


    Answer:


    Try to focus on the positives in this question, so that you can use the situation
    to your advantage. Don’t portray your previous employer negatively, and instead
    use a minimal instance (such as paperwork or a single individual), to highlight
    how you worked through. Give examples of communication skills or problem-solving
    you used in order to achieve a resolution.


    As an example:


    There have been many times where I needed to work through the “red tape” that
    was a part of office procedures getting approvals for new permits. Although at
    times it was very frustrating and time consuming, I understood this was necessary
    as it took time to review the plans and assure the job was going to be according
    to safety and legal protocols. I had a job that needed to be rushed, so I prepared
    a letter explaining the situation, a statement from the business owner who the
    job was for, and had my supervisor contact the signing authority to present my
    case. I was sure to include reasons the project would affect the community put
    on hold if it took too long to build, and how rushing the job would be good for
    the community and opening that store would have a trickle effect in opening other
    stores in the same vacant lot. While the job ended up not being done the next
    day, it was moved two weeks ahead of the original schedule


    346. Tell me about a time when you persuaded others to take on a difficult task.


    Answer:


    This question is an opportunity to highlight both your leadership and communication
    skills. While the specific situation itself is important to offer as background,
    focus on how you were able to persuade the others, and what tactics worked the
    best.


    As an example:


    I had a coworker who was reluctant to help me implement a new filing system. The
    project was going to be time consuming and difficult. I presented her key points
    on how the project would benefit herself and the entire department and make her
    job easier, and told her that ultimately it would be something she would look
    kindly on and an opportunity for her to shine. I motivated her by telling her
    she had really great ideas and that if she were a part of the project it would
    help for it to get done.

