    # 308. Is there a difference between leading and managing people - which is your
    greater strength?


    Answer:


    There is a difference - leaders are often great idea people, passionate, charismatic,
    and with the ability to organize and inspire others, while managers are those
    who ensure a system runs, facilitate its operations, make authoritative decisions,
    and who take great responsibility for all aspects from overall success to the
    finest decisions. Consider which of these is most applicable to the position,
    and explain how you fit into this role, offering concrete examples of your past
    experience.


    As an example:


    I am a good leader because I take time to think about all possible aspects of
    a project and how it may affect each employee tasked to work on the project. I
    do my best to see things from each perspective, anticipating and planning things
    that may go wrong, and focusing on what could go right. I pitch ideas in a way
    where I am able to garner support from the employees and make them feel they are
    a part of something great.'
  - '[PAGE 275]


    # Do you function better in a leadership role, or as a worker 309. on a team?


    Answer:


    It is important to consider what qualities the interviewer is looking for your
    position, and to express how you embody this role. If you''re a leader, highlight
    your great ideas, drive and passion, and ability to incite others around you to
    action. If you work great in teams, focus your dedication to the task at hand,
    your cooperation and communication skills, and your ability to keep things running
    smoothly.


    As an example:


    While I am able to work well in either role, I find that I am better suited for
    leadership roles since it comes so naturally for me. Even in positions where I
    was not the boss, I had people coming to me for suggestions, to bounce ideas off
    of, and looking for support. I am good at project management and fitting the right
    people in the right place where their skills and personality, as well as work
    ethic will be best suited. If I find someone on a team is struggling with keeping
    up, I am able to find creative ways to include them and change their tasks to
    something possibly even outside of their comfort zone, where they are better suited
    to contribute to the team. I find the best quality in each employee and motivate
    them in action.


    # 310. Tell me about a time when you discovered something in the workplace that
    was disrupting your (or others) productivity - what did you do about it.


    Answer:


    Try to not to focus on negative aspects of your previous job too much, but instead
    choose an instance in which you found a'
  - '[PAGE 276]


    positive, and quick, solution to increase productivity. Focus on the way you noticed
    the opportunity, how you presented a solution to your supervisor, and then how
    the change was implemented (most importantly), talk about how you led the change
    initiative). This is a great opportunity for you to display your problem-solving
    skills, as well as your resourceful nature and leadership skills.


    # As an example:


    Our one and only timeclock was continuously met with long lines of all staff clock
    out at the same time. This would cause chaos at the clock out line, disgruntled
    employees, employees in a hurry skipping the process entirely, and employees packing
    up for the day early so they could "get in line." I suggested we add a second
    timeclock on the other side of the room near the second entry door to alleviate
    the line. This helped productivity because employees did not feel the need to
    pack up early and waste time standing at a timeclock and eased some of the grumpiness
    felt at the end of the day.


    # 311. How do you perform in a job with clearly-defined objectives and goals?


    # Answer:


    It is important to consider the position when answering this question - clearly,
    it is best if you can excel in a job with clearly-defined objectives and goals
    (particularly if you''re in an entry level or sales position). However, if you''re
    applying for a position with a leadership role or creative aspect to it, be sure
    to focus on the ways that you additionally enjoy the challenges of developing
    and implementing your own ideas.


    # As an example:'
- md: '

    I enjoy having a set guideline of rules to abide by. This helps to streamline
    processes, especially when dealing with customer-centric companies. With that
    said, if I see a policy that can be improved on, I have no problem with bringing
    my ideas to the forefront, testing them and if they work, implementing them. With
    the improvement in a process, the policy would need to be updated, and all employees
    notified of the new procedures so all staff are on the same page.


    ## 312. How do you perform in a job where you have great decision-making power?


    Answer:


    The interviewer wants to know that, if hired, you won''t be the type of employee
    who needs constant supervision or who asks for advice, authority, or feedback
    every step of the way. Explain that you work well in a decisive, productive environment,
    and that you look forward to taking initiative in your position.


    As an example:


    I have been given the opportunity to be in the role of decision maker many times
    in previous roles. There are times where a guideline exists of how to properly
    perform the job and limitations within your role, however there are instances
    where you must make a prompt decision on the spot. During these times I have no
    problem with being creative in solving a problem and informing my superiors of
    what took place afterward, to keep them in the loop.


    ## 313. If you saw another employee doing something dishonest or unethical, what
    would you do?


    Answer:


    In the case of witnessing another employee doing something dishonest, it is always
    best to act in accordance with company policies for such a situation - if you
    don''t know what this company''s specific policies are, feel free to simply state
    that you would handle it according to the policy and by reporting it to the appropriate
    persons in charge. If you are aware of the company''s policies (such as if you
    are seeking a promotion within your own company), it is best to specifically outline
    your actions according to the policy.


    As an example:


    This really depends on what they were doing. Some things such as stealing large
    amounts of money, equipment, or anything that puts themselves in danger, would
    need to be reported immediately. There may be times however, where a coworker
    is perhaps breaking a policy or going around protocol to save time or cut costs,
    and it may be detrimental to themselves or the company. In these instances, I
    would feel comfortable discussing the issue with my coworker myself and seeing
    if I can help them in any way and let them know that they were doing was wrong.
    They may not have even realized it was wrong or may have been going through rough
    times. If they continued to do so after we spoke, I would feel comfortable bringing
    the issue to management.


    ## 314. Tell me about a time when you learned something on your own that later
    helped in your professional life.


    Answer:


    This question is important because it allows the interviewer to gain insight into
    your dedication to learning and advancement. Choose an example solely from your
    personal life, and provide a brief anecdote ending in the lesson you learned.
    Then, explain a clear and thorough manner how this lesson has translated into
    a usable skill or practice in your position.


    As an example:


    I work with a volunteer organization on the weekends. When the president of the
    organization was unavailable to lead a fundraising event, I had to step in and
    assure the event went smoothly, set it up, and emcee to the crowd. I was very
    nervous but this ended helping increase my public speaking skills drastically,
    and the next team meeting we had at work I was able to speak to my coworkers and
    present my project without feeling nervous. I was also asked to coordinate the
    next employee event at work and used some of the things from the volunteer event
    I worked at the employee event at work, such as seating arrangement and check
    in process. I became a more valued member of the team at work.


    ## 315. Tell me about a time when you developed a project idea at work.


    Answer:


    Choose a project idea that you developed that was typical of projects you might
    complete in the new position. Outline where your idea came from, the type of research
    you did to ensure its success and relevancy, steps that were included in the project,
    and the end results. Offer specific before and after statistics, to show its success.


    As an example:


    We were having difficulties in hiring new sales staff. I developed the idea to
    update our sales position job descriptions. The job descriptions we had were outdated
    and had not been updated in several years, during which time, many new software
    tools had become available, and the position had changed. The sales team got together
    and reviewed the current job description and provided their input as to what they
    felt should be added and removed from the descriptions, then management reviewed
    and made updates accordingly. Once we began running job ads with the new job description,
    we had an increase in qualified sales professionals applying who understood the
    position they applied for and were better matches.


    ## 316. Tell me about a time when you took a risk on a project.


    Answer:


    Whether the risk involved something as complex as taking on a major project with
    limited resources or time, or simply volunteering for a task that was outside
    your field of experience, show that you are willing to stretch out of your comfort
    zone and to try new things. Offer specific examples of why something you was risky
    and explain what you learned in the process - how this prepared you for a job
    objective you later faced in your career.


    As an example:


    I worked in the engineering department of a utility company. We had an emergency
    situation where a water pipe broke in the community and were overwhelmed with
    customer calls from the community regarding their utility bills. During this time,
    there were two customer service reps out on leave, so I offered my assistance
    since I was in between major projects. I was completely out of my comfort zone
    however I assisted with taking customer calls, answering basic questions, and
    naming names and numbers of the customers I was unable to help, so the supervisor
    could call them back later. I was able to collect payment from approximately 100
    customers, successfully answer about 50 questions, and take information for call
    backs on another 25. I learned more about how what I did in my department connected
    to the customer service reps and the types of questions they are asked by customers
    and challenges they face. After this situation, two departments began working
    together more, and even had quarterly meetings together where we provided updates
    on items that may directly impact the work of the other department.


    ## 317. What would you tell someone who was looking to get into this field?


    Answer:


    This question allows you to be the expert - and will show the interviewer that
    you have the knowledge and experience to go along with any training and education
    on your resume. Offer your knowledge as advice of unexpected things that someone
    entering the field may encounter and be sure to end with positive advice such
    as the passion or dedication to the work that is required to truly succeed.


    As an example:


    If someone were looking to get into the field of sales, I would suggest first
    looking in what certificate programs or degree options are available that may
    help with the field. I would also suggest if you are not comfortable with speaking
    to others whether one on or in group settings, to take a public speaking class
    to boost your confidence. I would suggest learning the ins and outs about sales
    and finding a product that you are truly passionate about selling. If you are
    not passionate about your business, especially in sales, you will not do well.
    Once you find what you are passionate about selling, learn everything you can
    out about it. If it is a product, use it test it. If it is a service, try it out.
    Remember to allow yourself time in the beginning to fail a few times, this is
    not the end of the world as it helps you learn. Keep being persistent in your
    work and learn what works and does not work with your target audience. Have a
    positive attitude with customers and clients, find a balance between seeming too
    pushy or eager, but not too timid and disinterested, and don''t forget the follow
    ups after making first contact!

