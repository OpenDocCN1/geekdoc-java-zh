    \ 允许附加回调，在结果可用时执行。\n- `Future` 接口没有异常处理机制。`CompletableFuture` 提供了 `exceptionally()`\
    \ 方法允许在发生异常时运行备用代码。\n\n### 258. 什么是 StringJoiner？请用代码示例解释。\n\n答案：\n\n`StringJoiner`\
    \ 是 Java 8 添加的一个新类。它有助于通过分隔符连接字符串，并带有前缀和后缀。以下代码演示了这一点：\n\n```\nStringJoiner strJoiner\
    \ = new StringJoiner(\"-\",\"[\",\"]\");\n//行 1\nstrJoiner.add(\"cat\"); //行 2\n\
    strJoiner.add(\"dog\"); //行 3\nstrJoiner.add(\"mouse\"); //行 4\nSystem.out.println(strJoiner);\
    \ //行 5\n```\n\n这段代码创建了一个 `StringJoiner`。它使用符号 `-` 作为分隔符，使用方括号 `[]` 作为前缀和后缀。然后它调用\
    \ `add()` 方法添加了一些字符串值。因此这段代码输出了：\n\n[cat-dog-mouse]\n\n### 259. 解释 Comparator.reversed\
