    \ 同时支持顺序处理和并行处理。\n- `Iterator` 可以遍历集合。`SplitIterator` 可以遍历集合，也可以遍历 `Stream`。\n\
    - `Iterator` 只允许逐个遍历集合中的元素。而 `SplitIterator` 既允许逐个遍历集合元素，也可以批量遍历。\n\n## 第 9 章\n\
