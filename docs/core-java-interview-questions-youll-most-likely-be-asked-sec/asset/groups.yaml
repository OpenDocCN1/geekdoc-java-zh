    ## CHAPTER 03

    ## Deadlines and Time Management


    ### 318. Tell me about a time when you didn''t meet a deadline.


    Answer:


    Ideally, this hasn''t happened - but if it has, make sure you use a minor example
    to illustrate the situation, emphasize how long it happened, and be sure that
    you did as much as you could ensure that the deadline was met. Additionally, be
    sure to include what you learned about managing time better or prioritizing tasks
    in order to meet all future deadlines.


    As an example:


    I rarely, if ever miss a deadline. With that said, I do recall about two years
    ago I missed a deadline in submitting a report to the finance department. The
    problem ended up being that I had taken on too many projects all at once, and
    then had a couple of “urgent” unexpected issues thrown in as well as that week.
    I failed to ask for help, thinking I could do it all on my own and not wanting
    to give my supervisor the impression that I couldn''t handle the job. What happened
    though that I let the supervisor down and when I sat down to discuss the issue
    with them assured me that if I had just kept the communication about my workload,
    they would have helped pick up the slack. From then on, I made sure to be more
    open with my supervisor with my current workload and express any concerns I have
    with deadlines. I have not missed a deadline since, and by my relationship with
    my teammates and productivity within the department have both improved along with
    the more open communication.


    ### 319. How do you eliminate distractions while working?


    Answer:


    With the increase of technology and the ease of communication, new distractions
    arise every day. Your interviewer will want to see that you are still able to
    focus on work, and that your productivity has not been affected, by an example
    showing a routine you employ in order to stay on task.


    As an example:


    Each morning, I look over the day''s tasks and prepare for what I need to do.
    I check my e-mail, messages, and other personal items and then put away my personal
    devices. I make sure my family and friends know that I check messages only during
    breaks, and if there is an emergency they have a good phone number to reach me.
    During breaks during the work week, I do not engage in a lot of social media,
    as that can drag into the work day. On my breaks I prefer to walk, read, check
    in with a coworker for a few minute chat, or message a family or friend to say
    hello then it is back to work.


    ### 320. Tell me about a time when you worked in a position with a weekly or monthly
    quota to meet. How often were you successful?


    Answer:


    Your numbers will speak for themselves, and you must answer this question honestly.
    If you were regularly meeting your quotas, be sure to highlight this in a confident
    manner and don''t shy in pointing out your strengths in this area. If your statistics
    are less than stellar, try to point out trends in which they increased toward
    the end of your employment, and show reflection as to ways you can improve in
    the future.


    As an example:


    I consistently meet my deadlines every quarter. I take what the company gives
    me as a quota then I add my own personal goal to that. This way, I have something
    higher to work toward, and allows wiggle room if I am able to meet just the company
    goal and not my own as well. I try not to focus too much on the daily sales but
    rather do a monthly check. This allows for me to not spend too much wasted time
    on worrying about progress while making sure I am on target.


    ### 321. Tell me about a time when you met a tough deadline, and how you were
    able to complete it.


    Answer:


    Explain how you were able to prioritize tasks, or to delegate portions of assignments
    to other team members, in order to deal with a tough deadline. It may be beneficial
    to specify why the deadline was tough - make sure it''s clear that it was not
    a result of procrastination on your part. Finally, explain how you were able to
    successfully meet the deadline, and what it took to get there in the end.


    As an example:


    I was placed with the large task of submitting a state report I had never done
    before, due to my coworkers'' sudden absence. I researched the topic on my own
    downtime when I could, reached out to other companies to see how they were completing
    the project, and I found an online training I could take during business hours.
    With permission from my boss, I delegated clerical duties to the department secretary
    until I was able to finish the state report. I was able to submit it ahead of
    schedule and it added value to my job and me as an employee, as I was asked to
    assist with other projects after that, received a great performance review and
    raise during subsequent evaluation period.


    ### 322. How do you stay organized when you have multiple projects on your plate?


    Answer:


    The interviewer will be looking to see that you can manage your time and work
    well - being able to handle multiple projects at once, and still giving each the
    attention it deserves, is a great mark of a worker''s competence and efficiency.
    Go through a typical process of goal-setting and prioritizing, and explain the
    steps of these to the interviewer, so he or she can see how well you manage time.


    As an example:


    I keep an ongoing list of tasks on a notepad and Outlook calendar. Each morning
    I arrive to work, I look at my Outlook calendar and I review the written list
    of tasks that I had added the day before on a notepad throughout the day, and
    prioritize what needs to be done that day and what can wait. For the tasks that
    can be done later in the week, I utilize the calendar in Outlook to put tasks
    on specific dates, and prioritize what needs to be done that day and what can
    wait.


    ### 323. How much time during workday do you spend on auto-pilot?


    Answer:


    While you may wonder the employer is looking to see how efficient you are (for
    example, increase sales or productivity), but in almost every case, the employer
    wants to see that you are constantly thinking, analyzing, and processing. Even
    if things are running smoothly, there is usually an opportunity somewhere to make
    things more efficient. Stress your dedication to ongoing development.


    As an example:


    I am good at my job and find myself going into auto-pilot often. With that said,
    when I complete a project I take time to review accuracy. If I get the project
    done with downtime to spare, I may try out different methods to see if there are
    ways to improve. Sometimes there is and there simply isn''t; however, I constantly
    find ways to utilize my time in the most effective and proficient manner.


    ### 324. How do you handle deadlines?


    Answer:


    The most important part of handling tough deadlines is to prioritize tasks and
    set goals for completion, as well as to delegate or eliminate unnecessary work.
    Lead the interviewer through a general scenario and display your competency through
    your ability to organize and set priorities, and most importantly, remain calm.


    As an example:


    I utilize Outlook calendar for ongoing tasks that I know have be completed on
    a recurring basis. For example, every Monday I have to submit my sales report,
    and every Wednesday I have to file. If there are any special projects coming up
    that I need to prepare for, I will set aside time and reminders on my calendar
    to prepare for the upcoming project. I also take time every morning when I get
    to work to review the tasks I have that day, and do the same at the end of each
    day as well to complete everything I needed to prepare for the next day. If I
    feel that I am unable to meet a deadline for some reason, I communicate with the
    department I am working with and see if any adjustments need to be made. Communication
    is key. Additionally, I am constantly mindful of the need to adjust my schedule
    accordingly if urgent projects arise.


    ### 325. Tell me about your personal problem-solving process.


    Answer:


    Your personal problem-solving process should include outlining the problem, coming
    up with possible ways to fix the problem, and setting a clear action plan that
    leads to resolution. Keep your answer brief and organized, and explain the steps
    in a concise, calm manner that shows you are level-headed even under stress.

