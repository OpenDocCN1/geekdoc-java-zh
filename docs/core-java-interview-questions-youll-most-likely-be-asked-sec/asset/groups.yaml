    \ a new List sorted based on the Employee salary using Streams?\n\n## Answer:\n\
    \nThe following code can be used to create a new List sorted based on the Employee\
    \ salary:\n\n```\nList<Employee> sortedList =\nemployees.stream().sorted((emp1,\
    \ emp2)->\nemp1.getSalary()-\nemp2.getSalary()).collect(Collectors.toList());\n\
    sortedList.forEach(emp->\nSystem.out.println(emp.getSalary()));\n```\n\nThis code\
    \ first obtains a Stream on the employees List. It invokes the sorted() operation.\
    \ The sorted() method accepts as input a Comparator. Here, a lambda expression\
    \ is used to compare the salaries. Finally, this code prints the following output:\n\
    \n```\n8000\n10000\n15000\n```\n\n## 227. What is a method reference? What are\
    \ the benefits of method references?\n\n## Answer:\n\nA method reference is a\
    \ shortcut for a lambda expression that calls an existing method. It was introduced\
    \ in Java 8.\n\nMethod references have several benefits:\n\n- a. **They avoid\
    \ code duplication**: Sometimes, your code may already have a method that you\
    \ would like to specify in lambda expression. Instead of writing the code again,\
    \ you can refer to it.\n- b. **They make code concise**: Method references help\
    \ make the code more readable and concise.\n\n## 228. What are the different types\
    \ of method references?\n\n## Answer:\n\nThere are 4 types of method references:\n\
    \n- a. **Static method reference**: This occurs when a static method of a class\
    \ is accessed via the method reference. Its syntax is:\n```\nclass::staticmethod\n\
    ```\n- b. **Instance method reference**: This occurs when an instance method of\
    \ a class is referenced via the method reference. Its syntax is:\n```\nobject::instancethod\n\
    ```\n- c. **Constructor reference**: This occurs when a constructor of a class\
    \ is referenced via the method reference. Its syntax is:\n```\nclass::new\n```\n\
    - d. **Arbitrary method reference**: This occurs when an instance method of a\
    \ class is accessed but not on any object. Its syntax is:\n```\nclass::instancethod\n\
    ```\n\n## 229. Give an example of static method reference.\n\n**Answer:**\n\n\
    Static method reference occurs when a static method of a class is accessed via\
    \ the method reference. The following code demonstrates this:\n\n```\npublic class\
    \ MethodReferenceDemo {\n    public static boolean checkIfGreaterThan8(int num)\
    \ {\n        return num > 8;\n    }\n    public static void main(String[] args)\
    \ {\n        Predicate<Integer> numberChecker = MethodReferenceDemo::checkIfGreaterThan8;\n\
    \        boolean flag = numberChecker.test(10);\n    }\n}\n```\n\nHere, the MethodReferenceDemo\
    \ class has a static method `checkIfGreaterThan8()`. This checks if the input\
