- md: "\n## CHAPTER 06\n## Static and Default Interface Methods\n\n**242. What are\
    \ static and default methods? Why were they introduced by Java 8?\n\nAnswer:\n\
    \nBefore Java 8, interfaces could only have abstract methods. So, they could not\
    \ have methods with method bodies. Java 8 allows interfaces to have methods with\
    \ method bodies as static and default methods. These were added for the following\
    \ reasons:\n\n- Default interface methods help to keep code backward compatible.\
    \ Prior to Java 8, if a new method was added to an interface, all the classes\
    \ that implement the interface needed to be modified. Default methods overcome\
    \ this restriction. So, they allow you to add a method with a method body in the\
    \ interface. So, all implementing classes do not need to be modified.\n- Static\
    \ interface methods help to group utility methods. Static interface methods cannot\
    \ be overridden in the classes that implement the method. So, this avoids unwanted\
    \ results due of incorrect implementation and provides an additional level of\
    \ security.\n\n### 243. What is the difference between abstract class and an interface\
    \ after Java 8?\n\nAnswer:\n\nThe addition of Java 8 default interface methods\
    \ has reduced the distinction between abstract classes and interfaces. Prior to\
    \ Java 8, interfaces could not have concrete methods. However, Java 8 has added\
    \ default and static methods in interfaces. These are methods that have a method\
    \ body. This has further reduced the distinction between abstract classes and\
    \ interfaces. However, there are some differences between the two. These are as\
    \ follows:\n\n- Abstract classes can have instance fields. Interfaces on the other\
    \ hand cannot have instance fields. So basically, an abstract class can have a\
    \ state via an instance field, whereas an interface cannot have state.\n- Abstract\
    \ class can have a constructor and can be instantiated. Interface on the other\
    \ hand cannot have a constructor.\n\n### 244. Write a code sample that demonstrates\
    \ a default method.\n\nAnswer:\n\nA default method is simply a method with a method\
    \ body within an interface. It has the default keyword. The following code demonstrates\
    \ this:\n\n```java\npublic interface MyInterface {\n    public void doSomething();\n\
    \    public default void doSomethingElse() {\n        System.out.println(\"Doing\
    \ something else...\");\n    }\n}\n```\n\nThis code has declared an interface\
    \ called MyInterface. It has an abstract method called doSomething() and a default\
    \ method called doSomethingElse(). The default method has the default keyword\
    \ specified. It has a method body.\n\n### 245. What is the difference between\
    \ a static and a default interface method?\n\nAnswer:\n\nBoth static and default\
    \ interface methods have a method body. However, there are some differences between\
    \ the two:\n\n- A static method has the static keyword specified, while a default\
    \ method has the default keyword specified.\n- Default interface methods can be\
    \ overridden. Static methods on the other hand cannot be overridden.\n- Default\
    \ methods can be invoked via an object of the class that implements the interface.\
    \ Static interface methods on the other hand cannot be invoked via the class or\
    \ object of the class that implements the interface. They need to be invoked via\
    \ the interface name.\n\n### 246. Identify the error in the following code snippet\
    \ and explain how it can be fixed.\n\n```java\npublic interface MyInterface {\n\
    \    public static void doSomething() {\n        System.out.println(\"Doing something...\"\
    );\n    }\n}\npublic class MyClass implements MyInterface {\n    public static\
    \ void main(String args[]) {\n        MyClass obj = new MyClass();\n        obj.doSomething();\
    \ // Line 1\n    }\n}\n```\n\nAnswer:\n\nThe code above defines an interface called\
    \ MyInterface with a static method called doSomething(). It then creates a class\
    \ called MyClass which implements MyInterface. The main method of MyClass creates\
    \ an object of MyClass called obj and invokes the doSomething() method at Line\
    \ 1. This causes a compilation error at Line 1. This is because the code tries\
    \ to access a static interface method via an object of the class. Static interface\
    \ methods can only be accessed via the interface name. In order to fix the error,\
    \ Line 1 needs to be replaced as follows:\n\n```java\nMyInterface.doSomething();\n\
    ```\n\n## CHAPTER 07\n## Optionals\n\n**247. What is an Optional and why was it\
    \ added by Java 8?\n\nAnswer:\n\nAn Optional is used to represent a value that\
    \ can either be present or absent. It has methods that can be used to retrieve\
    \ the underlying value if present. The following code demonstrates an Optional:\n\
    \n```java\nOptional<Integer> number;\n```\n\nSo here, number is an Optional of\
    \ type Integer. It may or may not contain a value.\n\nOptionals were added by\
    \ Java 8 to avoid the boilerplate code associated with null checks. Sometimes,\
    \ a method may return a null. This can result in a NullPointerException. In order\
    \ to avoid the exception, the code that invokes the method needs to have explicit\
    \ null checks. This can make the code difficult to read. Java 8 Optionals help\
    \ to avoid this boilerplate code. So instead of having an explicit null check,\
    \ an optional can be used. If the value is present it can be retrieved.\n\n###\
    \ 248. How can an Optional be created?\n\nAnswer:\n\nThere are some static methods\
    \ on the Optional class which can be used to create an Optional. These are as\
    \ follows:\n\n- a. Optional.isEmpty – This creates an empty Optional, that is\
    \ an Optional without a value as shown below:\n\n```java\nOptional<Integer> number\
    \ = Optional.empty();\n```\n\n- b. Optional.of – This creates an Optional with\
    \ a particular value as shown below:\n\n```java\nOptional<Integer> number = Optional.of(10);\
    \ // creates Optional with the value 10\n```\n\n- c. Optional.ofNullable – This\
    \ creates an Optional with either a null or a non-null value as shown below:\n\
    \n```java\nOptional<Integer> number = Optional.ofNullable(10); // creates Optional\
    \ with the value 10\n```\n\nIt can also be used to create an Optional with a null\
    \ value as follows:\n\n```java\nOptional<Integer> number = Optional.ofNullable(null);\n\
    ```\n\n### 249. Explain the Optional.ifPresent method with a code sample.\n\n\
    Answer:\n\nThe Optional.ifPresent method performs an operation on the value in\
    \ the Optional if it is present. The operation to be performed is specified as\
    \ a Consumer instance. If the Optional is empty, it does not do anything. The\
    \ following code demonstrates this:\n\n```java\nOptional<String> strOptional =\
    \ Optional.of(\"Test\");\n```\n\n```java\nstrOptional.ifPresent(str ->\n    System.out.println(str.toUpperCase()));\n\
    ```\n\nThis code creates an Optional strOptional corresponding to the value Test.\
    \ The ifPresent method is then invoked with a lambda expression that converts\
    \ the value in the Optional to uppercase and prints it. So, this code prints the\
    \ following output:\n\n```\nTEST\n```\n\nIn case, the input Optional is empty,\
    \ the ifPresent() method does not do anything.\n\n### 250. What is the difference\
    \ between the orElse and orElseThrow method?\n\nAnswer:\n\n- Both the orElse()\
    \ and orElseThrow() are methods on the Optional class. If a value is present in\
    \ the Optional, they return the value. They differ in what happens when a value\
    \ is not present in the Optional.\n- The orElse() method accepts as parameter\
    \ a value and returns this value if invoked on an empty Optional. The following\
    \ code demonstrates this:\n\n```java\nOptional<String> strOptional1 = Optional.empty();\n\
    String strValue1 = strOptional1.orElse(\"Default\");\n```\n\nIn, since strOptional1\
    \ is an empty Optional, the orElse() method returns the value Default.\n\nThe\
    \ orElseThrow() method throws an Exception if invoked on an empty Optional. It\
    \ accepts as parameter a Supplier instance that returns an Exception. The following\
    \ code demonstrates this:\n\n```java\nOptional<String> strOptional2 = Optional.empty();\n\
    String strValue2 = strOptional2.orElseThrow(() -> new IllegalArgumentException());\n\
    ```\n\nHere, since strOptional2 is an empty Optional, orElseThrow() throws an\
    \ IllegalArgumentException.\n\n### 251. What will be the output of the following\
    \ code snippet?\n\n```java\nOptional<Integer> opInt1 = Optional.of(200); // Line\
    \ 1\nOptional<Integer> opInt2 = opInt1.filter(num -> num > 100); // Line 2\nSystem.out.println(opInt2.get());\
    \ // Line 3\n```\n\nAnswer:\n\nThe Optional class has a method called filter()\
    \ which is used in the code snippet above. The filter() method accepts as Predicate\
    \ and applies the Predicate to the value in the Optional if present. If the condition\
    \ in the Predicate is satisfied, it returns the value in the Optional, otherwise\
    \ it returns an empty Optional. In this case, Line 1 creates an Integer Optional\
    \ with the value 200. Line 2 invokes the filter() method with a Predicate that\
    \ checks if the value in the Optional is greater than 100. Since this is true,\
    \ the filter() method returns an Optional with the value 200 which is assigned\
    \ to opInt2. So the get() method returns this value.\n\nSo, this code prints the\
    \ following output:\n200\n"
  mdcn: "\n\n## 第 06 章\n## 静态和默认接口方法\n\n**242. 什么是静态方法和默认方法？Java 8 为什么要引入它们？**\n\n\
    答案：\n\n在 Java 8 之前，接口只能包含抽象方法。因此，它们不能包含带有方法体的方法。Java 8 允许拥有带有方法体的方法，即静态方法和默认方法。引入这些方法的原因如下：\n\
    \n- 默认接口方法有助于保持代码的向后兼容性。在 Java 8 之前，如果向接口中添加了新方法，所有实现该接口的类都需要进行修改。默认方法克服了这一限制。因此，它们允许你在接口中添加带有方法体的方法，而所有的实现类就不需要修改了。\n\
    - 静态接口方法有助于将工具方法分组。静态接口方法不能在实现方法的类中被重写。因此这避免了由于实现错误导致的意外结果，并提供了额外的安全保障。\n\n###\
    \ 243. 在 Java 8 之后，抽象类和接口之间的区别是什么？\n\n答案：\n\nJava 8 默认接口方法的引入缩小了抽象类和接口之间的区别。在\
    \ Java 8 之前，接口不能包含具体方法。然而，Java 8 在接口中增加了默认和静态方法。这些是带有方法体的方法。这进一步缩小了抽象类和接口之间的区别。不过，两者之间仍然存在一些差异，具体如下：\n\
    \n- 抽象类可以拥有实例字段。另一方面，接口不能拥有实例字段。所以基本上，抽象类可以通过实例字段拥有状态，而接口不能拥有状态。\n- 抽象类可以有构造函数并可以被实例化。另一方面，接口不能有构造函数。\n\
    \n### 244. 编写一个演示默认方法的代码示例。\n\n答案：\n\n默认方法简单来说就是接口内部带有方法体的方法。它带有 `default` 关键字。以下代码演示了这一点：\n\
    \n```java\npublic interface MyInterface {\n    public void doSomething();\n  \
    \  public default void doSomethingElse() {\n        System.out.println(\"Doing\
    \ something else...\");\n    }\n}\n```\n\n这段代码声明了一个名为 `MyInterface` 的接口。它包含一个名为\
    \ `doSomething()` 的抽象方法和一个名为 `doSomethingElse()` 的默认方法。默认方法指定了 `default` 关键字，并包含一个方法体。\n\
    \n### 245. 静态接口方法和默认接口方法之间的区别是什么？\n\n答案：\n\n静态和默认接口方法都带有方法体。然而，两者之间存在一些差异：\n\n\
    - 静态方法指定了 `static` 关键字，而默认方法指定了 `default` 关键字。\n- 默认接口方法可以被重写。另一方面，静态方法不能被重写。\n\
    - 默认方法可以通过实现接口的类对象来调用。另一方面，静态接口方法不能通过实现接口的类或对象来调用。它们需要通过接口名称来调用。\n\n### 246. 识别以下代码段中的错误并解释如何修复它。\n\
    \n```java\npublic interface MyInterface {\n    public static void doSomething()\
    \ {\n        System.out.println(\"Doing something...\");\n    }\n}\npublic class\
    \ MyClass implements MyInterface {\n    public static void main(String args[])\
    \ {\n        MyClass obj = new MyClass();\n        obj.doSomething(); // Line\
    \ 1\n    }\n}\n```\n\n答案：\n\n上述代码定义了一个名为 `MyInterface` 的接口，其中包含一个名为 `doSomething()`\
    \ 的静态方法。然后创建了一个名为 `MyClass` 的类来实现该接口。`MyClass` 的 `main` 方法创建了一个 `MyClass` 对象 `obj`\
    \ 并在第 1 行调用了 `doSomething()` 方法。这导致第 1 行出现编译错误。这是因为代码尝试通过类对象访问静态接口方法。静态接口方法只能通过接口名称访问。要修复此错误，需要将第\
    \ 1 行替换：\n\n```java\nMyInterface.doSomething();\n```\n\n## 第 07 章\n## Optional（可选）\n\
    \n**247. 什么是 Optional？为什么 Java 8 要添加它？**\n\n答案：\n\n`Optional` 用于表示一个可能存在也可能不存在的值。它包含了一些方法，可以在值存在时用于获取底层值。以下代码演示了\
    \ `Optional`：\n\n```java\nOptional<Integer> number;\n```\n\n在这里，`number` 是一个 `Integer`\
    \ 类型的 `Optional`。它可能也可能不包含值。\n\nJava 8 引入 `Optional` 是为了避免与空检查相关的样板代码。有时，方法可能会返回\
    \ `null`，这可能导致 `NullPointerException`。为了避免该异常，调用方法的代码需要进行显式的空检查。这会使代码难以阅读。Java\
    \ 8 的 `Optional` 有助于避免这些样板代码。因此，与其进行显式的空检查，可以使用 `optional`。如果值存在，就可以将其提取。\n\n\
    ### 248. 如何创建 Optional？\n\n答案：\n\n`Optional` 类中有一些静态方法可以用于创建 `Optional`。它们如下：\n\
    \n- a. `Optional.isEmpty` – 创建一个空的 `Optional`，即如下所示的没有值的 `Optional`：\n\n```java\n\
    Optional<Integer> number = Optional.empty();\n```\n\n- b. `Optional.of` – 创建一个带有特定值的\
    \ `Optional`，如下所示：\n\n```java\nOptional<Integer> number = Optional.of(10); //\
    \ 创建一个值为10的Optional\n```\n\n- c. `Optional.ofNullable` – 创建一个带有 `null` 或非空值的 `Optional`，如下所示：\n\
    \n```java\nOptional<Integer> number = Optional.ofNullable(10);\n```\n\n它也可以用于创建一个带有空\
    \ 值的 `Optional`：\n\n```java\nOptional<Integer> number = Optional.ofNullable(null);\n\
    ```\n\n### 249. 带有代码示例解释 Optional.ifPresent 方法。\n\n答案：\n\n`Optional.ifPresent`\
    \ 方法在 `Optional` 存在时对其执行操作。如果 `Optional` 是空的，它什么都不做。以下代码演示了这一点：\n\n```java\nOptional<String>\
    \ strOptional = Optional.of(\"Test\");\n```\n\n```java\nstrOptional.ifPresent(str\
    \ ->\n    System.out.println(str.toUpperCase()));\n```\n\n这段代码创建了值为 Test 的 `strOptional`。所以这段代码输出：\n\
    TEST\n\n### 250. orElse 方法和 orElseThrow 方法的区别是什么？\n\n答案：\n\n- `orElse` 和 `orElseThrow`\
    \ 都是 `Optional` 类的方法。如果 `Optional` 中存在值，它们都会返回该值。它们的区别在于当 `Optional` 中不存在值时的处理。\n\
    - `orElse` 方法接受一个值，并在空 `Optional` 上调用时返回该值。以下代码演示了这一点：\n\n```java\nOptional<String>\
    \ strOptional1 = Optional.empty();\nString strValue1 = strOptional1.orElse(\"\
    Default\");\n```\n\n在这里，由于 `strOptional1` 是空的 `Optional`，`orElse` 方法返回值 Default。\n\
    \n- `orElseThrow` 方法在空 `Optional` 上调用时抛出异常。它接受一个返回异常的 `Supplier` 实例。以下代码演示了这一点：\n\
    \n```java\nOptional<String> strOptional2 = Optional.empty();\nString strValue2\
    \ = strOptional2.orElseThrow(() -> new IllegalArgumentException());\n```\n\n在这里，由于\
    \ `strOptional2` 是空的 `Optional`，`orElseThrow` 抛出了 `IllegalArgumentException`。\n\
    \n### 251. 以下代码段的输出是什么？\n\n```java\nOptional<Integer> opInt1 = Optional.of(200);\
    \ // Line 1\nOptional<Integer> opInt2 = opInt1.filter(num -> num > 100); // Line\
    \ 2\nSystem.out.println(opInt2.get()); // Line 3\n```\n\n答案：\n\n`Optional` 类有一个名为\
    \ `filter()` 的方法，在代码段中使用了它。`filter()` 方法接受一个 `Predicate`，并在 `Optional` 存在时将其应用到该值上。如果\
    \ `Predicate` 中的条件满足，它会返回 `Optional` 中的值，否则返回一个空的 `Optional`。在这种情况下，第 1 行创建了一个值为\
    \ 200 的 `Integer Optional`。第 2 行调用了 `filter()` 方法，并传入了一个检查 `Optional` 值是否大于 100\
    \ 的 `Predicate`。由于这是真的，`filter()` 方法返回了一个值为 200 的 `Optional` 并赋值给 `opInt2`。因此\
    \ `get()` 方法返回了这个值。\n\n所以，这段代码输出：\n200\n\n"
