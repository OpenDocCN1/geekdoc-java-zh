    \ Core Java、Spring、Spring Boot、Hibernate、REST、JDBC 等技术。她是一位专家 Java 培训师/Java 作者，她的文章/课程帮助了数千名学生。她擅长用简单的语言解释复杂的概念。\n\
    \n# 目录\n\n# 第 01 部分 核心 Java\n- OOP 概念\n- 数据类型与数组\n- 控制语句\n- 类与方法\n- 继承\n- 包\n\
    - 异常处理\n- 集合\n- 线程\n- 字符串\n- 内部类\n\n# 第 02 部分 Java 8\n- 函数式接口\n- Lambda 表达式\n\
    - 方法引用\n- 默认方法\n- 静态方法\n- 可选 (Optionals)\n\n# 第 03 部分 Java 9\n- 模块\n- 流\n- 日期\
    \ API\n\n# 第 04 部分 人力资源\n- HR 问题\n- HR 面试\n- 场景题\n\n# 索引\n\n亲爱的读者：\n\n感谢购买《你最可能被问的核心\
    \ Java 面试题》。我们希望这本书在您准备面试时提供丰富的体验。如果您有任何问题或建议，请随时邮件至 vibrantpublishers.com\n\n\
    再次感谢您的购买。祝您面试顺利！\n\n– Vibrant Team\n\n![](img/c9df4df242594cca676f19a60877f783_11_0.png)\n\
    \n#  01\n# 核心 Java\n# Java 8\n# Java 9\n# 人力资源\n\n# 第 01 章\nOOP 概念\n\n001. 解释方法重载和方法重写。\n\
    \n解答：\n\n方法重载是指类中存在多个同相同但参数数量或类型不同的方法。以下代码演示了这一点：\n\n```java\npublic class Calculator\
    \ {\n    public int add (int a, int b) {\n        return a+b;\n    }\n    public\
    \ double add (double a, double b) {\n        return a+b;\n    }\n    public int\
    \ add (int a) {\n        return a+a;\n    }\n}\n```\n\n方法重写是指子类中存在与父类方法名称和参数数量相同的方法。以下代码演示了这一点：\n\
    \n```java\npublic class Animal {\n    public void saySomething () {\n        System.out.println(\"\
    I am an animal\");\n    }\n}\n\npublic class Dog extends Animal {\n    public\
    \ void saySomething() {\n        System.out.println(\"I am a dog\");\n    }\n\
    }\n```\n\n002. 解释 OOP 的优点。\n\n解答：\n\nOOP 的优点如下：\n\n- **可用性**：继承、组合和多态等 OOP 原则有助于重复代码。\n\
    - **扩展性**：使用继承等 OOP 原则编写的代码具有扩展性。\n- **安全性**：封装等 OOP 原则有助于将数据和操作数据的代码结合，使代码更安全。\n\
    - **简单性**：Java 类代表真实世界的对象。这使得代码非常易于理解。\n- **可维护性**：使用 OOP 原则编写的代码更容易维护。\n\n003.\
    \ 编写一个演示封装的代码段。\n\n解答：\n\n封装是指将数据和操作数据的代码结合在单一单元中。简单地创建一个带有私有字段和公共 getter/setter\
    \ 方法的类就是封装\n\n"
