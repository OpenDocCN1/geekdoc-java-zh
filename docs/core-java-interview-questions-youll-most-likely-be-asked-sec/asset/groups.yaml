    Try block is executed\"); //Line 1\n    catch(Exception exp) {\n        System.out.println(\"\
    This is catch block\");\n    }\n}\n```\n\n# 回答：\n\n上述代码无法编译，并会抛出编译错误。这是因为第 1 行的代码写在\
    \ `try` 块结束之后、`catch` 块之前。所有的代码都需要写在 `try` 块或 `catch` 块内部。Java 不允许 `try` 和 `catch`\
    \ 块之间存在代码。\n\n123. 编写一个演示 try/catch/finally 块的代码示例。\n\n# 回答：\n\n下面是一个演示 `try/catch/finally`\
