    \n> Exception in thread “main” java.lang.ArithmeticException: / by zero\n> at\
    \ ExceptionTest.callMethod(ExceptionTest.java:12)\n> at ExceptionTest.main(ExceptionTest.java:9)\n\
    \n这是因为不允许将数字除以 0。\n\n# 125. 解释 Java 中的 try–catch–finally 语句。\n\n# 回答：\n\n`Try–Catch–Finally`\
    \ 语句允许在 Java 中进行异常处理。你可以将想要监控错误的语句放在 `try` 块中。发生异常时需要执行的代码应该放在 `catch` 块中。你还需要指定你想要捕获的异常类型。你可以为不同类型的异常指定多个\
    \ `catch` 块。在 `catch` 块之后，你可以指定放入无论是否抛出异常都需要执行的代码。`catch` 和 `finally` 块是可选的，但你至少需要其中一个。\n\
    \n下面的代码演示了 `try–catch–finally` 语句：\n\n```java\ntry {\n    // 监控异常的代码\n}\ncatch\
    \ (ExceptionType 1) {\n    // 如果发生异常时遵循的指令\n}\ncatch (ExceptionType 2) {\n   \
    \ // 如果发生异常时遵循的指令\n}\ncatch (ExceptionType n) {\n    // 如果发生异常时遵循的指令\n}\nfinally\
    \ {\n    // 无论是否抛出异常，\n    // 这一块都一定会被执行\n}\n```\n\n# 126. 下述代码段的输出是什么？\n\n```java\n\
    public class MyClass1 {\n    public static void main(String args[]) {\n      \
    \  try {\n            int no;\n            no = 5 / 0; //Line 1\n        } catch\
    \ (ArithmeticException e) { //Line 2\n            System.out.println(\"ArithmeticException\"\
    );\n        } catch (ArrayIndexOutOfBoundsException e) { //Line 3\n          \
    \  System.out.println(\"Array Out Bound\");\n        } catch (Exception e) { //Line\
    \ 4\n            System.out.println(\"Unhandled Exception\");\n        } finally\
    \ { //Line 5\n            System.out.println(\"I am done!\");\n        }\n   \
    \     System.out.println(\"Thank You!\"); //Line 6\n    }\n}\n```\n\n# 回答：\n\n\
    此代码打印以下输出：\n\n```\nArithmeticException\nI am done!\nThank You!\n```\n\n第 1 行导致了\
    \ `ArithmeticException`。它被第 2 行的 `ArithmeticException` catch 块捕获，该块打印了文本 ArithmeticException。由于\
    \ `finally` 块无论是否发生错误都会执行，控制权随后转移到第 5 行的 `finally` 块并打印 `I am done`。接下来，控制转移到\
    \ `finally` 块外的第 6 行并打印 `Thank You!!`\n\n# 127. 假设你有一个名为 `webWeb` 的方法，其中包含可能会抛出检查异常（checked\
    \ exception）的代码。你会在代码中处理这种情况？\n\n# 回答：\n\n如果方法抛出检查异常，有两种处理方式：\n\na. 在方法体中使用 try/catch：\n\
    \n```java\npublic void myWeb() {\n  try {\n    // 代码在此\n  } catch (CheckedException\
    \ e) {\n  }\n}\n```\n\n在这里，当代码抛出检查异常时，它会被方法内部的 catch 块捕获。\n\nb. 在方法声明中使用 throws\
    \ 子句：\n\n```java\npublic void myWeb() throws CheckedException {\n  // 代码在此\n}\n\
    ```\n\n在这里，当代码抛出检查异常时，它会通过 throws 子句抛到方法外部。因此，调用该方法的代码需要处理该异常。\n\n# 128. “finally”\
    \ 子句的作用是什么？请举例。\n\n# 回答：\n\n无论是否发生异常，任何始终需要的代码都应该放在 `finally` 子句中。例如，关闭数据库连接、文件系统文件或其他资源的清理代码可以放在\
    \ `finally` 子句中。如果将此类代码放在 `try` 块中，一旦发生异常它可能就不会执行。因此，为了确保此类代码始终执行，需要将它们放在 `finally`\
    \ 块中。\n\n# 129. 解释 Error 和 Exception 区别。\n\n# 回答：\n\n`java.lang.Throwable` 是所有异常类的父类。它有两个子类：`Exception`\
    \ 和 `Error`。它们之间有若干区别：\n\n- `Exception` 代表由应用程序引起的程序错误，例如访问空值、除以 0、写入文件时的错误；`Error`\
    \ 代表发生在代码之外的运行时环境中的错误，例如内存不足等。\n- `Exception` 是应用程序可以处理并恢复的条件。而 `Error` 是应用程序无法恢复的严重问题的异常状态。\n\
    - `Exception` 既包括检查异常（checked）也包括未检查异常（unchecked）。检查异常需要处理或在方法声明的 `throws` 子句中指定。而\
    \ `Error` 总是未检查的，且不需要在 `throws` 子句中声明。\n\n# 130. 什么是 RuntimeException？\n\n"
