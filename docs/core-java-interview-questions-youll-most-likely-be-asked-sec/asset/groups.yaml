  mdcn: "\n\n`wait()` 方法会导致当前线程暂停，直到其他某个线程在同一个对象上调用 `notify`。\n\n如果有多个对象正在等待某个特定对象，`notify()`\
    \ 方法会导致其中任意一个线程恢复。\n\n`notifyAll()` 方法会导致所有等待特定对象的线程都恢复。\n\n## 171. 什么是同步（Synchronization）？\n\
    \n答案：\n\n当多个线程尝试同时访问共享资源时，需要某种方式确保资源在同一时间只有一个线程被访问。实现这一点的过程被称为同步。Java 提供了 `synchronized`\
    \ 关键字来来实现这一点。\n\n## 172. 解释执行以下代码时发生了什么。\n\n```java\nclass TestMyRunnable implements\
    \ Runnable {\n  public void run() {\n    System.out.println(\"Inside Run Method.\"\
    );\n    System.out.println(\"Name of thread is-\":Thread.currentThread().getName());\n\
    \  }\n}\nclass TestMyThread {\n  public static void main(String argument[]) {\n\
    \    TestMyRunnable runnable = new TestMyRunnable();\n    Thread thread = new\
    \ Thread(runnable);\n    Thread.setName(\"My Thread\"); //Line 1\n    thread.start();\
    \ //Line 2\n  }\n}\n```\n\n**答案：**\n\n该代码可以正常编译并显示以下输出：\n\n```\nInside Run Method.\n\
    Name of thread is: My Thread\n```\n\n当执行 Line 1 时，它将线程名称设置为 **My Thread**。因此，当执行\
    \ Line 2 时，它会创建一个新线程并执行 `run()` 方法中的代码，该代码会将线程名称打印为 **My Thread**。\n\n## 173.\
    \ 考虑以下代码：\n\n```java\nclass TestMyRunnable implements Runnable {\n  public void\
    \ run() {\n    for (int iValue = 0; iValue < 1000; iValue++) {\n      System.out.println(\"\
    Name of thread is: \"+Thread.currentThread().getName());\n    }\n  }\n  public\
    \ static void main(String argument[]) {\n    TestMyRunnable runnable = new TestMyRunnable();\n\
    \    Thread threadC = new Thread(runnable);\n    Thread threadD = new Thread(runnable);\n\
    \    threadC.setName(\"Thread 1\");\n    threadD.setName(\"Thread 2\");\n    threadC.start();\n\
    \    threadD.start();\n  }\n}\n```\n\n执行此代码首先会打印 \"Thread 1\" 1000 次，然后打印 \"Thread\
    \ 2\" 1000 次。如果这是错误的，请解释原因。\n\n答案：\n\n执行上述代码时，它不会先打印 Thread 1 1000 次再打印 Thread\
    \ 2 1000 次。线程执行的顺序取决于线程调度器。因此，尽管两个线程都打印了 1000 次它们的名称，但它们打印的顺序是不可知的。\n\n## 174.\
    \ 编写一个让线程暂停十分分钟的代码示例。\n\n答案：\n\n为了让线程暂停十分分钟，你需要在 `run()` 方法内部调用 `sleep()` 方法。`sleep()`\
    \ 方法接受一个 `long` 类型的值作为参数，表示线程应该的毫秒数。以下代码演示了这一点：\n\n```java\ntry {\n  Thread.sleep(10\
    \ * 60 * 1000);\n} catch (InterruptedException exp) {\n}\n```\n\n## 175. 调用同步方法时会发生什么？\n\
    \n答案：\n\n每当执行同步方法时，调用该方法的线程都会获取锁并在方法结束时持有该锁。只有当当前线程完成方法执行后，它才会释放锁。这样其他线程就可以获取锁并执行该方法。因此，`synchronized`\
    \ 关键字防止了多个线程同时执行同步方法中的代码。\n\n## 第 17 章\n\n## Java IO API\n\n## 176. 执行以下代码会发生什么？\n\
