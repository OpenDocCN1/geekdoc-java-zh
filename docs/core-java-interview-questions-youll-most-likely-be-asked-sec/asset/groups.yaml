    \      } catch (ArrayIndexOutOfBoundsException e) { //Line 3\n            System.out.println(\"\
    Array Out Bound\");\n        } catch (Exception e) { //Line 4\n            System.out.println(\"\
    Unhandled Exception\");\n        } finally { //Line 5\n            System.out.println(\"\
    I am done!\");\n        }\n        System.out.println(\"Thank You!\"); //Line\
    \ 6\n    }\n}\n```\n\n# Answer:\n\nThis code prints the following output:\n\n\
    ```\nArithmeticException\nI am done!\nThank You!\n```\n\nLine 1 causes an ArithmeticException.\
    \ This is caught by the ArithmeticException catch block at Line 2 which prints\
    \ the text ArithmeticException. Since finally block is always executed, irrespective\
    \ of whether an error occurs or not, the control then transfers to the finally\
    \ block at 5 and prints I am done. Next, control transfers outside the finally\
    \ block to 6 and prints Thank You!!\n\n# 127. Suppose you have a method called\
    \ myWeb with some code that can throw checked exception. How will you handle this\
    \ in the code?\n\n# Answer:\n\nIf a method throws a checked exception, there are\
    \ two ways that it can be handled:\n\na. Use try/catch within the method body:\n\
    \n```java\npublic void myWeb() {\n  try {\n    //code here\n  } catch (CheckedException\
    \ e) {\n  }\n}\n```\n\nHere, when the code throws a CheckedException, it is caught\
    \ by the catch block within the method.\n\nb. Use throws clause with the method\
    \ declaration:\n\n```java\npublic void myWeb() throws CheckedException {\n  //code\
    \ here\n}\n```\n\nHere, when the code throws a CheckedException, it is thrown\
    \ outside the method by the throws clause. So, the code that invokes this method\
    \ needs to handle the exception.\n\n# 128. What is the use of “finally” clause?\
    \ Give an example.\n\n# Answer:\n\nAny code that needs to be always executed irrespective\
    \ of whether an exception occurs or not, should be placed within the finally clause.\
    \ So, for example clean–up code like closing database connections or files on\
    \ the file system or other resources can be placed in the finally clause. If such\
    \ code is placed in the try block, there is a possibility that it may not execute\
    \ if an exception occurs. So, to ensure that such code is always executed, it\
    \ needs to be placed in the finally block.\n\n# 129. Explain the differences between\
    \ Error and Exception.\n\n# Answer:\n\nThe java.lang.Throwable is the superclass\
    \ of all the exception classes. It has two sub-classes, Exception and Error. There\
    \ are several differences between the two:\n\n- An Exception represents programmatic\
    \ errors that are caused by the application itself like accessing a null value,\
    \ dividing by 0, error while writing to a file, An Error represents errors that\
    \ occur outside your code within the runtime environment like running out of memory,\
    \ etc.\n- Exceptions are conditions that an application can handle and recover\
    \ from. Errors on the other hand are abnormal conditions that indicate serious\
    \ problems that an application cannot recover from.\n- Exceptions are both checked\
    \ as well as unchecked. Checked exceptions need to be handled or specified within\
    \ the throws clause in the method declaration. Errors on the other hand are always\
    \ unchecked and need not be declared in the throws clause.\n\n# 130. What is a\
    \ RuntimeException?\n"
