    \ Collectors.setTo, Collectors.toMap, Collectors.toCollection which can be used\
    \ to convert the Stream to other types of Collections.\n\n## 222. What is the\
    \ output of the following code snippet?\n\n```\nStream<Integer> numbers = Stream.of(10,15,20,25);\n\
    boolean anyMatch = numbers.anyMatch(num-> num%2==0);\nSystem.out.println(anyMatch);\n\
    ```\n\n## Answer:\n\nThe code snippet above uses the anyMatch() method on the\
    \ Stream Interface. This method returns true if any of the elements in the input\
    \ Stream match the specified condition. In this case, it checks if there is an\
    \ even number in the input Stream. Since there are even numbers in the Stream,\
    \ the anyMatch() method returns a true. So, this code prints the following output:\n\
    \n```\ntrue\n```\n\n## 223. What is the difference between a Stream and a Collection?\n\
    \n## Answer:\n\nThere are several differences between a Stream and a Collection.\
    \ These are as follows:\n\n- • Collections actually store the data. A stream on\
    \ the other hand does not store any data, it just performs some operations on\
    \ the underlying data\n- • When you perform an operation on a Collection, the\
    \ Collection gets modified. When you perform an operation on a Stream obtained\
    \ on a Collection, the underlying Collection does not get modified\n- • A Collection\
    \ can be modified after it is created. A Stream on the other hand cannot be modified\
    \ after it is constructed\n- • You can traverse a Collection any number of times.\
    \ However, you can traverse a Stream only once. If you wish to traverse over a\
    \ Stream again it is not possible, you need to create a new Stream from the underlying\
    \ source and traverse it again\n\n## 224. Suppose you have a List of String values.\
    \ You want to create a new List that eliminates the duplicates from the original\
    \ List and has the String values in uppercase. How will you achieve this via Stream\
    \ operations?\n\n## Answer:\n\nThe following code snippet demonstrates the above\
    \ requirement:\n\n```\nList<String> fruits =\nArrays.asList(\"Apple\",\"Mango\"\
    ,\"Banana\",\"Apple\",\n\"Orange\",\"Mango\",\"Strawberry\");//Line 1\nList<String>\
    \ uniqueFruits =\nfruits.stream().distinct().map(str->\nstr.toUpperCase()).collect(Collectors.toList());\
    \ //Line 2\nuniqueFruits.forEach(str->\nSystem.out.println(str));//Line 3\n```\n\
    \nThis code first creates a List of String values called fruits at Line 1. Line\
    \ 2 invokes the fruits.stream() which obtains a Stream on the fruits List. It\
    \ then invokes the distinct() operation. The distinct() method returns a new Stream\
    \ that consists of only the distinct elements in the input Stream. Next, it invokes\
    \ the map() operation. The map() operation can be used to transform a Stream.\
    \ It accepts as parameter a Function instance and applies the Function to each\
    \ element in the Stream. Here, a lambda expression is used to convert each String\
    \ in the Stream to uppercase. Finally, it invokes the collect() method, passing\
    \ in a Collector that converts the Stream to a List. Line 3 then prints all the\
    \ elements in the uniqueFruits List. So, this code prints the following output:\n\
    \n```\nAPPLE\nMANGO\nBANANA\nORANGE\nSTRAWBERRY\n```\n\n## 225. Is it possible\
    \ to convert an array to a Stream? Explain.\n\n## Answer:\nYes, it is possible\
    \ to convert an Array to a Stream. Java 8 has added a stream() method to the java.util.Arrays\
    \ class. This has many overloaded versions that accept arrays of different data\
    \ types and convert the array to a Stream. The following code demonstrates converting\
    \ an Integer array to a Stream:\n\n```\nint[] numbers = {10,20,30};\nIntStream\
    \ numberStream = Arrays.stream(numbers);\n```\n\nThis code first creates an int\
    \ array called numbers. It then uses the Arrays.stream method passing it the input\
    \ array. The Arrays.Stream method returns an IntStream which is a primitive specialization\
    \ of the Stream interface. Just like IntStream, Java 8 has also added DoubleStream\
    \ and LongStream which are returned when the Arrays.stream method is invoked with\
    \ a double or long array respectively.\n\n## 226. Suppose you have an Employee\
    \ class as follows:\n\n```\npublic class Employee {\n    private String name;\n\
    \    private int salary;\n}\n```\n\nAnd suppose you have a List of Employee objects\
    \ as follows:\n\n```\nList<Employee> employees = new ArrayList<Employee>();\n\
    employees.add(new Employee(\"John\",10000));\nemployees.add(new Employee(\"Ana\"\
