    # CHAPTER 03


    # Deadlines and Time Management


    318. Tell me about a time when you didn''t meet a deadline.


    Answer:


    Ideally, this hasn''t happened - but if it has, make sure you use a minor example
    to illustrate the situation, emphasize how long it happened, and be sure that
    you did as much as you could ensure that the deadline was met. Additionally, be
    sure to include what you learned about managing time better or prioritizing tasks
    in order to meet all future deadlines.


    As an example:


    I rarely, if ever miss a deadline. With that said, I do recall about two years
    ago I missed a deadline in submitting a report to the finance department. The
    problem ended up being that I had taken on too many projects all at once, and
    then had a couple of “urgent” unexpected issues thrown in as well as that week.
    I failed to ask for help, thinking I could do it all on my own and not wanting
    to give my supervisor the impression that I couldn''t handle the job. What happened
    though that I let the supervisor down and when I sat down to discuss the issue
    with them assured me that if I had just kept the communication about my workload,
    they would have helped pick up the slack. From then on, I made sure to be more
    open with my supervisor with my current workload and express any concerns I have
    with deadlines. I have not missed a deadline since, and by my'
  - '[PAGE 285]


    relationship with my team mates and productivity within the department have both
    improved along with the more open communication.


    # 319. How do you eliminate distractions while working?


    Answer:


    With the increase of technology and the ease of communication, new distractions
    arise every day. Your interviewer will want to see that you are still able to
    focus on work, and that your productivity has not been affected, by an example
    showing a routine you employ in order to stay on task.


    As an example:


    Each morning, I look over the days tasks and prepare for what I need to do. I
    check my e-mail, messages, and other personal items and then put away my personal
    devices. I make sure my family and friends know that I check messages only during
    breaks, and if there is an emergency they have a good phone number to reach me.
    During breaks during the work week, I do not engage in a lot of social media,
    as that can drag in to the work day. On my breaks I prefer to walk, read, check
    in with a coworker for a few minute chat, or message a family or friend to say
    hello then it is back to work.


    # 320. Tell me about a time when you worked in a position with a weekly or monthly
    quota to meet. How often were you successful?


    Answer:


    Your numbers will speak for themselves, and you must answer this question honestly.
    If you were regularly met your quotas, be sure to highlight this in a confident
    manner and don''t shy in'
  - '[PAGE 286]


    pointing out your strengths in this area. If your statistics are less than stellar,
    try to point out trends in which they increased toward the end of your employment,
    and show reflection as to ways you can improve in the future.


    # As an example:


    I consistently meet my deadlines every quarter. I take what the company gives
    me as a quota then I add my own personal goal to that. This way, I have something
    higher to work toward, and allows wiggle room if I am able to meet just the company
    goal and not my own as well. I try not to focus too much on the daily sales but
    rather do a monthly check. This allows for me to not spend too much wasted time
    on worrying about progress while making sure I am on target.


    # ### Tell me about a time when you met a tough deadline, and how you were able
    to complete it.


    # Answer:


    Explain how you were able to prioritize tasks, or to delegate portions of assignments
    to other team members, in order to deal with a tough deadline. It may be beneficial
    to specify why the deadline was tough - make sure it''s clear that it was not
    a result of procrastination on your part. Finally, explain how you were able to
    successfully meet the deadline, and what it took to get there in the end.


    # As an example:


    I was placed with the large task of submitting a state report I had never done
    before, due to my coworkers'' sudden absence. I researched the topic on my own
    downtime when I could, reached out to other companies to see how they were completing
    the project, and I found an online training I could take during'
  - '[PAGE 287]


    business hours. With permission from my boss, I delegated clerical duties to the
    department secretary until I was able to finish the state report. I was able to
    submit it ahead of schedule and it added value to my job and me as an employee,
    as I was asked to assist with other projects after that, received a great performance
    review and raise during subsequent evaluation period.


    # 322. How do you stay organized when you have multiple projects on your plate?


    Answer:


    The interviewer will be looking to see that you can manage your time and work
    well - being able to handle multiple projects at once, and still giving each the
    attention it deserves, is a great mark of a worker''s competence and efficiency.
    Go through a typical process of goal-setting and prioritizing, and explain the
    steps of these to the interviewer, so he or she can see how well you manage time.


    As an example:


    I keep an ongoing list of tasks on a notepad and Outlook calendar. Each morning
    I arrive to work, I look at my Outlook calendar and I review the written list
    of tasks that I had added the day before on a notepad throughout the day, and
    prioritize what needs to be done that day and what can wait. For the tasks that
    can be done later in the week, I utilize the calendar in Outlook to put tasks
    on specific dates, so a reminder pops up prompting me to complete the task. Of
    the items on the list that cannot wait, choose the quickest and complete those
    first. Then I dive into the more complex tasks. During the day when urgent items
    arise that put me off my schedule, I revisit my Outlook calendar and written list
    and constantly adjust'
  - '[PAGE 288]


    accordingly. I also keep in communication with my team mates and let them know
    if there are any items I could use assistance with if they have downtime.


    # 323. How much time during your workday do you spend on “auto-pilot?”


    Answer:


    While you may wonder if the employer is looking to see how efficient you are with
    this question (for example, so good at your job that you don''t have to think
    about it), but in almost every case, the employer wants to see that you''re constantly
    thinking, analyzing, and processing what''s going on in the workplace. Even if
    things are running smoothly, there''s usually an opportunity somewhere to make
    things more efficient or to increase sales or productivity. Stress your dedication
    to ongoing development and convey that being on “auto-pilot” is not conducive
    to that type of success.


    As an example:


    I am very good at my job and find myself going in to “auto-pilot” often. With
    that said, when I complete a project or task, I take time to review the completed
    project to assure accuracy. If I get the project done with downtime to spare after,
    I may try to test out a different method of completion to see if there are ways
    to improve the process. Sometimes there is and sometimes there simply isn''t,
    however, I constantly find ways to utilize my time in the most effective and proficient
    manner.


    # 324. How do you handle deadlines?


    Answer:'
  - '[PAGE 289]


    The most important part of handling tough deadlines is to prioritize tasks and
    set goals for completion, as well as to delegate or eliminate unnecessary work.
    Lead the interviewer through a general scenario and display your competency through
    your ability to organize and set priorities, and most importantly, remain calm.


    # As an example:


    I utilize Outlook calendar for ongoing tasks that I know have to be completed
    on a recurring basis. For example, every Monday I have to submit my sales report,
    and every Wednesday I have to file. If there are any special projects coming up
    that I need to prepare for, I will set aside time and reminders on my calendar
    to prepare for the upcoming project. I also take time every morning when I get
    to work to review the tasks I have that day, and do the same at the end of each
    day as well to be completed everything I needed to prepare for the next day. If
    I feel that I am unable to meet a deadline for some reason, I communicate with
    the department I am working with and see if any adjustments need to be made. Communication
    is key. Additionally, I am constantly mindful of the need to adjust my schedule
    accordingly if urgent projects arise.


    # 325. Tell me about your personal problem-solving process.


    # Answer:


    Your personal problem-solving process should include outlining the problem, coming
    up with possible ways to fix the problem, and setting a clear action plan that
    leads to resolution. Keep your answer brief and organized, and explain the steps
    in a concise, calm manner that shows you are level-headed even under stress.


    # As an example:'
- md: '

    When I was working as an equipment mechanic, I began experiencing difficulty in
    managing the amount of work coming from multiple project managers in my company.
    Each of them started pairing me as the technician over their client''s equipment.
    I tried to tell some of them no, and I was told I was not a team player. I ended
    up discussing with the shop foreman what the issue was and explained I was a team
    player but simply did not have enough time in the day to finish all of the jobs
    they were giving me. I started a scheduling board in my work area I put what jobs
    I had, who the project manager was, what phase I was with each project, and expected
    completion time. This allowed for all project managers to clearly see my workload,
    and better understand and appreciate the work I was doing, allowing them to figure
    out if they wanted to pursue someone else to repair their client''s equipment
    or wait for me to have an opening.


    ## 326. What sort of things at work can make you stressed?


    Answer:


    As it''s best to stay away from negatives, keep this answer brief and simple.
    While answering that nothing at work makes you stressed will not be very believable
    to the interviewer, keep your answer to one generic principle such as members
    of a team don''t keep their commitments, and then focus on a solution you generally
    employ to tackle that stress, such as having weekly status meetings or intermittent
    deadlines along the course of a project.


    As an example:


    When someone I work with is not pulling their weight, it can be stressful if it
    ends up affecting my job negatively. During these times I remain calm and talk
    it out with the team. I offer assistance when I can and work on ways to better
    the situation. I do my best to maintain a positive and pleasant attitude, since
    acting out negatively will do nothing but make the situation worse. I was working
    on a project with three coworkers. We each had specific tasks that all tied into
    each other''s tasks. If one of us fell behind, we all fell behind. One co-worker
    was consistently behind the rest of us and the entire project was falling behind.
    I pulled the coworker aside and asked them if they needed assistance and explained
    to them that their lack of promptness was making the rest of us fall behind. I
    had the conversation in a very non-accusatory manner and kept things light. I
    offered helpful suggestions on ways they can improve their timeliness and then
    suggested we have daily meetings as a team to see where each of us was at. This
    allowed for more transparency amongst the team and opened a door for conversations
    on ways for that coworker to improve, which ended up helping us complete the project
    on time.


    ## 327. How do you outwardly respond to stress in the workplace? How do you calm
    yourself down when you are feeling stressed?


    Answer:


    This is a trick question - your interviewer wants to hear that you don''t look
    any different when you''re stressed, and that you don''t allow negative emotions
    to interfere with your productivity. As how you solve your stress, it''s best
    if you have a simple solution mastered, such as simply taking deep breaths and
    counting to 10 to bring yourself back to the task at hand.


    As an example:


    When I begin to feel stressed about a situation at work, I sometimes tend to get
    very quiet and take too long to think of the right response I want to give message
    I want to relay to the team. In these instances, I know that it is important to
    let the team know that while I am feeling a little stressed at the moment, I will
    be ok and I am just thinking of the proper way to handle the situation. I make
    sure to take a deep breath, maintain composure, smile and say I am going to take
    a quick break. remove myself from the situation and step out, or even sit for
    a moment in the breakroom and read a book. If staff ask me what I am doing just
    tell them lightheartedly I needed a moment to think of how I am going to awesomely
    respond to the situation, or if it is a more serious topic or I may say I just
    needed a moment to recharge. Then regroup and rejoin my team.


    ## 328. Are you good at multi-tasking? Give some examples of how you successfully
    multi-task?


    Answer:


    Some people can, and some people can''t. The most important part of multi-tasking
    is to keep a clear head at all times about what needs to be done, and what priority
    each task falls under. Explain how you evaluate tasks to determine priority, and
    how you manage your time in order to ensure that all are completed efficiently.


    As an example:


    I am a good multi-tasker because I am able to respond to changes quickly. I keep
    running lists of what I am working on so if I have interruptions or urgent projects
    that take me away from my existing tasks, I am able to quickly go back to what
    I was working on.


    ## 329. How many hours per week do you work?


    Answer:


    Many people get tricked by this question, thinking that answering more hours is
    better - however, this may cause an employer to wonder why you have to work so
    many hours in order to get the work done that other people can do in a shorter
    amount of time. Give a fair estimate of hours that it should take you to complete
    a job and explain that you are also willing to work extra whenever needed.


    As an example:


    If I am working a full time forty-hour work week job, then that is what I work.
    Let''s honest we are human... so there have been times when I was not feeling
    well so I was slow, or having some weeks where I may have only worked thirty hours
    or so, however, I did not miss any deadlines and as soon as I was feeling better
    I was back at my usual work speed and productivity hours. On the other hand, if
    I feel need to work any overtime I will only do so if I have permission from the
    supervisor first. There was one instance when I had an emergency arise and it
    was time for me to leave, however if I left, then it would have made worse for
    the company and the client, so I did stay extra thirty minutes to complete the
    task, however I immediately called my supervisor of the issue and when I stayed,
    so they were aware.


    ## 330. How many times per day do you check your email?


    Answer:


    While an employer wants to see that you are plugged into modern technology, it
    is also important that the number of times you check your email per day is relatively
    low - perhaps two to three times per day (dependent on the specific field you''re
    in). Checking email is often a great distraction in the workplace, and while it
    is important to remain connected, much correspondence can simply be handled together
    in the morning and afternoon.


    As an example:


    I check my e-mail about three or four times a day. Typically, when I arrive to
    the office, before and after lunch, and before I leave for the day. There may
    be instances when things are slow in the office and I check less, or there may
    be times when I am waiting on an e-mail containing information I need to start
    a task, or I am in communication with a customer back and forth about an important
    topic, so I may check or respond more frequently. On an average day though, no
    more than about four times per day.


    # CHAPTER 04


    # Customer Service


    ##331. What is customer service?


    Answer:


    Customer service can be many things - and the most important consideration in
    this question is that you have a creative answer. Demonstrate your ability to
    think outside the box by offering a confident answer that goes past a basic definition,
    and that shows you have truly considered your individual view of what it means
    to take care of your customers. The thoughtful consideration you hold for customers
    will speak for itself.


    As an example:


    Customer Service is basically any interaction you have with other people during
    the course of a work day. If you are working in customer service it''s simple—
    you answer the phone, take payments, solve problems. If you work in HR, your customers
    may be the employees you serve. If you work in sales, your customers may be the
    people you sell to. Customer Service is show you work with others, your attitude,
    and your problem-solving abilities. It is wanting to always provide the best service
    possible, in any capacity you can, to whoever you encounter while work.


