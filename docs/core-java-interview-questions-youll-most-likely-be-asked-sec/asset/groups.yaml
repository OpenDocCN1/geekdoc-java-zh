    的新方法，将传入的内容写入 excel 文件中。你如何在对 API 用户影响最小的情况下进行这一更改？


    **答案：**


    在上述描述的场景中，需要在 `FileWriter` 接口中添加一个新方法。简单地向接口中添加该方法会导致实现该接口的所有现有类出现编译错误，并要求所有类为
    `writeToExcel()` 方法提供实现。最好的办法是将 `writeToExcel()` 方法作为默认方法（default method）添加到 `FileWriter`
    接口中。默认方法是 Java 8 引入的新功能。它们允许你在接口中创建带有方法体的方法。实现接口的类不需要为默认方法提供实现。因此，将 `writeToExcel()`
    方法作为默认方法添加到 `FileWriter` 接口中不会影响实现 `FileWriter` 的类。默认方法是由 Java 8 添加的，所以如果你使用的是早期
    Java 版本，此解决方案将无效。在这种情况下，你可以创建一个 `FileWriter` 接口的新版本（例如 `FileWriterEnhanced`），它扩展当前的
    `FileWriter` 并在 `FileWriterEnhanced` 接口中添加 `writeToExcel()` 方法。在这种情况下，实现 `FileWriter`
    接口的现有代码将正常运行。任何需要 `writeToExcel()` 方法的代码都需要实现 `FileWriterEnhanced` 接口。


