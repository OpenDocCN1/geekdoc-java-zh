    \ 是默认方法，而 `reverseOrder` 是静态方法。\n\n- `reversed` 需要一个比较器存在。`reverseOrder` 不需要比较器存在，它直接返回一个按反序排序的比较器。\n\
    \n- `reversed` 返回一个施加于被调用的比较器的反序排序的比较器。`reverseOrder` 返回一个施加集合中元素自然排序反序的比较器。\n\
