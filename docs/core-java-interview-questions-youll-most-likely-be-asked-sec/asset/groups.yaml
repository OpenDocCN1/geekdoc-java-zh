- md: "\nexample of encapsulation. The following code snippet demonstrates this:\n\
    \n```java\npublic class Laptop {\n    private String memory;\n    public String\
    \ getMemory() {\n        return memory;\n    }\n    public String setMemory (String\
    \ newMemory){\n        memory = newMemory;\n    }\n}\n```\n\nHere, there is a\
    \ class called Laptop. It has a private field called memory and public getter\
    \ and setter methods to access/modify the memory field. So, the memory field cannot\
    \ be accessed directly outside the class, it can only be accessed via its getter/setter\
    \ methods.\n\n## 004. What are the types of inheritance relationships?\n\nAnswer:\n\
    \nInheritance relationships specify how code can be reused. There are two types\
    \ of inheritance relationships.\n\nThey are as follows:\n\n- a. IS-A\n\nAn IS-A\
    \ relationship is implemented via inheritance, that is by creating a sub-class.\
    \ Assume that, Camera is a subclass of Electronics is a super class. In that case,\
    \ we can say that, Camera IS-A Electronic product\n\n- b. HAS-A\n\nA HAS–A relation\
    \ can be created via composition, that is by creating a field corresponding to\
    \ another class. Assume that, inside the Camera class, there is an object called\
    \ Battery. In that case, we can say that Camera HAS–A object called Battery\n\n\
    ## 005. What is the best practice in declaring instance variables?\n\nAnswer:\n\
    \nInstance variable should always be declared as private. They should have public\
    \ getter/setter methods. This helps to protect the instance variable as they can\
    \ only be modified under the programmer's control. This is as per the Encapsulation\
    \ principle.\n\nDeclaring instance variables as public violates the encapsulation\
    \ principle and poses a security issue. Public instance variables can be maliciously\
    \ modified outside your class. If at all an instance variable needs to be accessed\
    \ from a sub–class, it can be made protected.\n\n## 006. What is a singleton class?\n\
    \nAnswer:\n\nA class which lets you create only one instance at any given time\
    \ is termed a Singleton class. A Singleton class can be implemented via a private\
    \ constructor and a public getter method. The following code demonstrates this.\n\
    \n```java\npublic class MySingleton {\n    private static MySingleton mySingletonInstance;\n\
    \    private MySingleton () {\n    }\n    public static MySingleton getInstance()\
    \ {\n        if (mySingletonInstance == null) {\n            mySingletonInstance\
    \ = new MySingleton(); // create the object only if it is null\n        }\n  \
    \      return mySingletonInstance;\n    }\n    public void doSomething() {\n \
    \       System.out.println(\"I am here...\");\n    }\n    public static void main(String\
    \ a[]) {\n        MySingleton mySingleton = MySingleton.getInstance();\n     \
    \   mySingleton.doSomething();\n    }\n}\n```\n\nHere, a private getInstance defined.\
    \ checks if an instance exists. If an instance does not exist, it creates one\
    \ using the private constructor. If an instance exists, it just returns it. Any\
    \ external class that needs an instance of the Singleton class, needs to obtain\
    \ it via the getInstance method. The getInstance method ensures that there is\
    \ only one instance of the Singleton class.\n\n## 007. Explain what happens when\
    \ the following code is compiled and state whether it uses method overloading\
    \ or overriding.\n\n```java\nclass Electronics {\n    public void displayPrice\
    \ (Float price) {} // Line 1\n}\nclass Camera extends Electronics {\n    public\
    \ void displayPrice (String price) {} // Line 2\n}\n```\n\nAnswer:\n\nThe above\
    \ compiles fine. It uses method overloading. Camera is a sub-class of Electronics\
    \ and both classes have a method displayPrice. However, the displayPrice method\
    \ in both classes differ in the type of argument.\n\n## 008. Write a Java code\
    \ sample that demonstrates method overloading.\n\nAnswer:\n\nMethod overloading\
    \ occurs when there are two or more methods in a class with the same name but\
    \ with a different number/type of arguments. The following code demonstrates this:\n\
    \n```java\nclass Laptop {\n    public void displayPixel (int width, int height)\
    \ { } // Line 1\n    public void displayPixel (float width, float height) { };\
    \ // Line 2\n}\n```\n\nThe class Laptop has two method with the name as displayPixel.\
    \ The displayPixel method at Line 1 has two arguments, both of type int. The displayPixel\
    \ method at Line 2, displayPixel method has two arguments of type float. So here,\
    \ the displayPixel method is said to be overloaded.\n\n## 009. What is polymorphism?\
    \ How does Java support Polymorphism?\n\nAnswer:\n\nPolymorphism literally means\
    \ \"many forms\". It is the ability to use the same interface to execute different\
    \ code. Java achieves polymorphism via method overloading and method overriding.\
    \ Method overloading occurs when there are many methods in a class with the same\
    \ name but different number/type of arguments. The version of an overloaded method\
    \ that will be invoked is determined at compile time based on the number/type\
    \ of arguments passed in. Method overriding occurs when a sub-class has a method\
    \ with the same name and type signature as a method in the super class. The version\
    \ of an overridden method that will be invoked is determined at run time on the\
    \ type of object that invokes the method.\n\n## 010. Explain how Java achieves\
    \ abstraction.\n\nAnswer:\n\nAbstraction is an OOPs concept whereby only the necessary\
    \ information is exposed to the end user and the internal implementation details\
    \ are hidden. Java achieves abstraction via abstract classes and interfaces. So,\
    \ you can declare the methods that you want to be exposed to the outside world\
    \ in an abstract class or interface. The actual implementation will be within\
    \ concrete classes that extend the abstract classes or implement the interfaces.\
    \ The outside code is not aware of the implementing classes, they interact with\
    \ the abstract classes.\n\n## 011. What are the possible ways of declaring the\
    \ main method?\n\nAnswer:\n\nFollowing are the possible ways of declaring the\
    \ main method:\n\n- a. public void main (String argument[])\n- b. static void\
    \ main (String argument[])\n\n## 012. What are the possible ways of declaring\
    \ a class?\n\nAnswer:\n\nFollowing are the possible ways of declaring a class:\n\
    \n- a. public Class1 {}\n- b. Class2 {}\n- c. private Class3 {}\n- d. protected\
    \ Class4 {}\n- e. static Class5 {}\n\n## 013. How will you define an Identifier?\n\
    \nAnswer:\n\nIdentifier is the name given to a class, method, variable or interface.\
    \ There are several rules for Java identifiers. These are as follows:\n\n- Identifiers\
    \ must start with an alphabet, the dollar sign ($), or an underscore character\
    \ (_)\n- Identifiers can contain alphabets, digits, $, and _\n- Identifiers cannot\
    \ contain special characters\n- Identifiers are case sensitive\n\nSome of the\
    \ examples of legal identifiers are below:\n\n- b\n- $a\n- book\n- author1\n-\
    \ myName\n- __1_c\n\n## 014. What are the modifiers that cannot be specified with\
    \ an instance variable?\n\nAnswer:\n\nThe following modifiers cannot be specified\
    \ with an instance variable:\n\n- abstract: is valid only for classes, interfaces\
    \ and methods, it cannot be specified with an instance variable\n- synchronized\n\
    - native\n- void: can only be specified as a return type, when a method does not\
    \ return any value\n\n## 015. What are the modifiers that can be specified with\
    \ a method declaration?\n\nAnswer:\n\nThe following keywords can be specified\
    \ with a method declaration:\n\n- public\n- private\n- protected\n\nThe keywords\
    \ public, private and protected are access specifiers. They specify from where\
    \ the method can be accessed.\n\n- static: used to indicate that the method is\
    \ a class level method\n- final: used to indicate that the method cannot be overridden\n\
    - abstract: used to specify that a sub-class should override the method\n- native:\
    \ used to specify that the method is implemented in another language like C++\n\
    - synchronized: used to indicate that the method can be accessed by only one thread\
    \ at time\n\n## 016. What will be the default value of a reference variable when\
    \ it is not explicitly initialized? How will you handle this in\n"
  mdcn: "\n封装的示例。下面的代码段演示了这一点：\n\n```java\npublic class Laptop {\n    private String\
    \ memory;\n    public String getMemory() {\n        return memory;\n    }\n  \
    \  public String setMemory (String newMemory){\n        memory = newMemory;\n\
    \    }\n}\n```\n\n在这里有一个名为 `Laptop` 的类。它有一个名为 `memory` 的私有字段，以及用于访问/修改 `memory`\
    \ 字段的公共 getter 和 setter 方法。因此，类外部无法访问 `memory` 字段，只能通过它的 getter/setter 方法访问。\n\
    \n## 004. 继承关系有哪些类型？\n\n回答：\n\n继承关系规定了代码如何被重用。继承关系有两种类型。\n\n它们如下：\n\n- a. IS-A（包含关系）\n\
    \nIS-A 关系通过继承实现，即通过创建子类。假设 `Camera` 是 `Electronics` 类的子类。在这种情况下，我们可以说 `Camera`\
    \ 是一个电子产品（Electronic product）。\n\n- b. HAS-A（组合关系）\n\nHAS–A 关系可以通过组合创建，即通过创建一个对应另一个类的字段。假设在\
    \ `Camera` 类内部，有一个名为 `Battery` 的对象。在这种情况下，我们可以说 `Camera` 拥有一个名为 `Battery` 的对象。\n\
    \n## 005. 声明实例变量的最佳实践是什么？\n\n回答：\n\n实例变量应该始终声明为 `private`。它们应该具有公共的 getter/setter\
    \ 方法。这有助于保护实例变量，因为它们只能在程序员的控制下被修改。这符合封装原则。\n\n将实例变量声明为 `public` 违反了封装原则并会带来安全问题。公共实例变量可以在类外部被恶意修改。如果确实需要从子类访问实例变量，可以将其设为\
    \ `protected`。\n\n## 006. 什么是单例类？\n\n回答：\n\n在任何给定时间内允许创建一个实例的类被称为单例类（Singleton\
    \ class）。单例类可以通过私有构造函数和公共 getter 方法来实现。下面的代码演示了这一点。\n\n```java\npublic class MySingleton\
    \ {\n    private static MySingleton mySingletonInstance;\n    private MySingleton\
    \ () {\n    }\n    public static MySingleton getInstance() {\n        if (mySingletonInstance\
    \ == null) {\n            mySingletonInstance = new MySingleton(); // 仅在为空时创建对象\n\
    \        }\n        return mySingletonInstance;\n    }\n    public void doSomething()\
    \ {\n        System.out.println(\"I am here...\");\n    }\n    public static void\
    \ main(String a[]) {\n        MySingleton mySingleton = MySingleton.getInstance();\n\
    \        mySingleton.doSomething();\n    }\n}\n```\n\n在这里，定义了一个私有的 `getInstance`\
    \ 方法。它检查实例是否存在。如果实例不存在，则使用私有构造函数创建一个实例。如果实例存在，则直接返回它。任何需要单例类实例的外部类，都需要通过 `getInstance`\
    \ 方法来获取它。`getInstance` 方法确保了单例类只有一个实例。\n\n## 007. 解释当编译以下代码时发生了什么，并说明它使用的是方法重载还是方法重写。\n\
    \n```java\nclass Electronics {\n    public void displayPrice (Float price) {}\
    \ // 第 1 行\n}\nclass Camera extends Electronics {\n    public void displayPrice\
    \ (String price) {} // 第 2 行\n}\n```\n\n回答：\n\n上述代码可以正常编译。它使用了**方法重载**。`Camera`\
    \ 是 `Electronics` 的子类，且两个类都有名为 `displayPrice` 的方法。然而，这两个类中的 `displayPrice` 方法在参数类型上不同。\n\
    \n## 008. 编写一个演示方法重载的 Java 代码示例。\n\n回答：\n\n当类中存在两个或多个同名但参数数量/类型不同的方法时，发生了方法重载。下面的代码演示了这一点：\n\
    \n```java\nclass Laptop {\n    public void displayPixel (int width, int height)\
    \ { } // 第 1 行\n    public void displayPixel (float width, float height) { };\
    \ // 第 2 行\n}\n```\n\n`Laptop` 类有两个同名为 `displayPixel` 的方法。第 1 行的 `displayPixel`\
    \ 方法有两个参数，类型均为 `int`。第 2 行的 `displayPixel` 方法有两个 `float` 类型的参数。因此，这里说 `displayPixel`\
    \ 方法被**重载**了。\n\n## 009. 什么是多态？Java 如何支持多态？\n\n回答：\n\n多态的字面意思是“许多种形式”。它是使用相同接口执行不同代码的能力。Java\
    \ 通过方法重载和方法重写来实现多态。方法重载发生在类中存在多个同名但参数数量/类型不同的方法时。被调用的重载方法版本在编译时根据传入参数的数量/类型确定。方法重写发生在子类拥有与父类方法相同名称和类型签名的方法时。被调用的重写方法版本在运行时根据调用方法的类型确定。\n\
    \n## 010. 解释 Java 如何实现抽象。\n\n回答：\n\n抽象是一个面向对象编程（OOPs）概念，它只向最终用户暴露必要的信息，并隐藏内部的实现细节。Java\
    \ 通过抽象类和接口来实现抽象。因此，你可以在抽象类或接口中声明你想要向外部公开的方法。实际实现将位于扩展抽象类或实现接口的具体类中。外部代码感知不到实现类，它们只与抽象类进行交互。\n\
    \n## 011. 声明 main 方法可能方式有哪些？\n\n回答：\n\n以下是声明 `main` 方法的可能方式：\n\n- a. `public void\
    \ main (String[])`\n- b. `static void main (String[])`\n\n## 012. 声明类的可能方式有哪些？\n\
    \n回答：\n\n以下是声明类的可能方式：\n\n- a. `public Class1 {}`\n- b. `Class2 {}`\n- c. `private\
    \ Class3 {}`\n- d. `protected Class4 {}`\n- e. `static Class5 {}`\n\n## 013. 如何定义标识符（Identifier）？\n\
    \n回答：\n\n标识符是赋予类、方法、变量或接口的名称。Java 标识符有很多规则，如下：\n\n- 标识符必须以字母、美元符号（$）或下划线（_）开头\n\
    - 标识符可以包含字母、数字、$ 和 `_`\n- 标识符不能包含特殊字符\n- 标识符区分大小写\n\n合法标识符的一些示例：\n\n- b\n- `$a`\n\
    - book\n- author1\n- myName\n- `__1_c`\n\n## 014. 实例变量不能指定哪些修饰符？\n\n回答：\n\n以下修饰符不能指定在实例变量上：\n\
    \n- `abstract`：仅对类、接口和方法有效，不能指定在实例变量上。\n- `synchronized`\n- `native`\n- `void`：只能作为返回类型指定，当方法不返回任何值时使用。\n\
    \n## 015. 方法声明中可以指定哪些修饰符？\n\n回答：\n\n方法声明中可以指定以下关键字：\n\n- `public`\n- `private`\n\
    - `protected`\n\n`public`、`private` 和 `protected` 是访问修饰符。它们规定了从哪里可以访问方法。\n\n-\
    \ `static`：表示该方法是类级方法。\n- `final`：表示该方法不能被重写。\n- `abstract`：指定子类应该重写该方法。\n- `native`：指定该方法是在另一种语言（如\
    \ C++）中实现的。\n- `synchronized`：表示该方法一次允许一个线程访问。\n\n## 016. 如果引用变量没有显式初始化，其默认值是什么？你如何在...中处理这种情况\n\
    \n"
