    interface. Simply adding the method to the interface will cause compilation errors
    in all the existing classes that implement the interface and will require all
    the classes to provide an implementation for the writeToExcel() method. The best
    way to go about this is to add the writeToExcel() method as a default method in
    the FileWriter interface. Default methods are a new feature added by Java 8. They
    allow you to create methods with bodies in an interface. Classes that implement
    the interface, do not need to provide an implementation for default methods. So,
    adding the writeToExcel() method as a default method in the FileWriter interface
    will not impact the classes that implement FileWriter. Default methods are added
    by Java 8. So, if you are using an earlier Java version, then this solution would
    not work. In that case, you can create a new version of the FileWriter interface
    (say FileWriterEnhanced) that extends the current FileWriter and add the writeToExcel()
    method in the FileWriterEnhanced interface. In this case, the existing code that
    implements the FileWriter interface will work as it is. Any code that needs the
    writeToExcel() method will need to implement the FileWriterEnhanced interface.


