    # 263. What is the module descriptor?


    Answer:


    A module descriptor is a Java file named module-info.java. It contains information
    about the module. It needs to be present at the root of the module. The following
    lines demonstrate the structure of the module descriptor:


    ```

    module demomodule {

    //optional directives

    }

    ```


    The module descriptor can contain some optional directives. Some of the directives
    that can be specified within the module descriptor are as follows:


    +   a. **Name:** This specifies the name of the module.


    +   b. **exports:** This specifies the names of the packages within the module
    that will be available to other modules.


    +   c. **requires:** This specifies the names of the modules that the current
    module depends on. So if these modules are not specified, the current module may
    not work.


    +   d. **provides:** This specifies the services that the current module provides.
    This directive should be used when a module acts as a service provider.


    +   e. **uses:** This specifies the services that the current module consumes.
    This directive should be used when the module is a service consumer.


    +   f. **open:** This specifies that the classes in the currently module can be
    accessed via Java reflection.'
  - '[PAGE 234]


    # 264. What is the difference between a package and a module?


    Answer:


    Both packages and modules are a logical unit and encapsulate some Java files.
    However, there are several differences between the two as follows:


    +   - Packages are present right from the early versions of Java. Modules on the
    other had were added by Java 9.

    - Packages were added by Java to avoid name clashes that they allow having a class
    with the same name in different packages. Modules were added by Java to modularize
    the JDK and improve security.

    - A package contains a group of related files. A module on the other hand contains
    a group of related packages.

    - A package does not require a package descriptor, a module requires a module
    descriptor called module-info.java.

    - Packages cannot be deployed by themselves; modules can be deployed by themselves.

    - The classes within a package are visible by reflection. The classes within a
    module are not visible by reflection unless the open directive is specified in
    the module descriptor.


    # 265. Explain the changes made to JDK for Java 9.


    Answer:


    Java 9 has made some fundamental changes which takes advantage of modules. Prior
    to Java 9, after installing the JDK a folder called **jrelib** was created. When
    you install Java 9, the jrelib folder is no longer created. Instead a folder called
    **jmods** is created in the root of the JDK installation. The **jmods** folder
    has modules corresponding to all the core Java files. So instead of having a big
    rt.jar, JDK 9 has separate modules.'
