    \ 方法，可以根据某些条件过滤集合。该条件是通过 `Predicate` 接口（一种内置函数式接口）指定的。它检查输入 Stream 中的每个值是否匹配条件；而\
    \ `map` 方法则对 Stream 中的元素进行转换。\n\n# 第 02 章\n\n# Lambda 表达式\n\n207. 什么是 lambda 表达式？使用\
    \ lambda 表达式有什么好处？\n\n答案：\n\nLambda 表达式用于指定一个没有名字的函数。它用于实现函数式接口。Lambda 表达式有以下优点：\n\
    \n- 它们使代码更简洁。在 Java 8 之前，开发者需要编写大量代码来实现接口。Lambda 表达式消除了与实现接口相关的模板代码。\n- 它们允许将代码作为方法参数传递。\n\
    - 它们允许为同一个方法提供不同的实现。\n- Java 8 添加的其他新特性（如 Streams）也使用了 lambda 表达式。\n\n208. Lambda\
    \ 表达式和函数式接口之间是什么关系？\n\n答案：\n\n函数式接口是一个只有一个抽象方法的接口。Lambda 表达式用于实现函数式接口中的抽象方法。\n\
    \nJava 8 添加函数式接口是为了支持 lambda 表达式并为 Java 提供函数式编程支持。由于 Java 是一种面向对象的语言，lambda 表达式无法独立存在。它们需要与对象关联。因此，Java\
    \ 8 引入了函数式接口，并强制 lambda 表达式只能与函数式接口配合。通过让 lambda 表达式实现函数式接口，lambda 表达式就成了函数式接口的实现。函数式接口和\
    \ lambda 表达式有助于编写清晰简洁的代码。\n\n209. 请解释 lambda 表达式的语法。\n\n答案：\n\n以下是 lambda 表达式的语法：\n\
    \n```\n(parameters) -> {lambda body}\n```\n\n因此，lambda 表达式由参数、lambda 运算符 (->)\
    \ 和表达式体组成。lambda 表达式可以接收零或多个参数。如果不接受任何参数，则需要使用空括号。如果接受单个参数，参数不需要放在括号。如果接受多个参数，它们需要放在括号内并用逗号隔开。lambda\
    \ 体是普通的 Java 代码，可以包含任意数量的语句。如果 lambda 体中只有一个语句，可以跳过主体的大括号，否则必须指定大括号。\n\n210. 请给出一些\
    \ lambda 表达式的示例。\n\n答案：\n\n"
