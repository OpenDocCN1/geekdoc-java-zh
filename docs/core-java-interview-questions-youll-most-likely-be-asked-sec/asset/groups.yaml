    \  System.out.println(\"This is finally block\");\n}\n```\n\n所有需要监控异常的代码都应该放在\
    \ `try` 块中。在紧随 `try` 块之后，你需要指定一个 `catch` 子句。在 `catch` 块中，你需要指定你想要捕获的异常类型以及当异常发生时你想要执行的代码。`finally`\
    \ 子句是可选的，它需要放在 `try` 块或 `catch` 块之后。无论是否发生异常，任何需要执行的代码都应该放在 `finally` 子句中。\n\n\
    # 124. 执行以下代码时，输出是什么？\n\n```java\nclass ExceptionTest {\n    public static void\
