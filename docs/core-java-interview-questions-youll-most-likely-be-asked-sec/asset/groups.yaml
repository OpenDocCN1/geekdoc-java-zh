    \ is not accessible in the sub-class. An abstract method needs to be accessible\
    \ in the sub-class in order for the sub-class to provide an implementation for\
    \ the method. A sub-class will not be able to provide an implementation for an\
    \ abstract private method.\n\n# CHAPTER 10\n\n# Packages and Access Control\n\n\
    ## 111. What is a package? What are the advantages of packages?\n\nAnswer:\n\n\
    A package is a collection of related Java types. So, a package can include related\
    \ classes, interfaces and enumerations. Having a package has several advantages\
    \ as follows:\n\n- Packages help to keep related code together.\n- A package helps\
    \ avoiding naming collisions. So, you can have a class or some other Java type\
    \ with the same name in different packages.\n- Packages also help to control access.\
    \ Code that is outside the package cannot access code within the package unless\
    \ explicitly allowed via the public keyword.\n\n## 112. Explain the Java access\
    \ spec.\n\nAnswer:\n\nAccess specifiers control where a particular member is accessible.\
    \ They are just some keywords that are specified with class members. They can\
    \ be specified with an instance field as well as a method. Java has 4 access specifiers\
    \ as follows:\n\n- a. Private: A member having the private access specifier is\
    \ accessible only from within the class in which it is declared.\n- b. Protected:\
    \ A member having the protected access specifier is accessible to all classes\
    \ within the package as well as sub-classes that are outside the package.\n- c.\
    \ Public: A member having the public access specifier is accessible to all classes.\n\
    - d. Default: Default access occurs when no access specifier is specified. It\
    \ is accessible only to classes within the same package.\n\n## 113. Explain the\
    \ default access.\n\nAnswer:\n\nThe default access occurs when no access specifier\
    \ is specified. It is accessible only to classes within the same package. It is\
    \ often referred to as package-private.\n\n## 114. Name some default packages.\n\
    \nAnswer:\n\nThe following are some default packages:\n\n- java.util: includes\
