    dancing bodies next to, rather than in opposition to each other, by showing us


    their delight in each other’s performance, and by sharing performance space


    and time equally between the heroine, vamp, and hero, “*Muqabla humse na*


    *karo*” moves away from tired clichés, presenting instead a radical celebration'
