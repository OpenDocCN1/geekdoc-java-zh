    dance reform.


    During this period, the association of public, professional dancing with


    traditional dancing women such as *tawaif*s and *devadasi*s had not been


    completely severed, which evinced in many melodramas of dance reform


    enfoldments between the categories of professional dancer, courtesan, and


    prostitute, all figured as women of the *bazaar* rather than women of the


    home. Various historians and film scholars have related the discourse on


    Indian modernity in the nineteenth and twentieth centuries to the construc-


    tion of a model of ideal womanhood. Most famously, Partha Chatterjee in


    the essay, “The Nationalist Resolution of the Women’s Question,” argues that


    the discourse of Indian nationalism was driven by the need to protect the


    spiritual essence of the nation, enshrined in the figure of the woman and the


    home. “The home was the principal site for expressing the spiritual quality


    of the national culture, and women must take the main responsibility of


    protecting and nurturing this quality.”^(109) A system of gendered dichotomies


    structured around inner/ outer, *ghar*/ *bahir* (home/ world), woman/ man, and


    spiritual/ material thus shaped the nationalist project. To become the ideal-


    ized repository of national values, the woman had to be recast and constantly


    reinvented through a pedagogical regime that combined tutelage in tradi-


    tional (Hindu) customs as well as a modern education. The anxiety around


    the definition of Indian womanhood was fundamentally predicated on the


    private/ public divide, separating the ideal Hindu woman not only from the


    English *memsahib*, but also from lower- class “public” women, chief among


    them the prostitute, the dancing girl, the courtesan.^(110) Ranjani Mazumdar


    describes how the double location of this construction of the woman in both


    colonial ideology and middle- class nationalism’s engagement with coloni-


    alism reproduces the Western metaphor of the streetwalker as the only pos-


    sible public woman.^(111)


