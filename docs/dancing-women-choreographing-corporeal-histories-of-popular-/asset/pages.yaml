    wrists, etc., in classical dance forms produces particular relationships to


    space and time, with the sculptural attitude of the classical dance body emer-


    ging from the dancer’s effort to achieve the perfect pose that will convey a


    sense of timelessness. Vatsyayan observes that in Indian classical dance, “the


    human body has been conceived of as a mass which can be equally divided


    along a central median. Further movement is determined by the nature of


    deflections from this median.”^(56) In *Kathak*, for instance, torso movements


