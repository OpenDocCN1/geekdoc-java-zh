    folk dance conventions. The individual and collective figuration of the cen-


    tral performer(s) and the background dancers respectively is similar to that


    of the individuated classical dancer who occupies center stage to display vir-


    tuosic moves and that of folk dancers who typically perform identical moves


    in matching costumes. “In contrast to classical dancing,” Vatsyayan notes that


    in folk dance, “the vocabulary of movements is restricted to a few mannered


    motor movements and does not allow for individual variations or improvisa-


    tion. Improvisation may occur in the whole group in some rhythmic patterns


    but not through the evolution of new movements by a single dancer.”^(71)


    Similarly, in Hindi film dance configurations, the central performer(s)


    perform the most spectacular moves and often seem to improvise, while


    for the background dancers, the emphasis is on sameness and repetition.


    Additionally, just as “the whole system of *mukhaj abhinaya* (facial mime), so


    distinctive of classical forms, is minimum in the folk forms”^(72) so too in film


    dance, the central dancer may display a range of facial expressions, but the


    background dancers predominantly perform only physical moves involving


    the torso and the limbs in order to construct a space out of their rhythmically


    synchronized movements. Accordingly, background dancers are mainly fea-


    tured in the instrumental interludes of song- and- dance sequences while the


    focus is on the stars in the lyrical, sung sections, where the voice and body,


    song and dance are combined. Similar to the instrumental interlude’s func-


    tion of “filling out” a song, background dancers are employed to fill out the


    space of the dance number.'
