    Acknowledgments


    Hindi film music has bestowed upon my memories of childhood and home


    a pervading soundtrack of songs by Saigal, Talat Mahmood, Geeta Dutt, and


    Lata Mangeshkar. His cinephilic presence suffuses many parts of this book.


    Cyril, my untiring companion through the many adventures of the past fif-


    teen years, encyclopedia of Hindi cinema and popular culture, indefatigable


    motivator and detractor, has assiduously kept things real— “bhot hard”— for


    both of us. Thank you for the hours upon hours of belly- shaking laughter,


    passionate arguments, and that unique combination of sarcasm and senti-


    mentality. And now, brace yourself for the travails of the next project!


    I dedicate this book to my first mother, Kamala. In the three decades that


    she has been gone, I have constantly felt her fearless and formidable pres-


    ence, her Carnatic and Hindustani singing booming through the air, her


    restless intelligence captured in urgent writing in numerous notebooks. This


    is for her and for her mother, my *paati*, Lakshmi— a lineage of remarkable,


    unconventional women who never quite fit in and taught us not to as well.'
