    Introduction


    the dance appeared effortless on screen. Shifting attention from the ideolog-


    ical work performed by the song- and- dance sequence, which has dominated


    the study of Hollywood musicals and popular Indian cinema, to studying


    the industrial practices, training, rehearsal, and personnel required for these


    attractions produces a different history and theorization of labor, materiality,


    and economies of production. In the on- screen dance number, we do not see


    the markings on the floor for camera and dancer placement, the sweating


    under the studio lights, the time taken for costume changes. However, close


    attention to the production of film dance spectacle prompts an exploration


    of the interfaces of bodies, surfaces, spaces, and temporalities, which in


    turn drives an examination of popular Hindi cinema’s figurations through


    its affects, materialities, and strategies for evoking spectatorial desire and


    pleasure. Vyjayanthimala notes of “*Muqabla humse na karo*”: “It clicked so


    well that it made your toes curl,”^(14) highlighting our intense somatic engage-


    ment with Hindi cinema’s song- and- dance sequences, which produce an


    embodied and kinesthetic spectatorship. The dance number’s aesthetic of ex-


    cess accords with the promise of popular cinema to exceed the limitations of


    the mundane and quotidian, enacting, as Erin Brannigan notes, “the human


    potential for physical virtuosity and play,”^(15) its excess somatic energy pro-


    ducing spectatorial responses (goosebumps, tapping feet, snapping fingers,


    etc.) that are located centrally in the body.


    **Dancing Women as Co- Choreographers**


    **of Female Mobility**


    This extended engagement with “*Muqabla humse na karo*” gestures toward


    the aims and approaches of *Dancing Women*, which historicizes and theorizes


    the material and cultural production of film dance, a staple “attraction” of


    popular Hindi film, in relation to the construction of cinematic narratives,


    performing bodies, and spectator- citizens.^(16)  *Dancing Women* specifically


    undertakes an examination of film dance and female performance in pop-


    ular Hindi cinema from the 1930s to the 1990s to explore how the dynamic


    figurations of the body, wrought by cinematic dance forms, produce unique


    constructions of gender, stardom, and spectacle. The dancer- actress is em-


    ployed here as an analytical category, acting as a nexus for relations between


    industry, narrative, and spectatorship, but also as a material artifact com-


    posed of limbs, flesh, bone, and skin, the neuromusclature of the dancing'
