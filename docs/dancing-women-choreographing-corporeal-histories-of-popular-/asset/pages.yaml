    us to consider the visceral cosmopolitanism of Azurie’s multi- hyphenated


    body that dances across and between borders, a corporeal repository of


    cultural practices that cannot be partitioned into neat national legacies.


    Through the mobility of dance forms in her repertoire as well as her physical


    mobility across borders, Azurie nimbly navigates questions of religious and


    national identity.


    After General Zia- ul- Haq imposed martial law in 1977, disbanding the


    Arts Councils, banning dancing by women on stage as “un- Islamic,” Azurie


    spent the last two decades of her life teaching dance at home and at the


    Station School in Rawalpindi. Across the border, in Calcutta, through the


    1960s and early 1970s, Sadhona Bose held dance classes in her home as well,


    and just before her death in 1973, was appointed as dance trainer at Calcutta’s


    Star Theatre. Students of both dancers report to have not known that their


    teachers were famous dancing stars. Like so many female pioneers in dance,


    music, and film, including Gauhar Jaan, Sulochana, Meena Shorey, and


    others, both women are reported to have lived out their last days in penury.


    However, as others have noted, these narratives of famed female performers


    dying penniless are strategically deployed as cautionary tales of moral in-


    struction and obscure these artists’ creative acts of self- fashioning and ex-


