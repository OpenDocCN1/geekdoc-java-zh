    **Orienting Dance to a New Class of Female Performers**


    Sadhona Bose (1914– 1973) was born into a prosperous Bengali family in


    Calcutta. Her father, Saral Chandra Sen, a barrister, was the fourth son of the


    social reformer Keshab Chandra Sen, a member of the Brahmo Samaj, and


    later, the founder of the breakaway “Brahmo Samaj of India.”^(19) Her mother,


    Nirmala Sen, was the daughter of Burma’s (now Myanmar) first Indian


    Administrator, General P. C. Sen. Two of her aunts were members of the


    royalty, queens of the princely states of Cooch Behar and Mayurbhanj, and


    her older and younger sisters married into the royal families of Chittagong


    and Kapurthala, respectively. In keeping with her Brahmo Samaj back-


    ground, Bose was given a diverse education, attending the Loreto Convent


    school, and also learning music and dance at prestigious institutions such


    as the Sangeet Sangha and the Sangeet Sammilani. She took *Kathak* lessons


    from Tarakanath Bagchi, and learned *Manipuri* dance from Guru Senarik


    Rajkumar. She was a pupil of the famous *Thumri* exponent, Girijasankar


    Chakrabarti, and took piano lessons from T. Francopolo. Later, in the 1930s,


    she also learned music from the film music composer Sachin Dev Burman.^(20)


    However, while Bose and her sister Nilina (who later became a renowned


    Thumri exponent by the name of Naina Devi) took Thumri lessons and


    learned dance, these were not meant to be professional pursuits. Naina Devi


    recollects, “Taking up dance or music as a profession however was out of


    the question. Even Mejdi (Sadhona), so as not to jeopardize my chances of


    finding a good match, did not become a professional actress until after I was


    married, and even then, my parents disapproved strongly of her decision.”^(21)


    Additionally, while the family generously patronized the arts, care was taken


    not to associate with traditional *female* performers of music and dance,


    the *tawaif*s or courtesans. Naina Devi reports, “The house was always full


    of music. My brothers would organize *mehfil*s of the leading male singers—


    Girija Babu (Girijasankar Chakrabarti), Enayet Khan and others, but none of


    the tawaifs.”^(22)


    The attitude of Bose’s family toward *tawaif*s or to the professional per-


    formance of music and especially dance by women was not uncommon


    at the time, and reflects the status of dance in public discourse in the early


    decades of the twentieth century. By the late nineteenth century, the split


    between body and voice was exacerbated as dance and music increasingly


    diverged. While singing (privately) would become a respectable activity for'
