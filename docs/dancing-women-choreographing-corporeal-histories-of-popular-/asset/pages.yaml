    Dancing Women


    Borrowing from international oriental dance vocabulary, Urdu *qissa-*


    *dastaan* storytelling traditions, Parsi theater, newly emerging “classical”


    Indian dance forms, and Hollywood, the Boses participated in the cosmo-


    politan modernity that marked the orientalist Indian films of the 1920s and


    1930s, but were resolutely highbrow and employed a discourse of classicism


    to signal their difference from the lower- brow oriental fantasy genre. Thomas


    notes, for example, that Modhu Bose’s *Alibaba* “was widely celebrated and


    seen as more ‘respectable’ than the Wadia’s Islamicate films, despite being


    more obviously derivative of Hollywood (and Western theatre) and less di-


    rectly related to indigenous traditions.”^(128) According to a contemporary re-


    view of the film, “The dances that she [Bose] directed and danced had very


    little touches of Indian dance but we loved them.”^(129) Sadhona Bose’s repu-


    tation as a classical dancer from a wealthy Brahmo family, Modhu Bose’s


    standing as the director of C.A.P. with its *bhadralok* performers, and the ge-


    neral address of their plays and films to upper- and middle- class audiences


    established them as more authentically Indian than low- brow oriental dance


    and film practitioners. It was this “respectable orientalism” that prompted


    J. B. H. Wadia to invite the Boses to participate in his international prestige


    project, *Court Dancer*.


