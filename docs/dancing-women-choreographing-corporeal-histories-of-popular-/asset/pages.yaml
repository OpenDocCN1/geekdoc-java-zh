    **Backup Dancers and Spatial Practices**


    **of the “Background”**


    The standard arrangement of dancing bodies in most Hindi film production


    numbers is characterized by one or more centrally- placed dancers (typically


    the heroine/ vamp or the principal romantic couple) and a group of “back-


    ground” or backup dancers. These background dancers usually wear iden-


    tical costumes that are always differentiated, however, from the costume of


    the principal dancer(s). They also perform identical moves, sometimes in


    synchronization with the central performer(s), at other times, differenti-


    ated from the more spectacular moves of the central performer(s). Indeed,


    as the appellation suggests, the principal function of “background” dancers


    is to provide a *ground* against which the *figure* of the central dancer(s) stands


    out. This is similar to the figure- ground relation in music where the chorus


    serves to foreground the individual voice. In the Hindi film song- and- dance


    sequence, this relation is achieved by creating a uniform background of cos-


    tume, gestures, and moves against which the main dancers are foregrounded.


    Since they function as an element of the spatial architecture of the dance


    number, background dancers are not morally coded like the principal


    performers are— as vamp or heroine, for example— but remain anonymous


    stewards of spectacle. Not surprisingly, then, we rarely see them in close- up


    shots; medium and long shots of their dancing bodies produce an abstract,


    dynamic background against which the drama of dancing protagonists is


    staged.


