    Dancing Women


    to theorize film acting, we may similarly proclaim: “When I think of actors,


    I think of their bodies.”


    In *Reframing Screen Performance*, Cynthia Baron and Sharon Marie


    Carnicke note that “performances that lay bare an actor’s physical control


    can illuminate the discipline that is the foundation of acting,”^(86) which I ex-


    trapolate to consider how dancer- actresses who train to produce fully ex-


    pressive bodies reveal the corporeal foundations of film acting. Baron and


    Carnicke also discuss how “characterizations that require actors to play more


    than one role especially highlight the skill behind the selection and combina-


    tion of performance choices within a single production.”^(87) In popular Hindi


    cinema, dancer- actresses routinely play more than one role on account of the


    dual registers of performance that their dancing bodies engender, balancing


    more realist narrative segments that call for “transparent” acting (which


    maintains the illusion of characterization and does not call overt attention to


    the actor’s skill), and dazzling production numbers in which their opacity as


    dancing stars becomes evident because of the extraordinary skill on display,


    produced through rigorous physical training.^(88) The hyphenated identity of


    dancer- actresses bespeaks the dual regimes of performance written upon


    their bodies, which in turn they rewrite. When trained in certain modes of


    dance and theater, where verisimilitude plays a secondary role, screen actors


    bring to the cinema an embodied habitus of non- naturalistic performance.


    On the particular mode of performance in popular Indian cinema, Corey


    Creekmur notes that it is “frequently self- aware and explicitly acknowledged,


    rather than driven by the realist goal of a performer’s full immersion into a


    role and narrative that typically earns the praise of western filmgoers when


    evaluating actors.”^(89) While this has been held as a commonplace, theories of


    dance are centrally important for understanding why these acting traditions


    developed in the popular Hindi film, which, with its exceptionally syncretic


    combination of the narrative and performance codes of melodrama, realism,


    the epic, music, and dance, requires actors to move through a vast range of


    performance modalities: naturalistic and non- naturalistic, transparent and


    opaque, individuated and mythic.


    While the heterogeneous, omnibus form of the popular Indian film has


    been the subject of significant scholarship in the past two decades and has


    been traced to earlier theatrical traditions like *nautanki*, *jatra*, the Parsi


    Theater, etc., to understand the modes of acting required by this variegated


    form, we need to turn as well to theorizations of embodiment, of which


    I will focus on dance- and theater- centered ones here. “Every time an actor'
