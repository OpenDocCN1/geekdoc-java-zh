    the nationalistic zeal for freedom in early 1947.^(51) In Vyjayanthimala’s first


    film, *Vazhkai*, released two years after *Nam Iruvar*, Meiyappan repeats this


    strategy in the dance number “*Bharata samuthayam vaazhgave*,” composed


