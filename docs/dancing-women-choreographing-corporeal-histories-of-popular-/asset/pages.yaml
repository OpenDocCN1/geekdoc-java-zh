    **Musical Numbers and the Cinematic Narrative**


    Studies of the Hollywood musical have categorized the genre into back-


    stage and integrated musicals. The backstage musical is constructed around


    the staging of a musical performance or putting on a show, typically with


    protagonists who are professional entertainers. The musical numbers accu-


    mulate serially and are often standalone spectacles connected only loosely, if


    at all, to the narrative in which they are embedded. In the integrated musical,


    on the other hand, the numbers are woven into the narrative and are moti-


    vated by plot development and character psychology. The performers ex-


    press their emotions to each other or to the audience through song and dance


    without the self- conscious invocation of a performance situation.⁴ Popular


    Hindi cinema is both influenced by the Hollywood musical and markedly


    different from it in terms of generic configurations. Given the develop-


    ment of popular Hindi film as a multi- genre *masala* form, song- and- dance


    sequences feature as one of the many attractions in social melodramas, his-


    torical, horror, war, and gangster films, and in mythological and devotional


    genres specific to the sub- continent. Indeed, the genre of the musical does not


    exist separately in a popular cinema that is saturated with music and dance.


    The grammar of the Hindi film song- and- dance number and its relationship


    to the rest of the narrative is thus not always similar to that of the Hollywood


    musical number. This renders scholarship on the Hollywood musical useful


    but not entirely sufficient to discuss Hindi film music and dance. Unlike


    the Hollywood musical’s adoption of the backstage or integrated form, for


    instance, the Hindi film is simply not as invested in the rationalization of


    the insertion of song- and- dance numbers into the film narrative. Adapting


    the performance modes of backstage and integrated musicals (that is, the


    foregrounding of singing and dancing skills or the expression of inner states


    of mind respectively in this binary formulation) to the expressive modes of


    the Hindi film, I propose a movement- based taxonomy of song- and- dance


    sequences that considers how singing and dancing bodies profoundly deter-


    mine the organization and address of popular Indian cinema.⁵


