    Glossary


    ***Lavani*** A folk dance form from Maharashtra that is characterized by erotic
    themes and


    sensuous dance moves.


    ***Manipuri*** A canonized classical dance form from the North- Eastern state
    of Manipur


    that predominantly depicts religious themes, especially the *Raas Lila* or the
    dance of


    Krishna and Radha.


    ***Mehfil*** A performance of poetry, music, or dance before a small, intimate
    audience.


    ***Mohiniattam*** Literally translated as “the dance of the enchantress,” *Mohiniattam*
    is a


    classical dance form from Kerala, performed mainly by women, and marked by fluid,


    graceful movements.


    ***Mujra*** A *Kathak*- based dance performance by *tawaif*(s) in the space of
    the *kotha*.


    This form was created and popularized in the nineteenth century by *nautch* girls


    (dancing girls) patronized by Mughal and other noblemen and English soldiers,


    among others.


    ***mukhda*** **and** ***antara*** In Hindi film songs, the opening stanza is referred
    to as the


    *mukhda*. It is the introductory and principal phrase of the composition that,
    like


    the chorus in Western music, is repeated after every following stanza. Each of
    these


    stanzas, which form the body of the song, is known as the *antara*. The *mukhda*
    and


    *antara* are sung by one or more characters, and are often interspersed with instru-


    mental sections.


    ***nattuvanar*** The male hereditary dance guru, conductor, and choreographer
    of the


    *Bharatanatyam* dance form.


    ***nautanki*** A North Indian folk dance and theater performance tradition. Often
    in Hindi


    cinema, *nautanki* is reduced to a generic folk dance performance, frequently
    of a


    raunchy nature.


    ***nautch*** An Anglicized pronunciation and transliteration of the Hindustani
    word for


    dance, *naach*. *Nautch* had a pejorative intent and was specially used to designate
    the


    dance of the *tawaif*s and the *devadasi*s.


    ***Odissi*** A canonized classical dance form originating from the state of Odisha
    in


    eastern India.


    ***Tamasha*** A folk theater form from Maharashtra that intersperses dialogue
    with the dance


    form, *Lavani*, which is characterized by erotic themes and sensuous dance moves.


    ***Thumri*** A category of semi- classical music within the North Indian Hindustani
    classical


    music system, in which short romantic or religious compositions are set to music.
    In the


    nineteenth century, Thumris were predominantly sung by courtesans and were often


    accompanied by dance.


    **vamp** From the late 1950s to the 1980s, the female figure of the vamp functioned
    as the ar-


    chetypal performer of the raunchy song- and- dance sequence in Hindi cinema. As
    part


    of a parallel “star system,” one with significantly less financial power and social
    accept-


    ance than that of the heroine, vamps such as Helen, Kalpana Iyer, Bindu, Aruna
    Irani,'
