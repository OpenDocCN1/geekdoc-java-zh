    Folded Corporeal Histories of the Dancer- Actress


    in the 1950s and 1960s


    The 1962 film *Dr. Vidya* (Rajendra Bhatia) is little known today, except for


    a scintillating dance- off between two of Hindi cinema’s most celebrated


    dancers, Helen and Vyjayanthimala (see Figure 4.1). While the narrative


    leading up to the production number elaborates popular cinema’s customary


    staging of the modernity- tradition conflict enshrined, in this case, in the


    bodies of the Franco- Burmese Helen and the Tamil brahmin Vyjayanthimala,


    once the women begin dancing, they emerge as collaborators and co-


    choreographers of this spectacle of movement. Helen gets on stage first,


    swinging and gyrating, and sings, “*Aye hai dilruba*” (“Oh my sweetheart”),


    addressing her competitor, who shortly joins her on stage (see


    ![](img/d3101073a89f0747f7eca6e948673baf_146_0.png)


    video 04.01).


    The two women’s outfits alternate in tones, Helen’s light- colored bodice and


    dark skirt contrasting with Vyjayanthimala’s dark body suit and white tulle


    attachment. As the stand- in for tradition, Vyjayanthimala’s character wears


    a modified, modernized *Bharatanatyam*- style head ornament, but rather


    than the routine dance- off between “Western” and state- sanctioned “Indian”


    dance styles, what we have here is Vyjayanthimala adopting Helen’s move-


    ment vocabulary, with her splayed fingertips and legs, gyrating hips, and


    high leaps. Both performers get long instrumental sections to showcase their


    dance moves, as they leap in the air, sprawl on the floor, twist and swivel


    into 360- degree spins, mobilizing all the space on the floor beneath and in


    the air around them with their agile limbs and twirling torsos. A panoply of


    cine- choreographic devices— low- angle shots to capture the dancing duo to-


    gether, high- angle shots to catch their floor moves, canted angles as we reach


    the virtuosic climax, frequent cuts to an appreciative audience, and play with


    stage lighting— is marshaled to portray their electrifying mobility as they


    annex space and delineate their performative terrain.'
