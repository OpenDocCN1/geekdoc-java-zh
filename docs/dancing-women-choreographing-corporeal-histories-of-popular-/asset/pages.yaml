    Dancing Women


    **Choreographing the Dance Social**


    From the available information on Sadhona Bose’s films, one gathers that she


    played the role of a dancer- actress in at least three films: *Abhinaya* (Modhu


    Bose, 1938), *Kumkum the Dancer* (Modhu Bose, 1940), and *Court Dancer*


    (Modhu Bose, 1941). While the very titles of these films (*abhinaya* translates


    from the Sanskrit as expression, especially through dance) proclaim dance as


    their principal attraction, the narratives and the generic tropes mobilized in


    these films point to the Boses’ sustained engagement with issues surrounding


    the public performance of dance by women. As gleaned from the *Abhinaya*


    song booklet, Sadhona Bose plays Manisha Chowdhury, a “modern woman,”


    winner of the “Miss Bengal” beauty contest, who, when she learns of her


    husband’s love for another woman, leaves home and becomes a famous the-


    ater actress by the name of Debi Indrani. The film concludes with Manisha/


    Indrani giving up her husband so he can marry his pregnant lover. In


    *Kumkum the Dancer*, Bose plays the eponymous heroine, a village girl, who


    avenges her trade union father’s incarceration by earning a precarious living


    as a dancer in a dramatic company. Bose goes on to play a sacrificing her-


    oine in *Court Dancer*, too, which tells the tragic tale of ill- fated love between


    a prince and a court dancer, whose profession is not accorded the respect


    it deserves. *Court Dancer* concludes with Indrani swallowing poison and


    killing herself in order to protect her prince and the state of Manipur. In all


    three films, Bose’s dancer protagonist is marked by a double figuration— as


    the housewife Manisha and the dancer- actress Debi Indrani in *Abhinaya*, as


    the poor village girl and the wealthy daughter- in- law who stages a play to


    avenge her father in *Kumkum*, and as the spiritual dancer of the *Raas Lila*


    and the sensuous court dancer in *Court Dancer*.^(137) This doubling bespeaks


    the tensions surrounding the construction of cinematic narratives around


    a female dancer, who needs to be recuperated from her profession by being


    depicted as forced to dance or as dancing for a higher purpose. The films


    purport to present dance more as a tool for personal and spiritual expression


    than as a medium for entertainment.


    I detect a generic tendency in these films that I refer to as the *dance social*


    on account of the imbrication of spectacular dance sequences and a melo-


    dramatic narrative form that, through the figure of the dancing protagonist,


    articulates changing relationships between the social and the individual, the


    public and the private, and shifting configurations of the traditional and the


    modern. The “social,” a generic mode particular to popular Indian cinema, is'
