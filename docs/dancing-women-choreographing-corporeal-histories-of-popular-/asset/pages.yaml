    dance form, *Kathakali*, traditionally performed by men,^(96) Vyjayanthimala’s


    strong swivels and grounded leaps testify to impressive strength and virtu-


    osity, and generate variously the *rasa*s, or affects, of *raudra* (anger), *veera*


    (courage), *bhayanaka* (terror), and *karuna* (pathos).^(97) The movement vocab-


    ulary of *Kathakali*, with its heavy and muscular footwork, large, expansive


    movements of the limbs that allow the dancer to forcefully annex space, a


    fixed, strong torso, and dramatic, pulsating eye movements, enables Pushpa


