    tion” that draw on and rub up against earlier professional cultures. Corporeal


    histories that account for labor, training, and collaboration excavate deep,


    interlinked records of film industrial practices and networks emerging from


    multiple performance and visual cultures.


    Reading film’s history alongside histories of music and dance shifts our


    signposts for tradition- modernity arguments constructed around cinema,


    as for instance, when we trace the complex cultural negotiations already at


