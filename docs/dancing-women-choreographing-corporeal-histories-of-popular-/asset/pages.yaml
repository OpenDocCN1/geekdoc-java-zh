    Epilogue


    Indian cinema), studying the industrial practices and personnel required for


    “attractions” such as dance, action, horror, etc., produces a different history


    and theorization of labor, materiality, and economies of production.


    When considered as part of a history of performance traditions, cinema’s


    figurations, technologies, and practices reveal their rich intermedial


    connections, producing corporeal, gestural, visceral histories. Through


    a material history of the labor of producing on- screen dance, theoretical


    frameworks that emphasize collaboration such as the *choreomusicking body*


    and *dance musicalization*, aesthetic approaches to embodiment drawing on


    treatises like the *Natya Shastra* and the *Abhinaya Darpana*, and formal anal-


    yses of dance- driven “techno- spectacles,” *Dancing Women: Choreographing*


    *Corporeal Histories of*  *Hindi Cinema* offers a variegated, textured history
    of


    cinema, dance, and music. This intermedial account, relating film to other


    performance cultures, folds in aesthetics, material practices, and technol-


    ogies to narrate histories of gesture and movement that reveal in turn the


    gestures and movements of social history. Cinema is part of a larger complex


    of corporeal practices, and the dancing women that populate this book fore-


    ground the labor, skill, and virtuosity of the many on- and off- screen bodies


    that produce the processes and pleasures of popular Hindi cinema.'
