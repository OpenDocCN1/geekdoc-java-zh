    3


    dance number mobilizes a gestural history, not just of their own star bodies


    and the production thereof, but also of popular Hindi cinema’s borrowings


    from other performance traditions and cinematic idioms. Vyjayanthimala’s


    *Bharatanatyam* routine and the accompanying Carnatic musicians are a nod


    to the South Indian actress’s early career in the Tamil film industry, while


    her *Kathak* routine puts us in mind of the Muslim courtesan film.⁶ Helen’s


    flagrantly hybrid flamenco and belly- dance routines, with accompanying


    musicians in sombrero and fez hats, respectively, evince Hindi cinema’s long-


    standing engagement with foreign dance forms and the enduring networks


    of exchange of movement vocabularies, while Kapoor earns his description


    as India’s Elvis Presley in the 1950s and 1960s with his pelvic thrusts, loose-


    limbed rock and roll moves, and an aura of youthful rebellion and defiance.⁷


    Attending to Vyjayanthimala’s fingers and feet, Helen’s waist, or Shammi


    Kapoor’s tremulous head, as indeed the choreography, cinematography, and


    editing pointedly invite us to, provides a means of constructing a historiog-


    raphy of popular cultural forms and trans- regional exchanges through the


    dancing body. Analyzing the collision and coalescence of cultural forms in


    the bodies of dancer- actors illuminates how the planes of the popular and the


    classical, the regional, the national, and the global are negotiated and articu-


    lated by popular Hindi cinema.


    In addition to the social practices that construct bodies, dance forces us to


    attend to the corporeal materiality of performing bodies. Adrienne McLean


    asks, “Which parts of the body (are allowed to) speak and perform, and in


    what contexts? Which parts of the body repeat the discursive meaning al-


    ready placed upon bodies by culture? What kinds of physical training


    and competence produce what effects?”⁸ In “*Muqabla humse na karo*,”


    Vyjayanthimala’s *Bharatanatyam*, *Kathak*, and *Kathakali* routines, Helen’s


    cabaret, flamenco, and belly- dance responses, and Shammi Kapoor’s “loose”


    Elvis moves map all too easily along the axes of tradition and modernity,


    Indian and Western movement vocabularies, and trained and spontaneous


    gestural articulations.⁹ The dance- off in popular Hindi cinema has typically


    been read as “corpo- realizing” the post- colonial conflict of modernity and


