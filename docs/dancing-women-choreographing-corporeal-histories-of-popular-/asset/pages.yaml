    since they aim to further the narrative.


    **Body Zones and the Production of Affect**


    Different parts of the dancing body are deployed in the performative catego-


    ries of *nrtta*, *nritya*, and *natya*. The *Natya Shastra* presents a dizzying
    variety


    of movements and expressions, constructed through various body units. It


    details as many as eighty face movements, produced by the head, eyes, nose,


    cheeks, mouth, lower lip, and chin. Eye movements are codified into thirty-


    six kinds of glances, which employ the eyebrows, eyelids, eyelashes, eyeballs,


    and pupils. Similarly, specific instructions are provided for the use of the


    hands, arms, breasts, sides, belly, waist, thighs, shanks, and feet to produce


    different kinds of gaits, leaps, jumps, and whirling movements of the body.^(63)


    In the spirit of popular Hindi cinema’s whimsical appropriations, I adapt this


    elaborate lexicon to deconstruct the dancing female body in Hindi cinema


    into three broad categories— the face, the torso, and the limbs. Each of these


    “body zones” is capable of a variety of addresses, depending on the deploy-


    ment of their constituent parts, and the social connotations of those gestural


    articulations.'
