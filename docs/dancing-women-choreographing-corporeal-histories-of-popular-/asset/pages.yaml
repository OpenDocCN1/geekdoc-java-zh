    **Dance and the Production of Gender**


    As may be evident from this taxonomy and the examples cited, the com-


    portment and configuration of the performing body significantly alters as


    we move from the pure song sequence to the pure dance sequence. Dance


    movements and the modalities of their display emerge as central mechanisms


    in the gendering of performance in Hindi cinema, where, as we move from


    the song sequence to the production number and the pure dance sequence,


    the presence of male performers is dramatically diminished. While the ro-


    mantic duet in the Hindi film typically features the central heterosexual


    couple, the modality of display and performance in the production number


    typically genders it as a space for female performance. Indeed, with a few


    exceptions, the production number was the domain of the female performer


    until the late 1990s.^(31) In Laura Mulvey’s defining discussion of the male gaze,


    mainstream popular cinema highlights a woman’s “to- be- looked- at- ness,”


    equating femininity with spectacle, and in fact building “the way she is to be


    looked at into the spectacle itself.”^(32) In popular Hindi cinema, the produc-


    tion number has been the predominant arena for the display of the female


    body as an icon of male desire. Indeed, certain female roles are constructed


    purely to function as agents of spectacle, put on display through the produc-


    tion number. The key examples of this are the figures of the vamp and the


    contemporary item girl, female performers who appear only in production


    numbers, exit their marginal role in the narrative without ceremony, or are


    dispensed with in order to clarify the desire of the hero for the heroine. The


