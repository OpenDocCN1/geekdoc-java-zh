    Dancing Women


    Theorizing acting through dancing bodies illuminates how certain move-


    ment vocabularies engender specific types of cinematic narratives, genres,


    and industries. This may be expanded to a broader corporeal theory of screen


    performance that attends to movement vocabularies, physical training,


    performers’ idiogests, the shifting registers in bodily comportment when


    actors move through different narrative segments, and the relationship of


    cinema to other performance traditions.^(106) When Vyjayanthimala employs


    *abhinaya* to enact a range of human and non- human subjectivities— rain,


    rivers, peacocks, snakes, thunder, lightning, flowers, gods and goddesses,


    and persecuted performing women like Pushpa in *Kathputli*— her actor’s


    body is imbued with the capacity to embody multiscalar modalities, ranging


    from personal experiences to cosmic inhabitations. Even as narrative exigen-


    cies frame Pushpa as a puppet dancing to other people’s tunes, allegorizing


    female subjection in a realist- melodramatic idiom, when this is articulated


    through dance, what erupts out of the narrative frame is Vyjayanthimala’s


    dexterous choreography of multiple performance modes. In the body of


    a dancer- actress, the puppet turns into the adroit, commanding puppet


    master. This is why when we think of dancer- actresses, there is no way to not


    think of their bodies.


    **The Melodrama of Dance Reform**


    As evident in their filmographies, Vyjayanthimala and Waheeda Rehman’s


    dancing bodies were particularly foregrounded in two types of films: una-


    bashed dance films (Rehman’s early dancing- girl roles in the South, and


    Vyjayanthimala’s “light entertainments” in the 1950s), and what I  de-


    scribe as melodramas of dance reform. Unlike itinerant dancing girls—


    Cuckoo, Helen, Laxmi Chaaya, and others— when dancing heroines like


    Vyjayanthimala, Waheeda Rehman, and Padmini emerged as A- list actresses


    in Bombay cinema, narratives of reform were inevitably written around


    their dancing bodies. Significantly, through the 1950s, Vyjayanthimala


    and Padmini had flourishing parallel careers in the Madras film industry,


    dancing away in mythologicals and period dramas that proliferated in pop-


    ular Tamil and Telugu cinema, unencumbered by the narrative scaffolding of


    reform. The greater prestige that social melodramas had accrued in Bombay


    cinema from the mid- 1940s was related to their reform- driven narratives


