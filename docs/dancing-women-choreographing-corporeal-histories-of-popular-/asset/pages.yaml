    Studying the stance adopted by the dancing body and the body’s occupa-


    tion of space in various dance forms is instructive for an analysis of Hindi


    film dance. Most classical Indian dance forms feature codified movements


    in space along straight lines, diagonals, figures of eight, and spirals. What


    is distinctive about post- revival, upper- caste, canonized *Bharatanatyam*,


    for example, is its definition of movement in space along straight lines or


    triangles. This in turn creates a movement vocabulary that is characterized


    by lateral movements of the head, lower limb movements along straight lines


    or marking two sides of an imaginary triangle, and upper limbs following


    the lower limbs or weaving circular patterns along the space covered by the


    lower limbs. *Kathak*, like Indian miniature painting, conceives of space only


    in straight lines, which leads to a front- back treatment of space in its move-


    ment vocabulary.^(54) Movement patterns in *Odissi*, on the other hand, are de-


    cidedly circular, with the *minadandi* movement (literally, covering space


    like a fish) being the most common technique to cover space through semi-


    circular turns of the leg. Movements known as *gheras* cover space in circles,


    semi- circles, and concentric circles.^(55)


