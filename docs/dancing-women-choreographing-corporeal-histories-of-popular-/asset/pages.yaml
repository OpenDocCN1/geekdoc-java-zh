    This production number’s choreography, with belly- dance influenced torso


    deflections and chest- heaving, demanded a comportment that Malini’s


    *Bharatanatyam*- trained body found difficult to approximate.


    Through its eclectic borrowings, Hindi film dance folds the spatio-


    temporal inhabitations of classical and folk dance forms, and also borrows


    freely from transnational forms such as cha- cha- cha, modern jazz, salsa,


    etc., where the emphasis is on the coverage of space— whether floor- space


    or space in the air— through leaps and jumps. Adopting freely from myriad


    movement vocabularies, Hindi film dance emerges as a vital space of exper-


    imentation, where different gestural systems are mixed through a mongrel


    logic to produce a choreography of great affective force. Rather than just


    throwing together different styles, film choreographers give considerable


    thought to the requirements of *bhava* (emotion) and *rasa* (affect), invoking


    the vocabularies of different dance styles to generate a particular *rasa*. In


    *Kathputli*, for instance, while the more routinely used movement vocabu-


    laries of *Kathak* and *Bharatanatyam* are employed in production numbers


    that showcase Vyjayanthimala’s classical dance training, the dance form of


    *Kathakali*— with its spread- out hands and legs, fixed, strong torso, and dra-


    matic, pulsating eye movements— is invoked for the fiery, impassioned ex-


    pression of her character’s agony in the final production number.^(59)


