    **Pre- Playback Dance in Indian Cinema**


    As forms invested in the exploration and exhibition of movement, cinema


    and dance have had a long history of engagement. Cinema enlisted dance


    from its very beginnings. In films like *Dickson Experimental Sound Film*


    (William K.  L. Dickson, 1894)  and *Annabelle the Dancer* (William K.  L.


    Dickson, William Heise, 1895), the Edison Manufacturing Company used


    dancers to demonstrate to first- time spectators cinema’s propensity for the


    spectacular display of movement (see


    ![](img/d3101073a89f0747f7eca6e948673baf_23_0.png)


    video 00.03). The shared investment


    in movement ensured a “spontaneous intermediality” between early cinema


    and dance, with traditional or exotic dances frequently featured during the


    first decade of cinema.^(29) Laurent Guido situates the emergence of cinema in


    a context of intense aesthetic and scientific preoccupation with bodily move-


    ment: “Dance, just as sports and gymnastics, imposed itself at the beginning


    of the 20th century as a harmonious way of organizing body movement. It


    was considered that the muscular mimicry put into motion by physical per-


    formance would position [film] spectators under an irresistible rhythmic


    spell.”^(30) Dance, along with acrobatics and other forms of physical display,


    was employed to showcase the immense kinesthetic potential of the new me-


    dium of film. Douglas Rosenberg delineates the relationship of dance and


    the architectural specificity of the film camera through a discussion of how


    Eadweard Muybridge, Thomas Edison, the Lumière brothers, Etienne- Jules


    Marey, Thomas Eakins, and others in the late nineteenth and early twentieth


    centuries were primarily concerned with the phenomenology of bodies in


    motion as apprehended by optical technologies.^(31) Since Edison’s camera was


    unmoving and anchored to a tripod, he employed dancers to supply motion


    to the frame. “The visualization of choreography on film reinforces that what


    we are a witness to is indeed the passing of time. This sort of concrete use of


    dance as a metronome to prove cinema is the earliest incarnation of the re-


    lationship of dance to the moving image,” notes Rosenberg.^(32) Nell Andrew


    and Tom Gunning discuss early cinema’s fascination with Loie Fuller’s ser-


    pentine dance, which enables what Andrew terms the “serpentine films,”


    of which more than thirty were made between 1894 and 1910,^(33) to demon-


    strate the shifts between two and three dimensions, motion and stillness, the'
