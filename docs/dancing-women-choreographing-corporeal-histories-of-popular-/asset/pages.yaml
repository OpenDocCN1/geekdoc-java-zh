    body drawing our gaze to both anatomical surface and ideological depth— or


    indeed the reverse, to the depth of the performing body beneath its ideo-


    logical inscriptions (as, for instance, chaste, salacious, traditional, modern,


    etc.). Reading the dancing woman through cultural and material lenses


    directs our attention not only to social norms for female public performance,


    but also to the specific gestural idiolects of individual dancer- actresses that


    may challenge or subvert these through their movement vocabulary. Why


    women? Quite simply, because they were the primary performers of dance


    in Hindi cinema until the late 1990s, and a focus on the routine picturization


    of solo dance numbers with female performers reveals how gender plays a


    central role in the discourses of censorship and spectacle that animate film


    dance.^(17) By charting discursive shifts through figurations of dancing women,


    their publicly performed movements, private training, and the cinematic


    and extra- diegetic narratives woven around their dancing bodies, *Dancing*


    *Women* considers the “women’s question” via female mobility, afforded by


    the physical movement of dance and the social movement that dancing


    engenders.^(18)


    Some of the central figures through whom I analyze Hindi film dance


    from the 1930s to the 1990s are Azurie, Sadhona Bose, Vyjayanthimala,


    Helen, Waheeda Rehman, Madhuri Dixit, and Saroj Khan. This selection is


    not meant to be strictly chronological or comprehensive, but serves rather


    to highlight certain key moments in the articulation of Bombay cinema’s


