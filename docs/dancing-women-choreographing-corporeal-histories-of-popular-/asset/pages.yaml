    Both dancer- actresses were trained by highly respected *nattuvanars*, male


    members of the *devadasi* community who had reinvented themselves as


    dance teachers to urban elites and as film choreographers. While the cultiva-


    tion of new taste habits among the elites of Madras required that *devadasi*s
    be


    rendered invisible on the stage and in the movies, the male members of these


    performing communities, who felt a “need to develop a ‘closed’ patrifocal


