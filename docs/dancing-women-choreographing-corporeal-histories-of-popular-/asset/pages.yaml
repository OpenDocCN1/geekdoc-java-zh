    The necessity of such an organization was all the more compelling in view


    of the fact that all of a sudden the erstwhile princely patronage to the arts


    had ceased to function or was fast ceasing. In the void thus created, the art


    traditions were faced with the grave risk of breaking down in an atmos-


    phere of general decline in our cultural and artistic values.^(20)


    Princely states such as Awadh, Tanjavur, Hyderabad, etc., had fostered a


    cultural environment where *tawaif*s, *devadasi*s, and traditional musicians


    were accorded financial and social prestige and patronage. The Akademi


    represented the state’s project to extricate these performing arts from their


    traditional milieus and transplant them onto the “secular” stage. The Akademi


    organized four seminars— film (1955), theater (1956), music (1957), and


    dance (1957)— to bring together knowledgeable elites in each field to engage


    in “stock- taking.”^(21) One of the principal functions of the Akademi was to


    codify and hierarchize dance practices. The 1958 Dance Seminar classified


    various dance forms by linguistic group, designating them along the binary


    of classical and folk. To be canonized as classical, dance forms had to claim


    antiquity through a textual tradition traced back to the *Natya Shastra* and


    other ancient and medieval treatises on performance. Declaring an initial


    canon of four classical dance forms— *Bharatanatyam*, *Kathakali*, *Manipuri*,


    and *Kathak*— the Akademi’s “Expert Committee on Dance” decided through


    their annual awards which dances would be recognized as “authentic” clas-


    sical forms, compiling technical terms and texts on music, dance, and drama,


    and organizing regular dance festivals.^(22)


