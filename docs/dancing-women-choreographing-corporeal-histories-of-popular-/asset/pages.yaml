    **Introduction**


    A Corporeal History of Hindi Film Dance


    The dance number opens with a close- up of a *mridangam* drum and zooms


    out to show us three Carnatic musicians playing percussive music.¹ Cut to a


    long shot of the dancer- actress Vyjayanthimala executing a *namaskaram*, the


    opening movement of obeisance in the *Bharatanatyam* repertoire, followed


    by a dynamically- edited sequence of close- ups of her footwork, *mukhaja*


    *abhinaya* (facial gestures), and *hasta mudras* (hand gestures).² As she moves,


    she mobilizes the camera to track from her vigorous *Bharatanatyam* routine


    to Hindi cinema’s favorite “vamp,” Helen, performing her trademark “cab-


    aret” dance moves in a bustier, mini skirt, tights, and heels.³ As both dancing


    women spurn the film’s hero, played by Shammi Kapoor, he swings his Elvis


    quiff and sings, “*Muqabla humse na karo*” (“Don’t compete with me”), his


    arms swaying, his head jolting frenetically (see


    ![](img/d3101073a89f0747f7eca6e948673baf_10_0.png)


    video 00.01). This scintil-


    lating dance- off between Bombay cinema’s three best- known dancer- actors


    of the time is the central attraction of *Prince* (Lekh Tandon, 1969). Its staging


    of a techno- spectacle of cine- choreographic innovations, dazzling costume


    and set design, and an array of musical and dance styles alerts us to questions


    of virtuosity, labor, and pleasure undergirding the production and reception


    of popular Hindi film dance. While the film’s narrative undertakes many


    contortions to stage this dance number, when we shift our focus from plot to


    bodily performance, to the corporeal competence and protracted training re-


    quired for dancing, and to the spectatorial desires that screen- dancing bodies


    activate, we may discern that spectacle *is* the narrative when Vyjayanthimala,


    Shammi Kapoor, and Helen come together on screen (see Figure I.1).


    Taking a cue from Jane Desmond’s discussion of the dancing body “as a


    ground for the inscription of meaning, a tool for its enactment, and a medium


    for its continual creation and re- creation,”⁴ we may read Vyjayanthimala,


    Shammi Kapoor, and Helen’s bodies as writing and written upon, as interpel-


    lated materializations of biology, history, technology. Helen’s supple, twisting


    torso, mobile mouth, and splayed legs, Vyjayanthimala’s large, kohl- lined'
