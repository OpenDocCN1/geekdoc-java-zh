    Given this contempt toward dance, how did Sen’s grand- daughter come to


    be a celebrated public performer around forty years later? The *Court Dancer*


    song booklet describes Bose as “Young, Beautiful and Vivacious, of high


    birth and cultural and social attainments. . . . The progressive instincts of


    her famous grandfather have found fruitful echo in the versatile artistry of


    Sadhona.” What were the shifts in discourse over this period that allowed


    a girl from Keshab Chandra Sen’s own upper- class Bengali family to learn


    dance forms like *Kathak* and musical forms like the *Thumri* that were the


    domain of the *tawaif*s through the nineteenth century and until the early


    decades of the twentieth?


    By the 1920s, cultural revivalists like E. Krishna Iyer started crusading


    against the anti- *nautch* movement and began to “rehabilitate” dance forms


    such as *Sadirattam* performed by the *devadasi*s in South India. For these


    dance forms to be deemed acceptable by bourgeois patrons, however,


    reformers like Iyer had to accede to part of the anti- *nautch* campaigners’


    demand— that the social customs and rituals associated with these forms be


    excised and only the “pure art” be retained. Iyer, a lawyer in Madras, tried to


    secure audiences for the hereditary *devadasi*s, but when that failed, he began


    studying Sadirattam himself, and in 1926, presented it as the dance form


    of *Bharatanatyam* before the cultural elite of Madras.^(30) That same year, be-


    tween January 8 and May 9, 1926, the Denishawn Dance Company, formed


    by Ruth St. Denis and Ted Shawn, performed over 100 dance concerts


    in India. St. Denis, celebrated as a pioneer of modern dance in the United


    States, performed a series of productions inspired by “Indian themes,” such


    as *The Nautch*, *The Dance of the Black and Gold Sari*, *The Cobras*, *Yogi*,
    and


    *Radha*. As the titles suggest, these pieces presented India as a land of dancing


    girls, snake charmers, and spiritual mystique.^(31) St. Denis’s performances are


    reported to have rekindled in her bourgeois Indian audiences an interest


    and pride in their dance forms. The dance critic Walter Terry, for example,


    claimed that St. Denis’s “non- authentic Indian dance helped reawaken the


    subcontinent’s slumbering dance art and [was] at least partially responsible


    for the renascence of India’s respect for its 2,000 year old heritage.”^(32) The
    cir-


    cular, imperial logics of appropriation and gentrification become apparent


    when we consider Priya Srinivasan’s research on how St. Denis’s rise to fame


    as one of the “foremothers” of American modern dance and as an “Oriental


