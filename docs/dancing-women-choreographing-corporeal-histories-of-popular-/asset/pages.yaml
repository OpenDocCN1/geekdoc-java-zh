    because it will contribute its quota in eradicating the myth of the backward-


    ness of this great country of ours.”^(130) Significantly, the booklets foreground


    Wadia’s vision and Sadhona Bose’s dancing credentials as foundational to


    this expensive project, with “life sketches” of the producer and the dancer-


