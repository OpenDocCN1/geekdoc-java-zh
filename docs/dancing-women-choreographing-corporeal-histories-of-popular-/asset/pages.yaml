    The drive to fix cultural forms that would embody the aesthetic and ethical


    ideals of the new Indian nation set the bar for “authenticity” in film dance as


    well. Whereas dancer- actresses like Sadhona Bose and Azurie flaunted hy-


    bridity and innovation in their performance and choreographic vocabularies,


    leading dancer- actresses of the 1950s and 1960s, such as Vyjayanthimala,


    Padmini, and Waheeda Rehman, had to constantly emphasize their rig-


    orous training with traditional *nattuvanars* as well as their middle- class


    respectability. Through the violent marginalization of traditional female


    performers, public dance performance by upper- class and - caste women had


    been destigmatized and even allowed for their promotion as ideal national-


    cultural bodies, as evidenced in Vyjayanthimala’s prestigious *Bharatanatyam*


    recitals for dignitaries such as the Indian president S. Radhakrishnan, prime


    ministers Jawaharlal Nehru and Indira Gandhi, Queen Elizabeth II, and US


    president Dwight Eisenhower.^(39) In fact, it may be argued that on- screen


    *Bharatanatyam* by upper- caste dancer- actresses played as significant a role
    in


    the gentrification of the dance form as Rukmini Devi Arundale’s Kalakshetra


    Foundation did. Kamala Laxman’s dance in *Nam Iruvar* (A. V. Meiyappan,


    1947) was hailed as ushering in a cultural revolution. “Dance schools sprouted


    all over and Bharatanatyam acquired respectability,” declares one review of


    the film.^(40) Laxman’s film dances were seen as spurring national awareness


    of *Bharatanatyam*,^(41) with even orthodox arts magazines celebrating her


    vanguard role: “through her, the art of Bharatanatyam spread to every nook


    and corner of the country.”^(42) Krishnan provides an in- depth examination


    of how Laxman’s cosmopolitan Brahmin identity and her apprenticeship


    under the *nattuvanar* Vazhuvoor Ramaiah Pillai defined the conventions


    for staged performances of *Bharatanatyam* in Madras. “It was her work, not


    that of Rukmini Arundale and Madras’s intellectual elites, that persistently


    straddled the stage and cinema and brought Bharatanatyam to South India’s


    middle class in the 1940s,” he argues.^(43) Among the first dance forms to be


    canonized as classical, *Bharatanatyam* acquired national status as a symbol


    of Indian heritage, employed to visualize the nation across stage, print, and


    screen. The processes of nationalism, state patronage, and upper- class and


    - caste sponsorship selectively legitimized certain regional artistic forms


    as “national” and therefore “classical.”^(44) However, the inclusion of a South


    Indian dance form into the so- called all- India Hindi- Urdu film produced al-


    tered figurations of the dancing female protagonist, exposing fissures in the


    discursive constructions of “national” versus “regional” cultures and bodies.


