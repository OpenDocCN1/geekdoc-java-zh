    Dancing Women


    **Bodies, Spaces, and Movements in Indian Classical**


    **and Folk Dance**


    While it is a commonplace to describe Hindi film dance as a hybrid of Indian


    classical and folk dance forms, this section undertakes a closer examination


    of the influence of these dance cultures on Hindi film dance, the represen-


    tation of these dance forms on screen, and the analytical tools that aesthetic


    treatises on dance can provide for the study of film dance. Rather than estab-


    lish trajectories of origins and derivations between the categories of classical,


    folk, and film dance (themselves contentiously defined in the mid- twentieth


    century, as discussed in Chapters 3 and 4), a genealogical approach highlights


    strata of simultaneity so that one may link these categories through gestures,


    marks, and traces.


    While Hindi film dance has different aesthetic and affective aims than clas-


    sical Indian dance forms, the detailed documentation of the codifications of


    the dancing body in treatises like the *Natya Shastra* and *Abhinaya Darpana*


    provide useful methodological approaches for the study of movement vocab-


    ularies in Hindi cinema.^(45) Rather than treat these texts as part of an un-


    broken, upper- caste, Sanskritized lineage, as indeed they were mobilized for


    the “revival” of Indian dance forms in the 1940s, and continue to be employed


    in upper- caste classical dance training and performance circuits today, I aim


    to excavate these texts’ corporeal aesthetics through their embodied per-


    formance by *devadasi*s, *tawaif*s, dancer- actresses, choreographers, backup


    dancers, and the like.^(46) It is worth noting that in the *Natya Shastra* and


    *Abhinaya Darpana*, the word *natya* refers to acting and dancing, since both


    performative modes were combined in Sanskrit theater. The art historian


    A. K. Coomaraswamy, who translated the *Abhinaya Darpana* into English


    in 1917, notes in his introduction that while this treatise’s principles may


    no longer apply entirely to contemporary, hybrid Indian theater, “authentic


    Indian acting . . . survives in the ‘Nautch,’ a form of dance which sets forth
    a


    given theme by means of song and gesture combined, [which] together with


    the sister art of music, must be regarded as representing the most perfect


    form of old Indian practical aesthetic culture now surviving.”^(47) Upper- caste


    nationalist reformers canonized *Bharatanatyam*, *Kathak* and other dance


    forms as classical by gentrifying this very *nautch* form and marginalizing its


    traditional creators and performers, who in fact provide a vital genealogy for


    dance and acting in popular Indian cinema. Through their forceful partici-


    pation in various Indian film industries, members of hereditary performing'
