    and their communities carry over to the film industries they participate in,


    prompting us to examine gendered labor in cinema, with its male musicians


    and dance masters and female singers and dancers, often descended from


    matrifocal *tawaif* and *devadasi* communities. We thus trace the textured ge-


    nealogy of the male *nattuvanar*s, who move from their role as dance teachers


    and musicians in temples, courts, and private salons to become the early,


    defining music composers and dance masters in Tamil and Telugu cinema.


