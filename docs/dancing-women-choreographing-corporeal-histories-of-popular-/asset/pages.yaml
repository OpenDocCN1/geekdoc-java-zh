    An analysis of dance films and dancer- actresses in the 1950s and 1960s reveals


    the sustained and constantly reworked tensions between public performance


    and constructions of ideal femininity. While melodramas of dance reform


    articulate continuing anxieties about the participation of dancing women in


    the public sphere, the star texts of dancer- actresses like Vyjayanthimala and


    Waheeda Rehman serve to cleanse the image of the dancing woman, and,


    by extension, of the female film star. Discourses of respectability in relation


    to public performance by women, which defined much of the conversation


    around dancing and film acting through the first half of the twentieth cen-


    tury, are narrativized through dancing women in films of this period, figured


    through recurrent oscillations between disrepute and esteem, censure and


    veneration. The female public performer is a vital figure in the analysis of


    socio- cinematic figurations because her foregrounding of the enactment of


    the conventional female roles of seductress and domestic goddess, her all-


    too apparent masquerade, rips open the illusion of the cohesion and fixity


    of these roles and in fact their binary construction.^(129) The repeated splitting


    of female characters can be read as part of the struggle to restrain what had


    come to be seen as the terrifying slippage between these roles— of the dancer,


    the *bai*, and the good wife, the *devi*, which remain in a complicated relation-


    ship marked by reciprocal anxiety and desire.


