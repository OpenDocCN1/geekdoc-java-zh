    **From the Production Number to the Item Number**


    One of the principal markers differentiating contemporary Bollywood


    cinema from earlier modes of popular Hindi cinema is the item number.


    Popularly held to be inaugurated by the song- and- dance sequence “*Chaiyya*


    *chaiyya*” in *Dil Se* (Mani Ratnam, 1998), the item number is a production


    number that is blatantly unrelated to the film narrative and primarily in-


    tended to showcase raunchy dance moves and skimpily clad bodies, usu-


    ally of women, of “item girls.” Drawing on popular theatrical traditions


    such as *Tamasha*, *Nautanki*, as well as the urban “bar dancing” culture, the


    item number is often constructed like a music video.² Remarking on the


    separation of the item number from the rest of narrative, Nasreen Rehman


    notes, “The body and the item number circulate disembedded from cellu-


    loid, as autonomous goods on sale, in conflated fantasies of sexual desire


    and consumption.”³ Signaling a new economy of dance in Hindi cinema,


    the item number is a stand- alone attraction featuring bodies, spaces, move-


    ment vocabularies, and technical flourishes that are unconnected to the rest


    of the narrative.⁴ The “item girl,” the female performer at the heart of the


    item number, for example, rarely features in the rest of the narrative. Unlike


    the vamp, who was typically associated with the villain, and whose cabarets


    and production numbers were sometimes integrated into the narrative


    and helped move the plot forward, the item girl is purely an agent of spec-


    tacle, devoid of narrative purpose. Hence, the moral binaries that defined


    the vamp- heroine dyad do not apply to the item girl and the contemporary


    Bollywood heroine. This separation of the dancing body from moral codes


    points toward Bollywood cinema’s economy of spectacle, where the body—


    often reconstructed through plastic surgery or extreme fitness regimens


    before the shooting of an item number, and through sets, costumes, cinema-


    tography, and editing— is presented as a commodity that materializes new


    patterns of consumption.'
