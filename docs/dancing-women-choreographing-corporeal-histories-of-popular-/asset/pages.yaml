    Dancing Women


    Women’s history, as Joan Kelly notes, has the dual goal of restoring women to


    history and restoring our history to women.^(176) As the authors of significant


    changes in women’s participation in the performing arts, Azurie and Bose


    had to continuously walk the line between respectability and censure. The


    construction of their careers at the intersection of the paradigms of moder-


    nity and national identity, cosmopolitanism and tradition, demonstrates the


    complex and dynamic interactions between the categories of gender, nation,


    and culture during this period.


    Political shifts and the formation of the new nations of India and Pakistan


    significantly altered the performance landscape in the late 1940s and early


    1950s. Ramamurthy notes that the cosmopolitan New Woman faded from


    Indian cinema by the end of the 1930s, as she was seen as “unfit for the all-


    important job of nurturing cultural nationalism.”^(177) Soneji observes that by


    the 1940s, “the aesthetics and politics of dance were already in the hands


    of non- devadasi women.”^(178) With the systematization and Sanskritized,


    textually grounded canonization of dance forms in the early 1950s, when


    the Indian government set up cultural institutions like the Sangeet Natak


    Akademi (The National Academy for Music, Dance and Drama), the oriental


    dance forms developed by Uday Shankar, Ram Gopal, and others were dis-


    paraged and came to be considered “semi- classical” at best, and inauthentic


    hybrids at worst. Even as, in the 1950s, Bose and Azurie moved from cinema


    to dance- dramas and international dance tours, where they were often pro-


    moted and received as oriental dancers, producing a hybrid of various dance


    styles, a new generation of dancer- actresses entered the Bombay film in-


    dustry, trained in the recently canonized and more strictly codified dance


    forms of *Bharatanatyam* and *Kathak*. Film dance in the 1930s and 1940s re-


    mains a site of frenetic experimentation in music, set and costume design,


    and cine- choreographic innovations that aim to capture new mobilities on


    screen.'
