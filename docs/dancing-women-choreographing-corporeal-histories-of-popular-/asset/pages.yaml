    Dancing Women


    Sadhona Bose, probably the most alluring and fascinating personality


    that has ever thrilled an audience of Indian dance lovers, is the star, soul,


    substance and inspiration of the forthcoming Sagar Movietone release


    “Kumkum the Dancer”. . . . The picture was made to provide a vehicle of


    expression for the beautiful art of this great and in her own way unique,


    Bengalee artiste whose dancing is really a miracle of exquisite grace and en-


    chanting loveliness.^(152)


    Genres, narratives, locations, cinematic spaces, music, costume, and makeup


    become “vehicles” in Bose’s films to drive her star attribute to the fore. As


    seen in the earlier discussion of dance musicalization, dancing stars substan-


    tially determined the musical compositions they would perform to. Sadhona


    Bose’s collaborations with Timir Baran in plays, films, and her later dance-


    dramas attest to the influence of her dancing body on the aural- scape of her


    performance contexts. As author, the actor exerts a different kind of force


    than the director or other crew members. In the use of her or his particular


    body, gestural vocabulary, and range of expressions, the star produces certain


    narratives, cinematic spaces, and mythologies. While Modhu Bose was in-


    strumental in creating the dance social genre as well, Sadhona Bose’s physical


    skills as a dancer and her construction of a *bhadramahila* dancing body mo-


    bilize a particular cinematic assemblage in the 1930s and 1940s that skillfully


    blends the spectacular attractions of film dance with a discourse of cultural


    nationalism.


