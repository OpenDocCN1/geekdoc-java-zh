  md: 'Glossary


    ***antara*** See *mukhda*.


    ***bai*** **or** ***baiji*** The common North Indian appellation for professional
    female musicians and


    dancers, who were often courtesans that enjoyed princely patronage.


    ***Bhangra*** A vigorous Punjabi folk dance performed mainly by men.


    ***Bharatanatyam*** A South Indian classical dance form, among the first to be
    canonized as


    “classical” by the Sangeet Natak Akademi (The National Academy for Music, Dance,


    and Drama). In addition to a vast gestural vocabulary, *Bharatanatyam* is characterized


    by the *araimandi* (half- squat) stance, and the execution of geometric movements
    in a


    given time cycle.


    **Bollywood** Following Madhava Prasad and Ashish Rajadhyaksha’s descriptions


    of the term, in this book Bollywood stands for a specific mode of popular Hindi


    cinema that developed from the 1990s, characterized by, among other things, family


    melodramas, big- budget, spectacular song- and- dance sequences, characters who


    often live outside of India, a conscious display of multinational brand names,
    and


    an unmistakable address to a diasporic audience. Following closely on the heels
    of


    economic deregulation in India in 1991, Bollywood proceeded to trigger a larger
    en-


    tertainment complex that now includes television, music, advertising, fashion,
    and


    new media.


    ***devi*** The literal English translation of *devi* from Sanskrit/ Hindi is “goddess.”
    However, it


    refers more broadly to a virtuous, respectable, usually married woman.


    **item girl** Female performer in dance numbers known as “item numbers,” which
    bear no


    relation to the narrative but are inserted purely as spectacular attractions.


    ***Kathak*** A North Indian classical dance form, one of the eight dance forms
    canonized as


    “classical” by the Sangeet Natak Akademi (The National Academy for Music, Dance,


    and Drama). In addition to a vast gestural vocabulary, it is marked by elaborate
    foot-


    work and spins of the body.


    ***Kathakali*** A South Indian classical dance form performed in the state of
    Kerala, and


    among the eight canonized classical dance forms. It is predominantly performed
    by


    men, and employs specific codes of costume and make-up to depict mythological


    characters.


    ***Koli*** A folk dance form performed by fishing communities in Maharashtra.


    ***kotha*** The performance space of the Islamicate *tawaif*, or courtesan, the
    *kotha* is a salon


    that takes on particular architectural features in popular Hindi cinema and is
    marked


    by a particular organization of performer and audience.'
