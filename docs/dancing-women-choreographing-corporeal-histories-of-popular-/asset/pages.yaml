    **Dance and the Film Spectator**


    While song- and- dance sequences have been theorized as interruptions


    and attractions by various scholars (Gopalan, Gopal, and Moorti), a focus


    on dance reveals that some types of song- and- dance sequences (e.g., pro-


    duction numbers) function differently as interruptions or attractions than


    others, such as narrative numbers or song sequences with no dance compo-


    nent. Narrative numbers and song sequences tend to be more imbricated in


    the narrative and its more- or- less homogeneous time, while in halting the


    narrative for their sensational attractions, production numbers inhabit a


    different temporality, pulling away into a heterogeneous time of spectacle.


    Within scholarship and popular film criticism, there is mention of audiences


    walking out for a snack or a smoke during song- and- dance sequences.^(38)


    However, because the production number’s attractions exceed its function


    in the narrative, it offers heterogeneous pleasures which often prompt repeat


    viewings of the film or of that particular song- and- dance sequence, espe-


    cially in more recent decades, on television and online streaming services. As


    discussed earlier, dance sequences choreograph the body differently than the


    rest of the narrative, producing a repeated attraction through the dazzling


    skills of solo performers, the euphoric production of community through


    group dances, or of the couple through a duet, provoking and responding


    to a variety of spectatorial desires.^(39) One example— from Tamil and Telugu


    cinema of the 1980s and 1990s— is the inclusion of titillating dance numbers


    by the dancer- actress Silk Smitha, which were guaranteed to draw audiences


