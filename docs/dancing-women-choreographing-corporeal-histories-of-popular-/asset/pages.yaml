    **Citations of the Cinematic Past through Dance**


    Kapoor’s recreation of Helen’s dance in “*Yeh mera dil*” is one mode of


    Bollywood’s commemoration of the past— through remakes of films and


    reproductions of older song- and- dance sequences. Another form of in-


    tertextuality with the past is through song- and- dance sequences com-


    posed of a collage of earlier styles of dance, music, choreography, and


    mise- en- scène. The song- and- dance sequence “*Woh ladki hai kahan*”


    from *Dil Chahta Hai* (Farhan Akhtar, 2001), for example, deploys a series


    of gestures, costumes, and locations associated with popular film dance


    to define and periodize popular Hindi cinema (see


    ![](img/d3101073a89f0747f7eca6e948673baf_208_0.png)


    video 06.02). The


    sequence alludes to cinematic eras through movement vocabularies that


    transition from jazz- inspired moves in the 1950s, to group “picnic dances”


    of the 1970s, to the synchronized gyrations of Madhuri Dixit’s 1980s and


    1990s numbers. Dance becomes the foremost attribute of popular Hindi


    cinema that is mobilized to recreate the history of this film industry and


    culture.


    Similarly, the production number “*Dhoom tana*” (*Om Shanti Om*, Farah


    Khan, 2007) quotes from four dance numbers of the 1960s and 1970s. The


    film’s protagonists are transposed into the corpo-realized spaces of popular


    Hindi cinema, where dance is the principal tool for the expression of desire.


    In the production number “*Phir milenge chalte chalte*” from *Rab Ne Bana Di*


    *Jodi* (Aditya Chopra, 2008), the male protagonist Raj, played by Bollywood’s


    poster boy, Shah Rukh Khan, takes on the dancing personas of various stars


    from earlier eras of popular Hindi cinema, including Raj Kapoor from the


    1950s, Dev Anand and Shammi Kapoor from the 1960s, Rajesh Khanna


    from the 1970s, and Rishi Kapoor from the 1980s. In this fantasy world, Raj


    dances alongside actresses from contemporary Bollywood, masquerading


    as heroines from the past. Dance, once again, becomes Bollywood’s favored


    mode of articulating stardom and the unique characteristics of famous


    stars. In the extravagant production number “*Deewangi deewangi*” in *Om*


    *Shanti Om*, thirty- one stars from the Hindi film industry, who have no role


    otherwise in the film, make a “special appearance” for this song. Each of'
