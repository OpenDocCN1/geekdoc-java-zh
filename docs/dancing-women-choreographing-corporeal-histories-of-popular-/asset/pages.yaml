    Dancing Women


    During a period— the 1950s— when establishing hierarchies of taste be-


    tween classical and folk dance forms was of paramount importance to cul-


    tural institutions like the Sangeet Natak Akademi (which would canonize


    dance forms like *Odissi* only when they had demonstrated a long textual,


    Sanskritized lineage, and marginalized traditional *mahari* performers),


    dance historians like Vatsyayan frame this difference along gestural lines. She


    notes of *lokadharmi* conventions:


    While the classical dancers describe the animal or the bird through a series


    of movements and gestures, the folk dancers become the bird through one


    or two characteristic movements of the bird . . . the hands and the vast body


    of gesture language used in classical dance styles are practically absent in all


    tribal and folk dancing.^(52)


    Hindi film dance, flagrantly promiscuous in its borrowings and


    appropriations, equally mobilizes classical dance *mudras* (gestures) and folk


    dance and other movement vocabularies. For instance, in the “semi- classical”


    dance number, “*Bakad bam bam baaje damru*” from *Kathputli* (Amiya


    Chakrabarty, Nitin Bose, 1957), the *Bharatanatyam*- trained Vyjayanthimala


    dons two costumes— of a peacock and a village girl— to depict the two


    characters in the song, and appropriates gestural vocabularies from mul-


    tiple sources (see


    ![](img/d3101073a89f0747f7eca6e948673baf_87_0.png)


    video 01.09). This hybrid “semi- classical” style borrows


    movements and gestures from classical dance but renders them in a popular


    idiom by making them less strictly codified. In her dancing “double role”


    Vyjayanthimala, echoing Vatsyayan’s description of folk dance vocabulary,


    depicts the peacock through simulations of the bird’s actual movements, such


    as its forward- backward neck movement, the unfurling of the tail, and leaps


    and twirls in the air. The choreography blithely mashes this up with classical


    dance gestures such as the *mayura hasta mudra* (peacock hand gesture) and


    the *pralokitam drishti mudra* (eye gesture in which the eyeballs rapidly flit


    from side to side). Given the breadth of its address to a large constituency of


    viewers, Hindi cinema nimbly and ingeniously creates a seamless amalgam


    of various dance forms without adhering strictly to the conventions of any


    of these. So, while song- and- dance sequences often deploy classical dance


    gestures, especially when the dancer is a classical dance exponent within the


    diegesis, the rigorous correspondence between gestures and meaning that


    is mandated in post- revival Indian classical dance is not a feature of these


    hybrid film dance depictions. Rather, the style is recognized as “classical”'
