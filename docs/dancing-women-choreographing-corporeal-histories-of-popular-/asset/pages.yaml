    **Moving Legacies**


    Situating Azurie and Bose as co- choreographers of new mobilities in the


    1930s and 1940s alerts us to the material histories of dancing bodies and


    intersecting narratives of labor, resistance, fame, and erasure. While his-


    tories of performing women in the Indian subcontinent in the nineteenth


    and twentieth centuries often draw a linear trajectory of prominence and


    eventual decline of various constituencies, including *devadasi*s and *tawaif*s,


    Anglo- Indian and other Eurasian actresses, and oriental dancers, Azurie and


    Bose’s dancing bodies and figurations fold these performative repertoires


    upon each other in varied manifestations, producing a gestural genealogy


    that contains overt and subterranean traces of performing women before


    them. Azurie may be read, for instance, as a vestige of the Anglo- Indian,


    Eurasian heroine of the 1920s and early 1930s who disappeared with the ar-


    rival of the talkie. As a dancing woman featured only in production num-


    bers, like other mixed- race dancing women who followed in the 1940s and


    1950s— Cuckoo and Helen— she did not have significant speaking parts in


    films. But her dancing body was decidedly voluble, unleashing spectacular


    energies that altered the representational logics of Hindi cinema. If we trace


    the lineage of film dancers from Azurie (and Shehzadi Begum before her)


    to Cuckoo (whom Azurie trained) to Helen (trained by Cuckoo), we write


    a very different narrative of Bombay cinema and indeed of South Asian cul-


    tural modernities, a corporeal history produced through the interlinked net-


    work of these remarkable dancing girls.^(173)


    Similarly, while upper- caste Hindu actresses like Devika Rani and Bose


    were declared ambassadors of India, and their success with Indian films


    in English was seen as enhancing the “prestige of the Indian screen in the


    eyes of the foreigner,”^(174) reading the brahmin Bose and Caucasian Fearless


    Nadia alongside each other mobilizes a corporeal analysis of modern Indian


    womanhood in the late colonial period. Both actresses were pitched as


    representing Homi and J. B. H. Wadia’s conflicting visions of the nation-


    alist project.^(175) As an action heroine in the Wadia stunt films, Nadia be-


    came a popular nationalist icon, signifying Indian strength and power, while


    through her physical prowess in dance, Bose came to signify Indian “culture.”


    As modes of mobility, dance and action sequences serve as central devices


    in constructing the iconicity of Bose and Nadia’s star bodies as signifiers of


    national culture and power, respectively, allowing for contradictory and dis-


    continuous relationships between gender, race, and nationalism to prevail.'
