    **New Choreographies of Stardom and Fandom**


    Through song- and- dance intertextuality, Bollywood aims to create a so-


    matic nostalgia, where a repertoire of familiar gestures triggers a physical


    memory of past cultural rituals (such as dancing in the aisles, copying the


    trademark moves of your favorite stars, etc.). Dance is a key element in the


    film industry’s construction of stardom as well as fandom, where the history


    of Hindi cinema is reconstructed through a remembering of epochal dance


    moves. Bollywood has spawned a veritable industry around dance across


    various old and new media platforms. In addition to dancing in their films,


