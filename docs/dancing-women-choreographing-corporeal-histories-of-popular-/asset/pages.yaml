    remarked that he “felt that there he had at last found the solution to the


    tragedy of India’s dying dance.”^(51) He invited *Manipuri* dancers from Agartala


    to teach at Viswa- Bharati. However, to avoid criticism for introducing formal


    dance training in the curriculum, the university magazine expunged any


    mention of dance: “Two artistes have arrived at Shantiniketan from the court


    of the Maharaja of Tripura. The male students of the ashram are learning mu-


    sical exercise to the rhythm of Manipuri Khol.”^(52) The replacement of dance


    with physical exercise and the emphasis on male students’ training are revel-


    atory of the censure attending dance training or performance, especially by


    women. However, by 1925, Tagore invited the *Manipuri* dancers Nabakumar


    Singha and Baikunthanath Singha to Viswa- Bharati to teach female students,


    as he considered the dance form apt for women. The classes, however, were


    not publicized so that the residents of the town of Shantiniketan would not


    find out about them.^(53) Through the 1920s and 1930s, Tagore invited various


    folk and classical dance practitioners to Viswa- Bharati who introduced, for


    example, the “cymbal dance” from Saurashtra, *Garba* of Gujarat, *Kathakali*,


    *Kaikuttikali*, and *Kallammuli* from Kerala, the *Kandy* dance of Sri Lanka,


    Russian ballet, English ballroom dancing, and Bengali folk dances such as


    *Raye- Beshey* and Jaari.^(54) This eclectic inclusion of dance forms in the uni-


    versity curriculum was in keeping with Tagore’s desire to change the status


    of dance in India and reintroduce it to “respectable society”: “Dance is a part


    of performing arts courses in every country, and is respected as a medium


