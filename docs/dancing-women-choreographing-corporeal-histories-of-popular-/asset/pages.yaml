    Epilogue


    **Intermedial Histories of South Asian Cinema,**


    **Music, and Dance**


    Historical and theoretical accounts of South Asian cinema have been atten-


    tive to the relationship between film and visual art in terms of representa-


    tional logics, organization of the spectatorial gaze, and address to a mass


    audience.^(11) Similarly, film production and performance practices have


    mainly been traced back to theater, with the heterogeneous, omnibus form of


    the popular Indian film as well as its personnel (actors, directors, producers,


    etc.) seen as drawing from earlier theatrical traditions like *nautanki*, *jatra*,


    and the Parsi Theater, among others.^(12)  *Dancing Women* demonstrates how


    dance- and music- centered histories and theoretical frameworks expand our


    analysis of cinematic performance, spatial organization, and labor networks.


    I summarize here how the book’s focus on dance and music produces a


    corporeal, richly intermedial history of film in India in which performing


    women play a defining role.


    When we consider that *devadasi*s, *tawaif*s, and *baiji*s were the earliest


    film actresses, we relate the labor histories of these founding film personnel


    with the histories of Sanskritization of musical and dance forms, the caste


