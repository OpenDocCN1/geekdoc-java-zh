    geneous time of stimulation and engagement with the number that is quite


    separate from, and often more compelling than spectatorial investments in


    the narrative. A rather different example of the particular attraction of dance


    numbers is evident in the audience interest in the semi- classical film dance


    performances of actresses like Vyjayanthimala, Padmini, and Shobhana in


    Tamil, Hindi, and Malayalam cinema.^(40)


