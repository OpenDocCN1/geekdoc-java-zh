    # September 10, 1998: Srono Subdistrict


    Basir and Haeriyah were a married couple who lived in Pon village, Srono subdistrict.
    According to Haeriyah''s cousin, the couple had learnt sorcery from an older sorcerer
    in a neighbouring village; Haeriyah possessed sorcery that could kill people,
    whereas Basir''s could only kill animals such as water buffalo. I was told that
    Haeriyah had once approached a neighbour to buy a cattle-feeding trough that and
    when she refused the neighbour became sick. Another story was that Haeriyah was
    often seen baking at night—clear evidence of the possession of sorcery. Basir''s
    brother related that Haeriyah alone, and not Basir, was the problem. However,
    Basir''s nephew was not prepared to say whether his uncle was a sorcerer. Basir
    nevertheless was alleged to have been photographed at the police station. In addition,
    a policeman advised Basir''s brother to instruct Basir to leave Pait, though Basir
    was reluctant to follow this advice.


    Imron, one of the people jailed for the killing, told me:


    For years Haeriyah had been accused of sorcery. There were many people who were
    made sick, who confirmed that Haeriyah possessed sorcery. All the community said
    that. And in the end there was the butchery [pembantaian].


    This ''butchery'' was not the first measure that had been taken against the couple.
    Before 1998, they had been banished from Paiton, and then banished from another
