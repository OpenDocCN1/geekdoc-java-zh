    # HAM


    ''HAM'' was another factor contributing to a sense of lawlessness. In Indonesia
    the English concept of ''basic human rights'' usually translates as HAM. ''HAM''
    is an acronym for Hak (entitlement or right), Asasi (fundamental or basic), and
    Manusia (human). In East Java HAM was interpreted to effectively allow people
    to kill, with apparent impunity, local individuals identified as sorcerers. If
    we were to translate, we could interpret HAM in this context to mean something
    like ''factors that inhibit the police and army from apprehending people''.


    My informants perceived that during the outbreak the police and army were either
    unwilling or unable to respond. Indeed, they had prior information, the police
    had apparently not responded to earlier killings. According to local residents
    the reason for this was HAM. The word ''HAM'' obtained a different meaning for
    my informants than the elites in Jakarta. Though hard to define, the closest approximation
    I could arrive at was the term, used in Banyuwangi, meant forces which hold the
    state (aparat or pemerintahan or, indeed, negara) accountable to the people, but
    which also inhibit officials from reacting to unlawful or violent events. For
    example, fearing that in 1998, that they would be held accountable if they clamped
    down on the protesters, the police did not react to violent demonstrations against
    Chinese people. In other words, the police were restrained by their interpretation
    of HAM. If a policeman did not beat up detainee who was being held on charges,
    it might have been because he feared the power of HAM. From this perspective,
    during Reformasi the state feared that preventing local residents from carrying
    out their actions would be conceived of as a HAM violation. Hence, as a local
