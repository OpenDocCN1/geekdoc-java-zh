  md: '# INTRODUCTION


    All these ideas will be shown to be inaccurate. Yet, given the tenor of the reportage
    coming out of Indonesia and what many people might have been saying at the time,
    it is not surprising that these authors sincerely believed, as I had, that a conspiracy
    had occurred.


    Campbell and Connor (2000) suggested that the 1997 economic crisis triggered the
    outbreak of killings, that alleged sorcerers were actually healers, that the significance
    of the shrouded oath (a ritual to remove the innocence of alleged sorcerers) had
    been lost, and that the killings involved "large armed groups on the street coming
    in the dead of night neighbours away" (Campbell and Connor 2000:88). Finding fieldwork
    "not possible," the authors used "media reports" for "the empirical material they
    provide" (Campbell and Connor 2000:63). However, as will be demonstrated, media
    reporting the killings provided little reliable empirical material. Campbell and
    Connor are fundamentally mistaken to suppose (2000:62) that the killings should
    not be as an expression of traditional life, but rather as "intrinsic to the processes
    of modernity that are experienced so sharply and so ambivalently in East Java."
    Put simply, the evidence to demonstrate this does not provide solid grounds for
    reaching such a conclusion.


    In three publications Siegel (2006; 2001; 2002) similarly argued that the outbreak
    represented a break with the past. He maintained, without providing supporting
    evidence, that the killings were undertaken in the name of the "masses" (massa).
    I contradict this point in Chapter Six. Siegel also maintained that the killings
    were a response to a new kind of witchcraft. I could find little evidence to support
    this idea; indeed most evidence indicated a strong continuity in forms of witchcraft.


    My fieldwork for this book involved participating in and contributing to relatively
    formal events (such as rituals and prayers) as well as informal ones (such as
    playing soccer and volleyball and participating in midnight feasts). But mostly
    I focused on mundane things as giving gifts to people in my car, eating with other
    people at a roadside stall (warung), crowding around the television broadcasts
    of European soccer, chatting and smoking by the roadside, visiting healers (dukan)
    and meeting alleged ''sorcerers''—all in the course of everyday life. From this
    I observed how people alleged sorcerers, reacted in their presence, and felt about
    the killings.


    In order to conduct interviews in Banyuwangi, where the bulk of the killings of
    1998 occurred and where I, for that reason, myself, I bought a car, and for more
    than a year, every I attempted to interview people in Banyuwangi''s subdistricts.
    In practice, many obstacles arose. I was'
