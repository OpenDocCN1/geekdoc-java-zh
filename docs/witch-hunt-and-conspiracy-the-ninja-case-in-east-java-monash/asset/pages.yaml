    # Conclusion


    Understanding how ''sorcerers'' are identified is crucial to explaining the killings
    in 1998 because there are conflicting accounts regarding who was actually killed
    and why. Identification or accusation of sorcerers is not the basis of some sociological
    relation between different groups or political affiliation. Rather, the process
    of identification is rooted in the ongoing practices, practices, and social dynamics
    within groups. The basis of sorcery allegations I researched was an altercation
    or disagreement between family members, neighbours, or friends. If one of the
    parties subsequently suffered illness or misfortune, this could be deemed abnormal,
    implying that it resulted from sorcery. The divination of a dukun might serve
    to confirm the imputation in these cases. Following this, the news spreads through
    kin and kin eventually to the entire village. As the gossip spreads, consensus
    grows, and the idea becomes entrenched, or reinforced, through its transmission.
    Other factors that point to the alleged sorcerer''s guilt, such as reported sightings
    of naked, nocturnal, outdoor activities, might also be attributed to gossip. These
    are some of the social mechanisms through which ''sorcerers'' are identified and
    the background to the violent actions examined in this book.'
