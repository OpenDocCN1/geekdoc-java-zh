    # The Ninja Rumour


    For a short time, the most gripping conspiracy theory had been undertaken by ninjas,
    who were also targeting traditionalist Muslims and their leaders. During October
    1998, after the killings of ''sorcerers'' had subsided, this idea seems to have
    quickly spread throughout Banyuwangi, and then through East Java.


    The rumour that brigades of black-clad assassins were roaming around the countryside
    provoked an alarmed response. Terrified of ''ninjas'', local communities began
    posting guards in villages and cities around East Java. ''Ninjas'' were sought,
    caught, and even killed. In the recollections of my informants, even though there
    were fewer deaths in this period, as a source of general, widespread terror, these
    events eclipsed the killings of ''sorcerers'' such that the ''sorcerer'' killings
