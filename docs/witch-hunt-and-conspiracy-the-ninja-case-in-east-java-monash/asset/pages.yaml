  md: '# ACKNOWLEDGEMENTS


    The killings of sorcerers and subsequent ninja killings in 1998 Indonesia far
    eclipsed the number of victims in the Salem witch trials. In the district of Banyuwangi
    alone, around 100 sorcerers were killed and many more suffered. The Indonesian
    events have attracted a fraction of the academic attention devoted to Salem. Moreover,
    such scholarship as can be found often mislead. I have spent a sizable chunk of
    my working life trying to understand the violence that occurred. I conducted research
    at the desk (1999) and in the field (2000–2002), then I wrote a PhD thesis (2003–2008)
    on the topic. Beginning in 2006 and continuing up to the present, I have also
    published some findings. Revised versions of several of these publications are
    represented here. Sections from my articles ‘A din of whispers’ (Herriman 2009),
    ‘Governing the black arts’ (Herriman 2013b), and ‘Legislating against the supernatural’
    (Herriman 2013a) appear in different parts of this book. Also Chapter Two is based
    on ‘The Great Rumor Mill’ (Herriman 2010); Chapter Six on my article ‘Fear and
    Uncertainty’ (Herriman 2008); and Chapter Seven on proceedings of the 2008 Asian
    Studies Association of Australia (Herriman 2008). I have drawn together this previously
    published material with new writings to compile this book. I thank the various
    publishers for allowing me to publish these revised versions here.


    Convention demands that this kind of book be attributed to a single author’s name.
    However, it is composed of the support, ideas and experiences I have absorbed
    from others, prominent among them my father, Michael Herriman. Recently retired,
    his field was philosophy of education, but his passion for music, film, science,
    sport, antiques—in brief, human culture—was a feature of my early years. I observed
    my father’s interest and curiosity as well as respect and tolerance for other
    ways and cultures. I have tried to emulate this ever since. So, as a child, playing
    ‘Cowboys and Indians’, I always wanted to be an Indian’. In adolescence, he steered
    naive'
