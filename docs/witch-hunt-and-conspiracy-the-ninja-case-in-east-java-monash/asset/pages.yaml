    The analysis in the chapters, as well as the statistics in the website appendices,
    lead me to the findings summarised in the Conclusion. Local areas experience regime
    change and other ''national'' phenomena in ways particular to those areas. To
    understand the 1998 outbreak of violence in East Java, one must turn to local
    interpretations of human rights, the Reform Movement, and the state''s reactions
    to violence against sorcerers. Such an understanding runs counter to popular conspiracy
    theories and scholarly treatises regarding the outbreak of ''sorcerer'' and ''ninja''
    killings in Indonesia.'
