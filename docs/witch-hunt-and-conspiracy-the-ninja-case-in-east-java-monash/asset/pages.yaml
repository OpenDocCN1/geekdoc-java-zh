    # The Social Context of Sorcery Allegations and ‘Sorcerer’ Killings


    It is most commonly family, neighbours, and friends who are the perpetrators and
    also the victims of ‘sorcery’. Furthermore, although sometimes these people attempted
    to protect a sorcerer''s reputation and life, in most cases those who initially
    accused and subsequently killed the sorcerer were drawn from the same group. Relations
    among neighbours, family, and friends are not only the basis of communal life
    in rural Banyuwangi; they are also the basis for accusations, identifications,
    and killings.


    When these people in rural Banyuwangi talk about sorcery without referring to
    specific cases, they maintain that the effectiveness of a spell is not constrained
    by physical distance and, provided a person''s power (ilim) is less than that
    of the sorcerer, anyone, anywhere could be ensorelled. It is said, for instance,
    that a strand of hair or piece of clothing, even from a person the sorcerer did
    not know, would suffice for a sorcerer to cast a spell. However, contradicting
    the theoretical conception of a supernatural that is unimpeded by distance, there
    is a practical proximity to sorcery. In all the cases of alleged sorcery I encountered,
    the victim was always known to the ‘sorcerer’. In ‘sorcery’ and reactions to it
    almost always occur among neighbours, family, and friends.


