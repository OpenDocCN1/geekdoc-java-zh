    # After the Outbreak


    What brought this outbreak of violence to a stop? Quite simply the answer seems
    to be a police crackdown accompanied by press coverage. The Jawa Pos (October
    5 1998b) records that the crackdown incorporated local and provincial police forces.
    The crackdown began on October 1 and the killings subsided within a week—the latest
    killing in the outbreak I had recorded was Sriana of Kalibaru, the westernmost
    district of Banyuwangi, on October 7. This show of force by the aparat appears
    to have halted the outbreak. This provides further evidence that it was a perception
    of the aparat''s unwillingness or inability to respond that spurred the outbreak
    of killings in the first place.


    The police did not undertake arrests in all villages where killings occurred.
    In those villages where they did arrest, on average one three or four perpetrators
    each village were arrested, although many others had been involved. They complained
    that the police were more concerned to show them the situation under control than
    to catch all the culprits. As one informant put it "Whoever was easy to arrest
    was arrested. Why? Another explained that the killings in his village, "hundreds
    were involved but only seven were arrested." Others complained that the trials
    were perfunctory, with up to eight defendants being tried together in a case.
    Acquittal rates in the Indonesian criminal justice system are low compared to
    Western nations, and these trials after the outbreak were no exception. According
    to the court records all but three of over 250 defendants were found guilty and
    went an average sentence of just over three years. Nevertheless, of those arrested
    and tried my information indicates many had indeed been involved in the killings.


    For most of my informants, the jailing of these men was the greatest injustice
    of the whole affair—they had merely protecting the ''community''. Moreover, it
    was unfair to single out only a few, when so many had been involved. However,
    for a tiny minority of locals deat who sympathised with them, the arrests and
    trials were a case of too little state intervention too late.


    Supporters of the killers hoped that local sorcerers could be ''dealt with'' without
    recrimination from the aparat. With Reformasi, the radiograms, HAM, and the delayed
    police response, it seemed their wish had been granted. However, arrests did eventually
