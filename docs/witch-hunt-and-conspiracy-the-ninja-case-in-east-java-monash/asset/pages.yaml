  md: '# WITCH-HUNT CONSPIRACY


    sometimes ill, interviewees were sometimes not at home or at home but did not
    know about a killing, a driver or a research assistant could not be organised,
    the weather was inclement, and so on. Nevertheless, I eventually undertook over
    150 interviews.


    The most accurate record of the outbreak is a list of violence against ''sorcerers''
    '' which I obtained from the district government. It shows a total of ninety-nine
    killings in 1998: one killing in February; three in July; seven in August; peaking
    with eighty in September; before dropping back to eight in October. Using this
    record, I sampled at least one killing in every sub-district in which a killing
    occurred. From this sample, I conducted interviews with families of victims, onlookers
    and local officials.


    I developed this body of interviewees primarily through snowballing. Having interviews
    contacts suggested by one informant, I used these contacts to develop further
    contacts. The criterion for selection that I particular suspected was who had
    been present during attacks, either by being directly involved or by bystanders
    (although in practice the distinction seemed blurred). This meant conducting interviews
    with people jailed for killing ''sorcerers'', while in jail and after their release.
    I also interviewed family members of ''sorcerers'' who had been killed and local
    community leaders such as Islamic scholars, village officials and informal leaders.


    This information was complemented by newspaper reports in the two major Javanese
    dailies of the period—Jawa Pos and Surabaya Post. I have also used two reports
    from the traditionalist Islamic party (NU) which I have translated as ''Provisional
    Report'' (TPPNU 1998) and ''Research Findings'' (Lakpesdam-NU 1998) respectively.
    Additionally, I have used a report from the Justice Party (PK) (Partai Keeadilan
    1999).


    The aim of my research was to understand why people were killed. I thus focused
    on local informants'' understandings of events by spending my days them, rather
    than going to the courts, hospitals, and police stations scouring official records.
    Although it appears that some local communities managed to keep some killings
    secret, most were officially recorded and processed. Nevertheless, such records
    were often hard to obtain and some were inaccurate or non-existent.


    This book comprises eight chapters. Following this introduction, I describe nine
    representative case studies in Chapter One. These demonstrate the local dynamics
    of the killings in 1998. Specifically, neighbours, friends, and family members
    suspected one among them of being a sorcerer and then killed that person.'
