    Conspiracy theories regarding the outbreak of killings examined in this book were
    not limited to word-of-mouth gossip in villages on one hand and newspaper reports
    on the other. In urban areas I visited in Java, all the high-ranking people I
    met proposed conspiracy theories. In many Banyuwangi subdistrict town, for example,
    me the NU subdistrict leader. He witnessed the killing of Yasin in Kabat and told
    me that he had reported it to the police, but there had not been any investigation;
    “That’s why I say that sorcery has a political connection.” (He was mistaken—in
    fact a man had been arrested and jailed for Yasin’s killing.) Conspiracy theories
    spread internationally. Many scholars outside of Indonesia adapted elements of
    conspiracy theories in their depictions of the outbreak. It seems likely that
    outside of the region itself, without subsequent critical evaluation, the 1998
    killings of sorcerers in Banyuwangi would have gone down in the historical record
    as a conspiracy.


    In what follows, I evaluate these theories in light of my own research. As I did
    fieldwork outside Banyuwangi, I cannot comment on evidence of a conspiracy in
    other districts. However, most of the conspiracy theories discussed here refer
    in whole or in part to Banyuwangi, so the findings of my fieldwork may also be
    relevant to other districts.'
