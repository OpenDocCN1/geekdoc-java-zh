    # Adat


    Are the killings a form of adat? In its original use ''adat'' described those
    normative rules which were regarded as being distinct from religious law. Related
    closely to this original meaning, adat may refer to the customary practices which
    vary across Indonesia''s cultural groups. These include ritualistic, artistic,
    and legal elements. In a second, "more restricted sense," the term denotes "normative
    rules governing social life" (Benda-Beckmann 1984:34n). A third meaning is "codified
    normative rules with sanctions.


    Adat is usually transmitted orally or by example, but legal elements of adat have
    been recorded in writing. This process began when Dutch jurists recorded what
    they called ''adatrecht'' (adat law) (Hoeebel and Schiller 1948). The term ''adatrecht''
    itself was a Dutch invention and was intended to be used as the basis of a legal
    system to be applied to ''native'' Indonesians. Thus, this sense of adat is that
    of codified adat which has ''consequences in law'' or "legal consequence" (Vollenhoven
    1981:6). For clarity, the third sense will be referred to in this discussion as
    ''adat law''.


    Although the Dutch colonisers presumed they were recording adat law that accurately
    reflected local customs and mores, post-colonial scholars have questioned this
    presumption on a number of grounds.'
