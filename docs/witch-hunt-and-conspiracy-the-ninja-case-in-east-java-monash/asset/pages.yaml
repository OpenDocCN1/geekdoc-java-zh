    then

    fed back into the media. This local involvement helps explain the rumours

    the state or elite forces were behind the ninjas who were said to be

    attacking local residents. While in 1960s England, the media were

    “the major promoters of moral panics” against the lower classes (Cohen

    1980:xxii), in 1998 East Japan suspicion was directed ‘upwards’. This great

    rumour mill was generated by conjunction of the ‘wind’ of local gossip and

    the turning of the printing press.


    Both outbreaks of killings—of alleged sorcerers and ninjas—were

    with larger-scale dynamics of Reformasi. Include the decrease in

    centralised control which led to local officials increasingly auto-

    nonomously. And where local officials attempted to follow directives from

    to stop killings, they were forestalled by demonstrations. Increasing

    press freedom allowed for conspiracy theories to flourish. All this

    occurred in a time of apparent uncertainty and rumour, and an explosion

    of violence.


    Understanding the events of 1998, related in this book, is important. If

    we are to work against the victimisation of witches and sorcerers we must

    first understand the particular origins and nature of the beliefs that lead

    to this victimisation. We must try to understand how these beliefs inform

    actions within the different social environments we are examining. And

    must, in the process, avoid confidently imposing analyses—however

    sisticated—based on data or information gained from metropolitan

    sources which may in fact reflect, in part, our own common metropolitan

    interests, preoccupations and patterns of thinking.


    The Banyuwangi killings of 1998 continue to inform the literature on

    witch and sorcerer victimisation in Indonesia and world. The out-

    break did not result from changing cultural understandings of ‘sorcerers’ or

    ‘the people’, from changes and tensions associated with modernity, or

    one of the many conspiracy theories. Archival and long-term field research

    demonstrates the primarily local origins of this violence towards ‘sorcerers''

    ’ninjas’. Reformasi was understood very differently by politicised students

    in Jakarta, other urban people who experienced economic grievances,


    158'
