    courts acted as a court of appeal. *Adat*, or a codified interpretation of it,
    was adopted by colonists as a model for the justice system for natives. As indicated
    in the discussion on *adat* about, some systems of customary law prescribed the
    killing or trial by ordeal of ''sorcerers''. The justification of violent behaviour
    towards sorcerers in adat systems was as a "necessary reaction to acts of magic
    that were threatening to society, and in accordance with traditional moral and
    normative standards" (Slaats and Portier 1993:19).


    Colonial (native) law, it seemed, might allow for the killing of sorcerers. However,
    as Slaats and Portier wrote, Dutch colonial judges were instructed to respect
    local subjects as fathers would treat their family. Under these instructions,
    judges were granted a prerogative to use the ''repugnancy'' clause to over local
    law in the cases where it would conflict with their pastoral duties. This clause
    implied the "non-applicability of *adat* law if its application would be contrary
    to generally accepted human values" (Slaats and Portier 1993:140-141). Although
    it was meant to be applied only in exceptional circumstances, the repugnancy clause
    came to be repeatedly applied. In places where the Penal Code was in force, Slaats
    and Portier (1993:19) write:


    It was not the practitioner of magic who was on trial but those who violently
    turned against him, thereby infringing the law. They were charged with an offence
    under the Penal Code ... most judges, being Dutch, with Western moral values and
    trained in Western law, loathed what they considered the inhuman and irrational
    assaults on innocent victims.


    In short, recognising that *adat* law might have resulted in the killing of ''sorcerers''
    being condemned within the colony''s legal system, this possibility was not realised
    because of the repugnancy clause.²¹


