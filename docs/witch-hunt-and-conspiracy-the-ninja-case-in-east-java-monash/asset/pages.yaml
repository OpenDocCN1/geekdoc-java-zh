    # Modern State Law


    After Independence, the officially plural legal system of the colonial government
    was felt by many to be in opposition to nationalist aspirations. One of the biggest
    changes from colonial state law to the post-colonial or independent state law
    was therefore the attempt to provide a unitary system of justice. The general
    opinion is that, aside from this, the legal system in practice has not undergone
    significant changes (Lev 1985:69; Tholen 1987:55–56). In other words, the current
    criminal code in Indonesia is largely based on Dutch law. Nevertheless, as Lindsey
    (1999:1) points out, “It would be wrong … to assume that Indonesia has simply
    adopted the Dutch legal system”


    Contemporary criminal legislation in Indonesia deals with magic only indirectly.
    As Slaats and Portier explain:


    > if the relationship between magic and law in Indonesia were discussed in terms
    of the formal system of state law, the story would be rather short, because there
    are practically no regulations concerning magic. There are no direct references
    to magic and sorcery in either the colonial legislation, or in the present-day
    Indonesian codes of law, and there are only a few indirect ones (1993, 138).


    Two pieces of legislation inherited from the colonial codes are directed against
    those who sell, teach, or offer powers or objects that they purport or allege
    to be magic. Article 545 of the Criminal Code makes fortune-telling and dream-divining
