  md: '# INTRODUCTION


    Chapter Two focuses on an incident that immediately followed the

    outbreak of killings. Rumours had spread throughout East Java that evil

    conspirators or ''ninjas'' had been behind the killings of ''sorcerers'' and that

    these conspirators or ninjas were not on persecuting the traditionalist

    Muslim majority. Although there is no evidence to suggest that such conspirat-

    ators existed, local residents established roadside guard posts and vigilantly

    wited for, discovered, attacked, and sometimes killed ''ninjas''.


    Then the following chapters are devoted to understanding these cases

    in the larger contexts of the historical period, magic beliefs, local ideas of

    justice, and the influence of national-level events. Hence, Chapter Three is

    an overview of Indonesia''s Reform Movement, the national historical context

    of the outbreak. I particularly focus on violent phenomena in Indonesia

    during this period. In Chapter Four I examine compelling beliefs in magic

    andcery. In Chapter Five I make that the killing of ''sorcerers''

    in Banyuwangi is understood within the social environment as a form of

    ''community justice''—asmuch as the majority of local residents enacted

    the own form of ''justice''. Chapter Six provides a general overview of the

    outbreak of killings in 1998 and an account of the enabling local and national

    dynamics. Crucially, local residents interpreted the Reform Movement as

    a weakening of state power, and arising from that an opportunity to kill

    ''sorcerers''.


    Having situated the killings in terms of these larger contexts, I

    engage with competing explanations of the killings. In Chapter Seven I show

    t several putative explanatory theories for the killings have not come to

    grips with the situation in Banyuwangi and consequently have no solid basis

    in evidence. In Chapter Eight I reject notions of the killings of ''sorcerers''

    as a conspiracy, pursued especially by East Java''s two main newspapers,

    Surabaya Post and Jwa Pos, and the fact-finding missions of various other

    organisations. Intriguingly, it must be acknowledged however that the idea

    of a conspiracy was compelling: local residents I spoke to still believed

    in a conspiracy even though they may have undertaken a killing in their own

    village and might have been expected to know better.


    On the associated website of this book are several appendices which

    provide further statistics regarding the 1998 killings. My focus of research

    was mostly qualitative and therefore these appendices are not precise.

    However, the data I gathered in the process of research serve as a starting

    point for further research into exactly how many were killed or attacked, the

    location and the date.'
