    # Conclusion


    The killings related in this chapter point to the local dynamics of the killings.
    In all cases neighbours, family, and / or friends played a role in identifying
    and killing the suspect. And in all cases, except that of Hasan, the killers received
    widespread support for their actions. Even in the exceptional case of Hasan it
    seems some sections of the community supported the action. The killings of ''sorcerers''
    in Banyuwangi stopped rather abruptly in early October, to be succeeded or, or
    in the memories of informants at least, superseded, by the Ninja Fear.'
