    # Summary


    Violence against ''sorcerers'' is part of normal life in Banyuwangi. The increase
    in the frequency of such violence in 1998 resulted from a perception of increased
    lawlessness and opportunity among local residents who were emboldened by their
    understandings of several supra-local factors, particularly Reformasi, the radiograms,
    and HAM.


    The Indonesian criminal code does not recognise the existence of sorcerers, but
    local residents ''know they exist and perceive them to be a real danger. For students
    in Jakarta, Reformasi might have been a political reform movement, while for local
    residents in Banyuwangi Reformasi meant a evidence that a slackening of state
    control, a time for mass action and a time to right the wrongs that had supposedly
    been committed by the ''sorcerers''. For the state, the radiograms were an attempt
    to protect alleged sorcerers, while for local residents they were evidence that
    the aparat was finally getting tough on sorcerers. If the police had initially
    released some those those of the killings of the ''sorcerers'' because they were
    not directly involved, the release signaled to local residents that the aparat
    had been overwhelmed by the demonstrators and had capitulated. Furthermore, the
