    Informants rarely attempted to explain why sorcerers should be killed. This is
    because the need to kill ''sorcerers'' is so obvious to most informants that,
    to quote Douglas (2008:76), "its rightness needs no explaining". Informants managed
    to convey this point in different ways. The community, said one:


    does not like sorcery, because sorcery gives rise to effects which are not good
    for the community. Among other things, a sudden sickness occurs within people
    who have been affected by sorcery.


    Another explained that a ''sorcerer'' had been ''hanged because [the community]
    was irritated.'' There were utilitarian explanations, citing the need to take
    one life in order to save others: "What we have is the ''bus system'', the ''bus
    driver principle''. Rather than many of the victims being the passengers, it is
    better that just one person is finished off, killed." Another analogy is in terms
    of a disease. An informant explained that his local community had taken action
    against an alleged sorcerer prior to the 1998 killings: "because sorcerers are
    considered to be a blight on this village. Emotions were running high because
    it is considered to be considered to be eradicating a germ (membasmi kuman). If
    we let it go, all the more people would die."



    However, most informants did not explore these philosophical avenues to justify
    or explain killings, and it would be misleading to get caught up in these idiomatic
