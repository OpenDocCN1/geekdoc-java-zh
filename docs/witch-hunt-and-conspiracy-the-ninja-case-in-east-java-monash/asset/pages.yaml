  md: '# WITCH-HUNT and CONSPIRACY


    Even Kustari was aware that he had become a target. He carried a knife around
    him for protection. He was advised to leave the village. But Kustari didn''t want
    to leave. If he left, other people would take that as a sign that he had killed
    Saman.


    It was organised more or less spontaneously. Ten men met on a Monday night in
    September, 1998. They gathered in the middle of the village at the intersection
    of the two roads which lead out of the village. They searched for Kustari, but
    could not find him, so they decided to delay until the next night.


    The next night, a couple of men could not be present. But that was all right another
    couple could come. This time they would get him.


    They were a mixed group. A few were farm labourers. Another was a teenager. One
    was there Buhari and Salimi offered him money. The rest were hoodlings. One was
    a thief who had returned from Bali. Two brothers who had reputations as tough
    drinkers were also there. And there was a motorcycle thief who was visiting home
    and needed to lend a hand. They all hated sorcerers. They all hated Kustari. They
    had a drink to stiffen their resoke, so that they could "forget themselves". One
    folded a sarong around his head so only his eyes were showing, "like a ninja."


    First, they went to a watch house at the corner of the village. Here they enlisted
    two boys from a neighbouring house to find Kustari. The two boys returned with
    the information that Kustari was sitting at the front of Sairi''s watching TV
    with his wife.


    The killers headed off into the darkness and the drizzle. One threw a stone at
    each house on the way. It was a sign that they should turn off their lights. One
    by one the lights went off. The group crept through the cemetery and around the
    side of the house. For the last few metres of their approach they crawled along
    the ground.


    One of the attackers grabbed Kustari and dragged him several metres towards the
    road. Others helped him to the ground. Another smashed at his eyes with a wooden
    pole. The masked beat Kustari until his mask and clothes were shattered with blood.
    They left him for dead, and went separate their ways.


    Word quickly spread that Kustari was dead. Some local men began voluntarily collecting
    money for the killers. The police arrived from the nearest police station about
    an hour later, around 9:30. It turned out Kustari was not, in fact, but was seriously
    wounded. Twice on the way to hospital the car'
