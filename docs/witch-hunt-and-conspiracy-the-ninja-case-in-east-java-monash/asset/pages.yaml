  md: '# ABOUT THE AUTHOR


    Nicholas Herriman is Senior Lecturer in Anthropology at La Trobe University. His
    podcasts on iTunes U, including the Audible Anthropologist and Witch-hunts and
    Persecution, have tens of thousands of listeners. He also regularly contributes
    opinion pieces to the mainstream media. Based on more than one year''s fieldwork,
    he has written a number of significant and award-winning publications on East
    Java, including his PhD dissertation—the Australian Anthropological Society''s
    “Best Thesis” in 2008. This book represents the culmination of researching witch-hunts
    for more than a decade.'
