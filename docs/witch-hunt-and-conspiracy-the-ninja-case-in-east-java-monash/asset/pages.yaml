    # # Accusations of Sorcery


    Identification of sorcerers occurs mostly through secretive gossip. Direct accusation
    is rare. One form of direct accusation is by yelling or screaming at ''sorcerers''
    during attacks and banishments. Accusing someone of sorcery is analogous to the
    slander of calling someone a paedophile in contemporary European cultures, and
    is subject to a more violent response. As described in Chapter One, a young man
    who accused Salimun of Singojurauh had his arm hacked by Salimun. In retribution
    for hacking the accuser''s arm, and for his black magic, Salimun was immediately
    killed by a large group led by the accuser''s father. Aside from yelling during
    an attack on a ''sorcerer'' and the requesting of water, I have only a few records
    of direct accusation.


    An indirect accusation is often made via a request for help. For instance, a person
    suffering an ''abnormal'' illness requested water from the ''sorcerer'' Hadis
    to be cured, the person was also insinuating that Hadis had caused the illness.
    The person could pretend to believe that Hadis was not a ''sorcerer'' but, rather,
    had sufficient white power to cure. This may explain why ''sorcerers'' agree to
    cure—they do so on the proviso that they are viewed as only having white magic,
    or perhaps to help defeat a volatile situation. But what is clear is when a ''sorcerer''
    acquiesces, other residents will then see this as a case of the sorcerer treating
    their victim.


    In fact, in several cases in which ''sorcerers'' have acquiesced this has served
    to condemn them. At the insistence of a large crowd in the Malang district an
