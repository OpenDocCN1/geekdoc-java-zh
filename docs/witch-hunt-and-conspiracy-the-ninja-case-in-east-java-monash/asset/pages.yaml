  md: '# INTRODUCTION


    Cases of accusations and actions against alleged witches as well as sorcerers
    have been recorded in different societies in Indonesia. Historical evidence of
    this includes "one of the oldest surviving legal texts of Southeast Asia" (Hoadley
    and Hooker 1981:1). The Agama—a Javanese text produced in the sixteenth century—proscribes
    sorcery (Hoadley and Hooker 1981:206–207). Additionally, a diary of a soldier
    in a late-eighteenth century Javanese court records a sorcery accusation (Kumar
    1980:72). However, not much can be concluded on the basis of these sources.


    Rules recorded from various places in Indonesia in the *adat* (customary) law
    document retaliatory actions to be undertaken against a sorcerer. Dutch scholarly
    accounts of the 1890s reported that:


    +   The Barbar archipelago (sic., Barbar Islands), the populace might club to
    death a wizard and the full-grown members of his family. Such an act would have
    followed the discovery, by sorcery, that the wizard had brought about the sickness
    ...of some other person ... Among Galela and Tobelese ... Sorcerers were killed
    and their bodies were cast into the ocean (Burns 1999:153).


    In the Netherlands New Guinea, it was reported that a female sorcerer:


    will be subjected to a trial by ordeal. Usually she participates voluntarily.
    She will be taken to a particular spot and made to drink a quantity of the sap
    of some kind of lianas [woody climbing plant of tropical forests]. Then she is
    made to walk and dance. Most of those submitted to such a treatment will start
    vomiting after a while, which is proof of guilt. She will die eventually or be
    killed. Those who do not vomit or die are considered to be innocent (Slaats and
    Portier 1993:140).


    Several authors have also noted sporadic killings of ''sorcerers'' in Java and
    other islands in the 1980s and 1990s. In East Java, Wessing (1996:272n) recorded
    thirty "reports of suspected sorcerers being killed or injured" between August
    1990 and February 1993. In Java and other islands Nitibaskara (2001:58–153) documented
    over seventy cases in newspaper reports from the 1980s. These attacks seem to
    have occurred intermittently across geographically dispersed areas.


    By contrast, at certain times killings occur with such frequency in a restricted
    geographical area that could be described as ''outbreaks''. The Banyuwangi outbreak
    of 1998 discussed in this book is apparently not unique. Between fifty-five and
    150 assigned sorcerers were killed in West Java between January and June 1999
    (Munir 2001:22; Ricklefs 2001:411);'
  merge: -1
