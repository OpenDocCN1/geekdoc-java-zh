  md: '# WITCH-HUNT CONSPIRACY


    Sidel 2006:142), with thirty-seven victims in Ciamis (Sidel 2006:246n.). Subsequently,
    in November 1999–January 2000 a small outbreak resulted in nine fatalities (Herriman
    2006b). Again in West Java, twenty villagers accused of being witch doctors were
    killed in attacks in Ciamis between July and October (BBC News 2000).


    Sidel (2006:142) suggested that the outbreaks following Soeharto’s resignation
    in 1998 are “a new form of large-scale collective violence”. However, several
    outbreaks of violence pre-date 1998. Victims included twenty putative survivors
    and criminals in Jember in 1981 (Barker 1998:17n), who allegedly used evil spirits
    in North Sumatra in 1987–1988 (Slaats and Portier 1993:141-2), and large numbers
    of ‘sorcerers’ in the mid-1960s and early-1980s in Banyuwangi, noted by Beatty
    (1999:77) and remembered by older people in that area. Such evidence suggests
    that in the years since Independence killings of ‘sorcerers’ have been a recurring
    phenomenon in Indonesian societies.


    However, little detailed study of these outbreaks has been undertaken. Scholarship
    on the 1998 killings has focused variously on the victims, the perpetrators, and
    the larger outside of a conspiracy supposedly underpinning these.^1$ Barker (1998:40)
    and O’Rourke (2002:172) note that the victims came from the traditionalist Muslim
    population. Barker (1998:41), Beatty (1999:259) and Hefner (2000:210) claim more
    specifically that those targeted were guru ngaji (religious preachers). Comparably,
    Barton (2002:257), Cribb (2000a:193; 2000b:191), Van Dijk (2001:161), O’Rourke
    (2002:168), and Thufail (2005) observe the victims included kiai (religious scholars
    and leaders).


    According to Brown (1998:98) the perpetrators were “local oknum [mysterious agents]”.
    It has also been claimed the perpetrators were brought from other areas. Hefner
    (2000:210) wrote that they were “vigilantes” who were “trucked to remote locales”.
    For Campbell and Connor (2000:88) they were “armed groups”, Cribb (2000a:193),
    Barker (1998:40–41), Thufail (2005:153), and Beatty (1999:259) stated that the
    perpetrators were known as ninjas.


    Some scholars, such as Thufail (2005), have speculated on a larger political conspiracy
    lying behind the killings. For Cribb (2000a:195–196) it might have been the army
    preparing for a return to power. And Hefner (2000:193–210) has written that it
    was an elite attempt to stop a political alliance between traditionalist Muslim
    and nationalist political forces.


    > 1 For more detail see Herriman (2006b:361–64), from which the following section,
    as well as a section in Herriman (2007:68–69), has been adapted.'
