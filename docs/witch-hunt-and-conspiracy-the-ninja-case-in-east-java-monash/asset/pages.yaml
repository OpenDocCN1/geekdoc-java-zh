- img_proc: true
  md: 'the rural people in Banyuwangi, who were suddenly freer, in their own minds
    at least, to act on their own interpretations of right and wrong.


    There are, of course, limitations in the scope of research I conducted Although
    there are indications of dozens of killings in other districts in East Java and
    Madura in 1998, I have only been concerned with killings in Banyuwangi. Nevertheless,
    I did spend short time researching killings in Jember, and similar patterns to
    Banyuwangi emerged from this data. Newspaper reports about these other districts
    also reflected this higher than usual frequency of killing. My focus was on killings,
    not on stoning of rooves, banishments, shrouded oaths and other kinds of anti-sorcerer
    actions.


    There were also limitations in my access to data. My access to archives was hampered
    by red tape. Obtaining a completely accurate number of victims of killings proved
    impossible. My research on the ninja phenomenon is based on a significant extent
    on hearsay and newspaper reports, which were unreliable but clearly played an
    important role in ‘fanning the fires’. No doubt the findings on the ninja phenomenon
    would be improved by interviewing perpetrators and living victims of this violence.
    These limitations clearly indicate where further research is vital.


    Anthropological research has indicated that in many societies it is usually an
    ‘insider—someone who is your family or clan or village, your neighbour, or your
    friend’—who is suspected as a witch or sorcerer (Herriman 2009). In some societies,
    actions against such a person can be formalised in trials or rituals (Evans-Pritchard
    1937). In many cases, with the suspicion about the sorcerer having simmered for
    time, the retributive actions became ‘approved’ by the community-at-large based
    on implicit principles of justice, and then erupted into murder in a more-or-less
    spontaneous fashion. Moreover, at times these actions can become so frequent that
    the terms ‘outbreak’ or ‘witch-craze’ or a similar term could be applied. To the
    extent that this is the case, similarities with the 1998 outbreak in Banyuwangi
    might be drawn. In other words, in other parts of the world domestic or local
    relationships may also serve to explain outbreaks of victimisation against witches
    and sorcerers.


    The 1998 outbreak in Banyuwangi shocked journalists and academics both nationally
    and internationally. The ‘grizzly murders appeared like a throwback to the witch
    crazes of Europe—an anachronism in the modern world. Struggling to understand
    it, they turned to conspiracy theories to explain what they perceived to be an
    anomaly. Seen from the perspective of villagers in Banyuwangi, killing the local
    ‘sorcerer’ meant something different. 1998 provided the opportunity to rid themselves
    and the village'
