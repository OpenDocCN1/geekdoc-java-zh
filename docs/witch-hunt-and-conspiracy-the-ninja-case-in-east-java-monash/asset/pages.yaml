    # Ways Suspected Sorcerers Can Protect Themselves


    There are only two common procedures alleged sorcerers might undertake when they
    are aware of the rumours that are circulating about them. One is to undergo a
    ritual death known as the shrouded oath (sumpah pocong). This is well known, seldom
    practiced, throughout Banyuwangi and in other places of East Java. I only come
    across sporadic first-hand accounts of this ritual. The shrouded oath was explained
    to me by an informant as follows: With a large number of local witnesses it “is
    usually undertaken in a local mosque after the religious duties of Friday prayers,
    attended by community and religious leaders, and sometimes by district leaders
    as well.” Like a corpse the alleged sorcerer is wrapped in a white shroud. The
    Koran is raised above the ''sorcerer''s head, as is the practice, for example,
    when administering the Indonesian presidential oath of office. The ritual is partly
    punitive—the ''sorcer'' swear to their innocence, stating that if they are lying
    they will suffer in some way, or explicitly stating that they are prepared to
    die. The idea is that if sorcerers lie, or continue to practice sorcery, contrary
    to their oath, they will die. This trial by ordeal is also prophetic—informants
    think it can establish the guilt or innocence of a sorcerer.


