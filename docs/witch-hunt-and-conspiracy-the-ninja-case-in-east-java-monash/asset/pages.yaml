    This is because among several pieces of legislation in the criminal code, none
    are appropriate for hauling sorcerers (pelaku tukang santet) into court.


    In order to address this problem, a provision against sorcery and witchcraft has
    been proposed and a draft included among hundreds of other provisions in a Draft
    Criminal Code produced under state auspices.


    Since 1981, attempts to reform Indonesia''s Criminal Code have resulted in various
    drafts, including those of 1993, 2005, and 2008 (Blackwood 2007:301). Yet, after
    more than three decades and various revisions the Draft Criminal Code has still
    not been adopted. Revisions are currently the responsibility of Indonesia''s elected
    legislative assembly, the National Representative Council (DPR), comprising over
    500 members. These members are divided into eleven cross-party commissions, each
    delegated with different tasks. With a brief that incorporates judicial matters,
    Commission III (Komisi III) is currently responsible for preparing the Draft Criminal
    Code.


