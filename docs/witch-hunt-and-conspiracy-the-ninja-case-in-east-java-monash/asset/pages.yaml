  md: '# NOTES ON STYLE AND SPELLING


    Pseudonyms have been used for places and names where the information might be
    incriminating. In my transcriptions of interviews words were lost, my informants
    were ungrammatical and awkward structures, the ''train of thought'' changed halfway
    through a sentence, and so on. In order to minimise my role in interpreting or
    skewing data, I have translated interviews as faithfully to the error-ridden original
    as possible—although this often lacks rhetorical grace. I indent longer quotations,
    use double quotation marks for shorter quotations, and single quotation marks
    for quotations within quotations.


    For modern Osing language, there are two spelling systems, following the Javanese.
    The most consistent, but less popular, renders the English terms ''hamlet had''
    and ''no'' as ''kamituwa'' and ''using'', for example. The more popular, but less
    consistent, renders the terms ''kamituwwo'', ''osing''. The latter spelling system
    will be used here.


    In spelling Indonesian personal names, I have attempted to accord with the most
    common usage, and I have opted for ''Soekarno'' and ''Ma''oed'', for example,
    though when quoting others I follow the spelling they have used. For bibliographic
    purposes, the last name of the author will be used in the alphabetical listing.


    For convenience, the word ''outbreak'' is used to describe the increased frequency
    of killings in 1998, though I do not wish to imply these events were in any way
    akin to a disease. To refer to whom I interviewed or who helped me in my research
    I used the word ''informant'' instead of ''participant''. This is to avoid confusion
    with ''participant'' in the sense of someone who took a part in killing. Notwithstanding,
    I also hope to avoid the negative connotation of ''informant''. By the word ''sorcerer'',
    I refer to one who has learned black magic abilities. Accordingly, I use the verb
    ''ensor'' to refer to the sorcerer''s use of magic. This contrasts with the word
    ''witch'', by which I refer to one who has inherent black magic abilities, and
    the verb ''bewitch'', which I use to refer to the witch''s use of black magic.'
