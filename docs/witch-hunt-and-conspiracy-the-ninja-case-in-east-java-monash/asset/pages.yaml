  md: '# # WITCH-HUNT AND CONSPIRACY


    # ## THE ‘NINJA CASE’ IN EAST JAVA


    # ### NICHOLAS HERRIMAN


    In far-east Java, Indonesia, villagers are sometimes killed for being sorcerers.
    In 1998 this occasional form of violence grew into a sudden storm, with more than
    100 deaths. In the midst of this killing, a rumour spread that it was being carried
    out by trained ninjas. Locals responded by establishing roadside guard posts and
    waiting vigilantly for such ninjas to appear. More deaths, this time of ‘ninjas’,
    followed.


    There have been many different explanations for this outbreak of violence, but
    each had advanced the view that underpinning it were tensions linked to wider
    social, political or religious fault lines within Indonesian society. Nicholas
    Herriman has discovered, however, through his immersing himself within the local
    communities involved, that the wellsprings of this violence were entirely different
    from what has been theorised. Overwhelmingly, it was particular local beliefs,
    customs and social dynamics that were played out, within a larger environment
    of Indonesian government unrest felt only remotely.


    This book clarifies what happened in East Java in 1998, illuminates, in the process,
    the culture of the people of this area, and suggests further how, without local
    knowledge, analysts of and commentators on Indonesia can portray this part of
    the world in ways which ultimately reflect, unhelpfully, their own interests and
    occupations.


    ![](img/81d5d153fe1d2603c90411a7801b1d09_211_0.png)'
