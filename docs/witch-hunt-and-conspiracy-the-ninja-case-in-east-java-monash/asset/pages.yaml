    # # Religious Tension (Sidel)


    Sidel (2006) is a major contributor to the study of violence in this period and
    has devoted several pages to the 1998 outbreak. While he does not endorse conspiracy
    theories, there is a misconception in his account. Sidel explained the Banyuwangi
    outbreak in terms of topography—namely "upland frontier zones" (Sidel 2006:148),
    which are located between areas where traditionalist Muslim beliefs predominate
    and areas where pre-Islamic beliefs predominate (Sidel 2006:146–153). He characterised
    the frontiers as "areas of religious tension" (Sidel 2006:146) and explained the
    killings in terms of this tension.


    Most of the killings occurred where the terrain flattens out on the rice plains,
    and in locations which were closer to the beaches than any uplands. Even if we
    accept Sidel''s statement that there is great religious diversity, characterizing
    Banyuwangi as an "area of religious tension" seems difficult to sustain. I saw
    no evidence of this tension between religions—for instance, even a small Hindu
    village was located next to my fieldwork where. Indeed, in one of the villages
    where Hindus and Muslims lived side-by-side, I heard of Muslim and Hindu neighbours
    attending some of each other''s rituals. Within Islam, there had been perennial
    between different varieties, but this had no significant bearing on the killing
    of ‘sorcerers’. There was, for example, no killing in the village of Bayu itself,
    famous in the studies of Beatty (1999) as a place of tension between animistic
    and puritanical strains of Islam.


    Linking the area of diversity to the killings poses a further problem. Religious
    tension does not help explain the means of identification of ‘sorcerers’ or the
    patterns of killings. In most villages where killings occurred, local residents
    predominantly adhered to a traditionalist form of Islam. In only a single case
    that I researched was religious diversity clearly apparent. This was the village
    of Tegaldimo, located about as far from the mountains as one can be in Banyuwangi.
    On this limestone plain in the south, Paiman and Jamirah were killed in July 1998.
    Both Hindu and Muslims reside in this village, and both Hindus and Muslims united
    in the killing of Paiman and Jamirah; this may not have been known to Sidel. The
    identification of sorcerers and the patterns of killing were the same as in other
    areas where little religious diversity existed. Relating topography, diversity
    of religious outlooks, and resultant tension with the killings is untenable.'
