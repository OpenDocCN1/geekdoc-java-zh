  md: '# INTRODUCTION


    Nestled between an outcrop of volcanic mountains and the Bali Straits lies Banyuwangi,
    the easternmost district of Java. Rural Banyuwangi supports what could be loosely
    called a peasant society. The main ethnic groups are the Osing (indigenous to
    the area), Madurese and Javanese (who have migrated). These groups tend to live
    separately: the Osing in rice growing areas, Madurese in fishing villages, and
    Javanese near plantations. However, little tension or acrimony exists between
    ethnicities. All share a belief in magic and sorcery. Local residents reconcile
    Islam, the predominant religion, with the existence of magic by reasoning that
    magic and sorcery occur only by God''s leave. In every village I researched, the
    inhabitants I spoke to reported that several other local residents were sorcerers.


    In 1998 after the killing of around a hundred such ''sorcerers'' in Banyuwangi,
    with a number of killings in near East Javanese districts as well, people identified
    as ''ninjas'' were targeted throughout East Java as the perpetrators of these
    killings. This book presents new information based on more than a year''s research
    (2001–2002) and interviews, conducted while amongst killers and families of victims
    of the outbreak.


    By the time I conducted research, gone were the tufts of smoke from the warm embers
    of a ''sorcerer''s'' scorched house, the blood dribbling from a disfigured cranium,
    or the panting breath and beads of sweat from the accused man escaping his home
    village. But most of the actors or their relatives and witnesses were still *in
    situ*, and their memories and accounts were still fresh. As I write more a decade
    later, it remains crucial to learn from this outbreak because it provides a rare
    glimpse into how those involved such an event, and how victimisation of sorcerers
    still occurs. Insights from this event also help us to understand Indonesia''s
    Reform Movement, *Reformasi*, and give a local perspective on and context to the
    violence that accompanied it. Most importantly, this story rectifies misunderstandings
    of the 1998 outbreak itself—including the idea that the outbreak resulted from
    an elite conspiracy.'
