    # Community Justice


    Evidence suggests that neither adat nor state law are relevant for understanding
    motivations for or justifications of these 1998 killings. The killing of a sorcerer
    is not considered to be a breach of the social code. Far from showing compunction,
    the killers were proved of their act. They appeared to think that aside from pointing
    to the fact that the victim was a ''sorcerer'' the killings did not require any
    further justification. In order to understand the killings, analysis needs to
    turn to local justifications.'
