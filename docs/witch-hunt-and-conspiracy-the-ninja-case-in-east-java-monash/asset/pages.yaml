  md: '# FOREWORD


    I found something quite different after spending some time in Banyuwangi.

    Residing in a village where killings had occurred, given the pseudonym Tegalgargaring
    here, I undertook ethnographic research on the origins of the violence. I observed
    and participated in the daily lives of the killers, the families of the victims,
    and other local people. I also had the opportunity to interview these people in
    villages all over Banyuwangi District. It soon became apparent the entire framework
    I had brought with was wrong. The killings were best understood as the product
    of local residents grouping together to kill one among whom they believed to be
    a ''sorcerer'', in the context of the state''s being unable to stop this.


    Although I expected to find a conspiracy, the local dynamics I uncovered were
    in some ways more interesting. Local residents ''raided'' the village offices
    in order to kill ''sorcerers'' protected inside, or to free killers of ''sorcerers''.
    Local officials supported killers of ''sorcerers'' and local residents expropriated
    programs designed for state surveillance in order to torture ''sorcerers''.


    Interviewing and interacting day-to-day with those closely and recently involved
    in this outbreak of killings enabled an understanding of actions against witches
    and ''sorcerers'' apart from that which could be obtained on the basis of written
    records and other sources. For the participants at least, violence against ''sorcerers''
    in this context is a form of community justice. In 1998, this communal impulse
    escalated in response to district and national events.


    Nevertheless, the finding that a conspiracy did not lie behind the killings has
    been the most widely criticised aspect of my research. In seminars, conversations,
    and in reviews of my work, some friends and colleagues have criticised me (''But
    did you really understand what was going on?''); others have made unflattering
    ad hominem comparisons (''I hope you realise how much you sound like (the Soeharto
    general) Wiranto''); yet others have reached for humour (''Wow, you''ll get a
    medal from the Armed Forces for this''). Mostly these criticisms have been in
    good faith and reflect not only the majority opinion that conspiracy lies beneath
    the killings but also an assumption that in Indonesia conspiracies lie beneath
    ''unusual'' social, economic, political and, especially, violent phenomena.


    Yet the challenges of sleepy afternoon seminars, informal chats in university
    corridors, email correspondence with colleagues, or teasing friends, were pleasantly
    distracting after conducting the field research. As I had become aware of the
    domestic and mundane nature of ''sorcery'' and its recriminations, fieldwork became
    emotionally and morally challenging. The'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# WITCH-HUNT CONSPIRACY


    people I lived with suspected their neighbours, friends, and even family members
    of theft and, in extreme cases, of sorcery. I became conscious of, unwittingly
    involved and almost carried away in, this world of fear and suspicions when, for
    example, my own belongings went missing, or on the occasions when I was perceived
    to have slighted a ''sorcerer''. I lived among people who were involved in the
    killing of a local ''sorcerer'' and met many such people in almost daily trips
    to other villages. My early fieldwork was disturbed by nightmares over the troubling
    stories they had told me. Leisurely interviewing a killer at night, sipping coffee
    his wife had politely offered me, seeing his face illuminated by the tiny light
    bulb in the roof and the glow of the we cigarette he dragged on, by my horrified
    imagination fancied the faces of men and women illuminated by the burning faggots
    of Europe’s witch-hunts.


    Becoming used to these stories and feelings, and more intimate with the people
    who accused and killed ''sorcerers'', I found it harder to insulate myself against
    the encroaching moral problems. The people I spoke to were neither especially
    good nor bad, but were, as far I could tell, normal. Yet they were also people
    who had thrust a sword up to a ''sorcerer''s vagina'', dragged a ''sorcerer''
    behind truck, or set a ''sorcerer'' on fire. Moreover, they were proud of what
    they had done, and had received widespread village support for their actions.


    In this book I dispute the prevailing scholarly opinion that the outbreak of ''sorcerer''
    killings resulted from either a conspiracy or larger political or economic forces.
    I argue that larger political and economic forces were relevant only in as much
    as they shaped local interactions between friends, neighbours and family, and
    I emphas the importance of domestic factors and local belief systems which have
    largely been overlooked.'
