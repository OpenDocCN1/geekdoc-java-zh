    # Radiograms


    A more immediate catalyst for the killings was the sending of radiograms concerning
    the official collection of data on suspected sorcerers. In English, ''radiogram''
    refers to a cabinet containing a audio and record player or to a medical imaging
    technique. In Indonesia ''radiogram'', like telegram, refers to a way of sending
    messages. However, where telegrams are transmitted through telephony and the message
    ultimately transferred to paper and delivered by courier, radiograms are sent
    to the recipient via a dedicated radio channel.


    The term ''radiogram'' also has a specific meaning in relation to 1998 Banyuwangi.
    Every day as executive head of Banyuwangi district (bupati), sent around a dozen
    instructions to the various subdistrict heads (camat) via radiogram. Instructions
    were read out at the district head''s office and broadcast over a two-way radio
    to the various sub-district offices, where the information was simultaneously
    transcribed by hand. My understanding is that process was common throughout Indonesia
    at this time. Nevertheless, radiograms sent by the district head were thought
    to have spurred the killings. As one informant explained, a local ''sorcerer''
    was finally killed in 1998 because of the ''opportunity of the Bupati collecting
    data''. How can we understand this?


    On February 4, it appears that a ''sorcerer'' ''Marno'' was killed in Genteng
    subdistrict. On February 6, 1998, the district head, Purnomo Sidik, sent a radiogram
    that ultimately led to his ousting. The text of the radiogram, according to one
    version, was:


    > ...bearing in mind the intents of houses being destroyed because of sorcery
