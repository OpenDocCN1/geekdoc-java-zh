    # REFORM, REGIME CHANGE, AND VIOLENCE


    # Reformasi


    The 1998 killings of ''sorcerers'' and ''ninjas'' must be understood in the context
    of Reformasi in Indonesia. ''Reformasi'', hitherto translated as ''the Reform
    Movement'', refers to the period leading to and after the fall of President Soeharto
    in May 1998. There is no scholarly consensus on exactly when Reformasi began or
    ended, but I will take it as referring to the period 1996–1999.


    For almost three decades prior to Reformasi, Soeharto had been at the head of
    the ruling regime in Indonesia. He had fought against the Dutch in 1945-1949 and
    had risen through army ranks during the years of Indonesia''s first president,
    Soekarno. Yet he was relatively undistinguished among the military''s top brass.
    However, in 1967 he emerged as President of Indonesia. This followed the confusion
    caused by an apparent coup attempt in 1965 and the ensuing massacre of communists,
    with hundreds of thousands of victims.


    The Soeharto regime—which gave itself the name ''New Order'' (Orde Baru)—continued
    to grow in power. Together with his followers in the army Soeharto had taken a
    leading role in the massacre of communists. Subsequently, his use of violent suppression
    was apparent in subduing separatists in the province of Aceh; in establishing
    and maintaining sovereignty in East Timor; in suppressing activists, as radical
    Muslims, students and union leaders; and in crackdowns against demonstrators,
    such as in the 1984 Tanjung Priok massacre.


    The regime also attempted to establish its legitimacy through tightly controlled
    elections. From the 1970s, elections were limited to three parties—the regime''s
    electoral vehicle, Golkar, which always won; an Islamic party, PPP, and a ''nationalist''
    party, PDL. In 1993 Megawati, the daughter of'
