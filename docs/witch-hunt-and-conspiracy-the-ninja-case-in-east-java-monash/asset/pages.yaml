  md: '# PROLOGUE


    It was ten people who killed him, but it was one village that supported them.


    Everybody told this story differently, but they agreed on almost all of what follows.
    The story is set in Tegalgaring village in far-east Java. It begins when Saman
    took a frond from a coconut tree on a plot belonging to his grandmother, Hadipa.
    Coconut fronds have some value. They can be used as decorations, for example,
    at a wedding. This is how the story went ...


    Hadipa''s son, Kustari, was not happy. Saman, Kustari''s nephew, had stolen the
    frond from Hadipa, Kustari''s own mother! Kustari made a veiled threat, "Whoever
    took this frond will soon suffer for what he did."


    Saman went to his grandmother, Hadipa. He explained he had a right to take the
    coconut frond. He told her was not afraid of Kustari. But he was. Kustari was
    a sorcerer.


    Following this, Saman became too far. Then he died.


    Everyone thought that Kustari had gone too far. It is normal for things to go
    missing. Aside from that, no one likes having a sorcerer around. If you offend
    one, even without meaning to, you might end up dead.


    So it was not difficult for Bunali, a poor labour, to muster support when he decided
    to avenge the death of his son, Saman. Initially, Bunali turned to Salimi for
    help. Salimi used to be a tough guy. Bunali apparently offered Salimi a large
    sum to help him with the killing. (Salimi claimed he was never paid leading to
    disagreements for years afterwards.)


    They enlisted the help of some others. And, as with all secrets in the village,
    everyone soon knew about it ... Bunali was planning to kill Kustari, his wife''s
    brother.'
