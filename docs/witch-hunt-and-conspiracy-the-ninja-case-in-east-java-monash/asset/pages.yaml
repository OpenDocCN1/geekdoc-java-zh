  md: '# FOREWORD


    In 1998 around 100 people were killed for being sorcerers in Banyuwangi, far-east
    Java, Indonesia. The killers were local residents who were proud of their actions
    and received strong support from other community members. This book explains why.


    The killings—variously dubbed the ''Banyuwangi Incident'' (Peristiwa Banyuwangi),
    the ''Banyuwangi Case'' (Kasus Banyuwangi), or the ''Ninja Case'' (Kasus Ninja)—assumed
    national significance. They were ever covered in the international media, which
    is how I came to hear of them. In my first year of doctoral research I peruse
    reports of the killings, including press coverage, findings from various institutions
    and organisations, and academic reports. These all led me to believe that the
    killings were part of a larger political conspiracy.


    Several scenarios were proposed: organised squads of ''ninjas'' were killing religious
    scholars and teachers, or the grandchildren of members of the Communist Party
    were wreaking vengeance on people who had killed their grandparents, or the military
    was attempting to stabilise the regions. Absorbing all of this, I presented a
    paper at a postgraduate conference, finding that ex-president ''Soeharto and his
    allies encouraged and manipulated violence towards their own ends'' (Herriman
    1999). My suspicion of a conspiracy seemed to be confirmed when I arrived in Indonesia,
    as all the Indonesian academics, reporters and lay-people I met to know (at a
    distance) someone who could ''prove'' there was a plot lying behind the killings.
    So when I finally arrived in East Java I expected that most of my research would
    be consumed with getting to the origins of the conspiracy. At my first stop, in
    Malang city, for a few minutes I thought I was followed by a member of the state
    security organisation. I thought being followed, but it turned out to be a member
    of the local parliament who subsequently became a friend.


    This did not relieve my wariness that the forces behind the conspiracy would find
    out when I was getting too close to the ''truth''.'
