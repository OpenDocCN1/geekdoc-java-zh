  trans: "\n\n# C#: 从控制台读取输入\n\n`Console` 类提供了 `ReadLine` 方法从控制台读取输入。`ReadLine` 方法从控制台读取信息并以字符串格式返回输入。\n\
    \n```csharp\nString name = Console.ReadLine();\n```\n\n`Program.cs`\n\n```csharp\n\
    using System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n\
    \        Console.WriteLine(\"欢迎来到 C#, 请输入基本信息\");\n        Console.WriteLine(\"\
    请输入您的姓名\");\n        String name = Console.ReadLine();\n        Console.WriteLine(\"\
    请输入您的年龄\");\n        String age = Console.ReadLine();\n        Console.WriteLine(\"\
    Hello \" + name + \" 你今年 \" + age + \" 岁\");\n    }\n}\n```\n\n输出\n```\n欢迎来到 C#,\
    \ 请输入基本信息\n请输入您的姓名\nJJ TAM\n请输入您的年龄\n26\nHello JJ TAM 你今年 26 岁了\n```\n\n## 占位符语法\n\
    \n在拼接字符串时，使用占位符语法比使用 `+` 运算符更方便。\n\n以下是占位符语法的示例。\n\n```csharp\nConsole.WriteLine(\"\
    Hello {0}. You are {1} years old\", name, age);\n```\n\n上述语句等同于以下语句。\n\n```csharp\n\
    Console.WriteLine(\"Hello \" + name + \" You are \" + age + \" years old\");\n\
    ```\n\n`Program.cs`\n\n```csharp\nusing System;\n\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        Console.WriteLine(\"欢迎来到 C#, 请输入基本信息\"\
    );\n        Console.WriteLine(\"请输入您的姓名\");\n        String name = Console.ReadLine();\n\
    \        Console.WriteLine(\"请输入您的年龄\");\n        String age = Console.ReadLine();\n\
    \        Console.WriteLine(\"Hello {0}\", name);\n        Console.WriteLine(\"\
    You are {0} years old\", age);\n        Console.WriteLine(\"Hello {1}. You are\
    \ {0} years old\", name, age);\n    }\n}\n```\n\n输出\n```\n欢迎来到 C#, 请输入基本信息\n请输入您的姓名\n\
    JJ TAM\n请输入您的年龄\n26\nHello JJ TAM\nYou are 26 years old\nHello 26. You are JJ\
    \ TAM years old\n按任意键继续 . . .\n```\n\n# C#: 内置类型\n\nC# 支持几乎所有类型的数据类型工作。所有数据类型在\
    \ `System` 命名空间中都表示为类。数据类型可以分为以下几类：\n\na. 布尔型：`bool`\nb. 整数：`byte`, `sbyte`, `int`,\
    \ `uint`, `short`, `ushort`, `long`, `ulong`\nc. 浮点型：`double`, `float`, `decimal`\n\
    d. 字符：`char`\ne. `String`\n\n下表总结了所有数据类型\n\n| 短名称 | 类 | 最小值 | 最大值 |\n| :--- |\
    \ :--- | :--- | :--- |\n| `byte` | `Byte` | 0 | 255 |\n| `sbyte` | `SByte` | -128\
    \ | 127 |\n| `int` | `Int32` | -2,147,483,648 | 2,147,483,647 |\n| `uint` | `UInt32`\
    \ | 0 | 4294967295 |\n| `short` | `Int16` | -32,768 | 32767 |\n| `ushort` | `UInt16`\
    \ | 0 | 65535 |\n| `long` | `Int64` | -9223372036854775808 | 9223372036854775807\
    \ |\n| `ulong` | `UInt64` | 0 | 18446744073709551615 |\n| `float` | `Single` |\
