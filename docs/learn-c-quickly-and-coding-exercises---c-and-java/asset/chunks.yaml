    \ 字符序列 |\n\n注意\n\na. `Float` 变量后加 `f` 后缀。\n   例：`float floatVar = 18.18f;`\nb.\
    \ `Decimal` 变量后加 `m` 后缀。\n   例：`decimal decimalVar = 20.20m;`\n\n`Program.cs`\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[]\
