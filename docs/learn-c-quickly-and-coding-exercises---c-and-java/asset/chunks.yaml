    ****************\");\n        Console.WriteLine(withoutVerbatim);\n    }\n}\n\
    ```\n\nOutput\n```\n1n2\n34\n****************\n1n2\n34\n```\nAs you see the ouput,\
    \ `@` symbol don’t interpret the escape sequences `\\n`, `\\t`. Where as the string\
    \ withVerbatim interpreted as new line and tab.\n\n# C#: Operators\n\nAn operator\
