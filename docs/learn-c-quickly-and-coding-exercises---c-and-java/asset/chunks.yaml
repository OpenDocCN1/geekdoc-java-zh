    \n# C#: Namespaces\n\nNamespaces are used to organize your application logic.\
    \ If you are aware of java, name spaces are equivalent to packages in java.\n\n\
    How to define namespace?\n\n‘namespace’ keyword is used to define name space.\n\
    \nSyntax\n\nnamespace nameSpaceName{\n\n         //Block of statements\n\n}\n\n\
    Example\n\nnamespace NameSpace1\n\n{\n\n    class Arithmetic\n\n    {\n\n       \
    \ public static int sum(int a, int b)\n\n        {\n\n            return a+b;\n\
    \n        }\n\n    }\n\n}\n\nAbove snippet defines a namespace named ‘NameSpace1’.\
    \ ‘Arithmetic’ class is defined inside the name space ‘NameSpace1’.\n\nHow to\
    \ access the name space?\n\n‘using’ keyword is used to import a namespace into\
    \ your application.\n\nSyntax\n\nusing namespace;\n\nExample\n\nusing System;\n\
    \nConsole.WriteLine(\"Hello, World!\");\n\nYou can also access the name space,\
    \ by using the fully qualified name like below.\n\nSystem.Console.WriteLine(\"\
    Hello, World!\");\n\nFollowing is the complete working application.\n\nProgram.cs\n\
    \nusing  System;\n\nnamespace  NameSpace1\n\n{\n\n class  Arithmetic\n\n    {\n\
    \n public  static  int  sum(int a, int b)\n\n        {\n\n return a+b;\n\n       \
    \ }\n\n    }\n\n}\n\nclass  Program\n\n{\n\n static  void  Main(string[] args)\n\
    \n    {\n\n int result1 = NameSpace1.Arithmetic.sum(10, 20);\n\n        Console.WriteLine(\"\
    Sum of 10 and 20 is {0}\", result1);\n\n    }\n\n}\n\nOutput\n\nSum of 10 and\
    \ 20 is 30\n\n# C#: Resolving name space conflicts\n\nIn any application, it is\
    \ very common to use multiple name spaces. It may happen that, more than one name\
    \ space may have same class name. if you try to use the class name defined in\
    \ more than one imported name spaces, C# compiler shows the conflict.\n\nProgram.cs\n\
    \nusing  System;\n\nusing  NameSpace1;\n\nusing  NameSpace2;\n\nnamespace  NameSpace1\n\
    \n{\n\n class  Arithmetic\n\n    {\n\n public  static  int  sum(int a, int b)\n\
    \n        {\n\n return a+b;\n\n        }\n\n    }\n\n}\n\nnamespace  NameSpace2\n\
    \n{\n\n class  Arithmetic\n\n    {\n\n static  float  sum(float a, float b)\n\n\
            {\n\n return a + b;\n\n        }\n\n    }\n\n}\n\nclass  Program\n\n{\n\
    \n static  void  Main(string[] args)\n\n    {\n\n int result1 = Arithmetic.sum(10,\
    \ 20);\n\n        Console.WriteLine(\"Sum of 10 and 20 is {0}\", result1);\n\n\
        }\n\n}\n\nAs you see Program.cs, I  defined the class 'Arithmetic' in the\
    \ name spaces NameSpace1 and NameSpace2\\. When I try to use the method 'Arithmetic.sum(10,\
    \ 20);', compiler don't know which method it should use (Since Arithmetic class\
    \ is defined in both the name spaces NameSpace1, NameSpace2).\n\nTo resolve this\
    \ conflict, we should use the fully qualified name like below.\n\n // To use the\
    \ Arithmetic class defined in NameSpace1\n\nNameSpace1.Arithmetic.sum(10, 20); \
    \   \n\n // To use the Arithmetic class defined in NameSpace2\n\nNameSpace2.Arithmetic.sum(10,\
    \ 20);    \n\nFollowing is the updated application.\n\nProgram.cs\n\nusing  System;\n\
    \nusing  NameSpace1;\n\nusing  NameSpace2;\n\nnamespace  NameSpace1\n\n{\n\n class\
    \  Arithmetic\n\n    {\n\n public  static  int  sum(int a, int b)\n\n        {\n\
    \n return a+b;\n\n        }\n\n    }\n\n}\n\nnamespace  NameSpace2\n\n{\n\n class\
    \  Arithmetic\n\n    {\n\n static  float  sum(float a, float b)\n\n        {\n\
    \n return a + b;\n\n        }\n\n    }\n\n}\n\nclass  Program\n\n{\n\n static\
    \  void  Main(string[] args)\n\n    {\n\n int result1 = NameSpace1.Arithmetic.sum(10,\
    \ 20);\n\n        Console.WriteLine(\"Sum of 10 and 20 is {0}\", result1);\n\n\
        }\n\n}\n\nOutput\n\nSum of 10 and 20 is 30\n\n# C#: Nested namespaces\n\n\
    A name space can be nested in another name space.\n\nProgram.cs\n\nusing  System;\n\
    \nnamespace  Arithmetic\n\n{\n\n namespace  IntegerArithmetic\n\n    {\n\n class\
    \  Arithmetic\n\n        {\n\n public  static  int  sum(int a, int b)\n\n           \
    \ {\n\n return a + b;\n\n            }\n\n        }\n\n    }\n\n namespace  FloatArithmetic\n\
    \n    {\n\n class  Arithmetic\n\n        {\n\n public  static  float  sum(float\
    \ a, float b)\n\n            {\n\n return a + b;\n\n            }\n\n        }\n\
    \n    }\n\n}\n\nclass  Program\n\n{\n\n static  void  Main(string[] args)\n\n\
        {\n\n int result1 = Arithmetic.IntegerArithmetic.Arithmetic.sum(10, 20);\n\
    \n        Console.WriteLine(\"Sum of 10 and 20 is {0}\", result1);\n\n    }\n\n\
    }\n\nOutput\n\nSum of 10 and 20 is 30\n\nNotify above snippet, IntegerArithmetic\
    \ and FloatArithmetic namespaces are defined inside Arithmetic namespace.\n\n\
    # C#: Classes and Objects\n\nBefore, moving in depth details of Object oriented\
    \ and java features, will discuss what an object and class is.\n\n## Objects and\
    \ class in Real World scenario\n\n## Object"
