    \ some time, for the owner of the application also, it is very difficult to figure\
    \ out what was written.\n\nComments solve this problem:\n\nBy using comments,\
    \ you can document your code at the time of writing program. Comments don't affect\
    \ your program execution. Comments simply document your code.\n\nC# supports 3\
    \ types of comments\n\n## Single line comment :\n\nSingle line comments starts\
    \ with `//`\n\n```cs\n// It is a single line comment\n```\n\n## Multi Line comment\n\
    \nMulti line comments are place in between `/* */`\n\n```cs\n/* I am a mulltiline\
    \ comment */\n```\n\n## XML Documentation Comments\n\nXML Documentation comments\
    \ are used to provide help to given class, function, namespace etc.,\n\n`Program.cs`\n\
    \n```cs\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n\
    \    {\n        int marks; /* variable marks represents the marks\n          \
    \          obtained by a student */\n        marks = 70;\n        Console.WriteLine(\"\
