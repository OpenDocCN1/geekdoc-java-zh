  trans: "\n\n![](img/cover00306.jpeg)\n\n# 快速学习 C# 与编程练习：初学者 C 和 Java 编程及实践项目 J J\
    \ TAM 著\n\n# C# 简介\n\nC#是一种支持多种编程范式的编程语言。C# 的基本语法与 C、C++ 和 Java 相似。因此，如果你熟悉其中任何一种语言，你可以同样地学习\
    \ C#。\n\n## 什么是多范式编程语言？\n\n支持一种以上编程范式的语言称为多范式编程语言。C# 是一种多范式编程语言，它同时支持命令式和面向对象的范式。C#\
    \ 也支持某种程度的函数式编程。\n\n## C# 与 .net\n\nC# 是一种语言，而 `.NET` 是一个框架。`.NET` 下包含多种语言。C#\
    \ 是 .NET 中的语言之一。\n\n### C# 的最新版本是什么？\n\n在编写本文时，最新版本是 2015 年发布的 C# 6.0。\n\n###\
    \ 使用 C# 的先决条件\n\n安装 Visual Studio。你可以通过以下链接获取社区版。\n\nhttps://www.visualstudio.com/vs/community/\n\
    \n# C#：Hello World 程序\n\n我希望你已经安装了 Visual Studio。以下步骤解释了简单的“Hello World”应用程序。\n\
    \n### 步骤 1：打开 Visual studio\n\n[![`2.bp.blogspot.com/-k1u5i75B59Q/W3bIOR6l6rI/AAAAAAAAK6E/GQI1hkAGvWIJQvBdar3U7J`](https://2.bp.blogspot.com/-k1u5i75B59Q/W3bIOR6l6rI/AAAAAAAAK6E/GQI1hkAGvWIJQvBdar3U7J)]\n\
    \n步骤 2：进入文件 (File) -> 新建 (New) -> 项目 (Project)。\n\n选择“控制台应用程序 (Console Application)”，将项目命名为\
    \ `HelloWorld`。\n\n按确定。\n\n这将创建一个带有默认数据的 `Program.cs` 文件。\n\n如下所示更新程序：\n\n```csharp\n\
    using System;\n\nnamespace HelloWorld\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            Console.WriteLine(\"Hello World\"\
    );\n            Console.WriteLine(\"Welcome To C# Programming.........\");\n \
    \       }\n    }\n}\n```\n\n按下 `CTRL + F5`，它将打开命令行并显示我们传递给 `Console.WriteLine`\
    \ 方法的字符串。\n\n## 分析程序\n\n`using System`\n\n上述语句加载了命名空间 `System`。命名空间用于组织代码。命名空间是类、接口、枚举、结构体和委托的集合。\n\
    \n`namespace HelloWorld`\n\n上述语句为此程序指定了命名空间 `HelloWorld`。这是可选的。你甚至可以在不使用此语句的情况下运行程序。\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        Console.WriteLine(\"Hello World\");\n        Console.WriteLine(\"\
    Welcome To C# Programming.........\");\n    }\n}\n```\n\n`class Program`\n\n类用于将方法和属性封装成单一实体。暂时请忽略它，我将在后的文章中对其进行解释。\n\
    \n`static void Main(string[] args)`\n\n`Main` 方法是你的 C# 应用程序的入口。应用程序的执行从这里开始。\n\
    \n`Console.WriteLine(\"Hello World\");`\n\n上述语句将消息 \"Hello World\" 写入控制台。`Console`\
    \ 是位于命名空间 `System` 中的类。`WriteLine` 是 `Console` 类的方法。\n\n"
- fmt: "\n# C#: Read input from console\n\n`Console` class provides `ReadLine` method\
    \ to read input from console. `ReadLine` method reads the information from console\
    \ and return the input in string format.\n\n```csharp\nString name = Console.ReadLine();\n\
    ```\n\n`Program.cs`\n\n```csharp\nusing System;\n\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        Console.WriteLine(\"Welcome to C#,\
    \ Please Enter Basic Informaiton\");\n        Console.WriteLine(\"Enter Your Name\"\
    );\n        String name = Console.ReadLine();\n        Console.WriteLine(\"Enter\
    \ Your Age\");\n        String age = Console.ReadLine();\n        Console.WriteLine(\"\
    Hello \" + name + \" You are \" + age + \" years old\");\n    }\n}\n```\n\nOutput\n\
    ```\nWelcome to C#, Please Enter Basic Informaiton\nEnter Your Name\nJJ TAM\n\
    Enter Your Age\n26\nHello JJ TAM You are 26 years old\n```\n\n## Place Holder\
    \ Syntax\n\nWhile concatenating the strings, place holder syntax is very convenient\
    \ than using `+` operator.\n\nFollowing is the example of place holder syntax.\n\
    \n```csharp\nConsole.WriteLine(\"Hello {0}. You are {1} years old\", name, age);\n\
    ```\n\nAbove statement is equivalent of following statement.\n\n```csharp\nConsole.WriteLine(\"\
    Hello \" + name + \" You are \" + age + \" years old\");\n```\n\n`Program.cs`\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        Console.WriteLine(\"Welcome to C#, Please Enter Basic\
    \ Informaiton\");\n        Console.WriteLine(\"Enter Your Name\");\n        String\
    \ name = Console.ReadLine();\n        Console.WriteLine(\"Enter Your Age\");\n\
    \        String age = Console.ReadLine();\n        Console.WriteLine(\"Hello {0}\"\
    , name);\n        Console.WriteLine(\"You are {0} years old\", age);\n       \
    \ Console.WriteLine(\"Hello {1}. You are {0} years old\", name, age);\n    }\n\
    }\n```\n\nOutput\n```\nWelcome to C#, Please Enter Basic Informaiton\nEnter Your\
    \ Name\nJJ TAM\nEnter Your Age\n26\nHello JJ TAM\nYou are 26 years old\nHello\
    \ 26. You are JJ TAM years old\nPress any key to continue . . .\n```\n\n# C#:\
    \ Built in Types\n\nC# support almost all kind of data types to work with. All\
    \ data types are represented as classes in `System` namespace. Data types can\
    \ be categorized into following types.\n\na. Boolean: `bool`\nb. Integer: `byte`,\
    \ `sbyte`, `int`, `uint`, `short`, `ushort`, `long`, `ulong`\nc. Float: `double`,\
    \ `float`, `decimal`\nd. Character: `char`\ne. `String`\n\nFollowing table summarizes\
    \ all the data types\n\n| Short Name | Class | Min value | Max value |\n| :---\
    \ | :--- | :--- | :--- |\n| `byte` | `Byte` | 0 | 255 |\n| `sbyte` | `SByte` |\
    \ -128 | 127 |\n| `int` | `Int32` | -2,147,483,648 | 2,147,483,647 |\n| `uint`\
    \ | `UInt32` | 0 | 4294967295 |\n| `short` | `Int16` | -32,768 | 32767 |\n| `ushort`\
    \ | `UInt16` | 0 | 65535 |\n| `long` | `Int64` | -9223372036854775808 | 9223372036854775807\
    \ |\n| `ulong` | `UInt64` | 0 | 18446744073709551615 |\n| `float` | `Single` |\
    \ -3.402823e38 | 3.402823e38 |\n| `double` | `Double` | -1.79769313486232e308\
    \ | 1.79769313486232e308 |\n| `decimal` | `Decimal` | ±1.0 × 10e−28 | ±7.9 × 10e28\
    \ |\n| `char` | `Char` | | Represent Unicode character. It take 16 bits. |\n|\
    \ `string` | `String` | | Sequence of characters |\n\nNote\n\na. Suffix `Float`\
    \ variables by `f`.\n   Ex: `float floatVar = 18.18f;`\nb. Suffix `Decimal` variables\
    \ by `m`.\n   Ex: `decimal decimalVar = 20.20m;`\n\n`Program.cs`\n\n```csharp\n\
    using System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n\
    \        byte byteVar = 10;\n        sbyte sbyteVar = 1;\n        int intVar =\
    \ 12;\n        uint uintVar = 13;\n        short shortVar = 14;\n        ushort\
    \ ushortVar = 15;\n        long longVar = 16;\n        ulong ulongVar = 17;\n\
    \        float floatVar = 18.18f;\n        double doubleVar = 19;\n        decimal\
    \ decimalVar = 20.20m;\n        char charVar = 'S';\n        string stringVar\
    \ = \"Hello World\";\n        Console.WriteLine(\"byteVar = {0}\", byteVar);\n\
    \        Console.WriteLine(\"sbyteVar = {0}\", sbyteVar);\n        Console.WriteLine(\"\
    intVar = {0}\", intVar);\n        Console.WriteLine(\"uintVar = {0}\", uintVar);\n\
    \        Console.WriteLine(\"shortVar = {0}\", shortVar);\n        Console.WriteLine(\"\
    ushortVar = {0}\", ushortVar);\n        Console.WriteLine(\"longVar = {0}\", longVar);\n\
    \        Console.WriteLine(\"ulongVar = {0}\", ulongVar);\n        Console.WriteLine(\"\
    floatVar = {0}\", floatVar);\n        Console.WriteLine(\"doubleVar = {0}\", doubleVar);\n\
    \        Console.WriteLine(\"decimalVar = {0}\", decimalVar);\n        Console.WriteLine(\"\
    charVar = {0}\", charVar);\n        Console.WriteLine(\"stringVar = {0}\", stringVar);\n\
    \    }\n}\n```\n\n# C#: Strings and Escape Sequences\n\n`String` is a Collection\
    \ of characters. Strings are enclosed in double quotes.\n\nEx:\n`String firstName\
    \ = \"JJ TAM\";`\n`String lastName = \"Delhi\";`\n\n`Program.cs`\n\n```csharp\n\
    using System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n\
    \        String firstName = \"JJ TAM\";\n        String lastName = \"Delhi\";\n\
    \        Console.WriteLine(\"Hello Mr {0} {1}\", firstName, lastName);\n    }\n\
    }\n```\n\nOutput\n```\nHello Mr JJ TAM Delhi\n```\n\n## Escape Sequences\n\nEscape\
    \ sequences in program languages has special meaning, For example, `\\n` prints\
    \ string in new line, `\\t` is a tab character etc., Following tables summarizes\
    \ some of the escape characters in C#.\n\n| Escape Sequence | Description |\n\
    | :--- | :--- |\n| `\\a` | Bell alert |\n| `\\b` | Backspace |\n| `\\f` | Form\
    \ feed |\n| `\\n` | New Line |\n| `\\r` | Carriage Return |\n| `\\t` | Horizontal\
    \ tab |\n| `\\v` | Vertical tab |\n| `\\’` | Single Quote |\n| `\\\"` | Double\
    \ Quote |\n| `\\\\` | Backslash |\n| `\\?` | Question Mark |\n| `\\ooo` | ASCII\
    \ Character in Octal Notation |\n| `\\xhh` | ASCII Character in hexadecimal notation\
