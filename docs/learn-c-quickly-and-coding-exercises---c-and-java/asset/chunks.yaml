    , charVar);\n        Console.WriteLine(\"stringVar = {0}\", stringVar);\n    }\n\
    }\n```\n\n# C#: 占位符语法\n\n在拼接字符串时，使用占位符语法比使用 `+` 运算符更方便。\n\n以下是占位符语法的示例。\n\n```csharp\n\
    Console.WriteLine(\"Hello {0}. You are {1} years old\", name, age);\n```\n\n上述语句等同于以下语句。\n\
    \n```csharp\nConsole.WriteLine(\"Hello \" + name + \" You are \" + age + \" years\
