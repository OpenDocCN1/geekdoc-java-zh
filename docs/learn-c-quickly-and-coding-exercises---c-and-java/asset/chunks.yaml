  trans: "\n\n```csharp\nstatic void arithmetic(int i, int j, out int sum, out int\
    \ sub, out int mul, out int div)\n{\n    sum = i + j;\n    sub = i = j;\n    mul\
    \ = i * j;\n    div = i / j;\n}\n```\n\n上述方法的调用方式如下：\n\n```csharp\narithmetrical(i,\
    \ j, out result1, out result2, out result3, out result4);\n```\n\n在调用 `arithmetic`\
    \ 方法后，结果存储在变量 `result1`、`result2`、`result3`、`result4` 中。\n\n**Program.cs**\n\n\
    ```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n\
    \    {\n        int i = 10;\n        int j = 5;\n        int result1 = 0;\n  \
    \      int result2 = 0;\n        int result3 = 0;\n        int result4 = 0;\n\n\
    \        Console.WriteLine(\"Before calling arithmetic method result1 : {0}\"\
    , result1);\n        Console.WriteLine(\"Before calling arithmetic method result2\
    \ : {0}\", result2);\n        Console.WriteLine(\"Before calling arithmetic method\
    \ result3 : {0}\", result3);\n        Console.WriteLine(\"Before calling arithmetic\
    \ method result4 : {0}\", result4);\n\n        arithmetic(i, j, out result1, out\
    \ result2, out result3, out result4);\n\n        Console.WriteLine(\"After calling\
    \ arithmetic method result1 : {0}\", result1);\n        Console.WriteLine(\"After\
    \ calling arithmetic method result2 : {0}\", result2);\n        Console.WriteLine(\"\
    After calling arithmetic method result3 : {0}\", result3);\n        Console.WriteLine(\"\
    After calling arithmetic method result4 : {0}\", result4);\n    }\n\n    static\
    \ void arithmetic(int i, int j, out int sum, out int sub, out int mul, out int\
    \ div)\n    {\n        sum = i + j;\n        sub = i = j;\n        mul = i * j;\n\
    \        div = i / j;\n    }\n}\n```\n\n**输出**\n\n```\nBefore calling arithmetic\
    \ method result1 : 0\nBefore calling arithmetic method result2 : 0\nBefore calling\
    \ arithmetic method result3 : 0\nBefore calling arithmetic method result4 : 0\n\
    After calling arithmetic method result1 : 15\nAfter calling arithmetic method\
    \ result2 : 5\nAfter calling arithmetic method result3 : 25\nAfter calling arithmetic\
    \ method result4 : 1\n```\n\n## Out 与 ref 参数\n\n它们几乎相同——唯一的区别在于，作为 `out` 参数传递的变量不需要初始化，但作为\
    \ `ref` 参数传递时必须设置一个值。\n\n## 参数数组\n\n就像将变量作为参数传递给方法一样，你也可以将数组作为参数传递给方法。\n\n**Program.cs**\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        int[] arr = new int[5];\n        arr[0] = 2;\n       \
    \ arr[1] = 3;\n        arr[2] = 5;\n        arr[3] = 7;\n        arr[4] = 11;\n\
    \        printArray(arr);\n    }\n\n    static void printArray(int[] arr)\n  \
    \  {\n        Console.WriteLine(\"Array length is {0}\", arr.Length);\n      \
    \  foreach(int data in arr)\n        {\n            Console.WriteLine(data);\n\
    \        }\n    }\n}\n```\n\n**输出**\n\n```\nArray length is 5\n2\n3\n5\n7\n11\n\
    ```\n\nC# 提供了 `params` 关键字，通过它你可以像下面一样调用 `printArray` 方法：\n\n`printArray(2, 3,\
    \ 5, 7, 11);`\n\n如果你使用 `params` 关键字定义方法，那么你也可以在不传递参数的情况下调用该方法，例如 `printArray()`。\n\
    \n**Program.cs**\n\n```csharp\nusing System;\n\nclass Program\n{\n    static void\
    \ Main(string[] args)\n    {\n        printArray();\n        printArray(2);\n\
    \        printArray(2, 3, 5, 7, 11);\n    }\n\n    static void printArray(params\
    \ int[] arr)\n    {\n        Console.WriteLine(\"Array length is {0}\", arr.Length);\n\
    \        foreach(int data in arr)\n        {\n            Console.WriteLine(data);\n\
    \        }\n    }\n}\n```\n\n**输出**\n\n```\nArray length is 0\nArray length is\
    \ 1\n2\nArray length is 4\n2\n3\n5\n7\n11\n```\n\n## C#: 命名空间 (Namespaces)\n\n\
    `Namespaces` 用于组织你的应用程序逻辑。如果你熟悉 Java，命名空间等同于 Java 中的包（packages）。\n\n如何定义命名空间？\n\
    \n使用 `namespace` 关键字来定义命名空间。\n\n**语法**\n\n```csharp\nnamespace nameSpace\n{\n\
    \    // 语句块\n}\n```\n\n**示例**\n\n```csharp\nnamespace NameSpace1\n{\n    class\
    \ Arithmetic\n    {\n        public static int sum(int a, int b)\n        {\n\
    \            return a+b;\n        }\n    }\n}\n```\n\n上述代码定义了一个名为 `NameSpace1`\
    \ 的命名空间。`Arithmetic` 类定义在 `NameSpace1` 内部。\n\n如何访问命名空间？\n\n使用 `using` 关键字将命名空间导入到你的应用程序中。\n\
    \n**语法**\n\n```csharp\nusing namespace;\n```\n\n**示例**\n\n```csharp\nusing System;\n\
    Console.WriteLine(\"Hello, World!\");\n```\n\n你也可以通过像下面的限定限定（fully qualified name）来访问命名空间：\n\
    \n`System.Console.WriteLine(\"Hello, World!\");`\n\n以下是完整的示例应用程序。\n\n**Program.cs**\n\
    \n```csharp\nusing System;\n\nnamespace NameSpace1\n{\n    class Arithmetic\n\
    \    {\n        public static int sum(int a, int b)\n        {\n            return\
    \ a+b;\n        }\n    }\n}\n\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        int result1 = NameSpace1.Arithmetic.sum(10, 20);\n   \
    \     Console.WriteLine(\"Sum of 10 and 20 is {0}\", result1);\n    }\n}\n```\n\
    \n**输出**\n\n```\nSum of 10 and 20 is 30\n```\n\n## C#: 解决名称冲突\n\n在任何应用程序中，使用多个命名空间是非常常见的。可能会出现多个命名空间具有相同类名的情况。如果你尝试使用定义在多个命名空间中的类名，C#\
    \ 编译器会显示冲突。\n\n**Program.cs**\n\n```csharp\nusing System;\nusing NameSpace1;\n\
    using NameSpace2;\n\nnamespace NameSpace1\n{\n    class Arithmetic\n    {\n  \
    \      public static int sum(int a, int b)\n        {\n            return a+b;\n\
    \        }\n    }\n}\n\nnamespace NameSpace2\n{\n    class Arithmetic\n    {\n\
    \        static float sum(float a, float b)\n        {\n            return a +\
    \ b;\n        }\n    }\n}\n\nclass Program\n{\n    static void Main(string[] args)\n\
    \    {\n        int result1 = Arithmetic.sum(10, 20);\n        Console.WriteLine(\"\
    Sum of 10 and 20 is {0}\", result1);\n    }\n}\n```\n\n正如你在 Program.cs 中看到的，我在\
    \ `NameSpace1` 和 `NameSpace2` 命名空间中都定义了 `Arithmetic` 类。当我尝试使用 `Arithmetic.sum(10,\
    \ 20);` 时，编译器不知道应该使用哪一个方法（因为 `Arithmetic` 类在命名空间 `NameSpace1`, `NameSpace2` 中都存在）。\n\
    \n为了解决此冲突，我们应该使用像下面的限定名称：\n\n// 使用定义在 NameSpace1 中的 Arithmetic 类\n`NameSpace1.Arithmetic.sum(10,\
    \ 20);`\n\n// 使用定义在 NameSpace2 中的 Arithmetic 类\n`NameSpace2.Arithmetic.sum(10,\
    \ 20);`\n\n以下是更新后的应用程序。\n\n## C#: 嵌套命名空间\n\n命名空间可以嵌套另一个命名空间中。\n\n**Program.cs**\n\
    \n```csharp\nusing System;\n\nnamespace Arithmetic\n{\n    namespace IntegerArithmetic\n\
    \    {\n        class Arithmetic\n        {\n            public static int sum(int\
    \ a, int b)\n            {\n                return a+b;\n            }\n     \
    \   }\n    }\n\n    namespace FloatArithmetic\n    {\n        class Arithmetic\n\
    \        {\n            public static float sum(float a, float b)\n          \
    \  {\n                return a + b;\n            }\n        }\n    }\n}\n\nclass\
    \ Program\n{\n    static void Main(string[] args)\n    {\n        int result1\
    \ = Arithmetic.IntegerArithmetic.Arithmetic.sum(10, 20);\n        Console.WriteLine(\"\
    Sum of 10 and 20 is {0}\", result1);\n    }\n}\n```\n\n"
- fmt: "\nAn Object is a real-world entity. For example, book, cat, box, bus, keyboard,\
    \ person, screen, cell phone etc., all are objects.\n\n## How can we differentiate\
    \ objects?\n\n1. Depend on their properties\n2. Depend on their behaviors\n\n\
    ### Differentiating two objects based on their properties\n\nLet’s say, there\
    \ are two persons `A` and `B`, we already discussed, each real-time entity is\
    \ an object. So, these two persons are objects.\n\nFirst let’s try to find what\
    \ the possible properties for the `person` object are\n\n#### Possible properties\
    \ for a person\n\nheight, weight, color, Education Qualification, country, address\
    \ are all come under person properties.\n\nNow by comparing these properties we\
    \ can easily differentiate two persons.\n\n| Property | Person A | Person B |\n\
    | :--- | :--- | :--- |\n| Height | 6ft | 5.5ft |\n| Weight | 75Kg | 60Kg |\n|\
    \ Color | White | Black |\n| Country | India | America |\n\nAs shown in the above\
    \ table, both the persons has their own properties, So we can differentiate based\
    \ on them.\n\n### Differentiating two objects based on their behavior\n\nConsider\
    \ the same two persons `A` and `B`. will try to figure out possible behaviors\
    \ for the `person` object\n\n#### Possible behaviors are\n\nwalk, run, swim, eat,\
    \ sleep, see, hear etc., Now by comparing these behaviors we can easily differentiate\
    \ two persons.\n\n| Behavior | Person A | Person B |\n| :--- | :--- | :--- |\n\
    | walk | 10km/hr | 12km/hr |\n| run | 20km/hr | 18km/hr |\n| sleep | 8 Hrs/day\
    \ | 6Hrs/day |\n\n## Class\n\nIn normal terms I call class as a category.\n\n\
    All persons come under `Human` category\ncat, `lion`, `Elephant` come under `Animals`\
    \ Category\n\nSo a class or category is a group of objects with similar properties\
    \ and behaviors.\n\n## Objects and class in Programming Terminology\n\n### What\
    \ Is an Object?\n\nAn object is a software bundle of related state and behavior.\
    \ The main advantage of `java` is you can compare objects in `java` with real\
    \ world objects. So it is very easy to work with objects in `C#`.\n\n### What\
    \ Is a Class?\n\nA class is a blueprint or prototype from which objects are created.\n\
    \n# C#: Declaring class\n\nClass in `java` declared with a keyword `class`\n\n\
    #### Syntax\n\n```csharp\nclass ClassName{\n\n}\n```\n\n#### Example\n\n```csharp\n\
    class Person{\n}\n```\n\n### How to declare properties of a class?\n\nEach property\
    \ is represented by a variable.\n\n```csharp\nclass Person\n{\n    float height,\
    \ weight;\n    String color, country;\n}\n```\n\nSince `height` and `weight` are\
    \ real type values, so these are declared as a `float`. Whereas `color` and `country`\
    \ are of type `String`. So these are declared as type `string`.\n\n### How to\
    \ define behaviors to a class?\n\nEach behavior in `C#` represented by a method.\n\
    Method is a block of statements, with a name associated with it.\n\n#### Syntax:\n\
    \n```csharp\nreturnType methodName(parameters){\n\n}\n```\n\n#### Example\n\n\
    ```csharp\nint sum(int a, int b){\n    return (a+b);\n}\n```\n\nhere,\n`returnType`\
    \ is `int`\n`parameters` are `a`, `b`.\nReturn value must match with the return\
    \ type of the method.\n\nAfter adding the behaviors for the class `Person`, code\
    \ changed like below:\n\n```csharp\nclass Person\n{\n    float height, weight;\n\
    \    String color, country;\n\n    public float getHeight()\n    {\n        return\
    \ height;\n    }\n\n    public void setHeight(float height)\n    {\n        this.height\
    \ = height;\n    }\n\n    public float getWeight()\n    {\n        return weight;\n\
    \    }\n\n    public void setWeight(float weight)\n    {\n        this.weight\
    \ = weight;\n    }\n\n    public String getColor()\n    {\n        return color;\n\
    \    }\n\n    public void setColor(String color)\n    {\n        this.color =\
    \ color;\n    }\n\n    public String getCountry()\n    {\n        return country;\n\
    \    }\n\n    public void setCountry(String country)\n    {\n        this.country\
    \ = country;\n    }\n}\n```\n\nFollowing is the complete working application.\n\
    \n`Person.cs`\n\n```csharp\nusing System;\n\nclass Person\n{\n    float height,\
    \ weight;\n    String color, country;\n\n    public float getHeight()\n    {\n\
    \        return height;\n    }\n\n    public void setHeight(float height)\n  \
    \  {\n        this.height = height;\n    }\n\n    public float getWeight()\n \
    \   {\n        return weight;\n    }\n\n    public void setWeight(float weight)\n\
    \    {\n        this.weight = weight;\n    }\n\n    public String getColor()\n\
    \    {\n        return color;\n    }\n\n    public void setColor(String color)\n\
    \    {\n        this.color = color;\n    }\n\n    public String getCountry()\n\
    \    {\n        return country;\n    }\n\n    public void setCountry(String country)\n\
    \    {\n        this.country = country;\n    }\n}\n\nclass Program\n{\n    static\
    \ void printPerson(Person person)\n    {\n        Console.WriteLine(\"Color :\
    \ {0}\", person.getColor());\n        Console.WriteLine(\"Country : {0}\", person.getCountry());\n\
    \        Console.WriteLine(\"Weight : {0}\", person.getWeight());\n        Console.WriteLine(\"\
    Height : {0}\", person.getHeight());\n    }\n\n    static void Main(string[] args)\n\
    \    {\n        Person person1 = new Person();\n        person1.setColor(\"White\"\
    );\n        person1.setCountry(\"India\");\n        person1.setHeight(5.9f);\n\
    \        person1.setWeight(67.5f);\n        printPerson(person1);\n    }\n}\n\
    ```\n\nOutput:\nColor : White\nCountry : India\nWeight : 67.5\nHeight : 5.9\n\n\
    # C#: Instance variables\n\nInstance variables are those which are associated\
    \ with object. `Person` object has instance variables `height`, `weight`, `country`.\
    \ Instance variables are also called member variables or fields.\n\n## Fields\
    \ declaration syntax\n\n```csharp\nmodifier dataType variableName;\n```\n\nField\
    \ declaration composed of three components:\n1. `modifier` is any one of `public`,\
    \ `private`, `protected`, `internal`.\n2. `dataType` is any primitive or reference\
    \ type\n3. `name` of the variable\n\nExample:\n```csharp\nprivate int var;\n```\n\
    \n### Access Modifiers (public, private)\n\n`private`: the field is accessible\
    \ only within its own class.\nFor example, consider the class `Person`. I given\
    \ private access to instance variables `height`, `weight`, `country`. So any method\
    \ which is defined inside the class `Person` can able to access these variables,\
    \ but you can't access outside the class.\n\n`public`: If you declare any field\
    \ using `public` modifier, then the field is accessible from outside of the class\
    \ also.\n\nFollowing is the complete working application.\n\n`Program.cs`\n\n\
    ```csharp\nusing System;\n\nclass Person\n{\n    private float height, weight;\n\
    \    private String color, country;\n\n    public float getHeight()\n    {\n \
    \       return height;\n    }\n\n    public void setHeight(float height)\n   \
    \ {\n        this.height = height;\n    }\n\n    public float getWeight()\n  \
    \  {\n        return weight;\n    }\n\n    public void setWeight(float weight)\n\
    \    {\n        this.weight = weight;\n    }\n\n    public String getColor()\n\
    \    {\n        return color;\n    }\n\n    public void setColor(String color)\n\
    \    {\n        this.color = color;\n    }\n\n    public String getCountry()\n\
    \    {\n        return country;\n    }\n\n    public void setCountry(String country)\n\
    \    {\n        this.country = country;\n    }\n}\n\nclass Program\n{\n    static\
    \ void printPerson(Person person)\n    {\n        Console.WriteLine(\"Color :\
    \ {0}\", person.getColor());\n        Console.WriteLine(\"Country : {0}\", person.getCountry());\n\
    \        Console.WriteLine(\"Weight : {0}\", person.getWeight());\n        Console.WriteLine(\"\
    Height : {0}\", person.getHeight());\n    }\n\n    static void Main(string[] args)\n\
    \    {\n        Person person1 = new Person();\n        person1.setColor(\"White\"\
    );\n        person1.setCountry(\"India\");\n        person1.setHeight(5.9f);\n\
    \        person1.setWeight(67.5f);\n        printPerson(person1);\n    }\n}\n\
    ```\n\n# C#: Constructors\n\nConstructors are used to initialise the object at\
    \ the time of creation.\n\n#### Syntax\n\n```csharp\nmodifier className(arguments){\n\
    \n}\n```\n\nHere `modifier` is anything like `private`, `public`, `protected`,\
    \ `internal` (or) `protected internal`. As you see constructors don't have any\
    \ return type and constructor name equals to the class name.\n\nConstructor that\
    \ don’t has any arguments is called default constructor.\n\nIf you don't provide\
    \ the constructor, then compiler provides the default constructor for your class.\n\
    \nFollowing is the complete working application.\n\n`Program.cs`\n\n```csharp\n\
    using System;\n\npublic class Employee\n{\n```\n"
