    60\n你通过了，是一等奖\n\n示例输出 4\n请输入您的分数\n80\n你通过了并获得了优异成绩\n\n# C#: switch 语句\n\nswitch\
    \ 语句评估其表达式，然后执行匹配的语句。switch 的体被称为 switch 块。switch 语句可以带有多个 case 或 default 标签。\n\
    \n`Program.cs`\n\n```cs\nusing System;\n\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        Console.WriteLine(\"输入数字\");\n        int number = int.Parse(Console.ReadLine());\n\
    \        switch (number)\n        {\n            case 1:\n                Console.WriteLine(\"\
