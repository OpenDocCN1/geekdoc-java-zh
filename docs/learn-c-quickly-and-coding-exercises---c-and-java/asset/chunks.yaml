    C# 提供了三种`逻辑运算符`：`逻辑运算符` `&&` (与)、`||` (或) 和 `!` (非)。逻辑与也称为 `条件与`，逻辑或也称为 `条件或`。逻辑与、或被称为`短路运算符`，请参下为什么这些被称为短路。\n\
    \n## 逻辑与运算符\n\n| 操作数 1 | 操作数 2 | 结果 |\n| :--- | :--- | :--- |\n| TRUE | TRUE |\
    \ TRUE |\n| TRUE | FALSE | FALSE |\n| FALSE | TRUE | FALSE |\n| FALSE | FALSE\
    \ | FALSE |\n\n**Program.cs**\n```cs\nusing System;\n\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        bool operand1 = true;\n        bool\
    \ operand2 = true;\n        Console.WriteLine(\"operand1 = {0}\", operand1);\n\
    \        Console.WriteLine(\"operand2 = {0}\", operand2);\n        Console.WriteLine(\"\
    operand1 && operand2 = {0}\", (operand1 && operand2));\n\n        operand1 = true;\n\
    \        operand2 = false;\n        Console.WriteLine(\"\\noperand1 = {0}\", operand1);\n\
    \        Console.WriteLine(\"operand2 = {0}\", operand2);\n        Console.WriteLine(\"\
    operand1 && operand2 = {0}\", (operand1 && operand2));\n\n        operand1 = false;\n\
    \        operand2 = true;\n        Console.WriteLine(\"\\noperand1 = {0}\", operand1);\n\
    \        Console.WriteLine(\"operand2 = {0}\", operand2);\n        Console.WriteLine(\"\
    operand1 && operand2 = {0}\", (operand1 && operand2));\n\n        operand1 = false;\n\
    \        operand2 = false;\n        Console.WriteLine(\"\\noperand1 = {0}\", operand1);\n\
    \        Console.WriteLine(\"operand2 = {0}\", operand2);\n        Console.WriteLine(\"\
    operand1 && operand2 = {0}\", (operand1 && operand2));\n    }\n}\n```\n\n**Output**\n\
    ```\noperand1 = True\noperand2 = True\noperand1 && operand2 = True\noperand1 =\
    \ True\noperand2 = False\noperand1 && operand2 = False\noperand1 = False\noperand2\
    \ = True\noperand1 && operand2 = False\noperand1 = False\noperand2 = False\noperand1\
    \ && operand2 = False\n```\n\n**为什么逻辑与被称为短路运算符？**\n如果表达式中的第一个语句求值为 false，则不会执行整个表达式。因此逻辑与被称为`短路逻辑与`。\n\
    \n**Program.cs**\n```cs\nusing System;\n\nclass Program\n{\n    static void Main(string[]\
