    \ = false;\n        Console.WriteLine(\"a = {0}, !a = {1}\", a, !a);\n    }\n\
    }\n```\n\n# C#: 移运算符\n\n## 按位左移(<<)\n\n左移运算符将所有位向左移动一位，即，它简单地将值翻倍。\n\n**语法：**\n\
    `variable << n`\n将变量向左平移 'n' 次。\n`Variable << n` 等于 `variable = variable * 2 power\
    \ n`\n\n```csharp\nint var = 2;\nvar << 1 = 2 * 2 power 1 = 4\nvar << 2 = 2 *\
    \ 2 power 2 = 8\nvar << 9 = 2 * 2 power 9 = 1024\n```\n\nProgram.cs\n```csharp\n\
    using System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n\
    \        byte byteVar = 7;\n        Console.WriteLine(\"Value of Byte variable\
