    \ + a);\n    }\n}\n```\n\nOutput\nThis statement evaluated\na is not incremented\
    \ 10\na is incremented 11\n\n## 逻辑 (!)NOT 运算符\n\n| 操作数 | 结果为 |\n| :--- | :---\
