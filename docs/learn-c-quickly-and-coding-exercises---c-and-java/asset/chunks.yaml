    周四\");\n                break;\n            case 6:\n                Console.WriteLine(\"\
    周五\");\n                break;\n            case 7:\n                Console.WriteLine(\"\
    周六\");\n                break;\n            default:\n                Console.WriteLine(\"\
    无效数字\");\n                break;\n        }\n    }\n}\n```\n\n输出\n5\n周四\n\n输出\n\
    10\n无效数字\n\n# C#: goto 语句\n\n通过使用 goto 语句，我们可以将控制流转移到标签。标签是程序中的标记，你的代码可以直接跳转那里。\n\
    \n### 语法\n\n```cs\ngoto label;\n```\n\n`Program.cs`\n\n```cs\nusing System;\n\n\
