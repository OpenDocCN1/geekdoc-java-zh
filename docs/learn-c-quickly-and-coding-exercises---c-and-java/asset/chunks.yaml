    ```\n\n示例输出 1\n5\n错误选择\n\n示例输出 2\n10\n你输入了 10\n成功退出\n\n# C#: while 循环\n\nwhile\
    \ 语句在特定条件为真时执行语句块\n\n### 语法\n\n```cs\nwhile (expression) {\n    //语句\n}\n```\n\
    \nwhile 语句中的表达式必须求值为布尔值，否则编译器会报错。while 语句首先评估表达式，只要表达式为真，它就会执行 while 块中的代码，否则跳出\
    \ while 循环。\n\n`Program.cs`\n\n```cs\nusing System;\n\nclass Program\n{\n    static\
