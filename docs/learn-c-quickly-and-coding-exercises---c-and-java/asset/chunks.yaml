    \ Right 8\nAfter shifting 5 bits Right 4\nAfter shifting 6 bits Right 2\nAfter\
    \ shifting 7 bits Right 1\nValue of int variable is 128\n\n# C#: 按位运算符\n\n## 按位与(&),\
    \ 按位或(|), 按位异或(^)\n\nProgram.cs\n```csharp\nusing System;\n\nclass Program\n{\n\
    \    static void Main(string[] args)\n    {\n        byte a = 8;\n        byte\
