- fmt: "\n![](Images/cover00306.jpeg)\n\n# LEARN C# QUICKLY AND CODING EXERCISES C\
    \ AND JAVA CODING FOR BEGINNERS WITH HANDS ON PROJECTS BY J J TAM\n\n# Introduction\
    \ to C#\n\nC# is a programming language that supports more than one programming\
    \ paradigm. The basic syntax of C# is similar to that of C, C++ and Java. So if\
    \ you are familiar with any one of these languages, you can learn C# just like\
    \ that.\n\n## What is multi-paradigm programming language?\n\nA Language that\
    \ supports more than one programming paradigm is called multi-paradigm programming\
    \ language. C# is a multi-paradigm programming language, it supports both imperative\
    \ and object-oriented paradigms. C# support some level of functional programming\
    \ also.\n\n## C# Vs .net\n\nC# is a programming language, and `.NET` is a framework.\
    \ `.NET` has various languages under it. C# is one of the language in `.NET`.\n\
    \n### What is the latest version of C#?\n\nAt the time of writing this article,\
    \ the most recent version is C# 6.0 which was released in 2015.\n\n### Prerequisites\
    \ to work with C#\n\nInstall Visual studio. You can get the community edition\
    \ from following link.\n\nhttps://www.visualstudio.com/vs/community/\n\n# C#:\
    \ Hello World Program\n\nI hope, you installed Visual studio. Following step-by-step\
    \ procedure explains simple ‘Hello World’ application.\n\n### Step 1: Open Visual\
    \ studio\n\n[![https://2.bp.blogspot.com/-k1u5i75B59Q/W3bIOR6l6rI/AAAAAAAAK6E/GQI1hkAGvWIJQvBdar3U7J](https://2.bp.blogspot.com/-k1u5i75B59Q/W3bIOR6l6rI/AAAAAAAAK6E/GQI1hkAGvWIJQvBdar3U7J)]\n\
    \nStep 2: Go to File -> New -> Project.\n\nSelect “Console Application”, give\
    \ the project name as `HelloWorld`.\n\nPress OK.\n\nIt creates a file `Program.cs`,\
    \ with some default data.\n\nUpdate the program like below.\n\n```csharp\nusing\
    \ System;\n\nnamespace HelloWorld\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            Console.WriteLine(\"Hello World\"\
    );\n            Console.WriteLine(\"Welcome To C# Programming.........\");\n \
    \       }\n    }\n}\n```\n\nPress `CTRL + F5`, it opens command prompt and show\
    \ the strings that we passed to `Console.WriteLine` method.\n\n## Let’s analyze\
    \ the program\n\n`using System`\n\nAbove statement loads a names space `System`.\
    \ Name spaces are used to organize the code. A name space is a collection of classes,\
    \ interfaces, enums, structs & delegates.\n\n`namespace HelloWorld`\n\nAbove statement\
    \ gives the name space `HelloWorld` to this program. It is optional. You can even\
    \ run the program without this statement.\n\n```csharp\nusing System;\n\nclass\
    \ Program\n{\n    static void Main(string[] args)\n    {\n        Console.WriteLine(\"\
    Hello World\");\n        Console.WriteLine(\"Welcome To C# Programming.........\"\
    );\n    }\n}\n```\n\n`class Program`\n\nClass is used to encapsulate methods and\
    \ properties as single entity. Ignore this for time being, I will explain about\
    \ this in later posts.\n\n`static void Main(string[] args)`\n\n`Main` method is\
    \ the entry point of your C# application. Application executions starts from here.\n\
    \n`Console.WriteLine(\"Hello World\");`\n\nAbove statement writes the message\
    \ \"Hello World\" to console. `Console` is the class resides in name space `System`.\
    \ `WriteLine` is the method of class `Console`.\n"
