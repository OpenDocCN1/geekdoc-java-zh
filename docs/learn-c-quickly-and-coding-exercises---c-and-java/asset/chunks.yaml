    diff after -=: 7\nproduct after *=: 20\nquotient after /=: 5\nremainder after\
    \ %=: 1\n\n# C#: 三元运算符\n\n## 三元运算符(? :)\n\n根据条件返回两个表达式之一。\n\n**语法：**\n`condition\
