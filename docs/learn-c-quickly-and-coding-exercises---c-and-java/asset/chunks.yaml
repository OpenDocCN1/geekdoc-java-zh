    a | b is \" + (a | b));\n        Console.WriteLine(\"a ^ b is \" + (a ^ b));\n\
    \    }\n}\n```\n\nOutput\n`a & b is 8`\n`a | b is 9`\n`a ^ b is 1`\n\n**解释：**\n\
    `a & b is 8`\n`a | b is 9`\n`a ^ b is 1`\n\n# C#: 复合赋值\n\n## 复合赋值\n\n**语法：**\n\
