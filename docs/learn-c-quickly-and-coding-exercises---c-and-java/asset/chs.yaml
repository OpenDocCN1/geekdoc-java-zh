  \n重新审视原文，最后部分存在一些杂乱的重复描述，我将根据“不要重复输出原文”的原则，对翻译内容进行逻辑清理：\n\n输出：\nColor : White\n\
  Country : India\n\n实例变量（Instance variables）\n\n字段（Fields）\n\n字段声明语法：\n```csharp\n\
  modifier dataType name;\n```\n\n`modifier` 是任何如 `public`, `private`, `protected`,\
