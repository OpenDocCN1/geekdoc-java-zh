  \n# 显示菱形结构\n\n![](img/image0305.jpeg)\n\n### JAVA 代码\n```java\nimport java.util.Scanner;\n\
  \npublic class Main {\n  public static void main(String[] args) {\n    Scanner in\
  \ = new Scanner(System.in);\n    System.out.print(\"Input the number: \");\n   \
  \ int n = in.nextInt();\n    int count = 1;\n    int no_of_spaces = 1;\n    int\
  \ start = 0;\n    for (int i = 1; i < (n * 2); i++) {\n      for (int spc = n -\
  \ no_of_spaces; spc > 0; spc--) {\n        System.out.print(\" \");\n      }\n \
  \     if (i < n) {\n        start = i; //for number\n        no_of_spaces++; //for\
  \ spaces\n      } else {\n        start = n * 2 - i; //for number\n        no_of_spaces--;\
  \ //for space\n      }\n      for (int j = 0; j < count; j++) {\n        System.out.print(start);\n\
  \        if (j < count / 2) {\n          start--;\n        } else {\n          start++;\n\
  \        }\n      \n      if (i < n) {\n        count += 2;\n      } else {\n  \
  \      count -= 2;\n      }\n      System.out.println();\n    }\n  }\n}\n```\n\n\
