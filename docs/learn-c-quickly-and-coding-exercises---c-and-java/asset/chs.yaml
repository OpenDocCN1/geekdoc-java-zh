  \n访问修符（Access Modifiers）（public, private）\n\n`private`：字段仅在其所属类内部访问。例如，考虑 `Person`\
  \ 类中的 `height`, `weight`, `country`。在 `Person` 类内部定义的方法可以访问这些变量，但在类外部不能。\n\n`public`：如果你使用\
