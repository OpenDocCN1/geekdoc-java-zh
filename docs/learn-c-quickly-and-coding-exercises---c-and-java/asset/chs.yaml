- "# 快速上手 C# 与编程练习 - C 与 Java\n\n\n\n![](img/cover00306.jpeg)\n\n\n# C# 简介\n\nC#是一种支持多种编程范式的编程语言。C#\
  \ 的基本语法与 C、C++ 和 Java 相似。因此，如果你熟悉其中任何一种语言，你可以同样地学习 C#。\n\n## 什么是多范式编程语言？\n\n支持一种以上编程范式的语言称为多范式编程语言。C#\
  \ 是一种多范式编程语言，它同时支持命令式和面向对象的范式。C# 也支持某种程度的函数式编程。\n\n## C# 与 .net\n\nC# 是一种语言，而 `.NET`\
  \ 是一个框架。`.NET` 下包含多种语言。C# 是 .NET 中的语言之一。\n\n### C# 的最新版本是什么？\n\n在编写本文时，最新版本是 2015\
  \ 年发布的 C# 6.0。\n\n### 使用 C# 的先决条件\n\n安装 Visual Studio。你可以通过以下链接获取社区版。\n\nhttps://www.visualstudio.com/vs/community/\n\
  \n# C#：Hello World 程序\n\n我希望你已经安装了 Visual Studio。以下步骤解释了简单的“Hello World”应用程序。\n\n\
  ## 步骤 1：打开 Visual studio\n\n[![`2.bp.blogspot.com/-k1u5i75B59Q/W3bIOR6l6rI/AAAAAAAAK6E/GQI1hkAGvWIJQvBdar3U7J`](https://2.bp.blogspot.com/-k1u5i75B59Q/W3bIOR6l6rI/AAAAAAAAK6E/GQI1hkAGvWIJQvBdar3U7J)]\n\
  \n步骤 2：进入文件 (File) -> 新建 (New) -> 项目 (Project)。\n\n选择“控制台应用程序 (Console Application)”，将项目命名为\
  \ `HelloWorld`。\n\n按确定。\n\n这将创建一个带有默认数据的 `Program.cs` 文件。\n\n如下所示更新程序：\n\n```csharp\n\
  using System;\n\nnamespace HelloWorld\n{\n    class Program\n    {\n        static\
  \ void Main(string[] args)\n        {\n            Console.WriteLine(\"Hello World\"\
  );\n            Console.WriteLine(\"Welcome To C# Programming.........\");\n   \
  \     }\n    }\n}\n```\n\n按下 `CTRL + F5`，它将打开命令行并显示我们传递给 `Console.WriteLine` 方法的字符串。\n\
  \n## 分析程序\n\n`using System`\n\n上述语句加载了命名空间 `System`。命名空间用于组织代码。命名空间是类、接口、枚举、结构体和委托的集合。\n\
  \n`namespace HelloWorld`\n\n上述语句为此程序指定了命名空间 `HelloWorld`。这是可选的。你甚至可以在不使用此语句的情况下运行程序。\n\
  \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n\
  \    {\n        Console.WriteLine(\"Hello World\");\n        Console.WriteLine(\"\
  Welcome To C# Programming.........\");\n    }\n}\n```\n\n`class Program`\n\n类用于将方法和属性封装成单一实体。暂时请忽略它，我将在后的文章中对其进行解释。\n\
  \n`static void Main(string[] args)`\n\n`Main` 方法是你的 C# 应用程序的入口。应用程序的执行从这里开始。\n\n\
  `Console.WriteLine(\"Hello World\");`\n\n上述语句将消息 \"Hello World\" 写入控制台。`Console`\
  \ 是位于命名空间 `System` 中的类。`WriteLine` 是 `Console` 类的方法。\n\n\n\n\n\n# C#: 从控制台读取输入\n\
  \n`Console` 类提供了 `ReadLine` 方法从控制台读取输入。`ReadLine` 方法从控制台读取信息并以字符串格式返回输入。\n\n```csharp\n\
  String name = Console.ReadLine();\n```\n\n`Program.cs`\n\n```csharp\nusing System;\n\
  \nclass Program\n{\n    static void Main(string[] args)\n    {\n        Console.WriteLine(\"\
  欢迎来到 C#, 请输入基本信息\");\n        Console.WriteLine(\"请输入您的姓名\");\n        String name\
  \ = Console.ReadLine();\n        Console.WriteLine(\"请输入您的年龄\");\n        String\
  \ age = Console.ReadLine();\n        Console.WriteLine(\"Hello \" + name + \" 你今年\
  \ \" + age + \" 岁\");\n    }\n}\n```\n\n输出\n```\n欢迎来到 C#, 请输入基本信息\n请输入您的姓名\nJJ TAM\n\
  请输入您的年龄\n26\nHello JJ TAM 你今年 26 岁了\n```\n\n## 占位符语法\n\n在拼接字符串时，使用占位符语法比使用 `+` 运算符更方便。\n\
  \n以下是占位符语法的示例。\n\n```csharp\nConsole.WriteLine(\"Hello {0}. You are {1} years old\"\
  , name, age);\n```\n\n上述语句等同于以下语句。\n\n```csharp\nConsole.WriteLine(\"Hello \" +\
  \ name + \" You are \" + age + \" years old\");\n```\n\n`Program.cs`\n\n```csharp\n\
  using System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n\
  \        Console.WriteLine(\"欢迎来到 C#, 请输入基本信息\");\n        Console.WriteLine(\"\
  请输入您的姓名\");\n        String name = Console.ReadLine();\n        Console.WriteLine(\"\
  请输入您的年龄\");\n        String age = Console.ReadLine();\n        Console.WriteLine(\"\
  Hello {0}\", name);\n        Console.WriteLine(\"You are {0} years old\", age);\n\
  \        Console.WriteLine(\"Hello {1}. You are {0} years old\", name, age);\n \
  \   }\n}\n```\n\n输出\n```\n欢迎来到 C#, 请输入基本信息\n请输入您的姓名\nJJ TAM\n请输入您的年龄\n26\nHello\
  \ JJ TAM\nYou are 26 years old\nHello 26. You are JJ TAM years old\n按任意键继续 . . .\n\
  ```\n\n# C#: 内置类型\n\nC# 支持几乎所有类型的数据类型工作。所有数据类型在 `System` 命名空间中都表示为类。数据类型可以分为以下几类：\n\
  \na. 布尔型：`bool`\nb. 整数：`byte`, `sbyte`, `int`, `uint`, `short`, `ushort`, `long`,\
  \ `ulong`\nc. 浮点型：`double`, `float`, `decimal`\nd. 字符：`char`\ne. `String`\n\n下表总结了所有数据类型\n\
  \n| 短名称 | 类 | 最小值 | 最大值 |\n| :--- | :--- | :--- | :--- |\n| `byte` | `Byte` | 0\
  \ | 255 |\n| `sbyte` | `SByte` | -128 | 127 |\n| `int` | `Int32` | -2,147,483,648\
  \ | 2,147,483,647 |\n| `uint` | `UInt32` | 0 | 4294967295 |\n| `short` | `Int16`\
  \ | -32,768 | 32767 |\n| `ushort` | `UInt16` | 0 | 65535 |\n| `long` | `Int64` |\
  \ -9223372036854775808 | 9223372036854775807 |\n| `ulong` | `UInt64` | 0 | 18446744073709551615\
  \ |\n| `float` | `Single` | -3.402823e38 | 3.402823e38 |\n| `double` | `Double`\
  \ | -1.79769313486232e308 | 1.79769313486232e308 |\n| `decimal` | `Decimal` | ±1.0\
  \ × 10e−28 | ±7.9 × 10e28 |\n| `char` | `Char` | | 表示 Unicode 字符。占用 16 位。 |\n| `string`\
  \ | `String` | | 字符序列 |\n\n注意\n\na. `Float` 变量后加 `f` 后缀。\n   例：`float floatVar =\
  \ 18.18f;`\nb. `Decimal` 变量后加 `m` 后缀。\n   例：`decimal decimalVar = 20.20m;`\n\n`Program.cs`\n\
  \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n\
  \    {\n        byte byteVar = 10;\n        sbyte sbyteVar = 1;\n        int intVar\
  \ = 12;\n        uint uintVar = 13;\n        short shortVar = 14;\n        ushort\
  \ ushortVar = 15;\n        long longVar = 16;\n        ulong ulongVar = 17;\n  \
  \      float floatVar = 18.18f;\n        decimal decimalVar = 20.20m;\n        char\
  \ charVar = 'S';\n        string stringVar = \"String\";\n        Console.WriteLine(\"\
  byteVar = {0}\", byteVar);\n        Console.WriteLine(\"sbyteVar = {0}\", sbyteVar);\n\
  \        Console.WriteLine(\"intVar = {0}\", intVar);\n        Console.WriteLine(\"\
  uintVar = {0}\", uintVar);\n        Console.WriteLine(\"shortVar = {0}\", shortVar);\n\
  \        Console.WriteLine(\"ushortVar = {0}\", ushortVar);\n        Console.WriteLine(\"\
  longVar = {0}\", longVar);\n        Console.WriteLine(\"ulongVar = {0}\", ulongVar);\n\
  \        Console.WriteLine(\"floatVar = {0}\", floatVar);\n        Console.WriteLine(\"\
  doubleVar = {0}\", doubleVar);\n        Console.WriteLine(\"decimalVar = {0}\",\
  \ decimalVar);\n        Console.WriteLine(\"charVar = {0}\", charVar);\n       \
  \ Console.WriteLine(\"stringVar = {0}\", stringVar);\n    }\n}\n```\n\n# C#: 占位符语法\n\
  \n在拼接字符串时，使用占位符语法比使用 `+` 运算符更方便。\n\n以下是占位符语法的示例。\n\n```csharp\nConsole.WriteLine(\"\
  Hello {0}. You are {1} years old\", name, age);\n```\n\n上述语句等同于以下语句。\n\n```csharp\n\
  Console.WriteLine(\"Hello \" + name + \" You are \" + age + \" years old\");\n```\n\
  \n`Program.cs`\n\n```csharp\nusing System;\n\nclass Program\n{\n    static void\
  \ Main(string[] args)\n    {\n        Console.WriteLine(\"欢迎来到 C#, 请输入基本信息\");\n\
  \        Console.WriteLine(\"请输入您的姓名\");\n        String name = Console.ReadLine();\n\
  \        Console.WriteLine(\"请输入您的年龄\");\n        String age = Console.ReadLine();\n\
  \        Console.WriteLine(\"Hello {0}\", name);\n        Console.WriteLine(\"You\
  \ are {0} years old\", age);\n        Console.WriteLine(\"Hello {1}. You are {0}\
  \ years old\", name, age);\n    }\n}\n```\n\n输出\n```\n欢迎来到 C#, 请输入基本信息\n请输入您的姓名\n\
  JJ TAM\n请输入您的年龄\n26\nHello JJ TAM\nYou are 26 years old\nHello 26. You are JJ TAM\
  \ years old\n按任意键继续 . . .\n```\n\n# C#: 内置类型\n\nC# 支持几乎所有类型的数据类型工作。所有数据类型在 `System`\
  \ 命名空间中都表示为类。数据类型可以分为以下几类：\n\na. 布尔型：`bool`\nb. 整数：`byte`, `sbyte`, `int`, `uint`,\
  \ `short`, `ushort`, `long`, `ulong`\nc. 浮点型：`double`, `float`, `decimal`\nd. 字符：`char`\n\
  e. `String`\n\n下表总结了所有数据类型\n\n| 短名称 | 类 | 最小值 | 最大值 |\n| :--- | :--- | :--- | :---\
  \ |\n| `byte` | `Byte` | 0 | 255 |\n| `sbyte` | `SByte` | -128 | 127 |\n| `int`\
  \ | `Int32` | -2,147,483,648 | 2,147,483,647 |\n| `uint` | `UInt32` | 0 | 4294967295\
  \ |\n| `short` | `Int16` | -32,768 | 32767 |\n| `ushort` | `UInt16` | 0 | 65535\
  \ |\n| `long` | `Int64` | -9223372036854775808 | 9223372036854775807 |\n| `ulong`\
