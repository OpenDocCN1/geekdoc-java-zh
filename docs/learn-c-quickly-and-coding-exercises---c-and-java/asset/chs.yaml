  \        Console.WriteLine(\"Hello {0}\", name);\n        Console.WriteLine(\"You\
  \ are {0} years old\", age);\n        Console.WriteLine(\"Hello {1}. You are {0}\
  \ years old\", name, age);\n    }\n}\n```\n\n输出\n```\n欢迎来到 C#, 请输入基本信息\n请输入您的姓名\n\
