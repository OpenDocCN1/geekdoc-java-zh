  ?\na\n中\n```\n\n## C#: 字符串\n\n在 C# 中，字符串由 `String` 类表示。字符串是字符的序列。\n\n`Program.cs`\n\
  \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n\
  \    {\n        string str = \"Hello World\";\n        Console.WriteLine(str);\n\
  \    }\n}\n```\n\n输出\n```\nHello World\n```\n\n## C#: 字符串拼接\n\nC# 提供了多种方法来拼接字符串。\n\
  \n### 1. 使用 `+` 运算符\n\n```csharp\nusing System;\n\nclass Program\n{\n    static\
  \ void Main(string[] args)\n    {\n        string s1 = \"Hello \";\n        string\
  \ s2 = \"World\";\n        string result = s1 + s2;\n        Console.WriteLine(result);\n\
  \    }\n}\n```\n\n### 2. 使用 `String.Concat`\n\n```csharp\nusing System;\n\nclass\
  \ Program\n{\n    static void Main(string[] args)\n    {\n        string s1 = \"\
  Hello \";\n        string s2 = \"World\";\n        string result = String.Concat(s1,\
  \ s2);\n        Console.WriteLine(result);\n    }\n}\n```\n\n### 3. 使用 `String.Join`\n\
  \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n\
  \    {\n        string[] words = { \"Hello\", \"World\", \"!\" };\n        string\
  \ result = String.Join(\" \", words);\n        Console.WriteLine(result);\n    }\n\
  }\n```\n\n### 4. 使用 `String.Format` 或 占位符\n\n```csharp\nusing System;\n\nclass Program\n\
  {\n    static void Main(string[] args)\n    {\n        string name = \"Alice\";\n\
  \        int age = 25;\n        string result = String.Format(\"Hello {0}, you are\
