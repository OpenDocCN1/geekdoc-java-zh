  \ 3.402823e38 |\n| `double` | `Double` | -1.79769313486232e308 | 1.79769313486232e308\
  \ |\n| `decimal` | `Decimal` | ±1.0 × 10e−28 | ±7.9 × 10e28 |\n| `char` | `Char`\
  \ | | 表示 Unicode 字符。占用 16 位。 |\n| `string` | `String` | | 字符序列 |\n\n注意\n\na. `Float`\
