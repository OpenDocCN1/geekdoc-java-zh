  \ 3.402823e38 |\n| `double` | `Double` | -1.79769313486232e308 | 1.79769313486232e308\
  \ |\n| `decimal` | `Decimal` | ±1.0 × 10e−28 | ±7.9 × 10e28 |\n| `char` | `Char`\
  \ | | 表示 Unicode 字符。占用 16 位。 |\n| `string` | `String` | | 字符序列 |\n\n注意\n\na. `Float`\
  \ 变量后加 `f` 后缀。\n   例：`float floatVar = 18.18f;`\nb. `Decimal` 变量后加 `m` 后缀。\n   例：`decimal\
  \ decimalVar = 20.20m;`\n\n`Program.cs`\n\n```csharp\nusing System;\n\nclass Program\n\
  {\n    static void Main(string[] args)\n    {\n        byte byteVar = 10;\n    \
  \    sbyte sbyteVar = 1;\n        int intVar = 12;\n        uint uintVar = 13;\n\
