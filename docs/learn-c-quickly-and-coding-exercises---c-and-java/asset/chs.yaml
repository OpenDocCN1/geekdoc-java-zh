  \ = \"String\";\n        Console.WriteLine(\"byteVar = {0}\", byteVar);\n      \
  \  Console.WriteLine(\"sbyteVar = {0}\", sbyteVar);\n        Console.WriteLine(\"\
  intVar = {0}\", intVar);\n        Console.WriteLine(\"uintVar = {0}\", uintVar);\n\
  \        Console.WriteLine(\"shortVar = {0}\", shortVar);\n        Console.WriteLine(\"\
  ushortVar = {0}\", ushortVar);\n        Console.WriteLine(\"longVar = {0}\", longVar);\n\
  \        Console.WriteLine(\"ulongVar = {0}\", ulongVar);\n        Console.WriteLine(\"\
  floatVar = {0}\", floatVar);\n        Console.WriteLine(\"doubleVar = {0}\", doubleVar);\n\
  \        Console.WriteLine(\"decimalVar = {0}\", decimalVar);\n        Console.WriteLine(\"\
  charVar = {0}\", charVar);\n        Console.WriteLine(\"stringVar = {0}\", stringVar);\n\
  \    }\n}\n```\n\n# C#: 从控制台读取输入\n\n`Console` 类提供了 `ReadLine` 方法从控制台读取输入。`ReadLine`\
  \ 方法从控制台读取信息并以字符串格式返回输入。\n\n```csharp\nString name = Console.ReadLine();\n```\n\n\
  `Program.cs`\n\n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[]\
  \ args)\n    {\n        Console.WriteLine(\"欢迎来到 C#, 请输入基本信息\");\n        Console.WriteLine(\"\
  请输入您的姓名\");\n        String name = Console.ReadLine();\n        Console.WriteLine(\"\
  请输入您的年龄\");\n        String age = Console.ReadLine();\n        Console.WriteLine(\"\
  Hello \" + name + \" 你今年 \" + age + \" 岁\");\n    }\n}\n```\n\n输出\n```\n欢迎来到 C#,\
  \ 请输入基本信息\n请输入您的姓名\nJJ TAM\n请输入您的年龄\n26\nHello JJ TAM 你今年 26 岁了\n```\n\n## 占位符语法\n\
  \n在拼接字符串时，使用占位符语法比使用 `+` 运算符更方便。\n\n以下是占位符语法的示例。\n\n```csharp\nConsole.WriteLine(\"\
