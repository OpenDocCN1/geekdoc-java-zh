  charVar = {0}\", charVar);\n        Console.WriteLine(\"stringVar = {0}\", stringVar);\n\
  \    }\n}\n```\n\n## C#: 字符串中的转义字符\n\n在 C# 中，转义字符使用反斜杠 `\\` 来表示特殊字符。\n\n以下是转义字符的表：\n\
  \n| 转义序列 | 说明 |\n| :--- | :--- |\n| `\\a` | 响铃 |\n| `\\b` | 退格 |\n| `\\f` | 换页 |\n\
  | `\\n` | 新行 |\n| `\\r` | 回车 |\n| `\\t` | 水平表 |\n| `\\v` | 垂直制表 |\n| `\\'` | 单引号\
  \ |\n| `\\\"` | 双引号 |\n| `\\\\` | 反斜杠 |\n| `\\?` | 问号 |\n| `\\ooo` | 八进制字符 |\n|\
