    \ layer—it would look like this:\n\n```\ninitialize weights in network (random\
    \ values)\n\nwhile(examples to process)\n  for example x\n    prediction = neural_output(network,\
    \ x)\n    actual = trained-output(x)\n    error is (prediction - actual) on output\
    \ nodes\n```\n\n```\nbackwardpass:\ncompute weights from hidden layer to the output\
    \ layer\ncompute weights from input layer to hidden layer\n```"
