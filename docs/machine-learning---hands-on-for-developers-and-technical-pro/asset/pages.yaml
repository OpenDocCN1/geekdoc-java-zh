    Using uniq in combination with the -c flag, the output will contain the number
    of repeats that were found within the file. If you do not need to see the counts,
    then you can use the -u flag in the sort command.


    # Showing the Top of a File: head


    When you''ve downloaded a 10,000-line file and you want to quickly inspect it,
    it''s easy to use the head command and dump the whole file out. Obviously, you
    can''t read it as the lines are appearing faster than you. The head command shows
    the output of a defined number of lines.


    ```

    $ head -n 5 sample.txt

    987 1391548780 hhh bbb

    988 1391548781 sda jjj

    989 1391548782 asd msd

    990 1391548783 gjh jkl

    991 1391548784 abc abc

    ```


    If you want to show the last number of lines of the file, then use the tail command.


    # Counting Words: wc


    Using wc counts the number of lines, words, and characters used within the text
    document.


    ```

    $ wc sample.txt

    13 48 277 sample.txt

    ```


    If you want to see only the number of lines, then use -l as an option, -w for
    words, and -m for characters.'
