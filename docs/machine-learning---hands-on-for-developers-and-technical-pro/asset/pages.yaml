  md: '# Chapter Data Acquisition Techniques 47


    The first part of the data is what you want to load into the spreadsheet. The
    second, the type you want to extract; in example, it''s the table. The last part
    is the one to extract. For the airports, it''s the first one I want.


    You''ll see the first cell change to "Loading" while the spreadsheet fetches the
    data and after a few seconds, the data will appear all nice and neat in the spreadsheet
    (see Figure 3.3).


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_71_0.png)


    **Figure 3.3:** Spreadsheet of the busiest airports in the United Kingdom


    To export the data to CSV format, click the tab at the top of the spreadsheet,
    click Download, and save it to a comma-separated values file. This version of
    the data doesn''t have the issues that the copy-and-paste version does. One thing
    to keep in mind is that the the data is still text-based; the commas in the numbers
    will prevent them from being recognized as numeric types automatically, so you
    will still see the commas in their format.


    While this method saves you a lot of time, there are still things you need to
    keep in mind. You''ll have to do another round of cleaning to remove the commas
    on some of the number values. The best way to do that is in the spreadsheet and
    then export the data to CSV.


    # Using an API


    When the Web 2 was being talked about in the early 2000s, the consensus was that
    everyone would have an API and we would acquire all data from each to other to
    the Web Person. I''m not 100 percent convinced that it did. For that, not many
    will have the skills to acquire data in a machine-friendly way.'
