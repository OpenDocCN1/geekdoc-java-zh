  md: '# Chapter 12 Machine Learning Streaming with Kafka 281


    # # Kafka Topics


    In this application, there are four topics. First, there’s the event stream topic;
    this contains the messages for either the training data or the commands to run
    a build on one of the three models we have. If the message contains data, the
    streaming application will push the contents of the message, the CSV data, to
    the training data topic.


    With the commands and training data take care of, it’s just the predictions that
    we need to make. To make a prediction, messages are sent to the prediction request
    topic. This is another JSON payload with the model type to run and make a prediction.
    The prediction response topic is a topic that the results are sent to. The streaming
    application handling the predictions publishes the responses to this topic. For
    this proof of concept, I’m going to assume that a consumer handling this.


    # # Creating the Topics


    The topic creation is done using the kafka-topics command that was covered earlier
    in the chapter. I created a shell script that creates all four topics for you.
    There are three pieces of information the topic command requires: the hostname
    and port for Zookeeper, the replication factor, and the number of partitions.'
