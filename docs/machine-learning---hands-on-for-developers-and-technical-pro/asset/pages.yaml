    I previously mentioned in regard to gathering data for neural networks, more variables
    give the curse of dimensionality.


    The more you use for training, the better the prediction results will be. There
    is a point in time to figure out there''s too much training data against the errors
    per epoch. It takes some practice (and everyone''s data is different, so there''s
    no hard or fast rule), and it''s a case of experiment, measure, and try again.


    # Implementing a Neural Network in Java


    With the Weka API, you can build a neural network with the same multilayer perceptron
    that Weka uses within the GUI.


    # Creating the Project


    Select File -> New Project and call it MLPProcessor, as shown in Figure 9.13.

    You need to tell Eclipse the Weka API; it''s called weka.jar. On macOS machines,
    Weka is usually installed in the Applications directory. The location on Windows
    machines varies depending on the specific operating system and Weka installation.
    In most cases, it will be /Program Files (x86)/Weka-3-8/weka.jar.


    With the WekaCluster project, select File -> Properties and for the Java Build
    Path. Then click the Libraries tab. Add the external jar file by clicking External
    JARs; then in the file dialog box find the weka.jar file, as shown in Figure 9.14.'
