- pgno: 34
  md: '# Gaming Analytics


    We''ve already established that checkers is a good candidate for machine learning.
    Do you remember those old chess games with the realistic pieces? The human player
    made a move, and then the computer made a move. Well, that''s a case of machine
    learning algorithms in action. Fast-forward a few decades (the chess computer
    still feels like yesterday) to today when the console market is pumping out analytics
    data every time you play your favorite game.


    Microsoft has spent time studying the data from Halo 3 to see how players perform
    on certain levels and also to figure out when players are using cheats. Fixes
    have been created based on the analysis of data coming back from the consoles.
    Other producers like Blizzard (Overwatch), Epic Games (Fortnite), and Respawn
    Entertainment (Apex Legends) use matrix calculations to ensure that players are
    suitably matched before a game can start.


    Microsoft also created Drivatric, which is incorporated into the driving Forza
    Motorsport. When you play the game, it knows nothing about your driving style.
    Over a period of practice the system learns your style, consistency pets on corners,
    and positioning on the track. The sampling happens over three laps, which is enough
    time to see how your driving behaviors. After you''ve learned the game your driving
    style, the game opens up new levels and let you compete with other drivers and
    earn your friends.


    Even within story-based games like The Last of Us by Naughty Dog, characters within
    gameplay scenes are aware of their surroundings and other characters within the
    gameplay. For example, if a bottle is thrown and smashes, enemies, friends, and
    infected alike would be alerted and their next moves decided by in-play artificial
    intelligence.


    If you have children, you might have seen the likes of Nintendoogs (cats), or
    a game where a person is tasked with looking after an on-screen pet (Think Tamagotchi,
    but on a larger scale) Algorithms can work out when the pet needs to play, how
    to react to the owner, and how hungry the pet is.


    It''s the early days of game companies putting machine learning into infrastructure
    to make the games better. With more and more games appearing on small devices,
    such as those with the iOS and Android platforms, the real learning is how to
    make players come back and play more. Analysis can be performed over the “stickiness”
    of the game—do players return to play again, or do they drop off over a period
    of time in favor of something else? Ultimately there''s a trade-off between the
    level of machine learning and gaming performance, especially in smaller devices.
    Higher levels of machine learning require more memory within the device. Sometimes
    you have to factor in the limit of what you can learn from the game.'
