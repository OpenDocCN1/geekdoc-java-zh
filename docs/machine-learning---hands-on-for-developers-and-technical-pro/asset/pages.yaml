    | Estimate Std. Error t Pr(|t|) |

    | (Intercept) 0.6226 4.8981 0.127 0.901 |

    | dollarProfit 16.2286 0.7681 21.1229 1.9e-11 *** |


    Signif. codes: 0 *** 0.001 *** 0.01 ** 0.05 '' 0.1 '' 1

