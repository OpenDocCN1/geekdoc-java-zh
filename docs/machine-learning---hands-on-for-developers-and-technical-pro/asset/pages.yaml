    # Robotics


    Using machine learning, robots can acquire skills or learn to adapt to the environment
    in which they are working. Robots can acquire skills as object placement, grasping
    objects, and locomotion skills through either automated learning or learning via
    human intervention.


    With the increasing number of sensors within robotics, other algorithms could
    be deployed outside of the robot for further analysis.


    We can''t talk about robotics without mentioning the self-driving car. Huge strides
    have been made since the first edition of this book. Tesla has the autopilot enabling
    the car to self-drive while the driver is still close by hands near the wheel.
    It''s still in the early days, and there is the obvious discussion about job displacement
    and the resulting new job creation.


    # Medicine and Healthcare


    The race is on machine learning to be used in healthcare analytics. A number of
    startups are looking at the advantages of machine learning with Big Data to provide
    healthcare professionals with better-informed data to enable them to make better
    decisions.


    IBM''s famed Watson supercomputer, once used to win the television quiz Jeopardy
    against two human contestants, is being used to help doctors. Watson as a service
    on the cloud, doctors can access learning on millions of pages of medical research
    and hundreds of thousands of pieces of information on medical evidence.


    With the number of consumers using smartphones and the related devices for collating
    a range of health information—such as weight, heart rate, pulse, pedometers, blood
    pressure, and even glucose levels—it''s now possible to track and trace user health
    regularly and see patterns in dates and times. Machine learning systems can recommend
    healthier alternatives to the user via the device.'
