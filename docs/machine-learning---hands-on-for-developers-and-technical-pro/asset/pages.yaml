  md: "Finally, with all the documents loaded into separate List objects, a final\
    \ List of documents is created.\n\n```\nList<List<String>> allDocuments = Arrays.asList(wordDoc1,\
    \ wordDoc2, wordDoc3, wordDoc4, wordDoc5);\n```\n\n# Calculating the Term Frequency\n\
    \nThe term frequency is the number of times a phrase is in the document; in this\
    \ example we're using an iterator over the list of words and seeing whether the\
    \ term matches.\n\nIf there is a match, the count is increased by:\n\n```\npublic\
    \ double getTermFrequency(List<String> doc, String term) {\n  double result =\
    \ 0;\n  for (String word : doc) {\n    if (term.equalsIgnoreCase(word)) {\n  \
    \    result++;\n    }\n  }\n  return result / doc.size();\n}\n```\n\nThe final\
    \ step of calculating the term frequency is to divide the number of occurrences\
    \ against the size of the document.\n\n# Calculating the Inverse Document Frequency\n\
    \nThe inverse document frequency is calculated against all the documents in the\
    \ corpus, this is why the collection of word lists was created when the files\
    \ were loaded. This measure provides us with an indication of how common, or rare,\
    \ the term is against the complete corpus of documents.\n\nSimilarly, the term\
    \ frequency calculation is counted against all the documents, iterating through\
    \ each.\n\n```\npublic double getInverseDocumentFrequency(List<List<String>> allDocuments,\
    \ String term) {\n  double wordOccurrences = 0;\n  for (List<String> document\
    \ : allDocuments) {\n    if (term.equalsIgnoreCase(word)) {\n      wordOccurrences++;\n\
    \      break;\n    }\n  }\n  return Math.log(allDocuments.size() / wordOccurrences);\n\
    }\n```"
