  md: "(been,116)\n(they,.2)\n(chests,,1)\n(proceedings;,1)\n(battering,2)\n(contemptible,2)\n\
    \nIn three lines you performed a basic MapReduce program on some raw text. Notice\
    \ that I didn't remove odd characters and convert everything to lowercase, but\
    \ essentially gave us the word count output.\n\n# # Writing Stand-Alone Programs\
    \ with Spark\n\nWhile it is possible to perform some basic transforms and applications\
    \ of scripts with the Spark REPL, the real power comes from the APIs that are\
    \ available. This means that it's possible to build data applications in Java,\
    \ Python, Scala, or any other supported language. For the duration of this chapter,\
    \ I will keep with Java. If you are a Clojure developer, then it's worth investigating\
    \ the Sparkling Spark wrappers for Clojure (http://gorillalabs.github.io/sparkling/).\n\
    \n# # Spark Programs in Java\n\nEarlier in the chapter I showed how to perform\
    \ a basic word count on the Mobi Dick text. For this example, I'll cover the basics\
    \ of writing an application in Java to do the same in Spark. The workflow is broken\
    \ down into three parts.\n\n+   - The code\n- The Maven build file (pom.xml)\n\
    - Deployment to Spark to run the basic word count\n\nThe following Java code is\
    \ the basic word count application:\n\n```\npackage mlbook.ch13.spark;\n\nimport\
    \ org.apache.spark.api.java.JavaRDD\nimport org.apache.spark.sql.SparkSession\n\
    import scala.Tuple2;\nimport org.apache.spark.api.java.JavaPairRDD;\nimport java.util.List;\n\
    import java.util.regex.Pattern;\n\npublic final class BasicSparkCount {\n    private\
    \ static final Pattern SPACE = Pattern.compile(\" \");\n```"
