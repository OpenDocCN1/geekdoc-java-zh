- pgno: 273
  md: '# Chapter 12 Machine Learning Streaming with Kafka 251


    As I can never tell what type of Kafka cluster I''ll be working on, I use a generic
    tool called Kafka Tool (see Figure 12.6), which is available from http://www.kafkatool.com
    and free for personal use. It runs on macOS, Linux, and Windows.


    Once it''s installed, you have an overview of your cluster and can inspect the
    general information, get the Zookeeper status, and view your topic and consumer
    group information. It''s useful for inspecting message contents and checking the
    offset information of topics too. Sometimes it is hard to read from the command
    line, and a tool as this one can make a life little easier.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_273_0.png)


    Figure 12.6: Kafka Tool


    # Writing Your Own Producers and Consumers


    So far, the emphasis has been on the Kafka brokers and the command-line tools
    to do some basic tasks such as create topics and manage them. Now it''s time to
    concentrate on writing some basic applications to send messages to the brokers
    and read messages from them too.


    Various client libraries cover the majority of languages; for a list of what''s
    available, take a look at this list here:


    ```

    https://wiki.apache.org/confluence/display/KAFKA/Clients

    ```


    For this chapter, there are examples of producers and consumers in Java. Later
    in the chapter, you''ll see Kafka code written in both Java and Clojure; both
    run off the same client APIs.


    # Producers in Java


    As you''ll see in both these sections, the process of producing and consuming
    messages is quite simple. There is some preliminary setup that is required before
    you start working with the broker. Each segment of the application is explained
    first, and you can then see the completed code.'
