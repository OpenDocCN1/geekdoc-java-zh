  md: '# Chapter 12 Machine Learning Streaming with Kafka 283


    # Kafka Connect


    Within the Kafka ecosystem is Kafka Connect, which is basically a consumer application
    that can either act as a source, consuming data from an application, or as a sink,
    persisting or sending data to an application.


    For this application there are two Connect sinks in operation—one to back up all
    the messages passing through the event topic and the other that persists the training
    data for the models to train again.


    # Why Persist the Event Data?


    As you have seen throughout this chapter, the Kafka system is an immutable message
    log. Brokers have configurations, and as you''d expect, one of these settings
    is log retention, in other words, how long messages within the cluster are kept
    to be available to consumers.


    The reason for creating the event sink, even though it''s not used by an application,
    is to create a record of each data event in case we need to run from scratch.
    If that needs happen, then all''s required is to play the JSON payloads through
    the event_topic again. It would be prudent to reset all the models and start from
    scratch. It gives a mechanism for disaster recovery.


    # Persisting Event Data


    The Connect configuration requires a name and a topic to read from. The key and
    value converters will deserialize the data so it can be persisted safely. Connect
    requires a file path to write the data.


    With the configuration options put together, the final Connect configuration looks
    like this:


    ```

    name=dl4j-events-file-sink

    connector.class=FileStreamSink

    tasks.max=1

    file=/opt/ml/testdata/events/events.json

    topic=event_topic

    key.converter=org.apache.kafka.connect.storage.StringConverter

    value.converter=org.apache.kafka.connect.storage.StringConverter

    ```'
