    # # Multilayer Perceptrons


    The problem with single-layer perceptrons is that they are linearly separable.
    The output is either one value or another.


    If you think of an AND gate in logic theory, there is only one outcome if you
    have two inputs, as shown in Table 9.1.


    Table 9.1: AND Gate Output Table

    | INPUT | OUTPUT |

    | Off and On | Off |

    | On and Off | Off |

    | Off and Off | Off |

    | On and On | On |


    The perceptron would be fashioned as shown in Figure 9.5.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_194_1.png)


    **Figure 9.5:** AND gate perceptron'
