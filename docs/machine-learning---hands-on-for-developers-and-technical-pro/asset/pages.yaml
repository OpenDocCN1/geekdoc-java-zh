    \ \" + dabibus + \" \" + score\");\n}\n```\n\n# # Word2Vec\n\nThe WordVec algorithm\
    \ was developed by Google. It comprises a neural network of two layers. With a\
    \ large corpus of text you can achieve very accurate vector results. Groups of\
    \ words will appear closer within the vectors. It's not just limited to text;\
    \ you can use this method on anything where patterns of associations would occur;\
    \ this might be personality scorings in a social network or what kind of music\
    \ you are into.\n\nThe Word2Vec algorithm is based on vectors, called *neural\
    \ word embeddings*, representing a word with numbers. Word2Vec trains against\
    \ other words in the input text. This is done in two ways, either using a continuous\
    \ bag of words (CBOW), which is a context of words to predict a target word, or\
    \ skip grams, which takes a word and predicts a context of words.\n\nWords are\
    \ read in the vector one at a time and scanned within a certain range of words;\
    \ these skip-grams are an n-gram with items dropped. During the training, the\
    \ vector contains the context of each word and the similarity against other words\
    \ in the vector space.\n\nIn this section, I will outline how to construct a Word2Vec\
