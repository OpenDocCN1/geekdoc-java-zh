  md: '# Chapter 14 = Machine Learning with R 359


    The downloaded binary packages are in /var/folders/b5/fz_57qk522nd6vgk2pd4lytr0000gn/T//Rtmpgp3zNQ/downloaded_packages


    The rjava package uses JNI to Java libraries. From the point of view of working
    within R, things might seem a little cumbersome, but they do work.


    # Creating Your Java Code in R


    Open your R console or R-Studio. Assuming you''ve installed the package described
    earlier in this chapter, you can do the following:


    ```

    > library(rJava)

    > .jinit()

    > stringobj <- .jnew("java/lang/String", "This is a string as a Java object, in
    R")

    > stringobj

    > [1] "Java-Object(This is a string as a Java object, in R)"

    ```


    After the library is loaded, you need to initialize the rjava system with .jinit()
    method. You then create a new variable in R that is containing a Java string object.
    The .jnew() method creates a new String object and populates the string. Notice
    that you have to put the full Java package name in with slashed notation and not
    the dotted one.


    If you want to find the position of the word Java in the string, you use Java''s
    indexOf method. You call it with Java by executing the following:


    ```

    [1] "Java-Object(This is a string as a Java object, in R)"

    > .jcall(stringobj, "I", "indexOf", "Java")

    [1] 22

    ```


    The command looks involved. The first parameter is the existing object you previously
    created. The next is the return type from method; because the indexOf method returns
    an integer, you use the "I" in the calling method. The method name—“indexOf"—and
    the last is the thing you are looking for, "Java". You see the result on the line
    under.


    For the full package information for the rjava interface, take a look at the method
    list


    ```

    http://rforge.org/doc/packages/rJava/00Index.html

    ```


