  md: '# Chapter 11 ■ Machine Learning with Images 231


    The CNNs are usually run over several iterations, so you end up with a process
    along the lines of: Convolution ↞ ReLU ↞ Max Pooling ↞ Convolution ↞ ReLU ↞ Max-Pooling
    and ending with some form of classification, to give you a fully connected layer.


    The max-pooling outputs are fed into a neural network for classification. In most
    cases, this is a multilayer perceptron, same that''s covered in Chapter 9. The
    weights of the MLP will determine the classification.


    The CNN is a powerful algorithm, and it''s used widely for object detection, speech
    recognition, and image processing. There are various frameworks and architectures
    using CNNs, and it''s worth the time to investigate how they are being implemented
    and used.


