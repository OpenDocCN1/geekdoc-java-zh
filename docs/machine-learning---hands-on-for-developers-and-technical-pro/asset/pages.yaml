  md: "# Loading the Raw Text Data\n\nThe first job is to load the raw text. The SentenceIterator\
    \ will give an iterator and pre | the file with the preProcess method within the\
    \ inner class. Here I'm going to convert the string to lowercase.\n\n```\npublic\
    \ SentenceIterator createSentenceIterator(String filepath) {\n    SentenceIterator\
    \ iter = new SentenceIterator(new\n    File(filepath));\n    iter.setPreProcessor(new\
    \ SentencePreProcessor() {\n        public String preProcess(String sentence)\
    \ {\n            return sentence.toLowerCase();\n        }\n    });\n    return\
    \ iter;\n}\n```\n\n# Tokenizing the Strings\n\nThe next job is to tokenize the\
    \ strings. For the basic one-word tokenizer splitting on a whitespace, the CommonPreprocessor\
    \ will work for us.\n\n```\npublic TokenizerFactory createTokenizer() {\n    TokenizerFactory\
    \ t = new DefaultTokenizerFactory();\n    t.setTokenPreprocessor(new CommonPreprocessor());\n\
    \    return t;\n}\n```\n\n# Creating the Model\n\nWith our iterator and tokenizer\
