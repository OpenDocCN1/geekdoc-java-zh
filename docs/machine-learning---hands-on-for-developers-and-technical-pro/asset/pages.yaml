  md: '# Setting the Options


    Click the Classify tab and click the Choose button to select a different classification
    algorithm. Within the tree of algorithms, click Functions and then select LibSVM,
    as shown in Figure 8.9.

    There are a couple of changes to make before you select the classifier to work.
    First, you may want a percentage of training data against test data. In this case,
    you can be fairly confident that the data is not going to be difficult to classify
    and it’s not going to be a nonlinear classification problem; you can train with
    10 percent of the data (10,000 rows) and with the 90 percent to see how it performs.

    Click the Split option and change the default value of 66 percent to 10 percent,
    as shown in Figure 8.10.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_177_0.png)


    **Figure 8.9:** Choosing the LibSVM classifier


    You want the results of the test data, the 90 percent to be output to the Weka
    console so you can see how it’s performing. Click the Options button and ensure
    that the Output Predictions checkbox is ticked, as shown in Figure 8.11.

    The LibSVM wrapper defaults to a radial basis function for its kernel type. Change
    that to the linear version you’ve been concentrating on by clicking the line with
    all the LibSVM options. This is located next to the Choose button within the Classifier
    pane.'
