    \ If this is split into multiple two- or three-word n-grams, it may be possible\
    \ to predict the next word groupings based on the n-gram sequences.\n\nA two-gram\
    \ sequence of the sentence would look something like this:\n\n(you are), (are\
    \ worthy), (worthy you), (you are), (are family)....\n\nAnd so on. Interestingly,\
    \ there are 2-gram sequences of (you are) with two following patterns, the worthy\
