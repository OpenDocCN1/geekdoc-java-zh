- pgno: 41
  md: '# Chapter 2 Planning for Machine Learning


    You can acquire data from many sources; it might be data that''s held by your
    organization or open data from the Internet. There might be one dataset, or there
    could be 10 or more.


    You must come to accept that data will need to be cleaned and checked for quality
    before any processing can take place. These processes occur during the prepare
    phase.


    The processing phase is where the work gets done. Machine learning routines that
    you have created this phase.


    Finally, the results are presented. Reporting can happen in a variety of ways,
    such as reinvesting the data into a data store or reporting the results as a spreadsheet
    or report.


    # It All Starts with a Question


    There seems to be a misconception that machine learning, like Big Data, is a case
    of throwing enough data at the problem that the answers magically appears. As
    if Id like to say this all the time, it doesn''t. Machine learning projects start
    with a few question that needs investigating. I''ve encountered this quite a few
    times speaking to people about their companies'' ambitions and what they are looking
    to achieve with the likes of machine learning and Hadoop.


    Using a whiteboard, sticky notes, or even a sheet of paper, start asking questions
    like the following:


    +   - Is there a correlation between our sales and the weather?

    - Do sales on Saturday and Sunday generate the majority of revenue to the business
    compared to the other five days of the week?

    - We can plan fashions to stock in the next three months by looking at Twitter
    data for popular hashtags

    - We can tell when our customers become pregnant?


    All these are reasonable questions, and they also provide the basis for proper
    discussion. Stakeholders will usually come with the questions, and then the data
    project team (which might be one person—you'') can spin into action.


    Without knowing the question, it''s difficult to know where to start. Anyone who
    thinks the answers just pop out of air needs a polite, but firm, explanation of
    what has to happen for the answers to be discovered.


    # I Don''t Have Data!


    This sounds like a silly statement when you have a book on machine learning in
    your hands, but sometimes people just don''t have the data.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Chapter 2 = Planning for Machine Learning 17


    In an ideal world, we expect companies to have well-groomed customer relationship
    management (CRM) systems and neat repositories of data that could be retrieved
    on a whim and copied nicely into a Hadoop filesystem, countless MapReduce jobs
    could (read more about MapReduce in Chapter 13, "Apache Spark and MLLib")


    Data comes from a variety of sources. Plenty of open data initiatives are available,
    so you have a good chance of able to find some data to work with.


    # Starting Local


    Perhaps you could make a difference in your local community; see what data they
    have with open data which you can experiment. New York City has a portal of open
    data with more than 1,100 datasets for citizens to download and learn from. Hackathons
    and competitions encourage people to get involved and give back to the community.
    The results of the hackathons make a difference because insights about how the
    local community is run are fed back to the event organizers. If you can''t find
    the dataset you want, then you are also encouraged to request it.


    # Transfer Learning


    With the amount of machine learning now being executed out in the field, it may
    be worth looking into existing models and altering certain parameters to fit in
    your prediction data, especially if you don''t have much in the way of training
    data. This is called *transfer learning*. It''s perfect for models that require
    large scale datasets for training, such as images, video, and large text corpus.
    I will highlight some transfer learning examples in later chapters.


    # Competitions


    If you fancy a real challenge, then think about entering competitions. One of
    the most famous was the Netflix Prize, which was a competition to improve the
    recommendation algorithm for the Netflix film service.


    Teams were competing downloaded sample sets of user data and worked like the winning.
    The team was the one that improved the predictions of moves that customers would
    by 10 percent. In 2009, the $1 million prize was awarded to "BellKor''s Pragmatic
    Chaos." This triggered a new wave of competitions, letting the data out into the
    open so collaborative teams could improve things.


    In 2010, Anthony Goldbloom found Kaggle.com, which is a platform for predictive
    modeling and analytics competitions. Each competition has sample datasets and
    a brief of the desired outcome. Either teams or individuals can enter, and the
    most effective algorithms, similar to the Netflix Prize, decide the winner.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 18 Chapter 2 Planning for Machine Learning


    Is competition effective? It seems to be. Kaggle has more than 100,000 data scientists
    registered from across the world. Organizations such as Facebook, NASA, GE, Wikipedia,
    and AllState have used the service to improve their products and even head-hot
    talent.


    # One Solution Fits All?


    Machine learning is built up from a varying set of tools, languages, and techniques.
    It''s fair to say that there is no solution that fits most projects. As you will
    find in this chapter and throughout the book, I''ll refer to various tools to
    get certain aspects of the job done. For example, there might be data in a relational
    database that needs extracting to a file before you can process it.


    Over the last few years, I''ve seen managers and developers with faces of complex
    joy happy when a project is assigned. It''s new, it''s hip, and dare I say, it''s
    funny to be working on projects. Then after the scale of the project comes into
    focus, I''ve seen the color drain from their faces. Usually this happens after
    the managers and developers see how many different elements are required to get
    things working for the project to succeed. And, like any major project, the specification
    from the stakeholders will change things along the way.


    # Defining the Process


    Making anything comes down to process, whether that''s baking a cake, brewing
    a cup of coffee, or planning a machine learning project. Processes are refined
    in fine time goes on, if you''ve never developed one before, then you can use
    the following process as a template.


    # Planning


    During the late 1980s, I wrote many assignments and papers on the paperless office
    and how computers would one day transform the way-to-day operations would be performed.
    Even without the Internet, it was easy to see that computers were changing how
    things were being done.


    Skip ahead to the present day and you''ll see my desk is littered with paper,
    notebooks, sticky notes, and other scraps of information. The paperless office
    didn''t make the changes I was expecting, and you need no more evidence than the
    state of my desk. I would show you a photograph, but it might prove embarrassing.


    What I have found is that all projects start on paper. For me, it doesn''t work
    to jump in code; I find that method haphazard and prone error. I need to plan
    first. I use A5 Moleskine notebooks for notes and A4 and A3 artist drawing pads
    for large diagrams. They''re on my desk, in my bag, and in my jacket pocket.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Whiteboards are good, too. Whiteboards hold lots of ideas and diagrams, I find
    they can get out of control and messy after a while. There was once office wall
    in Santa Clara that I covered in sticky notes. (I did take them down once I was
    finished. The team thought I was.)


    Planning might take into account where the data is coming from, if it needs to
    be cleaned, what learning methods to use, and what the output is going to look
    like. The main point is that these things can be changed at any time—the earlier
    in the process they change, the better. So, it''s worth the time to sit around
    a table with stakeholders and the team and figure out what you are trying to achieve.


    # Developing


    This process might involve algorithm development or code development. The more
    iterations you perform on the code, the better it will be. Agile development processes
    work best; in agile development, you work only on what needs to be done without
    trying to future-proof the software as you go. It''s worth using some form of
    code repository like GitHub or Bitbucket to keep all your work; it also means
    you can roll back to earlier versions if you''re not happy with the way things
    are going.


    # Testing


    In this case, testing means testing with data. You might use a random sample of
    the data or the full set. The important thing is to remind yourself that you are
    testing the process, so it''s okay for things not to go as planned. If you push
    things to production, then you won''t really know what''s going to happen. With
    testing you can get an idea of the pain points. You might find data loading issues,
    data-processing issues, or answers that just don''t make sense. When you test,
    you have time to change things.


    # Reporting


    Sit down with the stakeholders and discuss the test results. Do the results make
    sense? The developers and mathematicians want to amend algorithms or the code.
    Stakeholders might have a new question to ask (this happens a lot), or perhaps
    you want to introduce some new data to get another angle on the answers. Regardless
    of the situation, make sure the original people from the planning phase are back
    around the table again.


    # Refining


    When everyone is happy with the way the process is going, it''s time to refine
    code and, if possible, the algorithms. With huge volumes of data, if you squeeze'
