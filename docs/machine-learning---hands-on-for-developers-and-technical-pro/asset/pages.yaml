  md: '# Refining the Optimum Clusters


    Working out the optimum with the rule of thumb method described earlier in the
    chapter is easy enough. You can find out the number of object instances using
    the UNIX wc command.


    ```

    wc kmeansdata.csv

    75 494 kmeansdata.csv

    ```


    There are 74 lines (excluding the top line, which gives you the data labels x
    and y). A quick calculation of 75 divided by 2 gives 37.5, and the square root
    of that is 6.12.

    By altering the command, you can add target cluster number (using the -N flag)
    with a random seed number to work off (using the -s flag).


