  md: '# Prediction Functions


    When the streaming application calls the make-prediction function, it''s referring

    to the prediction namespace. Clojure has a mechanism for this called multi-methods,

    enable you to create a single function name but have various functions

    complete the work.


    Multi-methods are perfect for the prediction mechanism as we''re passing in

    the JSON payload and dealing with two aspects, the model type and the values

    to predict against.


    Each function has the same structure:


    ```

    (defmethod make-prediction :my-model-type [event]

    (json/write-str (my-model-type-function/predict-model (:payload event))))

    ```


    It''s the same throughout; it''s just the model name that changes. This

    makes our application extendable easily. I decide to add a support vector

    machine model to the system. All I have to do is add a new multi-method to

    the prediction on the support vector machine code I''ve written. In the predict

    namespace, I''d add the following:


    ```

    (defmethod make-prediction :svm [event]

    (json/write-str (svm/predict-model (:payload event))))

    ```


    And there''s no refactoring of the streaming application required.

    Now, there are three models in the project, and the code listing for the pre-

    diction calls looks like this:


    ```

    (ns kafka.stream.prediction.predict

    (:require kafka.stream.prediction.decisionctree :as dt)

    [kafka.stream.prediction.linear :as lr]

    [kafka.stream.prediction.mlp :as mlp]

    [clojure.data.json :as json]))

    ```


    ```

    (def get-model-type [event]

    (keyword (:model event)))

    ```


    ```

    (defmulti make-prediction (fn [event] (get-model-type event)))

    ```


    ```

    (defmethod make-prediction :mlp [event]

    (json/write-str (mlp/predict-mlp (:payload event))))

    ```


    ```

    (defmethod make-prediction :lr [event]

    (json/write-str (lr/predict-simple-linear (:payload event))))

    ```


    ```

    (defmethod make-prediction :dtr [event]

    (json/write-str (dt/predict-decision-tree (:payload event))))

    ```'
