  md: '# # APPENDIX

    # C


    # # Useful Unix Commands


    Regardless of the operating system you use on a daily basis, there’s nothing wrong
    with learning some handy Unix commands. The commands covered in this section will
    help you on the day-to-day tasks of quickly testing, parsing, and searching through
    your text data.


    If you’re a Windows user, you can still join in downloading Cygwin, which is a
    Unix shell command interpreter. Cygwin is a shell that sits on top of the Windows
    Command application and behaves like it’s a Unix install.


    Some of these commands will appear from time to time in the chapters of this book,
    so it’s worth reviewing them now. Experiment with them and study the output you
    have an idea of what to expect.


    # ## Using Sample Data


    Before you get started with the tools, you need some sample data. With a text
    editor, type the following lines and separate each value with a tab:


    ```

    987 1391548780 hhh bbb

    988 1391548781 sda jjj

    989 1391548782 asd asd

    990 1391548783 gjh jkl

    991 1391548784 abc abc

    992 1391548785 ghj ghj

    ```


    Machine Learning: Hands-On for Developers and Technical Professionals, Second
    Edition. Jason Bell. © 2020 John Wiley & Sons, Inc. Published 2020 by John Wiley
    & Sons, Inc.'
  merge: -1
  img_proc: true
