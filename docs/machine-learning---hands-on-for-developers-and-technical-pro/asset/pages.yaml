- pgno: 45
  md: '# Production


    every ounce of performance you can get from your code, the quicker the overall

    processing time will be. Think of a bobbled run; a slower start converts to a

    mlower finish.


    When all is tested, reviewed, and refined by the team, moving to production

    sn''t be a big job. Be sure to give consideration to when this project will

    run — is it an hourly/daily/weekly/monthly job? Will the data change wildly

    tween the project going into production and what comes the next?


    Make sure the team reviews the first few production runs to ensure the

    results are as expected and then look at the project as a whole to see whether

    it'' meeting the criteria of the stakeholders. Things might need to be refined.

    as you probably already know, software is rarely finished.


    # Avoiding Bias


    Let''s not forget that machine learning is hard; getting models that avoid bias

    hard. It''s important to get the teams talking to each other about how to avoid

    introducing any form of bias into the final solution.


    Dataset choice is important. Make sure that it''s evenly weighted. Whether it''s

    gender, age, location, or another parameter, if the quantity of source data

    type is too heavy, then the model is going to bias toward it.


    Try using different model types and evaluate the training and the test pre

    d. Unsupervised models can introduce bias with tighter correlations

    when clustering from the training data, and supervised models can creep in

    bias when human intervention is brought in to control either the model or the

    training data. Care must be taken.


    # Building a Data Team


    A data scientist is someone who can bring the facets of data processing, analytics,

    statistics, programming, and visualization to a project. With so many skill sets

    action, for the smallest of projects, it''s a lot to ask for one person to have

    all the necessary skills. In fact, I''d go as far as to say that a person might
    not

    exist—or is at extremely rare. A data science team might touch on some,

    or all, of the following areas of expertise.


    # Mathematics and Statistics


    Someone on the team needs to have a good head for mathematics—someone

    who isn''t going to flinch when the words linear regression are mentioned in the

    interview. I''m not saying there''s a minimum level of statistics you should know'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Chapter 2 = Planning for Machine Learning


    before embarking on any project, but knowledge of descriptive statistics (the
    mean, the mode, and the median), distributions, and outliers will give you a good
    grounding to start.


    The debate will rage about the level of mathematics needed in any learning project,
    but my opinion is that every project comes with its own set of complications.
    If new information needs to be learned, then there are plenty of sources out from
    which you can learn.


    If you have access to talented mathematicians, then your data team is a blessed
    group inneed.


    # Programming


    Good programming talent is hard to come by, but I''m assuming if you have this
    book in your hand, there''s a good chance you''re a programmer already. Taking
    algorithms and being able to transfer to that workable code can take time and
    planning. It''s also worth knowing some of the Big Data tools, such as the Spark
    framework and Kafka. (Read Chapters 12 and 13 for a comprehensive walk-through
    on both technologies.)


    # Graphic Design


    Visualizing data is important; it tells the story of your findings to the stakeholders
    or end users. Although much emphasis has been placed on the Web for presentation
    with technologies such as D3 and Processing, don''t forget the likes of BIRT,
    Jasper Reports, and Crystal Reports.


    This book does not touch on visualization, but Appendix D “Further Reading,” includes
    some topics that will point you in the right direction.


    # Domain Knowledge


    If, for example, you are working with medical data, then it would be beneficial
    to have someone who knows the medical field. The same goes for retail; there''s
    not much prowling through rows of transactions if no one knows how to interpret
    how customers behave. Domain experts are the vital heroes in guiding the team
    project. There are some decisions that domain expert will instinctively know.


    Think of a border crossing with passport control. There might be many mutations
    of rules that are depending on nationality, immigration rules, and so on. A domain
    expert would have this knowledge in place and make your life as the developer
    much easier and help to get a solution up and running quickly.


    There''s a notion that we don''t need domain experts. I''m of the mind that we
    do, even if you only sit down and have coffee with someone who knows the domain.
    Always take a notebook and keep notes.'
  merge: -1
