  md: "# The Cluster Code\n\nYou’re going to do the following actions to get your\
    \ cluster working:\n\n+   - Write the `main` method, passing in the location of\
    \ the .arff file.\n- Write a rule of thumb to advise the number of clusters you\
    \ should be aiming for.\n- Use Weka's `SimpleMeans` class to build the cluster\
    \ model.\n- Print out the location of the centroids of the cluster.\n- Print out\
    \ to which cluster each instance object belongs.\n\nThis sounds like a lot of\
    \ work, but it’s actually quite simple. The following sections break down each\
    \ individual step.\n\n# The main Method\n\nThe `main` method is the starting point\
    \ for the program. It’s simple—just one line to create an instance of the cluster\
    \ and pass in the location of the .arff file.\n\n```\npublic static void main(String[]\
    \ args) {\n    // Pass the arff location and the number of clusters we want\n\
    \    WekaCluster wc = new WekaCluster(\"/path/to/kmeansandata.arff\");\n}\n```\n\
    \nBecause you’re passing the filepath as a string, you need to reflect that in\
    \ the constructor for the class. I talk more about this in a moment.\n\n# Working\
    \ Out The Rule Of Thumb\n\nEarlier, I established that I could quickly get the\
    \ optimum number of clusters to generate. I have included a method to give you\
    \ the number of clusters to generate based on the instance rows.\n\n```\npublic\
    \ int calculateRuleOfThumb(int rows) {\n    return (int)Math.sqrt(rows);\n}\n\
    ```\n\nThe number of rows is passed in an integer variable. You return the square\
    \ root of the row count divided by two. If you already know how many clusters\
    \ you want, just-code that number.\n\n# Building the Cluster\n\nThe `main` constructor\
    \ handles the handling of the cluster using the Weka API. In the previous examples,\
    \ you’re using the `SimpleMeans` class to build the cluster."
