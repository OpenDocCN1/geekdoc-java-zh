  md: "# Appendix C Useful Commands\n\nThe final useful option is the -k flag, which\
    \ splits the input data into columns\n lets you sort on a specific column. In\
    \ the sample data, the first three-letter\ntext is third, by using the option\
    \ -k3, you sort on the text column.\n\n```\n$ sort -k3 sample.txt\n991 1391548784\
    \ abc abc\n997 1391548787 abc abc\n989 1391548782 asd asd\n995 1391548786 asd\
    \ asd\n992 1391548785 ghj ghj\n998 1391548787 ghj ghj\n990 1391548783 ghj jkl\n\
