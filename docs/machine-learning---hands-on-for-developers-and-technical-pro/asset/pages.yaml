- pgno: 154
  md: '# Chapter 7 - Association Rules Learning 131


    This story has been preached by marketing departments over the world (possibly
    not in the style presented here), and it''s used in everything from keynotes to
    short talks, from hackathons to late night code jams. However, it''s a case of
    fact mixed with myth.


    When he was CEO of a company called Mindmeld, Thomas Bischlok was also on the
    panel of a webcast of the past, present and future of data mining and had managed
    the study on data that spanned the beer and nappies stories. The study went back
    to the early 1990s when his team was looking at the data for Osco Drug. They did
    see a correlation on basket purchases between 5 p.m. and 7 p.m. and presented
    the findings to their client.


    After that point, there is some confusion about where the story actually goes.
    Many versions are basically myth and legend; they''ve generated great chat and
    debate about the water cooler for years and will continue to do so. I had the
    pleasure of mentioning Mark Madsen from Third Nature who also has a large interest
    in the story; it''s amazing how this story has been borrowed, used, referenced,
    and carried forward. Ultimately, it was just good use of Structured Query Language
    (SQL).


    > For the full story on the beer and diapers legend, take a look at D.J. Power''s
    article from November 2002 at


    http://www.dssresources.com/newsletters/66.php

    The myth will live on forever, I''m sure (especially if you''re in marketing),
    and it makes for good reading.


    # How Association Rules Learning Works


    The basket analysis scenario is a good example to explain with, so I''ll continue
    with it. Consider the following table of transactions:


    | TRANSACTIONID | PRODUCT1 | PRODUCT2 | PRODUCT3 | PRODUCT4 |

    |---|---|---|---||}{

    | 1 | True | True | False | False |

    | 2 | False | False | True | False |

    | 3 | False | False | False | True |'
  merge: -1
  img_proc: true
- pgno: 155
  md: '| TRANSACTIONID | PRODUCT1 | PRODUCT2 | PRODUCT3 | PRODUCT4 |

    |---|---|---|---|--|

    | 4 | True | True | True | False |

    | 5 | False | True | False | False |


    This is essentially item set of transactions with a transaction ID and the products
    (could be milk, nappies, beer, and beans, for example).

    Ultimately you''re looking for associations in the products. For example, if a
    customer buys products 1 and 2, he is likely to buy product 4.

    Here is a set of items:


    ```

    I = {product1,product2,product3,product4}

    ```


    And here is a set of transactions:


    ```

    T = {product1,product2,product4}

    ```


    Each transaction must have a unique ID for you to gle any information. Also, it''s
    worth noting that sort of rule needs hundreds of transactions before it starts
    to generate anything of value to you. The larger the transaction set, the better
    the statistical output will be and the better the predictions will be.

    The rule is defined as an implication; what you''re looking at is the following:


    ```

    X,Y ⊆ I,where X ∩ Y = (/).

    ```


    In plain English, what you are saying is X and Y are a subset of the item set
    in the intersection of X and Y.

    They take the form of a set as items denoted as X and Y. In scary books, it will
    look like this: X ⇒ Y. The X denotes the items set before (or left of) the rule,
    called the *antecedent*, and the Y is the item set after (or right of) the rule,
    called the *consequent*.

    Getting back to the products in the basic item set:


    ```

    I = {product1,product2,product3,product4}

    ```


    The true/false statements show whether the item is in that basket transaction
    or not.

    To get the true picture of how the rules work, you need to investigate a little
    further into the concepts of support, confidence, lift, and conviction.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Support


    Support is defined as the proportion of items in the data that contain the item
    set. It''s written like so:


    ```

    $$$Supp(X) = \frac{transactions\containing_X}{total\number_of\transactions}$$

    ```


    If you were to take transaction number 1, as an example, you''d have the following
    equation:


    ```

    $$$supp(X) = \frac{\{product1,product2\}}{5} = 0.2$$

    ```


    The item set appears only once in the transaction log, and there are five transactions,
    so the support is 1/5, which is 0.2.


    # Confidence


    Confidence in the rule is measured as


    ```

    $$$conf(X \Rightarrow Y) = supp(X \cap Y) / supp(X)$$

    ```


    What you''re defining here is the proportion of transactions containing X also
    contain Y. This can be interpreted as the probability of finding the right-hand
    side of transactions under the condition of finding them on the left-hand side.


    To use an analogy, think of parimutuel betting. All bets are placed together in
    a pool, and after the race has finished, the payout is calculated based on the
    total pool (minus the commission to the agent). For example, assume there are
    five horses racing and bets have been placed against each:


    | HORSE NUMBER | BET |

    | 1 | $40 |

    | 2 | $150 |

    | 3 | $25 |

    | 4 | $40 |

    | 5 | $30 |'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'The total pool comes to $285, and after the event is run and the winner is
    confirmed, the payout can be calculated. Assuming that horse number 4 is the winner,
    the calculation would be as follows:


    Pool size after commission = $285 × (1 - 0.15) = $242.25

    Payout per $1 on outcome 4 = $6.05 per $1 wagered


    # # Lift


    Lift is defined as the ratio of the observed if the X and Y item sets were independent.
    It''s written as follows:


    ```

    Lift(X \Rightarrow Y) = \frac{supp(XY)}{supp(X) \times supp(Y)}$

    ```


    # # Conviction


    Finally there''s *conviction*, which is defined as the ratio of the expected frequency
    that X occurs without Y:


    ```

    conv(X \Rightarrow Y) = \frac{1 - supp(Y)}{1 - conf(X \Rightarrow Y)}$

    ```


    # # Defining the Process


    Association rules are defined to satisfy two user-defined criteria, a minimum
    support value and a minimum confidence. The rules generation is done in two parts.


    First minimum support is applied to all the frequent item sets in the database
    (or file data source). The frequent item sets along with the minimum confidence
    are used to form the rules.


    Finding item sets can be hard; it involves trawling through all the possible item
    combinations in the item sets. The number of possible item sets is the "power
    set" over the item set.


    For example, if you have the following:


    ```

    I = {p1,p2,p3}

    ```


    then the power set of I would be:


    {{p1}, {p2}, {p3}, {p1,p2}, {p1,p3}, {p2,p3}, {p1, p2, p3}}'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Notice that the empty set ({}) is omitted in the power set; this formulation
    gives you a size of 2^n, where n is the number of items. A small increase in the
    number of items causes the size of the power set to increase enormously; therefore,
    this method is quite hungry in memory when using something like the Apriori algorithm.
    Obviously, the power set of all combinations of baskets does not occur, and the
    calculation will be based only on those basket combinations that do. Nonetheless,
    it is still very expensive in time and memory to run calculations based on this
    method.


    # Algorithms


    There are several algorithms used in association rule learning that you''ll come
    across, the two described in this section are the most prevalent.


    # Apriori


    Using a bottom-up approach, the Apriori algorithm works through item sets one
    at a time. Candidate groups are tested against the data; when no extensions to
    the set are found, the algorithm will stop. The support threshold for the example
    is 3.


    Consider the following item set:


    +   [1,2,3,4]

    [1,3,4]

    [1,2]

    [2,3,4]

    [3,4]

    [2,4]


    First, it counts the support of each item:


    +   [1] = 3

    [2] = 5

    [3] = 4

    [4] = 5


    The next step is to look at the pairs:


    +   [1,2] = 2

    [1,3] = 2

    [1,4] = 2'
  merge: -1
  img_proc: true
- pgno: 159
  md: '[2,3] = 2

    [2,4] = 3

    [3,4] = 4


    As [1,2], [1,3], [1,4], and [2,3] are the chosen support threshold you can reject
    from the triples that are in the database. In the example, there is only one triple:


    [2,4] = 1 (we''ve discounted one from the [1,2] group)

    From deduction, you have the frequent item sets.


    # FP-Growth


    The Frequent Pattern Growth (FP-Growth) algorithm works as a tree structure (called
    an FP-Tree). It creates the tree by counting the occurrences of the items in the
    database and storing them in a header table.


    In a second pass, the tree is built by inserting the instances as it goes along
    the header table. Items that don''t meet the minimum support threshold are discarded;
    otherwise, they are listed in descending order.


    You can think of the FP-Growth algorithm like a graph, as is covered in the chapter
    about Bayesian Networks (Chapter 4). With a reduced dataset in the formation,
    the FP-Growth starts at the bottom—the place with the longest branches—and finds
    all instances of the given condition. When no more single items match the attribute''s
    support threshold, the growth ends, and then it works on the next part of the
    FP-Tree.


    # Mining the Baskets—A Walk-Through


    There are a few libraries that deal with association rule learning; in this chapter,
    I''ll be once again using Weka and moving away from Mahout, which I covered in
    the first edition of this book. With the Apache Sparklib project, there are the
    FPGrowth and association rule learning packages, but I will save those for the
    Spark, which is covered in Chapter 13.


