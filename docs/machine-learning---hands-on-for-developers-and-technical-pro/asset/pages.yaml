- pgno: 274
  md: '# Properties


    Any Java application that communicates with a Kafka cluster is set up via the
    Java classes. The key-pair values are required by the Kafka API to send default
    settings and flags to the brokers.


    ```

    props = new Properties();

    props.put("bootstrap.servers", "localhost:9092");

    props.put("acks", "all");

    props.put("retries", 0);

    props.put("key.serializer",

    org.apache.kafka.common.serialization.StringSerializer);

    props.put("value.serializer",

    org.apache.kafka.common.serialization.StringSerializer);

    ```


    Looking at this setup, we can see some settings that are familiar from previous
    examples in the chapter but also some new ones.


    # Bootstrap Servers


    The bootstrap.servers key is telling the application where the brokers are. In
    the stand-alone development cluster, this is only one node and one bootstrap server.
    It acts as a starting point for the application to discover the other brokers
    in the cluster. If you have more than one broker, you can use comma-separated
    values.


    ```

    props.put("bootstrap.servers", "server1.localhost:9092, server2.localhost:9093");

    ```


    # Acks


    Next is the acks, which is short for acknowledgments. When a producer sends a
    message to the broker, it can receive an ack to say that the broker has received
    the message. While this is good from an application safety point of view, it''s
    worth keeping in mind there a small amount of latency introduced. Three settings
    are available for the acks key. Table 12.2 explains the settings.


    Table 12.2: Kafka Producer Acks


    | ACKS SETTING | MEANING |

    |--- |--- |

    | acks=0 | The producer does not receive any confirmation that the broker has
    received the message. This is basically a fire-and-forget setting, and there is
    no guarantee the message has reached the broker. |

    | acks=1 | The producer will receive an acknowledgment from the lead broker (the
    leader), but it will have been received without the confirmation that all the
    brokers follow that leader have received the message. |

    | acks=all or acks=-1 | The producer will receive an acknowledgment once the leader
    has received confirmation that the message is with the in-sync replicas. |'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Chapter 12 Machine Learning Streaming with Kafka 253


    # Retries


    The producer client will try to resend the message when a failed send occurs.
    In this example, the zero value means the client isn''t going to attempt a resend.
    Using retries can cause issues with message ordering. If a client fails at a batch
    of messages and then succeeds with a second batch, there is a chance that the
    second message batch will be available before the first.


    # Deserializers


    Kafka treats messages as a binary payload. This means messages need to be serialized
    by a producer and then deserialized by the consumer when the message is eventually
    read. The properties configuration sets the producer serializer, which is in two
    parts; there''s a key and a value. In this example, there''s a string-based key,
    and the message payload is a string too


    # The Producer


    With the configuration set up in the Properties class, it''s now time to create
    the actual producer. The Producer class takes the key and value objects that are
    specified in the key and value serializer settings. The Producer is created in
    one line, passing in the configuration properties.


    ```

    Producer<String, String> producer = new KafkaProducer

    <String, String>(props);

    ```


    # Messages


    Now we''re at the stage where we can send messages to the broker. The send() method
    ends a ProducerRecord object, which takes the topic name, the key, and the message.


    ```

    producer.send(new ProducerRecord<String, String>(topicName,

    keyName, Payload);

    System.out.println(keyName + " - " + Message sent

    successfully: " + payload);

    producer.close();

    ```


    # The Final Code


    Those three steps—configuring the properties, creating a producer, and then sending
    the message—create the basic components of a producer application. The following
    code is the finished application; notice that there is a for loop in there to
    send 10 messages to the broker.'
  merge: -1
  img_proc: true
