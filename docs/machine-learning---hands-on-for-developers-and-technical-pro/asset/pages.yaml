    # Spark Streams from Kafka


    With some minor modifications, it is easy to convert the streaming job to consume

    Kafka messages. The setup is straightforward, creating a properties configuration\and
    adding a consumer group name and a topic (or topics) to consume from.

    There is no other library that you will have to add to your Maven dependencies.


    ```

    <dependency>

    <groupId>org.apache.spark</groupId>

    <artifactId>spark-streaming-kafka-0-10_2.11</artifactId>

    <version>2.2.0</version>

    </dependency>

    ```


    As in the previous chapter, any application consuming from Kafka needs to

    know the broker location, a topic name, and a consumer group so the reads can

    happen. If a consumer group is not given, Kafka will assign one, but it''s best
    to

    create your own so you are in control; it also makes monitoring easier.


    ```

    String brokers = "localhost:9092";

    String topicName = "testtopic";

    String groupid = "testtopic-group";

    ```


    Next are the Spark context and configuration; there’s no real setup to do here

    apart from assigning a name. JavaStreamingContext takes the text config-

    uration and also a duration; for this example, I’ve set it to five seconds.'
