  md: '# From Machine Learning to Machine Learning Engineer


    It''s fair to say that some of the concepts covered in this book have been around
    for a long time. Neural networks have been around for more than 50 years, for
    example. What has changed over that time period is the growth of computing power
    and other related factors such as the reduced cost of storage. It become easier
    to process data cheaply over. This brings with it some developments in how quickly
    we can process data, run algorithmic computations, and, in turn, generate predictions
    to stakeholders.


    These types of system, however, are not easy to build. Cloud-based infrastructures
    such Amazon''s AWS Sagemaker, Google''s ML Engine (now Cloud AI), and Microsoft''s
    Azure Machine Learning platform aim to make things easy, but the skills required
    to get any of these solutions performing well are still hard to come by.


    The rise of the data engineer or machine learning engineer as a job function is
    becoming more important than before. A hybrid of a software developer and a system
    administrator and a smattering of a data scientist, the machine learning engineer
    now stands between a machine learning model being created and how it''s deployed
    into production-systems.


    Engineering skills are always in demand, and anyone who can acquire, clean, and
    prepare data for production and piece together the required components to create
    an end-to-end solution is like gold dust on a team. You''ll see all manner of
    blog posts telling you what you should know to be an ML engineer, but the basics
    are simple when they are broken down.


    +   - Knowledge in how machine learning models work

    - Able to prepare data

    - Proficient in at least one development language, preferably the one that creating
    the models are using

    - Core Linux systems (do you know your cat from your ls?)

    - Deployment methods and being able to install all manner of tools to get this
    end-to-end solution working


    There will always be raging debates on whether it''s better to be a specialist
    or a generalist. Personally, I found it more helpful to know as much as I can,
    so I''ve always considered myself a generalist. I''d never even considered being
    a machine learning engineer until I was told by a manager that''s basically what
    I was doing.'
