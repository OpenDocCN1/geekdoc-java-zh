    # ## What Is an Image?


    In its basic form, a computer-based image is a grid of numbers. "square" is called
    a pixel. Figure 11.1 is an example of an 8 pixel by 8-pixel image.


    Not overly optimistic I agree, but it''s a starting point. Let''s assume this
    is an image of two colors: black and white. When there is a pixel colored black,
    then it''s given value of one, and all the others are zero. From a numeric point
    of view, our image looks like Figure 11.2.


    What we have is a 1 bitmap image representation. Each bit represents the color,
    black, or white.'
