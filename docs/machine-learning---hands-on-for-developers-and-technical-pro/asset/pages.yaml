  md: 'Download the TGZ file and store it in the directory where you want to install
    Kafka. Installing Kafka is simple; the first step is to expand the zipped TAR
    file into a directory.


    ```

    $ tar -xzf kafka_2.12-2.2.0.tgz

    $ cd kafka_2.12-2.2.0

    ```


    As Kafka runs on Zookeeper for broker identification, Zookeeper needs to be running
    before we start Kafka. There are various configuration files that are used within
    Kafka, but there are two specifically that I''ll focus on here: zookeeper properties
    and server.properties. How these files are depends on the type of cluster you
    want to operate. I will cover this in this book: a single-node cluster and a multinode
    cluster running on the same machine.


    # Kafka as a Single-Node Cluster


    It''s a good idea to practice on a single-node cluster configuration of Kafka.
    A single machine will handle both Zookeeper and Kafka. I use the single-node configuration
    for developing and testing producers, consumers, and streaming applications. I''m
    happy that the applications are performing as expected, then I can look at deploying
    them on a multinode cluster.


    The first application to start Zookeeper. Kafka requires Zookeeper to maintain
    the state of the brokers. If it''s not live, then Kafka will not work. In development,
    I have multiple terminal windows open—one for Zookeeper, one for Kafka, and another
    for whatever producer or consumers I''m working on.


    # Starting Zookeeper


    Let''s start Kafka installation. The first thing to do is open a terminal window
    and go to the directory where you installed Kafka. From the command line, type
    bin/zookeeper-server.sh config/zookeeper.properties.


    ```

    $ bin/zookeeper-server.sh config/zookeeper.properties

    [2019-06-18 07:43:12,238] INFO Reading configuration from:

    zookeeper.properties org.apache.zookeeper.server.quorum.

    QuorumPeerConfig

    [2019-06-18 07:43:12,241] INFO autopurge.snapRetentionCount set to 3 (org.

    apache.zookeeper.server.DatadirCleanupManager)

    [2019-06-18 07:43:12,241] INFO autopurge.purgeInterval set to 0 (org.

    apache.zookeeper.server.DatadirCleanupManager)

    [2019-06-18 07:43:12,243] INFO Purge task is not scheduled. (org.apache.

    zookeeper.server.DatadirCleanupManager)

    [2019-06-18 07:43:12,243] WARN Either no config or quorum defined in

    config, in standalone mode (org.apache.zookeeper.server.quorum.

    QuorumPeerMain)

    ```'
