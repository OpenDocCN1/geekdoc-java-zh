    with, zipped files, and directories as well.


    # Testing Spark


    Find a file with which to test Spark and follow along with the rest of this section.
    I''m using a file from the local filesystem for this example.


    # Load the Text File


    First, load the text file. From the Scala command line, type the following:


    ```

    scala> var textF = sc.textFile("/path/to/data/ch13/mobydick.txt")

    ```


    Basically you''re storing the contents of the text file into a Scala variable
    called textF. Spark responds with output along the lines of the following:


    ```

    textF: org.apache.spark.rdd.RDD[String] = =

    /path/to/data/ch13/mobydick.txt MapPartitionsRDD[3] at textFile at

    <console>:24

    ```


    Spark uses a concept resilient distributed datasets (RDDs), so in the output you
    can see that you now have a MappedRDD containing strings. With the text file loaded,
    you can start to inspect it and get some results.


    # Make Some Quick Inspections


    With the loaded data, you can do some quick inspections. First, how many elements
    of data do you have in the RDD?


    ```

    scala> textF.count()

    ```


    You get the following output:


    ```

    res1: Long = 7182

    scala>

    ```


    This count represents the number of elements in the RDD and not the number of
    lines in the text file. You can pull the first element from the RDD, as shown
    here:


    ```

    scala> textF.first()

    res2: String = CHAPTER 1

    scala>

    ```'
