- pgno: 195
  md: '# Chapter 9 Artificial Neural Networks


    The network output equation would be the following:


    ```

    Output = \begin{cases} 1 & \text{if} (W0 \times I0) + (W1 \times I1) > 0 \ 0 &
    \text{Otherwise...} \end{cases}

    ```


    So, I''ve covered the processing of one perceptron. Artificial neural networks
    have many interconnected neurons, each with its own input, output, and activation
    function.


    For most machine learning functions, artificial neural networks are used for solving
    problems of nonlinear fashion. Many problems cannot be solved in a purely linear
    fashion, so using a single-layer perceptron for this kind of problem-solving was
    never worth considering. If you think of an XOR gate (Exclusive OR) with the input
    types shown in Table 9.2, you could easily think of the network shown in Figure
    9.6.


    **Table 9.2:** Exclusive OR Output Table


    | INPUT | OUTPUT |

    |---|---|

    | Off and On | On |

    | On and Off | On |

    | Off and Off | Off |

    | On and On | Off |


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_195_0.png)


    **Figure 9.6:** XOR gate network


    Multilayer perceptrons have one or more layers between the input nodes and the
    eventual output nodes. The XOR example has a middle layer, called a *Hidden layer*,
    between the input and the output (see Figure 9.7). Although you and I know what
    the outputs of an XOR gate would be (if just outlined them in the table) and we
    could define the middle layer ourselves, a truly automated learning platform would
    take some time.


    The question is, what happens in the hidden layer? Going back to the XOR example
    for a moment, you can see the two input nodes with their values. These would be
    fed to the hidden layer, and the input is dependent on the output of the input
    layer.'
