  md: '# Finding Pi with Random Numbers


    The Monte Carlo method is the concept of emulating a random process. When the
    process is repeated many times, it will give rise to the approximation of some
    mathematical quantity of interest. So, in theory with enough random darts thrown
    at a circle, you should be able to find the number of Pi.

    Figure 4.5 shows your square.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_100_0.png)


    Figure 4.5: Initial drawing of a square


    Now draw a circle within the square (see Figure 4.6).


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_100_1.png)


    Figure 4.6: Circle within a square


    Placing enough random data in the square will give you darts that are in the square,
    and some of them will be within the circle (see Figure 4.7). These are the darts
    that we''re really interested in.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_100_2.png)


    Figure 4.7: Random darts within the circle and the square'
  merge: -1
  img_proc: true
- pgno: 101
  md: "# Chapter 4 = Statistics, Linear Regression, and Randomness 77\n\nThese are\
    \ random throws. You might throw 10 times; you might throw 1 million throws. At\
    \ the end of the darts throws, you count the number of darts within the circle,\
    \ divide by the number of throws (10 million, 1 million, and so on), and then\
    \ multiply it by 4.\n\nπ = 4 × (darts within the circle / total points)\n\nThe\
    \ more throws we do, the better chance we get of finding a number near Pi. This\
    \ is the law of large numbers at work. It's a classic computer science problem,\
    \ and I'm going to solve it by writing a program in Clojure to do the simulation\
    \ for us.\n\n# Using Monte Carlo Pi in Clojure\n\nI'm going to create a function\
    \ that simulates a single dart throw. I want to break down my Clojure code into\
    \ as many simple functions as possible. This makes testing and bugging far easier.\n\
    \n```\n(defn throw-dart []\n {:x (calc-position 0)\n  y (calc-position 0))\n```\n\
    \nWhat I'm creating is a map with an x,y coordinate with a 0,0 center point and\
    \ then passing the coordinate for x and y through another function to calculate\
    \ the position (calc-position).\n\n```\n(def side-of-square 2\n  defn calc-position\
    \ [v]\n  (* (/ v side-of-square 2) (+ (- 1) 2 (Math/random))))\n```\n\nThe calc-position\
    \ function takes the value of either x or y and applies the calculation. This\
    \ is somewhere -side-of-square/2 and +side-of-square/2 around the center point.\n\
    \nRunning this function in a REPL, we can see the x or y position.\n\n```\nmathematical.programming.examples.montecarlo>\
    \ (calc-position 0)\n0.4298901518005238\n```\n\n# Is the Dart Within the Circle?\n\
    \nNow I have an x,y position as a map, {:x random throw value :y some random throw\
    \ value}, and I want to confirm that the dart is within the circle.\n\nUsing the\
    \ side-of-square value again (hence it's a def), I can figure out if the dart\
    \ hits within the circle. I'll pass the map with x,y coords in and take the square\
    \ root of the added squared coordinates."
