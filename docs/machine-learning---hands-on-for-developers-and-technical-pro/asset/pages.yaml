    \ double y) {\n    int clusterNumber = -1;\n    try {\n        double[] newata\
    \ = new double[] {x, y};\n        Instance testInstance = new Instance(1.0, newata);\n\
    \        clusterNumber = kmeans.clusterInstance(testInstance);\n    } catch (Exception\
    \ e) {\n        e.printStackTrace();\n    }\n    return clusterNumber;\n}\n```"
