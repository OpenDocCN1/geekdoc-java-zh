- pgno: 278
  md: '# Chapter 12 » Machine Learning Streaming with Kafka


    Consumer applications are members of consumer groups. It''s not essential to specify
    one, but Kafka will assign one during runtime if a group name is not given. It''s
    worth using your own group names for ease of searching for metrics on consumers.


    As previously shown in the producer application, we are aware that the key and
    payload data for our messages are strings. The producer application serialized
    the data with the key.serializer and value.serializer settings. Consumers require
    the deserializers for the message. When the message is consumed by the consumer,
    it arrives as a byte array; it''s then deserialized to the format specified in
    the producer.


    ```

    Properties props = new Properties();


    props.put("bootstrap.servers", "localhost:9092");

    props.put("group.id", "test09");

    props.put("enable.auto.commit", "true");

    props.put("auto.commit.interval.ms", "1000");

    props.put("session.timeout.ms", "30000");

    props.put("key.deserializer",

    "org.apache.kafka.common.StringDeserializer");

    props.put("value.deserializer",

    "org.apache.kafka.common.StringDeserializer");

    ```


    # Fetching Consumer Records


    Consumer applications polls records from the broker. The .poll( ) method takes
    an integer value with the number of records you want the consumer to process.
    Depending on the message load from the brokers, if you pull too many messages,
    you can have a slow-running consumer. Time to test and experiment with the number
    of records you are polling.


    During polling and processing of records, the commit position of the topic is
    written back to the log. If the properties of the consumer enable the auto setting
    of the offset, this will be performed while your application is running. The duration
    between each setting of the offset is determined by the value of the auto.commit.interval.ms
    setting; in this application example, it set to 1000ms, or 1 second.


    ```

    KafkaConsumer<String, String> consumer = new KafkaConsumer

    <String, String> (props);

    ConsumerRecords<String, String> records = consumer.poll(100);

    ```


    # The Consumer Record


    With the ConsumerRecords class polling the broker and fetching records to process,
    the last step is to do something with the message contents. The ConsumerRecord
    class is the representation of a single record.'
  merge: -1
  img_proc: true
