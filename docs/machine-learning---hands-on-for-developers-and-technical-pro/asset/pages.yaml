    \ sda jjj\n994 1391548785 sda jjj\n```\n\nWhen combining the sort options, you\
    \ can output pretty anything\nyou want. For example, you can reverse the second\
    \ column as a numeric\nvalue using the following code:\n\n```\n$ sort -kn2 sample.txt\n\
    996 1391548787 ghj jkl\n997 1391548787 abc abc\n998 1391548787 ghj ghj\n995 1391548786\
    \ asd asd\n992 1391548785 ghj ghj\n993 1391548785 hbb hbb\n994 1391548785 sda\
    \ jjj\n991 1391548784 abc abc\n990 1391548783 ghj jkl\n989 1391548782 asd asd\n\
    988 1391548781 sda jjj\n987 1391548780 hbb hbb\n```\n\nThe combination of the\
    \ -k, -n, and -r flags is suitable for most applications\nwhen you're running\
    \ through basic delimited data.\n\n# Finding Unique Occurrences: uniq\n\nSometimes\
    \ data will have repeat lines in them because of a data entry error or\na slightly\
    \ error-prone database query. Before raising your voice at the database\noperator\
    \ (I have to look in the mirror to talk to my DBA), you can use the uniq\ncommand\
    \ to extract all the unique lines.\n\n```\n$ uniq sample.txt\n987 1391548780 hbb\
    \ hbb\n```"
