  md: "# Writing a Function to Score Sentiment\n\nYou have a function that takes in\
    \ a sentence and two word lists (positive and negative sentiment words). Now you\
    \ can test it.\n\n```\nGetScore<-function(sentence, pos.words, neg.words) {\n\
    \  sentence = gsub('[[:punct:]]', '', sentence)\n  sentence = gsub('[[:cntrl:]]',\
    \ '', sentence)\n  sentence = gsub('\\\\d+', '', sentence)\n  \n  sentence = tolower(sentence)\n\
    \n  word.list = str_split(sentence, '\\\\s+')\n  words = unlist(word.list)\n\n\
    \  pos.matches = match(words, pos.words)\n  neg.matches = match(words, neg.words)\n\
    \n  score = sum(pos.matches) - sum(neg.matches)\n\n  return(score)\n}\n```\n\n\
    The first thing that happens is the sentence is cleaned up with punctuation, control\
    \ characters, and numbers removed. That should give you just a sentence of words;\
    \ you then convert it into all lowercase letters.\n\nYou split the sentence into\
    \ a list of words and find out how many times the words match in the word list.\
    \ You also do the same with the negative word list.\n\nWith a positive score and\
    \ negative score, you take the negative away from the positive to get the final\
    \ score.\n\nYou can save the functions as an R source file. You can either create\
    \ it in a text editor or use the R-Studio editor to create the source file. For\
    \ this example, I save it all in a file called sentiment.r.\n\n# Testing the Function\n\
    \nTo test the sentiment code, you first need to load the code and the required\
    \ library into R.\n\n```\ninstall.packages(\"stringr\")\nlibrary(stringr)\nsource('sentiment.r')\n\
    ```"
