- pgno: 270
  md: '# 248 Chapter 12 » Machine Learning Streaming with Kafka


    In this short introduction, you will see how to create, list, and delete topics
    and how to send messages to the log and receive them.


    # Creating Topics


    Topics can be created in one of two ways. The first is with the command-line tool,
    and the second is from within a producer application, which will create the topic
    if it does not exist.


    It''s worth working with the command line as that will give you an understanding
    of what''s required within the topic creation, the required settings for replication,
    and how the broker and Zookeeper settings are handled.


    Let''s create a test topic now; we''ll call it testtopic for example of demonstration.
    Within the bin directory of the Kafka distribution, you will see a shell script
    called kafka-topics.sh This is the main command for topic-related activities.
    To create the topic, execute the following command from your terminal window:


    ```

    $KAFKA_HOME/bin/kafka-topics.sh --zookeeper localhost:2181 --create

    --topic testtopic --replication-factor 1 --partitions 1

    Created topic "testtopic".

    ```


    Let''s break this command down into smaller segments and break down what the script
    is doing. The first setting is telling Kafka which Zookeeper server we are using.
    This is a required setting, as we''re using the local deployment, and the Zookeeper
    server is running on localhost on port 2181 (the default port for Zookeeper).


    Next --create is telling the application we want to create a topic. The name of
    the topic is handled next with the --topic flag. As the cluster is just for development,
    I''m not concerned about the replication factor or the number of partitions, this
    is set to 1.


    # Finding Out Information About Existing Topics


    With this command, you can find out about the topics that are available on the
    cluster. To generate a list of all the topics on the cluster, run the following
    command:


    ```

    bin/kafka-topics --zookeeper localhost:2181 --list

    testtopic

    ```


    If you''ve created only one topic, then you might be surprised to see more topics
    than you were expecting. The Kafka cluster creates internal topics for monitoring
    and metrics. All the offset information, including the message positions of the
    associated consumers, is held within a topic as well.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Chapter 12 Machine Learning Streaming with Kafka 249


    The application can expand on the information for the topic by using the

    --describe flag.


    ```

    $ bin/kafka-topics --zookeeper localhost:2181 --describe --topic testtopic

    Topic:testtopic PartitionCount:1 ReplicationFactor:1 Configs:

    Topic: testtopic Partition: 0 Leader: 0 Replicas: 0

    ```


    Describing the topic produces a multiline output that expands on how Kafka

    is using the cluster for that topic. On the first line is the partition count
    and

    replication factor. In this example it''s only 1, as it was when the topic was
    cre-

    eated earlier.


    The second line gives more information on the broker ID''s as leader\and the IDs
    of the broker replicas.


    # Deleting Topics


    Topics, regardless of whether they have messages in them or not, use resources

    ent the cluster. It''s good practice to remove topics that you are not using.
    The

    deletion of topics is done through the kafka-topics command-line program,

    but will work only if delete.topic.enable is set to true.


    Any other value for setting that will mean that the delete topic command

    will ignored.


    ```

    $ bin/kafka-topics --zookeeper localhost:2181 --delete --topic testtopic

    Topic: testtopic is marked for deletion.

    Note: This will have no impact if delete.topic.enable is not set to true.

    ```


    # Sending Messages from the Command Line


    The best way to test that the cluster is working is by using the command-line

    tools to create and consume messages. The kafka-console-producer application

    enables you to send messages from the command line.


    ```

    $ bin/kafka-console-producer --broker-list localhost:9092 --topic testtopic

    ```


    Once the application starts, you can start typing data into the terminal window.

    Each time you press the Return key, your message is sent to the broker with the

    desired topic. If you want to exit the application, press the key combination
    of

    Ctrl+C, and the application will stop and return you to the terminal command

    line.


    With some test data in Kafka, now it''s time to turn our attention to reading

    the messages in the log.'
