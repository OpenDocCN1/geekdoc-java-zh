    of things to look at. For the argument that it''s a replacement for Hadoop, well,
    there''s a time and place to use Hadoop, and the same goes for Spark; it''s all
    about the project that you are completing and picking the right tools for the
    job. The tools are just that—tools.


    # Java, Scala, or Python?


    Spark jobs can be written in Java, Scala, or Python. As usual, which language
    you tends to be a matter of personal preference.


    The book has so far concentrated on Java as its core language of choice, and I
    will continue to use for the Spark examples. During the first edition of this
    book, the Python libraries for Spark were classed as experimental; these have
    been updated and more widely used as Python, as a language, more widely adopted
    for data science.


    As you progress through this chapter, you might come to the conclusion that Java
    is too bulky for writing Spark jobs. Remember, it''s a matter of personal preference,
    so you should use the language in which you''re most comfortable.


    # Downloading and Installing Spark


    There are a few ways to download and use Spark. The easiest way is to use the
    prebuilt packages that are available from the Spark website. Before you download
    one, check version of Hadoop you (or your organization) is running as it will
    determine the download you want. If you are still running Hadoop, it''s preferable
    to match your Spark download to the core Hadoop version you''re running. For most
    developers, I would wager this is no longer an issue.


    After you have downloaded the file for your Hadoop version, you can install it
    by moving the downloaded file to the directory you want to install it. The file
    is a .tgz file, so you can unarchive it in one command.


    ```

    tar xvzf spark-2.4.4-bin-hadoop2.7.tgz

    ```


    The contents of the file will archive and be ready for use.


