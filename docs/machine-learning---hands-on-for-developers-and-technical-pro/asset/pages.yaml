    # Topics Management


    Any message that you send within the Kafka system is sent to a topic. You are
    free to create as many topics as you want. There are some general rules of thumb
    about the optimum number of topics you can have on a cluster depending on how
    many nodes you have.


    Within the bin directory of your Kafka distribution, there are several scripts
    that will do the required tasks for topic management. The main one to focus on
    is the kafka-topics.sh'
