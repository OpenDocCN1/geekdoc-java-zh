- pgno: 39
  md: '# Data Repositories


    One question that comes up again and again in my classes is “Where can I get data?”
    There are a few answers to this question, the best answer depends on what you
    are trying to learn.


    Data comes in all shapes and sizes, which is something discussed in the next chapter.
    I strongly suggest you take time to hunt around the Internet for different datasets
    and look through them. You''ll get a feel for how these things are put together.
    You''ll find comma-separated variable (CSV) data, or you might find JSON or XML
    data.


    Remember, some of the best learning comes from playing with the data. Having a
    question while you are trying to answer with the data is a good start (and something
    you will refer to a number of times in this book), but learning comes from experimentation
    and improvement on results. So, I''m all for playing around with the data first
    and seeing what works. I hail from a pragmatic background when it comes to development
    and learning. Although the majority of publications about machine learning come
    from people with academic backgrounds—and I fully endorse and support them—we
    shouldn''t discourage learning by doing.


    The following sections describe some places where you can get plenty of data with
    which to play.


    # UC Irvine Machine Learning Repository


    This machine learning repository consists of more than 270 datasets. Included
    in these sets are notes on the variable name, instances, and tasks that the data
    would be associated with. You can find this repository at http://archive.ics.uci.edu/ml/datasets.


    # Kaggle


    The competitions at Kaggle runs have gained a lot of interest over the last couple
    of years. The 101 section on the site offers some datasets with which to experiment.
    You can find them at www.kaggle.com/competitions.


    # Summary


    This chapter looked at what machine learning is, how it can be applied to different
    areas of business, and what tools you need to follow along with the remainder
    of the book.


    The next chapter introduces you to planning for machine learning. It covers data
    science teams, cleaning, and different methods of processing data.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# # CHAPTER 2

    # Planning for Machine Learning


    This chapter looks at planning your machine learning projects, storage types,
    processing options, and data input. The chapter also covers data quality and methods
    to validate and clean data before you do any analysis.


    # ## The Machine Learning Cycle


    A machine learning project is basically a cycle of actions that need to be performed
    (see Figure 2.1).


    | Acquisition | Collate the data |

    | Prepare | Data cleaning and quality |

    | Process | Run machine tools |

    | Report | Present the results |


    **Figure 2.1:** The machine learning process


    *Machine Learning: Hands-On for Developers and Technical Professionals, Second
    Edition. Jason Bell.

    © 2020 John Wiley & Sons, Inc. Published 2020 by John Wiley & Sons, Inc.*'
