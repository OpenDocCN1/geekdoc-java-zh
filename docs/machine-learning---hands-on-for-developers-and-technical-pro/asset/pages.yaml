  md: '# Chapter 3 Data Acquisition Techniques 51


    to import/export data would be fine, as the volumes grow and the demands from
    stakeholders get more complex, we need to start looking at alternative tools.

    Embulk is an open source bulk loading tool. It provides a number of plugins to
    read, write, and transform data. For example, if you wanted to read a directory
    of CSV files, transform them to JSON, and write them to AWS S3, that can be done
    with Embulk with a single configuration file. If you are using the OpenJDK, then
    it uses version 8 without any issues.


    # Installing Embulk


    Embulk works on Linux, Mac, and Windows platforms. To install it on Linux and
    macOS, you will need to open a terminal window and execute the following commands:


    ```

    $curl --create-dirs -o ~/.embulk/bin/embulk -L "https://dl.embulk.org/embulk-latest.jar"

    chmod +x ~/.embulk/bin/embulk

    echo ''export PATH=$HOME/.embulk/bin:$PATH'' >> ~/.bashrc


    ```


    Once it''s installed, you can run Embulk from the command line as you would with
    any other application.


    # Using the Quick Run


    Embulk has a feature that will attempt to guess the schema of incoming data. In
    the data/ch03/embulkdata directory, you will see a CSV file generated from http://www.fakenamegenerator.com,
    which is a free service that generates test user data. The configuration file
    is in the same directory the configuration file simpleconfig.yml. The configuration
    file has an input step (in:) and an output step (out:)


    ```

    in:

    type: file

    path_prefix: ''/path/to/repo/.embulkdata/sample_''

    out:

    type: stdout

    ```


    When you execute Embulk, it will attempt to parse the CSV file and work out an
    input schema for you. Using the -o option, it will write the output YAML to a
    file.


    ```

    $embbulk guess ./embulkscripts/sampledata/simpleconfig.yml \

    -o config.yml

    ```


    If you take a look at the output file, you''ll see that Embulk has now populated
    things like the delimiter type, whether to skip header lines and a representation
    of the schema.'
  merge: -1
