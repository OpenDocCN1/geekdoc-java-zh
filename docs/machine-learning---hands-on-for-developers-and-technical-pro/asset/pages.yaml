    # Advertising


    For long as products have been manufactured and services have been offered, companies
    have been trying to influence people to buy their products. Since 1995, the Internet
    has given marketers the chance to advertise directly to our screens without needing
    television or large print campaigns. Remember the thought of cookies being on
    our computers with the potential to track us? The race to disable cookies from
    browsers and who control our habits was big at the time.


    Log file analysis is another tactic that advertisers use to see the things that
    interest us. They are able to cluster results and segment user groups according
    to who may be interested in specific types of products. Couple with that mobile
    location awareness and you have highly targeted advertisements sent directly to
    you.


    There was a time when this type of advertising was considered a huge invasion
    of privacy, but we''ve gradually gotten use to the idea, and some people are happy
    to check in at a location and announce their arrival. If you''re thinking your
    friends are the only ones watching, think again. In fact, companies are learning
    from your activity. With some learning and analysis, advertisers can do a good
    job of figuring out where you''ll be on a given day and attempt to push offers
    off you.


    # Retail and E-commerce


    Machine learning is heavily used in retail, both in e-commerce and in bricks-and-mortar
    retail. At a high level, the obvious use case is the loyalty card. Retailers that
    issue loyalty cards often struggle to make sense of the data''s coming back to
    them. Because I worked with one company that analyzes this data, I know the pain
    that supermarkets go through to get insight.


    UK supermarket Tesco is the leader when it comes to customer loyalty programs.
    The Tesco Clubcard is used heavily by customers and gives Tesco a great value
    of customer purchasing decisions. Data is collected from the point of'
