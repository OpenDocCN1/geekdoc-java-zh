    Figure 12.3: Topics split into partitions


    # Fault Tolerance


    Partition data is replicated over a number of brokers. If a broker dies, data
    is still available over the remaining brokers. One broker is designated the leader
    and is the node that all data to the partition is written to and read from.

    If the leader fails, the cluster will assign a new leader broker, and the other
    brokers will follow that one. The registry of brokers, including which is the
    leader, is maintained by Zookeeper.


    # Further Reading


    For more information about the workings of Kafka, I''ve included some reading
    material in Appendix D, “Further Reading.” In this chapter, I concentrate on the
    more practical aspects of getting Kafka running and then doing machine learning
    with it.


    # Installing Kafka


    There are two versions of Kafka that can be downloaded. There''s the open source
    Apache version, and there''s the Confluent Community version. They both operate
    in the same way; the main difference is when we bring the SQL query language KSQL
    into the mix.


    For this chapter, I''m going to use the Apache Kafka distribution, which is available
    at https://kafka.apache.org. This is the download link that I''m using:


    ```

    https://www.apache.org/dyn/closer.cgi?path=/kafka/2.2.0/kafka_2.12.0.tgz

    ```


    You will need to choose a mirror website to download your Kafka distribution.'
