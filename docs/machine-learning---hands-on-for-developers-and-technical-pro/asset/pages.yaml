  md: '# Machine Learning Streaming with Kafka


    Within this book we have mainly concentrated on machine learning as a singular
    process: acquiring data, training a model, and then making predictions. In this
    chapter, we will look at streaming data and how that can affect model training
    and predictions.


    # What You Will Learn in This Chapter


    This is an involved chapter with a lot of code examples and process to work through.
    By the end of the chapter, you''ll have a proof-of-concept application that takes
    in streaming data, events, and multiple machine learning models.


    First, we will cover setting up Kafka, one of the main applications used in streaming
    log-like data. We will then move on to how topics work and the methods used to
    produce and consume messages. Lastly, we will look at how these fit into a machine
    learning framework and design a system that continuously trains itself and handles
    multiple prediction models.


    This chapter does not concentrate on how the models work or how they can be involved
    in an actual application. The perspective changes from machine learning to engineering.
    We will also bridge several JVM-based languages like Java and Clojure and present
    a path of least resistance to easily create REST-based APIs that can be called
    from Kafka-based applications.'
