    # Filtering Content: grep


    For matching patterns within text, grep is your friend. It''s one of those utilities
    you''ll use again and again after you get to it. The syntax is very basic: grep
    [options] [pattern to find] [name of file(s)].


    # Example Command for Finding Text


    ```

    $grep ''bbb bbb'' sample.txt

    ```


    # Example Output


    To invert the output, the lines that don''t match the pattern and then add the
    -v flag before the pattern. Table C.1 shows other handy option flags you can use
    with grep.


    Table C.1: grep Option Flags


    | FLAG | EFFECT ON OUTPUT |

    | -c | Outputs the number of times the pattern was matched in the file |

    | -v | Inverts the output to show lines that don''t match the pattern |

    | -i | Ignores the case on the input line so BBB and bbb would match |

    | -n | Displays the line number on which the pattern match occurs |

    | -l | Lists the filenames where the pattern matches |'
