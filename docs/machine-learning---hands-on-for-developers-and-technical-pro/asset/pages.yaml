- pgno: 84
  md: "Covered in the section are the basic statistics: the sum, minimum and maximum,\
    \ mean, mode, median, range, variance, and standard deviation. Once again, I'll\
    \ cover both Java and Clojure variations. With Clojure we have the bonus of something\
    \ called REPL, which stands for “read, evaluate, print, loop,” meaning you can\
    \ type the commands out and get the results of code easily. Java simply does not\
    \ have this luxury in version I.8, but there are services on the Internet that\
    \ provide REPL-like interfaces for Java if you want to experiment.\n\nI will assume\
    \ from this point on that you have the collection of scores in a value called\
    \ numList.\n\n# Minimum and Maximum Values\n\nFinding the minimum and maximum\
    \ values of a list of numbers, while seemingly groundbreaking in terms of stats\
    \ or machine learning, is still worthwhile to know.\n\n# Mathematical Notation\n\
    \nIt's perfectly fine to use the words min and max, but it's also acceptable to\
    \ use an upper and lower arrow.\n\n+   ^ for the minimum value.\n* for the maximum\
    \ value.\n\n# Clojure\n\nWith Clojure we apply a function to the collection. This\
    \ takes a function (in this instance either min or max) and uses the contents\
    \ of the collection as an argument. If I were to pass directly to min or max,\
    \ I would get the whole collection returned as is classified as one argument.\n\
    \n```\n(def find-min-value [v]\n  (apply min v))\n\n(def find-max-value [v]\n\
    \  (apply max v))\n\n;; Run on the REPL\nch04.core> (find-min-value numlist)\n\
    2.0\nch04.core> (find-max-value numlist)\n10.0\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: "# Chapter 4 Statistics, Linear Regression, and Randomness\n\n# Java\n\nThe\
    \ Collections object will give you access to the methods min and max assuming\
    \ that the input type is a collection. The List<Integer> type covered in the file\
    \ loading earlier in the chapter will work here.\n\n```\nCollections.min(numList);\n\
    Collections.max(numList);\n```\n\n# Sum\n\nThe sum, or rather summation, is the\
    \ addition of a sequence of numbers. The result is a single value of the total.\
    \ The order of the numbers is not important in summation. For example, the summation\
    \ of [1, 2, 3, 4] is is as [3, 1, 4, 2].\n\n# Mathematical Notation\n\nThe mathematical\
    \ notation for summation is the Greek letter sigma, which looks like a big E:\
    \ The more we look at the algorithms used in machine learning, the more you'll\
    \ see the addition of a sequence or collection of numbers happens a lot.\n\n#\
    \ Clojure\n\nWe're using the apply function against the collection again; the\
    \ only change is that function's being applied. The + is classed as a function.\n\
    \n```\n(defn find-sum [v]\n  (apply + v))\n\n;; Run on the REPL\nch04.core>(find-sum\
    \ numlist)\n3113.0\n```\n\n# Java\n\nWith Java, things require a little more thought,\
    \ as we are dealing with a collection of objects. At this point, I could write\
    \ a method to get the sum for me, iterating each value in the collection and adding\
    \ to the cumulative total.\n\n```\npublic int getSum(List<Integer> numList {\n\
    \  int total = 0;\n  for(Integer i : numList){\n    total += i.intValue();\n \
    \ }\n  return total;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 86
  md: "# Chapter 4 Statistics, Linear Regression, and Randomness\n\nAn alternative\
    \ would be to use the Arrays class and use the stream() method. Beware that this\
    \ method uses primitive arrays as its input, so you need to convert the List first.\n\
    \n```\nint[] pNumList = list.stream()\n    .mapToInt(Integer::intValue)\n    .toArray();\n\
    \nint total = Arrays.stream(pNumList).sum();\n```\n\n# Mean\n\nThe mean, or the\
    \ average, is one of the first statistical methods you'll learn at school. When\
    \ we say \"the mean\" or \"the average\" we are normally referencing the arithmetic\
    \ mean. The mean gives us a good idea of where the middle is in a set of data.\n\
    However, there is a caveat to that: a nice average is working with the assumption\
    \ that the dataset is evenly distributed. If there are outliers within the dataset,\
    \ then the average can be heavily distorted and incorrect. When there are outliers\
    \ in the data, then it's wiser to use the median as a gauge.\n\n# Arithmetic Mean\n\
    \nTo calculate the arithmetic mean, take the set of numbers and sum them. The\
    \ last step is to divide that summed number by the number of items in the dataset.\n\
    \n1 + 2 + 3 = 6\n6 / 3 = 2\n\n# Harmonic Mean\n\nThe harmonic mean is calculated\
    \ differently. There are three steps to complete the calculation.\n\n+   1. For\
    \ each value, calculate the reciprocal value.\n2. Find the average of the reciprocal\
    \ values.\n3. Calculate the reciprocal of the average.\n\n1/1 = 1, 1/2 = 0.5,\
    \ 1/3 = 0.3333\n1 + 0.5 + 0.3333 = 1.8333\n3/1.8333 = 1.6366"
