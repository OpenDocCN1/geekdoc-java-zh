    Artificial neural networks work only with numerical data values. So, if there
    are normalized weights with text values, they need to be converted. This isn''t
    much an issue with the likes of gender, where the common output would be Male
    = 0 and Female = 1. Raw text won''t be suitable, so it will either be tidied up,
    hashed to numeric values, or removed from the test.


    With all data strategies, it''s a case of thinking about your data for classification,
