  md: "# 204 Chapter 10 » Machine Learning with Text Documents\n\nThe words You and\
    \ you would be treated as two separate words by any algorithm, and this would\
    \ influence any weights or scorings.\nIn Java the .toLowerCase method will transform\
    \ the string to lowercase.\n\n```\npublic static String ConvertToLowerCase(String\
    \ in) {\n    return in.toLowerCase();\n}\n```\n\nUsing Clojure closure function\
    \ in the cljure.string/lower-case library will do the same.\n\n```\nuser=> (clojure.string/lower-case\
    \ \"You are worthy, you are family.\\nFocus on what you have to be grateful for.\"\
    )\n\"you are worthy, you are family. focus on what you have to be\ngrateful for.\"\
    )\n```\n\n# Remove Punctuation\n\nIn the same way that words with uppercase and\
    \ lowercase instances will be recognized twice, the same applies to words with\
    \ punctuation attached.\nLet's get back the example text in its current state.\n\
    \n> \"you are worthy, you are family. focus on what you have to be\ngrateful for.\"\
    \n\nThe words worthy, family, and for have punctuation in the way of commas and\
    \ full stops. If the punctuation is not removed, then these also become classed\
    \ as separate words in any analysis. If family and family, were in the same paragraph,\n\
    \nUsing the regular expressions package in Java gives us a usable solution. The\
    \ Pattern class matches the actual regular expression we want to use (\\w is a\
    \ word class containing ASCII letters, numbers, or underscore). The Matcher gives\
    \ the results of the regular expression applied to the input string. I'm using\
    \ a StringBuilder to create an output string that can be used.\n\n```\npublic\
    \ String removePunctuation(String in) {\n    String pattern = \"[\\w]+\";\n\n\
    \    Pattern pattern = Pattern.compile(pattern);\n    Matcher matcher = pattern.matcher(convertToLowerCase(in));\n\
    \    StringBuilder sb = new StringBuilder();\n\n    while(matcher.find()) {\n\
    \        sb.append(matcher.group() + \" \");\n    }\n    return sb.toString().trim();\n\
    }\n```"
