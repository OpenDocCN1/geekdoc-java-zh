  md: '# Chapter 2 Planning for Machine Learning


    The preceding example is a basic piece of code that would automate the cleaning
    process in a short amount of time. However, you are strongly advised to look at
    the source of the problem and refactor the input. If no change is made, then the
    same cost to the business will occur, or you''ll have to clean the data again.


    Ideally, to avoid doing this cleaning, you would employ validation strategies
    at the input stage. So, for example, if you''re using web forms, you should use
    JavaScript to validate the input before it''s saved to the database. Other times
    you inherit it data and occasionally have to employ such methods.


    # Dates and Times


    For time processing, you must ensure that you have a consistent set of dates to
    read. The format you choose is really up to you. International Standard ISO 8601
    lays out the specification for date and time representations in a numerical format.
    The issue with the ISO 8601 standard is that it''s not immune to the Y10K bug
    when timestamps will be incorrect after January 19, 2038. The Temps Atomique International
    (TAI) standard takes into account these issues.


    Regardless of the language you are using, make yourself aware of how the date
    formatting and parsing routines work. For Java, take a look at the SimpleDateFormat
    API, gives you a rundown on all the settings along with useful examples. Use caution
    when running code on distributed systems and also with different zones.


    Table 2.1 shows some of the commonly used date/time formats


    | DATE/FORMAT | SIMPLATEDFORMAT REPRESENTATION |

    |---|---|n| 2014-01-01 | Yyyy-MM-dd |

    | 2014-01-01 11:59:00 | Yyyy-MM-dd hh:mm:ss |

    | 1388577540 | (Unix timestamps are like long variable types but with nano seconds
    added.) |


    I''ve seen many database table with different date formats that have been saved
    as string types. Things have gotten better, but it''s still something in mind.


    # Final Thoughts on Data Cleaning


    Data cleaning is a big deal, because it increases the chances of getting better
    results. For some Big Data projects, 80 percent of the project time is spent on
    data cleaning before the actual analysis starts. It''s important to keep this
    step high up in the project plan and manage time accordingly.'
