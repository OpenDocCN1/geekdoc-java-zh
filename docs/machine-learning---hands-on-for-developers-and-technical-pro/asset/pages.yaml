  md: 'With the dataset set up, you can now turn your attention to the models that
    are going to be used in the project.


    # Determining Which Algorithms to Use


    So far in this book we''ve looked at a single set of data against a single type
    of algorithm in a "Well, it''s so, let''s do this" manner. Depending on the data
    volumes, some algorithms may be better suited than others.


    For example, a J48 decision tree algorithm may be far more effective than a neural
    network to start off, but over time it may be less effective for training with
    large volumes of data. What if we test different types of neural networks with
    different numbers of hidden nodes?


    With this proof-of-concept project, we have the chance to try any model we want.
    For this, I''m going to concentrate on three: the J48 decision tree built from
    Weka, which is an old but very effective Java-based machine learning library;
    a multilayer perceptron using DL4J; and finally, a model using simple linear regression
    from the Apache Commons Math library.


    The beauty of this system is that you can hold different models in type and predict
    against all of them. If you decide to add another model, like a support vector
    machine, you can do so once you have the basic model coded. Let''s take a look
    at the three models I''m going to use.


    # Decision Trees


    The Weka machine learning library has been around a few years now. For some personal
    projects, it''s my go-to-library as the footprint is small. And for most things
    like CSV files, it''s perfect. For a more comprehensive look at Weka, please refer
    to Chapter 5, "Working with Decision Trees."


    The process for this model is simple. Let''s walk through the steps.


    # Creating the J48 Instance


    The main class for Weka-based decision trees is the J48 algorithm. Once the class
    has created the instances, the data is loaded via a buffered reader. With the
    loaded data, the next job is to define the index of the data, which is the main
    output class. When predictions are made, it''s this class that we''re predicting.
    The last step is to then build the J48 classifier.


    ```

    J48 cls = new J48();

    ```


    ```

    Instances inst = new Instances(new BufferedReader("/opt/mlbook/testdata/alldata.arff\));

    ```


    ```

    inst.setClassIndex(inst.numAttributes() - 1);

    cls.buildClassifier(inst);

