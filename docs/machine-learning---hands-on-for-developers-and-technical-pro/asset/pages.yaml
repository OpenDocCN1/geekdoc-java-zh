    # The REST API Microservice


    The backbone of the system is a prediction HTTP API. This accepts requests from
    the two streaming applications and can accept requests directly to the endpoint,
    which could be a web page using an asynchronous Ajax call, for example.


    Using the ComposeAPI library, it''s a trivial matter to create REST-based APIs
    that also include the Swagger front end, which makes testing a lot easier.


    There are number of handlers that need to be implemented, any required values,
    and the function of the endpoint.


