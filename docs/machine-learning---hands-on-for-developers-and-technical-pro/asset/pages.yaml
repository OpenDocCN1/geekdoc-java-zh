- pgno: 26
  md: '# # What Is Machine Learning?


    Let''s start at the beginning, looking at what machine learning actually is, its
    history, and where it is used in industry. This chapter also describes some of
    the software used throughout the book so you can get everything installed and
    be ready to get working on the practical things.


    # ## History of Machine Learning


    So, what is the definition of machine learning? Over the last six decades, several
    pioneers of the industry have worked to steer us in the right direction.


    # ## Alan Turing


    In 1950 paper, “Computing Machinery and Intelligence,” Alan Turing asked, “Can
    machines think?” (For the full paper, see the link)


    www.csee.umbc.edu/courses/471/papers/turing.pdf


    The paper describes the “Imitation Game,” which involves three participants—a
    human acting as a judge, another human, and a computer that is attempting to convince
    the judge that it is human. The judge would type into a terminal program to “talk”
    to the other two participants.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Chapter 1 ■ Is Machine Learning?


    computer would respond, and the judge would decide which response came from the
    computer. If the judge couldn''t consistently tell the difference between the
    human and computer responses, then the computer won the game.

    The test continues today in the form of the Loebner Prize, an annual competition
    in artificial intelligence. The aim is simple enough: convince the judges that
    they are chatting with a human instead of a computer bot program.


    # Arthur Samuel


    In 1959, Arthur Samuel defined machine learning as a field of study that "gives
    computers the ability to learn without being explicitly programmed." Samuel is
    credited with creating one of the first self-learning computer programs with his
    work at IBM. He focused on games as a way of getting the computer to learn things.

    The game choice for Samuel was checkers because it is a simple game but requires
    strategy from which the program could learn. With the use of alphabeta pruning
    (eliminating nodes that do not need evaluating) and minimax strategies (minimizing
    the loss for the worst case), the program would discount moves and thus improve
    memory performance of the program.

    Samuel is widely known for his work in artificial intelligence, but he was also
    noted for being one of the first programmers to use hash tables, and he certainly
    made a big impact at IBM.


    # Tom M. Mitchell


    Tom M. Mitchell is the chair of machine learning at Carnegie Mellon University.
    As the author of the book Machine Learning (McGraw-Hill, 1997), his definition
    of machine learning is often quoted.


    > A computer program is said to learn from experience E with respect to some classes
    of tasks T and performance measure P, if its performance at tasks T, as measured
    by P, improves with the experience E.


    The important thing here is that you now have a set of objects to define machine
    learning.


    +   - Task (T), either one or more

    - Experience (E)

    - Performance (P)


    So, with a computer running a set of tasks, the experience should be leading to
    performance increases.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Chapter 1 = What Is Machine Learning?


    # Summary Definition


    Machine learning is a branch of artificial intelligence. Using computing, we design
    systems that can learn from data in a manner of being trained. The systems might
    learn and improve with experience and, with time, refine a model that can be used
    to predict outcomes of questions based on the previous learning.


    # Algorithm Types for Machine Learning


    There are a number of different algorithms that you can employ in machine learning.
    The required output is what decides which to use. As you work through the chapters,
    you''ll see the different algorithm types put to work. Machine learning algorithms
    characteristically fall into one of two learning types: supervised or unsupervised
    learning.


    # Supervised Learning


    Supervised learning refers to working with a set of labeled training data. For
    every example in the training data you have an input object and an output object.
    An example would be classifying Twitter data (Twitter data is used in the later
    chapters of the book). Assume you have the following data from Twitter; these
    would be your input data objects:


    > Really loving the new St Vincent album!

    #fashion I''m selling my Louboutins! Who''s interested? #louboutins

    I''ve got my Kafka cluster working on a load of data. #data


    For your supervised learning classifier to know the outcome of each tweet, you
    have to manually enter the answers; for clarity, I''ve added the result output
    object at the start of each line.


    ```

    music Really loving the new St Vincent album!

    clothing #fashion I''m selling my Louboutins! Who''s interested?

    #louboutins

    bigdata I''ve got my Kafka cluster working on a load of data. #data

    ```


    Obviously, to classify any sense of the data when run properly, you have to work
    manually on a lot more input data. What you have, though, is a training set that
    can be used for the later classification of data.


    There are issues with supervised learning that must be taken into account. The
    bias-variance dilemma is one of them: the machine learning model performs accurately
    using different training sets. High-bias models contain restricted learning sets,
    whereas high-variance models learn with complexity'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'against noisy training data. There''s a trade-off between the two models. The
    key is to settle with the trade-off and when to apply which type of model.


    # Unsupervised Learning


    On the opposite end of this spectrum is unsupervised learning, where you let the
    algorithm find a hidden pattern in a load of data. With unsupervised learning
    there is no right or wrong answer; it''s just a case of running the machine learning
    algorithm and seeking what patterns and outcomes occur.


    Unsupervised learning might be more a case of data mining than actual learning.
    If you''re looking at clustering data, then there''s a good chance you''re going
    to spend a lot of time with unsupervised learning in comparison to something like
    artificial neural networks, which are trained prior to being used.


    # The Human Touch


    Outcomes will change, data will change, and requirements will change. Machine
    learning cannot be seen as a write-it-once solution to problems. Also, it requires
    human hands and intuition to write these algorithms. Arthur Samuel''s checkers
    program basically improved on what the human had already taught it. The computer
    needed a human to get started, and then it built on that basic knowledge. It''s
    important that you remember that.


    Throughout this book I talk about the importance of knowing what question you
    are trying to answer. The question is the cornerstone of any data project, and
    it starts with open discussions and planning. (Read more about this in Chapter
    2, "Planning for Machine Learning.")


    It''s only in rare circumstances that you can throw data at a machine learning
    routine and have it start to provide insight immediately.


    # Uses for Machine Learning


    So, what can you do with machine learning? Quite a lot, really. This section breaks
    things down and describes how machine learning is being used at the moment.


    # Software


    Machine learning is widely used in software to enable an improved experience with
    the user. With some packages, the software is learning about the user''s behavior
    after its first use. After the software has been in use for a period of time,
    it begins to predict what the user wants to do.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Chapter 1 - What Is Machine Learning?


    # Spam Detection


    For all the junk mail that gets caught, there''s a good chance a Bayesian classification
    filter is doing the work to catch it. From the early days of SpamAssassin Google''s
    work in Google Mail, there''s been some form of learning to figure out whether
    a message is good or bad.


    Spam detection is one of the classic uses of machine learning, and over time the
    algorithms have gotten better and better. Think about the e-mail program you use.
    When it sees a message it thinks is junk, you ask to confirm whether it is junk
    or isn''t. If you decide that the message is spam, the system learns from that
    message and from the experience. Future messages will, ideally, be treated correctly
    from then on.


    # Voice Recognition


    Apple''s Siri service on many iOS devices is another example of software machine
    learning. You ask Siri a question, and it works out what you want to do. The result
    might be sending a tweet or a text message, or it could be setting a calendar
    appointment. If Siri can''t work out what you''re asking at, it performs a Google
    search on the phrase you used.


    Siri is an impressive service that uses a device and cloud-based statistical model
    to analyze your phrase and the words in it to come up with a resulting action
    for the device to perform.


    There''s a huge adoption of voice-activated assistants in the home like Amazon''s
    Alexa and the Google Home device that take in voice commands and use machine learning
    to decide what the user is trying to do and come back with a response that is
    helpful.


    # Stock Trading


    There are lots of platforms that aim to help users make better stock trades. These
    platforms have to do a large amount of analysis and computation to make recommendations.
    From a machine learning perspective, decisions are made for you on whether to
    buy or sell a stock at the current price. It takes into account the historical
    opening and closing prices and the buy and sell volumes of that stock.


    With four pieces of information (the low and high prices plus the daily opening
    and closing prices) a machine learning algorithm can learn trends for the stock.
    Apply this with all stocks in your portfolio, and you have a system to aid you
    in the decision whether to buy or sell.


    Bitcoins are a good example of algorithmic trading; the virtual coins are bought
    and sold based on the price the market is willing to pay and the price at which
    existing coin owners are willing to sell.'
  merge: -1
  img_proc: true
