  md: '# Statistics, Linear Regression, and Randomness


    After acquiring and cleaning our data, it''s now time to focus our attention on
    some numbers. As a gentle introduction, it''s a good idea to revisit some statistics
    and how they can be used. In addition, I''ll cover standard deviation, Bayesian
    techniques, forms of linear regression, and the power of random numbers.


    The code to accompany this chapter will be in both Java and Clojure and will show
    you how to use some libraries as well as how to code these algorithms yourself.


    # Working with a Basic Dataset


    Before we dive into this chapter, we require some data to work from. I have prepared
    a dataset of 474 scores from the judging of a television program (more on this
    later). They''re all integers and give us a nice introduction into statistics.


    As the chapter progresses, we''ll add to this dataset and do some prediction work.'
