    # Dealing with Errors from LibSVM


    There are variations of the LibSVM library around the Internet and different ways
    the random number generator handles numbers on differing operating systems. If
    you come across an error like the following:


    ```

    java.lang.NoSuchFieldException: rand

    java.lang.Class.getField(Unknown Source)

    weka.classifiers.LibSVM.buildClassifier(LibSVM.java:1618)

    weka.gui.explorer.ClassifierPanel$16.run(ClassifierPanel.java:1432)

    at java.lang.Class.getField(Unknown Source)

    weka.classifiers.functions.LibSVM.buildClassifier(LibSVM.java:1618)

    weka.gui.explorer.ClassifierPanel$16.run(ClassifierPanel.java:1432)

    ```


    it''s worth using later versions of Weka with the new package manager (version
    3.7 and later).


    # Saving the Model


    You can save the model for this classification. On the result list, you can see
    the data and time that the LibSVM classification was run. Right-click (Alt-click
    if you are a Mac user) functions.LibSVM and select Save Model. Find a safe place
    to save the model for future use.


    # Implementing LibSVM with Java


    Using LibSVM with the Weka toolkit is easy to implement, but there comes a time
    when you''ll want to use it within your own code so you can integrate it within
    your own systems.


