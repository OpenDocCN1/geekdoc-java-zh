  md: '# Chapter 9 ■ Artificial Neural Networks 167


    can be done in the same time it takes a human to make one—it''s obvious why

    the majority of stock market systems have gone to the automated trading side.


    High-frequency trading is usually done on a supervised learning method;

    there is a lot of training data available from which to learn. The artificial
    neural

    network is looking for entropy from the incoming data.


    # Credit Applications


    Although many examples of credit applications are performed with decision

    trees, they are often run with artificial neural networks. With the variety of

    application data available, it''s a fairly straightforward task to train the model

    to spot good and bad credit factors.


    # Data Center Management


    Google uses neural networks for data center management. With incoming data

    on loads, operating temperatures, network equipment usage, and outside air

    temperatures, Google can calculate efficiency of the data center and be able to

    adjust the settings on monitoring and cooling equipment.


    Jim Gao started this as a Google 20 percent project (a program in

    which Google employees are encouraged to use 20 percent of their work time

    on their own projects) and, over time, has trained the model to 99.6 percent

    accurate. If you are interested in reading more about this, check Google''s blog

    post on the subject here:


    http://googleblog.blogspot.ca/2014/05/better-data-centers-through-

    machine.html


    # Robotics


    Artificial intelligence has been used in robotics for several years. Some artificial

    intelligence requires pattern recognition, and some huge amounts of

    sensor data to be fed into a neural network to determine what movement or

    action to take.


    Training models in robotics takes an awful long time to create, mainly because

    there are potentially many different inputs and output variables to process

    and learn from. For example, developers of autonomous driving vehicles need

    hundreds of thousands of hours of previous driving data to make a model that

    can handle many road conditions.


    The car manufacturer Tesla collects the live driving data from its vehicles;

    this means it is generating knowledge 24 hours a day. This data is used to enrich

    the self-driving experience in its vehicles. Personally, I still prefer my hands
    on

    the wheel; that''s just my preference.'
