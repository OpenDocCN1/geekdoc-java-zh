    Kafka is now ready for use, although it''s not doing anything useful at the

    moment; we''ll move on to that. In this development setup, the correct

    routine to close it down is to close Kafka first (Ctrl-C will stop the application)

    and then do so with Zookeeper. If you connect Zookeeper while Kafka is

    running, the broker will not be able to connect to anything and start feeding

    out errors in the console.


    # Kafka as a Multinode Cluster


    Whereas the single-node cluster has one broker connected to Zookeeper,

    multinode cluster has many brokers connected to Zookeeper, and the log is

    dributed across the cluster. You can create this cluster locally, but it''s not
    a

    configuration that should really be used in a production setting. It does, however,

    in this example, I''ll set up a three-broker configuration running on a single
    Zookeeper cluster.


    There are some configuration aspects that we need to do before we start Kafka.

    in the config directory, there is the server.properties file; this is the config-

    uration for a single broker. If you open the file and look for the broker.id key,

    y you will see the value 0 for it. The comments also give important information.'
