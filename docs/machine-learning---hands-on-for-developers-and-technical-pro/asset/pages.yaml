    A job definition enables it to run within the Hadoop framework; additional information
    is added like the input and output formats and the paths to use to read data and
    write the results.


    ```

    public static void main(String[] args) throws IOException {

    JobConf conf = new JobConf(BlankHadoopJob.class);

    conf.setJobName("BlankHadoopJob");


    conf.setOutputKey(Text.class);

    conf.setOutputValue(IntWritable.class);


    conf.setMapper(Map.class);

    conf.setCombiner(Reduce.class);

    conf.setReducer(Reduce.class);


    conf.setInputFormat(InputFormat.class);

    conf.setOutputFormat(OutputFormat.class);


    FileInputFormat.setInputPaths(conf, new Path(args[0]));

    OutputFormat.setOutputPath(conf, new Path(args[1]));


    JobClient.runJob(conf);

    ```


    Some developers complain about the amount of code you need to write in Java to
    get MapReduce working. It''s never been an issue for me (as I have templates set
