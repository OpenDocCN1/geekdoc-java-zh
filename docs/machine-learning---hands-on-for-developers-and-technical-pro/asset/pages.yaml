    # Summary


    This is an involved chapter, covering the core concepts of how neural networks
    actually work. It''s worth exploring both the Weka and DeepLearning (DL4J) libraries
    and seeing which one fits the best for your work and projects.


    If said early in the chapter, it''s worth exploring all the algorithmic options
    before settling on a neural network. It''s better to have a model that''s explainable
    than not. The black-box nature of these neural models makes it incredibly difficult
    to justify the predictions if anyone questions them.


    Care must be taken going forward, especially with the predictions, with live customer
    data. While it''s a computer doing the work and making the predictions, it''s
    still our responsibility to make sure they are fair, correct, and do not negatively
    impact another party.'
