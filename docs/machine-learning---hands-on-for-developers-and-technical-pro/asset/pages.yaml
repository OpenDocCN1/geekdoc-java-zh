- pgno: 21
  md: '# Introduction


    Well, times have changed since writing the first edition of this book. Between
    2014 and now there is more emphasis on data and what it can do for us but also
    how that power can be used against us. Hardware has gotten better, processing
    has gotten much faster, and the ability to classify, predict, and decide based
    on our data is extraordinary. At the same time, we become much more aware of the
    risks of how data is used, the biases that can happen, and that a lot of black-box
    models don''t always get things right.


    Still, it''s an exciting time to be involved. We still create more data than we
    can sensibly process. New ideas involving machine learning are being presented
    daily. The appetite for learning has grown rapidly, too.


    Data mining and machine learning have been around a number of years. When you
    look closely, the machine learning algorithms that are being applied aren''t any
    different from what they were years ago; is new is how they are applied. When
    you look at scale, the number of organizations that are creating the data, it''s
    really, in my opinion, a minority. Google, Facebook, Twitter, Netflix, and a small
    handful of others are the ones getting the majority of mentions in the headlines
    with a mixture of algorithmic learning and tools that enable them to scale. So,
    the real question you should ask is, “How does all this apply to the rest of us?”


    Data with large scale, near-instant processing, has come to the fore. The emphasis
    has moved from batch systems to more streaming-based systems like Kafka. I admit
    there will be times in this book when I look at the Big Data side of machine learning—it''s
    a subject I can''t ignore—but it''s only a small factor in the overall picture
    of how to get insight from the available data. It is important to remember that
    I am talking about tools, and the key is figuring out which tools are right for
    the job you are trying to complete.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Aims of This Book


    This book is about machine learning and not about Big Data. It''s about various
    techniques used to gain insight from your data. By the end of the book, you will
    have seen how various methods of machine learning work, and you will also have
    some practical explanations on how the code is put together, leaving you with
    a good idea of how you could apply the right machine learning techniques to your
    own problems.


    There''s no right or wrong way to use this book. You can start at the beginning
    and work your way through, or you can just dip in and out of the parts you need
    to know at the time you need to know them.


    # "Hands-On" Means Hands-On


    Many books on the subject of machine learning that I''ve read in the past have
    been very heavy on theory. That''s not a bad thing. If you''re looking for in-depth
    theory with complex-looking equations, I applaud your rigor. I''m more hands-on
    with my approach to learn and to projects. My philosophy is quite simple.


