- pgno: 126
  md: '# CHAPTER 6

    Clustering


    One of the more common machine learning strands you''ll come across is clustering,
    mainly because it''s very useful. For example, marketing companies love because
    they can group customers into segments. This chapter describes the details of
    clustering and illustrates how clusters work and where they are used.


    > NOTE Please don''t confuse machine learning clustering with clusters of machines
    in a networking sense; we''re talking about very different here.


    # What Is Clustering?


    If you boil down all the definitions of clustering out there, you get "organizing
    a group of objects that share similar characteristics." It''s classed as an unsupervised
    learning method, which means there''s no prior training data from which to learn.
    In Figure 6.1 you see three distinct groupings of data; each one of those groups
    is a cluster.


    The main aim is to find structure within a given set of data. Because there are
    a lot of algorithms to choose from, clustering casts a wide net. This is where
    experimentation comes in handy; which algorithm is the right choice? Sometimes
    you just need to put some code together and play with it. You''ll do that shortly.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Chapter 6 Clustering


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_127_0.png)


    Figure 6.1: A graph representation of a cluster


    # # Where Is Clustering Used?


    Clustering is a widely used machine learning approach. Although it might seem
    simple, do not underestimate the importance of grouping multivariate data into
    refined groupings.


    # # The Internet


    Social media network analysis uses clustering to determine communities of users.
    With so many users on Facebook, for example, using these sorts of techniques can
    refine advertising to show that certain ads go to specific groups of customers.


    If you''ve searched on one of many mapping websites, you might have seen clustering
    at work when there are a lot of interest pins built up in a given location. Instead
    of showing all the pins, which would provide a bad user experience, clustering
    is used to define the group of pins within the given location.


    Website logs and search results are often clustered to show more relevant search
    groups. A number of companies are using clustering to refine engine queries.


    # # Business and Retail


    Market research companies use clustering a lot. With surveys that contain many
    variables, a multivariate system like clustering gives marketers a better definition
    of groups of customers in relation to the answers given in the survey. This might
    be broken down by population, location, and previous buying habits, for example.
    With the clusters defined, the marketing companies can try to develop new products
    or think about testing products for certain clusters in the results.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Chapter 6 Clustering 105


    Along with association rules learning (discussed in Chapter 7), clustering is
    also used for basket analysis. Certain auction sites use clustering because there
    is no defined stock number in the listings. It''s easier to run clustering and
    group items and preferences use association rules.


    # Law Enforcement


    Crimes are logged with all the aspects of the felony listed. Police departments
    are running clustering and other machine learning algorithms to predict when and
    future crimes will happen. The result of this might be that patrol cars are deployed
    to contain problem areas at certain times, or specialist help is sent to areas
    where certain sorts of crimes have high numbers.


    # Computing


    With the rise of the “Internet of Things,” we are now collecting more data from
    sensors than ever before. Clustering can be used to group the results of the sensors.
    For example, thinking of a temperature sensor, you might cluster date and time
    against the temperature. Another example would be movement detection, a number
    of passive infrared sensors could be generating data on movement within a location.
    Is a location hotspot at a specific time? This information can be easily clustered
    and inspected.


    Course work in the education sector, especially with the advent of large-scale
    learning online, can be clustered into student groups and results. For example,
    do certain clusters of students excel at courses compared to other students? Clustering
    is used often in digital imaging. When large groups of images need to be segmented,
    it''s usually a cluster algorithm that works on the set and defines the clusters.
    Algorithms can be trained to recognize faces, objects, or borders, for example.


    # Clustering Models


    As previously mentioned, the goal of clustering is to segment data into specific
    groups. There are many different clustering algorithms for the simple fact that
    there is really one common denominator among all clusters—that you''re trying
    to find groups of objects.


    For example, there are distribution models that use multivariate distributions
    for their modeling. Graph models can show cluster-like properties when the nodes
    start showing as subsets connected with one main edge, as shown in Figure 6.2.


    You can also approach simple clustering with groups in the same way you group
    in a structured query language.'
  merge: -1
  img_proc: true
- pgno: 129
  md: "# Chapter 6 Clustering\n\n![](img/3c4b0b8c972f1d075e8ebe064f0b2476_129_0.png)\n\
    \n**Figure 6.2:** Nodes and edges as clusters\n\nOne of the most commonly used\
    \ centroid models is the k-means model, which is where the k-means algorithm comes\
    \ in. The k-means algorithm is basically vector quantization. This chapter concentrates\
    \ on the k-means algorithm and creates a basis of the walk-through later in the\
    \ chapter.\n\n# How the K-Means Works\n\nIf you have a group of objects, the idea\
    \ of the k-means algorithm is to define a number of clusters. What's important\
    \ is that it's up to you to define how many clusters you want. For example, say\
    \ I have 1,000 objects and I want to find 4 clusters:\n\nn (objects) = 1000\n\
    k (clusters) = 4\n\nEach one of the clusters has a centroid (sometimes called\
    \ the mean, hence the name k-means), a point where the distance of the objects\
    \ will be calculated. The clusters are defined by an iterative process on the\
    \ distances of the objects to calculate which near the centroid. This is all done\
    \ unsupervised; you just have to let the algorithm do its processing and inspect\
    \ the results. After the iterations have taken place to the point where the objects\
    \ don't move to different centroids, it is assumed that the k-means clustering\
    \ is complete.\nThe following pseudocode describes what's happening:\n\n```\n\
    calculate initial values for means m[1],m[2],m[3],m[4]\n\nassign object to nearest\
    \ center\n\nwhile(there are changes in the mean position) {\n  estimate the means\
    \ to classify into clusters\n  for(i in 1 to k) {\n    m[i] = mean of the samples\
    \ for cluster i\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Initialization


    First, the algorithm must initialize by assigning a cluster to every observation
    made. The random partition method places the cluster points toward the center
    of the dataset. Another initialization method is the Forgy method, which spreads
    out the randomness of the initial location of the cluster.


    After the initial cluster observations are assigned, you can look at the assignment
    and updating of the algorithm.


    # Assignments


    Each observed object is assigned to the cluster to find out which cluster centroid
    is assigned to; the algorithm uses Euclidean distance measurement. The sum of
    squares is then calculated by squaring the Euclidean distances to each cluster
    centroid, and the one with the smallest value is the cluster that the object is
    assigned to.


    Calculating the Euclidean distance is simple and requires only some entry-level
    math; if you can remember how to do by Pythagoras’ theorem, you are already there.


    Assume a basic grid of six positions on the X-axis (horizontal) and four positions
    on the Y-axis (vertical). The center point of my cluster is currently at 1,6,
    and as shown in Figure 6.3.


    The distance is 3-1-2 on the vertical side and 6-5 on the horizontal axis. Using
    Pythagoras’ theorem, the squared distance is


    ```

    2^2 + 5^2 = 4 + 25 = 29

    ```


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_130_0.png)'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'The square root of 29 is 5.38. This carries on for all the objects in the dataset
    that are assigned to the clusters.


    # Update


    In the update step, you assign the object values to the cluster. The recalculation
    of the center points of the cluster (the centroids) is taken as the average of
    the values of the objects that are part of the cluster. This process carries on
    as a loop until the entities in each group no longer change.


    The k-means algorithm is very effective, but it''s not without its problems. It
    can take a few runs with the data to get a decent fit of clusters. When you choose
    too few, objects can easily spill into the incorrect cluster over a period of
    time during the processing.


    # Calculating the Number of Clusters in a Dataset


    When presented with a dataset, it can be hard to define the number of clusters
    you want to classify against. Sometimes this number will already be determined
    by a stakeholder. For example, in a marketing initiative you might have the following:


    +   ■ Low-frequency, low-value customers

    ■ Low-frequency, high-value customers

    ■ High-frequency, low-value customers

    ■ High-frequency, high-value customers


    There are times when this information is not available, and you have to find a
    balance for making your decisions. There are a number of methods for calculating
    the optimum.


    # The Rule of Thumb Method


    Nothing beats your finger and sticking it in the air to see which way the wind
    is blowing. There''s a simple calculation that is roughly equivalent for clusters:
    the number of clusters (k) is equal to the square root of the number of objects
    divided by 2.


    ```

    K = √objects/2

    ```


    If you have 250 objects, half of that is 125, and the square root of 125 is 11.18—so,
    there are 11 clusters. This can obviously be tested and reapplied depending on
    how the trial runs go.'
  merge: -1
  img_proc: true
