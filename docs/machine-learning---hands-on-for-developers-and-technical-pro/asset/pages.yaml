    # Model Configuration


    The model we''re going to use is a three-layer neural network with an input layer,
    a hidden layer, and the output layer.

    Our input layer is made up of 78 input nodes; this represents each pixel in the
    image (28 x 28), and the output of our input layer is sent to the hidden layer.
    The hidden layer is made up of 500 nodes and output to a 100-output layer.

    The final layer uses the Softmax activation method to determine the output class,
    which consists of 10 different numbers in the MNIST dataset.


    ```

    MultiLayerConfiguration config = new NeuralNetConfiguration.Builder()

    .seed(randomSeed)

    .activation(Activation.RELU)

    .weightInit(WeightInit.XAVIER)

    .update(new Nadan())

    .l2(rate * 0.005)

    .list()

    .layer(new DenseLayer.Builder()

    .nIn(imageHeight * imageWidth)

    .nout(500)

    .build())

    .layer(new DenseLayer.Builder()

    .nIn(500)

    .nout(100)

    .build())

    .layer(new OutputLayer.Builder(LossFunction.NEGATIVELOGLIKELIHOOD)

    .activation(Activation.SOFTMAX)

    .nout(outputClasses)

    .build())

    ```


