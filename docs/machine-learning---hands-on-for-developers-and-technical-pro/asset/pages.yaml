- pgno: 286
  md: '# What Topics Do We Require?


    This system is performing a couple of functions. First, there''s data going into
    the system, there needs to be a topic that''s dedicated for events. This will
    be the first port of call for our event messages; we''ll look at the actual message
    content shortly.


    Event data comes in two forms, training data and commands, and will be handled
    by a streaming API application. If the event contains a command, then it should
    be executed within the application; otherwise, the event is training data, and
    the system will push that to topic, the training data topic.


    The training data topic is accepting the actual content, which is a line of comma-separated
    variables. There''s no custom-made consumer application handling information;
    this will be completed by using Kafka Connect, which will consume the CSV data
    for us and persist it to a file.


    Predictions require two topics, one for the request and one for the response.
    The prediction request will take a JSON payload with a key to request a model
    type to use and a feature value to make the prediction. The final breakdown looks
    like Table 12.3.


    # Table 12.3: Topic Breakdown


    | TOPIC NAME | DESCRIPTION |

    | --- | --- |

    | event _ stream | Incoming event messages with either a command or a training
    type. |

    | training _ data _ topic | The topic handles raw CSV entries. |

    | prediction _ request _ topic | When the user wants to run a prediction, it''s
    via this topic. The JSON message will have a model type and a feature value to
    predict against. |

    | prediction _ response _ topic | Results from the prediction are sent to this
    topic. |


    # What Format Is the Data In?


    The message format for this project is JSON. As we are different actions in each
    event, there may be a command event or a training data event. The prediction requests
    are also in JSON format. The reason for this is a simple matter of future proofing.


    # Events


    Events can take one of two forms, a command event and a training data event.


    ```

    {"type":"command", "payload":"build_mlp"}

    ```'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Chapter 12 Machine Learning Streaming with Kafka 265


    The command event is basically an instruction to trigger a build of the machine
    learning model. They''re not built all at the same time as would start to drag
    down the system and degrade performance. The idea is that we can trigger any build
    type at any time. So, for example, build _mlp will trigger the build for our neural
    multilayer perceptron.


    ```

    {"type":"training", "payload":"3,4,5,6"}

    ```


    The training data consists of the CSV values in the payload.


    # Predictions


    To make a prediction via Kafka, the process is to send a JSON message to the prediction
    request topic. The payload contains all of the three values from the scores, and
    the model returns the predicted value.


    ```

    {"model":"mlp", "payload":"3,4,5"}

    ```


    The responses from the model are not returned in a traditional programming sense
    but there needs be some form of mechanism to trigger the training commands. Once
    the operate to create a consumer application to read the response from Kafka.


    # Continuous Training


    There are numerous options for how to update our trained models. As data passes
    through the training topic and is persisted to disk through the connector, there
    needs to be some form of mechanism to trigger the training commands.


    One approach is to send an event to the event topic itself. Once the Kafka streaming
    job passes the message, it will send a request to the API to start the required
    model build.


    The alternative to sending a payload message is to use a scheduled cron job on
    the server. This does have one downside; it means that there''s a command action
    that isn''t registered in the event stream.


    # How to Install the Crontab Entries


    If you want to install the cron entries, then you must do this via the crontab
    command. Open a terminal window and type the following:


    ```

    crontab -e

    ```


    Depending on the editor you have set as the default (it could be vi or nano, for
    example), the current crontab will be displayed.'
