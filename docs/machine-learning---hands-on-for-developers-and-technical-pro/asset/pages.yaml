  md: '# Chapter 14  Machine Learning with R


    If your .csv file has the column names in the first line, then use header=TRUE,
    otherwise, set it to FALSE. The separator is defined with the sep keyword, and
    you define whatever delimiter you want. If you have missing values, it''s wise
    to use the fill flag as well to ensure that your data will have the correct number
    of elements in each row.


    # MySQL Queries


    Installing the RMySQL package gives you access to MySQL databases. You can pull
    queries into R so they can be processed.


    ```

    >install.packages("RMySQL", dependencies=TRUE)

    ```


    If you are working on a Windows-based system, then the library requires the source
    files. Two environment variables are required to compile.


    +   - Sys.setenv(PKG_CPPFLAGS = "-I/path/to/mysql/include/dir")

    - Sys.setenv(PKG_LIBS = "-L/path/to/library/dir -lmysqlclient")

    - install.packages("RMySQL", type = "source")


    As with Java, you need to define a connection to the database before you can query
    it.


    ```

    > con <- dbConnect(MySQL(), user="mysql", password="mypass",

    dbname="mydb", host="localhost")

    ```


    From there, you have a connection, you can see what tables are in the database.


    +   - dbListTables(con)


    You query a table. The data from the query is returned as a data frame.


    ```

    dta <- dbGetQuery(con, "SELECT * FROM mytable")

    ```


    There are a number of databases supported in R, including SQLite3, PostgreSQL,
    and Oracle.


