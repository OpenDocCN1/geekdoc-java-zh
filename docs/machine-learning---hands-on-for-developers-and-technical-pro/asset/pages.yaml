  md: "# Chapter 10 ■ Machine Learning with Text Documents 209\n\nThe result is the\
    \ number of documents divided by the number of times the term was found in those\
    \ documents, the logarithm of the quotient is the value passed back.\n\n# Computing\
    \ the TF/IDF Score\n\nThe final step is to compute the TF/IDF score. This is done\
    \ by multiplying the result of the term frequency with the score of the inverse\
    \ document frequency.\n\n```\npublic double computeTfIdf(List<String> doc, List<List<String>>\
    \ docs, String term) {\n    return getTermFrequency(doc, term) *\n    getInverseDocumentFrequency(docs,\
    \ term);\n}\n```\n\nAs we are looking for the score for the term dapibus, the\
    \ document with the term frequency we were to calculate, along the entire corpus\
    \ and the term, is passed into the `computeTfIdf` method.\n\ndouble score = tfidf.computeTfIdf(wordDoc4,\
    \ allDocuments, \"dapibus\");\n\nIf the term were to appear in more documents,\
    \ the score would begin to reach the value of 1. In this instance, dapibus does\
