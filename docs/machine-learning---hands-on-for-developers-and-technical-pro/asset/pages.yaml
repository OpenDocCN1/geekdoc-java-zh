    _confluent-monitoring

    _schemas

    connect-configs

    connect-offsets

    connect-statuses

    testtopic

    ```


    # # Describing a Topic


    The describe topic flag, --describe, will output to the console the general information
    plus any other added configuration settings of a given topic.


    ```

    $ bin/kafka-topics --zookeeper localhost:2181 --describe

    --topic testtopic

    Topic: testtopic PartitionCount:1 ReplicationFactor:1 Configs:

    isr: 0 Partition: 0 Leader: 0 Replicas: 0

    ```


    # # Deleting Topics


    Deleting a topic is done within the same kafka-topics command with the --delete
    flag. If your broker or topic configuration contains delete.topic.enable-false,
    your request will be ignored, but no warning will be given. Depending on the size
    of your topic log, it may not delete immediately; it''s worth checking again with
    the --list flag to confirm.'
