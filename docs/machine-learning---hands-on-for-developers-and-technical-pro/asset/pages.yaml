    Coefficients:

    (Intercept) dollarProfit

    0.6226 16.2286

    ```


    Now that you know the intercept (0.6226) and the dollar profit amount of 16.22,
    you can expand on the model information using the summary command.


    ```

    > expend the summary of the model

    > summary(model)

    ```


    ```

    Call:

    lm(formula = secondsCall - 3Q)

