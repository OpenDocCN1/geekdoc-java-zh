  md: '# # APPENDIX B

    The Twitter API Developer Application Configuration


    Before you can start consuming data from Twitter into an application, you will
    need to set up a development account and install the Twitter developer environment.
    This setup process uses Twitter''s developer site (http://dev.twitter.com) and
    requires you to have an existing Twitter account. If you don''t have a Twitter
    account, you can sign up for one at http://www.twitter.com.


    The developer website enables users to create keys for their applications to access
    Twitter''s APIs. I''m going step-by-step, assuming you''ve never done it before.
    If you already know how to create Twitter developer access and the required credentials,
    then you can skip the remainder of this section.


    +   1. Open a web browser and go to http://dev.twitter.com. Log in with your Twitter
    credentials.


    +   2. Find your Twitter avatar at the top right. Hover your mouse pointer arrow
    next to it. Click the My Applications in the drop-down menu.


    +   3. Click the Create A New Application button, as shown in Figure B.1.


    +   4. Fill in the required fields for the application name, the description,
    and a URL for your website (see Figure B.2). This information is required if Twitter
    users decide to use their accounts with your application. You can leave the callback
    URL blank, because you won''t be using it.'
  merge: -1
