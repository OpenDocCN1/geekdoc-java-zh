- pgno: 402
  md: '# Appendix C ■ Useful Commands


    find has saved my programming sanity many times, and if I''m looking for a file
    that has a method name but I can''t remember where it is (this happens a lot with
    large codebases), I don''t have to fire up my IDE. I just use find from the command
    line.


    # Combining Commands and Redirecting Output


    The explanations for the Unix commands showed how to use one command at a time.
    Using the pipe symbol (|), you can chain these commands together. With the greater-than
    symbol (>), you can redirect output to a new file.


    ```

    $ grep ''hhh'' sample.txt | sort | less

    987 1391548780 hhh bbb

    993 1391548785 hhh bbb

    ```


    The preceding command uses grep to search for ''hhh'' in the sample.txt file and
    runs the result through the sort command; this is written to a new file called
    newssample.txt. Finally, the output of the new file is sent to the console with
    cat.


    # Picking a Text Editor


    The choice of text editor is a personal one, akin to liking a specific music group,
    sports team, or favorite actor or actress. I''m not saying fights have broken
    out about these editors, but conversations over coffee and beer have sometimes
    been emotional. If you want to know out personality type of a software developer,
    just ask what text editor he uses.


    Ultimately, it''s up to what sort of text editor you''ll use. You might not be
    using it all the hours of the day, but for the times you need to quickly look
    at or edit something, you''ll want an editor that you can fluently and without
    fuss.


    # Colon Frenzy: Vi and Vim


    Vi was written in 1976 by Bill Joy and was introduced in 1978 when it was released
    as part of BSD Unix. Pronounced "vee eye," it''s the mainstay of Unix system administrators
    for a long time. It''s one of the most widely used text editors today.


    The thing that makes vi challenging is the concept of modes for the "ex" commands
    that operate on lines of text; they are needed to write the file (:w) or quit
    the application (:q). If you want to quit without saving, then :q is needed. Likewise,
    overwriting an existing file'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# 384 Appendix C Useful Unix Commands


    uses wi; There is an insert mode while you are entering new text, and there is
    an edit mode for moving and changing text. Vi is so simple there is a coffee mug
    available with all (100 percent) of the vi commands on it.


    It takes time to learn the commands, as how to delete lines, yank text into "buffers"
    and then paste it, search for text, and do other basic functions. After a bit
    of time, the modes actually become second nature. Vi includes a powerful "macro
    language" for adding your commands or command sequences.


    I''m still a user of vi; it covers most of my needs. However, I have to admit
    it drove me mad when I first used it in 1995. I''ve still not moved over to vim
    (ViImproved), though it has windows, better editing, mouse support, and colorful
    syntax highlighting.


    # Nano


    For those who can''t cope with the colon command, the nano editor provides command-line
    heaven without the complication. The nano editor lets you navigate around using
    the arrow keys (vi uses the h, j, k, and keys for naviating). The editor includes
    a decent number of hints at the bottom of the screen, so you can see how you can
    save and quit.


    For sheer speed of loading, editing, saving, and exiting a document, nano is a
    good choice.


    # Emacs


    Compared to vi and nano, Emacs is the big gun of the text editors. It''s highly
    customizable and configurable. With the resurgence in Lisp-like languages, Clojure
    being an example, the usage of Emacs is on the rise. For all my development, I
    use Emacs. Along with CIDER, it gives me editing, a REPL, and debugging all in
    one place.


    If you want to try Emacs, I recommend the emacs version of the program. Emacs
    bypasses the whole insert mode that vi users are willing to adopt. Like nano,
    in Emacs you type on the screen and see the changes. It also has more than 2,000
    built-in commands for those who are happy to use Emacs as their main editor for
    everything. It is extensible by writing Lisp programs. To exit Emacs if you start
    it accidentally, press Ctrl-X and then Ctrl-C.'
  merge: -1
