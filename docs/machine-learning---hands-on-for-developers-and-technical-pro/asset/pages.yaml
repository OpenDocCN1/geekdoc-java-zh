  md: '# 338 Chapter 14 » Machine Learning with R


    # Windows


    The .exe download for Windows provides binaries for running on 32- or 64-bit machines.
    The base package download will provide you with everything you need to get started.


    # Linux


    Binary downloads are available for Debian, Ubuntu, Red Hat, and SUSE Linux distributions.
    If you want to save some time (and effort) and you''re running Debian or Ubuntu,
    you can use apt-get to install the r-base and r-base-dev packages. Ensure that
    the repository package is up-to-date. For users of the Red Hat family of distributions,
    use the command sudo yum install R.


    # Your First Run


