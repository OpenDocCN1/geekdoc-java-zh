- pgno: 191
  md: '# Medical Monitoring


    Medical machinery can be monitored via artificial neural networks, which involves
    the constant updating of many variables, such as heart rate, blood pressure, and
    so on. Conditions that have multiple variations and trigger symptoms can be calculated
    and monitored, and staff can be alerted when the variables go over certain thresholds.


    There have been huge advances in medical imaging and using deep learning techniques
    such as convolutional neural networks to predict disease areas and support decision-making
    for the consultants and doctors.


    # Trusting the Black Box


    There have been large-scale adoption of neural networks since the first edition
    of this book. The values of data have increased, meaning that there is enough
    data to support accurate predictions, it''s difficult to explain how these black-box
    algorithms are working.


    The rule of thumb can be this: if you are unsure of the relationship between input
    and output of your model, then investigating with a neural network is a good way
    to go to. If you have a good understanding of the input/output relationship, then
    chances other traditional methods would be used.


    I''ve always encouraged students, software professionals, and management to explore
    all the algorithmic options before settling on a neural network, especially if
    your findings will eventually end up scrutinized by another professional or the
    public at large.


    Over time there has been coverage over the incorrect predictions made by many
    strands of artificial intelligence. The term explainable AI has taken the forefront
    of the discussion when it comes to creating algorithms that are going to predict
    on behalf of others.


    Furthermore, it is important you have sufficient volumes of data for training
    neural networks. Small volumes of training will produce low accuracy scores, and
    there are times other machine learning algorithms, even linear regression, perform
    better than a neural network.


    It''s also important to look at the quality of the data. Does it cover the spectrum
    of the question you are trying to answer? Biased data will give you incorrect
    predictions, and you will have no way of explaining why.


    Ultimately, before you invest time, data, and money into a neural network, it''s
    really worth asking yourself if this is the best way to do this task.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Breaking Down the Artificial Neural Network


    Before you jump into data and a few examples, I will cover the rationale and working
    of the neural network.


    # Perceptrons


    The basis for a neural network is the *perceptron*. Its role is quite simple.
    It receives an input signal and then passes the value through some form of function.
    It outputs the result of the function. (See Figure 9.2).


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_192_0.png)


    **Figure 9.2:** A simple perceptron


    Perceptrons deal with numbers when a number or vector of numbers are passed to
    the input. It is then passed to a function that calculates the outgoing value;
    this is called the *activation function*. The node can handle any number of inputs—Figure
    9.3 shows two inputs passing into the function—and it takes the weighted sum of
    all the inputs.


    Assuming the input is a vector Z, you''d end up with something like this:


    ```

    Z1 = 2

    Z2 = 5

    Z3 = 1

    ```


    The weighted sum of all the inputs is calculated as follows:


    ```

    \sum wiZi

    ```


    In other words, “add it all up.” For the likes of me, who is not used to too much
    math notation, it looks like the following:


    ```

    2w1 + 5w2 + 1w3

    ```


    The outgoing part of the node has a set threshold. If the summed value is over
    the threshold, then the output, denoted by the $y$ variable, is 1, and if it''s
    below the threshold, then $y$ is 0 (zero).'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'You end up with the following equation:


    ```

    $$\if \sum w_iz_i \geq 1 \text{ then } y = 1$

    $\text{else } y = 0$

    ```


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_193_0.png)


    **Figure 9.3:** Perceptron with two inputs


    The weight of the perceptron can be zero or any other value. If the weight value
    is zero, then it does not alter the node value coming into the perceptron. Likewise,
    inputs can be positive or negative numbers. The key to the output is based on
    the weighted sum against the threshold.


    That''s the basis of a single-node perceptron. When you strip the components apart,
    it''s quite basic in composition.


    # Activation Functions


    The activation *function* is the processing that happens after the input is passed
    into the neuron. The result of this function determines whether the value is passed
    to the output axon and onto the next neuron in the network.


    Commonly, the Sigmoid function (see Figure 9-4) and the hyperbolic tangent are
    used as activation functions to calculate the output.


    The Sigmoid function outputs only one of two values: 0 and 1. For the grammers,
    the function is written as follows:


    ```

    return 1.0 / (1.0 + Math.exp(-x));

    ```


    The sharpness of the curve could also be altered if required, but for most applications
    a straight function is fine.'
  merge: -1
  img_proc: true
