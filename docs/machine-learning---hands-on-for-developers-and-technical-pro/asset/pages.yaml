  md: "The getClusterCentroids() method returns a set of instances. It's a case of\
    \ iterating through these and printing the result of each instance. As six clusters\
    \ were created (via the rule of thumb calculation), there should be six instances\
    \ printed.\n\n# Printing the Cluster Information\n\nTo show which cluster instance\
    \ belongs to, the showInstanceInCluster() method takes the k-means model and the\
    \ assigned instances. The code then iterates each of the instances and prints\
    \ which one is assigned to on model.\n\n```\npublic void showInstanceInCluster(SimpleKmeans\
    \ kmeans, Instances data) {\n    try {\n        for (int i = 0; i < data.numInstances();\
    \ i++) {\n            System.out.println(\"Instance \" + i + \" is in cluster\
    \ \" + kmeans.clusterInstance(data.instance(i)));\n        }\n    } catch (Exception\
    \ e) {\n        e.printStackTrace();\n    }\n}\n```\n\n# Making Predictions\n\n\
    The program so far covers the creation of clusters and reporting the results of\
    \ the instances. What happens when new data comes in? At present, you're not able\
    \ to predict anything. It would be nice to have a method you can access that takes\
    \ new values and predicts which cluster the result would be.\n\nInstances can\
    \ be created within code and run against the clustering model to see where the\
    \ new values would lie. You could create another method to return the cluster\
