  md: '# Installing Packages


    R comes with a comprehensive selection of packages that are available to download.
    You can see the Comprehensive R Archive Network (usually referred to as CRAN)
    packages that are available on the R website at www-r-project.org/. They are a
    broad spectrum of statistics, data-processing, and other tools.


    To install the packages, you use the install.packages() function from the R command
    line. It takes care of everything for you.


