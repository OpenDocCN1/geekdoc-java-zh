  md: "# Chapter 9 Artificial Neural Networks 173\n\n![](img/3c4b0b8c972f1d075e8ebe064f0b2476_196_0.png)\n\
    \n**Figure 9.7:** Multilayer perceptron with one hidden layer\n\nThis is where\
    \ the neural network becomes useful. You can train the network for classification\
    \ and pattern recognition, but it does require training. You can train an artificial\
    \ neural network by unsupervised or supervised means.\n\nThe issue is that you\
    \ don't know what weighted values should be for the hidden layer. By changing\
    \ the bias in the Sigmoid function, you can vary the output layer, an error function\
    \ can be applied, and the aim is to get the value of the error function to a minimum\
    \ value.\n\nI described the threshold function within the perceptron previously\
    \ in the chapter, but this isn't suitable for your needs. You need something that\
    \ is continuous and differentiable. With the bias option implemented in the Sigmoid\
    \ function, each run of the network refines the output and the error function.\
    \ This leads to a better-trained network and more reliable answers.\n\n# Back\
    \ Propagation\n\nWithin the multilayer perceptron is the concept of *back propagation*,\
    \ short for “backward propagation of errors.\" Back propagation calculates the\
    \ gradients and maps the inputs to the correct outputs.\n\nThere are two steps\
    \ to back propagation: the propagation phase and the updating of the network.\
    \ This would occur for all the neurons in the network.\n\nIf you were to look\
