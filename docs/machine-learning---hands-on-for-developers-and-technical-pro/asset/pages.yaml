  md: "```\npublic static void main(String[] args) throws Exception {\n    System.out.println(\"\
    Starting BasicSparkWordCount...\");\n    if (args.length < 1) {\n        System.err.println(\"\
    Usage: BasicSparkWordCount <file>\");\n        System.exit(1);\n    }\n\n    SparkSession\
    \ sparkSession = SparkSession\n    .builder()\n    .appName(\"BasicSparkWordCount\"\
    )\n    .getOrCreate();\n```\n\n```\nJavaRDD<String> lineOfText = sparkSession.read()\n\
    \    textFile(args[0]).textFileRDD();\nJavaRDD<String> wordsInEachLine = lineOfText\n\
    \    flatMap(s -> Arrays.asList(s.split(\"\\s+\"))).iterator());\nJavaPairRDD<String,\
    \ Integer> allTheOn = wordsInEachLine\n    mapToPair(word -> new Tuple<>(word,\
    \ 1));\nJavaPairRDD<String, Integer> finalCounts = allTheOn\n    .reduceByKey((i1,\
    \ i2) -> i1 + i2);\n```\n\n```\nList<Tuple<String, Integer>> output = finalCounts.collect();\n\
    for (Tuple<String, Integer> tuple : output) {\n    System.out.println(\"Segment\
    \ \" + tuple._1 + \" found \" + tuple._2 + \" times.\");\n}\n\nsparkSession.stop();\n\
    System.out.println(\"Finishing BasicSparkWordCount...\");\n```\n\nThe process\
    \ flow of the application works as follows. The SparkSession handles all the setup\
    \ for the Spark application. Any specific config settings and naming would happen\
    \ at this point. The following four lines are where the real work is happening.\n\
    The first stage is using the sparkSession.read() function to load the data into\
    \ RDDs. The strings from the text file. The second stage is to split the words\
    \ in each line by space character. The resulting transform is an array of words.\n\
    Now we're at the third stage, where the mapPair function generates a new RDD with\
    \ the word as the key and the number 1 as a value. The final RDD reduces each\
    \ instance of the word/value pairs in allTheOn.\nTo output results, the .collect\
    \ function is used. This applies the Spark job in the session and collects the\
    \ reduced results from the finalCounts RDD. The resulting list is iterated, and\
    \ the results are displayed to the standard output."
