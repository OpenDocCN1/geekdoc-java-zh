- pgno: 166
  md: '# CHAPTER

    8

    Support Vector Machines


    With most machine learning tasks, the aim is usually to classify something into
    a group that you can then inspect later. When it''s a couple of class types that
    you''re trying to classify, then it''s a trivial matter to perform the classification.
    When you are dealing with many types of classes, the process becomes more of a
    challenge. Support vector machines help you work through the challenging classifications.


    This chapter looks at support vector machines: how the basic algorithm works in
    a binary classification sense, and then an expanded discussion on the tool.


    # What Is a Support Vector Machine?


    A support vector machine is essentially a technique for classifying objects. It’s
    a supervised learning method, the usual route for getting a support vector machine
    set up would be to have training data and data test to test the algorithm. With
    support vector machines, you have the linear classification—it’s either that object
    or it’s nonlinear. This chapter looks at both types.


    There is a lot of comparison using a support vector machine versus the artificial
    neural network, especially as some methods of finding minimum errors and the Sigmoid
    function are used in both.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'It''s easy to imagine a support vector machine as either a two- or three-dimensional
    plot with each object located within a point in space. Essentially, if there''s
    sufficient distance in the area, then the process of classifying is easy enough.


    # Where Are Support Vector Machines Used?


    Support vector machines are used in a variety of classification scenarios, such
    as image recognition and handwriting pattern recognition.


    Image classification can be greatly improved with the use of support vector machines.
    Being able to classify thousands or millions of images is becoming more and important
    with the use of smartphones and applications like Instagram. Support vector machines
    can also do text classification on normal text or web documents, for instance.


    Medical science has long used support vector machines for protein classification.
    The National Institute of Health has even developed a support vector machine protein
    software library. It is a web-based tool that classifies protein into its functional
    family.


    Some people criticize the support vector machine because it can be difficult to
    understand, unless you are blessed with a good mathematician who can guide and
    explain to you what is going on. In some cases you are left with a black-box implementation
    of a support vector machine that is taking input data and producing output data,
    but you have little knowledge in between.


    Machine learning with support vector machines takes the concept of a perceptron
    (as explained in Chapter 9) a little further to maximize the geometric margin.
    It''s one of the reasons why support vector machines and artificial neural networks
    are frequently compared in function and performance.


    # The Basic Classification Principles


    For those who''ve not immersed themselves in the way classification works, this
    section offers an abbreviated version. The next section covers how the support
    vector machine works in terms of the classification. I''m keeping the math as
    simple as possible.


    # Binary and Multiclass Classification


    Consider a basic classification problem. You want to figure out which objects
    are squares and which are circles. These squares and circles could represent anything
    you want—cats and dogs, humans and aliens, or something else. Figure 8.1 illustrates
    the two sets of objects.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/3c4b0b8c972f1d075e8ebe064f0b2476_168_0.png)


    **Figure 8.1:** Two objects to classify


    This task would be considered a binary classification problem, because there are
    only two outcomes; it''s either one object or the other. Think of it as a 0 or
    a 1. With some supervised learning, you could figure out pretty quickly where
    those classes would lie with a reasonable amount of confidence.


    What about when there are more than two classes? For example, you can add triangles
    to the mix, as shown in Figure 8.2.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_168_1.png)


    **Figure 8.2:** Three objects to classify


    Binary classification isn''t going to work here. You''re now presented with a
    multiclass classification problem. Because there are more than two classes, you
    have to use an algorithm that can classify these classes accordingly. It''s worth
    noting, though, that some multiclass methods use pair-wise combinations of binary
    classifiers to get to a prediction.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Linear Classifiers


    To determine in which group an object belongs, you use a linear classifier to
    establish the locations of the objects and see if there''s a neat dividing line—called
    a hyperplane—in place; there should be a group of objects clearly on one side
    of the line and another group of objects just as clearly on the opposite side.
    (That''s the theory, anyway. Life is rarely like that, which is something that''s
    covered later in the chapter) Assume that all your ducks are in a row. .well,
    two separate groups.


    As shown in Figure 8.3, visually it looks straightforward, but you need to compute
    it mathematically. Every object that you classify is called a point, and every
    point has a set of features.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_169_0.png)


    **Figure 8.3:** Linear classification with a hyperplane


    For each point in the graph, you know there is an x-axis value and there is a
    y-axis value. The classification point is calculated as follows:


    ```

    $sign(ax + by + c)$

    ```


    The values for a, b, and c are the values that define the line; these values are
    ones you choose, and you''ll need to tweak them along the way until you get a
    good fit (clear separation). What you are interested in, though, is the result;
    you want a function that returns +1 if the result of the function is positive,
    signifying the point in one category, and returns -1 when the point is in the
    other category. The function''s resulting value (+1 or -1) must be correct for
    every point that you''re trying to classify.


    Don''t forget that you have a training file with the correctly classified data
    so that you can judge the function''s correctness; this approach is a supervised'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Chapter 8 ■ Support Vector Machines


    method of learning. This step has to be done to figure out where the line fits.

    Points that are further away from the line show more confidence that they belong
    to a specific class.


    # Confidence


    You''ve just established that each point has a confidence based on its distance
    from the hyperplane line. The confidence can be translated into a probability.

    That gives the following equation:


    ```

    $P[+1|x] = \frac{1}{1+\exp(-(ax+by+c))}$

    ```


    This is for one point. What you need is the probability for every set of lines;
    these are assigned to each of the objects in the training data.


    ```

    $$\prod_{i=1}^{N} P[L_i|x_i] = \prod_{i=1}^{N} \frac{1}{1+\exp(-l_i(ax+by+c))}$

    ```


    Probabilities are multiplied because the points have been drawn independently.
    You have an equation for each point that indicates how probable it is a hyperplane
    is the correct categorization. Combining the probabilities for each point produces
    what is commonly defined as the "likelihood of data"; you are looking for a number
    close to 1 as possible.

    Remember that probability is based on a value between 0 and 1. Within a set of
    objects, you''re looking for a set of line parameters with the highest probability
    that confirms the categorization is correct.


    # Maximizing and Minimizing to Find the Line


    Using a log function that is always increasing maximizes values that are above
    the equation. So, you end up with a function written as follows:


    ```

    $$\sum_{i=1}^{N} -log(1+\exp(-l_i(ax+by+c)))$

    ```


    To achieve minimization, you just multiply the equation by -1. It becomes a "cost"
    or "loss" function. The goal is to find line parameters that minimize this function.

    Linear classifiers are usually fast; they will process even large sets of objects
    with ease. This is a good thing when using them for document classification where
    the word frequencies might require measuring.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# How Support Vector Machines Approach Classification


    The basic explanation of linear classification is that the hyperplane creates
    the line that classifies one object and another. Support vector machines take
    that a step further.


    Within the short space available, I outline how support vector machines work in
    both linear and nonlinear form. I also show you how to use Weka to do practical
    work for you.


    # Using Linear Classification


    Look at the set of circle and square objects again. You know how a hyperplane
    divides the objects into 1 or -1 on the plane.


    Extending that notion further, support vector machines define the maximum margin,
    assuming that the hyperplane is separated in a linear fashion. You can see this
    in Figure 8.4 with the main hyperplane line giving the following notation:


    ```

    w \cdot x - b = 0

    ```


    This dot product shows the normal vector, and x is the point of the object. There
    is an offset of the hyperplane that goes from the origin to the normal vector.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_171_0.png)


    **Figure 8.4:** Support vector machines max margin hyperplane'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Chapter 8 ■ Support Vector Machines 149


    As the objects are linearly separable, you can create another two hyperplanes—edge
    hyperplanes—that define the offset on either side of the main hyperplane. There
    are no objects in the region that spans between the main hyperplane and the edge
    hyperplanes.


    On one side, there''s the equation


    ```

    $w \cdot x - b = 1$

    ```


    and on the other side there''s


    ```

    $w \cdot x - b = -1v$

    ```


    The objects that lie on the edge hyperplanes are the support vectors (see Figure
    8.5).


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_172_0.png)


    Figure 8.5: The support vectors on the hyperplane edges


    When new objects are added to the classification, then the hyperplane and its
    edges might move. The key objective is to ensure a maximum margin between the
    +1 hyperplane and the -1 edge hyperplane.


    If you can manage to keep a big gap between the categories, then there''s an increase
    in confidence in your predictions. Knowing the values of the hyper-plane edges
    gives you a feel for how well your categories are separated.


    After minimizing the value $w$ (called $||w||$ in mathematical notation), you
    can look at optimizing $w$ by applying the following equation:


    ```

    $||w||_2$

    ```'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Basically, you''re taking half of ||w|| squared instead of using the square
    root of ||w||. Based on Lagrange multipliers, to find the maxima and minima in
    the function, you can now look for a saddle point and discount other points that
    don''t match zero (fit inside the saddle).


    > NOTE For those that don''t know, a saddle point is a mathematical function where
    you have two variables at a critical point when both function values are zero.
    It''s called a saddle point as that the shape it produces in graphic form. You
    can read more about at http://wikipedia.org/wiki/Saddle_point.


    You''re shaping the graph into a multidimensional space and seeing where the vectors
    lie in order to make the category distinctions as big as possible. With standard
    quadratic programming, you then apply the function expressing the training vectors
    as a linear combination


    ```

    $w = \sum_{i=1}^{n} \alpha_i y_i x_i.$

    ```


    Where $\alpha i$ is greater than zero, the xi value is a support vector.


    # Using Non-Linear Classification


    In an ideal world, the objects would lie on one side of the hyperplane or the
    other. Life, unfortunately, is rarely like that. Instead, you see objects straying
    from the hyperplane, as shown in Figure 8.6.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_173_0.png)


    Figure 8.6: Objects rarely go where you want them to go.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Chapter 8 ■ Support Vector Machines


    By applying the kernel function (sometimes referred to as the “kernel trick”),
    you can apply an algorithm to fit the hyperplane''s maximum margin in a feature
    space. The method is similar to the dot products discussed in the linear methods,
    but this replaces the dot product with a kernel function.


    With a radial basis function, you have a few kernel types to choose from: the
    hyperbolic tangent, Gaussian radial basis function (or RBF, which is supported
    in Weka), and two polynomial functions—one homogenous and the other inhomogeneous.


    The full scope of nonlinear classification is by the means of the introductory
    nature of this book. If you want to implementing them, then look at the radial
    basis functions in the LibSVM classes when you use Weka. Now take a look at what
    Weka can do for you to perform support vector machine classification.


    # Using Support Vector Machines in Weka


    Weka can classify objects using the support vector machines algorithm, but the
    implementation isn''t complete and requires a download before you can use it.
    This section shows how to set it up and run the support vector machines algorithm
    on some test data.


    # Installing LibSVM


    The LibSVM library is an implementation of the support vector machines algorithm.
    It was written by Chih-Chung Chang and Chih-Jen Lin from the National Taiwan University.
    The library supports a variety of languages as well as Java including C, Python,
    .NET, MATLAB, and R.


    # Weka LibSVM Installation


    Using LibSVM libraries within the Weka GUI application requires an installation
    of a JAR file. You can install LibSVM from GitHub. You can clone the binary distribution
    by running the following command (assuming you have Git installed):


    ```

    git clone https://github.com/cjlin/libsvm.git

    ```


    The required files download into a clean directory.


    You need to copy the libsvm.jar to the same directory (usually in the /Applications
    directory). You can easily drag and drop the file if desired; I work from the
    command line most of the time:


    ```

    cp ./libsvm-3.18/java/libsvm.jar /Applications/weka-3-6-10

    ```'
