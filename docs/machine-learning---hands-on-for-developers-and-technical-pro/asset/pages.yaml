  md: '# APPENDIX


    # Further Reading


    Machine learning is only part of the story; it''s the application of knowing what
    to get the insight you need. The domain of data science combines several disciplines
    that cover programming, math, domain knowledge, and visualization. It''s rare
    for one book to cover all. To that end, I''ve included some further reading that
    will be big, in-depth, heavy affairs that can take time to read, digest, and appreciate.
    (I know what you''re thinking, and yes, I have bought and read all of these books.)


    # Machine Learning


    The machine learning arena is a huge domain and the majority of the books written
    are big, in-depth, heavy affairs that can take time to read, digest, and appreciate.
    Two stand out:


    +   *Data Mining – Practical Machine Learning Tools and Techniques* by Ian H.
    Witten, Eibe Frank, and Mark A. Hall (Morgan Kaufmann, 2001, ISBN 9780123748560)


    +   *Collective Intelligence in Action* by Satnam Alag (Manning, 2008, ISBN 9781939388313)'
