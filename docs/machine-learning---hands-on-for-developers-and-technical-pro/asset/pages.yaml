    Even at 24 bits, an image, such as Figure 11.3, is just a collection of numbers
    in grid form; there''s just more information going on. The image illustrated in
    Figure 11.1 is $8 \times 8$ pixels and has only two colors (black or white, zero
    or one). On the other hand, the sunflower was a 24-bit color image and has 15,360,000
    bits of information. In the context of machine learning, it may be prudent to
    reduce the color depth to speed up training; reducing the image size will help
    too.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_247_0.png)


    # Images in Machine Learning


    As you are aware from reading this book and working through the examples, most
    of what we are doing with machine learning is feeding information, usually in
    number form, and finding patterns that can then be defined into models.

    So, if we can convert image data into a grid of numbers, what we are left with
    is a matrix grid that a machine learning algorithm can train against.


    You will find that most of the machine learning examples use a fairly small grid
    of numbers; images that are $16 \times 16$ and $28 \times 28$ pixels are used
    a lot. The reason for this is processing time; if an image is too large, then
    it will take a long time, depending on machine performance, to convert and process
    the image. When you are dealing with tens of thousands of images, these processes
    can take hours.'
