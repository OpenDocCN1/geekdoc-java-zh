- pgno: 82
  md: "# Loading and Converting the Dataset\n\nYou can download the dataset from the\
    \ GitHub repository. In the folder /data/ch4 there is a file called stats.txt.\
    \ As we are dealing with the text of numbers, there are some tasks that are required\
    \ before we can start any work. Let's look at the first file, shown here:\n\n\
    2\n5\n3\n4\n...\n3\n9\n8\n\n/data/ch04/stats.txt\n\nWhile it appears that there\
    \ are numbers on each line of the text file, they are still treated as text. If\
    \ we were to use mathematical notation at this point, our list of numbers would\
    \ look like this:\n\n{2, 5, 3, 4, ...3, 9, 8}\n\nOur first task is to convert\
    \ the contents of each line of the text file and convert them to an integer that\
    \ our program can understand.\n\n# Loading Data with Clojure\n\nReading a file\
    \ in Clojure can be done in one command using slump and taking the file path as\
    \ an argument. Slurping the file will consume it all, there's some modification\
    \ to do. This is called transforming.\nCurrently the file is one long line of\
    \ numbers and newlines.\n\n```\n2\\n5\\n3\\n4\\n...3\\n9\\n8\n```\n\nThe split\
    \ command in the clojure.string library will split on a regular expression. This\
    \ will produce a collection of strings. The last thing to do is to map through\
    \ each string and cast it to a double value. The double parsing is using a Java\
    \ function, as Clojure is a JVM language. We can call Java with ease Java Interop.\n\
    \n```\n(defn load-file [filepath]\n  (map (fn [v] (Double/parseDouble v))\n  \
    \  (-> (slurp filepath)\n       (s/split \"\\n\"))))\n```"
