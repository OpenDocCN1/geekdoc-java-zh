- pgno: 35
  md: '# The Internet of Things


    Connected devices that collate all manner of data are sprouting all over the place.
    Device-to-device communication is hardly new, but it hadn''t really hit the public
    minds until fairly recently. With the low cost of manufacture and distribution,
    now devices are being used in the home just as much as they are in industry.


    Includes home automation, shopping, and smart meters for measuring energy consumption.
    These things are in their infancy, and there''s still a lot of concern about the
    security aspects of these devices. In the same way mobile device location is a
    concern, companies can pinpoint devices by their unique IDs and eventually associate
    them to a user.


    On the plus side, data is so rich that there''s plenty of opportunity to put machine
    learning in the heart of the data and learn from the devices'' output. This may
    be as simple as monitoring a house to sense ambient temperature—for example, is
    it too hot or too cold?


    # Languages for Machine Learning


    This book uses the Java and Clojure programming languages for the working examples.
    The reasons are simple: Java is a widely used language, especially in the enterprise,
    and the libraries are well supported. Clojure gives better data handling abilities
    thanks to its functional nature: data goes into a function, and the result is
    output as data. Java isn''t the only language to be used for machine learning—far
    from it. If you''re working for an existing organization, you may be restricted
    to the languages used within it.


    With most languages, there is a lot of crossover in functionality. With the languages
    that access the Java Virtual Machine (JVM) there''s a good chance that you''ll
    be accessing Java-based libraries. There''s no thing as one language "better"
    than another. It''s a case of picking the right tool for the job. The following
    sections describe some of the other languages that you can use for machine learning.


    # Python


    The Python language has increased in usage because it''s easy to learn and to
    read. It also has some good machine learning libraries, such as scikit-learn,
    PyML, and pyrrain. Python was developed as a Python interpreter for the JVM, which
    may be worth investigating.


    If you are looking at the Tensorflow libraries, then Python is an obvious choice,
    and while there are Java extensions, I''d recommend using Python in the first
    instance.'
