    Multiple R-squared: 0.9717, Adjusted R-squared: 0.9695

    F-statistic: 446.4 on 1 and 13 DF, p-value: 1.898e-11


    So, you have a basic model that gives you a regression equation of secondsCall
    = 0.6226 + 16.2268 * profit amount. To put the regression line on the plot, use
    the abline function.


    ```

    > abline(model)

    ```


    # Making a Prediction


    Assume that someone made a $5 profit, and you want to know the duration of the
    call based on the model you just created. Using the predict command, you can make
    the prediction.


    ```

    > make a basic prediction of someone $5.

    > predict(model, newdata=data.frame(dollarProfit=5))

    ```'
