- pgno: 47
  md: '# Data Processing


    After you have a team in place and a rough idea of all of this is going to get
    put together, it''s time to turn your attention to what is going to do all the
    work for you. You must give thought to the frequency of the data process jobs
    that will take place. It will occur only once in a while, and then it might be
    false investing over the long term. It makes more sense to start with what you
    have in hand and then add as you go along and as you notice growth in processing
    times and frequency.


    # Using Your Computer


    Yes, you can use your own machine, either a desktop or a laptop. I do my development
    on an Apple MacBook Pro. I run the likes of Kafka, Spark, and Hadoop on this machine
    as it''s pretty fast, and I''m not using terabytes of data. There''s nothing to
    stop you from using your own machine; it''s available, and it saves financial
    outlay to get more machines. Obviously, there can be limitations. Processing a
    heavy job might mean you have to turn your attention to less processor-intensive
    tasks, but never rule out the option of using your own machine.


    Operating systems like Linux and macOS tend to be preferred over Windows, especially
    for Big Data-based operations. The best choice comes down to what you know best
    and what suits the best project order to get the job done efficiently. I don''t
    believe there''s only one right way to do things.


    # A Cluster of Machines


    Eventually you''ll come across a scenario that requires you to use a cluster of
    machines to do the work. Frameworks like Hadoop are designed for use over clusters
    of machines, which make it possible for the distribution of work to be done in
    parallel. Ideally the machines should be on the same network to reduce network
    traffic latency.


    At this point in time, it''s also worthwhile to add a good system administrator
    to the science team. Any performance that can be improved over the cluster will
    bring a marked performance improvement to the whole project.


    # Cloud-Based Services


    If the thought of maintaining and paying for your own hardware does not appeal,
    consider using some form of cloud-based service. Vendors such as Amazon, Rackspace,
    and others provide scalable servers where you can increase or decrease, the number
    of machines and amount of power that you require.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Chapter 2 ■ Planning for Machine Learning 23


    The advantage of these services is that they are “turn on/turn off” technology,
    enabling you to use only what you need.

    Keep a close eye on the cost of cloud-based services, as they can sometimes prove
    more expensive than using a standard hosting option over longer time periods.
    Some companies provide dedicated Big Data services if you require the likes of
    Spark to do your processing. With cloud-based services, it’s always important
    to turn the instance off; otherwise, you’ll be charged for the usage while the
    instance is active.


    # Data Storage


    There are some decisions to make on how the data is going to be stored. There
    might be on a physical disc or deployed on a cloud-based solution.


    # Physical Discs


    The most common form of storage is the one that you will more than likely have
    in your computer to start off with. The hard disc is adequate for testing and
    small jobs. You will notice a difference in performance between physical discs
    and solid-state drives (SSDs); the latter provides much faster performance. External
    drives are cheap, too, and provide a good storage solution for when data volumes
    increase.


    # Cloud-Based Storage


    Plenty of cloud-based storage facilities are available to store your data as required.
    If you are looking at cloud-based processing, you’ll more than likely purchasing
    some form of cloud-based storage to go with it. For example, if you use Amazon’s
    Elastic Map Reduce (EMR) system, then you would be using it alongside the S3 storage
    online; other solutions exist for the Microsoft Azure platform and Google Cloud
    Compute.

    Like cloud processing, storage based on the cloud will cost you on a monthly or
    annual basis. You also have to think about the bandwidth implications of moving
    large volumes of data from your office location to the cloud system, which is
    another cost to keep in mind.


    # Data Privacy


    Data is power and with it comes an awful lot of responsibility. The privacy issue
    will always rage in the hearts and minds of the users and the general public.
    Everyone has an opinion on the matter, and often people err on the side of caution.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'In the last five years there has been a huge emphasis on how user data is used.
    In Europe, the General Data Protection Regulations control how business can use
    personal data within their organizations.

    Ultimately, with great power come great responsibility, and it will be up to you
    how that data is protected and processed.


    # Cultural Norms


    Cultural expectations are difficult to measure. As the World Wide Web has progressed
    since the mid-1990s, there has been a privacy battle about everything from how
    cookies were stored on your computer to a multitude of companies are tracking
    locations, social interactions, ratings, and purchasing decisions through your
    mobile devices.

    If you''re collecting data via a website or mobile application, then there''s
    an expectation that you will be giving something in return for user information.
    When you collect that information, it''s only right to tell the user what you
    intend to do with the data.


    u_markdown": "Supermarket loyalty card schemes are a simple data-collecting exercise.
    For every basket that goes through the checkout, there''s the potential that the
    customer has a loyalty card. In associating that customer with that basket of
    products you can apply machine learning. Over time you will be able to see the
    shopping habits of that customer—her average spend, the day of the week she shops—and
    the customer expects some form of discount promotion for telling you all this
    information.


    So, how do you keep cultural norms inside? By giving customers a clear opt-in
    or opt-out strategy.


    # Generational Expectations


    During sessions of my iPhone development class, I open up with a discussion about
    personal data. I can watch the room divide instantly, and I can easily see the
    deciding factor: age.

    Some people are more than happy to share with their friends, and the rest of the
    world, location, what they are doing, and with whom. These people post pictures
    of their activities and tag them so they could be easily searched, rated, and
    commented on. They use Facebook, Instagram, YouTube, Twitter, and other apps as
    a normal, everyday part of their lives.


    The other group of people, who were older, are not comfortable with the concept
    of handling over personal information. Some of them think that no one in their
    right minds would be interested in such information. Most can''t see the point.

    Although the generation gap may be closing and there is a steady relaxation of
    what people are willing to put on the Internet, developers have a responsibility
    to the suppliers of the information. You have to consider whether the results
    you generate will cause a concern to them or enhance their lives.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Chapter 2 Planning for Machine Learning 25


    You can learn from data, but users get touchy when their names are attached to
    it. Creating hashes of important data is a starting point, but it''s certainly
    not the end game. Consider my name as an MD5 hash. Using the Linux md5sum, I can
    find it out easily, as shown here:


    ```

    $ printf ''%s'' ''Jason Bell'' | md5sum

    a7b19d2ca559f8e94121b549f26333c-

    ```


    Now, I have a hash value, which is a good start, but it''s still not really protecting
    my identity. You now know it and what would possibly relate to it were used as
    a user key in a machine learning process. It wouldn''t take much time for a decent
    programmer with a list of first and last names to generate all md5 values for
    all the combinations.


    Using a salt is a better solution. A salt value is random data that''s used with
    the piece of data to make it more secure and harder to crack.


    Let''s assume the salt value is the number of nanoseconds from January 1970. You
    take that and the string you''re looking to hash:


    ```

    $ printf ''Jason Bell $(date +%s)'' | md5sum

    40e6b48a873c308649dbbea5e16

    ```


    There are different ways of handling the input string. You might want to remove
    spaces, but the concept remains the same. The security of these hashes has to
    be maintained by you when the time comes to interpret the answers, you''ll know
    which customers are the actions you are seeking. Hashes are not just restricted
    to usernames or customer names; they can be applied to any data. Anything that
    you consider private information (known as personally identifiable information
    [PII])—something you don''t want any third party to see—must be hashed.


    # Don''t Cross the "Creepy Line"


    Be not not make the customer freak out by crossing the line in the sand that I
    call the "creepy line." It''s the point where the horrified customer would shriek,
    "How did they know that" For example of a company and what they know about you,
    visit the settings pages of your Google account and take a look at your search
    history or your location history:


    ```

    https://www.google.com/settings/dashboard

    ```


    One near-legendary example in data science, Big Data, and machine learning circles
    is the story of Target and pregnant mothers, which was widely cited on the Internet
    because of Charles Duhigg''s book The Power of Habit (Random'
