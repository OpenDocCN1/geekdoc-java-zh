  md: '# Clustering the Data


    Click the Cluster tab at the top to select the clustering method. By default,
    the Weka cluster uses the Simple EM method (expectation maximization). Clicking
    the Choose button displays a tree of other cluster algorithms that you can use.
    For this example, select SimpleKMeans and then Close; finally, click Start to
    run the algorithm, as shown in Figure 6.7.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_136_0.png)


    Figure 6.7: Selecting SimpleKMeans


    The cluster line in the Clusterer output pane has updated and shows the new cluster
    algorithm you''ll be using:


    ```

    SimpleKMeans -N 2 -A "weka.core.EuclideanDistance -R \

    first "last" -l 500 -S 10

    ```


    There are a few flags that need a little explanation.


    +   - -N determines the number of clusters that the SimpleKMeans is going to create.

    - -A is the distance function used. It defaults to Euclidean distance and uses
    the entire range of values as its range to act on (-R first last).

    - -l flag defines the number of iterations that the k-means does to create.

    - -S is a random number seed. It can be any value you want.'
  merge: -1
  img_proc: true
