- pgno: 36
  md: '# R


    R is an open source statistical programming language. The syntax is not the easiest
    to learn, but I encourage you to take a look at it. It also has a large number
    of machine learning packages and visualization tools. The Rjava project allows
    Java programmers to access R functions from Java code. For a basic introduction
    to R, take a look at Chapter 14, “Machine Learning with R.”


    # Matlab


    The Matlab language is used widely within academia for technical computing and
