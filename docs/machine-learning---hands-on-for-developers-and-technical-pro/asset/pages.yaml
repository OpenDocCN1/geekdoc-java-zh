  md: '# 238 Chapter 11 » Machine Learning with Images


    With something like a CNN, we can make use of the classifier layer and replace
    it with the version of the classifier we want to use. This means we are not replicating
    huge amounts of training where the heavy work is happening, meaning the convolution,
    normalization, pooling, and activation steps.


    Within DeepLearning4], there is a TransferLearning API that will help you refine
    the classifier and save the newly trained model. This is useful for ImageNet-like
    models.


    If you are in a situation where you find yourself with a small training dataset
    or a dataset that know is similar to features that were present in the originally
    trained model, then applying transfer learning will save you development and training
    time. Where possible, always reuse.


    # Summary


    In this chapter, we covered using neural networks to process images. First we
    used the multilayer perceptron to work on the MNIST number data set and then we
    introduced the more complete convolutional neural network for a more thorough
    way of extracting features from image data.


    While these approaches are good to know in theory, their training and application
    times can run into hours and days, depending on the volume of images and the way
    you want to train your model. So, if possible, seek out pretrained models and
    investigate using transfer learning to update the classifier output layer to match
    the domain you are working in.


    In Chapter 12 we bring in a streaming data application, Kafka, and investigate
    how to develop a self-training and updating machine learning system.'
