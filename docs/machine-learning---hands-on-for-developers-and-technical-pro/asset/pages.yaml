- pgno: 153
  md: '# 130 Chapter 7 Association Rules Learning


    Association rules learning isn''t only for retail and supermarkets, though. In
    the field of web analytics, association rules learning is used to track, learn,
    and predict user behavior on websites.


    There are huge amounts of biological data being mined to gain knowledge. Bioinformatics
    uses association rules for protein and gene sequencing. It''s on a smaller scale
    compared to something like computational biology, as it holds in homes of specific
    species compared to something like DNA. So, studies on genomes are part of a branch
    of bioinformatics that''s probably working with it.


    # Web Usage Mining


    Knowing which pages a user is looking at and then suggesting pages might be of
    interest to the user commonplace and "sticky". For this type of mining, you require
    a mechanism for knowing which user is looking at pages; the user could be identified
    by a user session, a cookie ID, or a premium cookie login where site requires
    users to log in to see the information.


    If you have access to your website log files, then there is opportunity for you
    to mine the information. Many companies use the likes of Google Analytics as it
    saves mining logs themselves, but it''s worthwhile doing your own analysis if
    you can.


    The basic log file, for example, against which you could run some basic association
    rules learning. Looking at the Apache Common Log (CLF), you can use the IP address
    of the file that it was trying to access.


    ```

    86.78.88.189 - thuisid [10/May/2014:13:55:59 -0700]

    /GET /myinterestingarticle.html HTTP/1.0* 200 2326

    ```


    By extracting the URL and the IP address, the association rules could eventually
    suggest related content on your site that would be of interest to the user.


    # Beer and Diapers


    It is written on parchment dating many years, the parable of the bear and the
    diapers (or nappies, as I will call them).


