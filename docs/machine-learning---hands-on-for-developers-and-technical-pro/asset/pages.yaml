  img_proc: true
- pgno: 272
  md: '# 250 Chapter 12 » Machine Learning Streaming with Kafka


    # Receiving Messages from the Command Line


    As well as a command-line application to create messages and push them to the
    message log, there is the equivalent to read messages from the log too.


    ```

    $ bin/kafka-console-consumer --bootstrap-server localhost:9092 --topic testtopic
    --from-beginning

    ```


    The --from-beginning flag reads messages from the start of the message log. If
    you leave it out, the application will read messages from the last offset position.
    The application will continue running until you close it with Ctrl+C.


    # Kafka Tool UI


    For those who are not used to or just dont like the command line, there are tools
    available that will make looking after the Kafka cluster a little easier. If you
    are using the Confluent Kafka distribution, you have access to the control center,
    which is a web-based tool for visualizing your cluster (see Figure 12.5). To access
    it, point your web browser to the IP address of your cluster along port 9021,
    for example.


    ```

    http://192.168.1.102:9021

    ```


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_272_0.png)


    Figure 12.5: Control center'
