  md: 'With things being so variable over time, it raises some interesting questions
    on how the model is going to be built. With simple linear regression and decision
    trees the training and model require no configuration or planning: the training
    is run against the data, the model is created, and the evaluation is performed.
    A neural network, on the other hand, needs a little more crafting to get the best
    performance out of it.


    # Data Importing


    I''m using the DeepLearning4J library to create this neural network application.
    One of the positive aspects of DL4J is the amount of that''s gone into loading
    the data.


    To import the CSV data, there''s a dedicated CSVRecordReader class that will import
    the data based on a passed-in delimiter. As there is no header record, there are
    no lines to skip, so that value is set to zero.


    ```

    int numLinesToSkip = 0;

    String delimiter = ",";

    RecordReader recordReader = new CSVRecordReader(numLinesToSkip);

    recordReader.initialize(new FileSplit(new File("/opt/mlbook/testdata/)));

    ```


    # Hidden Nodes


    How many hidden nodes should we use in our model? Given the volume of data is
    going to increase as time goes on, it''s going to be difficult to know how many
    hidden nodes to have.


    There are a few scenarios for training our neural network. We could train against
    the full dataset as set intervals (more on that shortly) or, if the data volumes
    are huge, split out random datasets and train on those, creating several potential
    models to use.


    With many permutations of training data, it''s hard to say how many hidden nodes
    the neural network would require. There is, however, a method to give a rough
    calculation of how many hidden nodes to use (see Figure 12.8).


