    # Developing Neural Networks with DeepLearning4J


    The Weka framework gives a good working system for creating neural networks. The
    system that you''re using will obviously determine how long the model training
    will take. From experience I found there''s a point in the training when Weka
    starts to struggle. When this happens, I look for the alternatives I can use.
    As a Java developer, I use the DeepLearning4J framework; it scales well and can
    be used with Spark to let you scale out large datasets across a cluster.


    Let’s take the vehicle data and use DL4J to create a multilayer neural network.


    # Modifying the Data


    As we has the Arff data file, it knows that the output class is a vehicle type.
    The training data for DL4J is based on a CSV file, but it requires a numerical
    output class instead of a text one. So I changed the output classifications to
    the following:


    | VEHICLE CLASS | DL4J NUMERICAL OUTPUT CLASS |

    |---|---|

    | Bus | 0 |

    | Car | 1 |

    | Truck | 2 |

    | Bike | 3 |


