- pgno: 384
  md: '# Connecting to Social Media with R


    I know, another mention of the Twitter application program interface (API). This
    sort of data is important and not just for sentiment analysis. The majority of
    news, social graphs, and conversations happen on these platforms, and it''s increasingly
    important to keep on top of developments. This goes for R, too; being able to
    connect to Twitter is important.


    In the previous examples you used Twitter''s development account to create the
    authorization keys for the application. You''re essentially forcing your application
    to use these pre-existing keys. That works fine, but you have to approach things
    a little differently with the tweetlibrary.


    Make a note of the consumer key and secret you''ll need to, but there are couple
    of things you need to confirm.


    First, make sure there''s no callback URL. You confirm this on the Settings tab
    in Twitter box is set to true as well. Don''t forget to update the settings for
    them to take effect. Refresh the page until you see the settings are correct.
    Now that Twitter is set up, you can look at R code to help you log in to Twitter.


    You need to open a text editor and edit the following code:


    ```

    library(tweetR)

    cred <- OAuthFactory$new(consumerKey="xxxxxxxxxxxxxxxx"

    consumerSecret="xxxxxxxxxxxxxxxx"

    requestURL="http://api.twitter.com/oauth/request_token",naccessURL="http://api.twitter.com/oauth/access_token",nauthURL="http://api.twitter.com/oauth/authorize"

    downfile(url="http://curl.hax.se/ca/cacert.pem"

    destfile="cacert.pem"

    cred$handshake(cfile="cacert.pem") )

    ```


    Replace the consumer key and secret values with the ones you have for your application.
    Save the file as twitterconnect.r and quit the text editor. Back in the R command
    line, load the file, and it runs as soon as it''s loaded.


    ```

    >source("twitterconnect.r")

    ```


    You see the tweetlibrary loads the dependencies and then connect to Twitter.


    ```

    >source("twitterconnect.r")

    Loading required package: ROAuth

    Loading required package: RURL

    Loading required package: bitops

    Loading required package: digest

    ```'
