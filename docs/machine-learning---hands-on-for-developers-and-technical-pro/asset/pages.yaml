- pgno: 105
  md: '# Working with Decision Trees


    Do not be deceived by the decision tree; at first glance it might look like a
    simple concept, but within the simplicity lies its power. This chapter shows you
    how decision trees work. The examples use Weka to create a working decision tree
    that will also create the Java code for you.


    # The Basics of Decision Trees


    The aim of any decision tree is to create a workable model that will predict the
    value of a target variable based on the set of input variables. This section explains
    where decision trees are used along with some of the advantages and limitations
    of decision trees. In this section, you also find out how a decision tree is calculated
    manually so you can see the math involved.


    # Uses for Decision Trees


    Think about how you select different options within an automated telephone call.
    The options are essentially decision trees that are made for you to get to the
    desired department. These decision trees are used effectively in many industry
    areas.


    Financial institutions use decision trees. One of fundamental use cases is in
    option pricing, where a binary-like decision tree is used to predict the price
    binary-like decision tree is used to predict the price of an option in either
    a bull or bear market.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Marketers use decision trees to establish customers by type and predict whether
    a customer will buy a specific type of product.


    In the medical field, decision tree models have been designed to diagnose blood
    infections or predict heart attack outcomes in chest patients. Variables in the
    decision tree include diagnosis, treatment, and patient data.


    The industry now uses multiple decision trees in movement recognition and facial
    recognition. The Microsoft Kinect platform uses this method to track body movement.
    The Kinect team used one million images and trained three trees. Within one day
    and using a 1,000-core cluster, the decision trees were classifying specific body
    parts across the screen.


    # Advantages of Decision Trees


    There are some reasons to use decision trees. For one thing, they are easy to
    read. After a model is generated, it''s easy to report to others regarding how
    the tree works. Also, with decision trees you can handle numerical or categorized
    information. Later, this chapter demonstrates how to manually work through an
    algorithm with category values; the example walkthrough uses numerical data.


    In terms of data preparation, as long as the data is something like comma-separated
    variables, then you can create a working model. This also makes it easy to validate
    the model using various tests. Decision trees use white-box testing—meaning the
    internal workings can be observed but not changed; you can view the steps that
    are being used when the tree is modeled.


    Decision trees perform well with reasonable amounts of computing power. If you
    have a large set of data, then decision tree learning will handle it well.


    # Limitations of Decision Trees


    With every set of advantages there is usually a set of disadvantages sitting in
    the background. One of the main issues with decision trees is that they can create
    complex models, depending on the data presented in the training set. To avoid
    the machine learning algorithm''s over-fitting the data, it''s sometimes worth
    reviewing the training data and pruning the trees to categories, which will produce
    a more refined and better-tuned model.


    Some of the decision tree concepts can be hard to learn the model cannot express
    them easily. This shortcoming sometimes results in a larger-than-normal model.
    You might be required to change the model or look at different methods of machine
    learning.


    # Different Algorithm Types


    Over the years, there have various algorithms developed for decision tree analysis.
    Some of the more common ones are listed here.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Chapter 5 Working with Decision Trees 83


    # ID3


    The ID3 (Iterative Dichotomiser 3) algorithm was invented by Ross Quinlan to create
    trees from datasets. By calculating the entropy for every attribute in the dataset,
    this could be split into subsets based on the minimum entropy value. After the
    set had a decision tree node created, all that was required was to recursively
    go through the remaining attributes in the set.


    ID3 uses the method of information gain—the measure of difference in entropy before
    and after an attribute is split—to decide on the root node (the node with the
    highest information gain).


    ID3 suffered from over-fitting on training data, and the algorithm was better
    suited to smaller trees than large ones. The ID3 algorithm is used less in favor
    of the C4.5 algorithm, which is outlined next.


    # C4.5


    Quinlan came back for an encore with the C4.5 algorithm. It’s also based on the
    information gain method, but it enables the trees to be used for classification.
    This is a widely used algorithm that many users run in Weka with the open source
    Java version of C4.5, the J48 algorithm.


    There are notable improvements in C4.5 over the original ID3 algorithm. With the
    ability to work on continuous attributes, the C4.5 method will calculate a threshold
    point for the split to occur. For example, with a list of values like this:


    +   85, 80, 83, 70, 68, 65, 64, 72, 69, 75, 72, 81, 71


    C4.5 will work out a split for the attribute (a) and give a simple decision criterion
    of:


    ```

    a < 80 or a > 80

    ```


    C4.5 has the ability to work despite missing attribute values. The missing values
    are marked with a question mark (?). The gain and entropy calculations are simply
    skipped when there is no data available.


    Trees created with C4.5 are pruned after creation; the algorithm will revisit
    the nodes and decide if a node is contributing to the result in the tree. If it
    isn’t, then its replaced with a leaf node.


    # CHAID


    The CHAID (Chi-squared Automatic Interaction Detection) technique was developed
    by Gordon V. Kass in 1980. The main use of it was within marketing, but it was
    also used within medical and psychiatric research.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# MARS


    For numerical data, it might be worth investigating the MARS (multivariate adaptive
    regression splines) algorithm. You might see this as an open alternative called
    “Earth,” as MARS is trademarked by Salford Systems.


    # How Decision Trees Work


    Every tree is comprised of nodes. Each node is associated with one of the input
    variables. The edges coming from that node are the total possible values of that
    node. A leaf represents the value based on the values given from the input variable
    in the path running from the root node to the leaf. Because a picture paints a
    thousand words, see Figure 5.1 for an example.


    ![](img/3c4b0b8c972f1d075e8ebe064f0b2476_108_0.png)


    **Figure 5.1:** A decision tree


    Decision trees always start with a root node and end on a leaf. Notice that the
    trees don''t converge at any point; they split their way out as the nodes are
    processed.


    Figure 5.1 shows a decision tree that classifies a loan decision. The root node
    is “Age” and has two branches that come from it, whether the customer is younger
    or older than 55.


    The age of the client determines what happens next. If the person is younger than
    55, then the tree prompts you to find out if or she is a student. If the client
    is older than 55, then you are prompted to check his or her credit rating.


    With this type of machine learning, you are using supervised learning to deduce
    the optimal method to make a prediction; what I mean by “supervised learning”
    is that you give the classifier data with the outcomes. The real question is,
    “What’s the best node to start with the root node?” The next section examines
    how that calculation is done.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Building a Decision Tree


    Decision trees are built around the basic concept of this algorithm.


    +   - Check the model for the base cases.

    - Iterate through all the attributes (attr).

    - Get the normalized information gain from splitting on attr.

    - Let best_attr be the attribute with the highest information gain.

    - Create a decision node that splits on the best_attr attribute.

    - Work on the sublists that are obtained by splitting on best_attr and those nodes
    as child nodes.


    That’s the basic outline of what happens when you build a decision tree. Depending
    on the algorithm type, the ones previously mentioned, there might be subtle differences
    in the ways they are done.


    # Manually Walking Through an Example


    If you are interested in the basic mechanics of how the algorithm works and want
    to follow along, this section walks through the basics of calculating entropy
    and information gain. If you want to get to the hands-on part of the chapter,
    then you can skip this section.

    The method of using information gain based on pre- and post-attribute entropy
    is the key method used within the ID3 and C4.5 algorithms. As these are the commonly
    used algorithms, this section concentrates on that basic method of finding out
    how the decision tree is built.

    With machine learning-based decision trees, you can get the algorithm to do all
    the work for you. It will figure out which is the best node to use for the root
    node. This requires finding out the purity of each node. Consider Table 5.1, which
    includes only true/false values, of some user purchases through an e-commerce
    store.


    Table 5.1: Users’ Purchase History


    | HAS CREDIT ACCOUNT? | READ REVIEWS? | PREVIOUS CUSTOMER? | DID PURCHASE? |

    |---|---|---|---||

    | User A | N | Y | Y | Y |

    | User B | Y | Y | Y | Y |

    | User C | N | N | Y | N |

    | User D | Y | N | N | Y |

    | User E | Y | Y | Y | Y |'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'There are four nodes in the table:


    +   - Does the customer have an account?


    +   - Did the customer read previous product reviews?


    +   - Is the customer a returning customer?


    +   - Did the customer purchase the product?


    At the start of calculating the decision tree there is no awareness of the node
    that will give the best result. You''re looking for the node that can best predict
    the outcome. This requires some calculation. Enter entropy.


    # Calculating Entropy


    Entropy is a measure of uncertainty and is measured in bits and comes as a number
    between zero and 1 (entropy bits are not the same bits as used in computing methodology).
    Basically, you are looking for the unpredictability in a random variable.


    There are two entropy types to work out; the first is on a single attribute, and
    the second is for two attributes. With this example, I will use the Had Credit
    Account as our target attribute for our working example. By the end of the exercise,
    we will know the next node to use in the decision tree. The single attribute for
    the Has Credit Account attribute has two outcomes (Yes or No).


    | HAS CREDIT ACCOUNT |

    | Yes | No |

    | 3 | 2 |


    The entropy calculation looks as follows:


    ```

    Entropy(Has Credit Account) = Entropy (2,3)

    = Entropy (0.4,0.6)

    = -(0.4 log2 0.4) - (0.6 log2 0.6)

    = 0.97095

    ```


    When two attributes are applied, the values are mapped in the following table:


    | HAS CREDIT ACCOUNT |

    | Y | N |

    | Reads Reviews | Y | 2 | 1 | 3 |

    | N | 1 | 1 | 2 |'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Chapter 5 Working with Decision Trees 87


    With two attributes, we end up with the following entropy calculation:


    Entropy (Has Credit Account, Accounts Reviews)

    =P(Y)×E(2,1)+P(N)×E(1,1)

    =(2/5)×0.971+(1/5)×1

    =0.5884


    So, you have two gains: one before the split (Has Credit Account, which is one
    after the split (Has Credit Account/Reviews Reviews, which is 0.5884).


    You''re nearly done on this attribute. The next step is to calculate the information
    gain.


    # Information Gain


    When you know the gain before and after the split in the attribute, you can calculate
    the information gain. With the attribute to see if the customer has a credit account,
    your calculation will be the following:


    ```

    InformationGain = Gain(before the split) – Gain(after the split)

    with Reads Reviews

    =0.97095–0.5884

    =0.38255

    ```


    So, the information gain on the Has Credit Account attribute is 0.38255.


    # Rinse and Repeat


    The previous two sections covered the calculation of information gain for one
    attribute, Has Credit Account. You need to work on the other two attributes to
    find their information gain. With the values of information gain for all the attributes,
    you can now make a decision on which node to start with in the tree.


    | ATTRIBUTE | INFORMATION GAIN |

    |---|---|n| Reads Reviews | 0.38255 |

    | Did Make Purchase | 0.48672 |

    | Is Previous Customer | 0.37095 |


    Now things are becoming clearer; assuming the Has Credit Account is the root node,
    the Did Make Purchase attribute has the highest information gain and therefore,
    should be the next deciding node in the tree.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'The order of information gain determines where the node will appear in the
    decision tree model. The node with the highest gain becomes the root node. Working
    out all the gains on each attribute and their information gains will mathematically
    give you the tree.


    As the decision tree algorithm is calculated iteratively, smaller trees can be
    worked out easily. Though it''s easy to assume that with several hundreds of instances
