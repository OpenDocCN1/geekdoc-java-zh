    dealing

    with you start crafting any code. The following sections describe

    of the more common data formats.


    # Raw Text


    Basic raw text files are used in many publications. If you look at the likes of
    the

    Gutenberg Project, you will see that you can download works in a raw text file.
    The

    data is unstructured, so it rarely has a proper form with which you can work.


