    # Summary


    R is a complex piece of software, but it''s well-loved by data scientists (new
    and old ones alike), and also it become the de facto statistics software for the
    open source generation.


    There are hundreds of well-developed and documented libraries for R within the
    CRAN package library.


    Development come at a cost; it can be memory intensive for large and complex jobs.
    It doesn''t handle huge amounts of data well, but this is improved by the work
    done by Revolution Analytics and Purdue University bringing Hadoop processing
    power to the R engine.


    If you still prefer the comfort of "normal" programming language, such as Java,
    then the JRI/Java combinations; they work very well. Think about real-time analytics
    to your Java web servlets, for example—very powerful indeed.


    Regardless of whether you''re processing social media feeds, evaluating e-commerce
    shopping baskets, or reading sensor data from temperature gauges, look at R as
    an alternative for processing the data.'
