- pgno: 64
  md: '# Chapter 2 Planning for Machine Learning 39


    The Java programming language has a few APIs to choose from that will enable you
    to read and write spreadsheets. The Apache POI project and Excel API are the two
    most popular.


    # Databases


    If you''ve been brought up with web programming, you might have had some exposure
    to databases and database tables. Common ones are MySQL, Postgres, Microsoft SQL
    Server, and Oracle.


    Recently, there''s been an explosion of NoSQL (meaning Not Only SQL), such as
    MongoDB, CouchDB, Cassandra, Redis, and HBase, which all bring their flavors to
    storage. These document and key-value stores move away from the rigid table-like
    structures of traditional databases.


    In addition, there are graph databases such as Apache Giraph and Neo4j and in-memory
    systems such as Spark, memcached, and Storm. Chapter 13 is an introduction to
    Spark.


    In my opinion, all databases have their place and are worth investigating. There''s
    nothing wrong having relational, document, and graph databases running concurrently
    for the project. Each has its advantages to the project that you might not have
    considered. As all these things, there might be a learning curve that you need
    to factor into your project time.


    # Images


    The common formats previously mentioned mainly deal with text or numbers in different
    shades, but you can''t discount images. There are a number of things you can learn
    from images. Whether you''re trying to use facial recognition or emotion tracking
    or you''re trying to determine whether an image is a cat or dog (yes, it has been),
    there are several APIs that we will use.


    The most popular formats are Portable Network Graphics (PNG) and JPEG images;
    these are regularly used on the Web. If processing power is freely available,
    then TIFF or BMP are much larger files, but they contain more image information.


    Ultimately our job is to convert images to numbers so the algorithms can work
    with the vectors of number information. This will require reducing image size
    and then doing the conversion. More of these techniques are covered in Chapter
    11, "Machine Learning from Image Information."


    # Thinking About Output Data


    Now it''s time to turn your attention to the output data. This is where the holders
    have a say in how things are going to be done, because ultimately it will be those
    people who deal with the results.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Chapter 2 = Planning for Machine Learning


    The primary question about the output of machine learning data is “Who is the
    intended audience?” Depending on the answer to that question, your output will
    vary. You might need a spreadsheet for the financial folks to see the results.
    If the audience is comprised of website users, then it makes sense to put the
    data back into a database table. The machine learning results could be merged
    with other data to define more learning. It really comes down to what was defined
    in the project.


    There are a number of paid and free reporting tools available. Some are full-blown
    systems, such as Jasper Reports, BIRT, and Tableau. If you are reporting to a
    web-based audience, then the likes of D3 and Processing might be of help to you.


    # Don’t Be Afraid to Experiment


    It’s safe to say there is no “one solution fits all.” There are many components,
    formats, tools, and considerations to ponder on any project. Every machine learning
    project starts with a clean sheet and communication among all involved, from stakeholders
    all the way to visualization. Tools and scripts can be reused, but every case
    is going to be different, so things need minor adjustments as you go. Don’t be
    afraid to play around with data as you acquire it; see whether there’s anything
    you can clean from it.


    It’s also worth taking some time off data and make your own scenarios and ask
    your questions. It’s like a musician practicing an instrument; it’s worth putting
    in the hours so you are ready for the day the big gig arrives.


    The machine learning community is large, and there are plenty of blog posts, articles,
    videos, and books produced by the community. Forums allow place to store stories
    and experiences. As with most things, the more you put in, the more you will get
    out of.


    Over the years, I’ve found that people are more than willing to help contribute
    to a solution if you’re stuck on a problem. If you haven’t looked at the likes
    of http://stackoverflow.com, a collaborative question-and-answer platform for
    software developers, then have a search around. Chances are that someone will
    have encountered the problem as you.


    # Summary


    As with any project, planning is a key and essential part of machine learning
    and shouldn’t be taken lightly. This chapter covered many aspects of planning,
    including processing, storage, privacy, and data cleaning. You were also introduced
    to useful tools and commands that will help in the cleaning phases and some validation
    checks.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The planning phase is a constantly evolving process, and the more machine learning
    projects you and the team perform, the more you will learn from previous mistakes.


    The key is to start small. Take a snapshot of the data and take a random sample
    with a size of 10 percent of the total. Get the team to inspect the data. Can
    you work with it? Do you anticipate any problems with the processing of this data?


    Cleaning the data might take the most time of the project; the actual processing
    might consume only a fraction of the overall project time. If you can supply clean
    data, then your results will be refined.


    Regardless of whether you are working on a 10-person team or on your own, be aware
    of your network of contacts; some might have domain knowledge that will be useful.
    Ask lots of questions, too. You''d be surprised how many folks are willing to
    answer questions in order to see you succeed.


    The next few chapters examine some different machine learning techniques and put
    some sample code together, so you can start to apply them to your own projects.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# CHAPTER 3


    # Data Acquisition Techniques


    > "Computers aren’t the thing. They’re the thing that gets us to the thing."

    n—Joe MacMillan


    This quote comes from the television program Halt and Catch Fire; perhaps we should
    reconsider that statement for our purposes: “Data is not the thing. Data is the
    thing that gets us to the thing.” The question to ask is where is the data coming
    from and does it need cleaning or transforming?


    When it comes to machine learning and machine learning projects, you’ll spend
    a large portion of your time on getting the data into the right shape it can be
    processed. Welcome to the dark art that is extracting, transforming, and loading
    data.


    # Scraping Data


    The sad fact of reality is that data is rarely neatly packaged the way we want.
    Sure, there are exceptions like WikiData and the Facebook Graph API, and there
    are application programming interfaces (APIs) that will give you nicely prepared
    data (more on not shortly). But you must be prepared to work with the messy world
    of scraping data.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Chapter 3 Data Acquisition Techniques


    Processing scraped data requires a few steps to get it from the usual messy state’s
    in something usable.


    +   1. Figure out where the data is coming from.

    2. Figure out how you''re going to get it.

    3. Make it readable.

    4. Make sure the values are workable.

    5. Figure out where to store it.


    # Copy and Paste


    There will be a day you''ll have to extract data from a web page or a series of
    pages. Truth be, tend to be a mess, but some are better than others. A first attempt
    would be to copy and paste the data from the page and then figure a way to remove
    the HTML tags. There are, however, easier ways. Let''s look at an example.


    Suppose we have been extracting airport data. I would like to see the busiest
    airports in the United Kingdom. I found a page on Wikipedia and I''d like to get
    the data (see Figure 3.1).


