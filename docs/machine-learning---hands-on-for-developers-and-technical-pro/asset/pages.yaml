    # Determining Which Models to Use for Predictions


    We need to persist results when they are performed. I am going to use a relational
    database to save these results, and for this walk-through, I will use MySQL as
    it''s commonly used and widely installed. If you are more comfortable using another
    database, then the schemas can be easily modified.


    As you have seen, when the models perform their training, each of the algorithms
    will output the results of the training. With the decision tree and the neural
    network, model accuracy, the UUID of the model, and the training are persisted
    in a table called `training_log`.


    The linear regression is handled differently, as we are not saving a trained model
    to the filesystem, the outputs need to be persisted to the database. The slope
    and the intercept are persisted along with the UUID and training time in the `linear_model`
    table.


    When the Kafka streaming jobs are running, they will refer to the training information
    in the tables to select the best models to run.'
