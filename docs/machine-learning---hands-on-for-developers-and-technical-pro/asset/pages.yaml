    linear regression theory, let me measure you the results. If you''re plenty out
    to read, and I''ll also cover that in this book.


    Lastly, can one person be a data scientist? I think it''s more likely for a team
    of people to bring the various skills needed for machine learning into an organization.
    I talk about this more in Chapter 2.


    So, while others in the office are arguing whether to bring some PhD brains in
    a project, you can be coding up a decision tree to see whether it''s viable.


    Over the last few the job title data scientist has been joined by other titles
