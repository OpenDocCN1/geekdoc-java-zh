    normal).

    * Build the shadowMVP matrix (incorporating the B matrix, as described earlier)—the
    shaders that will need to look up pixel coordinates in the shadow texture.

    * Send the transforms to shadow uniform variables.

    * Enable buffers containing vertices, normal vectors, and texture coordinates
    (if used), as usual.

    * Call glDrawArrays().


    In addition to their rendering duties, the vertex and fragment shaders have additional
    tasks:


    +   * The vertex shader converts vertex positions from camera space to light the
    fragment shader in a vertex attribute so that they will be interpolated. This
    makes it possible to retrieve the correct values from the shadow texture.

    * The fragment shader calls the textureProj() function, which returns a 0 or 1
    indicating whether or not the pixel is in shadow (this mechanism is explained
    later). If it is in shadow, the shadow darkens the pixel by not including its
    diffuse and specular contributions.


    Shadow mapping is a common task that GLSL provides a special type of sampler variable
    called sampler2DShadow (previously mentioned) that can be attached to a shadow
    texture in the Java/JOGL application. The textureProj() function used to look
    up values from a shadow texture, and is similar to texture() that we saw previously
    in Chapter 5, except that it uses a vec3 to index the texture rather than the
    usual vec2. Since a pixel coordinate is a vec4, it is necessary to project onto
    2D texture space in order to look up the depth value in the shadow texture map.
    As we will see below, textureProj() does all of this for us.'
