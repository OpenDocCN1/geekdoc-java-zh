    +   6.3 (RESEARCH & PROJECT) Learn the basics of how to use Blender to create
    a 3D object of your own. To make full use of Blender with your OpenGL applications,
    you’ll want to learn how to use Blender’s UV-unwrapping tools to generate texture
    coordinates and an associated texture image. You can export your object as an
    OBJ file and load it using the code from Program 6.3.'
