    # 2.1.2 Vertex and Fragment Shaders


    Our first JOGL program didn''t actually draw anything—it simply filled the color
    buffer with a single color. To actually draw something, we need to include a vertex
    and fragment shader.


    You may be surprised to learn that OpenGL is capable of drawing only a few kinds
    of very simple things, such as points, lines, or triangles. These simple things
    are called primitives, and for this reason, most 3D models are made up of lots
    and lots of primitives, usually triangles.


    Primitives are made up of vertices—for example, a triangle consists of three vertices.
    The vertices come from a variety of sources—they can be read from files and then
    loaded into buffers by the Java/JOG application, or they can be hardcoded in the
    Java code or even in the GLSL code.


