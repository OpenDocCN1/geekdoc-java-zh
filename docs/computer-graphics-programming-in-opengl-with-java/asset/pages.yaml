  md: '# 168 Computer Graphics Programming in OpenGL with Java


    ![](img/f83c01d271af8dca6b2025e3474f6599_184_0.png)


    Shininess is generally modeled with a falloff function that expresses how quickly
    the specular contribution reduces to zero as the angle $\phi$ grows. We can use
    $cos(\phi)$ to model falloff, and increase or decrease the shininess by using
    powers of the cosine function, such as $cos(\phi)$, $cos^2(\phi)$, $cos^3(\phi)$,
    $cos^{10}(\phi)$, $cos^{50}(\phi)$, and so on, as illustrated in Figure 7.6.


    Note that the higher the value of the exponent, the faster the falloff, and the
    smaller the specular contribution of pixels with light reflections that are off
    your viewing angle.


    We call the exponent $n$, as used in the $cos^n(\phi)$ falloff function, the *shininess
    factor* for a specular material. Note in Figure 7.3 that shininess factors for
    each of the materials listed is specified in the rightmost column.


    We can now specify the full specular calculation:


    ```

    $I_{spec} = Light_{spec} * Material_{spec} * max(0(\hat{R} \cdot \hat{V}))$$

    ```


    Note that we use the $max()$ function in a similar manner as we did for the diffuse
    computation. In this case, we need to ensure that the specular contribution does
    not utilize negative values for $cos(\phi)$, which could produce strange artifacts
    such as "darkened" specular highlights.


    And of course as before, the actual computations involve red, green, and blue
    components.


    # 7.5 IMPLEMENTING ADS LIGHTING


    The computations described in Section 7.4 have so been mostly theoretical, as
    they have assumed we can perform them for every pixel. This is complicated by
    the fact that normal ($N$) vectors are typically available only for the vertices
    that define the models, not for each pixel. We thus need to compute normals for
    each pixel, which could be time-consuming, or find some way of estimating the
    values that we need to achieve a sufficient effect.'
