  md: 'One way to increase the number of vertices is using instancing, which we saw
    in Chapter 4. Our strategy will be to have the tessellator generate grids, and
    use instancing to repeat this many times. In the vertex shader we build a patch
    defined by four vertices, one for each corner of a tessellated grid. In a Java/JOGL
    application we change the glDrawArrays() call to glDrawArraysInstanced(). We specify
    a grid of 64 by 64 patches, each of which contains a tessellated mesh of level
    size 32. This will give us a total of 64*64*32*32, or over 4 million vertices.


    The vertex shader starts by specifying four texture coordinates (0,0), (0,1),
    (1,0), and (1,0). When using instancing, recall that the vertex shader has access
    to an integer variable gl_InstanceID, which holds a counter corresponding to the
    glDrawArrayInstanced call that is currently being processed. We use this ID to
    distribute the locations of the individual patches within the larger grid. The
    patches are positioned in rows and columns, the first patch at location (0,0),
    the next at (1,0), the next at (2,0), and so on, and the final patch in the first
    column at (63,0). The next column has patches at (0,1), (1,1), and so forth to
    (63,1). The final column has patches at (0,63), (1,63), and so on to (63,63).
    The X coordinate for a given patch is the instance ID modulo 64, and the Y coordinate
    is the instance ID divided by 64 (with integer division). The shader scales the
    coordinates back to the range (0,1).


    The control shader is unchanged, except that it passes through the vertices and
    texture coordinates.


    Next, the evaluation shader takes the incoming tessellated grid vertices (specified
    by gl_TessCoord) and moves them into the coordinate range specified by the incoming
    patch. It does the same for the texture coordinates. It also applies height mapping
    in the same way as was done in Program 12.3. The fragment shader is unchanged.


