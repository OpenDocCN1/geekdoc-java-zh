    # 3.8.2 The Orthographic Projection Matrix


    In orthographic projection, parallel lines remain parallel; that is, perspective
    isn''t employed. Instead, objects that are within the view volume are projected
    directly, without any adjustment of their sizes due to their distances from the
    camera.'
