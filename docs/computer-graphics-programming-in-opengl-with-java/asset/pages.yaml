  md: '# CHAPTER 1


    # # GETTING STARTED


    +   1.1 Languages and Libraries...............................................................................
    1

    1.2 Installation and Configuration...........................................................................
    3


    Graphics programming has a reputation of being among the most challenging computer
    science topics to learn. These days, graphics programming is shader based—that
    is, some of the program is written in a standard language such as Java or C++
    for running on the CPU, and some is written in a special-purpose shader language
    for running directly on the graphics card (GPU). Shader programming has a steep
    learning curve, so even drawing something simple requires a convoluted set of
    steps to pass graphics data down a “pipeline.” Modern graphics cards are able
    to process this data in parallel, and so the graphics programmer must understand
    the parallel architecture of the GPU, even when drawing simple shapes.


    The payoff, however, is extraordinary power. The blossoming of stunning virtual
    reality in videogames and increasingly realistic effects in Hollywood movies can
    be greatly attributed to advances in shader programming. If reading this book
    is your entry into 3D graphics, you are taking on a personal challenge that will
    reward you not only with pretty pictures, but with a level of control over your
    machine that you never imagined possible. Welcome to the exciting world of computer
    graphics!


    # ## 1.1 LANGUAGES AND LIBRARIES


    The programs in this book requires the use of the following four languages and
    libraries:


    +   * Java

    * OpenGL / GLSL

    * JOGL

    * graphicslib3D'
