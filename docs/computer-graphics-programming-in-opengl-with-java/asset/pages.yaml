  md: '# 7.2 LIGHTS


    There are many types of lights, each with different characteristics and requiring
    different steps to simulate their effects. Some types include:


    +   * Global (usually called "global ambient") because it includes only an ambient
    component)

    * Directional (or "distant")

    * Positional (or "point source")

    * Spotlight


    Global ambient light is the simplest type of light to model. Global ambient light
    has no source position —the light is equal everywhere, at every pixel on every
    scene, regardless of where the objects are. Global ambient lighting simulates
    the real-world phenomenon of light that has bounced around many times that its
    source and direction are undetermined. Global ambient light has only an ambient
    component, specified as an RGBA value; it has no diffuse or specular components.
    For example, global ambient light can be defined as follows:


    ```

    float[] globalAmbient = new float[] {0.7f, 0.7f, 0.7f, 1.0f}; // RGBA values from
    0 to 1

    ```


    Alternatively, global ambient light can be specified using the graphicslib3D AmbientLight
    class, which is available as a singleton:


    ```

    AmbientLight globalAmbient = getAmbientLight();

    globalAmbient.setRed(0.7f);

    globalAmbient.setGreen(0.7f);

    globalAmbient.setBlue(0.7f);

    globalAmbient.setAlpha(1.0f);

    ```


    Directional, or distant light also doesn''t have a source location, but it does
    have a direction. It is useful for situations where the source of the light is
    so far that the rays are effectively parallel, such as light coming from the sun.
    In many such situations we may only be interested in modeling the light, and not
    the object that produces the light. The effect of directional light on an object
    depends on the light''s angle of impact; objects are brighter on the side facing
    a directional light than a tangential or opposite side. Modeling directional light
    requires specifying its direction (as a vector), and its ambient, diffuse, and'
