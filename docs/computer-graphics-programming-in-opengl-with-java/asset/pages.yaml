    \n# SUPPLEMENTAL NOTES\n\nIn this chapter, we used Perlin noise to generate clouds,\
    \ and to simulate both wood and a marble-like stone from which we rendered a dragon\
    \ and a dolphin. People have found many other uses for Perlin noise. For example,\
