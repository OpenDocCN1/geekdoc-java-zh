  md: 'The first and third stages are programmable; the intervening second stage is
    not. In order to use tessellation, the programmer generally provides both a control
    shader and an evaluation shader.


    The tessellator (its full name is tessellation primitive generator, or TPG) is
    a hardware-supported engine that produces fixed grids of triangles. The control
    shader allows us to configure what sort of triangle mesh to build. The evaluation
    shader then lets us manipulate the grid in various ways. The manipulated triangle
    mesh is the source of vertices that proceed through the pipeline. Recall from
    Figure 2.2 that tessellation sits in the pipeline between the vertex and geometry
    shader stages.


    Let''s start with an application that simply uses the tessellator to create a
    mesh of vertices, and then displays it without any manipulation. For this, we
    will need the following modules:


    +   Java/JOGL application: Creates a camera and associated mvp matrix. The view
    (v) and projection (p) matrices orient the camera; the model (m) matrix can be
    used to modify the location and orientation of the grid.


    +   Vertex shader: Essentially does nothing in this example; the vertices will
    be generated in the tessellator.


    +   Tessellation Control Shader (TCS): Specifies the grid for the tessellator
    to build.


    +   Tessellation Evaluation Shader (TES): Applies the mvp matrix to the vertices
    in the grid.


    +   Fragment Shader: Simply outputs a fixed color for every pixel.


    We first list the application code, and then discuss its elements in detail. Even
    a simple example as this one is fairly complex, so many of the code elements will
    require explanation.'
