    These and similar sampling artifacts can be largely corrected by a technique called
    mipmapping, in which different versions of the texture image are created at various
    resolutions. The texture image used that most closely matches the resolution of
    the point being textured. Even better, colors can be averaged between the images
    closest to resolution to that region being textured. Results of applying mipmapping
    to the images in Figure 5.7 and Figure 5.8 are shown in Figure 5.9.


    Mipmapping works by a clever mechanism for storing a series of successively lower-resolution
    copies of the same image, in a texture image 1¼ larger than the original image.
    This is achieved by storing the R, G, and B components separately in three (out
    of four) quadrants of the texture image, then repeating the process in the fourth
    quadrant for the same image at 1¼ the original resolution. This subdividing repeats
    until the remaining quadrant is too small to contain any'
