  md: 'When actually texturing an object, the mipmap can be sampled in several ways.
    In OpenGL, the manner in which the mipmap is sampled can be chosen by setting
    the GL_TEXTURE_MIN_FILTER parameter to the desired minification technique, which
    is one of the following:


    +   - GL_NEAREST_MIPMAP_NEAREST chooses the mipmap with the resolution most similar
    to that of the region of pixels being textured. It then obtains the nearest texel
    to the texture coordinates.

    - GL_LINEAR_MIPMAP_NEAREST chooses the mipmap with the resolution most similar
    to that of the region of pixels being textured. It then interpolates the four
    nearest texels to the texture coordinates. This is called "linear filtering."

    - GL_NEAREST_MIPMAP_LINEAR chooses the two mipmaps with resolutions nearest to
    that of the region of pixels being textured. It then interpolates the four nearest
    texel coordinates from each mipmap, and interpolates them. This is called "bilinear
    filtering."

    - GL_LINEAR_MIPMAP_LINEAR chooses the two mipmaps with resolutions nearest to
    that of the region of pixels being textured. It then interpolates the four nearest
    texels in each mipmap, and interpolates those two results. This is called "trilinear
    filtering" and is illustrated below in Figure 5.11.


    ![](img/f83c01d271af8dca6b2025e3474f6599_134_0.png)


    **Figure 5.11**

    Trilinear filtering.'
