  md: 'One approach is called “faceted shading” or “flat shading.” Here we assume
    that every pixel in each rendered primitive (i.e., polygon or triangle) has the
    same lighting value. We need only the lighting computations for one vertex in
    each polygon in the model, and then copy those lighting values across the nearby
    rendered pixels on a per-polygon or per-triangle basis.


    Faceted shading is rarely used today, because the resulting images tend to look
    very realistic, and because modern hardware makes more accurate computations feasible.
    An example of faceted-shaded torus, in which each triangle behaves as a flat reflective
    surface, is shown in Figure 7.7.


    ![](img/f83c01d271af8dca6b2025e3474f6599_185_0.png)


    Although faceted shading can be adequate in some circumstances, usually a better
    approach is “smooth shading,” in which the lighting intensity is computed for
    each pixel. Smooth shading is feasible because the parallel processing done on
    modern graphics cards, and because of the interpolated rendering that takes place
    in the OpenGL graphics pipeline.


    We examine two popular methods for smooth shading: Gouraud shading and Phong shading.


    # 7.5.1 Gouraud Shading


    The French scientist Henri Gouraud published a smooth shading algorithm in 1971
    that has come to be known as Gouraud shading [GO71]. It is particularly well suited
    to modern graphics cards, because it takes advantage of the automatic interpolated
    rendering that is available in 3D graphics pipelines such as in OpenGL. The process
    for Gouraud shading is as follows:


    +   - Determine the color of each vertex, incorporating the lighting computations.

    - Allow those colors to be interpolated across intervening pixels the normal rasterization
    process (which will also in effect interpolate the lighting contributions).'
