- img_proc: true
  md: 'If $d$ is less than some sufficiently small tolerance, then we stop subdividing,
    and simply use the four corner control points of the sub-quadrant mesh to draw
    two triangles.


    The *tessellation stage* of the OpenGL pipeline offers an attractive approach
    for rendering Bézier surfaces based on the iterative algorithm in Figure 11.5.
    The strategy is to have the tessator generate a large grid of vertices, then use
    the blending functions to position those vertices onto the Bézier surface as specified
    by the cubic Bézier control points. We implement this in Chapter 12.


    # SUPPLEMENTAL NOTES


    This chapter focused on the mathematical fundamentals of parametric Bézier curves
    and surfaces. We have deferred presenting an implementation of any of them in
    OpenGL, as an appropriate vehicle for this is the tessellation stage, covered
    in the next chapter. We also skipped some of the derivations, such as for the
    recursive subdivision algorithm.


    In 3D graphics, there are many advantages to using Bézier curves for modeling
    objects. First, these objects can, in theory, be scaled arbitrarily and still
    retain smooth surfaces without “pixelating.” Second, many objects made of complex
    curves can be steered much more efficiently as sets of Bézier control points,
    rather than using thousands of vertices.


    Bézier curves have many real-world applications besides computer graphics and
    automobiles. They can also be found in the design of bridges, such as in the Chords
    Bridge in Jerusalem [CB16]. Similar techniques are used for building TrueType
    fonts, which as a result can be scaled to any arbitrary size, or zoomed in to
    any degree of closeness, while always retaining smooth edges.


