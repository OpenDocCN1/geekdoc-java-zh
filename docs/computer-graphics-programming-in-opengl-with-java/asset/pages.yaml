    ```

    $\begin{bmatrix} A+a & B+b & C+c & D+d \ E+e & F+f & G+g & H+h \ I+i & J+j & K+k
    & L+l \ M+m & N+n & O+o & P+p \end{bmatrix} = \begin{bmatrix} a & b & c & d \
    e & f & g & h \ i & j & k & l \ m & n & o & p \end{bmatrix}$

    ```


    In GLSL the + operator is overloaded on mat4 to support matrix addition.


    There are various multiplication operations that can be done with matrices that
    are useful in 3D graphics. Matrix multiplication in general can be either left-to-right,
    or right-to-left (note that these operations are different, follows that matrix
    multiplication is not commutative). Most of the time we will use right-to-left
    multiplication.


    **In 3D graphics, multiplying a point by a matrix** is in most cases right-to-left,
    as follows:


    ```

    $\begin{bmatrix} AX+BY & CY+D \ EX+FY & GZ+H \ IX+JY & KZ+L \ MX+NY & OZ+P \end{bmatrix}
    = \begin{bmatrix} X \ Y \ Z \ 1 \end{bmatrix}$

    ```


    Note that we represent the point (X,Y,Z) in homogeneous notation as a 1-column
    matrix.


    GLSL and graphicslib3D support multiplying a point by a matrix: Point3D.mult(Matrix3D)
    in graphicslib3D, and in GLSL with the * operator.


