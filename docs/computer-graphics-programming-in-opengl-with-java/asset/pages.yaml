  md: "# Chapter 14 · Other Techniques 329\n\nThe textured skydome is shown in Figure14.21.\
    \ Although the camera is usually placed inside the skydome, we have rendered it\
    \ with the camera outside, so that the effect on the dome itself can be seen.\
    \ The current noise map leads to “misty-looking” clouds.\n\nOur misty clouds look\
    \ nice, we would like to shape them—that is, make them more or less hazy. One\
    \ way of doing this is to modify the turbulence() function that uses an exponential,\
    \ such as a logistic function,² to make the clouds look more “distinct.” The modified\
    \ turbulence() function is shown in Program 14.7, along with an associated logistic()\
    \ function. The Program 14.7 also incorporates the smooth(), fillDataArray(),\
    \ and generateNoise() functions described earlier.\n\n![](img/f83c01d271af8dca6b2025e3474f6599_345_0.png)\n\
    \n# Program 14.7 Cloud Texture Generation\n\n```\nprivate double turbulence(double\
    \ x, double y, double z, double size)\n  double value = 0.0, initialSize = size,\
    \ cloud_quant;\n  while(size >= 0.9)\n    value = value + smoothNoise(x/size,\
    \ y/size, z/size) * size;\n    size = size / 2.0;\n\n  cloud_quant = 110.0; //\
    \ tunable quantity of clouds\n  value = value/initialSize;\n  value = 256.0 *\
    \ logistic(value * 128.0 - cloud_quant);\n  return value;\n\nprivate double logistic(double\
    \ x)\n  double k = 0.2; // tunable haziness of clouds, produces more or less distinct\
    \ cloud clouds\n  return (1.0 / (1.0+Math.pow(2.718, -k)));\n```\n\n> ² A “logistic”\
    \ (or “sigmoid”) function has an S-shaped curve with asymptotes on both ends.\
    \ Common examples are hyperbolic tangent and f(x) = 1/(1+e⁻ˣ). They are also called\
    \ “squashing” functions."
