  md: 'If a model has texture coordinates, but not normal vectors, the format be as
    follows:


    ```

    f 2/7 5/8 3/9

    ```


    And, if the model has normals but not texture coordinates, the format would be:


    ```

    f 2//3 5//3 3//3

    ```


    It is not unusual for a model to have tens of thousands of vertices. There are
    hundreds of such models for download on the Internet for nearly conceivable application,
    including models of animals, buildings, cars, planes, mythical creatures, people,
    and so on.


    Programs of varying sophistication that import an OBJ model available on the Internet.
    Alternatively, it is relatively easy to write a simple OBJ loader function that
    can handle the basic tags we have seen (v, vt, vn, and f). Program 6.3 shows one
    loader, albeit a very limited one. It incorporates a class to hold an arbitrary
    imported model, which in turn calls the importer.


    Before we describe the code in our OBJ importer, we must warn the reader of its
    limitations:


    +   - It only supports models that include all three attribute fields. That is,
    vertex positions, texture coordinates, and normals must be present and in the
    form: f #/### #/### ###/


    +   - The material is ignored—texturing must be done using the methods in Chapter
    5.


    +   - Only OBJ models comprised of a single triangle mesh are supported (the OBJ
    format supports composite models, but our simpler importer does not).


    +   - It assumes that elements on each line are separated by exactly one space.


    If you have an OBJ model that doesn''t satisfy all of the above criteria, and
    you wish to import it the simple loader in Program 6.3, it may be feasible to
    do so. It is often possible to load a model into Blender, and then export it to
    another OBJ file that accommodates the loader''s limitations. For instance, if
    the model doesn''t include normal vectors, it is possible to have Blender produce
    normal vectors while it exports the revised OBJ file.'
