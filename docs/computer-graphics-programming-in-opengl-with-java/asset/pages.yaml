    however, its direction is not specified, and it is different for each vertex in
    our scene. Positional lights may also incorporate *attenuation factors*, in order
    to model how their intensity diminishes with distance. With the other types of
    lights we have ambient, diffuse, and specular properties specified as RGB values.
    A red positional light at location (5, 2, -3) could be example specified thusly:


    ```

    float[] posLightAmbient = new float[] { 1.0f, 0.0f, 0.0f, 1.0f};

