  md: '# Chapter 7 · Lighting 183


    combining colors retrieved by sampling a texture, and colors produced from a lighting
    model.


    The manner in which we combine lighting and textures depends on the nature of
    the object and the purpose of its texture. There are several scenarios, a few
    of which include:


    +   - The texture image very closely reflects the actual appearance of the object''s
    surface.

    - The object has both a material and a texture.

    - The texture contains shadow or reflection information (covered in Chapters 8
    and 10).

    - There are multiple lights, and/or multiple textures involved.


    Let''s consider the first case, where we have a simple textured object and we
    wish to add lighting to it. One simple way of accomplishing this in the fragment
    shader is to remove the material specification entirely, and to use the texel
    returned from the texture sampler in place of the material ADS values. The following
    is one strategy (expressed in pseudocode):


    ```

    fragColor = textureColor * (ambientLight + diffuseLight) + specularLight

    ```


    Here the texture color contributes to the ambient and diffuse computation, while
    the specular color is defined entirely by the light. It is common to set the specular
    contribution solely based on the light color, especially for metallic or "shiny"
    surfaces. However, some shiny surfaces, as such cloth or unvarnished wood and
    even a few materials have specular highlights that include the color of the object
    surface. In those cases, a suitable slightly modified strategy would be:


    ```

    fragColor = textureColor * (ambientLight + diffuseLight) + specularLight

    ```


    There are also cases in which an object has an ADS material that is supplemented
    by a texture image, such as an object made of silver that has a texture that adds
    some tarnish to the surface. In those situations, the standard ADS model with
    both light and material, as described in previous sections, can be combined with
    the texture color using a weighted sum. For example:


    ```

    textureColor = texture(sampler, texCoord)

    lightColor = (ambLight * ambMaterial) + (diffLight * diffMaterial) + specLight

    fragColor = 0.5 * textureColor + 0.5 * lightColor

    ```'
