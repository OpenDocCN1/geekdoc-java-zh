    # 3.7 EYE SPACE AND THE SYNTHETIC CAMERA


    So far, the transform matrices we have seen all operate in 3D space. Ultimately,
    however, we will want to display our 3D space—or a portion of it—on a 2D monitor.
    In order to do this, we need to decide on a vantage point. Just as we see the
    real world through our eyes from a particular point, in a particular direction,
    so too we must establish a position and orientation as the window into our virtual
    world. This vantage point is called "view" or "eye" space, or the "synthetic camera."


    ![](img/f83c01d271af8dca6b2025e3474f6599_65_0.png)


    Figure 3.10nPositioning a camera in the 3D world.


    As shown in Figure 3.10 and Figure 3.12, viewing involves: (a) placing the camera
    at some world location; (b) orienting the camera, which usually requires maintaining
    its own set of orthogonal axes U / V / N; (c) defining a *view volume*; and (d)
    projecting objects within the volume onto a *projection plane*.


    OpenGL includes a camera that is permanently fixed at the origin (0,0,0), and
    faces down the negative Z-axis, as shown in Figure 3.11.


    ![](img/f83c01d271af8dca6b2025e3474f6599_65_1.png)


    Figure 3.11

    OpenGL fixed camera.'
