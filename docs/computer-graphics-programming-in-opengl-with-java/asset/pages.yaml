    # 8.4 SHADOW MAPPING


    The most practical and popular methods for casting shadows is called shadow mapping.
    Although it is not always accurate as shadow volumes (and is often accompanied
    by pesky artifacts, shadow mapping is easier to implement, and can be used in
    a wide variety of situations, and enjoys powerful hardware support.


    We would be remiss if we failed to clarify our use of the word “easier” in the
    previous paragraph. Although shadow mapping is simpler than shadow volumes (both
    conceptually and in practice), it is by no means “easy!” Students often find shadow
    mapping among the most difficult techniques to implement in a 3D graphics course.
    Shader programs are by nature difficult to debug, and shadow mapping requires
    the perfect coordination of several components and shader modules. Be advised
    that successful implementation of shadow mapping will be greatly facilitated by
    liberal use of the debugging tools described in Section 2.2.


    Shadow mapping is based on a very simple and clever idea: namely, anything that
    cannot be seen by the light is shadow. That is, if object #1 blocks the light
    from reaching object #2, it is the same as the light not being able to “see” object
    #2.


    The reason this is possible is that we already have a method for determining something
    can be seen—“the hidden surface removal algorithm (HSR) using the Z-buffer, as
    described in Section 2.1.7. So, a strategy for finding shadows is to temporarily
    move the camera to the location of the light, apply the Z-buffer HSR algorithm,
    and then use the resulting depth information to find shadows.


    Rendering a scene requires two passes: to render the scene from the point of view
    of the light (but not actually drawing to it), and a second pass to render it
    from the point of view of the camera. The purpose of pass one is to generate a
    Z-buffer from the light’s point of view. After completing pass one, we need to
    retain the Z-buffer and use it to help us generate shadows in pass two. Pass two
