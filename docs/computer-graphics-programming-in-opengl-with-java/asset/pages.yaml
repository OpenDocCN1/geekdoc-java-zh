  md: "# Program 10.2 Normal Mapping Fragment Shader\n\n```\n#version 430\nin vec3\
    \ varyingLightDir;\nin vec3 varyingVertPos;\nin vec3 varyingNormal;\nin vec3 varyingTangent;\n\
    in vec3 originalVertex;\nin vec2 tc;\nout vec4 fragColor;\n\nlayout(binding=0)\
    \ uniform sampler2D normMap;\n// remaining uniforms as before\n// remaining uniforms\
    \ as before\n```\n\n```\nvec3 calcNewNormal() {\n    vec3 normal = normalize(varyingNormal);\n\
    \    vec3 tangent = normalize(varyingTangent);\n    tangent = normalize(tangent\
    \ - dot(tangent, normal) * normal); // tangent is perpendicular to normal\n  \
    \  vec3 bitangent = cross(tangent, normal);\n    mat3 tbn = mat3(tangent, bitangent,\
    \ normal); // TBN matrix to convert to camera space\n    vec3 retrievedNormal\
    \ = texture(normMap,tc).xyz;\n    retrievedNormal = retrievedNormal * 2.0 - 1.0;\
    \ // convert from RGB space\n    vec3 newNormal = retrievedNormal;\n    newNormal\
    \ = normalize(newNormal);\n    return newNormal;\n}\n```\n\n```\nvoid main() {\n\
    \    // normalize the light, normal, and view vectors:\n    vec3 L = normalize(varyingLightDir);\n\
    \    vec3 V = normalize(varyingVertPos);\n    vec3 N = calcNewNormal();\n\n  \
    \  // get the angle between the light and surface normal:\n    float cosTheta\
    \ = dot(L,N);\n\n    // compute half vector for Blinn optimization:\n    vec3\
    \ H = varyingHalfVector;\n\n    // angle between the view vector and reflected\
    \ light:\n    float cosPhi = dot(H,N);\n\n    // compute ADS contributions (per\
    \ pixel):\n    fragColor = globalAmbient * material.ambient\n    + light.ambient\
    \ * material.ambient;\n    + light.diffuse * material.diffuse * max(cosTheta,0.0)\n\
    \    + light.specular * material.specular * pow(cosPhi,material.shininess);\n\
    }\n```"
