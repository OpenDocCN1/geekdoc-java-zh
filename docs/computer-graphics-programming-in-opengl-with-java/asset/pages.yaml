  md: "curves to surfaces requires extending our system of parametric equations from\
    \ one parameter to parameters. For Bézier curves, we called that parameter $t$.\
    \ For Bézier surfaces, we will refer to the parameters as $u$ and $\nu$. Whereas\
    \ our curves were comprised of points $P(t)$, our surfaces will be comprised of\
    \ points $P(u,v)$, as shown in Figure 11.8.\n\nFor quadratic Bézier surfaces,\
    \ there are three control points on each axis $u$ and $v$, for a total of nine\
    \ control points. Figure 11.9 shows an example of nine control points (typically\
    \ called a control point \"mesh\") in blue, and the associated corresponding surface\
    \ (red).\n\nThe nine control points in the mesh are labeled $P_{ij}$ where $i$\
    \ and $j$ represent the indices in the $u$ and $v$ directions respectively. Each\
    \ set of three adjacent control points, such as $P_{00}, P_{01}, P_{02}$, defines\
    \ a Bézier curve. Points $P(u,v)$ on the surface are then defined as a sum of\
    \ two blending functions, one in the $u$ direction and one in the $v$ direction.\
    \ The form of the two blending functions for building Bézier surfaces then follows\
    \ from the methodology previously for Bézier curves:\n\n![](img/f83c01d271af8dca6b2025e3474f6599_271_0.png)\n\
    \n**Figure 11.8**\nParametric surface.\n\n![](img/f83c01d271af8dca6b2025e3474f6599_271_1.png)\n\
    \n**Figure 11.9**\nQuadratic Bézier mesh and corresponding surface.\n\n```\n$B_0(u)\
    \ = (1-u)^2$\n$B_1(u) = -2u^2 + 2u$\n$B_2(u) = u^2$\n$B_0(\nu) = (1-\nu)^2$\n\
    $B_1(\nu) = -2\nu^2 + 2\nu$\n$B_2(\nu) = \nu^2$\n```"
  merge: -1
