    frame, so that hidden surface removal occurs properly (not clearing the depth
    buffer can sometimes result in ever being removed, resulting in a completely black
    screen). By default, depth values in OpenGL range from 0.0 to 1.0. Clearing the
    depth buffer is done by calling glClear(GL_DEPTH_BUFFER_BIT), which fills the
    depth buffer with the default value (usually 1.0).


    Next, display() enables the shaders by calling glUseProgram(), which installs
    the GLSL code on the GPU. Recall that this doesn''t run the program, but it allows
    JOGL to determine the shader''s vertex attribute and uniform locations. The display()
    function builds the vertex and model matrices, concatenates them into a single
    MV matrix, which gets the uniform variable locations, and assigns the perspective
    and MV matrices to the corresponding uniforms.


    Next, display() enables the buffer containing the cube vertices, and attaches
    it to 0th vertex attribute prepare for sending the vertices to the shader.


    The last thing display() does is draw the model by calling glDrawArrays(), specifying
    the model is composed of triangles and has 36 vertices. The call to glDrawArrays()
    is typically preceded by additional commands that adjust rendering settings for
    the model. In this example, there are two commands, both of which are related
    to depth testing. Recall from Chapter 2 depth testing is used by OpenGL to perform
    hidden surface removal. Here, we enable depth testing, and specify the particular
    depth test we wish OpenGL to use. The settings shown here correspond to the description
    in Chapter 2; later in the book we will see others for these commands.


    Finally, consider the shaders. First, note that both include the same block of
    uniform variable declarations. Although this is not always required, it is often
    a good practice to include the same block of uniform variable declarations in
    all of the shaders within a particular rendering program.


