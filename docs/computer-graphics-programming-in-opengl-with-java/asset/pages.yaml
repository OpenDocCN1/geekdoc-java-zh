  md: '# Preface


    This book is designed primarily as a textbook for a typical computer science undergraduate
    course in OpenGL 3D graphics programming. However, we have also wanted to create
    a text that could be used to teach oneself, without an accompanying course. With
    both of those aims in mind, we have tried to explain things as clearly and as
    simply as we can. Every programming example is stripped-down and simplified as
    much as possible, but still complete that the reader may run them all as presented.


    One of the things that we hope is unique about this book is that we have strived
    to make it accessible to a beginner—that is, someone new to 3D graphics programming.
    While there is by no lack of information available on the topic—quite the contrary—many
    students are initially overwhelmed. This text is our attempt to write the book
    we wish we had when we were starting out, with step-by-step explanations of the
    basics, progressing in an organized manner through advanced topics. We considered
    the book "shader programming made easy"; however, we don''t think that there is
    really any way of making shader programming "easy." we hope that we have come.


    Another thing that makes this book unique is that it teaches OpenGL programming
    in Java, using JOGL—a Java “wrapper” for OpenGL’s native C calls [JO16]. There
    are several advantages to learning graphics programming in Java rather than in
    C:


    +   * It is more convenient for students at schools that conduct most of their
    curriculum in Java.

    * Java’s I/O, window, and event handling are arguably cleaner than in C.

    * Java’s excellent support for object-oriented design patterns can foster good
    design.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'It is worth mentioning that there exist other Java bindings for OpenGL. One
    that is becoming increasingly popular is Lightweight Java Game Library, or LWJGL
    [LW16]. Like JOGL, LWJGL also offers bindings for OpenAL and OpenCL. This textbook
    focuses only on JOGL.


    Another point of clarification is that there exist different versions of OpenGL
    (briefly discussed later) and different variants of OpenGL. For example, in addition
    to “standard OpenGL” (sometimes called “desktop OpenGL”), exists a variant called
    “OpenGL ES” which is tailored for development of embedded systems (the “ES”).
    “Embedded systems” devices such as mobile phones, game consoles, automobiles,
    and industrial control systems. OpenGL ES is mostly a subset of OpenGL, eliminating
    a large number of operations that are typically not needed for embedded systems.
    OpenGL ES also adds additional functionality, typically application-specific operations
    for particular targets. The JOGL suite of Java bindings includes interfaces for
    different versions of OpenGL ES, although we do not use them in this book.


    Another variant of OpenGL is called “WebGL.” Based on OpenGL ES, WebGL is designed
    to support the use of OpenGL in web browsers. WebGL allows an application to use
    JavaScript to invoke ES operations, which makes it easy to embed OpenGL graphics
    into standard HTML (web) documents. Most modern web browsers support WebGL, including
    Apple Safari, Google Chrome, Microsoft Internet Explorer, Firefox, and Opera.
    Since web programming is outside the scope of this book, we will not cover any
    WebGL specifics. Note however that because WebGL is based on OpenGL ES, which
    is based on standard OpenGL, of what is covered in this book can be transferred
    to learning about OpenGL variants.


    The very topic of 3D graphics lends itself to impressive, even beautiful images.
    Indeed, many popular textbooks on the topic are filled with breathtaking scenes,
    and it is enticing to learn through their galleries. While we acknowledge the
    motivational utility of such examples, our aim is to teach, not present. The images
    in this book are outputs of the example programs, and since this is an introductory
    text, the resulting scenes are unlikely to impress an expert. However, the techniques
    presented constitute the foundational elements for producing today’s 3D graphics.


    We have also tried to create an OpenGL or JOGL “reference.” Our coverage of OpenGL
    and JOGL represents only a tiny fraction of their capabilities. Rather, our aim
    is to


    ¹ JavaScript is a scripting language that can be used to embed code in webpages.
    It has strong similarities to Java, but also many important differences.'
