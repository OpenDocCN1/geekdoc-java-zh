    left, because ridge shadows are cast to the right (most clearly evident in the
    crater at the bottom center). If we were to add lighting to this scene with Phong
    shading, and then animate the scene by moving the moon, the camera, or the light,
    those shadows will not change as we would expect them to.


    Furthermore, as the light source moves (or the camera moves), we would expect
    many specular highlights to appear on the ridges. A plain textured sphere as at
    the left of Figure 10.6 would produce only one specular highlight, corresponding
    to what would appear on a smooth sphere, which would look very unrealistic. Incorporation
    of the normal map can improve the realism of lighting on objects like this considerably.


