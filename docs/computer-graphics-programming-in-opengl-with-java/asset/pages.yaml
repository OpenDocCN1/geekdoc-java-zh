  md: "Since the tessellated grid for a patch will eventually be placed within the\
    \ square defined by the four control points entering the control shader, we can\
    \ use the locations of the control points relative to the camera to determine\
    \ how many vertices should be generated for the patch. The steps are as follows:\n\
    \n+   Calculate the screen locations of the four control points by applying the\
    \ MVP matrix to them.\n\n+   Calculate the lengths of the sides of the square\
    \ (i.e., the width and height) defined by the control points (in screen space).\
    \ Note that even the four control points form a square, these side lengths can\
    \ differ because the perspective matrix has been applied.\n\n+   Scale the lengths'\
    \ values by a tunable constant, depending on the precision needed for the tessellation\
    \ levels (based on the amount of detail in the height map).\n\n+   Add 1 to the\
    \ scaled length values, to avoid the possibility of specifying a tessellation\
    \ level of 0 (which would result in no vertices being generated).\n\n+   Set the\
    \ tessellation levels to the corresponding calculated width and height values.\n\
    \nRecall in our instance example we are not creating just one grid, but 64*64\
    \ of them. So the five steps listed above are performed for each patch. The level\
    \ of detail from patch to patch.\n\nAll of the changes are in the control shader\
    \ and are shown in Program 12.5, with the generated output following in Figure\
    \ 12.10. Note that the variable gl_InvocationID refers to which vertex in the\
    \ patch is being processed (which patch is being processed). Thus, the LOD computation\
    \ which tells the tessellator how many vertices to generate occurs during the\
    \ processing of the 0th vertex in each patch.\n\n# Program 12.5 Tessellation Level\
