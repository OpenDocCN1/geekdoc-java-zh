  md: '# Chapter 2 JOGL and the OpenGL Graphics Pipeline


    # 2.2 DETECTING OPENGL AND GLSL ERRORS


    The workflow for compiling and running GLSL code differs from standard coding,
    in that GLSL compilation happens at Java runtime. Another complication is that
    GLSL code does not run on the CPU (it runs on the GPU), so the operating system
    never catches OpenGL runtime errors. This makes debugging difficult, because it
    is often hard to detect if a shader failed, and why.


    Program 2.3 (which follows) presents some modules for catching and displaying
    GLSL errors. They use the error string catch tool gluErrorString() from the "GLU"
    library [GL16], as well as OpenGL functions glShaderiv() and glGetProgram(), which
    are used to provide information about compiled GLSL shaders and programs. accompanying
    them is the createShaderProgram() function (on the right) from the previous Program
    2.2, but with the error-detecting calls added. These error-detecting modules are
    also available in graphicslib3D.


    Program 2.3 contains the following three utilities:


    +   - checkOpenGLE checks the OpenGL error flag for the occurrence of an OpenGL
    error

    - printShaderLog displays the contents of OpenGL''s log when GLSL compilation
    failed

    - printProgramLog displays the contents of OpenGL''s log when GLSL linked failed


    The first, checkOpenGLE(), is useful for both GLSL compilation errors and OpenGL
    runtime errors, so it is highly recommended to use it throughout a Java/JOGL application
    during development. For example, in the prior example (Program 2.2), the calls
    to glCompileShader() and glLinkProgram() could easily be augmented with the code
    shown in Program 2.3 to ensure that any typos or other errors would be caught
    and their cause reported. Calls to checkOpenGLE() could be added after runtime
    OpenGL calls, such as immediately after the call glDrawArrays().


    Another reason that it is important to use these tools is that a GLSL error does
    not cause the JOGL program to stop. Unless the programmer takes steps to catch
    errors at the point that they happen, debugging will be very difficult.'
