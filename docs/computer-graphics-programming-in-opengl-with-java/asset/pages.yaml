    Computer graphics makes heavy use of mathematics, particularly matrices and matrix
    algebra. Although we tend to consider 3D graphics programming to be among the
    most contemporary technical fields (and in many respects it), many of the techniques
    that are actually used back hundreds of years. Some of them were first understood
    and codified by the great philosophers of the Renaissance era.


    Virtually every facet of 3D graphics, every effect—movement, scale, perspective,
    texturing, lighting, shadows, and so on—all will be accomplished largely mathematically.
    Therefore this chapter lays the groundwork upon which every subsequent chapter
    relies.


    It is assumed the reader has a basic knowledge of matrix operations; a full coverage
    of basic matrix algebra is beyond the scope of this text. Therefore, if at any
    point a particular matrix operation is unfamiliar, it may be necessary to do some
    supplementary background reading to ensure full understanding before proceeding.'
