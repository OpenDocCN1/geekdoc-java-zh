  md: '# Chapter 5 · Texture Mapping


    There is an alternative mechanism for configuring and managing textures and samplers.
    Version 3.3 of OpenGL introduced sampler objects (sometimes sampler states)—not
    to be confused with sampler variables that can be used to hold a set of texture
    settings independent of the actual texture object. Sam objects are attached to
    texture units and allow for conveniently and efficiently changing texture settings.
    The examples shown in this textbook are sufficiently simple that we decided to
    omit coverage of sampler objects. For interested readers, sampler objects are
    easy to learn how to use, and there are many excellent online tutorials (such
    as [GE11]).


    The OpenGL Texture class makes a number of OpenGL texture-related functions available
    directly, without extracting the actual OpenGL texture object as we did in this
    chapter. For example, there are bind() and setTexture() functions that invoke
    the OpenGL functions glBindTexture() and glBindTexture(). We will explore more
    of the functionality in the JOGL texture classes later in the book when we study
    cube maps and 3D textures. An excellent source of information on the JOGL Texture,
    TextureIO, and TextureData classes are their ex-ensive Javadoc.


    # Exercises


