    # 6.2 OPENGL INDEXING – BUILDING A TORUS


    # 6.2.1 The Torus


    Algorithms for producing a torus can be found on various websites. Paul Baker
    gives a step-by-step description for defining a circular slice, and then the slice
    around a circle to form a donut [PP07]. Figure 6.11 shows two views; from the
    side, and from above.


    The way that torus vertex positions are generated is rather different from what
    was done to build the sphere. For the torus, the algorithm puts a vertex to the
    right of, and then rotates that vertex in a circle in the XY plane using a rotation
    around the Z axis to form a “ring.” Texture coordinates and normal vectors are
    computed for each of these vertices as they are built. An additional'
