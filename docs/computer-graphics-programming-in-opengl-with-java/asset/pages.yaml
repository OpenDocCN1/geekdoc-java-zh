  md: "# Chapter 7 Lighting 161\n\nlinear, and quadratic attenuation factors, as well\
    \ as accessors for its ambient, diffuse, and specular fields. Instantiating a\
    \ red light position at (5, 2, -3), along with modest attenuation factors, in\
    \ graphicslib3D can therefore be done thusly (the attenuation factors are described\
    \ below the code):\n\n```\nPositionalLight pl1 = new PositionalLight();\nPoint3D\
    \ position = new Point3D(5, 2, -3);\nfloat [] amb = new float[] {1.0f, 0.0f, 0.0f,\
    \ 1.0f};\nfloat [] diff = new float[] {1.0f, 0.0f, 0.0f, 1.0f};\nfloat [] spec\
    \ = new float[] {1.0f, 0.0f, 0.0f, 1.0f};\npl1.setAmbient(amb);\npl1.setDiffuse(diff);\n\
    pl1.setSpecular(spec);\npl1.setPosition(plocation);\npl1.setConstantAtt(1.0f);\n\
    pl1.setLinearAtt(0.1f);\npl1.setQuadraticAtt(0.1f);\n```\n\nAttenuation factors\
    \ can be modeled in various of ways. As shown above, we provide tunable non-negative\
    \ parameters for *constant, linear, and quadratic* attenuation ($k_c, k_l$, and\
    \ $k_q$ respectively). These parameters are then combined, taking into account\
    \ the distance ($d$) from the light source:\n\n$attenuationFactor = \\frac{1}{k_c\
    \ + k_l d + k_q d^2}$\n\nMultiplying this factor by the light intensity causes\
    \ the intensity to be decreased as the distance is to the light source. Note that\
    \ $k$ should always be greater than equal to 1, so that the attenuation factor\
    \ will always be in the range (0...1) and approach 0 as the distance $d$ increases.\n\
    \n**Spotlights** have both a position and a direction. The effect of the \"cone\"\
    \ is simulated by specifying a *cutoff angle* $\theta$ between 0° and 90° indicating\
    \ the width of the light beam, and a *falloff exponent* to model the variation\
    \ of intensity across the angle of the beam. As shown in Figure 7.2, we determine\
    \ the angle $\theta$ between the spotlight's direction and a vector from the spotlight\
    \ to the pixel. We then compute an *intensity factor* by multiplying the cosine\
    \ of $\\phi$ to the falloff exponent when $\\phi$ is less than $\theta$ (when\
