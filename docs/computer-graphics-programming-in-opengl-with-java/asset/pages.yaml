  md: 'The options that indicate a “blendColor” (GL_CONSTANT_COLOR, etc.) require
    an additional call to glBlendColor() to specify a constant color that will be
    used to compute the blend function result. There are a few additional blend functions
    that aren’t listed above, not described.


    The possible options for the glBlendEquation() (i.e., mode) are:


    | GL_FUNC_ADD | result = source_RGBA + destination_RGBA |

    | GL_FUNC_SUBTRACT | result = source_RGBA - destination_RGBA |

    | GL_FUNC_REVERSE_SUBTRACT | result = destination_RGBA - source_RGBA |

    | GL_MIN | result = min(source_RGBA, destination_RGBA) |

    | GL_MAX | result = max(source_RGBA, destination_RGBA) |


    The glBlendFunc() defaults to GL_ONE (1.0) for srcFactor, and GL_ZERO (0.0) for
    destFactor. The default for glBlendEquation() is GL_FUNC_ADD. Thus, by default,
    the source pixel is untouched (multiplied by one), the destination pixel is scaled
    to zero, and the two are added—meaning the source pixel becomes the frame buffer.


    There are also the commands glEnable(GL_BLEND) and glDisable(GL_BLEND), which
    can be used to tell OpenGL to apply the specified blending, or to ignore it.


    We won’t illustrate the effects of all of the options here, but will walk through
    some illustrative examples.


    Suppose we specify the following settings in the Java/JGL application:


    +   - glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA)

    - glBlendEquation(GL_FUNC_ADD)


    Composing proceed as follows:


    +   1. The source pixel is scaled by its alpha value.

    2. The destination pixel is scaled by 1-srcAlpha (the source transparency).

    3. The pixel values are added together.


    For example, if the source pixel is red, with 75% opacity: [1, 0, 0, 0.75], and
    the destination pixel contains completely opaque green: [0, 1, 0, 1], then the
    result placed in the frame buffer would be:'
