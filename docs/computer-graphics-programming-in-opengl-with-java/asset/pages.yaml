    is in motion (we cannot illustrate that here).


    Gouraud shading is susceptible to other artifacts. If the specular highlight is
    entirely contained within one of the model''s triangles—that is, if it doesn''t
    contain least one of the model vertices—then it may disappear. The specular component
    is calculated per vertex, so if a model vertex with a specular contribution does
    not exist, none of the rasterized pixels will include specular light.


    # 7.5.2 Phong Shading


    Bui Tuan Phong developed a smooth shading algorithm while a graduate student at
    the University of Utah, and described it in his 1973 dissertation [PH73]. The
    structure of the algorithm is similar to the algorithm for Gouraud shading, except
    that the lighting computations are done per-pixel rather than per-vertex. Since
    the lighting computations require a normal N and a light vector L, which are only
    available in the model on a per-vertex basis, Phong shading is often implemented
    using a clever “trick,” where N and L are computed in the vertex shader and interpolated
    during rasterization. Figure 7.10 outlines the strategy:


    | JOGL (Java) code | Vertex shader | Fragment shader |

    | --- | --- | --- |

    | (same as for Gouraud shading) | 1. compute: vectors N,L,V | 1. incoming interpolated:
    N, L, V |

    | | 2. output attributes: N, L, V, gl_position | 2. compute: R, θ, φ |

    | | | 3. compute ADS contributions |

    | | | 4. output color |


    Figure 7.10

    Implementing Phong shading.'
