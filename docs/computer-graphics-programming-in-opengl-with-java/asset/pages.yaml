  md: '# SUPPLEMENTAL NOTES


    In this chapter we have seen examples of applying matrix transformations to points.
    Later, we will also want to apply these same transforms to vectors. In order to
    accomplish a transform on a vector V equivalent to applying some matrix M to a
    point, it is necessary in the general case to compute the inverse transpose of
    M, denoted (M⁻¹), and multiply V by that matrix. In some cases, M=(Mᵀ), and in
    those cases it is possible to simply use M. For example, the basic rotation matrices
    we have seen in this chapter are equal to their own inverse transpose, and can
    be applied directly to vectors as well as points. Thus, the examples in this book
    sometimes use (M⁻¹) when applying a transform to a vector, and sometimes use M.


    One of the things we''ve discussed in this chapter is techniques for moving the
    camera smoothly through space. This is very useful, especially for games and CGI
    movies, also for visualization, virtual reality, and for 3D modeling.


    We didn''t include complete derivations for all of the matrix transforms that
    were presented (they can be found in other sources, such as [FV95]). We strove
    instead for a concise summary of the point, vector, and matrix operations necessary
    for basic 3D graphics programming. As this book proceeds, we will encounter many
    practical uses for the methods presented.


