  md: '# 14.2 COMPOSITING / BLENDING / TRANSPARENCY


    We have already seen a few examples of blending—in the supplementary notes for
    Chapter 7, and just above our implementation of fog. However, we haven''t yet
    seen how to utilize the blending (or compositing) capabilities that follow after
    the fragment shader, during pixel operations (recall the pipeline sequence shown
    in Figure 2.2). It is there that transparency is handled, which we look at now.


    Throughout this book we have made frequent use of the vec4 data type, to represent
    3D points and vectors in a homogenous coordinate system. You may have noticed
    that we also use a vec4 to store color information, where the first three values
    consist of red, green, and blue, and the fourth element is—what?


    The fourth element in a color is called the alpha channel, which specifies the
    opacity of the color. Opacity is a measure of how non-transparent the pixel color
    is. An alpha value of 0 means “no opacity.” or completely transparent. An alpha
    value of 1 means “fully opaque,” not at all transparent. In a sense, the “transparency”
    of a color is 1-α, where α is the value of the alpha channel.


    Recall from Chapter 2 that pixel operations utilize the Z-buffer, which achieves
    hidden surface removal by replacing an existing pixel color when another object''s
    location is found to be close. We actually have more control over this process—we
    may choose to blend the two pixels.


    When a pixel is being rendered, it is called the “source” pixel. The pixel-ready
    in the frame buffer (presumably rendered from the previous object) is called the
    “destination” pixel. OpenGL provides many options for deciding which of the two,
    or what sort of combination of them, ultimately placed in the frame buffer. Note
    that the pixel operations step is not a programmable stage—so the OpenGL tools
    for configuring the desired compositing are found in the Java/JGL application,
    rather than in a shader.


    ![](img/f83c01d271af8dca6b2025e3474f6599_318_0.png)


    The two OpenGL functions for controlling'
  merge: -1
  pgno: 318
