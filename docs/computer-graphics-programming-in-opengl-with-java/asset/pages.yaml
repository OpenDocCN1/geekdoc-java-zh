  md: 'smaller, simple models. For example, a model of a “robot” could be created
    by separately drawing the head, body, legs, and arms, where each of those is a
    separate-rate model. An object built in this manner is often called a hierarchical
    model. The tricky part of building hierarchical models is keeping track of all
    the model-view matrices, and making sure they stay perfectly coordinated—otherwise
    the robot might fly apart into pieces!


    Hierarchical models are useful not only for building complex objects—they can
    also be used to generate complex scenes. For example, consider how our Earth revolves
    around the sun, and in turn how the moon revolves around the Earth. Computing
    the moon''s actual path through space could be complex. However, if we can combine
    the transforms representing the two simple circular paths—the moon’s path around
    the Earth and the Earth’s path around the sun—we avoid having to explicitly compute
    the moon trajectory.


    ![](img/f83c01d271af8dca6b2025e3474f6599_104_0.png)


    **Figure 4.11**nAnimated planetary system (sun and earth textures from [HT16],
    moon texture from [NA16]).


    It turns out that we can do this fairly easily with a matrix stack. A matrix stack
    is, as its name implies, a stack of transformation matrices. As we will see, matrix
    stacks make it easy to create and manage complex hierarchical objects and scenes,
    where transforms can be built upon (and removed from) others transforms.


    OpenGL has a built-in matrix stack, but as part of the older fixed-function (non-programmable)
    pipeline it has long been deprecated. Was nicely devised and convenient to use,
    so we have created a similar Java class in our graphicslib3D library called MatrixStack,
    patterned after the one that became popular in older versions of OpenGL [OL16].
    As we will see, many of the model, view, and model-view'
