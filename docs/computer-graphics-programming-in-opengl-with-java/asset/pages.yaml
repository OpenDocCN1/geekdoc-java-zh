  md: "Diffuse contribution is more complex because it depends on the angle of incidence\
    \ between the light and the surface. Lambert's Cosine Law (published in 1760)\
    \ specifies that the amount of light that reflects from a surface is proportional\
    \ to the cosine of the light's angle of incidence. This can be modeled as follows:\n\
    \n```\n$I_{diffuse} = Light_{diffuse} * Material_{diffuse} * cos(\\theta)$\n```\n\
    \nAs before, the actual computations involve red, green, and blue components.\n\
    Determining the angle of incidence $\thetatheta requires us to (a) find a vector\
    \ from the pixel drawn to the light source (or similarly, a vector opposite the\
    \ light direction), and (b) find a vector that is normal (perpendicular) to the\
    \ surface of the object rendered. Let's denote these vectors $\\vec{L}$ and $\\\
    vec{N}$, respectively, as shown below in Figure 7.4:\n\n![](img/f83c01d271af8dca6b2025e3474f6599_182_0.png)\n\
    \n**Figure 7.4**nAngle of light incidence.\n\nDepending on the nature of the lights\
    \ in the scene, $\\vec{L}$ could be computed by negating the light direction vector,\
    \ or by computing a vector from the pixel to the location of the light source.\
    \ Determining $\\vec{N}$ may be trickier—normal vectors may be available for the\
    \ vertices in the model being rendered, but if the model includes normals, $\\\
    vec{N}$ would need to be estimated geometrically based on the locations of neighboring\
    \ vertices. For the rest of the chapter, we will assume that the model being rendered\
    \ includes normals for each vertex (this is common in models constructed in modeling\
    \ tools such as Maya or Blender).\n\nIt turns out that in this case, it isn't\
    \ necessary to compute $\theta$ itself. What we really desire is $cos(\\theta)$,\
    \ and recall from Chapter 3 that this can be found using the dot product. Thus,\
    \ the diffuse contribution can be computed as follows:"
