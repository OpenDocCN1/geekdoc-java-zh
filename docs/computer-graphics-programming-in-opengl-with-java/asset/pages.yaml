    # 3.9 LOOK-AT MATRIX


    The final transformation we will examine is the look-at matrix. This is handy
    when you wish to place the camera at one location, and looks towards a particular
    other location, as illustrated in Figure 3.19. Of course, it would be possible
    to achieve this using the methods we have already seen, but it is a common operation
    that building one matrix transform to do it is often useful.


    ![](img/f83c01d271af8dca6b2025e3474f6599_72_0.png)


    Figure 3.19

    Elements of Look-At.


    A look-at transform still requires deciding on a camera orientation. We do this
    by specifying a vector approximating the general orientation (desired as the world
    $Y$ axis). Typically, a sequence of cross products can be used to generate a suitable
    set of forward, side, and up vectors for the desired camera orientation. Figure
    3.20 shows the computations, starting with the camera location (eye), target location,
    and initial up vector $\vec{Y}$, to build the look-at matrix, as derived in [FV95].'
