    # 5.12 LOADING TEXTURE IMAGE FILES USING JAVA AWT CLASSES


    Throughout the rest of this textbook we use the JOGL Texture, TextureIO, and TextureData
    classes as described earlier in this chapter to load texture image data into OpenGL
    texture objects. However, it is possible to load texture image data into OpenGL
    textures directly, using Java AWT classes and some additional OpenGL commands.
    The process is quite a bit more complicated, for simplicity and clarity we will
    use the JOGL classes in this book whenever possible. However, it is useful to
    understand the process (and the particular commands) one could use in lieu of
    the JOGL texture classes. For example, the JOGL texture classes don''t support
    3D, as we will see later, building an OpenGL 3D texture object will require doing
    many of the steps ourselves in Java.


    Building a loadTexture() function analogous to the one in Program 5.1, with using
    JOGL texture classes, is shown in Program 5.2. It calling two utility functions
    (also shown). The first one is getBufferedImage(), which reads the specified image
    file, assumed to be in a recognized format as jpg or .png, and returns a Java
    ByteBuffer containing the image data. The second utility function, getRGBAPixelData(),
    extracts the RGBA pixel colors from the specified BufferedImage and returns them
    in a byte array organized in the form expected by OpenGL.


    The loadTexture() function continues by copying the array returned from getRGBAPixelData()
    into a Java ByteBuffer, using the JOGL Buffers.newByteBuffer() method described
    in Chapter 4. It creates the texture object, in a manner similar to the steps
    used for creating VBOs. Texture, like buffers, are using fixed IDs by glGenTextures().
    Here, the variable textureID is used to hold the ID of a generated texture object.
    Next, the texture object is made active by calling glBindTextureTexture(), and
    then we load the previously read-in image data into the texture object using the
    glTexImage2D() command. The first parameter on this call specifies the type of
    texture object—in this case GL_TEXTURE_2D'
