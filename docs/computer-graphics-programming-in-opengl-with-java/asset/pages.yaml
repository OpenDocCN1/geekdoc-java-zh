  md: 'Note that the graphicslib3D light and materials classes described in these
    sections do not actually perform lighting. They merely provide an organized way
    to specify and store light and material properties for elements in a scene. We
    still need to actually compute the lighting ourselves. This is going to require
    some mathematical processing in our shader code. So let''s now dive into the nuts-and-bolts
    of implementing ADS lighting in our Java/OGL and GLSL graphics programs.


    # 7.4 ADS LIGHTING COMPUTATIONS


    As we draw our scene, recall that each vertex is transformed so to simulate a
    3D world on a 2D screen. Pixel colors are the result of rasterization, as well
    as texturing and interpolation. We now incorporate the additional step of adjusting
    those rasterized pixel colors to effect the lighting and materials in our scene.
    The basic ADS computation that we perform is to determine the reflection intensity
    (I) for each pixel in our scene. This computation takes the following form:


    $I_{observed} = I_{ambient}+I_{diffuse}+I_{specular}$


    That is, we need to compute and sum the ambient, diffuse, and specular reflection
    contributions for each pixel, for each light source. This will of course depend
    on the type of light(s) in our scene, and the type of material associated with
    the rendered model.


    Ambient contribution is the simplest. It is the product of the specified ambient
    light and the specified ambient coefficient of the material:


    $I_{ambient} = Light_{ambient} * Material_{ambient}$


    Keeping in mind that light and material intensities are specified via RGB values,
    the computation is more precisely:


    ```

    $I_{ambient}^{red} = Light_{ambient}^{red} * Material_{ambient}^{red}

    $I_{ambient}^{green} = Light_{ambient}^{green} * Material_{ambient}^{green}

    $I_{ambient}^{blue} = Light_{ambient}^{blue} * Material_{ambient}^{blue}$

    ```'
