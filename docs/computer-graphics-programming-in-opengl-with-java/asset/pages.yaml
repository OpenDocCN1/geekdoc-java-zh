    ```

    srcPixel * srcAlpha = [0.75, 0, 0, 0.5625]

    destPixel * (1-srcAlpha) = [0, 0.25, 0, 0.25]

    resulting pixel = [0.75, 0.25, 0, 0.8125]

    ```


    That is moist, with some green, and mostly solid. The overall effect of the settings
    is to leave the destination show by an amount corresponding to the source pixel''s
    transparency. In this example, the pixel in the frame buffer is green, and the
    incoming pixel is red with 25% transparency (75% opacity). So some green is given
    to show through the red.


    It turns out that these settings for blend function and blend equation work well
    in many cases. Let''s apply them to a practical example in a scene containing
    two 3D models: a torus, and a pyramid in front of the torus. Figure 14.4 shows
    such a scene, on the left with an opaque pyramid, and on the right with the pyramid''s
    alpha value set to 0.8. Lighting has been added.


    For many applications—such as creating a flat “window” as part of a house—this
    simple implementation of transparency may be sufficient. However, in the example
    shown in Figure 14.4, there is a fairly obvious inadequacy. Although the pyramid
    model is now effectively transparent, an actual transparency should reveal not
    only the objects behind it, but also its own back surfaces.


    Actually, the reason that the back faces of the pyramid did not appear is because
    we enabled back-face culling. A reasonable idea might be to disable


    ![](img/f83c01d271af8dca6b2025e3474f6599_321_0.png)


    Figure 14.4 Pyramid with alpha=1.0 (left), and alpha=0.8 (right).'
