  md: 'The logistic function causes the colors to tend more towards white or blue,
    rather than values in between, producing the visual effect of there being distinct
    cloud boundaries. The variable cloud adjusts the relative amount of white (versus
    blue) in the noise map, which in turn leads to more (or) generated white regions
    (i.e., distinct clouds) when the logistic function is applied. The skydome, now
    with more distinct cloud formations, is shown in Figure 14.22.


    ![](img/f83c01d271af8dca6b2025e3474f6599_346_0.png)


    Figure 14.22

    Skydome with exponential cloud texture.


    Lastly, real clouds are not different. To enhance the realism of our clouds, we
    should animate them by (a) making them move or "drift" over time and (b) gradually
    changing their form as they drift.


    One way of making the clouds "drift" is to slowly rotate the skydome. This isn''t
    a perfect solution, as real clouds tend to drift in a straight direction rather
    than rotating around the observer. However, if the rotation is slow and the clouds
    are simple for decorating a scene, the effect is likely to be adequate.


    Having the clouds generally change form as they drift at first seem tricky. However,
    having the 3D noise map we have used to texture the clouds, there is actually
    a very simple and clear way of achieving the effect. Recall that although we constructed
    a 3D texture map for the clouds, we so far only used one "slice" of it, in conjunction
    with the skydome''s 2D texture coordinates (we set the "Z" coordinate of the texture
    lookup to a constant value). The rest of the 3D texture has so far unused.


    Our trick will be to replace the texture lookup''s constant "Z" coordinate with
    a variable that changes over time. That is, as we rotate the skydome, we gradually
    increment the depth variable, changing the texture lookup to use a different slice.
    Recall that when we built the 3D texture map, we applied smoothing to the color
    changes along all three axes. So, neighboring slices from the map are very similar,
    but slightly different. Thus, by gradually changing the "Z" value in the texture()
    call, the appearance of the clouds will gradually change.


    The code changes to cause the clouds to slowly move and change over time are shown
    in Program 14.8.'
