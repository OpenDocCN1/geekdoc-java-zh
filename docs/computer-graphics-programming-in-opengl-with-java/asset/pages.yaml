    Mathematical multiplication is frequently referred to as concatenation, because
    as will be seen, it is used to combine a set of matrix transforms into a single
    matrix. This ability to combine matrix transforms is made possible because of
    the associative property of matrix multiplication. Consider the following sequence
    of operations:


    New Point = Matrix*, (Matrix₂, (Matrix₃ * Point))


    Here, we multiply by Matrix₃, then multiply result by Matrix*, and finally by
    Matrix. The result is a new point. The associative property ensures that the computation
    is equivalent to:


    New Point = (Matrix*, Matrix*, Matrix*) * Point


    Here, we first multiply the three matrices, following the concatenation of Matrix₁,
    Matrix*, and Matrix₃ (which itself is also a 4x4 matrix). If we refer to this
    concatenation as Matrixc₁, we can rewrite the above operation as:


    New Point = Matrixc* Point


    The advantage here is, as we will see in Chapter 4, that we will frequently need
    to apply the same sequence of matrix transformations to every point in our scene.
    By pre-computing the concatenation of all those matrices, it turns that we can
    reduce the total number of matrix operations needed manifold.


    GLSL and graphics3D both support matrix multiplication; in GLSL with the overloaded
    * operator, and in graphics3D with the function Matrix3D concatenate(Matrix3D).


    The inverse of a 4x4 matrix M is another 4x4 matrix, denoted M¹, that has the
    following property under matrix multiplication:


    ```

    M(M⁻¹) = (M⁻¹)¹M = identity matrix

    ```


    We won''t present the details of computing the inverse. However, it is worth knowing
    that determining the inverse of a matrix can be computationally expensive; fortunately,
    we rarely need it. In the rare instances when we do,'
