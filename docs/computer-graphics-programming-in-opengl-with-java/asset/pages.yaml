  md: 'OpenGL calls, made in C or in Java through JOGL, involve long lists of parameters.
    While writing this book, the authors debated whether or not to, in each case,
    describe all of the parameters. We decided that at the very beginning, we would
    describe every detail. But as the topics progressed, we decided to avoid getting
    bogged down in every piece of minutiae in the OpenGL calls (and there are many),
    for fear of the reader losing sight of the big picture. For this reason, it is
    essential when working through the examples to have ready access to reference
    material for Java, OpenGL, and Jogl.


    For this, there are a number of excellent reference sources that we recommend
    in conjunction with this book. The javadocs for Java and JOGL are absolutely essential,
    and can be accessed online or downloaded (in explain 1 to download the JOGL javadoc).
    The reader should bookmark them for easy access in a browser, and expect to access
    them continuously for looking up items such as parameter and constructor details.
    The URLs for Java and JOGL javados are:


    ```

    https://docs.oracle.com/javase8/docs/

    https://jogamp.org/deployment/webstart/javadoc/jogl/javadoc

    ```


    Many of the entries in the JOGL javadoc are simply pointers to the corresponding
    entry in the OpenGL documentation, available here:


    ```

    https://www.opengl.org/sdk/docs/man/

    ```


    Our examples utilize a mathematics library called graphicslib3D. This is a Java
    library that also has its own set of javadocs included (described in Chapter 1),
    the reader should locate the accompanying javadoc folder and bookmark its root
    file (index.html).


    Finally, there are many other books on 3D graphics programming that we recommend
    reading in parallel with this book (as solving the "research" problems). Here
    are five that we often refer to:


    +   * (Sellers et al.) OpenGLSuperBible [SW15]

    * (Kenchenich et al.) OpenGL Programming Guide [KS16] (the "red book")

    * (Wolff) OpenGL 4 Shading Language Cookbook [WO13]

    * (Angel and Schreiner) Interactive Computer Graphics [AS14]

    * (Luna) Introduction to 3D Game Programming with DirectX 12 [LU16]'
  merge: -1
