  md: 'program. There are several 3D model file formats; again, there are too many
    to list, but some examples are Wavefront (.obj), 3D Studio Max (.3ds), Stanford
    Scanning Repository (.ply), Ogre3D (.mesh), and many others. The simplest is Wavefront
    (usually dubbed OBJ), which we will examine in detail.


    OBJ files are simple enough that we can develop a basic importer relatively easily.
    In an OBJ file, lines of text specify vertex geometric data, texture coordinates,
    normals, and other information. It has some limitations—for example, OBJ files
    have no way of specifying model animation.


    Lines in an OBJ file start with a character tag indicating what kind of data is
    on that line. Some common tags include:


    +   * v — geometric (vertex location) data

    * vt — texture coordinates

    * vn — vertex normal

    * f — face (typically vertices in a triangle)


    Other tags make it possible to store the object name, materials it uses, curves,
    shadows, and many others. We will limit our discussion to the four tags listed
    above, which are sufficient for importing a wide variety of complex models.


    Suppose we use Blender to build a simple pyramid as the one we developed for Program
    4.3. Here is a screenshot of a simple pyramid being created in Blender.


    ![](img/f83c01d271af8dca6b2025e3474f6599_161_0.png)


    **Figure 6.14**nPyramid built in Blender.'
