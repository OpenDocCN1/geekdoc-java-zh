  md: '# JOGL


    JOGL first appeared in 2003, published on the website Java.net. Since 2010 it
    has been an independent open source project, and part of a suite of Java bindings
    maintained by JogAmp [JO15], an online community of developers. JogAmp maintains
    JOAL and JOCL, bindings for OpenAL and OpenGL, respectively. As new versions of
    OpenGL and/or Java are released, new versions of JOGL are developed to support
    continued compatibility. JogAmp maintains a short user''s guide that includes
    valuable guidelines for installing and using JOGL efficiently and effectively
    [JU16]. This book assumes at least version 2.3 of JOGL.


    # graphicslib3D


    3D graphics programming makes heavy use of vector and matrix algebra. For this
    reason, use of OpenGL is easily facilitated by accompanying it with a function
    library or class package to support common mathematical functions. For example,
    the popular OpenGL Superville [SW15] utilizes a C library called “vecmath”.


    graphicslib3D provides classes for basic math functions related to graphics concepts,
    such as vector, matrix, point, vertex, and quaternion. It also contains a few
    utility classes for storing used 3D graphics structures, such as a stack for building
    hierarchical structures, lighting and material information, and a few basic shapes
    as a sphere and a torus.


    graphicslib3D was first developed in 2005 by John Clevenger at California University
    Sacramento, and is maintained by the authors.


    # INSTALLATION AND CONFIGURATION


    # Installing Java


    To use Java for the examples in this book, you will need both the JRE (Java Runtime
