  md: "# Computer Graphics Programming in OpenGL with Java\n\nTheSmoothNoise function\
    \ computes a grayscale value for each texel in the smoothed version of a noise\
    \ map by computing a weighted average of the eight grayscale values surrounding\
    \ the texel in the original “blocky” noise map. It is, it averages the color values\
    \ at the points of the small “block” the texel is. The weights for each of these\
    \ “neighbor” colors are based on the texel's distance to its neighbors, normalized\
    \ to the range (0..1).\n\nNext, smooth noise maps of various zooming factors are\
    \ combined. A new noise is created in which each of its texels is formed by another\
    \ weighted average, this time based on the zoom of the texels at the same location\
    \ in each “smoothed” noise maps, with the zoom factor serving as the weight. The\
    \ effect has been dubbed “turbulence,” although it is really more related to the\
    \ harmonics produced by summing waveforms. A new turbulence() function, and a\
    \ modified version of fillDataArray() that specifies noise map that zooms levels\
    \ 1 through 32 (the ones that are powers of two) is shown below, by an image of\
    \ a cube representing the resulting noise map.\n\n```\nprivate double turbulence(double\
    \ x, double y, double z, double maxZoom)\ndouble sum = 0.0, zoom = maxZoom;\n\
    while(zoom >= 1.0) { // last path is when zoom=1.\n    // compute weighted sum\
    \ of smoothed noise maps\n    sum = sum + smoothNoise(x,y,z, z/zoom) * zoom;\n\
    \    zoom = zoom / 2.0; // for each zoom factor that is a power of two.\n}\nsum\
    \ = 128.0 * sum / maxZoom; // guarantees RGB < 256 for maxZoom values up to 64\n\
    ```\n\n```\nprivate void fillDataArray(byte data[]) {\n    float maxZoom = 32.0;\
    \ //:noiseWidth; i++\n    for (int i=0; i<noiseWidth; i++) {\n        for (int\
    \ j=0; j<noiseHeight; j++) {\n            for (int k=0; k<noiseDepth; k++) {\n\
    \                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+0] =\
    \ (byte) turbulence(i, j, k, maxZoom);\n                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+1]\
    \ = (byte) turbulence(i, j, k, maxZoom);\n                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+2]\
    \ = (byte) turbulence(i, j, k, maxZoom);\n                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+3]\
    \ = (byte) 255;\n            }\n        }\n    }\n}\n```"
