    # 2.1 THE OPENGL PIPELINE


    Modern 3D graphics programming utilizes a *pipeline*, in which the process of
    converting a 3D scene to a 2D image is broken down into series of steps. OpenGL
    and DirectX utilize similar pipelines.


    A simplified overview of the OpenGL pipeline is shown in Figure 2.2 (not every
    stage is shown, the major ones we will study). The Java/JOGL application sends
    graphics data into the vertex shader—processing proceeds through the pipeline,
    and pixels merge for display on the monitor.


    The stages shaded in blue (vertex, tessellation, geometry, and fragment) are *programmable*
    in GLSL. It is one of the responsibilities of the Java/JOGL application to load
    GLSL programs into these shader stages, as follows:


    +   It uses Java to obtain the GLSL code, either from text files or hardcoded
    strings.'
