    In this chapter we explore a variety of techniques utilizing the tools we learned
    throughout the book. Some we will develop fully, while others we will offer a
    more cursory description. Graphics programming is a huge field, and the chapter
    is by no means comprehensive, but rather an introduction to just a few of the
    creative effects that have been developed over the years.


    #  14.1 FOG


    Usually when people think of fog, they think of early misty mornings with low
    visibility. In truth, atmospheric haze (such as fog) is more common than most
    of us think. During the time of the, there is some degree of haze in the air,
    and although we have become accustomed to seeing it, we don''t usually realize
    it is there. So we can enhance the realism in our outdoor scenes by introducing
    fog—even if it is only a small amount.


    Fog also can enhance the sense of depth. When close objects have better clarity
    than distant objects, it is one more visual cue that our brains can use to decipher
    the topography of a 3D scene.'
