  md: "# Chapter 14 · Other Techniques 311\n\nUnlike 2D textures, which can be built\
    \ from standard image files, 3D textures are usually generated *procedurally*.\
    \ As was done previously for 2D textures, we decide on a resolution—that is, the\
    \ number of texels in each dimension. Depending on the colors in the texture,\
    \ we may build a 3-dimensional array containing those colors. Alternatively, if\
    \ the texture holds a “pattern” that could be utilized with various colors, we\
    \ might instead build an array that holds the pattern, as with 0s and 1s.\n\n\
    For example, we can build a 3D texture that represents horizontal stripes by filling\
    \ an array with 0s and 1 corresponds to the desired stripe pattern. Suppose that\
    \ the desired resolution of the texture is 200x200x200, and the texture is comprised\
    \ of alternating stripes that each have 10 texels high. A simple function that\
    \ builds such a structure by filling an array with 0s and 1s in a nested loop\
    \ (assuming in this case width, height, and depth variables are all set to 200),\
    \ would be:\n\n```\nvoid generate3Dpattern(\n  for (int x=0; x<width; x++)\n \
    \   for (int y=0; y<height; y++)\n      for (int z=0; z<depth; z++)\n        if\
    \ ((y/10) % 2 == 0)\n          tex3Dpattern[x][y][z] = 0;\n        else\n    \
