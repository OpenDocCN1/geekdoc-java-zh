  md: "called the Z-buffer. Both of these buffers are the same size as the raster—that\
    \ is, there is an entry in each buffer for every pixel on the screen.\n\nAs various\
    \ objects are drawn in a scene, pixel colors are generated by the fragment shader.\
    \ The pixel colors are placed in the color buffer—it is the color buffer that\
    \ is ultimately written to the screen. When multiple objects occupy some of the\
    \ same pixels in the color buffer, a determination must be made as which pixel\
    \ color(s) is retained, based on which object is the nearest viewer.\n\nHidden\
    \ surface removal is done as follows:\n\n+   - Before a scene is rendered, the\
    \ depth buffer is filled with values representing maximum depth.\n- As a pixel\
    \ color is output by the fragment shader, its distance from the viewer is calculated.\n\
    - If the computed distance is less than the distance stored in the depth buffer\
    \ (for that pixel), (a) the pixel color replaces the color in the color buffer,\
    \ and (b) the distance replaces the value in the depth buffer. Otherwise, the\
    \ pixel is discarded.\n\nThis procedure called the Z-buffer algorithm, as expressed\
