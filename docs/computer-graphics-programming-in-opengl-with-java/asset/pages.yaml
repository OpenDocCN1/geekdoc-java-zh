  md: '# Chapter 5 · Texture Mapping 115


    the region, becoming blurry (and possibly distorted). This can sometimes be comb,
    depending on the nature of the texture, by assigning the texture coordinates differently
    so that applying the texture requires less stretching. Another solution is to
    use a higher resolution texture image.


    The reverse situation is when the resolution of the image texture is greater than
    that of the region being drawn. It is probably not at all obvious why this would
    pose a problem, but it does! In this case, noticeable aliasing artifacts can occur,
    giving rise to strange-false patterns, or “shimmering” effects in moving objects.


    Aliasing is caused by sampling errors. It is most often associated with signal
    processing, where an inadequately sampled signal appears to have different properties
    (such as wavelength) than it actually does when it is reconstructed. An example
    is shown in Figure 5.6. The original waveform is shown in red. The yellow dots
    along the waveform represent the samples. If they are used to reconstruct the
    wave, and if there are not enough of them, they define a different wave (shown
    in blue).


    ![](img/f83c01d271af8dca6b2025e3474f6599_131_0.png)


    Similarly, in texture-mapping, when a high-resolution (and highly detailed) image
    is sparsely sampled (such as when using a uniform sampler variable), the colors
    retrieved will be inadequate to reflect the actual detail in the image, and may
    seem random. If the texture has a repeated pattern, aliasing can result in a different
    pattern produced than the one in the original image. If the object being textured
    is moving, rounding errors in looking up the texels can result in constant changes
    in the sampled pixel at a texture coordinate, resulting in a sparkling effect
    across the surface of the object being drawn.


    Figure 5.7 shows a tilted close-up rendering of the top of a cube which has been
    textured by a large, high-resolution image of a checkerboard.'
