    # # 14.9 NOISE APPLICATION – SPECIAL EFFECTS


    Noise textures can be used for a variety of special effects. In fact, there are
    so many possible uses that its applicability is limited only by one’s imagination.


    One very simple special effect that we will demonstrate here is a *dissolve effect*.
    This is where we make an object appear to gradually dissolve into small particles,
    until it eventually disappears. Given a 3D noise texture, this effect can be achieved
    with very little additional code. Note that this example only works if animation
    is incorporated, with the use of FPSAnimator.


    To facilitate the dissolve effect, we introduce the GLSL discard command. This
    command is only legal in the fragment shader, and when executed, it causes the
    fragment shader to discard the current fragment (meaning not render it).


    Our strategy is a simple one. In the Java/JOpenGL application, we create a fine-grained
    noise map identical to the one shown back in Figure 14.12, and also a *float*
    variable that gradually increases over time. This variable is then sent down the
    shader pipeline in a uniform variable, and the noise map is also placed in a texture
    map with an associated sampler. The fragment shader then accesses the noise texture
    using the sampler—in this case we use the returned noise value to determine whether
    or not to discard the fragment. We do this by'
