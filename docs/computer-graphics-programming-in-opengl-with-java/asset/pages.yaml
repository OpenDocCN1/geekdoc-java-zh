  md: '# 2.5 ANIMATING A SCENE


    Many of the techniques in this book can be animated. This is when things in the
    scene are moving or changing, and the scene is rendered to reflect these changes
    in real time.


    Recall from Section 2.1.1 that OpenGL makes a single call to init(), and then
    to display(), when it is initialized. After that, if there are changes to our
    scene, it becomes the programmer''s responsibility to tell OpenGL to call display()
    again. This is done by invoking the display() function in the GLCanvas of the
    Java/JOGL application, as follows:


    ```

    myCanvas.display();

    ```


    That is, the GLCanvas has its own display() function. If we call it, the GLCanvas
    will then turn back the display() function in our Java/JOGL application. Technically,
    the two display()s are completely different functions, but they are intertwined.


    One approach is to display() whenever a change in the scene occurs. In a complex
    scene, this can become unwieldy. A better approach is to make this call repeatedly,
    at fixed intervals typically called the frame rate. Each rendering of our scene
    is then called a frame.


    There are many ways to organize the code for animating a scene. One way is to
    create an "animator" in Java, using either Timer, Thread.sleep(), or better yet,
    a ScheduledThreadPoolExecutor.


    An even simpler way to build the animator is to use one of the JOGL-specific classes:


    +   - Animator

    - FPSAnimator


    These classes are designed specifically for animating 3D scenes. An FPSAnimator
    ("FPS" stands for "frames per second"), when instantiated, calls the display()
    function on a drawable object repeatedly, and at a specified frame rate.


