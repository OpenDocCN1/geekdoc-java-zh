  md: "# Chapter 14 · Other Techniques 321\n\n3D noise maps, such as the one in Figure\
    \ 14.15, can be used for a wide variety of imaginative applications. In the next\
    \ sections, we will use it to generate marble, world, and clouds. The distribution\
    \ of the noise can be adjusted by various combinations of zoom-in levels.\n\n\
    ![](img/f83c01d271af8dca6b2025e3474f6599_337_0.png)\n\n# 14.6 NOISE APPLICATION\
    \ – MARBLE\n\nBy modifying the noise map and adding Phong lighting with an appropriate\
    \ ADS material described previously in Figure 7.3, we can make the dragon model\
    \ appear to be made of marble-like stone.\n\n> Figure 14.15\n3D texture map with\
    \ combined \"turbulence\" noise.\n\nWe start by generating a striped pattern somewhat\
    \ similar to the “stripes” example from earlier in this chapter—the new stripes\
    \ differ from the previous ones, first because they are diagonal, and also because\
    \ they are produced by a sine wave and have blurry edges. We then use the noise\
    \ map to perturb these lines, storing them as grayscale values. The changes to\
    \ the fillArray() function are as:\n\n```\nprivate void fillArray(byte data[])\
    \ {\n  double veinFrequency = 2.0;\n  double turbPower = 1.5;\n  double maxZoom\
    \ = 64.0;\n  for (int i=0; i<noiseWidth; i++) {\n    for (int j=0; j<noiseHeight;\
    \ j++) {\n      for (int k=0; k<noiseDepth; k++) {\n        double xyzValue =\
    \ i/noiseWidth + j/noiseHeight + k/noiseDepth\n          + turbPower*turbulence(i,j,maxZoom)\
    \ / 256.0;\n        double sineValue = Math.abs(Math.sin(xyzValue * 3.14159 *\
    \ veinFrequency));\n        Color c = new Color((float)sineValue, (float)sineValue,\
    \ (float)sineValue);\n        data[i*noiseWidth*noiseHeight*4 + j*noiseHeight*4\
    \ + k*4 + 0] = (byte)c.getRed();\n        data[i*noiseWidth*noiseHeight*4 + j*noiseHeight*4\
    \ + k*4 + 1] = (byte)c.getGreen();\n        data[i*noiseWidth*noiseHeight*4 +\
    \ j*noiseHeight*4 + k*4 + 2] = (byte)c.getBlue();\n        data[i*noiseWidth*noiseHeight*4\
    \ + j*noiseHeight*4 + k*4 + 3] = (byte)255;\n      }\n    }\n  }\n}\n```"
