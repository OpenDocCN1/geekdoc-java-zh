  md: '# 10.1 BUMP MAPPING


    In Chapter 7, we saw how surface normals are critical to creating convincing lighting
    effects. Light intensity at a pixel is determined largely by the reflection angle,
    taking into account the light source location, camera location, and the normal
    vector at the pixel. Thus, we can avoid generating detailed vertices corresponding
    to a bumpy or wrinkled surface if we can find a way of generating the corresponding
    normals.


    Figure 10.1 illustrates the concept of modified normals responding to a single
    “bump.”


    Thus, if we want to make an object look as though it has bumps (wrinkles, craters,
    etc.), one way is to compute the normals that would exist on a surface. Then when
    the scene is lit, the lighting would produce the desired illusion. This was first
    proposed by Blinn in 1978 [BL78], and became practical with the advent of the
    capability of performing per-pixel lighting computations in a fragment shader.


    ![](img/f83c01d271af8dca6b2025e3474f6599_248_0.png)


    An example is illustrated in the vertex and fragment shaders shown in Program
    10.1, which produces a torus with a “golf-ball” surface as shown below


    **Figure 10.1** Perturbed normal vectors for bump mapping.


    in Figure 10.2 that follows. The code is almost identical to Program 7.2 that
    we saw previously in Chapter 7. The only significant change is in the fragment
    shader—the incoming interpolated normals (varyingNormal in the original program)
    are altered with bumps calculated using a sine wave function in the X, Y, and
    Z axes applied to the original (untransformed) vertices of the torus model. Note
    that the vertex shader therefore now needs to pass these untransformed vertices
    down the pipeline.


    Altering the normals in this manner, with a mathematical function computed at
    runtime, is called *procedural bump mapping.*'
