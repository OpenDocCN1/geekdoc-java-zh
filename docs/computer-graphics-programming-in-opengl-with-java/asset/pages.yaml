  md: 'Our strategy is now becoming more refined:


    +   * (pass 1) Render the scene from the light''s position. The depth buffer then
    contains, the distance between the light and the nearest object to it.

    * Copy the depth buffer to a separate “shadow buffer.”

    * (pass 2) Render the scene normally. For each pixel, look up the corresponding
    position in the shadow buffer. If the distance to the point being rendered is
    greater than the value retrieved from the shadow buffer, then the object drawn
    at this pixel is further from the light than the object nearest to, and therefore
    this pixel is in shadow.


    When a pixel is found to be in shadow, we need to make it darker. One simple and
    effective way of doing this is to render its ambient lighting, ignoring its diffuse
    and specular components.


    The method described above is often called “shadow buffering.” The term “shadow
    mapping” arises when, in the second step, we copy the depth buffer into a texture.
    When a texture object is used in this way, we will refer to it as a shadow texture,
    and OpenGL has support for shadow textures in the form of a sampler2Shadow type
    (discussed below). This allows us to leverage the power of hardware support for
    texture units and sampler variables (i.e., “texture mapping”), in the fragment
    shader, to quickly perform the depth lookup in pass 2. Our revised strategy is:


    +   * (pass 1) as before.

    * Copy the depth buffer into a texture.

    * (pass 2) as before, except that the shadow buffer is now a shadow texture.


    Let’s now implement these steps.


    # 8.4.1 Shadow Mapping (PASS ONE) – “Draw” Objects from Light Position


    In one step, we first move our camera to the light''s position, and then render
    the scene. Our goal here is not to actually draw the scene on the display, but
    to complete just enough of the rendering process that the depth buffer is properly
    filled. Thus it will not be necessary to generate colors for the pixels, and so
    our first pass will utilize a vertex buffer, but will not require a fragment shader.'
