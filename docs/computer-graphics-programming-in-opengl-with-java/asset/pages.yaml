  md: '# Computer Graphics Programming in OpenGL with Java


    In order to use the OpenGL camera, one of the things we need to do is simulate
    moving it to some desired location and orientation. This is done by figuring out
    our objects in the world are located relative to the desired camera position (i.e.,
    where they are located “camera space,” as defined by the U, V, and N axes of the
    camera as illustrated in Figure 3.12). Given a point at world space location $P_w$
    we need a transform to convert it to the equivalent point in camera space, making
    it appear as though we are viewing from the desired camera location $C_w$. We
    do this by computing its camera space position $P_c$. Knowing the OpenGL camera
    location is always at the fixed position (0,0,0), what transform would achieve
    this?


    ![](img/f83c01d271af8dca6b2025e3474f6599_66_0.png)


    The necessary transforms are:


    +   1. Translate $P_w$ by the negative of the desired camera location.

    2. Rotate $P_w$ by the negative of the desired camera orientation Euler angles.


    We can build a single transform that does both the rotation and the translation
    in one matrix, called the viewing transform matrix, or V. The matrix V is produced
    by concatenating the two matrices T (a translation matrix containing the negative
    of the desired camera location), and R (a rotation matrix containing the negative
    of the desired camera orientation). In this case, working from right to left,
    we first translate world point P, then rotate it:


    ```

    $P_c = R^* (T * P_w)$

    ```'
