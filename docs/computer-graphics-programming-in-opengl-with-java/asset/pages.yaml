  md: '# Chapter 10 · Enhancing Surface Detail 237


    We create TBN by a 3x3 mat3 matrix. The mat3 constructor takes three vectors and
    generates a matrix containing the first vector in the top row, the second vector
    in the middle row, and the third in the bottom row (similar to building a view
    matrix from camera space—see Figure 3.13).


    The shader uses the fragment''s texture coordinates to extract the normal map
    entry corresponding to the current fragment. The sampler sampler variable “normMap”
    is used for this, and in this case is bound to texture unit 0 (note: the Java/JGL
    implementation must have attached the normal map image to texture unit 0). To
    convert the color component from the stored range [0...1] to its original range
    [-...+1] we multiply by 2.0 and subtract 1.0.


    The TBN matrix is then applied to the resulting normal map to produce the final
    normal for the current pixel. The rest of the shader is identical to the fragment
    shader for Phong lighting. The fragment shader is shown in Program 10.2, and is
    based on a version by Etay Meiri [ME11].


    Program 10.2 also contains our first example of a GLSL function (aside from the
    “main”). In the C language, functions must be defined before (or “above”) where
    they are called, or else a forward declaration must be provided. In this example
    a forward declaration isn’t required because the function has been defined above
    the call to it.


    A variety of tools exist for developing normal map images. Some image editing
    tools, such as GIMP [GI16] and Photoshop [PH16], have such capabilities. Such
    tools analyze the edges in an image, inferring peaks and valleys, and producing
    a corresponding normal map.


