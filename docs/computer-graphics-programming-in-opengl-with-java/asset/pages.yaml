  md: '# Computer Graphics Programming in OpenGL with Java


    It is likely that the reader will need to do a few preparatory steps to ensure
    each of these are installed and properly accessible on his/her system. In this
    section we briefly describe each of them. Then in the following section we show
    how to install and configure them for use.


    # 1.1.1 Java


    Java was developed at Sun Microsystems in the early 1990s, and the first stable
    release of a development kit (JDK) was in 1995. In 2010, Oracle Corp. acquired
    Sun, and has maintained Java since time [OR16]. This book assumes Java version
    8, which was released in 2014.


    # 1.1.2 OpenGL / GLSL


    Version 1.0 of OpenGL appeared in 1992 as an “open” alternative to vendor-specific
    Application Programming Interfaces (APIs) for computer graphics. Its specification
    and development was managed and controlled by the OpenGL Review Board (ARB), a
    newly formed group of industry participants. In 2006 the ARB transferred the control
    of the OpenGL specification to the Khronos Group, a nonprofit consortium which
    manages not only the OpenGL specification but a wide variety of other industry
    standards.


    Since its beginning OpenGL has been revised and extended regularly. In 2004, version
    2.0 introduced the OpenGL Shading Language (GLSL), allowing “shader programs”
    to be installed and run directly in graphics pipelines pipeline.


    In 2009, 3.1 removed a large number of features that had been deprecated, to enforce
