    An orthographic projection is a parallel projection in which all projections are
    at right angles with the projection plane. An orthographic matrix is built by
    defining the following parameters: (a) the distance $Z_{near}$ from the camera
    to the projection plane, (b) the distance $Z_{far}$ from the camera to the far
    clipping plane, and (c) values for $L, R, T$, and $B$, with $L$ and $R$ corresponding
    to the X coordinates of the left and right boundaries of the projection plane,
    respectively, and $T$ and $B$ corresponding to the Y coordinates of the top and
    bottom boundaries of the projection plane. The orthographic projection matrix,
    as derived in [FV95] is then:


    | | 0 | 0 | R+L |

    |---|---|---|---|n| R-L | | | R-L |

    | | 2 | 0 | T+B |

    | | T-B | | T-B |

    | 0 | 0 | $Z_{near}$ |

    | | $Z_{far}-Z_{near}$ | $Z_{far}-Z_{near}$ |

    | 0 | 0 | 1 |


