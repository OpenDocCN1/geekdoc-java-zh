  md: '# Chapter 4 Managing 3D Graphics Data


    matrices that would normally be needed in a complex scene can be replaced by a
    single instance of MatrixStack.


    We will first examine the basic commands for instantiating and utilizing a matrix
    stack, then use MatrixStack to build a animated scene. The most important MatrixStack
    functions are:


    +   * pushMatrix() – makes a copy of the top matrix, and pushes the copy onto
    the stack

    * popMatrix() – removes it from the top matrix

    * multMatrix(m) – concatenates m onto the top matrix in the stack

    * peek() – returns the topmost matrix, without removing it from the stack

    * rotate(x,y,z) – applied directly to the stack

    * scale(x,y,z) – top matrix in the stack


    Now, rather than building transforms by creating instances of Matrix3D, we instead
    use the pushMatrix()command to create new matrices at the top of the stack. Desired
    transforms are then concatenated as needed to the newly created matrix on the
    top of the stack.


    The first matrix pushed on the stack is frequently the VIEW matrix. The matrices
    above it are model-view matrices of increasing complexity; that is, they have
    an increasing number of model transforms applied to them. These transforms can
    be either applied directly, or by first concatenating other matrices.


    In our planetary system, the matrix positioned immediately above the VIEW matrix
    would be the sun''s MV matrix. The Earth''s MV matrix, which consists of the sun''s
    MV matrix concatenated with the Earth''s model matrix. That is, the Earth''s MV
    matrix is built by incorporating the planet''s transforms into the sun transforms.
    Similarly, the moon''s MV matrix sits on top of the planet''s MV matrix, and is
    constructed by concatenating the planet''s MV matrix with the moon''s model matrix.


    After rendering the moon, a second “moon” could be rendered by “popping” the first
    moon matrix off the stack (restoring the top of the stack to the planet''s model-view
    matrix) and then repeating the process for the second moon.


