  md: "The remainder of the vertex and fragment shader code implements Blinn-Phong\
    \ shading. They are shown in Figure 8.6 and Figure 8.7, with the added code for\
    \ shadow mapping highlighted.\n\nLet's examine more closely how we use OpenGL\
    \ to perform the depth comparison between the pixel rendered and the value in\
    \ the shadow texture. We start in the vertex shader with a vertex coordinate in\
    \ space, which we multiply by shadowMVP2 to produce the corresponding coordinate\
    \ in “light space” (that is, from the light’s point of view). The interpolated\
    \ (3D) light space coordinates (x,y,z) are used in the fragment shader as follows.\
    \ The z component represents the distance from the light to the pixel. The (x,y)\
    \ components are used to retrieve the depth information stored in the 2D shadow\
    \ texture. This retrieved value (the distance to the object light) is compared\
    \ with z. This comparison produces\n\n```\n#version 430\nlayout (location=0) in\
    \ vec3 vertPos;\nlayout (location=1) in vec3 normal;\n\nout vec3 varyingNormal,\
    \ varyingLightDir, varyingVertPos, varyingHalfVec;\nvec4 shadow_coord;\n\nstruct\
    \ PositionLight { vec4 ambient, diffuse, specular; vec3 position; };\nstruct Material\
    \ { vec4 ambient, diffuse, specular, float shininess; };\nuniform vec4 globalAmbient;\n\
    uniform PositionLight light; // light position is assumed to be in eye space\n\
    uniform Material material;\nuniform mat4 mv_matrix;\nuniform mat4 proj_matrix;\n\
    uniform mat4 norm_matrix;\nuniform mat4 shadowMVP;\nlayout (binding=0) uniform\
    \ sampler2DShadowTex;\n\nvoid main() {\n  vec4 vertPos = (mv_matrix * vec4(vertPos,1.0)).xyz;\n\
    \  varyingLightDir = light.position - varyingVertPos;\n  varyingNormal = (norm_matrix\
    \ * vec4(normal,1.0)).xyz;\n  varyingHalfVec = (varyingLightDir - varyingVertPos).xyz;\n\
    \  shadow_coord = shadowMVP2 * vec4(vertPos,1.0);\n  gl_Position = proj_matrix\
    \ * vec4(vertPos,1.0);\n}\n```\n\nFigure 8.6\nShadow mapping pass 2 vertex shader."
