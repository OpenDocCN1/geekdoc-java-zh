  md: '# 5.11 PERSPECTIVE DISTORTION


    We have seen that as texture coordinates are passed from the vertex shader to
    the fragment shader, they are interpolated as they pass through the rasterizer.
    We have also seen that this is the result of the automatic linear interpolation
    that is always performed on vertex attributes.


    However, in the case of texture coordinates, linear interpolation can lead to
    noticeable distortion in a 3D scene with perspective projection.


    Consider a rectangle of two triangles, and textured with a checkerboard image,
    facing the camera. As the rectangle is rotated around the X axis, the top part
    of the rectangle tilts away from the camera, while the lower part of the rectangle
    swings closer to the camera. Thus, we would expect the squares at the top to become
    smaller, and the squares at the bottom to become larger. However, linear interpolation
    of the texture coordinates will instead cause the height of all squares to be
    equal. The distortion is exacerbated along the diagonal defining the two triangles
    that make up the rectangle. The resulting distortion is shown in Figure 5.16.


    Fortunately, there are algorithms for correcting perspective distortion, and by
    default, OpenGL applies a perspective correction algorithm [OP14] when sampling
    texture coordinates. Figure 5.17 shows the same rotating checkerboard, properly
    rendered by OpenGL.


    Although not common, it is possible to disable OpenGL’s perspective correction
    by adding “noperspective” in the declaration of the vertex attribute containing
    the texture coordinates. This has to be done in both the vertex and fragment shaders.
    For example, the vertex attribute in the vertex shader would be declared as follows:


    ```

    noperspective out vec2 texCoord;

    ```


    ![](img/f83c01d271af8dca6b2025e3474f6599_139_0.png)


    ![](img/f83c01d271af8dca6b2025e3474f6599_139_1.png)'
