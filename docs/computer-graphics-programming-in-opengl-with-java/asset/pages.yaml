- img_proc: true
  md: 'By introducing a parameter $t$, we can build a system of parametric equations
    that define a curve. The $t$ represents a fraction of the distance along the


    ![](img/f83c01d271af8dca6b2025e3474f6599_266_0.png)


    line segment connecting one control point to the next control point. Values for
    $t$ are within the range $[0,1]$ for points along the segment. Figure 11.2 shows
    one value, $t=0.75$, applied to the lines connecting $p_0$ and $p_1-p_2$. Respectively.
    This defines two new points $p_0(t)$ and $p_1(t)$ along the two original lines.
    We repeat this process for the line segment connecting the new points $p_0(t)$
    and $p_1(t)$ producing $P(t)$ where $t=0.75$ along the line $p_0(t)-p_1(t)$. $P(t)$
    is one of the points on the resulting curve, and for this reason it is denoted
    with a capital $P$.


    Figure 11.2\Points at parametric position $t=0.75$.


    ![](img/f83c01d271af8dca6b2025e3474f6599_266_1.png)


    Collecting many points $P(t)$ for various values of $t$ generates a curve, as
    shown in Figure 11.3. The more parameter values for $t$ that are sampled, the
    more points $P(t)$ are generated, and the smoother the resulting curve.


    Figure 11.3\Building a quadratic Bézier curve.


    The analytic definition for a quadratic Bézier curve can be derived. First, we
    note that an arbitrary point $p$ on the line segment $p_a-p_b$ connecting two
    points $p_a$ and $p_b$ can be represented in terms of the parameter $t$ as:


    ```

    $p(t) = tp_a + (1-t)p_b$

    ```


    Using this, we find the points $p_{01}$ and $p_{12}$ (points on $p_0-p_1$ and
    $p_1-p_2$ respectively) as follows:


    ```

    $p_{01}(t) = tp_1 + (1-t)p_0$

    $p_{12}(t) = tp_2 + (1-t)p_1$

    ```


    Similarly, a point on the connecting line segment between these points would be:


    ```

    $P(t) = tp_{12}(t) + (1-t)p_{01}(t)$

    ```'
