  md: 'version 3.0, to further support shadow mapping. When using this approach, it
    isn’t necessary to “copy” the Z-buffer into a texture, because the buffer already
    has a texture attached to it, and so the depth information is put into the texture
    by OpenGL automatically. This is the method we will use in our implementation.


    # 8.4.3 Shadow Mapping (PASS TWO) – Rendering the Scene with Shadows


    Much of pass two will resemble what we saw in Chapter 7. Namely, it is here that
    we render our complete scene and all of the items in it, along with the lighting,
    materials, and any textures adorning the objects in the scene. We also need to
    add the necessary code to determine, for each pixel, whether or not it is in shadow.


    An important feature of pass two is that it utilizes MVP matrix. One is the standard
    MVP matrix that transforms object coordinates into screen coordinates (seen in
    most of our previous examples). The other is the shadowMVP matrix that was generated
    in pass one for use in rendering from the light’s view—this will be used in pass
    two for looking up depth information from the shadow texture.


    A complication arises in pass two when we try to look up pixels in a texture map.
    The OpenGL camera utilizes a [-1,*] coordinate space, whereas texture maps utilize
    [0,1] space. A common solution is to build an additional matrix transform, typically
    called $B$, that converts (or “biases,” the name) from camera space to texture
    space. Deriving $B$ is fairly simple—a scale by ½ followed by a translate by ½.


    The $B$ matrix is as follows:


    ```

    B = \begin{bmatrix} 0.5 & 0 & 0 & 0.5 \ 0 & 0.5 & 0 & 0.5 \ 0 & 0 & 0.5 & 0.5
    \ 0 & 0 & 0 & 1 \end{bmatrix}

    ```


    $B$ is then concatenated onto the shadowMVP matrix for pass two, thus:


    shadowMVP2 = [B] [shadowMVP(pass1)]


    Assuming that we use the method whereby a shadow texture has attached to our custom
    framebuffer, OpenGL provides some relatively simple tools'
