    gl_Position = proj_matrix * spikePoint;

    setAttribValues(0); EmitPrimitive();

    ```


    ![](img/f83c01d271af8dca6b2025e3474f6599_312_0.png)


    The resulting output is shown in Figure 13.9. This rendering uses Phong shading
    with specular highlighting disabled—because we have not computed surface normals
    for the newly added primitives (specular highlights would appear noticeably unrealistic
    in the absence of sufficiently detailed normals). Of course, the result could
    be improved by calculating the normals for each of the newly created triangle
    primitives, and by incorporating shadow mapping (also not done here).


    **Figure 13.9**

    Geometry shader: primitive addition.


    Careful application of this technique can enable the simulation of spikes, thorns,
    hair, and other fine surface protrusions, as well as the reverse, such as indentations
    and craters ([DV14], [TR13], and [KS16]).'
