- img_proc: true
  md: 'The points P(u,v) comprising the Bézier surface are then generated by summing
    the product of each control point $p_{ij}$ and the $i^{th}$ and $j^{th}$ blending
    functions evaluated at parametric $u$ and $v$ respectively:


    ```

    P(u,v) = \sum_{i=0} \sum_{j=0} p_{ij} * B_i(u) * B_j(v)

    ```


    The set of generated points that comprise a Bézier surface is sometimes called
    a patch. The term "patch" can sometimes be confusing, as we will see later when
    we study tessellation shaders (useful for actually implementing Bézier surfaces).
    There, it is the grid of control points that is typically called a "patch".


    # 11.4 CUBIC BÉzier SURFACES


    Moving from quadratic to cubic surfaces requires utilizing a larger mesh—4x4 rather
    than 3x3. Figure 11.10 shows an example of 16-control-point mesh (in blue), and
    the corresponding curved surface (in red).


    ![](img/f83c01d271af8dca6b2025e3474f6599_272_0.png)


    Figure 11.10

    cubic Bézier control mesh and corresponding surface.


    As before, we can derive the formula for points P(u,v) on the surface by combining
    the associated blending functions for cubic Bézier curves:


    ```

    P(u,v) = \sum_{i=0}^3 \sum_{j=0}^3 p_{ij} * B_i(u) * B_j(v)

    ```


    where:


    ```

    B_0(u) = (1-u)^3

    B_1(u) = 3u - 6u^2 + 3u

    B_2(u) = -3u^3 + 3u^2

    B_3(u) = u^3

    B_0(v) = (1-v)^3

    B_1(v) = 3v - 6v^2 + 3v

    B_2(v) = -3v^3 + 3v^2

    B_3(v) = v^3

    ```


    Rendering Bézier surfaces can also be done with recursive subdivision, alternately
    splitting the surface in half along each dimension, as shown in Figure 11.11.'
  merge: -1
