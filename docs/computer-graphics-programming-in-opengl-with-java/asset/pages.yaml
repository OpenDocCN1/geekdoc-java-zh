    # SUPPLEMENTAL NOTES


    As mentioned in this chapter, when using Java buffers it is advisable to ensure
    that direct buffers are used. For example, it is tempting to use the Java FloatBuffer.wrap()
    function to put vertex data stored in an array into a buffer. However, wrap produces
    a *non-direct* buffer, in which the result is a wrapper for data that is still
    stored in an array⁴. One approach for copying the data into a direct buffer is
    to allocate a direct ByteBuffer, using ByteBuffer.asFloatBuffer() to view it as
    a FloatBuffer, and then use a loop with the put() command to copy the data one
    at a time. As described earlier, the JOGL.jog.common.nio.Buffers class makes it
    easier to populate direct buffers by providing convenience methods for loading
    array data into various types of buffers:


    ```

    newDirectByteBuffer(byte[])

    newDirectCharBuffer(char[])

    newDirectDoubleBuffer(double[])

    newDirectFloatBuffer(float[])

    newDirectIntBuffer(int[])

    newDirectLongBuffer(long[])

    newDirectShortBuffer(short[])

    ```


    Using the above JOGL methods for populating buffers with vertex data (that is,
    data intended to be used by JOGL applications) also ensures correct native byte


    > ⁴ Using non-direct buffers is actually allowable in JOGL. However, a non-direct
    buffer is passed to a JOGL method, JOGL will convert it to a direct buffer, which
    incurs a performance penalty.'
