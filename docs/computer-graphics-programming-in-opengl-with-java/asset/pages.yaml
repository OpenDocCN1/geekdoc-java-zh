  md: '# Chapter 6 · 3D Models 149


    Another limitation of our OBJ loader has to do with indexing. Observe in the previous
    descriptions that the “face” tag allows for the possibility of mix-and-matching
    vertex positions, texture coordinates, and normal vectors. For example, two different
    “face” rows may include indices which point to the same v entry, different v entries.
    Unfortunately, OpenGL’s indexing mechanism does not support this level of flexibility—index
    entries in OpenGL can only point to a particular vertex along with its attributes.
    This complicates an OBJ loader somewhat, as we cannot simply copy the references
    in the triangle face into an index array. Rather, using OpenGL indexing would
    require ensuring that entire combinations of v, vt, vn for a face entry have their
    own references in the index array. A simpler, albeit less efficient, alternative
    is to create a new vertex for every triangle face entry. We opt for this simpler
    approach here in interest of clarity, despite the space-saving advantage of using
    OpenGL indexing (especially when loading larger models).


    The Modelimporter includes a parseOBJ() function that reads in each line of an
    OBJ file one-by-one, handling separately the four cases v, vt, vn, and f. In each
    case, the subsequent nodes on line are extracted, by using substring() to skip
    the initial v, vt, vn, or character(s), and then using the iterator by the split()
    function to extract each subsequent parameter value, storing them in an ArrayList.
    As the face (f) entries are processed, the vertices are built with corresponding
    entries in parallel arrays for vertex positions, texture coordinates, and normal
    vectors.


    The ModelImporter class is embedded in the ImportedModel class, which simplifies
    loading and accessing the vertices of an OBJ file by putting the vertices into
    an array of Vertex3D objects. Recall that Vertex3D is defined in graphics3d, and
    that a Vertex3D object includes fields for position, texture coordinates, and
    normal vectors. The accessors in the ImportedModel class then make this array
    of Vertex3D objects available to the Java/JOGL application in the same manner
    as done in the Sphere and Torus classes.


    Following the Modelimporter and ImportedModel classes is an example sequence of
    calls for loading an OBJ file, and transferring the vertex information into a
    set of VBOs for subsequent rendering.


    Figure 6.16 shows a rendered model of the space shuttle, downloaded as an OBJ
    file from the NASA website [NA16], imported using the code from Program 6.3, and
    textured using the code from Program 5.1 with the associated NASA texture image
    file, with anisotropic filtering. This texture image is an example of the'
