  md: '# Chapter 5 · Texture Mapping 107


    Texture coordinates are most often 2D (OpenGL does support other dimensionalities
    but we won''t cover them in this chapter). It is assumed that the image is rectangular,
    with location (0,0) at the lower left and (1,1) at the upper right. Texture coordinates,
    then, should ideally have values in the range (0,1).


    Consider the example shown in Figure 5.2. The cube model, recall, is constructed
    of triangles. The four corners of one cube side are highlighted, the texture coordinates
    for each of the six vertices that specify this cube side are listed alongside
    the four corners, with the corners at the upper left and lower right each comprised
    of a pair of vertices. The texture image is also shown. Indexed by s and t have
    mapped portions of the image (the texels) onto the rasterized pixels of the front
    face of the model. Note that all of the intervening pixels between the vertices
    have been painted with the intersecting texels in the image. This is achieved
    because the texture coordinates are sent to the fragment shader in a vertex attribute,
    and are also interpolated just like the texture vertices.


    In this example, we purposely specified texture coordinates that result in an
    oddly-padded surface, for purposes of illustration. If you look closely, you also
    see that the image appears slightly stretched—that is because the aspect ratio
    of the texture image does not match the aspect ratio of the cube face relative
    to the given coordinates.


