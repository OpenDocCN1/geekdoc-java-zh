    # 6.1 PROCEDURAL MODELS – BUILDING A SPHERE


    Some types of objects, such as spheres, cones, and so forth, have mathematical
    definitions that lend themselves to algorithmic generation. Consider for example
    a circle of radius R—coordinates of points around its perimeter are well defined:


    ![](img/f83c01d271af8dca6b2025e3474f6599_146_0.png)


    We can systematically use our knowledge of the geometry of a circle to algorithmically
    build a sphere model. Our strategy is as follows:


    +   1. Select a *precision* representing a number of “horizontal slices” through
    the sphere. See the left side of Figure 6.2.

    2. Subdivide the circumference of each circular slice into some number of points.
    See the right side of Figure 6.2. More points and horizontal slices produces a
    more accurate and smoother model of the sphere.


    ![](img/f83c01d271af8dca6b2025e3474f6599_146_1.png)


    +   3. Group the vertices into triangles. One approach is to step through the
    vertices, building two triangles at each step. For example, as we move along the
    row of the five colored vertices on the sphere in Figure 6.3,'
  merge: -1
