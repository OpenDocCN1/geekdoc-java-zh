  md: '# Chapter 6 · 3D Models 147


    We have color-coded the important sections of the OBJ file for reference. The
    lines at the top beginning with “#” are comments placed by Blender, with our importer
    ignores. This is followed by a line beginning with “o” giving the name of the
    object. Our importer can ignore this as well. Later, there is a line beginning
    with “s”, that specifies that the faces shouldn''t be smoothed. Our code will
    also ignore lines starting with “s”.


    The first subset of lines in the OBJ file are those starting with “v”, colored
    blue. They specify the X, Y, and Z spatial coordinates of the five vertices of
    our pyramid model to the origin, from which this case is at the center of the
    pyramid.


    The values colored red (starting with “vt”) are the various texture coordinates.
    The reason that the list of texture coordinates is longer than the list of vertices
    is that some of the vertices participate in more than one triangle, and in those
    cases different texture coordinates might be used.


    The values colored green (starting with “vn”) are the various normal vectors.
    This list is often longer than the list of vertices (although not in this example),
    again because some of the vertices participate in more than one triangle, and
    in those cases different normal vectors might be used.


    The values colored purple (starting with “f”), near the bottom of the file, specify
    the triangles (i.e., “faces”). In this example, each face (triangle) has three
    elements, each with three values separated by “/ OBJ allows other formats as well.
    The values for each element are indexed into the lists of vertices, texture coordinates,
    and normal vectors, respectively. For the third face is:


    ```

    f 2/7/3 5/8/3 3/9/3

    ```


    This indicates that the 2nd, 5th, and 3rd vertices from the list of vertices (in
    blue) comprise a triangle (note that OBJ indices start at 1). The corresponding
    texture coordinates are the 7th, 8th, and 9th from the list of texture coordinates
    in the section red. All three vertices have the same normal vector, the 3rd in
    the list of names in the section green.


    Models in OBJ format are not required to have normal vectors, or even texture
    coordinates. If a model does not have texture coordinates or normals, the face
    values would specify only the vertex indices:


    ```

    f 2 5 3

    ```'
