  md: 'Texture cube maps are similar to 3D textures that we will study later, in that
    they are accessed using three texture coordinates (s,t,r)—rather than two. Another
    unique characteristic of OpenGL cube maps is that the images in them are oriented
    with texture coordinate (0,0,0) at the upper right (rather than the usual left)
    of the texture image; this is often a source of confusion.


    Whereas the method shown in Program 9 reads a single image for texture, the loadCubeMap()
    function in Program 9.2 reads in separate cube face images. The cube map is generated
    first as a JOGL Texture of type GL_TEXTURE_CUBE_MAP. It then reads the image files
    using the newTextureData() function in the JOGLTexture class, which results in
    six objects of type TextureData. Since the texture is specified as a cube map,
    that means that it has six sub-images. Each sub-image is associated with one of
    the six TextureData objects containing the image data, using the updateImage()
    function in the JOGL Texture class. The texture cube map object is then extracted
    from the JOGL texture using getToObject(). The completed OpenGL cube map is referenced
    by an int identifier. As was for shadow-mapping, artifacts along a border can
    be reduced by setting the texture wrap mode to “clamp to edge.” In this case,
    it can help reduce seams. This note is set for all texture coordinates: s, t,
    and r.


    The init() function now includes a call to enable GL_TEXTURE_CUBE_MAP_SEAMLESS,
    which tells OpenGL to blend edges of the cube to eliminate seams. In Display(),
    the cube''s vertices are sent down the pipeline as before, but by this time it
    is unnecessary to send the cube''s texture coordinates. As we will see, this is
    an OpenGL cube map usually uses the cube''s vertex positions as its texture coordinates.
    The view matrix is “flipped” on the Y and Z axis (with a scale function) to account
    for the reversed orientation described above. After depth testing, the cube is
    drawn. Depth testing is then re-enabled for the rest of the scene.


    The texture is accessed in the fragment shader with a special type of sampler
    called a samplerCube. In a cube map, the value returned from the sampler is the
    texel “seen” from the origin as viewed along the direction vector (s,t,r). As
    a result, we can easily use the incoming interpolated positions as the texture
    coordinates. In the vertex shader, we assign the cube vertex positions to the
    outgoing texture coordinate attribute, so that they be interpolated when they
    reach the fragment shader. Note also in the vertex shader that we convert the
    incoming view matrix to 3x3, and then back to 4x4. This “trick” effectively'
