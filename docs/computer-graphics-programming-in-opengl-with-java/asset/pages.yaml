    # ## 4.9 COMBATING “Z-FIGHTING” ARTIFACTS


    When rendering multiple objects, OpenGL uses the Z-buffer algorithm (earlier shown
    in Figure 2.14) for performing hidden surface removal. Ordin, which surfaces are
    visible and rendered to the scene, versus surfaces lie behind other objects and
    should not be rendered, by choosing a pixel''s color to be that of the corresponding
    fragment closest to the camera.


    However, there can be occasions when two surfaces in a scene overlap and lie in
    coincident planes, making it problematic for the Z-buffer algorithm to determine
    which of the two surfaces should be rendered (neither is “closest” to the camera).
    When this happens, floating point rounding errors can lead to portions of the
    rendered surface using the color of one of the objects, and other portions using
    the color of the other object. This artifact is known as Z-fighting or depth-fighting,
    because the effect is the result of rendered fragments “fighting” over mutually
    corresponding pixel entries in the Z-buffer. Figure 4.12 shows


    example of Z-fighting between two boxes with overlapping coincident (top) faces.


    Situations like this often occur when creating terrain or shadows. It is possible
    to predict Z-fighting in such instances, and a common way of correcting it in
    these cases is to move one object slightly, that the surfaces are no longer coplanar.
    We will see an example of this in Chapter 8.


    Z-fighting can also occur due to limited precision of the values in the depth
    buffer. For each pixel processed by the Z-buffer algorithm, the accuracy of its
    depth


