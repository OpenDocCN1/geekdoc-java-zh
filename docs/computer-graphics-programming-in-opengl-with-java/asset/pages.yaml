    $$\vec{V} \cdot \vec{W} = |\vec{V}| * |\vec{W}| * \cos(\theta)$


    $$\cos(\theta) = \frac{\vec{V} \cdot \vec{W}}{\|\vec{V}| * |\vec{W}|}$


    Therefore, if $\vec{V}$ and $\vec{W}$ are normalized (i.e., of unit length—recall
    the “^” notation for normalization), then:


    $$\cos(\theta) = \vec{V} \cdot \vec{W}$


    $$\theta = \arccos(\vec{V} \cdot \vec{W})$


    Interestingly, we will later see that it is $$\cos(\theta)$ that we need, rather
    than 0 itself. Both of the above derivations will be directly useful.


    The dot product also has a variety of other uses:


    +   - finding a vector''s magnitude:$\sqrt{\vec{V} \cdot \vec{V}}$$

    - two vectors are perpendicular, if $\vec{V} \cdot \vec{W} = 0$$

    - two vectors are parallel, if $\vec{V} \cdot \vec{W} = |\vec{V}| * |\vec{W}|$$\$

    - parallel but pointing in opposite directions: $\vec{V} \cdot \vec{W} = -|\vec{V}|
    * |\vec{W}|$$\$

    - angle between vectors lies in the range $[-90^{\circ}...+90^{\circ}]$: $\vec{V}
    \cdot \vec{W} > 0$$

    - minimum signed distance from point $P=(x,y,z)$ to plane $S=(a,b,c,d)$. First
    find unit vector to S:


    $$\hat{n} = \frac{a}{\sqrt{a^2+b^2+c^2}}, \frac{b}{\sqrt{a^2+b^2+c^2}}, \frac{c}{\sqrt{a^2+b^2+c^2}},$
    and shortest


    distance $D = \frac{d}{\sqrt{a^2+b^2+c^2}}$ from the origin to the plane.


    Then, the minimum signed distance from $P$ to $S$ is: $(\hat{n} \cdot P)+D$ and
    the sign of this distance determines on which side of the plane $S$ point $P$
    lies.'
