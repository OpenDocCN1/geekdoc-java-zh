  md: '# Chapter 14 — Other Techniques


    The wood rings in Figure 14.18 are a good start, but they don''t look very realistic—they
    are too perfect. To improve this, we use the noise map (more specifically, the
    turbulence) to perturb the distanceValue variable so that the rings have slight
    variations. The computation is modified as follows:


    ```

    double distanceValue = Math.sqrt(xValue * xValue + yValue)

    + turbPower * turbulence(i, j, k, maxZoom) / 256.0;

    ```


    Again, the variable turbPower adjusts how much turbulence is applied (setting
    it to 0.0 results in the unperturbed version shown in Figure 14.18), and maxZoom
    specifies the zoom level (typically 32). Figure 14.19 shows the resulting wood
    textures for turbPower values 0.05, 1.0, and 2.0 (left to right).


    We can now apply the 3D wood texture map to a model. The realism of the texture
    can be further enhanced by applying a rotation to the originalPosition vertices
    used for texture coordinates; this is because most items carved out of wood do
    not perfectly align with the orientation of the rings. To accomplish this, we
    send an additional rotation matrix to the shaders for rotating the texture coordinates.
    We also add Phong shading, with appropriate wood-color ADS values, The complete
    additions and changes for creating a “wood dolphin” are shown in Program 14.6.


    > Figure 14.18

    Creating rings for 3D wood texture.


