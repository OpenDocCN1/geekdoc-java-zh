  md: 'Employing LOD can dramatically reduce the load on the system. For example,
    when animated, the scene might be less likely to appear jerky or lag than could
    be the case without controlling LOD.


    Applying this simple LOD technique to the version that includes Phong shading
    (i.e., Program 12.4) is a bit tricky. This is because the changes in LOD-adjacent
    patch instances can in turn cause sudden changes to the associated normal vectors,
    causing popping artifacts in the lighting! As always, there are tradeoffs and
    compromises to consider when constructing a complex 3D scene.


    # SUPPLEMENTAL NOTES


    Combining tessellation with LOD is particularly useful in real-time virtual applications
    that require both complex detail for realism and frequent object movement and/or
    changes in camera position, such as in computer games. In this chapter we have
    illustrated the use of tessellation and LOD for real-time terrain generation,
    although it can also be applied in other areas such as displacement mapping for
    3D models (where tessellated vertices are added to the surface of a model and
    then moved so to add detail). It is also useful in Computed Aided Design applications.


    > Sellers et al. extends the LOD technique (shown in Program 12.5) further than
    we have presented, by eliminating vertices in patches that are behind the camera
    (they do this by setting their inner and outer layers to zero) [SW15]. This is
    an example of a culling technique, and it is a very useful one because of the
    load that instanced tessellation can still place on the system.


