  md: "# 324 Computer Graphics Programming in OpenGL with Java\n\n![](img/f83c01d271af8dca6b2025e3474f6599_340_0.png)\n\
    \nWe start building a procedural \"rings\" 3D texture map, similar to the \"checkerboard\"\
    \ in earlier in this chapter. We then use the noise map to perturb those rings,\
    \ inserting dark and light colors into the ring texture map. By adjusting the\
    \ number of rings, and the degree to which we perturb the rings, we can simulate\
    \ world with various types of grain. Shades of brown can be made by combining\
    \ similar amounts of red and green, with less blue. We then apply Phong shading\
    \ with a low level of \"shinniness\".\n\nWe can generate rings encircling the\
    \ Z-axis in our 3D texture map by modifying the fillDataArray() function, using\
    \ trigonometry to specify values for X and Y that are equidistant from the Z axis.\
    \ A sine wave to repeat this process cyclically, lowering the red and green components\
    \ equal by this sine wave, to produce the varying\n\nFigure 14.17\nDragon textured\
    \ with 3D marble noise maps\n\nshades of brown. The variable sineValue holds the\
    \ exact shade, which can be adjusted by slightly offsetting one or the other (in\
    \ this case increasing the red by 80, and by the 30). We can create (or more)\
    \ rings by adjusting the value of xyPeriod. The texture is shown in Figure 14.18.\n\
    \n```\nprivate void fillDataArray(byte data[]) {\n  double xyPeriod = 30.0;\n\
    \  for (int i=0; i<noiseWidth; i++) {\n    for (int j=0; j<noiseHeight; j++) {\n\
