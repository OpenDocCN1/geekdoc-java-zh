  md: '# 5.10 WRAPPING AND TILING


    So far we have assumed that texture coordinates all fall in the range (0,1). However,
    OpenGL actually supports texture coordinates of any value. There are several options
    for specifying what texture coordinates fall outside the range (0,1). The desired
    behavior is set using glTexParameteri(), and the options are as follows:


    ![](img/f83c01d271af8dca6b2025e3474f6599_137_0.png)


    Figure 5.13 Anisotropic filtering.


    +   - GL_REPEAT: The integer portion of the texture coordinates are ignored, generating
    a repeating or “tiling” pattern. This is the default behavior.


    +   - GL_MIRRORED_REPEAT: The integer portion is ignored, except that the coordinates
    are reversed when the integer portion is odd, so the repeating pattern alternates
    between normal and mirrored.


    +   - GL_CLAMP_TO_EDGE: Coordinates less than 0 and greater than 1 are set to
    0 and 1, respectively.


    +   - GL_CLAMP_TO_BORDER: Texels outside of (0,1) will be assigned some specified
    border.


    For example, consider a pyramid in which the texture coordinates have been defined
    in the range (0,4) rather than the range (0,1). The default behavior (GL_REPEAT),
    using the texture image shown previously in Figure 5.2, would result in the texturing
    four times across the surface (sometimes called “tiling”), as shown below in Figure
    5.14:


    ![](img/f83c01d271af8dca6b2025e3474f6599_137_1.png)


    Figure 5.14 Texture coordinate wrapping with GL_REPEAT.'
  merge: -1
