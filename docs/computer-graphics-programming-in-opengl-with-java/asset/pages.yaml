    # 3.5 VECTORS


    Vectors specify a magnitude and direction. They are not bound to a specific location;
    a vector can be “moved” without changing what it represents.


    There are various ways to note a vector, such as a line segment with an arrowhead
    at one end, or as a pair (magnitude, direction), or the difference between two
    points. In 3D graphics, vectors are frequently represented as a single point in
    space, where the vector is the distance and direction from the origin to that
    point. In Figure 3.6, vector V (shown in red) can be specified either as the difference
    between points P1 and P2, or as an equivalent distance from the origin to P3.
    In all of our applications, we specify V as simply (x,y,z), the same notation
    used to specify the point P3.


    ![](img/f83c01d271af8dca6b2025e3474f6599_60_0.png)


