  md: '# Chapter 14 · Other Techniques 335


    than 0.0—to avoid encountering the seam in the Z dimension of the noise map. Simple
    methods exist for removing the seams [AS04], if needed. Another issue is at the
    northern peak of the skydome where the spherical distortion causes a pincushion
    effect.


    The clouds we implemented in this chapter also fail to model some important aspects
    of real clouds, such as the way they scatter the sun’s light. Real clouds also
    tend to be more fluffy on the top and grayer at the bottom. Our clouds also don’t
    have a 3D “fluffy” look that many actual clouds have.


    Similarly, more comprehensive models exist for generating fog, such as the one
    described by Kilgard and Fernando [KF03].


    While perusing the OpenGL documentation, the reader might notice that GLSL includes
    some noise functions noise1(), noise2(), noise3(), and noise4(), that are described
    as taking an input and producing Gaussian-like stochastic output. We didn’t use
    these functions in this chapter because of as this writing, most vendors have
    not implemented them. For example, many NVIDIA cards return 0 for these functions,
    regardless of the input seed.


