    \ can be approximated by drawing vectors from each vertex to the next as they\
    \ are constructed (or loaded). Note that an approximation can lead to tangent\
    \ vectors that are not strictly perpendicular to the corresponding vertex normals.\
    \ Implementing normal mapping that works across a variety of models therefore\
    \ needs to take this possibility into account (our solution).\n\nThe vectors are\
    \ sent from a buffer (VBO) to a vertex attribute in the vertex shader, as is done\
    \ for the vertices, texture coordinates, and normals. The vertex shader then processes\
    \ them the same as is for normal vectors, by applying the inverse-transpose of\
    \ the MV matrix, and forwarding the results down the pipeline for interpolation\
    \ by the rasterizer and ultimately into the fragment shader. This last step converts\
    \ the normal and tangent vectors into camera space, after which we construct the\
    \ bitangent using the cross product.\n\nOnce we have the normal, tangent, and\
    \ bitangent vectors in camera space, we can use them to construct a matrix (called\
    \ the \"TBN\", after its components) that transform the normals retrieved from\
    \ the normal map into their corresponding orientation in camera space relative\
    \ to the surface of the object.\n\nIn the fragment shader, the computation of\
    \ the new normal is done in the calcNew() function. The computation in the third\
    \ line of the function (the one containing dot(tangent, normal)) ensures that\
    \ the tangent vector is perpendicular to the normal vector. A cross product between\
    \ the new tangent and the normal produces the bitangent."
