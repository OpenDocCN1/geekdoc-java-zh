    # 9.2 SKYDOMES


    Another way of building a horizon effect is to use a *skydome*. The basic idea
    is the same as for a skybox, except that instead of using a textured cube, we
    use a textured *sphere* (or half sphere). As done for the skybox, we render the
    skydome first (with depth testing), and keep the camera positioned at the center
    of the skydome. The skydome texture in Figure 9.5 was made using Terragen [TE16].


    Skydomes have some advantages over skyboxes. For example, they are less susceptible
    to distortion and seams (although spherical distortion at the poles must be accounted
    for in the texture image). One disadvantage of a skydome is that a sphere or dome
    is a more complex model than a cube, with many more'
