  md: '# Chapter 2 JOGL and the OpenGL Graphics Pipeline 13


    Before any of this can happen, the Java/JOGL application must compile and link
    appropriate GLSL vertex and fragment shaders, and load them into the pipeline.
    We will see the commands for doing this shortly.


    The application is also responsible for telling OpenGL to construct triangles.
    We do this by using JOGL to call the following OpenGL function:


    ```

    glDrawArrays(GLenum mode, GLint first, GLsize count);

    ```


    The mode is the type of primitive—for triangles we use GL_TRIANGLES. The parameter
    "first" indicates which vertex to start with (generally vertex number 0, the first
    one), and count counts the total number of vertices to be drawn.


    When glDrawArrays() is called, the GLSL code in the pipeline starts executing.
    Let''s add some GLSL code to that pipeline.


    Regardless of where they originate, all of the vertices pass through the vertex
    shader. So they do one-by-one; that is, the shader is executed once per vertex.
    For a large complex model with a lot of vertices, the vertex shader may execute
    hundreds, thousands, or millions of times, often in parallel.


    Let''s write a simple program with one vertex, hardcoded in vertex shader. That''s
    not enough to draw a triangle, but it is enough to draw a point. For it to display,
    we also need to provide a fragment shader. For simplicity we will declare the
    two shader programs as arrays of strings.


