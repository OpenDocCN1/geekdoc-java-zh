  md: '# 4.7 RENDERING MULTIPLE DIFFERENT MODELS IN A SCENE


    To render more than one model in a single scene, a simple approach is to use a
    separate buffer for each model. Each model will need its own model matrix, and
    thus a new model-view matrix will be generated for each model that we render.
    We will also need to separate calls to glDrawArrays() for each model. There are
    changes both in init() and in display().


    Another consideration is whether or not we will need different shaders—or a different
    rendering program—for each of the objects we wish to draw. As it turns out, in
    many cases we can use the same shaders (and thus the same rendering program) for
    the various objects we are drawing. We usually only need to employ different rendering
    programs for the various objects if they are built of different primitives (such
    as lines instead of triangles), or if there are complex lighting or other effects
    involved. For now, that isn''t the case, so we can use the vertex and fragment
    shaders, and just modify our Java/JOGL application to send each model down the
    pipeline when display() is called.


    Let''s proceed by adding a simple pyramid, so our scene includes both a single
    cube and a pyramid. The code is shown in Program 4.3. A few of the key details
    are highlighted, such as where we specify one or the other buffer, and where we
    specify the number of vertices contained in the model. Note that the pyramid is
    comprised of 6 triangles—four on the sides and two on the bottom, totaling 6×3=18
    vertices.


    The resulting scene, containing both the cube and the pyramid, is shown in Figure
    4.10.


    ![](img/f83c01d271af8dca6b2025e3474f6599_101_0.png)


    Figure 4.10

    3D cube and pyramid.'
