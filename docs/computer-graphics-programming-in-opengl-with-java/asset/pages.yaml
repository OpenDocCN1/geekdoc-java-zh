    3D graphics programming, and provide the reader with a sufficiently deep understanding\n\
    for further study. If along the way this text helps to expand awareness of JOGL\
    \ and other\nJogAmp technologies, that would be nice too.\n\n# Intended Audience\n\
    \nThis book is targeted at students of computer science. This could mean undergraduates\
    \ pur-\nsuing a BS, but it could also mean anyone who studies computer science.\
    \ As such, we\narere assuming that the reader has at least a solid background\
    \ in object-oriented programming,\nat the level of someone who is, say, a computer\
    \ science major at the junior or senior level.\n\nThere are also specific things\
    \ that we use in this book, but that we don't cover\because we assume the reader\
    \ already has sufficient background. In particular:\n\n+   - Java and its Abstract\
    \ Window Toolkit (AWT) or Swing library, especially for\nGUI-building\n- Java\
    \ configuration details, such as manipulating the CLSPATH\n- event-driven programming\n\
    - basic matrix algebra and trigonometry\n- awareness of color models, such as\
    \ RGB, RGBA, etc.\n\n# How to Use This Book\n\nThis book is designed to be read\
    \ from front to back. That is, material in later chapters\nfrequently relies on\
    \ information learned in earlier chapters. It probably won't work to\njump back\
    \ and forth in the chapters; rather, work your forwards towards the material.\n\
    \nThis is also intended mostly as a practical, hands-on guide. While there is\
    \ plenty of\ntheoretical material, the reader should treat this as a sort of \"\
    workbook,\" in\nwhich you learn basics by actively programming them yourself.\
    \ We have provided\ncode for all of the examples, but to really learn the concepts\
    \ you will want to play\nwith those examples—extend to build your own 3D scenes.\n\
    \nAt the end of each chapter are a few problems to solve. Some are very simple,\
