    # 4.11 BACK-FACE CULLING


    As the complexity of our 3D scenes grows, we will become increasingly concerned
    with performance. One simple and effective way of improving rendering efficiency
    is to take advantage of OpenGL''s ability to do back-face culling.


    When a 3D model is entirely “closed,” meaning the interior is never visible (such
    as for the cube and for the pyramid), it turns out that those portions of the
    outer surface that are angled away from the viewer will be obscured by some other
    portion of the same model. That is, triangles that face away from the viewer cannot
    possibly be seen (they would be overwritten by hidden surface removal), and there
    is no reason to rasterize or render them.


    We can ask OpenGL to identify and “cull” (not render) back-facing triangles with
    the command glEnable(GL_CULL_FACE). We can also disable face culling with glDisable(GL_CULL_FACE).
    By default, face culling is disabled, if you want OpenGL to cull back-facing triangles,
    you must enable it.


    When face culling is enabled, default triangles are rendered only if they are
    front-facing. Also by default a triangle is considered front-facing if its three
    vertices progress in a counter-clockwise direction (based on the order that they
    were defined in the buffer) as viewed from the OpenGL camera. Those whose vertices
    progress in a clockwise direction (as viewed from the OpenGL camera) are back-facing,
    and are not rendered. This counter-clockwise definition of “front-facing” is called
    the winding order, and can be explicitly explicitly using the function glFrontFace(GL_CCW)
    for counter-clockwise (the default), or glFrontFace(GL_CW) for clockwise. Similarly,
    whether it is the front-facing or the back-facing triangles that are rendered
    can also be explicitly selected. Actually, for this purpose we specify which ones
    are not to be rendered—that is, which ones are “culled.” We can specify that the
    back-facing triangles are culled (although it would be unnecessary because it
    is the default) by calling glullFace(GL_BACK).'
