    \ = dot(clip_plane.xyz, vertPos) - clip_plane.w;\n}\n```\n\n# 14.4 3D Textures\n\
    \nWhere 2D textures contain image data indexed by two variables, 3D textures contain\
    \ the same type of image data, but in a 3D structure that is indexed by three\
    \ variables. The first two dimensions still represent width and height in the\
    \ texture map; the third dimension represents depth.\n\nBecause the data in a\
    \ 3D texture is stored in a similar manner as for 2D textures, it is tempting\
    \ to think of a 3D texture as a sort of 3D \"image.\". However, we generally don't\
    \ refer to 3D texture source data as a 3D image, because there are no commonly\
    \ used image formats for this sort of structure (i.e., there is nothing akin to\
    \ a 3D JPEG, at least one that is truly 3-dimensional). Instead, we suggest thinking\
    \ of the 3D texture as a sort of substance into which we submerge (\"dip\") the\
    \ object being textured, resulting in the object's surface points obtaining their\
    \ colors from the corresponding locations in the texture. Alternatively, it can\
    \ be useful to imagine that the object is being \"carved\" out of the 3D texture\
    \ \"cube,\" much like a sculptor carves a figure out of a single block of marble.\n\
    \nOpenGL has support for 3D texture objects. In order to use them, we need to\
    \ learn how to build the 3D texture, and how to use it to texture an object."
