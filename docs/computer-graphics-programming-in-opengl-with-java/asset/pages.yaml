    light1Color = (ambLight1 * ambMaterial) + (diffLight1 * diffMaterial) + specLight1

    light2Color = (ambLight2 * ambMaterial) + (diffLight2 * diffMaterial) + specLight2

    fragColor = 0.25 * textureColor

