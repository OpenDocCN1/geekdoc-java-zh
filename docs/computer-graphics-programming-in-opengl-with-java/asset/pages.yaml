  md: 'back-face culling while drawing the pyramid. However, this often produces other
    artifacts, as shown in Figure 14.5 (on the left). The problem with simply disabling
    back-face culling is that the effects of blending depend on the order that surfaces
    are rendered (because that determines the source and destination pixels), and
    we don''t always control over the rendering order. It is advantageous to render
    opaque objects first, as well as objects that are in the back (such as the torus)
    before any transparent objects. This also holds true for the surfaces of the pyramid,
    and in this case the reason that the two triangles comprising the base of the
    pyramid appear different is that one of them rendered before the front of the
    pyramid, and one was rendered after. Artifacts such as these are called “ordering”
    artifacts, and can manifest in transparent models because we cannot always predict
    the order that their triangles will rendered.


    We can solve the problem in our pyramid by rendering the front and back faces
    separately, ourselves, starting with the back faces. Program 14.2 shows the code
    for this. We specify the alpha value for the pyramid by passing it to the shader
    program in a uniform variable, then apply it in the fragment shader by substituting
    the alpha into the computed output.


    Note that for lighting to work properly, we must flip the normal vector when rendering
    the back faces. We accomplish this by sending a flag to the vertex shader, where
    then we flip the normal vector.


    # Program 14.2 Two-Pass Blending for Transparency


    JOGL/Java application - in display() for rendering pyramid:


    ```

    gl.Enable(GL_CULL_FACE);


    gl.Enable(GL_BLEND);                               // configure blend settings

    gl.glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);

    gl.glBlendEquation(GL_FUNC, ADD);


    gl.glCullFace(GL_FRONT);                               // render pyramid back
    faces first

    gl.glProgramUniform1f(rendering_program2, alpha_location, 0.3); // back faces
    set to very transparent

    gl.glProgramUniform1f(rendering_program2, flip_location, -1.0); // flip normals
    on back faces

    gl.glDrawArrays(GL_TRIANGLES, 0, pyramid.getNumVertices());

    ```'
