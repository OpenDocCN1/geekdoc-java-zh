  md: '# 14.3 USER-DEFINED CLIPPING PLANES


    OpenGL includes the capability to specify clipping planes beyond the view frustum.
    One use for a user-defined clipping plane is to slice a model. This makes it possible
    to create complex shapes by starting with a simple model, and slicing sections
    off it.


    A clipping plane is defined according to the standard mathematical definition
    of a plane:


    ```

    ax + by + cz + d = 0

    ```


    where a, b, c, and d are parameters defining a particular plane in 3D space with
    X, Y, and Z axes. The parameters represent a vector (a,b,c) normal to the plane,
    and a distance d from the origin to the plane. Such a plane can be specified in
    the vertex shader using vec4,


    ```

    vec4 clip_plane = vec4(0.0, 0.0, -1.0, 0.2);

    ```


    This would correspond to the plane:


    ```

    (0.0) x + (0.0) y + (-1.0) z + 0.2 = 0

    ```


    The clipping can then be achieved, in the vertex shader, by using the built-in
    GLSL variable gl_ClipDistance[], as in the following example:


    ```

    gl_ClipDistance[0] = dot(clip_plane.xyz, vertPos) + clip_plane.w;

    ```


    In this example, vertPos refers to the vertex position from the vertex shader
    in a vertex attribute (such as in a VBO) and clip_plane was defined above. We
    compute the signed distance from the clipping plane to the incoming vertex (which
    is either zero if the vertex is on the plane, or negative or positive depending
    on which side of the plane lies). The script on the gl_ClipDistance array enables
    multiple clipping distances (i.e., multiple planes) to be defined. The maximum
    number of clipping planes that can be defined depends on the graphics card''s
    OpenGL implementation.


    User-defined clipping must be enabled in the Java/JGL application. There are built-in
    OpenGL identifiers GL_CLIP_DISTANCE0, GL_CLIP_DISTANCE1, and so on, corresponding
    to each gl_ClipDistance[] array element. The 0th user-defined clipping plane can
    be enabled, for example, as follows:


    ```

    glEnable(GL_CLIP_DISTANCE0);

    ```'
