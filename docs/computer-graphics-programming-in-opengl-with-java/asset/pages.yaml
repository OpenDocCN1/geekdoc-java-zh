    # UNIFORM VARIABLES


    Rendering a scene so that it appears 3D requires appropriate transformation matrices,
    such as those described in Chapter 3, and applying them to each of the models’
    vertices. It is most efficient to apply the required matrix operations in the
    vertex shader, and it is custom to send these matrices from the Java/JOGL application
    to the shader in a uniform variable.


    Uniform variables are declared in a shader using the “uniform” keyword. The following
    example, declaring variables to hold model-view and projection matrices, will
    be suitable for our cube program:


    ```

    uniform mat4 mv_matrix;

    uniform mat4 proj_matrix;

    ```


    The keyword “mat4” indicates that these are 4×4 matrices. Here we have named the
    variables mv_matrix to hold the model-view matrix, and proj_matrix to hold the
    projection matrix. Since 3D transformations are 4×4, mat4 is a commonly used datatype
    in GLSL shader uniforms.'
