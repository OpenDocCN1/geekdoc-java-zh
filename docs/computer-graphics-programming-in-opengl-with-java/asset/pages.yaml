  md: 'Trilinear filtering is usually preferred, lower levels of blending often produce
    artifacts, such as visible separations between mipmap levels. Figure 5.12 shows
    a close-up of the checkerboard upmapping with only linear filtering enabled. Note
    the circled artifacts, where the vertical lines suddenly change from thick to
    thin at a mipmap boundary. By contrast, the example in Figure 5.9 used trilinear
    filtering.


    ![](img/f83c01d271af8dca6b2025e3474f6599_135_0.png)


    Figure 5.12

    Linear filtering artifacts.


    Mipmapping is richly supported in OpenGL. There are mechanisms provided for building
    your mipmap levels, or having OpenGL build them for you. In most cases, the mipmaps
    built automatically by OpenGL are sufficient. The following lines of code added
    to Program 5.1 in init(), immediately after the loadTexture() and getTexture()
    function calls, cause OpenGL to generate mipmaps:


    ```

    glBindTexture(GL_TEXTURE_2D, brickTexture);

    Parameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);

    glGenerateMipmap(GL_TEXTURE_2D);

    ```


    The brick texture is made with the glBindTexture() call, and then the glTexParameteri()
    function enables one of the minification factors listed above, such as GL_LINEAR_MIPMAP_LINEAR
    shown in the above call, which enables trilinear filtering.


    Once the mipmap is built, the filtering option can be changed (although this is
    rarely necessary) by calling glTexParameteri() again, as in the display function.
    Mipmapping can be disabled by selecting GL_NEAREST or GL_LINEAR.


    For critical applications, it is possible to build the mipmaps yourself, using
    whatever is your preferred image editing software. Then you can mipmap levels
    when creating the texture object by repeatedly calling glTexImage2D() function,
    or JOGL''s updateSubImage() function, for each mipmap level. This approach is
    outside the scope of this book.'
