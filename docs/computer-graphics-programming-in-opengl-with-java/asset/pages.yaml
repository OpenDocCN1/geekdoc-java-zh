    # 12.4 CONTROLLING LEVEL OF DETAIL (LOD)


    Using instancing to generate millions of vertices in real-time, in Program 12.4,
    is likely to place a load on a well-equipped modern computer. Fortunately, the
    strategy of dividing the terrain into separate patches, as we have done to increase
    the number of generated grid vertices, also affords us a nice mechanism for reducing
    that load.


    Of millions of vertices being generated, many of them are not necessary. Vertices
    in patches that are close to the camera are important because we expect to discern
    detail in nearby objects. However, the further patches are from the camera, the
    less likely there will be enough pixels in the rasterization to warrant the number
    of vertices we are generating!


    Changing the number of vertices in a patch based on the distance from the camera
    is a technique called level of detail, or LOD. Sellers et al. describe a way of
    controlling LOD in instance tessellation [SW15], by modifying the control shader.
    Program 12.5 shows a simplified version of Sellers'' approach. The strategy is
    to use the patch''s perceived size to determine the values of its tessellation
    levels.'
