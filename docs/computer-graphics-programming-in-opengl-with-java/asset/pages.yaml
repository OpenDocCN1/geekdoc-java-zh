  md: '154 Computer Graphics Programming in OpenGL with Java


    The topic of 3D modeling is itself a rich field of study. Our coverage in this
    chapter has been just a rudimentary introduction, with emphasis on its relationship
    to OpenGL. Many universities offer courses in 3D modeling, and readers interested
    in learning more about it are encouraged to consult some of the popular resources
    that offer greater detail (e.g., [BL16], [C13], [V12]).


    We reiterate that the OBJ importer we presented in this chapter is limited, and
    can only handle a subset of the features supported by the OBJ format. Although
    sufficient for our needs, it will fail on some OBJ files. In those cases it would
    be necessary to load the model into Blender (or Maya, etc.), and re-export it
    as an OBJ file that complies with the importer’s limitations described earlier
    in this chapter.


