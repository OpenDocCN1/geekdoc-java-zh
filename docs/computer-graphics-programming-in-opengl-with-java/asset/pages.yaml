- img_proc: true
  md: 'To make the tiles'' appearance alternate between normal and mirrored, we can
    specify the following:


    ```

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_MIRRORED_REPEAT);

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_MIRRORED_REPEAT);

    ```


    Specifying values less than 0 and greater than 1 be set to 0 and 1 respectively,
    can be done by replacing GL_MIRRORED_REPEAT with GL_CLAMP_TO_EDGE.


    Specifying values less than 0 and greater than 1 result in a “border” color can
    be done as follows:


    ```

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_BORDER);

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_BORDER);

    float[ ]redColor = new float[]{1.0f, 0.0f, 0.0f, 1.0f};

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_BORDER_COLOR, redColor, 0);

    ```


    The effect of each of these options (mirrored repeat, clamp to edge, and clamp
    (left to right) with texture coordinates ranging from -1 to +2, are shown respectively
    in Figure 5.15.


    ![](img/f83c01d271af8dca6b2025e3474f6599_138_0.png)


    **Figure 5.15**

    Textured pyramid with various wrapping options.


    In the center example (clamp-to-edge), the pixels at the edges of the texture
    image are replicated outward. Note that as a side effect, the lower-left and lower-right
    regions of the pyramid faces obtain their color from the lower-left and lower-right
    pixels of the texture image, respectively.'
