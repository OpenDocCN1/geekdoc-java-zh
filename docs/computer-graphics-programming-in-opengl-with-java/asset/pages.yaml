    OpenGL (Open Graphics Library) is a multi-platform 2D and 3D graphics API that
    incorporates both hardware and software. Using OpenGL requires a graphics card
    (GPU) that supports a sufficiently up-to-date version of OpenGL (as described
    in Chapter 1).


    On the hardware side, OpenGL provides a multi-stage graphics pipeline that is
    partially programmable using a language called GLSL (OpenGL Shading Language).


    On the software side, OpenGL’s API is written in C, and thus the calls are directly
    compatible with C and C++. However, stable bindings (or “wrappers”) are available
    for more than a dozen other popular languages (Java, Perl, Python, Visual Delhi,
    Haskell, Lisp, Ruby, etc.) with virtually equivalent performance. This textbook
    uses the Java wrapper JOGL (Java OpenGL). When using JOGL, the programmer writes
    a Java program that runs on the CPU (more specifically, on the Java Virtual Machine,
    or JVM) and includes JOGL (and thus, OpenGL) calls. We will refer to a Java program
    that contains JOGL calls as a Java/JOGL application. One important task of a Java/JOGL
    application is to install the programmer’s GLSL code onto the GPU.'
