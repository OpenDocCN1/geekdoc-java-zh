  md: '# About the Authors


    **Dr. V. Scott Gordon** has been a professor in the California State University
    system over twenty years, and currently teaches graphics and game engineering
    courses at CSU Sacramento. He has authored or coauthored over thirty publications
    in a variety of areas including video and strategy game programming, artificial
    intelligence, neural networks, software engineering, and computer science education.
    Dr. Gordon obtained his PhD at Colorado State University. He is also a jazz drummer
    and a competitive tennis player.


    **Dr. John Cleenger** has over forty years of experience teaching a wide variety
    of courses including advanced graphics, game architecture, operating systems,
    VLSI chip design, system simulation, and other topics. He is the developer of
    several software frameworks and tools for teaching graphics and game architecture,
    including the graphicslib3D library used in this textbook. He is the technical
    director of the ACM International Collegiate Programming Contest, and oversees
    the ongoing development of PC^2, the most widely used programming contest support
    system in the world. Dr. Cleenger obtained his PhD at the University of California,
    Davis. He is also a performing jazz musician, and spends summer vacations in his
    mountain cabin.


