  md: '# 6.2.2 Indexing in OpenGL


    In both sphere and torus models, we generated an array of indexes referencing
    the vertex array. In the case of the sphere, we used the list of indices to build
    a complete set of individual vertices and loaded them into a VBO as we did for
    examples in earlier chapters. Instantiating the torus and loading its vertices,
    normals, etc: buffers could be done in a similar manner as was done in Program
    6.1, but instead we will use OpenGL''s indexing.


    When using OpenGL indexing, we also load the indices themselves into a VBO. We
    generate one additional VBO for holding the indices. Since each index value is
    a simple integer, we first copy the index array into a Java IntBuffer, and then
    use glBufferData() to load the IntBuffer into the added VBO, specifying that the
    VBO is of type GL_ELEMENT_ARRAY_BUFFER(this that the VBO contains indices). The
    code that this could be added to setupVertices


    ```

    int indices = myTorus.getIndices(); // the torus index accessor returns the indices
    as an int array

    glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, vbo[3]); // vbo #3 is the additional added
    vbo

    IntBuffer idxBuf = Buffers.newDirectBuffer(indices);

    glBufferData(GL_ELEMENT_ARRAY_BUFFER, idxBuf.limit(*4), idxBuf, GL_STATIC_DRAW);

    ```


    In the display() method, we replace the glDrawArrays() call with a call to glDrawElements(),
    which tells OpenGL to use the index VBO for looking up the vertices to be drawn.
    We also enable the VBO that contains the indices, and by glBindBuffer(), specifying
    which VBO contains the indices, and that it is a GL_ELEMENT_ARRAY_BUFFER. The
    code is as follows:


    ```

    int numIndices = myTorus.getIndices().length;

    glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, vbo[3]);

    glDrawElements(GL_TRIANGLES, numIndices, GL_UNSIGNED_INT, 0);

    ```


