  md: "# 14.5 NOISE\n\nMany natural phenomena can be simulated using randomness, or\
    \ noise. One common technique, Perlin Noise, is named after Ken Perlin, who in\
    \ 1997 received an Academy Award! for developing a practical way to generate and\
    \ use 2D and 3D noise. The method described here is based on Perlin's.\n\n![](img/f83c01d271af8dca6b2025e3474f6599_332_0.png)\n\
    \nFigure 14.11\nDragon with 3d checkerboard texture.\n\nThere are many applications\
    \ of noise in graphics scenes. A few examples are clouds, terrain, wood grain,\
    \ minerals (such as veins in marble), and random movements. In this section, we\
    \ focus on generating 3D textures containing noise, and then subsequent sections\
    \ use noise to generate complex materials as marble and wood, and to simulate\
    \ cloud textures for use with a cube map or skydome. Spatial data (e.g., 2D or\
    \ 3D) that contains noise is sometimes called a noise map.\n\nWe start by constructing\
    \ a 3D texture map out of random data. This can be done using the functions shown\
    \ in the previous section, with a few modifications. First, we replace the generate3Dpattern()\
    \ function from Program 14 with the simpler generateNoise():\n\n```\ndouble[][][]\
    \ noise = new double[noiseWidth][noiseHeight][noiseDepth];\nRandom random = new\
    \ Random();\n```\n\n```\nvoid generateNoise()\n{ for (int x=0; x<noiseWidth; x++)\n\
    \  { for (int y=0; y<noiseHeight; y++)\n    { for (int z=0; z<noiseDepth; z++)\n\
    \      noise[x][y][z] = random.nextDouble(); // returns a double in the range\
    \ (0...1)\n    }\n  }\n}\n```\n\n1 The Technical Achievement Award, given by the\
    \ Academy of Motion Picture Arts and Sciences."
