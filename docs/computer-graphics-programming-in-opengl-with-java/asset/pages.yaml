- img_proc: true
  md: 'Each subdivision produces four new control point meshes, each containing 16
    points which define one quadrant of the surface.


    ![](img/f83c01d271af8dca6b2025e3474f6599_273_0.png)


    Figure 11.11

    Recursive subdivision for Bézier surfaces.


    Similar methods exist for rendering Bézier surfaces as we saw previously for Bézier
    curves, such as using recursive subdivision [AS14]. When rendering Bézier curves,
    we stopped subdividing when the curve was “straight enough.” For Bézier surfaces,
    we stop recursing when the surface is “flat enough.” One way of doing this is
    to ensure that all the recursively generated points in a sub-quadrant control
    mesh are within some small allowable distance from a plane defined by the four
    corner points of this mesh. The distance d between a point (x,y,z) and a plane
    (A,B,C,D) is:


    ```

    d = abs(Ax + By + Cz + D) / sqrt(A^2 + B^2 + C^2)

    ```'
