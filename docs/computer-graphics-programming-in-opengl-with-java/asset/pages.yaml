  md: '# Chapter 10 · Enhancing Surface Detail


    The usefulness of altering vertex locations depends on the model being altered.
    Vertex manipulation is easily done in the vertex shader, and when there is a high
    level of detail in the model vertices (such as in a sphere with sufficiently high
    precision), this approach can work well. However, when the underlying number of
    vertices is small (such as the corners of a cube), rendering the object''s surface
    relies on vertex interpolation in the rasterizer to fill the detail. When there
    are very few vertices available in the vertex shader to perturb, the heights of
    many pixels would interpolated rather than retrieved from the height map, leading
    to poor surface detail. Vertex manipulation in the fragment shader is, of course,
    impossible because then the vertices have been rasterized into pixel locations.


    ![](img/f83c01d271af8dca6b2025e3474f6599_259_0.png)


    Figure 10.12

    Height map examples.


    ![](img/f83c01d271af8dca6b2025e3474f6599_259_1.png)


    Program 10.4 shows a vertex shader that moves the vertices “outwards” (i.e., in
    the direction of the surface normal), by multiplying the vertex normal by the
    value retrieved from the height map and then adding that product to the vertex
    position.


    Figure 10.13

    Height map interpretation.


