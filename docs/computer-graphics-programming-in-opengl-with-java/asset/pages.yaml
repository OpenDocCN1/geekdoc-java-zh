  md: '# 138 Computer Graphics Programming in OpenGL with Java


    ![](img/f83c01d271af8dca6b2025e3474f6599_154_0.png)


    vector tangent to the surface of the torus (called the tangent vector) is also
    generated for each vertex.


    Vertices for additional torus rings are formed by rotating the original ring around
    the Y axis. Tangent and normal vectors for each resulting vertex are computed
    by rotating the tangent and normal vectors of the original ring around the Y axis.
    After the vertices are created, they are traversed from ring to ring, and for
    each vertex two triangles are generated. The generation of six index tables doubling
    the two triangles is done in a similar manner as we did for the sphere.


    Our strategy for choosing texture coordinates so that the S axis of the texture
    image wraps halfway along the horizontal perimeter of the torus, and then repeats
    for the other half. This can be done by using the tiling capability in OpenGL
    textures previously described in Chapter 5. As we rotate around the Y axis generating
    the rings, we specify a variable ring that starts at 1 and increases up to the
    specified precision (again dubbed "prec"). We set the value of S texture coordinate
    to 2.0*ring/prec, causing S to range between 0 and 2. Recalling the default behavior
    for textures when a coordinate exceeds 1 GL_REPEAT, the result is that the texture
    stretches halfway around the torus, and is repeated on the second half. The motivation
    for this approach is to avoid the texture image appear over "stretched" horizontally.


    Building a torus class in Java/JGL could be done in a virtually ideal manner for
    the Sphere class. However, we have the opportunity to take advantage of the indices
    that we created while building the torus using OpenGL''s support for vertex indexing
    (we could also done this for the sphere, but we didn''t). For very large models
    with thousands of vertices, using OpenGL indexing can result in improved performance,
    and so we will describe how to do that next.'
