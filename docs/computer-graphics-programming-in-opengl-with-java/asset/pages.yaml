    Shadow acne is caused by rounding errors during depth testing. The texture coordinates
    computed when looking up the depth in a shadow texture doesn''t exactly match
    the actual coordinates. Thus, the lookup may return the depth for a neighboring
    pixel, rather than the one being rendered. If the distance to the neighboring
    pixel is further, then our pixel will appear to be in shadow even if it isn''t.


    Shadow acne can also be caused by differences in precision between the texture
    map and the depth computation. This too can lead to rounding errors and subsequent
    incorrect assessment of whether or not a pixel is in shadow.


    Fortunately, fixing shadow acne is fairly easy. Since shadow typically occurs
    on surfaces that are not in shadow, a simple trick is to move every pixel slightly
    closer to the light during pass one, and then move them back to their normal positions
    for pass two. This is usually sufficient to compensate for either'
