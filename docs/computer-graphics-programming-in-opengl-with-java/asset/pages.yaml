  md: 'It is important to understand exactly how these two mechanisms work, so as
    to use the appropriate method for each item we are sending through.

    Let''s start by rendering a simple cube.


    # 4.1 BUFFERS & VERTEX ATTRIBUTES


    For an object to be drawn, its vertices must be sent to the vertex shader. Vertices
    are usually sent by putting them in a buffer on the Java side, and associating
    that buffer with a vertex attribute declared in the shader. There are several
    steps to accomplish this, of which only needs to be done once, and of which—if
    the scene is animated—must be done at every frame:


    Done once – typically in init():


    +   1. create a buffer

    2. copy the vertices into the buffer


    Done at frame – typically in display():


    +   1. enable the buffer containing the vertices

    2. associate the buffer with a vertex attribute

    3. enable the vertex attribute

    4. use glDrawArrays(...) to draw the object


    Buffers are typically created all at the start of the program, either in init()
    or in a function called init(). In OpenGL, a buffer is contained in a Vertex Object,
    or VBO, which is declared and instantiated in the Java/JGL application. A scene
    may require many VBOs, so it is customary to generate and fill all of them in,
    so that they are available whenever your program needs to draw one or more of
    them.


    A buffer interacts with a vertex attribute in a specific way. When glDrawArrays()
    is executed, the data in the buffer starts flowing, sequentially from the beginning
    of the buffer, through the vertex shader. As described in Chapter 2, the vertex
    shader executes once per vertex. In a 3D space requires three values, so an appropriate
    vertex attribute to receive these three values would be of type vec3. Then, for
    each three values in the buffer, the shader is invoked, as illustrated in Figure
    4.1.'
