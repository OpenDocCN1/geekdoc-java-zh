    \ faces and clothing on characters, or on skins such as the dolphin in Figure\
    \ 5.1.\n\nImages are typically stored in image files, as .jpg, .png, .gif, or\
    \ .tiff. In order to make a texture image available to shaders in the OpenGL pipeline,\
    \ we need to extract the colors from the image and put them into an OpenGL texture\
    \ object (a built-in OpenGL structure for holding a texture image).\n\nJava has\
    \ some useful image file tools in the image and awt packages that can be used\
    \ to read texture images. The steps are: (a) read the image data into a ByteBuffer,\
    \ using JOGL buffer tools we will walk in Chapter 4, (b) use glTextures() to instantiate\
    \ a texture object and assign it an ID, (c) call glBindTexture() to make the newly\
    \ created texture object active, (d) load the previously read-in image into the\
    \ texture object with the glTexImage2D() command, and (e) adjust the texture settings\
