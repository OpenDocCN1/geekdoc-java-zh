  md: "# 5.9 ANISOTROPIC FILTERING\n\nMipmapped textures can sometimes appear more\
    \ blurry than non-mipmapped textures, especially when the texture object is rendered\
    \ at a heavily tilted viewing angle. We saw an example of this back in Figure\
    \ 5.9, where reducing artifacts with mipmapping led to reduced detail (comparing\
    \ with Figure 5.8).\n\nThis loss of detail occurs when an object is tilted, its\
    \ primitives appear smaller along one axis (i.e., width, height) than the other.\
    \ When OpenGL textures a primitive, it selects the mipmap appropriate for the\
    \ smaller of the two axes to avoid \"sparkling\" artifacts. In Figure 5.9 the\
    \ surface is tilted heavily away from the viewer, so each rendered primitive will\
    \ utilize the mipmap appropriate for its deheight, which is likely to have a resolution\
    \ lower than appropriate for its width.\n\nOne way of restoring some of this lost\
    \ detail is to use anisotropic filtering (AF). Standard mipmapping samples a texture\
    \ image at a variety of square resolutions (e.g., 256×256, 128×128, etc.), AF\
    \ samples the textures at a number of rectangular resolutions as well, such as\
    \ 256×128, 64×128, and so on. This enables viewing at various angles while retaining\
    \ as much detail in the texture as possible.\n\nAnisotropic filtering is more\
    \ computationally expensive than standard mipmapping, and is not a required part\
    \ of OpenGL. However, most graphics cards support AF (this is referred to as an\
    \ OpenGL extension), and OpenGL provides both a way of querying the card to see\
    \ if it supports AF, and a way of accessing AF if it does. The code is added immediately\
    \ after generating the mipmap:\n\n```\n// if mipmapping\ngl.glTexParameter(GL_TEXTURE_2D,\
    \ GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);\ngl.GenerateMipmap(GL_TEXTURE_2D);\n\
    \n// if also anisotropic filtering\nif (gl.isExtensionAvailable(\"GL_EXT_texture_filter_anisotropic\"\
    )) {\n    float max[] = new float[1];\n    gl.glGetFloat(GL_TEXTURE_MAX_ANISOTROPY_EXT,\
    \ max, 0);\n    gl.glTexParameter(GL_TEXTURE_2D, GL_TEXTURE_MAX_ANISOTROPY_EXT,\
    \ max[0]);\n}\n```\n\nThe call to glIsExtensionAvailable() tests whether the graphics\
    \ card supports AF. If it does, it is set to the maximum degree of density sampling,\
    \ a value retrieved using glGetFloat() as shown. It is then applied to the active\
    \ texture object using glTexParameter(). The result is shown in Figure 5.13. Note\
    \ that much of the lost detail from Figure 5.8 has been restored, while still\
    \ removing the sparkling artifacts."
