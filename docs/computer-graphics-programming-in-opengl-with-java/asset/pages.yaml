    \n# 9.1 SKYBOXES\n\nThe concept of a skybox is a remarkably clever and simple\
    \ one:\n\n+   1. Instantiate a cube object.\n2. Texture the cube with the desired\
    \ environment.\n3. Position the cube so it surrounds the camera.\n\nWe already\
