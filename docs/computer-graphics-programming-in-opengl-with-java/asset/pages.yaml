    # 3.3 MATRICES


    A matrix is a rectangular array of values, and its elements are typically accessed
    by means of subscripts. The first subscript refers to the row number, and the
    second refers to the column number, with the subscripts starting at 0. Most of
    the matrices that we use for 3D graphics computations are of size 4x4, as shown
    in Figure 3.2:


    ![](img/f83c01d271af8dca6b2025e3474f6599_53_0.png)


    Figure 3.2.

    4x4 matrix.


    The GLSL language includes a data type called mat4 that can be used for storing
    4x4 matrices. Similarly, graphicslib3D includes a class called Matrix3D for instantiating
    and storing 4x4 matrices.


    The identity matrix contains all zeros, with ones along the diagonal. Any item
    multiplied by the identity matrix is unchanged:


    ![](img/f83c01d271af8dca6b2025e3474f6599_53_1.png)


    In graphicslib3D the identity matrix is available through the function Matrix3D.setTentity().


    The transpose of a matrix is computed by interchanging its rows and columns. For
    example:


    ![](img/f83c01d271af8dca6b2025e3474f6599_53_2.png)'
