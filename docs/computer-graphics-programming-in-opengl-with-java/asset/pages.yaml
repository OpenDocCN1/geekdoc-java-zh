    Although we have used perspective projection at each phase of shadow mapping,
    it is worth noting that orthographic projection is often preferred when the light
    source is direct and directional, rather than the positional light we utilized.


    Finally, the methods presented here are limited to producing hard shadows. However,
    most shadows that occur in the real world are soft shadows. That is, their edges
    are blurred to various degrees, such as in the real-world example shown in Figure
    8.16. There are many causes of soft shadows, the most common being that light
    sources are rarely points—more often they occupy some area. This gives rise to
    the penumbra effect shown in Figure 8.17.


    There are many ways of simulating the penumbra effect in soft shadows. For example,
    the shadow buffer can be sampled multiple times with a bit of randomness incorporated.
    Such methods incur some amount of overhead that can impact performance.


    Generating realistic shadows is a rich and complex area of computer graphics,
    and many of the available techniques are outside the scope of this text. Readers
    interested in more detail are encouraged to investigate more specialized resources
    as [GP10] and [MI16].'
