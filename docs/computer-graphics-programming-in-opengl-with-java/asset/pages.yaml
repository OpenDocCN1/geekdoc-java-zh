    # SUPPLEMENTAL NOTES


    A major limitation of environment mapping, as presented in this chapter, is that
    it is only capable of constructing objects that reflect the cube map. Other objects
    rendered in the scene are not reflected in the reflection-mapped object. Depending
    on the nature of the scene, this might or not be acceptable. If other objects
    are present that must be reflected in a mirror or chrome object, other methods
    must be used. A common approach utilizes the stencil buffer (mentioned earlier
    in Chapter 8), and is described in web tutorials ([OV12], [NE14], and [GR16],
    for example), but is outside the scope of this text.


    We didn''t include an implementation of skydomes, although they are in ways arguably
    simpler than skyboxes and they can be susceptible to distortion. Even environment
    mapping is simpler—at least the math—but the OpenGL support for cube maps makes
    skyboxes more practical.


