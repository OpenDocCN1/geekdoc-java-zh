  md: 'To understand how this works, we start by noting that a vector can be stored
    with reasonable precision in three bytes, one for each of the X, Y, and Z components.
    This makes it possible to store normals in a color image file, with the R, G,
    and B components corresponding to X, Y, and Z. RGBB values in an image are stored
    in bytes and are usually interpreted as values in the range [0..1], whereas vectors
    have positive or negative component values to the range [-1..+1], a simple conversion
    to storing a normal vector N as a pixel in image file:


    ```

    R = (Nx + 1)/2

    G = (Ny + 1)/2

    B = (Nz + 1)/2

    ```


    Normal mapping utilizes an image file (called a normal map) that contains normals
    to a desired surface appearance in the presence of lighting. In a normal map,
    the vectors are represented relative to an arbitrary plane X-Y, with their X and
    Y components representing deviations from "vertical," and their Z component set
    strictly perpendicular to the X-Y plane (i.e., with no deviation) would be [0,0,1],
    whereas non-parallel vectors have non-zero X and/or Y components. We use the above
    formulae to convert to RGB space; for example, [0,0,1] would be stored as [5,5,1],
    since actual offsets range [-1..+1], but RGB values range [0..1].


    We can use of such a normal map through yet another application of texture units:
    instead of storing colors in the texture unit, we use a sampler to look up the
    normal map for a given fragment, and then rather applying the returned value to
    the output pixel color (as we did in texture mapping), we use it as the normal
    vector.


    ![](img/f83c01d271af8dca6b2025e3474f6599_250_0.png)


    One of such a normal map image file is shown in Figure 10.3. It was generated
    by applying the GIMP normal plugin [GI16] to a texture from Luna [LU16]. Normal-mapping
    image files are not intended for viewing; we show this one to point out that such
    ends up being largely blue. This is every entry in the image file has a B value
    of 1 (maximum blue), making the image appear "bluish" if viewed.


    Figure 10.3 Normal mapping image file example [ME11].'
