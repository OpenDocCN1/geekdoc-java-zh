  md: '# Chapter 14 Other Techniques 303


    compositing is glBlendEquation(mode) and glBlendFunc(srcFactor, destFactor). Figure
    14.3 shows an overview of the compositing process.


    The compositing process works as follows:


    +   The source and destination pixels are multiplied by source factor and destination
    factor, respectively. The source and destination factors are specified in the
    blendFunc() function call.

    The specified blendEquation is used to combine the modified source and destination
    pixels to produce a new destination color. The blend equation is specified in
    the glBlendEquation() call.


    The most common options for glBlendFunc() parameters (i.e., srcFactor and destFactor)
    are:


    | glBlendFunc() parameter | resulting srcFactor or destFactor |

    | --- | --- |

    | GL_ZERO | (0,0,0,0) |

    | GL_ONE | (1,1,1,1) |

    | GL_SRC_COLOR | ($R_{src}, G_{src}, B_{src}, A_{src}$) |

    | GL_ONE_MINUS_SRC_COLOR | (1,1,1,1) - ($R_{src}, G_{src}, B_{src}, A_{src}$)
    |

    | GL_DST_COLOR | ($R_{dest}, G_{dest}, B_{dest}, A_{dest}$) |

    | GL_ONE_MINUS_DST_COLOR | (1,1,1,1) - ($R_{dest}, G_{dest}, B_{dest}, A_{dest}$)
    |

    | GL_SRC_ALPHA | ($A_{src}, A_{src}, A_{src}, A_{src}$) |

    | GL_ONE_MINUS_SRC_ALPHA | (1,1,1,1) - ($A_{src}, A_{src}, A_{src}, A_{src}$)
    |

    | GL_DST_ALPHA | ($A_{dest}, A_{dest}, A_{dest}, A_{dest}$) |

    | GL_ONE_MINUS_DST_ALPHA | (1,1,1,1) - ($A_{dest}, A_{dest}, A_{dest}, A_{dest}$)
    |

    | GL_CONSTANT_COLOR | ($R_{blend}, G_{blend}, B_{blend}, A_{blend}$) |

    | GL_ONE_MINUS_CONSTANT_COLOR | (1,1,1,1) - ($R_{blend}, G_{blend}, B_{blend},
    A_{blend}$) |

    | GL_CONSTANT_ALPHA | ($A_{blend}, A_{blend}, A_{blend}, A_{blend}$) |

    | GL_ONE_MINUS_CONSTANT_ALPHA | (1,1,1,1) - ($A_{blend}, A_{blend}, A_{blend},
    A_{blend}$) |

    | GL_ALPHA_SATURATE | (f,f,f,1) where f = min($A_{dest}$, 1) |'
