  trans: "\n\n注意：仅在你明确需要 `Any` 和 `AnyObject` 提供的行为和能力时，才使用它们。在代码中，明确你期望与之操作的类型总是会更好。\n\
    \n### AnyObject\n\n在处理 Cocoa APIs 时，接收 `AnyObject` 类型数组（或“任意对象类型值的数组”）是正常现象。这是因为在\
    \ Objective-C 中没有显式的泛类型数组。但是，如果你根据数组提供的 API 信息，对数组中存在的对象类型有把握，你可以使用 `as!` 类型转换操作符（强制版本），将数组中的每个项向下强制转型为比\
    \ `AnyObject` 更具体的类类型，而无需进行可选值解包。\n\n一个 `AnyObject` 类型数组将由下面的示例定义，并添加三个 `Movie`\
    \ 类的实例：\n\n```swift\nlet someObjects: [AnyObject] = [\n    Movie(name: \"2001:\
    \ A Space Odyssey\", director: \"Stanley Kubrick\"),\n    Movie(name: \"Moon\"\
    , director: \"Duncan Jones\"),\n    Movie(name: \"Alien\", director: \"Ridley\
    \ Scott\")\n]\n```\n\n由于此数组只包含 `Movie` 实例，可以使用 `as!` 类型转换操作符（强制版本）将其向下转型并解包为非可选的\
    \ `Movie`：\n\n```swift\nfor object in someObjects {\n    let movie = object as!\
    \ Movie\n    print(\"Movie: '\\(movie.name)', dir. \\(movie.director)\")\n}\n\
    // Movie: '2001: A Space Odyssey', dir. Stanley Kubrick\n// Movie: 'Moon', dir.\
    \ Duncan Jones\n// Movie: 'Alien', dir. Ridley Scott\n```\n\n与其单独对每个项进行向下转型，可以将数组\
    \ `someObjects` 转型为 `[Movie]` 类型，以便使用更短的循环形式：\n\n```swift\nfor movie in someObjects\
    \ as! [Movie] {\n    print(\"Movie: '\\(movie.name)', dir. \\(movie.director)\"\
    )\n}\n// Movie: '2001: A Space Odyssey', dir. Stanley Kubrick\n// Movie: 'Moon',\
    \ dir. Duncan Jones\n// Movie: 'Alien', dir. Ridley Scott\n```\n\n### Any\n\n\
    在这个示例中，我们将使用 `Any` 来处理不同类型的组合，包括非类类型和函数类型。此示例中将创建一个名为 `things` 的数组，它可以存储类型为 `Any`\
    \ 值。\n\n```swift\nvar things = [Any]()\nthings.append(0)\nthings.append(0.0)\n\
    things.append(42)\nthings.append(3.14159)\nthings.append(\"hello\")\nthings.append((3.0,\
    \ 5.0))\nthings.append(Movie(name: \"Ghostbusters\", director: \"Ivan Reitman\"\
    ))\nthings.append({ (name: String) -> String in \"Hello, \\(name)\" })\n```\n\n\
    `things` 数组包含了两个 `Int` 值、一个 `String` 值、两个 `Double` 值、电影“捉鬼总员”、一个 `(Double, Double)`\
    \ 类型的元组，以及一个接收并返回 `String` 值的闭包表达式。\n\n`is` 和 `as` 操作符可以配合 `switch` 语句中的情况，用于发现特定类型的变量或常量，这些类型仅限于\
    \ `AnyObject` 类型或 `Any` 类型。下面的示例遍历 `things` 数组的项，然后使用 `switch` 语句查询每个项的类型。`switch`\
    \ 语句的多个情况将特定类型的常量与其匹配的值绑定，从而允许打印该值：\n\n```swift\nfor thing in things {\n    switch\
    \ thing {\n        case 0 as Int:\n            print(\"zero as an Int\")\n   \
    \     case 0 as Double:\n            print(\"zero as a Double\")\n        case\
    \ let someInt as Int:\n            print(\"an integer value of \\(someInt)\")\n\
    \        case let someDouble as Double where someDouble > 0:\n            print(\"\
    a positive double value of \\(someDouble)\")\n        case is Double:\n      \
    \      print(\"some other double value that I don't want to print\")\n       \
    \ case let someString as String:\n            print(\"a string value of \\\"\\\
    (someString)\\\")\n        case let (x, y) as (Double, Double):\n            print(\"\
    an (x, y) point at \\(x), \\(y)\")\n        case let movie as Movie:\n       \
    \     print(\"a movie called '\\(movie.name)', dir. \\(movie.director)\")\n  \
    \      case let stringConverter as String -> String:\n            print(stringConverter(\"\
    Michael\"))\n        default:\n            print(\"something else\")\n    }\n\
    }\n// zero as an Int\n// zero as a Double\n// an integer value of 42\n// a positive\
    \ double value of 3.14159\n// a string value of \"hello\"\n// an (x, y) point\
    \ at 3.0, 5.0\n// a movie called 'Ghostbusters', dir. Ivan Reitman\n// Hello,\
    \ Michael\n```\n\n### 嵌套类型\n\n枚举通常是通过支持特定类或结构的功能创建的。同样，我们可以为了方便定义工具结构和类，它们将纯粹地用于更复杂的类型上下文中。为了实现这一点，你可以在\
    \ Swift 中定义嵌套类型。在这里，你可以将支持的结构、类和枚举嵌套在其支持的类型定义内部。\n\n通过将类型定义写在其支持的外大括号内部，你可以将一个类型嵌套在另一个类型内部。嵌套类型没有限制，可以达到所需的任意深度。\n\
    \n#### 嵌套类型的实际应用\n\n在给出的示例中，定义了一个名为 `BlackjackCard` 的结构。该结构模拟了类似于黑 2 点游戏中使用的扑牌。`Suit`\
    \ 和 `Rank` 是包含在 blackjack 结构体内部的嵌套枚举类型。\n\n黑 2 点中的王牌值可以是 1 或 11。使用名为 `Values`\
    \ 的结构来表示此特征，并嵌套在 `Rank` 枚举内部：\n\n```swift\nstruct BlackjackCard {\n    // 嵌套 Suit\
    \ 枚举\n    enum Suit: Character {\n        case Spades = \"♠\", Hearts = \"♡\"\
    , Diamonds = \"♢\", Clubs = \"♣\"\n    }\n    // 嵌套 Rank 枚举\n    enum Rank: Int\
    \ {\n        case Two = 2, Three, Four, Five, Six, Seven, Eight, Nine, Ten\n \
    \       case Jack, Queen, King, Ace\n        struct Values {\n            let\
    \ first: Int, second: Int?\n        }\n        var values: Values {\n        \
    \    switch self {\n                case .Ace:\n                    return Values(first:\
    \ 1, second: 11)\n                case .Jack, .Queen, .King:\n               \
    \     return Values(first: 10, second: nil)\n                default:\n      \
    \              return Values(first: self.rawValue, second: nil)\n            }\n\
    \        }\n    }\n    // BlackjackCard 属性和方法\n    let rank: Rank, suit: Suit\n\
    \    var description: String {\n        var output = \"suit is \\(suit.rawValue),\"\
    \n        output += \" value is \\(rank.values.first)\"\n        if let second\
    \ = rank.values.second {\n            output += \" or \\(second)\"\n        }\n\
    \        return output\n    }\n}\n```\n\n`Suit` 枚举用于描述四种花色，以及代表其符号的 `Character`\
    \ 值。\n\n所有可能的牌面值由 `Rank` 枚举描述，并带有一个原始 `Int` 值，该值用于表示除王牌、J、Q、K 外的面值。\n\n如上所述，一个名为\
    \ `Values` 的嵌套结构嵌套在 `Rank` 枚举中。除了王牌有两个值外，几乎所有的牌都只有一个值，该结构封装了这一事实。两个属性由 `Values`\
    \ 结构定义以表示：\n\n`first`，类型为 `Int`\n\n`second`，类型为 `Int?` 或“可选 Int”\n\n一个计算属性 `Values`\
    \ 定义在 `Rank` 中，它返回一个 `Values` 结构实例。该计算属性会考虑牌的 own 数，并根据点数初始化一个新的 `Values` 实例以相应的值。\n\
    \n"
- fmt: "\nAs there are no custom initialisers for the `BlackjackCard` structure, there\
    \ is an implicit memberwise initializer for it and it is described in the structure\
    \ type memberwise initializer. this initializer can be used for initializing a\
    \ new constant called `AceOfSpades`.\n\n```swift\nlet theAceOfSpades = BlackjackCard(rank:\
    \ .Ace, suit: .Spades)\nprint(\"theAceOfSpades: \\(theAceOfSpades.description)\"\
    )\n// prints \"theAceOfSpades: suit is♠, value is 1 or 11\"\n```\n\nAs you can\
    \ see, `Suit` and `Rank` are nested inside `BlackjackCard`. From the context,\
    \ we can infer their type. The enumeration cases can be referred by the initialisation\
    \ of the instance. The reference will be through their case names. From the examples\
    \ given above, `description` property reports that the value of 1 of 11.\n\n##\
    \ Referring to Nested Types\n\nFor using a nested type out of the context definition,\
    \ the name of the type should be prefixed with its name.\n\n```swift\nlet heartsSymbol\
    \ = BlackjackCard.Suit.Hearts.rawValue\n// heartsSymbol is \"♡\"\n```\n\nFor the\
    \ above example, the names of `Rank`, `Suit`, and `Values` are kept short deliberately,\
    \ and this is because those names are qualified naturally by the content where\
    \ they are defined.\n\n## Function Types as Parameter Types\n\nIn swift, you are\
    \ allowed to use the function types like `(Int, Int) -> Int` as another function’s\
    \ parameter type. With this, you can leave some of the function implementation\
    \ aspects for the caller of the function whenever the function is called.\n\n\
    Given below is an example which will print the results from the above math functions.\n\
    \n```swift\nfunc printMathResult(mathFunction: (Int, Int) -> Int, _ a: Int, _\
    \ b: Int) {\n    print(\"Result: \\(mathFunction(a, b))\")\n}\nprintMathResult(addTwoInts,\
    \ 3, 5)\n// prints \"Result: 8\"\n```\n\nIn this example, a function called `printMathResult(_:_:_:)`\
    \ is defined and this function has three parameters. The first parameter of the\
    \ function is `mathFunction`. The type of the first parameter is `(Int, Int) ->\
    \ Int`. Functions of the same type can be passed as the arguments for the `mathFunction`\
    \ parameter. `a` and `b` are the second and the third parameters. The second and\
    \ the third parameters are of the `Int` type. For the math function provided,\
    \ these parameters will be used as the input values.\n\nWhen we call the `printMathResult(_:_:_:)`\
    \ function, the function `addTwoInts(_:_:)` will be passed with `3` and `5` as\
    \ integer values. This will now call the function provided with `3` and `5` as\
    \ values and this will print 8 as the result.\n\nPrinting the result is the role\
    \ of the function `printMathResult(_:_::)`. This will print the math function\
    \ call of an appropriate type. The implementation of the function doesn't matter\
    \ here. The only thing that matters here is the type of the function, which needs\
    \ to be correct. With this, the function `printMathResult(_:_:_:)` will hand some\
    \ of the functionality to the one which calls the function. This will happen in\
    \ type-safe way.\n\n## Function Types as Return Types\n\nThe function type of\
    \ a given can be used as the return type for another function. This can be accomplished\
    \ by giving the complete functional type right after `->` of the returning function.\n\
    \nTwo simple functions `stepForward(_:)` and `stepBackward(_:)` are defined in\
    \ the next example. The function `stepForward(_:)` returns a value one more than\
    \ the input value and the function `stepBackward(_:)` returns one less value than\
    \ the input value. The type of both the functions is of `(Int) -> Int`:\n\n```swift\n\
    func stepForward(input: Int) -> Int {\n    return input + 1\n}\nfunc stepBackward(input:\
    \ Int) -> Int {\n    return input - 1\n}\n```\n\nHere there is a function `chooseStepFunction(_:)`\
    \ which has the return type “a function of type `(Int) -> Int”. The function `stepForward(_:)`\
    \ or the function `stepBackward(_:)` will be returned by the function `chooseStepFunction(_:)`,\
    \ basing on the Boolean parameter.\n\n```swift\nfunc chooseStepFunction(backwards:\
    \ Bool) -> (Int) -> Int {\n    return backwards ? stepBackward : stepForward\n\
    }\n```\n\nNow you can use the `chooseStepFunction(_:)` for obtaining a function\
    \ which steps in a direction or in other direction.\n\n```swift\nvar currentValue\
    \ = 3\nlet moveNearerToZero = chooseStepFunction(currentValue > 0)\n// moveNearerToZero\
    \ now refers to the stepBackward() function\n```\n\nThe above example determines\
    \ if a positive step or a negative step is needed for moving the variable `currentValue`\
    \ closer to 0, progressively.\n\nThe initial value of the `currentValue` is `3`\
    \ and it means that `currentValue > 0` is true in this case. This will make the\
    \ `chooseStepFunction(_:)` return the function `stepBackward(_:)`. We use a constant\
    \ `moveNearerToZero` for storing the returned function reference.\n\nThe `moveNearerToZero`\
    \ now refers the right function and hence it can be used for counting to 0:\n\n\
    ```swift\nprint(\"Counting to zero:\")\n// Counting to zero:\nwhile currentValue\
    \ != 0 {\n    print(\"\\(currentValue)... \")\n    currentValue = moveNearerToZero(currentValue)\n\
    }\nprint(\"zero!\")\n// 3...\n// 2...\n// 1...\n// zero!\n```\n\n## Nested Functions\n\
    \nAll the functions that you have seen so far are examples of global functions.\
    \ Global functions will be defined at a global scope. You are also allowed to\
    \ define functions within other functions. These are called nested functions.\n\
    \nBy default, all the nested functions will be hidden. Though they are hidden,\
    \ the nested functions can be used and called by enclosing function.\n\n```swift\n\
    func chooseStepFunction(backwards: Bool) -> (Int) -> Int {\n    func stepForward(input:\
    \ Int) -> Int {\n        return input + 1\n    }\n    func stepBackward(input:\
    \ Int) -> Int {\n        return input - 1\n    }\n    return backwards ? stepBackward\
    \ : stepForward\n}\nvar currentValue = -4\nlet moveNearerToZero = chooseStepFunction(currentValue\
    \ > 0)\n// moveNearerToZero now refers to the stepForward() function\nwhile currentValue\
    \ != 0 {\n    print(\"\\(currentValue)... \")\n    currentValue = moveNearerToZero(currentValue)\n\
    }\nprint(\"zero!\")\n// -4...\n// -3...\n// -2...\n// -1...\n// zero!\n```\n\n\
    # Chapter 7: Creating Your First App\n\nNow that you have learned the basics of\
    \ Swift programming, and have learned how to create a Tip Calculator class, it’s\
    \ time to learn how to make your first iOS app. We are going to use the Tip Calculator\
