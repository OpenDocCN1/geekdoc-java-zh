    \ If you click the new game button, a print statement from the console will be\
    \ displayed. In case where you have chosen a different device simulator, it will\
    \ correctly scale between the resolutions of iPad and iPhone.\n\n# Model-View-Controller\
    \ Implementation\nNow, we will start coding. The paradigm we follow will be the\
    \ `Model-View-Controller`. In iOS development, this is frequently used for separating\
    \ the front end user interface code from the model code of the back end.\n\nThe\
