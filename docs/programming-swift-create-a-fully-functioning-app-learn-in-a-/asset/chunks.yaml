    \n*   {   \n\n*   didSet\n\n*   {       \n\n*   self.movesLabel.text = \"Moves:\
    \ \\(moves)\"       \n\n*   self.movesLabel.sizeToFit()   \n\n*   }\n\n*   }\n\
    \n*   var timeTaken:Int = 0  \n\n*   {   \n\n*   didSet\n\n*   {\n\n*   self.timeLabel.text\
    \ = \"Time: \\(timeTaken)\"\n\n*   self.timeLabel.sizeToFit()\n\n*   }\n\n*  \
    \ }\n\nEvery time the property’s value changes, the method didSet will be triggered.\
    \ They will be used for updating the corresponding labels display automatically.\
    \ The size of the label will be adjusted by the sizeToFit, so that the text will\
    \ fit inside the label when the length of the text increases. Add this method\
    \ startNewGame at the bottom resetting the variables whenever a new game starts.\n\
    \n*   func startNewGame() {\n\n    //start new game\n\n*   self.resetBoard()\n\
    \n*   self.timeTaken = 0\n\n*   self.moves = 0\n\n*   }\n\nThese variables should\
    \ be updated as game progresses and we need a way to do it. The property Moves\
    \ is easy, whenever a new button is clicked, it should be increased by 1\\. There\
    \ should be added inside the conditional (!sender.square.isRevealed) present in\
    \ the method squareButtonPressed:\n\nself.moves++\n\nIt is a bit complicated to\
    \ deal with the time as a timer object should be created for triggering the method\
    \ for every one second passed. This new property will be defined on the class:\n\
    \nvar oneSecondTimer:NSTimer?\n\nWe will make it into an optional NSTimer object.\
    \ By making it an optional object, a nil value can be given to it when the game\
    \ ends and before a new game begins. At the end of startNewGame, add the line\
    \ given below, for creating a new timer:\n\nself.oneSecondTimer = NSTimer.scheduledTimerWithTimeInterval(1.0,\
    \ target: self, selector: Selector(\"oneSecond\"), userInfo: nil, repeats: true)\n\
    \nFor every 1.0 seconds, the method named “oneSecond” will be called. Now, we\
    \ will define the same method to increase 1 second of time, every time it is called.\n\
    \n*   func oneSecond()\n\n*   {\n\n*   self.timeTaken++\n\n*   }\n\nThe Moves\
    \ and the Time labels will be updated appropriately if you play now. But there\
    \ will be one problem. Even after losing the game, the timer will continue to\
    \ go up. When you start a new game, the new timer will start without invalidating\
    \ the old timer and with this, the time goes faster and faster with every game\
    \ you play. Now we should add a new method which will be triggered whenever the\
    \ game ends; by tapping the new game button or a mine.\n\n*   func endCurrentGame()\n\
    \n*   {\n\n*   self.oneSecondTimer!.invalidate()\n\n*   self.oneSecondTimer =\
    \ nil\n\n*   }\n\nIf you notice, you will find that the oneSecondTimer is optional\
    \ and if you wish to access its properties, you should put “!” after is the name.\
    \ The “!” will tell that the object is not empty at the current time and it is\
    \ fine to access the object as non optional.\n\nAdd to the top of the minePressed\
    \ method:\n\nself.endCurrentGame()\n\nAnd add to the top of the newGamePressed\
    \ method:\n\nself.endCurrentGame()\n\nIf you execute the application now, in the\
    \ new games, it will properly handle the timer. We have finally built the minesweeper\
    \ application using the storyboard Interface builder of XCode and swift programming\
    \ language.\n\nThe positions of the square buttons will be based on the boardView\
    \ size and it will scale to fill the width of the screen. With the built in cross\
    \ compatibility between the iPad and the iPhone, our application can be used on\
    \ any of those devices.\n\nThe iPhone version and the iPad versions are given\
    \ below.\n\nIf you want some extra challenge with the application, there are many\
    \ features which you can add it to the application and few of those ideas are\
    \ given below.\n\n1.  For changing the difficulty, you can add new components\
    \ to the user interface where you can adjust the method calculateIsMineLocationForSquare\
    \ in the board.Swift. With this, the difficulty of the game will be increased.\n\
    \n2.  You can implement an algorithm which will clear multiple boxes with a single\
    \ click, on the box which has no neighboring mines. In the traditional minesweeper\
    \ game, when there are no neighboring mines, they will be cleared continuously.\n\
    \n3.  You can let the user know when he won the game. This will happen when they\
    \ haven't touched the mines after revealing the non-mines.\n\n# Conclusion\n\n\
    That concludes my basic tutorial on how to create a class in the Swift Playground\
    \ and then transfer that class over to Swift and build an app from scratch. Swift\
    \ really is not a difficult language to learn and is one of the more fun ones."
