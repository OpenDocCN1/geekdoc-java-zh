- fmt: "\nYou can see the `Printable` has been changed to `CustomStringConvertible`\
    \ and most `Foundation` objects conform to this. With the protocol extensions,\
    \ you can extend large parts of the system using custom functionality.\n\nAnd,\
    \ instead of adding in bits of custom code to `enums`, `structs` and `classes`,\
    \ you can simply write one implementation that will apply across a number of types.\n\
    \n## Grab Bag\n\nThere are loads of new things on the way so, rather than go through\
    \ it all now, I just want to go through a couple of them:\n\n- Objective C Generics\
    \ – Apple has begun annotating all of the Objective C code so that all `Swift`\
    \ types get the right optionality. That is now being done with Objective C generics,\
    \ giving developers better type hinting.\n- Renamed Syntax – `PrintIn` has gone,\
    \ after just one year so it’s back to plain `Print`, which has been given a default\
    \ second argument – this is set to true on whether or not to print a newline.\
    \ The `do` keyword is focused on error handling scope and `do-while` loops have\
    \ changed to `repeat-while`.\n\nThese are just a few of what is to come in the\
    \ near future and there will likely be a lot more revealed as time goes on. At\
    \ this stage, it is a case of wait and see but, in the meantime, I would suggest\
    \ that you spend your time wisely, getting fully to grips with `Swift` before\
    \ we get the update.\n\n# Chapter 11: Creating Applications in Swift\n\n## Simple\
    \ Calculator\n\nNow we will have a look at the required steps for creating a simple\
    \ calculator program.\n\n- Open `XCode`\n- Create a single view application\n\
    - Fill out the product name, organization name and of the organization identifier.\n\
    - We will name the product as `iOS8SwiftCalculatorTutorial`.\n- Select `swift`\
    \ in the language tab.\n- Select the device from the device tab. Here, we will\
    \ select `iPhone` as our device.\n\nMake the width compact from the storyboard\
    \ for changing the view to portrait mode, for suiting an `iPhone`.\n\nOn the top\
    \ of the main view, add a label. Select the “Right Alignment” from the property\
    \ inspector. Give “0” as the label title. Now select an assistant editor. Now\
    \ open the file `ViewController.swift`. Press `Ctrl` and from the bottom, drag\
    \ to the class section. This will create the output as shown below.\n\nTo the\
    \ view, Add a button and give “1” as the title for the button. Press `Ctrl` and\
    \ from the bottom to the `IBoutlet`, Drag. The following action will be created.\n\
    \nCopy this button to the storyboard and then press create for creating other\
    \ digits. Remember that this will copy the `IBAction` connection as well. After\
    \ copying, the storyboard was somewhat look like this.\n\nNow click on a new button\
    \ and a drag it to the view. Give the minus sign to the button. From the plus-bottom,\
    \ `Ctrl+Click` and Drag to the file `ViewController.swift`, present below the\
    \ action `numberTapped` for creating the action.\n\nNow, copy the plus-button\
    \ and beneath it, paste a new button. Give a plus sign to the new button.\n\n\
    Below the “0” button, now create a new button. Give the new button a “=” sign.\
    \ From this button, `Ctrl` and Drag till the file `ViewController.swift` below\
    \ `calculationTapped` for creating an action.\n\nNow that we have a design for\
    \ our calculator, we will add code inside the file `ViewController.swift`. We\
    \ will first define some properties after the line `class ViewController: UIViewController\
    \ {`.\n\n```swift\nvar isTypingNumber = false\nvar firstNumber = 0\nvar secondNumber\
    \ = 0\nvar operation = \"\"\n```\n\nThe function `isTypingNumber` is of the `Boolean`\
    \ type and we use it for checking whether the user is pressing an operation or\
    \ typing a number.\n\nImplement the method `numberTapped` after this:\n\n```swift\n\
    @IBAction func numberTapped(sender: AnyObject) {\n    var number = sender.currentTitle\n\
    \    if isTypingNumber\n    {\n        calculatorDisplay.text = calculatorDisplay.text\
    \ + number\n    }\n    else\n    {\n        calculatorDisplay.text = number\n\
    \        isTypingNumber = true\n    }\n}\n```\n\nTo the `calculatorDisplay` label’s\
    \ text, we will append the digit pressed. If the digit is the first, that digit\
    \ will be assigned to the label. The method `calculationTapped` will be implemented\
    \ next.\n\n```swift\n@IBAction func calculationTapped(sender: AnyObject) {\n \
    \   isTypingNumber = false\n    firstNumber = calculatorDisplay.text.toInt()!\n\
    \    operation = sender.currentTitle\n}\n```\n\nUsing the `toInt` method, the\
    \ `calculatorDisplay` text will be converted into the integers from strings.\n\
    \nNote: A string can sometimes be empty and in such cases, an optional integer\
    \ will be returned. But in our case, the string will always have a value and for\
    \ unwrapping the value, we will add an exclamation mark. Implement the method\
    \ `equalsTapped`.\n\n```swift\n@IBAction func equalsTapped(sender: AnyObject)\
    \ {\n    isTypingNumber = false\n    var result = 0\n    secondNumber = calculatorDisplay.text.toInt()!\n\
    \    if operation == \"+\" {\n        result = firstNumber + secondNumber\n  \
    \  }\n    else if operation == \"-\"\n    {\n        result = firstNumber – secondNumber\n\
    \    }\n    calculatorDisplay.text = \"\\(result)\"\n}\n```\n\nBasing on the property\
    \ value of the `operation`, calculation will be performed and the result will\
    \ be displayed by the `calculatorDisplay` label.\n\nAs the final step, Build and\
    \ Run the project. Now you can make some calculations.\n\n## Minesweeper game\n\
    \nHere, we will design the minesweeper game using `swift`. This tutorial will\
    \ show you how the minesweeper game is built from start to finish.\n\n### Minesweeper:\
    \ An Intro to Swift Development\n\nWe will build the minesweeper game using `swift`\
    \ and the storyboard interface builder. For this you need to have the latest version\
    \ of `XCode` and the latest version of `swift` language. You can download it using\
    \ the link from the swift resources or you can easily download it from the App\
    \ Store.\n\nI'm sure most of the people are familiar with the minesweeper game.\
    \ If not, have a quick look of online.\n\nOpen the latest version of `XCode`.\
    \ Create a new project by following the steps.\n\nGive a product name for the\
    \ application. We will simply name it `minesweeper`.\n\nGive the organization\
    \ name and organization identifiers.\n\nSelect the language as `Swift`.\n\nSelect\
    \ the device for which you are designing this application. If you want your application\
    \ to work on all iOS devices, select “Universal” from the list.\n\nOn the very\
    \ first screen, go to the deployment info section from the general settings and\
    \ uncheck the landscape right and landscaper left orientations. This will make\
    \ the application run in portrait.\n\nWe will start designing the application\
    \ by laying the user interface. We will do it with the help of the storyboard\
    \ interface builder. First, open the `main.storyboard` and then select the `ViewController`\
    \ present on the screen. For this you may have to select the top interface bar\
