    \n```swift\nfunc application(application: UIApplication, didFinishLaunchingWithOptions\
    \ launchOptions: [NSObject: AnyObject]?) -> Bool {\n```\n\n## MasterViewController.swift\n\
    \n如果你打开这个文件，你会发现有很多内容。你已经在 `AppDelegate` 中见过 `import`，你可能已经发现 `MasterViewController`\
    \ 类继承自 `UITableViewController`。我不会详细介绍每一段代码，只介绍那些有趣的、与它们在 Objective C 中的实现方式相比提供了实质性改进的部分。\n\
    \n所以，简要看看这段代码，还有一点非常引人注目——`override` 关键字以及它如何在几乎所有函数之前使用：\n\n* `override func\
    \ awakeFromNib()`\n* `override func viewDidLoad()`\n* `override func didReceiveMemoryWarning()`这些函数已经在\
    \ `MasterViewController` 超类或其祖链的某处定义过，因此你必须显式地告诉编译器你确实想要重写或扩展已存在的函数。这有助于降低不小心使用已用函数名时产生错误的风险。如果你真的那样做了，一切都会崩溃。\n\
    \n所以，查看 `MasterViewController`，可以看到第一部分是 `objects` 变量属性定义，它是使用空的 `NSMutableArray()`\
    \ 化的：\n\n* `var objects = NSMutableArray()`\n\n当控制器的视图加载完成后，`viewDidLoad` 方法将被调用。该函数将首先调用超类方法——你会开始发现在几乎所有的函数中都是这样做的。\n\
    \n调用超类之后是设置右侧和左侧的导航栏按钮。这里值得注意的是使用了 `addButton`，它是一个常量。对于所有在创建后不会改变的类似项目都是建议。另一个有趣的部分是\
    \ `UIBarButtonItem` 的初始化：\n\n* `UIBarButtonItem(barButtonSystemItem: .Add, target:\
    \ self, action: \"insertNewObject:\")`\n"
- fmt: "\nInstead of the somewhat verbose syntax used in Objective C, where you would\
    \ call `alloc` followed by `initWithWhatever`, Swift does away with that and uses\
    \ named arguments in the initializer instead.\n\nYou should also note that the\
    \ way we tell it the type of `UIBarButtonSystemItem` we want to use is much nicer.\
    \ Instead of typing `UIBarButtonSystemAdd`, instead you can just use `.Add`. You\
    \ can do this because of Swift’s ability to infer type–it will simply pick up\
    \ on what you are doing and infer the correct type automatically.\n\nTake a look\
    \ at `insertNewObject:` and you will see that there is an interesting type for\
    \ the `sender` parameter, `AnyObject`.\n\n```swift\nfunc insertNewObject(sender:\
    \ AnyObject) {\n```\n\nYou don’t need to do anything with that inside this function\
    \ so let’s have a look at `tableView:cellForRowAtIndexPath:` which will have an\
    \ impact on you.\n\n```swift\noverride func tableView(tableView: UITableView,\
    \ cellForRowAtIndexPath indexPath: NSIndexPath) -> UITableViewCell {\n    let\
    \ cell = tableView.dequeueReusableCellWithIdentifier(\"Cell\", forIndexPath: indexPath)\
    \ as UITableViewCell\n    let object = objects[indexPath.row] as NSDate\n    cell.textLabel?.text\
    \ = object.description\n    return cell\n}\n```\n\nNotice on the first line of\
    \ the function `tableView:cellForRowAtIndexPath:` we have called `dequeueReusableCellWithIdentifier:forIndexPath:`\
    \ on the table view. For this method, the return type is `AnyObject`.\n\nAny class\
    \ could be returned from this particular function call so you will need to type\
    \ cast it by using `as UITableViewCell` that you can see at the end of the line.\
    \ Later on, you will change this to be the custom cell class of `taskCell`, which\
    \ you will be creating later on.\n\nWhen you are working with Cocoa frameworks,\
    \ this is common, because there is a need for compatibility with the old style\
    \ used in Objective C, where `id` would be the return type, meaning a pointer\
    \ to any object. Bear in mind that Swift avoids the use of pointers wherever it\
    \ can and this is why solutions such as this have been created, keeping your code\
    \ much safer.\n\nThe last part that is interesting is the syntax used for mark\
    \ comments, which work to help split and let you jump through the files:\n\n```swift\n\
    // MARK: - Table View\n```\n\nWhen you use this syntax for a comment, you can\
    \ split a file up, which makes it far easier to jump through it. This also helps\
    \ readers to see exactly what a set of functions are related to in the file.\n\
    \n## DetailViewController.swift\n\nThere is one more file we need to look at –\
    \ the `DetailViewController`. This is a small file compared to the `MasterViewController`\
    \ but it does have a number of very good examples of how Swift works to help you\
    \ write much better code.\n\nTo start with, we have the `@IBOutlet` attribute,\
    \ which is for the variable `detailDescriptionLabel`. In a similar way to how\
    \ it was in the header files in Objective C, this particular variable attribute\
    \ tells Interface Builder about this particular property on your `DetailViewController`:\n\
    \n```swift\n@IBOutlet weak var detailDescriptionLabel: UILabel!\n```\n\nYou may\
    \ also have spotted that this variable has been defined as `weak` because you\
    \ do not want `DetailViewController` to own the view.\n\nNext, there is a variable\
    \ property definition that looks interesting. This has a bit of extra code attached\
    \ to it to define the behavior of a property that is right beside its definition:\n\
    \n```swift\nvar detailItem: AnyObject? {\n    didSet {\n        // Update the\
    \ view.\n        self.configureView()\n    }\n}\n```\n\nThere is also an optional\
    \ `AnyObject?` Type but the most interesting bit is `didSet` code block.\n\nProperties\
    \ are able to contain blocks of code that will execute as a callback to a specific\
    \ event. The best part about this is that, rather than defining a specific setter\
    \ that will do this, you can actually have a much clearer definition of what the\
    \ code is doing there.\n\nThis piece of code now states, very clearly, that once\
    \ `detailItem` has been set, at any time from now on `configureView()` has to\
    \ be called. This is because something that pertains to the view has changed.\
    \ These callbacks are something of a large leap for iOS applications, in terms\
    \ of the expressive nature of the code.\n\nOw, earlier on, we talked briefly about\
    \ optionals because they are used quite a lot in iOS coding for applications so\
    \ here is another example for you on how these optionals are used.\n\n```swift\n\
    func configureView() {\n    // Update the user interface for the detail item.\n\
