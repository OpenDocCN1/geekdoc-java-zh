    *   let editorialTeam = 17


    *   let totalTeam = tutorialTeam + editorialTeam


    Playgrounds are a fantastic way of learning how Swift works and for experimenting.
    For the remainder of the first part of this tutorial you are going to stay working
    in this playground.


    Before you go any further, drag your new playground file to your OS X dock. This
    will make it easier for you to use it as a kind of notepad to test out new code
    quickly.


    ### Variables vs. Constants


    Open up your Playground file again and try to add this line to the bottom of it:


    *   totalTeam += 1


    The first thing you will notice is that you get an error when you put this line
    in. The reason for this is that totalTeam is what is known as a constant and its
    value cannot change. Constants must be declared with the word let, which we didn’t
    do with this example. Instead of being a constant, you want totalTeam to be a
    variable – with a value that changes – so it must be declared in a different way
    – with the keyword var.


    Go back to your playground file, scrub out the line you just typed and retype
    this:


    *   var totalTeam = tutorialTeam + editorialTeam


    Now you could ask yourself why we can’t just declare everything with the var keyword.
    The reason for declaring most things with let is that the compiler can work to
    perform optimizations that it couldn’t do with var.


    ## Explicit vs. Inferred Typing


    We haven’t yet set types for either the constants or the variables simply because
    the compiler can do it automatically if it has sufficient information. Back at
    the beginning, you set tutorialTeam to 56 and the compiler knows that 56 is an
    Int so it can automatically set it for you. This is known as Inferred typing.
    You can, of course explicitly set the type. Go to the line in your code where
    you set the type of tutorialTeam and replace it with:


    *   let tutorialTeam: Int = 60


    Where possible, you should let the compiler infer the types for you – that is
    one of the biggest advantages to Swift, a concise easy code. For that reason,
    switch back to inferred typing by putting this line back in:


    *   let tutorialTeam = 60


    ### Basic Types and Control Flow in Swift


    So, you have now seen Int working, the Swift type for integer values. But there
    are many more than that. Keeping your playground file open, try these lines out
