    \ simple function that multiplies the subtotal of the bill by the tip percentage.\
    \ Continuing on from that, add this code:\n\n```swift\n// 5\nfunc printPossibleTips()\
    \ {\n    println(\"15%: \\(calcTipWithTipPct(0.15))\")\n    println(\"18%: \\\
    (calcTipWithTipPct(0.18))\")\n    println(\"20%: \\(calcTipWithTipPct(0.20))\"\
    )\n}\n```\n\nYou have created a new method that will print out 3 possible tip\
    \ values. Note that when a method is called on an instance of a class, the initial\
    \ parameter doesn’t need naming but the rest do. Now, add this code in, this time,\
    \ after the curly braces:\n\n```swift\n// 6\nlet tipCalc = TipCalculator(total:\
    \ 33.25, taxPct: 0.06)\ntipCalc.printPossibleTips()\n```\n\nIn the final step,\
    \ you have created an instance of the tip calculator and you have called the method\
    \ to show the possible tip values.\n\nThis is what your code should look like\
    \ now:\n\n```swift\n// 1\nclass TipCalculator {\n    // 2\n    let total: Double\n\
    \    let taxPct: Double\n    let subtotal: Double\n    // 3\n    init(total: Double,\
    \ taxPct: Double) {\n        self.total = total\n        self.taxPct = taxPct\n\
    \        subtotal = total / (taxPct + 1)\n    }\n    // 4\n    func calcTipWithTipPct(tipPct:\
    \ Double) -> Double {\n        return subtotal * tipPct\n    }\n    // 5\n   \
    \ func printPossibleTips() {\n        println(\"15%: \\(calcTipWithTipPct(0.15))\"\
    )\n        println(\"18%: \\(calcTipWithTipPct(0.18))\")\n        println(\"20%:\
    \ \\(calcTipWithTipPct(0.20))\")\n    }\n}\n// 6\nlet tipCalc = TipCalculator(total:\
    \ 33.25, taxPct: 0.06)\ntipCalc.printPossibleTips()\n```\n\n# Chapter 5: Arrays\
    \ and For Loops\n\nYou’ve probably noticed quite a bit of duplication in the above\
    \ code. This is because you have called the method `calcTipWithTotal` a number\
    \ of times, showing different percentages. This is where arrays come in and allow\
    \ you to cut down on the duplication.\n\nGo to where you have typed `printPossibleTips`\
    \ and replace the contents:\n\n```swift\nlet possibleInferred = [0.15, 0.18, 0.20]\n\
    let possibleExplicit:[Double] = [0.15, 0.18, 0.20]\n// You have created an array\
