    \ method `IBAction` which is called whenever the new game button is pressed.\n\
    \n```swift\n@IBAction func newGamePressed()\n{\n    println(\"new game\");\n}\n\
    ```\n\nOpen assistant editor from the `Main.storyboard`. With this, you can have\
    \ a look at the file `ViewController.swift` at the same time. On the left margin\
