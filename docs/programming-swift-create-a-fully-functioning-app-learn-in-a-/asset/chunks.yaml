  trans: "\n类型转换（Typecasting）可以用于子类和类的层次结构，用于检查给定类实例的类型，并将该实例转换为具有相同层次结构的不同类。下面给了一个示例，其中三个代码片段，它们定义了数组以及包含其类实例的类的层次结构。\n\
    \n第一个代码片段中定义了一个新的基类。该基类被称为 `MediaItem`。该类可以为出现在数字媒体库中的任何项目提供基本功能。\n\n```swift\n\
    class MediaItem {\n  var name: String\n  init(name: String) {\n    self.name =\
    \ name\n  }\n}\n```\n\n在下一个代码片段中，定义了 `MediaItem` 的子类。`Movie` 是第一个子类，它封装了关于电影的额外信息。在类\
    \ `MediaItem` 之上会添加一个 `director` 属性，这是最佳类。该属性将通过一个响应基类的初始化器添加。\n\n`Song` 是第二个子类，它为基类添加了带有初始化器的属性\
    \ `artist`。\n\n```swift\nclass Movie: MediaItem {\n  var director: String\n  init(name:\
    \ String, director: String) {\n    self.director = director\n    super.init(name:\
    \ name)\n  }\n}\n\nclass Song: MediaItem {\n  var artist: String\n  init(name:\
    \ String, artist: String) {\n    self.artist = artist\n    super.init(name: name)\n\
    \  }\n}\n```\n\n最后一个代码片段将创建一个名为 `library` 的常量数组。它包含两个 `Movie` 实例和三个 `Song` 实例。通过使用数组字面量的的内容初始化\
    \ `library` 数组，可以推导出其类型。Swift 的类型检查器能够识别以 `MediaItem` 为共同父类的歌曲和电影。\n\n```swift\n\
    let library = [\n  Movie(name: \"Avatar\", director: \"James Cameroon\"),\n  Song(name:\
    \ \"They Don’t Care About Us\", artist: \"Michael Jackson\"),\n  Movie(name: \"\
    The Lord of the Rings\", director: \"Peter Jackson\"),\n  Song(name: \"Bohemian\
    \ Rhapsody\", artist: \"Freddie Mercury\"),\n  Song(name: \"summer of 69\", artist:\
    \ \"Brian Adams\")\n]\n// \"library\" 的类型被推断为 [MediaItem]\n```\n\n电影和歌曲实例是存储在\
    \ `library` 后台的项目。如果对数组的内容进行迭代，你收到的项目将不是 `movie` 或 `song` 类型，而是 `MediaItem` 类型。你应该检查它们的类型，以便以它们的实际类型与它们操作，或者你可以像下面所示将它们向下转型（downcast）为所需的类型。\n\
    \n## 检查类型\n\n你可以使用类型检查运算符（`is`）来检查实例是否属于某个子类类型。如果实例属于该子类类型，类型检查运算符将返回 `true`，如果不是，它将返回\
    \ `false`。\n\n下面的示例定义了两个变量 `movieCount` 和 `songCount`，它们计算了 `library` 数组中存在的歌曲和电影实例的总数：\n\
    \n```swift\nvar movieCount = 0\nvar songCount = 0\nfor item in library {\n  if\
    \ item is Movie {\n    ++movieCount\n  } else if item is Song {\n    ++songCount\n\
    \  }\n}\nprint(\"Media library contains \\(movieCount) movies and \\(songCount)\
    \ songs\")\n// 打印 \"Media library contains 2 movies and 3 songs\"\n```\n\n此示例中库数组中的所有项都将被整合进来。对于\
    \ `for in` 循环的每一次通过，`item` 常量都将发送给下一个 `MediaItem`。\n\n当当前的 `mediaItem` 是 `movie`\
    \ 实例时，运算符将返回 `true`，否则将返回 `false`。同样，如果 `mediaItem` 属于 `song` 实例，`item is song`\
    \ 将返回 `true` 值，否则它将返回 `false`。当 `for in` 循环结束时，`movieCount` 和 `songCount` 将包含在这些类型中找到的所有\
    \ `MediaItem` 实例的计数。\n\n## 向下转型\n\n在，特定类的变量或常量可能引用子类实例。如果你认为确实如此，你可以使用类型转换运算符（`as?`\
    \ 或 `as!`）对子类类型执行向下转型。\n\n向下转型并不总是成功的，类型转换运算符有两种不同的形式。条件形式 `as?` 会返回一个可选值（optional），该可选值将是你尝试向下转型的类型。第二种形式是强制形式\
    \ `as!`。结果将作为一个单一复合操作被强制解包，并尝试向下转型。\n\n如果你不确定向下转型的成功与，可以使用类型转换运算符（`as?`），这是它的条件形式。这种运算符的形式总是返回一个可选值，在向下转型失败的情况下，该值将为\
    \ `nil`。通过这，你可以检查向下转型是否成功。\n\n如果你确定向下转型的成功与，可以使用类型转换运算符（`as!`），这是它的强制形式。如果你向下转型一个错误的类类型，运算符将触发运行时错误。\n\
    \n下面的示例将遍历 `library` 中的每个 `MediaItem`，然后为每个项目打印相应的描述。为了做到这一点，它必须访问每个项目，而不仅仅是作为\
    \ `MediaItem`，而是作为真正的 `Song` 或 `Movie`。为了这样做，它将不能仅仅作为 `MediaItem` 访问每个项目，而是作为真正的\
    \ `Song` 或 `Movie` 访问。在下面的示例中，库中的每个 `MediaItem` 可能是 `Song` 或 `Movie`。我们无法提前知道实际的类，以便使用它。在这种情况下，使用类型转换运算符（`as?`）的条件形式是合适的。\n\
    \n```swift\nfor item in library {\n  if let movie = item as? Movie {\n    print(\"\
    Movie: '\\(movie.name)', dir. \\(movie.director)\")\n  } else if let song = item\
    \ as? Song {\n    print(\"Song: '\\(song.name)', by \\(song.artist)\")\n  }\n\
    }\n// Movie: Avatar, dir. James Cameroon\n// Song: They Don’t Care About Us, by\
    \ Michael Jackson\n// Movie: The Lord of the Rings, dir. Peter Jackson\n// Song:\
    \ Bohemian Rhapsody, by Freddie Mercury\n// Song: summer of 69, by Brian Adams\n\
    ```\n\n上面的示例开始尝试将 `item` 向下转型为 `Movie`。`Movie` 可能是 `MediaItem` 实例，同样 `Song` 也是。由于这种不确定性，当尝试向下转型到子类类型时，类型转换运算符\
    \ `as?` 会返回一个可选值。`as? Movie` 项目的结果是 `Movie?` 类型或可选的 `movie`。\n\n如果向下转型成功，将使用电影属性打印\
    \ `Movie` 实例的描述。类似的原理被用于检查 `Song` 实例，以便每次在库中找到 `Song` 后绘制适当的描述。\n\n注意：类型转换不会修改实例或更改值。底层的实例将是相同的。例如，只是被访问并像要转换的实例类型一样被处理。\n\
    \n## Any 和 AnyObject 的类型转换\n\nSwift 提供了两个特殊的类型别名来处理非特定类型：\n\n`AnyObject` 可以表示任何类类型的实例。\n\
    \n`Any` 可以表示任何类型的实例，包括函数类型。\n"
- fmt: "\nNote: Use `Any` and `AnyObject` only when you explicitly need the behavior\
    \ and capabilities they provide. It is always better to be specific about the\
    \ types you expect to work with in your code.\n\n### AnyObject\n\nWhen working\
    \ on the Cocoa APIs, it is only normal to receive the `AnyObject` type array,\
    \ or “an array of values of any object type”. The reason for this is that there\
    \ are no explicitly typed arrays in Objective-C. But, if you are confident about\
    \ the object type present in an array like that, from the API information that\
    \ the array provided, you can use the `as!` typecast operator, a forced version,\
    \ for downcasting every item in the array to a class type more specific than the\
    \ `AnyObject`, without optional unwrapping.\n\nA `AnyObject` type array will be\
    \ defined by the below example and three instances of the class `Movie` will be\
    \ added.\n\n```swift\nlet someObjects: [AnyObject] = [\n    Movie(name: \"2001:\
    \ A Space Odyssey\", director: \"Stanley Kubrick\"),\n    Movie(name: \"Moon\"\
    , director: \"Duncan Jones\"),\n    Movie(name: \"Alien\", director: \"Ridley\
    \ Scott\")\n]\n```\n\nAs this array only contains `Movie` instances, it can be\
    \ directly downcasted and unwrapped into a non-optional `Movie` using the `as!`\
    \ typecast operator (forced version).\n\n```swift\nfor object in someObjects {\n\
    \    let movie = object as! Movie\n    print(\"Movie: '\\(movie.name)', dir. \\\
    (movie.director)\")\n}\n// Movie: '2001: A Space Odyssey', dir. Stanley Kubrick\n\
    // Movie: 'Moon', dir. Duncan Jones\n// Movie: 'Alien', dir. Ridley Scott\n```\n\
    \nInstead of downcasting each item separately, the array `someObjects` can be\
    \ downcasted to the `[Movie]` type, for short forms of the loop:\n\n```swift\n\
    for movie in someObjects as! [Movie] {\n    print(\"Movie: '\\(movie.name)', dir.\
    \ \\(movie.director)\")\n}\n// Movie: '2001: A Space Odyssey', dir. Stanley Kubrick\n\
    // Movie: 'Moon', dir. Duncan Jones\n// Movie: 'Alien', dir. Ridley Scott\n```\n\
    \n### Any\n\nIn this example, we will use `Any` to work along with a combination\
    \ of different types, which include non-class types and function types. An array\
    \ called `things` will be created in this example and it can store the type `Any`\
    \ values.\n\n```swift\nvar things = [Any]()\nthings.append(0)\nthings.append(0.0)\n\
    things.append(42)\nthings.append(3.14159)\nthings.append(\"hello\")\nthings.append((3.0,\
    \ 5.0))\nthings.append(Movie(name: \"Ghostbusters\", director: \"Ivan Reitman\"\
    ))\nthings.append({ (name: String) -> String in \"Hello, \\(name)\" })\n```\n\n\
    Two `Int` values, a `String` value, two `Double` values, the movie “Ghostbusters”,\
    \ a tuple of type `(Double, Double)`, and a closure expression which takes and\
    \ returns a `String` value are contained in the `things` array.\n\nThe `is` and\
    \ `as` operators can be used with the cases in the `switch` statement for discovering\
    \ a specific type of variable or a constant, which is only to be of `AnyObject`\
    \ type or `Any` type. The below example iterates over the `things` array items\
    \ and it will then query each item type with the `switch` statement. Several cases\
    \ of the `switch` statement bind a constant of a specific type with their matched\
    \ value, for enabling the value to be printed:\n\n```swift\nfor thing in things\
    \ {\n    switch thing {\n        case 0 as Int:\n            print(\"zero as an\
    \ Int\")\n        case 0 as Double:\n            print(\"zero as a Double\")\n\
    \        case let someInt as Int:\n            print(\"an integer value of \\\
    (someInt)\")\n        case let someDouble as Double where someDouble > 0:\n  \
    \          print(\"a positive double value of \\(someDouble)\")\n        case\
    \ is Double:\n            print(\"some other double value that I don't want to\
    \ print\")\n        case let someString as String:\n            print(\"a string\
    \ value of \\\"\\(someString)\\\")\n        case let (x, y) as (Double, Double):\n\
    \            print(\"an (x, y) point at \\(x), \\(y)\")\n        case let movie\
    \ as Movie:\n            print(\"a movie called '\\(movie.name)', dir. \\(movie.director)\"\
    )\n        case let stringConverter as String -> String:\n            print(stringConverter(\"\
    Michael\"))\n        default:\n            print(\"something else\")\n    }\n\
    }\n// zero as an Int\n// zero as a Double\n// an integer value of 42\n// a positive\
    \ double value of 3.14159\n// a string value of \"hello\"\n// an (x, y) point\
    \ at 3.0, 5.0\n// a movie called 'Ghostbusters', dir. Ivan Reitman\n// Hello,\
    \ Michael\n```\n\n### Nested Types\n\nEnumerations are usually created by supporting\
    \ the functionality of a specific class or a structure. Similarly, we can define\
    \ the utility structures and classes for our convenience and they will be purely\
    \ used within a more complex type context. For accomplishing this, you can define\
    \ nested types in swift. Here, you can nest to the supporting structures, classes\
    \ and enumerations inside the definition of the type, which they support.\n\n\
    By writing the definition of the type inside the outer braces of the time, which\
    \ it supports, you can nest a type inside another. There is no limit for nesting\
    \ types and it can be taken to as many levels as required.\n\n#### Nested Types\
    \ in Action\n\nIn the example given below, a structure called `BlackjackCard`\
    \ is defined. This structure models a playing card just like the one used in the\
    \ blackjack game. `Suit` and `Rank` are they to nested enumeration types contained\
    \ in the blackjack structure.\n\nThe ace cards in blackjack can have the value\
    \ of 1 or 11. A structure call `Values` is used for representing this feature\
    \ and this is nested inside the `Rank` enumeration:\n\n```swift\nstruct BlackjackCard\
    \ {\n    // nested Suit enumeration\n    enum Suit: Character {\n        case\
    \ Spades = \"♠\", Hearts = \"♡\", Diamonds = \"♢\", Clubs = \"♣\"\n    }\n   \
    \ // nested Rank enumeration\n    enum Rank: Int {\n        case Two = 2, Three,\
    \ Four, Five, Six, Seven, Eight, Nine, Ten\n        case Jack, Queen, King, Ace\n\
    \        struct Values {\n            let first: Int, second: Int?\n        }\n\
    \        var values: Values {\n            switch self {\n                case\
    \ .Ace:\n                    return Values(first: 1, second: 11)\n           \
    \     case .Jack, .Queen, .King:\n                    return Values(first: 10,\
    \ second: nil)\n                default:\n                    return Values(first:\
    \ self.rawValue, second: nil)\n            }\n        }\n    }\n    // BlackjackCard\
    \ properties and methods\n    let rank: Rank, suit: Suit\n    var description:\
    \ String {\n        var output = \"suit is \\(suit.rawValue),\"\n        output\
    \ += \" value is \\(rank.values.first)\"\n        if let second = rank.values.second\
    \ {\n            output += \" or \\(second)\"\n        }\n        return output\n\
    \    }\n}\n```\n\nThe enumeration `Suit` is used for describing the four playing\
    \ card suits along with the `Character` value which represents their symbol.\n\
    \nAll possible card ranks are described by the `Rank` enumeration along with a\
    \ raw `Int` value, which is used for representing their face value excluding the\
    \ Ace, Jack, King and Queen Jack cards.\n\nA nested structure called `Values`\
    \ is nested within the `Rank` enumeration as mentioned above. Almost all of the\
    \ cards except the Ace, which has two values, have a single value and this structure\
    \ encapsulates this fact. The two properties are defined by the `Values` structure\
    \ for representing this:\n\n`first`, of type `Int`\n\n`second`, of type `Int?`,\
    \ or “optional Int”\n\nA computed property, `Values`, is a defined in the `Rank`\
    \ and this returns the `Values` structure’s instance. The rank of the card will\
    \ be considered by this computed property and basing on the rank, a new instance\
    \ of `Values` will be initialized with appropriate values.\n"
  raw: "Note: Use Any and AnyObject only when you explicitly need the behavior and\
    \ capabilities they provide. It is always better to be specific about the types\
    \ you expect to work with in your code.\n\n### AnyObject\n\nWhen working on the\
    \ Cocoa APIs, it is only normal to receive the [AnyObject] type array, or “an\
    \ array of values of any object type”. The reason for this is that there are no\
    \ explicitly typed arrays in Objective-C. But, if you are confident about the\
    \ object type present in an array like that, from the API information that the\
    \ array provided, you can use the as! typecast operator, a forced version, for\
    \ downcasting every item in the array to a class type more specific than the AnyObject,\
    \ without optional unwrapping.\n\nA [AnyObject] type array will be defined by\
    \ the below example and three instances of the class Movie will be added.\n\n\
    *   let someObjects: [AnyObject] = [\n\n*   Movie(name: \"2001: A Space Odyssey\"\
    , director: \"Stanley Kubrick\"),\n\n*   Movie(name: \"Moon\", director: \"Duncan\
    \ Jones\"),\n\n*   Movie(name: \"Alien\", director: \"Ridley Scott\")\n\n*   ]\n\
    \nAs this array only contains Movie instances, it can be directly downcasted and\
    \ unwrapped into a non-optional Movie using the as! typecast operator (forced\
    \ version).\n\n*   for object in someObjects {\n\n*   let movie = object as! Movie\n\
    \n*   print(\"Movie: '\\(movie.name)', dir. \\(movie.director)\")\n\n*   }\n\n\
    *   // Movie: '2001: A Space Odyssey', dir. Stanley Kubrick\n\n*   // Movie: 'Moon',\
    \ dir. Duncan Jones\n\n*   // Movie: 'Alien', dir. Ridley Scott\n\nInstead of\
    \ downcasting each item separately, the array someObjects can be downcasted to\
    \ the [Movie] type, for short forms of the loop:\n\n*   for movie in someObjects\
    \ as! [Movie] {\n\n*   print(\"Movie: '\\(movie.name)', dir. \\(movie.director)\"\
    )\n\n*   }\n\n*   // Movie: '2001: A Space Odyssey', dir. Stanley Kubrick\n\n\
    *   // Movie: 'Moon', dir. Duncan Jones\n\n*   // Movie: 'Alien', dir. Ridley\
    \ Scott\n\n## Any\n\nIn this example, we will use Any to work along with a combination\
    \ of different types, which include non-class types and function types. An array\
    \ called things will be created in this example and it can store the type Any\
    \ values.\n\n*   var things = [Any]()\n\n*   things.append(0)\n\n*   things.append(0.0)\n\
    \n*   things.append(42)\n\n*   things.append(3.14159)\n\n*   things.append(\"\
    hello\")\n\n*   things.append((3.0, 5.0))\n\n*   things.append(Movie(name: \"\
    Ghostbusters\", director: \"Ivan Reitman\"))\n\n*   things.append({ (name: String)\
    \ -> String in \"Hello, \\(name)\" })\n\n*   Two Int values, a String value, two\
    \ Double values, the movie “Ghostbusters”, a tuple of type (Double, Double), and\
    \ a closure expression which takes and returns a String value are contained in\
    \ the things array.\n\nThe is and as operators can be used with the cases in the\
    \ switch statement for discovering a specific type of variable or a constant,\
    \ which is only to be of AnyObject type or Any type. The below example iterates\
    \ over the things array items and it will then query each item type with the switch\
    \ statement. Several cases of the switch statement bind a constant of a specific\
    \ type with their matched value, for enabling the value to be printed:\n\n*  \
    \ for thing in things {\n\n*   switch thing {\n\n*   case 0 as Int:\n\n*   print(\"\
    zero as an Int\")\n\n*   case 0 as Double:\n\n*   print(\"zero as a Double\")\n\
    \n*   case let someInt as Int:\n\n*   print(\"an integer value of \\(someInt)\"\
    )\n\n*   case let someDouble as Double where someDouble > 0:\n\n*   print(\"a\
    \ positive double value of \\(someDouble)\")\n\n*   case is Double:\n\n*   print(\"\
    some other double value that I don't want to print\")\n\n*   case let someString\
    \ as String:\n\n*   print(\"a string value of \\\"\\(someString)\\\"\")\n\n* \
    \  case let (x, y) as (Double, Double):\n\n*   print(\"an (x, y) point at \\(x),\
    \ \\(y)\")\n\n*   case let movie as Movie:\n\n*   print(\"a movie called '\\(movie.name)',\
    \ dir. \\(movie.director)\")\n\n*   case let stringConverter as String -> String:\n\
    \n*   print(stringConverter(\"Michael\"))\n\n*   default:\n\n*   print(\"something\
    \ else\")\n\n*   }\n\n*   }\n\n*   // zero as an Int\n\n*   // zero as a Double\n\
    \n*   // an integer value of 42\n\n*   // a positive double value of 3.14159\n\
    \n*   // a string value of \"hello\"\n\n*   // an (x, y) point at 3.0, 5.0\n\n\
    *   // a movie called 'Ghostbusters', dir. Ivan Reitman\n\n*   // Hello, Michael\n\
    \n### Nested Types\n\nEnumerations are usually created by supporting the functionality\
    \ of a specific class or a structure. Similarly, we can define the utility structures\
    \ and classes for our convenience and they will be purely used within a more complex\
    \ type context. For accomplishing this, you can define nested  types in swift.\
    \ Here, you can nest to the supporting structures, classes and enumerations inside\
    \ the definition of the type, which they support.\n\nBy writing the definition\
    \ of the type inside the outer braces of the time, which it supports, you can\
    \ nest a type inside another. There is no limit for nesting types and it can be\
    \ taken to as many levels as required.\n\nNested Types in Action\n\nIn the example\
    \ given below, a structure called BlackjackCard is defined. This structure models\
    \ a playing card just like the one used in the blackjack game. Suit and Rank are\
    \ they to nested enumeration types contained in the blackjack structure.\n\nThe\
    \ ace cards in blackjack can have the value of 1 or 11\\. A structure call Values\
    \ is used for representing this feature and this is nested inside the Rank enumeration:\n\
    \n*   struct BlackjackCard {\n\n*   // nested Suit enumeration\n\n*   enum Suit:\
    \ Character {\n\n*   case Spades = \"♠\", Hearts = \"♡\", Diamonds = \"♢\", Clubs\
    \ = \"♣\"\n\n*   }\n\n*   // nested Rank enumeration\n\n*   enum Rank: Int {\n\
    \n*   case Two = 2, Three, Four, Five, Six, Seven, Eight, Nine, Ten\n\n*   case\
    \ Jack, Queen, King, Ace\n\n*   struct Values {\n\n*   let first: Int, second:\
    \ Int?\n\n*   }\n\n*   var values: Values {\n\n*   switch self {\n\n*   case .Ace:\n\
    \n    *   return Values(first: 1, second: 11)\n\n*   case .Jack, .Queen, .King:\n\
    \n    *   return Values(first: 10, second: nil)\n\n*   default:\n\n    *   return\
    \ Values(first: self.rawValue, second: nil)\n\n*   }\n\n*   }\n\n*   }\n\n  //\
    \ BlackjackCard properties and methods\n\n*   let rank: Rank, suit: Suit\n\n*\
    \   var description: String {\n\n*   var output = \"suit is \\(suit.rawValue),\"\
    \n\n*   output += \" value is \\(rank.values.first)\"\n\n*   if let second = rank.values.second\
    \ {\n\n*   output += \" or \\(second)\"\n\n*   }\n\n*   return output\n\n*   }\n\
    \n*   }\n\nThe enumeration Suit is used for describing the four playing card suits\
    \ along with the Character value which represents their symbol.\n\nAll possible\
    \ card ranks are described by the Rank enumeration along with a raw Int value,\
    \ which is used for representing their face value excluding the Ace, Jack, King\
    \ and Queen and Jack cards.\n\nA nested structure called Values is nested within\
    \ the Rank enumeration as mentioned above. Almost all of the cards except the\
    \ Ace, which has two values, have a single value and this structure encapsulates\
    \ this fact. The two properties are defined by the Values structure for representing\
    \ this:\n\nfirst, of type Int\n\nsecond, of type Int?, or “optional Int”\n\nA\
    \ computed property, Values, is a defined in the Rank and this returns the Values\
    \ structure’s instance. The rank of the card will be considered by this computed\
    \ property and basing on the rank, a new instance of Values will be initialized\
    \ with appropriate values. Special values will be used for the Ace, King, Queen\
    \ and Jack cards. It will use the raw Int value of rank for all the other numeric\
    \ cards.\n\nSuit and Rank are the two properties of the structure BlackjackCard.\
    \ A computed property, description is also defined in it. This uses the store\
    \ the values from the Rank and Suit for building a description of the value and\
    \ name of the card. An optional binding will be used by the description properly\
    \ for checking if there is a 2nd value to be displayed. If there are any, it will\
    \ insert additional description detail for it."
