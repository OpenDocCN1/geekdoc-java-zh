    *   printAndCount("hello, world")


    *   // prints "hello, world" and returns a value of 12


    *   printWithoutCounting("hello, world")


    *   // prints "hello, world" but does not return a value


    The function printAndCount(_:), which is the first function, will print a string
    and it will return the character count as Int. The function printWithoutCounting,
    which is the second function, will call the first function but it will ignore
    the return value of the first function. The first function will print the message
    after calling the second function. In this case, the return value will not be
    used.


    Note: When a function says that it doesn''t return a value, the values return
    can be ignored. But if a function says that it will return a value, it must return
    a value. A compile time error will be displayed when a function which has a return
    type define doesn''t allow the control to go to the bottom without returning the
    value.


    Functions with Multiple Return Values


    For a function, you can give the return type by using a tuple type for returning
    multiple values, as they don''t return a value for part of a single compound return
    value.


    The below example will define a minMax(_:) function. This function will find the
    Int values that are smallest and largest in the given array:


    *   func minMax(array: [Int]) -> (min: Int, max: Int) {


    *   var currentMin = array[0]


    *   var currentMax = array[0]


    *   for value in array[1..<array.count] {


    *   if value < currentMin {


    *   currentMin = value


    *   } else if value > currentMax {


    *   currentMax = value


    *   }


    *   }


    *   return (currentMin, currentMax)


    *   }


    A tuple consisting of two Int values will be returned by the function minMax(_:).
    The returned values are named as min and max. When querying the return value of
    the function, these can be accessed by using their name.


    By setting working variables called the currentMin and currentMax, the body of
    the function minMax(_:) will start. The currentMin and currentMax variables are
    used for setting the array''s first integer.  The function will iterate the remaining
    values from the array and compares them if they are smaller or larger than currentMin
    and currentMax values respectively. Finally, the minimum and maximum values will
    be obtained and they will be returned as a tuple with two Int values.


    The tuple members can be accessed using the dot syntax, as they have named as
    a part of the return type of the function. They are accessed for retrieving the
    maximum and minimum values found:


    let bounds = minMax([8, -6, 2, 109, 3, 71])


    print("min is \(bounds.min) and max is \(bounds.max)")


    // prints "min is -6 and max is 109"


    # Chapter 3:  Introduction to Playgrounds


    Without any further ado, I want you to start up XCode. We are going to dive straight
    into setting up for your first program and we do this in Playground. Playground
    is a new feature, a way of being able to test out your code and see if it all
    works how you want it to, before you go ahead and do it for real. So, let’s get
    started:


    1.  Start XCode up and then open File\New\File


    2.  Choose iOS\Source\Playground


    3.  Click Next


    4.  You need to name your file so call it Swifttutorial.playground


    5.  Now click on Create and save the file where you will remember it


    6.  Make sure the file is empty – you want to start with a completely clean slate.


    7.  Now open up your file and type the following into your program. As you do,
    the result of each line will show up in the sidebar so you can see exactly what
    is going on:


