    \ = detail.title\n        }\n    }\n}\n```\n\nThe changes are inside the `IF`\
    \ statement which is inside the wrapping `IF` statement. You have also removed\
    \ the completely pointless use of `self` that was in front of all of the properties.\n\
    \nSo, first you need to unwrap the optional `UITextView`, even though it has already\
    \ been implicitly unwrapped. Then, it needs to be assigned to the constant called\
    \ `notes`, allowing you set the text n `notesView` as the notes property of the\
    \ detail item, which is a `Task`.\n\nNow, when you run the application you will\
    \ see a basic task management application that you can happily play around with\
    \ to your hearts content.\n\nCongratulations! You have successfully built a new\
    \ iOS application using Swift. While it isn’t likely to be the next big thing,\
    \ it is a fantastic point for you to start learning from, to start understanding\
    \ what it’s like to use Swift and `XCode` to build an app. If you were to build\
    \ the same app using Objective C you would see a whole lot more code than you\
    \ have in this application and, perhaps more importantly, a lot of far less expressive\
    \ code.\n\nIn the final chapter, I am going to introduce you to Swift 2.\n\n#\
    \ Chapter 10: What’s New in Swift 2\n\nSwift 2 brings many new features that make\
    \ the language more powerful and expressive. One of the most significant changes\
