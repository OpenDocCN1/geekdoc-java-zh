    will be rolled up to the definition of the function. The return type of function
    will be indicated using the return arrow ->. This will be followed by the return
    type name.


    The definition of the function will define the task of the function, the input
    of the function and the return type of the function when its task is done. You
    can unambiguously call the function from any place from your code using the definition:


    print(sayHello("Chad"))


    // prints "Hello, Chad!"


    print(sayHello("Bruce"))


    // prints "Hello, Bruce!"


    You can call the function sayHello(_:), by passing a string argument inside the
    parentheses, like sayHello("Chad"). As the return type of the function is a string
    value, for printing the string, the function can be wrapped inside the call to
    the function print(_:separator:terminator:) for checking the return value.


