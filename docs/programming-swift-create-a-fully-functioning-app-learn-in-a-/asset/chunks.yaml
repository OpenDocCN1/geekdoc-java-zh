    \   let possibleInferred = [0.15, 0.18, 0.20]\n    let possibleExplicit:[Double]\
    \ = [0.15, 0.18, 0.20]\n    // 2\n    var retval = [Int: Double]()\n    for possibleTip\
    \ in possibleInferred {\n        let intPct = Int(possibleTip*100)\n        //\
    \ 3\n        retval[intPct] = calcTipWithTipPct(possibleTip)\n    }\n    return\
    \ retval\n}\n```\n\nOnce again, you will see an error but we will fix this now.\
    \ You need to modify the final line in your file to read:\n\n```swift\ntipCalc.returnPossibleTips()\n\
    ```\n\nCongratulations! You have created your first class in Swift!\n\n# Chapter\
    \ 6: Type Casting\n\nType casting is a be defined as a way of checking the instance\
