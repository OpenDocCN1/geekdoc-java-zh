    swift. With this, it is possible to pass a function as a parameter to another
    function and you can also return functions from other functions. Swift allows
    you to write functions inside other functions. With this, encapsulation is possible
    and useful functionalities can be nested within other functions.


    ### Defining and Calling Functions


