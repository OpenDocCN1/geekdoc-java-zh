    # Part 2: Using the XCode Editing Tools


    In this chapter, we will cover four elements of using the XCode:


    1.  XCode editing tools


    2.  Code completion features


    3.  Code correction with Fix‐It


    4.  Working with code snippets


    As you can see in that chapter, a great deal of your Swift XCode development involves
    the graphical user interface of XCode. A lot of the work — particularly at the
    beginning of a project — is graphical or involves checkboxes.


    In Chapter 4, I show you how to write and test code — particularly small snippets
    of code — in a playground. This helps you learn Swift syntax and allows you to
    test out code fragments before you type them (or copy‐and‐paste them) into your
    project files.


    Now, in this chapter, I introduce XCode’s editing tools. Here, you’ll write code
    in the way you may have written it in your beginning programming class in school
    (that is, typing in code rather than drawing the interface and using XCode checkboxes
    and other graphical elements to construct your app visually). The focus in this
    chapter is on the XCode tools that assist you with writing code. Much of what
    XCode does for you in regard to typing and editing text is made possible by the
    fact that it observes every keystroke and keeps track of the syntax of the terms
    you type (or copy‐and‐paste).


    With the tools and techniques you find in these first three chapters, you can
    create your first Swift app — the Locatapp example app used throughout this book.
    (In case you haven’t seen it yet, you can look at Figures 1‐1 through 1‐5 in Chapter 1
    to see where you’re headed.)


    # Chapter 4:  Classes and Methods


    When you start working in Swift, you will be creating classes and methods on a
    regular basis so let’s take a look at what they are and how they work. First clear
    out everything that is in your playground file – we need a clean sheet to work
    on again. Now, this is where you get to start creating your very first app – a
    Tip Calculator. You will build this app one piece of code at a time and I will
    explain each piece as we go along. Ready?  Type the following into your playground
    file:


    *   // 1


    *   class TipCalculator {


    *   }


    The first thing you are doing is creating a class and to do this you simply type
    class and follow it with the name, in this case, TipCalculator. Follow this with
    curly braces.


    Inside the curly braces, type in this code:


    *   // 2


    *   let total: Double


    *   let taxPct: Double


    *   let subtotal: Double


    You will see some errors appear when you type this in but don’t worry about them,
    they will be fixed soon enough. What you have done here is create properties on
    the class, pretty much the same as you create constants or variables. You have
    created three properties – the total of the bill before after tax is added, the
    tax percentage added and the amount of the bill before tax is added.


    The reason you are getting errors at this stage is because you must declare properties
    with an initial value and we didn’t do that for this.


    Following on from the code you just typed, add in these lines, staying inside
    the curly braces:


    *   // 3


    *   init(total: Double, taxPct: Double) {


    *   self.total = total


    *   self.taxPct = taxPct


    *   subtotal = total / (taxPct + 1)


    *   }


    This creates the initializer for the class and these are always named as init
    in Swift. This initializer takes two parameters and, because they both have the
    same name, they are distinguished by the addition of the self prefix.


    Staying inside those curly braces, add this to your code:


    *   // 4


    *   func calcTipWithTipPct(tipPct: Double) -> Double {


    *   return subtotal * tipPct


    *   }


    Here you have used the func keyword to declare a method followed by the parameters
    – here you must be explicit with types and you follow it up with the return type.
    This is a simple function that multiplies the subtotal of the bill by the tip
    percentage. Continuing on from that, add this code:


    *   // 5


    *   func printPossibleTips() {


    *   println("15%: \(calcTipWithTipPct(0.15))")


    *   println("18%: \(calcTipWithTipPct(0.18))")


    *   println("20%: \(calcTipWithTipPct(0.20))")


    You have created a new method that will print out 3 possible tip values. Note
    that when a method is called on an instance of a class, the initial parameter
    doesn’t need naming but the rest do. Now, add this code in, this time, after the
    curly braces:


    *   // 6


    *   let tipCalc = TipCalculator(total: 33.25, taxPct: 0.06)


    *   tipCalc.printPossibleTips()


    In the final step, you have created an instance of the tip calculator and you
    have called the method to show the possible tip values.


    This is what your code should look like now:


    *   // 1


    *   class TipCalculator {


    *   // 2


    *   let total: Double


    *   let taxPct: Double


    *   let subtotal: Double


    *   // 3


    *   init(total: Double, taxPct: Double) {


    *   self.total = total


    *   self.taxPct = taxPct


    *   subtotal = total / (taxPct + 1)


    *   }


    *   // 4


    *   func calcTipWithTipPct(tipPct: Double) -> Double {


    *   return subtotal * tipPct


    *   }


    *   // 5


    *   func printPossibleTips() {


    *   println("15%: \(calcTipWithTipPct(0.15))")


    *   println("18%: \(calcTipWithTipPct(0.18))")


    *   println("20%: \(calcTipWithTipPct(0.20))")


    *   }


    *   }


    *   // 6


    *   let tipCalc = TipCalculator(total: 33.25, taxPct: 0.06)


    *   tipCalc.printPossibleTips()


    # Chapter 5: Arrays and For Loops


    You’ve probably noticed quite a bit of duplication in the above code. This is
    because you have called the method calcTipWithTotal a number of times, showing
    different percentages. This is where arrays come in and allow you to cut down
    on the duplication.


    Go to where you have typed printPossibleTips and replace the contents:


    *   let possibleTipsInferred = [0.15, 0.18, 0.20]


    *   let possibleTipsExplicit:[Double] = [0.15, 0.18, 0.20]


    *   You have created an array of doubles, using both inferred and explicit typing.
    Now add the following lines underneath that:


    *   for possibleTip in possibleTipsInferred {


    *   println("\(possibleTip*100)%: \(calcTipWithTipPct(possibleTip))")


    *   }


    ## Dictionaries


    We are going to make one last change to your code – rather than just showing your
    tips printed out, you can instead create a dictionary that contains all the results.


    Got to where you have typed printPossibleTips and delete the method. Replace it
    with:


    *   // 1


    *   func returnPossibleTips() -> [Int: Double] {


    *   let possibleTipsInferred = [0.15, 0.18, 0.20]


    *   let possibleTipsExplicit:[Double] = [0.15, 0.18, 0.20]


    *   // 2


    *   var retval = [Int: Double]()


    *   for possibleTip in possibleTipsInferred {


    *   let intPct = Int(possibleTip*100)


    *   // 3


    *   retval[intPct] = calcTipWithTipPct(possibleTip)


    *   }


    *   return retval


    *   }


    Once again, you will see an error but we will fix this now. You need to modify
    the final line in your file to read:


    *   tipCalc.returnPossibleTips()


    Congratulations! You have created your very first class in Swift!


    # Chapter 6: Type Casting


    Type casting is a can be defined as a way of checking the instance type, or something
    which treats that as a different subclass or superclass from a different place
    in its hierarchy.


    In Swift, we implement typecasting by using the is and as operators. These operators
    provide users with expressive and simple ways to check the value type or for casting
    a value into a different type.


    Typecasting can also be used for checking if a type conforms to a given protocol,
    as described in the protocol conformance checking.


    Defining a Class Hierarchy for Type Casting'
