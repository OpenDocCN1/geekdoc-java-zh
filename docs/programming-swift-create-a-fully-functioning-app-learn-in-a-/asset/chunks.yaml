    \ 中设置 `subtotal` 的整行代码，并删除文件中的任何注释。\n\n完成后，你的文件看起来应该是这样的：\n\n```swift\n//\n//\
    \ TipCalculatorModel.swift\n// TipCalculator\n//\n// Created by Main Account on\
    \ 12/18/14.\n// Copyright (c) 2014 Razeware LLC. All rights reserved.\n//\nimport\
    \ Foundation\n\nclass TipCalculatorModel {\n    var total: Double\n    var taxPct:\
    \ Double\n    var subtotal: Double {\n        get {\n            return total\
    \ / (taxPct + 1)\n        }\n    }\n\n    init(total: Double, taxPct: Double)\
    \ {\n        self.total = total\n        self.taxPct = taxPct\n    }\n\n    func\
    \ calcTipWithTipPct(tipPct: Double) -> Double {\n        return subtotal * tipPct\n\
    \    }\n\n    func returnPossibleTips() -> [Int: Double] {\n        let possibleTipsInferred\
    \ = [0.15, 0.18, 0.20]\n        let possibleTipsExplicit:[Double] = [0.15, 0.18,\
    \ 0.20]\n        var retval = [Int: Double]()\n        for possibleTip in possibleTipsInferred\
    \ {\n            let intPct = Int(possibleTip*100)\n            retval[intPct]\
    \ = calcTipWithTipPct(possibleTip)\n        }\n        return retval\n    }\n\
    }\n```\n\n现在你的应用模型已经准备好了，是时候查看视图了！\n\n# 第 8 章：Storyboard 和 Interface Builder 简介\n\
    \n你的用户界面将在一个名为 Storyboard 的工具中创建，而 XCode 包含了 Interface Builder，这是一个非常实用的工具，可以让你轻松地编辑\
    \ Storyboard。Interface Builder 允许你通过拖放来布局所有内容——按钮、标签、文本字段以及应用中的所有其他控件。这些被称为视图（Views）。查看\
    \ XCode 的左侧并点击 `Main.storyboard`。这将打开 Interface Builder。由于内容非常详细，因此我们将一次介绍屏幕的一个部分：\n\
    \n- 左侧是**项目导航器（Project Navigator）**——你的项目文件在这里显示。\n- Interface Builder 左侧是**文档大纲（Document\
