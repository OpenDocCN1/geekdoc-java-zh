    # Introduction


    In 2014, Apple changed their programming language, introducing Swift to build
    on the very best features of C and Objective-C without all the constraints of
    C Compatibility. Swift has been in the making for many years and brings new safe
    patterns of programming to the table, along with modern features that make it
    easy to program, far more flexible than ever before and a lot more fun to use.


    Swift will probably look and feel very familiar to old hands at Objective-C. That’s
    because it takes on the readability of named parameters and the power of the object
    model within Objective –C. And it brings a lot of new features the computer programming
    for iOS and OS X operating systems.


    Swift is incredibly user-friendly and is perfect for new programmers to learn.
    Included is support for playgrounds, which is an innovative new feature that lets
    you experiment with your code, see it running and see the results before you go
    to all the expense of building your app and running it.


    It combines modern language with wisdom garnered from the wide culture of Apple
    engineering. The compiler is fully performance optimized and the language is development
    optimized without any compromises. It is designed to go from the simple “Hello,
    World!” app right through to building a complete operating system and this is
    what makes it the language to learn, the best investment you could ever make for
    the future.


    Just like everything else they produce, Apple will ensure that Swift is kept fully
    updated with the latest features and the best capabilities. The idea of this book
    is to give you an overview of what Swift does now and help you to create your
    very first iOS/OS X app in the form of a Tips Calculator.


    If you are ready to start learning the computer language of the future, head on
    to the very first chapter and let’s see what you can do. Please be sure that you
    have the very latest version of XCode before you begin – you can get it from the
    Mac OS X store – as we are going to delve straight into programming.


    # Chapter 1: A Basic Comparison of Swift and Objective C


    Many of you are probably very familiar with Objective C programming language and
    may be wondering what, if any, differences there are between that and Swift. Sift
    is a recent and modern programming language that has all the power for Objective
    C but doesn’t have all the baggage that the older language comes with. So, before
    we get stuck into learning how to use Swift, I wanted to just give you a basic
    comparison of the two languages. This is NOT designed to be a “them and us” between
    Microsoft and Apple – there are many programmers who use C on a daily basis and
    I want to show you what Swift can offer compared to C. So, let the code start
    talking.


    ## Code Comments


    Both Swift and C support the same comments syntax – the all too familiar C comment:


    *   // code comment


    *   /* multi line


    *   code comment */


    ## Declaring Constants and Variables


    Like C, Swift is a very type safe language. Swift also support type inference
    so, when you are declaring the variables, you do not need to specify the type
    as the computer will detect, or infer, the type. It does this by evaluating the
    variable assignment. C is a little more on the verbose side when it comes to declaring
    constants but both C and Swift are as elegant as one anther when it comes to using
    type inference to declare variables:


    *   // Declare Constant


    *   // C#


    *   const int legalAge = 18;


    *   // Swift


    *   let legalAge = 18


    *   // Declare Variable


    *   // C#


    *   var legalAge = 18;


    *   // Swift


    *   var legalAge = 18'
