  raw: 'What you are going to do is move your playground file to a swift file because
    you cannot call up code that is in a playground file – these are just for testing
    purposes.


    Open TipCalculator.swift


    Copy the class from your playground file (not the testing lines at the bottom)
    into the Swift file and make these changes


    Rename the class to TipCalculatorModel


    You need to change total and taxPct to variables


    You will need to change subtotal to a computed property and you do this by replacing
    the subtotal property with the following code:


    *   var subtotal: Double {


    *   get {


    *   return total / (taxPct + 1)


    *   }


    *   }


    Computed properties don’t store values, they are computed on other values. Here
    you are going to be calculating the subtotal whenever it is accessed, going on
    the values of total and taxPct


    Next, you need to delete the entire line that sets subtotal in init and get rid
    of any comments in the file.


    When you are finished, your file should look like:


    *   //


    *   //  TipCalculatorModel.swift


    *   //  TipCalculator


    *   //


    *   //  Created by Main Account on 12/18/14.


    *   //  Copyright (c) 2014 Razeware LLC. All rights reserved.


    *   //


    *   import Foundation


    *   class TipCalculatorModel {


    *   var total: Double


    *   var taxPct: Double


    *   var subtotal: Double {


    *   get {


    *   return total / (taxPct + 1)


    *   }


    *   }


    *   init(total: Double, taxPct: Double) {


    *   self.total = total


    *   self.taxPct = taxPct


    *   }


    *   func calcTipWithTipPct(tipPct: Double) -> Double {


    *   return subtotal * tipPct


    *   }


    *   func returnPossibleTips() -> [Int: Double] {


    *   let possibleTipsInferred = [0.15, 0.18, 0.20]


    *   let possibleTipsExplicit:[Double] = [0.15, 0.18, 0.20]


    *   var retval = [Int: Double]()


    *   for possibleTip in possibleTipsInferred {


    *   let intPct = Int(possibleTip*100)


    *   retval[intPct] = calcTipWithTipPct(possibleTip)


    *   }


    *   return retval


    *   }


    *   }


    Now that your app model is ready, it’s time to look at views!


    # Chapter 8:  Introduction to Storyboards and Interface Builder


    Your user interface is going to be created in something called Storyboard and
    XCode includes Interface Builder, a neat tool that lets you easily edit Storyboards.
    Interface Builder lets you lay out everything – buttons, labels, text fields and
    all the other controls that are in your app by dragging and dropping. These are
    called Views. Look on the left hand side of XCode and click on Main.storyboard.
    This will bring up the Interface Builder. This is quite detailed so we will cover
    one part of the screen at once:


    On the left is Project Navigator – where your project files show up


    On the left of Interface Builder is Document Outline – your views can be seen
    at a glance for each screen of your app – make sure you click on the down arrows
    beside the items to see the entire document.


    At the moment, your app has just one view controller but we are going to be adding
    stuff into this very soon.


    Look to the left of your view controller, there is an arrow. This shows that this
    is the Initial View Controller – this is the first page displayed when your app
    opens. This can be changed by dragging the arrow to another view controller.


    Now look at the bottom of the Interface Builder – you will see the words “w Any”
    and “h Any”. This shows that your app is being edited to work on any size interface.


    At the top of the View Controller, there are three small icons – these represent
    the controller, First Responder and Exit. You don’t need to worry about these
    for the purpose of this tutorial.


    Look at the bottom right hand side of Interface Builder and you will see four
    icons that are related to Auto Layout – again, you will not be using those in
    this tutorial.


    At the top right hand side of Interface Builder there are Inspectors – these are
    for whatever has been selected in the Document Outline. See that there are several
    tabs – you will be making a good use of these in this tutorial.


    Last but not least, bottom right of the Interface Builder are the Libraries. These
    list the different types of view controllers that you can add into your app.


    ## Creating your Views


    If you remember, your TipCalculatorModel class has a pair of inputs – a tax percentage
    and a total. What would be good for users of your app is if they could type the
    total in using the numeric keyboard on their iPhone – that’s where a text field
    comes in handy. Because the tax percentage is generally restricted to a smaller
    value range, you will use a slider for that.


    As well as the text field and the slider, you will need a label for each one,
    a button that performs the calculation, a navigation bar showing the name of the
    app and a text field that displays the results. 


    If you are ready, let’s begin to build the user interface for your app, one piece
    at a time:


    1.  Navigation Bar – instead of directly adding this, go to the document outline
    and select the view controller. Now go to Editor\Embed In\Navigation Controller.
    This sets a navigation bar in your view controller – double click on it and input
    the text as Tip Calculator.


    2.  Labels – Go into the Object Library and drag a label in to the view controller.
    Double click the label and put the text as Bill Total (Post-Tax):.. Now select
    that label and go to the fifth tab on the Inspectors section – this is the size
    inspector. Set it as X=33 and Y=81\. Do the same for another label but set the
    text as Tax Percentage (0%):, X=20, and Y=120.


    3.  Text Field – go to the Object Library and drag a text field to the view controller.
    Click on the Attribute Inspector and set Keyboard Type=Decimal Pad. Go to the
    Size Inspector and set X=192, Y=77, and Width=392.


    4.  Slider – Go to the Object Factory and drag a slider in and then go to the
    Attribute Inspector and set Minimum Value=0, Maximum Value=10, and Current Value=6\.
    Then go to the Size Inspector and set X=190, Y=116, and Width=396


    5.  Button – Back to the Object Library and drag a button in. Double click on
    it and put the text to Calculate then set the Size Inspector to X=268 and Y=154


    6.  Text View – Drag a Text View from the Objects Library and then double click
    on it and delete the text that is there. Go to the Attributes Inspector and ensure
    that Editable and Selectable have not been checked. Go to the Size Inspector and
    set X=16, Y=192, Width=568, and Height=400.


    7.  Tap Gesture Recognizer - Back to the Object Library and drag in a Tap to Gesture
    Recognizer to the main view. This is going to tell when a user taps on the view
    to shut the keyboard down.


    8.  Auto-Layout – Interface Builder is great for building a good auto-layout constraint
    automatically. To do this, go to the Document Outline and click on Main View.
    Then click the third button in bottom right of the Interface Builder and select
    Add Missing constraints.


    Now you can build the app and run it on the iPhone 6 Simulator and you will see
    a working basic user interface!


    ## A View Controller Tour


    Ok, you have new created an app model and the app views so now it’s time to look
    at the view controller.


    Open ViewController.swift. This will show you the code for your view controller,
    or screen, in the app. This is the part that is responsible for managing communication
    between the model and the views. Look at the class and you will see the following
    code:


    *   // 1


    *   import UIKit


    *   // 2


    *   class ViewController: UIViewController {


    *   // 3


    *   override func viewDidLoad() {


    *   super.viewDidLoad()


    *   // Do any additional setup after loading the view, typically from a nib.


    *   }


    *   // 4


    *   override func didReceiveMemoryWarning() {


    *   super.didReceiveMemoryWarning()


    *   // Dispose of any resources that can be recreated.


    *   }


    *   }


    Now, you will see a few elements of code here that you are not yet familiar with
    so let’s look at them one at a time:'
