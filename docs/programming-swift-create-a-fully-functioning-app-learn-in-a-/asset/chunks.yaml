  trans: "\n你可以看到 `Printable` 已经更改为 `CustomStringConvertible`，并且大多数 `Foundation` 对象都遵循这一协议。通过协议扩展（protocol\
    \ extensions），你可以使用自定义功能扩展系统的大部分。\n\n而且，与其在 `enums`（枚举）、`structs`（结构体）和 `classes`（类）中添加一些自定义代码，你只需要编写一个实现，它就可以应用于多个类型。\n\
    \n## 杂锦箱 (Grab Bag)\n\n有很多新功能在路上，所以，与其现在一次过一遍所有的，我只想介绍其中的几个：\n\n- Objective C\
    \ 泛型 – Apple 已经开始对所有的 Objective C 代码进行注释，以便所有的 `Swift` 类型都能获得正确的可选性（optionality）。这现在通过\
    \ Objective C 泛型实现，为开发者提供了更好的类型提示。\n- 语法重命名 – `PrintIn` 在仅存在一年后就消失了，它变回了简单的 `Print`，并且它获得了一个默认的第二个参数——该参数设置为\
    \ true 取决定是否打印换行。`do` 关键字专注于错误处理作用域，而 `do-while` 循环已更改为 `repeat-while`。\n\n这些只是不久将来将出现的内容的一部分，随着时间的推移，可能会揭更多。在这个阶段，只能静观其变，但与此同时，我建议你在获得更新之前，充分利用时间，完全掌握\
    \ `Swift`。\n\n# 第 11 章：在 Swift 中创建应用程序\n\n## 简单计算器\n\n现在我们将查看创建一个简单计算器程序所需的步骤。\n\
    \n- 打开 `XCode`\n- 创建一个单视图应用程序（single view application）\n- 填写产品名称、组织名称以及组织标识符（identifier）。\n\
    - 我们将产品命名为 `iOS8SwiftCalculatorTutorial`。\n- 在语言（language）选项卡中选择 `swift`。\n- 在设备（device）选项卡中选择设备。在这里，我们将选择\
    \ `iPhone` 作为我们的设备。\n\n在 storyboard 中将宽度设置为紧凑，以便将视图更改到竖屏模式，以适应 `iPhone`。\n\n在主视图顶部添加一个标签（label）。从属性检查器（property\
    \ inspector）中选择“右对齐”（Right Alignment）。给标签标题赋值“0”。现在选择助手编辑器（assistant editor）。现在打开文件\
    \ `ViewController.swift`。按住 `Ctrl` 键并从底部拖动到类部分（class section）。这将创建如下所示输出。\n\n\
    向视图添加一个按钮（button），并给按钮标题赋值“1”。按住 `Ctrl` 键并从底部拖动到 `IBoutlet`。将创建以下动作（action）。\n\
    \n将此按钮复制到 storyboard 中，然后点击创建以生成其他数字。记住这也会复制 `IBAction` 连接。复制后，storyboard 看起来大致这样。\n\
    \n现在点击一个新按钮并将其拖到视图中。给按钮赋予减号。从底部，通过 `Ctrl+Click` 并拖动到文件 `ViewController.swift`，在下方所示的\
    \ `numberTapped` 动作处创建该动作。\n\n现在，复制加号按钮并在其下方粘贴新按钮。给新按钮赋予加号。\n\n在“0”按钮下方，现在创建一个新按钮。给新按钮赋予“=”号。从此按钮开始，按住\
    \ `Ctrl` 键并拖动到 `ViewController.swift` 文件的 `calculationTapped` 下方，创建一个动作。\n\n既然我们已经有了计算器的设计，我们将在\
    \ `ViewController.swift` 文件中添加代码。我们首先在 `class ViewController: UIViewController\
    \ {` 行之后定义一些属性。\n\n```swift\nvar isTypingNumber = false\nvar firstNumber = 0\n\
    var secondNumber = 0\nvar operation = \"\"\n```\n\n函数 `isTypingNumber` 是 `Boolean`\
    \ 类型，我们用它来检查用户是在按下操作键还是输入数字。\n\n在此之后实现方法 `numberTapped`：\n\n```swift\n@IBAction\
    \ func numberTapped(sender: AnyObject) {\n    var number = sender.currentTitle\n\
    \    if isTypingNumber\n    {\n        calculatorDisplay.text = calculatorDisplay.text\
    \ + number\n    }\n    else\n    {\n        calculatorDisplay.text = number\n\
    \        isTypingNumber = true\n    }\n}\n```\n\n我们将按下的数字附加到 `calculatorDisplay`\
    \ 标签的文本。如果是第一个数字，则该数字将赋值给标签。将实现方法 `calculationTapped`。\n\n```swift\n@IBAction\
    \ func calculationTapped(sender: AnyObject) {\n    isTypingNumber = false\n  \
    \  firstNumber = calculatorDisplay.text.toInt()!\n    operation = sender.currentTitle\n\
    }\n```\n\n使用 `toInt` 方法，将 `calculatorDisplay` 的文本从字符串转换为整数。\n\n注意：字符串有时可能是空的，在这种情况下将返回一个可选整数（optional\
    \ integer）。但在我们的案例中，字符串始终有一个值，为了解包该值，我们添加一个感叹号。实现方法 `equalsTapped`。\n\n```swift\n\
    @IBAction func equalsTapped(sender: AnyObject) {\n    isTypingNumber = false\n\
    \    var result = 0\n    secondNumber = calculatorDisplay.text.toInt()!\n    if\
    \ operation == \"+\" {\n        result = firstNumber + secondNumber\n    }\n \
    \   else if operation == \"-\"\n    {\n        result = firstNumber – secondNumber\n\
    \    }\n    calculatorDisplay.text = \"\\(result)\"\n}\n```\n\n根据 `operation`\
    \ 的属性值执行计算，并由 `calculatorDisplay` 标签显示结果。\n\n最后一步，构建（Build）并运行（Run）项目。现在你可以进行一些计算了。\n\
    \n## 扫雷游戏\n\n在这里，我们将使用 `swift` 设计扫雷游戏。本教程将向你展示如何从头开始构建扫雷游戏。\n\n### 扫雷：Swift 入门\n\
    \n我们将使用 `swift` 和 storyboard 界面生成器构建扫雷游戏。为了这一点，你需要最新版本的 `XCode` 和最新版本的 `swift`\
    \ 语言。你可以通过 Swift 资源的链接下载，也可以从 App Store 轻松下载。\n\n我确定大多数人都熟悉扫雷游戏。如果不熟悉，可以在网上查看。\n\
    \n打开最新版本的 `XCode`。按照步骤创建一个新项目。\n\n为应用程序提供产品名称。我们将将其命名为 `minesweeper`。\n\n填写组织名称和组织标识符。\n\
    \n选择语言为 `Swift`。\n\n选择为应用程序设计的设备。如果你希望应用程序运行在所有 iOS 设备上，请从列表中选择通用（Universal）。\n\
    \n在第一个屏幕上，进入通用（general）设置中的部署信息（deployment info）部分，取消勾选横向右（landscape right）和横向左（landscape\
    \ left）。这将使应用程序以竖屏运行。\n\n我们将通过布局界面开始设计应用程序。借助 storyboard 界面生成器完成。首先，打开 `main.storyboard`，然后选择屏幕上的\
    \ `ViewController`。为了这一点，你可能需要选择顶部界面栏而不是点击视图来选择 `ViewController`。在右侧，确保工具面板（utilities\
    \ panel）已打开。如果没有打开，你应该通过点击 `XCode` 窗口右上角的按钮来打开它。\n\n从右下角的对象库中选择 `View` 组件并将其拖到视图控制器中。通过这个视图，我们将持有扫雷棋盘网格。从属性检查器（attributes\
    \ inspector）将背景颜色更改为 `Group Table View Background Color`。这是一种浅灰色。\n"
- fmt: "\nSet the values of `X`, `Y`, `Width` and `Height` to `20`, `29`, `280` and\
    \ `280` respectively. You should make sure that the auto resizing masks are enabled,\
    \ so that this can be resized for using it on an iPad.\n\nOnto the view controller,\
    \ drag the new label components. Now, align them below the board view such that\
    \ one is up against the right edge and the second one is on the left. On the left\
    \ label, set the text to “Moves: 0” and on the right label, set the “Time: 0”.\
    \ Now, on each label, change the auto resizing mask. On the left bottom of the\
    \ `Superview`, the left label should be aligned and similarly, the right label\
    \ should be aligned to the bottom right. With this, they will look nice on an\
    \ iPhone and on iPad as well. Now we don't want the text to trail off the edges\
    \ of the label. For that, we will align the text on the right label to the right\
    \ side. With this, even if the length of the text increases, they won't trial\
    \ off the edge.\n\nPlace the navigation bar component on the top by dragging it.\
    \ Now, rename the title to “Minesweeper”. We will only use this like a static\
    \ bar for displaying the application's name. In a multi-page application, this\
    \ can also be used for navigation.\n\nDrag the toolbar component by clicking on\
    \ it, to the bottom. Now, rename the item to “New Game”.\n\nWith this, we have\
    \ completed the basic interface of the application. Now we will add code into\
    \ it. First, open `ViewController.swift`. Hooking the user interface that we have\
    \ created is the next thing to do. With this, the object can be accessed and the\
    \ `New Game` will call a method.\n\nTo the class `slope`, add `IBOutlets`. The\
    \ properties which connect the components from the storyboard are given below.\n\
    \n```\n@IBOutlet weak var boardView: UIView!\n@IBOutlet weak var movesLabel: UILabel!\n\
    @IBOutlet weak var timeLabel: UILabel!\n```\n\nNow we will add the method `IBAction`\
    \ which gets called whenever the new game button is pressed.\n\n```swift\n@IBAction\
    \ func newGamePressed()\n{\n    println(\"new game\");\n}\n```\n\nOpen assistant\
    \ editor from the `Main.storyboard`. With this, you can have a look at the file\
    \ `ViewController.swift` at the same time. On the left margin of every line, you\
    \ will see an empty circle with an `IBOutlet` or `IBAction`. Drag them to their\
    \ corresponding components by clicking on them and make connections.\n\nYou can\
    \ now run the project and it should correctly compile and show the view controller\
    \ containing the user interface, which we have designed using storyboard. If you\
    \ click the new game button, a print statement from the console will be displayed.\
    \ In case where you have chosen a different device simulator, it will correctly\
    \ scale between the resolutions of iPad and iPhone.\n\nNow, we will start coding.\
    \ The paradigm we follow will be the `Model-View-Controller`. In iOS development,\
    \ this is frequently used for separating the front end user interface code from\
    \ the model code of the back end.\n\nThe backend model of our application will\
    \ consist of two new classes 1. `Board.swift` class and 2. `Square.swift` class.\
    \ We will start our back-end coding by creating a `Square.swift`. For this, select\
    \ new file from the file menu and swift file from that. Name the file as “Square.swift”.\n\
    \nImplement this class after defining it, which is a simple thing to do. You will\
    \ just have to initialize the class and after that you should store the state\
    \ in a cell inside the grid of the board.\n\n```swift\nclass Square\n{\n    let\
    \ row:Int\n    let col:Int\n    // give these default values that we will re-assign\
    \ later with each\n    // new game\n    var numNeighboringMines = 0\n    var isMineLocation\
    \ = false\n    var isRevealed = false\n    init(row:Int, col:Int)     \n    //store\
    \ the row and column of the square in the grid\n    self.row = row\n    self.col\
    \ = col\n}\n}\n```\n\nDid you notice that there are different ways in declaring\
    \ variables, assigning the parameters to their properties and the method signature\
    \ format. You can also notice that we don't have to call `super.init` and we are\
    \ not sub classing.\n\nWe have now implemented the class `Square` and we can now\
    \ implement the class `board`. The class `board` is used for representing a set\
    \ of squares and it will also provide the methods required for determining the\
    \ total number of mines neighboring the given `Square`.\n\nNow create a new file\
    \ called `board.Swift` by selecting the new file option from the file menu. From\
    \ the new file option, select the swift file and name the file as “Board.Swift”.\n\
    \nCompared to the square, `board` is more compacted. We will first define the\
    \ class, properties and method `init`.\n\n```swift\nclass Board\n{\n    let size:Int\n\
    \    var squares:[[Square]] = [] // a 2d array of square cells, indexed by [row][column]\n\
    \    init(size:Int)\n    {\n        self.size = size\n    }\n}\n```\n\nTo the\
    \ `init` method, join a double for loop for setting up the square object grid:\n\
    \n```swift\nfor row in 0 ..< size\n{\n    var squareRow:[Square] = []\n    for\
    \ col in 0 ..< size {\n        let square = Square(row: row, col: col)\n     \
    \   squareRow.append(square)\n    }\n    squares.append(squareRow)\n}\n```\n\n\
    If you notice that there are different ways in declaring variables, assigning\
    \ the parameters to their properties and the method signature format. You can\
    \ also notice that we don't have to call `super.init` and we are not sub classing.\n\
    \nWe have now implemented the class `Square` and we can now implement the class\
