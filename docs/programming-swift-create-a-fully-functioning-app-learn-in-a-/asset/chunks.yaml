    \ open, you should open it by clicking on the top right button present on the\
    \ `XCode` window.\n\nSelect the `View` component from the bottom right panel of\
    \ the object library and drag it onto the view controller. With this view, our\
    \ minesweeper board grid will be held. Change the color of the background from\
    \ the attributes inspector to `Group Table View Background Color`. It is a gentle\
    \ grey color.\n"
