    \ `AnyObject`。\n\n此特定函数调用可以返回任何类，因此你需要使用行尾看到的 `as UITableViewCell` 来进行类型转换。稍后，你将其更改为稍后将创建的\
    \ `taskCell` 自定义单元格类。\n\n当你与 Cocoa 框架工作时，这种情况很常见，因为需要与 Objective C 使用的旧样式保持兼容性（在旧样式中，`id`\
    \ 是返回类型，意味着指向任何对象的指针）。请记住，Swift 尽可能避免使用指针，这就是为什么创建了此类解决方案，它能让你的代码安全得多。\n\n最后一部分有趣的是用于标记注释（mark\
    \ comments）的语法，它们有助于分割文件并允许你在文件中跳转：\n\n```swift\n// MARK: - Table View\n```\n\n\
    当你使用这种语法编写注释时，可以拆分文件，这使得在其中跳转变得容易得多。这有助于读者准确地看到文件中某组函数是相关的。\n\n## DetailViewController.swift\n\
    \n我们还有另一个文件需要查看——`DetailViewController`。与 `MasterViewController` 相比，这是一个小文件，但它包含了许多关于\
    \ Swift 如何工作的优秀示例，帮助你写出更好的代码。\n\n首先，我们有 `@IBOutlet` 属性，用于变量 `detailDescriptionLabel`。与\
    \ Objective C 头文件中的方式类似，这个特定的变量属性告诉 Interface Builder 关于你的 `DetailViewController`\
    \ 上的这个特定属性：\n\n```swift\n@IBOutlet weak var detailDescriptionLabel: UILabel!\n\
    ```\n\n你可能已经注意到这个变量被定义为 `weak`，因为你不想让 `DetailViewController` 拥有该视图。\n\n接下来，有一个看起来有趣的变量属性定义。它附带了一些额外的代码，用于定义紧邻其定义处的属性的行为：\n\
    \n```swift\nvar detailItem: AnyObject? {\n    didSet {\n        // 更新视图。\n   \
    \     self.configureView()\n    }\n}\n```\n\n还有一个可选的 `AnyObject?` 类型，但最有趣的部分是\
    \ `didSet` 代码块。\n\n属性可以包含代码块，作为特定事件的回调执行。这最用用的地方在于，你不需要定义一个特定的 setter 来执行此操作，实际上你可以更清晰地定义代码在何处在做什么。\n\
    \n这段代码现在非常清晰地表明，一旦 `detailItem` 被设置，从现在起任何时候都必须调用 `configureView()`。这是因为与视图相关的某些发生了变化。在代码的表达能力方面，这些回调对于\
    \ iOS 应用来说是一个飞跃。\n\n噢，早些我们简要讨论过可选类型（optionals），因为它们在 iOS 应用开发中非常频繁，这里为你提供另一个关于如何使用这些可选类型的示例。\n\
    \n```swift\nfunc configureView() {\n    // 更新详细项目的用户界面。\n    if let detail: AnyObject\
    \ = self.detailItem {\n        if let label = self.detailDescriptionLabel {\n\
    \            label.text = detail.description\n        }\n    }\n}\n```\n\n注意在\
    \ `IF` 语句中使用了可选绑定（optional binding）。这意味着如果右侧的赋值表达式有值，它在 `IF` 体的执行期间会被赋值给左侧。如果该表达式没有值，则\
    \ `IF` 语句体将被忽略。这与我们在 Objective C 中检查 `nil` 的方式类似，但是一种安全且更具表达力的方法。\n\n## 接下来\n\n\
    所以，在教程的这一部分，你实际上并没有编写任何代码。相反，你做了一些更重要的事情。你观察了 Swift 如何影响我们处理 Cocoa Touch 类和 API\
    \ 的方式。如果没有这些，你会发现在自己在尝试按照以前的方式编写应用程序时，一直在与 Swift 作斗争。\n\n你所做的是学习如何在不牺牲 Swift 编程语言表达能力的情况下，让你的应用程序开发变得更安全。你可以清楚地看到，苹果对与其现有框架的集成投入了大量考虑，并确保没有漏掉任何一个小细节。\n\
    \n在完成这部分的教程后，是时候开始构建你的应用程序了。回到你最初生成的 `TaskMe` 应用程序，使用 XCode，我们现在需要开始添加真实的功能。\n\
    \n## 你的第一个功能\n\n你要添加的第一个功能是向列表添加新任务。一旦此功能创建，你只需要点击 `+` 按钮，输入任务名称和一些备注（如果需要的话），然后一旦点击保存，就会自动返回列表。\n\
    \n## 设置 Storyboard\n\n我们希望让用户操作变得简单，所以如果他们只需点击 `+` 按钮就能弹出一个新控制器，那就好了。为了开始操作，打开\
    \ `Main.storyboard`。\n\n你将使用两个控制器来实现这一点：\n\n- `UINavigationController`\n- `UIViewController`\n\
    \n后者将嵌入到新的 `UINavigationController` 中（你不会复用屏幕上已有的那个）。所以，转到 XCode 屏幕右侧，从对象库拖出 `UINavigationController`\
    \ 和 `UIViewController` 到编辑器区域。\n\n现在删除 `UINavigationController` 创建的表格控制器，按住 CTRL\
    \ 并点击 `UINavigationController`。将其拖到创建的 `UIViewController` 上。会弹窗口——在 Relationship\
    \ Segue 部分点击 root view controller。`UIViewController` 现在将嵌入到 `UINavigationController`\
    \ 中，确保你稍后能够添加取消和保存按钮。\n\n现在是时候设置段段（segue）以便你导航到 `UINavigationController` 和 `UIViewController`\
    \ 了。在此之前，打开 `MasterViewController.swift` 文件并删除 `viewDidLoad` 中的这几行：\n\n```swift\n\
    let addButton = UIBarButtonItem(barButtonSystemItem: .Add, target: self, action:\
    \ \"insertNewObject:\")\nself.navigationItem.rightBarButtonItem = addButton\n\
    ```\n\n现在这些代码已删除，你也可以删除 `InsertNewObject:` 方法。\n\n"
- fmt: "\nGo back to your `Main.storyboard` file and go to the object library. Drag\
    \ a `Bar Button Item` from the library to the right hand side of the navigation\
    \ bar in `MasterViewController`. Now go into `Attributes Inspector` and change\
    \ the identifier to `Add`.\n\nNow it’s time to set up the segue from `MasterViewController`\
    \ to `UINavigationController`. Press `CTRL` and drag from the new `Bar Button\
    \ Item` that you created to the new `UINavigationController`. In the popup, go\
    \ to the `Action Segue` section and choose `Present Modally`.\n\nThe new segue\
    \ will look like a rectangle inside a circle and will be part of the arrow that\
    \ goes between `MasterViewController` and `UINavigationController`. Use the `Attributes\
    \ Inspector` to set the `Identifier` to show `addTask`.\n\nThe final thing to\
    \ do is set up your screen. Go to the `Object Library` and drag out two `text\
    \ fields`, putting them into `UINavigationController`. Position them however you\
    \ want to. Press on `CTRL` and drag the `text fields` and the containing view\
    \ around to set the `Auto Layout` constraints.\n\nSelect the first `Text Field`;\
    \ it’s now time to do a bit of editing to some of the settings inside the `Attributes\
    \ Inspector`. First, select the empty placeholder and edit it to say `Task Title`.\
    \ Change the size of the font to `24 points` through the `font editor`, which\
    \ you can access by clicking the `T` icon that is next to the font.\n\nNow you\
    \ want to be able to play around with the height, as well as the width, so change\
    \ the `Border style`–select the second from the right. You can now have a play\
    \ around with the height, perhaps make your text `60 points` tall and set the\
    \ alignment to centered.\n\nNow go to the second `Text Field` and do something\
    \ similar. Maybe make the text smaller, perhaps `16 points`, make the height smaller\
    \ and perhaps change the `placeholder text` to read something like `Notes`. Set\
    \ the alignment to the left, rather than center this time.\n\nGo to the `UINavigationController`\
    \ and click on the `navigation bar`. Go into the `Attributes Inspector` and change\
    \ the title to read `Add Task`. With all of that, you should have two fields and\
    \ two controllers. The next step is to create the subclass for the `UIViewController`\
    \ for the new `Add Task` screen.\n\nBefore you do that, try to run the application\
    \ and you should see that you can open the new screen although, at this stage,\
    \ you will not be able to navigate back.\n\n### Creating the AddTaskViewController\n\
    \nOpen the `File` menu, choose `New`, and then `File`. A shortcut for this is\
    \ `Cmd+N` on the keyboard. This will allow you to start creating the new `AddTaskController`\
    \ file. Ensure that you are in `iOS→ Source`, go into `Options` and select `Cocoa\
    \ Touch Class`. Click on `Next`. You will see a field that says `Subclass of:`\
    \ - type in `UIViewController`. Go to the `Class:` field and, at the front of\
    \ the name in there, add in `AddTask`.\n\nMake sure that the option for `Also\
    \ Create XIB file` is left unchecked and that `Swift` is selected as the language.\
    \ Click on `Next`. You will now see a file dialog popup screen. Select the location\
    \ where the file is going to go – most likely the default selection will be the\
    \ one you want it to go to – and then click on `Create`.\n\nBefore you begin to\
    \ edit the file that appears, you must remember that you need to set this as the\
    \ class for the `UIViewController` that was created in the `Storyboard`. Open\
    \ up `Main.storyboard` and choose `UIViewController`–the one you created earlier.\
    \ Go into the `Identity Inspector` and set the class to `AddTaskViewController`.\
    \ You will find the `Identity Inspector` on the panel that is at the top left–it\
    \ looks like a square and lines.\n\nNow, your focus is on `AddTaskViewController`\
    \ in the `Interface Builder`. Open the `Assistant Editor` (the icon in the toolbar\
    \ looks something like a tuxedo) and now you can set the outlets that go between\
    \ your code and the `Storyboard`.\n\nHold down `CTRL` and drag from each `Text\
    \ Field` in turn to the top of the class definition for `AddTaskViewController`.\
    \ Each one should be named, respectively, `titleField` and `notesField`. You should\
    \ end up with something that looks like this:\n\n```\nclass AddTaskViewController:\
    \ UIViewController {\n    @IBOutlet weak var titleField: UITextField!\n    @IBOutlet\
    \ weak var notesField: UITextField!\n    override func viewDidLoad() {\n```\n\n\
    If you have ever used `Objective C` to do any `iOS` work, you will notice that\
    \ this looks similar to what was in the header files.\n\n`@IBOutlet` is a declaration\
    \ of that connection between your code and the `Storyboard`. It uses an implicitly\
    \ unwrapped optional so that the set is not needed to initialize the `view controller`.\
    \ These can be set up as soon as the views are ready; in most cases, it won’t\
    \ even affect you because they will already be set by then, especially in `viewDidLoad`\
    \ and `viewWillAppear:animated`.\n\nThe declaration for the variable is `weak`\
    \ and this is to make sure that there are no references that are not necessary.\
    \ Without this, the two `UITextFields` will be owned by `AddTaskViewController`\
    \ and that means that the view will not be allowed to release when it wants to\
    \ because the controller will be holding on to the subviews.\n\n### Cancelling\
    \ Task Creation\n\nNext, you need to set up the `Cancel` button so that your task\
    \ is not saved when you tap it. Instead of saving, it will hide the task creation\
    \ screen. Open the `Main.storyboard` file again and drag a `Bar Button Item` from\
    \ the `Object Library`. Put it on the left part of the `navigation bar` in the\
    \ `AddTaskViewController` screen. Now select that `Bar Button Item`, open the\
    \ `Attributes Inspector` and change the `Identifier` to read `Cancel`.\n\nYou\
    \ must use the standard versions of the `UI elements` for two reasons: accessibility\
    \ and future proofing. You could have just set the title to `Cancel` but, let’s\
    \ say that at some time in the future, `Apple` changes cancel to read `X` for\
    \ example, your application will be ready for it.\n\nStandard elements have also\
    \ got accessibility already baked into them and have been well tested by the very\
    \ best that `Apple` employs. Now, we need to hook up the `Cancel` button so you\
    \ will need to create a segue for `Dismiss`.\n\nThere is one more thing you must\
    \ do before this class can be used in the `Storyboard`. At the moment, it will\
    \ currently allow a `Dismiss` segue to show up in `Interface builder` but, when\
    \ it comes to runtime, it will fail.\n\nTo do this, open `File` and click on `New`\
    \ to create a new file. In the dialog box that appears, choose `iOS→Source→Cocoa\
    \ Touch Class`. Click on `Next` and then set `Subclass of:` to `UIStoryboardSegue`.\
    \ The class must be set to `DismissSegue`. In the `Language` dropdown menu, make\
    \ sure that `Swift` is selected and not `Objective C`.\n\nSo, change the class\
    \ definition so it looks like:\n\n```\n@objc(DismissSegue) class DismissSegue:\
    \ UIStoryboardSegue {\n```\n\nThe declaration that is at the beginning - `@objc(DismissSegue)–\
    \ allows the class to be accessible to `Storyboard`. As `Swift` evolves, this\
    \ may all change but, for now, this is the only way to do it to stop your application\
    \ from crashing.\n\nNow you need to create a `perform` method for the custom segue\
    \ to dismiss the controller:\n\n```\noverride func perform() {\n    if let controller\
    \ = sourceViewController.presentingViewController? {\n        controller.dismissViewControllerAnimated(true,\
    \ completion: nil)\n    }\n}\n```\n\nAfter all of that, it’s time to run the application\
    \ and see all your hard work in action.\n\n### Saving Your Task\n\nNow it is time\
    \ to get some real value out of this–save a task. To do this you need a `Save`\
    \ button. Back to the `Main.storyboard` file, drag a `Bar Button Item` from the\
    \ `Object Library` and put it on the right side of the `navigation bar` in `AddTaskViewController`.\
    \ Ensure it is selected and the open `Attributes Inspector` and change the `Identifier`\
    \ to read `Save`.\n"
  raw: 'Go back to your Main. Storyboard file and go to the object library. Drag a
    Bar Button Item from the library to the right hand side of the navigation bar
    in MasterViewController.  Now go into Attributes Inspector and change the identifier
    to Add.


    Now it’s time to set up the segue from MasterViewController to UINavigationController.
    Press CTRL and drag from the new Bar Button Item that you created to the new UINavigationController.
    In the popup, go to the Action Segue section and choose Present Modally


    The new segue will look like a rectangle inside a circle and will be part of the
    arrow that goes between MasterViewController and UINavigationController. Use the
    Attributes Inspector to set the Identifier to showAddTask


    The final thing to do is set up your screen. Go to the Object Library and drag
    out two text fields, putting them into UINavigationController. Position them however
    you want to. Press on CTRL and drag the text fields and the containing view around
    to set the Auto Layout constraints.


    Select the first Text Field; it’s now time to do a bit of editing to some of the
    settings inside the Attributes Inspector. First, select the empty placeholder
    and edit it to say Task Title. Change the size of the font to 24 points through
    the font editor, which you can access by clicking the T icon that is next to the
    font.


    Now you want to be able to play around with the height, as well as the width,
    so change the Border style–select the second from the right. You can now have
    a play around with the height, perhaps make your text 60 points tall and set the
    alignment to centered.


    Now go to the second Text Field and do something similar. Maybe make the text
    smaller, perhaps 16 points, make the height smaller and perhaps change the placeholder
    text to read something like Notes. Set the alignment to the left, rather than
    center this time.


    Go to the UINavigationController and click on the navigation bar. Go into the
    Attributes Inspector and change the title to read Add Task. With all of that,
    you should have two fields and two controllers. The next step is to create the
    subclass for the UIViewController for the new Add Task screen.


    Before you do that, try to run the application and you should see that you can
    open the new screen although, at this stage, you will not be able to navigate
    back.


    ## Creating the AddTaskViewController


    Open the File menu, choose New, and then File. A shortcut for this is Cmd+N on
    the keyboard. This will allow you to start creating the new AddTaskController
    file. Ensure that you are in iOS→ Source, go into Options and select Cocoa Touch
    Class. Click on Next. You will see a field that says Subclass of: - type in UIViewController.
    Go to the Class: field and, at the front of the name in there, add in AddTask.


    Make sure that the option for Also Create XIB file is left unchecked and that
    Swift is selected as the language. Click on Next. You will now see a file dialog
    popup screen. Select the location where the file is going to go – most likely
    the default selection will be the one you want it to go to – and then click on
    Create.


    Before you begin to edit the file that appears, you must remember that you need
    to set this as the class for UIViewController that was created in the Storyboard.
    Open up Main. Storyboardand choose UIViewController–the one you created earlier.
    Go into the Identity Inspector and set the class to AddTaskViewController. You
    will find the Identity Inspector on the panel that is at the top left–it looks
    like a square and lines.


    Now, your focus is on AddTaskViewController in the Interface Builder. Open the
    Assistant Editor (the icon in the toolbar looks something like a tuxedo) and now
    you can set the outlets that go between your code and the Storyboard.


    Hold down CTRL and drag from each Tet Field in turn to the top of the class definition
    for AddTaskViewController. Each one should be named, respectively, titleField
    and notesField. You should end up with something that looks like this


    *   class AddTaskViewController: UIViewController {


    *   @IBOutlet weak var titleField: UITextField!


    *   @IBOutlet weak var notesField: UITextField!


    *   override func viewDidLoad() {


    If you have ever used Objective C to do any iOS work, you will notice that this
    looks similar to what was in the header files.


    @IBOutletis a declaration of that connection between your code and the Storyboard.
    It uses an implicitly unwrapped optional so that the set is not needed to initialize
    the view controller. These can be set up as soon as the views are ready; in most
    cases, it won’t even affect you because they will already be set by then, especially
    in viewDidLoad and viewWillAppear:animated.


    The declaration for the variable is weak and this is to make sure that there are
    no references that are not necessary. Without this, the two UITextFields will
    be owned by AddTaskViewController and that means that the view will not be allowed
    to release when it wants to because the controller will be holding on to the subviews.


    ## Cancelling Task Creation


    Next, you need to set up the Cancel button so that your task is not saved when
    you tap it. Instead of saving, it will hide the task creation screen. Open the
    Main. Storyboard file again and drag a Bar Button Item from the Object Library.
    Put it on the left part of the navigation bar in the AddTaskViewController screen.
    Now select that Bar Button Item, open the Attributes Inspector and change the
    Identifier to read Cancel.


    You must use the standard versions of the UI elements for two reasons: accessibility
    and future proofing. You could have just set the title to Cancel but, let’s say
    that at some time in the future, Apple changes cancel to read X for example, your
    application will be ready for it.


    Standard elements have also got accessibility already baked into them and have
    been well tested by the very best that Apple employs. Now, we need to hook up
    the Cancel button so you will need to create a new segue for Dismiss. 


    To do this, open File and click on New to create a new file. In the dialog box
    that appears, choose iOS→Source→Cocoa Touch Class. Click on Next and then set
    Subclass of: to UIStoryboardSegue. The class must be set to DismissSegue. In the
    Language dropdown menu, make sure that Swift is selected and not Objective C.


    There is one more thing you must do before this class can be used in your Storyboard.
    At the moment, it will currently allow a Dismiss segue to show up in Interface
    builder but, when it comes to runtime, it will fail. This is because there is
    some strange stuff going on behind the scenes in Swift. It can be fixed by explicitly
    defining the Objective C class name. Once that is done, Storyboard will be able
    to find the right class. So, change the class definition so it looks like:


    *   @objc(DismissSegue) class DismissSegue: UIStoryboardSegue {


    The declaration that is at the beginning - @objc(DismissSegue)– allows the class
    to be accessible to Storyboard. As Swift evolves, this may all change but, for
    now, this is the only way to do it to stop your application from crashing.


    Now you need to create a perform method for the custom segue to dismiss the controller:


    *   override func perform() {


    *   if let controller = sourceViewController.presentingViewController? {


    *   controller.dismissViewControllerAnimated(true, completion: nil)


    *   }


    *   }


    After all of that, it’s time to run the application and see all your hard work
    in action.


    ## Saving Your Task


    Now it is time to get some real value out of this–save a task. To do this you
    need a Save button. Back to the Main.storyboard file, drag a Bar Button Item from
    the objects library and put it on the right side of the navigation bar in AddTaskViewController.
    Ensure it is selected and the open Attributes Inspector and change the Identifier
    to Save.'
