    \n# 第 2 部分：使用 XCode 编辑工具\n\n在本章中，我们将涵盖使用 XCode 的四个要素 element：\n\n1. XCode 编辑工具\n\
    2. 代码自动补全功能\n3. 使用 Fix-It 进行代码纠错\n4. 代码片段的操作\n\n正如你在该章节中看到的，你的 Swift XCode 开发中很大一部分工作涉及到\
    \ XCode 的图形用户界面。很多工作——特别是在项目开始阶段——都是图形化的，或者涉及复选框。\n\n在第 4 章中，我将向你展示如何在游练场中编写和测试代码——特别是短小的代码片段。这有助于你学习\
    \ Swift 语法，并允许你在将代码片段输入（或复制-粘贴）到项目文件之前先对它们进行测试。\n\n现在，在本章中，我将介绍 XCode 的编辑工具。在这里，你将以你在学校基础编程课上编写的方式编写代码（即通过输入代码，而不是绘制界面并使用\
    \ XCode 的复选框和其他图形元素来视觉化构建应用）。本章的重点是协助你编写代码的 XCode 工具。XCode 在输入和编辑文本方面为你做的许多工作，都是由于它会观察每一次击键，并跟踪你输入（或复制-粘贴）的术语语法实现的。\n\
    \n通过在前三章中找到的工具和技术，你可以创建你的第一个 Swift 应用——即书中贯使用的 Locatapp 示例应用。（如果你还没有看到它，可以查看第\
    \ 1 章中的图 1-1 到 1-5，了解你将要去哪里。）\n\n# 第 4 章：类与方法\n\n当你开始学习 Swift 时，你将经常创建类和方法，所以让我们来看看它们是什么以及如何工作。首先，清除你游练场文件中的所有内容——我们需要一张空白页再次开始工作。现在，这就是你开始创建你的第一个应用的地方——一个小费计算器（Tip\
    \ Calculator）。你将一段一段地构建这个应用，我将在过程中解释每一部分。准备好了吗？在你的游练场文件中输入以下：\n\n```\n// 1\nclass\
    \ TipCalculator {\n}\n```\n\n你正在做的第一件事是创建一个类，要做到这一点，你只需要输入 `class` 并跟上名称，在本例中为\
    \ `TipCalculator`。然后跟上大括号。\n\n在大括号内部，输入以下代码：\n\n```swift\n// 2\nlet total: Double\n\
    let taxPct: Double\nlet subtotal: Double\n```\n\n当你输入这些内容时，你会看到一些错误出现，但不要担心，它们很快就会被修复。你在这里所做的是在类上创建属性，这与创建常量或变量几乎相同。你创建了三个属性——加税前的账单总额、添加的税率百分比以及加税前的订单金额。\n\
    \n你之所以在这个阶段得到错误，是因为你必须在声明属性时提供初始值，而我们没有对这些属性这样做。\n\n接在你刚刚输入的代码之后，保持在大括号内的情况下添加以下几行：\n\
    \n```swift\n// 3\ninit(total: Double, taxPct: Double) {\n    self.total = total\n\
    \    self.taxPct = taxPct\n    subtotal = total / (taxPct + 1)\n}\n```\n\n这创建了类的初始化方法，这些方法在\
    \ Swift 中始终被命名为 `init`。此初始化方法接收两个参数，并且因为它们的名称相同，所以通过添加 `self` 前缀来区分它们。\n\n继续在大括号内，向你的代码中添加这些：\n\
    \n```swift\n// 4\nfunc calcTipWithTipPct(tipPct: Double) -> Double {\n    return\
    \ subtotal * tipPct\n}\n```\n\n在这里，你使用了 `func` 关键字来声明一个方法，后面跟着参数——在这里你必须显式指定类型，并跟上返回类型。这是一个简单的函数，将账单的小计金额与小费百分比相乘。在此之后，添加以下代码：\n\
    \n```swift\n// 5\nfunc printPossibleTips() {\n    println(\"15%: \\(calcTipWithTipPct(0.15))\"\
    )\n    println(\"18%: \\(calcTipWithTipPct(0.18))\")\n    println(\"20%: \\(calcTipWithTipPct(0.20))\"\
    )\n}\n```\n\n你创建了一个新方法，它可以打印出 3 种可能的的小费值。注意，当在类的实例上调用方法时，初始参数不需要命名，但其余需要。现在，添加这段代码，这次是在大括号之后：\n\
    \n```swift\n// 6\nlet tipCalc = TipCalculator(total: 33.25, taxPct: 0.06)\ntipCalc.printPossibleTips()\n\
    ```\n\n在最后一步中，你创建了一个费计算器的实例，并调用了方法来显示可能的的小费值。\n\n你的代码现在应该是这样的：\n\n```swift\n//\
    \ 1\nclass TipCalculator {\n    // 2\n    let total: Double\n    let taxPct: Double\n\
    \    let subtotal: Double\n    // 3\n    init(total: Double, taxPct: Double) {\n\
    \        self.total = total\n        self.taxPct = taxPct\n        subtotal =\
    \ total / (taxPct + 1)\n    }\n    // 4\n    func calcTipWithTipPct(tipPct: Double)\
    \ -> Double {\n        return subtotal * tipPct\n    }\n    // 5\n    func printPossibleTips()\
    \ {\n        println(\"15%: \\(calcTipWithTipPct(0.15))\")\n        println(\"\
    18%: \\(calcTipWithTipPct(0.18))\")\n        println(\"20%: \\(calcTipWithTipPct(0.20))\"\
    )\n    }\n}\n// 6\nlet tipCalc = TipCalculator(total: 33.25, taxPct: 0.06)\ntipCalc.printPossibleTips()\n\
    ```\n\n# 第 5 章：数组与 For 循环\n\n你可能注意到上面的代码中有很多重复。这是因为你多次调用了 `calcTipWithTipPct`\
    \ 方法来显示不同的百分比。这就是数组大显身场的地方，让你减少重复。\n\n去你输入 `printPossibleTips` 的地方，替换其内容：\n\n\
    ```swift\nlet possibleInferred = [0.15, 0.18, 0.20]\nlet possibleExplicit:[Double]\
    \ = [0.15, 0.18, 0.20]\n// 你创建一个浮点数数组，使用了推断和显式类型。现在在下方添加以下行：\nfor possibleTip\
    \ in possibleInferred {\n    println(\"\\(possibleTip*100)%: \\(calcTipWithTipPct(possibleTip))\"\
    )\n}\n```\n\n## 字典\n\n我们将对你的代码进行最后一次更改——与其仅仅打印出你的小费，不如创建一个包含所有结果的字典。\n\n去你输入 `printPossibleTips`\
    \ 的地方并删除该方法。将其替换为：\n\n```swift\n// 1\nfunc returnPossibleTips() -> [Int: Double]\
    \ {\n    let possibleInferred = [0.15, 0.18, 0.20]\n    let possibleExplicit:[Double]\
    \ = [0.15, 0.18, 0.20]\n    // 2\n    var retval = [Int: Double]()\n    for possibleTip\
    \ in possibleInferred {\n        let intPct = Int(possibleTip*100)\n        //\
    \ 3\n        retval[intPct] = calcTipWithTipPct(possibleTip)\n    }\n    return\
    \ retval\n}\n```\n\n再次，你会看到一个错误，但我们现在修复它。你需要将文件的最后一行改为：\n\n```swift\ntipCalc.returnPossibleTips()\n\
    ```\n\n恭喜！你创建了你在 Swift 中的第一个类！\n"
- fmt: "\nTypecasting can be used with a hierarchy of subclasses and classes for checking\
    \ the type of a given class instance and for casting that instance into a different\
    \ class but with the same hierarchy. An example is given below where three code\
    \ snippets are given and they define the hierarchy of an array and classes containing\
    \ their class instances.\n\nA new base class is defined in the first snippet.\
    \ This base class is called `MediaItem`. This class can provide the basic functionality\
    \ for any item which appears in the digital media library.\n\n```swift\nclass\
    \ MediaItem {\n  var name: String\n  init(name: String) {\n    self.name = name\n\
    \  }\n}\n```\n\nIn the next snippet, to subclasses of the `MediaItem` are defined.\
    \ `Movie` is the first subclass and it encapsulates additional information on\
    \ the film or movie. A `director` property will be added on top of the class `MediaItem`,\
    \ which is the best class. This property will be added with an initializer responding\
    \ to the base class.\n\n`Song` is the second subclass and this adds a property\
    \ `artist` with an initialiser on the base class.\n\n```swift\nclass Movie: MediaItem\
    \ {\n  var director: String\n  init(name: String, director: String) {\n    self.director\
    \ = director\n    super.init(name: name)\n  }\n}\n\nclass Song: MediaItem {\n\
    \  var artist: String\n  init(name: String, artist: String) {\n    self.artist\
    \ = artist\n    super.init(name: name)\n  }\n}\n```\n\nA constant array named\
    \ `library` will be created by the final snippet. This contains two `Movie` instances\
    \ along with three `Song` instances. By initialising the `library` array with\
    \ the contents from an array literal, it can be inferred. The type checker of\
    \ Swift is capable of identifying the song and movie having `MediaItem` as the\
    \ common superclass.\n\n```swift\nlet library = [\n  Movie(name: \"Avatar\", director:\
    \ \"James Cameroon\"),\n  Song(name: \"They Don’t Care About Us\", artist: \"\
    Michael Jackson\"),\n  Movie(name: \"The Lord of the Rings\", director: \"Peter\
    \ Jackson\"),\n  Song(name: \"Bohemian Rhapsody\", artist: \"Freddie Mercury\"\
    ),\n  Song(name: \"summer of 69\", artist: \"Brian Adams\")\n]\n// the type of\
    \ \"library\" is inferred to be [MediaItem]\n```\n\nThe movie and song instances\
    \ are the items that are stored inside the `library` behind the scenes. If the\
    \ contents of the array are iterated, the items, which you receive will not be\
    \ of the type `movie` or `song` but as `MediaItem`. You should check their type\
    \ for you to work with them in their actual type or you can downcast them to a\
    \ required type, as given below.\n\n## Checking Type\n\nYou can check if an instant\
    \ belongs to a certain subclass type by using the type check operator (`is`).\
    \ If the instance belongs to that subclass type, the type check operator will\
    \ return a `true` and if it is not, it will return a `false`.\n\nTwo variables\
    \ `movieCount` and `songCount` are defined in the example below and they count\
    \ the total number of song and movie instances present in the `library` array:\n\
    \n```swift\nvar movieCount = 0\nvar songCount = 0\nfor item in library {\n  if\
    \ item is Movie {\n    ++movieCount\n  } else if item is Song {\n    ++songCount\n\
    \  }\n}\nprint(\"Media library contains \\(movieCount) movies and \\(songCount)\
    \ songs\")\n// prints \"Media library contains 2 movies and 3 songs\"\n```\n\n\
    All the library array items will be integrated in this example. The `item` constant\
    \ will be sent to the next `MediaItem` for every pass by the `for in` loop.\n\n\
    The operator will return a `true` in case where the current `mediaItem` is of\
    \ the `movie` instance and it will return the `false` otherwise. Similarly, `item\
    \ is song` will return a `true` value if the `mediaItem` belongs to the `song`\
    \ instance and if not, it will return a `false`. When the `for in` loop ends,\
    \ `movieCount` and `songCount` will contain the count of all the `MediaItem` instances\
    \ found in each of those types.\n\n## Downcasting\n\nBehind the scenes, a variable\
    \ or constant of a particular class may refer a subclass instance. If you believe\
    \ that this is the case, you can perform downcasting on the subclass type using\
    \ the type cast operator (`as?` or `as!`).\n\nDowncasting cannot always be successful\
    \ and there are two different forms for the type cast operator. An optional value\
    \ will be returned by the conditional form `as?`, and this optional value will\
    \ be of the type that you are trying to downcast. The second form is the forced\
    \ form `as!`. The results will be force unwrapped as a single compound action\
    \ and the downcast will be attempted.\n\nIf you're not sure on the success of\
    \ the downcast, you can use the type cast operator (`as?`), which is its conditional\
    \ form. An optional value will always be returned by this form of operator and\
    \ in cases where the downcast fails, the value will be `nil`. With this, you can\
    \ check if a downcast successful.\n\nIf you're sure about the success of the downcast,\
    \ you can use the type cast operator (`as!`), which is the forced form. A runtime\
    \ error will be triggered by the operator if you downcast a class type which is\
    \ incorrect.\n\nThe below example will iterate every `MediaItem` from the `library`\
    \ and then prints the description appropriate for each item. For doing this it\
    \ will have to access every item not just as `MediaItem` but as a true `Song`\
    \ or `Movie`. For it to access the `artist` or `director` property off the `Song`\
    \ or `Movie` for using it in the description, this is necessary.\n\nIn the following\
    \ example, each `item` present in the array might be a `Song` or it might be a\
    \ `Movie`. We cannot know the actual class in advance, for using it with each\
    \ item. In such situations, using the type cast operator (`as?`) conditional form\
    \ for checking the downcast every time in the loop is appropriate.\n\n```swift\n\
    for item in library {\n  if let movie = item as? Movie {\n    print(\"Movie: '\\\
    (movie.name)', dir. \\(movie.director)\")\n  } else if let song = item as? Song\
    \ {\n    print(\"Song: '\\(song.name)', by \\(song.artist)\")\n  }\n}\n// Movie:\
    \ Avatar, dir. James Cameroon\n// Song: 'They Don’t Care About Us', by Michael\
    \ Jackson\n// Movie: 'The Lord of the Rings', dir. Peter Jackson\n// Song: 'Bohemian\
    \ Rhapsody', by Freddie Mercury\n// Song: 'summer of 69', by Bryan Adams\n```\n\
    \nThe example above starts by attempting to downcast the `item` as a `Movie`.\
    \ The `Movie` might possibly be a `MediaItem` instance and similarly the `Song`\
    \ can be too, and it is equally possible. Due to this uncertainty, an optional\
    \ value will be returned by the typecast operator’s `as?` form when it tries to\
    \ downcast to a subclass type. The resultant of the `as? Movie` item will be of\
    \ `Movie?` type or optional `movie`.\n\nThe downcast of the `Movie` will fail\
    \ when it is applied to the instances of the `song` in the library array. The\
    \ above example makes use of an optional binding for checking whether the value\
    \ is actually contained in the `Movie`, for coping with this. This is basically\
    \ to find if the downcast is a success. In writing, the optional binding will\
    \ look like `if let movie = item as? Movie` and it can be read as:\n\n“Try accessing\
    \ the item as Movie. If it succeeds, temporary constant will be set, called movie,\
    \ and this value will be stored in the optional Movie returned.”\n\nIf downcasting\
    \ is a success, the movie properties will be used for printing the description\
    \ of the `Movie` instance. A principle similar to this is used for checking the\
    \ `Song` instances, for painting the appropriate description every time after\
    \ finding the `Song` in the library.\n\nNote: The instances will not be modified\
    \ or the values will not be changed by typecasting. The instance underlying will\
    \ be the same. For instance is simply accessed and treated like the instance type\
    \ that is to be casted.\n\n## Type Casting for Any and AnyObject\n\nSwift provides\
    \ two special type aliases for working with non-specific types:\n\n`AnyObject`\
    \ can represent an instance of any class type.\n\n`Any` can represent an instance\
    \ of any type at all, including function types.\n"
  raw: 'Typecasting can be used with a hierarchy of subclasses and classes for checking
    the type of a given class instance and for casting that instance into a different
    class but with the same hierarchy. An example is given below where three code
    snippets are given and they define the hierarchy of an array and classes containing
    their class instances.


    A new base class is defined in the first snippet. This base class is called MediaItem.
    This class can provide the basic functionality for any item which appears in the
    digital media library.


    *   class MediaItem {


    *   var name: String


    *   init(name: String) {


    *   self.name = name


    *   }


    *   }


    In the next snippet, to subclasses of the MediaItem are defined. Movie is the
    first subclass and it encapsulates additional information on the film or movie.
    A director property will be added on top of the class MediaItem, which is the
    best class. This property will be added with an initializer responding to the
    base class.


    Song is the second subclass and this adds a property and artist with an initialiser
    on the base class.


    *   class Movie: MediaItem {


    *   var director: String


    *   init(name: String, director: String) {


    *   self.director = director


    *   super.init(name: name)


    *   }


    *   }


    *   class Song: MediaItem {


    *   var artist: String


    *   init(name: String, artist: String) {


    *   self.artist = artist


    *   super.init(name: name)


    *   }


    *   }


    A constant array named library will be created by the final snippet. This contains
    two Movie instances along with three Song instances. By initialising the library
    array with the contents from an array literal, it can be inferred. The type checker
    of Swift is capable of did you sing the song and movie having MediaItem as the
    common superclass.


    *   let library = [


    *   Movie(name: "Avatar", director: "James Cameroon"),


    *   Song(name: "They Don’t Care About Us", artist: "Michael Jackson"),


    *   Movie(name: "The Lord of the Rings", director: "Peter Jackson"),


    *   Song(name: "Bohemian Rhapsody", artist: "Freddie Mercury"),


    *   Song(name: "summer of 69", artist: "Brian Adams")


    *   ]


    *   // the type of "library" is inferred to be [MediaItem]


    The movie and song instances are the items that are stored inside the library
    behind the scenes. If the contents of the array are iterated, the items, which
    you get receive will not be of the type movie or song but as MediaItem. You should
    check their type for you to work with them in their actual type or you can downcast
    them to a required type, as given below.


    ## Checking Type


    You can check if an instant belongs to a certain subclass type by using the type
    check operator (is). If the instance belongs to that subclass type, the type check
    operator will return a true and if it is not, it will return a false.


    Two variables movieCount and songCount are defined in the example below and they
    count the total number of song and movie instances present in the library array:


    *   var movieCount = 0


    *   var songCount = 0


    *   for item in library {


    *   if item is Movie {


    *   ++movieCount


    *   } else if item is Song {


    *   ++songCount


    *   }


    *   }


    *   print("Media library contains \(movieCount) movies and \(songCount) songs")


    *   // prints "Media library contains 2 movies and 3 songs"


    All the library array items will be integrated in this example. The item constant
    will be sent to the next MediaItem for every pass by the for in loop.


    The operator will return a true in case where the current mediaItem is of the
    movie instance and it will return the false otherwise. Similarly, item is song
    will return a true value if the mediaItem belongs to the song instance and if
    not, it will return a false. When the for in loop ends, movieCount and songCount
    will contain the count of all the mediaItem instances found in each of those types.


    ## Downcasting


    Behind the scenes, a variable or a constant of a particular class may refer a
    subclass instance. If you believe that this is the case, you can perform downcasting
    on the subclass type using the type cast operator (as? or as!).


    Downcasting cannot always be successful and there are two different forms for
    the type cast operator. An optional value will be returned by the conditional
    form, as? and this optional value will be of the type that you are trying to downcast.
    The second form is the forced form as!. The results will be force unwrapped as
    a single compound action and the downcast will be attempted.


    If you''re not sure on the success of the downcast, you can use the type cast
    operator (as?), which is its conditional form. An optional value will always be
    returned by this form of operator and in cases where the downcast fails, the value
    will be nil. With this, you can check if a downcast successful.


    If you''re sure about the success of the downcast, you can use the type cast operator
    (as!), which is the forced form. A runtime error will be triggered by the operator
    if you downcast a class type which is incorrect.


    The below example will iterate every MediaItem from the library and then prints
    the description appropriate for each item. For doing this it will have to access
    every item not just as MediaItem but as a true Song or Movie. For it to access
    the artist or director property off the Song or Movie for using it in the description,
    this is necessary.


    In the following example, each item present in the array might be a Song or it
    might be a Movie. We cannot know the actual class in advance, for using it with
    each item. In such situations, using the type cast operator (as?) conditional
    form for checking the downcast every time in the loop is appropriate.


    *   for item in library {


    *   if let movie = item as? Movie {


    *   print("Movie: ''\(movie.name)'', dir. \(movie.director)")


    *   } else if let song = item as? Song {


    *   print("Song: ''\(song.name)'', by \(song.artist)")


    *   }


    *   }


    *   // Movie: Avatar, dir. James Cameroon


    *   // Song: ''They Don’t Care About Us'', by Michael Jackson


    *   // Movie: ''The Lord of the Rings'', dir. Peter Jackson


    *   // Song: ''Bohemian Rhapsody'', by Freddie Mercury


    *   // Song: ''summer of 69'', by Bryan Adams


    The example above starts by attempting to downcast the item as a Movie. The Movie
    might possibly be a MediaItem instance and similarly the Song can be too, and
    it is equally possible. Due to this uncertainty, an optional value will be returned
    by the typecast operator’s as? form when it tries to downcast to a subclass type.
    The resultant of the as? Movie item will be of the Movie? type or optional movie.


    The downcast of the Movie will fail when it is applied to the instances of the
    song in the library array. The above example makes use of an optional binding
    for checking whether the value is actually contained in the Movie, for coping
    with this. This is basically to find if the downcast is a success. In writing,
    the optional binding will look like “if let movie = item as? Movie” and it can
    be read as:


    “Try accessing the item as Movie. If it succeeds, temporary constant will be set,
    called movie, and this value will be stored in the optional Movie returned.”


    If downcasting is a success, the movie properties will be used for printing the
    description of the Movie instance, which includes the director''s name. A principle
    similar to this is used for checking the Song instances, for painting the appropriate
    description every time after finding the Song in the library.


    Note: The instances will not be modified or the values will not be changed by
    typecasting. The instance underlying will be the same. For instance is simply
    accessed and treated like the instance type that is to be casted.


    Type Casting for Any and AnyObject


    Swift provides two special type aliases for working with non-specific types:


    AnyObject can represent an instance of any class type.


    Any can represent an instance of any type at all, including function types.'
