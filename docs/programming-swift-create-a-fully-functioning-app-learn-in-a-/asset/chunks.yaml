    \ given as ininout` parameters and after the execution of the function they modify\
    \ the passed variable.\n\nIn Swift, every function has a type. Every function\
    \ consists of a parameter type along with the return type, which can be used like\
    \ any other parameter type in `swift`. With this, it is possible to pass a function\
    \ as a parameter to another function and you can also return functions from other\
    \ functions. Swift allows you to write functions inside other functions. With\
    \ this, encapsulation is possible and useful functionalities can be nested within\
    \ other functions.\n\n### Defining and Calling Functions\n\nWhenever you define\
