  trans: "\n\n注意：在未定义返回值的情况下，可以使用 `sayGoodbye(_:)` 函数来返回一个值。如果没有定义返回类型，函数将返回一个 `Void`\
    \ 类型。`Void` 仅仅是一个内部不包含元素的特殊值。它是一个空元组，可以写成 `()`。\n\n当调用 `Void` 时，函数的返回值是可以被忽略的。\n\
    \n```swift\nfunc printAndCount(stringToPrint: String) -> Int {\n    print(stringToPrint)\n\
    \    return stringToPrint.characters.count\n}\n\nfunc printWithoutCounting(stringToPrint:\
    \ String) {\n    printAndCount(stringToPrint)\n}\n\nprintAndCount(\"hello, world\"\
    )\n// 打印 \"hello, world\" 并返回值为 12 \nprintWithoutCounting(\"hello, world\")\n\
    // 打印 \"hello, world\" 但没有返回值\n```\n\n第一个函数 `printAndCount(_:)` 会打印一个字符串并返回作为\
    \ `Int` 类型的字符计数。第二个函数 `printWithoutCounting` 会调用第一个函数，但它会忽略第一个函数的返回值。第一个函数会在调用第二个函数后打印消息。在这种情况下，返回值将不会被使用。\n\
    \n注意：当一个函数表示它不返回值时，返回值是可以被忽略的。但如果一个函数表示它将返回一个值，它必须返回一个值。如果定义了返回类型的函数没有允许控制在不返回值的情况下到达底部，将显示编译错误。\n\
    \n## 具有多个返回值的函数\n\n对于函数，你可以通过使用元组类型返回多个值来给出返回类型，因为它们并不是作为单个复合返回值的一部分返回返回。\n\n\
    下面的示例将定义一个 `minMax(_:)` 函数。该函数将找到给定数组中最小和最大的 `Int` 值：\n\n```swift\nfunc minMax(array:\
    \ [Int]) -> (min: Int, max: Int) {\n    var currentMin = array[0]\n    var currentMax\
    \ = array[0]\n    for value in array[1..<array.count] {\n        if value < currentMin\
    \ {\n            currentMin = value\n        } else if value > currentMax {\n\
    \            currentMax = value\n        }\n    }\n    return (currentMin, currentMax)\n\
    }\n```\n\n函数 `minMax(_:)` 将返回一个包含两个 `Int` 值的元组。返回的值被命名为 `min` 和 `max`。在查询函数的返回值时，可以使用它们的名称进行访问。\n\
    \n通过设置名为 `currentMin` 和 `currentMax` 的工作变量，函数 `minMax(_:)` 的主体将开始。`currentMin`\
    \ 和 `currentMax` 变量用于设置数组的第一个整数。函数将遍历数组中的剩余值，并比较它们是否小于或大于 `currentMin` 和 `currentMax`\
    \ 值。最后将获得最小值和最大值，并将它们作为包含两个 `Int` 值的元组返回。\n\n元组成员可以使用点语法进行访问，因为它们被命名为函数返回类型的一部分。访问它们是为了检索找到的最大值和最小值：\n\
    \n```swift\nlet bounds = minMax([8, -6, 2, 109, 3, 71])\nprint(\"min is \\(bounds.min)\
    \ and max is \\(bounds.max)\")\n// 打印 \"min is -6 and max is 109\"\n```\n\n# 第\
    \ 3 章：Playgrounds 简介\n\n废话多说，我想让你启动 XCode。我们将直接进入你的第一个程序的设置，我们将在 Playground 中完成这一操作。Playground\
    \ 是一项新功能，一种测试你的代码并查看它是否完全按照你的预期工作的方法，在你正式执行它之前。所以，让我们开始吧：\n\n1. 启动 XCode，然后打开\
    \ `File\\New\\File`\n2. 选择 `iOS\\Source\\Playground`\n3. 点击 Next\n4. 你需要为文件命名，所以将其命名为\
    \ `Swifttutorial.playground`\n5. 现在点击 Create 并将文件保存到你记得的地方\n6. 确保文件是空的——你希望从一个完全干净的空白板开始。\n\
    7. 现在打开你的文件并在程序中输入以下内容。在你输入时，每行的结果都将显示在侧边栏中，这样你可以清楚地看到发生了什么：\n\n```swift\nlet\
    \ tutorialTeam = 60\nlet editorialTeam = 17\nlet totalTeam = tutorialTeam + editorialTeam\n\
    ```\n\nPlaygrounds 是学习 Swift 如何工作以及进行实验的极佳方式。在教程第一部分的剩余时间内，你将一直在这个 playground\
    \ 中工作。\n\n在继续之前，请将你的新 playground 文件拖到你的 OS X dock 栏上。这将方便你将其作为记事本来快速测试新代码。\n\n\
    ### 变量与常量\n\n再次打开你的 Playground 文件，并尝试在底部添加这一行：\n\n```swift\ntotalTeam += 1\n```\n\
    \n你首先会注意到，当你放入这一行时会得到一个错误。这是因为 `totalTeam` 是所谓的常量，它的值不能改变。常量必须用 `let` 单词声明，而我们在这个例子中没有这样做。与其作为常量，你希望\
    \ `totalTeam` 是一个变量——回到你的 playground 文件，删掉你刚刚输入的行并重新输入：\n\n```swift\nvar totalTeam\
    \ = tutorialTeam + editorialTeam\n```\n\n现在你可能会问为什么我们不直接用 `var` 声明所有东西，因为在信息足够的情况下，编译器可以自动设置。\n\
    \n## 显式类型与推断类型\n\n我们还没有为常量或变量设置类型，因为编译器在有足够信息的情况下可以完成。当然，你也可以显式地设置类型。回到代码中设置 `totalTeam`\
    \ 的那一行，将其替换为：\n\n```swift\nlet totalTeam: Int\n```\n\n在可能的情况下，你应该让编译器为你推断类型——这是\
    \ Swift 的最大优势之一。由于这个原因，切换回推断类型，通过放入这一行：\n\n```swift\nlet tutorialTeam = 60\n```\n\
    \n### Swift 中的基础类型与控制流\n\n所以，你已经看到了 `Int` 的工作，它是整数值的类型。但还有更多类型。保持你的 playground\
    \ 文件打开，尝试运行这些行来看看它们的作用：\n\n### Float 和 Double\n\n```swift\nlet priceInferred =\
    \ 19.99\nlet priceExplicit: Double = 19.99\n```\n\n`Float` 和 `Double` 都是小数点值。`Double`\
    \ 更精确，并且是小数值的默认选择。\n\n### Bool\n\n```swift\nlet onSaleInferred = true\nlet onSaleExplicit:\
    \ Bool = false\n```\n\n熟悉 Objective-C 的你们知道声明布尔值时使用 Yes 或 No。在 Swift 中，我们使用 True\
    \ 或 False\n\n### String\n\n```swift\nlet nameInferred = \"Whoopie Cushion\"\n\
    let nameExplicit: String = \"Whoopie Cushion\"\n```\n\n字符串正如你预期的那样——字符序列。在 Swift\
    \ 中你不需要像在 Objective-C 中那样使用 `@` 符号，所以如果你习惯了旧程序，可能需要一段时间来理解这个！\n\n### If 语句与字符串插值\n\
    \n```swift\nif onSaleInferred {\n    println(\"\\(nameInferred) on sale for \\\
    (priceInferred)!\")\n} else {\n    println(\"\\(nameInferred) at regular price:\
    \ \\(priceInferred)!\")\n}\n```\n\n这是一个 if 语句，它与其他所有计算机编程语言相似。如果你不想，你可以不使用括号，但你必须使用大括号，即使它只有一行语句。\n\
    \n这还向你展示了一种全新的技术，被称为字符串插值。每当你想要在 Swift 中进行替换时，都必须使用这种语法：\n\n```\n\\(yourexpression)\n\
    ```\n\n"
- fmt: "\nLook at the sidebar in the playground and you should see the result of this\
    \ – it may be a little difficult to read because there isn’t a lot of space. Hover\
    \ your mouse over the line and click on the eyeball that shows up.\n\n# Part 2:\
    \ Using the XCode Editing Tools\n\nIn this chapter, we will cover four elements\
    \ of using the XCode:\n\n1. XCode editing tools\n2. Code completion features\n\
    3. Code correction with Fix‐It own4. Working with code snippets\n\nAs you can\
    \ see in that chapter, a great deal of your Swift XCode development involves the\
    \ graphical user interface of XCode. A lot of the work — particularly at the beginning\
    \ of a project — is graphical or involves checkboxes.\n\nIn Chapter 4, I show\
    \ you how to write and test code — particularly small snippets of code — in a\
    \ playground. This helps you learn Swift syntax and allows you to test out code\
    \ fragments before you type them (or copy‐and‐paste them) into your project files.\n\
    \nNow, in this chapter, I introduce XCode’s editing tools. Here, you’ll write\
    \ code in the way you may have written it in your beginning programming class\
    \ in school (that is, typing in code rather than drawing the interface and using\
    \ XCode checkboxes and other graphical elements to construct your app visually).\
    \ The focus in this chapter is on the XCode tools that assist you with writing\
    \ code. Much of what XCode does for you in regard to typing and editing text is\
    \ made possible by the fact that it observes every keystroke and keeps track of\
    \ the syntax of the terms you type (or copy‐and‐paste).\n\nWith the tools and\
    \ techniques you find in these first three chapters, you can create your first\
    \ Swift app — the Locatapp example app used throughout this book. (In case you\
    \ haven’t seen it yet, you can look at Figures 1‐1 through 1‐5 in Chapter 1 to\
    \ see where you’re headed.)\n\n# Chapter 4: Classes and Methods\n\nWhen you start\
    \ working in Swift, you will be creating classes and methods on a regular basis\
    \ so let’s take a look at what they are and how they work. First clear out everything\
    \ that is in your playground file – we need a clean sheet to work on again. Now,\
    \ this is where you get to start creating your very first app – a Tip Calculator.\
    \ You will build this app one piece of code at a time and I will explain each\
    \ piece as we go along. Ready? Type the following into your playground file:\n\
    \n```\n// 1\nclass TipCalculator {\n}\n```\n\nThe first thing you are doing is\
    \ creating a class and to do this you simply type `class` and follow it with the\
    \ name, in this case, `TipCalculator`. Follow this with curly braces.\n\nInside\
    \ the curly braces, type in this code:\n\n```swift\n// 2\nlet total: Double\n\
    let taxPct: Double\nlet subtotal: Double\n```\n\nYou will see some errors appear\
    \ when you type this in but don’t worry about them, they will be fixed soon enough.\
    \ What you have done here is create properties on the class, pretty much the same\
    \ as you create constants or variables. You have created three properties – the\
    \ total of the bill before after tax is added, the tax percentage added and the\
    \ amount of the bill before tax is added.\n\nThe reason you are getting errors\
    \ at this stage is because you must declare properties with an initial value and\
    \ we didn’t do that for this.\n\nFollowing on from the code you just typed, add\
    \ in these lines, staying inside the curly braces:\n\n```swift\n// 3\ninit(total:\
    \ Double, taxPct: Double) {\n    self.total = total\n    self.taxPct = taxPct\n\
    \    subtotal = total / (taxPct + 1)\n}\n```\n\nThis creates the initializer for\
    \ the class and these are always named as `init` in Swift. This initializer takes\
    \ two parameters and, because they both have the same name, they are distinguished\
    \ by the addition of the `self` prefix.\n\nStaying inside those curly braces,\
    \ add this to your code:\n\n```swift\n// 4\nfunc calcTipWithTipPct(tipPct: Double)\
    \ -> Double {\n    return subtotal * tipPct\n}\n```\n\nHere you have used the\
    \ `func` keyword to declare a method followed by the parameters – here you must\
