- fmt: "\nType inference is all very nice but if you do not need to assign a value\
    \ to a variable straightaway, you might have to explicitly specify the variable\
    \ type:\n\n### Type Annotation\n\n#### C#\n```csharp\nstring firstName; own```\n\
    \n#### Swift\n```swift\nvar firstName: String\n```\n\nDid you notice that Swift\
    \ does not use a semi-colon? While Swift is very close to `Objective C` syntax,\
    \ it does it all without the use of a semi-colon, unless you want to insert multiple\
    \ code statements on a single line, in which case the semi-colon is supported\
    \ and, indeed, in that case, required.\n\n## Variable Names and Unicode\n\nBoth\
    \ Swift and Objective C supports Unicode characters in variable names. In short,\
    \ you could use anything you wanted, including non-ASCII characters and emoticons\
    \ in your variable names – if you really wanted.\n\n## Integer Bounds\n\nBoth\
    \ Objective C and Swift use static constants for when you want to access the maximum\
    \ and minimum bounds for different types of integer.\n\n### Integer Bounds\n\n\
    #### C#\n```csharp\nvar a = Int32.MinValue;\nvar b = Int32.MaxValue;\n```\n\n\
    #### Swift\n```swift\nvar a = Int32.min\nvar b = Int32.max\n```\n\n## Type Inference\n\
    \nSwift and Objective C both support type inference, as we mentioned earlier,\
    \ in circumstances where the compiler can infer the declared variable type from\
    \ its immediate assignment.\n\n### Type Inference\n\n#### C#\n```csharp\nvar a\
    \ = 3; // integer\nvar b = 0.14 // double\nvar c = a + b; // double\n```\n\n####\
    \ Swift\n```swift\nvar a = 3 // integer\nvar b = 0.14 // double\nvar c = a + b\
    \ // double\n```\n\nAlso note, in the example of type inference above that, when\
    \ you declare a variable and then assign a value immediately - a value that is\
    \ the result of two more variables - the type will still be inferred.\n\n## String\
    \ Comparison\n\nBoth Swift and Objective C compare strings in similar ways\n\n\
    ### String Comparison\n\n#### C#\n```csharp\nvar a = \"One\";\nvar b = \"One\"\
    ;\nif (a == b) {\n    // both variables are considered equal\n}\n```\n\n#### Swift\n\
    ```swift\nvar a = \"One\"\nvar b = \"One\"\nif a == b {\n    // both variables\
    \ are considered equal\n}\n```\n\nThey also both use similar method to detect\
    \ if the start or the end of a string matches with another specified string\n\n\
