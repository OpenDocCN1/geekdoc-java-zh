    \ = frog else {\n    // 歉，这里没有青蛙裤\n    return\n}\n```\n\n## 协议扩展\n\nSwift 2 允许你扩展协议并为方法和属性添加实现。虽然你已经对结构体和类这样做，但能够扩展协议会扩展你的能力范围。\n\
