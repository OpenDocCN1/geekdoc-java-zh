  trans: "\n\n类型推断虽然很方便，但如果你不需要立即为变量赋值，你可能需要显式地指定变量类型：\n\n### 类型注解\n\n#### C#\n```csharp\n\
    string firstName; own```\n\n#### Swift\n```swift\nvar firstName: String\n```\n\
    \n你是否注意到 Swift 并不使用分号？虽然 Swift 的语法与 `Objective C` 非常相似，但它在不使用分号的情况下完成所有操作，除非你想在单行内插入多个代码语句，在这种情况下，它支持分号，而且实际上在那种情况下是必须的。\n\
    \n## 变量名与 Unicode\n\nSwift 和 Objective C 都支持在变量名中使用 Unicode 字符。简而言之，如果你真的想，你可以在变量名中使用任何内容，包括非\
    \ ASCII 字符和表情符号。\n\n## 整数边界\n\nObjective C 和 Swift 都使用静态常量来访问不同整数类型的最大和最小边界值。\n\
    \n### 整数边界\n\n#### C#\n```csharp\nvar a = Int32.MinValue;\nvar b = Int32.MaxValue;\n\
    ```\n\n#### Swift\n```swift\nvar a = Int32.min\nvar b = Int32.max\n```\n\n## 类型推断\n\
    \nSwift 和 Objective C 都支持类型推断，正如我们之前提到的，在编译器可以从直接赋值中推断出声明的变量类型的情况下。\n\n### 类型推断\n\
    \n#### C#\n```csharp\nvar a = 3; // integer\nvar b = 0.14 // double\nvar c = a\
    \ + b; // double\n```\n\n#### Swift\n```swift\nvar a = 3 // integer\nvar b = 0.14\
    \ // double\nvar c = a + b // double\n```\n\n另外请注意，在上面的类型推断示例中，当你声明一个变量并立即赋值一个值——该值是另外两个变量的结果时——类型仍然会被推断。\n\
    \n## 字符串比较\n\nSwift 和 Objective C 比较字符串的方式相似\n\n### 字符串比较\n\n#### C#\n```csharp\n\
    var a = \"One\";\nvar b = \"One\";\nif (a == b) {\n    // 两个变量被视为相等\n}\n```\n\n\
    #### Swift\n```swift\nvar a = \"One\"\nvar b = \"One\"\nif a == b {\n    // 两个变量被视为相等\n\
    }\n```\n\n它们都使用相似的方法来检测字符串的开头或结尾是否匹配另一个指定的字符串\n\n#### C#\n```csharp\nvar s = \"\
    Some Value\";\nif (s.StartsWith(\"Some\")) {\n    // 字符串以该值开头\n}\nif (s.EndsWith(\"\
    Value\")) {\n    // 字符串以该值结尾\n}\n```\n\n#### Swift\n```swift\nvar s = \"Some Value\"\
    \nif s.hasPrefix(\"Some\") {\n    // 字符串以该值开头\n}\nif s.hasSuffix(\"Value\") {\n\
    \    // 字符串以该值结尾\n}\n```\n\n再看一遍上面的示例。你是否注意到当你在 Swift 中使用 `IF` 语句时，不需要使用括号？\n\n\
    ## 字符串大写或小写转换\n\nSwift 和 Objective C 都支持相似的方法在大小和小写之间转换字符串\n\n### 字符串大写与小写\n\n\
    #### C#\n```csharp\nvar s = \"some Value\";\nvar upperS = s.ToUpper();\nvar lowerS\
    \ = s.ToLower();\n```\n\n#### Swift\n```swift\nvar s = \"some Value\"\nvar upperS\
    \ = s.uppercaseString\nvar lowerS = s.lowercaseString\n```\n\n## 声明数组\n\nSwift\
    \ 和 Objective C 都支持使用单行代码来声明并赋值 `Array`\n\n### 在单行上声明数组\n\n#### 字符串数组\n\n####\
    \ C#\n```csharp\nvar arr = new string[] { \"One\", \"Two\" };\n```\n\n#### Swift\n\
    ```swift\nvar arr = [\"One\", \"Two\"]\n```\n\n#### 整数数组\n\n#### C#\n```csharp\n\
    var arr = new int[] { 1, 2 };\n```\n\n#### Swift\n```swift\nvar arr = [1, 2];\n\
    ```\n\n## 数组的操作\n\n在处理 `Arrays` 时，Swift 和 Objective C 之间存在细微差异\n\n### 遍历数组\n\n\
    #### C#\n```csharp\nforeach (var item in arr) {\n    // 执行某些操作\n}\n```\n\n####\
    \ Swift\n```swift\nfor item in arr {\n    // 执行某些操作\n}\n```\n\n#### 根据索引获取项\n\n\
    #### C#\n```csharp\nvar item = arr[0];\n```\n\n#### Swift\n```swift\nvar item\
    \ = arr[0]\n```\n\n#### 根据索引设置项\n\n#### C#\n```csharp\narr[0] = \"Value\";\n```\n\
    \n#### Swift\n```swift\narr[0] = \"Value\"\n```\n\n#### 数组是否为空？\n\n#### C#\n```csharp\n\
    if (arr.Length == 0) {\n    // 数组为空\n}\n```\n\n#### Swift\n```swift\nif arr.isEmpty\
    \ {\n    // 数组为空\n}\n```\n\n#### 向数组添加项\n\n#### C#\n```csharp\nArray.Resize(ref\
    \ arr, arr.Length + 1);\narr[arr.Length - 1] = \"Three\";\n```\n\n#### Swift\n\
    ```swift\narr.append(\"Three\")\n```\n\n#### 根据索引获取项（重复）\n\n#### C#\n```csharp\n\
    var item = arr[0];\n```\n\n#### Swift\n```swift\nvar item = arr[0]\n```\n\n##\
    \ 声明字典\n\nSwift 和 Objective C 都支持使用单行代码来声明并赋值 `Dictionary`\n\n#### 在单行上声明字典\n\n\
    #### C#\n```csharp\nvar dict = new Dictionary<string, string> { { \"One\", \"\
    Value\" }, { \"Two\", \"Value\" };\n```\n\n#### Swift\n```swift\nvar dict = [\"\
    One\": \"Value\", \"Two\": \"Value\"]\n```\n\n## 字典的操作\n\n在处理 `Dictionaries` 时，Swift\
    \ 和 Objective C 之间存在细微差异\n\n### 遍历字典\n\n#### C#\n```csharp\nforeach (var kvp in\
    \ dict) {\n    // 执行某些操作\n}\n```\n\n#### Swift\n```swift\nfor (key, value) in\
    \ dict {\n    // 执行某些操作\n}\n```\n\n#### 根据键获取值\n\n#### C#\n```csharp\nvar value\
    \ = dict[\"One\"];\n```\n\n#### Swift\n```swift\nlet value = dict[\"One\"]\n```\n\
    \n#### 根据键设置值\n\n#### C#\n```csharp\ndict[\"One\"] = \"Value\";\n```\n\n#### Swift\n\
    ```swift\ndict[\"One\"] = \"Value\"\n```\n\n#### 根据键移除项\n\n#### C#\n```csharp\n\
    dict.Remove(\"One\");\n```\n\n#### Swift\n```swift\ndict.removeValue(forKey: \"\
    One\")\n```\n\n#### 字典是否为空？\n\n#### C#\n```csharp\nif (dict.Count == 0) {\n  \
    \  // 字典为空\n}\n```\n\n#### Swift\n```swift\nif dict.isEmpty {\n    // 字典为空\n}\n\
    ```\n\n#### 向字典添加项\n\n#### C#\n```csharp\ndict.Add(\"Three\", \"Value\");\n```\n\
    \n#### Swift\n```swift\ndict[\"Three\"] = \"Value\"\n```\n\n## For 循环\n\nSwift\
    \ 和 Objective C 都支持 `for` 循环\n\n## 条件语句\n\nSwift 和 Objective C 都支持 If-Then 条件语句。Swift\
    \ 的细微不同在于匹配条件周围不需要括号\n\n## Switch 语句\n\nSwift 和 Objective C 的 Switch 语句相似，但 case\
    \ 语句——在 Swift 中，这些不会像 Objective C 那样自动跳转到下一个。因此，C 需要 `break` 关键字来退出语句，除非你打算贯穿到下一个\
    \ case。在 Swift 中，你必须使用 `fallthrough` 关键字来告诉它跳转到下一个 case 语句。\n\n"
- fmt: "\n```swift\nswitch (i) {\n  case 1:\n  case 2:\n  case 3:\n    // do something\n\
    \    break;\n  case 4:\n    // do something\n    break;\n  default:\n    // do\
    \ something\n    break;\n}\n```\n\n```swift\n// Swift\nswitch i {\n  case 1...3:\n\
    \    // do something\n  case 4:\n    // do something\n  default:\n    // do something\n\
    }\n```\n\n## Functions\n\nFunctions are quite a big subject on their own when\
    \ it comes to being compared with Objective C so, for now have a look at this\
    \ fairly basic example.\n\n```csharp\n// Function with Parameter and Return Value\n\
    // C#\nstring sayHello(string name) {\n  // do something\n}\n```\n\n```swift\n\
