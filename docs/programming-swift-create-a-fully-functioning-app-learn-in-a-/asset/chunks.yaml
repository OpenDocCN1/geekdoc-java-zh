    *   let cell = tableView.dequeueReusableCellWithIdentifier("Cell", forIndexPath:
    indexPath) as UITableViewCell


    *   let object = objects[indexPath.row] as NSDate


    *   cell.textLabel?.text = object.description


    *   return cell


    *   }


    Notice on the first line of the function tableView:cellForRowAtIndexPath we have
    called dequeueeusableCellWithIdentifier:forIndexPath on the table view. For this
    method, the return type is AnyObject.


    Any class could be returned from this particular function call so you will need
    to type cast it by using the as UITableViewCell that you can see at the end of
    the line. Later on, you will change this to be the custom cell class of taskCell,
    which you will be creating later on.


    When you are working with Cocoa frameworks, this is common, because there is a
    need for compatibility with the old style used in Objective C, where id would
    be the return type, meaning a pointer to any object. Bear in mind that Swift avoids
    the use pointers wherever it can and this is why solutions such as this have been
    created, keeping your code much safer.


    The last part that is interesting is the syntax used for mark comments, which
    work to help split and let you jump through the files:


    *   // MARK: - Table View


    When you use this syntax for a comment, you can split a file up, which makes it
    far easier to jump through it. This also helps readers to see exactly what a set
    of functions are related to in the file.


    ## DetailViewController.swift


    There is one more file we need to look at – the DetailViewController. This is
    a small file compared to the MasterViewController but it does have a number of
    very good examples of how Swift works to help you write much better code.


    To start with, we have the @IBOutlet attribute, which is for the variable detailDescriptionLabel.
    In a similar way to how it was in the header files in Objective C, this particular
    variable attribute tells Interface Builder about this particular property on your
    DetailViewController:


    *   @IBOutlet weak var detailDescriptionLabel: UILabel!


    You may also have spotted that this variable has been defined as weak because
    you do not want DetailViewController to own the view.


    Next, there is a variable property definition that looks interesting. This has
    a bit of extra code attached to it to define the behavior of a property that is
    right beside its definition:


    *   var detailItem: AnyObject? {


    *   didSet {


    *   // Update the view.


    *   self.configureView()


    *   }


    *   }


    There is also an optional AnyObject? Type but the most interesting bit is didSet
    code block.


    Properties are able to contain blocks of code that will execute as a callback
    to a specific event. The best part about this is that, rather than defining a
    specific setter that will do this, you can actually have a much clearer definition
    of what the code is doing there.


    This piece of code now states, very clearly, that once detailItem has been set,
    at any time from now on configureView has to be called. This is because something
    that pertains to the view has changed. These callbacks are something of a large
    leap for iOS applications, in terms of the expressive nature of the code.


    Ow, earlier on, we talked briefly about optionals because they are used quite
    a lot in iOS coding for applications so here is another example for you on how
    these optionals are used.


    *   func configureView() {


    *   // Update the user interface for the detail item.


    *   if let detail: AnyObject = self.detailItem {


    *   if let label = self.detailDescriptionLabel {


    *   label.text = detail.description


    *   }


    *   }


    *   }


    Notice that optional binding is used in an IF statement. This means that if the
    assignment expression on the right has a value, it will be assigned to the left
    through the duration of the IF body. If that expression does not have a value,
    the IF statement body will be ignored. This is similar to the way we checked for
    nil in Objective C but is a much safer and more expressive way of doing it.


    ## Coming Up Next


    So, in this part of this tutorial, you never actually write any code. Instead,
    you did something that was more important. You looked at how Swift has an effect
    on the way we work with the Cocoa Touch classes and API’s/ Without this, you would
    find yourself fighting against Swift as you try to write applications the way
    you would have done previously.


    What you have done is learn about how to make developing you application much
    safer, without running the expressive nature of the Swift programming language.
    You can clearly see that Apple has put great consideration into integration with
    their existing frameworks and have made sure that they have not missed out even
    one small detail.


    With this part of the tutorial out of the way, it’s time to start looking at building
    your application. So, going back to the TaskMe application that you generated
    at the beginning, using XCode 6, we now need to start adding in some true functionality


    Using the“TaskMe”application that you generated in XCode 6, it is time to start
    adding some real functionality.


    ## Your First Feature


    The first feature that you are going to add in is the ability to add a new task
    to your list. Once this feature has been created, all you will need to do is tap
    the + button, type the name of the title of the task and a few notes if you like,
    and, as soon as you ta Save you will automatically go back to your list of tasks.


    ## Setting up The Storyboard


    We want to make things nice and simple for your users so it would be good if all
    they had to do was tap on the + button to have a new controller automatically
    pop up. So, to start on this, open up Main.storyboard.


    You are going to use two controllers to do this:


    *   UINavigationController


    *   UIViewController 


    The latter will be embedded in the new UINavigationController (you will not be
    reusing the one that is already on your screen as that is for the main workflow.
    So, go to the bottom right hands side of the XCode screen and drag out the UINavigationController
    and the UIViewController from the object library int the editor area.


    Now delete the table view controller that UINavigationController created, hold
    down CTRL and click the UINavigationController. Drag it across to the UIViewControllerthat
    was created. A popup will appear–click on root view controller in the Relationship
    Segue section. The UIViewController will now be embedded in the UINavigationController,
    ensuring that you will be able to add in Cancel and Save buttons later on.


    Now it’s time to set up a segue so that you can navigate to UINavigationController
    and UIViewController. Before you do, open the MasterViewController.swift file
    and delete these two lines from  viewDidLoad:


    *   let addButton = UIBarButtonItem(barButtonSystemItem: .Add, target: self, action:
    "insertNewObject:")


    *   self.navigationItem.rightBarButtonItem = addButton


    Now that they have been deleted, you can also delete InsertNewObject: method.'
