    \ called the `personName`, of the `string` value should be defined for accomplishing\
    \ this. The return type of this function is also a `string` and it contains the\
    \ greeting which will be returned back to him:\n\n```swift\nfunc sayHello(personName:\
    \ String) -> String {\n  let greeting = \"Hello, \" + personName + \"!\"\n  return\
    \ greeting\n}\n```\n\nThe function definition will be prefixed with the keyword\
