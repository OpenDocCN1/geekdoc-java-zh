  trans: "\n\n由于 `BlackjackCard` 结构体没有自定义初始化器，因此它有一个隐式的成员初始化器，这在结构体类型的成员初始化器中进行了描述。此初始化器可用于初始化一个名为\
    \ `AceOfSpades` 的新常量。\n\n```swift\nlet theAceOfSpades = BlackjackCard(rank: .Ace,\
    \ suit: .Spades)\nprint(\"theAceOfSpades: \\(theAceOfSpades.description)\")\n\
    // prints \"theAceOfSpades: suit is♠, value is 1 or 11\"\n```\n\n如你所示，`Suit` 和\
    \ `Rank` 嵌套在 `BlackjackCard` 内部。从上下文中我们可以推出它们的类型。枚举 case 可以通过实例的初始化来引用。引用将通过它们的\
    \ case 名进行。从上面的示例可以看出，`description` 属性报告了值为 1 或 11。\n\n## 引用嵌套类型\n\n要在定义范围之外使用嵌套类型时，类型的名称应以其所属名称作为前缀。\n\
    \n```swift\nlet heartsSymbol = BlackjackCard.Suit.Hearts.rawValue\n// heartsSymbol\
    \ is \"♡\"\n```\n\n对于上面的示例，`Rank`、`Suit` 和 `Values` 的名称被刻意保持短，这是因为这些名称由它们定义的内容自然地限定了。\n\
    \n## 函数类型作为参数类型\n\n在 Swift 中，允许将像 `(Int, Int) -> Int` 的函数类型作为另一个函数的参数类型。通过这种方式，你可以在每次调用函数时将某些函数实现部分留给函数的调用者。\n\
    \n下面是一个示例，将打印上述数学函数的结果。\n\n```swift\nfunc printMathResult(mathFunction: (Int,\
    \ Int) -> Int, _ a: Int, _ b: Int) {\n    print(\"Result: \\(mathFunction(a, b))\"\
    )\n}\nprintMathResult(addTwoInts, 3, 5)\n// prints \"Result: 8\"\n```\n\n在这个示例中，定义了一个名为\
    \ `printMathResult(_:_:_:)` 的函数，该函数有三个参数。函数的第一个参数是 `mathFunction`。第一个参数的类型是 `(Int,\
    \ Int) -> Int`。相同类型的函数可以作为 `mathFunction` 参数的参数传递。`a` 和 `b` 是第二个和第三个参数。第二个和第三个参数是\
    \ `Int` 类型。对于提供的数学函数，这些参数将用作输入值。\n\n当我们调用 `printMathResult(_:_:_:)` 函数时，函数 `addTwoInts(_:_:)`\
    \ 将带有 `3` 和 `5` 整数值传递。这现在会调用带有 `3` 和 `5` 作为值的提供的函数，并将打印 8 作为结果。\n\n打印结果是函数 `printMathResult(_:_:::)`\
    \ 的职责。它将打印适当类型的数学函数调用。函数的实现在这里并不重要。这里唯一重要的是函数的类型，该类型需要是正确的。通过这种方式，函数 `printMathResult(_:_:_:)`\
    \ 将将部分功能交给调用该函数的人。这将以类型安全的方式发生。\n\n## 函数类型作为返回类型\n\n给定函数的类型可以作为另一个函数的返回类型。这可以通过在返回函数的\
    \ `->` 之后提供完整的函数类型来实现。\n\n在下一个示例中定义了两个简单的函数 `stepForward(_:)` 和 `stepBackward(_:)`。`stepForward(_:)`\
    \ 函数返回比输入值大 1 的值，而 `stepBackward(_:)` 函数返回比输入值小 1 的值。这两个函数的类型都是 `(Int) -> Int`：\n\
    \n```swift\nfunc stepForward(input: Int) -> Int {\n    return input + 1\n}\nfunc\
    \ stepBackward(input: Int) -> Int {\n    return input - 1\n}\n```\n\n这里有一个函数 `chooseStepFunction(_:)`，它的返回类型为“类型为\
    \ `(Int) -> Int` 的函数”。根据布尔参数，`chooseStepFunction(_:)` 将返回 `stepForward(_:)` 函数或\
    \ `stepBackward(_:)` 函数。\n\n```swift\nfunc chooseStepFunction(backwards: Bool)\
    \ -> (Int) -> Int {\n    return backwards ? stepBackward : stepForward\n}\n```\n\
    \n现在你可以使用 `chooseStepFunction(_:)` 获取一个向某个方向或其他方向移动的函数。\n\n```swift\nvar currentValue\
    \ = 3\nlet moveNearerToZero = chooseStepFunction(currentValue > 0)\n// moveNearerToZero\
    \ now refers to the stepBackward() function\n```\n\n上面的示例确定是否需要正步或负步来让变量 `currentValue`\
    \ 逐渐靠近 0。\n\n`currentValue` 的初始值为 `3`，这意味着在这种情况下 `currentValue > 0` 为真。这将使 `chooseStepFunction(_:)`\
    \ 返回 `stepBackward(_:)` 函数。我们使用常量 `moveNearerToZero` 来存储返回的函数引用。\n\n`moveNearerToZero`\
    \ 现在引用正确的函数，因此它可以用于计数到 0：\n\n```swift\nprint(\"Counting to zero:\")\n// Counting\
    \ to zero:\nwhile currentValue != 0 {\n    print(\"\\(currentValue)... \")\n \
    \   currentValue = moveNearerToZero(currentValue)\n}\nprint(\"zero!\")\n// 3...\n\
    // 2...\n// 1...\n// zero!\n```\n\n## 嵌套函数\n\n你目前为止看到的所有都是全局函数的示例。全局函数定义在全局作用域内。你还可以在其他函数内部定义函数。这些被称为嵌套函数。\n\
    \n默认情况下，所有嵌套函数都是隐藏的。尽管它们是隐藏的，但嵌套函数可以被闭包函数使用和调用。\n\n```swift\nfunc chooseStepFunction(backwards:\
    \ Bool) -> (Int) -> Int {\n    func stepForward(input: Int) -> Int {\n       \
    \ return input + 1\n    }\n    func stepBackward(input: Int) -> Int {\n      \
    \  return input - 1\n    }\n    return backwards ? stepBackward : stepForward\n\
    }\nvar currentValue = -4\nlet moveNearerToZero = chooseStepFunction(currentValue\
    \ > 0)\n// moveNearerToZero now refers to the stepForward() function\nwhile currentValue\
    \ != 0 {\n    print(\"\\(currentValue)... \")\n    currentValue = moveNearerToZero(currentValue)\n\
    }\nprint(\"zero!\")\n// -4...\n// -3...\n// -2...\n// -1...\n// zero!\n```\n\n\
    # 第 7 章：创建你的第一个 App\n\n现在你已经学习了 Swift 编程基础，并学会了如何创建 TipCalculator 类，是时候学习如何制作第一个\
    \ iOS App 了。我们将使用你开发的 TipCalculator 类并为它创建一个用户界面。\n\n## 开始\n\n* 启动 XCode 并打开 `File\\\
    New\\Project`\n* 选择 `iOS\\Application\\Single View App`\n* 点击 Next\n* 在要求输入名称的地方输入\
    \ TipCalculator\n* 将语言设置为 Swift\n* 将设备设置为 iPhone\n* 确保 Use Core Data 旁的复选框未勾选\n\
    * 点击 Next\n* 选择你想保存新项目的目录并点击 Create\n\n现在看看 XCode 为你做了什么。在 XCode 左上角，点击 iPhone\
    \ 6 Simulator 然后点击 Play。你应该看到一个显示 Tip Calculator 的启动界面，然后会出现一个空白屏幕。\n\n## 创建你的模型\n\
    \n在创建用户界面之前，我们需要为 App 创建模型。模型是一组类，代表了 App 中的数据以及 App 将对数据执行的操作。\n\n对于本教程而言，你的模型将是\
    \ Playground 中创建的 TipCalculator 类，但我们将将其重命名为 TipCalculatorModel。\n\n要添加此类，打开 `File\\\
    New\\File`：\n* 选择 `iOS\\Source\\Swift File`\n* 命名为 `TipCalculatorModel.swift`\n\
    * 点击 Create\n\n"
- fmt: "\nWhat you are going to do is move your playground file to a swift file because\
    \ you cannot call up code that is in a playground file – these are just for testing\
    \ purposes.\n\nOpen `TipCalculator.swift`\n\nCopy the class from your playground\
    \ file (not the testing lines at the bottom) into the Swift file and make these\
    \ changes:\n\n- Rename the class to `TipCalculatorModel`\n- You need to change\
    \ `total` and `taxPct` to variables.\n- You will need to change `subtotal` to\
    \ a computed property and you do this by replacing the `subtotal` property with\
    \ the following code:\n\n```swift\nvar subtotal: Double {\n    get {\n       \
    \ return total / (taxPct + 1)\n    }\n}\n```\n\nComputed properties don’t store\
    \ values, they are computed on other values. Here you are going to be calculating\
    \ the subtotal whenever it is accessed, going on the values of `total` and `taxPct`.\
    \ \n\nNext, you need to delete the entire line that sets `subtotal` in `init`\
    \ and get rid of any comments in the file.\n\nWhen you are finished, your file\
    \ should look like:\n\n```swift\n//\n// TipCalculatorModel.swift\n// TipCalculator\n\
    //\n// Created by Main Account on 12/18/14.\n// Copyright (c) 2014 Razeware LLC.\
    \ All rights reserved.\n//\nimport Foundation\n\nclass TipCalculatorModel {\n\
    \    var total: Double\n    var taxPct: Double\n    var subtotal: Double {\n \
    \       get {\n            return total / (taxPct + 1)\n        }\n    }\n\n \
    \   init(total: Double, taxPct: Double) {\n        self.total = total\n      \
    \  self.taxPct = taxPct\n    }\n\n    func calcTipWithTipPct(tipPct: Double) ->\
    \ Double {\n        return subtotal * tipPct\n    }\n\n    func returnPossibleTips()\
    \ -> [Int: Double] {\n        let possibleTipsInferred = [0.15, 0.18, 0.20]\n\
    \        let possibleTipsExplicit:[Double] = [0.15, 0.18, 0.20]\n        var retval\
    \ = [Int: Double]()\n        for possibleTip in possibleTipsInferred {\n     \
    \       let intPct = Int(possibleTip*100)\n            retval[intPct] = calcTipWithTipPct(possibleTip)\n\
    \        }\n        return retval\n    }\n}\n```\n\nNow that your app model is\
    \ ready, it’s time to look at views!\n\n# Chapter 8: Introduction to Storyboards\
    \ and Interface Builder\n\nYour user interface is going to be created in something\
    \ called Storyboard and XCode includes Interface Builder, a neat tool that lets\
    \ you easily edit Storyboards. Interface Builder lets you lay out everything –\
    \ buttons, labels, text fields and all the other controls that are in your app\
    \ by dragging and dropping. These are called Views. Look on the left hand side\
    \ of XCode and click on `Main.storyboard`. This will bring up the Interface Builder.\
    \ This is quite detailed so we will cover one part of the screen at once:\n\n\
    - On the left is Project Navigator – where your project files show up.\n- On the\
    \ left of Interface Builder is Document Outline – your views can be seen at a\
    \ glance for each screen of your app – make sure you click on the down arrows\
    \ beside the items to see the entire document.\n- At the moment, your app has\
    \ just one view controller but we are going to be adding stuff into this very\
    \ soon.\n- Look to the left of your view controller, there is an arrow. This shows\
    \ that this is the Initial View Controller – this is the first page displayed\
    \ when your app opens. This can be changed by dragging the arrow to another view\
    \ controller.\n- Now look at the bottom of the Interface Builder – you will see\
    \ the words “w Any” and “h Any”. This shows that your app is being edited to work\
    \ on any size interface.\n- At the top of the View Controller, there are three\
    \ small icons – these represent the controller, First Responder and Exit. You\
    \ don’t need to worry about these for the purpose of this tutorial.\n- Look at\
    \ the bottom right hand side of Interface Builder and you will see four icons\
    \ that are related to Auto Layout – again, you will not be using those in this\
    \ tutorial.\n- At the top right hand side of Interface Builder there are Inspectors\
    \ – these are for whatever has been selected in the Document Outline. See that\
    \ there are several tabs – you will be making a good use of these in this tutorial.\n\
    - Last but not least, bottom right of the Interface Builder are the Libraries.\
    \ These list the different types of view controllers that you can add into your\
    \ app.\n\n## Creating your Views\n\nIf you remember, your `TipCalculatorModel`\
    \ class has a pair of inputs – a tax percentage and a total. What would be good\
    \ for users of your app is if they could type the total in using the numeric keyboard\
    \ on their iPhone – that’s where a text field comes in handy. Because the tax\
    \ percentage is generally restricted to a smaller value range, you will use a\
    \ slider for that.\n\nAs well as the text field and the slider, you will need\
    \ a label for each one, a button that performs the calculation, a navigation bar\
    \ showing the name of the app and a text field that displays the results. \n\n\
    If you are ready, let’s begin to build the user interface for your app, one piece\
    \ at a time:\n\n1. **Navigation Bar** – instead of directly adding this, go to\
    \ the document outline and select the view controller. Now go to `Editor\\Embed\
    \ In\\Navigation Controller`. This sets a navigation bar in your view controller\
    \ – double click on it and input the text.\n2. **Labels** – Go to the document\
    \ outline and drag a label to the view controller. Double click it and put the\
    \ text as `Calculator`.\n3. **Text Field** – Drag a text field to the view controller.\
    \ Go to the Attribute Inspector and set `Keyboard Type=Decimal Pad`.\n4. **Slider**\
    \ – Drag a slider to the view controller. Go to the Attribute Inspector and set\
    \ `Minimum Value=0`, `Maximum Value=10`, and `Current Value=6`.\n5. **Button**\
    \ – Drag a button to the view controller. Double click it and put the text as\
    \ `Calculate`.\n6. **Text View** – Drag a Text View to the view controller. Double\
    \ click it and delete the text. Go to the Attributes Inspector and ensure that\
    \ `Editable` and `Selectable` are not checked.\n7. **Tap Gesture Recognizer**\
    \ – Drag a Tap Gesture Recognizer to the main view. This is going to tell when\
    \ user taps on the view to shut the keyboard down.\n8. **Auto-Layout** – Interface\
    \ Builder is great for building good auto-layout constraints automatically. To\
