    ## Minesweeper game


    Here, we will design the minesweeper game using swift. This tutorial will show
    you how the minesweeper game is built from start to finish.


    Minesweeper: An Intro Tutorial to Swift iOS Development


    We will build the minesweeper game using swift and the storyboard Interface builder
    of XCode. For this you need to have the latest version of XCode and the latest
    version of the swift language. You can download it using the link from the swift
    resources page or you can easily download it from the App Store.


    This tutorial will help you create the swift powered iOS app. However, for the
    sake of brevity, some aspects of the swift are not explained in this tutorial.


    I''m sure most of the people are familiar with the minesweeper game. If not, have
    a quick look of it online.


    Open the latest version of XCode. Create a new project by following the given
    steps.


    Give a product name for the application. We will simply name it minesweeper.


    Give the organization name and organization identifiers.


    Select the language as Swift


    Select the device for which you are designing this application. If you want your
    application to work on all the iOS devices, select “Universal” from the list.


    On the very first screen, go to the deployment info section from the general settings
    and uncheck the landscape right and landscaper left orientations. This will make
    the application run in portrait.


    We will start designing the application by laying the user interface. We will
    do it with the help of the storyboard interface builder. First, open the main.storyboard
    and then select the ViewController present on the screen. For this you may have
    to select the top interface bar rather than clicking on the view for selecting
    the ViewController. On the right you should make sure that the utilities panel
    is open. In case if it is not open, you should open it by clicking on the top
    right button present on the XCode window. Now that you have selected the ViewController,
    go to the file inspector tab present in that panel and uncheck the option “Use
    Auto Layout”. If any pop-up shows up, select the iPhone and disable size classes.
    Though this app can be used on any iOS device, we will mainly design it for using
    it on an iPhone. We can make this application compatible to the iPad by making
    a few modifications. We will not be using all of the functionalities of the auto
    layout and for this reason we will disable it so that things can be simpler.


    Select the View component from the bottom right panel of the object library and
    drag it onto the view controller. With this view, our minesweeper board grid will
    be held. Change the color of the background from the attributes inspector to Group
    Table View Background Color. It is a gentle grey color.'
