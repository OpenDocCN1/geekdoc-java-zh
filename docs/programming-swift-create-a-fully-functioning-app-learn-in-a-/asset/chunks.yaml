  trans: "\n\n*   }\n\n这样，如果你之前没有点击过方格，点击它们时就会显示方格的内容。`squareButton` 上的一个方法会被调用，用于请求在\
    \ `squareButton` 上显示的新文本。我们尚未实现这一功能，现在我们将打开 `SquareButton.swift` 文件并添加 `getLabelText`：\n\
    \n```swift\nfunc getLabelText() -> String {\n    // check the numNeighboringMines\
    \ and isMineLocation properties for determining the text to be displayed\n   \
    \ if !self.square.isMineLocation\n    {\n        if self.square.numNeighboringMines\
    \ == 0\n        {\n            // case 1: 没有雷且周围也没有雷\n            return \"\"\n\
    \        }\n        else\n        {\n            // case 2: 没有雷但周围有雷\n       \
    \     return \"\\(self.square.numNeighboringMines)\"\n        }\n    }\n    //\
    \ case 3: 有雷\n    return \"M\"\n}\n```\n\n我们现在再次构建（Build）并运行（Run）应用程序。现在，如果你点击按钮，如果周围有雷，按钮上的文字将变为对应的数字。如果周围没有雷，则不显示任何内容。如果有雷，则将显示“M”。\n\
    \n我们可以让新游戏按钮结束当前游戏并开始新游戏。如果没有当前游戏，它将直接启动一个新游戏。这是一个我们可以添加的快速功能。在我们已经定义的 `newGamePressed`\
    \ 方法中，调用 `startNewGame`。它现在看起来如下：\n\n```swift\n@IBAction func newGamePressed()\n\
    {   \n    println(\"new game\")\n    self.startNewGame()\n}\n```\n\n如果测试测试应用程序，点击按钮将随机化雷的位置，并重置方格按钮。\n\
    \n当我们点击带有雷的按钮时，游戏应该结束。我们可以添加一个在每次点击雷时弹出的警框（alert）。该警框还将包含一个重置游戏的按钮。在 `squareButtonPressed`\
    \ 的底部添加此条件判断：\n\n```swift\nif sender.square.isMineLocation {\n    self.minePressed()\n\
    }\n```\n\n为了显示警框，我们应该实现 `minePressed`。\n\n```swift\nfunc minePressed()\n{\n  \
    \  // show an alert when you tap on a mine\n    var alertView = UIAlertView()\n\
    \    alertView.addButtonWithTitle(\"New Game\")\n    alertView.title = \"BOOM!\"\
    \n    alertView.message = \"You tapped on a mine.\"\n    alertView.show()\n}\n\
    ```\n\n![Description: 带有新游戏提示的模态](img/00001.jpeg) ![](img/00002.jpeg)\n\n如果点击新游戏按钮，AlertView\
    \ 将关闭。实际上，它不会启动新游戏。你可以通过添加以下方法让按钮启动新游戏：\n\n```swift\nfunc alertView(View: UIAlertView!,\
    \ clickedButtonAtIndex buttonIndex: Int) {\n    //start new game when the alert\
    \ is dismissed\n    self.startNewGame()\n}\n```\n\n我们尚未指定 `ViewController` 类将处理关闭交互。为了实现这一点，交互应该从\
    \ `alertView` 传递给 `ViewController`。这可以通过设置 `alertView` 的 `delegate` 属性来实现。这将添加到\
    \ `minePressed` 方法的底部：\n\n```swift\nalertView.delegate = self\n```\n\n现在，当点击 `alertView`\
    \ 中的“新游戏”时，棋盘将重置，以便你可以再次尝试。\n\n大部分核心玩法已经完成，现在我们应该添加总步数以及自游戏开始以来秒数的时间属性。这些属性将添加到\
    \ `ViewController` 类作用域内。还应包含 `didSet` 方法：\n\n```swift\nvar moves:Int = 0\n{ \
    \  \n    didSet\n    {        \n        self.movesLabel.text = \"Moves: \\(moves)\"\
    \        \n        self.movesLabel.sizeToFit()    \n    }\n}\n\nvar timeTaken:Int\
    \ = 0  \n{   \n    didSet\n    {\n        self.timeLabel.text = \"Time: \\(timeTaken)\"\
    \n        self.timeLabel.sizeToFit()\n    }\n}\n```\n\n每当属性值变化时，`didSet` 方法就会触发。它们将用于自动更新相应的标签显示。标签的大小将通过\
    \ `sizeToFit` 调整，这样当文本长度增加时，文本将适应标签。在底部添加此 `startNewGame` 方法，每当新游戏开始时重置变量。\n\n\
    ```swift\nfunc startNewGame() {\n    //start new game\n    self.resetBoard()\n\
    \    self.timeTaken = 0\n    self.moves = 0\n}\n```\n\n这些变量应该随着游戏的进行而更新，我们需要一种方法来实现它。`Moves`\
    \ 属性很容易，每当点击一个新按钮时，它都应该加 1。这应该添加到 `squareButtonPressed` 方法中存在的条件判断 `(!sender.square.isRevealed)`\
    \ 内部：\n\n```swift\nself.moves++\n```\n\n这有点复杂……\n\n"
