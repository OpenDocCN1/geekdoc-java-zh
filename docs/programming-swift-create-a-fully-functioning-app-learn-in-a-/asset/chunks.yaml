  trans: "\n\n```swift\nswitch (i) {\n  case 1:\n  case 2:\n  case 3:\n    // do something\n\
    \    break;\n  case 4:\n    // do something\n    break;\n  default:\n    // do\
    \ something\n    break;\n}\n```\n\n```swift\n// Swift\nswitch i {\n  case 1...3:\n\
    \    // do something\n  case 4:\n    // do something\n  default:\n    // do something\n\
    }\n```\n\n## Functions\n\n与 Objective C 相比时，函数本身是一个相当大的的话题，所以现在我们先来看这个相当基础的示例。\n\
    \n```csharp\n// 带有参数和返回值的函数\n// C#\nstring sayHello(string name) {\n  // do something\n\
    }\n```\n\n```swift\n// Swift\nfunc sayHello(name: String) -> String {\n  // do\
    \ something\n}\n```\n\n这是 Objective C 和 Swift 编程语言的基础对比。你可以看到它们在很多地方都有许多相似之处，但最大的差异之一之一就是它们处理数组的方式。Swift\
    \ 数组类似于 Objective C 中的 `List<>` 类，大多数开发者现在倾向于使用这种类而不是数组，除非性能要求他们必须使用数组。在下一章中，我们将详细讨论函数。\n\
    \n# 第 2 章：函数\n\n通常情况下，函数可以定义为自包含的、能够执行特定任务的代码段。通过分配函数名（该名称标识了它执行的任务），你可以调用该函数来执行它应该完成的任务。\n\
    \nSwift 的统一函数语法足够灵活，可以表示没有参数名的简单 C 风格函数，以及具有复杂的局部参数名和外部参数名的 Objective C 风格方法。参数将提供默认值以简化函数的调用。这些值可以以\
    \ `inout` 参入参数的形式给出，并在函数执行后修改它们所传递的变量。\n\n在 Swift 中，每个函数都有一个类型。每个函数都由一个参数类型和一个返回类型组成，它们可以像\
    \ `swift` 中的任何其他参数类型一样使用。通过这种方式，可以将函数作为参数传递给另一个函数，你也可以从其他函数返回函数。Swift 允许你在函数内部编写函数。通过这种方式，可以实现封装，并将实用的功能嵌套在其他函数内部。\n\
    \n### 定义和调用函数\n\n每当你定义一个函数时，你还可以定义一个或多个可选的类型化、命名值，这些值可以作为该函数的输入。这些被称为参数。你还可以定义一个可选的值类型，函数在工作完成后将其作为输出传回。这被称为返回类型。\n\
    \n每个函数都会被赋予一个函数名，这个函数名将描述它执行的任务。我们调用该函数是为了使用该函数并调用；我们将使用它的名称并向它传递输入值。这些输入值被称为参数。参数与函数的参数类型匹配。函数参数列表和函数的参数必须以相同的顺序提供。\n\
    \n这是一个使用名为 `sayHello(_:)` 函数的示例。之所以这样调用它是因为它执行的任务是接收人的名字作为输入并向他返回一个问候语。为了实现这一点，应该定义一个名为\
    \ `personName` 的类型为 `string` 的输入参数。该函数的返回类型也是 `string`，它包含了将返回给该的问候语：\n\n```swift\n\
    func sayHello(personName: String) -> String {\n  let greeting = \"Hello, \" +\
    \ personName + \"!\"\n  return greeting\n}\n```\n\n函数定义将以关键字 `func` 开头，信息将汇总到函数的定义中。函数的返回类型将使用返回箭头\
    \ `->` 指示。后面将是返回类型的名称。\n\n函数的定义将定义函数的任务、函数的输入以及任务完成后的函数返回类型。你可以使用定义从代码的任何地方明确地调用该函数：\n\
    \n```swift\nprint(sayHello(\"Chad\"))\n// prints \"Hello, Chad!\"\n\nprint(sayHello(\"\
    Bruce\"))\n// prints \"Hello, Bruce!\"\n```\n\n你可以通过在括号内传递字符串参数来调用函数 `sayHello(_:)`，例如\
    \ `sayHello(\"Chad\")`。由于函数的返回类型是一个 `string` 值，为了打印该字符串，可以将函数封装在对函数 `print(_:separator:terminator:)`\
    \ 的调用内部以检查返回值。\n\n将定义一个名为 `greeting` 的字符串常量，并向 `personName` 发送问候消息，以开始函数 `sayHello(_:)`\
    \ 的主体。`return` 关键字将用于将问候语传回。在调用 `return greeting` 后，函数将完成执行并返回问候语的当前值。\n\n函数 `sayHello(_:)`\
    \ 可以使用不同的输入值调用多次。在上面的示例中，我们可以看到如果使用“Chad”作为输入值以及“Bruce”作为输入值调用函数 `sayHello(_:)`\
    \ 会发生什么。在每情况下，函数将返回一个定制的问候语。\n\n你可以通过将消息创建和返回语句合并为单行来简化函数体：\n\n```swift\nfunc\
    \ sayHelloAgain(personName: String) -> String {\n  return \"Hello again, \" +\
    \ personName + \"!\"\n}\n\nprint(sayHelloAgain(\"Chad\"))\n// prints \"Hello again,\
    \ Chad!\"\n```\n\n### 函数参数和返回值\n\n在 Swift 中，返回值和函数参数是非常灵活的。你被定义包含单个未命名参数的简单实用函数，以及具有不同参数选项的复杂函数。\n\
    \n#### 无参数函数\n\n对于输入参数，函数不是必需的。这里有一个没有输入参数的示例。每当调用此函数时，它都会返回相同的消息。\n\n```swift\n\
    func sayHelloWorld() -> String {\n  return \"hello, world\"\n}\n\nprint(sayHelloWorld())\n\
    // prints \"hello, world\"\n```\n\n即使函数不接受参数，你也应该在函数定义的名称后添加括号。每当调用它时，函数名后都会跟一对空括号。\n\
    \n## 多参数函数\n\n可以给函数提供多个输入参数。这些参数将包含在函数的括号内，并使用逗号分隔。\n\n```swift\nfunc sayHello(personName:\
    \ String, alreadyGreeted: Bool) -> String {\n  if alreadyGreeted {\n    return\
    \ sayHelloAgain(personName)\n  } else {\n    return sayHello(personName)\n  }\n\
    }\n\nprint(sayHello(\"Popeye\", alreadyGreeted: true))\n// prints \"Hello again,\
    \ Popeye!\"\n```\n\n通过传递字符串参数值以及 `Bool` 参数值，你可以调用函数 `sayHello(_:alreadyGreeted:)``Bool`\
    \ 参数将在括号内标记为 `alreadyGreeted`。这些使用逗号分隔。\n\n当你使用多个参数调用函数时，第一个参数之后的任何参数将根据相应的参数名进行标记。\n\
    \n#### 无返回值的函数\n\n函数不需要定义返回类型。这里有一个示例函数 `sayHello(_:)`，以及它的版本 `sayGoodbye(_:)`，它将打印自己的字符串值而不是返回它：\n\
    \n```swift\nfunc sayGoodbye(personName: String) {\n  print(\"Goodbye, \\(personName)!\"\
    )\n}\n\nsayGoodbye(\"Lee\")\n// prints \"Goodbye, Lee!\"\n```\n\n由于此函数不需要返回任何内容，因此函数的定义不需要有返回类型或返回箭头\
    \ `->`。\n\n"
- fmt: "\nNote: In cases where the return value is not defined, the `sayGoodbye(_:)`\
    \ function can be used for returning a value. If there is no return type defined,\
    \ a `Void` type will be returned by the function. The `Void` is nothing but a\
    \ special value that has no elements inside it. Is an empty tuple and can be written\
    \ as `()`.\n\nWhen the `Void` is called, the return value of the functions can\
    \ be ignored.\n\n```swift\nfunc printAndCount(stringToPrint: String) -> Int {\n\
    \    print(stringToPrint)\n    return stringToPrint.characters.count\n}\n\nfunc\
    \ printWithoutCounting(stringToPrint: String) {\n    printAndCount(stringToPrint)\n\
    }\n\nprintAndCount(\"hello, world\")\n// prints \"hello, world\" and returns a\
    \ value of 12\nprintWithoutCounting(\"hello, world\")\n// prints \"hello, world\"\
    \ but does not return a value\n```\n\nThe function `printAndCount(_:)`, which\
    \ is the first function, will print a string and it will return the character\
    \ count as `Int`. The function `printWithoutCounting`, which is the second function,\
    \ will call the first function but it will ignore the return value of the first\
    \ function. The first function will print the message after calling the second\
    \ function. In this case, the return value will not be used.\n\nNote: When a function\
    \ says that it doesn't return a value, the values return can be ignored. But if\
    \ a function says that it will return a value, it must return a value. A compile\
    \ time error will be displayed when a function which has a return type define\
    \ doesn't allow the control to go to the bottom without returning the value.\n\
    \n## Functions with Multiple Return Values\n\nFor a function, you can give the\
    \ return type by using a tuple type for returning multiple values, as they don't\
    \ return a value for part of a single compound return value.\n\nThe below example\
    \ will define a `minMax(_:)` function. This function will find the `Int` values\
    \ that are smallest and largest in the given array:\n\n```swift\nfunc minMax(array:\
    \ [Int]) -> (min: Int, max: Int) {\n    var currentMin = array[0]\n    var currentMax\
    \ = array[0]\n    for value in array[1..<array.count] {\n        if value < currentMin\
    \ {\n            currentMin = value\n        } else if value > currentMax {\n\
    \            currentMax = value\n        }\n    }\n    return (currentMin, currentMax)\n\
    }\n```\n\nA tuple consisting of two `Int` values will be returned by the function\
    \ `minMax(_:)`. The returned values are named as `min` and `max`. When querying\
    \ the return value of the function, these can be accessed by using their name.\n\
    \nBy setting working variables called the `currentMin` and `currentMax`, the body\
    \ of the function `minMax(_:)` will start. The `currentMin` and `currentMax` variables\
    \ are used for setting the array's first integer. The function will iterate the\
    \ remaining values from the array and compares them if they are smaller or larger\
