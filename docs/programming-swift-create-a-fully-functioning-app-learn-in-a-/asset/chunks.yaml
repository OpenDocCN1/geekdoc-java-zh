    \ the `Text View` and the `DetailedViewController`. Open the Assistant Editor\
    \ (remember, it’s the icon that looks like a tuxedo) and hold down `CTRL`. Drag\
    \ from `Text View` to just beneath where you have defined the `@IBOutlet` for\
    \ the `detailTextLabel`. Call the new outlet `notesView`.\n\n## Displaying Your\
    \ Notes\n\nNow that the outlet has been created, all that is left is one simple\
