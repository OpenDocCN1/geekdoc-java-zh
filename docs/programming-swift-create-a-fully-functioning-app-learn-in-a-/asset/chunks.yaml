    can be used for returning a value. If there is no return type defined, a Void
    type will be returned by the function. The Void is nothing but a special value
    that has no elements inside it. Is an empty tuple and can be written as ().


    When the Void is called, the return value of the functions can be ignored.


    *   func printAndCount(stringToPrint: String) -> Int {


