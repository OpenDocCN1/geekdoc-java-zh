  raw: 'As there are no custom initialisers for the BlackjackCard structure, there
    is an implicit memberwise initializer for it and it is described in the structure
    type memberwise initializer. this initializer can be used for initializing a new
    constant called AceOfSpades.


    *   let theAceOfSpades = BlackjackCard(rank: .Ace, suit: .Spades)


    *   print("theAceOfSpades: \(theAceOfSpades.description)")


    *   // prints "theAceOfSpades: suit is♠, value is 1 or 11"


    As you can see, Suit and Rank are nested inside BlackjackCard. From the context,
    we can infer their type. The enumeration cases can be referred by the initialisation
    of the instance. The reference will be through their case names. From the examples
    given above, description property reports that the value of 1 of 11


    ## Referring to Nested Types


    For using a nested type out of the context definition, the name of the type should
    be prefixed with its name.


    let heartsSymbol = BlackjackCard.Suit.Hearts.rawValue


    // heartsSymbol is "♡"


    For the above example, the names of Rank, Suit, and Values are kept short deliberately,
    and this is because those names are qualified naturally by the content where they
    are defined.


    ## Function Types as Parameter Types


    In swift, you are allowed to use the function types like (Int, Int) -> Int as
    another function’s parameter type. With this, you can leave some of the function
    implementation aspects for the caller of the function whenever the function is
    called.


    Given below is an example which will print the results from the above math functions.


    *   func printMathResult(mathFunction: (Int, Int) -> Int, _ a: Int, _ b: Int)
    {


    *   print("Result: \(mathFunction(a, b))")


    *   }


    *   printMathResult(addTwoInts, 3, 5)


    *   // prints "Result: 8"


    In this example, a function called printMathResult(_:_:_:) is defined and this
    function has three parameters. The first parameter of the function is mathFunction.
    The type of the first parameter is (Int, Int) -> Int. Functions of the same type
    can be passed as the arguments for the mathFunction parameter. a and b are the
    second and the third parameters. The second and the third parameters are of the
    Int type. For the math function provided, these parameters will be used as the
    input values.


    When we call the printMathResult(_:_:_:) function, the function addTwoInts(_:_:)
    will be passed with 3 and 5 as integer values. This will now call the function
    provided with 3 and 5 as values and this will print 8 as the result.


    Printing the result is the role of the function printMathResult(_:_:_:). This
    will print the math function call of an appropriate type. The implementation of
    the function doesn''t matter here. The only thing that matters here is the type
    of the function, which needs to be correct. With this, the function printMathResult(_:_:_:)
    will hand some of the functionality to the one which calls the function. This
    will happen in type-safe way.


    ## Function Types as Return Types


    The function type of a given can be used as the return type for another function.
    This can be accomplished by giving the complete functional type right after ->
    of the returning function.


    Two simple functions stepForward(_:) and stepBackward(_:) are defined in the next
    example. The function stepForward(_:) returns a value one more than the input
    value and the function stepBackward(_:) returns one less value than the input
    value. The type of both the functions is of (Int) -> Int:


    *   func stepForward(input: Int) -> Int {


    *   return input + 1


    *   }


    *   func stepBackward(input: Int) -> Int {


    *   return input - 1


    *   }


    Here there is a function chooseStepFunction(_:) which has the return type “a function
    of type (Int) -> Int”. The function ``stepForward(_:) or the function stepBackward(_:)
    will be returned by the function ThechooseStepFunction(_:), basing on the Boolean
    parameter.


    *   func chooseStepFunction(backwards: Bool) -> (Int) -> Int {


    *   return backwards ? stepBackward : stepForward


    *   }


    Now you can use the chooseStepFunction(_:) for obtaining a function which steps
    in a direction or in other direction.


    *   var currentValue = 3


    *   let moveNearerToZero = chooseStepFunction(currentValue > 0)


    *   // moveNearerToZero now refers to the stepBackward() function


    The above example determines if a positive step or a negative step is needed for
    moving the variable currentValue closer to 0, progressively.


    The initial value of the currentValue is 3 and it means that the currentValue
    > 0 is true in this case. This will make the chooseStepFunction(_:) return the
    function stepBackward(_:). We use a constant moveNearerToZero for storing the
    returned function reference.


    The moveNearerToZero now refers the right function and hence it can be used for
    counting to 0:


    *   print("Counting to zero:")


    *   // Counting to zero:


    *   while currentValue != 0 {


    *   print("\(currentValue)... ")


    *   currentValue = moveNearerToZero(currentValue)


    *   }


    *   print("zero!")


    *   // 3...


    *   // 2...


    *   // 1...


    *   // zero!


    ## Nested Functions


    All the functions that you have seen so far are examples of global functions.
    Global functions will be defined at a global scope. You are also allowed to define
    functions within other functions. These functions are called nested functions.


    By default, all the nested functions will be hidden from others. Though they are
    hidden, the nested functions can be used and called by using their enclosing function.
    The enclosing function can return any one of the nested functions of its own and
    allow the nested functions to be available in another scope.


    *   The chooseStepFunction(_:) example can be rewritten for using and returning
    the nested functions:


    *   func chooseStepFunction(backwards: Bool) -> (Int) -> Int {


    *   func stepForward(input: Int) -> Int { return input + 1 }


    *   func stepBackward(input: Int) -> Int { return input - 1 }


    *   return backwards ? stepBackward : stepForward


    *   }


    *   var currentValue = -4


    *   let moveNearerToZero = chooseStepFunction(currentValue > 0)


    *   // moveNearerToZero now refers to the nested stepForward() function


    *   while currentValue != 0 {


    *   print("\(currentValue)... ")


    *   currentValue = moveNearerToZero(currentValue)


    *   }


    *   print("zero!")


    *   // -4...


    *   // -3...


    *   // -2...


    *   // -1...


    *   // zero!


    # Chapter 7: Creating Your First iOS App


    Now that you have learned the basics of Swift programming, and have learned how
    to create a Tip Calculator class, it’s time to learn how to make your very first
    iOS app. We are going to use the Tip Calculator class that you developed and create
    a user interface for it.


    ## Getting Started


    *   Gt XCode started up and open


    *   File\New\Project


    *   Choose iOS\Application\Single View Application


    *   Click Next


    *   Where it asks for the product nam, enter TipCalculator


    *   Set the language as Swift


    *   Set Devices to iPhone


    *   Check that the box next to Use Core Data is not ticked


    *   Click on Next


    *   Choose the directory where you want to save your new project and click on
    Create


    Now lets take a look at what XCode has done for you.  In the top left corner of
    XCode, click on iPhone 6 Simulator and then click Play. You should see a splash
    screen saying Tip Calculator and then a blank screen will appear. The next step
    is to fill that blank page up!


    ## Creating Your Model


    Before we get on to creating the user interface, we need to create a model for
    the app. The model is a set of classes that are representative of the data in
    your app and of the operations that your app is going to perform on the data. 


    For the purposes of this tutorial, your model is going to be the TipCalculator
    class that you created in the playground but you are going to rename it TipCalculatorModel.


    To add this class, open


    *   File\New\File


    *   Select iOS\Source\Swift File


    *   Call it TipCalculatorModel.swift,


    *   Click on Create'
