    # Chapter 9: Writing an iOS App with Swift – Advanced


    The app you wrote in the last chapter was a basic tip calculator, just to give
    you an idea of how to get around Swift. This time, we are going to try something
    a little more complex and involved. Follow every step as outlined below and you
    will successfully write a full iOS app in Swift.


    ## What You Need


    *   A Mac computer with Mavericks or Yosemite installed


    *   XCode 6


    *   A basic understanding of Swift, which you should have gained through the rest
    of this book


    ## Getting Started


    Earlier in the book, I showed you how to install XCode so, follow those instructions
    once again. As soon as it is all installed and set up, open XCodeand create a
    brand new project–press cmd+shift+N.


    Got to the Template Selector and check that iOS→Application has been selected


    Then choose the template called Master-Detail Application


    This template is an excellent starting point because it already has the storyboard
    set up with just about everything you will need. It also has a controller for
    the Detail controller and the Master controller. The reason we are using this
    template is because you are going to create a task list app.


    When you have chosen the Master Detail Application template, click on Next to
    go on to the next part of the set up.


    On the next screen, you will see the project set up wizard and here you will need
    to complete a few details and choose some options.


    Start off by naming your app. Type the name into the product name field. You can
    call it whatever you like so long as you remember it but, for the purposes of
    this tutorial, I am calling it TaskMe.


    The next step is to complete the Organization Name field correctly and then go
    to the Organization Identifier field. Here you will use a reverse domain name
    notation for the identifier.


    The Organization Identifier is going to help you to create the Bundle Identifier,
    which is what will give your application a name that is unique and this is for
    Apple and all of your iOS devices.'
