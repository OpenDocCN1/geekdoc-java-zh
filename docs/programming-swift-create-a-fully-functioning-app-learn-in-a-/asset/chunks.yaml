  raw: 'Type inference is all very nice but if you do not need to assign a value to
    a variable straightaway, you might have to explicitly specify the variable type:


    *   // Type Annotation


    *   //C#


    *   string firstName;


    *   // Swift


    *   var firstName: String


    Did you notice that Swift does not use a semi-colon? While Swift is very close
    to Objective C syntax, it does it all without the use of a semi-colon, unless
    you want to insert multiple code statements on a single line, in which case the
    semi-colon is supported and, indeed, in that case, required.


    ## Variable Names and Unicode


    Both Swift and Objective C supports Unicode characters in variable names. In short,
    you could use anything you wanted, including non-ASCII characters and emoticons
    in your variable names – if you really wanted to.


    ## Integer Bounds


    Both Objective C and Swift use static constants for when you want to access the
    maximum and minimum bounds for different types of integer.


    *   // Integer Bounds


    *   // C#


    *   var a = Int32.MinValue;


    *   var b = Int32.MaxValue;


    *   // Swift


    *   var a = Int32.min


    *   var b = Int32.max


    ## Type Inference


    Swift and Objective C both support type inference, as we mentioned earlier, in
    circumstances where the compiler can infer the declared variable type from its
    immediate assignment.


    *   // Type Inference


    *   // C#


    *   var a = 3; // integer


    *   var b = 0.14 // double


    *   var c = a + b; // double


    *   // Swift


    *   var a = 3 // integer


    *   var b = 0.14 // double


    *   var c = a + b // double


    Also note, in the example of type inference above that, when you declare a variable
    and then assign a value immediately - a value that is the result of two more variables
    - the type will still be inferred.


    ## String Comparison


    Both Swift and Objective C compare strings in similar ways


    *   // String Comparison


    *   // C#


    *   var a = "One";


    *   var b = "One";


    *   if (a == b) {


    *   // both variables are considered equal


    *   }


    *   // Swift


    *   var a = "One"


    *   var b = "One"


    *   if a == b {


    *   // both variables are considered equal


    *   }


    They also both use similar method to detect if the start or the end of a string
    matches with another specified string


    *   // C#


    *   var s = "Some Value";


    *   if (s.StartsWith("Some")) {


    *   // the string starts with the value


    *   }


    *   if (s.EndsWith("Value")) {


    *   // the string ends with the value


    *   }


    *   // Swift


    *   var s = "Some Value"


    *   if s.hasPrefix("Some") {


    *   // the string starts with the value


    *   }


    *   if s.hasSuffix("Value") {


    *   // the string ends with the value


    *   }


    Have another look at the above example. Did you spot that, when you use an IF
    statement in Swift, you don’t need to use parentheses?


    ## String Upper or Lower Case


    Both Swift and Objective C support methods that are similar of converting a string
    between lower and upper case


    *   // String Upper and Lower Case


    *   // C#


    *   var s = "some Value";


    *   var upperS = s.ToUpper();


    *   var lowerS = s.ToLower();


    *   // Swift


    *   var s = "some Value"


    *   var upperS = s.uppercaseString


    *   var lowerS = s.lowercaseString


    ## Declaring Arrays


    Both Swift and Objective C support the use of a single line of code to declare
    and assign an Array


    *   // Declare Arrays on single line


    *   // String Array


    *   // C#


    *   var arr = new string[] { "One", "Two" };


    *   // Swift


    *   var arr = ["One", "Two"]


    *   // Integer Array


    *   // C#


    *   var arr = new int[] { 1, 2 };


    *   // Swift


    *   var arr = [1, 2];


    ## Working with Arrays


    There is a little difference between Swift and Objective C when it comes to working
    with Arrays


    *   // Iterating Over Array


    *   // C#


    *   for each (var item in arr) {


    *   // do something


    *   }


    *   // Swift


    *   for item in arr {


    *   // do something


    *   }


    *   // Get Item at Index


    *   // C#


    *   var item = arr[0];


    *   // Swift


    *   var item = arr[0]


    *   // Set Item at Index


    *   // C#


    *   arr[0] = "Value";


    *   // Swift


    *   arr[0] = "Value"


    *   // Is Array Empty?


    *   // C#


    *   if (arr.Length == 0) {


    *   // array is empty


    *   }


    *   // Swift


    *   if arr.isEmpty {


    *   // array is empty


    *   }


    *   // Add Item to Array


    *   // C#


    *   Array.Resize(ref arr, arr.Length + 1);


    *   arr[arr.Length - 1] = "Three";


    *   // Swift


    *   arr.append("Three")


    *   // or


    *   arr += "Three"


    *   // Remove Item at Index


    *   // C#


    *   var list = arr.ToList();


    *   list.RemoveAt(0);


    *   var newArr = list.ToArray();


    *   // Swift


    *   var newArr = arr.removeAtIndex(0)


    ## Declaring Dictionaries


    Both Swift and Objective C use similar methods when it comes to declaring Dictionaries


    *   // Declaring Dictionaries


    *   // C#


    *   var dict = new Dictionary<string, string>();


    *   var dict2 = new Dictionary<string, string>


    *   {


    *   { "TYO", "Tokyo" },


    *   { "DUB", "Dublin" }


    *   };


    *   // Swift


    *   var dict = Dictionary<String, String>()


    *   var dict2 = ["TYO": "Tokyo", "DUB": "Dublin"]


    ## Working with Dictionaries


    There is a slight difference between the was Swift and Objective C work with Dictionaries


    *   // Iterate over Dictionary


    *   // C#


    *   foreach(var item in dict) {


    *   var key = item.Key;


    *   var value = item.Value;


    *   }


    *   // Swift


    *   for (key, value) in dict {


    *   // key variable contains key of item


    *   // value variable contains value of item


    *   }


    *   // Get Item in Dictionary by Key


    *   // C#


    *   var item = dict["TYO"];


    *   // Swift


    *   var item = dict["TYO"]


    *   // Set Item in Dictionary by key


    *   // or add if key doesn''t exist


    *   // C#


    *   dict["LHR"] = "London";


    *   // Swift


    *   dict["LHR"] = "London"


    *   // Remove Item in Dictionary by key


    *   // C#


    *   dict.Remove("LHR");


    *   // Swift


    *   dict.removeValueForKey("DUB")


    ## For Loops


    In the examples above for Dictionaries and Arrays, you have already seen the For-In
    loop, used to iterate through items in specific collections. The following shows
    you more methods of iteration sing that For Loop


    *   // Iterate from 1 through 5


    *   // C#


    *   // using increment


    *   for(var i = 1; i <= 5; i++) {


    *   // do something with i


    *   }


    *   // Swift


    *   // using range


    *   for i in 1...5 {


    *   // do something with i


    *   }


    *   // using increment


    *   for var i = 0; i <= 5; ++i {


    *   // do something with i


    *   }


    Notice that Swift uses a method of shorthand for the definition in the range


    ## Conditional Statements


    Both Swift and Objective C support the If…Then conditional statement. Swift is
    slightly different in that parentheses are not required to be inserted around
    match conditions


    *   // If Then Else Conditional Statement


    *   // C#


    *   if (i > 6) {


    *   // do something


    *   } else if (i > 3 && i <= 6) {


    *   // do something


    *   } else {


    *   // do something


    *   }


    *   // Swift


    *   if i > 6 {


    *   // do something


    *   } else if i > 3 && i <= 6 {


    *   // do something


    *   } else {


    *   // do something


    *   }


    ## Switch Statement


    Both Swift and Objective C support Switch statements


    *   // Switch statement


    *   // C#


    *   var word = "A";


    *   switch(word) {


    *   case "A":


    *   // do something


    *   break;


    *   case "B":


    *   // do something


    *   break;


    *   default:


    *   // do something


    *   break;


    *   }


    *   // Swift


    *   var word = "A"


    *   switch word {


    *   case "A":


    *   // do something


    *   case "B":


    *   // do something


    *   default:


    *   // do something


    *   }


    Switch statements are similar in both Swift and Objective C with the exception
    of case statements – in Swift, these do not pass automatically to the next as
    they do in Objective C. As a result of this, C needs break keywords to exit the
    statement unless you are intending to fall through to the next case. In Swift,
    you have to use the fallthrough keyword to let it know that you want to pass to
    the next case statement.


    Another feature that is supported in Swift with Switch statements is the ranges
    in the Case statements, something that is not supported in Objective C


    *   // Switch Case Ranges


    *   // C#'
