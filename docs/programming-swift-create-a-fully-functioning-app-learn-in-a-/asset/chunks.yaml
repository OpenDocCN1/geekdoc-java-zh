- fmt: '

    iOS is split into multiple frameworks and each one contains different code. Before
    you can use code from a framework, you must import it. The framework that contains
    the base class for the view controllers is called `UIKit` and it also contains
    the text fields, buttons and more besides. This is the first time in this tutorial
    you have seen an example of subclasses and you are declaring a new class called
    `ViewController` – a subclass of `UIViewController`. To see how that works, replace
    the class declaration with:


    ```swift

    class UIViewController {


    }

    ```


    You can see that `UIKit.UIViewController` is referring to `UIViewController` class
    in the namespace for `UIKit`.


    The `Override` method is called with a root view of the view controller when first
    accessed. If you override a method, you must use the `override` keyword so that
    you don’t end up overriding a method in error.


    The Memory Function method is called when the iPhone is low on memory.


    ## Connecting your View Controller to your Views


    Now you have some understanding of the view controller class, it’s time to add
    in properties for the sub views and get them in to the Interface Builder. To do
    this, go to your `ViewController` class, locate `viewDidLoad` and insert the following
    code just before that:


    ```swift

    @IBOutlet var totalTextField : UITextField!


    @IBOutlet var taxPctSlider : UISlider!


    @IBOutlet var taxPctLabel : UILabel!


    @IBOutlet var resultsTextView : UITextView!

    ```


    You are declaring four different variables:


    * `UITextField`

    * `UISlider`

    * `UILabel`

    * `UITextView`


    There are two differences between this and the way you did it with the playground
    file:


    The prefix on these variables is `@IBoutLet`. Interface Builder goes through your
    code looking for these and this is what allows you to connect the variables to
    the views.


    Each Variable is marked with an `!` to indicate that these are optional values
    but have been implicitly unwrapped. This is a posh way of saying that your code
    is written as if set and that, if it isn’t set your app will just crash.


    Let’s have a go at connecting these to the elements in the user interface:


    * Open `Main.storyboard`

    * Select the view controller n `Document Outline`

    * Open `Connections Inspector` – tab number 6


    Here you will see the properties you created previously, listed under `Outlets`.


    Look to the right of `resultsTextView` - you will see a little circle. Press on
    `CTRL` and drag from the button to the `Text View`, which is under the `Calculate`
    button. Let go and the property will be connected to the view.


    Do this for all of the other properties, making sure each one connects to the
    correct element.


    ## Connecting Actions to your View Controller


    Now we are going to connect actions to methods so:


    Open `ViewController.swift`


    Add in the following code anywhere within the class:


    ```swift

    @IBAction func calculateTapped(sender : AnyObject) {


    }


    @IBAction func taxPercentageChanged(sender : AnyObject) {


    }


    @IBAction func viewTapped(sender : AnyObject) {


    }

    ```


    This signature has to be present whenever you declare a callback for actions form
    views. The signature is basically a function that has no return value, it takes
    one parameter of type `AnyObject` and this represents a class of any type.


    To make sure that Interface Builder has spotted the new methods you inserted,
    these have to be marked with the keyword `@IBAction`.


    Now go back to `Main.storyboard` and check that your view controller has been
    selected in `Document Outline`. Check that the 6th tab – `Connections Inspector`
    - is open and look in the `Received Actions` section – your new methods will be
    listed in there.


    Look to the side of `calculateTapped:` and locate the circle; drag from that circle
    up to the button labelled `calculate`. A popup screen will appear, choose `Touch
    Up Inside`. By doing this, you are saying that “when the user releases their finger
    from the screen when over the button, call my method `calculateTapped:`”.


    Repeat for the remaining new methods and make sure they go to the right places:


    * `taxPercentageChanged` must be dragged to the slider and connected to `value
    Changed` – this section is called when a user touches the slider in the app.

    * `viewTapped` must be dragged to `Tap Gesture Recognizer`, which is in `Document
    Outline`. You will not need to select a gesture for this one.


    ## Connecting Your View Controller to your Model


    You have almost finished building your very first iOS app. All that’s left is
    to hook the view controller to your model.


    Open `ViewController.swift`


    Add the following code to your class and a way of refreshing the interface:


    ```swift

    let tipCalc = TipCalculatorModel(total: 33.25, taxPct: 0.06)


    func refreshUI() {

    // 1

    totalTextField.text = String(format: "%0.2f", tipCalc.total)

    // 2

    taxPctSlider.value = Float(tipCalc.taxPct) * 100.0

    // 3

    taxPctLabel.text = "Tax Percentage (\(Int(taxPctSlider.value))%)"

    // 4

    resultsTextView.text = ""

    }

    ```


    Add a call to `refreshUI()`, underneath `viewDidLoad`:


    ```swift

    refreshUI()

    ```


    Implement `viewTapp` and `taxPercentageChanged` with the following code:


    ```swift

    @IBAction func taxPercentageChanged(sender : AnyObject) {

    tipCalc.taxPct = Double(taxPctSlider.value) / 100.0

    refreshUI()

    }


    @IBAction func viewTapped(sender : AnyObject) {

    totalTextField.resignFirstResponder()

    }

    ```


    And finally implement `calculateTapped` with this:


    ```swift

    @IBAction func calculateTapped(sender : AnyObject) {

    // 1

    tipCalc.total = Double((totalTextField.text as NSString).doubleValue)

    // 2

    let possibleTips = tipCalc.returnPossibleTips()

    var results = ""

    // 3

    for (tipPct, tipValue) in possibleTips {

    // 4

    results += "\(tipPct)%: \(tipValue)\n"

    }

    // 5

    resultsTextView.text = results

    ```


    # Chapter 9: Writing an iOS App with Swift – Advanced


    The app you wrote in the last chapter was a basic tip calculator, just to give
    you an idea of how to get around Swift. This time we are going to try something
    more complex and involved. Follow every step as outlined below and you will successfully
    write full app.


    ## What You Need


    * A Mac computer with Mavericks or Yosemite installed

    * XCode 6

    * A basic understanding of Swift, which you should have gained through the rest
    of this book


    ## Getting Started


    Earlier in the book, I showed you how to install XCode so, follow those instructions
    once again. As soon as it is all installed and set up, open XCode and create a
    brand new project–press `cmd+shift+N`.


    Got to the Template Selector and check that `iOS→Application` has been selected


    Then choose the template called `Master-Detail Application`


    This template is an excellent starting point because it already has the storyboard
    set up with just about everything you will need. It also has a controller for
    the Detail controller and the Master controller. The reason we are using this
    template is because you are going to create a task list app.


    When you have chosen the Master Detail Application template, click on Next to
    go on to the next part of the set up.


    On the next screen, you will see the project set up wizard and here you will need
    to complete a few details and choose some options.


    Start off by naming your app. Type the name into the `product name` field. You
    can call it whatever you like so long as you remember it but, for the purposes
    of this tutorial, I am calling it `TaskMe`.


    The next step is to complete the `Organization Name` field correctly and then
    go to the `Organization Identifier` field. Here you will use a reverse domain
    name notation for the identifier.


    The Organization Identifier is going to help you to create the `Bundle Identifier`,
    which is what will give your application a name that is unique and this is for
    Apple and all of your iOS devices.

