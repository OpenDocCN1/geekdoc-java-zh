  trans: "\n回到你的 `Main.storyboard` 文件并进入对象库（Object Library）。从库中拖入一个 `Bar Button Item`\
    \ 到 `MasterViewController` 导航栏的右侧。现在进入属性检查器（Attributes Inspector），将标识（identifier）更改为\
    \ `Add`。\n\n现在是时候设置从 `MasterViewController` 到 `UINavigationController` 的跳转（segue）了。按住\
    \ `CTRL` 从你创建的新的 `Bar Button Item` 拖到新的 `UINavigationController`。在弹出窗口中，进入 `Action\
    \ Segue` 部分并选择 `Present Modally`（模态呈现）。\n\n新的跳转将看起来像圆圈内部的一个矩形，它是连接 `MasterViewController`\
    \ 和 `UINavigationController` 之间箭头的一部分。使用 `Attributes Inspector` 将 `Identifier`\
    \ 设置为 `addTask`。\n\n最后要做件事是设置你的屏幕。进入对象库（Object Library）并拖出两个 `text fields`（文本字段），将它们放入\
    \ `UINavigationController` 中。你可以按照你喜欢的方式放置它们。按住 `CTRL` 并拖动 `text fields` 及其包含的视图来设置\
    \ `Auto Layout`（自动布局）约束。\n\n选择第一个 `Text Field`；现在是时候对 `Attributes Inspector` 内部的一些设置进行一些编辑了。首先，选择空白占位符并将其编辑为\
    \ `Task Title`。通过 `font editor`（字体编辑器）将字体大小改为 `24 points`，你可以点击字体旁边的 `T` 图标来访问它。\n\
    \n现在你想要调整高度和宽度，所以更改 `Border style`（边框样式）——选择从右数数第二个。现在你可以尝试调整高度，也许让你的文本高度变为 `60\
    \ points`，并将对齐方式设置为居中。\n\n现在去第二个 `Text Field` 并进行类似的操作。也许让字体小一点，比如 `16 points`，减小高度，并并将\
    \ `placeholder text`（占位符文本）更改为类似 `Notes` 的内容。这次将对齐方式设置为左对，而不是居中。\n\n进入 `UINavigationController`\
    \ 并点击 `navigation bar`（导航栏）。进入 `Attributes Inspector` 将标题更改为 `Add Task`。完成这些后，你应该有两个字段和两个控制器。下一步是为新的\
    \ `Add Task` 屏幕为 `UIViewController` 创建子类。\n\n在在此之前，尝试运行应用程序，你应该能看到可以打开新屏幕，尽管在现阶段你将无法返回。\n\
    \n### 创建 AddTaskViewController\n\n打开 `File`（文件）菜单，选择 `New`（新建），然后选择 `File`（文件）。键盘上的快捷键是\
    \ `Cmd+N`。这将允许你开始创建新的 `AddTaskController` 文件。确保你处于 `iOS→ Source`，进入 `Options`（选项）并选择\
    \ `Cocoa Touch Class`。点击 `Next`（下一步）。你会看到一个显示 `Subclass of:`（子类自）的字段——输入 `UIViewController`。进入\
    \ `Class:` 字段，在其中的名称前添加 `AddTask`。\n\n确保 `Also Create XIB file`（也创建 XIB 文件）选项未勾选，并且语言选中了\
