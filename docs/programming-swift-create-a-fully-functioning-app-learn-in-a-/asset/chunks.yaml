    \nvar upperS = s.uppercaseString\nvar lowerS = s.lowercaseString\n```\n\n## Declaring\
    \ Arrays\n\nBoth Swift and Objective C support the use of a single line of code\
    \ to declare and assign an `Array`\n\n### Declare Arrays on single line\n\n####\
    \ String Array\n\n#### C#\n```csharp\nvar arr = new string[] { \"One\", \"Two\"\
    \ };\n```\n\n#### Swift\n```swift\nvar arr = [\"One\", \"Two\"]\n```\n\n#### Integer\
