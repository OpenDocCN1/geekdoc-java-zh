    section out. You should see a preview of those notes when the task list reappears.
    Don’t put too much in the notes–if it is too long to fit on the detailTextLabel,
    it will just be cut off and that leads us onto the next thing to fix.


    ## Redesigning the Detail View


    That small label in the center really isn’t going to be enough so open up Mail.storyboard.swift
    and get ready to make some changes to DetailViewController. To be honest, it really
    doesn’t matter what you do to this to change the way it looks so long as you have
    the right two views. The fits is already evident in DetailViewController and all
    you ae going to do is move the label up and make it a little bit bigger, not forgetting
    to update the constraints.


    The next thing to do is drag a Tet View out of the Objects Library to the DetailViewController.
    Once the layout is sorted out, you can go into the Attributes Inspector and make
    some changes.


    The font can be enlarge to 18 points, through the font picker, which, if you remember,
    is accessed through the T icon next to the font. Make sure you uncheck the box
    next to Editable–you will find it just under the font field. Something else that
    would be nice is if you could open phone numbers and links directly from the notes
    field so, when you go into the Detection section in Attributes Inspector, make
    sure you check the boxes for Links and Phone Numbers.


    Lastly, you should link the Text View and the DetailedViewController. Open the
    Assistant Editor (remember, it’s the icon that looks like a tuxedo) and hold down
    CTRL. Drag from Text View to just beneath where you have defined the @IBOutlet  for
    the detailTextLabel. Call the new outlet notesView.


    ## Displaying Your Notes


    Now that the outlet has been created, all that is left is one simple job–putting
    the content in. Open DetailViewController.swift and locate configureView method.
    Make these changes:


    *   func configureView() {


    *   // Update the user interface for the detail item.


    *   if let detail: Task = self.detailItem {


    *   if let label = self.detailDescriptionLabel {


    *   label.text = detail.title


    *   }


    *   }


    *   }


    The changes are inside the IF statement which is inside the wrapping IF statement.
    You have also removed the completely pointless use of self that was in front of
    all of the properties.


    So, first you need to unwrap the optional UITextView, even though it has already
    been implicitly unwrapped. Then, it needs to be assigned to the constant called
    notes, allowing you set the text n notesView as the notes property of the detail
    item, which is a Task.


    Now, when you run the application you will see a basic task management application
    that you can happily play around with to your hearts content.


    Congratulations! You have successfully built a new iOS application using Swift.
    While it isn’t likely to be the next big thing, it is a fantastic point for you
    to start learning from, to start understanding what it’s like to use Swift and
    XCode to build an app. If you were to build the same app using Objective C you
    would see a whole lot more code than you have in this application and, perhaps
    more importantly, a lot of far less expressive code.


    In the final chapter, I am going to introduce you to Swift 2, the latest update
    to Apple’s brand new computer programming language.


    # Chapter 10: What’s New in Swift 2


    Hot on the heels of Apple’s new computer programming language Swift, already proving
    mighty popular, comes Swift 2\. Introduced at WWDC 2015, Swift 2 promises to be
    bigger and better than its predecessor is. And, perhaps the most astonishing piece
    of news is that Apple has promised to make Swift open source, later on in 2015.


    This means that the source code or the programming language will be made available
    to everyone. As a developer or programmer, you will be able to inspect that code,
    modify it to suit you, and use it pretty much wherever you want. This is huge
    news because it means that developers can use Swift on operating systems that
    are not tied to Apple. It is expected that this will lead to Swift being used
    on Linux deployments as well as Windows and the Raspberry Pi.


    Does that Mean Swift Will Work on Android Smartphones?


    While you will be able to use this code on other devices, please don’t get drawn
    into the belief that you will be able to run iOS or OS X software on another operating
    system. It will be easier to port software from one to another but Apple are not
    likely to relinquish control of the SDK (software development kit). I can’t tell
    you at this stage which bits of Swift will go open source and it’s not likely
    that they will release the source code for XCode – you will still need your mac
    to develop the software for iOS and OS X.


    What is New in Swift 2?


    While we wait for Swift 2 to become available to all, later on in 2015 when XCode
    7 is released, let’s have a brief look at some of the main new features.


    ## Error Handling


    Error handling has been given a makeover in Swift 2; instead of getting double
    pointers and NSError objects, you will s a new system that is reminiscent of exception
    handling. You might be familiar with code that has been written like this:


    *   if drinkWithError(nil) {


    *   print("Could not drink beer! :[")


    *   return


    *   }


    In Cocoa, as a rule you would include an inout parameter or a reference to an
    NSError object and then let the method assign the variable if there is a problem.
    The biggest problems are that you can pass nil and completely ignore that error
    or you can pass in the NSError but not check it.


    Swift 2 includes extra safety measures to help with error checking and you will
    now use the throws keyword as a way of specifying the methods and functions, which
    may throw an error. You can then use other keywords – do, try and catch – for
    times when you are calling something that has the potential to throw:


    *   // 1


    *   enemy DrinkError: ErrorType {


    *   case NoBeerRemainingError


    *   }


    *   // 2


    *   func drinkWithError() throws {


    *   if beer.isAvailable() {


    *   // party!


    *   } else {


    *   // 3


    *   throw DrinkError.NoBeerRemainingError


    *   }


    *   }


    *   func tryToDrink() {


    *   // 4


    *   do {


    *   try drinkWithError()


    *   } catch {


    *   print("Could not drink beer! :[")


    *   return


    *   }


    *   }


    ## Binding


    In Swift 1.2 we gained the ability to be able to test binding multiple optionals
    on the same line:


    *   if let pants = pants, frog = frog {


    *   // good stuff here!


    *   }


    That works well but some people don’t like the fact that the “Preferred” code
    path is indented and this is where the optionals have value. That means you have
    to keep looking inside the indents for the main part of the code while, in the
    meantime, the errors are outside the indents.


    Swift 2 makes it possible to check for values in optionals with its new guard
    statement.


    *   guard let pants = pants, frog = frog else {


    *   // sorry, no frog pants here :[


    *   return


    *   }


    The use of guard means that optional binding can be performed and will give you
    a code block in the else that you can run in the event of condition failure. You
    can then continue.


    This should make your code clearer because guard allows you to specify what state
    you are expecting rather than going through an error check.


    ## Protocol Extensions


    Swift 2 allows you to extend protocol and add in implementations for methods and
    properties. While you can already do this with structs and classes, being able
    to add to the protocols extends your reach.


    *   extension CustomStringConvertible {


    *   var shoutyDescription: String {


    *   return "\(self.description.uppercaseString)!!!"


    *   }


    *   }


    *   let greetings = ["Hello", "Hi", "Yo yo yo"]


    *   // prints ["Hello", "Hi", "Yo yo yo"]


    *   print("\(greetings.description)")


    *   // prints [HELLO, HI, YO YO YO]!!!


    *   print("\(greetings.shoutyDescription)")'
