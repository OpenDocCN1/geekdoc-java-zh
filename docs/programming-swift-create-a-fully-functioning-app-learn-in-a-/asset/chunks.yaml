  trans: "\n选择并点击 Language（语言），在下拉菜单中检查是否已选择了 Swift 而不是 Objective C。通过这样做，`XCode`\
    \ 生成的大部分代码将以 Swift 文件的形式生成，而不是 Objective C 文件。\n\n最后一步是点击 Devices（设备），并在下拉菜单中选择\
    \ iPhone。检查 Core Data 选项是否没有被勾选。虽然 Core Data 非常适合学习，但我们在本教程中不需要它。\n\n## 通过示例学习\n\
    \n在我们直接开始编写一些自定义代码之前，我想简单回顾一下，在你选择了 Master Detail Application（主从详情应用）模板后，你可以从\
    \ `XCode` 生成的代码中学习到什么。这已经是一个可以运行的应用程序，所以你需要构建并运行它来查看它已经能做什么——`cmd+R`。\n\n当你试玩它时，你会发现自己进入了一个列表界面，导航栏上显示着一个\
    \ `+` 号和一个编辑（edit）按钮。点击 `+` 可向列表中添加新行。列表将显示添加该行时的日期和时间。如果你轻触或点击该行，将看到一个中间显示数据和时间的详情界面。在列表界面上，你可以通过两种方式删除行——向滑动并点击\
    \ Delete（删除），或者点击 Edit（编辑）并在那里删除它们。\n\n那么，接下来，让我们看看 `XCode` 已经生成的代码。\n\n## AppDelegate.swift\n\
    \n应用程序的起点是一个名为 `AppDelegate.swift` 的文件，让我们来看看它包含的代码。忽略文件顶部的注释，直接看第一段代码。它读起来是：\n\
    \n* `Import UIKit`\n\n这段代码将允许你访问 `UIKit` 中提供的所有内容。如果你用用 Objective C 进行过编程，那么你会发现这非常熟悉，但与\
    \ Objective C 不同，你导入的是整个模块，而不是针对特定框架或类的头文件（header files）。你会在应用程序的几乎每个文件中这样做，无论是为了\
    \ `UIKit` 还是为了更简单的 `Foundation` 文件。\n\n接下一行代码，它看起来有点奇怪：\n\n* `@UIApplicationMain`\n\
    \n在 Swift 中，你会发现并没有像大多数其他计算机编程语言那样的一个主文件（main file）。相反，当你编写 iOS 应用程序时，你需要将 `XCode`\
    \ 指向想要被类为主文件的特定文件。你通过在 Swift 类中添加上述属性来实现这一点。你极可能不会将其从 `XCode` 找到的位置进行移动，但确切知道这段奇怪的小代码的作用是件好主意。\n\
    \n现在我们有了 `AppDelegate` 文件的类定义。如果你查看它，你会发现它继承自 `UIResponder` 并遵循 `UIApplicationDelegate`\
    \ 协议。如果你是从 Objective C 编程转过来的，你会发现这种语法与我们以前的做法相比有了巨大的改进。\n\n* `class AppDelegate:\
    \ UIResponder, UIApplicationDelegate {`\n\n看看 `AppDelegate` 类的实现方式，你应该注意到这里实际上并没有做什么。你拥有一个窗口变量和一些函数，这些函数要么为空，要么非常很少。\n\
    \n事实上，唯一包含可执行代码的函数是：\n\n* `application:didFinishingLaunchingWithOptions:`\n\n\
    但它所做的只是返回 true\n\n```swift\nfunc application(application: UIApplication, didFinishLaunchingWithOptions\
    \ launchOptions: [NSObject: AnyObject]?) -> Bool {\n    // 应用程序启动后自定义的重写点。\n \
    \   return true\n}\n```\n\n发生了什么，以及该应用程序仍然能够运行的原因，都归功于一些幕后魔法。如果你查看项目的设置，你会发现启动点已设置为\
    \ `Main.storyboard`，它负责在应用程序启动时设置窗口和控制器。\n\n在这个阶段，另一个值得提到的代码段是窗口的变量定义：\n\n* `var\
    \ window: UIWindow?`\n\n这将在 `AppDelegate` 中负责创建一个变量属性，其类型为 `UIWindow` 且是可选的（optional）。正如你从上面的示例中看到的那样，这被表述为\
    \ `UIWindow?`——请注意代码结尾的问号。\n\n如果你还没有学习过任何关于可选类型的知识，它们背后的原理是它们是唯一可以包含内容或为空（即为 `nil`）的类型。在本教程中你不需要了解太多，但前提是你打算使用\
    \ Cocoa Touch 框架。\n\n关于可选类型，你必须记住的一点重要事项是它们在参数类型中的用法。你会发现 Swift 中的某些类型以感叹号结尾。这被称为隐式解包可选类型（implicitly\
    \ unwrapped optional）：\n\n* `@IBOutlet weak var detailDescriptionLabel: UILabel!`\n\
    \n普通可选类型和隐式解包可选类型的区别在于，如果你尝试在没有值时使用后者，你将得到运行时错误，就像你尝试解包一个普通可选类型并在没有值的情况下使用它一样。这就是为什么这些可选类型只用在极不可能没有值的地方。如果没有值，就会导致严重的错误。\n\
