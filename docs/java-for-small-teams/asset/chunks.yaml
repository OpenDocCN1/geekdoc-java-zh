  trans: "\n那么我们应该如何选择这些示例呢？\n\n一种方法是查看被测组件的可能输入。\n\n如果我们为每个可能的输入提供预期的输出，就可以完整地指定我们的代码。通常，这并不是可行的，因为输入的可能范围实在太大了。相反，我们可以在可能的输入范围内寻找值的类别（例如，`valid`\
    \ 和 `invalid`），并从每个类别中选择一个示例。\n\n然而，最好的方法通常不是从可能的输入和示例的角度来思考，而是首先考虑我们希望代码表现出的行为。\n\
    \n一旦我们确定了行为，就可以选择能够演示该行为的示例。使用的实际值通常并不重要——“使测试易于理解”讨论了某些技术，可以使不重要的值在测试中不那么突出，并突出重要的值。\n\
    \n基于属性的测试（Property-based testing）在此基础上进了一步。\n\n识别出必须对所有输入或满足某些标准的可能输入子集成立的属性。测试不包含任何示例值——仅描述它们必须如何被约束。用于检查属性的示例是随机生成的，并且只有在检查失败时才会被看到。\n\
    \n基于属性的测试有一些引人注目的优势：\n\n*   测试描述了输入值中重要的部分。在示例测试中，这必须由读者推断出来。\n*   测试将自动发现边界情况和程序员所做的错误假设。\n\
    \n目前 Java 社区对基于属性的测试经验较少，因此关于如何最好地使用它仍然存在疑问。\n\n一个明显的问题是它引入了随机性，尽管大多数框架都提供了一些机制来控制它并重复测试运行。\n\
    \n## 遵循零、一、多规则\n\n如果你的组件处理数字或对象集合，请确保你使用了足够的示例来描述它的行为。\n\n一个好的经验法是，覆盖 0（或空）、1\
    \ 和“多个”的测试用例可能是必要的。还有重要的边界情况，例如处理整数的算法代码可能需要考虑 `Integer.MAX` 和 `Integer.MIN`。\n\
    \n零、一、多规则定义了你可以希望考虑的最少案例数量。要正确描述代码的行为，可能需要更多。\n\n在进行测试驱动时，从 `zero` 测试用例开始是最容易的。\n\
    \n### 一次测试一件事\n\n每个测试用例应该指定且仅指定一件。\n\n测试中的多个断言（assertions）可能是测试正在测试多一件事的指标。应该对多个断言保持怀疑，但它们并不一定是问题，例如：\n\
    \n```java\n @Test\n  public void shouldReturnItemsInOrderTheyWereAdded() {\n \
    \    ArrayDeque<String> testee = new ArrayDeque<String>();\n\n     testee.add(\"\
    foo\");\n     testee.add(\"bar\");\n\n     assertEquals(\"foo\",testee.pop());\n\
    \     assertEquals(\"bar\",testee.pop());\n  }\n```\n\n这个测试只测试了一个关注点，但使用了多个断言来实现。\n\
    \n### 每个东西只测试一次\n\n一旦你测试了一个关注点，就不要让它泄露到其他测试中——如果你这样做，那么那些测试就不再只测试一件事了。\n\n在基于交互的测试中，这是一个特别容易犯的错误。如果调用方法\
    \ `anImportantSideEffect()` 至关重要，你很容易发现自己在每个测试用例中都在验证该方法。\n\n如果合约发生变化，导致该副作用不再重要，那么所有的测试都将更新。\n\
    \n这个关注点应该由单个测试用例 `shouldPerformImportantSideEffect()` 来覆盖。\n\n虽然我们不应该让属性泄露到不属于它的测试用例中，但这并不意味着它会被局限在单个测试用例中。可能需要多个示例才能充分演示一个属性。\n\
    \n# 使测试易于理解\n\n我们编写测试时的目标之一是记录被测试代码的作用。\n\n我们部分通过为每个测试用例选择清晰的规范风格的名称来实现这一点，但我们必须确保实现每个测试用例的代码是易于理解的。\n\
    \n下面讨论了一些有助于实现此点的技术。\n\n### 使测试结构清晰\n\n一个测试可以被视为包含三个部分：\n\n*   Given（假设）：创建测试所需的值和对象\n\
    *   When（当）：执行被测代码\n*   Then（那么）：验证输出/行为符合预期\n\n这些阶段有时也被特别偏爱字母 'a' 的人称为 `arrange`、`act`\
    \ 和 `assert`。\n\n虽然这三个阶段的可见性很重要，但试图严谨地分离它们或用注释标记它们会给测试增加噪声。\n\n**Bad**\n\n```java\n\
    \ @Test\n  public void shouldRetrieveValuesInOrderTheyAreAdded() {\n\n    // given\n\
    \    Stack<String> testee = new Stack<String>();\n    String expectedFirstValue\
    \ = \"a\";\n    String expectedSecondValue = \"b\";\n\n    // when\n    testee.push(expectedFirstValue);\n\
    \    testee.push(expectedSecondValue);\n    String actualFirstValue = testee.pop();\n\
    \    String actualSecondValue = testee.pop();\n\n    // then\n    assertThat(actualFirstValue).isEqualTo(secondValue);\n\
    \    assertThat(actualSecondValue).isEqualTo(firstValue);\n  }\n```\n\n**Better**\n\
    \n```java\n @Test\n  public void shouldRetrieveValuesInOrderTheyAreAdded() {\n\
    \    Stack<String> testee = new Stack<String>();\n    testee.push(\"a\");\n  \
    \  testee.push(\"b\");\n    assertThat(testee.pop()).isEqualTo(\"b\");\n    assertThat(testee.pop()).isEqualTo(\"\
    a\");\n  }\n```\n\n### 测试变量命名遵循标准的 TEA 命名约定\n\n建立简单的约定可以使测试中一些非常基础的内容对读者清晰。\n\n\
    如果你测试的单元是一个类，请通过始终将其命名为 `testee` 来明确这一点。\n\n如果你需要在变量中存储一个预期值，将其称为 `expected`（但不要为了\
    \ sake 而将其存储在变量中）。\n\n如果你需要存储一个与预期值进行比较的结果，将其称为 `actual`（但不要为了 sake 而将其存储在变量中）。\n\
    \n如果你 stub 了一个参与者，考虑将其命名为 `stubbedFoo`；如果它是作为 mock 使用的，将其命名为 `mockedFoo`。这条规则不像其他那样严格——根据具体情况判断你认为它是让测试更易读还是更难读。\n\
    \n### 突出重要的，隐藏不重要的\n\n应该一眼看出每个测试用例——因此通过突出该测试用例重要的部分并隐藏不重要的部分来变得清晰。\n\n如果输入的某个方面对于测试用例很重要，通过在测试用例中`explicitly`设置它来突出它——不要依赖该值在通用方法中的设置。\n\
    \n即使相同的值是默认设置，最好在测试中重新提供它，以便它是清晰可见的。\n\n如果某个值并不重要，通过使用已知的中性值（如字符串 `\"foo\"`）来指示读者，或者对于提供值的变量和方法使用清晰名称如\
    \ `someInt` 或 `anInt`。\n\n通过方法调用提供值会使它们不那么可见。\n\n下面的测试中哪些是重要的？\n\n**Bad**\n\n\
    ```java\n @Test\n  public void shouldXXX() {\n    MyClass testee = new MyClass();\n\
    \    assertThat(testee.process(0, \"\", 3))\n      .isEqualTo(Status.FAIL);\n\
    \  }\n```\n\n这个版本如何？\n\n**Better**\n\n```java\n @Test\n  public void shouldXXX()\
    \ {\n    int invalidValue = 3;\n    MyClass testee = new MyClass();\n    assertThat(testee.process(anInt(),\
    \ aString(), invalidValue))\n      .isEqualTo(Status.FAIL);\n  }\n```\n\n虽然我们需要额外的上下文来理解为什么\
    \ `3` 是一个无效值，但应该清楚 `process()` 方法的前两个参数对于我们所指定的行为是不重要的。\n\n为什么下方的 testee 返回枚举\
    \ `CONTINUE` 很重要？\n\n**Bad**\n"
- fmt: "\n```\n @Test\n  public void shouldXXX() {\n    assertThat(testee.process()).isEqualTo(CONTINUE);\n\
    \  }\n```\n\nIf we look through the rest of the class we might find:\n\n```\n\
    \ @Before\n  public void setup() {\n     MyClass testee = new MyClass();\n   \
    \  testee.setDefaultProcessState(CONTINUE);\n  }\n```\n\nOther tests might not\
    \ need to care about what the default state is, but this test does so we should\
    \ write:\n\n**Better**\n\n```\n @Test\n  public void shouldXXX() {\n    testee.setDefaultProcessState(CONTINUE);\n\
    \    assertThat(testee.process()).isEqualTo(CONTINUE);\n  }\n```\n\nAs we start\
    \ to deal with more complex domain objects, it becomes harder to separate the\
    \ important values from the ones that are required to construct valid objects\
    \ but not of particular interest to our test. Fortunately, we can use the builder\
    \ pattern to ease the pain, reduce duplication, and keep the tests readable.\n\
    \n### Name Values Meaningfully\n\nIf a value has an important meaning, make that\
    \ meaning clear e.g.:\n\n```\n Foo testee = new Foo(PERFORM_VALIDATION);\n```\n\
    \ninstead of:\n\n```\n Foo testee = new Foo(true);\n```\n\n### Write DAMP Test\
    \ Code\n\nAs we have seen, in order to highlight that a value is important to\
    \ a test, we need to keep it within the test method that uses it. This may introduce\
    \ duplication which we might not accept in normal code - but test code is a little\
    \ different.\n\nCopy and paste coding is bad in tests as well as production code\
    \ - the more code there is, the harder it is to read and a change to a concern\
    \ will result in shotgun surgery if it has been duplicated throughout the tests.\n\
    \nRepetition should therefore generally be avoided in test code.\n\nTest code\
    \ is different from production code however. \n\nTest code must tell more of a\
    \ story - highlighting what is important and hiding what is not. Test code should\
    \ not be as DRY (**D**on't **R**epeat **Y**ourself) as production code. It should\
    \ be DAMP (contain **D**escriptive **A**nd **M**eaningful **P**hrases).\n\nIf\
    \ refactoring a small amount of code out of a test method into a shared method\
    \ hides what is happening, accept the duplication and leave it in place. If it\
    \ does not affect readability then refactor mercilessly.\n\n### Choose the Right\
    \ Assertion Method\n\nWhen a test fails, a good assertion tells you what is wrong.\n\
    \nAlthough JUnit allows you to supply an assertion message this adds noise to\
    \ the test. Like comments, these messages should be saved for those occasions\
    \ when you cannot communicate using code alone.\n\nBad\n\n```\nassertTrue(\"Expected\
    \ 2 but got \" + actual, actual == 2);\n```\n\nGood\n\n```\nassertEquals(2, actual);\n\
    ```\n\nThe built in assertions are fairly limited. Alternative assertion libraries\
    \ such as AssertJ provide richer functionality and result in more readable code.\n\
    \n# Understand How To Use Mocks And Stubs\n\n## Understand How to Use Mocks and\
    \ Stubs\n\nThere are two sorts of code and they require two different sorts of\
    \ test.\n\n**Worker code** does stuff. We can test worker code with **state based\
    \ testing** - i.e. asserting that expected values are returned from methods, or\
    \ objects are left in expected states.\n\nState based testing is easily recognized\
    \ as it will use assert statements.\n\n**Manager code** does stuff by co-coordinating\
    \ others.\n\nManager code is harder to test than worker code because we need to\
    \ make a choice - do we try to infer its behavior from its outputs using state\
    \ based testing, or do we use **interaction based testing**?\n\nIn interaction\
    \ based testing, we check that objects talk to each other in the expected fashion.\
    \ To do this we need to somehow eavesdrop on the conversation. This is achieved\
    \ by using objects that impersonate real ones.\n\nUsually these are created using\
    \ a mocking framework.\n\n### Mocking Frameworks\n\nAlthough it is common to refer\
    \ to all objects created by a mocking framework as mocks this is inaccurate.\n\
    \nA more correct generic term for these objects is `test double`.\n\nThese can\
    \ be subdivided based on how they behave:\n\n* Dummy object - needs to be present\
    \ to satisfy a type signature but is never actually used\n* Stub - must be present\
    \ and may supply indirect inputs\n* Mock - verifies that expected interactions\
    \ take place\n* Fake - like a real thing but less heavy - e.g an in memory database\n\
    * Spy - object that records its interactions with others\n\nOf these only stubs,\
    \ mocks and spies might be created by a mocking framework. \n\nWe will talk about\
    \ spies in a moment, but most test doubles can be conceptually viewed as being\
    \ either a stub or a mock.\n\nThe important difference between them is that a\
    \ mock has an expectation that will cause a test to fail if it is not met. i.e.\
    \ if an expected method is not called on a mock the test will fail.\n\nA stub\
    \ does not care if it is called or not - its role is simply to supply values.\n\
    \nTraditional Mocks present a code readability dilemma. They define an expected\
    \ outcome (a *then*), but are also part of the fixture required for the test to\
    \ execute (a *given*).\n\nFor example with JMock we would write:\n\n```\n Mockery\
    \ context = new Mockery();\n\n  // given / arrange\n  Subscriber subscriber =\
    \ context.mock(Subscriber.class);\n  Publisher publisher = new Publisher();\n\
    \  publisher.add(subscriber);\n\n  final String message = \"message\";\n\n  //\
    \ then / assert . . . but we haven't had a when yet\n  context.checking(new Expectations()\
    \ {{\n    oneOf (subscriber).receive(message);\n  }});\n\n  // when / act\n  publisher.publish(message);\n\
    ```\n\nSpies solve this problem neatly.\n\n### Spies\n\nSpies record their interactions\
    \ with other objects. In practice practice this means that spies act as stubs\
    \ by default, but as mocks when we want them to.\n\nFor example, using Mockito:\n\
    \n```\n // given\n  Subscriber subscriber = Mockito.mock(Subscriber.class);\n\
    \  Publisher publisher = new Publisher();\n  publisher.add(subscriber);\n\n  //\
    \ when\n  publisher.publish(message);\n\n  // then\n  Mockito.verify(subscriber).receive(message);\n\
    ```\n"
