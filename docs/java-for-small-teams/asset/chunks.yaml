  trans: "\n我们可以为 `Addition` 和 `Subtraction` 类编写测试：\n\n```java\npublic class AdditionTest\
    \ {\n\n  Addition testee = new Addition();\n\n  @Test\n  public void shouldMatchWhenStringIsAdd()\
    \ {\n  }\n\n  @Test\n  public void shouldNotMatchWhenStringIsNotAdd() {\n  }\n\
    \n  @Test\n  public void shouldAddTwoNumbers() {\n  }\n\n  // 等\n\n}\n```\n\n\
    针对 `ThingaMeBob` 类也是如此的：\n\n```java\npublic class ThingaMeBobTest {\n\n  ThingaMeBob\
    \ testee = new ThingaMeBob();\n\n  @Test\n  public void shouldAddTwoNumbers()\
    \ {\n  }\n\n  @Test\n  public void shouldSubtractTwoNumbers() {\n  }\n\n  // 等\n\
    \n}\n```\n\n在某个时刻，我们可能会质问为什么这些代码设计得如此过度，并考虑将其重构为更简单的形式，例如：\n\n```java\npublic\
    \ class ThingaMeBob {\n\n  public int process(String s, int a, int b) {\n    if\
    \ (\"add\".equals(s)) {\n      return a + b;\n    }\n\n    if (\"minus\".equals(s))\
    \ {\n      return a - b;\n    }\n\n    throw new RuntimeException();\n  }\n\n\
    }\n```\n\n我们的测试会发生什么？\n\n哪些测试最有价值？\n\n答案自然是，通过 `ThingaMeBob` 的公共接口执行所有三个类的测试证明是最有用的。我们完全不需要修改它。当运行通过（显示绿色）时，我们知道重构成功了，而且一切运行正常。\n\
    \n我们删除了针对 `Addition` 和 `Subtraction` 的测试。我们创建的较小单元只是实现细节。\n\n让我们回溯并想象一下情况发生了变化。\n\
    \n如果我们被要求从零开始测试驱动所需的行为会怎样？我们会写什么？\n\n我们最可能会写出类似于我们的第二个简单版本 `ThingaMeBob` 的代码，以及一个看起来类似于\
    \ `ThingAMeBobTest` 的测试。\n\n如果之后我们被要求添加对其他 10 个操作的支持，我们可能会保持设计基本不变。\n\n如果有一个新需求要求\
    \ `ThingAMeBob` 的行为更具动态性，在运行时启用和禁用不同的操作会怎样？\n\n那么，重构为我们早期的更复杂的版本就变得有意义了。\n\n我们应该如何处理这些测试？\n\
    \n我们已经有了基于 `ThingaMeBob` 编写的测试，描述了所有支持的行为。当我们将它们提取到类中时，是否也应该通过测试完全描述 `Addition`、`Subtraction`\
    \ 和其他 10 个操作？\n\n这里没有标准答案，但我希望大家很清楚，我们确定的最有用的 `unit` 是 `ThingaMeBob`。较小的 `units`\
    \ 只是我们所需功能的一种实现。\n\n如果我们选择为每个提取的类编写测试，那么这些测试将具有某些价值。\n\n基于 `ThingaMeBob` 编写的测试在描述每个提取出的微小单元的功能方面效果很差。如果测试失败，将无法立即看出\
    \ bug 出在哪个类中。如果我们必须更改提取的类之一，将无法立即看出应该运行哪一个测试。\n\n因此，为每个提取的类编写测试绝对有价值。与此同时，如果我们不这样做，那也是一个合理的决定，并且会降低重构成本。\n\
    \n`ThingaMeBob` 测试将是快速且可重复的，允许我们轻松地与代码工作。如果只能在一个层级进行测试，我们会选择的层级是 `ThingaMeBob`。\n\
    \n所以，作为一个起点，假设一个 `unit` 是一个类，但要意识到这不是硬性规定。\n\n一个 `unit` 实际上是一个“单一自包含的逻辑关注点”——让几个类协作来捕捉该关注点是有意义的——只要这种协作提供了一个单一且定义的入口即可。\n\
    \n将单元分得过小可能是过度规格的形式。\n\n将单元分得过大可能导致测试难以理解且维护成本高昂。\n\n根据经验法则，如果你认为可以合理地将一个或多个类作为另一个类的内部类，那么它们可能应该被视为单个单元。\n\
    \n# 使用规格说明风格命名\n\n## 使用规格说明风格命名测试用例\n\n使用每个测试用例的名称来描述被测单元的一个（且**仅有**）行为。名称应该是一个命题——即一个可能为真也可能为假的陈述。\n\
    \n方法名应该以 `should` 开头。\n\n一旦你擅长编写测试名称，这是多余的，但在混合团队中它是有用的，因为它鼓励人们以正确的方式思考测试。\n\n\
    名称的其余部分应该描述一种行为，可选地描述一个场景（由单词 `When` 标识）。\n\n例如，我们可能开始这样描述 `java.util.Stack`：\n\
    \n*   `shouldBeEmptyWhenCreated`（创建时应为空）\n*   `shouldReturnMostRecentlyAddedItemsFirst`（应返回最近添加的项目）\n\
    *   `shouldThrowAnErrorWhenItemsRemovedFromEmptyStack`（从空栈中移除元素时应报错）\n\n与某些代码库中常见的命名模式进行对比：\n\
    \n*   `emptyStack`\n*   `testEmptyStack`\n*   `testPush`\n\n这些名称本身没有告诉我们关于 `Stack`\
    \ 应该如何表现。\n\n如果我们省略 `should`，我们可以创建更简洁的名字：\n\n*   `isEmptyWhenCreated`（创建时为空）\n\
    *   `returnsItemsInOrderTheyAreAdded`（按添加顺序返回项目）\n*   `throwsAnErrorWhenItemsRemovedFromEmptyStack`（从空栈中移除元素时报错）\n\
    \n虽然更冗长，但公式化的 `should` 形式有一个优势——它提供了一个可以遵循的清晰模式。\n\n如果开发者知道测试必须以 `should` 开头（通常是因为他们习惯了这种写法），他们很难切换到不同的风格并编写一个非命题的测试。\n\
    \n`should` 的冗长通过强制开发者以正确的方式思考测试证明了其价值。\n\nKevlin Henney 将 `should` 比作自行车的辅助轮——一种我们在学习时的设备。\n\
    \n那么，我们什么时候应该去掉辅助轮？\n\n这取决于团队的构成以及变动频率。\n\n如果代码库生命周期内大多数人习惯于这种风格编写测试，那么增加的冗长是不值得的。如果相当比例的人不是这样，那么最好遵循惯例。\n\
    \n### 当规格风格不适用时使用示例风格\n\n偶尔，无法遵循规格命名风格，因为描述变得太长且臃肿。如果你觉得你的方法名变得过于冗长，请问自己两个问题：\n\
    \n1. 我真的只测试了一件事吗？\n2. 我的单元是否做得太多？\n\n如果你确信这两个问题的答案都是“否”，请切换到不同的风格——示例风格。\n\n在示例风格中，名称只描述“When”部分。它不描述预期行为，例如：\n\
    \n*   `emptyStack`\n*   `oneItemAdded`\n*   `removalFromEmptyStack`\n\n为了理解使用示例风格命名的测试，你必须阅读测试内部的代码。由于这个原因，在可能的情况下应使用规格风格。\n\
    \n### 尽可能在描述中避免方法名\n\n尽可能，避免在测试名称中包含方法名。\n\n在实践层面，这避免了在方法名重构时更新测试名称的额外开销。\n\n\
    更微妙的是，包含名称可能会让你以错误的方式思考——验证方法实现而不是指定单元行为。\n\n这不是硬性规定——有时在不引用接口的情况下，很难或无法描述有意义的行为。\n"
- fmt: "\nSo how should we pick these examples?\n\nOne approach is to look at the\
    \ possible inputs to the component under test.\n\nWe could fully specify our code\
    \ if we provided the expected output for each possible input. Usually, this is\
    \ not practical because the possible range of inputs is far too large. Instead,\
    \ we can look for categories of values within the possible range of inputs (e.g.,\
    \ `valid` and `invalid`) and pick an example from each one.\n\nHowever, the best\
    \ approach is usually not to think in terms of possible inputs and examples, but\
    \ to instead think first of the behaviors we would like our code to exhibit.\n\
    \nOnce we have identified the behavior we can then pick examples that demonstrate\
    \ it. The actual values used are often unimportant - \"Make tests easy to understand\"\
    \ discusses some techniques to make unimportant values less prominent in tests\
    \ and highlight the important ones.\n\nProperty-based testing takes this a stage\
    \ further.\n\nProperties are identified that must hold true for all inputs or\
    \ for a subset of possible inputs that meet certain criteria. The tests do not\
    \ contain any example values - just a description of how they must be constrained.\
    \ The examples used to check the properties are generated randomly and only ever\
    \ seen if the check fails.\n\nThere are some compelling advantages to property\
    \ based testing:\n\n* The tests describe what is important about the input values.\
    \ In example testing this must be inferred by the reader\n* The tests will automatically\
    \ find edge cases and bad assumptions made by the programmer\n\nThere is currently\
    \ little experience with property-based testing in the Java community, so questions\
    \ remain on how best to use it.\n\nOne obvious issue is that it introduces randomness,\
    \ although most frameworks provide some mechanism to control it and repeat test\
    \ runs.\n\n## Follow the Zero, One and Many Rule\n\nIf your components deals with\
    \ numbers or collections of things, make sure you use sufficient examples to describe\
    \ its behavior.\n\nA good rule thumb is that test cases covering 0 (or empty),\
    \ 1 and \"many\" are likely to be necessary. There will also be important edge\
    \ cases, e.g. algorithmic code dealing with integers might need to consider `Integer.MAX`\
    \ and `Integer.MIN`.\n\nThe zero, one many rule defines the minimum number of\
    \ cases you can hope to consider. To properly describe your code's behavior will\
    \ likely require many more.\n\nWhen test driving, it is usually easiest to start\
    \ with the `zero` test case.\n\n### Test One Thing at a Time\n\nEach test case\
    \ should specify one thing and one thing only.\n\nMultiple assertions within a\
    \ test may be an indicator that the test is testing more than one thing. Multiple\
    \ assertions should be treated with suspicion, but are not necessarily a problem\
    \ e.g.\n\n```java\n @Test\n  public void shouldReturnItemsInOrderTheyWereAdded()\
    \ {\n     ArrayDeque<String> testee = new ArrayDeque<String>();\n\n     testee.add(\"\
    foo\");\n     testee.add(\"bar\");\n\n     assertEquals(\"foo\",testee.pop());\n\
    \     assertEquals(\"bar\",testee.pop());\n  }\n```\n\nThis test tests only one\
    \ concern, but uses multiple asserts to do so.\n\n### Test Each Thing Only Once\n\
    \nOnce you've tested a concern, don't let it leak into other tests - if you do\
    \ then those tests are no longer testing only one thing.\n\nThis is a particularly\
    \ easy mistake to make with interaction-based testing. If it is vitally important\
    \ that the method `anImportantSideEffect()` is called, it is easy to find yourself\
    \ verifying that method in each test case.\n\nIf the contract ever changes so\
    \ that this side effect is not longer important, all tests will need to be updated.\n\
    \nThis concern should instead by covered by a single test case `shouldPerformImportantSideEffect()`.\n\
    \nAlthough we shouldn't let a property leak into test cases where it does not\
    \ belong this does not necessarily mean that it will be confined to a single test\
    \ case. It may take several examples to fully demonstrate a property.\n\n# Make\
    \ Tests Easy To Understand\n\nOne of our goals when writing a test is to document\
    \ what the code under tests does.\n\nWe achieve this in part by choosing clear\
    \ specification style names for each test case, but we must also ensure that the\
    \ code implementing each test case is easy to understand.\n\nSome techniques that\
    \ help achieve this are discussed below.\n\n### Make Test Structure Clear\n\n\
    A test can be viewed as having three parts:\n\n* Given - create the values and\
    \ objects required for the test\n* When - executes the code under test\n* Then\
    \ - verifies the output/behavior is as expected\n\nThese stages are also sometimes\
    \ called `arrange`, `act` and `assert` by people particularly attached to the\
    \ letter 'a'.\n\nAlthough it is important that these three stages are visible,\
    \ trying to rigorously separate them or label them with comments adds noise to\
    \ a test.\n\n**Bad**\n\n```java\n @Test\n  public void shouldRetrieveValuesInOrderTheyAreAdded()\
    \ {\n\n    // given\n    Stack<String> testee = new Stack<String>();\n    String\
    \ expectedFirstValue = \"a\";\n    String expectedSecondValue = \"b\";\n\n   \
    \ // when\n    testee.push(expectedFirstValue);\n    testee.push(expectedSecondValue);\n\
    \    String actualFirstValue = testee.pop();\n    String actualSecondValue = testee.pop();\n\
    \n    // then\n    assertThat(actualFirstValue).isEqualTo(secondValue);\n    assertThat(actualSecondValue).isEqualTo(firstValue);\n\
    \  }\n```\n\n**Better**\n\n```java\n @Test\n  public void shouldRetrieveValuesInOrderTheyAreAdded()\
    \ {\n    Stack<String> testee = new Stack<String>();\n    testee.push(\"a\");\n\
    \    testee.push(\"b\");\n    assertThat(testee.pop()).isEqualTo(\"b\");\n   \
    \ assertThat(testee.pop()).isEqualTo(\"a\");\n  }\n```\n\n### Follow Standard\
    \ TEA Naming Convention for Test Variables\n\nEstablishing simple conventions\
    \ can make some very basic things about a test clear to a reader.\n\nIf the unit\
    \ you are testing is a class make this clear by always naming it `testee` within\
    \ a test.\n\nIf you need to store an expected value in a variable, call it `expected`\
    \ (but don't store it in a variable just for the sake of it).\n\nIf you need to\
    \ store a result that you will compare against an expected value in variable,\
    \ name it `actual` (but don't store it in a variable just for the sake of it).\n\
    \nIf you have stubbed a participant consider naming it `stubbedFoo`, if it is\
    \ acting as a mock name it `mockedFoo`. This rule is less hard than the others\
    \ - decide on a case by case basis whether you think it makes your test more or\
    \ less readable.\n\n### Highlight What is Important, Hide What is Not\n\nIt should\
    \ be possible to read each test case at a glance - so make things clear by highlighting\
    \ what is important for that test case and hiding what is not.\n\nIf an aspect\
    \ of the input is important to the test case, highlight it by setting it `explicitly`\
    \ in the test case - don't rely on that value being set in a generic method.\n\
    \nEven if the same value is set by default, it is better to re-supply it in the\
    \ test so it is clearly visible.\n\nIf a particular value is not important, indicate\
    \ this to the reader by using well-known neutral values such as `\"foo\"` for\
    \ strings, or use clear names such as `someInt` or `anInt` for variables and methods\
    \ that supply values.\n\nSupplying values via a method call makes them less visible.\n\
    \nWhat is important in the test below?\n\n**Bad**\n\n```java\n @Test\n  public\
    \ void shouldXXX() {\n    MyClass testee = new MyClass();\n    assertThat(testee.process(0,\
    \ \"\", 3))\n      .isEqualTo(Status.FAIL);\n  }\n```\n\nHow about this version?\n\
    \n**Better**\n\n```java\n @Test\n  public void shouldXXX() {\n    int invalidValue\
    \ = 3;\n    MyClass testee = new MyClass();\n    assertThat(testee.process(anInt(),\
    \ aString(), invalidValue))\n      .isEqualTo(Status.FAIL);\n  }\n```\n\nWhile\
    \ we need additional context to understand why `3` is an invalid value, it should\
    \ be clear that the first two parameters to the `process()` method are not important\
    \ to the behavior we are specifying.\n\nWhy is it important that the testee below\
    \ returns the enum `CONTINUE`?\n\n**Bad**\n"
