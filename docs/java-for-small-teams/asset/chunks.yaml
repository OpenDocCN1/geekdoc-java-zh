  trans: "\n\n```\n @Test\n  public void shouldXXX() {\n    assertThat(testee.process()).isEqualTo(CONTINUE);\n\
    \  }\n```\n\n如果我们通过查看该类的其余部分，可能会发现：\n\n```\n @Before\n  public void setup() {\n\
    \     MyClass testee = new MyClass();\n     testee.setDefaultProcessState(CONTINUE);\n\
    \  }\n```\n\n其他测试可能不需要关心默认状态是什么，但这个测试需要了，因此我们应该这样写：\n\n**更好**\n\n```\n @Test\n\
    \  public void shouldXXX() {\n    testee.setDefaultProcessState(CONTINUE);\n \
    \   assertThat(testee.process()).isEqualTo(CONTINUE);\n  }\n```\n\n当我们开始处理更复杂的领域对象时，要将重要的值与那些“为了构造有效对象但对我们的测试没有特别兴趣”的值分离来变得越来越困难。幸运的是，我们可以使用构建器模式（builder\
    \ pattern）来减轻这种痛苦、减少重复，并保持测试的可读性。\n\n### 有意义地为值值\n\n如果一个值具有重要意义，请让这种意义变得清晰，例如：\n\
    \n```\n Foo testee = new Foo(PERFORM_VALIDATION);\n```\n\n而不是：\n\n```\n Foo testee\
    \ = new Foo(true);\n```\n\n### 编写 DAMP 测试代码\n\n正如我们所见，为了突出某个值对测试是重要的，我们需要将它保留在使用它的测试方法中。这可能会引入我们在普通代码中可能无法接受的重复——但测试代码略有不同。\n\
    \n复制和粘贴代码在测试代码和生产代码中都是糟糕的——代码越多，越难阅读，而且如果某个关注点在整个测试中被复制，它的改变将导致“散弹式修改”（shotgun\
    \ surgery）。\n\n因此，在测试代码中通常应该避免重复。\n\n然而，测试代码与生产代码不同。\n\n测试代码必须讲述更多故事——突出重要的部分并隐藏不重要的部分。测试代码不应该像生产代码那样\
    \ DRY（**D**on't **R**epeat **Y**ourself，不要重复自己）。它应该是 DAMP（包含 **D**escriptive **A**nd\
    \ **M**eaningful **P**hrases，描述性和有意义的短语）。\n\n如果将测试方法中的少量代码重构到共享方法中会隐藏正在发生的内容，请接受这种重复并将其留在原处。如果不影响可读性，请无情地重构。\n\
    \n### 选择正确的断言方法\n\n当测试失败时，良好的断言会告诉你哪里错了。\n\n虽然 JUnit 允许你提供断言消息，但这会给测试增加噪声。就像注释一样，这些消息应该留给那些无法通过代码进行通信的情况。\n\
    \n糟糕的\n\n```\nassertTrue(\"Expected 2 but got \" + actual, actual == 2);\n```\n\
    \n好的\n\n```\nassertEquals(2, actual);\n```\n\n内置断言的功能相当有限。替代性的断言库（如 AssertJ）提供了更丰富的功能，并产生更可读性的代码。\n\
    \n# 理解如何使用 Mocks 和 Stubs\n\n## 理解如何使用 Mocks 和 Stubs\n\n代码有两种类型，它们需要两种不同的测试。\n\n\
    **工作代码（Worker code）**执行具体任务。我们可以通过**基于状态的测试（state based testing）**来测试工作代码——即断言方法返回了预期的值，或者对象处于预期的状态。\n\
    \n基于状态的测试很容易识别，因为它会使用 `assert` 语句。\n\n**管理代码（Manager code）**通过协调其他对象来执行任务。\n\n\
    管理代码比工作代码更难测试，因为我们需要做一个选择——我们是尝试通过基于状态的测试从输出推断它的行为，还是使用**基于交互的测试（interaction based\
    \ testing）**？\n\n在基于交互的测试中，我们检查对象之间是否以预期的方式通信。为了做到这一点，我们需要以某种方式窃听对话。这通过使用充充真实对象的对象来实现。\n\
    \n通常这些对象是使用 Mock 框架（mocking framework）创建的。\n\n### Mock 框架\n\n虽然通常将由 Mock 框架创建的所有对象称为\
    \ mocks，但这是不准确的。\n\n这些对象一个更准确的通用术语是 `测试双胞（test double）`。\n\n它们可以根据行为细分：\n\n* \
    \  哑对象（Dummy object）——需要存在以满足类型签名，但从未被实际使用\n*   存根（Stub）——必须存在并可能提供间接输入\n*   Mock\
    \ 对象（Mock）——验证预期的交互是否发生\n*   假实现（Fake）——像真实的东西但更轻量——例如内存数据库\n*   间谍（Spy）——记录其与其他对象交互的对象\n\
    \n在这些对象中，只有 stubs、mocks 和 spies 可能是由 Mock 框架创建的。\n\n稍后我们会谈到 spies，但大多数测试双在概念上可以被视为\
    \ stub 或 mock。\n\n它们之间重要的区别是，mock 拥有一个预期，如果该预期没有被满足将会导致测试失败。也就是说，如果没有在 mock 上调用预期的方法，测试将失败。\n\
    \nstub 并不在乎是否被调用——它的作用仅仅是提供值。\n\n传统的 Mock 呈现了代码可读性的困境。它们定义了预期的结果（一个 *then*），但它们也是执行测试所需的固件的存（一个\
    \ *given*）。\n\n例如，使用 JMock 时，我们会写道：\n\n```\n Mockery context = new Mockery();\n\
    \n  // given / arrange\n  Subscriber subscriber = context.mock(Subscriber.class);\n\
    \  Publisher publisher = new Publisher();\n  publisher.add(subscriber);\n\n  final\
    \ String message = \"message\";\n\n  // then / assert . . . 但我们还没有写 when\n  context.checking(new\
    \ Expectations() {{\n    oneOf (subscriber).receive(message);\n  }});\n\n  //\
    \ when / act\n  publisher.publish(message);\n```\n\nSpy 优雅地解决了这个问题。\n\n### Spies\n\
    \nSpy 记录它们与其他对象的交互。在实践中，这意味着 spy 默认充当 stub，但在我们需要它们时也充当 mock。\n\n例如，使用 Mockito：\n\
    \n```\n // given\n  Subscriber subscriber = Mockito.mock(Subscriber.class);\n\
    \  Publisher publisher = new Publisher();\n  publisher.add(subscriber);\n\n  //\
    \ when\n  publisher.publish(message);\n\n  // then\n  Mockito.verify(subscriber).receive(message);\n\
    ```\n\n"
- fmt: "\nBy definition, state-based testing will never include mocks (in the strict\
    \ sense of the word), but they may use stubs to supply indirect values.\n\nIt\
    \ can be tempting to also use a mocking framework to stub values instead of using\
    \ their constructors and modifier methods. For complex objects using stubs can\
    \ appear easier than constructing real ones.\n\nDon't do this.\n\nMocking frameworks\
    \ should be used only to isolate our tests from objects with behavior. If you\
    \ have values that are difficult to construct consider the test data builder pattern\
    \ instead.\n\n## Choosing Between State and Interaction Testing\n\nSometimes there\
    \ is no choice about which to use. For example, it is not possible to meaningfully\
    \ specify how a cache should behave from its inputs and outputs alone. Other times\
    \ we must weigh the pros and cons.\n\nA state-based test for manager code is likely\
    \ to be less easy to read and understand as it must rely on the behaviors of the\
    \ objects the SUT interacts with. The test will also be coupled to these behaviors\
    \ and will require changes if those behaviors change - you have effectively increased\
    \ the size of the \"unit\" you are testing as discussed in \"Think units not methods\"\
    .\n\nInteraction-based testing requires us to peek beyond the unit's external\
    \ interface and into its implementation. This carries the risk that we might over-specify\
    \ and create an implementation-specific test.\n\nOn balance, it is preferable\
    \ to lean towards state based testing and where possible enable it in the design\
    \ of your code. There will, however, be many situations in which you will decide\
    \ that interaction based testing is preferable.\n\n# Understand Your Options For\
    \ Code Reuse\n\nReusing code is a good thing. \n\nWhen people start programming\
    \ in an OO language for the first time they tend to over-use inheritance for this\
    \ purpose before discovering that composition is generally a better idea.\n\n\
    Unfortunately, it is not easy to use composition to reuse code in `JUnit` tests\
    \ and this can lead you to write difficult-to-maintain test class hierarchies.\n\
    \nA small amount of duplication may be preferable to introducing a class hierarchy\
    \ when other options do not exist, but some types of test can be reused without\
    \ inheritance.\n\n### Assertions\n\nCode related to assertions is straightforward\
    \ to reuse outside of class hierarchies. This can be done trivially, by creating\
    \ classes containing `static assert` methods that can be statically imported (as\
    \ the built in `JUnit` assertions now are), or more elegantly by creating custom\
    \ matchers for `hamcrest` or `AssertJ`.\n\n### Object Creation\n\nFor small, simple\
    \ objects, the `mother pattern` can be used, but this can quickly become a maintenance\
    \ issue if the objects become more complex over time.\n\nA better pattern is the\
    \ `Builder` pattern, this can have the added advantage of allowing tests to clearly\
    \ highlight important and unimportant input.\n\n### Repeated Behaviors\n\nIf you\
    \ are using `JUnit` then repeated section of code within a test can be packaged\
    \ and re-used as [custom rules](https://github.com/junit-team/junit/wiki/Rules).\n\
    \n# Write Repeatable Tests\n\nUnit tests must be repeatable and deterministic\
    \ - it must be possible to run them thousands of times in any order and get the\
    \ same result. This means that they must have no dependency on any external factor.\n\
    \nIn practice this means unit tests must not:\n\n* Read or write from databases\n\
    * Perform network IO\n* Write to disk\n* Modify static state\n\nIf your test does\
    \ any of these things then it is not a `unit` test. This is not to say that your\
    \ test is not valuable.\n\n# Only Unit Test Code It Makes Sense To Unit Test\n\
    \nIn most cases, there is little value in unit testing:\n\n* Auto generated code\n\
    * Logging\n* Code whose `sole` concern is integration with another system\n\n\
    The canonical example of code with a pure integration concern is a `DAO`.\n\n\
    If a compatible in-memory fake database is available then it can be meaningfully\
    \ unit tested against that. If no fake is available, there is no value in writing\
    \ tests that mock out the `JDBC` driver - the first level of testing should instead\
    \ be integration testing against a real database.\n\nThere is also little value\
    \ in `explicitly` specifying the behavior of very simple boiler plate code such\
    \ as `get/set` methods. The expected behavior is clear without the presence of\
    \ a test and their actual behavior ought to be verified by other tests that use\
    \ the code while testing more complex logic. If code coverage indicates that these\
    \ methods have not been executed by other tests perhaps you can delete them?\n\
    \nCode that is not unit tested should always be integration tested.\n\n# Testing\
    \ FAQS\n\n## Testing FAQ\n\n### How Do I Test a Private Method?\n\nYou don't test\
    \ methods (private or public), you test the behavior of a unit as a whole.\n\n\
    If you cannot exercise the logic of a private method via the public interface,\
    \ is that logic actually required? If it is required, and is sufficiently complex\
    \ that it is causing you testing pain, then perhaps you should extract that concern\
    \ into a separate unit that can be tested in isolation and injected in via the\
    \ constructor?\n\n### How Do I Test a Void Method?\n\nYou don't test methods (void\
    \ or not), you test the behavior of a unit as a whole.\n\nIf the method is `void`,\
    \ it must be performing some sort of side effect that can be checked by either\
    \ state testing or interaction testing.\n\nFor example, if you are trying to 'test\
    \ the add method' of collection class, you should probably instead be writing\
    \ tests like:\n\n```java\n@Test\npublic void shouldIncreaseInSizeWhenItemsAdded()\
    \ {\n    Collection testee = new ArrayList();\n    assertEquals(0, testee.size());\n\
    \    testee.add(\"itemA\");\n    assertEquals(1, testee.size());\n    testee.add(\"\
    itemB\");\n    assertEquals(2, testee.size());\n}\n```\n\n### How do I Test Code\
    \ That Reasons About the Current Date/Time?\n\nA bad solution is to use a static\
    \ method (such as joda time's `setCurrentMillisFixed`) to set the current date.\n\
    \nA good solution is to inject a strategy for retrieving the date/time into your\
    \ class as a dependency.\n\nJava 8 provides the `java.time.Clock` class which\
    \ can be used for this.\n\nThe static factory method `fixed` will create an instance\
    \ that represents a constant time. Other methods provide implementations suitable\
    \ for production use.\n\nJava 7 does not provide an out of the box class for this\
    \ purpose so you will need to roll your own.\n\n### Do I Need to Implement a Teardown\
    \ Method for my Test?\n\nThis used to be a requirement for all `JUnit 3` tests.\
    \ If you didn't nullify all members of a test class in teardown your test suite\
    \ began to eat memory as it grew.\n\nThis is not a requirement for vanilla `JUnit\
    \ 4` tests, but it is possible that you may need to do so if you are using a custom\
    \ runner.\n\n What's the Difference Between Errors and Failures?\n\nYou should\
    \ try to design your tests to produce `failures` when the code is logically wrong.\
    \ Your tests should only produce errors when something unexpected has happened.\n\
    \n### How Should I Test for Expected Exceptions?\n\nIt depends.\n\nThe built in:\n\
    \n```java\n@Test(expected = FooException.class)\npublic void shouldThrowFooExceptionWhenFeelsLikeIt\n\
    ```\n\nIs concise and suffices for simple scenarios, but has a gotcha. If the\
    \ test method exercises more than one method of the testee, the expectation applies\
    \ to the whole test method rather than the specific interaction with the testee\
    \ that is expected to throw it.\n\nIf data held within the exception is important,\
    \ it is also not possible to assert on it with this method.\n\nThe traditional\
    \ solution is to use a try catch block:\n\n```java\n@Test\npublic void shouldThrowFooExceptionWhenFeelsLikeIt()\
    \ {\n  try {\n    testee.doStuff();\n    fail(\"Expected an exception\");\n  }\
    \ catch (FooException expectedException) {\n    assertThat(expectedException.getMessage(),\
    \ is(\"felt like it\"));\n  }\n}\n```\n"
