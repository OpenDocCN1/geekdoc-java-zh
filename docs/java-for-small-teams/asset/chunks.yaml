- fmt: "\nWe recommend that the first type are using sparingly, if at all. This is\
    \ discussed further in \"Know How to Implement Hashcode and Equals\".\n\nGenerating\
    \ code from a model (such as a schema or grammar) can be a useful approach as\
    \ long as the generated code is not modified and is packaged separately. If generated\
    \ and non-generated code are packaged within the same module then this can start\
    \ to cause friction (see below).\n\n### Compile Time Annotation Processors\n\n\
    JSR 269 introduced a standard framework for processing annotations at build time.\
    \ Several tools exist that use JSR 269 to generate code.\n\nMost use the annotated\
    \ classes purely as input, from which new classes are generated. Often, the new\
    \ classes extend or implement the annotated class or interface but remain separate.\
    \ These are really just a subset of model based boilerplate generators where the\
    \ model input model is annotated Java classes.\n\nSome (such as project Lombok)\
    \ update the annotated classes themselves, adding additional behavior. This is\
    \ likely to increase both surprise and friction which are discussed below.\n\n\
    ### Downsides\n\nThere are clearly a lot of upsides to code generators, so why\
    \ wouldn't they always make sense?\n\nThe main issues they cause are `surprise`\
    \ and `friction`.\n\n#### Surprise\n\nIf you generate code at compile or runtime\
    \ the you are no longer programming in Java.\n\nYou are programming in an augmented\
    \ Java that does things that developers maintaining the code may not be aware\
    \ of.\n\nIt may do things that they do not expect.\n\nIt may break fundamental\
    \ assumptions that programmers have about what can or cannot happen within their\
    \ code.\n\nRuntime generators will usually generate more surprise than compile\
    \ time systems - they add an element of `magic` that breaks the usual Java rules.\
    \ Runtime generators also often weaken type safety, moving classes of problem\
    \ a developer would normally expect to occur at compile time to runtime.\n\nThe\
    \ first time a developer encounters a code generator in a project, everything\
    \ it does will be surprising.\n\nAfter a period of learning, most of the surprise\
    \ should go away but each developer will need to go through this learning period.\
    \ The learning involved can be significant - gaining a complete understanding\
    \ of framework such as `Spring` is, for example, a significant effort.\n\nThe\
    \ most worrying problem is when there is still some surprise left after the initial\
    \ learning period.\n\nIf you find yourself asking the question \"could this be\
    \ because of the code generator?\" when something unexpected happens with your\
    \ system, and having to eliminate that possibility each time, then you have introduced\
    \ a very real cost into your project.\n\n#### Friction\n\nCode using compile-time\
    \ generators will not import cleanly into IDEs unless the IDE understands how\
    \ to run the generator. Even when the system is supported by an IDE it may require\
    \ plugins to be installed, configuration options to be set etc.\n\nThe amount\
    \ of friction, and how often it is encountered, will depend on the IDE and the\
    \ quality of the support. There may be little friction and it may only be encountered\
    \ when a new developer joins a project. Or it may be considerable and triggered\
    \ each time code is cleaned.\n\nThe most effective way to reduce the friction\
    \ is to package the generated code separately from the code that depends upon\
    \ it. The generated code then becomes a normal binary dependency and the fact\
    \ that it is automated becomes an internal implementation detail.\n\nWhile this\
    \ works well, it may also have a downside. It may create artificial modules. If\
    \ the code was not auto-generated, would it have made sense to package it as a\
    \ separate module?\n\nRuntime generators do not usually introduce much friction,\
    \ although sometimes issues might be experienced if `javaagents` are not present\
    \ when running tests from the IDE.\n\n### The Trade-off\n\nSo those are the issues.\n\
    \nSurprise and friction sound like minor concerns compared to the promise of functionality\
    \ for free, but their impact can be significant.\n\nWhether or not it makes sense\
    \ to introduce a code generator often depends on how much it will be used. If\
    \ there is a large amount of functionality that can be auto-generated then it\
    \ probably makes sense, if the amount is relatively small it may be best to stick\
    \ with vanilla Java.\n\n# Optimise For Readability\n\n## Optimize for Readability\
    \ not Performance\n\n### Summary\n\nDon't optimize your code prematurely.\n\n\
    Concentrate on making it simple and understandable instead.\n\n### Details\n\n\
    Many new programmers worry about the performance of each method they write, avoid\
    \ code they expect to be inefficient and write in a style that attempts to minimize\
    \ object allocations, method calls, assignments or other factors they expect to\
    \ have a cost.\n\nAlthough it often decreases readability and increases complexity,\
    \ most micro-performance optimization provides no performance benefit at all.\n\
    \nWithin the context in which we work, performance should be one of the concerns\
    \ considered last. Instead, attention should be paid to making code as simple\
    \ and readable as possible.\n\nIf a performance issue arises, profiling should\
    \ be used to identify where the problems actually lie.\n\nThis does not mean the\
    \ performance should be disregarded completely, but it should always be trumped\
    \ by code readability and simplicity until it can be proven that there is a real\
    \ benefit of optimization. Where code can be written in a more efficient manner\
    \ without `any` increase in complexity or trade-off with readability then the\
    \ (presumed) more efficient code should be preferred.\n\n# Prefer Readable Code\
    \ To Comments\n\n## Prefer Readable Code to Comments\n\n### Summary\n\nUse comments\
    \ only to explain what you cannot make the code itself explain.\n\nIf you are\
    \ about to write a comment, first think if there is a way you could change the\
    \ code so that it would be understandable without comments.\n\n### Details\n\n\
    From Clean Code by Robert C Martin.\n\n*\"Nothing can be quite so helpful as a\
    \ well-placed comment. Nothing can clutter up a module more than frivolous dogmatic\
    \ comments. Nothing can be quite so damaging as an old crufty comment that propagates\
    \ lies and misinformation.\"*\n\nComments should be used only to explain the intent\
    \ behind code that cannot be refactored to explain itself.\n\n*Bad*\n\n```\n//\
    \ Check to see if the employee is eligible for full benefits\nif ((employee.flags\
    \ & HOURLY_FLAG) &&(employee.age > 65))\n```\n\n*Better*\n\n```java\nif (employee.isEligibleForFullBenefits())\n\
    ```\n\nA comment is only useful if it explains something that the code cannot.\n\
    \nThis means that any comments you do write should provide the `why`, not the\
    \ what or the how\n\n*Bad*\n\n```\n// make sure the port is greater or equal to\
    \ 1024\nif (port < 1024) {\n  throw new InvalidPortError(port);\n}\n```\n\n*Better*\n\
    \n```java\n// port numbers below 1024 (the privileged or “well-known ports”)\n\
    // require root access, which we don’t have\nif (port < 1024) {\n  throw new InvalidPortError(port);\n\
    }\n```\n\n*Better still*\n\n```java\nif (requiresRootPrivileges(port)) {\n  throw\
    \ new InvalidPortError(port);\n}\n\nprivate boolean requiresRootPrivileges(int\
    \ port) {\n  // port numbers below 1024 (the privileged or \"well-known ports\"\
    )\n  // require root access on unix systems\n  return port < 1024;\n}\n```\n\n\
    Here, the functional intent has been captured in the method name, the comment\
    \ has been used solely to provide some context as to why the logic makes sense.\n\
    \nThe magic number might also be replaced with a constant.\n\n```java\nfinal static\
    \ const HIGHEST_PRIVILEDGED_PORT = 1023;\n\nprivate boolean requiresRootPrivileges(int\
    \ port) {\n  // The privileged or \"well-known ports\" require root access on\
    \ unix systems\n  return port <= HIGHEST_PRIVILEDGED_PORT;\n}\n```\n\nThe comment\
    \ arguably still adds value however - if nothing else it gives a reader unfamiliar\
    \ with the topic two key phrases to search for on the web.\n\n# Javadoc Judiciously\n\
    \n### Summary\n"
