  trans: "\n\n它描述了某物 `must` 需要做什么，而对其对其如何实现做任何假设。它允许存在多种实现。如果一个规范与某种实现绑定，那么它就是`over-specified`（过度规格），并且在实现发生变化时必须之更改。\n\
    \n所以这就是我们必须的目标——我们代码的可执行规范。\n\n遗憾的是，这非常困难。\n\n## 规范优先\n\n可以帮助的一种简单技术是在编写代码之前编写规范，即\
    \ TDD（测试驱动开发）。\n\n一个严格的 `TDD` 循环以非常小的步骤进行。\n\n首先编写一个测试并运行它，确保它是失败的。\n\n接下来编写恰少的代码来让该测试通过（不要多写）。\n\
    \n花一点时间看看是否有合理的重构可以改进代码，然后编写下一个测试并继续循环。\n\n这有几个优势：\n\n* 它保证了所有代码都 `can` 被测试\n\
    * 因为在编写测试时还没有实现，因此很难编写出与特定实现绑定的测试\n* 它保证了所有行为都被测试覆盖\n* 它遏制了编写多余代码\n\n`TDD` 有两个重要方面：\n\
    \n1. 先编写规范\n2. 以非常微小的步骤移动\n\n这两个实践单独单独都是很好的主意，即使它们不结合在一起。\n\n如果我们先编写规范，但以较大的步骤移动（可能是因为我们认为自己知道实现应该是什么样的），我们将实现第一个优势——即保证我们编写的代码是可以被测试的。\n\
    \n我们这指什么意思？\n\n如果代码在编写时没有考虑测试，那么很难为它编写一个符合我们对 `unit`（单元）测试定义的测试。\n\n我们可以通过遵循简单的规则来让代码更具可测试性：\n\
    \n* 始终注入依赖\n* 避免全局状态（单例、静态变量、`ThreadLocals`、注册表等）\n\n但即使我们遵循了这些规则，如果我们没有为测试进行设计，我们仍然会发现测试代码很困难。先编写规范要求我们的设计考虑测试。\n\
    \n虽然我们确保了代码是可测试的，但由于我们在带着实现的情况下以大步移动，我们可能无法获得其他收益。\n\n如果我们在不先写测试的情况下编写代码，我们可能会发现虽然已经完成了，但代码很难测试。然而，如果我们应用了第二种技术——以微小步骤移动，编写这些代码的过程将会变得更容易。\n\
    \n如果我们在执行代码之前只编写少量代码并观察每个微小更改的结果，我们可能会花费更少的时间进行调试，不太可能编写我们不需要的代码，并且整体移动得更快。\n\n\
    `TDD` 有许多优势，但它不是魔法。\n\n即使被严格应用，也完全可能写出糟糕的代码和规范。`TDD` 并不意味着你可以停止思考。\n\n尽管如此，如果你对正在工作的技术和领域有良好的理解，如果你想为质量优化，`TDD`\
    \ 通常是最好的方法。\n\n如果你你不熟悉自己的领域或技术，你可能会发现先编写规范很困难。\n\n这个问题的经典解决方案是首先通过产生一个丢弃的 spike（实验）来获得理解。\n\
    \n## Spikes（实验）\n\nSpike 只是一些快速粗糙的代码，用于探索你可能如何解决问题。在 spike 结束后，你将知道该方法是否有效，或者是否值得寻找替代方案。\n\
    \n通过产生 spike，你对正在处理的领域和技术会有更多的理解。即使 spike 结束时的结论是这是一个糟糕的方法，spike 仍然很有用，因为它增加了你的理解。\n\
    \n一旦你从 spike 中学会了所有知识，它就应该被丢弃，并使用你所获得的知识通过测试驱动编写最终代码。\n\n## Spike and Stabilize（实验与稳定）\n\
    \n传统上，spike 会被丢弃，因为它们本质上质量很低。丢弃 spike 是以（可能）较慢的交付为代价优化代码质量。\n\n有时这不是你想要的权衡。\n\n\
    另一种方法是尝试稳定 spike 以适用于使用。如果你这样做，你最终得到的将比重新开始质量要低。\n\n在项目的生命周期内，你在这段代码上花费的精力也将比丢弃\
    \ spike 时多。\n\n你为了这种质量损失和精力增加而获得的是更快的 `first` 交付。有时这是值得的权衡，有时则不是。\n\n# 思考单元而不是方法\n\
    \n## 思考单元而不是方法\n\n单元测试描述的每个行为通常应该与整个 `unit` 相关，而不是单个方法的职责。\n\n### 什么是单元（Unit）？\n\
    \n要从单元的角度思考，我们必须首先回答 `unit` 到底是什么这个难题。\n\n以方法为单位进行测试，实际上等同于说 `unit` 是一个方法。很容易证明为什么这并不总是奏效。\n\
    \n如果我们尝试为 `java.util.Stack` 的 `push` 方法编写单元测试，我们可能会得到类似下面的内容：\n\n```\n@Test\n\
    public void testPush() {\n   Stack<String> testee = new Stack<String>();\n   testee.push(\"\
    foo\");\n   assertThat(testee.pop()).isEqualTo(\"foo\");\n};\n```\n\n现在让我们测试 `pop`\
    \ 方法：\n\n```\n@Test\npublic void testPop() {\n   Stack<String> testee = new Stack<String>();\n\
    \   testee.push(\"foo\");\n   assertThat(testee.pop()).isEqualTo(\"foo\");\n};\n\
    ```\n\n噢。这看起来很眼熟。\n\n我们遇到的问题是定义的定义的 `unit` 太小了。\n\n如果我们开始将 `java.util.Stack` 视为我们的\
    \ `unit`，那么测试变得简单许多：\n\n```\n@Test\npublic void shouldRetrieveInOrderAdded() {\n\
    \  Stack<String> testee = new Stack<String>();\n  testee.push(\"a\");\n  testee.push(\"\
    b\");\n  assertThat(testee.pop()).isEqualTo(\"b\");\n  assertThat(testee.pop()).isEqualTo(\"\
    a\");\n}\n```\n\n我们写了一个测试，它不是试图描述方法做什么，而是描述整个类的行为。\n\n认为我们的工作是测试方法的想法对于新接触单元测试的开发者来说很常见，不幸，某些\
    \ IDE 和为每个方法生成测试模板的工具也强化了这一点。\n\n### 类是单元吗？\n\n将类视为 `unit` 通常是有意义的，这是一个很好的默认定义，但它并不总是正确的粒度。\n\
    \n如果我们尝试测试 `java.util.Collections` 类，我们会发现将 `sort`、`reverse`、`singleton` 等方法视为独立的\
    \ `units` 是完全合理的。每个方法代表一个自包含的逻辑行为。\n\n所以有时 `units` 和方法一样小。\n\n有时它们也比单个类大。\n\n\
    如果我们在没有任何测试的情况下继承下面的代码，我们会为它写什么测试？\n\n```\npublic class ThingaMeBob {\n\n  private\
    \ final Iterable<MatchingBinaryOperator> actions;\n\n  ThingaMeBob() {\n    actions\
    \ = Arrays.asList(new Addition(), new Subtraction());\n  }\n\n  public int process(String\
    \ s, int a, int b) {\n    for (MatchingBinaryOperator each : actions) {\n    \
    \  if (each.match(s)) {\n        return each.apply(a,b);\n      }\n    }\n\n \
    \   throw new RuntimeException();\n  }\n\n}\n\n```\n\nclass Addition implements\
    \ MatchingBinaryOperator {\n  public boolean match(String s) {\n    return \"\
    add\".equals(s);\n  }\n  public int apply(int a, int b) {\n    return a + b;\n\
    \  }\n}\n\nclass Subtraction implements MatchingBinaryOperator {\n  public boolean\
    \ match(String s) {\n    return \"minus\".equals(s);\n  }\n  public int apply(int\
    \ a, int b) {\n    return a - b;\n  }\n}\n```\n\n"
- fmt: "\nWe might write tests for the `Addition` and `Subtraction` classes:\n\n```java\n\
    public class AdditionTest {\n\n  Addition testee = new Addition();\n\n  @Test\n\
    \  public void shouldMatchWhenStringIsAdd() {\n  }\n\n  @Test\n  public void shouldNotMatchWhenStringIsNotAdd()\
    \ {\n  }\n\n  @Test\n  public void shouldAddTwoNumbers() {\n  }\n\n  // etc\n\n\
    }\n```\n\nAnd for the `ThingaMeBob` class:\n\n```java\npublic class ThingaMeBobTest\
    \ {\n\n  ThingaMeBob testee = new ThingaMeBob();\n\n  @Test\n  public void shouldAddTwoNumbers()\
    \ {\n  }\n\n  @Test\n  public void shouldSubtractTwoNumbers() {\n  }\n\n  // etc\n\
    \n}\n```\n\nAt some point we would hopefully question why this code is so over-engineered\
    \ and consider refactoring to something simpler like.\n\n```java\npublic class\
    \ ThingaMeBob {\n\n  public int process(String s, int a, int b) {\n    if (\"\
    add\".equals(s)) {\n      return a + b;\n    }\n\n    if (\"minus\".equals(s))\
    \ {\n      return a - b;\n    }\n\n    throw new RuntimeException();\n  }\n\n\
    }\n```\n\nWhat happens to our tests?\n\nWhich ones were most valuable?\n\nThe\
    \ answer of course is that the test which exercised all three classes through\
    \ the public interface of `ThingaMeBob` proved the most useful. We did not have\
    \ to change it at all. When it ran green we knew our refactoring was successful\
    \ and everything still works.\n\nWe deleted the ones for `Addition` and `Subtraction`.\
    \ The smaller units we created were just implementation detail.\n\nLets re-wind\
    \ and imagine things happened differently.\n\nWhat if we were asked to test drive\
    \ the desired behavior from scratch? What would we write?\n\nWe would most likely\
    \ write something that looked like our 2nd simpler version of `ThingaMeBob` and\
    \ a test that looked something like `ThingAMeBobTest`.\n\nIf we were then asked\
    \ to add support for another 10 operations, we might leave our design fundamentally\
    \ the same.\n\nWhat if a new requirement came for the behavior in `ThingAMeBob`\
    \ to be more dynamic, with different operations being enabled and disabled at\
    \ runtime?\n\nIt would then make sense to refactor to something like our earlier\
    \ more complex version.\n\nWhat should we do with the tests?\n\nWe would already\
    \ have tests written in terms of `ThingaMeBob` that describe all supported behaviors.\
    \ Should we also fully describe `Addition`, `Subtraction` and the other 10 operations\
    \ with tests as we extract them into classes?\n\nThere is no right answer here,\
    \ but I hope it is clear that the most useful `unit` that we have identified is\
    \ `ThingaMeBob`. The smaller `units` are part of just one implementation of the\
    \ functionality we require.\n\nIf we choose to write tests for each extracted\
    \ class those tests would have some value.\n\nThe test written in terms of `ThingaMeBob`\
    \ would do a poor job of describing what each of the small extracted units does.\
    \ If a test was failing it wouldn't be instantly obvious which class the bug was\
    \ in. If we had to change one of the extracted classes it wouldn't be instantly\
    \ obvious which test to run.\n\nSo there is definitely value in writing tests\
    \ for each of the extracted classes. At the same time, if we were not to do so,\
    \ that would also be a reasonable decision and it would reduce the cost of the\
    \ refactoring.\n\nThe `ThingaMeBob` tests will be fast and repeatable and allow\
    \ us to work easily with the code. If we could only have tests at one level, the\
    \ level we would choose is `ThingaMeBob`.\n\nSo, as a starting point, assume that\
    \ a `unit` will be a class, but recognize that this is not a hard rule.\n\nA `unit`\
    \ is really a \"single self contained logical concern\" - it may make sense to\
    \ have several classes collaborate in order to capture that concern - as long\
    \ as that collaboration provides a single well defined entry point.\n\nMaking\
    \ units too small may be a form of over-specifying.\n\nMaking units too large\
    \ may result in tests that are difficult to understand and expensive to maintain.\n\
    \nAs a rule of thumb, if you might reasonably have made one or more classes inner\
    \ classes of a different class, perhaps they should be treated as a single unit.\n\
    \n# Name Tests With A Specification Style\n\n## Name Test Cases With a Specification\
    \ Style\n\nUse the name of each test case to describe one (and **only** one) behavior\
    \ of the unit under test. The name should be a proposition - i.e. a statement\
    \ that could be true or false.\n\nThe method name should start with `should`.\n\
    \nThis is superfluous once you get good at writing test names, but in a mixed\
    \ team it is useful as it encourages thinking about the test in the right way.\n\
    \nThe rest of the name should describe a behavior and, optionally, a scenario\
    \ (identified by the word When).\n\nFor example, we might start to describe `java.util.Stack`\
    \ with:\n\n*   `shouldBeEmptyWhenCreated`\n*   `shouldReturnMostRecentlyAddedItemsFirst`\n\
    *   `shouldThrowAnErrorWhenItemsRemovedFromEmptyStack`\n\nContrast this with common\
    \ naming patterns found in some code bases:\n\n*   `emptyStack`\n*   `testEmptyStack`\n\
    *   `testPush`\n\nThese names alone tell us nothing about how a `Stack` should\
    \ behave.\n\nIf we omit `should` we can create more concise names\n\n*   `isEmptyWhenCreated`\n\
    *   `returnsItemsInOrderTheyAreAdded`\n*   `throwsAnErrorWhenItemsRemovedFromEmptyStack`\n\
    \nAlthough more verbose the formulaic `should` form has an advantage - it provides\
    \ a clear pattern to follow.\n\nIf a developer knows that a test name must start\
    \ with `should` (often because they have seen this pattern within existing tests)\
    \ it is hard for them to revert to a different style and write a test that is\
    \ not a proposition.\n\nThe verbosity of `should` pays for itself by forcing developers\
    \ to think about tests in the right fashion.\n\nKevlin Henney compares `shoulds`\
    \ to training wheels on a bike - a device to help while we are learning.\n\nSo\
    \ when should we take the training wheels off?\n\nThis depends on the makeup of\
    \ the team and how often the team changes.\n\nIf the majority of people who are\
    \ likely to work on the codebase over its lifetime are accustomed to writing tests\
    \ in this style then the added verbosity is not worth it. If a sufficiently large\
    \ proportion are not then it is probably best for the team to stick with the convention.\n\
    \n### Use the Example Style When Specification Style Does Not Work\n\nOccasionally,\
    \ it is not possible to follow the specification naming style because the descriptions\
    \ become too long and unwieldy. If it feels like your method names are becoming\
    \ overly long ask yourself two questions:\n\n1. Am I really testing only one thing?\n\
    2. Is my unit doing too much?\n\nIf you're confident the answer is \"no\" to both\
    \ then switch to a different style - example style.\n\nIn example style the name\
    \ describes only the \"When\" part. It does not describe the expected behavior,\
    \ e.g.:\n\n*   `emptyStack`\n*   `oneItemAdded`\n*   `removalFromEmptyStack`\n\
    \nTo understand tests named with the example style, you must read the code within\
    \ the tests. For this reason, this specification style should be preferred when\
    \ possible.\n\n### Avoid Method Names in Test Descriptions Where Possible\n\n\
    Where possible, avoid including method names in test names.\n\nOn a practical\
    \ level this avoids the extra overhead of updating test names if method names\
    \ are ever refactored.\n\nMore subtly, including names can make you think in the\
    \ wrong fashion - verifying method implementation rather than specifying unit\
    \ behavior.\n\nThis is not a hard rule - sometimes it will be difficult or impossible\
    \ to describe a meaningful behavior without referring to the unit's interface.\n\
    \nThe domain language may also overlap with the method names, so you may find\
    \ yourself using the same words as are also used as a method name.\n\n# Pick Examples\
    \ Carefully\n\n## Pick Examples Carefully\n\nTraditional testing is performed\
    \ with examples.\n\nThe overall behavior of the component or unit is explained\
    \ by supplying a series of example input and output values, or example interactions\
    \ with other components.\n\nOur goal is to use examples to:\n\n*   Communicate\
    \ the general expected behavior\n*   Communicate the behavior at any edge cases\n\
    *   Gain confidence that our code is correct and remains correct when we change\
    \ it\n"
