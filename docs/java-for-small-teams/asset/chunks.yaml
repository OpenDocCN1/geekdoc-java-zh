  trans: "\n\n*   [Findbugs](http://findbugs.sourceforge.net/)\n*   [Error Prone](http://errorprone.info/)\n\
    \n可以配置这些工具，当我们在不预期的参数上传递了 `null` 时，中断构建。\n\n在每个类、方法或参数上都添加 `@Nonnull` 注解会迅速变得繁琐，而且其收益是否值得产生如此噪音仍有待商榷。\n\
    \n幸运的是，可以通过在 `package-info.java` 文件中对包进行如下注解，从而将 `@Nonnull` 设置为默认值：\n\n```java\n\
    @javax.annotation.ParametersAreNonnullByDefault\npackage com.example.somepackage\
    \ ;\n```\n\n遗憾的是，子包不会继承父包的注解，因此每个包都必须创建一个 `package-info.java` 文件。\n\n一旦将非空参数设置为默认行为，任何接受\
    \ `null` 的参数都可以使用 `@Nullable` 进行标注。\n\n# 广泛使用 Final\n\n## 广泛使用 Final \n\n### 总结\n\
    考虑将任何不改变的变量或参数设置为 `final`。\n\n### 详情\n将仅赋值一次的参数和变量设置为 `final` 可以使方法更容易理解，因为它限制了代码内部可能发生的情况。\n\
    \n将所有参数和仅赋值一次的变量都设置为 `final` 是合理的，但这需要与在随处插入 `final` 关键字所产生的噪音之间进行权衡。\n\n对于短方法来说，收益是否大于成本尚有争议，但如果一个方法很大且难以处理，那么将内容设置为\
    \ `final` 的理由就会变得充分得多。\n\n每个团队都应该就创建 `final` 变量的策略达成共识。\n\n至少在大方法内部，所有内容都应该被设置为\
    \ `final`。这也可以根据团队的决定扩展到较短的方法中。一刀切的策略优点是易于自动化/理解。更细致的策略则难以沟通。\n\n在处理遗留代码时，将参数和变量设置为\
    \ `final` 也是在重构之前理解方法的有用第一步。对于那些被证明难以拆分为更小分块的方法，当单赋值变量变为 `final` 时，它们也会变得更容易理解。\n\
    \n# 不要提供超过一个工作构造函数\n\n## 不要提供超过一个工作构造函数\n\n### 总结\n虽然一个类可以提供多个构造函数，但应该只有一个构造函数负责写入字段并初始化类。\n\
    \n### 详情\n在构造期间只有一个地方进行赋值，可以很容易理解类可以被构造的状态。\n\n类不应该提供多个设置字段的构造函数。\n\n**糟糕的**\n\
    ```java\npublic class Foo {\n  private final String a;\n  private final Integer\
    \ b;\n  private final Float c;\n\n  public Foo(String value) {\n    this.a = Objects.requireNonNull(value);\n\
    \    this.b = 42;\n    this.c = 1.0f;\n  }\n\n  public Foo(Integer value) {\n\
    \    this.a = \"\";\n    this.b = Objects.requireNonNull(value);\n    this.c =\
    \ 1.0f;\n  }\n\n  public Foo(Float value) {\n    this.a = \"\";\n    this.b =\
    \ 42;\n    this.c = Objects.requireNonNull(value);\n  }\n}\n```\n\n上述代码中值的重复可以删除，但它仍然很令人困惑，因为初始化类的关注点分散在三个位置。\n\
    \n如果增加了更多字段，很容易忘记在现有的构造函数中初始化它们。\n\n幸运的是，我们已经将所有字段设为 `final`，因此这会导致编译错误。如果该类是可变的，我们将在运行时发现一个\
    \ bug。\n\n**更好的**\n```java\npublic class Foo {\n  private final String a;\n  private\
    \ final Integer b;\n  private final Float c;\n\n  private Foo(String a, Integer\
    \ b, Float c) {\n    this.a = Objects.requireNonNull(a);\n    this.b = Objects.requireNonNull(b);\n\
    \    this.c = Objects.requireNonNull(c);\n  }\n\n  public Foo(String value) {\n\
    \    this(value, 42, 1.0f);\n  }\n\n  public Foo(Integer value) {\n    this(\"\
    \", value, 1.0f);\n  }\n\n  public Foo(Float value) {\n    this(\"\", 42, value);\n\
    \  }\n}\n```\n\n字段现在只在一个位置被写入，减少了重复。\n\n我们也可以一眼看出 `Foo` 无法用 `null` 值进行构造。在之前的版本中，这只能通过扫描三个不同的位置来确定。\n\
    \n遵循这种模式，即使字段不是 `final` 的，也很难忘记设置字段。\n\n# 避免检查型异常\n\n## 避免检查型异常\n\n### 总结\n除非在抛出检查型异常时有明确的可采取措施，否则不要声明检查型异常。\n\
    \n### 详情\n异常是为了异常情况设计的——设计你的代码，使其在预期会发生的场景中不抛出异常。\n\n这意味着它们不应该用于正常的控制流。\n\n检查型异常会膨肿并复杂代码。你应该避免将它们添加到你的\
    \ API 中，除非调用者总可以采取明确的行动来从错误场景中恢复。\n\n这种情况出奇地少见。\n\n如果你正在使用的库使用了检查型异常，可以通过重新抛出运行时异常（runtime\
    \ exception）来包装它们。\n\n当你这样做时，请务必保持堆栈跟踪信息。\n\n```java\ntry {\n  myObject.methodThrowingException();\n\
    } catch (SomeCheckedException e) {\n  throw new RuntimeException(e);\n}\n```\n\
    \n如果你捕获了 `Exception` 或 `Throwable`，但不确定具体类型，可以使用 Guava 的 `Throwables.propagate`\
    \ 避免创建不必要的包装。\n\n```java\ntry {\n  myObject.methodThrowingException();\n} catch\
    \ (Exception e) {\n  throw Throwables.propagate(e);\n}\n```\n\n这将包装检查型异常并重新抛出异常异常。\n\
    \n# 具体细节\n\n## 具体细节\n本节提供了关于各种 Java 特性和陷阱的特定建议。\n\n本节涵盖的大部分内容可以通过 FindBugs、PMD、Checkstyle\
    \ 和 Sonar 等工具自动化。\n\n# 如何实现 hashCode 和 equals\n\n## 如何实现 hashCode 和 equals\n\n\
    ### 总结\n实现 `hashCode` 和 `equals` 并不简单。除非必要，否则不要实现它们。如果你确实实现了它们，请确保你自己在做什么。\n\n\
    ### 详情\n众所周知，如果你重写了 `equals`，那么必须重写 `hashCode` 方法（参见 Effective Java 第 9 条）。\n\n\
    如果逻辑上相等的对象没有相同的 `hashCode`，当它们放入基于哈表的集合（如 `HashMap`）时，它们的行为将会非常异常。\n\n所谓“异常”，是指你的程序将以一种非常难以调试的方式错误运行。\n\
    \n遗憾的是，正确实现 `equals` 异常地困难。Effective Java 第 8 条花了大约 12 页来讨论这个话题。\n\n`equals` 的约定在\
    \ `java.lang.Object` 的 Javadoc 中清晰陈述。我们在这里不重复它，也不重复讨论它的含义，这些可以在 Effective Java\
    \ 和互联网的大量区域找到。相反，我们将观察实现它的策略。\n\n无论你采用哪种策略，先为你的实现编写测试都是重要的。\n\n如果代码发生变化（例如增加了字段或更改了其类型），`equals`\
    \ 方法很容易导致难以诊断的 bug。编写 `equals` 方法的测试曾是一个痛苦且耗时的过程，但现在有了库可以让指定常见情况变得非常简单（参见测试 FAQ）。\n\
    \n### 不要实现\n这是最简单的策略，也是为了保持代码库精小而应该默认采用的策略。\n\n大多数类不需要 `equals` 方法。除非你的类代表某种值，否则与另一个进行比较没有意义，因此坚持继承自\
    \ `Object` 的实现即可。\n\n一个讨厌的灰色地带是那些生产代码不需要比较相等性、但测试代码需要的类。这里的困境在于，是为了纯粹的测试而实现这些方法，还是让测试代码通过自定义的相等性检查变得复杂。\n\
    \n"
- fmt: "\nThere is, of course, no right answer here; we would suggest first trying\
    \ the `compare-it-in-the` test approach before falling back to providing a custom\
    \ `equals` method.\n\nThe custom equality checks can be cleanly shared by implementing\
    \ a custom assertion using a library such as `AssertJ` or `Hamcrest`.\n\n`Effective\
    \ Java` tentatively suggests having your class throw an error if `equals` is unexpectedly\
    \ called:\n\n```java\n@Override public boolean equals(Object o) {\n  throw new\
    \ AssertionError(); // Method is never called\n}\n```\n\nThis seems like a good\
    \ idea but, unfortunately, it will confuse most static analysis tools. On balance,\
    \ it probably creates more problems than it solves.\n\n## Auto-Generate With an\
    \ IDE\n\nMost IDEs provide some method of auto-generating `hashCode` and `equals`\
    \ methods. This is an easily-accessible approach, but the resulting methods are\
    \ (depending on the IDE and its settings) often ugly and complex such as the ones\
    \ generated by `Eclipse` shown below:\n\n```java\n @Override\n  public int hashCode()\
    \ {\n    final int prime = 31;\n    int result = 1;\n    result = prime * result\
    \ + ((field1 == null) ? 0 : field1.hashCode());\n    result = prime * result +\
    \ ((field2 == null) ? 0 : field2.hashCode());\n    return result;\n  }\n```\n\n\
    ```java\n @Override\n  public boolean equals(Object obj) {\n    if (this == obj)\n\
    \      return true;\n    if (obj == null)\n      return false;\n    if (getClass()\
    \ != obj.getClass())\n      return false;\n   MyClass  other = (MyClass) obj;\n\
    \    if (field1 == null) {\n      if (other.field1 != null)\n        return false;\n\
    \    } else if (!field1.equals(other.field1))\n      return false;\n    if (field2\
    \ == null) {\n      if (other.field2 != null)\n        return false;\n    } else\
    \ if (!field2.equals(other.field2))\n      return false;\n    return true;\n \
    \ }\n```\n\nUnless your IDE can be configured to produce clean methods (as discussed\
    \ below) we do not generally recommend this approach. It is easy for bugs to be\
    \ introduced into this code by hand editing over time.\n\n## Hand Roll Clean Methods\n\
    \nJava 7 introduced the `java.util.Objects` class that makes implementing `hashCode`\
    \ trivial. Guava provides the similar `com.google.common.base.Objects` class which\
    \ may be used with earlier versions of Java.\n\n```java\n @Override\n  public\
    \ int hashCode() {\n    return Objects.hash(field1, field2);\n  }\n```\n\nThe\
    \ `Objects` class also simplifies implementing `equals` a little by pushing most\
    \ null checks into the `Objects.equals` method.\n\n```java\n @Override\n  public\
    \ boolean equals(Object obj) {\n    if (this == obj) // <- performance optimisation\n\
    \      return true;\n    if (obj == null)\n      return false;\n    if (getClass()\
    \ != obj.getClass()) // <- see note on inheritance\n      return false;\n    MyClass\
    \ other = (MyClass) obj;\n    return Objects.equals(field1, other.field1) &&\n\
    \        Objects.equals(field2, other.field2);\n  }\n```\n\nThe first `if` statement\
    \ is not logically required and could be safely omitted; it may, however, provide\
    \ performance benefits.\n\nUsually, we would recommend that such micro-optimizations\
    \ are not included unless they have been proven to provide a benefit. In the case\
    \ of `equals` methods, we suggest that the optimization is left in place. It is\
    \ likely to justify itself in at least some of your classes and there is value\
    \ in having all methods follow an identical template.\n\nThe example above uses\
    \ `getClass` to check that objects are of the same type. An alternative is to\
    \ use `instanceof` as follows:\n\n```java\n @Override\n  public boolean equals(Object\
    \ obj) {\n    if (this == obj)\n      return true;\n    if (obj == null)\n   \
    \   return false;\n    if (!(obj instanceof MyClass)) // <- compare with instanceof\n\
    \      return false;\n    MyClass other = (MyClass) obj;\n    return Objects.equals(field1,\
    \ other.field1) &&\n        Objects.equals(field2, other.field2);\n  }\n```\n\n\
    This results in a behavioral difference - comparing instances of `MyClass` with\
    \ its subclasses will return `true` with `instanceof` but `false` with `getClass`.\n\
    \nIn `Effective Java` Josh Bloch argues in favor of `instanceof` as the `getClass`\
    \ implementation violates a strict interpretation of the Liskov substitution principle.\n\
    \nHowever, if `instanceof` is used, it is easy for the symmetric property of the\
    \ `equals` contract to be violated if a subclass overrides `equals`. i.e.:\n\n\
    ```java\nMyClass a = new MyClass();\nExtendsMyClassWithCustomEqual b = new ExtendsMyClassWithCustomEqual();\n\
    \na.equals(b) // true\nb.equals(a) // false, a violation of symmetry\n```\n\n\
    If you find yourself in a situation where you need to consider the nuances of\
    \ whether subclasses are equal to their parents then we strongly suggest you reconsider\
    \ your design.\n\nHaving to think about maintaining the `equals` contract in a\
    \ class hierarchy is painful and you shouldn't need to put yourself, or your team,\
    \ through this for normal server-side coding tasks.\n\nIn the majority of cases,\
    \ if you think it makes sense for your class to implement `hashCode` and `equals`,\
    \ we strongly suggest you make your class `final` so hierarchies do not need to\
    \ be considered.\n\nIf you believe you have a case where it makes sense for subclasses\
    \ to be treated as equivalent to their parent, use `instanceof` but ensure the\
    \ `equals` method is made `final`.\n\n### Commons EqualsBuilder and HashCodeBuilder\n\
    \nApache commons `hashcode` and `equals` builders were once a popular way of generating\
    \ these methods. We do not recommend their use in new code as most of what they\
    \ achieved is now provided by `java.util.Objects` or the Guava equivalent.\n\n\
    These classes do provide the option of a single line reflection implementation:\n\
    \n```java\npublic boolean equals(Object obj) {\n  return EqualsBuilder.reflectionEquals(this,\
    \ obj);\n}\n```\n\n```java\npublic int hashCode() {\n  return HashCodeBuilder.reflectionHashCode(this);\n\
    }\n```\n\nThe brevity of these implementations is attractive, but their performance\
    \ is measurably poorer than others. Good performance tests and regular profiling\
    \ can help determine whether poorly performing method leads to bottlenecks. If\
    \ you are confident that you would detect such impacts then using these methods\
    \ as placeholder implementations may be a reasonable approach. But in general\
    \ we suggest you avoid them.\n\n## Code Generators\n\nA number of projects exist\
    \ that can auto-generate value objects at build-time. Two of the better known\
    \ are:\n\n*   [Google auto](https://github.com/google/auto/tree/master/value)\n\
    *   [Project Lombok](https://projectlombok.org/)\n\nBut many others are available.\n\
    \n#### Google Auto\n\nGoogle *Auto* will create a subclass with the *obvious*\
    \ implementation of an abstract class annotated with `@AutoValue`. This implementation\
    \ will include functioning `hashcode` and `equals` methods.\n\n```java\nimport\
    \ com.google.auto.value.AutoValue;\n\n@AutoValue\nabstract class Animal {\n  static\
    \ Animal create(String name, int numberOfLegs) {\n    return new AutoValue_Animal(name,\
    \ numberOfLegs);\n  }\n\n  Animal() {}\n\n  abstract String name();\n  abstract\
    \ int numberOfLegs();\n}\n```\n\nThis is clearly far less effort than hand crafting\
    \ a complete `Animal` class, but there are some downsides. Some of the issues\
    \ with code generators are discussed in \"Consider Code Generators Carefully\"\
    , which categorized them into *friction* and *surprise*. Here, Google Auto introduces\
    \ some *friction* as the code shown above will not compile within an IDE until\
    \ the generator has run to produce the `AutoValue_Animal` class. There is also\
    \ some *surprise*. Because it is a value, Animal would normally be implemented\
    \ as a `final` class - but we have been forced to make it abstract. The team behind\
    \ *Auto* recommend you add a package-private constructor to prevent other child\
    \ classes being created.\n"
