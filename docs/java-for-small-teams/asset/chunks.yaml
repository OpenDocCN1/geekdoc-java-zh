    \n```\nBoolean b = true;\n```\n\nand\n\n```\nBoolean b = Boolean.valueOf(true);\n\
    ```\n\nAre equivalent.\n\nAs of Java 9 the boxed primitive constructors are deprecated\
    \ in favour of the `valueOf` and parse methods (see below).\n\n## parseXXX\n\n\
    Similar to `valueOf` the `parseXXX` methods convert a string to a primitive, only\
    \ in this case the primitive is not boxed.\n\n```\nfloat f = Float.parseFloat(“1.2”);\n\
    ```\n\nThis does exactly what the method says, and compared to the commonly seen\
    \ alternative:\n\n```\nfloat f = new Float(“1.2”);\n```\n\nIt avoids the construction\
    \ and unboxing of a Float object.\n\nSimilar methods exist for Boolean, Double,\
    \ Integer and the other primitive types.\n\n## isEmpty\n\nA common clumsy idiom\
    \ is to check if a Collection is empty by checking its size:\n\n```\nif ( list.size()\
    \ == 0 ) {\n  // do stuff\n}\n```\n\nThe clearer and more concise:\n\n```\nif\
    \ ( list.isEmpty() ) {\n  // do stuff\n}\n```\n\nMay also be more computationally\
    \ efficient, depending on the data structure it is being called on.\n\nOften there\
    \ is no performance difference, but for a large `ConcurrentLinkedQueue` the difference\
    \ can be significant.\n\n## Java 9 factory methods\n\nJava 9 added static factory\
    \ `of` methods to the List, Set and Map interfaces.\n\nThese allow us to construct\
    \ the collections cleanly e.g.\n\n```\nList.of(1, 2, 3);\nSet.of(42);\n```\n\n\
    The `of` methods are overloaded to up to 10 values.\n\nThe code reads slightly\
    \ better than the Java 8 `Arrays.asList` version and returns a fully structurally\
    \ immutable list that does not allow elements to be replaced. It may also be slightly\
    \ more efficient as it avoids allocating an array.\n\nAlthough `of` is overloaded\
    \ to take no parameters this expressed intent less well than `emptyList` etc which\
    \ may therefore still be preferred.\n\n# Tests\n\n# Good Tests\n\nThe testing\
    \ pyramid and different levels of tests are discussed in \"Agree the language\
    \ you use for tests\".\n\nAs discussed in that section it is important to maintain\
    \ a layered strategy with many fast running unit tests and smaller numbers of\
    \ integration and system tests. The precise proportions that work best will vary\
    \ from project to project but the pyramid formation will hold.\n\nAlthough it\
    \ is important to write tests at all these levels this section mainly concerns\
    \ itself with unit tests as these are the ones we write most of and run most frequently.\n\
    \n# Write Specifications Not Tests\n\n## Write Specifications Not Tests\n\nBefore\
    \ you sit down to write a test it's important to understand *why* you are doing\
    \ it.\n\nWhat is it that you want to achieve?\n\nThere is an unfortunate tendency\
    \ for developers to look at tests as a thing you have to do because it's \"best\
    \ practice\". Some extra work to be performed after the real work is done. A chore.\n\
    \nThe reason for writing them has become lost.\n\n### Why Write Tests?\n\nThe\
    \ reason to write tests is to make our lives easier.\n\nIf we are not writing\
    \ tests that do this we should stop writing them.\n\nA good test should do all\
    \ of the following:\n\n*   Enable refactoring by preventing regression when the\
    \ implementation changes\n\n*   Catch bugs during initial coding\n\n*   Document\
    \ how the code behaves\n\n*   Inform the design of the code\n\nWhen tests are\
    \ viewed as a chore to be completed after the code is written only this first\
    \ point is considered.\n\nOften it is not achieved.\n\nTests written with this\
    \ mindset can have a negative value:\n\n*   Instead of enabling refactoring they\
    \ can increase its cost.\n\n*   Instead of documenting what the code does, the\
    \ tests are harder to understand than the code itself.\n\n*   Instead of aiding\
    \ development they increase the work that must be done\n\nThis first problem causes\
    \ the most pain.\n\nIf you have a test that is tied to the code's implementation,\
    \ to change the way the code is implemented you have to spend effort changing\
    \ the test.\n\nIf the test must change whenever the implementation changes then\
    \ we cannot trust that the test will stop regression. How do we know we did not\
    \ introduce a bug into the test when we changed it?\n\n### Executable Specifications\n\
    \nSo how do we make sure we do not write negative value tests? How do we make\
    \ sure we write tests that provide the benefits in our list?\n\nThe first thing\
    \ to do is let go of the idea that we are testing.\n\nWe are not testing, we're\
    \ *specifying*.\n\nTo test something you only need to verify that it \"does what\
    \ it does\". To specify you need to describe the important things that it must\
    \ do in a way that can be clearly understood.\n\nA good specification describes\
    \ *only* the important things."
