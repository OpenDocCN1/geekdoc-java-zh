    So there is definitely value in writing tests for each of the extracted classes.\
    \ At the same time, if we were not to do so, that would also be a reasonable decision\
    \ and it would reduce the cost of the refactoring.\n\nThe `ThingaMeBob` tests\
    \ will be fast and repeatable and allow us to work easily with the code. If we\
    \ could only have tests at one level, the level we would choose is `ThingaMeBob`.\n\
    \nSo, as a starting point, assume that a *unit* will be a class, but recognize\
    \ that this is not a hard rule.\n\nA *unit* is really a \"single self contained\
    \ logical concern\" - it may make sense to have several classes collaborate in\
    \ order to capture that concern - as long as that collaboration provides a single\
    \ well defined entry point.\n\nMaking units too small may be a form of over-specifying.\n\
    \nMaking units too large may result in tests that are difficult to understand\
    \ and expensive to maintain.\n\nAs a rule of thumb, if you might reasonably have\
    \ made one or more classes inner classes of a different class, perhaps they should\
    \ be treated as a single unit.\n\n# Name Tests With A Specification Style\n\n\
    ## Name Test Cases With a Specification Style\n\nUse the name of each test case\
    \ to describe one (and **only** one) behavior of the unit under test. The name\
    \ should be a proposition - i.e. a statement that could be true or false.\n\n\
    The method name should start with *should*.\n\nThis is superfluous once you get\
    \ good at writing test names, but in a mixed team it is useful as it encourages\
    \ thinking about the test in the right way.\n\nThe rest of the name should describe\
    \ a behavior and, optionally, a scenario (identified by the word When).\n\nFor\
    \ example, we might start to describe `java.util.Stack` with:\n\n*   `shouldBeEmptyWhenCreated`\n\
    \n*   `shouldReturnMostRecentlyAddedItemsFirst`\n\n*   `shouldThrowAnErrorWhenItemsRemovedFromEmptyStack`\n\
    \nContrast this with common naming patterns found in some code bases:\n\n*   `emptyStack`\n\
    \n*   `testEmptyStack`\n\n*   `testPush`\n\nThese names alone tell us nothing\
    \ about how a `Stack` should behave.\n\nIf we omit *should* we can create more\
    \ concise names\n\n*   `isEmptyWhenCreated`\n\n*   `returnsItemsInOrderTheyAreAdded`\n\
    \n*   `throwsAnErrorWhenItemsRemovedFromEmptyStack`\n\nAlthough more verbose the\
    \ formulaic *should* form has an advantage - it provides a clear pattern to follow.\n\
    \nIf a developer knows that a test name must start with *should* (often because\
    \ they have seen this pattern within existing tests) it is hard for them to revert\
    \ to a different style and write a test that is not a proposition.\n\nThe verbosity\
    \ of *should* pays for itself by forcing developers to think about tests in the\
    \ right fashion.\n\nKevlin Henney compares *shoulds* to training wheels on a bike\
    \ - a device to help while we are learning.\n\nSo when should we take the training\
    \ wheels off?\n\nThis depends on the makeup of the team and how often the team\
    \ changes.\n\nIf the majority of people who are likely to work on the codebase\
    \ over its lifetime are accustomed to writing tests in this style then the added\
    \ verbosity is not worth it. If a sufficiently large proportion are not then it\
    \ is probably best for the team to stick with the convention.\n\n### Use the Example\
    \ Style When Specification Style Does Not Work\n\nOccasionally, it is not possible\
    \ to follow the specification naming style because the descriptions become too\
    \ long and unwieldy. If it feels like your method names are becoming overly long\
    \ ask yourself two questions:\n\n1.  Am I really testing only one thing?\n\n2.\
    \  Is my unit doing too much?\n\nIf you're confident the answer is \"no\" to both\
    \ then switch to a different style - example style.\n\nIn example style the name\
    \ describes only the \"When\" part. It does not describe the expected behavior,\
    \ e.g.:\n\n*   `emptyStack`\n\n*   `oneItemAdded`\n\n*   `removalFromEmptyStack`\n\
    \nTo understand tests named with the example style, you must read the code within\
    \ the tests. For this reason, this specification style should be preferred when\
    \ possible.\n\n### Avoid Method Names in Test Descriptions Where Possible\n\n\
    Where possible, avoid including method names in test names.\n\nOn a practical\
    \ level this avoids the extra overhead of updating test names if method names\
    \ are ever refactored.\n\nMore subtly, including names can make you think in the\
    \ wrong fashion - verifying method implementation rather than specifying unit\
    \ behavior.\n\nThis is not a hard rule - sometimes it will be difficult or impossible\
    \ to describe a meaningful behavior without referring to the unit's interface.\n\
    \nThe domain language may also overlap with the method names, so you may find\
    \ yourself using the same **words** as are also used as a method name.\n\n# Pick\
    \ Examples Carefully\n\n## Pick Examples Carefully\n\nTraditional testing is performed\
    \ with examples.\n\nThe overall behavior of the component or unit is explained\
    \ by supplying a series of example input and output values, or example interactions\
    \ with other components.\n\nOur goal is to use examples to\n\n*   Communicate\
    \ the general expected behavior\n\n*   Communicate the behavior at any edge cases\n\
    \n*   Gain confidence that our code is correct and remains correct when we change\
    \ it"
