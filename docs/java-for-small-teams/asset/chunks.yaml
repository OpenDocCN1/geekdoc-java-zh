  trans: "\n例如，著名的基于组合的装饰器模式：\n\n```java\nclass ProcessorUpperCaseDecorator implements\
    \ Processor {\n\n  private final Processor child;\n\n  ProcessorUpperCaseDecorator(Processor\
    \ child) {\n    this.child = child;\n  }\n\n  @Override\n  public void process(String\
    \ someString) {\n    child.process(someString.toUpperCase());\n  }\n\n}\n```\n\
    \n也可以使用继承来实现：\n\n```java\nclass InheritanceUpperCaseDecorator extends ConcreteProcessor\
    \ {\n\n  @Override\n  public void process(String someString) {\n    super.process(someString.toUpperCase());\n\
    \  }\n\n}\n```\n\n但是，同样，这种解决方案的灵活性较低。\n\n使用基于组合的版本，我们可以装饰任何 `Processor`。而使用继承的版本，我们需要为每个想要添加大写行为的具体类型重新实现装饰器。\n\
    \n许多常见的面向对象（OO）模式依赖于组合和接口继承的结合。\n\n## 何时使用实现继承\n\n几乎任何可以通过实现继承实现的功能，也都可以通过接口继承和组合的结合来实现。\n\
    \n那么，什么时候应该使用实现继承呢？\n\n与组合相比，实现继承唯一的优势——它更简洁。\n\n因此，当满足以下**两项**条件时，应该使用实现继承：\n\
    \n1. 存在需要建模的 IS-A（继承）关系\n2. 使用组合方法会导致过多的样板代码\n\n遗憾的是，第二点完全是主观的。\n\n# 保持 性 (Keep\
    \ It Solid)\n\n## 保持 SOLID\n\n### 总结\n\nSOLID 缩写为你应该遵循的设计提供了指导。\n\n* **S**单一职责原则\
    \ (Single Responsibility Principle)\n* **O**开闭原则 (Open Closed Principle)\n* **L**里可替换原则\
    \ (Liskov Substitution Principle)\n* **I**接口隔离原则 (Interface Segregation Principle)\n\
    * **D**依赖倒转原则 (Dependency Inversion Principle)\n\n### 细节\n\n#### 单一职责原则\n\n分离关注点——一个类应该只做一件事。换句话说，一个类应该只有一个改变的原因。\n\
    \n#### 开闭原则\n\n你应该能够扩展行为，而不必修改现有代码。\n\n“……你应该设计永远改变的模块。当需求变化时，你通过添加新代码来扩展此类模块的行为，而不是更改已经运行的老代码。”\n\
    \n—— 罗伯特·马丁 (Robert Martin)\n\n你可能没有遵循这一原则的一个迹象，是代码中存在 `switch` 语句或 `if/else`\
    \ 逻辑。\n\n#### 里可替换原则\n\n派生类必须能够替换它们的基类。\n\n你正在违反这一原则的一个迹象，是代码中存在 `instanceof`\
    \ 语句。\n\n#### 接口隔离原则\n\n接口隔离原则规定，客户端不应被强制实现它们不使用的接口；倾向于使用小型、定制的接口，而不是巨大的全能接口。\n\
    \n你可能违反这一原则的一个迹象，是代码中存在空方法或抛出 `OperationNotSupportedException` 的方法。\n\n#### 依赖倒转原则\n\
    \n高层模块不应该依赖低层模块。两者都应该依赖抽象。\n\n抽象不应该依赖于细节。细节应该依赖抽象。\n\n在实践中，这意味着你应该遵循两种模式之一：\n\n\
    1. 将“高层”组件依赖的接口与该组件打包在一起\n2. 将组件依赖的接口与客户端和实现分开打包\n\n第一种方法是经典的依赖倒转（与高层组件依赖底层的传统方法形成对比）。\n\
    \n第二种方法被称为“分离接口模式”（Separated Interface Pattern）。它稍微笨重一些，但也更灵活，因为它对接口由谁所有不作假设。\n\
    \n你违反这一原则的一个迹象，是代码中存在包循环。\n\n# 保持代码简洁 (Keep Your Code Dry)\n\n## 保持代码 DRY\n\n\
    ### 总结\n\n不要重复自己（DRY - Don't Repeat Yourself）——避免多次编写相同的逻辑。\n\n每当你复制粘贴代码时，就朝自己的眼睛戳一下。这是一个很好的震慑手段，但久久之可能会导致失明。\n\
    \n### 细节\n\n如果需要多次使用相同的逻辑，就不应该重复；而应该将其提取到命名良好的类或方法中。\n\n这样既更容易读也更容易维护，因为如果逻辑需要更改，只需要在一个地方进行更改即可。\n\
    \n*糟糕的写法*\n\n```java\nclass Foo {\n   private int status;\n   private boolean\
    \ approved;\n\n   foo() {\n     if (status == 12 || approved) {\n       doFoo();\n\
    \     }\n   }\n\n   bar() {\n     if (status == 12 || approved) {\n       doBar();\n\
    \     }\n   }\n}\n```\n\n*更好的做法*\n\n```java\nclass Foo {\n   private final static\
    \ int PRE_APPROVED = 12;\n\n   private int status;\n   private boolean approved;\n\
    \n   foo() {\n     if (isApproved()) {\n       doFoo();\n     }\n   }\n\n   bar()\
    \ {\n     if (isApproved()) {\n       doBar();\n     }\n   }\n\n   private isApproved()\
    \ {\n     return status == PRE_APPROVED || approved;\n   }\n}\n```\n\n当我们有相似但并不完全相同的逻辑时，情况会有点复杂。\n\
    \n虽然复制粘贴很快，但我们能做的最糟糕的事情就是复制粘贴。\n\n**极其糟糕**\n\n```java\npublic void doSomething(List<Widget>\
    \ widgets) {\n  for (Widget widget : widgets) {\n    reportExistence(widget);\n\
    \    if (widget.snortles() > 0) {\n      reportDeviance(widget);\n      performSideEffect(widget);\n\
    \    }\n  }\n}\n\npublic void doSomethingSimilar(List<Widget> widgets) {\n  for\
    \ (Widget widget : widgets) {\n    reportExistence(widget);\n    if (widget.snortles()\
    \ > 0) {\n      reportDeviance(widget);\n      performSideEffect(widget);\n  \
    \  }\n  }\n}\n```\n\n这现在看起来很快很简单，但每当我们尝试理解或更改它时，都会浪费时间。\n\n重用代码的一种简单直接但非常有限的方法是引入布尔标志位。\n\
    \n**不太好**\n\n```java\npublic void doSomething(List<Widget> widgets) {\n  doThings(widgets,\
    \ false);\n}\n\npublic void doSomethingSimilar(List<Widget> widgets) {\n  doThings(widgets,\
    \ true);\n}\n\nprivate void doThings(List<Widget> widgets, boolean doSideEffect)\
    \ {\n  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if (widget.snortles()\
    \ > 0) {\n      reportDeviance(widget);\n      if (doSideEffect) {\n        performDifferentSideEffect(widget);\n\
    \      } else {\n        performSideEffect(widget);\n      }\n    }\n  }\n}\n\
    ```\n\n这种写法很丑，并且随着可能性的增加会变得糟糕。\n\n更具扩展性的方法是使用策略模式。\n\n如果我们引入一个接口：\n\n```java\n\
    interface WidgetAction {\n   void apply(Widget widget);\n}\n```\n\n那么我们可以这样使用：\n\
    \n**更好的做法**\n\n```java\npublic void doSomething(List<Widget> widgets) {\n  doThings(widgets,\
    \ performSideEffect());\n}\n\npublic void doSomethingSimilar(List<Widget> widgets)\
    \ {\n  doThings(widgets, performDifferentSideEffect());\n}\n\nprivate WidgetAction\
    \ performSideEffect() {\n  return new WidgetAction() {\n    @Override\n    public\
    \ void apply(Widget widget) {\n      performSideEffect(widget);\n    }\n  };\n\
    }\n\nprivate WidgetAction performDifferentSideEffect() {\n  return new WidgetAction()\
    \ {\n    @Override\n    public void apply(Widget widget) {\n      performDifferentSideEffect(widget);\n\
    \    }\n  };\n}\n\nprivate void doThings(List<Widget> widgets, WidgetAction action\
    \ ) {\n  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if\
    \ (widget.snortles() > 0) {\n      reportDeviance(widget);\n      action.apply(widget);\n\
    \    }\n  }\n}\n```\n\nJava 7 的版本由于匿名内部类的样板代码显得非常繁琐。\n\n"
- fmt: "\nArguably, Boolean flags might be preferable for very simple cases such as\
    \ this but, if we extract the logic in `performSideEffect` and `performDifferentSideEffect`\
    \ methods into top-level classes implementing `WidgetAction`, then the Strategy\
    \ version becomes compelling.\n\nIn Java 8, there is little question that the\
    \ Strategy pattern is preferable in even the simplest of cases.\n\n### Better\
    \ with Java 8\n\n```\npublic void doSomething(List<Widget> widgets) {\n  doThings(widgets,\
    \ widget -> performSideEffect(widget));\n}\n\npublic void doSomethingSimilar(List<Widget>\
    \ widgets) {\n  doThings(widgets, widget -> performDifferentSideEffect(widget));\n\
    }\n\nprivate void doThings(List<Widget> widgets, Consumer<Widget> action ) {\n\
    \  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if (widget.snortles()\
    \ > 0) {\n      reportDeviance(widget);\n      action.accept(widget);\n    }\n\
    \  }\n}\n```\n\nWe do not need to introduce our own interface - the built-in `Consumer<T>`\
    \ is enough. We should consider introducing one if the `doThings` method were\
    \ exposed publicly or if the logic in `performSideEffect` was complex enough to\
    \ pull into a top-level class.\n\nThe loop might also be converted to a pipeline.\n\
    \n### As a pipeline\n\n```\nprivate void doThings(List<Widget> widgets, Consumer<Widget>\
    \ action ) {\n  widgets\n  .stream()\n  .peek(widget -> reportExistence(widget))\n\
    \  .filter(widget -> widget.snortles() > 0)\n  .peek(widget -> reportDeviance(widget))\n\
    \  .forEach(action);\n}\n```\n\n# Prefer Reversible Decisions\n\n### Summary\n\
    \nPrefer design decisions that will be easy to change.\n\n### Details\n\nMany\
    \ of the decisions you make while designing your code will eventually turn out\
    \ to be wrong.\n\nIf you can make your decisions reversible by containing their\
    \ consequences and adding abstractions then this future change will not matter.\n\
    \nFor example - if you introduce a third party library and reference it throughout\
    \ your code, then you have made high the cost of reversing the decision to use\
    \ that library. If you constrain it to a single location and create an interface\
    \ for it, the cost of reversing the decision is low.\n\nBut don't forget KISS\
    \ and YAGNI - if your abstractions complicate the design then it is better to\
    \ leave them out.\n\n# Make Dependencies Explicit\n\n### Make Dependencies Explicit\
    \ and Visible\n\n### Summary\n\nMake sure that the dependencies of a class are\
    \ clearly visible.\n\nAlways inject dependencies into a class using its constructor.\
    \ Do not use other methods such as setters or annotations on fields.\n\nNever\
    \ introduce dependencies using hidden routes such as `Singletons` or `ThreadLocals`.\n\
    \n### Details\n\nCode is easier to understand if the interfaces and classes that\
    \ each object depends on are conspicuous and visible.\n\nThe most visible dependencies\
    \ are the ones that are injected into a method as a parameter.\n\nLess visible\
    \ are the ones stored as fields but, depending on how those fields are populated,\
    \ the dependencies can still be relatively easy to discover.\n\n#### Constructor\
    \ Injection\n\nConstructor dependency injection clearly communicates an object's\
    \ dependencies in a single location and ensures objects are only ever created\
    \ in valid states. It allows fields to be made `final` so that their life cycle\
    \ is unambiguous.\n\nThis is the only way in which dependencies should be injected.\n\
    \n#### Setter Injection\n\nSetter injection increases the number of possible states\
    \ an object could be in. Many of those states will be invalid.\n\nIf setter injection\
    \ is used, a class can be constructed in a half-initialized state. What constitutes\
    \ a fully-initialized state can only be determined by examining the code.\n\n\
    **Bad**\n\n```\npublic class Foo() {\n  private Bar bar;\n\n  public void doStuff()\
    \ {\n    bar.doBarThings();\n  }\n\n  public void setBar(Bar bar) {\n    this.bar\
    \ = bar;\n  }\n}\n```\n\nHere, a `NullPointerException` will be thrown if `Foo`\
    \ is constructed without calling `setBar`.\n\n**Better**\n\n```java\npublic class\
    \ Foo() {\n  private final Bar bar;\n\n  public Foo(Bar bar) {\n    this.bar =\
    \ bar;\n  }\n\n  public void doStuff() {\n    bar.doBarThings();\n  }\n}\n```\n\
    \nHere, it is clear that we must supply a `Bar` as we are unable to construct\
    \ the class without it.\n\n#### Field Annotations\n\nWhile annotations on fields\
    \ seem convenient they mean that the dependency will not be visible in the public\
    \ API. They also tie construction of your class to the frameworks that understand\
    \ them and prevent fields from being made `final`.\n\nField annotations should\
    \ not be used.\n\nIf you are working with a dependency injection framework such\
    \ as `Spring`, either move construction of your objects into configuration classes\
    \ or restrict the use on annotations to constructors. Both methods allow your\
    \ classes to be constructed normally and ensure that all dependencies are visible.\n\
    \n#### Hidden Dependencies\n\nAnything that is not injected into a class using\
    \ a constructor or as a method parameter is a hidden dependency.\n\nThese are\
    \ evil.\n\nThey are pulled in from `Singletons`, `ThreadLocals`, static method\
    \ calls or by simply calling `new`.\n\n**Bad**\n\n```\npublic class HiddenDependencies\
    \ {\n  public void doThings() {\n    Connection connection = Database.getInstance().getConnection();\n\
    \    // do things with connection\n    ....\n  }\n}\n```\n\nHere we must ensure\
    \ that the `Database` class is in a valid state before calling the `doThings`\
    \ method of the code below, but we have no way of knowing this without looking\
    \ through every line of code.\n\n**Better**\n\n```java\npublic class HiddenDependencies\
    \ {\n  private final Database database;\n\n  public HiddenDependencies(Database\
    \ database) {\n    this.database = database;\n  }\n\n  public void doThings()\
    \ {\n    Connection connection = database.getConnection();\n    // do things with\
    \ connection\n    ....\n  }\n}\n```\n\nInjecting via the constructor makes the\
    \ dependency clearly visible.\n\nBy definition, hidden dependencies are hard to\
    \ discover but they have a second issue - they are also hard to replace.\n\n####\
    \ Seams\n\nSeams are a concept introduced by Michael Feathers in \"Working Effectively\
    \ with legacy code\"\n\nHe defines it as:\n\n> \"a place where you can alter behavior\
    \ in your program without editing in that place.\"\n\nIn the original version\
    \ of `HiddenDependencies` if we wanted to replace `Database` with a mock or stub\
    \ we could only do so if the singleton provided some method to modify the instance\
    \ it returns.\n\n**Not a good approach**\n\n```\npublic class Database implements\
    \ IDatabase {\n  private static IDatabase instance = new Database();\n\n  public\
    \ static IDatabase getInstance() {\n    return instance;\n  }\n\n  public static\
    \ void setInstanceForTesting(IDatabase database) {\n    instance = database;\n\
    \  }\n\n}\n```\n\nThis approach introduces a seam but does not address our concerns\
    \ around visibility. The dependency remains hidden.\n\nIf we used this approach,\
    \ our codebase would remain hard to understand and we would find ourselves constantly\
    \ fighting test order dependencies.\n\nWith constructor injection, we gain a seam\
    \ and make the dependency visible. Even if `Database` is a singleton, we are still\
    \ able to isolate our code from it for testing.\n\n# Prefer Immutable Objects\n\
    \n### Summary\n\nWhere possible, create objects that cannot be changed - especially\
    \ if those objects will be long-lived or globally accessible.\n\n### Details\n\
    \nMutable state makes programs harder to understand and maintain.\n\nWhen objects\
    \ are short-lived, and not leave method scope, mutable state causes few problems.\
    \ Writes and reads will be close together and there will be a clear order in which\
    \ this happens.\n\nFor longer-lived objects, things are more complex.\n\nIf an\
    \ object escapes from a method then it may be accessed from more than one location\
    \ within the code.\n\nWe must start by assuming that anything that can happen\
    \ to these objects will. We can only confirm that certain situations do not occur\
    \ by examining the whole program.\n"
  raw: "Arguably, Boolean flags might be preferable for very simple cases such as\
    \ this but, if we extract the logic in `performSideEffect` and `performDifferentSideEffect`\
    \ methods into top-level classes implementing `WidgetAction`, then the Strategy\
    \ version becomes compelling.\n\nIn Java 8, there is little question that the\
    \ Strategy pattern is preferable in even the simplest of cases.\n\n**Better with\
    \ Java 8**\n\n```\npublic void doSomething(List<Widget> widgets) {\n  doThings(widgets,\
    \ widget -> performSideEffect(widget));\n}\n\npublic void doSomethingSimilar(List<Widget>\
    \ widgets) {\n  doThings(widgets, widget -> performDifferentSideEffect(widget));\n\
    }\n\nprivate void doThings(List<Widget> widgets, Consumer<Widget> action ) {\n\
    \  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if (widget.snortles()\
    \ > 0) {\n      reportDeviance(widget);\n      action.accept(widget);\n    }\n\
    \  }\n}\n```\n\nWe do not need to introduce our own interface - the built-in `Consumer<T>`\
    \ is enough. We should consider introducing one if the `doThings` method were\
    \ exposed publicly or if the logic in `performSideEffect` was complex enough to\
    \ pull into a top-level class.\n\nThe loop might also be converted to a pipeline.\n\
    \n**As a pipeline**\n\n```\nprivate void doThings(List<Widget> widgets, Consumer<Widget>\
    \ action ) {\n  widgets\n  .stream()\n  .peek(widget -> reportExistence(widget))\n\
    \  .filter(widget -> widget.snortles() > 0)\n  .peek(widget -> reportDeviance(widget))\n\
    \  .forEach(action);\n}\n```\n\n# Prefer Reversible Decisions\n\n## Prefer Reversible\
    \ Decisions\n\n### Summary\n\nPrefer design decisions that will be easy to change.\n\
    \n### Details\n\nMany of the decisions you make while designing your code will\
    \ eventually turn out to be wrong.\n\nIf you can make your decisions reversible\
    \ by containing their consequences and adding abstractions then this future change\
    \ will not matter.\n\nFor example - if you introduce a third party library and\
    \ reference it throughout your code, then you have made high the cost of reversing\
    \ the decision to use that library. If you constrain it to a single location and\
    \ create an interface for it, the cost of reversing the decision is low.\n\nBut\
    \ don't forget KISS and YAGNI - if your abstractions complicate the design then\
    \ it is better to leave them out.\n\n# Make Dependencies Explicit\n\n## Make Dependencies\
    \ Explicit and Visible\n\n### Summary\n\nMake sure that the dependencies of a\
    \ class are clearly visible.\n\nAlways inject dependencies into a class using\
    \ its constructor. Do not use other methods such as setters or annotations on\
    \ fields.\n\nNever introduce dependencies using hidden routes such as `Singletons`\
    \ or `ThreadLocals`.\n\n### Details\n\nCode is easier to understand if the interfaces\
    \ and classes that each object depends on are conspicuous and visible.\n\nThe\
    \ most visible dependencies are the ones that are injected into a method as a\
    \ parameter.\n\nLess visible are the ones stored as fields but, depending on how\
    \ those fields are populated, the dependencies can still be relatively easy to\
    \ discover.\n\n#### Constructor Injection\n\nConstructor dependency injection\
    \ clearly communicates an object's dependencies in a single location and ensures\
    \ objects are only ever created in valid states. It allows fields to be made **final**\
    \ so that their life cycle is unambiguous.\n\nThis is the only way in which dependencies\
    \ should be injected.\n\n#### Setter Injection\n\nSetter injection increases the\
    \ number of possible states an object could be in. Many of those states will be\
    \ invalid.\n\nIf setter injection is used, a class can be constructed in a half-initialized\
    \ state. What constitutes a fully-initialized state can only be determined by\
    \ examining the code.\n\n**Bad**\n\n```\npublic class Foo() {\n  private Bar bar;\n\
    \n  public void doStuff() {\n    bar.doBarThings();\n  }\n\n  public void setBar(Bar\
    \ bar) {\n    this.bar = bar;\n  }\n}\n```\n\nHere, a `NullPointerException` will\
    \ be thrown if `Foo` is constructed without calling `setBar`.\n\n**Better**\n\n\
    ```\npublic class Foo() {\n  private final Bar bar;\n\n  public Foo(Bar bar) {\n\
    \    this.bar = bar;\n  }\n\n  public void doStuff() {\n    bar.doBarThings();\n\
    \  }\n}\n```\n\nHere, it is clear that we must supply a `Bar` as we are unable\
    \ to construct the class without it.\n\n#### Field Annotations\n\nWhile annotations\
    \ on fields seem convenient they mean that the dependency will not be visible\
    \ in the public API. They also tie construction of your class to the frameworks\
    \ that understand them and prevent fields from being made final.\n\nField annotations\
    \ should not be used.\n\nIf you are working with a dependency injection framework\
    \ such as Spring, either move construction of your objects into configuration\
    \ classes or restrict the use on annotations to constructors. Both methods allow\
    \ your classes to be constructed normally and ensure that all dependencies are\
    \ visible.\n\n#### Hidden Dependencies\n\nAnything that is not injected into a\
    \ class using a constructor or as a method parameter is a hidden dependency.\n\
    \nThese are evil.\n\nThey are pulled in from `Singletons`, `ThreadLocals`, static\
    \ method calls or by simply calling `new`.\n\n**Bad**\n\n```\npublic class HiddenDependencies\
    \ {\n  public void doThings() {\n    Connection connection = Database.getInstance().getConnection();\n\
    \    // do things with connection\n    ....\n  }\n}\n```\n\nHere we must ensure\
    \ that the `Database` class is in a valid state before calling the `doThings`\
    \ method of the code below, but we have no way of knowing this without looking\
    \ through every line of code.\n\n**Better**\n\n```\npublic class HiddenDependencies\
    \ {\n  private final Database database;\n\n  public HiddenDependencies(Database\
    \ database) {\n    this.database = database;\n  }\n\n  public void doThings()\
    \ {\n    Connection connection = database.getConnection();\n    // do things with\
    \ connection\n    ....\n  }\n}\n```\n\nInjecting via the constructor makes the\
    \ dependency clearly visible.\n\nBy definition, hidden dependencies are hard to\
    \ discover but they have a second issue - they are also hard to replace.\n\n####\
    \ Seams\n\nSeams are a concept introduced by Michael Feathers in \"Working Effectively\
    \ with legacy code\"\n\nHe defines it as:\n\n> \"a place where you can alter behavior\
    \ in your program without editing in that place.\"\n\nIn the original version\
    \ of `HiddenDependencies` if we wanted to replace `Database` with a mock or stub\
    \ we could only do so if the singleton provided some method to modify the instance\
    \ it returns.\n\n**Not a good approach**\n\n```\npublic class Database implements\
    \ IDatabase {\n  private static IDatabase instance = new Database();\n\n  public\
    \ static IDatabase getInstance() {\n    return instance;\n  }\n\n  public static\
    \ void setInstanceForTesting(IDatabase database) {\n    instance = database;\n\
    \  }\n\n}\n```\n\nThis approach introduces a seam but does not address our concerns\
    \ around visibility. The dependency remains hidden.\n\nIf we used this approach,\
    \ our codebase would remain hard to understand and we would find ourselves constantly\
    \ fighting test order dependencies.\n\nWith constructor injection, we gain a seam\
    \ and make the dependency visible. Even if `Database` is a singleton, we are still\
    \ able to isolate our code from it for testing.\n\n# Prefer Immutable Objects\n\
    \n## Prefer Immutable Objects\n\n### Summary\n\nWhere possible, create objects\
    \ that cannot be changed - especially if those objects will be long-lived or globally\
    \ accessible.\n\n### Details\n\nMutable state makes programs harder to understand\
    \ and maintain.\n\nWhen objects are short-lived, and do not leave method scope,\
    \ mutable state causes few problems. Writes and reads will be close together and\
    \ there will be a clear order in which this happens.\n\nFor longer-lived objects,\
    \ things are more complex.\n\nIf an object escapes from a method then it may be\
    \ accessed from more than one location within the code.\n\nWe must start by assuming\
    \ that anything that can happen to these objects will. We can only confirm that\
    \ certain situations do not occur by examining the whole program."
