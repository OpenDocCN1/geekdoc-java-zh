    \     ArrayDeque<String> testee = new ArrayDeque<String>();\n\n     testee.add(\"\
    foo\");\n     testee.add(\"bar\");\n\n     assertEquals(\"foo\",testee.pop());\n\
    \     assertEquals(\"bar\",testee.pop());\n  }\n```\n\nThis test tests only one\
    \ concern, but uses multiple asserts to do so.\n\n### Test Each Thing Only Once\n\
    \nOnce you've tested a concern, don't let it leak into other tests - if you do\
    \ then those tests are no longer testing only one thing.\n\nThis is a particularly\
    \ easy mistake to make with interaction-based testing. If it is vitally important\
    \ that the method `anImportantSideEffect` is called, it is easy to find yourself\
    \ verifying that method in each test case.\n\nIf the contract ever changes so\
    \ that this side effect is not longer important, all tests will need to be updated.\n\
    \nThis concern should instead by covered by a single test case `shouldPerformImportantSideEffect`.\n\
    \nAlthough we shouldn't let a property leak into test cases where it does not\
    \ belong this does not necessarily mean that it will be confined to a single test\
    \ case. It may take several examples to fully demonstrate a property.\n\n# Make\
    \ Tests Easy To Understand\n\n## Make Tests Easy to Understand\n\nOne of our goals\
    \ when writing a test is to document what the code under tests does.\n\nWe achieve\
    \ this in part by choosing clear specification style names for each test case,\
    \ but we must also ensure that the code implementing each test case is easy to\
    \ understand.\n\nSome techniques that help achieve this are discussed below.\n\
    \n### Make Test Structure Clear\n\nA test can be viewed as having three parts:\n\
    \n*   Given - create the values and objects required for the test\n\n*   When\
    \ - executes the code under test\n\n*   Then - verifies the output/behavior is\
    \ as expected\n\nThese stages are also sometimes called *arrange*, *act* and *assert*\
    \ by people particularly attached to the letter 'a'.\n\nAlthough it is important\
    \ that these three stages are visible, trying to rigorously separate them or label\
    \ them with comments adds noise to a test.\n\n**Bad**\n\n```\n @Test\n  public\
    \ void shouldRetrieveValuesInOrderTheyAreAdded() {\n\n    // given\n    Stack<String>\
    \ testee = new Stack<String>();\n    String expectedFirstValue = \"a\";\n    String\
    \ expectedSecondValue = \"b\";\n\n    // when\n    testee.push(expectedFirstValue);\n\
    \    testee.push(expectedSecondValue);\n    String actualFirstValue = testee.pop();\n\
    \    String actualSecondValue = testee.pop();\n\n    // then\n    assertThat(actualFirstValue).isEqualTo(secondValue);\n\
    \    assertThat(actualSecondValue).isEqualTo(firstValue);\n  }\n```\n\n**Better**\n\
    \n```\n @Test\n  public void shouldRetrieveValuesInOrderTheyAreAdded() {\n   \
    \ Stack<String> testee = new Stack<String>();\n    testee.push(\"a\");\n    testee.push(\"\
    b\");\n    assertThat(testee.pop()).isEqualTo(\"b\");\n    assertThat(testee.pop()).isEqualTo(\"\
    a\");\n  }\n```\n\n### Follow Standard TEA Naming Convention for Test Variables\n\
    \nEstablishing simple conventions can make some very basic things about a test\
    \ clear to a reader.\n\nIf the unit you are testing is a class make this clear\
    \ by always naming it `testee` within a test.\n\nIf you need to store an expected\
    \ value in a variable, call it `expected` (but don't store it in a variable just\
    \ for the sake of it).\n\nIf you need to store a result that you will compare\
    \ against an expected value in variable, name it `actual` (but don't store it\
    \ in a variable just for the sake of it).\n\nIf you have stubbed a participant\
    \ consider naming it `stubbedFoo`, if it is acting as a mock name it `mockedFoo`.\
    \ This rule is less hard than the others - decide on a case by case basis whether\
    \ you think it makes your test more or less readable.\n\n### Highlight What is\
    \ Important, Hide What is Not\n\nIt should be possible to read each test case\
    \ at a glance - so make things clear by highlighting what is important for that\
    \ test case and hiding what is not.\n\nIf an aspect of the input is important\
    \ to the test case, highlight it by setting it **explicitly** in the test case\
    \ - don't rely on that value being set in a generic setup method.\n\nEven if the\
    \ same value is set by default, it is better to re-supply it in the test so it\
    \ is clearly visible.\n\nIf a particular value is not important, indicate this\
    \ to the reader by using well-known neutral values such as `\"foo\"` for strings,\
    \ or use clear names such as `someInt` or `anInt` for variables and methods that\
    \ supply values.\n\nSupplying values via a method call makes them less visible.\n\
    \nWhat is important in the test below?\n\n**Bad**\n\n```\n @Test\n  public void\
    \ shouldXXX() {\n    MyClass testee = new MyClass();\n    assertThat(testee.process(0,\
    \ \"\", 3))\n      .isEqualTo(Status.FAIL);\n  }\n```\n\nHow about this version?\n\
    \n**Better**\n\n```\n @Test\n  public void shouldXXX() {\n    int invalidValue\
    \ = 3;\n    MyClass testee = new MyClass();\n    assertThat(testee.process(anInt(),\
    \ aString(), invalidValue))\n      .isEqualTo(Status.FAIL);\n  }\n```\n\nWhile\
    \ we need additional context to understand why `3` is an invalid value, it should\
    \ be clear that the first two parameters to the `process` method are not important\
    \ to the behavior we are specifying.\n\nWhy is it important that the testee below\
    \ returns the enum `CONTINUE`?\n\n**Bad**"
