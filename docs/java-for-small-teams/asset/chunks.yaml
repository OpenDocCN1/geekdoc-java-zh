    \n# Introduction\n\n## What is This?\nThis book is an attempt to capture what\
    \ `good` code looks like and the practices that help produce it. This is a problematic\
    \ document to write. There is no right answer to what good code looks like and\
    \ there are many well-respected books that serve the same purpose such as `Effective\
    \ Java`, `Clean Code`.\n\nSo why this document? It differentiates itself by being:\n\
    - Freely distributable\n- Open for update - contributions and updates are encouraged\n\
    - Brief - much is left out in an attempt to be digestible\n- Narrow - it captures\
    \ one opinion of `good` appropriate for a specific context\n\nThis last point\
    \ is important. We assume a number of things about you and the environment you\
    \ are working in:\n- We assume you are writing server side Java in `small teams`.\n\
    - We assume your teams are of mixed experience (some experts, some beginners).\n\
    - We assume you are writing code in a general \"business\" context.\n- We assume\
    \ you expect the code to still be in use in years' time.\n\nSome of the suggestions\
    \ may be valid in other contexts, others might constitute terrible advice for\
    \ those contexts. It is also just one opinion from many valid alternatives. To\
    \ be useful it needs to be an opinion that you can agree with and sign up to.\
    \ If you disagree with something in this book please make your thoughts known\
    \ so it can be improved. Finally, not all the code we work on is perfect. Sometimes\
    \ we inherit our own mistakes, sometimes we inherit other people's. The point\
    \ of this document is not to say that all code must look like this but to have\
    \ an agreed destination that we are aiming for.\n\n## Who is This For?\nThis document\
    \ is intended for consumption by anyone involved with writing side Java code.\
    \ From developers writing Java for the first time through to seasoned technical\
    \ leads serving multiple teams. Some sections will be more relevant to some audiences\
    \ than others but we encourage everyone to at least skim all sections even if\
    \ you do not read them in depth.\n\n## Structure\nThe document is split into five\
    \ sections:\n- Process - Discussion on development philosophy and workflow\n-\
    \ Style - Good style and design at a high level\n- Specifics - More specific advice\
    \ on Java language features and gotchas\n- Tests - How to write good tests\n-\
    \ Bad advice - Discussion of some commonly circulated bad advice and patterns\n\
    \n## Version\nThis book is updated often. The latest changes to the book can be\
    \ viewed online at [`gitbook.com`](https://ncrcoe.gitbooks.io/java-for-small-teams/content/).\
    \ Versioned releases are available for free from [the book's website`](http://javabook.ncredinburgh.com).\
    \ If you are reading a PDF or print copy of this book the release version will\
    \ be displayed on the inside cover. If there is no inside cover then you are reading\
    \ an unreleased version of the book.\n\n## History\nMost of the content of this\
    \ book began life as internal wiki pages at [`NCR Edinburgh`](http://ncredinburgh.com).\
    \ We started to convert the wiki into this book at the end of 2015 so that it\
    \ could be easily shared with other parts of our company. Rather than keep this\
    \ as an internal document we decided to open it up to everyone in the hope that\
    \ together we could make it better.\n\n## A word on Trade-offs\nThere are no right\
    \ answers in software engineering. It is a balancing act in which we must trade\
    \ off one concern against another and make a judgement call about which balance\
    \ is better for the specific scenario we have found ourselves in.\n"
