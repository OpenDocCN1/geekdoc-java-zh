  raw: 'One of the most common mistakes we''ve seen experienced programmers make is
    to blindly consider only one or two concerns (often the ones with catchy acronyms)
    without thought for others.


    We''ve carefully set out the context in which we think the advice in this book
    will be useful, but the context is still very broad. Slightly different situations
    might benefit from very different trade offs. What worked well for you in one
    project might not work so well in the next.


    For this reason we rarely use words like *always* or *never*.


    When we do use them we have thought carefully before doing so, but what we really
    mean is almost-always or almost-never.


    Having said this if you find yourself discounting any of the recommendations in
    this book please stop and think first. Don''t fall into the trap of thinking certain
    advice cannot apply to you. We often make our worst mistakes when we believe we
    are being elegant or clever. The full horror of our ineptitude sometimes does
    not become apparent for months or years.


    Advice is here to save us from ourselves.


    ## A note on Java Versions


    This document is intended to apply to Java 7, 8 and 9 but will be largely applicable
    to Java 5 and 6.


    Where there are differences between recent Java versions we will point them out.
    If you are unlucky enough to be working with an early version of Java you will
    have to discover any differences to Java 7 on your own.


