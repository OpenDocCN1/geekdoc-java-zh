  trans: "\n我们建议尽量少使用第一种类型，或者根本不使用。这在“如何实现 Hashcode 和 Equals”中会有进一步的讨论。\n\n从模型（如 schema\
    \ 或语法法）生成代码是一种很有用的方法，只要是生成的代码不被修改并且被单独打包。如果将生成的代码和未生成的代码打包在同一个模块中，那么可能会开始产生**摩擦力**（见下文）。\n\
    \n### 编译时注解处理器\n\nJSR 269 引入了一个在构建时处理注解的标准框架。现在有多个工具使用 JSR 269 来生成代码。\n\n大多数工具纯粹将带注解的类作为输入，并此生成新类。通常，新类会扩展或实现被注解的类或接口，但保持独立。这些工具本质上只是基于模型的样板代码生成器的子集，其中模型输入模型是带注解的\
    \ Java 类。\n\n有些工具（如项目 Lombok）会更新带注解的类本身，添加额外的行为。这可能会增加**意外性**和**摩擦力**，我们在下文中讨论了这些问题。\n\
    \n### 缺点\n\n代码生成器显然有很多优点，那么为什么它们不是总是合理的呢？\n\n它们引起的主要问题是`意外性`和`摩擦力`。\n\n#### 意外性\n\
    \n如果你在编译或运行时生成代码，你就不再是在用 Java 编程了。\n\n你是在用一种增强后的 Java 编程，它执行一些维护代码的开发者可能并不知道的事情。\n\
    \n它可能会执行他们意想不到的事情。\n\n它可能会破坏程序员对代码内部可以发生或不能发生什么的根本性假设。\n\n运行时生成器通常会比编译时系统产生更多意外性——它们添加了打破通常\
    \ Java 规则的 `magic`（魔法）元素。运行时生成器通常还会削弱类型安全，将开发者通常预期在编译时发生的问题类别转移到运行时。\n\n当开发者第一次在项目中遇到代码生成器时，它所做的一切都会令他们感到惊讶。\n\
    \n经过一段时间的学习，大部分的意外性应该会消失，但每位开发者都需要经历这个学习阶段。其中涉及的学习成本可能是巨大的——例如，完全理解像 `Spring`\
    \ 这样的框架就需要巨大的努力。\n\n最令人担心的问题是，在初始学习结束后仍然存在某些意外性。\n\n当系统发生意料之外的情况时，你发现自己在问“这会不会是因为代码生成器的原因？”，并且每次都不得不消除这种可能性，那么你就为项目引入了非常真实的成本。\n\
    \n#### 摩擦力\n\n使用编译时生成器的代码在 IDE 中无法整洁地导入，除非 IDE 了解如何运行该生成器。即使系统有 IDE 的支持，也可能需要安装插件、设置配置选项等。\n\
    \n摩擦力的程度以及遇到的频率将取决于 IDE 以及支持的质量。摩擦力可能很小，且只在新开发者加入项目时遇到。或者摩擦力可能非常显著，并且每次清理代码（clean）时都会触发。\n\
    \n减少摩擦力最有效的方法是将生成的代码与依赖它的代码分开打包。生成的代码随之变成了一个正常的二进制依赖，而其自动化的事实就就变成了一个内部实现细节。\n\n\
    虽然这种方法有效，但它可能也有缺点。它可能会创建人工模块。如果代码不是自动生成的，将其打包为单独的模块是否有意义呢？\n\n运行时生成器通常不会引入太多摩擦力，尽管有时在\
    \ IDE 中运行测试时，如果没有 `javaagents` 可能会遇到问题。\n\n### 权衡\n\n以上就是这些问题。\n\n与免费获得功能的承诺相比，`意外性`和`摩擦力`听起来是微不足道的顾虑，但它们的影响可能是重大的。\n\
    \n引入代码生成器是否有意义，通常取决于它被使用的程度。如果有大量功能可以自动生成，那么它可能是有的；如果数量相对较少，最好坚持使用原生 Java。\n\n\
    # 为可读性进行优化\n\n## 优化可读性而非性能\n\n### 总结\n\n不要过早地优化你的代码。\n\n相反，专注于让代码变得简单且易懂。\n\n\
    ### 细节\n\n许多新程序员担心他们编写的每个方法的性能，避免编写他们认为效率下的代码，并采用一种试图减少对象分配、方法调用、赋值或其他他们认为会有成本的因素的风格。\n\
    \n尽管这通常会降低可读性并增加复杂度，但大多数微型性能优化完全没有提供性能增益。\n\n在我们工作的背景下，性能应该是最后考虑的关注点之一。相反，应该关注让代码尽可能简单和易读。\n\
    \n如果出现性能问题，应该使用性能分析工具（profiling）来确定问题真正的所在。\n\n这并不意味着应该完全忽略性能，但它应该始终让位于代码的可读性和简单性，直到证明优化有真实的益处。如果代码可以用更高效的方式编写，而不会增加`任何`复杂度或牺牲可读性，那么应该优先选择（假设的）更高效的代码。\n\
    \n# 优先使用可读代码而非注释\n\n## 优先使用可读代码而非注释\n\n### 总结\n\n仅使用注释来解释代码本身无法解释的内容。\n\n当你正要写注释时，先想想是否有办法更改代码，使其在没有注释的情况下也能被理解。\n\
    \n### 细节\n\n出自 Robert C. Martin 的《整洁代码》。\n\n“没有什么比一个位置恰当的注释更有帮助了。没有什么比轻率的、教条式的注释更能让模块变得混乱。没有什么比一个陈旧、破旧的传播谎言和虚信息的注释更具破坏性了。”\n\
    \n注释应该仅用于解释无法通过重构来自我解释的代码背后的意图。\n\n*糟糕*\n\n```\n// 检查员工是否符合全额福利条件\nif ((employee.flags\
    \ & HOURLY_FLAG) &&(employee.age > 65))\n```\n\n*更好*\n\n```java\nif (employee.isEligibleForFullBenefits())\n\
    ```\n\n注释只有在解释代码无法解释的内容时才是有用的。\n\n这意味着你写的任何注释应该提供“为什么”，而不是“是什么”或“如何做”。\n\n*糟糕*\n\
    \n```\n// 确保端口大于或等于 1024\nif (port < 1024) {\n  throw new InvalidPortError(port);\n\
    }\n```\n\n*更好*\n\n```java\n// 1024 以下的端口（特权端口或已知端口）\n// 我们没有 root 权限\nif (port\
    \ < 1024) {\n  throw new InvalidPortError(port);\n}\n```\n\n*更好*\n\n```java\n\
    if (requiresRootPrivileges(port)) {\n  throw new InvalidPortError(port);\n}\n\n\
    private boolean requiresRootPrivileges(int port) {\n  // 1024 以下的端口（特权端口或已知端口）\n\
    \  // 在 Unix 系统上需要 root 权限\n  return port < 1024;\n}\n```\n\n在这里，功能意图已经包含在方法名中，注释仅被用于提供一些逻辑合理的背景信息。\n\
    \n这个魔数字也可以被替换为常量。\n\n```java\nfinal static const HIGHEST_PRIVILEDGED_PORT = 1023;\n\
    \nprivate boolean requiresRootPrivileges(int port) {\n  // 特权端口或“已知端口”\n  // 在\
    \ Unix 系统上需要 root 权限\n  return port <= HIGHEST_PRIVILEDGED_PORT;\n}\n```\n\n在这种情况下，注释可以说仍然具有价值——至少，它为不熟悉该主题的读者提供了两个可以在网上搜索的关键词短语。\n\
    \n# 谨慎使用 Javadoc\n\n### 总结\n"
- fmt: "\nJavadoc can help document code but often there are better ways to do so.\
    \ Think carefully before deciding to write it.\n\n## Javadoc Details\n\n### Javadoc\
    \ is Good\nJavadoc is invaluable for external teams that must consume your code\
    \ without access to the source.\n\nAll externally consumed code should have javadoc\
    \ for its public methods.\n\nEnsure that all such javadoc concentrates on *what*\
    \ a method does, not *how* it does it.\n\n### Javadoc is Bad\nJavadoc duplicates\
    \ information that ought to be clear from the code itself and carries a constant\
    \ maintenance cost.\n\nIf it is not updated in tandem with the code then it becomes\
    \ misleading.\n\nDo not Javadoc code that will be consumed and maintained only\
    \ by your immediate team. Instead spend effort ensuring that the code speaks for\
    \ itself.\n\n# Remember Kiss And Yagni\n\n## Remember KISS and YAGNI\n\n### Summary\n\
    Keep your design as simple as possible.\n\nCreate only the functionality you need\
    \ now - not what you think you might need in the future.\n\n### Details\nThe KISS\
    \ (Keep It Simple, Stupid) and YAGNI (You Ain't Going To Need It) acronyms provide\
    \ good advice that is worth remembering while coding.\n\nKISS advises that we\
    \ keep our code and designs as simple as possible.\n\nFew people would disagree\
    \ with this, but unfortunately it is not always obvious what *simple* means.\n\
    \nGiven two solutions to a problem which one is simpler?\n\n* The one with the\
    \ least lines of code?\n* The one with the least number of classes?\n* The one\
    \ that uses fewer third party dependencies?\n* The one with fewer branch statements?\n\
    * The one where the logic is most explicit?\n* The one which is consistent with\
    \ a solution used elsewhere?\n\nAll of the above are reasonable definitions of\
    \ *simple*. None of them is the single definition always makes sense to follow.\n\
    \nRecognizing simple isn't easy and keeping things simple takes a lot of work.\n\
    \nIf we could somehow measure the complexity of our software, we would find that\
    \ there is some minimum value that each piece of software must contain.\n\nIf\
    \ the software were any simpler, then it would be less functional.\n\nReal programs\
    \ will always contain this *inherent complexity* plus a bit. This extra complexity\
    \ is the *accidental complexity* we have added because we are less than perfect.\n\
    \nTelling accidental complexity apart from inherent complexity is of course also\
    \ hard.\n\nFortunately YAGNI gives us some useful advice on how to keep things\
    \ simple without having to tell accidental and inherent complexity apart.\n\n\
    The more a system does, the higher its overall complexity will be. If we make\
    \ a system that does less, it will be simpler - it will have less *inherent complexity*\
    \ and less *accidental complexity*\n\nYour goal is, therefore, to create the minimum\
    \ amount of functionality that solves the problems you have right **now**.\n\n\
    * Don't implement things because you think you might need them later. Implement\
    \ in the future if you need it.\n* Don't try and make things \"flexible\" or \"\
    configurable\". Make them do just what they need to do - parameterize them at\
    \ the point you have a need to do so.\n\nIf you create more than the minimum amount\
    \ of functionality, you will have more code to debug, understand and maintain\
    \ from that point forward until someone has the confidence to delete it.\n\n#\
    \ Prefer Composition\n\n## Prefer Composition to Inheritance\n\n### Summary\n\
    Composition usually results in more flexible designs.\n\nFirst consider using\
    \ composition, then fall back to using inheritance only when composition does\
    \ not seem to be a good fit.\n\n### Details\nComposition means building things\
    \ by adding other things together. Inheritance is building things by extending\
    \ behavior based on an existing class by creating the child classes.\n\nTo take\
    \ a minimal example- If there is a requirement for a class to accept and store\
    \ `String` values, some programmers new to Java will reach for inheritance as\
    \ follows:\n\n```\nclass InheritanceAbuse extends ArrayList<String> {\n\n  public\
    \ void performBusinessLogic(int i) {\n    // do things with stored strings\n \
    \ }\n\n}\n```\n\nThe same functionality can be implemented using composition.\n\
    \n```\nclass UsesComposition {\n\n  private final List<String> values = new ArrayList<String>();\n\
    \n  public void performBusinessLogic(int i) {\n    // do things with stored strings\n\
    \  }\n\n  public void add(String value) {\n    this.values.add(value);\n  }\n\n\
    }\n```\n\nDespite requiring more code, an experienced Java programmer would not\
    \ even consider the first approach. So why is it that the second version is preferable?\n\
    \nThere are several overlapping explainations, we'll start with the most abstract\
    \ and move on to more practical ones.\n\n### Inheritance is a Strong Relationship\n\
    Inheritance is used to model an IS-A relationship - i.e. we are saying that our\
    \ `InheritanceAbuse` class is an `ArrayList` and we should be able to pass one\
    \ to any piece of code that accepts an `ArrayList`.\n\nComposition creates a HAS-A\
    \ relationship; this is a weaker relationship and we should always favor weaker\
    \ relationships in our code.\n\nSo favoring composition over inheritance is just\
    \ one specific instance of the more general advice to favor weak relationships\
    \ between our classes.\n\nUsing inheritance makes sense when there is an IS-A\
    \ relationship there but it is an inappropriate mechanism to use purely for reusing\
    \ code.\n\n### Inheritance Breaks Encapsulation\nThe inheritance implementation\
    \ fails to encapsulate an implementation detail - that we're storing things in\
    \ an `ArrayList`.\n\nThe interface to our class includes all sort of methods from\
    \ `ArrayList` such as:\n\n* `clear`\n* `remove`\n* `contains`\n\nDo these methods\
    \ make sense for our class? If someone calls them, could it interfere with the\
    \ logic in `performBusinessLogic`?\n\nWe don't know enough about what our example\
    \ class is meant to do to answer these questions definitively, but the answer\
    \ is most likely that we would prefer not to expose these methods.\n\nIf we switch\
    \ from `ArrayList` to some other list implementation this is visible to the clients.\
    \ Code that previously compiled may now break even if no methods specific to `ArrayList`\
    \ are called.\n\n### We Can Only Do This Once\nJava doesn't support multiple inheritance\
    \ so we only get to pick one thing to extend. If our class also needed to store\
    \ `Integers` then inheritance isn't even an option so we'd have to use composition.\n\
    \nComposition is inherently more flexible in single inheritance languages.\n\n\
    ### Composition Aids Testing\nThis is not relevant to our simple example, but\
    \ it is trivial to test how classes linked together by composition interact. It\
    \ is far harder when inheritance is used.\n\n```\nclass MyUntestableClass extends\
    \ SomeDependency {\n  public void performBusinessLogic(int i) {\n    // do things\
    \ using methods from SomeDependency\n  }\n}\n```\n\n```\nclass MyClass {\n  private\
    \ final SomeDependency dependency;\n\n  MyClass(SomeDependency dependency) {\n\
    \    this.dependency = dependency;\n  }\n\n  public void performBusinessLogic(int\
    \ i) {\n    // do things with dependency\n  }\n}\n```\n\nIt is easy to inject\
    \ a mock into `MyClass`. Tricks exist to isolate the code in `MyUntestableClass`\
    \ from `SomeDependency` for the purpose of unit testing, but they are far more\
    \ involved.\n\n### Inheritance is Static\nInheritance sets a fixed relationship\
    \ between concrete classes at compile time. With composition it is possible to\
    \ swap in different concrete classes at runtime.\n\nAgain composition is inherently\
    \ more flexible.\n\n### Interface Inheritance\nThe advice to prefer composition\
    \ to inheritance refers to *implementation inheritance* (i.e. extending a class).\
    \ The disadvantages discussed above do not apply to *interface inheritance* (i.e.\
    \ implementing an interface).\n\nIn fact, the design choice you often have to\
    \ make is between implementation inheritance or a combination of composition and\
    \ interface inheritance.\n\nIn these situations, the advice is still to prefer\
    \ the approach that uses composition.\n"
  raw: "Javadoc can help document code but often there are better ways to do so. Think\
    \ carefully before deciding to write it.\n\n### Details\n\n#### Javadoc is Good\n\
    \nJavadoc is invaluable for external teams that must consume your code without\
    \ access to the source.\n\nAll externally consumed code should have javadoc for\
    \ its public methods.\n\nEnsure that all such javadoc concentrates on *what* a\
    \ method does, not *how* it does it.\n\n#### Javadoc is Bad\n\nJavadoc duplicates\
    \ information that ought to be clear from the code itself and carries a constant\
    \ maintenance cost.\n\nIf it is not updated in tandem with the code then it becomes\
    \ misleading.\n\nDo not Javadoc code that will be consumed and maintained only\
    \ by your immediate team. Instead spend effort ensuring that the code speaks for\
    \ itself.\n\n# Remember Kiss And Yagni\n\n## Remember KISS and YAGNI\n\n### Summary\n\
    \nKeep your design as simple as possible.\n\nCreate only the functionality you\
    \ need now - not what you think you might need in the future.\n\n### Details\n\
    \nThe KISS (Keep It Simple, Stupid) and YAGNI (You Ain't Going To Need It) acronyms\
    \ provide good advice that is worth remembering while coding.\n\nKISS advises\
    \ that we keep our code and designs as simple as possible.\n\nFew people would\
    \ disagree with this, but unfortunately it is not always obvious what *simple*\
    \ means.\n\nGiven two solutions to a problem which one is simpler?\n\n*   The\
    \ one with the least lines of code?\n\n*   The one with the least number of classes?\n\
    \n*   The one that uses fewer third party dependencies?\n\n*   The one with fewer\
    \ branch statements?\n\n*   The one where the logic is most explicit?\n\n*   The\
    \ one which is consistent with a solution used elsewhere?\n\nAll of the above\
    \ are reasonable definitions of *simple*. None of them is the single definition\
    \ always makes sense to follow.\n\nRecognizing simple isn't easy and keeping things\
    \ simple takes a lot of work.\n\nIf we could somehow measure the complexity of\
    \ our software, we would find that there is some minimum value that each piece\
    \ of software must contain.\n\nIf the software were any simpler, then it would\
    \ be less functional.\n\nReal programs will always contain this *inherent complexity*\
    \ plus a bit. This extra complexity is the *accidental complexity* we have added\
    \ because we are less than perfect.\n\nTelling accidental complexity apart from\
    \ inherent complexity is of course also hard.\n\nFortunately YAGNI gives us some\
    \ useful advice on how to keep things simple without having to tell accidental\
    \ and inherent complexity apart.\n\nThe more a system does, the higher its overall\
    \ complexity will be. If we make a system that does less, it will be simpler -\
    \ it will have less *inherent complexity* and less *accidental complexity*\n\n\
    Your goal is, therefore, to create the minimum amount of functionality that solves\
    \ the problems you have right **now**.\n\n*   Don't implement things because you\
    \ think you might need them later. Implement in the future if you need it.\n\n\
    *   Don't try and make things \"flexible\" or \"configurable\". Make them do just\
    \ what they need to do - parameterize them at the point you have a need to do\
    \ so.\n\nIf you create more than the minimum amount of functionality, you will\
    \ have more code to debug, understand and maintain from that point forward until\
    \ someone has the confidence to delete it.\n\n# Prefer Composition\n\n## Prefer\
    \ Composition to Inheritance\n\n### Summary\n\nComposition usually results in\
    \ more flexible designs.\n\nFirst consider using composition, then fall back to\
    \ using inheritance only when composition does not seem to be a good fit.\n\n\
    ### Details\n\nComposition means building things by adding other things together.\
    \ Inheritance is building things by extending behavior based on an existing class\
    \ by creating a child classes.\n\nTo take a minimal example- If there is a requirement\
    \ for a class to accept and store String values, some programmers new to Java\
    \ will reach for inheritance as follows:\n\n```\nclass InheritanceAbuse extends\
    \ ArrayList<String> {\n\n  public void performBusinessLogic(int i) {\n    // do\
    \ things with stored strings\n  }\n\n}\n```\n\nThe same functionality can be implemented\
    \ using composition.\n\n```\nclass UsesComposition {\n\n  private final List<String>\
    \ values = new ArrayList<String>();\n\n  public void performBusinessLogic(int\
    \ i) {\n    // do things with stored strings\n  }\n\n  public void add(String\
    \ value) {\n    this.values.add(value);\n  }\n\n}\n```\n\nDespite requiring more\
    \ code, an experienced Java programmer would not even consider the first approach.\
    \ So why is it that the second version is preferable?\n\nThere are several overlapping\
    \ explanations, we'll start with the most abstract and move on to more practical\
    \ ones.\n\n#### Inheritance is a Strong Relationship\n\nInheritance is used to\
    \ model an IS-A relationship - i.e. we are saying that our `InheritanceAbuse`\
    \ class is an ArrayList and we should be able to pass one to any piece of code\
    \ that accepts an ArrayList.\n\nComposition creates a HAS-A relationship; this\
    \ is a weaker relationship and we should always favor weaker relationships in\
    \ our code.\n\nSo favoring composition over inheritance is just one specific instance\
    \ of the more general advice to favor weak relationships between our classes.\n\
    \nUsing inheritance makes sense when there is an IS-A relationship there but it\
    \ is an inappropriate mechanism to use purely for reusing code.\n\n#### Inheritance\
    \ Breaks Encapsulation\n\nThe inheritance implementation fails to encapsulate\
    \ an implementation detail - that we're storing things in an ArrayList.\n\nThe\
    \ interface to our class includes all sort of methods from ArrayList such as:\n\
    \n*   clear\n\n*   remove\n\n*   contains\n\nDo these methods make sense for our\
    \ class? If someone calls them, could it interfere with the logic in `performBusinessLogic`?\n\
    \nWe don't know enough about what our example class is meant to do to answer these\
    \ questions definitively, but the answer is most likely that we would prefer not\
    \ to expose these methods.\n\nIf we switch from ArrayList to some other list implementation\
    \ this is visible to the classes clients. Code that previously compiled may now\
    \ break even if no methods specific to ArrayList are called - the change of type\
    \ alone might cause compilation failures.\n\n#### We Can Only Do This Once\n\n\
    Java doesn't support multiple inheritance so we only get to pick one thing to\
    \ extend. If our class also needed to store Integers then inheritance isn't even\
    \ an option so we'd have to use composition.\n\nComposition is inherently more\
    \ flexible in single inheritance languages.\n\n#### Composition Aids Testing\n\
    \nThis is not relevant to our simple example, but it is trivial to test how classes\
    \ linked together by composition interact. It is far harder when inheritance is\
    \ used.\n\n```\nclass MyUntestableClass extends SomeDependency {\n  public void\
    \ performBusinessLogic(int i) {\n    // do things using methods from SomeDependency\n\
    \  }\n}\n```\n\n```\nclass MyClass {\n  private final SomeDependency dependency;\n\
    \n  MyClass(SomeDependency dependency) {\n    this.dependency = dependency;\n\
    \  }\n\n  public void performBusinessLogic(int i) {\n    // do things with dependency\n\
    \  }\n}\n```\n\nIt is easy to inject a mock into `MyClass`. Tricks exist to isolate\
    \ the code in `MyUntestableClass` from `SomeDependency` for the purpose of unit\
    \ testing, but they are far more involved.\n\n#### Inheritance is Static\n\nInheritance\
    \ sets a fixed relationship between concrete classes at compile time. With composition\
    \ it is possible to swap in different concrete classes at runtime.\n\nAgain composition\
    \ is inherently more flexible.\n\n### Interface Inheritance\n\nThe advice to prefer\
    \ composition to inheritance refers to *implementation inheritance* (i.e. extending\
    \ a class). The disadvantages discussed above do not apply to *interface inheritance*\
    \ (i.e. implementing an interface).\n\nIn fact, the design choice you often have\
    \ to make is between implementation inheritance or a combination of composition\
    \ and interface inheritance.\n\nIn these situations, the advice is still to prefer\
    \ the approach that uses composition."
