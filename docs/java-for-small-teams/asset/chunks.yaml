  trans: "\n\n![](img/cover.jpg)\n\n# 目录\n\n1. 介绍\n2. 流程\n    - 建立快速反馈循环\n    - 即时反馈\n\
    \    - 快速反馈\n    - 较速反馈\n    - 对测试时使用的语言达成一致\n    - 将覆盖率视为工具而非目标\n3. 风格\n    -\
    \ 审慎考虑代码生成器\n    - 为了可读性进行优化\n    - 优先使用可读代码而非注释\n    - 审慎地使用 Javadoc\n    - 记住\
    \ KISS 和 YAGNI\n    - 优先使用组合\n    - 保持稳固\n    - 保持代码干燥（不重复）\n    - 优先考虑可逆的决策\n\
    \    - 使依赖关系明确\n    - 优先使用不可变对象\n    - 使用一致的代码布局](#100_use_a_consistent_code_layout.html)\n\
    \    - 方法分组以便理解\n    - 保持方法短小简单\n    - 方法只做一件事\n    - 避免空\n    - 适量使用 final 关键字\n\
    \    - 不要提供多个工作线程构造函数\n    - 避免检查异常\n4. 细节\n    - 如何实现 Hashcode 和 Equals\n   \
    \ - 不要重新为赋值\n    - 限制作用域\n    - 优先使用 for-each 循环而非 for 循环\n    - 优先使用 Map 和 Filter\
    \ 而非命令式循环\n    - 避免使用史前的 API\n    - 警惕类型转换和泛型警告\n    - 不要使用魔法数字\n    - 不要使用 assert\
    \ 关键字\n    - 避免浮点和双精度浮\n    - 不要使用反射\n    - 了解 JDK 单行代码\n5. 测试\n    - 编写规范而非测试\n\
    \    - 思考单元而非方法\n    - 用规范命名测试\n    - 审慎挑选示例\n    - 让测试易于理解\n    - 理解如何使用 Mock\
    \ 和 Stub\n    - 理解代码复用的选项\n    - 编写可重复的测试\n    - 仅对进行单元测试有意义的代码\n    - 测试常见问题\n\
    6. 糟糕的建议\n    - 单一出口点\n    - 始终使用 StringBuffer\n    - 匈牙利命名\n\n# 介绍\n\n## 这本书是什么？\n\
    这本书旨在尝试描述良好的代码是什么样子的，以及实现它的实践。它并不是唯一的标准答案，而是许多有效方案中的一种观点。\n\n所以为什么要写这本书？它的独特之处在于具有以下特点：\n\
    - 易于分发\n- 开放并欢迎更新\n- 简洁\n- 针对性强\n\n我们对你以及你工作环境有一些假设：\n- 我们假设你正在编写 Java 代码。\n-\
    \ 我们假设你的团队经验各异（既有专家也有学者）。\n- 我们假设你在业务背景下编写代码。\n- 我们假设你的代码在多年后仍然有效。\n\n书中的建议在某些背景下是有效的，而在另一些情况下可能是糟糕的。如果你对书中的内容有异议，请告知我们，以便改进。最后，我们编写的代码并非完美。有时我们会继承自己的错误，有时也会继承别人的错误。\n\
    \n"
- fmt: "\nOne of the most common mistakes we've seen experienced programmers make\
    \ is to blindly consider only one or two concerns (often the ones with catchy\
    \ acronyms) without thought for others.\n\nWe've carefully set out the context\
    \ in which we think the advice in this book will be useful, but the context is\
    \ still very broad. Slightly different situations might benefit from very different\
    \ trade offs. What worked well for you in one project might not work so well in\
    \ the next.\n\nFor this reason we rarely use words like `always` or `never`.\n\
    \nWhen we do use them we have thought carefully before doing so, but what we really\
    \ mean is almost-always or almost-never.\n\nHaving said this if you find yourself\
    \ discounting any of the recommendations in this book please stop and think first.\
    \ Don't fall into the trap of thinking certain advice cannot apply to you. We\
    \ often make our worst mistakes when we believe we are being elegant or clever.\
    \ The full horror of our ineptitude sometimes does not become apparent for months\
    \ or years.\n\nAdvice is here to save us from ourselves.\n\n## A note on Java\
    \ Versions\n\nThis document is intended to apply to `Java 7`, `8` and `9` but\
    \ will be largely applicable to `Java 5` and `6`.\n\nWhere there are differences\
    \ between recent Java versions we will point them out. If you are unlucky enough\
    \ to be working with an early version of `Java` you will have to discover any\
    \ differences to `Java 7` on your own.\n\n## License\n\nThis work is Copyright\
    \ © `NCR`, but may be read and shared with others under the terms of the Creative\
    \ Commons Attribution Share Alike licence v4.0.\n\n## Author\n\nThis document\
    \ was written by [Henry Coles](https://twitter.com/0hjc) and numerous contributors.\n\
    \n### Contributors\n\n* Francesco Burato\n* Gary Duprex\n* Grant Forrester\n*\
    \ Kevin Grant\n* Keir Lawson\n* Marco Di Paola\n* Gordon Rogers\n* Herve Saint-Amand\n\
    * Ewan Summers\n\n## Cover\n\nThe cover was produced by Peter Berry based on a\
    \ wood engraving of a Long billed curlew from the 1885 text *\"Nouveau dictionnaire\
    \ encyclopédique universel illustré\"*\n\nTo our knowledge Long Billed Curlews\
    \ are not especially proficient in `Java`.\n\n# Process\n\nCode (good and bad)\
    \ doesn't just appear from nowhere, someone needs to sit down and write it. How\
    \ the coder approaches this task can influence the amount of time spent swearing\
    \ at the code later.\n\nThis section looks at development philosophy, workflow,\
    \ and other factors that teams should consider before starting to work together.\n\
    \n# Build Fast Feedback Loops\n\nGood code is all about getting good and timely\
    \ feedback. The sooner you find out something is wrong the easier it is to fix.\n\
    \nWorking on a legacy project, where the only way to discover if a code change\
    \ is good is to deploy it to a `dev/test/qa` environment, is frustrating and demoralizing.\n\
    \nMake sure your project has a well designed development workflow - the effort\
    \ of setting this up will be repaid many times over.\n\nIdeally all feedback would\
    \ be instantaneous, but in practice it is either impractical or impossible to\
    \ get all feedback this way.\n\nInstead software development is organized as nested\
    \ levels of feedback, as shown here:\n\n![Development feedback cycles](feedback_cyclesncr.png)\n\
    \n# Instant Feedback\n\nA modern IDE such as `Eclipse` or `IntelliJ` will provide\
    \ instant feedback as you type, using the underlying compiler and configurable\
    \ static analysis tools.\n\nYou can increase the amount of instant feedback you\
