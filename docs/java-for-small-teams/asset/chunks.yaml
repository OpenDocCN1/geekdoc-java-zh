  trans: "\n另外请注意，创建 `Predicate` 的方法已改为静态（static）。在返回匿名类时，尽可能这样做是一个好主意，可以防止长生命实例导致父类无法被垃圾回收。虽然在这个实例中\
    \ `Predicate` 只是短命的，但在所有情况下教条式地应用 `static` 可以避免思考的开销。\n\n# 避免使用史前时代的 API\n\n##\
    \ 避免使用史前时代的 API\n\n### 总结\n\n不要使用 `Vector`、`StringBuffer` 以及 JDK 的其他过旧部分。\n\n\
    ### 详情\n\nJava 已经存在 20 多多年。为了保持向后兼容，它堆积了各种不再具有意义的 API。其中一些被方便地标记了 `@Deprecated`\
    \ 注解，而另一些则没有。\n\n遗憾的是，许多 API 仍然在大学课程和在线示例中使用。新的 Java 程序员可能没有意识到它们已经被替换——几个需要注意的包括：\n\
    \n*   `java.util.Vector` - 请用 `ArrayList` 代替\n*   `java.lang.StringBuffer` - 请用\
    \ `StringBuilder` 代替\n*   `java.util.Stack` - 请用 `Deque`（例如 `ArrayDeque`）代替\n\
    *   `java.util.Hashtable` - 请用 `Map`（例如 `HashMap`）代替\n*   `java.util.Enumeration`\
    \ - 请用 `Iterator` 或 `Iterable` 代替\n\n这些替代品（`Enumeration` 除外）与原始类的区别在于它们不同同步。如果你认为你需要同步集合，请去安静的地方重新思考一下。\n\
    \n# 注意强制转换和泛型警告\n\n## 注意强制转换和泛型警告\n\n### 总结\n\n强制转换稀释了 Java 类型系统的优势，使得代码的可读性和安全性都降低了。\n\
    \n尽可能避免强制转换。\n\n如果你发现自己正在编写强制转换，停下来问问自己为什么要写它。\n\n你的代码需要进行什么修改才能不需要编写那个强制转换？\n\
    \n你为什么不能做那个修改？\n\n### 详情\n\nJava 的类型系统是为了帮助我们的——它在编译时捕捉错误并记录我们的代码，使其更容易理解和导航。\n\
    \n当我们向代码中添加强制转换时，我们就失去了这两种好处。\n\n代码中引入强制转换主要有三个原因：\n\n1.  我们已经达到了 Java 类型系统的极限，程序员必须接管控制权\n\
    2.  代码的整体设计很糟糕\n3.  代码使用了原始泛型（raw generic types）\n\n我们将反序查看这些。\n\n#### 使用原始类型的代码\n\
    \n如果代码包含原始泛型（是因为代码早于 Java 5，或者是程序员不熟悉 Java），那么就会产生强制转换的需求。\n\n例如：\n\n```\nList\
    \ list = numberList();\nfor (Object each : list) {\n  Integer i = (Integer) each;\n\
    \  // do things with integers\n}\n```\n\n编译器不会对我们未能完全声明正在处理的 `List` 类型感到高兴，并会（取决于如何配置）在声明\
    \ `list` 的行上生成错误或警告，例如：\n\n```\nList is a raw type. References to generic type\
    \ List<E> should be parameterized\n```\n\n同样，对于错误的代码，例如：\n\n```\nList l = new\
    \ ArrayList<Number>();\nList<String> ls = l;\n```\n\n编译器将发出：\n\n```\nThe expression\
    \ of type List needs unchecked conversion to conform to List<String>\n```\n\n\
    确保所有此类警告都得到解决，要么实施零警告策略，要么配置编译器将它们视为错误。\n\n在这种情况下，移除强制转换和警告是非常直接的：\n\n```\nList<Integer>\
    \ list = numberList();\nfor (Integer each : list) {\n   // do things with each\n\
    }\n```\n\n#### 糟糕的设计\n\n有时，移除强制转换或修复警告并非于易事。我们遇到了第二个问题——设计糟糕。\n\n例如：\n\n```\n\
    List<Widget> widgets = getWidgets();\nList results = process(widgets);\n\nfor\
    \ (Object each : results) {\n  if (each instanceof String) {\n    // handle failure\
    \ using data from string\n  } else {\n    EnhancedWidget widget = (EnhancedWidget)\
    \ each;\n    widget.doSomething();\n  }\n}\n```\n\n通常情况下，放入集合的对象应该是单一类型，或者是通过共同的超类或接口关联的多种类型。\n\
    \n在这里，无关的类型被放在了集合中。\n"
- fmt: "\n```java\npublic void fnord(int i) {\n  if (i == 1) {\n    performSideEffect();\n\
    \  }\n}\n```\n\n`Better`\n\n```java\npublic void fnord(int i) {\n  if (i == VALID)\
    \ {\n    performSideEffect();\n  }\n}\n```\n\n`You've missed the point`\n\n```java\n\
    public void fnord(int i) {\n  if (i == ONE) {\n    performSideEffect();\n  }\n\
    }\n```\n\nIf the constants you extract relate to an identifiable concept, create\
    \ an Enum instead:\n\n`Good`\n\n```java\npublic void fnord(FnordStatus status)\
    \ {\n  if (status == FnordStatus.VALID) {\n    performSideEffect();\n  }\n}\n\
    ```\n\nSome coding standards make statements such as \"0 and 1 are exceptions\
    \ to this rule\". This is, however, an oversimplification. Sometimes 0 and 1 will\
    \ have a clear local meaning as they are being used as part of low level code\
    \ e.g.:\n\n```\n if (list.size() == 0) {...}\n```\n\nBut 0 and 1 may also have\
    \ domain-specific values that should be extracted into constants like any other\
    \ literal. Server-side Java can also often be re-written in a cleaner fashion\
    \ without the use of numeric literals, e.g.:\n\n```\n if (list.isEmpty()) {...}\n\
    ```\n\n# Do Not Use The Assert Keyword\n\n## Don't Use the Assert Keyword\n\n\
    ### Summary\nAssertions are a useful coding technique that can provide many benefits\
    \ but in most circumstances it is better to implement them using third party libraries\
    \ rather than the `assert` keyword.\n\n### Details\nAssertions written with the\
    \ `assert` keyword are only enabled when the `-ea` JVM flag is set. The intent\
    \ of this flag is to allow the assertions to be enabled in development and testing\
    \ but disabled in production to avoid the performance overhead of assertion logic.\
    \ This is usually a premature optimization and increases the opportunity for mistakes\
    \ as the code will behave differently in development vs production.\n\nSwitching\
    \ off assertions in production also greatly dilutes their value. If a coding error\
    \ has been made assertions ensure that it is reported early, close to the bug.\
    \ If assertions are turned off in production bugs may propagate silently. This\
    \ may make their consequences more severe and will certainly make the issue harder\
    \ to diagnose.\n\nSo for these reasons, unless you are working in a very performance\
    \ sensitive domain, assertions should always be enabled. For always-on assertions\
    \ third party libraries such as `Guava`'s `preconditions` provide a better solution\
    \ than the `assert` keyword. A separate issue is the use of the `assert` keyword\
    \ in tests. This is usually the result of a lack of familiarity with Java and\
    \ JUnit. In codebases found in the wild where `assert` has been used in tests\
    \ the `-ea` flag is rarely set, meaning that the tests can never fail. For tests\
    \ JUnit's built in assertions or modern test focused assertion libraries such\
    \ as `AssertJ` should always be used.\n\n# Avoid Floats And Doubles\n\n## Avoid\
    \ Floats and Doubles\n\n### Summary\nAvoid using floats and doubles (both the\
    \ primitives and their wrappers).\n\n### Detail\nFloats and doubles introduce\
    \ a minefield of rounding and comparison issues. While they are a sensible choice\
    \ for some domains where you do not care about rounding errors integers or `BigDecimal`\
    \ are usually a better choice for server-side business code.\n\nThe core issue\
    \ is that floating point numbers are not able to represent many numbers (e.g.\
    \ `0.1`). This leads to unexpected results that may not be caught by simple test\
    \ cases:\n\n```\n double balance = 2.00;\n    double transationCost = 0.10;\n\
    \    int numberTransactions = 6;\n\n    System.out.printf(\"After %s transactions\
    \ balance is %s\"\n                    , numberTransactions\n                \
    \    , balance - (transationCost * numberTransactions));\n    // Gives After 6\
    \ transactions balance is 1.4 :-)\n```\n\nBut\n\n```\n double balance = 2.00;\n\
    \    double transationCost = 0.10;\n    int numberTransactions = 7;\n\n    System.out.printf(\"\
    After %s transactions balance is %s\"\n                     , numberTransactions\n\
    \                     , balance - (transationCost * numberTransactions));\n  \
    \  // Gives After 7 transactions balance is 1.2999999999999998 :-(\n```\n\nThe\
    \ simplest solution in this case would be to replace the floats with integer values\
    \ (i.e. track the balance in units of cents rather than dollars). In situations\
    \ where floats can't be replaced by integers code can be re-written to use `BigDecimal`:\n\
    \n```java\n BigDecimal balance = new BigDecimal(\"2.00\");\n    BigDecimal transationCost\
    \ = new BigDecimal(\"0.10\");\n\n    BigDecimal numberTransactions = BigDecimal.valueOf(7);\n\
    \n    System.out.printf(\"After %s transactions balance is %s\"\n            \
    \         , numberTransactions\n                     , balance.subtract(transationCost.multiply(numberTransactions)));\n\
    \n   // Gives After 7 transactions balance is 1.30 :-)\n```\n\nNote that although\
    \ `BigDecimal` can be constructed from a float this would take us back to where\
    \ we started:\n\n```java\n BigDecimal balance = new BigDecimal(\"2.00\");\n  \
    \  BigDecimal transationCost = new BigDecimal(0.10); // <- float used to construct\n\
    \n    BigDecimal numberTransactions = BigDecimal.valueOf(7);\n\n    System.out.printf(\"\
    After %s transactions balance is %s\"\n                     , numberTransactions\n\
    \                     , balance.subtract(transationCost.multiply(numberTransactions)));\n\
    \n   // Gives After 7 transactions\n   // balance is 1.2999999999999998\n```\n\
    \n### When to use floats and doubles\nFloats and doubles clearly can't be all\
    \ bad or it is unlikely they would have been included in the Java language. The\
    \ primitive point types have performance advantages over `BigDecimal` that can\
    \ be significant in highly numerical domains such as machine learning, physics\
    \ engines, scientific applications etc. In these domains the performance benefit\
    \ may greatly out-weigh the additional risk of error. Code using `BigDecimal`\
    \ is also inherently more verbose and clumsy than code that uses primitives. If\
    \ you are working in a domain where the imprecision of floating point types is\
    \ acceptable you might prefer the cleaner code they allow, but be sure you are\
    \ making this choice consciously with an understanding of the pitfalls.\n\n# Do\
    \ Not Use Reflection\n\n## Don't use Reflection\n\n### Summary\nDo not use reflection\
    \ in your code (i.e. anything from `java.lang.reflect` package).\n\n### Details\n\
    Reflection is a powerful tool; it allows Java to do things that would otherwise\
    \ be impossible or require large amounts of boilerplate code. But, while it is\
    \ sometimes useful when creating a framework or library it is unlikely to be a\
    \ good way to solve the types of problem we encounter in normal server-side application\
    \ code.\n\nSo why would we want to avoid using a powerful tool that Java provides?\
    \ Reflection has three main drawbacks:\n\n#### Loss of Compile Time Safety\nReflection\
    \ moves errors from compile time to runtime - this is a Bad Thing ™ The compiler\
    \ is our first form of defense against defects and the type system is one of the\
    \ most effective tools we have to document our code. We should not throw these\
    \ away lightly.\n\n#### Loss of Refactor Safety\nRefactoring and code analysis\
    \ tools are blind to reflection. Although they may make some attempt to take it\
    \ into account, the additional possibilities reflection creates for how a program\
    \ might behave means the tools can no longer provide rigorous guarantees that\
    \ they have understood the program. In the presence of reflection refactorings\
    \ that would otherwise be safe may change program and analysis tools may report\
    \ incorrect results.\n\n#### Harder Code Comprehension\nIn the same way that Reflection\
    \ makes it harder for automated tools to understand code, it also makes it harder\
    \ for humans to understand code. Reflection introduces surprises. *This method\
    \ is never called, I can safely delete it.* Oh. Reflection.\n\n*I can safely change\
    \ the behavior of this private method as I know where it is called from.* Oh.\
    \ Reflection.\n\n# Know The JDK One Liners\n\n## Know common one liners\n\n###\
    \ Summary\n"
