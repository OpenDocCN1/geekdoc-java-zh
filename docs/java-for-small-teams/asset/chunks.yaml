  trans: "\nJDK 包含许多工具函数，可以使用它们来替代更冗长的代码。\n\n### 详情\n\n正如在“优化可读性而非性能”中讨论的，我们应该倾向于使用简单代码而不是我们认为可能更高效的复杂代码（除非我们通过性能分析和性能测试证明了更复杂的代码具有实际收益）。\n\
    \n然而，有时我们发现自己处于一种理想的情况，即不需要在代码的清晰度和（假设的）性能之间进行权衡。有时也有理由相信，最整洁的代码版本可能也略微更高效。\n\n\
    JDK 中散布着许多小函数，它们不仅比通常用于替换的代码更整洁，而且可能略微更高效。应该尽可能使用这些函数，一旦你了解了它们的存在，任何没有使用它们的代码看起来都会有些不对劲。\n\
    \n大多数 IDE 都会提示你使用部分或全部这些单行代码。\n\n## java.util.Arrays.asList\n\n当你需要将数组转换为固定大小的列表时。\n\
    \n```\nList ss = Arrays.asList(\"1”, “2\");\n```\n\n这比常见的替代方案更整洁、更高效，例如：\n\n```\n\
    List ss = new ArrayList<>(); ss.add(“1”); ss.add(“2”);\n```\n\n`asList` 返回的列表实现是专门的，可能比\
    \ `ArrayList` 消耗更内存。\n\n请注意，通过此方法创建的列表不是完全不可变的。它们是固定大小的，如果你尝试添加或删除成员，将抛出 `java.lang.UnsupportedOperation`\
    \ 异常，但修改 `set` 等修改方法将成功。\n\n如果你在使用 Java 9，`List.of` 方法提供了更优的替代方案。\n\n## java.util.Collections.empty*\n\
    \n`java.util.Collections` 类包含了创建常用集合类不可变版本的方法，这些类专门用于包含空条目或单个条目。\n\n最常见的有：\n\n\
    * `emptyMap`\n* `emptyList`\n* `emptySet`\n* `singletonList`\n* `singletonMap`\n\
    * `singletonSet`\n\n但也有其他更专门的方法。\n\n同样，与常见的替代方案相比，使用这些会导致更整洁、更具描述性的代码，并且返回的专用数据结构内存可能更小。\n\
    \n如果你在使用 Java 9，静态的 `of` 方法提供了单条目方法的更优替代方案。\n\n## valueOf\n\n形式如下：\n\n```\nBoolean\
    \ b = Boolean.valueOf(true);\n```\n\n这比主观上更丑的写法效率更高：\n\n```\nBoolean b = new Boolean(true);\n\
    ```\n\n`valueOf` 将返回两个固定 Boolean 实例之一，而调用构造函数始终会分配一个新对象。\n\n对于 `Integers` 也是如此，`valueOf`\
    \ 将为 -128 到 127 之间的值返回共享实例。\n\n`Long.valueOf` 同样会从缓存中返回对象。\n\nOracle JDK 目前没有在调用\
    \ `valueOf` 时对 Floats 或 Doubles 使用缓存。因此，在浮点数上使用 `valueOf` 替代 `new` 可能没有优势，但也没有劣势。\n\
    \n`valueOf` 方法的重载版本从字符串构造它们所需的类型。如果你需要从字符串创建装箱后的原始类型，这是实现方法。\n\n值得注意的是，虽然规范没有保证，但在实践中，Java\
    \ 编译器通过调用 `valueOf` 来实现自动装箱。\n\n所以：\n\n```\nBoolean b = true;\n```\n\n和\n\n```\n\
    Boolean b = Boolean.valueOf(true);\n```\n\n它们是等价的。\n\n从 Java 9 开始，装箱原始类型构造函数已弃用，取而代之的是\
    \ `valueOf` 和 `parse` 方法（见下）。\n\n## parseXXX\n\n与 `valueOf` 类似，`parseXXX` 方法将字符串转换为原始类型，在这种情况下原始类型没有被装箱。\n\
    \n```\nfloat f = Float.parseFloat(“1.2”);\n```\n\n这完全符合方法名所述的作用，与常见的替代方案相比：\n\n\
    ```\nfloat f = new Float(“1.2”);\n```\n\n它避免了 `Float` 对象的构造和解箱。\n\n对于 Boolean、Double、Integer\
    \ 以及其他原始类型也存在类似的方法。\n\n## isEmpty\n\n一种常见的拙劣惯用法是通过检查大小来检查 `Collection` 是否为空：\n\
    \n```\nif ( list.size() == 0 ) {\n  // 执行一些事情\n}\n```\n\n更清晰、更简洁的是：\n\n```\nif\
    \ ( list.isEmpty() ) {\n  // 执行一些事情\n}\n```\n\n取决于所调用的数据结构，这可能在计算上更高效。\n\n通常没有性能差异，但对于大型\
    \ `ConcurrentLinkedQueue`，这种差异可能是巨大的。\n\n## Java 9 工厂方法\n\nJava 9 为 `List`、`Set`\
    \ 和 `Map` 接口添加了静态工厂方法 `of`。\n\n这些允许我们整洁地构建集合，例如：\n\n```\nList.of(1, 2, 3);\nSet.of(42);\n\
    ```\n\n`of` 方法重载支持最多 10 个值。\n\n代码比 Java 8 的 `Arrays.asList` 版本读起来稍微好，并返回一个完全结构不可变的列表，不允许替换元素。它可能稍微更高效，因为避免了分配数组。\n\
    \n虽然 `of` 被重载为不接受参数，但这种表达的意图没有 `emptyList` 等方法清晰，因此后者可能仍然是首选。\n\n# 测试\n\n# 好的测试\n\
    \n测试金字塔和不同层次的测试在“约定测试中使用的语言”中进行了讨论。\n\n正如该节所讨论的，保持分层策略是重要的，要有许多快速运行的单元测试和少量的集成和系统测试。精确的比例会根据项目而异。\n\
    \n虽然在所有层次编写测试都是重要的，但本节主要关注单元测试，因为这些是我们编写得最多。\n\n# 编写规范而非测试\n\n## 编写规范而非测试\n\n\
    在编写测试之前，理解你*为什么*这样做很重要。\n\n你想实现什么？\n\n开发者中有一种不幸的倾向，将测试视为由于“最佳实践”而必须做的事。是完成工作后的额外工作。一项任务。\n\
    \n编写测试的原因已经丢失。\n\n### 为什么要编写测试？\n\n编写测试是为了让我们的生活更轻松。\n\n如果我们编写的测试没有做到这一点，我们就应该停止编写。\n\
    \n一个好的测试应该做到以下所有点：\n\n* 在实现改变时通过防止回归\n* 在初始编码期间捕获 bug\n* 文档代码的行为\n* 为代码的设计提供信息\n\
    \n"
- fmt: "\nIt describes what something `must` do without making assumptions about how\
    \ it will do it. It allows for multiple implementations. If a specification is\
    \ tied to one implementation then it is `over-specified` and will have to change\
    \ when the implementation does.\n\nSo this is what we must aim for - an executable\
    \ specification of our code.\n\nUnfortunately it is very hard to do.\n\n## Specification\
    \ First\n\nOne simple technique that can help is to write the specification before\
    \ the code. i.e. TDD.\n\nA rigorous `TDD` cycle proceeds in very small steps.\n\
    \nFirst write a test and run it to ensure that it fails.\n\nNext write just enough\
    \ code to make that test pass (and no more).\n\nTake a moment to see if there\
    \ is a sensible refactoring that would improve the code, then write the next test\
    \ and continue the cycle.\n\nThis has several advantages:\n\n* It guarantees that\
    \ all the code `can` be tested\n* As there is no implementation when the test\
    \ is written it is harder to write a test that is tied to one\n* It guarantees\
    \ that all behavior is covered by tests\n* It discourages writing superfluous\
    \ code\n\nThere are two important aspects of `TDD`:\n\n1. Writing the specification\
    \ first\n2. Moving in very small steps\n\nBoth of these practices are a good idea\
    \ individually, even if they are not combined.\n\nIf we wrote our specification\
    \ first, but moved in larger steps (possibly because we believed we knew what\
    \ our implementation should look like) we would realize our first advantage -\
    \ a guarantee that the code we wrote could be tested.\n\nWhat do we mean by this?\n\
    \nIf code is not written with testing in mind then it can be difficult to write\
    \ a test for it that fits our definition of a `unit` test.\n\nWe can make our\
    \ code more likely to be testable by following simple rules such as:\n\n* Always\
    \ inject dependencies\n* Avoid global state (singletons, static variables, `ThreadLocals`,\
    \ registries etc)\n\nBut even if we follow these rules we can still find that\
    \ it is difficult to test our code if we have not designed for it. Writing our\
    \ specification first requires our design to consider testing.\n\nAlthough we\
    \ ensured our code was testable, because we moved in large steps with an implementation\
    \ in mind we might not achieve the other benefits.\n\nIf we were to write our\
    \ code without first writing a test we might discover we were finished that our\
    \ code was difficult to test. The process of writing that code would however have\
    \ been easier if we had applied the second technique - moving in small steps.\n\
    \nIf we wrote only a small amount of code before executing it and observing the\
    \ result of each small code change, we would probably spend less time debugging,\
    \ be less likely to write code we did not need and move faster over all.\n\n`TDD`\
    \ has many advantages but it is not magic.\n\nEven if it is applied rigorously\
    \ it is entirely possible to write terrible code and specifications. `TDD` doesn't\
    \ mean you can stop thinking.\n\nDespite this, if you have a good understanding\
    \ of the technologies and domain in which you are working, `TDD` is usually the\
    \ best approach if you wish to optimize for quality.\n\nIf you do not understand\
    \ your domain or technology well you may find writing a specification first hard.\n\
    \nThe classic solution to this problem is to first gain understanding by producing\
    \ a throw away spike.\n\n## Spikes\n\nA spike is just some quick and dirty code\
    \ to explore how you might tackle the problem. At the end of the spike you will\
    \ know if that approach works well or if it is worth looking for alternative approaches.\n\
    \nBy producing a spike, you gain more understanding of both the domain and the\
    \ technology you are working with. Even if the conclusion at the end of the spike\
    \ is that it was a poor approach, the spike was still useful as it increased your\
    \ understanding.\n\nOnce you have learned what you can from the spike, it should\
    \ be thrown away and the final code test driven using the knowledge you have gained.\n\
    \n## Spike and Stabilize\n\nTraditionally, spikes are thrown away as they are\
    \ inherently of low quality. Discarding the spike is done to optimize code quality\
    \ at the expense of a (probably) slower delivery.\n\nSometimes this is not the\
    \ trade-off you want.\n\nAn alternative is to try to stabilize the spike so that\
    \ it is fit for use. If you do this, you will usually end up with something of\
    \ lower quality than if you had started again.\n\nYou will also end up spending\
    \ more effort on this piece of code over the lifetime of the project than if you\
    \ had thrown the spike away.\n\nWhat you gain for this loss in quality and increase\
    \ in effort is a faster `first` delivery. Sometimes this is a trade-off worth\
    \ making, sometimes it is not.\n\n# Think Units Not Methods\n\n## Think Units,\
    \ Not Methods\n\nEach behavior that a unit test describes should normally relate\
    \ to the overall `unit` rather than the responsibilities of an individual method.\n\
    \n### What is a Unit?\n\nTo think in terms of units we have to first answer the\
    \ difficult question of what a `unit` actually is.\n\nTesting in terms of methods\
    \ is effectively the same as saying that a `unit` is a method. It is easy to show\
    \ why this does not always work.\n\nIf we were to try and write a unit test for\
    \ the `push` method of `java.util.Stack` we might end up with something like:\n\
    \n```\n@Test\npublic void testPush() {\n   Stack<String> testee = new Stack<String>();\n\
    \   testee.push(\"foo\");\n   assertThat(testee.pop()).isEqualTo(\"foo\");\n};\n\
    ```\n\nNow lets test the `pop` method:\n\n```\n@Test\npublic void testPop() {\n\
    \   Stack<String> testee = new Stack<String>();\n   testee.push(\"foo\");\n  \
    \ assertThat(testee.pop()).isEqualTo(\"foo\");\n};\n```\n\nOh. That looks familiar.\n\
    \nThe problem we are hitting is that we have defined too small a `unit`.\n\nIf\
    \ we start thinking of `java.util.Stack` as our `unit` then tests become much\
    \ easier:\n\n```\n@Test\npublic void shouldRetrieveInOrderTheyAdded() {\n  Stack<String>\
    \ testee = new Stack<String>();\n  testee.push(\"a\");\n  testee.push(\"b\");\n\
    \  assertThat(testee.pop()).isEqualTo(\"b\");\n  assertThat(testee.pop()).isEqualTo(\"\
    a\");\n}\n```\n\nWe have written a test that, instead of trying to describe what\
    \ a method does, describes the behavior of the class as a whole.\n\nThe idea that\
    \ our job is to test methods is common with developers that are new to unit testing,\
    \ and is unfortunately re-enforced by some IDEs and tools that provide templates\
    \ to generate tests for each method.\n\n### Are Classes Units?\n\nIt often does\
    \ make sense to treat a class as a `unit` so this is a good default definition,\
    \ but it isn't always the right granularity.\n\nIf we were to try test the `java.util.Collections`\
    \ class we would find that it is perfectly reasonable to treat the `sort`, `reverse`,\
    \ `singleton`, etc. methods as separate `units`. Each one represents a self contained\
    \ logical behavior.\n\nSo sometimes `units` are as small as methods.\n\nSometimes\
    \ they are also larger than a single class.\n\nIf we were to inherit the code\
    \ below without any tests what tests might we write for it?\n\n```\npublic class\
    \ ThingaMeBob {\n\n  private final Iterable<MatchingBinaryOperator> actions;\n\
    \n  ThingaMeBob() {\n    actions = Arrays.asList(new Addition(), new Subtraction());\n\
    \  }\n\n  public int process(String s, int a, int b) {\n    for (MatchingBinaryOperator\
    \ each : actions) {\n      if (each.match(s)) {\n        return each.apply(a,b);\n\
    \      }\n    }\n\n    throw new RuntimeException();\n  }\n\n}\n\nclass Addition\
    \ implements MatchingBinaryOperator {\n  public boolean match(String s) {\n  \
    \  return \"add\".equals(s);\n  }\n  public int apply(int a, int b) {\n    return\
    \ a + b;\n  }\n}\n\nclass Subtraction implements MatchingBinaryOperator {\n  public\
    \ boolean match(String s) {\n    return \"minus\".equals(s);\n  }\n  public int\
    \ apply(int a, int b) {\n    return a - b;\n  }\n}\n```\n"
