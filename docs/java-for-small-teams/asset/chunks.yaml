  trans: "\n虽然一致性具有价值，但也存在代价。\n\n除非团队之间已经对内容的格式化达成了广泛共识，否则试图强制执行一套官方规则可能会产生的怨恨多于收益。\n\
    \n因此，应该设定一个全局首选参考标准，但只要团队在他们维护的代码中使用保持一致的风格，他们应该根据自己的需要自由偏离此标准。\n\n## 建议的格式规则\n\
    \n如果您没有自己强烈的偏好，我们建议您遵循 [Google Java Style 指南](https://google.github.io/styleguide/javaguide.html)。\n\
    \n这些格式规则经过了深思熟虑，文档清晰，且没有过度规定。\n\n我们不会在这里详细描述它们，但按照这些规则格式化的代码看起来如下：\n\n```java\n\
    class Example {\n  int[] myArray = {1, 2, 3, 4, 5, 6};\n  int theInt = 1;\n  String\
    \ someString = \"Hello\";\n  double aDouble = 3.0;\n\n  void foo(int a, int b,\
    \ int c, int d, int e, int f) {\n    if (f == 5) {\n      System.out.println(\"\
    fnord\");\n    } else {\n      System.out.println(someString);\n    }\n\n    switch\
    \ (a) {\n      case 0:\n        Other.doFoo();\n        break;\n      default:\n\
    \        Other.doBaz();\n    }\n  }\n\n  void bar(List<Integer> v) {\n    for\
    \ (int i = 0; i < 10; i++) {\n      v.add(new Integer(i));\n    }\n  }\n}\n```\n\
    \n然而，我们建议忽略 Google 指南关于何时编写 Javadoc 的建议，转而采用我们自己的规范。\n\n### 关于此风格的注意事项\n\n###\
    \ 使用空格而非制表符\n\n制表符（Tabs）的显示可能取决于编辑器的配置。这将导致不同的程序员在根据编辑器设置调整文件时，产生频繁的重新格式化。使用空格可以避免这个问题。\n\
    \n在某些语言中（例如代码压缩工具兴起之前的 JavaScript），制表符具有曾具有优势，因为与使用多个空格相比，它们减小源代码文件的大小。对于 Java\
    \ 来说，源代码文件的大小增大无关。\n\n### 单真大括号风格 (One True Brace Style)\n\n关于这种风格的优点有各种争论，但我们建议使用它主要因为它在\
    \ Java 社区很常见。\n\n虽然简单的 `if else` 语句可以通过省略大括号来写得更简洁，但我们建议始终包含它们。这减少了语句在非意图情况下被放置在条件之外的概率。\n\
    \n#### 组方法以便于理解\n\n### 总结\n\n类的公共方法应该出现在文件顶部，私有方法位于底部，任何受保护（protected）或包默认方法位于中间。\n\
    \n除了按照访问权限进行排列外，它们应该按照逻辑流进行排序。\n\n### 细节\n\n该方案试图实现两个目标：\n\n1. 通过将公共 API 与实现细节分离来突出公共\
    \ API\n2. 让读者以最少的滚动操作遵循逻辑流\n\n为了实现第二个目标，方法应该被逻辑分组，并且方法始终出现在它们所调用的方法之上。\n\n这两个目标显然是冲突的，因为将公共\
    \ API 方法分组在文件顶部会防止将它们与所使用的实现方法分组。如果这导致了大问题，可能表明该类承担了过多职责，可以重构为一个或多个更小的类。\n\n当实现方法从多个位置被调用或方法之间存在递归关系时，也会出现方法“正确”位置的问题。当然，这没有唯一的标准答案，任何大体符合第二个目标的排序都可以使用。\n\
    \n构造函数和静态工厂方法通常应该放在类的开头。然而，方法是 `static` 的这一事实，通常不应影响它放置的位置。\n\n#### 示例\n\n```java\n\
    public class Layout {\n\n  private int a;\n\n  Layout() {...}\n\n  public static\
    \ Layout create() {...}\n\n  public void api1() {\n    if (...) {\n      doFoo();\n\
    \    }\n  }\n\n  public void api2() {\n    if(...) {\n      doBar();\n    }\n\
    \  }\n\n  private void doFoo() {\n    while(...) {\n      handleA();\n      handleB();\n\
    \    }\n    leaf();\n  }\n\n  private void handleA() {...}\n\n  private void handleB()\
    \ {...}\n\n  private static void doBar() {\n    if (...) {\n      leaf();\n  \
    \  }\n  }\n\n  private void leaf() {...}\n}\n```\n\n字段（Fields）应该始终放在类的顶部，位于任何方法之前。\n\
    \n## 保持方法短而简单\n\n### 总结\n\n保持方法短而简单。\n\n### 细节\n\n小事物比大事物更容易理解。方法也一样。\n\n衡量方法大小的一种方法是通过它所包含的代码行数。\n\
    \n作为指南，方法长度通常不应超过 `7` 行。这不是一条硬性规定——只是一个关于何时对方法的大小感到不适的指南。\n\n衡量方法大小的另一种方法是看通过它的可能路径有多少。方法的“圈复杂度”（Cyclomatic\
    \ complexity）提供了这种衡量——它会随着条件逻辑数量和循环数量的增加而增加。\n\n作为指南，方法通常不应该有。\n"
- fmt: "\nNeither of the above changes alter the structure of our program or even\
    \ affect the signature of the method. Both still reduce both line count and complexity\
    \ while increasing readability.\n\nSimplifying things with a series of higher\
    \ impact changes that extract a model of our domain is, however, often the best\
    \ approach.\n\nIt is difficult to guess what this model might look like for our\
    \ contrived example, but is likely that this conditional logic could be replaced\
    \ with polymorphism.\n\n```\nenum ADomainConcept {\n  AAA(true),\n  ABA(true),\n\
    \  CC(true),\n  FWR(true),\n  OTHER(false),\n  ANDANOTHER(false);\n\n  private\
    \ final boolean isFnardy;\n  private ADomainConcept(boolean isFnardy) {\n    this.isFnardy\
    \ = isFnardy;\n  }\n\n  boolean  isFnardy() {\n    return isFnardy;\n  }\n}\n\
    ```\n\n## Using Appropriate Language Features\n\nMethods are sometimes bloated\
    \ by boilerplate that solves common programming problems. The need for some of\
    \ this boilerplate has been removed by new language features.\n\nSome of these\
    \ *new* features aren't all that new, but code is still written without them:\n\
    \n* Java 5 Generics removes the need for ugly casts\n* The Java 5 for-each-loop\
    \ can replace code using iterators and indexed loops\n* The Java 7 try-with-resources\
    \ can replace complex try, catch finally blocks\n* The Java 7 multi-catch can\
    \ replace repeated catch blocks\n* Java 8 lambda expressions can replace anonymous\
    \ class boilerplate\n\n# Methods Should Do One Thing\n\n## Methods Should Do Only\
    \ One Thing\n\n### Summary\nMethods should do only one thing.\n\n### Details\n\
    A useful guide as to whether a function is doing only one thing is given in \"\
    Clean Code\" by Robert C Martin.\n\n\"another way to know that a function is doing\
    \ more than “one thing” is if you can extract another function from it with a\
    \ name that is not merely a restatement of its implementation.\"\n\n*Bad*\n\n\
    ```\n public void updateFooStatusAndRepository(Foo foo) {\n     if ( foo.hasFjord()\
    \ ) {\n        this.repository(foo.getIdentifier(), this.collaborator.calculate(foo));\n\
    \     }\n\n     if (importantBusinessLogic()) {\n       foo.setStatus(FNAGLED);\n\
    \       this.collaborator.collectFnagledState(foo);\n     }\n  }\n```\n\n*Better*\n\
    \n```\n public void registerFoo(Foo foo) {\n     handleFjords(foo);\n     updateFnagledState(foo);\n\
    \  }\n\n  private void handleFjords(Foo foo) {\n      if ( foo.hasFjord() ) {\n\
    \        this.repository(foo.getIdentifier(), this.collaborator.calculate(foo));\n\
    \     }\n  }\n\n  private void updateFnagledState(Foo foo) {\n    if (importantBusinessLogic())\
    \ {\n       foo.setStatus(FNAGLED);\n       this.collaborator.collectFnagledState(foo);\n\
    \     }\n  }\n```\n\n*You've gone too far*\n\n```\n public void registerFoo(Foo\
    \ foo) {\n     handleFjords(foo);\n     updateFnagledState(foo);\n  }\n\n  private\
    \ void handleFjords(Foo foo) {\n      if ( foo.hasFjord() ) {\n        this.repository(foo.getIdentifier(),\
    \ this.collaborator.calculate(foo));\n     }\n  }\n\n  private void updateFnagledState(Foo\
    \ foo) {\n    if (importantBusinessLogic()) {\n       updateFooStatus(foo);\n\
    \       this.collaborator.collectFnagledState(foo);\n     }\n  }\n\n  private\
    \ void updateFooStatus(Foo foo) {\n    foo.setStatus(FNAGLED);\n  }\n```\n\n#\
    \ Avoid Null\n\n## Avoid Null Whenever Possible\n\n### Summary\nNull is a billion\
    \ dollar mistake, make sure you know how to avoid using it in your code.\n\nTry\
    \ to limit the times you or your clients need to write the following:\n\n```\n\
    \ if ( != null ) {\n    ...\n  }\n```\n\n### Details\nAlthough it is likely that\
    \ libraries and frameworks you interact with will return null, you should try\
    \ to ensure that this practice is isolated to third party code.\n\nThe core of\
    \ your application should assume that it does not have to worry about null values.\n\
    \nStrategies to avoid null include:\n\n* The null object pattern - when you have\
    \ something you think is optional\n* The type-safe null pattern (aka Option, Optional\
    \ & Maybe) - when you need to express that an interface might not return something\n\
    * Design by contract\n\n### The Null Object Pattern\nThe null object pattern is\
    \ the classic OO approach to avoiding null. You should use it whenever you think\
    \ you have a dependency that you think is optional.\n\nThe pattern is very simple,\
    \ just provide an implementation of the interface that does \"nothing\" or has\
    \ a neutral behavior. This can then be safely referenced by its clients, with\
    \ no need to check for null.\n\n### Type-Safe Nulls (aka Optional)\nThe type-safe\
    \ null pattern is familiar in most functional programming languages where it is\
    \ variously known as Maybe, Option or Optional. Java 8 finally adds an Optional\
    \ type, but implementations are available for earlier versions via Guava and other\
    \ libraries.\n\nIt is a simple pattern. An `Optional` is basically basically just\
    \ a box that can hold either one or zero values. You can check if the box is empty\
    \ (using `isPresent`) and retrieve its value via a `get` method.\n\n`Optional`\
    \ should be used whenever a public method might not return a value as part of\
    \ normal program flow.\n\nIf you call `get` on an empty `Optional`, it will throw\
    \ a `NoSuchElementException`.\n\nIt might not be immediately obvious what Optional\
    \ provides over just using null. There are several important differences.\n\n\
    Firstly, if your method declares `Optional<Person>` then you can instantly see\
    \ from the type signature it might not return a value. If it only returned `Person`\
    \ you would only know it might return null if you looked at the source or documentation.\n\
    \nEqually important, if you know that a method returning `Person` will always\
    \ return a value and never return null.\n\nFinally, the preferred way to use Optionals\
    \ is not to call the `get` method or to explicitly check if it contains a value.\
    \ Instead the values that are contained (or not contained) in an `Optional` can\
    \ be safely mapped, consumed and filtered by various method.\n\nIn the simplest\
    \ case a possibly empty `Optional` can be accessed by calling the `orElse` method\
    \ which takes a default value to use if the `Optional` is empty.\n\nAs mentioned,\
    \ the sweet spot for using Optionals is for the return types for methods. They\
    \ should not generally be held as fields (use the null object pattern instead)\
    \ or passed to public methods (instead provide overloaded versions that do not\
    \ require the parameter).\n\nOne objection that is sometimes raised by Java programmers\
    \ encountering `Optional` for the first time is that it is possible for an `Optional`\
    \ to be null itself. While this is true, returning a null `Optional` from a method\
    \ is a perverse thing to do and should be considered a coding error.\n\nStatic\
    \ analysis rules exists that can check for code that returns null Optionals.\n\
    \n### Design by Contract\nWe wish for all code that we control to be able to ignore\
    \ the existence of null (unless it interfaces with some third party code that\
    \ forces us to consider it).\n\n`Objects.requireNonNull` can be used to add a\
    \ runtime assertion that null has not been passed to a method.\n\nBecause your\
    \ core code should generally assume that null will never be passed around, there\
    \ is little value in documenting this behavior with tests; assertions add value\
    \ because they ensure that an error occurs close to the point where the mistake\
    \ was made.\n\nWe can also check this contract at build time.\n\nJSR-305 provides\
    \ annotations that can be used to declare where null is acceptable. Although JSR-305\
    \ is dormant, and shows no signs of being incorporated into Java in the near future,\
    \ the annotations are available at the maven co-ordinates :-\n\n```xml\n<dependency>\n\
    \    <groupId>com.google.code.findbugs</groupId>\n    <artifactId>jsr305</artifactId>\n\
    \    <version>3.0.1</version>\n</dependency>\n```\n\nThey are supported by several\
    \ static analysis tools including :-\n"
