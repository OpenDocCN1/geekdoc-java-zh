    # Introduction\n\n# Introduction\n\n## What is This?\n\nThis book is an attempt\
    \ to capture what *\"good\"* Java code looks like and the practices that help\
    \ produce it.\n\nThis is a problematic document to write.\n\nThere is no one right\
    \ answer to what good code looks like and there are many well-respected books\
    \ that serve the same purpose such as *Effective Java*, *Clean Code* and others.\n\
    \nSo why this document?\n\nIt differentiates itself by being :\n\n*   Freely distributable\n\
    \n*   Open for update - contributions, corrections and updates are encouraged\n\
    \n*   Brief - much is left out in an attempt to be easily digestible\n\n*   Narrow\
    \ - it captures one opinion of *\"good\"* appropriate for a specific context\n\
    \nThis last point is important.\n\nWe assume a number of things about you and\
    \ the environment you are working in.\n\n*   We assume you are writing server\
    \ side Java in *small* teams.\n\n*   We assume your teams are of mixed experience\
    \ (some experts, some beginners).\n\n*   We assume you are writing code in a general\
    \ \"business\" context.\n\n*   We assume you expect the code to still be in use\
    \ in five years' time.\n\nSome of the suggestions may be valid in other contexts,\
    \ others might constitute terrible advice for those contexts.\n\nIt is also just\
    \ one opinion from many valid alternatives. To be useful it needs to be an opinion\
    \ that you can agree with and sign up to. If you disagree with something in this\
    \ book please make your own thoughts known so it can be improved.\n\nFinally,\
    \ not all the code we work on is perfect. Sometimes we inherit our own mistakes,\
    \ sometimes we inherit other people's.\n\nThe point of this document is not to\
    \ say that all code must look like this but to have an agreed destination that\
    \ we are aiming for.\n\n## Who is This For?\n\nThis document is intended for consumption\
    \ by anyone involved with writing server side Java code. From developers writing\
    \ Java for the first time through to seasoned technical leads serving multiple\
    \ teams.\n\nSome sections will be more relevant to some audiences than others\
    \ but we encourage everyone to at least skim all sections even if you do not read\
    \ them in depth.\n\n## Structure\n\nThe document is split into five sections:\n\
    \n*   Process - Discussion on development philosophy and workflow\n\n*   Style\
    \ - Good style and design at a high level\n\n*   Specifics - More specific advice\
    \ on Java language features and gotchas\n\n*   Good tests - How to write good\
    \ tests\n\n*   Bad advice - Discussion of some commonly circulated bad advice\
    \ and patterns\n\n## Version\n\nThis book is updated often. The latest changes\
    \ to the book can be viewed online at [gitbook.com](https://ncrcoe.gitbooks.io/java-for-small-teams/content/).\n\
    \nVersioned releases are available for free from [the book's website](http://javabook.ncredinburgh.com).\n\
    \nIf you are reading a PDF or print copy of this book the release version will\
    \ be displayed on the inside cover. If there is no inside cover then you are reading\
    \ an unreleased version of the book.\n\n## History\n\nMost of the content of this\
    \ book began life as internal wiki pages at [NCR Edinburgh](http://ncredinburgh.com).\
    \ We started to convert the wiki into this book at the end of 2015 so that it\
    \ could be easily shared with other parts of our company.\n\nRather than keep\
    \ this as an internal document we decided to open it up to everyone in the hope\
    \ that together we could make it better.\n\n## A word on Trade-Offs\n\nThere are\
    \ no right answers in software engineering.\n\nIt is a balancing act in which\
    \ we must trade off one concern against another and make a judgement call about\
    \ which balance is better for the specific scenario we have found ourselves in."
