    \ version we would need to re-implement the decorator for each concrete type to\
    \ which we wished to add the upper case behavior.\n\nMany common OO patterns rely\
    \ on the combination of Composition and interface inheritance.\n\n### When to\
    \ Use Implementation Inheritance\n\nAlmost anything that can be achieved with\
    \ implementation inheritance can also be achieved using the combination of interface\
    \ inheritance and composition.\n\nSo when should implementation inheritance be\
    \ used?\n\nImplementation inheritance has one single advantage over composition\
    \ - it's less verbose.\n\nSo implementation inheritance should be used when **both**\
    \ of the following conditions are met\n\n1.  There is an IS-A relationship to\
    \ be modelled\n\n2.  The composition based approach would result in too much boilerplate\
    \ code\n\nThe 2nd point is unfortunately entirely subjective.\n\n# Keep It Solid\n\
    \n## Keep It SOLID\n\n### Summary\n\nThe SOLID acronym provides some guidance\
    \ on design that you should follow.\n\n*   **S**ingle Responsibility Principle\n\
    \n*   **O**pen Closed Principle\n\n*   **L**iskov Substitution Principle\n\n*\
    \   **I**nterface Segregation Principle\n\n*   **D**ependency Inversion Principle\n\
    \n### Details\n\n#### Single Responsibility Principle\n\nSeparate your concerns\
    \ - a class should do one thing and one thing only. To put it another way, a class\
    \ should have a single reason to change.\n\n#### Open / Closed Principle\n\nYou\
    \ should be able to extend behavior, without modifying existing code.\n\n*\"..\
    \ you should design modules that never change. When requirements change, you extend\
    \ the behavior of such modules by adding new code, not by changing old code that\
    \ already works.\"*\n\n*— Robert Martin*\n\nAn indication that you might not be\
    \ following this principle is the presence of `switch` statements or `if/else`\
    \ logic in your code.\n\n#### Liskov Substitution Principle\n\nDerived classes\
    \ must be substitutable for their base classes.\n\nOne indication that you are\
    \ breaking this principle is the presence of `instanceof` statements in your code.\n\
    \n#### Interface Segregation Principle\n\nThe Interface Segregation Principle\
    \ states that clients should not be forced to implement interfaces they don't\
    \ use; prefer small, tailored interfaces to large, catch-all ones.\n\nOne indication\
    \ that you might be breaking this principle is the presence of empty methods or\
    \ methods throwing `OperationNotSupportedException` in your code.\n\n#### Dependency\
    \ Inversion Principle\n\nHigh-level modules should not depend upon low-level modules.\
    \ Both should depend upon abstractions.\n\nAbstractions should never depend upon\
    \ details. Details should depend upon abstractions.\n\nIn practice this means\
    \ you should follow one of two patterns:\n\n1.  Package the interfaces a 'high-level'\
    \ component depends upon with that component\n\n2.  Package the interface a component\
    \ depends upon separately from both the client and implementation\n\nThis first\
    \ approach is classic dependency inversions (contrast it with the traditional\
    \ approach of have the high level component depend upon the lower layers).\n\n\
    The second approach is known as the \"Separated Interface Pattern\". It is a little\
    \ more heavy weight, but also more flexible as it makes no assumption about who\
    \ should own the interface.\n\nAn indication that you are breaking this principle\
    \ is the presence of package cycles within your code.\n\n# Keep Your Code Dry\n\
    \n## Keep Your Code DRY\n\n### Summary\n\nDon't Repeat Yourself (DRY) - avoid\
    \ writing the same logic more than once.\n\nEvery time you copy and paste code,\
    \ flick yourself in the eye. This is a great disincentive to doing it again but\
    \ over time may cause blindness.\n\n### Details\n\nIf the same logic is required\
    \ more than once then it should not be duplicated; it should instead, be extracted\
    \ to a well named class or method.\n\nThis will be both easier to read and easier\
    \ to maintain because a change will only be required in one place should the logic\
    \ need to change.\n\n*Bad*\n\n```\nclass Foo {\n   private int status;\n   private\
    \ boolean approved;\n\n   foo() {\n     if (status == 12 || approved) {\n    \
    \   doFoo();\n     }\n   }\n\n   bar() {\n     if (status == 12 || approved) {\n\
    \       doBar();\n     }\n   }\n}\n```\n\n*Better*\n\n```\nclass Foo {\n   private\
    \ final static int PRE_APPROVED = 12;\n\n   private int status;\n   private boolean\
    \ approved;\n\n   foo() {\n     if (isApproved()) {\n       doFoo();\n     }\n\
    \   }\n\n   bar() {\n     if (isApproved()) {\n       doBar();\n     }\n   }\n\
    \n   private isApproved() {\n     return status == PRE_APPROVED || approved;\n\
    \   }\n}\n```\n\nThings are a little trickier when we have similar but not identical\
    \ logic.\n\nAlthough it is quick and easy, the worst thing we can do is copy and\
    \ paste.\n\n**Terrible**\n\n```\npublic void doSomething(List<Widget> widgets)\
    \ {\n  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if (widget.snortles()\
    \ > 0) {\n      reportDeviance(widget);\n      performSideEffect(widget);\n  \
    \  }\n  }\n}\n\npublic void doSomethingSimilar(List<Widget> widgets) {\n  for\
    \ (Widget widget : widgets) {\n    reportExistence(widget);\n    if (widget.snortles()\
    \ > 0) {\n      reportDeviance(widget);\n      performDifferentSideEffect(widget);\n\
    \    }\n  }\n}\n```\n\nThis seemed quick and easy now, but is the start of a codebase\
    \ that will suck time each time we try to understand or change it.\n\nA straightforward\
    \ but very limited approach to re-use code is to introduce Boolean flags.\n\n\
    **Not great**\n\n```\npublic void doSomething(List<Widget> widgets) {\n  doThings(widgets,\
    \ false);\n}\n\npublic void doSomethingSimilar(List<Widget> widgets) {\n  doThings(widgets,\
    \ true);\n}\n\nprivate void doThings(List<Widget> widgets, boolean doDifferentSideEffect)\
    \ {\n  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if (widget.snortles()\
    \ > 0) {\n      reportDeviance(widget);\n      if (doDifferentSideEffect) {\n\
    \        performDifferentSideEffect(widget);\n      } else {\n        performSideEffect(widget);\n\
    \      }\n    }\n  }\n}\n```\n\nThis is ugly and gets worse as the number of possibilities\
    \ increases.\n\nA much more scalable approach is to use the Strategy pattern.\n\
    \nIf we introduce an interface:\n\n```\ninterface WidgetAction {\n   void apply(Widget\
    \ widget);\n}\n```\n\nThen we can use it as follows:\n\n**Better**\n\n```\npublic\
    \ void doSomething(List<Widget> widgets) {\n  doThings(widgets, performSideEffect());\n\
    }\n\npublic void doSomethingSimilar(List<Widget> widgets) {\n  doThings(widgets,\
    \ performDifferentSideEffect());\n}\n\nprivate WidgetAction performSideEffect()\
    \ {\n  return new WidgetAction() {\n    @Override\n    public void apply(Widget\
    \ widget) {\n      performSideEffect(widget);\n    }\n  };\n}\n\nprivate WidgetAction\
    \ performDifferentSideEffect() {\n  return new WidgetAction() {\n    @Override\n\
    \    public void apply(Widget widget) {\n      performDifferentSideEffect(widget);\n\
    \    }\n  };\n}\n\nprivate void doThings(List<Widget> widgets, WidgetAction action\
    \ ) {\n  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if\
    \ (widget.snortles() > 0) {\n      reportDeviance(widget);\n      action.apply(widget);\n\
    \    }\n  }\n}\n```\n\nThe Java 7 version is quite verbose due to the anonymous\
    \ inner class boiler plate."
