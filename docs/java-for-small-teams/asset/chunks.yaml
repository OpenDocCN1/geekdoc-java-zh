  trans: "\nJavadoc 可以帮助文档化代码，但通常有更好的方法。在决定编写它之前，请仔细考虑。\n\n## Javadoc 详情\n\n### Javadoc\
    \ 的优点\n对于那些无法访问源码必须使用你代码的外部团队来说，Javadoc 是无价的。\n\n所有外部使用的代码其公共方法都应该 javadoc。\n\n\
    确保所有此类 javadoc 都集中在方法*做了什么*，而不是它是*怎么做的*。\n\n### Javadoc 的缺点\nJavadoc 重复了本该从代码本身就能清晰看出的信息，并且会带来持续的维护成本。\n\
    \n如果它没有与代码同步更新，就会产生误导性。\n\n不要对仅由你的直接团队使用和维护的代码编写 Javadoc。相反，要花精力确保代码能够自说明。\n\n\
    # 记住 KISS 和 YAGNI\n\n## 记住 KISS 和 YAGNI\n\n### 总结\n保持你的设计尽可能简单。\n\n只创建你现在需要的功能——而不是你认为未来可能需要的功能。\n\
    \n### 详情\nKISS（保持简单，愚蠢蛋）和 YAGNI（你并不需要它）缩写词提供了良好的建议，在编码时值得记住。\n\nKISS 建议我们保持代码和设计尽可能简单。\n\
    \n很少有人不同意这一点，但遗憾的是，*简单*的含义并不总是显见的。\n\n给定问题的两个解决方案，哪一个更简单？\n\n* 代码行最少的那个？\n* 类数量最少的那个？\n\
    * 使用第三方依赖最少的那个？\n* 分支语句少的那个？\n* 逻辑最显式的那个？\n* 与其他使用的解决方案一致的那个？\n\n以上所有都是*简单*的合理定义。其中没有哪一个是始终通用的单一定义。\n\
    \n识别出什么是简单并不容易，而保持简单则需要大量工作。\n\n如果我们能以某种方式衡量软件的复杂度，我们就会发现每件软件都必须包含某个最小值。\n\n如果软件比这更简单，那么它的功能就会更少。\n\
    \n真实的程序始终会包含这种*固有复杂度*再加上额外的一部分。这些额外的复杂度是我们由于自身不完美而添加的*意外复杂度*。\n\n当然，将意外复杂度与固有复杂度区分开来也是困难的。\n\
    \n幸运的是，YAGNI 为我们提供了实用的建议，告诉我们如何在不需要区分意外和固有复杂性的情况下保持简单。\n\n系统执行的操作越多，其整体复杂度就越高。如果我们做一个功能较少的系统，它就会更简单——它将拥有更少的*固有复杂度*和更少的*意外复杂度*。\n\
    \n因此，你的目标是创建解决你**现在**问题的最少功能。\n\n* 不要因为你认为以后可能需要就实现某些东西。如果以后需要，将来再实现。\n* 不要试图让事情变得“灵活”或“可配置”。让它们只做该做的事——在你有需要的时候再对其进行参数化。\n\
    \n如果你创建了超过最少的功能，从那时刻起，你将有更多的代码需要调试、理解和维护，直到有人有信心删除它们。\n\n# 偏好组合\n\n## 偏好组合而非继承\n\
    \n### 总结\n组合通常会导致更灵活的设计。\n\n首先考虑使用组合，只有当组合看起来不合适时，才退而求助于继承。\n\n### 详情\n组合意味着通过将其他东西组合在一起来构建。继承意味着通过创建子类来扩展现有类的行为以构建构建。\n\
    \n举一个极简的例子——如果要求一个类要接受并存储 `String` 值，一些初学 Java 的程序员会按照如下方式使用继承：\n\n```\nclass\
    \ InheritanceAbuse extends ArrayList<String> {\n\n  public void performBusinessLogic(int\
    \ i) {\n    // 对存储的字符串进行操作\n  }\n\n}\n```\n\n相同的功能可以使用组合来实现。\n\n```\nclass UsesComposition\
    \ {\n\n  private final List<String> values = new ArrayList<String>();\n\n  public\
    \ void performBusinessLogic(int i) {\n    // 对存储的字符串进行操作\n  }\n\n  public void\
    \ add(String value) {\n    this.values.add(value);\n  }\n\n}\n```\n\n尽管需要更多代码，但经验丰富的\
    \ Java 程序员甚至不会考虑第一种方法。那么，为什么第二个版本更好呢？\n\n有几个重叠的解释，我们将从最抽象的开始，然后转向更实用的解释。\n\n###\
    \ 继承是强关系\n继承用于建模 IS-A（是一个）关系——即，我们是在说我们的 `InheritanceAbuse` 类是一个 `ArrayList`，并且应该能够将其传递给任何接受\
    \ `ArrayList` 的代码片段。\n\n组合创建了 HAS-A（有一个）关系；这是一种较弱的关系，我们**代码中应该总是倾向于较弱的关系。\n\n\
    因此，偏好组合而非继承只是“倾向于类与类之间弱关系”这一更通用建议的一个特定实例。\n\n当存在 IS-A 关系时，使用继承是有意义的，但纯粹为了重用代码并不是合适的机制。\n\
    \n### 继承破坏了封装\n继承实现未能封装一个实现细节——即我们把东西存储在 `ArrayList` 中。\n\n我们类的接口包含了来自 `ArrayList`\
    \ 的各种方法，例如：\n\n* `clear`\n* `remove`\n* `contains`\n\n这些方法对我们的类有意义吗？如果有人调用了它们，会干扰\
    \ `performBusinessLogic` 中的逻辑吗？\n\n我们对这个示例类意图做什么了解得不够，无法确定性地回答这些问题，但答案很可能是我们更倾向于不暴露这些方法。\n\
    \n如果我们从 `ArrayList` 切换到其他列表实现，这对客户端是可见的。即使没有调用 `ArrayList` 的特定方法，之前编译的代码现在可能会崩溃。\n\
    \n### 我们只能这样做一次\nJava 不支持多继承，所以我们只能选择一个要扩展的东西。如果我们的类还需要存储 `Integer`，那么继承甚至不是选项，我们必须使用组合。\n\
    \n在单继承语言中，组合天生更灵活。\n\n### 组合有助于测试\n这与我们的简单示例无关，但测试通过组合连接的类如何交互是非常而易举的。使用继承时则困难得多。\n\
    \n```\nclass UntestableClass extends SomeDependency {\n  public void performBusinessLogic(int\
    \ i) {\n    // 使用 SomeDependency 的方法操作\n  }\n}\n```\n\n```\nclass MyClass {\n\
    \  private final SomeDependency dependency;\n\n  MyClass(SomeDependency dependency)\
    \ {\n    this.dependency = dependency;\n  }\n\n  public void performBusinessLogic(int\
    \ i) {\n    // 使用 dependency 进行操作\n  }\n}\n```\n\n向 `MyClass` 注入 mock 很容易。存在技巧可以为了单元测试隔离\
    \ `UntestableClass` 与 `SomeDependency`，但要复杂得多。\n\n### 继承是静态的\n继承在编译时设置了具体类之间的固定关系。通过组合，可以在运行时切换不同的具体类。\n\
    \n再次，组合天生更灵活。\n\n### 接口继承\n偏好组合而非继承的建议指的是*实现继承*（即扩展类）。上述讨论的缺点并不适用于*接口继承*（即实现接口）。\n\
    \n事实上，你通常必须做的设计选择是在实现继承与组合与接口继承的结合之间进行。\n\n在这些情况下，建议仍然是倾向于使用组合的方法。\n\n"
- fmt: "\nFor example, the well known composition based Decorator pattern:\n\n```java\n\
    class ProcessorUpperCaseDecorator implements Processor {\n\n  private final Processor\
    \ child;\n\n  ProcessorUpperCaseDecorator(Processor child) {\n    this.child =\
    \ child;\n  }\n\n  @Override\n  public void process(String someString) {\n   \
    \ child.process(someString.toUpperCase());\n  }\n\n}\n```\n\nCould also be implemented\
    \ using inheritance\n\n```java\nclass InheritanceUpperCaseDecorator extends ConcreteProcessor\
    \ {\n\n  @Override\n  public void process(String someString) {\n    super.process(someString.toUpperCase());\n\
    \  }\n\n}\n```\n\nBut, again, this solution would be less flexible.\n\nWith the\
    \ composition based version we can decorate any `Processor`. With the inheritance\
    \ version we would need to re-implement the decorator for each concrete type to\
    \ which we wished to add the upper case behavior.\n\nMany common OO patterns rely\
    \ on the combination of Composition and interface inheritance.\n\n## When to Use\
    \ Implementation Inheritance\n\nAlmost anything that can be achieved with implementation\
    \ inheritance can also be achieved using the combination of interface inheritance\
    \ and composition.\n\nSo when should implementation inheritance be used?\n\nImplementation\
    \ inheritance has one single advantage over composition - it's less verbose.\n\
    \nSo implementation inheritance should be used when `both` of the following conditions\
    \ are met:\n\n1. There is an IS-A relationship to be modelled\n2. The composition\
    \ based approach would result in too much boilerplate code\n\nThe 2nd point is\
    \ unfortunately entirely subjective.\n\n# Keep It Solid\n\n## Keep It SOLID\n\n\
    ### Summary\n\nThe SOLID acronym provides some guidance on design that you should\
    \ follow.\n\n* **S**ingle Responsibility Principle\n* **O**pen Closed Principle\n\
    * **L**iskov Substitution Principle\n* **I**nterface Segregation Principle\n*\
    \ **D**ependency Inversion Principle\n\n### Details\n\n#### Single Responsibility\
    \ Principle\n\nSeparate your concerns - a class should do one thing and one thing\
    \ only. To put it another way, a class should have a single reason to change.\n\
    \n#### Open / Closed Principle\n\nYou should be able to extend behavior, without\
    \ modifying existing code.\n\n\".. you should design modules that never change.\
    \ When requirements change, you extend the behavior of such modules by adding\
    \ new code, not by changing old code that already works.\"\n\n— Robert Martin\n\
    \nAn indication that you might not be following this principle is the presence\
    \ of `switch` statements or `if/else` logic in your code.\n\n#### Liskov Substitution\
    \ Principle\n\nDerived classes must be substitutable for their base classes.\n\
    \nOne indication that you are breaking this principle is the presence of `instanceof`\
    \ statements in your code.\n\n#### Interface Segregation Principle\n\nThe Interface\
    \ Segregation Principle states that clients should not be forced to implement\
    \ interfaces they don't use; prefer small, tailored interfaces to large, catch-all\
    \ ones.\n\nOne indication that you might be breaking this principle is the presence\
    \ of empty methods or methods throwing `OperationNotSupportedException` in your\
    \ code.\n\n#### Dependency Inversion Principle\n\nHigh-level modules should not\
    \ depend upon low-level modules. Both should depend upon abstractions.\n\nAbstractions\
    \ should never depend upon details. Details should depend upon abstractions.\n\
    \nIn practice this means you should follow one of two patterns:\n\n1. Package\
    \ the interfaces a 'high-level' component depends upon with that component\n2.\
    \ Package the interface a component depends upon separately from both the client\
    \ and implementation\n\nThis first approach is classic dependency inversions (contrast\
    \ it with the traditional approach of have the high level component depend upon\
    \ the lower layers).\n\nThe second approach is known as the \"Separated Interface\
    \ Pattern\". It is a little more heavy weight, but also more flexible as it makes\
    \ no assumption about who should own the interface.\n\nAn indication that you\
    \ are breaking this principle is the presence of package cycles within your code.\n\
    \n# Keep Your Code Dry\n\n## Keep Your Code DRY\n\n### Summary\n\nDon't Repeat\
    \ Yourself (DRY) - avoid writing the same logic more than once.\n\nEvery time\
    \ you copy and paste code, flick yourself in the eye. This is a great disincentive\
    \ to doing it again but over time may cause blindness.\n\n### Details\n\nIf the\
    \ same logic is required more than once then it should not be duplicated; it should\
    \ instead, be extracted to a well named class or method.\n\nThis will be both\
    \ easier to read and easier to maintain because a change will only be required\
    \ in one place should the logic need to change.\n\n*Bad*\n\n```java\nclass Foo\
    \ {\n   private int status;\n   private boolean approved;\n\n   foo() {\n    \
    \ if (status == 12 || approved) {\n       doFoo();\n     }\n   }\n\n   bar() {\n\
    \     if (status == 12 || approved) {\n       doBar();\n     }\n   }\n}\n```\n\
    \n*Better*\n\n```java\nclass Foo {\n   private final static int PRE_APPROVED =\
    \ 12;\n\n   private int status;\n   private boolean approved;\n\n   foo() {\n\
    \     if (isApproved()) {\n       doFoo();\n     }\n   }\n\n   bar() {\n     if\
    \ (isApproved()) {\n       doBar();\n     }\n   }\n\n   private isApproved() {\n\
    \     return status == PRE_APPROVED || approved;\n   }\n}\n```\n\nThings are a\
    \ little trickier when we have similar but not identical logic.\n\nAlthough it\
    \ is quick and easy, the worst thing we can do is copy and paste.\n\n**Terrible**\n\
    \n```java\npublic void doSomething(List<Widget> widgets) {\n  for (Widget widget\
    \ : widgets) {\n    reportExistence(widget);\n    if (widget.snortles() > 0) {\n\
    \      reportDeviance(widget);\n      performSideEffect(widget);\n    }\n  }\n\
    }\n\npublic void doSomethingSimilar(List<Widget> widgets) {\n  for (Widget widget\
    \ : widgets) {\n    reportExistence(widget);\n    if (widget.snortles() > 0) {\n\
    \      reportDeviance(widget);\n      performSideEffect(widget);\n    }\n  }\n\
    }\n```\n\nThis seemed quick and easy now, but is the start of a codebase that\
    \ will suck time each time we try to understand or change.\n\nA straightforward\
    \ but very limited approach to re-use code is to introduce Boolean flags.\n\n\
    **Not great**\n\n```java\npublic void doSomething(List<Widget> widgets) {\n  doThings(widgets,\
    \ false);\n}\n\npublic void doSomethingSimilar(List<Widget> widgets) {\n  doThings(widgets,\
    \ true);\n}\n\nprivate void doThings(List<Widget> widgets, boolean doSideEffect)\
    \ {\n  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if (widget.snortles()\
    \ > 0) {\n      reportDeviance(widget);\n      if (doSideEffect) {\n        performDifferentSideEffect(widget);\n\
    \      } else {\n        performSideEffect(widget);\n      }\n    }\n  }\n}\n\
    ```\n\nThis is ugly and gets worse as the number of possibilities increases.\n\
    \nA much more scalable approach is to use the Strategy pattern.\n\nIf we introduce\
    \ an interface:\n\n```java\ninterface WidgetAction {\n   void apply(Widget widget);\n\
    }\n```\n\nThen we can use it as follows:\n\n**Better**\n\n```java\npublic void\
    \ doSomething(List<Widget> widgets) {\n  doThings(widgets, performSideEffect());\n\
    }\n\npublic void doSomethingSimilar(List<Widget> widgets) {\n  doThings(widgets,\
    \ performDifferentSideEffect());\n}\n\nprivate WidgetAction performSideEffect()\
    \ {\n  return new WidgetAction() {\n    @Override\n    public void apply(Widget\
    \ widget) {\n      performSideEffect(widget);\n    }\n  };\n}\n\nprivate WidgetAction\
    \ performDifferentSideEffect() {\n  return new WidgetAction() {\n    @Override\n\
    \    public void apply(Widget widget) {\n      performDifferentSideEffect(widget);\n\
    \    }\n  };\n}\n\nprivate void doThings(List<Widget> widgets, WidgetAction action\
    \ ) {\n  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if\
    \ (widget.snortles() > 0) {\n      reportDeviance(widget);\n      action.apply(widget);\n\
    \    }\n  }\n}\n```\n\nThe Java 7 version is quite verbose due to the anonymous\
    \ inner class boiler plate.\n"
