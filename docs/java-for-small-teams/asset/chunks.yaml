    \ test describes should normally relate to the overall *unit* rather than the\
    \ responsibilities of an individual method.\n\n### What is a Unit?\n\nTo think\
    \ in terms of units we have to first answer the difficult question of what a *unit*\
    \ actually is.\n\nTesting in terms of methods is effectively the same as saying\
    \ that a *unit* is a method. It is easy to show why this does not always work.\n\
    \nIf we were to try and write a unit test for the `push` method of `java.util.Stack`\
    \ we might end up with something like:\n\n```\n@Test\npublic void testPush() {\n\
    \   Stack<String> testee = new Stack<String>();\n   testee.push(\"foo\");\n  \
    \ assertThat(testee.pop()).isEqualTo(\"foo\");\n};\n```\n\nNow lets test the `pop`\
    \ method:\n\n```\n@Test\npublic void testPop() {\n   Stack<String> testee = new\
    \ Stack<String>();\n   testee.push(\"foo\");\n   assertThat(testee.pop()).isEqualTo(\"\
    foo\");\n};\n```\n\nOh. That looks familiar.\n\nThe problem we are hitting is\
    \ that we have defined too small a *unit*. We are trying to describe the behavior\
    \ of something that is only useful when it collaborates with other *units* of\
    \ the same size.\n\nIf we start thinking of `java.util.Stack` as our *unit* then\
    \ tests become much easier to write:\n\n```\n@Test\npublic void shouldRetrieveValuesInOrderTheyAreAdded()\
    \ {\n  Stack<String> testee = new Stack<String>();\n  testee.push(\"a\");\n  testee.push(\"\
    b\");\n  assertThat(testee.pop()).isEqualTo(\"b\");\n  assertThat(testee.pop()).isEqualTo(\"\
    a\");\n}\n```\n\nWe have written a test that, instead of trying to describe what\
    \ a method does, describes the behavior of the class as a whole.\n\nThe idea that\
    \ our job is to test methods is common with developers that are new to unit testing,\
    \ and is unfortunately re-enforced by some IDEs and tools that provide templates\
    \ to generate tests for each method of a class.\n\nAs we have seen, for `Stack`\
    \ it makes far more sense to consider the behavior of the class of a whole.\n\n\
    ### Are Classes Units?\n\nIt often does make sense to treat a class as a *unit*\
    \ so this is a good default definition, but it isn't always the right granularity.\n\
    \nIf we were to try to test the `java.util.Collections` class we would find that\
    \ it is perfectly reasonable to treat the `sort`, `reverse` , `singleton`, etc.\
    \ methods as separate *units*. Each one represents a self contained logical behavior.\n\
    \nSo sometimes *units* are as small as methods.\n\nSometimes they are also larger\
    \ than a single class.\n\nIf we were to inherit the code below without any tests\
    \ what tests might we write for it?\n\n```\npublic class ThingaMeBob {\n\n  private\
    \ final Iterable<MatchingBinaryOperator> actions;\n\n  ThingaMeBob() {\n    actions\
    \ = Arrays.asList(new Addition(), new Subtraction());\n  }\n\n  public int process(String\
    \ s, int a, int b) {\n    for (MatchingBinaryOperator each : actions) {\n    \
    \  if (each.match(s)) {\n        return each.apply(a,b);\n      }\n    }\n\n \
    \   throw new RuntimeException();\n  }\n\n}\n\nclass Addition implements MatchingBinaryOperator\
    \ {\n  public boolean match(String s) {\n    return \"add\".equals(s);\n  }\n\
    \  public int apply(int a, int b) {\n    return a + b;\n  }\n}\n\nclass Subtraction\
    \ implements MatchingBinaryOperator {\n  public boolean match(String s) {\n  \
    \  return \"minus\".equals(s);\n  }\n  public int apply(int a, int b) {\n    return\
    \ a - b;\n  }\n}\n```"
