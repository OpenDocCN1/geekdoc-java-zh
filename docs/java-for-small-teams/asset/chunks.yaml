    \ based testing, we check that objects talk to each other in the expected fashion.\
    \ To do this we need to somehow eavesdrop on the conversation. This is achieved\
    \ by using objects that impersonate real ones.\n\nUsually these are created using\
    \ a mocking framework.\n\n### Mocking Frameworks\n\nAlthough it is common to refer\
    \ to all objects created by a mocking framework as mocks this is inaccurate.\n\
    \nA more correct generic term for these objects is *test double*.\n\nThese can\
    \ be subdivided based on how they behave:\n\n*   Dummy object - needs to be present\
    \ to satisfy a type signature but is never actually used\n\n*   Stub - must be\
    \ present and may supply *indirect inputs*\n\n*   Mock - verifies that expected\
    \ interactions take place\n\n*   Fake - like a real thing but less heavy - e.g\
    \ an in memory database\n\n*   Spy - object that records its interactions with\
    \ others\n\nOf these only stubs, mocks and spies might be created by a mocking\
    \ framework.\n\nWe will talk about spies in a moment, but most test doubles can\
    \ be conceptually viewed as being either a stub or a mock.\n\nThe important difference\
    \ between them is that a mock has an expectation that will cause a test to fail\
    \ if it is not met. i.e. if an expected method is not called on a mock the test\
    \ will fail.\n\nA stub does not care if it is called or not - its role is simply\
    \ to supply values.\n\nTraditional Mocks present a code readability dilemma. They\
    \ define an expected outcome (a *then*), but are also part of the fixture required\
    \ for the test to execute (a *given*).\n\nFor example with JMock we would write:\n\
    \n```\n Mockery context = new Mockery();\n\n  // given / arrange\n  Subscriber\
    \ subscriber = context.mock(Subscriber.class);\n  Publisher publisher = new Publisher();\n\
    \  publisher.add(subscriber);\n\n  final String message = \"message\";\n\n  //\
    \ then / assert . . . but we haven't had a when yet\n  context.checking(new Expectations()\
    \ {{\n    oneOf (subscriber).receive(message);\n  }});\n\n  // when / act\n  publisher.publish(message);\n\
    \n  // then / assert\n  context.assertIsSatisfied();\n```\n\nSpies solve this\
    \ problem neatly.\n\n### Spies\n\nSpies record their interactions with other objects.\n\
    \nIn practice this means that Spies act as stubs by default, but as mocks when\
    \ we want them to.\n\nThe given/when/then flow becomes easy and natural to maintain.\n\
    \nFor example, using Mockito:\n\n```\n // given\n  Subscriber subscriber = Mockito.mock(Subscriber.class);\n\
    \  Publisher publisher = new Publisher();\n  publisher.add(subscriber);\n  String\
    \ message = \"message\";\n\n  // when\n  publisher.publish(message);\n\n  // then\n\
    \  Mockito.verify(subscriber).receive(message);\n```\n\nFor this reason we recommend\
    \ using a spy framework.\n\nWhen spies act as mocks that must also supply indirect\
    \ inputs, it is best to make them as forgiving as possible when supplying values\
    \ but as specific as possible when verifying.\n\nWhat does this mean?\n\nLets\
    \ imagine that, for some reason, the subscribers in our example had to return\
    \ a positive integer in order for the code to execute without error. Perhaps there\
    \ is some sort of assert statement in the code:\n\n```\npublic interface Subscriber\
    \ {\n  int receive(String message);\n}\n```\n\nWe could ensure our test passed\
    \ as follows:\n\n```\n String message = \"amessage\";\n  Subscriber subscriber\
    \ = Mockito.mock(Subscriber.class);\n  // inject indirect value\n  Mockito.when(subscriber.receive(message)).thenReturn(1);\n\
    \n  Publisher publisher = new Publisher();\n  publisher.add(subscriber);\n\n \
    \ publisher.publish(message);\n\n  Mockito.verify(subscriber).receive(message);\n\
    ```\n\nWe will not discuss the Mockito API in any detail here, but this line:\n\
    \n```\n Mockito.when(subscriber.receive(message)).thenReturn(1);\n```\n\nEnsures\
    \ that when the `receive` method is called on the spy with a string that equals\
    \ the `message` variable, it will return `1`.\n\nIf this line was not present\
    \ the spy would do what Mockito does by default, which is to return `0`.\n\nWhat\
    \ would our test do if, due to a bug, `receive` was called with a different string?\n\
    \nThe answer is that, instead of failing due to the verification:\n\n```\n Mockito.verify(subscriber).receive(message);\n\
    ```\n\nIt would throw an error before it reached this point because the assertion\
    \ in our production code would trigger.\n\nWe were too specific.\n\nIf we instead\
    \ setup our spy as follows\n\n```\n Mockito.when(subscriber.receive(anyString())).thenReturn(1);\n\
    ```\n\nThe test would fail cleanly.\n\nThis pattern of being lenient when supplying\
    \ values, but specific when verifying also tends to result in tests that are less\
    \ brittle when things change.\n\n### Stubs in State-Based Tests"
