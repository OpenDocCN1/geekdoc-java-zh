    \ and injected in via the constructor?\n\n### How Do I Test a Void Method?\n\n\
    You don't test methods (void or not), you test the behavior of a unit as a whole.\n\
    \nIf the method is void, it must be performing some sort of side effect that can\
    \ be checked by either state testing or interaction testing.\n\nFor example, if\
    \ you are trying to 'test the add method' of collection class, you should probably\
    \ instead be writing tests like:\n\n```\n@Test\npublic void shouldIncreaseInSizeWhenItemsAdded()\
    \ {\n    Collection testee = new ArrayList();\n    assertEquals(0, testee.size());\n\
    \    testee.add(\"itemA\");\n    assertEquals(1, testee.size());\n    testee.add(\"\
    itemB\");\n    assertEquals(2, testee.size());\n}\n```\n\n### How do I Test Code\
    \ That Reasons About the Current Date/Time?\n\nA bad solution is to use a static\
    \ method (such as joda time's `setCurrentMillisFixed`) to set the current date.\n\
    \nA good solution is to inject a strategy for retrieving the date/time into your\
    \ class as a dependency.\n\nJava 8 provides the `java.time.Clock` class which\
    \ can be used for this purpose.\n\nThe static factory method `fixed` will create\
    \ an instance that represents a constant time. Other methods provide implementations\
    \ suitable for production use.\n\nJava 7 does not provide an out of the box class\
    \ for this purpose so you will need to roll your own.\n\n### Do I Need to Implement\
    \ a Teardown Method for my Test?\n\nThis used to be a requirement for all JUnit\
    \ 3 tests. If you didn't nullify all members of a test class in a teardown your\
    \ test suite began to eat memory as it grew.\n\nThis is not a requirement for\
    \ vanilla JUnit 4 tests, but it is possible that you may need to do so if you\
    \ are using a custom runner.\n\n### What's the Difference Between Errors and Failures?\n\
    \nYou should try to design your tests to produce **failures** when the code is\
    \ logically wrong. Your tests should only produce errors when something unexpected\
    \ has happened.\n\n### How Should I Test for Expected Exceptions?\n\nIt depends.\n\
    \nThe built in:\n\n```\n@Test(expected = FooException.class)\npublic void shouldThrowFooExceptionWhenFeelsLikeIt\n\
    ```\n\nIs concise and suffices for simple scenarios, but has a gotcha. If the\
    \ test method exercises more than one method of the testee, the expectation applies\
    \ to the whole test method rather than the specific interaction with the testee\
    \ that is expected to throw it.\n\nIf data held within the exception is important,\
    \ it is also not possible to assert on it with this method.\n\nThe traditional\
    \ solution is to use a try catch block:\n\n```\n@Test\npublic void shouldThrowFooExceptionWhenFeelsLikeIt()\
    \ {\n  try {\n    testee.doStuff();\n    fail(\"Expected an exception\");\n  }\
    \ catch (FooException expectedException) {\n    assertThat(expectedException.getMessage(),\
    \ is(\"felt like it\"));\n  }\n}\n```"
