    *   Marco Di Paola


    *   Gordon Rogers


    *   Herve Saint-Amand


    *   Ewan Summers


    ## Cover


    The cover was produced by Peter Berry based on a wood engraving of a Long billed
    curlew from the 1885 text *"Nouveau dictionnaire encyclopédique universel illustré"*


    To our knowledge Long Billed Curlews are not especially proficient in Java.


    # Process


    # Process


    Code (good and bad) doesn''t just appear from nowhere, someone needs to sit down
    and write it. How the coder approaches this task can influence the amount of time
    spent swearing at the code later.


    This section looks at development philosophy, workflow, and other factors that
    teams should consider before starting to work together.


    # Build Fast Feedback Loops


    ## Build Fast Feedback Loops


    Good code is all about getting good and timely feedback. The sooner you find out
    something is wrong the easier it is to fix.


    Working on a legacy project, where the only way to discover if a code change is
    good is to deploy it to a dev/test/qa environment, is frustrating and demoralizing.


    Make sure your project has a well designed development workflow - the effort of
    setting this up will be repaid many times over.


    Ideally all feedback would be instantaneous, but in practice it is either impractical
    or impossible to get all feedback this way.


    Instead software development is organized as nested levels of feedback, as shown
    here:


    ![Development feedback cycles](feedback_cyclesncr.png)


    # Instant Feedback


    ## Instant Feedback


    A modern IDE such as Eclipse or IntelliJ will provide instant feedback as you
    type, using the underlying compiler and configurable static analysis tools.


    You can increase the amount of instant feedback you receive by making good use
    of the Java type system and configuring the static analysis tools.


    While feedback from the IDE is fast and convenient, it has some drawbacks.


    *   It may differ from machine to machine depending on the IDE configuration


    *   It is often non binary (i.e. not pass/fail)


    *   It can be ignored / overlooked


    *   The expectation of speed limits what it can achieve


    For these reasons you should avoid purely IDE centric work flows. Code should
    not be considered complete by a developer until tests have been run via the build
    file.


    # Fast Feedback


    ## Fast Feedback


    ## The Build File is Truth


    The build script provides less-immediate feedback than the IDE because it must
    be explicitly triggered.


    Feedback from the build script has two major advantages, however:


    *   It is repeatable across all machines


    *   With the aid of a CI server, you can ensure it is not ignored


    Because slower feedback is acceptable from the build script, a larger set of static
    and dynamic analysis can be run from here. This will usually include a repeat
    of your instant feedback.


    ## Locally Runnable Tests


    After the compiler and static analysis, the next fastest levels of feedback are
    the test suites.


    At least two suites should be maintained that are runnable locally on any developer
    machine.


    Because they are typically run immediately after compiling or before committing/pushing
    code, Martin Fowler refers to these as:


    *   The compile suite


    *   The commit suite


    In Maven, these map naturally to the `test` and `integration-test` phases.


    The criteria for a test being placed in the compile suite should, however, be
    more than **just** its execution speed.


    They must be fast (milliseconds or less per test) but must also be highly deterministic
    and repeatable. This ensures that the suite provides clean feedback - the only
    reason that a test should fail after a code change is if the change has caused
    regression.


    Although this sounds simple, in practice it requires considerable rigor to ensure
    that tests cannot interfere with each other or be affected by external factors.


    Tests in the commit suite may be slower and may also be slightly less repeatable.
    They should **aim** to be 100% repeatable but they may do things that carry the
    risk of occasionally causing a failure, like use network IO or write to disk.


    Although many tests in this suite may do no more than launch code within the same
    JVM as the tests themselves, some of the tests should also launch the built artifact
    (war, ear, jar) and perform at least some degree of testing against it.


    Although the commit suite will likely depend on external resources such as containers,
    databases, queues, etc., it should still be runnable on any machine with a single
    command.


    Installing and starting dependent resources should be handled automatically by
    the build scripts and tests - your project should not come with a page of notes
    on how to set up a development machine.


    Commonly, the Maven Cargo plugin is used to download and configure containers
    for testing.


    # Slower Feedback


    ### Slower Feedback


    Both the compile suite and the commit suite should be run on a CI server, normally
    triggered by a commit/push to the repository.


    In addition to the compile and commit suites, other suites should be created.


    These suites may require resources not available on a local machine and/or take
    large amounts of time to execute.


    They may also re-run the same tests against more realistic dependencies. If an
    in-memory database is normally used when running integration tests locally, the
    same tests might be run again against a production database.


    For a Maven build, these suites are likely to be implemented using profiles or
    as separate Maven modules.


    These suites will be run as frequently as possible. Most likely, this will mean
    on a timed basis because it is likely they will consume too much time to be run
    on commit. Here, "too much time" is defined as taking longer than the likely interval
    between commits/pushes to the monitored repository.


    Timed test runs also sometimes run the suites when no code changes have occurred
    - this can provide useful information when identifying flaky tests.


    # Agree The Language You Use For Tests


    ## Agree the Language You Use When Discussing Tests


    ### The Testing Pyramid


    Unfortunately, the language of testing is heavily overloaded, with different communities
    referring to different things by the same names.'
