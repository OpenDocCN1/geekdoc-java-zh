  trans: "\n\n毫无争议地，对于像这样非常简单的情况，布尔标志可能更理想；但如果我们将 `performSideEffect` 和 `performDifferentSideEffect`\
    \ 方法中的逻辑提取到实现 `WidgetAction` 的顶层类中，那么策略模式就会变得非常有吸引力。\n\n在 Java 8 中，毋庸疑问，即使在最简单的情况下，策略模式也是更优的。\n\
    \n### Java 8 更好\n\n```java\npublic void doSomething(List<Widget> widgets) {\n\
    \  doThings(widgets, widget -> performSideEffect(widget));\n}\n\npublic void doSomethingSimilar(List<Widget>\
    \ widgets) {\n  doThings(widgets, widget -> performDifferentSideEffect(widget));\n\
    }\n\nprivate void doThings(List<Widget> widgets, Consumer<Widget> action ) {\n\
    \  for (Widget widget : widgets) {\n    reportExistence(widget);\n    if (widget.snortles()\
    \ > 0) {\n      reportDeviance(widget);\n      action.accept(widget);\n    }\n\
    \  }\n}\n```\n\n我们不需要引入自己的接口 -内置的 `Consumer<T>` 就足够了。如果 `doThings` 方法是公开的，或者 `performSideEffect`\
    \ 中的逻辑复杂到需要提取到顶层类中，那么我们应该考虑引入一个。\n\n循环也可以转换为流水线操作。\n\n### 作为流水线\n\n```java\nprivate\
    \ void doThings(List<Widget> widgets, Consumer<Widget> action ) {\n  widgets\n\
    \  .stream()\n  .peek(widget -> reportExistence(widget))\n  .filter(widget ->\
    \ widget.snortles() > 0)\n  .peek(widget -> reportDeviance(widget))\n  .forEach(action);\n\
    }\n```\n\n# 优先考虑可逆转的决策\n\n### 总结\n\n优先选择易于更改的设计决策。\n\n### 细节\n\n你在设计代码时所做的许多决策最终都会被证明是错误的。\n\
    \n如果你能通过包含后果和添加抽象来使你的决策变得可逆转，那么这种未来的变化将不再重要。\n\n例如 - 如果你引入了一个第三方库并在整个代码中引用它，那么你就推高了逆转使用该库这一决策的成本。如果你将其限制在单个位置并为它创建一个接口，那么逆转该决策的成本就很低。\n\
    \n但不要忘记 KISS 和 YAGNI - 如果你的抽象使设计复杂化，那么最好不要使用。\n\n# 显式化依赖关系\n\n### 使依赖关系显式化并可见\n\
    \n### 总结\n\n确保类的依赖关系是清晰可见的。\n\n始终通过构造函数向类注入依赖。不要使用其他方法，如 setter 或字段上的注解。\n\n永远不要使用隐藏路由（如\
    \ `Singletons` 或 `ThreadLocals`）引入依赖关系。\n\n### 细节\n\n如果每个对象所依赖的接口和类是显著且可见的，代码将更容易理解。\n\
    \n最可见的依赖是作为参数注入到方法中的那些。\n\n可见性较低的是存储在字段中的那些，但取决于这些字段如何填充，依赖关系仍然可以被发现。\n\n####\
    \ 构造函数注入\n\n构造函数依赖注入在单个位置清晰地通信了对象的依赖关系，并确保对象只在有效状态下创建。它允许将字段标记为 `final`，以便其生命周期是明确。\n\
    \n这是注入依赖的唯一方式。\n\n#### setter 注入\n\nsetter 注入增加了对象可能处于的状态的数量。其中许多状态是无效的。\n\n如果使用\
    \ setter 注入，类可以在半初始化的状态下构造。什么才构成完全初始化的状态只能通过检查代码来确定。\n\n**糟糕**\n\n```java\npublic\
    \ class Foo() {\n  private Bar bar;\n\n  public void doStuff() {\n    bar.doBarThings();\n\
    \  }\n\n  public void setBar(Bar bar) {\n    this.bar = bar;\n  }\n}\n```\n\n\
    在这里，如果构造 `Foo` 时没有调用 `setBar`，将会抛出 `NullPointerException`。\n\n**更好**\n\n```java\n\
    public class Foo() {\n  private final Bar bar;\n\n  public Foo(Bar bar) {\n  \
    \  this.bar = bar;\n  }\n\n  public void doStuff() {\n    bar.doBarThings();\n\
    \  }\n}\n```\n\n在这里，很清楚我们必须提供一个 `Bar`，因为没有它我们无法构造该类。\n\n#### 字段注解\n\n虽然字段上的注解看起来很方便，但意味着依赖关系在公共\
    \ API 中不可见。它们还将将你的类构造与理解这些注解的框架绑定，并防止字段被标记为 `final`。\n\n不应该使用字段注解。\n\n如果你正在使用如\
    \ `Spring` 之类的依赖注入框架，要么将对象的构造移动到配置类中，要么将注解的使用限制在构造函数上。这两种方法都允许你的类被正常构造，并确保所有依赖都是可见的。\n\
    \n#### 隐藏依赖关系\n\n任何不是通过构造函数或方法参数注入类中的东西都是隐藏依赖关系。\n\n这些是恶性的。\n\n它们通过 `Singletons`、`ThreadLocals`、静态方法调用或简单地调用\
    \ `new` 引入。\n\n**糟糕**\n\n```\npublic class HiddenDependencies {\n  public void\
    \ doThings() {\n    Connection connection = Database.getInstance().getConnection();\n\
    \    // 使用 connection 进行操作\n    ....\n  }\n}\n```\n\n在这里，我们必须在调用下方代码的 `doThings`\
    \ 方法之前确保 `Database` 类处于有效状态，但如果不遍遍每一行代码，我们无法知道这一点。\n\n**更好**\n\n```java\npublic\
    \ class HiddenDependencies {\n  private final Database database;\n\n  public HiddenDependencies(Database\
    \ database) {\n    this.database = database;\n  }\n\n  public void doThings()\
    \ {\n    Connection connection = database.getConnection();\n    // 使用 connection\
    \ 进行操作\n    ....\n  }\n}\n```\n\n通过构造函数注入使得依赖关系清晰可见。\n\n根据定义，隐藏依赖关系很难发现，但它们还有第二个问题——它们也很难替换。\n\
    \n#### 缝隙（Seams）\n\n缝隙是 Michael Feathers 在《Legacy Code》（Working Effectively with\
    \ legacy code）中引入的概念。\n\n他将其定义为：\n\n> “可以在不编辑该处的情况下更改程序行为的地方。”\n\n在 `HiddenDependencies`\
    \ 的原始版本中，如果我们想 `Database` 替换为 mock 或 stub，只有当单例提供了某种方法来修改它的实例时我们才能这样做。\n\n**不是好的方法**\n\
    \n```\npublic class Database implements IDatabase {\n  private static IDatabase\
    \ instance = new Database();\n\n  public static IDatabase getInstance() {\n  \
    \  return instance;\n  }\n\n  public static void setInstanceForTesting(IDatabase\
    \ database) {\n    instance = database;\n  }\n\n}\n```\n\n这种方法引入了缝隙，但没有解决我们对可见性的担忧。依赖关系仍然是的。\n\
    \n通过构造函数注入，我们获得了缝隙并使依赖关系可见。即使 `Database` 是单例，我们仍然能够为了测试将其与我们的代码隔离。\n\n# 优先使用不可变对象\n\
    \n### 总结\n\n尽可能创建不可更改的对象——特别是当这些对象是长寿或可全局访问时。\n\n### 细节\n\n可变状态使程序更难理解和维护。\n\n\
    当对象寿命短暂且不离开方法作用域时，可变状态引起的问题很少。写和读操作彼此接近，且发生的顺序是清晰的。\n\n对于长寿对象，情况变得复杂。\n\n如果一个对象逃离了方法，它可能会被代码中的多个位置访问。\n\
    \n我们必须首先假设发生在这些对象上的任何事情都会发生。只有通过检查整个程序，才能确认某些情况不会发生。\n\n"
- fmt: "\nThe set of things that might happen to an immutable object is far smaller\
    \ than for a mutable one. By constraining how long lived objects can behave we\
    \ have made things simpler. There are fewer possibilities that we must consider.\n\
    \nUnfortunately, it is not always easy to tell from a class definition what the\
    \ lifecycle of objects of that type will be. Perhaps only short-lived instances\
    \ will be created. Perhaps only long-lived ones. Perhaps a mixture of the two.\n\
    \nIf we design immutable classes by default we do not need to worry about this.\n\
    \n## The Problem With Mutable Objects\n\nIf we have a very simple class such as\
    \ `Foo`\n\n```\npublic class Foo {\n  private Long id;\n\n  public Long getId()\
    \ {\n    return id;\n  }\n\n  public void setId(Long id) {\n    this.id = id;\n\
    \  }\n\n  @Override\n  public int hashCode() {\n    return Objects.hashCode(id);\n\
    \  }\n\n  @Override\n  public boolean equals(Object obj) {\n    if (this == obj)\n\
    \      return true;\n    if (obj == null)\n      return false;\n    if (getClass()\
    \ != obj.getClass())\n      return false;\n    Foo other = (Foo) obj;\n    return\
    \ Objects.equals(id, other.id);\n  }\n}\n```\n\nWe would need to search our codebase\
    \ for all usages of it to establish the following :\n\n### It is Never Accessed\
    \ from Multiple Threads\n\n`Foo` is not thread safe.\n\nWrites to longs are not\
    \ atomic and nothing within `Foo` itself establishes a happens-before relationship\
    \ between the field write and read.\n\nIf `setId` and `getId` are ever called\
    \ from different threads we might get back stale or garbage values.\n\n### `setId`\
    \ Is Never Called After `Foo` Has Been Placed in a Set\n\nThe `hashcode` of this\
    \ class relies on a mutable field. If we modify it after we place it in a set\
    \ then our program will not behave as we expect.\n\n### The Flow of Our Data\n\
    \nEven if our program behaves correctly, we need to do work in order to understand\
    \ how it functions.\n\n`setId` can be called at any point after the object is\
    \ created. We can, therefore, only understand how data flows through our program\
    \ by looking for all calls to `setId` - perhaps there are several, perhaps there\
    \ is only one. The only way we can discover this is by examining the entire program.\n\
    \n## Immutable Objects\n\nIf we can make our objects immutable we gain guarantees\
    \ that mean we do not need to worry about how our objects are used.\n\n```\n@Immutable\n\
    public final class Foo {\n  private final Long id;\n\n  public Foo(Long id) {\n\
    \    this.id = id;\n  }\n\n  public Long getId() {\n    return id;\n  }\n\n  @Override\n\
    \  public int hashCode() {\n    return Objects.hashCode(id);\n  }\n\n  @Override\n\
    \  public boolean equals(Object obj) {\n    if (this == obj)\n      return true;\n\
    \    if (obj == null)\n      return false;\n    if (getClass() != obj.getClass())\n\
    \      return false;\n    Foo other = (Foo) obj;\n    return Objects.equals(id,\
    \ other.id);\n  }\n}\n```\n\nIt no longer matters if `Foo` is long or short lived.\n\
    \nIt is inherently thread-safe.\n\nWe know that whatever value we construct it\
    \ with will remain until it dies. There is only one possible point where data\
    \ is written so we do not need to search for others.\n\n### Annotations\n\nThe\
    \ example uses the JSR3051 `javax.annotation.concurrent.Immutable` annotation.\n\
    \nThis does not in any way change the object's functionality but provides a way\
    \ to communicate the intent of this being an immutable class. Static analysis\
    \ tools such as [Mutability Detector](https://github.com/MutabilityDetector/MutabilityDetector)\
    \ can check if this intent has been violated.\n\nWe can tell at a glance that\
    \ `Foo` is immutable as it has final fields of a well known immutable type.\n\n\
    The `final` keyword ensures only that the reference a field points to will not\
    \ change.\n\nIf the field were of type `Bar` then we would not know if it were\
    \ mutable or not without examining `Bar` to see if it too were immutable. Even\
    \ if we were not using a static analysis tool the use of the `Immutable` annotation\
    \ would make this assessment faster.\n\nInstead of updating the state of immutable\
    \ objects, we create new instances that retain the state we do not wish to modify.\n\
    \nThis pattern seems strange to some Java programmers at first, but the programming\
    \ model is similar to how the familiar `String` class works.\n\n```\n@Immutable\n\
    public final class Bar {\n  private int anInt;\n  private String aString;\n\n\
    \  public Bar(int anInt, String aString) {\n    this.anInt = anInt;\n    this.aString\
    \ = aString;\n  }\n\n  @CheckReturnValue\n  public Bar withAnInt(int anInt) {\n\
    \    return new Bar(anInt, this.aString);\n  }\n\n  @CheckReturnValue\n  public\
    \ Bar withAString(String aString) {\n    return new Bar(this.antInt, aString);\n\
    \  }\n}\n```\n\nInstances of `Bar` with new values can be obtained by calling\
    \ `withAString` and `withAnInt`.\n\nThe JSR305 `javax.annotation.CheckReturnValue`\
    \ enables static analysis tools such as [Error Prone](https://github.com/google/error-prone)\
    \ to issue a warning if a mistake is made such as in the code below.\n\n```\n\
    public Bar doThings(Bar bar) {\n  if(someLogic()) {\n    bar.withAnInt(42);\n\
    \  }\n  return bar;\n}\n```\n\n```java\npublic Bar doThings(Bar bar) {\n  if(someLogic())\
    \ {\n    bar.withAnInt(42);\n  }\n  return bar;\n}\n```\n\n## When to Use Mutable\
    \ Objects\n\nMutable objects require slightly less boilerplate to create than\
    \ immutable ones.\n\nIf you know that a class will only be used to create short-lived,\
    \ local objects then you might consider it mutable. But you must weigh this against\
    \ the additional work required to ensure its only used in this fashion as the\
    \ codebase grows.\n\nOptions exist to auto-generate both immutable and mutable\
    \ classes, thereby removing mutable objects' main advantage. Two of these options\
    \ are discussed further in \"Know How to Implement Hashcode and Equals\".\n\n\
    Mutable objects used to be the norm in Java. As a result, many common frameworks\
    \ require mutable objects. Persistence and serialization frameworks often require\
    \ Java beans with no args constructors and setters. It is not always highlighted\
    \ in the documentation but some long standing frameworks have been updated to\
    \ support immutable objects.\n\nJackson for example now allows constructors and\
    \ factory methods to be annotated:\n\n```java\npublic class Foo {\n  private final\
    \ int x;\n  private final int y;\n\n  @JsonCreator\n  public Foo(@JsonProperty(\"\
    x\") int x, @JsonProperty(\"y\") int y) {\n    this.x = x;\n    this.y = y;\n\
    \  }\n}\n```\n\nOther frameworks, such as Hibernate, can only be used with classes\
    \ that provide a default constructor. Although they can be configured to set fields\
    \ directly without the need for setters this causes more problems than it solves.\n\
    \nIf you are tied to a framework that requires mutability then you will need to\
    \ use mutable objects where you interface with that framework.\n"
