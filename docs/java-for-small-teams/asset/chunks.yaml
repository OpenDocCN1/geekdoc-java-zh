    \ Details\n\nJava has been around for over 20 years. In order to maintain backwards\
    \ compatibility, it has hoarded all manner of APIs that no longer make sense to\
    \ use. Some of them are handily marked with @Deprecated annotation, others are\
    \ not.\n\nUnfortunately, many are still used in university courses and online\
    \ examples. New Java programmers may not be aware they have been replaced - a\
    \ few to watch out for include:\n\n*   `java.util.Vector` - use `ArrayList` instead\n\
    \n*   `java.lang.StringBuffer` - use `StringBuilder` instead\n\n*   `java.util.Stack`\
    \ - use a `Dequeue` (e.g. `ArrayDeqeue`)\n\n*   `java.util.Hashtable` - use a\
    \ `Map` (e.g. `HashMap`)\n\n*   `java.util.Enumeration` - use an `Iterator` or\
    \ an `Iterable`\n\nEach of these replacements (except `Enumeration`) differ from\
    \ the originals by not being synchronized. If you think you need a synchronized\
    \ collection go away somewhere quiet and think again.\n\n# Beware Casts And Generics\
    \ Warnings\n\n## Beware Casts and Generics Warnings\n\n### Summary\n\nCasts dilute\
    \ the benefit of Java's type system, making code both less readable and less safe.\n\
    \nAvoid casts wherever possible.\n\nIf you find yourself writing one, stop and\
    \ ask yourself why you are writing it.\n\nWhat would need to be changed in your\
    \ code so you did not need to write that cast?\n\nWhy can't you make that change?\n\
    \n### Detail\n\nJava's type system is there to help us - it catches bugs at compile-time\
    \ and documents our code, making it easier to understand and navigate.\n\nWhen\
    \ we add a cast to our code, we lose both these benefits.\n\nCasts get introduced\
    \ into code for three main reasons:\n\n1.  We have reached the limits of Java's\
    \ type system and the programmer must take control\n\n2.  The overall design of\
    \ the code is poor\n\n3.  The code uses raw generic types\n\nWe'll look at these\
    \ in reverse order.\n\n#### Code with Raw Types\n\nIf code contains raw generic\
    \ types (either because the code pre-dates Java 5 or the programmer is not familiar\
    \ with Java) then it will create the need to cast.\n\nFor example:\n\n```\nList\
    \ list = numberList();\nfor (Object each : list) {\n  Integer i = (Integer) each;\n\
    \  // do things with integers\n}\n```\n\nThe compiler will not be happy that we\
    \ have failed to fully declare the type of `List` we are dealing with and will\
    \ (depending on how it's been configured) generate an error or warning on the\
    \ line where `list` is declared e.g.\n\n```\nList is a raw type. References to\
    \ generic type List<E> should be parameterized\n```\n\nSimilarly, for errant code\
    \ such as:\n\n```\nList l = new ArrayList<Number>();\nList<String> ls = l;\n```\n\
    \nThe compiler will issue:\n\n```\nThe expression of type List needs unchecked\
    \ conversion to conform to List<String>\n```\n\nMake sure that all such warnings\
    \ are addressed, either by imposing a zero compiler warnings policy or by configuring\
    \ the compiler to treat them as errors.\n\nIn this case, removing both the cast\
    \ and the warning is straight forward:\n\n```\nList<Integer> list = numberList();\n\
    for (Integer each : list) {\n   // do things with each\n}\n```\n\n#### Poor Design\n\
    \nSometimes, removing a cast or fixing a warning is non-trivial. We have bumped\
    \ into issue two - poor design.\n\nFor example:\n\n```\nList<Widget> widgets =\
    \ getWidgets();\nList results = process(widgets);\n\nfor (Object each : results)\
    \ {\n  if (each instanceof String) {\n    // handle failure using data from string\n\
    \  } else {\n    EnhancedWidget widget = (EnhancedWidget) each;\n    widget.doSomething();\n\
    \  }\n}\n```\n\nNormally, objects placed into a collection should be of a single\
    \ type or of multiple types related by a common superclass or interface.\n\nHere,\
    \ unrelated types have been placed into the same list with a String used to communicate\
    \ some sort of information about how \"processing\" of a widget has failed.\n\n\
    The classic OO fix for this code would be to introduce a `ProcessResult` interface\
    \ with two concrete implementations.\n\n```\ninterface ProcessResult {\n void\
    \ doSomething();\n}\n\nclass Success implements ProcessResult {\n\n  private final\
    \ EnhancedWidget result;\n\n  @Override\n  public void doSomething() {\n    result.doSomething();\n\
    \  }\n\n}\n\nclass Failure implements ProcessResult {\n\n  private final String\
    \ result;\n\n  @Override\n  public void doSomething() {\n    // do something with\
    \ result string\n  }\n\n}\n```\n\nThe original code can then be fixed as follows:\n\
    \n```\nList<Widget> widgets = getWidgets();\nList<ProcessResult> results = process(widgets);\n\
    \nfor (ProcessResult each : results) {\n    each.doSomething();\n  }\n}\n```\n\
    \nOr, more concisely in Java 8:\n\n```\n List<ProcessResult> results = process(widgets);\n\
    \ results.stream().forEach(ProcessResult::doSomething);\n```\n\nIt may also sometimes\
    \ make sense to use a disjoint union type aka `Either`.\n\nThis technique can\
    \ be particularly useful as an interim step when reworking legacy code that uses\
    \ mixed type raw collections, but can also be a sensible approach when dealing\
    \ with error conditions.\n\nUnfortunately, Java does not provide an `Either` type\
    \ out of the box but at its simplest it looks something like:\n\n```\npublic class\
    \ Either<L,R> {\n  private final L left;\n  private final R right;\n\n  private\
    \ Either(L left, R right) {\n    this.left = left;\n    this.right = right;\n\
    \  }\n\n  public static <L, R> Either<L, R> left(final L left) {\n    return new\
    \ Either<L, R>(left,null);\n  }\n\n  public static <L, R> Either<L, R> right(final\
    \ R right) {\n    return new Either<L, R>(null,right);\n  }\n\n  boolean isLeft()\
    \ {\n    return left != null;\n  }\n\n  L left() {\n    return left;\n  }\n\n\
    \  R right() {\n    return right;\n  }\n\n}\n```\n\nLibraries such as Atlassian's\
    \ Fugue provide implementations with much richer functionality.\n\nUsing the simplistic\
    \ form of `Either` with Java 7 the code could be re-written as:\n\n```\nList<Widget>\
    \ widgets = getWidgets();\nList<Either<ProcessResult,String>> results = process(widgets);\n\
    \nfor (Either<ProcessResult,String> each : results) {\n  if (each.isLeft()) {\n\
    \    // handle failure using data from string\n  } else {\n    each.right().doSomething();\n\
    \  }\n}\n```\n\nWhile most Java programmers will prefer the earlier OO version,\
    \ this version has two advantages:\n\n1.  It requires no change to the *structure*\
    \ of the original code - all we have really done is make the types document what\
    \ is happening\n\n2.  It requires less code\n\nThis pattern can help quickly tame\
    \ a legacy code base that is difficult to comprehend.\n\n#### Limits of the Type\
    \ System\n\nSometimes we do reach the limits of Java's type system and need to\
    \ cast.\n\nBefore we do this, we must make certain that the cast is safe and there\
    \ is no better solution to our problem.\n\nSimilarly, we may need to sometimes\
    \ suppress a Generics warning, this can be done by annotating with `@SuppressWarnings`\
    \ e.g.\n\n```\n@SuppressWarnings(\"unchecked\")\n<T> T read(final Class<T> type,\
    \ String xml) {\n  return (T) fromXml(xml);\n}\n\nObject fromXml(final String\
    \ xml) {\n  return ... // de-serialise from string\n}\n```\n\nHere, the compiler\
    \ has no way of knowing what type has been serialized to the String. Hopefully\
    \ the programmer does or else a runtime error will occur.\n\n# Do Not Use Magic\
    \ Numbers\n\n## Do Not Use Magic Numbers\n\n### Summary\n\nMagic numbers should\
    \ be replaced with well-named constants that describe their meaning.\n\n#### Detail\n\
    \nPlacing numeric or string literals directly into source code causes two problems:\n\
    \n1.  It is unlikely that the **meaning** of the literal will be clear\n\n2. \
    \ If the value changes updates are required where ever the literal has been duplicated\n\
    \nLiterals should therefore be replaced with well-named constants and Enums.\n\
    \n**Bad**"
