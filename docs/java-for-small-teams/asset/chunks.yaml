  raw: 'The testing pyramid is a widely recognized diagram of how testing should be
    approached.


    It shows large numbers of unit tests at the bottom, with a smaller number of integration
    tests above them and a yet smaller number of system tests at the peak. Often,
    some clouds of manual testing are added at the top.


    ![The testing pyramid](pyramid.png)


    This diagram has probably been drawn thousands of times. Although unit tests will
    appear at the bottom of each version, the words used at the other levels will
    vary wildly.


    Even when the same words are used the meanings attached to them might be different.


    Although people might nod when you discuss "unit tests", "integration tests",
    "system tests", "end 2 end tests", "service tests", there is no guarantee that
    they are thinking of the same thing as you.


    Depending on who you speak to, a "unit test" might be anything from a word document
    full of instructions, "any test written by a programmer", through to various formal
    (but by no means authoritative) definitions that appeared in text books.


    The number of possible meanings of "integration test" is even greater.


    ### Unit Tests


    A fairly tight definition of unit tests is now in common use in the Java community.
    We recommend that you and your team use this definition.


    To be a unit test, a test must be:


    *   Fast (milliseconds or less)


    *   Isolated (test only one unit)


    *   Repeatable (able to be run millions of times on any machine with the same
    result)


    *   Self verifying (either passes or fails)


    *   Timely (written first)


    Note: Although writing your tests first is often a very good idea, a test that
    meets the other criteria is still a unit test regardless of when it was written.


    When we talk about "unit" testing, what constitutes a *unit* isn''t necessarily
    that obvious.


    A somewhat circular definition is that a *unit* is the smallest thing that makes
    sense to test independently.


    It will often be a single class, but this is not necessarily the case. It may
    make sense to treat a group of classes as a unit (particularly if most of them
    are non-public) or occasionally even a method.


    If we accept that a *unit* is a small thing, and that we''ll know it when we see
    it, then we can see that the criteria for being a unit test largely matches the
    criteria we put forward for the compile suite.


    The only difference is that the compile suite does not care about isolation.


    If we choose to write a test that tests two (or more) *units* in tandem, it still
    belongs in the compile suite if it meets the other criteria.


    ### System Tests


    System tests are also fairly well-defined. They are tests that exercise the overall
    system - i.e all your code and all the code it interacts with in a realistic environment.


    ### Integration Tests


    Integration tests are harder to define. They occupy the large space of everything
    that doesn''t fit the unit or system tests definitions.


    The two following diagrams show how this terminology fits into our world of test
    suites.


    This document will use the terminology *unit test*, *Integration test* and *System
    test* as shown in these diagrams.


    For clarity, it will sometimes state exactly what is being tested when discussing
    integration tests - e.g "test via the REST API of the war file running in Tomcat".


    Although it is tedious, this long-hand terminology is clear. It is recommended
    that you use it when discussing testing across teams. Within your own team it
    is likely you will develop a shorter language you all understand.


    ![Properties of different test types](test_types.png)


    This maps to our suites as shown below:


    ![Test suites](test_types_maven.png)


    # Use Coverage As A Tool Not A Target


    ## Use Coverage as a Tool, not a Target


    Code coverage is a useful tool for catching your mistakes.


    The tool should work for you; you do not work for the tool.


    It is most useful when code coverage is run at the point at which the code and
    tests are being written, rather than on a CI server hours later.


    Gaps in code coverage highlight areas of code that have not been tested. Some
    of these gaps may be expected and intentional, others may be a surprise. It is
    these surprise gaps that provide useful information.


    This is all that code coverage does.


    Code that has 100% branch coverage may or may not have been tested. Code coverage
    tells you that some tests have executed the code, not that they have meaningfully
    tested it. Don''t let it lull you into a false sense of security.


    Some teams set coverage targets that code must meet (75% seems to be a common
    figure). Although well-intentioned, this practice is often damaging.


    Code coverage is easy to measure. Other properties of tests that are desirable
    (or highly undesirable) are not easy to measure e.g.:


    *   Is the test meaningful?


    *   Is the test easy to read and understand?


    *   Is the test tightly tied to a particular implementation?


    This last point is particularly important.


    For a test to be of value, it must enable refactoring; tests that are tied to
    one particular way of solving the problem often have negative value because they
    must be modified or rewritten whenever the code is changed. Unfortunately, it
    is easy to write tests in this way for a number of months or years before you
    realize you were doing it wrong.


    By concentrating on the one property that is easy to measure, the others are de-emphasized.
    But, much worse than this, trying to meet a coverage target can actively push
    developers towards writing tests that are tied to the implementation. Bad tests
    are easier to write than good tests.


    It is probably fair to say that there is a problem when code has only 30% unit
    test coverage. On the other hand, if coverage is achieved by setting a target,
    code with 80% coverage may be harder to work with than code with a lower figure.


    So don''t set targets, instead make sure your team is committed to writing good
    tests.


    A good test is one which helps explains the code, catches regression and doesn''t
    get in the way when changes are made. Writing the tests before the code can help
    encourage good tests and will ensure that code has high coverage.


    # Style


    # Style


    There are many aspects to programming style, from the mundane questions of where
    to place braces and new lines through to the more interesting questions of how
    you design and structure your code.


    This section looks at all of these aspects, starting with the more abstract concerns
    before drilling down to the more concrete.


    Although static analysis tools can measure aspects of many of the things discussed
    in most cases they cannot make break-the-build decisions about whether the code
    is good. A skilled human is required to make trade offs and apply discretion.


    # Consider Code Generators Carefully


    # Summary


    Code generators can automatically implement certain types of functionality, saving
    time and eliminating the possibility of certain classes of bugs.


    Although they have much to recommend them, code generators also have a cost that
    should be considered carefully before incorporating them into your project.


    Favor generators that allow a clear separation between generated and non-generated
    functionality, but make sure you understand the trade-offs you are making before
    including any generator into your project.


    ## Details


    Code generators can be grouped into three general types:


    *   Boilerplate generators


    *   Compile time annotation processors


    *   Runtime generators/frameworks


    ### Boilerplate Generators


    Boilerplate generators are the simplest form of code generation. They can be further
    split into :


    *   Generators that insert code into existing classes (e.g. methods auto generated
    by an IDE).


    *   Generators that produce scaffolding that is checked into version control and
    modified.


    *   Generators that produce new classes from a model. The generated code is not
    normally checked into version control.'
