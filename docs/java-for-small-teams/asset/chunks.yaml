  trans: "\n这种方法易于遵循，但有些冗嗦。如果你不对代码进行测试驱动，很容易忘记包含对 `fail()` 的调用。\n\n`JUnit` 现在提供了一种以\
    \ `'ExpectedException'` 方法规则形式存在的替代解决方案。这允许进行更细粒度的异常检查：\n\n```\n@Rule\npublic\
    \ ExpectedException thrown= ExpectedException.none();\n\n@Test\npublic void foo()\
    \ throws IOException {\n  thrown.expect(FooException.class);\n  thrown.expectMessage(\"\
    felt like it\");\n\n  testee.doStuff();\n}\n```\n\n这种方法更加简洁，但通过将 `then` 部分移动到方法的开头，破坏了测试常用的\
    \ `given/when/then` 流程。\n\n对于 Java 8，`AssertJ` 提供了了一些自定义断言，可以在不破坏这种流程的情况下使用。\n\
    \n```java\n@Test\npublic void testException() {\n  assertThatThrownBy(() -> {\
    \ testee.doStuff(); })\n   .isInstanceOf(Exception.class)\n   .hasMessageContaining(\"\
    felt like it\");\n}\n```\n\n虽然它保持了这种流，但调用 `testee` 的 lambda 表达式看起来有点丑。\n\n在可以使用的情况下，我们建议坚持使用简洁的\
    \ `expected =` 格式。对于更复杂的情况，这很大程度上取决于个人喜好。\n\n### 如何测试抽象类？\n\n抽象类只是某些其他代码将使用的依赖项\
    \ - 由于你选择将其作为抽象类，这个依赖项变得比通常更难隔离。\n\n所以首先，如果功能是通过组合而不是继承来重用，你的设计是否会看起来更好呢？\n\n\
    假设你无法通过消除抽象类来改进你的设计，那么你可以：\n\n*   将其视为实现细节，并检查它的每个客户端的行为是否符合预期。\n*   通过创建一个匿名具体类来对其进行隔离测试。\n\
    \n第一种方法产生的测试与实现的耦合度较低，但每个子类的测试之间会存在重复。\n\n第二种方法避免了重复，但它与实现紧相关，并且可能很脆弱。\n\n###\
    \ 我如何测试 Hashcode 和 Equals？\n\n测试 `hashcode` 和 `equals` 可能非常繁琐且耗时，这让人考虑到考虑到代码可能是自动生成的，这种时间投入是否值得的。\n\
    \n`Equals verifier` 项目提供了一个很好的（部分）解决方案：\n\n[`www.jqno.nl/equalsverifier/`](http://www.jqno.nl/equalsverifier/)\n\
    \n它通过单行易于编写的测试检查类是否符合 `hashcode-equals` 合约：\n\n```\n @Test\n  public void shouldObeyHashCodeEqualsContract()\
    \ {\n    EqualsVerifier.forClass(MyValue.class).verify();\n  }\n```\n\n然而，它在检查合约方面做得非常彻底\
    \ - 包括它如何与继承相互作用。要让一个非 `final` 类符合合约并不是易事的。\n\n尽管 `equals verifier` 在检查 `hashcode\
    \ equals` 合约方面做得很好，但它并不了解你期望这些方法实际如何表现。如果你希望相等性（例如）仅由单个 ID 字段定义，则你必须编写额外的测试来验证这种行为。\n\
    \n对于一个应该根据其所有字段被认为等等的类的常见场景，可以在单次测试中检查该行为：\n\n```\n @Test\n  public void shouldObeyHashCodeEqualsContract()\
    \ {\n    EqualsVerifier.forClass(MyValue.class).allFieldsShouldBeUsed().verify();\n\
    \  }\n```\n\n这可能在 `EqualsVerifier` 的未来版本中成为默认行为，但在 `1.7.5` 中必须特地指定。\n\n# 错误的建议\n\
    \n# 错误的建议\n\n一些真正糟糕的想法通常作为“最佳实践”流传。在这一节中，我们提供了示例并解释了为什么应该忽略它们。\n\n# 单出口点规则\n\n\
    ## 错误的建议 - 单出口点规则\n\n某些编码标准强制所有方法都应该有一个出口点。\n\n这样做是有害的，特别是当它由静态分析强制执行时。\n\n##\
    \ 细节\n\n单出口点是一个具有悠久历史的想法，可以追溯到大量使用 `goto` 和面条式代码的时代。\n\n在那种背景下，对函数内部可能发生的情况增加限制是有帮助的。知道一个大型函数只有一个出口点会使其变得更容易理解。\n\
    \n许多现代函数式语言继续强制或鼓励单出口点。\n\n所以，在 Java 中添加这个限制也应该是个好主意，对吧？\n\n让我们看看当我们被告知只能有一个出口点时会发生什么：\n\
    \n**带语句的单出口**\n\n```java\npublic class Example {\n  private int value;\n\n  public\
    \ int single(int x) {\n    int retVal = 0;\n\n    if (x == 10) {\n      retVal\
    \ = -value;\n    } else if (x > 0) {\n      retVal = value + x;\n    }\n\n   \
    \ return retVal;\n  }\n\n}\n```\n\n如果移除移除单出口点限制，我们得到了：\n\n**多出口**\n\n```java\n\
    public class Example {\n  private int value;\n\n  public int multi(int x) {\n\
    \    if (x == 10) {\n      return -value;\n    }\n\n    if (x > 0) {\n      return\
    \ value + x;\n    }\n\n    return 0;\n  }\n}\n```\n\n哪个版本更好？\n\n这并没有什么特别，但多出口点的版本更容易理解。\n\
    \n尝试应用单出口点限制导致了一个额外的局部变量来保存返回状态。在多出口版本中，我们可以清楚地看到当没有条件都不匹配时返回了什么。在单出口版本中，这一点稍微不清晰。\n\
    \n所以这意味着单出口是坏的吗？\n\n不是。\n\n可以编写替代的单出口实现。\n\n```java\npublic int oneAssignment(int\
    \ x) {\n    final int retVal;\n\n    if (x == 10) {\n      retVal = -value;\n\
    \    } else if (x > 0) {\n      retVal = value + x;\n    } else {\n      retVal\
    \ = 0;\n    }\n\n    return retVal;\n  }\n```\n\n我们已经解决了之前发现的问题。我们只对 `retVal`\
    \ 赋值一次，并且当没有条件都不匹配时赋值了什么是清楚的。\n\n这在某些方面真的优于多出口版本吗？\n\n并不真的。由于 Java 在很大程度上是基于语句的语言，你也会遇到多出口版本不可否认更清晰的逻辑。我们从使用语句切换到处理表达式。即返回返回值的东西。\n\
    \n我们还可以使用 `?` 运算符编写单出口方法：\n\n**带 ? 运算符的单出口**\n\n```java\npublic int expression(int\
    \ x) {\n    return  x == 10 ? -value\n        : x > 0  ? value + x\n        :\
    \ 0;\n  }\n```\n\n这个这个版本比多出口版本更清晰吗？这是有争议的，最终取决于个人喜好。\n\n使用 `?` 运算符的代码非常简练，有些人会觉得它更难理解。\n\
    \n多出口版本虽然冗长，但其支持者会认为它更容易理解。\n\n如果你个人偏好是 `?` 运算符版本，这仍然不能说明单出口点规则是你应该尝试普遍适用的规则。最可能的结果是你会推使人们写出像我们方法早期那个臃肿的代码。\n"
- fmt: "\nAvoiding concatenation in a loop is reasonable. Using a `StringBuilder`\
    \ is likely to be more efficient if the loop executes a reasonable number of times\
    \ as it will avoid string allocations.\n\nThe performance difference is unlikely\
    \ to be significant in most cases, but the resulting code isn't noticeably less-readable\
    \ - so it is a premature optimization without a cost.\n\nLets see what happens\
    \ when we apply this advice when no loop is present:\n\n```\n public String buffer(String\
    \ s, int i) {\n    StringBuilder sb = new StringBuilder();\n    sb.append(\"Foo\"\
    );\n    sb.append(s);\n    sb.append(i);\n    return sb.toString();\n  }\n\n \
    \ public String concat(String s, int i) {\n    return \"Foo\" + s + i;\n  }\n\
    ```\n\nThe `concat` version is far clearer.\n\nIs it less efficient?\n\nThe eclipse\
    \ compiler generates the following bytecode for `concat`:\n\n```\n NEW java/lang/StringBuilder\n\
    \    DUP\n    LDC \"Foo\"\n    INVOKESPECIAL java/lang/StringBuilder.<init> (Ljava/lang/String;)V\n\
    \    ALOAD 1\n    INVOKEVIRTUAL java/lang/StringBuilder.append /\n       (Ljava/lang/String;)Ljava/lang/StringBuilder;\n\
    \    ILOAD 2\n    INVOKEVIRTUAL java/lang/StringBuilder.append (I)Ljava/lang/StringBuilder;\n\
    \    INVOKEVIRTUAL java/lang/StringBuilder.toString ()Ljava/lang/String;\n   \
    \ ARETURN\n```\n\nA `StringBuilder` is created by the compiler behind the scenes\
    \ to handle the concatenation so our simpler cleaner code produces identical bytecode\
    \ to the more verbose option.\n\nThe presence of loops in the code may prevent\
    \ the compiler performing this optimization, but code without branches will be\
    \ optimized every time. Although compilers may exist that do not support this\
    \ optimization it is unlikely that you will ever use them.\n\n# Hungarian Notation\n\
    \n## Bad Advice - Hungarian Notation\n\nThe idea of Hungarian notation and similar\
    \ schemes is to reflect the type, scope or other attribute of a variable in its\
    \ name.\n\nFor example:\n\n- `bFlag`\n- `nSize`\n- `m_nSize`\n\nWhere `b` indicates\
    \ a Boolean type, `n` an integer type and `m_` that the named variable is a field.\n\
    \nThis is a terrible idea.\n\nSuch notation might be useful if you are reading\
    \ code printed to paper, but all the information it provides is readily available\
    \ in a modern IDE.\n\nNaming things is hard enough without adding additional concerns\
    \ that the name must handle.\n\nThese types of notation are like comments. They\
    \ add noise and must be maintained in tandem with the information they duplicate.\
    \ If extra effort is not spent to maintain them they become misleading.\n\nUncle\
    \ Bob Martin puts it nicely:\n\n> \"nowadays, HN and other forms of type encoding\
    \ are simply impediments. They make it harder to change the name or type of a\
    \ variable, function, member or class. They make it harder to read the code. And\
    \ they create the possibility that the encoding system will mislead the reader\"\
    \n"
  raw: "Avoiding concatenation in a loop is reasonable. Using a `StringBuilder` is\
    \ likely to be more efficient if the loop executes a reasonable number of times\
    \ as it will avoid string allocations.\n\nThe performance difference is unlikely\
    \ to be significant in most cases, but the resulting code isn't noticeably less-readable\
    \ - so it is a premature optimization without a cost.\n\nLets see what happens\
    \ when we apply this advice when no loop is present:\n\n```\n public String buffer(String\
    \ s, int i) {\n    StringBuilder sb = new StringBuilder();\n    sb.append(\"Foo\"\
    );\n    sb.append(s);\n    sb.append(i);\n    return sb.toString();\n  }\n\n \
    \ public String concat(String s, int i) {\n    return \"Foo\" + s + i;\n  }\n\
    ```\n\nThe `concat` version is far clearer.\n\nIs it less efficient?\n\nThe eclipse\
    \ compiler generates the following bytecode for `concat`:\n\n```\n NEW java/lang/StringBuilder\n\
    \    DUP\n    LDC \"Foo\"\n    INVOKESPECIAL java/lang/StringBuilder.<init> (Ljava/lang/String;)V\n\
    \    ALOAD 1\n    INVOKEVIRTUAL java/lang/StringBuilder.append /\n       (Ljava/lang/String;)Ljava/lang/StringBuilder;\n\
    \    ILOAD 2\n    INVOKEVIRTUAL java/lang/StringBuilder.append (I)Ljava/lang/StringBuilder;\n\
    \    INVOKEVIRTUAL java/lang/StringBuilder.toString ()Ljava/lang/String;\n   \
    \ ARETURN\n```\n\nA `StringBuilder` is created by the compiler behind the scenes\
    \ to handle the concatenation so our simpler cleaner code produces identical bytecode\
    \ to the more verbose option.\n\nThe presence of loops in the code may prevent\
    \ the compiler performing this optimization, but code without branches will be\
    \ optimized every time. Although compilers may exist that do not support this\
    \ optimization it is unlikely that you will ever use them.\n\n# Hungarian Notation\n\
    \n# Bad Advice - Hungarian Notation\n\nThe idea of Hungarian notation and similar\
    \ schemes is to reflect the type, scope or other attribute of a variable in its\
    \ name.\n\nFor example:\n\n*   bFlag\n\n*   nSize\n\n*   m_nSize\n\nWhere `b`\
    \ indicates a Boolean type, `n` an integer type and `m_` that the named variable\
    \ is a field.\n\nThis is a terrible idea.\n\nSuch notation *might* be useful if\
    \ you are reading code printed to paper, but all the information it provides is\
    \ readily available in a modern IDE.\n\nNaming things is hard enough without adding\
    \ additional concerns that the name must handle.\n\nThese types of notation are\
    \ like comments. They add noise and must be maintained in tandem with the information\
    \ they duplicate. If extra effort is not spent to maintain them they become misleading.\n\
    \nUncle Bob Martin puts it nicely:\n\n> \"nowadays, HN and other forms of type\
    \ encoding are simply impediments. They make it harder to change the name or type\
    \ of a variable, function, member or class. They make it harder to read the code.\
    \ And they create the possibility that the encoding system will mislead the reader\""
