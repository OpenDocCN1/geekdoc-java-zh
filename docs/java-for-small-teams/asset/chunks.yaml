  trans: "\n\n不可变对象可能发生的情况要比可变对象少得多。通过限制长生命周期对象的行为，我们让事情变得更简单了。我们需要考虑的可能性也随之减少。\n\n\
    遗憾的是，从类的定义中并不总是容易看出该类型对象的生命周期。可能只会创建短命的实例，也可能只创建长命的实例。又可能是两者的混合。\n\n如果我们默认设计不可变类，我们就不需要担心这个问题了。\n\
    \n## 可变对象的问题\n\n假设我们有一个像 `Foo` 这样非常简单的类：\n\n```java\npublic class Foo {\n  private\
    \ Long id;\n\n  public Long getId() {\n    return id;\n  }\n\n  public void setId(Long\
    \ id) {\n    this.id = id;\n  }\n\n  @Override\n  public int hashCode() {\n  \
    \  return Objects.hashCode(id);\n  }\n\n  @Override\n  public boolean equals(Object\
    \ obj) {\n    if (this == obj)\n      return true;\n    if (obj == null)\n   \
    \   return false;\n    if (getClass() != obj.getClass())\n      return false;\n\
    \    Foo other = (Foo) obj;\n    return Objects.equals(id, other.id);\n  }\n}\n\
    ```\n\n我们需要在代码库中搜索它的所有用法，以确保以下成立：\n\n### 它永远不会从多线程访问\n\n`Foo` 不是线程安全的。\n\n对 long\
    \ 类型的写入不是原子的，且 `Foo` 内部没有任何机制可以建立字段写入和读取操作之间的“先发生于”（happens-before）关系。\n\n如果从不同的线程调用\
    \ `setId` 和 `getId`，我们可能会得到过时的值或垃圾值。\n\n### 在 `Foo` 放入 Set 之后永远不会被调用 `setId`\n\
    \n该类的 `hashcode` 依赖于一个可变字段。如果我们在将其放入集合后修改了它，那么我们程序的行为将不符合预期。\n\n### 我们的数据流\n\n\
    即使我们的程序运行正常，我们也需要做额外的工作来理解它是如何运行的。\n\n`setId` 可以在对象创建后的任何点被调用。因此，我们只能通过查找所有对 `setId`\
    \ 的调用来理解数据如何在程序中流动的——可能有几处，也可能只有一个。我们发现这一点的唯一就是检查整个程序。\n\n## 不可变对象\n\n如果我们能让对象变得不可变，我们就获得了某种保障，意味着我们不需要担心对象是如何被使用的。\n\
    \n```java\n@Immutable\npublic final class Foo {\n  private final Long id;\n\n\
    \  public Foo(Long id) {\n    this.id = id;\n  }\n\n  public Long getId() {\n\
    \    return id;\n  }\n\n  @Override\n  public int hashCode() {\n    return Objects.hashCode(id);\n\
    \  }\n\n  @Override\n  public boolean equals(Object obj) {\n    if (this == obj)\n\
    \      return true;\n    if (obj == null)\n      return false;\n    if (getClass()\
    \ != obj.getClass())\n      return false;\n    Foo other = (Foo) obj;\n    return\
    \ Objects.equals(id, other.id);\n  }\n}\n```\n\n`Foo` 是长命还是短命已经不再重要了。\n\n它本质上是线程安全的。\n\
    \n我们知道，无论用什么值构造它，它将一直保持到销毁。数据只有一个写入点，因此我们不需要搜索其他点。\n\n### 注解\n\n该示例使用了 JSR305\
    \ 的 `javax.annotation.concurrent.Immutable` 注解。\n\n这并没有任何方式改变对象的功能，但提供了一种传达该类为不可变意图的方法。静态分析工具如\
    \ [Mutability Detector](https://github.com/MutabilityDetector/MutabilityDetector)\
    \ 可以检查这种意图是否被违背。\n\n我们可以一眼看出 `Foo` 是不可变的，因为它具有已知不可变类型的 `final` 字段。\n\n`final`\
    \ 关键字仅确保字段所引用的引用不会改变。\n\n如果字段类型是 `Bar`，那么在不检查 `Bar` 确定它是否也是不可变的情况下，我们无法知道它是可变的。即使不使用静态分析工具，使用\
    \ `Immutable` 注解也会让这种评估更快。\n\n我们不是更新不可变对象的状态，而是创建新实例来保留我们不想修改的状态。\n\n这种模式起初对某些\
    \ Java 程序员来说很奇怪，但这种编程模型与熟悉的 `String` 类的工作原理相似。\n\n```java\n@Immutable\npublic\
    \ final class Bar {\n  private int anInt;\n  private String aString;\n\n  public\
    \ Bar(int anInt, String aString) {\n    this.anInt = anInt;\n    this.aString\
    \ = aString;\n  }\n\n  @CheckReturnValue\n  public Bar withAnInt(int anInt) {\n\
    \    return new Bar(anInt, this.aString);\n  }\n\n  @CheckReturnValue\n  public\
    \ Bar withAString(String aString) {\n    return new Bar(this.antInt, aString);\n\
    \  }\n}\n```\n\n通过调用 `withAString` 和 `withAnInt` 可以获得带有新值的 `Bar` 实例。\n\nJSR305\
    \ 的 `javax.annotation.CheckReturnValue` 使静态分析工具如 [Error Prone](https://github.com/google/error-prone)\
    \ 在发生错误时（如下所示代码所示）发出警告。\n\n```java\npublic Bar doThings(Bar bar) {\n  if(someLogic())\
    \ {\n    bar.withAnInt(42);\n  }\n  return bar;\n}\n```\n\n```java\npublic Bar\
    \ doThings(Bar bar) {\n  if(someLogic()) {\n    bar.withAnInt(42);\n  }\n  return\
    \ bar;\n}\n```\n\n## 什么时候使用可变对象\n\n创建可变对象比创建不可变对象所需的样板代码稍少。\n\n如果你知道一个类将用于创建短命的局部对象，那么你可以考虑它是可变的。但你必须权衡随着代码库的增长，为了确保它仅以这种方式使用而所需的额外工作。\n\
    \n目前有选项可以自动生成不可变和可变类，从而消除了可变对象的主要优势。这些选项中的两个将在“如何实现 Hashcode 和 Equals”中进一步讨论。\n\
    \n可变对象曾是 Java 的常态。结果是许多许多框架需要可变对象。持久化和序列化框架通常需要带有无参构造函数和 setter 的 Java Bean。文档并不总是强调这一点，但某些长期框架已经更新以支持不可变对象。\n\
    \n例如 Jackson 现在允许对构造函数和工厂方法进行注解：\n\n```java\npublic class Foo {\n  private final\
    \ int x;\n  private final int y;\n\n  @JsonCreator\n  public Foo(@JsonProperty(\"\
    x\") int x, @JsonProperty(\"y\") int y) {\n    this.x = x;\n    this.y = y;\n\
    \  }\n}\n```\n\n其他框架（如 Hibernate）只能与提供默认构造函数的类一起使用。虽然它们可以配置为直接设置字段而不需要 setter，但这产生的问题比解决的问题多。\n\
    \n如果你受限于一个需要可变性的框架，那么在与该框架交互时，你将使用可变对象。\n\n"
- fmt: "\nAlthough there is value in consistency, there is also a cost.\n\nUnless\
    \ there is already broad agreement across teams about how things should be formatted,\
    \ trying to enforce one official set of rules is likely to create more ill will\
    \ than benefit.\n\nA global preferred reference should therefore be set, but teams\
    \ should be free to deviate from this as they see fit as long as a consistent\
    \ style is used for the code they maintain.\n\n## Suggested Formatting Rules\n\
    \nIf your do not have your own strong preferences we suggest you follow the [Google\
    \ Java Style](https://google.github.io/styleguide/javaguide.html).\n\nThese formatting\
    \ rules are well thought out, clearly documented and not overly prescriptive.\
    \ \n\nWe will not describe them in any detail here, but code formatted to these\
    \ rules will look something like the following :-\n\n```java\nclass Example {\n\
    \  int[] myArray = {1, 2, 3, 4, 5, 6};\n  int theInt = 1;\n  String someString\
    \ = \"Hello\";\n  double aDouble = 3.0;\n\n  void foo(int a, int b, int c, int\
    \ d, int e, int f) {\n    if (f == 5) {\n      System.out.println(\"fnord\");\n\
    \    } else {\n      System.out.println(someString);\n    }\n\n    switch (a)\
    \ {\n      case 0:\n        Other.doFoo();\n        break;\n      default:\n \
    \       Other.doBaz();\n    }\n  }\n\n  void bar(List<Integer> v) {\n    for (int\
    \ i = 0; i < 10; i++) {\n      v.add(new Integer(i));\n    }\n  }\n}\n```\n\n\
    However, we suggest that the guidance in the Google guide on when to write Javadoc\
    \ is ignored in favor of our own.\n\n### Notable Points About This Style\n\n###\
    \ Spaces not Tabs\n\nTabs may appear differently depending on how an editor is\
    \ configured. This will result in constant reformatting as different programmers\
    \ adapt the file to the editor settings. Spaces avoid this problem.\n\nIn some\
    \ languages (e.g. JavaScript before the rise of code minifiers) tabs have/had\
    \ an advantage as they reduced the size of the source file compared to using multiple\
    \ spaces. The increase in size of the source file is of no relevance for Java.\n\
    \n### One True Brace Style\n\nThere are various arguments about the supposed advantages\
    \ of this style, but we suggest its use mainly because it is common in the Java\
    \ community.\n\nAlthough simple `if else` statements can be more concisely written\
    \ by omitting the braces we suggest that they are always included. This reduces\
    \ the chance of a statement being placed outside the conditional when this was\
    \ not the intent.\n\n## Group Methods For Easy Comprehension\n\n### Summary\n\n\
    The public methods of a class should appear at the top of the file, the private\
    \ methods towards the bottom and any protected or package default methods in between.\n\
    \nIn addition to arranging by accessibility, they should also be ordered into\
    \ a logical flow.\n\n### Detail\n\nThis scheme tries to achieve two goals:\n\n\
    1. Highlight the public API by separating it from implementation detail\n2. Allow\
    \ the reader to follow the logical flow with the minimal of scrolling\n\nTo achieve\
    \ the 2nd goal, methods should be arranged into logical groups, with methods always\
    \ appearing above the ones they call.\n\nThe two goals clearly conflict because\
    \ grouping the public API methods together at the top of the file prevents grouping\
    \ them with the implementation methods that they used. If this causes a large\
    \ problem it may be an indication that the class has too many responsibilities\
    \ and could be refactored into one or more smaller classes.\n\nQuestions of the\
    \ \"correct\" location of a method will also occur when an implementation method\
    \ is called from multiple locations or methods have recursive relationships. There\
    \ is, of course, no one right answer and any ordering that broadly meets the second\
    \ goal may be used.\n\nConstructors and static factory methods should usually\
    \ be placed first in the class. The fact that a method is `static` should not,\
    \ however, generally influence where it is placed.\n\n#### Example\n\n```java\n\
    public class Layout {\n\n  private int a;\n\n  Layout() {...}\n\n  public static\
    \ Layout create() {...}\n\n  public void api1() {\n    if (...) {\n      doFoo();\n\
    \    }\n  }\n\n  public void api2() {\n    if(...) {\n      doBar();\n    }\n\
    \  }\n\n  private void doFoo() {\n    while(...) {\n      handleA();\n      handleB();\n\
    \    }\n    leaf();\n  }\n\n  private void handleA() {...}\n\n  private void handleB()\
    \ {...}\n\n  private static void doBar() {\n    if (...) {\n      leaf();\n  \
    \  }\n  }\n\n  private void leaf() {...}\n}\n```\n\nFields should always be placed\
    \ at the top of the class before any methods.\n\n## Keep Methods Small And Simple\n\
    \n### Summary\n\nKeep methods small and simple.\n\n### Details\n\nSmall things\
    \ are easier to understand than big things. Methods are no different.\n\nOne way\
    \ to measure the size of a method is via the number of lines of code it contains.\n\
    \nAs a guide methods should not usually be longer than `7` lines in length. This\
    \ is not a hard rule - just a guide of when to feel uncomfortable with a method's\
    \ size.\n\nAnother way to gauge the size of a method is to see how many possible\
    \ paths there are through it. The `Cyclomatic complexity` of a method gives a\
    \ measure of this - it will increase as the amount of conditional logic and number\
    \ of loops grows.\n\nAs a guide, methods should not usually have.\n"
