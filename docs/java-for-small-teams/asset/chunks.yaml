  trans: "\n\n```java\npublic void fnord(int i) {\n  if (i == 1) {\n    performSideEffect();\n\
    \  }\n}\n```\n\n`更好`\n\n```java\npublic void fnord(int i) {\n  if (i == VALID)\
    \ {\n    performSideEffect();\n  }\n}\n```\n\n`你偏离了重点`\n\n```java\npublic void\
    \ fnord(int i) {\n  if (i == ONE) {\n    performSideEffect();\n  }\n}\n```\n\n\
    如果你提取的常量对应一个可识别的概念，请创建一个枚举（Enum）：\n\n`好`\n\n```java\npublic void fnord(FnordStatus\
    \ status) {\n  if (status == FnordStatus.VALID) {\n    performSideEffect();\n\
    \  }\n}\n```\n\n某些编码规范会做出像“0 和 1 是此规则的例外”这样的语句。然而，这过于简化了。有时，当 0 和 1 作为底层代码的一部分时，它们具有明确的局部含义，例如：\n\
    \n```\n if (list.size() == 0) {...}\n```\n\n但 0 和 1 也可能具有特定领域的值，应该像其他字面量一样被提取为常量。服务器端\
    \ Java 通常也可以在不使用数字字面量的情况下以更简洁重写，例如：\n\n```\n if (list.isEmpty()) {...}\n```\n\n\
    # 不要使用 Assert 关键字\n\n## 不要使用 Assert 关键字\n\n### 总结\n断言（Assertions）是一种实用的编码技术，可以提供许多益处，但在大多数情况下，使用第三方库来实现它们比使用\
    \ `assert` 关键字更好。\n\n### 详细说明\n使用 `assert` 关键字编写的断言仅在设置了 `-ea` JVM 标志时才会启用。该标志的意图是允许在开发和测试环境中启用断言，但在生产环境中禁用，以避免断言逻辑带来的性能开销。这通常是过早优化，并且会增加出错的机会，因为代码在开发环境和生产环境中的行为会不同。\n\
    \n在生产环境中关闭断言也会极大地削弱它们的价值。如果发生了编码错误，断言可以确保该错误在早期、靠近 bug 的地方被报告。如果生产环境中关闭了断言，bug\
    \ 可能会静默传播。这可能导致后果更严重，并会使问题变得难以诊断。\n\n因此，出于这些原因，除非你正在性能非常敏感的领域工作，否则应该始终启用断言。对于始终开启的断言，第三方库如\
    \ `Guava` 的 `preconditions` 提供了比 `assert` 关键字更好的解决方案。另一个独立的问题是在测试中使用 `assert`\
    \ 关键字。这通常是因为对 Java 和 JUnit 熟悉熟悉。在野外发现的在测试中使用 `assert` 的代码库中，很少设置 `-ea` 标志，这意味着测试永远不会失败。对于测试，应该始终使用\
    \ JUnit 内置的断言或现代的专注于测试的断言库（如 `AssertJ`）。\n\n# 避免使用 Float 和 Double\n\n## 避免 Float\
    \ 和 Double\n\n### 总结\n避免使用单精度浮点数和双精度浮点数（基本类型及其包装类）。\n\n### 详细说明\nfloat 和 double\
    \ 引入了四舍入和比较问题的雷区。虽然对于某些不在乎四舍入误差的领域它们是合理的选择，但对于服务器端业务代码，整数或 `BigDecimal` 通常是更好的选择。\n\
    \n核心问题是，浮点数无法表示许多数字（例如 `0.1`）。这导致了简单的测试用例可能无法到的意外结果：\n\n```\n double balance =\
    \ 2.00;\n    double transationCost = 0.10;\n    int numberTransactions = 6;\n\n\
    \    System.out.printf(\"After %s transactions balance is %s\"\n             \
    \       , numberTransactions\n                    , balance - (transationCost\
    \ * numberTransactions));\n    // 结果为 After 6 transactions balance is 1.4 :-)\n\
    ```\n\n但是\n\n```\n double balance = 2.00;\n    double transationCost = 0.10;\n\
    \    int numberTransactions = 7;\n\n    System.out.printf(\"After %s transactions\
    \ balance is %s\"\n                     , numberTransactions\n               \
    \      , balance - (transationCost * numberTransactions));\n    // 结果为 After 7\
    \ transactions balance is 1.2999999999999998 :-(\n```\n\n在这种情况下，简单的解决方案是将浮点数替换为整数值（即以分而不是美元为单位跟踪余额）。在无法用整数替换\
    \ float 的情况下，可以将代码重写为使用 `BigDecimal`：\n\n```java\n BigDecimal balance = new BigDecimal(\"\
    2.00\");\n    BigDecimal transationCost = new BigDecimal(\"0.10\");\n\n    BigDecimal\
    \ numberTransactions = BigDecimal.valueOf(7);\n\n    System.out.printf(\"After\
    \ %s transactions balance is %s\"\n                     , numberTransactions\n\
    \                     , balance.subtract(transationCost.multiply(numberTransactions)));\n\
    \n   // 结果为 After 7 transactions balance is 1.30 :-)\n```\n\n注意，虽然 `BigDecimal`\
    \ 可以从 float 构造，但这会将我们回到原点：\n\n```java\n BigDecimal balance = new BigDecimal(\"\
    2.00\");\n    BigDecimal transationCost = new BigDecimal(0.10); // <- 使用 float\
    \ 构造\n\n    BigDecimal numberTransactions = BigDecimal.valueOf(7);\n\n    System.out.printf(\"\
    After %s transactions balance is %s\"\n                     , numberTransactions\n\
    \                     , balance.subtract(transationCost.multiply(numberTransactions)));\n\
    \n   // 结果为 After 7 transactions\n   // balance 为 1.2999999999999998\n```\n\n\
    ### 什么时候使用 float 和 double\nfloat 和 double 显然不是全坏的，否则它们不太可能包含在 Java 语言中。对于性能敏感的领域，如机器学习、物理引擎、科学应用等，原始类型相比\
    \ `BigDecimal` 有性能优势。在这些领域，性能收益可能远大于额外风险。使用 `BigDecimal` 的代码通常也更加冗长和笨拙。如果你在一个可以接受浮点类型不精度的领域工作，你可能更喜欢它们带来的简洁代码，但请确保你在做出这种选择时充分了解其中的陷阱。\n\
    \n# 不要使用反射\n\n## 不要使用反射\n\n### 总结\n不要在代码中使用反射（即使用 `java.lang.reflect` 包中的任何内容）。\n\
    \n### 详细说明\n反射是一个强大的工具；它允许 Java 实现某些原本无法实现或需要大量模板代码的功能。但是，虽然它在创建框架或库时有时有用，但它不太可能是解决我们在普通的服务器端代码中遇到的问题的好方法。\n\
    \n那么为什么我们要避免使用 Java 提供的强大工具呢？反射有三个主要缺点：\n\n#### 丢失编译时安全性\n反射将错误从编译时移动到运行时——这是一个坏事。编译器是我们防御缺陷的第一道防线，类型系统是我们记录代码的最有效的工具之一。我们不应该轻易抛弃这些。\n\
    \n#### 丢失重构安全性\n重构和代码分析工具对反射是盲目的。尽管它们可能会尝试考虑这一点，但反射为程序行为带来的额外可能性，意味着工具无法再提供其已理解程序的严谨保证。在存在反射的情况下，原本安全的重构可能会改变程序，分析工具可能会报告错误的结果。\n\
    \n#### 增加代码理解难度\n正如反射让自动化工具更难理解代码，它也让人类更难理解代码。反射引入了惊喜。“这个方法从未被调用过，我可以安全地删除它。*\
    \ 哦，反射。\n\n*由于我知道是在哪里调用的，我可以安全地更改这个私有方法的行为。* 哦，反射。\n\n"
- fmt: "\nThe JDK contains a number of utility functions that should be used to replace\
    \ more verbose code.\n\n### Details\n\nAs discussed in \"Optimize for Readability\
    \ not Performance\" we should prefer simple code to more complex code that we\
    \ think might be more efficient (unless we have demonstrated that the more complex\
    \ code has a real benefit via profiling and performance testing).\n\nSometimes\
    \ however we find ourself in the happy situation where we do not need to make\
    \ a trade off between the clarity of our code and (presumed) performance. Sometimes\
    \ there is also reason to believe that cleanest version of the code might also\
    \ be slightly more efficient.\n\nThere are a number of small functions scattered\
    \ around the JDK that are both cleaner than the code they are commonly used to\
    \ replace, and also possible slightly more efficient. These should be used whenever\
    \ possible, and once you know they are there any code that doesn't use them will\
    \ will look slightly wrong.\n\nMost IDEs will prompt you to use some or all of\
    \ these one liners.\n\n## java.util.Arrays.asList\n\nFor when you need to convert\
    \ an array to a fixed size list.\n\n```\nList ss = Arrays.asList(\"1”, “2\");\n\
    ```\n\nThis is cleaner and more efficient than the commonly seen alternatives\
    \ such as:\n\n```\nList ss = new ArrayList<>(); ss.add(“1”); ss.add(“2”);\n```\n\
    \nThe list implementation returned by `asList` is specialized and may consume\
    \ slightly less memory than an `ArrayList`.\n\nBe aware that the lists created\
    \ by this method are not fully immutable. They are fixed size and will throw a\
    \ `java.lang.UnsupportedOperation` if you try to add or remove members, but modifying\
    \ methods such as `set` will succeed.\n\nIf you are working with Java 9 the `List.of`\
    \ methods provide a superior alternative.\n\n## java.util.Collections.empty*\n\
    \nThe `java.util.Collections` class contains methods that create unmodifiable\
    \ versions of the common collections classes specialized to contain either no\
    \ entries or single entries.\n\nThe most common ones are:\n\n* `emptyMap`\n* `emptyList`\n\
    * `emptySet`\n* `singletonList`\n* `singletonMap`\n* `singletonSet`\n\nBut there\
    \ are other more specialized methods there as well.\n\nAgain, using these results\
    \ in cleaner more descriptive code compared to the common alternatives and the\
    \ specialized data structures returned may have a slightly smaller footprint.\n\
    \nIf you are working with Java 9 the static `of` methods provide a superior alternative\
    \ to the single entry methods.\n\n## valueOf\n\nThe form:\n\n```\nBoolean b =\
    \ Boolean.valueOf(true);\n```\n\nIs slightly more efficient than the subjectively\
    \ uglier:\n\n```\nBoolean b = new Boolean(true);\n```\n\n`valueOf` will return\
    \ one of two fixed Boolean instances while calling the constructor will always\
    \ allocate a new object.\n\nSimilarly for `Integers` `valueOf` will return a shared\
    \ instance for values between -128 and 127.\n\n`Long.valueOf` will similarly return\
    \ objects from a cache.\n\nThe Oracle JDK does not currently look to use a cache\
    \ for Floats or Doubles when calling `valueOf`. So using `valueOf` in preference\
    \ to new for floating points might not have an advantage, but it has no disadvantage\
    \ either.\n\nOverloaded versions of the `valueOf` methods construct their desired\
    \ types from Strings. If you need to create a boxed primitive from a String, this\
    \ is the way to do it.\n\nIt is worth noting that, although it is not guaranteed\
    \ by the spec, in practice Java compilers implement auto boxing by calling `valueOf`.\n\
    \nSo:\n\n```\nBoolean b = true;\n```\n\nand\n\n```\nBoolean b = Boolean.valueOf(true);\n\
    ```\n\nAre equivalent.\n\nAs of Java 9 the boxed primitive constructors are deprecated\
    \ in favour of the `valueOf` and `parse` methods (see below).\n\n## parseXXX\n\
    \nSimilar to `valueOf` the `parseXXX` methods convert a string to a primitive,\
    \ only in this case the primitive is not boxed.\n\n```\nfloat f = Float.parseFloat(“1.2”);\n\
    ```\n\nThis does exactly what the method says, and compared to the commonly seen\
    \ alternative:\n\n```\nfloat f = new Float(“1.2”);\n```\n\nIt avoids the construction\
    \ and unboxing of a `Float` object.\n\nSimilar methods exist for Boolean, Double,\
    \ Integer and the other primitive types.\n\n## isEmpty\n\nA common clumsy idiom\
    \ is to check if a `Collection` is empty by checking its size:\n\n```\nif ( list.size()\
    \ == 0 ) {\n  // do stuff\n}\n```\n\nThe clearer and more concise:\n\n```\nif\
    \ ( list.isEmpty() ) {\n  // do stuff\n}\n```\n\nMay also be more computationally\
    \ efficient, depending on the data structure it is being called on.\n\nOften there\
    \ is no performance difference, but for a large `ConcurrentLinkedQueue` the difference\
    \ can be significant.\n\n## Java 9 factory methods\n\nJava 9 added static factory\
    \ `of` methods to the `List`, `Set` and `Map` interfaces.\n\nThese allow us to\
    \ construct the collections cleanly e.g.\n\n```\nList.of(1, 2, 3);\nSet.of(42);\n\
    ```\n\nThe `of` methods are overloaded to up to 10 values.\n\nThe code reads slightly\
    \ better than the Java 8 `Arrays.asList` version and returns a fully structurally\
    \ immutable list that does not allow elements to be replaced. It may also be slightly\
    \ more efficient as it avoids allocating an array.\n\nAlthough `of` is overloaded\
    \ to take no parameters this expressed intent less well than `emptyList` etc which\
    \ may therefore still be preferred.\n\n# Tests\n\n# Good Tests\n\nThe testing\
    \ pyramid and different levels of tests are discussed in \"Agree the language\
    \ you use for tests\".\n\nAs discussed in that section it is important to maintain\
    \ a layered strategy with many fast running unit tests and smaller numbers of\
    \ integration and system tests. The precise proportions that work best will vary\
    \ from project to project but the pyramid formation will hold.\n\nAlthough it\
    \ is important to write tests at all these levels this section mainly concerns\
    \ itself with unit tests as these are the ones we write most of and run most frequently.\n\
    \n# Write Specifications Not Tests\n\n## Write Specifications Not Tests\n\nBefore\
    \ you sit down to write a test it's important to understand *why* you are doing\
    \ it.\n\nWhat is it that you want to achieve?\n\nThere is an unfortunate tendency\
    \ for developers to look at tests as a thing you have to do because it's \"best\
    \ practice\". Some extra work to be performed after the real work is done. A chore.\n\
    \nThe reason for writing them has become lost.\n\n### Why Write Tests?\n\nThe\
    \ reason to write tests is to make our lives easier.\n\nIf we are not writing\
    \ tests that do this we should stop writing them.\n\nA good test should do all\
    \ of the following:\n\n* Enable refactoring by preventing regression when the\
    \ implementation changes\n* Catch bugs during initial coding\n* Document how the\
    \ code behaves\n* Inform the design of the code\n\nWhen tests are viewed as a\
    \ chore to be completed after the code is written only this first point is considered.\n\
    \nOften it is not achieved.\n\nTests written with this mindset can have a negative\
    \ value:\n\n* Instead of enabling refactoring they can increase its cost.\n* Instead\
    \ of documenting what the code does, the tests are harder to understand than the\
    \ code itself.\n* Instead of aiding development they increase the work that must\
    \ be done\n\nThis first problem causes the most pain.\n\nIf you have a test that\
    \ is tied to the code's implementation, to change the way the code is implemented\
    \ you have to spend effort changing the test.\n\nIf the test must change whenever\
    \ the implementation changes then we cannot trust that the test will stop regression.\
    \ How do we know we did not introduce a bug into the test when we changed it?\n\
    \n### Executable Specifications\n\nSo how do we make sure we do not write negative\
    \ value tests? How do we make sure we write tests that provide the benefits in\
    \ our list?\n\nThe first thing to do is let go of the idea that we are testing.\n\
    \nWe are not testing, we're *specifying*.\n\nTo test something you only need to\
    \ verify that it \"does what it does\". To specify you need to describe the important\
    \ things that it must do in a way that can be clearly understood.\n"
