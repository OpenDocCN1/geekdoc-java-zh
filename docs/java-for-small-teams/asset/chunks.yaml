    After %s transactions balance is %s\"\n                    , numberTransactions\n\
    \                    , balance - (transationCost * numberTransactions));\n   \
    \ // Gives After 6 transactions balance is 1.4 :-)\n```\n\nBut\n\n```\n double\
    \ balance = 2.00;\n    double transationCost = 0.10;\n    int numberTransactions\
    \ = 7;\n\n    System.out.printf(\"After %s transactions balance is %s\"\n    \
    \                 , numberTransactions\n                     , balance - (transationCost\
    \ * numberTransactions));\n    // Gives After 7 transactions balance is 1.2999999999999998\
    \ :-(\n```\n\nThe simplest solution in this case would be to replace the floats\
    \ with integer values (i.e. track the balance in units of cents rather than dollars).\n\
    \nIn situations where floats can't be replaced by integers code can be re-written\
    \ to use `BigDecimal`.\n\n```\n BigDecimal balance = new BigDecimal(\"2.00\");\n\
    \    BigDecimal transationCost = new BigDecimal(\"0.10\");\n\n    BigDecimal numberTransactions\
    \ = BigDecimal.valueOf(7);\n\n    System.out.printf(\"After %s transactions balance\
    \ is %s\"\n                     , numberTransactions\n                     , balance.subtract(transationCost.multiply(numberTransactions)));\n\
    \n   // Gives After 7 transactions balance is 1.30 :-)\n```\n\nNote that although\
    \ `BigDecimal` can be constructed from a float this would take us back to where\
    \ we started.\n\n```\n BigDecimal balance = new BigDecimal(\"2.00\");\n    BigDecimal\
    \ transationCost = new BigDecimal(0.10); // <- float used to construct\n\n   \
    \ BigDecimal numberTransactions = BigDecimal.valueOf(7);\n\n    System.out.printf(\"\
    After %s transactions balance is %s\"\n                     , numberTransactions\n\
    \                     , balance.subtract(transationCost.multiply(numberTransactions)));\n\
    \n   // Gives After 7 transactions\n   // balance is 1.2999999999999999611421941381195210851728916168212890625\n\
    ```\n\n### When to use floats and doubles\n\nFloats and doubles clearly can't\
    \ be all bad or it is unlikely that they would have been included in the Java\
    \ language.\n\nThe primitive floating point types have performance advantages\
    \ over `BigDecimal` that can be significant in highly numerical domains such as\
    \ machine learning, physics engines, scientific applications etc. In these domains\
    \ the performance benefit may greatly out-weigh the additional risk of error.\n\
    \nCode using `BigDecimal` is also inherently more verbose and clumsy than code\
    \ that uses primitives. If you are working in a domain where the imprecision of\
    \ floating point types is acceptable you might prefer the cleaner code they allow,\
    \ but be sure you are making this choice consciously with an understanding of\
    \ the pitfalls involved.\n\n# Do Not Use Reflection\n\n## Don't use Reflection\n\
    \n### Summary\n\nDo not use reflection in your code (i.e. anything from the `java.lang.reflect`\
    \ package).\n\n### Details\n\nReflection is a powerful tool; it allows Java to\
    \ do things that would otherwise be either impossible or require large amounts\
    \ of boilerplate code.\n\nBut, while it is sometimes useful when creating a framework\
    \ or library it is unlikely to be a good way to solve the types of problem we\
    \ encounter in normal server-side application code.\n\nSo why would we want to\
    \ avoid using a powerful tool that Java provides?\n\nReflection has three main\
    \ drawbacks:\n\n#### Loss of Compile Time Safety\n\nReflection moves errors from\
    \ compile time to runtime - this is a Bad Thing ™\n\nThe compiler is our first\
    \ form of defense against defects and the type system is one of the most effective\
    \ tools we have to document our code. We should not throw these things away lightly.\n\
    \n#### Loss of Refactor Safety\n\nRefactoring and code analysis tools are blind\
    \ to reflection.\n\nAlthough they may make some attempt to take it into account,\
    \ the additional possibilities reflection creates for how a program might behave\
    \ means the tools can no longer provide rigorous guarantees that they have understood\
    \ the program. In the presence of reflection refactorings that would otherwise\
    \ be safe may change program and analysis tools may report incorrect results.\n\
    \n#### Harder Code Comprehension\n\nIn the same way that Reflection makes it harder\
    \ for automated tools to understand code, it also makes it harder for humans to\
    \ understand code.\n\nReflection introduces surprises.\n\n*This method is never\
    \ called, I can safely delete it.* Oh. Reflection.\n\n*I can safely change the\
    \ behavior of this private method as I know where it is called from.* Oh. Reflection.\n\
    \n# Know The JDK One Liners\n\n## Know common one liners\n\n### Summary"
