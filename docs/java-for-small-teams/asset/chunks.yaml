  trans: "\n与普通的 Java 不同，访问器（accessors）的声明顺序很重要，因为生成器使用它来定义构造函数参数的顺序。因此，重新排序访问器可能会引入意想不到的\
    \ Bug。\n\n## Lombok\n\nLombok 还可以（以及其他功能）生成值对象的完整实现。它与 Google auto 采取不同的方法。\n\n\
    假设有如下注解的类：\n\n```\n@Value\npublic class ValueExample {\n  String name;\n  @NonFinal\
    \ int age;\n  double score;\n}\n```\n\n它会在构建时修改该类，产生类似于所示的实现：\n\n```\npublic final\
    \ class ValueExample {\n  private final String name;\n  private int age;\n  private\
    \ final double score;\n\n  public ValueExample(String name, int age, double score)\
    \ {\n    this.name = name;\n    this.age = age;\n    this.score = score;\n   }\n\
    \n  public String getName() {\n    return this.name;\n  }\n\n  public int getAge()\
    \ {\n    return this.age;\n  }\n\n  public double getScore() {\n    return this.score;\n\
    \  }\n\n  public boolean equals(Object o) {\n   // valid implementation of equality\
    \ based on all fields\n  }\n\n  public int hashCode() {\n   // valid hashcode\
    \ implementation based on all fields\n  }\n```\n\nGoogle `Value` 要求程序员为类提供有效的公共\
    \ API，而 `Lombok` 则根据其内部状态的描述来创建公共 API。该描述是有效的 Java 语法，但在被 `Lombok` 解释时具有不同的含义。\n\
    \n`Lombok` 会带来一些摩擦。如果没有理解它的 IDE，使用 `Lombok` 是不实际的——使用自动生成 API 的代码将看起来是无效的。必须安装\
    \ IDE 插件。\n\n虽然在安装 IDE 插件后，它（可以认为）引入的摩擦比 auto 更少，但 `Lombok` 的行为要让人惊讶得多。解释 `Auto`\
    \ 的作用很容易——它在构建时生成一个实现你定义的接口的类。而预测或解释 `Lombok` 会做什么则要困难得多。\n\n尽管 `Lombok` 要求程序员编写的代码比\
    \ `Auto` 等解决方案更少，但它更偏离了普通的 Java。\n\n如果你考虑为 Value 类使用代码生成器，我们建议在考虑 `Lombok` 之前先考虑\
    \ `Auto` 等方法。\n\n值得的是，`Lombok` 以 delombok 的形式提供了一个退路（参见“优于可逆的决策”），允许你输出生成的类。这些类随后可以用来替换带注解的原始类。\n\
    \n移除 `Auto` 同样简单——生成的类可以提交到源码树中。然后可以通过简单的重构移除人为的抽象类/实现拆分。\n\n# 不要重新赋值参数\n\n##\
    \ 总结\n方法的参数永远不应该被重新赋值。\n\n## 细节\n对参数重新赋值会让代码更难理解，并且与创建一个新变量相比没有意义上的优势。\n\n如果方法很大，可能很难跟踪参数的生命周期。即使在短方法中，重用参数也会导致问题。由于\
    \ `variable` 被用来表示两个独立的概念，通常无法为其起一个有意义的名字。\n\n**糟糕示例**\n\n```\npublic String foo(String\
    \ currentStatus) {\n  if ( someLogic() ) {\n    currentStatus  = \"FOO\";\n  }\n\
    \  return currentStatus;\n}\n```\n\n**更好示例**\n\n```\npublic String foo(final String\
    \ currentStatus) {\n  String desiredStatus = currentStatus;\n  if ( someLogic()\
    \ ) {\n    desiredStatus = \"FOO\";\n  }\n\n  return desiredStatus ;\n}\n```\n\
    \n参数可以声明为 `final`，以便读者可以一眼看出其值不会改变。\n\n# 限制范围\n\n## 将变量限制在尽可能小的范围范围内\n\n### 总结\n\
    变量应该尽晚声明，以便它们具有尽可能窄的作用范围。\n\n### 细节\n\n**糟糕示例**\n\n```\npublic void foo(String\
    \ value) {\n    String calculatedValue;\n    if (someCondition()) {\n        calculatedValue\
    \ = calculateStr(value);\n        doSomethingWithValue(calculatedValue);\n   \
    \ }\n}\n```\n\n**更好示例**\n\n```\npublic void foo(String value) {\n    if (someCondition())\
    \ {\n        String calculatedValue = calculateStr(value);\n        doSomethingWithValue(calculatedValue);\n\
    \    }\n}\n```\n\n**极好示例**\n\n```\npublic void foo(String value) {\n    if (someCondition())\
    \ {\n        doSomethingWithValue(calculateStr(value));\n    }\n}\n```\n\n有时，将值赋值给命名良好的临时变量会比内联调用方法产生更可读的代码，因为它有助于读者遵循数据和逻辑流。\n\
    \n根据经验法则，如果你无法为一个变量起一个名字，而该变量的作用仅仅是镜像获取其值的方法，那么这个变量应该被消除。\n\n# 优先使用 For Each 循环而非\
    \ For 循环\n\n## 总结\n优先使用 `for each` 循环而不是索引 `for` 循环。\n\n## 细节\nJava 5 引入的 `for\
    \ each` 循环避免了索引 `for` 循环潜在的越一错误（out-by-one errors），并且比使用迭代器的代码更简洁。\n\n**糟糕示例**\n\
    \n```\n public List<String> selectValues(List<Integer> someIntegers) {\n    List<String>\
    \ filteredStrings = new ArrayList<String>();\n    for (int i = 0; i != someIntegers.size();\
    \ i++) {\n      Integer value = someIntegers.get(i);\n      if (value > 20) {\n\
    \        filteredStrings.add(value.toString());\n      }\n    }\n    return filteredStrings;\n\
    \  }\n```\n\n**好一点示例**\n\n```\n public List<String> selectValues(List<Integer>\
    \ someIntegers) {\n    List<String> filteredStrings = new ArrayList<String>();\n\
    \    for (Integer value : someIntegers) {\n      if (value > 20) {\n        filteredStrings.add(value.toString());\n\
    \      }\n    }\n    return filteredStrings;\n  }\n```\n\n# 优先使用 Map 和 Filter\
    \ 而非命令式\n\n## 总结\n命令式循环将逻辑隐藏在内部——优先使用 map 和 filter，因为它们将逻辑与实现分离开。\n\n## 细节\n大多数基于循环的代码可以使用\
    \ filter 和 map 重写为声明式样式。Java 8 通过引入 lambda 和流 API 使这变得简单，但在 Java 7 中可以使用第三方库（如\
    \ Guava）应用相同的样式。\n\nfilter 和 map 突出了代码想要实现的目标。这在命令式实现中并不清晰。\n\n**糟糕示例**\n\n```\n\
    \ public List<String> selectValues(List<Integer> someIntegers) {\n    List<String>\
    \ filteredStrings = new ArrayList<String>();\n    for (Integer value : someIntegers)\
    \ {\n      if (value > 20) {\n        filteredStrings.add(value.toString());\n\
    \      }\n    }\n    return filteredStrings;\n  }\n```\n\n**更好 (Java 8)**\n\n\
    ```\n public List<String> selectValues(List<Integer> someIntegers) {\n    return\
    \ someIntegers.stream()\n        .filter(i -> i > 20)\n        .map(i -> i.toString())\n\
    \        .collect(Collectors.toList());\n  }\n```\n\n**更好 (Java 7 使用 Guava)**\n\
    \n```\n public List<String> selectValues(List<Integer> someIntegers) {\n    return\
    \ FluentIterable\n    .from(someIntegers)\n    .filter(greaterThan(20))\n    .transform(Functions.toStringFunction())\n\
    \    .toList();\n  }\n\n  private static Predicate<Integer> greaterThan(final\
    \ int limit) {\n    return new Predicate<Integer>() {\n      @Override\n     \
    \ public boolean apply(Integer input) {\n        return input > limit;\n     \
    \ }\n    };\n  }\n```\n\n注意，尽管 Java 7 版本需要更多的代码行（形式为匿名内部类的样板代码），但 `selectValues`\
    \ 方法的逻辑更加清晰。如果 `Predicate` 或映射函数所需的逻辑在多个处需要，那么将其移动到公共位置很容易。这在命令式版本中较难实现。\n\n"
- fmt: "\nAlso note that the method that creates the `Predicate` has been made static.\
    \ It is a good idea to do this, where possible, when returning an anonymous class\
    \ to prevent a long lived instance preventing the parent class from being garbage\
    \ collected. Although the `Predicate` is only short-lived in this instance, applying\
    \ static dogmatically in all cases avoids the overhead of thinking.\n\n# Avoid\
    \ Apis From Prehistory\n\n## Avoid APIs from Pre-History\n\n### Summary\n\nDo\
    \ not use `Vector`, `StringBuffer` and other archaic parts of the JDK.\n\n###\
    \ Details\n\nJava has been around for over 20 years. In order to maintain backwards\
    \ compatibility, it has hoarded all manner of APIs that no longer make sense to\
    \ use. Some of them are handily marked with `@Deprecated` annotation, others are\
    \ not.\n\nUnfortunately, many are still used in university courses and online\
    \ examples. New Java programmers may not be aware they have been replaced - a\
    \ few to watch out for include:\n\n* `java.util.Vector` - use `ArrayList` instead\n\
    * `java.lang.StringBuffer` - use `StringBuilder` instead\n* `java.util.Stack`\
    \ - use a `Deque` (e.g. `ArrayDeque`)\n* `java.util.Hashtable` - use a `Map` (e.g.\
    \ `HashMap`)\n* `java.util.Enumeration` - use an `Iterator` or an `Iterable`\n\
    \nEach of these replacements (except `Enumeration`) differ from the originals\
    \ by not being synchronized. If you think you need a synchronized collection go\
    \ away somewhere quiet and think again.\n\n# Beware Casts And Generics Warnings\n\
    \n## Beware Casts and Generics Warnings\n\n### Summary\n\nCasts dilute the benefit\
    \ of Java's type system, making code both less readable and less safe.\n\nAvoid\
    \ casts wherever possible.\n\nIf you find yourself writing one, stop and ask yourself\
    \ why you are writing it.\n\nWhat would need to be changed in your code so you\
    \ did not need to write that cast?\n\nWhy can't you make that change?\n\n### Detail\n\
    \nJava's type system is there to help us - it catches bugs at compile-time and\
    \ documents our code, making it easier to understand and navigate.\n\nWhen we\
    \ add a cast to our code, we lose both these benefits.\n\nCasts get introduced\
    \ into code for three main reasons:\n\n1. We have reached the limits of Java's\
    \ type system and the programmer must take control\n2. The overall design of the\
    \ code is poor\n3. The code uses raw generic types\n\nWe'll look at these in reverse\
    \ order.\n\n#### Code with Raw Types\n\nIf code contains raw generic types (either\
    \ because the code pre-dates Java 5 or the programmer is not familiar with Java)\
    \ then it will create the need to cast.\n\nFor example:\n\n```\nList list = numberList();\n\
    for (Object each : list) {\n  Integer i = (Integer) each;\n  // do things with\
    \ integers\n}\n```\n\nThe compiler will not be happy that we have failed to fully\
    \ declare the type of `List` we are dealing with and will (depending on how it's\
    \ been configured) generate an error or warning on the line where `list` is declared\
    \ e.g.\n\n```\nList is a raw type. References to generic type List<E> should be\
    \ parameterized\n```\n\nSimilarly, for errant code such as:\n\n```\nList l = new\
    \ ArrayList<Number>();\nList<String> ls = l;\n```\n\nThe compiler will issue:\n\
    \n```\nThe expression of type List needs unchecked conversion to conform to List<String>\n\
    ```\n\nMake sure that all such warnings are addressed, either by imposing a zero\
    \ compiler warnings policy or by configuring the compiler to treat them as errors.\n\
    \nIn this case, removing both the cast and the warning is straight forward:\n\n\
    ```\nList<Integer> list = numberList();\nfor (Integer each : list) {\n   // do\
    \ things with each\n}\n```\n\n#### Poor Design\n\nSometimes, removing a cast or\
    \ fixing a warning is non-trivial. We have bumped into issue two - poor design.\n\
    \nFor example:\n\n```\nList<Widget> widgets = getWidgets();\nList results = process(widgets);\n\
    \nfor (Object each : results) {\n  if (each instanceof String) {\n    // handle\
    \ failure using data from string\n  } else {\n    EnhancedWidget widget = (EnhancedWidget)\
    \ each;\n    widget.doSomething();\n  }\n}\n```\n\nNormally, objects placed into\
    \ a collection should be of a single type or of multiple types related by a common\
    \ superclass or interface.\n\nHere, unrelated types have been placed into a collection.\
