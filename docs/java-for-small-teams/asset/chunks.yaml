  trans: "\n上述任何更改都不会改变我们程序的结构，甚至不会影响方法的签名。它们在减少代码行数和降低复杂性的同时，仍然提高了可读性。\n\n然而，通过一系列具有更高影响的更改来提取我们的领域模型并简化问题，通常是最佳方法。\n\
    \n很难猜测这个模型在我们构思的示例中可能是什么样的，但这种条件逻辑很可能可以用多态来代替。\n\n```\nenum ADomainConcept {\n\
    \  AAA(true),\n  ABA(true),\n  CC(true),\n  FWR(true),\n  OTHER(false),\n  ANDANOTHER(false);\n\
    \n  private final boolean isFnardy;\n  private ADomainConcept(boolean isFnardy)\
    \ {\n    this.isFnardy = isFnardy;\n  }\n\n  boolean  isFnardy() {\n    return\
    \ isFnardy;\n  }\n}\n```\n\n```]\n\n# 使用适当的语言特性\n\n方法有时会因为解决通用编程问题的样板代码而变得臃肿。新的语言特性已经消除了部分样板代码的需求。\n\
    \n这些一些*新*特征并不完全新，但代码仍然在没有它们的情况下编写：\n\n* Java 5 泛型消除了丑陋强制转换的需求\n* Java 5 for-each\
    \ 循环可以替代使用迭代器和索引循环的代码\n* Java 7 try-with-resources 可以替代复杂的 try, catch finally\
    \ 块\n* Java 7 multi-catch 可以替代重复的 catch 块\n* Java 8 lambda 表达式可以替代匿名类的样板代码\n\n\
    # 方法应该只做一件事\n\n## 方法应该只做一件事\n\n### 总结\n方法应该只做一件事。\n\n### 细节\n确保你知道如何在代码中避免使用 null。\n\
    \n尝试限制你或客户端编写以下内容的次数：\n\n```\n if ( != null ) {\n    ...\n  }\n```\n\n### 细节\n\
    尽管你交互的库和框架可能会返回 null，但你应该尝试确保这种做法仅限于第三方代码。\n\n你应用程序的核心应该假设它不需要担心 null 值。\n\n避免\
    \ null 的策略包括：\n\n* 空对象模式 - 当你认为某些内容是可选时\n* 类型安全的 null 模式（即 Option、Optional & Maybe）\
    \ - 当你需要表达接口可能不返回内容时\n* 契约设计\n\n### 空对象模式\n空对象模式是避免 null 的经典面向对象方法。当你认为你有一个可选的依赖项时，就应该使用它。\n\
    \n该模式非常简单，只需提供接口的一个实现，该实现“什么都不做”或具有中性行为。这样客户端就可以安全地引用它，无需检查 null。\n\n### 类型安全的\
    \ null（即 Optional）\n类型安全的 null 模式在大多数函数式编程语言中都很常见，在那里它们被被称为 Maybe、Option 或 Optional。Java\
    \ 8 终于添加了 Optional 类型，但早期版本可以通过 Guava 和其他库获得实现。\n\n这是一个简单的模式。`Optional` 基本上只是一个可以容纳一个或零个值的盒子。你可以检查盒子是否为空（使用\
    \ `isPresent`）并通过 `get` 方法获取其值。\n\n每当公共方法可能作为正常程序流的一部分而不返回任何值时，都应该使用 `Optional`。\n\
    \n如果你在空的 `Optional` 上调用 `get`，它将抛出 `NoSuchElementException`。\n\n相对于直接使用 null，Optional\
    \ 提供了什么可能并不显而易见。有几点重要的区别。\n\n首先，如果你的方法声明为 `Optional<Person>`，你可以从类型看出它可能不返回值。如果它只返回\
    \ `Person`，你只有查看源码或文档才知道它可能返回 null。\n\n同样重要的是，如果你知道返回 `Person` 的方法总是返回值而永远不返回\
    \ null。\n\n最后，使用 Optional 的优方法不是调用 `get` 方法或显式检查它是否包含值。相反，包含或不包含在 Optional 中的值可以通过各种方法安全地映射、消费和过滤。\n\
    \n在最简单的情况下，可能的 `Optional` 可以通过调用带有默认值的 `orElse` 方法来访问。\n\n提到，使用 Optional 的最佳位置是方法的返回类型。它们通常不应该作为字段持有（使用空对象模式）或传递给公共方法（提供不需要参数的重载版本）。\n\
    \n第一次遇到 Optional 的 Java 程序员提出的反对之一是 Optional 本身可能是 null。虽然确实如此，但方法返回 null Optional\
    \ 是一种反行为，应该被视为编码错误。\n\n静态分析规则可以检查返回 null Optional 的。\n\n### 契约设计\n我们希望控制的所有代码都能忽略\
    \ null 的存在（除非它与迫使我们考虑它的第三方代码交互）。\n\n`Objects.requireNonNull` 可用于添加运行时断言，确保传递给方法的不是\
    \ null。\n\n由于核心代码通常假设不会传递 null，因此通过测试记录这种行为的价值有限；断言具有价值，因为它们确保错误发生在发生错误的地方附近。\n\
    \n我们还可以在构建时检查这种契约。\n\nJSR-305 提供了注解，可以声明哪里是可以接受 null 的。尽管 JSR-305 处于休眠状态，且没有在近期整合到\
    \ Java 的迹象，但这些注解可以通过 maven 坐标可用：\n\n```xml\n<dependency>\n    <groupId>com.google.code.findbugs</groupId>\n\
    \    <artifactId>jsr305</artifactId>\n    <version>3.0.1</version>\n</dependency>\n\
    ```\n\n它们被多个静态分析工具支持，包括 :-\n\n"
- fmt: "\n*   [Findbugs](http://findbugs.sourceforge.net/)\n*   [Error Prone](http://errorprone.info/)\n\
    \nThese can be configured to break the build when `null` is passed as a parameter\
    \ where we do not expect it.\n\nAnnotating every class, method or parameter with\
    \ `@Nonnull` would quickly become tedious and it would be debatable whether the\
    \ gain would be worth the amount of noise this would generate.\n\nFortunately,\
    \ it is possible to make `@Nonnull` the default by annotating a package in its\
    \ `package-info.java` file as follows\n\n```java\n@javax.annotation.ParametersAreNonnullByDefault\n\
    package com.example.somepackage ;\n```\n\nSadly, sub-packages do not inherit their\
    \ parent's annotations, so a `package-info.java` file must be created for each\
    \ package.\n\nOnce non null parameters have been made the default behavior, any\
    \ parameters that do accept null can be annotated with `@Nullable`.\n\n# Use Final\
    \ Liberally\n\n## Use Final Liberally\n\n### Summary\nConsider making final any\
    \ variable or parameter that does not change.\n\n### Details\nMaking parameters\
    \ and variables that are assigned once final makes a method easier to understand\
    \ because it constrains the things that could possibly happen within the code.\n\
    \nIt would be reasonable to make all parameters and assign-once variables final,\
    \ but this needs to be weighed against the noise created by inserting the `final`\
    \ keyword everywhere.\n\nFor short methods, whether the benefit outweighs the\
    \ cost is arguable, but if a method is large and unwieldy then the case for making\
    \ things final is much stronger.\n\nEach team should agree a policy for making\
    \ final variables.\n\nAt a minimum, everything should be made final within large\
    \ methods. This may also be extended to shorter methods at the team's discretion.\
    \ A blanket policy has the advantage of being easy to automate/understand. A more\
    \ nuanced policy is harder to communicate.\n\nWhen working with legacy code, making\
    \ parameters and variables final is also a useful first step in gaining understanding\
    \ of the method before re-factoring. Methods that have proved difficult to express\
    \ in smaller chunks will also become easier to understand when single assignment\
    \ variables are final.\n\n# Provide No More Than One Worker Constructor\n\n##\
    \ Provide no More Than One Worker Constructor\n\n### Summary\nAlthough a class\
    \ may provide many constructors, only one should write to fields and initialize\
    \ the class.\n\n### Details\nHaving a single place where fields are assigned during\
    \ construction makes it easy to understand the states that class can be constructed\
    \ in.\n\nClasses should not provide multiple constructors that set fields.\n\n\
    **Bad**\n```java\npublic class Foo {\n  private final String a;\n  private final\
    \ Integer b;\n  private final Float c;\n\n  public Foo(String value) {\n    this.a\
    \ = Objects.requireNonNull(value);\n    this.b = 42;\n    this.c = 1.0f;\n  }\n\
    \n  public Foo(Integer value) {\n    this.a = \"\";\n    this.b = Objects.requireNonNull(value);\n\
    \    this.c = 1.0f;\n  }\n\n  public Foo(Float value) {\n    this.a = \"\";\n\
    \    this.b = 42;\n    this.c = Objects.requireNonNull(value);\n  }\n}\n```\n\n\
    The duplication of values in the above code could be removed but it would remain\
    \ confusing because the concern of initializing the class is spread across three\
    \ locations.\n\nIf more fields were added it would be easy to forget to initialize\
    \ them in the existing constructors.\n\nFortunately, we have made all fields final\
    \ so this would give a compilation error. If the class was mutable, we would have\
    \ a bug to discover at runtime.\n\n**Better**\n```java\npublic class Foo {\n \
    \ private final String a;\n  private final Integer b;\n  private final Float c;\n\
    \n  private Foo(String a, Integer b, Float c) {\n    this.a = Objects.requireNonNull(a);\n\
    \    this.b = Objects.requireNonNull(b);\n    this.c = Objects.requireNonNull(c);\n\
    \  }\n\n  public Foo(String value) {\n    this(value, 42, 1.0f);\n  }\n\n  public\
    \ Foo(Integer value) {\n    this(\"\", value, 1.0f);\n  }\n\n  public Foo(Float\
    \ value) {\n    this(\"\", 42, value);\n  }\n}\n```\n\nFields are now only written\
    \ in one location, resulting in less duplication.\n\nWe can also see at a glance\
    \ that `Foo` cannot be constructed with null values. In the previous version,\
    \ this could only be determined by scanning three different locations.\n\nFollowing\
    \ this pattern, it is difficult to forget to set a field even if it is non-final.\n\
    \n# Avoid Checked Exceptions\n\n## Avoid Checked Exceptions\n\n### Summary\nDo\
    \ not declare checked exceptions unless there is a clear course of action that\
    \ should be taken when one is thrown.\n\n### Details\nExceptions are for exceptional\
    \ circumstances - design your code such that they are not thrown in scenarios\
    \ that are expected to happen.\n\nThis means that they should not be used for\
    \ normal control flow.\n\nChecked exceptions bloat and complicate code. You should\
    \ avoid adding them to your API, except when there is a clear action that the\
    \ caller can always take to recover from the error scenario.\n\nThis is surprisingly\
    \ rare.\n\nIf you are working with a library that uses checked exceptions, you\
    \ can wrap them by re-throwing a runtime exception.\n\nWhen you do, be sure to\
    \ maintain the stack trace.\n\n```java\ntry {\n  myObject.methodThrowingException();\n\
    } catch (SomeCheckedException e) {\n  throw new RuntimeException(e);\n}\n```\n\
    \nIf you have caught an `Exception` or a `Throwable`, so are unsure of the exact\
    \ type, you can avoid creating unnecessary wrappers using Guava's `Throwables.propagate`.\n\
    \n```java\ntry {\n  myObject.methodThrowingException();\n} catch (Exception e)\
    \ {\n  throw Throwables.propagate(e);\n}\n```\n\nThis will wrap checked exceptions\
    \ and re-throw unchecked exception as.\n\n# Specifics\n\n## Specifics\nThis section\
    \ provides some specific advice on various Java features and gotchas.\n\nA lot\
    \ of what is covered in this section can be automated by tools such as FindBugs,\
    \ PMD, Checkstyle and Sonar.\n\n# Know How To Implement Hashcode And Equals\n\n\
    ## Know How to Implement Hashcode and Equals\n\n### Summary\nImplementing `hashCode`\
    \ and `equals` is not straightforward. Do not implement them unless it is necessary\
    \ to do so. If you do implement them, make sure you know what you are doing.\n\
    \n### Details\nIt is well known that if you override equals then you must also\
    \ override the `hashCode` method (see Effective item 9).\n\nIf logically-equal\
    \ objects do not have the same `hashCode` they will behave in a surprising manner\
    \ if placed in a hash based collection such as `HashMap`.\n\nBy \"surprising\"\
    , we mean your program will behave incorrectly in a fashion that is very difficult\
    \ to debug.\n\nUnfortunately, implementing `equals` is surprisingly hard to do\
    \ correctly. Effective Java item 8 spends about 12 pages discussing the topic.\n\
    \nThe contract for equals is handily stated in the Javadoc of `java.lang.Object`.\
    \ We will not repeat it here or repeat the discussion of what it means, that can\
    \ be found in Effective Java and large swathes of the internet. Instead we will\
    \ look at strategies for implementing it.\n\nWhichever strategy you adopt, it\
    \ is important that you first write tests for your implementation.\n\nIt is easy\
    \ for an equals method to cause hard-to-diagnose bugs if the code changes (e.g.\
    \ if fields are added or their type changes). Writing tests for equals methods\
    \ used to be a painful and time-consuming procedure, but libraries now exist that\
    \ make it trivial to specify the common cases (see Testing FAQs).\n\n### Don't\n\
    This is the simplest strategy and the one you should adopt by default in the interests\
    \ of keeping your codebase small.\n\nMost classes do not need an equals method.\
    \ Unless your class represents some sort of value it makes little sense to compare\
    \ it with another so stick with the inherited implementation from Object.\n\n\
    An irritating gray area are classes where the production code never has a requirement\
    \ to compare equality but the test code does. The dilemma here is whether to implement\
    \ the methods purely for the benefit of the tests or to complicate the test code\
    \ with custom equality checks.\n"
