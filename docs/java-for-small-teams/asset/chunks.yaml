    \ values.\n\nStrategies to avoid null include :\n\n*   The null object pattern\
    \ - when you have something you think is optional\n\n*   The type-safe null pattern\
    \ (aka Option, Optional & Maybe) - when you need to express that an interface\
    \ might not return something\n\n*   Design by contract\n\n### The Null Object\
    \ Pattern\n\nThe null object pattern is the classic OO approach to avoiding null.\
    \ You should use it whenever you think you have a dependency that you think is\
    \ optional.\n\nThe pattern is very simple, just provide an implementation of the\
    \ interface that does \"nothing\" or has a neutral behavior. This can then be\
    \ safely referenced by its clients, with no need to check for null.\n\n### Type-Safe\
    \ Nulls (aka Optional)\n\nThe type-safe null pattern is familiar in most functional\
    \ programming languages where it is variously known as Maybe, Option or Optional.\
    \ Java 8 finally adds an Optional type, but implementations are available for\
    \ earlier versions via Guava and other libraries.\n\nIt is a simple pattern. An\
    \ Optional is basically just a box that can hold either one or zero values. You\
    \ can check if the box is empty (using `isPresent`) and retrieve its value via\
    \ a get method.\n\nOptional should be used whenever a public method might not\
    \ return a value as part of normal program flow.\n\nIf you call get on an empty\
    \ Optional, it will throw a `NoSuchElementException`.\n\nIt might not be immediately\
    \ obvious what value Optional provides over just using null. If you need to check\
    \ that an Optional has something in it before calling `get`, how is this different\
    \ from checking a value is not null to avoid a `NullPointerException`?\n\nThere\
    \ are several important differences.\n\nFirstly, if your method declares that\
    \ it returns `Optional<Person>` then you can instantly see from the type signature\
    \ that it might not return a value. If it only returned `Person` you would only\
    \ know that it might return null if you looked at the source, tests or documentation.\n\
    \nEqually important, if you know that you always return `Optional` within your\
    \ codebase when something might not be present, then you know at a glance that\
    \ a method returning `Person` will always return a value and will never return\
    \ null.\n\nFinally, the preferred way to use Optionals is not to call the get\
    \ method or to explicitly check if it contains a value. Instead the values that\
    \ are contained (or not contained) in an Optional can be safely mapped, consumed\
    \ and filtered by various method on the class.\n\nIn the simplest case a possibly\
    \ empty Optional can be accessed by calling the `orElse` method which takes a\
    \ default value to use if the Optional is empty.\n\nAs mentioned, the sweet spot\
    \ for using Optionals is for the return types for methods. They should not generally\
    \ be held as fields (use the null object pattern here instead) or passed to public\
    \ methods (instead provide overloaded versions that do not require the parameter).\n\
    \nOne objection that is sometimes raised by Java programmers encountering Optional\
    \ for the first time is that it is possible for an Optional to be null itself.\
    \ While this is true, returning a null Optional from a method is a perverse thing\
    \ to do and should be considered a coding error.\n\nStatic analysis rules exists\
    \ that can check for code that returns null Optionals.\n\n### Design by Contract\n\
    \nWe wish for all code that we control to be able to ignore the existence of null\
    \ (unless it interfaces with some third party code that forces us to consider\
    \ it).\n\n`Objects.requireNonNull` can be used to add a runtime assertion that\
    \ null has not been passed to a method.\n\nBecause your core code should generally\
    \ assume that null will never be passed around, there is little value in documenting\
    \ this behavior with tests; assertions add value because they ensure that an error\
    \ occurs close to the point where the mistake was made.\n\nWe can also check this\
    \ contract at build time.\n\nJSR-305 provides annotations that can be used to\
    \ declare where null is acceptable.\n\nAlthough JSR-305 is dormant, and shows\
    \ no signs of being incorporated into Java in the near future, the annotations\
    \ are available at the maven co-ordinates :-\n\n```\n<dependency>\n    <groupId>com.google.code.findbugs</groupId>\n\
    \    <artifactId>jsr305</artifactId>\n    <version>3.0.1</version>\n</dependency>\n\
    ```\n\nThey are supported by several static analysis tools including :-"
