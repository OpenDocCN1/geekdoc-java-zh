  trans: "\n当然，这里没有标准答案；我们建议在回退到提供自定义 `equals` 方法之前，首先尝试 `compare-it-in-the` 测试方法。\n\
    \n通过使用如 `AssertJ` 或 `Hamcrest` 等库实现自定义断言，可以干净地共享自定义的相等性检查。\n\n`Effective Java`\
    \ 初步建议，如果 `equals` 被意外调用，那么你的类应该抛出一个异常：\n\n```java\n@Override public boolean equals(Object\
    \ o) {\n  throw new AssertionError(); // 方法永远不会被调用\n}\n```\n\n这似乎是一个好主意，但遗憾的是，它会混淆大多数静态分析工具。权衡之下，它产生的问题可能比解决的问题更多。\n\
    \n## 使用 IDE 自动生成\n\n大多数 IDE 都提供某种自动生成 `hashCode` 和 `equals` 方法的方法。这是一个很容易实现的方法，但生成的方法（取决于\
    \ IDE 及其设置）通常很丑陋且复杂，如下所示由 `Eclipse` 生成的方法：\n\n```java\n @Override\n  public int\
    \ hashCode() {\n    final int prime = 31;\n    int result = 1;\n    result = prime\
    \ * result + ((field1 == null) ? 0 : field1.hashCode());\n    result = prime *\
    \ result + ((field2 == null) ? 0 : field2.hashCode());\n    return result;\n \
    \ }\n```\n\n```java\n @Override\n  public boolean equals(Object obj) {\n    if\
    \ (this == obj)\n      return true;\n    if (obj == null)\n      return false;\n\
    \    if (getClass() != obj.getClass())\n      return false;\n   MyClass  other\
    \ = (MyClass) obj;\n    if (field1 == null) {\n      if (other.field1 != null)\n\
    \        return false;\n    } else if (!field1.equals(other.field1))\n      return\
    \ false;\n    if (field2 == null) {\n      if (other.field2 != null)\n       \
    \ return false;\n    } else if (!field2.equals(other.field2))\n      return false;\n\
    \    return true;\n  }\n```\n\n除非你的 IDE 可以配置为生成整洁的方法（下文所述），否则我们通常不建议这种方法。随着时间的推移，手动编辑这些代码很容易引入\
    \ bug。\n\n## 手写整洁的方法\n\nJava 7 引入了 `java.util.Objects` 类，使得实现 `hashCode` 变得非常简单。Guava\
    \ 提供了类似的 `com.google.common.base.Objects` 类，可以与早版本的 Java 使用。\n\n```java\n @Override\n\
    \  public int hashCode() {\n    return Objects.hash(field1, field2);\n  }\n```\n\
    \n`Objects` 类也稍微简化了 `equals` 的实现，将大部分空检查推到了 `Objects.equals` 方法中。\n\n```java\n\
    \ @Override\n  public boolean equals(Object obj) {\n    if (this == obj) // <-\
    \ 性能优化\n      return true;\n    if (obj == null)\n      return false;\n    if\
    \ (getClass() != obj.getClass()) // <- 参见关于继承的注释\n      return false;\n    MyClass\
    \ other = (MyClass) obj;\n    return Objects.equals(field1, other.field1) &&\n\
    \        Objects.equals(field2, other.field2);\n  }\n```\n\n第一个 `if` 语句逻辑上并不是必须的，可以安全地省略；然而，它可能会提供性能优势。\n\
    \n通常，我们建议除非证明这些微优化确实能带来益处，否则不要包含它们。在 `equals` 方法的情况下，我们建议保留该优化。它很可能在你的某些类中自证明了其合理性，而且让所有方法遵循相同的模板是有价值的。\n\
    \n上面的示例使用 `getClass` 来检查对象是否为相同类型。另一种方法是使用 `instanceof`，如下：\n\n```java\n @Override\n\
    \  public boolean equals(Object obj) {\n    if (this == obj)\n      return true;\n\
    \    if (obj == null)\n      return false;\n    if (!(obj instanceof MyClass))\
    \ // <- 与 instanceof \n      return false;\n    MyClass other = (MyClass) obj;\n\
    \    return Objects.equals(field1, other.field1) &&\n        Objects.equals(field2,\
    \ other.field2);\n  }\n```\n\n这会导致行为上的差异——将 `MyClass` 的实例与其子类比较时，使用 `instanceof`\
    \ 会返回 `true`，而使用 `getClass` 则会返回 `false`。\n\n在 `Effective Java` 中，Josh Bloch 主张使用\
    \ `instanceof`，因为 `getClass` 的实现违反了对里氏夫替换原则的严格解释。\n\n然而，如果使用了 `instanceof`，一旦子类重写了\
    \ `equals`，很容易违反 `equals` 合约的对称性。例如：\n\n```java\nMyClass a = new MyClass();\n\
    ExtendsMyClassWithCustomEqual b = new ExtendsMyClassWithCustomEqual();\n\na.equals(b)\
    \ // true\nb.equals(a) // false, 违反了对称性\n```\n\n如果你发现自己处于需要考虑子类是否与其父类相等的细微差别时，我们强烈建议你重新考虑你的设计。\n\
    \n在类层次结构中考虑维护 `equals` 合约是痛苦的，你不应该让自己或团队在普通的服务器端编码任务中经历这些。\n\n在大多数情况下，如果你认为你的类实现\
    \ `hashCode` 和 `equals` 是合理的，我们强烈建议将类标记为 `final`，这样就不需要考虑层次结构了。\n\n如果你认为在某些情况下将子类视为等同于父类是合理的，请使用\
    \ `instanceof` 但要确保 `equals` 方法设为 `final`。\n\n### Commons EqualsBuilder 和 HashCodeBuilder\n\
    \nApache commons 的 `hashcode` 和 `equals` 曾经是生成这些方法的流行方式。我们不建议在新代码中使用它们，因为它们实现的大部分功能现在已由\
    \ `java.util.Objects` 或 Guava 的对应类提供。\n\n这些类确实提供了单行反射实现的选项：\n\n```java\npublic\
    \ boolean equals(Object obj) {\n  return EqualsBuilder.reflectionEquals(this,\
    \ obj);\n}\n```\n\n```java\npublic int hashCode() {\n  return HashCodeBuilder.reflectionHashCode(this);\n\
    }\n```\n\n这些实现的简洁性很有吸引力，但它们的性能明显逊于其他方法。良好的性能测试和定期的性能分析（Profiling）可以帮助判断性能差的方法会导致瓶颈。如果你有信心可以检测到这种影响，那么将这些方法作为占位实现可能是一个合理的方法。但通常情况下我们建议避免使用它们。\n\
    \n## 代码生成器\n\n许多项目可以在构建时自动生成值对象。其中两个较著名的：\n\n*   [Google auto](https://github.com/google/auto/tree/master/value)\n\
    *   [Project Lombok](https://projectlombok.org/)\n\n但还有许多其他可用工具。\n\n#### Google\
    \ Auto\n\nGoogle *Auto* 会为带有 `@AutoValue` 注解的抽象类创建一个*显而易见*的子类实现。该实现将包含功能的 `hashcode`\
    \ 和 `equals` 方法。\n\n```java\nimport com.google.auto.value.AutoValue;\n\n@AutoValue\n\
    abstract class Animal {\n  static Animal create(String name, int numberOfLegs)\
    \ {\n    return new AutoValue_Animal(name, numberOfLegs);\n  }\n\n  Animal() {}\n\
    \n  abstract String name();\n  abstract int numberOfLegs();\n}\n```\n\n这显然比手动编写完整的\
    \ `Animal` 类要容易得多，但也存在缺点。问题在“仔细考虑代码生成器”中有所讨论，它们被分为“摩擦”和“意外”。在这里，Google Auto 引入了一些“摩擦”，因为在生成器运行产生\
    \ `AutoValue_Animal` 类之前，上述代码在 IDE 中是无法编译的。存在一些“意外”。由于它是值对象，Animal 通常应该实现为 `final`\
    \ 类——但我们被迫将其变为抽象类。*Auto* 团队建议你添加一个包私有构造函数，以防止创建其他子类。\n"
- fmt: "\nUnlike normal Java, the order in which accessors are declared is important\
    \ because it is used by the generator to define the order of the constructor parameters.\
    \ Re-ordering the accessors can, therefore, have the surprising effect of introducing\
    \ a bug.\n\n## Lombok\n\nLombok can also (amongst other things) generate full\
    \ implementations of value objects. It takes a different approach to Google auto.\n\
    \nGiven an annotated class such as:\n\n```\n@Value\npublic class ValueExample\
    \ {\n  String name;\n  @NonFinal int age;\n  double score;\n}\n```\n\nIt will\
    \ alter the class at build-time to produce an implementation along the lines of:\n\
    \n```\npublic final class ValueExample {\n  private final String name;\n  private\
    \ int age;\n  private final double score;\n\n  public ValueExample(String name,\
    \ int age, double score) {\n    this.name = name;\n    this.age = age;\n    this.score\
    \ = score;\n   }\n\n  public String getName() {\n    return this.name;\n  }\n\n\
    \  public int getAge() {\n    return this.age;\n  }\n\n  public double getScore()\
    \ {\n    return this.score;\n  }\n\n  public boolean equals(Object o) {\n   //\
    \ valid implementation of equality based on all fields\n  }\n\n  public int hashCode()\
    \ {\n   // valid hashcode implementation based on all fields\n  }\n```\n\nWhile\
    \ Google `Value` asks the programmer to provide a valid public API for a class,\
    \ `Lombok` creates the public API based on a description of its internal state.\
    \ The description is valid Java syntax but has a different meaning when interpreted\
    \ by `Lombok`.\n\n`Lombok` causes some friction. It is not practical to use `Lombok`\
    \ without an IDE that understands it - code using the autogenerated api will appear\
    \ to be invalid. An IDE plugin must be installed.\n\nWhile it (arguably) introduces\
    \ less friction than auto once the IDE plugin is installed, the behavior of `Lombok`\
    \ is much more surprising. It is easy to explain what `Auto` does - it generates\
    \ a class at build-time that implements an interface you define. It is much harder\
    \ to predict or explain what `Lombok` will do.\n\nAlthough `Lombok` requires the\
    \ programmer to write less code than solutions such as `Auto`, it deviates further\
    \ from normal Java.\n\nIf you consider using a code generator for Value classes,\
    \ we would recommend you consider approaches such as `Auto` before `Lombok`.\n\
    \nTo its credit `Lombok` does provide an escape route (see \"Prefer reversible\
    \ decisions\") in the form of delombok which allows you to output the generated\
    \ classes. These can then be used to replace the annotated originals.\n\nRemoving\
    \ `Auto` is similarly straightforward - the generated classes can be checked into\
    \ the source tree. The artificial abstract class/implementation split can then\
    \ be removed via simple refactorings.\n\n# Do Not Reassign Parameters\n\n## Summary\n\
    Parameters to methods should never be re-assigned.\n\n## Detail\nReassigning to\
    \ parameters makes code harder to understand and provides no meaningful advantage\
    \ over creating a new variable.\n\nIf the method is large, it can be difficult\
    \ to track the lifecycle of a parameter. Even within short methods, re-using parameters\
    \ will cause problem. As the `variable` is being used to represent two separate\
    \ concepts, it is often not possible to name it meaningfully.\n\nIf another variable\
    \ of the same type as a parameter is needed, it should be declared locally.\n\n\
    **Bad**\n\n```\npublic String foo(String currentStatus) {\n  if ( someLogic()\
    \ ) {\n    currentStatus  = \"FOO\";\n  }\n  return currentStatus;\n}\n```\n\n\
    **Better**\n\n```\npublic String foo(final String currentStatus) {\n  String desiredStatus\
    \ = currentStatus;\n  if ( someLogic() ) {\n    desiredStatus = \"FOO\";\n  }\n\
    \n  return desiredStatus ;\n}\n```\n\nParameters may be declared final so that\
    \ the reader can tell at a glance that its value will not change.\n\n# Limit Scope\n\
    \n## Limit Variables to the Smallest Possible Scope\n\n### Summary\nVariables\
    \ should be declared as late as possible so that they have the narrowest possible\
    \ scope.\n\n### Details\n\n**Bad**\n\n```\npublic void foo(String value) {\n \
    \   String calculatedValue;\n    if (someCondition()) {\n        calculatedValue\
    \ = calculateStr(value);\n        doSomethingWithValue(calculatedValue);\n   \
    \ }\n}\n```\n\n**Better**\n\n```\npublic void foo(String value) {\n    if (someCondition())\
    \ {\n        String calculatedValue = calculateStr(value);\n        doSomethingWithValue(calculatedValue);\n\
    \    }\n}\n```\n\n**Better still**\n\n```\npublic void foo(String value) {\n \
    \   if (someCondition()) {\n        doSomethingWithValue(calculateStr(value));\n\
    \    }\n}\n```\n\nSometimes, assigning to well-named, temporary variables will\
    \ result in more readable code than calling a method inline because it helps the\
    \ reader follow the data and logical flow.\n\nAs a rule of thumb, if you are unable\
    \ to come up with a name for a variable that does little more than mirror a method\
    \ from which its value was retrieved, then the variable should be eliminated.\n\
    \n# Prefer For Each Loops To For Loops\n\n## Summary\nUse `for each` loops in\
    \ preference to indexed for loops.\n\n## Details\nThe `for each` loop introduced\
    \ with Java 5 avoids the potential out-by-one errors of indexed for loops and\
    \ is more concise than code using iterators.\n\n**Bad**\n\n```\n public List<String>\
    \ selectValues(List<Integer> someIntegers) {\n    List<String> filteredStrings\
    \ = new ArrayList<String>();\n    for (int i = 0; i != someIntegers.size(); i++)\
    \ {\n      Integer value = someIntegers.get(i);\n      if (value > 20) {\n   \
    \     filteredStrings.add(value.toString());\n      }\n    }\n    return filteredStrings;\n\
    \  }\n```\n\n**A little better**\n\n```\n public List<String> selectValues(List<Integer>\
    \ someIntegers) {\n    List<String> filteredStrings = new ArrayList<String>();\n\
    \    for (Integer value : someIntegers) {\n      if (value > 20) {\n        filteredStrings.add(value.toString());\n\
    \      }\n    }\n    return filteredStrings;\n  }\n```\n\n# Prefer Maps And Filters\
    \ To Imperative\n\n## Summary\nImperative loops hide application logic inside\
    \ boilerplate code - prefer maps and filters as these separate the logic from\
    \ the implementation.\n\n## Details\nMost loop based code can be re-written in\
    \ a more declarative style using filters and maps. Java 8 made this easy by introducing\
    \ lambdas and the streams API, but the same style can be applied in Java 7 using\
    \ third party libraries such as Guava.\n\nFilters and maps highlight what the\
    \ code is intended to achieve. This is less clear in the imperative implementation.\n\
    \n**Bad**\n\n```\n public List<String> selectValues(List<Integer> someIntegers)\
    \ {\n    List<String> filteredStrings = new ArrayList<String>();\n    for (Integer\
    \ value : someIntegers) {\n      if (value > 20) {\n        filteredStrings.add(value.toString());\n\
    \      }\n    }\n    return filteredStrings;\n  }\n```\n\n**Better (Java 8)**\n\
    \n```\n public List<String> selectValues(List<Integer> someIntegers) {\n    return\
    \ someIntegers.stream()\n        .filter(i -> i > 20)\n        .map(i -> i.toString())\n\
    \        .collect(Collectors.toList());\n  }\n```\n\n**Better (Java 7 using Guava)**\n\
    \n```\n public List<String> selectValues(List<Integer> someIntegers) {\n    return\
    \ FluentIterable\n    .from(someIntegers)\n    .filter(greaterThan(20))\n    .transform(Functions.toStringFunction())\n\
    \    .toList();\n  }\n\n  private static Predicate<Integer> greaterThan(final\
    \ int limit) {\n    return new Predicate<Integer>() {\n      @Override\n     \
    \ public boolean apply(Integer input) {\n        return input > limit;\n     \
    \ }\n    };\n  }\n```\n\nNote that, although the Java 7 version requires more\
    \ lines of code (in the form of the ugly boilerplate for the anonymous inner class),\
    \ the logic of the `selectValues` method is clearer. If the logic required in\
    \ the `Predicate` or mapping Function is required in multiple places then it is\
    \ straightforward to move this to a common location. This is harder to achieve\
    \ with the imperative version.\n"
