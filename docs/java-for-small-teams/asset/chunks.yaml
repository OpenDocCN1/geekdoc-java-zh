    \ exit points.\n\nSo it must be a good idea to add this constraint to Java right?\n\
    \nLets look what happens when we are told we must only have one exit point:\n\n\
    **Single exit with statements**\n\n```\npublic class Example {\n  private int\
    \ value;\n\n  public int single(int x) {\n    int retVal = 0;\n\n    if (x ==\
    \ 10) {\n      retVal = -value;\n    } else if (x > 0) {\n      retVal = value\
    \ + x;\n    }\n\n    return retVal;\n  }\n\n}\n```\n\nIf we remove the single\
    \ exit point constraint we get:\n\n**Multiple exit**\n\n```\npublic class Example\
    \ {\n  private int value;\n\n  public int multi(int x) {\n    if (x == 10) {\n\
    \      return -value;\n    }\n\n    if (x > 0) {\n      return value + x;\n  \
    \  }\n\n    return 0;\n  }\n}\n```\n\nWhich version is better?\n\nThere isn't\
    \ much in it, but the multiple exit point version is easier to comprehend.\n\n\
    Trying to apply the single exit point constraint resulted in an additional local\
    \ variable to hold return state. In the multi exit version we can clearly see\
    \ what is returned when none of the conditions match. In the single exit version\
    \ it is slightly less clear as the returned value is declared at the start of\
    \ the method then overwritten.\n\nSo does this mean that single exit point methods\
    \ are bad?\n\nNo.\n\nIt is possible to write alternate single exit implementations.\n\
    \n```\n public int oneAssignment(int x) {\n    final int retVal;\n\n    if (x\
    \ == 10) {\n      retVal = -value;\n    } else if (x > 0) {\n      retVal = value\
    \ + x;\n    } else {\n      retVal = 0;\n    }\n\n    return retVal;\n  }\n```\n\
    \nWe've addressed the issues we identified earlier. We only assign to `retVal`\
    \ once and it is clear what is assigned when none of the conditions match.\n\n\
    Is this superior in some way to the multi exit version?\n\nNot really.\n\nWe can\
    \ also write a single exit method using the `?` operator:\n\n**Single exit with\
    \ the ? operator**\n\n```\n public int expression(int x) {\n    return  x == \
    \ 10 ? -value\n        : x > 0  ? value + x\n        : 0;\n  }\n```\n\nWe have\
    \ switched from using a statement (if) to working with expressions (i.e. things\
    \ that return a value). This allows us to get rid of the additional variable while\
    \ maintaining a single exit point.\n\nIs this version clearer than the multi-exit\
    \ version? That is debatable and ultimately a matter of personal taste.\n\nThe\
    \ code using `?` is terse and some will find it harder to understand.\n\nThe multi-exit\
    \ version is more verbose but its proponents would argue it is easier to comprehend.\n\
    \nIf your personal preference is for the `?` operator version, it still does not\
    \ follow that the single exit point rule is something you should try to universally\
    \ apply.\n\nThe most likely result is that you will push people towards writing\
    \ code like the earlier bloated version of our method. As Java is a largely statement-based\
    \ language, you will also encounter logic where the multi-exit version is undeniably\
    \ clearer.\n\nMartin Fowler and Kent Beck express things nicely in \"Refactoring:\
    \ Improving the Design of Existing Code\"\n\n> \". . . one exit point is really\
    \ not a useful rule. Clarity is the key principle: If the method is clearer with\
    \ one exit point, use one exit point; otherwise don't\"\n\nThere is nothing wrong\
    \ with single exit functions, but only write them when it makes sense to do so.\n\
    \n# Always Use A StringBuffer\n\n# Bad Advice - Always Use a StringBuffer to Concatenate\n\
    \nThis advice is doubly wrong.\n\nFirstly it advocates using the synchronized\
    \ `StringBuffer` rather than a `StringBuilder`.\n\nSecondly it is an oversimplification\
    \ or misunderstanding of the more nuanced and reasonable advice to not concatenate\
    \ Strings in a loop."
