  trans: "\n\n根据定义，基于状态的测试永远不会 mock（严格意义上的 mock），但它们可以使用存根（stubs）来提供间接值。\n\n人们可能会尝试使用\
    \ mock 框架来存桩值，而不是使用它们的构造函数和修改方法。对于复杂对象，使用存根似乎比构建真实的对象更简单。\n\n**不要这样做。**\n\nmock\
    \ 框架应该仅用于将我们的测试与具有行为的对象隔离开。如果你有难以构造的值，请考虑使用测试数据构建模式（test data builder pattern）。\n\
    \n## 在状态测试和交互测试之间进行选择\n\n有时候，你无法选择使用哪种。例如，仅凭输入和输出无法有意义地指定缓存应该如何运行。其他情况下，我们必须权衡利弊。\n\
    \n针对管理类代码（manager code）的状态测试可能更难以阅读和理解，因为它必须依赖于被测试对象（SUT）所交互的对象的行为。测试也将与这些行为耦合，并且当这些行为变化时，测试也需要进行更改——正如在“考虑单元而非方法”中讨论的那样，你实际上增加了你所测试的“单元”的大小。\n\
    \n基于交互的测试要求我们越过单元的外部接口，深入其内部实现。这带来了我们可能会过度规范并创建一个特定于实现的测试的风险。\n\n权衡之下，最好倾向于基于状态的测试，并尽可能在你的代码设计中实现它。然而，在许多情况下，你可能会认为基于交互的测试是优的。\n\
    \n# 理解你的代码复用选项\n\n复用代码是一件好事。\n\n当人们第一次用面向对象（OO）语言编程时，他们倾向于为了此目的过度使用继承，直到发现组合（composition）通常是一个更好的主意。\n\
    \n遗憾的是，在 `JUnit` 测试中使用组合来复用代码并不容易，这可能导致你编写出难以维护的测试类层次结构。\n\n在没有其他选择的情况下，少量的重复可能比引入类层次结构要好，但某些类型的测试可以在不继承的情况下进行复用。\n\
    \n### 断言 (Assertions)\n\n与断言相关的代码在类层次结构之外很容易复用。这可以很容易实现：创建包含 `static assert` 方法的类，这些方法可以静态导入（就像现在内置的\
    \ `JUnit` 断言那样），或者更优雅地为 `hamcrest` 或 `AssertJ` 创建自定义匹配器（matchers）。\n\n### 对象创建\n\
    \n对于小型简单的对象，可以使用“母亲模式”（mother pattern），但如果对象随着时间的推移变得复杂，这可能会迅速变成一个维护问题。\n\n更好的模式是\
    \ `Builder` 模式，它的额外优势是允许测试清晰地突出重要和不重要的输入。\n\n### 重复的行为\n\n如果你正在使用 `JUnit`，那么测试内部重复的代码段可以被封装并复用[自定义规则](https://github.com/junit-team/junit/wiki/Rules)。\n\
    \n# 编写可重复的测试\n\n单元测试必须是可重复且确定性的——它们必须能够以任何顺序运行数千次并获得相同的结果。这意味着它们对任何外部因素都不能依赖。\n\
    \n在实践中，这意味着单元测试不能：\n\n* 从数据库读取或写入\n* 执行网络 IO\n* 写入磁盘\n* 修改静态状态\n\n如果你的测试执行了上述任何操作，那么它就不是一个\
    \ `unit` 单元测试。这并不是说你的测试没有价值。\n\n# 只对单元测试有意义的代码进行单元测试\n\n在大多数情况下，单元测试以下内容的价值很：\n\
    \n* 生成的代码\n* 日志记录\n* `唯一`关注点是与其他系统集成的代码\n\n具有纯集成关注点的代码典型示例是 `DAO`。\n\n如果有一个兼容的内存假数据库，那么可以针对它进行有意义的单元测试。如果没有用的假数据库，那么编写\
    \ mock 出 `JDBC` 驱动的测试是没有价值的——第一级测试应该是针对真实数据库的集成测试。\n\n对于`显式地`指定非常简单的样板代码（如 `get/set`\
    \ 方法）的行为也几乎没有意义。在没有测试的情况下，预期行为是清晰的，它们的实际行为应该由在使用这些代码时测试更复杂逻辑的其他测试来验证。如果代码覆盖率表明这些方法没有被其他测试执行，也许你可以删除它们？\n\
    \n不进行单元测试的代码应该始终进行集成测试的。\n\n# 测试常见问题解答\n\n## 测试常见问题解答\n\n### 如何测试私有方法？\n\n你不是测试方法（私有或公共），你测试的是单元作为一个整体的行为。\n\
    \n如果你无法通过公共接口执行私有方法的逻辑，那么该逻辑真的是需要的吗？如果它是需要的，并且足够复杂以让你感到测试痛苦，那么也许你应该将该关注点提取到一个独立的单元中，该单元可以被隔离测试，并通过构造函数注入？\n\
    \n### 如何测试 void 方法？\n\n你不是测试方法（void 或否），你测试的是单元作为一个整体的行为。\n\n如果方法是 `void` 的，它必须在执行某种副作用，这种副作用可以通过状态测试或交互测试来检查。\n\
    \n例如，如果你正尝试“测试集合类的 `add` 方法”，你可能应该编写类似这样的测试：\n\n```java\n@Test\npublic void shouldIncreaseInSizeWhenItemsAdded()\
    \ {\n    Collection testee = new ArrayList();\n    assertEquals(0, testee.size());\n\
    \    testee.add(\"itemA\");\n    assertEquals(1, testee.size());\n    testee.add(\"\
    itemB\");\n    assertEquals(2, testee.size());\n}\n```\n\n### 如何测试处理当前日期/时间的代码？\n\
    \n一种糟糕的解决方案是使用静态方法（例如 joda time 的 `setCurrentMillisFixed`）来设置当前日期。\n\n良好的解决方案是将获取日期/时间的策略作为依赖注入你的类中。\n\
    \nJava 8 提供了 `java.time.Clock` 类可以用于此。\n\n静态工厂方法 `fixed` 会创建一个表示常量时间的实例。其他方法提供了适用于生产环境的实现。\n\
    \nJava 7 没有为此目的提供开箱即用的类，所以你需要自己实现。\n\n### 我需要为我的测试实现 teardown 方法吗？\n\n这曾是所有 `JUnit\
    \ 3` 测试的要求。如果你没有在 teardown 中置空测试类的所有成员，你的测试套件会随着增长开始消耗内存。\n\n这对于原生的 `JUnit 4`\
    \ 测试不是要求的，但如果你使用自定义运行器（runner），你可能需要这样做。\n\n 错误 (Errors) 和失败 (Failures) 的区别是什么？\n\
    \n你应该尝试设计测试在逻辑错误时产生 `failures`。你的测试应该只在发生意外情况时产生错误。\n\n### 我应该如何测试预期异常？\n\n这取决于具体情况。\n\
    \n内置的：\n\n```java\n@Test(expected = FooException.class)\npublic void shouldThrowFooExceptionWhenFeelsLikeIt\n\
    ```\n\n简洁且适用于简单场景，但有一个陷阱。如果测试方法执行了被测试对象的多个方法，预期将适用于整个测试方法，而不是与抛出异常的特定对象之间的交互。\n\
    \n如果异常中持有的数据很重要，这种方法也无法对其进行断言。\n\n传统的解决方案是使用 try catch 块：\n\n```java\n@Test\n\
    public void shouldThrowFooExceptionWhenFeelsLikeIt() {\n  try {\n    testee.doStuff();\n\
    \    fail(\"Expected an exception\");\n  } catch (FooException expectedException)\
    \ {\n    assertThat(expectedException.getMessage(), is(\"felt like it\"));\n \
    \ }\n}\n```\n\n"
- fmt: "\nThis is easy to follow, but a little verbose. It is also easy to forget\
    \ to include the call to `fail()` if you are not test driving your code.\n\n`JUnit`\
    \ now provides an alternate solution in the form of the `'ExpectedException'`\
    \ method rule. This allows for more fine grained exception checking:\n\n```\n\
    @Rule\npublic ExpectedException thrown= ExpectedException.none();\n\n@Test\npublic\
    \ void foo() throws IOException {\n  thrown.expect(FooException.class);\n  thrown.expectMessage(\"\
    felt like it\");\n\n  testee.doStuff();\n}\n```\n\nThis is more concise, but breaks\
    \ the usual given/when/then flow of a test by moving the then part to the start\
    \ of the method.\n\nFor Java 8 `AssertJ` provides some custom assertions that\
    \ can be used without breaking this flow.\n\n```java\n@Test\npublic void testException()\
    \ {\n  assertThatThrownBy(() -> { testee.doStuff(); })\n   .isInstanceOf(Exception.class)\n\
    \   .hasMessageContaining(\"felt like it\");\n}\n```\n\nAlthough it maintains\
    \ the flow, the lambda in which the `testee` is called looks a little ugly.\n\n\
    When it can be used we recommend sticking with the concise `expected =` format.\
    \ For more complex situations it is largely a matter of taste.\n\n### How Do I\
    \ Test an Abstract Class?\n\nAn abstract class is just a dependency that some\
    \ other code will use - a dependency that you have made harder than usual to isolate\
    \ due to your choice to make it an abstract class.\n\nSo first off, would your\
    \ design look better if the functionality was being re-used by composition rather\
    \ than inheritance?\n\nAssuming that you can't improve your design by getting\
    \ rid of the abstract class you can either:\n\n* Treat it as an implementation\
    \ detail and check that each of its clients behaves as expected.\n* Test it in\
    \ isolation by creating an anonymous concrete class\n\nThe first approach will\
    \ result in tests that are less tied to the implementation, but there will be\
    \ repetition between the tests for each subclass.\n\nThe second approach will\
    \ avoid repetition but is tied to the implementation and is likely to be brittle.\n\
    \n### How Do I test Hashcode and Equals?\n\nTesting hashcode and equals can be\
    \ fiddly and time consuming, which raises questions about whether it is time well\
    \ spent given that the code is likely to have been auto-generated.\n\n`Equals\
    \ verifier` project provides a good (partial) solution:\n\n[http://www.jqno.nl/equalsverifier/](http://www.jqno.nl/equalsverifier/)\n\
    \nIt checks that a class fulfills the hashcode-equals contract with a single line\
    \ test that is trivial to write:\n\n```\n @Test\n  public void shouldObeyHashCodeEqualsContract()\
    \ {\n    EqualsVerifier.forClass(MyValue.class).verify();\n  }\n```\n\nIt does,\
    \ however, do a very thorough job of checking the contract - including how it\
    \ interacts with inheritance. It is non-trivial to make a non-final class conform\
    \ to the contract.\n\nAlthough `equals verifier` does a good job of checking the\
    \ hashcode equals contract, it has no knowledge of how you expect the methods\
    \ to actually behave. If you wish equality to (for example) be defined by a single\
    \ ID field only, you must write additional tests that verify this behavior.\n\n\
    For the common scenario of a class that should be considered equal based on all\
    \ of its fields the behavior may be checked in a single test:\n\n```\n @Test\n\
    \  public void shouldObeyHashCodeEqualsContract() {\n    EqualsVerifier.forClass(MyValue.class).allFieldsShouldBeUsed().verify();\n\
    \  }\n```\n\nThis may become the default behavior in a future version of `EqualsVerifier`,\
    \ but must be specifically specified in `1.7.5`\n\n# Bad advice\n\n# Bad Advice\n\
    \nSome truly terrible ideas are commonly circulated as \"best practice\". In this\
    \ section we provide examples and explain why they should be ignored.\n\n# Single\
    \ Exit Point Rules\n\n## Bad Advice - Single Exit Point Rules\n\nSome coding standards\
    \ mandate that all methods should have a single exit point.\n\nDoing so can be\
    \ damaging, particularly when it is enforced by static analysis.\n\n## Details\n\
    \nSingle exit point is an idea with a long history dating back to the era of liberally\
    \ applied gotos and spaghetti code.\n\nIn that context, adding constraints on\
    \ what could happen within a function was helpful. Knowing that there is only\
    \ one point that a large function can exit from makes it easier to understand.\n\
    \nMany modern functional languages continue to either enforce or encourage single\
    \ exit points.\n\nSo it must be a good idea to add this constraint to Java right?\n\
    \nLets look what happens when we are told we must only have one exit point:\n\n\
    **Single exit with statements**\n\n```java\npublic class Example {\n  private\
    \ int value;\n\n  public int single(int x) {\n    int retVal = 0;\n\n    if (x\
    \ == 10) {\n      retVal = -value;\n    } else if (x > 0) {\n      retVal = value\
    \ + x;\n    }\n\n    return retVal;\n  }\n\n}\n```\n\nIf we remove the single\
    \ exit point constraint we get:\n\n**Multiple exit**\n\n```java\npublic class\
    \ Example {\n  private int value;\n\n  public int multi(int x) {\n    if (x ==\
    \ 10) {\n      return -value;\n    }\n\n    if (x > 0) {\n      return value +\
    \ x;\n    }\n\n    return 0;\n  }\n}\n```\n\nWhich version is better?\n\nThere\
    \ isn't much in it, but the multiple exit point version is easier to comprehend.\n\
    \nTrying to apply the single exit point constraint resulted in an additional local\
    \ variable to hold return state. In the multi exit version we can clearly see\
    \ what is returned when none of the conditions match. In the single exit version\
    \ it is slightly less clear.\n\nSo does this mean that single exit points are\
    \ bad?\n\nNo.\n\nIt is possible to write alternate single exit implementations.\n\
    \n```java\npublic int oneAssignment(int x) {\n    final int retVal;\n\n    if\
    \ (x == 10) {\n      retVal = -value;\n    } else if (x > 0) {\n      retVal =\
    \ value + x;\n    } else {\n      retVal = 0;\n    }\n\n    return retVal;\n \
    \ }\n```\n\nWe've addressed the issues we identified earlier. We only assign to\
    \ `retVal` once and it is clear what is assigned when none of the conditions match.\n\
    \nIs this superior in some way to the multi exit version?\n\nNot really. As Java\
    \ is a largely statement-based language, you will also encounter logic where the\
    \ multi-exit version is undeniably clearer. We switched from using a statement\
    \ to working with expressions.e. things that return a value.\n\nWe can also write\
    \ a single exit method using the `?` operator:\n\n**Single exit with ? operator**\n\
    \n```java\npublic int expression(int x) {\n    return  x == 10 ? -value\n    \
    \    : x > 0  ? value + x\n        : 0;\n  }\n```\n\nIs this version clearer than\
    \ the multi-exit version? That is debatable and ultimately a matter of personal\
    \ taste.\n\nThe code using `?` is terse and some will find it harder to understand.\n\
    \nThe multi-exit version is more verbose but its proponents would argue it is\
    \ easier to comprehend.\n\nIf your personal preference is for the `?` operator\
    \ version, it still does not follow that the single exit point rule is something\
    \ you should try to universally apply. The most likely result is that you will\
    \ push people towards writing code like the earlier bloated version of our method.\n\
    \nMartin Fowler and Kent Beck express things nicely in \"Refactoring: Improving\
    \ the Design of Existing Code\":\n\n> . . one exit point is really not a useful\
    \ rule. Clarity is the key principle: If the method is clearer with one exit point,\
    \ use one exit point; otherwise don't\"\n\nThere is nothing wrong with single\
    \ exit functions, but only write them when it makes sense to do so.\n\n# Always\
    \ Use A StringBuffer\n\n# Bad Advice - Always Use a StringBuffer to Concatenate\n\
    \nThis advice is doubly wrong.\n\nFirstly it advocates using the synchronized\
    \ `StringBuffer` rather than a `StringBuilder`.\n\nSecondly it is an oversimplification\
    \ or misunderstanding of the more nuanced and reasonable advice to not concatenate\
    \ Strings in a loop.\n"
