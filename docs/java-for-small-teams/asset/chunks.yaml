    \   doFoo();\n    }\n  }\n\n  public void api2() {\n    if(...) {\n      doBar();\n\
    \    }\n  }\n\n  private void doFoo() {\n    while(...) {\n      handleA();\n\
    \      handleB();\n    }\n    leaf();\n  }\n\n  private void handleA() {...}\n\
    \n  private void handleB() {...}\n\n  private static void doBar() {\n    if (...)\
    \ {\n      leaf();\n    }\n  }\n\n  private void leaf() {...}\n}\n```\n\nFields\
    \ should always be placed at the top of the class before any methods.\n\n# Keep\
    \ Methods Small And Simple\n\n## Keep Methods Small and Simple\n\n### Summary\n\
    \nKeep methods small and simple.\n\n### Details\n\nSmall things are easier to\
    \ understand than big things. Methods are no different.\n\nOne way to measure\
    \ the size of a method is via the number of lines of code it contains.\n\nAs a\
    \ guide methods should not usually be longer than 7 lines in length. This is not\
    \ a hard rule - just a guide of when to feel uncomfortable with a method's size.\n\
    \nAnother way to gauge the size of a method is to see how many possible paths\
    \ there are through it. The *Cyclomatic complexity* of a method gives a measure\
    \ of this - it will increase as the amount of conditional logic and number of\
    \ loops grows.\n\nAs a guide, methods should not usually have a complexity above\
    \ 5. Again, this is not a hard rule, just a guide of when to feel uncomfortable.\n\
    \nYour code will naturally contain some methods that are larger than others -\
    \ some concepts are inherently more complex than others and the implementation\
    \ will not become simpler if broken down further or expressed in a different way.\n\
    \nBut most large methods can be made smaller in one of three ways :\n\n*   Refactoring\
    \ into a number of smaller methods\n\n*   Re-expressing the logic\n\n*   Using\
    \ appropriate language features\n\n#### Splitting a Method into Smaller Concerns\n\
    \nMany large methods have smaller methods within them trying to find a way out.\n\
    \nWe can make our code easier to maintain by freeing them.\n\n**Bad**\n\n```\n\
    protected static Map<String, String> getHttpHeaders(HttpServletRequest request)\
    \ {\n  Map<String, String> httpHeaders = new HashMap<String, String>();\n\n  if\
    \ (request == null || request.getHeaderNames() == null) {\n    return httpHeaders;\n\
    \  }\n\n  Enumeration names = request.getHeaderNames();\n\n  while (names.hasMoreElements())\
    \ {\n    String name = (String)names.nextElement();\n    String value = request.getHeader(name);\n\
    \    httpHeaders.put(name.toLowerCase(), value);\n  }\n\n  return httpHeaders;\n\
    }\n```\n\n**Better**\n\n```\nprotected static Map<String, String> getHttpHeaders(HttpServletRequest\
    \ request) {\n  if ( isInValidHeader(request) ) {\n    return Collections.emptyMap();\n\
    \  }\n  return extractHeaders(request);\n}\n\nprivate static boolean isInValidHeader(HttpServletRequest\
    \ request) {\n  return (request == null || request.getHeaderNames() == null);\n\
    }\n\nprivate static Map<String, String> extractHeaders(HttpServletRequest request)\
    \ {\n  Map<String, String> httpHeaders = new HashMap<String, String>();\n  for\
    \ ( String name : Collections.list(request.getHeaderNames()) ) {\n    httpHeaders.put(name.toLowerCase(),\
    \ request.getHeader(name));\n  }\n  return httpHeaders;\n}\n```\n\n#### Re-expressing\
    \ logic\n\n**Terrible**\n\n```\npublic boolean isFnardy(String item) {\n  if (item.equals(\"\
    AAA\")) {\n    return true;\n  } else if (item.equals(\"ABA\")) {\n    return\
    \ true;\n  } else if (item.equals(\"CC\")) {\n    return true;\n  } else if (item.equals(\"\
    FWR\")) {\n    return true;\n  } else {\n    return false;\n  }\n}\n```\n\nThis\
    \ can be easily re-expressed with less noise as :\n\n**Better**\n\n```\npublic\
    \ boolean isFnardy(String item) {\n  return item.equals(\"AAA\")\n      || item.equals(\"\
    ABA\")\n      || item.equals(\"CC\")\n      || item.equals(\"FWR\");\n}\n```\n\
    \nOr with a move to a more declarative style :\n\n```\nprivate final static Set<String>\
    \ FNARDY_STRINGS\n  = ImmutableSet.of(\"AAA\",\n                    \"ABA\",\n\
    \                    \"CC\",\n                    \"FWR\");\n\npublic boolean\
    \ isFnardy(String item) {\n  return FNARDY_STRINGS.contains(item);\n}\n```"
