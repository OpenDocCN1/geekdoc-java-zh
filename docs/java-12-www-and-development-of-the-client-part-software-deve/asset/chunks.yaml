    syntax, it’s easy enough to figure out what’s happening, but note the special
    way to bind the `complete()` method that returns data to the list, and also note
    how to reference the event handler. Finally, note that the field for entering
    the zip code must be updated.


    Note that the style sheet is also expanded.

