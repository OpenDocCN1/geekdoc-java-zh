    #### Objects


    An object is simply a collection of properties that may be of some value. The
    type of a property can be anything and especially an object, and since a function
    is an object, an object can also contain functions. You creates an object as follows:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_701.jpg)


    where two objects have been created. The first has three properties, while the
    other is an empty object. In JavaScript, you do not have classes, as you know
    it from Java, and you can not inherit the same way you know from this language,
    but in JavaScript you use a form of inheritance called *prototyping* that in short
    means that you can create objects by expanding existing objects. For example,
    if you write


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_702.jpg)


    an object has been created that inherits *obj1* and expands this object with an
    additional property. For example, if you performs the following statements:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_71.jpg)


    the first *alert()* will show 17 and the other 26\. Here, you should note that
    changing the value of the property *a* on the object *obj1* also has an effect
    on the object *obj3*, which justifies the relationship between *obj1* and *obj3*
    being a form of inheritance. Technically, it is implemented by the fact that each
    object has a property called *prototype*. This property refers to properties inherited
    from the parent object (the object from which the current object is created based
    on). When you try to refer a property on an object, the interpreter will first
    search for this property in the current object and if it not find the property
    the interpreter will search in its parent via *prototype*. This continues until
    you either find the desired property or can not find it. This chain may be interrupted
    by overriding a property. As an example is shown another object that expands obj1
    using a method:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_711.jpg)


    Note that although the method *f()* is a property in the object *obj4* which extends
    *obj1*, the method can not immediately refer to the object’s other properties,
    but it can be solved with *this* as referring to the current object. The following
