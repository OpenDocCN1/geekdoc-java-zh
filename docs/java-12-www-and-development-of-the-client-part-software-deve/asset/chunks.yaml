    that all *h:* elements are changed to *p:* elements and thus to PrimeFaces elements.
    However, there are some other changes. *outputText* does not exist as a PrimeFaces
    element, and here the element is changed to *p:outputLabel*. Earlier, all message
    elements had a class, but it has now been removed since it no longer has effect.
    The element *groupPanel* also does not exist as a PrimeFaces element and is replaced
    by a *p:outputLabel* element. The most important change, however, relates to the
    element *p:commandButton*. It uses as default ajax, but does not know an *action*
    event. Instead, an *actionListener* attribute must specify the action to be performed
    as well as update which sections of the user interface should be updated and here
    it is the panel containing the input components.


    If you see the code you can see that PrimeFaces is quite simple, and the result
    in web pages that look nice, but if you want to differ from what PrimeFaces have
    defined, it’s not so simple. PrimeFaces is based on style sheets and a number
    of internal styles, and if you change a page’s look and feel, the method is of
    changing these styles. You can also define styles in the usual way (see the *width*
    of the above *p:inputText* elements), but it’s not always easy to predict the
    effect as you can not immediately see what the individual PrimeFaces elements
    are translated into. Here it may be helpful to study the source code in the browser.
    A *p:panelGrid* by default sets a thin frame without the individual cells and
    without the entire component, and in this case I wants to remove the frame. In
    addition, I would like to use a smaller font for error messages, and I have therefore
    added the following style sheet:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_133.jpg)


    and here it’s not so easy to know what classes to override. In addition, be aware
    that the style sheet must be loaded after PrimeFaces’ own style sheets are used
    and one way is to do it at the start the body section as shown in the code above.


    Then there is the page *list.xhtml*:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_134.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_135.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_136.jpg)


    Again, the code *list.xhtml* is similar to *ChangeAddress5*, and the biggest difference
    is in addition to *start.xhtml* the *p:layout* elelemtn and most of the *h:* elements
    are replaced by *p:* elements. The layout is this time expanded with an *east*
    area – just to show the syntax. In the area there is an image (which is added
    to the application as a resource) and it is only for there to be something, but
    also to emphasize that you can perfectly combine PrimeFaces and usual HTML. When
    you try out the application, note how the table is formatted, and it is one of
    the most important reasons for using PrimeFaces that you generally get a nice
    result without having to struggle with style sheets and the like.


    ## 6.1 How to poll the server


    It is always the client (the browser) that addresses the server with a request
    when something is going to happen, and it is never the server that takes the initiative
    to contact the client. For example, if you want the user interface updated, the
    client must send a request to the server. You can automate this behavior using
    PrimeFaces what the following example will illustrate. The example is an extension
    of *ChangeAddress6* and is called *ChangeAddress7*, and the form *start.xhtml*
    has been changed so it displays the clock (see below). In principle, it is not
    the big challenges and is primarily a matter of expanding *IndexController* with
    the following property:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1361.jpg)![](image/Image16250.jpg)


    However, the clock is updated every second, which means that the client must send
    a request to the server every second to update the clock. It is said that the
    client should pole the server. This can be implemented using PrimeFaces as follows:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_137.jpg)


    You should note that the element *p:poll* automatically uses ajax, so it is only
    the current label that is being updated. To display the clock well, the style
    sheet is expanded with the following class:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_138.jpg)


    and again, you should note that conventional web technologies can be combined
    with PrimeFaces without difficulty. The opposite also applies to the use of a
    function such as *p:poll* without else using PrimeFaces.


    ## 6.2 A p:autocomplete element


    As another application of PrimeFaces, I want to show a so-called autocomplete.
    The application *ChangeAddress8* is another extension, and if you in the field
    for the city name begin to enter the name, you get a dropdown list with the name
    that matches:


    ![](image/Image16257.jpg)


    Specifically, the program has been modified so that if you are in the field for
    zip code and enter an existing zip code (only existing zip codes are legal), then
    the city name will be filled in automatically and if you enter in the city name
    field and enter text, you will see above a list of city names that match (contains)
    the entered text and select a city name, the field for zip code is automatically
    updated.


    To solve the task I have first added the following class, which is a table of
    Danish zip codes:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_139.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_140.jpg)


    The methods do not require any particular explanation, but a more dynamic solution
    would of course be to load the zip codes from a database. A validator class has
    also been added to zip codes, which do nothing but test if a zip code is found
    in the table above. As the class does not add anything new, I will not display
    the code here. Next, the controller class is modified, where I have only shown
    the code that has changed:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1401.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_141.jpg)


    Note that *setCode()* has been changed so it now also initializes the city name
    from the zip code table. The *complete()* method is the method that returns the
    list of city names that match the text entered in the city name field. Finally,
    there is the *select()* method, which is an event handler that is performed when
    a city name is selected in the list.


    Back there is *start.xhtml* where the fields for zip code and city name are changed:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_142.jpg)


    Regarding entering the zip code, there is not much new, but note that there is
    another validator attached. Note that it is also defined that the field for the
    city name must be updated. The most important is by entering city name, where
    the element has now been changed to a *p:autoComplete* element*.* When you see
    the syntax, it’s easy enough to figure out what’s happening, but note the special
    way to bind the *complete()* method that returns data to the list, and also note
    how to reference the event handler. Finally, note that the field for entering
    the zip code must be updated.


    Note that the style sheet is also expanded.'
