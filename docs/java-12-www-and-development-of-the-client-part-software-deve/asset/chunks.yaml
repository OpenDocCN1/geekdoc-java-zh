    ![](image/Image6171.jpg)


    The most important thing about the example is how to transfer a parameter to the
    event. It is an object with many properties and methods.


    Properties of the `event` object


    *   `event.clientX` and `event.clientY`: indicates in the case of a mouse event
    the coordinates relative to browser window.

    *   `event.offsetX` and `event.offsetY`: indicates in the case of a mouse event
    the coordinates relative to the element that has raised the event.

    *   `event.keyCode`: indicates in case of a key event code for key pressed.

    *   `event.target`: is a pointer to the node in the DOM tree, which raised the
    event.

    *   `event.currentTarget`: is a pointer to the node in the DOM tree, which is
    bubbled or captured

    *   `event.eventPhase`: indicates the event phase as 1 for capture, 2 for target,
    3 for bubbling.

    *   `event.type`: indicates event type such as click, key press, etc.

    *   `event.relatedTarget`: indicates for some events (for example `mouseout`)
    the element that originally raised the event.

    *   `event.stopPropagation()`: a method that can be called to stop an event propagation
    up or down in the DOM tree, but other registered event handlers are still performing

    *   `event.stopImmediatePropagation()`: a method that as `event.stopPropagation()`,
    stops an event propagation up or down in the DOM tree, but it does not performs
    other event handlers.

    *   `event.preventDefault()`: a method that stops a default event handling if
    possible.


