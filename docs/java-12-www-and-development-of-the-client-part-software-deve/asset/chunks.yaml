    ### Events


    DOM defines exactly as events how to interact with the individual elements. Most
    events relates to the mouse, and for a particular event you can associate an event
    handler with an element in the document. When a user interacts with an element,
    the browser checks whether an event handler has been registered for that element,
    and if so, the handler is executed. The elements are in a document part of a hierarchy
    and an event will bubble up through the tree of all parent elements, and for all
    parent elements where an event handler has been registered for that event, this
    will be excuted. When the event reaches the top – and that is, the body element
    – an event will follow the same path back until it returns to the element that
    originally raised the event. The two phases are called the `bubbling phase` and
    the `capturing phase` respectively, and you can specify the phase in which you
    wish to process the event.


    When an event handler is performed, it is done in the same way as any other JavaScript
    function within a context, and DOM defines that it is the context of the element
    to which that particular handler is related. You can therefore refer to the element
    that the event concerns with the `this` reference.


    DOM defines the following events:


    *   events for the mouse: `click`, `mousedown`, `mouseup`, `mousemove`, `mouseover`,
    `mouseout` and more

    *   events for the keyboard: `keypress`, `keydown`, `keyup`

    *   events for objects: `load`, `error`, `scroll`

    *   events for forms: `select`, `change`, `submit`, `reset`, `focus`

    *   events for user interaction: `focusin`, `focusout`


    Consider, for example, a page with the following content:


    ![](image/Image16156.jpg)


    Here the upper text is a `div` element, while the three bottom are paragraphs.
    The code is as follows:


    ```

    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_101.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_102.jpg)

    ```


    In the header are defined two simple event handlers. You should note the use of
    the `this` reference, which will refer to the element that has raised the event.
    The HTML code requires no explanations, but it is the subsequent script block
    that assign event handlers to the HTML elements. First, there are references to
    the three paragraphs, and then two event handlers are assigned for a click event
    for each paragraph. The one is a handler for the bubbling phase (`false`), and
    the other is a handler for the capturing phase (`true`). You should note how to
    associate an event handler with the method `addEventListener()`. As a result,
    clicking on one of the three paragraphs will cause an alert to show which events
    are fired. The last statement in the script block assigns an event handler to
    the first `div` element. Here you should notice how to find the item and how to
    set the event handler as an anonymous function.


    There is also a method called `removeEventListener()` and that has the same parameters
    as `addEventListener()`. This function is used to remove an event handler from
    an element.


    When an event handler is performed, an event object is transferred to the handler.
    Consider the following code as example:


    ```

