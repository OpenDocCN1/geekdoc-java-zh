    书的目录包含一个文档 `java12`，它是一个包含书中两个章节文本的文档，文本以纯文本保存。目录中还有名为 `screen1.png` 和 `screen2.png`
    的 png 文件。这些文件是本章的截图。任务是创建一个带有 HTML 文档的 Web 应用程序，显示文件 `java12` 的内容和两个图片。页面应该只对文本进行结构化，你不应该对文本进行格式化。这是之后的主题。


    # 3 层级样式表


    在上述关于 HTML 的介绍之后，我准备好，将以上一章节相同的程序作为起点。我在项目中添加了一个新的 HTML 文档并命名为 `styleddoc.html`。其内容与
    `index.html` 相同，目标是展示如何使用样式表更改文档的视觉呈现。最初我创建了一个 `resources` 目录，并在其中包含子目录 `css`，添加了名为
    `styles.css` 的样式表：


    ![](img/Image5071.jpg)


    最初，它只是一个空文件。需要使用样式表的文档必须在头部有一个 `link` 元素：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_17.jpg)


    语法应该是正确的，你可以轻松地用鼠标将文件拖入文档，NetBeans 会自动插入正确的链接。


