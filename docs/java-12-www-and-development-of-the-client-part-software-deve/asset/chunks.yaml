    ## 4.4 DOM


    DOM stands for `Document Object Model` and is a W3C standard for how browsers
    must build an HTML document as a hierarchy of objects. DOM is not part of JavaScript,
    but the DOM objects allow JavaScript to manipulate the objects and thus refer
    to the contents of the current document from script code. In combination with
    JavaScript, DOM is the key to developing websites where something is happening
    on the client side. DOM is a standard, but it is up to the browser vendors to
    implement this standard and the standard is no better than to the extent that
    the browser vendors live up to it. This means that there may be (and are) differences
    between different browsers and different versions of the same browser, but the
    most basic objects are, however, implemented roughly standard.


    The root of the DOM tree is called `window` and is an object consisting of several
    properties and collections. The main property is `document` that represents the
    document that the browser shows. Consider, for example, the following document
    (`DOMTree` project):


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_92.jpg)


    In the DOM tree, each element in the document is represented by a node, and it
    also applies to elements that are not visible, such as a `script` element. The
    typical use of JavaScript is to modify the DOM tree, including specifically changing
    the individual nodes. In this case, the script element begins by defining a global
    variable. The function `parse()` has a node as a parameter, and it starts by adding
    this node’s name to the global variable `tree`. If attributes are attached to
    the node, they are also added to the variable as key/value pair. Finally, if there
    are child nodes, the function `parse()` is called recursively for each child node.


    You must note the syntax for the function `parse()`. Of course, it is not so easy
    to guess what the individual properties are called, but when you see the result,
    it’s easy to follow what happens.


    There is another function called `build()` which calls the above recursive function
    with the `document` object as parameter. When the function `parse()` is performed,
    the function `build()` will with a reference to the element with id `domTree`
    (which is a text area) insert the value of the global variable `tree`. The `build()`
    function is performed as an event handler for `onload` that occurs after the document
    is loaded and displayed in the browser, and after that the DOM tree is built.


    If you opens the document in a browser, you get the window belove, and here you
    can see how each element in the document is represented by a node in the DOM tree.


    ![](image/Image16113.jpg)


    ### Refer elements in DOM


    With regard to the use of DOM, the first step is to learn how to refer to the
    individual elements of the DOM tree and then do something with these elements.
    This is basically done by referring to the elements `id` attributes or the elements
    `class` attribute, which is illustrated in the introduction to this chapter with
    the example `SimpleDocument`. The example shows a little about what options are
    available to find a particular element or array of elements in the DOM tree. The
    basic methods are:


    * `getElementById()`

    * `getElementsByTagName()`

    * `getElementsByClassName()`

    * `querySelector()`

    * `querySelectorAll()`


    Here, the last two are the most advanced, as they use CSS selectors as explained
    in chapter 3 of this book, and the difference is that the first returns the first
    element that matches the selector, while the other returns all the elements that
    match. In addition, a node has the following properties:


    * `firstChild`

    * `lastChild`

    * `nextSibling`

    * `previousSibling`


    that can be used to traverse the DOM tree.


