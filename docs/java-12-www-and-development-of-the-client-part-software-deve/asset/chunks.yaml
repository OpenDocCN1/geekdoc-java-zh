  trans: '

    接下来，我想展示如何通过一个提交（submit）将所有字段发送到服务器，而无需刷新页面。这样做的好处并不大，但它提供了一个更安静的窗口，因为所有操作都是异步进行的，因此用户在很大程度上感知不到数据正在发送到服务器，而且整个文档不需要重新渲染。我将使用与相同的示例，并从一个名为
    `ChangeAddress2` 的副本开始。在 `index.xhtml` 中，我修改了两个地方。`Submit` 按钮现在有一个 ajax 函数：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1151.jpg)


    你应该注意，该函数是由一个 action 事件触发的，该函数应该关联所有表单字段，并且所有字段都必须被渲染。此外，最后一个链接必须更改为 `h:commandLink`：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_116.jpg)


    这里你特别应该注意最后一个属性，它是必要的，因为命令不应该验证表单字段。


    最后，页面 `list.xhtml` 上的链接被更改为 `commandLink`（它本就应该是这样的）。


    在这种情况下，所有表单字段都通过提交发送到服务器，并且在 ajax 函数完成后更新的是所有表单字段。你并不总是对此感兴趣，事实上，可能只有几个字段。在这种情况下，我假设日期字段始终应该是今天，在
    `index.xhtml` 中，我定义了组件 `readonly`：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1161.jpg)


    你应该注意，该组件不再关联任何 ajax 函数，我还更改了相应标签（label）中的文本。


    为了初始化字段 `date`，我修改了 `Person` 类中的构造函数，使其将 `date` 字段初始化为当前日期：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1162.jpg)


    最后，更改了 `index.xhtml` 中提交按钮的 ajax 函数：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1163.jpg)


    也就是说，我现在显式指定了哪些表单字段要发送到服务器，以及哪些表单字段在函数完成后必须被渲染。


    在这种情况下，优势显然是有限的，但在其他上下文中它可能很重要。记住，ajax 的核心思想仅仅是更新页面必要的部分。


    我将对应用程序进行另一项更改，并开始创建一个名为 `ChangeAddress3` 的副本。在 `index.xhtml` 中，每个字段通过各自的 ajax
    函数进行验证。实际上，你可以通过将需要验证的字段封装在 `f:ajax` 元素中相同效果：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_117.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_118.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_119.jpg)


    验证方式相同，但编写方法更加直观。注意，有必要指定要渲染的字段（用于错误消息）。然而，有一个区别，验证在每次发生失去焦点（lost focus）事件（即每次离开输入字段）时都会发生。这意味着只会显示与相关输入组件相关的错误消息——这有时也是最合适的。


    ## 5.3 转换器 (Converters)


    在接下来的示例中，我将展示转换器的用法，你可以将转换器附加到输入组件上。这与 ajax 没有直接关系，但它通常与 ajax 配合使用。示例与上面相同，我从
    `ChangeAddress3` 的副本开始，将其命名为 `ChangeAddress4`。作为一个使用转换器的示例，城市名称将自动转换为大写字母，而电子邮件地址将自动转换为小写字母。这样的转换器可以这样写：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1191.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_120.jpg)


    这相对简单。这里有一个名为 `LowerConverter` 的对应转换器类。作为一个稍微有点趣的转换器使用示例，应用程序已更改，使得你可以再次编辑日期字段，但我保留了该字段初始化为今天。另一方面，我希望在输入日期方面具有更大的灵活性，因此允许使用空格代替连字符。为了解决这个问题，我在程序中添加了以下转换器：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_120.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_121.jpg)


    这里是应用程序，展示了 `DateConverter` 的用法：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_112.jpg)


    另外两个转换器的用法相同。由于字段中的值在输入后必须立即更新，因此必须更新 `f:ajax` 元素：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_113.jpg)


    查看输入组件 `date`，它既有验证器又有转换器，在这里你应该注意这些方法的执行顺序：


    1. `getAsObject()` // DateConverter

    2. `validate()` // DateValidator

    3. `getAsString()` // DateConverter


    ## 5.4 JSF 监听器 (Listeners)


    JSF 组件在渲染时可以触发不同的事件（名称指示了发生的时间）：


    - `preRenderComponent`

    - `postAddTo`

    - `preValidate`

    - `postValidate`


    你可以为这些事件定义监听器，监听器是在服务器上执行的 Java 代码。作为一个示例，我创建了 `ChangeAddress4` 的副本并命名为 `ChangeAddress5`。首先，我更改了
    `index.xhtml` 的代码，像 `ChangeAddress1` 一样，为每个输入组件了 ajax 函数。下一步，`IndexController`
    增加了两个方法：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_121.jpg)


    `Person` 类有一个初始化为今天的 `date` 属性，第一个方法测试该日期是否为周末（周六或周日）。如果是，方法返回文本 `red`，否则返回 `darkgreen`。下一个方法是监听器方法。它的参数是一个事件，方法确定与事件关联的组件引用。如果
    Person 对象的 `date` 属性是周末日期，则组件的值设置为 `Weekend`，否则设置为 `Everyday`。


    这两个方法基本上是简单的 Java 方法，现在我将展示如何在 `index.xhtml` 中使用它们作为事件处理程序。表单增加了一个类型的 `outputText`
    元素（唯一要求是它是一个具有值属性的组件）：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_123.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_124.jpg)

    '
- fmt: '

    The new elements have an `id` with the value `weekend` as well as a `style` attribute,
    where you should primarily note that the value of color is determined by the return
    value from the method `isWeekend()`, which is either `red` or `darkgreen`. As
    a result, the text appears either as red or green. Finally, the element defines
    an event of the type `preRenderComonent`. That is, the event handler (the element’s
    listener) is performed before the element is rendered and the handler is the method
    `checkForWeekend()` in the controller class. It is executed each time the element
    is rendered, which naturally occurs when the page is rendered, but it also happens
    when the input component to date is changed, as the ajax function indicates that
    the element with `id weekend` must be rendered.


    # 6 Component libraries


    As shown in the previous chapter, JSF and especially in combination with Ajax
    provide a range of facilities that makes it easy to develop attractive and dynamic
    web applications, but there is a lot more to do with, and among other things there
    are several thirds parts JSF component libraries. In this chapter I will give
    an introductory note to one of these libraries, called `PrimeFaces`. Basically,
    it’s a library that essentially defines its own component for each of the standard
    JSF components as well as expanding with a skeleton for a web applcatation that
    makes it easy to develop a stable application from scratch. The motivation for
    using `PrimeFaces` is primarily to make it easy to develop user-friendly web applications,
    but also that the library offers other services that JSF does not immediately
    provide, and in fact, the idea is that the user to the least extent should work
    with style sheets and JavaScript – two things that in practice can be quite time
    consuming.


    As mentioned, there are other JSF component libraries, but I would like to introduce
    `PrimeFaces`, as the library is directly supported by NetBeans, without the need
    to install the libraries in question (which is also quite easy). One can achieve
    significant benefits with `PrimeFaces`, but the price is that you must know the
    library (a bit like `jQuery`) and you should be aware that the developers of `PrimeFaces`
    have an idea of how web applications should look and work, and if you want to
    deviate from it, it is not always that easy.


    I want to start with a usual web application, which I have called `ChangeAddress6`.
    When I come to Frameworks, I’ve chosen `JavaFaces` as usual, and here I clicked
    on the `Components` tab and chose `PrimeFaces`:


    ![](image/Image16220.jpg)


    When I then click Finish, NetBeans as usually creates a web application with three
    files added:


    ![](image/Image16227.jpg)


    In addition to `index.xhtml` and `web.xml`, another `welcomePrimefaces.xhtml`
    page has been created, which is the application’s start page. The result is a
    fully completed web application and opens it in the browser, you get the following
    window:


    ![](image/Image16235.jpg)


    It is `index.xhtml`, but clicking on the link opens the window:


    ![](image/Image16242.jpg)


    which is `welcomePrimefaces.xhtml`. That is, NetBeans has generated a skeleton
    for a page, and it is then the task of the programmer to fill in with something
    sensible. You should note that the page’s design is made without the use of style
    sheets or JavaScript, but all built into the library.


    `index.xhtml` does not contain anything new or anything about `PrimeFaces`, and
    of course, the goal is to change it for the specific task. The new things are
    found in `welcomePrimes.xhtml`, where NetBeans has created the following page:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_127.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_128.jpg)


    If you let your eyes run through the code, you’ll see that it’s all about a template,
    whatever it’s all are about. Starting at the top, you should note that a new namespace
    has been added:


