    JavaScript has functional scope. This means that if you create a variable with
    `var`, its scope is limited to the function where the variable is created or for
    internal functions. It can be illustrated with the following function:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_591.jpg)


    The scope where a variable is defined is often called its `local scope`. When
    referring to a variable, the runtime system will search for the variable in the
    current scope. If the variable is not found here, the system will search for the
    variable in the containing scope, and this will continue until the system finds
    the variable or comes to the top scope, commonly called the `global scope`. The
    process is sometimes called `scope chain lookup`. Variables that are not declared
    in a function will always have global scope, and the same applies to variables
    that are declared without the use of `var`.


    Variables are always created at the start of a scope – even if the declaration
    itself is first written later in the code:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_592.jpg)


    If you perform this function, it will display `undefined` with the `alert()`.
    The variable `t` is thus created, but it is not initialized. However, if you remove
    the word `var`, you will get an error as you refer to a variable that has not
    been created. This corresponds to the interpreter’s perception of the above function
    as:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_60.jpg)


    As it can sometimes lead to hard-to-see results, it is recommended that you consistently
    create and initialize variables at the beginning of functions.


    When a function terminates, its scope will disappear and at the same time, the
    runtime system will remove all local variables that the function has created.
    If the function is called again, its local variables will be re-created. It is
    at least the normal behavior, but consider the following document:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_61.jpg)


    If it opens in the browser, the first `alert()` will show 1 and the next `alert()`
    show 2. If you consider the function `f()`, it has a local variable `t` that is
    assigned the value 1. The internal function `g()` shows the value of this variable,
    after which it is counted up with 1. The function `f()` returns the internal function
    `g()`. Note that it is legal, since a function is specifically an object. In the
    body section, the function `f()` is performed and its return value is stored in
    the variable `h`, which now refers to a function and the function `f()` terminates.
    Next, `h()` is performed, which means that it is the function `g()` that is performed
    as with an `alert()` shows the value 1, which is the value of the local variable
    `t` in `f()`. When `h()` is executed the second time, it will display 2. There
    it is still the value of `t` and you can see that `t` is not initialized again
    and thus not removed after `f()` is terminated. The reason is that there is an
    indirect reference to `t` via `g()`. When `f()` terminates, `t` is not removed
    since `h` refers to `g()` which refers to `t`. That a local variable in this way
    will not be removed after the function that creates the variable terminates is
    called closures.


    ### Types


    In JavaScript, you should not specify any data type when creating a variable.
    It is said that it is a type-weak language. However, it is not the same as JavaScript
    does not have types and there are basically 4 types:


    * `Boolean`, which are variables or expressions that are either `false` or `true`

    * `Number`, which are numbers, that are 64 bits floiting points

    * `String`, which are random sequences of characters

    * `Object`, which are families of properties and methods


    That the language is type-weak means that the runtime system based on variables
    and expression values automatically determines the type. This means, in particular,
    that the type of a variable can be changed over its lifetime and is always determined
    by the value of the variable. For example the following code


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_62.jpg)


    where the function `f()` is as above, will alert the following type names (the
    operator `typeof`)


    * `string`

    * `number`

    * `boolean`

    * `object`

    * `function`

    * `object`


    Here you should note that for `f`, the result is `function`, even if the type
    is formally `object`, and that the type of an array is an `object`.


    The value of a variable can be a `primitive` where there are the following options:


    * `true` or `false` and then a `boolean`

    * a `number` and then all possible numbers

    * a `string`

    * `null`, that means that the variable has no value

    * `undefined`, that means that the variable is defined, but not initialized


    Everything that is not a primitive is an `object`, and it therefore special means
    arrays and functions.


    Consider the following code where the function `f()` again is as above:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_63.jpg)


    If you perform this code, you get the result:


    ![](image/Image15842.jpg)


    The variable `v` has the value 19, which has the type `number`. When you loop
    over the array, you first determines the sum of `v` and the value 47. They are
    two numbers and the result is 66. Next, add `true`, which is a `boolean`, and
    here occurs an automatic type conversion to a number where the value `true` is
    converted to 1 and the result of the sum is 67. In the third iteration, the plus
    is performed on a `number` and a `string`, and this time occurs an automatic conversion
    to a string for both operands. In the fourth iteration, the operator is executed
    on a `string` and an `object`, and the result is a string concatenation. The same
    goes for the last time, since `f()` is also an `object`, but the string – the
    result of `toString()` – is this time the code of the function.


    The example should show that as JavaScript is type-weak, an expression may well
    consist of different types, and consequently implicit type conversions are always
    ongoing. This can naturally lead to unexpected results, and the rules are also
    complex. Basically, the following applies.


    Note first that a variable of the type `object` has two methods `toString()` and
    `valueOf()` (which can be overridden), where the first returns the value of the
    object as a `string`, while the other returns the value as a `primitive`. For
    example, if you consider the following code:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_64.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_65.jpg)


    there are defined two objects where the latter overrides `toString()` and `valueOf()`.
    Opening the code in the browser is the result:


    ![](image/Image15853.jpg)


    ```

    // Result of the code execution shown in image

    ```


    Here you can see that `toString()` and `valueOf()` as default return the string
    `[object object]`, but otherwise the value of the overridden methods.


    For automatic type conversion, JavaScript uses three internal methods called `toPrimitive()`,
    `toNumber()`, and `toBoolean()`. `toPrimitive()` has an argument and returns a
    `primitive` following the algorithm:


    1. if the argument is an `object` returns `valueOf()` if it is a `primitive`,
    and else returns `toString()` if it returns a primitive and else reports an error

    2. if the argument is a primitive return the argument


    `toNumber()` also has an argument and returns a number according to the following
    algorithm:


    1. if the argument has the type `Number` returns the argument

    2. if the argument has the type `Boolean` returns 1, if the value is `true` and
    else 0

    3. if the argument is `Null` returns 0

    4. if the argument has the type `object` returns `toNumber(toPrimitive(argument))`

    5. it the argument is `undefined` returns `NaN`

