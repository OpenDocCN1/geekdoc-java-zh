    # 8 WebSheet


    作为本书的最后一个示例，我将编写一个简单的电子表格，一个 Web 应用程序。该程序名为 `WebSheet`，如果你在浏览器中打开它，你将看到以下窗口：


    ![](img/Image16265.jpg)


    电子表格需要高度的用户交互，用户必须能够在单个单元格中输入数字和公式，如果是公式，必须对表达式进行求值。客户端需要完成大量工作，项目的目标是展示如何用 JavaScript
    实现它，从而展示 JavaScript 的某些可能性。为了方便工作，我使用了 `jQuery`，它是一个 JavaScript 库，提供了广泛的功能，包括专门为用户界面定制的元素，如对话框、右键菜单等。如果你不了解
    `jQuery`，可以阅读书的附录 A，其中对 `jQuery` 进行了简单介绍。


    如上所述，目标是展示如何使用 JavaScript 编写 Web 应用程序的客户端，但它并不是一个功能完整的电子表格。并不是说这个程序不能用，而是缺少很多功能，或者有很多可以改进的地方。


    ## 8.1 程序的功能


    要进入单元格，首先必须打开单元格，这通过按下 `CTRL + SHIFT` 并点击鼠标来实现。然后你可以输入数字、公式或文本。按下 `Tab` 或 `Enter`
    接受输入。


    你可以使用鼠标选择一个或多个单元格，并按照按住左键拖动鼠标的通常方式操作，`CTRL` 和 `SHIFT` 键具有通常的功能。


    程序有一个包含 16 个功能的工具栏，从左到右对应的功能如下：


    1. 创建一个新的电子表格并输入行数（默认 50）和列数（默认 20）。

    2. 打开现有的电子表格，你可以在已创建并保存的电子表格中进行搜索。

    3. 保存正在工作的电子表格——如果它已经保存过。否则调用 `Saveas` 函数。

    4. 将电子表格另存为新电子表格，这意味着输入一个名称。

    5. 将选中单元格的文本加粗。

    6. 将选中单元格的文本设斜体。

    7. 设置选中单元格的小数位数。

    8. 设置选中单元格的文本左对齐。

    9. 设置选中单元格的文本居中对齐。

    10. 设置选中单元格的文本右对齐。

    11. 设置选中单元格的字体颜色。

    12. 设置选中单元格的背景颜色。

    13. 删除选中单元格的所有格式，或者在未选择任何单元格时删除整个电子表格的格式。

    14. 复制选中单元格。

    15. 删除选中单元格的内容并存储该内容。

    16. 插入已保存或删除的单元格。


    此外，右键点击行标题会得到一个包含四个功能的右键菜单：


    1. 选择该行所有的单元格。

    2. 在当前行上方插入一个空行。

    3. 在当前行下方插入一个空行。

    4. 删除该行。


    列也是如此：


    1. 选择该列所有的单元格。

    2. 在当前列之前插入一个空列。

    3. 在当前列之后插入一个空列。

    4. 删除该列。


    ## 8.2 设计


    电子表格的内容必须保存，并且必须在服务器端完成。因此，内容必须在服务器之间进行传输。为了方便这种传输，电子表格被表示为一个 `JSON` 对象。如果你不了解
    `JSON`，请阅读书的附录 B，其中对 `JSON` 进行了简单介绍。电子表格表示为如下形式的对象：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_145.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_146.jpg)


