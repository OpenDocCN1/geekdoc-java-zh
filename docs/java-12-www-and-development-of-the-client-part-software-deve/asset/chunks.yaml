    # Poul Klausen


    ## Java 12：WWW 与客户端开发

    ## 软件开发


    Java 12：WWW 与客户端开发：软件开发


    第 1 版


    © 2018 Poul Klausen & [bookboon.com](http://bookboon.com)


    ISBN 978-87-403-1974-3


    由 Ove Thomsen (EA Dania) 进行同行评审


    ## 前言


    本书是软件开发系列书籍中的第 12 本。书中使用的编程语言是 `Java`，该语言及其语法和语义显然涵盖了大量内容，但这些书也很大程度上关注了开发过程以及如何开发良好且健壮的应用程序。与关于
    Web 应用开发的 `Java 11` 一书类似，但侧重于客户端。这意味着关键主题是样式表和 `JavaScript`，特别是最后一部分涵盖了这部分内容。另一个主题是
    `Ajax`，就像书中对 `PrimeFacses` 进行了简要介绍。本书的主要目的是证明使用 `JavaScript` 进行复杂的客户端编程是可行的。本书要求具备服务器端的编程知识，这与在前一书中处理过的类似，两本书共同为
    Web 应用开发提供了一个相对基础的介绍。


    如标题所示，这一系列书籍涉及软件开发，目标是教读者如何用 `Java` 开发应用程序。可以通过阅读相关主题的内容和学习完整的示例程序来学习，但最重要的是通过亲身实践并从零开始编写自己的程序。因此，书中的一个重要部分是练习和问题，读者需要在其中编写与书中处理内容相应的程序。该系列中的所有书籍都围绕同一个骨架构建，由文本、示例、练习和问题组成，这些内容被放置在文本中自然的位置。练习与问题的区别在于，练习在很大程度上是重复文本中所述的内容，并且对要做什么描述得相对准确。而问题的描述则较为松散，通常规模稍大，且很少有明确的解决方案。这些书是应该从头到尾读完的，但许多代码示例（包括练习和问题）起着核心作用，让读者详细地研究许多示例代码，并解决练习和问题，或者只是研究推荐的解决方案，这是至关重要的。


    所有书籍都以一个或两个较大的示例程序结束，重点主要关注过程以及对程序如何编写的解释。另一方面，代码仅在有限范围内出现——如果出现的话——读者应该学习完成的程序代码，可能是在测试程序时进行。为了展示比所呈现示例更大的程序开发，结论示例的目标也是展示来自不同应用领域的程序示例。


    大多数书籍还以一个附录结束，处理书中未涉及的主题。这可能是软件安装问题或其他计算机技术主题，这些主题不属于软件开发，但需要具备基础知识。如果读者已经熟悉该主题，可以跳过当前附录。


    如提到的，编程语言是 `Java`，此外书中使用了以下产品：


    1. `NetBeans` 作为应用程序开发的 IDE（集成环境）

    2. `MySQL` 在需要数据库服务器的情况下（从 `Java 6` 一书开始）

    3. `GlassFish` 作为 Web 服务器和应用服务器（从 `Java 11` 一书开始）


    这些产品都是免费且免费安装的，甚至提到了某些产品的安装可以自动进行，无需耗费精力或应对挑战。此外，网络上还有针对这三个产品的详细安装说明。这些产品可在 `Windows`
    和 `Linux` 上运行，因此你使用 `Linux` 还是 `Windows` 并没有特殊区别。


    所有示例程序都在运行 `Linux` 的机器上开发和测试。


    ## 1 引言


    在 `Java 11` 书中，我提供了 `Java` 进行 Web 开发的基础介绍。我主要处理了服务器端，即浏览器向 Web 服务器发送请求，根据请求数据动态创建作为响应的
    `HTML` 文档。这种客户端/服务器原理也是 Web 应用的核心理念，事实上，你可以根据 `Java 11` 中的概述在这里停止。然而，还有很多需要学习，在这里我想提到：


    1. 视觉以及开发具有良好界面的应用程序（网站）的可能性，特别是易于维护的用户界面。

    2. 客户端编程，即部分代码在浏览器中执行，旨在防止每次发生变化时向服务器发送请求。


    第一个主要是提供了哪些组件（项目）以及有哪些选项可以自定义为你感兴趣的样式。这关于`样式表`和 `HTML5`。这两者与 `Java` 无关，但是 Web
    开发者必须掌握的主题。然后是视觉部分，这比任何其他都更关于良好的用户界面以及如何设计 Web 用户界面的问题。遗憾的是，我对什么是良好的用户界面了解有限，所以我只需要介绍这项技术。


    另一个主要是关于 `JavaScript`，它是作为脚本（文本）随服务器响应发送的程序代码，并在浏览器中执行无需向服务器发送请求。脚本代码意味着它只是文本而非二进制代码，这就是为什么它通常被认为是无害的且不包含恶意代码，但也因为通过
    `JavaScript` 能做的事情是有限的。`JavaScript` 受关注的原因之一是器的 `JavaScript` 解释器已经过优化，为什么 `JavaScript`
    现在是有效的，但也因为该语言已经演进，现在你可以编写易于维护的高级 `JavaScript`。尽管名字如此，`JavaScript` 并不是 `Java`，必须明确它是一种简单的脚本语言，但语法与
    `Java` 相同——因此得名。`JavaScript` 将占据书中的一部分。


    '
- fmt: '

    I will also mention Java applets, that are program code, which are performed by
    the browser, but this is common binary Java code downloaded from the server, and
    the browser can then use a plugin to execute the code. One should note that you
    have the full Java available and that an applet can, in principle, perform all
    that is possible with a Java application. For that reason, many people are not
    excited about Java applets, as applets has a major security risk, and there are
    also examples that the fear is justified. Java applets are currently used to a
    limited extent and are not dealt with further in this book.


    The book will also contain topics that relate to the server, and in particular
    I will look at Ajax in connection with facelets, but the book also deals with
    other topics related to JavaFaces.


    # 2 HTML


    In the book Java 11, I have said that I do not want to treat HTML, and the following
    is also just an ultra short presentation that merely highlights the most important
    HTML concepts, but as the browser basically receives HTML, it’s useful with a
    short introduction to the subject. This is especially true after the use of HTML5,
    as this standard adds some subjects and princips, and the standard is gradually
    supported by most browsers.


    HTML is very closely linked to cascading style sheets, also known as CSS, and
    the goal is that HTML using markup should structure data while CSS defines how
    the individual elements should be displayed in the browser. Styling of HTML elements
    should occur in its own document, calling a `Cascading Style Sheet`, while the
    HTML document alone must take care of structuring the data. That way, web pages
    are much easier to maintain.


    A HTML document has the basic form:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_10.jpg)


    but many development tools add their own elements to the header. HTML define more
    structural elements where the most important are:


    * `section`, that represents a section in a document, and it can together with
    `h1`–h6` elements be used to indicate the document’s structure, and a section
    must start with a `h` element

    * `article`, that represents an independent piece of content in a document and
    as the name says an article, and an article must start with a `h` element

    * `aside`, that represents a content that is only slightly related to the rest
    of the page

    * `header`, that represents a header section

    * `footer`, that represents a footer section and will often contain information
    about the author, copyright information and so on

    * `nav`, that represents a section in the document intended for navigation (links)

    * `dialog`, that is used to mark up a conversation

    * `figure`, that can be used to associate a caption together with some embedded
    content, such as a graphic or a video


    It is not a requirement that a HTML document uses these elements (which are introduced
    in HTML5), but it is recommended, among other things, that they can be styled
    in a style sheet. Similarly, the following structure is recommended for an HTML
    document, where there may be more sections and where some elements can be omitted
    completely:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_11.jpg)


    There are many other HTML elements, and there are many new elements in HTML5,
    but I do not want to mention the elements here. General is the form of a HTML
    element


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_12.jpg)


    where there may be a number of attributes. If there is no content, it is allowed
    to write:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_121.jpg)


    even though it is not actually intended to use this notation in HTML5. A very
    specific example could be:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_122.jpg)


    where there is one attribute that refers to a class in a style sheet. As a starting
    point for this chapter, I have created a web application called `HTMLApplication`,
    which for the moment only has a single page `index.html`. I do not want to display
    the content here as the page fills a lot, and the page should show only how the
    above structure elements are used to structure the content of a HTML document.
    When you test the document, note that the structural elements have no visual effect.
    They are used solely to structure the text, and the visual effects are solely
    intended to header elements (`h1`–h6) as well as a list of links. In any case,
    the visual effect is what is default.


    It should also be mentioned that it is allowed to define custom attributes and,
    if necessary, they should start with the word `data-` and the application is that
    they can be referenced from `JavaScript`, but also from a style sheet.


    ## 2.1 HTML forms


    In the book Java 11, I have shown the use of HTML forms, and it is generally not
    associated with the big challenges, but HTML actually defines a lot more about
    forms. Consider the following document that is part of the `HTMLApplication` project:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_13.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_14.jpg)


    The basic form element is `input`, and you specifies with a `type` how to render
    the element on the screen. The default is `text`, which means you can enter a
    single line. Note (the first input) that you can specify `required` and that with
    `placeholder` you can specify a hint for the text to be entered. The last ones
    `number` and `range` types that indicate you can enter an `email` address and
    a `URL`, respectively.


    ![](image/Image15055.jpg)


    ## 2.2 Scalable Vector Graphics


    In HTML5, it is also possible to work with geometric shapes like circles and rectangles.
    Consider the following page:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_15.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_16.jpg)


    Opening the page in the browser gives you the result:


    ![](image/Image15062.jpg)


    The code is easy enough to understand and you are encouraged to investigate what
    else is available.


    ## Problem 1


    The directory for this book contains a document `java12`, that is a text document
    with the text for the two chapters in this book, where the text is saved as plan
    text without formatting. The directory also has two png-files called `screen1.png`
    and `screen2.png`. The files are the screen dumps in this chapter. The task is
    to create a web application with a HTML document, that shows the content of the
    file `java12` and the two images. The page should only structure the text (display
    the content), you should not format the text. This is the subject of a later problem.


    # 3 Cascading style sheets


    After the above about HTML, I’m ready for a short introduction on style sheets,
    and I will take as the starting point the same program as in the previous chapter.
    I have added a new HTML document to the project and called it `styleddoc.html`.
    The content is the same as `index.html` and the goal is to show how the document’s
    visual presentation can be changed using a style sheet. Initially I have created
    a directory `resources` and including a subdirectory `css` and added a style sheet
    named `styles.css`:


    ![](image/Image15071.jpg)


