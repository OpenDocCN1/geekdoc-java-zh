    It is allowed to declare a function multiple times in the same scope, which simply
    means that the function name is given a different value. It can also give unexpected
    results. For example, if you consider the following code:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_832.jpg)


    it will alert 29. The reason is that JavaScript collects all definitions at the
    start of a scope and the above is thus equivalent to:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_833.jpg)


    In JavaScript, you can also define a function as an expression:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_84.jpg)


    The Variable `show` refers to an anonymous function, and the use of anonymous
    functions is widely used in JavaScript. Consider the following example:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_841.jpg)


    The function has two parameters, the latter being interpreted as a function that
    will validate the first parameter. The function could, for example, be used as
    follows:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_85.jpg)


    where the function should validate if the first argument is a 3-digit number.
    The validation function is sent as an anonymous function.


    When a function is performed, it occurs in a given context, and the function has
    access to variables, objects, and other functions in this context through its
    scope. Internally, this context is referenced by the `this` pointer, which is
    indirectly transferred to the function when it is called. In this context, it
    is necessary to distinguish between a function and a method where a method is
    a function defined as a property in an object. If you perform a usual function,
    its context will be the window object, while the context of a method is the parent
    object. It can be illustrated by the following code, where `m` is a method in
    the object `obj`, while `f()` is a global function with an inner function `g()`.


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_851.jpg)


    If you execute the code, it will display true in an `alert()` three times. First,
    the method `m()` is executed and its context is the object `obj`. Next, `f()`
    is executed and it starts performing the internal function `g()` whose context
    is the window object in the same way as the external function `f()`.


    The most frequent use of `this` is in connection with methods and constructor
    functions. If you have a function and type `new` in front of the function, it
    means creating an empty object, and this will then refer to the context for this
    object. As an example, below is shown a constructor function that creates a point:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_86.jpg)


    The following code uses the function to create two objects, and you should note
    in particular that the objects do not inherit each other and each have there own
    variables on which they work on:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_861.jpg)![](image/Image16095.jpg)


    Also note that the above recalls the class concept from an object-oriented programming
    language, but it has nothing to do with classes – JavaScript has only objects.


    Usually, a function is performed by specifying parentheses after the function
    name, if any, the actual parameters are written between parentheses. The parentheses
    `()` are in this context called for the `function invokes operator`. However,
    there is an alternative to calling a function. You can use `apply()` or `call()`,
    where you can specify the context in which the function should work within. Consider
    the following code:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_87.jpg)


    It will show with an alert 100, 1000 and 10000 respectively. At the top is defined
    a variable called `scale` that has the value 10. Next, two objects are defined
    which each have a property called `scale` and their values are 100 and 1000 respectively.
    These objects each define their context (scope). The function `sum()` has three
    parameters and returns the sum of these parameters after multiplying the sum with
    the value of a variable `scale` from the current context. The first alert shows
    the value of this function by calling it in the normal way, and since it is a
    global function, its context will be the window object, and that is why the global
    `scale` variable is used. The next `alert()` performs the function again, but
    this time using `apply()`. The first parameter is the context in which the function
    should work, and here it is `obj1`. That is that `scale` this time is the property
    `scale` from `obj1`.


    #### Control Statements


    As the last section I want to show the control statements, and here is not much
    to explain. Secondly, I have already used the control statements several times,
    and basically, they are the same as Java.


    Regarding conditions, JavaScript has an `if` statement, which has the same syntax
    as Java, and here is the condition, which should be an expression that evaluates
    a boolean, the only difference is rules described above.


    JavaScript also has a `switch` statement that works as in Java. The same goes
    for `while` and `do` loops. The most commonly used loop is as in Java the `for`
    loop, and the classic `for` loop works exactly the same:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_88.jpg)


    In Java, you also have a `foreach` loop, which is actually an iterator. There
    is a corresponding variant of a `for` loop in JavaScript, sometimes called `for-in`.
    It can be used to iterate all properties in an object. Below is an object with
    4 properties and the following loop determines the sums of these properties with
    an `for-in` loop:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_89.jpg)


    ## 4.3 Global objects and functions


    JavaScript is born with several global objects and some global functions that
    are immediately available and in terms of methods offers a variety of services.
    The global objects are


    1.  `Array`

    2.  `Boolean`

    3.  `Date`

    4.  `Math`

    5.  `Number`

    6.  `RegExp`

    7.  `String`


    I do not want to review these objects and their methods here, but the names tell
    you a bit about what you can do with them and you are encouraged to investigate
    the properties of the objects. Finally, there are the following global functions,
    whose behavior you are also encouraged to investigate:


    1.  `eval()`

    2.  `isFinite()`

    3.  `isNaN()`

    4.  `parseFloat()`

    5.  `parseInt()`


