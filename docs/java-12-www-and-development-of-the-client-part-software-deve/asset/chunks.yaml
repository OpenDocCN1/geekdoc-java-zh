    As next, I want to show how you with an submit can send all fields to the server,
    but without reloading the page. The benefits are not so big, but it gives a quieter
    window, as it all happens asynchronously, and the user thus, to a lesser extent,
    notes that data being sent to the server, and since the entire document do not
    has be rendered again. I will use the same example as above, and I have started
    with a copy that I have called `ChangeAddress2`. In `index.xhtml`, I’ve changed
    in two places. The `Submit` button now has an ajax function:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1151.jpg)


    and you should note that the function is triggered by an action event that the
    function should relate to all form fields and that all fields must be rendered.
    In addition, the last link must be changed to a `h:commandLink`:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_116.jpg)


    and here you should especially note the last attribute that is required because
    the command should not validate the form fields.


    Finally, the link on the page `list.xhtml` is changed to a `commandLink` (what
    it should have been all the time).


    In this case, all form fields are sent to the server by a submit, and it is all
    form fields that are updated after the ajax function is completed. It is not always
    you are interested in that, and in fact there could be only a few fields. In this
    case, I assume the date field should always be today, and in `index.xhtml` I have
    defined the component `readonly`:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1161.jpg)


    You should note that there is no longer any ajax function associated with the
    component, and I have also changed the text in the corresponding label.


    In order to initialize the field `date` I have in the class `Person` changed the
    constructor so it initializes the `date` field to the current date:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1162.jpg)


    Finally, the ajax function of the submit button in `index.xhtml` is changed:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1163.jpg)


    That is, I have now explicitly specified which form fields are to be sent to the
    server, and which form fields must be rendered after the function has been completed.


    In this case, the advantage is of course limited, but in other contexts it may
    matter, and remember that the whole idea of ajax is only to update that part of
    a page that is necessary.


    I will make another change of the application, and I have started creating a copy
    that I have called `ChangeAddress3`. In `index.xhtml` the fields are validated
    with each their ajax function. You can actually achieve the same by encapsulating
    the fields to be validated in a `f:ajax` element:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_117.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_118.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_119.jpg)


    The validation takes place in the same way, but the writing method is all the
    more straightforward. Note that it is necessary to specify the fields (for error
    messages) to be rendered. However, there is one difference since validation occurs
    every time a lost focus event occurs and hence each time an input field is left.
    This means that it is only the error message regarding the relevant input component
    that appears – which may sometimes also be the most appropriate.


    ## 5.3 Converters


    In the following example I will show the use of converters where you can attach
    a converter to an input component. It has not directly to do with the ajax, but
    is often used in conjunction with ajax. The example is the same as above, and
    I have started with a copy of `ChangeAddress3`, which I have called `ChangeAddress4`.
    As an example of using converters, it must be such that the city name will automatically
    be converted to uppercase letters, while the email address will automatically
    be converted to lowercase letters. Such a converter can be written as follows:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1191.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_120.jpg)


    and is relatively trivial. There is a corresponding converter class named `LowerConverter`.
    As an example of using a slightly more interesting converter, the application
    has been changed so that you can edit the date field again, but I have preserved
    that the field is initialized with today. On the other hand, I want greater flexibility
    with regard to entering a date, so it should be allowed to use spaces instead
    of hyphens. To solve it, I have added the following converter to the program:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_120.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_121.jpg)


    Back there is the application, for example, shown bel the use of `DateConverter`:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_112.jpg)


    The other two convertes are used in the same way. Since the value entered in the
    field must be updated immediately after the entry, the `f:ajax` element must be
    updated:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_113.jpg)


    Looking at the input component `date`, it has both a validator and a converter,
    and here you should be aware of the order of when the methods are performed:


    1. `getAsObject()` // `DateConverter`

    2. `validate()` // `DateValidator`

    3. `getAsString()` // `DateConverter`


    ## 5.4 JSF Listeners


    JSF components can raise different events when rendered (where the names tells
    when the events occurs):


    - `preRenderComponent`

    - `postAddTo`

    - `preValidate`

    - `postValidate`


    You can define listeners for these events, which are Java code, which are performed
    on the server. As an example, I have created a copy of the project `ChangeAddress4`
    and called the copy `ChangeAddress5`. First of all, I have changed the code for
    `index.xhtml` so that, like in `ChangeAddress1`, it has an ajax function for each
    input component. As the next step, the `IndexController` is expanded with two
    methods:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_121.jpg)


    The class `Person` has a property `date` initialized with today, and the first
    method test where this date is for a weekend (Saturday or Sunday). If that is
    the case, the method returns the text `red` and otherwise the text `darkgreen`.
    The next method is a listener method. Its parameter is an event and the method
    determines a reference to the component to which the event relates. If the Person
    object’s `date` property is a date of a weekend, the component’s value is set
    to `Weekend` and otherwise to `Everyday`.


    The two methods are basically simple Java methods, and I will now show how they
    can be used as event handlers in `index.xhtml`. The form is expanded with a new
    element of the type `outputText` (the only requirement is that it is a component
    with a value property):


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_123.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_124.jpg)

