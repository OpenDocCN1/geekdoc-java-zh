    `padata` 有一个 `zipcode` 表，它是丹麦邮政编码的列表。你必须更改邮政编码字段的验证，使得只有当 `zipcode` 表中存在邮政编码时，邮政编码才是合法的。如果是这种情况，则将城市名称更新为相应的城市名称，否则城市名称为空。邮政编码字段的验证仍然必须使用
    ajax 完成。


