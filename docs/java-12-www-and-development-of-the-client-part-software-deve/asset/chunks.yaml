    ## 6.1 How to poll the server


    It is always the client (the browser) that addresses the server with a request
    when something is going to happen, and it is never the server that takes the initiative
    to contact the client. For example, if you want the user interface updated, the
    client must send a request to the server. You can automate this behavior using
    PrimeFaces what the following example will illustrate. The example is an extension
    of `ChangeAddress6` and is called `ChangeAddress7`, and the form `start.xhtml`
    has been changed so it displays the clock (see below). In principle, it is not
    the big challenges and is primarily a matter of expanding `IndexController` with
    the following property:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1361.jpg)![](image/Image16250.jpg)


    However, the clock is updated every second, which means that the client must send
    a request to the server every second to update the clock. It is said that the
    client should pole the server. This can be implemented using PrimeFaces as follows:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_137.jpg)


    You should note that the element `p:poll` automatically uses ajax, so it is only
    the current label that is being updated. To display the clock well, the style
    sheet is expanded with the following class:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_138.jpg)


    and again, you should note that conventional web technologies can be combined
    with PrimeFaces without difficulty. The opposite also applies to the use of a
    function such as `p:poll`.


    ## 6.2 A p:autocomplete


    As another application of PrimeFaces, I want to show so-called autocomplete. The
    application `ChangeAddress8` is another extension, and if you in the field for
    the name begin to enter you get a dropdown list:


    ![](image/Image6257.jpg)


    Specifically, the program has been modified so that if you are in the field for
    zip code and enter a zip code (only existing zip codes are legal), then the city
    name will be filled in automatically and the field for city name is updated. To
    solve the task I have first added the following class, which is a table of zip
    codes:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_139.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_140.jpg)


    The methods do not require any particular explanation, but a more dynamic solution
    would of course be to load the zip codes from a database. A validator class has
    also been added to zip codes, which do nothing but test if a zip code is found.
    As the class does not add anything, I will not display the code here. Next, the
    controller class is modified, where I have only shown the code that has changed:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1401.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_141.jpg)


    Note that `setCode()` has been changed so it now initializes the city name from
