    # 4 JavaScript


    I will then give an introduction to JavaScript, which is the preferred language
    for code on the client side. The language has essentially the same syntax as Java,
    but otherwise the two languages do not have anything in common, and JavaScript
    is even a language that is very different from Java, but if you want to work professional
    as a web developer, you has to know JavaScript. Therefore, this chapter.


    JavaScript is an interpreted programming language, and the source code are as
    Java just text, but unlike Java, the code is not translated, but is sent as text
    to the browser, which has a built-in interpreter that interprets the JavaScript
    code. It is a real interpreter who interprets the code statement for statement
    and execute each statement before the next is interpreted and performed. To show
    what JavaScript is, I want to start with a very simple example, called `LoadingDocument`.
    There is only one file `index.html` whose content is:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_31.jpg)


    In the `head` section there is a `script` element and it is an element that can
    contain `JavaScript` code. In this case, a variable and a function are defined.
    The variable is called `hello`, and it is initialized with the text `“Hello”`.
    In principle, JavaScript uses variables as other programming languages, including
    Java, but you should primarily note that the variable has no type. The script
    block also has a function that basically works as a method in Java and can be
    executed by calling it. In this case the function is called `show()` and it has
    two statements. The first is an `alert()` which opens a simple popup that shows
    the value of the variable `hello`. The next statement changes the value of the
    variable, and here you should notice that the syntax is, as you know it from Java.
    If the application is opend in the browser, it will render the `body` of the document
    from start to finish, starting with the following window where the `h1` element
    is rendered (see below). After the `h1` element is rendered there is a new script
    element


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_32.jpg)![](image/Image15118.jpg)


    which calls the JavaScript function `show()`, that means that the browser stops
    and opens a popup:


    ![](image/Image15126.jpg)


    The browser will continue to render the document when clicking `OK`, and the browser
    will then render the `h2` element:


    ![](image/Image15133.jpg)


    Then immediately a script element follows, which this time just performs an `alert()`
    which in a popup shows the value of the variable `hello`:


    ![](image/Image15143.jpg)


    Here you should note that the variable has been changed in the `show()` function.
    After the above popup is displayed, the browser resumes until clicked on `OK`,
    after which the browser renders the `h3` element, and only then the:


    The above example shows a bit about what JavaScript is and how to add JavaScript
    to an HTML document, but not what JavaScript can be used for what is the goal
    of the following. First, however, I would like to see a little more on the syntax
    of the language.


    ## 4.1 Nature of Languages


    When you start with JavaScript and come from other languages such as Java, there
    are primarily three things that may seem very different:


    * Variables scope

    * Types

    * Objects and inheritance


    and it’s actually the three things that make programming in JavaScript much different
    than, for example, Java programming. JavaScript is a *type-weak* language, where
    variables should not be declared by a particular type. It is not the same as that
    the language is typeless, but it means that a variable can change type and that
    the current type is determined by the value of the variable and how it is used.
    There are a number of rules for the language’s type compatibility, rules that
    are quite complex and some of the things that I will explain below. JavaScript
    is not object-oriented in classical sense, but conversely, objects play a major
    role in the language. However, compared to Java, for example, there is a very
    big difference in how to create and inherit objects. Perhaps the biggest difference
    between JavaScript and other languages are functions, since functions are actually
    objects that may have properties and methods.

