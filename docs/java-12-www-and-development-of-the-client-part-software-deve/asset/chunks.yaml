    ### 事件


    DOM 准确通过事件（events）定义了如何与单个元素进行交互。大多数事件与鼠标有关，对于特定事件，你可以为文档中的元素关联一个事件处理器（event handler）。当用户与元素交互时，浏览器会检查该元素是否已注册了事件处理器，如果是，则会执行该处理器。元素位于文档的层级结构中，事件将通过所有父元素的树结构向上冒泡，并且对于所有注册了该事件处理处理器的父元素，该处理器都将被执行。当事件到达顶部——即
    `body` 元素时——事件将沿着相同的路径返回，直到返回到最初触发事件的元素。这两个阶段分别称为`冒泡阶段`（bubbling phase）和`捕获阶段`（capturing
    phase），你可以指定你希望处理事件的阶段。


    当执行事件处理器时，它的执行方式与在上下文中任何其他 JavaScript 函数相同，DOM 定义该上下文为该特定处理器相关的元素上下文。因此，你可以通过
    `this` 引用引用事件所涉及的元素。


    DOM 定义了以下事件：


    *   鼠标事件：`click`, `mousedown`, `mouseup`, `mousemove`, `mouseover`, `mouseout`
    等

    *   键盘事件：`keypress`, `keydown`, `keyup`

    *   对象事件：`load`, `error`, `scroll`

    *   表单事件：`select`, `change`, `submit`, `reset`, `focus`

    *   用户交互事件：`focusin`, `focusout`


    例如，请考虑一个具有以下内容的页面：


    ![](img/Image16156.jpg)


    这里的上部文本是一个 `div` 元素，而底部的三个是段落。代码如下：


    ```

    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_101.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_102.jpg)

    ```


    在头部中定义了两个简单的事件处理器。你应该注意 `this` 引用的使用，它将引用触发事件的元素。HTML 代码不需要解释，但随后的脚本块为 HTML 元素分配了事件处理器。首先是对这三个段落的引用，然后为每个段落分配了两个
    `click` 事件的事件处理器。一个是用于冒泡阶段的处理器（为 `false`），另一个是用于捕获阶段的处理器（为 `true`）。你应该注意如何将事件处理器与方法
    `addEventListener()` 关联。结果是，点击三个段落中的一个将导致弹出一个警告框（alert），显示哪些事件被触发了。脚本块中的最后一个语句为第一个
    `div` 元素分配了事件处理器。在这里你应该注意如何找到该项以及如何将事件处理器设置为匿名函数。


    还有一个名为 `removeEventListener()` 的方法，它的参数与 `addEventListener()` 相同。该函数用于从元素中移除事件处理器。


    当执行事件处理器时，一个事件对象会被传递给处理器。请考虑以下代码作为示例：


    ```

    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_103.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_104.jpg)

    ```


    如果代码出现在浏览器中，结果将是：


