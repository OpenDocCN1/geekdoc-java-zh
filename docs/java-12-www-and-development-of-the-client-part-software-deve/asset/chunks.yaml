    本节的目的是阐述这些众多概念中的一些，无需涉及所有细节，但要达到你可以将 JavaScript 结合 Web 应用程序开发的程度。当浏览器解析 HTML 文档时，它会构建一个由文档元素组成的树。这棵树被称为
    DOM（文档对象模型），JavaScript 的作用正是准确地修改这棵树。


    ### DOM 树


    JavaScript 可以放置在文档的任何位置，但当文档加载时，浏览器会解析文档并构建 DOM 树。如果浏览器遇到任何 JavaScript，它将执行它，因此，只有当脚本引用的元素已经是
    DOM 树的一部分时，它才可能生效。考虑以下示例：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_35.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_36.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_37.jpg)


    该示例展示了当浏览器加载带有 JavaScript 的文档时会发生什么，以及如何引用 DOM 层次结构中的项目。首先注意到在头部中定义了一个样式表。此外，还定义了一个脚本元素，该脚本元素定义了一个名为
    `print()` 的单个 JavaScript 函数。该函数将名称作为段落打印，这意味着该函数在调用它的地方插入一个段落元素。浏览器不会在此处执行该函数，它只是一个函数的定义。`body`
    部分以 `h1` 元素和两个段落开头，浏览器开始显示这些项目


    ![](img/Image15157.jpg)


    这并没有什么奥秘，但在浏览器解释了上述元素之后，会进入一个 `script` 部分，这里有一个 `alert()` 显示一段文本。这意味着（如上一个示例所示），浏览器会停止并等待用户点击
    `OK`。当发生这种情况时，浏览器继续处理文档，下一个元素是另一个显示第一个段落中文本的 `alert()`。你应该注意如何引用具有特定 ID 的元素，以及如何使用
    `innerText` 引用元素的文本。`alert()` 显示整个文本，包括 `span` 元素中的文本，但最后部分不是粗体，因为 JavaScript
    不解释 HTML。当你点击 `OK` 时，浏览器继续解释并执行 JavaScript 语句。这里 `pars` 是一个包含所有 `p` 元素的数组——此时有
    2 个——随后的循环将它们的 `class` 设置为 `redStyle`，之后文本变为红色——包括 2 个 `span` 元素中的文本。一旦发生这种情况，就会执行一个新的
    `alert()`，它显示数组 `pars` 的长度，其主要目的是让解析器停止，以便你就可以看到两个段落中的所有文本都是红色的：


    ![](img/Image15165.jpg)


    当你点击 `OK` 时，浏览器继续执行 JavaScript。`spans` 同样是一个包含所有 `span` 元素的数组（有 2 个），接下来的循环将文本设置为绿色。


    脚本的最后部分开始确定一个数组 `classes`，它包含所有类名为 `boldStyle` 的元素。接下来，将这些元素的字体设置为斜体，结果是浏览器显示如下内容：


    ![](img/Image15172.jpg)


    三个丹麦国王的名字是简单的 HTML 段落，它们有助于展示浏览器在第一个脚本块完成后，首先将这些元素插入 DOM 树中。接着是另一个脚本块。在这里，`nodes`
    是一个包含 `div` 元素所有子节点的数组。有 7 个子节点并不是你预期的那样，其原因是各个段落之间的纯文本也算作一个节点。接下来，创建了一个引用 `div`
    元素的变量 `parent`。随后的循环从第一个节点开始迭代遍历 `parent` 的所有子节点。循环跳过空白文本元素，并打印段落元素的文本。请注意，当遇到
    `lastChild` 时，循环会通过 `break` 停止。


    有几点是你应该的。JavaScript 使用点符号表示（dot notation）来引用对象的属性和方法——就像在 Java 中为人知的那样。此外，请注意
    `alert()` 会停止浏览器对文档的解析，因此 `alert()` 可能是调试 JavaScript 的有用工具。


    ### JavaScript 中的对象


    JavaScript 是一门面向对象的语言，但没有类似于类（class）的东西，构建新对象的唯一方法是通过原型（prototyping），这是复制现有对象的一种形式。通过这种方式，创建了一个新对象，人们最好将其视为另一个对象的拷贝。更精确一点，JavaScript
    中的任何对象都有一个名为 `prototype` 的属性，该属性引用所有从父对象继承的属性（属性和方法）。这意味着如果你尝试引用一个对象的属性或方法，解释器将首先检查该属性是否定义在目标对象上。如果不是如此，将检查
    `prototype` 所引用的对象，并在层次结构中找到该属性，直到到达一个定义了该属性的对象，或者解释器可以得出该对象是 `undefined`。属性和方法可以被重写，任何重写都会影响定义重写的对象以及继承层次结构下游的对象。最好将这种形式的继承视为一个简单的列表，其中
    `prototype` 引用元素。这种继承形式的重要结果是，对象的属性会影响层次结构中的所有对象。


    下面的示例应该说明这些概念中的一些，特别是创建对象的语法：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_41.jpg)


    文档的头部有一个脚本块，创建了三个对象。第一个是 `obj0`，它具有值为 23 和 29 的两个属性。接下来创建了两个对象 `obj1` 和 `obj2`，它们都是
    `obj0` 的扩展，但此时这三个对象具有相同的属性。


    `body` 部分开始渲染 `h1` 元素，但其余部分是一个脚本块。接下来，使用 `alert()` 显示 `obj0` 属性 `a` 的值，结果是一个显示值为
    13 的弹出窗口。接下来，将 `a` 修改为 19，然后显示 `obj1` 和 `obj2` 的 `a` 值，在两种情况下都是 19，这对应于 `obj1`
    和 `obj2` 继承了 `obj0` 的值。作为下一步，为 `obj1` 分配了一个值为 41 的属性 `c`。在这里你应该注意，你可以立即为对象创建属性并赋值，而该属性对于父对象是不可知的。因此，接下来的三个
    `alert()` 语句将显示 `undefined`、41 和 41，因为 `c` 在 `obj0` 中不可知，但在 `obj1` 和 `obj2` 中已知（`obj2`
    继承自 `obj1`）。


