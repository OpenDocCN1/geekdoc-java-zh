    # 5 JavaServer Faces and Ajax


    In this book, I have alone looked at the client side, including how to define
    a layout of a page using styles, and how to use JavaScript to modify the individual
    elements of the DOM tree. It takes place in the browser and without the server’s
    involvement. In this chapter, I will again look at the server side where the code
    is executed on the basis of a request from the browser and where the server then
    answers back with a response, which means that the browser should render the document
    again. With the help of JavaScript, it is possible to execute that form of request/response
    in such a way that the user does not observes the page being updated and that
    the application essentially behave in the same way as a standard desktop application.
    This technique is called `Ajax`.


    Ajax is a family of technologies that enable JavaScript to perform tasks asynchronously
    when the browser sends requests to the server in the background, which then sends
    responces back to the client that can be used to update the DOM tree. The technology
    is widely used in all modern web applications.


    You can basically associate ajax facilities with a JSF input component with the
    element `f:ajax`, which means an interaction between client and server, based
    on a particular event, an interaction performed asynchronously and parallel with
    the user using the application. A number of attributes are attached to a `f:ajax`
    element, where all if not specified has a default value:


    *   `delay`, which is a value specified in milliseconds and indicates the maximum
    size of a delay between request and response (`none` disables this feature).

    *   `disabled`, which is a `boolean` indicating that the function is disabled
    (`false` is default).

    *   `event`, which specifies the event for the component that triggers the ajax
    request.

    *   `execute`, that specifies a list of components to be performed on the server.

    *   `immediate`, which is a `boolean` that indicates that the input value should
    be processed immediately.

    *   `listener`, which specifies the name of a listener method to be performed.

    *   `onevent`, that specifies the name of a JavaScript function to be performed.

    *   `onerror`, which specifies the name of a JavaScript function for error handling.

    *   `render`, which is a list of components to be rendered after the ajax function.


    For the `execute` and `render` attributes, the following terms are available for
    specifying components:


    *   `@all`, that means all components

    *   `@form`, that means all components in the form, that contains the component
    for the ajax function

    *   `@none`, that means none components and is default for `render`

    *   `@this`, that means the ajax functions parent component

    *   The components ID separated by spaces

    *   A JSF expression


    To illustrate how ajax works, I want to show a number of examples that extend
    an existing application with ajax functions, and it will be based on the application
    `ChangeAddress3` from the book Java 11.


    ## 5.1 Valdation of fields


    I have started with a copy of the project `ChangeAddress3` from Java 11, and I
    have called the copy for `ChangeAddress1`. If you open the application in the
    browser, you get the following window:


    ![](image/Image16207.jpg)


    where a user can enter an address and other information. Clicking the `Send` button
    sends this information to the server where they are stored. If you want to see
    the content of the list, you can click on the bottom link. When data is sent to
    the server, they are first validated and if there are errors, the server responds
    with an messages.


    It works fine, but it would be more appropriate to validate each field immediately
    after the text is entered. As it is the server that validates the fields, a request
    must be made to the server for each field, and ajax can help, such that it happens
    completely transparent to the user. In fact, it is extremely simple and consists
    of changing the `index.xhtml` document as shown below:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_113.jpg)[](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_114.jpg)


    For example, if you consider the first field for entering a first name, you must
    specify which validator to perform and then the element:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_115.jpg)


