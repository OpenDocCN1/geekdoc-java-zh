    Then there is the package `websheet.beans` containing 6 classes, and here is the
    class `MainController`, the most important, which is a named bean used by the
    two `xhtml` pages. Two of the classes are `DateValidator` and `DateConverter`,
    which are used in `open.xhtml` to validate a date and convert a date (a `Calendar`
    object) to a string, respectively, and does not contain anything new to what is
    mentioned in the previous book. Then there are three classes `TableHeader`, `TableRow`
    and `TableCell`, which are used to construct the HTML table. The classes are really
    redundant (at least the task could be solved without), but they are included for
    any extensions of the program, where these classes could be expanded with new
    properties.


    Then there is the class `MainController`, which is a relatively comprehensive
    class. In principle, it is simple and the most important thing is that it has
    actions for the first four functions in the toolbar, which are the only functions
    that call the server side. The class is used as controller for both `index.xhtml`
    and `open.xhtml`, and you should consider whether the class should be divided
    into two, so each `xhtml` document had its own controller.


    The rest of the code is client code, primarily as JavaScript and style sheets.
    Regarding the latter, there are 4 style sheets, the two being part of jQuery and
    are not modified. The other two are relatively simple and are used by `index.xhtml`
    (`styles.css`) and `open.xhtml` (`dialogs.css`) respectively. There are 8 JavaScript
    files, but only the 3 are written for this project. The four belongs to jQuery,
    while the fifth is a standard parser for JSON.


    The application largely uses jQuery and in addition to the ability to easily select
    elements in the DOM tree, jQuery are used for the following:


    * to select cells in the table using the mouse, for example, by dragging the mouse

    * to open a dialog, either as a simple message box or where the user can enter
    data

    * to a context menu that opens if the user right-clicking on either a row or column
    header

    * to open a simple color selector where the user can choose a color for either
    text or background


    It requires that several files relating to jQuery are downloaded and added to
    the project. It should be noted that jQuery offers far more than what is used
    in this example.


    For the sake of the current project, 3 JavaScript files have been added:


    1. `Expressions.js`

    2. `Websheet.js`

    3. `ColorSelector.js`


    The first contains a single module `expression`, which includes all the functions
    necessary for formulas. In the book Java 3, in the final example, I have shown
    a class that has methods that can parse and evaluate a mathematical expression.
    The module `expression` is primarily a converting of this class to JavaScript,
    but with two changes:


    1. `expression` supports only two mathematical functions, namely the square root
    function and a sum function. However, also the power function is supported by
    implementing the operator `^`.

    2. Instead of common variables, an expression works on cell references, which
    means that the parser must be changed a bit.


    For the `sum` function, it may sum up a number of values (constants or cell references),
    which are indicated as a comma separated list. You can also specify two cell references
    in the same row or column and separated by semicolon, and the function summarizes
    all values between these references.


    The implementation of expressions (formulas) is thus relatively simple as one
    can directly apply the algorithms from Java 3. However, the challenges relate
    to three situations:


    1. When inserting rows or columns, expression’s references to cells may change.
    For example, if you insert a row, all references in expressions that are larger
    than the index for the new row are counted by 1. The same applies to columns.

    2. By copying/pasting formulas, the formula’s cell references must be changed
    in relation to how far a formula is moved.

    3. Formulas can refer to other formulas via cell references, and thus there is
    the possibility of circular references. This problem is partially solved by the
    fact that after each entry of a formula, the program checks whether the formula
    results in a circular reference.


    Some of the module’s methods are used to handle these situations.


    Several of the methods may raise an exception and, if it happens, the exception
    action is an `alert()`. For a finished application, of course, it makes no sense,
    but I have maintained them, as they may be useful if others want to work on the
    project. In fact, it is relatively difficult to troubleshoot JavaScript code,
    and one of the difficulties with JavaScript is that there are very many posibilities
    for errors, and it is difficult to test the code for errors. In an operational
    situation, you could therefore replace the relevant alert’s with a request to
    the server and, using ajax, send the appropriate error messages to the server
    that could save them in a log file or a database table. This allows you to check
    on a regular basis whether the code results in errors, what has caused the error,
    that can make the maintenance of the program considerably easier.


    Then there is the JavaScript file `websheet.js`, which contains all the script
    that will be used to handle the user interaction. The file is extensive and consists
    of three modules:


    1. `datadefs`, which is the data presentation of the current spreadsheet

    2. `sheet`, containing all methods to manipulate the spreadsheet and then all
    functions used from the toolbar

    3. `handlers`, that contain event handlers to edit the content of cells


    The first I mentioned during the design and the last one is relatively simple.
    In order to edit the content of a cell, a cell in the table contains two components,
    one being a `div` element with a `span` element, which generally shows the text.
    It is the content of this element that is formatted according to the selected
    formats. The other element is an input component that is generally invisible.
    Holding down the CTRL and SHIFT keys and clicking the mouse will change the visibility
    of these components, and you can edit the content. When you click again or enter
    `Tab` or `Enter` switches on visibility again and the user interface is updated.
    The latter is not quite simple. First, it may mean that formulas elsewhere in
    the spreadsheet must be updated if they depend on the cell that has changed. Secondly,
    in case it is a formula that is entered, it must be validated that it results
    in a circular reference. These are things that are handled by functions in the
    `handlers` module.


    There is also a function `initCells()` that is not part of the above modules.
    The task of the function is to associate the event handlers in the module `Handlers`
    to the table’s cells. This function is used when the window is initialized by
    the browser.


    An important part of the module `sheet` relates to formatting, in which you must
    be able to format cells, ensure that the formatting are saved and used again when
    a saved spreadsheet is loaded. In addition, formatting may be modified if you
    insert/delete rows and columns. You should be aware that formatting is not copied
    in connection with copy/paste.


    Another part concerns the toolbar’s buttons to open and save spreadsheets, where
    requests are sent to the server. In particular, be aware that a spreadsheet is
    saved, asynchronously, using ajax.


    Finally, there are the buttons to copy/paste, and especially the event handler
    for paste is not simple. The functions do not use the machine’s clipboard, but
    instead an internal array. The reason is to make it simple, but you should note
    that there is actually an API so that you from JavaScript can use the system clipboard.

