    The aim of this section is to illustrate some of these many concepts without having
    all the details, but to such an extent that you can use JavaScript in connection
    with web application development. When the browser parses a HTML document, it
    builds a tree consisting of the document’s elements. The tree is called DOM (for
    Document Object Model), and the purpose of JavaScript is accurately to modify
    this tree.


    ### The DOM tree


    JavaScript can be placed anywhere in the document, but when the document is loaded,
    the browser parses the document and builds the DOM tree. If the browser meets
    any JavaScript, it will also perform it, and therefore it may only work if the
    element that the script refers to is already part of the DOM tree. Consider the
    following example:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_35.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_36.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_37.jpg)


    The example should show what happens when the browser loads a document with JavaScript
    and how to refer to an item in the DOM hierarchy. Note first that a style sheet
    has been defined in the header. In addition, a script element has been defined
    that defines a single JavaScript function called `print()`. The function prints
    a name as a paragraph, which means that the function inserts a paragraph element
    in the place where the function is called. The browser will not perform the function
    at this location, it is only a definition of a function. The `body` part starts
    with a `h1` element and two paragraphs, and the browser starts displaying these
    items


    ![](image/Image15157.jpg)


    It’s not that much mystery in it, but after the browser has interpreted the above
    elements, a `script` part comes, and here an `alert()` that shows a text. This
    means, as shown in the previous example, that the browser stops and waits for
    the user to click on `OK`. When that happens, the browser continues to process
    the document and the next element is another `alert()` that shows the text in
    the first paragraph. You should note how to refer to an element with a specific
    ID and how to refer to the element’s text with `innerText`. The `alert()` shows
    the entire text, including the text in the `span` element, but the last part is
    not bold, as JavaScript does not interpret HTML. When you click `OK`, the browser
    continues to interpret and execute JavaScript statements. Here is `pars` an array
    of all `p` elements – at that time there are 2 – and the subsequent loop sets
    their `class` to `redStyle`, after which the text becomes red – also the text
    in the 2 `span` elements. Once that happens, a new `alert()` is performed, which
    shows the length of the array `pars`, and the primary purpose is to have the parser
    stop so that you can see that all the text in the two paragraphs is red:


    ![](image/Image15165.jpg)


    When you click `OK`, the browser continues to perform JavaScript. `spans` is similarly
    an array with all `span` elements (there are 2) and the following loop sets the
    text to green.


    The last part of the script starts by determining an array `classes` that contain
    all elements with the class `boldStyle`. Next, the font for these elements is
    italicized, and the result is that the browser shows the following:


    ![](image/Image15172.jpg)


    The three names of Danish kings are simple HTML paragraphs, and they help to show
    that the browser first inserts these elements into the DOM tree after the first
    script block is completed. Then follow another script block. Here, `nodes` are
    an array with all child nodes to a `div` element. There are 7 child nodes that
    were not what you would expect, but the reason is that the plain text between
    the individual paragraphs also counts as a node. Next, a variable `parent` is
    created that refers to the `div` element. The subsequent loop iterates over all
    child nodes to `parent` starting from the first node. The loop skips the blank
    text elements and prints the text for paragraph elements. Please note that the
    loop stops with a `break` when you get to `lastChild`.


    There are a few things that you should notice. JavaScript uses the dot notation
    to refer to objects’ properties and methods – just as it is known from Java. In
    addition, please note that an `alert()` stops the browser’s parsing of the document,
    and `alert()` may therefore be a useful tool for debugging JavaScript.


    ### Objects in JavaScript


    JavaScript is an object-oriented language, but there is nothing similar to a class,
    and the only method of constructing new objects is by prototyping, which is a
    form of copying an existing object. In this way, a new object is created, which
    one can best think of as a copy of another object. A bit more precisely, any object
    in JavaScript has a property called `prototype`, and this property refers to all
    properties (properties and methods) inherited from the parent object. This means
    that if you try to refer to a property or method of an object, the interpreter
    will first check if that property is defined for the object in question. If this
    is not the case, the object to which `prototype` refers is checked, and neither
    is the property found in the hierarchy until it reaches an object where the property
    is defined or the interpreter can conclude that the object is `undefined`. Properties
    and methods can be overridden, and any overrides will affect the object where
    the override is defined and down in the inheritance hierarchy. It is best to think
    of this form of inheritance as a simple list, where `prototype` refers to the
    parent element. An important consequence of this inheritance is that a change
    of property of an object is important for all objects down in the hierarchy.


    The following example should illustrate some of these concepts, and especially
    the syntax for how to create objects:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_41.jpg)


    In the document’s header is a `script` block that creates three objects. The first
    is `obj0` and has two properties with the values 23 and 29. Next, two objects
    `obj1` and `obj2` are created, both of which are extensions of `obj0`, but at
    that time the three objects have the same properties.


    The `body` part starts rendering an `h1` element, but otherwise the rest is a
    `script` block. Next, an `alert()` is used to show the value of the property `a`
    at `obj0` and the result is a popup that displays the value 13. Next, `a` is changed
    to 19 and then the value of `a` for `obj1` and `obj2` are shown, which in both
    cases is 19, corresponding to that `obj1` and `obj2` inherit the value from `obj0`.
    As a next step is assigned a property `c` to `obj1` with the value 41. Here you
    should note that you can immediately create a property for an object and assign
    it a value, and this property is not known from the parent object. Therefore,
    the three next `alert()` statements will show `undefined`, 41 and 41, since `c`
    is not known from `obj0`, but from `obj1` and `obj2` (`obj2` inherit `obj1`).


    `obj0` inherits an empty top object called `Object` and thus particular has a
    `toString()` method. Therefore, both `obj1` and `obj2` have a `toString()` method
    and the next statement overrides `toString()` for `obj0`. The two last `alert()`
    statements will show 89 (the sum of the three properties `a`, `b` and `c`, known
    from `obj1`) and `NaN`, since `toString()` can not perform the function from `obj0`,
    where `c` is not known.

