    # Appendix B: JSON


    JSON is a standard for data exchange primarily between client and server, but
    in principle, JSON can be used in many contexts, and in relation to data exchange,
    JSON can to some extent be seen as an alternative to XML. JSON is characterized
    by being easy to write and read (there are very few and simple rules), being text
    based and being platform independent.


    A JSON document has in principle the same syntax as an object in JavaScript, and
    an example could be:


