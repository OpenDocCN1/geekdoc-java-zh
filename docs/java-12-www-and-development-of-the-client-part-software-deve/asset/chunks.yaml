  raw: 'The examples in this chapter show a little bit about what is possible with
    PrimeFaces, but there is much more, and if you are developing web applications,
    it’s worth working to investigate what PrimeFaces offers. Here you should, among
    other things, be aware that you can download a documentation from the Internet
    as pdf:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1421.jpg)


    Also, be aware that there is a very good online documentation with examples:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1422.jpg)


    Finally, I would like to mention that there are other component libraries for
    JSF, which it is also worth to look on.


    # 8 WebSheet


    As the final example of this book, I will write a web application, which is a
    simple spreadsheet. The application is called *WebSheet*, and if you open it in
    the browser, you get the following window:


    ![](image/Image16265.jpg)


    A spreadsheet requires a high user interaction, where the user must be able to
    enter numbers and formulas in the individual cells, and in the case of a formula,
    the expression must be evaluated. The client has to do a lot, and the goal of
    the project is to show how it can be implemented in JavaScript, thus showing something
    about what is possible in JavaScript. To facilitate the work, I have used jQuery,
    which is a JavaScript library that provides a wide range of features available,
    including specially finished elements for the user interface such as dialog boxes,
    context menus, and more. If you do not know jQuery, you can read the book’s appendix
    A, which gives a brief introduction to jQuery.


    As mentioned above, the goal is to show how to use JavaScript to program the client
    side of a web application, but it is not a fully functional spreadsheet. Not that
    the program can not be used, but there is a lot that is missing or things that
    could be better.


    ## 8.1 The program’s functions


    To enter in a cell, first the cell must be opened that occurs as *CTRL + SHIFT*
    and click with the mouse. Then you can enter a number, a formula or a text. The
    entry is accepted either by pressing *Tab* or *Enter*.


    You can select one or more cells using the mouse and proceed in the usual way
    by holding down the left button and drag the mouse, and the CTRL and SHIFT keys
    have the usual  functionality.


    The program has a toolbar with 16 functions, as mentioned from the left has the
    following functions:


    1.  Create a new spreadsheet and enter the number of rows (default 50) and the
    number of columns (default 20).


    2.  Open an existing spreadsheet where you can search among the spreadsheets that
    have been created and saved.


    3.  Save the spreadsheet that you work – if it has been saved. Otherwise, the
    *Saveas* function is called.


    4.  Save the spreadsheet as a new spreadsheet, which means entering a name.


    5.  Sets the text in the selected cells to bold.


    6.  Sets the text in the selected cells to italic.


    7.  Sets the number of decimals for the selected cells.


    8.  Sets the text in the selected cells to left adjusted.


    9.  Sets the text in the selected cells to centered.


    10.  Sets the text in the selected cells to right adjusted.


    11.  Sets the text color for the selected cells.


    12.  Sets the background color for the selected cells.


    13.  Deletes all formatting for the selected cells or for the entire spreadsheet,
    if no cells are selected.


    14.  Copies the selected cells.


    15.  Deletes the contents of the selected cells and stores the content.


    16.  Inserts cells that are saved or deleted.


    In addition, right-clicking on a row header you get a context menu with four functions:


    1.  Select all cells in the row.


    2.  Insert an empty row above the current row.


    3.  Insert an empty row under the current row.


    4.  Remove the row.


    The same goes for columns:


    1.  Select all cells in the column.


    2.  Insert an empty column before the current column.


    3.  Insert an empty column after the current column.


    4.  Remove the column.


    ## 8.2 Design


    The content of a spreadsheet must be saved and that have to be done on the server
    side. The content must thus be sent to and from the server. To facilitate this
    transport, a spreadsheet is represented as a JSON object. If you do not know about
    JSON, read this book’s appendix B, which gives a brief presentation of JSON. A
    spreadsheet is represented as an object in the form:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_145.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_146.jpg)


    *values* is an array widt the spreadsheets data elements (one element for each
    data cell). That is, the array does not contain values for row and column headers.
    The array has one element for each row, where each element is an array with data
    elements of the form


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1461.jpg)


    Here *value* is the cell’s value, and *type* can be *n* for number, *s* for string
    and *e* for expression. As an example, the data presentation for a blank spreadsheet
    with 3 rows and 2 columns is shown below.


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1462.jpg)


    The object *options* is used for formatting, and *bold* and *italic* contains
    objects of the form


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_147.jpg)


    that defines a cell ind the table. *align* contains objects of the form:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1471.jpg)


    where the value of the last attribute is *left*, *center* or *right*. The two
    arrays *background* and *foreground* contains objects of the form


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1472.jpg)


    where the last attribute is a color value. Finally, the last array *decimals*
    contains objects of the form:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_148.jpg)


    where the last attribute is the number of decimals.


    A spreadsheet must be saved somewhere, and a database has been selected for this:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1481.jpg)


    It is a simple database with only one table. The names tells you what the individual
    columns are to be used for, but you should especially note the two columns *rows*
    and *cols*, which contains the number of rows and the number of columns respectively.
    Finally, note the last column *content* that is for the spreadsheet’s content.


    Below is an overview of the project’s files, and thus the overall architecture.
    There are two packages for Java classes, and there are two *xhtml* pages, so it
    is a very simple application. Most of the code however, is found under the *js*
    folder that contains the JavaScript files.


    ![](image/Image16272.jpg)


    ## 8.3 Programming


    I want to start with the server side and here the package *websheet.models*, which
    contains 7 classes. The user name and password for the database is as previously
    stored in *web.xml*, and three of the classes are the same as shown in other examples
    and are used to retrieve the user information and create a connection to the database.
    The most important class is the class *Repository*, which is a singleton that
    provides the necessary database operations available, and since the database is
    simple, this class is similar simple. The package also contains a class *Tools*
    with some static helper methods. Finally there are two model classes. The one
    is called *SheetName* and is a class that represents 4 columns from the database
    table (*id*, *name*, *created* and *modified*). The important thing is that it
    does not represent the content of a spreadsheet as it can fill a part. The class
    is used when searching for spreadsheets. The last model class is called *SheetMode*
    and is derived from *SheetName* and expands with the last three columns. The class
    is used to represent the worksheet you are working on.'
