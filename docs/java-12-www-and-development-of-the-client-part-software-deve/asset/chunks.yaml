    接下来是 `center` 区域，它包含了从 `ChangeAddress5` 项目复制的大部分代码。此外，该项目所有的 Java 类都被复制了，而且它们完全没有变化。如果你查看
    `start.xhtml` 中的 `center` 区域，你会发现本质上没有发生任何变化，只是所有的 `h:` 元素都改为 `p:` 元素，从而变为 PrimeFaces
    元素。然而，还有一些变化。`outputText` 作为 PrimeFaces 元素并不存在，这里该元素被更改为 `p:outputLabel`。早些，所有消息元素都有一个类，但现在已经将其移除，因为它不再起作用。`groupPanel`
    元素作为 PrimeFaces 元素也不存在，被一个 `p:outputLabel` 元素取代。然而，最重要的变化与 `p:commandButton` 元素有关。它默认使用
    ajax，但不识别 `action` 事件。相反，必须用 `actionListener` 属性来指定要执行的操作，以及应该更新用户界面的哪些部分，在这里是包含输入组件的面板。


    如果你看代码，你会发现 PrimeFaces 非常简单，生成的网页结果看起来很漂亮，但如果你想偏离 PrimeFaces 定义的内容，就没那么简单了。PrimeFaces
    基于样式表和许多内部样式，如果你想更改页面的外观和感受，其方法就是更改这些样式。你也可以用通常的方式定义样式（参见上述 `p:inputText` 元素的
    `width`），但并不总是容易预测效果，因为你无法立即看到单个 PrimeFaces 元素被转换成了什么。在这里，研究浏览器中的源代码可能会有所帮助。`p:panelGrid`
    默认设置一个没有单独单元格且没有整个组件边框的细边框，在这种情况下我想移除这个边框。此外，我想为错误消息使用较小的字体，因此我添加了以下样式表：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_133.jpg)


    在这里，要确定重写哪些类并不容易。此外，请注意样式表必须在 PrimeFaces 自己的样式表之后加载，其中一种方法如上面代码所示，在 body 部分的开始处执行。


    然后是页面 `list.xhtml`：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_134.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_135.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_136.jpg)


    再次，代码 `list.xhtml` 与 `ChangeAddress5` 类似，最大的区别在于除了 `start.xhtml` 之外，`p:layout`
    元素和大部分 `h:` 元素都被 `p:` 元素取代。这次布局扩展了一个 `east` 区域——仅仅是为了展示语法。在该区域内有一张图片（作为资源添加到应用程序中），它不仅是为了让那里有点东西，也为了强调你可以完美地结合
    PrimeFaces 和普通的 HTML。当你尝试该应用程序时，请注意表格是如何格式化的，这是使用 PrimeFaces 的重要原因之一：你通常不需要与样式表等内容斗争就能得到漂亮的结果。


    ## 6.1 如何轮询服务器


    当某些事情要发生时，总是客户端（浏览器）向服务器发送请求，而绝不是服务器主动联系客户端。例如，如果你想更新用户界面，客户端必须向服务器发送请求。你可以使用
    PrimeFaces 自动化这种行为，接下来的示例将说明这一点。示例是 `ChangeAddress6` 的扩展，名为 `ChangeAddress7`，表单
    `start.xhtml` 已经过更改，使其显示时钟（见下文）。原则上，这并不是什么大挑战，主要是在 `IndexController` 中扩展以下属性：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1361.jpg)![](img/Image16250.jpg)


    然而，时钟每秒更新一次，这意味着客户端每秒必须向服务器发送请求来更新时钟。据说客户端应该轮询服务器。可以使用 PrimeFaces 如下实现：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_137.jpg)


    你应该注意 `p:poll` 元素会自动使用 ajax，所以只有当前标签被更新。为了很好地显示时钟，样式表扩展了以下类：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_138.jpg)


    再次，你应该注意传统的网络技术可以毫不困难与 PrimeFaces 结合。相反的情况也适用于如 `p:poll` 等函数的使用。


    ## 6.2 一个 p:autocomplete


    作为 PrimeFaces 的另一个应用，我想展示所谓的自动补全。`ChangeAddress8` 是另一个扩展，当你在名称字段中开始输入时，你会得到下拉列表：


    ![](img/Image6257.jpg)


    具体来说，程序经过了修改，如果你在邮政编码字段中输入邮政编码（合法的），城市名称将自动填充，城市名称字段将更新。为了解决这个任务，我首先添加了以下类，它是邮政编码表：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_139.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_140.jpg)


    这些方法不需要特殊的解释，但更动态的解决方案当然是从数据库中加载邮政编码。邮政编码还添加了一个验证器类，它只检查是否存在邮政编码。由于该类没有添加任何内容，我将不显示代码。接下来，修改了控制器类，我只显示了更改的代码：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1401.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_141.jpg)


    注意 `getCode()` 已经更改，它现在从邮政编码表中初始化城市名称。`complete()` 方法是返回与名称字段中输入的文本匹配的城市列表的方法。最后是
    `select()` 方法，它是当列表中选择了城市名称时执行的事件处理器。


    回到 `start.xhtml`，其中邮政编码和城市名称字段发生了更改：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_142.jpg)


    关于输入邮政编码，没有太多新内容，但请注意附加了另一个验证器。注意它还定义了城市名称字段必须更新。重要的是输入城市名称时，该元素现在已更改为 `p:autoComplete`
    元素。当你看到语法时，很容易推断发生了什么，但请注意绑定返回列表数据的 `complete()` 方法的特殊方式，还要注意如何引用事件处理器。最后，注意输入邮政编码的字段必须更新。


    样式表也被扩展了。


