    ## 8.4 结论


    如所述，这个项目的目的是向大家展示 JavaScript 能够实现的一些功能，事实上，仅在客户端执行复杂的逻辑程序是完全可行的。JavaScript 实际上是一门相当复杂的编程语言，要学习的内容远超本书的涉及范围。然而，学习
    JavaScript 并不比学习其他编程语言困难，如果你需要大量使用 JavaScript，只需系统地学习即可，例如专门读一本关于 JavaScript 的书。但是，有一点需要注意，由于
    JavaScript 不通过编译器翻译，且不是强类型语言，代码包含错误的风险很高，更糟糕的是，发现错误既困难又耗时。因此，结论是：JavaScript 是一门成熟的编程语言，但远不是开发大型程序的有效语言。


    目前的项目并不是一个完整的电子表格，不能作为例如 `LibriOffice Calc` 的替代品——尝试开发这样的替代品也没有意义。然而，该项目可能有应用场景，如果你考虑一个需要类似电子表格页面的
    Web 应用，可以使用该项目或其部分。如果该项目需要扩展到看起来像一个真实的电子表格，目前还有一些缺失，我会提到一些可以显著改进程序的功能。事实上，每个功能本身就可以作为一个任务或项目。


    1. 数据输入应该改进，因为你并不总是需要点击鼠标打开单元格。这主要关于如何处理与键盘相关的事件（如方向键）。

    2. 程序应该应用系统剪贴板，以便将数据复制到其他程序中。这主要涉及到调用相应的 JavaScript API。

    3. 表达式模块应该扩展更多的数学函数。这实际上是一个相对简单的任务，算法可以在《Java 3》一书中找到。

    4. 然而，最大的缺失是性能，应用程序在大型电子表格上会变得低效。解决该问题的一个方案是在客户端仅显示电子表格的一部分，然后在工具栏中放置一些导航按钮。这种改进并不简单。


