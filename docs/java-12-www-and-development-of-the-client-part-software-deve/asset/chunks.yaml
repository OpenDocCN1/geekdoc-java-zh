    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_160.jpg)


    Note that the last two paragraph elements this time has a class *last*. If you
    consider the first select in the JavaScript function, it selects all elements
    and sets the font size to 24 points, but it is done using the function *css()*,
    which is a jQuery function that works on all elements that are selected. The same
    applies to the next three statements, which also use the function *css()* instead
    of writing the necessary loops. This is where you meet the strength of jQuery,
    and there are simply a large number of functions that you can read all about in
    the documentation mentioned above. In particular, note the last statement that
    sets the font to 36 points for all elements that either have id *viking* or class
    *last*.


    As another example (*JQueryExample5*), a document similar to the above is shown
    below, but where the example shows the use of multiple functions:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_161.jpg)![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_162.jpg)


    Note first that the *body* part is essentially the same as in the previous example
    but it is expanded with a *h1* element and a *h2* element, both of which are empty.
    Also note that a *title* attribute has been added to the first paragraph element.
    Then note that three simple styles are defined with each their class name.


    Then the jQuery block (the function). First, the value of the *title* attribute
    is saved in a variable. This is done by selecting all paragraphs and then using
    the *attr()* function. It returns the value of *title* for the first element,
    that has a *title* attribute, and in this case there is only one element (which
    is the first). The value of the variable is then used to associate a text with
    the *h1* element, which occurs with the function *text()*. The third statement
    defines a *title* attribute of the element with id *viking*, which again occurs
    with the *attr()* function in an override, which specifies the attribute as well
    as the value. Then is attached a class *red-class* to all elements whose class
    is *first*. Please note that an element may have more values for the class – an
    element can be of more classes. The next statment performs the same for all elements
    whose class is *last*, but this time the class *blue-class* is added.


    As a next step is added an event handler for click events to the element with
    id *viking*. The result is that if you click on the element, the color will change
    from red to green and click again, the color will change back to red. The next
    last statement shows an *alert()* with the value of *innerHtml* for the element
    *h1* while the last initializes the *h2* element. If you open the document, you
    first get the following popup and then the following window:


    ![](image/Image16321.jpg)![](image/Image16329.jpg)


    Finally, I will show an example that modifies the DOM tree:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_164.jpg)![](image/Image16336.jpg)


    As for the *body* part, there is nothing new compared to the previous element,
    only that the *h2* element is removed. The jQuery function starts by adding a
    *p* element to the *div* element. This happens with the function *append()*, which
    adds the element as the last child to the *div* element. The next statement uses
    the function *before()* to add another *p* element, but this time an element that
    is also a child to the *div* element, but in front of the element just inserted
    (the element with the value *Magnus*). The third statement stores the value of
    the element with id *norwegian* in a variable, and the next statement replaces
    the element with id *norwegian* with another element (an *h2* element containing
    a *span* element). As the last changes the color of the element is changed to
    blue.


    The above is only a hint of what is possible with jQuery and you are encouraged
    to investigate what else is. In particular, I would like to mention that the library
    also contains functions that use ajax. This means that you using JavaScript can
    communicate asynchronously with the server, which gives a whole new dimension
    regarding the use of JavaScript.


    In addition to what is mentioned above, there are also more extensions of jQuery,
    and in particular I want to mention *jQuery UI*, which can be downloaded from:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_166.jpg)


    It is an extension that defines a number of elements for the user interface such
    as dialogs and the ability to select elements using the mouse – and more. When
    you download the product, you will get a JavaScript file (*jquery-ui.js*) and
    an associated style sheet (*jquery-ui.css*), and a project that illustrates the
    application.


    # Appendix B: JSON


    JSON is a standard for data exchange primarily between client and server in web
    applications, but in principle, JSON can be used in many other contexts, and in
    relation to data exchange, JSON can to some extent be seen as an alternative to
    XML. JSON is characterized by being easy to write and read (there are very few
    and simple rules), being text based and being platform independent.


    A JSON document has in principle the same syntax as an object in JavaScript, and
    an example could be:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_167.jpg)


    The basic syntax is that data are represented as key/value pair separated by colon.
    Several data elements (key/value pairs) can be gathered as objects in a collection
    where the elements are separated by commas. Finally, the value of a data element
    may be an array. In general, JSON supports the following data types:


    1.  *Number* as in JavaScript


    2.  *String* that is double-quoted Unicode with backslash as escaping


    3.  *Boolean* that is *true* or *false*


    4.  *Array* which is an ordered sequence of values separated by comma


    5.  *Object* that is an unordered collection of key:value pairs


    The above can therefore also be written as follows, where there are no quotation
    marks around the years:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_168.jpg)


    With regard to escaping of characters in strings, the same symbols are used as
    in Java and JavaScript. Put a little differently, a JSON data structure has the
    same syntax as a JavaScript object consisting solely of properties.


