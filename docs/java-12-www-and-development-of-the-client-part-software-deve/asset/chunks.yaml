    \ statement defines a `title` attribute of the element with id `viking`, which\
    \ again occurs with the `attr()` function in an override, which specifies the\
    \ attribute as well as the value. Then is attached a class `red-class` to all\
    \ elements whose class is `first`. Please note that an element may have more values\
    \ for the class – an element can be of more classes. The next statement performs\
    \ the same for all elements whose class is `last`, but this time the class `blue-class`\
    \ is added. As a next step is added an event handler for click events to the element\
    \ with id `viking`. The result is that if you click on the element, the color\
    \ will change from red to green and click again, the color will change back to\
    \ red. The next last statement shows an `alert()` with the value of `innerHtml`\
    \ for the element `h1` while the last initializes the `h2` element. If you open\
    \ the document, you first get the following popup and then the following window:\n\
    \nimage/Image16321.jpg!image/Image16329.jpg\n\nFinally, I will show an example\
    \ that modifies the DOM tree:\n\nimage/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_164.jpg!image/Image16336.jpg\n\
    \nAs for the `body` part, there is nothing new compared to the previous element,\
    \ only that the `h2` element is removed. The jQuery function starts by adding\
    \ a `p` element to the `div` element. This happens with the function `append()`,\
    \ which adds the element as the last child to the `div` element. The next statement\
    \ uses the function `before()` to add another `p` element, but this time an element\
    \ that is also a child to the `div` element, but in front of the element just\
    \ inserted (the element with the value `Magnus`). The third statement stores the\
    \ value of the element with id `norwegian` in a variable, and the next statement\
    \ replaces the element with id `norwegian` with a variable. The above is easy\
    \ to understand, but it can be written easier using a jQuery function:\n\nimage/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_160.jpg\n\
    \n翻译：\n\n`body` 部分非常简单，由 `div` 元素中的 5 个 `p`（段落）元素组成。你应该注意，前三个定义了类属性（尽管在任何地方都没有定义等效的\
    \ css 类），且第三个元素有一个 ID。JavaScript 代码（jQuery 函数 `$().ready()`）执行了一个函数，该函数从选择所有段落元素开始，结果是一个包含\
    \ 5 个元素的集合。接下来的 `for` 循环遍历这些元素，并将它们的颜色改为绿色。接着，执行了相同的操作，将颜色设置为蓝色，但仅针对类名为 `first`\
    \ 的元素。最后，将颜色设置为红色，但这次仅针对具有特定 `id` 的元素（且只有一个）。如果在浏览器中打开文档，你将得到结果：\n\nimage/Image16314.jpg\n\
    \n特别要注意，DOM 树中的元素在文档出现在浏览器之前就已经被 JavaScript 代码处理了。\n\n上面的内容易于理解，但使用 jQuery 函数可以写得更简单：\n\
    \nimage/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_160.jpg\n\n\
    注意，这次的最后两个段落元素具有类 `last`。如果你考虑 JavaScript 函数中的第一个 `select`，它选择了所有元素并将字体大小设置为 24\
    \ 磅，但它是使用 `css()` 函数实现的，`css()` 是一个 jQuery 函数，作用于所有选中的元素。接下来的三个语句也是如此，它们也使用了 `css()`\
    \ 函数而不是编写必要的循环。这就是你体会到 jQuery 强大之处的地方，有大量的函数可以从上述提到的文档中查阅所有介绍。特别注意最后一条语句，它将所有\
    \ id 为 `viking` 或类为 `last` 的元素的字体设置为 36 磅。\n\n作为另一个示例（`JQueryExample5`），下方显示了一个与上面类似的文档，但该示例展示了多个函数的使用：\n\
    \nimage/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_161.jpg!image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_162.jpg\n\
    \n首先注意，`body` 部分与上一个示例基本相同，但扩展了一个 `h1` 元素和一个 `h2` 元素，两者都是空的。还要注意在第一个段落元素上添加了 `title`\
    \ 属性。接着定义了三个简单的样式，每个样式都有自己的类名。\n\n然后是 jQuery 块（函数）。首先，`title` 属性的值被保存在变量中。这是通过选择所有段落并使用\
    \ `attr()` 函数实现的。它返回第一个具有 `title` 属性的元素的 `title` 值，在这种情况下只有一个元素（即第一个）。然后使用该变量的值将文本与\
    \ `h1` 元素关联，这是通过 `text()` 函数完成的。第三条语句定义了 id 为 `viking` 的元素的 `title` 属性，再次通过 `attr()`\
    \ 函数以覆盖的方式实现，指定了属性本身及其值。然后为所有类名为 `first` 的元素添加了类 `red-class`。请注意，一个元素可能有多个类值——一个元素可以是多个类。下一个语句对所有类名为\
    \ `last` 的元素执行相同的操作，但这次添加了类 `blue-class`。\n\n下一步，为 id 为 `viking` 的元素添加了点击事件处理处理器。结果是，如果你点击该元素，颜色将从红色变为绿色；再次点击，颜色将变回红色。倒数第二语句显示带有\
    \ `h1` 元素 `innerHtml` 值的 `alert()`，而最后一条初始化了 `h2` 元素。如果你打开文档，首先会看到以下弹出窗口，然后是以下窗口：\n\
    \nimage/Image16321.jpg!image/Image16329.jpg\n\n最后，我将展示一个修改 DOM 树的示例：\n\nimage/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_164.jpg!image/Image16336.jpg\n\
    \n对于 `body` 部分，与之前的元素相比没有新变化，只是移除了 `h2` 元素。jQuery 函数开始向 `div` 元素添加一个 `p` 元素。这是通过\
    \ `append()` 函数实现的，它将元素作为最后一个子元素添加到 `div` 元素中。下一个语句使用 `before()` 函数添加另一个 `p` 元素，但这次该元素也是\
    \ `div` 的子元素，但在刚刚插入的元素（值为 `Magnus` 的元素）之前。第三条语句将 id 为 `norwegian` 的元素值存储在变量中，下一个语句用变量替换\
    \ id 为 `norwegian` 的元素。\n\n上面的内容易于理解，但使用 jQuery 函数可以写得更简单：\n\nimage/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_160.jpg\
