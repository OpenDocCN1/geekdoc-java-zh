    The idea of style sheets is as mentioned to separate content and presentation.
    A style sheet consists of styles identified by `selectors`, and as an example,
    I have added the following style for a `h1` selector to the style sheet:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_171.jpg)


    Such a selector is called a `type selector` or an `element selector` and means
    that all of the document’s `h1` elements will use the style that the selector
    defines. You can thus define how the headers of the document should be presented,
    and it will apply to all documents that use that style sheet. Typically, you also
    wants to define a style for the `body` element, such as defining the font to be
    used as default:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_18.jpg)


    You can also define styles for `descendent selectors` that occur with a space
    between two selectors:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_181.jpg)


    This selector indicates that a paragraph element must have a left indentation
    of 20, but only for paragraphs that are nested in a `section` element.


    You can also define a so-called `ID selector`, known as it starts with the character
    `#`


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_19.jpg)


    This selector is used by an element whose `id` is `content-list`, and as element’s
    `id` attribute should be unique, there is only one element in a document that
    directly can use this style. In this case, it is the following element:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_191.jpg)


    Finally, you can define `class selectors`, starting with a point:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_192.jpg)


    An element can use a `class selector` by directly specifying it with a class attribute:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_193.jpg)


    As another example of selectors, there is defined a `class` with the name `forword`
