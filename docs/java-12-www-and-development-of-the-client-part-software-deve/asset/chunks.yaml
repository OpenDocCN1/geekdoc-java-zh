    在 JavaScript 中，变量作用域的规则与 Java 略不同，因为变量具有`函数作用域`（functional scope）。这意味着定义在函数中的变量仅在函数内部可见，但在函数内其定义的任何地方都是可见的。该变量在任何嵌套函数中也是可见。你还应该注意
    JavaScript 使用了`提升`（hoisting），这意味着变量可以在创建它的函数任何地方使用——即使在定义之前。这是因为解释器在开始创建变量时，会认为所有变量在函数开始时就已经定义了。然而，你必须注意，此时变量并不一定被赋值值。


    变量也可以具有`全局作用域`（global scope），如果它定义在函数外部则是这种情况，这种变量可以在文档的任何地方使用。通常，我们在创建变量时会在前面写
    `var`，但实际上并不是必须的（尽管建议这样做）。不带 `var` 定义的变量在任何创建的地方都具有自动全局作用域。


    在大多数编程语言中，当程序离开变量定义的作用域时，变量会被移除，JavaScript 也是如此的。也就是说，变量在定义它们的函数执行时被创建。这至少是一个基本规则，但并不一定适用。这是因为在
    JavaScript 中，函数本身是一个对象，因此函数可以返回一个函数，例如，它可以返回一个内部函数。这个内部函数可以引用闭层函数中的变量，因此在函数完成后，可能存在对局部变量的引用。如果是这样，变量将不会被移除，事实被称为`闭包`（closures）。


    基本上，在 JavaScript 中，关于变量作用域的挑战并不多（也许除了闭包），接下来的名为 `ScopeDocument` 的文档将说明最重要的作用域规则：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_43.jpg)[](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_44.jpg)


    如果你从文档头的 `script` 块开始，变量 `c` 被定义在所有函数之外，它具有全局作用域且随处可见。接下来，函数 `test1()` 定义了局部变量
    `a` 和 `b`。它们仅在函数 `test1()` 中可见，因此在嵌套函数 `test2()` 中也是可见的。然而，只有 `b` 适用，因为 `test2()`
    也定义了局部变量 `a`。函数 `test2()` 显示了局部变量 `b` 的值。此外，`test2()` 初始化了全局变量 `c` 并显示了其值。函数 `test2()`
    从 `test1()` 调用，最终显示了局部变量 `a` 的值。


    还定义了一个函数 `power2()`，这被称为闭包。`power2()` 有一个局部变量 `n`，并返回一个使用该变量的函数 `next()`。这意味着在
    `prowe2()` 终止后，对变量 `n` 仍然引用。


    `body` 部分从 `h1` 元素开始，之后调用了 `test1()`。注意这意味着内部函数 `test2()` 也被执行。接下来，全局变量 `c` 的值被显示。如果你尝试显示变量
    `a` 的值，它在该处没有定义，文档渲染将会中断。


