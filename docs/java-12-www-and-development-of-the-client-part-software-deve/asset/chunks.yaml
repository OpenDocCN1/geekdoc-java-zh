  trans: '

    然后是 `websheet.beans` 包，它包含 6 个类，其中最重要类是 `MainController`，它是一个被两个 `xhtml` 页面使用的命名
    bean。其中两个类是 `DateValidator` 和 `DateConverter`，它们分别在 `open.xhtml` 中用于验证日期和将日期（一个
    `Calendar` 对象）转换为字符串，它们没有包含任何与前书中提到的不同的新内容。然后是三个类 `TableHeader`、`TableRow` 和 `TableCell`，它们用于构建
    HTML 表格。这些类实际上是冗余的（至少任务可以在没有它们的情况下解决），但包含它们是为了以后程序的任何扩展，在这些情况下这些类可以增加新属性进行扩展。


    然后是 `MainController` 类，这是一个相对全面的类。原则上讲，它是简单的，最重要的一点是它为工具栏上的前四个功能提供了动作（actions），这些功能是唯一调用服务器端的函数。该类被用
    `index.xhtml` 和 `open.xhtml` 的控制器，你应该考虑是否应该将该类拆分为两个，以便每个 `xhtml` 文档都有自己的控制器。


    代码其余部分是客户端代码，主要是 JavaScript 和样式表。关于后者，有 4 个样式表，其中两个是 jQuery 的一部分且未修改。另外两个相对简单，分别被
    `index.xhtml` (`styles.css`) 和 `open.xhtml` (`dialogs.css`) 使用。有 8 个 JavaScript
    文件，但只有 3 个是为此项目编写的。四个属于 jQuery，而第五个是一个标准的 JSON 解析器。


    应用程序主要使用 jQuery，除了轻松在 DOM 树中选择元素外，jQuery 还用于以下场景：


    * 使用鼠标选择表格中的单元格，例如通过拖动鼠标

    * 打开对话框，可以是简单的消息框，也可以是用户输入数据的地方

    * 用户右键点击行或列标题时打开的菜单

    * 打开一个简单的颜色选择器，用户可以在其中为文本或背景选择颜色


    这需要下载与 jQuery 相关的多个文件并添加到项目中。需要注意的是，jQuery 提供的功能远比本示例中使用的。


    出于项目的考虑，添加了 3 个 JavaScript 文件：


    1. `Expressions.js`

    2. `Websheet.js`

    3. `ColorSelector.js`


    第一个包含一个模块 `expression`，它包含了公式所需的所有函数。在《Java 3》书的最后一个示例中，我展示了一个拥有可以解析和评估数学表达式方法的类。`expression`
    模块主要是将该类转换为 JavaScript，但有两处更改：


    1. `expression` 只支持两个数学函数，即平方根函数和求和函数。然而，通过实现运算符 `^` 也支持幂函数。

    2. 表达式不再作用于普通变量，而是作用于单元格引用，这意味着解析器必须进行一些修改。


    对于 `sum` 函数，它可以求和多个值（常量或单元格引用），这些值以逗号分隔的列表形式表示。你也可以在同一行或同一列中指定两个单元格引用并用分号分隔，函数将汇总这些引用之间的所有值。


    因此，表达式（公式）的实现相对简单，因为可以直接应用《Java 3》中的算法。然而，挑战在于三种情况：


    1. 当插入行或列时，表达式对单元格的引用可能会发生。例如，如果你插入了一行，表达式中所有大于新行索引的引用计数都要加 1。列也是如此。

    2. 通过复制/粘贴公式，公式的单元格引用必须根据公式移动的距离进行更改。

    3. 公式可以通过单元格引用引用其他公式，因此存在循环引用的可能。这个问题通过以下方式部分解决：每次输入公式后，程序都会检查该公式是否导致了循环引用。


    模块的某些方法用于处理这些情况。


    其中几个方法可能会抛出异常，如果发生异常，异常动作是 `alert()`。对于一个完成的应用程序来说，这显然没有意义，但我保留了它们，因为如果其他人想在该项目上工作，它们可能会有用。事实上，排查
    JavaScript 代码相对困难，JavaScript 的困难点之一是错误的可能性非常多，且很难对代码进行错误测试。在运行情况下，你可以将相关的 alert
    替换为对服务器的请求，并使用 ajax 将相应的错误消息发送到服务器，服务器将其保存在日志文件或数据库表中。这允许你定期检查代码是否产生错误以及错误是由什么引起的，这可以使程序的维护变得容易得多。


    然后是 JavaScript 文件 `websheet.js`，它包含了所有用于处理用户交互的脚本。该文件内容广泛，由三个模块组成：


    1. `datadefs`，当前电子表格的数据表示

    2. `sheet`，包含操作电子表格的所有方法以及从工具栏使用的所有函数

    3. `handlers`，包含编辑单元格内容的事件处理程序


    我在设计期间提到的第一个和最后一个都较简单。为了编辑单元格的内容，表格中的单元格包含两个组件，其中一个带有 `span` 元素的 `div` 元素，它通常显示文本。该元素的内容会根据所选格式进行格式化。另一个元素是一个通常不可见的输入组件。按住
    CTRL 和 SHIFT 键并点击鼠标会更改这些组件的可见性，然后你就可以编辑内容。当你再次点击或按下 `Tab` 或 `Enter` 时会再次切换可见性并更新用户界面。后者并不简单。首先，如果依赖的单元格发生了变化，电子表格中的其他公式可能必须更新。其次，如果输入的是公式，必须验证它是否导致了循环引用。这些是由
    `handlers` 模块中的函数处理的。


    还有一个函数 `initCells()`，它不属于上述模块。该函数的任务是将 `Handlers` 模块中的事件处理程序关联到表格单元格上。该函数在浏览器初始化窗口时使用。


    `sheet` 模块的一个重要部分与格式有关，其中你必须对单元格进行格式化，并确保在加载保存的电子表格时保存并再次使用格式。此外，当插入/删除行列时，格式可能会被修改。你应该注意格式不会随复制/粘贴而复制。


    另一部分涉及工具栏上打开和保存电子表格的按钮，这些按钮向服务器发送请求。特别要意识到，电子表格是使用 ajax 异步保存的。


    最后是复制/粘贴按钮，特别是粘贴的事件处理程序并不简单。这些函数没有使用机器剪贴板，而是使用内部数组。原因是这样做简单，但你应该注意到实际上有一个 API
    可以让你从 JavaScript 使用系统剪贴板。

    '
- fmt: '

    Then there is the file `ColorSelector.js`, which makes nothing but defining a
    simple object for color selection. Only a few colors can be chosen, but jQuery
    offers a more advanced color selection dialog that would be a good option. When
    I have chosen to write my own, it is alone to make the program simple.


    Back there are the `xhtml` pages where there are two. `open.xhtml` is a simple
    form that is used to open a spreadsheet. You can search the database by name and
    date, and the page shows a list of spreadsheets that exist and matches the search
    criteria. Then there is `index.xhtml`, which is the home page and the actual spreadsheet.
    The page does not fill much, but in addition to the spreadsheet’s table, there
    is the toolbar and dialog boxes that jQuery implements using hidden `div` elements.
    You should also note that the communication with the server is primarily done
    by using hidden fields at the end of the page.


    ## 8.4 Conclusion


    As mentioned, the purpose of this project is to show a little about what is possible
    with JavaScript, and in fact, it is possible to program complex logic that is
    performed on the client side alone. JavaScript is in fact a fairly complex programming
    language, and there is a lot more to learn than what this book is about. However,
    it is not more difficult to learn JavaScript than another programming language,
    and if you need to use JavaScript to a large extent, there is nothing more than
    going systematically, for example, reading a book exclusively related to JavaScript.
    However, there is one thing that should be noted that since JavaScript is not
    translated by a compiler, and is not type-strong, there is a high risk that the
    code contains errors and, worse, it is both difficult and time consuming to find
    the mistakes. The conclusion is, therefore, that JavaScript is a fully-fledged
    programming language, but it is far from an effective language for developing
    major programs.


    The current project is not a complete spreadsheet, which can be used as an alternative
    to, for example, `LibriOffice Calc` – nor does it make sense to try to develop
    such an alternative. However, the project may have applications, and if you think
    of a web application that needs a spreadsheet-like page, the project or parts
    of it may be used. Should the project be expanded, so it looks like a real spreadsheet,
    there are some missing and I will mention some features that could significantly
    improve the program. In fact, each feature could be a task or project in itself.


    1. Data entry should be improved as you do not always have to click the mouse
    to open a cell. It is primarily a question about to treat events related to the
    keyboard, such as arrow keys.

    2. The program should apply the system clipboard so that you can copy data to
    other programs. It is primarily a matter of getting into the corresponding JavaScript
    API.

    3. The expression module should be expanded with more mathematical functions.
    It’s actually a relatively simple task, and the algorithms can be found in the
    book Java 3.

    4. However, the biggest lack is performance where the application becomes ineffective
    on large spreadsheets. An option to solve the problem could be to show only a
    part of a spreadsheet on the client side and then place some navigation buttons
    in the toolbar. This improvement is not quite simple.


    # Appendix A: jQuery


    In chapter 4 on JavaScript, I mentioned jQuery, which is a large library of JavaScript
    functions, and if you work as a web developer, you can not avoid jQuery and, if
    nothing else, jQuery provides so many functions that it is worth the effort to
    investigate what it is. So, therefore, a brief introduction, but also because
    I have actually used jQuery in the final example in the last chapter.


    First, you have to grab the product and that is the latest version, as new versions
    are constantly being added. You can go to the page


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_155.jpg)


    from where you can download the product as a JavaScript file, and thus as a plain
    text file with the code (right click on the link and select `Save link as`). In
    fact, you must download two files:


    1. `jquery-3.2.1.js`

    2. `jquery-3.2.1.min.js`


    where the version number can of course differ. Both files contains the same JavaScript
    code, and the difference is, that the latter is compressed, so it is significantly
    smaller (about one third). The goal is that while developing, you can use the
    first one where the code is written in readable form and with comments, and when
    the program is finished, you can replace it with the last one. Here you must remember
    that JavaScript is text that is sent along with the HTML document, and you are
    therefore for the sake of bandwidth interested in sending as few data as possible.


    After downloading the files, nothing else must happen, and you are ready to use
    jQuery in your projects (and that is what of it you want to apply). As an example,
    I have created a project named `JQueryExample1`:


    ![](image/Image16280.jpg)


    As you can see, under the directory `resources`, I have created a subdirectory
    named `js` and placed `jquery-3.2.1.js` there. The content of `index.html` is
    as follows:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_156.jpg)


    First, note that in the header there is a script element that refers to the jQuery
    file. In addition, there is a script element with some JavaScript code that uses
    jQuery. Here means


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_157.jpg)


    that the following JavaScript code is executed – after the DOM tree is constructed,
    but before the tree’s elements are rendered. In this case, it means an anonymous
    function that associates a `click` event handler with an `alert()` to all `div`
    elements. Specifically, note the syntax `$()`, which is a jQuery function, which
    refers to a collection of elements, and you can then perform a JavaScript function
    on these items. In this case, the `body` part has only a single `div` element
    and if you opens the document in the browser, the result is:


    ![](image/Image16289.jpg)


    What is not very mysterious, but if you click on the text, you get a popup:


    ![](image/Image16300.jpg)


    The example shows two things. First of all, what is technically necessary to use
    jQuery, and second, what is the idea of jQuery, that is, in an easy way to select
    items in the DOM tree and do something with them. The first goes quite easily
    and you simply copy the library to the project (in fact there is an option since
    multiple browser vendors make the library available and you can just link to the
    current library). As for the other, it all builds on the `$()` function, which
