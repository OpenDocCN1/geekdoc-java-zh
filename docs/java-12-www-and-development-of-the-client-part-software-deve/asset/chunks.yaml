    # 4 JavaScript


    我将将介绍 JavaScript，它是客户端代码的首选语言。该语言的语法本质上与 Java 相同，但除此之外这两种语言之间没有共同点，JavaScript
    甚至是一门与 Java 非常不同的语言，但如果你想作为 Web 开发人员专业地工作，就必须了解 JavaScript。因此有了这一章。


    JavaScript 是一种解释型编程语言，源代码像 Java 一样只是文本，但与 Java 不同，代码不会被翻译，而是作为文本发送给浏览器，浏览器内置了一个解释器来解释
    JavaScript 代码。这是一个真正的解释器，它会逐句解释代码语句，并在解释和执行下一条语句之前执行每一条语句。为了展示 JavaScript 是什么，我想从一个非常简单的示例开始，称为
    `LoadingDocument`。只有一个文件 `index.html`，其内容为：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_31.jpg)


    在 `head` 部分有一个 `script` 元素，它是可以包含 `JavaScript` 代码的元素。在这种情况下，定义了一个变量和一个函数。变量名为
    `hello`，并用文本“Hello”初始化。原则上，JavaScript 使用变量的方式与其他编程语言（包括 Java）类似，但你应该主要注意该变量没有类型。脚本块还有一个函数，该函数基本上充当
    Java 中的方法，并可以通过调用它来执行。在这种情况下，函数名为 `show()`，它有两个语句。第一条是 `alert()`，它打开一个简单的弹出窗口，显示变量
    `hello` 的值。下一条语句改变变量的值，在这里你应该注意到语法正如你从 Java 中了解的那样。如果应用程序在浏览器中打开，它将从头到尾渲染文档的 `body`，从以下窗口开始渲染了
    `h1` 元素（见下文）。在渲染 `h1` 元素之后，有一个新的脚本元素


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_32.jpg)![](img/Image15118.jpg)


    它调用了 JavaScript 函数 `show()`，这意味着浏览器停止并打开一个弹出窗口：


    ![](img/Image15126.jpg)


    点击 `OK` 后，浏览器将继续渲染文档，然后浏览器将渲染 `h2` 元素：


    ![](img/Image15133.jpg)


    接着是一个脚本元素，这次它仅执行 `alert()`，在弹出窗口显示变量 `hello` 的值：


    ![](img/Image15143.jpg)


    在这里注意变量在 `show()` 函数中被改变了。在显示弹出窗口后，浏览器恢复运行直到点击 `OK`，之后浏览器渲染 `h3` 元素，然后是


    上述示例展示了一些关于 JavaScript 是什么以及如何将 JavaScript 添加到 HTML 文档的内容，但不是 JavaScript 可以做什么，这是后续内容的目标。首先，我想更多地介绍语言的语法。


    ## 4.1 语言的性质


    当你开始学习 JavaScript 并来自 Java 等其他语言时，主要有三点看起来非常不同：


    * 变量作用域

    * 类型

    * 对象与继承


    而实际上是这三点使得 JavaScript 编程与例如 Java 编程大不同。JavaScript 是一门*弱类型*语言，变量不需要声明特定类型。这并不意味着该语言没有类型，而是意味着变量可以改变类型，且当前类型取决于变量的值及其使用方式。该语言的类型兼容性有很多规则，这些规则相当复杂，我将在下文中解释一些。JavaScript
    在经典意义上不是面向对象的，但相反，对象在语言中起着重要作用。然而，与 Java 相比，创建和继承对象方面存在巨大的差异。JavaScript 与其他语言最大的区别可能是函数，因为函数实际上是具有属性和方法的对象。

