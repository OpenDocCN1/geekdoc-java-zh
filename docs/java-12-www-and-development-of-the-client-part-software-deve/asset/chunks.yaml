    JavaScript 中的类型概念，但基本上有四种类型：


    1. `Boolean`，值为 `false` 或 `true` 的变量或表达式。

    2. `Number`，数字，且都是 64 位浮点数。

    3. `String`，字符串。

    4. `Object`，由属性和方法组成的集合，涵盖了上述三种以外的所有内容。


