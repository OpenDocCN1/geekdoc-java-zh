    Since *obj1* is as above, you usually refer to the individual properties using
    the dot notation, but you can also use array notation, which uses the name of
    the property as an index:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_72.jpg)


    Both of these statement will display an *alert()* with the value 2. The main application
