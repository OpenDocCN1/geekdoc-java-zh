    新元素具有一个值为 `weekend` 的 `id` 以及一个 `style` 属性，其中，你主要需要注意的是，颜色的值由方法 `isWeekend()`
    的返回值决定，该返回有有 `red`（红色）或 `darkgreen`（深绿色）。因此，文本显示为红色或绿色。最后，该元素定义了一个类型为 `preRenderComonent`
    的事件。也就是说，事件处理器（元素的监听器）在元素渲染之前执行，而该处理器是控制器类中的 `checkForWeekend()` 方法。它在每次元素渲染时都会执行一次，这自然发生在页面渲染时，但当日期的输入组件发生变化时也会发生这种情况，因为
    ajax 函数表明 `id` 为 `weekend` 的元素必须被渲染。


    # 6 组件库


    如上一章所示，JSF 特别是结合 Ajax 使用时，提供了一系列功能，可以轻松开发出吸引人且动态的 Web 应用程序，但还有很多可以做的，其中包含了几个第三方
    JSF 组件库。在本章中，我将对这些库之一——名为 `PrimeFaces` 的库进行介绍性说明。基本上，它是一个库，为每个标准 JSF 组件定义了它自己的组件，并扩展了一个
    Web 应用程序的骨架，使得从零开始开发一个稳定的应用程序变得简单。使用 `PrimeFaces` 的动力主要是为了方便开发用户友好的 Web 应用程序，但也因为该库提供了
    JSF 未立即提供的其他服务；事实上，其理念是让用户尽可能少地处理样式表和 JavaScript——这两者在实践中可能非常耗时。


    如前面提到的，还有其他的 JSF 组件库，但我想介绍 `PrimeFaces`，因为该库由 NetBeans 直接支持，不需要安装相关的库（尽管安装也相当简单）。使用
    `PrimeFaces` 可以获得显著的收益，但代价是你必须熟悉该库（有点像 `jQuery`），并且你应该意识到 `PrimeFaces` 的开发者对 Web
    应用程序应该什么样以及如何工作有一自己的想法，如果你想偏离它，并不总是那么容易。


    我想从一个普通的 Web 应用开始，我将其命名为 `ChangeAddress6`。当我来到框架时，我像往常一样选择了 `JavaFaces`，在这里点击了
    `Components`（组件）标签页并选择了 `PrimeFaces`：


    ![](img/Image16220.jpg)


    当我然后点击“Finish”（完成）时，NetBeans 像通常一样创建一个增加了三个文件的 Web 应用程序：


    ![](img/Image16227.jpg)


    除了 `index.xhtml` 和 `web.xml` 之外，还创建了一个 `welcomePrimefaces.xhtml` 页面，这是应用程序的启动页。结果是一个完整的
    Web 应用程序，并在浏览器中打开它，你会看到以下窗口：


    ![](img/Image16235.jpg)


    它是 `index.xhtml`，但点击链接会打开窗口：


    ![](img/Image16242.jpg)


    即 `welcomePrimefaces.xhtml`。也就是说，NetBeans 生成了一个页面的骨架，然后程序员的任务就是填充一些有意义的内容。你应该注意，页面的设计是在没有使用样式表或
    JavaScript 的情况下完成的，全部内置于库。


    `index.xhtml` 不包含任何新内容或关于 `PrimeFaces` 的内容，当然，目标是根据特定任务对其进行修改。新内容在 `welcomePrimes.xhtml`
    中，NetBeans 在那里创建了以下页面：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_127.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_128.jpg)


    如果你通读一遍代码，你会发现一切都是关于模板的，无论其模板的核心是什么。从顶部开始，你应该注意添加了一个新的命名空间：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_1281.jpg)


    这是定义所有 PrimeFaces 元素的命名空间，任何使用 PrimeFaces 的页面都必须包含它。然后是 body 部分，这次所有的元素都是 PrimeFaces
    (`p:`) 元素。第一个是 `p:layout` 元素，定义了整体设计。这是通过使用嵌套的 `p:layoutUnit` 元素实现的，将窗口分为五个区域：


    1. `north`（北），定义页面顶部的区域。宽度将自动为整个浏览器窗口，而 `size` 属性指示高度。

    2. `west`（西），定义左侧区域，其高度将自动为浏览器窗口中未被 `north` 和 `south` 使用的部分，而宽度由 `size` 定义。

    3. `south`（南），底部区域，宽度自动为整个浏览器窗口，而高度由 `size` 属性决定。

    4. `east`（东），右侧区域，但 NetBeans 不会插入这个区域（它并不经常使用）。该区域的高度与 `west` 相同，宽度由 `size` 属性定义。

    5. `center`（中心），简单来说被其他四个区域使用的浏览器区域。


    也就是说，`p:layout` 元素以 Java 中 `BorderLayout` 的方式划分窗口。在各个区域之间有可以用鼠标拖动的线条，从而改变区域的大小——有点像
    Swing 中的 `GridSplitter`。使用了其他属性，例如 `north` 和 `south` 被定义为 `closeable`可关闭）和 `collapsible`可折叠），这意味着双击线条即可折叠区域。同样，左侧区域也被定义为可折叠，通过点击带有
    `Left` 文字的线条来实现。


    NetBeans 在四个区域中插入内容。对于前三个，它只是文本，而对于左侧则是一个菜单。在这里你应该特别注意，菜单是可以嵌套的。


    现在我将展示如何修改该应用程序以类似于其他的 `ChangeAddress` 应用程序。首先，我重命名了（菜单项 `Refcator`）页面 `welcomeprimefaces.xhtml`
    为 `start.xhtml`。注意这意味着需要手动修改 `index.xhtml` 中的名称。然后我将 body 部分修改为：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_130.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_131.jpg)![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_132.jpg)


    当然有很多值得注意的地方。在开头，定义了样式表的加载，见下文。接下来，你可以注意到 `north` 和 `south` 发生了变化，这两个区域都只包含纯 HTML。此外，`west`
    区域也发生了变化，因此菜单现在有一个指向已输入地址概览页面的菜单项。由于只有一个菜单项，使用 `p:menu` 元素可能有点大小用，但我保留了它作为示例。相关的菜单项不再应该被翻译成普通链接，而是指向同一应用程序内另一个文档的引用（类似于
    `commandLink`）。这是通过使用 `action` 属性而不是 `url` 属性实现的，但作为交换，菜单必须放在表单中，因为它应该被翻译为该表单的提交。

