    case, means


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_24.jpg)


    all elements under elements with the class *king*. Finally, there are the three
    last styles that relate to attributes. Here they are used two a paragraph with
    the attribute *data-info*, and in particular you can select the attributes text:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_25.jpg)


    and there are actually a few more options.


    ## 3.2 Styles


    Above I have shown examples of how to refer from a style sheet to the individual
    elements in the HTML tree, but there are quite a few other areas where styles
    are available, and where you should know what they means – and there are really
    many. Styling an HTML document is an extensive topic, and an adequate processing
    of styles is beyond the scope of this book. In this section I will outline some
    of the basic principles, but there is much more, and in general, in software development
    it is an area that requires considerable expertise before designing modern web
    applications. However, I would like to emphasize once again that the development
    tool usually supports styling and is a significant help in practice, although
    it is by no means always easy to understand the effects of the many possibilities.


    Basics styling includes:


    *   how much the elements fill in the browser


    *   where the elements are located


    *   how the content of the individual elements is formatted, including fonts and
    colors


    Basically, an HTML element appears as a box:


    ![](image/Image15086.jpg)


    In the middle you have the content (if there is a content) and without having
    *padding*, which indicates how much space there should be outside of the content.
    For an element with a style, the *width* and *height* will in most cases mean
    the size of the content area inclusive padding, but it can be changed with *box-sizing*.
    Around the padding there may be a *border*, and finally there may be a *margin*
    about all of it. For example, if you specify a *background* color, it will relate
    to the entire *padding* area. You should especially note that the *margin* area
    is transparent and is thus only used to create spaces between the elements. You
    should be aware that if elements are vertically aligned and two margins (top and
    bottom) meet, they are automatically collapsed to one whose height is the largest
    of the two.


    Many elements such as *p*, *h*, and *article* elements behave as described above
    and show the contents as a block and are therefore called *block boxes*. Others
    such as *strong* and *span* are called *inline boxes* as they format the content
    of a line. How the different elements show their content can be defined by *display*
    and thus override how they as default shows their content. Elements can be laid
    out by the browser in several ways, but the default is *static*, and for *block
    boxes*, it means that they are placed vertically underneath each other, whereas
    for *inline boxes* it means that they are laid out horizontally on the same line
    and wraps as required.'
