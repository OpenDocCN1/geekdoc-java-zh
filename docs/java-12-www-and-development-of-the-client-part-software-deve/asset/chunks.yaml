    above with *obj1* and *obj5*, that is, you directly write the properties that
    the object should have. You can also create an object with *Object.create()* such
    as *obj3* and *obj4*, where an object is created as an extension of another object.
    Finally, you can create objects using a constructor. Consider the following function:


    ![](image/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_73.jpg)


