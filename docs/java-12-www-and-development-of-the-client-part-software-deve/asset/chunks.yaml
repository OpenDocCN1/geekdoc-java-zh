    ## 4.4 DOM


    DOM 代表 `Document Object Model`（文档对象模型），它是 W3C 规定浏览器如何将 HTML 文档构建为对象树的标准。DOM 不是
    JavaScript 的一部分，但 DOM 对象允许 JavaScript 操作这些对象，从而从脚本代码引用当前文档的内容。与 JavaScript 结合，DOM
    是开发客户端具有交互功能网站的关键。DOM 是一个标准，但实现该标准取决于浏览器厂商，而标准的优劣取决于浏览器厂商对标准的遵守程度。这意味着不同浏览器以及同一浏览器的不同版本之间可能存在（确实存在）差异，但最基础对象的实现大致符合标准。


    DOM 树的根节点被称为 `window`，是一个由多个属性和集合组成的对象。主要属性是 `document`，它代表浏览器显示的文档。例如，考虑以下文档（`DOMTree`
    项目）：


    ![](img/Java_12_–_WWW_and_development_of_the_client_part_22-11-17_92.jpg)


    在 DOM 树中，文档中的每个元素都由一个节点（node）表示，这同样适用于不可见的元素，例如 `script` 元素。JavaScript 的典型用途是修改
    DOM 树，特别是更改单个节点。在这种情况下，script 元素首先定义了一个全局变量。`parse()` 函数接受一个节点作为参数，并从开始将该节点的名称添加到全局变量
    `tree` 中。如果节点上附有属性，它们也会以键值对的形式添加到变量中。最后，如果有子节点，则会为每个子节点递归调用 `parse()` 函数。


    你必须注意 `parse()` 函数的语法。当然，要猜出各个属性的名称并不容易，但当你看到结果时，很容易跟上发生了什么。


    还有另一个名为 `build()` 的函数，它以 `document` 对象作为参数调用上述递归函数。当执行 `parse()` 函数时，`build()`
    函数将通过对 id 为 `domTree` 的元素（这是一个文本区域）的引用，插入全局变量 `tree` 的值。`build()` 函数作为 `onload`
    事件处理器被执行，该事件在文档加载并在浏览器中显示后触发，随后 DOM 树便被构建完成。


    如果你在浏览器中打开该文档，你会得到下方的窗口，在这里你可以看到文档中的每个元素是如何被 DOM 树中的节点节点的。


    ![](img/Image16113.jpg)


    ### DOM 中的元素引用


    关于 DOM 的的第一步是学习如何引用 DOM 树的各个元素，然后对这些元素进行操作。这基本上通过引用元素的 `id` 属性或 `class` 属性来实现，这在本章引言中通过
    `SimpleDocument` 示例进行了说明。该示例简单介绍了在 DOM 树中查找特定元素或元素数组的可用选项。基本方法有：


    * `getElementById()`

    * `getElementsByTagName()`

    * `getElementsByClassName()`

    * `querySelector()`

    * `querySelectorAll()`


    这里，最后两个是最高级的，因为它们使用了本书第 3 章解释的 CSS 选择器，区别在于：前者返回第一个匹配选择器的元素，而后者返回所有匹配选择器的元素。此外，节点还具有以下属性：


    * `firstChild`

    * `lastChild`

    * `nextSibling`

    * `previousSibling`


    这些属性可以用于遍历 DOM 树。


