    If you look at the header section then it uses an anonymous function to embed
    variables and functions in a namespace, and the variables and functions will become
    local to this namespace. An anonymous method used in that way is usually called
    a `module`, and `triple` is thus an example of a module. Modules can be perceived
    as a pattern to implement a form of data encapsulation in JavaScript, and among
    other things, names are local to the module, so you are independent of which names
    others may have used.


