  md: '# # Contributors


    **A. Everett Beek (University of Memphis):** A. Everett Beek primarily studies
    Augustan Latin poetry, particularly depictions of apotheosis, the afterlife, and
    catabasis; she also studies women and the construction of gender. She is currently
    examining literary depictions of the dead, e.g. as ghosts or shades, focusing
    on how literary deictions diverge from folk and religious beliefs.


    **Anna Blennow (University of Gothenburg):** Anna’s research interests include
    classical and medieval Latin epigraphy and epigraphic theory. A recent publication
    of importance is the first scientific edition of the medieval Latin inscriptions
    in Sweden, published by the Swedish National Museum in 2016. She is also the leader
    of an interdisciplinary project on the history of guidebooks to Rome, based at
    the Swedish Institute of Classical Studies in Rome.


    **Justin Hudak (University of California, Berkeley):** Justin studies Augustan
    poetry and its reception in twentieth-century literature. His current projects,
    which revolve around questions of literary influence and poetic faith, examine
    alongside James Joyce and Horace Wallace Stevens.


