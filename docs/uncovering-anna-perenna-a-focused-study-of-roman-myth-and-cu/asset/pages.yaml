    # IV


    The plebeians who honoured Anna of Bovillae were ‘still unprotected by any tribunes’;72
    the secession itself enforced the creation of the tribunate of the *plebs*, to
    protect the Roman People from the abuse of power. Four and half centuries later,
    in January 49 BCE, the *optimates* drove two tribunes out of Rome, to prevent
    them from exercising their legal right of veto.73 The tribunes fled to Caesar,
    now consulul of Gaul. Caesar marched his army into Italy, making it in a public
    statement what was at stake:


    +   - se non malifuci causa ex provincia egressum sed u a contumelis inimorum
