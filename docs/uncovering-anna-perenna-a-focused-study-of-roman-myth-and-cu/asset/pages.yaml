  md: '# # Preface


    This volume originated from a shared interest in pursuing the figure of Anna Perenna,
    who embodies the complexity and richness of Roman myth and culture. Her appearances
    in central works of literature, together with evidence from archaeological and
    epigraphic sources, confirm her prominence in Roman thought and practices. Ovid''s
    depiction of competing origin narratives for Anna Perenna in the *Fasti* underscores
    her prominence in Roman imagination and the multiplicity of her identity. Other
    literary treatments of Anna in the *Aeneid* and the *Punica* connect her to the
    foundational legends and military history of Rome. Fragments of Laberius''s *mimus*
    about Anna situate her within the context of Roman performance and spectacle,
    while recent archaeological and epigraphic discoveries establish her association
    with cult cults and ancient magic. The commemorative depiction of the goddess
    on a coin minted by Gaius Annius exemplifies the social trends of the first century
    BCE, while elite Roman families solidified power and prestige by claiming ancestry
    from mythic and divine sources. Her presence in post-classical reinterpretations
    of ancient sources offer confirmation of her perennial significance as part of
    the Roman tradition.


    Our vision for *Uncovering Anna Perenna* was to invite a range of scholars to
    contribute to a focused study that represents the intersection between Roman literature,
    history, and culture. The chapters collectively seek to highlight the importance
    of Anna Perenna, the fluidity of her identity, and the intricacies of her various
    manifestations in text and material culture. In exploring Anna Perenna, the contributors
    apply different perspectives and critical methods to an array of evidence drawn
    from central texts, monuments, and inscriptions that encapsulate Rome''s shifting
    artistic and political landscape. We hope that this volume will be of interest
    to literary scholars, cultural historians, material culture specialists, and synthetic
    enthusiasts of the Roman world and its enduring impact.


    The four sections of this volume present a framework for categorizing and contemplating
    Anna''s different identities and associations through time, space, and medium.
    In Part I, ''From Carthage to Rome'', contributors explore the liminal and transitional
    nature of Anna as a Carthaginian princess coopted into Rome''s literary, mythological,
    and artistic heritage. Sarah McCallum discusses the'
