    T. P. Wiseman


    GAIAE),4 it is not clear whether the day was the festival of a single deity, Anna
    Perenna, or of two, Anna and Perenna.


    The question matters because a contemporary source names Anna and Perenna (sic)
    as separate entities:


    te Anna Perenna, Panda, te calo, Pales, Nerienes <et> Minerva, Fortuna ac Ceres


    I call on, Anna and Perenna, and you, Panda, Pales, Nerienes and Minerva, Fortuna
    and Ceres.


    Var. Men. fr. 506 Astbury5


    The quotation is from Fighting Shadows: On Nonsense, one of the 150 ''Meenipeen
    satires'' composed by Varro in the seventies and sixties BCE. Why the speaker
    should invoke a strange collection of major and minor deities is, alas, unknown,
    but we do at least know something about the first names:


    +   eodem quidemque et et et privatim Adnam Perennam sacrificatum itur, ut anna
    pernareque commodo liceet


    +   In the same month [March] people go to Anna Perenna to sacrifice both publicly
    and privately, that they may prosperously annare and perenna.


    Macr. 1.12.6


    The first of the verbs is unparalleled, but must mean like ''pass the year'';
    the second is glossed by the Oxford Latin Dictionary ''to continue for a long
    time, endure''. They were not synonyms, and therefore Anna and Perenna could have
    been two separate deities in charge of two functions. For Macrobius, of course,
    writing long after Ovid and Silius Italicus, Anna Perenna was a single entity.
    That was not necessarily the case in the late republic.


    The naming of specialist divinities with very particular functions was the responsibility
    of the Roman pontifices. Servius''s commentary on Virgil


    quod autem ''studium quibus aqua tueri'', haec numinum in indigitensis inveniuntur,
