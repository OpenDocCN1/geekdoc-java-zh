  md: 'It is clear from Augustine''s use of the *Divine Antiquities* that what Varro
    objected to were plays with burlesque mythological put on the *ludi scenici*;$^{47}$
    in particular, he disliked stories in which gods were portrayed as thieves (like
    Mercury) or adulterers (like Jupiter) or slaves to a mortal (like Hercules).$^{48}$
    The deception of onerous Mars would certainly count as such a plot.


    It is important not to overlook this authoritative body of evidence for a late-republican
    dramatic genre that is otherwise practically unattested. The nearest thing we
    have to confirmation of it is another fragment from one of Varro''s Menippe satires,
    where the speaker is commenting on the ruinous expense of keeping slaves and hunting
    dogs:


    crede mihi, plures dominos comederunt quam. quod si Actaeon occupasset et ipse
    suos cedes, non nun saltatorius in teatro fieret.


    Believe me, masters have been eaten up by their slaves than their dogs. If Actaeon
    had got in first and eaten his dogs before they ate him, he wouldn''t be rubbish
    for dancers in the theatre.


    *Var. Men.* 513 Astbury$^{49}$


    Actaeon was a subject for tragedy, but even a special mask equipped with antlers
    for the protagonist$^{50}$ but the comic exploitation of tragic plots had been
    familiar in Italy since the third century BCE, when Rhonthon pioneered the dramatic
    form called ''cheerful tragedy''.$^{51}$ Since Rhintonica are listed by the grammarians
    as a recognized type of Roman comedy,$^{52}$ it would be an economical hypothesis
    to identify them with the performances Varro complained about.


    Note that the role of Actaeon was danced. Cicero mentioned in one of his speeches
    a dancer Dionysia who charged 200,000 sesterces for a single performance.$^{53}$
    She too must be part of this ill-attested dramatic culture, a style of performance
    preceding – and perhaps developing into – the hugely popular pantomimus dance-drama
    associated with Bathyllus and Pylades in the twenties BCE.$^{54}$ Pylades specialized
    in tragic roles, but Bathyllus''s style was ''more cheerful'' (the word used of
    Rhonthon''s burlesques), by the nymph Echo or Pan satyr revelling with Eros$^{55}$


    Paying proper attention to this scattered and neglected evidence, and bearing
    in mind Varro''s structures on material ''unworthy of the divine majesty,''$^{56}$
    we should remember Propertiius 4.9, where Hercules utters words unworthy of a
    god; or Ovid''s account of the ''silent goddess'' in Fasti 2, where Jupiter, lusting
    after Juturna, ''put up with many things so great a god shouldn''t have to endure''57}$'
