    While Virgil does not directly use the word nympha in his depiction of Anna, he
    associates her with the closely related word lympha. Varro states that the word
    lympha comes directly from the Greek nymphla (L. 7.87).³ The root lymph- appears
    to have a connection to nymphs in Latin literature. Cicero records a fragment
    of Pacuchius who describes Hesione as ‘moved at heart as possessed by nymphs or
    stirred up by the tree of Bacchus (flexanima tamquam lymphata out sacris Bacchi/
    commota, 422 R apud Cic. Div. 1.80).⁴ Lympha appears here to be a translation
    of υποπομδρόληρτος (‘seized by the nymphs’), which can indicate insanity caused
    by possession of the nymphs.⁵ The mention of Bacchus in these lines provides further
    association with nymphs since they were frequently their attendants.⁶


    Catulus plays with the potential anthropomorphic connotation lympha can have:


    +   - Minister petuli veri Falerni

    iger mi calices amoreiores,

    ut lex Postumiae iubet magististrae

    ebrioso acino ebriosior.

    at vos quo lubet hinc quite, lympha

    vini, et merus et ad severos

    higrate. hit meros est Thyanius.


    Attendant boy of little old Falernian, pour me better cups than the drunken grape,
    bids. But depart to where it pleases, waters (or nymphs), the bane of wine, and
