    The popularis ideology of Julius Caesar and Caesar Augustus was a living force
    in 25 CE, when praise of the assassins was a crime of high treason, and in 41
    CE, the Senate hoped to re-establish an optimate republic and the Roman People
    wanted a Caesar to prevent them from doing so. But that soon changed, in part
    thanks to the brilliant success of Lucan’s Pharsalia mythologizing the optimates:
    his Caesar was the tyrannical enemy of freedom, his Cato and Brutus the heroes
    of a doomed noble cause. By the time Tacitus wrote his Annals in the early second
    century, the assassination was simply a historical event after which opposite
    opinions were equally legitimate: ‘to some the worst of acts, to others the finest’.
    Moreover, it is likely that by then Anna’s cult no longer had anything to do with
    the Ides of March.


    About two generations after Silius and Tacitus, the cult site of Anna Perenna
    received two new altars, each inscribed with a short poem in iambic senarii. The
    first is headed ‘to the consecrated nymphs’ and dated at the end to 5 April 156
    CE.


