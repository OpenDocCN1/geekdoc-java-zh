  md: '# Notes pp. 159-162


    41 Bloom, *The Anatomy of Influence*, arrives at a similar conclusion regarding
    Joyce and two of his precursors: “The binding agency that holds together Shakespeare,
    Milton and Joyce, their sense of how meaning gets started, which is always overflow.
    Falstuff, Adam, Satan and [Leopold] Bloom are all troubling because they do not
    declare their own fictiveness. Influence, not is their true function in literary
    history.”


    42. Burgess, *A Shorter Finnegan Wake* (New York: Viking Press, 1967), 13.


    43 Joyce’s use of the word has been variously analysed. According to C. Hart,
    *Structure and Motif in Finnegan Wake** (Evanston: Northwestern University Press,
    1962), 153—an anastomosis represents a duality of being at the heart of the Wake.
    For M. Norris, “The Last Chapter of Finnegan Wake, James Joyce Quarterly 25, no.1
    (1987, pp. 11–30), it is the device which Joyce attempts to bridge the great ontological
    chasms: between time and space, between life and death, between male and female.
    For J. Bishop, *Joyce’s Book of the Finnegan Wake* (Madison: University of Wisconsin
    Press, 1993), 371, and it is a symbol for how the Wake makes us all . . . the
    freshly reinvented “flesh and flood” of body’. For J.H. Miller, *Ariadne’s Thread:
    Story Lines* (New Haven: Yale University Press, 1992), 157, and it has a double
    reference: “one to the invocation of the male in sexual intercourse . . . other
    to the twinkling from navelcord to navelcord which relates us all to mankind and
    ultimately to the great mother of all, Eve.”


    44 N. Kearns, *Iliad’s Dream: Ennius, Virgil and the Mythology of Seduction*,
    HSPh 95 (1993, pp. 257–71).


    45 Modern scholars do, however, gesture toward this verbal resemblance: see see
    J.P. Hallett, *Fathers and Daughters in Roman Society: Women and the Elite Family*
    (Princeton: Princeton University Press, 1984), 181; J. Fisher, *The Annals of
    Quintus Ennius and the Italic Tradition* (Baltimore: Johns Hopkins University
    Press, 2014),


    147. Even more suggestive is the following note on Ennius’s *germana soror* by
    a sixteenth-century commentator: *affectus a generis propiniquate, Vergilius,
    Anna soror*. What is more, *Anna soror* also echoes her poet’s unicaminam adloquitur
    sane sororem* in the previous verse.'
