  md: '# INTRODUCTION


    # Anna and the Plebs: A Synthesis of Primary Evidence


    T.P. Wiseman


    What makes ‘interdisciplinary approaches’ hard to achieve is the sheer volume
    of scholarship accumulated by the separate intellectual traditions – literary,
    historical, archaeological – that claim to offer an understanding of the ancient
    world. Literary scholars concentrate on the great classics, archaeologists on
    the material revealed by excavation; when they try to access each other’s insights,
    neither group can master all the scholarly literature in the other’s field, or
    even judge what counts as a good or bad argument in an unfamiliar intellectual
    environment.


    The problem can be avoided by concentrating our attention on the primary evidence
    – the texts and artefacts that happen to have survived to our own time – on all
    the traditions, in their different ways, ultimately depend. ‘Above all,’ said
    Erasmus,¹‘we must hasten to the sources’ – his phrase *fontes* is particularly
    appropriate in the case of Anna Perenna, at whose sacred spring altars were dedicated
    *gratis fontibus*.²


    # I


    Our best source for the annual festivals of the Roman republic is the calendar,
    discovered in 1915, that was painted on the walls of a room in a Roman villa at
    Antium (modern Anzio) at some time between 84 and 46 BCE.³ Known nowadays as the
    *fasti Antiatiates majores*, the calendar includes annotations for 51 of the days
    of the year, almost all of them naming the deity or deities to whom cult was on
    that day. For the Ideas of March the annotation reads ANN(ae) | PERENNAE, on two
    separate lines.Since the calendar lists multiple cult recipients in asyndeton
    (see for instance the annotation for 8 December, TIBERINO |'
