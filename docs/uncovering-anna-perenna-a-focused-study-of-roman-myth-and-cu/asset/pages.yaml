    August. C.D. 7.3.7


    Since Varro used the term *ignobilis* to describe the humble *deities*,$^{12}$
    may reasonably infer that he thought of the Olympian gods as the divine *nobilitas*.


    Varro’s *Divine Antiquities* were dedicated to Julius Caesar as *pontifex maximus*.$^{13}$
    So was Granius Flaccusus *De indigitimis*, which also dealt with the deities named
    in the books of the *pontifices*.$^{14}$ At about the same time, a work in at
    least three volumes *On the Names of the Gods* was written by a Cornelius who
    may have served under Caesar as quaestor in 48 BCE.$^{15}$ It is worth asking
    why the subject should have been so popular at this time.


    # II


    At the beginning of the republic, oppressed by the domination of the rich and
    powerful,$^{16}$ the plebeians left Rome *in masse* and occupied the Mons Sacer;
    this ‘secession’ was only ended with the creation of plebeian tribunes to protect
    the ordinary citizen against exploitation and the abuse of power. For centuries
    thereafter the republic managed its political differences without violence, but
    in 133 BCE the tribune Tiberius Gracchus was murdered by a public assembly by
    a group of senators and their attendants, and no one was ever prosecuted for the
    crime. From that moment the republic was again ‘split into two parts,’ Cicero
    it$^{17}$ and the use of violence became *commonplace.*$^{18}$ When the inevitable
    civil war came, the *cause of the nobility* prevailed$^{19}$ Sulla drastically
    reduced the tribunes’ powers, effectively reversing the outcome of the secession.


    The rich and powerful now called themselves ‘aristocrats’ (*optimates*, translating
    the Greek *aristoi*), and their opponents on behalf of the Roman People (*populares*)
    were patroningly described as ‘those who wanted their words and needs to be welcome
    to the multitude.’$^{20}$ The historian Sallust, in fact used different terms
    to describe the two sides: the conflict was between an oligarchy (‘the powerful
