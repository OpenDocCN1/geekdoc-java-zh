    to aid a sibling who suffered at the hands of the Aeneas. There is a certain irony
    in their failures in the light of their realms of influence as nymphs. The waters
    from the springs associated with Juturna, both the one near the Numicius, and
    the famous Lacus Juturnae in the Roman Forum, were known for their laborious properties.51
    Furthermore, Juturna has another connection to salvation through her association
    with the Dioscuri. It was alleged that she appeared at funeral in the Forum to
    water their horses on two occasions in Roman history in which they had aided Rome
    in a battle.52 Her primary goal throughout her appearances in the poem is to save
    the life of her brother. In spite of all of her attempts to save Turnus, none
    of them prove fruitful Juturna essentially fails in the one area that her cult
    was known.


