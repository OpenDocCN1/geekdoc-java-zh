    the pontifices that contain the names of the gods and the reasons for their names.
    Varro also states them. For as we said earlier, it is well known that divine powers
    are named after their functions, as for example the god Occator from occatio (harrowing),
    Sarritor from saritio (hoeing), Sterculinius from stercatio (manuring), Sator
    from satis (sowing).


    Serv. on Virg. G. 1.21


    The reference to Varro is evident to his Divine Antiquities, which were written
    precisely to help his fellow citizens understand which deities is to worship,
    and why:


    dicens non modo bene vivere semper omnino neminem posse, si ignoret quisquam si
    fabiter, quis pistor, quis quector, a quo utile petere posset, quem adiatorem
    quandem, quem doctorem; e modo nulli dubium asseras ita esse cognition deorum,
    si ciatur quis deus vim et facultatem at potestatem rei habet


    Not merely a man not live well, [Varro] says, but he cannot live at all if he
    is unaware of who is a craftsman, or a baker, or a plasterer, or who goes to obtain
    what he needs, or whom to call to assist or guide you. He maintains that no one
    doubts that knowledge of the gods is useful only if you know the power, skill,
    and competence which individual gods possess in their particular spheres.


    Var. Antiquitates divinae fr. 3 Cardauns''9


    In Book 14 of the Divineae Antiquities Varro discussed a long sequence of special
    deities under the heading of di certi - presumably gods who were ''certain'' because
    their names and functions were guaranteed by inclusion in the political books.8
    We do not know whether Anna and Peranna were on his list, but Mena (from mensis)
    certainly was, as the month-goddess who looked after menstruation.9


    These one-purpose deities were seized by Christian polemicists eager to ridicule
    pagan beliefs, also by Augustine in the City of God, who had a great admiration
    for Varro and a detailed knowledge of his works.10 It was probable from Varro
    that he took his metaphor of ''plebeian gods'' to distinguish the countless special
    deities from the great Olympians; the latter were dealt with in Book 16 of the
    Divine Antiquities under the heading of de praecipui atque selecti.11 Certainly
    the divine hierarchy reflected the social structure of Varro''s own time:


    in minutis operibus, quae minutatim diis pluribus distribuuta, etiam ipsos selectos
    videamus tamquam senatum cum plebe pariter operari ...'
