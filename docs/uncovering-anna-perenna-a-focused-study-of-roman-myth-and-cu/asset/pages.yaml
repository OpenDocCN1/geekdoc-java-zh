    # Rivalry and Revelation: Ovid’s Elegiac Revision of Virgillian August


    > * I presented the first version of this chapter at the 2014 Annual Meeting of
    the Classical Association of Canada at McGill University in Montréal. It was that
    I had the great fortune of meeting Gwyneth and Jamie McIntyre, two who shared
    my interest in Anna Perenna and with whom I formed a special panel on Anna Perenna
    at the 2015 Annual Meeting of the Classical Association in Bristol. L I wish to
    thank Gwyneth and Jamie, who have been enthusiastic and encouraging companions
    in the pursuit of Anna Perenna. My sincere gratitude extends to the audience members
    and fellow participants from the aforementioned conferences, as well as those
    from the 2016 Annual Meeting of the Classical Association of Canada at the Université
    Laval in Québec City, for their incisive questions and invaluable feedback. And,
    but certainly not least, I am grateful to Alison Keith, Suzanne Lane and my Thiago
    gang (Zoa Alonso Fernández, Lauren Curtis and Naomi Weiss) for offering generous
    feedback on the various incarnations of this material.'
