    of Classics at the University of Arizona. Her research focuses on Greek and Roman
    language and literature, particularly epic, elegiac, and pastoral poetry. She
    is especially interested in the complex negotiation between tradition and innovation
    that characterizes the development of Roman poetry in the first century B.C.E.


