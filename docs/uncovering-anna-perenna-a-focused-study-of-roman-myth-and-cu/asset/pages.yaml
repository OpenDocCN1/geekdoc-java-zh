  md: '# Preface


    ix


    significance of the Carthaginian Anna within Virgil''s Aeneid and Ovid''s Fasti,
    two

    po works argue to celebrate and commemorate Roman foundation and

    tradition. Turning to the Punica of Silius Italicus, James McIntyre demonstrates

    the problematic ambiguity and tension that results from Anna''s Carthaginian

    orig and subsequent role as a Roman goddess. Gwyneth McIntyre highlights

    the challenges of identifying Anna Perenna in artistic depictions and suggests

    ther uncertain identity may provide new insights into our interpretation of

    Rome''s Ara Pacis and a compellingly similar relief from Carthage.


    The three contributions in Part II, ''Anna and her Nymphs'', focus on Anna in

    h divine capacity as a Roman nymph and goddess. David Wright pinpoints

    specific allusions in the Aeneid to Anna''s divine status as a nymph and shows
    how

    Virgil''splay and hymnic language serves to connect her to Juturna. A. Everett

    keeps Ovid''s narrative in the Fasti from the perspective of gender and

    sexuality to argue that Anna''s journey to Italy and apotheosis in the Numicius

    reflect a conventionally masculine, rather than feminine, experience. Anna

    Blenn, by comparing evidence from three votive inscriptions and tabellae

    defexions found within the sanctuary of the goddess Anna Perenna, examines the

    conceptual importance of identity forms and transition to Roman epigraphic expression.


    Another notable identity of Anna forms the underpinning of Part III,

    ''Champion of the Plebs'', in which two contributors explore the ways in which
    her

    deiction as the old woman from Bovillia reflects Roman cultural and political

    sensibilities. Teresa Ramsay analyzes the portrayal of Anna Perenna, a goddess

    bloved by the plebeian class, on a coin minted by Gaius Annius as a strategic

    manipulation designed to secure the loyalty of his troops at a pivotal and perilous

    moment in his military career. Carole Newlands demonstrates how Ovid''s

    treatment of the Fasti provides narratives about Anna that

    hemphasize the centrality of festive, populist traditions and freedom of speech,

    including women''s speech, to Roman tradition.


    By way of conclusion, Part IV, ''The After of Anna Perenna'' presents Justin

    Hudak''s meditation upon influence, in which he demonstrates that an

    important but overlooked source for Finnegan''s Wake the Anna Livia Plurabelle

    (ALP) is the Fasti Anna Perenna, a luminal figure whose exilic status and

    Phoenician associations, together with her fluctuating and unstable identity,

    merit her incorporation into Joyce''s magnum opus. This final contribution

    reveals the potential of reception studies for further investigation and

    templation of Anna Perenna. Indeed, a vast wealth of evidence from post-

    classical literature, opera, and art holds the promise of additional incarnations
    of

    Anna Perenna waiting to be uncovered.'
