    games; so does Ovid in the *Fasti*, and how does Flora''s naked girls a ‘plebeian
    chorus’.⁶¹


    Ovid also used the word *iocus* of the stories of Priapius''s attempt on the nymph
    Lotis, of Faunus''s pursuit of Olympia, of Priapius''s attempt on Vesta, and negatively
    (*no ioc hemi*) of a non-erotic tale involving satyrs.⁶² Since Faun was identified
