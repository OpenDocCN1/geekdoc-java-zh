    supernatural transformations are punitive transformations into subhuman forms),
    and moreover most of these transformations are catalyzed by violence.¹ In particular,
    the apotheoses of female characters are then prompted by sexual assaults; for
    example, Lara is raped by Mercury in her transformation into the goddess Tacita,
    and Chloris is raped by Zephyrus before she is promoted from a minor nymph to
    become the powerful goddess Flora. Apotheosis in the *Fasti* is not a pleasant
    process, and it is fraught with the potential for irreversible violence.


