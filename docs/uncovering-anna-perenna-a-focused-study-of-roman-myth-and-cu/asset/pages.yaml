  md: '# Anna, Water, and Her Imminent Deification in Aeneid 4*


    David J. Wright


    In Book 3 of the *Fasti*, Ovid gives several *aitia* for the cult of Anna Perenna.
    The first and longest *aition* indicates that she is in fact the sister of the
    Carthaginian queen Dido (3.545–654). Several scholars have questioned the validity
    of this origin story and have suggested that Ovid made it up.¹ I, however, argue
    that Ovid did not invent this tradition.² A close reading of *Aeneid* 4 suggests
    that Virgil is in fact aware of this *aition* that associates the goddess with
    the sister of Dido. I present this case by showing Anna’s close association with
    *lympha*, a word for ‘water’ which was connected to *nympha* through popular etymology.
    An acrostic, hitherto unnoticed by scholarship, also suggests a connection of
    Anna with her divine counterpart. There is also a passage with a covert reference
    to the second part of her name, *Perenna*, and another passage that addresses
    Anna with hymnic language as though she were a goddess. These connections between
    Anna and her future status show the popularity of the goddess during the first
    century BCE and allow the audience to draw parallels between herself and another
    tragic figure in the poem, Jaturna.


    One of the ways in which Virgil alludes to Anna Perenna in the construction of
    Anna’s character is through subtle references to Anna Perenna’s status as a nymph.
    While Ovid provides many differing identities for Anna, he explicitly refers to
    her as a *nympha* of the river Numicius (*Fast.* 3.653). Besides the Dido story,
    another one of his identifications suggests that she was thought of as a nymph:


    > inquies ti nymphen Atlanta dicant

    teque Iovi primos, Anna, dedisse cibos.


    You will find those who call you the **nymph** daughter of Atlas, and say that
    you, Anna, gave the first food to Jupiter.


    Fast. 3.659–60'
