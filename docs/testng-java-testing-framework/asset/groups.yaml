- md: "\n# 1. OVERVIEW\n\nTesting is the process of checking the functionality of\
    \ an application to ensure it works as per requirements. Unit testing comes into\
    \ picture at the developer level where adequate measures are taken to test every\
    \ single entity (class or method) to ensure the final product meets the requirements.\n\
    \nJUnit has driven developers to understand the usefulness of tests, especially\
    \ of unit tests, compared to any other testing framework. Leveraging a rather\
    \ simple, pragmatic, and strict architecture, JUnit has been able to 'infect'\
    \ great number of developers. Do a look at our tutorial on JUnit to have a good\
    \ understanding of its features. JUnit, at the same time, has some shortcomings\
    \ as well, which are listed below:\n\n- Initially designed to enable unit testing\
    \ only, now used for all kinds of testing.\n- Cannot do dependency testing.\n\
    - Poor configuration control (setUp/tearDown).\n- Intrusive (forces you to extend\
    \ classes and name your methods a certain way).\n- Static programming model (forces\
    \ you to recompile unnecessarily).\n- The management of different suites of tests\
    \ in complex projects can be very tricky.\n\n# What is TestNG?\n\nDefinition of\
    \ TestNG as per its documentation is as follows:\n\n> TestNG is a testing framework\
    \ inspired by JUnit and JUnit, but introducing some new functionalities that make\
    \ it more powerful and easier to use.\n\nTestNG is an open source automated testing\
    \ framework; NG means NextGeneration. TestNG is similar to JUnit (especially JUnit\
    \ 4), but it is not a JUnit extension. It is inspired by JUnit. It is designed\
    \ to be better than JUnit, especially when testing integrated tests. The creator\
    \ of TestNG is Cedric Beust.\n\nEliminating most of the limitations of the older\
    \ framework, TestNG gives the developer the ability to write more flexible and\
    \ powerful tests. As it heavily borrows from Java Annotations (introduced with\
    \ JDK 5.0) to define tests, it also show you how to use this new feature of the\
    \ Java language in a real production environment.\n\n![](img/949225fa30fb497905c23108e374caa1_5_0.png)\n\
    \n# TestNG Features\n\n- Supports annotations.\n- TestNG uses more Java and OO\
    \ features.\n- Supports testing integrated classes (e.g., by default, no need\
    \ to create a new test class instance for every test method).\n- Separates compile-time\
    \ test code from run-time configuration/data info.\n- Flexible runtime configuration.\n\
    - Introduces 'test groups'. Once you have compiled your tests, you can ask TestNG\
    \ to run all the \"front-end\" tests, or \"fast\", \"slow\", \"database\" tests,\
    \ etc.\n- Supports Dependent test methods, parallel testing, load testing, and\
    \ partial failure.\n- Flexible plug-in API.\n- Support for multi-threaded testing.\n\
    \n# 2. ENVIRONMENT\n\nTestNG is a framework for Java, so the very first requirement\
    \ is to have JDK installed in your machine.\n\n# System Requirement\n\n| | |\n\
    |---|---|\n| JDK | 1.5 or above. |\n| Memory | No minimum requirement. |\n| Disk\
    \ Space | No minimum requirement. |\n| Operating System | No minimum requirement.\
    \ |\n\n# Step 1: Verify Java Installation in Your Machine\n\nOpen the console\
    \ and execute a java command based on the operating system you have installed\
    \ on your system.\n\n| OS | Task | Command |\n|---|---|---|\n| Windows | Open\
    \ Command Console | c:\\> java -version |\n| Linux | Open Command Terminal | $\
    \ java -version |\n| Mac | Open Terminal | machine:~ joseph$ java -version |\n\
    \nLet's verify the output for all the operating systems:\n\n| OS | Output |\n\
    |---|---|\n| Windows | java version \"1.7.0_25\" Java(TM) SE Runtime Environment\
    \ (build 1.7.0_25-b15) Java HotSpot(TM) 64-Bit Server VM (build 23.25-b011, mixed\
    \ |\n\n![](img/949225fa30fb497905c23108e374caa1_7_0.png)\n\n# TestNG\n\n| Linux\
    \ | java version \"1.7.0_25\" Java(TM) SE Runtime Environment (build 1.7.0_25-b15)\
    \ Java HotSpot(TM) 64-Bit Server VM (build 23.25-b001, mixed mode) |\n| Mac |\
    \ java version \"1.7.0_25\" Java(TM) SE Runtime Environment (build 1.7.0_25-b15)\
    \ Java HotSpot(TM) 64-Bit Server VM (build 23.25-b001, mixed mode) |\n\nIf you\
    \ do not have Java, install the Java Software Development Kit (SDK) from http://www.oracle.com/technet/java/javase/downloads/index.html.\
    \ We are assuming Java 1.7.0_25 as the installed version for this tutorial.\n\n\
    # Step 2: Set Java Environment\n\nSet the JAVA_HOME environment variable to point\
    \ to the base directory location, where Java is installed on your machine. For\
    \ example,\n\n| OS | Output |\n|---|---|\n| Windows | Set the environment variable\
    \ JAVA_HOME to C:\\Program Files\\Java\\jdk1.7.0_25. |\n| Linux | Export JAVA_HOME=/usr/local/java-current.\
    \ |\n| Mac | Export JAVA_HOME=/Library/Java/Home. |\n\nAppend Java compiler location\
    \ to System Path.\n\n| OS | Output |\n|---|---|\n| Windows | Append the string\
    \ C:\\Program Files\\Java\\jdk1.7.0_25. |\n\n![](img/949225fa30fb497905c23108e374caa1_5_0.png)\n\
