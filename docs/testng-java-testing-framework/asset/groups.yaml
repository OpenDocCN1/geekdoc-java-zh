- md: "\n# TestNG\n\n# Create Test Case Class\n\n- Create a java test class, say,\
    \ DependencyTestUsingAnnotation.java.\n- Add test methods, testPrintMessage(),\
    \ testSalutationMessage(), and initEnvironmentTest() to your test class, and add\
    \ them to the group \"init\".\n- Add the attribute `dependsOnMethods={\"init.*\"\
    }` to the @Test annotation of `testSalutationMessage()` method.\n\nCreate a java\
    \ class named DependencyTestUsingAnnotation.java in C:\\TestNG_WORKSPACE.\n\n\
    ```java\nimport org.testng.annotations.Test;\nimport org.testng.Assert;\n\npublic\
    \ class DependencyTestUsingAnnotation {\n    String message = \"Manisha\";\n \
    \   MessageUtil messageUtil = new MessageUtil(message);\n\n    @Test(groups =\
    \ { \"init\" })\n    public void testPrintMessage() {\n        System.out.println(\"\
    Inside testPrintMessage()\");\n        message = \"Manisha\";\n        Assert.assertEquals(message,\
    \ messageUtil.printMessage());\n    }\n\n    @Test(dependsOnGroups = { \"init.*\"\
    \ })\n    public void testSalutationMessage() {\n        System.out.println(\"\
    Inside testSalutationMessage()\");\n        message = \"Hi!\" + \"Manisha\";\n\
    \        Assert.assertEquals(message, messageUtil.salutationMessage());\n    }\n\
    \n    @Test(groups = { \"init\" })\n    public void initEnvironmentTest() {\n\
    \        System.out.println(\"This is initEnvironmentTest\");\n    }\n}\n```\n\
    \nIn this example, `testSalutationMessage()` is declared as depending on any group,\
    \ matching the regular expression \"init.*\", which guarantees that the methods\
    \ `testPrintMessage()` and `initEnvironmentTest()` will always be invoked before\
    \ `testSalutationMessage()`.\n\nIf a method depended upon fails, and you have\
    \ a hard dependency on it (alwaysRun=false, which is the default), the methods\
    \ that depend on it are not marked as FAIL but as SKIP. Skipped methods will be\
    \ reported as such in the final report (in a color that is Red nor Green in HTML),\
    \ which is important since skipped methods are not necessarily failures.\n\n#\
    \ Create testing.xml\n\nCreate testing.xml in C:\\TestNG_WORKSPACE to execute\
    \ test case(s).\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
    \ suite SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite name=\"Suite1\">\n\
    \  <test name=\"test1\">\n    <classes>\n      <class name=\"DependencyTestUsingAnnotation\"\
    \ />\n    </classes>\n  </test>\n</suite>\n```\n\nCompile the MessageUtil, Test\
    \ case classes using javac.\n\n```bash\nC:\\TestNG_WORKSPACE>javac MessageUtil.java\
    \ DependencyTestUsingAnnotation.java\n```\n\nNow, run the test.xml, which will\
    \ run the `testSalutationMessage()` method only after the execution of `initEnvironmentTest()`\
    \ method.\n\n```bash\nC:\\TestNG_WORKSPACE>java -cp \"C:\\TestNG_WORKSPACE\" org.testng.TestNG\
    \ test.xml\n```\n\nVerify the output.\n\n```\nThis is initEnvironmentTest\n```\n\
    \n![](img/949225fa30fb497905c23108e374caa1_48_0.png)\n\n```\nInside testPrintMessage()\n\
    Manisha\nInside testSalutationMessage()\nHi!Manisha\n\n============================================\n\
    Suite1\nTotal tests run: 3, Failures: 0, Skips: 0\n============================================\n\
    ```\n\n# dependsOnGroups Vs dependsOnMethods\n\n- On using groups, we are no longer\
    \ exposed to refactoring problems. As long as we don't modify the dependsOnGroups\
    \ or groups attributes, as tests will keep running with the proper dependencies\
    \ up.\n- Whenever a new method needs to be added in the dependency graph, all\
    \ we need to do is put it in the right group and make sure it depends on the correct\
    \ group. We don't need to modify any other method.\n\n![](img/949225fa30fb497905c23108e374caa1_49_0.png)\n\
    \n# 12. PARAMETERIZED TEST\n\nAnother interesting feature available in TestNG\
    \ is **parametric testing**. In most cases, you'll come across a scenario where\
    \ the business logic requires a hugely varying number of tests. Parameterized\
    \ tests allow developers to run the same test over and over again using different\
    \ values.\n\nTestNG lets you pass parameters directly to your test methods in\
    \ two different ways:\n\n- With testng.xml\n- With Data Providers\n\n# Passing\
    \ Parameters with testng.xml\n\nWith this technique, you define the simple parameters\
    \ in the testng.xml file and then reference those parameters in the source files.\
    \ Let us have an example to demonstrate how to use this technique to pass parameters.\n\
    \n# Create Test Case Class\n\n- Create a java test class, say, ParameterizedTest1.java.\n\
    - Add test method `parameterTest()` to your test class. This method takes a string\
    \ as input parameter.\n- Add the annotation @Parameters(\"myName\") to this method.\
    \ The parameter would be passed a value from testng.xml, which we will see in\
    \ the next step.\n\nCreate a java class file named ParameterizedTest1.java in\
    \ C:\\TestNG_WORKSPACE.\n\n```java\nimport org.testng.annotations.Parameters;\n\
    import org.testng.annotations.Test;\n\npublic class ParameterizedTest1 {\n\n \
    \   @Test\n    @Parameters(\"myName\")\n    public void parameterTest(String myName)\
    \ {\n        System.out.println(\"Parameterized value is : \" + myName);\n   \
    \ }\n}\n```\n\n![](img/949225fa30fb497905c23108e374caa1_50_0.png)\n\n# Create\
    \ testing.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
    \ suite SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite name=\"Suite1\">\n\
    \  <test name=\"test1\">\n    <parameter name=\"myName\" value=\"manisha\"/>\n\
    \    <classes>\n      <class name=\"ParameterizedTest1\" />\n    </classes>\n\
    \  </test>\n</suite>\n```\n\nWe can also define the parameter at <test> level.\
    \ Suppose we have myName at both <suite> and <test> levels. In such cases, scoping\
    \ rules apply.\n\nCompile the test case using javac.\n\n```bash\nC:\\TestNG_WORKSPACE>javac\
    \ ParameterizedTest1.java\n```\n\nNow, run the test.xml, which will run.\n\n```bash\n\
    C:\\TestNG_WORKSPACE>java -cp \"C:\\TestNG_WORKSPACE\" org.testng.TestNG test.xml\n\
    ```\n\nVerify the output.\n\n```\nParameterized value is : manisha\n\n============================================\n\
    Suite1\nTotal tests run: 1, Failures: 0, Skips: 0\n============================================\n\
    ```\n\n![](img/949225fa30fb497905c23108e374caa1_51_0.png)\n\n# Passing Parameters\
    \ with DataProviders\n\nWhen you need to pass complex objects or parameters that\
    \ need created from Java (a property file or a database, etc.), parameters can\
    \ be passed using DataProviders.\n\nA Data Provider is a method annotated with\
    \ @DataProvider. This annotation has one string attribute: its name. If the name\
    \ is not supplied, the data provider's name defaults to the method's name. A data\
    \ provider returns an array of objects.\n\nThe following demonstrate how to use\
    \ data providers. The first example is about @DataProvider using Integer.\n\n\
    # Example 1\n\nHere, the @DataProvider passes Integer.\n\n# Create Java class\n\
    \nCreate a class called PrimeNumberChecker. This class checks if the number is\
    \ prime. Create this in C:\\TestNG_WORKSPACE.\n\n```java\npublic class PrimeNumberChecker\
    \ {\n    public Boolean validate(final Integer primeNumber) {\n        for (int\
    \ i = 2; i < (primeNumber / 2); i++) {\n            if (primeNumber % i == 0)\
    \ {\n                return false;\n            }\n        }\n        return true;\n\
    \    }\n}\n```\n\n![](img/949225fa30fb497905c23108e374caa1_52_0.png)\n\n# Create\
    \ Test Case Class\n\n- Create a java test class, say, ParamTestWithDataProvider.java.\n\
    - Define the method `primeNumbers()`, which is defined as a Datvider using the\
    \ annotation. This method returns an array of objects.\n- Add the test method\
    \ `parameterTest()` to your test class. This method takes an Integer and Boolean\
    \ as input parameters. This method validates if the parameter is passed as a prime\
    \ number.\n- Add the annotation @Test(dataProvider = \"test1\") to this method.\
    \ The attribute dataProvider is mapped to \"test1\".\n\n```java\nimport org.testng.Assert;\n\
    import org.testng.annotations.BeforeMethod;\nimport org.testng.annotations.DataProvider;\n\
    import org.testng.annotations.Test;\n\npublic class ParamTestWithDataProvider\
    \ {\n    private PrimeNumberChecker primenNumberChecker;\n\n    @BeforeMethod\n\
    \    public void initialize() {\n        primeNumberNumberChecker = new PrimeNumberChecker();\n\
    \    }\n\n    @DataProvider(name = \"test1\")\n    public static Object[][][]\
    \ primeNumbers() {\n        return new Object[][][] {\n            { 3, true },\n\
    \            { 4, false }\n        };\n    }\n\n    @Test(dataProvider = \"test1\"\
    )\n    public void parameterNumberChecker(Integer primeNumber, Boolean expected)\
    \ {\n        Assert.assertEquals(primeenNumberChecker.validate(primeNumber), expected);\n\
    \    }\n}\n```\n"
