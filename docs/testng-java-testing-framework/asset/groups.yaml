    \ \"tutorialpoint\" to the message\npublic String salutationMessage() {\nmessage\
    \ = \"tutorialpoint\" + message;\nSystem.out.println(message);\nreturn message;\n\
    }\n\n// add \"www.\" to the message\npublic String exitMessage() {\nmessage =\
    \ \"www.\" + message;\nSystem.out.println(message);\nreturn message;\n}\n```\n\
    \n# # Create Test Case Class\n\n+   - Create a java test case, GroupTestExample.java.\n\
    - Add test methods, testPrintMessage() and testSalutationMessage(), and your test\
    \ class.\n- Group the test method in these categories:\n  - Check-in tests (checkintest):\
    \ These tests should be run before you submit new code. They should typically\
    \ be fast and just make sure no functionality is broken.\n  - Functional tests\
    \ (functest): These tests should cover all the functionalities of your software\
    \ and be at least once a day, although ideally you would want to run them continuously.\n\
    \nCreate the java class file named **GroupTestExample.java** in `C:\\TestNG_WORKSPACE`.\n\
    \n![](img/949225fa30fb497905c23108e374caa1_35_0.png)"
