    # 1. 概述


    测试是检查应用程序功能以确保其运行符合需求的过程。单元测试出现在开发者层面，通过采取充分的措施对每一个实体（类或方法）进行测试，以确保最终产品满足需求。


    JUnit 促使开发者理解测试的用处，特别是与其他任何测试框架相比，单元测试的用处。通过利用一种相当简单、务实且严谨的架构，JUnit 已经“感染”大量的开发者。查看我们关于
    JUnit 的教程可以以很好地了解它的功能。同时，JUnit 也有一些缺点，列举如下：


    - 起初设计仅用于启用单元测试，现在被用于各种测试。

    - 无法进行依赖性测试。

    - 配置控制较差（setUp/tearDown）。

    - 具有侵入性（强制你扩展类并以特定方式命名你的方法）。

    - 静态编程模型（迫使你进行不必要的重新编译）。

    - 在复杂项目中管理不同的测试套件可能非常困难。


    # 什么是 TestNG？


    根据其文档，TestNG 的定义如下：


    > TestNG 是一个受 JUnit 和 JUnit 启发的测试框架，但引入了一些新功能，使其更强大且更易用。


    TestNG 是一个开源自动化测试框架；NG 意味着 NextGeneration（下一代）。TestNG 与 JUnit（尤其是 JUnit 4）类似，但它不是
    JUnit 的扩展。它的灵感源于 JUnit。它的设计比 JUnit 更好，特别是在进行集成测试时。TestNG 的创建者是 Cedric Beust。


    消除了旧框架的大多数局限性，TestNG 让开发者能够编写更灵活、更强大的测试。由于因为它大量借鉴了 Java 注解（在 JDK 5.0 中引入）来定义测试，它还向你展示如何在真实的生产环境中使用
    Java 语言的这一新特性。


    ![](img/949225fa30fb497905c23108e374caa1_5_0.png)


    # TestNG 特


    - 支持注解。

    - TestNG 使用更多的 Java 和面向对象特性。

    - 支持集成类的测试（例如，默认情况下，无需为每个测试方法创建新的测试类实例）。

    - 将编译时的测试代码与运行时配置/数据信息分离。

    - 灵活的运行时配置。

    - 引入了“测试分组”。一旦你编译了测试，你可以要求 TestNG 运行所有“前端”测试，或者“快速”、“慢速”、“数据库”测试等。

    - 支持依赖测试方法、并行测试、负载测试和部分失败。

    - 灵活的插件 API。

    - 支持多线程测试。


    # 2. 环境


    TestNG 是一个用于 Java 的框架，因此首要要求是在你的机器上安装 JDK。


    # 系统要求


    | | |

    |---|---|

    | JDK | 1.5 或更高版本。 |

    | 内存 | 无最低要求。 |

    | 磁盘空间 | 无最低要求。 |

    | 操作系统 | 无最低要求。 |


    # 第 1 ：验证你机器上的 Java 安装


    打开控制台并根据你系统上安装的操作系统执行 java 命令。


    | OS | 任务 | 命令 |

    |---|---|---|

    | Windows | 打开命令控制台 | c:\> java -version |

    | Linux | 打开命令终端 | $ java -version |

    | Mac | 打开终端 | machine:~ joseph$ java -version |


    让我们验证所有操作系统的输出：


    | OS | 输出 |

    |---|---|

    | Windows | java version "1.7.0_25" Java(TM) SE Runtime Environment (build 1.7.0_25-b15)
    Java HotSpot(TM) 64-Bit Server VM (build 23.25-b011, mixed |


    ![](img/949225fa30fb497905c23108e374caa1_7_0.png)


    # TestNG


    | Linux | java version "1.7.0_25" Java(TM) SE Runtime Environment (build 1.7.0_25-b15)
    Java HotSpot(TM) 64-Bit Server VM (build 23.25-b001, mixed mode) |

    | Mac | java version "1.7.0_25" Java(TM) SE Runtime Environment (build 1.7.0_25-b15)
    Java HotSpot(TM) 64-Bit Server VM (build 23.25-b001, mixed mode) |


    如果你没有 Java，请从 http://www.oracle.com/technet/java/javase/downloads/index.html 安装
    Java 开发包 (SDK)。在本教程中，我们假设安装的版本为 Java 1.7.0_25。


    # 第 2 ：设置 Java 环境


    将 JAVA_HOME 环境变量指向机器上安装 Java 的基础目录位置。例如，


    | OS | 输出 |

    |---|---|

    | Windows | 将环境变量 JAVA_HOME 设置为 C:\Program Files\Java\jdk1.7.0_25。 |

    | Linux | Export JAVA_HOME=/usr/local/java-current. |

    | Mac | Export JAVA_HOME=/Library/Java/Home. |


    将 Java 编译器位置添加到系统路径 Path 中。


    | OS | 输出 |

    |---|---|

    | Windows | 附加字符串 C:\Program Files\Java\jdk1.7.0_25. |


    ![](img/949225fa30fb497905c23108e374caa1_5_0.png)


    '
