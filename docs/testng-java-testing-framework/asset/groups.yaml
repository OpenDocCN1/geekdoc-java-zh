    \nTestNG, by default, generates multiple reports as part of its test execution.\
    \ These reports mainly include TestNG HTML report, TestNG email-able report, TestNG\
    \ report XML, and JUnit report XML files. These files can be found under the output\
    \ folder (in this case, test-output).\n\nThis default report generation can be\
    \ disabled while running the tests by setting the value of the property setDefaultListeners\
    \ to false. This property can be set using build tools like Ant or Maven.\n\n\
    # JUnit Reports\n\nJUnit is one of those frameworks which were initially used\
    \ by many Java applications as a Test framework. By default, JUnit tests generate\
    \ simple report XML files for its test execution. These XML files can then be\
    \ used to generate any custom reports as per the testing requirement. We can also\
    \ generate HTML reports using the XML files. Ant has a utility task, which takes\
    \ these JUnit XML files as input and generates an HTML report.\n\nTestNG, by default,\
    \ generates JUnit XML reports for any test execution (the test-output folder).\
    \ We can use these XML report files as input for generating a JUnit HTML report.\
    \ Let us take an example.\n\n# Create Test Case Class\n\nCreate a java class,\
    \ say, SampleTest.java in C:\\>TestNG_WORKSPACE.\n\n```\nimport org.testng.Assert;\n\
