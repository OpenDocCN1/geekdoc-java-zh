  - "[PAGE 70]\n\n# TestNG\n\nTestNG, by default, generates multiple reports as part\
    \ of its test execution. These reports mainly include TestNG HTML report, TestNG\
    \ email-able report, TestNG report XML, and JUnit report XML files. These files\
    \ can be found under the output folder (in this case, test-output).\n\nThis default\
    \ report generation can be disabled while running the tests by setting the value\
    \ of the property setDefaultListeners to false. This property can be set using\
    \ build tools like Ant or Maven.\n\n# JUnit Reports\n\nJUnit is one of those frameworks\
    \ which were initially used by many Java applications as a Test framework. By\
    \ default, JUnit tests generate simple report XML files for its test execution.\
    \ These XML files can then be used to generate any custom reports as per the testing\
    \ requirement. We can also generate HTML reports using the XML files. Ant has\
    \ a utility task, which takes these JUnit XML files as input and generates an\
    \ HTML report.\n\nTestNG, by default, generates JUnit XML reports for any test\
    \ execution (the test-output folder). We can use these XML report files as input\
    \ for generating a JUnit HTML report. Let us take an example.\n\n# Create Test\
    \ Case Class\n\nCreate a java class, say, SampleTest.java in C:\\>TestNG_WORKSPACE.\n\
    \n```\nimport org.testng.Assert;\nimport org.testng.annotations.Test;\n\npublic\
    \ class SampleTest {\n    @Test\n    public void testMethodOne(){\n        Assert.assertTrue(true);\n\
    \    }\n\n    @Test\n    public void testMethodTwo(){\n        Assert.assertTrue(false);\n\
    \    }\n\n    @Test(dependsOnMethods={\"testMethodTwo\"})\n```"
- md: "\n```java\npublic void testMethodThree(){\n    Assert.assertTrue(true);\n}\n\
    ```\n\nThe preceding test class contains three test methods out of which testMethodOne\
    \ and testMethodThree will pass when executed, whereas testMethodTwo is made to\
    \ fail by passing a false Boolean value to the Assert.assertTrue method, which\
    \ is used for truth conditions in the tests.\n\n# Create testng.xml\n\nCreate\
    \ testng.xml in C:\\TestNG_WORKSPACE to execute test case(s).\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<suite name=\"Simple Suite\">\n  <test\
    \ name=\"Simple test\">\n    <classes>\n      <class name=\"SampleTest\" />\n\
    \    </classes>\n  </test>\n</suite>\n```\n\nCompile the SampleTest class using\
    \ javac.\n\n```\nC:\\TestNG_WORKSPACE\\javac SampleTest.java\n```\n\nNow, run\
    \ testng.xml.\n\n```\nC:\\TestNG_WORKSPACE>java -cp \"C:\\TestNG_WORKSPACE\" org.testNG.TestNG\
    \ testng.xml\n```\n\nVerify the output.\n\n```\n=============================================\n\
    Simple Suite\nTotal tests run: 3, Failures: 1, Skips: 1\n=============================================\n\
    ```\n\n# TestNG\n\nNow that we have JUnit XML reports available from the above\
    \ execution, let's create a simple Ant build configuration XML file to generate\
    \ HTML report for the test execution.\n\nCreate a new file named build.xml under\
    \ C:\\TestNG_WORKSPACE folder.\n\n```xml\n<project name=\"TestNG_WORKSPACE\" default=\"\
    junit-report\" basedir=\".\">\n<!-- Sets properties variables to point to respective\
    \ directories -->\n<property name=\"junit-xml-dir\" value=\"${basedir}/test-output/junitreports\"\
    />\n<property name=\"report-dir\" value=\"${basedir}/html-report\" />\n\n<!--\
    \ Ant target to generate html report -->\n<target name=\"junit-report\">\n  <!--\
    \ Delete and recreate the html report directories -->\n  <delete dir=\"${report-dir}\"\
    \ failonerror=\"false\"/>\n  <mkdir dir=\"${report-dir}\" />\n  <mkdir dir=\"\
    ${report-dir}/JUnit\" />\n  <!-- Ant task to generate the html report. -->\n \
    \ \n  <junitreport todir=\"${report-dir}/JUnit\">\n    <fileset dir=\"${junit-xml-dir}\"\
    >\n      <include name=\"**/*.xml\" />\n    </fileset>\n    <report format=\"\
    noframes\" todir=\"${report-dir}/JUnit\" />\n  </junitreport>\n</target>\n</project>\n\
    ```\n\nThe preceding XML defines a simple Ant build.xml file having a specific\
    \ Ant target named junit-report that generates a JUnit report when executed. The\
    \ test looks for the JUnit report XML files under the directory\n\n![](img/949225fa30fb497905c23108e374caa1_72_0.png)\n\
    \noutput/junitreports. For the Ant configuration file, the default target to execute\
    \ is configured as junit-report.\n\nOpen the command prompt window and go to the\
    \ C:\\TestNG_WORKSPACE directory in the command prompt and run the command:\n\n\
    ```\nC:\\TestNG_WORKSPACE> ant\n```\n\nOnce executed, a JUnit HTML report will\
    \ be generated in the configured directory /html-report/JUnit. Open the file named\
    \ junit-noframes.html on your default browser. You will see the following HTML\
    \ report:\n\n# Unit Test Results.\n\n![](img/949225fa30fb497905c23108e374caa1_73_0.png)\n\
    \nHere, we have seen how to use the JUnit XML report generated by TestNG and generate\
    \ HTML report using Ant. There are two kinds of reports that can be generated\
    \ using this method: frames and no-frames.\n\nIf the report generation is configured\
    \ with frames, there will be multiple files generated for each class and the main\
    \ report will connect to them through links. A no-frames report consists of a\
    \ single file with all the results of the test execution. This can be configured\
    \ by providing the respective value to the format attribute of the report task\
    \ in Ant.\n\n# 15. PLUG WITH ANT\n\nIn this chapter, we will demonstrate how to\
    \ run TestNG using ANT. Let's follow the steps given below:\n\n# Step 1: Download\
    \ Apache Ant\n\nDownload the latest version of Apache Ant.\n\n| OS | Archive Name\
    \ |\n|---|---|\n| Windows | apache-ant-1.8.4-bin.zip |\n| Linux | apache-ant-1.8.4-bin.tar.gz\
    \ |\n| Mac | apache-ant-1.8.4-bin.tar.gz |\n\n# Step 2: Set Ant Environment\n\n\
    Set the ANT_HOME environment variable to point to the base directory location,\
    \ where ANT libraries are stored on your machine. Let's assume we've stored the\
    \ Ant libraries in the folder apache-ant-1.8.4 folder.\n\n| OS | Output |\n|---|---|\n\
    | Windows | Set the environment variable ANT_HOME to C:\\Program Files\\Apache\
    \ Software Foundation\\apache-ant-1.8.4 |\n| Linux | Export ANT_HOME=/usr/local/apache-ant-1.8.4\
    \ |\n| Mac | Export ANT_HOME=/Library/apache-ant-1.8.4 |\n\nAppend Ant compiler\
    \ location to System Path as follows:\n\n| OS | Description |\n|---|---|\n| Windows\
    \ | Append the string %ANT_HOME%\\bin at the end of the system variable, Path.\
    \ |\n| Linux | Export PATH=$PATH:$ANT_HOME/bin/ |\n| Mac | Not required. |\n\n\
    # Step 3: Download TestNG Archive\n\nDownload the required jar files from www.testng.org.\n\
    \n| OS | Archive name |\n|---|---|\n| Windows | testng-6.8.jar |\n| Linux | testng-6.8.jar\
    \ |\n| Mac | testng-6.8.jar |\n\n# Step 4: Create Project Structure\n\n- Create\
    \ a folder TestNGWithAnt in C:\\TestNG_WORKSPACE.\n- Create a folder src in C:\\\
    TestNG_WORKSPACE\\TestNGWithAnt.\n- Create a folder test in C:\\TestNG_WORKSPACE\\\
    TestNGWithAnt.\n- Create a folder lib in C:\\TestNG_WORKSPACE\\TestNGWithAnt.\n\
    - Create a MessageUtil class in C:\\TestNG_WORKSPACE\\TestNGWithAnt\\src.\n\n\
    ```java\n/*\n * This class prints the given message on console.\n */\nimport org.testng.Assert;\n\
    import org.testng.annotations.Test;\n\npublic class MessageUtil {\n    private\
    \ String message;\n\n    public MessageUtil(String message){\n        this.message\
    \ = message;\n    }\n\n    @Test\n    public void testMessage(){\n        System.out.println(message);\n\
    \    }\n\n    @Test\n    public void testSalutationMessage(){\n        System.out.println(\"\
    Hi!\" + message);\n    }\n}\n```\n\n![](img/949225fa30fb497905c23108e374caa1_76_0.png)\n"
