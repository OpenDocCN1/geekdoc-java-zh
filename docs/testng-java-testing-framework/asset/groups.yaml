    \ HTML 报告：\n\n# 单元测试结果。\n\n![](img/949225fa30fb497905c23108e374caa1_73_0.png)\n\
    \n在这里，我们看到了如何使用 TestNG 生成的 JUnit XML 报告并通过 Ant 生成 HTML 报告。使用这种方法可以生成两种报告：框架（frames）和无框架（no-frames）。\n\
    \n如果报告生成配置为框架，则会为每个类生成多个文件，主报告将通过链接连接到它们。无框架（no-frames）报告包含所有测试执行结果的单一文件。这可以通过向\
    \ Ant 报告任务的 `format` 属性提供相应的值来配置。\n\n# 15. 使用 ANT 插件\n\n在本章中，我们将演示如何使用 ANT 运行\
