    # TestNG


    | | |

    | --- | --- |

    | | after test. This method is guaranteed to run shortly after the last test method
    that belongs to any of these groups is invoked. |

    | @BeforeMethod | The annotated method will be run before each test method. |

    | @AfterMethod | The annotated method will be run after each test method. |

    | @DataProvider | Marks a method as supplying data for a test method. The annotated
    method must return Object[], where each Object[] can be assigned the parameter
    list of the test method. The @Test method that wants to receive data from this
    DataProvider needs to use a DataProvider name equals to the name of this annotation.
    |

    | @Factory | Marks a method as a factory that returns objects that will be used
    by TestNG as Test classes. The method must return Object[]. |

    | @Listeners | Defines listeners on a test class. |

    | @Parameters | Describes how to pass parameters to a @Test method. |

    | @Test | Marks a class or a method as a part of the test. |


    # Benefits of Using Annotations


    Following are some of the benefits of using annotations:


    +   - TestNG identifies the methods it is interested in by looking up annotations.
    Hence, method names are not restricted to any pattern or format.

    - We can pass additional parameters to annotations.

    - Annotations are strongly typed, so the compiler will flag any mistakes right
    away.

    - Test classes no longer need to extend anything (such as TestCase, JUnit 3).


