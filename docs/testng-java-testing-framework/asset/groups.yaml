- md: "\n# Group of Groups\n\nGroups can also include other groups. These groups are\
    \ called MetaGroups. For example, you might want to define a group all that includes\
    \ checkintest and functest. Let's modify our testng.xml file as follows:\n\n```xml\n\
    <xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE suite SYSTEM \"http://testng.org/testng-1.0.dtd\"\
    >\n<suite name=\"Suite1\">\n  <test name=\"test1\">\n    <groups>\n      <define\
    \ name=\"all\">\n        <include name=\"functest\"/>\n        <include name=\"\
    checkintest\"/>\n      </define>\n    </groups>\n    <run>\n      <include name=\"\
    all\"/>\n    </run>\n    <classes>\n      <class name=\"GroupTestExample\" />\n\
    \    </classes>\n  </test>\n</suite>\n```\n\nExecuting the above testng.xml will\
    \ execute all the three tests and will give you the following result:\n\n| Inside\
    \ testPrintMessage() | .com |\n| :--- | :--- |\n| Inside testSalutationMessage()\
    \ | tutorialpoint.com |\n| Inside testExitMessage() | www.tutorialpoint.com |\n\
    | ================================================= | |\n| Suite1 | |\n\nTotal\
    \ tests run: 3, Failures: 0, Skips: 0\n====================================\n\n\
    # Exclusion Groups\n\nYou can ignore a group by using the <exclude> tag as shown\
    \ below:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE suite\
    \ SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite name=\"Suite1\">\n<test\
    \ name=\"test1\">\n<groups>\n<define name=\"all\">\n<exclude name=\"functest\"\
    />\n<include name=\"checkintest\"/>\n</define>\n<run>\n<include name=\"all\"/>\n\
    </run>\n</groups>\n<classes>\n<class name=\"GroupTestExample\" />\n</classes>\n\
    </test>\n</suite>\n```\n\n# 10. EXCEPTION TEST\n\nTestNG provides an option of\
    \ tracing the exception handling of code. You can test whether a code throws a\
    \ desired exception or not. Here the **expectedExceptions** parameter is used\
    \ along with the @Test annotation. Now, let's see @Test(expectedExceptions) in\
    \ action.\n\n# Create a Class\n\nCreate a java class to be tested, say, **MessageUtil.java\
    \ in C:\\TestNG_WORKSPACE**.. Add an error condition inside the printMessage()\
    \ method.\n\n```java\n/*\n* This class prints the given message on console.\n\
    */\npublic class MessageUtil {\n\n    private String message;\n\n    //Constructor\n\
    \    //@param message to be printed\n    public MessageUtil(String message){\n\
    \        this.message = message;\n    }\n\n    // prints the message\n    public\
    \ void printMessage(){\n        System.out.println(message);\n        int a =0;\n\
    \        int b = 1/a;\n    }\n\n    // add \"Hi!\" to the message\n    public\
    \ String salutationMessage() {\n```\n\n```java\nmessage = \"Hi!\" + message;\n\
    System.out.println(message);\nreturn message;\n\n```\n\n# Create Test Case Class\n\
    \n- Create a java test class say, **ExpectedExceptionTest.java**.\n- Add an expected\
    \ exception ArithmeticException to the testWithMessage case.\n\nCreate a java\
    \ class file named **ExpectedExceptionTest.java** in C:\\>TestNG_WORKSPACE.\n\n\
    ```java\nimport org.testng.Assert;\nimport org.testng.annotations.Test;\n\npublic\
    \ class ExpectedExceptionTest {\n    String message = \"Manisha\";\n    MessageUtil\
    \ messageUtil = new MessageUtil(message);\n\n    @Test(expectedExceptions = ArithmeticException.class)\n\
    \    public void testPrintMessage() {\n        System.out.println(\"Inside testPrintMessage()\"\
    );\n        messageUtil.printMessage();\n    }\n\n    @Test\n    public void testSalutationMessage()\
    \ {\n        System.out.println(\"Inside testSalutationMessage()\");\n       \
    \ message = \"Hi!\" + \"Manisha\";\n        Assert.assertEquals(message,messageUtil.salutationMessage());\n\
    \    }\n}\n```\n\n# Create Test Runner\n\nCreate testng.xml in C:\\>TestNG_WORKSPACE\
    \ to execute test case(s).\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<!DOCTYPE suite SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite name=\"\
    Suite1\">\n  <test name=\"test1\">\n    <classes>\n      <class name=\"ExpectedExceptionTest\"\
    \ />\n    </classes>\n  </test>\n</suite>\n```\n\nCompile the MessageUtil, Test\
    \ case classes using javac.\n\n```bash\nC:\\TestNG_WORKSPACE>javac MessageUtil.java\
    \ ExpectedExceptionTest.java\n```\n\nNow, run the Test Runner, which will run\
    \ test cases in the provided Test class.\n\n```bash\nC:\\TestNG_WORKSPACE>java\
    \ -cp \"C:\\TestNG_WORKSPACE\" org.testng.TestNG testng.xml\n```\n\nVerify the\
    \ output. testPrintMessage() test case will passed.\n\n```\nInside testPrintMessage()\n\
    Manisha\nInside testSalutationMessage()\nHi! Manisha\n\n================================================\n\
    Suite1\nTotal tests run: 2, Failures: 0, Skips: 0\n================================================\n\
    \n# 11. DEPENDENCY TEST\n\nSometimes, you may need to invoke methods in a test\
    \ case in a particular order, or you may want to share some data and state between\
    \ methods. This kind of dependency is supported by TestNG, as it supports the\
    \ declaration of explicit dependencies between methods.\n\nTestNG allows you to\
    \ specify dependencies either with:\n\n- Using attribute dependsOnMethods in @Test\
    \ annotations,\n- Using attribute dependsOnGroups in @Test annotations.\n\n# Example\
    \ Using dependsOnMethods\n\n# Create a Class\n\nCreate a java class to be tested,\
    \ say, MessageUtil.java in C:\\TestNG_WORKSPACE.\n\n```java\npublic class MessageUtil\
    \ {\n    private String message;\n\n    // Constructor\n    // @param message\
    \ to be printed\n    public MessageUtil(String message) {\n        this.message\
    \ = message;\n    }\n\n    // prints the message\n    public String printMessage()\
    \ {\n        System.out.println(message);\n        return message;\n    }\n\n\
    \    // add \"Hi!\" to the message\n    public String salutationMessage() {\n\
    \        message = \"Hi!\" + message;\n    }\n}\n```\n\n![](img/949225fa30fb497905c23108e37caa1_43_0.png)\n\
    \n# TestNG\n\n```java\nSystem.out.println(message);\nreturn message;\n}\n```\n\
    \n# Create Test Case Class\n\n- Create a java test class, say, DependencyTestAnnotation.java.\n\
    - Add test methods, testPrintMessage() and testSalutationMessage(), and initEnvironmentTest()\
    \ to your test class.\n- Add attribute dependsOnMethods = {\"initEnvironmentTest\"\
    } to the @Test annotation of method.\n\nCreate a java class name DependencyTestUsingAnnotation.java\
    \ in C:\\TestNG_WORKSPACE.\n\n```java\nimport org.testng.Assert;\nimport org.testng.annotations.Test;\n\
    \npublic class DependencyTestUsingAnnotation {\n    String message = \"Manisha\"\
    ;\n    MessageUtil messageUtil = new MessageUtil(message);\n\n    @Test\n    public\
    \ void testPrintMessage() {\n        System.out.println(\"Inside testPrintMessage()\"\
    );\n        message = \"Manisha\";\n        Assert.assertEquals(message,messageUtil.printMessage());\n\
    \    }\n\n    @Test(dependsOnMethods = {\"initEnvironmentTest\"})\n    public\
    \ void testSalutationMessage() {\n        System.out.println(\"Inside testSalutationMessage()\"\
    );\n        message = \"Hi!\" + \"Manisha\";\n        Assert.assertEquals(message,messageUtil.salutationMessage());\n\
    \    }\n}\n```\n\n![](img/949225fa30fb497905c23108e37caa1_44_0.png)\n\n```java\n\
    @Test\npublic void initEnvironmentTest() {\n    System.out.println(\"This is initEnvironmentTest\"\
    );\n}\n```\n\n# Create testng.xml\n\nCreate testng.xml in C:\\TestNG_WORKSPACE\
    \ to execute test case(s).\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<!DOCTYPE suite SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite name=\"\
    Suite1\">\n  <test name=\"test1\">\n    <classes>\n      <class name=\"DependencyTestUsingAnnotation\"\
    \ />\n    </classes>\n  </test>\n</suite>\n```\n\nCompile the MessageUtil, Test\
    \ case classes using javac.\n\n```bash\nC:\\TestNG_WORKSPACE>javac MessageUtil.java\
    \ DependencyTestUsingAnnotation.java\n```\n\nNow, run the testng.xml, which will\
    \ run the testSalutationMessage() method only after the execution of initEnvironmentTest()\
    \ method.\n\n```bash\nC:\\TestNG_WORKSPACE>java -cp \"C:\\TestNG_WORKSPACE\" org.testng.TestNG\
    \ testng.xml\n```\n\nVerify the output.\n\n```\nThis is initEnvironmentTest\n\
    Inside testPrintMessage()\nManisha\nInside testSalutationMessage()\nHi! Manisha\n\
    ```\n\n![](img/949225fa30fb497905c23108e37caa1_45_0.png)\n\n```\n=============================================\n\
    Suite1\nTotal tests run: 3, Failures: 0, Skips: 0\n=============================================\n\
    ```\n\n# Example Using dependsOnGroups\n\nYou can also have methods that depend\
    \ on entire groups. Let's have an example to demonstrate this.\n\n# Create a Class\n\
    \nCreate a java class to be tested, say, MessageUtil.java in C:\\>\n\n```java\n\
    public class MessageUtil {\n    private String message;\n\n    // Constructor\n\
    \    // @param message to be printed\n    public MessageUtil(String message) {\n\
    \        this.message = message;\n    }\n\n    // prints the message\n    public\
    \ String printMessage() {\n        System.out.println(message);\n        return\
    \ message;\n    }\n\n    // add \"Hi!\" to the message\n    public String salutationMessage()\
    \ {\n        message = \"Hi!\" + message;\n        System.out.println(message);\n\
    \        return message;\n    }\n}\n\n```\n\n![](img/949225fa30fb497905c23108e37caa1_46_0.png)\n"
  mdcn: "\n\n# 组组\n\n组也可以包含其他组。这些组被称为元组（MetaGroups）。例如，你可能想定义一个包含 `checkintest` 和\
