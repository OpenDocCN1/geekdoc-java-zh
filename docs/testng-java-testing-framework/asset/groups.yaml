    test1\">\n    <classes>\n      <class name=\"DependencyTestUsingAnnotation\" />\n\
    \    </classes>\n  </test>\n</suite>\n```\n\n使用 `javac` 编译 `MessageUtil` 和测试用例类。\n\
    \n```bash\nC:\\TestNG_WORKSPACE>javac MessageUtil.java DependencyTestUsingAnnotation.java\n\
    ```\n\n现在运行 `test.xml`，它将在会在执行 `initEnvironmentTest()` 方法之后运行 `testSalutationMessage()`\
    \ 方法。\n\n```bash\nC:\\TestNG_WORKSPACE>java -cp \"C:\\TestNG_WORKSPACE\" org.testng.TestNG\
    \ test.xml\n```\n\n验证输出结果。\n\n```\nThis is initEnvironmentTest\n```\n\n![](img/949225fa30fb497905c23108e374caa1_48_0.png)\n\
    \n```\nInside testPrintMessage()\nManisha\nInside testSalutationMessage()\nHi!Manisha\n\
    \n============================================\nSuite1\nTotal tests run: 3, Failures:\
    \ 0, Skips: 0\n============================================\n```\n\n# dependsOnGroups\
    \ 与 dependsOnMethods\n\n- 使用组（groups）时，我们不再暴露于重构问题。只要我们不修改 `dependsOnGroups` 或\
    \ `groups` 属性，测试将一直保持正确的依赖关系继续运行。\n- 每当需要在依赖图中添加新方法时，我们所做的就是将其放在正确的组中，并确保它依赖于正确的组。我们不需要修改任何其他方法。\n\
    \n![](img/949225fa30fb497905c23108e374caa1_49_0.png)\n\n# 12. 参数化测试\n\nTestNG\
    \ 提供的另一个有趣功能是**参数化测试**。在大多数情况下，你会遇到业务逻辑需要数量差异巨大的测试用例场景。参数化测试允许开发人员使用不同的值多次运行同一个测试。\n\
    \nTestNG 允许你通过两种不同的方式将参数直接传递给测试方法：\n\n- 通过 testng.xml\n- 通过 Data Providers\n\n\
    # 使用 testng.xml 传递参数\n\n通过这种技术，你在 `testng.xml` 文件中定义简单参数，然后在源文件中引用这些参数。让我们有一个示例来演示如何使用这种技术传递参数。\n\
    \n# 创建用例类\n\n- 创建一个 java 测试类，例如 `ParameterizedTest1.java`。\n- 在你的测试类中添加测试方法 `parameterTest()`。该方法接收一个字符串作为输入参数。\n\
    - 为此方法添加注解 `@Parameters(\"myName\")`。该参数将从 `testng.xml` 传递值，我们将在下一步步骤中看到。\n\n\
    在 `C:\\TestNG_WORKSPACE` 中创建一个名为 `ParameterizedTest1.java` 的 java 类文件。\n\n```java\n\
    import org.testng.annotations.Parameters;\nimport org.testng.annotations.Test;\n\
    \npublic class ParameterizedTest1 {\n\n    @Test\n    @Parameters(\"myName\")\n\
    \    public void parameterTest(String myName) {\n        System.out.println(\"\
    Parameterized value is : \" + myName);\n    }\n}\n```\n\n![](img/949225fa30fb497905c23108e374caa1_50_0.png)\n\
    \n# 创建 testing.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
    \ suite SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite name=\"Suite1\">\n\
    \  <test name=\"test1\">\n    <parameter name=\"myName\" value=\"manisha\"/>\n\
    \    <classes>\n      <class name=\"ParameterizedTest1\" />\n    </classes>\n\
    \  </test>\n</suite>\n```\n\n我们也可以在 `<test>` 级别定义参数。假设我们在 `<suite>` 和 `<test>`\
    \ 级别都有 `myName`。在这种情况下，适用作用域规则。\n\n使用 `javac` 编译测试用例。\n\n```bash\nC:\\TestNG_WORKSPACE>javac\
    \ ParameterizedTest1.java\n```\n\n现在运行 `test.xml`，它运行。\n\n```bash\nC:\\TestNG_WORKSPACE>java\
    \ -cp \"C:\\TestNG_WORKSPACE\" org.testng.TestNG test.xml\n```\n\n验证输出结果。\n\n\
    ```\nParameterized value is : manisha\n\n============================================\n\
    Suite1\nTotal tests run: 1, Failures: 0, Skips: 0\n============================================\n\
    ```\n\n![](img/949225fa30fb497905c23108e374caa1_51_0.png)\n\n# 使用 DataProviders\
    \ 传递参数\n\n当你需要传递从 Java（属性文件或数据库等）创建的复杂对象或参数时，可以使用 DataProviders。\n\nData Provider\
    \ 是一个带有 `@DataProvider` 注解的方法。该注解有一个字符串属性：`name`。如果没有提供名称，数据提供者的名称默认为方法名。数据提供者返回数组。\n\
    \n以下演示了如何使用数据提供者。第一个示例是关于 Integer 的 @DataProvider。\n\n# 示例 1\n\n这里 @DataProvider\
    \ 使用 Integer。\n\n# 创建 类\n\n创建一个 PrimeNumberChecker。该类检查数字是否为素数。在 `C:\\TestNG_WORKSPACE`\
    \ 中创建它。\n\n```java\npublic class PrimeNumberChecker {\n    public Boolean validate(final\
