    \n# JUnit 报告\n\nJUnit 是被许多 Java 应用用作测试框架框架之一。默认情况下，JUnit 测试为其执行生成简单的报告 XML 文件。这些\
    \ XML 文件可以根据测试需求生成任何自定义报告。我们还可以使用 XML 文件生成 HTML 报告。Ant 有一个实用任务，可以将 JUnit XML 文件作为输入并生成\
    \ HTML 报告。\n\nTestNG 默认为任何测试执行生成 JUnit XML 报告（test-output 文件夹）。可以使用这些 XML 报告文件作为输入生成\
    \ JUnit HTML 报告。让我们来看例子。\n\n# 创建测试用类\n\n在 C:\\>TestNG_WORKSPACE 中创建一个 Java 类，例如\
