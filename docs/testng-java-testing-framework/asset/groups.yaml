    \ encoding=\"UTF-8\"?>\n<!DOCTYPE suite SYSTEM \"http://testng.org/testng-1.0.dtd\"\
    >\n<suite name=\"Suite1\">\n  <test name=\"test1\">\n    <groups>\n      <define\
    \ name=\"all\">\n        <include name=\"functest\"/>\n        <include name=\"\
    checkintest\"/>\n      </define>\n    </groups>\n    <run>\n      <include name=\"\
    all\"/>\n    </run>\n    <classes>\n      <class name=\"GroupTestExample\" />\n\
    \    </classes>\n  </test>\n</suite>\n```\n\n执行上述 `testng.xml` 将执行所有三个测试，并给你以下结果：\n\
    \n| 在 testPrintMessage() 内部 | .com |\n| :--- | :--- |\n| 在 testSalutationMessage()\
    \ 内部 | tutorialpoint.com |\n| 在 testExitMessage() 内部 | www.tutorialpoint.com |\n\
    | ================================================= | |\n| Suite1 | |\n\n总运行测试数:\
    \ 3，失败: 0，跳过: 0\n====================================\n\n# 排除组\n\n你可以使用下所示的 `<exclude>`\
    \ 标签来忽略某个组：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE suite\
    \ SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite name=\"Suite1\">\n<test\
    \ name=\"test1\">\n<groups>\n<define name=\"all\">\n<exclude name=\"functest\"\
    />\n<include name=\"checkintest\"/>\n</define>\n<run>\n<include name=\"all\"/>\n\
    </run>\n</groups>\n<classes>\n<class name=\"GroupTestExample\" />\n</classes>\n\
    </test>\n</suite>\n```\n\n# 10. 异常测试\n\nTestNG 提供了一个追踪代码异常处理的选项。你可以测试代码是否抛出了预期的异常。在这里，`expectedExceptions`\
    \ 参数与 `@Test` 注解一起使用。现在，让我们看看 `@Test(expectedExceptions)` 的实际用法。\n\n# 创建类\n\n\
    创建一个要测试的 java 类，例如，**C:\\TestNG_WORKSPACE 下的 MessageUtil.java**。在 `printMessage()`\
    \ 方法内部添加一个错误条件。\n\n```java\n/*\n* 此类在控制台上输出打印给定的消息。\n*/\npublic class MessageUtil\
    \ {\n\n    private String message;\n\n    // 构造函数\n    //@param message 将要打印的消息\n\
    \    public MessageUtil(String message){\n        this.message = message;\n  \
    \  }\n\n    // 打印消息\n    public void printMessage(){\n        System.out.println(message);\n\
    \        int a =0;\n        int b = 1/a;\n    }\n\n    // 向消息中添加 \"Hi!\"\n   \
    \ public String salutationMessage() {\n```\n\n```java\nmessage = \"Hi!\" + message;\n\
    System.out.println(message);\nreturn message;\n\n```\n\n# 创建用例类\n\n- 创建一个 java\
    \ 测试类，例如 **ExpectedExceptionTest.java**。\n- 在 `testWithMessage` 测试用例中添加预期的异常 `ArithmeticException`。\n\
    \n在 C:\\TestNG_WORKSPACE 中创建一个名为 **ExpectedExceptionTest.java** 的 java 类文件。\n\n\
    ```java\nimport org.testng.Assert;\nimport org.testng.annotations.Test;\n\npublic\
    \ class ExpectedExceptionTest {\n    String message = \"Manisha\";\n    MessageUtil\
    \ messageUtil = new MessageUtil(message);\n\n    @Test(expectedExceptions = ArithmeticException.class)\n\
    \    public void testPrintMessage() {\n        System.out.println(\"Inside testPrintMessage()\"\
    );\n        messageUtil.printMessage();\n    }\n\n    @Test\n    public void testSalutationMessage()\
    \ {\n        System.out.println(\"Inside testSalutationMessage()\");\n       \
    \ message = \"Hi!\" + \"Manisha\";\n        Assert.assertEquals(message,messageUtil.salutationMessage());\n\
    \    }\n}\n```\n\n# 创建测试运行\n\n在 C:\\TestNG_WORKSPACE 中创建 `testng.xml` 以执行测试用例。\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE suite SYSTEM \"\
    http://testng.org/testng-1.0.dtd\">\n<suite name=\"Suite1\">\n  <test name=\"\
    test1\">\n    <classes>\n      <class name=\"ExpectedExceptionTest\" />\n    </classes>\n\
    \  </test>\n</suite>\n```\n\n使用 `javac` 编译 `MessageUtil` 和测试用例类。\n\n```bash\n\
    C:\\TestNG_WORKSPACE>javac MessageUtil.java ExpectedExceptionTest.java\n```\n\n\
    现在，运行测试 Runner，它将运行提供的 Test 类中的测试用例。\n\n```bash\nC:\\TestNG_WORKSPACE>java -cp\
    \ \"C:\\TestNG_WORKSPACE\" org.testng.TestNG testng.xml\n```\n\n验证输出。`testPrintMessage()`\
    \ 测试用例将通过。\n\n```\nInside testPrintMessage()\nManisha\nInside testSalutationMessage()\n\
    Hi! Manisha\n\n================================================\nSuite1\n总运行测试数:\
    \ 2，失败: 0，跳过: 0\n================================================\n\n# 11. 依赖测试\n\
