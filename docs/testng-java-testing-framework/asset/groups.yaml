    \ 和 `initEnvironmentTest()` 方法在 `testSalutationMessage()` 执行之前总是会被调用。\n\n如果被依赖的方法失败，且你对它有硬依赖（`alwaysRun=false`，这是默认值），则依赖于它的方法不会被标记为\
