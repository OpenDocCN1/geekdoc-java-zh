  - "[PAGE 34]\n\nGroup test is a new innovative feature in TestNG, which doesn’t\
    \ exist in JUnit framework. It permits you to dispatch methods into proper portions\
    \ and perform sophisticated groupings of test methods.\n\nNot only can you declare\
    \ those methods that belong to groups, but you can also specify groups contain\
    \ other groups. Then, TestNG can be invoked and asked to include a certain set\
    \ of groups (or regular expressions), while excluding another set.\n\nGroup tests\
    \ provide maximum flexibility in how you partition your tests, and doesn't require\
    \ you to recompile if you want to run two different sets of tests back to back.\n\
    \nGroups are specified in your testng.xml file using the <groups> tag. It can\
    \ be found either under the <test> or <suite> tag. Groups specified in the suite>\
    \ tag apply to all the <test> tag underneath.\n\nNow, let's take an example to\
    \ see how group test works.\n\n# Create a Class\n\nCreate a java class to be tested,\
    \ say, MessageUtil.java in C:\\TestNG_WORKSPACE.\n\n```\n/*\n * This class prints\
    \ the given message on console.\n */\npublic class MessageUtil {\n    private\
    \ String message;\n\n    // Constructor\n    // @param message to be printed\n\
    \    public MessageUtil(String message) {\n        this.message = message;\n \
    \   }\n\n    // prints the message\n    public String printMessage() {\n```"
