  - '[PAGE 17]


    # 4. BASIC ANNOTATIONS


    The traditional way to indicate test methods in JUnit 3 is by prefixing their
    names with test. This is a very effective method for tagging certain methods in
    a class as having a special meaning, but the naming doesn''t scale well (if we
    want to add more tags for different frameworks?) and is rather inflexible (if
    we want to pass additional parameters to the testing framework?).


    Annotations were formally added to the Java language in JDK 5, and TestNG made
    the choice to use annotations to annotate test classes.


    Here is the list of annotations that TestNG supports:


    | Annotation | Description |

    | --- | --- |

    | @BeforeSuite | The annotated method will be run once before all tests in this
    suite have run. |

    | @AfterSuite | The annotated method will be run once after all tests in this
    suite have run. |

    | @BeforeClass | The annotated method will be run once before the first test method
    in the current class is invoked. |

    | @AfterClass | The annotated method will be run once after all the test methods
    in the current class have run. |

    | @BeforeTest | The annotated method will be run before any test method belonging
    to the classes inside the <test> tag is run. |

    | @AfterTest | The annotated method will be run after all the test methods belonging
    to the classes inside the <test> tag have run. |

    | @BeforeGroups | The list of groups that this configuration method will run before.
    This method is guaranteed to run shortly before the first test method that belongs
    to any of these groups is invoked. |

    | @AfterGroups | The list of groups that this configuration method will run |'
