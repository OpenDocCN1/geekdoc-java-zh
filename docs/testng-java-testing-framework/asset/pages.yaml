  md: "# 11. DEPENDENCY TEST\n\nSometimes, you may need to invoke methods in a test\
    \ case in a particular order, or you may want to share some data and state between\
    \ methods. This kind of dependency is supported by TestNG, as it supports the\
    \ declaration of explicit dependencies between test methods.\n\nTestNG allows\
    \ you to specify dependencies either with:\n\n+   - Using attribute dependsOnMethods\
    \ in @Test annotations, OR\n- Using attribute dependsOnGroups in @Test annotations.\n\
    \n# Example Using dependsOnMethods\n\n# Create a Class\n\nCreate a java class\
    \ to be tested, say, MessageUtil.java in C:\\TestNG_WORKSPACE.\n\n```\npublic\
