  md: "# TestNG\n\nNow that we have JUnit XML reports available from the above execution,\
    \ let's create a simple Ant build configuration XML file to generate HTML report\
    \ for the test execution.\n\nCreate a new file named build.xml under C:\\>TestNG_WORKSPACE\
    \ folder.\n\n```\n<project name=\"TestNG_WORKSPACE\" default=\"junit-report\"\
    \ basedir=\">\n<!-- Sets properties variables to point to respective directories\
    \ -->\n<property name=\"junit-xml-dir\" value=\"${basedir}/test-output/junitreports\"\
    />\n<property name=\"report-dir\" value=\"${basedir}/html-report\" />\n\n<!--\
    \ Ant target to generate html report -->\n<target name=\"junit-report\">\n  <!--\
    \ Delete and recreate the html report directories -->\\n  <delete dir=\"${report-dir}\"\
    \ failonerror=\"false\"/>\n  <mkdir dir=\"${report-dir}\" />\n  <mkdir dir=\"\
    ${report-dir}/JUnit\" />\n  <!-- Ant task to generate the html report. -->\n \
    \ todir Directory to generate the output reports\n\n  <fileset Directory to look\
    \ for the junit xml reports.\n\n  report defines the type of format to be generated.\n\
    \  Here we are using \"noframes\" which generates a single html report.\n  -->\n\
    \n  <junitreport todir=\"${report-dir}/JUnit\">\n    <fileset dir=\"${junit-xml-dir\"\
    >\n      <include name=\"**/*.xml\" />\n    </fileset>\n    <report format=\"\
    noframes\" todir=\"${report-dir}/JUnit\" />\n  </junitreport>\n</target>\n</project>\n\
    ```\n\nThe preceding XML defines a simple Ant build.xml file having a specific\
    \ Ant target named junit-report that generates a JUnit report when executed. The\
    \ test looks for the JUnit report XML files under the directory\n\n![](img/949225fa30fb497905c23108e374caa1_72_0.png)"
