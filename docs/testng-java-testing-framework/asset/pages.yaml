  md: "# 13. RUN JUNIT TESTS\n\nNow that you have understood TestNG and its various\
    \ tests, you must be worried by now and as to how to refactor your JUnit code.\
    \ There's no need to worry, as TestNG provides a way to shift from JUnit to TestNG\
    \ at your own pace. You can execute your existing JUnit test cases using TestNG.\n\
    \nTestNG can automatically recognize and run JUnit tests, so that you can use\
    \ TestNG as a runner for all your existing tests and write new tests using TestNG.\
    \ All you have to do is put JUnit library on the TestNG classpath, so it can find\
    \ and use JUnit classes, change your runner from JUnit to TestNG in Ant, and then\
    \ run TestNG in \"mixed\" mode. This way, you can have all your tests in the same\
    \ project, and start using TestNG. This approach also allows you to convert your\
    \ existing Tshirt tests to TestNG incrementally.\n\nLet us have an example to\
    \ demonstrate this amazing ability of TestNG.\n\n# Create JUnit Test Case Class\n\
    \nCreate a java class, which is a JUnit test class, TestJUnit.java in C:\\TestNG_WORKSPACE.\n\
    \n```\nimport org.junit.Test;\nimport static org.testng.AssertJUnit.assertEquals;\n\
    \npublic class TestJUnit {\n    @Test\n    public void testAdd() {\n        String\
    \ str= \"JUnit testing using TestNG\";n        assertEquals(\"JUnit testing using\
    \ TestNG\",str);\n    }\n}\n```\n\nNow, let's write the test.xml in C:\\TestNG_WORKSPACE,\
    \ which would contain the <suite> tag as:\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<!DOCTYPE suite SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite\
    \ name=\"Converted JUnit suite\" >\n```\n\n![](img/949225fa30fb497905c23108e374caa1_58_0.png)"
