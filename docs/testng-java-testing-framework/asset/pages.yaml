  md: "# 7. SUITE TEST\n\nA test suite is a collection of test cases intended to test\
    \ a behavior or a set of behaviors of software program. In TestNG, we cannot define\
    \ a suite in testing source code, but it is represented by one XML file, as suite\
    \ is the feature of execution. It also allows flexible configuration of the tests\
    \ to be run. A suite can contain one or more tests and is defined by the <suite>\
    \ tag.\n\n<suite> is the root tag of testng.xml. It describes a test suite, which\
    \ in is made of several <test> sections.\n\nThe following table lists all the\
    \ legal attributes <suite> accepts.\n\n| Attribute | Description |\n| --- | ---\
    \ |\n| name | The name of this suite. It is a mandatory attribute. |\n| verbose\
    \ | The level or verbosity for this run. |\n| parallel | Whether TestNG should\
    \ run different threads to run this suite. |\n| thread-count | The number of threads\
    \ to use, if parallel mode is enabled (ignored other-wise). |\n| annotations |\
    \ The type of annotations you are using in your tests. |\n| time-out | The default\
    \ timeout that will be used on all the test methods found in this test. |\n\n\
    In this chapter, we will show you an example having two test classes, Test1 &\
    \ Test2, to run together using Test Suite.\n\n# Create a Class\n\nCreate a java\
    \ class to be tested, say, MessageUtil.java in C:\\JUNIT_WORKSPACE.\n\n```\n/*\n\
