  md: "# 12. PARAMETERIZED TEST\n\nAnother interesting feature available in TestNG\
    \ is **parametric testing**. In most cases, you'll come across a scenario where\
    \ the business logic requires a hugely varying number of tests. Parameterized\
    \ tests allow developers to run the same test over and over again using different\
    \ values.\n\nTestNG lets you pass parameters directly to your test methods in\
    \ two different ways:\n\n+   * With testng.xml\n* With Data Providers\n\n# Passing\
    \ Parameters with testng.xml\n\nWith this technique, you define the simple parameters\
    \ in the testng.xml file and then reference those parameters in the source files.\
    \ Let us have an example to demonstrate how to use this technique to pass parameters.\n\
    \n# Create Test Case Class\n\n+   * Create a java test class, say, ParameterizedTest1.java.\n\
    * Add test method parameterTest() to your test class. This method takes a string\
    \ as input parameter.\n* Add the annotation @Parameters(\"myName\") to this method.\
    \ The parameter would be passed a value from testng.xml, which we will see in\
    \ the next step.\n\nCreate a java class file named ParameterizedTest1.java in\
    \ C:\\>TestNG_WORKSPACE.\n\n```\nimport org.testng.annotations.Parameters;\nimport\
    \ org.testng.annotations.Test;\n\npublic class ParameterizedTest1 {\n\n    @Test\n\
    \    @Parameters(\"myName\")\n    public void parameterTest(String myName) {\n\
    \        System.out.println(\"Parameterized value is : \" + myName);\n    }\n\
    }\n```\n\n![](img/949225fa30fb497905c23108e374caa1_50_0.png)"
  merge: -1
