  md: "# Create testng.xml\n\nCreate testng.xml in C:\\TestNG_WORKSPACE to execute\
    \ test case(s).\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?><DOCTYPE suite\
    \ SYSTEM\n\"http://testng.org/testng-1.0.dtd\">\n<suite name=\"Suite1\">\n  <test\
    \ name=\"test1\">\n    <parameter name=\"myName\" value=\"manisha\"/>\n    <classes>\n\
    \      <class name=\"ParameterizedTest1\" />\n    </classes>\n  </test>\n</suite>\n\
    ```\n\nWe can also define the parameters at the <suite> level. Suppose we have\
    \ defined myName at both <suite> and <test> levels. In such cases, regular scoping\
    \ rules apply. It means that any class inside <test> tag will see the value of\
    \ parameter defined in <test>, while the classes in the rest of the testng.xml\
    \ file will see the test case defined in <suite>.\n\nCompile the test case using\
    \ javac.\n\n```\nC:\\TestNG_WORKSPACE>javac ParameterizedTest1.java\n```\n\nNow,\
    \ run testng.xml, which will run the Parameterized method. TestNG will try to\
    \ find a parameter named myName first in the <test> tag, and then, if it can't\
    \ find it, it searches in the <suite> tag that encloses it.\n\n```\nC:\\TestNG_WORKSPACE>java\
    \ -cp \"C:\\TestNG_WORKSPACE\" org.testng.TestNG\ntestng.xml\n```\n\nVerify the\
    \ output.\n\n```\nParameterized value is : manisha\n\n=============================================\n\
    Suite1\nTotal tests run: 1, Failures: 0, Skips: 0\n```\n\n![](img/949225fa30fb497905c23108e374caa1_51_0.png)"
