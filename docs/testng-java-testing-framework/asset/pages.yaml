    ```

    C:\TestNG_WORKSPACE> ant

    ```


    Once executed, a JUnit HTML report will be generated in the configured directory
    /html-report/JUnit. Open the file named junit-noframes.html on your default browser.
    You will see the following HTML report:


    # Unit Test Results.


    ![](img/949225fa30fb497905c23108e374caa1_73_0.png)


    Here, we have seen how to use the JUnit XML report generated by TestNG and generate
    HTML report using Ant. There are two kinds of reports that can be generated using
    this method: frames and no-frames.


    If the report generation is configured with frames, there will be multiple files
    generated for each class and the main report will connect to them through links.
    A no-frames report consists of a single file with all the results of the test
    execution. This can be configured by providing the respective value to the format
    attribute of the report task in Ant.'
