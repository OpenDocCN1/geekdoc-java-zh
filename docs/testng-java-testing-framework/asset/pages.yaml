  md: '# About the Tutorial


    TestNG is a testing framework developed in the lines of JUnit and NUnit, however
    it introduces some new functionalities that make it more powerful and easier to
    use.


    TestNG is designed to cover all categories of tests: unit, functional, end-to-end,
    integration, etc., and it requires JDK 5 or higher.


    This tutorial provides a good understanding of TestNG framework needed to test
    an enterprise-level application to deliver it with robustness and reliability.


    # Audience


    This tutorial is designed for software professionals interested in learning the
    features of TestNG Framework in simple and easy steps and implement it in practice.


    # Prerequisites


    Before proceeding with this tutorial, you should have a basic understanding of
    Java programming language, text editor, and execution of programs, etc. As you
    are going to use TestNG to handle all levels of Java project testing, it will
    be helpful if you have a prior knowledge of software development and software
    testing processes.


