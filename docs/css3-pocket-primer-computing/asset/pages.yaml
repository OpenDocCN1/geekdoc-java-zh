    As you can probably see, CSS Grid Layout supports sophisticated layout defi-


    nitions whose layout is far from obvious. For example, the following selector


    specifies four columns and three rows:


    body {


    grid-columns: * * (0.5in * *)[2];


    grid-rows: 20% *;


    columns:3; column-gap:0.5in;


    }


    The preceding CSS selector contains the following information:


    • An explicit grid is specified


    • The parenthetical expression is a repeating pattern


    • The integer in square brackets is the number of repetitions


    • The asterisk syntax represents a proportional length, which means that


    each “*” is assigned equal space allocation


    You can get additional information from the CSS Grid Layout specification


    (work in progress) at: *http://dev.w3.org/csswg/css3-grid-layout/* and *http://*


    *www.w3.org/TR/css3-grid/*.


    **IMPROVING HTML5 WEB PAGE PERFORMANCE**


    Performance is always an important consideration, and although a detailed


    and lengthy discussion is beyond the constraints of this book, it’s important
    to


    be aware of some of the techniques that are available:


    • Concatenate JavaScript/CSS files into a single file


    • Use file compression (minification)


    • Use of spritesheets


    • Use base64 encoding of images


    • Defer the loading of JavaScript files


    A good blog post regarding the use of base64 for encoding images is here:


    *http://davidbcalhoun.com/2011/when-to-base64-encode-images-and-when-*


    *not-to?goback=%2Egde_2071438_member_234328886*.


    You can defer the loading of JavaScript files by placing <script> tags at the


    end of the <body> element in a Web page.


    Load CSS stylesheets asynchronously, as shown here: *http://filamentgroup.*


    *github.io/loadCSS/test/preload.html*.


    You can also explore RequireJS, which is a JavaScript toolkit for asynchro-


