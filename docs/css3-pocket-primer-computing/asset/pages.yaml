    **QUICK OVERVIEW OF CSS3 FEATURES**


    CSS3 adopts a modularized approach involving multiple specifications for


    extending existing CSS2 functionality as well as supporting new functionality.


    The following link contains a list of all the completed specifications and drafts


    by the CSS WG (specifications and Working Groups are discussed in Chapter


    1), along with their current status:


    *https://www.w3.org/Style/CSS/current-work.en.html.*


    In brief, CSS3 enables you to create boxes with rounded corners and


    shadow effects; create rich graphics effects using linear and radial gradients;


    detect portrait and landscape mode; detect the type of mobile device using


    media query selectors; and produce multicolumn text rendering and format-


    ting.


    In addition, CSS3 enables you to define sophisticated node selection rules


    in selectors using pseudo-classes, first or last child (:ﬁ rst-child, :last-


    child, :ﬁ rst-of-type, and :last-of-type), and also pattern-matching


    tests for attributes of elements. Several sections in this chapter contain exam-


    ples of how to create such selection rules.


    **CSS3 PSEUDO CLASSES AND ATTRIBUTE SELECTION**


    This brief section contains examples of some pseudo-classes, followed by


    snippets that show you how to select elements based on the relative position


    of text strings in various attributes of those elements. Although this section


    focuses on the :nth-child() pseudo-class, you will become familiar with


    various other CSS3 pseudo-classes, and in the event that you need to use those


    pseudo-classes, a link is provided at the end of this section which contains


    more information and examples that illustrate how to use them.


    CSS3 supports an extensive and rich set of pseudo-classes, including


    nth-child(), along with some of its semantically related “variants,” such


    as nth-of-type(), nth-ﬁ rst-of-type(), nth-last-of-type(), and


    nth-last-child().'
