    **LINE SEGMENTS, RECTANGLES, CIRCLES, AND SHADOW EFFECTS**


    This section contains an assortment of code samples that illustrate how to


    render 2D shapes in HTML5 Canvas. There are many concepts introduced


    in this section, so before delving into the code sample, let’s look at some of


    the HTML5 Canvas APIs that are used in this section. Chapter 2 contains a


    section that describes various ways for specifying colors, and the material in


    that section is relevant for the code sample in this chapter (so you can quickly


    review its contents now if you need to do so).


    HTML5 Canvas provides the ﬁ llRect() method for rendering a rectan-


    gle, which requires four parameters: the upper-left vertex (defined by its x-


    coordinate and its y-coordinate) of the rectangle, the width of the rectangle,


    and the height of the desired rectangle. The Canvas ﬁ llRect() API looks


    like this:


    context.fillRect(x, y, width, height);


    HTML5 Canvas allows you to render line segments by specifying the (x,y)


    coordinates of the two endpoints of a line segment. The two new APIs that are


    used in the code sample in this section are moveTo() and lineTo(), and they


    look like this:


    context.moveTo(x1, y1);


    context.lineTo(x2, y2);


    The preceding code snippet represents the line segment whose two endpoints


    are specified by the points (x1, y1) and (x2, y2). Note that you can also


    render the same line segment with the following code snippet:


    context.moveTo(x2, y2);


    context.lineTo(x1, y1);'
