    is very intuitive and easy to remember, especially in comparison to the syntax


    for an HTML4 <!DOCTYPE> element (try to construct one from memory!).


    This markup is backward compatible: it triggers standards mode in all browsers


    that have standards mode (versus quirks mode) and it also tells the browser to


