    **Rotate Transforms**


    The CSS3 transform attribute allows you to specify the rotate() func-


    tion in order to create scaling effects, and its syntax looks like this:


    rotate(someValue);


    You can replace someValue with any number. When someValue is positive,


    the rotation is clockwise; when someValue is negative, the rotation is counter-


    clockwise; and when someValue is zero, there is no rotation effect. In all cases


    the initial position for the rotation effect is the positive horizontal axis.


    The HTML5 Web page Rotate1.html and the CSS stylesheet Rotate1.


    css on the companion disc illustrate how to create rotation effects, a sample


    of which is shown here:


    img.imageL:hover {


    transform : scale(2) rotate(-45deg);


    }


    The img selector that specifies a transition attribute creates an animation ef-


    fect during a one-second interval using the ease timing function, as shown here:


    transition: transform 1.0s ease;


