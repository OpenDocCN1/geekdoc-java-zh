    following sites: *http://www.jqueryrain.com/2015/10/jquery-drawsvg-animate-*


    *svg-paths/* and *http://www.justinmccandless.com/blog/Patching+jQuery’s+Lac*


    *k+of+SVG+Support*.


    **A BRIEF COMPARISON OF SVG AND CSS3**


    This section briefly summarizes the features that are common to SVG and


    CSS3 and also the features that are unique to each technology. Chapters 6 and


    7 contain code samples that illustrate some of the features that are summarized


    in this section.


    SVG and CSS3 both provide support for the following:


    • Linear and radial gradients


    • 2D graphics and animation effects


    • The ability to create shapes such as rectangles, circles, and ellipses


    • WAI-ARIA


    SVG provides support for the following features that are not available in CSS3:


    • Bezier curves


    • Hierarchical object definitions


    • Custom glyphs


    • Rendering text along an arbitrary path


    • Defining event listeners on SVG objects


    • Programmatic creation of 2D shapes using JavaScript


    • “Accessibility” to XML-based technologies and tools'
