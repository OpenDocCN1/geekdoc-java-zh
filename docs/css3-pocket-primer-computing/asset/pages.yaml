    **CSS Mask and Performance**


    A CSS Mask results in a new offscreen buffer (OSB). Next, the GPU first


    writes to the OSB instead of directly to VRAM (Video RAM), after which the


    OSB contents are copied to VRAM. However, VRAM is comparatively limited


    on mobile devices and it’s “easily exhausted,” which can lead to performance


    degradation. Keep in mind that CSS rounded corners and drop shadows use


    mask, which is why they can be slow. Moreover, the combination of rounded


    corners and drop shadows is extra slow.


    **WHAT ARE REFLOW AND REPAINT?**


    Reflow is the process of calculating the position of elements in a Web page,


    whereas Repaint is the re-rendering of pixel colors in a Web page. In CSS,


    display:none causes a reflow and also a repaint because it is neither pre-


    sent nor visible in a Web page. On the other hand, visibility:hidden is


    still present, which means no geometry change, and hence only a repaint is


    required.


    The painting process (browser combines DOM and CSSOM, or CSS Ob-


    ject Model) involves “Skia” for rasterizing software with Canvas-like APIs, and


    the output is a set of bitmaps. Next, the bitmaps are sent to the GPU and the


    GPU composites them (calculates pixel values). Finally, the GPU renders the


    output on screen. When you want to change the position of an element, the


    transform property is more efficient because it’s handled directly in the GPU,


    and no repaint is involved. On the other hand, a combination of the ‘left’ and


    ‘top’ properties causes a reflow as well as a repaint.


    **Causes of Reﬂ ow and Repaint**


    The following effects result in a reflow and repaint in Web pages:


    scroll and hover


    box-shadow and drop shadows


    floats and tables


    opacity and gradients


    border-radius


    transparency and transitions


    changing the font size


    leaf-side nodes: probably small changes


    top-side nodes: propagation can cause many changes


    add/remove/update the DOM


    Even “routine” operations that add, remove, or update elements in the DOM


    will cause a reflow and repaint in a Web page. Thus, it’s probably impossible
