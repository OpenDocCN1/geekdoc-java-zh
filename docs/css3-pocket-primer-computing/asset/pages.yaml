    **Selecting a File Format**


    As you know, SVG is a vector-based format, whereas other file formats in-


    volve binary data. Despite the advantages of SVG, there are several perfor-


    mance-related points to keep in mind. First, the process of rendering SVG in a


    browser is slower (partly because of the conversion process) than small binary


    files. Second, bitmaps on mobile devices involve the GPU, whereas SVG on


    mobile devices does not always involve the GPU. Third, use a tool for optimiz-


    ing SVG files (as well as binary files).


    With the preceding points in mind, SVG is well-suited for assets in a Web


    page that need to be scalable (SVG will always render them without “jaggies”).


    If scalability is not a requirement, then PNG files are an option. JPEG files
    are


    well-suited for photographs.


    A good description of various file formats (and their trade-offs) is available


    here: *https://forums.adobe.com/thread/1640828*.


    **Optimizing SVG and Binary Files**


    The following website is useful for optimizing SVG files (and also pro-


    vides downloadable command-line versions of the tool): *https://jakearchibald.*


    *github.io/svgomg/*.


    You can also optimize binary assets using command-line tools such as this


    one: *https://imageoptim.com/command-line.html*.


    The following link contains a tabular-based comparison of the compression


    rates of binary files by several tools: *http://jamiemason.github.io/ImageOptim-*


    *CLI/*.


    **CSS Spritesheets**


    CSS spritesheets involve the creation of one binary image that contains


    multiple binary images. Only a single HTTP request is required for download-


    ing one spritesheet, which is more efficient than multiple HTTP requests for


    downloading the individual images separately.


    A particular image in a spritesheet is rendered in a Web page by specify-


    ing the relative offset of the image in the spritesheet. Manually calculating


    the offsets is a tedious and error-prone process. Fortunately, there are online


    tools that create spritesheets and automatically calculate the necessary offsets


    for the individual images. One commercial tool (USD 20 for a single user) is


    Zwoptext, and its home page is here: *https://zwopple.com/zwoptex/*.


    SpriteMe is a free tool for generating spritesheets and the accompanying


    CSS, and its home page is here: *www.spriteme.org*.'
