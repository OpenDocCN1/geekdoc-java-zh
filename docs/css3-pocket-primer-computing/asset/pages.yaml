    **CSS3 ADVANCED FEATURES**


    The CSS3 examples in this book have been tested in WebKit-based brows-


    ers, and you use browser-specific prefixes (which were discussed briefly in


    Chapter 1) to insert the CSS3 code for other browsers. In addition, some of the


    code samples in this chapter are rendered in Google Canary, and sometimes


    in a nightly build of WebKit, which will be noted accordingly. When this book


    goes to print, it’s possible that this functionality will be available in the
    general


    Chrome distribution.


    There are several CSS features that have been under active development,


    and most (possibly all) of them are available in WebKit-based browsers. In


    many cases, the W3C specification for each of the new CSS features is a “work


    in progress,” so it’s possible that they will be modified by the time you read
    this


    book. Check a website such as www.caniuse.com for information about the


    latest feature support in your browser of choice.


    Among the advanced (and in some cases experimental) features are:


    **1\.** CSS Flexbox


    **2\.** CSS Blending


    **3\.** CSS Compositing


    **4\.** CSS Exclusions


    **5\.** CSS Regions


    With the preceding points in mind, a list of some of the latest CSS3 features


    is here:


    • CSS Canvas backgrounds (Webkit and FF)


    • CSS device adaptation (IE10)


    • CSS Exclusions (IE10)


    • CSS Filters (IE10 and Webkit)


    • CSS Flexbox (IE10)


    • CSS Grid (IE10 and Webkit)


    • CSS Regions (IE10 and Webkit)


    • CSS Custom Filters (Webkit)


    • CSS Templates (IE10)


    CSS Flexbox is the only feature in the preceding list that is covered in this


    chapter. You will also see some CSS Flexbox code samples and screenshots that


    illustrate how to create graphics effects. You can find the status for the other


    CSS features by navigating to their respective home pages.


    **CSS FLEXBOX (FLEXIBLE BOX)**


    CSS supports several layout models, such as block, inline, table, and po-


    sitioned layout models. In addition, CSS supports the CSS Flexbox (Flexible


    Box) model, and you will see some examples in this section.'
