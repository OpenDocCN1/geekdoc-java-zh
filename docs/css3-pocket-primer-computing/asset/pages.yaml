    **WHAT IS GOOD MOBILE DESIGN?**


    The answer to this simple question is more complex than you might think,


    but there are some guidelines to help you make design decisions for hybrid


    HTML5 mobile applications (and also native applications, such as iOS and


    Android, which are outside the scope of this book). As you will see, some of


    these guidelines include touch-orientation, performance and responsiveness,


    detecting screen sizes, resizing assets, and determining the actual content.


    The next several sections provide more information about these and other


    important factors, and then discuss toolkits or provide code snippets that can


    help you implement the desired functionality.


    **IMPORTANT FACETS OF MOBILE WEB DESIGN**


    Some of the important considerations for designing hybrid HTML5 mobile


    applications are here:


    • A touch-oriented design (not mouse-oriented)


    • Improving response times of user gestures


    • Detecting different screen sizes (especially for Android devices)


