    **BROWSER-SPECIFIC PREFIXES FOR CSS3 PROPERTIES**


    Browser-specific prefixes are for CSS properties that are “works in pro-


    gress” for individual browsers, and the final specification drops browser-spe-


    cific prefixes. Although more recent versions of modern browsers no longer


    require prefixes (discussed later in this section), it’s worth learning about
    the


    prefixes for two reasons: a) you might encounter older code that contains


    browser-specific prefixes, and b) older websites that generate CSS gradients


    tend to produce code that contains unnecessary browser-specific prefixes.


    The browser-specific prefixes –ie-, -moz-, and -o- are for Internet Ex-


    plorer, Firefox, and Opera, respectively. Note that Opera also supports –web-


    kit- prefixes, and it’s possible that other browsers will do the same (check the


    respective websites for updates).


    As an illustration, the following code block shows examples of these


    prefixes:


    -ie-webkit-border-radius: 8px;


    -moz-webkit-border-radius: 8px;


    -o-webkit-border-radius: 8px;


    border-radius: 8px;


    In your CSS selectors, specify the attributes with browser-specific prefixes


    before the “generic” attribute, which serves as a default choice in the event


    that the browser-specific attributes are not selected. The CSS3 code samples


    in this book contain WebKit-specific prefixes, which helps us keep the CSS


    stylesheets manageable in terms of size. If you need CSS stylesheets that work


    on multiple browsers (for current versions as well as older versions), there


    are essentially two options available. One option involves manually adding the


    CSS3 code with all the required browser-specific prefixes, which can be tedi-


    ous to maintain and also error-prone. Another option is to use CSS toolkits or


    frameworks (discussed in the next chapter) that can programmatically gener-


    ate the CSS3 code that contains all browser-specific prefixes.


    Finally, an extensive list of browser-prefixed CSS properties is here:


    *http://peter.sh/experiments/vendor-prefixed-css-property-overview/*.


    In the case of color gradients (discussed in Chapter 3), you no longer need


    a browser-specific prefix for the latest versions of Chrome, Firefox, IE 10+,


    Opera, and Safari. Additional CSS properties will become “prefix free” as mod-


    ern browsers evolve in terms of feature support. Fortunately, the following


    open source project enables you to specify prefix-free properties in your code:


    *http://leaverou.github.io/prefixfree/*.


    The preceding code inserts browser-specific prefixes only when it’s neces-


    sary to do so, which alleviates the tediousness of performing this task manually.


