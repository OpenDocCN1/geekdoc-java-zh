    **IMPROVING RESPONSE TIMES OF USER GESTURES**


    There are several toolkits for eliminating the 300-millisecond delay be-


    tween the first touch event and the second touch event. The first JavaScript


    toolkit with nice touch-related functionality is fastclick.js, and its home


    page is here: *https://github.com/ftlabs/fastclick.*


    Mobile browsers wait about 300 milliseconds after an initial tap event in


    order to determine if users will perform a double tap. Since FastClick elimi-


    nates the 300-millisecond delay between a physical tap and the firing of a click


    event on mobile browsers, mobile applications feel more responsive.


    Listing 9.1 displays the contents of the HTML5 Web page FastClick1.


    html, which illustrates how to use fastclick.js in a Web page.


    ***LISTING 9.1 FastClick1.html***


    <html>


    <head>


    <meta charset="utf-8">


    <script src=''/path/to/fastclick.js''></script>


    </head>


    <body>


    <script>


    window.addEventListener(''load'', function() {


    FastClick.attach(document.body);


    }, false);


    </script>


    </body>


    </html>


    Listing 9.1 is straightforward: include a <script> element that references


    fastclick.js and then add an event listener that invokes the attach() method


    of fastclick.js during a browser load event.


