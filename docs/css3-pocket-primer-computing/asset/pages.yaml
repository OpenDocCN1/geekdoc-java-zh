    SVG provides a) 2D graphics/animation, b) some GPU support, c) the abil-


    ity to create arbitrary 2D shapes, d) custom <pattern>s, and e) grouping via the


    <g> element, and “easing functions in D3 (but SVG cannot animate HTML).


    Canvas provides a) 2D graphics/animation, b) GPU support, c) the ability


    to update many small objects (games), and d) the option of working with video


    (use ThreeJS/WebGL for 3D animation).


    CSS3+SVG is useful when a) you already have SVG-based data and b) you


    must support IE6 (this can be done with the Raphael toolkit but not D3).


    CSS3+D3 is good for modern browsers and is also easier for defining event


    handlers and animation (probably also easier to maintain/enhance).


    However, keep in mind that CSS3+SVG might not have GPU support (and


    perhaps consider D3 with BackboneJS/AngularJS/etc.).


    Use CSS3 to create 3D animation effects with SVG as follows:


    Step #1: create an SVG document


    Step #2: create an SVG <defs> element


    Step #3: create CSS3 selectors with CSS3 3D animation effects and put


    them in a <style> element


    Step #4: insert the <style> element in the <defs> element


    Step #5: set the “class” attribute in SVG elements so that it matches a CSS3


    selector in the <style> element


    Note that you can also reference an external CSS stylesheet in an SVG docu-


    ment.


    Modern browsers support the <canvas> element. Use CSS3 with HTML5


    Canvas by inserting a <canvas> element in a Web page and then use JavaS-


    cript APIs to create 2D shapes, all of which are rendered in a <canvas>


    element. Keep in mind that HTML5 <canvas> does not provide a DOM.


    However, CSS3 selectors can match the HTML5 <canvas> element. An ar-


    ticle that explains how to trace Canvas calls is here: *http://www.html5rocks.*


    *com/en/tutorials/canvas/inspection/*.


    **Which Is Faster: CSS3/Canvas/SVG?**


    HTML5 Canvas is often faster than SVG for showing polygons and many


    small objects, but CSS3 is faster than Canvas for simple animation: *http://*


    *phrogz.net/tmp/image_move_speed.html*.


    Moreover, CSS3 is faster than SVG for gradients, and D3 is better/faster


    than SVG for “follow the mouse.” The preceding rules are general guidelines:


    make sure that you test/compare the performance characteristics of a Web


    page, especially if you develop for mobile devices.


