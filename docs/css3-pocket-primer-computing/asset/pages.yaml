    *Browsers must be able to use the driver of the graphics card that is*


    *installed on the host OS, and GPU acceleration for one browser on a given*


    *machine doesn’t guarantee support for all browsers.*


    Web pages can contain CSS selectors that cause changes in the position of


    HTML elements. Browsers handle positional changes via two significant op-


    erations that can adversely affect performance: repainting and reflow. Repaint-


    ing involves the calculation of new pixel values (which can be off-loaded to the


    GPU), and reflow involves calculating the new positions of HTML elements.


    Note that some CSS-based effects, such as changing the opacity of an element,


    requires repainting but not reflow if the element does not change its position.


    Chrome’s DevTools provides an “Enable paint flashing” to view the repainting


    process: when this feature is enabled, green boxes appear around repainted


    areas. The GPU handles the calculation of pixel values by performing some-


    thing called “compositing” that involves the creation of one or more “compos-


    ite layers.” These layers are “blended together” in order to combine various


    effects. You can think of the composite layers as a stack of parallel planes with


    different colored pixels, and the compositing process as the calculation of the


    final color of each pixel when the planes are superimposed on each other. The


    GPU creates a separate composite layer in the following cases: 3D or perspec-


    tive CSS transforms, <video> or <canvas> elements, CSS filters, and over-


    lapping elements extracted to a composite layer (such as a z-index).


    There is also a size limit in the number of compositing layers that can be


    created, so it’s possible to create animation effects that exhaust the GPU mem-


    ory. Fortunately, Chrome’s DevTools provide a “Show layer border” option


    that displays each composite layer with an orange border.


    One point to keep in mind is that the compositing process is most efficient


    for changes on elements that can be performed directly in the GPU. Specifi-


    cally, changes to elements via transform, opacity, or filter can be handled di-


    rectly by the GPU.


    Chrome switches on hardware compositing mode (if supported and not


    already “on”). Chrome creates a new layer and “backing surface,” which is a


    graphics context (aka texture) into which layers are drawn. Backing surfaces


    are uploaded to the GPU, and layers sometimes share the same “backing sur-


    face.” Chrome creates a new backing surface if a layer:


    **1\.** Uses 3D or perspective transform CSS properties


    **2\.** Is used by a <video> element using accelerated video decoding


    **3\.** Is used by a <canvas> element with a 3D context or accelerated 2D


    context


    **4\.** Uses a CSS animation for its opacity or uses an animated transform


    **5\.** Uses accelerated CSS filters


    **6\.** Has a descendant that is a compositing layer


    **NOTE**'
