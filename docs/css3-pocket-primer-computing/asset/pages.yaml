    **CSS3 RADIAL GRADIENTS**


    CSS3 radial gradients are more complex than CSS3 linear gradients, and


    you can use them to create more complex gradient effects.


    A radial gradient requires at least two color stops, and its syntax is here:


    background: radial-gradient(shape size at position, color1,


    ..., last-color);


    The default value for shape is ellipse; the default value for size is far-


    thest-corner; and the default value for position is center.


    A simple example of a radial gradient is here:


    background: radial-gradient(red, yellow, green);


    The preceding code snippet renders “evenly spaced” radial gradients, which is


    the default behavior. An example that specifies offset values for the color stops


    is here:


    background: radial-gradient(red 25%, yellow 50%, green 60%);


    The preceding code snippet renders the color red at the position that is


    25% from the beginning of the radial gradient, yellow at the halfway point,


    and green at the 60% position.


    The HTML5 Web page RadialGradient1.html and the CSS stylesheet


    RadialGradient1.css are not shown here, but the full listing is available on


    the companion disc. The essence of the code in the HTML5 code involves this


    code block:


    <div id="outer">


    <div id="radial3">Text3</div>


    <div id="radial2">Text2</div>


