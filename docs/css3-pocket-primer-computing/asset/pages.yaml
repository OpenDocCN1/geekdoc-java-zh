    **HOW WAS THE CODE FOR THIS BOOK TESTED?**


    The code samples in this book have been tested in a Google Chrome brows-


    er (version v51) on a Macbook Pro with OS X 10.14\. Unless otherwise noted,


    no special browser-specific features were used, which means that the code


    samples ought to work in Chrome on other platforms, and also in other mod-


    ern browsers. Exceptions are due to limitations in the cross-platform availabil-


    ity of specific features of SVG itself. Although the code also works in several


    earlier versions of Chrome on a Macbook Pro, you need to test the code on


    your platform and browser (especially if you are using Internet Explorer).


    Another point to keep in mind is that all references to “Web Inspector”


    refer to the Web Inspector in Chrome, which differs from the Web Inspector


    in Safari. If you are using a different (but still modern) browser or an early
    ver-


    sion of Chrome, you might need to check online for the sequence of keystrokes


    that you need to follow to launch and view the Web Inspector. Navigate to this


    link for additional useful information:


    *http://benalman.com/projects/javascript-debug-console-log/*


    **WHY DOES THIS BOOK HAVE 200 PAGES INSTEAD OF 500 PAGES?**


    This book is part of the *Pocket Primer*  *Series* whose books are generally


    between 200 and 250 pages. Second, the target audience consists of readers


    ranging from beginners to intermediate in terms of their knowledge of HTML


    and JavaScript. At the same time, one of the primary rules of exposition of vir-


    tually any kind is “show, don’t tell.” While this rule is not taken literally
    in this


    book, it’s the motivation for showing first and telling second. If the adage “a


    picture is worth a thousand words” is true, then this book endeavors to provide


    both the pictures and the words.


    **COMPANION DISC**


    The companion disc included with the book contains all the code samples


    to save you time and effort from the error-prone process of manually typing


    code into an HTML Web page. In addition, there are situations in which you


    might not have easy access to companion disc. Furthermore, the code samples


    in the book provide explanations that are not available on the companion disc.


    *All of the files on the companion disc are available for downloading by writing*


    *to the publisher at info@merclearning.com.*


    **DOES THIS BOOK CONTAIN PRODUCTION-LEVEL CODE SAMPLES?**


    The primary purpose of the code samples in this book is to illustrate various


    features of CSS3\. Clarity has higher priority than writing more compact code


    that is more difficult to understand (and possibly more prone to bugs). If you


    decide to use any of the code in this book in a production website, you ought'
