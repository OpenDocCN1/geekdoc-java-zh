    **CSS3 3D TRANSITIONS (FIX EXAMPLE)**


    A CSS transition is an animation effect on a CSS property for a specified


    duration. The default value for the duration of a CSS transition effect is 0\.


    Hence, a transition will not occur unless you specify the duration of a CSS


    transition.


    Listing 4.3 displays the contents of 3DTransition1.html, which uses


    CSS3 transitions that trigger transforms in response to “hover” events.


    ***LISTING 4.3 3DTransition1.html***


