    ![](img/0a6af518702639b3a358cdd75f17af79_50_0.png)


    Browsers read selectors right-to-left: this is a “bottom up” approach, and


    the “key” selector is the right-most part of a CSS selector. Right-to-left is
    more


    efficient because the relationship of element:parent is one-to-one, whereas the


    relationship of parent:child is many-to-one.


    As an illustration, consider the following CSS and HTML fragment:


    #mylist a { ... }


    <ul id="mylist">


    <li a=... class="abc" .../>


    <li a=... class="abc" .../>


    <li a=... class="abc" .../>


    ….


    </ul>


    Now suppose you have 100 <a> elements, and you want to select the three <a>


    elements that have a class attribute whose value is abc. This CSS selector


    matches the complete set of 100 <a> elements (which is not what you want):


    #mylist a { ... }


    On the other hand, the following CSS selector matches *only* the three desired


    elements:


    #mylist .abc { ... }


    A sample selector with efficient CSS involving calculate/layout/paint is here:


    .results h2 { // recalculate style


    height: 25px; // layout


    text-shadow: 2px black; // paint


    }


    A slightly older (but still useful) video by Paul Irish about Performance Tool-


    ing that covers performance-related topics is here: *http://www.youtube.com/*


    *watch?v=HAqjyCH_LOE.*


    **The translate() Function versus Top/Left Properties**


    The factors in favor of translate() include that fact that a) trans-


    late() does not “touch” the DOM, and b) translate()involves subpixels,


    which produces smoother effects (partly due to blurring). On the other hand,


    favor the use of top/left/right/bottom instead of translate() when an ele-


    ment has relative/absolute/fixed positioning in a Web page.


    Keep in mind that *both* techniques can yield different results on different


    browsers. The following detailed articles (by Chris Coyier and by Paul Irish)


    contain additional information:


    *http://css-tricks.com/tale-of-animation-performance/* and


    *http://www.paulirish.com/2012/why-moving-elements-with-translate-is-*


    *better-than-posabs-topleft/*.'
