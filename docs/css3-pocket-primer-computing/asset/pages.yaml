    is red) and an end color of #000000 (which is black), then the resultant color


    gradient will range—in a radial fashion—from red to black. Radial gradients


    can also contain multiple start/stop color combinations. The point to keep in


    mind is that radial gradients change colors in a *linear* fashion, but the rendered


    colors are drawn in an expanding *radial* fashion. Note that “radial gradient”


    and “radial color gradient” are used interchangeably in this book.


