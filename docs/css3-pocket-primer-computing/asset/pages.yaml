    an author-specified path. You define a CSS Motion Path in a CSS selector by


    specifying the motion-path property, whose value involves an actual path in the


    path() function. CSS Motion Paths support four properties: motion (a short-


    hand for motion-path), motion-offset (a position on a motion-path), motion-


    path (an SVG-like path for animation), and motion-rotation (the direction of


    an element on a motion path).'
