    **Use CSS to Style Input Fields Differently**


    There are two steps involved. The first step is to apply the default styling


    and then apply your own styling rules. The second step is to use the [type=]


    attribute selector to apply different styles to different input fields.


    As a specific example you can use the -webkit-appearance property to


    remove the default styling for all input elements, as shown here:


    input, textarea, select {


    -webkit-appearance: none;


    }


    Next, specify your own CSS styles that depend on the type of input field, as


    outlined here:


    input[type=checkbox]


    /* specify styles for checkbox */


    }


    input[type=radio] {


    /* specify styles for radio */


    }


    input[type=textarea] {


    /* specify styles for textarea */


    }


    You can use the preceding example as a guideline for defining CSS selectors to


    change the appearance of other HTML elements in your Web pages.


    **Specify Keyboard Types for Input Fields**


    HTML5 introduced the following new properties for the type attribute for


    input elements:


    an email address: type=''email''


    a website address: type=''url''


    telephone number: type=''tel''


    The preceding types only work on mobile browsers (nothing will happen in a


    laptop or desktop browser).


    The following example shows you how to specify different keyboards for


    input fields:


    <form id="form1" name="form1" method="post" action="">


    <label for="name">Name:</label><input name="name" id="name"


    type="text" /><br />


    <label for="email">Email:</label><input name="email"


    id="email" type="email" /><br />


    <label for="phone">Phone:</label><input name="phone"


    id="phone" type="tel" /><br />'
