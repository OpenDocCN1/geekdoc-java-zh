    CHAPTER 7


    *SVG ESSENTIALS*


    T


    his fast-paced chapter delves into many features of SVG, which is an


    XML-based technology for rendering 2D shapes. Entire books have


    been written about SVG, and one chapter about SVG is not enough to


    become really proficient. As a sort of compromise, the code samples contain


    multiple SVG features that will save you time from having to develop them


    by yourself. For instance, the code sample that contains SVG transforms and


    gradients does not provide a detailed description of these SVG features be-


    cause you have already encountered transforms and gradients in the first sev-


    eral chapters of this book. Consequently, you already know the concepts, and


    it’s primarily a case of learning the SVG syntax for creating such effects. At
    the


    same time, feel free to focus on the sections that illustrate the SVG features


    that are of greatest interest to you.


    In case you didn’t already know, SVG has recently become the focus of con-


    siderable interest in Web development, in part because its feature set works


    well with CSS3\. In addition, you can use SVG instead of PNG files (discussed


    in Chapter 8). SVG also provides functionality that is unavailable in CSS3, such


    as support for arbitrary polygons, elliptic arcs, and quadratic and cubic Bezier


    curves. Moreover, you can easily combine SVG with CSS3 selectors in order to


    create 3D graphics and animation effects.


    The first part of this chapter contains code samples that illustrate how to


    render lines and rectangles, and also how to create linear gradients and radial


    gradients. The second part of this chapter discusses polygonal shapes and the


    highly versatile SVG <path> element.


    The third section contains Bezier curves with SVG transforms, how to ren-


    der text in SVG, and SVG filters. The final section contains examples of work-


    ing with various combinations of SVG, CSS3, and jQuery, followed by a brief


    comparison of SVG and CSS3.'
