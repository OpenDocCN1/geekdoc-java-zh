    Flexbox is a single-direction layout concept whereby flex items are placed


    in horizontal rows or in vertical columns. The ﬂ ex-direction property speci-


    fies the main axis, which in turn defines the horizontal or vertical direction
    in


    which flex items are placed in the flex container. The default value of ﬂ ex-


    direction is row, which means that items are placed from left-to-right and


    from top-to-bottom (i.e., the order in which we read text on a page).


    Here are the other values for ﬂ ex-direction:


    row-reverse: if the writing-mode specifies left-to-right, then the flex


    items will be laid out in a right-to-left fashion


    column: if the writing system is horizontal, the flex items will be placed


    vertically


    column-reverse: analogous to the column property, except the order is


    reversed


    The CSS Flexbox model also enables you to expand the children of a flexbox to


    fill unused space, as well as shrink the children to avoid overflowing the parent.


    Moreover, you can create different layouts for different flexboxes in the same


    HTML Web page.


    **An Assortment of Flexbox Properties**


    Some useful flexbox properties that do not require prefixes include: box-


    align, box-ﬂ ex, box-ordinal-group, box-pack, and  ﬂ ex-ﬂ ow.


    The box-align property (as well as other Flexbox properties) supports val-


    ues such as start, end, center, baseline, and stretch, all of which enable


    you to specify the alignment of the elements in a flexbox. For example, start
    and


    end will left-justify and right-justify, respectively, a set of elements in a
    flexbox.


    The box-ﬂ ex property enables you to assign a greater relative weight to


    an element in a flexbox. The box-ordinal-group property enables you to


    change the default ordering of a set of elements in a flexbox. You can also use


    the display property and specify the value box.


    You can use Flexbox properties to perform additional tasks:


    • Use order to arrange flexbox children


    • Use flex-basis to define dimensions on flexbox children


    • Resize flexbox children correctly with flex-shrink and flex-grow


    • Use flex-wrap and align-content to create grids


    The next section contains an example of a Web page that contains some of the


    preceding Flexbox properties.


    **A WEB PAGE WITH FLEXBOX PROPERTIES**


    Listing 8.1 displays the contents of SimpleFlexboxWK1.html and Listing


    8.2 displays the contents of SimpleFlexboxWK1.css, which illustrate how to


    use the flexbox properties in the list at the beginning of this section.'
