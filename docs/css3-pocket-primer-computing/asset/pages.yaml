    **HOW TO MAKE CSS SELECTORS MORE EFFICIENT**


    The first part of this section compares two CSS selectors that look very


    similar, yet they have different results. The second section discusses the trade-


    offs between using the translate() function versus top/left properties in


    Web pages.


