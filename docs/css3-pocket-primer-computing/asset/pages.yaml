    Archimedean spiral. A fragment is shown here:


    var svgNS = "http://www.w3.org/2000/svg";


    function drawSpiral(event) {


    for(angle=0; angle<maxAngle; angle+=angleDelta) {


    ellipseNode = svgDocument.createElementNS(svgNS,


    "ellipse");


    ellipseNode.setAttribute("ﬁ ll", redColor);


    ellipseNode.setAttribute("stroke-width",


    strokeWidth);


    ellipseNode.setAttribute("stroke", "yellow");


    ellipseNode.setAttribute("cx", currentX);


    ellipseNode.setAttribute("cy", currentY);


    ellipseNode.setAttribute("rx", majorAxis);


    ellipseNode.setAttribute("ry", minorAxis);


    gcNode.appendChild(ellipseNode);


    }


    }


    The SVG document ArchEllipses1.svg contains a CDATA section with a


    <script> element, which in turn contains the drawSpiral() function whose


    main loop renders a set of dynamically created SVG <ellipse> elements.


    Each SVG <ellipse> element is created in the SVG namespace that is speci-


    fied in the variable svgNS, after which values are assigned to the required


    attributes of an ellipse. After each SVG <ellipse> element is dynamically


    created, the element is appended to the DOM.'
