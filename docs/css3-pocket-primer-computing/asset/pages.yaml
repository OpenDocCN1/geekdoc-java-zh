  md: 'CHAPTER 1


    *HTML5 FEATURES*


    T


    his chapter introduces you to some features of HTML5 and HTML5-


    specific elements for semantic markup. You will also learn about some


    websites that provide useful information, such as browser support for


    HTML5 features, and also get some information about the W3C and the


    WHATWG standards groups.


    One question must be addressed before you read this chapter: why does


    this CSS3 book contain an introductory chapter about HTML5? First, CSS


    exists entirely inside the context of a website: unlike JavaScript, there is no


    “server side” CSS. Second, there are many technologies that are considered


    part of the HTML5 “umbrella,” and they vary considerably in terms of the


    complexity of their associated APIs. Third, it’s certainly possible that you will


    encounter JavaScript (if you haven’t already) and also need to learn some ru-


    dimentary aspects of JavaScript. In fact, when such content is deemed rel-


    evant and useful, some of the chapters in this book contain JavaScript-related


    sections (often marked “optional”).


    The first part of this chapter introduces HTML5, browser support, and two


    HTML5 Working Groups. The second part describes the technologies that


    are part of HTML5, differences between HTML4 and HTML5, some useful


    online tools, and feature detection. The third part of this chapter shows you
    a


    simple HTML5 website, new HTML5 elements, and Semantic Markup. The


    final part of this chapter introduces you to WAI ARIA, experimental features,


    and mobile support.


    Another point to keep in mind is that there are multiple modern browsers


    available, all of which provide very good support for HTML and CSS. How-


    ever, due to space and time limitations and the number of topics to cover,


    Chrome was chosen as the primary browser to test the code samples in this


    book. Although the code samples in this particular book will most likely work'
