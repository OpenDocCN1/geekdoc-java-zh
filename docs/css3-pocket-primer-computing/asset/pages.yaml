    **BASIC FEATURES OF SVG**


    SVG supports linear gradients, radial gradients, filter effects, transforms


    (translate, scale, skew, and rotate), Bezier curves, and animation ef-


    fects. You can create SVG documents with code for rendering shapes, or you


    can embed SVG directly in an HTML Web page. SVG elements are inserted


    into the DOM of a Web page, which means that it’s possible to track/manage


    groups of SVG elements. Some advantages of SVG include:


    • No blurred/jagged edges when zooming in


    • Convenient format for import/export between tools


    • Can apply XSL stylesheets to SVG documents


    On the other hand, keep in mind that SVG is verbose, and can be difficult


    to read in SVG documents that are programmatically generated. In addition,


    nontrivial animation effects can be cumbersome: consider using D3 for creat-


    ing animation and handling mouse-related events. Although this chapter fo-


    cuses on “pure” SVG, a collection of SVG code samples with JavaScript is here:


    *https://github.com/ocampesato/svg-graphics*.


    As you will see, it’s possible to match CSS selectors with SVG elements via


    the CSS url() function, and the combination of CSS3 and SVG gives you a


    powerful mechanism for leveraging the functionality of SVG in CSS3 selectors.


    In fact, you can combine CSS, SVG, D3, and HTML5 Canvas elements in the


    same HTML Web page.


    **RENDERING LINE SEGMENTS AND RECTANGLES IN SVG**


    This section shows you how to render line segments and rectangles in SVG


    documents. As a simple example, SVG supports a <line> element for render-


    ing line segments, and its syntax looks like this:


    <line x1="20" y1="20" x2="100" y2="150".../>


    SVG <line> elements render line segments that connect the two points


    (x1,y1) and (x2,y2).


    SVG supports a <rect> element for rendering rectangles, and its syntax


    looks like this:


    <rect width="200" height="50" x="20" y="50".../>


    The SVG <rect> element renders a rectangle whose width and height are


    specified in the width and height attributes. The upper-left vertex of the


    rectangle is specified by the point with coordinates (x,y).


    Listing 7.1 displays the contents of BasicShapes1.svg, which illustrates


    how to render line segments and rectangles.'
