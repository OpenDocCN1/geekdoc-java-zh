    **RESIZING ASSETS IN MOBILE WEB APPLICATIONS**


    There are at least two common techniques for detecting screen sizes, which


    in turn is related to resizing assets. The first technique involves CSS3 Media


    Queries to load different CSS stylesheets for different screen widths. The sec-


    ond technique is to use JavaScript to set different CSS properties for different


    screen sizes.


    When you place assets (such as PNG files) on an HTML5 Web page in a


    mobile Web application, you need to decide how to handle the following situ-


    ations for your mobile web application:


    **1\.** Switching from portrait to landscape (or vice versa)


    **2\.** Deploying to mobile devices with different screen sizes


    **3\.** Resizing text strings and text areas


    **4\.** Scaling non-binary images (such as SVG)


    You need to address the preceding situations whenever you create an HTML5


    Web page that includes not only PNG files, but also other types of assets, such


    as embedded SVG documents or HTML5 <canvas> elements.


    In the case of rendering text strings, how do you determine the correct font


    size? Even if you use em for the unit of measure, you don’t know the DPI reso-


    lution of a particular device. Of course, you could make an educated guess and


    decide that text will be rendered with 14em for a mobile phone and 16em for


    a tablet (or phablet), but the increasing variety of screens with different DPIs


    means that you can’t guarantee that your choice will be correct in all cases.


    In the case of SVG documents that are embedded in an HTML5 Web page,


    you can use a CSS-based technique for automatically resizing the contents of


    SVG documents in an HTML5 Web page with this code snippet:


    <div style="background-size: contain">


    A detailed description of this technique is here: *https://developer.mozilla.org/*


    *en-US/docs/Web/CSS/background-size*.


    **DETERMINING THE CONTENT LAYOUT FOR MOBILE WEB PAGES**


    Some design considerations for determining the content of a Web page are


    here:


    • Provide a single column of text for smart phones


    • Remove extra links and content


    • Remove items and sidebars/footers


    • Avoid absolute sizes


    • Set wrapper widths to percentages


    • Set paragraphs to display block'
