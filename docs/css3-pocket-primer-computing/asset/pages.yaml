    CHAPTER 8


    *MISCELLANEOUS TOPICS*


    T


    his chapter contains an eclectic mix of topics, starting with an overview


    of Houdini, which is an initiative that has far-reaching implications for


    CSS in Web pages. You will also learn about Flexbox and Grid Layout,


    and performance techniques for binary images. In addition, you will see a com-


    parison of CSS3, SVG, and HTML5 Canvas, as well as Web Animation APIs,


    and animation-related toolkits.


    The first part of this chapter is a quick introduction to Houdini, which is


    an important task force whose goal is to provide new APIs that will provide


    consistent CSS behavior in all modern browsers.


    The second part of this chapter contains code samples that show you how


    to use CSS Flexbox and CSS Grid Layout. The third part of this chapter


    discusses performance improvements for HTML5 Web pages and CSS3, as


    well as a comparison of CSS3, SVG, and HTML5 Canvas.


    The fourth part of this chapter covers performance techniques for optimiz-


    ing binary images, as well as a description of spritesheets, the blur-up tech-


    nique, progressive images, and Web fonts. The fifth part of this chapter looks


    into the Web Animations API and other animation toolkits, such as GSAP,


    mojo.io, and sequence.js.


    The final part of this chapter delves into some of the features of Chrome


    Inspector, which provides a very rich set of diagnostics and debugging capa-


    bilities. You will learn about “computed properties,” how to make live up-


    dates to properties in CSS selectors, and also how to gather data that can help


    you pinpoint performance bottlenecks. After completing this section, you


    will be in a better position to make a feature-based comparison of Chrome


    Inspector with the corresponding features that are supported in other


    modern browsers.'
