    ![](img/0a6af518702639b3a358cdd75f17af79_160_0.png)


    CSS3 provides support for the following features that are not available in SVG:


    • 3D graphics and animation effects


    • Multicolumn rendering of text


    • WebGL-oriented functionality (e.g., CSS Shaders)


    Note that SVG Filters and CSS Filters will become one and the same at some


    point in the not-too-distant future.


    In general, SVG is better suited than CSS3 for large data sets that will be


    used for data visualization, and you can reference the SVG document (which


    might render some type of chart) in a CSS3 selector using the CSS3 url()


    function. You have already seen such an example in Chapter 3, where the SVG


    document contains the layout for a bar chart. In general, there might be ad-


    ditional processing involved where data is retrieved or aggregated from one


    or more sources (such as databases and Web services), and then manipulated


    using some programming language (such as XSLT, Java, or JavaScript) in order


    to programmatically create an SVG document or perhaps create SVG elements


    programmatically in a browser session.


    **SUMMARY**


    This chapter started with an introduction to SVG and how to render 2D


    shapes using SVG. You learned about SVG gradients (linear and radial), and


    how to specify gradients when rendering 2D shapes. Next you learned about


    the SVG <polygon> element for rendering an arbitrary polygon (convex or


    concave) in the plane. You also learned about the SVG <pattern> element


    and how to create custom patterns for creating rich visual effects. Then you


    learned about Bezier curves and how to render text strings along a path (such


    as a Bezier curve) in SVG. Finally, you learned about SVG filters and how to


    combine them with SVG transforms and apply them to 2D shapes.'
