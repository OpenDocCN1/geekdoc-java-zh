    **CSS-RELATED PERFORMANCE**


    CSS3 provides wonderful functionality, such as rounded corners, as well


    as 2D and 3D graphics and animation effects. However, CSS3 features can


    differ in terms of performance, which obviously affects the performance of an


    HTML5 Web page.


    Recall that you can guarantee that the GPU will be used on a device by


    using something such as translate3D(0,0,0), which is essentially a “no


    operation.” You can also replace 2D transforms by their corresponding 3D


    transforms. However, an indiscriminate use of 3D transforms can cause a page


    reflow or a page repaint, which has an adverse impact on performance.


    Good articles regarding CSS paint times are here:


    • *http://css-tricks.com/efficiently-rendering-css/*


    • *http://www.html5rocks.com/en/tutorials/speed/css-paint-times/*


    • *http://stickmanventures.com/labs/demo/spinning-gears-Chrome-pre-*


    *serve-3d/#*


    Another interesting point pertains to the use of CSS3 translate versus absolute


    position in a CSS selector. Paul Irish compares these techniques here: *http://*


    *paulirish.com/2012/why-moving-elements-with-translate-is-better-than-pos-*


    *abs-topleft/*.


    If you are interested in the lower level details about the painting process,


    CSS2 defines the order of the painting process, which is the order in which


    the elements are stacked in the “stacking contexts.” This order affects painting


    because the stacks are painted from back to front. The stacking order of a block


    renderer is here:


    • Background color


    • Background image


    • Border


    • Children


    • Outline


    A more detailed explanation of the painting process can be found at the follow-


    ing: *http://www.html5rocks.com/en/tutorials/speed/unnecessary-paints*/ and


    *http://www.html5rocks.com/en/tutorials/internals/howbrowserswork/*.


    Steve Souders has written at least two performance-related books and has


    written many blog posts regarding performance, and it’s definitely worth reading


    his work.


    **A CONDENSED COMPARISON OF CSS, SVG, AND CANVAS**


    CSS3 provides a) 2D/3D graphics/animation, b) GPU support, c) the ability


    to embed in an SVG <defs> element, d) “easing functions” for animation, and


    e) the capability to animate HTML elements.'
