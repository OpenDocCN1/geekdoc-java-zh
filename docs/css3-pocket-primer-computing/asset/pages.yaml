  md: '**xiv**  • CSS3 Pocket Primer


    ![](img/0a6af518702639b3a358cdd75f17af79_14_0.png) ![](img/0a6af518702639b3a358cdd75f17af79_14_0.png)
    ![](img/0a6af518702639b3a358cdd75f17af79_14_2.png)


    **WHAT DO I NEED TO KNOW FOR THIS BOOK?**


    The most important prerequisite is familiarity with HTML and basic CSS.


    In some cases (such as the examples in Chapter 6), familiarity with basic JavaS-


    cript is definitely necessary in order to understand the code samples. One way


    to get a better idea about this book is to glance through some of the code


    samples to get an idea of how much is familiar to you and how much is new for


    you. If you feel overwhelmed by too many unfamiliar concepts, then it’s prob-


    ably advisable to select a different book. On the other hand, if you feel that
    the


    material is new yet within your grasp, you can fill potential gaps (obviously
    de-


    tails vary in this book) by reading online tutorials. The decision making process


    regarding the purchase of this book is obviously important to you, and satisfied


    customers are important to the publisher and the author.


    **THE TARGET AUDIENCE**


    This book is intended to reach an international audience of readers with


    highly diverse backgrounds in various age groups. While many readers know


    how to read English, their native spoken language is not English (which could


    be their second, third, or even fourth language). Consequently, this book uses


    standard English rather than colloquial expressions that might be confusing


    to those readers. As you know, many people learn by different types of imita-


    tion, which includes reading, writing, or hearing new material (yes, some basic


    videos are also available). This book takes these points into consideration in


    order to provide a comfortable and meaningful learning experience for the


    intended readers.


    **GETTING THE MOST FROM THIS BOOK**


    Some people learn well from prose, others learn well from sample code


    (and lots of it), which means that there’s no single style that can be used for


    everyone.


    Moreover, some people want to start by launching the HTML Web pages,


    see what they render, and then return to the code to delve into the details (and


    conversely, other people use the opposite approach).


    In order to provide meaningful content for both types of people, this book


    contains a mixture of code samples: some are short, some are long, and other


    code samples “build” from earlier code samples.


    The goal is to show (and not just tell) you a variety of visual effects that are


    possible, some of which you might not find anywhere else. You benefit from


    this approach because you can pick and choose the visual effects and the code


    that creates those visual effects.'
