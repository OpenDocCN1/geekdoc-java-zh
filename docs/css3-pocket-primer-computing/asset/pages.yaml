    **Specifying Colors with RGB and HSL**


    Before we delve into the interesting features of CSS3, you need to know


    how to represent colors. One method is to use (R,G,B) triples, which repre-


    sent the Red, Green, and Blue components of a color. For instance, the triples


    (255,0,0), (255,255,0), and (0,0,255) represent the colors Red, Yel-


    low, and Blue. Other ways of specifying the color include: the hexadecimal


    triples (FF,0,0) and (F,0,0); the decimal triple (100%,0,0); or the string


    #F00. You can also use (R,G,B,A), where the fourth component specifies the


    opacity, which is a decimal number from 0 (invisible) to 1 (opaque) inclusive.


    However, there is also the HSL (Hue, Saturation, and Luminosity)


    representation of colors, where the first component is an angle between 0


    and 360 (0 degrees is north), and the other two components are percentages


    between 0 and 100. For instance, (0,100%,50%), (120,100%,50%), and


    (240,100%,50%) represent the colors Red, Green, and Blue, respectively.


    In addition, the HSLa color model supports the alpha/transparency value,


    which is between 0 (fully transparent) and 1 (fully opaque). The alpha value (in


    any color model) enables you to “see through” overlapping elements when its


    value is less than 1, whereas a value of 1 prevents you from seeing the portion


    of an element that is underneath other elements.


    The code samples in this book use (R,G,B) and (R,G,B,A) for represent-


    ing colors, but you can perform an Internet search to obtain more information


    regarding HSL.


