    The first SVG <line> element in Listing 7.1 specifies the color blue and a


    stroke-width (i.e., line width) of 4, whereas the second SVG <line> ele-


    ment specifies the color red and a stroke-width of 10.


    Notice that the first SVG <rect> element renders a rectangle that looks


    the same (except for the color) as the second SVG <line> element, which


    shows that it’s possible to use different SVG elements to render a rectangle (or


    a line segment).


    The SVG <path> element is probably the most flexible and powerful ele-


    ment because you can create arbitrarily complex shapes, based on a “concat-


    enation” of other SVG elements. Later in this chapter you will see an example


    of how to render multiple Bezier curves in an SVG <path> element.


    An SVG <path> element contains a d attribute that specifies the points in


    the desired path. For example, the first SVG <path> element in Listing 7.1


    contains the following d attribute:


    d="M20,150 l200,0 l0,50 l-200,0 z"


    This is how to interpret the contents of the d attribute:


    • Move to the absolute location point (20,150)


    • Draw a horizontal line segment 200 pixels to the right


    • Draw a line segment by moving 10 pixels to the right and 50 pixels down'
