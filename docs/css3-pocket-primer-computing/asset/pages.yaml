  md: 'CHAPTER 4


    *CSS3 3D GRAPHICS AND*


    *ANIMATION*


    T


    his chapter shows you how to create HTML Web pages with various


    3D graphics and animation effects involving CSS3\. However, while 3D


    effects can be more appealing than 2D effects, they are usually more


    CPU intensive, which can be problematic for Web pages that are rendered on


    mobile devices. CSS3 3D effects depend on the GPU (Graphics Processing


    Unit) to handle intensive computations, and you will learn how to guarantee


    that the GPU will be invoked. In addition, many Web pages are displayed on


    mobile devices, so it’s important to determine the impact of CSS3 3D anima-


    tion effects on the battery life of mobile devices.


    The first part of this chapter shows you how to use CSS3 2D transforms


    to render a cube, along with transitions that create an animation effect during


    hover events. The second part of this chapter discusses 3D transforms, such as


    translate, scale, and rotate transforms (there is no 3D counterpart for 2D skew


    transforms). This section also discusses how to create CSS3 transitions.


    The third part of this chapter contains examples of 3D animation effects.


    The fourth part of this chapter shows you how to combine 3D effects with


    sprites, CSS animation tools, and an optional section that creates animation


    effects with jQuery and CSS (the jQuery Appendix provides an introduction if


    you need to familiarize yourself with this technology).


    In addition to the code samples that are discussed in this chapter, an exten-


    sive set of code samples for creating CSS3 2D/3D graphics/animation effects


    (mainly for fun) is here: *https://github.com/ocampesato/css3-graphics*.


    Since this chapter involves CSS3 3D animation effects, the final portion


    of this chapter briefly discusses the GPU, its role in HTML, and also shows


    you how to guarantee that the GPU is invoked for CSS-based animation ef-


    fects. After you have read the chapters that discuss CSS3 with SVG and CSS3


    with HTML5 Canvas, Chapter 9 briefly compares these technologies from the


    standpoint of performance.'
