    care of mouse events and touch events through a single set of APIs. This virtu-


    alization simplifies your code: you only need to handle one set of events.


    **A TOUCH-ORIENTED DESIGN**


    You might think that you can accomplish this goal simply by replacing all


    mouse-related events with their touch-related counterparts. Although this is a


    good starting point, there are several caveats to this approach. First, there
    is


    no touch event that is the counterpart for a mouse-based hover event. Conse-


    quently, CSS stylesheets with selectors of the type #myDiv:hover will work cor-


    rectly on laptops and desktops, but they do not work correctly on mobile devices.


    Second, when users touch a mobile screen with one of their fingers, the


    second gesture could be one of the following:


    **1\.** Touch up


    **2\.** Touch hold'
