    **The RAIL Framework**


    RAIL is an acronym for the following time-based measurements: Reaction


    time (100ms), Animation time (60FPS), Idle time (<50ms), and Load time


    (< one second). The parenthesized numbers in the preceding sentence are


    the goals of the respective time measurements. The availability of functional-


    ity such as Service Workers (albeit an experimental technology) in modern


    browsers will assist in reaching the RAIL goal of adequate performance of


    Web pages.


    Currently there is partial support for Service Workers in Chrome, Opera,


    and Firefox, and more information about Service Workers is here: *https://de-*


    *veloper.mozilla.org/en-US/docs/Web/API/Service_Worker_API.*


