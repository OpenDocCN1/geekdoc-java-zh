    <path d="M20,150 l200,0 l0,50 l-200,0 z"


    ﬁ ll="blue" stroke="red" stroke-width="4"/>


    <!-- right-side ﬁ gures -->


    <path d="M250,20 l200,0 l-100,50 z"


    ﬁ ll="blue" stroke="red" stroke-width="4"/>


    <path d="M300,100 l100,0 l50,50 l-50,50 l-100,0 l-50,-50 z"


    ﬁ ll="yellow" stroke="red" stroke-width="4"/>


