    CSS3 transforms include the CSS3 functions scale(), rotate(), skew(),


    and translate(), which enable you to modify the shape of HTML elements.


    This section shows you how to create a cube using CSS3, which involves


    rendering the front face (a rectangle), the top face (a parallelogram), and the


    right face (also a parallelogram).


    We will use the following CSS3 transforms and effects in this section:


    **1\.** The CSS3 skew() function to create the left and right faces


    **2\.** The CSS3 scale() and rotate() functions to create the top face


    **3\.** Linear and radial gradients for shading effects


    The example in this section contains a lot of CSS3 code, and it’s probably help-


    ful to launch the Web page in a browser to view the result as you study the


    code.


