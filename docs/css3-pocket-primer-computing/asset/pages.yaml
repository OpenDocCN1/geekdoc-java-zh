    CSS3 also supports Boolean selectors (which are also pseudo-classes) such


    as empty, enabled, disabled, and checked, which are very useful for


    Form-related HTML elements. One other pseudo-class is not(), which re-


    turns a set of elements that do not match the selection criteria.


    CSS3 uses the meta-characters ^, $, and * (followed by the = symbol) in


    order to match an initial, terminal, or arbitrary position for a text string.
    If you


    are familiar with the Unix utilities grep and sed, as well as the vi text editor,


    then these meta-characters are very familiar to you.


    **CSS3 Pseudo-Classes**


    The CSS3 :nth-child() pseudo-class is both powerful and useful, and it


    has the following form:


    :nth-child(insert-a-keyword-or-linear-expression-here)


    The following list provides various examples of using the nth-child()


    pseudo-class in order to match various subsets of child elements of an HTML


    <div> element (which can be substituted by other HTML elements as well):


    div:nth-child(1): matches the first child element


    div:nth-child(2): matches the second child element


    div:nth-child(:even): matches the even child elements


    div:nth-child(:odd): matches the odd child elements


    The interesting and powerful aspect of the nth-child() pseudo-class is its


    support for linear expressions of the form an+b, where a is a positive inte-


    ger and b is a non-negative integer, as shown here (using an HTML5 <div>


    element):


    div:nth-child(3n): matches every third child, starting from position 0


    div:nth-child(3n+1): matches every third child, starting from position 1


    div:nth-child(3n+2): matches every third child, starting from position 2


    **CSS3 Attribute Selection**


    You can specify CSS3 selectors that select HTML elements as well as


    HTML elements based on the value of an attribute of an HTML element


    using various regular expressions. For example, the following selector selects


    img elements whose src attribute starts with the text string Sandra, and then


    sets the width attribute and the height attribute of the selected img ele-


    ments to 100px:


    img[src^="Sandra"] {


    width: 100px; height: 100px;


    }'
