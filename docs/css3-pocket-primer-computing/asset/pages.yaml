    yAngle are positive, the skew effect is clockwise; when xAngle and yAngle


    are negative, the skew effect is counterclockwise; and when xAngle and yAn-


    gle are zero, there is no skew effect. In all cases the initial position for the


    skew effect is the positive horizontal axis.


    The HTML5 Web page Skew1.html and the CSS stylesheet Skew1.css


    are on the companion disc, and they illustrate how to create skew effects. The


