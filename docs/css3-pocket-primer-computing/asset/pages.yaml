    **WHAT ARE CSS3 MEDIA QUERIES?**


    CSS3 Media Queries extend the capability of an older CSS specification


    known as media types, which assigned browsers to high-level categories such


    as screen, handheld, or print in order to restyle a Web page’s printed output.


    CSS 2.1 introduced the concept of media queries, which enable you to


    conditionally include alternative stylesheets for print, screen, and so forth.
    The


    media types specification details ten media types, but browsers only support a


    few of them (such as screen and print).


    For example, the following CSS 2.1 media queries conditionally load CSS


    stylesheets based on the value of the media attribute:


    <link rel="stylesheet" type="text/css"


    href="main.css" media="screen" />


    <link rel="stylesheet" type="text/css"


    href="print.css" media="print" />


    The CSS3 Media Queries module extends the idea of media types introduced


    in CSS 2.1, and all modern desktop and major mobile browsers support CSS3-


    based media queries.


    CSS3 Media Queries give you the ability to determine some of the physi-


    cal characteristics of a device visiting a site. In a sense, CSS3 Media Queries


    serve as the counterpart to feature detection. For example, the following CSS3


    Media Query combines two conditions as the conditional logic for loading a


    CSS stylesheet:


    <link rel="stylesheet"


    media="screen and (min-width: 800px)" href="main.css" />


    You can also use media queries inline in CSS using @media directives in order


    to conditionally style various HTML elements, as illustrated in the following


    example:


