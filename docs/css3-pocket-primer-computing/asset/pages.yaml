    **CSS3 LINEAR GRADIENTS**


    CSS3 supports linear gradients and radial gradients that create visual ef-


    fects that are as visually rich as gradients in other technologies such as SVG.


    The code samples in this section illustrate how to define linear gradients (ra-


    dial gradients are discussed in the next section) in CSS3 and then match them


    to HTML elements.


    CSS3 linear gradients require one or more “color stops,” each of which


    specifies a start color, an end color, and a rendering pattern. Browsers support


    the following syntax to define a linear gradient:


    • A direction (or an angle)


    • One or more color stops


    If the *direction* is specified as to bottom, the gradient will be rendered


    horizontally from top to bottom. If the *direction* property is specified as


    to right, the gradient will be rendered vertically from left to right. If the


    *direction* property is specified as to bottom right, the gradient will be


    rendered diagonally from upper left to lower right.


    You can specify an angle instead of the predefined directions: the angle


    value is the angle between a horizontal line and the gradient line. For exam-


    ple, the following code snippet renders a diagonal linear gradient that forms
    a


    thirty-degree angle with the horizontal axis:


    background: linear-gradient(30deg, red, yellow);


    The color varies from red to yellow, and is displayed from upper left to lower


    right.


