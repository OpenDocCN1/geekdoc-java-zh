    **Creating 3D Effects in SVG with CSS3 and JavaScript**


    As you learned earlier in this chapter, SVG does not support 3D effects.


    However, you can reference SVG elements in CSS selectors via the CSS url()


    function, which provides a powerful mechanism for leveraging the functional-


    ity of SVG in CSS3 selectors. Another technique involves a combination of


    JavaScript and SVG. A set of SVG code samples with 3D effects is here: *https://*


    *github.com/ocampesato/svg-filters-graphics*.


    Figure 7.10 displays the result of rendering TroughPattern3S2.svg


    (which is part of the preceding open source project) in a Chrome browser on


    a MacBook.


    ![](img/0a6af518702639b3a358cdd75f17af79_155_2.png)


    ***FIGURE 7.10*** SVG 3D “trough” shape in a Chrome browser.


    If you are interested in creating 3D effects with SVG, you can get more infor-


    mation (including details about matrix manipulation) and code samples here:


    *http://msdn.microsoft.com/en-us/library/hh535759(v=vs.85).aspx.*


    The open source (and very powerful) toolkit D3 is based on SVG, and many


    D3-based code samples are here: *https://github.com/ocampesato/d3-graphics*.


    **SVG, CSS, AND JQUERY**


    You can combine these technologies (and also with D3) in the same Web


    page. However, you need to add some extra code (shown later) when you dy-


    namically create SVG elements in a Web page with jQuery. If you do not plan


    to use jQuery, feel free to skip this section. If you are interested in jQuery
    and


    have not worked with jQuery, read the relevant Appendix on the companion


    disc.


    As you know by now, CSS3 selectors can reference SVG documents using


    the CSS3 url() function, which means that you can incorporate SVG-based


    graphics effects (including animation) in your HTML pages. The HTML Web


    page Blue3DCircle1.html references the CSS stylesheet Blue3DCircle1.


    css in order to render an SVG circle with styling effects.


    As another example, the HTML5 page CSS3SVGBarChart1.html refer-


    ences the CSS3 stylesheet CSS3SVGBarChart1.css and the SVG document


    CSS3SVGBarChart1.svg in order to render an SVG circle, a bar chart, and


    multicolumn text.


    An interesting scenario involves the combination of jQuery with SVG and


    CSS in the same Web page, as shown in the following subsections.


