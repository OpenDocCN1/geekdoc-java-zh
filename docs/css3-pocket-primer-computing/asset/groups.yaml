    \ Canvas 提供了让你创建美观视觉效果的渐变。\n\n线性渐变根据 `colorStop` 定义，每个停止点包含一个小数（在 0 到 1 之间）。例如，如果你定义一个起始颜色为\
    \ `#FF0000`（红色）、结束颜色为 `#000000`（黑色）的线性渐变，那么渐变将从红色变为黑色。线性渐变允许你创建各种有趣的组合，包括水平、垂直和对角方向。其语法如下：\n\
