    \ you complete this section.\n\nFigure 8.3 displays the contents of ChromeInspector.png,\
    \ which is a screenshot of Chrome Inspector after launching the HTML Web page\
    \ Threed2Hover1.html.\n\n![](img/0a6af518702639b3a358cdd75f17af79_179_0.png)\n\
    \n***FIGURE 8.3*** An example of the contents of Chrome Inspector.\n\nClick on\
    \ the Elements tab and you will see the contents of the DOM for the current HTML\
    \ Web page that is in the browser. As you expand the various elements, notice\
    \ how the top portion of your browser session highlights some properties of the\
    \ currently selected item in the DOM.\n\nClick on the Sources tab and click on\
    \ the file Threed2Hover1.css in order to see the contents of this file. On the\
    \ right side of the screen you will see various tabs displayed. Click on the Computed\
    \ tab and you will see the values of properties that have been set for any element\
    \ in the DOM. For each HTML element, the values of the computed properties are\
    \ the “aggregate” result of the CSS selectors that match that HTML element.\n\n\
    Chrome Inspector enables you to add new CSS selectors that are applied dynamically\
    \ to the current HTML Web page. Click on the Styles tab (on the left of the Computed\
    \ tab) and then click on the plus (“+”) button that is located at the right-most\
    \ edge of your browser, in a row of buttons that is below the row that contains\
    \ the Styles tab. As a simple example, add this CSS selector:\n\n```css\nbody\
    \ {\n  background-color: blue;\n}\n```\n\nNotice that as you type the letters\
    \ of the color blue, Chrome updates the background color with a color that matches\
    \ the current input string.\n\n**164** • CSS3 Pocket Primer\n\n![](img/0a6af518702639b3a358cdd75f17af79_180_0.png)\n\
    \nNow click on the Timeline tab and you will see a “Capture:” option that enables\
    \ you to collect memory information about timelines, and also capture screenshots\
    \ while doing so. Click on the dark circle that is to the left of (and below)\
    \ the Elements tab whenever you want to Record information, and click on the circle\
    \ to its right when you want to clear recording information. Experiment with these\
    \ options and perform some recordings so that you can familiarize yourself with\
    \ the details of capturing performance-related details.\n\n**SUMMARY**\n\nIn this\
    \ chapter, you learned about Project Houdini, which is a workgroup whose goal\
    \ is to achieve consistency and extensibility in CSS in modern browsers. Then\
    \ you learned about FlexBox and Grid Layout, and some performance techniques for\
    \ binary images. Next you saw a comparison of CSS3, SVG, and HTML5 Canvas, along\
    \ with an example of how to use the Web Animation APIs. In addition, you learned\
    \ about performance techniques, spritesheets, and several techniques for rendering\
    \ binary images in Web pages.\n\n![](img/0a6af518702639b3a358cdd75f17af79_181_0.png)\n\
    \n## CHAPTER 9\n*DESIGNING MOBILE APPS*\n\nThe purpose of this chapter is to provide\
