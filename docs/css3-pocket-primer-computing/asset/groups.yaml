    ## Why Use Semantic Markup?


    There are at least two reasons for using semantic tags in your websites. First,
    semantic tags can help you understand the structure of a website and the purpose
    of a section of markup. Second, the use of semantic tags makes it easier for you
    to programmatically locate and manage sets of logically similar sections of code
    (such as <nav> elements, <aside> elements, and so forth). Third, screen-readers
    and search engines can use these tags to separate the content from navigation
    in a website. These are several of the more important reasons for using semantic
    markup, and you can probably think of other reasons as well.


