    ## SVG and jQuery


    Listing 7.10 displays the contents of JQuerySVGCSSCube1.html, which illustrates
    how to update the fill color of an SVG-based cube whenever users click on any
    of its faces.


    ***LISTING 7.10 JQuerySVGCSSCube1.html***


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8" />

    <title>SVG, CSS, and jQuery Example</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.0.0-alpha1/jquery.js">

    </script>

    <style>

    .newcolor {

    fill: #c8f;

    stroke: white;

    stroke-width: 2;

    }

    </style>

    </head>

    <body>

    <svg class="none" width="600" height="300">

    <!-- top/front/right faces -->

    <polygon fill="yellow"

    points="50,50 200,50 240,30 90,30"/>

    <rect width="150" height="150" x="50" y="50"

    fill="red"/>

    <polygon fill="blue"

    points="200,50 200,200 240,180 240,30"/>

    </svg>

    <script>

    var mysvg = $("svg > *");

    $(document).ready(function() {

    mysvg.on("click", function() {

    mysvg.removeClass("none");

    $(this).toggleClass("newcolor");

    //$(this).newClass("newcolor");

    });

    });

    </script>

    </body>

    </html>

    ```


    Listing 7.10 contains boilerplate code and familiar SVG code for rendering a cube.
    The new code is the jQuery code block in the <script> element, which shows you
    how to define an event handler that responds to click events on any of the faces
    of the cube. If this code is unfamiliar to you, please read the jQuery Appendix
    on the companion disc.


    **ON THE CD**


    SVG Essentials • **141**


    ## Creating SVG Elements and jQuery


    The method document.createElement() to add SVG DOM Nodes does not work because
    a namespace is required. Use the document.createElementElementNS() method, which
    jQuery does not handle for you.


    Listing 7.11 displays the contents of JQuerySVG.html, which illustrates how to
    create an SVG ellipse and then append that ellipse to the DOM via jQuery.


    ***LISTING 7.11 JQuerySVG.html***


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8" />

    <title>An SVG Ellipse and jQuery</title>

    <script src="http://code.jquery.com/jquery-1.7.1.min.js">

    </script>

    </head>

    <body>

    <svg id="outersvg" width="800" height="500">

    </svg>

    <script>

    function createSVGElemWithNS(elem)

    {

    return document.createElementNS(''http://www.w3.org/2000/svg'', elem);

    }

    $(document).ready(function() {

    var $mySVG = $(''#outersvg'');

    $(createSVGElemWithNS(''circle''))

    .attr(''cx'', 150)

    .attr(''cy'', 100)

    .attr(''r'', 50)

    .attr(''fill'', ''none'')

    .attr(''stroke'', ''red'')

    .attr(''stroke-width'', 3)

    .appendTo($mySVG);

    })

    </script>

    </body>

    </html>

    ```


    Listing 7.11 starts with boilerplate code and a <body> element that contains an
    <svg> element that is the container for SVG elements. The next part of the <body>
    element is a <script> element that starts with the JavaScript function createSVGElemWithNS
    whose sole purpose is to create elements with the SVG namespace. The second part
    of the <script> element contains the standard jQuery “ready” code block that is
    executed after the Web page is loaded into memory. As you can see, this code block
    first obtains a reference to the <svg> element in the Web page and then invokes
    the JavaScript function createSVGElemWithNS to create an SVG <circle> element.
    Method chaining is used to assign values to the <circle> element before appending
    the element to the DOM. If you want to see examples of jQuery and CSS in the same
    Web page, you can find such examples in the Appendix on the companion disc.


    ## Existing Elements and jQuery


    The previous section showed you how to dynamically create SVG elements and append
    them to the DOM with jQuery. You can also manipulate existing SVG elements with
    jQuery, and you can do so without having to deal with namespaces. Listing 7.12
    displays the contents of UpdatejQuery.svg, which illustrates how to use jQuery
    in order to update the width attribute of an SVG <rect> element.


    ***LISTING 7.12 UpdatejQuery.svg***


    ```xml

    <?xml version="1.0" encoding="UTF-8" standalone="no"?>

    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN"

    "http://www.w3.org/TR/2001/DTD/SVG-11.dtd">

    <svg xmlns="http://www.w3.org/2000/svg"

    xmlns:xlink="http://www.w3.org/1999/xlink" width="500"

    height="500">

    <script xlink:href="http://code.jquery.com/

    jquery-2.0.0.js">

    </script>

    <script xlink:href="http://code.jquery.com/

    jquery-1.1.0.js">

    </script>

    <rect id="rect1" x="50" y="50" width="200" height="50"

    style="fill:red"/>

    <script>

    $(''#rect1'').attr(''width'', 400);

    </script>

    </svg>

    ```


    Listing 7.12 contains boilerplate code with two <script> elements that refer to
    jQuery-related scripts. The <body> element in Listing 7.12 contains an <svg> element
    that in turn contains two <rect> elements, followed by a <script> element that
    contains a jQuery code block. After the Web page is loaded into memory, this code
    block executes and sets the width attribute of the first <rect> element to 400.
    This simple code sample shows you easy it is to update attributes of SVG elements
    via jQuery.


    **ON THE CD**


    SVG Essentials • **143**


    ## jQuery Plugins for SVG


    If you prefer to use jQuery instead of D3 in your HTML5 Web pages, you can add
    SVG support by means of jQuery plugins. For example, the following jQuery plugin
    provides some SVG support: *http://keith-wood.name/svg.html*. The following code
    block illustrates how to render several 2D shapes using this jQuery plugin:


