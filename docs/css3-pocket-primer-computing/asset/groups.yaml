    \ • **117**\n\nThe first selector in Listing 6.8 displays another pattern (based\
    \ on a different radial gradient) whenever users hover with their mouse over the\
    \ HTML5 `<canvas>` element. The second selector in Listing 6.8 renders a colorful\
    \ pattern (also based on a radial gradient) as a background rectangle for the\
    \ HTML5 `<canvas>` element.\n\nIncidentally, HTML5 Canvas also supports a clip()\
    \ method that enables you to “clip” binary images in various ways. Moreover, you\
    \ can perform composing effects, and you can even manipulate the individual pixels\
    \ of an image file. Search the Internet for articles that describe the technical\
    \ details of these effects. Figure 6.5 displays a binary image with two radial\
