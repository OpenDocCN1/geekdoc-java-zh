    Submit\" />\n\n## Different Countries and Languages\n\nThere are several points\
    \ to keep in mind when you create applications for different countries and languages:\n\
    \n- Different phone formats in different countries\n- Left-to-right versus right-to-left\
    \ text input\n- Culturally appropriate content\n\nIf you intend to publish Android\
    \ applications that support multiple languages, the following link provides useful\
    \ information: *http://developer.vodafone.com/how-support-multiple-languages-android/.*\n\
    \nIf you intend to publish iOS applications that support multiple countries and\
    \ languages, Apple provides extensive information here: *https://developer.apple.com/internationalization/.*\n\
    \nThe details of creating internationalized iOS mobile applications (such as how\
    \ to create additional string resources) are here: *http://www.slideshare.net/cxpartners/web-and-mobile-forms-design-userfriendly-2010-workshop.*\n\
    \n## DESIGN-RELATED TOOLS AND ONLINE PATTERNS\n\nBalsamic is an online design\
    \ tool, and its home page is here: *http://www.balsamiq.com/.*\n\nBalsamic Mockups\
    \ is a tool for rapidly creating wireframes, designed to reproduce the experience\
    \ of sketching interfaces on a whiteboard. Since these mockups are on your computer,\
    \ you can share them quickly and easily with other people.\n\nAnother toolkit\
    \ for creating wireframes is justinmind, and its home page is here: *http://justinmind.com.*\n\
    \nBoth of the preceding tools are free to use, and they have videos that illustrate\
    \ how to use them.\n\nTwo websites that provide a collection of design patterns\
    \ (the second is purely for mobile) are here: *http://pttrns.com* and *http://mobile-patterns.com*.\n\
    \n## WORKING WITH FONT SIZES AND UNITS OF MEASURE\n\nIf you have already worked\
    \ with CSS stylesheets, then you are already familiar with different units that\
    \ are available for expressing font sizes for text in HTML5 Web pages. Several\
    \ units are available, including em, rem, px, pt, and %.\n\nThe relationship among\
    \ these units is as follows:\n\n1em = 12pt = 16px = 100%\n\nPixel units (px) are\
    \ very common in Web pages (especially for desktops and laptops), and they can\
    \ vary in terms of their resolution and their DPI (dots per inch). Pixel units\
    \ are virtual screen pixels rather than physical pixels. One point to keep in\
    \ mind is that the pixel unit does not scale correctly for visually-impaired readers.\n\
    \nYou can use the px unit for text, images, borders, rounded corners, and drop\
    \ shadows. However, if you are building a fluid layout that uses relative sizes,\
    \ it’s probably better to use the em unit or the % unit for text.\n\nThe em unit\
    \ is becoming more popular, especially on mobile devices, because this unit is\
    \ well suited for scaling a Web page. Unlike the px unit, the em unit is relative\
    \ to its parent element in a Web page. It might be helpful to think of the px\
    \ unit as “global” whereas the em unit is “local.”\n\nOne useful technique is\
    \ to specify the value 62.5% for the `<body>` element. Since 62.5% equals the\
    \ fraction 5/8, the product of 16px and 5/8 is 10px. The value 10px is a convenient\
    \ “base point” for performing conversions quickly and easily between px units\
    \ and em units in CSS selectors. For example, 1.5em is 15px, 2em is 20px, 2.5em\
    \ is 25px, and so forth. In case you need help in performing conversions, an online\
    \ em calculator is here: *http://riddle.pl/emcalc/* and *http://www.ready.mobi/launch.jsp?locale=en_EN.*\n\
    \nAdditional useful information is here: *http://www.w3.org/QA/Tips/font-size.*\n\
    \n## WHAT IS GOOGLE AMP?\n\nGoogle AMP is an open source initiative for rendering\
    \ Web pages more quickly on mobile devices, and its home page is here: *https://www.ampproject.org/.*\n\
    \nThe initial AMP specification was announced in October 2015, and code samples\
    \ are available here: *https://github.com/ampproject/amphtml.*\n\nAccelerated\
    \ Mobile Pages can be loaded in any modern browser or Web view. However, AMPs\
    \ impose a restricted subset of functionality compared to “regular” HTML Web pages\
    \ in order to reduce the time to load AMPs in a browser. Moreover, AMPs can be\
    \ cached in the cloud, which can yield additional speed improvements.\n\nYou can\
    \ think of AMP as a framework for creating mobile Web pages consisting of:\n-\
    \ AMP HTML (a subset of HTML with AMP-specific elements)\n- AMP JS (a JavaScript\
    \ framework that disallows third-party JavaScript)\n- AMP CDN (Content Delivery\
    \ Network)\n\nOne of the goals of AMP is to support all published Accelerated\
    \ Mobile Pages. More information about AMP is available in the following FAQ:\
    \ *https://www.ampproject.org/docs/faqs.html.*\n\nSome of the AMP restrictions\
