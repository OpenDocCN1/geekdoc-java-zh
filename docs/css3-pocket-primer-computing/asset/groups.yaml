    - *http://double.co.nz/video_test/*

    - *http://www.terrillthompson.com/tests/html5-audio.html*


    Other resources include *www.stackoverflow.com* and videos by Paul Irish.


    A more recent website is HTML5 Please, which consists of contributions from well-known
