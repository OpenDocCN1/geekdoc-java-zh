    ## HTML5 VALIDATORS


    HTML5 validators enable you to test HTML5 websites and mobile applications. Many
    types of validators for web applications are available, including:


    - HTML validators: test the validity of your HTML

    - Accessibility validators: test websites to determine how well they can be read
    by screen readers

    - Code validators (aka lint): check your scripts, CSS, and API calls for accuracy

    - Mobile validators: provide advice for improving pages for mobile devices. They
    often act as emulators as well.


    In addition to the preceding list, there are other tools that can evaluate the
    “friendliness” of your website, such as:


    - The W3C mobileOK Checker at http://validator.w3.org/mobile

    - MobiReady at http://ready.mobi/


    Both the W3C mobileOK Checker and MobiReady look at pages that are live on the
    Internet, and then give you a report of how they would perform on mobile devices.


    ## WAI-ARIA


    WAI-ARIA (Web Accessibility Initiative – Accessible Rich Internet Applications)
    is a W3C specification that specifies how to increase the accessibility of websites
    (including dynamic content) and user interface components developed with AJAX,
    HTML, JavaScript, and related technologies.


    The WAI-ARIA specification defines support for accessible web applications, which
    involves markup extensions that are often attributes of HTML5 elements. Web developers
    can use these markup extensions to obtain more information about screen readers
    and other assistive technologies.


    As a simple example, consider the following code snippet of an enhanced HTML <li>
    element from the ARIA specification that illustrates the use of the role and aria-checked
    attributes:


    <li role="menuitemcheckbox" aria-checked="true">

    <img src="checked.gif" role="presentation" alt="">

    <!-- note: additional scripts required to toggle image source -->

    </li>


    The two new attributes in the preceding code snippet have no impact on the manner
    in which browsers render the <li> element. Browsers that support ARIA will add
    OS-specific accessibility information to the rendered <li> element and enable
    screen readers to read information aloud in a contextual manner.


    You can get more information about the WAI-ARIA specification here: http://www.w3.org/TR/wai-aria/
    and http://www.techrepublic.com/blog/webmaster/a-checklist-for-web-accessibility-issues/2626.


    ## HTML5 AND VARIOUS WORKING GROUPS


    The W3C (World Wide Web Consortium), the WHATWG (Web Hypertext Application Technology
    Working Group), and the DAP (Device APIs Working Group) are organizations that
    provide the specifications and APIs for HTML5 and mobile devices that are covered
    in this book. In addition, the IETF (Internet Engineering Task Force) handles
    the networking standards (such as WebSockets, SPDY, CORS, and so forth), but not
    the actual APIs, and its home page is here: https://www.ietf.org/.


    The W3C is an international community for various membership companies, and organizations
    to work together in order to develop Web standards. The W3C is directed by Web
    inventor Tim Berners-Lee and CEO Jaffe, and its home page is here: http://www.w3.org/.


    Every proposal submitted to the W3C undergoes the following sequence to become
    a W3C Recommendation:


    - Working Draft (WD)

    - Candidate Recommendation (CR)

    - Proposed Recommendation (PR)

    - W3C Recommendation (REC)

    - Later revisions


    In essence, WHATWG has the master specification, which the W3C synchronizes its
    work with, mostly reformatting to match its publication style (including breaking
    it into sub-specifications.). The exact list of changes in the introduction to
    the WHATWG specification is here: http://www.whatwg.org/specs/web-apps/current-work/multipage/introduction.html.
    The following link provides a list of HTML5 APIs and their most recent status
    updates: http://www.w3.org/TR/.


    ## SUMMARY


    This chapter introduced you to HTML5, along with some technologies associated
    with it. Next you learned about some of the differences between HTML5 and HTML4,
    some useful tools (such as Modernizr), and feature detection. Then you saw an
    example of a simple HTML5 Web page which led to a discussion of new HTML elements
    and semantic markup. Finally you learned some things about WAI-ARIA, the W3C,
    and WHATWG.


    ## CHAPTER 2 INTRODUCTION TO CSS3


    This chapter introduces various aspects of CSS3, such as 2D transforms, graphics,
    and animation. Consequently you need to have a reasonable grasp of CSS2 (i.e.,
    how to define CSS selectors, the rules for selecting elements in HTML, etc.).
    If you are unfamiliar with CSS selectors, there are many introductory articles
    available through an Internet search after which you will have a better understanding
    of the underlying logic of CSS.


    The first part of the chapter starts with a brief overview of various CSS3 features,
    such as pseudo-selectors, pseudo-classes, and attribute selection. The second
    part of this chapter contains code samples that illustrate how to create shadow
    effects, how to render rectangles with rounded corners, and also how to use linear
    and radial gradients. The third part of this chapter covers CSS3 transforms (scale,
    rotate, skew, and translate), along with code samples that illustrate how to apply
    transforms to HTML elements. The final part of this chapter covers CSS3 support
    in browsers and briefly discusses the purpose of browser-specific prefixes for
    CSS features. You can launch the code samples in this chapter in any browser on
    a desktop or laptop; you can also view them on mobile devices, provided that launch
    them in a browser that supports the CSS3 features used in the code samples.


    ### CSS3 BROWSER SUPPORT


    Before we delve into the details of CSS3, there are two important details that
    you need to know about defining CSS3-based selectors for use with HTML. First,
    you need to know the CSS3 features that are available in different browsers. One
    of the best websites for determining browser support for CSS3 features is here:
    http://caniuse.com/.


    The preceding link contains tabular information regarding CSS3 support in many
    different browsers, which makes the information in that website valuable.


    Another highly useful tool that checks for CSS3 feature support is Enhance.js,
    which tests browsers to determine whether or not they can support a set of essential
    CSS and JavaScript properties, and then delivers features to those browsers that
    satisfy the test. You can download Enhance.js here: https://github.com/filamentgroup/EnhanceJS.


    ### QUICK OVERVIEW OF CSS3 FEATURES


    CSS3 adopts a modularized approach involving multiple specifications for extending
    existing CSS2 functionality as well as supporting new functionality. The following
    link contains a list of all the completed specifications and drafts by the CSS
    WG (specifications and Working Groups are discussed in Chapter 1), along with
    their current status: https://www.w3.org/Style/CSS/current-work.en.html.


    In brief, CSS3 enables you to create boxes with rounded corners and shadow effects;
    create rich graphics effects using linear and radial gradients; detect portrait
    and landscape mode; detect the type of mobile device using media query selectors;
    and produce multicolumn text rendering and formatting.


    In addition, CSS3 enables you to define sophisticated node selection rules in
    selectors using pseudo-classes, first or last child (:first-child, :last-child,
    :first-of-type, and :last-of-type), and also pattern-matching tests for attributes
    of elements. Several sections in this chapter contain examples of how to create
    such selection rules.


    ### CSS3 PSEUD CLASSES AND ATTRIBUTE SELECTION


    This brief section contains examples of some pseudo-classes, followed by snippets
    that show you how to select elements based on the relative position of text strings
    in various attributes of those elements. Although this section focuses on the
    :nth-child() pseudo-class, you will become familiar with various other CSS3 pseudo-classes,
    and in the event that you need to use those pseudo-classes, a link is provided
    at the end of this section which contains more information and examples that illustrate
    how to use them.


    CSS3 supports an extensive and rich set of pseudo-classes, including nth-child(),
    along with some of its semantically related “variants,” such as nth-of-type(),
    nth-first-of-type(), nth-last-of-type(), and nth-last-child().

