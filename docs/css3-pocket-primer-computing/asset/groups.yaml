    **CSS3 MEDIA QUERIES FOR MULTIPLE SCREEN SIZES**


    In the introduction to CSS3 Media Queries you saw examples of defining


    media queries with compound conditional logic (which can include and, or,


    only, and not). In case you didn’t already notice, you can use media queries


    to handle different screen sizes for mobile devices such as smart phones and


    tablets. An example of doing so is here:


    @media screen and (min-width: 321px) and (max-width: 480px)


    {


    div { width: 100px; }


    }


    @media screen and (min-width: 481px) and (max-width: 720px)


    {


    div { width: 200px; }


    }


    The logic in the preceding pair of media queries is straightforward: the first


    media query sets the width of <div> elements to 100px when the screen


    width is between 321 pixels and 480 pixels; the second media query sets the


    width of <div> elements to 200px when the screen width is between 481


    pixels and 720 pixels.


    The following media query sets the width of <div> elements to 150px only


    when it’s a screen:


    @media only screen {


    div { width: 150px; }


    }


    The following media query sets the width of <div> elements to 50px for de-


    vices that do not support orientation:


    not (orientation) {


    div { width: 50px; }


    }


    As you can see from the examples in this section and in previous sections, CSS3


    Media Queries are simple, flexible, and powerful in terms of their expressive-


    ness and intuitive functionality.


    **CSS DEVICE ADAPTATION**


    CSS Device Adaptation enables you to use CSS in order to specify the size,


    zoom factor, and orientation of the viewport meta element in your HTML5


    Web pages. As a simple example, the following selector specifies the width


    property and the zoom property:


    @viewport {


    width: device-width;


    zoom: 0.5;'
