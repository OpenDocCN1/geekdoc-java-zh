    completely eliminate a reflow and/or repaint in a Web page: the point to keep


    in mind is that you want to minimize the number of such events so that you


    do not adversely affect performance and the quality of the user experience on


    a Web page.


    **Chrome and Layout Changes**


    Chrome “batches” layout changes asynchronously in order to maximize


    rendering performance. The following style information causes synchronous


    updates:


    • OffsetTop and offsetLeft


    • OffsetWidth and offsetHeight


    • ScrollTop and clientTop


    • Left, width, and height


    • GetComputedStyle()


    The goal is to find and eliminate JavaScript code and/or CSS selectors that


    cause synchronous updates.


    Avoid synchronous updates because any request for style information about


    a node forces the browser to provide the most up-to-date value. In order to


    do so, the browser must apply all scheduled changes, flush the queue, and


    perform a reflow.


    For example, minimize this type of code in HTML Web pages:


    el.style.left = el.offsetLeft + 10 + "px";


    **AUTOMATIC INVOCATION OF THE GPU**


    When a Web page contains CSS selectors (especially those that involve


    transforms or animation effects), your browser determines when to invoke the


    GPU. However, there is no guarantee that the GPU will always be invoked in


    order to provide improved performance. Fortunately, there are some tech-


    niques (sometimes called a “no operation” or “hack”) to force the invocation of


    the GPU. You can use translate3D(0,0,0) or translateZ(0), as shown


    in the following selector:


    .myelem {


    transform: translateZ(0);


    }


    The following video by Paul Irish (a developer advocate at Google) discusses


    these and other techniques in this thirty-minute video: *http://paulirish.*


    *com/2011/dom-html5-css3-performance/*.


    Is it possible that these “hacks” can be slower sometimes? Try this sam-


    ple code containing 4,000 small <div> elements in your browser: *http://*


    *dl.dropboxusercontent.com/u/17844821/zeug/hwtest.html*.'
