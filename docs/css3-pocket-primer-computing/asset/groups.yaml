    \  }\n}\n```\n\nThe permissible values for the viewport meta element are listed\
    \ here:\n\n- width\n- height\n- initial-scale\n- minimum-scale\n- maximum-scale\n\
    - user-scalable\n- target-densityDpi\n\nMore information about CSS Device Adaptation\
