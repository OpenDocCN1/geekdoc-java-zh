    ## 杂题 • **155**


    ## CSS 相关性能


    CSS3 提供了精彩的功能，例如圆角，以及 2D 和 3D 图形和动画效果。然而，CSS3 特性在性能方面可能有所不同，这显然会影响 HTML5 网页的性能。


    记住，你可以通过类似 `translate3D(0,0,0)` 的方法来确保设备将使用 GPU，这本质上是一个“无操作”。你也可以将 2D 变换替换为相应的
    3D 变换。然而，不加区分地使用 3D 变换会导致页面重流（reflow）或页面重绘（repaint），这会对性能产生负面影响。


    关于 CSS 绘制时间的优秀文章请见此处：


    - *http://css-tricks.com/efficiently-rendering-css/**

    - *http://www.html5rocks.com/en/tutorials/speed/css-paint-times/**

    - *http://stickmanventures.com/labs/demo/spinning-gears-Chrome-pre-serve-3d/#/*


    另一个有趣的点关于在 CSS 选择器中使用 CSS3 `translate` 与绝对定位的对比。Paul Irish 在这里对比了这些技术：*http://paulirish.com/2012/why-moving-elements-with-translate-is-better-than-pos-abs-topleft/*。


    如果你对绘制过程的底层细节感兴趣，CSS2 定义了绘制过程的顺序，即元素在“堆叠上下文”中堆叠的顺序。这种顺序影响绘制，因为堆栈是从后到向前绘制的。块级渲染器的堆叠顺序如下：


    - 背景颜色

    - 背景图像

    - 边框

    - 子元素

    - 轮廓


    关于绘制过程的更详细的解释可以在以下位置找到：*http://www.html5rocks.com/en/tutorials/speed/unnecessary-paints/*
    和 *http://www.html5rocks.com/en/tutorials/internals/howbrowserswork/*。


    Steve Souders 至少写了两本与性能相关的书籍，并写了许多关于性能的博客文章，他的作品绝对值得阅读。


    ## CSS、SVG 和 CANVAS 的简化对比


    CSS3 提供了 a) 2D/3D 图形/动画，b) GPU 支持，c) 嵌入到 SVG `<defs>` 元素的能力，d) 用于动画的“缓动函数”，以及
    e) 动画 HTML 元素的能力。


    156 • CSS 入门


    SVG 提供了 a) 2D 图形/动画，b) 部分 GPU 支持，c) 创建任意 2D 形状的能力，d) 自定义 `<pattern>`，以及 e) 通过
    `<g>` 元素分组，以及“D3 中的缓动函数（但 SVG 无法动画 HTML）”。


    Canvas 提供了 a) 2D 图形/动画，b) GPU 支持，c) 更新许多小对象（游戏）的能力，以及 d) 处理视频的（使用 ThreeJS/WebGL
    进行 3D 动画）。


    CSS3+SVG 适用于 a) 你已经有了基于 SVG 的数据 b) 你必须支持 IE6（这可以通过 Raphael 工具实现，但不能用 D3）。


    CSS3+D3 适用于现代浏览器，而且对于定义事件处理程序和动画来说更容易（可能也更容易维护/增强）。


    然而，请记住 CSS3+SVG 可能没有 GPU 支持（或许可以考虑结合 BackboneJS/AngularJS 等使用 D3）。


    使用如下方法通过 SVG 创建 3D 动画效果的 CSS：


    步骤 #1：创建一个 SVG 文档

    步骤 #2：创建一个 SVG `<defs>` 元素

    步骤 #3：创建带有 CSS3 3D 动画效果的 CSS3 选择器并将其放入 `<style>` 元素中

    步骤 #4：将 `<style>` 元素插入 `<defs>` 元素中

    步骤 #5：在 SVG 元素设置 `class` 属性，使其匹配 `<style>` 元素中的 CSS3 选择器


    注意，你也可以在 SVG 文档中引用外部 CSS 样式表。


    现代浏览器支持 `<canvas>` 元素。在网页中插入 `<canvas>` 元素并在 HTML5 Canvas 使用 CSS3，然后使用 JavaScript
    API 创建 2D 形状，所有内容都在 `<canvas>` 元素中渲染。记住，HTML5 `<canvas>` 不提供 DOM。但是，CSS3 选择器可以匹配
    HTML5 `<canvas>` 元素。这里解释如何追踪 Canvas 调用的在这里：*http://www.html5rocks.com/en/tutorials/canvas/inspection/*。


    ## 哪种更快：CSS3/Canvas/SVG？


    HTML5 Canvas 在显示多边形和许多小对象时通常比 SVG 快，但 CSS3 在处理简单动画时比 Canvas 快：*http://phrogz.net/tmp/image_speed.html*。此外，CSS3
    在渐变方面比 SVG 快，而 D3 在处理“鼠标”交互方面比 SVG 更好/更快。上述规则仅为通用指南：确保你测试/比较了网页的性能特性，特别是当你为移动设备开发时。


    ## 网页与二进制图像


    各种因素都会不利地影响 HTML 网页的性能，包括二进制文件的下载时间。根据以下网站，平均网页大小为 2 兆字节，60% 来自图像：*http://archive.org/interesting.php*。可以通过多种技术改进性能，例如图像选择（在另一节中讨论）、雪位图（spritesheets）、预处理、延迟加载、缓存和
    CDN。以下子节讨论选择文件格式


    如你所知，SVG 是基于向量的格式，而其他文件格式是二进制数据。尽管 SVG 有优点，但有几个与性能相关的点需要注意。尽管 SVG 有优势，但有几个与性能相关的点需要注意。首先，SVG
    在浏览器中的渲染速度慢。其次，位图在移动设备上总是涉及 GPU。第三，使用工具来优化 SVG。考虑到上述几点，SVG 适用于网页。如果缩放不是需求，JPEG
    适用于照片。关于文件格式的有趣描述可以在这里：*https://forums.adobe.com/thread/164028/*。


    ## 优化 SVG 和二进制文件


    以下网站提供了用于优化 SVG 的命令行工具：*https://earchibald.github.io/svggo/*。此外，一个涉及三种不同格式图像的测试位于：*http://imageoptim.com/*。


    ## CSS 雪位图 (Spritesheets)


    CSS 雪位图涉及创建一个包含多个图像的单个图像。只需要一次 HTTP 请求下载雪位图，这比多次请求下载图像更高效。雪位图中的特定图像在网页中渲染。手动计算这些偏移量是一个枯燥且容易出错的过程。幸运的是，有在线工具可以生成雪位图。一个商业工具是
    Zwoptex：*https://zipple.com/zwoptex/*。SpriteMe 是一个生成雪位图的免费工具，其主页在此：*www.spritem.org*。关于雪位图的最佳实践的文章在这里：*http://webdesigntuts.com/articles/sprites-best-practices-*。如果你需要缩放任何图像，ImageMagick
    是一项出命令行工具，其主页在此：*http://www.imagemagick.org/script/convert.php*。


    在调整大小后，你可以使用 Glue 等命令行工具创建新的雪位图：*http://glue.readthedocs.org/en/latest/*。在网上搜索其他工具并比较其功能以确定你的需求。


    ## 用于渲染背景图像的“模糊”技术


    这种技术涉及初始显示一个小图像，随后调整该图像并同时应用高斯模糊过滤器（在第 2 章中讨论）。该技术的细节在此：*https://css-tricks.com/the-blur-up-technique-for-loading-background-images/*。该技术的示例在此：*http://codepen.io/thatemil/pen/yYmak/*。该技术的有趣点在于过滤器：可以使用
    base64、CSS 或 SVG 定义过滤器。另一个感兴趣点是在渐进图像中使用这种技术的可能性（见下一节）。顺便提到，Facebook 工程团队在其原生应用中使用这种技术来加载封面预览。


    ## 渐进图像


    HTML 网页加载图像的另一种技术是渐进图像。这种技术涉及下载并显示低分辨率的初始版本，然后“渐进地”下载并重新显示图像直到渲染全分辨率。有趣的是，这种技术在
    2008 年就可用（可能更早），最近对渐进图像的兴趣再次上升。然而，渐进图像的采用率仍然很低。以下文章通过三种不同格式图像的测试提到了一种可能性：*http://www.webperformancoday.com/2014/09/17/progressive-image-rendering-good-evil/*。尽管上述文章没有定论，但有一句有趣的引言：“当像渐进
    JPEG 方法那样，图像渲染是一个两个阶段的过程，当最初模糊的图像变得清晰时，认知流利度会受到抑制，大脑必须付出更多努力才能理解显示的内容。”


