    ## SVG 滤镜


    SVG 支持丰富的滤镜效果，其完整解释可能很容易超过一个章节。掌握 SVG 滤镜需要一个学习过程，因为只有少数滤镜是简单的。许多滤镜非常复杂，需要非直观的输入值。事实上，可以


    **134** • CSS3 入门指南


    “链”某些 SVG 滤镜：一个滤镜的输出可以是另一个滤镜的输入（某些滤镜需要两个滤镜的输出）。


    正如你所料的，某些 SVG 滤镜计算量很大，会影响性能；对于移动设备，包含此类滤镜的应用程序还会影响电池寿命。


    滤镜相关的 SVG 元素列表包括：

    - feBlend

    - feColorMatrix

    - feComponentTransfer

    - feComposite

    - feConvolveMatrix

    - feDiffuseLighting

    - feDisplacementMap

    - feFlood

    - feGaussianBlur

    - feImage

    - feMerge

    - feMorphology

    - feOffset

    - feSpecularLighting

    - feTile

    - feTurbulence


    你可以使用滤镜效果渲染 2D 形形以及文本字符串。Listing 7.8 显示了 SVG 文档 BlurFilterText1.svg 的内容，它使用模糊滤镜渲染了一个文本字符串。


