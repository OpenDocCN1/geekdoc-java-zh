    ![](img/0a6af518702639b3a358cdd75f17af79_162_0.png) ![](img/0a6af518702639b3a358cdd75f17af79_162_1.png)


    **PROJECT HOUDINI**


    Houdini is a W3C task force whose goal is to provide a set of APIs to make


    CSS consistent in all modern browsers. These APIs will also enable develop-


    ers to extend CSS by accessing the styling and layout process of a browser’s


    rendering engine. Although Houdini is a relatively new group, some Houdini


    samples are here: *https://github.com/GoogleChrome/houdini-samples*.


    As you probably know by now, polyfills (such as Modernizr) are JavaScript


    toolkits that “fill in” missing features in browsers so that other JavaScript
    tool-


    kits will operate consistently in different modern browsers. In essence, polyfills


    work by modifying the DOM.


    The CSS “counterpart” to the DOM is the CSSOM, which is an acronym


    for the CSS Object Model. Unfortunately, the CSSOM is inconsistent across


    browsers and lacks critical features. Moreover, “polyfilling” CSS is more dif-


    ficult than polyfilling the DOM (and it’s also an incomplete solution).


    One deficiency of the CSSOM is that it will discard any CSS rules or dec-


    larations that are not recognized; therefore, it’s necessary to use the DOM


    (specifically to access <style> and <link> elements) in order to polyfill those


    rules and declarations.


    In essence, the goal of Houdini is to modify the browser’s internal render-


    ing engine in order to “normalize” (i.e., eliminate inconsistent behavior of)


    CSS in modern browsers.


    **The Rendering Pipeline**


    The Rendering Pipeline involves the following sequence of phases (in this


    order):


    **1\.** Parser


    **2\.** DOM/CSSOM


    **3\.** Cascade


    **4\.** Layout


    **5\.** Paint


    **6\.** Composite


    The first three phases are the components of the CSS Properties and Values


    API, and the last three phases comprise the Worklets. Houdini has introduced


    Phase 1 (not written yet) and Phase 3 in the Rendering Pipeline. Phase 1 is


    where external stylesheets will be handled correctly, and also where CSS cus-


    tom extensions will be supported.


    Houdini also introduces the notion of worklets, which are essentially scripts


    for handling registration-related operations. Worklets support various features,


    such as the ability to invoke JavaScript code.


    Navigate to the Houdini home page for more detailed information about


    the proposed Houdini APIs.'
