    \n![](img/0a6af518702639b3a358cdd75f17af79_44_1.png)\n\n***FIGURE 2.5*** CSS3\
    \ radial gradient effect.\n\n## CSS3 GRADIENT GENERATORS\n\nAlthough you can define\
    \ CSS3 gradients manually, and even become proficient in doing so, an alternative\
    \ involves the use of online tools, some of which are listed here:\n\n- http://gradientgenerator.com/\n\
    - https://github.com/istvan-ujjmeszaros/css-gradient-generator.\n\nThis online\
    \ CSS3 gradient generator supports Sass:\n\n- http://www.colorzilla.com/gradient-editor/\n\
    \nExperiment with these (and other) CSS3 gradient tools to determine which tools\
    \ are best suited for your needs. One caveat: some gradient generators will generate\
    \ code that contains browser-specific prefixes that are no longer required. If\
    \ you are concerned about generating such code, the following website contains\
    \ cautionary details regarding gradient generators (specifically about redundant\
    \ browser-specific prefixes):\n\n- http://codepen.io/thebabydino/full/pjxVWp.\n\
    \n## CSS3 2D TRANSFORMS\n\nIntroduction to CSS3 • **29**\n\n![](img/0a6af518702639b3a358cdd75f17af79_45_0.png)\n\
    \nCSS3 supports transforms that you can apply to 2D shapes and also to binary\
    \ files. The CSS3 transforms are scale, rotate, skew (deprecated), and translate,\
    \ as well as perspective and matrix. Note that you will learn about transitions\
    \ in Chapter 9. However, an alternative is to use GSAP (discussed in Chapter 7).\
    \ For example, consider the following selector:\n\n```css\n/* not supported in\
