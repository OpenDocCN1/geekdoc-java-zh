    HTML5 Features •  **3**


    ![](img/0a6af518702639b3a358cdd75f17af79_19_0.png) ![](img/0a6af518702639b3a358cdd75f17af79_19_1.png)


    There is one other point to keep in mind: the specification for HTML 4.01


    (the predecessor to HTML5) was introduced in 1999, so HTML5 represents


    the largest advance in HTML in years, and perhaps the inclusion of other


    technologies was inevitable. There is a great deal of excitement surrounding


    HTML5\. Indeed, the enthusiasm for HTML5 has accelerated the speed with


    which HTML became a formal specification based on open standards.


    **Browser Support for HTML5**


    The WebKit-based browsers (Chrome and Safari), as well as Mozilla Fire-


    fox, Opera, IE10, and Microsoft Edge support many HTML features, on desk-


    tops as well as mobile devices. As for mobile devices, a very good website that


    lists the HTML features (including the ones that have been discussed in this


    chapter) that are supported by mobile browsers is here:


    *http://mobilehtml5.org/.*


    Currently Safari on iOS supports twenty-eight features whereas the


    Android supports twenty-four features (other browsers are listed as well).


    Another good website that provides test results of HTML-related features


    on various mobile devices is here:


    *http://www.quirksmode.org/mobile/*.


    The preceding website is maintained by Peter Paul Koch (who is often


    called PPK), and he maintains websites with many test results, along with blog


    posts expressing his views about trends in HTML5 and the mobile space.


    **WHICH TECHNOLOGIES ARE INCLUDED IN HTML5?**


    The following list contains a combination of technologies that are formally


    included in the HTML5 specification, as well as several other technologies that


    are frequently associated with HTML5:


    • Canvas 2D


    • CSS3


    • Drag-and-Drop (DnD)


    • File API


    • Geolocation


    • Microdata


    • Offline Applications


    • Server Sent Events (SSE)


    • SVG


    • Web Intents


    • Web Messaging


    • Web Storage


    • Web Sockets


    • Web Workers'
- md: "\n**4** • CSS3 Pocket Primer\n\nThere are other technologies that are often\
    \ associated with HTML5, including\n\nWebGL and XHR2 (XmlHTTPRequest Level 2).\n\
    \nKeep in mind that the status of some of these technologies will change, so\n\
    \nbe sure to visit the link with the details of the W3C specification for each\
    \ of\n\nthese technologies in order to find their most recent status.\n\n## DIFFERENCES\
    \ BETWEEN HTML4 TAGS AND HTML5 TAGS\n\nBroadly speaking, HTML5 differs from earlier\
    \ versions of HTML in the\n\nfollowing ways:\n\n- Does not support some HTML4.x\
    \ elements\n- Provides support for new elements\n- Simplifies some existing elements\n\
    - Includes support for custom attributes\n\nThe following are some new elements\
    \ in HTML5: <article>, <aside>, <audio>, <canvas>, <command>, <datalist>, <details>,\
    \ <dialog>, <figure>, <footer>, <header>, <keygen>, <mark>, <meter>, <nav>, <output>,\
    \ <progress>, <rp>, <rt>, <ruby>, <section>, <source>, <time>, and <video>.\n\n\
    The HTML elements that are not recommended for new work in HTML5\n\n(many of which\
    \ have been replaced with CSS styling) include the following:\n\n<acronym>, <applet>,\
    \ <basefont>, <big>, <center>, <dir>, <font>, <frame>, <frameset>, <noframes>,\
    \ <s>, <strike>, <tt>, and <u>.\n\nYou are probably already aware of the new HTML5\
    \ <audio> element and\n\nHTML5 <video> element, and later in this chapter you’ll\
    \ see examples of how\n\nto use these elements in HTML5 websites.\n\nOne important\
    \ new HTML5 feature is custom data attributes, which always have a data-prefix.\
    \ This support for custom data attributes provides\n\nHTML5 markup with some of\
    \ the functionality that is available in XML, which\n\nenables code to process\
    \ custom tags and their values and also pass validation\n\nat the same time.\n\
    \nIf you want additional details, a full list of the differences between HTML5\n\
    \nand HTML4 is in the following W3C document:\n\n*http://dev.w3.org/html5/html4-differences/.*\n\
    \n## USEFUL ONLINE TOOLS FOR HTML5 DEVELOPMENT\n\nBefore delving into the new\
    \ HTML5 elements that are discussed in this\n\nchapter, you need to know about\
    \ the online tools that can assist in creating\n\nwell-written HTML. These tools\
    \ are available because of one important fact:\n\nmodern browsers differ in terms\
    \ of their support for HTML5 features (for\n\ndesktop browsers and also for mobile\
    \ browsers). Fortunately, tools such as\n\nHTML5 Features • 5\n\nModernizr enable\
    \ you to detect HTML5 feature support in modern browsers\n\nusing simple JavaScript\
    \ code.\n\n### Modernizr\n\nModernizr is a very useful tool for HTML5-related\
    \ feature detection in\n\nvarious browsers, and its home page is here:\n\n*http://www.modernizr.com/.*\n\
    \nIn case you didn’t already know, server-side “browser sniffing” used to be\n\
    \na popular technique for detecting the browser that you were using to render\n\
    \na particular website, but this technique is not as accurate (or as “clean”)\
    \ due\n\nto rapidly changing implementations in browsers. Indeed, the most popular\n\
    \nwebsites that check for HTML5 support use feature detection and not browser\n\
    \nsniffing.\n\nAt some point you will start using JavaScript in your HTML5 websites\
    \ (indeed,\n\nyou probably do so already), and Modernizr provides a programmatic\n\
    \nway to check for many HTML5 and CSS3 features in different browsers.\n\nIn order\
    \ to use Modernizr, include the following code snippet in the\n\n<head> element\
    \ of your websites:\n\n```html\n<script src=\"modernizr.min.js\" type=\"text/javascript\"\
    >\n</script>\n```\n\nThe following type of code block illustrates one way that\
    \ you can use Modernizr in an HTML page:\n\n```javascript\nif(Modernizr.canvas)\
    \ {\n    // canvas is available\n    // do something here\n} else {\n    // canvas\
    \ is not available\n    // do something else here\n}\n```\n\n*Unlike many scripts\
    \ that can be inserted after the body of the page, Modernizr is designed to run\
    \ before the page is rendered and before any other scripts.*\n\nNavigate to the\
    \ Modernizr home page where you can read the documentation, tutorials, and details\
    \ regarding the set of feature detection.\n\n### Caniuse\n\nThe following website\
    \ (“When Can I Use . . .”) is extremely useful because\n\nit provides information\
    \ regarding support for many HTML5 features in modern browsers:\n\n*http://www.caniuse.com.*\n\
    \nCurrently there are two main tabs on this website. The first (and default)\n\
    \ntab is divided into a number of sections (CSS, HTML5, SVG, JS API, and NOTE\
    \ 6 • CSS3 Pocket Primer Other), and each section contains a list of technical\
    \ items that are hyperlinks to other websites that provide detailed information.\n\
    \nThe second tab on this website is called “tables,” and when you click on this\n\
    \ntab you will see a tabular display of information in a set of tables. The columns\n\
    \nin each table are modern browsers, the rows specify features, and the cells\
    \ in\n\nthe tables provide the browser version numbers where the specified features\n\
    \nare supported.\n\nThe following website also provides very useful information\
    \ regarding\n\nHTML5:\n\n*http://html5boilerplate.com/.*\n\n## USING FEATURE DETECTION\
    \ IN HTML WEBSITES\n\nBrowser or UA sniffing refers to parsing the User Agent\
    \ string available in\n\nevery browser, and then using the results to determine\
    \ how to proceed. However, browser sniffing is unreliable, and it’s been replaced\
    \ by feature detection, which checks for the availability of features in a browser.\
    \ Feature detection can\n\ntreat new browsers in the same manner as current browsers,\
    \ whereas browser\n\nsniffing uses hard-coded strings (which might also contain\
    \ regular expressions),\n\nso new code must be added whenever a new browser becomes\
    \ available.\n\nThe four basic ways to detect for HTML5 functions are listed here:\n\
    \n- Check for the property on a global object\n- Check for the property on an\
    \ element you create\n- Check that a method returns a correct value\n- Check that\
    \ an element retains a value\n\nEvery HTML5 document is displayed in a global\
    \ element, which is usually called\n\nthe navigator or the window. You can use\
    \ a global element to test whether\n\nor not offline web applications are supported\
    \ in a browser as shown here:\n\n```javascript\nif(window.applicationCache) {\n\
    \    console.log(\"Your browser supports offline apps.\");\n} else {\n    console.log(\"\
    Your browser does not support offline apps.\");\n}\n```\n\nIf your browser supports\
    \ the applicationCache item, then it can use features such as online/offline detection,\
    \ the offline application cache, and so forth.\n\nAn example of testing whether\
    \ or not an element retains a value is shown\n\nhere:\n\n```javascript\nvar div\
    \ = document.createElement('div');\ndiv.style.cssText = \"background-color:rgba(150,255,150,.5)\"\
    ;\nif(!!~('' + div.style.backgroundColor).indexOf('rgba')){\n    // rgba is supported\
    \ so do something here\n}\n```\n\n## A SIMPLE HTML WEBSITE\n\nIn addition to introducing\
    \ many new semantic elements, HTML5 has\n\nsimplified several elements, including\
    \ the <DOCTYPE> declaration and the attributes lang and charset. Listing 1.1 displays\
    \ Sample1.html, which is an\n\nHTML5 website that illustrates the simplified syntax\
    \ of HTML5.\n\n***LISTING 1.1 Sample1.html***\n\n```html\n<!doctype html>\n<html\
    \ lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>This is HTML5</title>\n\
    </head>\n<body>\n    <div id=\"outer\"></div>\n</body>\n</html>\n```\n\nListing\
    \ 1.1 contains an HTML5 <!DOCTYPE> element whose simple structure\n\nis very intuitive\
    \ and easy to remember, especially in comparison to the syntax\n\nfor an HTML4\
    \ <!DOCTYPE> element (try to construct one from memory!).\n\nThis markup is backward\
    \ compatible: it triggers standards mode in all browsers\n\nthat have standards\
    \ mode (versus quirks mode) and it also tells the browser to use the special HTML5\
    \ parsing mode.\n\nIn addition, the <meta> tag and its attributes lang and charset\
    \ are simpler than their counterparts in earlier versions of HTML. Note that HTML5\
    \ supports the new syntax as well as the earlier syntax, so your existing HTML\
    \ pages will be recognized in HTML5.\n\n## NEW HTML5 ELEMENTS\n\nThis section\
    \ discusses some of the useful new elements in HTML5, which include semantic-related\
    \ elements, the <video> element, and the <audio> element. The new types for the\
    \ <input> element are discussed in the section for HTML5 forms (later in this\
    \ chapter). A modest knowledge of the new HTML5 tags is required in order to follow\
    \ the examples in this book, so you can skim through this section if you do not\
    \ require extensive knowledge of HTML5 elements.\n\n### Semantic Markup HTML5\
    \ Elements\n\nHTML5 provides new elements for “semantic markup” that are designed\
    \ to provide more meaningful structure in your HTML5 websites. Some of the\n"
  mdcn: "\n\n**4** • CSS3 入门指南\n\n还有其他经常与 HTML5 关联的技术，包括\n\nWebGL 和 XHR2 (XmlHTTPRequest\
    \ Level 2)。\n\n请记住，其中某些技术的状态可能会发生变化，因此请务必访问每个这些技术对应的 W3C 规范详情链接，以查找它们最新的状态。\n\n\
    ## HTML4 标签与 HTML5 标签之间的差异\n\n广义上，HTML5 与之前的 HTML 版本相比，主要体现在以下几个方面：\n\n- 不支持某些\
    \ HTML4.x 元素\n- 提供了对新元素的支持\n- 简化了一些现有的元素\n- 包含了对自定义属性的支持\n\n以下是 HTML5 中的一些新元素：<article>,\
    \ <aside>, <audio>, <canvas>, <command>, <datalist>, <details>, <dialog>, <figure>,\
    \ <footer>, <header>, <keygen>, <mark>, <meter>, <nav>, <output>, <progress>,\
    \ <rp>, <rt>, <ruby>, <section>, <source>, <time> 和 <video>。\n\n在 HTML5 中不建议在新的工作中使用\
    \ HTML 元素（其中许多已被 CSS 样式替换）包括：\n\n<acronym>, <applet>, <basefont>, <big>, <center>,\
    \ <dir>, <font>, <frame>, <frameset>, <noframes>, <s>, <strike>, <tt> 和 <u>。\n\
    \n你可能已经知道新的 HTML5 <audio> 元素和 HTML5 <video> 元素了，在本章的后后部分，你将看到如何在 HTML5 网站中使用这些元素的示例。\n\
    \n一个重要的 HTML5 新功能是自定义数据属性，它们始终带有 `data-` 前缀。这种对自定义数据属性的支持为 HTML5 标记提供了类似于 XML\
    \ 的某些功能，使得代码能够处理自定义标签及其值，并同时通过验证。\n\n如果你需要更多细节，HTML5 和 HTML4 之间差异的完整列表可以在以下 W3C\
    \ 文档中：\n\n*http://dev.w3.org/html5/html4-differences/*\n\n## 用于 HTML5 开发的实用在线工具\n\
    \n在深入探讨本章介绍的新 HTML5 元素之前，你需要了解可以帮助创建编写良好的 HTML 的在线工具。这些工具的存在是因为一个重要的事实：现代浏览器在\
    \ HTML5 特性的支持方面存在差异（包括桌面浏览器和移动浏览器）。幸运的是，像\n\nHTML5 Features • 5\n\n这样的工具允许你使用简单的\
    \ JavaScript 代码检测现代浏览器中对 HTML5 特性的支持。\n\n### Modernizr\n\nModernizr 是一个用于各种浏览器中进行\
    \ HTML5 相关功能检测的非常有用的工具，它的主页在这里：\n\n*http://www.modernizr.com/*\n\n在你不可能不知道的情况下，服务器端“浏览器指纹”（browser\
    \ sniffing）曾是检测你用于渲染特定网站的浏览器的流行技术，但由于浏览器中实现方式的快速变化，这种技术不再那么准确（或不那么“干净”）。事实上，大多数检查\
    \ HTML5 支持的流行网站都使用功能检测而不是浏览器指纹。\n\n在某个时刻，你将开始在你的 HTML5 网站中使用 JavaScript（事实上，你可能已经在用了），而\
    \ Modernizr 提供了一种程序化的方法来检查不同浏览器中的许多 HTML5 和 CSS3 特性。\n\n要使用 Modernizr，请在网站的 `<head>`\
    \ 元素中包含以下代码段：\n\n```html\n<script src=\"modernizr.min.js\" type=\"text/javascript\"\
    >\n</script>\n```\n\n以下类型的代码块说明了你可以在 HTML 页面中使用 Modernizr 的一种方法：\n\n```javascript\n\
    if(Modernizr.canvas) {\n    // canvas is available\n    // do something here\n\
    } else {\n    // canvas is not available\n    // do something else here\n}\n```\n\
    \n*与许多可以插入页面 body 之后的脚本不同，Modernizr 的设计是在页面渲染之前以及任何其他脚本之前运行的。*\n\n导航到 Modernizr\
    \ 主页，你可以在那里阅读关于功能检测集的文档、教程和详细信息。\n\n### Caniuse\n\n以下网站（“When Can I Use . . .”\
    \ 即“什么时候可以使用……”）非常有用，因为它提供了有关现代浏览器对许多 HTML5 特性支持情况的信息：\n\n*http://www.caniuse.com*\n\
    \n目前该网站有两个主要标签。第一个（也是默认）标签被分为若干部分（CSS, HTML5, SVG, JS API, 以及 NOTE 6 • CSS3 入门指南\
    \ Other），每个部分包含一个技术项目列表，这些项目是链接到提供详细信息的其他网站的超链接。\n\n该网站的第二个标签称为“tables”（表格），当你点击此标签时，你将看到一组表格中信息的表格化显示。每个表格的列是现代浏览器，行指定特性，表格中的单元格提供支持指定特性的浏览器版本号。\n\
    \n以下网站也提供了关于 HTML5 的非常有有用的信息：\n\n*http://html5boilerplate.com/*\n\n## 在 HTML 网站中使用功能检测\n\
    \n浏览器或 UA 指纹（UA sniffing）是指解析每个浏览器可用的用户代理（User Agent）字符串，然后使用结果来确定如何操作。然而，浏览器指纹是不可靠的，它已经被功能检测（feature\
    \ detection）取代，功能检测检查浏览器中功能的可用性。功能检测可以像对待当前浏览器一样对待新浏览器，而指纹使用硬编码字符串（可能还包含正则表达式），因此每当有新浏览器可用时，必须添加新代码。\n\
    \n这里的四种基本方法如下：\n\n- 检查全局对象上的属性\n- 检查创建的元素\n- 检查方法返回正确的值\n- 检查元素保留了值\n\n如果浏览器支持\
    \ applicationCache，那么它可以使用离线检测、离线缓存等功能，如下：\n\n```javascript\nif(window.applicationCache)\
    \ {\n    console.log(\"您的浏览器支持离线应用。\");\n} else {\n    console.log(\"您的浏览器不支持离线应用。\"\
    );\n}\n```\n\n如果你的浏览器支持 applicationCache，那么它可以使用离线检测、离线缓存等功能。\n\n测试元素是否保留了值的示例如下：\n\
    \n```javascript\nvar div = document.createElement('div');\ndiv.style.cssText =\
    \ \"background-color:rgba(150,255,150,.5)\";\nif(!!~('' + div.style.backgroundColor).indexOf('rgba')){\n\
    \    // 支持 rgba，在此处操作\n}\n```\n\n## 一个简单的 HTML 网站\n\n除了引入许多新的语义元素外，HTML5 还简化了一些元素，包括\
    \ <DOCTYPE> 声明以及 lang 和 charset 属性。列表 1.1 显示了 Sample.html，这是一个展示 HTML5 简化语法的 HTML\
    \ 网站。\n\n***列表 1.1 Sample.html***\n\n```html\n<!doctype html>\n<html lang=\"en\"\
    >\n<head>\n    <meta charset=\"utf-8\">\n    <title>这是 HTML5</title>\n</head>\n\
    <body>\n    <div id=\"outer\"></div>\n</body>\n</html>\n```\n\n列表 1.1 包含一个 HTML5\
