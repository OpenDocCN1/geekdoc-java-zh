    \ identified via a number between 0 and 100. You also specify the duration of\
    \ an animation effect, and the duration of each keyframe is calculated as a percentage\
    \ of the duration. For example, the following CSS3 @keyframes rule defines what\
    \ happens during the first half of the animation as well as the second half of\
    \ the animation:\n\n```css\n@keyframes glow {\n  0% {\n    box-shadow: 0 0 24px\
    \ rgba(255, 255, 0.5);\n  }\n  50% {\n    box-shadow: 0 0 24px rgba(255, 0, 0.9);\n\
    \  }\n  100% {\n    box-shadow: 0 0 24px rgba(255, 255, 0.5);\n  }\n}\n```\nThus,\
    \ if the animation effect lasts for ten seconds, then the first two effects last\
