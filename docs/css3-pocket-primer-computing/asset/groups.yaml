    CHAPTER 7


    *SVG ESSENTIALS*


    T


    his fast-paced chapter delves into many features of SVG, which is an


    XML-based technology for rendering 2D shapes. Entire books have


    been written about SVG, and one chapter about SVG is not enough to


    become really proficient. As a sort of compromise, the code samples contain


    multiple SVG features that will save you time from having to develop them


    by yourself. For instance, the code sample that contains SVG transforms and


    gradients does not provide a detailed description of these SVG features be-


    cause you have already encountered transforms and gradients in the first sev-


    eral chapters of this book. Consequently, you already know the concepts, and


    it’s primarily a case of learning the SVG syntax for creating such effects. At
    the


    same time, feel free to focus on the sections that illustrate the SVG features


    that are of greatest interest to you.


    In case you didn’t already know, SVG has recently become the focus of con-


    siderable interest in Web development, in part because its feature set works


    well with CSS3\. In addition, you can use SVG instead of PNG files (discussed


    in Chapter 8). SVG also provides functionality that is unavailable in CSS3, such


    as support for arbitrary polygons, elliptic arcs, and quadratic and cubic Bezier


    curves. Moreover, you can easily combine SVG with CSS3 selectors in order to


    create 3D graphics and animation effects.


    The first part of this chapter contains code samples that illustrate how to


    render lines and rectangles, and also how to create linear gradients and radial


    gradients. The second part of this chapter discusses polygonal shapes and the


    highly versatile SVG <path> element.


    The third section contains Bezier curves with SVG transforms, how to ren-


    der text in SVG, and SVG filters. The final section contains examples of work-


    ing with various combinations of SVG, CSS3, and jQuery, followed by a brief


    comparison of SVG and CSS3.'
- md: "\n**122** • CSS3 Pocket Primer\n\n## BASIC FEATURES OF SVG\n\nSVG supports\
    \ linear gradients, radial gradients, filter effects, transforms (translate, scale,\
    \ skew, and rotate), Bezier curves, and animation effects. You can create SVG\
    \ documents with code for rendering shapes, or you can embed SVG directly in an\
    \ HTML Web page. SVG elements are inserted into the DOM of a Web page, which means\
    \ that it’s possible to track/manage groups of SVG elements. Some advantages of\
    \ SVG include:\n\n- No blurred/jagged edges when zooming in\n- Convenient format\
    \ for import/export between tools\n- Can apply XSL stylesheets to SVG documents\n\
    \nOn the other hand, keep in mind that SVG is verbose, and can be difficult to\
    \ read in SVG documents that are programmatically generated. In addition, nontrivial\
    \ animation effects can be cumbersome: consider using D3 for creating animation\
    \ and handling mouse-related events. Although this chapter focuses on “pure” SVG,\
    \ a collection of SVG code samples with JavaScript is here: *https://github.com/ocampesato/svg-graphics*.\n\
    \nAs you will see, it’s possible to match CSS selectors with SVG elements via\
    \ the CSS url() function, and the combination of CSS3 and SVG gives you a powerful\
    \ mechanism for leveraging the functionality of SVG in CSS3 selectors. In fact,\
    \ you can combine CSS, SVG, D3, and HTML5 Canvas elements in the same HTML Web\
    \ page.\n\n## RENDERING LINE SEGMENTS AND RECTANGLES IN SVG\n\nThis section shows\
    \ you how to render line segments and rectangles in SVG documents. As a simple\
    \ example, SVG supports a <line> element for rendering line segments, and its\
    \ syntax looks like this:\n\n<line x1=\"20\" y1=\"20\" x2=\"100\" y2=\"150\".../>\n\
    \nSVG <line> elements render line segments that connect the two points (x1,y1)\
    \ and (x2,y2).\n\nSVG supports a <rect> element for rendering rectangles, and\
    \ its syntax looks like this:\n\n<rect width=\"200\" height=\"50\" x=\"20\" y=\"\
    50\".../>\n\nThe SVG <rect> element renders a rectangle whose width and height\
    \ are specified in the width and height attributes. The upper-left vertex of the\
    \ rectangle is specified by the point with coordinates (x,y).\n\nListing 7.1 displays\
    \ the contents of BasicShapes1.svg, which illustrates how to render line segments\
    \ and rectangles.\n\n***LISTING 7.1 BasicShapes1.svg***\n\n<?xml version=\"1.0\"\
    \ encoding=\"iso-8859-1\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 20001102//EN\"\
    \ \"http://www.w3.org/TR/2000/CR-SVG-20001102/DTD/svg-20001102.dtd\">\n<svg xmlns=\"\
    http://www.w3.org/2000/svg\"\nxmlns:xlink=\"http://www.w3.org/1999/xlink\"\nwidth=\"\
    100%\" height=\"100%\">\n<g>\n  <!-- left-side figures -->\n  <line x1=\"20\"\
    \ y1=\"20\" x2=\"220\" y2=\"20\" stroke=\"blue\" stroke-width=\"4\"/>\n  <line\
    \ x1=\"20\" y1=\"40\" x2=\"220\" y2=\"40\" stroke=\"red\" stroke-width=\"10\"\
    />\n  <rect width=\"200\" height=\"50\" x=\"20\" y=\"70\" fill=\"red\" stroke=\"\
    black\" stroke-width=\"4\"/>\n  <path d=\"M20,150 l200,0 l0,50 l-200,0 z\" fill=\"\
    blue\" stroke=\"red\" stroke-width=\"4\"/>\n  <!-- right-side figures -->\n  <path\
    \ d=\"M250,20 l200,0 l-100,50 z\" fill=\"blue\" stroke=\"red\" stroke-width=\"\
    4\"/>\n  <path d=\"M300,100 l100,0 l50,50 l-50,50 l-100,0 l-50,-50 z\" fill=\"\
    yellow\" stroke=\"red\" stroke-width=\"4\"/>\n</g>\n</svg>\n\nThe first SVG <line>\
    \ element in Listing 7.1 specifies the color blue and a stroke-width (i.e., line\
    \ width) of 4, whereas the second SVG <line> element specifies the color red and\
    \ a stroke-width of 10.\n\nNotice that the first SVG <rect> element renders a\
    \ rectangle that looks the same (except for the color) as the second SVG <line>\
    \ element, which shows that it’s possible to use different SVG elements to render\
    \ a rectangle (or a line segment).\n\nThe SVG <path> element is probably the most\
    \ flexible and powerful element because you can create arbitrarily complex shapes,\
    \ based on a “concatenation” of other elements. Later in this chapter you will\
    \ see an example of how to render multiple Bezier curves.\n\nThe SVG <path> element\
    \ contains a d attribute that specifies the points. For example, the first SVG\
    \ <path> element in Listing 7.1 contains the following d:\n\nd=\"M20,150 l200,0\
    \ l0,50 l-200,0 z\"\n\nThis is how to interpret the d attribute:\n\n- M20,150:\
    \ Move to point (20,150)\n- l200,0: Draw a line 200 units to the right\n- l0,50:\
