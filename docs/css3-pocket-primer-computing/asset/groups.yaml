    **SVG** **<POLYGON>** **AND** **<POLYLINE>** **ELEMENTS**


    The SVG <polygon> element contains a polygon attribute in which you


    can specify points that represent the vertices of a polygon. The SVG <poly-


    gon> element is most useful when you want to create polygons with an arbi-


    trary number of sides, but you can also use this element to render line segments


    and rectangles.


    The syntax of the SVG <polygon> element looks like this:


    <polygon path="specify a list of points" fill="…" />


