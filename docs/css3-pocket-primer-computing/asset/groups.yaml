    ## CSS3 and Box Shadow Effects


    You can also apply a shadow effect to a box that encloses a text string, which
    can be effective in terms of drawing attention to specific parts of a Web page.
    However, the same caveat regarding overuse applies to box shadows.


    The HTML page BoxShadow1.html and BoxShadow1.css are not shown here but they are
    available on the companion disc, and together they render a box shadow effect.


    The key property is the box-shadow property, as shown here in bold for Mozilla,
    WebKit, and the non-prefixed property:


    ```css

    #box1 {

    position:relative;top:10px;

    width: 50%;

    height: 30px;

    font-size: 20px;

    box-shadow: 10px 10px 5px #800;

    }

    ```


    Figure 2.2 displays a screenshot based on the code in BoxShadow1.html and BoxShadow1.css.


    ***FIGURE 2.2*** CSS3 box shadow effect.


    ## CSS3 and Rounded Corners


    Web developers have waited a long time for rounded corners in CSS, and CSS3 makes
    it very easy to render boxes with rounded corners. Listing 2.3 displays the contents
    of the HTML page RoundedCorners1.html that renders text strings in boxes with
    rounded corners, and Listing 2.4 displays the CSS stylesheet RoundedCorners1.css.


    ***LISTING 2.3 RoundedCorners1.html***


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <link href="RoundedCorners1.css" rel="stylesheet" type="text/css">

    </head>

    <body>

    <div id="outer">

    <a href="#" class="anchor">Text Inside a Rounded Rectangle</a>

    </div>

    <div id="text1">Line One of Text with a Shadow Effect</div>

    <div id="text2">Line Two of Text with a Shadow Effect</div>

    </body>

    </html>

    ```


    Listing 2.3 contains a reference to the CSS stylesheet RoundedCorners1.css that
    contains three CSS selectors that match the elements whose id attribute has value
    anchor, text1, and text2, respectively. The CSS selectors defined in RoundedCorners1.css
    create visual effects, and as you will see, the hover pseudo-selector enables
    you to create animation effects.


    ***LISTING 2.4 RoundedCorners1.css***


    ```css

    a.anchor:hover {

    background: #00F;

    }

    a.anchor {

    background: #FF0;

    font-size: 24px;

    font-weight: bold;

    padding: 4px 4px;

    color: rgba(255,0,0,0.8);

    text-shadow: 0 1px 1px rgba(0,0,0,0.4);

    transition: all 2.0s ease;

    border-radius: 8px;

    }

    ```


    Listing 2.4 contains the selector a.anchor:hover that changes the text color from
    yellow (#FF0) to blue (#00F) during a two-second interval whenever users hover
    over any anchor element with their mouse.


    The selector a.anchor contains various attributes that specify the dimensions
    of the box that encloses the text in the <a> element, along with two new attributes.
    The first attribute specifies the transition attribute that we will discuss later
    in this chapter. The second attribute is border-radius whose value is 8px, which
    determines the radius (in pixels) of the rounded corners of the box that encloses
    the text in the <a> element. The last two selectors are identical to the selectors
    in Listing 2.1.


    Figure 2.3 displays the result of matching the selectors that are defined in the
    CSS stylesheet RoundedCorners1.css with elements in the HTML page RoundedCorners1.html.


    ***FIGURE 2.3*** CSS3 rounded corners effect.


    ## CSS3 LINEAR GRADIENTS


    Browsers support linear gradients, which create a transition between two or more
    colors. The direction can be specified using an angle or a direction keyword.


    The syntax for a linear gradient is:

    `background: linear-gradient([direction], color-stop1, color-stop2, ...);`


    The direction can be an angle (e.g., `45deg`, `90deg`) or a keyword like `to top`,
    `to bottom`, `to left`, `to right`, `to top right`.


    A color-stop consists of a color and an optional position. The position is a percentage
    or a length.


    Example:

    ```css

    background: linear-gradient(to right, red, 0%, yellow 100%);

    ```


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8">

    <title>CSS Linear Gradient</title>

    <link href="LinearGradient.css" rel="stylesheet" type="text/css">

    </head>

    <body>

    <div id="outer">

    <p id="line1">line 1 with a gradient</p>

    <p id="line2">line 2 with a gradient</p>

    <p id="line3">line 3 with a gradient</p>

    <p id="line4">line 4 with a gradient</p>

    <p id="outline">line 5 with Shadow Outline</p>

    <h3><a href="#">A Line of Gradient Text</a></h3>

    </div>

    </body>

    </html>

    ```


    Listing 2.5 contains four <p> elements and one <h3> element. Listing 2.5 also
    references the CSS stylesheet LinearGradient.css (displayed in Listing 2.6) that
    contains CSS selectors that match the four <p> elements and the <h3> element in
    Listing 2.5.


    ***LISTING 2.6 LinearGradient.css***


    ```css

    #line1 {

    width: 50%;

    font-size: 32px;

    background-image: linear-gradient(to bottom, #fff, #f00);

    border-radius: 4px;

    }

    #line2 {

    width: 50%;

    font-size: 32px;

    background-image: linear-gradient(to bottom left, #fff, #ff0);

    border-radius: 4px;

    }

    #line3 {

    width: 50%;

    font-size: 32px;

    background-image: linear-gradient(to bottom, #f00, #00f);

    border-radius: 4px;

    }

    #line4 {

    width: 50%;

    font-size: 32px;

    background-image: linear-gradient(to bottom left, #f00, #00f);

    border-radius: 4px;

    }

    #outline {

    font-size: 2.0em;

    }

    ```


    The code illustrates the use of linear gradients to create visual effects. The
    gradients can be applied in different directions and with various color stops.

