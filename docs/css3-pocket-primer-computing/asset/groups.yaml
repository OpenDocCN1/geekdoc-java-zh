    ## Miscellaneous Topics • **155**


    ## CSS-RELATED PERFORMANCE


    CSS3 provides wonderful functionality, such as rounded corners, as well as 2D
    and 3D graphics and animation effects. However, CSS3 features can differ in terms
    of performance, which obviously affects the performance of an HTML5 Web page.


    Recall that you can guarantee that the GPU will be used on a device by using something
    such as translate3D(0,0,0), which is essentially a “no operation.” You can also
    replace 2D transforms by their corresponding 3D transforms. However, an indiscriminate
    use of 3D transforms can cause a page reflow or a page repaint, which has an adverse
    impact on performance.


    Good articles regarding CSS paint times are here:


    - *http://css-tricks.com/efficiently-rendering-css/**

    - *http://www.html5rocks.com/en/tutorials/speed/css-paint-times/**

    - *http://stickmanventures.com/labs/demo/spinning-gears-Chrome-pre-serve-3d/#/*


    Another interesting point pertains to the use of CSS3 translate versus absolute
    position in a CSS selector. Paul Irish compares these techniques here: *http://paulirish.com/2012/why-moving-elements-with-translate-is-better-than-pos-abs-topleft/*.


    If you are interested in the lower level details about the painting process, CSS2
    defines the order of the painting process, which is the order in which the elements
    are stacked in the “stacking contexts.” This order affects painting because the
    stacks are painted from back to front. The stacking order of a block renderer
    is here:


    - Background color

    - Background image

    - Border

    - Children

    - Outline


    A more detailed explanation of the painting process can be found at the following:
    *http://www.html5rocks.com/en/tutorials/speed/unnecessary-paints/* and *http://www.html5rocks.com/en/tutorials/internals/howbrowserswork/*.


    Steve Souders has written at least two performance-related books and has written
    many blog posts regarding performance, and it’s definitely worth reading his work.


    ## A CONDENSED COMPARISON OF CSS, SVG, AND CANVAS


    CSS3 provides a) 2D/3D graphics/animation, b) GPU support, c) the ability to embed
    in an SVG <defs> element, d) “easing functions” for animation, and e) the capability
    to animate HTML elements.


    156 • CSS3 Pocket Primer


    SVG provides a) 2D graphics/animation, b) some GPU support, c) the ability to
    create arbitrary 2D shapes, d) custom <pattern>s, and e) grouping via the <g>
    element, and “easing functions in D3 (but SVG cannot animate HTML).


    Canvas provides a) 2D graphics/animation, b) GPU support, c) the ability to update
    many small objects (games), and d) the option of working with video (use ThreeJS/WebGL
    for 3D animation).


    CSS3+SVG is useful when a) you already have SVG-based data and b) you must support
    IE6 (this can be done with the Raphael toolkit but not D3).


    CSS3+D3 is good for modern browsers and is also easier for defining event handlers
    and animation (probably also easier to maintain/enhance).


    However, keep in mind that CSS3+SVG might not have GPU support (and perhaps consider
    D3 with BackboneJS/AngularJS/etc.).


    Use CSS3 to create 3D animation effects with SVG as follows:


    Step #1: create an SVG document

    Step #2: create an SVG <defs> element

    Step #3: create CSS3 selectors with CSS3 3D animation effects and put them in
    a <style> element

    Step #4: insert the <style> element in the <defs> element

    Step #5: set the “class” attribute in SVG elements so that it matches a CSS3 selector
    in the <style> element


    Note that you can also reference an external CSS stylesheet in an SVG document.


    Modern browsers support the <canvas> element. Use CSS3 with HTML5 Canvas by inserting
    a <canvas> element in a Web page and then use JavaScript APIs to create 2D shapes,
    all of which are rendered in a <canvas> element. Keep in mind that HTML5 <canvas>
    does not provide a DOM. However, CSS3 selectors can match the HTML5 <canvas> element.
    An article that explains how to trace Canvas calls is here: *http://www.html5rocks.com/en/tutorials/canvas/inspection/*.


    ## Which Is Faster: CSS3/Canvas/SVG?


    HTML5 Canvas is often faster than SVG for showing polygons and many small objects,
    but CSS3 is faster than Canvas for simple animation: *http://phrogz.net/tmp/image_speed.html*.
    Moreover, CSS3 is faster than SVG for gradients, and D3 is better/faster than
    SVG for “mouse.” The preceding rules are general guidelines: make sure that you
    test/compare the performance characteristics of a Web page, especially if you
    develop for mobile devices.


    ## WEB PAGES AND BINARY IMAGES


    Various factors can adversely affect the performance of an HTML Web page, which
    includes the download time for binary files. According to the following website,
    the average Web page is 2 megabytes, with 60% of the size resulting from images:
    *http://archive.org/interesting.php*. Performance can be improved via several
    techniques, such as image choice (discussed in another section), spritesheets,
    preprocessing, deferred loading, caching, and CDNs. The following subsections
    discuss Selecting a File Format


    As you know, SVG is a vector-based format, whereas other file formats are binary
    data. Despite the advantages of SVG, there are several performance-related points
    to keep in mind. First, the process of rendering SVG in a browser is slower (partly
    because of the conversion process) than small files. Second, bitmaps on mobile
    devices involve the GPU, whereas SVG on mobile devices does not always involve
    the GPU. Third, use a tool for optimizing SVG as well as binary files. With the
    preceding points in mind, SVG is well-suited for assets in a Web page that need
    to be scalable (SVG will always render them without jaggedies). If scalability
    is not a requirement, then PNG files are an option. JPEG files are well-suited
    for photographs. A good description of various file formats (and their trade-offs)
    is available here: *https://forums.adobe.com/thread/164028*.


    ## Optimizing SVG and Binary Files


    The following website is useful for optimizing SVG files (and also downloadable
    command-line versions of the tool): *https://earchibald.github.io/svgomg/*. You
    can also optimize binary assets using command-line tools such as this: *https://imageoptim.com/command-line.html*.
    The following link contains a tabular-based comparison of binary files by several
    tools: *http://jamiemason.github.io/ImageOpt-CLI/*.


    ## CSS Spritesheets


    CSS spritesheets involve the creation of one binary image that contains multiple
    images. Only a single HTTP request is required for downloading one spritesheet,
    which is more efficient than multiple HTTP requests for downloading the individual
    images separately. A particular image in a spritesheet is rendered in a Web page
    by specifying the relative offset of the image in the spritesheet. Manually calculating
    the offsets is a tedious and error-prone process. Fortunately, there are online
    tools that create spritesheets and automatically calculate the necessary offsets
    for the individual images. One commercial tool ($20 for a single user) is Zwoptex,
    and its home page is here: *https://zipple.com/zwoptex/*. SpriteMe is a free tool
    for generating spritesheets and the accompanying CSS, and its home page is here:
    *www.spriteme.org*. An article with best practices for spritesheets is here: *http://webdesigntutsplus.com/articles/css-sprites-best-practices-tools-and-helpful-applications--webdesign-8340*.


    If you need to resize any of your images, ImageMagick is an excellent command
    line tool for such a task, and its home page is here: *http://www.imagemagick.org/script/convert.php*.


    After resizing the images, you can create a new spritesheet with the modified
    images using a command line tool such as Glue: *http://glue.readthedocs.org/en/latest/*.
    Perform an Internet search for other tools and then compare their features to
    determine which tools support your requirements.


    ## The “Blur Up” Technique for Rendering Background Images


    This technique involves an initial display of a small image, followed by scaling
    that image and simultaneously applying a Gaussian blur filter (filters are discussed
    in Chapter 2). The details of this technique are described here: *https://css-tricks.com/the-blur-up-technique-for-loading-background-images/*.
    An example of this technique is here: *http://codepen.io/thatemil/pen/yYmaq/*.
    One interesting aspect of this technique pertains to the filter: you can use base64,
    CSS, or SVG for the filter definition. Another point of interest is the possibility
    of using this technique in progressive images (described in the next section).
    Incidentally, the Facebook engineering team uses this technique to load cover
    photo previews in their native applications.


    ## Progressive Images


    Another technique for loading images in an HTML Web page involves progressive
    images. This technique involves downloading and displaying an initial version
    of an image that has a lower resolution, and then “progressively” downloading
    and redisplaying the image until the full resolution is rendered. Interestingly,
    this technique was available in 2008 (and possibly earlier), and recently there
    has been a resurgence of interest in progressive images. However, the adoption
    rate of progressive images is still quite low. One possibility is mentioned in
    the following article that performed various tests involving images with three
    different formats: *http://www.webperformancoday.com/2014/09/17/progressive-image-rendering-good-evil/*.
    Although there are no definitive conclusions in the preceding article, there is
    an interesting quote: “When, as with the Progressive JPEG method, image rendition
    is a two-stage process in which an initially coarse image snaps into sharp focus,
    cognitive fluency is inhibited and the brain has to work slightly harder to make
    sense of what is being displayed.”

