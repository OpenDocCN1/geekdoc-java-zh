    使用“立即模式”（immediate mode），这是一种写后即忘的渲染方法。因此，如果你想在 HTML5 Canvas 中编写一个素描程序并还想提供“撤销”功能，你必须编程地跟踪在屏幕上绘制的所有内容。另一方面，SVG
    使用“保留模式”（retained mode），它涉及一个跟踪渲染对象及其它们之间关系的 DOM 结构。


