  mdcn: "\n**122** • CSS3 入门指南\n\n## SVG 的基础特性\n\nSVG 支持线性渐变、径向渐变、滤效果、变换（平移、缩放、倾斜和旋转）、贝塞尔曲线和动画效果。你可以通过代码创建用于渲染形状的\
    \ SVG 文档，也可以将 SVG 直接嵌入 HTML 网页中。SVG 元素被插入到网页的 DOM 中，这意味着可以对一组 SVG 元素进行跟踪/管理。SVG\
    \ 的优势包括：\n\n- 放大时边缘不会模糊/锯齿\n- 方便在工具之间导入/导出格式\n- 可以对 SVG 文档应用 XSL 样式表\n\n另一方面，请记住\
    \ SVG 是冗长的，并且在程序化生成的 SVG 文档中可能难以阅读。此外，非复杂的动画效果可能会很麻烦：考虑使用 D3 来创建动画和处理鼠标相关事件。虽然本章侧重于“纯”SVG，但这里有一个带有\
    \ JavaScript 的 SVG 代码示例：*https://github.com/ocampesato/svg-graphics*。\n\n正如你所看到的，可以通过\
    \ CSS 的 url() 函数将 CSS 选择器与 SVG 元素匹配，CSS3 和 SVG 的结合为你提供了一种强大的机制，可以在 CSS3 选择器中利用\
    \ SVG 的功能。事实上，你可以在同一个 HTML 网页中组合 CSS、SVG、D3 和 HTML5 Canvas 元素。\n\n## 在 SVG 中渲染线段和矩形\n\
    \n本节将向你展示如何在 SVG 文档中渲染线段和矩形。作为一个简单的示例，SVG 支持使用 <line> 元素来渲染线段，其语法如下：\n\n<line\
    \ x1=\"20\" y1=\"20\" x2=\"100\" y2=\"150\".../>\n\nSVG <line> 元素渲染连接两个点 (x1,y1)\
