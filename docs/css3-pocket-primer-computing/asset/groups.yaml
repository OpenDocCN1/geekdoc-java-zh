    CSS3 and HTML5 Canvas • 99


    ## THE HTML5 CANVAS COORDINATE SYSTEM


    Think back to your days in high school, where you learned that the Cartesian coordinate
    system identifies any point in the Euclidean plane by means of a pair of numbers,
    often written as (x,y). The first number represents the horizontal value and the
    second number represents the vertical value. The horizontal axis is labeled the
    x-axis, and positive values on the x-axis are to the right of the vertical axis
    (i.e., toward the right). The vertical axis is labeled the y-axis, and positive
    values on the y-axis are above the horizontal axis. The origin is the intersection
    point of the x-axis and the y-axis.


    The situation is almost the same in the HTML5 Canvas coordinate system. The x-axis
    is horizontal and the positive direction is toward the right. The y-axis is vertical,
    but the positive direction is *Downward*, which is the opposite direction of most
    graphs in a typical mathematics textbook. In the HTML5 Canvas coordinate system,
    the origin is the upper-left corner of the screen (not the lower-left corner),
    and the unit of measurement is the pixel.


    As a simple illustration, Figure 6.1 displays four points in an HTML5 <canvas>
    element.


    ***FIGURE 6.1*** Four points rendered in HTML5 Canvas.


    If you start from the origin (the upper-left corner of the screen) and move 50
    pixels to the right, followed by 50 pixels downward, you will reach the upper-left
    point in Figure 6.1. Next, if you start from the origin and move 200 pixels to
    the right and 50 pixels downward, you will reach the upper-right point in Listing
    6.1. In a similar fashion, the two points in the second “row” have coordinates
    (50,100) and (200,100). Notice that the two points in the first row have the same
    value for the y-coordinate, which makes sense because they are the same distance
    away from the top of the Web page; the same is true for the two points in the
    second row. Similarly, the two points in the left “column” have the same x-coordinate
    because they are both the same distance from the left side of the Web page.


    Now that you have an understanding of the HTML5 Canvas coordinate system, let’s
    take a look at the contents of Listing 6.1, which displays a minimal HTML5 Web
    page that is ready for rendering HTML5 Canvas-based graphics.


    100 • CSS3 Pocket Primer


    The Canvas-based code samples in this chapter contain the code (or some variant)
    that is displayed in Listing 6.1.


    *If you launch this code in a browser session, you will only see a blank screen.*


    ***LISTING 6.1 Canvas1.html***


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8">

    <title>Canvas Example</title>

    <script><!--

    window.addEventListener(''load'', function () {

    // Get the canvas element

    var elem = document.getElementById(''myCanvas'');

    if (!elem || !elem.getContext) {

    return;

    }

    // Get the canvas 2d context

    var context = elem.getContext(''2d'');

    if (!context) {

    return;

    }

    // Insert your custom Canvas graphics code here

    });

    // --></script>

    </head>

    <body>

    <p>

    <canvas id="myCanvas" width="300" height="300">

    No support for Canvas.

    </canvas>

    </p>

    </body>

    </html>

    ```


    Listing 6.1 contains an HTML <head> element that checks for the existence of an
    HTML <canvas> element inside the HTML <body> element of the Web page, and then
    gets the 2D context from the HTML <canvas> element.


    If you skip over the various conditional statements in Listing 6.1, there are
    two lines of code that enable us to get a reference to the variable context, which
    represents a drawable surface:


    `var elem = document.getElementById(''myCanvas'');`

    `var context = elem.getContext(''2d'');`


    **NOTE**


    CSS3 and HTML5 Canvas • 101


    If you launch Listing 6.1 in a browser that does not support HTML5 Canvas, it
    will display the text message “No support for Canvas.”


    The following code snippet is executed whenever you launch the Web page because
    of an anonymous JavaScript function that is executed during the load event:


    ```javascript

    <script><!--

    window.addEventListener(''load'', function () {

    // do something here

    });

    // --></script>

    ```


    Now that you understand the underlying code for rendering Canvas-based 2D shapes,
    you can focus on the code that actually draws some 2D shapes, starting with the
    example in the next section.


    ## LINE SEGMENTS, RECTANGLES, CIRCLES, AND SHADOW EFFECTS


    This section contains an assortment of code samples that illustrate how to render
    2D shapes in HTML5 Canvas. There are many concepts introduced in this section,
    so before delving into the code sample, let’s look at some of the HTML5 Canvas
    APIs that are used in this section. Chapter 2 describes various ways for specifying
    colors, and the material in that section is relevant for the code sample (so you
    can quickly review its contents if you need to do so).


    HTML5 Canvas provides the fill() method for rendering a rectangle, which requires
    four parameters: the upper-left vertex (defined by its x-coordinate and its y-coordinate)
    of the rectangle, the width of the rectangle, and the height of the desired rectangle.
    The fill() API looks like this:


    `context.fillRect(x, y, width, height);`


    HTML5 Canvas allows you to render line segments by specifying the (x,y) coordinates
    of the two endpoints of a line segment. The two APIs used in this section are
    moveTo() and lineTo(), and they look like this:


    `context.moveTo(x1, y1);`

    `context.lineTo(x2, y2);`


    The preceding code snippet represents the line segment whose endpoints are specified
    by the points (x1,y1) and (x2,y2). Note that you can also render the same line
    segment with the following code snippet:


    `context.moveTo(x2, y2);`

    `context.lineTo(x1, y1);`


    102 • CSS3 Pocket Primer


    Shadow effects provide a richer visual experience that is an improvement over
    the use of non-shadow effects. You create a shadow effect by assigning values
    to three shadow-related attributes that control the size of the shadow and also
    the extent of “fuzziness” of the shadow, as shown here:


    `context.shadowOffsetX = shadowX;`

    `context.shadowOffsetY = shadowY;`

    `context.shadowBlur = 4;`


    You can also assign (R,G,B) or (R,G,B,A) values to shadowColor (which is an attribute
    of the drawing context) as shown here:


    `context.shadowColor = "rgba(0,0,64,1.0)";`


    The HTML5 Web page RandanglesShadow.html in Listing 6.2 uses this technique in
    order to render a set of randomly generated rectangles with a shadow effect.


    ***LISTING 6.2 RandanglesShadow.html***


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8">

    <title>Canvas Random Rectangles With Shadow Effects</title>

    <link href="CSS3Background.css" rel="stylesheet" type="text/css">

    <style>

    input {

    width:300px;

    font-size:24px;

    background-color:#f00;

    }

    </style>

    <script><!--

    window.addEventListener(''load'', function() {

    var clickCount = 0;

    // Get the canvas element

    var elem = document.getElementById(''myCanvas'');

    if (!elem || !elem.getContext) {

    return;

    }

    // Get the canvas 2d context

    var context = elem.getContext(''2d'');

    if (!context) {

    return;

    }

    var basePointX = 10;

    var basePointY = 10;

    var canWidth = 800;

    var canHeight = 450;

    var shadowX = 10;

    var shadowY = 10;

    var rectCount = 100;

    var rectWidth = 100;

    var rectHeight = 100;

    var colorIndex = 0;

    var fillStyles = [''#f00'', ''#ff0'', ''#0f0'', ''#00f''];

    redrawCanvas = function() {

    // clear the canvas before drawing new set of rectangles

    context.clearRect(0, 0, elem.width, elem.height);

    for(var r=0; r<rectCount; r++) {

    basePointX = canWidth*Math.random();

    basePointY = canHeight*Math.random();

    // Alternate shadow effect based on an even/odd

    // click count with different (R,G,B,A) values

    if(clickCount % 2 == 0) {

    context.shadowColor = "rgba(0,0,64,1.0)";

    } else {

    context.shadowColor = "rgba(64,0,0,1.0)";

    }

    // code that specifies the size and also the

    // "fuzziness" of the underlying shadow effect

    context.shadowOffsetX = shadowX;

    context.shadowOffsetY = shadowY;

    context.shadowBlur = 4;

    context.lineWidth = 1;

    // render a colored rectangle

    colorIndex = Math.floor(basePointX)%fillStyles.length;

    context.fillStyle = fillStyles[colorIndex];

    context.fillRect(basePointX, basePointY,

    rectWidth, rectHeight);

    ++clickCount;

    }

    }

    // render a set of random rectangles

    redrawCanvas();

    });

    // --></script>

    </head>

    <body>

    <div>

    <canvas id="myCanvas" width="800" height="450">No support

    for Canvas</canvas>

    </div>

    </body>

    </html>

    ```

