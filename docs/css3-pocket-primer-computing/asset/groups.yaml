    ## RESIZING ASSETS IN MOBILE WEB APPLICATIONS


    There are at least two common techniques for detecting screen sizes, which in
    turn is related to resizing assets. The first technique involves CSS3 Media Queries
    to load different CSS stylesheets for different screen widths. The second technique
    is to use JavaScript to set different CSS properties for different screen sizes.


    When you place assets (such as PNG files) on an HTML5 Web page in a mobile Web
    application, you need to decide how to handle the following situations for your
    mobile web application:


    - 1. Switching from portrait to landscape (or vice versa)

    - 2. Deploying to mobile devices with different screen sizes

    - 3. Resizing text strings and text areas

    - 4. Scaling non-binary images (such as SVG)


    You need to address the preceding situations whenever you create an HTML5 Web
    page that includes not only PNG files, but also other types of assets, such as
    embedded SVG documents or HTML5 <canvas> elements.


    In the case of rendering text strings, how do you determine the correct font size?
    Even if you use em for the unit of measure, you don’t know the DPI resolution
    of a particular device. Of course, you could make an educated guess and decide
    that text will be rendered with 14em for a mobile phone and 16em for a tablet
    (or phablet), but the increasing variety of screens with different DPIs means
    that you can’t guarantee that your choice will be correct in all cases.


    In the case of SVG documents that are embedded in an HTML5 Web page, you can use
    a CSS-based technique for automatically resizing the contents of SVG documents
    in an HTML5 Web page with this code snippet:


    `<div style="background-size: contain">`


    A detailed description of this technique is here: https://developer.mozilla.org/en-US/docs/Web/CSS/background-size.


    ## DETERMINING THE CONTENT LAYOUT FOR MOBILE WEB PAGES


    Some design considerations for determining the content of a Web page are here:


    - Provide a single column of text for smart phones

    - Remove extra links and content

    - Remove items and sidebars/footers

    - Avoid absolute sizes

    - Set wrapper widths to percentages

    - Set paragraphs to display block


    Keep in mind that the preceding points are guidelines and not absolute rules.
    For example, some smart phones in landscape mode can accommodate two columns,
    depending on the width of the columns, and many tablets can display two columns
    in portrait mode. Some people recommend that you reduce the amount of scrolling
    that is required in a screen, but many users are accustomed to frequent scrolling
    on a mobile device (especially on smart phones). When in doubt, create two (or
    possible more) layouts and get feedback from users to determine which layout might
    have greater appeal to a broad audience. If you still cannot decide which layout
    design is best for your purposes, perhaps you can benefit from “A/B testing,”
    which is described here: http://en.wikipedia.org/wiki/A/B_testing.


    ## MOBILE DESIGN FOR HTML WEB PAGES


    There are several approaches to designing HTML Web pages for mobile devices, including
    “mobile first,” “mobile only,” and using a separate domain for mobile applications.


    A “mobile first” approach ensures that an HTML Web page will render correctly
    on a mobile device. However, you need to take into account different screen sizes
    among mobile devices, such as smart phones, “phablets,” and tablets. This detail
    is particularly evident with Android mobile devices (and to a lesser extent it’s
    true for iOS devices).


    A “mobile only” approach still requires you to take into account different screen
    sizes on mobile devices, but in this scenario you do not need to contend with
    HTML Web pages for laptops or desktops. Keep in mind that this approach is far
    from trivial: it can involve a combination of client (or server) templates, local
    data stores, and efficient view-model binding that are provided by toolkits such
    as BackboneJS. Another point to consider is whether or not you can leverage NoSQL
    datastores, such as MongoDB.


    A third approach is to use separate domains for mobile versus desktop Web pages.
    If you are developing thin mobile web applications (i.e., Web pages that are hosted
    on a server and accessed by various device types), this approach provides several
    advantages. First, this makes your mobile site easier to find. Second, you can
    advertise the mobile URL separately from the URL for desktop devices. Third, users
    can switch between the “regular” website and the mobile website simply by changing
    the domain. Fourth, the code logic for detecting mobile users (and then sending
    them to a separate domain) is simpler than making modifications to CSS stylesheets.


    Now that you have an overview of design considerations, let’s take a look at example
    of forms.


    ## HIGH-LEVEL VIEW OF STYLING FORMS


    In the case of rendering text strings, how do you determine the correct font size?
    Even if you use em for the unit of measure, you don’t know the DPI resolution
    of a particular device. Of course, you could make an educated guess and decide
    that text will be rendered with 14em for a mobile phone and 16em for a tablet
    (or phablet), but the increasing variety of screens with different DPIs means
    that you can’t guarantee that your choice will be correct in all cases.


    In the case of SVG documents that are embedded in an HTML5 Web page, you can use
    a CSS-based technique for automatically resizing the contents of SVG documents
    in an HTML5 Web page with this code snippet:


    `<div style="background-size: contain">`


    ## SPECIFIC TECHNIQUES FOR STYLING FORMS


    In addition to the techniques listed in the previous section, you can use some
    of these:


    - Use CSS to style input fields differently

    - Provide labels for input fields

    - Specify keyboard types for input fields

    - Provide default values for input fields

    - Indicate required fields

    - Validate each field after user input

    - Utilize password masking

    - Employ zoom


    ## USE CSS TO STYLE INPUT FIELDS DIFFERENTLY


    There are two steps involved. The first step is to apply the default styling and
    then apply your own styling rules. The second step is to use the [type] attribute
    selector to apply different styles to input fields.


    As a specific example you can use the -webkit-appearance property to remove the
    default styling for all input elements, as shown here:


    `input, textarea, select { -webkit-appearance: none; }`


    Next, specify your own CSS styles that depend on the type of input field, as outlined
    here:


    `input[type=checkbox] { /* specify styles for checkbox */ }`

    `input[type=radio] { /* specify styles for radio */ }`

    `input[type=textarea] { /* specify styles for textarea */ }`


    ## SPECIFY KEYBOARD TYPES FOR INPUT FIELDS


    HTML5 introduced the following new properties for the type attribute for input
    elements:


    - email address: type=''email''

    - website address: type=''url''

    - telephone number: type=''tel''


    The preceding types only work on mobile browsers (nothing will happen in a laptop
    or desktop browser). The following example shows you how to specify different
    keyboards for input fields:


    `<form id="form1" name="form1" method="post" action="">

    <label for="name">Name:</label><input name="name" id="name" type="text" />

    <label for="email">Email:</label><input name="email" id="email" type="email" />

    <label for="phone">Phone:</label><input name="phone" id="phone" type="tel" />

    </form>`

