    **CSS3 3D ANIMATION EFFECTS WITH KEYFRAMES**


    In the previous chapter, you learned how to create CSS3 2D animation


    effects with keyframes rules. You can also create CSS3 3D animation effects


    via CSS3 keyframes rules by specifying CSS3 functions, such as scale3d(),


    rotate3d(), and translate3d(), either individually or in various


    combinations.


    Listing 4.6 displays the contents of Anim240Flicker3DLGrad4.html,


    which is a very simple HTML page that contains four HTML <div> elements.


    The animation effect lasts for four minutes in this example because of the du-


    ration that is specified in the associated CSS3 stylesheet.


    ***LISTING 4.6 Anim240Flicker3DLGrad4.html***


