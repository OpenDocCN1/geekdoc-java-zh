    Introduction to CSS3 • **35**


    **BROWSER-SPECIFIC PREFIXES FOR CSS3 PROPERTIES**


    Browser-specific prefixes are for CSS properties that are “works in progress”
    for individual browsers, and the final specification drops browser-specific prefixes.
    Although more recent versions of modern browsers no longer require prefixes (discussed
    later in this section), it’s worth learning about the prefixes for two reasons:
    a) you might encounter older code that contains browser-specific prefixes, and
    b) older websites that generate CSS gradients tend to produce code that contains
    unnecessary browser-specific prefixes.


    The browser-specific prefixes –ie-, -moz-, and -o- are for Internet Explorer,
    Firefox, and Opera, respectively. Note that Opera also supports –webkit- prefixes,
    and it’s possible that other browsers will do the same (check the respective websites
    for updates).


    As an illustration, the following code block shows examples of these prefixes:


    -ie-webkit-border-radius: 8px;

    -moz-webkit-border-radius: 8px;

    -o-webkit-border-radius: 8px;

    border-radius: 8px;


    In your CSS selectors, specify the attributes with browser-specific prefixes before
    the “generic” attribute, which serves as a default choice in the event that the
    browser-specific attributes are not selected. The CSS3 code samples in this book
    contain WebKit-specific prefixes, which helps us keep the CSS stylesheets manageable
    in terms of size. If you need CSS stylesheets that work on multiple browsers (for
    current versions as well as older versions), there are essentially two options
    available. One option involves manually adding the CSS3 code with all the required
    browser-specific prefixes, which can be tedious to maintain and also error-prone.
    Another option is to use CSS toolkits or frameworks (discussed in the next chapter)
    that can programmatically generate the CSS3 code that contains all browser-specific
    prefixes.


    Finally, an extensive list of browser-prefixed CSS properties is here: *http://peter.sh/experiments/vendor-prefixed-css-property-overview/*.


    In the case of color gradients (discussed in Chapter 3), you no longer need a
    browser-specific prefix for the latest versions of Chrome, Firefox, IE 10+, Opera,
    and Safari. Additional CSS properties will become “prefix free” as modern browsers
    evolve in terms of feature support. Fortunately, the following open source project
    enables you to specify prefix-free properties in your code: *http://leaverou.github.io/prefixfree/*.


    The preceding code inserts browser-specific prefixes only when it’s necessary
    to do so, which alleviates the tediousness of performing this task manually.


    **SUMMARY**


    In this chapter, you learned about browser support for CSS3, browser-specific
    prefixes, and various CSS3 features. Next you learned about CSS3 pseudo-classes,
    and how to create shadow effects and rounded corners. You also learned about CSS3
    linear and radial gradients as well as online gradient generators. In addition,
    you saw how to use various CSS3 transforms, such as scale, rotate, skew, and translate.
    Finally, you learned about performance-related techniques.


    ## CHAPTER 3

    ### CSS3 2D GRAPHICS AND ANIMATION


    The previous chapter contains examples of creating CSS3 2D graphics effects, and
    this chapter contains CSS3 2D animation effects. Note that Chapter 4 shows you
    how to create CSS3 3D graphics and animation effects. Although CSS3-related graphics
    and animation effects are discussed in three chapters, please keep in mind that
    the code samples serve as an introduction to concepts rather than a full and detailed
    coverage of the technical concepts and features.


    The first part of this chapter discusses CSS3 transitions for creating simple
    animation effects (such as glow effects and bouncing effects). This part of the
    chapter also contains code samples that show you how to define CSS3 selectors
    that perform more sophisticated effects with text, such as rendering multicolumn
    text.


    The second part of this chapter shows you how to define CSS3 selectors to create
    2D animation effects. Specifically, you will learn how to use CSS3 keyframes and
    the CSS3 functions scale(), rotate(), and translate(), which enable you to create
    2D animation effects.


    The third part of the chapter shows you how to create fading images, rotating
    images, and “bouncing” effects. This section also explains how to create CSS3
    effects for text (such as multicolumn text). This section also introduces CSS
    Motion Paths, which is an experimental CSS3 feature that supports SVG-like animation
    effects. The fourth part of this chapter covers CSS3 filters, along with links
    to websites that can programmatically generate custom filters for Web pages.


    The final section involves jQuery, and how to create 2D effects with jQuery and
    CSS3. You will also learn how to create a “follow the mouse” example using jQuery
    and CSS3. If you are unfamiliar with jQuery, you can read the jQuery Appendix
    that is on the companion disc. You can treat this section of the chapter as optional
    if you do not need jQuery (and perhaps return to this section in the future).


    In case you do not already know, there are several advantages to using CSS3 in
    your HTML pages. First, you will learn how to create your own visual effects using
    CSS3D. Second, toolkits such as jQuery rely heavily on CSS3 for rendering content
    and for creating animation effects (including transitions). Hence, the knowledge
    that you gain from the CSS3-related chapters in this book will give you a foundation
    that help you understand how jQuery performs its “magic,” and perhaps also make
    it easier for you to read the jQuery source code. Fourth, your code is likelier
    to be more compact if you use CSS3 instead of relying on JavaScript and JPG files
    for graphics and animation, which is a particularly important point for mobile
    devices. Note that hardware acceleration is mandatory for many CSS3D effects,
    and the good news is that an increasing number of mobile devices support hardware
    acceleration for CSS3 (and in some cases, there is also support for HTML5 Canvas).


    ## CSS3 2D TRANSFORMS


    CSS3 transforms include the CSS3 functions scale(), rotate(), and translate(),
    which enable you to modify the shape of HTML elements. This section shows you
    how to create a cube using CSS3, which involves rendering the front face (a rectangle),
    the top face (a parallelogram), and the right face (also a parallelogram). We
    will use the following CSS3 transforms and effects in this section:


    - The CSS3 skew() function to create the left and right faces

    - The CSS3 scale() and rotate() functions to create the top face

    - Linear and radial gradients for shading effects


    The example in this section contains a lot of CSS3 code, and it’s probably helpful
    to launch the Web page in a browser to view the result as you study the code.
    Listing 3.1 displays the contents of 3DCube1.html and Listing 3.2 displays the
    contents of 3DCube1.css, which illustrate how to simulate a cube in CSS3.


    ### LISTING 3.1 3DCube1.html

    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <title>CSS 3D Cube Example</title>

    <meta charset="utf-8" />

    <link href="3DCSS1.css" rel="stylesheet" type="text/css">

    </head>

    <body>

    <header>

    <h1>Hover Over the Cube Faces:</h1>

    </header>

    <div id="outer">

    <div id="top">Text1</div>

    <div id="left">Text2</div>

    <div id="right">Text3</div>

    </div>

    </body>

    </html>

    ```


    ### LISTING 3.2 3DCube1.css

    ```css

    /* size and position */

    #right, #left, #top {

    position:relative;

    padding: 0px;

    width: 200px;

    height: 200px;

    }

    /* #left and #right selectors omitted for brevity */

    ```


    The transform attribute specifies the CSS3 transform functions scale(), skew(),
    and rotate(). These three functions are invoked simultaneously, which means that
    you will see a scaling, skewing, and rotating effect happening at the same time
    instead of sequentially.


    The last three selectors in Listing 3.2 define the properties of each face of
    the cube. For example, the #left selector specifies the font size for some text
    and also positional attributes for the left face of the cube. The most complex
    portion of the #left selector is the value of the background-image attribute,
    which consists of a combination of a radial gradient, a repeating radial gradient,
    and another radial gradient. Notice that the left face is a rectangle that is
    transformed into a parallelogram using this line of code: `transform: skew(0deg,
    -30deg);`


    The #top selector and #right selector contain code that is comparable to the #left
    selector, and you can experiment with their values in order to create other pleasing
    visual effects.


    Figure 3.1 displays the result of matching the CSS selectors in 3DCube1.css to
    the <div> elements in the HTML page 3DCube1.html.


    If you want to learn how to create various shapes using CSS3 properties and transforms,
    the following links provide techniques and samples: *http://enjoycss.com/gallery/shapes*
    and *http://1stwebdesigner.com/css-shapes/*.

