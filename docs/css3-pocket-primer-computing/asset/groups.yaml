    CSS 路径正在开发中，它们在纯 CSS3 创建复杂动画效果方面具有巨大的潜力。CSS 路径允许作者沿作者指定的路径动画任何图形对象。你通过在 CSS 选择器中指定
    `motion-path` 属性来定义 CSS 路径，其值包含 `path()` 函数中的实际路径。CSS 路径支持四种属性：`motion`（`motion-path`
    的简写）、`motion-offset`（在路径上的位置）、`motion-path`（用于动画的类 SVG 路径）和 `motion-rotation`（元素在路径上的方向）。


