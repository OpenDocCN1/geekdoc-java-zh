- md: "\nMedia Queries and Meta Tags • **91**\n\n- A `<div>` with a background image\
    \ whose color is altered if the screen is less than 600px wide\n- A `<div>` with\
    \ a background image is given a new background image if the minimum ratio is 1.5\
    \ (using the min-device-pixel-ratio media query)\n\nKeep in mind that the previous\
    \ link probably contains some outdated information; however, you can still perform\
    \ the same tests on your browser of choice to determine whether or not the results\
    \ are still valid.\n\nAnother option involves the use of window.matchMedia, which\
    \ is a JavaScript alternative to CSS3 Media Queries. The window.matchMedia APIs\
    \ are listed here: *https://developer.mozilla.org/en-US/docs/Web/API/Window/matchMedia*.\n\
    \nAn article with code samples involving window.matchMedia is here: *https://hacks.mozilla.org/2012/06/using-window-matchmedia-to-do-media-queries-in-javascript/*..\n\
    \nThe next section of this chapter delves into meta tags, including some that\
    \ are specific for mobile devices.\n\n## THE VIEWPORT META TAG\n\nHTML Web pages\
    \ are rendered in a “virtual page,” and the screen is a window into that page.\
    \ The viewport meta tag sets the dimensions of this virtual page. In addition,\
    \ the viewport meta tag controls scaling of the browser window in iOS and Android.\
    \ The viewport meta tag supports the following attributes:\n\n- Width: The width\
    \ of the viewport in pixels (the default is 980), which can be between 200 and\
    \ 10,000\n- Height: The height of the viewport in pixels. The default is calculated\
    \ based on the width and the aspect ratio of the device, and it can be between\
    \ 223 and 10,000\n- Initial-scale: the initial “zoom factor” of an application,\
    \ which users can then scale in and out from that initial value\n- Minimum-scale:\
    \ the minimum scale value of the viewport (the default is 0.25), which can be\
    \ between 0 and 10.0\n- Maximum-scale: the maximum scale value of the viewport\
    \ (the default is 1.6), which can be between 0 and 10.0\n- User-scalable: You\
    \ can specify whether or not users can zoom in and out of an application (the\
    \ default is “yes.”). Set the value to “no” to prevent scaling\n\nIn addition,\
    \ you can set more than one viewport option in a meta tag by separating them with\
    \ commas, as shown here:\n\n`<meta name=\"viewport\" content=\"width=device-width,\
    \ user-scalable=no\">`\n\nThe target-densitydpi property (specified in the viewport\
    \ meta tag) has been deprecated (and actually removed from WebKit), so it’s inadvisable\
    \ to use this property in order to specify low, medium, or high dpi values in\
    \ Android-based mobile applications.\n\nYou can also use the viewport tag in order\
    \ to prevent users from zooming or panning in a mobile application. An example\
    \ is here:\n\n`<meta name=\"viewport\" content=\"width=device-width; initial-scale=1.0;\
    \ maximum-scale=1.0; user-scalable=0;\" />`\n\nThe iOS platform supports the viewpoint\
    \ meta tag as well as iOS-specific meta tags, some of which are described here:\
    \ *http://developer.apple.com/library/safari/documentation/appleapplications/reference/SafariHTMLRef/Articles/MetaTags.html#//apple_ref/doc/uid/TP40008193-SW1*.\n\
    \n## Viewport Units\n\nThe viewport refers to the browser screen, and the four\
    \ viewport units are here:\n\n- vw: the percentage of viewport width\n- vh: the\
    \ percentage of viewport height\n- vmin: the smaller of vw or vh\n- vmax: the\
    \ larger of vw or vh\n\nFor example, 1vw is 1% of the browser’s width, which means\
    \ that 100vw is 100% of the browser width.\n\nThe following CSS selector uses\
    \ the calc() function and a CSS3 Media Query to calculate the font-size property\
    \ whenever an HTML Web page is resized:\n\n```css\nhtml {\n  font-size: 100%;\n\
    \  // Scales by 1px for every 100px (starting from 600px)\n  @media (min-width:\
    \ 600px) {\n    font-size: calc(125% + 4 * (100vw - 600px) / 400)\n  }\n  // Sets\
    \ font-size to 24px (for 1000px or wider)\n  @media (min-width: 1000px) {\n  \
    \  font-size: calc(150%)\n  }\n}\n```\n\nThe next portion of this chapter delves\
    \ into meta tags, including some that are specific for mobile devices.\n\n## THE\
    \ IMPORT STATEMENT\n\nThe @import statement allows you to import another stylesheet.\
    \ For example, suppose you have the following CSS:\n\n`@import url(\"style.css\"\
    );`\n\nThe @import statement can be used to import multiple stylesheets.\n\n##\
    \ Modularization and Performance\n\nThe @import statement can be very convenient,\
    \ but there are two points to keep in mind when you use it. First, the @import\
    \ statement can help you modularize your CSS, but keep in mind Second, it can\
    \ also be a performance penalty.\n"
  mdcn: "\n媒体查询与元标签 • **91**\n\n- 一个带有背景图片的 `<div>`，如果屏幕宽度小于 600px，其背景颜色会发生改变\n- 一个带有背景图片的\
    \ `<div>`，如果最小比例为 1.5，则会赋予它一个新的背景图片（使用 `min-device-pixel-ratio` 媒体查询）\n\n请记住，之前的链接可能包含一些过时信息；但是，你仍然可以在选择的浏览器中进行相同的测试，以确定结果是否仍然有效。\n\
    \n另一种选项是使用 `window.matchMedia`，它是 CSS3 媒体查询的 JavaScript 替代方案。window.matchMedia\
    \ API 列在此：*https://developer.mozilla.org/en-US/docs/Web/API/Window/matchMedia*。\n\
    \n这里有一篇包含 `window.matchMedia` 代码示例的文章：*https://hacks.mozilla.org/2012/06/using-window-matchmedia-to-do-media-queries-in-javascript/*..\n\
    \n本章的下一节将深入探讨元标签，包括一些针对移动设备的特定标签。\n\n## 视口元标签 (THE VIEWPORT META TAG)\n\nHTML\
    \ 页面在“虚拟页面”中渲染，而屏幕是进入该页面的窗口。视口元标签设置了此虚拟页面的尺寸。此外，视口元标签还控制 iOS 和 Android 上浏览器窗口的缩放。视口元标签支持以下属性：\n\
    \n- Width（宽度）：视口以像素宽度（默认为 980），范围在 200 到 10,000 之间\n- Height（高度）：视口以像素高度。默认值根据设备的宽度和纵横比计算，范围在\
    \ 223 到 10,000 之间\n- Initial-scale（初始缩放）：应用程序的初始“缩放因子”，用户可以从该初始值开始进行放大或缩小\n- Minimum-scale（最小缩放）：视口的最小缩放值（默认为\
    \ 0.25），范围在 0 到 10.0 之间\n- Maximum-scale（最大缩放）：视口的最大缩放值（默认为 1.6），范围在 0 到 10.0\
    \ 之间\n- User-scalable（用户可缩放）：你可以指定用户是否可以对应用程序进行放大和缩小（默认是“yes”）。将其设置为“no”以防止缩放\n\
    \n此外，你可以在元标签中用逗号分隔并设置多个视口选项，如下：\n\n`<meta name=\"viewport\" content=\"width=device-width,\
    \ user-scalable=no\">`\n\n`target-densitydpi` 属性（在视口元标签中指定）已弃用（实际上已从 WebKit 中删除），因此建议在基于\
    \ Android 的移动应用程序中使用该属性来指定低、中、高 dpi 值。\n\n你也可以视口标签来防止用户在移动应用程序中缩放或平移。例如：\n\n`<meta\
    \ name=\"viewport\" content=\"width=device-width; initial-scale=1.0; maximum-scale=1.0;\
    \ user-scalable=0;\" />`\n\niOS 平台支持视口元标签以及 iOS 特有的元标签，其中一些在此描述：*http://developer.apple.com/library/safari/documentation/appleapplications/reference/SafariHTMLRef/Articles/MetaTags.html#//apple_ref/doc/uid/TP40008193-SW1*。\n\
    \n## 视口单位 (Viewport Units)\n\n视口指的是浏览器屏幕，四种视口单位如下：\n\n- vw：视口宽度的百分比\n- vh：视口高度的百分比\n\
    - vmin：vw 或 vh 中的较小值\n- vmax：vw 或 vh 中的较大值\n\n例如，1vw 是浏览器宽度的 1%，这意味着 100vw 是浏览器宽度的\
    \ 100%。\n\n以下 CSS 选择器使用 `calc()` 函数和 CSS3 媒体查询，每当 HTML 页面调整大小时时，都会计算 `font-size`\
    \ 属性：\n\n```css\nhtml {\n  font-size: 100%;\n  // 每 100px 缩放 1px（从 600px 开始）\n\
    \  @media (min-width: 600px) {\n    font-size: calc(125% + 4 * (100vw - 600px)\
    \ / 400)\n  }\n  // 将 font-size 设置为 24px（针对 1000px 或更宽的屏幕）\n  @media (min-width:\
    \ 1000px) {\n    font-size: calc(150%)\n  }\n}\n```\n\n本章的后续部分将深入探讨元标签，包括一些针对移动设备的特定标签。\n\
    \n## IMPORT 语句 (THE IMPORT STATEMENT)\n\n`@import` 语句允许你导入另一个样式表。例如，假设你有以下 CSS：\n\
    \n`@import url(\"style.css\");`\n\n`@import` 语句可以导入多个样式表。\n\n## 模块化与性能\n\n`@import`\
    \ 语句非常方便，但在使用它时需要记住两点。首先，`@import` 语句可以帮助你实现 CSS 模块化，但请记住，它也可能带来性能损失。\n"
