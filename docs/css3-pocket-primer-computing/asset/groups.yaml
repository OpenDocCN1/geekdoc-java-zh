    CSS3 简介 • **35**


    **CSS3 属性的浏览器特定前缀**


    浏览器特定前缀用于在各个浏览器中处于“开发中”阶段的 CSS 属性，最终规范将舍弃这些浏览器特定的前缀。尽管现代浏览器的最新版本不再需要前缀（在本节稍后将讨论），但学习这些前缀仍然很有价值，原因有两个：a)
    你可能会遇到包含浏览器特定前缀的旧代码；b) 生成 CSS 渐变的旧网站往往会生成包含不必要的浏览器特定前缀的代码。


    浏览器特定前缀 `-ie-`、`-moz-` 和 `-o-` 分别对应 Internet Explorer、Firefox 和 Opera。注意，Opera
    也支持 `-webkit-` 前缀，且其他浏览器也可能这样做（请查看各自网站的更新）。


    作为说明，下面的代码块展示了这些前缀的示例：


    -ie-webkit-border-radius: 8px;

    -moz-webkit-border-radius: 8px;

    -o-webkit-border-radius: 8px;

    border-radius: 8px;


    在你的 CSS 选择器中，请在“通用”属性之前指定带有浏览器特定前缀的属性，当浏览器特定属性未被选中时，通用属性作为默认选择。书中的 CSS3 代码示例包含
    WebKit 特定的前缀，这有助于我们保持 CSS 样式表尺寸的易于管理。如果你需要适用于多个浏览器（包括当前版本以及旧版本）的 CSS 样式表，基本上有两种选择。一种方法是手动添加所有所需的浏览器特定前缀的
    CSS3 代码，这维护起来麻烦且容易出错。另一种方法是使用 CSS 工具包或框架（将在下一章讨论），它们可以程序化生成包含所有浏览器特定前缀的 CSS3 代码。


    最后，这里是带有浏览器前缀的 CSS 属性详细列表：*http://peter.sh/experiments/vendor-prefixed-css-property-overview/*。


    在颜色渐变（在第 3 章讨论）的情况下，最新版本的 Chrome、Firefox、IE 10+、Opera 和 Safari 不再需要浏览器特定前缀。随着现代浏览器在功能支持方面的进化，额外的
    CSS 属性将变得“无前缀”。幸运的是，以下开源项目允许你在代码中指定无前缀的属性：*http://leaverou.github.io/prefixfree/*。


    前面的代码仅在必要时才插入浏览器特定前缀，减轻了手动执行此任务的繁琐性。


    **总结**


    在本章中，你学习了浏览器对 CSS3 的支持、浏览器特定前缀以及各种 CSS3 特性。接下来，你学习了 CSS3 伪类以及如何创建阴影效果和圆角。你还学习了
    CSS3 线性渐变和径向渐变以及在线渐变生成器。此外，你看到了如何使用各种 CSS3 变换，例如缩放、旋转、倾斜和平移。最后，你学习了与性能相关的技术。


    ## 第 3 章

    ### CSS3 2D 图与动画


    上一章包含了创建 CSS3 2D 图形效果的示例，而本章包含了 CSS3 2D 动画效果。注意，第 4 章将向你展示如何创建 CSS3 3D 图形和动画效果。虽然三个章节中讨论了
    CSS3 的图形和动画效果，但请记住，代码示例仅作为概念的介绍，而不是对技术概念和特性的全面细节。


    本章的第一部分讨论了用于创建简单动画效果的 CSS3 过渡（如发光效果和弹跳效果）。本章这部分包含代码示例，向你展示如何定义 CSS3 选择器对文本执行更复杂的效果，例如渲染多列文本。


    本章的第二部分介绍了如何定义 CSS3 选择器来创建 2D 动画效果。具体而言，你将学习如何使用 CSS3 关键帧（keyframes）以及 CSS3 函数
    `scale()`、`rotate()` 和 `translate()`，这些函数让你能够创建 2D 动画效果。


    本章的第三部分介绍了如何创建淡入图像、旋转图像和“弹跳”效果。该部分还解释了如何为文本创建 CSS3 效果（如多列文本）。该部分还引入了 CSS 运动路径，这是一个支持类
    SVG 动画效果的实验性 CSS3 特性。本章的第四部分涵盖了 CSS3 过滤器，以及可以程序化生成网页自定义过滤器的网站链接。


    最后一部分涉及 jQuery 以及如何使用 jQuery 和 CSS3 创建 2D 效果。你还将学习如何使用 jQuery 和 CSS3 创建“跟随鼠标”的示例。如果你不熟悉
    jQuery，可以阅读配套光盘上的 jQuery 附录。如果你不需要 jQuery（也许以后再回到这一节），可以将本章的这一部分视为可选内容。


    如果你还不知道，在 HTML 页面中使用 CSS3 有若干个优点。首先，你将学习如何使用 CSS3D 创建你自己的视觉效果。其次，像 jQuery 等工具包高度依赖
    CSS3 来渲染内容和创建动画效果（包括过渡）。因此，你从书中与 CSS3 相关的章节中学知识将为你提供基础，帮助你理解 jQuery 是如何实现“魔法”的，可能也会让你更容易阅读
    jQuery 源码。第四，如果你使用 CSS3 而不是依赖 JavaScript 和 JPG 文件来实现图形和动画，你的代码可能会更紧凑，这对于移动设备是一个尤为重要的一点。注意，许多
    CSS3D 效果强制要求硬件加速，好消息是，越来越多的移动设备支持 CSS3 的硬件加速（在某些情况下，还支持 HTML5 Canvas）。


    ## CSS3 变换 (TRANSFORMS)


    CSS3 变换包括 `scale()`、`rotate()` 和 `translate()` 函数，它们允许你修改 HTML 元素的形状。本节展示了如何使用
    CSS3 创建一个立方体：


    - 使用 `skew()` 函数创建左侧右面

    - 使用 `scale()` 和 `rotate()` 函数创建顶部

    - 使用线性渐变和径向渐变创建阴影


    本节中的示例包含大量的 CSS3 代码，在浏览器中运行网页查看结果将会有帮助。列表 3.1 展示了 3DCube.html 的内容，列表 3.2 展示了 3DCube.css
    的内容，说明了如何在 CSS3 中模拟立方体。


    ### 列表 3.1 3DCube.html

    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <title>CSS 3D </title>

    <meta charset="utf-8" />

    <link href="3DCube.css" rel="stylesheet" type="text/css">

    </head>

    <body>

    <header>

    <h1>悬停立方面：</h1>

    </header>

    <div id="outer">

    <div id="top">文本1</div>

    <div id="left">文本2</div>

    <div id="right">文本3</div>

    </div>

    </body>

    </html>

    ```


    ### 列表 3.2 3DCube.css

    ```css

    /* 尺寸和位置 */

    #right, #left, #top {

    position:relative;

    padding: 0px;

    width: 200px;

    height: 200px;

    }

    /* #left 和 #right 选择器省略 */

    ```

