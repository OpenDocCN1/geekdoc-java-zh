    <text id="horizontalText" x="0" y="100"


    ﬁ lter="url(#blurFilter1)"


    ﬁ ll="red" stroke="black" stroke-width="4"


    font-size="72">


    Blurred Text


    </text>


    </g>


    </svg>


    The SVG <defs> element in Listing 7.8 contains an SVG <ﬁ lter> element


    that specifies a Gaussian blur with the following line:


    <feGaussianBlur stdDeviation="4"/>'
