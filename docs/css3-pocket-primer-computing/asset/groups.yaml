    **WHAT IS THE PRIMARY VALUE PROPOSITION FOR THIS BOOK?**


    This book is primarily about CSS3, along with some of the technologies


    that can be “combined” with CSS3\. In fact, there are several non-CSS3 chap-


    ters in this book, including one SVG chapter and one chapter that delves into


    HTML5 Canvas and CSS3\. In addition, several chapters contain optional sec-


    tions that show you how to combine jQuery with CSS3 and also jQuery with


    SVG. If you are unfamiliar with jQuery, you can read the Appendix that pro-


    vides an introduction to jQuery. Another Appendix contains an introduction


    to an assortment of topics, such as frameworks for CSS3, SASS and LESS,


    Bootstrap 4, Material Design, and CSSLint.


    **WHAT IS THE FORMAT FOR THIS BOOK?**


    The answer to this question is important, because you obviously want to


    determine how much of the material in this book will be useful and relevant


    to you. First, this book is not a reference guide of CSS3 syntax, nor does this


    book contain any “cheat sheets” (but you can probably find the latter online).


    Although the format bears a very slight resemblance to a “cookbook” style, this


    book does not provide an extensive set of how-to code samples that solve many


    common tasks that you can probably find on Stackoverflow. Instead, the code


    samples in this book illustrate some “core” features of CSS3, and are supple-


    mented with interesting effects that are possible in CSS3\. Indeed, some code


    samples create effects that you are unlikely to find anywhere else. Even though


    you probably will not use all of the examples in this book, you will learn about


    various coding techniques, and perhaps you will be able to take advantage of


    them in order to craft your own variations for your Web pages.


    *PREFACE*'
