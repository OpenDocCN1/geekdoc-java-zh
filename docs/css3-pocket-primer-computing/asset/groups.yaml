    **HTML5 AND VARIOUS WORKING GROUPS**


    The W3C (World Wide Web Consortium), the WHATWG (Web Hypertext


    Application Technology Working Group), and the DAP (Device APIs Working


    Group) are organizations that provide the specifications and APIs for HTML5


    and mobile devices that are covered in this book. In addition, the IETF (Inter-


    net Engineering Task Force) handles the networking standards (such as Web-


    Sockets, SPDY, CORS, and so forth), but not the actual APIs, and its home


