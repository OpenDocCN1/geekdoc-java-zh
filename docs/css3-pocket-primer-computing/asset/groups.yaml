    context.createRadialGradient(startCenterX, startCenterY,


    startRadius, endsCenterX,


    endCenterY, endRadius);


    A *radial* color gradient can be compared to the ripple effect that is created


    when you drop a stone in a pond, where each “ripple” has a color that changes


    in a gradient fashion. Each ripple corresponds to a color stop element. For


    example, if you define a radial gradient with a start color of #FF0000 (which


    is red) and an end color of #000000 (which is black), then the resultant color


    gradient will range—in a radial fashion—from red to black. Radial gradients


    can also contain multiple start/stop color combinations. The point to keep in


    mind is that radial gradients change colors in a *linear* fashion, but the rendered


    colors are drawn in an expanding *radial* fashion. Note that “radial gradient”


    and “radial color gradient” are used interchangeably in this book.


    Listing 6.5 displays the contents of the HTML5 page RGradRectan-


    gles1.html that renders line segments, rectangles, and circles in an HTML5


    <canvas> element using linear and radial gradients.


