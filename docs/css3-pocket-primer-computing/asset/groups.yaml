    \ and you might create unexpectedly pleasing results. Figure 6.2 displays a set\
    \ of randomly generated rectangles with shadow effect based on RectanglesShadow.html\
    \ in Listing 6.2.\n\n## HTML5 CANVASAR GRADIENTS\n\nHTML5 Canvas provides two\
    \ primary types of color gradients (similar to SVG and CSS3): *linear gradients*\
    \ and *radial gradients*. Linear gradients can be further sub- into three types:\
    \ horizontal linear gradients, vertical linear gradients, and diagonal linear\
    \ gradients. Thus, HTML5 Canvas provides gradients that enable you to create pleasing\
    \ visual effects.\n\nA linear gradient is defined in terms of colorStop, each\
    \ containing a decimal (between 0 and 1) and a hexadecimal value. For example,\
    \ if you define a linear gradient with an initial color of #FF0000 (the hexadecimal\
    \ value for red) and a final color of #000000 (the hexadecimal value for black),\
    \ then the resultant gradient will range from red to black. Linear gradients enable\
    \ you to create vivid and interesting combinations, and they are available in\
    \ varieties: horizontal, vertical, and diagonal.\n\n## Horizontal, Vertical, and\
    \ Diagonal Gradients\n\nAs you learned in the introduction of this chapter, HTML5\
    \ Canvas supports the method createLinearGradient() that you can use to programmatically\
