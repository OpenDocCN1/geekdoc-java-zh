    **SVG FILTERS**


    SVG supports a rich set of filter effects whose complete explanation can


    easily span more than a chapter. A mastery of SVG filters involves a learning


    curve because only a few SVG filters are simple. Many filters are very sophis-


    ticated, requiring multiple non-intuitive input values. In fact, it’s possible
    to'
  - '[PAGE 150]


    **134**  • CSS3 Pocket Primer


    “chain” some SVG filters: the output of one filter can be the input of another


    filter (and the input for some SVG filters requires the output from two filters).


    As you might surmise, some SVG filters can be computationally intense, which


    in turn can adversely affect performance; in the case of mobile devices, appli-


    cations that contain such filters can adversely affect battery life as well.


    The list of filter-related SVG elements includes: feBlend, feColor-


    Matrix, feComponentTransfer, feComposite, feConvolveMatrix,


    feDiffuseLighting, feDisplacementMap, feFlood, feGaussianBlur,


    feImage, feMerge, feMorphology, feOffset, feSpecularLighting,


    feTile, and feTurbulence.


    You can render 2D shapes as well as text strings with filter effects. List-


    ing 7.8 displays the contents of the SVG document BlurFilterText1.svg,


    which renders a text string with a Blur filter.


