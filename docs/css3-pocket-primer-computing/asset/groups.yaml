    There are several points to keep in mind when you create applications for


    different countries and languages:


    • Different phone formats in different countries


    • Left-to-right versus right-to-left text input


    • Culturally appropriate content


    If you intend to publish Android applications that support multiple languages,


    the following link provides useful information: *http://developer.vodafone.com/*


