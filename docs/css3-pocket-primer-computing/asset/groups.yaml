    ## CHAPTER 1

    ### HTML5 FEATURES


    This chapter introduces you to some features of HTML5 and HTML5-specific elements
    for semantic markup. You will also learn about some websites that provide useful
    information, such as browser support for HTML5 features, and also get some information
    about the W3C and the WHATWG standards groups.


    One question must be addressed before you read this chapter: why does this CSS3
    book contain an introductory chapter about HTML5? First, CSS exists entirely inside
    the context of a website: unlike JavaScript, there is no “server side” CSS. Second,
    there are many technologies that are considered part of the HTML5 “umbrella,”
    and they vary considerably in terms of the complexity of their associated APIs.
    Third, it’s certainly possible that you will encounter JavaScript (if you haven’t
    already) and also need to learn some rudimentary aspects of JavaScript. In fact,
    when such content is deemed relevant and useful, some of the chapters in this
    book contain JavaScript-related sections (often marked “optional”).


    The first part of this chapter introduces HTML5, browser support, and two HTML5
    Working Groups. The second part describes the technologies that are part of HTML5,
    differences between HTML4 and HTML5, some useful online tools, and feature detection.
    The third part of this chapter shows you a simple HTML5 website, new HTML5 elements,
    and Semantic Markup. The final part of this chapter introduces you to WAI ARIA,
    experimental features, and mobile support.


    Another point to keep in mind is that there are multiple modern browsers available,
    all of which provide very good support for HTML and CSS. However, due to space
    and time limitations and the number of topics to cover, Chrome was chosen as the
    primary browser to test the code samples in this book. Although the code samples
    in this particular book will most likely work in other modern browsers, you can
    check whether or not a CSS feature is supported in a given browser here: *www.caniuse.com*.


    Lastly, if you decide to skip the initial high-level sections of this chapter,
    the section called “A Simple HTML Website” contains an example of an HTML website,
    followed by a description of its contents. Later you can obviously return to the
    sections that you skipped in this chapter.


    **WHAT IS HTML5?**


    Despite the simplicity of the question, the answer is imprecise: HTML5 consists
    of a mixture of technologies, some of which are formally included in the HTML5
    specification, and some which are not part of the specification. There are few
    people who seem to know the “definition” of HTML5, and perhaps that’s why Peter
    Paul Koch (creator of the quirksmode website) wryly suggested that “whatever web
    technology you’re working on that’s cool right now . . . that’s HTML5.” As you
    will discover, HTML5 means different things to different people, so don’t be surprised
    if you cannot get one consistent “definition” of HTML5 (if only the situation
    were so simple!).


    However, it’s also true that HTML5 is the latest version of HTML that is backward
    compatible with most features of earlier versions of HTML markup. In addition
    to its plugin-free architecture, HTML5 provides a wealth of new features: new
    tags for audio, video, and semantic markup; new input types and validation for
    forms; local and session storage; support for graphics-based APIs in Canvas; and
    communication-related techniques such as server sent events and web sockets. Most
    of the technologies listed in the previous sentence are outside the scope of this
    book, so there’s no need to worry if they are unfamiliar to you.


    Although CSS3 is not a part of HTML5, many people consider it to be an important
    (perhaps even integral) part of websites. Indeed, CSS3 is a core aspect of many
    visual design components of a website or application. As you will see in Chapters
    2 through 4, CSS3 provides support for rich visual effects, including 2D/3D graphics
    and animation.


    With regard to HTML markup, the good news is that the new HTML5 semantic tags
    provide more meaningful information about the purpose of each section in an HTML5
    website, which can be discerned much more easily than websites written in HTML4.
    You will see an example of using some of these semantic tags later in this chapter.


    In addition, HTML was initially designed with the goal of running HTML websites
    on desktop devices as well as mobile devices. Since 1996 CSS itself has contained
    media attributes (such as handheld) that reflect this early thinking about the
    purpose of HTML.


    Web-based mobile applications do not support push notifications. There are some
    Android-specific features, such as adding ringtones, performing notifications,
    or changing the wallpaper that are typically user features.


    There is one other point to keep in mind: the specification for HTML 4.01 (the
    predecessor to HTML5) was introduced in 1999, so HTML5 represents the largest
    advance in HTML in years, and perhaps the inclusion of other technologies was
    inevitable. There is a great deal of excitement surrounding HTML5. Indeed, the
    enthusiasm for HTML5 has accelerated the speed with which HTML became a formal
    specification based on open standards.


    **Browser Support for HTML5**


    The WebKit-based browsers (Chrome and Safari), as well as Mozilla Firefox, Opera,
    IE10, and Microsoft Edge support many HTML features, on desktops as well as mobile
    devices. As for mobile devices, a very good website that lists the HTML features
    (including the ones that have been discussed in this chapter) that are supported
    by mobile browsers is here: *http://mobilehtml5.org/.*


    Currently Safari on iOS supports twenty-eight features whereas the Android supports
    twenty-four features (other browsers are listed as well). Another good website
    that provides test results of HTML-related features on various mobile devices
    is here: *http://www.quirksmode.org/mobile/*.


    The preceding website is maintained by Peter Paul Koch (who is often called PPK),
    and he maintains websites with many test results, along with blog posts expressing
    his views about trends in HTML5 and the mobile space.


    **WHICH TECHNOLOGIES ARE INCLUDED IN HTML5?**


    The following list contains a combination of technologies that are formally included
    in the HTML5 specification, as well as several other technologies that are frequently
    associated with HTML5:


    - Canvas 2D

    - CSS3

    - Drag-and-Drop (DnD)

    - File API

    - Geolocation

    - Microdata

    - Offline Applications

    - Server Sent Events (SSE)

    - SVG

    - Web Intents

    - Web Messaging

    - Web Storage

    - Web Sockets

    - Web Workers

