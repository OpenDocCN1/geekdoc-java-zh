    REPEATING AN IMAGE ON CANVAS WITH PATTERNS\n\nHTML5 Canvas provides the method\
    \ `createPattern(image, type)` that enables you to render a set of images according\
    \ to a pattern, whose values can be `repeat`, `repeat-x`, `repeat-y`, and `no-repeat`.\
    \ An example of the syntax (and how to use it) looks like this:\n\n```javascript\n\
    var pattern = canvas.createPattern(img,\"repeat\");\ncanvas.fillStyle = pattern;\n\
    canvas.fillRect(0,0,500,300);\n```\n\n**118** • CSS3 Pocket Primer\n\nListing\
    \ 6.8 displays the contents of `RepeatingImage.html`, which illustrates how to\
    \ repeat a binary image on an HTML5 `<canvas>` element.\n\n***LISTING 6.8 RepeatingImage.html***\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    \ />\n  <title>Repeating Images in HTML5 Canvas</title>\n  <script>\n    var elem,\
    \ canvas, imageName = \"BlueBall1.png\";\n    function init() {\n      elem =\
    \ document.getElementById(\"myCanvas\");\n      canvas = elem.getContext('2d');\n\
    \      var img = new Image();\n      img.src = imageName;\n      img.addEventListener(\"\
    load\", modImage, false);\n    }\n    function modImage(e) {\n      img = e.target;\n\
    \      var pattern = canvas.createPattern(img,\"repeat\");\n      canvas.fillStyle\
    \ = pattern;\n      canvas.fillRect(0,0,500,300);\n    }\n    window.addEventListener(\"\
    load\", init, false);\n  </script>\n</head>\n<body>\n  <div>\n    <canvas id=\"\
    myCanvas\" width=\"500\" height=\"300\">No support for Canvas</canvas>\n  </div>\n\
    </body>\n</html>\n```\n\nListing 6.8 contains the following line of code that\
    \ invokes the `init()` method when this page is loaded into a browser:\n\n`window.addEventListener(\"\
    load\", init);`\n\nThe `init()` method finds an HTML5 `<canvas>` element in the\
    \ Web page, and for simplicity, no error checking is performed (which can be handled\
    \ by code from previous examples). The `init()` method also initializes a JavaScript\
    \ variable `img` that references a binary image, and then adds an event listener\
    \ that executes the JavaScript function `modImage()`, as shown here:\n\nCSS3 and\
    \ HTML5 Canvas • **119**\n\n```javascript\nvar img = new Image();\nimg.src = imageName;\n\
    img.addEventListener(\"load\", modImage, false);\n```\n\nFinally, the `modImage()`\
    \ method invokes the Canvas method `createPattern()` with the parameter `repeat`\
    \ in order to create a rectangular grid of images that is based on one PNG file\
    \ (which is `BlueBall1.png` in this example), as shown here:\n\n```javascript\n\
    var pattern = canvas.createPattern(img,\"repeat\");\ncanvas.fillStyle = pattern;\n\
    canvas.fillRect(0,0,500,300);\n```\n\nFigure 6.6 displays `RepeatingImage.html`\
    \ in Listing 6.8 in a Chrome browser on a MacBook.\n\n***FIGURE 6.6*** Repeating\
    \ PNG images on a Chrome browser on a MacBook.\n\n**SUMMARY**\n\nThis chapter\
    \ showed you how to render line segments, rectangles, and circles in HTML5 Canvas.\
    \ You saw how to combine HTML5 Canvas with CSS3 stylesheets to create animation\
    \ effects. Next, you learned how to create linear and radial gradients in HTML5\
    \ Canvas. Finally, you learned how to embed PNG files in an HTML Canvas element.\n\
    \n## CHAPTER 7: SVG ESSENTIALS\n\nThis fast-paced chapter delves into many features\
    \ of SVG, which is an XML-based technology for rendering 2D shapes. Entire books\
    \ have been written about SVG, and one chapter about SVG is not enough to become\
    \ really proficient. As a sort of compromise, the code samples contain multiple\
    \ SVG features that will save you time from having to develop them by yourself.\
    \ For instance, the code sample that contains SVG transforms and gradients does\
    \ not provide a detailed description of these SVG features because you have already\
    \ encountered transforms and gradients in the first several chapters of this book.\
    \ Consequently, you already know the concepts, and it’s primarily a case of learning\
    \ the SVG syntax for creating such effects. At the same time, feel free to focus\
    \ on the sections that illustrate the SVG features that are of greatest interest\
    \ to you.\n\nIn case you didn’t already know, SVG has recently become the focus\
    \ of considerable interest in Web development, in part because its feature set\
    \ works well with CSS3. In addition, you can use SVG instead of PNG files (discussed\
    \ in Chapter 8). SVG also provides functionality that is unavailable in CSS3,\
    \ such as support for arbitrary polygons, elliptic arcs, and quadratic and cubic\
    \ Bezier curves. Moreover, you can easily combine SVG with CSS3 selectors in order\
    \ to create 3D graphics and animation effects.\n\nThe first part of this chapter\
    \ contains code samples that illustrate how to render lines and rectangles, and\
    \ also how to create linear gradients and radial gradients. The second part of\
    \ this chapter discusses polygonal shapes and the highly versatile SVG `<path>`\
    \ element.\n\nThe third section contains Bezier curves with SVG transforms, how\
    \ to render text in SVG, and SVG filters. The final section contains examples\
    \ of working with various combinations of SVG, CSS3, and jQuery, followed by a\
    \ brief comparison of SVG and CSS3.\n"
