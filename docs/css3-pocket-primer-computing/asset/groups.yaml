    ![](img/0a6af518702639b3a358cdd75f17af79_103_0.png)


    There are three types of changes in the 3D position of a device: up and


    down (z axis), left and right (y axis), and clockwise and counterclockwise (x


    axis). These changes are measured with an accelerometer, and you can check


    their current values in the deviceorientation event on the window object.


    This event fires whenever the mobile device moves, and it returns an object


    with orientation-related properties.


    The JavaScript code looks like the following:


    window.addEventListener(''deviceorientation'',function (o) {


    console.log(o.alpha,o.beta,o.gamma);


    }, false);


    The three properties alpha, beta, and gamma provide the rotation angle (in


    degrees, not radians) in the z, x, and y axes, respectively. Keep in mind that


    the z axis is the vertical axis (positive is upward), the x axis points toward
    you


    (negative is away from you), and the y axis is a left-to-right horizontal axis
    (to-


    ward the right is positive).


    The allowable values for these three properties are as follows:


    alpha: 0 to 360 (clockwise)


    beta: -180 to 180 (toward you/away from you)


    gamma: -90 to 90 (left to right)


    If you want more details regarding the orientation of a device, you can use the


    accelerometer to obtain more precise information.


    **DETECTING SCREEN WIDTH AND HEIGHT**


    The window object supports a resize event that you can use for determin-


    ing the width and height of the screen, which in turn enables you to modify


    other effects in HTML5 Web pages. Listing 5.4 displays the contents of Re-


    sizeBorder1.html that illustrates how to maintain the same blue border


    regardless of the screen size or screen orientation.


    ***LISTING 5.4 ResizeBorder1.html***


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="utf-8" >


    <title>Resizing the Window</title>


    <style>


    * {


    margin:0px; padding:0;


    }


    #outer {


    width: 400px; height: 300px;


    border: 10px solid blue;


    }


    </style>'
