    **A SIMPLE HTML WEBSITE**


    In addition to introducing many new semantic elements, HTML5 has


    simplified several elements, including the <DOCTYPE> declaration and the at-


    tributes lang and charset. Listing 1.1 displays Sample1.html, which is an


    HTML5 website that illustrates the simplified syntax of HTML5.


    ***LISTING 1.1 Sample1.html***


    <!doctype html>


    <html lang="en">


    <head>


    <meta charset="utf-8">


