    }\n</script>\n</body>\n</html>\n```\n\n列表 5.4 包含一个 `<style>` 元素，其第一个选择器将网页所有元素的内边距设置为\
    \ 0px。第二个选择器指定了 10px 的蓝色边框。当你将此网页加载到浏览器中时，每当调整大时，JavaScript 函数 `resizeBorder()`\
    \ 就会执行。该 JavaScript 函数通过以下代码获取浏览器的当前宽度和高度：\n\nvar rescaledScreenWidth = document.documentElement.clientWidth;\n\
    var rescaledScreenHeight = document.documentElement.clientHeight;\n\n`resizeBorder()`\
    \ 中的后续两行代码设置了 id 为 `outer` 的 `div` 元素的宽度和高度，增加了 `borderWidth`。\n\n## 用于多种屏幕尺寸的\
    \ CSS3 媒体查询\n\n在 CSS3 媒体查询的介绍中，你看到了使用复合条件逻辑（包括 and、or、only、not）定义媒体查询的示例。如果你没有注意，可以使用媒体查询来处理手机和平板等移动设备的屏幕尺寸。这样做的示例在此：\n\
    \n```css\n@media screen and (min-width:321px) and (max-width:480px) {\n  div {\
    \ width: 100px; }\n}\n@media screen and (min-width:481px) and (max-width:720px)\
    \ {\n  div { width: 200px; }\n}\n```\n\n上述媒体查询对逻辑很简单：第一个媒体查询当屏幕宽度在 321 像素到 480\
    \ 像素之间时，将 `div` 元素的宽度设置为 100px；第二个媒体查询当屏幕宽度在 481 像素到 720 像素之间时，将 `div` 元素的宽度设置为\
    \ 200px。\n\n以下媒体查询仅在是屏幕时，将 `div` 元素的宽度设置为 150px：\n\n```css\n@media only screen\
    \ {\n  div { width: 150px; }\n}\n```\n\n以下媒体查询为不支持方向的设备将 `div` 元素的宽度设置为 50px：\n\
    \n```css\nnot (orientation) {\n  div { width: 50px; }\n}\n```\n\n正如你在本节和之前节的示例中所示，CSS3\
    \ 媒体查询在表达力和直观功能方面是简单、灵活且强大的。\n\n## CSS 设备适配\n\nCSS 设备适配允许你使用 CSS 来指定 HTML5 页面中\
    \ viewport meta 元素的尺寸、缩放因子和方向。作为一个简单的示例，以下选择器指定了 `width` 属性和 `zoom` 属性：\n\n```css\n\
    @viewport {\n  width: device-width;\n  zoom: 0.5;\n}\n```\n\n你也可以将 `@viewport`\
    \ 嵌入 `@media` 中（使用你已经熟悉的条件逻辑），如下例所示：\n\n```css\n@media screen and (min-width:200px)\
    \ {\n  @viewport {\n    width: 100px;\n  }\n}\n@media screen and (max-width:200px)\
    \ {\n  @viewport {\n    width: 300px;\n  }\n}\n```\n\nviewport meta 元素的允许值列在此：\n\
    \n- width\n- height\n- initial-scale\n- minimum-scale\n- maximum-scale\n- user-scalable\n\
    - target-densityDpi\n\n关于 CSS 设备适配的更多信息可以在 W3C 规范中获得（正在进行中）：http://www.w3.org/TR/css-device-adapt/。\n\
    \n"
