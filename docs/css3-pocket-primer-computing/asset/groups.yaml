    **BOUNCING EFFECTS WITH CSS3 KEYFRAMES**


    The previous example showed you how to create a fading animation and this section
    shows you how to create a “bouncing” animation. Listing 3.7 displays the contents
    of Bounce2.html and Listing 3.8 displays the contents of Bounce2.css, which illustrate
    how to create a “bouncing” effect on an input field.


    ***LISTING 3.7 Bounce2.html***


    <!DOCTYPE html>

    <html lang="en">

    <head>

    <title>CSS Animation Example</title>

    <meta charset="utf-8" />

    <link href="Bounce2.css" rel="stylesheet" type="text/css">

    </head>

    <body>

    <div id="outer">

    <input id="input" type="text" value="An input">

    </div>

    </body>

    </html>


    ***LISTING 3.8 Bounce2.css***


    ```css

    #outer {

    position: relative; top: 50px; left: 100px;

    }

    @keyframes bounce {

    0% {

    left: 50px;

    top: 100px;

    background-color: #ff0000;

    }

    25% {

    left: 100px;

    top: 150px;

    background-color: #ffff00;

    }

    50% {

    left: 50px;

    top: 200px;

    background-color: #00ff00;

    }

    75% {

    left: 0px;

    top: 150px;

    background-color: #0000ff;

    }

    100% {

    left: 50px;

    top: 100px;

    background-color: #ff0000;

    }

    }

    #input {

    font-size: 24px;

    border-radius: 4px;

    }

    #outer:hover {

    animation: bounce 2.0s 4 ease;

    }

    ```


    Listing 3.8 contains a @keyframes rule labeled bounce that specifies five time
    intervals: the 0%, 25%, 50%, 75%, and 100% points of the duration of the animation
    effect. Each time interval specifies values for the left, top, and background-color
    of the <input> field. Despite the simplicity of this @keyframes rule, it creates
    a pleasing animation effect. The #input selector matches the input field in Bounce2.html
    and results in a rounded rectangle. The #input:hover selector uses bounce keyframes
    in order to create an animation effect for a two-second interval, repeated four
    times, using an ease function, as shown here: animation: bounce 2.0s 4 ease;


    Figure 3.4 displays a snapshot of the animation effect in the HTML Web page Bounce2.html.


    ***FIGURE 3.4*** CSS3 bouncing animation effect.


    In addition to CSS3 keyframes, you can use CSS Motion Paths in order to create
    animation effects, as discussed in the next section.


    ## CSS MOTION PATHS


    CSS Motion Paths are currently under development, and they offer tremendous potential
    in terms of creating complex animation effects in pure CSS3. CSS Motion Paths
    allow authors to animate any graphical object along an author-specified path.
    You define a CSS Motion Path in a CSS selector by specifying the motion-path property,
    whose value involves an actual path in the path() function. CSS Motion Paths support
    four properties: motion (a shorthand for motion-path), motion-offset (a position
    on a motion-path), motion-path (an SVG-like path for animation), and motion-rotation
    (the direction of an element on a motion path).


