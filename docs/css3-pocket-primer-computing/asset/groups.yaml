    **USEFUL LINKS**


    This section contains an assortment of links with useful additional informa-


    tion for various topics that were discussed in this chapter.


    A nice set of “sketch-like” visual effects that use CSS3 is here: *http://an-*


    *drew-hoyer.com/index.html*.


    Compatibility tables for support of HTML5, CSS3, SVG and more in desk-


    top and mobile browsers is here: *http://caniuse.com*.


    A website for generating CSS3 code using various CSS3 features is here:


    *http://CSS3generator.com*.


    A website that enables you to perform live editing of the contents of various


    CSS3 selectors and then see the results is here: *http://CSS3please.com*.


    A toolkit that handles the details of browser-specific extensions for CSS3


    properties so that you can write prefix-less CSS3 selectors is here: *http://ecss-*


    *tender.org*.


    A website that enables you to create gradients online and view the associ-


    ated CSS3 code is here: *http://gradients.glrzad.com*.


    Another website with information regarding browser support for HTML5


    and CSS3 features is here: *http://html5readiness.com*.


    An extensive collection of articles regarding HTML5 is available here:


    *http://www.html5rocks.com/en/*.


    A website devoted to all things pertaining to CSS3 is here: *http://www.*


    *CSS3.info*.


    The following site is an excellent source for browser compatibility informa-


    tion on the Internet (maintained by Peter-Paul Koch): *http://www.quirksmode.*


    *org*.


    A very good online tool that allows you to experiment with many CSS3 fea-


    tures and also display the associated CSS3 code can be found at *http://www.*


    *westciv.com/tools/3Dtransforms/index.html*.


    These links provide a wealth of information and useful techniques, so


    there’s a very good chance that you can find the information that you need to


    create the visual effects that you want for your website.


    **SUMMARY**


    This chapter showed you how to create glow and fading effects, and how to


    render multicolumn text. Then you learned how to use CSS3 keyframes and


    the CSS3 functions scale(), rotate(), and translate(), which enable


    you to create 2D animation effects. You learned about CSS Motion Paths,


    which is an experimental CSS3 feature that supports SVG-like animation ef-


    fects. In addition, you learned about CSS3 filters, along with links to websites


    that can programmatically generate custom filters for Web pages.


    The final section of the chapter delved into combining CSS3 with jQuery in


    order to create 2D effects, as illustrated in a “follow the mouse” code sample.'
- md: "\n## CHAPTER 4\n## CSS3 3D GRAPHICS AND ANIMATION\n\nThis chapter shows you\
    \ how to create HTML Web pages with various 3D graphics and animation effects\
    \ involving CSS3. However, while 3D effects can be more appealing than 2D effects,\
    \ they are usually more CPU intensive, which can be problematic for Web pages\
    \ that are rendered on mobile devices. CSS3 3D effects depend on the GPU (Graphics\
    \ Processing Unit) to handle intensive computations, and you will learn how to\
    \ guarantee that the GPU will be invoked. In addition, many Web pages are displayed\
    \ on mobile devices, so it’s important to determine the impact of CSS3 3D animation\
    \ effects on the battery life of mobile devices.\n\nThe first part of this chapter\
    \ shows you how to use CSS3 2D transforms to render a cube, along with transitions\
    \ that create an animation effect during hover events. The second part of this\
    \ chapter discusses 3D transforms, such as translate, scale, and rotate transforms\
    \ (there is no 3D counterpart for 2D skew transforms). This section also discusses\
    \ how to create CSS3 transitions.\n\nThe third part of this chapter contains examples\
    \ of 3D animation effects.\n\nThe fourth part of this chapter shows you how to\
    \ combine 3D effects with sprites, CSS animation tools, and an optional section\
    \ that creates animation effects with jQuery and CSS (the jQuery Appendix provides\
    \ an introduction if you need to familiarize yourself with this technology).\n\
    \nIn addition to the code samples that are discussed in this chapter, an extensive\
    \ set of code samples for creating CSS3 2D/3D graphics/animation effects (mainly\
    \ for fun) is here: https://github.com/ocampesato/css3-graphics.\n\nSince this\
    \ chapter involves CSS3 3D animation effects, the final portion of this chapter\
    \ briefly discusses the GPU, its role in HTML, and also shows you how to guarantee\
    \ that the GPU is invoked for CSS-based animation effects. After you have read\
    \ the chapters that discuss CSS3 with SVG and CSS3 with HTML5 Canvas, Chapter\
    \ 9 briefly compares these technologies from the standpoint of performance.\n\n\
    ### CSS3 3D TRANSFORMS\n\nIn general, CSS3 supports 3D transforms that correspond\
    \ to their 2D counterparts; one exception is the skew transform that does not\
    \ have a 3D counterpart. Specifically, 3D transforms include: translate3D, rotate3D,\
    \ scale3D, matrix3D, and perspective.\n\nListing 4.1 displays the contents of\
    \ 3DTransforms.html, which illustrates how to use CSS3 3D transforms in a Web\
    \ page, and Listing 4.2 displays the contents of the CSS3 stylesheet ThreeD2.css.\n\
    \n#### LISTING 4.1 Threed2.html\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    <head>\n<title>CSS 3D Effects Example</title>\n<meta charset=\"utf-8\" />\n<link\
    \ href=\"Threed2.css\" rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n\
    <div id=\"outer\">\n<div id=\"radial1\">Text1</div>\n<div id=\"radial2\">Text2</div>\n\
    </div>\n</body>\n</html>\n```\n\nListing 4.1 is a simple HTML5 Web page that contains\
    \ a reference to the CSS3 stylesheet Threed2.css, followed by a <body> element\
    \ that contains a <div> element whose id attribute has the value outer. This same\
    \ <div> element has two child <div> elements that match some of the selectors\
    \ in Listing 4.2.\n\n#### LISTING 4.2 Threed2.css\n```css\n#outer {\n  position:\
    \ relative; top: 10px; left: 0px;\n}\n#radial1 {\n  opacity: 0.8;\n  font-size:\
    \ 24px;\n  width: 200px;\n  height: 200px;\n  position: absolute; top: 0px; left:\
    \ 0px;\n  background: radial-gradient(\n    blue 1%,\n    orange 5%, yellow 40%,\n\
    \    green 60%, red 80%,\n    #fff\n  );\n  transform: rotate3d(20,30,40, 50deg)\
    \ translate3d(50px,50px,50px) skew(-15deg,0);\n}\n#radial2 {\n  opacity: 0.6;\n\
    \  font-size: 24px;\n  width: 200px;\n  height: 200px;\n  position: absolute;\
    \ top: 200px; left: 200px;\n  background: radial-gradient(\n    red 1%,\n    orange\
    \ 5%, yellow 40%,\n    green 60%, blue 80%,\n    #fff\n  );\n  transform: rotate3d(1,0,0,\
    \ 60deg) scale3d(1.5, 0.5, 0.75);\n}\n```\n\nListing 4.2 contains two CSS selectors,\
    \ #radial1 and #radial2, that match the <div> elements in Listing 4.1 that have\
    \ corresponding id values. As you can see, these selectors contain the transform\
    \ property that specifies combinations of CSS3 3D functions, such as rotate3d()\
    \ and translate3d(), as well as the 2D skew() function.\n\nKeep in mind that CSS3\
    \ 3D transforms might not be supported in all browsers. Check the caniuse website\
    \ for information regarding which browsers support a specific 2D or 3D transform\
    \ at http://caniuse.com/#feat=transforms2d and http://caniuse.com/#search=css3%203d%20transforms.\n\
    \n### CSS3 3D TRANSITIONS (FIX EXAMPLE)\n\nA CSS transition is an animation effect\
    \ on a CSS property for a specified duration. The default value for the duration\
    \ of a CSS transition effect is 0. Hence, a transition will not occur unless you\
    \ specify the duration of a CSS transition.\n\nListing 4.3 displays the contents\
    \ of 3DTransition1.html, which uses CSS3 transitions that trigger transforms in\
    \ response to “hover” events.\n\n#### LISTING 4.3 3DTransition1.html\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>CSS3 Transition\
    \ Effect</title>\n<style>\ndiv {\n  width: 150px;\n  height: 150px;\n  background:\
    \ red;\n  transition: width 2s;\n}\ndiv:hover {\n  width: 300px;\n}\n</style>\n\
    </head>\n<body>\n<p>Hover over the following div element:</p>\n<div></div>\n</body>\n\
    </html>\n```\n\nListing 4.3 contains a <style> element that contains a CSS selector\
    \ that matches HTML <div> elements. This selector specifies several CSS properties,\
    \ including a transition property. The <style> element also contains a selector\
    \ that matches “hover” events over <div> elements. In this case, the width of\
    \ the <div> element is 300px. The final portion of Listing 4.3 consists of an\
    \ empty <div> element. CSS3 supports transitions involving 3D that is analogous\
    \ to 2D. You can use “hover” pseudo-classes in order to detect transitions whenever\
    \ HTML pages are rendered on mobile devices.\n\nIn addition to the transition\
    \ property, CSS3 supports:\n- transition: A shorthand property for setting the\
    \ transition properties\n- transition-delay: Specifies a delay before the transition\
    \ starts\n- transition-duration: Specifies how long, as shown here:\n#div1 { transition:\
    \ linear; }\n#div2 { transition: ease; }\n#div3 { transition: ease-in; }\n#div4\
    \ { transition: ease-out; }\n#div5 { transition: ease-in-out; }\n\nBrowser support\
    \ for CSS transitions is listed here: http://caniuse.com/#feat=transitions.\n\n\
    ### CSS3 3D ANIMATION OF TEXT AND PNG FILES\n\nListing 4.4 displays the contents\
    \ of TextAndImages.html, which aligns text strings and PNG files, and also creates\
    \ animation effects when users hover the text or the PNG files.\n\n#### LISTING\
    \ 4.4 TextAndImages.html\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"utf-8\" />\n<title>Text, Images, and Animation</title>\n<link\
    \ href=\"TextAndImages.css\" rel=\"stylesheet\" type=\"text/css\">\n</head>\n\
    <body>\n<div class=\"preferences\">\n<img src=\"arrow-up.png\"/>\n<p>23 Beer</p>\n\
    <img src=\"arrow-down.png\"/>\n<p>11 Beer</p>\n</div>\n</body>\n</html>\n```\n\
    \n#### LISTING 4.5 TextAndImages.css\n```css\n.preferences {\n  width: 230px;\n\
    \  height: 40px;\n  background-color:#e2f;\n  padding:12px;\n  top:20px;\n  box-shadow:\
    \ 0 0 24px rgba(100, 100, 100, 0.9);\n}\n.preferences > img {\n  width: 24px;\n\
    \  height: 24px;\n}\n.preferences > p {\n  margin:0;\n  font-size: 24px;\n}\n\
    ```\n"
