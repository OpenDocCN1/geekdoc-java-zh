    ## 第 8 章

    ## 杂项主题


    本章包含了多样化的主题，首先从 Houdini 的概述开始，这是一个对网页中 CSS 具有深远影响的倡议。你还将学习 Flexbox 和 Grid 布局，以及二进制图像的性能技术。此外，你将看到
    CSS3、SVG 和 HTML5 Canvas 的比较，以及 Web Animation API 和动画相关的工具包。


    本章的第一部分是对 Houdini 的简要介绍，Houdini 是一个重要的工作组，目标是提供新的 API，以便在所有现代浏览器中提供一致的 CSS 行为。


    本章的第二部分包含了代码示例，展示如何使用 CSS Flexbox 和 CSS Grid 布局。第三部分讨论了 HTML5 Web 页面和 CSS3 的性能改进，以及
    CSS3、SVG 和 HTML5 Canvas 的比较。


    本章的第四部分涵盖了优化二进制图像的性能技术，并对精灵（spritesheets）、渐模糊技术（blur-up）、渐进式图像（progressive images）和
    Web 字体进行了描述。第五部分介绍了 Web Animations API 以及其他动画工具包，如 GSAP、mojo.io 和 sequence.js。


    本章的最后一部分深入探讨了 Chrome 检查器的某些功能，它提供了一套非常丰富的诊断和调试能力。你将学习“计算属性”、如何对 CSS 选择器中的属性进行实时更新，以及如何收集帮助你精确定性能瓶颈的数据。在完成本节后，你能够更好地将
    Chrome 检查器与其他现代浏览器支持的相应功能进行基于功能的比较。


    ## HOUDINI 项目


    Houdini 是一个 W3C 工作组，其目标是提供一组 API，使 CSS 在所有现代浏览器中保持一致。这些 API 还将允许开发者通过访问浏览器渲染引擎的样式和布局过程来扩展
    CSS。尽管 Houdini 是一个相对较新的小组，但这里有一些 Houdini 示例：*https://github.com/GoogleChrome/houdini-samples*。


    正如你现在可能已经知道的，补丁填充（polyfills，如 Modernizr）是 JavaScript 工具包，用于“填补”浏览器中缺失的功能，以便其他
    JavaScript 工具包能够在不同的现代浏览器中一致地运行。从本质上说，填充通过修改 DOM 来工作。


    DOM 的 CSS“对应物”是 CSSOM，它是 CSS 对象模型（CSS Object Model）的缩写。遗憾的是，CSSOM 在不同浏览器之间是不一致的且缺乏关键功能。此外，“填充”CSS
    比填充 DOM 更困难（而且它也是一个不完整的解决方案）。


    CSSOM 的缺陷之一是它会丢弃任何无法识别的 CSS 规则或声明；因此，必须使用 DOM（特别是访问 `<style>` 和 `<link>` 元素）来填充这些规则和声明。


    从本质上说，Houdini 的目标是修改浏览器的内部渲染引擎，以“规范化”（即消除现代浏览器中 CSS 的不一致行为）。


    ### 渲染流水线（The Rendering Pipeline）


    渲染流水线涉及以下阶段（按此顺序）：


    1. 解析器 (Parser)

    2. DOM/CSSOM

    3. 级联 (Cascade)

    4. 布局 (Layout)

    5. 绘制 (Paint)

    6. 合成 (Composite)


    前三个阶段是 CSS 属性和值 API 的组件，后三个阶段组成了单元（Worklets）。Houdini 在渲染流水线中引入了阶段 1（尚未编写）和阶段 3。阶段
    1 是正确处理外部样式表的地方，也是支持 CSS 自定义扩展的地方。


    Houdini 还引入了单元（worklets）的概念，它们本质上是处理注册相关操作的脚本。单元支持各种功能，如调用 JavaScript 代码的能力。


    访问 Houdini 主页获取有关拟议的 Houdini API 的更多详细信息。


    ## CSS3 高级特性


    书中的 CSS3 示例已基于 WebKit 的浏览器中经过测试，你使用浏览器特定的前缀（在第 1 章中简要讨论过）为其他浏览器插入 CSS3 代码。此外，本章中的某些代码示例在
    Google Canary 中渲染，有时在 WebKit 的每日构建版本中渲染，并将进行相应说明。当本书印刷时，这些功能可能在通用 Chrome 发行版中可用。


    有几个 CSS 特性处于活跃开发中，其中大多数（可能所有）在基于 WebKit 的浏览器中可用。在许多情况下，每个新 CSS 特性的 W3C 规范都是“进行中的工作”，因此在你阅读此书时，它们可能已经被修改。请检查
    www.caniuse.com 等网站以获取你所选浏览器最新功能支持的信息。


    在高级（在某些情况下是实验性的）特性中包括：


    1. CSS Flexbox

    2. CSS 混合 (Blending)

    3. CSS 复合 (Compositing)

    4. CSS 排除 (Exclusions)

    5. CSS 区域 (Regions)


    考虑到上述几点，这里是一些最新的 CSS3 特性列表：


    - CSS Canvas 背景 (Webkit 和 FF)

    - CSS 设备适配 (IE10)

    - CSS 排除 (IE10)

    - CSS 过滤器 (IE10 和 Webkit)

    - CSS Flexbox (IE10)

    - CSS Grid (IE10)

    - CSS 区域 (Webkit)

    - CSS 自定义过滤器 (Webkit)

    - CSS 模板 (IE10)


    CSS Flexbox 是列表中唯一在本章中涵盖的特性。你将在稍后看到一些示例。


    ### CSS FLEXBOX（弹性布局）


    Flexbox 是一种单向布局概念，其中项目放置在行或列中。`flex-direction` 的默认值为 `row`，这意味着项目按从左到右、从上到下排列（即我们在页面上阅读文本的顺序）。`flex-direction`
    的其他值有：


    - row-reverse

    - column

    - column-reverse


    Flexbox 模型还允许你扩展子元素填充剩余空间，以及缩小子元素以避免溢出。此外，你可以在同一个 HTML 页面中创建不同的 flexbox。


    ### Flexbox 属性集


    一些不需要前缀的常用 Flexbox 属性包括：`box-align`、`box-flex`、`box-order-group`、`box-pack` 和
    `flex-flow`。`box-align` 属性（以及其他 Flexbox 属性）支持 `start`、`end`、`center`、`baseline`
    和 `stretch` 等值，所有这些允许你指定 flexbox 中元素的对齐方式。例如，`start` 和 `end` 分别将 flexbox 中的一组元素元素。


    `box-flex` 属性允许你为 flexbox 中的元素分配更大的相对权重。`box-order-group` 属性允许你更改 flexbox 中一组元素的默认顺序。你还可以使用
    `display` 属性并指定值为 `box`。


    可以使用 Flexbox 属性执行额外任务：


    - 使用 `order` 排列 flexbox 子元素

    - 使用 `flex-basis` 定义 flexbox 子元素的尺寸

    - 使用 `flex-shrink` 和 `flex-grow` 正确缩放 flexbox 子元素

    - 使用 `flex-wrap` 和 `align-content` 创建网格


    下一节包含一个包含上述 Flexbox 属性的 Web 页面示例。


    ### 带有 Flexbox 属性的 Web页面


    列表 8.1 显示了 `SimpleFlexboxWK1.html` 的内容，列表 8.2 显示了 `SimpleFlexboxWK1.css` 的内容，它们说明了如何使用本节开始列表中的
    flexbox 属性。


