    \ the code is the same as 3DCube1.css\n```\n\n## ANIMATION EFFECTS WITH CSS3 KEYFRAMES\n\
    \nThe CSS3-based code samples you have seen so far primarily involved static visual\
    \ effects (but you saw how to use the hover-selector to create an animation effect).\
    \ The next section discusses CSS3 keyframes for creating animation effects that\
