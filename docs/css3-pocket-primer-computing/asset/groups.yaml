    Listing 1.1 contains an HTML5 <!DOCTYPE> element whose simple structure


    is very intuitive and easy to remember, especially in comparison to the syntax


    for an HTML4 <!DOCTYPE> element (try to construct one from memory!).


    This markup is backward compatible: it triggers standards mode in all browsers


    that have standards mode (versus quirks mode) and it also tells the browser to


    use the special HTML5 parsing mode.


    In addition, the <meta> tag and its attributes lang and charset are sim-


    pler than their counterparts in earlier versions of HTML. Note that HTML5


    supports the new syntax as well as the earlier syntax, so your existing HTML


    pages will be recognized in HTML5.


    **NEW HTML5 ELEMENTS**


