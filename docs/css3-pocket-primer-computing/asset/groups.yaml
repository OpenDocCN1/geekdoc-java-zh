    \ you can use CSS3 Media Queries in order to determine the following characteristics\
    \ of a device:\n\n- Browser window width and height\n- Device width and height\n\
    - Orientation (landscape or portrait)\n- Aspect ratio\n- Device aspect ratio\n\
    - Resolution\n\nCSS3 Media Queries are Boolean expressions that contain one or\
    \ more “simple terms” (connected with and or or not) that evaluate to true or\
    \ false. Thus, CSS3 Media Queries represent conditional logic that evaluates to\
    \ either true or false.\n\nAs an example, the following link element loads the\
    \ CSS stylesheet mystuff.css only if the device is a screen and the maximum width\
    \ of the device is 480px:\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\"\
    \ media=\"screen and (max-device-width: 480px)\" href=\"mystuff.css\"/>\n```\n\
    \nThe preceding link contains a media attribute that specifies two components:\
    \ a media type of screen and a query that specifies a max-device-width whose value\
    \ is 480px. The supported values for media in CSS3 Media Queries are braille,\
    \ embossed, handheld, print, projection, screen, speech, tty, and tv.\n\nThe next\
    \ CSS3 Media Query checks the media type, the maximum device width, and the resolution\
    \ of a device:\n\n```css\n@media screen and (max-device-width: 480px) and (resolution:\
    \ 160dpi) {\n  #innerDiv {\n    float: none;\n  }\n}\n```\n\n**82** • CSS3 Pocket\
    \ Primer\n\nIf the CSS3 Media Query in the preceding code snippet evaluates to\
    \ true, then the nested CSS selector will match the HTML element whose id attribute\
    \ has the value innerDiv, and its float property will be set to none on any device\
    \ whose maximum screen width is 480px. As you can see, it’s possible to create\
    \ compact CSS3 Media Queries that contain nontrivial logic, which is obviously\
    \ very useful because CSS3 does not have any if/then/else construct that is available\
    \ in other programming languages.\n\nThe following CSS3 Media Query tests the\
    \ media type, the minimum device width, and the resolution of a device:\n\n```css\n\
    @media screen and (min-device-width: 481px) and (resolution: 160dpi) {\n  #innerDiv\
    \ {\n    float: left;\n  }\n}\n```\n\nIn the preceding CSS3 selector, the HTML\
    \ element whose id attribute has the value innerDiv will have a float property\
    \ whose value is left on any device whose minimum screen width is 481px.\n\nThe\
