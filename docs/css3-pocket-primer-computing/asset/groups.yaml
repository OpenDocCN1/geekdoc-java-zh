    **WHAT IS GOOD MOBILE DESIGN?**


    The answer to this simple question is more complex than you might think,


    but there are some guidelines to help you make design decisions for hybrid


    HTML5 mobile applications (and also native applications, such as iOS and


    Android, which are outside the scope of this book). As you will see, some of


    these guidelines include touch-orientation, performance and responsiveness,


    detecting screen sizes, resizing assets, and determining the actual content.


    The next several sections provide more information about these and other


    important factors, and then discuss toolkits or provide code snippets that can


    help you implement the desired functionality.


    **IMPORTANT FACETS OF MOBILE WEB DESIGN**


    Some of the important considerations for designing hybrid HTML5 mobile


    applications are here:


    • A touch-oriented design (not mouse-oriented)


    • Improving response times of user gestures


    • Detecting different screen sizes (especially for Android devices)


    • Resizing assets (such as images)


    • Determining the content of a Web page


    Instead of handling mouse clicks, mobile web applications handle touch-


    related events (single tap and multiple taps) and user gestures (swipe, flick,


    pan, and so forth).


    Fortunately, jQuery Mobile provides a virtualization of events that takes


    care of mouse events and touch events through a single set of APIs. This virtu-


    alization simplifies your code: you only need to handle one set of events.


    **A TOUCH-ORIENTED DESIGN**


    You might think that you can accomplish this goal simply by replacing all


    mouse-related events with their touch-related counterparts. Although this is a


    good starting point, there are several caveats to this approach. First, there
    is


    no touch event that is the counterpart for a mouse-based hover event. Conse-


    quently, CSS stylesheets with selectors of the type #myDiv:hover will work cor-


    rectly on laptops and desktops, but they do not work correctly on mobile devices.


    Second, when users touch a mobile screen with one of their fingers, the


    second gesture could be one of the following:


    **1\.** Touch up


    **2\.** Touch hold'
