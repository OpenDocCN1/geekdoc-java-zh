    ***Article versus Section: How Are They Used?***


    The semantics of the HTML5 <article> element and the HTML5


    <section> element are complex, partly because they can be nested in each


    other: an <article> element can contain one or more <section> elements,


    and each of those <section> elements can contain one or more <article>


    elements. While it’s possible to devise a “hack” to disambiguate the logical rela-


    tionship of these elements in a given HTML5 website, no standard convention


    exists right now. Another factor is the manner in which these two HTML ele-


    ments are treated by the Document Outlining Algorithm for creating outlines


    in HTML websites, which is described here:


    *http://coding.smashingmagazine.com/2011/08/16/html5-and-the-docu-*


    *ment-outlining-algorithm.*


    For simple HTML5 websites, the <article> element and the <section>


    element will behave in a reasonable manner, but for more complex HTML5


    websites, the results might be unexpected (or unwanted). Before you use the


    <section> and <article> elements for content in an HTML5 website,


    think of the logical relationship of the content in order to determine the struc-


    tural layout of your HTML5 website. If there is any possibility for confusion,
    it


    might also be helpful to include a comment section to make it easier for other


    people to understand the rationale for the layout of your HTML5 website. In


    any case, it’s worth spending some time learning about these elements and also


    about the Document Outlining Algorithm.'
