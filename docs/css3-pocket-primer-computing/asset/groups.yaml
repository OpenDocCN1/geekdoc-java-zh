    concave) in the plane. You also learned about the SVG <pattern> element


    and how to create custom patterns for creating rich visual effects. Then you


    learned about Bezier curves and how to render text strings along a path (such


    as a Bezier curve) in SVG. Finally, you learned about SVG filters and how to


