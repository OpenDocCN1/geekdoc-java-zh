    **CSS3 ANIMATION AND CSS SPRITES**


    CSS Sprites reduce the number of HTTP requests (which reduces re-


    sponse time for Web pages) and also reduce the total file size. The idea is sim-


    ple: download a single image (which is called a sprite) that contains all the


    smaller images on a website, and then reference the smaller images by their


    location in the sprite.


    This process requires two steps: a) create the sprite, and b) for each image


    in the sprite, calculate its location in the sprite and then update CSS selec-


    tors accordingly. Although you can perform these two steps manually, a much


    simpler alternative that will save you a lot of time and effort is an excellent
    tool


    called SpriteMe, which can be found at *http://spriteme.org/*.


    This website contains a demonstration that shows you how to install the


    tool in your bookmarks toolbar and how to easily create a sprite in a matter of


    minutes for a website. In addition, you can download the generated sprite and


    the CSS selectors that contain the location of each image that is included in


    the sprite. After you have created a sprite, you can use the techniques that you


    learned earlier in this chapter in order to apply 2D and 3D animation effects


    on your sprite.


    Another useful website that contains a collection of techniques and tutori-


    als involving CSS Sprites can be found at


    *http://namburivk.blogspot.in/2012/05/building-faster-websites-with-css.*


    *html?goback=%2Egde_2071438_member_120537762*.


    The next section discusses performance-related topics, starting with an


    overview of CSS and the GPU.


    **HTML WEB PAGES AND THE GPU**


    The material in this section is admittedly more complex than other sec-


    tions in this chapter and other chapters in this book, and that’s because there


    are various factors involved to ensure that browsers render graphics smoothly


    (without any “jank”) at many frames per second. Nevertheless, you will see


    suggestions about the type of CSS code to avoid because of its adverse effect


    on the performance of a Web page.


    As a starting point, browsers render smooth CSS3-based graphics and ani-


    mation effects with the help of a GPU, which is a single-chip dedicated proces-


    sor that can improve the performance of video/graphics that involve 2D or 3D


    graphics.'
- md: "\nCSS3 3D Graphics and Animation • 71\n\n*Browsers must be able to use the\
    \ driver of the graphics card that is installed on the host OS, and GPU acceleration\
    \ for one browser on a given machine doesn’t guarantee support for all browsers.*\n\
    \nWeb pages can contain CSS selectors that cause changes in the position of HTML\
    \ elements. Browsers handle positional changes via two significant operations\
    \ that can adversely affect performance: repainting and reflow. Repainting involves\
    \ the calculation of new pixel values (which can be off-loaded to the GPU), and\
    \ reflow involves calculating the new positions of HTML elements.\n\nNote that\
    \ some CSS-based effects, such as changing the opacity of an element, requires\
    \ repainting but not reflow if the element does not change its position.\n\nChrome’s\
    \ DevTools provides an “Enable paint flashing” to view the repainting process:\
    \ when this feature is enabled, green boxes appear around repainted areas. The\
    \ GPU handles the calculation of pixel values by performing something called “compositing”\
    \ that involves the creation of one or more “composite layers.” These layers are\
    \ “blended together” in order to combine various effects. You can think of the\
    \ composite layers as a stack of parallel planes with different colored pixels,\
    \ and the compositing process as the calculation of the final color of each pixel\
    \ when the planes are superimposed on each other. The GPU creates a separate composite\
    \ layer in the following cases: 3D or perspective CSS transforms, <video> or <canvas>\
    \ elements, CSS filters, and overlapping elements extracted to a composite layer\
    \ (such as a z-index).\n\nThere is also a size limit in the number of compositing\
    \ layers that can be created, so it’s possible to create animation effects that\
    \ exhaust the GPU memory. Fortunately, Chrome’s DevTools provide a “Show layer\
    \ border” option that displays each composite layer with an orange border.\n\n\
    One point to keep in mind is that the compositing process is most efficient for\
    \ changes on elements that can be performed directly in the GPU. Specifically,\
    \ changes to elements via transform, opacity, or filter can be handled directly\
    \ by the GPU.\n\nChrome switches on hardware compositing mode (if supported and\
    \ not already “on”). Chrome creates a new layer and “backing surface,” which is\
    \ a graphics context (aka texture) into which layers are drawn. Backing surfaces\
    \ are uploaded to the GPU, and layers sometimes share the same “backing surface.”\
    \ Chrome creates a new backing surface if a layer:\n\n1. Uses 3D or perspective\
    \ transform CSS properties\n2. Is used by a <video> element using accelerated\
    \ video decoding\n3. Is used by a <canvas> element with a 3D context or accelerated\
    \ 2D context\n4. Uses a CSS animation for its opacity or uses an animated transform\n\
    5. Uses accelerated CSS filters\n6. Has a descendant that is a compositing layer\n\
    7. Has a sibling with a lower z-index which has a compositing layer (is the layer\
    \ rendered on top of a composited layer?)\n\n### NOTE\n\n### CSS Mask and Performance\n\
    \nA CSS Mask results in a new offscreen buffer (OSB). Next, the GPU first writes\
    \ to the OSB instead of directly to VRAM (Video RAM), after which the OSB contents\
    \ are copied to VRAM. However, VRAM is comparatively limited on mobile devices\
    \ and it’s “easily exhausted,” which can lead to performance degradation. Keep\
    \ in mind that CSS rounded corners and drop shadows use mask, which is why they\
    \ can be slow. Moreover, the combination of rounded corners and drop shadows is\
    \ extra slow.\n\n### WHAT ARE REFLOW AND REPAINT?\n\nReflow is the process of\
    \ calculating the position of elements in a Web page, whereas Repaint is the re-rendering\
    \ of pixel colors in a Web page. In CSS, display:none causes a reflow and also\
    \ a repaint because it is neither present nor visible in a Web page. On the other\
    \ hand, visibility:hidden is still present, which means no geometry change, and\
    \ hence only a repaint is required.\n\nThe painting process (browser combines\
    \ DOM and CSSOM, or CSS Object Model) involves “Skia” for rasterizing software\
    \ with Canvas-like APIs, and the output is a set of bitmaps. Next, the bitmaps\
    \ are sent to the GPU and the GPU composites them (calculates pixel values). Finally,\
    \ the GPU renders the output on screen. When you want to change the position of\
    \ an element, the transform property is more efficient because it’s handled directly\
    \ in the GPU, and no repaint is involved. On the other hand, a combination of\
    \ the ‘left’ and ‘top’ properties causes a reflow as well as a repaint.\n\n###\
    \ Causes of Relow and Repaint\n\nThe following effects result in a reflow and\
    \ repaint in Web pages:\n\n- scroll and hover\n- box-shadow and drop shadows\n\
    - floats and tables\n- opacity and gradients\n- border-radius\n- transparency\
    \ and transitions\n- changing the font size\n- leaf-side nodes: probably small\
    \ changes\n- top-side nodes: propagation can cause many changes\n- add/remove/update\
    \ the DOM\n\nEven “routine” operations that add, remove, or update elements in\
    \ the DOM will cause a reflow and repaint in a Web page. Thus, it’s probably impossible\
    \ to completely eliminate a reflow or repaint in a Web page: the point to keep\
    \ in mind is that you want to minimize the number of such events so that do not\
    \ adversely affect performance and the quality of user experience.\n\n### Chrome\
    \ and Layout Changes\n\nChrome “batches” layout changes asynchronously in order\
    \ to maximize rendering performance. The following style information causes synchronous\
    \ updates:\n\n- OffsetTop and offsetLeft\n- OffsetWidth and offsetHeight\n- ScrollTop\
    \ and clientTop\n- Left, width, and height\n- GetComputedStyle()\n\nThe goal is\
    \ to find and eliminate JavaScript code updates because any request for style\
    \ information about a node forces the browser to provide the most-to-date value.\
    \ In order to do so, the browser must apply all scheduled changes, flush the queue,\
    \ and perform reflow. For example, minimize this type of code in HTML pages:\n\
    \n`el.style.left = el.offsetLeft + \"10\";`\n\n### AUTOMATIC INVOCATION OF THE\
    \ GPU\n\nWhen a Web page contains CSS selectors (especially those that involve\
    \ transforms or animation effects), your browser determines when to invoke the\
    \ GPU. However, there is no guarantee that the GPU will always be invoked. Fortunately,\
    \ there are some techniques (sometimes called “no operation” or “hack”) to force\
    \ the invocation of the GPU. You can use translate3D(0,0,0) or translateZ(0),\
    \ as shown in the following selector:\n\n```css\n.my {\n  transform: translateZ(0);\n\
    }\n```\n\nThe following video by Paul Irish (a developer advocate at Google) discusses\
    \ these and other techniques in this thirty-minute video: http://paulirish.com/2011/dom-html5-css-performance/.\
    \ Is it possible that these “hacks” can be slower sometimes? Try this sample code\
    \ containing 4,000 <div> elements in your browser: http://dl.dropbox.com/u/17844821/zeug/test.html.\n\
    \n### The CSS Will-Change Property\n\nThe CSS will-change property ensures that\
    \ the GPU is invoked. This property is supported in Chrome 36+, Opera 24+, and\
    \ Firefox 36+. In addition, Safari is currently implementing will-change, and\
    \ support in Microsoft Edge is “under consideration.” More details regarding the\
    \ will-change property can be found here: http://www.sitepoint.com/introduction-css-will-change-property/\
    \ and https://dev.opera.com/articles/css-will-change-property/.\n\n### DYNAMICALLY\
    \ CREATING CONTENT WITH QUERY (OPTIONAL)\n\nThis section contains an example of\
    \ how to dynamically create <div> elements and specify matching CSS selectors\
    \ via the jQuery css() method. If you intend to read this section, please also\
    \ read the introductory jQuery section in Chapter 3 if you are unfamiliar with\
    \ jQuery. If you intend to skip this section, try launching the code in this section\
    \ in a browser to see the various effects (you might be surprised). The purpose\
    \ of this code sample is two-fold: a) how to create dynamic content via jQuery,\
    \ and b) how to create animation effects via CSS selectors that match the dynamically\
    \ created content. The code sample in this section will expose you to coding techniques\
    \ that you can apply to create other CSS3-based animation or graphics effects\
    \ for your Web pages.\n\nListing 4.8 displays a portion of the contents of ArchModEllipsesGrad2.html\
    \ that creates CSS3-based 3D animation effects with dynamically created <div>\
    \ elements. The complete code listing is available on the companion disc.\n\n\
    ***LISTING 4.8 ArchModEllipsesGrad2.html***\n\n```html\n<body>\n<div id=\"outer\"\
    > </div>\n<script>\n    var fillColor = \"rgb(255, 0, 0)\";\n    var basePointX\
    \ = 300, basePointY = 150;\n    var majorAxis = 120, minorAxis = 80;\n    var\
    \ currentX = 0, currentY = 0;\n    var deltaAngle = 3, maxAngle = 720;\n    var\
    \ Constant = 0.25, newNode;\n    var rVal = 0, gVal = 0, bVal = 0;\n    var stripCount\
    \ = 10;\n    var stripWidth = Math.floor(maxAngle/stripCount);\n</script>\n```\n\
    \n**ON THE CD**\n"
  mdcn: "\n\nCSS3 3D 图形与动画 • 71\n\n*浏览器必须能够使用在主机操作系统安装的显卡驱动程序，且特定机器上某个浏览器的 GPU 加速并不保证所有浏览器都支持。*\n\
    \n网页可以包含导致 HTML 元素位置变化的 CSS 选择器。浏览器通过两种重大的操作来处理位置变化，这些操作可能会对性能产生不利影响：重绘（repainting）和重流（reflow）。重绘涉及新像素值的计算（这些计算可以卸交给\
    \ GPU 处理），而重流涉及计算 HTML 元素的新位置。\n\n注意，某些基于 CSS 的效果（例如更改元素的透明度）如果元素位置没有变化，则需要重绘但不需要重流。\n\
    \nChrome 开发者工具（DevTools）提供了一个“启用绘制绘制闪烁（Enable paint flashing）”功能来查看重绘过程：当启用此功能时，重绘区域周围会出现绿色框。GPU\
    \ 通过执行所谓的“合成（compositing）”操作来处理像素值的计算，这涉及到一个或多个“合成层（composite layers）”的创建。这些层“混合在一起”以组合各种效果。你可以将合成层想象为一堆具有不同颜色像素的并行平面，并将合成过程想象为当平面叠加时每个像素最终颜色的计算。GPU\
    \ 在以下情况下会创建一个单独的合成层：3D 或透视 CSS 变换、`<video>` 或 `<canvas>` 元素、CSS 过滤器，以及提取到合成层的重叠元素（例如\
    \ z-index）。\n\n可以创建的合成层数量也有大小限制，因此可能会创建出耗尽 GPU 内存的动画效果。幸运的是，Chrome 开发者工具提供了“显示层边界（Show\
    \ layer border）”选项，它用橙色框显示每个合成层。\n\n需要记住的一点是，合成过程对于可以直接在 GPU 中执行的元素更改效率最高。具体而言，通过\
    \ transform、opacity 或 filter 对元素进行的更改可以由 GPU 直接处理。\n\nChrome 会开启硬件合成模式（如果支持且尚未“开启”）。Chrome\
    \ 会创建一个新的层和“背表面（backing surface）”，这是一种向其中绘制图的图形上下文（也称为纹理）。背表面被上传到 GPU，有时层会共享同一个“背表面”。当层满足以下条件时，Chrome\
    \ 会创建一个新的背表面：\n\n1. 使用 3D 或透视变换 CSS 属性\n2. 被使用加速视频解码的 `<video>` 元素使用\n3. 被带有 3D\
    \ 上下文或加速 2D 上下的 `<canvas>` 元素使用\n4. 其透明度使用 CSS 动画或使用动画变换\n5. 使用加速 CSS 过滤器\n6.\
    \ 具有作为合成层的后代\n7. 具有一个 z-index 较低的兄弟元素，且该元素具有合成层（即该层是在渲染在合成层之上的？）\n\n### 注意\n\n\
    ### CSS 掩码与性能\n\nCSS 掩码（CSS Mask）会产生一个新的离屏缓冲区（OSB）。接下来，GPU 首先写入到 OSB 而不是直接写入 VRAM（显存），之后将\
    \ OSB 内容复制到 VRAM。然而，移动设备上的 VRAM 相对有限且“容易被耗尽”，这会导致性能下降。请记住，CSS 圆角和投影阴影使用了掩码，这就是为什么它们可能很慢。此外，圆角和投影阴影的组合速度会更慢。\n\
    \n### 什么是重流和重绘？\n\n重流（Reflow）是计算网页中元素位置的过程，而重绘（Repaint）是重新渲染网页中的像素颜色。在 CSS 中，`display:none`\
    \ 会导致重流和重绘，因为它在网页中既不存在是可见的。相反，`visibility:hidden` 仍然存在，这意味着没有几何结构上的变化，因此只需要重绘。\n\
    \n绘制过程（浏览器合并 DOM 和 CSSOM，即 CSS 对象模型）涉及使用“Skia”通过类似 Canvas 的 API 对软件进行栅格化，输出是一组位图。接下来，将这些位图发送到\
    \ GPU，由 GPU 对它们进行合成（计算像素值）。最后，GPU 将输出渲染到屏幕上。当你想更改元素的位置时，`transform` 属性更有效，因为它直接由\
    \ GPU 处理，且不涉及重绘。另一方面，`left` 和 `top` 属性的组合会导致重流以及重绘。\n\n### 重流和重绘产生\n\n以下效果会导致网页中的重流和重绘：\n\
    \n- 滚动（scroll）和悬悬（hover）\n- 盒子阴影（box-shadow）和投影阴影\n- 浮动（floats）和表格（tables）\n-\
    \ 透明度（opacity）和渐变（gradients）\n- 圆角（border-radius）\n- 透明度（transparency）和过渡（transitions）\n\
