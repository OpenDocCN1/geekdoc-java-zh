    HTML5 Web page.


    Recall that you can guarantee that the GPU will be used on a device by


    using something such as translate3D(0,0,0), which is essentially a “no


    operation.” You can also replace 2D transforms by their corresponding 3D


    transforms. However, an indiscriminate use of 3D transforms can cause a page


    reflow or a page repaint, which has an adverse impact on performance.


    Good articles regarding CSS paint times are here:


