    \ 32px),\n  radial-gradient(blue 8px, transparent 68px);\nbackground-size: 120px\
    \ 120px, 4px 4px;\nbackground-position: 0 0;\n}\n```\n\nListing 6.3 contains two\
    \ similar CSS3 selectors for rendering the HTML5 <canvas> element defined in Listing\
