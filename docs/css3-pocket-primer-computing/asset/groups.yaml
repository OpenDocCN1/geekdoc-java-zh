    ### Article 与 Section：它们是如何使用的？


    HTML5 <article> 元素和 HTML5 <section> 元素的语义是复杂的，部分由于它们可以相互嵌套：一个 <article> 元素可以包含一个或多个
    <section> 元素，而每一个 <section> 元素都可以包含一个或多个 <article> 元素。虽然可以设计一种“黑科技”来消除给定 HTML5
    网站中这些元素逻辑关系的歧，但目前还没有标准的惯例。另一个因素是文档大纲算法（Document Outlining Algorithm）在创建 HTML 网站大纲时处理这两个
    HTML 元素的方式，该算法在此处描述：


    *http://coding.smashingmagazine.com/2011/08/16/html5-and-the-document-outlining-algorithm.*


    对于简单的 HTML5 网站，<article> 元素和 <section> 元素的行为将是合理的，但对于更复杂的 HTML5 网站，结果可能会产生意外（或不符合预期）。在
