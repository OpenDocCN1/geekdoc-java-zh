    The preceding link contains tabular information regarding CSS3 support


    in many different browsers, which makes the information in that website very


    valuable.


    Another highly useful tool that checks for CSS3 feature support is


    Enhance.js, which tests browsers to determine whether or not they can sup-


    port a set of essential CSS and JavaScript properties, and then delivers features


    to those browsers that satisfy the test. You can download Enhance.js here:


    *https://github.com/filamentgroup/EnhanceJS.*


    **QUICK OVERVIEW OF CSS3 FEATURES**


    CSS3 adopts a modularized approach involving multiple specifications for


    extending existing CSS2 functionality as well as supporting new functionality.


    The following link contains a list of all the completed specifications and drafts


    by the CSS WG (specifications and Working Groups are discussed in Chapter


    1), along with their current status:


    *https://www.w3.org/Style/CSS/current-work.en.html.*


    In brief, CSS3 enables you to create boxes with rounded corners and


    shadow effects; create rich graphics effects using linear and radial gradients;


    detect portrait and landscape mode; detect the type of mobile device using


    media query selectors; and produce multicolumn text rendering and format-


    ting.


    In addition, CSS3 enables you to define sophisticated node selection rules


    in selectors using pseudo-classes, first or last child (:ﬁ rst-child, :last-


    child, :ﬁ rst-of-type, and :last-of-type), and also pattern-matching


    tests for attributes of elements. Several sections in this chapter contain exam-


    ples of how to create such selection rules.


    **CSS3 PSEUDO CLASSES AND ATTRIBUTE SELECTION**


    This brief section contains examples of some pseudo-classes, followed by


    snippets that show you how to select elements based on the relative position


    of text strings in various attributes of those elements. Although this section


    focuses on the :nth-child() pseudo-class, you will become familiar with


    various other CSS3 pseudo-classes, and in the event that you need to use those


    pseudo-classes, a link is provided at the end of this section which contains


    more information and examples that illustrate how to use them.


    CSS3 supports an extensive and rich set of pseudo-classes, including


    nth-child(), along with some of its semantically related “variants,” such


    as nth-of-type(), nth-ﬁ rst-of-type(), nth-last-of-type(), and


    nth-last-child().'
- md: "\nIntroduction to CSS3 • 17\n\nCSS3 also supports Boolean selectors (which\
    \ are also pseudo-classes) such as empty, enabled, disabled, and checked, which\
    \ are very useful for Form-related HTML elements. One other pseudo-class is not(),\
    \ which returns a set of elements that do not match the selection criteria.\n\n\
    CSS3 uses the meta-characters ^, $, and * (followed by the = symbol) in order\
    \ to match an initial, terminal, or arbitrary position for a text string. If you\
    \ are familiar with the Unix utilities grep and sed, as well as the vi text editor,\
    \ then these meta-characters are very familiar to you.\n\n## CSS3 Pseudo-Classes\n\
    \nThe CSS3 :nth-child() pseudo-class is both powerful and useful, and it has the\
    \ following form:\n\n:nth-child(insert-a-keyword-or-linear-expression-here)\n\n\
    The following list provides various examples of using the nth-child() pseudo-class\
    \ in order to match various subsets of child elements of an HTML <div> element\
    \ (which can be substituted by other HTML elements as well):\n\n- div:nth-child(1):\
    \ matches the first child element\n- div:nth-child(2): matches the second child\
    \ element\n- div:nth-child(:even): matches the even child elements\n- div:nth-child(:odd):\
    \ matches the odd child elements\n\nThe interesting and powerful aspect of the\
    \ nth-child() pseudo-class is its support for linear expressions of the form an+b,\
    \ where a is a positive integer and b is a non-negative integer, as shown here\
    \ (using an HTML5 <div> element):\n\n- div:nth-child(3n): matches every third\
    \ child, starting from position 0\n- div:nth-child(3n+1): matches every third\
    \ child, starting from position 1\n- div:nth-child(3n+2): matches every third\
    \ child, starting from position 2\n\n## CSS3 Attribute Selection\n\nYou can specify\
    \ CSS3 selectors that select HTML elements as well as HTML elements based on the\
    \ value of an attribute of an HTML element using various regular expressions.\
    \ For example, the following selector selects <img> elements whose src attribute\
    \ starts with the text string Sandra, and then sets the width attribute and the\
    \ height attribute of the selected img elements to 100px:\n\n```css\nimg[src^=\"\
    Sandra\"] {\n  width: 100px; height: 100px;\n}\n```\n\nThe preceding CSS3 selector\
    \ is useful when you want to set different dimensions to images based on the name\
    \ of the images (such as Sandra, Shelly, Steve, and so forth).\n\nThe following\
    \ HTML <img> elements do not match the preceding selector:\n\n```html\n<img src=\"\
    3Sandra\" width=\"200\" height=\"200\" />\n<img src=\"Sandra4\" width=\"200\"\
    \ height=\"200\" />\n```\n\nThe following selector selects HTML <img> elements\
    \ whose src attribute ends with the text string jpeg, and then sets the width\
    \ attribute and the height attribute of the selected img elements to 150px:\n\n\
    ```css\nimg[src$=\"jpeg\"] {\n  width: 150px; height: 150px;\n}\n```\n\nThe preceding\
    \ CSS3 selector is useful when you want to set different dimensions to images\
    \ based on the type of the images (jpg, png, jpeg, and so forth).\n\nThe following\
    \ selector selects HTML img elements whose src attribute contains any occurrence\
    \ of the text string baby, and then sets the width attribute and the height attribute\
    \ of the selected HTML img elements to 200px:\n\n```css\nimg[src*=\"baby\"] {\n\
    \  width: 200px; height: 200px;\n}\n```\n\nThe preceding CSS3 selector is useful\
    \ when you want to set different dimensions to images based on the “classification”\
    \ of the images (mybaby, yourbaby, babygirl, babyboy, and so forth).\n\nIf you\
    \ want to learn more about patterns (and their descriptions) that you can use\
    \ in CSS3 selectors, an extensive list is available here:\n\n*http://www.w3.org/TR/css3-selectors.*\n\
    \n*CSS3 Level 4 selectors enable you to specify the parent of an HTML element.\
    \ An online tool for converting some CSS3 selector expressions to XPath is here:*\n\
    \n*http://css2xpath.appspot.com.*\n\nThis concludes part one of this chapter,\
    \ and the next section delves into CSS3 graphics-oriented effects, such as rounded\
    \ corners and shadow effects.\n\n## CSS3 SHADOW EFFECTS AND ROUNDED CORNERS\n\n\
    CSS3 shadow effects are useful for creating vivid visual effects. You can use\
    \ shadow effects for text as well as rectangular regions. CSS3 also enables you\
    \ to easily render rectangles with rounded corners, so you do not need JPG files\
    \ in order to create this effect.\n\n**NOTE**\n\nIntroduction to CSS3 • 19\n\n\
    ### Specifying Colors with RGB and HSL\n\nBefore we delve into the interesting\
    \ features of CSS3, you need to know how to represent colors. One method is to\
    \ use (R,G,B) triples, which represent the Red, Green, and Blue components of\
    \ a color. For instance, the triples (255,0,0), (255,255,0), and (0,0,255) represent\
    \ the colors Red, Yellow, and Blue. Other ways of specifying the color include:\
    \ the hexadecimal triples (FF,0,0) and (F,0,0); the decimal triple (100%,0,0);\
    \ or the string #F00. You can also use (R,G,B,A), where the fourth component specifies\
    \ the opacity, which is a decimal number from 0 (invisible) to 1 (opaque) inclusive.\n\
    \nHowever, there is also the HSL (Hue, Saturation, and Luminosity) representation\
    \ of colors, where the first component is an angle between 0 and 360 (0 degrees\
    \ is north), and the other two components are percentages between 0 and 100. For\
    \ instance, (0,100%,50%), (120,100%,50%), and (240,100%,50%) represent the colors\
    \ Red, Green, and Blue, respectively.\n\nIn addition, the HSLa color model supports\
    \ the alpha/transparency value, which is between 0 (fully transparent) and 1 (fully\
    \ opaque). The alpha value (in any color model) enables you to “see through” overlapping\
    \ elements when its value is less than 1, whereas a value of 1 prevents you from\
    \ seeing the portion of an element that is underneath other elements.\n\nThe code\
    \ samples in this book use (R,G,B) and (R,G,B,A) for representing colors, but\
    \ you can perform an Internet search to obtain more information regarding HSL.\n\
    \n## CSS3 and Text Shadow Effects\n\nA shadow effect for text can make a Web page\
    \ look more vivid and appealing, and many websites look better with shadow effects\
    \ that are not overwhelming for users (unless you specifically need to do so).\n\
    \nListing 2.1 displays the contents of the HTML5 page TextShadow1.html that illustrate\
    \ how to render text with a shadow effect, and Listing 2.2 displays the contents\
    \ of the CSS stylesheet TextShadow1.css that is referenced in Listing 2.1.\n\n\
    ***LISTING 2.1 TextShadow1.html***\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n<meta charset=\"utf-8\" />\n<title>CSS Text Shadow Example</title>\n\
    <link href=\"TextShadow1.css\" rel=\"stylesheet\" type=\"text/css\">\n</head>\n\
    <body>\n<div id=\"text1\">Line One Shadow Effect</div>\n<div id=\"text2\">Line\
    \ Two Shadow Effect</div>\n<div id=\"text3\">Line Three Vivid Effect</div>\n<div\
    \ id=\"text4\"></div>\n<div id=\"text5\"></div>\n<div id=\"text6\"></div>\n</body>\n\
    </html>\n```\n\nThe code in Listing 2.1 is straightforward: there is a reference\
    \ to the CSS stylesheet TextShadow1.css that contains two selectors. One selector\
    \ specifies how to render the HTML <div> element whose id attribute has value\
    \ text1, and the other selector matches the HTML <div> element whose id attribute\
    \ is text2. Although the CSS3 rotate() function is included in this example, we’ll\
    \ defer a more detailed discussion of this function until later in this chapter.\n\
    \n***LISTING 2.2 TextShadow1.css***\n\n```css\n#text1 {\n  font-size: 24pt;\n\
    \  text-shadow: 2px 4px 5px #00f;\n}\n#text2 {\n  font-size: 32pt;\n  text-shadow:\
    \ 0px 1px 6px #000,\n4px 5px 6px #f00;\n}\n/* note the multiple parts in the text-shadow\
    \ definition */\n#text3 {\n  font-size: 40pt;\n  text-shadow: 0px 1px 6px #fff,\n\
    \  2px 4px 4px #0ff,\n  4px 5px 6px #00f,\n  0px 0px 10px #444,\n  0px 0px 20px\
    \ #844,\n  0px 0px 30px #a44,\n  0px 0px 40px #f44;\n}\n#text4 {\n  position:\
    \ absolute;\n  top: 200px;\n  right: 200px;\n  font-size: 48pt;\n}\n```\n"
  mdcn: "\n\nCSS3 简介 • 17\n\nCSS3 还支持布尔选择器（也是伪类），例如空 empty、启用 enabled、禁用 disabled\
    \ 和已勾选 checked，这些对于与表单相关的 HTML 元素非常有用。另一个伪类是 `not()`，它返回一组不符合选择标准的元素集合。\n\nCSS3\
    \ 使用元字符 `^`、`$` 和 `*`（后跟 `=` 符号）来匹配文本字符串的起始、终止或任意位置。如果你熟悉 Unix 实用 `grep` 和 `sed`\
    \ 以及 `vi` 编辑器，那么这些元字符对你来说非常熟悉。\n\n## CSS3 伪类\n\nCSS3 `:nth-child()` 伪类既强大又实用，其格式如下：\n\
    \n`:nth-child(在此处插入关键字或线性表达式)`\n\n以下列表提供了使用 `nth-child()` 伪类的各种示例，用于匹配 HTML `<div>`\
    \ 元素（也可以替换为其他 HTML 元素）子元素的各种子集：\n\n- div:nth-child(1): 匹配第一个子元素\n- div:nth-child(2):\
    \ 匹配第二个子元素\n- div:nth-child(:even): 匹配偶数子元素\n- div:nth-child(:odd): 匹配奇数子元素\n\n\
    `nth-child()` 伪类有趣且强大的之处在于它支持 `an+b` 形式的线性表达式，其中 `a` 是正整数，`b` 是非负整数，如下所示（使用 HTML5\
    \ `<div>` 元素）：\n\n- div:nth-child(3n): 从位置 0 开始匹配每第三个子元素\n- div:nth-child(3n+1):\
    \ 从位置 1 开始匹配每第三个子元素\n- div:nth-child(3n+2): 从位置 2 开始匹配每第三个子元素\n\n## CSS3 属性选择\n\
    \n你可以使用各种正则表达式指定 CSS3 选择器来选择 HTML 元素，以及根据 HTML 元素属性的值选择 HTML 元素。例如，以下选择器选择了 `src`\
    \ 属性以文本字符串 `Sandra` 开头的 `<img>` 元素，然后并将所选 `img` 元素的宽度属性和高度属性设置为 `100px`：\n\n```css\n\
    img[src^=\"Sandra\"] {\n  width: 100px; height: 100px;\n}\n```\n\n上述 CSS3 选择器在你想要根据图像名称（如\
    \ Sandra、Shelly、Steve 等）为图像设置不同的尺寸时非常有用。\n\n以下 HTML `<img>` 元素不匹配上述选择器：\n\n```html\n\
    <img src=\"3Sandra\" width=\"200\" height=\"200\" />\n<img src=\"Sandra4\" width=\"\
    200\" height=\"200\" />\n```\n\n以下选择器选择了 `src` 属性以文本字符串 `jpeg` 结尾的 HTML `<img>`\
    \ 元素，并将所选 `img` 元素的宽度属性和高度属性设置为 `150px`：\n\n```css\nimg[src$=\"jpeg\"] {\n  width:\
    \ 150px; height: 150px;\n}\n```\n\n上述 CSS3 选择器在你想要根据图像类型（jpg、png、jpeg 等）为图像设置不同的尺寸时非常有用。\n\
    \n以下选择器选择了 `src` 属性包含文本字符串 `baby` 任何位置的 HTML `<img>` 元素，并将所选 HTML `img` 元素的宽度属性和高度属性设置为\
    \ `200px`：\n\n```css\nimg[src*=\"baby\"] {\n  width: 200px; height: 200px;\n}\n\
    ```\n\n上述 CSS3 选择器在你想要根据图像的“分类”（mybaby、yourbaby、babygirl、babyboy 等）为图像设置不同的尺寸时非常有用。\n\
    \n如果你想了解更多可以在 CSS3 选择器中使用的模式（及其描述），可以在此处查看详尽列表：\n\n*http://www.w3.org/TR/css3-selectors.*\n\
    \n*CSS3 Level 4 选择器允许你指定 HTML 元素的父元素。一个将某些 CSS3 选择器表达式转换为 XPath 的在线工具在此处：*\n\n\
    *http://css2xpath.appspot.com.*\n\n到此本章的第一部分结束结束，下一节将深入探讨面向图形的 CSS3 效果，例如圆角和阴影效果。\n\
    \n## CSS3 阴影效果和圆角\n\nCSS3 阴影效果对于创建生动的视觉效果非常有用。你可以将阴影效果应用于文本以及矩形区域。CSS3 还允许你轻松渲染带有圆角的矩形，因此你不需要\
    \ JPG 文件即可创建这种效果。\n\n**注意**\n\nCSS3 简介 • 19\n\n### 使用 RGB 和 HSL 指定颜色\n\n在我们深入研究\
