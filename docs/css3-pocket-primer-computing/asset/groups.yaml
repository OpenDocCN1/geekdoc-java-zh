    \ code snippet with the following SVG element:\n\n```html\n<g id=\"mytransform\"\
    \ transform=\"matrix(0.5, 0, 0, 0.5, 100, 0)\">\n  ...\n</g>\n```\n\nIncidentally,\
    \ the following sections are special cases of 3D transformations, including perspective.\
