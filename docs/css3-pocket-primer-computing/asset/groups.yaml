    ## 在移动端 Web 应用中调整资源大小


    检测屏幕尺寸至少有两种常用技术，这反过来与资源调整有关。第一种技术涉及使用 CSS3 媒体查询（Media Queries），为不同的屏幕宽度加载不同的 CSS
    样式。第二种技术是使用 JavaScript 为不同的屏幕尺寸设置不同的 CSS 属性。


    当你在移动端 Web 应用的 HTML5 Web 页面上放置资源（如 PNG 文件）时，你需要决定如何处理以下针对移动端 Web 应用的情况：


    - 1. 从竖屏切换到横屏（或反之亦然）

    - 2. 部署到具有不同屏幕尺寸的移动设备上

    - 3. 调整文本字符串和文本区域的大小

    - 4. 缩放非二进制图像（如 SVG）


    每当你创建一个包含包含 PNG 文件以及其他类型资源（如嵌入 SVG 文档或 HTML5 <canvas> 元素）的 HTML5 Web 页面时，都需要处理上述情况。


    在渲染文本字符串时，你如何确定正确的字体大小？即使你使用 `em` 作为测量单位，你也不知道特定设备的 DPI 分辨率。当然，你可以进行推测，并决定文本在手机上以
    `14em` 渲染，在平板电脑（或大手机）上以 `16em` 渲染，但具有不同 DPI 的屏幕日益多样，这意味着你无法保证你的选择在所有情况下都是正确的。


    对于嵌入 HTML5 Web 页面中的 SVG 文档，你可以使用以下代码段通过基于 CSS 的技术来自动调整 HTML5 Web 页面中 SVG 文档的内容：


    `<div style="background-size: contain">`


    关于该技术的详细描述请参阅此处：https://developer.mozilla.org/en-US/docs/Web/CSS/background-size。


    ## 确定移动端 Web 页面的内容布局


    是确定 Web 页面内容的一些设计考虑：


    - 为智能手机提供单列文本

    - 移除多余的链接和内容

    - 移除项目和侧边栏/页脚

    - 避免绝对尺寸

    - 将包装器宽度设置为百分比

    - 将段落设置为块级显示（display block）


    请记住，上述点是指南而非绝对规则。例如，某些智能手机在横屏模式下根据列宽可以容纳两列，许多平板电脑可以在竖屏模式下显示两列。有些人建议减少屏幕上所需的滚动量，但许多用户习惯了在移动设备上频繁滚动（尤其是智能手机）。当有疑问时，创建两个（或可能更多）布局并获取用户反馈，以确定哪种布局可能对广泛观众更有吸引力。如果你仍然无法决定哪种布局设计最符合你的需求，也许你可以从“A/B
    测试”中获益，描述如下：http://en.wikipedia.org/wiki/A/B_testing。


    ## HTML Web 页面的移动端设计


    为移动设备设计 HTML Web 页面有多种方法，包括“移动优先”、“仅限移动端”以及为移动应用使用独立域名。


    “移动优先”方法确保 HTML Web 页面可以在移动设备上正确渲染。然而，你需要考虑移动设备之间不同的屏幕尺寸，例如智能手机、“大手机”和平板电脑。这一细节在
    Android 移动设备上尤为明显（iOS 设备上较也如此）。


    “仅限移动端”方法仍然要求你考虑移动设备上不同的屏幕尺寸，但在这种情况下，你不需要与笔记本电脑或台式机的 HTML Web 页面竞争。请记住，这种方法远非易事：它可能涉及客户端（或服务器）模板、本地数据存储以及由
    BackboneJS 等工具包提供的高效视图-模型绑定。另一个需要考虑的点是你是否可以利用 NoSQL 数据存储，例如 MongoDB。


    第三种方法是为移动端和桌面 Web 页面使用独立的域名。如果你正在开发轻量级移动 Web 应用（即托管在服务器上并由各种设备访问的 Web 页面），这种方法具有多个优势。首先，这让你的移动网站更容易被发现。其次，你可以单独为移动
    URL 和桌面设备 URL 广告。第三，用户只需更改域名即可在“常规”网站和移动端网站之间切换。第四，检测移动用户的代码逻辑（然后将他们引导到独立域名）比修改
    CSS 样式表更简单。


    现在你已经对设计考虑因素有了了解，让我们来看表单的示例。


    ## 表单样化的高层视图


    在渲染文本字符串时，你如何确定正确的字体大小？即使你使用 `em` 作为测量单位，你也不知道特定设备的 DPI 分辨率。当然，你可以进行推测，并决定文本在手机上以
    `14em` 渲染，在平板电脑（或大手机）上以 `16em` 渲染，但具有不同 DPI 的屏幕日益多样，这意味着你无法保证你的选择在所有情况下都是正确的。


    对于嵌入 HTML5 Web 页面中的 SVG 文档，你可以使用以下代码段通过基于 CSS 的技术来自动调整 HTML5 Web 页面中 SVG 文档的内容：


    `<div style="background-size: contain">`


    ## 表单样化的特定技术


    除了上一节出的的技术外，你还可以使用这些：


    - 使用 CSS 为输入字段设置不同的样式

    - 为输入字段提供标签（labels）

    - 为输入字段指定键盘类型

    - 为输入字段提供默认值

    - 标识必填字段

    - 在用户输入后验证每个字段

    - 利用密码掩码

    - 使用缩放


    ## 使用 CSS 以不同的样式输入字段


    这涉及两个步骤。第一步是应用默认样式，然后应用你自己的样式规则。第二步是使用[type]属性选择器为输入字段应用不同样式。


    作为一个特定示例，你可以使用 `-webkit-appearance` 属性移除所有输入元素的默认样式，如下：


    `input, textarea, select { -webkit-appearance: none; }`


    接下来，根据输入字段类型指定你自己的 CSS 样式，概述如下：


    `input[type=checkbox] { /* 为复选框设置样式 */ }`

    `input[type=radio] { /* 为单选框设置样式 */ }`

    `input[type=textarea] { /* 为文本区域设置样式 */ }`


    ## 为输入字段指定键盘类型


    HTML5 输入元素的 type 属性引入了以下新属性：


    - 电子邮件地址：type=''email''

    - 网址：type=''url''

    - 电话号码：type=''tel''


    上述类型仅在移动浏览器上有效（在笔记本电脑或桌面浏览器中无反应）。以下示例展示了如何为输入字段指定不同的键盘：


    `<form id="form1" name="form1" method="post" action="">

    <label for="name">名称:</label><input name="name" id="name" type="text" />

    <label for="email">邮箱:</label><input name="email" id="email" type="email" />

    <label for="phone">电话:</label><input name="phone" id="phone" type="tel" />

    </form>`


