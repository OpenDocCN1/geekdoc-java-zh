    PREFACE

    xiv • CSS3 Primer


    ## WHAT IS THE PRIMARY VALUE POSITION FOR THIS BOOK?


    This book is primarily about CSS, along with some of the technologies that can
    be combined with it. In fact, there are several non-CSS chapters in this book,
    including one SVG chapter and one chapter that delves into HTML5 Canvas. In addition,
    several chapters contain optional sections that show you how to combine CSS and
    also jQuery. If you are unfamiliar with jQuery, you can read the Appendix that
    provides an introduction to it. Another Appendix contains an introduction to an
    assortment of topics, such as frameworks for CSS, SASS and LESS, Material Design,
    and CSSLint.


    ## WHAT IS THE FORMAT FOR THIS BOOK?


    The answer to this question is important because you want to determine how much
    of the material in this book will be useful and relevant to you. First, this book
    is not a reference guide of CSS syntax nor does it contain any “cheat sheets”
    (but you can probably find the latter online). Although the format bears a slight
    resemblance to a “cookbook” style, this book does not provide an extensive set
    of how-to code samples that solve many common tasks that you can probably find
    on Stack Overflow. Instead, the code samples in this book illustrate some core
    features of CSS and are supplemented with interesting effects that are possible
    in CSS. Even though you probably will not use all the examples in this book, you
    will learn about various coding techniques and perhaps will be able to take advantage
    of them in order to craft your own variations for Web pages.


    ## WHAT DO I NEED TO KNOW FOR THIS BOOK?


    The most important prerequisite is familiarity with HTML and basic CSS. In some
    cases (such as the examples in Chapter 6), familiarity with JavaScript is definitely
    necessary in order to understand the code samples. One way to get a better idea
    about this book is to glance through some of the code samples to get an idea of
    how much is familiar to you and how much is new for you. If you feel overwhelmed
    by too many concepts, it’s probably advisable to select a different book. On the
    other hand, if you feel that the material is new yet within your grasp, you can
    fill potential gaps by reading online tutorials. The decision process regarding
    the purchase of this book is important to you, and satisfied customers are important
    to the publisher and the author.


    ## THE TARGET AUDIENCE


    This book is intended to reach an international audience of readers with highly
    diverse backgrounds in various age groups. While many readers know how to read
    English, their native language is not English (which could be their second, third,
    or even fourth language). Consequently, this book uses standard English rather
    than colloquial expressions that might be confusing to those readers. As you know,
    many people learn by different types of imitation, which includes reading, writing,
    or hearing new material (yes, some basic videos are also available). This book
    takes these points into consideration in order to provide a comfortable and meaningful
    learning experience for the intended readers.


    ## GETTING THE MOST FROM THIS BOOK


    Some people learn well from prose, others learn well from sample code (and lots
    of it), which means that there’s no single style that can be used for everyone.
    Moreover, some people want to start by launching the HTML Web pages, see what
    they render, and then return to the code to delve into the details (and conversely,
    other people use the opposite approach). In order to provide meaningful content
    for both types of people, this book contains a mixture of code samples: some are
    short, some are long, and other code samples build from earlier code samples.
    The goal is to show (and not just tell) you a variety of visual effects that are
    possible, some of which you might not find anywhere else. You benefit from this
    approach because you can pick and choose the visual effects and the code that
    creates those visual effects.


    Preface • xv


    ## HOW WAS THE CODE FOR THIS BOOK TESTED?


    The code samples in this book have been tested in a Google Chrome browser (version
    v51) on a Macbook Pro with OS X 10.14. Unless otherwise noted, no special browser-specific
    features were used, which means that the code samples ought to work in Chrome
    on other platforms, and also in other modern browsers. Exceptions are due to limitations
    in the cross-platform availability of specific features of SVG itself. Although
    the code also works in several earlier versions of Chrome on a Macbook Pro, you
    need to test the code on your platform and browser (especially if you are using
    Internet Explorer).


    Another point to keep in mind is that all references to “Web Inspector” refer
    to the Web Inspector in Chrome, which differs from the Web Inspector in Safari.
    If you are using a different (but still modern) browser, you might need to check
    online for the sequence of keystrokes you need to launch the Web Inspector. Navigate
    to this link for additional information:


    http://benalman.com/projects/javascript-debug-console/

