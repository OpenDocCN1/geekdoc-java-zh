    The HTML5 <nav> tag supports navigation for a section of a document


    in a website. Other new tags include the HTML5 <dialog> tag for marking


    up conversations and the HTML5 <ﬁ gure> tag for associating a caption for


    videos or graphics (which is useful for search engines).


    The semantics of these tags are straightforward, yet there are some subtler


    aspects that you will learn as you gain experience with HTML5 websites.


    Semantic markup also includes WAI-ARIA (Web Accessibility Initiative –


    Accessible Rich Internet Applications). In brief, WAI-ARIA is a “bridging”


    technology that clarifies semantics of assistive technologies. The WAI-ARIA


