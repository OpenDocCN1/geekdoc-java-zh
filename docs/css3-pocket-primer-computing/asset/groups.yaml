    \n![](img/0a6af518702639b3a358cdd75f17af79_47_1.png)\n\n***FIGURE 2.6*** CSS3-based\
    \ scaling effect on JPG files.\n\n## Rotate Transforms\n\nThe CSS3 transform attribute\
    \ allows you to specify the rotate() func-tion in order to create scaling effects,\
    \ and its syntax looks like this:\n\n`rotate(someValue);`\n\nYou can replace someValue\
    \ with any number. When someValue is positive, the rotation is clockwise; when\
    \ someValue is negative, the rotation is counter-clockwise; and when someValue\
    \ is zero, there is no rotation effect. In all cases the initial position for\
    \ the rotation effect is the positive horizontal axis.\n\nThe HTML5 Web page Rotate1.html\
    \ and the CSS stylesheet Rotate1.css on the companion disc illustrate how to create\
    \ rotation effects, a sample of which is shown here:\n\n```css\nimg.imageL:hover\
    \ {\n  transform : scale(2) rotate(-45deg);\n}\n```\n\nThe img selector that specifies\
    \ a transition attribute creates an animation ef-fect during a one-second interval\
    \ using the ease timing function, as shown here:\n\n`transition: transform 1.0s\
    \ ease;`\n\n![](img/0a6af518702639b3a358cdd75f17af79_47_2.png) ![](img/0a6af518702639b3a358cdd75f17af79_47_3.png)\n\
    \n**ON THE CD**\n\n**32 • CSS3 Pocket Primer\n\nThe CSS3 transform attribute allows\
    \ you to specify the skew() function in order to create skewing effects, and its\
    \ syntax looks like this:\n\n`skew(xAngle, yAngle);`\n\nYou can replace xAngle\
    \ and yAngle with any number. When xAngle and yAngle are positive, the skew effect\
    \ is clockwise; when xAngle and yAngle are negative, the skew effect is counterclockwise;\
    \ and when xAngle and yAn-gle are zero, there is no skew effect. In all cases\
    \ the initial position for the skew effect is the positive horizontal axis.\n\n\
    The HTML5 Web page Skew1.html and the CSS stylesheet Skew1.css are on the companion\
    \ disc, and they illustrate how to create skew effects. The CSS stylesheet containing\
    \ the img selector specifies a transition attribute that creates an animation\
    \ effect during a one-second interval using the ease timing function, as shown\
    \ here:\n\n`transition: transform 1.0s ease;`\n\nThere are also the four selectors\
    \ img.skewed1, img.skewed2, img.skewed3, and img.skewed4, which create background\
    \ shadow effects with darker shades of red, yellow, green, and blue, respectively\
    \ (all of which you have seen in earlier code samples).\n\nThe selector img.skewed1:hover\
    \ specifies a transform attribute that per-forms a skew effect whenever users\
    \ hover over the first `<img>` element with their mouse, as shown here:\n\n`transform\
    \ : scale(2) skew(-10deg, -30deg);`\n\nThe other three CSS3 selectors also use\
    \ a combination of the CSS functions skew() and scale() to create distinct visual\
    \ effects. Notice that the fourth hover selector also sets the opacity property\
    \ to 0.5, which takes place in parallel with the other effects in this selector.\n\
    \nFigure 2.7 displays the result of matching the selectors in the CSS stylesheet\
    \ Skew1.css to the elements in the HTML page Skew1.html.\n\n![](img/0a6af518702639b3a358cdd75f17af79_48_0.png)\n\
    \n***FIGURE 2.7*** CSS3-based skew effects on PNG files.\n\nThe CSS3 transform\
    \ attribute allows you to specify the translate() function in order to create\
    \ an effect that involves a horizontal and/or vertical “shift” of an element,\
    \ and its syntax looks like this:\n\n`translate(xDirection, yDirection);`\n\n\
    ![](img/0a6af518702639b3a358cdd75f17af79_48_1.png) ![](img/0a6af518702639b3a358cdd75f17af79_48_2.png)\n\
    \n**ON THE CD**\n\nIntroduction to CSS3 • **33**\n\n![](img/0a6af518702639b3a358cdd75f17af79_49_0.png)\n\
    \nThe translation is relative to the origin, which is located in the upper-left\
    \ cor-ner of the screen. Thus, positive values for xDirection and yDirection produce\
    \ a shift toward the right and a shift downward, respectively, whereas negative\
    \ values for xDirection and yDirection produce a shift toward the left and a shift\
    \ upward; zero values for xDirection and yDirection do not cause any translation\
    \ effect.\n\nThe Web page Translate1.html and the CSS stylesheet Translate1.css\
    \ on the companion disc illustrate how to apply a translation effect to a PNG\
    \ file.\n\n```css\nimg.trans2:hover {\n  transform : scale(0.5) translate(-50px,\
    \ -50px);\n}\n```\n\nThe CSS stylesheet containing the img selector specifies\
    \ a transform effect during a one-second interval using the ease timing function,\
    \ as shown here:\n\n`transition: transform 1.0s ease;`\n\nThe four selectors img.trans1,\
    \ img.trans2, img.trans3, and img.trans4 create background shadow effects with\
    \ darker shades of red, yellow, green, and blue, respectively, just as you saw\
    \ in the previous section.\n\nThe selector img.trans1:hover specifies a transform\
    \ attribute that performs a scale effect and a translation effect whenever users\
    \ hover over the first `<img>` element with their mouse, as shown here:\n\n`transform\
    \ : scale(2) translate(10px, 20px);`\n\nFigure 2.8 displays the result of matching\
    \ the selectors in the CSS stylesheet Translate1.css to the elements in the HTML\
    \ page Translate1.html.\n\n![](img/0a6af518702639b3a358cdd75f17af79_49_1.png)\n\
    \n***FIGURE 2.8*** PNG files with scale and translate effects.\n\n## HOW TO MAKE\
    \ CSS SELECTORS EFFICIENT\n\nThe first part of this section compares two selectors\
    \ that look similar, yet they have different results. The second section discusses\
    \ the trade-offs between using translate() versus top/left.\n\nBrowsers read selectors\
    \ right-to-left: this is a “bottom up” approach, and the “key” selector is the\
    \ right-most part of a selector. Right-to-left is more efficient because the relationship\
    \ of element:parent is one-to-one, whereas the relationship of parent:child is\
    \ many-to-one.\n\nAs an illustration, consider the following CSS and HTML:\n\n\
    ```css\n#mylist a { ... }\n```\n\n<ul id=\"mylist\">\n  <li class=\"abc\">...</li>\n\
    \  <li class=\"abc\">...</li>\n  <li class=\"abc\">...</li>\n</ul>\n\nNow suppose\
    \ you have 100 `<a>` elements, and you want to select the three `<a>` elements\
    \ that have a class attribute whose value is abc. This CSS selector matches the\
    \ complete set of 100 `<a>` elements (which is not what you want):\n\n```css\n\
    #mylist a { ... }\n```\n\nOn the other hand, the following CSS selector matches\
    \ *only* the three desired elements:\n\n```css\n#mylist .abc { ... }\n```\n\n\
    ## The translate() Function versus Top/Left Properties\n\nThe factors in favor\
    \ of translate() include that a) translate() does not “touch” the DOM, and b)\
    \ translate() involves subpixels, which produces smoother effects (partly due\
    \ to blurring). On the other hand, favor the use of top/left/right/bottom instead\
    \ of translate() when an element has relative/absolute/fixed positioning in a\
    \ Web page.\n\nKeep in mind that both techniques techniques can yield different\
    \ results on different browsers. The following detailed articles (by Chris Coyier\
    \ and by Paul Irish) contain additional information:\n\n- http://css-tricks.com/tale-of-animation-performance/\n\
    - http://www.paulirish.com/2012/why-moving-elements-with-translate-is-better-than-posabs-topleft/\n"
