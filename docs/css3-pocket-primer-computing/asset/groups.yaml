    ![](img/0a6af518702639b3a358cdd75f17af79_178_0.png)


    things), and TweenMax is a superset of TweenLite with advanced features.


    TimelineLite is a sequencing tool, and TimelineMax is a superset of Time-


    lineLite. GSAP also supports easing functions and various plugins are avail-


    able. More samples are here: *http://greensock.com/examples-showcases.*


    Some eye-candy code samples that combine SVG, GSAP, and ReactJS are


    here: *https://github.com/ocampesato/react-svg-gsapi.*


    PostCSS is a very small toolkit that contains only a CSS parser, a CSS node


    tree API, a source map generator, and a node tree stringifier. All of the style


    transformations are performed by plugins, which are plain JS functions. Each


    plugin receives a CSS node tree, transforms it, and then returns the modified


    tree.


    PostCSS works with the same principles of preprocessors such as Sass and


    LESS: *http://www.smashingmagazine.com/2015/12/introduction-to-postcss/.*


    You can use the [cssnext] plugin pack and write future CSS code right now:


