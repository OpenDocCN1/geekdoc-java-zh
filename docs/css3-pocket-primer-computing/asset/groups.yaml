    **170**  • CSS3 Pocket Primer


    ![](img/0a6af518702639b3a358cdd75f17af79_186_0.png)


    The following list contains some high-level techniques for rendering mo-


    bile forms:


    • Using semantic markup


    • Using a single column to display input fields (for smart phones)


    • Deciding on label alignment (left or top)


    • Grouping/chunking input fields


    • Tooltips or information bubbles


    • Displaying error messages


    • Appropriate field width


    • Suitable color scheme


    • Tabs instead of radio buttons


    • Handling long drop-down lists (use predictive search or links)


    • Primary and secondary buttons


    • Spacing between input elements


    • Pop-up menu controls


    • Voice input


    Notice that there is no “reduce scrolling” in the previous list: users are accus-


    tomed to scrolling on smart phones and tablets. In addition, a single-column


    display was more important for smaller smart phones, but some smart phones


    can display two columns in landscape mode, and tablets are even more accom-


    modating in terms of multiple columns of text.


    If you render text in a left-to-right direction, then left-aligned labels en-


    able you to place more input fields in a screen, and they are also easier to scan


    during field input, but they don’t work well with long input fields. Top-aligned


    labels have the opposite advantages and disadvantages of left-aligned labels.


    Yet another technique is to use inline labeling, which essentially means that


    the “text prompt” for the input field provides a suggestion for the type of data


    that is expected.


    **SPECIFIC TECHNIQUES FOR STYLING MOBILE FORMS**


    In addition to the design techniques that are listed in the previous section,


    you can use some or all of these specific techniques:


    • Use CSS to style input fields differently


    • Provide labels for input fields


    • Specify keyboard types for input fields


    • Provide default or suggested values for input fields


    • Use constraints for numeric fields


    • Indicate required fields


    • Validate each field after user input


    • Utilize password masking


    • Employ field zoom'
