    **THE HTML5** **CANVAS** **COORDINATE SYSTEM**


    Think back to your days in high school, where you learned that the Carte-


    sian coordinate system identifies any point in the Euclidean plane by means


    of a pair of numbers, often written as (x,y). The first number represents the


    horizontal value and the second number represents the vertical value. The


    horizontal axis is labeled the x-axis, and positive values on the x-axis are to
    the


    right of the vertical axis (i.e., toward the right). The vertical axis is labeled
    the


    y-axis, and positive values on the y-axis are above the horizontal axis. The origin


    is the intersection point of the x-axis and the y-axis.


    The situation is almost the same in the HTML5 Canvas coordinate system.


    The x-axis is horizontal and the positive direction is toward the right. The y-axis


    is vertical, but the positive direction is *downward*, which is the opposite direc-


    tion of most graphs in a typical mathematics textbook. In the HTML5 Canvas


    coordinate system, the origin is the upper-left corner of the screen (not the


    lower-left corner), and the unit of measurement is the pixel.


    As a simple illustration, Figure 6.1 displays four points in an HTML5


    <canvas> element.


    ![](img/0a6af518702639b3a358cdd75f17af79_115_1.png)


    ***FIGURE 6.1*** Four points rendered in HTML5 Canvas.


    If you start from the origin (the upper-left corner of the screen) and move


    50 pixels to the right, followed by 50 pixels downward, you will reach the up-


    per-left point in Figure 6.1\. Next, if you start from the origin and move 200


    pixels to the right and 50 pixels downward, you will reach the upper-right point


    in Listing 6.1\. In a similar fashion, the two points in the second “row” have


    coordinates (50,100) and (200,100). Notice that the two points in the first


    row have the same value for the y-coordinate, which makes sense because they


    are the same distance away from the top of the Web page; the same is true for


    the two points in the second row. Similarly, the two points in the left “column”


    have the same x-coordinate because they are both the same distance from the


    left side of the Web page.


    Now that you have an understanding of the HTML5 Canvas coordinate


    system, let’s take a look at the contents of Listing 6.1, which displays a minimal


    HTML5 Web page that is ready for rendering HTML5 Canvas-based graphics.'
