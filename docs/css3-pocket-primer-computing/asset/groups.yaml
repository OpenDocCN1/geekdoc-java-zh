    This section contains an assortment of CSS3 Media Queries, which are very


    useful logical expressions that enable you detect mobile applications on de-


    vices with differing physical attributes and orientation. For example, with


    CSS3 Media Queries you can change the dimensions and layout of your ap-


    plications so that they render appropriately on smartphones as well as tablets.


    Specifically, you can use CSS3 Media Queries in order to determine the


    following characteristics of a device:


    • Browser window width and height


    • Device width and height


    • Orientation (landscape or portrait)


    • Aspect ratio


    • Device aspect ratio


    • Resolution


    CSS3 Media Queries are Boolean expressions that contain one or more “sim-


    ple terms” (connected with and or or) that evaluate to true or false. Thus,


    CSS3 Media Queries represent conditional logic that evaluates to either true


    or false.


    As an example, the following link element loads the CSS stylesheet


    mystuff.css only if the device is a screen and the maximum width of the


    device is 480px:


    <link rel="stylesheet" type="text/css"


    media="screen and (max-device-width: 480px)"


    href="mystuff.css"/>


    The preceding link contains a media attribute that specifies two components:


    a media type of screen and a query that specifies a max-device-width


    whose value is 480px. The supported values for media in CSS3 Media Que-


    ries are braille, embossed, handheld, print, projection, screen,


    speech, tty, and tv.


    The next CSS3 Media Query checks the media type, the maximum device


    width, and the resolution of a device:


    @media screen and (max-device-width: 480px) and


    (resolution: 160dpi) {


    #innerDiv {


    ﬂ oat: none;


    }


    }'
