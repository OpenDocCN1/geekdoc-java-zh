    <script src="http://code.jquery.com/jquery-2.0.0b1.js"></script>

    <script src="http://code.jquery.com/jquery-migrate-1.1.0.js"></script>

    </head>


    <body>


    <script>

    $(document).ready(function() {

    var render = false; // true/false = draw/no draw

    var shape="", width="8px", height="8px", color="#ff0000";

    $(document).mousedown(function() { render = true; });

    $(document).mouseup(function() { render = false; });

    $(document).mousemove(function(e) {

    if(render == true) {

    // create a rectangle at the mouse position

    shape = $(''<span>'').css({''position'':''absolute'',

    ''background-color'':color,

    ''width'':width,

    ''height'':height,

    top: e.pageY,

    // offsets

    left: e.pageX

    // offsets

    });

    // append rectangle to <body> element

    $(document.body).append(shape);

    }

    });

    });


    </script>


    </body>


    </html>


    Listing 3.14 contains a <script> element that defines a JavaScript function for
    handling mousedown and mouseup events by toggling the value of the JavaScript
    variable render. The next portion of Listing 3.14 defines the JavaScript function
    mousemove that creates a new <span> element and then appends that <span> element
    to the <body> element if render is true, thereby creating a “follow the mouse”
    effect.


