    Media Queries and Meta Tags • 95


    ## CSS Modules and Local CSS


    CSS Modules provides another approach (unrelated to ReactJS) for local CSS via
    the local-style property. The CSS Modules team provides a namespace-like solution
    (a previous section describes namespaces), along with separate compilation of
    different files, in order to provide CSS selectors that are not in the global
    namespace, and its home page is here: *https://github.com/css-modules*.


    The following articles describe CSS Modules in greater depth: http://glen-maddern.com/articles/css-modules
    and *http://www.sitepoint.com/understanding-css-modules-methodology*.


    ## Web Components and Local CSS


    A third approach (also unrelated to ReactJS) is the Shadow DOM that enforces local
    CSS in different components, which is available in Web Components and Polymer
    (but not supported in all modern browsers yet).


    In Chapter 9, you will learn about Web Components, which enable you to define
    custom components that contain CSS selectors that are only visible inside the
    custom component, thereby also providing support for local CSS.


    ## USEFUL LINKS


    The following list of links is short yet useful, and each link contains very good
    information (and you can always perform your own Internet search as well).


    - The following link contains useful CSS snippets: *http://www.hongkiat.com/blog/css-snippets-for-designers*.

    - Keep in mind that many of the named snippets (such as box-shadow, text-shadow,
    border-radius, and opacity) no longer require prefixes, so you can update them
    accordingly.

    - A nice set of “sketch-like” visual effects that use CSS3 is here: *http://andrew-hoyer.com/index.html*.

    - Compatibility tables for support of HTML5, CSS3, SVG and more in desktop and
    mobile browsers is here: *http://caniuse.com*.

    - A website for generating CSS3 code using various CSS3 features is here: *http://CSS3generator.com*.

    - A website that enables you to perform live editing of the contents of various
    CSS3 selectors and then see the results is here: *http://CSS3please.com*.

    - A toolkit that handles the details of browser-specific extensions for CSS3 properties
    so that you can write prefix-less CSS3 selectors is here: *http://css-tender.org*.

    - A website that enables you to create gradients online and view the associated
    CSS3 code is here: *http://gradients.glrzad.com*.

    - Another website with information regarding browser support for HTML5 and CSS3
    features is here: *http://html5readiness.com*.

    - An extensive collection of articles regarding HTML5 is available here: *http://www.html5rocks.com/en/*.

    - A website devoted to all things pertaining to CSS3 is here: *http://www.CSS3.info*.

    - An excellent source for browser compatibility information on the Internet (maintained
    by Peter-Paul Koch) can be found at: *http://www.quirksmode.org*.

    - A very good online tool that allows you to experiment with many CSS3 features
    and also display the associated CSS3 code is available here: *http://www.westciv.com/tools/3Dtransforms/index.html*.

    - The following is a website that briefly discusses fourteen CSS generators: *http://www.webpop.com/blog/2013/04/23/css-generators*.

    - A comparison of fifteen cross-browser testing tools (most are free, and some
    are commercial) with a tabular comparison of features is here: *http://www.smashingmagazine.com/2011/08/07/a-dozen-cross-browser-testing-tools/*.


    These links provide a wealth of information and useful techniques, so there’s
    a very good chance that you can find the information that you need to create the
    visual effects that you want for your website.


    ## ADDITIONAL CODE SAMPLES


    The CSS stylesheet CSS3MediaQuery1.css and the HTML5 Web page CSS3MediaQuery1.html
    (both are on the companion disc) illustrate how to use Media Queries in order
    to change the size of two images when users rotate their mobile device.


    You can detect a change of orientation of a mobile device using simple JavaScript
    code, so you are not “forced” to use CSS3 Media Queries. The HTML5 Web page CSS3OrientationJS1.html
    on the companion disc illustrates how to use standard JavaScript in order to change
    the size of two images when users rotate their mobile device.


    In essence, the code uses the value of the variable `window.orientation` in order
    to detect different orientations of your mobile device, and in each of those cases,
    the dimensions of the PNG files are updated with the following type of code:


    ```javascript

    document.getElementById("img1").style.width = "120px";

    document.getElementById("img1").style.height = "300px";

    ```


    Although this is a very simple example, hopefully this code gives you appreciation
    for the capabilities of CSS3 Media Queries.


    ## SUMMARY


    This chapter showed you how to use meta tags in HTML5 Web pages. You saw how to
    use media queries in CSS using `@media` directives to conditionally style various
    HTML elements. You also learned to use CSS3 Media Queries to detect orientation
    change of a mobile device based on different screen resolutions, some of which
    are specific to Android and iOS devices.


    ## CHAPTER 6 CSS3 AND HTML5 CANVAS


    This chapter provides an overview of combining CSS3 with HTML5 Canvas, which is
    a technology for drawing graphics directly to a Web page. HTML5 Canvas supports
    various APIs for rendering 2D shapes and creating animation effects. In addition,
    you will see how to style `<canvas>` elements with CSS3-based animation effects.


    You might be wondering why this chapter has been included in this book. If you
    want to learn about HTML Canvas and the associated JavaScript code, then this
    chapter will give you a reasonable introduction. There is a second factor for
    including this chapter: despite the numerous Canvas-related and CSS3-related tutorials,
    very few of them combine HTML5 Canvas and CSS3 graphics.


    The first part of this chapter shows you how to render line segments, rectangles,
    and circles in HTML5 Canvas, and also how to combine HTML5 Canvas with CSS stylesheets.
    The second part introduces you to linear and radial gradients in HTML5 Canvas,
    with examples of how to apply them to Bezier curves. The third part of this chapter
    contains some examples of rendering PNG files in an HTML Canvas element.


    One important caveat: unlike the other chapters in this book, this chapter requires
    some knowledge of JavaScript, such as how to define variables and functions. In
    addition, the code samples contain `document.getElementById()` for finding elements
    in an HTML Web page, `window.addEventListener()` for adding an event listener
    to a Web page, and code for defining click handlers for HTML `<input>` elements.
    Admittedly, the details of these methods are not discussed in this chapter. Glance
    through the code samples to get an idea of the type of JavaScript code that they
    contain, and then you can assess whether or not you feel confident to read the
    examples in greater detail. Another suggestion: launch the code samples in this
    chapter to see which graphics effects interest you, and then you can read the
    associated code in this chapter.


    As you will see, some of the code samples in this chapter contain (sometimes striking)
    combinations of HTML5 Canvas, CSS3 graphics, and CSS3 2D/3D animation effects
    that you are unlikely to find in any online resources or topic-related books.
    These code samples provide a starting point for you to create your own visually
    compelling graphics effects.


    In addition, most of the sections in this chapter start with the syntax of the
    APIs that are used in the associated code listings, partly because the code samples
    contain a lot of details and also illustrate multiple concepts. If you want to
    explore additional HTML5 Canvas graphics after you have finished reading this
    chapter, an extensive set of code samples is available here: *https://github.com/ocampato/html5-graphics*.


    Keep in mind that it’s important to assess the trade-off (time, effort, and cost)
    between writing low-level Canvas-based graphics code, such as the code samples
    in this chapter, versus the availability of open source projects and commercial
    products. If you prefer not to delve into all the JavaScript details for creating
    HTML5 Canvas effects, there are online drawing tools that can generate the code
    for you. One free tool that provides some basic functionality is here: *http://www.htmlcanvasstudio.com/*.


    ## WHAT IS HTML5 CANVAS?


    Several years ago Canvas began in OS/X as a widget toolkit, and after Canvas had
    already been available in the Safari browser, it became a specification for the
    Web, and now it’s commonly referred to as HTML5 Canvas. HTML5 Canvas and SVG both
    allow you to programmatically render graphics in a browser via JavaScript. However,
    HTML5 Canvas uses “immediate mode,” which is a write-and-forget approach to rendering
    graphics. Thus, if you want to write a sketching program in HTML5 Canvas and you
    also want to provide an “undo” feature, you must programmatically keep track of
    everything that have drawn on the screen. On the other hand, SVG uses a “retained
    mode,” which involves a DOM structure that keeps track of the rendered objects
    and their relationship to one another.


    If you are going to write HTML Web pages that make extensive use of graphics effects,
    you’ll probably need to understand the differences between HTML5 Canvas and SVG
    in terms of performance. You have the freedom to use one technology exclusively,
    but you can also create HTML Web pages that contain a mixture of HTML5 Canvas,
    SVG, and CSS3, and performance-related information can help you decide how you
    are going to code your HTML Web pages.


    Although this chapter does not delve into the preceding points in any more detail,
    you can find a good overview of some features/advantages of HTML5 Canvas here:
    *http://thinkvitamin.com/code/how-to-draw-with-html-5-canvas/*..

