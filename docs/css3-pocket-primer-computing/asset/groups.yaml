    ## HTML5 验证器


    HTML5 验证器允许你测试 HTML5 网站和移动应用程序。提供许多类型的 Web 应用验证器，包括：


    - HTML 验证器：测试你的 HTML 有效性

    - 可访问性验证器：测试网站以确定它们被屏幕阅读器读取的程度

    - 代码验证器（又称 lint）：检查你的脚本、CSS 和 API 用的准确性

    - 移动端验证器：为改进移动设备的页面提供建议。它们通常也兼具模拟器的作用。


    除了上述列表外，还有其他工具可以评估你网站的“友好性”，例如：


    - 位于 http://validator.w3.org/mobile 的 W3C mobileOK Checker

    - 位于 http://ready.mobi/ 的 MobiReady


    W3C mobileOK Checker 和 MobiReady 都会检查在互联网上运行的页面，然后为你提供一份关于它们在移动设备上性能的报告。


    ## WAI-ARIA


    WAI-ARIA（Web Accessibility Initiative – Accessible Rich Internet Applications）是一项
    W3C 规范，规定了如何增加网站（包括动态内容）以及使用 AJAX、HTML、JavaScript 和相关技术开发的用户界面组件的可访问性。


    WAI-ARIA 规范定义了对可访问 Web 应用的支持，这涉及标记扩展，这些扩展通常是 HTML5 元素的属性。Web 开发人员可以使用这些标记扩展来获取有关屏幕阅读器和其他辅助技术的信息。


    作为一个简单的例子，考虑以下来自 ARIA 规范的增强型 HTML `<li>` 元素的代码片段，它说明了 `role` 和 `aria-checked`
    属性的使用：


    <li role="menuitemcheckbox" aria-checked="true">

    <img src="checked.gif" role="presentation" alt="">

    <!-- 注意：切换图像源需要额外的脚本 -->

    </li>


    上述代码片段中的两个新属性对浏览器渲染 `<li>` 元素的方式没有影响。支持 ARIA 的浏览器将把特定于操作系统的可访问性信息添加到渲染的 `<li>`
    元素中，并使屏幕阅读器能够以上下文的方式读出信息。


    你可以在此处获取更多关于 WAI-ARIA 规范的信息：http://www.w3.org/TR/wai-aria/ 和 http://www.techrepublic.com/blog/webmaster/a-checklist-for-web-accessibility-issues/2626。


    ## HTML5 以及各种工作组


    W3C（世界维网联盟）、WHATWG（Web 超文本应用技术工作组）和 DAP（设备 API 工作组）是为本书中涵盖的 HTML5 和移动设备提供规范和 API
    的组织。此外，IETF（互联网工程任务组）处理网络标准（如 WebSockets、SPDY、CORS 等），但不处理实际的 API，其主页位于：https://www.ietf.org/。


    W3C 是一个由各种成员公司和组织组成的国际社区，共同开发 Web 标准。W3C 由 Web 发明者 Tim Berners-Lee 和首席执行官 Jaffe
    指导，其主页位于：http://www.w3.org/。


    提交给 W3C 的每个提案都要经过以下序列才能成为 W3C 推荐：


    - 工作草案 (WD)

    - 候选推荐 (CR)

    - 建议推荐 (PR)

    - W3C 推荐 (REC)

    - 后期修订


    本质上，WHATWG 拥有主规范，W3C 与其同步工作，主要是为了重新格式化以匹配其出版风格（包括将其拆分为子规范）。WHATWG 规范引言中更改的准确列表位于：http://www.whatwg.org/specs/web-apps/current-work/multipage/introduction.html。接下来的链接提供了
    HTML5 API 列表及其最新的状态更新：http://www.w3.org/TR/。


    ## 总结


    本章向你介绍了 HTML5 以及与其相关的一些技术。接下，你学习了 HTML5 和 HTML4 之间的某些差异、一些实用的工具（如 Modernizr）以及特性检测。然后，你看到了一个简单的
    HTML5 Web 页面示例，这引发了对新 HTML 元素和语义标记的讨论。最后，你学习了关于 WAI-ARIA、W3C 和 WHATWG 的知识。


    ## 第 2 章 CSS3 简介


    本章介绍了 CSS3 的各个方面，例如 2D 变换、图形和动画。因此，你需要对 CSS2 有合理的掌握（即：如何定义 CSS 选择器、在 HTML 中选择元素的规则等）。如果你不熟悉
    CSS 选择器，可以通过互联网搜索找到许多介绍性文章，之后你将对 CSS 的底层逻辑有更好的理解。


    本章的第一部分从对各种 CSS3 特性的简要概述，例如伪选择器、伪类和属性选择。本章的第二部分包含了代码示例，说明了如何创建阴影效果、如何渲染圆角矩形，以及如何使用线性和径向渐变。本章的第三部分涵盖了
    CSS3 变换（缩放、旋转、倾斜和平移），以及说明如何将变换应用于 HTML 元素的代码示例。本章的最后部分涵盖了浏览器对 CSS3 的支持，并简讨论了 CSS
    特性的浏览器特定前缀的目的。你可以在桌面或笔记本电脑上的任何浏览器中启动本章的代码示例；你也可以在移动设备上查看它们，只要在支持代码示例中所用 CSS3 特性的浏览器中启动即可。


    ### CSS3 浏览器支持


    在我们深入研究 CSS3 细节之前，关于用于 HTML 的 CSS3 选择器的定义，有两个重要的细节需要了解。首先，你需要了解不同浏览器中可用的 CSS3
    特性。确定浏览器对 CSS3 特性支持的最佳网站之一位于：http://caniuse.com/。


    上述链接包含了许多不同浏览器 CSS3 支持情况的表格信息，这使得该网站的信息非常有价值。


    另一个检查 CSS3 特性支持的高度实用的工具是 Enhance.js，它测试浏览器以确定它们是否支持一组基本的 CSS 和 JavaScript 属性，然后向满足测试的浏览器提供这些功能。你可以在此处下载
    Enhance.js：https://github.com/filamentgroup/EnhanceJS。


    ### CSS3 特性快速概览


    CSS3 采用模块化方法，涉及多个用于扩展现有 CSS2 功能以及支持新功能的规范。接下来的链接包含了由 CSS WG（规范和工作组在第 1 章中讨论）的所有已完成规范和草案列表，以及它们的当前状态：https://www.w3.org/Style/CSS/current-work.en.html。


    总之，CSS3 允许你创建带有圆角阴影效果的框；使用线性和径向渐变创建丰富的图形效果；检测竖屏和横屏模式；使用媒体查询选择器检测移动设备类型；以及产生多列文本渲染和格式化。


    此外，CSS3 允许你使用伪类、第一个或最后一个元素（:first-child, :last-child, :first-of-type 和 :last-of-type）以及属性模式匹配测试在选择器中定义复杂的节点选择规则。本章的几个章节包含了此类选择规则的示例。


    ### CSS3 伪类和属性选择


    这个简短章节包含了一些伪类的示例，随后是展示你如何根据元素各种属性中文本字符串的相对位置来选择元素。虽然本节关注 `:nth-child()` 伪类，但你将熟悉各种其他
    CSS3 伪类，如果你需要使用那些伪类，在本节末尾提供了一个链接，包含更多信息和说明如何使用它们的示例。


    CSS3 支持广泛且丰富的伪类集，包括 `nth-child()`，以及一些与其语义相关的“变体”，如 `nth-of-type()`、`nth-first-of-type()`、`nth-last-of-type()`
    和 `nth-last-child()`。


    '
