    ## SVG <POLYGON> AND <POLYLINE> ELEMENTS


    The SVG <polygon> element contains a polygon attribute in which you can specify
    points that represent the vertices of a polygon. The SVG <polygon> element is
    most useful when you want to create polygons with an arbitrary number of sides,
    but you can also use this element to render line segments and rectangles.


    The syntax of the SVG <polygon> element looks like this:

    `<polygon path="specify a list of points" fill="…" />`


    Listing 7.4 displays the contents of a portion of SvgCube1.svg that illustrates
    how to render a cube in SVG.


    ***

    LISTING 7.4 SvgCube1.svg***


    ```xml

    <?xml version="1.0" encoding="iso-8859-1"?>

    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20001102//EN"

    "http://www.w3.org/TR/2000/CR-SVG-20001102/DTD/svg-20001102.dtd">

    <svg xmlns="http://www.w3.org/2000/svg"

    xmlns:xlink="http://www.w3.org/1999/xlink"

    width="100%" height="100%">

    <!-- <defs> element omitted for brevity -->

    <!-- top face (counter clockwise) -->

    <polygon fill="url(#pattern1)"

    points="50,50 200,50 240,30 90,30"/>

    <!-- front face -->

    <rect width="150" height="150" x="50" y="50"

    fill="url(#pattern2)"/>

    <!-- right face (counter clockwise) -->

    <polygon fill="url(#pattern3)"

    points="200,50 200,200 240,180 240,30"/>

    </svg>

    ```


    **128 • CSS3 Pocket Primer**


    ![image 144_0]


    Listing 7.4 contains an SVG <g> element that contains the three faces of a cube,
    in which an <polygon> element renders the top face (which is a parallelogram),
    an <rect> element renders the front face, and another <polygon> element renders
    the right face (which is also a parallelogram). The three faces of the cube are
    rendered with the linear gradient and the radial gradients defined in the SVG
    <defs> element (not shown in Listing 7.4).


    Figure 7.4 displays the result of rendering the SVG SvgCube1.svg. The SVG <polyline>
    element specifies a set of points that represent the endpoints of one or more
    line segments that are displayed as a connected line. The syntax of the SVG <polyline>
    element is very similar to the SVG <polygon> element, as in the following example:

    `<polyline points="50,50 200,50 200,200" fill="url(#pattern2)"/>`


    The preceding code snippet renders the same “front face” <rect> element in Listing
    7.4. The companion Polyline.svg renders the same cube as the code in Listing 7.4.
    Polyline.svg uses three <polyline> elements, whereas SvgCube1.svg uses two <polygon>
    elements and one <rect> element to render a cube.


    ## SVG <PATH> ELEMENT


    The SVG <path> element enables you to define elliptic arcs (using the d attribute)
    and then specify gradient effects. The SVG <path> element contains a d attribute
    for specifying path elements, as shown here:

    `<path d="specify a list of path elements" fill="..." />`


    Listing 7.5 displays the contents of PathElement.svg, which illustrates how to
    use the <path> element in order to render elliptic arcs.


    ***

    LISTING 7.5 PathElement.svg***


    ```xml

    <?xml version="1.0" encoding="iso-8859-1"?>

    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20001102//EN">

    <svg xmlns="http://www.w3.org/2000/svg"

    xmlns:xlink="http://www.w3.org/1999/xlink"

    width="100%" height="100%">

    <defs>

    <linearGradient id="pattern1"

    x1="0%" y1="100%" x2="100%" y2="0%">

    <stop offset="0%" stop-color="yellow"/>

    <stop offset="40%" stop-color="red"/>

    <stop offset="80%" stop-color="blue"/>

    </linearGradient>

    </defs>

    <g>

    <path d="M 505,145 v -100 a 250,100 0 0,1 -200,100"

    fill="black"/>

    <path d="M 500,140 v -100 a 250,100 0 0,1 -200,100"

    fill="url(#pattern1)"

    stroke="black" stroke-thickness="8"/>

    <path d="M 305,165 v 100 a 250,100 0 0,1 200,-100"

    fill="black"/>

    <path d="M 300,160 v 100 a 250,100 0 0,1 200,-100"

    fill="url(#pattern1)"

    stroke="black" stroke-thickness="8"/>

    </g>

    </svg>

    ```


    Listing 7.5 contains an SVG <defs> element that defines a linear gradient, followed
    by an SVG <g> element that contains four <path> elements. Each <path> element
    displays an elliptic arc and references the linear gradient for the value of the
    fill attribute.


    The first <path> element specifies a black background for the elliptic arc defined
    with the following d attribute:

    `d="M 505,145 v -100 a 250,100 0 0,1 -200,100"`


    Unfortunately, the SVG syntax for elliptic arcs is non-intuitive, and it’s based
    on the notion of major arcs and minor arcs that connect two points on an ellipse.
    This example is only for illustrative purposes, so we won’t delve into a detailed
    explanation of how elliptic arcs are defined in SVG.


    The second <path> element renders the same elliptic arc with the linear gradient
    pattern1, which creates a shadow effect.


