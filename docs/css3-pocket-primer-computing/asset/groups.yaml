    *cxpartners/web-and-mobile-forms-design-userfriendly-2010-workshop.*


    **DESIGN-RELATED TOOLS AND ONLINE PATTERNS**


    Balsamiq is an online design tool, and its home page is here: *http://www.*


    *balsamiq.com/.*


    Balsamic Mockups is a tool for rapidly creating wireframes, designed to


    reproduce the experience of sketching interfaces on a whiteboard. Since these


    mockups are on your computer, you can share them quickly and easily with


    other people.


    Another toolkit for creating wireframes is justinmind, and its home page


    is here: *http://justinmind.com.*


    Both of the preceding tools are free to use, and they have videos that il-


    lustrate how to use them.


    Two websites that provide a collection of design patterns (the second is


    purely for mobile) are here: *http://pttrns.com* and *http://mobile-patterns.com*.


    **WORKING WITH FONT SIZES AND UNITS OF MEASURE**


    If you have already worked with CSS stylesheets, then you are already familiar


    with different units that are available for expressing font sizes for text in
    HTML5


    Web pages. Several units are available, including em, rem, px, pt, and %.


    The relationship among these units is as follows:


    1em = 12pt = 16px = 100%


    Pixel units (px) are very common in Web pages (especially for desktops and


    laptops), and they can vary in terms of their resolution and their DPI (dots'
