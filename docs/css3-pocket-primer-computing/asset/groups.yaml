    CSS3 和 HTML5 Canvas • 99


    ## HTML5 CANVAS 坐标系


    回想你高中的时光，那时你学过笛卡尔坐标系通过一对数字（通常写为 (x,y)）来确定欧几里得平面上的任意点。第一个数字代表水平值，第二个数字代表垂直值。水平轴称为
    x 轴，x 轴上的正值位于垂直轴的右侧（即向右侧）。垂直轴称为 y 轴，y 轴上的正值位于水平轴的上方。原点是 x 轴和 y 轴的交点。


    HTML5 Canvas 坐标系的情况几乎相同。x 轴是水平的，正方向指向右侧。y 轴是垂直的，但正方向是*向下*，这与典型数学教科书中大多数图表的方向相反。在
    HTML5 Canvas 坐标系中，原点是屏幕的左上角（而不是左下角），测量单位是像素。


    作为一个简单的示例，图 6.1 显示了 HTML5 <canvas> 元素中的四个点。


    ***图 6.1*** 在 HTML5 Canvas 中渲染的四个点。


    如果你从原点（屏幕左上角）开始向右移动 50 像素，然后向下移动 50 像素，你将到达图 6.1 中的左上点。接下来，如果你从原点开始向右移动 200 像素并向下移动
    50 像素，你将到达示例 6.1 中的右上点。同样，第二“行”中的两个点坐标为 (50,100) 和 (200,100)。注意，第一行的两个点具有相同的 y
    值，因为它们距离页面顶部的距离相同；第二行的两个点也是如此。同样，左“列”中的两个点具有相同的 x 值，因为它们距离页面左边的距离相同。


    现在你已经理解了 HTML5 Canvas 坐标系，让我们来看看示例 6.1 的内容，它显示了一个准备渲染 HTML5 Canvas 图形的最小 Web 页面。


    100 • CSS3 入门指南


    本章中的 Canvas 代码包含了示例 6.1 中显示的代码（或其变体）。


