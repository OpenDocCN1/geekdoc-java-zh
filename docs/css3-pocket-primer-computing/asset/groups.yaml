    **OTHER TOOLKITS FOR JS WEB ANIMATIONS**


    This section contains brief descriptions of JavaScript toolkits that support


    animation effects.


    The GSAP Toolkit provides sophisticated animation and tweening effects.


    GSAP is pure JavaScript (no “special” or proprietary language) for creating


    animation effects, and its home page is here: *http://greensock.com/gsap.*


    Note that GSAP does not convert fonts or create SVG artwork. GSAP


    TweenLite is the core toolkit that can animate CSS properties (among other'
