    ## RENDERING TEXT ON A PATH IN SVG


    You can create nice filter effects that you can apply to 2D shapes as well as
    text strings.


    Listing 7.7 displays the contents of the document TextOnQBezierPath1.svg, which
    illustrates how to render a text string along the path of a quadratic Bezier curve.


    ***LISTING 7.7 TextOnQBezierPath1.svg***

    <?xml version="1.0" encoding="iso-8859-1"?>

    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20001102//EN"

    "http://www.w3.org/TR/2000/CR-SVG-20001102/DTD/svg-20001102.dtd">

    <svg xmlns="http://www.w3.org/2000/svg"

    xmlns:xlink="http://www.w3.org/1999/xlink"

    width="100%" height="100%">

    <defs>

    <path id="pathDefinition" d="m0,0 Q100,0 200,200 T300,200"/>

    </defs>

    <g transform="translate(100,100)">

    <text id="textStyle" fill="red" stroke="blue" stroke-width="2" font-size="24">


    SVG Essentials • **133**

    ![](img/0a6af518702639b3a358cdd75f17af79_149_0.png)

    <textPath xlink:href="#pathDefinition">

    Sample Text that follows a path by Quadratic Bezier curve

    </textPath>

    </text>

    </g>

    </svg>


    The SVG <defs> element in Listing 7.7 contains an SVG <path> element that defines
    a quadratic Bezier curve (note the Q in the d attribute). This <path> element
    has an id whose value is pathDefinition, which is referenced later in this code.
    The SVG <g> element contains an SVG <text> element that specifies a text string
    to render, as well as an SVG <textPath> element that specifies the path along
    which the text is rendered, as shown here:

    <textPath xlink:href="#pathDefinition">

    Sample Text that follows a path by Quadratic Bezier curve

    </textPath>


    Notice that the SVG <textPath> element contains the attribute xlink:href whose
    value is pathDefinition, which is also the id of the SVG <path> element that is
    defined in the SVG <defs> element. As a result, the text string is rendered along
    the path of a quadratic Bezier curve instead of rendering the text string horizontally
    (which is the default).


    Figure 7.7 displays the result of rendering TextOnBezierPath1.svg, which renders
    a text string along the path of a quadratic Bezier curve.


    ![](img/0a6af518702639b3a358cdd75f17af79_149_1.png)


    ***FIGURE 7.7*** SVG text on a quadratic Bezier.


    ## SVG FILTERS


    SVG supports a rich set of filter effects whose complete explanation can easily
    span more than a chapter. A mastery of SVG filters involves a learning curve because
    only a few filters are simple. Many filters are very sophisticated, requiring
    multiple non-intuitive input values. In fact, it’s possible to


    **134** • CSS3 Pocket Primer


    “chain” some SVG filters: the output of one filter can be the input of another
    (and the input for some filters requires the output from two filters).


    As you might surmise, some SVG filters can be computationally intense, which in
    turn can adversely affect performance; in the case of mobile devices, applications
    that contain such filters can adversely affect battery life as well.


    The list of filter-related SVG elements includes:

    - feBlend

    - feColorMatrix

    - feComponentTransfer

    - feComposite

    - feConvolveMatrix

    - feDiffuseLighting

    - feDisplacementMap

    - feFlood

    - feGaussianBlur

    - feImage

    - feMerge

    - feMorphology

    - feOffset

    - feSpecularLighting

    - feTile

    - feTurbulence


    You can render 2D shapes as well as text strings with filter effects. Listing
    7.8 displays the contents of the SVG document BlurFilterText1.svg, which renders
    a text string with a Blur filter.


    ***LIST 7.8 BlurFilterText1.svg***

    <?xml version="1.0" encoding="iso-8859-1"?>

    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20001102//EN"

    "http://www.w3.org/TR/2000/CR-SVG-20001102/DTD/svg-20001102.dtd">

    <svg xmlns="http://www.w3.org/2000/svg"

    xmlns:xlink="http://www.w3.org/1999/xlink"

    width="100%" height="100%">

    <defs>

    <filter id="blurFilter1" filterUnits="objectBoundingBox" x="0" y="0" width="100%"
    height="100%">

    <feGaussianBlur stdDeviation="4"/>

    </filter>

    </defs>

    <g transform="translate(50,100)">

    <text id="normalText" x="0" y="0" fill="red" stroke="black" stroke-width="4" font-size="72">

    Normal Text

    </text>

    <text id="horizontalText" x="0" y="0" fill="red" stroke="black" stroke-width="4"
    font-size="72">

    Blurred Text

    </text>

    </g>

    </svg>


    SVG Essentials • **135**

    ![](img/0a6af518702639b3a358cdd75f17af79_151_0.png)


    The SVG <defs> element in Listing 7.8 contains an SVG <filter> that specifies
    a Gaussian blur with the following line:

    <feGaussianBlur stdDeviation="4"/>


    You can specify larger values for stdDeviation if you want to create more “diffuse”
    filter effects. The first <text> element that is contained in the SVG <g> renders
    a normal text string, whereas the second <text> element contains a filter attribute
    that references the filter (defined in the SVG <defs> element) in order to render
    the same text, as shown here:

    filter="url(#blurFilter1)"


    Figure 7.8 displays the result of BlurFilterText1.svg, which creates a filter
    effect.


    ![](img/0a6af518702639b3a358cdd75f17af79_151_1.png)


    ***FIGURE 7.8*** SVG filter effect.

