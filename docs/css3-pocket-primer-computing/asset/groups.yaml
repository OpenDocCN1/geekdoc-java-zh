    **3\.** Creates a JSON-based app manifest file with information about the app


    Service Workers consist of a collection of APIs (by Google) for offline access


    and Web push notifications. The manifest file contains metadata, such as icons,


    orientation, and so forth. Note that the Polymer startup kit contains a valid


    manifest file. Chrome for Android and Opera for Android allow you to save


    the app on your homescreen, which means it looks just like a native applica-


    tion on your homescreen. You can open the app with a default orientation.


    A key point is that the app works like a “normal” website in browsers that do


    not support progressive apps. An example of a progressive web app manifest


    is here: *https://mobiforge.com/design-development/web-app-manifests-usher-*


    *new-wave-progressive-apps-to-your-homescreen.*


    **IMPROVING HTML5 WEB PAGE PERFORMANCE**


    Performance is always a very important consideration, and although a de-


    tailed and lengthy discussion is beyond the constraints of this book, it’s impor-


    tant to be aware of some of the techniques that are available:


    • Concatenate JavaScript/CSS files into a single file


    • Use file compression (minification)


    • Use of spritesheets


    • Use base64 encoding of images


    • Defer the loading of JavaScript files


    A good blog post regarding the use of base64 for encoding images is here:


    *http://davidbcalhoun.com/2011/when-to-base64-encode-images-and-when-*


    *not-to?goback=%2Egde_2071438_member_234328886.*


    You can defer the loading of JavaScript files by placing <script> tags at


    the end of the <body> element in a Web page.


    You can also explore RequireJS, which is a JavaScript toolkit for asynchro-


    nously downloading JavaScript files (as well as managing JavaScript dependen-


    cies), and its home page is here: *http://requirejs.org/.*


    Steve Souders has written at least two performance-related books and


    has written many blog posts regarding performance, and it’s definitely worth


    reading his work.


