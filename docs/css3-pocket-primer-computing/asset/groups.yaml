    **HTML5 VALIDATORS**


    HTML5 validators enable you to test HTML5 websites and mobile appli-


    cations. Many types of validators for web applications are available, including:


    • HTML validators: test the validity of your HTML


    • Accessibility validators: test websites to determine how well they can be


    read by screen readers


    • Code validators (aka lint): check your scripts, CSS, and API calls for ac-


    curacy


    • Mobile validators: provide advice for improving pages for mobile devices.


    They often act as emulators as well.


    In addition to the preceding list, there are other tools that can evaluate the


    “friendliness” of your website, such as:


    • The W3C mobileOK Checker at *http://validator.w3.org/mobile*


    • MobiReady at *http://ready.mobi/*


    Both the W3C mobileOK Checker and mobiReady look at pages that are live


    on the Internet, and then give you a report of how they would perform on


    mobile devices.


    **WAI-ARIA**


    WAI-ARIA (Web Accessibility Initiative – Accessible Rich Internet Appli-


    cations) is a W3C specification that specifies how to increase the accessibility


    of websites (including dynamic content) and user interface components devel-


    oped with AJAX, HTML, JavaScript, and related technologies.


    The WAI-ARIA specification defines support for accessible web applica-


    tions, which involves markup extensions that are often attributes of HTML5


    elements. Web developers can use these markup extensions to obtain more


    information about screen readers and other assistive technologies.


    As a simple example, consider the following code snippet of an enhanced


    HTML <li> element from the ARIA specification that illustrates the use of


    the role and aria-checked attributes:


    <li role="menuitemcheckbox" aria-checked="true">


    <img src="checked.gif" role="presentation" alt="">


    <!-- note: additional scripts required to toggle image


    source -->'
