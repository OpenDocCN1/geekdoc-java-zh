  \ 14-2）。\n\n![Image](img/image00294.jpeg)\n\n图 14-2 你可以添加任务并让它们显示。\n\n非常简单，对吧？在接下来的章节中，我们将从零开始构建应用，并学习（以令人惊叹的详尽细节）这一切是如何工作的。\n\
  \n### 开始\n\n到目前，你已经知道了做法。我们需要一个起点，所以去创建一个新的 HTML 文档。在其中添加以下内容：\n\n点击此处查看代码图片\n\n\
