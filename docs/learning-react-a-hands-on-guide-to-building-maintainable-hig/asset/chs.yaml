  \        <input\n          ref={} \n          onChange={this.colorValue}\n     \
  \     placeholder=\"Enter a color value\">\n        </input>\n        <button type=\"\
  submit\">go</button>\n      </form>\n    </div>\n  );\n}\n```\n\n因为我们对 `input` 元素感兴趣，所以我们将\
  \ `ref` 属性附加到它上面。现在，我们的 `ref` 属性是空的。你通常设置的 `ref` 属性值是一个 JavaScript 回调函数。当包含此 `render`\
  \ 方法的组件挂载（mounted）时，该函数会被自动调用。如果我们将 `ref` 属性的值设置为一个简单的 JavaScript 函数，用于存储对被引用 DOM\
  \ 元素的引用，它看起来会像下面高亮的行一样：\n\n点击此处查看代码图片\n\n```javascript\n1  render: function() {\n\
