  \n这一切都是通过简单利用 React 的状态实现的。在我们的 `state` 对象中，我们有一个数组负责你输入的一切（参见图 14-5）。\n\n![Image](img/image0029.jpeg)\n\
  \n图 14-5 我们的任务存储在数组里。我知道，没意思 :-\n\n每当这个项目数组被你提交的新文本更新时，我们就用新提交的文本更新视图。剩下的工作只是设置事件和事件处理器，以确保我们可以提交表单并确切知道要把什么文本添加到项目数组中。在接下来的章节中，我们将这里看到的所有英语转换为\
