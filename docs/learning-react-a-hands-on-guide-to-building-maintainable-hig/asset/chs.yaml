  \n![Image](img/00299.jpeg)\n\n图 14-7 任务。接下来，你是否注意到你输入输入框的内容在提交表单后并没有消失？你必须在每次提交任务后手动清除字段……像个动物一样！这很烦人，但修复方法非常简单。在我们的\
  \ `TodoList` 组件的 `addItem` 方法中，添加以下高亮行：\n\n点击此处查看代码图片\n\n```javascript\naddItem:\
  \ function(e) {\n  var itemArray = this.state.items;\n  itemArray.push(\n    {\n\
  \      text: this._inputElement.value,\n      key: Date.now()\n    }\n  );\n  this.setState({\n\
  \    items: itemArray\n  });\n  this._inputElement.value = \"\";\n  e.preventDefault();\n\
  }\n```\n\n我们在这里所做的是在表单提交并调用 `addItem` 方法时，清除 `input` 元素的 `value` 属性。这确保了我们不再需要在每次要提交的任务之间手动清除输入框。简单极！\n\
  \n### 最后的修饰\n\n我们快完成了！首先，我们现在的样子看起来和开始时并不一样。我们的任务列表看起来有点单调，但可以通过 CSS 魔法来修复。在你的 `style`\
  \ 块中，在样式规则下方添加以下样式规则：\n\n```css\n.todoList .theList {\n  list-style: none;\n  padding-left:\
  \ 0;\n  width: 255px;\n}\n\n.todoListMain .theList li {\n  color: #333;\n  background-color:\
  \ rgba(255,255,255,.5);\n  padding: 15px;\n  margin-bottom: 15px;\n  border-radius:\
  \ 5px;\n}\n```\n\n如果你现在预览应用，你会发现提交的任务看起来完全如你预期的那样：\n\n### 总结\n\n我们的 Todo 应用在功能上非常简单，但通过从零构建，我们几乎涵盖了\
  \ React 提供的每一个细微细节。更重要的是，我们创建了一个示例，展示了我们单独学的概念是如何协作的。这实际上是重要的细节。现在，有一个关于你的快速问题：我们在这一章中所做的一切你理解吗？\n\
  \n如果我们在这一章中所做的一切你都理解，那么你已经准备好告诉你的朋友和家人，你即将掌握 React 了！如果你对某些领域感到困惑，我建议你回去重新阅读解决你困惑的章节。\n\
  \n\n\n我们最后一个查看的 React 相关的主题与其说是 React 本身，不如说是关于如何设置你的开发环境来构建 React 应用。到目前为止，我们一直通过包含几个脚本文件来构建\
  \ React 应用：\n\n点击此处查看代码图片\n\n```html\n<script src=\"https://npmcdn.com/react@15.3.0/dist/react.js\"\
  ></script>\n<script src=\"https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js\"\
  ></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
  ></script>\n```\n\n这些脚本文件不仅加载了 React 库，还加载了 Babel，帮助我们的浏览器在遇到 JSX 这种奇异事物时，完成需要的操作（参见图\
  \ 15-1）。\n\n![Image](img/image00301.jpeg)\n\n图 15-1 我们的 React 方法。\n\n为了回顾我们之前在讨论这种方法时提到的内容，它的缺点是性能。作为浏览器执行其通常执行的所有页面加载相关工作的一部分，它还负责将你的\
  \ JSX 转换为实际 JavaScript。这种 JSX 到 JavaScript 的转换是一个耗时的过程，在开发期间是可以接受的。但如果你的应用程序的每个用户都必须付出这种性能代价，那就不太妙了。\n\
  \n解决方案是设置你的开发环境，在用户加载页面之前处理好 JSX 到 JS 的转换（参见图 15-2）。\n\n![Image](img/image00302.jpeg)\n\
  \n图 15-2 作为应用构建过程一部分的 JSX 到 JavaScript 转换。\n\n有了这种解决方案，你的浏览器加载应用时，处理的是一个已经转换（并可能经过了优化的）JavaScript\
  \ 文件。很棒对吧？现在，我们推迟到现在谈论这一切的唯一原因是为了`简单`。学习 React 已经足够困难了。在学习 React 的过程中增加构建工具和设置环境的复杂性，这并不酷。现在你已经牢牢掌握了\
  \ React 的所有功能，是时候通过这一章来改变现状了。\n\n在接下来的章节中，我们将介绍一种结合 Node、Babel 和 webpack 来设置开发环境的方法。如果这一切听起来对你来说很奇怪，不要担心。到结束时，你将和所有这些工具如老朋友般熟悉。\n\
  \n***\n\n注意：内容可能会变化\n\n构建工具及其依赖项一直在变化。这对我们来说是个好消息，但它让发布相关信息变成了一项挑战！本章包含了基于当前（即编写本文时！）最佳实践的最新信息，但这些信息可能会变化。如果你发现某些工具和说明的工作方式与描述的不符，请通过以下地址查看本文的在线版本（更新更频繁）：[`www.kirupa.com/react/setting_up_react_environment.htm`](https://www.kirupa.com/react/setting_up_react_environment.htm)\n\
  \n***\n\n### 认识工具\n\n好了，是时候跳出笼统的论述（以及那些精美的图表）了。是时候严肃起来了——呃。是时候认识我们将用来正确设置开发环境并依赖的工具了。\n\
  \n#### Node.js\n\n在很长一段时间里，JavaScript 主要是你用来让浏览器运行某些功能的代码。Node.js 改变了这一切。Node.js\
  \ 允许你使用 JavaScript 创建运行在服务器上的应用程序，并访问浏览器梦都无法想象到的 API 和系统资源。它基本上是一个完整的应用程序开发运行时，其程序（而不是用\
  \ Java、C#、C++ 等语言编写）完全基于 JavaScript 进行构建并运行。\n\n对于我们的目的来说，我们将依赖 `Node.js`（准确地说是\
  \ Node 包管理器，即 `NPM`）来管理依赖，并将从 JSX 到 JavaScript 所需的步骤结合起来。将 `Node.js` 想象成让我们的开发环境运行的胶水。\n\
  \n#### Babel\n\n这个我们应该很熟悉！简单来说，Babel 是一个 JavaScript 转译器。它将你的 JavaScript 转换为……嗯……JavaScript。这听起来非常奇怪，所以让我澄清一下。如果你使用最新的的\
  \ JavaScript 特性，旧版浏览器在遇到新函数或属性时可能不知道该怎么办。如果你在写 JSX，那么……没有任何浏览器知道该如何处理它！\n\nBabel\
  \ 的作用是将你新颖的 JS 或 JSX 转换为大多数浏览器都能理解的 JS 形式。我们直以来一直使用它的浏览器端版本将 JSX 转换为 JavaScript。稍后，你将看到我们如何将\
  \ Babel 集为构建过程的一部分，从我们的 JSX 生成一个真正的、浏览器可读的 JS 文件。\n\n#### Webpack\n\n我们将依赖的最后一个工具是\
  \ `webpack`。它被称为模块打包器。抛开这些华丽的头衔，你的应用所包含的许多框架和库都有许多依赖项，你所依赖的功能部分可能只是更大组件的一个子集。\n\n\
  你可能不需要所有这些必要的代码，而像 `webpack` 这样的工具起着重要作用，让你能够只包含运行应用所需的相关代码。它们通常会将所有相关代码（即使它们来自不同的来源）打包到一个文件中（参见图\
  \ 15-3）。\n\n![Image](img/image0033.jpeg)\n\n图 15-3 打包成单个文件。\n\n### 你的代码编辑器\n\n如果不谈论这一切最重要的工具——你的代码编辑器，关于开发环境的讨论无法进行（参见图\
  \ 15-4）。\n\n![Image](img/image0034.jpeg)\n\n图 15-4 你的编辑器。\n\n无论你使用 Sublime、Atom、VS\
  \ Code、TextMate、Coda 或任何其他工具，你都会在代码编辑器中花费大量时间，不仅是为了构建 React 应用，还为了配置 Node、Babel\
  \ 需要各种文件。\n\n### 环境搭建！\n\n到目前，你应该对我们正在尝试做的有一个模糊的想法……我们试图实现的梦想！我们甚至查看了实现这一梦想将发挥作用的各种工具。现在，是时候通过实际工作来实现它了。\n\
  \n#### 设置初始项目结构\n\n我们要做的第一件事是设置项目。去桌面创建一个名为 **MyTotallyApp** 的新文件夹。在该文件夹内部创建两个名为\
  \ **dev** 和 **output** 的文件夹。你的目录结构看起来像图 15-5。\n\n![Image](img/image00305.jpeg)\n\
  \n图 15-5 我们目前的目录结构。\n\n我们在这里做的非常简单。在 **dev** 文件夹中，我们将放置所有未优化和未转换的 JSX、JavaScript\
  \ 以及其他脚本内容。换句话之，这就是你编写和活跃工作的代码所在地。在 **output** 文件夹中，我们将放置对 **dev** 文件夹中的脚本文件运行各种构建工具后的结果。这是\
  \ Babel 将我们所有的 JSX 文件转换为 JS 的地方。这也是 webpack 解析我们脚本文件之间的依赖关系，并将所有重要的脚本内容放入单个 JavaScript\
  \ 文件中的地方。\n\n接下来我们要的是创建一个浏览器指向的 HTML 文件。在 **MyTotallyApp** 文件夹中，使用你的代码编辑器创建一个名为\
  \ **index.html** 的新 HTML 文件，内容如下：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>React! React! React!</title>\n</head>\n</html>\n```\n\n\n\n\n```html\n\
  <body>\n  <div id=\"container\"></div>\n  <script src=\"output/myCode.js\"></script>\n\
  </body>\n</html>\n```\n\n在添加了这些内容后，请务必保存文件。现在说这些内容，我们的标记非常简单。文档的主体就是一个空的 `div` 元素，其\
  \ `id` 值为 `container`，以及一个 `script` 标签，该标签指向 `output` 文件夹内生成的最终 JavaScript 文件 `myCode.js`：\n\
  \n点击此处查看代码图像\n\n```html\n<script src=\"output/myCode.js\"></script>\n```\n\n除了这两点之外，我们的\
  \ HTML 文件并没有很多内容。如果现在要让我们可视化所有内容的关系，它看起来有点像图 15-6。\n\n![Image](img/image00306.jpeg)\n\
  \n图 15-6 你当前的项目结构看起来如下。\n\n我为 `output` 文件夹中的 `myCode.js` 文件画了一条虚线，因为该文件目前还不存在那里。我们在\
  \ HTML 中指向了一个目前尚不存在的内容，但这种情况不会持续太久。\n\n### 安装和初始化 Node.js\n\n我们的下一步是安装 Node.js。访问\
  \ Node.js 网站（[`nodejs.org/`](https://nodejs.org/)）安装适用于你操作系统的版本（参见图 15-7）。\n\n![Image](img/image00307.jpeg)\n\
  \n图 15-7 Node.js 网站上的下载按钮。\n\n我倾向于总是安装最新版本，你也应该这样做。下载和安装过程并不特别。安装好 Node.js 后，启动终端（Mac）、命令提示符（Windows）或相应的选择工具，输入以下内容并按回车测试它是否真的已安装：\n\
  \n```bash\nnode -v\n```\n\n如果一切运行正常，你将看到一个版本号，它通常与你刚刚安装的 Node.js 版本对应。如果出于某种原因遇到错误，请遵循此处列出的故障排除步骤（[`github.com/npm/npm/wiki/Troubleshooting`](https://github.com/npm/npm/wiki/Troubleshooting)）。\n\
  \n接下来，我们要在 `MyTotallyAwesomeApp` 文件夹上初始化 Node.js。要做到这一点，首先使用你的终端或命令提示符导航到 `MyTotallyAwesomeApp`\
  \ 文件夹。在 OS X 上，它看起来像图 15-8。\n\n![Image](img/image00308.jpeg)\n\n图 15-8 导航到 MyTotallyAwesomeApp\
  \ 文件夹。\n\n现在，输入以下内容来初始化 Node.js：\n\n```bash\nnpm init\n```\n\n这将启动一系列问题，帮助在我们的项目中设置\
  \ Node.js。第一个问题将要求你指定项目名称。按回车键将允许你指定已经为你选定的默认值。这都很好，但默认名称是我们的项目文件夹，即 `MyTotallyAwesomeApp`。如果你直接按回车，因为它包含大写字母，它会抛出错误（参见图\
  \ 15-9）。\n\n![Image](img/image00309.jpeg)\n\n图 15-9 我们的项目文件夹名称包含大写字母，触发了错误。\n\n\
  输入名称的小写版本 `mytotallyawesomeapp`。完成后，按回车。对于剩余的问题，只需按回车以接受所有默认值。这一切的最终结果是在你的 `MyTotallyAwesomeApp`\
  \ 文件夹中创建了一个名为 `package.json` 的新文件（参见图 15-10）。\n\n![Image](img/image00310.jpeg)\n\
  \n图 15-10 package.json 文件出现在你的文件夹中。\n\n如果你在代码编辑器中打开 `package.json` 的内容，你会看到类似下面的内容：\n\
  \n点击此处查看代码图像\n\n```json\n{\n  \"name\": \"mytotallyawesomeapp\",\n  \"version\"\
  : \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\"\
  : {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n \
  \ \"author\": \"\",\n  \"license\": \"ISC\"\n}\n```\n\n不要太担心这个文件的内容，只需知道调用 `npm\
  \ init` 的结果之一是你有一个 `package.json` 文件，其中包含了一些奇怪的属性和值，而 Node.js 完全知道如何处理它们。\n\n###\
  \ 安装 React 依赖\n\n我们接下要做的是安装 React 依赖，这样我们就可以在代码中使用 React 和 React DOM 库。如果你来自纯 Web\
  \ 开发背景，这就是我们开始的地方。如果现在要让我们可视化所有内容的关系，它看起来有点像图 15-6。\n\n![Image](img/image00306.jpeg)\n\
  \n图 15-6 你当前的项目结构看起来如下。\n\n我为 `output` 文件夹中的 `myCode.js` 文件画了一条虚线，因为该文件目前还不存在。我们在\
  \ HTML 中指向了一个目前尚不存在的内容，但这种情况不会持续太久。\n\n### 添加我们的 JSX 文件\n\n事情变得变得有趣了。现在我们已经告诉了 Node.js\
  \ 感兴趣，距离构建应用又近了一步。在我们的 `dev` 文件夹中，使用代码编辑器创建一个名为 `index.jsx` 的文件，内容如下代码：\n\n点击此处查看代码图像\n\
  \n```javascript\nimport React from \"react\";\nimport ReactDOM from \"react-dom\"\
  ;\n\nvar HelloWorld = React.createClass({\n  render: function() {\n    return (\n\
  \      <p>Hello, {this.props.greetTarget}!</p>\n    );\n  }\n});\n\nReactDOM.render(\n\
  \  <<div>\n    <HelloWorld greetTarget=\"Batman\"/>\n    <HelloWorld greetTarget=\"\
  Iron Man\"/>\n    <HelloWorld greetTarget=\"Nicolas Cage\"/>\n    <HelloWorld greetTarget=\"\
  Mega Man\"/>\n    <HelloWorld greetTarget=\"Bono\"/>\n    <HelloWorld greetTarget=\"\
  Catwoman\"/>\n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n注意，我们添加的大部分\
  \ JSX 与之前的几乎没有修改。唯一的区别是，以前将 React 和 React DOM 库引入应用的 `script` 引用现在已被 `import` 语句取代取代，指向我们几分钟前添加的\
  \ `react` 和 `react-dom` Node.js 包。现在，你可能正急切好奇我们什么时候可以构建应用并让它在浏览器中运行。嗯，还有几个步骤。图 15-12\
  \ 显示了我们当前项目可视化的样子。\n\n![Image](img/image00312.jpeg)\n\n图 15-12 当前的项目。\n\n\n\n\n\n\
  # 从 JSX 到 JavaScript\n\n目前缺失的步骤是将我们的 `JSX` 转换为浏览器可以理解的 JavaScript。这涉及 `webpack`\
  \ 和 `Babel`，我们将配置这两者来让这一切运行起来。\n\n## 设置 webpack\n\n由于我们正处于 Node.js 环境中，且 `webpack`\
  \ 和 `Babel` 都以 Node 包的形式存在，因此我们需要像安装 React 相关包一样安装它们它们。\n\n要安装 `webpack`，请在终端（Terminal）/\
  \ 命令提示符（Command Prompt）中输入以下内容：\n\n```bash\nnpm install webpack --save\n```\n\n\
  这需要花费一些时间，因为 `webpack` 包（及其大量的依赖项）会被下载并放置到我们的 `node_modules` 文件夹中。完成后，我们需要添加一个配置文件来指定\
  \ `webpack` 如何与我们当前的项目协作。使用你的代码编辑器，在 `MyTotallyAwesomeApp` 文件夹内创建一个名为 `webpack.config.js`\
  \ 的文件（参见图 15-13）。\n\n![Image](img/image0031.jpeg)\n\n图 15-13 添加 `webpack.config.js`。\n\
  \n在该文件中，我们将指定一组 JavaScript 属性，以定义原始未修改的源文件位置，以及最终源文件的输出位置。请将以下 JavaScript 代码添加到\
  \ `webpack.config.js` 中：\n\n```javascript\nvar webpack = require(\"webpack\");\n\
  \nvar path = require(\"path\");\n\nvar DEV = path.resolve(__dirname, \"dev\");\n\
  \nvar OUTPUT = path.resolve(__dirname, \"output\");\n\nvar config = {\n  entry:\
  \ DEV + \"/index.jsx\",\n  output: {\n    path: OUTPUT,\n    filename: \"myCode.js\"\
  \n  }\n};\n\nmodule.exports = config;\n```\n\n花几分钟看看这段代码的作用。我们定义了两个名为 `DEV` 和 `OUTPUT`\
  \ 的变量，它们指向项目中的同名文件夹。在 `config` 对象中，我们有两个名为 `entry` 和 `output` 的属性，它们使用 `DEV` 和 `OUTPUT`\
  \ 变量来帮助将我们的 `index.jsx` 文件映射为 `myCode.js`。\n\n## 设置 Babel\n\n我们当前设置的最后一部分是将我们的 `index.jsx`\
  \ 文件转换为 `myCode.js` 形式的普通 JavaScript。这就是 Babel 发挥用场的地方。要安装 Babel，让我们回到熟悉的终端 / 命令提示符并输入以下\
  \ Node.js 命令：\n\n```bash\nnpm install babel-loader babel-preset-es2015 babel-preset-react\
  \ --save\n```\n\n通过此命令，我们安装了 `babel-loader`、`babel-preset-es2015` 和 `babel-preset-react`\
  \ 包。现在我们需要配置 Babel 与我们的项目协作。这是一个步骤步骤。\n\n第一步是指定我们想要使用的 Babel 预设（presets）。实现这一点有多种方法，但我倾向的方法是修改\
  \ `package.json` 并添加以下高亮内容：\n\n```json\n{\n  \"name\": \"mytotallyawesomeapp\",\n\
  \  \"version\": \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n\
  \  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit\
  \ 1\"\n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"dependencies\": {\n\
  \    \"babel-loader\": \"⁶.2.4\",\n    \"babel-preset-es2015\": \"⁶.9.0\",\n   \
  \ \"babel-preset-react\": \"⁶.5.0\",\n    \"react\": \"¹⁵.1.0\",\n    \"react-dom\"\
  : \"¹⁵.1.0\",\n    \"webpack\": \"¹.13.1\"\n  },\n  \"babel\": {\n      \"presets\"\
  : [\n        \"es2015\",\n        \"react\"\n    ]\n  }\n}\n```\n\n在高亮行中，我们指定了 `babel`\
  \ 对象并指定了 `es2015` 和 `react` 预设值。\n\n第二步是告诉 webpack Babel。在我们的 `webpack.config.js`\
  \ 文件中，添加以下高亮行：\n\n```javascript\nvar webpack = require(\"webpack\");\n\nvar path\
  \ = require(\"path\");\n\nvar DEV = path.resolve(__dirname, \"Dev\");\n\nvar OUTPUT\
  \ = path.resolve(__dirname, \"output\");\n\nvar config = {\n  entry: DEV + \"/index.jsx\"\
  ,\n  output: {\n    path: OUTPUT,\n    filename: \"myCode.js\"\n  },\n  module:\
  \ {\n    loaders: [{\n      include: DEV,\n      loader: \"babel\",\n    }]\n  }\n\
  };\n\nmodule.exports = config;\n```\n\n### 构建并测试我们的\n\n我们当前设置的最后一部分是将我们的 `index.jsx`\
  \ 文件转换为 `myCode.js` 形式的普通 JavaScript。这就是 Babel 发挥用场的地方。要安装 Babel，让我们回到熟悉的终端 / 命令提示符并输入以下\
  \ Node.js 命令：\n\n```bash\nnpm install babel-loader babel-preset-es2015 babel-preset-react\
  \ --save\n```\n\n通过此命令，我们安装了 `babel-loader`、`babel-preset-es2015` 和 `babel-preset-react`\
  \ 包。现在我们需要配置 Babel 与我们的项目协作。这是一个步骤步骤。\n\n第一步是指定我们想要使用的 Babel 预设。实现这一点有多种方法，但我倾向的方法是修改\
  \ `package.json` 并添加以下高亮内容：\n\n```json\n{\n  \"name\": \"mytotallyawesomeapp\",\n\
  \  \"version\": \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n\
  \  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit\
  \ 1\"\n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"dependencies\": {\n\
  \    \"babel-loader\": \"⁶.2.4\",\n    \"babel-preset-es2015\": \"⁶.9.0\",\n   \
  \ \"babel-preset-react\": \"⁶.5.0\",\n    \"react\": \"¹⁵.1.0\",\n    \"react-dom\"\
  : \"¹⁵.1.0\",\n    \"webpack\": \"¹.13.1\"\n  },\n  \"babel\": {\n      \"presets\"\
  : [\n        \"es2015\",\n        \"react\"\n    ]\n  }\n}\n```\n\n在高亮行中，我们指定了 `babel`\
  \ 对象并指定了 `es2015` 和 `react` 预设值。\n\n第二步是告诉 webpack Babel。在我们的 `webpack.config.js`\
  \ 文件中，添加以下高亮行：\n\n```javascript\nvar webpack = require(\"webpack\");\n\nvar path\
  \ = require(\"path\");\n\nvar DEV = path.resolve(__dirname, \"Dev\");\n\nvar OUTPUT\
  \ = path.resolve(__dirname, \"output\");\n\nvar config = {\n  entry: DEV + \"/index.jsx\"\
  ,\n  output: {\n    path: OUTPUT,\n    filename: \"myCode.js\"\n  },\n  module:\
  \ {\n    loaders: [{\n      include: DEV,\n      loader: \"babel\",\n    }]\n  }\n\
  };\n\nmodule.exports = config;\n```\n\n花几分钟看看这段代码的作用。我们定义了两个名为 `DEV` 和 `OUTPUT`\
  \ 的变量，它们指向项目中的同名文件夹。在 `config` 对象中，我们有两个名为 `entry` 和 `output` 的属性，它们使用 `DEV` 和 `OUTPUT`\
  \ 变量来帮助将我们的 `index.jsx` 文件映射为 `myCode.js`。\n\n### 结\n\n好吧……这一切就这么发生了！在前面的章节中，我们在学习如何使用\
  \ React 构建酷应用方面涵盖了大量内容。早些时候，我们从讨论构建复杂 UI 产生的问题开始，以及 React 如何让这一切变得轻而易举。希望在随后的章节中，你已经很好地了解如何使用\
  \ React 来实现这些目标。\n\n## 16 结束\n\n所以……我们来到这里了。在 15 个章节之后，我们在学习如何使用 React 构建酷应用方面涵盖了大量内容。早些时候，我们从讨论构建复杂\
