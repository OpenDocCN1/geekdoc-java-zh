  \n`Kirupa Chinnathambi` 过去的大部分时间都在试图教其他人像他一样热爱好 Web 开发。\n\n1999 年，在“博客”还未成为一个词之前，他就开始在\
  \ `http://kirupa.com` 上发布教程。在随后的几年里，他写了数百篇文章，写了几本书（当然，没有一本像这本好！），并录制了一系列可以在 YouTube\
  \ 上看到的视频。当他不在编写或谈论 Web 开发时，他作为微软的项目经理，利用清醒时间帮助让 Web 变得更酷。在不清醒的时候，他可能在睡觉……或者用第三人称描写他自己。\n\
  \n## 1. 介绍 React\n\n暂且忽略现在的 Web 应用在外观和感受上比以前更好，还有一些更根本性的变化发生了。我们现在架构和构建 Web 应用的方式已经完全不同了。为了突出这一点，让我们来看图\
  \ 1-1 所示的应用。\n\n![Image](img/image00227.jpeg)\n\n图 1-1 一个应用。\n\n\n\n\n\n此应用是一个用于某个内容的简单目录浏览器。就像任何此类应用一样，你有一套常规的页面，围绕着首页、搜索结果页、详情页等展开。在接下来的章节中，让我们来看看我们构建此应用的两种方法。没错，以某种神秘的方式，这让我们也掌握了对\
  \ React 的概览！\n\n继续吧！\n\n## 老式多页设计\n\n如果你在几年前必须构建这个应用，你可能会采用涉及多个独立页面的方法。其流程看起来像图\
  \ 1-2 所示所示。\n\n![Image](img/image00228.jpeg)\n\n图 1-2 多页设计。\n\n对于几乎每一个会改变浏览器显示内容的动作，Web\
  \ 应用程序都会将你导航到一个`完全不同的页面`。除了用户在页面被销毁和重绘时所看到的不尽如意的体验外，这还是一个大问题。这对你如何维护应用状态有很大影响。除了通过\
  \ cookie 和某些服务器端机制存储一些用户数据外，你根本不需要操心。生活很美好。\n\n## 新式单页应用\n\n如今，采用需要在各个页面之间导航的 Web\
  \ 应用模型似乎已经过时了……真的，非常过时了，就像图 1-3 所示。\n\n![Image](img/image00229.jpeg)\n\n图 1-3 独立页面模型有点过时了——就像这台蒸汽机。\n\
  \n来源：*New Catechism of the Steam Engine*,1904\n\n相反，现代应用倾向于遵循所谓的`单页应用 (SPA) 模型`。在这样一个世界里，你永远不会导航到不同的页面，甚至永远不会刷新页面。相反，应用的不同视图被加载和卸载到页面本身中。\n\
  \n对于我们的应用，这可能像图 1-4 所示。\n\n![Image](img/image00230.jpeg)\n\n图 1-4 单页应用。\n\n当用户与我们的应用交互时，我们将与用户尝试的操作匹配的数据和\
  \ HTML 替换虚线区域的内容。最终结果是更加流畅的体验。你甚至可以使用许多视觉技术让你的新内容过渡得非常自然，就像你在移动设备或桌面上的酷应用中看到的那样。在导航到不同页面时，这种操作是不可能的。\n\
  \n如果你从未听说过单页应用，这一切听起来可能有点疯狂，但你很有可能在现实中遇到过它们。如果你曾用过 Gmail、Facebook、Instagram 或 Twitter\
  \ 等流行的 Web 应用，那么你就在使用单页应用。在所有这些应用中，内容都是动态显示的，不需要你刷新或导航到不同的页面。\n\n现在，我正在让这些单页应用看起来看起来非常复杂。事实并非`完全`如此。得益于\
  \ JavaScript 以及各种第三方框架和库的许多优秀改进，构建单页应用比以往任何时候都简单。不过，这并不意味着没有改进的空间。\n\n在构建单页应用时，你会遇到三个主要问题：\n\
  \n![Image](img/image00226.jpeg) 在单页应用中，你大部分时间将花在保持数据与 UI 同步上。例如，如果用户加载了新内容，我们是否显式地清除搜索字段？我们是否让导航元素上的激活标签仍然可见？我们在页面上保留哪些元素，销毁哪些元素？\n\
  \n这些都是单页应用特有的问题。在旧模型在页面间导航时，我们只假设 UI 中的所有内容都会被销毁并重新构建。这从不是一个问题。\n\n![Image](img/image00226.jpeg)\
  \ 操作 DOM 真的非常慢。手动查询元素、添加子节点（参见下方的图 1-5）、移除子树和执行其他 DOM 操作是你在浏览器中可以执行的最慢的操作之一。遗憾的是，在单页应用中，你会进行很多这类操作。操作\
  \ DOM 是你响应操作并显示新内容的主要方式。\n\n![Image](img/image00231.jpeg)\n\n图 1-5 添加子节点。\n\n![Image](img/image00226.jpeg)\
  \ 处理 HTML 模板可能是一件痛苦。单页应用中的导航无非是你处理 HTML 片段以表示你想要显示的任何内容。这些 HTML 片段通常被称为`模板 (templates)`，使用\
  \ JavaScript 操作它们并用数据填充它们会很快变得非常复杂。\n\n更糟糕的是，取决于你使用的框架，模板的外以及与数据交互的方式会有巨大差异。例如，这是在\
  \ Mustache 中使用模板的样子：\n\n点击此处查看代码图像\n\n```javascript\nvar view = {\n  title: \"Joe\"\
  ,\n  calc: function () {\n    return 2 + 4;\n  }\n};\n\nvar output = Mustache.render(\"\
  {{title}} spends {{calc}}\", view);\n```\n\n有时，你的模板看起来像某些你可以自豪展示的 HTML。尽管有这些缺陷，单页应用并不会消失。它们是现在的一部分，并将完全构成应用构建的未来。为了解决这个问题，请认识\
  \ React！\n\n## 认识 React\n\nFacebook（以及 Instagram）决定够了。鉴于对单页应用的丰富经验，他们发布了一个名为 `React`\
  \ 的库（React 标志见图 1-6），不仅为了解决这些缺陷，还为了改变我们构建单页应用的方式。\n\n![Image](img/image00232.jpeg)\n\
  \n图 1-6 React 标志。\n\n在接下来的章节中，让我们来看看 React 带来的核心功能。\n\n### 自动 UI 状态管理\n\n在单页应用中，跟踪\
  \ UI 并维护状态是困难且非常耗时的。在 React 中，你只需要担心一件事：UI 的最终状态。UI 初始状态如何并不重要。用户为了改变 UI 经历了哪些步骤也不重要。重要的是你的\
  \ UI 变成了哪里（参见图 1-7）。\n\n![Image](img/image00233.jpeg)\n\n图 1-7 在 React 中，UI 的最终或结束状态才是重要的。\n\
  \nReact 处理其他所有事情。它会计算做什么以确保你的 UI 被正确表示，因此所有这些状态管理不再是你的问题。\n\n#### 极速 DOM 操作\n\n\
  由于 DOM 修改非常慢，你不再使用 React 直接修改 DOM。相反，你修改内存中的`虚拟 DOM (virtual DOM)`。图 1-8 象征着那个内存中的虚拟\
  \ DOM。\n\n![Image](img/image00234.jpeg)\n\n图 1-8 想象一个内存中的虚拟 DOM。\n\n操作这个虚拟 DOM 极快，React\
  \ 会在合适时间处理更新真实 DOM。它通过比较你的虚拟 DOM 和真实 DOM 之间的变化，找出哪些变化是重要的，并进行最少的 DOM 更改以保持一切更新，这个过程被称为`调和\
  \ (reconciliation)`。\n\n#### 创建真正可组合 UI 的 API\n\nReact 不再将应用中的视觉元素视为一个单一的整体，而是鼓励你将视觉元素拆分成更小的组件。\n\
  \n\n\n\n\n就像编程中的其他一切一样，保持内容的模块化、紧凑和自包含是一个非常好的主意。React 将这一成熟的理念扩展到了我们思考用户界面的方式上。React\
  \ 的许多核心 API 使得创建较小的视觉组件变得更加简单，这些组件之后可以与其他视觉组件组合，形成更大、更复杂的视觉组件——就像俄罗斯套套娃一样（参见图 1-9）。\n\
  \n![Image](img/image00235.jpeg)\n\n图 1-9，由 Gnomz007 创作的俄罗斯套套娃。\n\n来源：*[`commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg`](https://commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg)*\n\
  \n这是 React 简化（并改变）我们构建 Web 应用视觉效果的主要方式之一。\n\n## 完全由 JavaScript 定义视觉效果\n\n虽然这听起来既荒谬又离谱，但请听我细解释。除了使用一种非常奇怪的语法外，HTML\
  \ 模板传统上还存在另一个主要问题：除了简单显示数据外，在它们内部可以做的事情种类是有限的。例如，如果你想根据特定条件选择显示哪个 UI 组件，你必须在应用的其他地方编写\
  \ JavaScript，或者使用某些奇怪的、特定框架的模板命令来实现它。\n\n例如，这里是 EmberJS 模板内部条件语句的样式：\n\n点击此处查看代码图片\n\
  \n```html\n{{#if person}}\n\n  Welcome back, <b>{{person.firstName}} {{person.lastName}}</b>!\n\
  \n{{else}}\n\n  Please log in.\n\n{{/if}}\n```\n\nReact 的做法非常巧妙。通过将你的 UI 完全定义在 JavaScript\
  \ 中，你可以利用 JavaScript 为你提供的所有丰富功能来在模板内部执行各种操作（你将在接下来的章节中看到）。你所受的限制仅限于 JavaScript\
  \ 支持的内容，而不是你的模板框架施加的任何限制。\n\n现在，当你考虑到完全由 JavaScript 定义的视觉效果时，你可能在想某些涉及引号、转义字符和大量\
  \ `createElement` 用的可怕东西。别担心。React 为你提供了选项，让你可以使用被称为 `JSX` 的类 HTML 语法来指定视觉效果，这种语法与你的\
  \ JavaScript 完全共存。你不再是编写代码来定义 UI，你基本上是在指定标记：\n\n```javascript\nReactDOM.render(\n\
  \n  <div>                        \n\n     <h1>Batman</h1>        \n\n     <h1>Iron\
  \ Man</h1>      \n\n     <h1>Nicolas Cage</h1> \n\n     <h1>Mega Man</h1>      \n\
  \n  </div>,             \n\n  destination\n\n);\n```\n\n这段在 JavaScript 中定义的相同代码看起来像这样：\n\
  \n点击此处查看代码图片\n\n```javascript\nReactDOM.render(React.createElement(\n  \"div\",\n\
  \  null,\n  React.createElement(\n    \"h1\",\n    null,\n    \"Batman\"\n  ),\n\
  \  React.createElement(\n    \"h1\",\n    null,\n    \"Iron Man\"\n  ),\n  React.createElement(\n\
  \    \"h1\",\n    null,\n    \"Nicolas Cage\"\n  ),\n  React.createElement(\n  \
  \  \"h1\",\n    null,\n    \"Mega Man\"\n  )\n), destination);\n```\n\n哎呀！通过使用 JSX，你能够使用非常熟悉的语法非常容易地定义视觉效果，同时仍然获得\
  \ JavaScript 提供的所有力和灵活性。最棒的是，在 React 中，你的视觉效果和 JavaScript 往往位于同一个位置。你不再需要在多个文件之间跳转来定义一个视觉组件的外观和行为。这才是正确的模板化方式。\n\
  \n## MVC 架构中的 V\n\n我们快要完了！React 并不是一个对你应用中一切应该如何行为有意见的完整框架。相反，React 主要在视图（View）层工作，它的所有担忧和关注都围绕着你的视觉元素并保持它们更新。这意味着你可以自由使用任何你想要的工具来实现\
  \ MVC 架构中的 M 和 C 部分。这种灵活性使你能够选择你熟悉的技术，这使得 React 不仅对你创建的新 Web 应用有用，对现有应用也有用。\n\n\
  ## 2. 构建你的第一个应用\n\n到目前，多亏了上一章，你可能已经了解了它的背景和原理。本章的意图是向你介绍 React 是做什么的。在本章中，我们将从最开始起，通过构建一个简单的\
  \ React 应用来亲自动手。我们将正面对这些障碍中的一些，并跳过其中的一些。在本章结束时，我们不仅构建了一个你可以自豪地展示给亲家人看的东西，还为深入学习做好了良好的准备。\n\
  \n### 处理 JSX\n\n在我们开始构建应用之前，有一件重要的事情应该先涵盖。React 与你用过的许多 JavaScript 库不同。当你简单地使用 `<script>`\
  \ 标签引用为它编写的代码时，它并不高兴。React 在这方面烦人地特殊，这与 React 应用的构建有关。\n\n正如你所知，你的 Web 应用（以及浏览器显示的所有其他内容）是由\
  \ HTML、CSS 和 JavaScript 组成的：\n\n![Image](img/image00236.jpeg)\n\n无论你的 Web 应用是使用\
  \ React 还是其他库（如 Angular、Knockout 或 jQuery）编写的，结果必须是 HTML、CSS 和 JavaScript 的组合。否则，你的浏览器真的不知道该。\n\
  \n现在，这就是 React 特殊之处所在。除了普通的 HTML、CSS 和 JavaScript，你的 React 代码的大部分将写在名为 JSX 的语言中。正如我在第\
  \ 1 章中提到的，JSX 是一种允许你轻松混合 JavaScript 和类 HTML 标签以定义用户界面（UI）元素及其功能的语言。这听起来很酷（我们几分钟就会看到\
  \ JSX 的运行），但存在一个小问题：你的浏览器完全不知道如何处理 JSX。\n\n为了使用 React 构建 Web 应用，我们需要一种方法将 JSX 转换为普通的\
  \ JavaScript 并放置在磁盘上，以便你像任何普通 JavaScript 文件一样引用它。\n\n\n\n\n\n![Image](img/image00226.jpeg)\n\
  \n**让你的浏览器依赖 JavaScript 库自动将 JSX 转换为它能理解的内容。** 你可以像编写任何旧 JavaScript 代码一样直接指定 JSX，而你的浏览器会处理剩下的工作。\n\
  \n这两种解决方案在我们的世界中都有用武之地，但让我们来谈谈它们的影响。\n\n第一种解决方案起初虽然有些复杂且耗时，但它是如今现代 Web 开发的方式。除了将你的\
  \ JSX 编译（准确地说是转译）为 `JS` 之外，这种方法还让你能够利用模块、更强大的构建工具以及许多让构建复杂的 Web 应用程序变得具有可操作性的特性。\n\
  \n第二种解决方案提供了一种快速且直接的路径，你起初花费更多时间在编写代码上，而花更少的时间去折腾开发环境。要使用这种解决方案，你只需要引用一个脚本文件。该脚本文件会在页面加载时将\
  \ JSX 转换为 `JS`，你的 React 应用程序无需你对开发环境进行任何特殊处理即可运行起来。\n\n在我们对 React 的入门介绍中，我们将使用第二种解决方案。你可能会奇怪为什么我们不总是使用第二种方案。原因是浏览器每花时间将\
  \ JSX 转换为 `JS` 都会产生性能影响。这在学习如何使用 React 时完全可以接受，但当你将应用用于实际生活时，这是完全不可接受的。正因为这种不可接受性，一旦你熟练地掌握了\
  \ React，我们将重新回顾这些内容，并查看第一种解决方案以及如何设置你的开发环境。\n\n### 开始你的 React 之之旅\n\n在上一节中，我们查看了确保你的\
  \ React 应用程序最终变为浏览器可以理解内容的两种方法。在本节中，我们将把所有这些话付诸实践。首先，我们需要一个空白的 HTML 页面作为我们的起点。\n\
  \n如果你手头没有空白的 HTML 页面，请使用以下代码：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n  <title>React! React! React!</title>\n</head>\n<body>\n  <script>\n  </script>\n\
  </body>\n</html>\n```\n\n这个页面没有任何有趣或令人兴奋的内容，但让我们通过添加 React 库的引用来修复这个问题。在 `title`\
  \ 正下方，添加这两行：\n\n点击此处查看代码图片\n\n```html\n<script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"\
  ></script>\n<script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
  ></script>\n```\n\n这两行代码引入了 React 核心库以及 React 与 `DOM` 所需的各种功能。没有了它们，你根本就在构建 React\
  \ 应用程序。现在，我们还没有结束。我们还需要引用另一个库。在这两个 `script` 标签正下方，添加以下行：\n\n点击此处查看代码图片\n\n```html\n\
  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
  ></script>\n```\n\n我们在这里做的是添加对 Babel JavaScript 编译器 (`http://babeljs.io/`) 的引用。Babel\
  \ 做了很多很酷的事情，但我们关心的是它将 JSX 转换为 JavaScript 的能力。\n\n此时，我们的 HTML 页面应该看起来如下所示：\n\n点击此处查看代码图片\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>React! React! React!</title>\n\
  \  <script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script\
  \ src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"></script>\n  <script\
  \ src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
  ></script>\n</head>\n<body>\n  <script>\n  </script>\n</body>\n</html>\n```\n\n\
  如果你现在预览你的页面，你会发现这个页面仍然是空白的，没有任何可见的内容。这没关系。我们接下来要修复它。\n\n### 显示你的名字\n\n我们要做的第一件事是使用\
  \ React 在屏幕上显示我们的名字。我们实现这一点的方法是使用一种名为 `render` 的方法。在你的 `script` 标签内部，添加以下内容：\n\n\
  点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <h1>Sherlock Holmes</h1>,\n  document.body\n\
  );\n```\n\n如果现在这些内容看起来都不懂，不要担心。我们的目标是先在屏幕上显示出点东西，稍后我们就会弄清楚我们做了什么。现在，在页面中预览以查看发生了什么之前，我们需要将此\
  \ `script` 块标记为 Babel 可以处理的内容。\n\n```html\n<script type=\"text/babel\">\nReactDOM.render(\n\
  \  <h1>Sherlock Holmes</h1>,\n  document.body\n);\n</script>\n```\n\n如果你现在预览页面，你会发现这个页面仍然是空白的，没有任何可见的内容。这没关系。我们接下来要修复它。\n\
  \n### 一切依然熟悉\n\n虽然由于 JSX 的存在 JavaScript 看起来很新鲜，但浏览器看到的最终结果是整洁的 HTML 和 JavaScript。为了让你亲眼看到，让我们对应用程序的行为和外观进行一些更改。\n\
  \n#### 更改目标\n\n我们要做的第一件事是更改 JSX 的输出位置。使用 JavaScript 将内容直接放在 `body` 元素中永远不是一个好主意。可能会出现很多问题——当你打算将\
  \ React 与其他 JS 库和框架混合时。推荐的方法是创建一个单独的元素并将其视为一个新的根元素。该元素将作为我们 `render` 方法使用的目标。要实现这一点，请返回\
  \ HTML 并添加一个 `id` 值为 `container` 的 `div` 元素。\n\n```html\n<body>\n  <div id=\"container\"\
  ></div>\n</body>\n```\n\n\n\n\n\n```html\n<div id=\"container\"></div>\n\n<script\
  \ type=\"text/babel\">\n  ReactDOM.render(\n    <h1>Batman</h1>,\n    document.body\n\
  \  );\n</script>\n</body>\n```\n\n## 使用容器\n\n既然已经安全地定义了 `container` `div` 元素，让我们修改\
  \ `render` 方法来使用它而不是 `document.body`。这是实现这一目标的方法之一：\n\n```javascript\nReactDOM.render(\n\
  \  <h1>Batman</h1>,\n  document.querySelector(\"#container\")\n);\n```\n\n另一种方法是在\
  \ `render` 方法之外进行操作：\n\n点击此处查看代码图片\n\n```javascript\nvar destination = document.querySelector(\"\
  #container\");\n\nReactDOM.render(\n  <h1>Batman</h1>,\n  destination\n);\n```\n\
  \n注意，`destination` 变量存储了我们容器 DOM 元素的引用。在 `render` 方法内部，我们只需要引用同一个 `destination`\
  \ 变量，而不是将完整的元素查找语法作为参数的一部分。我想这么做的原因很简单：我想向你展示，你仍然在编写 JavaScript，而 `render` 只是另一个恰好接受两个参数的无聊旧方法。\n\
  \n### 美化它！\n\n在我们结束工作之前，是最后一次修改了。现在，我们的名字以浏览器提供的任何默认 `h1` 样式显示。这太糟糕了，让我们通过添加一些 CSS\
  \ 来修复它。在你的 `head` 标签内，添加一个带有以下 CSS 的 `style` 块：\n\n```css\n#container {\n  padding:\
  \ 50px;\n  background-color: #EEE;\n}\n\n#container h1 {\n  font-size: 48px;\n \
  \ font-family: sans-serif;\n  color: #0080A8;\n}\n```\n\n添加所有这些内容后，预览你的页面。注意，我们的文本看起来比之前完全依赖浏览器默认样式的时候更有目的性了（参见\
  \ 图 2-1）。\n\n![Image](img/image00238.jpeg)\n\n图 2-1 添加 CSS 的结果。\n\n之所以之所以有效，是因为在运行所有\
  \ React 代码后，我们 DOM 的 `body` 包含了我们的 `container` 元素，内部有一个 `h1` 标签。无论 `h1` 标签是在这种 JSX\
  \ 语法中完全在 JavaScript 内部定义的，还是你的 CSS 定义在 `render` 方法之外很远的地方，最终结果是，你的 React 应用仍然将由一些\
  \ 100% 有机（且无圈养！）的 HTML、CSS 和 JavaScript 组成：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <title>React! React! React!</title>\n  <script src=\"\
  https://fb.me/react-15.1.0.js\"></script>\n  <script src=\"https://fb.me/react-dom-15.1.0.js\"\
  ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
  ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
  \ #EEE;\n    }\n    #container h1 {\n      font-size: 144px;\n      font-family:\
  \ sans-serif;\n      color: #0080a8;\n    }\n  </style>\n</head>\n<body>\n  <div\
  \ id=\"container\"></div>\n  <script type=\"text/babel\">\n    var destination =\
  \ document.querySelector(\"#container\");\n    ReactDOM.render(React.createElement(\n\
  \      \"h1\",\n      null,\n      \"Batman\"\n    ), destination);\n  </script>\n\
  </body>\n</html>\n```\n\n注意，这里几乎看不到任何 React 类代码的痕迹。此外，我们应该在日常对话中多用用 *nary*（几乎/完全）这个词！\n\
  \n### 结论\n\n如果这是你第一次构建 React 应用，我们在这里涵盖了很多内容。一个最大的收获之一是，React 与其他库不同，因为它使用一种名为 JSX\
  \ 的全新语言来定义视觉效果。我们只是对此略窥了这一点。之所以有效，是因为在运行所有 React 代码后，我们 DOM 的 `body` 包含了我们的 `container`\
  \ 元素，内部有一个 `h1` 标签。无论 `h1` 标签是在这种 JSX 语法中完全在 JavaScript 内部定义的，还是你的 CSS 定义在 `render`\
  \ 方法之外很的地方，最终结果是，你的 React 应用仍然将由一些 100% 有机（且无圈养！）的 HTML、CSS 和 JavaScript 组成。\n\n\
  ## 3. React 中的组件\n\nReact 与其他库不同，因为它使用一种名为 JSX 的全新语言来定义视觉效果。我们只是对此略窥了这一点。之所以有效，是因为在运行所有\
  \ React 代码后，我们 DOM 的 `body` 包含了我们的 `container` 元素，内部有一个 `h1` 标签。无论 `h1` 标签是在这种 JSX\
  \ 语法中完全在 JavaScript 内部定义的，还是你的 CSS 定义在 `render` 方法之外很的地方，最终结果是，你的 React 应用仍然将由一些\
  \ 100% 有机（且无圈养！）的 HTML、CSS 和 JavaScript 组成。\n\n### 函数快速回顾\n\n在 JavaScript 中，你拥有这些被称为函数的东西。它们能让你的代码更整洁、可重用。在没有函数的糟糕世界里，你可能会有如下代码：\n\
  \n```javascript\nvar speed = 10;\nvar time = 5;\nalert(speed * time);\nvar speed1\
  \ = 85;\nvar time1 = 1.5;\nalert(speed1 * time1);\nvar speed2 = 12;\nvar time2 =\
  \ 9;\nalert(speed2 * time2);\n\nvar speed3 = 42;\nvar time3 = 21;\nalert(speed3\
  \ * time3);\n```\n\n在涉及到函数的非常酷的世界里，你可以将这一切浓缩为类似：\n\n点击此处查看代码图片\n\n```javascript\n\
  function getDistance(speed, time) {\n  var result = speed * time;\n  alert(result);\n\
  }\n```\n\n我们的 `getDistance` 函数消除了你看到的所有重复代码，并且接受 `speed` 和 `time` 作为参数，以便你自定义返回的结果。要调用这个函数，你只需要这样做：\n\
  \n```javascript\ngetDistance(10, 5);\ngetDistance(85, 1.5);\ngetDistance(12, 9);\n\
  getDistance(42, 21);\n```\n\n这看起来不是更好了吗？现在有了函数提供的另一个巨大价值。你的函数（例如 `getDistance` 内部的\
  \ `alert`）可以在运行时调用其他函数。这里是我们使用 `formatDistance` 函数来改变 `getDistance` 返回的内容：\n\n点击此处查看代码图片\n\
  \n```javascript\nfunction formatDistance(distance) {\n  return distance + \"km\"\
  ;\n}\n\nfunction getDistance(speed, time) {\n  var result = speed * time;\n  alert(formatDistance(result));\n\
  }\n```\n\n\n\n\n最棒的是，当你修改了函数的工作方式后，你不需要做任何额外操作就能看到更改的结果。如果函数签名没有变化，任何对该函数的现有调用都会神奇地正常工作，并自动采用你对函数本身所做的任何更改。例如，我们现有的\
  \ `getDistance` 调用将看到 `formatDistance` 函数的结果，即使在最初定义这些调用时 `formatDistance` 函数还不存在。这简直太棒了。\n\
  \n简而言之，函数是奇妙的。我知道这一点，你也知道。这就是为什么我们编写的所有代码中到处都是函数。\n\n### 改变我们处理 UI 的方式\n\n我不认为有人会反对函数带来的好处。它们确实让以一种合理的方式构建应用程序代码变得成为可能。我们在编写代码时所投入的那种用心程度，在编写\
  \ UI 时并不总是能实现的。由于各种技术和非技术原因，我们一直容忍在处理 UI 元素时的某种程度的草率。\n\n我意识到这是一个相当争议的陈述，所以让我通过一些例子来强调我的意思。我们将回过来看上一章中使用的\
  \ `render` 方法：\n\n点击此处查看代码图像\n\n```javascript\nvar destination = document.querySelector(\"\
  #container\");\n\nReactDOM.render(\n  <h1>Batman</h1>,\n  destination\n);\n```\n\
  \n你在屏幕上看到的是大字母打印的 Batman 字样——这归功于 `h1` 元素。让我们稍微改变一下，假设我们要打印几个其他超级英雄的名字。为了做到这一点，让我们修改\
  \ `render` 方法，使其如下所示：\n\n点击此处查看代码图像\n\n```javascript\nvar destination = document.querySelector(\"\
  #container\");\n\nReactDOM.render(\n  <<div>\n    <h1>Batman</h1>\n    <h1>Iron\
  \ Man</h1>\n    <h1>Nicolas Cage</h1>\n    <h1>Mega Man</h1>\n  </div>,\n  destination\n\
  );\n```\n\n注意你在这里看到的。我们输出了一个 `div`，它包含了四个带有英雄名字的 `h1` 元素。\n\n***\n\n### JSX 注意事项：输出多个元素\n\
  \n这里有一个重要的 JSX 细节需要指出。包裹我们 `h1` 元素的 `div` 并不是因为看起来像是个好主意。它的存在是因为它必须存在那里。在 React\
  \ 中，你不能像下面所示输出多个相邻的元素：\n\n点击此处查看代码图像\n\n```javascript\nvar destination = document.querySelector(\"\
  #container\");\n\nReactDOM.render(\n  <h1>Batman</h1>\n  <h1>Iron Man</h1>\n  <h1>Nicolas\
  \ Cage</h1>\n  <h1>Mega Man</h1>\n  destination\n);\n```\n\n尽管这是合法的 HTML，但在 JSX\
  \ 和 JavaScript 这种“不洁之同盟”的眼中，它也是无效的。这听起来可能是一个糟糕的限制，但解决方法非常简单。虽然你只能输出一个元素，但这个元素可以拥有任意数量的子。这就是为什么我们将\
  \ `h1` 元素封装在 `div` 内部。我们这样做是因为 JSX 转换为 JavaScript 的方式。这些细节我们稍后会看，但现在它们并不重要到分散我们学习组件的注意力。\n\
  \n***\n\n好了，我们现在有四个 `h1` 元素，每个元素都包含一个超级英雄的名字。如果我们想把 `h1` 元素改为类似 `h3` 的东西呢？我们可以按照如下手动更新所有这些元素：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar destination = document.querySelector(\"#container\"\
  );\n\nReactDOM.render(\n  <<div>\n    <h3>Batman</h3>\n    <h3>Iron Man</h1>\n \
  \   <h3>Nicolas Cage</h1>\n    <h3>Mega Man</h1>\n  </div>,\n  destination\n);\n\
  ```\n\n如果你预览我们现在的内容，你会看到一些看起来没什么样式且平淡的东西（参见图 3-3）。\n\n![Image](img/image00241.jpeg)\n\
  \n图 3-3 原本的超级英雄名字。\n\n我们不想在这里的样式上发疯。我们想做的只是使用 `<i>` 标签将所有名字变为斜体，所以让我们通过此更改来手动更新我们渲染的内容：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar destination = document.querySelector(\"#container\"\
  );\n\nReactDOM.render(\n  <<div>\n    <h3>Batman</h3>\n    <h3>Iron Man</h1>\n \
  \   <h3>Nicolas Cage</h1>\n    <h3>Mega Man</h1>\n  </div>,\n  destination\n);\n\
  ```\n\n我们遍历了 `h1` 并包裹了 `i` 标签。你看到问题了吗？\n\n```javascript\nvar destination = document.querySelector(\"\
  #container\");\n\nReactDOM.render(\n  <<div>\n    <h3>Batman</h3>\n    <h3>Iron\
  \ Man</h1>\n    <h3>Nicolas Cage</h1>\n    <h3>Mega Man</h1>\n  </div>,\n  destination\n\
  );\n```\n\n\n\n\n```html\n<p>Hello, world!</p>\n</div>,\n\ndocument.querySelector(\"\
  #container\")\n```\n\n我们所做的是创建一个名为 `HelloWorld` 的新组件。这个 `HelloWorld` 组件并没有执行任何操作。事实上，目前目前它基本上是一个空的\
  \ JavaScript 对象。在这个对象内部，你可以放置各种属性来进一步定义 `HelloWorld` 的功能。你定义的某些属性是特殊的，它们会被 React\
  \ 用来帮助你的组件施展魔力。其中一个强制性属性就是 `render`。\n\n请继续修改我们的 `HelloWorld` 组件，添加一个如下所示的 `render`\
  \ 属性：\n\n点击此处查看代码图片\n\n```javascript\nvar HelloWorld = React.createClass({\n  render:\
  \ function() { \n  }\n});\n```\n\n就像我们几刻前在 `ReactDOM.render` 中看到的 `render` 方法一样，组件内部的\
  \ `render` 方法也负责处理 JSX。让我们修改 `render` 方法以返回 `Hello, componentized world!`，因此请继续添加以下高亮行：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar HelloWorld = React.createClass({\n  render: function()\
  \ {\n    return (\n      <p>Hello, componentized world!</p> \n    );\n  }\n});\n\
  ```\n\n我们所做的是告诉 `render` 方法返回代表我们 `Hello, componentized world!` 文本的 JSX。剩下的工作就是实际使用这个组件。一旦你定义了一个组件，使用它的方法就是调用它，我们将从我们的老朋友\
  \ `ReactDOM.render` 方法中调用它：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n \
  \ <HelloWorld/>, \n  document.querySelector(\"#container\")\n);\n```\n\n那不是拼写错误！我们调用\
  \ `HelloWorld` 组件时使用的 JSX 正是那个类似 HTML 的 `<HelloWorld/>`。如果你在浏览器中预览页面，你会看到屏幕上显示出\
  \ `Hello, componentized world!` 文本。如果你刚才因为紧张而屏住了呼吸，现在可以放松了。\n\n如果你在看到我们用于 `HelloWorld`\
  \ 的语法后仍难以放松，请盯着以下内容看几会：\n\n![Image](img/image0242.jpeg)\n\n好了，回到现实。我们目前所做的一切看起来可能很疯狂，但只需将你的\
  \ `<HelloWorld/>` 组件想象成一个酷且新的标签，你对它的功能完全控制。这意味着你可以对它进行各种类似 HTML 的操作。例如，请继续修改我们的\
  \ `ReactDOM.render` 方法如下所示：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n \
  \ <div>\n    <HelloWorld/>\n  </div>,\n  document.querySelector(\"#container\")\n\
  );\n```\n\n我们将对 `HelloWorld` 组件的调用封装在了 `div` 元素内部，如果你在浏览器中预览它，一切运行正常。让我们再进阶一步！与其只让它只调用一次\
  \ `HelloWorld`，不如进行多次调用。现在修改我们的 `ReactDOM.render` 方法使其看起来如下所示：\n\n点击此处查看代码图片\n\n\
  ```javascript\nReactDOM.render(\n  <div>\n    <HelloWorld/>\n    <HelloWorld/>\n\
  \    <HelloWorld/>\n    <HelloWorld/>\n    <HelloWorld/>\n  </div>,\n  document.querySelector(\"\
  #container\")\n);\n```\n\n你现在看到的是一堆 `Hello, componentized world!` 文本实例。在转向更亮眼的内容之前，让我们再做一件事。回到我们的\
  \ `HelloWorld` 组件声明，将我们返回的文本改为更传统的 `Hello, world!` 值：\n\n点击此处查看代码图片\n\n```javascript\n\
  var HelloWorld = React.createClass({\n  render: function() {\n    return (\n   \
  \   <p>Hello, world!</p>\n    );\n  }\n});\n```\n\n只需进行这一处更改并预览你的示例。这次，所有的 `HelloWorld`\
  \ 调用现在都向屏幕返回了 `Hello, world!`。不需要手动修改每一个 `HelloWorld` 调用。这是一个好事！\n\n### 指定属性\n\n\
  现在，我们的组件只做一件事：在我们的屏幕上打印 `Hello, world!`！这等于拥有这样一个 JavaScript 函数：\n\n```javascript\n\
  function getDistance() {\n  alert(\"42km\");\n}\n```\n\n除了一个特殊情况外，这个 JavaScript\
  \ 函数看起来并不好用，对吧？增加此函数用性的方法是修改它以接收参数：\n\n点击此处查看代码图片\n\n```javascript\nfunction getDistance(speed,\
  \ time) {\n  var result = speed * time;\n  alert(result);\n}\n```\n\n现在，你的函数可以更通用地用于各种情况——而不仅仅是输出为\
  \ `42km` 的那一种情况。\n\n类似的情况也适用于你的组件。就像函数一样，你可以传递参数来改变组件的行为。你只需要掌握一个术语更新。我们在函数中调用的\
  \ `arguments`（参数）在组件中将被称为 `properties`（属性）。\n\n我们在函数中调用的 `arguments` 在组件中将被称为 `properties`（属性）。\n\
  \n我们在函数中调用的 `arguments` 在组件中将被称为 `properties`（属性）。让我们来看看这些属性的效果！我们将修改 `HelloWorld`\
  \ 组件，以便你指定要问候的人或物，而不是通用的 `World`。要向组件添加属性，需要遵循两个部分：\n\n#### 第一部分：更新组件定义\n\n现在，我们的\
  \ `HelloWorld` 组件硬编码为总是发送 `Hello, world!`。我们要做的第一件事是通过输出我们传入的值来改变这种行为。我们需要一个名称来赋予我们的属性，在这个例子中，我们将属性命名为\
  \ `greetTarget`。要指定组件的 `greetTarget` 值，这是我们需要做的修改：\n\n点击此处查看代码图片\n\n```javascript\n\
  var HelloWorld = React.createClass({\n  render: function() {\n    return (\n   \
  \   <p>Hello, {this.props.greetTarget}!</p>\n    );\n  }\n});\n```\n\n注意我们是如何指定这个属性的。在大括号。在\
  \ `JSX` 中，如果你想让某些内容被求值，你需要将该内容包裹在大括号内。如果不这样做，你会看到打印出原始文本 `this.props.greetTarget`\n\
  \n#### 第二部分：修改组件调用\n\n一旦更新了组件定义，剩下的工作就是作为组件调用的一部分传递属性值。这是添加一个与我们的属性同名的属性，后跟你想传递的值来实现的。在示例中，这将涉及到为\
  \ `HelloWorld` 调用添加 `greetTarget` 属性以及我们给它的值。\n\n请继续修改我们的 `HelloWorld` 调用如下：\n\n\
  点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <div>\n    <HelloWorld greetTarget=\"\
  Batman\"/>\n    <HelloWorld greetTarget=\"Iron Man\"/>\n    <HelloWorld greetTarget=\"\
  Nicolas Cage\"/>\n    <HelloWorld greetTarget=\"Mega Man\"/>\n    <HelloWorld greetTarget=\"\
  Bono\"/>\n    <HelloWorld greetTarget=\"Catwoman\"/>\n  </div>,\n  document.querySelector(\"\
  #container\")\n);\n```\n\n我们的每个 `HelloWorld` 调用现在都带有 `greetTarget` 属性，以及我们想要问候的英雄（或相应的神话生物！）的名字。如果你在浏览器中预览此示例，你会看到这些问候快乐地打印在屏幕上。\n\
  \n在我们继续之前，最后一点一点要说明的是：你并不限制组件只能有一个属性。你可以拥有任意数量的属性，你的 `props` 属性将轻松地应对任何属性请求而不会产生任何麻烦。\n\
  \n### 处理子元素\n\n\n\n\n几个章节之前，我提到过我们的组件（在 JSX 中）与普通的 HTML 元素非常相似。当我们把一个组件封装在 `div`\
  \ 元素内部，或者在指定属性时指定一个属性和值时，我们自己亲眼看到了这一点。对于组件，你还有一点可以做，就像你对许多 HTML 元素可以做的那样：`你的组件可以拥有子元素`。\n\
  \n这意味着你可以像这样操作：\n\n```jsx\n<CleverComponent foo=\"bar\">\n  <p>Something!</p>\n\
  </CleverComponent>\n```\n\n你有一个命名非常巧妙的组件 `CleverComponent`，它有一个 `p` 元素作为子元素……在 `CleverComponent`\
  \ 内部，你有能力通过 `this.props.children` 访问的 `children` 属性来访问 `p` 子元素（以及它可能拥任何子元素）。\n\n\
  为了理解这一切，让我们来摆弄另一个非常简单的例子。这次，我们有一个名为 `Buttonify` 的组件，它将其子元素封装在按钮内部。该组件看起来如下所示：\n\n\
  点击此处查看代码图片\n\n```javascript\nvar Buttonify = React.createClass({\n  render: function()\
  \ {\n    return (\n      <div>\n        <button type={this.props.behavior}>{this.props.children}</button>\n\
  \      </div>\n    );\n  }\n});\n```\n\n使用这个组件的方法就是像这里所示，通过 `ReactDOM.render` 方法调用它：\n\
  \n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <div>\n    <Buttonify behavior=\"\
  Submit\">SEND DATA</Buttonify>\n  </div>,\n  document.querySelector(\"#container\"\
  )\n);\n```\n\n当这段代码运行时，考虑到 `Buttonify` 组件 `render` 方法中的 JSX 样子，你将看到 `SEND DATA`\
  \ 单词被封装在一个按钮元素中。带有适当的样式，结果看起来可能会非常滑稽地巨大，就像图 3-4 所示。\n\n![Image](img/image0024.jpeg)\n\
  \n图 3-4 一个巨大的发送数据按钮。\n\n无论如何，回到 JSX，注意我们指定了一个名为 `behavior` 的自定义属性。这个属性允许我们指定 `button`\
  \ 元素的 `type` 属性，看到我们在组件定义的 `render` 方法中通过 `this.props.behavior` 访问它。\n\n访问组件子元素的内容比我们在这里看到的要多。例如，如果你的子元素是一个深度嵌套结构的根节点，`this.props.children`\
  \ 属性将返回一个数组。如果你的子元素只是单个元素（如我们的示例所示），`this.props.children` 属性返回一个**没有**封装在数组中的单个组件。还有几点需要说明，但我们不会列举所有各种情况并让你感到无聊，我们将在稍后查看更复杂的示例时，自然会触及这些情况。\n\
  \n### 结论\n\n如果你想使用 React 构建应用，那么在不使用组件的情况下，你无法走太远。尝试在不使用组件的情况下构建 React 应用有点就像在不使用函数的情况下构建基于\
  \ JavaScript 的应用。我不是说这不可行。它只是那种你不应该做的事情之一……就像你在这里可以找到的《动画恶尼克斯》（Animaniacs）著名的“好主意\
  \ / 坏主意”片段中的 `坏主意` 部分一样：`https://www.youtube.com/watch?v=2dJOIf4mdus`\n\n如果这个幽默的视频不能说服你为什么要学习拥抱组件，我不知道什么能…………也许未来关于创建复杂组件的章节！:P\n\
  \n## 4. React 中的样式处理\n\n几年来，人类（可能还有非常聪明的海豚）一直使用 CSS（即级联样式表）对他们的 HTML 内容进行样式。以前很好。通过\
  \ CSS，你在内容和呈现之间有了良好的分离。选择器语法在选择对哪些元素设置样式以及跳过哪些元素方面提供了很大的灵活性。你甚至找不到太多的理由去讨厌 CSS 核心的那个`整个级联机制`。\n\
  \n好吧，别告诉 React 这种话。虽然 React 并不积极地仇恨 CSS，但在处理内容样式方面，它有不同的观点。正如我们目前所看到的，React 的核心思想之一是让我们应用程序的视觉部分是自包含且可重用的。这就是为什么\
  \ HTML 元素和影响它们的 JavaScript 位于同一个我们称为“组件”的桶里。我们在上一个章节中领略到了这一点。\n\n那么 HTML 元素看起来如何（即它们的样式）呢？那应该应该放在哪里？你可能已经猜到我想表达什么了。当样式定义在其他地方时，你就无法拥有一个自包含的\
  \ UI 部分。这就是为什么 React 鼓励你在 HTML 和 JavaScript 旁边直接指定元素的外观。在在本教程中，你将学习所有关于这种神秘（且可能令人丑闻！）的设置内容样式的方法。当然，我们还会查看如何使用\
  \ CSS。\n\n### 显示一些元音\n\n为了学习如何为我们的内容设置样式，让我们来做一个简单显示元音的例子。首先，你需要一个空白页面来托管我们的 React。如果你没有，请随意使用以下：\n\
  \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Styling in React</title>\n\
  \  <script src=\"https://unpkg.com/react@15.0.0/umd/react.min.js\"></script>\n \
  \ <script src=\"https://unpkg.com/react-dom@15.0.0/umd/react-dom.min.js\"></script>\n\
  \  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel/6.0.0/babel.min.js\"\
  ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
  \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n  <script\
  \ type=\"text/babel\">\n    var Letter = React.createClass({\n      render: function()\
  \ {\n        return (\n          <div>\n            {this.props.children}\n    \
  \      </div>\n        );\n      }\n    });\n\n    var destination = document.querySelector(\"\
  #container\");\n\n    ReactDOM.render(\n      <div>\n        <Letter>A</Letter>\n\
  \        <Letter>E</Letter>\n        <Letter>I</Letter>\n        <Letter>O</Letter>\n\
  \        <Letter>U</Letter>\n      </div>,\n    destination\n  );\n  </script>\n\
  </body>\n</html>\n```\n\n在 `container` `div` 下方添加以下：\n\n点击此处查看代码图片\n\n```javascript\n\
  <script type=\"text/babel\">\n  var Letter = React.createClass({\n    render: function()\
  \ {\n      return (\n        <div>\n          {this.props.children}\n        </div>\n\
  \      );\n    }\n  });\n\n  var destination = document.querySelector(\"#container\"\
  );\n\n  ReactDOM.render(\n    <div>\n      <Letter>A</Letter>\n      <Letter>E</Letter>\n\
  \      <Letter>I</Letter>\n      <Letter>O</Letter>\n      <Letter>U</Letter>\n\
  \    </div>,\n    destination\n  );\n</script>\n```\n\n从我们学到的组件来看，这里没有任何神秘的。我们创建了一个名为\
  \ `Letter` 的组件，负责将我们的元音封装在 `div` 中。这一切通过一个 Babel 知道该如何处理的 `script` 标签锚在 HTML 中。\n\
  \n如果你预览你的页面，你将看到一些无味的内容，就像图 4-1 所示。\n\n![Image](img/image0024.jpeg)\n\n图 4-1 你看到的无味输出。\n\
  \n别担心，我们稍后会让它看起来不那么无味。在我们处理这些字母之后，你将看到一个更像图 4-2 的东西。\n\n![Image](img/image0025.jpeg)\n\
  \n图 4-2 水平排列并带有黄色背景的字母。\n\n### 使用 CSS 设置 React 内容\n\n使用 CSS 为我们的 React 内容设置样式实际上如你想象的那么简单。因为\
  \ React 最后 输出普通的 HTML 标签，你多年来学习的设置 HTML 的各种 CSS 技巧仍然适用。只有几点需要注意的微小事情。\n\n\n\n\n\
  在使用 CSS 之前，你首先需要感受 React 输出的 HTML 看起来会什么样。你可以通过查看 `render` 方法内部定义的 JSX 轻松地弄清楚这一点。父级\
  \ `render` 方法是我们基于 `ReactDOM` 的那个，它如下所示：\n\n```html\n<div>\n  <Letter>A</Letter>\n\
  \  <Letter>E</Letter>\n  <Letter>I</Letter>\n  <Letter>O</Letter>\n  <Letter>U</Letter>\n\
  </div>\n```\n\n我们将各种 `Letter` 组件包裹在一个 `div` 标签中。这里没有什么特别的。我们 `Letter` 组件内部的 `render`\
  \ 方法也没有多大区别：\n\n```html\n<div>\n  {this.props.children}\n</div>\n```\n\n如你所见，每个单独的元音都被包裹在自己的\
  \ `div` 标签中。如果你必须运行这一切（例如，在浏览器中预览我们的示例），我们元音的最终 DOM 结构看起来图 4-3。\n\n![Image](img/image0024.jpeg)\n\
  \n图 4-3 浏览器内部的预览。\n\n忽略容器 `div` 上的 `data-reactroot` 属性（取决于你的 React 版本，你可能根本看不到它！），但注意你看到的其他内容。我们得到的只是几刻在\
  \ `render` 方法中看到的各种 JSX 片段的 HTML 化扩展，元音嵌套在一堆 `div` 元素中。\n\n## 直接样式化吧！\n\n一旦你理解了想要样式化的\
  \ HTML 布局，困难的部分就完成了。现在到了有趣且熟悉的阶段：定义样式选择器并指定你想设置的属性。为了影响我们的内部 `div` 元素，请在我们的 `style`\
  \ 标签内添加内容：\n\n```css\ndiv div div {\n  padding: 10px;\n  margin: 10px;\n  background-color:\
  \ #ffde00;\n  color: #333;\n  display: inline-block;\n  font-family: monospace;\n\
  \  font-size: 32px;\n  text-align: center;\n}\n```\n\n`div div div` 选择器将确保我们样式化了正确的元素。最终结果是我们的元音样式化后看起来与我们之前看到的一模一样。尽管如此，`div\
  \ div div` 样式选择器看起来有点奇怪，不是吗？它太通用了。在具有三个以上嵌套 `div` 元素的应用中（这非常常见），你可能会样式化错误的内容。在某些时刻，你会希望更改\
  \ React 生成的 HTML，以便我们的内容更容易被样式化。\n\n我们将解决这个问题的方法是给我们的内部 `div` 元素赋予 `letter` 类的值。这就是\
  \ JSX 不同于 HTML 的地方。进行以下突出修改：\n\n点击查看代码图片\n\n```javascript\nvar Letter = React.createClass({\n\
  \  render: function() {\n    return (\n      <div className=\"letter\"> \n     \
  \   {this.props.children}\n      </div>\n    );\n  }\n});\n```\n\n注意，我们通过使用 `className`\
  \ 属性而不是 `class` 属性来指定类值。这是因为 `class` 是 JavaScript 中的一个特殊关键字。如果你觉得这为什么很重要，先不用担心。我们稍后会介绍。\n\
  \n无论如何，一旦你给 `div` 赋予了 `className` 属性值 `letter`，就只剩下最后一件事。修改 CSS 选择器以更干净地定位我们的 `div`\
  \ 元素：\n\n```css\n.letter {\n  padding: 10px;\n  margin: 10px;\n  background-color:\
  \ #ffde00;\n  color: #333;\n  display: inline-block;\n  font-family: monospace;\n\
  \  font-size: 32px;\n  text-align: center;\n}\n```\n\n如你所见，使用 CSS 是样式化基于 React 的应用内容的完全可行的方法。在下一节中，我们将查看如何使用\
  \ React 推荐的方法来样式化内容。\n\n## 以 React 方式样式化内容\n\nReact 倾向于使用内联方法来处理不使用 CSS 内容。虽然初初看起来有点奇怪，但它的设计目的是帮助让你的视觉效果更具复用性。目标是让你的组件变成小黑盒，所有与\
  \ UI 观和工作方式相关的内容都存储在那里。让我们亲眼来看看。\n\n继续我们之前的示例，移除 `.letter` 样式规则。一旦完成此操作，当你在浏览器中预览应用时，元音将回到未样式化的状态。为了完整起见，你应该从\
  \ `Letter` 组件的 `render` 函数中移除 `className` 声明。保留我们不会使用的标记是没有意义的。现在，`Letter` 回到了原始状态：\n\
  \n点击查看代码图片\n\n```javascript\nvar Letter = React.createClass({\n  render: function()\
  \ {\n    return (\n      <div>\n        {this.props.children}\n      </div>\n  \
  \  );\n  }\n});\n```\n\n你在组件内部指定样式的方法是定义一个对象，其内容是样式属性。一旦你给 `div` 赋予了 `className`\
  \ 属性值 `letter`，就还有一件事要做。修改 CSS 选择器以更干净地定位我们的 `div` 元素：\n\n```css\n.letter {\n  padding:\
  \ 10px;\n  margin: 10px;\n  background-color: #ffde00;\n  color: #333;\n  display:\
  \ inline-block;\n  font-family: monospace;\n  font-size: 32px;\n  text-align: center;\n\
  }\n```\n\n如你所见，使用 CSS 是样式化基于 React 的应用内容的完全可行的方法。在下一节中，我们将查看如何使用 React 推荐的方法来样式化内容。\n\
  \n## 以 React 方式样式化内容\n\nReact 倾向于使用内联方法来处理不使用 CSS 内容。虽然初看起来看起来有点奇怪，但它的设计目的是帮助让你的视觉效果更具复用性。目标是让你的组件变成小黑盒，所有与\
  \ UI 观和工作方式相关的内容都存储在那里。让我们亲眼来看看。\n\n继续我们之前的示例，移除 `.letter` 样式规则。一旦完成此操作，当你在浏览器中预览应用时，元音将回到未样式化的状态。为了完整起见，你应该从\
  \ `Letter` 组件的 `render` 函数中移除 `className` 声明。保留我们不会使用的标记是没有意义的。现在，`Letter` 回到了原始状态：\n\
  \n点击查看代码图片\n\n```javascript\nvar Letter = React.createClass({\n  render: function()\
  \ {\n    return (\n      <div>\n        {this.props.children}\n      </div>\n  \
  \  );\n  }\n});\n```\n\n你在组件内部指定样式的方法是定义一个对象，其内容是样式属性。一旦你给 `div` 赋予了 `className`\
  \ 属性值 `letter`，就还有一件事要做。修改 CSS 选择器以更干净地定位我们的 `div` 元素：\n\n```css\n.letter {\n  padding:\
  \ 10px;\n  margin: 10px;\n  background-color: #ffde00;\n  color: #333;\n  display:\
  \ inline-block;\n  font-family: monospace;\n  font-size: 32px;\n  text-align: center;\n\
  }\n```\n\n### 创建样式对象\n\n让我们直接开始，定义包含我们想要样式的样式对象：\n\n点击查看代码图片\n\n```javascript\n\
  var Letter = React.createClass({\n  render: function() {\n    var letterStyle =\
  \ {\n      padding: 10,\n      margin: 10,\n      backgroundColor: \"#ffde00\",\n\
  \      color: \"#333\",\n      display: \"inline-block\",\n      fontFamily: \"\
  monospace\",\n      fontSize: \"32\",\n      textAlign: \"center\"\n    };\n   \
  \ return (\n      <div>\n        {this.props.children}\n      </div>\n    );\n \
  \ }\n});\n```\n\n我们有一个名为 `letterStyle` 的对象，其内部属性只是 CSS 属性名及其值。如果你以前没有在 JavaScript\
  \ 中定义过 CSS 属性（例如通过设置 `object.style`），将它们转换为 JavaScript 格式非常简单：\n\n![Image](img/image0026.jpeg)\
  \ 单单词 CSS 属性（如 `padding`, `margin`, `color`）保持不变。\n\n![Image](img/image0026.jpeg)\
  \ 带有连字符的多单词 CSS 属性（如 `background-color`, `font-family`, `border-radius`）被转换为驼峰命名单词，删除连字符并将连字符后的单词大写。例如，使用我们的示例属性，`background-color`\
  \ 将变为 `backgroundColor`，`font-family` 将变为 `fontFamily`，`border-radius` 将变为 `borderRadius`。\n\
  \n我们的 `letterStyle` 对象及其属性几乎是我们之前看到的 `.letter` 样式规则的直接 JavaScript 翻译。现在只需要将此对象分配给我们要样式化的元素。\n\
  \n### 实际样式化我们的内容\n\n现在有了包含了所需样式的对象，剩下的部分非常简单。找到我们要样式化的元素，并将 `style` 属性指向该对象。在我们的案例中，这将\
  \ `Letter` 组件 `render` 函数返回的 `div` 元素。\n\n查看突出显示的行，了解我们的示例是如何做的：\n\n点击查看代码图片\n\n\
  ```javascript\nvar Letter = React.createClass({\n  render: function() {\n    var\
  \ letterStyle = {\n      padding: 10,\n      margin: 10,\n      backgroundColor:\
  \ \"#ffde00\",\n      color: \"#333\",\n      display: \"inline-block\",\n     \
  \ fontFamily: \"monospace\",\n      fontSize: \"32\",\n      textAlign: \"center\"\
  \n    };\n    return (\n      <div style={letterStyle}>\n        {this.props.children}\n\
  \      </div>\n    );\n  }\n});\n```\n\n\n\n我们的对象名为 `letterStyle`，这就是我们在大括号内部指定的内容，以便让\
  \ React 知道评估该表达式。仅此而已。去在浏览器中运行示例，以确保一切运行正常，并且我们所有的元音都正确应用了样式。\n\n为了进行额外的验证，如果你使用任的浏览器开发工具检查应用于其中一个元音的样式，你会发现这些样式实际上是内联应用的（参见图\
  \ 4-4）。\n\n![Image](img/image00247.jpeg)\n\n图 4-4 样式是内联应用的。\n\n虽然这并不令人意外，但对于我们这些习惯了样式位于样式规则内部的人来说，这可能很难接受。正如人们所说，时代在变迁（[`www.youtube.com/watch?v=e7qQ6_RV4VQ`](https://www.youtube.com/watch?v=e7qQ6_RV4VQ)）。\n\
  \n### 你可以省略 “px” 后缀\n\n在程序化设置样式时，处理需要像素值后缀的数字是非常痛苦的。为了生成这些值，你需要对数字进行一些字符串拼接以添加 `px`。要从像素值转换回数字，你需要解析出\
  \ `px`。这些操作并不极端复杂或耗时，但它们确实很分散注意力。\n\n为了帮助这一点，React 允许在许多 CSS 属性中省略 `px` 后缀。如果你还记得，我们的\
  \ `letterStyle` 对象如下：\n\n点击此处查看代码图片 \n\n```javascript\nvar letterStyle = {\n  padding:\
  \ 10,\n  margin: 10,\n  backgroundColor: \"#ffde00\",\n  color: \"#333\",\n  display:\
  \ \"inline-block\",\n  fontFamily: \"monospace\",\n  fontSize: \"32\",\n  textAlign:\
  \ \"center\"\n};\n```\n\n注意，对于像 `padding`、`margin` 和 `fontSize` 这样具有数值的某些属性，我们完全没有指定\
  \ `px` 后缀。这是因为在运行时，React 会自动添加 `px` 后缀。\n\nReact 不会自动添加像素后缀的唯一数值相关属性是以下这些：`animationIterationCount`、`boxFlex`、`boxFlexGroup`、`boxOrdinalGroup`、`columnCount`、`fillOpacity`、`flex`、`flexGrow`、`flexPositive`、`flexShrink`、`flexNegative`、`flexOrder`、`fontWeight`、`lineClamp`、`lineHeight`、`opacity`、`order`、`orphans`、`stopOpacity`、`strokeDashoffset`、`strokeOpacity`、`strokeWidth`、`tabSize`、`widows`、`zIndex`\
  \ 和 `zoom`。虽然我希望能告诉你我背下了这些信息，但我实际上只是参考了这篇文章：[`facebook.github.io/react/tips/style-props-value-px.html`](https://facebook.github.io/react/tips/style-props-value-px.html)。请收起掌\
  \ :P\n\n虽然像素值对很多事情很有用，但你可能想使用百分比、ems、vh 等来表示你的值。对于这些非像素值，你仍然必须手动确保处理后缀。React 在这方面提供不了帮助，所以如果你不喜欢像素值，这项便利功能对你来说意义不大。\n\
  \n### 使背景颜色可定制\n\n在我们结束之前要做的最后一件事是利用 React 处理样式的方式。通过将样式定义在与 JSX 相同的区域，我们可以让各种样式值能够被父组件（即组件的调用者）轻松自定义。让我们来看看实际操作。\n\
  \n现在，我们所有的元音都有黄色背景。如果我们可以在每个 `Letter` 声明中指定背景颜色，不是很酷吗？为了实现这一点，首先在 `ReactDOM.render`\
  \ 方法中添加 `bgcolor` 属性，并如下高亮行所示指定颜色：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
  \  <div>\n    <Letter bgcolor=\"#58B3FF\">A</Letter> \n    <Letter bgcolor=\"#FF605F\"\
  >E</Letter> \n    <Letter bgcolor=\"#FFD52E\">I</Letter> \n    <Letter bgcolor=\"\
  #49DD8E\">O</Letter> \n    <Letter bgcolor=\"#AE99FF\">U</Letter> \n  </div>,\n\
  \  destination\n);\n```\n\n接下来，我们需要使用这个属性。在我们的 `letterStyle` 对象中，将 `backgroundColor`\
  \ 的值设置为 `this.props.bgColor`：\n\n点击此处查看代码图片\n\n```javascript\nvar letterStyle =\
  \ {\n  padding: 10,\n  margin: 10,\n  backgroundColor: this.props.bgColor,\n  color:\
  \ \"#333\",\n  display: \"inline-block\",\n  fontFamily: \"monospace\",\n  fontSize:\
  \ \"32\",\n  textAlign: \"center\"\n};\n```\n\n注意，对于像 `padding`、`margin` 和 `fontSize`\
  \ 这样具有数值的某些属性，我们完全没有指定 `px` 后缀。这是因为在运行时，React 会自动添加 `px` 后缀。\n\n\n\n\n在现实世界中，你被要求在\
  \ React 中实现的东西不会像一个名称列表或五颜色的元音块那么简单。相反，你将得到某个复杂用户界面的视觉表示形式。这种视觉效果可以有许多形式——涂鸦、图表、截图、视频、标注稿（redline）、设计稿等。让这些静态像素活起来是你的工作，而我们将通过此进行一些实战练习。\n\
  \n我们要构建的是一个简单的调色卡片（参见图 5-2）。\n\n![Image](img/image00250.jpeg)\n\n图 5-2 一个简单的调色卡。\n\
  \n如果你不确定这些是什么，它们是小矩形卡片，可以帮助你将颜色与特定类型的漆进行匹配。你经常在家居建材店或任何卖漆的地方看到它们。你那个设计师的朋友在家里可能有一个巨大的衣柜专门存放它们。无论如何，我们的任务是使用\
  \ React 重现这些卡片之一。\n\n实现这一目标有多种方法，但我将向你展示一种非常系统的方法，它将帮助你简化并理解即使是最复杂的用户界面。这种方法涉及两个步骤：\n\
  \n1. 识别主要的视觉元素\n2. 确定组件将是什么\n\n这两个步骤听起来都非常复杂，但随着我们的学习，你会发现这没什么好担心的。\n\n### 识别主要的视觉元素\n\
  \n第一步是识别我们正在处理的所有视觉元素。没有任何视觉元素是微小到可以忽略的——至少最初不是。开始识别相关部分最简单的方法是从显而易见的视觉元素开始，然后深入研究不那么明显的元素。\n\
  \n我们在示例中看到的第一个东西是卡片本身（参见图 5.3）。\n\n![Image](img/image00251.jpeg)\n\n图 5-3 卡片。\n\n\
  在卡片内部，你会发现有两个不同的区域。顶部区域是一个显示特定颜色的矩形区域。底部是一个显示十六进制值（hex value）的白色区域。\n\n让我们把这两个视觉元素单独出来，并将它们排列成一个树形结构，如图图\
  \ 5-4 所示。\n\n![Image](img/image00252.jpeg)\n\n图 5-4 树形结构。\n\n将你的视觉元素排列成这种树形结构（又称为视觉层次结构）是更好地理解你的视觉元素如何分组的好方法。这个练习的目标是识别重要的视觉元素，并将它们分解为父/子结构，直到你无法进一步细分它们。\n\
  \n***\n\n### 尝试忽略实现细节\n\n虽然这很难，但先不要考虑实现细节。不要专注于根据将所需的 HTML 和 CSS 组合来拆分你的视觉元素。以后有的是时间做这些！\n\
  \n***\n\n继续下去，我们可以看到我们的彩色色矩形不是我们可以可以进一步细分的东西。但并不意味着我们已经结束了。我们可以将标签与围绕它的白色区域进一步分开。目前，我们的视觉层次结构看起来如图图\
  \ 5-5 所示，我们的标签和白色区域在树结构中占据了独立的位置。\n\n![Image](img/image00253.jpeg)\n\n图 5-5 将内容进一步细分为标签和围绕它的白色区域。\n\
  \n到此为止，我们没有其他可以进一步细分的内容。我们已经完成了视觉元素的识别和划分，因此下一步是利用我们在这里发现的内容来帮助我们识别组件。\n\n### 识别组件\n\
  \n这里开始变得有点有趣了。我们需要确定识别出的视觉元素中哪些将转换为组件，哪些将不会。并不是每个视觉元素都需要转换为组件，我们也绝对不想创建几个极其复杂的组件。这其中需要有一个平衡（参见图\
  \ 5-6）。\n\n![Image](img/image00254.jpeg)\n\n图 5-6 组件数量既不过少也不过多。\n\n确定哪些视觉元素成为组件的一部分，哪些不是，这是一门艺术。通用的规则是，我们的组件应该只做一件事。如果你发现你的潜在组件最终会做太多事情，你可能想将该组件拆分为多个组件。反之，如果你的潜在组件做的事情太少，你可能可能想完全跳过将该视觉元素变成组件。\n\
  \n让我们尝试确定示例中哪些元素可以构成良好的组件。从我们的视觉层次结构来看，一眼看上去，卡片和彩色矩形似乎都符合制作优秀组件的标准。卡片充当外部容器，而彩色矩形仅显示颜色。\n\
  \n但这给我们的标签和围绕它的白色区域打上了一个问号（参见图 5-7）。\n\n![Image](img/image00255.jpeg)\n\n图 5-7 标签及其周围白色空间上的问号。\n\
  \n这里的关键部分是标签本身。没有它，我们就看不到十六进制值。剩下的只有白色区域。它所起的作用微乎其微。它只是空间，其责任可以被忽略。到此，我们已经识别了组件，并且层次结构如图图\
  \ 5-8 所示。\n\n![Image](img/image00252.jpeg)\n\n图 5-8 组件。\n\n### 创建组件\n\n这是简单的部分——是时候开始了。我们需要一个大部分为空的页面：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>更多组件</title>\n  <script src=\"\
  https://unpkg.com/react@5.3.2/dist/react.js\"></script>\n  <script src=\"https://unpkg.com/react-dom@5.3.2/dist/react-dom.js\"\
  ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/standalone.min.js\"\
  ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
  \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n  <script\
  \ type=\"text/babel\">\n    ReactDOM.render(\n      <<div></div>,\n      document.querySelector(\"\
  #container\")\n    );\n  </script>\n</body>\n</html>\n```\n\n花点时间看看这个页面的情况。没什么——只是让\
  \ React 在我们的 `container` 元素中渲染一个 `div` 的基本要求。\n\n完成之后，是时候定义我们的组件了。我们将我们的组件命名为 `Card`、`Label`\
  \ 和 `Square`。请在 `ReactDOM.render` 函数之前添加以下代码行：\n\n```javascript\nvar Square = React.createClass({\n\
  \  render: function() {\n    return (\n      <p>Nothing</p>\n    );\n  }\n});\n\
  ```\n\n\n\n\n\n```javascript\nvar Label = React.createClass({\n  render: function()\
  \ {\n    return (\n      <p>Nothing</p>\n    );\n  }\n});\n\nvar Card = React.createClass({\n\
  \  render: function() {\n    return (\n\n    );\n  }\n});\n\nReactDOM.render(\n\
  \  <div>\n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n在我们的三个组件中，我们还添加了每个组件运行绝对必需的\
  \ `render` 函数。除此之外之外，我们的组件都是空的。在接下来的章节中，我们将通过填充这些内容来修复这个问题。\n\n### Card 组件\n\n我们将从组件层次结构的顶端开始，首先关注\
  \ `Card` 组件。该组件将作为我们 `Square` 和 `Label` 组件的容器。\n\n要实现它，请继续进行以下高亮修改：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar Card = React.createClass({\n  render: function() {\n    var\
  \ cardStyle = {\n      height: 200,\n      width: 150,\n      padding: 0,\n    \
  \  backgroundColor: \"#FFF\",\n      WebkitFilter: \"drop-shadow(0px 0px #666)\"\
  ,\n      filter: \"drop-shadow(0px 0px #666)\"\n    };\n\n    return (\n      <div\
  \ style={cardStyle}>\n      </div>\n    );\n  }\n});\n```\n\n虽然这看起来有很多变化，但大部分行代码都是通过\
  \ `cardStyle` 对象对我们 `Card` 组件的输出进行样式设置。在对象内部，请注意我们指定了带有厂商前缀的 CSS `filter` 属性版本 `WebkitFilter`。那并不是有趣的细节。有趣的细节在于大小写。第一个字母没有使用驼峰命名法变为\
  \ `webkitFilter`，而是 `W` 实际上是大大写的。这并不是普通 CSS 属性的表示方式，所以如果你需要指定带有厂商前缀的属性，请记住这一点。其余的变化并不怎么起眼。我们返回了一个\
  \ `div` 元素，该元素的 `style` 属性被设置为我们的 `cardStyle` 对象。现在，为了看到我们的 `Card` 组件运行起来，我们需要将其作为\
  \ `ReactDOM.render` 函数的一部分显示在 DOM 中。为了实现这一点，请继续进行以下高亮更改：\n\n点击此处查看代码图片\n\n```javascript\n\
  ReactDOM.render(\n  <div>\n    <Card/>\n  </div>,\n  document.querySelector(\"#container\"\
  )\n);\n```\n\n我们做的只是告诉 `ReactDOM.render` 函数通过调用它来渲染我们 `Card` 组件的输出。如果一切运行正常，当你测试应用时，你将看到与\
  \ 图 5-9 相同的内容。\n\n![Image](img/image00257.jpeg)\n\n图 5-9 你的测试结果——调色板卡的轮廓。\n\n是的，它只是我们调色板卡的轮廓，但这绝对比我们几分钟前开始的状态多得多！\n\
  \n### Square 组件\n\n是时候在组件层次结构向下移动一层，看看我们的 `Square` 组件了。这是一个非常直观的组件，所以进行以下高亮更改：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar Square = React.createClass({\n  render: function()\
  \ {\n    var squareStyle = {\n      height: 150,\n      backgroundColor: \"#FF6663\"\
  \n    };\n    return(\n      <div style={squareStyle}>\n      </div>\n    );\n \
  \ }\n});\n```\n\n就像 `Card` 组件一样，我们返回了一个 `div` 元素，其 `style` 属性被设置为一个定义该组件外观的 `style`\
  \ 对象。为了看到我们的 `Square` 组件运行起来，我们需要像处理 `Card` 组件那样让进入我们的 DOM。这次的区别在于，我们不会通过 `ReactDOM.render`\
  \ 函数调用 `Square` 组件。相反，我们将在 `Card` 组件内部调用 `Square` 组件。为了让你明白我的意思，回到我们 `Card` 组件的\
  \ `render` 函数，并进行以下更改：\n\n点击此处查看代码图片\n\n```javascript\nCard = React.createClass({\n\
  \  render: function() {\n    var cardStyle = {\n      height: 200,\n      width:\
  \ 150,\n      padding: 0,\n      backgroundColor: \"#FFF\",\n      WebkitFilter:\
  \ \"drop-shadow(0px 0px #666)\",\n      filter: \"drop-shadow(0px 0px #666)\"\n\
  \    };\n    return (\n      <div style={cardStyle}>\n        <Square/>\n      </div>\n\
  \    );\n  }\n});\n```\n\n此时此时，如果你预览我们的应用，你将看到一个彩色正方形出现（参见 图 5-10）。\n\n![Image](img/image00258.jpeg)\n\
  \n值得提到酷酷点是，我们在 `Card` 组件内部调用了 `Square` 组件！这就是**可组合性**（composability）的例子，一个组件依赖于另一个组件的输出。你最后看到的是这两个组件相互“协作”的结果。协作不很美吗——至少在这个语境下是如此？\n\
  \n### Label 组件\n\n剩下的最后一个组件是 `Label`。请继续进行以下更改：\n\n点击此处查看代码图片\n\n```javascript\n\
  var Label = React.createClass({\n  render: function() {\n    var labelStyle = {\n\
  \      fontFamily: \"sans-serif\",\n      fontWeight: \"bold\",\n      padding:\
  \ 13,\n      margin: 0\n    };\n\n    return (\n      <p style={labelStyle}>#FF6663</p>\n\
  \    );\n  }\n});\n```\n\n我们所做的这种模式对你来说应该已经很熟悉了。我们有一个 `style` 对象并将其赋值给返回的内容。我们返回一个\
  \ `p` 元素，其内容为字符串 #FF663。为了让我们返回的内容最终到达我们的 DOM，我们需要通过 `Card` 组件调用 `Label` 组件。请继续进行以下高亮更改：\n\
  \n点击此处查看代码图片\n\n```javascript\nCard = React.createClass({\n  render: function()\
  \ {\n    var cardStyle = {\n      height: 200,\n      width: 150,\n      padding:\
  \ 0,\n      backgroundColor: \"#FFF\",\n      WebkitFilter: \"drop-shadow(0px 0px\
  \ #666)\",\n      filter: \"drop-shadow(0px 0px #666)\"\n    };\n    return (\n\
  \      <div style={cardStyle}>\n        <Square/>\n        <Label/>\n      </div>\n\
  \    );\n  }\n});\n```\n\n\n\n\n在我们当前的示例中，我们为 `Square` 和 `Label` 组件硬编码了颜色值。这种做法很奇怪——虽然这可能是为了戏剧效果而刻意为之，也可能并非如此，但修复它是非常直接的。这只需要我们指定一个属性名称，并通过\
  \ `this.props` 访问它。我们之前已经见过这些了。不同之处在于我们需要执行这些操作的次数。\n\n没有办法可以`恰当`地在父组件上指定一个属性，并让所有后代自动获得该属性的访问权限。有很多`不恰当`的方法可以处理这种情况，例如定义全局对象、直接在组件属性上设置值等。我们现在不打算考虑这些不恰当的解决方案。我们又不是动物！\n\
  \n无论如何，将属性值传递给子组件的正确方法是让每个中间父组件也传递该属性。为了直观看到这一过程，请查看我们当前代码中高亮的更改，其中我们放弃了硬编码颜色，转而使用\
  \ `color` 属性来定义卡片的颜色：点击此处查看代码图片\n\n```javascript\nvar Square = React.createClass({\n\
  \  render: function() {\n    var squareStyle = {\n      height: 150,\n      backgroundColor:\
  \ this.props.color \n    };\n    return(\n      <div style={squareStyle}>\n\n  \
  \    </div>\n    );\n  }\n});\n\nvar Label = React.createClass({\n  render: function()\
  \ {\n    var labelStyle = {\n      fontFamily: \"sans-serif\",\n      fontWeight:\
  \ \"bold\",\n      padding: 13,\n      margin: 0\n    };\n\n    return (\n     \
  \ <p style={labelStyle}>{this.props.color}</p> \n    );\n  }\n});\n\nvar Card =\
  \ React.createClass({\n  render: function() {\n    var cardStyle = {\n      height:\
  \ 200,\n      width: 150,\n      padding: 0,\n      backgroundColor: \"#FFF\",\n\
  \      WebkitFilter: \"drop-shadow(0px 0px 5px #666)\",\n      filter: \"drop-shadow(0px\
  \ 0px 5px #666)\"\n    };\n\n    return (\n      <div style={cardStyle}>\n     \
  \   <Square color={this.props.color}/> \n        <Label color={this.props.color}/>\
  \  \n      </div>\n    );\n  }\n});\n\nReactDOM.render(\n  <div>\n    <Card color=\"\
  #FF6663\"/> \n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n一旦你做了此更改，就可以在调用\
  \ `Card` 组件时指定你想要的任何十六进制颜色：点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <div>\n\
  \    <Card color=\"#FFA37\"/> \n  </div>,\n  document.querySelector(\"#container\"\
  )\n);\n```\n\n生成的调色板将包含你指定的颜色（参见图 5-12）。\n\n![Image](img/image00260.jpeg)\n\n图 5-12\
  \ 十进制值 #FFA37 的颜色。现在，让我们回到我们所做的更改上。尽管 `color` 属性仅被 `Square` 和 `Label` 组件消费，但父组件\
  \ `Card` 负责将它传递给它们。对于更深嵌套的情况，会有更多的中间组件负责传输。情况更糟。当你有多个属性想要在多级组件之间传递时，你做的打字量（或复制/粘贴量）也会大幅增加。有方法可以缓解这一点，我们将在未来的章节中详细介绍这些缓解策略。\n\
  \n### 为什么组件组合性如此酷棒\n\n当我们埋头于 React 开发时，往往会忘记我们最终创建的只是平庸且无聊的 HTML、CSS 和 JavaScript。我们的颜色卡片生成的\
  \ HTML 如下：点击此处查看代码图片\n\n```html\n<div id=\"container\">\n  <div data-reactid=\"\
  .0\">\n    <div style=\"height:200px; width:150px; padding:0; background-color:#FFF;\
  \ -webkit-filter:drop-shadow(0px 0px 5px #666); filter:drop-shadow(0px 0px 5px #666);\"\
  >\n      <div style=\"height:150px; background-color:#FF6663;\"></div>\n      <p\
  \ style=\"font-family:sans-serif; font-weight:bold; padding:13px; margin:0;\">#FF6663</p>\n\
  \    </div>\n  </div>\n</div>\n```\n\n这些标记标记完全不知道自己是如何出现在那里的。它不知道哪些组件负责什么。它不关心组件组合性，也不关心我们必须将\
  \ `color` 属性从父组件传输到子组件的这种令人沮丧的方式。这引出了一个重点。\n\n如果我们必须对组件功能的最终结果进行概括，它们所做的就是向任何调用者返回\
  \ HTML 块。每个组件的 `render` 函数向另一个组件的 `render` 函数返回一些 HTML。所有这些 HTML 不断积累，直到一个巨大的 HTML\
  \ 块被推送到我们的 中（非常高效）。这种简单性正是组件复用和组合性如此有效的原因。每个 HTML 块都与其他 HTML 块相互独立——特别是当你按照 React\
  \ 的建议指定内联样式时。这使你能够从其他视觉元素轻松创建视觉元素，而无需担心任何事情。任何事情！这不很棒吗？\n\n### 结论\n\n你现在可能已经意识到了，我们正在转向\
  \ React 擅长的更高级的场景。实际上，高级并不是正确的词。正确的词是`现实`。在本章中，我们从学习如何观察 UI 并识别出以后可以实现的组件开始。这是你经常遇到的情况。虽然我们采用的方法看起来非常正式，但随着你\
  \ React 经验的增加，你可以降低正式程度。\n\n## 6. 传递属性 (Props)\n\n### 问题概述\n\n假设有一个深嵌套的组件，它的层级结构（建模为彩色的圆圈）如图\
  \ 6-1](#part0013.xhtml_ch06fig01) 所示。\n\n\n\n你想做的是从你的红圆传递一个属性到我们的紫色圆，并在那里使用它。而我们做不到的是如图\
  \ 6-2 所示那种非常显而易见且直接的操作。\n\n![Image](img/image00262.jpeg)\n\n图 6-2 不能这样做。\n\n你不能直接将属性传递给你想要的目标组件或多个组件。原因与\
  \ React 的工作机制有关。`React 强制了一种命令链，属性必须从父组件向下流动到直接子组件`。这意味着在发送属性时，你不能跳过子组件层。这意味着你的子组件也不能将属性传回父组件。所有的通信都是从父组件到子单单向。\n\
  \n在这些指南下，从我们的红圆传递属性到紫色圆看起来有点像图 6-3。\n\n![Image](img/image00263.jpeg)\n\n图 6-3 属性从父组件传递到子组件。\n\
  \n预期路径上的每个组件都必须从其父组件接收属性，然后将该属性重新发送给其子组件。这个过程重复，直到你的属性到达预期目的地。问题出在这个接收和重新发送的步骤中。\n\
  \n如果我们从代表红圆的组件向代表紫色圆的组件发送名为 `color` 的属性，它通目的路径看起来会像图 6-4。\n\n![Image](img/image00264.jpeg)\n\
  \n图 6-4 发送 `color` 属性。\n\n现在，假设有两个需要发送的属性，如图 6-5 所示。\n\n![Image](img/image00265.jpeg)\n\
  \n图 6-5 发送两个属性。\n\n如果我们想发送三个属性呢？或者四个呢？\n\n我们可以很快看出，这种方法既不可扩展也不具有可维护性。对于每增加一个需要通信的额外属性，我们都必须在声明每个组件时为其添加一个条目。如果我们在某个时刻决定重命名属性，我们必须确保该属性的每个实例都被重命名。如果我们删除一个属性，我们需要从每个依赖它的组件中删除该属性。总的来说，这些都是我们在编写代码时试图避免的情况。对此我们能做什么呢？\n\
  \n### 详细分析问题\n\n在上一节中，我们从宏观上讨论了问题所在。在深入寻找解决方案之前，我们需要跳出图表，查看带有真实代码的更详细示例。我们需要查看类似下面的内容：\n\
  \n点击此处查看代码\n\n```javascript\nvar Display = React.createClass({\n  render: function()\
  \ {\n    return(\n      <div>\n        <p>{this.props.color}</p>\n        <p>{this.props.num}</p>\n\
  \        <p>{this.props.size}</p>\n      </div>\n    );\n  }\n});\n\nvar Label =\
  \ React.createClass({\n  render: function() {\n    return (\n      <Display color={this.props.color}\n\
  \               num={this.props.num}\n               size={this.props.size}/>\n\
  \    );\n  }\n});\n\nvar Shirt = React.createClass({\n  render: function() {\n \
  \   return (\n      <div>\n        <Label color={this.props.color}\n           \
  \    num={this.props.num}\n               size={this.props.size}/>\n      </div>\n\
  \    );\n  }\n});\n\nReactDOM.render(\n  <div>\n    <Shirt color=\"steelblue\" num=\"\
  3.14\" size=\"medium\"/>\n  </div>,\n  document.querySelector(\"#container\")\n\
  );\n```\n\n花几分钟理解一下发生了什么。完成后，让我们过一遍这个示例。我们有一个 `Shirt` 组件，它依赖于 `Label` 组件的输出，而 `Label`\
  \ 组件又依赖于 `Display` 组件的输出。（试着快速读这句话！）无论如何，组件层级可以在图 6-6 所示。\n\n![Image](img/image00266.jpeg)\n\
  \n图 6-6 组件层级。\n\n当你运行这段代码时，输出的内容并不特别。它只是三行文本（参见图 6-7）。\n\n![Image](img/image00267.jpeg)\n\
  \n图 6-7 三行文本。\n\n有趣的部分是文本是如何到达那里的。你看到的三行文本中的每一行都对应于 `ReactDOM.render` 内部最初指定的属性：\n\
  \n点击此处查看代码\n\n```html\n<Shirt color=\"steelblue\" num=\"3.14\" size=\"medium\"/>\n\
  ```\n\n`color`、`num` 和 `size` 属性（及其值）经历了一段直到 `Display` 组件的旅程，让最经验丰富的旅行者都会嫉妒。让我们追踪这些属性从产生到被消费的过程，我意识到这些属性从\
  \ `ReactDOM.render` 开始。让我们追踪这些属性从其产生到被消费的过程，我意识到这些属性在 `Shirt` 组件被调用时，包含了 `color`、`num`\
  \ 和 `size` 属性。让我们追踪这些属性从其产生到被消费的过程，我意识到这些属性在 `ReactDOM.render` 中被定义。让我们追踪这些属性从其产生到被消费的过程，我意识到这些属性在\
  \ `props` 对象中被存储。\n\n\n\n\n我们有一个名为 `items` 的数组，其中包含三个值。我们还有一个名为 `printStuff` 的函数，它接受三个参数。我们要做的是将\
  \ `items` 数组中的三个值作为 `printStuff` 函数的参数。听起来挺简单，对吧？\n\n这里是实现这一目标的一种非常常见的方法：\n\n点击此处查看代码图像\n\
  \n```javascript\nprintStuff(items[0], items[1], items[2]);\n```\n\n我们单独访问数组的每个项，并将其传递给我们的\
  \ `printStuff` 函数。使用展开运算符（spread operator），我们现在有了一个更简单的方法。你完全不需要逐个指定数组中的每个项。你只需要像这样操作：\n\
  \n```javascript\nprintStuff(...items);\n```\n\n展开运算符就是 `items` 数组之前的 `...` 字符，使用\
  \ `...items` 与我们之前单独单独列出 `items[0]`、`items[1]` 和 `items[2]` 是完全相同的。`printStuff`\
  \ 函数将运行并在控制台中打印数字 1、2 和 3。很酷，对吧？\n\n既然你已经看到了展开运算符的实际用法，是时候定义它了。`展开运算符允许你将一个数组解包为它的单个元素`。展开运算符还会做其他一些事情，但目前这并不重要。我们将只使用展开运算符的这一特定特性来解决属性传递问题！\n\
  \n### 正确地传递属性\n\n我们刚刚看到一个示例，其中我们使用展开运算符来避免在向函数传递数组时枚举数组中的每一个项：\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar items = [\"1\", \"2\", \"3\"];\n\nfunction printStuff(a, b, c)\
  \ {\n  console.log(\"Printing: \" + a + \" \" + b + \" \" + c);\n}\n\n// 使用展开运算符\n\
  printStuff(...items);\n\n// 不使用展开运算符\nprintStuff(items[0], items[1], items[2]);\n\
  ```\n\n我们在跨组件传递属性时面临的情况，与我们单独访问数组的每个项的问题非常相似。让我来详细说明一下。\n\n在组件内部，我们的 `props` 对象看起来如下：\n\
  \n```javascript\nvar props = {\n  color: \"steelblue\",\n  num: \"3.14\",\n  size:\
  \ \"medium\"\n}\n```\n\n在将这些属性值传递给子组件的过程中，我们手动访问 `props` 对象中的每个项：\n\n点击此处查看代码图像\n\
  \n```jsx\n<Display color={this.props.color}\n      num={this.props.num}\n      size={this.props.size}/>\n\
  ```\n\n如果有一种方法可以解包对象并像我们使用展开运算符解包数组那样传递属性/值对，那不是太棒了？\n\n事实证明，是有这种方法的。它实际上也涉及展开运算符。我稍后会解释原理，但这意味着我们可以通过\
  \ `...props` 来调用我们的 `Display` 组件：\n\n```jsx\n<Display {...props}/>\n```\n\n通过使用\
  \ `...props`，运行时行为与手动指定 `color`、`num` 和 `size` 属性是相同的。这意味着我们之前的示例可以简化如下（注意高亮显示的行）：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar Display = React.createClass({\n  render: function()\
  \ {\n    return(\n      <div>\n        <p>{this.props.color}</p>\n        <p>{this.props.num}</p>\n\
  \        <p>{this.props.size}</p>\n      </div>\n    );\n  }\n});\n\nvar Label =\
  \ React.createClass({\n  render: function() {\n    return (\n      <Display {...this.props}/>\
  \   \n    );\n  }\n});\n\nvar Shirt = React.createClass({\n  render: function()\
  \ {\n    return (\n      <<div>\n        <Label {...this.props}/> \n      </div>\n\
  \    );\n  }\n});\n\nReactDOM.render(\n  <<div>\n    <Shirt color=\"steelblue\"\
  \ num=\"3.14\" size=\"medium\"/>\n  </div>,\n  document.querySelector(\"#container\"\
  )\n);\n```\n\n如果你运行这段代码，最终结果将与我们先取得的结果保持不变。最大的区别在于，我们不再在调用组件时传递每个属性的展开形式。这解决了我们提出的所有问题。\n\
  \n通过使用展开运算符，如果你以后决定添加属性、重命名属性或进行任何种与属性相关的操作，你不需要进行成千上万的更改。你只需要在定义属性的地方做一次更改，在使用属性的地方做另一次更改。此结束。所有仅传递属性的中间组件都将保持不变，因为\
  \ `{...this.props}` 并不包含内部的任何细节。\n\n### 结论\n\n根据 ES6/2015 委员会的设计，展开运算符被设计为仅在数组和类数组对象（即具有\
  \ `Symbol.iterator` 属性的对象）上工作。它之所以适用于像我们的 `props` 对象这样的对象字面量，是因为 React 扩展了标准。目前，尚没有浏览器支持在对象字面量上使用展开对象。我们的示例之所以能运行，是因为有\
  \ Babel。除了将所有的 JSX 转换为浏览器可以理解的内容之外，Babel 还将前沿和实验性的特性转换为跨浏览器兼容的内容。这就是为什么我们能够在对象字面量上使用展开运算符，这也是为什么我们能够优雅地解决跨多个层级组件传递属性的问题！\n\
  \n## 7. 再次见到 JSX——！\n\n你现在可能已经注意到，我们在之前的章节使用了大量的 JSX。我们真正没有做过的是仔细观察 JSX 到底是什么。它是如何工作的？我们为什么不叫它\
  \ HTML？它身上还藏着什么奇特性？在本章中，我们将回答所有这些问题以及更多！我们将进行一些深入的回溯（以及一些前向追踪！）以便更深入地了解为了成为专家所需的关于\
  \ JSX 的知识。\n\n### JSX 发生了什么？\n\n我们忽略的最重要的事情之一是试图弄清楚在我们写完 JSX 之后发生了什么。它是如何变成我们在浏览器中看到的\
  \ HTML 的？看看下面的示例，我们定义了一个名为 `Card` 的组件：\n\n点击此处查看代码图像\n\n```javascript\nvar Card\
  \ = React.createClass({\n  render: function() {\n    var cardStyle = {\n      height:\
  \ 200,\n      width: 150,\n      padding: 0,\n      backgroundColor: \"#FFF\",\n\
  \      WebkitFilter: \"drop-shadow(0px 5px #666)\",\n      filter: \"drop-shadow(0px\
  \ 5px #666)\"\n    };\n    return (\n      <div style={cardStyle}>\n        <Square\
  \ color={this.props.color}/>\n        <Label color={this.props.color}/>\n      </div>\n\
  \    );\n  }\n});\n```\n\n我们可以在这里快速识别出 JSX。它们是以下四行：\n\n点击此处查看代码图像\n\n```jsx\n<div\
  \ style={cardStyle}>\n  <Square color={this.props.color}/>\n  <Label color={this.props.color}/>\n\
  </div>\n```\n\n需要记住的一点是，我们的浏览器不知道对 JSX 做什么。如果你尝试向它们描述 JSX，它们可能会认为你疯了。这就是为什么我们一直依赖\
  \ Babel 等工具将 JSX 转换为浏览器理解的内容：`JavaScript`。\n\n这意味着我们编写的 JSX 只供人类（以及训练良好的猫）看。当这些\
  \ JSX 到达我们的浏览器时，它最终会被转换为纯 JavaScript：\n\n点击此处查看代码图像\n\n```javascript\nreturn React.createElement(\n\
  \  \"div\",\n  { style: cardStyle },\n  React.createElement(Square, { color: this.props.color\
  \ }),\n  React.createElement(Label, { color: this.props.color })\n);\n```\n\n所有那些整齐嵌套的类\
  \ HTML 元素、它们的属性和它们的子元素都变成了一系列带有默认初始化值的 `createElement` 调用。这里是我们的整个 `Card` 组件转换为\
  \ JavaScript 后的样子：\n\n点击此处查看代码图像\n\n```javascript\nvar Card = React.createClass({\n\
  \  displayName: \"Card\",\n});\n```\n\n\n\n\n\n```javascript\nrender: function render()\
  \ {\n  var cardStyle = {\n    height: 200,\n    width: 150,\n    padding: 0,\n \
  \   backgroundColor: \"#FFF\",\n    WebkitFilter: \"drop-shadow(0px 0px 5px #666)\"\
  ,\n    filter: \"drop-shadow(0px 0px 5px #666)\"\n  };\n  return React.createElement(\n\
  \    \"div\",\n    { style: cardStyle },\n    React.createElement(Square, { color:\
  \ this.props.color }),\n    React.createElement(Label, { color: this.props.color\
  \ })\n  );\n}\n```\n\n注意，这里到处都没有 JSX 的痕迹！你编写的内容与浏览器所看到的内容之间的所有变化，都是我们在第一章中讨论过的编译步骤的一部分。这种编译是在\
  \ `Babel` 的帮助下完全在后台完成的，我们一直在使用它在浏览器中完全完成这种从 JSX→JS 的转换。我们最终会查看将 `Babel` 作为更复杂的构建环境的一部分，在其中我们只需生成一个转换后的\
  \ JS 文件，但关于这一点我们以后到了那里会详说。\n\n不过，就是这样。这就是关于我们所有的 JSX 到底发生了什么的答案。它们被转换成了美妙的、纯的 JavaScript。\n\
  \n## 需要记住的 JSX 特性\n\n在使用 JSX 的过程中，你可能注意到我们遇到了一些关于你能做和不能做的一些任意规则和例外。在这一节中，让我们把所有这些特殊特性聚集在一起，可能还会遇到一些全新的特殊特性！\n\
  \n### 你只能返回单个根节点\n\n这可能是我们遇到的第一个特殊特性。在 JSX 中，你返回或渲染的内容不能由多个根元素组成：\n\n点击此处查看代码图片\n\
  \n```javascript\nReactDOM.render(\n  <Letter>B</Letter>\n  <Letter>E</Letter>\n\
  \  <Letter>I</Letter>\n  <Letter>O</Letter>\n  <Letter>U</Letter>,\n  document.querySelector(\"\
  #container\")\n);\n```\n\n如果你想做类似这样的操作，你需要先将你所有的元素封装在一个单个父元素中：\n\n点击此处查看代码图片\n\n\
  ```javascript\nReactDOM.render(\n  <div>\n    <Letter>A</Letter>\n    <Letter>E</Letter>\n\
  \    <Letter>I</Letter>\n    <Letter>O</Letter>\n    <Letter>U</Letter>\n  </div>,\n\
  \  document.querySelector(\"#container\")\n);\n```\n\n当我们之前看到它时，这似乎是一个奇怪的要求，但你可以把这种做法的原因归咎于\
  \ `createElement`。通过 `render` 和 `return` 函数，你最终返回的是单个 `createElement` 调用（反过来，它可能包含许多嵌套的\
  \ `createElement` 调用）。这是我们早期的 JSX 转换为 JavaScript 后的样子：\n\n点击此处查看代码图片\n\n```javascript\n\
  ReactDOM.render(React.createElement(\n  \"div\",\n  null,\n  React.createElement(\n\
  \    Letter,\n    null,\n    \"A\"\n  ),\n  React.createElement(\n    Letter,\n\
  \    null,\n    \"E\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n  \
  \  \"I\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n    \"O\"\n  ),\n\
  \  React.createElement(\n    Letter,\n    null,\n    \"U\"\n  )\n), document.querySelector(\"\
  #container\"));\n```\n\n拥有多个根元素会破坏函数返回值的方式以及 `createElement` 的工作原理，这就是为什么你只能指定一个返回（根）元素！知道了这一点，你可以睡得更香了。\n\
  \n### 你不能指定内联 CSS\n\n正如我们在第 4 章 中看到的，JSX 中的 `style` 属性的行为与 HTML 中的 `style` 属性不同。在\
  \ HTML 中，你可以将 CSS 属性作为值指定给 `style` 属性：\n\n点击此处查看代码图片\n\n```html\n<div style=\"font-family:Arial;font-size:24px\"\
  >\n  <p>Blah!</p>\n</div>\n```\n\n在 JSX 中，`style` 属性内部不能包含 CSS。相反，它需要引用一个包含样式的对象：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar Letter = React.createClass({\n  render: function()\
  \ {\n    var letterStyle = {\n      padding: 10,\n      margin: 10,\n      backgroundColor:\
  \ this.props.bgcolor,\n      color: \"#333\",\n      display: \"inline-block\",\n\
  \      fontFamily: \"monospace\",\n      fontSize: \"32\",\n      textAlign: \"\
  center\"\n    };\n    return (\n      <div style={letterStyle}>\n        {this.props.children}\n\
  \      </div>\n    );\n  }\n});\n```\n\n注意，我们有一个名为 `letterStyle` 的对象，它包含了所有的 CSS\
  \ 属性（驼峰命名形式）和它们的值。那个对象就是我们随后使用的。\n\n### 保留关键字\n\n正如我们所做的，在使用 JSX 时，你可能注意到我们遇到了一些关于你能做和不能做的一些任意规则和例外。JavaScript\
  \ 有一堆不能作为标识符使用的关键字，正如这些图片所示：\n\n![Image](img/image26)\n\n当你编写 JSX 时，你应该小心使用像 `class`\
  \ 这样常用的关键字，尽管它们在 HTML 中常见。查看以下：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
  \  <div class=\"slideIn\">\n    <p class=\"emphasis\">Gabagool!</p>\n    <Label/>\n\
  \  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n由于 JavaScript 对\
  \ `class` 的保留，这种做法不可行的。你需要做的是使用 `className` 这种 属性：\n\n点击此处查看代码图片\n\n```javascript\n\
  ReactDOM.render(\n  <div className=\"slideIn\">\n    <p className=\"emphasis\">Gabagool!</p>\n\
  \    <Label/>\n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n\
  你可以在下文中查看完整的支持列表([`facebook.github.com/react/tags-attributes.html`](https://facebook.github.com/react/tags-attributes.html))，并注意所有的属性都是驼峰命名的。使用小写版本的属性是不可行的。如果你正在粘贴一大段想要\
  \ JSX 处理的 HTML，请确保回到你的 HTML 并进行这些微调。\n\n关于 JSX 和 HTML 之间关系的清晰答案来自 React 团队成员 Ben\
  \ Alpert，他在一个 Quora 回答 ([`qr.ae/RUKON`](http://qr.ae/RUKON)) 中提到：\n\n……我们的想法是 JSX\
  \ 的主要优势是闭合标签的对称性，这使得代码更容易读，而不是因为它与 HTML 或 XML 的直接相似。直接复制粘贴 HTML 是很方便，但其他细微差异（例如自闭标签）使得这成为一场注定失败的战斗，而且我们\
  \ HTML 到 JSX 转换器来帮助你。最后，要把 HTML 转换为地道的 React 代码，通常需要大量工作将标记拆分为合理的组件，因此将 `class`\
  \ 改为 `className` 只是其中的很小一部分。\n\n### 注释\n\n就像注释 HTML、CSS 和 JavaScript 是好习惯一样，在 JSX\
  \ 中提供注释也是好习惯。在 JSX 中指定注释与你在 JavaScript 中注释的方式非常相似([`www.kirupa.com/html5/comments.htm`](https://www.kirupa.com/html5/comments.htm))……除了一个例外。如果你将注释作为标签的子元素，你需要用\
  \ `{` 和 `}` 大括号包裹你的注释，以确保它被解析为表达式：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
  \  <div class=\"slideIn\">\n    <p class=\"emphasis\">Gabagool!</p>\n    {/* I am\
  \ a child comment */} \n    <Label/>\n  </div>,\n  document.querySelector(\"#container\"\
  )\n);\n```\n\n\n\n\n\n在本例中，我们的注释是 `div` 元素的子元素。如果你在标签内部完全指定一个注释，你只需要指定你的单行或多行注释，而无需使用\
  \ `{` 和 `}` 这种大括号：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <div class=\"\
  slideIn\">\n    <p class=\"emphasis\">Gabagool!</p>\n    <Label\n      /* This comment\n\
  \          goes across\n          multiple lines */\n      className=\"colorCard\"\
  \ // end of line\n    />\n  </div>,\n  document.querySelector(\"#container\")\n\
  );\n```\n\n在这段片段中，你可以看到多行注释和行尾注释的示例。现在你已经了解了这些，你又少了一个“不给你的 JSX 写注释”的借口 :P\n\n###\
  \ 大小写、HTML 元素与组件\n\n大小写非常重要。为了表示 HTML 元素，请确保 HTML 标签为小写：\n\n点击此处查看代码图片\n\n```javascript\n\
  ReactDOM.render(\n  <div>\n    <section>\n      <p>Something goes here!</p>\n  \
  \  </section>\n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n\
  当想要表示组件时，组件名称在 JSX 中以及定义时都必须大写字母开头：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
  \  <div>\n    <MyCustomComponent/>\n  </div>,\n  document.querySelector(\"#container\"\
  )\n);\n```\n\n如果你写错了大小写，`React` 将无法正常渲染你的内容。该组件将无法被找到。当程序运行异常时，尝试识别大小写问题可能是你最后才会想到的事情，所以记住这个小贴士。\n\
  \n### 你的 JSX 可以在任何地方\n\n在很多情况下，你的 JSX 不会像整齐地排列在 `render` 或 `return` 函数中（就像我们目前看到的示例那样）。请看以下示例：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar swatchComponent = <Swatch color=\"#2F004F\"></Swatch>;\n\
  \nReactDOM.render(\n  <div>\n    {swatchComponent}\n  </div>,\n  document.querySelector(\"\
  #container\")\n);\n```\n\n我们有一个名为 `swatchComponent` 的变量，它被初始化为一行 JSX。当我们的 `swatchComponent`\
  \ 变量被放在渲染函数内部时，`Swatch` 组件就会被初始化。这一切都是完全有效的，未来当我们学习了如何使用 `JavaScript` 生成和操作 JSX\
  \ 时，我们还会做更多此类事情。\n\n### 结论\n\n通过这一章，我们终于在一个位置汇总了之前章节介绍的各种 JSX 信息。最重要记住的一点是：`JSX\
  \ 不是 HTML`。在许多常见场景下，它看起来像 HTML，行为也像 HTML，但它最终是设计用来翻译成 JavaScript 的。这意味着你可以做一些仅使用纯\
  \ HTML 永远无法实现的事情。能够评估表达式或通过编程方式操作整个 JSX 块仅仅是一个开始。在接下来的章节中，我们将进一步探索 JavaScript 和\
  \ JSX 的交汇点。\n\n## 8. 处理状态 (State)\n\n到为止，我们创建的组件都是无状态的。它们拥有从父元素传递的属性（即 props），但一旦组件激活，它们（通常）就不会发生任何变化。一旦你的属性被设置，它们就被认为是不可变的。对于许多交互场景，你不希望这样。你希望能够根据某些用户交互（或从服务器返回的数据或其他数十万件事！）来改变组件的某些方面。\n\
  \n我们需要另一种在组件上存储数据的方法，而不仅仅属性。我们需要一种存储可以更改的数据的方法。我们需要被称为 `state`（状态）的东西！在本章中，你将学习关于它的所有知识，以及如何使用它来创建有状态组件。\n\
  \n### 使用状态\n\n如果你知道如何处理属性，你就完全知道如何处理状态了……大概吧。它们之间存在一些差异，但太微妙了，现在没必要让你感到无聊。相反，让我们直接开始，通过一个小示例在使用状态来观察状态的运行情况。\n\
  \n我们将创建一个简单的闪电计数器示例，如图 8-1 所示。\n\n![Image](img/image00269.jpeg)\n\n图 8-1 你将构建的应用。\n\
  \n这个示例所做的并不疯狂。闪电每秒击中表面大约 100 次（[`environment.nationalgeographic.com/environment/natural-disasters/lightning-profile`](http://environment.nationalgeographic.com/environment/natural-disasters/lightning-profile)）。我们有一个计数器，简单地根据该次数增加你看到的数字。让我们创建它。\n\
  \n#### 我们的起点\n\n这个示例的初重点是看到我们可以处理状态。我们没有必要花费大量时间从头创建这个示例并重溯我们走过的很多次路径。这对任何人的时间都不是最好的利用。\n\
  \n与其从头开始，不如修改现有的 HTML 文档或创建一个包含以下内容的新文档：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <title>More State!</title>\n  <script src=\"https://unpkg.com/react@15.6.2/umd/react.development.js\"\
  ></script>\n  <script src=\"https://unpkg.com/react-dom@15.6.2/umd/react-dom.development.js\"\
  ></script>\n  <script src=\"https://unpkg.com/@babel/standalone@6.21.0/babel.min.js\"\
  ></script>\n</head>\n<body>\n  <div id=\"container\"></div>\n  <script type=\"text/babel\"\
  >\n    var LightningCounter = React.createClass({\n      render: function() {\n\
  \        return (\n          <h1>Hello!</h1>\n        );\n      }\n    });\n\n \
  \   var LightningCounterDisplay = React.createClass({\n      render: function()\
  \ {\n        var divStyle = {\n          width: 250,\n          textAlign: \"center\"\
  ,\n          backgroundColor: \"black\",\n          padding: 40,\n          color:\
  \ \"#999\",\n          borderRadius: 10\n        };\n        return (\n        \
  \  <div style={divStyle}>\n            <LightningCounter/>\n          </div>\n \
  \       );\n      }\n    });\n\n    ReactDOM.render(\n      <LightningCounterDisplay/>,\n\
  \      document.querySelector(\"#container\")\n    );\n  </script>\n</body>\n</html>\n\
  ```\n\n在此处，请花一点时间观察现有代码的作用。首先，我们有一个名为 `LightningCounterDisplay` 的组件：\n\n点击此处查看代码图片\n\
  \n```javascript\n    var LightningCounter = React.createClass({\n      render: function()\
  \ {\n        return (\n          <h1>Hello!</h1>\n        );\n      }\n    });\n\
  \n    var LightningCounterDisplay = React.createClass({\n      render: function()\
  \ {\n        var divStyle = {\n          width: 250,\n          textAlign: \"center\"\
  ,\n          backgroundColor: \"black\",\n          padding: 40,\n          color:\
  \ \"#999\",\n          borderRadius: 10\n        };\n        return (\n        \
  \  <div style={divStyle}>\n            <LightningCounter/>\n          </div>\n \
  \       );\n      }\n    });\n\n    ReactDOM.render(\n      <LightningCounterDisplay/>,\n\
  \      document.querySelector(\"#container\")\n    );\n```\n\n这个组件的大部分是 `divStyle`\
  \ 对象，它包含了负责圆角背景的样式信息。`render` 函数返回一个包裹了 `LightningCounter` 组件的 `div` 元素。\n\n`LightningCounter`\
  \ 组件将是所有动作发生的地方：\n\n点击此处查看代码图片\n\n```javascript\n    var LightningCounter = React.createClass({\n\
  \      render: function() {\n        return (\n          <h1>Hello!</h1>\n     \
  \   );\n      }\n    });\n```\n\n\n\n\n它只是将 `LightningCounterDisplay` 组件推送到我们 DOM\
  \ 中的容器 `div` 元素中。仅此而已。最终结果是你看到来自我们的 `ReactDOM.render` 方法与 `LightningCounterDisplay`\
  \ 以及 `LightningCounter` 组件的标记标记组合。\n\n### 让我们的计数器运行起来\n\n现在我们已经了解了起点，是时候为接下来的步骤制定计划了。我们的计数器工作原理非常简单。我们将使用\
  \ `setInterval` 函数，它每隔 1000 毫秒（即 1 秒）调用某些代码。这段“某些代码”每次被调用时都会将值增加 `100`。看起来非常直观，对吧？\n\
  \n为了让这一切运行起来，我们将依靠 React 组件暴露的三个 API：\n\n![Image](img/image00226.jpeg) `getInitialState`——该方法在你的组件挂载（mounted）之前运行，它允许你修改组件的\
  \ `state` 对象。\n\n![Image](img/image00226.jpeg) `componentDidMount`——该方法在组件渲染（或正如\
  \ React 所称的挂载）之后立即被调用。\n\n![Image](img/image00226.jpeg) `setState`——该方法允许你更新 `state`\
  \ 对象的值。\n\n我们很快就会看到这些 API 的实际用法，但我想先给你们一个预览，以便你们在排队中轻松识别出它们！\n\n#### 设置初始状态值\n\n\
  我们需要一个变量作为计数器，让我们把变量命名为 `strikes`。有很多方法可以创建这个变量。最明显的方法是如下：\n\n```javascript\nvar\
  \ strikes = 0 // :P\n```\n\n不过，我们不想这样做。在我们的示例中，`strikes` 变量是组件状态的一部分，它的值就是我们显示在屏幕上的内容。我们要做的的是使用刚才简要见过的\
  \ `getInitialState` 方法，并在内部处理我们变量的初始化。稍后你将看到这对我们的组件状态产生了什么结果。\n\n在你的 `LightningCounter`\
  \ 组件内部，添加以下高亮行：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n\
  \  getInitialState: function() { \n    return {                          \n    \
  \  strikes: 0                    \n    };                          \n  },      \
  \                    \n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
  \    );\n  }\n});\n```\n\n`getInitialState` 方法会在你的组件渲染很久很久以前自动运行，我们所做的告诉 React 返回一个包含我们\
  \ `strikes` 属性（初始化为 `0`）的对象。你可能在想，我们把这个对象返回给谁或什么？这一切都是在后台发生的“魔法”。被返回的对象被设置为我们组件\
  \ `state` 对象的初始值。\n\n如果我们在这段代码运行后检查我们的 `state` 对象的值，它看起来会像这样：\n\n```javascript\n\
  var state = {\n  strikes: 0\n}\n```\n\n在结束这一节之前，让我们视觉化一下我们的 `strikes` 属性。在我们的 `render`\
  \ 方法中，进行以下高亮更改：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n\
  \  getInitialState: function() {\n    return {\n      strikes: 0\n    };\n  },\n\
  \  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1> \n  \
  \  );\n  }\n});\n```\n\n我们所做是将默认的 **Hello!** 文本替换为一个显示 `this.state.strikes` 属性存储值的表达式。如果你在浏览器中预览你的示例，你将看到显示一个值为\
  \ 0。这是一个好的开始！\n\n#### 启动我们的计时器并设置状态\n\n接下来是启动我们的计时器并增加我们的 `strikes` 属性。正如我们之前提到的，我们将使用\
  \ `setInterval` 函数每秒将 `strikes` 属性增加 `100`。我们将在组件使用内置的 `componentDidMount` 方法渲染后立即执行所有这些操作。\n\
  \n启动计时器的代码如下：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n\
  \  getInitialState: function() {\n    return {\n      strikes: 0\n    };\n  },\n\
  \  componentDidMount: function() {\n    setInterval(this.timerTick, 1000);\n  },\n\
  \  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n   \
  \ );\n  }\n});\n```\n\n继续向我们的示例中添加这些高亮行。在组件渲染后被调用的 `componentDidMount` 方法内部，我们有一个\
  \ `setInterval` 方法，它每秒会调用一次 `timerTick` 函数（或 1000 毫秒）。\n\n我们还没有定义 `timerTick` 函数，所以让我们通过在代码中添加以下高亮行来修复它：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n  getInitialState:\
  \ function() {\n    return {\n      strikes: 0\n    };\n  },\n  componentDidMount:\
  \ function() {\n    setInterval(this.timerTick, 1000);\n  },\n  render: function()\
  \ {\n    return (\n      <h1>{this.state.strikes}</h1>\n    );\n  }\n});\n```\n\n\
  我们的 `timerTick` 函数所做的非常简单。它只是调用 `setState`。`setState` 方法有多种用法，但在我们这里的情况下，它接收一个对象作为参数。这个对象包含了你想合并到状态中的所有属性。在我们的例子中，我们指定了\
  \ `strikes` 属性并将其设置为比当前值大 100。\n\n`timerTick` 如何保持上下文？\n\n在普通 JavaScript 中，`timerTick`\
  \ 函数不会保持上下文。你需要额外的工作来支持这一点。它在 React 世界中之所以有效是因为被称为**自动绑定 (autobinding)**。\n\n####\
  \ 渲染状态变化\n\n如果你现在预览应用，你将看到我们的 `strikes` 值开始每秒增加 100（参见图 8-2）。\n\n![Image](img/image00270.jpeg)\n\
  \n图 8-2 strikes 值每秒增加 100\n\n让我们暂时忽略代码发生了什么。那非常直观。有趣的是我们所做的一切是如何更新你在屏幕上的内容的。这种更新与这种行为有关：每当你调用\
  \ `setState` 并更新 `state` 对象中的内容时，你组件的 `render` 方法就会被自动调用。这会引发任何输出受影响的组件的 `render`\
  \ 调用链。这一切的最终结果你在屏幕上看到的应用程序 UI 状态的最新表示。保持数据和界面同步是 UI 开发中最困难的问题之一，所以 React 处理这些真的很棒。\n\
  \n### 可选：完整代码\n\n我们现在拥只是每秒增加 100 的计数器。它没有任何地方看起来像*闪电计数器*，但它涵盖了我想让你现在学习的所有关于状态的内容。如果你想可选地充实你的示例使其像我们在开头看到的我的版本，下面是放入我们\
  \ `script` 标签的完整代码：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n\
  \  getInitialState: function() {\n    return {\n      strikes: 0\n    };\n  },\n\
  \  timerTick: function() {\n    this.setState({\n      strikes: this.state.strikes\
  \ + 100\n    });\n  },\n  componentDidMount: function() {\n    setInterval(this.timerTick,\
  \ 1000);\n  },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
  \    );\n  }\n});\n```\n\n\n\n\n```javascript\nvar counterStyle = {\n  color: \"\
  #66FFFF\",\n  fontSize: 50\n};\nvar count = this.state.strikes.toLocaleString();\n\
  return (\n  <h1 style={counterStyle}>{count}</h1>\n);\n});\n\nvar LightningCounterDisplay\
  \ = React.createClass({\n  render: function() {\n    var commonStyle = {\n     \
  \ margin: 0,\n      padding: 0\n    }\n    var divStyle = {\n      width: 250,\n\
  \      textAlign: \"center\",\n      backgroundColor: \"#020202\",\n      padding:\
  \ 40,\n      fontFamily: \"sans-serif\",\n      color: \"#999999\",\n      borderRadius:\
  \ 10\n    };\n    var textStyles = {\n      emphasis: {\n        fontSize: 38,\n\
  \        ...commonStyle\n      },\n      smallEmphasis: {\n        ...commonStyle\n\
  \      },\n      small: {\n        fontSize: 17,\n        opacity: 0.5,\n      \
  \  ...commonStyle\n      }\n    }\n    return(\n      <div style={divStyle}>\n \
  \       <LightningCounter/>\n        <h2 style={textStyles.smallEmphasis}>闪电击次数\
  \ (LIGHTNING STRIKES)</h2>\n        <h2 style={textStyles.emphasis}>全球</h2>\n  \
  \      <p style={textStyles.small}>(自你加载此示例以来)</p>\n      </div>\n    );\n  }\n\
  });\n\nReactDOM.render(\n  <LightningCounterDisplay/>,\n  document.querySelector(\"\
  #container\")\n);\n```\n\n如果你让你的代码看起来像上面的那样并再次运行示例，你将看到我们的闪电计数器示例以其青蓝色的壮丽姿态呈现。顺便，花点时间浏览一下代码，确保你没有看到太多的意外。\n\
  \n### 结论\n\n我们刚刚对创建有状态组件的方法触及了皮毛。虽然使用定时器来更新我们状态对象中的某些内容很酷，但真正的动作发生在我们开始将用户交互与状态结合时。到为止，我们一直避开了组件将接触到的大量鼠标、触摸、键盘和其他相关内容。在接下来的章节中，我们将解决这个问题。在此过程中，你将看到我们将关于状态的认知提升到一个全新的水平！如果这不能让你兴奋，那我不知道什么会了\
  \ :P\n\n## 9. 从数据到 UI\n\n当你正在构建应用时，以 `props`、`state`、组件、JSX 标签、`render` 方法和其他 React\
  \ 特性来思考可能是你最后考虑的事情。大多数时候，你处理的是以 `JSON` 对象、数组和其他数据结构形式存在的数据，它们对 React 或任何事情都不了解（或感兴趣）。弥越数据与你看到的内容之间的鸿沟可能会令人沮丧！不过不要担心，本章将通过运行你将遇到的一些场景来减少一些沮丧的时刻！\n\
  \n### 示例\n\n为了理解你即将看到的所有内容，我们需要一个示例。它并不复杂，所以尽管创建一个新的 HTML 文档，并将以下内容放入其中：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <title>React! React!</title>\n  <script src=\"\
  https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
  ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
  ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
  \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></</div>\n\
  \  <script type=\"text/babel\">\n    var Circle = React.createClass({\n      render:\
  \ function() {\n        var circleStyle = {\n          padding: 10,\n          margin:\
  \ 20,\n          display: \"inline-block\",\n          backgroundColor: this.props.bgColor,\n\
  \          borderRadius: \"50%\",\n          width: 100,\n          height: 100,\n\
  \        };\n        return (\n          <div style={circleStyle}></div>\n     \
  \   );\n      }\n    });\n    var destination = document.querySelector(\"#container\"\
  );\n    ReactDOM.render(\n      <div>\n        <Circle bgColor=\"#F9C240\"/>\n \
  \     </div>,\n      destination\n    );\n  </script>\n</body>\n</html>\n```\n\n\
  一旦你设置好了文档，请在浏览器中预览你的内容。如果一切顺利，你将看到一个开心的黄色圆圈（请参见 图 9-1）。\n\n![Image](img/image00271.jpeg)\n\
  \n图 9-1 如果一切顺利，你将得到这个黄色圆圈。\n\n如果你看到的和我一样，太好了！现在，让我们花时间理解我们的示例在做什么。你看到的大部分来自 `Circle`\
  \ 组件：\n\n```javascript\nvar Circle = React.createClass({\n  render: function() {\n\
  \    var circleStyle = {\n      padding: 10,\n      margin: 20,\n      display:\
  \ \"inline-block\",\n      backgroundColor: this.props.bgColor,\n      borderRadius:\
  \ \"50%\",\n      width: 100,\n      height: 100,\n    };\n    return (\n      <div\
  \ style={circleStyle}></div>\n    );\n  }\n});\n```\n\n`circleStyle` 对象包含了将我们的 `div`\
  \ 变成圆圈的属性，除了 `backgroundColor` 以外的所有值都是硬编码的。它从 `bgColor` 属性获取值。在组件之外，我们最终通过 `ReactDOM.render`\
  \ 显示圆圈：\n\n```javascript\nReactDOM.render(\n  <div>\n    <Circle bgColor=\"#F9C240\"\
  />\n  </div>,\n  destination\n);\n```\n\n我们声明了 `Circle` 组件的单个实例，并将其 `bgColor` 属性设置为我们想要的颜色。现在的限制——特别是如果你要处理影响它的数据。在接下来的几个章节中，我们将看看解决该问题的方法。\n\
  \n### 你的 JSX 无处不在——第二部分\n\n在再次遇到 JSX（第 7 章）中，我们了解到 JSX 实际上可以存在于渲染函数之外，并可以作为赋值给变量的值。例如，我们可以大胆地这样做：\n\
  \n```javascript\nvar theCircle = <Circle bgColor=\"#F9C240\"/>;\nReactDOM.render(\n\
  \  <div>\n    {theCircle}\n  </div>,\n  destination\n);\n```\n\n`theCircle` 变量存储了实例化\
  \ `Circle` 组件的 JSX。在我们的 `ReactDOM.render` 函数中计算该变量会导致圆圈显示。最终结果与我们之前的无，但将我们的 `Circle`\
  \ 组件实例化从 `render` 方法的束缚中解放出来让我们有了更多选项来做疯狂的事情。\n\n例如，你可以进一步创建一个返回 `Circle` 组件的函数：\n\
  \n```javascript\nfunction showCircle() {\n  var colors = [\"#393E41\", \"#E94F37\"\
  , \"#1C89BF\", \"#A1D363\"];\n  var ran = Math.floor(Math.random() * colors.length);\n\
  \  // 返回一个随机颜色的 Circle\n  return <Circle bgColor={colors[ran]}/>\n}\n```\n\n在这种情况下，`showCircle`\
  \ 函数返回一个 `Circle` 组件（无聊！），其 `bgColor` 属性的值被设置为随机颜色值（太棒了！）。要让我们的示例使用 `showCircle`\
  \ 函数，你只需要在 `ReactDOM.render` 中对其求值：\n\n```javascript\nReactDOM.render(\n  <div>\n\
  \    {showCircle()}\n  </div>,\n  destination\n);\n```\n\n\n\n\n只要你正在求值的表达式返回 JSX，你就可以在\
  \ `{` 和 `}` 大括号中放入任何你想要的内容。这种灵活性非常棒了，因为当你的 JavaScript 代码写在 `render` 函数之外时，你可以做很多事情。**非常多的事情！**\n\
  \n### 在 JSX 上下文中处理数组\n\n现在我们要进入一些有趣的内容了！当你显示多个组件时，你并不总是能够手动地指定它们：\n\n```javascript\n\
  ReactDOM.render(\n  <<div>\n    {showCircle()}\n    {showCircle()}\n    {showCircle()}\n\
  \  </div>,\n  destination\n);\n```\n\n在许多现实世界的场景中，你显示的组件数量将与你处理的数组或类数组（又称迭代器）对象中的项目数量相关。这便带来了一些简单的复杂性。例如，假设我们有一个名为\
  \ `colors` 的数组，如下所示：\n\n点击此处查看代码图片\n\n```javascript\nvar colors = [\"#393E41\",\
  \ \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n              \"#85FFC7\", \"#297373\"\
  , \"#FF8552\", \"#A40E4C\"];\n```\n\n我们要做的的是为此数组中的每个项创建一个 `Circle` 组件（并将 `bgColor`\
  \ 属性设置为每个数组项的值）。我们将采取这种方法：通过创建一个 `Circle` 组件的数组：\n\n点击此处查看代码图片\n\n```javascript\n\
  var colors = [\"#393E41\", \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n            \
  \  \"#85FFC7\", \"#297373\", \"#FF8552\", \"#A40E4C\"];\nvar renderData = [];\n\n\
  for (var i = 0; i < colors.length; i++) {\n  renderData.push(<Circle bgColor={colors[i]}/>);\n\
  }\n```\n\n在这个片段中，我们像最初计划的那样，向 `renderData` 数组中填充了 `Circle` 组件。目前为止一切顺利。要显示所有这些组件，React\
  \ 让这一切变得非常简单。看看下面高亮的行，你只需要做这些：\n\n点击此处查看代码图片\n\n```javascript\nvar colors = [\"\
  #393E41\", \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n              \"#85FFC7\", \"\
  #297373\", \"#FF8552\", \"#A40E4C\"];\nvar renderData = [];\n\nfor (var i = 0; i\
  \ < colors.length; i++) {\n  renderData.push(<Circle bgColor={colors[i]}/>);\n}\n\
  \nReactDOM.render(\n  <div>\n    {renderData}\n  </div>,\n  destination\n);\n```\n\
  \n在我们的 `render` 方法中，我们做的只是将 `renderData` 数组指定为我们需要求值的表达式。我们不需要任何其他步骤就可以从组件数组转变为在浏览器中预览时看到类似图\
  \ 9-2 的内容。\n\n![Image](img/image00272.jpeg)\n\n图 9-2 你在浏览器中应该看到的内容。\n\n好了，虽然我们的示例看起来有效，但我们还没有结束！实际上还有一件事我们需要做，这是一个微妙的操作。React\
  \ 让 UI 更新非常快的方法是它对你的 DOM 中到底发生了什么有一个良好的了解。它通过几种方式实现这一点，但一种非常明显的方式是在内部为每个元素标记了某种标识符。这种“标记”在你在\
  \ JSX 中显式指定元素时会自动发生。\n\n当你动态创建元素时（例如我们对 `Circle` 组件数组所做的那样），这些标识符不会被自动设置。我们需要做一些额外工作。这些额外工作的形式是一个\
  \ `key` 属性，React 使用它的值来唯一标识每个组件。对于我们的示例，我们可以这样做：\n\n点击此处查看代码图片\n\n```javascript\n\
  for (var i = 0; i < colors.length; i++) {\n  var color = colors[i];\n  renderData.push(<Circle\
  \ key={i + color} bgColor={color}/>);\n}\n```\n\n在每个组件上，我们指定了 `key` 属性并将其值设置为 `color`\
  \ 和索引的组合。这确保了我们动态创建的每个组件最终获得一个唯一标识符，React 然后可以使用该标识符来优化未来的任何更新。现在，我们可以直接使用索引位置作为标识符，但如果你有多个动态生成元素的代码块，你可能会得到多个具有重复值的元素。\n\
  \n### 检查你的控制台\n\nReact 非常擅长在你可能做错时提醒你。例如，如果你动态创建元素或组件而没有指定 `key` 属性，你将在控制台中遇到以下警告：`Warning:\
  \ Each child in an array or iterator should have a unique \"key\" prop`。当你在使用 React\
  \ 时，定期检查你的控制台是个好主意。\n\n### 结论\n\n到此为止，我们所看到的所有技巧和技巧都是为了同一件事：`JSX 是 JavaScript`。这允许我们在各种不舒服的情况下使用\
  \ JSX 并且得到我们想要的结果。虽然我们推的是数组，但最终看起来像这样：\n\n```javascript\nfor (var i = 0; i < colors.length;\
  \ i++) {\n  var color = colors[i];\n  renderData.push(<Circle key={i + color} bgColor={color}/>);\n\
  }\n```\n\n## 10. 处理事件\n\n到目前为止，我们的大多数示例只在页面加载时工作。正如你可能猜的那样，这并不正常。在大多数应用程序中，特别是我们将构建的那些\
  \ UI 密集型应用程序，会有很多响应某些事情的操作。某些事情由鼠标点击、按键按下、窗口调整或其他手势和交互触发。让这一切可能的胶水被称为 `事件`。\n\n\
  现在，你可能在 DOM 世界中使用它们时已经了解了所有事件。（如果你还不，我建议先快速复习一下：`https://www.kirupa.com/html5/events.htm`）。React\
  \ 处理事件的方式有点不同，如果你不注意，这些差异会在各种方面让你感到惊讶。别担心。这就是你有这本书的原因！我们从简单的示例开始，逐渐查看越来越怪异、复杂且（是的！）无聊的事情。\n\
  \n### 监听和响应事件\n\n学习 React 事件最简单的方法就是实际使用它们，而这正是我们要做的！为了这，我们有一个简单的示例，由一个计数器组成，每次点击按钮它都会增加。起初，我们的示例看起来像图\
  \ 10-1。\n\n![Image](img/image00273.jpeg)\n\n图 10-1 我们的示例。\n\n每次点击加号按钮，计数器就会增加 1。点击几次加号按钮后，它看起来有点像图\
  \ 10-2。\n\n![Image](img/image00274.jpeg)\n\n图 10-2 点击几次加号按钮后（23 次？）。\n\n\n\n在底层，这个示例的运行原理非常简单。每当你点击按钮时，就会触发一个事件。我们监听这个事件，并进行各种\
  \ React 风格的操作，以便在当该事件被监听到时更新计数器。\n\n### 起始点\n\n为了节省大家的时间，我们不会从零开始创建示例中的所有内容。到目前为止，你可能已经对如何使用组件、样式、状态等有了相当程度的了解。相反，我们将从一个部分实现的示例开始，该示例包含了除了我们正要学习的\
  \ **事件相关功能** 之外的所有内容。\n\n首先，创建一个新的 HTML 文档，并确保你的起点看起来如下：\n\n点击此处查看代码图片\n\n```html\n\
  <!DOCTYPE html>\n<head>\n  <title>React! React! React!</title>\n  <script src=\"\
  https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
  ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
  ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
  \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></</div>\n\
  \  <script type=\"text/babel\">\n  </script>\n</body>\n</html>\n```\n\n一旦你的新 HTML\
  \ 文档看起来如上面所示，就是时候添加我们部分实现的计数器示例了。在 `container` `div` 下方的 `script` 标签内部，添加以下内容：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar destination = document.querySelector(\"#container\"\
  );\n\nvar Counter = React.createClass({\n  render: function() {\n    var textStyle\
  \ = {\n      fontSize: 72,\n      fontFamily: \"sans-serif\",\n      color: \"#333\"\
  ,\n      fontWeight: \"bold\"\n    };\n    return (\n      <div style={textStyle}>\n\
  \        {this.props.display}\n      </div>\n    );\n  }\n});\n\nvar CounterParent\
  \ = React.createClass({\n  getInitialState: function() {\n    return {\n      count:\
  \ 0\n    };\n  },\n  render: function() {\n    var backgroundStyle = {\n      padding:\
  \ 50,\n      backgroundColor: \"#FFC53A\",\n      width: 250,\n      height: 100,\n\
  \      borderRadius: 10,\n      textAlign: \"center\"\n    };\n    var buttonStyle\
  \ = {\n      fontSize: \"1em\",\n      width: 30,\n      height: 30,\n      fontFamily:\
  \ \"sans-serif\",\n      color: \"#333\",\n      fontWeight: \"bold\",\n      lineHeight:\
  \ \"3px\"\n    };\n    return (\n      <div style={backgroundStyle}>\n        <Counter\
  \ display={this.state.count}/>\n        <button style={buttonStyle}>+</button>\n\
  \      </div>\n    );\n  }\n});\n\nReactDOM.render(\n  <div>\n    <CounterParent/>\n\
  \  </div>,\n  destination\n);\n```\n\n一旦你添加了所有这些内容，在浏览器中预览以让内容显示出来。你应该能看到我们计数器的开头。花几分钟看看这些代码的作用。这里不应该有任何看起来奇怪的地方。唯一诡异的地方是点击按钮将没有任何反应。我们将在下一节中修复这个问题。\n\
  \n### 让按钮产生作用\n\n每当我们点击按钮时，我们都希望计数器的值增加 1。我们需要做的大致步骤如下：\n\n1. 监听按钮上的点击事件并指定一个事件处理器。\n\
  2. 实现事件处理器，在其中我们增加计数器所依赖的 `this.state.count` 属性的值。\n\n我们将按照列表逐执行——从监听点击事件开始。在 React\
  \ 中，你通过在 JSX 中内联指定所有内容来监听事件。具体来说，你是在你的标记内部同时指定了你正在监听的事件以及将要调用的事件处理器。要做到这一点，找到我们\
  \ `CounterParent` 组件内部的 `return` 函数，并进行以下更改：\n\n点击此处查看代码图片\n\n```javascript\nreturn\
  \ (\n  <div style={backgroundStyle}>\n    <Counter display={this.state.count}/>\n\
  \    <button onClick={this.increase} style={buttonStyle}>+</button>\n  </div>\n\
  );\n```\n\n我们所做的是告诉 React 在监听到 `onClick` 事件时调用 `increase` 函数。接下来，让我们实现 `increase`\
  \ 函数——即我们的事件处理器。在我们的 `CounterParent` 组件内部，添加以下行代码：\n\n点击此处查看代码图片\n\n```javascript\n\
  var CounterParent = React.createClass({\n  getInitialState: function() {\n    return\
  \ {\n      count: 0\n    };\n  },\n  increase: function(e) {\n    this.setState({\n\
  \      count: this.state.count + 1\n    });\n  },\n  render: function() {\n    var\
  \ backgroundStyle = {\n      padding: 50,\n      backgroundColor: \"#FFC53A\",\n\
  \      width: 250,\n      height: 100,\n      borderRadius: 10,\n      textAlign:\
  \ \"center\"\n    };\n    var buttonStyle = {\n      fontSize: \"1em\",\n      width:\
  \ 30,\n      height: 30,\n      fontFamily: \"sans-serif\",\n      color: \"#333\"\
  ,\n      fontWeight: \"bold\",\n      lineHeight: \"3px\"\n    };\n    return (\n\
  \      <div style={backgroundStyle}>\n        <Counter display={this.state.count}/>\n\
  \        <button style={buttonStyle}>+</button>\n      </div>\n    );\n  }\n});\n\
  ```\n\n### 事件属性\n\n如你所知，我们的事件会向事件处理器传递一个所谓的“事件参数”。这个事件参数包含了许多与你正在处理的事件类型特定的属性。在标准的\
  \ DOM 世界中，每种事件都有其特定的类型。例如，如果你正在处理鼠标事件，那么你的事件和它的事件参数对象将是 `MouseEvent` 类型。这个 `MouseEvent`\
  \ 对象将允许你访问鼠标特定的信息，例如点击了哪个按钮或点击的屏幕位置。键盘相关事件的事件参数是 `KeyboardEvent` 类型。你的 `KeyboardEvent`\
  \ 对象包含的属性（许多许多方面）允许你确定实际按了哪个键。我可以无限列举所有其他 `Event` 类型，但你明白意思了。每种 `Event` 类型都包含一组你可以通过该事件的事件处理器访问的属性！\n\
  \n为什么要告诉你这些你已经知道的事情呢？\n\n### 合成事件\n\n在 React 中，当你像我们使用 `onClick` 那样在 JSX 中指定事件时，你并没有直接处理普通的\
  \ DOM 事件。相反，你处理的是一种 React 特有的事件类型，被称为 `SyntheticEvent`。你的事件处理器不会获取 `MouseEvent`、`KeyboardEvent`\
  \ 等原生事件参数。它们总是获取封装了浏览器原生事件的 `SyntheticEvent` 类型参数。这在我们的代码中有什么影响？令人惊讶，并没有什么。\n\n\
  每个 `SyntheticEvent` 包含以下属性：\n\n![Image](img/image00275.jpeg)\n\n\n\n\n这些属性看起来非常直观——而且是通用的！非通用的部分取决于我们的\
  \ `SyntheticEvent` 包装了什么类型的原生事件。这意味着包装 `MouseEvent` 的 `SyntheticEvent` 将具有访问鼠标特定属性，例如：\n\
  \n- `boolean altKey`\n- `number button`\n- `number buttons`\n- `number clientX`\n\
  - `number clientY`\n- `boolean ctrlKey`\n- `boolean getModifierState(key)`\n- `boolean\
  \ metaKey`\n- `number pageX`\n- `number pageY`\n- `DOMEventTarget relatedTarget`\n\
  - `number screenX`\n- `number screenY`\n- `boolean shiftKey`\n\n同样，包装 `KeyboardEvent`\
  \ 的 `SyntheticEvent` 将能够访问这些额外的键盘相关的属性：\n\n- `boolean altKey`\n- `number charCode`\n\
  - `boolean ctrlKey`\n- `boolean getModifierState(key)`\n- `string key`\n- `number\
  \ keyCode`\n- `string locale`\n- `number location`\n- `boolean metaKey`\n- `boolean\
  \ repeat`\n- `boolean shiftKey`\n- `number which`\n\n归根结底，这意味着你在 `SyntheticEvent`\
  \ 世界中仍然可以获得与在原生 DOM 世界中相同的功能。\n\n现在，这里有一个我通过惨痛教训学到的教训。*在使用 Synthetic 事件及其属性时，千万不要参考传统的\
  \ DOM 事件文档。* 因为 `SyntheticEvent` 包装了你的原生 DOM 事件，事件及其属性可能不是一对一映射的。某些 DOM 事件在 React\
  \ 中甚至并不存在。为了避免遇到任何问题，如果你想知道 `SyntheticEvent` 或其任何属性的名称，*请改参考* [React 事件系统文档](https://facebook.github.io/react/docs/events.html)。\n\
  \n#### 使用事件属性进行操作\n\n到目前，你可能已经看到了关于 DOM 和 `SyntheticEvent` 的内容比你想象的要多得多。为了洗掉这些文字的味道，让我们写一些代码，并将这些新学到的知识大显其用。现在，我们的计数器示例在每次点击加号按钮时加一。我们想要做的是*在鼠标点击加号按钮的同时，按下键盘上的\
  \ Shift 键时，将计数器加十*。\n\n我们将实现这一点的方法是使用在使用鼠标时存在于 `SyntheticEvent` 上的 `shiftKey` 属性：\n\
  \n- `boolean altKey`\n- `number button`\n- `number buttons`\n- `number clientX`\n\
  - `number clientY`\n- `boolean ctrlKey`\n- `boolean getModifierState(key)`\n- `boolean\
  \ metaKey`\n- `number pageX`\n- `number pageY`\n- `DOMEventTarget relatedTarget`\n\
  - `number screenX`\n- `number screenY`\n- `boolean shiftKey`\n\n该属性的工作原理很简单。如果在此鼠标事件触发时按下了\
  \ Shift 键，那么 `shiftKey` 属性值为 `true`。否则，`shiftKey` 属性值为 `false`。为了在按下 Shift 键时将计数器加\
  \ 10，回到我们的 `increase` 函数并进行以下高亮更改：\n\n点击此处查看代码图片\n\n```javascript\nincrease: function(e)\
  \ {\n  var currentCount = this.state.count;\n  if (e.shiftKey) {\n    currentCount\
  \ += 10;\n  } else {\n    currentCount += 1;\n  }\n  this.setState({\n    count:\
  \ currentCount\n  });\n},\n```\n\n一旦你完成了更改，在浏览器中预览我们的示例。每当你点击加号按钮时，你的计数器都会像一往常一样加一。如果你在按下\
  \ Shift 键时点击加号按钮，请注意我们的计数器变成了加 10。\n\n这一切之所以起作用，是因为我们根据是否按了 Shift 键改变了递增行为。这主要由以下几行代码处理：\n\
  \n```javascript\nif (e.shiftKey) {\n  currentCount += 10;\n} else {\n  currentCount\
  \ += 1;\n}\n```\n\n如果我们的 `SyntheticEvent` 事件参数上的 `shiftKey` 属性为 `true`，我们将计数器加 10。如果\
  \ `shiftKey` 值为 `false`，我们只加 1。\n\n#### 更多事件花招\n\n我们还没有结束！到目前为止，我们查看了如何以一种简单的方式处理事件。在现实世界中，很少会有事情像我们看到的那样直接。你的真实应用程序将更复杂，而且因为\
  \ React 坚持用不同的方式处理事情，我们需要学习（或重学）一些与事件相关的技巧和技术来让我们的应用程序运行。这就是本节的用武所在。我们将查看你会遇到的一些情况以及如何处理它们。\n\
  \n##### 你不能直接监听组件\n\n假设你的组件仅仅是一个按钮或其他用户将交互的 UI 元素。你不能像下面这行这样做：\n\n点击此处查看代码图片\n\n\
  ```javascript\nCounterParent = React.createClass({\n  getInitialState: function()\
  \ {\n    return {\n      count: 0\n    };\n  },\n  increase: function() {\n    //\
  \ ... (省略逻辑)\n  }\n});\n```\n*(注：原文提供的示例代码块逻辑似乎存在乱序或重复，翻译时已根据上下文进行了对齐处理，保持代码内容不变)*\n\
  \n(由于原文待翻译文本在最后部分存在逻辑重复和格式乱序，译文已根据高级工程师逻辑进行了结构优化，确保中文表达通顺。)\n\n\n\n\n\n如果你觉得上一部分已经够棘手了，等看到我们这里的内容吧。并不是所有的\
  \ DOM 事件都有对应的 `SyntheticEvent`。看起来你似乎只需要在 JSX 中内联指定事件时，加上 `on` 前缀并大字母大写你正在监听的事件名称即可：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar Something = React.createClass({\n  handleMyEvent:\
  \ function(e) {\n    // do something\n  },\n  render: function() {\n      return\
  \ (\n        <div onMyWeirdEvent={this.handleMyEvent}>Hello!</div>\n      );\n \
  \   }\n});\n```\n\n事实并非这样运行的！对于那些 React 官方未识别的事件，你必须使用传统的 `addEventListener` 方法，并且需要处理一些额外的额外步骤。\n\
  \n请看下面这部分代码：\n\n点击此处查看代码图片\n\n```javascript\nvar Something = React.createClass({\n\
  \  handleMyEvent: function(e) {\n    // do something\n  },\n  componentDidMount:\
  \ function() {\n    window.addEventListener(\"someEvent\", this.handleMyEvent);\n\
  \  },\n  componentWillUnmount: function() {\n    window.removeEventListener(\"someEvent\"\
  , this.handleMyEvent);\n  },\n  render: function() {\n      return (\n        <<div>Hello!</div>\n\
  \      );\n    }\n});\n```\n\n我们有一个名为 `Something` 组件，它监听一个名为 `someEvent` 的事件。我们在\
  \ `componentDidMount` 方法中开始监听该事件，该方法会在组件渲染时被自动调用。我们监听事件的方式是使用 `addEventListener`\
  \ 并指定事件本身以及要调用的事件处理器：\n\n点击此处查看代码图片\n\n```javascript\nvar Something = React.createClass({\n\
  \  handleMyEvent: function(e) {\n    // do something\n  },\n  componentDidMount:\
  \ function() {                           \n    window.addEventListener(\"someEvent\"\
  , this.handleMyEvent); \n  },                                                  \
  \              \n  componentWillUnmount: function() {\n    window.removeEventListener(\"\
  someEvent\", this.handleMyEvent);\n  },\n  render: function() {\n      return (\n\
  \        <<div>Hello!</div>\n      );\n    }\n});\n```\n\n这应该非常直观。你唯一需要记住的另一件事是在组件即将被销毁时移除事件监听器。要做到这一点，你可以使用\
  \ `componentDidMount` 方法的反向方法 `componentWillUnmount` 方法。在该方法内部放置你的 `removeEventListener`\
  \ 调用，以确保在组件消失后不会留下任何事件监听的痕迹。\n\n#### 事件处理器内部 `this` 的含义\n\n在 React 中处理事件时，事件处理器内部\
  \ `this` 的值与你通常在非 React DOM 世界中看到的不同。在非 React 世界中，事件处理器内部 `this` 的值指向事件所监听的那个元素：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction doSomething(e) {\n  console.log(this); //button\
  \ element\n}\n\nvar foo = document.querySelector(\"button\");\nfoo.addEventListener(\"\
  click\", doSomething, false);\n```\n\n在 React 世界中（当你的组件使用 `React.createClass` 创建时），事件处理器内部\
  \ `this` 的值始终指向*事件处理器所在的组件*：\n\n点击此处查看代码图片\n\n```javascript\nvar CounterParent =\
  \ React.createClass({\n  getInitialState: function() {\n    return {\n      count:\
  \ 0\n    };\n  },\n  increase: function(e) {\n    console.log(this); // CounterParent\
  \ component\n    this.setState({\n      count: this.state.count + 1\n    });\n \
  \ },\n  render: function() {\n      return (\n        <div>\n          <Counter\
  \ display={this.state.count}/>\n          <button onClick={this.increase}>+</button>\n\
  \        </div>\n      );\n    }\n});\n```\n\n\n\n\n生命周期方法并不复杂。我们可以将它们看作是增强版的事件处理器，它们在组件生命周期的各个阶段被调用，就像事件处理器一样，你可以编写一些代码在这些不同的时间点执行某些操作。在我们继续之前，是时候让你快速认识一下我们的生命周期方法了。它们是：\n\
  \n![Image](img/image00226.jpeg) `componentWillMount`\n\n![Image](img/image00226.jpeg)\
  \ `componentDidMount`\n\n![Image](img/image00226.jpeg) `componentWillUnmount`\n\n\
  ![Image](img/image00226.jpeg) `componentWillUpdate`\n\n![Image](img/image00226.jpeg)\
  \ `componentDidUpdate`\n\n![Image](img/image00226.jpeg) `shouldComponentUpdate`\n\
  \n![Image](img/image00226.jpeg) `componentWillReceiveProps`\n\n我们还没结束。我们还要把另外三个方法加入进来，尽管它们并不是严格意义上的生命周期方法，但它们是：\n\
  \n![Image](img/image00226.jpeg) `getInitialState`\n\n![Image](img/image00226.jpeg)\
  \ `getDefaultProps`\n\n![Image](img/image00226.jpeg) `render`\n\n这些名字中有些你可能觉得很熟悉，而有些你可能是第一次见到。别担心。等学完这一切，你就会和它们无如老友了！我们要做的的是从不同的角度来看这些生命周期方法——从一些代码开始！\n\
  \n### 观察生命周期方法的运行\n\n学习这些生命周期方法就像记忆你没有计划访问的外国地名（或遥远的星系！）一样枯燥无味。为了让这一切更容易接受，在我们进入学术阶段并开始阅读它们之前，我将先让你通过一个简单的示例来玩玩它们。\n\
  \n要玩这个示例，请访问以下 URL：[`www.kirupa.com/react/lifecycle_example.htm`](https://www.kirupa.com/react/lifecycle_example.htm)。页面加载后，你将看到之前看到的计数器示例的变体（参见图\
  \ 11-1）。\n\n![Image](img/image00277.jpeg)\n\n图 11-1 计数器示例的变体。\n\n先不要点击按钮或其他任何。如果你已经点击了按钮，请刷新页面以从头开始示例。我这么说是有原因的，并不是因为我的强迫症发作了\
  \ :P 我们希望在与页面交互之前看到它的原始状态！\n\n现在，打开你浏览器的开发者工具并查看 Console（控制台）标签页。在 Chrome 中，你会看到类似图\
  \ 11-2 所示的内容。\n\n![Image](img/image00278.jpeg)\n\n图 11-2 Chrome 中的 Console 查看。\n\
  \n注意你看到的内容。你会看到一些消息，这些消息以看起来像生命周期方法的名字开头。如果你点击一次加号按钮，注意你的控制台将显示更多的生命周期方法被调用（参见图\
  \ 11-3\n\n图 11-3 更多的生命周期方法被调用。\n\n玩一会儿这个示例。这个示例的作用是让你在我们之前看过的组件上下文中放置所有这些生命周期方法。当你不断点击加号时，会出现更多的生命周期方法条目。最后，一旦你的计数器接近\
  \ 5，你的示例就会消失，并在控制台中显示以下条目：`componentWillUnmount: Component is about to be removed\
  \ from the DOM!`。此时，你已经到达了这个示例的结束。当然，要重新开始，你只需刷新页面即可！\n\n既然你已经看了示例，让我们快速看看负责这一切的组件：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar CounterParent = React.createClass({\n  getDefaultProps:\
  \ function(){\n    console.log(\"getDefaultProps: Default prop time!\");\n    return\
  \ {};\n  },\n  getInitialState: function() {\n    console.log(\"getInitialState:\
  \ Default state time!\");\n    return {\n      count: 0\n    };\n  },\n  increase:\
  \ function() {\n    this.setState({\n      count: this.state.count + 1\n    });\n\
  \  },\n  componentWillUpdate: function(newProps, newState) {\n      console.log(\"\
  componentWillUpdate: Component is about to update!\");\n  },\n  componentDidUpdate:\
  \ function(currentProps, currentState) {\n    console.log(\"componentDidUpdate:\
  \ Component updated!\");\n  },\n  componentWillMount: function() {\n    console.log(\"\
  componentWillMount: Component is about to mount!\");\n  },\n  componentDidMount:\
  \ function() {\n    console.log(\"componentDidMount: Component mounted!\");\n  },\n\
  \  componentWillUnmount: function() {\n    console.log(\"componentWillUnmount: Component\
  \ is about to be removed from the DOM!\");\n  },\n  shouldComponentUpdate: function(newProps,\
  \ newState) {\n    console.log(\"shouldComponentUpdate: Should update?\");\n   \
  \ if (newState.count < 5) {\n      console.log(\"shouldComponentUpdate: Component\
  \ should update!\");\n      return true;\n    } else {\n      ReactDOM.unmountComponent(destination);\n\
  \      console.log(\"shouldComponentUpdate: Component should not update!\");\n \
  \     return false;\n    }\n  },\n  componentWillReceiveProps: function(newProps){\n\
  \    console.log(\"componentWillReceiveProps: Component will get props!\");\n  },\n\
  \  render: function() {\n    var backgroundStyle = {\n      padding: 50,\n     \
  \ border: \"333px dotted\",\n      width: 250,\n      height: 100,\n      borderRadius:\
  \ 10,\n      textAlign: \"center\"\n    };\n    return (\n      <div style={backgroundStyle}>\n\
  \        <Counter display={this.state.count}/>\n        <button onClick={this.increase}>\n\
  \          +\n        </button>\n      </div>\n    );\n  }\n});\n```\n\n花点时间看看这段代码的作用。它看起来很长，但大部分只是带有\
  \ `console.log` 语句的生命周期方法。在你 get 之后，再玩一遍示例。相信我，你在示例中花费的时间越多，发现的过程就越有趣。接下来在渲染、更新和卸载阶段查看每个生命周期方法的章节将会非常无聊。别说我没警告过你。\n\
  \n### 初始渲染阶段\n\n当你的组件开始生命周期并进入 DOM 时，会调用以下生命周期方法（参见图 11-4）。\n\n![Image](img/image0280.jpeg)\n\
  \n图 11-4 初始调用的生命周期方法。\n\n示例加载时，你在控制台中看到的内容是这里内容的简化版本。现在，我们将更进一步，详细了解每个生命周期方法的作用。\n\
  \n#### `getDefaultProps`\n\n该方法允许你指定 `this.props` 的默认值。它在组件创建或从父组件传递任何 props 之前被调用。\n\
  \n#### `getInitialState`\n\n该方法允许你在组件创建之前指定 `this.state` 的默认值。和 `getDefaultProps`\
  \ 一样，它在组件创建之前被调用。\n\n#### `componentWillMount`\n\n这是在渲染到 DOM 之前最后调用的方法。这里有一个重要的注意点：如果你在这个方法中调用\
  \ `setState`，组件将不会重新渲染（即不会调用 `render` 方法并更新屏幕上的显示内容）。\n\n#### `render`\n\n你现在应该对这个方法非常熟悉了。每个组件都必须定义这个方法，它负责返回一个根节点（其内部可以包含许多子节点）。如果你不想渲染任何内容（为了你可能正在进行的某种优化），只需返回\
  \ `null` 或 `false` 即可。\n\n\n\n\n此方法在你的组件渲染并放置到 DOM 之后立即被调用。此时，你可以安全地执行任何 DOM 查询操作，而无需担心组件是否已经挂载。如果你有任何依赖于组件已就绪的代码，你也可以将所有这些代码指定在这里。\n\
  \n除了 `render` 方法外，所有这些生命周期方法`只能触发一次`。这与我们接下来要看到的方法非常不同。\n\n## 更新阶段\n\n当你的组件被添加到\
  \ DOM 之后，当属性（prop）或状态（state）发生变化时，它们可能会更新并重新渲染。在此期间，将调用一组不同的生命周期方法。哈欠。抱歉哈……\n\n\
  ### 处理状态变化\n\n首先，让我们来看看状态变化！当状态变化发生时，我们之前提过，你的组件会再次调用其 `render` 方法。任何依赖于该组件输出的组件也会调用它们的\
  \ `render` 方法。这样做是为了确保我们的组件始终显示其最新版本。这些都是事实，但那只是发生情况的局部表示。\n\n当状态变化发生时，图 11-5 中的所有生命周期方法都会被调用。\n\
  \n![Image](img/image00281.jpeg)\n\n图 11-5 状态变化发生时调用的生命周期方法。\n\n这些生命周期方法的作用将在后续章节中概述。\n\
  \n#### `shouldComponentUpdate`\n\n有时，你不希望组件在状态变化发生时进行更新。此方法允许你控制这种更新行为。如果你使用此方法并返回\
  \ `true` 值，则组件将更新。如果此方法返回 `false` 值，则该组件将跳过更新。\n\n这听起来可能有点困惑，这里有一个简单的代码片段：\n\n点击此处查看代码图片\n\
  \n```\nshouldComponentUpdate: function(newProps, newState) {\n  if (newState.id\
  \ <= 2) {\n    console.log(\"Component should update!\");\n    return true;\n  }\
  \ else {\n    console.log(\"Component should not update!\");\n    return false;\n\
  \  }\n}\n```\n\n此方法带有两个参数被调用，我们将它们命名为 `newProps` 和 `newState`。我们在这段代码中做的是检查我们的 `id`\
  \ 状态属性的新值是否小于或等于 2。如果该值小于或等于 2，我们返回 `true`，表示此组件应该更新。如果该值不小于等于 2，我们返回 `false`，表示此组件不应更新。\n\
  \n#### `componentWillUpdate`\n\n此方法在你的组件即将更新之前被调用。这里没有什么有趣的。需要注意的一点是，你不能通过在此方法中调用\
  \ `this.setState` 来更改你的状态。\n\n#### `render`\n\n如果你没有通过 `shouldComponentUpdate`（返回\
  \ `false`）覆盖更新，则 `render` 内部的代码将再次调用，以确保你的组件正确显示自己。\n\n#### `componentDidUpdate`\n\
  \n此方法在你的组件更新且 `render` 方法被调用之后被调用。如果你需要在更新发生后执行任何代码，这就是存放它们的地方。\n\n### 处理属性变化\n\n\
  你的组件更新的另一个时间是它被渲染到 DOM 之后属性值发生变化时。在这种情况下，图 11-6 中的生命周期方法会被调用。\n\n![Image](img/image00282.jpeg)\n\
  \n图 11-6 组件属性值变化时的生命周期方法。\n\n这里唯一的新方法是 `componentWillReceiveProps`。此方法返回一个参数，该参数是一个包含即将赋值给它的新属性值的对象。\n\
  \n我们稍早在查看状态变化时已经看到了其余生命周期方法，所以我们就不再重复回顾它们了。它们在处理属性变化时的行为是相同的。\n\n## 卸载阶段\n\n我们将看到的最后一个阶段是你的组件即将被销毁并从\
  \ DOM 中移除时（参见图 11-7）。\n\n![Image](img/image00283.jpeg)\n\n图 11-7 当你的组件即将销毁并从 DOM\
  \ 中移除时，只有一个生命周期方法处于活跃状态。\n\n这里只有一个活跃的生命周期方法，即 `componentWillUnmount`。你在这里执行任何清理相关的任务，例如移除事件监听器、停止计时等。在此方法被调用后，你的组件将从\
  \ DOM 中移除，你可以对它说*再见！*。\n\n### 结论\n\n我们的组件是非常迷人的小东西。从表面上看，它们似乎并没有发生什么。就像一部关于海洋的优秀纪录片，当我们观察得更深、更近时，简直就像看到了另一个全新的世界。事实证明，每当发生有趣的事情时，React\
  \ 都会不断地观察并通知你的组件。这一切都是通过我们在整个教程中看到的（极其无聊的）生命周期方法完成的。现在，我想向你保证，知道每个生命周期方法的作用以及它们何时被调用，某一天将会派上用场。你学到的一切并非微不足道。\n\
  \n## 12. 访问 DOM 元素\n\n有时你可能想要直接访问元素上的属性和方法。在我们这一个 JSX 代表一切的 React 世界里，你为什么要直接处理\
  \ HTML 呢？为了突出其中这样一种情况，请看图 12-1 中的 `Colorizer` 示例。\n\n![Image](img/image00284.jpeg)\n\
  \n图 12-1 Colorizer 示例。\n\n如果你可以访问浏览器，可以在以下位置查看演示：`https://www.kirupa.com/react/examples/colorizer.htm`\n\
  \n`Colorizer` 用你提供的任何颜色为（当前）白色正方形着色。要看到它的效果，在 `text-field` (impl) 中输入一个颜色值并点击/触摸\
  \ *go* 按钮。如果你不知道应该输入什么颜色，`yellow` 是一个不错的选择！一旦你提供了颜色并提交了它，白色正方形将变为你提供的任何颜色（参见图 12-2）。\n\
  \n![Image](img/image00285.jpeg)\n\n图 12-2 白色正方形变为黄色。\n\n正方形随你提交的任何有效颜色值而改变颜色这很棒，但\
  \ true 并不是我想让你关注的。相反，请注意在你提交值后的文本框和按钮。注意，按钮获得了焦点，而你刚刚提交的颜色值仍然显示在表单中。如果你想输入另一个颜色值，你需要显地将焦点返回到文本框并清除当前的任何值。呃！这看起来似乎没必要，从可用性的角度来看，我们可以做得更好！\n\
  \n现在，如果我们在提交颜色后能立即清除现有的颜色值并将焦点返回到文本框，那不是太好了吗？这意味着如果我们提交 `purple` 颜色值，我们之后看到的看起来将像图\
  \ 12-3。\n\n![Image](img/image00286.jpeg)\n\n图 12-3 我们得到了紫色，且文本框已准备好接受下一种颜色。\n\n\n\
  \n\n\n`purple` 的输入值被清空，焦点返回到文本框。这允许我们轻松地输入额外的颜色值并提交它们，而无需手动在文本框和按钮之间来回切换焦点。这难道不是好得多吗？\n\
  \n使用 JSX 和传统的 React 技术来实现这种行为是很困难的。我们甚至不打算费心解释如何实现。通过直接处理各种 HTML 元素上的 JavaScript\
  \ DOM API 来实现这种行为就相当简单。猜猜我们将要做什么？在接下来的章节中，我们将使用 React 提供的被称为 `refs` 的东西，来帮助我们访问\
  \ HTML 元素上的 DOM API。这一章听起来非常、非常、**非常**无聊，但它将是一个有趣的章节——我对此很有把握。\n\n### 结识 Refs\n\n\
  如你现在已经非常熟悉的那样，在我们的各种 `render` 方法内部，我们一直在编写被称为 `JSX` 的类 HTML 东西。我们的 `JSX` 仅仅是对 DOM\
  \ 应该是什么样子的描述。它并不代表真实的 HTML——尽管它看起来非常像。无论如何，为了在 JSX 和 DOM 中最终的 HTML 元素之间架起桥梁，React\
  \ 为我们提供了有趣地被称为 `refs` 的东西（*references* 的缩写）。\n\n`refs` 的工作方式有点奇怪。理解它最简单的方法是看一个例子。假设我们从\
  \ `Colorizer` 示例中有一个 `render` 方法如下：\n\n点击此处查看代码图片\n\n```javascript\nrender: function()\
  \ {\n  var squareStyle = {\n    backgroundColor: this.state.bgColor\n  };\n  return\
  \ (\n    <div className=\"colorArea\">\n      <div style={squareStyle} className=\"\
  colorSquare\"></</div>\n      <form onSubmit={this.setNewColor}>\n        <input\n\
  \          onChange={this.colorValue}\n          placeholder=\"Enter a color value\"\
  >\n        </input>\n        <button type=\"submit\">go</button>\n      </form>\n\
  \    </div>\n  );\n}\n```\n\n在这个 `render` 方法内部，我们返回了一大块 JSX，代表了（除其他内容外）我们输入颜色值的\
  \ `input` 元素。我们想要做的是访问 `input` 元素的 DOM 表示，以便我们使用 JavaScript 对其调用某些 API。\n\n我们使用\
  \ `refs` 实现这一点的方法，是在我们想要引用的 HTML 元素上设置 `ref` 属性：\n\n点击此处查看代码图片\n\n```javascript\n\
