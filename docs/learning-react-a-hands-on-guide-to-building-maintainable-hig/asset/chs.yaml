  \ {\n\n  }\n});\n```\n\n现在这里什么都没有发生，但没关系。\n\n接下来，我们要的是在 `TodoList` 组件的 `render`\
  \ 方法内部调用这个组件。不仅如此，我们还要指定一个 `prop`（属性），并将 `TodoList` 组件的 `state`（状态）对象传递进去，该对象包含了我们的\
  \ `items` 数组。完成所有这些操作非常简单，所以请在你的 `TodoList` 组件的 `render` 方法中添加以下高亮行代码：\n\n点击此处查看代码图片\n\
  \n```javascript\nrender: function() {\n  return (\n    <div className=\"todoListMain\"\
  >\n      <div className=\"header\">\n        <form onSubmit={this.addItem}>\n  \
  \        <input ref={(a) => this._inputElement = a}\n                 placeholder=\"\
  enter task\">\n          </input>\n          <button type=\"submit\">add</button>\n\
  \        </form>\n      </div>\n      <TodoItems entries={this.state.items}/> \n\
  \    </div>\n  );\n}\n```\n\n我们在这里所做的只是实例化我们的 `TodoItems` 组件，并将我们的 `items` 状态属性传递给名为\
  \ `entries` 的 `prop`。此时，如果你在浏览器中运行我们的应用，什么可见的变化都不会发生。我们的 `TodoItems` 组件已经准备好渲染了，并且它可以访问所有提交的任务。唯一的问题是它并没有真的对这些内容进行任何操作，但我们将在下一步阶段修复这个问题。\n\
  \n回到我们的 `TodoItems` 组件，我们要做的第一件事是创建一个新变量来存储传递进去的任务数组。为了做到这一点，请添加以下高亮行：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar TodoItems = React.createClass({\n  render: function() {\n \
  \   var todoEntries = this.props.entries; \n  }\n});\n```\n\n我们刚刚添加了一个名为 `todoEntries`\
  \ 的变量，它存储了我们根据 `TodoList` 组件的 `this.state.items` 值传递的 `entries` 属性的值。太棒了！现在，我们的\
  \ `todoEntries` 存储了一个包含许多对象的数组，每个对象都存储了一个任务和一个键（key）。剩下的就是创建用于显示数据的 HTML 元素。\n\n\
  在实现这一目标的第一步中，添加以下高亮行代码来创建 `li` 元素：\n\n点击此处查看代码图片\n\n```javascript\nvar TodoItems\
  \ = React.createClass({\n  render: function() {\n    var todoEntries = this.props.entries;\
  \          \n\n    function createTasks(item) {\n      return <li key={item.key}>{item.text}</li>\
  \  \n    }                            \n\n    var listItems = todoEntries.map(createTasks);\
  \ \n  }\n});\n```\n\n我们正在使用 `map` 函数来遍历 `todoEntries` 内部每一个项，并调用 `createTasks` 函数为每个条目创建一个列表元素：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction createTasks(item) {\n  return <li key={item.key}>{item.text}</li>\n\
  }\n```\n\n重申我们之前提到的一点，由于这些列表元素是动态创建的，我们需要通过指定 `key` 属性并给每个元素一个唯一的值来帮助 React 跟踪它们。我们在存储任务时已经解决了这个问题部分，你还记得吗：\n\
  \n点击此处查看代码图片\n\n```javascript\nitemArray.push(\n  {\n    text: this._inputElement.value,\n\
  \    key: Date.now()\n  }\n);\n```\n\n得益于之前的规划，我们现在通过给 `key` 属性赋值 `todoEntries`\
  \ 数组中每个项已包含的 `item.key` 值，从而省了很多力气。我们列表元素的可见内容仅仅是存储在 `item.text` 中的文本。对于我们如何使用它，不需要额外的解释。这种感觉感觉非常清爽，不是吗？\n\
  \n将这一切整合在一起，这一组列表元素被我们的 `listItems` 变量完全处理并存储。此时剩下的就是将数组内部的列表元素转换为渲染在屏幕上的列表元素。为了实现这一点，请添加以下几行：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar TodoItems = React.createClass({\n  render: function()\
