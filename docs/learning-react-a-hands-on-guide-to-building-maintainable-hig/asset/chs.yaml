  19       </form>\n20     </div>\n21   );\n22 }\n```\n\n因为我们对 `input` 元素感兴趣，我们将 `ref`\
  \ 属性附加到它上面。现在，我们的 `ref` 属性是空的。你通常设置的 `ref` 属性值是一个 JavaScript 回调函数。当包含此 `render`\
  \ 方法的组件挂载时，该函数会被自动调用。如果我们将 `ref` 属性的值设置为一个简单的 JavaScript 函数，用于存储对被引用 DOM 元素的引用，它看起来会像下面高亮的行一样：\n\
  （注：此处原文存在大量重复段落，翻译时已按要求进行去重处理，保留核心逻辑翻译）\n\n（此处省略中间重复的翻译内容，直接进入后续核心示例部分）\n\n点击此处查看代码图片\n\
  \n```javascript\nvar Colorizer = React.createClass({\n  getInitialState: function()\
  \ {\n    return {\n      color: '',\n      bgColor: ''\n    }\n  },\n  colorValue:\
  \ function(e) {\n    this.setState({color: e.target.value});\n  },\n  setNewColor:\
  \ function(e){\n    this.setState({bgColor: this.state.color});\n    this._input.value\
  \ = \"\"; \n    this._input.focus();   \n    e.preventDefault();\n  },\n  render:\
  \ function() {\n    var squareStyle = {\n      backgroundColor: this.state.bgColor\n\
  \    };\n    var self = this;\n    return (\n      <div className=\"colorArea\"\
  >\n        <div style={squareStyle} className=\"colorSquare\"></</div>\n       \
  \ <form onSubmit={this.setNewColor}>\n          <input\n            ref={\n    \
  \          function(el) {\n                self._input = el;\n              }\n\
  \            }\n            onChange={this.colorValue}\n            placeholder=\"\
  Enter a color value\">\n          </input>\n          <button type=\"submit\">go</button>\n\
  \        </form>\n      </div>\n    );\n  }\n});\n```\n\n专注于我们的 `input` 元素发生了什么：当表单提交且\
  \ `setNewColor` 方法被调用时，我们通过调用 `this._input.value` 清空 `input` 元素的内容。我们通过调用 `this._input.focus()`\
  \ 为 `input` 元素设置焦点。我们所有的 `ref` 相关工作仅仅是为了通过这两行代码让 `this._input` 指向我们在 JSX 中定义的 HTML\
  \ 元素。\n\n### 使用 ES6 箭头函数进一步简化\n\n学习 React 已经足够困难了，所以我尽量避免强制你默认使用 ES6 技术。在处理 `ref`\
  \ 属性时，使用箭头函数来处理回调函数确实简化了问题。这是我建议使用 ES6 技术的情况之一。\n\n正如你几分钟前看到的，为了将我们组件上的属性赋值给引用的\
  \ HTML 元素，我们做了如下操作：\n\n点击此处查看代码图片\n\n```javascript\n<input\n  ref={\n    function(el)\
  \ {\n      self._input = el;\n    }\n  }\n  onChange={this.colorValue}\n  placeholder=\"\
  Enter a color value\">\n</input>\n```\n\n\n\n为了处理作用域带来的麻烦，我们创建了一个初始化为 `this` 的 `self`\
  \ 变量，以确保我们在组件上创建了 `_input` 属性。这看起来似乎是不必要的复杂。\n\n通过使用箭头函数，我们可以将这一切简化为以下内容：\n\n点击此处查看代码图片\n\
  \n```html\n<input\n    ref={\n        (el) => this._input = el\n    }\n    onChange={this.colorValue}\n\
  \    placeholder=\"Enter a color value\">\n</input>\n```\n\n最终结果与我们花费所有时间查看的内容完全相同，而且由于箭头函数处理作用域的方式，你可以在函数体内部使用\
  \ `this` 并引用组件，而无需进行任何额外工作。不需要外部 `self` 变量等效物了！\n\n***\n\n### 结论\n\n在本教程中，我们看到了直接访问\
  \ DOM 元素是多么“简单”。React 曾经提供过一种更简单的方法来引用元素。你可以在元素上设置 `refs` 属性并将其初始化为一个字符串值：\n\n点击此处查看代码图片\n\
  \n```html\n<button refs=\"myButton\">Click me!</button>\n```\n\n然后你可以在组件挂载后通过类似\
  \ `this.refs.myButton` 的操作来访问该元素。在你真正对使用这种方法而非我们带有 `ref` 属性的函数回调方法感到兴奋之前，请注意，这种基于字符串的方法可能会被弃用。在写此书时它是有效的，但谁能知道它什么时候会停止工作呢。现在，鉴于它即将消失，你可能想知道我为什么还要告诉你这些。坦率地说，我真的不知道\
  \ :P\n\n## 13. 使用 React Router 创建单页应用\n\n现在你已经熟悉了如何操作 React 的基础知识，让我们把难度提高几个台阶。我们要做的是使用\
  \ React 构建一个简单的**单页应用**（酷孩子们以及住在斯堪的纳维维亚的人也称之为 **SPA**）。正如我们在很久很久以前的第 1 章 中讨论过的那样，单页应用与随处可见的传统多页应用不同。最大的区别在于，导航单页应用并不涉及跳转到一个完全新的页面。相反，你的页面（在此上下文中通常被称为**视图/views**）通常在同一个页面内内联加载，如图\
  \ 13-1\n\n图 13-1 单页应用使用内联加载视图，而不是加载新页面。\n\n当你内联加载内容时，事情会变得有些挑战性。困难的部分不是加载内容本身，那相对容易。困难的部分在于要确保单页应用的行为与用户的习惯保持一致。更具体地说，当用户导航你的应用时，他们期望：\n\
  \n1. 地址栏中显示的 URL 始终反映他们正在查看的内容。\n2. 他们可以（成功地）浏览器的后退和前进按钮。\n3. 他们可以使用相应的 URL 直接导航到特定的视图（即**深度链接**）。\n\
  \n对于多页应用，这三点是免费送的。你不需要为其中任何一点做额外工作。而对于单页应用，因为你没有导航到一个完全新的页面，所以你必须付诸努力来处理这三件用户认为应该正常工作的事情。你需要确保应用内的导航会相应地调整\
  \ URL。你需要确保浏览器的历史记录与每次导航正确同步，以便用户使用后退和前进按钮。如果用户书签了某个视图或复制/粘贴了 URL 以备稍后访问，你需要确保你的单页应用将用户带到正确的地方。\n\
  \n为了处理这一切，你拥有一系列被称为**路由（routing）**的技术。路由就是你尝试将 URL 映射到非物理页面的目的地，例如你单页应用中的各个视图。这听起来很复杂，但幸运的是有很多\
  \ JavaScript 库可以帮助我们。其中一个 JavaScript 库就是本章的主角，React Router（[`github.com/reactjs/react-router`](https://github.com/reactjs/react-router)）。React\
  \ Router 为使用 React 构建的单页应用提供了路由功能，它的优秀之处在于，它以熟悉的方式扩展了你已经对 React 的了解，带给你所有这些路由的绝妙体验。在本章中，你将学习关于它是如何做到这些点的——以及可能更多！\n\
  \n### 示例\n\n在继续之前，让我们来看一个示例（参见图 13-2）。\n\n![Image](img/image00288.jpeg)\n\n图 13-2\
  \ 一个使用 React Router 的简单 React 应用。\n\n你在这里拥有一个使用 React Router 提供所有导航和视图加载优性的简单 React\
  \ 应用！虽然应用的截图看起来很不错，但这是那种你希望通过玩玩这个应用来看到更多它的功能的情况之一。请尽管打开它。\n\n### 构建应用\n\n我们首先需要让标记和代码运行起来。创建一个新的\
  \ HTML 文档并添加以下内容：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>React!\
  \ React!</title>\n    <script src=\"https://npmcdn.com/react@15.3.0/dist/react.js\"\
  ></script>\n    <script src=\"https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js\"\
  ></script>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
  ></script>\n    <style></style>\n</head>\n<body>\n    <div id=\"container\"></div>\n\
  \    <script type=\"text/babel\">\n        var destination = document.querySelector(\"\
  #container\");\n        ReactDOM.render(\n            <div>Hello!</div>,\n     \
  \       destination\n        );\n    </script>\n</body>\n</html>\n```\n\n这个起点与我们之前所有的示例几乎相同。这只是一个恰好加载了\
  \ React 和 DOM 库的空白应用。如果你在浏览器中预览，你会看到一个孤单的 **Hello!**。\n\n#### 注意：保持简单\n\n现在，我们继续依靠浏览器来完成所有繁重工作。稍后我们会考虑通过“现代”构建流程来改变这一点，所以现在享受这种简单吧\
  \ :P\n\n#### 添加 React Router\n\n接下来，由于 React Router 不是 React 的一部分，我们需要为它添加引用。在我们的标记中，找到我们引用脚本的地方并添加以下高亮行：\n\
  \n点击此处查看代码图片\n\n```html\n<script src=\"https://npmcdn.com/react@15.3.0/dist/react.js\"\
  ></script>\n<script src=\"https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js\"\
  ></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
  ></script>\n<script src=\"https://npmcdn.com/react-router/umd/ReactRouter.min.js\"\
  ></script>\n```\n\n通过添加高亮行，我们确保了 React Router 库与核心 React、ReactDOM 以及 Babel 库一起加载。此时，我们已经处于良好的状态，可以开始构建我们的应用并利用\
  \ React Router 带来的所有绝妙功能。\n\n\n\n在构建单页应用（SPA）时，页面中总有一部分是保持静态的。这个静态部分也被称为 `app frame`（应用框架），它可能是一个不可见的\
  \ HTML 元素，作为所有内容的容器，也可以包含一些额外的视觉元素，如页头、页脚、导航等。在我们的案例中，应用框架将包含我们的导航页头和一个用于加载内容的空白区域。为了显示这些内容，我们将创建一个负责此项的组件。\n\
  \n在 `ReactDOM.render` 调用上方的 `script` 标签内，请添加以下 JSX 和 JavaScript 代码：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
  \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
  >\n          <li>Home</li>\n          <li>Stuff</li>\n          <li>Contact</li>\n\
  \        </ul>\n        <div className=\"content\">\n        </div>\n      </div>\n\
  \    )\n  }\n});\n```\n\n一旦完成粘贴，请查看我们这里的内容。我们有一个名为 `App` 的组件，它返回了一些 HTML。为了查看这些\
  \ HTML 看起来什么样，请修改你的 `ReactDOM.render` 调用以引用此组件，而不是显示单词 `Hello!`。请进行以下高亮更改：\n\n```javascript\n\
  ReactDOM.render(\n  <div>\n    <App/> \n  </div>,\n  destination\n);\n```\n\n完成后，在浏览器中预览你的应用。你应该能看到一个无样式的应用标题和一些列表项（参见图\
  \ 13-3）。\n\n![Image](img/image028.jpeg)\n\n图 13-3 无样式的版本。\n\n我知道这看起来并不华丽或经过设计，但现在没关系，我们稍后会处理。深入一点，我们所做的只是创建了一个名为\
  \ `App` 的组件并通过 `ReactDOM.render` 调用显示它。重要的一是，这里没有任何 React Router。完全没有！这是 React 的基础知识。让我们通过引入\
  \ React Router 来修复这个问题。将你的 `ReactDOM.render` 调用内容替换为以下内容：\n\n点击此处查看代码图片\n\n```javascript\n\
  ReactDOM.render(\n  <ReactRouter.Router>                   \n    <ReactRouter.Route\
  \ path=\"/\" component={App}>\n  </ReactRouter.Router>,\n  destination\n);\n```\n\
  \n先不管它看起来有多奇怪，在你做出更改后在浏览器中预览你的应用。如果一切正常，你将像之前一样看到 `App` 组件。现在，让我们通过学习这里的原理来弄清楚为什么是这样。我们将\
  \ React 离核心概念，学习 React Router 特有的内容。\n\n首先，我们做的是指定 `Router` 组件：\n\n点击此处查看代码图片\n\n\
  ```javascript\nReactDOM.render(\n  <ReactRouter.Router>   \n    <ReactRouter.Route\
  \ path=\"/\" component={App}>\n  </ReactRouter.Router>,\n  destination\n);\n```\n\
  \n`Router` 组件是 React Router API 的，它的任务是处理应用所需的所有路由逻辑。在这个组件内部，我们指定的 `routing configuration`（路由配置）是一个描述\
  \ URL 与视图之间映射的高级术语。它的细节由另一个名为 `Route` 的组件处理：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
  \  <ReactRouter.Router>\n    <ReactRouter.Route path=\"/\" component={App}>\n  </ReactRouter.Router>,\n\
  \  destination\n);\n```\n\n`Route` 组件接收多个 `props` 来帮助定义在什么 URL 显示什么。`path` 属性指定我们感兴趣的\
  \ URL。在这种情况下，它是 `/`。`component` 属性允许指定想要显示的组件名称。在这个例子中，它是 `App`。整合这一切，这个 `Route`\
  \ 的意思是如果你所在的 URL 是根路径，就显示 `App` 组件。当你预览应用时，由于条件成立，你会看到 `App` 组件渲染的结果。\n\n### 显示主页\n\
  \n正如你所看到的，React Router 提供这些功能的方式是使用你已经熟悉的 React 概念——即 `components`、`props` 和 `JSX`。我们目前的应用框架是一个很好的例子。现在是时候进一步了。我们接下来要做的是定义作为我们主视图的一部分的内容。为了做到，我们将创建一个名为\
  \ `Home` 的组件，它将包含我们要显示的标记。在你的 `App` 组件上方添加以下内容：\n\n点击此处查看代码图片\n\n```javascript\n\
  var Home = React.createClass({\n  render: function() {\n    return (\n      <div>\n\
  \        <h2>HELLO</h2>\n        <p>Cras facilisis urna ex volutpat, et vallis erat\
  \ elementum. Ut aliquam, ipsum vitae suscipit, metus bibendum est, rhoncus nibh\
  \ nec massa. Maecenas hendrerit augue molestie. Cum sociis penatibus et magnis parturient\
  \ montes, ridiculus mus.</p>\n        <p>Duis a turpis sed dapibus elementum sed\
  \ lectus.</p>\n      </div>\n    );\n  }\n});\n```\n\n你可以看到，`Home` 组件并没有特别。它只是返回了一段\
  \ HTML。现在，我们要页面加载时显示 `Home` 组件的内容。这个组件相当于应用的“主页”。我们这样做的方法很简单。在 `App` 组件内部，我们有一个类值为\
  \ `content` 的 `div`。我们将那里加载 `Home` 组件。明显的解决方案可能像这样：\n\n点击此处查看代码图片\n\n```javascript\n\
  var App = React.createClass({\n  render: function() {\n    return (\n      <div>\n\
  \        <h1>Simple SPA</h1>\n        <ul className=\"header\">\n          <li>Home</li>\n\
  \          <li>Stuff</li>\n          <li>Contact</li>\n        </ul>\n        <div\
  \ className=\"content\">\n          <Home/> \n        </div>\n      </div>\n   \
  \ )\n  }\n});\n```\n\n注意我们在那个 `content` `div` 内部定义了 `Home` 组件。如果你预览应用，事情甚至看起来如预期般工作（参见图\
  \ 13-4）。\n\n![Image](img/image0290.jpeg)\n\n图 13-4 功能增强。\n\n你看到了导航页头，然后看到了我们 `Home`\
  \ 组件的内容。虽然这种方法可行，但实际上并不是正确的做法。它是错误的，因为它使用户在应用中导航时加载其他部分内容的愿望变得复杂。我们本质上是将应用硬编码为只显示\
  \ `Home` 组件。这是一个问题，但我们稍后会回来讨论。\n\n### 中期清理时间\n\n在继续开发应用之前，让我们稍微休息一下，对目前已有的进行一些样式上的改进。\n\
  \n#### 添加 CSS\n\n现在，我们的应用看起来非常单调……像 19 世纪的产物。为了修复这个问题，我们将依靠我们的老朋友 CSS。在 `style`\
  \ 标签内，请添加以下样式规则：\n\n点击此处查看代码图片\n\n```css\nbody {\n  background-color: #FFCC00;\n\
  \  padding: 20px;\n  margin: 0;\n}\n\nh1, h2, p, ul, li {\n  font-family: Helvetica,\
  \ Arial, sans-serif;\n}\n\nul.header li {\n  display: inline;\n  list-style-type:\
  \ none;\n  margin: 0;\n}\n\nul.header {\n  background-color: #111;\n  padding: 0;\n\
  }\n```\n\n\n\n\n```css\nul.header li a {\n  color: #FFF;\n  font-weight: bold;\n\
  \  text-decoration: none;\n  padding: 20px;\n  display: inline-block;\n}\n\n.content\
  \ {\n  background-color: #FFF;\n  padding: 20px;\n}\n\n.content h2 {\n  padding:\
  \ 0;\n  margin: 0;\n}\n\n.content li {\n  margin-bottom: 10px;\n}\n```\n\n是的，我们正在以标记标记的形式使用\
  \ CSS。我们没有采用在第 4 章中看到的内联样式对象方法。原因是出于方便考虑。我们的组件不会在特定的应用程序之外被复用，而且我们确实希望利用 CSS 继承来尽量减少重复的标记。否则，如果我们不使用普通的\
  \ CSS，最终将为标记中的几乎每个元素定义一堆巨大的样式对象。这会让即使我们中最耐心的人在阅读代码时感到烦恼。\n\n无论如何，一旦你添加了这些 CSS，我们的应用程序就会开始变得好得多（请参见\
  \ 图 13-5）。\n\n![Image](img/image00291.jpeg)\n\n图 13-5 添加了 CSS 样式。\n\n仍然有一些工作要做（例如，我们的导航链接消失在了黑色横后面），但我们稍后会修复它们。\n\
  \n### 避免 ReactRouter 前缀\n\n在回到常规节目之前，我们最后一个清理清理任务。你是否注意到，每当我们调用由 React Router API\
  \ 定义的内容时，都会在那个内容前加上 `ReactRouter` 前缀？\n\n点击此处查看代码图像\n\n```jsx\n<ReactRouter.Router>\n\
  \  <ReactRouter.Route path=\"/\" component={App}>\n  </ReactRouter.Route>\n</ReactRouter.Router>\n\
  ```\n\n对我们的每一个 API 调用都重复这些内容有点冗长，随着我们深入研究 React Router API 并使用其内部更多的功能时，这个问题将会变得更加严重。\n\
  \n修复方法是使用一种新的 ES6 技巧，你可以手动指定哪些值将自动获得前缀。在你的 `script` 标签顶部，添加以下内容：\n\n```javascript\n\
  var { Router,\n      Route,\n      IndexRoute,\n      IndexLink,\n      Link } =\
  \ ReactRouter;\n```\n\n一旦你添加了这段代码，每当你使用括号内定义的某个值时，当应用程序运行时，系统会自动为你添加 `ReactRouter`\
  \ 前缀。这意味着，你现在可以回到 `ReactDOM.render` 方法，并从我们的 `Router` 和 `Route` 组件实例中移除 `ReactRouter`\
  \ 前缀：\n\n点击此处查看代码图像\n\n```jsx\nReactDOM.render(\n  <Router>\n    <Route path=\"\
  /\" component={App}>\n    </Route>\n  </Router>,\n  destination\n);\n```\n\n如果你现在预览应用程序，实际上不应该发生任何变化。最终结果与你之前的完全相同。唯一的区别是我们的标记紧凑了一点。\n\
  \n现在，在我们继续之前，你可能奇怪为什么自动带有 `ReactRouter` 前缀的值列表中包含了我们目前为止代码中使用的 `Router` 和 `Route`\
  \ 值之外的很多内容。将这些额外的值视为我们很快将要使用的 React Router API 其他部分的预览吧。剧透警告！（现在提到这个可能太晚了，对吧？）\n\
  \n### 正确地显示主页\n\n我们在几个章节前结束时提到，目前显示主页的方式是不正确的。虽然当页面加载时我们得到了预期的结果，但这种方法并不能方便我们在用户导航时加载主页以外的任何内容。对\
  \ `Home` 组件的调用被硬编码在 `App` 内部。\n\n正确的解决方案是让 React Router 根据你当前的 URL 结构处理调用哪个组件。这涉及到在\
  \ `Route` 组件内部嵌套 `Route` 组件，以更好地定义 URL 到视图的映射。回到我们的 `ReactDOM.render` 方法，进行以下高亮更改：\n\
  \n点击此处查看代码图像\n\n```jsx\nReactDOM.render(\n  <Router>\n    <Route path=\"/\" component={App}>\n\
  \      <IndexRoute component={Home}/> \n    </Route>\n  </Router>,\n  destination\n\
  );\n```\n\n在我们的根 `Route` 元素内部，我们定义了另一个类型为 `IndexRoute` 的 `Route` 元素（稍后介绍它是谁！），并将其视图设置为我们的\
  \ `Home` 组件。我们还需要进行另一处更改。在我们的 `App` 组件内部，移除对 `Home` 组件的调用，并将其替换为以下内容：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
  \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
  >\n          <li>Home</li>\n          <li>Stuff</li>\n          <li>Contact</li>\n\
  \        </ul>\n        <div className=\"content\">\n          {this.props.children}\n\
  \        </div>\n      </div>\n    )\n  }\n```\n\n如果你现在预览应用程序，实际上什么都不应该改变。最终结果与你之前的一致。唯一的区别在于我们的\
  \ `App` 内部通过 `this.props.children` 控制了显示内容。\n\n现在，在我们继续之前，你可能在想为什么自动带有 `ReactRouter`\
  \ 前缀的值列表中包含了除了我们目前代码中使用的 `Router` 和 `Route` 值之外的很多内容。将这些额外的值视为我们很快将要使用的 React Router\
  \ API 其他部分的预览吧。剧透警告！（现在提到这个可能太晚了，对吧？）\n\n### 正确地显示主页\n\n我们在几个章节前结束时提到，目前显示主页的方式是不正确的。虽然当页面加载时我们得到了预期的结果，但这种方法并不能方便我们在用户导航时加载主页以外的任何内容。对\
  \ `Home` 组件的调用被硬编码在 `App` 内部。\n\n正确的解决方案是让 React Router 根据你当前的 URL 结构处理调用哪个组件。这涉及到在\
  \ `Route` 组件内部嵌套 `Route` 组件，以更好地定义 URL 到视图的映射。回到我们的 `ReactDOM.render` 方法，进行以下高亮更改：\n\
  \n点击此处查看代码图像\n\n```jsx\nReactDOM.render(\n  <Router>\n    <Route path=\"/\" component={App}>\n\
  \      <IndexRoute component={Home}/> \n    </Route>\n  </Router>,\n  destination\n\
  );\n```\n\n在我们的根 `Route` 元素内部，我们定义了另一个类型为 `IndexRoute` 的 `Route` 元素（稍后介绍它是谁！），并将其视图设置为我们的\
  \ `Home` 组件。我们还需要进行另一处更改。在我们的 `App` 组件内部，移除对 `Home` 组件的调用，并将其替换为以下内容：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
  \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
  >\n          <li>Home</li>\n          <li>Stuff</li>\n          <li>Contact</li>\n\
  \        </ul>\n        <div className=\"content\">\n          {this.props.children}\n\
  \        </div>\n      </div>\n    )\n  }\n}\n```\n\n如果你现在预览应用程序，实际上什么都不应该改变。最终结果与你之前的一致。唯一的区别在于我们的\
  \ `App` 内部通过 `this.props.children` 控制了显示内容。\n\n### 创建导航链接\n\n现在，我们只有框架和主页设置。除了看到我们的主页之外，用户并没有其他可以做的。让我们通过创建导航链接来修复这一点。具体来说，让我们现有的导航元素链接化：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar App = React.createClass({\n  render: function()\
  \ {\n    return (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"\
  header\">\n          <li>Home</li>\n          <li>Stuff</li>\n          <li>Contact</li>\n\
  \        </ul>\n        <div className=\"content\">\n          {this.props.children}\n\
  \        </div>\n      </div>\n    )\n  }\n})\n```\n\n如果你在预览页面时没有看到这些元素，那是因为在我们添加\
  \ CSS 后它们与黑色背景融合在一起了。没大碍。我们稍后会修复它，但首先让我们谈谈如何将这些元素变成链接。\n\n在 React Router 中指定导航链接的方法不是直接使用经过测试的\
  \ `a` 标签并通过 `href` 属性传入路径。相反，你使用 React Router 的 `Link` 组件来指定导航链接，这些组件类似于 `a` 标签，但提供了更多的功能。为了看到\
  \ `Link` 组件的作用，请将我们现有的导航元素修改为如下高亮行：\n\n点击此处查看代码图像\n\n```javascript\nvar App = React.createClass({\n\
  \  render: function() {\n    return (\n      <div>\n        <h1>Simple SPA</h1>\n\
  \        <ul className=\"header\">\n          <li><Link to=\"/\">Home</Link></li>\n\
  \          <li><Link to=\"/stuff\">Stuff</Link></li>\n          <li><Link to=\"\
  /contact\">Contact</Link></li>\n        </ul>\n        <div className=\"content\"\
  >\n          {this.props.children}\n        </div>\n      </div>\n    )\n  }\n})\n\
  ```\n\n\n\n\n\n注意我们在这里所做的。我们的 `Link` 组件指定了一个名为 `to` 的属性。该属性指定了我们将在地址栏中显示的 URL 值。间接地说，它也指定了我们告诉\
  \ `Router` 我们正虚拟导航到的位置。我们的 `Home` 链接将用户带到根目录（`/`），`Stuff` 链接将用户带到名为 `stuff` 的位置，而\
  \ `Contact` 链接将用户带到名为 `contact` 的位置。\n\n如果你预览页面并点击链接（由于它们的 CSS 已经生效，它们现在是可见的），你不会看到任何新内容显示。你只会看到\
  \ `Home` 内容，因为那是我们之前唯一指定了的内容。尽管如此，你可以看到地址栏中的 URL 正在更新。根据你点击了哪个链接，你将看到当前页面后面跟着 `#/contact`、`#/stuff`\
  \ 或 `#/`。哦，你还会看到 URL 后面添加了一个随机的哈希值（hash）。这是进展！\n\n### 添加 Stuff 和 Contact 视图\n\n\
  我们的应用程序正在缓慢形成最终形状……到我们完成这一节时，它将非常接近完工！我们接下来要做的是为之前链接的 `Stuff` 和 `Contact` 视图定义组件。在你的代码中，就在你\
  \ `Home` 组件下方，添加以下内容：\n\n点击此处查看代码图片\n\n```javascript\nvar Contact = React.createClass({\n\
  \  render: function() {\n    return (\n      <div>\n        <h2>有问题吗？</h2>\n   \
  \     <p>最简单的方法是在\n        我们的 <a href=\"http://forum.kirupa.com\">论坛</a>上发帖。\n\
  \        </p>\n      </div>\n    );\n  }\n});\n\nvar Stuff = React.createClass({\n\
  \  render: function() {\n    return (\n      <div>\n        <h2>STUFF</h2>\n   \
  \     <p>Mauris sem velit, vehicula eget sodales vitae,\n        rhoncus eget sapien:</p>\n\
  \        <ol>\n          <li>Nulla pulvinar diam</li>\n          <li>Facilisis bibendum</li>\n\
  \          <li>Vestibulum vulputate</li>\n          <li>Eget erat</li>\n       \
  \   <li>Id porttitor</li>\n        </ol>\n      </div>\n    );\n  }\n});\n```\n\n\
  我们刚刚添加的是简单渲染 HTML 的 `Stuff` 和 `Contact` 组件。剩下的工作是更新我们的路由配置以包含这两个组件，并在相应的 URL 下显示它们。\n\
  \n在我们的 `ReactDOM.render` 方法中，添加以下两行高亮代码：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
  \  <Router>\n    <Route path=\"/\" component={App}>\n      <IndexRoute component={Home}/>\n\
  \      <Route path=\"stuff\" component={Stuff} />     \n      <Route path=\"contact\"\
  \ component={Contact} /> \n    </Route>\n  </Router>,\n  destination\n);\n```\n\n\
  我们在这里所做的只是更新路由逻辑：如果 URL 包含 `stuff` 单词，则显示 `Stuff` 组件；如果 URL 包含 `contact` 单词，则显示\
  \ `Contact` 组件。现在预览你的页面，点击 `Stuff` 和 `Contact` 链接。如果一切运行正常，当你导航到这些视图时，你会看到这些视图加载在我们的框架中。\n\
  \n### 注意：关于路由匹配的简单介绍\n\n我们的路由配置无非是一系列规则，用于决定当 URL 匹配我们设定的条件时该做什么。这种做法的术语叫做路由匹配（route\
  \ matching）。`Router` 用于匹配 URL 的启发式算法在 `Router` 文档中有完全的解释，但对于我们的情况，我们有一个简单的嵌套路由，你可以有多个同时匹配的项目。如果\
  \ URL 包含 `/`，我们的外部路由就会匹配。如果如果 URL 恰好包含 `stuff` 或 `contact`，我们的内部路由就会匹配。\n\n这意味着非常简单。对于每个匹配的路由，你指定的组件将会出现。当你导航到像\
  \ `/stuff` 这样的页面时，`App` 组件会显示，因为 URL 中存在 `/`。然后 `Stuff` 组件也会显示，因为 URL 中也存在 `stuff`\
  \ 的路径。这就是为什么当我们导航到 `Stuff` 或 `Contact` 页面时，除了框架之外还能看到它们。你也可以拥有深层嵌套路由。\n\n查看以下内容：\n\
  \n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <Router>\n    <Route path=\"\
  /\" component={App}>\n      <IndexRoute component={Home} />\n      <Route path=\"\
  stuff\" component={Stuff}>\n        <Route path=\"blah\" component={MyBlah}/>\n\
  \      </Route>\n      <Route path=\"contact\" component={Contact} />\n    </Route>\n\
  \  </Router>,\n  destination);\n```\n\n在这个示例中，注意我们路径为 `stuff` 的 `Route` 元素现在包含了一个路径为\
  \ `blah` 的嵌套路由。这意味着如果你恰好有一个为 `/stuff/blah` 的 URL，那么除了父级匹配的 `Stuff` 组件和 `App` 组件外，`MyBlah`\
  \ 组件也将显示。通过嵌套路由并遵循路由匹配规则（https://github.com/reactjs/react-router/blob/master/docs/RouteMatching），你可以根据不同的\
  \ URL 布局显示视图。\n\n### 创建激活链接\n\n我们最后要处理的是增加应用程序可用性的功能。根据你当前处于哪个页面，我们将为激活的链接设置蓝色背景。例如，图\
  \ 13-6 是当 Stuff 内容显示时的应用程序样式。在 `Router` 中实现这一点的方法是在 `Link` 实例上指定一个名为 `active` 的属性。为了让这一切发生，回到你的\
  \ `App` 组件并进行以下更改：\n\n点击此处查看代码图片\n\n```javascript\nvar App = React.createClass({\n\
  \  render: function() {\n    return (\n      <div>\n        <h1>Simple SPA</h1>\n\
  \        <ul className=\"header\">\n          <li><Link to=\"/\" activeClassName=\"\
  active\">Home</Link></li>\n          <li><Link to=\"/stuff\" activeClassName=\"\
  active\">Stuff</Link></li>\n          <li><Link to=\"/contact\" activeClassName=\"\
  active\">Contact</Link></li>\n        </ul>\n        <div className=\"content\"\
  >\n          {this.props.children}\n        </div>\n      </div>\n    )\n  }\n});\n\
  ```\n\n我们指定 `activeClassName` 属性并设置为 `active`。这确保了当点击链接时（且路径变为激活状态），链接元素的 `class`\
  \ 属性在运行时会被设置为 `active`。为了确保我们的激活链接有不同的样式，请添加以下 CSS：\n\n```css\n.active {\n  background-color:\
  \ #009FF;\n}\n```\n\n现在预览你的应用程序，点击任何链接。注意激活的链接（以及 Home 链接）显示为蓝色背景。不过我们还没有完成。我们的\
  \ Home 链接总是被激活。它应该只在我们加载 Home 页面或显式导航到 Home 链接本身时被激活。为了修复这个问题，我们需要更改链接到 Home 内容的方式。与其用\
  \ `Link` 元素指定 Home 内容，不如将其替换为 `IndexLink` 元素。\n\n请进行此更改：\n\n点击此处查看代码图片\n\n```javascript\n\
  var App = React.createClass({\n  render: function() {\n    return (\n      <div>\n\
  \        <h1>Simple SPA</h1>\n        <ul className=\"header\">\n          <li><IndexLink\
  \ to=\"/\" activeClassName=\"active\">Home</IndexLink></li>\n          <li><Link\
  \ to=\"/stuff\" activeClassName=\"active\">Stuff</Link></li>\n          <li><Link\
  \ to=\"/contact\" activeClassName=\"active\">Contact</Link></li>\n        </ul>\n\
  \        <div className=\"content\">\n          {this.props.children}\n        </div>\n\
  \      </div>\n    )\n  }\n});\n```\n\n\n\n\n```javascript\n        </ul>\n\n  \
  \      <div className=\"content\">\n          {this.props.children}\n        </div>\n\
  \      </div>\n    )\n}\n\n});\n\n当你的 Home 导航元素由 `IndexLink` 代替 `Link` 表示后，再次预览你的应用。这次，当应用加载时，你会发现你的\
  \ Home 链接默认具有酷炫蓝色背景。当你导航到 Stuff 或 Contact 页面时，Home 链接将不再有高亮显示。到此，你的应用大部分已经准备就绪了！\n\
  \n### 结论\n\n到目前，我们已经涵盖了 React Router 为帮助你构建单页应用的很多酷功能。这并不意味着没有更多有趣的事情供你利用。我们的应用非常简单，对我们需要实现的路由功能需求也很小。React\
  \ Router 提供的功能要多得多，所以如果你正在构建比我们目前所过的更复杂的单页应用，你完全应该花一个下午时间看看完整的 React Router 文档 ([`github.com/reactjs/react-router/`](https://github.com/reactjs/react-router/))\
  \ 和示例。\n\n## 14. 构建一个 Todo 列表应用\n\n如果说创建 **Hello, World!** 示例是你开始接触 React 的庆祝，那么创建一个经典的\
  \ Todo 列表应用就是你向精通 React 迈进的庆祝！在本章中，我们将你学过的许多概念和技术结合在一起，创建一个如下运行的应用：[`www.kirupa.com/react/examples/todo.htm`](https://www.kirupa.com/react/examples/todo.htm)\n\
  \n你从一个空白应用开始，它允许你输入任务以便以后使用（参见图 14-1）。\n\n![Image](img/image0029.jpeg)\n\n图 14-1\
