  ```\n\n\n\n\n我们在这里做的是指定 `getInitialState` 方法，它会在组件渲染之前被调用。在该方法内部，我们创建了一个名为 `items`\
  \ 的空数组，之后我们可以在此组件的任何地方通过 `this.state.items` 访问它。\n\n### 处理表单提交\n\n当你通过点击“Add”按钮或按下键盘上的\
  \ Enter/Return 键提交表单时，我们会待办列表中添加新项目。这种行为大部分是 HTML 内置的，我们的浏览器完全知道如何处理这种情况。我们不需要为处理\
