  trans: "\n\n# 从 JSX 到 JavaScript\n\n目前缺失的步骤是将我们的 `JSX` 转换为浏览器可以理解的 JavaScript。这涉及\
    \ `webpack` 和 `Babel`，我们将配置这两者来让这一切运行起来。\n\n## 设置 webpack\n\n由于我们正处于 Node.js 环境中，且\
    \ `webpack` 和 `Babel` 都以 Node 包的形式存在，因此我们需要像安装 React 相关包一样安装它们它们。\n\n要安装 `webpack`，请在终端（Terminal）/\
    \ 命令提示符（Command Prompt）中输入以下内容：\n\n```bash\nnpm install webpack --save\n```\n\n\
    这需要花费一些时间，因为 `webpack` 包（及其大量的依赖项）会被下载并放置到我们的 `node_modules` 文件夹中。完成后，我们需要添加一个配置文件来指定\
    \ `webpack` 如何与我们当前的项目协作。使用你的代码编辑器，在 `MyTotallyAwesomeApp` 文件夹内创建一个名为 `webpack.config.js`\
    \ 的文件（参见图 15-13）。\n\n![Image](img/image0031.jpeg)\n\n图 15-13 添加 `webpack.config.js`。\n\
    \n在该文件中，我们将指定一组 JavaScript 属性，以定义原始未修改的源文件位置，以及最终源文件的输出位置。请将以下 JavaScript 代码添加到\
    \ `webpack.config.js` 中：\n\n```javascript\nvar webpack = require(\"webpack\");\n\
    \nvar path = require(\"path\");\n\nvar DEV = path.resolve(__dirname, \"dev\");\n\
    \nvar OUTPUT = path.resolve(__dirname, \"output\");\n\nvar config = {\n  entry:\
    \ DEV + \"/index.jsx\",\n  output: {\n    path: OUTPUT,\n    filename: \"myCode.js\"\
    \n  }\n};\n\nmodule.exports = config;\n```\n\n花几分钟看看这段代码的作用。我们定义了两个名为 `DEV` 和\
    \ `OUTPUT` 的变量，它们指向项目中的同名文件夹。在 `config` 对象中，我们有两个名为 `entry` 和 `output` 的属性，它们使用\
    \ `DEV` 和 `OUTPUT` 变量来帮助将我们的 `index.jsx` 文件映射为 `myCode.js`。\n\n## 设置 Babel\n\n\
    我们当前设置的最后一部分是将我们的 `index.jsx` 文件转换为 `myCode.js` 形式的普通 JavaScript。这就是 Babel 发挥用场的地方。要安装\
    \ Babel，让我们回到熟悉的终端 / 命令提示符并输入以下 Node.js 命令：\n\n```bash\nnpm install babel-loader\
    \ babel-preset-es2015 babel-preset-react --save\n```\n\n通过此命令，我们安装了 `babel-loader`、`babel-preset-es2015`\
    \ 和 `babel-preset-react` 包。现在我们需要配置 Babel 与我们的项目协作。这是一个步骤步骤。\n\n第一步是指定我们想要使用的\
    \ Babel 预设（presets）。实现这一点有多种方法，但我倾向的方法是修改 `package.json` 并添加以下高亮内容：\n\n```json\n\
    {\n  \"name\": \"mytotallyawesomeapp\",\n  \"version\": \"1.0.0\",\n  \"description\"\
    : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
    Error: no test specified\\\" && exit 1\"\n  },\n  \"author\": \"\",\n  \"license\"\
    : \"ISC\",\n  \"dependencies\": {\n    \"babel-loader\": \"⁶.2.4\",\n    \"babel-preset-es2015\"\
    : \"⁶.9.0\",\n    \"babel-preset-react\": \"⁶.5.0\",\n    \"react\": \"¹⁵.1.0\"\
    ,\n    \"react-dom\": \"¹⁵.1.0\",\n    \"webpack\": \"¹.13.1\"\n  },\n  \"babel\"\
    : {\n      \"presets\": [\n        \"es2015\",\n        \"react\"\n    ]\n  }\n\
    }\n```\n\n在高亮行中，我们指定了 `babel` 对象并指定了 `es2015` 和 `react` 预设值。\n\n第二步是告诉 webpack\
    \ Babel。在我们的 `webpack.config.js` 文件中，添加以下高亮行：\n\n```javascript\nvar webpack =\
    \ require(\"webpack\");\n\nvar path = require(\"path\");\n\nvar DEV = path.resolve(__dirname,\
    \ \"Dev\");\n\nvar OUTPUT = path.resolve(__dirname, \"output\");\n\nvar config\
    \ = {\n  entry: DEV + \"/index.jsx\",\n  output: {\n    path: OUTPUT,\n    filename:\
    \ \"myCode.js\"\n  },\n  module: {\n    loaders: [{\n      include: DEV,\n   \
    \   loader: \"babel\",\n    }]\n  }\n};\n\nmodule.exports = config;\n```\n\n###\
    \ 构建并测试我们的\n\n我们当前设置的最后一部分是将我们的 `index.jsx` 文件转换为 `myCode.js` 形式的普通 JavaScript。这就是\
    \ Babel 发挥用场的地方。要安装 Babel，让我们回到熟悉的终端 / 命令提示符并输入以下 Node.js 命令：\n\n```bash\nnpm\
    \ install babel-loader babel-preset-es2015 babel-preset-react --save\n```\n\n\
    通过此命令，我们安装了 `babel-loader`、`babel-preset-es2015` 和 `babel-preset-react` 包。现在我们需要配置\
    \ Babel 与我们的项目协作。这是一个步骤步骤。\n\n第一步是指定我们想要使用的 Babel 预设。实现这一点有多种方法，但我倾向的方法是修改 `package.json`\
    \ 并添加以下高亮内容：\n\n```json\n{\n  \"name\": \"mytotallyawesomeapp\",\n  \"version\"\
    : \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\"\
    : {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n\
    \  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"dependencies\": {\n    \"babel-loader\"\
    : \"⁶.2.4\",\n    \"babel-preset-es2015\": \"⁶.9.0\",\n    \"babel-preset-react\"\
    : \"⁶.5.0\",\n    \"react\": \"¹⁵.1.0\",\n    \"react-dom\": \"¹⁵.1.0\",\n   \
    \ \"webpack\": \"¹.13.1\"\n  },\n  \"babel\": {\n      \"presets\": [\n      \
    \  \"es2015\",\n        \"react\"\n    ]\n  }\n}\n```\n\n在高亮行中，我们指定了 `babel` 对象并指定了\
    \ `es2015` 和 `react` 预设值。\n\n第二步是告诉 webpack Babel。在我们的 `webpack.config.js` 文件中，添加以下高亮行：\n\
    \n```javascript\nvar webpack = require(\"webpack\");\n\nvar path = require(\"\
    path\");\n\nvar DEV = path.resolve(__dirname, \"Dev\");\n\nvar OUTPUT = path.resolve(__dirname,\
    \ \"output\");\n\nvar config = {\n  entry: DEV + \"/index.jsx\",\n  output: {\n\
    \    path: OUTPUT,\n    filename: \"myCode.js\"\n  },\n  module: {\n    loaders:\
    \ [{\n      include: DEV,\n      loader: \"babel\",\n    }]\n  }\n};\n\nmodule.exports\
    \ = config;\n```\n\n花几分钟看看这段代码的作用。我们定义了两个名为 `DEV` 和 `OUTPUT` 的变量，它们指向项目中的同名文件夹。在\
    \ `config` 对象中，我们有两个名为 `entry` 和 `output` 的属性，它们使用 `DEV` 和 `OUTPUT` 变量来帮助将我们的\
    \ `index.jsx` 文件映射为 `myCode.js`。\n\n### 结\n\n好吧……这一切就这么发生了！在前面的章节中，我们在学习如何使用 React\
    \ 构建酷应用方面涵盖了大量内容。早些时候，我们从讨论构建复杂 UI 产生的问题开始，以及 React 如何让这一切变得轻而易举。希望在随后的章节中，你已经很好地了解如何使用\
    \ React 来实现这些目标。\n\n## 16 结束\n\n所以……我们来到这里了。在 15 个章节之后，我们在学习如何使用 React 构建酷应用方面涵盖了大量内容。早些时候，我们从讨论构建复杂\
    \ UI 产生的问题开始，以及 React 如何让这一切变得轻而易举。希望在随后的章节中，你已经很好地了解如何使用 React 来实现这些目标。\n\n"
