  trans: "\n它只是将 `LightningCounterDisplay` 组件推送到我们 DOM 中的容器 `div` 元素中。仅此而已。最终结果是你看到来自我们的\
    \ `ReactDOM.render` 方法与 `LightningCounterDisplay` 以及 `LightningCounter` 组件的标记标记组合。\n\
    \n### 让我们的计数器运行起来\n\n现在我们已经了解了起点，是时候为接下来的步骤制定计划了。我们的计数器工作原理非常简单。我们将使用 `setInterval`\
    \ 函数，它每隔 1000 毫秒（即 1 秒）调用某些代码。这段“某些代码”每次被调用时都会将值增加 `100`。看起来非常直观，对吧？\n\n为了让这一切运行起来，我们将依靠\
    \ React 组件暴露的三个 API：\n\n![Image](img/image00226.jpeg) `getInitialState`——该方法在你的组件挂载（mounted）之前运行，它允许你修改组件的\
    \ `state` 对象。\n\n![Image](img/image00226.jpeg) `componentDidMount`——该方法在组件渲染（或正如\
    \ React 所称的挂载）之后立即被调用。\n\n![Image](img/image00226.jpeg) `setState`——该方法允许你更新 `state`\
    \ 对象的值。\n\n我们很快就会看到这些 API 的实际用法，但我想先给你们一个预览，以便你们在排队中轻松识别出它们！\n\n#### 设置初始状态值\n\
    \n我们需要一个变量作为计数器，让我们把变量命名为 `strikes`。有很多方法可以创建这个变量。最明显的方法是如下：\n\n```javascript\n\
    var strikes = 0 // :P\n```\n\n不过，我们不想这样做。在我们的示例中，`strikes` 变量是组件状态的一部分，它的值就是我们显示在屏幕上的内容。我们要做的的是使用刚才简要见过的\
    \ `getInitialState` 方法，并在内部处理我们变量的初始化。稍后你将看到这对我们的组件状态产生了什么结果。\n\n在你的 `LightningCounter`\
    \ 组件内部，添加以下高亮行：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n\
    \  getInitialState: function() { \n    return {                          \n  \
    \    strikes: 0                    \n    };                          \n  },  \
    \                        \n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n```\n\n`getInitialState` 方法会在你的组件渲染很久很久以前自动运行，我们所做的告诉 React\
    \ 返回一个包含我们 `strikes` 属性（初始化为 `0`）的对象。你可能在想，我们把这个对象返回给谁或什么？这一切都是在后台发生的“魔法”。被返回的对象被设置为我们组件\
    \ `state` 对象的初始值。\n\n如果我们在这段代码运行后检查我们的 `state` 对象的值，它看起来会像这样：\n\n```javascript\n\
    var state = {\n  strikes: 0\n}\n```\n\n在结束这一节之前，让我们视觉化一下我们的 `strikes` 属性。在我们的\
    \ `render` 方法中，进行以下高亮更改：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounter\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ strikes: 0\n    };\n  },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\
    \ \n    );\n  }\n});\n```\n\n我们所做是将默认的 **Hello!** 文本替换为一个显示 `this.state.strikes`\
    \ 属性存储值的表达式。如果你在浏览器中预览你的示例，你将看到显示一个值为 0。这是一个好的开始！\n\n#### 启动我们的计时器并设置状态\n\n接下来是启动我们的计时器并增加我们的\
    \ `strikes` 属性。正如我们之前提到的，我们将使用 `setInterval` 函数每秒将 `strikes` 属性增加 `100`。我们将在组件使用内置的\
    \ `componentDidMount` 方法渲染后立即执行所有这些操作。\n\n启动计时器的代码如下：\n\n点击此处查看代码图片\n\n```javascript\n\
    var LightningCounter = React.createClass({\n  getInitialState: function() {\n\
    \    return {\n      strikes: 0\n    };\n  },\n  componentDidMount: function()\
    \ {\n    setInterval(this.timerTick, 1000);\n  },\n  render: function() {\n  \
    \  return (\n      <h1>{this.state.strikes}</h1>\n    );\n  }\n});\n```\n\n继续向我们的示例中添加这些高亮行。在组件渲染后被调用的\
    \ `componentDidMount` 方法内部，我们有一个 `setInterval` 方法，它每秒会调用一次 `timerTick` 函数（或 1000\
    \ 毫秒）。\n\n我们还没有定义 `timerTick` 函数，所以让我们通过在代码中添加以下高亮行来修复它：\n\n点击此处查看代码图片\n\n```javascript\n\
    var LightningCounter = React.createClass({\n  getInitialState: function() {\n\
    \    return {\n      strikes: 0\n    };\n  },\n  componentDidMount: function()\
    \ {\n    setInterval(this.timerTick, 1000);\n  },\n  render: function() {\n  \
    \  return (\n      <h1>{this.state.strikes}</h1>\n    );\n  }\n});\n```\n\n我们的\
    \ `timerTick` 函数所做的非常简单。它只是调用 `setState`。`setState` 方法有多种用法，但在我们这里的情况下，它接收一个对象作为参数。这个对象包含了你想合并到状态中的所有属性。在我们的例子中，我们指定了\
    \ `strikes` 属性并将其设置为比当前值大 100。\n\n`timerTick` 如何保持上下文？\n\n在普通 JavaScript 中，`timerTick`\
    \ 函数不会保持上下文。你需要额外的工作来支持这一点。它在 React 世界中之所以有效是因为被称为**自动绑定 (autobinding)**。\n\n\
    #### 渲染状态变化\n\n如果你现在预览应用，你将看到我们的 `strikes` 值开始每秒增加 100（参见图 8-2）。\n\n![Image](img/image00270.jpeg)\n\
    \n图 8-2 strikes 值每秒增加 100\n\n让我们暂时忽略代码发生了什么。那非常直观。有趣的是我们所做的一切是如何更新你在屏幕上的内容的。这种更新与这种行为有关：每当你调用\
    \ `setState` 并更新 `state` 对象中的内容时，你组件的 `render` 方法就会被自动调用。这会引发任何输出受影响的组件的 `render`\
    \ 调用链。这一切的最终结果你在屏幕上看到的应用程序 UI 状态的最新表示。保持数据和界面同步是 UI 开发中最困难的问题之一，所以 React 处理这些真的很棒。\n\
    \n### 可选：完整代码\n\n我们现在拥只是每秒增加 100 的计数器。它没有任何地方看起来像*闪电计数器*，但它涵盖了我想让你现在学习的所有关于状态的内容。如果你想可选地充实你的示例使其像我们在开头看到的我的版本，下面是放入我们\
    \ `script` 标签的完整代码：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n\
    \  getInitialState: function() {\n    return {\n      strikes: 0\n    };\n  },\n\
    \  timerTick: function() {\n    this.setState({\n      strikes: this.state.strikes\
    \ + 100\n    });\n  },\n  componentDidMount: function() {\n    setInterval(this.timerTick,\
    \ 1000);\n  },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n```\n"
