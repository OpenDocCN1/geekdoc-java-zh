    \ implemented counter example. Inside our `script` tag below the `container` `div`,\
    \ add the following:\n\n[Click here to view code image](#part0036.xhtml_p109pro01)\n\
    \n```javascript\nvar destination = document.querySelector(\"#container\");\n\n\
    var Counter = React.createClass({\n  render: function() {\n    var textStyle =\
    \ {\n      fontSize: 72,\n      fontFamily: \"sans-serif\",\n      color: \"#333\"\
    ,\n      fontWeight: \"bold\"\n    };\n    return (\n      <div style={textStyle}>\n\
    \        {this.props.display}\n      </div>\n    );\n  }\n});\n\nvar CounterParent\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ count: 0\n    };\n  },\n  render: function() {\n    var backgroundStyle = {\n\
    \      padding: 50,\n      backgroundColor: \"#FFC53A\",\n      width: 250,\n\
    \      height: 100,\n      borderRadius: 10,\n      textAlign: \"center\"\n  \
    \  };\n    var buttonStyle = {\n      fontSize: \"1em\",\n      width: 30,\n \
    \     height: 30,\n      fontFamily: \"sans-serif\",\n      color: \"#333\",\n\
    \      fontWeight: \"bold\",\n      lineHeight: \"3px\"\n    };\n    return (\n\
    \      <div style={backgroundStyle}>\n        <Counter display={this.state.count}/>\n\
    \        <button style={buttonStyle}>+</button>\n      </div>\n    );\n  }\n});\n\
    \nReactDOM.render(\n  <div>\n    <CounterParent/>\n  </div>,\n  destination\n\
    );\n```\n\nOnce you have added all of this, preview in your browser to make things\
    \ get displayed. You should see the beginning of our counter. Take a few moments\
    \ to look at all of this code does. There shouldn’t be anything that looks strange.\
    \ The only odd thing will be clicking the button won’t do anything. We’ll fix\
    \ that up in the next section.\n\n## Making the Button Do Something\n\nEach time\
    \ we click on the button, we want the value of our counter to increase by one.\
    \ What we need to do is going to look roughly like this:\n\n1. Listen for the\
    \ click event on the button and specify an event handler.\n2. Implement the event\
    \ handler where we increase the value of our `this.state.count` property that\
    \ our counter relies on.\n\nWe’ll just go down the list—starting with listening\
    \ for the click event. In React, you listen to an event by specifying everything\
    \ inline in your JSX. Specifically, you specify both the event you are listening\
    \ for and the event handler that will be called, all inside your markup. To do\
    \ this, find the `return` function inside our `CounterParent` component, and make\
    \ the following change:\n\n[Click here to view code image](#part0036.xhtml_p111pro01)\n\
    \n```javascript\nreturn (\n  <div style={backgroundStyle}>\n    <Counter display={this.state.count}/>\n\
    \    <button onClick={this.increase} style={buttonStyle}>+</button>\n  </div>\n\
    );\n```\n\nWhat we’ve done is told React to call the `increase` function when\
    \ the `onClick` event is overheard. Next, let’s go ahead and implement the `increase`\
    \ function—aka our event handler. Inside our `CounterParent` component, add the\
    \ following lines:\n\n[Click here to view code image](#part0036.xhtml_p111pro02)\n\
    \n```javascript\nvar CounterParent = React.createClass({\n  getInitialState: function()\
    \ {\n    return {\n      count: 0\n    };\n  },\n  increase: function(e) {\n \
    \   this.setState({\n      count: this.state.count + 1\n    });\n  },\n  render:\
    \ function() {\n    var backgroundStyle = {\n      padding: 50,\n      backgroundColor:\
    \ \"#FFC53A\",\n      width: 250,\n      height: 100,\n      borderRadius: 10,\n\
    \      textAlign: \"center\"\n    };\n    var buttonStyle = {\n      fontSize:\
    \ \"1em\",\n      width: 30,\n      height: 30,\n      fontFamily: \"sans-serif\"\
    ,\n      color: \"#333\",\n      fontWeight: \"bold\",\n      lineHeight: \"3px\"\
    \n    };\n    return (\n      <div style={backgroundStyle}>\n        <Counter\
    \ display={this.state.count}/>\n        <button style={buttonStyle}>+</button>\n\
    \      </div>\n    );\n  }\n});\n```\n\n## Event Properties\n\nAs you know, our\
    \ events pass what is known as an event argument to our event handler. This event\
    \ argument contains a bunch of properties that are specific to the type of event\
    \ you are dealing with. In the regular DOM world, each event has its own type.\
    \ For example, if you are dealing with a mouse event, your event and its event\
    \ argument object will be of type `MouseEvent`. This `MouseEvent` object will\
    \ allow you to access mouse-specific information, like which button was pressed\
    \ or the screen position of the mouse click. Event arguments for a keyboard-related\
    \ event are of type `KeyboardEvent`. Your `KeyboardEvent` object contains properties\
    \ which (among many other things) allow you to figure out which key was actually\
    \ pressed. I could go on forever for every other `Event` type, but you get the\
    \ point. Each `Event` type contains its own set of properties that you can access\
    \ via the event handler for that event!\n\nWhy am I boring you with things you\
    \ already know? Well...\n\n### Synthetic Events\n\nIn React, when you specify\
    \ an event in JSX like we did with `onClick`, you are not directly dealing with\
    \ regular DOM events. Instead, you are dealing with a React-specific event type\
    \ known as a `SyntheticEvent`. Your event handlers don’t get native event arguments\
    \ of type `MouseEvent`, `KeyboardEvent`, etc. They always get event arguments\
    \ of type `SyntheticEvent` that wrap your browser’s native event instead. What\
    \ is the fallout of this in our code? Surprisingly not a whole lot.\n\nEach `SyntheticEvent`\
    \ contains the following properties:\n\n![Image](Images/image00275.jpeg)\n"
  raw: 'Under the covers, the way this example works is pretty simple. Each time you
    click on the button, an event gets fired. We listen for this event and do all
    sorts of React-ey things to get the counter to update when this event gets overheard.


    #### Starting Point


    To save all of us some time, we aren’t going to be creating everything in our
    example from scratch. By now, you probably have a good idea of how to work with
    components, styles, state, and so on. Instead, we are going to start off with
    a partially implemented example that contains everything except the event-related
    functionality that we are here to learn.


    First, create a new HTML document and ensure your starting point looks as follows:


    [Click here to view code image](#part0036.xhtml_p108pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React! React! React!</title>


      <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


      <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


      <style>


        #container {


          padding: 50px;


          background-color: #FFF;


        }


      </style>


    </head>


    <body>


      <div id="container"></div>


      <script type="text/babel">


      </script>


    </body>


    </html>


    Once your new HTML document looks like what you see above, it’s time to add our
    partially implemented counter example. Inside our `script` tag below the **container**
    `div`, add the following:


    [Click here to view code image](#part0036.xhtml_p109pro01)


    var destination = document.querySelector("#container");


    var Counter = React.createClass({


      render: function() {


          var textStyle = {


            fontSize: 72,


            fontFamily: "sans-serif",


            color: "#333",


            fontWeight: "bold"


          };


          return (


            <div style={textStyle}>


              {this.props.display}


            </div>


          );


        }


    });


    var CounterParent = React.createClass({


      getInitialState: function() {


        return {


          count: 0


        };


      },


      render: function() {


          var backgroundStyle = {


            padding: 50,


            backgroundColor: "#FFC53A",


            width: 250,


            height: 100,


            borderRadius: 10,


            textAlign: "center"


          };


          var buttonStyle = {


            fontSize: "1em",


            width: 30,


            height: 30,


            fontFamily: "sans-serif",


            color: "#333",


            fontWeight: "bold",


            lineHeight: "3px"


          };


          return (


            <div style={backgroundStyle}>


              <Counter display={this.state.count}/>


              <button style={buttonStyle}>+</button>


            </div>


          );


        }


    });


    ReactDOM.render(


      <div>


        <CounterParent/>


      </div>,


      destination


    );


    Once you have added all of this, preview everything in your browser to make sure
    things get displayed. You should see the beginning of our counter. Take a few
    moments to look at what all of this code does. There shouldn’t be anything that
    looks strange. The only odd thing will be that clicking the plus button won’t
    do anything. We’ll fix that right up in the next section.


    #### Making the Button Click Do Something


    Each time we click on the plus button, we want the value of our counter to increase
    by one. What we need to do is going to look roughly like this:


    **1.** Listen for the click event on the button and specify an event handler.


    **2.** Implement the event handler where we increase the value of our `this.state.count`
    property that our counter relies on.


    We’ll just go straight down the list—starting with listening for the click event.
    In React, you listen to an event by specifying everything inline in your JSX itself.
    More specifically, *you specify both the event you are listening for and the event
    handler that will get called, all inside your markup*. To do this, find the `return`
    function inside our `CounterParent` component, and make the following highlighted
    change:


    [Click here to view code image](#part0036.xhtml_p111pro01)


      .


      .


      .


    return (


      <div style={backgroundStyle}>


        <Counter display={this.state.count}/>


        <button onClick={this.increase} style={buttonStyle}>+</button> 


      </div>


    );


    What we’ve done is told React to call the `increase` function when the `onClick`
    event is overheard. Next, let’s go ahead and implement the `increase` function—aka
    our event handler. Inside our `CounterParent` component, add the following highlighted
    lines:


    [Click here to view code image](#part0036.xhtml_p111pro02)


    var CounterParent = React.createClass({


      getInitialState: function() {


        return {


          count: 0


        };


      },


      increase: function(e) {         


        this.setState({               


          count: this.state.count + 1 


        });                           


      },                              


      render: function() {


          var backgroundStyle = {


            padding: 50,


            backgroundColor: "#FFC53A",


            width: 250,


            height: 100,


            borderRadius: 10,


            textAlign: "center"


          };


          var buttonStyle = {


            fontSize: "1em",


            width: 30,


            height: 30,


            fontFamily: "sans-serif",


            color: "#333",


            fontWeight: "bold",


            lineHeight: "3px"


          };


          return (


            <div style={backgroundStyle}>


              <Counter display={this.state.count}/>


              <button onClick={this.increase} style={buttonStyle}>+</button>


            </div>


          );


        }


    });


    All we are doing with these lines is making sure that each call to the `increase`
    function increments the value of our `this.state.count` property by 1\. Because
    we are dealing with events, your `increase` function (as the designated event
    handler) will get access to the event argument. We have set this event argument
    to be accessed by `e`, and you can see that by looking at our `increase` function’s
    signature (aka what its declaration looks like). We’ll talk about the various
    events and their properties in a little bit.


    Now, go ahead and preview what you have in your browser. Once everything has loaded,
    click on the plus button to see all of our newly added code in action. Our counter
    value should increase with each click! Isn’t that pretty awesome?


    #### Event Properties


    As you know, our events pass what is known as an event argument to our event handler.
    This event argument contains a bunch of properties that are specific to the type
    of event you are dealing with. In the regular DOM world, each event has its own
    type. For example, if you are dealing with a mouse event, your event and its event
    argument object will be of type `MouseEvent`. This `MouseEvent` object will allow
    you to access mouse-specific information, like which button was pressed or the
    screen position of the mouse click. Event arguments for a keyboard-related event
    are of type `KeyboardEvent`. Your `KeyboardEvent` object contains properties which
    (among many other things) allow you to figure out which key was actually pressed.
    I could go on forever for every other `Event` type, but you get the point. Each
    `Event` type contains its own set of properties that you can access via the event
    handler for that event!


    Why am I boring you with things you already know? Well...


    ##### Meet Synthetic Events


    In React, when you specify an event in JSX like we did with `onClick`, you are
    not directly dealing with regular DOM events. Instead, you are dealing with a
    React-specific event type known as a `SyntheticEvent`. Your event handlers don’t
    get native event arguments of type `MouseEvent`, `KeyboardEvent`, etc. They always
    get event arguments of type `SyntheticEvent` that wrap your browser’s native event
    instead. What is the fallout of this in our code? Surprisingly not a whole lot.


    Each `SyntheticEvent` contains the following properties:


    ![Image](Images/image00275.jpeg)'
