     1  var Square = React.createClass({


     2    render: function() {


     3      var squareStyle = {          


     4        height: 150,               


     5        backgroundColor: "#FF6663" 


     6      };                           


     7      return(


     8       <div style={squareStyle}>   


     9                                   


    10       </div>                      


    11      );


    12    }


    13  });


    Just like with our `Card` component, we are returning a `div` element whose `style`
    attribute is set to a `style` object that defines how this component looks. To
    see our `Square` component in action, we need to get it onto our DOM just like
    we did with the `Card` component earlier. The difference this time around is that
    we won’t be calling the `Square` component via our `ReactDOM.render` function.
    Instead, we’ll call the `Square` component from inside the `Card` component. To
    see what I mean, go back to our `Card` component’s render function, and make the
    following change:


    [Click here to view code image](#part0031.xhtml_p060pro02)


    var Card = React.createClass({


      render: function() {


          var cardStyle = {


            height: 200,


            width: 150,


            padding: 0,


            backgroundColor: "#FFF",


            WebkitFilter: "drop-shadow(0px 0px 5px #666)",


            filter: "drop-shadow(0px 0px 5px #666)"


          };


          return (


            <div style={cardStyle}>


              <Square/> 


            </div>


          );


        }


    });


    At this point, if you preview our app, you’ll see a colorful square making an
    appearance (see [Figure 5-10](#part0012.xhtml_ch05fig10)).


    ![Image](Images/image00258.jpeg)


    Figure 5-10 The red portion appears.


    The cool thing to call out is that we called our `Square` component from inside
    the `Card` component! This is an example of **component composability** where
    one component relies on the output of another component. The final thing you see
    is the result of these two components colluding with each other. Isn’t collusion
    just beautiful—at least in this context?


    #### The Label Component


    The last component that remains is our `Label`. Go ahead and make the following
    highlighted changes:


    [Click here to view code image](#part0031.xhtml_p061pro01)


     1  var Label = React.createClass({


     2    render: function() {


     3      var labelStyle = {                  


     4        fontFamily: "sans-serif",         


     5        fontWeight: "bold",               


     6        padding: 13,                      


     7        margin: 0                         


     8      };                                  


     9


    10      return (


    11        <p style={labelStyle}>#FF6663</p> 


    12      );


    13    }


    14  });


    The pattern of what we are doing should be routine to you by now. We have a `style`
    object that we assign to what we return. What we return is a `p` element whose
    content is the string #FF6663\. To have what we return ultimately make it to our
    DOM, we need to call our `Label` component via our `Card` component. Go ahead
    and make the following highlighted change:


    [Click here to view code image](#part0031.xhtml_p062pro01)


     1  var Card = React.createClass({


     2    render: function() {


     3        var cardStyle = {


     4          height: 200,


     5          width: 150,


     6          padding: 0,


     7          backgroundColor: "#FFF",


     8          WebkitFilter: "drop-shadow(0px 0px 5px #666)",


     9          filter: "drop-shadow(0px 0px 5px #666)"


    10        };


    11


    12        return (


    13          <div style={cardStyle}>


    14            <Square/>


    15            <Label/> 


    16          </div>


    17        );


    18      }


    19  });


    Notice that our `Label` component lives just under the `Square` component we added
    to our `Card` component’s return function earlier. If you preview your app in
    the browser now, you should see something that looks like [Figure 5-11](#part0012.xhtml_ch05fig11).


    ![Image](Images/image00259.jpeg)


    Figure 5-11 The label appears.


    Yes, that’s right! Our color palette card is done and visible, thanks to the efforts
    of our `Card`, `Square`, and `Label` components. That doesn’t mean we are done
    yet, though. There are a few more things to cover.


    #### Passing Properties, Again!'
