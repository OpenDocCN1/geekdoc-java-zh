    \ method that gets called before our component renders. Inside that method, we\
    \ create an empty array called `items` that we can then access via `this.state.items`\
    \ from anywhere inside this component.\n\n### Handling the Form Submit\n\nWe add\
    \ new items to our todo list when you submit the form either by pressing the Add\
    \ button or hitting Enter/Return on your keyboard. This behavior is mostly builtin\
    \ to HTML and our browsers know all about how to deal with this. We don’t have\
    \ to write any special code for dealing with the Enter/Return key or listening\
    \ for a press on the Add button. The only thing we need to worry about is dealing\
    \ with what happens when the form actually gets submitted.\n\nTo do that, we listen\
    \ to the `onSubmit` event on our `form` element. This event is fired every time\
    \ the form is submitted, and that includes hitting the Enter/Return key or fiddling\
    \ with any element that has a `type` attribute of `submit` on it. When the form\
    \ is submitted and that event gets overheard, we will need to call an event handler.\
    \ Let’s give that event handler a name of `addItem`.\n\nPutting all of this together,\
    \ inside your `TodoList` component’s `render` function, make the following highlighted\
    \ change:\n\n[Click here to view code image](#part0040.xhtml_p170pro01)\n\n```javascript\n\
    render: function() {\n  return (\n    <div className=\"todoListMain\">\n     \
    \ <div className=\"header\">\n        <form onSubmit={this.addItem}>\n       \
    \   <input placeholder=\"enter task\"></input>\n          <button type=\"submit\"\
    >add</button>\n        </form>\n      </div>\n    </div>\n  );\n}\n```\n\nAs we\
    \ had hoped to do, we just linked our `form` element’s `onSubmit` event to the\
    \ `addItem` event handler. This event handler doesn’t exist, but we are going\
    \ to fix that by adding the following highlighted lines:\n\n[Click here to view\
    \ code image](#part0040.xhtml_p170pro02)\n\n```javascript\nvar TodoList = React.createClass({\n\
    \  getInitialState: function() {\n    return {\n      items: []\n    };\n  },\n\
    \  addItem: function(e) { \n  },\n  render: function() {\n    return (\n     \
    \ <div className=\"todoListMain\">\n        <div className=\"header\">\n     \
    \     <form onSubmit={this.addItem}>\n            <input placeholder=\"enter task\"\
    ></input>\n            <button type=\"submit\">add</button>\n        </form>\n\
    \        </div>\n      </div>\n    );\n  }\n});\n```\n\n`addItem` event handler/function\
    \ doesn’t do a lot right now, but the important thing is it exists! Next, we’ll\
    \ fix the part where it doesn’t do a lot.\n\n### Populating Our State\n\nRight\
    \ now, `TodoList` component’s `state` object contains the `items` array. What\
    \ we need to do is populate this array with the text you enter. That means we\
    \ need a way to access our `input` element from React. The way we are going to\
    \ do that is by setting a `ref` attribute (as you saw in [Chapter 2](#part0019.xhtml_ch2))\
    \ on our `input` element and storing the reference to the HTML element that gets\
    \ generated. Inside `TodoList` component’s `render` method, add the following\
    \ line:\n\n[Click here to view code image](#part0040.xhtml_p171pro01)\n\n```javascript\n\
    render: function() {\n  return (\n    <div className=\"todoListMain\">\n     \
    \ <div className=\"header\">\n        <form onSubmit={this.addItem}>\n       \
    \   <input ref={(a) => this._inputElement = a} placeholder=\"enter task\"></input>\n\
    \          <button type=\"submit\">add</button>\n        </form>\n      </div>\n\
    \    </div>\n  );\n}\n```\n\nWhen this highlighted code runs, which is immediately\
    \ after this component mounts, the `_inputElement` property will store a reference\
    \ to the generated `input` element. Now that we have done this, we can treat this\
    \ element like any DOM element we might have found using `querySelector` or equivalent\
    \ function in the non-React world. What we are going to do next is populate our\
    \ `items` array!\n\nGo ahead and modify the `addItem` method by adding the following\
    \ lines:\n\n[Click here to view code image](#part0040.xhtml_p171pro02)\n\n```javascript\n\
    addItem: function(e) {\n  var itemArray = this.state.items;\n  itemArray.push(\n\
    \    {\n      text: this._inputElement.value,\n      key: Date.now()\n    }\n\
    \  );\n  this.setState({\n    items: itemArray\n  });\n}\n```\n\n`addItem` event\
    \ handler doesn’t do a lot right now, but the important thing is it exists! Next,\
    \ we’ll fix the part where it doesn’t do a lot.\n\nRight now, `TodoList` component’s\
    \ `state` object contains the `items` array. What we need to do is populate this\
