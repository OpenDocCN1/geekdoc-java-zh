    \ HTML？它身上还藏着什么奇特性？在本章中，我们将回答所有这些问题以及更多！我们将进行一些深入的回溯（以及一些前向追踪！）以便更深入地了解为了成为专家所需的关于\
    \ JSX 的知识。\n\n### JSX 发生了什么？\n\n我们忽略的最重要的事情之一是试图弄清楚在我们写完 JSX 之后发生了什么。它是如何变成我们在浏览器中看到的\
    \ HTML 的？看看下面的示例，我们定义了一个名为 `Card` 的组件：\n\n点击此处查看代码图像\n\n```javascript\nvar Card\
    \ = React.createClass({\n  render: function() {\n    var cardStyle = {\n     \
