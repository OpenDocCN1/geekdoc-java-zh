    \ JSX 转换为 `JS` 都会产生性能影响。这在学习如何使用 React 时完全可以接受，但当你将应用用于实际生活时，这是完全不可接受的。正因为这种不可接受性，一旦你熟练地掌握了\
    \ React，我们将重新回顾这些内容，并查看第一种解决方案以及如何设置你的开发环境。\n\n### 开始你的 React 之之旅\n\n在上一节中，我们查看了确保你的\
    \ React 应用程序最终变为浏览器可以理解内容的两种方法。在本节中，我们将把所有这些话付诸实践。首先，我们需要一个空白的 HTML 页面作为我们的起点。\n\
    \n如果你手头没有空白的 HTML 页面，请使用以下代码：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>React! React! React!</title>\n</head>\n<body>\n  <script>\n \
    \ </script>\n</body>\n</html>\n```\n\n这个页面没有任何有趣或令人兴奋的内容，但让我们通过添加 React 库的引用来修复这个问题。在\
    \ `title` 正下方，添加这两行：\n\n点击此处查看代码图片\n\n```html\n<script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"\
    ></script>\n<script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
    ></script>\n```\n\n这两行代码引入了 React 核心库以及 React 与 `DOM` 所需的各种功能。没有了它们，你根本就在构建 React\
    \ 应用程序。现在，我们还没有结束。我们还需要引用另一个库。在这两个 `script` 标签正下方，添加以下行：\n\n点击此处查看代码图片\n\n```html\n\
    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n```\n\n我们在这里做的是添加对 Babel JavaScript 编译器 (`http://babeljs.io/`) 的引用。Babel\
    \ 做了很多很酷的事情，但我们关心的是它将 JSX 转换为 JavaScript 的能力。\n\n此时，我们的 HTML 页面应该看起来如下所示：\n\n\
    点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>React! React!\
    \ React!</title>\n  <script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"\
    ></script>\n  <script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n</head>\n<body>\n  <script>\n  </script>\n</body>\n</html>\n```\n\n\
    如果你现在预览你的页面，你会发现这个页面仍然是空白的，没有任何可见的内容。这没关系。我们接下来要修复它。\n\n### 显示你的名字\n\n我们要做的第一件事是使用\
    \ React 在屏幕上显示我们的名字。我们实现这一点的方法是使用一种名为 `render` 的方法。在你的 `script` 标签内部，添加以下内容：\n\
    \n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <h1>Sherlock Holmes</h1>,\n\
    \  document.body\n);\n```\n\n如果现在这些内容看起来都不懂，不要担心。我们的目标是先在屏幕上显示出点东西，稍后我们就会弄清楚我们做了什么。现在，在页面中预览以查看发生了什么之前，我们需要将此\
    \ `script` 块标记为 Babel 可以处理的内容。\n\n```html\n<script type=\"text/babel\">\nReactDOM.render(\n\
    \  <h1>Sherlock Holmes</h1>,\n  document.body\n);\n</script>\n```\n\n如果你现在预览页面，你会发现这个页面仍然是空白的，没有任何可见的内容。这没关系。我们接下来要修复它。\n\
    \n### 一切依然熟悉\n\n虽然由于 JSX 的存在 JavaScript 看起来很新鲜，但浏览器看到的最终结果是整洁的 HTML 和 JavaScript。为了让你亲眼看到，让我们对应用程序的行为和外观进行一些更改。\n\
    \n#### 更改目标\n\n我们要做的第一件事是更改 JSX 的输出位置。使用 JavaScript 将内容直接放在 `body` 元素中永远不是一个好主意。可能会出现很多问题——当你打算将\
    \ React 与其他 JS 库和框架混合时。推荐的方法是创建一个单独的元素并将其视为一个新的根元素。该元素将作为我们 `render` 方法使用的目标。要实现这一点，请返回\
    \ HTML 并添加一个 `id` 值为 `container` 的 `div` 元素。\n\n```html\n<body>\n  <div id=\"\
    container\"></div>\n</body>\n```\n\n"
- fmt: "\n```html\n<div id=\"container\"></div>\n\n<script type=\"text/babel\">\n\
    \  ReactDOM.render(\n    <h1>Batman</h1>,\n    document.body\n  );\n</script>\n\
    </body>\n```\n\n## Using the Container\n\nWith our `container` `div` element safely\
    \ defined, let’s modify the `render` method to use it instead of `document.body`.\
    \ Here is one way of doing this:\n\n```javascript\nReactDOM.render(\n  <h1>Batman</h1>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\nAnother way of doing this\
    \ is by doing some things outside of the `render` method itself:\n\n[Click here\
    \ to view code image](#part0028.xhtml_p018pro02)\n\n```javascript\nvar destination\
    \ = document.querySelector(\"#container\");\n\nReactDOM.render(\n  <h1>Batman</h1>,\n\
    \  destination\n);\n```\n\nNotice that the `destination` variable stores the reference\
    \ to our container DOM element. Inside the `render` method, we simply reference\
    \ the same `destination` variable instead of writing the full element-finding\
    \ syntax as part of the argument itself. The reason I want to do this is simple.\
    \ I want to show you that you are still writing JavaScript and `render` is just\
    \ another boring old method that happens to take two arguments.\n\n### Styling\
    \ It Up!\n\nTime for our last change before we call it a day. Right now, our names\
    \ show up in whatever default `h1` styling our browser provides. That is just\
    \ terrible, so let’s fix it by adding some CSS. Inside your `head` tag, add a\
    \ `style` block with the following CSS:\n\n```css\n#container {\n  padding: 50px;\n\
    \  background-color: #EEE;\n}\n\n#container h1 {\n  font-size: 48px;\n  font-family:\
    \ sans-serif;\n  color: #0080A8;\n}\n```\n\nAfter you have added all of this,\
    \ preview your page. Notice that our text appears with a little more purpose than\
    \ it did earlier when it relied entirely on the browser’s default styling (see\
    \ [Figure 2-1](#part0009.xhtml_ch02fig01)).\n\n![Image](Images/image00238.jpeg)\n\
    \nFigure 2-1 The result of adding the CSS.\n\nThe reason this works is that our\
    \ DOM’s `body`, after running all of the React code, contains our `container`\
    \ element with an `h1` tag inside it. It doesn’t matter that the `h1` tag was\
    \ defined entirely inside JavaScript in this JSX syntax or that your CSS was defined\
    \ well outside of the `render` method. The end result is that your React app is\
    \ still going to be made up of some 100% organic (and cage-free!) HTML, CSS, and\
    \ JavaScript:\n\n[Click here to view code image](#part0028.xhtml_p020pro01)\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>React! React! React!</title>\n\
    \  <script src=\"https://fb.me/react-15.1.0.js\"></script>\n  <script src=\"https://fb.me/react-dom-15.1.0.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #EEE;\n    }\n    #container h1 {\n      font-size: 144px;\n      font-family:\
    \ sans-serif;\n      color: #0080a8;\n    }\n  </style>\n</head>\n<body>\n  <div\
    \ id=\"container\"></div>\n  <script type=\"text/babel\">\n    var destination\
    \ = document.querySelector(\"#container\");\n    ReactDOM.render(React.createElement(\n\
    \      \"h1\",\n      null,\n      \"Batman\"\n    ), destination);\n  </script>\n\
    </body>\n</html>\n```\n\nNotice that there is nary a trace of React-like code\
    \ in sight. Also, we should use the word *nary* more often in everyday conversation!\n\
    \n### Conclusion\n\nIf this is your first time building a React app, we covered\
    \ a lot of ground here. One of the biggest takeaways is that React is different\
    \ than other libraries because it uses a whole new language called JSX to define\
    \ what the visuals will look like. We got a very small glimpse of that. The reason\
    \ this works is that our DOM’s `body`, after running all of the React code, contains\
    \ our `container` element with an `h1` tag inside it. It doesn’t matter that the\
    \ `h1` tag was defined entirely inside JavaScript in this JSX syntax or that your\
    \ CSS was defined well outside of the `render` method. The end result is that\
    \ your React app is still going to be made up of some 100% organic (and cage-free!)\
    \ HTML, CSS, and JavaScript.\n\n## 3. Components in React\n\nReact is different\
    \ than other libraries because it uses a whole new language called JSX to define\
    \ what the visuals will look like. We got a very small glimpse of that. The reason\
    \ this works is that our DOM’s `body`, after running all of the React code, contains\
    \ our `container` element with an `h1` tag inside it. It doesn’t matter that the\
    \ `h1` tag was defined entirely inside JavaScript in this JSX syntax or that your\
    \ CSS was defined well outside of the `render` method. The end result is that\
    \ your React app is still going to be made up of some 100% organic (and cage-free!)\
    \ HTML, CSS, and JavaScript.\n\nOne of the biggest takeaways is that React is\
    \ different than other libraries because it uses a whole new language called JSX\
    \ to define what the visuals will look like. We got a very small glimpse of that.\n\
    \n### A Quick Review of Functions\n\nIn JavaScript, you have these things known\
    \ as functions. They enable you to make your code a bit cleaner and reusable.\
    \ In a terrible world where functions do not exist, you may have some that looks\
    \ as follows:\n\n```javascript\nvar speed = 10;\nvar time = 5;\nalert(speed *\
    \ time);\nvar speed1 = 85;\nvar time1 = 1.5;\nalert(speed1 * time1);\nvar speed2\
    \ = 12;\nvar time2 = 9;\nalert(speed2 * time2);\n\nvar speed3 = 42;\nvar time3\
    \ = 21;\nalert(speed3 * time3);\n```\n\nIn a really chill world that involves\
    \ functions, you can condense all of that into something simple like the:\n\n\
    [Click here to view code image](#part0029.xhtml_p025pro01)\n\n```javascript\n\
    function getDistance(speed, time) {\n  var result = speed * time;\n  alert(result);\n\
    }\n```\n\nOur `getDistance` function removes all of the duplicated code you saw,\
    \ and it takes `speed` and `time` as arguments to enable you to customize the\
    \ calculation that gets returned. To call this function, all you have to do is\
    \ this:\n\n```javascript\ngetDistance(10, 5);\ngetDistance(85, 1.5);\ngetDistance(12,\
    \ 9);\ngetDistance(42, 21);\n```\n\nDoesn’t this look nicer? Now there is another\
    \ great value functions provide. Your functions (like the `alert` inside `getDistance`)\
    \ can call other functions as part of their running. Here is us using a `formatDistance`\
    \ function to change what gets returned by `getDistance`:\n\n[Click here to view\
    \ code image](#part0029.xhtml_p025pro02)\n\n```javascript\nfunction formatDistance(distance)\
    \ {\n  return distance + \"km\";\n}\n\nfunction getDistance(speed, time) {\n \
    \ var result = speed * time;\n  alert(formatDistance(result));\n}\n```\n"
