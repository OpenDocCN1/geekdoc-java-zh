    \ `container` 元素，内部有一个 `h1` 标签。无论 `h1` 标签是在这种 JSX 语法中完全在 JavaScript 内部定义的，还是你的\
    \ CSS 定义在 `render` 方法之外很的地方，最终结果是，你的 React 应用仍然将由一些 100% 有机（且无圈养！）的 HTML、CSS 和\
    \ JavaScript 组成。\n\n### 函数快速回顾\n\n在 JavaScript 中，你拥有这些被称为函数的东西。它们能让你的代码更整洁、可重用。在没有函数的糟糕世界里，你可能会有如下代码：\n\
    \n```javascript\nvar speed = 10;\nvar time = 5;\nalert(speed * time);\nvar speed1\
    \ = 85;\nvar time1 = 1.5;\nalert(speed1 * time1);\nvar speed2 = 12;\nvar time2\
    \ = 9;\nalert(speed2 * time2);\n\nvar speed3 = 42;\nvar time3 = 21;\nalert(speed3\
    \ * time3);\n```\n\n在涉及到函数的非常酷的世界里，你可以将这一切浓缩为类似：\n\n点击此处查看代码图片\n\n```javascript\n\
    function getDistance(speed, time) {\n  var result = speed * time;\n  alert(result);\n\
    }\n```\n\n我们的 `getDistance` 函数消除了你看到的所有重复代码，并且接受 `speed` 和 `time` 作为参数，以便你自定义返回的结果。要调用这个函数，你只需要这样做：\n\
    \n```javascript\ngetDistance(10, 5);\ngetDistance(85, 1.5);\ngetDistance(12, 9);\n\
    getDistance(42, 21);\n```\n\n这看起来不是更好了吗？现在有了函数提供的另一个巨大价值。你的函数（例如 `getDistance`\
    \ 内部的 `alert`）可以在运行时调用其他函数。这里是我们使用 `formatDistance` 函数来改变 `getDistance` 返回的内容：\n\
    \n点击此处查看代码图片\n\n```javascript\nfunction formatDistance(distance) {\n  return distance\
    \ + \"km\";\n}\n\nfunction getDistance(speed, time) {\n  var result = speed *\
    \ time;\n  alert(formatDistance(result));\n}\n```\n\n"
