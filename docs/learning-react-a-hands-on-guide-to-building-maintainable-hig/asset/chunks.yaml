      </div>,


      document.querySelector("#container")


    );


    If you get the capitalization wrong, React will not render your content properly.
    The component will not be found. Trying to identify capitalization issues is probably
    the last thing you’ll think about when things aren’t working, so keep this little
    tip in mind.


    #### Your JSX Can Be Anywhere


    In many situations, your JSX will not be neatly arranged inside a `render` or
    `return` function like in the examples we’ve seen so far. Take a look at the following
    example:


    [Click here to view code image](#part0033.xhtml_p088pro01)


    var swatchComponent = <Swatch color="#2F004F"></Swatch>;


    ReactDOM.render(


      <div>


        {swatchComponent}


      </div>,


      document.querySelector("#container")


    );


    We have a variable called `swatchComponent` that is initialized to a line of JSX.
    When our `swatchComponent` variable is placed inside the render function, our
    `Swatch` component gets initialized. All of this is totally valid, and we will
    do more such things in the future when we learn how to generate and manipulate
    JSX using JavaScript.


    ### Conclusion


    With this chapter, we’ve finally pieced together in one location the various bits
    of JSX information that the previous chapters introduced. The most important thing
    to remember is that ***JSX is not HTML***. It looks like HTML and behaves like
    it in many common scenarios, but it is ultimately designed to be translated into
    JavaScript. This means you can do things that you could never imagine doing using
    just plain HTML. Being able to evaluate expressions or programmatically manipulate
    entire chunks of JSX is just the beginning. In upcoming chapters, we’ll explore
    this intersection of JavaScript and JSX further.


    ## 8. Dealing with State


    Up until this point, the components we’ve created have been stateless. They have
    properties (aka props) that are passed in from their parent, but nothing (usually)
    changes about them once the components come alive. Your properties are considered
    immutable once they have been set. For many interactive scenarios, you don’t want
    that. You want to be able to change aspects of your components as a result of
    some user interaction (or some data getting returned from a server or a billion
    other things!)


    What we need is another way to store data on a component that goes beyond properties.
    We need a way to store data that can be changed. What we need is something known
    as **state**! In this chapter you learn all about it and how you can use it to
    create stateful components.


    ### Using State


    If you know how to work with properties, you totally know how to work with states...
    sort of. There are some differences, but they are too subtle to bore you with
    right now. Instead, let’s just jump right in and see states in action by using
    them in a small example.


    What we are going to is create a simple lightning counter example as shown in
    [Figure 8-1](#part0015.xhtml_ch08fig01).


    ![Image](Images/image00269.jpeg)


    Figure 8-1 The app you will be building.


    What this example does is nothing crazy. Lightning strikes the earth’s surface
    about 100 times a second ([http://environment.nationalgeographic.com/environment/natural-disasters/lightning-profile/](http://environment.nationalgeographic.com/environment/natural-disasters/lightning-profile/)).
    We have a counter that simply increments a number you see by that same amount.
    Let’s create it.


    #### Our Starting Point


    The primary focus of this example is to see how we can work with state. There
    is no point in us spending a bunch of time creating the example from scratch and
    retracing paths that we’ve walked many times already. That’s not the best use
    of anybody’s time.


    Instead of starting from scratch, modify an existing HTML document or create a
    new one with the following contents:


    [Click here to view code image](#part0034.xhtml_p090pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>More State!</title>


      <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


      <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


    </head>


    <body>


      <div id="container"></div>


      <script type="text/babel">


        var LightningCounter = React.createClass({


          render: function() {


            return (


              <h1>Hello!</h1>


            );


          }


        });


        var LightningCounterDisplay = React.createClass({


            render: function() {


              var divStyle = {


                width: 250,


                textAlign: "center",


                backgroundColor: "black",


                padding: 40,


                fontFamily: "sans-serif",


                color: "#999",


                borderRadius: 10


              };


              return(


                <div style={divStyle}>


                  <LightningCounter/>


                </div>


              );


            }


        });


        ReactDOM.render(


          <LightningCounterDisplay/>,


          document.querySelector("#container")


        );


      </script>


    </body>


    </html>


    At this point, take a few moments to look at what our existing code does. First,
    we have a component called `LightningCounterDisplay`:


    [Click here to view code image](#part0034.xhtml_p091pro01)


    var LightningCounterDisplay = React.createClass({


        render: function() {


          var divStyle = {


            width: 250,


            textAlign: "center",


            backgroundColor: "black",


            padding: 40,


            fontFamily: "sans-serif",


            color: "#999",


            borderRadius: 10


          };


          return(


            <div style={divStyle}>


              <LightningCounter/>


            </div>


          );


        }


    });


    The bulk of this component is the `divStyle` object that contains the styling
    information responsible for the cool rounded background. The `render` function
    returns a `div` element that wraps the `LightningCounter` component.


    The `LightningCounter` component is where all the action is going to be taking
    place:


    [Click here to view code image](#part0034.xhtml_p092pro01)


    var LightningCounter = React.createClass({


      render: function() {


        return (


          <h1>Hello!</h1>


        );


      }


    });


    This component, as it is right now, has nothing interesting going for it. It just
    returns the word **Hello!** That’s OK—we’ll fix this component up later.


    The last thing to look at is our `ReactDOM.render` method:


    [Click here to view code image](#part0034.xhtml_p092pro02)


    ReactDOM.render(


      <LightningCounterDisplay/>,


      document.querySelector("#container")


    );'
