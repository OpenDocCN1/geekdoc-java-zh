    \  <div>\n    <Letter bgcolor=\"#58B3FF\">A</Letter> \n    <Letter bgcolor=\"\
    #FF605F\">E</Letter> \n    <Letter bgcolor=\"#FFD52E\">I</Letter> \n    <Letter\
    \ bgcolor=\"#49DD8E\">O</Letter> \n    <Letter bgcolor=\"#AE99FF\">U</Letter>\
    \ \n  </div>,\n  destination\n);\n```\n\nNext, we need to use this property. In\
