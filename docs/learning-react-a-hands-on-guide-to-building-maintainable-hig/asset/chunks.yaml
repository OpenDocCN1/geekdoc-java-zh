  trans: "\n\n此方法在你的组件渲染并放置到 DOM 之后立即被调用。此时，你可以安全地执行任何 DOM 查询操作，而无需担心组件是否已经挂载。如果你有任何依赖于组件已就绪的代码，你也可以将所有这些代码指定在这里。\n\
    \n除了 `render` 方法外，所有这些生命周期方法`只能触发一次`。这与我们接下来要看到的方法非常不同。\n\n## 更新阶段\n\n当你的组件被添加到\
    \ DOM 之后，当属性（prop）或状态（state）发生变化时，它们可能会更新并重新渲染。在此期间，将调用一组不同的生命周期方法。哈欠。抱歉哈……\n\n\
    ### 处理状态变化\n\n首先，让我们来看看状态变化！当状态变化发生时，我们之前提过，你的组件会再次调用其 `render` 方法。任何依赖于该组件输出的组件也会调用它们的\
    \ `render` 方法。这样做是为了确保我们的组件始终显示其最新版本。这些都是事实，但那只是发生情况的局部表示。\n\n当状态变化发生时，图 11-5\
    \ 中的所有生命周期方法都会被调用。\n\n![Image](img/image00281.jpeg)\n\n图 11-5 状态变化发生时调用的生命周期方法。\n\
    \n这些生命周期方法的作用将在后续章节中概述。\n\n#### `shouldComponentUpdate`\n\n有时，你不希望组件在状态变化发生时进行更新。此方法允许你控制这种更新行为。如果你使用此方法并返回\
    \ `true` 值，则组件将更新。如果此方法返回 `false` 值，则该组件将跳过更新。\n\n这听起来可能有点困惑，这里有一个简单的代码片段：\n\n\
    点击此处查看代码图片\n\n```\nshouldComponentUpdate: function(newProps, newState) {\n  if\
    \ (newState.id <= 2) {\n    console.log(\"Component should update!\");\n    return\
    \ true;\n  } else {\n    console.log(\"Component should not update!\");\n    return\
    \ false;\n  }\n}\n```\n\n此方法带有两个参数被调用，我们将它们命名为 `newProps` 和 `newState`。我们在这段代码中做的是检查我们的\
    \ `id` 状态属性的新值是否小于或等于 2。如果该值小于或等于 2，我们返回 `true`，表示此组件应该更新。如果该值不小于等于 2，我们返回 `false`，表示此组件不应更新。\n\
    \n#### `componentWillUpdate`\n\n此方法在你的组件即将更新之前被调用。这里没有什么有趣的。需要注意的一点是，你不能通过在此方法中调用\
    \ `this.setState` 来更改你的状态。\n\n#### `render`\n\n如果你没有通过 `shouldComponentUpdate`（返回\
    \ `false`）覆盖更新，则 `render` 内部的代码将再次调用，以确保你的组件正确显示自己。\n\n#### `componentDidUpdate`\n\
    \n此方法在你的组件更新且 `render` 方法被调用之后被调用。如果你需要在更新发生后执行任何代码，这就是存放它们的地方。\n\n### 处理属性变化\n\
    \n你的组件更新的另一个时间是它被渲染到 DOM 之后属性值发生变化时。在这种情况下，图 11-6 中的生命周期方法会被调用。\n\n![Image](img/image00282.jpeg)\n\
    \n图 11-6 组件属性值变化时的生命周期方法。\n\n这里唯一的新方法是 `componentWillReceiveProps`。此方法返回一个参数，该参数是一个包含即将赋值给它的新属性值的对象。\n\
    \n我们稍早在查看状态变化时已经看到了其余生命周期方法，所以我们就不再重复回顾它们了。它们在处理属性变化时的行为是相同的。\n\n## 卸载阶段\n\n我们将看到的最后一个阶段是你的组件即将被销毁并从\
    \ DOM 中移除时（参见图 11-7）。\n\n![Image](img/image00283.jpeg)\n\n图 11-7 当你的组件即将销毁并从 DOM\
    \ 中移除时，只有一个生命周期方法处于活跃状态。\n\n这里只有一个活跃的生命周期方法，即 `componentWillUnmount`。你在这里执行任何清理相关的任务，例如移除事件监听器、停止计时等。在此方法被调用后，你的组件将从\
    \ DOM 中移除，你可以对它说*再见！*。\n\n### 结论\n\n我们的组件是非常迷人的小东西。从表面上看，它们似乎并没有发生什么。就像一部关于海洋的优秀纪录片，当我们观察得更深、更近时，简直就像看到了另一个全新的世界。事实证明，每当发生有趣的事情时，React\
    \ 都会不断地观察并通知你的组件。这一切都是通过我们在整个教程中看到的（极其无聊的）生命周期方法完成的。现在，我想向你保证，知道每个生命周期方法的作用以及它们何时被调用，某一天将会派上用场。你学到的一切并非微不足道。\n\
    \n## 12. 访问 DOM 元素\n\n有时你可能想要直接访问元素上的属性和方法。在我们这一个 JSX 代表一切的 React 世界里，你为什么要直接处理\
    \ HTML 呢？为了突出其中这样一种情况，请看图 12-1 中的 `Colorizer` 示例。\n\n![Image](img/image00284.jpeg)\n\
    \n图 12-1 Colorizer 示例。\n\n如果你可以访问浏览器，可以在以下位置查看演示：`https://www.kirupa.com/react/examples/colorizer.htm`\n\
    \n`Colorizer` 用你提供的任何颜色为（当前）白色正方形着色。要看到它的效果，在 `text-field` (impl) 中输入一个颜色值并点击/触摸\
    \ *go* 按钮。如果你不知道应该输入什么颜色，`yellow` 是一个不错的选择！一旦你提供了颜色并提交了它，白色正方形将变为你提供的任何颜色（参见图\
    \ 12-2）。\n\n![Image](img/image00285.jpeg)\n\n图 12-2 白色正方形变为黄色。\n\n正方形随你提交的任何有效颜色值而改变颜色这很棒，但\
    \ true 并不是我想让你关注的。相反，请注意在你提交值后的文本框和按钮。注意，按钮获得了焦点，而你刚刚提交的颜色值仍然显示在表单中。如果你想输入另一个颜色值，你需要显地将焦点返回到文本框并清除当前的任何值。呃！这看起来似乎没必要，从可用性的角度来看，我们可以做得更好！\n\
    \n现在，如果我们在提交颜色后能立即清除现有的颜色值并将焦点返回到文本框，那不是太好了吗？这意味着如果我们提交 `purple` 颜色值，我们之后看到的看起来将像图\
    \ 12-3。\n\n![Image](img/image00286.jpeg)\n\n图 12-3 我们得到了紫色，且文本框已准备好接受下一种颜色。\n\n"
- fmt: "\nThe entered value of `purple` is cleared, and the focus is returned to the\
    \ text field. This allows us to enter additional color values and submit them\
    \ easily without having to manually keep focus back and forth between the text\
    \ field and the button. Isn’t that much nicer?\n\nGetting this behavior right\
    \ using JSX and traditional React techniques is hard. We aren’t even going to\
    \ bother with explaining how to go about that. Getting this behavior right by\
    \ dealing with the JavaScript DOM API on various HTML elements directly is pretty\
    \ easy. Guess what we are going to do? In the following sections, we use something\
    \ known as `refs` that React provides to help us access the DOM API on HTML elements.\
    \ This chapter sounds really REALLY boring, but it is going to be a fun one—I’m\
    \ mostly sure of it.\n\n### Meet Refs\n\nAs you know very well by now, inside\
    \ our various `render` methods, we’ve been writing HTML-like things known as `JSX`.\
    \ Our `JSX` is simply a description of what the DOM should look like. It doesn’t\
    \ represent actual HTML—despite looking a whole lot like it. Anyway, to provide\
    \ a bridge between JSX and the final HTML elements in the DOM, React provides\
    \ us with something funnily known as `refs` (short for *references*).\n\nThe way\
    \ refs work is a little odd. The easiest way to make sense of it is to look at\
    \ an example. Let’s say we have a `render` method from our `Colorizer` example\
    \ that looks as follows:\n\n[Click here to view code image](#part0038.xhtml_p138pro01)\n\
    \n```javascript\nrender: function() {\n  var squareStyle = {\n    backgroundColor:\
    \ this.state.bgColor\n  };\n  return (\n    <div className=\"colorArea\">\n  \
    \    <div style={squareStyle} className=\"colorSquare\"></</div>\n      <form\
    \ onSubmit={this.setNewColor}>\n        <input\n          onChange={this.colorValue}\n\
    \          placeholder=\"Enter a color value\">\n        </input>\n        <button\
    \ type=\"submit\">go</button>\n      </form>\n    </div>\n  );\n}\n```\n\nInside\
    \ this `render` method, we are returning a big chunk of JSX representing (among\
    \ other things) the `input` element where we enter our color value. What we want\
    \ to do is access the `input` element’s DOM representation so that we can call\
    \ some APIs on it using JavaScript.\n\nThe way we do that using refs is by setting\
    \ the `ref` attribute on the element we would like to reference the HTML of:\n\
    \n[Click here to view code image](#part0038.xhtml_p138pro02)\n\n```javascript\n\
    render: function() {\n  var squareStyle = {\n    backgroundColor: this.state.bgColor\n\
    \  };\n  return (\n    <div className=\"colorArea\">\n      <div style={squareStyle}\
    \ className=\"colorSquare\"></</div>\n      <form onSubmit={this.setNewColor}>\n\
    \        <input\n          ref={} \n          onChange={this.colorValue}\n   \
    \       placeholder=\"Enter a color value\">\n        </input>\n        <button\
    \ type=\"submit\">go</button>\n      </form>\n    </div>\n  );\n}\n```\n\nBecause\
    \ we are interested in the `input` element, our `ref` attribute is attached to\
    \ it. Right now, our `ref` attribute is empty. What you typically set as the `ref`\
    \ attribute’s value is a JavaScript callback function. This function gets called\
    \ automatically when the component housing this render method gets mounted. If\
    \ we set our `ref` attribute’s value to a simple JavaScript function that stores\
    \ a reference to the referenced DOM element, it would look something like the\
    \ following highlighted lines:\n\n[Click here to view code image](#part0038.xhtml_p139pro01)\n\
    \n```javascript\n1  render: function() {\n2    var squareStyle = {\n3      backgroundColor:\
    \ this.state.bgColor\n4    };\n5\n6      var self = this; \n7\n8      return (\n\
    9        <div className=\"colorArea\">\n10         <div style={squareStyle} className=\"\
    colorSquare\"></</div>\n11\n12         <form onSubmit={this.setNewColor}>\n13\
    \           <input\n14           ref={\n15             function(el) {  \n16  \
    \           self._input = el; \n17           }          \n18         }\n19   \
    \        onChange={this.colorValue}\n20           placeholder=\"Enter a color\
    \ value\">\n21         </input>\n22         <button type=\"submit\">go</button>\n\
    23       </form>\n24     </div>\n25   );\n26 }\n```\n\nThe end result of this\
    \ code running our component mounts is simple: we can access the HTML representing\
    \ our `input` element from anywhere inside our component by calling `this._input`.\
    \ Take a few moments to see how the highlighted lines of code help do that. Once\
    \ you are done, we’ll walk through this code together.\n\nFirst, our callback\
    \ function looks as follows:\n\n```javascript\nfunction(el) {\n  self._input =\
    \ el;\n}\n```\n\nThis anonymous function gets called when our component mounts,\
    \ and a reference to the final DOM element is passed in as an argument. We capture\
    \ this argument using the `el` identifier, but you can use any name for this argument\
    \ that you want. The body of this callback function sets a custom property called\
    \ `_input` to the value of our DOM element. To ensure we create this property\
    \ on our component, we use the `self` variable to create a closure where the `this`\
    \ in question refers to our component as opposed to the callback function. (Autobinding\
    \ doesn’t happen automatically this around!)\n\nTaking a step back and looking\
    \ at the bigger picture that ties everything together including the `render` method\
    \ we just saw, let’s look at the full `Colorizer` component with all of the `ref`-related\
    \ shenanigans:\n\n[Click here to view code image](#part0038.xhtml_p140pro01)\n\
    \n```javascript\nvar Colorizer = React.createClass({\n  getInitialState: function()\
    \ {\n    return {\n      color: '',\n      bgColor: ''\n    }\n  },\n  colorValue:\
    \ function(e) {\n    this.setState({color: e.target.value});\n  },\n  setNewColor:\
    \ function(e){\n    this.setState({bgColor: this.state.color});\n    this._input.value\
    \ = \"\"; \n    this._input.focus();   \n    e.preventDefault();\n  },\n  render:\
    \ function() {\n    var squareStyle = {\n      backgroundColor: this.state.bgColor\n\
    \    };\n    var self = this; \n    return (\n      <div className=\"colorArea\"\
    >\n        <div style={squareStyle} className=\"colorSquare\"></</div>\n     \
    \   <form onSubmit={this.setNewColor}>\n          <input\n            ref={\n\
    \              function(el) {  \n                self._input = el; \n        \
    \      }          \n            }\n            onChange={this.colorValue}\n  \
    \          placeholder=\"Enter a color value\">\n          </input>\n        \
    \  <button type=\"submit\">go</button>\n        </form>\n      </div>\n    );\n\
    \  }\n});\n```\n\nFocusing just on what happens to our `input` element, when the\
    \ form gets submitted and the `setNewColor` method gets called, we clear the contents\
    \ of our `input` element by calling `this._input.value`. We set focus to our `input`\
    \ element by calling `this._input.focus()`. All of our `ref-` related work was\
    \ simply to enable these two lines where we needed some way to have `this._input`\
    \ point to the HTML element we define in JSX.\n\n### Simplifying Further with\
    \ ES6 Arrow Functions\n\nLearning React is hard enough, so I have tried to shy\
    \ away from forcing you to use ES6 techniques by default. When it comes to working\
    \ with the `ref` attribute, using arrow functions to deal with the callback function\
    \ does simplify matters a bit. This is one of those cases where I recommend you\
    \ use an ES6 technique.\n\nAs you saw a few moments ago, to assign a property\
    \ on our component to the referenced HTML element, we did something like this:\n\
    \n[Click here to view code image](#part0038.xhtml_p141pro01)\n\n```javascript\n\
    <input\n  ref={\n    function(el) {\n      self._input = el;\n    }\n  }\n  onChange={this.colorValue}\n\
    \  placeholder=\"Enter a color value\">\n</input>\n```\n"
