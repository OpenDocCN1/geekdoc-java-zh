  trans: "\n你想做的是从你的红圆传递一个属性到我们的紫色圆，并在那里使用它。而我们做不到的是如图 6-2 所示那种非常显而易见且直接的操作。\n\n![Image](img/image00262.jpeg)\n\
    \n图 6-2 不能这样做。\n\n你不能直接将属性传递给你想要的目标组件或多个组件。原因与 React 的工作机制有关。`React 强制了一种命令链，属性必须从父组件向下流动到直接子组件`。这意味着在发送属性时，你不能跳过子组件层。这意味着你的子组件也不能将属性传回父组件。所有的通信都是从父组件到子单单向。\n\
    \n在这些指南下，从我们的红圆传递属性到紫色圆看起来有点像图 6-3。\n\n![Image](img/image00263.jpeg)\n\n图 6-3\
    \ 属性从父组件传递到子组件。\n\n预期路径上的每个组件都必须从其父组件接收属性，然后将该属性重新发送给其子组件。这个过程重复，直到你的属性到达预期目的地。问题出在这个接收和重新发送的步骤中。\n\
    \n如果我们从代表红圆的组件向代表紫色圆的组件发送名为 `color` 的属性，它通目的路径看起来会像图 6-4。\n\n![Image](img/image00264.jpeg)\n\
    \n图 6-4 发送 `color` 属性。\n\n现在，假设有两个需要发送的属性，如图 6-5 所示。\n\n![Image](img/image00265.jpeg)\n\
    \n图 6-5 发送两个属性。\n\n如果我们想发送三个属性呢？或者四个呢？\n\n我们可以很快看出，这种方法既不可扩展也不具有可维护性。对于每增加一个需要通信的额外属性，我们都必须在声明每个组件时为其添加一个条目。如果我们在某个时刻决定重命名属性，我们必须确保该属性的每个实例都被重命名。如果我们删除一个属性，我们需要从每个依赖它的组件中删除该属性。总的来说，这些都是我们在编写代码时试图避免的情况。对此我们能做什么呢？\n\
    \n### 详细分析问题\n\n在上一节中，我们从宏观上讨论了问题所在。在深入寻找解决方案之前，我们需要跳出图表，查看带有真实代码的更详细示例。我们需要查看类似下面的内容：\n\
    \n点击此处查看代码\n\n```javascript\nvar Display = React.createClass({\n  render: function()\
    \ {\n    return(\n      <div>\n        <p>{this.props.color}</p>\n        <p>{this.props.num}</p>\n\
    \        <p>{this.props.size}</p>\n      </div>\n    );\n  }\n});\n\nvar Label\
    \ = React.createClass({\n  render: function() {\n    return (\n      <Display\
    \ color={this.props.color}\n               num={this.props.num}\n            \
    \   size={this.props.size}/>\n    );\n  }\n});\n\nvar Shirt = React.createClass({\n\
    \  render: function() {\n    return (\n      <div>\n        <Label color={this.props.color}\n\
    \               num={this.props.num}\n               size={this.props.size}/>\n\
    \      </div>\n    );\n  }\n});\n\nReactDOM.render(\n  <div>\n    <Shirt color=\"\
    steelblue\" num=\"3.14\" size=\"medium\"/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n花几分钟理解一下发生了什么。完成后，让我们过一遍这个示例。我们有一个 `Shirt` 组件，它依赖于 `Label`\
    \ 组件的输出，而 `Label` 组件又依赖于 `Display` 组件的输出。（试着快速读这句话！）无论如何，组件层级可以在图 6-6 所示。\n\n\
    ![Image](img/image00266.jpeg)\n\n图 6-6 组件层级。\n\n当你运行这段代码时，输出的内容并不特别。它只是三行文本（参见图\
    \ 6-7）。\n\n![Image](img/image00267.jpeg)\n\n图 6-7 三行文本。\n\n有趣的部分是文本是如何到达那里的。你看到的三行文本中的每一行都对应于\
    \ `ReactDOM.render` 内部最初指定的属性：\n\n点击此处查看代码\n\n```html\n<Shirt color=\"steelblue\"\
    \ num=\"3.14\" size=\"medium\"/>\n```\n\n`color`、`num` 和 `size` 属性（及其值）经历了一段直到\
    \ `Display` 组件的旅程，让最经验丰富的旅行者都会嫉妒。让我们追踪这些属性从产生到被消费的过程，我意识到这些属性从 `ReactDOM.render`\
    \ 开始。让我们追踪这些属性从其产生到被消费的过程，我意识到这些属性在 `Shirt` 组件被调用时，包含了 `color`、`num` 和 `size`\
    \ 属性。让我们追踪这些属性从其产生到被消费的过程，我意识到这些属性在 `ReactDOM.render` 中被定义。让我们追踪这些属性从其产生到被消费的过程，我意识到这些属性在\
    \ `props` 对象中被存储。\n"
- fmt: "\nWe have an array called `items` that contains three values. We also have\
    \ a function called `printStuff` that takes three arguments. What we want to do\
    \ is to specify the three values from our `items` array as arguments to the `printStuff`\
    \ function. Sounds simple enough, right?\n\nHere is one really common way of doing\
    \ that:\n\n[Click here to view code image](#part0032.xhtml_p078pro02)\n\n```javascript\n\
    printStuff(items[0], items[1], items[2]);\n```\n\nWe access each array item individually\
    \ and pass it in to our `printStuff` function. With the spread operator, we now\
    \ have an easier way. You don’t have to specify each item in the array individually\
    \ at all. You can just do something like this:\n\n```javascript\nprintStuff(...items);\n\
    ```\n\nThe spread operator is the `...` characters before our `items` array, and\
    \ using `...items` is identical to listing `items[0]`, `items[1]`, and `items[2]`\
    \ individually like we did earlier. The `printStuff` function will run and print\
    \ the numbers 1, 2, and 3 to our console. Pretty cool, right?\n\nNow that you’ve\
    \ seen the spread operator in action, it’s time to define it. `The spread operator\
    \ enables you to unwrap an array into its individual elements`. The spread operator\
    \ does a few more things as well, but that’s not important for now. We are going\
    \ to only use this particular side of the spread operator to solve our property\
    \ transferring problem!\n\n### Properly Transferring Properties\n\nWe just saw\
    \ an example where we used the spread operator to avoid having to enumerate every\
    \ single item in our array as part of passing it to a function:\n\n[Click here\
    \ to view code image](#part0032.xhtml_p078pro03)\n\n```javascript\nvar items =\
    \ [\"1\", \"2\", \"3\"];\n\nfunction printStuff(a, b, c) {\n  console.log(\"Printing:\
    \ \" + a + \" \" + b + \" \" + c);\n}\n\n// using the spread operator\nprintStuff(...items);\n\
    \n// without using the spread operator\nprintStuff(items[0], items[1], items[2]);\n\
    ```\n\nThe situation we are facing with transferring properties across components\
    \ is very similar to our problem of accessing each array item individually. Allow\
    \ me to elaborate.\n\nInside a component, our `props` object looks as follows:\n\
    \n```javascript\nvar props = {\n  color: \"steelblue\",\n  num: \"3.14\",\n  size:\
    \ \"medium\"\n}\n```\n\nAs part of passing these property values to a child component,\
    \ we manually access each item from our `props` object:\n\n[Click here to view\
    \ code image](#part0032.xhtml_p079pro01)\n\n```jsx\n<Display color={this.props.color}\n\
    \      num={this.props.num}\n      size={this.props.size}/>\n```\n\nWouldn’t it\
    \ be great if there was a way to unwrap an object and pass on the property/value\
    \ pairs just like we were able to unwrap an array using the spread operator?\n\
    \nAs it turns out, there is a way. It actually involves the spread operator as\
    \ well. I’ll explain how later, but what this means is that we can call our `Display`\
    \ component by using `...props`:\n\n```jsx\n<Display {...props}/>\n```\n\nBy using\
    \ `...props`, the runtime behavior is the same as specifying the `color`, `num`,\
    \ and `size` properties manually. This means our earlier example can be simplified\
    \ as follows (pay attention to the highlighted lines):\n\n[Click here to view\
    \ code image](#part0032.xhtml_p079pro02)\n\n```javascript\nvar Display = React.createClass({\n\
    \  render: function() {\n    return(\n      <div>\n        <p>{this.props.color}</p>\n\
    \        <p>{this.props.num}</p>\n        <p>{this.props.size}</p>\n      </div>\n\
    \    );\n  }\n});\n\nvar Label = React.createClass({\n  render: function() {\n\
    \    return (\n      <Display {...this.props}/>   \n    );\n  }\n});\n\nvar Shirt\
    \ = React.createClass({\n  render: function() {\n    return (\n      <div>\n \
    \       <Label {...this.props}/> \n      </div>\n    );\n  }\n});\n\nReactDOM.render(\n\
    \  <div>\n    <Shirt color=\"steelblue\" num=\"3.14\" size=\"medium\"/>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\nIf you run this code, the\
    \ end result is to be unchanged from what we had. The biggest difference is that\
    \ we are no longer passing expanded forms of each property as part of calling\
    \ component. This solves all the problems we set out.\n\nBy using the spread operator,\
    \ if you ever decide to add properties, rename properties, or do any sort of property-related\
    \ shenanigans, you don’t have to make a billion changes. You make one change at\
    \ the spot where you define your property. You make another change at the spot\
    \ you consume the property. That’s it. All of the intermediate components that\
    \ merely transfer the properties will remain untouched, for `{...this.props}`\
    \ contains no details of what goes inside.\n\n### Conclusion\n\nAs designed by\
    \ the ES6/2015 committee, the spread operator is designed to work only on arrays\
    \ and array-like creatures (aka which has a `Symbol.iterator` property). The fact\
    \ that it works on object literals like our `props` object is due to React extending\
    \ the standard. As of now, no browser currently supports the spread object on\
    \ object literals. The reason our example works is because of Babel. Besides turning\
    \ all of our JSX into something our browser understands, Babel also turns cutting-edge\
    \ and experimental features into something cross-browser friendly. That is why\
    \ we are able to get away with using the spread operator on an object literal,\
    \ and that is why we are able to elegantly solve the problem of transferring properties\
    \ across multiple layers of components!\n\n## 7. Meet JSX—Again!\n\nAs you probably\
    \ noticed by now, we’ve been using a lot of JSX in the previous. What we really\
    \ haven’t done is taken a good look at what JSX actually is. How does it actually\
    \ work? Why do we not call it HTML? What quirks does it have up its sleeve? In\
    \ this chapter, we answer all of those questions and more! We do some serious\
    \ backtracking (and some forwardtracking!) to get a deeper look at what we need\
    \ to know about JSX in order to be.\n\n### What Happens with JSX?\n\nOne of the\
    \ biggest things we’ve glossed over is trying to figure out what happens with\
    \ our JSX after we’ve written it. How does it end up as HTML that we see in our\
    \ browser? Take a look at the following example where we define a component called\
    \ `Card`:\n\n[Click here to view code image](#part0033.xhtml_p081pro01)\n\n```javascript\n\
    var Card = React.createClass({\n  render: function() {\n    var cardStyle = {\n\
    \      height: 200,\n      width: 150,\n      padding: 0,\n      backgroundColor:\
    \ \"#FFF\",\n      WebkitFilter: \"drop-shadow(0px 0px 5px #666)\",\n      filter:\
    \ \"drop-shadow(0px 0px 5px #666)\"\n    };\n    return (\n      <div style={cardStyle}>\n\
    \        <Square color={this.props.color}/>\n        <Label color={this.props.color}/>\n\
    \      </div>\n    );\n  }\n});\n```\n\nWe can quickly spot the JSX here. It is\
    \ the following four lines:\n\n[Click here to view code image](#part0033.xhtml_p082pro01)\n\
    \n```jsx\n<div style={cardStyle}>\n  <Square color={this.props.color}/>\n  <Label\
    \ color={this.props.color}/>\n</div>\n```\n\nThe thing to keep in mind is that\
    \ our browsers have no idea what to do with JSX. They probably think you are crazy\
    \ if you ever even try to describe JSX to them. That is why we have been relying\
    \ on things like Babel to turn that JSX into something the browsers understand:\
    \ `JavaScript`.\n\nWhat this means is that the JSX we write is for human (and\
    \ well-trained cats’) eyes only. When this JSX reaches our browser, it ends up\
    \ getting turned into pure JavaScript:\n\n[Click here to view code image](#part0033.xhtml_p082pro02)\n\
    \n```javascript\nreturn React.createElement(\n  \"div\",\n  { style: cardStyle\
    \ },\n  React.createElement(Square, { color: this.props.color }),\n  React.createElement(Label,\
    \ { color: this.props.color })\n);\n```\n\nAll of those neatly nested HTML-like\
    \ elements, their attributes, and their children all get turned into a series\
    \ of `createElement` calls with default initialization values. Here is what our\
    \ entire `Card` component looks like when it gets turned into JavaScript:\n\n\
    [Click here to view code image](#part0033.xhtml_p082pro03)\n\n```javascript\n\
    var Card = React.createClass({\n  displayName: \"Card\",\n});\n```\n"
  raw: 'We have an array called `items` that contains three values. We also have a
    function called `printStuff` that takes three arguments. What we want to do is
    specify the three values from our `items` array as arguments to the `printStuff`
    function. Sounds simple enough, right?


    Here is one really common way of doing that:


    [Click here to view code image](#part0032.xhtml_p078pro02)


    printStuff(items[0], items[1], items[2]);


    We access each array item individually and pass it in to our `printStuff` function.
    With the spread operator, we now have an easier way. You don’t have to specify
    each item in the array individually at all. You can just do something like this:


    printStuff(...items);


    The spread operator is the `...` characters before our `items` array, and using
    `...items` is identical to listing `items[0]`, `items[1]`, and `items[2]` individually
    like we did earlier. The `printStuff` function will run and print the numbers
    1, 2, and 3 to our console. Pretty cool, right?


    Now that you’ve seen the spread operator in action, it’s time to define it. *The
    spread operator enables you to unwrap an array into its individual elements*.
    The spread operator does a few more things as well, but that’s not important for
    now. We are going to only use this particular side of the spread operator to solve
    our property transferring problem!


    ### Properly Transferring Properties


    We just saw an example where we used the spread operator to avoid having to enumerate
    every single item in our array as part of passing it to a function:


    [Click here to view code image](#part0032.xhtml_p078pro03)


    var items = ["1", "2", "3"];


    function printStuff(a, b, c) {


      console.log("Printing: " + a + " " + b + " " + c);


    }


    // using the spread operator


    printStuff(...items);


    // without using the spread operator


    printStuff(items[0], items[1], items[2]);


    The situation we are facing with transferring properties across components is
    very similar to our problem of accessing each array item individually. Allow me
    to elaborate.


    Inside a component, our `props` object looks as follows:


    var props = {


      color: "steelblue",


      num: "3.14",


      size: "medium"


    }


    As part of passing these property values to a child component, we manually access
    each item from our `props` object:


    [Click here to view code image](#part0032.xhtml_p079pro01)


    <Display color={this.props.color}


            num={this.props.num}


            size={this.props.size}/>


    Wouldn’t it be great if there was a way to unwrap an object and pass on the property/value
    pairs just like we were able to unwrap an array using the spread operator?


    As it turns out, there is a way. It actually involves the spread operator as well.
    I’ll explain how later, but what this means is that we can call our `Display`
    component by using `...props`:


    <Display {...props}/>


    By using `...props`, the runtime behavior is the same as specifying the `color`,
    `num`, and `size` properties manually. This means our earlier example can be simplified
    as follows (pay attention to the highlighted lines):


    [Click here to view code image](#part0032.xhtml_p079pro02)


    var Display = React.createClass({


      render: function() {


        return(


          <div>


            <p>{this.props.color}</p>


            <p>{this.props.num}</p>


            <p>{this.props.size}</p>


          </div>


        );


      }


    });


    var Label = React.createClass({


      render: function() {


        return (


          <Display {...this.props}/>   


        );


      }


    });


    var Shirt = React.createClass({


      render: function() {


          return (


            <div>


              <Label {...this.props}/> 


            </div>


          );


        }


    });


    ReactDOM.render(


      <div>


        <Shirt color="steelblue" num="3.14" size="medium"/>


      </div>,


      document.querySelector("#container")


    );


    If you run this code, the end result is going to be unchanged from what we had
    earlier. The biggest difference is that we are no longer passing in expanded forms
    of each property as part of calling each component. This solves all the problems
    we originally set out to solve.


    By using the spread operator, if you ever decide to add properties, rename properties,
    remove properties, or do any other sort of property-related shenanigans, you don’t
    have to make a billion different changes. You make one change at the spot where
    you define your property. You make another change at the spot you consume the
    property. That’s it. All of the intermediate components that merely transfer the
    properties on will remain untouched, for the `{...this.props}` expression contains
    no details of what goes on inside it.


    ### Conclusion


    As designed by the ES6/ES2015 committee, the spread operator is designed to work
    only on arrays and array-like creatures (aka that which has a `Symbol.iterator`
    property). The fact that it works on object literals like our `props` object is
    due to React extending the standard. As of now, no browser currently supports
    using the spread object on object literals. The reason our example works is because
    of Babel. Besides turning all of our JSX into something our browser understands,
    Babel also turns cutting-edge and experimental features into something cross-browser
    friendly. That is why we are able to get away with using the spread operator on
    an object literal, and that is why we are able to elegantly solve the problem
    of transferring properties across multiple layers of components!


    ## 7. Meet JSX—Again!


    As you probably noticed by now, we’ve been using a lot of JSX in the previous
    chapters. What we really haven’t done is taken a good look at what JSX actually
    is. How does it actually work? Why do we not just call it HTML? What quirks does
    it have up its sleeve? In this chapter, we answer all of those questions and more!
    We do some serious backtracking (and some forwardtracking!) to get a deeper look
    at what we need to know about JSX in order to be dangerous.


    ### What Happens with JSX?


    One of the biggest things we’ve glossed over is trying to figure out what happens
    with our JSX after we’ve written it. How does it end up as HTML that we see in
    our browser? Take a look at the following example where we define a component
    called `Card`:


    [Click here to view code image](#part0033.xhtml_p081pro01)


    var Card = React.createClass({


      render: function() {


          var cardStyle = {


            height: 200,


            width: 150,


            padding: 0,


            backgroundColor: "#FFF",


            WebkitFilter: "drop-shadow(0px 0px 5px #666)",


            filter: "drop-shadow(0px 0px 5px #666)"


          };


          return (


            <div style={cardStyle}>


              <Square color={this.props.color}/>


              <Label color={this.props.color}/>


            </div>


          );


        }


    });


    We can quickly spot the JSX here. It is the following four lines:


    [Click here to view code image](#part0033.xhtml_p082pro01)


    <div style={cardStyle}>


      <Square color={this.props.color}/>


      <Label color={this.props.color}/>


    </div>


    The thing to keep in mind is that our browsers have no idea what to do with JSX.
    They probably think you are crazy if you ever even try to describe JSX to them.
    That is why we have been relying on things like Babel to turn that JSX into something
    the browsers understand: **JavaScript**.


    What this means is that the JSX we write is for human (and well-trained cats’)
    eyes only. When this JSX reaches our browser, it ends up getting turned into pure
    JavaScript:


    [Click here to view code image](#part0033.xhtml_p082pro02)


    return React.createElement(


      "div",


      { style: cardStyle },


      React.createElement(Square, { color: this.props.color }),


      React.createElement(Label, { color: this.props.color })


    );


    All of those neatly nested HTML-like elements, their attributes, and their children
    all get turned into a series of `createElement` calls with default initialization
    values. Here is what our entire `Card` component looks like when it gets turned
    into JavaScript:


    [Click here to view code image](#part0033.xhtml_p082pro03)


    var Card = React.createClass({


      displayName: "Card",'
