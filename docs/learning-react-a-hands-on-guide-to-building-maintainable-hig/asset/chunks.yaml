    </body>


    </html>


    Be sure to save your file after adding this content in. Now, speaking of the content,
    our markup is pretty simple. Our document’s body is just an empty `div` element
    with an `id` value of **container** and a `script` tag that points to the final
    JavaScript file (**myCode.js**) that will get generated inside the **output**
    folder:


    [Click here to view code image](#part0041.xhtml_p186pro01)


    <script src="output/myCode.js"></script>


    Besides those two things, our HTML file doesn’t have a whole lot going for it.
    If we had to visualize the relationship of everything right now, it looks a bit
    like [Figure 15-6](#part0022.xhtml_ch15fig06).


    ![Image](Images/image00306.jpeg)


    Figure 15-6 What your current project structure looks like.


    I’ve dotted the line to the **myCode.js** file in our **output** folder because
