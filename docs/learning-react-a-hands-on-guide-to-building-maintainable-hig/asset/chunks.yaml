    )\n);\n```\n\n当想要表示组件时，组件名称在 JSX 中以及定义时都必须大写字母开头：\n\n点击此处查看代码图片\n\n```javascript\n\
    ReactDOM.render(\n  <div>\n    <MyCustomComponent/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n如果你写错了大小写，`React` 将无法正常渲染你的内容。该组件将无法被找到。当程序运行异常时，尝试识别大小写问题可能是你最后才会想到的事情，所以记住这个小贴士。\n\
    \n### 你的 JSX 可以在任何地方\n\n在很多情况下，你的 JSX 不会像整齐地排列在 `render` 或 `return` 函数中（就像我们目前看到的示例那样）。请看以下示例：\n\
    \n点击此处查看代码图片\n\n```javascript\nvar swatchComponent = <Swatch color=\"#2F004F\"\
    ></Swatch>;\n\nReactDOM.render(\n  <div>\n    {swatchComponent}\n  </div>,\n \
    \ document.querySelector(\"#container\")\n);\n```\n\n我们有一个名为 `swatchComponent`\
    \ 的变量，它被初始化为一行 JSX。当我们的 `swatchComponent` 变量被放在渲染函数内部时，`Swatch` 组件就会被初始化。这一切都是完全有效的，未来当我们学习了如何使用\
    \ `JavaScript` 生成和操作 JSX 时，我们还会做更多此类事情。\n\n### 结论\n\n通过这一章，我们终于在一个位置汇总了之前章节介绍的各种\
    \ JSX 信息。最重要记住的一点是：`JSX 不是 HTML`。在许多常见场景下，它看起来像 HTML，行为也像 HTML，但它最终是设计用来翻译成 JavaScript\
    \ 的。这意味着你可以做一些仅使用纯 HTML 永远无法实现的事情。能够评估表达式或通过编程方式操作整个 JSX 块仅仅是一个开始。在接下来的章节中，我们将进一步探索\
    \ JavaScript 和 JSX 的交汇点。\n\n## 8. 处理状态 (State)\n\n到为止，我们创建的组件都是无状态的。它们拥有从父元素传递的属性（即\
    \ props），但一旦组件激活，它们（通常）就不会发生任何变化。一旦你的属性被设置，它们就被认为是不可变的。对于许多交互场景，你不希望这样。你希望能够根据某些用户交互（或从服务器返回的数据或其他数十万件事！）来改变组件的某些方面。\n\
    \n我们需要另一种在组件上存储数据的方法，而不仅仅属性。我们需要一种存储可以更改的数据的方法。我们需要被称为 `state`（状态）的东西！在本章中，你将学习关于它的所有知识，以及如何使用它来创建有状态组件。\n\
    \n### 使用状态\n\n如果你知道如何处理属性，你就完全知道如何处理状态了……大概吧。它们之间存在一些差异，但太微妙了，现在没必要让你感到无聊。相反，让我们直接开始，通过一个小示例在使用状态来观察状态的运行情况。\n\
    \n我们将创建一个简单的闪电计数器示例，如图 8-1 所示。\n\n![Image](img/image00269.jpeg)\n\n图 8-1 你将构建的应用。\n\
    \n这个示例所做的并不疯狂。闪电每秒击中表面大约 100 次（[`environment.nationalgeographic.com/environment/natural-disasters/lightning-profile`](http://environment.nationalgeographic.com/environment/natural-disasters/lightning-profile)）。我们有一个计数器，简单地根据该次数增加你看到的数字。让我们创建它。\n\
    \n#### 我们的起点\n\n这个示例的初重点是看到我们可以处理状态。我们没有必要花费大量时间从头创建这个示例并重溯我们走过的很多次路径。这对任何人的时间都不是最好的利用。\n\
    \n与其从头开始，不如修改现有的 HTML 文档或创建一个包含以下内容的新文档：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>More State!</title>\n  <script src=\"https://unpkg.com/react@15.6.2/umd/react.development.js\"\
    ></script>\n  <script src=\"https://unpkg.com/react-dom@15.6.2/umd/react-dom.development.js\"\
    ></script>\n  <script src=\"https://unpkg.com/@babel/standalone@6.21.0/babel.min.js\"\
    ></script>\n</head>\n<body>\n  <div id=\"container\"></div>\n  <script type=\"\
    text/babel\">\n    var LightningCounter = React.createClass({\n      render: function()\
    \ {\n        return (\n          <h1>Hello!</h1>\n        );\n      }\n    });\n\
    \n    var LightningCounterDisplay = React.createClass({\n      render: function()\
    \ {\n        var divStyle = {\n          width: 250,\n          textAlign: \"\
    center\",\n          backgroundColor: \"black\",\n          padding: 40,\n   \
    \       color: \"#999\",\n          borderRadius: 10\n        };\n        return\
    \ (\n          <div style={divStyle}>\n            <LightningCounter/>\n     \
    \     </div>\n        );\n      }\n    });\n\n    ReactDOM.render(\n      <LightningCounterDisplay/>,\n\
    \      document.querySelector(\"#container\")\n    );\n  </script>\n</body>\n\
    </html>\n```\n\n在此处，请花一点时间观察现有代码的作用。首先，我们有一个名为 `LightningCounterDisplay` 的组件：\n\
    \n点击此处查看代码图片\n\n```javascript\n    var LightningCounter = React.createClass({\n\
    \      render: function() {\n        return (\n          <h1>Hello!</h1>\n   \
    \     );\n      }\n    });\n\n    var LightningCounterDisplay = React.createClass({\n\
    \      render: function() {\n        var divStyle = {\n          width: 250,\n\
    \          textAlign: \"center\",\n          backgroundColor: \"black\",\n   \
    \       padding: 40,\n          color: \"#999\",\n          borderRadius: 10\n\
    \        };\n        return (\n          <div style={divStyle}>\n            <LightningCounter/>\n\
    \          </div>\n        );\n      }\n    });\n\n    ReactDOM.render(\n    \
    \  <LightningCounterDisplay/>,\n      document.querySelector(\"#container\")\n\
    \    );\n```\n\n这个组件的大部分是 `divStyle` 对象，它包含了负责圆角背景的样式信息。`render` 函数返回一个包裹了 `LightningCounter`\
    \ 组件的 `div` 元素。\n\n`LightningCounter` 组件将是所有动作发生的地方：\n\n点击此处查看代码图片\n\n```javascript\n\
    \    var LightningCounter = React.createClass({\n      render: function() {\n\
    \        return (\n          <h1>Hello!</h1>\n        );\n      }\n    });\n```\n\
    \n"
- fmt: "\nIt just pushes the `LightningCounterDisplay` component into our container\
    \ `div` element in our DOM. That’s pretty much it. The end result is that you\
    \ see the combination of markup from our `ReactDOM.render` method and the `LightningCounterDisplay`\
    \ and `LightningCounter` components.\n\n### Getting Our Counter On\n\nNow that\
    \ we have an idea of what we are starting with, it’s time to make plans for our\
    \ next steps. The way our counter works is pretty simple. We are going to be using\
    \ a `setInterval` function that calls some code every 1000 milliseconds (aka 1\
    \ second). That “some code” is going to increment a value by `100` each time it\
    \ is called. Seems pretty straightforward, right?\n\nTo make this all work, we\
    \ are going to be relying on three APIs that our React Component exposes:\n\n\
    ![Image](Images/image00226.jpeg) `getInitialState`—This method runs just before\
    \ your component gets mounted, and it allows you to modify a component’s `state`\
    \ object.\n\n![Image](Images/image00226.jpeg) `componentDidMount`—This method\
    \ gets called just after our component gets rendered (or mounted as React calls\
    \ it).\n\n![Image](Images/image00226.jpeg) `setState`—This method allows you to\
    \ update the value of the `state` object.\n\nWe’ll see these APIs in use shortly,\
    \ but I wanted to give you a preview of them so that you can spot them easily\
    \ in a lineup!\n\n#### Setting the Initial State Value\n\nWe need a variable to\
    \ act as our counter, and let’s call this variable `strikes`. There are a bunch\
    \ of ways to create this variable. The most obvious one is the following:\n\n\
    ```javascript\nvar strikes = 0 // :P\n```\n\nWe don’t want to do that, though.\
    \ For our example, the `strikes` variable is part of our component’s state, and\
    \ its value is what we display on screen. What we are going to do is use the `getInitialState`\
    \ method that we briefly saw a few moments ago and take care of initializing our\
    \ variable inside it. You’ll see in a few moments what result that has on our\
    \ component’s state.\n\nInside your `LightningCounter` component, add the following\
    \ highlighted lines:\n\n[Click here to view code image](#part0034.xhtml_p093pro01)\n\
    \n```javascript\nvar LightningCounter = React.createClass({\n  getInitialState:\
    \ function() { \n    return {                          \n      strikes: 0    \
    \                \n    };                          \n  },                    \
    \      \n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n```\n\nThe `getInitialState` method automatically runs waaaay\
    \ before your component gets rendered, and what we are doing is telling React\
    \ to return an object containing our `strikes` property (initialized to `0`).\
    \ You may be wondering to whom or what we are returning this object to? All of\
    \ that is magic that happens under the covers. The object that gets returned is\
    \ set as the initial value for our component’s `state` object.\n\nIf we inspect\
    \ the value of our `state` object after this code has run, it would look something\
    \ like the following:\n\n```javascript\nvar state = {\n  strikes: 0\n}\n```\n\n\
    Before we wrap this section up, let’s visualize our `strikes` property. In our\
    \ `render` method, make the following highlighted change:\n\n[Click here to view\
    \ code image](#part0034.xhtml_p094pro01)\n\n```javascript\nvar LightningCounter\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ strikes: 0\n    };\n  },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\
    \ \n    );\n  }\n});\n```\n\nWhat we’ve done is replaced our default **Hello!**\
    \ text with an expression that displays the value stored by the `this.state.strikes`\
    \ property. If you preview your example in the browser, you will see a value of\
    \ 0 displayed. That’s a start!\n\n#### Starting Our Timer and Setting State\n\n\
    Next up is getting our timer going and incrementing our `strikes` property. Like\
    \ we mentioned earlier we will be using the `setInterval` function to increase\
    \ the `strikes` property by `100` every second. We are going to do all of this\
    \ immediately after our component has been rendered using the built-in `componentDidMount`\
    \ method.\n\nThe code for kicking off our timer looks as follows:\n\n[Click here\
    \ to view code image](#part034.xhtml_p094pro02)\n\n```javascript\nvar LightningCounter\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ strikes: 0\n    };\n  },\n  componentDidMount: function() {\n    setInterval(this.timerTick,\
    \ 1000);\n  },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n```\n\nGo ahead and add these highlighted lines to our example.\
    \ Inside our `componentDidMount` method that gets called once our component gets\
    \ rendered, we have our `setInterval` method that calls a `timerTick` function\
    \ every second (or 1000 milliseconds).\n\nWe haven’t defined our `timerTick` function,\
    \ so let’s fix that by adding the following highlighted lines to our code:\n\n\
    [Click here to view code image](#part034.xhtml_p095pro01)\n\n```javascript\nvar\
    \ LightningCounter = React.createClass({\n  getInitialState: function() {\n  \
    \  return {\n      strikes: 0\n    };\n  },\n  timerTick: function() {\n    this.setState({\n\
    \      strikes: this.state.strikes + 100\n    });\n  },\n  componentDidMount:\
    \ function() {\n    setInterval(this.timerTick, 1000);\n  },\n  render: function()\
    \ {\n    return (\n      <h1>{this.state.strikes}</h1>\n    );\n  }\n});\n```\n\
    \nWhat our `timerTick` function does is pretty simple. It just calls `setState`.\
    \ The `setState` method comes in various flavors, but for what we are doing here,\
    \ it takes an object as its argument. This object contains all the properties\
    \ you want to merge into the state object. In our case, we are specifying the\
    \ `strikes` property and setting its value to be 100 more than what it is currently.\n\
    \nHow does `timerTick` maintain context?\n\nIn regular JavaScript, the `timerTick`\
    \ function won’t maintain context. You have to do extra work to support that.\
    \ The reason it works in the React world is because of something known as **autobinding**.\n\
    \n#### Rendering the State Change\n\nIf you preview your app now, you’ll see our\
    \ `strikes` value start to increment by 100 every second (see [Figure 8-2](#part0015.xhtml_ch08fig02)).\n\
    \n![Image](Images/image00270.jpeg)\n\nFigure 8-2 The `strikes` value increments\
    \ by 100 every second.\n\nLet’s ignore for a moment what happens with our code.\
    \ That is pretty straightforward. The interesting thing is how everything we’ve\
    \ done ends up updating what you see on the screen. That updating has to do with\
    \ this React behavior: Whenever you call `setState` and update something in the\
    \ `state` object, your component’s `render` method gets automatically called.\
    \ This kicks off a cascade of `render` calls for any component whose output is\
    \ also affected. The end result of all this is what you see in your screen in\
    \ the latest representation of your app’s UI state. Keeping your data and UI in\
    \ sync is one of the hardest problems with UI development, so it’s nice that React\
    \ takes care of this.\n\n### Optional: The Full Code\n\nWhat we have right now\
    \ is just a counter that increments by 100 every second. Nothing about it screams\
    \ *Lightning Counter*, but it does cover everything about states that I wanted\
    \ you to learn right now. If you want to optionally flesh out your example to\
    \ look like my version that you saw at the beginning, below is the full code for\
    \ what goes inside our `script` tag:\n\n[Click here to view code image](#part034.xhtml_p096pro01)\n\
    \n```javascript\nvar LightningCounter = React.createClass({\n  getInitialState:\
    \ function() {\n    return {\n      strikes: 0\n    };\n  },\n  timerTick: function()\
    \ {\n    this.setState({\n      strikes: this.state.strikes + 100\n    });\n \
    \ },\n  componentDidMount: function() {\n    setInterval(this.timerTick, 1000);\n\
    \  },\n  render: function() {\n```\n"
