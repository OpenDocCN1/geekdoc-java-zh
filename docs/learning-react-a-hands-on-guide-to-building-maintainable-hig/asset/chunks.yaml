    我们最后一个查看的 React 相关的主题与其说是 React 本身，不如说是关于如何设置你的开发环境来构建 React 应用。到目前为止，我们一直通过包含几个脚本文件来构建
    React 应用：


    点击此处查看代码图片


    ```html

    <script src="https://npmcdn.com/react@15.3.0/dist/react.js"></script>

    <script src="https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js"></script>

    ```


    这些脚本文件不仅加载了 React 库，还加载了 Babel，帮助我们的浏览器在遇到 JSX 这种奇异事物时，完成需要的操作（参见图 15-1）。


    ![Image](img/image00301.jpeg)


    图 15-1 我们的 React 方法。


    为了回顾我们之前在讨论这种方法时提到的内容，它的缺点是性能。作为浏览器执行其通常执行的所有页面加载相关工作的一部分，它还负责将你的 JSX 转换为实际 JavaScript。这种
    JSX 到 JavaScript 的转换是一个耗时的过程，在开发期间是可以接受的。但如果你的应用程序的每个用户都必须付出这种性能代价，那就不太妙了。


    解决方案是设置你的开发环境，在用户加载页面之前处理好 JSX 到 JS 的转换（参见图 15-2）。


    ![Image](img/image00302.jpeg)


    图 15-2 作为应用构建过程一部分的 JSX 到 JavaScript 转换。


    有了这种解决方案，你的浏览器加载应用时，处理的是一个已经转换（并可能经过了优化的）JavaScript 文件。很棒对吧？现在，我们推迟到现在谈论这一切的唯一原因是为了`简单`。学习
    React 已经足够困难了。在学习 React 的过程中增加构建工具和设置环境的复杂性，这并不酷。现在你已经牢牢掌握了 React 的所有功能，是时候通过这一章来改变现状了。


    在接下来的章节中，我们将介绍一种结合 Node、Babel 和 webpack 来设置开发环境的方法。如果这一切听起来对你来说很奇怪，不要担心。到结束时，你将和所有这些工具如老朋友般熟悉。


    ***


    注意：内容可能会变化


    构建工具及其依赖项一直在变化。这对我们来说是个好消息，但它让发布相关信息变成了一项挑战！本章包含了基于当前（即编写本文时！）最佳实践的最新信息，但这些信息可能会变化。如果你发现某些工具和说明的工作方式与描述的不符，请通过以下地址查看本文的在线版本（更新更频繁）：[`www.kirupa.com/react/setting_up_react_environment.htm`](https://www.kirupa.com/react/setting_up_react_environment.htm)


    ***


    ### 认识工具


    好了，是时候跳出笼统的论述（以及那些精美的图表）了。是时候严肃起来了——呃。是时候认识我们将用来正确设置开发环境并依赖的工具了。


    #### Node.js


    在很长一段时间里，JavaScript 主要是你用来让浏览器运行某些功能的代码。Node.js 改变了这一切。Node.js 允许你使用 JavaScript
    创建运行在服务器上的应用程序，并访问浏览器梦都无法想象到的 API 和系统资源。它基本上是一个完整的应用程序开发运行时，其程序（而不是用 Java、C#、C++
    等语言编写）完全基于 JavaScript 进行构建并运行。


    对于我们的目的来说，我们将依赖 `Node.js`（准确地说是 Node 包管理器，即 `NPM`）来管理依赖，并将从 JSX 到 JavaScript 所需的步骤结合起来。将
    `Node.js` 想象成让我们的开发环境运行的胶水。


    #### Babel


    这个我们应该很熟悉！简单来说，Babel 是一个 JavaScript 转译器。它将你的 JavaScript 转换为……嗯……JavaScript。这听起来非常奇怪，所以让我澄清一下。如果你使用最新的的
    JavaScript 特性，旧版浏览器在遇到新函数或属性时可能不知道该怎么办。如果你在写 JSX，那么……没有任何浏览器知道该如何处理它！


    Babel 的作用是将你新颖的 JS 或 JSX 转换为大多数浏览器都能理解的 JS 形式。我们直以来一直使用它的浏览器端版本将 JSX 转换为 JavaScript。稍后，你将看到我们如何将
    Babel 集为构建过程的一部分，从我们的 JSX 生成一个真正的、浏览器可读的 JS 文件。


    #### Webpack


    我们将依赖的最后一个工具是 `webpack`。它被称为模块打包器。抛开这些华丽的头衔，你的应用所包含的许多框架和库都有许多依赖项，你所依赖的功能部分可能只是更大组件的一个子集。


    你可能不需要所有这些必要的代码，而像 `webpack` 这样的工具起着重要作用，让你能够只包含运行应用所需的相关代码。它们通常会将所有相关代码（即使它们来自不同的来源）打包到一个文件中（参见图
    15-3）。


    ![Image](img/image0033.jpeg)


    图 15-3 打包成单个文件。


    #### 你的代码编辑器


    如果不谈论这一切最重要的工具——你的代码编辑器，关于开发环境的讨论无法进行（参见图 15-4）。


    ![Image](img/image0034.jpeg)


    图 15-4 你的编辑器。


    无论你使用 Sublime、Atom、VS Code、TextMate、Coda 或任何其他工具，你都会在代码编辑器中花费大量时间，不仅是为了构建 React
    应用，还为了配置 Node、Babel 需要各种文件。


    ### 环境搭建！


    到目前，你应该对我们正在尝试做的有一个模糊的想法……我们试图实现的梦想！我们甚至查看了实现这一梦想将发挥作用的各种工具。现在，是时候通过实际工作来实现它了。


    #### 设置初始项目结构


    我们要做的第一件事是设置项目。去桌面创建一个名为 **MyTotallyApp** 的新文件夹。在该文件夹内部创建两个名为 **dev** 和 **output**
    的文件夹。你的目录结构看起来像图 15-5。


    ![Image](img/image00305.jpeg)


    图 15-5 我们目前的目录结构。


    我们在这里做的非常简单。在 **dev** 文件夹中，我们将放置所有未优化和未转换的 JSX、JavaScript 以及其他脚本内容。换句话之，这就是你编写和活跃工作的代码所在地。在
    **output** 文件夹中，我们将放置对 **dev** 文件夹中的脚本文件运行各种构建工具后的结果。这是 Babel 将我们所有的 JSX 文件转换为
    JS 的地方。这也是 webpack 解析我们脚本文件之间的依赖关系，并将所有重要的脚本内容放入单个 JavaScript 文件中的地方。


    接下来我们要的是创建一个浏览器指向的 HTML 文件。在 **MyTotallyApp** 文件夹中，使用你的代码编辑器创建一个名为 **index.html**
    的新 HTML 文件，内容如下：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

      <title>React! React! React!</title>

    </head>

    </html>

    ```

