  trans: "\n在构建单页应用（SPA）时，页面中总有一部分是保持静态的。这个静态部分也被称为 `app frame`（应用框架），它可能是一个不可见的 HTML\
    \ 元素，作为所有内容的容器，也可以包含一些额外的视觉元素，如页头、页脚、导航等。在我们的案例中，应用框架将包含我们的导航页头和一个用于加载内容的空白区域。为了显示这些内容，我们将创建一个负责此项的组件。\n\
    \n在 `ReactDOM.render` 调用上方的 `script` 标签内，请添加以下 JSX 和 JavaScript 代码：\n\n点击此处查看代码图片\n\
    \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
    \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
    >\n          <li>Home</li>\n          <li>Stuff</li>\n          <li>Contact</li>\n\
    \        </ul>\n        <div className=\"content\">\n        </div>\n      </div>\n\
    \    )\n  }\n});\n```\n\n一旦完成粘贴，请查看我们这里的内容。我们有一个名为 `App` 的组件，它返回了一些 HTML。为了查看这些\
    \ HTML 看起来什么样，请修改你的 `ReactDOM.render` 调用以引用此组件，而不是显示单词 `Hello!`。请进行以下高亮更改：\n\n\
    ```javascript\nReactDOM.render(\n  <div>\n    <App/> \n  </div>,\n  destination\n\
    );\n```\n\n完成后，在浏览器中预览你的应用。你应该能看到一个无样式的应用标题和一些列表项（参见图 13-3）。\n\n![Image](img/image028.jpeg)\n\
    \n图 13-3 无样式的版本。\n\n我知道这看起来并不华丽或经过设计，但现在没关系，我们稍后会处理。深入一点，我们所做的只是创建了一个名为 `App`\
    \ 的组件并通过 `ReactDOM.render` 调用显示它。重要的一是，这里没有任何 React Router。完全没有！这是 React 的基础知识。让我们通过引入\
    \ React Router 来修复这个问题。将你的 `ReactDOM.render` 调用内容替换为以下内容：\n\n点击此处查看代码图片\n\n```javascript\n\
    ReactDOM.render(\n  <ReactRouter.Router>                   \n    <ReactRouter.Route\
    \ path=\"/\" component={App}>\n  </ReactRouter.Router>,\n  destination\n);\n```\n\
    \n先不管它看起来有多奇怪，在你做出更改后在浏览器中预览你的应用。如果一切正常，你将像之前一样看到 `App` 组件。现在，让我们通过学习这里的原理来弄清楚为什么是这样。我们将\
    \ React 离核心概念，学习 React Router 特有的内容。\n\n首先，我们做的是指定 `Router` 组件：\n\n点击此处查看代码图片\n\
    \n```javascript\nReactDOM.render(\n  <ReactRouter.Router>   \n    <ReactRouter.Route\
    \ path=\"/\" component={App}>\n  </ReactRouter.Router>,\n  destination\n);\n```\n\
    \n`Router` 组件是 React Router API 的，它的任务是处理应用所需的所有路由逻辑。在这个组件内部，我们指定的 `routing configuration`（路由配置）是一个描述\
    \ URL 与视图之间映射的高级术语。它的细节由另一个名为 `Route` 的组件处理：\n\n点击此处查看代码图片\n\n```javascript\n\
    ReactDOM.render(\n  <ReactRouter.Router>\n    <ReactRouter.Route path=\"/\" component={App}>\n\
    \  </ReactRouter.Router>,\n  destination\n);\n```\n\n`Route` 组件接收多个 `props` 来帮助定义在什么\
    \ URL 显示什么。`path` 属性指定我们感兴趣的 URL。在这种情况下，它是 `/`。`component` 属性允许指定想要显示的组件名称。在这个例子中，它是\
    \ `App`。整合这一切，这个 `Route` 的意思是如果你所在的 URL 是根路径，就显示 `App` 组件。当你预览应用时，由于条件成立，你会看到\
    \ `App` 组件渲染的结果。\n\n### 显示主页\n\n正如你所看到的，React Router 提供这些功能的方式是使用你已经熟悉的 React\
    \ 概念——即 `components`、`props` 和 `JSX`。我们目前的应用框架是一个很好的例子。现在是时候进一步了。我们接下来要做的是定义作为我们主视图的一部分的内容。为了做到，我们将创建一个名为\
    \ `Home` 的组件，它将包含我们要显示的标记。在你的 `App` 组件上方添加以下内容：\n\n点击此处查看代码图片\n\n```javascript\n\
    var Home = React.createClass({\n  render: function() {\n    return (\n      <div>\n\
    \        <h2>HELLO</h2>\n        <p>Cras facilisis urna ex volutpat, et vallis\
    \ erat elementum. Ut aliquam, ipsum vitae suscipit, metus bibendum est, rhoncus\
    \ nibh nec massa. Maecenas hendrerit augue molestie. Cum sociis penatibus et magnis\
    \ parturient montes, ridiculus mus.</p>\n        <p>Duis a turpis sed dapibus\
    \ elementum sed lectus.</p>\n      </div>\n    );\n  }\n});\n```\n\n你可以看到，`Home`\
    \ 组件并没有特别。它只是返回了一段 HTML。现在，我们要页面加载时显示 `Home` 组件的内容。这个组件相当于应用的“主页”。我们这样做的方法很简单。在\
    \ `App` 组件内部，我们有一个类值为 `content` 的 `div`。我们将那里加载 `Home` 组件。明显的解决方案可能像这样：\n\n点击此处查看代码图片\n\
    \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
    \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
    >\n          <li>Home</li>\n          <li>Stuff</li>\n          <li>Contact</li>\n\
    \        </ul>\n        <div className=\"content\">\n          <Home/> \n    \
    \    </div>\n      </div>\n    )\n  }\n});\n```\n\n注意我们在那个 `content` `div` 内部定义了\
    \ `Home` 组件。如果你预览应用，事情甚至看起来如预期般工作（参见图 13-4）。\n\n![Image](img/image0290.jpeg)\n\
    \n图 13-4 功能增强。\n\n你看到了导航页头，然后看到了我们 `Home` 组件的内容。虽然这种方法可行，但实际上并不是正确的做法。它是错误的，因为它使用户在应用中导航时加载其他部分内容的愿望变得复杂。我们本质上是将应用硬编码为只显示\
    \ `Home` 组件。这是一个问题，但我们稍后会回来讨论。\n\n### 中期清理时间\n\n在继续开发应用之前，让我们稍微休息一下，对目前已有的进行一些样式上的改进。\n\
    \n#### 添加 CSS\n\n现在，我们的应用看起来非常单调……像 19 世纪的产物。为了修复这个问题，我们将依靠我们的老朋友 CSS。在 `style`\
    \ 标签内，请添加以下样式规则：\n\n点击此处查看代码图片\n\n```css\nbody {\n  background-color: #FFCC00;\n\
    \  padding: 20px;\n  margin: 0;\n}\n\nh1, h2, p, ul, li {\n  font-family: Helvetica,\
    \ Arial, sans-serif;\n}\n\nul.header li {\n  display: inline;\n  list-style-type:\
    \ none;\n  margin: 0;\n}\n\nul.header {\n  background-color: #111;\n  padding:\
    \ 0;\n}\n```\n"
- fmt: "\n```css\nul.header li a {\n  color: #FFF;\n  font-weight: bold;\n  text-decoration:\
    \ none;\n  padding: 20px;\n  display: inline-block;\n}\n\n.content {\n  background-color:\
    \ #FFF;\n  padding: 20px;\n}\n\n.content h2 {\n  padding: 0;\n  margin: 0;\n}\n\
    \n.content li {\n  margin-bottom: 10px;\n}\n```\n\nYes, we are using CSS in its\
    \ markup form. We aren’t doing the inline style object approach that we saw in\
    \ [Chapter 4](#part0011.xhtml_ch04). The reason has to do with convenience. Our\
    \ components aren’t going to be re-used outside of our particular app, and we\
    \ really want to take advantage of CSS inheritance to minimize duplicated markup.\
    \ Otherwise, if we didn’t use regular CSS, we’ll end up with a bunch of giant\
    \ style objects defined for almost every element in our markup. That would make\
    \ even the most patient among us annoyed when reading the code.\n\nAnyway, once\
    \ you have added all of this CSS, our app will start to look much better (see\
    \ [Figure 13-5](#part0020.xhtml_ch13fig05)).\n\n![Image](Images/image00291.jpeg)\n\
    \nFigure 13-5 CSS styling added.\n\nThere is still some more work to be done (for\
    \ example, our navigation links disappeared behind the black banner), but we’ll\
    \ fix all of those up in a little bit.\n\n### Avoiding the ReactRouter Prefix\n\
    \nWe have just one more cleanup related task before we return to our regularly\
    \ scheduled programming. Have you noticed that every single time we call something\
    \ defined by the React Router API, we prefix that something with the word `ReactRouter`?\n\
    \n[Click here to view code image](#part0039.xhtml_p153pro01)\n\n```jsx\n<ReactRouter.Router>\n\
    \  <ReactRouter.Route path=\"/\" component={App}>\n  </ReactRouter.Route>\n</ReactRouter.Router>\n\
    ```\n\nThat is a bit verbose to have to repeat for every API call we make, and\
    \ this is going to be more of a problem as we dive further into the React Router\
    \ API and use more things from inside it.\n\nThe fix for this involves using a\
    \ new ES6 trick where you can manually specify which values will automatically\
    \ get prefixed. Towards the top of your `script` tag, add the following:\n\n```javascript\n\
    var { Router,\n      Route,\n      IndexRoute,\n      IndexLink,\n      Link }\
    \ = ReactRouter;\n```\n\nOnce you’ve added this code, every time you use one of\
    \ the values defined inside the brackets, the prefix `ReactRouter` will automatically\
    \ be added for you when your app runs. This means, you can now go back to your\
    \ `ReactDOM.render` method and remove the `ReactRouter` prefix from our `Router`\
    \ and `Route` component instances:\n\n[Click here to view code image](#part0039.xhtml_p154pro01)\n\
    \n```jsx\nReactDOM.render(\n  <Router>\n    <Route path=\"/\" component={App}>\n\
    \    </Route>\n  </Router>,\n  destination\n);\n```\n\nIf you preview your app\
    \ now, nothing really should change. The end result is identical to what you had\
    \ before. The only difference is that our markup is a bit more compact.\n\nNow,\
    \ before we move on, you are probably wondering why the list of values that will\
    \ automatically be prefixed with `ReactRouter` contains a whole bunch of things\
    \ beyond the `Router` and `Route` values that we have used in our code so far.\
    \ Think of these additional values as a preview of the other parts of the React\
    \ Router API we will be using shortly. Spoiler alert! (Probably too late to mention\
    \ that now, eh?)\n\n### Displaying the Home Page Correctly\n\nWe ended a few sections\
    \ ago by saying that the way we currently have our home page displayed is incorrect.\
    \ Although you get the desired result when our page loads, this approach doesn’t\
    \ really make it easy for us to load anything other than the home page when users\
    \ navigate around. The call to our `Home` component is hard-coded inside `App`.\n\
    \nThe correct solution involves letting React Router handle which component to\
    \ call depending on what your current URL structure is. This involves nesting\
    \ `Route` components inside `Route` components to better define the URL-to-view\
    \ mapping. Go back to our `ReactDOM.render` method, and make the following highlighted\
    \ change:\n\n[Click here to view code image](#part0039.xhtml_p154pro02)\n\n```jsx\n\
    ReactDOM.render(\n  <Router>\n    <Route path=\"/\" component={App}>\n      <IndexRoute\
    \ component={Home}/> \n    </Route>\n  </Router>,\n  destination\n);\n```\n\n\
    Inside our root `Route` element, we are defining another `Route` element of type\
    \ `IndexRoute` (more on who this is in a second!) and setting its view to be our\
    \ `Home` component. There is one more change we need to make. Inside our `App`\
    \ component, remove the call to the `Home` component and replace it with the following:\n\
    \n[Click here to view code image](#part0039.xhtml_p15pro01)\n\n```javascript\n\
    var App = React.createClass({\n  render: function() {\n    return (\n      <div>\n\
    \        <h1>Simple SPA</h1>\n        <ul className=\"header\">\n          <li>Home</li>\n\
    \          <li>Stuff</li>\n          <li>Contact</li>\n        </ul>\n       \
    \ <div className=\"content\">\n          {this.props.children}\n        </div>\n\
    \      </div>\n    )\n  }\n});\n```\n\nIf you preview your page now, you will\
    \ still see your Home content. The difference this time is that we are displaying\
    \ the Home content properly in a way that doesn’t prevent other content from being\
    \ displayed. This is because of things:\n1. What displayed inside `App` is controlled\
    \ by the result of `this.props.children` instead of a hard-coded component.\n\
    2. Our `Route` element inside `ReactDOM.render` contains an `IndexRoute` element\
    \ whose sole purpose for existing is to declare which component will be displayed\
    \ when app loads.\n\nAll of this may seem even more bizarre than you expected\
    \ a few ago, but things will make more sense as we use these APIs more in the\
    \ following sections.\n\n### Creating the Navigation Links\n\nRight now, we just\
    \ have our frame and home setup. There isn’t really else for a user to do here\
    \ outside of seeing what we have as the home page. Let’s fix that by creating\
    \ some navigation links. More specifically, let’s linkify the navigation elements\
    \ we already have:\n\n[Click here to view code image](#part0039.xhtml_p155pro02)\n\
    \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
    \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
    >\n          <li>Home</li>\n          <li>Stuff</li>\n          <li>Contact</li>\n\
    \        </ul>\n        <div className=\"content\">\n          {this.props.children}\n\
    \        </div>\n      </div>\n    )\n  }\n});\n```\n\nIf you aren’t sure why\
    \ these elements aren’t visible when you preview your page, that’s because they\
    \ blended in with the black background once we added the CSS in. No biggie there.\
    \ We’ll fix that in a few, but first let’s talk about how we are going to turn\
    \ these elements into links.\n\nThe way you specify navigation links in React\
    \ Router isn’t by *directly* using the tried and tested `a` tag and throwing in\
    \ a path via the `href` attribute. Instead, you specify your navigation link using\
    \ React Router’s `Link` components that are similar to `a` tags but offer a lot\
    \ more functionality. To see the `Link` component in action, go ahead and modify\
    \ our existing navigation elements to look like the following highlighted lines:\n\
    \n[Click here to view code image](#part0039.xhtml_p156pro01)\n\n```javascript\n\
    var App = React.createClass({\n  render: function() {\n    return (\n      <div>\n\
    \        <h1>Simple SPA</h1>\n        <ul className=\"header\">\n          <li><Link\
    \ to=\"/\">Home</Link></li>          \n          <li><Link to=\"/stuff\">Stuff</Link></li>\
    \    \n          <li><Link to=\"/contact\">Contact</Link></li> \n        </ul>\n\
    \        <div className=\"content\">\n          {this.props.children}\n      \
    \  </div>\n      </div>\n    )\n  }\n});\n```\n"
  raw: 'ul.header li a {


      color: #FFF;


      font-weight: bold;


      text-decoration: none;


      padding: 20px;


      display: inline-block;


    }


    .content {


      background-color: #FFF;


      padding: 20px;


    }


    .content h2 {


      padding: 0;


      margin: 0;


    }


    .content li {


      margin-bottom: 10px;


    }


    Yes, we are using CSS in its markup form. We aren’t doing the inline style object
    approach that we saw in [Chapter 4](#part0011.xhtml_ch04). The reason has to do
    with convenience. Our components aren’t going to be re-used outside of our particular
    app, and we really want to take advantage of CSS inheritance to minimize duplicated
    markup. Otherwise, if we didn’t use regular CSS, we’ll end up with a bunch of
    giant style objects defined for almost every element in our markup. That would
    make even the most patient among us annoyed when reading the code.


    Anyway, once you have added all of this CSS, our app will start to look much better
    (see [Figure 13-5](#part0020.xhtml_ch13fig05)).


    ![Image](Images/image00291.jpeg)


    Figure 13-5 CSS styling added.


    There is still some more work to be done (for example, our navigation links disappeared
    behind the black banner), but we’ll fix all of those up in a little bit.


    ##### Avoiding the ReactRouter Prefix


    We have just one more cleanup related task before we return to our regularly scheduled
    programming. Have you noticed that every single time we call something defined
    by the React Router API, we prefix that something with the word `ReactRouter`?


    [Click here to view code image](#part0039.xhtml_p153pro01)


    <ReactRouter.Router>


      <ReactRouter.Route path="/" component={App}>


      </ReactRouter.Route>


    </ReactRouter.Router>


    That is a bit verbose to have to repeat for every API call we make, and this is
    going to be more of a problem as we dive further into the React Router API and
    use more things from inside it.


    The fix for this involves using a new ES6 trick where you can manually specify
    which values will automatically get prefixed. Towards the top of your `script`
    tag, add the following:


    var { Router,


          Route,


          IndexRoute,


          IndexLink,


          Link } = ReactRouter;


    Once you’ve added this code, every time you use one of the values defined inside
    the brackets, the prefix **ReactRouter** will automatically be added for you when
    your app runs. This means, you can now go back to your `ReactDOM.render` method
    and remove the **ReactRouter** prefix from our `Router` and `Route` component
    instances:


    [Click here to view code image](#part0039.xhtml_p154pro01)


    ReactDOM.render(


      <Router>


        <Route path="/" component={App}>


        </Route>


      </Router>,


      destination


    );


    If you preview your app now, nothing really should change. The end result is identical
    to what you had before. The only difference is that our markup is a bit more compact.


    Now, before we move on, you are probably wondering why the list of values that
    will automatically be prefixed with **ReactRouter** contains a whole bunch of
    things beyond the **Router** and **Route** values that we have used in our code
    so far. Think of these additional values as a preview of the other parts of the
    React Router API we will be using shortly. Spoiler alert! (Probably too late to
    mention that now, eh?)


    #### Displaying the Home Page Correctly


    We ended a few sections ago by saying that the way we currently have our home
    page displayed is incorrect. Although you get the desired result when our page
    loads, this approach doesn’t really make it easy for us to load anything other
    than the home page when users navigate around. The call to our `Home` component
    is hard-coded inside `App`.


    The correct solution involves letting React Router handle which component to call
    depending on what your current URL structure is. This involves nesting `Route`
    components inside `Route` components to better define the URL-to-view mapping.
    Go back to our `ReactDOM.render` method, and make the following highlighted change:


    [Click here to view code image](#part0039.xhtml_p154pro02)


    ReactDOM.render(


      <Router>


        <Route path="/" component={App}>


          <IndexRoute component={Home}/> 


        </Route>


      </Router>,


      destination


    );


    Inside our root `Route` element, we are defining another `Route` element of type
    `IndexRoute` (more on who this is in a second!) and setting its view to be our
    `Home` component. There is one more change we need to make. Inside our `App` component,
    remove the call to the `Home` component and replace it with the following highlighted
    line:


    [Click here to view code image](#part0039.xhtml_p155pro01)


    var App = React.createClass({


      render: function() {


        return (


          <div>


            <h1>Simple SPA</h1>


            <ul className="header">


              <li>Home</li>


              <li>Stuff</li>


              <li>Contact</li>


            </ul>


            <div className="content">


              {this.props.children} 


            </div>


          </div>


        )


      }


    });


    If you preview your page now, you will still see your Home content displayed.
    The difference this time is that we are displaying the Home content properly in
    a way that doesn’t prevent other content from being displayed instead. This is
    because of two things:


    **1.** What gets displayed inside `App` is controlled by the result of `this.props.children`
    instead of a hard-coded component.


    **2.** Our `Route` element inside `ReactDOM.render` contains an `IndexRoute` element
    whose sole purpose for existing is to declare which component will be displayed
    when your app initially loads.


    All of this may seem even more bizarre than what you expected a few moments ago,
    but things will make more sense as we use these various APIs more in the following
    sections.


    #### Creating the Navigation Links


    Right now, we just have our frame and home view setup. There isn’t really anything
    else for a user to do here outside of just seeing what we have set as the home
    page. Let’s fix that by creating some navigation links. More specifically, let’s
    linkify the navigation elements we already have:


    [Click here to view code image](#part0039.xhtml_p155pro02)


    var App = React.createClass({


      render: function() {


        return (


          <div>


            <h1>Simple SPA</h1>


            <ul className="header">


              <li>Home</li>    


              <li>Stuff</li>   


              <li>Contact</li> 


            </ul>


            <div className="content">


              {this.props.children}


            </div>


          </div>


        )


      }


    });


    If you aren’t sure why these elements aren’t visible when you preview your page,
    that’s because they blended in with the black background once we added the CSS
    in. No biggie there. We’ll fix that in a few, but first let’s talk about how we
    are going to turn these elements into links.


    The way you specify navigation links in React Router isn’t by ***directly*** using
    the tried and tested `a` tag and throwing in a path via the `href` attribute.
    Instead, you specify your navigation link using React Router’s `Link` components
    that are similar to `a` tags but offer a lot more functionality. To see the `Link`
    component in action, go ahead and modify our existing navigation elements to look
    like the following highlighted lines:


    [Click here to view code image](#part0039.xhtml_p156pro01)


    var App = React.createClass({


      render: function() {


        return (


          <div>


            <h1>Simple SPA</h1>


            <ul className="header">


              <li><Link to="/">Home</Link></li>           


              <li><Link to="/stuff">Stuff</Link></li>     


              <li><Link to="/contact">Contact</Link></li> 


            </ul>


            <div className="content">


              {this.props.children}


            </div>


          </div>


        )


      }


    });'
