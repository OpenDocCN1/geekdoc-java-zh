    \ this nicety doesn’t gain you much.\n\n### Making the Background Color Customizable\n\
    \nThe last thing we are going to do before we wrap things up is take advantage\
    \ of how React works with styles. By having our styles defined in the same vicinity\
    \ as the JSX, we can make the various style values easily customizable by the\
    \ parent (aka the consumer of the component). Let’s see this in action.\n\nRight\
    \ now, all of our vowels have a yellow background. Wouldn’t it be cool if we could\
    \ specify the background color as part of each `Letter` declaration? To do this,\
