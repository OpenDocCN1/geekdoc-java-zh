    stuff depends on what type of native event our `SyntheticEvent` is wrapping. This
    means that a `SyntheticEvent` that wraps a `MouseEvent` will have access to mouse-specific
    properties such as the following:


    boolean altKey


    number button


    number buttons


    number clientX


    number clientY


    boolean ctrlKey


    boolean getModifierState(key)


    boolean metaKey


    number pageX


    number pageY


    DOMEventTarget relatedTarget


    number screenX


    number screenY


    boolean shiftKey


    Similarly, a `SyntheticEvent` that wraps a `KeyboardEvent` will have access to
    these additional keyboard-related properties:


    boolean altKey


    number charCode


    boolean ctrlKey


    boolean getModifierState(key)


    string key


    number keyCode


    string locale


    number location


    boolean metaKey


    boolean repeat


    boolean shiftKey


    number which


    In the end, all of this means that you still get the same functionality in the
    `SyntheticEvent` world that you had in the vanilla DOM world.


    Now, here is something I learned the hard way. *Don’t refer to traditional DOM
    event documentation when using Synthetic events and their properties.* Because
    the `SyntheticEvent` wraps your native DOM event, events and their properties
    may not map one-to-one. Some DOM events don’t even exist in React. To avoid running
    into any issues, if you want to know the name of a `SyntheticEvent` or any of
    its properties, *refer to the* **React Event System document(**[https://facebook.github.io/react/docs/events.html](https://facebook.github.io/react/docs/events.html))
    *instead*.


    #### Doing Stuff With Event Properties


    By now, you’ve probably seen more about the DOM and `SyntheticEvent` stuff than
    you’d probably like. To wash away the taste of all that text, let’s write some
    code and put all of this newfound knowledge to good use. Right now, our counter
    example increments by one each time you click on the plus button. What we want
    to do is *increment our counter by ten when the Shift key on the keyboard is pressed*
    while clicking the plus button with our mouse.


    The way we are going to do that is by using the `shiftKey` property that exists
    on the `SyntheticEvent` when using the mouse:


    boolean altKey


    number button


    number buttons


    number clientX


    number clientY


    boolean ctrlKey


    boolean getModifierState(key)


    boolean metaKey


    number pageX


    number pageY


    DOMEventTarget relatedTarget


    number screenX


    number screenY


    boolean shiftKey 


    The way this property works is simple. If the Shift key is pressed when this mouse
    event fires, then the `shiftKey` property value is **true**. Otherwise, the `shiftKey`
    property value is **false**. To increment our counter by 10 when the Shift key
    is pressed, go back to our `increase` function and make the following highlighted
    changes:


    [Click here to view code image](#part0036.xhtml_p115pro01)


    increase: function(e) {


      var currentCount = this.state.count; 


      if (e.shiftKey) {                    


        currentCount += 10;                


      } else {                             


        currentCount += 1;                 


      }                                    


      this.setState({


        count: currentCount                


      });


    },


    Once you’ve made the changes, preview our example in the browser. Each time you
    click on the plus button, your counter will increment by one just like it had
    always done. If you click on the plus button with your Shift key pressed, notice
    that our counter increments by 10 instead.


    The reason that all of this works is because we change our incrementing behavior
    depending on whether the Shift key is pressed or not. That is primarily handled
    by the following lines:


    if (e.shiftKey) {


      currentCount += 10;


    } else {


      currentCount += 1;


    }


    If the `shiftKey` property on our `SyntheticEvent` event argument is **true**,
    we increment our counter by 10\. If the `shiftKey` value is **false**, we just
    increment by 1.


    #### More Eventing Shenanigans


    We are not done yet! Up until this point, we’ve looked at how to work with events
    in React in a very simplistic way. In the real world, rarely will things be as
    direct as what we’ve seen. Your real apps will be more complex, and because React
    insists on doing things differently, we’ll need to learn (or re-learn) some new
    event-related tricks and techniques to make our apps work. That’s where this section
    comes in. We are going to look at some common situations you’ll run into and how
    to deal with them.


    ##### You Can’t Directly Listen to Events on Components


    Let’s say your component is nothing more than a button or another type of UI element
    that users will be interacting with. You can’t get away with doing something like
    what we see in the following highlighted line:


    [Click here to view code image](#part0036.xhtml_p116pro01)


    var CounterParent = React.createClass({


      getInitialState: function() {


        return {


          count: 0


        };


      },


      increase: function() {


        this.setState({


          count: this.state.count + 1


        });


      },


      render: function() {


        return (


          <div>


            <Counter display={this.state.count}/>


            <PlusButton onClick={this.increase}/> 


          </div>


        );


      }


    });


    On the surface, this line of JSX looks totally valid. When somebody clicks on
    our `PlusButton` component, the `increase` function will get called. In case you
    are curious, this is what our `PlusButton` component looks like:


    [Click here to view code image](#part0036.xhtml_p116pro02)


    var PlusButton = React.createClass({


      render: function() {


          return (


            <button>


              +


            </button>


          );


        }


    });


    Our `PlusButton` component doesn’t do anything crazy. It only returns a single
    HTML element!


    No matter how you slice and dice this, none of this matters. It doesn’t matter
    how simple or obvious the HTML we are returning via a component looks like. *You
    simply can’t listen for events on them directly*. The reason is because components
    are wrappers for DOM elements. What does it even mean to listen for an event on
    a component? Once your component gets unwrapped into DOM elements, does the outer
    HTML element act as the thing you are listening for the event on? Is it some other
    element? How do you distinguish between listening for an event and declaring a
    prop with a value?


    There is no clear answer to any of those questions. It’s too harsh to say that
    the solution is to simply not listen to events on components, either. Fortunately,
    there is a workaround where we treat the event handler as a prop and pass it on
    to the component. Inside the component, we can then assign the event to a DOM
    element and set the event handler to the the value of the prop we just passed
    in. I realize that probably makes no sense, so let’s walk through an example.


    Take a look at the following highlighted line:


    [Click here to view code image](#part0036.xhtml_p117pro01)


    var CounterParent = React.createClass({


        .


        .


        .


      render: function() {


        return (


          <div>


            <Counter display={this.state.count}/>


            <PlusButton clickHandler={this.increase}/> 


          </div>


        );


      }


    });


    In this example, we create a property called `clickHandler` whose value is the
    `increase` event handler. Inside our `PlusButton` component, we can then do something
    like this:


    [Click here to view code image](#part0036.xhtml_p117pro02)


    var PlusButton = React.createClass({


      render: function() {


          return (


            <button onClick={this.props.clickHandler}> 


              +


            </button>


          );


        }


    });


    On our `button` element, we specify the `onClick` event and set its value to the
    `clickHandler` prop. At runtime, this prop gets evaluated as our `increase` function,
    and clicking the plus button ensures the `increase` function gets called. This
    solves our problem while still allowing our component to participate in all this
    eventing goodness!


    #### Listening to Regular DOM Events'
