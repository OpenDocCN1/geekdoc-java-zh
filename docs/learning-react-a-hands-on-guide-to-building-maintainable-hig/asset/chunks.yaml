          "Batman"


        ), destination);


      </script>


    </body>


    </html>


    Notice that there is nary a trace of React-like code in sight. Also, we should
    use the word *nary* more often in everyday conversation!


    ### Conclusion


    If this is your first time building a React app, we covered a lot of ground here.
    One of the biggest takeaways is that React is different than other libraries because
    it uses a whole new language called JSX to define what the visuals will look like.
    We got a very small glimpse of that here when we defined the `h1` tag inside the
    `render` method.


    JSX’s impact goes beyond how you define your UI elements. It also alters how you
    build your app as a whole. Because your browser can’t understand JSX in its native
    representation, you need to use an intermediate step to convert that JSX into
    JavaScript. One approach is to build your app to generate the transpiled JavaScript
    output to correspond to the JSX source. Another approach (aka the one we used
    here) is to use the Babel library to translate the JSX into JavaScript on the
    browser itself. While the performance hit of doing that is not recommended for
    live/production apps, when familiarizing yourself with React, you can’t beat the
    convenience.


    In future chapters, we’ll spend some time diving deeper into JSX and going beyond
    the render method as we look at all the important things that make React tick.


    ## 3. Components in React


    Components are one of the things that make React, well, React! They are one of
    the primary ways you have for defining the visuals and interactions that make
    up what people see when they use your app. Let’s say [Figure 3-1](#part0010.xhtml_ch03fig01)
    shows what your finished app looks like.


    ![Image](Images/image00239.jpeg)


    Figure 3-1 Your hypothetical finished app.


    This is the finished sausage. During development, viewed from the lens of you
    as a React developer, things might look a little less appealing. Almost every
    part of this app’s visuals would be wrapped inside a self-contained module known
    as a **component**. To highlight what “almost every” means here, take a look at
    the diagram in [Figure 3-2](#part0010.xhtml_ch03fig02).


    ![Image](Images/image00240.jpeg)


    Figure 3-2 Diagrammatic representation of the app components.


    Each dotted line represents an individual component that is responsible for both
    what you see as well as any interactions that it may be responsible for. Don’t
    let this scare you. While this looks really complicated, as you will see shortly,
    it will start to make a whole lot of sense once you’ve had a chance to play with
    components and some of the awesome things that they do—or at least try really
    hard to do.


    Onwards!


    ### A Quick Review of Functions


    In JavaScript, you have these things known as **functions**. They enable you to
    make your code a bit cleaner and more reusable. Now, there is reason why we are
    taking some time to look at functions, and it isn’t to annoy you—I swear! Functions,
    conceptually speaking, share a lot of surface area with React components, and
    the easiest way to understand what components do is by taking a quick look at
    functions first.


    In a terrible world where functions do not exist, you may have some code that
    looks as follows:


    var speed = 10;


    var time = 5;


    alert(speed * time);


    var speed1 = 85;


    var time1 = 1.5;


    alert(speed1 * time1);


    var speed2 = 12;


    var time2 = 9;


    alert(speed2 * time2);


    var speed3 = 42;


    var time3 = 21;


    alert(speed3 * time3);


    In a really chill world that involves functions, you can condense all of that
    duplicated text into something simple like the following:


    [Click here to view code image](#part0029.xhtml_p025pro01)


    function getDistance(speed, time) {


        var result = speed * time;


        alert(result);


    }


    Our `getDistance` function removes all of the duplicated code you saw earlier,
    and it takes `speed` and `time` as arguments to enable you to customize the calculation
    that gets returned.


    To call this function, all you have to do is this:


    getDistance(10, 5);


    getDistance(85, 1.5);


    getDistance(12, 9);


    getDistance(42, 21);


    Doesn’t this look nicer? Now there is another great value functions provide. Your
    functions (like the `alert` inside `getDistance`) can call other functions as
    part of their running. Here is us using a `formatDistance` function to change
    what gets returned by `getDistance`:


    [Click here to view code image](#part0029.xhtml_p025pro02)


    1   function formatDistance(distance) {


    2     return distance + "km";


    3   }


    4


    5   function getDistance(speed, time) {


    6       var result = speed * time;


    7       alert(formatDistance(result));


    8   }


    This capability to have functions call other functions enables us to cleanly separate
    what functions do. You don’t need to have one monolithic function that does everything
    under the sun. You can distribute the functionality across many functions specialized
    for a particular type of task.'
