    \n### 总结\n\n我们的 Todo 应用在功能上非常简单，但通过从零构建，我们几乎涵盖了 React 提供的每一个细微细节。更重要的是，我们创建了一个示例，展示了我们单独学的概念是如何协作的。这实际上是重要的细节。现在，有一个关于你的快速问题：我们在这一章中所做的一切你理解吗？\n\
