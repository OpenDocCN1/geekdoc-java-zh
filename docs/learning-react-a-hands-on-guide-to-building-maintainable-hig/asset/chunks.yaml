    ### Why Component Composability Rocks


    When we are heads-down in React, we often tend to forgot that what we are ultimately
    creating is just plain and boring HTML, CSS, and JavaScript. The generated HTML
    for our color palette card looks as follows:


    [Click here to view code image](#part0031.xhtml_p066pro01)


    <div id="container">


      <div data-reactid=".0">


        <div style="height:200px;


                    width:150px;


                    padding:0;


                    background-color:#FFF;


                    -webkit-filter:drop-shadow(0px 0px 5px #666);


                    filter:drop-shadow(0px 0px 5px #666);">


          <div style="height:150px;


                      background-color:#FF6663;"></div>


          <p style="font-family:sans-serif;


                    font-weight:bold;


                    padding:13px;


                    margin:0;">#FF6663</p>


        </div>


      </div>


    </div>


    This markup has no idea of how it got there. It doesn’t know about which components
    were responsible for what. It doesn’t care about component composability or the
    frustrating way we had to transfer the `color` property from parent to child.
    That brings up an important point to make.


    If we had to generalize the end result of what components do, **all they do is
    return blobs of HTML to whatever called it**. Each component’s `render` function
    returns some HTML to another component’s `render` function. All of this HTML keeps
    accumulating until a giant blob of HTML is pushed (very efficiently) to our DOM.
    That simplicity is why component re-use and composability works so well. Each
    blob of HTML works independently from other blobs of HTML—especially if you specify
    inline styles as React recommends. This enables you to easily create visual elements
    from other visual elements without having to worry about anything. ANYTHING! Isn’t
    that pretty freaking awesome?


    ### Conclusion


    As you may have realized by now, we are slowly shifting focus towards the more
    advanced scenarios that React thrives in. Actually, advanced isn’t the right word.
    The correct word is ***realistic***. In this chapter, we started by learning how
    to look at a piece of UI and identify the components in a way that you can later
    implement. That is a situation you will find yourself in all the time. While the
    approach we employed seemed really formal, as you get more experienced with creating
    things in React, you can ratchet down the formality. If you can quickly identify
    the components and their parent/child relationships without creating a visual
    and component hierarchy, then that is one more sign that you are getting really
    good at working with React!


    Identifying the components is only one part of the equation. The other part is
    bringing those components to life. Most of the technical stuff we saw here was
    just a minor extension of what we’ve already seen earlier. We looked at one level
    of components in an earlier chapter, and here we looked at how to work with multiple
    levels of components. We looked at how to pass properties between one parent and
    one child in an earlier chapter, and here we looked at how to pass properties
    between multiple parents and multiple children. Maybe in a future chapter we’ll
    do something groundbreaking like drawing multiple color palette cards to the screen!
    Or, we can maybe specify two properties instead of just a single one. Who knows?


    ## 6. Transferring Properties (Props)


    There is a frustrating side to working with properties. We kinda saw this side
    in the previous chapter. Passing properties from one component to another is nice
    and simple when you are dealing with only one layer of components. When you wish
    to send a property across multiple layers of components, things start getting
    complicated.


    Things getting complicated is never a good thing, so in this chapter, let’s see
    what we can do to make working with properties across multiple layers of components
    easy.


    ### Problem Overview


    Let’s say that you have a deeply nested component, and its hierarchy (modeled
    as awesomely colored circles) looks like [Figure 6-1](#part0013.xhtml_ch06fig01).


    ![Image](Images/image00261.jpeg)


    Figure 6-1 The component hierarchy.'
