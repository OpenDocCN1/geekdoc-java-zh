  trans: "\n\n在现实世界中，你被要求在 React 中实现的东西不会像一个名称列表或五颜色的元音块那么简单。相反，你将得到某个复杂用户界面的视觉表示形式。这种视觉效果可以有许多形式——涂鸦、图表、截图、视频、标注稿（redline）、设计稿等。让这些静态像素活起来是你的工作，而我们将通过此进行一些实战练习。\n\
    \n我们要构建的是一个简单的调色卡片（参见图 5-2）。\n\n![Image](img/image00250.jpeg)\n\n图 5-2 一个简单的调色卡。\n\
    \n如果你不确定这些是什么，它们是小矩形卡片，可以帮助你将颜色与特定类型的漆进行匹配。你经常在家居建材店或任何卖漆的地方看到它们。你那个设计师的朋友在家里可能有一个巨大的衣柜专门存放它们。无论如何，我们的任务是使用\
    \ React 重现这些卡片之一。\n\n实现这一目标有多种方法，但我将向你展示一种非常系统的方法，它将帮助你简化并理解即使是最复杂的用户界面。这种方法涉及两个步骤：\n\
    \n1. 识别主要的视觉元素\n2. 确定组件将是什么\n\n这两个步骤听起来都非常复杂，但随着我们的学习，你会发现这没什么好担心的。\n\n### 识别主要的视觉元素\n\
    \n第一步是识别我们正在处理的所有视觉元素。没有任何视觉元素是微小到可以忽略的——至少最初不是。开始识别相关部分最简单的方法是从显而易见的视觉元素开始，然后深入研究不那么明显的元素。\n\
    \n我们在示例中看到的第一个东西是卡片本身（参见图 5.3）。\n\n![Image](img/image00251.jpeg)\n\n图 5-3 卡片。\n\
    \n在卡片内部，你会发现有两个不同的区域。顶部区域是一个显示特定颜色的矩形区域。底部是一个显示十六进制值（hex value）的白色区域。\n\n让我们把这两个视觉元素单独出来，并将它们排列成一个树形结构，如图图\
    \ 5-4 所示。\n\n![Image](img/image00252.jpeg)\n\n图 5-4 树形结构。\n\n将你的视觉元素排列成这种树形结构（又称为视觉层次结构）是更好地理解你的视觉元素如何分组的好方法。这个练习的目标是识别重要的视觉元素，并将它们分解为父/子结构，直到你无法进一步细分它们。\n\
    \n***\n\n### 尝试忽略实现细节\n\n虽然这很难，但先不要考虑实现细节。不要专注于根据将所需的 HTML 和 CSS 组合来拆分你的视觉元素。以后有的是时间做这些！\n\
    \n***\n\n继续下去，我们可以看到我们的彩色色矩形不是我们可以可以进一步细分的东西。但并不意味着我们已经结束了。我们可以将标签与围绕它的白色区域进一步分开。目前，我们的视觉层次结构看起来如图图\
    \ 5-5 所示，我们的标签和白色区域在树结构中占据了独立的位置。\n\n![Image](img/image00253.jpeg)\n\n图 5-5 将内容进一步细分为标签和围绕它的白色区域。\n\
    \n到此为止，我们没有其他可以进一步细分的内容。我们已经完成了视觉元素的识别和划分，因此下一步是利用我们在这里发现的内容来帮助我们识别组件。\n\n###\
    \ 识别组件\n\n这里开始变得有点有趣了。我们需要确定识别出的视觉元素中哪些将转换为组件，哪些将不会。并不是每个视觉元素都需要转换为组件，我们也绝对不想创建几个极其复杂的组件。这其中需要有一个平衡（参见图\
    \ 5-6）。\n\n![Image](img/image00254.jpeg)\n\n图 5-6 组件数量既不过少也不过多。\n\n确定哪些视觉元素成为组件的一部分，哪些不是，这是一门艺术。通用的规则是，我们的组件应该只做一件事。如果你发现你的潜在组件最终会做太多事情，你可能想将该组件拆分为多个组件。反之，如果你的潜在组件做的事情太少，你可能可能想完全跳过将该视觉元素变成组件。\n\
    \n让我们尝试确定示例中哪些元素可以构成良好的组件。从我们的视觉层次结构来看，一眼看上去，卡片和彩色矩形似乎都符合制作优秀组件的标准。卡片充当外部容器，而彩色矩形仅显示颜色。\n\
    \n但这给我们的标签和围绕它的白色区域打上了一个问号（参见图 5-7）。\n\n![Image](img/image00255.jpeg)\n\n图 5-7\
    \ 标签及其周围白色空间上的问号。\n\n这里的关键部分是标签本身。没有它，我们就看不到十六进制值。剩下的只有白色区域。它所起的作用微乎其微。它只是空间，其责任可以被忽略。到此，我们已经识别了组件，并且层次结构如图图\
    \ 5-8 所示。\n\n![Image](img/image00252.jpeg)\n\n图 5-8 组件。\n\n### 创建组件\n\n这是简单的部分——是时候开始了。我们需要一个大部分为空的页面：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>更多组件</title>\n  <script src=\"\
    https://unpkg.com/react@5.3.2/dist/react.js\"></script>\n  <script src=\"https://unpkg.com/react-dom@5.3.2/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/standalone.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n\
    \  <script type=\"text/babel\">\n    ReactDOM.render(\n      <<div></div>,\n \
    \     document.querySelector(\"#container\")\n    );\n  </script>\n</body>\n</html>\n\
    ```\n\n花点时间看看这个页面的情况。没什么——只是让 React 在我们的 `container` 元素中渲染一个 `div` 的基本要求。\n\n\
    完成之后，是时候定义我们的组件了。我们将我们的组件命名为 `Card`、`Label` 和 `Square`。请在 `ReactDOM.render` 函数之前添加以下代码行：\n\
    \n```javascript\nvar Square = React.createClass({\n  render: function() {\n  \
    \  return (\n      <p>Nothing</p>\n    );\n  }\n});\n```\n\n"
- fmt: "\n```javascript\nvar Label = React.createClass({\n  render: function() {\n\
    \    return (\n      <p>Nothing</p>\n    );\n  }\n});\n\nvar Card = React.createClass({\n\
    \  render: function() {\n    return (\n\n    );\n  }\n});\n\nReactDOM.render(\n\
    \  <div>\n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\nWithin\
    \ our three components, we also threw in the `render` function that each component\
    \ absolutely needs to function. Other than that, our components are empty. In\
    \ the following sections, we will fix that by filling them in.\n\n### The Card\
    \ Component\n\nWe are going to start at the top of our component hierarchy and\
    \ focus on our `Card` component first. This component will act as the the container\
    \ that our `Square` and `Label` components will live in.\n\nTo implement it, go\
    \ ahead and make the following highlighted modifications:\n\n[Click here to view\
    \ code image](#part0031.xhtml_p058pro01)\n\n```javascript\nvar Card = React.createClass({\n\
    \  render: function() {\n    var cardStyle = {\n      height: 200,\n      width:\
    \ 150,\n      padding: 0,\n      backgroundColor: \"#FFF\",\n      WebkitFilter:\
    \ \"drop-shadow(0px 0px #666)\",\n      filter: \"drop-shadow(0px 0px #666)\"\n\
    \    };\n\n    return (\n      <div style={cardStyle}>\n      </div>\n    );\n\
    \  }\n});\n```\n\nWhile this seems like a lot of changes, the bulk of the lines\
    \ are going into styling the output of our `Card` component via the `cardStyle`\
    \ object. Inside the object, notice that we specify a vendor-prefixed version\
    \ of the CSS `filter` property with `WebkitFilter`. That’s not the interesting\
    \ detail. The interesting detail is the capitalization. Instead of the first letter\
    \ being camelcased as `webkitFilter`, the `W` is actually capitalized. That isn’t\
    \ how normal CSS properties are represented, so keep that in mind if you ever\
    \ need to specify a vendor-prefixed property.\n\nThe rest of the changes are pretty\
    \ unimpressive. We return a `div` element, and that element’s `style` attribute\
    \ is set to our `cardStyle` object. Now, to see our `Card` component in action,\
    \ we need to display it in our DOM as part of the `ReactDOM.render` function.\
    \ To make that happen, go ahead and make the following highlighted change:\n\n\
    [Click here to view code image](#part0031.xhtml_p059pro01)\n\n```javascript\n\
    ReactDOM.render(\n  <div>\n    <Card/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\nAll we are doing is telling the `ReactDOM.render` function\
    \ to render the output of our `Card` component by invoking it. If everything worked\
    \ out properly, you’ll see the same thing as in [Figure 5-9](#part0012.xhtml_ch05fig09)\
    \ if you test your app.\n\n![Image](Images/image00257.jpeg)\n\nFigure 5-9 The\
    \ result of your test—the outline of the color palette card.\n\nYes, it is just\
    \ the outline of our color palette card, but that is definitely more than what\
    \ we started out just a few moments ago!\n\n### The Square Component\n\nIt’s time\
    \ to go one level down in our component hierarchy and look at our `Square` component.\
    \ This is a pretty straightforward one, so make the following highlighted changes:\n\
    \n[Click here to view code image](#part0031.xhtml_p060pro01)\n\n```javascript\n\
    var Square = React.createClass({\n  render: function() {\n    var squareStyle\
    \ = {\n      height: 150,\n      backgroundColor: \"#FF6663\"\n    };\n    return(\n\
    \      <div style={squareStyle}>\n      </div>\n    );\n  }\n});\n```\n\nJust\
    \ like with `Card` component, we are returning a `div` element whose `style` attribute\
    \ is set to a `style` object that defines this component looks. To see our `Square`\
    \ component in action, we need to get it onto our DOM like we did with the `Card`\
    \ component. The difference this time is that we won’t be calling the `Square`\
    \ component via our `ReactDOM.render` function. Instead, we’ll call the `Square`\
    \ component from inside the `Card` component. To see what I mean, go back to our\
    \ `Card` component’s render function, and make the following change:\n\n[Click\
    \ here to view code image](#part0031.xhtml_p060pro2)\n\n```javascript\nCard =\
    \ React.createClass({\n  render: function() {\n    var cardStyle = {\n      height:\
    \ 200,\n      width: 150,\n      padding: 0,\n      backgroundColor: \"#FFF\"\
    ,\n      WebkitFilter: \"drop-shadow(0px 0px #666)\",\n      filter: \"drop-shadow(0px\
    \ 0px #666)\"\n    };\n    return (\n      <div style={cardStyle}>\n        <Square/>\n\
    \      </div>\n    );\n  }\n});\n```\n\nAt this point, if you preview our app,\
    \ you’ll see a colorful square making an appearance (see [Figure 5-10](#part0012.xhtml_ch05fig10)).\n\
    \n![Image](Images/image00258.jpeg)\n\nFigure 5-10 The red portion appears.\n\n\
    The cool thing to call out is that we called our `Square` component from inside\
    \ the `Card` component! This is an example of **composability** where one component\
    \ relies on output of another component. The final thing you see is the result\
    \ of these two components colluding with each other. Isn’t collusion just beautiful—at\
    \ least in this context?\n\n### The Label Component\n\nThe last component that\
    \ remains is `Label`. Go ahead and make the following changes:\n\n[Click here\
    \ to view code image](#part0031.xhtml_p061pro01)\n\n```javascript\nvar Label =\
    \ React.createClass({\n  render: function() {\n    var labelStyle = {\n      fontFamily:\
    \ \"sans-serif\",\n      fontWeight: \"bold\",\n      padding: 13,\n      margin:\
    \ 0\n    };\n\n    return (\n      <p style={labelStyle}>#FF6663</p>\n    );\n\
    \  }\n});\n```\n\nThe pattern of what we are doing should be routine to you by\
    \ now. We have a `style` object that we assign to what we return. What we return\
    \ is a `p` element whose content is the string #FF663. To have what we return\
    \ ultimately to our DOM, we need to call our `Label` component via our `Card`\
    \ component. Go ahead and make the following highlighted change:\n\n[Click here\
    \ to view code image](#part0031.xhtml_p062pro01)\n\n```javascript\nCard = React.createClass({\n\
    \  render: function() {\n    var cardStyle = {\n      height: 200,\n      width:\
    \ 150,\n      padding: 0,\n      backgroundColor: \"#FFF\",\n      WebkitFilter:\
    \ \"drop-shadow(0px 0px #666)\",\n      filter: \"drop-shadow(0px 0px #666)\"\n\
    \    };\n    return (\n      <div style={cardStyle}>\n        <Square/>\n    \
    \    <Label/>\n      </div>\n    );\n  }\n});\n```\n"
