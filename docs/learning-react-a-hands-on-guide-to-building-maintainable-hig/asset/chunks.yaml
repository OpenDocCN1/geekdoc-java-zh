  raw: 'A few sections ago, I mentioned that our components (in JSX) are very similar
    to regular HTML elements. We saw that for ourselves when we wrapped a component
    inside a `div` element or specified an attribute and value as part of specifying
    properties. There is one more thing you can do with components just like you can
    with many HTML elements. *Your components can have children*.


    What this means is that you can do something like this:


    <CleverComponent foo="bar">


      <p>Something!</p>


    </CleverComponent>


    You have a component very cleverly called `CleverComponent`, and it has a `p`
    element as a child. From within `CleverComponent`, you have the capability to
    access the `p` child element (and any children it may have) via the `children`
    property accessed by `this.props.children`.


    To make sense of all this, let’s fiddle with another really simple example. This
    time around, we have a component called `Buttonify` that wraps its children inside
    a button. The component looks like this:


    [Click here to view code image](#part0029.xhtml_p035pro01)


    var Buttonify = React.createClass({


      render: function() {


        return (


          <div>


            <button type={this.props.behavior}>{this.props.children}</button>


          </div>


        );


      }


    });


    The way you can use this component is by just calling it via the `ReactDOM.render`
    method as shown here:


    [Click here to view code image](#part0029.xhtml_p035pro02)


    ReactDOM.render(


      <div>


        <Buttonify behavior="Submit">SEND DATA</Buttonify>


      </div>,


      document.querySelector("#container")


    );


    When this code runs, given what the JSX in the `Buttonify` component’s render
    method looked like, what you will see are the words “**SEND DATA**” wrapped inside
    a button element. With the appropriate styling, the result could look comically
    large like in [Figure 3-4](#part0010.xhtml_ch03fig04).


    ![Image](Images/image00243.jpeg)


    Figure 3-4 A large send data button.


    Anyway, getting back to the JSX, notice that we specify a custom property called
    `behavior`. This property enables us to specify the `button` element’s `type`
    attribute, and you can see us accessing it via `this.props.behavior` in the component
    definition’s `render` method.


    There is more to accessing a component’s children than what we’ve seen here. For
    example, if your child element is the root of a deeply nested structure, the `this.props.children`
    property will return an array. If your child element is just a single element
    (like in our example), the `this.props.children` property returns a single component
    NOT wrapped inside an array. There are a few more things to call out, but instead
    of enumerating all the various cases and boring you, we’ll naturally touch upon
    those cases as part of looking at more elaborate examples later on.


    ### Conclusion


    If you want to build an app using React, you can’t wander too far without having
    to use a component. Trying to build a React app without using a component is kinda
    like building a JavaScript-based app without using functions. I am not saying
    that it can’t be done. It is just one of those things you don’t do...kinda like
    the *Bad Idea* part of the popular Animaniacs Good Idea / Bad Idea sketches you
    can find here: [https://www.youtube.com/watch?v=2dJOIf4mdus](https://www.youtube.com/watch?v=2dJOIf4mdus):


    If this witty video doesn’t convince you why you should learn to embrace components,
    I don’t know what will...except for maybe a future chapter on creating complex
    components! :P


    ## 4. Styling in React


    For generations, mankind (and probably really smart dolphins) have styled their
    HTML content using CSS (aka Cascading Style Sheets). Things were good. With CSS,
    you had a good separation between the content and the presentation. The selector
    syntax gave you a lot of flexibility in choosing which elements to style and which
    ones to skip. You couldn’t even find too many issues to hate about the *whole
    cascading thing* that CSS is all about.


    Well, don’t tell React that. While React doesn’t actively hate CSS, it has a different
    view when it comes to styling content. As we’ve seen so far, one of React’s core
    ideas is to have our app’s visual pieces be self-contained and reusable. That
    is why the HTML elements and the JavaScript that impacts them are in the same
    bucket we call a component. We got a taste of that in the previous chapter.


    What about how the HTML elements look (aka their styling)? Where should that go?
    You can probably guess where I am going with this. You can’t have a self-contained
    piece of UI when the styling for it is defined somewhere else. That’s why React
    encourages you to specify how your elements look right along side the HTML and
    the JavaScript. In this tutorial, you learn all about this mysterious (and possibly
    scandalous!) approach to styling your content. Of course, we also look at how
    to use CSS as well. There is room for both approaches—even if React may sorta
    kinda not think so :P


    Onwards!


    ### Displaying Some Vowels


    To learn how to style our React content, let’s work together on a (totally sweet
    and exciting!) example that simply displays vowels on a page. First, you’ll need
    a blank HTML page that will host our React content. If you don’t have one, feel
    free to use the following markup:


    [Click here to view code image](#part0030.xhtml_p037pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>Styling in React</title>


      <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


      <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


      <style>


        #container {


          padding: 50px;


          background-color: #FFF;


        }


      </style>


    </head>


    <body>


      <div id="container"></div>


    </body>


    </html>


    All this markup does is load in our React and Babel libraries and specify a `div`
    with an `id` value of **container**. To display the vowels, we’re going to add
    some React-specific code.


    Just below the **container** `div` element, add the following:


    [Click here to view code image](#part0030.xhtml_p038pro01)


    <script type="text/babel">


      var Letter = React.createClass({


        render: function() {


            return (


              <div>


                {this.props.children}


              </div>


            );


          }


      });


      var destination = document.querySelector("#container");


      ReactDOM.render(


        <div>


          <Letter>A</Letter>


          <Letter>E</Letter>


          <Letter>I</Letter>


          <Letter>O</Letter>


          <Letter>U</Letter>


        </div>,


        destination


      );


    </script>


    From what we learned about components, nothing here should be a mystery. We create
    a component called `Letter` that is responsible for wrapping our vowels inside
    a `div` element. All of this is anchored in our HTML via a `script` tag whose
    type designates it as something Babel will know what to do with.


    If you preview your page, you’ll see something boring that looks like [Figure
    4-1](#part0011.xhtml_ch04fig01).


    ![Image](Images/image00244.jpeg)


    Figure 4-1 A boring output of what you see.


    Don’t worry, we’ll make it look a little less boring in a few moments. After we’ve
    had a run at these letters, you will see something that looks more like [Figure
    4-2](#part0011.xhtml_ch04fig02).


    ![Image](Images/image00245.jpeg)


    Figure 4-2 The letters arranged horizontally and with a yellow background.


    Our vowels will be wrapped in a yellow background, aligned horizontally, and sport
    a fancy monospace font. Let’s look at how to do all of this in both CSS as well
    as React’s new-fangled approach.


    ### Styling React Content Using CSS


    Using CSS to style our React content is actually as straightforward as you can
    imagine it to be. Because React ends up spitting out regular HTML tags, all of
    the various CSS tricks you’ve learned over the years to style HTML still apply.
    There are just a few minor things to keep in mind.


    #### Understand the Generated HTML'
