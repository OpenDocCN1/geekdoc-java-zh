    enter task\">\n          </input>\n          <button type=\"submit\">add</button>\n\
    \        </form>\n      </div>\n      <TodoItems entries={this.state.items}/>\
    \ \n    </div>\n  );\n}\n```\n\n我们在这里所做的只是实例化我们的 `TodoItems` 组件，并将我们的 `items`\
    \ 状态属性传递给名为 `entries` 的 `prop`。此时，如果你在浏览器中运行我们的应用，什么可见的变化都不会发生。我们的 `TodoItems`\
