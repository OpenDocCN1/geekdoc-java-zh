    \ to writing our UIs. For various technical and non-technical reasons, we’ve always\
    \ tolerated a certain level of sloppiness with how we typically work with our\
    \ UI elements.\n\nI realize that is a pretty controversial statement, so let me\
    \ highlight what I mean by looking at some examples. We are going to go back and\
    \ look at the `render` method we used in the previous chapter:\n\n[Click here\
    \ to view code image](#part0029.xhtml_p026pro01)\n\n```javascript\nvar destination\
    \ = document.querySelector(\"#container\");\n\nReactDOM.render(\n  <h1>Batman</h1>,\n\
    \  destination\n);\n```\n\nWhat you see on the screen is the word Batman printed\
    \ in giant letters—thanks to the `h1` element. Let’s change things up a bit and\
    \ say that we want to print the the names of several other superheroes. To do\
    \ this, let’s modify our `render` method to now look as follows:\n\n[Click here\
    \ to view code image](#part0029.xhtml_p026pro02)\n\n```javascript\nvar destination\
    \ = document.querySelector(\"#container\");\n\nReactDOM.render(\n  <div>\n   \
    \ <h1>Batman</h1>\n    <h1>Iron Man</h1>\n    <h1>Nicolas Cage</h1>\n    <h1>Mega\
    \ Man</h1>\n  </div>,\n  destination\n);\n```\n\nNotice what you see here. We\
    \ emit a `div` that contains the four `h1` elements with our superhero names.\n\
    \n***\n\n### JSX Gotcha: Outputting Multiple Elements\n\nThere is an important\
    \ JSX detail to call out here. The `div` that wraps our `h1` elements isn’t there\
