    \n第一种解决方案起初虽然有些复杂且耗时，但它是如今现代 Web 开发的方式。除了将你的 JSX 编译（准确地说是转译）为 `JS` 之外，这种方法还让你能够利用模块、更强大的构建工具以及许多让构建复杂的\
    \ Web 应用程序变得具有可操作性的特性。\n\n第二种解决方案提供了一种快速且直接的路径，你起初花费更多时间在编写代码上，而花更少的时间去折腾开发环境。要使用这种解决方案，你只需要引用一个脚本文件。该脚本文件会在页面加载时将\
