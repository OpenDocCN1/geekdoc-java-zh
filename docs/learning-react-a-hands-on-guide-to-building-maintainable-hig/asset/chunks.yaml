    \n```javascript\nReactDOM.render(\n  <Letter>B</Letter>\n  <Letter>E</Letter>\n\
    \  <Letter>I</Letter>\n  <Letter>O</Letter>\n  <Letter>U</Letter>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n如果你想做类似这样的操作，你需要先将你所有的元素封装在一个单个父元素中：\n\n点击此处查看代码图片\n\
    \n```javascript\nReactDOM.render(\n  <div>\n    <Letter>A</Letter>\n    <Letter>E</Letter>\n\
    \    <Letter>I</Letter>\n    <Letter>O</Letter>\n    <Letter>U</Letter>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\n当我们之前看到它时，这似乎是一个奇怪的要求，但你可以把这种做法的原因归咎于\
    \ `createElement`。通过 `render` 和 `return` 函数，你最终返回的是单个 `createElement` 调用（反过来，它可能包含许多嵌套的\
    \ `createElement` 调用）。这是我们早期的 JSX 转换为 JavaScript 后的样子：\n\n点击此处查看代码图片\n\n```javascript\n\
    ReactDOM.render(React.createElement(\n  \"div\",\n  null,\n  React.createElement(\n\
    \    Letter,\n    null,\n    \"A\"\n  ),\n  React.createElement(\n    Letter,\n\
    \    null,\n    \"E\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n\
    \    \"I\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n    \"O\"\n\
    \  ),\n  React.createElement(\n    Letter,\n    null,\n    \"U\"\n  )\n), document.querySelector(\"\
    #container\"));\n```\n\n拥有多个根元素会破坏函数返回值的方式以及 `createElement` 的工作原理，这就是为什么你只能指定一个返回（根）元素！知道了这一点，你可以睡得更香了。\n\
    \n### 你不能指定内联 CSS\n\n正如我们在第 4 章 中看到的，JSX 中的 `style` 属性的行为与 HTML 中的 `style` 属性不同。在\
    \ HTML 中，你可以将 CSS 属性作为值指定给 `style` 属性：\n\n点击此处查看代码图片\n\n```html\n<div style=\"\
    font-family:Arial;font-size:24px\">\n  <p>Blah!</p>\n</div>\n```\n\n在 JSX 中，`style`\
    \ 属性内部不能包含 CSS。相反，它需要引用一个包含样式的对象：\n\n点击此处查看代码图片\n\n```javascript\nvar Letter =\
    \ React.createClass({\n  render: function() {\n    var letterStyle = {\n     \
    \ padding: 10,\n      margin: 10,\n      backgroundColor: this.props.bgcolor,\n\
    \      color: \"#333\",\n      display: \"inline-block\",\n      fontFamily: \"\
    monospace\",\n      fontSize: \"32\",\n      textAlign: \"center\"\n    };\n \
    \   return (\n      <div style={letterStyle}>\n        {this.props.children}\n\
    \      </div>\n    );\n  }\n});\n```\n\n注意，我们有一个名为 `letterStyle` 的对象，它包含了所有的 CSS\
    \ 属性（驼峰命名形式）和它们的值。那个对象就是我们随后使用的。\n\n### 保留关键字\n\n正如我们所做的，在使用 JSX 时，你可能注意到我们遇到了一些关于你能做和不能做的一些任意规则和例外。JavaScript\
    \ 有一堆不能作为标识符使用的关键字，正如这些图片所示：\n\n![Image](img/image26)\n\n当你编写 JSX 时，你应该小心使用像 `class`\
    \ 这样常用的关键字，尽管它们在 HTML 中常见。查看以下：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
    \  <div class=\"slideIn\">\n    <p class=\"emphasis\">Gabagool!</p>\n    <Label/>\n\
    \  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n由于 JavaScript\
    \ 对 `class` 的保留，这种做法不可行的。你需要做的是使用 `className` 这种 属性：\n\n点击此处查看代码图片\n\n```javascript\n\
    ReactDOM.render(\n  <div className=\"slideIn\">\n    <p className=\"emphasis\"\
    >Gabagool!</p>\n    <Label/>\n  </div>,\n  document.querySelector(\"#container\"\
    )\n);\n```\n\n你可以在下文中查看完整的支持列表([`facebook.github.com/react/tags-attributes.html`](https://facebook.github.com/react/tags-attributes.html))，并注意所有的属性都是驼峰命名的。使用小写版本的属性是不可行的。如果你正在粘贴一大段想要\
    \ JSX 处理的 HTML，请确保回到你的 HTML 并进行这些微调。\n\n关于 JSX 和 HTML 之间关系的清晰答案来自 React 团队成员 Ben\
    \ Alpert，他在一个 Quora 回答 ([`qr.ae/RUKON`](http://qr.ae/RUKON)) 中提到：\n\n……我们的想法是\
    \ JSX 的主要优势是闭合标签的对称性，这使得代码更容易读，而不是因为它与 HTML 或 XML 的直接相似。直接复制粘贴 HTML 是很方便，但其他细微差异（例如自闭标签）使得这成为一场注定失败的战斗，而且我们\
    \ HTML 到 JSX 转换器来帮助你。最后，要把 HTML 转换为地道的 React 代码，通常需要大量工作将标记拆分为合理的组件，因此将 `class`\
    \ 改为 `className` 只是其中的很小一部分。\n\n### 注释\n\n就像注释 HTML、CSS 和 JavaScript 是好习惯一样，在\
    \ JSX 中提供注释也是好习惯。在 JSX 中指定注释与你在 JavaScript 中注释的方式非常相似([`www.kirupa.com/html5/comments.htm`](https://www.kirupa.com/html5/comments.htm))……除了一个例外。如果你将注释作为标签的子元素，你需要用\
    \ `{` 和 `}` 大括号包裹你的注释，以确保它被解析为表达式：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
    \  <div class=\"slideIn\">\n    <p class=\"emphasis\">Gabagool!</p>\n    {/* I\
    \ am a child comment */} \n    <Label/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n"
- fmt: "\nOur comment in this case is a child of our `div` element. If you specify\
    \ a comment wholly inside a tag, you can just specify your single-or multi-line\
    \ comment without having to use the `{` and `}` angle brackets:\n\n[Click here\
    \ to view code image](#part0033.xhtml_p087pro02)\n\n```javascript\nReactDOM.render(\n\
    \  <div class=\"slideIn\">\n    <p class=\"emphasis\">Gabagool!</p>\n    <Label\n\
    \      /* This comment\n          goes across\n          multiple lines */\n \
    \     className=\"colorCard\" // end of line\n    />\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\nIn this snippet, you can see an example of what both\
    \ multi-line comments and a comment at the end of a line look like. Now that you\
    \ know all of this, you have one less excuse to not comment your JSX :P\n\n###\
    \ Capitalization, HTML Elements, and Components\n\nCapitalization is important.\
    \ To represent HTML elements, ensure the HTML tag is lower-case:\n\n[Click here\
    \ to view code image](#part0033.xhtml_p087pro03)\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    <section>\n      <p>Something goes here!</p>\n    </section>\n \
    \ </div>,\n  document.querySelector(\"#container\")\n);\n```\n\nWhen wishing to\
    \ represent components, the component name must be capitalized, both in JSX as\
    \ well as when you define them:\n\n[Click here to view code image](#part0033.xhtml_p087pro04)\n\
    \n```javascript\nReactDOM.render(\n  <div>\n    <MyCustomComponent/>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\nIf you get the capitalization\
    \ wrong, `React` will not render your content properly. The component will not\
    \ be found. Trying to identify capitalization issues is probably the last thing\
    \ you’ll think about when things aren’t working, so keep this little tip in mind.\n\
    \n### Your JSX Can Be Anywhere\n\nIn many situations, your JSX will not be neatly\
    \ arranged inside a `render` or `return` function like in the examples we’ve seen\
    \ so far. Take a look at the following example:\n\n[Click here to view code image](#part0033.xhtml_p088pro01)\n\
    \n```javascript\nvar swatchComponent = <Swatch color=\"#2F004F\"></Swatch>;\n\n\
    ReactDOM.render(\n  <div>\n    {swatchComponent}\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\nWe have a variable called `swatchComponent` that is\
    \ initialized to a line of JSX. When our `swatchComponent` variable is placed\
    \ inside the render function, our `Swatch` component gets initialized. All of\
    \ this is totally valid, and we will do more such things in the future when we\
    \ learn how to generate and manipulate JSX using `JavaScript`.\n\n### Conclusion\n\
    \nWith this chapter, we’ve finally pieced together in one location the various\
    \ bits of JSX information that the previous chapters introduced. The most important\
    \ thing to remember is that `JSX is not HTML`. It looks like HTML and behaves\
    \ like it in many common scenarios, but it is ultimately designed to be translated\
    \ into JavaScript. This means you can do things that you could never imagine doing\
    \ using just plain HTML. Being able to evaluate expressions or programmatically\
    \ manipulate entire chunks of JSX is just the beginning. In upcoming chapters,\
    \ we’ll explore this intersection of JavaScript and JSX further.\n\n## 8. Dealing\
    \ with State\n\nUp until this point, the components we’ve created have been stateless.\
    \ They have properties (aka props) that are passed in from their parent, but nothing\
    \ (usually) changes about them once the components come alive. Your properties\
    \ are considered immutable once they have been set. For many interactive scenarios,\
    \ you don’t want that. You want to be able to change aspects of your components\
    \ as a result of some user interaction (or some data getting returned from a server\
    \ or a billion other things!)\n\nWhat we need is another way to store data on\
    \ a component that goes beyond properties. We need a way to store data that can\
    \ be changed. What we need is something known as `state`! In this chapter you\
    \ learn all about it and how you can use it to create stateful components.\n\n\
    ### Using State\n\nIf you know how to work with properties, you totally know how\
    \ to work with states... sort of. There are some differences, but they are too\
    \ subtle to bore you with right now. Instead, let’s just jump right in and see\
    \ states in action by using them in a small example.\n\nWhat we are going to is\
    \ create a simple lightning counter example as shown in [Figure 8-1](#part0015.xhtml_ch08fig01).\n\
    \n![Image](Images/image00269.jpeg)\n\nFigure 8-1 The app you will be building.\n\
    \nWhat this example does is nothing crazy. Lightning strikes the earth’s surface\
    \ about 100 times a second ([http://environment.nationalgeographic.com/environment/natural-disasters/lightning-profile](http://environment.nationalgeographic.com/environment/natural-disasters/lightning-profile)).\
    \ We have a counter that simply increments a number you see by that amount. Let’s\
    \ create it.\n\n#### Our Starting Point\n\nThe primary focus of this example is\
    \ to see we can work with state. There is no point in us spending a bunch of time\
    \ creating the example from scratch and retracing paths we’ve walked many times.\
    \ That’s not the best use of anybody’s time.\n\nInstead of starting from scratch,\
    \ modify an existing HTML document or create a new one with the following:\n\n\
    [Click here to view code image](#part0034.xhtml_p090pro1)\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>More State!</title>\n  <script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"\
    ></script>\n  <script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/babel.min.js\"\
    ></script>\n</head>\n<body>\n  <div id=\"container\"></div>\n  <script type=\"\
    text/babel\">\n    var LightningCounter = React.createClass({\n      render: function()\
    \ {\n        return (\n          <h1>Hello!</h1>\n        );\n      }\n    });\n\
    \    var LightningCounterDisplay = React.createClass({\n      render: function()\
    \ {\n        var divStyle = {\n          width: 250,\n          textAlign: \"\
    center\",\n          backgroundColor: \"black\",\n          padding: 40,\n   \
    \       fontFamily: \"sans-serif\",\n          color: \"#999\",\n          borderRadius:\
    \ 10\n        };\n        return(\n          <div style={divStyle}>\n        \
    \    <LightningCounter/>\n          </div>\n        );\n      }\n    });\n   \
    \ ReactDOM.render(\n      <LightningCounterDisplay/>,\n      document.querySelector(\"\
    #container\")\n    );\n  </script>\n</body>\n</html>\n```\n\nAt this point, take\
    \ a few moments to look at what our existing code does. First, we have a component\
    \ called `LightningCounterDisplay`:\n\n[Click here to view code image](#part0034.xhtml_p091pro01)\n\
    \n```javascript\nvar LightningCounterDisplay = React.createClass({\n  render:\
    \ function() {\n    var divStyle = {\n      width: 250,\n      textAlign: \"center\"\
    ,\n      backgroundColor: \"black\",\n      padding: 40,\n      fontFamily: \"\
    sans-serif\",\n      color: \"#999\",\n      borderRadius: 10\n    };\n    return(\n\
    \      <div style={divStyle}>\n        <LightningCounter/>\n      </div>\n   \
    \ );\n  }\n});\n```\n\nThe bulk of this component is the `divStyle` object that\
    \ contains the styling information responsible for the cool rounded background.\
    \ The `render` function returns a `div` element that wraps the `LightningCounter`\
    \ component.\n\nThe `LightningCounter` component is where all the action is going\
    \ to be taking:\n\n[Click here to view code image](#part0034.xhtml_p092pro01)\n\
    \n```javascript\nvar LightningCounter = React.createClass({\n  render: function()\
    \ {\n    return (\n      <h1>Hello!</h1>\n    );\n  }\n});\n```\n\nThis component,\
    \ as it is right now, has nothing interesting going for it. It just returns the\
    \ word **Hello!** That’s OK—we’ll fix this component later.\n\nThe last thing\
    \ to look at is our `ReactDOM.render` method:\n\n[Click here to view code image](#part0034.xhtml_p092pro02)\n\
    \n```javascript\nReactDOM.render(\n  <LightningCounterDisplay/>,\n  document.querySelector(\"\
    #container\")\n);\n```\n"
