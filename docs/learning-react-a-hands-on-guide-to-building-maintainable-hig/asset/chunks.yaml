  trans: "\n\n注意我们在这里所做的。我们的 `Link` 组件指定了一个名为 `to` 的属性。该属性指定了我们将在地址栏中显示的 URL 值。间接地说，它也指定了我们告诉\
    \ `Router` 我们正虚拟导航到的位置。我们的 `Home` 链接将用户带到根目录（`/`），`Stuff` 链接将用户带到名为 `stuff` 的位置，而\
    \ `Contact` 链接将用户带到名为 `contact` 的位置。\n\n如果你预览页面并点击链接（由于它们的 CSS 已经生效，它们现在是可见的），你不会看到任何新内容显示。你只会看到\
    \ `Home` 内容，因为那是我们之前唯一指定了的内容。尽管如此，你可以看到地址栏中的 URL 正在更新。根据你点击了哪个链接，你将看到当前页面后面跟着\
    \ `#/contact`、`#/stuff` 或 `#/`。哦，你还会看到 URL 后面添加了一个随机的哈希值（hash）。这是进展！\n\n### 添加\
    \ Stuff 和 Contact 视图\n\n我们的应用程序正在缓慢形成最终形状……到我们完成这一节时，它将非常接近完工！我们接下来要做的是为之前链接的\
    \ `Stuff` 和 `Contact` 视图定义组件。在你的代码中，就在你 `Home` 组件下方，添加以下内容：\n\n点击此处查看代码图片\n\n\
    ```javascript\nvar Contact = React.createClass({\n  render: function() {\n   \
    \ return (\n      <div>\n        <h2>有问题吗？</h2>\n        <p>最简单的方法是在\n       \
    \ 我们的 <a href=\"http://forum.kirupa.com\">论坛</a>上发帖。\n        </p>\n      </div>\n\
    \    );\n  }\n});\n\nvar Stuff = React.createClass({\n  render: function() {\n\
    \    return (\n      <div>\n        <h2>STUFF</h2>\n        <p>Mauris sem velit,\
    \ vehicula eget sodales vitae,\n        rhoncus eget sapien:</p>\n        <ol>\n\
    \          <li>Nulla pulvinar diam</li>\n          <li>Facilisis bibendum</li>\n\
    \          <li>Vestibulum vulputate</li>\n          <li>Eget erat</li>\n     \
    \     <li>Id porttitor</li>\n        </ol>\n      </div>\n    );\n  }\n});\n```\n\
    \n我们刚刚添加的是简单渲染 HTML 的 `Stuff` 和 `Contact` 组件。剩下的工作是更新我们的路由配置以包含这两个组件，并在相应的 URL\
    \ 下显示它们。\n\n在我们的 `ReactDOM.render` 方法中，添加以下两行高亮代码：\n\n点击此处查看代码图片\n\n```javascript\n\
    ReactDOM.render(\n  <Router>\n    <Route path=\"/\" component={App}>\n      <IndexRoute\
    \ component={Home}/>\n      <Route path=\"stuff\" component={Stuff} />     \n\
    \      <Route path=\"contact\" component={Contact} /> \n    </Route>\n  </Router>,\n\
    \  destination\n);\n```\n\n我们在这里所做的只是更新路由逻辑：如果 URL 包含 `stuff` 单词，则显示 `Stuff` 组件；如果\
    \ URL 包含 `contact` 单词，则显示 `Contact` 组件。现在预览你的页面，点击 `Stuff` 和 `Contact` 链接。如果一切运行正常，当你导航到这些视图时，你会看到这些视图加载在我们的框架中。\n\
    \n### 注意：关于路由匹配的简单介绍\n\n我们的路由配置无非是一系列规则，用于决定当 URL 匹配我们设定的条件时该做什么。这种做法的术语叫做路由匹配（route\
    \ matching）。`Router` 用于匹配 URL 的启发式算法在 `Router` 文档中有完全的解释，但对于我们的情况，我们有一个简单的嵌套路由，你可以有多个同时匹配的项目。如果\
    \ URL 包含 `/`，我们的外部路由就会匹配。如果如果 URL 恰好包含 `stuff` 或 `contact`，我们的内部路由就会匹配。\n\n这意味着非常简单。对于每个匹配的路由，你指定的组件将会出现。当你导航到像\
    \ `/stuff` 这样的页面时，`App` 组件会显示，因为 URL 中存在 `/`。然后 `Stuff` 组件也会显示，因为 URL 中也存在 `stuff`\
    \ 的路径。这就是为什么当我们导航到 `Stuff` 或 `Contact` 页面时，除了框架之外还能看到它们。你也可以拥有深层嵌套路由。\n\n查看以下内容：\n\
    \n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <Router>\n    <Route path=\"\
    /\" component={App}>\n      <IndexRoute component={Home} />\n      <Route path=\"\
    stuff\" component={Stuff}>\n        <Route path=\"blah\" component={MyBlah}/>\n\
    \      </Route>\n      <Route path=\"contact\" component={Contact} />\n    </Route>\n\
    \  </Router>,\n  destination);\n```\n\n在这个示例中，注意我们路径为 `stuff` 的 `Route` 元素现在包含了一个路径为\
    \ `blah` 的嵌套路由。这意味着如果你恰好有一个为 `/stuff/blah` 的 URL，那么除了父级匹配的 `Stuff` 组件和 `App` 组件外，`MyBlah`\
    \ 组件也将显示。通过嵌套路由并遵循路由匹配规则（https://github.com/reactjs/react-router/blob/master/docs/RouteMatching），你可以根据不同的\
    \ URL 布局显示视图。\n\n### 创建激活链接\n\n我们最后要处理的是增加应用程序可用性的功能。根据你当前处于哪个页面，我们将为激活的链接设置蓝色背景。例如，图\
    \ 13-6 是当 Stuff 内容显示时的应用程序样式。在 `Router` 中实现这一点的方法是在 `Link` 实例上指定一个名为 `active`\
    \ 的属性。为了让这一切发生，回到你的 `App` 组件并进行以下更改：\n\n点击此处查看代码图片\n\n```javascript\nvar App =\
    \ React.createClass({\n  render: function() {\n    return (\n      <div>\n   \
    \     <h1>Simple SPA</h1>\n        <ul className=\"header\">\n          <li><Link\
    \ to=\"/\" activeClassName=\"active\">Home</Link></li>\n          <li><Link to=\"\
    /stuff\" activeClassName=\"active\">Stuff</Link></li>\n          <li><Link to=\"\
    /contact\" activeClassName=\"active\">Contact</Link></li>\n        </ul>\n   \
    \     <div className=\"content\">\n          {this.props.children}\n        </div>\n\
    \      </div>\n    )\n  }\n});\n```\n\n我们指定 `activeClassName` 属性并设置为 `active`。这确保了当点击链接时（且路径变为激活状态），链接元素的\
    \ `class` 属性在运行时会被设置为 `active`。为了确保我们的激活链接有不同的样式，请添加以下 CSS：\n\n```css\n.active\
    \ {\n  background-color: #009FF;\n}\n```\n\n现在预览你的应用程序，点击任何链接。注意激活的链接（以及 Home\
    \ 链接）显示为蓝色背景。不过我们还没有完成。我们的 Home 链接总是被激活。它应该只在我们加载 Home 页面或显式导航到 Home 链接本身时被激活。为了修复这个问题，我们需要更改链接到\
    \ Home 内容的方式。与其用 `Link` 元素指定 Home 内容，不如将其替换为 `IndexLink` 元素。\n\n请进行此更改：\n\n点击此处查看代码图片\n\
    \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
    \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
    >\n          <li><IndexLink to=\"/\" activeClassName=\"active\">Home</IndexLink></li>\n\
    \          <li><Link to=\"/stuff\" activeClassName=\"active\">Stuff</Link></li>\n\
    \          <li><Link to=\"/contact\" activeClassName=\"active\">Contact</Link></li>\n\
    \        </ul>\n        <div className=\"content\">\n          {this.props.children}\n\
    \        </div>\n      </div>\n    )\n  }\n});\n```\n"
