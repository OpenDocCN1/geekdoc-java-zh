    \ `HelloWorld` 组件，以便你指定要问候的人或物，而不是通用的 `World`。要向组件添加属性，需要遵循两个部分：\n\n#### 第一部分：更新组件定义\n\
    \n现在，我们的 `HelloWorld` 组件硬编码为总是发送 `Hello, world!`。我们要做的第一件事是通过输出我们传入的值来改变这种行为。我们需要一个名称来赋予我们的属性，在这个例子中，我们将属性命名为\
