  raw: 'To deal with scoping shenanigans, we created a `self` variable initialized
    to `this` to ensure we created the `_input` property on our component. That seems
    unnecessarily messy.


    Using arrow functions, we can simplify all of this down to just the following:


    [Click here to view code image](#part0038.xhtml_p141pro02)


    <input


        ref={


              (el) => this._input = el


            }


        onChange={this.colorValue}


        placeholder="Enter a color value">


    </input>


    The end result is identical to what we spent all of this time looking at, and
    because of how arrow functions deal with scope, you can use `this` inside the
    function body and reference the component without doing any extra work. No need
    for an outer `self` variable equivalent!


    * * *


    ### Conclusion


    In this tutorial, we saw how “easy” it is to access a DOM element directly. React
    used to provide a much easier way of referencing elements. You could set the `refs`
    attribute on an element and initialize it to a string value:


    [Click here to view code image](#part0038.xhtml_p142pro01)


    <button refs="myButton">Click me!</button>


    You could then access this element after the component was mounted by doing something
    like `this.refs.myButton`. Before you get really excited about using something
    like this over our function callback approach with the `ref` attribute, this string-based
    approach is likely to be deprecated. It works at the moment of this writing, but
    who knows when it will stop working. Now, given that this is going away, you may
    be wondering why I told you about this. To be frank, I really have no idea :P


    ## 13. Creating a Single-Page App Using React Router


    Now that you’ve familiarized yourself with the basics of how to work with React,
    let’s kick things up a few notches. What we are going to do is use React to build
    a simple, **single-page app** (also referred to as **SPA** by the cool kids—and
    people living in Scandinavia). As we talked about in [Chapter 1](#part0008.xhtml_ch01)
    forever ago, single-page apps are different from the more traditional multi-page
    apps that you see everywhere. The biggest difference is that navigating a single-page
    app doesn’t involve going to an entirely new page. Instead, your pages (commonly
    known as **views** in this context) typically load inline within the same page
    as illustrated in [Figure 13-1](#part0020.xhtml_ch13fig01).


    ![Image](Images/image00287.jpeg)


    Figure 13-1 Single-page apps use load views inline rather than load new pages.


    When you are loading content inline, things get a little challenging. The hard
    part is not loading the content itself. That is relatively easy. The hard part
    is making sure that single-page apps behave in a way that is consistent with what
    your users are used to. More specifically, when users navigate your app, they
    expect that:


    **1.** The URL displayed in the address bar always reflects the thing that they
    are viewing.


    **2.** They can use the browser’s back and forward buttons—successfully.


    **3.** They can navigate to a particular view (aka **deep link**) directly using
    the appropriate URL.


    With multi-page apps, these three things come for free. There is nothing extra
    you have to do for any of it. With single-page apps, because you aren’t navigating
    to an entirely new page, you have to do real work to deal with these three things
    *that your users expect to just work*. You need to ensure that navigating within
    your app adjusts the URL appropriately. You need to ensure your browser’s history
    is properly synchronized with each navigation to allow users to use the back and
    forward buttons. If users bookmark a particular view or copy/paste a URL to access
    later, you need to ensure that your single-page app takes the user to the correct
    place.


    To deal with all of this, you have a bucket full of techniques commonly known
    as **routing**. Routing is where you try to map URLs to destinations that aren’t
    physical pages, such as the individual views in your single-page app. That sounds
    complicated, but fortunately there are a bunch of JavaScript libraries that help
    us out with this. One such JavaScript library is the star of this chapter, React
    Router **(**[https://github.com/reactjs/react-router](https://github.com/reactjs/react-router)**)**.
    React Router provides routing capabilities to single-page apps built in React,
    and what makes it nice is that it extends what you already know about React in
    familiar ways to give you all of this routing awesomeness. In this chapter, you
    learn all about how it does that—and hopefully more!


    ### The Example


    Before we go further, let’s take a look at an example (see [Figure 13-2](#part0020.xhtml_ch13fig02)).


    ![Image](Images/image00288.jpeg)


    Figure 13-2 A simple React app that uses React Router.


    What you have here is a simple React app that uses React Router to provide all
    of the navigation and view-loading goodness! While the screenshot of the app looks
    nice and all, this is one of those cases where you want to play with the app to
    see more of what it does. Go ahead and open this page ([https://www.kirupa.com/react/examples/react_router_final.htm](https://www.kirupa.com/react/examples/react_router_final.htm))
    in its own browser window, click on the various navigation tabs to see the different
    views, and use the back and forward buttons to see them working.


    In the following sections, we are going to be building this app in pieces. By
    the end, not only will you have recreated this app, you’ll hopefully have learned
    enough about React Router to build cooler and more awesomer things.


    ### Building the App


    The first thing we need to do is get the boilerplate markup and code for our app
    up and running. Create a new HTML document and add the following content into
    it:


    [Click here to view code image](#part0039.xhtml_p146pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React! React! React!</title>


      <script src="https://npmcdn.com/react@15.3.0/dist/react.js"></script>


      <script src="https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


      <style>


      </style>


    </head>


    <body>


      <div id="container">


      </div>


      <script type="text/babel">


        var destination = document.querySelector("#container");


        ReactDOM.render(


          <div>


            Hello!


          </div>,


          destination


        );


      </script>


    </body>


    </html>


    This starting point is almost the same as what you’ve seen for all of our other
    examples. This is just a nearly blank app that happens to load the React and React-DOM
    libraries. If you preview what you have in your browser, you’ll see a very lonely
    **Hello!** displayed.


    * * *


    Note: Still Keeping Things Simple


    For now, we are continuing to rely on having our browser do all of the heavy lifting.
    We’ll look into changing that up with a “modern” build process later, so enjoy
    the simplicity for now :P


    * * *


    Next, because React Router isn’t a part of React itself, we need to add a reference
    to it. In our markup, find where we have our existing script references and add
    the following highlighted line:


    [Click here to view code image](#part0039.xhtml_p147pro01)


    <script src="https://npmcdn.com/react@15.3.0/dist/react.js"></script>


    <script src="https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min


    .js"></script>


    <script src="https://npmcdn.com/react-router/umd/ReactRouter.min.js"></script> 


    By adding the highlighted line, we ensure the React Router library is loaded alongside
    the core React, ReactDOM, and Babel libraries. At this point, we are in a good
    state to start building our app and taking advantage of the sweet functionality
    React Router brings to the table.


    #### Displaying the Initial Frame'
