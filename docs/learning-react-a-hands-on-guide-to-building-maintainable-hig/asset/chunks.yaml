    \ function even if the `formatDistance` function didn’t exist when the calls were\
    \ first defined. That’s pretty awesome.\n\nIn a nutshell, functions are awesome.\
    \ I know that. You know that. That’s why all of the code we write has them all\
    \ over the place.\n\n### Changing How We Deal with the UI\n\nI don’t think anybody\
    \ will disagree with the good things functions bring to the table. They really\
