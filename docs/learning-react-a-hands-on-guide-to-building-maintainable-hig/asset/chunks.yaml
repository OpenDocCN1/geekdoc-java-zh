  trans: "\n只要你正在求值的表达式返回 JSX，你就可以在 `{` 和 `}` 大括号中放入任何你想要的内容。这种灵活性非常棒了，因为当你的 JavaScript\
    \ 代码写在 `render` 函数之外时，你可以做很多事情。**非常多的事情！**\n\n### 在 JSX 上下文中处理数组\n\n现在我们要进入一些有趣的内容了！当你显示多个组件时，你并不总是能够手动地指定它们：\n\
    \n```javascript\nReactDOM.render(\n  <<div>\n    {showCircle()}\n    {showCircle()}\n\
    \    {showCircle()}\n  </div>,\n  destination\n);\n```\n\n在许多现实世界的场景中，你显示的组件数量将与你处理的数组或类数组（又称迭代器）对象中的项目数量相关。这便带来了一些简单的复杂性。例如，假设我们有一个名为\
    \ `colors` 的数组，如下所示：\n\n点击此处查看代码图片\n\n```javascript\nvar colors = [\"#393E41\"\
    , \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n              \"#85FFC7\", \"#297373\"\
    , \"#FF8552\", \"#A40E4C\"];\n```\n\n我们要做的的是为此数组中的每个项创建一个 `Circle` 组件（并将 `bgColor`\
    \ 属性设置为每个数组项的值）。我们将采取这种方法：通过创建一个 `Circle` 组件的数组：\n\n点击此处查看代码图片\n\n```javascript\n\
    var colors = [\"#393E41\", \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n          \
    \    \"#85FFC7\", \"#297373\", \"#FF8552\", \"#A40E4C\"];\nvar renderData = [];\n\
    \nfor (var i = 0; i < colors.length; i++) {\n  renderData.push(<Circle bgColor={colors[i]}/>);\n\
    }\n```\n\n在这个片段中，我们像最初计划的那样，向 `renderData` 数组中填充了 `Circle` 组件。目前为止一切顺利。要显示所有这些组件，React\
    \ 让这一切变得非常简单。看看下面高亮的行，你只需要做这些：\n\n点击此处查看代码图片\n\n```javascript\nvar colors = [\"\
    #393E41\", \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n              \"#85FFC7\",\
    \ \"#297373\", \"#FF8552\", \"#A40E4C\"];\nvar renderData = [];\n\nfor (var i\
    \ = 0; i < colors.length; i++) {\n  renderData.push(<Circle bgColor={colors[i]}/>);\n\
    }\n\nReactDOM.render(\n  <div>\n    {renderData}\n  </div>,\n  destination\n);\n\
    ```\n\n在我们的 `render` 方法中，我们做的只是将 `renderData` 数组指定为我们需要求值的表达式。我们不需要任何其他步骤就可以从组件数组转变为在浏览器中预览时看到类似图\
    \ 9-2 的内容。\n\n![Image](img/image00272.jpeg)\n\n图 9-2 你在浏览器中应该看到的内容。\n\n好了，虽然我们的示例看起来有效，但我们还没有结束！实际上还有一件事我们需要做，这是一个微妙的操作。React\
    \ 让 UI 更新非常快的方法是它对你的 DOM 中到底发生了什么有一个良好的了解。它通过几种方式实现这一点，但一种非常明显的方式是在内部为每个元素标记了某种标识符。这种“标记”在你在\
    \ JSX 中显式指定元素时会自动发生。\n\n当你动态创建元素时（例如我们对 `Circle` 组件数组所做的那样），这些标识符不会被自动设置。我们需要做一些额外工作。这些额外工作的形式是一个\
    \ `key` 属性，React 使用它的值来唯一标识每个组件。对于我们的示例，我们可以这样做：\n\n点击此处查看代码图片\n\n```javascript\n\
    for (var i = 0; i < colors.length; i++) {\n  var color = colors[i];\n  renderData.push(<Circle\
    \ key={i + color} bgColor={color}/>);\n}\n```\n\n在每个组件上，我们指定了 `key` 属性并将其值设置为\
    \ `color` 和索引的组合。这确保了我们动态创建的每个组件最终获得一个唯一标识符，React 然后可以使用该标识符来优化未来的任何更新。现在，我们可以直接使用索引位置作为标识符，但如果你有多个动态生成元素的代码块，你可能会得到多个具有重复值的元素。\n\
    \n### 检查你的控制台\n\nReact 非常擅长在你可能做错时提醒你。例如，如果你动态创建元素或组件而没有指定 `key` 属性，你将在控制台中遇到以下警告：`Warning:\
    \ Each child in an array or iterator should have a unique \"key\" prop`。当你在使用\
    \ React 时，定期检查你的控制台是个好主意。\n\n### 结论\n\n到此为止，我们所看到的所有技巧和技巧都是为了同一件事：`JSX 是 JavaScript`。这允许我们在各种不舒服的情况下使用\
    \ JSX 并且得到我们想要的结果。虽然我们推的是数组，但最终看起来像这样：\n\n```javascript\nfor (var i = 0; i < colors.length;\
    \ i++) {\n  var color = colors[i];\n  renderData.push(<Circle key={i + color}\
    \ bgColor={color}/>);\n}\n```\n\n## 10. 处理事件\n\n到目前为止，我们的大多数示例只在页面加载时工作。正如你可能猜的那样，这并不正常。在大多数应用程序中，特别是我们将构建的那些\
    \ UI 密集型应用程序，会有很多响应某些事情的操作。某些事情由鼠标点击、按键按下、窗口调整或其他手势和交互触发。让这一切可能的胶水被称为 `事件`。\n\n\
    现在，你可能在 DOM 世界中使用它们时已经了解了所有事件。（如果你还不，我建议先快速复习一下：`https://www.kirupa.com/html5/events.htm`）。React\
    \ 处理事件的方式有点不同，如果你不注意，这些差异会在各种方面让你感到惊讶。别担心。这就是你有这本书的原因！我们从简单的示例开始，逐渐查看越来越怪异、复杂且（是的！）无聊的事情。\n\
    \n### 监听和响应事件\n\n学习 React 事件最简单的方法就是实际使用它们，而这正是我们要做的！为了这，我们有一个简单的示例，由一个计数器组成，每次点击按钮它都会增加。起初，我们的示例看起来像图\
    \ 10-1。\n\n![Image](img/image00273.jpeg)\n\n图 10-1 我们的示例。\n\n每次点击加号按钮，计数器就会增加\
    \ 1。点击几次加号按钮后，它看起来有点像图 10-2。\n\n![Image](img/image00274.jpeg)\n\n图 10-2 点击几次加号按钮后（23\
    \ 次？）。\n"
