    ## 致谢


    首先，如果没有我那出色的妻子 `Meena` 的支持和鼓励，这一切将是不可能的。如果她没有搁置自己的目标来让我花六个月时间设计、编写和重写你在这里看到的一切，那么我写这本书将只是一个遥不可及的梦想。


    接下来，我想感谢我的父母，他们总是鼓励我漫无目的地游荡，享受空闲时间去做我喜欢的事——例如在 20 世纪 90 年代后期在互联网上教完全陌生的人如何用编程实现酷炫。如果没有他们，我不会成为今天这样一个坚韧的室内派人士/学者/战士
    :P。


    在出版方面，写下你看到的这些文字是容易的。将书交到你手中是一个极其复杂的过程。我了解的涉及的每一个环节越多，我就越对所有在幕后辛勤工作以保持这台奇妙机器运行的个人感到感佩。感谢皮尔逊（Pearson）所有让这一切成为可能的同事！不过，我想特别点名感谢几个人。首先，我要感谢
    `Mark Taber` 持续给我合作的机会，感谢 `Chris Zahn` 耐心地回答我的无数问题/疑虑，感谢 `Abby Manheim` 将我写的英语版本转化为人类可以理解的内容，以及感谢
    `Loretta Yates` 在很久以前就帮助促成了让这一切发生的联系。此书的技术内容已由我的老朋友和在线合作伙伴 `Kyle Murray (aka Krilnon)`
    和 `Trevor McCauley (aka senocular)` 进行了详细审查。对于他们详尽（且经常很幽默！）的反馈，我不胜感激。


    ## 关于作者


    `Kirupa Chinnathambi` 过去的大部分时间都在试图教其他人像他一样热爱好 Web 开发。


    1999 年，在“博客”还未成为一个词之前，他就开始在 `http://kirupa.com` 上发布教程。在随后的几年里，他写了数百篇文章，写了几本书（当然，没有一本像这本好！），并录制了一系列可以在
    YouTube 上看到的视频。当他不在编写或谈论 Web 开发时，他作为微软的项目经理，利用清醒时间帮助让 Web 变得更酷。在不清醒的时候，他可能在睡觉……或者用第三人称描写他自己。


    ## 1. 介绍 React


    暂且忽略现在的 Web 应用在外观和感受上比以前更好，还有一些更根本性的变化发生了。我们现在架构和构建 Web 应用的方式已经完全不同了。为了突出这一点，让我们来看图
    1-1 所示的应用。


    ![Image](img/image00227.jpeg)


    图 1-1 一个应用。


