    \  render: function() {\n    return (\n      <div>\n        <h1>Simple SPA</h1>\n\
    \        <ul className=\"header\">\n          <li><Link to=\"/\" activeClassName=\"\
    active\">Home</Link></li>\n          <li><Link to=\"/stuff\" activeClassName=\"\
    active\">Stuff</Link></li>\n          <li><Link to=\"/contact\" activeClassName=\"\
    active\">Contact</Link></li>\n        </ul>\n        <div className=\"content\"\
    >\n          {this.props.children}\n        </div>\n      </div>\n    )\n  }\n\
    });\n```\n\nWe specify the `activeClassName` prop and set it to a value of `active`.\
    \ This ensures that whenever a link is clicked (and its path becomes active),\
