    \        {this.props.children}\n        </div>\n      </div>\n    )\n}\n\n});\n\
    \nOnce your Home navigation element is represented by an `IndexLink` instead of\
    \ a `Link`, preview your app again. This time, when the app loads, you’ll notice\
    \ that your Home link has the cool blue background by default. When you navigate\
    \ to the Stuff or Contact pages, the Home link no longer has the highlight applied.\
    \ And with this, your app is mostly good to go!\n\n## Conclusion\n\nBy now, we’ve\
    \ covered a good chunk of the cool functionality React Router has for helping\
    \ you build your single-page apps. This doesn’t mean that there aren’t more interesting\
    \ things for you to take advantage of. Our app was pretty simple with very modest\
    \ demands on what routing functionality we needed to implement. There is a whole\
    \ lot more that React Router provides, so if you are building a more complex single-page\
    \ app than what we’ve looked at so far, you should totally spend an afternoon\
    \ taking a look the full React Router documentation ([https://github.com/reactjs/react-router/](https://github.com/reactjs/react-router/))\
    \ and examples.\n\n## 14. Building a Todo List App\n\nIf creating the **Hello,\
    \ World!** example was a celebration of you getting your feet wet with React,\
    \ creating the quintessential Todo List app is a celebration of you approaching\
    \ React mastery! In this chapter, we tie together a lot of the concepts and techniques\
    \ you’ve learned to create something that works as follows: [https://www.kirupa.com/react/examples/todo.htm](https://www.kirupa.com/react/examples/todo.htm)\n\
    \nYou start off with a blank app that allows you to enter tasks for later (see\
    \ [Figure 14-1](#part0021.xhtml_ch14fig01)).\n\n![Image](Images/image0029.jpeg)\n\
    \nFigure 14-1 A blank app with task entry.\n\nThe way this Todo List app works\
    \ is pretty simple. Type in a task or whatever you want into the text field and\
    \ press Add (or hit Enter/Return). Once you’ve submitted your task, you will see\
    \ it appear as an entry. You can keep adding tasks to add additional entries and\
    \ have them all show up (see [Figure 14-2](#part0021.xhtml_ch14fig02)).\n\n![Image](Images/image00294.jpeg)\n\
    \nFigure 14-2 You can add tasks and have them show up.\n\nPretty simple, right?\
    \ In the following sections, we build this app from scratch and learn (in awesomely\
    \ painstaking detail) how things work along the way.\n\n### Getting Started\n\n\
    By now, you know the drill. We need a starting point, so go ahead and create a\
    \ new HTML document. Inside it, add the following content into it:\n\n[Click here\
    \ to view code image](#part0040.xhtml_p165pro01)\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>React! React! React!</title>\n  <script src=\"https://npmcdn.com/react@15.3.0/dist/react.js\"\
    ></script>\n  <script src=\"https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n  <style>\n  </style>\n</head>\n<body>\n  <div id=\"container\">\n\
    \  </div>\n  <script type=\"text/babel\">\n    var destination = document.querySelector(\"\
    #container\");\n    ReactDOM.render(\n      <div>\n        Hello!\n      </div>,\n\
    \      destination\n    );\n  </script>\n</body>\n</html>\n```\n\nIf you preview\
    \ all of this in the browser, you will see the word **Hello!** appear. If you\
    \ see that, then you are in good shape. It’s time to start building our Todo List\
    \ app!\n\n### Creating the UI\n\nRight now, our app doesn’t do a whole lot. We’ll\
    \ fix that by first getting the various UI elements up and running. That isn’t\
    \ very complicated for our app! The first thing we are going to do is is get our\
    \ input field and button to appear. This is all done by using the `div`, `form`,\
    \ `input`, and `button` elements!\n\nAll of that will live inside a component\
    \ we are going to call `TodoList`. Go ahead and add the following code above where\
    \ you have your `ReactDOM.render` method:\n\n[Click here to view code image](#part0040.xhtml_p166pro01)\n\
    \n```javascript\nvar TodoList = React.createClass({\n  render: function() {\n\
    \    return (\n      <div className=\"todoListMain\">\n        <div className=\"\
    header\">\n          <form>\n            <input placeholder=\"enter task\">\n\
    \            </input>\n            <button type=\"submit\">add</button>\n    \
    \      </form>\n        </div>\n      </div>\n    );\n  }\n});\n```\n\nInside\
    \ your `ReactDOM.render` method, we need to call our `TodoList` component to render\
    \ it.\n\n```javascript\nReactDOM.render(\n  <div>\n    <TodoList/>\n  </div>,\n\
    \  destination\n);\n```\n\nSave your changes and preview your app. You will see\
