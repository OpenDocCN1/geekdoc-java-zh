    \        <button style={buttonStyle}>+</button>\n      </div>\n    );\n  }\n});\n\
    \nReactDOM.render(\n  <div>\n    <CounterParent/>\n  </div>,\n  destination\n\
    );\n```\n\n一旦你添加了所有这些内容，在浏览器中预览以让内容显示出来。你应该能看到我们计数器的开头。花几分钟看看这些代码的作用。这里不应该有任何看起来奇怪的地方。唯一诡异的地方是点击按钮将没有任何反应。我们将在下一节中修复这个问题。\n\
    \n## 让按钮产生作用\n\n每当我们点击按钮时，我们都希望计数器的值增加 1。我们需要做的大致步骤如下：\n\n1. 监听按钮上的点击事件并指定一个事件处理器。\n\
    2. 实现事件处理器，在其中我们增加计数器所依赖的 `this.state.count` 属性的值。\n\n我们将按照列表逐执行——从监听点击事件开始。在\
    \ React 中，你通过在 JSX 中内联指定所有内容来监听事件。具体来说，你是在你的标记内部同时指定了你正在监听的事件以及将要调用的事件处理器。要做到这一点，找到我们\
    \ `CounterParent` 组件内部的 `return` 函数，并进行以下更改：\n\n点击此处查看代码图片\n\n```javascript\n\
    return (\n  <div style={backgroundStyle}>\n    <Counter display={this.state.count}/>\n\
    \    <button onClick={this.increase} style={buttonStyle}>+</button>\n  </div>\n\
    );\n```\n\n我们所做的是告诉 React 在监听到 `onClick` 事件时调用 `increase` 函数。接下来，让我们实现 `increase`\
    \ 函数——即我们的事件处理器。在我们的 `CounterParent` 组件内部，添加以下行代码：\n\n点击此处查看代码图片\n\n```javascript\n\
    var CounterParent = React.createClass({\n  getInitialState: function() {\n   \
    \ return {\n      count: 0\n    };\n  },\n  increase: function(e) {\n    this.setState({\n\
    \      count: this.state.count + 1\n    });\n  },\n  render: function() {\n  \
    \  var backgroundStyle = {\n      padding: 50,\n      backgroundColor: \"#FFC53A\"\
    ,\n      width: 250,\n      height: 100,\n      borderRadius: 10,\n      textAlign:\
    \ \"center\"\n    };\n    var buttonStyle = {\n      fontSize: \"1em\",\n    \
    \  width: 30,\n      height: 30,\n      fontFamily: \"sans-serif\",\n      color:\
    \ \"#333\",\n      fontWeight: \"bold\",\n      lineHeight: \"3px\"\n    };\n\
    \    return (\n      <div style={backgroundStyle}>\n        <Counter display={this.state.count}/>\n\
    \        <button style={buttonStyle}>+</button>\n      </div>\n    );\n  }\n});\n\
    ```\n\n## 事件属性\n\n如你所知，我们的事件会向事件处理器传递一个所谓的“事件参数”。这个事件参数包含了许多与你正在处理的事件类型特定的属性。在标准的\
    \ DOM 世界中，每种事件都有其特定的类型。例如，如果你正在处理鼠标事件，那么你的事件和它的事件参数对象将是 `MouseEvent` 类型。这个 `MouseEvent`\
    \ 对象将允许你访问鼠标特定的信息，例如点击了哪个按钮或点击的屏幕位置。键盘相关事件的事件参数是 `KeyboardEvent` 类型。你的 `KeyboardEvent`\
    \ 对象包含的属性（许多许多方面）允许你确定实际按了哪个键。我可以无限列举所有其他 `Event` 类型，但你明白意思了。每种 `Event` 类型都包含一组你可以通过该事件的事件处理器访问的属性！\n\
    \n为什么要告诉你这些你已经知道的事情呢？\n\n### 合成事件\n\n在 React 中，当你像我们使用 `onClick` 那样在 JSX 中指定事件时，你并没有直接处理普通的\
    \ DOM 事件。相反，你处理的是一种 React 特有的事件类型，被称为 `SyntheticEvent`。你的事件处理器不会获取 `MouseEvent`、`KeyboardEvent`\
    \ 等原生事件参数。它们总是获取封装了浏览器原生事件的 `SyntheticEvent` 类型参数。这在我们的代码中有什么影响？令人惊讶，并没有什么。\n\n\
    每个 `SyntheticEvent` 包含以下属性：\n\n![Image](img/image00275.jpeg)\n"
- fmt: "\nThese properties should seem pretty straightforward—and generic! The non-generic\
    \ stuff depends on what type of native event our `SyntheticEvent` is wrapping.\
    \ This means that a `SyntheticEvent` that wraps a `MouseEvent` will have access\
    \ to mouse-specific properties such as the following:\n\n- `boolean altKey`\n\
    - `number button`\n- `number buttons`\n- `number clientX`\n- `number clientY`\n\
    - `boolean ctrlKey`\n- `boolean getModifierState(key)`\n- `boolean metaKey`\n\
    - `number pageX`\n- `number pageY`\n- `DOMEventTarget relatedTarget`\n- `number\
    \ screenX`\n- `number screenY`\n- `boolean shiftKey`\n\nSimilarly, a `SyntheticEvent`\
    \ that wraps a `KeyboardEvent` will have access to these additional keyboard-related\
    \ properties:\n\n- `boolean altKey`\n- `number charCode`\n- `boolean ctrlKey`\n\
    - `boolean getModifierState(key)`\n- `string key`\n- `number keyCode`\n- `string\
    \ locale`\n- `number location`\n- `boolean metaKey`\n- `boolean repeat`\n- `boolean\
    \ shiftKey`\n- `number which`\n\nIn the end, all of this means that you still\
    \ get the same functionality in the `SyntheticEvent` world that you had in the\
    \ vanilla DOM world.\n\nNow, here is something I learned the hard way. *Don’t\
    \ refer to traditional DOM event documentation when using Synthetic events and\
    \ their properties.* Because the `SyntheticEvent` wraps your native DOM event,\
    \ events and their properties may not map one-to-one. Some DOM events don’t even\
    \ exist in React. To avoid running into any issues, if you want to know the name\
    \ of a `SyntheticEvent` or any of its properties, *refer to the* `React Event\
    \ System document(https://facebook.github.io/react/docs/events.html)` *instead*.\n\
    \n#### Doing Stuff With Event Properties\n\nBy now, you’ve probably seen more\
    \ about the DOM and `SyntheticEvent` stuff than you’d probably like. To wash away\
    \ the taste of all that text, let’s write some code and put all of this newfound\
    \ knowledge to good use. Right now, our counter example increments by one each\
    \ time you click on the plus button. What we want to do is *increment our counter\
    \ by ten when the Shift key on the keyboard is pressed* while clicking the plus\
    \ button with our mouse.\n\nThe way we are going to do that is by using the `shiftKey`\
    \ property that exists on the `SyntheticEvent` when using the mouse:\n\n- `boolean\
    \ altKey`\n- `number button`\n- `number buttons`\n- `number clientX`\n- `number\
    \ clientY`\n- `boolean ctrlKey`\n- `boolean getModifierState(key)`\n- `boolean\
    \ metaKey`\n- `number pageX`\n- `number pageY`\n- `DOMEventTarget relatedTarget`\n\
    - `number screenX`\n- `number screenY`\n- `boolean shiftKey`\n\nThe way this property\
    \ works is simple. If the Shift key is pressed when this mouse event fires, then\
    \ the `shiftKey` property value is `true`. Otherwise, the `shiftKey` property\
    \ value is `false`. To increment our counter by 10 when the Shift key is pressed,\
    \ go back to our `increase` function and make the following highlighted changes:\n\
    \n[Click here to view code image](#part0036.xhtml_p115pro01)\n\n```javascript\n\
    increase: function(e) {\n  var currentCount = this.state.count;\n  if (e.shiftKey)\
    \ {\n    currentCount += 10;\n  } else {\n    currentCount += 1;\n  }\n  this.setState({\n\
    \    count: currentCount\n  });\n},\n```\n\nOnce you’ve made the changes, preview\
    \ our example in the browser. Each time you click on the plus button, your counter\
    \ will increment by one just like it had always done. If you click on the plus\
    \ button with your Shift key pressed, notice that our counter increments by 10\
    \ instead.\n\nThe reason that all of this works is because we change our incrementing\
    \ behavior depending on whether the Shift key is pressed or not. That is primarily\
    \ handled by the following lines:\n\n```javascript\nif (e.shiftKey) {\n  currentCount\
    \ += 10;\n} else {\n  currentCount += 1;\n}\n```\n\nIf the `shiftKey` property\
    \ on our `SyntheticEvent` event argument is `true`, we increment our counter by\
    \ 10. If the `shiftKey` value is `false`, we just increment by 1.\n\n#### More\
    \ Eventing Shenanigans\n\nWe are not done yet! Up until this point, we’ve looked\
    \ at how to work with events in a simplistic way. In the real world, rarely will\
    \ things be as direct as what we’ve seen. Your real apps will be more complex,\
    \ and because React insists on doing things differently, we’ll need to learn (or\
    \ re-learn) some event-related tricks and techniques to make our apps work. That’s\
    \ where this section comes in. We are going to look at some situations you’ll\
    \ run into and how to deal with them.\n\n##### You Can’t Directly Listen to Components\n\
    \nLet’s say your component is nothing more than a button or another type of UI\
    \ element that users will be interacting with. You can’t get away with doing something\
    \ like the following line:\n\n[Click here to view code image](#part0036.xhtml_p116pro01)\n\
    \n```javascript\nCounterParent = React.createClass({\n  getInitialState: function()\
    \ {\n    return {\n      count: 0\n    };\n  },\n  increase: function() {\n  \
    \  this.setState({\n      count: this.state.count + 1\n    });\n  },\n  render:\
    \ function() {\n    return (\n      <div>\n        <Counter display={this.state.count}/>\n\
    \        <PlusButton onClick={this.increase}/>\n      </div>\n    );\n  }\n});\n\
    ```\n\nOn the surface, this line of JSX looks totally valid. When somebody clicks\
    \ on our `PlusButton` component, the `increase` function will get called. In case\
    \ you are curious, this is what our `PlusButton` component looks like:\n\n[Click\
    \ here to view code image](#part0036.xhtml_p116pro02)\n\n```javascript\nPlusButton\
    \ = React.createClass({\n  render: function() {\n    return (\n      <button>\n\
    \        +\n      </button>\n    );\n  }\n});\n```\n\nYour `PlusButton` component\
    \ doesn’t do anything crazy. It only returns a single HTML element! No matter\
    \ how you slice and dice this, none of this matters. It doesn’t matter how simple\
    \ or obvious the HTML we are returning via a component looks like. *You simply\
    \ can’t listen for events on them directly*. The reason is because components\
    \ are wrappers for DOM elements. What does it even mean to listen for an event\
    \ on a component? Once your component gets unwrapped into DOM elements, does the\
    \ outer HTML element act as the thing you are listening for the event? Is it some\
    \ other element? How do you distinguish between listening for an event and declaring\
    \ a prop with a value?\n\nThere is no clear answer to any of those questions.\
    \ It’s too harsh to say that the solution is to simply not listen to events on\
    \ components, either. Frankly, there is a workaround where we treat the event\
    \ handler as a prop and pass it on to the component. Inside the component, we\
    \ can then assign the event to a DOM element and set the event handler to the\
    \ value of the prop we just passed in. I realize that probably makes no sense,\
    \ so let’s walk through an example.\n\nTake a look at the following highlighted\
    \ line:\n\n[Click here to view code image](#part0036.xhtml_p117pro01)\n\n```javascript\n\
    CounterParent = React.createClass({\n  // ... (state and increase logic)\n  render:\
    \ function() {\n    return (\n      <div>\n        <Counter display={this.state.count}/>\n\
    \        <PlusButton clickHandler={this.increase}/>\n      </div>\n    );\n  }\n\
    });\n```\n\nIn this example, we create a property called `clickHandler` whose\
    \ value is the `increase` event handler. Inside our `PlusButton` component, we\
    \ can then do something like this:\n\n[Click here to view code image](#part0036.xhtml_p117pro02)\n\
    \n```javascript\nPlusButton = React.createClass({\n  render: function() {\n  \
    \  return (\n      <button onClick={this.props.clickHandler}>\n        +\n   \
    \   </button>\n    );\n  }\n});\n```\n\nOn our `button` element, we specify the\
    \ `onClick` event and set its value to the `clickHandler` prop. At runtime, this\
    \ prop gets evaluated as our `increase` function, and clicking the plus button\
    \ ensures the `increase` function gets called.\n"
