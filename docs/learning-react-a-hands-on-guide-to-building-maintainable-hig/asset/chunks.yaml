    #container {


      padding: 50px;


      background-color: #EEE;


    }


    #container h1 {


      font-size: 48px;


      font-family: sans-serif;


      color: #0080A8;


    }


    After you have added all of this, preview your page. Notice that our text appears
    with a little more purpose than it did earlier when it relied entirely on the
    browser’s default styling (see [Figure 2-1](#part0009.xhtml_ch02fig01)).


    ![Image](Images/image00238.jpeg)


    Figure 2-1 The result of adding the CSS.


    The reason this works is that our DOM’s `body`, after running all of the React
    code, contains our **container** element with an `h1` tag inside it. It doesn’t
    matter that the `h1` tag was defined entirely inside JavaScript in this JSX syntax
    or that your CSS was defined well outside of the `render` method. The end result
    is that your React app is still going to be made up of some 100% organic (and
    cage-free!) HTML, CSS, and JavaScript:


    [Click here to view code image](#part0028.xhtml_p020pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React! React! React!</title>


      <script src="https://fb.me/react-15.1.0.js"></script>


      <script src="https://fb.me/react-dom-15.1.0.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


      <style>


        #container {


          padding: 50px;


          background-color: #EEE;


        }


        #container h1 {


          font-size: 144px;


          font-family: sans-serif;


          color: #0080a8;


        }


      </style>


    </head>


    <body>


      <div id="container"></div>


      <script type="text/babel">


        var destination = document.querySelector("#container");


        ReactDOM.render(React.createElement(


          "h1",


