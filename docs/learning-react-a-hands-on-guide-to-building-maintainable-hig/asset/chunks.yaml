  trans: "\n在我们当前的示例中，我们为 `Square` 和 `Label` 组件硬编码了颜色值。这种做法很奇怪——虽然这可能是为了戏剧效果而刻意为之，也可能并非如此，但修复它是非常直接的。这只需要我们指定一个属性名称，并通过\
    \ `this.props` 访问它。我们之前已经见过这些了。不同之处在于我们需要执行这些操作的次数。\n\n没有办法可以`恰当`地在父组件上指定一个属性，并让所有后代自动获得该属性的访问权限。有很多`不恰当`的方法可以处理这种情况，例如定义全局对象、直接在组件属性上设置值等。我们现在不打算考虑这些不恰当的解决方案。我们又不是动物！\n\
    \n无论如何，将属性值传递给子组件的正确方法是让每个中间父组件也传递该属性。为了直观看到这一过程，请查看我们当前代码中高亮的更改，其中我们放弃了硬编码颜色，转而使用\
    \ `color` 属性来定义卡片的颜色：点击此处查看代码图片\n\n```javascript\nvar Square = React.createClass({\n\
    \  render: function() {\n    var squareStyle = {\n      height: 150,\n      backgroundColor:\
    \ this.props.color \n    };\n    return(\n      <div style={squareStyle}>\n\n\
    \      </div>\n    );\n  }\n});\n\nvar Label = React.createClass({\n  render:\
    \ function() {\n    var labelStyle = {\n      fontFamily: \"sans-serif\",\n  \
    \    fontWeight: \"bold\",\n      padding: 13,\n      margin: 0\n    };\n\n  \
    \  return (\n      <p style={labelStyle}>{this.props.color}</p> \n    );\n  }\n\
    });\n\nvar Card = React.createClass({\n  render: function() {\n    var cardStyle\
    \ = {\n      height: 200,\n      width: 150,\n      padding: 0,\n      backgroundColor:\
    \ \"#FFF\",\n      WebkitFilter: \"drop-shadow(0px 0px 5px #666)\",\n      filter:\
    \ \"drop-shadow(0px 0px 5px #666)\"\n    };\n\n    return (\n      <div style={cardStyle}>\n\
    \        <Square color={this.props.color}/> \n        <Label color={this.props.color}/>\
    \  \n      </div>\n    );\n  }\n});\n\nReactDOM.render(\n  <div>\n    <Card color=\"\
    #FF6663\"/> \n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n\
    一旦你做了此更改，就可以在调用 `Card` 组件时指定你想要的任何十六进制颜色：点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    <Card color=\"#FFA37\"/> \n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n生成的调色板将包含你指定的颜色（参见图 5-12）。\n\n![Image](img/image00260.jpeg)\n\
    \n图 5-12 十进制值 #FFA37 的颜色。现在，让我们回到我们所做的更改上。尽管 `color` 属性仅被 `Square` 和 `Label` 组件消费，但父组件\
    \ `Card` 负责将它传递给它们。对于更深嵌套的情况，会有更多的中间组件负责传输。情况更糟。当你有多个属性想要在多级组件之间传递时，你做的打字量（或复制/粘贴量）也会大幅增加。有方法可以缓解这一点，我们将在未来的章节中详细介绍这些缓解策略。\n\
    \n### 为什么组件组合性如此酷棒\n\n当我们埋头于 React 开发时，往往会忘记我们最终创建的只是平庸且无聊的 HTML、CSS 和 JavaScript。我们的颜色卡片生成的\
    \ HTML 如下：点击此处查看代码图片\n\n```html\n<div id=\"container\">\n  <div data-reactid=\"\
    .0\">\n    <div style=\"height:200px; width:150px; padding:0; background-color:#FFF;\
    \ -webkit-filter:drop-shadow(0px 0px 5px #666); filter:drop-shadow(0px 0px 5px\
    \ #666);\">\n      <div style=\"height:150px; background-color:#FF6663;\"></div>\n\
    \      <p style=\"font-family:sans-serif; font-weight:bold; padding:13px; margin:0;\"\
    >#FF6663</p>\n    </div>\n  </div>\n</div>\n```\n\n这些标记标记完全不知道自己是如何出现在那里的。它不知道哪些组件负责什么。它不关心组件组合性，也不关心我们必须将\
    \ `color` 属性从父组件传输到子组件的这种令人沮丧的方式。这引出了一个重点。\n\n如果我们必须对组件功能的最终结果进行概括，它们所做的就是向任何调用者返回\
    \ HTML 块。每个组件的 `render` 函数向另一个组件的 `render` 函数返回一些 HTML。所有这些 HTML 不断积累，直到一个巨大的\
    \ HTML 块被推送到我们的 中（非常高效）。这种简单性正是组件复用和组合性如此有效的原因。每个 HTML 块都与其他 HTML 块相互独立——特别是当你按照\
    \ React 的建议指定内联样式时。这使你能够从其他视觉元素轻松创建视觉元素，而无需担心任何事情。任何事情！这不很棒吗？\n\n### 结论\n\n你现在可能已经意识到了，我们正在转向\
    \ React 擅长的更高级的场景。实际上，高级并不是正确的词。正确的词是`现实`。在本章中，我们从学习如何观察 UI 并识别出以后可以实现的组件开始。这是你经常遇到的情况。虽然我们采用的方法看起来非常正式，但随着你\
    \ React 经验的增加，你可以降低正式程度。\n\n## 6. 传递属性 (Props)\n\n### 问题概述\n\n假设有一个深嵌套的组件，它的层级结构（建模为彩色的圆圈）如图\
    \ 6-1](#part0013.xhtml_ch06fig01) 所示。\n"
- fmt: "\nWhat you want to do is pass a property from your red circle all the way\
    \ down to our purple circles where it will be used. What we can’t do is the very\
    \ obvious and straightforward thing shown in [Figure 6-2](#part0013.xhtml_ch06fig02).\n\
    \n![Image](Images/image00262.jpeg)\n\nFigure 6-2 Can’t do this.\n\nYou can’t pass\
    \ a property directly to the component or components that you wish to target.\
    \ The reason has to do with how React works. `React enforces a chain of command\
    \ where properties have to flow down from a parent component to an immediate child\
    \ component`. This means you can’t skip a layer of children when sending a property.\
    \ This also means your children can’t send a property back up to a parent. All\
    \ communication is one-way from the parent to the child.\n\nUnder these guidelines,\
    \ passing a property from our red circle to our purple circle looks a little bit\
    \ like [Figure 6-3](#part0013.xhtml_ch06fig03).\n\n![Image](Images/image00263.jpeg)\n\
    \nFigure 6-3 The property is passed from parent to child.\n\nEvery component that\
    \ lies on the intended path has to receive the property from its parent and then\
    \ re-send that property to its child. This process repeats until your property\
    \ reaches its intended destination. The problem is in this receiving and re-sending\
    \ step.\n\nIf we had to send a property called `color` from the component representing\
    \ our red circle to the component representing our purple circle, its path to\
    \ the destination would look something like [Figure 6-4](#part0013.xhtml_ch06fig04).\n\
    \n![Image](Images/image00264.jpeg)\n\nFigure 6-4 Sending the `color` property.\n\
    \nNow, imagine we have two properties that we need to send, as in [Figure 6-5](#part0013.xhtml_ch06fig05).\n\
    \n![Image](Images/image00265.jpeg)\n\nFigure 6-5 Sending two properties.\n\nWhat\
    \ if we wanted to send three properties? Or four?\n\nWe can quickly see that this\
    \ approach is neither scalable nor maintainable. For every additional property\
    \ we need to communicate, we are going to have to add an entry for it as part\
    \ of declaring each component. If we decide to rename our properties at some point,\
    \ we will have to ensure that every instance of that property is renamed as well.\
    \ If we remove a property, we need to remove the property from every component\
    \ that relied on it. Overall, these are the kinds of situations we try to avoid\
    \ when writing code. What can we do about this?\n\n### Detailed Look at the Problem\n\
    \nIn the previous section, we talked at a high level about what the problem is.\
    \ Before we can dive into figuring out a solution, we need to go beyond diagrams\
    \ and look at a more detailed example with real code. We need to take a look at\
    \ something like the following:\n\n[Click here to view code image](#part0032.xhtml_p074pro01)\n\
    \n```javascript\nvar Display = React.createClass({\n  render: function() {\n \
    \   return(\n      <div>\n        <p>{this.props.color}</p>\n        <p>{this.props.num}</p>\n\
    \        <p>{this.props.size}</p>\n      </div>\n    );\n  }\n});\n\nvar Label\
    \ = React.createClass({\n  render: function() {\n    return (\n      <Display\
    \ color={this.props.color}\n               num={this.props.num}\n            \
    \   size={this.props.size}/>\n    );\n  }\n});\n\nvar Shirt = React.createClass({\n\
    \  render: function() {\n    return (\n      <div>\n        <Label color={this.props.color}\n\
    \               num={this.props.num}\n               size={this.props.size}/>\n\
    \      </div>\n    );\n  }\n});\n\nReactDOM.render(\n  <div>\n    <Shirt color=\"\
    steelblue\" num=\"3.14\" size=\"medium\"/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\nTake a few moments to understand what is on. Once you\
    \ have done, let’s walk through this example. What we have is a `Shirt` component\
    \ that relies on the output of the `Label` component which relies on the output\
    \ of the `Display` component. (Try saying that sentence fast!) Anyway, the component\
    \ hierarchy can be seen in [Figure 6-6](#part0013.xhtml_ch06fig06).\n\n![Image](Images/image00266.jpeg)\n\
    \nFigure 6-6 The component hierarchy.\n\nWhen you run this code, what gets output\
    \ is nothing special. It just three lines of text (see [Figure 6-7](#part0013.xhtml_ch06fig07)).\n\
    \n![Image](Images/image00267.jpeg)\n\nFigure 6-7 The three lines of text.\n\n\
    The interesting part is how the text gets there. Each of the three lines of text\
    \ that you see maps to a property we specified at the very beginning inside `ReactDOM.render`:\n\
    \n[Click here to view code image](#part0032.xhtml_p076pro1)\n\n```html\n<Shirt\
    \ color=\"steelblue\" num=\"3.14\" size=\"medium\"/>\n```\n\nThe `color`, `num`,\
    \ and `size` properties (and their values) make a journey all the way to the `Display`\
    \ component that would make the most seasoned traveler jealous. Let’s follow these\
    \ properties from their inception to when they get consumed, and I realize that\
    \ a lot of this will be a review of you’ve seen. If you find yourself bored, feel\
    \ free to skip on the next section. With that said, onwards and upwards!\n\nLife\
    \ for our properties starts inside `ReactDOM.render` when our `Shirt` component\
    \ gets called with the `color`, `num`, and `size` properties:\n\n[Click here to\
    \ view code image](#part0032.xhtml_p076pro2)\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    <Shirt color=\"steelblue\" num=\"3.14\" size=\"medium\"/>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\nWe not only define the properties,\
    \ we also initialize them with the values they will carry. Inside the `Shirt`\
    \ component, these properties are stored inside the `props` object. To transfer\
    \ these properties on, we need to explicitly access these properties from the\
    \ `props` object and list them as part of the component call. The following is\
    \ an example of what that looks when our `Shirt` component calls our `Label` component:\n\
    \n[Click here to view code image](#part0032.xhtml_p077pro01)\n\n```javascript\n\
    var Shirt = React.createClass({\n  render: function() {\n    return (\n      <div>\n\
    \        <Label color={this.props.color}\n        num={this.props.num}\n     \
    \   size={this.props.size}/>\n      </div>\n    );\n  }\n});\n```\n\nNotice that\
    \ the `color`, `num`, and `size` properties are listed again. The only difference\
    \ from what we saw with the `ReactDOM.render` call is that the values for each\
    \ property are taken from their respective entry in the `props` object as opposed\
    \ to being manually entered.\n\nWhen our `Label` component goes live, it has its\
    \ `props` object properly filled out with the `color`, `num`, and `size` properties\
    \ stored. You can probably see a pattern forming here. If you need to let out\
    \ a big yawn, feel free to.\n\nThe `Label` component continues the tradition by\
    \ repeating the same steps and calling the `Display` component:\n\n[Click here\
    \ to view code image](#part0032.xhtml_p077pro02)\n\n```javascript\nvar Label =\
    \ React.createClass({\n  render: function() {\n    return (\n      <Display color={this.props.color}\n\
    \               num={this.props.num}\n               size={this.props.size}/>\n\
    \    );\n  }\n});\n```\n\nPhew. All we wanted to do was have our `Display` component\
    \ display some values for `color`, `num`, and `size`. The only complication was\
    \ that the values we wanted to display were originally defined as part of `ReactDOM.render`.\
    \ The annoying solution is the one you see here where every component along the\
    \ path to the destination needs to access and re-define each property as part\
    \ of passing it along. That’s just terrible. We can do better than this, and you\
    \ will see how in a few moments!\n\n### Meet the Spread Operator\n\nThe solution\
    \ to all of our problems lies in something new to JavaScript known as the spread\
    \ operator. What the spread operator does is a bit bizarre to explain without\
    \ some context, so I’ll first give you an example and then bore you with a definition.\n\
    \nTake a look at the following snippet:\n\n```javascript\nvar items = [\"1\",\
    \ \"2\", \"3\"];\n\nfunction printStuff(a, b, c) {\n  console.log(\"Printing:\
    \ \" + a + \" \" + b + \" \" + c);\n}\n```\n"
  raw: 'What you want to do is pass a property from your red circle all the way down
    to our purple circles where it will be used. What we can’t do is the very obvious
    and straightforward thing shown in [Figure 6-2](#part0013.xhtml_ch06fig02).


    ![Image](Images/image00262.jpeg)


    Figure 6-2 Can’t do this.


    You can’t pass a property directly to the component or components that you wish
    to target. The reason has to do with how React works. *React enforces a chain
    of command where properties have to flow down from a parent component to an immediate
    child component*. This means you can’t skip a layer of children when sending a
    property. This also means your children can’t send a property back up to a parent.
    All communication is one-way from the parent to the child.


    Under these guidelines, passing a property from our red circle to our purple circle
    looks a little bit like [Figure 6-3](#part0013.xhtml_ch06fig03).


    ![Image](Images/image00263.jpeg)


    Figure 6-3 The property is passed from parent to child.


    Every component that lies on the intended path has to receive the property from
    its parent and then re-send that property to its child. This process repeats until
    your property reaches its intended destination. The problem is in this receiving
    and re-sending step.


    If we had to send a property called `color` from the component representing our
    red circle to the component representing our purple circle, its path to the destination
    would look something like [Figure 6-4](#part0013.xhtml_ch06fig04).


    ![Image](Images/image00264.jpeg)


    Figure 6-4 Sending the `color` property.


    Now, imagine we have two properties that we need to send, as in [Figure 6-5](#part0013.xhtml_ch06fig05).


    ![Image](Images/image00265.jpeg)


    Figure 6-5 Sending two properties.


    What if we wanted to send three properties? Or four?


    We can quickly see that this approach is neither scalable nor maintainable. For
    every additional property we need to communicate, we are going to have to add
    an entry for it as part of declaring each component. If we decide to rename our
    properties at some point, we will have to ensure that every instance of that property
    is renamed as well. If we remove a property, we need to remove the property from
    every component that relied on it. Overall, these are the kinds of situations
    we try to avoid when writing code. What can we do about this?


    ### Detailed Look at the Problem


    In the previous section, we talked at a high level about what the problem is.
    Before we can dive into figuring out a solution, we need to go beyond diagrams
    and look at a more detailed example with real code. We need to take a look at
    something like the following:


    [Click here to view code image](#part0032.xhtml_p074pro01)


    var Display = React.createClass({


      render: function() {


        return(


          <div>


            <p>{this.props.color}</p>


            <p>{this.props.num}</p>


            <p>{this.props.size}</p>


          </div>


        );


      }


    });


    var Label = React.createClass({


      render: function() {


        return (


          <Display color={this.props.color}


                  num={this.props.num}


                  size={this.props.size}/>


        );


      }


    });


    var Shirt = React.createClass({


      render: function() {


          return (


            <div>


              <Label color={this.props.color}


                     num={this.props.num}


                     size={this.props.size}/>


            </div>


          );


        }


    });


    ReactDOM.render(


      <div>


        <Shirt color="steelblue" num="3.14" size="medium"/>


      </div>,


      document.querySelector("#container")


    );


    Take a few moments to understand what is going on. Once you have done that, let’s
    walk through this example together.


    What we have is a `Shirt` component that relies on the output of the `Label` component
    which relies on the output of the `Display` component. (Try saying that sentence
    five time fast!) Anyway, the component hierarchy can be seen in [Figure 6-6](#part0013.xhtml_ch06fig06).


    ![Image](Images/image00266.jpeg)


    Figure 6-6 The component hierarchy.


    When you run this code, what gets output is nothing special. It is just three
    lines of text (see [Figure 6-7](#part0013.xhtml_ch06fig07)).


    ![Image](Images/image00267.jpeg)


    Figure 6-7 The three lines of text.


    The interesting part is how the text gets there. Each of the three lines of text
    that you see maps to a property we specified at the very beginning inside `ReactDOM.render`:


    [Click here to view code image](#part0032.xhtml_p076pro01)


    <Shirt color="steelblue" num="3.14" size="medium"/>


    The `color`, `num`, and `size` properties (and their values) make a journey all
    the way to the `Display` component that would make even the most seasoned world
    traveler jealous. Let’s follow these properties from their inception to when they
    get consumed, and I do realize that a lot of this will be a review of what you’ve
    already seen. If you find yourself getting bored, feel free to skip on to the
    next section. With that said, onwards and upwards!


    Life for our properties starts inside `ReactDOM.render` when our `Shirt` component
    gets called with the `color`, `num`, and `size` properties specified:


    [Click here to view code image](#part0032.xhtml_p076pro02)


    ReactDOM.render(


      <div>


        <Shirt color="steelblue" num="3.14" size="medium"/> 


      </div>,


      document.querySelector("#container")


    );


    We not only define the properties, we also initialize them with the values they
    will carry.


    Inside the `Shirt` component, these properties are stored inside the `props` object.
    To transfer these properties on, we need to explicitly access these properties
    from the `props` object and list them as part of the component call. The following
    is an example of what that looks like when our `Shirt` component calls our `Label`
    component:


    [Click here to view code image](#part0032.xhtml_p077pro01)


    var Shirt = React.createClass({


      render: function() {


          return (


            <div>


              <Label color={this.props.color} 


                     num={this.props.num}     


                     size={this.props.size}/> 


            </div>


          );


        }


    });


    Notice that the `color`, `num`, and `size` properties are listed again. The only
    difference from what we saw with the `ReactDOM.render` call is that the values
    for each property are taken from their respective entry in the `props` object
    as opposed to being manually entered.


    When our `Label` component goes live, it has its `props` object properly filled
    out with the `color`, `num`, and `size` properties stored. You can probably see
    a pattern forming here. If you need to let out a big yawn, feel free to.


    The `Label` component continues the tradition by repeating the same steps and
    calling the `Display` component:


    [Click here to view code image](#part0032.xhtml_p077pro02)


    var Label = React.createClass({


      render: function() {


        return (


          <Display color={this.props.color} 


                  num={this.props.num}      


                  size={this.props.size}/>  


        );


      }


    });


    Phew. All we wanted to do was have our `Display` component display some values
    for `color`, `num`, and `size`. The only complication was that the values we wanted
    to display were originally defined as part of `ReactDOM.render`. The annoying
    solution is the one you see here where every component along the path to the destination
    needs to access and re-define each property as part of passing it along. That’s
    just terrible. We can do better than this, and you will see how in a few moments!


    ### Meet the Spread Operator


    The solution to all of our problems lies in something new to JavaScript known
    as the **spread operator**. What the spread operator does is a bit bizarre to
    explain without some context, so I’ll first give you an example and then bore
    you with a definition.


    Take a look at the following snippet:


    [Click here to view code image](#part0032.xhtml_p078pro01)


    var items = ["1", "2", "3"];


    function printStuff(a, b, c) {


      console.log("Printing: " + a + " " + b + " " + c);


    }'
