  trans: "\n在使用 CSS 之前，你首先需要感受 React 输出的 HTML 看起来会什么样。你可以通过查看 `render` 方法内部定义的 JSX\
    \ 轻松地弄清楚这一点。父级 `render` 方法是我们基于 `ReactDOM` 的那个，它如下所示：\n\n```html\n<div>\n  <Letter>A</Letter>\n\
    \  <Letter>E</Letter>\n  <Letter>I</Letter>\n  <Letter>O</Letter>\n  <Letter>U</Letter>\n\
    </div>\n```\n\n我们将各种 `Letter` 组件包裹在一个 `div` 标签中。这里没有什么特别的。我们 `Letter` 组件内部的 `render`\
    \ 方法也没有多大区别：\n\n```html\n<div>\n  {this.props.children}\n</div>\n```\n\n如你所见，每个单独的元音都被包裹在自己的\
    \ `div` 标签中。如果你必须运行这一切（例如，在浏览器中预览我们的示例），我们元音的最终 DOM 结构看起来图 4-3。\n\n![Image](img/image0024.jpeg)\n\
    \n图 4-3 浏览器内部的预览。\n\n忽略容器 `div` 上的 `data-reactroot` 属性（取决于你的 React 版本，你可能根本看不到它！），但注意你看到的其他内容。我们得到的只是几刻在\
    \ `render` 方法中看到的各种 JSX 片段的 HTML 化扩展，元音嵌套在一堆 `div` 元素中。\n\n## 直接样式化吧！\n\n一旦你理解了想要样式化的\
    \ HTML 布局，困难的部分就完成了。现在到了有趣且熟悉的阶段：定义样式选择器并指定你想设置的属性。为了影响我们的内部 `div` 元素，请在我们的 `style`\
    \ 标签内添加内容：\n\n```css\ndiv div div {\n  padding: 10px;\n  margin: 10px;\n  background-color:\
    \ #ffde00;\n  color: #333;\n  display: inline-block;\n  font-family: monospace;\n\
    \  font-size: 32px;\n  text-align: center;\n}\n```\n\n`div div div` 选择器将确保我们样式化了正确的元素。最终结果是我们的元音样式化后看起来与我们之前看到的一模一样。尽管如此，`div\
    \ div div` 样式选择器看起来有点奇怪，不是吗？它太通用了。在具有三个以上嵌套 `div` 元素的应用中（这非常常见），你可能会样式化错误的内容。在某些时刻，你会希望更改\
    \ React 生成的 HTML，以便我们的内容更容易被样式化。\n\n我们将解决这个问题的方法是给我们的内部 `div` 元素赋予 `letter` 类的值。这就是\
    \ JSX 不同于 HTML 的地方。进行以下突出修改：\n\n点击查看代码图片\n\n```javascript\nvar Letter = React.createClass({\n\
    \  render: function() {\n    return (\n      <div className=\"letter\"> \n   \
    \     {this.props.children}\n      </div>\n    );\n  }\n});\n```\n\n注意，我们通过使用\
    \ `className` 属性而不是 `class` 属性来指定类值。这是因为 `class` 是 JavaScript 中的一个特殊关键字。如果你觉得这为什么很重要，先不用担心。我们稍后会介绍。\n\
    \n无论如何，一旦你给 `div` 赋予了 `className` 属性值 `letter`，就只剩下最后一件事。修改 CSS 选择器以更干净地定位我们的\
    \ `div` 元素：\n\n```css\n.letter {\n  padding: 10px;\n  margin: 10px;\n  background-color:\
    \ #ffde00;\n  color: #333;\n  display: inline-block;\n  font-family: monospace;\n\
    \  font-size: 32px;\n  text-align: center;\n}\n```\n\n如你所见，使用 CSS 是样式化基于 React\
    \ 的应用内容的完全可行的方法。在下一节中，我们将查看如何使用 React 推荐的方法来样式化内容。\n\n## 以 React 方式样式化内容\n\nReact\
    \ 倾向于使用内联方法来处理不使用 CSS 内容。虽然初初看起来有点奇怪，但它的设计目的是帮助让你的视觉效果更具复用性。目标是让你的组件变成小黑盒，所有与\
    \ UI 观和工作方式相关的内容都存储在那里。让我们亲眼来看看。\n\n继续我们之前的示例，移除 `.letter` 样式规则。一旦完成此操作，当你在浏览器中预览应用时，元音将回到未样式化的状态。为了完整起见，你应该从\
    \ `Letter` 组件的 `render` 函数中移除 `className` 声明。保留我们不会使用的标记是没有意义的。现在，`Letter` 回到了原始状态：\n\
    \n点击查看代码图片\n\n```javascript\nvar Letter = React.createClass({\n  render: function()\
    \ {\n    return (\n      <div>\n        {this.props.children}\n      </div>\n\
    \    );\n  }\n});\n```\n\n你在组件内部指定样式的方法是定义一个对象，其内容是样式属性。一旦你给 `div` 赋予了 `className`\
    \ 属性值 `letter`，就还有一件事要做。修改 CSS 选择器以更干净地定位我们的 `div` 元素：\n\n```css\n.letter {\n\
    \  padding: 10px;\n  margin: 10px;\n  background-color: #ffde00;\n  color: #333;\n\
    \  display: inline-block;\n  font-family: monospace;\n  font-size: 32px;\n  text-align:\
    \ center;\n}\n```\n\n如你所见，使用 CSS 是样式化基于 React 的应用内容的完全可行的方法。在下一节中，我们将查看如何使用 React\
    \ 推荐的方法来样式化内容。\n\n## 以 React 方式样式化内容\n\nReact 倾向于使用内联方法来处理不使用 CSS 内容。虽然初看起来看起来有点奇怪，但它的设计目的是帮助让你的视觉效果更具复用性。目标是让你的组件变成小黑盒，所有与\
    \ UI 观和工作方式相关的内容都存储在那里。让我们亲眼来看看。\n\n继续我们之前的示例，移除 `.letter` 样式规则。一旦完成此操作，当你在浏览器中预览应用时，元音将回到未样式化的状态。为了完整起见，你应该从\
    \ `Letter` 组件的 `render` 函数中移除 `className` 声明。保留我们不会使用的标记是没有意义的。现在，`Letter` 回到了原始状态：\n\
    \n点击查看代码图片\n\n```javascript\nvar Letter = React.createClass({\n  render: function()\
    \ {\n    return (\n      <div>\n        {this.props.children}\n      </div>\n\
    \    );\n  }\n});\n```\n\n你在组件内部指定样式的方法是定义一个对象，其内容是样式属性。一旦你给 `div` 赋予了 `className`\
    \ 属性值 `letter`，就还有一件事要做。修改 CSS 选择器以更干净地定位我们的 `div` 元素：\n\n```css\n.letter {\n\
    \  padding: 10px;\n  margin: 10px;\n  background-color: #ffde00;\n  color: #333;\n\
    \  display: inline-block;\n  font-family: monospace;\n  font-size: 32px;\n  text-align:\
    \ center;\n}\n```\n\n### 创建样式对象\n\n让我们直接开始，定义包含我们想要样式的样式对象：\n\n点击查看代码图片\n\n```javascript\n\
    var Letter = React.createClass({\n  render: function() {\n    var letterStyle\
    \ = {\n      padding: 10,\n      margin: 10,\n      backgroundColor: \"#ffde00\"\
    ,\n      color: \"#333\",\n      display: \"inline-block\",\n      fontFamily:\
    \ \"monospace\",\n      fontSize: \"32\",\n      textAlign: \"center\"\n    };\n\
    \    return (\n      <div>\n        {this.props.children}\n      </div>\n    );\n\
    \  }\n});\n```\n\n我们有一个名为 `letterStyle` 的对象，其内部属性只是 CSS 属性名及其值。如果你以前没有在 JavaScript\
    \ 中定义过 CSS 属性（例如通过设置 `object.style`），将它们转换为 JavaScript 格式非常简单：\n\n![Image](img/image0026.jpeg)\
    \ 单单词 CSS 属性（如 `padding`, `margin`, `color`）保持不变。\n\n![Image](img/image0026.jpeg)\
    \ 带有连字符的多单词 CSS 属性（如 `background-color`, `font-family`, `border-radius`）被转换为驼峰命名单词，删除连字符并将连字符后的单词大写。例如，使用我们的示例属性，`background-color`\
    \ 将变为 `backgroundColor`，`font-family` 将变为 `fontFamily`，`border-radius` 将变为 `borderRadius`。\n\
    \n我们的 `letterStyle` 对象及其属性几乎是我们之前看到的 `.letter` 样式规则的直接 JavaScript 翻译。现在只需要将此对象分配给我们要样式化的元素。\n\
    \n### 实际样式化我们的内容\n\n现在有了包含了所需样式的对象，剩下的部分非常简单。找到我们要样式化的元素，并将 `style` 属性指向该对象。在我们的案例中，这将\
    \ `Letter` 组件 `render` 函数返回的 `div` 元素。\n\n查看突出显示的行，了解我们的示例是如何做的：\n\n点击查看代码图片\n\
    \n```javascript\nvar Letter = React.createClass({\n  render: function() {\n  \
    \  var letterStyle = {\n      padding: 10,\n      margin: 10,\n      backgroundColor:\
    \ \"#ffde00\",\n      color: \"#333\",\n      display: \"inline-block\",\n   \
    \   fontFamily: \"monospace\",\n      fontSize: \"32\",\n      textAlign: \"center\"\
    \n    };\n    return (\n      <div style={letterStyle}>\n        {this.props.children}\n\
    \      </div>\n    );\n  }\n});\n```\n"
- fmt: "\nOur object is called `letterStyle`, so that is what we specify inside the\
    \ curly brackets to let React know to evaluate the expression. That’s all there\
    \ is to it. Go ahead and run the example in the browser to ensure everything works\
    \ properly and all of our vowels are properly styled.\n\nFor some extra validation,\
    \ if you inspect the styling applied to one of the vowels using your browser developer\
    \ tool of choice, you’ll see that the styles are infact applied inline (see [Figure\
    \ 4-4](#part0011.xhtml_ch04fig04)).\n\n![Image](Images/image00247.jpeg)\n\nFigure\
    \ 4-4 The styles are applied inline.\n\nWhile this is no surprise, it might be\
    \ difficult for those of us used to styles being inside style rules to swallow.\
    \ As they say, the Times They Are A Changin’ ([https://www.youtube.com/watch?v=e7qQ6_RV4VQ](https://www.youtube.com/watch?v=e7qQ6_RV4VQ)).\n\
    \n### You Can Omit the “px” Suffix\n\nWhen programmatically setting styles, it’s\
    \ a pain to deal with numbers that need a pixel value suffix. In order to generate\
    \ these values, you need to do some string concatenation on your number to add\
