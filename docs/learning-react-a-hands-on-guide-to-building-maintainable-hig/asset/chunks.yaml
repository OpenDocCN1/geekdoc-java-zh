  trans: "\n\n如果你觉得上一部分已经够棘手了，等看到我们这里的内容吧。并不是所有的 DOM 事件都有对应的 `SyntheticEvent`。看起来你似乎只需要在\
    \ JSX 中内联指定事件时，加上 `on` 前缀并大字母大写你正在监听的事件名称即可：\n\n点击此处查看代码图片\n\n```javascript\n\
    var Something = React.createClass({\n  handleMyEvent: function(e) {\n    // do\
    \ something\n  },\n  render: function() {\n      return (\n        <div onMyWeirdEvent={this.handleMyEvent}>Hello!</div>\n\
    \      );\n    }\n});\n```\n\n事实并非这样运行的！对于那些 React 官方未识别的事件，你必须使用传统的 `addEventListener`\
    \ 方法，并且需要处理一些额外的额外步骤。\n\n请看下面这部分代码：\n\n点击此处查看代码图片\n\n```javascript\nvar Something\
    \ = React.createClass({\n  handleMyEvent: function(e) {\n    // do something\n\
    \  },\n  componentDidMount: function() {\n    window.addEventListener(\"someEvent\"\
    , this.handleMyEvent);\n  },\n  componentWillUnmount: function() {\n    window.removeEventListener(\"\
    someEvent\", this.handleMyEvent);\n  },\n  render: function() {\n      return\
    \ (\n        <<div>Hello!</div>\n      );\n    }\n});\n```\n\n我们有一个名为 `Something`\
    \ 组件，它监听一个名为 `someEvent` 的事件。我们在 `componentDidMount` 方法中开始监听该事件，该方法会在组件渲染时被自动调用。我们监听事件的方式是使用\
    \ `addEventListener` 并指定事件本身以及要调用的事件处理器：\n\n点击此处查看代码图片\n\n```javascript\nvar Something\
    \ = React.createClass({\n  handleMyEvent: function(e) {\n    // do something\n\
    \  },\n  componentDidMount: function() {                           \n    window.addEventListener(\"\
    someEvent\", this.handleMyEvent); \n  },                                     \
    \                           \n  componentWillUnmount: function() {\n    window.removeEventListener(\"\
    someEvent\", this.handleMyEvent);\n  },\n  render: function() {\n      return\
    \ (\n        <<div>Hello!</div>\n      );\n    }\n});\n```\n\n这应该非常直观。你唯一需要记住的另一件事是在组件即将被销毁时移除事件监听器。要做到这一点，你可以使用\
    \ `componentDidMount` 方法的反向方法 `componentWillUnmount` 方法。在该方法内部放置你的 `removeEventListener`\
    \ 调用，以确保在组件消失后不会留下任何事件监听的痕迹。\n\n#### 事件处理器内部 `this` 的含义\n\n在 React 中处理事件时，事件处理器内部\
    \ `this` 的值与你通常在非 React DOM 世界中看到的不同。在非 React 世界中，事件处理器内部 `this` 的值指向事件所监听的那个元素：\n\
    \n点击此处查看代码图片\n\n```javascript\nfunction doSomething(e) {\n  console.log(this);\
    \ //button element\n}\n\nvar foo = document.querySelector(\"button\");\nfoo.addEventListener(\"\
    click\", doSomething, false);\n```\n\n在 React 世界中（当你的组件使用 `React.createClass`\
    \ 创建时），事件处理器内部 `this` 的值始终指向*事件处理器所在的组件*：\n\n点击此处查看代码图片\n\n```javascript\nvar\
    \ CounterParent = React.createClass({\n  getInitialState: function() {\n    return\
    \ {\n      count: 0\n    };\n  },\n  increase: function(e) {\n    console.log(this);\
    \ // CounterParent component\n    this.setState({\n      count: this.state.count\
    \ + 1\n    });\n  },\n  render: function() {\n      return (\n        <div>\n\
    \          <Counter display={this.state.count}/>\n          <button onClick={this.increase}>+</button>\n\
    \        </div>\n      );\n    }\n});\n```\n\n"
- fmt: "\nLifecycle methods are not very complicated. We can think of them as glorified\
    \ event handlers that get called at various points in a component’s life, and\
    \ just like event handlers, you can write some code to do things at those various\
    \ points. Before we go further, it is time for you to quickly meet our lifecycle\
    \ methods. They are:\n\n![Image](Images/image00226.jpeg) `componentWillMount`\n\
    \n![Image](Images/image00226.jpeg) `componentDidMount`\n\n![Image](Images/image00226.jpeg)\
    \ `componentWillUnmount`\n\n![Image](Images/image00226.jpeg) `componentWillUpdate`\n\
    \n![Image](Images/image00226.jpeg) `componentDidUpdate`\n\n![Image](Images/image00226.jpeg)\
    \ `shouldComponentUpdate`\n\n![Image](Images/image00226.jpeg) `componentWillReceiveProps`\n\
    \nWe aren’t quite done yet. There are three more methods that we are going to\
    \ throw into the mix even though they aren’t strictly lifecycle methods, and they\
    \ are:\n\n![Image](Images/image00226.jpeg) `getInitialState`\n\n![Image](Images/image00226.jpeg)\
    \ `getDefaultProps`\n\n![Image](Images/image00226.jpeg) `render`\n\nSome of these\
    \ names probably sound familiar to you, and some you are probably seeing for the\
    \ first time. Don’t worry. By the end of all this, you’ll be on a first name basis\
    \ with all of them! What we are going to do is look at these lifecycle methods\
    \ from various angles—starting with some code!\n\n### See the Lifecycle Methods\
    \ in Action\n\nLearning about these lifecycle methods is about as exciting as\
    \ memorizing names for foreign places (or distant star systems!) you have no plans\
    \ to visit. To help make all of this more bearable, I am going to first have you\
    \ play with them through a simple example before we get all academic and read\
    \ about them.\n\nTo play with this example, go to the following URL: [https://www.kirupa.com/react/lifecycle_example.htm](https://www.kirupa.com/react/lifecycle_example.htm)\
    \ Once this page loads, you’ll see a variation of the counter example we saw earlier\
    \ (see [Figure 11-1](#part0018.xhtml_ch11fig01)).\n\n![Image](Images/image00277.jpeg)\n\
    \nFigure 11-1 A variation on the counter example.\n\nDon’t click on the button\
    \ or anything just yet. If you have already clicked on the button, just refresh\
    \ the page to start the example from the beginning. There is a reason why I am\
    \ saying that, and it isn’t because my OCD is acting up :P We want to see this\
    \ page as it is before we interact with it!\n\nNow, bring up your browser’s developer\
    \ tools and take a look at the Console Console tab. In Chrome, you’ll see something\
    \ that looks like [Figure 11-2](#part0018.xhtml_ch11fig02).\n\n![Image](Images/image00278.jpeg)\n\
    \nFigure 11-2 The Console view in Chrome.\n\nNotice what you see printed. You\
    \ will see some messages, and these messages start out with the name of what looks\
    \ like a lifecycle method. If you click on the plus button once, notice that your\
    \ Console will show more lifecycle methods getting called (see [Figure 11-3](#part0018.xhtml_ch11fig03)).\n\
    \n![Image](Images/image00279.jpeg)\n\nFigure 11-3 More lifecycle methods getting\
    \ called.\n\nPlay with this example for a bit. What this example does is allow\
    \ you to place all of these lifecycle methods in the context of a component that\
    \ we’ve already seen earlier. As you keep hitting the plus button, more lifecycle\
    \ method entries will show up. Eventually, once your counter approaches a value\
    \ of 5, your example will just disappear with the following entry showing up in\
    \ your console: `componentWillUnmount: Component is about to be removed from the\
    \ DOM!` At this point, you have reached the end of this example. Of course, to\
    \ start over, you can just refresh the page!\n\nNow that you’ve seen the example,\
    \ let’s take a quick look at the component that is responsible for all of this:\n\
    \n[Click here to view code image](#part0037.xhtml_p126pro01)\n\n```javascript\n\
    var CounterParent = React.createClass({\n  getDefaultProps: function(){\n    console.log(\"\
    getDefaultProps: Default prop time!\");\n    return {};\n  },\n  getInitialState:\
    \ function() {\n    console.log(\"getInitialState: Default state time!\");\n \
    \   return {\n      count: 0\n    };\n  },\n  increase: function() {\n    this.setState({\n\
    \      count: this.state.count + 1\n    });\n  },\n  componentWillUpdate: function(newProps,\
    \ newState) {\n      console.log(\"componentWillUpdate: Component is about to\
    \ update!\");\n  },\n  componentDidUpdate: function(currentProps, currentState)\
    \ {\n    console.log(\"componentDidUpdate: Component updated!\");\n  },\n  componentWillMount:\
    \ function() {\n    console.log(\"componentWillMount: Component is about to mount!\"\
    );\n  },\n  componentDidMount: function() {\n    console.log(\"componentDidMount:\
    \ Component mounted!\");\n  },\n  componentWillUnmount: function() {\n    console.log(\"\
    componentWillUnmount: Component is about to be removed from the DOM!\");\n  },\n\
    \  shouldComponentUpdate: function(newProps, newState) {\n    console.log(\"shouldComponentUpdate:\
    \ Should update?\");\n    if (newState.count < 5) {\n      console.log(\"shouldComponentUpdate:\
    \ Component should update!\");\n      return true;\n    } else {\n      ReactDOM.unmountComponentAt(destination);\n\
    \      console.log(\"shouldComponentUpdate: Component should not update!\");\n\
    \      return false;\n    }\n  },\n  componentWillReceiveProps: function(newProps){\n\
    \    console.log(\"componentWillReceiveProps: Component will get new props!\"\
    );\n  },\n  render: function() {\n    var backgroundStyle = {\n      padding:\
    \ 50,\n      border: \"#333 2px dotted\",\n      width: 250,\n      height: 100,\n\
    \      borderRadius: 10,\n      textAlign: \"center\"\n    };\n    return (\n\
    \      <div style={backgroundStyle}>\n        <Counter display={this.state.count}/>\n\
    \        <button onClick={this.increase}>\n          +\n        </button>\n  \
    \    </div>\n    );\n  }\n});\n```\n\nTake a few moments to look what all of this\
    \ code does. It seems lengthy, but a bulk of it is just each lifecycle method\
    \ listed with a `console.log` statement defined. Once you’ve gone through this\
    \ code, play with the example one more time. Trust me. The more time you spend\
    \ in the example and figure out what is going on, the more fun you are going to\
    \ have. The following sections where we look at each lifecycle method across the\
    \ rendering, updating, and unmounting phases is going to be dreadfully boring.\
    \ Don’t say I didn’t warn you.\n\n### The Initial Rendering Phase\n\nWhen your\
    \ component is about to start its life and make its way to the DOM, the following\
    \ lifecycle methods get called (see [Figure 11-4](#part0018.xhtml_ch11fig04)).\n\
    \n![Image](Images/image00280.jpeg)\n\nFigure 11-4 The lifecycle methods called\
    \ initially.\n\nWhat you saw in your console when the example was loaded was a\
    \ less colorful version of what you saw here. Now, we are going to go a bit further\
    \ and learn more about what each of these lifecycle methods do.\n\n#### `getDefaultProps`\n\
    \nThis method allows you to specify the default value of `this.props`. It gets\
    \ called before your component is even created or any props from parents are passed\
    \ in.\n\n#### `getInitialState`\n\nThis method allows you to specify the default\
    \ value of `this.state` before your component is created. Just like `getDefaultProps`,\
    \ it too gets called before your component is created.\n\n#### `componentWillMount`\n\
    \nThis is the last method that gets called before your component gets rendered\
    \ to the DOM. There is an important thing to note here. If you were to call `setState`\
    \ inside this method, your component will not re-render (aka have the `render`\
    \ method get called and update what gets displayed on screen).\n\n#### `render`\n\
    \nThis one should be very familiar to you by now. Every component must have this\
    \ method defined, and it is responsible for returning a single root node (which\
    \ may have many child nodes inside it). If you don’t wish to render anything (for\
    \ some fancy optimization you might be going for), simply return `null` or `false`.\n"
  raw: 'Lifecycle methods are not very complicated. We can think of them as glorified
    event handlers that get called at various points in a component’s life, and just
    like event handlers, you can write some code to do things at those various points.
    Before we go further, it is time for you to quickly meet our lifecycle methods.
    They are:


    ![Image](Images/image00226.jpeg) `componentWillMount`


    ![Image](Images/image00226.jpeg) `componentDidMount`


    ![Image](Images/image00226.jpeg) `componentWillUnmount`


    ![Image](Images/image00226.jpeg) `componentWillUpdate`


    ![Image](Images/image00226.jpeg) `componentDidUpdate`


    ![Image](Images/image00226.jpeg) `shouldComponentUpdate`


    ![Image](Images/image00226.jpeg) `componentWillReceiveProps`


    We aren’t quite done yet. There are three more methods that we are going to throw
    into the mix even though they aren’t strictly lifecycle methods, and they are:


    ![Image](Images/image00226.jpeg) `getInitialState`


    ![Image](Images/image00226.jpeg) `getDefaultProps`


    ![Image](Images/image00226.jpeg) `render`


    Some of these names probably sound familiar to you, and some you are probably
    seeing for the first time. Don’t worry. By the end of all this, you’ll be on a
    first name basis with all of them! What we are going to do is look at these lifecycle
    methods from various angles—starting with some code!


    #### See the Lifecycle Methods in Action


    Learning about these lifecycle methods is about as exciting as memorizing names
    for foreign places (or distant star systems!) you have no plans to visit. To help
    make all of this more bearable, I am going to first have you play with them through
    a simple example before we get all academic and read about them.


    To play with this example, go to the following URL: [https://www.kirupa.com/react/lifecycle_example.htm](https://www.kirupa.com/react/lifecycle_example.htm)
    Once this page loads, you’ll see a variation of the counter example we saw earlier
    (see [Figure 11-1](#part0018.xhtml_ch11fig01)).


    ![Image](Images/image00277.jpeg)


    Figure 11-1 A variation on the counter example.


    *Don’t click on the button or anything just yet*. If you have already clicked
    on the button, just refresh the page to start the example from the beginning.
    There is a reason why I am saying that, and it isn’t because my OCD is acting
    up :P We want to see this page as it is before we interact with it!


    Now, bring up your browser’s developer tools and take a look at the Console tab.
    In Chrome, you’ll see something that looks like [Figure 11-2](#part0018.xhtml_ch11fig02).


    ![Image](Images/image00278.jpeg)


    Figure 11-2 The Console view in Chrome.


    Notice what you see printed. You will see some messages, and these messages start
    out with the name of what looks like a lifecycle method. If you click on the plus
    button once, notice that your Console will show more lifecycle methods getting
    called (see [Figure 11-3](#part0018.xhtml_ch11fig03)).


    ![Image](Images/image00279.jpeg)


    Figure 11-3 More lifecycle methods getting called.


    Play with this example for a bit. What this example does is allow you to place
    all of these lifecycle methods in the context of a component that we’ve already
    seen earlier. As you keep hitting the plus button, more lifecycle method entries
    will show up. Eventually, once your counter approaches a value of 5, your example
    will just disappear with the following entry showing up in your console: `componentWillUnmount:
    Component is about to be removed from the DOM!` At this point, you have reached
    the end of this example. Of course, to start over, you can just refresh the page!


    Now that you’ve seen the example, let’s take a quick look at the component that
    is responsible for all of this:


    [Click here to view code image](#part0037.xhtml_p126pro01)


    var CounterParent = React.createClass({


      getDefaultProps: function(){


        console.log("getDefaultProps: Default prop time!");


        return {};


      },


      getInitialState: function() {


        console.log("getInitialState: Default state time!");


        return {


          count: 0


        };


      },


      increase: function() {


        this.setState({


          count: this.state.count + 1


        });


      },


      componentWillUpdate: function(newProps, newState) {


          console.log("componentWillUpdate: Component is about to update!");


      },


      componentDidUpdate: function(currentProps, currentState) {


          console.log("componentDidUpdate: Component just updated!");


      },


      componentWillMount: function() {


          console.log("componentWillMount: Component is about to mount!");


      },


      componentDidMount: function() {


          console.log("componentDidMount: Component just mounted!");


      },


      componentWillUnmount: function() {


          console.log("componentWillUnmount: Component is about to be removed from
    the


    DOM!");


      },


      shouldComponentUpdate: function(newProps, newState) {


        console.log("shouldComponentUpdate: Should component update?");


        if (newState.count < 5) {


          console.log("shouldComponentUpdate: Component should update!");


          return true;


        } else {


          ReactDOM.unmountComponentAtNode(destination);


          console.log("shouldComponentUpdate: Component should not update!");


          return false;


        }


      },


      componentWillReceiveProps: function(newProps){


        console.log("componentWillReceiveProps: Component will get new props!");


      },


      render: function() {


          var backgroundStyle = {


            padding: 50,


            border: "#333 2px dotted",


            width: 250,


            height: 100,


            borderRadius: 10,


            textAlign: "center"


          };


          return (


            <div style={backgroundStyle}>


              <Counter display={this.state.count}/>


              <button onClick={this.increase}>


                +


              </button>


            </div>


          );


        }


    });


    Take a few moments to look what all of this code does. It seems lengthy, but a
    bulk of it is just each lifecycle method listed with a `console.log` statement
    defined. Once you’ve gone through this code, play with the example one more time.
    Trust me. *The more time you spend in the example and figure out what is going
    on, the more fun you are going to have*. The following sections where we look
    at each lifecycle method across the rendering, updating, and unmounting phases
    is going to be dreadfully boring. Don’t say I didn’t warn you.


    #### The Initial Rendering Phase


    When your component is about to start its life and make its way to the DOM, the
    following lifecycle methods get called (see [Figure 11-4](#part0018.xhtml_ch11fig04)).


    ![Image](Images/image00280.jpeg)


    Figure 11-4 The lifecycle methods called initially.


    What you saw in your console when the example was loaded was a less colorful version
    of what you saw here. Now, we are going to go a bit further and learn more about
    what each of these lifecycle methods do.


    ##### `getDefaultProps`


    This method allows you to specify the default value of `this.props`. It gets called
    before your component is even created or any props from parents are passed in.


    ##### `getInitialState`


    This method allows you to specify the default value of `this.state` before your
    component is created. Just like `getDefaultProps`, it too gets called before your
    component is created.


    ##### `componentWillMount`


    This is the last method that gets called before your component gets rendered to
    the DOM. There is an important thing to note here. If you were to call `setState`
    inside this method, your component will not re-render (aka have the `render` method
    get called and update what gets displayed on screen).


    ##### `render`


    This one should be very familiar to you by now. Every component must have this
    method defined, and it is responsible for returning a single root node (which
    may have many child nodes inside it). If you don’t wish to render anything (for
    some fancy optimization you might be going for), simply return **null** or **false**.


    ##### `componentDidMount`'
