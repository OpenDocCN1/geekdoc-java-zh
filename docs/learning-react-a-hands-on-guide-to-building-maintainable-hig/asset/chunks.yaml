    \ 清空 `input` 元素的内容。我们通过调用 `this._input.focus()` 为 `input` 元素设置焦点。我们所有的 `ref` 相关工作仅仅是为了通过这两行代码让\
    \ `this._input` 指向我们在 JSX 中定义的 HTML 元素。\n\n### 使用 ES6 箭头函数进一步简化\n\n学习 React 已经足够困难了，所以我尽量避免强制你默认使用\
    \ ES6 技术。在处理 `ref` 属性时，使用箭头函数来处理回调函数确实简化了问题。这是我建议使用 ES6 技术的情况之一。\n\n正如你几分钟前看到的，为了将我们组件上的属性赋值给引用的\
    \ HTML 元素，我们做了如下操作：\n\n点击此处查看代码图片\n\n```javascript\n<input\n  ref={\n    function(el)\
