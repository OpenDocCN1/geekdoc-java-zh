    Nicolas Cage\"/>\n    <HelloWorld greetTarget=\"Mega Man\"/>\n    <HelloWorld\
    \ greetTarget=\"Bono\"/>\n    <HelloWorld greetTarget=\"Catwoman\"/>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\n我们的每个 `HelloWorld` 调用现在都带有\
    \ `greetTarget` 属性，以及我们想要问候的英雄（或相应的神话生物！）的名字。如果你在浏览器中预览此示例，你会看到这些问候快乐地打印在屏幕上。\n\
    \n在我们继续之前，最后一点一点要说明的是：你并不限制组件只能有一个属性。你可以拥有任意数量的属性，你的 `props` 属性将轻松地应对任何属性请求而不会产生任何麻烦。\n\
    \n#### 处理子元素\n\n"
- fmt: "A few sections ago, I mentioned that our components (in JSX) are very similar\
    \ to regular HTML elements. We saw that for ourselves when we wrapped a component\
    \ inside a `div` element or specified an attribute and value as part of specifying\
    \ properties. There is one more thing you can do with components just like you\
    \ can with many HTML elements. `Your components can have children`.\n\nWhat this\
    \ means is that you can do something like this:\n\n```jsx\n<CleverComponent foo=\"\
    bar\">\n  <p>Something!</p>\n</CleverComponent>\n```\n\nYou have a component very\
    \ cleverly called `CleverComponent`, and it has a `p` element as a child.. from\
    \ within `CleverComponent`, you have the capability to access the `p` child element\
    \ (and any children it may have) via the `children` property accessed by `this.props.children`.\n\
    \nTo make sense of all this, let’s fiddle with another really simple example.\
    \ This time around, we have a component called `Buttonify` that wraps its children\
    \ inside a button. The component looks like this:\n\n[Click here to view code\
    \ image](#part0029.xhtml_p035pro01)\n\n```javascript\nvar Buttonify = React.createClass({\n\
    \  render: function() {\n    return (\n      <div>\n        <button type={this.props.behavior}>{this.props.children}</button>\n\
    \      </div>\n    );\n  }\n});\n```\n\nThe way you can use this component is\
    \ by just calling it via the `ReactDOM.render` method as shown here:\n\n[Click\
    \ here to view code image](#part0029.xhtml_p035pro02)\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    <Buttonify behavior=\"Submit\">SEND DATA</Buttonify>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\nWhen this code runs, given\
    \ what the JSX in the `Buttonify` component’s render method looked like, what\
    \ you will see are the words `SEND DATA` wrapped inside a button element. With\
    \ the appropriate styling, the result could look comically large like in [Figure\
    \ 3-4](#part0010.xhtml_ch03fig04).\n\n![Image](Images/image0024.jpeg)\n\nFigure\
    \ 3-4 A large send data button.\n\nAnyway, getting back to the JSX, notice that\
    \ we specify a custom property called `behavior`. This property enables us to\
    \ specify the `button` element’s `type` attribute, and you can see us accessing\
    \ it via `this.props.behavior` in the component definition’s `render` method.\n\
    \nThere is more to accessing a component’s children than what we’ve seen here.\
    \ For example, if your child element is the root of a deeply nested structure,\
    \ the `this.props.children` property will return an array. If your child element\
    \ is just a single element (like in our example), the `this.props.children` property\
