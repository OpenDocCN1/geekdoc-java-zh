  md: '# Identifying Project Scope


    and any management stakeholders to provide feedback early. Getting a formal sign-off
    for the use cases in a particular project enables the project manager to contain
    project scope.


    # IDENTIFYING PROJECT SCOPE


    A high-level project definition and preliminary idea about scope is needed before
    use-case analysis and prototyping exercises are effective. Most developers are
    detail oriented and will consider this high-level definition too vague to be useful.
    Keep in mind that the purpose of this high-level project definition is only to
    determine scope for the use-case analysis (not for coding).


    Here is an example of a high-level project definition statement:


    +   - Build a system that assists project managers in planning tasks, tracking
    the activities of every team member, and estimating completion dates. The project-tracking
    application would allow the user to do the following:

    - Define a project and its tasks.

    - Record people assigned to project tasks and estimate the time needed to complete
    each task.

    - Record the order in which tasks will be completed.

    - Record project progress and mark tasks as completed.

    - Automatically schedule the project.

    - Create reports of project progress.


    As vague and simplistic as the statement is, it provides a starting point for
    identifying actors and constructing use cases.


    # IDENTIFYING THE ACTORS


    The first step in use-case analysis is to identify the actors. An actor is the
    user type or external system serviced or affected by the use case. Although the
    word actor has connotations of being an actual person, a UML actor can be an external
    system or an organization type or role.


    The following is a list of actors for a report generation application I architected:


    +   - Trust customer user

    - Trust customer organization

    - Banking support user

    - Report template developer

    - Document delivery application interface

    - Report template definition interface'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Chapter 2: Defining the Project


    +   - Data warehouse application interface

    - Report request application interface

    - Application administrator


    And here''s a list of actors for a cash-tracking application I architected:


    +   - Cash manager user

    - Transaction approver user

    - Senior transaction approver user

    - Banking support user

    - Fund accounting application interface

    - Application administrator


    You may have noticed that in each example I listed individual user groups as separate
    items because every user group has different capabilities. While some use cases
    apply to all types of end users, others are user-specific. In each example, we
    had far fewer types of end users when we started use-case analysis than when we
    had finished. During the course of writing the use cases, we began to realize
    that there were different user roles that required different capabilities.


    It is possible for a user to represent multiple actors. For example, a user who
    provides banking support may also assume the role of a cash manager or transaction
    approver.


    Consider the application administrator as an actor for any large application.
    This forces some attention to support—which increases availability and in turn
    makes other actors (who happen to be people) happy.


    Make sure that all actors are direct. Sometimes people are confused by the external
    interfaces and want to list actors the end users served by an external interface.
    For example, if a security-trading system is one of the external interfaces, you
    may be tempted to list traders as actors because they are serviced indirectly
