  md: '# SECTION IV


    # TESTING AND

    MAINTAINING

    JAVA EE

    APPLICATIONS


    Once work of building the application is finished, the technical architect is
    often asked to lead performance-testing activities and ensure that the application
    is production ready. At this stage, the architect''s primary objective is improving
    application performance, stability, and operational readiness. To achieve this
    goal, the architect needs to conduct performance tests and make performance improvements,
    recommend changes to make applications easier to monitor and support, and identify
    candidates for code refactoring.


    This section guides you through these activities. In it, you will learn how to:


    +   - Establish coding guidelines for functional test cases.

    - Conduct effective performance tests.

    - Effectively profile your application to improve its use of memory and CPU.

    - Improve supportability for your applications.

    - Recognize when code needs refactoring.

    - Adapt software architecture principles to new technologies.'
