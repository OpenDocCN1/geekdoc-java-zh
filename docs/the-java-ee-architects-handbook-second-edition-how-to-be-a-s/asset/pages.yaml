  md: 'Having identified the relevant entity classes, we can start modeling the data
    access layer. The feature requirements for persistence don''t specifically specify
    a storage mechanism. In fact, the only requirement is that the product remembers
    exception statistics between container cycles. While we might want to provide
    additional features down the road, display requirements don''t suggest any type
    of flexible search requirements regarding exception statistics. It appears that
    all we need to do is a mass read and write of exception statistics.


    Depending on how large the exception statistics turns out to be, reading and writing
    on a frequent basis might be material for some users. Given this, a decision was
    made to separate reading and writing activity from the activity logging of exceptions.
    That is, we made the decision to conduct the reading and writing activity in a
    thread separate from the threads running worker. We didn''t want to slow down
    user activity with the storage of exception statistics that would be used for
    later analysis.


    In addition, we wanted to keep resource consumption by Admin4J to a minimum. Rewriting
    exception statistics after every update would ensure that up-to-date statistics
    are current, but the resource consumption would be large in situations where large
    numbers of exceptions were being thrown. As a compromise, a decision was made
    to persist exception statistics on a configurable interval. That would allow users
    to effectively balance resource consumption with the need to persist current statistics.
    As a consequence of this decision, the data access layer only needs to read and
    write exception statistics en masse; there was no need for single read and write
    operations.


    With a software package as this, minimizing the dependency list is always a consideration.
    With that in mind, we decided to use XML as a storage mechanism for the first
    release and keep our options open for other storage mechanisms in the future.
    While this choice doesn''t offer the same flexibility as a relational database
    of some sort, it reduces dependencies for third-party database. It also reduces
    the install effort. Given that the decision has been made to support multiple
    storage mechanisms, a full data access object pattern is appropriate.


    Generally, a data access class is a factory for entity classes, and generally,
    there will be a one-to-one correspondence between entity classes and data access
    object interfaces. An object model for the data access layer for this feature
    can be found in 6.7.'
