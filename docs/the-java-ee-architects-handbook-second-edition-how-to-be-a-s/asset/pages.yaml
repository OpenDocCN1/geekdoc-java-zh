  md: '# Chapter 4: Designing External Application Interfaces


    application data. Rarely do reporting applications maintain the information needed
    for report content. It is more common for reporting applications to read data
    as required. It is also common that users want to reference data from an external
    application when using a feature of an application you''re building.


    Leveraging external functionality or publishing functionality for other applications
    are examples of the Don''t Repeat Yourself (DRY) principle. In fact, they only
    differ in perspective; every “external” application is an application that somebody
    supports and they look at your application as “external.” Often it is not cost
    effective or desirable to replicate functionality in that external application
    for a specific use in your application. For example, let''s say your application
    needs to initiate the recording of a customer charge. Nobody writes custom accounting
    applications these days. It''s more likely that your application needs to leverage
    a vested application to initiate that charge.


    **External interfaces create stability risk.** Outages in external applications
    can cause partial outages for the application you''re supporting. Furthermore,
    changes in external applications (e.g., product upgrades or product enhancements)
    can also force changes in the applications you support. Consequently, implementing
    interfaces in a way that mitigates or contains stability risk is usually a requirement.
    There are ways to mitigate these risks, and they will be discussed in this chapter.


    **External interfaces complicate development and support activities.** Development
    and support are impacted as problems require personnel outside the team to resolve.
    Furthermore, it is not always easy to determine which application owns a particular
    defect. You may investigate a reported defect only to discover that it''s really
    a defect in the external application and all you can do is report the issue to
    the team or vendor that supports that application. There are ways to reduce the
    complications external interfaces cause, and they will be discussed in this chapter.


    Application architects are typically responsible for ensuring that external interfaces
    are formally defined and documented so that developers from both applications
    have a basis for object-modeling activities (described in chapter 6). The application
    architects for both applications needs a basis for their modeling and implementation
    activities. Further, the project manager needs a contract between your development
    group and the external system developers that describes everyone''s responsibilities.


    The following aspects of external interfaces will be discussed with the external
    teams and agreed on among the teams:


    +   - Interface method selection (e.g., web services, messaging)

    - Published services or functions

    - Data content structure'
