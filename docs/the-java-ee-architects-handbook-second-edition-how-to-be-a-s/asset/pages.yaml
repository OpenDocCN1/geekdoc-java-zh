    # **EXAMPLE: ADMIN4J


    Admin4J(www.admin4j.net) is an open source product that provides basic Java EE
    application administration and support features for developers. One of its features
    is to track and summarize exceptions generated by applications so that ongoing
    issues can be easily identified and prioritized. In the interest of full disclosure,
    I''m a committer for the Admin4J project.


    A detailed description of this feature taken from the Admin4J project website
    is as follows: Admin4J tracks all exceptions and combines all "like" exceptions.
    Currently, exceptions logged with Log4J and JDK Logging are tracked. Additional
    loggers will be added as user demands dictate.


    +   - Display Features

    - Exceptions are sorted from the most frequent occurring to the least.

    - Exceptions are persisted and survive a container recycle.

    - Administrators can delete exceptions that they deem and no longer occurring.

    - The length of time covered by exception statistics is configurable (defaults
    to thirty days).


    In addition to these explicit requirements, there are a couple of implicit requirements
    to keep in mind. This feature needs to be easily installable. An install process
    that is difficult to understand or has a large number of steps is not likely to
    be used; most developers are very busy people. Secondly, the performance impact
    of this feature needs to be minimal. Ideally applications will throw exceptions
    rarely, but that isn''t always the case. Should this feature accidentally cause
    a material performance impact to end users, it would be promptly uninstalled.


    Although this feature set is not really written as use cases, it conveys'
