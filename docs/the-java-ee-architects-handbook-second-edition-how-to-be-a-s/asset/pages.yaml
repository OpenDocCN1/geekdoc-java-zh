  md: '# CHAPTER 9

    CODING VALUE OBJECTS AND ENTITIES


    Just as value objects (VO) and entities are similar in that they combine logical
    groups of data items into a single logical construct; the coding standards and
    guidance for them are similar in many ways. The largest difference between them
    is that entity classes have a map to a database table and are persisted, while
    VO classes are transient in nature. In the early days of Java EE, value objects
    were used to minimize network transmission between enterprise beans and their
    remote callers. The use of enterprise beans has declined—since in many applications
    it is an unnecessary complexity—this purpose for value object classes has been
    reduced.


    At first glance, my broader definition of a value object or entity class appears
    to contradict the principles of object-oriented design that principles would us
    combine with the business logic. Object orientation will have us think “employee”
    as an object that contains its data (e.g., last name, first name) and methods
    like add(), terminate(), and oppress() that represent business logic. For many
    practical considerations, such as reducing complexity, we need to have the option
    for referencing data outside the business logic context.


    Chapter 11 will show you ways of constructing objects in the business logic layer
    that adhere to object-oriented design principles and also allow you to reference
    the data portion of these objects as a value object. For example, the Employee
    class could easily provide a getEmployeeVO() accessor that provides the data for
    an employee without its business logic.'
