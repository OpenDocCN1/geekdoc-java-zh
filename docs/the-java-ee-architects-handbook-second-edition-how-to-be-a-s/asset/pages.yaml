  md: '# Chapter 1: Project Development Team and Project Life Cycle


    +   - Data modeler

    - Database administrator

    - Data migration specialist

    - Infrastructure specialist

    - Testing specialist

    - Test automation specialist


    Although the book focuses on the role of the application architect, this section
    defines the roles and responsibilities of other major players on the Java EE development
    team and describes the responsibilities of the application architect with respect
    to those roles.


    Some organizations use different labels for the roles. For instance, an infrastructure
    specialist may be called a system administrator; a testing specialist may be a
    tester; and some organizations distinguish between a test team manager and individual
    testers. Regardless of the terms you attach to these skill sets, making all of
    them part of a development team greatly increases the team''s chances of creating
    a successful Java EE project.


    Further, it''s possible for one person on the team to fill many roles and for
    one to be co-owned by multiple people if the project is large enough. Some organizations
    combine the roles of application architect and project manager. Some organizations
    have a senior developer double as a database administrator or as an infrastructure
    specialist. And some have the same developers work on the presentation tier as
    well as the business layer. Here I''m not trying to recommend a particular team
    organization but merely to communicate what skill sets are necessary, however
    they are organized.


    # Application Architect


    The application architect identifies the technologies that will be used for the
    project. In many organizations, some technology choices are made at an enterprise
    level. For instance, many organizations make hardware and operating system choices
    and software choices (e.g., the Java EE container vendor) at an enterprise level.
    Commonly, choosing a language, such as Java, is an enterprise-level decision.


    However, most applications have technical requirements that aren''t explicitly
    provided in enterprise-level edits. I make a distinction between technology choices
    made at an enterprise level and those made for individual applications. For example,
    a decision to use the Java language for all server-side programming might be made
    at an enterprise level, but a decision about which XML parser to use might be
    left to individual application architects. In many organizations, the people making
    enterprise-level technology choices make up a group separate from the Java EE
    development team.


    The application architect is commonly responsible for identifying'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Project Development Team: Roles and Responsibilities


    third-party packages or utilities that will be used for a project. For example,
    the architect might identify a need for a template-based engine and choose Apache’s
    Velocity.


    Increasing, organizations are differentiating between enterprise architects and
    application architects. Enterprise architects assist with deciding which software
    products will be purchased and which will be built. An effective enterprise architect
    ensures that software products in use are aligned with the business goals of the
    enterprise. Enterprise architecture is out of scope of this book; additional material
    on the role of enterprise architects can be found at the following URL: http://en.wikipedia.org/wiki/Enterprise_architect.


    The application architect recommends the development methodologies and frameworks
    of the project. Typically, the architect makes these recommendations to the project
    manager. For example, a common recommendation is to document all alliances in
    use-case format and supplement with a prototype. Another common recommendation
    is to document the design in terms of an object model. Some organizations define
    the methodologies used at an enterprise level.


    The application architect provides the overall design and structure of the application.
    Each developer brings to a project a unique set of preconceived opinions, habits,
    and preferences. Synthesizing the input of this sometimes divergent group, the
    application architect ensures that the work is done by individual developers.


    I like the role of application architect to that of an orchestra conductor. All
    musicians have differing opinions about how to interpret a given work. The conductor
    provides the interpretation that will be used and works with the musicians to
    implement it. Depending on the development methodology, for each feature may not
    occur upfront. In this case, it is the architect’s job to work with developers
    as feature development is occurring to assist with the design and ensure the implementation
    fits with the overall architecture.


    The application architect ensures that the project is adequately defined. A project
    analysis must be detailed and consistent enough to form the basis for building
    an application. Typically, the application architect works with the project manager
    and business analyst to define the project.


    The application architect ensures that the application design is adequately documented.
    Documenting the application design is a critical step in establishing sound communication
    with and among developers. The process of creating documentation forces the architect
    to think through issues. The final document enables management to add or change
    developers to the project without adversely affecting the architect’s time. For
    developers, documentation allows them to proceed if the application architect
    is absent'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Chapter 1: Project Development Team and Project Life Cycle


    from the project for a limited period, and it enables them to work through design
    inconsistencies without without consuming the time of other members of the development
    team. Documentation also helps to insulate the project against the effects of
    personnel turnover.


    Often, the size and scope of the project indicates how extensive the design documentation
    needs to be. For example, a project containing less than 1,000 hours of work using
    two developers will require much less documentation than a project containing
    100,000 hours of work requiring a fifty-person team. There is no objective rule
    that indicates an optimal amount for a given project.


    I''ve seen many projects that were not documented, and this mean that adding a
    developer was a major chore the architect had to verbally convey the design to
    the newcomer. Having to communicate the design verbally neglects some of the benefits
    of bringing on additional developers.


    It should be noted that there are tools that provide limited support for managing
    feature requests and work to fulfill those requests. Examples of such products
    are JIRA (https://www.atlassian.com/software/jira) and Mingle (https://www.thoughtworks.com/products/mingle-agile-project-management).
    Such tools are of great value for larger shops where history carries on certain
    changes is needed.


    The application architect establishes coding guidelines. Because individual developers
    have coding preferences, coding standards need to be articulated so that the individual
    pieces are more easily brought together. The application architect is responsible
    for establishing project procedures and guidelines for topics like the following
    (which are covered in more depth later in the book):


    +   - Exception handling

    - Logging

    - Testing

    - Threading

    - Caching

    - Configuration


    The application architect identifies implementation tasks for the project manager.
    This role is especially important for Java EE projects because they encompass
    a much wider range of technologies than do other types of systems projects. Out
    of practical necessity, the application architect also helps the project manager
    with project planning and estimates.


    It''s a good idea for application architects to at some point gaining small projects.
    This helps them understand typical project management challenges faced by the
    person in the project manager role, and this understanding will enable them to
    provide better support for the project managers they work under.'
