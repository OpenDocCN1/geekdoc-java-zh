  md: '# IDENTIFYING REFACTORING OPPORTUNITIES


    Refactoring is rewriting selected code to make it easier to understand and maintain.
    Fowler (2000) provides an extensive list of conditions that indicate the need
    to refactor—conditions he calls “Bad Smells in Code.” Although his list is so
    comprehensive I would not pressure you to add to it, it is very code centric.
    For readers who may not have the intimate understanding of code required to apply
    Fowler''s advice, I describe some observable symptoms that may indicate a need
    to refactor but not require a full audit of the application''s source.


    Classes that you can''t change without inadvertently creating bugs may need to
    be refactored. This symptom is reminiscent of the movie Night of the Living Dead.
    Some programming bugs do not die; they just come back in different forms. Various
    circumstances can cause a bug to undergo such a metamorphosis.


    Sometimes this happens when code within a class behaves differently, depending
    on context. For example, I had one client that used a central API to provide reports
    for multiple applications. For political reasons, the API interpreted some of
    the argument differently, depending on which application was called (not a good
    idea, I know). Eventually, this service needed to be refactored because we couldn''t
    change it without inadvertently causing bugs in some of the applications calling.


    Sometimes bugs morph when code within a single class is doing too much and should
    be separated into multiple classes. For example, one application 1 I worked on
    to be able to accept data from multiple data sources. At first, we had the data
    sources relational databases and some weren''t. We had only two data sources.
    The programmer took a shortcut and put conditional logic in the class managing
    input to handle each data source. When we had to add data sources, the class had
    to be refactored.


    Enhancements or bug fixes requiring identical changes in multiple classes may
    indicate a need to refactor. Some developers are almost too fond of copy-paste
    technology. In most cases, identical code in multiple classes should become common
    code “called” by multiple classes. Given a tight time frame, the developer who
    discovers a case of copied code might not have the time to make the code change.
    The architect or manager can assist by providing a mechanism to track these cases
    so they can be fixed when time permits.


    Abnormally complicated methods or classes that developers fear changing may need
    to be refactored. Sometimes this symptom occurs in combination with the morph-bug
    symptom described earlier. It is another indication that the code is too complex
    and needs to be refactored. Of course, the validity of this symptom depends on
    the assumption that developers are rational and their “fear” justified, which
    might not always be the case.'
