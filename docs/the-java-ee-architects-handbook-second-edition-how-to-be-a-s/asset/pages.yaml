  md: '# IMPROVING YOUR PROJECT PLANS AND ESTIMATES


    **Track your time.** It is important to track your time in such a way that you
    can easily map that time to specific tasks you''ve been given. If you lead other
    developers, have track their time as well. It is also important that you estimate
    the time it will take you to complete a task before you complete it and measure
    the time you spent doing it. The time you estimate will rarely equal the time
    that you spent. With this process, you''ll be able to begin understanding how
    close your estimates are to reality. Over time, you will notice the difference
    between your estimates and the time that you spend smaller.


    **Don''t discard estimates and time tracking records from past assignments and
    projects.** When you need estimates for future projects or assignments, it''s
    helpful to look at comparable assignments or projects that you have done in the
    past. This is similar to how real estate agents decide if the price of a property
    is too high or low; they look for recently sold properties similar to it and check
    their selling prices.


    **Have a colleague review your estimates.** Someone not involved with the project
    may easily see things that you have missed.


