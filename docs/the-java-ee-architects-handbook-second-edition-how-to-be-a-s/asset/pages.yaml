  md: '# Chapter 5: A Layered Approach to Java EE Design


    Object models are the most popular mechanism for documenting Java EE application
    designs. The application architect is typically responsible for facilitating creation
    of object models for the most complex portions of the application to be developed.
    For those using agile methodologies with very short iterations (e.g., two weeks
    per iteration), this is a short exercise at the start of the iteration.


    In addition to object models for the most complex portions of the development
    effort, I often have illustrations that describe major business process flows.
    We generally use swim-lane diagrams for this purpose. This chapter will provide
    a more in-depth description of these and a sample.


    EE application design is a vast topic. Entire books have been written about design
    techniques, design patterns, and object modeling with UML. And like large and
    complicated methodologies, UML is only partially applied in business applications.
    Thus, although I don''t want to discourage learning, I take a streamlined approach
    to the topic in this chapter. For instance, of the hundreds of design patterns
    that have been identified and cataloged, this chapter focuses on the handful of
    patterns most commonly used in business applications today.


    # OVERVIEW OF THE LAYERING CONCEPT


    A common framework for Java EE applications is software layering, in which each
    layer provides functionality for one section of the system. The layers are organized
    to provide support and base functionality for other layers. For example, the data
    access layer provides a set of services to read and write application data. An
    inventory management application needs services that can read information about
    specific items and warehouses.


    Layering is not a new concept; operating systems and network protocols have been
    using it for years. For instance, anyone who worked with networks is familiar
    with telnet, FTP, and Internet browsers. All these services depend on a TCP/IP
    networking layer. As long as the interface to TCP/IP services stays constant,
    you can make network advances within the TCP framework without affecting telnet,
    FTP, or your web-browsing capability. Typically, the TCP/IP layer requires the
    services of a device layer, which understands how to communicate with an Ethernet
    card.


    Business applications can make strategic use of the same concept. For example,
    it''s common to make data access a separate portion of an application in order
    to make easier to consolidate data access logic in multiple portions of an application.
    For instance, a customer lookup by ID might be used in several portions of an
    application. With data access separated and consolidated, existing code is easy
    to recognize and reuse. In addition, should your data access method change in
    some way (e.g., you switch your underlying database from MySQL to Oracle), the
    way the application'
