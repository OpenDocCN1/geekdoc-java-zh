  md: '# Catch Errors Earlier Rather Than Later


    Don''t use internal product classes that were not meant to be outside the product.
    This is an example of inappropriate usage. It is common for API products to have
    classes used internally that were never meant for published consumption. For example,
    the web service product Apache Axis has internal string manipulation classes used
    internally within the product. It is technically possible for you to utilize string
    manipulation classes and methods. However, they were never really meant to be
    exposed to users of the product. Those classes are public so that they can be
    used by several packages within the product and for no other. Your use of these
    internal classes might work for the current version of the product you''re using,
    but those internal classes are subject to change when you upgrade. As they were
    never meant to be consumed by users, little or no effort will be made to ensure
    that they work in the same way. In other words, your risk of introducing bugs
    during an upgrade increases if you have been using classes and methods that were
    never meant to be consumed. While published interfaces of products can change
    (e.g., Hibernate seems to change its publicly consumed APIs quite often), there
    is usually documentation provided for the change, with advice on how to modify
    your applications on upgrade. This assistance usually doesn''t exist with internal
    classes that were never intended for publication.


    # CATCH ERRORS EARLIER RATHER THAN LATER


    It is always better to catch coding errors as early in the development process
    as possible. By “better” we mean that errors earlier are cheaper to fix and usually
    cause less damage. If a bug is detected by end users, the bug at the very least
    negatively impacts end-productivity and consequently has a labor cost. Depending
    on the nature of the bug, the enterprise may incur other costs associated with
    the bug, such as inconvenient and potentially losing customers. Costs associated
    with tracking, documenting, and eventually fixing the bug are also present. On
    the other hand, had that bug detected before deployment to production, the bug
    would have cost development to fix, but potentially none of the other costs to
    the enterprise would have been incurred. The practices of Test Development (TDD)
    and Continuous Integration (CI) are based on this principle. If nobody notices
    the error before you fix it, did the error really occur?


    The recommended practice of checking arguments to all public or protected methods
    applies this principle. By catching and explicitly labeling the error, we save
    time fixing the bug. As you know, derivative errors are often harder and more
    time consuming to diagnose and fix. The recommended practice of trending towards
    runtime exceptions applies this principle by making it much easier and safer to
    throw and describe label errors without incurring the cost of verbose/catch logic.
    The recommended practice of providing an error notification method to support
    developers applies this principle by reporting the error before an end user does.


    ![](img/1f823903cd4bdc6fc65fc6c7a796ddc6_256_0.png)'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'A corollary to this principle is to adopt practices that prevent bugs in the
    first place. The practice of paired programming, in which all code is written
    by a team of two coders, is an example of applying this principle. The idea is
    that the observing coder will catch errors that the typing coder misses and thus
    prevents bugs. Tools such as PMD for Find Bugs can scan your code and highlight
    places in your code prone to causing types of defects, such as null pointer exceptions.


    Automated error reporting and notification of support personnel is essential.
    Users don''t report all errors. It takes work to fill out a help desk ticket or
    explain the problem to a technician in enough detail to reproduce. Often, if users
    can find a workaround, they''ll take the lazy way out and not report it. However,
    even though they don''t report the error, their perception of the software applications
    lowers. Consequently, automated error reporting is the only way you''ll get notified
    of some errors. Further, automated error reporting can give you a clearer vision
    of how frequently users encounter the error. In addition, automated reports will
    arrive more quickly, giving you the opportunity to resolve issues earlier.


    Code the most technically risky portions of a project first. Tasks that have the
    largest risk are generally those involving new or unfamiliar technologies or containing
    complex logic. Errors are more likely to be generated from these aspects of the
    project than any other. Consequently, coding these sections first tends to increase
    the amount of testing time sections receive and increases the chance that errors
    are caught before release.


    # FUNCTIONAL REQUIREMENTS ARE THE HIGHEST PRIORITY


    A functional requirement is a business need; it is something that your application
    must provide for its ends. A “need” is a feature essential to the operation of
    the business. Building applications that don''t meet business needs is pointless.
    Without a successful business side, there is no reason to sustain and fund applications
    and the architecture supporting them. The importance of identifying functional
    requirements can''t be understated. This is why I have spent entire chapters guiding
    you in how to identify and document these requirements. One way to document business
    needs is by use case, and there are certainly other methodologies. I list this
    as an architectural principle as I''ve seen developers sacrifice business requirements
    to preserve technical design ideals. If an architecture or technical design doesn''t
    support a new business requirement, it''s time to enhance or replace that design.
    We don''t get to selectively ignore business requirements simply because they
    are inconvenient to program or they introduce additional complexity. The complexity
    introduced by a new business requirement frequently adds to the cost of developing
    and maintaining the applications supporting that requirement. Once users'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'understand the costs of the requirements they express, they may express those
    needs differently.


    It’s true that sometimes end-user representatives don’t clearly understand what
    needs are or can’t express them effectively. Wordered another way, clients don’t
    initially say what they really mean. Sometimes, users confuse a “need” with a
    “want.” A “need” is a feature essential to the operation of the business. A “want”
    is something that optimizes one portion of that business, reduces manual labor
    for someone but isn''t essential to the operation of the business. For example,
    a user may “want” a new report detailing that information, the new report is a
    “want” (e.g., it makes gathering the information more convenient) but it is not
    a “need.” Ferret-out and documenting true business needs in detailed enough terms
    for software developers to implement is a separate and important skill.


    Nonfunctional requirements are requirements that specify the conditions under
    which the application is to operate, but don’t define specific behaviors like
    functional requirements do. As an example of nonfunctional requirements, an application
    may require the presence of the Microsoft Windows operating system with at least
    100MB of disk space and 2GB of memory. Another example of a nonfunctional requirement
    is to be accessible by the user over the Internet. These requirements do not state
    what the application is used for or even what business requirements are satisfied.
    Ideally, nonfunctional requirements should never disrupt satisfying business needs.'
