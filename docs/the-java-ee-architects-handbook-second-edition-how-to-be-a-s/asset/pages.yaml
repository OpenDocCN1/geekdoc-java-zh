    # ## APPLICATION FRAMEWORK CONSIDERATIONS


    Most architects leverage third-party frameworks to assist development for web
    services and user interfaces. Without such frameworks, the amount and complexity
    of code within these layers would be extremely high. Consequently, the largest
    deliverable for application architects with respect to these software layers is
    determining which frameworks will be.


    Some organizations make framework choices for these layers at an enterprise level.
    There are good reasons for doing this. Most frameworks have significant learning
    curves. Leveraging the same framework set across the organization optimizes the
    time spent learning these frameworks. It also transfers developers between applications
    easier and less costly. Furthermore, by consolidating the frameworks in use, it
    becomes easier to share common code across applications and get greater reuse.


    Some organizations leave framework choice up to individual application teams.
    In these types of organizations, application architects either decide which frameworks
    will be used or they facilitate the decision. Examples of presentation frameworks
    commonly used include Spring MVC, Apache Struts (or Struts 2), Java Server Faces,
    Google Web Toolkit, Freemarker, Apache Velocity, and many others. Examples of
    web service frameworks commonly used include Apache Axis (2), Apache CXF, Glassfish
    Metro, and many others.


    Once framework decisions are made, application architects usually provide usage
    guidance. This guidance should address cross-cutting concerns such as error handling,
    transaction logging, configuration, and build/deployment'
