    ![](img/1f823903cd4bdc6fc65fc6c7a796ddc6_32_0.png)


    Source: Google Trends taken on November 25, 2013.


    # What I Think


    This book is largely compatible with either approach. Scrum users and other agile
    enthusiasts would merely choose much smaller iteration sizes than my illustrations.
    Because one approach rarely on common sense and is rarely of disadvantages, I
    prefer a hybrid approach.


    **Agile''s emphasis on testing has great value.** I''ve adopted the practice of
    coding test sequences for everything I write and combining them into a full regression
    test. I''ve even seen a team go so far as to put a full regression test in the
    build and force the deployment to fail if all the tests don''t pass. I find that
    the mistakes avoided by this practice more than pay for the extra time and effort
    to develop and maintain test scenarios. Having said that, I''ve also seen organizations
    invest in unit tests, only to discard them when maintaining becomes too resource-intensive.


    **Agile''s tendency to reduce project size has great value.** Project risk appears
    to be proportional to the size of the unit of work. Hence, reducing the size of
    the unit reduces the business risk of undertaking the project. I don''t have empirical
    evidence to prove this statement, but I''ve observed it in the field on several
    occasions.


    **Agile''s war on complexity has great value.** Simpler is better. Ignoring all
    stories but the one you''re working on do produce simpler code in the short term.
    But it also introduces a higher probability of rework (or refactoring, in modern
    parlance), for which many projects have no budget. If refactoring'
