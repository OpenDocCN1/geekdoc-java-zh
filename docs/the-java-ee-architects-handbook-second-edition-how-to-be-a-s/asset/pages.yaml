  md: '# Making Components Easy to Use


    A common mistake people use designing architectural components is choosing a scope
    that is too large. A large scope usually results in a complex component that will
    take a long time to become available and will have a long learning curve. I use
    the 80/20 rule when selecting features to implement in an architectural component.
    Component designers shouldn''t get bogged down with features people will rarely
    use.


    # MAKING COMPONENTS EASY TO USE


    If you''re evaluating component software, ease of use should be one of the deciding
    criteria. If you''re creating an architectural component, there are a number of
    things you can do (that many component developers don''t) to make your component
    easy to use.


    **Limit the instructions for basic tasks to a one-page cheat sheet.** You can
    have a more detailed document for sophisticated, unusual tasks. The longer the
    material developers need to read to get going, the higher the percentage of developers
    who will give up in the process and look for something else.


    **Minimize the number of statements necessary to perform basic tasks.** One of
    the chief benefits to using a component is eliminating code in the application.
    A one-line call is ideal because it eliminates typing and reduces the number of
    classes and methods you need to learn.


    One way to achieve a one-line call is to rely on a static method. This eliminates
    having to instantiate anything. The choice to make that static is more than just
    a tactical choice. As examples, consider any of the Utils classes (e.g., StringUtils,
    NumberUtils, ExceptionUtils from Apache Commons Lang). These classes are replete
    with convenient static methods that accomplish with one line of code.


    Minimize the number of arguments necessary to perform basic tasks. You can accomplish
    this by providing multiple overloads. Some of those have small numbers of arguments
    with sensible defaults for the rest.


    As an example, consider the reflectionEquals methods in the EqualsBuilder Commons
    Lang. This class makes it easy to implement equals() in any class. ReflectionEquals
    at a minimum requires two arguments; the values being compared. However, more
    sophisticated overloads optionally provide you control over which fields are considered
