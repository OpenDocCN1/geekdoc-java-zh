  md: 'At this point from the model of the entity classes, we have a plan for organizing
    exception statistics and a list of what specific statistical attributes we''re
    tracking. From the model of the data access layer, we understand how input/output
    for this section of the application is going to work. We have not modeled the
    section of Admin4J actually examines exceptions that are logged, analyzes them
    to see which exceptions have been logged previously, and updates the relevant
    statistics. We''ve also made mention of the decision to choose exception statistics
    at a configurable interval to keep resource utilization low. This activity occurs
    in the business logic layer. For a product such as this, the nature of the logic
    layer is more technical in nature than you find in most Java EE applications.
    A class diagram for the Admin4J business logic layer can be found in 6.8.


    Let''s start by identifying a preliminary list of classes that will be needed
    in the logic layer. Something needs to be responsible for analyzing generated
    exceptions, whether or not an exception it has been previously observed, and updating
    the statistics associated with that exception. For the lack of a better term,
    let''s call the class that does this ExceptionTracker.


    From the planned feature set, ExceptionTracker needs to initiate the "tracking"
    of an exception and retrieving exception statistics. Furthermore, to support the
    feature that "Administrators can delete exceptions that they deemed dated and
    no longer occurring," a method to delete the reference to an existing exception
    is also needed. As exception statistics are persisted, it follows that the ExceptionTracker
    will rely on the data access layer.


    At this level, we also needed to formulate a plan for observing logged exceptions.
    How this is accomplished is dictated by the logging products than anything else.
    Regarding Log4J, the easiest way to observe logged exceptions is to implement
    a Log4J Appender. This is accomplished by extending a Log4j class called AppenderSkeleton.
    Class LogExceptionHandler from figure6.8 accomplishes this. It stands to reason
    that this class will rely on the ExceptionTracker to analyze the exception and
    update statistics.


    Regarding the logging framework that was incorporated in the JDK, exceptions can
    be observed by extending a Handler class (java.util.logging). Class JdkLoggingExceptionHandler
    from figure 6.8 accomplishes this. It stands to reason that this class will rely
    on the ExceptionTracker to analyze the exception and update statistics.


    We also need a plan to support work that will happen in a separate thread (e.g.,
    the periodic storing of exception statistics) at a configurable interval and purging
    exception statistics); we need a daemon thread for that type of work. In the class
    diagram, we named this class ExceptionCleanupTask. This class leverages a generic
    daemon used by other portions of Admin4J. That information is really out of scope
    for the portion we are modeling here and isn''t important is that'
