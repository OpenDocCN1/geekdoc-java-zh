  md: '# How the Book Is Organized


    straightforward Java EE applications can be. Your time is too valuable to waste
    reading about features and concepts you''ll rarely use in the marketplace.


    # HOW THE BOOK IS ORGANIZED


    The first chapter of the book describes the role of the application architect
    in most organizations and explains how the project life cycle illustrated in this
    book fits in with Extreme Programming (XP), the Rational Unified Process (RUP),
    and other possible methodologies.


    Section 1 details how to define the project objectives using use-case analysis.
    It also discusses how to define scope and create a preliminary project plan. The
    guidelines presented in this section will help you successfully complete these
    tasks that are critical to your project coming in time and budget. The most common
    reasons for project failures or cost overruns are poorly defined and managed objectives,
    or not technical problems.


    Section 2 focuses on object-modeling and data-modeling activities, describing
    how detailed they need to be and illustrating common mistakes. In addition, you
    will learn how to architect interfaces with external systems and how to refine
    the project plan and associated estimates. The modeling skills presented in this
    section are critical to effectively communicating a design to developers.


    Section 3 presents implementation tips and guidelines for all aspects of Java
    EE applications. You''ll learn how to layer your application to minimize the impact
    of enhancements and changes. You''ll also become acquainted with several open
    source libraries commonly used to streamline application code and the development
    process.


    In addition, section 3 details application architecture decisions you''ll need
    to make regarding testing, exception handling, logging, and threading, and you''ll
    learn tips and techniques for implementing major sections of the design. The failure
    of an application architect to define implementation strategies and methodologies
    can slow down a project significantly and increase the number of bugs.


    Section 4 offers tips and guidelines for developing testing procedures and process
    improvement. These suggestions are directed at making your applications more stable
    and maintainable. In addition, you''ll learn the signs warning that refactoring
    activities are necessary. Reading this section will enable you to make your future
    projects even more successful.


    # COMMON RESOURCES


    This book makes frequent references to the following open source projects that
    are often used with many Java EE applications:


    +   - Apache Commons Lang (http://commons.apache.org/lang/)


    +   - Apache Commons Collections (http://commons.apache.org/collections/)'
