    **Warning: It is dangerous to have entities extend BaseVo.** There are several
    reasons for this. Entities are often related to other entities. When you refer
    them, queries are issued under covers to find related entity instances. For example,
    a customer may have many accounts. When BaseVo formulates a toString() value using
    reflection, it will access all accounts and initiate a query to find that. This
    would make the generic implementations found in BaseVo extremely expensive for
    entities.


    # COMMON MISTAKES


    **Populating VOs inconsistently.** I''ve seen some applications where fields of
    value objects were populated with different value sets depending on usage context.
    For example, consider a CustomerVO with name, address, contact, and several other
    fields. I see developers use a structure like this, but only populate name and
    address in a specific section of code. This can cause developer confusion and
    bugs, as other fields are present but cannot be relied on in this section of code
    to have data. To eliminate confusion, it would have been better to create a separate
    value object with only the fields used in that section of code. Usually, the practice
    is a red flag indicating that the design is process oriented instead of object
    oriented.


    **Using a blank string to avoid a NullPointerException.** Some developers initialize
    all fields to a blank string or something that means "nuli" but really isn''t,
    in the following:


    ```

    private String customerName = "";

    ```


    Although this kind of declaration eliminates NullPointerException exceptions,
    it doesn''t prevent some other type of derivative exception from appearing down
    the line. This practice is akin to "sweeping dirt under the rug" and is best avoided.
    Furthermore, this kind of sweeping isn''t necessary if you adopt the practice
    of validating all arguments for protected and public methods upfront as the error
    message will be explicit.


    **Embedding formatting assumptions into entities or VOs.** For example, some developers
    will return strings that represent dates or numbers as that what''s displayed
    in the presentation layer. it limits reusability for the entity or VO as the presentation
    format desired for different applications or even portions of an application will
    likely differ. This is a violation of the separation of concerns principle that
    the entity or VO is given display'
