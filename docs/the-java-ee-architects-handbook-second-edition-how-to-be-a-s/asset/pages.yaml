  md: '![](img/1f823903cd4bdc6fc65fc6c7a796ddc6_20_0.png)


    # PROJECT DEVELOPMENT

    TEAM AND PROJECT

    LIFE CYCLE


    This chapter lays the foundation for building a successful first project, from
    inception to release. It begins by defining what an application architect is and
    does, and by summarizing how the architect works with other team members. The
    chapter continues with a look at a few alternative approaches to the development
    process. Still a subject of considerable debate, the definitive process for building
    a successful project does not yet exist, leading many companies to adopt a hybrid
    plan.


    PROJECT DEVELOPMENT TEAM: ROLES AND RESPONSIBILITIES


    All Java EE development teams need people with a wide variety of skills to fill
    numerous roles within the team. Among the many skill sets needed to make a Java
    EE project successful are:


    +   * Application architect

    * Product manager

    * Project manager

    * Business analyst

    * Graphic designer

    * Presentation-tier developer

    * Business logic developer'
