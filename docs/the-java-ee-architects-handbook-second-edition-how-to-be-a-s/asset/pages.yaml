  md: '# User inputs any parameters needed to run the report.


    User inputs a format for the report (e.g., HTML, PDF, Excel, etc.).


    User views the report.


    Alternative process flows describe abnormal events that can happen during execution
    of the use case.


    +   - If the user doesn''t input all required parameters, the system will display
    an error message listing the parameters that are still required.


    +   - If the report execution errors out, the system will display a generic error
    page and notify an administrator with details of the error.


    Use cases can be written with a more formal organization and content. See Cockburn
    (2001) for more details.


    Use cases should be one to three pages in length. The length recommendation is
    provided by Cockburn (2007). Use cases that are longer than three pages tend to
    have material that isn''t appropriate for the use case; for example, wire graphics
    are not generally appropriate material for a use case. Lengthy use cases tend
    to contain a term glossary or wire frames. For each case, I find it helpful to
    start with include a summary that is no longer two sentences. This simplifies
    organizing the use cases as the list grows. As analysis proceeds, you will add
    additional detail to most use cases.


    Avoid use-case diagrams. The UML specification does a graphical representation
    scheme for use cases. However, graphical schemes are rarely used, and I purposely
    do not discuss them in this book. My experience has shown that use-case diagrams
    confuse the business side and developers, and that the costs of creating, explaining,
    and maintaining these graphical constructs far outweigh any benefits they provide.


    Writing use cases requires in-depth participation from the business side. From
    the technical side, some business analysts may be able to help construct an initial
    draft, but the process should not end without direct business side participation
    and review. Although enticing the involvement of business users is sometimes easier
    than done, their input is valuable. In my experience, insufficient business support
    for analysis efforts like use-case review can cause a project to fail.


    Facilitate use-case analysis by starting with a small group. Application architecture
    can speed this process by working with one business side user or a business analyst
    to draft a set of use cases that can initiate discussion. These draft use cases
    will be incomplete, and some will be incorrect, but you''ll get feedback easier
    and quicker than you would if you started with a blank sheet'
