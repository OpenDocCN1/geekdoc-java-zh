  md: "# Basics of Estimating\n\nMany developers confuse unit testing with system\
    \ testing. Unit testing is strictly at a Java class level. How well a class functions\
    \ when called from other classes within the application is integration testing,\
    \ not unit testing.\n\nFor example, for a set of use cases that involves four\
    \ screens, two external interfaces, five database tables, no data conversions,\
    \ and two environment setups, the base estimate is:\n\n```\n(4 × 80 hrs) + (2\
    \ × 120 hrs) + (5 × 40 hrs) + (2 × 8) = \n616 hours\n```\n\n**Step 3: Multiply\
    \ the base estimate from step 2 to 2.5 to account for analysis and testing for\
    \ each user story or use case.** If coding and unit testing are about one-third\
    \ of the overall cost of each use case, the total cost should be about three times\
    \ the base estimate. Because the analysis is about 50 percent complete at this\
    \ stage, the total cost to be 2.5 times the base estimate. Continuing the previous\
    \ example, the total hours left for the project would be 600 × 2.5 = 1,500.\n\n\
    **Step 4: Inflate the estimate by 20 percent for each additional developer on\
    \ the project.** The base estimate assumes that the project has one developer.\
    \ Each developer added to a project adds communication and coordination time (Brooks,\
    \ 1995). Although necessary, time spent communicating and coordinating is not\
    \ spent developing. Therefore, inflate the base estimate by 20 percent (i.e.,\
    \ multiply by 1.20) for each developer added. For example, with a base estimate\
