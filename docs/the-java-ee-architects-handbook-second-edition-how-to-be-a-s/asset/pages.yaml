  md: '# Become a Successful Application Architect for Java EE Applications


    You will discover how to:


    +   - Design Java EE applications so that they are robust, extensible, and easy
    to maintain.

    - Assume the role of application architect on Java EE projects.

    - Apply commonly used design patterns effectively.

    - Identify and address architectural issues before they hinder the development
    team.

    - Document and communicate the application design so that the development team''s
    work is targeted.

    - Avoid common mistakes that derail project budgets and timelines.

    - Guide the development team through the design and construction process.

    - Set up effective procedures and guidelines that increase stability and decrease
    defect reports.

    - Avoid common mistakes that Java EE applications overly complex and hard to support.

    - Effectively estimate needed resources and timelines.


    This handbook is a concise guide to assuming the role of application architect
    for Java EE applications. It will guide you through an entire Java EE project,
    identifying business requirements, performing use-case analysis and data modeling,
    and managing a development team during construction. It also provides tips and
    techniques for communicating with project managers and management and strategies
    for making your application easier and less costly to support.

    Whether you are about to architect your first Java EE application or are searching
    for ways to keep your projects on-time and on-budget, you will refer to this handbook
    again and again.


