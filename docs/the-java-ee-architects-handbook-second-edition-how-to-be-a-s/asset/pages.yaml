    # STRATEGIES FOR CONSUMING

    EXTERNAL APPLICATION DATA


    The most common type of external interface is needed to read data maintained by
    another application. Commonly used strategies include utilizing the external application
    database directly or utilizing an Enterprise Java Bean (EJB), Messaging technologies,
    REST service, or web service to obtain the information needed. Each of these strategies
    has advantages and disadvantages.


    # Reading External Application Databases Directly


    The advantages of the strategy of reading external application data directly are
    the following:


    +   - Is the simplest and cheapest to implement


    +   - Requires little or no involvement from the external application vendor or
    application team


    +   - Provides data that is always up-to-date


    This strategy is used a lot because initial development is usually simple and
    cheap. It often doesn''t take much interaction with external application personnel.
    Furthermore, database access is well known and easily understood by most developers.


    The disadvantages of this strategy are the following:


    +   - Increased risk of adverse impact from external application change


    +   - Increased risk of unintended consequences on external application users
    (i.e., performance)


    Reading external application databases directly makes use of application internals
    that were never intended to be published in many cases. If external'
