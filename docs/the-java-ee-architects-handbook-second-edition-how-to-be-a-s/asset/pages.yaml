  md: 'How can you validate that your object models are correct? Good question. We
    don''t have compilers or other tools that will validate object models. One way
    to test is peer review by developers. Hold a review session with others familiar
    with the requirements and provide them with a review and explanation of your models.
    Often, others will have insight and may point out defects or issues before construction.
    Furthermore, defects in the model will become more apparent during construction.


    Compare your model to the code actually developed. There will always be subtle
    adjustments made to the design (e.g., attributes added, methods added). But if
    fundamental and relationships between software classes as constructed differ substantially
    from your model, it could indicate defects in the model. For this reason, I usually
    participate in the construction phase so that I can learn from my mistakes.


    # FURTHER READING


    Gamma, Erich, Richard Helm, Ralph Johnson, and John Vlissides. 1995. Design Patterns.
    Reading, MA: Addison-Wesley.'
