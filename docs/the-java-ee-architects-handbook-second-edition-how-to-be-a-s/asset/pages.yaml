- img_proc: true
  md: '# Project Development Team: Roles and Responsibilities


    The application architect mentors developers for difficult tasks. Typically, the
    architect is more experienced than the developers. In fact, it is not uncommon
    for application architects to also function as a senior developer for the projects
    they work on. When the developers run into a technical problem that slows them
    down, the architect is often the one who helps them create a solution. For many
    projects, the architect is more of a mentor than an implementer.


    The application architect enforces compliance with coding guidelines. Being the
    one who establishes coding guidelines, the application architect is the most likely
    to recognize when the guidelines are not being followed and is therefore the logical
    choice to enforce them. A project manager, who typically is charged with enforcement
    tasks, often does not have the technical experience to recognize compliance.


    Code reviews are an excellent enforcement mechanism. It is much harder for individual
    developers to quickly skirt coding standards if other team members examine the
    code. I also leverage source control to streamline my review of coding changes
    on a periodic basis. That is, most source control products provide a feature that
    will notify you of check-ins by e-mail. As a practical matter, the attention I
    pay to individual check-ins depends on the skill set of the developer doing the
    check-in. Over time, developers will provide more than others and require less
    oversight.


    Code reviews are also an excellent learning tool for all members of the development
    team. The application architect discovers holes in the design, and all participants
    learn tips and tricks from the rest of the team. Typically the most experienced
    member of the team, the application architect often facilitates the code review.
    To be most useful, a code review should be held in a congenial, nonthreatening
    atmosphere.


    It should be noted that there are source analysis tools, such as Checkstyle (http://style.sourceforge.net/),
    PMD (http://pmd.sourceforge.net/), and FindBugs (http://findbugs.sourceforge.net/)
    that provide automated review support. That is, they will examine your source
    and point out likely coding issues. Usually, I need to spend time configuring
    these tools (e.g., determining which rules to enforce) before formally incorporating
    them in the build.


    The application architect assists the project manager in estimating project costs
    and benefits for management. Although this is usually the project manager''s responsibility,
    most project managers are less experienced with Java EE technologies and may not
    be aware of everything that needs to be done. It''s the application architect''s
    responsibility to review the project plan and make sure the project manager hasn''t
    forgotten any tasks. I often have team members review the project plan and I solicit
    feedback. It''s harder for team members to complain about an inadequate or inaccurate
    project plan if they had the opportunity to review and critique it.'
