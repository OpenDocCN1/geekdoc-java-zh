  md: '# Chapter 18: Finding Your Way When Technologies Change


    need-to-know concept. Unnecessary dependencies make components harder to use and
    test, as these dependencies need to be provided and any requirements they have
    in order to function need to be met. For example, DAO classes should be dependent
    on Hibernate or JPA classes. For code in the business logic layer to have a Hibernate
    dependency means that Hibernate needs to be at least present and possibly configured
    for that logic to run. This places an extra burden on unit test cases for these
    business logic classes. Additionally, it widens the potential of impact should
    Hibernate be upgraded or switched to another JPA implementation. You can see this
    illustrated more clearly by looking at the work you go through different third-party
    products into your application. Introducing dependency-heavy products like Spring
    or Hibernate involve a lot more work as you typically need to examine potential
    version conflicts for those dependencies. Conversely, introducing products without
    dependencies (e.g., Apache Commons Lang) is very easy as there is much less possibility
    of version conflicts.


    Insulate all application interfaces using proxies. That is, create a proxy class
    for all external applications used by your application. For example, if your purchasing
    application utilizes functionality in a customer management via web services,
    create a proxy class for that activity. This limits the effects of changes within
    the external application; changes to that external application will affect the
    proxy class only. Also, this makes unit testing easier as you can effectively
    stub the external application. Utilizing proxies also makes it easy to log all
    requests/responses with external applications to make problem diagnoses easier.


    # SWIM WITH THE STREAM


    Use products and technologies as they were intended to be used. Using products
    in the way they were intended increases the likelihood that your use of the product
    has been tested. You should require assistance, that assistance and code examples
    will be easier to obtain for mainstream uses of a product than nonstandard or
    unsanctioned uses of the product. It''s just that whether it''s a vested product
    or an open source product, your “support” isn’t provided by a vendor and usually
    consists of Internet searches or searches of the product''s bug lists.


    Using the product as it was used increases the probability that you will benefit
    from product advances. For example, users of relational databases that used designs
    in 3rd normal form (as relational databases are meant to be) require frequent
    joins. In the early days, this was for concerns about performance. Now, due to
    product advances, joins using primary and foreign keys usually present no performance
    issues whatsoever. Users who normalized their database designs benefited from
    technological advances made to the relational database products they were using.'
