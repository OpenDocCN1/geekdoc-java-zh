    # Unit Testing Best Practices


    Keep test cases and supporting classes in a separate folder, but in an identical
    package structure. Although test cases are developed in conjunction with the application,
    they are not truly a part of it. Typically, you have no need to deploy them to
    anything but your testing environments.


    I usually organize the package structure of my test cases and supporting classes
    after the application package structure. Keeping a consistent package structure
    will save developers time.


    Adopt a naming convention for test cases that makes them easy to find. This is
    another suggestion that can save developers time. For instance, I name all of
    my test cases TestXXX, where XXX is the name of the class being tested. For example,
    class TestValueObject is the class for ValueObject. I prefer to combine all unit
    tests for the same class into one test class, but this is not a technical requirement
    or suggestion.


    Make each test case self-sufficient and independent. A test case should not rely
    on other test cases having executing before it. If you write the test cases so
    that case #1 has to run before test case #2 will work, it''s not obvious to other
    developers what the prerequisites are, should they want to use a test case for
    unit testing and debugging. However, there may be some isolated cases where implementing
    this suggestion isn''t practical.


    # INTEGRATION TESTING


    Integration testing (sometimes known as acceptance testing) verifies that an individual
    software feature or function works as intended. Typically, I consolidate the environments
    for integration testing and system integration testing as their requirements are
    similar enough. One component of integration testing certainly can be JUnit tests
    executing presentation layer support class methods that support major features
    of the application. It is difficult, however, to completely automate integration
    tests for GUI features. While testing frameworks can verify that a feature works
    without exception, I Can''t verify that the GUI aesthetics are correct. For this
    reason, I usually maintain a manual regression test plan for my projects. At this
    stage, developers should be making any needed modifications to regression test
    plan so that it accommodates the new feature(s) being added.


    # SYSTEM INTEGRATION TESTING


    System integration testing is a process that ensures that the software product
    as a whole works as intended. This process is usually executed in preparation'
