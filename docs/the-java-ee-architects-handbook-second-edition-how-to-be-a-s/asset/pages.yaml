    grows and never shrinks, then an application within that container leaks.


    Java locking or race condition issues can cause memory shortages. This is because
    locking issues keep user activities active for longer than they would otherwise
    be. While those activities are active, memory allocated to service cannot be garbage
    collected and reused. In this case, the memory shortage is derivative. That is,
    it''s not the root problem as it wouldn''t exist if it weren''t for the Java locking
    issues that caused it. In these cases, the locking issue first; the memory shortage
    will often disappear when the locking issue is solved. As an example, JDBC drivers
    synchronize the ability to create database connections. There is only one database
    connection can be created by the container at a time. Normally, with a properly
    configured connection pool, this isn''t a problem. However, there should be unexpectedly
    large user demand, the container may have an unusually large number of threads
    waiting for database connections to work. As each of these active threads consume
    memory, this can lead to a memory shortage.


