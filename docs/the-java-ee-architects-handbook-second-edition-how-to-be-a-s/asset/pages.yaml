    # Choosing Deployment Wrappers


    You can have multiple deployment wrappers for the same business object. For example,
    it is not uncommon to create a message-driven bean and a web service deployment
    for a customer object.


    Each type of deployment wrapper has its advantages and disadvantages. Choosing
    which type of deployment wrapper to use is difficult if you haven’t substantially
    completed use-case analysis and prototyping (chapter 3) or defining application
    interfaces (chapter 4). Table 5.3 summarizes the differences between the types
    of deployment wrappers.


