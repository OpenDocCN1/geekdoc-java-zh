  md: 'Moreover, using non-ANSI standard column functions can also cause portability
    problems. Not all database vendors implement the same column functions. For instance,
    one of my favorite Oracle column functions, decode, which allows you to translate
    one set of values into another, is not implemented in many of the other major
    database platforms. In general, using column functions like decode has the potential
    to become a portability issue.


    **Always specify a column list with an insert statement.** Many developers use
    the shortcut of omitting the column list in an insert statement to avoid having
    to type out a column list. By default, the column order is the same as physically
    defined in the table. Listing 10.6a illustrates this shortcut, and listing 10.6b
    illustrates the alternate of explicitly listing desired columns.


    # Listing 10.6a: Insert Statement Without Column List


    ```

