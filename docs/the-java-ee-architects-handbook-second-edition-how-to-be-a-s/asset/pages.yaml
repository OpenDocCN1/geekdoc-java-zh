  md: '# BUSINESS LOGIC LAYER


    Objects in the business logic layer combine data with business rules, constraints,
    and activities. Business objects should be separated from DAOs, entity objects,
    VOs, and the service layer, as well as services, to maximize the possibility of
    reuse. Business objects often use and coordinate the activities of multiple data
    access objects.


    Business objects should be deployment independent and self-contained. Business
    objects should be easily usable in batch jobs as well as web applications or thick-client
    applications. Business logic objects utilize data access classes and reference
    entity and value objects, but don''t reference anything in the presentation layer.
    We will find out that the presentation layer uses the business logic layer, not
    the other way around.


    Business logic contains transaction scripts for any work performed by the application.
    For example, if credit checks are automatically initiated for new customers, the
    business logic class managing new customers'' information might also initiate
    the credit check for that customer. This action might be initiated by a business
    user via a web application or initiated by a batch job processing a purchased
    customer base. The business logic class makes no assumptions as to the context
    of its execution.


    # Common Patterns


    One of the most frequently used patterns in the business logic layer is the Transaction
    Script pattern. This pattern basically looks at an application as a series of
    discrete transactions. For example, in banking, common transactions are defining
    a new customer and opening new bank accounts for that customer. You can imagine
    transactions to find an account balance as part of validating a financial transaction,
    as illustrated in figure 5.6. A more detailed definition can be found here: http://martinfowler.com/eaaeaCatalog/transactionScript.html.


    The Transaction Script pattern is often criticized as not being object oriented.
    That is true. It is so popular because it adheres to the practice of keeping software
    as simple as it can possibly be.'
