  md: '# Creating Database Schema Definitions


    In the early days of relational databases, third normal form was considered inefficient,
    and "denormalization" in the name of performance was commonplace. Despite decades
    of technological advancement, there are a surprisingly high percentage of developers
    who still subscribe to this idea. The usual reason given is that joins (which
    occur more often in a normalized database) are inefficient.


    The main side-effect of denormalization is the additional code processing to keep
    all copied and derived data synchronized on update. In the example above, if you
    include account information on the customer order to "denormalize" and eliminate
    the need for queries to join the two tables, then you''ve effectively copied the
    account information once per order. When account information changes, it must
    be changed on the orders as well.


    These days, joins are efficient, and denormalizations should be a rare event.
    If you want to make queries easier for support developers who write ad hoc queries
    to investigate defect reports, create a series of views for that purpose.


    # CREATING DATABASE SCHEMA DEFINITIONS


    Typically, database administrators use the data model to create relational database
    schemas for the rest of the team to use. And most database administrators use
    modeling tools to do the dirty work. Unfortunately, few open source tools for
    creating schemas are available. Although the process is a bit more involved than
    what I illustrate in this section; with the help of a qualified database administrator,
    you can create schemas using the following central algorithm:


    +   * Directly translate each entity into a table. All attributes of an entity
    become columns in the table. Explicitly define the primary key in each table.


    +   * Assign a foreign key in the child entity of each one-to-many relationship.
    Remember, a foreign key is the primary key of another entity that exists so that
    you can match data in one entity to another. For example, CUSTOM_ID will appear
    as a foreign key in the ACCOUNT table so that you have a way to associate an account
    with a specific customer using an SQL join. It''s a good idea to index all foreign
    keys to facilitate query joins.


