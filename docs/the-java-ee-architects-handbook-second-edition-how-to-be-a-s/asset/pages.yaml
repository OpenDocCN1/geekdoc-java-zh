  md: '# UNIT TESTING GUIDELINES


    Unit testing operates on the principle that finding defects earlier in the project
    is usually cheaper, in fewer people are impacted by the defect before it''s identified
    and fixed. Once in place, it helps prevent future defects by allowing developers
    to make changes with a reasonable degree of confidence that their changes won''t
    break anything.


    Damage from bugs occurs in many forms. A bug discovered late in the testing process
    can impact a project timeline. A bug discovered after deployment can damage users''
    faith in the system and the development team. Fixing bugs late in the process
    involves more manpower. At that point, the fix can involve not only the developer
    but an entire testing team (if your project has them, and many do).


    By contrast, news of a bug caught early in the project passes no further than
    the development team. The testing team and end users won''t be directly involved
    in verifying a fix to a bug they have never experienced.


    Unit testing guidelines need to answer the following questions:


    +   - What level of code unit test coverage is considered adequate?

    Which classes and methods require unit tests?

    - Where do I put my unit tests so that they can be easily found and used by other
    developers?

    - How often are my unit tests expected to be run? Who fixes them when they break?

    - If my unit tests require external resources (e.g., relational databases or external
    applications), what environment are they expected to run in?

    - What testing tools are in the technical stack and are available for use?


    This is where most pundits make the sales pitch for Test Driven Development (TDD);
    that is, write unit tests before writing the code itself. In this way, developers
    ensure a high level of unit test coverage and ensure that they understand the
    requirements of what they are about to code. This practice also guides developers
    toward writing code in a way that it can be unit tested. Most pundits make the
    claim that anything less than 100 percent unit test coverage (that is, all lines
    of code are tested at least once by a unit test) is unacceptable.


    On the other side of the argument, if you write unit tests after writing the underlying
    functionality, your tests are more likely to address the higher-risk areas of
    your code, as you''ll write them at a point when you understand the most about
    the problem you''re trying to solve.


    I think it''s more important to specify what level of code coverage is required'
  merge: -1
