    # COMMON DATABASE DESIGN MISTAKES


    **Denormalizing the database out of habit.** Denormalizing a database means replicating
    information to avoid lookups and enhance performance. Consequently, denormalization
    can introduce maintenance problems if the copies get out of synch.


    In the early days of relational databases, denormalization for performance was
    a must. However, the technology has advanced to the point where forced denormalizations
    are rare. Today, denormalizations are done more out of (bad) habit than for performance
    reasons.


    **Dropping database integrity constraints for programmatic convenience.** Some
    developers like to shut off the foreign key relationships between tables. Not
    using integrity constraints initially saves the programmer time because it permits
    invalid inserts, updates, and deletes. I''ve found you lose more time than you
    saved because you end up fighting bugs created by flawed inserts, updates, and
    deletes. The sooner you catch a bug, the cheaper and easier it is to fix.


    **Attempting to use relational data modeling concepts to design NoSQL databases.**
    The data modeling concepts described in this chapter apply to relational databases
    only. Most NoSQL database products are not designed to support the wide variety
    of queries and relationships within the data that relational databases are designed
    to handle.


    # IMPROVING YOUR DATA MODELING SKILLS


    **Get a mentor.** Choose someone whose data modeling skills you respect to review
    your models for current assignments. Often, someone outside the project can provide
    a more objective viewpoint. This can be done privately unless your manager requests
    others.


    **Audit relational databases for applications you support.** What mistakes do
    you see? Are there any violations of third normal form? Is there any denormalization
    or data duplication present? Is there anything there that you would have modeled
    differently if you were given the chance? Take note of these items. You may not
    get the opportunity to fix the mistakes that you find, but you might be able to
    avoid the same mistakes on future assignments.


