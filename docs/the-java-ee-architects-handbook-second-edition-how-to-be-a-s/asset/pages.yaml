  md: '# Figure 11.2: Using Business Object within a Layered Architecture


    ![](img/1f823903cd4bdc6fc65fc6c7a796ddc6_171_0.png)


    The Factory pattern consolidates responsibility for instantiation and configuration,
    and it alleviates that concern from the rest of the application. In the simplest
    case, the Factory pattern merely instantiates a class, e.g., via the new keyword.
    With more complicated applications, it may need to interrogate the application’s
    configuration to make a decision as to which concrete class is produced.


    IOC software products, such as Guice (http://code.google.com/p/googleguice/) or
    Spring (http://www.springframework.org/), provide you with ways to configure applications
    by controlling which concrete class implementations are used with a practical
    installation of the application. IOC software products alleviate the amount of
    custom code needed to manage your application configuration. IOC software products
    also simplify some unit testing as they allow you to easily stub classes that
    aren''t currently under test. It is possible to combine IOC software product use
    with the Factory pattern.


    The use of IOC forces rigorous use of interfaces to decouple class dependencies.
    This has advantages and disadvantages. The decoupling tends to make classes more
    reusable; however, it also reduces the ability for development environments to
    provide call hierarchy information (i.e., information about which classes call
    a given method on a concrete class). This is information that is extremely useful
    to developers and shouldn''t be sacrificed lightly.


    Many consider the use of IOC software products essential and use them'
