    in a daemon thread.


    The decision to persist statistics on a configurable time interval makes it possible
    to lose track of exceptions generated between the time statistics were last persisted
    and shutdown of the JVM (e.g., application is shut down for maintenance or software
    updates). To minimize information loss, we''ve implemented a shutdown hook that
    will be executed with a graceful shutdown. This hook will persist statistics and
    terminate. We will still lose information if the JVM process is killed or suffers
    some other type of nongraceful shutdown.'
