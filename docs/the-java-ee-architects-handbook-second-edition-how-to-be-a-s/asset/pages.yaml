    have fewer defects. They are easier to teach to new members of the team and are
    quicker for new members to learn. Simpler application support procedures greatly
    increase the chance that they will be understood and followed, and it’s easier
    to bring new developers to the team. Furthermore, the simpler the application
    is for users, the fewer questions users will have regarding how to accomplish
    their work.


    Tolerate only enough complexity to satisfy known business requirements. Some problems
    are naturally complex. For example, air traffic control (e.g., keeping track of
    the position of all airplanes with the intent of avoiding collisions) is a naturally
    complex business problem. Consequently, some complexity will be necessary in all
    applications. But we distinguish between complexity that is required by the business
    problem and complexity that is unnecessary. Examples of unnecessary complexity
    are components that are introduced by developer mistake or poor design decisions.
    Complexity required by the business problem can’t be avoided.


