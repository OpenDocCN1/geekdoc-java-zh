    # Utilizing Web Services


    Many viewed products that support custom interfaces will provide web service libraries
    for this purpose. Like any interface choice, web services have several advantages
    and disadvantages.


    Advantages of utilizing web services for applications interfaces are the following:


    +   - Web service definitions are self-documented using WSDL.


    +   - Web services have extensive product support.


    +   - Web services provide a change insulation layer.


    +   - Web services are platform neutral.


    +   - Web services can be published securely over the Internet.


    Web service interfaces are popular precisely because they are platform neutral.
    Given the choice, most alike preserving the flexibility of choosing alternate
    platforms that should become necessary. In addition, tool support for publishing
    and consuming web services has advanced considerably. For instance, the Java EE
    specification (JAX-WS portion) has added web service annotations that make it
    easier to publish web services. Additionally, there are numerous web service frameworks
    available for Java/Java EE as well as other development platforms.


    Readers writing code-level information on how to program web services using the
    following tutorial: http://docs.oracle.com/cd/E17802_01/webservices/webservices/docs/2.0/tutorial/JAXWS.Html.
    From an architectural perspective, it is usually advisable to segregate code consuming
    or publishing web services from the rest of your application. This is an application
    of the “single responsibility principle” and provides an insulation layer that
    limits adverse effects of change on both sides. It also makes constructing unit
    tests easier. As an example, suppose your application needs to consume web services
    offered by a document management system (DMS) product. I typically segregate consuming
    the interface from the rest of the application, as illustrated in figure 4.2a.'
