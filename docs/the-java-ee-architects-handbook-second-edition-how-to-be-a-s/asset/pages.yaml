  md: '# PLANNING JAVA EE APPLICATIONS


    The application architect typically assists in planning Java EE applications by
    participating in analysis activities, defining scope, and estimating resources,
    among other activities. The architect''s role in the planning stage varies greatly
    from company to company. Although I''ve taken the perspective that the architect
    leads and facilitates planning activities, your role at an individual company
    may be to assist rather than facilitate.


    In this section, you will learn how to:


    +   - Facilitate and document business analysis.

    - Assist the project manager in defining project scope.

    - Estimate needed time and resources.

    - Define and design interfaces to external applications.


    The skills you learn here will enable you to apply the design techniques discussed
    in section 2.'
