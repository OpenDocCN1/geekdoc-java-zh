  md: '# Chapter 6: Creating Object Models


    At this point, all that remains from a modeling perspective is the presentation
    layer. As Admin4J is a generic tool, we can''t assume the existence of any presentation
    framework, such as Struts, Java Server Faces, Wicked, or anything else. Nor do
    we want to impose a large configuration effort on users. At the same time, writing
    and maintaining user display logic entirely within servlet code is tedious and
    time consuming.


    To minimize our dependency and configuration footprint, yet provide some basic
    presentation capabilities, we adopted Freemarker (http://free-marker.sourceforge.net/)
    as a display mechanism. We configured our use of it so that all templates we sourced
    from the Admin4J layer. We didn''t want users to copy templates or individual
    JSPs into their application web.


    This presentation method requires users to register a servlet in the applications.xml
    file. As all Admin4J display pages follow a similar architecture, we became concerned
    that the servlet registration requirement would become oppressive. To solve that,
    we created a home page servlet display page we''re discussing in this example.
    Users only need to register the home page once, which contains links for all Admin4J
    pages, including the exception statistics display page once all other pages are
    handled automatically. Of course, users can still install pages separately if
    they don''t want to install all Admin4J features, but that''s the user''s decision.


    The ExceptionDisplayServlet handles display for the exception statistics display
    page. The ExceptionDisplayServlet extends the AdminDisplayServlet, which provides
    basic plumbing code to generate output from Freemarker templates and writes that
    generated content to a user''s browser. Both of these servlets rely on functionality
    contained in the Admin4JServ class, which handles basic configuration tasks for
    all Admin4J functionality.


    A class diagram for the presentation layer for this portion of Admin4J can be
    found in 6.9.'
