  md: '# MAKING COMPONENTS EASY TO CONFIGURE AND CONTROL


    Minimize the number of properties a user must configure. Some components use a
    properties file, which is a file of key and value pairs, to manage configuration
    settings. These files are often used in conjunction with the java.Properties object.


    The more properties users need in order to choose values for running your component,
    the longer and harder your component is to configure. You can alleviate this problem
    by choosing sensible defaults for any configuration properties as possible. In
    addition, clear error messages for incorrect configurations can make your components
    easy to use.


    Minimize the required complexity of any needed XML documents. The more complex
    the document structure, the harder the component is to configure and control.
    Jakarta''s Ant project is an excellent example of using XML files effectively.
    Ant is an XML scripting utility commonly used for application builds. Its scripting
    language is XML based, and its structure is simple and intuitive. Although Ant
    has an extensive array of options, it also has sensible defaults and good documentation.
    This open source project is available at http://ant.apache.org/


    Produce clear error messages on invalid configurations. Components must have clear
    error messages. Nothing is more aggravating than trying to figure out why code
    you didn''t write is degenerating into a NullPointerException. Clear error messages
    can make the difference in a developer''s perception of your component.


    Provide numerous configuration file examples that are easy to copy. This is especially
    important if the component is capable of complex configurations. I suggest providing
    basic examples as well as complex ones.


    Limit installation and configuration instructions to a one-page cheat sheet. If
    the instructions are too long and complex, it reduces the benefit of using the
    component in the first place. Having an expanded document for complete functionality
    is fine, but users doing basic tasks shouldn''t have to read more than a page
    or two.


