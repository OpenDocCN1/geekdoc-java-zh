    # ENFORCE SEPARATION OF CONCERNS


    Software components should have a narrow focus and be concerned only with what
    they need to accomplish their objective; nothing else. Software “components” are
    defined loosely. They could be individual classes or a separate library.


    The “separation of concerns” principle promotes simplicity since code to handle
    unneeded information dependencies is not present. Components that are narrowly
    focused promote reuse; they are easy to use as their purpose is clearer to developers
    and more versatile and useful in a wider variety of contexts. This principle makes
    software components easier to test as they reduce the dependencies the test code
    must manage. This principle effectively breaks down complex problems into a series
    of simpler problems; it promotes writing code with a clear and concise mission.
    There are several practical implications to this principle, as follows:


    Applying the separation of concerns principle will produce a large number of software
