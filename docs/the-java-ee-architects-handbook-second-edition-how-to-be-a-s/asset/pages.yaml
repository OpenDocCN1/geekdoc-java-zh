  md: '# Chapter 1: Project Development Team and Project Life Cycle


    The application architect assists management in making personnel decisions for
    developer positions. While personnel decisions are often viewed as a management
    function, the application architect is in a good position to assess technical
    competence. Mistakes in personnel decisions can cause considerable damage to project
    timelines.


    # Product Manager


    The product manager is responsible for the product and its requirements. For most
    organizations, this position is staffed by the business area that the application
    is meant to serve. For organizations building software to market or sell to other
    organizations, the product manager is responsible for ensuring that the product
    is based on the needs of the market.


    The application architect is responsible for providing technical advice and guidance
    to the product manager. The application architect works with the business analysts
    and the product manager(s) to help determine what features are feasible within
    the application or feasible for a specific release.


    # Project Manager


    The project manager is responsible for coordinating and scheduling all tasks for
    all members of the project development team. The project manager must communicate
    current project activities and status to management and end-user representatives.
    Further, the project manager acquires any resources or materials needed by the
    project or the team members.


    The application architect is responsible for providing technical advice and guidance
    to the project manager. The application architect assists the project manager
    in identifying project tasks and the order in which they should be completed.
    The architect also helps the project manager identify needed materials and resources,
    including the selection of other team members and validating their skill sets
    from a technical standpoint.


    # Business Analyst


    The business analyst is responsible for working with end users to define the application
    requirements and the necessary detail to design and build the application. Because
    end users and developers often use different terminology, the business analyst
    is responsible for translating communications between end users and developers.
    Often the business analyst has experience on both the end-user side and the information
    technology side of the enterprise.


    As a project progresses, the business analyst''s role diminishes but does not
    disappear. Developers typically have additional business questions that come to
    light during coding and testing activities, and the business analyst works with
    the business side to get these questions answered.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'The application architect is responsible for ensuring that the application
    requirements determined by the business analyst are adequate. It''s unreasonable-able
    to expect 100 percent of the analysis to be complete and correct. After all, analysis
    is to some extent subjective. However, the analysis needs to be complete enough
    to warrant proceeding with design.


    # Solution Architect


    The solution architect ensures that the application adheres to any technical standards
    enforced across the enterprise. For example, many organizations standardize the
    databases and application server software used. Should the application team encounter
    technical problems that have been solved elsewhere in the enterprise, the solution
    architect will guide the application architect toward re-using what has already
    been developed in the enterprise. Sometimes solution architects are organized
    by business area and are able to assist business representatives in deciding which
    application development efforts to fund. It is common for the application architect
    to fill this role, especially for smaller organizations.


    # Graphic Designer


    Many applications, especially those that are publicly available, need professionals
    or layout designers. Most developers, left to their own devices, can produce functional
    web pages, but those pages are typically ugly and hard to use. Graphics design
    is more art than science. The graphic designer will focus on user interface design,
    graphics, and overall usability of the application. Usually, the graphic designer
    works primarily with the business analyst and other representatives of the business
    side to work out the design. But the graphic designer may also work with the presentation-tier
    developer to create a prototype.


    Some larger organizations distinguish between a “graphic” designer and a “transaction
    designer.” The transaction designer will design the page flow and controls to
    fill the business process, as opposed to being concerned with aesthetics. Most
    organizations do not distinguish between the two roles and combine them into one.


    The application architect is responsible for ensuring that the layout is technically
    feasible. I''ve seen many web page designs that use text effects that are available
    in word processors but are not supported by HTML—for example, a design using text
    rotated 90 degrees. The architect is in a position to catch and correct these
    kinds of problems early in the development process.


    # Presentation-Tier Developer


    The presentation-tier developer is responsible for coding all HTML, Javascript,
    template markup, JSPs, and/or servlets for an application.'
