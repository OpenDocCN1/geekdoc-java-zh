    # MAKING A PRODUCT DECISION


    When doing research for a particular product, it usually involves multiple people.
    Typically, it''s the application architect that facilitates these kinds of decisions.
    In the first meeting, I suggest a set of features/decision criteria (patterned
    after the concepts described above) and get general consensus as to what criteria
    will be judged on. It''s possible that additional criteria might be proposed and
    discussed after this meeting, and that''s okay.


    Additionally, I suggest a list of products that should be considered and get general
    consensus for that. At this stage, if a product remotely appears to have a chance
    of fulfilling the business requirements for your project, it should be added to
    the list. Bad suggestions will get eliminated down the line as different features
    are identified and measured. You also don''t want to appear to be gaming the selection
    process by unilaterally eliminating somebody''s product suggestion upfront.


    The next topic of discussion is the weight that should be given each criterion.
    As I stated in the previous section, some criteria are less important than others.
    For example, fitness of purpose is much more important than dependency requirements
    for most products.


    Many developers will over-rate the importance of performance in making frameworks.
    Slight differences in performance are not material to most organizations. Just
    because one web service framework has a slight edge over another in a given test,
    does not mean that you should necessarily choose the highest performing product;
    other criteria need to be considered.'
