  md: '# Chapter 18: Finding Your Way When Technologies Change


    Numerous examples of principles can be found in the worlds of physics and mathematics.
    Every young math student learns about the commutative properties for addition
    in mathematics; namely that 2 + 3 is the same as 3 + 2. That property is used
    abundantly in mathematics to prove more complex theories. Application architecture
    operates in a similar fashion in that it''s guided by a base set of functional
    principles that are used to derive many accepted best practices common today.
    One of a frequently referenced development principle is DRY or Don''t Repeat Yourself.


    I distinguish between architectural principles and best practices because the
    two are often confused. Best practices are principles applied to a specific technology,
    product, or development condition. the best practice of designing relational databases
    using 3rd normal form applies the DRY principle and avoids recording the same
    data in multiple places. The best practice of writing unit tests with your production
    code applies the principle that catching errors earlier is better than catching
    them later. The best practice of checking arguments for all public and protected
    methods applies the principle that catching errors earlier is better than catching
    them. In essence, the “best practice” is a rule of thumb written in terms that
    can be directly applied to a set of specific situations and technologies. By contrast,
    the “principle” is the underlying truth that makes best practices useful and beneficial
    to follow.


    Architectural principles worth discussing several qualities or attributes. Architecture
    principles are product generic; that is, they do not reference specific products,
    frameworks or technologies. As illustrated above, principles are often combined
    with specific frameworks and products to form best practices. Architecture principles
    are simple; complex principles will never be remembered or applied. Architecture
    principles are applicable; that is, they are worded in a way that can be easily
    applied to new situations. Architecture principles are independent; that is, they
    are unrelated to other principles. Architecture principles are logically consistent;
    they don''t contradict other principles.


    Without further ado, architectural principles I follow are:


    +   - Simpler is better.

    - Reuse, don''t reinvent.

    - Enforcement separation of concerns.

    - Swim with the stream.

    - Catch errors earlier rather than later.

    - Functional requirements are the highest priority.


    Note that these principles are applicable for all applications, not just Java
    EE applications.'
