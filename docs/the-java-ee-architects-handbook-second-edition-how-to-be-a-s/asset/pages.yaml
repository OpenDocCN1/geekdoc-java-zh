    # Mitigating Political Risk


    The second issue surrounding the use of open source component software is the
    corporate need to have someone to blame if the choice of open source product doesn''t
    work out as intended. I can''t think of a way to completely solve the issue, but
    I can think of many ways to mitigate the risk.


    Suggest a commercial software component along with open source alternatives and
    keep documentation of the decision. This tactic effectively makes the component
    decision a group effort. If an open source decision is ever questioned, you can
    frame it as a group decision and point to budgetary advantages.


    Track which open source products you use and keep source as well as binary distributions.
    You won''t want to find out at the time you''re having trouble that the source
