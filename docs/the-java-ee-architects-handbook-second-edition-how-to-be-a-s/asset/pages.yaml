    These two objectives are extremes in the same continuum. That is, providing better
    end-user experiences costs more in terms of labor costs. Conversely, cutting costs
    often lowers the end-user experience as it takes longer to address problems and
    defects. Most organizations strike a subjective balance between these two extremes.


    Maximizing the end-user experience with an application means minimizing unplanned
    outages, minimizing defects, providing acceptable performance, and resolving user
    issues with the application quickly and efficiently, among other things.


    Minimizing costs associated with providing a desired end-user experience means
    minimizing costs and the time associated with addressing outages and defects.
    Yes, part of this cost is the various testing procedures and frameworks supporting
    the application as these prevent defects in the first place. However, no matter
    how robust your testing procedures and frameworks, defects will surface in production.
    Minimizing costs for defects this point means minimizing investigation time and
    the time involved in diagnosing, fixing, and testing the fix for the issue.


    # STREAMLINING INVESTIGATIONS FOR APPLICATION DEFECTS


    Defects are reported by users and in many cases the application itself through
    generating exceptions. If logging and notifications are put in place, it''s possible
    for application support personnel to be alerted to a system-generated exception
    before it is reported by end users. Furthermore, not all defects are reported
    by end users. There are many reasons for this: it takes time they may not have,
    may incorrectly assume somebody else has reported the defect, or it may be the
    response on reported defects is less than desired so they don''t bother them.
    The point is that some defects will only be reported via system exception.


    User-reported defects can be accompanied by system-generated exceptions. While
    system-generated exceptions are more detailed and can provide more reliable information
    to developers, it''s not always easy to infer from an exception exactly the user
    is being affected. It''s important to note that not all application defects will
    produce an exception. Having the ability to increase the logging level (e.g.,
    to debug) in production at runtime is valuable.


    Prioritize defects using the number of system-generated exceptions produced by
    that defect. The number of exceptions is usually a good indicator of how often
    users are experiencing the defect. By prioritizing defects producing the larger
    number of system-generated exceptions, you help the most people the soonest. Admin4
    can help you summarize exceptions and let you know which exception type/defect
