    \ Component Layer |\n| --- | --- | --- | --- | --- |\n| | | Web Services or EJBs\
    \ | Servlets, Controllers, Managed Beans | HTML, JSPs, Template Markup | |\n|\
    \ | | Business Logic Layer | | |\n| | | Data Access Object(DAO) Layer | | |\n\
    | | | Database DAOs | XML Access Objects (XAOs) | File DAOs | |\n\nBecause the\
    \ application architect is responsible for establishing coding standards and guidelines\
    \ and for mentoring staff, this chapter provides several implementation tips and\
    \ techniques for value objects and entities. Additionally, the chapter explains\
    \ several concepts needed for effectively structuring value objects and entities.\
    \ And to make implementing these recommendations easier and less time consuming,\
    \ the chapter presents a base value object class, which I have included in the\
    \ source bundle (architect.handler.common.BaseVO). As we will discuss, it's much\
    \ more difficult and dangerous to provide such a base class for entities.\n\n\
    # IMPLEMENTATION TIPS AND TECHNIQUES\n\nAlways implement java.io.Serializable.\
    \ For a value object or entity to be usable as any type of distributed object,\
    \ such as enterprise beans or SMI services, it needs to implement Serializable.\
    \ There are no methods required by Serializable, so implementation is easy. You're\
    \ better off not putting anything—such as a database connection—in a value object\
    \ isn't serializable. But if you must put a non-serializable object in a value\
    \ object, declare it transient so it's bypassed during any serialization attempts.\
    \ Listing 9.1 is an extract of value object code.\n\n# Listing 9.1: Sample Value\
    \ Object Code\n\n```\npublic class SalesSummaryVO implements Serializable,\n \
    \   Comparable<SalesSummaryVO> {\n\n    private static final long serialVersionUID\
    \ =\n        -4099990023592442788L;\n\n    private String salesRegion;\n```"
