    try to fix the problem yourself.


    Identify competitors to the open source product. This shortens the time it takes
    to switch components when you need to do so. It also helps due diligence in the
    product search.


    # COMPONENT USAGE GUIDELINES


    Whether a third-party component is open source or not, one of your goals should
    be minimizing business risk. A large part of that is keeping switching costs small
    so that if a mistake is made, it will be easier to correct.


