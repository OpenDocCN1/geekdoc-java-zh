    # Switching Costs. No matter what your product choice is today, it''s always possible
    that your requirements will change or that the product you chose will be depreciated
    in the future or become obsolete. In that case, any applications using that product
    will need to be changed to a competing product instead. Because of this, products
    that can more easily be switched out to a competitor should receive a higher rating
    than those that can.


    There''s no objective measurement for switching costs. I usually assign a high,
    medium, or low rating based on a brief survey of product documentation examples.
    In the case of web services frameworks and web presentation frameworks, switching
    costs for all products are high and cause products to receive a low rating. Because
    this factor does not differentiate any of the products, it''s not important when
    discussing web presentation or web services frameworks. I mention it because it
    does differentiate types of products and should be considered.


    # Expected Cost Savings (over a custom solution). A custom solution is always
    an option, but not always an attractive one. In order to estimate expected savings
    of choosing one product or another, you need a comparison base. That is, choosing
    product 1 over product 2 will save us 200 hours of work. But, to provide such
    an estimate, you need to have a product to compare to. I usually choose a custom/homegrown
    solution as that comparison product.


    Having said that, the custom solution—let''s say for publishing a web service—does
    not replicating all functionality in the Apache Axis2 product, per se. It means
    producing a method just good enough to publish only what''s needed for your project.


    If you choose the same comparison base product (e.g., a custom solution) for all
    products in consideration, then expected savings becomes comparable. The product
    with the most savings will be rated the highest, and the product with the least
    savings rated least.


    As an example, at a recent client, we needed to implement a single signon (SSO)
