  md: '# FINDING YOUR WAY WHEN TECHNOLOGIES CHANGE


    One of the challenges of being an application architect in the Java EE space is
    keeping up with the sheer number of third-party frameworks, tools, and libraries
    available, and the speed at which they change. Because of this, published works
    on computer technology topics become out-of-date soon after they are published.
    Many of the best practices and advice presented in this book, and any other published
    work, rely on features and toolsets available in the Java EE space today. As technologies
    advance, the practices and advice presented in any published work in the computer
    technology space will at some point need revision and updating.


    It’s time to take the conversation up a level and look at how advice and list
    of best practices were derived; best practices and good advice are not arbitrarily
    created.


    Application architecture, including the best practices and advice presented in
    this book, is guided by an underlying set of fundamental principles. These principles
    can be used to help you make architecture and design decisions not only now but
    also the road, as new frameworks, tools, and libraries become available and existing
    technologies advance. I’m not the first by any means to attempt to document application
    architecture principles. I also don’t claim that my list of principles is comprehensive;
    I have purposely reduced the set of principles to those that are the most important
    and the most used.


    A principle is a primary law or truth that can be used to derive other principles.'
