    # NONFUNCTIONAL REQUIREMENTS


    All project requirements discussed so far are functional requirements. Functional
    requirements define what the application is expected to accomplish. Nonfunctional
    requirements specify constraints on how the application will accomplish functional
    requirements. For example, a functional requirement might be that the application
    will allow a user to run a predefined report; whereas a nonfunctional requirement
    might be that all predefined reports should run within sixty seconds. Another
    example: a functional requirement might be that the application will allow a user
    to save a change to a customer account; whereas a nonfunctional requirement might
    be that backup needs for the application and that any saved transaction needs
    to be recoverable in the event of a hardware failure.


    Typically, there will not be use cases or user stories for nonfunctional requirements.
    However, nonfunctional requirements occasionally impact functional requirements.
    For example, I received a functional requirement enhancement request to allow
    customer representatives to view users'' passwords so they could communicate a
    user password if the user had forgotten it. I informed them that there was a management
    directive that passwords were never to be stored in an unencrypted format. Furthermore,
    it was not possible to decrypt passwords with the encryption method used. The
    directive to encrypt passwords in such a way that they cannot be decrypted is
    an example of a nonfunctional requirement. In this case, a nonfunctional requirement
    definitely impacted a functional requirement.


    # IMPROVING YOUR ANALYSIS SKILLS


    Sometimes developers and junior architects have trouble acquiring the analysis
    skills needed to write good user stories and use cases. Business analysis requires
    good communication skills, both written and verbal, which not all developers have
    acquired. It requires that you be able to express a problem in business terms,
    leaving all technical terms (e.g., file, field, etc.) behind. It is an area that
    is not nearly as objective and precise as coding. Nonetheless, the ability to
    write effective use cases and user stories is a skill all architects need to develop.
    If you think it necessary, here are some things you can do to improve your analysis
    skills.


    Get a mentor. Choose somebody, preferably working at the same organization, whose
    business analysis skills you respect. Have your mentor review your use cases,
    user stories, or whatever document your organization uses to communicate functional
    requirements. Often, someone who is not directly involved is more objective and
    can provide you with valuable feedback.'
