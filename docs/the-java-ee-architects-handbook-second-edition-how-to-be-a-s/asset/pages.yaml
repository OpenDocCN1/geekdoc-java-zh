    Establish performance targets for common application features. Performance tuning
    is an activity that doesn''t have to end. Furthermore, all tuning efforts diminishing
    returns over time. Tuning only activities that are not meeting performance targets
    is a good way to make the resources devoted to tuning cost effective.


    Performance tuning benefits follow the 80/20 rule. That is, the first 20 percent
    of a performance tuning effort provides 80 percent of the benefit. As a performance
    tuning effort progresses, incremental improvements get smaller and smaller. For
    example, at the beginning of a tuning effort, identifying tuning opportunities
    that increase throughput 5 percent or more is common. At the end of such an effort,
    identifying opportunities that increase throughput more than 1 percent can be
    a challenge.


    Performance tuning activities should be planned for the UAT testing phase of the
    project. A common mistake developers makes is to performance tune as they develop.
    Tuning during development often results in tuning code that is insignificant or
    doesn''t represent a large enough target to provide costeffective benefit to the
    performance tuning exercise.


    Thread dumps taken at high load can be used to identify hot spots within your
    application. Hot spots are sections of code that are executed most frequently.
    Consequently, tuning hot spots provides more benefit than tuning code executed
    often.


    For those who may not immediately see how thread dumps identify hot spots, how
    a profiler works. A profiler works by taking a thread dump at a regular interval
    (say every 5 milliseconds) and recording what classes/methods are currently being
    called within that dump. For Foo.doWork() is executing in an active thread in
    one of these intervals, the time allocated to Foo.doWork() is incremented and
    the percentage of time spent in Foo.doWork() is computed from that allocated time.
    The more intervals in which Foo.doWork() appears, the higher percentage your profiler
    assigns to it and the more it appears to be a hot spot your profiler identifies
    as a tuning opportunity. The more threads in at high load, the higher percentage
    of time spent in that method and the more benefit will be realized by tuning it.
    Thread dumps taken at high load will not replace your profiler, but they can often
    identify performance tuning activities worth pursuing.'
