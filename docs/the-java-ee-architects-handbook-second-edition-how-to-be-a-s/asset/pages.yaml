    \ for XML Beans is very short.\n\nApply XML technologies consistently throughout\
    \ the application. Whatever your technology choices are, there is a tremendous\
    \ benefit to consistency. For instance, if the developers of your application\
    \ prefer JDOM and are comfortable with that choice, you have little reason to\
