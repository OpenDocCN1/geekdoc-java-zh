  md: 'They often instantiate and use classes in the data access layer, such as those
    discussed in the previous two chapters.


    # BUSINESS CODING PATTERNS


    The first and simplest coding pattern commonly used in the business logic layer
    is the Transaction Script pattern, as described by [Fowler]. This pattern organizes
    application code into a series of discrete transactions. For example, consider
    normal banking transactions you might conduct at an ATM machine. Behind the entering
    of my passcode, there very well might be a transaction script that verifies the
    passcode I entered belongs to the card I presented. Behind my cash withdrawal,
    there might be a transaction script to verify my account balance, record the withdrawal
    transaction, and tell the ATM machine I can take at an ATM machine could be divided
    into a series of discrete transactions. Beyond this banking example, it is possible
    to look at all applications as a series of transactions that accept input and
    a predefined set of work activities.


    The Transaction Script pattern is frowned upon by many as being simple. Having
    arbitrarily complex code (e.g., spaghetti code) than I would like, I see simplicity
    as a good attribute, not as a disadvantage. For simple to moderately complex tasks,
    the Transaction Script pattern is completely appropriate. All business applications,
    regardless of size, have features that fall into the simple to moderately complex
    category. In fact, most features for most business applications fall into this
    category.


    Because of its simplicity, the Transaction Script pattern is easy to teach, even
    to very junior developers. Code following this pattern is usually easy to understand.

    However, the Transaction Script pattern is also disliked by many, as it isn''t
    truly object oriented. In fact, it doesn''t come state with a set of related actions.
    Transaction script classes do not have state (e.g., fields). They accept inputs,
    often in the form of entity or value object form, and they utilize DAO layer classes
    to perform reads or writes. Object-oriented code tends to combine application
    data with the actions in the same class or set of classes. In this light, the
    Transaction Script pattern can be seen as a throwback to procedural programming.


    Classes implementing the transaction pattern serve as classification categories.
    For example, a collection of transaction scripts to manage bank accounts transactions
    might be called `AccountScripts` or `AccountManager`. These classes do not have
    state. In fact, most methods on these classes can be declared as `static`.


    It is possible to reuse code using the Transaction Script pattern. In large business
    applications, some transactions will be composite transactions. That is, they
    will make use of other existing transactions. To return to the ATM'
