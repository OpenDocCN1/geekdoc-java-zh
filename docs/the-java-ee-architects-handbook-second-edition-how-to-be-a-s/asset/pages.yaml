  md: '# Chapter 16: Testing Guidelines and Strategy


    Where do I put my unit tests? This should be established by the application architect
    with input from all developers. I usually define a “test” source folder for every
    application where the unit tests reside. Most Integrated Development Environments
    (IDEs) have rich unit testing support for Junit. For example, in Eclipse, you
    can right click on a source folder and run all unit tests contained in it. The
    package structure of the test folder should mimic the package structure of the
    main source folder. I usually specify that test classes contain the name of the
    class under test (e.g., CustomerDAOTest) and exist in the same package as the
    class under test (so protected methods can be tested as well).


    How often are unit tests expected to be run? Who fixes them when they break? Ideally,
    these unit tests run in some automated fashion at least once a day. The trouble
    really comes when a unit test breaks. The conventional thinking is that the developer
    who checked the code responsible for the breakage should fix it. However, in an
    active project, it’s not always obvious who checked the mistake that broke the
    unit test. For example, there might not be an offending check-in; a developer
    could have changed the input data that the particular test relies on. Also, in
    an active project with looming deadlines, the fixing test cases gets lower priority.


    Often, the application advises the project manager on this topic but doesn’t unilaterally
    decide the answer, as managing tasks are assigned to which people is really the
    project manager’s responsibility.


    One option is to rotate the responsibility for fixing unit test breakage. This
    is often easier to manage as the project manager can expect less from them when
    they are on test patrol. It punishes developers who check in code that breaks
    the unit tests by embarrassing them (e.g., calling attention to their mistakes
    by calling the attention of others to them). Therefore, it provides an incentive
    for developers to not check in code that breaks unit tests. Unfortunately, it
    also provides an incentive for developers to “comment out” unit tests so they
    aren’t embarrassed.


    What environment are my unit tests expected to run in? Most applications require
    external resources, such as databases. Usually, I maintain a database that serves
    development tests and unit tests and a separate database for automated integration
    tests. Some organizations have developers maintain their own databases for development,
    but that’s an inefficient use of time. By definition developers aren’t database
    administrators and can’t solve database environment issues as quickly. It’s more
    efficient to have one person with these skills maintain an environment for everyone.


    What unit testing tools are in the technical stack and are available for use?
    Some additional tools are needed to support unit tests. The JUnit testing framework
    (http://www.junit.org/) appears to be the most popular and is the'
