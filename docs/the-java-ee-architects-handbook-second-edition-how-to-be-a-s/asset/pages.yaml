  md: '# APPLICATION ARCHITECTURE STRATEGIES


    To ensure that your applications have internal consistency, you need to establish
    strategies from the outset for logging, exception handling, threading, and configuration
    management. Most developers have preferences for each of these areas. If your
    team has many developers and you let them use their preferences, you will create
    an application that is internally inconsistent and harder to maintain. This chapter
    offers strategies for each aspect of application architecture. In this section,
    I''ve articulated examples of strategies I''ve used in the past. Once you establish
    the strategy, don''t be afraid to refine it with additional detail to suit the
    needs and comfort level of your developers.


    # LOGGING STRATEGIES


    Application classes should not depend on a specific logger. General-use components
    should be able to use any logging package an application adopts. This can be done
    by having one class in the application acting as a log proxy, delegating the log
    write to Log4J, JDK Logging, or one of the other logging packages. Listing 15.1
    is an example of an application proxy implementation.'
