    | --- | --- | --- | --- | --- | --- |

    | Caller platform requirements | Java-compliant only | Any | Any | Java-compliant
    only | Any |

    | Communication method supported | Synch. only | Both | Both | Synch. only | Synch.
    only |

    | Coupling | Tight | Loose | Loose | Tight | Loose |

    | Supports clustering for scalability and availability? | Yes | Yes | Yes | No
    | Yes |


    Faced with deciding on which deployment wrappers to use and which business objects
    to publish, ask yourself the following questions; your answers will help you navigate
    through the decision-making process.


    **Is your business object called from applications that aren’t Java?**


    This functionality is commonly published as a web service. Web services completely
    eliminate any language-to-language restrictions by encoding all communication
    in XML using a SOAP format. Because web services don’t'
