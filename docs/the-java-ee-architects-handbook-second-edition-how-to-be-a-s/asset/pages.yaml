    # # BUILDING DATA ACCESS OBJECTS


    Data access objects read and write saved data and convert that format to entities
    usable by other layers in the application. You can think of them as “factory”
    classes for entities. For example, CustomerDAO, a DAO in a purchasing application,
    reads customer information from a database or other form of saved storage and
    converts that information to entities (e.g., CustomerEntity) that the rest of
    the application can use. CustomerDAO also uses information in CustomerEntity to
    update or insert data into the database or file. The following are some methods
    CustomerDAO might have:


    ```

    public CustomerEntity findById(Long customerId);

    public void saveUpdate(CustomerEntity customer);

    public void delete(Long customerId);

    public List<CustomerEntity> findByPartialName(String name);

    ```


    All logic that interprets and processes data is in the business logic layer, not
    in the data access object layer. The DAO merely handles the I/O. It should be
    noted that most classes in the DAO will target relational databases, any form
    of persistent storage should be managed at the data access layer. In other words,
    access to NoSQL databases should reside in the data access layer as well. There
    are several reasons for segregating data access.


    First, it promotes reuse. For example, there might be useful cases in an application
    that need to read and process purchase order information. Segregating data access
    makes the example DAO usable for all of those processes.


    Second, together with your package structure (which separates DAO classes into
    a separate package) it allows developers to quickly find data access that might
    need to be changed or enhanced.'
