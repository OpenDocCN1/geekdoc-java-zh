    Always populate all fields of a value object or entity. For the sake of convenience,
    don''t take the trouble to populate all fields of a value object or entity if
    they only need a subset of the fields in it. This is less likely than with entities
    as usually are populated by the JPA implementation. In my experience, this practice
    saves time during construction, but it inevitably causes bugs that show up as
    NullPointerException when something attempts to use a field that is not populated.
    Furthermore, partial population of a value object or entity creates an inconsistency
    that developers will find confusing. I recommend either populating all fields
    of a value object or creating a new value object with the new field set.


    Always type fields accurately. I''ve often seen programmers implement dates and
    strings, usually to save time when initially coding a value object or entity.
    The motivation for this is facilitating display or the coding of a specific process.
    But as the application gets larger, this practice can cause confusion and inevitably
    results in additional conversion code where the field is used. It also leads to
    confusion for maintenance and causes bugs, because someone will format the strings
    inappropriately.


    Check dependence on third-party classes in value objects. Value objects are used
    as arguments for distributed objects, such as enterprise beans and RMI services.
    If your value objects rely on third-party classes, your callers will have to include
    them in their class path to call. This can be an inconvenience for your callers
    and make your distributed objects harder to use.


    Always override method toString(). If you don''t override toString(), the resulting
    text is not very meaningful. An example from the default implementation of toString()
    is com.myapp.Test@31793c.


    Since there are enough classes in the JDK that accept Object arguments and expect
    to be able to execute method toString(), you should provide an implementation.
    The implementation of toString() inherited from Object isn''t all that useful.


    Consider overriding methods equals() and hashCode(). If a value object is ever
    used as a key in a HashMap, Hashtable, or HashSet; equals() and hashCode() are
    used for key identification. The definition of these methods, inherited from'
