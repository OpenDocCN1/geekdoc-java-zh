  md: '# Chapter 3: Scope Definition and Estimation


    The time you spend estimating has diminishing returns. No matter what, the actual
    number of hours you work to complete the project will differ from your estimate.
    Applying more time to the estimation process will not make your estimate more
    accurate in most cases. This is an uncomfortable thought to many developers new
    to estimating, but it’s one of truisms that developers just have to live with.


    Those agile methodologies with shorter development iterations will have lower
    estimates. However, the same concepts apply. If the story is to add a feature
    to an existing application, use estimates from past stories where you have historical
    data.


    # TRACKING THE ESTIMATE


    If, in your application architect role, you are filling the role of project manager
    as well, you should track your progress against the estimate on a periodic basis.
    Tracking your progress gathering the number of hours developers are actually spending
    on assigned tasks and comparing those hours to what was estimated.


    Estimate tracking documents the extent to which the project is on-time and on-budget.
    Most projects don’t become two months in one day—it’s a symptom that appears over
    time. Most executives can accommodate a timeline if they see the problem far enough
    in advance.


    Estimate tracking documents the effect of re-allocating resources to other projects.
    By tracking only those hours that are devoted to your project, you can alert management
    if not enough time is being given to your project to fulfill the timeline. I’ve
    often been able to defend projects that were delivered later than planned by by
    pointing out that they weren''t late at all in terms of the work performed. The
    project was late because resources were allocated to other projects—not because
    the team was mismanaged.


    Tracking estimates enables you to improve them on future projects. For example,
    if I consistently underestimate the work involved in adding new screens/pages
    to an existing application, I may increase my estimates for similar tasks in future
    projects.


    I tend to track progress weekly and include a progress summary (whether my team
    is ahead or behind) in my status report. Tracking progress weekly is often enough
    to be useful to management, but not so often that it consumes a large amount of
    time. Publishing your progress in your status report ensures that management isn’t“surprised”
    by a late delivery. It also documents the effect should some of your resources
    be diverted to other projects.


