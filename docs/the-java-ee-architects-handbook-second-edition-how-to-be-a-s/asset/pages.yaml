    # SHORTCUTS


    Over the years, I''ve adopted several shortcuts that decrease the time and effort
    required in the object-modeling phase.


    Assume that all documented attributes will have accessors (get methods) and mutators
    (set methods). This simplifies the model and eliminates a lot of busywork. It
    also makes the model easier to read and thus more useful. For example, if you
    document that CustomerVO class has a lastName attribute, you should be able to
    access the existence of getFirstName() and setFirstName() methods without explicitly
    documenting them in the model.


    Omit relationships to objects in the JDK. Including these relationships adds very
    little value but a lot of complexity, making the model hard to read. For example,
    many attributes in the JDK are strings. Technically, any class containing a string
    attribute should have a relationship to the java.lang.String class.'
