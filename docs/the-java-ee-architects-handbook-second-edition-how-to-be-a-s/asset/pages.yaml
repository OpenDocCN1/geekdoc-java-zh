  md: '# # CREATING

    THE DATA MODEL


    Most books about Java EE skip the data-modeling and relational database design
    phases of development. But I have found that both steps are critical to the success
    of a Java EE application. As part of the development team, an application architect
    should have a basic knowledge of data modeling. Further, in some companies, the
    architect is responsible for designing the code, data database designs. Just as
    object-modeling exercises help produce good code, data-modeling exercises help
    produce good database designs.(I have to admit, however, that the many years I
    spent as a database designer and administrator may have prejudiced my views as
    to the importance of data modeling.)


    Even if your organization delegates relational database design and data modeling
    tasks to a separate team, application architects should understand data modeling
    concepts. In an organization with separate modeling teams, the application architect
    usually communicates requirements and coordinates with that team to get the database
    designed and implemented. Understanding data modeling concepts will allow the
    architect to streamline this process.


    I also rely on these concepts when modeling the entity layer, as most object modeling
    technologies rely on a one-to-one correspondence between entity classes and database
    tables. For example, a banking application with a database table called Account
    might be mapped to a Java class in the entity layer called AccountEntity. In fact,
    creating a database model for the entity layer in the application can make modeling
    much easier. It is not unusual for data modeling and object modeling activities
    to occur concurrently.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Chapter 7: Creating the Data Model


    As the data model (and resulting database design) greatly impacts the design of
    the entity layer of your application, a poor database design will create coding
    problems and difficulties. I have seen poor database designs inflate the amount
    and complexity of application code produced. With increased complexity often comes
    an increased frequency of bug reports and a larger resource requirement to diagnose
    and fix those bugs. Ensuring that developers are working with a high quality data
    model (and resulting database design) should be a high priority for application
    architects.


    In addition, I find data-modeling concepts very useful in designing XML document
    formats, such as DTDs and schemas. Applying data-modeling concepts to XML document
    design is bit unconventional. The thought before deciding if a data item is an
    element or an attribute is very similar to deciding between entities and attributes
    in data modeling. In addition, one-to-many relationships in data modeling translate
    directly to the child element element in XML documents. I will provide some details
    and examples in this section to show how you can implement data models as XML
    document formats.


    The popularity of NoSQL databases has grown in recent years, I don''t see any
    signs that relational database technologies will be replaced any soon. NoSQL databases
    are targeted at extremely large data stores that don''t have the transaction guarantees
    that relational databases do. In other words, NoSQL databases are used in cases
    where approximate answers are acceptable. Furthermore, as NoSQL products vary
    widely and have drastically strengths and weaknesses, any advice on how to design
    NoSQL databases tends to be specific. For NoSQL databases has this article: http://highlyscalable.wordpress.com/2012/03/01/nosql-data-modeling/.
    For now, because relational databases are part of most Java EE applications, most
    application architects need to have at least a basic understanding of relational-modeling
    concepts. The rest of this chapter will focus on relational databases.


    If you''re more comfortable with data modeling than object modeling, feel free
    to take the easier path by doing data-modeling activities before object modeling.
    All the entities (defined in the next section) in the data model are potential
    identifications of classes in the entity layer. The two modeling disciplines use
    different terms, they are quite similar conceptually.


