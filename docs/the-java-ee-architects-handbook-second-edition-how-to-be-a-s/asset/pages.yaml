    | | | Database DAOs | XML Access Objects (XAOs) | File DAOs | |


    # COMPONENT QUALITY


    High-quality architectural components have the following capabilities:


    +   - Shorten development time and effort

    - Shorten expected maintenance time and effort

    - Work in many applications because they are generic

    - Work as advertised


    These traits are desirable for any component software, whether components are
    commercial, open source, or authored by you.

    A common guideline people use when judging software is: if they have to consult
    a manual to do basic tasks, they judge the software "too hard to use." You can
    use much the same standard when assessing component software. I consider component
    software difficult to use if either of the following is true:


    +   - You have to read more than two pages of material to install and configure
    the component.

    - It takes more than an hour from installing to using the component for a basic
    task.'
