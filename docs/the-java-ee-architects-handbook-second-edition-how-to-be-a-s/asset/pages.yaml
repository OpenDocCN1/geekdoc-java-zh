    records accurate.


    Make retry procedures mechanical. For transmissions that a user isn''t physically
    waiting for, I often put a scheme for automatic retry logic in place. Environmental
    problems occur often enough in most companies to warrant including selective retry
    logic to recover from outages more quickly and with less effort. The objective
    of the retry mechanism is to automatically recover from a temporary outage without
    manual intervention by an application administrator.


    The potential for complexity lies in discriminating between temporary outages
    and errors that won''t magically go over time. It''s possible to take a shotgun
    approach and assume that all errors occur as a result of a temporary outage, and
