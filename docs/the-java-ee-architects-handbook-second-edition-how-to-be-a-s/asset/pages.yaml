  md: '# Overview of the Layering Concept


    physically reads and writes data may change without affecting application processing
    or business logic.


    To continue the inventory management example, suppose the data access layer had
    a method to look up the information for an inventory item given a UPC code. Suppose
    that other parts of the application use this method when information about items
    is needed (e.g., a customer viewing that item on a web page or an inventory analyst
    ordering stock for that item). As long as the methods for accessing item information
    remain the same, you should be able to reorganize how you can store information
    about items and warehouses without affecting the rest of the application.


    In essence, a layered approach mitigates the risk of technical evolution. If you
    use this concept to separate your deployment mechanics (e.g., Java Server Faces
    or Struts), you can add new deployments without changing your business logic or
    data access layer—for example, if you decide to expose application functionality
    via web services. If your application effectively separates your business logic
    and data access from the rest of your application, you can freely add a services
    deployment without having to change the entire application. Table 5.1 lists common
    software layers used in Java EE.


    # Table 5.1: Typical Software Layers in Java EE Applications


    | LAYER | ROLE |

    |---|---|

    | Data access object layer | Manage reading, writing, updating, and deleting stored
    data. Often contains JDBC code, but could also be used for XML document and file
    storage manipulation. |

    | Business logic layer | Manages business processing rules and logic. |

    | Entity objects layer | Lightweight structures that are mapped directly to database
    tables. |

    | Value objects layer | Lightweight structures that facilitate display of summarized
    business information. |

    | Deployment layer | Publishes business object capabilities. |

    | Presentation layer | Controls display to the end. |

    | Architectural component layer | Generic application utilities. Often, these
    objects are good candidates for enterprise-wide use. |


    Software layering implements an architectural concept called the separation of
    concerns. The separation of concerns principle states that software components
    should have a single focus and be concerned with only what they need to accomplish
    and nothing more. Furthermore, the focus of one software'
