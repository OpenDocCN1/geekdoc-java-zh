  md: '# Chapter 6: Creating Object Models


    Don''t document formal relationships to value objects or entity objects. VOs and
    entities have so many relationships that if they are documented, the model becomes
    unreadable and unusable. After all, the purpose of creating the class diagram
    is to make the application easy for the team to understand and implement. In any
    case, VO relationships are easy for developers to figure out from the method signatures.


    # IDENTIFYING ATTRIBUTES


    Attributes are fields that a class contains. At a code level, attributes are instance-level
    variable declarations. Most attribution occurs with VOs, with other object types
    receiving little attention.


    Ideally, attributes should be base, not derived. A base attribute is atomic—that
    is, its value is not derived from the value of other elements or the result of
    a calculation. Conversely, a derived attribute is made up of the values of other
    elements. For example, consider a CustomerVO that has firstName, lastName, and
    fullName attributes. The attribute fullName is derived because it is made up of
    the first and last names.


    Avoid declaring derived attributes. Derived attributes, like fullName mentioned
    in the previous paragraph, only get you more to maintain. If a customer changes
    his or her last name, the value of two attributes need to change. Instead of making
    fullName attribute, it would be better to create a convenience method, such as
    getFullName(), that does the concatenation.


    # IDENTIFYING METHODS


    Methods are where the action is. Methods are invoked primarily when a user does
    something, when something was scheduled occurs, and when something is received
    from an external interface. A common way to identify methods is to analyze each
    event and determine the methods needed along the way. During the course of identifying
    the methods you''ll need, you''ll usually identify classes.


    Starting with user actions, I screens from the prototype to drive method identification.
    Consider an application login as an example. Most applications customize the main
    screen based on a user''s identity and preferences. For the moment, assume that
    authorization and authentication is provided by the enterprise architecture and
    not at an application level. Further assume that you need to invoke something
    that will get user specifications from the security package, invoke something
