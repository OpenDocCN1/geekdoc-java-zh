    Document any assumptions made in determining project scope. There are usually
    unknowns about project requirements at this stage. Often it is not possible to
    pause the project while the unknowns are investigated. In these situations, I
    make my best guess as to what the requirements are and document those guesses
    as assumptions. It is imperative that management and the product manager or other
    business representatives be provided copy of those assumptions. Should the assumptions
    be incorrect, you''ll be notified and changes to the scope and resulting estimate
    can be made.


    In the context of agile methodologies, such as XP or Scrum, the "project" is more
    likely to be referred to as an "iteration" and tends to be of smaller size. Note
    that agile methodologies advocate fixing scope for the iteration that''s currently
    in development. Agile methodologies accommodate change by providing flexibility
    (allowing changes in scope) to iterations currently not in development.


    # BASICS OF ESTIMATING


