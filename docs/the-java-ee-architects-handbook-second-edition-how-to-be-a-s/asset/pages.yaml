    ```\n\nThe problem with the code in listing 10.4 is that it circumvents database\
    \ optimizations provided by Oracle, DB2/UDB, and many others. To get the benefit\
    \ of database software optimizations, you need to use PreparedStatement objects\
    \ instead of Statement objects for SQL that will be executed multiple times. Further,\
    \ you need to use host variables instead of literals that will change between\
    \ executions. With listing 10.4, the SQL statement for Customer Id 1 will be different\
    \ from \"where Customer_Id = 2\" (where version of the update statement in listing\
    \ 10.3 is much better).\n\nNotice that listing 10.3 uses variables instead of\
    \ literals, the SQL statement is identical no matter what the qualifying user\
    \ ID is. Further, a PreparedStatement is used instead of a Statement.\n\nTo better\
    \ understand the database optimizations possible when using PreparedStatement\
    \ objects, consider how Oracle processes SQL statements. When executing SQL statements,\
    \ Oracle goes through the following steps:\n\n+   Look up the statement in the\
    \ shared pool to see if it has already been parsed or interpreted. If yes, go\
    \ directly to step 4.\n\n+   Parse (or interpret) the statement.\n\n+   Figure\
    \ out how to get the desired data and record the information in a portion of memory\
    \ called the shared pool.\n\n+   Get the data. When Oracle looks up an SQL statement\
    \ to see if it has already been executed (step 1), it attempts a character-by-character\
    \ match of the SQL statement. If the program finds a match, it can use the parse\
    \ information already in the shared pool and does not have to do steps 2 and 3\
    \ because it has done the work already. If you hard-code literals in SQL statements,\
    \ the probability of finding a match is very low (\"where Customer_Id = 1\" is\
    \ not the same as \"where Customer_Id = 2\"). This means that Oracle will have\
    \ to reparse listing 10.4 for each portfolio selected. Having a PreparedStatement\
    \ (like \"where Customer_Id = :1\" in the shared pool) would have been parsed\
    \ once and only once.\n\nDB2/UDB uses different terminology but a similar algorithm\
    \ for dynamic"
