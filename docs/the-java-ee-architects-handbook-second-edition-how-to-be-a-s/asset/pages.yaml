  md: '# Chapter 5: A Layered Approach to Java EE Design


    represent a programmatic coupling, they need very little deployment coordination.
    Web services are widely used and often the preferred deployment wrapping technology.


    If your messaging vendor supports JMS and also has a native API for the foreign
    application platform, you should be able to deploy this functionality as a message-driven
    enterprise bean.


    Does your business object receive and process messages via JMS?


    Functionality supporting JMS message receipt and processing is commonly implemented
    via a message-driven enterprise bean. That bean utilizes business logic classes
    to perform whatever work is required to process the message. Although the JMS
    standard was created and refined in the last few years, messaging technology has
    existed for more than a decade. Most messaging technology vendors have implemented
    the JMS interface. Messaging is good for transmitting information. This technology
    is designed more to guarantee delivery than issue a sub-second response time.


    Does your business object require two-phase commit functionality?


    If it does, deploy the business object as a session bean. Two-phase commit functionality
    requires JTA and is provided by Java EE containers. Web services or servlets running
    from within a Java EE container will have access to JTA, but these deployments
    may be used in environments that do not support JTA.


    # Common Patterns


    The pattern commonly used for deployment wrappers is a combination of the session
    facade pattern and the proxy pattern. This combination (or slight variations)
    works for all the deployment wrappers that I can think of. The session facade
    pattern is especially popular with EJB deployments, but the concept is valid for
    most types of objects.


    Two common design goals for deployment wrappers as enterprise beans or web services
    are to minimize network traffic and minimize changes. Faces minimize network traffic
    by allowing the published functionality to be coarse-grained. That is, using facades,
    remote calls to the remote service can initiate processing of business logic over
    a larger amount of data or combine lower business logic features in a single call.
    It is often more important to minimize the number of calls to remote services,
    even if some of the data in these calls or returns from those are larger as a
    result.


    Facades allow you to minimize changes in features published to remote callers.
    That is, it preserves the ability to refactor and change the business logic layer
    or other layers of the application and keep the facade publishing functionality
    to remote applications unchanged. This is customer friendly in the sense that
    the service''s remote applications are changing less frequently. It also preserves
    your ability to refactor and change the application publishing the service without
    accidentally impacting customers.'
