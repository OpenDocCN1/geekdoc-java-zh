  md: '# 186 Chapter 14: Building Architectural Components


    class. Continuing with the logging product example, I often create an Logger class
    that serves as a proxy for an underlying logger provided by one of the logging
    products. As application code relies solely on the proxy class, it''s fairly easy
    to change logging products if needed as it''s only the proxy that needs to be
    changed.


    Another example of this concept is scheduling packages. Quartz (http://quartz-scheduler.org/)
    is the product I usually leverage, but there are several competing products available.
    If enterprise scheduling considerations arise, it''s possible that the scheduling
    product might be changed. Usually, I provide a base class that implements any
    needed interfaces required by the scheduling package. Hence, this base class is
    the only class that directly interfaces with the scheduling package and can easily
    be changed to use a different package instead.


    Some third-party products have too broad a scope for a proxy technique to be effective.
    For example, Apache Commons Lang, Collections, and BeanUtils packages utility
    libraries. The work involved to create proxy classes for all the utilities would
    be extensive, as the scope of these libraries is very broad and would provide
    very little benefit since these products have no direct competitors.


    You can use this technique with virtually any software component. Remember that
    you also limit reliance on any third-party component exception classes so that
    your application relies on internal classes, not external ones. To accomplish
    this, have the proxy surround usage of the underlying product with a try/catch
    block. Any component-based exceptions generated can be converted to application-based
    exceptions and prevent unwanted reliance on third-party exception classes.'
