  md: '# SECTION III


    # BUILDING JAVA EE APPLICATIONS


    Once the design is complete, the application architect is often asked to guide
    application construction. Activities that are the direct responsibility of the
    application architect during construction include setting coding standards; mentoring
    junior developers through more difficult programming tasks; and establishing conventions
    for logging, exception handling, and application configuration. In addition, the
    architect (or senior developer) is usually responsible for coding any custom architectural
    components the application requires because of the difficulty involved in the
    task.


    This section guides you through the application construction process. In it, you
    will learn how to:


    +   - Establish coding conventions for all software layers.

    - Choose a database persistence method (e.g., JDBC, JPA, etc.).

    - Set conventions and guidelines for transaction management.

    - Understand how to make architectural components easy for developers to use.

    - Set guidelines for logging, exception handling, threading, and configuration
    management.


    The first edition of this book relied on an open source


