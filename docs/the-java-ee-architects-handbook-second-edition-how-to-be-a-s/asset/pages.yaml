    # Utilizing Messaging Services


    Messaging services are an asynchronous communication method. That is, a request
    is sent, but a response may not be immediate. The Java EE provides formal support
    for messaging by a construct known as Message Driven Beans. Essentially, the container
    will act as a JMS message receiver and route all messages to a given destination
    to a class that implements the MessageListener (http://docs.oracle.com/javaee/1.3/api/javax/jms/MessageListener)
    interface.


    The main advantage of Messaging services is that they can guaranteed delivery
    over the fact that JMS messages are asynchronous. That is, the receiving application
    may be down when the message is sent, but when that application becomes available,
    the message will be received and processed. Consequently, applications consuming
    a messaging interface do not need to have an outage strategy. Note that messages
    that are never picked up and processed will eventually be noticed by end users.


    Messaging can be platform neutral, but that depends on the messaging vendor. The
    JMS specification utilized by Java EE messaging is by definition Java-specific.
    However, some vendors implement the JMS interface for Java applications also provide
    for clients using alternative development platforms.


    Messaging is very useful in situations where one application needs to notify another
    application of a particular event. Using one of the other interface methods, external
    applications can "pull" information about that event on a scheduled basis, but
    that usually isn''t as timely. Advantages of utilizing messaging services for
    application interfaces are the following:


    +   - Messaging services provide guaranteed delivery.

    - Messaging services are platform neutral.'
