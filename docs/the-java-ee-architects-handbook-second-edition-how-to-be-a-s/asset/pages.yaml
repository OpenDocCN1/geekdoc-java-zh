    # Retry Procedures


    Once initial development is complete, most errors with interfaces have environmental
    causes. Examples include someone recycling the database or messaging software,
    someone tripping over a network cord, and a server with a full file system. In
    most cases, the error is eventually fixed and the application interface resumes
    proper function.


    However, with most applications, some type of recovery or retransmission procedure
    must be performed for the transmissions that failed. For example, messages recording
