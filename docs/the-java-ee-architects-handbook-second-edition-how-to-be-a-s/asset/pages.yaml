  md: '# Chapter 1: Project Development Team and Project Life Cycle


    general, anything directly involved in producing the user interface is in the
    purview of the presentation-tier developer. Typically in collaboration with the
    layout designer, the presentation-tier developer builds the prototype and develops
    the working version. And with the application architect, the-tier developer and
    graphic designer determine the structure and design of front-end navigation.


    The application architect is responsible for ensuring that design patterns can
    be maintained and extended. Navigation issues are often complex and can easily
    degrade into hard-to-maintain code. The application architect is in a good position
    to identify and correct maintenance issues as well as other technical problems
    that arise.


    # Business Logic Developer


    The business logic developer is responsible for coding all invisible parts of
    the application, including enterprise beans, web services, batch jobs, business
    objects, and data access objects. Some people refer to these invisible parts as
    the server-side components of the application. The business logic developer is
    often a Java specialist who works closely with the application architect and assists
    in tuning as needed.


    The application architect provides guidance for the business logic developer.
    It''s important for business logic to be readable by the presentation-tier developer.
    It''s common for technical issues and problems to arise in server-side components,
    which are usually the most complex pieces of an application. Thus, the application
    architect often acts as a mentor to the business logic developer.


    # Data Modeler


    The data modeler uses information from the business analyst to identify, define,
    and catalog all the data stores in a database. Data modeling typically involves
    documenting application data in entity-relationship (ER) diagrams. The database
    administrator then uses the ER diagrams to produce a physical database design.
    Thus, it is common for the roles of data modeler and database administrator to
    be combined.


    The application architect is responsible for ensuring that the data model is adequate.
    With as business analysis, it''s unreasonable to expect the data model to be 100
    percent complete. If the data model is largely complete and in third normal form,
    future changes in the model (and thus the database) are likely to be minor.'
