    # SCOPE DEFINITION

    AND ESTIMATION


    In most organizations, the project manager works with the business side and management
    to establish project scope and to estimate time and resource requirements. And
    frequently the project manager relies on the application architect for assistance
    in these tasks. The scenario is no different for Java EE applications. This chapter
    is written for architects responsible for helping to define and estimate delivery
    for management. Readers not involved in these tasks can safely skip the chapter.


    # DEFINING SCOPE


    Objectively define project scope in terms of user stories or use cases, and obtain
    the agreement of the business side. Changing scope during a project wreaks havoc
    with timelines and lowers the morale of the development team. When the business
    side makes additional requests after development is under way, acknowledge them,
    record them in a use case, and schedule them for a future release. Often, making
    rough estimates for each use case provides information that the business side
    will find useful in deciding scope.


    Get agreement on the use cases from the project sponsor. As use cases are written
    in business terms, they can be used as a “contract” with the business side and
    management as to what will be delivered. Work with the business side to choose
    which use cases will be implemented in the current project. Anything else will
    be deferred. Even if scope is agreed upon verbally, put it in writing and e-mail
    it to everyone remotely connected to the project. Make sure to keep a copy.'
