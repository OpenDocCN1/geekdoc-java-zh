    The next topic of discussion for that initial meeting is dividing the work for
    evaluating products with respect to the criteria that has been chosen. Usually,
    I suggest rating each product for each criterion with a rating of 10 to 1, with
    10 being the best and 1 being the worst. As doing the work, there are a couple
    of strategies, each with advantages and disadvantages.


    The first strategy is to assign each person to completely rank one or more products
    with respect for each of the criteria. Considering a web services example, have
    one person rate the Apache Axis2 product for all criteria decided upon. This has
    the advantage of minimizing the learning curve for the team member and highly
    leveraging the learning experience. It has the disadvantage that rating standard
    differences will occur between products. That is, the person who rated switching
    costs for Axis2 might be different from the person who rated CXF. The ratings
    for these products might differ because they have different evaluators; not because
    of product differences.


    Another strategy is to assign all decision criteria to the team (all members).
    Their responsibility is to evaluate all products against each criterion. This
    increases the likelihood that different products are rated in a consistent way.
    It also guarantees that any one reviewer cannot materially bias the group or against
    a particular product due to private concerns. The disadvantage is that each team
    member has to learn about each product, which costs more in terms of time spent.
    However, I personally prefer this approach. Usually, with these types of decisions,
    they are important enough that it''s worth the additional time spent. It also
    provides the opportunity to question another team member''s ratings if there is
    disagreement.


