  md: '# WRITING USER STORIES


    A user story is a short description that contains an actor, that actor''s want
    or need, and the expected benefit the actor will experience when that need is
    met. Usually, user stories are one sentence. User stories do not contain enough
    information for developers to implement the feature. The intention is that the
    details needed to implement the feature are obtained in conversation with the
    business representative.


    A common form for user stories is as follows:


    +   - As an <actor>, I want <want or need> [so that <expected benefit>].

    - Some consider the "expected benefit" part of user story to be optional, whereas
    the actor and short description of the want or need is required. Examples of user
    stories from some of my recent projects:

    - As a registrar, I want to produce transcripts that can be distributed electronically
    because that''s what students want.

    - As a security administrator, I want a report that tells me which users have
    role.

    - As an executive, I want to be able to attach comments to budgeted items to communicate
    with other executives and accounting.

    - As an academic administrator, I want to be able to publish class syllabi inside
    our course application for prospective students.

    - As an application administrator, I would like to be notified by text when an
    out-of-memory condition is reached.


    # Additional requirements obtained in conversations should be documented.


    Unless the project is very small and your organization is devoid of corporate
    policies, you need a written record of the implementation details. The documentation
    doesn''t have to be elaborate or lengthy. Ensure that you share it with the business
    representative(s) you conversed with to obtain the information; if there is a
    misunderstanding about the requirements, it''s best to flush it early.


    # WRITE USE CASES


    A use case is a description of something a system does at the request of, or in
    response to, an action by one of its actors. You should write use cases in business
    terms, not technical. Anyone on the business side should be able to read the text
    without a translator or technical glossary. Use cases containing technical terms
    often indicate that technical design assumptions are being made at this stage,
    and they shouldn''t be. Use cases can also serve as a casual "contract" between
    the business and development sides of the organization as to what will be delivered
    in what increments.'
  merge: -1
