  md: "# Listing 10.1: Sample Transaction Management Filter Logic\n\n```\npublic void\
    \ doFilter(ServletRequest request,\n    ServletResponse response,\n    FilterChain\
    \ chain) throws IOException, ServletException {\n    Boolean transactionEstablished\
    \ = =\n    transactionContextState.get();\n    if (transactionEstablished != null)\
    \ {\n        chain.doFilter(request, response);\n    }\n    else {\n        try\
    \ {\n            transactionContextState.set(Boolean.TRUE);\n            new TransactionContext();\n\
    \n            chain.doFilter(request, response);\n            TransactionContext.getCurrent().commit();\n\
    \        } catch (Exception e) {\n            TransactionContext.getCurrent().rollback();\n\
    \        } finally {\n            transactionContextState.remove();\n        \
    \    TransactionContext.getCurrent().close();\n        }\n    }\n}\n```\n\nSource:\
    \ /src/j2ee/architect/handbook/chap10/TransactionManagementFilter.java\n\nThe\
    \ AOP strategy uses aspect-oriented technologies, such as AspectJ (http://www.eclipse.org/aspectj/),\
    \ to surround methods in data access classes with commit and rollback logic. Often\
    \ this approach is too granular to be useful. While one can address the granularity\
    \ issue and take time to plan which classes are targeted for transaction management,\
    \ this can lead to confusion for developers. It is not obvious which class methods\
    \ contain transaction management logic and which not. The resulting confusion\
    \ takes more time and effort than the development saved by using an AOP strategy.\n\
    \nThe Autocommit strategy is the most convenient for initial development. It's\
    \ possible, at a JDBC driver configuration level, to set all connections to be\
    \ \"autocommit\" by default. Using this strategy, the JDBC driver automatically\
    \ issues a \"commit\" after successful SQL statements and a \"rollback\" after\
    \ failed transactions. This strategy has the same issue as the AOP strategy in\
    \ that it is too granular to be useful with Java EE applications.\n\nAs you may\
    \ have guessed, trend toward the Servlet Filter strategy for transaction management.\
    \ It's simple. It alleviates the need for developers to concern themselves with\
    \ transaction management issues. Should a given"
