    # Utilizing RESTful Web Services


    RESTful services work by using structured URLs to communicate specifics of an
    information request. For example, a RESTful web service like /customer/account/55555
    might be a request for a specific customer account 55555. The return from the
    REST service call (which is HTTP) would be structured XML (or JSON) formatted
    data.


    To further illustrate, consider the following example of a purchasing application
    using HTTP to request information from an inventory management system:


    +   1. The purchasing application issues an HTTP request (using java) to the inventory
    application requesting current inventory levels for an item (e.g., laundry detergent).
    With REST, the URL describes the content of the request. For example, the format
    of a REST-style request might be <server>/sku/<item sku number> (e.g., /inventory/sku/14678).

    2. A servlet in the inventory management system receives the request, interprets
    request specifies from the URL, and initiates processing.

    3. The inventory management system examines its database and determines the quantity
    of the requested item available at all warehouses.

    4. The inventory management system constructs an XML document containing the item
    information.

    5. The servlet in the inventory management system returns the XML document to
    the caller in the same way it would return HTML to a browser.'
