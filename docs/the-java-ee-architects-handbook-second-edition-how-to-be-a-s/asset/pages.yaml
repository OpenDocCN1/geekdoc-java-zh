  md: '# BUILDING THE DEPLOYMENT AND PRESENTATION LAYERS


    The deployment and presentation layers of Java EE applications are used directly
    by users.


    Objects in the presentation layer produce the pages or screens that users physically
    see and use. There are several aspects to the presentation side: static content,
    dynamic content, and navigation. For Java EE applications, HTML pages typically
    provide static content; and a combination of JSPs and servlets usually provide
    dynamic content. For applications that require special effects (e.g., mouse-overs),
    Javascript can be used in combination with either static or dynamically produced
    HTML. Users navigate pages using controls (e.g., push buttons) on the page.


    Objects in the deployment layer (which I call deployment wrappers) "publish" the
    content of the business logic layer to other applications. Examples of deployment
    layer constructs include web services and enterprise beans. I was tempted to call
    this layer the "service" layer, but that would lead to confusion as to why this
    layer contains enterprise beans. The deployment layer provides remote calling
    capability for other applications. For instance, it is not uncommon to support
    mobile applications by publishing Restful web services; those services would be
    part of the deployment layer.


    Deployment wrappers as web services and enterprise beans are purposely kept relatively
    simple and thin because they are more difficult and time consuming to develop
    and maintain than normal Java classes. Simple, thin deployment wrappers are less
    likely to have bugs.'
