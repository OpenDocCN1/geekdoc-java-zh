  md: '# Business Object Coding Guidelines


    example, a script to “record a transaction” may very well be leveraged for a “deposit”
    transaction script as well as a “withdrawal” transaction script.


    While complex tasks can be written as a large and complex series of transaction
    scripts, these scripts become fragile and more difficult to maintain. Yes, you
    can mitigate this somewhat with unit testing. But the pundits who frown upon the
    Transaction Script pattern recognize that it has limitations. It is common for
    large business applications to have some features that are really too complex
    for the Transaction Script pattern and need a more object-oriented approach. The
    beauty of a layered architecture is that transaction script code and object-oriented
    code can co-exist. That is, feel free to utilize more advanced patterns for features
    that truly need it and transaction scripts. There’s no objective algorithm for
    deciding which features are too complex for transaction scripts and which need
    more advanced coding patterns.


    # BUSINESS OBJECT CODING GUIDELINES


    Never put deployment specific in an object in the business logic layer. Business
    objects should be reusable in any context (e.g., web transaction, service, or
    batch job) without changes. This insulates business logic from changes and developments
    in the deployment or presentation layers, which change more rapidly than anything
    else.


    To keep business objects independent, business objects don’t reference presentation
    tier classes or any assumptions (save for transaction management) about the context
    in which they will be called. They can assume that they are executed within the
    context of a transaction, as transaction management typically occurs at the point
    of deployment.


    Many Java EE books guide you toward incorporating business logic directly into
    enterprise beans. I don’t subscribe to that view because of the rapid pace at
    which deployment methodologies have changed over the years. Secondly, enterprise
    bean usage has diminished over the past few years and is recognized as unneeded
    complexity in cases.


    All public methods should explicitly validate the arguments. If they don’t, you
    run a significant risk of generating a derivative exception, such as a NullPointerException,
    which can take longer to debug and fix. If you generate an IllegalArgumentException
    with a clear message, programming errors in the deployment layer or within business
    objects that will call you have a better chance at being caught in unit testing.


    Always have a consistent strategy for instantiating business layer and data access
    layer classes. Common strategies include autowiring with the help of Inversion
    of Control (IOC) software or by using the Factory pattern.


    The Factory pattern consists of using factory classes to instantiate classes as
    illustrated in figure 11.2.'
