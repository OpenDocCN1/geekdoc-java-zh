  md: '# CREATING OBJECT MODELS


    Application architects are responsible for leading the application design process.
    In this role, the architect is as much a facilitator as an application designer.
    This chapter shows you ways to utilize use-case analysis along the layered approach
    described in the previous chapter to construct effective designs for Java EE applications
    and document them in an object model. Along the way, I will share some techniques
    for leading a group design process.


    Finished use cases are essential for effective application design. Without them,
    the object-modeling sessions will produce more questions than answers. If you
    find vague points or unaddressed issues in the documentation, apply the technique
    of making sure you can confirm them with the business side later. Document the
    assumptions you make so. Your use-case analysis is more likely to be incomplete
    when you''re working on a large project.


    Object-modeling exercises are applicable for the Java portions of Java EE application
    that are custom written (e.g., not provided by a software vendor). Modeling of
    third-party software components should be limited to those classes directly called
    by your application.


    It is not necessary to model 100 percent of the application. This is particularly
    true when layered architectures are utilized. Object models will most likely be
    needed for the value object and business logic layers. For instance, the object
    model of the entire entity layer will be obvious once you''ve completed the data
    modeling portion of the design (covered in the next chapter) as each class will
    have a one-to-one relationship with a table. Furthermore, many JPA'
  merge: -1
