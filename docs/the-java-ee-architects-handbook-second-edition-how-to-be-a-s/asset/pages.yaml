  md: '# Exception-handling Strategies


    Note log retention and storage concerns are a completely separate topic. Most
    logging products support storing logs in a variety of formats, including file
    or database formats. Application code should only be concerned with issuing log
    messages, not with the specifics of how they are stored or for how long they are
    retained.


    Application architects need to clearly articulate the logging strategy for developers.
    Below is a simple example of such a strategy:


    # Sample Logging Strategy


    +   Use myapp.util.Logger for all logging. Do not use System.out.println().


    +   Do not log error messages directly in application code. Rely on the application
    architecture (e.g., error handling servlet filter) to log for you.


    +   Warnings, informational, and debug messages (i.e., errors not severe enough
    to warrant the throwing of an exception but would be useful to a developer fixing
    bugs) can be logged anywhere from any layer.


    +   When using logging to output information, use logger message formatting features,
    instead of employing custom formatting logic, to reduce application code and the
    risk of producing derivative exceptions.


    +   Do not use the general logging facility as a transaction log.


    # EXCEPTION-HANDLING STRATEGIES


    **Validate all arguments explicitly in all public methods and constructors in
    all public classes.** Validating all arguments for publicly consumed methods prevents
    derivative exceptions. Derivative exceptions are those reported well after the
    error occurred. It''s an all-common error to pass a null argument to a method
    accidentally, only to find that a NullPointerException was generated when the
    class was called (directly or indirectly) tries to use the argument and isn''t
    expecting the null value.


    While it''s possible to get the class, method, and line number where before, at
    the point where the NullPointerException occurred, the actual error occurred in
    an entirely separate method and class which can take significant time to track
    down, especially if the code is complex and multiple variables could have generated
    the exception. Typically, derivative exceptions like this take more time and effort
    to fix because the error message and information don''t make the problem clear.
    The had method generated an exception message like “The name argument may not
    be null.” the error would be easier to find and fix.'
