  md: 'When constructing a performance test plan, the following questions need to
    be answered:


    +   - What metrics will be measured?

    - What measurements are required to “pass” the performance test?

    - What products and tools will be used to conduct the test?

    - What features will be included in performance tests?


    The application architect is responsible for ensuring that these questions are
    answered and often facilitate needed discussions with other team members and end-user
    representatives to answer these questions.

    While application architects often don''t execute performance testing, they are
    often called to contribute problems be discovered. It is possible for performance
    testing to be managed by senior developers rather than application architects.
    However, I closely monitor this process for my projects, even if it''s performed
    by developers, as it is valuable feedback on the quality of the initial design.
    How easy or difficult is it to tune the application reflects directly on the quality
    of the underlying application architecture. If there are indeed difficulties in
    tuning one of my applications per requirements, I can avoid them with other applications.


    **What metrics will be measured?** Measurements must be completely objective.
    I usually measure throughput (e.g., 20 hits per second) and average client response
