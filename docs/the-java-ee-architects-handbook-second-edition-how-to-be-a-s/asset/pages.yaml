  md: '# Chapter 3: Scope Definition and Estimation


    Diligently enforce project scope once it''s determined. The most important thing
    the project manager can do once the scope of a project is determined is to enforce
    it. The application architect has the responsibility of alerting the project manager
    to scope changes. It''s much harder to hit a moving target. Although I generally
    prefer to schedule all enhancements for future releases, the architect usually
    doesn''t get to decide scheduling issues. I estimate the request in use-case format
    and provide a preliminary estimate. Usually, the project manager can use this
