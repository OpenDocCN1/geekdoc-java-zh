    # EXTERNAL INTERFACE GUIDELINES


    Many Java EE applications communicate with external systems, some of which may
    not be Java applications. As an application architect, you''ll probably have an
    opportunity to facilitate design and implementation of external interfaces. Over
    the years, I''ve adopted several techniques for creating successful interfaces.


    Record every request or transmission from or to an external application. This
    should be the first task in any external interface. Be sure to log this information
    so that you know the time (node and if you''re in a clustered environment). If
    there''s a problem with work you initiated in an external application, you''ll
    want to be able to tell those developers exactly what calls they made and when.
    If there''s a problem processing a call from an external application, you''ll
    need enough information to replicate it and fix any problems quickly.


    This documentation practice helps you or any member of the development team from
    being blamed for the mistakes of others. Without facts, anyone can make accusations,
    and in many corporations you''re guilty until proven innocent. Having a transmission
    log will make it easier to determine which application has a problem.


    Create a way for an application administrator to resubmit a work request from
    an external application. When your application experiences an environmental problem
    and you''re able to fix it, the application administrator should be able to resubmit
    the work that failed. This limits the impact on end users and limits the number
    of people (and thus the time) needed to fix a problem. Sometimes, resubmission
    is not possible or applicable. But it can save you time for activities that are
    more than maintenance.


    As an example, one of the applications I supported provided scheduled reporting
    capabilities. An application administrator could resubmit any report that wasn''t
    being delivered to a browser by an administrative web-based utility.


    Collect the identity of the transmitter. Part of every transmission should be
    information that indicates the identity of the caller. This is meant as a way
    to reduce your maintenance time, not as a security mechanism. In the case of an
    inappropriate call, you want to be able to quickly notify the application making
    it. If you don''t know where it''s coming from, finding it and getting it takes
    longer.


    Develop a mechanical way to "push" errors to the transmitter. If there is a problem
    processing a request made by an external application, administrators from that
    application need to be notified. If the interface has a tight coupling'
