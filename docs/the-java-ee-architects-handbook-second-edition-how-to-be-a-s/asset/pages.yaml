  md: '# Chapter 6: Creating Object Models


    After the reader has reviewed this example, I expect several follow-up questions.


    Do I need to model every portion of all applications in this detail? In all probability,
    models such as these usually aren''t updated over time. Consequently, they have
    the most value for the initial development effort. The amount of modeling performed
    should be just enough to support the initial development effort.


    Furthermore, let''s distinguish between "modeling" and the act of documenting
    that model in a modeling tool or graphics design package. For those with much
    modeling experience, the latter usually takes more time than the former. I mentally
    construct models for most of my projects regardless of whether or not I write
    these models down as a communication mechanism with other team members. It leads
    to cleaner and more maintainable applications. Furthermore, it helps me work in
    an organized fashion.


    The amount and quality of model documentation depends on project complexity, the
    size of the project, and how many developers on the project don''t have experience
    working with you on previous projects. For a project with one or two developers,
    less documentation is needed than a project with a team of twenty developers.
    In fact, for a project with one developer, a formally documented object model
    might not be needed.


    Also, if you''re working with developers unfamiliar with your methods, they will
    need more guidance than those who''ve worked with you before. With one team I
    projects I can model the entity layer and the most complicated portions of the
    business logic layer, and formally document other portions of the model.


    The entity layer largely dictates the organization of the data access layer. Consequently,
    once the entity model documentation is produced, you might not have to document
    the data access layer completely. Once you communicate the data access pattern
    to be used, it can be applied to any entity. For example, the data access layer
    persisting performance statistics for Admin4 is very similar in concept to what
    was presented regarding exception statistics.


    If you encounter a portion of your development project that is difficult for you,
    that''s an indicator that the model for that portion of the application should
    be documented and discussed with the development team. If it''s difficult for
    you, it will likely be difficult for others, and all developers for the project
    should be on the same page and understand the design constructed. Furthermore,
    the perspectives and opinions of others might help you clarify issues and concerns.


    What modeling tools do you use? I use what my clients use. For without modeling
    tools, I recommend ArgoUML (http://arguml.tigris.org/). It''s a very active open
    source project that I find easy to use. In fact, object models for Admin4J in
    this example were produced using ArgoUML.'
  merge: -1
  pgno: 113
