  md: '# User Acceptance Testing


    for the User Acceptance Testing period. During this phase, developers (or a subset
    of test team members) execute the manual regression test. Developers are responsible
    for fixing any defects found.


    The responsibility of the application architect for this process is usually to
    ensure that the environment supports this type of testing activity. Developers
    typically need an easy way to initiate the build and deployment to this environment.
    I find it helpful to standardize the build and deployment procedures across environments
    and projects. Not only does this streamline maintenance for your build and deployment
    scripts; it also makes life easier for developers, who are often transferred between
    projects in many organizations. This consistency allows developers to concentrate
    on the testing activity itself and the required defects fixes, rather than spending
    unnecessary time with unique build and deployment procedures for a particular
    project.


    # USER ACCEPTANCE TESTING


    User acceptance testing usually requires a separate environment. This ensures
    some stability for the testing team (or side representatives in some organizations).
    Usually, the application architect or a senior developer manages needed changes
    to this environment so that those changes can be made in production when the project
    is eventually deployed to production.


    Once again, the application architect''s role with this process is to ensure that
    an environment exists to support this activity. Usually, I manage changes to this
    environment so I can ensure that needed changes will also be made in the production
    environment when the time comes. If change management for this environment is
    decentralized (i.e., changes managed by several people), the chance that a change
    is missed when the project deploys to production increases dramatically.


    For my projects, I usually review defect tickets and check-ins during the UAT
    testing period. This provides feedback as to how well I with design tasks earlier
    in the project. Defects at this stage of the project should not require major
    architectural changes. If they do, this needs to be analyzed so that those kinds
    of mistakes are not made with future projects.


    # PERFORMANCE TESTING


    Performance testing is a process that verifies if the project meets scalability
    requirements in terms of the number of users and transactions it supports. This
    process requires direct involvement of the application architect or a very senior
    developer. To be honest, I take upon myself to participate in this exercise. Developers
    know when they screw up when tests fail or defects appear in testing. Architects
    need similar feedback. Performance testing is a good way to find out if the application
    architecture meets (or can be tuned to meet) performance specifications.'
