  md: '# Caching Strategies


    example, Hibernate provides caching abilities that you can use instead of custom
    coding use of a cache as I''ve done above.


    As caching works avoiding I/O, it carries a stale data risk. That is, data in
    the cache might have been changed at the source and that stale data is being used
    by the application for processing. For example, if you cache data from a remote
    web service call, it''s possible that the data have changed since the last read.
    In that case, your application will be using stale data. That is also possible
    if you cache the result of a database read.


    As caching trades memory for speed, the additional memory requirements for caches
    you configure need to be considered. Guava and another popular caching package
    Ehcache (http://ehcache.org/) provide ways to limit the number of cache entries
    to mitigate the risk of caching causing a memory shortage.


    Since I mentioned using caching features of JPA implementations (e.g., Hibernate),
    I should point out that implementing a Java cache for database reads is usually
    redundant. Relational databases have built-in caching ability and if properly
    configured Hibernate caching extensively, and I''ve discovered that unless your
    database and database server has bad performance, Hibernate caching doesn''t make
    any difference. If you have a poorly configured database or a poorly running network,
    it''s better to fix them, if possible, as they would be the root cause.


