  md: '# CHAPTER 14


    # BUILDING ARCHITECTURAL COMPONENTS


    Architectural components are classes and static utilities generic enough to be
    used for many applications. After you''ve identified an architectural component,
    your first step should usually be looking in the marketplace for a component that
    meets needs. I recommend starting your marketplace search by checking out open
    source alternatives. If you have the necessary budget, commercial alternatives
    should be included. Open source alternatives, are usually much easier to acquire
    and a lot easier on the budget. can be as good as commercial software, At the
    end of the chapter, I highlight some of my favorite open source projects


    Open source projects that routinely appear in my projects are the following:


    +   - Apache Commons (http://commons.apache.org)

    - Lang—General Java language utilities

    - IO—Common Utilities for classes in java.io

    - Bean Utils—Utilities for manipulating Java bean and POJO classes

    - Collections—Utilities for manipulating Collection classes such as Maps and Sets

    - DbUtils—Utilities for simplifying JDBC code

    - Apache Log4J (http://logging.apache.org/log4j/)


    One issue with component software, both open source and commercial, is'
