    Consolidate formation of SQL statement strings. As a former database administrator,
    I spent a substantial portion of my time reading the code others have written
    and suggesting ways to improve performance. As you might expect, I am particularly
    interested in the SQL statements. I find it especially hard to follow SQL statements
    constructed by string manipulation scattered over several methods. It greatly
    enhances readability if you consolidate the logic that forms the SQL statement.


    Listing 10.5a is a good illustration of this point. Note that the string manipulation
    to form the SQL statement is located in one place. The SQL string is also defined
    statically to reduce the amount of string concatenation.


    # Listing 10.5a: Using a String Host Variable for a Date Field


    ```

    Select sum(sale_price)

    From purchase_order

    Where to_char(sale_dt,''YYYY-MM-DD'') >= ?

    ```


    Limit use of column functions. Try to limit your use of column functions to the
    select lists of select statements. Moreover, use only aggregate functions (e.g.,
    count, sum, and average) needed for select statements that use “group by” clause.
    There are two reasons for this recommendation: performance and portability.


    When you limit the use of a function to a select list (and keep it out of “where”
    clauses), you can use it without blocking the use of an index. In the same way
    that the char function prohibited the database from using an index in listing
    10.5a, column functions in “where” clauses will likely prohibit the database from
    using an index. This results in slower query performance. Rewriting the SQL statement
    as shown in listing 10.5b allows most databases to use indices.


    # Listing 10.5b: Query with java.sql.Timestamp as a Host Variable


    ```

    Select sum(sale_price)

    From purchase_order

    Where sale_dt >= ?

    ```


    In addition, many of the operations for which developers use SQL column functions
    (data type conversion, value formatting, etc.) are faster in Java than if they
    did them in Java. I''ve had 5 to 20 percent performance improvement in many applications
    by avoiding some column functions and implementing the logic in Java instead.
    Another way to look at it is that you cannot tune column functions because you
    cannot control the source code. By implementing that logic in Java, you create
    code that you can tune if necessary.'
