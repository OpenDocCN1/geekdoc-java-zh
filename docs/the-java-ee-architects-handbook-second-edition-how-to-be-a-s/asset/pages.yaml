    | Entity Object Layer | Value Object Layer | Deployment Layer | Presentation Layer
    | Architectural Component Layer |

    | --- | --- | --- | --- | --- |

    | | | Web Services or EJBs | Servlets, Controllers, Managed Beans | HTML, JSF,
