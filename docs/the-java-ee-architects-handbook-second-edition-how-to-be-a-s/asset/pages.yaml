  md: '# DESIGNING EXTERNAL APPLICATION INTERFACES


    It is common for a Java EE application to interface with external applications
    we don''t control. For example, a purchasing application may notify an accounting
    application of all purchases, or an inventory management application may notify
    an accounting application of all inventory receipts and customer shipments. The
    application architect is responsible for the design of application interfaces
    as well as the application itself. Application architects typically have a central
    role in designing application interfaces with external applications, especially
    when the external application is also a custom development (e.g., not a vended
    product with established interface capabilities). This chapter describes how to
    define external application interface requirements so that both application teams
    will have the information needed to perform design and implementation tasks.


    Sometimes external applications are vended, and supported interface methods are
    established and readily consumable. Sometimes external applications are supported
    by another team or business area and don''t yet exist. Common reasons for creating
    external application interfaces are as follows:


    +   - To read external application data for reference or processing

    - To leverage external applications to perform some body of work

    - To publish functionality to external applications


    Reporting applications are a common example of a need to read external'
  merge: -1
