- img_proc: true
  md: '# Chapter 6: Creating Object Models


    implementations will generate layer classes usually have a one-to-one relationship
    with entity classes (e.g., a customer entity class will likely have a customer
    data access class to handle I/O). Concentrate modeling activities on the most
    complex portions of the application (typically in the business logic layer).


    The application architect is responsible for facilitating design discussions,
    which should involve the business logic and presentation-tier developers in the
    design process. Because of its subjective nature, the object-modeling process
    can be a large source of frustration and a project bottleneck. I''ve seen some
    projects where the architect produces the model privately and then attempts to
    coerce other developers to follow. Although a lone developer may be able to produce
    an object model more quickly than a team, the model is more likely to contain
    errors and omissions, and only the architect understands it and is loyal to.


    When the model is produced privately, it doesn''t get substantive developer support.
    After all, if developers can''t understand or agree with a plan, they certainly
    won''t want to follow it. Many developers react to architect-produced models by
    ceasing to contribute anything to the project from that point. The architect may
    “draft” a model as a way to move the design process along, but developers should
    clearly understand that this draft is presented to prompt discussion and is entirely
    subject to change.


    As a practical matter, when I need to get meaningful support from multiple developers,
    I go through the longer exercise of forming the plan collectively. Developers
    who have had input to a model and repeated opportunities to suggest enhancements
    are going to be more enthusiastic about implementing it.


    Appoint a scribe for all modeling sessions. It''s difficult to facilitate design
    sessions and take accurate and complete notes of the items discussed at the same
    time. As the architect is usually leading the session, one of the developers should
    act as scribe, perhaps on a rotating basis. After the design session, the scribe
    is responsible for updating the object model to reflect changes discussed in the
    session.


    The remainder of this chapter presents a framework you can use to guide development
    staff through the object-modeling process. The first step in the process is to
    identify the major objects in your application using the use cases as a guide.
    Next, you refine these objects into classes, determine how they interact, and
    identify attributes and methods. Throughout the chapter, I show you how to streamline
    the process and avoid those annoying bottlenecks.


