  md: '# Chapter 4: Designing External Application Interfaces


    applications are vended, it is common for product upgrades to contain data-base
    schema changes. If the external application belongs to a separate team or department,
    changes might occur in the external application database without notice. Consequently,
    it''s often desirable to reduce exposure to these types of changes.


    With the exception of Oracle, most databases issue locks on reads by default.
    This means that reading data isn''t necessarily harmless. It is possible that
    this strategy adversely impacts performance (because of read locking) on the users
    of those external applications.


    The risks of reading external application databases directly can be mitigated
    by using an operational data store. Essentially, your application reads a copy
    of the external application data store instead of the external application database
    directly. This mitigates the risk of adverse impact from application changes by
    localizing risk purely to the data extracts; most of your application code would
    be unaffected. If the operational data store is in a vendor neutral format (i.e.,
    not just a replicated copy of the external application database), then the source
    of this data can be changed to other products with minimal impact. For example,
    let''s say the external application is an accounting pack-age. Using this strategy,
    your current accounting package be replaced with a competing product from another
    vendor, the impact of that change would be only to the extracts, not to the lion''s
    share of your application code.


    This strategy, illustrated in figure 4.1, also mitigates the negative impact on
    external application users since access is scheduled and controlled. This strategy
    does mean that external application data will only be as current as the latest
    extract.


    It''s important to note that there are several Extract, Transform and Load (ETL)
    products on the market that provide support for these types of extracts. Some
    of these products are open source and freely available. Many ETL product suites
    are very dependency heavy and require a significant learning curve. My experience
    is that your extract and transformation needs have to be extensive before leveraging
    this type of toolset is cost effective.


