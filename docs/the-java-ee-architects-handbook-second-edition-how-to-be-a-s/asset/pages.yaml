    # ASSESSING APPLICATION QUALITY


    I’ll discuss metrics that are used to measure application code quality. As there
    are limitations to each of these metrics, it is advisable to evaluate several
    metrics in making an overall assessment of quality.


    The number of application defects that made it into production is often viewed
    as an indicator of application quality. The fewer number of defects, the higher
    the perceived quality. The trouble with this measurement is that more heavily
    used applications tend to have more reported defects than rarely used applications.
    This issue can be mitigated by scaling the number of defects with the number of
    transactions or page loads per unit time for the application.


    The quantity of resources needed to address user issues and complaints with the
    application can be viewed as an indicator of application quality. Usually, this
    is measured in terms of the number of full-time developers that are needed to
    support the application. This is often called Full-time Equivalents (FTEs). Applications
    are not of the same size or complexity; the fact that one consumes twice as many
    FTEs for support another application might be due to the size and breadth of features
    provided by that application. Hence, to effectively compare the quantity of support
    FTEs for one application with another, you must weigh the FTEs by some independent
    metric (e.g., lines of code, code length, cyclomatic complexity).


    Automated test coverage can be taken as one indicator of quality. The higher the
    coverage, the less risk of unintended consequences when that application is changed.
    We have already discussed the fact that few applications have 100 percent coverage
    and that higher levels of automated test coverage have diminishing returns. I
    usually look for a test coverage of at least 60 percent.


    Simpler code is perceived as higher quality code, and many tools exist to measure
    code complexity (e.g., JavaCSS). Very complex code tends to be more difficult
    to change without experiencing unintended consequences.'
