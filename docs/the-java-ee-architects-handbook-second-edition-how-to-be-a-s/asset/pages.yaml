  md: 'the extreme variance in quality. Some components are easy to understand and
    use; others are inscrutable and impractical. In this chapter, I list the capabilities
    that developers generally associate with quality components. You can use this
    list to evaluate open source or commercial component software. I also present
    a series of tips and techniques for creating your own architectural components
    with those capabilities considered the marks of quality.

    The role of architectural components is illustrated in figure14.1.


