    the second wash without affecting the project end time, as the dryer takes twenty
    minutes longer than the washer. In this example, the first wash load, both dry
    loads, and the folding of the second load are on the critical path.


    If you''re an application architect doubling as a project manager, pay more attention
    to the critical path than anything else. Most project management software packages
    highlight the critical path if you have entered all the resource assignments and
    dependencies completely.


    The corollary is that time saved on noncritical path tasks will not allow the
    project to finish earlier. The reason is that these tasks aren''t currently determining
    the project timeline; critical path tasks are. Furthermore, a critical path can
    shift; if, tasks on the critical path can change if your project plan changes.
    If you save enough time on a critical path task, it''s possible that it isn''t
    on the critical path—something else is. If a long delay occurs for a task that
    is not on the critical path but is still essential, the task might become part
    of the critical path.


    For example, financial analysis software I helped develop included a component
