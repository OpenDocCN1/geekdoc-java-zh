  md: '# CHAPTER 13


    # MAKING

    TECHNOLOGY PRODUCT

    SELECTIONS


    It is common for architects to guide the selection process for technology products.
    Sometimes the products selected are directly utilized by users. Sometimes the
    products selected are libraries incorporated into applications to save development
    time and support resources. My experience is that most organizations don''t approach
    technology selection in a very structured or organized way. In this chapter, I
    present strategies for making technology product decisions. As the choice of which
    of the many web frameworks to use is a common technology product choice, I use
    it as an example.


    The choice of which a web framework is one of the most important product selections
    made for Java EE applications. Framework choice is not an easy decision, and the
    potential effect of these choices on development and maintenance costs is large.
    Given the importance of these decisions and product choices in general, let''s
    spend some time detailing strategies for making these types of decisions.


    # PRODUCT DECISION CRITERIA


    With regard to web service or web presentation frameworks, there are many product
    choices available. We need a way to rate these products and fully differentiate
    them to the point where a logical choice will develop. The "attributes" on which
    we rate these frameworks in essence become decision criteria.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Chapter 13: Making Technology Product Selections


    Common decision criteria that normally make the list in one way or another are
    as follows:


    +   - Fitness for Objective

    - Ease of Use

    - Market Share

    - Switching Costs

    - Expected Cost Savings (over a custom solution)

    - Level of Community Activity

    - Performance

    - Dependency Requirements

    - Licensing


    Not all of these criteria are equally weighted; some may be more important than
    others. I usually weight each of these criteria with a high, medium, or low. Furthermore,
    I usually rank each product choice with respect to these criteria from 1 to 10,
    with 10 being the best rating.


    **Fitness for Objective.** Is the product choice designed to be used for your
    intended purpose? Are others it for a similar purpose? This criterion supports
    the “Swim with the stream.” By using products as they are designed, you increase
    the likelihood that the resulting application will benefit from future product
    improvements. For example, relational database products are optimized for third-normal
    form. In the early days of relational databases, performance of joins was a frequent
    issue. However, over time, database products have solved these performance issues
    as relational database theory incentivizes normalized designs. Users who used
    normalized designs benefited from these improvements.


    These types of criteria are most often phrased as a list of specific features.
    For example, when choosing a Content Management System, the list of features measuring
    “fitness for objective” might include spell checking, audit/change history, WYSIWYG
    editing capabilities, etc. This feature is designed to help you determine if the
    product choice is consistent with how you wish to use the product.


    Drawing an example using a web presentation framework, let’s say the business
    objective is to delegate presentation design to HTML-literate specialists (which
    typically cost less and are more plentiful). With that objective, any presentation
    product that leveraged HTML skill sets would be advantageous. A choice of Apache’s
    Widget (http://wicket.apache.org/), which relies heavily on Java coding skill
    sets, would not fit the business objectives as well as frameworks that were HTML-based.


    You also have the best chance of capitalizing on the experience of others.'
