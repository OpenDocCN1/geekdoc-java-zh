- img_proc: true
  md: '# Database Administrator


    The database administrator is responsible for formulating a database design based
    on the business requirements for the application, and for creating and maintaining
    database environments for the application. Typically, the database administrator
    assists with performance tuning and helps the business logic developer diagnose
    application issues regarding data access. Sometimes, the database administrator
    doubles as a business logic developer or data migration specialist.


    The application architect works with the database administrator to resolve any
    issues or problems involving database storage. However, the database administrator
    primarily interacts with the data modeler and the business logic developer.


    # Data Migration Specialist


    Some applications, such as those for data warehousing, depend heavily on data
    migrated from other sources or from a legacy database. The data migration specialist
    writes and manages all scripts and programs needed to populate the application
    databases on an ongoing basis. When an application has few migration requirements,
    this role may not be necessary or may merge with the database administrator''s
    role.


    The application architect ensures that data migration requirements are provided
    for the migration specialist. Working with the data migration specialist to solve
    any technical issues or problems that might arise is another aspect of the application
    architect''s role.


    # Infrastructure Specialist


    The infrastructure specialist is responsible for providing all development, testing,
    and production environments as well as the deployment methods. A formal infrastructure
    for development and deployment saves lots of time and effort. The idiosyncrasies
    involved in administrating containers, writing deployment scripts, and assisting
    other developers in diagnosing problems with their test environments represent
    a unique and challenging problem.


    Usually, the infrastructure specialist works with the organization''s system administrators
    and database administrators to provide these environments. Most organizations
    provide resource provisioning services through centrally managed groups. For example,
    the infrastructure specialist wouldn''t physically install or define a build server;
    he or she would specify requirements for that server and a system administrator
    would actually define it. The same can be said for the physical creation of databases.
    The point is that the infrastructure specialist is responsible for seeing that
    the environments get created and properly configured.'
