    # TRANSACTION MANAGEMENT STRATEGIES


    All Java EE applications need a transaction management strategy. That is, a strategy
    that defines when commits and rollbacks are issued. There are three general strategies
    available: Servlet Filter strategy, Aspect-Oriented Programming (AOP), and Autocommit
    strategy.


    The Servlet Filter strategy uses a Servlet filter, which is executed on all web
    transactions to issue all commits for successful transactions and rollbacks for
    all transactions that except. Listing 10.1 contains a short example of this strategy.
    Note that in this example, TransactionContext retains the current Hibernate session
    and makes it available to classes in the data access layer. A similar pattern
    could easily be used to retain native JDBC connections should- a JDBC persistence
    strategy be used.'
