    # Automated Testing


    As applications mature and gain complexity, automated testing becomes preventive
    medicine. With complex code comes the likelihood that a developer will fix one
    problem and inadvertently cause another. Some would say this is a red flag indicating
    a need for code refactoring, as discussed in a later chapter. Automated testing
    decreases the possibility that a fix to one problem causes another problem and
    then goes unnoticed until after production.


    Automated testing is better because it''s consistent and easy to run. It doesn''t
    slack off at the end of a hard day, and it is easily repeatable. As a result,
    regression testing for even small changes in the application is more cost-effective.
    I''ve seen projects that go so far as to incorporate the test suite in the build
    script. If one of the regression tests fails, the build fails and the developers
    are forced to fix the bug.


    Automated testing is as complete as you want it to. If you subscribe to the view
    that test cases should be created as the application is developed, then you also
    feel that developers should initially create test cases. But these test cases
    are usually not complete. If you adopt the recommendation that the first step
    in fixing a bug is writing a test case that reproduces it, your regression test
    is enhanced as you find more bugs. Over time, you get a robust set of regression
    tests that increase the probability of finding bugs before deployment.


    Automated testing isn''t free. Creating and maintaining tests consumes manpower,
    so it''s important to use the 80/20 rule. Initially, code tests for the 80 percent
    of the application that is most complex and most prone to error. You can fill
    out the remaining 20 percent over time. If you stop to'
