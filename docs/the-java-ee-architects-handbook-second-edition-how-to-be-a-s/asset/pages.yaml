  md: '# Streamlining Investigations for Unplanned Outages


    Prioritize defects indicating the lack of needed resources first. An example of
    this is database unavailability. Resource outages, such as database unavailability,
    usually affect a large number of transaction types and user activities within
    the application.


    System-generated exceptions usually precede corresponding user-reported defects.
    Consequently, it''s possible that a system-generated exception is fixed quickly
    enough, a user will never notice or report it. I generally monitor system-generated
    exceptions closely after a new release. This gives me an early indication if we''ve
    accidentally released a new bug and gives me a chance to start addressing the
    issue before it''s reported by users.


    Best practices for generating exceptions. Ideally, enough information should be
    present in the exception report to diagnose the bug and formulate a strategy for
    repair. Use ContextedException and ContextedRuntimeException to safely include
    useful information with your exceptions. The reason for this is to save developer
    time in investigating the defect. If the exception report doesn''t provide enough
    information to diagnose the bug, then you have two changes to make: correct the
