    DEREK ASHMORE is an architect and consultant with more than twenty-five years
    experience in a wide range of technologies, including Java and Java EE. He frequently
    architects and designs high-usage web applications and manages development teams
    to build them. Many of his articles have been published in the Java Developer''s
