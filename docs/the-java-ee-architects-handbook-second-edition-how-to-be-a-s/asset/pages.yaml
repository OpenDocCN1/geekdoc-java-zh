    Explicitly listing columns in insert statements, as illustrated in listing 10.6b,
    is done for the same reason as explicitly listing columns in select statements.
    If someone reorders the columns in any of the tables or adds new columns, the
    insert could generate an exception, and you must modify the insert statement.
    For example, suppose that database administrator changes the order of the columns,
    putting column CUSTOM_NBR first, and adds a column called COUNTRY. The developer
    who used the shortcut will have to be oblivious to the change because the code
    will still work. In addition, that listing 10.6b uses variables, so the same PreparedStatement
    can be used for inserts if there are multiple inserts.


    As in select statements, explicitly listing columns in an insert statement is
    a best practice because it can eliminate the need for maintenance. Further, allowing
    reuse of the PreparedStatement improves performance, especially for inserts of
    large number of rows.


