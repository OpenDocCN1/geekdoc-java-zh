    # An Algorithm for Estimating


    It should be noted that application architects are responsible for estimating
    hours only. Project managers should be equipped to account for absences due to
    responsibilities to other projects and vacations.


    **Step 1:** Quantify the application; determine a rough number of web pages, batch
    jobs, reports, database tables, and external application interfaces. From previous
    history, you have timesheet data for comparable projects. From historical data,
    derive an average number of hours to complete one web page (assuming that access
    logic and business logic will need to be developed to support it). For example,
    with one of my current clients, my working average is forty to eighty hours per
    dynamic web page, depending on complexity. I have similar estimate ranges for
    batch jobs, reports, database tables, and external interfaces. Database tables
    are in the list as there are data modeling and database design steps to be performed
    as well as physically creating the tables. To derive a coding and unit-testing
    estimate, gather estimates of the following for the group of use cases being considered
    for the project:


    +   - Screens/pages (40–80 hours each)

    - External application interfaces (80–120 hours each)

    - Database tables (4–8 hours each)

    - Conversion batch jobs (24–40 hours each)


    If this is your first time estimating a project, you might not have historical
    data from comparable projects to draw upon; in which case, ask one of your colleagues
    who might. Ask your manager or one of the people you work with for sample project
    plans and estimates from previous projects.


    Not all items will exist for each use case. The basic estimates noted in parentheses
    in the preceding list are applicable if the development team hasn’t been formed.
    If there is an existing team, more accurate estimates for each item may be possible.
    Estimates at this point will not be exact. Estimating based on the number of objects
    is more accurate, but that number is not available before object modeling exercises
    are done.


    **Step 2:** Estimate coding and unit-testing time for each use case. Based on
    the information gathered in step 1, it is simple mathematics to get a base estimate
    for a combination of use cases. The *base estimate* is the length of time it takes
    for one developer to complete coding and unit-testing tasks. It may seem a bit
    strange to estimate coding and unit-testing time before design is complete, but
    few developers seem to be bothered by this ambiguity.'
