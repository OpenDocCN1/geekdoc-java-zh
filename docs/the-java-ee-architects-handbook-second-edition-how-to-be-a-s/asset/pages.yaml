- img_proc: true
  md: 'Frequently, problems—and hopefully their solutions—are reported in blogs on
    the Internet. The chance that a problem you encounter been previously reported
    and solved increases if your use is consistent with how the product was designed
    to be used.


    Ease of Use. Choosing products that are easy to use optimizes training costs,
    lowers development and support time, and potentially reduces the mean time from
    defect reporting to fix. Ease of use also makes the product more accessible to
    a wide variety of developers and provides management with greater flexibility.


    Let''s consider examples at both ends of the spectrum. To a development team that
    receives detailed HTML page designs for the applications they build, web presentation
    frameworks that rely on HTML templating, such as JSP, Freemarker, Velocity and
    Java Server Faces, will be easier to use than Wick, which consists of Java code
    exclusively.


    Market Share. Choosing products that are more widely used makes it easier to acquire
    developers with previous experience with that product. It also increases the chances
    that solutions will be posted on the Internet for problems encountered in development.
    Products with low market share are at risk for being abandoned and, consequently,
    will no longer be enhanced. If, the product is open source, you can enhance it
    internally, but rarely will organizations fund projects like that. In that case,
    it''s better to switch products.


    Market share numbers are usually hard to come by. I found two proxies for market
    share: search engine keyword search data can be obtained from Google Trends search
    engine keyword search data (http://www.google.com/trends/explore). A good source
    for job posting data is available at www.indeed.com/trending page (http://www.indeed.com/trends).
    As an example, let''s look at the popularity of several web presentation frameworks
    as presented in figure13.1.


    As you might expect, Apache Struts is the market leader followed by Java Server
    Faces (JSF) and Spring MVC. Note that job posting data, which I can''t find present
    due to licensing restrictions, show Spring MVC in second place with JSF in third.
    There are sometimes differences between trends noted by job posting data and keyword
    search data; you''ll have to make a judgment as to which results more closely
    represent market share. All web presentation frameworks included in my search
    had small market shares compared to those three.'
