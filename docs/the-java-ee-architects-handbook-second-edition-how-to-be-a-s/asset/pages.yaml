    # SECURITY CONSIDERATIONS


    Another important consideration is security. Most organizations will provide a
    security architecture for the enterprise along with processes for defining users
    and authorizing those for specific web applications and assigning them roles and
    security groups. Most developers can assume that users have already been authenticated
    and authorized to use the application being called. Developers can assume that
    the Java EE container will provide the identity of the authenticated user and
    the security roles to which they''ve been assigned.


    The Java EE container will enforce security constraints defined within the web.xml
    configuration file for your application. Security constraints will specify secured
    URLs and indicate which roles are allowed access to them. For instance, if all
    URLs in your application require the assignment of the Manager role, you might
    add a security constraint like the following to the web.xml file of the application:


    ```

    <security-constraint>

    <display-name>Restrict to those with Manager authority</display-name>

    <web-resource-collection>

    <web-resource-name>Protected Area</web-resource-name>

    <url-pattern>*.jsp</url-pattern>

    <url-pattern>*.html</url-pattern>

    </web-resource-collection>

    <auth-constraint>

    <role-name>Manager</role-name>

    </auth-constraint>

    </security-constraint>

    ```


