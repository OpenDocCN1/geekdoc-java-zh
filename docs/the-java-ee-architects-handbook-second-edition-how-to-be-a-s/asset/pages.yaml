- img_proc: true
  md: '# Chapter 2: Defining the Project


    There is no specific format for a use case. However, use cases usually contain
    a title, description, actor list, precondition list, trigger, main process flow,
    and alternative process flows.


    Use-case description text should begin with: "The system (or application) will
    . . ." If you identify a use case that cannot be written in this form, it''s likely
    not a valid use case but rather part of another one. Note that use cases often
    serve multiple actors. I recommend explicitly listing all affected actors in the
    use case.


    The following are examples of use case descriptions from a reporting system implemented:


    +   * The system will provide an interface that will allow users to run reports
    from data defined in an existing MVS/CICS application.

    * The system will allow application administrators to control the reports that
    members of a trust customer organization can run.

    * The system will allow application administrators to define new reports and publish
    them to users.


    An actor list describes the users who directly participate in the use case (see
    section "Identifying the Actors" in this chapter). Also also list a brief reason
    for the actors'' involvement in this use case. An example might be:


    +   * Trust customer, who wants to obtain information about his or her investments.

    * Application administrator, who wants to define additional reports and publish
    them to customers.


    A precondition list is a list of business conditions that must take place for
    this use case to occur. Examples include:


    +   * A trust customer has been obtained and logged in.

    * A new report has been requested.


    A trigger is an event that starts processing for the use case. Examples include:


    +   * A trust customer desires to run a report.

    * Application administrator starts work on defining a new report.


    The main process flow of a use case is a step-by-step description of use case
    processing with no errors. An example for a customer running a report might be:


    +   1 User displays a list of available reports.

    2 User selects a report to run.'
