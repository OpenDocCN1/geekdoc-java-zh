  md: '# DEFINING

    THE PROJECT


    The first step in developing any application is performing analysis to define
    its purpose, scope, and objectives. A Java EE application is no exception. Including
    analysis in the development process is basic common sense, but I''m continually
    amazed at how many projects muddle through without defining their target first.


    The application architect is not directly involved in defining the project; that
    is the job of the project manager, business analyst, and end user. However, the
    architect is responsible for ensuring that the project is defined with enough
    consistency and detail that it can be physically designed and implemented. Because
    most other members of the Java EE development team don''t know what information
    is required to design and implement an application, the application architect
    often facilitates project discussions.


    The application architect must possess analysis skills. Without analysis skills,
    an architect will not be able to recognize the weak points and gaps in project
    definition at the onset of the project, which is when these weak points are cheaper
    to address. On the other hand, architects with analysis skills are more likely
    to anticipate future feature requests because they are able to understand the
    business processes involved. While no effort will be put into constructing those
    features before they are requested, design choices can be made that will make
    it possible to add those features later. As an example, I expect that at some
    point in the future the customers may be able to have multiple accounts, although
    they can''t, I''ll make design choices that allow for that possibility.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Chapter 2: Defining the Project


    I can hear the groans of the developers as I write. Technical people want to hear
    more about coding techniques than project definition and analysis-gathering strategies.
    I completely understand. There''s nothing I like than producing good code that
    does something useful. However, to get good code, you need good analysis and good
    project definition. My experience is that the probability of getting useful code
    without decent analysis is slim to none.


    Use-cases are an important tool in analysis. The Unified Modeling Language (UML)
    specification was created to describe and document analysis and designs for systems
    that use object-oriented languages like Java. The main construct UML has for describing
    what an application will accomplish is the use case. This chapter defines the
    term use case, guides you through writing use cases for a project, lists some
    mistakes in creating use cases and how to avoid them, and presents and discusses
    an example of use cases written for one.


    This chapter does not contain a comprehensive synopsis of use cases with respect
    to the UML specification. I present the subset of the specification that is commonly
    used and practical. For a thorough treatment of the UML specification, Booch,
    Rumbaugh, and Jacobson (1999).


    Although some developers distinguish between use cases and requirements, I see
    no difference. Requirements are the specific features, written in business terms,
    that an application must provide. Therefore, requirements are typically use cases
    written in summary form.


    If you''re using agile methodologies, such as Scrum, you create user stories rather
    than use cases. Both constructs fulfill the same purpose: communicating requirements.
    User stories are a brief statement of what a user needs or needs to do with an
    application. For example, "The application needs to remember my last product search
    and pre-fill the filters I specified last time; I do the same search of the time."
    User stories do not contain enough detail to allow for implementation; verbal
    communication with the user representative is required to flesh out the details.
    Cases, in contrast, have enough of detail to allow for implementation. Whether
    the user uses cases or arrives at the requirements using user stories and verbal
    communication is simply a difference in function and tactics.


    Additionally, I like to prototype the user interfaces. A prototype is an excellent
    vehicle for enabling the business side and developers to understand the target
    of a development project. I usually have no trouble getting the business side
    interested in the prototyping process because it concretely represents what they''re
    going to get. Prototyping helps refine the use cases.


    Once you''ve defined a project''s use cases (or stories), you can create a fairly
    detailed definition of the project, written in business terms, that both developers
    and businesspeople can understand. This allows the business side'
  merge: -1
