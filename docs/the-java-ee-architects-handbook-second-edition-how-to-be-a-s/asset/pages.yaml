    # Critical Path


    The critical path is a set of dependent tasks that must complete on time for the
    project to complete on time. In effect, the critical path determines the length
    of the project. A delay of one day to a task in the critical path will delay the
    project by one day. Conversely, one day saved in the critical path may allow the
    project to come in one day early. Let''s use an example everyone can relate to:
    I''m doing laundry on the side as I write this. My laundry project isn software-related,
    but all of the concepts are exactly the same. It takes about ninety minutes to
    do one load of laundry: thirty minutes to wash, fifty minutes to dry, and ten
    minutes to fold. If I only need to do one load, all three tasks are on the critical
    path. Every minute I deferring clothes from the washer to the dryer is a minute
    added to the entire project.


    Sometimes, not all tasks in the project are on the critical path. Noncritical-tasks
    can usually be delayed or rescheduled without impact to the project completion
    time. Suppose I need to do two loads of laundry (and I have one and one dryer)
    and wish to complete the project in 120 minutes. The first wash is on the critical
    path, but the second wash isn''t. I could start the'
