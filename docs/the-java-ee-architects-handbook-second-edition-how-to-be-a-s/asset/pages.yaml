- img_proc: true
  md: '# Chapter 1: Project Development Team and Project Life Cycle


    An infrastructure specialist is often essential when you are working with or designing
    a continuous integration environment, providing build automation, or are dealing
    with complex hardware infrastructures that involve clustering and other nontrivial
    environment setup.


    The application architect defines infrastructure requirements for the infrastructure
    specialist. The architect works with the specialist to determine the number and
    nature of the environments needed and what level of support is required for each
    environment. Many projects need at least one development, testing, and production
    environment. Some organizations combine the role of infrastructure specialist
    with that of application architect.


    # Testing Specialist


    A testing specialist is typically a detail-oriented person who makes sure that
    the application produced matches the specifications and is reasonably free of
    bugs. Typically, a testing specialist has at least a basic knowledge of the business
    area.


    The application architect works with testing staff to identify any infrastructure
    requirements and support needed. The project manager and the business analyst
    usually work with the testing specialist to establish the content of test plans
    and the testing methodology. Therefore, the architect''s role in testing is usually
    support. For larger development efforts, the testing specialist role could be
    staffed by entire testing teams and the testing manager.


    # Testing Automation Specialist


    A testing automation specialist is usually necessary for larger projects where
    it is anticipated that multiple application iterations and versions of the application
    will be delivered. The test automation specialist can script integration tests
    that can be performed as part of an application regression, and that can be executed
    on a per release basis or as part of a continuous integration environment where
    tests are executed on every successful build.


    # PROJECT LIFE CYCLE APPROACHES


    There are differing schools of thought as to what the Java project life cycle
    should be. This section describes these schools of thought and presents my personal
    views on the topic. The guidelines presented in this book are intended to be compatible
    with any methodology.


    # Waterfall Approach


    The waterfall approach entails performing all analysis and design for a project
    before coding and testing. This approach was commonly used when most development
    was mainframe-based and is still one of the most companies prefer.


    Projects developed under the waterfall approach tend to be large and have'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Project Life Cycle Approaches


    long delivery times. Hence, they entail more risk. These projects usually don''t
    require business participants to learn as much technical terminology, and the
    business-side interface is tightly controlled.


    Compared with other approaches, the waterfall approach to project development
    does not provide feedback as early in the process, but it delivers a more complete
    solution. Waterfall projects tend to fit neatly into the budget planning cycle,
    which may be one reason for the popularity of this approach.


    Because of the length of time waterfall projects typically require, the business
    requirements often change during the project. Project managers then face a dilemma:
    if the project doesn''t change with the business, the resulting application won''t
    provide as much benefit; and if the project course to follow business requirement
    changes, the time and resources needed for the project will be negatively affected.


    # Agile Approaches


    Agile approaches strive to separate a project into small component pieces that
    typically need few resources. Thus, agile approaches are the antithesis of the
    waterfall approach. Agile approaches can be viewed as a “family” of approaches
    with many varying implementations. The most popular implementation of agile methods
    at the time of this writing appears to be Scrum. Other examples of agile implementations
    are Extreme Programming (XP), Lean, and Crystal. For the context of this discussion,
    use Scrum as the primary example of agile methodologies as it appears to be the
    most well known.


    The central objective of agile methodologies is to reduce the technical risks
    and project costs that plague the waterfall approach. Agile methodologies use
    the following assumptions:


    +   - Matching earlier is cheaper in the long run.

    - Reducing complexity also reduces technical risk and is cheaper than the long
    run.

    - Short iterations lead to improved return on investment (ROI) and the ability
    to more quickly adapt to changing business requirements.

    - Focus on test automation results in more efficient use of development resources.


    Agile approaches dictate that you break the problem up into many small problems
    (called stories) that take three weeks or less to implement. Each story is co-developed
    by two programmers using one machine. The programmatic test to determine if the
    new story functionality is developed and added to the regression test suite when
    the story is developed. These programmers ignore every aspect of the application
    except the story they are working on. A business participant is dedicated to the
    project and is immediately available to answer any business questions that arise.'
