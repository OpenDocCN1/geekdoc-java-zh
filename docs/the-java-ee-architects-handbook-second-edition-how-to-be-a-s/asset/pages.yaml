    # DEPLOYMENT LAYER


    Deployment wrappers publish business object functionality to Java classes that
    could be on separate machines (including anything in the presentation tier). Examples
    of deployment wrappers include enterprise beans (e.g., session beans, message-driven
    beans) and web services.


    Promoting reuse is the motivation for deploying business functionality so that
    it can be called by other applications. That is, it''s better to reuse existing
    functionality than to reinvent it. Sometimes the functionality to be reused is
    changing frequently or has onerous requirements that make it difficult to merge
    that functionality in your application as common code.


    Deployment layer classes publish business logic. Service layer classes utilize
    business logic classes and reference entity classes and value objects. They do
    not reference data access classes directly.


    Do not implement business logic directly within deployment classes. Some developers
    consider enterprise beans to represent business logic. Although it is technically
    possible to consolidate business objects and enterprise beans into the same class,
    I don''t recommend it. Keeping the business logic separate gives you complete
    deployment flexibility. You can deploy the same business object as an enterprise
    bean, a message-driven bean, a web service, or even a client application with
    no changes to the underlying'
