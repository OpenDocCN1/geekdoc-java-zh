  md: 'example, embedding business logic in DAO classes (a common mistake I see) makes
    the DAO more complex and also less versatile as it now assume a call context.
    Had that business logic been separated out, it would be much easier to reuse that
    DAO class for other features in the application.


    Only give software components information they to accomplish their task. Providing
    unnecessary information makes the software component harder to use because what’s
    important is hard to distinguish from what’s needed. For instance, if you provide
    a class method a full customer class when it only needs the customer’s first,
    middle, and last name, it’s unclear which portion of the customer entity the component
    actually needs. When changing the customer entity, that component would have to
    be examined for possible impact. On the other hand, if the three strings were
    the arguments for that component method, changes to the customer entity class
    could not possibly affect that component’s behavior. Avoid unnecessary parameters
    in methods. Avoid unnecessary class-level fields. Expressed another way, components
    are like spies; they should operate on a “need-to-know” basis.


    Individual classes and methods should not make assumptions about execution context.
    In other words, classes and methods should be independent and shouldn’t assume
    they are a part of a larger class sequence. For example, I’ve seen developers
    hardcode commits in DAO classes, assuming that the particular DAO will only be
    used in a specific use case. This limits use of that DAO class since it really
    can’t be used in other use cases which have additional database writes to perform
    in the same unit of work. It would have been better to handle the commit or rollback
    separately; as it’s a cutting concern, I often handle commits and rollbacks using
    a servlet filter instead. Often, developers have a hard time with this concept.
    They have a hard time visualizing uses for a particular section of code other
    than the use they are currently concerned with


