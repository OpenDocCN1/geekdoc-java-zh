- img_proc: true
  md: '# Unit Testing Guidelines


    than to micromanage exactly when in the development process a developer writes
    the code.


    **What level of unit test coverage is adequate?** Most organizations won''t find
    100 percent unit test coverage. In any case, it doesn''t completely eliminate
    bugs because it only tests the inputs that are scripted in the unit tests. While
    unit tests allow developers to refactor code more safely, it also means that more
    code is involved for each change (you need to change the expectations in the unit
    tests along with changing the behavior of the application), then leading to a
    longer development time for that. Pundits would argue that additional time spent
    maintaining the unit test cases be made up, because less time will be needed to
    fix bugs, given that there will be fewer bugs to fix.


    If you''re curious as to the code coverage percentage experienced by other applications,
    check Nemo (http://nemo.sonarource.org/). Nemo is sponsored by Sonar and presents
    Sonar statistics, including code coverage, for several popular open source projects.
    You''ll quickly see that the code coverage varies wildly from project to project.
    If you''re skeptical that less than 100 percent code coverage might be acceptable,
    visit Nemo; you''ll find that most projects (including some very successful projects)
    operate with well under 100 percent unit test coverage.


    There are products that will measure unit test coverage for you. One product,
    Sonar (http://www.sonarource.org/), is open source and freely available. Sonar
    also provides a variety of software metrics to help measure the quality of your
    applications. Another product that will measure unit test coverage is Crop4 (http://www.crop4.org/).


    I usually recommend requiring at least one positive and one unit test per public
    and protected method—for data access and business logic classes and for all utility
    classes. A positive test is one where the method completes normally. A negative
    test is where the method issues an exception (e.g., for invalid input).


    This is far from 100 percent coverage, but it''s simple to follow. Simple to follow
    means that it''s more likely to be followed. While it is possible to express this
    requirement in terms of a code coverage percentage and arrange for automated testing
    to measure this percentage, which takes more time and shifts management work onto
    the developer. In all honesty, utility classes probably should have a higher test
    coverage as they are often more widely used than business logic or data access
    classes.


    At a management level, I try to ensure that unit tests exist for the most commonly
    executed code and the most complex code. Both Sonar and Crop4J also provide code
    complexity metrics in addition to code coverage metrics. Also, if a section of
    code continues to appear in defect reports, ensuring that this code has an adequate
    test harness is a way to reduce its defect rate.'
