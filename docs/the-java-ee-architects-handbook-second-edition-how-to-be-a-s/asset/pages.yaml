  md: '# Chapter 16: Testing Guidelines and Strategy


    Take a thread dump during a load test. Believe it or not, a thread dump taken
    during a failing load test will have the same information as what a profiler gives
    you; it''s just as easy to interpret. Let me explain why that''s a true statement.


    A profiler works by taking a copy of all thread stacks every defined interval
    (usually five milliseconds or ten milliseconds). When method CustomerDAO.findByCustomerId()
    is encountered, metrics associated with that method are tallied. The more time
    you spend in CustomerDAO.findCustomerId(), the higher those totales and the more
    your profiler considers that method a hot spot. A hot spot is a section of code
    that appears as a larger number of observations than other sections of code. This
    can be because it''s executed more often or because it takes longer to execute.


    When you take a thread dump on a load test where all threads are at a random place
    in the test script, you''re effectively taking many profiler-type observations
    at once. If CustomerDAO.findByCustomerId() shows up in active threads, a hot spot
    and will yield performance improvement if tuned.


    There are tools like the Thread Dump Analyzer (http://java.net/projects/tda/)
    that make interpreting a thread dump a bit easier. I check thread dumps for lock
    contention (threads marked as BLOCKED and waiting on a resource). Profiling one
    will not tell you anything about lock contention.


    Tuning methods that aren''t hot spots isn''t a use of time. For example, you can
    tune a section of code and get a 10 percent improvement over it. Tuning a hot
    spot consuming 50 percent of your time will get you a 5 percent throughput improvement
    overall (50 percent times 10 percent). Tuning some other method that consumes
    5 percent of your time will generate only a 0.5 percent throughput improvement
    (5 percent times 10 percent overall).


    Use profiler tools to tune hot spots with a specific unit test script. A profiler
    reports the activity of a JVM at a configurable interval (typically every five
    milliseconds) and reports the stack call in every thread. The methods taking the
    most time will most likely show up in more observations and provide leads to where
    you should tune. My preference is to construct a Unit test that executes the nonperforming
    code.


    If your container use JVM, you can profile the entire container and run your JMeter
    test script against it. I profile a Java EE container as a whole as a last resort
