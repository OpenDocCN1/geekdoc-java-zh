    no longer memory to service user requests and the container becomes inoperative.
    Usage spikes are memory used to satisfy user activities. Usage spikes can be initiated
    by unexpectedly heavy user volume or unexpectedly large requests for information.
    Please note that Java allocates memory for purposes other than the heap, but heap
