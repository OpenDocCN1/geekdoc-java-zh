    # Investigating Java Contention Issues


    Code that uses the synchronized keyword is potentially a creator of contention
    issues. That is because use of the synchronized keyword forces that section of
    code to be executed by one and only one thread at a time. There are cases where
    synchronization is necessary; however, it should be used with care. The synchronized
    keyword can be declared on individual methods or can be used to guard access to
    all synchronized methods in a specific object. Entire books have been written
    on the subject of multi-threaded programming. That topic is really out of scope
    for this book.


    Contention issues often appear to users as performance issues. The bottlenecks
    that occur as a result of contention issues increase clock time consumed by all
    threads involved. Hence, contention limits throughput. Load tests revealing contention
    issues will often display a throughput limit as a symptom. As an example, a contention
    issue in one of my Java EE applications limited throughput of a load test to under
    5 hits (hps). No matter how we changed settings on the load test, we couldn''t
    exceed 5 hps.'
