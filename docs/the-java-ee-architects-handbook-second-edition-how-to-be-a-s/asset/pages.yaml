  md: '# CHAPTER 11


    # BUILDING

    BUSINESS OBJECTS


    The business logic layer for Java EE applications combines data with application
    logic, business rules, constraints, and activities. I usually package business
    objects separately to maximize the possibility of reuse. It’s common for business
    objects to use and coordinate the activities of multiple data access objects.
