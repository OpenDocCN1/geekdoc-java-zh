  md: '# Chapter 1: Project Development Team and Project Life Cycle


    Using pairs of programmers to code everything theoretically reduces the probability
    that an error survives to deployment. Using pairs also tends to make code simpler
    because it takes time to explain the concept to another person. The more complicated
    the algorithm, the harder it is to explain. The emphasis on reducing complexity
    makes it less likely that mistakes will occur.


    The emphasis on testing, creating, and frequently running a regression test catches
    mistakes early and reduces the probability that any change will inadvertently
    introduce new bugs or have other unintended consequences.


    Scrum and other agile methodologies reduce risk by providing feedback early. A
    development team proceeding down the wrong track will be alerted and corrected
    earlier, when it''s much cheaper to make changes.


    # Rational Unified Process


    The Rational Unified Process (RUP) is a formalized development methodology. RUP
    literature describes it as an iterative approach, but that''s only half the story.
    RUP emphasizes starting with requirements gathering, analysis, and design activities
    for the entire project—including object and data modeling—before proceeding to
    construction. In this sense, RUP takes a waterfall approach to analysis and design
    but an iterative approach to construction and delivery. By encouraging early requirements
    gathering and analysis, RUP seeks to keep the project aligned with user expectations.


    RUP mitigates risk by encouraging the team to develop the riskiest priorities
    of the project first, allowing more time to recognize and respond to issues and
    problems. It also reduces rework when the design requires alteration.


    # Which Approach Is Most Popular?


    I''m not prepared to declare any of these approaches “best.” They all have advantages
    and disadvantages. The waterfall approach appears to be the most commonly used
    in corporate environments where budgeting is paramount. Many companies use (and
    are more comfortable with) a waterfall approach to initial development and major
    enhancements. While more iterative with the waterfall approach, the iteration
    size is usually larger than with agile approaches.


    Agile methodologies are rarely used in pure form. This isn''t a judgment; it''s
    merely an observation. Given that, measuring the adoption rate for agile methodologies
    is problematic. Two recent attempts to measure adoption rates are the following:
    http://visual.com/agile/agile-2012-state-union and http://www.kclockwork.com/blog/agile/agile-development/agile-adoption-update/.
    From these surveys, some observations can be made.


    Scrum appears to be the most popular of agile methodologies. This is substantiated
    by keyword statistics from Google Trends (figure 1.1). However, it also appears
    that organizations using agile methodologies use agile for some, but not all,
    of their development. It could be that different managers'
  merge: -1
