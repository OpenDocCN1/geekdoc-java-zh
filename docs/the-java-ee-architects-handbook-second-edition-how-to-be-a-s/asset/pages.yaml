  md: '# CHAPTER 5


    # # A LAYERED APPROACH TO JAVA EE DESIGN

    \Application architects, by definition, must supply application developers with
    an overall design. It is important that developers understand the overall design
    so they can make lower level coding decisions; architects can''t expect developers
    to follow a design they don''t understand. Furthermore, if developers have disagreements
    with the intended design, it''s best to resolve those disagreements before too
    much code is written.


    Although extensive documentation is frowned upon these days as many modern trend
    toward agile methodologies, some amount of design documentation is needed. The
    larger the effort (and the number of developers), the more extensive this documentation
    needs to be. Having some amount of documentation allows you to more quickly and
    easily involve additional developers in the effort, should that be needed.


    This chapter presents and explains a general approach to designing Java EE applications.
    This discussion is necessary background to the next chapter, which offers tips
    and techniques for transforming the use-case analysis described in previous chapters
    into a concrete design. It is a general approach that can be applied to all business
    applications.


    The fact that my approach to all Java EE business applications is consistent allows
    me to minimize the documentation needed for each application built. Since developers
    who have worked with me on previous projects are already familiar with the concept,
    there''s less time spent getting developers up to speed on my designs or transferring
    developers between development efforts. It also minimizes the number of support
    developers needed for each application.'
