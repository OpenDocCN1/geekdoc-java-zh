  md: '# Chapter 7: Creating the Data Model


    Using data modeling terminology, we would identify a Customer entity that is the
    super-type. We would also identify the Banking Customer, Mortgage Customer, and
    Brokerage Customer as sub-types. The Customer entity contains all attributes common
    to all three sub-types. Each occurrence of Customer has a corresponding occurrence
    in one and only one of the sub-type entities. The The terminology differs, but
    the concept is very similar to an inheritance relationship on the Java side.


    Super-type/sub-type relationships can be physically implemented in two ways. They
    can be expressed as separate entities or combined into one entity. Figure 7.3b
    illustrates a relationship of this type. Notice that the relationships in this
    example are all one-to-one and are optional. Notice that attributes common to
