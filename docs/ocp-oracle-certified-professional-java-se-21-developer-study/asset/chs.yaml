  6. 以上均不是。\n\n### 14. 关于以下代码的哪些陈述是正确的？（选择所有适用项。）\n\n```java\nObject o1 = new Object();\n\
  Object o2 = new Object();\ntry (var service = Executors.newFixedThreadPool(2)) {\n\
  \    var f1 = service.submit(() -> {\n        synchronized (o1) {\n            System.out.print(\"\
  Tortoise\");\n        }\n    });\n    var f2 = service.submit(() -> {\n        synchronized\
  \ (o2) {\n            System.out.print(\"Hare\");\n        }\n    });\n    f1.get();\n\
