  \ | --- | --- | --- | --- |\n| 访问修饰符 | 全部 | 全部 | 无 | 无 |\n| abstract | 是 | 是 | 是\
  \ | 否 |\n| final | 是 | 是 | 是 | 否 |\n\n你也应该了解表 7.5 关于访问类型的信息。例如，考试可能会尝试欺骗你，让静态类在没有外部类引用的情况下，访问外部类的实例成员变量。\n\
  \n### 表 7.5 嵌套类访问规则\n\n|    | 内部类 | 静态嵌套类 | 局部类 | 匿名类 |\n| --- | --- | --- | ---\
  \ | --- |\n| 是否可以包含实例和静态成员？ | 是 | 是 | 是 | 是 |\n| 是否可以扩展类或实现任意数量的接口？ | 是 | 是 | 是\
  \ | 否——必须恰好有一个父类或接口 |\n| 是否可以访问外部类的实例成员？ | 是 | 否 | 是（如果是在实例方法中声明） | 是（如果是在实例方法中声明）\
  \ |\n| 是否可以访问外部方法的局部变量？ | 不适用 | 不适用 | 是（如果为 final 或事实上的 final） | 是（如果为 final 或事实上的\
  \ final） |\n\n### 理解多态\n\n我们通过讨论多态来结束本章，多态是对象能够以许多不同形式存在的属性。更准确地说，可以使用以下方式访问 Java\
  \ 对象：\n\n* 与对象类型相同的引用\n* 是对象父类的类型的引用\n* 对象实现或继承的接口的引用\n\n此外，如果将对象重新赋值为该对象的超类类型或接口，则不需要强制类型转换。呼，这可真多！别担心，你很快就会理解的。\n\
  \n让我们通过下面的示例来阐明这种多态属性：\n\n```java\npublic class Primate {\n    public boolean hasHair()\
  \ {\n        return true;\n    }\n}\n\npublic interface HasTail {\n    public abstract\
  \ boolean isTailStriped();\n}\n\npublic class Lemur extends Primate implements HasTail\
  \ {\n    public boolean isTailStriped() {\n        return false;\n    }\n    public\
  \ int age = 10;\n    public static void main(String[] args) {\n        Lemur lemur\
  \ = new Lemur();\n        System.out.println(lemur.age);\n        HasTail hasTail\
  \ = lemur;\n        System.out.println(hasTail.isTailStriped());\n        Primate\
  \ primate = lemur;\n        System.out.println(primate.hasHair());\n    } \n}\n\
  ```\n\n这段代码可以编译并打印以下输出：\n\n```\n10\nfalse\ntrue\n```\n\n关于这个示例最需要注意的点是，只创建了一个对象\
  \ `Lemur`。多态允许将 `Lemur` 的实例使用其超类型之一（如 `Primate` 或 `HasTail`）重新赋值或传递给方法。\n\n一旦对象被赋值给新的引用类型，只有该引用类型可用的方法和变量才能在对象上调用而无需显式转换。例如，以下代码段将无法编译：\n\
  \n```java\nHasTail hasTail = new Lemur();\nSystem.out.println(hasTail.age);    \
  \         // 无法编译\n\nPrimate primate = new Lemur();\nSystem.out.println(primate.isTailStriped());\
  \ // 无法编译\n```\n\n在这个示例中，引用 `hasTail` 只能直接访问用 `HasTail` 接口定义的方法；因此，它不知道变量 `age`\
  \ 是对象的一部分。同样，引用 `primate` 只能访问在 `Primate` 类中定义的方法，它无法直接访问 `isTailStriped()` 方法。\n\
  \n### 对象 vs. 引用\n\n在 Java 中，所有对象都是通过引用访问的，因此作为开发者，你永远无法直接访问对象本身。从概念上说，你应该将对象视为内存中存在的由\
  \ Java 分配的实体。无论你拥有内存中对象的引用是什么类型，对象本身都不会改变。例如，由于所有对象都继承 `java.lang.Object`，它们都可以被重新赋值为\
  \ `java.lang.Object`，如下例所示：\n\n```java\nLemur lemur = new Lemur();\nObject lemurAsObject\
  \ = lemur;\n```\n\n尽管 `Lemur` 对象已被赋值给一个不同类型的引用，但对象本身并没有改变，仍然作为 `Lemur` 对象存在于内存中。那么，改变的是我们通过\
  \ `lemurAsObject` 引用访问 `Lemur` 类内部方法的能力。如果没有显式转换回 `Lemur`（正如你在下一节看到的），我们不再无法访问对象的\
  \ `Lemur` 属性。\n\n我们可以用以下两个规则总结这一原则：\n\n1. 类型决定了对象内部存在哪些属性。\n2. 引用的类型决定了哪些方法和变量是可访问的。\n\
  \n图 7.8 对象 vs 引用\n\n## 现实世界场景\n\n### 使用接口引用\n\n在处理一组实现共同接口的对象时，使用接口作为引用类型被认为是一种良好的做法。这在你在第\
  \ 9 章中学习的集合中为常见。考虑以下方法：\n\n```java\npublic void sortAndPrintZooAnimals(List<String>\
  \ animals) {\n    Collections.sort(animals);\n    for(String a : animals) System.out.println(a);\n\
  }\n```\n\n该方法按字母顺序排序并打印动物。该类在任何时候都不关心 animals 的实际对象是什么。它可能是 `ArrayList` 或其他类型。重点是，由于我们使用了接口引用而不是类类型，我们的代码对这些任何类型都有效。\n\
  \n### 强制类型转换\n\n在之前的示例中，我们创建了一个 `Lemur` 对象的实例，并通过父类和接口引用访问它。然而，一旦我们更改了引用类型，我们就失去了对子类中定义的更具体的成员的访问，尽管这些成员仍然存在于对象中。我们可以通过将对象转换回它的特定子类来重新获取这些引用：\n\
  \n```java\nLemur lemur = new Lemur();\nPrimate primate = lemur; // 隐转换为超类\nLemur\
  \ lemur2 = (Lemur)primate;  // 显式转换为子类\nLemur lemur3 = primate;         // 无法编译（缺少转换）\n\
  ```\n\n\n\n\n对象的转换与基本类型的转换类似，正如你在第 2 章“运算符”中所看到的那样。在转换对象时，如果转换为已继承的超类型，则不需要转换操作符。这被称为隐式转换，适用于对象所继承的类或接口。相反，如果你想访问当前引用的子类型，则需要使用兼容的类型执行显式转换。如果底层对象与类型不兼容，则在运行时将抛出\
  \ `ClassCastException`。\n\n在复习涉及转换和多态的考试题时，务必记住对象的实例到底是什么。然后，关注编译器是否允许在带有或不带显式转换的情况下对该对象进行引用。\n\
  \n我们将这些概念总结为一组规则，供你记忆以时备用：\n\n1. 从子类型到超类型进行引用转换不需要显式转换。\n2. 从超类型到子类型进行引用转换需要显式转换。\n\
  3. 在运行时，将引用转换为不兼容的类型进行无效转换会导致抛出 `ClassCastException`。\n4. 编译器不允许向不相关的类型进行转换。\n\n\
  #### 不允许的转换\n\n前三条规则只是对我们目前所说内容的回顾。最后一条规则稍微复杂一些。考试可能会尝试用编译器已知是不允许的（即不可能的）转换来欺骗你。在在上一个例子中，我们能够将\
  \ `Primate` 引用转换为 `Lemur` 引用，因为 `Lemur` 是 `Primate` 的子类，因此它们是相关的。请考虑这个例子：\n\n```java\n\
  public class Bird {}\n\npublic class Fish {\n    public static void main(String[]\
  \ args) {\n        Fish fish = new Fish();\n        Bird bird = (Bird)fish;  //\
  \ 无法编译\n    }\n}\n```\n\n在这个例子中，`Fish` 和 `Bird` 类没有通过编译器感知的任何类层次结构建立联系；因此，代码无法编译。虽然它们都隐式地扩展了\
  \ `Object`，但它们被认为是不相关的类型，因为其中一个不能是另一个的子类型。\n\n#### 接口转换\n\n虽然编译器可以强制执行类向不相关类型转换的规则，但对于接口并不总是能这样做。记住，接口支持多重继承，这限制了编译器对它们进行推理的能力。虽然给定的类可能没有实现某个接口，但某些子类可能会实现该接口。当持有某个特定类的引用时，编译器并不知道它持有的是哪个具体的子类型。\n\
  \n让我们尝试一个例子。你认为以下程序可以编译吗？\n\n```java\n1: interface Canine {}\n2: interface Dog {}\n\
  3: class Wolf implements Canine {}\n4:\n5: public class BadCasts {\n6:     public\
  \ static void main(String[] args) {\n7:         Wolf wolfy = new Wolf();\n8:   \
  \      Dog badWolf = (Dog)wolfy;\n9:     } } }\n```\n\n在这个程序中，第 7 行创建了一个 `Wolf`\
  \ 对象并将其赋值给 `Wolf` 引用类型。对于接口，编译器执行许多规则的能力有限，因为即使引用类型可能没有实现某个接口，它的某个子类也可以实现。因此，它允许第\
  \ 8 行到 `Dog` 引用类型的无效转换，尽管 `Dog` 和 `Wolf` 并不相关。不要担心，尽管代码编译，它在运行时仍然会抛出 `ClassCastException`。\n\
  \n除了这个限制之外，编译器可以强制执行接口转换中的一条规则。如果对象类型绝不可能实现该接口（例如类被标记为 `final`），则编译器不允许从接口引用到对象引用的转换。例如，如果我们更改之前代码的第\
  \ 3 行会怎样？\n\n```java\n3: final class Wolf implements Canine {}\n```\n\n第 8 行不再编译。编译器识别出\
  \ `Wolf` 没有任何可能的子类能够实现 `Dog` 接口。\n\n#### instanceof 运算符\n\n`instanceof` 运算符可以用于检查对象是否属于特定的类或接口，并防止运行时抛出\
  \ `ClassCastException`。正如我们在第 3 章中看到的，它也可以与模式匹配一起。考虑以下示例：\n\n```java\n1: class Rodent\
  \ {}\n2:\n3: public class Capybara extends Rodent {\n4:     public static void main(String[]\
  \ args) {\n5:         Rodent rodent = new Rodent();\n6:         var capybara = (Capybara)rodent;\
  \  // ClassCastException\n7:     }\n8: }\n```\n\n该程序在第 6 行抛出异常。我们可以将第 6 行替换为以下内容：\n\
  \n```java\n6:         if(rodent instanceof Capybara c) {\n7:             // 执行某些操作\n\
  8:         }\n```\n\n现在代码段在运行时不会抛出异常，并且只有在 `instanceof` 运算符成功时才执行转换。\n\n正如编译器不允许将对象转换为不相关的类型一样，它也不允许将\
  \ `instanceof` 用于不相关的类型。我们可以通过不相关的 `Bird` 和 `Fish` 类来演示。\n\n```java\npublic class\
  \ Bird {}\npublic class Fish {}\n```\n\n#### 多态与方法重写\n\n在 Java 中，多态规定，当你重写一个方法时，你会替换所有对该方法的调用。例如，你认为以下输出是什么？\n\
  \n```java\nclass Penguin {\n    public int getHeight() { return 3; }\n    public\
  \ void printInfo() {\n        System.out.print(getHeight());\n    }\n}\n\nclass\
  \ EmperorPenguin extends Penguin {\n    public int getHeight() { return 8; }\n}\n\
  ```\n\n如果你说的是 8，那么你已经在理解多态的道路上了。在这个例子中，被操作的对象是 `EmperorPenguin`。尽管 `printInfo()`\
  \ 定义在 `Penguin` 类中，但调用 `getHeight()` 调用的是与内存中对象相关的方法，而不是调用处的引用类型。\n\n多态在运行时替换方法的能力是\
  \ Java 最重要的属性之一。它允许你创建复杂的继承模型，其子类对重写的方法有它们自己的实现。这意味着父类不需要更新来使用自定义或重写的方法。如果该方法被正确地重写，那么重写后的版本将在所有调用它的地方被使用。\n\
  \n记住，你可以通过将方法标记为 `final` 来限制多态行为，这可以防止它们被重写。\n\n#### 调用重写方法的父类版本\n\n仅仅因为方法被重写了并不意味着父类方法完全无法访问。我们可以使用你学过的\
  \ [ 6] 中的 `super` 引用来访问它。你如何修改我们之前的示例来打印 3 而不是 8？你可以尝试在父类 `Penguin` 类中调用 `super.getHeight()`：\n\
  \n```java\nclass Penguin {\n    public int getHeight() { return 3; }\n    public\
  \ void printInfo() {\n        System.out.print(super.getHeight());  // 无法编译\n  \
  \  }\n}\n```\n\n遗憾的是，这无法编译，因为 `super` 指向 `Penguin` 的超类；在这种情况下是 `Object`。解决方案是在子类\
  \ `EmperorPenguin` 类中重写 `printInfo()`并在那里使用 `super`。\n\n```java\npublic class EmperorPenguin\
  \ extends Penguin {\n    public int getHeight() { return 8; }\n    public void printInfo()\
  \ {\n        System.out.print(super.getHeight());\n    }\n    public static void\
  \ main(String []fish) {\n        new EmperorPenguin().printInfo();  // 3\n    }\n\
  }\n```\n\n### 重写与隐藏成员\n\n\n\n\n方法重写（method overriding）会在所有调用该方法的地方替换它，但静态方法和变量隐藏（static\
  \ method and variable hiding）则不会。严格来说，隐藏成员并不是多态的形式，因为方法和变量保持着各自的属性。与方法重写不同，隐藏成员对引用类型以及使用该成员的位置非常敏感。\n\
  \n让我们来看一个例子：\n\n```java\nclass Penguin {\n    public static int getHeight() { return\
  \ 3; }\n    public void printInfo() {\n        System.out.println(this.getHeight());\n\
  \    }\n}\n\npublic class CrestedPenguin extends Penguin {\n    public static int\
  \ getHeight() { return 8; }\n    public static void main(String… fish) {\n     \
  \   new CrestedPenguin().printInfo();\n    }\n}\n```\n\n`CrestedPenguin` 示例与我们之前的\
  \ `EmperorPenguin`（皇帝企鹅）示例几乎相同，尽管正如你可能已经猜到的，它打印的是 3 而不是 8。`getHeight()` 方法是静态的，因此是被隐藏了而不是重写。结果是，在\
  \ `CrestedPenguin` 中调用 `getHeight()` 返回的值与在 `Penguin` 中调用的不同，即使底层对象是同一个。相比之下，在重写方法时，对于同一个对象，无论在哪个类中调用，返回的都是都是值。\n\
  \n那么我们在 `this.getHeight()` 中使用它来访问静态方法这一点是怎么说的呢？正如第 5 章 中讨论的，虽然允许使用实例引用来访问静态变量或方法，但通常不建议这样做。当你以非静态的方式访问静态成员时，编译器会向你警告。在这种情况下，`this`\
  \ 引用对程序的输出没有影响。\n\n除了位置之外，引用类型也可以决定你在处理隐藏成员时获得的值。准备好了吗？让我们尝试一个更复杂的例子：\n\n```java\n\
  class Marsupial {\n    protected int age = 2;\n    public static boolean isBiped()\
  \ {\n        return false;\n    }\n}\n\npublic class Kangaroo extends Marsupial\
  \ {\n    protected int age = 6;\n    public static boolean isBiped() {\n       \
  \ return true;\n    }\n    public static void main(String[] args) {\n        Kangaroo\
  \ joey = new Kangaroo();\n        Marsupial moey = joey;\n        System.out.println(joey.isBiped());\n\
  \        System.out.println(moey.isBiped());\n        System.out.println(joey.age);\n\
  \        System.out.println(moey.age);\n    }\n}\n```\n\n程序打印以下内容：\n```\ntrue\n\
  false\n6\n2\n```\n\n在这个示例中，内存中只创建并存储了一个对象（类型为 `Kangaroo`）。由于静态方法只能被隐藏而不能重写，Java\
  \ 使用引用类型来决定应该调用哪个版本的 `isBiped()`，导致 `joey.isBiped()` 打印 true，而 `moey.isBiped()`\
  \ 打印 false。\n\n同样，`age` 变量被隐藏而非重写，因此使用引用类型来决定输出什么值。这导致 `joey.age` 返回 6，`moey.age`\
  \ 返回 2。\n\n对于考试，请确保你理解这些例子，因为它们展示了隐藏方法和重写方法本质上的区别。在实践中，方法重写是多态的基石，是一项极其强大的特性。\n\n\
  ### ![](img/image_rsrc10BB.jpg) 现实世界场景\n\n### 实践中不要隐藏成员\n\n尽管 Java 允许你隐藏变量和静态方法，但这被认为是一种极糟糕的编码实践。正如你在上一个示例所示，变量或方法的值会根据使用的引用不同而变化，这使得你的代码非常混乱、难以追踪，并且难以他人维护。当你开始在父类和子类方法中修改值时，情况会更加复杂，因为你不清楚正在更新哪一个变量。\n\
  \n当你在子类中定义新变量或静态方法时，良好的编码实践是选择一个未被继承成员使用的名称。不过，重新声明私有方法和变量被认为问题较小，因为子类原本就无法访问父类中的变量。\n\
  \n### 总结\n\n在本章中，我们介绍了高级面向对象设计中的许多主题，涵盖了类之外的许多顶层类型。我们从接口开始，描述了它们如何支持多重继承。记住，接口及其成员可以包含编译器自动插入的若干隐式修饰符。然后我们涵盖了考试中需要的所有六种类型的接口成员：抽象方法、静态常量、默认方法、静态方法、私有方法和私有静态方法。\n\
  \n接下来我们转向了枚举（enums），它们是编译时常量属性。简单的枚举由值列表组成，而复杂的枚举可以包含构造函数、方法和字段。枚举也可以用于 switch 语句和表达式。当枚举方法被标记为抽象（abstract）时，每个枚举值必须提供一个实现。\n\
  \n我们涵盖了密封类（sealed classes）以及它们如何允许类像枚举类型一样工作，即只允许某些子类。对于考试，重要的是记住密封类的子类必须被标记为 `final`、`sealed`\
  \ 或 `non-sealed`。如果密封类的子类定义在同一个文件中，则在密封类声明中可以省略 `permits` 子句。最后，密封接口可以限制哪些类可以实现接口、哪些接口可以扩展接口，或者两者兼有。\n\
  \nRecord（记录类型）是声明一个不可变且封装的 POJO 的紧凑方式，编译器会为你添加大量的模板代码。记住，封装是防止外部调用者访问对象内部组件的实践。Record\
  \ 自动创建访问器方法、长构造函数以及 `equals()`、`hashCode()` 和 `toString()` 的有用实现。Record 可以包含重载构造函数和紧凑构造函数以支持数据验证和转换。Record\
  \ 不允许在声明之外存在实例变量，因为这将破坏不可变性，但它们允许方法、静态成员和嵌套类型。它们还可以用于模式匹配。\n\n然后我们转向了嵌套类型。为了简单起见，我们专注于嵌套类并涵盖了四种类型。内部类（inner\
  \ class）需要外部类的实例，而静态嵌套类不需要。局部类（local class）通常定义在方法或块中。局部类只能访问 `final` 或有效 final\
  \ 的局部变量。匿名类（anonymous classes）是局部类的特殊类型，没有名称。匿名类要求扩展一个类或实现一个接口。内部类、局部类和匿名类可以访问它们所在类的私有成员，前提是后者是在实例方法内部使用的。\n\
  \n我们通过讨论多态结束了章，多态是 Java 语言的核心，并展示了如何以各种形式访问对象。确保你理解何时需要对对象进行转换，并能够区分编译时和运行时转换的问题。\n\
  \n## 考试要点\n\n能够编写创建、扩展和实现接口的代码。接口是特殊的抽象类型，专注于抽象方法和常量变量。接口可以扩展任意数量的接口，并在此过程中继承它们的抽象方法。接口不能扩展类，类也不能扩展接口。类可以实现任意数量的接口。\n\
  \n\n\n\n# 了解接口方法可以引用哪些接口方法。非静态私有、默认（default）和抽象接口方法与接口的实例相关。非静态私有和默认接口方法可以引用接口声明中的任何方法。相反，静态接口方法与类成员相关联，且只能引用其他静态成员。最后，私有方法只能在接口声明内部被引用。\n\
  \n# 能够创建和使用枚举（enum）类型。枚举是一种定义值列表的数据结构。如果枚举不包含任何其他元素，值后面的分号（`;`）是可选的。枚举可以用于 `switch`\
  \ 语句，并可以包含实例变量、构造函数和方法。枚举构造函数是隐式私有 true。枚举可以包含方法，既可以作为成员存在，也可以在单个枚举值内部。如果枚举声明了抽象方法，则每个枚举值必须实现该方法。\n\
  \n# 能够识别密封类（sealed classes）是否被正确使用。密封类定义了一个允许扩展其自身的受许可子类列表。在处理密封类时，能够使用正确的修饰符（`final`、`sealed`\
  \ 或 `non-sealed`）。理解何时可以省略 `permits` 子句。\n\n# 识别封装良好的类。封装类中的实例变量是私有的。所有获取值或更新值的代码都使用方法。封装类可以包含访问器方法（getter）或变异器方法（setter），尽管这并不是强制要求的。\n\
  \n# 理解记录类型（records）并知道编译器自动添加了哪些成员。记录是封装且不可变的类型，编译器会在其中插入一个长参数构造函数、访问器方法以及 `equals()`、`hashCode()`\
  \ 和 `toString()` 的实用实现。这些元素中的每一个都可以被重写。能够识别紧凑构造函数（compact constructors），并知道它们仅用于构造函数参数的验证和转换，而不是用于访问字段。识别出当记录带有实例成员声明时，它将无法编译。能够结合模式匹配使用记录。\n\
  \n# 能够声明和使用嵌套类。嵌套类型有四种：内部类、静态类、局部类和匿名类。实例化内部类需要外部类的实例。另一方面，静态嵌套类可以在没有外部类引用的情况下创建。局部类和匿名类不能带有访问修饰符进行声明。匿名类仅限于继承一个类或实现一个接口。\n\
  \n# 理解多态。对象可以呈现多种形式，这被称为多态。对象被视为以一种具体的形式存在内存中，但可以通过引用变量以多种形式访问。更改对象的引用类型可能会获得对新成员的访问，但这些成员始终存在于内存中。\n\
