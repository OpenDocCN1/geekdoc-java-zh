  \n如果你想不出你自己的泛型类的用途，请不要担心。除非你正在为他人编写可供其复用的库，泛型几乎不会出现在你编写的类定义中。你已经在你调用的代码中频繁看到它们了，例如函数式接口和集合。\n\
  \n泛型类在用作类型参数的类之间可以完全没有任何关系时变得有用……（此处后续内容因原文严重重复，已按要求处理）\n\n\n\n\n\n```java\npublic\
  \ class Anteater extends LongTailAnimal {\n\n    protected void chew(List<Object>\
  \ input) {}\n\n    protected void chew(ArrayList<Double> input) {}\n}\n```\n\n第一个\
  \ `chew()` 方法可以通过编译，因为它在重写方法中使用的泛型类型与父类中定义的类型相同。第二个 `chew()` 方法也能通过编译。然而，它是一个重载方法，因为其中一个方法的参数是\
  \ `List` 而另一个是 `ArrayList`。在处理泛型方法时，考虑底层类型是非常重要的。\n\n## 返回泛型类型\n\n当你处理返回泛型的重写方法时，返回值必须是**协变的**。从泛型的角度来说，这意味着重写方法中声明的类或接口的返回类型必须是父类定义类的子类型。泛型参数类型必须与其父类的类型完全匹配。\n\
  \n给定以下 `Mammal` 类的声明，两个子类 `Monkey` 和 `Goat` 哪个可以编译？\n\n```java\npublic class Mammal\
  \ {\n    public List<CharSequence> play() { … }\n    public CharSequence sleep()\
  \ { … }\n}\n\npublic class Monkey extends Mammal {\n    public ArrayList<CharSequence>\
  \ play() { … }\n}\n\npublic class Goat extends Mammal {\n    public List<String>\
  \ play() { … }  // 无法编译\n    public String sleep() { … }\n}\n```\n\n`Monkey` 类可以通过编译，因为\
  \ `ArrayList` 是 `List` 的子类型。然而，`Goat` 类中的 `play()` 方法无法编译。为了使返回类型协变，泛型类型参数必须匹配。尽管\
  \ `String` 是 `CharSequence` 的子类型，但它与 `Mammal` 类中定义的泛型类型并不匹配。因此，这被视为无效的重写。\n\n注意\
  \ `Goat` 类中的 `sleep()` 方法可以编译，因为 `String` 是 `CharSequence` 的子类型。这个例子说明协变适用于返回类型，但不适用于泛型参数类型。\n\
  \n对于考试来说，对涉及泛型的题目应用**类型擦除**可能会有所帮助，以确保它们能够正确编译。一旦确定了哪些方法是被重写的，哪些是被重载的，就可以反向推，确保重写方法的泛型类型匹配。记住，泛型方法不能仅通过更改泛型参数类型来重载。\n\
  \n## 实现泛型接口\n\n与类一样，接口也可以声明形式的类型参数。例如，以下 `Shippable` 接口使用泛型类型作为其 `ship()` 方法的参数：\n\
  \n```java\npublic interface Shippable<T> {\n    void ship(T t);\n}\n```\n\n类有三种方式可以实现此接口。第一种是在类中指定泛型类型。下面的具体类表示它只处理机器人。这允许它声明一个带有\
  \ `Robot` 参数的 `ship()` 方法。\n\n```java\nclass ShippableRobotCrate implements Shippable<Robot>\
  \ {\n    public void ship(Robot t) { }\n}\n```\n\n下一种方法是创建一个泛型类。以下具体类允许调用者指定泛型的类型：\n\
  \n```java\nclass ShippableAbstractCrate<U> implements Shippable<U> {\n    public\
  \ void ship(U t) { }\n}\n```\n\n在这个例子，类型参数可以命名为任何名称。最后一种方法是在方法中指定泛型类型。这是旧的方法。\n\n\
  ```java\nclass Shippable implements Shippable {\n    public void ship(Object t)\
  \ {\n}\n```\n\n\n\n\n显然，“T 代表 tricky（复杂的）。”让我们看看发生了什么。在第 1 行，`T` 是 `Robot`，因为在构建\
  \ `Crate` 时引用的就是它。在第 2 行，`T` 是 `String`，因为这是传递给方法的内容。当你看到这样的代码时，深吸一口气并写下发生的过程，这样你就不会感到惑。\n\
  \n### 创建泛型记录\n\n泛型也可以用于记录（records）。此记录取了一个单一泛型类型参数：\n\n```java\npublic record CrateRecord<T>(T\
  \ contents) {\n    @Override\n    public T contents() {\n        if (contents ==\
  \ null)\n            throw new IllegalStateException(\"missing contents\");\n  \
  \      return contents;\n    }\n}\n```\n\n它的工作方式与类相同。你可以创建一个机器人的记录！\n\n```java\n\
  Robot robot = new Robot();\nCrateRecord<Robot> record = new CrateRecord<>(robot);\n\
  ```\n\n这非常方便。现在我们有了一个不可变的泛型记录！\n\n### 边界泛型类型\n\n到目前，你可能已经注意到泛型似乎并没有特别有用，因为它们被处理为\
  \ `Objects`，因此没有许多可用方法。边界通配符（Bounded wildcards）通过限制泛型中可以使用的类型来解决这个问题。边界参数类型是一个为泛型指定了边界的泛型类型。请注意，这是本章中最难的部分，如果你必须读一遍，不要感到难过。\n\
  \n通配符泛型类型是用问号（`?`）表示的未知泛型类型。你可以通过三种方式使用泛型通配符，如表 9.15 边界类型\n\n| 边界类型 | 语法 | 示例 |\n\
  | --- | --- | --- |\n| 无界通配符 | `?` | `List<?> a = new ArrayList<String>();` |\n\
  | 带上界的通配符 | `? extends type` | `List<? extends Exception> a = new ArrayList<RuntimeException>();`\
  \ |\n| 带下界的通配符 | `? super type` | `List<? super Exception> a = new ArrayList<Object>();`\
  \ |\n\n#### 创建无界通配符\n\n无界通配符代表任何数据类型。当你想要指定任何类型对你来说都可以时，使用 `?`。假设我们想写一个方法来遍历任意类型的列表。\n\
  \n```java\npublic static void printList(List<Object> list) {\n    for (Object x:\
  \ list)\n        System.out.println(x);\n}\n\npublic static void main(String[] args)\
  \ {\n    List<String> keywords = new ArrayList<>();\n    keywords.add(\"java\");\n\
  \    printList(keywords); // 编译通过\n}\n```\n\n等等。怎么了？`String` 是 `Object` 的子类。这是 true。然而，`List<String>`\
  \ 不能赋值给 `List<Object>`。我们知道，这听起来不符合逻辑。Java 试图借此保护我们不受自己的伤害。想象我们可以写这样的代码：\n\n```java\n\
  4: List<Integer> numbers = new ArrayList<>();\n5: numbers.add(Integer.valueOf(42));\n\
  6: List<Object> objects = numbers; // 编译失败\n7: objects.add(\"forty two\");\n8: System.out.println(numbers.get(1));\n\
  ```\n\n在第 4 行，编译器向我们保证 `numbers` 中只会出现 `Integer` 对象。如果第 6 行编译通过，第 7 行就会通过在里面放入一个\
  \ `String` 来破坏那项承诺，因为 `numbers` 和 `objects` 是指向同一个对象的引用。幸好编译器阻止了这一点。\n\n回到打印列表，我们不能将\
  \ `List<String>` 赋值给 `List<Object>`。没关系；我们不需要 `List<Object>`。我们真正需要的是“任意类型”的 `List`。这就是\
  \ `List<?>` 的作用。以下代码执行了我们预期的操作：\n\n```java\npublic static void printList(List<?>\
  \ list) {\n    for (Object x: list)\n        System.out.println(x);\n}\n\npublic\
  \ static void main(String[] args) {\n    List<String> keywords = new ArrayList<>();\n\
  \    keywords.add(\"java\");\n    printList(keywords);\n}\n```\n\n`printList()`\
  \ 方法接受任何类型的列表作为参数。`keywords` 变量类型为 `List<String>`。我们匹配上了！`List<String>` 是一个任意类型的列表。在这里，“任意类型”恰好是\
  \ `String`。\n\n最后，让我们看看 `var` 的影响。你认为这两个语句是等价的吗？\n\n```java\nList<?> x1 = new ArrayList<>();\n\
  var x2 = new ArrayList<>();\n```\n\n它们并不是。有两个区别。首先，`x1` 的类型是 `List`，而 `x2` 的类型是\
  \ `ArrayList`。此外，我们只能将 `x2` 赋值给 `List<Object>`。这两个变量有一个共同点：在调用 `get()` 方法时，都返回 `Object`\
  \ 类型。\n\n#### 创建上界通配符\n\n让我们尝试写一个方法来累加数字列表的总和。我们已经确定泛型类型不能直接使用子类。\n\n```java\nList<Number>\
  \ list = new ArrayList<>(); // 编译失败\n```\n\n相反，我们需要使用：\n\n```java\npublic static\
  \ long total(List<? extends Number> list) {\n    long sum = 0;\n    for (Number\
  \ n : list) {\n        sum += n.intValue();\n    }\n    return sum;\n}\n```\n\n\n\
  \n\n| `static void addSound(list) { list.add(\"quack\"); }` | 方法编译通过 | 可以传递一个 `List<String>`\
  \ | 可以传递一个 `List<Object>` |\n| --- | --- | --- | --- |\n| `List<?>` | 否 | 是 | 是\
  \ |\n| `List<? extends Object>` | 否 | 是 | 是 |\n| `List<Object>` | 是 | 否（由于泛型，必须精确匹配）\
  \ | 是 |\n| `List<? super String>` | 是 | 是 | 是 |\n\n为了解决这个问题，我们需要使用下界（lower bound）。\n\
  \n```java\npublic static void addSound(List<? super String> list) {\n    list.add(\"\
  quack\");\n}\n```\n\n通过使用下界，我们正在告诉 `Java` 该列表将是一个 `String` 对象的列表，或者是某些 `String`\
  \ 超类的对象的列表。无论哪种情况，向该列表添加 `String` 都是安全的。\n\n就像泛型类一样，你可能不会在代码中使用它，除非你正在编写供他人复用的代码。即使如此，这种情况也很罕见。但它出现在考试中，所以现在是学习它的时候！\n\
  \n### 理解泛型超类型\n\n当你拥有子类和父类时，下界会变得复杂。\n\n```java\n3: List<? super IOException> exceptions\
  \ = new ArrayList<Exception>();\n4: exceptions.add(new Exception()); // 无法编译\n5:\
  \ exceptions.add(new IOException());\n6: exceptions.add(new FileNotFoundException());\n\
  ```\n\n第 `3` 行引用了一个 `List`，它可能是 `List<IOException>`、`List<Exception>` 或 `List<Object>`。第\
  \ `4` 行无法编译，因为我们可能拥有 `List<IOException>`，而 `Exception` 对象无法放入其中。\n\n第 `5` 行是正确的。`IOException`\
  \ 可以被添加到上述任何一种类型中。第 `6` 行也是正确的。`FileNotFoundException` 也可以添加到这三种类型中的任何一种。这很微妙，因为\
  \ `FileNotFoundException` 是 `IOException` 的子类，而关键字是 `super`。`Java` 说：“好吧，`FileNotFoundException`\
  \ 碰好也是 `IOException`，所以一切都是好的。”\n\n### 整合一切\n\n到此，你已经掌握了应付泛型考试题所需的所有知识。你可以将这些概念结合起来写出一些非常晦懂的代码，而考试恰好喜欢这样做。\n\
  \n这一部分将很难阅读。它包含了你可能被问到的关于泛中最难的问题。考试题可能会比这些更容易读。我们希望你在这里遇到真正棘手的题型，以便你为考试做好准备。换句话说，不要恐慌。慢慢来，重读几次代码。你会理解的。\n\
  \n#### 组合泛型声明\n\n让我们尝试一个例子。首先，我们声明示例中将使用的三个类：\n\n```java\nclass A {}\nclass B extends\
  \ A {}\nclass C extends B {}\n```\n\n准备好了吗？你能看出为什么这些代码编译或不编译吗？另外，尝试找出它们的作用。\n\n\
  ```java\n6: List<?> list1 = new ArrayList<A>();\n7: List<? extends A> list2 = new\
  \ ArrayList<A>();\n8: List<? super A> list3 = new ArrayList<A>();\n```\n\n第 `6`\
  \ 行创建了一个可以持有类 `A` 实例的 `ArrayList`。它存储在一个带有无界通配符的变量中。任何泛型类型都可以从无界通配符引用，因此这是没问题的。\n\
  \n第 `7` 行尝试在一个带有上界通配符的变量声明中存储一个列表。这是可以的。你可以在该引用中存储 `ArrayList<A>`、`ArrayList<B>`\
  \ 或 `ArrayList<C>`。第 `8` 行也是可以的。这次，你有一个下界通配符。你可以引用的最低类型是 `A`。由于你拥有的正是这种类型，所以它通过编译。\n\
  \n你做对了吗？我们再试几个。\n\n```java\n9:  List<? extends B> list4 = new ArrayList<A>(); //\
  \ 无法编译\n10: List<? super B> list5 = new ArrayList<A>();\n11: List<?> list6 = new\
  \ ArrayList<? extends A>(); // 无法编译\n```\n\n第 `9` 行有一个上界通配符，允许引用 `ArrayList<B>`\
  \ 或 `ArrayList<C>`。由于你尝试引用的是 `ArrayList<A>`，代码无法编译。第 `10` 行有一个下界通配符，允许引用 `ArrayList<A>`、`ArrayList<A>`（注：此处原文可能有重复）或\
  \ `ArrayList<Object>`。\n\n最后，第 `11` 行允许引用任何泛型类型，因为它是一个无界通配符。问题在于，你在实例化 `ArrayList`\
  \ 时需要知道那个类型是什么。实际上它也没用，因为你无法向该 `ArrayList` 中添加任何元素。\n\n#### 传递泛型参数\n\n现在来看方法。同样的问题：尝试弄清楚它们为什么不编译或它们的作用。我们将一次介绍一个方法，因为有更多需要考虑的内容。\n\
  \n```java\n<T> T first(List<? extends T> list) {\n    return list.get(0);\n}\n```\n\
  \n第一个方法 `first()` 是泛型非常标准的用法。它使用了一个方法特定的类型参数 `T`。它接收一个 `List<T>` 或 `T` 的某些子类作为参数，并返回一个\
  \ `T` 类型的单个对象。例如，你可以传递一个 `List<String>` 参数调用它，让它返回一个 `String`。或者你可以传递一个 `List<Number>`\
  \ 参数调用它，让它返回一个 `Number`。或者——好吧，你明白意思。\n\n既然如此，你应该能看出这一个错在哪里：\n\n```java\n<T> T second(List<?\
  \ extends T> list) { // 假设上下文\n    return list.get(0);\n}\n```\n第二个方法 `second()`\
  \ 无法编译，因为返回类型 `T` 是未知的。\n\n\n\n\n`Comparable` 接口声明了 `compareTo()` 方法。如果对象小于其参数，该方法返回一个负数；如果两个对象相等，返回\
  \ 0；否则返回一个正数。`compareTo()` 方法声明在被比较的对象上，并接受一个参数。\n\n`Comparator` 接口定义了 `compare()`\
  \ 方法。如果第一个参数较小，则返回负数；如果它们相等，返回 0；否则返回一个正数。`compare()` 方法可以在任何代码中声明，并接受两个参数。`Comparator`\
  \ 通常使用 lambda 表达式来实现。\n\n泛型是用于代码的类型参数。要创建一个带有泛型参数的类，在类名后添加 `<T>`。你可以为类型参数使用任何你喜欢的名称。单个大写字母是常见的选择。泛型允许你指定通配符。`<?>`\
  \ 是一个无界通配符，表示任何类型。`<? extends Object>` 是一个上界边界，表示任何是 `Object` 或其子类的类型。`<? extends\
  \ MyInterface>` 表示任何实现了 `MyInterface` 的类型。`<? super Number>` 是一个下界边界，表示任何是 `Number`\
  \ 或其父类的类型。如果代码尝试向带有无界或上界通配符的列表添加项，则会导致编译错误。\n\n## 考试要点\n\n- **根据描述选择正确的集合类型。** `List`\
  \ 允许重复并对元素进行排序。`Set` 不允许重复。`Deque` 对其元素进行排序，以便从前端或尾部取回。`Map` 将键映射到值。熟悉这些接口实现方式之间的差异。\n\
  - **使用便利方法。** `Collections` 框架包含了许多方法，例如 `contains()`、`forEach()` 和 `removeIf()`，这些都是你在考试中需要的。由于方法太多，无法在此段落中全部列出进行复习，请复习本章的表格。\n\
  - **理解如何使用顺序化集合。** 除了 `HashSet` 和 `HashMap` 之外，大多数集合类现在都实现了顺序化集合接口（`SequencedCollection`、`SequencedMap`\
  \ 或 `SequencedSet`）。这包括支持以可预测的遇到顺序对集合进行遍历的方法。这些方法使得使用一致的接口处理相关类型变得更加简单。\n- **区分\
  \ Comparable 和 Comparator。** 实现 `Comparable` 的类被认为具有自然排序方式，并实现了 `compareTo()` 方法。一个类只允许有一种自然排序。`Comparator`\
  \ 在 `compare()` 方法中接受两个对象。不同的比较器会有不同的排序。`Comparator` 通常使用 lambda 表达式实现，例如 `(a, b)\
  \ -> a.num - b.num`。\n- **识别泛型和通配符的有效和无效用法。** `<T>` 表示类型参数。可以使用任何名称，但单个大写字母是惯例。`<?>`\
  \ 是无界通配符。`<? extends X>` 是上界通配符。`<? super X>` 是下界通配符。\n\n## 复习题\n\n章节习题的答案可以在附录中找到。\n\
