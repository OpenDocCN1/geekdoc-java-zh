  \ 行可以编译而第 18 行无法编译所示。\n\n### 编写局部类\n\n局部类是定义在方法内部的嵌套类。和局部变量一样，局部类的声明在方法被调用之前是不存在的，并且在方法返回时超出作用域。这意味着你只能在方法内部创建实例。这些实例仍然可以从方法返回。这正是局部变量的工作方式。\n\
