  6. 代码因为第 `o2` 行无法编译。\n\n\n\n\n本章重点介绍如何使用 I/O（输入/输出）和 NIO.2（非阻塞 I/O）API 与文件以及 I/O\
  \ 流进行交互。在较新的软件应用程序中，处理文件和目录的首选方法尽可能使用 NIO.2 而非 I/O。然而，你会发现两者之间存在联系，并且都在被广泛使用。\n\n\
  我们首先描述文件和目录在文件系统中是如何组织的，并展示如何使用 `File` 类和 `Path` 接口来访问它们。然后，我们将展示如何操作文件和目录。最后，我们将通过高级主题结束本章，例如数据序列化、使用\
  \ `Console` 类在运行时读取用户输入以及与文件属性交互。\n\n![](img/image_rsrc10B8.jpg)\n\nNIO 代表非阻塞输入/输出\
  \ API，有时被称为新 I/O。考试涵盖了 NIO 版本 2。曾经有一个版本 1，其中涵盖了通道（channels），但它不在考试范围之内。\n\n## 引用文件和目录\n\
  \n本章从回顾文件系统中的文件和目录开始。我们还介绍了 `File` 类和 `Path` 接口，以及如何创建它们。\n\n### 文件系统的概念化\n\n我们从基础开始。数据存储在持久性存储设备上，如硬盘驱动器和内存卡。存储设备中的文件持有数据。文件通过目录组织成层级结构。目录是一个可以包含文件或其他目录的位置。\n\
  \n在 Java 中处理目录时，我们通常将它们像文件一样对待。事实上，我们使用了许多相同的类和接口来操作文件和目录。例如，文件和目录都可以使用相同的 Java\
  \ 方法进行重命名。在本章中，我们经常用“文件”来指代文件或目录。\n\n为了与文件交互，我们需要连接到文件系统。文件系统负责计算机内部的数据读取和写入。不同的操作系统使用不同的文件系统来管理其数据。例如，基于\
  \ Windows 的系统使用的文件系统与基于 Unix 的系统不同。对于考试来说，你只需要知道如何使用 Java API 发出命令即可。JVM 会自动连接到本地文件系统，从而允许你在多个平台上执行相同的操作。\n\
  \n接下来，根目录是文件系统中最顶层的目录，所有文件和目录都继承于它。在 Windows 中，它用驱动器器号表示，如 `C:\\`；而在 Linux 上，它用单个正斜杠\
  \ `/` 表示。\n\n路径是文件系统内文件或目录的表示。每个文件系统都定义了自己的路径分隔符字符，用于目录项之间。分隔符左侧的值是分隔符右侧值的父级。例如，路径值\
  \ `/user/home/zoo.txt` 意味着文件 `zoo.txt` 在 `home` 目录下，而 `home` 目录在 `user` 目录下。\n\n\
  ### 操作系统文件分隔符\n\n不同操作系统的路径格式各异。例如，基于 Unix 的系统使用正斜杠 `/` 作为路径，而基于 Windows 的系统使用反斜杠\
  \ `\\` 字符。尽管如此，许多编程语言和文件系统在编写路径语句时都支持这两种斜杠。Java 提供了一个系统属性来获取当前环境的本地分隔符：\n\n```java\n\
  System.out.print(System.getProperty(\"file.separator\"));\n```\n\n我们在图 14.1 中展示了目录和文件系统是如何按层级组织的。\n\
  \n![目录和文件的层级图。它包含根目录 C:，包含两个目录 app 和 zoo，以及文件 info.txt。在 app 目录下，还有两个文件夹 animals\
  \ 和 employees，以及文件 java.exe。最后，animals 目录包含两个文件 Bear.java 和 Bear.class。](img/image_rsrc10EB.jpg)\n\
  \n图 14.1 目录和文件层次结构\n\n此图显示根目录 `C:\\` 包含两个目录 `app` 和 `zoo` 以及文件 `info.txt`。在 `app`\
  \ 目录下，还有两个文件夹 `animals` 和 `employees`以及文件 `java.exe`。最后，`animals` 目录包含两个文件 `Bear.java`\
  \ 和 `Bear.class`。\n\n我们使用绝对路径和相对路径访问文件系统的文件或目录。文件或目录的绝对路径是从根目录到该文件或目录的完整路径，包含其中的所有子目录。或者，文件或目录的相对路径是从当前工作目录到该文件或目录的路径。例如，以下是\
  \ `Bear.java` 文件的绝对路径：\n\n```\nC:\\app\\animals\\Bear.java\n```\n\n以下是同一文件的相对路径，假设用户的当前目录被设置为\
  \ `C:\\app`：\n\n```\nanimals\\Bear.java\n```\n\n确定路径是相对的还是绝对的取决于文件系统。为了匹配考试，我们采用以下约定：\n\
  \n- 如果路径以正斜杠 (`/`) 开头，它是绝对路径，`/` 为根目录，例如 `/bird/parrot.png`。\n- 如果路径以驱动器号（`C:`）开头，它是绝对路径，驱动器号为根目录，例如\
  \ `C:/bird/info`。\n- 否则，它是相对路径，例如 `bird/parrot.png`。\n\n绝对和相对路径可以包含路径符号。路径符号是某些文件系统中具有特殊含义的保留字符之一。对于考试，你需要了解两个符号，如表\
  \ 14.1](#cP9B.xhtml_a105）所示。\n\n表 14.1 文件系统符号\n\n| 符号 | 描述 |\n| --- | --- |\n| `.`\
  \ | 当前目录引用 |\n| `..` | 当前目录的父目录 |\n\n查看图 14.2，假设当前目录是 `/fish/shark/hammerhead`。在这种情况下，`../swim.txt`\
  \ 等同于 `/fish/shark/swim.txt`。同样，`./play.png` 指向当前目录下的 `play.png`。这些符号也可以组合使用。例如，`../../clownfish`\
  \ 是文件系统中 `/fish/clownfish` 的相对路径。\n\n![相对路径的符号层级图。目录元素为 fish、shark、hammerhead 和\
  \ clownfish。相应的相对路径为 swim.txt 和 play.png。(OEBPS/image_rsrc10EC.jpg)\n\n有时你会看到冗余或不必要的路径符号。例如，绝对路径\
  \ `/fish/clownfish/../shark/./swim.txt` 可以简化为 `/fish/shark/swim.txt`。我们在本章后面介绍 `normalize()`\
  \ 时将处理这些冗余。\n\n符号链接是文件系统中的特殊文件，作为另一个文件或目录的引用或指针。假设我们有一个从 `/zoo/user/favorite` 到\
  \ `/fish/shark` 的符号链接。可以直接访问 shark 文件夹及其元素，也可以通过符号链接访问。例如，以下路径引用同一个文件：\n\n```\n\
  /fish/shark/swim.txt\n/zoo/user/favorite/swim.txt\n```\n\n通常情况下，符号链接对用户是透明的，因为操作系统负责解析引用到实际文件。虽然\
  \ I/O API 不支持符号链接， NIO.2 包含了对文件系统内符号链接的创建、检测和导航的全支持。\n\n### 创建文件或路径\n\n为了执行任何有用操作，首先需要一个表示文件系统中特定文件或目录路径的对象。使用旧\
  \ I/O 时是 `java.io.File` 类，而在 NIO.2 中，它是 `java.nio.file.Path` 接口。`File` 类和 `Path`\
  \ 接口无法读取或写入文件内部的数据，尽管它们被引用传递给其他类，正如你在本章中所看到的。\n\n\n\n\n记住，`File` 或 `Path` 可以代表一个文件或目录。\n\
  \n## 创建文件\n\n通过调用其构造函数来创建 `File` 类。这段代码展示了三种不同的构造函数：\n\n```\nFile zooFile1 = new\
  \ File(\"/home/tiger/data/stripes.txt\");\nFile zooFile2 = new File(\"/home/tiger\"\
  , \"data/stripes.txt\");\nFile parent = new File(\"/home/tiger\");\nFile zooFile3\
  \ = new File(parent, \"data/stripes.txt\");\n\nSystem.out.println(zooFile1.exists());\n\
  ```\n\n这三者都会创建一个指向磁盘上相同位置的 `File` 对象。如果我们将 `null` 作为父目录传递给最后一个构造函数，它将被忽略，且该方法的行为将与单个\
  \ `String` 构造函数相同。为了趣味性起见，我们还展示了如何判断文件是否存在于系统中。\n\n## 创建 Path\n\n由于 `Path` 是一个接口，我们无法直接创建实例。毕竟，接口没有构造函数！创建\
  \ `Path` 的常用方式如下：\n\n```java\npublic static Path of(String first, String… more)\n\
  ```\n\n以下两个示例引用了磁盘上的同一个文件：\n\n```\nPath zooPath1 = Path.of(\"/home/tiger/data/stripes.txt\"\
  );\nPath zooPath2 = Path.of(\"/home\", \"tiger\", \"data\", \"stripes.txt\");\n\n\
  System.out.println(Files.exists(zooPath1));\n```\n\n该方法允许通过传递变长参数传入额外的路径元素。这些值会被组合，并由依赖于操作系统的文件分隔符自动分隔。我们还展示了\
  \ `Files` 辅助类，它可以检查文件是否存在于系统中。稍后将介绍更多关于 `Files` 类的内容！\n\n### 创建 Path 的其他方法\n\n还有三种创建\
  \ `Path` 的方法可能会出现在考试中。一种创建 `Path` 的旧方法是使用 `Paths` 辅助类。\n\n```\nPath zooPath1 = Paths.get(\"\
  /home\", \"tiger\", \"data\", \"stripes.txt\");\n```\n\n该方法的签名与 `Path.of()` 方法完全相同，意味着它接受一个变长参数。根据\
  \ Javadoc 显示，`Paths` 类在未来可能会被弃用，因此你应该改用 `Path.of()`。\n\n在底层，`Path.of()` 实际上使用 `FileSystems`\
  \ 辅助类来创建 `Path`，这意味着可以直接调用它：\n\n```\nPath zooPath2 = FileSystems.getDefault().getPath(\"\
  /home/tiger/data/stripes.txt\");\n```\n\n最后，`Path` 也可以使用统一资源标识符 (`URI`) 创建。它以一个指示资源类型的架构开头，后跟一个路径值，例如本地文件系统的\
  \ `file://` 和远程文件系统的 `https://`。\n\n```\nPath zooPath3 = Path.of(URI.create(\"https://www.selikoff.net\"\
  ));\n```\n\n### 在 File 和 Path 之间切换\n\n由于 `File` 和 `Path` 都引用磁盘上的位置，能够在它们之间进行转换非常有帮助。幸运的是，Java\
  \ 提供了对应的方法来实现这一操作：\n\n```\nFile file = new File(\"rabbit\");\nPath newPath = file.toPath();\n\
  File backToFile = newPath.toFile();\n```\n\n许多旧库使用 `File`，因此能够从 `Path` 获取 `File`\
  \ 反反亦然会非常方便。在处理较新的应用程序时，你应该依赖 NIO.2 的 `Path` 接口，因为它包含了更多功能。\n\n## 对 File 和 Path\
  \ 进行操作\n\n现在我们知道如何创建 `File` 和 `Path` 对象，可以开始使用它们来完成实用的操作。在本节中，我们将探索涉及目录的功能。\n\n\
  ### 使用共享功能\n\n许多操作可以使用 I/O 和 NIO.2 库同时完成。我们在表 14.2 和 表 14.3 中展示了许多常用 API。虽然这些表格看起来需要学习很多方法，但其中许多是自显易见的。你可以暂时忽略变长参数，我们将在本章后面的部分解释它们。\n\
  \nTABLE 14.2 常见的文件和 Path 操作\n\n| 说明 | I/O File 实例方法 | NIO.2 Path 实例方法 |\n| --- |\
  \ --- | --- |\n| 获取文件/目录名称 | `getName()` | `getFileName()` |\n| 获取父目录，若不存在则返回 null\
  \ | `getParent()` | `getParent()` |\n| 检查文件/目录是否为绝对路径 | `isAbsolute()` | `isAbsolute()`\
  \ |\n| 获取文件/目录的绝对路径 | `getAbsolutePath()` | `toAbsolutePath()` |\n\nTABLE 14.3 常见的文件和\
  \ Files 操作\n\n| 说明 | I/O File 实例方法 | NIO.2 Files 静态方法 |\n| --- | --- | --- |\n|\
  \ 删除文件/目录 | `delete()` | `deleteIfExists(Path p)` throws IOException |\n| 检查文件/目录是否存在\
  \ | `exists()` | `exists(Path p, LinkOption… o)` |\n| 检查资源是否为目录 | `isDirectory()`\
  \ | `isDirectory(Path p, LinkOption… o)` |\n| 检查资源是否为文件 | `isFile()` | `isRegularFile(Path\
  \ p, LinkOption… o)` |\n| 返回文件最后修改的时间 | `lastModified()` | `getLastModified(Path\
  \ p, LinkOption… o)` |\n| 获取文件的字节数 | `length()` | `size(Path p)` |\n| 列出目录内容 | `listFiles()`\
  \ | `list(Path p)` |\n| 创建目录 | `mkdir()` | `createDirectory(Path p)` |\n| 创建不存在的目录\
  \ | `mkdirs()` | `createDirectories(Path p)` |\n| 重命名文件/目录 | `renameTo(File dest)`\
  \ | `move(Path src, Path dest, CopyOption… o)` |\n\n`java.io.File` 是一个类，而 `Files`\
  \ 是一个辅助类。它作用于 `Path` 实例，而不是 `File`。这可能会让人困惑，但它们是完全不同的。让我们尝试一下这些 API。给定一个文件，以下是使用\
  \ I/O 的示例代码：\n\n```java\nvoid io(File file) {\n    if (file.exists()) {\n      \
  \  System.out.println(\"Absolute Path: \" + file.getAbsolutePath());\n        System.out.println(\"\
  Is Directory: \" + file.isDirectory());\n        System.out.println(\"Parent Path:\
  \ \" + file.getParent());\n        if (file.isFile()) {\n            System.out.println(\"\
  Size: \" + file.length());\n        }\n        System.out.println(\"Last Modified:\
  \ \" + file.lastModified());\n    } else {\n        for (File subfile : file.listFiles())\
  \ {\n            System.out.println(subfile.getName());\n        }\n    }\n}\n```\n\
  \n如果路径指向一个有效文件，输出与第 16 行的 `if` 语句类似：\n\n```\nAbsolute Path: C:\\data\\zoo.txt\n\
  Is Directory: false\nParent Path: C:\\data\nSize: 12382\nLast Modified: 165061000000\n\
  ```\n\n最后，如果路径指向有效目录（例如 `C:\\data`），输出与 `else` 块类似：\n\n```\nAbsolute Path: C:\\\
  data\nIs Directory: true\nParent Path: C:\\\nemployees.txt\nzoo.txt\n```\n\n在这些示例中，你会看到基于\
  \ I/O 的输出完全取决于运行时底层系统的目录和文件。在考试中，你可能会看到看起来像文件其实是目录，反之亦然。例如，`/data/zoo.txt` 可能是文件也可能是目录，尽管它有扩展名。除非题目说明，否则不要假设它是其中一种。现在，让我们使用\
  \ NIO.2 编写相同的程序，看看有什么不同：\n\n```java\nvoid nio(Path path) throws IOException {\n\
  \    if (Files.exists(path)) {\n        System.out.println(\"Absolute Path: \" +\
  \ path.toAbsolutePath());\n        System.out.println(\"Is Directory: \" + Files.isDirectory(path));\n\
  \        System.out.println(\"Parent Path: \" + path.getParent());\n        if (Files.isRegularFile(path))\
  \ {\n            System.out.println(\"Size: \" + Files.size(path));\n        }\n\
  \    }\n}\n```\n\n\n\n\n```java\n33:             System.out.println(\"Last Modified:\
  \ \"\n34:                     + Files.getLastModifiedTime(path));\n35:     } else\
  \ {\n36:         try (Stream<Path> stream = Files.list(path)) {\n37:           \
  \  stream.forEach(p ->\n38:                 System.out.println(\"   \" + p.getFileName()));\n\
  39:         } } } } \n```\n\n此示例的大部分内容相当于之前表格中的 I/O 方法调用替换为 NIO.2 版本。但也存在关键差异。首先，第\
  \ 25 行声明了一个检查异常（checked exception）。NIO.2 中抛出 `IOException` 的 API 比 I/O API 多。在这种情况下，`Files.size()`、`Files.getLastModifiedTime()`\
  \ 和 `Files.list()` 抛出 `IOException`。\n\n其次，第 36–39 行使用 `Stream` 和 lambda 表达式而不是循环。由于流使用惰性求，这意味着方法会根据需要加载每个\
  \ `path` 元素，而不是一次性加载整个目录。\n\n### 关闭流\n\n你是否注意到在最后一个代码示例中，我们将 `Stream` 对象放在了 `try-with-resources`\
  \ 内部？NIO.2 基于流的方法会打开与文件系统的连接，必须妥善关闭；否则可能会导致资源泄漏。文件系统中的资源泄漏意味着在使用该路径的进程完成很久之后，`path`\
  \ 可能无法被修改。\n\n如果你认为流的终端操作（terminal operation）会自动关闭底层文件资源，那么你就错错了。这种行为在最初提出时引起过很多争论；简而言之，要求开发者关闭流的做法最终胜出了。\n\
  \n从好的方面，并不是所有流都需要关闭：只有那些打开了资源的，例如在 NIO.2 中找到那些。例如，你不需要关闭在第 10 章“流”中处理过的任何流。\n\n\
  最后，考试并不总是能正确关闭 NIO.2 资源。为了匹配考试，我们有时会在复习和练习题中跳过关闭 NIO.2 资源。在你自己的代码中，请务必对这些 NIO.2\
  \ 方法使用 `try-with-resources` 语句。\n\n在本节的剩余部分，我们只讨论 NIO.2 方法，因为它们更重要。关于它们的有更多需要了解的内容，而且更有可能出现在考试中。\n\
  \n### 处理声明了 IOException 的方法\n\n本章介绍的许多方法都声明了 `IOException`。方法抛出此异常的常见原因包括：\n\n*\
  \   与底层文件系统的通信丢失。\n*   文件或目录存在但无法访问或修改。\n*   文件存在但无法覆盖。\n*   需要文件或目录但不存在。\n\n访问或更改文件和目录的方法（例如\
  \ `Files` 类中的方法）通常会声明 `IOException`。正如我们所看到的，这条规则也有例外。例如，`Files.exists()` 方法没有声明\
  \ `IOException`。如果它在文件不存在时抛出异常，那么它将永远无法返回 false！根据经验之法则，如果一个 NIO.2 方法声明了 `IOException`，它通常要求其所操作的\
  \ `paths` 必须存在。\n\n### 提供 NIO.2 可选参数\n\n本章中的许多 NIO.2 方法都包含一个接收可选值列表的 `varargs`（可变参数）。表\
  \ 14.4 展示了考试中你应该熟悉的参数。\n\nTABLE 14.4 Common NIO.2 方法参数\n\n| 枚举类型 | 继承的接口 | 枚举值 |\
  \ 详情 |\n| --- | --- | --- | --- |\n| `LinkOption` | `CopyOption`, `OpenOption` |\
  \ `NOFOLLOW_LINKS` | 不跟随符号链接。 |\n| `StandardCopyOption` | `CopyOption` | `ATOMIC_MOVE`\
  \ | 作为原子文件系统操作移动文件。 |\n| `COPY_ATTRIBUTES` | | | 将现有属性复制到新文件。 |\n| `REPLACE_EXISTING`\
  \ | | | 如果文件已存在则覆盖文件。 |\n| `StandardOpenOption` | `OpenOption` | `APPEND` | 如果文件已打开写入，在末尾追加。\
  \ |\n| `CREATE` | | | 如果文件不存在则创建新文件。 |\n| `CREATE_NEW` | | | 仅在文件不存在时创建新文件；否则失败。\
  \ |\n| `READ` | | | 用于只读访问。 |\n| `TRUNCATE_EXISTING` | | | 如果文件已打开写入，擦除文件并从开始追加。\
  \ |\n| `WRITE` | | | 用于写入访问。 |\n| `FileVisitOption` | N/A | `FOLLOW_LINKS` | 跟随符号链接。\
  \ |\n\n除了 `Files.copy()` 和 `Files.move()` 之外，我们不会在每次介绍方法时讨论这些 `varargs` 参数。尽管如此，它们的行为应该是直观的。例如，你能猜出以下代码段中带有\
  \ `LinkOption` 的 `Files.exists()` 调用做了什么吗？\n\n```java\nPath path = Path.of(\"schedule.xml\"\
  );\nboolean exists = Files.exists(path, LinkOption.NOFOLLOW_LINKS);\n```\n\n`Files.exists()`\
  \ 仅检查链接是否存在。\n\n### 与 Path 交互\n\n与 `String` 值一样，`Path` 实例是不可变的。在下面的示例中，我们演示了链式：\n\
  \n```java\nPath p = Path.of(\"whale\");\np.resolve(\"krill\");\nSystem.out.println(p);\
  \ // whale\n```\n\n`Path` 中提供的许多方法都会转换路径并返回一个新的 `Path` 对象，允许方法链式调用。\n\n```java\n\
  Path.of(\"/zoo/../home\").getParent().toAbsolutePath();\n```\n\n#### 查看路径\n\n`Path`\
  \ 接口包含三个检索路径基本信息的方法。`toString()` 方法返回整个路径的 `String` 表示表示。事实上，它是 `Path` 接口中唯一返回 `String`\
  \ 的方法。`Path` 接口中的许多其他方法返回的是 `Path` 实例。\n\n`getNameCount()` 和 `getName()` 方法经常一起使用，分别获取路径中的元素数量和每个元素的引用。这两个方法不包含根节点作为路径的一部分。\n\
  \n```java\nPath path = Path.of(\"/land/hippo/harry.happy\");\nSystem.out.println(\"\
  The Path is: \" + path);\nfor(int i=0; i<path.getNameCount(); i++) {\n    System.out.println(\"\
  \   Element \" + i + \" is: \" + path.getName(i));\n}\n```\n\n注意，我们在第二行中没有显式调用 `toString()`。记住，在字符串拼接时，Java\
  \ 会对任何 `Object` 调用 `toString()`。我们在本章的示例中都使用了这个特性。\n\n代码输出以下内容：\n\nThe Path is:\
  \ /land/hippo/harry.happy\n   Element 0: land\n   Element 1: hippo\n   Element 2:\
  \ harry.happy\n\n尽管这是一个绝对路径，但根元素没有包含在名称列表中。正如我们所说的，这些方法不将根视为路径的一部分。\n\n```java\n\
  var p = Path.of(\"/\");\nSystem.out.print(p.getNameCount()); // 0\nSystem.out.print(p.getName(0));\
  \ // IllegalArgumentException\n```\n\n注意，如果你尝试用无效索引调用 `getName()`，它将在运行时抛出异常。\n\n\
  由于我们使用的系统，我们的示例打印 `/` 作为文件分隔符。你的实际输出在本章中可能会有所不同。\n\n#### 创建路径的一部分\n\n\n\n\n`Path`\
  \ 接口包含了 `subpath()` 方法，用于选择路径的片段。它接受两个参数：一个包含的 `beginIndex` 和一个不包含的 `endIndex`。这听起来很熟悉，因为它与\
  \ `String` 的 `substring()` 方法的工作原理相同，正如你在第 4 章“核心 API”中所看到的那。\n\n下面的代码片段展示了 `subpath()`\
  \ 如何工作。我们还使用 `getName()` 了 `Path` 的元素，以便你可以看到索引是如何使用的。\n\n```java\nvar p = Path.of(\"\
  /mammal/omnivore/raccoon.image\");\n\nSystem.out.println(\"Path is: \" + p);\n\n\
  for (int i = 0; i < p.getNameCount(); i++) {\n    System.out.println(\"    Element\
  \ \" + i + \" is: \" + p.getName(i));\n}\n\nSystem.out.println();\n\nSystem.out.println(\"\
  subpath(0,3): \" + p.subpath(0, 3));\nSystem.out.println(\"subpath(1,2): \" + p.subpath(1,\
  \ 2));\nSystem.out.println(\"subpath(1,3): \" + p.subpath(1, 3));\n```\n\n该代码片段的输出如下：\n\
  \n```\nPath is: /mammal/omnivore/raccoon.image\n    Element 0 is: mammal\n    Element\
  \ 1 is: omnivore\n    Element 2 is: raccoon.image\nsubpath(0,3): mammal/omnivore/raccoon.image\n\
  subpath(1,2): omnivore\nsubpath(1,3): omnivore/raccoon.image\n```\n\n与 `getNameCount()`\
  \ 和 `getName()` 类似，`subpath()` 是从零开始索引且不包含根目录。同样，类似于 `getName()`，如果提供了无效索引，`subpath()`\
  \ 会抛出异常。\n\n```java\nvar q = p.subpath(0, 4); // IllegalArgumentException\nvar x\
  \ = p.subpath(1, 1); // IllegalArgumentException\n```\n\n第一个示例在运行时抛出异常，因为允许的最大索引值为\
  \ 3。第二个示例抛出异常，是因为起始和结束索引相同，导致了空路径值。\n\n### 访问路径元素\n\n`Path` 接口包含许多方法来检索 `Path` 的特定元素，返回的结果本身为\
  \ `Path` 对象。`getFileName()` 方法返回当前文件或目录的 `Path` 元素，而 `getParent()` 返回包含目录的完整路径。如果对根路径或相对路径的顶部进行操作，`getParent()`\
  \ 将返回 `null`。`getRoot()` 方法返回文件系统中文件的根元素，如果路径是相对路径，则返回 `null`。\n\n考虑以下方法，它打印了各种\
  \ `Path` 元素：\n\n```java\npublic void printPathInformation(Path path) {\n    System.out.println(\"\
  Filename is: \" + path.getFileName());\n    System.out.println(\"    Root is: \"\
  \ + path.getRoot());\n    Path currentParent = path;\n    while((currentParent =\
  \ currentParent.getParent()) != null)\n        System.out.println(\"    Current\
  \ parent is: \" + currentParent);\n    System.out.println();\n}\n```\n\n`printPathInformation()`\
  \ 方法中的 `while` 循环一直持续到 `getParent()` 返回 `null` 为止。我们将此方法应用于以下三个路径：\n\n```java\n\
  printPathInformation(Path.of(\"zoo\"));\nprintPathInformation(Path.of(\"/zoo/armadillo/shells.txt\"\
  ));\nprintPathInformation(Path.of(\"./armadillo/../shells.txt\"));\n```\n\n此示例程序产生以下输出：\n\
  \n```\nFilename is: zoo\n    Root is: null\nFilename is: shells.txt\n    Root is:\
  \ /\n    Current parent is: /zoo/armadillo\n    Current parent is: /zoo\n    Current\
  \ parent is: /\nFilename is: shells.txt\n    Root is: null\n    Current parent is:\
  \ ./armadillo/..\n    Current parent is: ./armadillo\n    Current parent is: .\n\
  ```\n\n通过查看示例输出，你可以看到 `getRoot()` 在绝对路径和相对路径上的行为差异。正如你在第一个和最后一个示例所示，`getParent()`\
  \ 方法不会遍历当前工作目录之外的相对路径。\n\n你还会发现这些方法并不解析路径符号，并将它们视为路径的独立部分。虽然本章这部分的大多数方法将路径符号视为路径的一部分，但我们稍后会介绍一个清理路径符号的方法。\n\
  \n### 解析路径\n\n假设你想以类似于拼接字符串的方式来拼接路径。`resolve()` 方法提供了重载版本，允许你传递 `Path` 或 `String`\
  \ 参数。调用 `resolve()` 方法的对象将成为新 `Path` 对象的基础，而输入参数将被追加到 `Path` 之后。让我们看看如果对绝对路径和相对路径应用\
  \ `resolve()` 会发生什么：\n\n```java\nPath path1 = Path.of(\"/cats/../panther\");\nPath\
  \ path2 = Path.of(\"food\");\nSystem.out.println(path1.resolve(path2));\n```\n\n\
  该代码片段生成以下输出：\n\n```\n/cats/../panther/food\n```\n\n与我们见过的其他方法一样，`resolve()` 不清理路径符号。（注：此处原文处存在大量重复句子，翻译已按要求去重）。\n\
  \n\n\n前两个示例通过路径符号来移除冗余部分，但最后一个例子呢？它已经尽可能地精简了。`normalize()` 方法不会移除所有的路径符号，只移除那些可以被简化的符号。\n\
  \n`normalize()` 方法允许我们比较等效的路径。考虑以下示例：\n\n```java\nvar p1 = Path.of(\"/pony/../weather.txt\"\
  );\nvar p2 = Path.of(\"/weather.txt\");\n\nSystem.out.println(p1.equals(p2));  \
  \              // false\nSystem.out.println(p1.normalize().equals(p2.normalize()));\
  \ // true\n```\n\n如果两个路径代表相同的值，`equals()` 方法返回 `true`。在第一次比较中，路径值是不同的。在第二次比较中，两个路径的值都已归还原为相同的归一化值\
  \ `/weather.txt`。这就是 `normalize()` 方法的主要功能：允许我们更好地比较不同的路径。\n\n### 获取真实的文件系统路径\n\n\
  在处理理论路径时很有用，但有时你可能想使用 `toRealPath()` 来验证路径是否存在于文件系统中。该方法与 `normalize()` 类似，因为它消除了任何冗余的路径符号。它也与\
  \ `toAbsolutePath()` 类似，如果路径是相对的，它会将路径与当前工作目录合并。\n\n然而，与这两个方法不同，如果路径不存在，`toRealPath()`\
  \ 将抛出异常。此外，它会遵循符号链接，可以使用可选的 `LinkOption` 变长参数来忽略它们。\n\n假设我们有一个文件系统，其中从 `/zebra`\
  \ 到 `/horse` 的符号链接。在当前工作目录为 `/horse/schedule` 的情况下，你认为以下代码将打印什么？\n\n```java\nSystem.out.println(Path.of(\"\
  /zebra/food.txt\").toRealPath());\nSystem.out.println(Path.of(\".././food.txt\"\
  ).toRealPath());\n```\n\n这两行的输出如下：\n\n```\n/horse/food.txt\n```\n\n在例例中，绝对路径和相对路径都解析到同一个绝对文件，因为符号链接指向文件系统中的一个真实文件。我们还可以使用\
  \ `toRealPath()` 方法以 `Path` 对象的形式访问当前工作目录。\n\n```java\nSystem.out.println(Path.of(\"\
  .\").toRealPath());\n```\n\n### 复习 NIO.2 Path API\n\n在本节中，我们涵盖了许多 `Path` 的实例方法。表\
  \ 14.5 列出了这些方法以供复习。\n\n**表 14.5 Path API**\n\n| 说明 | Path 实例方法 |\n| --- | --- |\n\
  | 字符串形式的文件路径 | `String toString()` |\n| 单段 | `Path getName(int index)` |\n| 段数 |\
  \ `int getNameCount()` |\n| 范围内的段 | `Path subpath(int beginIndex, int endIndex)`\
  \ |\n| 最后一段/文件名 | `Path getFileName()` |\n| 直接父级 | `Path getParent()` |\n| 顶层段 |\
  \ `Path getRoot()` |\n| 合并路径 | `Path resolve(String p)`, `Path resolve(Path p)`\
  \ |\n| 构建相对路径 | `Path relativize(Path p)` |\n| 移除路径的冗余部分 | `Path normalize()` |\n\
  | 遵循符号链接查找文件系统上的路径 | `Path toRealPath()` |\n\n### 创建、移动和删除文件及目录\n\n由于创建、移动和删除有一些细微差别，我们在本节中详细介绍它们。\n\
  \n#### 创建目录\n\n要创建目录，我们使用这些 `Files` 方法：\n\n```java\npublic static Path createDirectory(Path\
  \ dir, FileAttribute<?>… attrs) throws IOException\npublic static Path createDirectories(Path\
  \ dir, FileAttribute<?>… attrs) throws IOException\n```\n\n`createDirectory()` 方法将创建一个目录，如果该目录已存在或指向目录的路径不存在，则会抛出异常。`createDirectories()`\
  \ 方法会创建目标目录以及该路径上任何不存在的父目录。如果所有目录都存在，`createDirectories()` 将直接完成而不执行任何操作。这在你想确保某个目录存在并在它不存在时创建它的情况下非常有用。\n\
  \n这两个方法还都接受一个可选的 `FileAttribute<?>` 值列表，并应用于新创建的目录或目录。我们将在章节末尾讨论文件属性。\n\n以下显示了如何创建目录：\n\
  \n```java\nFiles.createDirectory(Path.of(\"/bison/field\"));\nFiles.createDirectories(Path.of(\"\
  /bison/field/pasture/green\"));\n```\n\n第一个示例在 `/bison` 目录中创建一个新目录 `field`，假设 `/bison`\
  \ 存在；否则将抛出异常。与之对比的是第二个示例，它会创建 `green` 目录以及任何尚不存在的先置父目录，包括 `bison`、`field` 和 `pasture`。\n\
  \n#### 复制文件\n\n`Files` 类提供了一个在文件系统中复制文件和目录的方法。\n\n```java\npublic static Path copy(Path\
  \ source, Path target, CopyOption… options) throws IOException\n```\n\n该方法使用 `Path`\
  \ 对象从一个位置复制文件或目录到另一个位置。以下是复制文件和目录的示例：\n\n```java\nFiles.copy(Path.of(\"/panda/bamboo.txt\"\
  ), Path.of(\"/panda-save/bamboo.txt\"));\nFiles.copy(Path.of(\"/turtle\"), Path.of(\"\
  /turtleCopy\"));\n```\n\n复制目录时，是浅拷贝。浅拷贝意味着目录内的子目录不会被复制。深拷贝意味着整个树都会被复制。深拷贝需要递归，即方法调用其自身。\n\
  \n```java\npublic void copyPath(Path source, Path target) {\n    try {\n       \
  \ if (Files.isDirectory(source)) {\n            try (Stream<Path> s = Files.list(source))\
  \ {\n                s.forEach(p -> copyPath(p, target.resolve(p.getFileName())));\n\
  \            }\n        } else {\n            Files.copy(source, target);\n    \
  \    }\n    } catch (IOException e) {\n        // 处理异常\n    }\n}\n```\n\n#### 复制并替换文件\n\
  \n默认情况下，如果目标已存在，`copy()` 方法将抛出异常。你可以通过方法提供 `StandardCopyOption` 枚举值 `REPLACE_EXISTING`\
  \ 来更改此行为。以下方法调用如果 `movie.txt` 文件已存在，将覆盖它：\n\n```java\nFiles.copy(Path.of(\"book.txt\"\
  ), Path.of(\"movie.txt\"), StandardCopyOption.REPLACE_EXISTING);\n```\n\n对于考试，你需要知道如果没有\
  \ `REPLACE_EXISTING` 选项，当文件存在时此方法将抛出异常。\n\n#### 使用 I/O 流复制文件\n\n`Files` 类包含了两个与\
  \ I/O 流操作的 `copy()` 方法。\n\n```java\npublic static long copy(InputStream in, Path\
  \ target, CopyOption… options) throws IOException\npublic static long copy(Path\
  \ source, OutputStream out) throws IOException\n```\n\n第一个方法读取 I/O 流的内容并将其输出到文件。第二个方法读取文件的内容并将其输出到\
  \ I/O 流。如果你需要快速从磁盘读/写数据，这些方法非常方便。\n\n以下是每个 `copy()` 方法的示例：\n\n```java\ntry (var\
  \ is = new FileInputStream(\"source-data.txt\")) {\n    // 将 I/O 流数据写入文件\n    Files.copy(is,\
  \ Path.of(\"/mammals/wolf.txt\"));\n}\nFiles.copy(Path.of(\"/fish/clown.xsl\"),\
  \ System.out);\n```\n\n虽然我们在第一个示例使用了 `FileInputStream`，但 I/O 流可以是任何有效的 I/O 流，包括网络连接、内存流资源等。第二个示例将文件内容直接打印到\
  \ `System.out` 流中。\n\n#### 将文件复制到目录\n\n对于考试，理解 `copy()` 方法如何作用于文件和目录是非常重要的。例如，假设我们有一个文件\
  \ `food.txt` 和一个目录 `/enclosure`。该文件和目录都存在。你认为执行以下过程的结果是什么？\n\n```java\nvar file\
  \ = Path.of(\"food.txt\");\n```\n\n\n\n\n```java\nvar directory = Path.of(\"/enclosure\"\
  );\n\nFiles.copy(file, directory);\n```\n\n如果你认为它会在 `/enclosure/food.txt` 创建一个新文件，那就大错错了。它会抛出一个异常。该命令尝试创建一个名为\
  \ `/enclosure` 的新文件。由于路径 `/enclosure` 已经存在，在运行时会抛出异常。\n\n相反，如果该目录不存在，进程将创建一个包含 `food.txt`\
  \ 内容的新文件，但该文件将被命名为 `/enclosure`。记住，我们提到过文件可能不需要扩展名，而在本例中，这一点很重要。\n\n这种行为同时适用于 `copy()`\
  \ 和 `move()` 方法，后者将在下文中介绍。如果你好奇，将文件复制到目录的正确方法是执行如下：\n\n```java\nvar file = Path.of(\"\
  food.txt\");\n\nvar directory = Path.of(\"/enclosure/food.txt\");\n\nFiles.copy(file,\
  \ directory);\n```\n\n### 使用 `move()` 移动或重命名路径\n\n`Files` 类提供了一个用于移动或重命名文件和目录的实用方法。\n\
  \n```java\npublic static Path move(Path source, Path target,\n    CopyOption… options)\
  \ throws IOException\n```\n\n以下示例代码使用了 `move()` 方法：\n\n```java\nFiles.move(Path.of(\"\
  C:\\\\zoo\"), Path.of(\"C:\\\\zoo-new\"));\n\nFiles.move(Path.of(\"C:\\\\user\\\\\
  addresses.txt\"),\n    Path.of(\"C:\\\\zoo-new\\\\addresses2.txt\"));\n```\n\n第一个示例将\
  \ `zoo` 目录重命名为 `zoo-new` 目录，保留源目录的所有原始内容。第二个示例将 `addresses.txt` 文件从 `user` 目录移动到\
  \ `zoo-new` 目录并将其重命名为 `addresses2.txt`。\n\n#### `move()` 和 `copy()` 的相似之处\n\n与 `copy()`\
  \ 一样，`move()` 需要 `REPLACE_EXISTING` 来覆盖已存在的目标；否则它将抛出异常。同样与 `copy()` 类似，如果源是文件而目标是目录，`move()`\
  \ 不会将文件放入目录中。相反，它会创建一个与目录同名的新文件。\n\n#### 执行原子移动\n\n在处理 `move()` 方法时，考试中你还需要的另一个枚举值是\
  \ `StandardCopyOption` 的值 `ATOMIC_MOVE`。\n\n```java\nFiles.move(Path.of(\"mouse.txt\"\
  ), Path.of(\"gerbil.txt\"),\n    StandardCopyOption.ATOMIC_MOVE);\n```\n\n你可能记得第\
  \ 13 章 “并发”中的原子属性，原子移动的原理相似。原子移动是指文件在文件系统内部作为一个不可分割的操作完成的移动。换句话说，任何监控文件系统的进程都永远看不到不完整或部分写入的文件。如果文件系统不支持此功能，将抛出\
  \ `AtomicMoveNotSupportedException`。\n\n请注意，虽然 `ATOMIC_MOVE` 作为 `StandardCopyOption`\
  \ 类型的成员可用，但如果将其传递给 `copy()` 方法，它可能会抛出异常。\n\n#### 使用 `delete()` 和 `deleteIfExists()`\
  \ 删除文件\n\n`Files` 类包含了两个删除文件系统内文件或空目录的方法。\n\n```java\npublic static void delete(Path\
  \ path) throws IOException\n\npublic static boolean deleteIfExists(Path path) throws\
  \ IOException\n```\n\n要删除目录，它必须是空的。这两个方法在对非空目录进行操作时都会抛出异常。此外，如果路径是符号链接，删除的是符号链接本身，而不是链接指向的路径。\n\
  \n这两个方法在处理不存在的路径时有所不同。如果路径不存在，`delete()` 方法会抛出异常，而 `deleteIfExists()` 方法在删除成功时返回\
  \ `true`，否则返回 `false`。类似于 `createDirectories()`，`deleteIfExists()` 用于确保路径不存在并在存在时将其删除的情况。\n\
  \n这里提供了执行 `delete()` 操作的示例代码：\n\n```java\nFiles.delete(Path.of(\"/vulture/feathers.txt\"\
  ));\n\nFiles.deleteIfExists(Path.of(\"/pigeon\"));\n```\n\n第一个示例删除 `vulture` 目录下的\
  \ `feathers.txt` 文件，如果文件或目录不存在，它将抛出 `NoSuchFileException`。第二个示例删除 `pigeon` 目录（假设它是空的）。如果\
  \ `pigeon` 目录不存在，第二行将不会抛出异常。\n\n### 使用 `isSameFile()` 和 `mismatch()` 比较文件\n\n由于文件系统路径可能包含路径符号和符号链接，不能依靠\
  \ `equals()` 方法来判断两个 `Path` 实例是否引用同一个文件。幸运的是，有 `isSameFile()` 方法。该方法接受两个 `Path`\
  \ 对象作为输入，解析所有路径符号并遵循符号链接。尽管名称如此，该方法也可以用于判断两个 `Path` 对象是否引用同一个目录。\n\n虽然 `isSameFile()`\
  \ 的大多数用法在路径不存在时会触发异常，但有一种特殊情况不会。如果两个路径对象在 `equals()` 方面是等的，该方法将直接返回 `true`，而不检查文件是否存在。\n\
  \n假设文件系统存在，如图 14.3 所示，从 `/animals/snake` 到 `/animals/cobra` 有符号链接。\n\n![一个比较文件唯一性的层级图。动物是一个根目录，其元素有\
  \ cobra、monkey、wolf 和 snake。monkey 的相对路径是 tail.gif 和 ears.png，wolf 是 ears.png。一条虚线箭头从\
  \ snake 连接到 cobra，以表示唯一性。](img/image_rsrc10ED.jpg)\n\n图 14.3 比较文件的唯一性\n\n给定上述结构，以下输出是什么？\n\
  \n```java\nSystem.out.println(Files.isSameFile(Path.of(\"/animals/snake\"), Path.of(\"\
  /animals/cobra\")));\n\nSystem.out.println(Files.isSameFile(Path.of(\"/animals/monkey\"\
  ), Path.of(\"/animals/wolf\")));\n```\n\n由于 `snake` 是指向 `cobra` 的符号链接，第一个示例输出 `true`。在第二个示例中，路径引用不同的文件，因此打印\
  \ `false`。\n\n有时你想比较文件的内容而不是物理上是否相同。`mismatch()` 方法在 Java 12 中引入以帮助我们。它接受两个 `Path`\
  \ 对象作为输入。如果文件相同，则返回 `-1`；否则返回第一个不同位置的索引。\n\n```java\nSystem.out.println(Files.mismatch(Path.of(\"\
  /animals/monkey\"), Path.of(\"/animals/wolf\")));\n```\n\n假设 `monkey.txt` 包含 `Harold`\
  \ 而 `wolf.txt` 包含 `Howler`。在这种情况下，之前的代码打印 `1`，因为第二个位置不同，且我们从零开始索引。给定这些值，你认为这段代码会打印什么？\n\
  \n```java\nSystem.out.println(Files.mismatch(Path.of(\"/animals/wolf\"), Path.of(\"\
  /animals/monkey\")));\n```\n\n答案与上一个示例相同。代码再次打印 `1`。`mismatch()` 方法是对称的，无论参数顺序如何，结果都是相同的。\n\
  \n### 介绍 I/O 流\n\n现在我们已经解决了基础问题，让我们转向更有有趣的 I/O 流。在本节中，我们将向你展示如何使用 I/O 流读写数据。\n\n\
  ![](img/image_rsrc10B8.jpg)\n\n当我们在本章中提到 I/O 流时，指的是 `java.io` API 中的那些流。如果我们只说流，那么指的是[第\
  \ 10 章](#cF7E.xhtml）中的流。\n\n\n\n\n\n我们在图 14.4 中演示了这一原理。I/O 流如此巨大，以至于我们一旦开始读取它，就不知道它的开头或结尾在哪里。我们只有一个指向\
  \ I/O 流中当前位置的指针，并一次读取一个块的数据。\n\n![一张图片说明了输入和输出流的视觉化表示。I/O 流如此巨大，完全不知道开头或结尾在哪里。左箭头指向流的头部，右箭头指向流的尾部，矩形块表示读取字节，虚线块表示读取下一个块。](img/image_rsrc10EE.jpg)\n\
  \n图 14.4 I/O 流的视觉化表示\n\n每种类型的 I/O 流都以特定的方式将数据分段波或块。例如，某些 I/O 流类以单个字节的形式读取或写入数据。其他\
  \ I/O 流类则读取或写入单个字符或字符字符串。此外，某些 I/O 流类一次读取或写入更大的字节或字符组，特别是那些名称中带有 `Buffered` 单词的类。\n\
  \n![](img/image_rsrc10B8.jpg)\n\n尽管 `java.io` API 充满了处理字符、字符串、字节组等的 I/O 流，但几乎所有的流都是构建在一次读取或写入单个字节或字节数组之上的。存在高级\
  \ I/O 流既是为了方便，也是为了性能。\n\n虽然 I/O 流通常用于文件 I/O，但它们更通用地用于处理任何顺序数据源的读取/写入。例如，你可能会构建一个\
  \ Java 程序，使用输出流将数据提交到网站，并通过输入流读取结果。\n\n### I/O 流可能非常大\n\n在编写代码时，如果你不知道运行时 I/O 流的大小，那么将\
  \ I/O 流想象成非常大，以至于其中包含的所有数据都不可能放入内存中，这可能会有所帮助。例如（在写本书时），大多数计算机系统都无法在内存中完全存储一个 1 TB\
  \ 的文件。由于内存非常少，程序仍然可以读取和写入该文件，因为 I/O 流允许应用程序在任何时刻只关注整个 I/O 流中的一小部分。\n\n### 学习 I/O\
  \ 流术语\n\n`java.io` API 提供了许多类用于创建、访问和操作 I/O 流——类之多往往让许多新的 Java 开发者感到无从从。保持冷静！我们将回顾每个\
  \ I/O 流类之间的主要区别，并向你如何区分它们。\n\n即使你在考试中遇到不认识的特定 I/O 流，该 I/O 流的名称通常也能提供足够的信息，让你准确理解它是具体做什么的。\n\
  \n本节的目标是让你熟悉 I/O 流中常用的术语和命名规范。如果你不认识本节使用的特定流类名称或其功能，不要担心；我们将在本章详细介绍如何使用它们。\n\n####\
  \ 以字节存储数据\n\n数据在文件系统（以及内存）中以 0 或 1 存储，称为位（bit）。由于人类读取/写入只由 0 和 1 组成的数据非常困难，因此它们被分组成一组\
  \ 8 位，称为字节（byte）。\n\n那么 `byte` 原型类型呢？正如你稍后学到的，当我们使用 I/O 流时，值通常使用字节值和数组进行读取或写入。\n\
  \n#### 字节流与字符流\n\n`java.io` API 定义了两组用于读取和写入 I/O 流的类：字节 I/O 流和字符 I/O 流。在本章中，我们都会使用这两种类型的\
  \ I/O 流。\n\n* 字节 I/O 流读取/写入二进制数据（0 和 1），类名以 `InputStream` 或 `OutputStream` 结尾。\n\
  * 字符 I/O 流读取/写入文本数据，类名以 `Reader` 或 `Writer` 结尾。\n\nAPI 经常为字节和字符 I/O 流包含类似的类，例如 `FileInputStream`\
  \ 和 `FileReader`。这两个类之间的区别取决于字节是如何读取或写入的。\n\n重要的是，尽管字符 I/O 流的类名中不包含 `Stream` 单词，但它们仍然是\
  \ I/O 流。在名称中使用 `Reader/Writer` 是为了将它们与字节流区分开。\n\n![](img/image_rsrc10B8.jpg)\n\n\
  在整个章节中，我们将 `InputStream` 和 `Reader` 都称为输入流，并将 `OutputStream` 和 `Writer` 都称为输出流。\n\
  \n字节 I/O 流主要用于处理二进制数据，如图像或可执行文件，而字符 I/O 流则用于处理文本文件。例如，你可以使用 `Writer` 类将 `String`\
  \ 值输出到文件，而无需一定担心文件的底层字符编码。\n\n字符编码决定了字符如何在 I/O 流中被编码并存储为字节，并在随后被读回或解码为字符。尽管这听起来可能很简单，但\
  \ Java 支持多种字符编码，从可能使用一个字节表示拉丁字符的编码（例如 `UTF-8` 和 `ASCII`），到每个字符使用两个或多个字节的编码（例如 `UTF-16`）。对于考试，你不需要记忆字符编码，但你应该熟悉这些名称。\n\
  \n### Java 中的字符编码\n\n在 Java 中，可以使用 `Charset` 类通过向静态方法 `Charset.forName()` 传递值来指定字符编码，例如以下示例：\n\
  \n```\nCharset usAsciiCharset = Charset.forName(\"US-ASCII\");\nCharset utf8Charset\
  \ = Charset.forName(\"UTF-8\");\nCharset utf16Charset = Charset.forName(\"UTF-16\"\
  );\n```\n\n#### 输入流与输出流\n\n大多数 `InputStream` 类都有对应的 `OutputStream` 类，反之亦然。例如，`FileOutputStream`\
  \ 类写入的数据可以被 `FileInputStream` 读取。如果你理解特定的输入或输出流类的特征，你理自然应该知道它的互补类是做什么的。\n\n因此，大多数\
  \ `Reader` 类都有对应的 `Writer` 类。例如，`FileWriter` 类写入的数据可以被 `FileReader` 读取。\n\n这条规则有一些例外。对于考试，你应该知道\
  \ `PrintWriter` 没有相应的 `PrintReader` 类。同样，`PrintStream` 是一个没有对应 `InputStream` 类的\
  \ `OutputStream`。它的名称中也不包含 `Output` 单词。我们将在本章的稍后部分讨论这些类。\n\n#### 低级流与高级流\n\n让你熟悉\
  \ `java.io` API 的另一种方法是将 I/O 流分为低级流和高级流。\n\n低级流直接连接数据源，如文件、数组或 `String`。低级 I/O 流处理原始数据或资源，并以直接且未过滤的方式进行访问。例如，`FileInputStream`\
  \ 是一个一次一个字节读取文件数据的类。\n\n另一种，高级流是通过包装技术在另一个 I/O 流之上构建的。包装是将实例传递给另一个类的构造函数的过程，对结果实例的操作的操作将经过过滤并应用到原始实例上。例如，查看以下示例代码中的\
  \ `FileReader` 和 `BufferedReader` 对象：\n\n```\ntry (var br = new BufferedReader(new\
  \ FileReader(\"zoo-data.txt\"))) {\n    System.out.println(br.readLine());\n}\n\
  ```\n\n\n\n\n在这个示例中，`FileReader` 是低层 I/O 流，而 `BufferedReader` 是高层 I/O 流，它接收 `FileReader`\
  \ 作为输入。高层 I/O 流上的许多操作会作为对底层低层 I/O 流的操作传递，例如 `read()` 或 `close()`。其他操作则覆盖或在低层 I/O\
  \ 流方法的基础上添加了新功能。高层 I/O 流可能会添加新方法（如 `readLine()`），并对读取和过滤低层数据进行性能增强。\n\n高层 I/O 流还可以接受其他高层\
  \ I/O 流作为输入。例如，虽然下面的代码看起来有点奇怪，但这种包装 I/O 流的形式在实践中非常常见：\n\n```java\ntry (var ois =\
  \ new ObjectInputStream(\n      new BufferedInputStream(\n          new FileInputStream(\"\
  zoo-data.ser\")))) {\n    System.out.print(ois.readObject());\n}\n```\n\n在这个示例中，低层的\
  \ `FileInputStream` 直接与文件交互，它被高层的 `BufferedInputStream` 包装以提高性能。最后，整个对象被另一个高层的 `ObjectInputStream`\
  \ 包装，这允许我们将数据解释为 Java 对象。\n\n对于考试来说，你只需要熟悉的低层流类是那些操作文件的类。其余非抽象流类都是高层流。\n\n## 流基类\n\
  \n`java.io` 库定义了四个抽象类，它们是 API 中定义的所有 I/O 流类的父类：`InputStream`、`OutputStream`、`Reader`\
  \ 和 `Writer`。\n\n高层 I/O 流的构造函数通常接收抽象类的引用。例如，`BufferedWriter` 接收 `Writer` 对象作为输入，这允许它接收\
  \ `Writer` 的任何子类。\n\n考试喜欢出的花招的一个常见领域是混合使用互不兼容的 I/O 流类。例如，查看以下每个示例，看看你是否能确定它们无法编译的原因：\n\
  \n```java\nnew BufferedInputStream(new FileReader(\"z.txt\"));  // 无法编译\nnew BufferedWriter(new\
  \ FileOutputStream(\"z.txt\")); // 无法编译\nnew ObjectInputStream(new FileOutputStream(\"\
  z.txt\")); // 无法编译\nnew BufferedInputStream(new InputStream());      // 无法编译\n```\n\
  \n前两个无法编译是因为它们分别将 `Reader`/`Writer` 类与 `InputStream`/`OutputStream` 类混合在一起。第三个示例无法编译是因为我们正在将\
  \ `OutputStream` 与 `InputStream` 混合。虽然可以从 `InputStream` 读取数据并写入 `OutputStream`，但包装\
  \ I/O 流并不是实现这一目的。正如你在本章后面看到的，数据必须被复制。最后，最后一个示例无法编译是因为 `InputStream` 是一个抽象类，因此你无法创建它的实例。\n\
  \n正如我们在输入与输出流中所看到的，有几个例外。`InputStreamReader` 是一个接收 `InputStream` 的 `Reader`，而 `OutputStreamWriter`\
  \ 是一个接收 `OutputStream` 的 `Writer`。虽然考试中不太可能，但这些便利类允许你将一种流类型转换为另一种，这就是为什么它们的名称中同时包含这两种类型。`PrintWriter`\
  \ 类也很特殊，它可以接收 `OutputStream` 或 `Writer`。我们将在本章稍后部分详细介绍 `PrintWriter`。\n\n## 解码 I/O\
  \ 类名\n\n在考试中注意 I/O 类的名称，因为解码它通常能为你提供关于该类功能的上下文线索。例如，不需要查阅，应该很清楚 `FileReader` 是一个作为字符或字符串从文件中读取数据的类。此外，`ObjectOutputStream`\
  \ 听起来像是一个将对象数据写入字节流的类。\n\n[表 14.6] 列出了所有 I/O 流继承自的抽象基类。\n\n### 表 14.6 java.io 抽象流基类\n\
  \n| 类名 | 描述 |\n| --- | --- |\n| InputStream | 所有输入字节流的抽象类 |\n| OutputStream | 所有输出字节流的抽象类\
  \ |\n| Reader | 所有输入字符流的抽象类 |\n| Writer | 所有输出字符流的抽象类 |\n\n[表 14.7] 列出了考试时你应该熟悉的具体的\
  \ I/O 流。注意，关于每个 I/O 流的大部分信息（例如它是输入流还是输出流，或者它使用字节还是字符访问数据）仅通过名称即可解码。\n\n### 表 14.7\
  \ java.io 具体 I/O 流类\n\n| 类名 | 低层/高层 | 描述 |\n| --- | --- | --- |\n| FileInputStream\
  \ | 低 | 以字节读取文件数据 |\n| FileOutputStream | 低 | 以字节写入文件数据 |\n| FileReader | 低 | 以字符读取文件数据\
  \ |\n| FileWriter | 低 | 以字符写入文件数据 |\n| BufferedInputStream | 高 | 以缓冲方式从现有 InputStream\
  \ 中读取字节数据，提高了效率和性能 |\n| BufferedOutputStream | 高 | 以缓冲方式向现有 OutputStream 写入字节数据，提高了效率和性能\
  \ |\n| BufferedReader | 高 | 以缓冲方式从现有 Reader 中读取字符数据，提高了效率和性能 |\n| BufferedWriter\
  \ | 高 | 以缓冲方式向现有 Writer 写入字符数据，提高了效率和性能 |\n| ObjectInputStream | 高 | 从现有 InputStream\
  \ 中反序列化 Java 原始数据类型和 Java 对象图 |\n| ObjectOutputStream | 高 | 将 Java 原始数据类型和 Java\
  \ 对象图序列化到现有 OutputStream |\n| PrintStream | 高 | 向二进制流写入格式化的 Java 对象 |\n| PrintWriter\
  \ | 高 | 向字符流写入格式化的 Java 对象 |\n\n在你在本章中学习更多 I/O 流时，请留好 [表 14.6] 和 [表 14.7]。我们将在详细讨论这些内容，并包含示例。\n\
  \n## 读取和写入文件\n\n有许多方法读写文件。我们在本节中通过复制文件来展示它们。\n\n### 使用 I/O 流\n\nI/O 流的核心是读取/写入，因此最重要的方法是\
  \ `read()` 和 `write()` 并不意外。`InputStream` 和 `Reader` 都声明了 `read()` 方法从 I/O 流中读取数据。同样，`OutputStream`\
  \ 和 `Writer` 都定义了 `write()` 方法向流写入字节。\n\n下面的 `copyStream()` 方法展示了从 `InputStream`\
  \ 和 `Reader` 读取所有值并分别写入 `OutputStream` 和 `Writer` 的示例。在两个示例中，都使用 `-1` 表示流的结束。\n\n\
  ```java\nvoid copyStream(InputStream in, OutputStream out) throws IOException {\n\
  \    int b;\n    while ((b = in.read()) != -1) {\n        out.write(b);\n    }\n\
  }\n\nvoid copyStream(Reader in, Writer out) throws IOException {\n    int b;\n \
  \   while ((b = in.read()) != -1) {\n        out.write(b);\n    }\n}\n```\n\n等一下。我们说正在读写字节，为什么方法使用\
  \ `int` 而不是 `byte`？？记住，字节数据类型的范围是 256 个字符。他们需要一个额外的值来表示 I/O 流的结束。Java 的作者们决定使用更大的数据类型\
  \ `int`，这样像 `-1` 这样的特殊值就可以表示 I/O 流的结束。输出流类也使用 `int`，以与输入流类保持一致。\n\n\n\n一次读取或写入一个字节并不是这种操作特别高效的方法。幸运的是，存在重载方法可以一次读取和写入多个字节。`offset`\
  \ 和 `length` 值作用于数组本身。例如，`offset` 为 `3` 且 `length` 为 `5` 表示流应该读取多多五个字节/字符的数据，并将它们从位置\
  \ `3` 开始放入数组中。让我们来看一个例子：\n\n```java\nvoid copyStream(InputStream in, OutputStream\
  \ out) throws IOException {\n    int batchSize = 1024;\n    var buffer = new byte[batchSize];\n\
  \    int lengthRead;\n    while ((lengthRead = in.read(buffer, 0, batchSize)) >\
  \ 0) {\n        out.write(buffer, 0, lengthRead);\n        out.flush();\n    }\n\
  }\n```\n\n我们没有一次一个字节地读取数据，而是在第 14–15 行一次读取并写入多达 `1024` 字节。返回值 `lengthRead` 对于判断我们是否到达流的末尾以及知道我们应该向输出流写入多少字节至关重要。\n\
  \n除非我们的文件恰好是 `1024` 字节的倍数，否则 `while` 循环的最后一次将写入少于 `1024` 字节的值。例如，如果缓冲区大小为 `1,024`\
  \ 字节而文件大小为 `1,054` 字节，最后读取将只有 `30` 字节。如果我们忽略这个返回值而写入 `1,024` 字节，那么之前循环中的 `994` 字节将被写入文件末尾。\n\
  \n我们还在第 16 行添加了 `flush()` 方法，用以减少应用程序意外终止时丢失的数据量。当数据写入输出流时，底层操作系统并不保证数据会立即到达文件系统。`flush()`\
  \ 方法要求将所有积累的数据立即写入磁盘。不过，这并不是免费的。每使用一次它，都可能导致应用程序出现明显的延迟，特别是对于大文件。除非你正在写入的数据极其关键，否则应该间歇使用\
  \ `flush()` 方法。例如，它不必像本示例这样每次写入后都调用。\n\n`Reader` 和 `Writer` 上也存在对应的方法，但它们使用的是 `char`\
  \ 而不是 `byte`，这使得等等的 `copyStream()` 方法非常相似。\n\n之前的示例让读取和写入文件看起来有很多需要考虑的。那是因为它只使用了低层\
  \ I/O 流。让我们尝试使用高层流重试。\n\n```java\nvoid copyTextFile(File src, File dest) throws\
  \ IOException {\n    try (var reader = new BufferedReader(new FileReader(src));\n\
  \         var writer = new BufferedWriter(new FileWriter(dest))) {\n        String\
  \ line = null;\n        while ((line = reader.readLine()) != null) {\n         \
  \   writer.write(line);\n            writer.newLine();\n        } } }\n```\n\n关键在于选择最实用的高层类。在这种情况下，我们处理的是一个\
  \ `File`，所以我们想要使用 `FileReader` 和 `FileWriter`。这两个类都拥有构造函数，可以接收表示位置的 `String` 或直接接收\
  \ `File` 对象。\n\n### 如果源文件不存在\n将抛出一个继承自 `IOException` 的 `FileNotFoundException`。如果目标文件已存在，此实现将将覆盖它。如果我们想改变这种行为，可以向\
  \ `FileWriter` 传递一个可选的 `boolean` 第二参数作为追加标志。\n\n我们还选择使用 `BufferedReader` 和 `BufferedWriter`，以便我们可以一次读取一整行。这让我们在第\
  \ 30 行获得了批量读取字符的优势，而无需编写自定义逻辑。第 31 行一次性写入整行数据。由于读取行时会剥离换行符，我们在第 32 行将它们加回来。第 27\
  \ 和第 28 行演示了构造函数的链式调用。`try-with-resources` 负责关闭链中的所有对象。\n\n现在假设我们需要的是字节数据而不是字符。我们需要选择不同的高层类：`BufferedInputStream`、`BufferedOutputStream`、`FileInputStream`\
  \ 和 `FileOutputStream`。我们将调用 `readAllBytes()` 而不是 `readLine()`，并将结果存储在 `byte[]`\
  \ 而不是 `String` 中。最后，由于数据是二进制的，我们不需要处理换行。\n\n通过使用 `PrintStream` 和 `PrintWriter`我们可以比\
  \ `BufferedOutputStream` 和 `BufferedWriter` 得。这些类包含了四个关键方法。`print()` 和 `println()`\
  \ 方法分别打印带换行和不带换行的数据。还有 `format()` 和 `printf()` 方法，我们将在用户交互章节描述它们。\n\n```java\nvoid\
  \ copyTextFile(File src, File dest) throws IOException {\n    try (var reader =\
  \ new BufferedReader(new FileReader(src));\n         var writer = new PrintWriter(new\
  \ FileWriter(dest))) {\n        String line = null;\n        while ((line = reader.readLine())\
  \ != null) {\n            writer.println(line);\n        }\n    }\n}\n```\n\n###\
  \ 使用 Files 增强\nNIO.2 API 提供了更简单的使用 `Files` 读取和写入文件的方法。让我们先看通过读取和写回复制文件的三种方法：\n\n\
  ```java\nvoid copyPathAsString(Path input, Path output) throws IOException {\n \
  \   String string = Files.readString(input);\n    Files.writeString(output, string);\n\
  }\n\nvoid copyPathAsBytes(Path input, Path output) throws IOException {\n    byte[]\
  \ bytes = Files.readAllBytes(input);\n    Files.write(output, bytes);\n}\n\nvoid\
  \ copyPathAsLines(Path input, Path output) throws IOException {\n    List<String>\
  \ lines = Files.readLines(input);\n    Files.write(output, lines);\n}\n```\n\n这非常简洁！你可以将\
  \ `Path` 读取为 `String`、`byte array` 或 `List`。请注意，这三种方法都会一次读取整个文件，从而将文件的所有内容存储在内存中。如果文件很大，在尝试将其全部加载到内存时可能会触发\
  \ `OutOfMemoryError`。幸运的是，还有另一种方案。这次，我们在读取文件时打印它：\n\n```java\nvoid readLazily(Path\
  \ path) throws IOException {\n    try (Stream<String> s = Files.lines(path)) {\n\
  \        s.forEach(System.out::println);\n    }\n}\n```\n\n现在文件内容是延迟读取和处理的，这意味着在任何时刻内存中只存储文件的一小部分。更进一步，我们可以利用其他流方法来实现一个更强大的示例：\n\
  \n```java\ntry (var s = Files.lines(path)) {\n    s.filter(f -> f.startsWith(\"\
  WARN:\"))\n      .map(f -> f.substring(5))\n      .forEach(System.out::println);\n\
  }\n```\n\n这段示例代码搜索日志中以 WARN: 开头的行，输出后面的文本。假设输入文件 `sharks.log` 如下：\n\n```\nINFO:Server\
  \ starting\n\nDEBUG:Processes available = 10\n```\n\n\n\n\n\nWARN：未检测到数据库\n\nDEBUG：可用进程重置为\
  \ 0\n\nWARN：正在执行手动恢复\n\nINFO：服务器启动成功\n\n随后示例输出将如下：\n\n未检测到数据库\n\n正在执行手动恢复\n\n如你所见，我们能够以复杂的方式操作文件，通常只需要几个短小的表达式。\n\
  \n### `Files.readAllLines()` vs. `Files.lines()`\n\n在考试中，你需要了解 `readAllLines()`\
  \ 和 `lines()`get 区别。这两个示例都可以编译并运行。\n\n```\nFiles.readAllLines(Path.of(\"birds.txt\"\
  )).forEach(System.out::println);\nFiles.lines(Path.of(\"birds.txt\")).forEach(System.out::println);\n\
  ```\n\n第一行将整个文件读取到内存中并对其执行打印操作，而第二行则是懒性地（lazily）处理每一行，并在读取时将其打印出来。第二个代码段的优势是它在任何时候都不需要将整个文件存储在内存中。\n\
  \n你应该注意在考试中何时何时混合了不兼容的类型。你看到为什么以下代码无法编译了吗？\n\n```\nFiles.readAllLines(Path.of(\"\
  birds.txt\"))\n    .filter(s -> s.length() 2)\n    .forEach(System.out::println);\n\
  ```\n\n`readAllLines()` 方法返回的是 `List` 而不是 `Stream`，因此没有 `filter()` 方法。\n\n### 结合\
  \ `newBufferedReader()` 和 `newBufferedWriter()`\n\n有时你需要混合使用 I/O 流和 NIO.2。方便的是，`Files`\
  \ 包含了两个用于获取 I/O 流的便利方法。\n\n```java\nprivate void copyPath(Path input, Path output)\
  \ throws IOException {\n    try (var reader = Files.newBufferedReader(input);\n\
  \         var writer = Files.newBufferedWriter(output)) {\n        String line =\
  \ null;\n        while ((line = reader.readLine()) != null) {\n            writer.write(line);\n\
  \            writer.newLine();\n        } } } }\n```\n\n你可以包装 I/O 流的构造函数来产生相同的效果，尽管使用工厂方法要简单得多。第一个方法\
  \ `newBufferedReader()` 使用 `BufferedReader` 对象读取 `Path` 位置指定的文件。\n\n### 复习常见的读写方法\n\
  \n表 14.8 复习了你在读写时应该掌握的公共 I/O 流方法。我们还包含了 `close()` 和 `flush()`，因为在执行这些操作时会用到它们。表\
  \ 14.9 对常见的公共 NIO.2 读写方法涵盖了类似的说明。\n\n表 14.8 常见的 I/O 读写实例方法\n\n| 类 | 方法名 | 描述 |\n\
  | --- | --- | --- |\n| 所有输入流 | `int read()` | 读取单个字节，若无可用字节则返回 -1。 |\n| InputStream\
  \ | `int read(byte[] b)` | 将值读入缓冲区并返回读取的字节或字符数。 |\n| Reader | `int read(char[] c)`\
  \ | |\n| InputStream | `int read(byte[] b, int offset, int length)` | 从位置 offset\
  \ 开始将最多长度 个 的值读入缓冲区，并返回读取的字节或字符数。 |\n| Reader | `int read(char[] c, int offset,\
  \ int length)` | |\n| 所有输出流 | `void write(int b)` | 写入单个字节。 |\n| OutputStream |\
  \ `void write(byte[] b)` | 将值数组写入流。 |\n| Writer | `void write(char[] c)` | |\n|\
  \ OutputStream | `void write(byte[] b, int offset, int length)` | 从索引 offset 开始将数组中长度长度\
  \ 的值写入流。 |\n| Writer | `void write(char[] c, int offset, int length)` | |\n| InputStream\
  \ | `byte[] readAllBytes()` | 按字节读取数据。 |\n| BufferedReader | `String readLine()`\
  \ | 读取行数据。 |\n| Writer | `void write(String line)` | 写入行数据。 |\n| BufferedWriter\
  \ | `void newLine()` | 写入换行。 |\n| 所有输出流 | `void flush()` | 刷新流中的缓冲区数据。 |\n| 所有流\
  \ | `void close()` | 关闭流并释放资源。 |\n\n表 14.9 常见的 Files NIO.2 读写静态方法\n\n| 方法名 | 描述\
  \ |\n| --- | --- |\n| `byte[] readAllBytes(Path path)` | 按字节读取所有数据 |\n| `String\
  \ readString(Path path)` | 将所有数据读入 String |\n| `List<String> readAllLines(Path path)`\
  \ | 将所有数据读入 List |\n| `Stream<String> lines(Path path)` | 懒性读取数据 |\n| `void write(Path\
  \ path, byte[] bytes)` | 写入字节数组 |\n| `void writeString(Path path, String string)`\
  \ | 写入 String |\n| `void write(Path path, List<String> list)` | 写入行列表（技术上来说是 CharSequence\
  \ 的 Iterable，但考试时不需要知道这一点） |\n\n## 数据序列化\n\n在整本书中，我们一直使用类来管理数据模型，因此我们希望在程序执行之间保存这些对象是有逻辑的。如果动物园动物的健康状况每次程序运行时都要重新输入，那将是毫无用处的！\n\
  \n你完全可以使用 I/O 流类来保存这些对象。可以使用我们已经学习的 I/O 流类来存储数据，但你仍然需要弄清楚如何将其序列化。序列化是将对象转换为 I/O\
  \ 流的过程。相应地，反序列化是从 I/O 流转换回对象的过程。图 14.5 显示了将 giraffe 对象序列化和反序列化的 giraffe.ser 文件。序列化通常涉及到将对象写入可传输的格式，而反序列化是其逆过程。\n\
  \n在本节中，我们将展示 Java 如何提供内置机制来从磁盘序列化和反序列化 I/O 流。\n\n### 应用 Serializable 接口\n\n要使用 I/O\
  \ API 序列化对象，对象必须实现 `java.io.Serializable` 接口。`Serializable` 接口是一个标记接口，这意味着它没有任何方法。任何类都可以实现\
  \ `Serializable` 接口，因为没有需要实现的方法。\n\n由于 `Serializable` 是一个没有抽象成员的标记接口，为什么不将其应用到所有类上？通常情况下，你应该只对面向数据的类标记为序列化。面向过程的类（例如本章讨论的\
  \ I/O 流或你在第 13 章中学习的 `Thread` 实例）通常不是序列化的良好选择，因为这些类的内部状态往往是瞬时的或短寿命的。\n\n使用 `Serializable`\
  \ 接口的目的是告知任何尝试序列化对象的进程你已经采取了正确的步骤使对象可序列化。所有的 Java 基本类型以及你在本书中使用过的许多内置 Java 类都是 `Serializable`\
  \ 的。例如，此类可以序列化：\n\n```java\nimport java.io.Serializable;\n\npublic class Gorilla\
  \ implements Serializable {\n    private static final long serialVersionUID = 1L;\n\
  \    private String name;\n    private int age;\n    private Boolean friendly;\n\
  \    private transient String favoriteFood;\n\n    // 构造函数/getter/setter/toString()\
  \ 省略\n}\n```\n\n\n\n\n\n标记为 `transient` 的 `favoriteFood` 字段又是怎样的？任何标记为 `transient`\
  \ 的字段在类被序列化时都不会被保存到 I/O 流中。我们将在后面详细讨论这一点。\n\n### ![](img/image_rsrc10BB.jpg) 现实场景\n\
  \n### 维护 serialVersionUID\n\n在每个实现 `Serializable` 的类中声明一个 `static serialVersionUID`\
  \ 变量是一个良好的实践。该版本作为序列化的一部分与每个对象一起存储。然后每当类结构发生变化时，该值就会更新或增加。\n\n也许我们的 `Gorilla` 类接收了一个新的实例成员\
  \ `Double banana`，或者 `age` 字段被重命名了。这种情况是：一个类可能用旧版本的类进行序列化，然后用新版本的类进行反序列化。\n\n`serialVersionUID`\
  \ 有助于告知 `JVM` 存储的数据可能与新的类定义不匹配。如果在反过程中遇到旧版本的类，可能会抛出 `java.io.InvalidClassException`。或者，某些\
  \ API 支持在版本之间转换数据。\n\n### 将数据标记为 transient\n\n`transient` 修饰符可用于类的敏感数据，例如 `password`。还有其他对象没有必要进行序列化，例如内存中\
  \ `Thread` 的状态。如果该对象是序列化对象的一部分，我们只需将其标记为 `transient` 以忽略这些特定的实例成员。\n\n标记为 `transient`\
  \ 的数据在反序列化时会发生什么？它们会恢复 Java 的默认值，例如 `double` 为 `0.0`，对象为 `null`。稍后在我们介绍对象流类时，你会看到相关的示例。\n\
  \n![](img/image_rsrc10B8.jpg)\n\n将静态字段标记为 `transient` 对序列化的影响很小。除了 `serialVersionUID`\
  \ 外，只有类的实例成员会被序列化。`static` 变量在 `JVM` 运行保持状态，因此 `transient` 会被忽略。\n\n### 确保类是可序列化的\n\
  \n由于 `Serializable` 是一个标记接口，你可能认为使用它没有规则。并非如此！任何尝试序列化对象的过程如果没有正确实现 `Serializable`\
  \ 接口，将抛出 `NotSerializableException`。\n\n#### 如何使类变为可序列化\n\n*   类必须被标记为 `Serializable`。\n\
  *   类的每个实例成员必须是可序列化的、标记为 `transient` 的或在序列化时为 `null` 值。\n\n小心第二条规则。为了使类变为可序列化，我们必须递归地应用第二条规则。你看出为什么下面的\
  \ `Cat` 类不是可序列化的了吗？\n\n```java\npublic class Cat implements Serializable {\n   private\
  \ Tail tail = new Tail();\n}\n\npublic class Tail implements Serializable {\n  \
  \ private Fur fur = new Fur();\n}\n\npublic class Fur {}\n```\n\n`Cat` 包含一个 `Tail`\
  \ 实例，这两个类都被标记为 `Serializable`，所以这里没有问题。遗憾的是，`Tail` 包含一个没有标记为 `Serializable` 的 `Fur`\
  \ 实例。\n\n以下任何更改都可以解决问题并允许 `Cat` 被序列化：\n\n```java\npublic class Tail implements Serializable\
  \ {\n   private transient Fur fur = new Fur();\n}\n\npublic class Fur implements\
  \ Serializable {}\n```\n\n我们也可以让 `tail` 或 `fur` 实例成员变为 `null`，尽管这将使 `Cat` 只对特定实例可序列化，而不是所有实例。\n\
  \n### 序列化 Record\n\n你认为这个 record 是可序列化的吗？\n\n```java\nrecord Record(String name)\
  \ {}\n```\n\n它不是可序列化的，因为它没有实现 `Serializable`。`record` 在是否可以序列化方面遵循与其他类相同的规则。因此，这个可以：\n\
  \n```java\nrecord Record(String name) implements Serializable\n```\n\n### 使用 ObjectOutputStream\
  \ 和 ObjectInputStream 存储数据\n\n`ObjectOutputStream` 用于序列化对象，而 `ObjectInputStream`\
  \ 用于反序列化。注意 `readObject()` 声明了 `IOException`。我们提供了如何使用它们的示例：\n\n```java\nvoid saveToFile(List<Gorilla>\
  \ gorillas, File dataFile) throws IOException {\n   try (ObjectOutputStream out\
  \ = new ObjectOutputStream(new FileOutputStream(dataFile))) {\n      for (Gorilla\
  \ gorilla : gorillas) {\n         out.writeObject(gorilla);\n      }\n   }\n}\n\n\
  List<Gorilla> readFromFile(File dataFile) throws IOException {\n   List<Gorilla>\
  \ gorillas = new ArrayList<>();\n   try (ObjectInputStream in = new ObjectInputStream(new\
  \ FileInputStream(dataFile))) {\n      while (true) {\n         Object object =\
  \ in.readObject();\n         if (object instanceof Gorilla g) {\n            gorillas.add(g);\n\
  \         }\n      }\n   } catch (EOFException e) {\n      // end reached\n   }\n\
  \   return gorillas;\n}\n```\n\n啊，并没有我们的保存方法那么简单，对吧？调用 `readObject()` 时，注意 `ClassNotFoundException`，因为类在反序列化时可能不可。以下代码显示了如何调用序列化方法：\n\
  \n```java\nList<Gorilla> gorillas = new ArrayList<>();\ngorillas.add(new Gorilla(\"\
  Grodd\", 5, false));\ngorillas.add(new Gorilla(\"Ishmael\", 8, true));\n\nFile dataFile\
  \ = new File(\"gorilla.ser\");\n\nsaveToFile(gorillas, dataFile);\n\nvar gorillasFromDisk\
  \ = readFromFile(dataFile);\n\nSystem.out.print(gorillasFromDisk);\n```\n\n假设 `Gorilla`\
  \ 类中正确重写了 `toString()` 方法，将在运行时打印以下内容：\n`[[name=Grodd, age=5, friendly=false], [name=Ishmael,\
  \ age=8, friendly=true]]`\n\n如果你的程序恰好知道 I/O 流中的对象数量，你可以固定次数地调用 `readObject()`，而不是使用无限循环。\n\
  \n\n\n\n让我们来看一个新的 `Chimpanzee` 类，它的父类没有实现 `Serializable`。这次我们列出了所有的构造函数，用来说说明在反序列化时会使用哪一个。\n\
  \n```java\n// Mammal.java\npublic class Mammal {\n   private int id;\n   public\
  \ Mammal() {\n      this.id = 4;\n   }\n   // Getters/Setters/toString() omitted\n\
  }\n\n// Chimpanzee.java\nimport java.io.Serializable;\npublic class Chimpanzee extends\
  \ Mammal implements Serializable {\n   private static final long serialVersionUID\
  \ = 2L;\n   private transient String name;\n   private transient int age = 10;\n\
  \   private static char type = 'C';\n   { this.age = 14; }\n   public Chimpanzee()\
  \ {\n        this(\"Unknown\", 12, 'Q');\n   }\n   public Chimpanzee(String name,\
  \ int age, char type) {\n        this.name = name;\n        this.age = age;\n  \
  \      this.type = type;\n        setId(9);\n   }\n   // Getters/Setters/toString()\
  \ omitted\n}\n```\n\n假设我们重写之前的序列化和反序列化方法，以处理 `Chimpanzee` 对象而不是 `Gorilla` 对象，你认为以下代码会打印什么？\n\
  \n```java\nvar chimpanzees = List.of(new Chimpanzee(\"Ham\", 2, ’A’),\n    new Chimpanzee(\"\
  Enos\", 3, ’B'));\nFile dataFile = new File(\"chimpanzee.ser\");\nSystem.out.println(\"\
  Original:  \" + chimpanzees);\nsaveToFile(chimpanzees, dataFile);\nvar chimpanzeesFromDisk\
  \ = readFromFile(dataFile);\nSystem.out.println(\"From Disk: \" + chimpanzeesFromDisk);\n\
  ```\n\n思考一下。继续，我们会等的。\n\n准备好看答案了吗？首先，没有任何实例成员被序列化到文件中。`name` 和 `age` 变量都被标记为 `transient`，而\
  \ `type` 变量是 `static` 的。我们特意使用 `this` 访问 `type` 变量是为了是为了看你是否在关注。\n\n在反序列化时，`Chimpanzee`\
  \ 中的任何构造函数都不会被调用。即使是设置值 `[name=Unknown, age=12, type=Q, id=8]` 的无参构造函数也会忽略。将 `age`\
  \ 设置为 `14` 的实例初始化器也不会执行。\n\n在这种情况下，`name` 变量被初始化为 `null`，因为这是 Java 中 `String` 的默认值。同样，`age`\
  \ 变量被初始化为 `0`。\n\n然而，父类 `Mammal` 没有实现 `Serializable`，因此会调用默认构造函数并将 `id` 设置为 `4`。假设已经实现了\
  \ `toString()` 方法，程序将打印以下内容：\n\n```\nOriginal:  [[name=Ham, age=2, type=B, id=9,\
  \ [name=Enos, age=3, type=B, id=9]]\nFrom Disk: [[name=null, age=0, type=B, id=4,\
  \ [name=null, age=0, type=B, id=4]]\n```\n\n`type` 变量呢？因为它是 `static` 的，它将显示最后设置的值。如果数据在同一次执行过程中被序列化和反序列化，它将显示\
  \ `B`，因为那是我们创建的最后一个 `Chimpanzee`。相反，如果程序在启动时执行反序列化和打印，它将打印 `C`，因为那是类初始化时的值。\n\n\
  对于考试，请确保你理解：序列化类中定义的构造函数和任何实例初始化在反序列化过程中都会被忽略。Java 仅会调用类层次结构中第一个不可序列化父类的构造函数。\n\n\
  最后，我们来添加一个子类：\n\n```java\npublic class BabyChimpanzee extends Chimpanzee {\n   private\
  \ static final long serialVersionUID = 3L;\n   private String mother = \"Mom\";\n\
  \   public BabyChimpanzee() { super(); }\n   public BabyChimpanzee(String name,\
  \ char type) {\n      super(name, 0, type);\n   }\n   // Getters/Setters/toString()\
  \ omitted\n}\n```\n\n注意，这个子类 `BabyChimpanzee` 是可序列化的，因为父类 `Chimpanzee` 已经实现了 `Serializable`。我们现在多了一个实例变量。序列化和反序列化的代码保持不变。我们甚至仍然可以强制转换为\
  \ `Chimpanzee`，因为这是一个子类。\n\n### 自定义序列化\n\n通常情况下，开箱提供的序列化规则已经足够好。然而，你可以更细粒度地控制序列化过程。\n\
  \n要自定义序列化，只需在你的 `Serializable` 类中定义具有特定签名的私有方法。这些方法实际上并不是重写，但它们会自动作为序列化过程的一部分被调用。通常的做法是先调用\
  \ `defaultReadObject()`。\n\n```java\nclass Fish implements Serializable {\n   private\
  \ String name;\n   private transient int fins;\n\n   private void writeObject(ObjectOutputStream\
  \ out) throws IOException {\n      out.defaultWriteObject();\n      // 写 fins 的自定义逻辑\n\
  \   }\n\n   private void readObject(ObjectInputStream in) throws IOException, ClassNotFoundException\
  \ {\n      in.defaultReadObject();\n      // 读取 fins 的自定义逻辑\n   }\n}\n```\n\n###\
  \ 与用户交互\n\n虽然开箱提供的序列化规则已经足够好。然而，你可以更细粒度地控制序列化过程。\n\n要自定义序列化，只需在你的 `Serializable`\
  \ 类中定义具有特定签名的私有方法。这些方法实际上并不是重写，但它们会自动作为序列化过程的一部分被调用。通常的做法是先调用 `defaultReadObject()`。\n\
  \n```java\nclass Fish implements Serializable {\n   private String name;\n   private\
  \ transient int fins;\n\n   private void writeObject(ObjectOutputStream out) throws\
  \ IOException {\n      out.defaultWriteObject();\n      // 写 fins 的自定义逻辑\n   }\n\
  \n   private void readObject(ObjectInputStream in) throws IOException, ClassNotFoundException\
  \ {\n      in.defaultReadObject();\n      // 读取 fins 的自定义逻辑\n   }\n}\n```\n*(注：此处原文存在重复段落，已按原文逻辑进行翻译)*\n\
  \n```java\nclass Fish implements Serializable {\n   private String name;\n   private\
  \ transient int fins;\n\n   private void writeObject(ObjectOutputStream out) throws\
  \ IOException {\n      out.defaultWriteObject();\n      // 写 fins 的自定义逻辑\n   }\n\
  \n   private void readObject(ObjectInputStream in) throws IOException, ClassNotFoundException\
  \ {\n      in.defaultReadObject();\n      // 读取 fins 的自定义逻辑\n   }\n}\n```\n\n###\
  \ 向用户打印数据\n\nJava 两个 `PrintStream` 实例来提供信息：`System.out` 和 `System.err`。虽然 `System.out`\
  \ 对你来说是旧的，`System.err` 对你来说是新的。\n\n```java\ntry (var in = new FileInputStream(\"\
  zoo.txt\")) {\n   System.out.println(\"找到文件!\");\n} catch (FileNotFoundException\
  \ e) {\n   System.err.println(\"未找到文件!\");\n}\n```\n\n它们在实践中有什么区别？在某种程度上，这取决于执行程序的程序。例如，如果你从命令行运行，它们可能会以相同的格式打印。另一方面，如果你在集成开发环境（IDE）中工作，`System.err`\
  \ 会以不同的颜色打印。最后，如果代码在服务器上运行，`System.err` 流可能会写入不同的日志文件。\n\n![](img/image_rsrc10BB.jpg)\
  \ 真实场景\n\n### 使用日志 API\n\n虽然 `System.out` 和 `System.err` 对于调试独立或应用程序非常有用，但在专业开发中很少使用。大多数应用程序依赖日志服务或\
  \ API。\n\n虽然有很多日志 API 可用，但它们通常共享许多属性。首先在每个类中创建一个静态日志对象。然后使用相应的日志级别记录消息：`debug()`、`info()`、`warn()`\
  \ 或 `error()`。`debug()` 和 `info()` 方法非常有用，因为它们允许开发者记录不是错误的内容。例如：\n\n```java\nvar\
  \ logger = Logger.getLogger(\"errors\");\nlogger.info(\"代码正在运行\");\nlogger.warning(\"\
  代码不应该这样做\");\n```\n\n你也可以使用 `log()` 方法并程序化提供级别：\n\n```java\nlogger.log(Level.SEVERE,\
  \ \"你应该担心\");\n```\n\n### 作为 I/O 流读取输入\n\n`System.in` 返回一个 `InputStream` 并用于检索用户的文本输入。它通常通过\
  \ `InputStreamReader` 包装在 `BufferedReader` 中以使用 `readLine()` 方法。\n\n```java\nvar\
  \ reader = new BufferedReader(new InputStreamReader(System.in));\nString userInput\
  \ = reader.readLine();\nSystem.out.println(\"你输入了: \" + userInput);\n```\n\n\n\n\
  你可能已经注意到，在使用 `System.out`、`System.err` 和 `System.in` 时，我们从未创建或关闭过它们。事实上，这些是整个章节中我们唯一没有对它们使用\
  \ `try-with-resources` 块的 I/O 流！\n\n由于这些是静态对象，`System` 流被整个应用程序共享。`JVM` 为我们已经创建并打开了它们。它们可以在\
  \ `try-with-resources` 语句中使用，也可以通过调用 `close()` 来使用，尽管不建议关闭它们。关闭 `System` 流会导致它们在程序的剩余时间内对所有线程都永久不可用。\n\
  \n你认为这段代码片段会打印什么？\n\n```java\ntry (var out = System.out) {}\n\nSystem.out.println(\"\
  Hello\");\n```\n\n什么都不打印。它什么都没有输出。`PrintStream` 的方法不会抛出任何检查异常，而是依赖 `checkError()`\
  \ 来报告错误，因此它们会静默失败。\n\n那么这个例子呢？\n\n```java\ntry (var err = System.err) {}\n\nSystem.err.println(\"\
  Hello\");\n```\n\n这个同样什么都不打印。和 `System.out` 一样，`System.err` 是一个 `PrintStream`。即使它抛出了异常，我们也很难看到，因为我们报告错误的\
  \ I/O 流已经关闭了！关闭 `System.err` 是一个特别糟糕的主意，因为所有异常的堆栈跟踪将被隐藏。\n\n最后，你认为这段代码片段会做什么？\n\n\
  ```java\nvar reader = new BufferedReader(new InputStreamReader(System.in));\n\n\
  try (reader) {}\n\nString data = reader.readLine();  // IOException\n```\n\n它在运行时抛出一个异常。与\
  \ `PrintStream` 类不同，大多数 `InputStream` 实现在尝试对已关闭的 I/O 流进行操作时都会抛出异常。\n\n### 使用控制台获取输入\n\
  \n`java.io.Console` 类专门为处理用户交互而设计。毕竟，`System.in` 和 `System.out` 只是原始的流，而 `Console`\
  \ 是一个具有许多围绕用户输入的方法的类。\n\n`Console` 类是一个单例，因为其只能通过工厂方法访问，并且 `JVM` 只创建它的一个实例。例如，如果你在考试中遇到下面的代码，它是无法编译的，因为所有的构造函数都是私有的：\n\
  \n```java\nConsole c = new Console();  // 无法编译\n```\n\n下面的片段展示了如何获取一个 `Console`\
  \ 并使用它检索用户输入：\n\n```java\nConsole console = System.console();\n\nif (console !=\
  \ null) {\n    String userInput = console.readLine();\n    console.writer().println(\"\
  You entered: \" + userInput);\n    console.flush();\n} else {\n    System.err.println(\"\
  Console not available\");\n}\n```\n\n![](img/image_rsrc10B8.jpg)\n\n取决于代码调用的位置，`Console`\
  \ 对象可能不可。如果不可，`System.console()` 将返回 `null`。在尝试使用 `Console` 对象之前，必须检查其是否为空值！\n\n\
  该程序首先获取 `Console` 实例并验证它是否可用，如果不可，则向 `System.err` 输出消息。如果可用，程序将从用户处获取一行输入并打印结果。`flush()`\
  \ 是为了确保输出被写入。正如你可能注意到的，这个例子与我们之前使用 `System.in` 和 `System.out` 读取用户输入的示例相似。\n\n####\
  \ 获取底层 I/O 流\n\n`Console` 类包含了两个用于读写数据的流访问方法。\n\n```java\npublic Reader reader()\n\
  \npublic PrintWriter writer()\n```\n\n访问这些类比于直接调用 `System.in` 和 `System.out`，尽管它们使用的是字符流而不是字节流。通过这种方式，它们更适合处理文本数据。\n\
  \n#### 格式化控制台数据\n\n在第 4 章中，你学习了 `String` 的 `format()` 方法；在第 11 章“异常与本地化”中，你使用了使用本地化进行格式化工作。方便的是，每个打印流类都包含一个\
  \ `format()` 方法，其中包含一个接受 `Locale` 的重载版本，结合了上述两者：\n\n```java\n// PrintStream\npublic\
  \ PrintStream format(String format, Object… args)\npublic PrintStream format(Locale\
  \ loc, String format, Object… args)\n\n// PrintWriter\npublic PrintWriter format(String\
  \ format, Object… args)\npublic PrintWriter format(Locale loc, String format, Object…\
  \ args)\n```\n\n![](img/image_rsrc10B8.jpg)\n\n为了方便（以及为了让 C 开发者感到更熟悉），Java 包含了 `printf()`\
  \ 方法，其功能与 `format()` 方法完全相同。你对这些方法唯一需要知道的就是它们与 `format()` 是可以互换的。\n\n让我们来看看如何使用多个方法为用户打印信息：\n\
  \n```java\nConsole console = System.console();\n\nif (console == null) {\n    throw\
  \ new RuntimeException(\"Console not available\");\n} else {\n    console.writer().println(\"\
  Welcome to Our Zoo!\");\n    console.format(\"It has %d animals and employs %d people\"\
  , 391, 25);\n    console.writer().println();\n    console.printf(\"The zoo spans\
  \ %5.1f acres\", 128.91);\n    console.flush();\n}\n```\n\n假设 `Console` 在运行时可用，它将打印以下内容：\n\
  \n```\nWelcome to Our Zoo!\nIt has 391 animals and employs 25 people\nThe zoo spans\
  \ 128.9 acres.\n```\n\n![](img/image_rsrc10B.jpg)\n\n`PrintStream` 和 `PrintWriter`\
  \ 是相似的，因为它们都支持相同的方法。区别在于 `PrintStream` 会使用提供的（或默认的）编码将字符转换为字节。此外只有 `PrintStream`\
  \ 支持直接处理字节。\n\n#### 读取控制台数据\n\n`Console` 类包含了四个检索文本数据的方法。\n\n```java\npublic String\
  \ readLine()\npublic String readLine(String fmt, Object… args)\npublic char[] readPassword()\n\
  public char[] readPassword(String fmt, Object… args)\n```\n\n类似于使用 `BufferedReader`\
  \ 使用 `System.in`，`Console readLine()` 方法读取输入直到用户按下回车键。`readLine()` 的重载版本在请求输入之前显示格式化消息。`readPassword()`\
  \ 方法与 `readLine()` 方法有两个相似：\n\n- 用户输入的文本不会回显并显示在屏幕上。\n- 数据返回 `char[]` 而不是 `String`。\n\
  \n第一个特性通过在有人坐在你旁边时不显示密码提高了安全性。第二个特性涉及防止密码进入字符串池。\n\n#### 复习控制台方法\n\n我们最后的代码示例向用户提出一系列问题，并使用本节中学到的许多方法根据这些信息打印结果：\n\
  \n```java\nConsole console = System.console();\n\nif (console == null) {\n    throw\
  \ new RuntimeException(\"Console not available\");\n} else {\n    String name =\
  \ console.readLine(\"Please enter your name: \");\n    console.writer().format(\"\
  Hi %s\", name);\n    console.writer().println();\n    console.format(\"What is your\
  \ address? \");\n    String address = console.readLine();\n    char[] password =\
  \ console.readPassword(\"Enter a password \"\n            + \"between %d and %d\
  \ characters: \", 5, 10);\n    char[] verify = console.readPassword(\"Enter the\
  \ password again: \");\n    console.printf(\"Passwords \"\n            + (Arrays.equals(password,\
  \ verify) ? \"match\" : \"do not match\"));\n    console.flush();\n}\n```\n\n假设\
  \ `Console` 可用，输出如下：\n\n```\nPlease enter your name: Max\nHi Max\nWhat is your address?\
  \ Spoonerville\nEnter a password between 5 and 10 characters:\nEnter the password\
  \ again:\nPasswords match\n```\n\n## 使用高级 API\n\n文件、路径、I/O 流：你在这一章中学习了很多内容！在最后部分，我们涵盖了\
  \ I/O 流和 NIO.2 的一些高级特性，这些特性在实践中非常有用——而且偶尔会在考试中出现！\n\n### 操作输入流\n\n所有输入流类都包含以下方法，用于操纵从\
  \ I/O 流中读取数据的顺序：\n\n\n\n\n\n# InputStream 和 Reader\n\n```java\npublic boolean markSupported()\n\
  \npublic void mark(int readLimit)\n\npublic void reset() throws IOException\n\n\
  public long skip(long n) throws IOException\n```\n\n`mark()` 和 `reset()` 方法可以将 I/O\
  \ 流返回到之前的某个位置。在调用这两个方法中的任何之前，你应该先调用 `markSupported()` 方法，只有当支持 `mark()` 时，该方法才会返回\
  \ `true`。`skip()` 方法非常简单；它基本上是从 I/O 流中读取数据并丢弃内容。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n并不是所有的输入流类都支持 `mark()` 和 `reset()`。在调用这些方法之前，请确保在 I/O 流上调用 `markSupported()`，否则将在运行时抛出异常。\n\
  \n## 标记数据\n\n假设我们有一个 `InputStream` 实例，其后续值为 `LION`。考虑以下代码段：\n\n```java\npublic void\
  \ readData(InputStream is) throws IOException {\n    System.out.print((char) is.read());\
  \     // L\n    if (is.markSupported()) {\n        is.mark(100);  // 标记最多 100 字节\n\
  \        System.out.print((char) is.read());  // I\n        System.out.print((char)\
  \ is.read());  // O\n        is.reset();     // 将流重置到 I 之前的位置\n    }\n    System.out.print((char)\
  \ is.read());     // I\n    System.out.print((char) is.read());     // O\n    System.out.print((char)\
  \ is.read());     // N\n}\n```\n\n如果支持 `mark()`，该代码段将输出 `LIOION`，否则输出 `LION`。组织\
  \ `read()` 操作是一个良好的习惯，无论是否支持 `mark()`，都能让 I/O 流停留在相同的位置。\n\n我们传递给 `mark()` 方法的值\
  \ `100` 是什么意思？这个值被称为 `readLimit`。它告诉 I/O 流，我们预计在最多 100 个字节后调用 `reset()`。如果我们的程序在调用\
  \ `mark(100)` 后读取了超过 100 个字节并调用 `reset()`，取决于 I/O 流类，它可能会抛出异常。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n实际上，`mark()` 和 `reset()` 并没有将数据放回 I/O 流，而是将数据存储在内存中的临时缓冲区以便再次读取。因此，你不应该使用过大的值调用\
  \ `mark()` 操作，因为这可能会占用大量内存。\n\n## 跳过数据\n\n假设我们有一个 `InputStream` 实例，其后续值为 `TIGERS`。考虑以下代码段：\n\
  \n```java\nSystem.out.print ((char)is.read()); // T\nis.skip(2);  // 跳过 I 和 G\n\
  is.read();   // 读取 E 但不输出\nSystem.out.print((char)is.read());  // R\nSystem.out.print((char)is.read());\
  \  // S\n```\n\n这段代码在运行时打印 `TRS`。我们跳过了两个字符 `I` 和 `G`。我们还读取了 `E` 但没有在任何地方使用它，它的行为就像调用了\
  \ `skip(1)`。\n\n`skip()` 的返回值告诉我们跳过了多少个值。例如，如果我们接近 I/O 流的末尾并调用 `skip(1000)`，返回值可能是\
  \ `20`，表示在跳过 20 个值后到达 I/O 流的末尾。如果你需要跟踪自己在 I/O 流中的位置以及处理了多少字节，那么使用 `skip()` 的返回值是非常重要的。\n\
  \n## 复习操作 API\n\n表 14.10 复习了这些与操作 I/O 输入流相关的 API。虽然你可能在实践中用过它们，但为了考试你需要了解它们。\n\n\
  表 14.10 常见 I/O 流方法\n\n| 方法名称 | 说明 |\n| --- | --- |\n| boolean `markSupported()`\
  \ | 如果流类支持 `mark()` 则返回 true |\n| void `mark(int readLimit)` | 标记流中的当前位置 |\n| void\
  \ `reset()` | 尝试将流重置到 `mark()` 位置 |\n| long `skip(long n)` | 读取并丢弃指定数量的字符 |\n\n\
  ## 发现文件属性\n\n我们首先介绍读取文件属性的基本方法。这些方法在任何文件系统中都可以使用，尽管它们在某些文件系统中意义可能有限。\n\n### 检查符号链接\n\
  \n早些时候，我们看到 `Files` 类有 `isDirectory()` 和 `isRegularFile()` 方法，它们与 `File` 类上的 `isDirectory()`\
  \ 和 `isFile()` 方法类似。虽然 `File` 对象无法告诉你引用是否为符号链接，但 `Files` 类上的 `isSymbolicLink()`\
  \ 方法可以。\n\n只要链接分别解析为目录或普通文件，`isDirectory()` 或 `isRegularFile()` 就可能返回 `true`。\n\n\
  ```java\nFiles.isDirectory(path)\nFiles.isRegularFile(path)\nFiles.isSymbolicLink(path)\n\
  ```\n\n### 检查文件可访问性\n\n在许多文件系统中，可以设置布尔值来标识隐藏、可读或可执行。`Files` 类包含了 `isHidden()`、`isReadable()`、`isWritable()`\
  \ 和 `isExecutable()`。这里我们展示了每个方法的示例：\n\n```java\nFiles.isHidden(path)\nFiles.isReadable(path)\n\
  Files.isWritable(path)\nFiles.isExecutable(path)\n```\n\n除了 `isHidden()` 方法外，这些方法没有声明任何受检异常，并且在文件不存在时返回\
  \ `false`。\n\n## 改进属性访问\n\n到目前为止，我们通过多次方法调用来访问单个文件属性。虽然这在功能上是正确的，但每次调用这些方法通常会有代价。简单来说，一次性向文件系统获取所有属性要高效得多。此外，某些属性是文件系统特定的，无法简单通用。\n\
  \nNIO.2 通过允许通过单个方法调用构造各种文件系统的视图，解决了这两个问题。\n\n### 理解属性和视图类型\n\nNIO.2 包含了两个单个方法调用处理属性的方法：一个只读属性方法和一个可更新的视图方法。对于每个方法，你都需要提供一个文件系统类型对象，它告诉\
  \ NIO.2 方法你请求的是哪种类型的视图。\n\n\n\n\n\n[表 14.11] 列出了常用的属性和视图类型。对于考试，你只需要了解基本的文件属性类型。其他视图用于管理特定操作系统的信息。\n\
  \n[TABLE 14.11] 属性和视图类型\n\n| 属性接口 | 视图接口 | 描述 |\n| --- | --- | --- |\n| `BasicFileAttributes`\
  \ | `BasicFileAttributeView` | 所有文件系统支持的基础属性集 |\n| `DosFileAttributes` | `DosFileAttributeView`\
  \ | 基础属性集，以及 DOS/Windows 系统支持的属性 |\n| `PosixFileAttributes` | `PosixFileAttributeView`\
  \ | 基础属性集，以及 POSIX 系统（如 Unix、Linux、Mac 等）支持的属性 |\n\n### 获取属性\n\n`Files` 类包含以下方法，以只读方式读取一个类的属性：\n\
  \n```java\npublic static <A extends BasicFileAttributes> A readAttributes(\n   \
  \ Path path,\n    Class<A> type,\n    LinkOption… options) throws IOException\n\
  ```\n\n应用该方法需要指定 `Path` 和 `BasicFileAttributes.class` 参数。\n\n```java\nvar path =\
  \ Path.of(\"/turtles/sea.txt\");\nBasicFileAttributes data = Files.readAttributes(path,\n\
  \    BasicFileAttributes.class);\n\nSystem.out.println(\"Is a directory? \" + data.isDirectory());\n\
  System.out.println(\"Is a regular file? \" + data.isRegularFile());\nSystem.out.println(\"\
  Is a symbolic link? \" + data.isSymbolicLink());\nSystem.out.println(\"Size (in\
  \ bytes): \" + data.size());\nSystem.out.println(\"Last modified: \" + data.lastModifiedTime());\n\
  ```\n\n`BasicFileAttributes` 类包含了许多与 `Files` 类中属性方法同名的值。然而，使用这种方法的优势是，对于某些操作系统，所有属性都是一次性获取的。\n\
  \n### 修改属性\n\n以下 `Files` 方法返回一个可更新的视图：\n\n```java\npublic static <V extends FileAttributeView>\
  \ V getFileAttributeView(\n    Path path,\n    Class<V> type,\n    LinkOption… options)\n\
  ```\n\n我们可以使用这个可更新的视图将文件的最后修改日期/时间增加 10,000 毫秒（即 10 秒）。\n\n```java\n// 读取文件属性\n\
  var path = Path.of(\"/turtles/sea.txt\");\nBasicFileAttributeView view = Files.getFileAttributeView(path,\n\
  \    BasicFileAttributeView.class);\nBasicFileAttributes attributes = view.readAttributes();\n\
  \n// 修改文件最后修改时间\nFileTime lastModifiedTime = FileTime.fromMillis(\n    attributes.lastModifiedTime().toMillis()\
  \ + 10_000);\nview.setTimes(lastModifiedTime, null, null);\n```\n\n获取可更新的视图后，我们需要在视图上调用\
  \ `readAttributes()` 来获取文件元数据。从那里，我们创建一个新的 `FileTime` 值并使用 `setTimes()` 方法将其设置：\n\
  \n```java\n// BasicFileAttributeView 实例方法\npublic void setTimes(FileTime lastModifiedTime,\n\
  \    FileTime lastAccessTime, FileTime createTime)\n```\n\n该方法允许对任何不需要修改的日期/时间值传递\
  \ `null`。在我们的示例代码中，只更改了最后修改日期/时间。\n\n![](img/image_rsrc10B8.jpg)\n\n并不是所有的文件属性都可以通过视图进行修改。例如，你不能设置一个将文件变为目录的属性。同样，你不能在不修改内容的情况下更改对象的大小。\n\
  \n### 遍历目录树\n\n虽然 `Files.list()` 方法很有用，但它只遍历单个目录的内容。如果我们想访问目录树中的所有路径怎么办？在继续之前，我们需要复习一些关于文件系统的基本概念。记住，目录是层次组织的。例如，一个目录可以包含文件和其他目录，而这些目录又可以包含其他文件和目录。文件系统中的每个记录只有一个父目录，根目录除外（它位于一切之上）。\n\
  \n文件系统通常被可视化为一个具有单一根节点以及许多分支和叶子的树。在这个模型中，目录是分支或内部节点，而文件是叶子节点。\n\n文件系统中的常见任务是遍历路径的后代，记录关于它们的信息，或者更常见的是，过滤出特定的特定的文件集。例如，你可能想要搜索一个文件夹并打印所有\
  \ `.java` 文件的列表。此外，文件系统以层次方式存储文件记录。通常来说，如果你想搜索一个文件，必须从父目录开始，读取其子元素，然后读取它们的子元素，以此类推。\n\
  \n遍历目录（也称为遍历目录树）是一个从父目录开始并遍历其所有后代的过程，直到满足某些条件或没有更多可遍历的元素。例如，如果我们正在搜索单个文件，可以在找到该文件或检查了所有文件但一无所获时结束搜索。起始路径通常是一个特定的目录；毕竟，在每次请求时搜索整个文件系统将是非常耗时的！\n\
  \n#### 选择搜索策略\n\n与遍历目录树相关的两种常用策略是：深度优先搜索（depth-first search）和广度优先搜索（breadth-first\
  \ search）。深度优先搜索从根节点到任意叶子遍历结构，然后向根节点导航，并完全遍历它沿途中跳过的任何路径。搜索深度是从根节点到当前节点的距离。为了防止无限搜索，Java\
  \ 包含一个搜索深度，用于限制搜索允许从根节点向下走的多少层（或跳跃数）。\n\n另一种，广度优先搜索从根节点开始，在进入下一个深度层级之前处理每个特定深度的所有元素。结果按深度排序，所有深度\
  \ 1 的节点在所有深度 2 的节点之前被读取，依此类推。虽然广度优先搜索倾向于平衡和可预测，但它也需要更多内存，因为必须维护一个访问过的节点列表。\n\n对于考试，你不需要理解\
  \ Java 采用的每种搜索策略的细节；你只需要知道 NIO.2 Stream API 使用带有深度限制的深度优先搜索，该限制是可以更改的。\n\n#### 遍历目录\n\
  \n背景信息足够了；让我们来看更多 Stream API 方法。`Files` 类包含两个使用深度优先搜索遍历目录树的方法。\n\n```java\npublic\
  \ static Stream<Path> walk(Path start,\n    LinkOption… options) throws IOException\n\
  \npublic static Stream<Path> walk(Path start, int maxDepth,\n    LinkOption… options)\
  \ throws IOException\n```\n\n与其他的流方法一样，`walk()` 使用惰性求值，仅在处理某个 `Path` 时才对其进行评估。这意味着即使目录树包含数百或数千个文件，处理目录树所需的内存也是很小的。第一个\
  \ `walk()` 方法依赖于 `Integer.MAX_VALUE` 的默认最大深度，而重载版本允许用户设置最大深度。这在文件系统可能很大且我们知道正在查找的信息靠近根节点的情况下非常有用。\n\
  \n与其仅仅打印目录树的内容，我们可以再次做一些有趣的事。以下 `getPathSize()` 方法遍历目录树并返回目录中所有文件的总大小：\n\n```java\n\
  private long getSize(Path p) {\n    try {\n        return Files.size(p);\n    }\
  \ catch (IOException e) {\n        throw new UncheckedIOException(e);\n    }\n}\n\
  \npublic long getPathSize(Path source) throws IOException {\n    try (var s = Files.walk(source))\
  \ {\n        return s.parallel()\n            .filter(p -> !Files.isDirectory(p))\n\
  \            .mapToLong(this::getSize)\n            .sum();\n    }\n}\n```\n\n\n\
  \n\n\n我们需要 `getSize()` 辅助方法是因为 `Files.size()` 声明了 `IOException`，而我们不想在 lambda 表达式中使用\
  \ `try/catch` 块。相反，我们将将其封装在非异常类 `UncheckedIOException` 中。我们可以使用 `format()` 方法打印数据：\n\
  \n```java\nvar size = getPathSize(Path.of(\"/fox/data\"));\n\nSystem.out.format(\"\
  Total Size: %.2f megabytes\", (size/1000000.0));\n```\n\n取决于你运行此程序的目录，它将输出如下内容：\n\
  \nTotal Size: 15.30 megabytes\n\n### 应用深度限制\n\n假设我们的目录树非常深，因此通过更改 `getPathSize()`\
  \ 方法中的一行代码来应用深度限制。\n\n```java\ntry (var s = Files.walk(source, 5)) {\n```\n\n这个新版本只会检查起始节点五步之内的文件。深度值\
  \ `0` 表示当前路径本身。由于该方法只对文件计算值，因此当此方法应用于目录树时，你必须将深度限制至少设置为 `1` 才能获得非零结果。\n\n### 避免循环路径\n\
  \n我们早期的许多 NIO.2 方法默认会遍历符号链接，并使用 `NOFOLLOW_LINKS` 来禁用此行为。`walk()` 方法的不同之处在于它默认不跟随符号链接，并且需要启用\
  \ `FOLLOW_LINKS` 选项。我们可以通过添加 `FileVisitOption` 来修改 `getPathSize()` 方法以启用跟随符号链接：\n\
  \n```java\ntry (var s = Files.walk(source,\n             FileVisitOption.FOLLOW_LINKS))\
  \ {\n```\n\n在遍历目录树时，如果启用了符号链接，你的程序需要小心。例如，如果我们的进程遇到指向文件系统根目录的符号链接，系统中的每个文件将被搜索！\n\
  \n更糟糕，符号链接可能会导致循环，路径被反复访问。循环是一种无限的循环依赖，其中目录树中的一个项指向其一个祖先目录。假设我们有一个如图 14.6 所示的目录树，符号链接\
  \ `/birds/robin/allBirds` 指向 `/birds`。\n\n![一个带有循环的文件系统层级图。鸟是一个根目录，它的元素是 robin、pictures\
  \ 和 all birds。pictures 的相对路径是 nest.png 和 wings.gif。从 all birds 的循环虚线指向 birds 以进一步的路径。robin\
  \ 元素标记有表示开始的箭头。](img/image_rsrc10EG.jpg)\n\n图 14.6 带有循环的文件系统\n\n如果我们尝试从 `/birds/robin`\
  \ 开始遍历此树并跟随所有的符号链接会发生什么？表 14.12 显示了遍历深度 3 后访问的路径。为了简单起见，我们以广度优先顺序遍历树，尽管无论使用何种搜索策略都会发生循环。\n\
  \n表 14.12 使用广度优先遍历带有循环的目录\n\n| 深度 | 达到的路径 |\n| --- | --- |\n| 0 | /birds/robin |\n\
  | 1 | /birds/robin/pictures |\n| 1 | /birds/robin/allBirds ➢ /birds |\n| 2 | /birds/robin/pictures/nest.png\
  \ |\n| 2 | /birds/robin/pictures/wings.gif |\n| 2 | /birds/robin/allBirds/robin\
  \ ➢ /birds/robin |\n| 3 | /birds/robin/allBirds/robin/pictures ➢ /birds/robin/pictures\
  \ |\n| 3 | /birds/robin/allBirds/robin/allBirds ➢ /birds |\n\n从开始处移动距离 `1` 后，我们遇到了符号链接\
  \ `/birds/robin/allBirds` 并回到了目录树的顶部 `/birds`。这没关系，因为我们还没有访问过 `/birds`，所以还没有循环！\n\
  \n遗憾的是，在深度 `2` 处，我们遇到了循环。我们在第一步已经访问了 `/birds/robin` 目录，现在又遇到了它。如果进程继续，我们将注定反复访问该目录。\n\
  \n请注意，当使用 `FOLLOW_LINKS` 选项时，`walk()` 方法将跟踪它访问过的所有路径，如果路径被访问两次，将抛出 `FileSystemLoopException`。\n\
  \n### 搜索目录\n\n在在上一个示例中，我们对 `Stream<Path>` 对象应用过滤器来过滤结果，尽管有一个更方便的方法。\n\n```java\n\
  public static Stream<Path> find(Path start,\n    int maxDepth,\n    BiPredicate<Path,\
  \ BasicFileAttributes> matcher,\n    FileVisitOption… options) throws IOException\n\
  ```\n\n`find()` 方法的行为与 `walk()` 方法类似，但它接受一个 `BiPredicate` 来过滤数据。它还需要设置深度限制。像 `walk()`\
  \ 一样，`find()` 也支持 `FOLLOW_LINK` 选项。\n\n`BiPredicate` 的两个参数是 `Path` 对象和 `BasicFileAttributes`\
  \ 对象，你之前在章节中看到过它们。通过这种方式，Java 自动为你检索基本文件信息，允许你编写直接访问该对象的 lambda 表达式。以下代码说明这一点：\n\
  \n```java\nvar path = Path.of(\"/big\");\nlong minSize = 1000;\ntry (var s = Files.find(path,\
  \ 10,\n    a -> a.isRegularFile() &&\n    a.toString().endsWith(\".java\") &&\n\
  \    a.size() > minSize)) {\n    s.forEach(System.out::println);\n}\n```\n\n此示例搜索目录并打印大小至少为\
  \ `1000` 字节的 `.java` 文件，深度限制为 `10`。\n\n### 使用 DirectoryStream\n\n获取目录内容的旧方法是使用 `DirectoryStream`。以下代码获取目录中以\
  \ `.txt` 或 `.java` 结尾的文件。\n\n```java\ntry (DirectoryStream<Path> dirStream = Files.newDirectoryStream(path,\
  \ \"*.{txt,java}\")) {\n    for (Path entry:dirStream)\n        System.out.println(entry);\n\
  }\n```\n\n在新代码中使用 `Files.find()` 更好，但在考试中可能会看到任何方法。\n\n## API 复习\n\n表 14.13 列出了考试需要的关键\
  \ API。我们知道某些类看起来相似。在考试之前，你需要熟悉这张表。\n\n| 类 | 目的 |\n| --- | --- |\n| File | 文件系统中的\
  \ I/O 表示 |\n| Files | 用于操作 Path 的辅助方法 |\n| Path | 文件系统中的 NIO.2 表示 |\n| Paths | 包含获取\
  \ Path 的工厂方法 |\n| InputStream | 基于字节读取文件的超类 |\n| OutputStream | 基于字节写入文件的超类 |\n\
  | Reader | 基于字符读取文件的超类 |\n| Writer | 基于字符写入文件的超类 |\n\n此外，图 14.7 显示了你应该熟悉的所有 I/O\
  \ 流类，过滤器流除外。`FilterInputStream` 和 `FilterOutputStream` 是过滤或转换数据的高级超类。很少直接使用它们。\n\
  \n`InputStreamReader` 和 `OutputStreamWriter` 非常方便，它们也是唯一的，即名称中同时包含 `InputStream/OutputStream`\
  \ 和 `Reader/Writer` 的 I/O 流类。\n\n\n\n\n\n本章完全关于数据的读取和写入。我们首先向您展示了如何从 `I/O` 创建 `File`，以及从\
  \ `NIO.2` 创建 `Path`。然后，在介绍 `NIO.2` 特有的 API 之前，我们涵盖了适用于 `I/O` 和 `NIO.2` 的功能。您应该熟悉如何将\
  \ `Path` 对象与其他 `Path` 对象结合或解析。此外，`NIO.2` 还包含了 `Stream` API 方法，可用于处理文件和目录。我们讨论了列出目录、遍历目录树、搜索目录树以及读取文件行的方法。\n\
  \n我们花时间回顾了 `Files` 辅助类中提供的各种方法。正如所讨论的，函数的名称通常会准确地告诉它的功能。我们解释了这些方法中的大多数都能够抛出 `IOException`，并且许多方法接受可选的可变参数枚举值。\n\
  \n随后我们介绍了 `I/O` 流，并解释了如何使用它们来读取或写入大量数据。虽然有很多 `I/O` 流，但它们在一些关键点上有所不同：\n\n* 字节流与字符流\n\
  * 输入流与输出流\n* 低层流与高层流\n\n通常，`I/O` 流的名称可以告诉您很多关于它的功能信息。我们访问了考试所需的许多 `I/O` 流类，并按复杂度递增顺序排列。一种常见的做法是从低层资源或文件流开始，将其封装在缓冲\
  \ `I/O` 流中以提高性能。您也可以应用高层流来处理数据，例如对象流或打印流。我们描述了在 `Java` 中可序列化（serializable）的含义，并向您展示了如何使用对象流类直接从磁盘向或向磁盘持久化对象。\n\
  \n我们解释了如何使用系统流对象和 `Console` 类从用户处读取输入数据。`Console` 类具有许多有用功能，例如对密码和格式化的内置支持。\n\n\
  我们还讨论了 `NIO.2` 如何提供读取和写入文件元数据的方法。`NIO.2` 包含了两个方法，可以在单个调用中检索 `path` 的所有文件系统属性，而无需多次与操作系统往返。其中一个方法返回只读属性类型，而第二个方法返回一个可更新的视图类型。它还允许\
  \ `NIO.2` 支持特定操作系统的文件属性。\n\n## 考试要点\n\n### 理解文件和目录\n`Files` 是存储在持久化存储设备（如硬盘驱动器）中的数据记录，在应用程序执行完毕后可用。文件在文件系统中以目录的形式组织，目录又可能包含其他目录。根目录是文件系统中的顶层目录。\n\
  \n### 能够使用 `File` 和 `Path`\n`I/O` `File` 实例是通过调用构造函数创建的。它包含许多用于创建和操作文件或目录的实例方法。`NIO.2`\
  \ `Path` 实例是通过工厂方法 `Path.of()` 创建的不变对象。`Path` 接口包含了许多用于读取和操作路径值的实例方法。\n\n### 区分不同类型的\
  \ `I/O` 流\n`I/O` 流按字节/字符、输入/输出以及低层/高层进行分类。字节流在二进制数据上操作，名称以 `Stream` 结尾；而字符流在文本数据上操作，名称以\
  \ `Reader` 或 `Writer` 结尾。`InputStream` 和 `Reader` 类是接收数据的顶层抽象类，而 `OutputStream`\
  \ 和 `Writer` 类是发送数据的顶层抽象类。低层流是指直接在底层资源（如文件或网络连接）上操作的流。高层流在低层流或其他高层流上操作，以过滤数据、转换数据或提高性能。\n\
  \n### 理解如何使用 Java 序列化\n如果一个类实现了 `java.io.Serializable` 接口，并且包含可序列化或标记为 `transient`\
  \ 的实例成员，则该类被认为是可序列化的。所有的 Java 原生类型和 `String` 类都是序列化的。`ObjectInputStream` 和 `ObjectOutputStream`\
  \ 类可以分别从 `I/O` 流读取和写入 `Serializable` 对象。\n\n### 能够与用户交互\n能够使用系统流（`System.out`、`System.err`\
  \ 和 `System.in`）以及 `Console` 类与用户交互。`Console` 类包含了用于格式化数据和检索复杂输入（如密码）的特殊方法。\n\n\
  ### 管理文件属性\n`NIO.2` `Files` 类包含了许多读取单个文件属性的方法，例如其大小或它是否为目录、符号链接、隐藏等。`NIO.2` 还支持在单个调用中读取所有属性。属性类型用于支持特定操作系统的视图。最后，`NIO.2`\
  \ 支持用于修改所选属性的可更新视图。\n\n## 复习题\n\n本章复习题的答案可以在附录中找到。\n\n1. 使用哪个类最适合将二进制文件读取到 Java\
