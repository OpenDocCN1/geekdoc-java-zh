  \ `Crate` 中。\n\n如果你想不出你自己的泛型类的用途，请不要担心。除非你正在为他人编写可供其复用的库，泛型几乎不会出现在你编写的类定义中。你已经在你调用的代码中频繁看到它们了，例如函数式接口和集合。\n\
