  \ 章\n\n## 异常与本地化\n\n本章涵盖的 OCP 考试目标：\n\n* 处理异常\n    * 使用 `try/catch/finally`、`try-with-resources`\
  \ 和 `multi-catch` 块处理异常，包括自定义异常。\n* 实现本地化\n    * 使用区域设置（locales）和资源包（resource bundles）实现本地化。解析和格式化消息、日期、时间和数字，包括货币和百分比值。\n\
  \n本章介绍创建能够适应变化的应用程序。如果用户在网页上输入了无效数据会怎样？如果我们在销售过程中与数据库的连接中断了怎么办？最后，我们如何构建能够支持多种语言或地理地区的应用程序？\n\
  \n在本章中，我们将讨论这些问题以及使用异常、格式化和本地化来解决它们。确保你的应用程序响应变化的一种方法是尽早建立支持。例如，支持本地化并不意味着你实际上立即需要支持特定的语言。它意味着你的应用程序在未来可以更更容易地适应。到本章结束时，我们希望为设计能够更好地适应变化的应用程序提供结构支持。\n\
  \n## 理解异常\n\n程序可能会因为几乎任何原因而失败。以下只是几种可能性：\n\n* 代码尝试连接到某个网站，但互联网连接断开了。\n* 你犯了编码错误，并尝试访问数组中的一个无效索引。\n\
  * 一个方法用该方法不支持的值调用了另一个方法。\n\n如你所见，其中一些是编码错误。另一些完全不受你的控制。如果互联网连接中断，你的程序也无能为力。它能做的是处理这种情况。\n\
  \n### 异常的作用\n\n异常（exception）是 Java 表达：“我放弃了。我现在不知道该做什么。你来处理吧。”当你编写一个方法时，你可以处理该异常，也可以将其问题留给调用者代码。\n\
  \n例如，把 Java 想象成一个去动物园的孩子。快乐路径（happy path）是没有任何事情出错的情况。孩子继续观察动物，直到程序顺利结束。什么都没有发生，也没有需要处理的异常。\n\
  \n这个孩子的妹妹就没有经历过快乐路径。在所有的兴奋中，她绊倒并摔了一跤。幸运的是，这不是一次严重的摔倒。小女孩站起来继续看更多的动物。她自己处理了这个问题。不幸的是，她在当天稍晚些时候又摔倒了，并开始哭泣。这一次，她通过哭泣宣布她需要帮助。故事有一个好的结局。她的爸爸揉了揉她的膝盖并给了她一个拥抱。然后他们回去继续看更多的动物，享受这一天的剩余部分。\n\
  \n这些是 Java 在处理异常时使用的两种方法。一个方法可以自己处理异常情况，也可以将其归为调用者的责任。\n\n### ![](img/image_rsrc10BB.jpg)\
  \ 现实世界场景\n\n### 返回码 vs 异常\n\n当“发生某些错误”时，使用异常。然而，“错误”这个词是主观的。如果未找到匹配项，以下代码将返回 -1\
  \ 而不是抛出异常：\n\n```java\npublic int indexOf(String[] names, String name) {\n    for\
  \ (int i = 0; i < names.length; i++) {\n        if (names[i].equals(name)) { return\
  \ i; }\n    }\n    return -1;\n}\n```\n\n虽然对于搜索等某些任务很常见，但通常应该避免使用返回码。毕竟，Java 提供了一个异常框架，所以你应该使用它！\n\
  \n### 理解异常类型\n\n异常是一个改变程序流的事件。Java 为所有对象都提供了 `Throwable`。并不是所有对象的名称中都包含 exception\
  \ 词样，这可能会引起困惑。`图 11.1` 显示了 `Throwable` 的子类。\n\n![异常的流程图。有四个类：java.lang.throwable,\
  \ java.lang.exception, java.lang.error, 和 java.runtime.](img/rsrc10BB.jpg) `java.lang.throwable`,\
  \ `java.lang.exception`, `java.lang.error`, 以及 `java.runtime`。\n\n#### 检异常 (Checked\
  \ Exceptions)\n\n检异常是必须声明或处理的异常。在 Java 中，检异常继承自 `Exception` 但不是 `RuntimeException`。例如，尝试读取一个不存在的文件。\n\
  \n![](img/image_rsrc10B8.jpg) 检异常还任何继承 `Throwable` 但不是 `Error` 或 `RuntimeException`\
  \ 的类，例如直接扩展 `Throwable` 的类。对于考试，你只需要了解扩展 `Exception` 的检异常。\n\n检异常？我们在检查什么？Java 有规则规则“处理或声明”（handle\
  \ or declare）。处理或声明规则意味着方法内部抛出的所有检异常要么封装在 `try`/`catch` 块中，要么在方法签名中声明。\n\n由于检异常通常是可以预期的，Java\
  \ 强制程序员必须做某些事情来显示考虑过该异常。也许在方法中被处理了。也许方法声明无法处理，应该由其他人处理。\n\n让我们来看例子。以下 `fall()` 方法声明它可能会抛出\
  \ `IOException`，这是一个检异常：\n\n```java\nvoid fall(int distance) throws IOException\
  \ {\n    if(distance> 10) {\n        throw new IOException();\n    }\n}\n```\n\n\
  注意你这里使用了两个不同的关键字。`throw` 关键字告诉 Java 你抛出一个 `Exception`，而 `throws` 关键字只是声明该方法可能会抛出一个\
  \ `Exception`。它也可能不抛出。\n\n现在你知道如何声明异常，如何处理它呢？以下 `fall()` 方法的替代版本处理了异常：\n\n```java\n\
  void fall(int distance) {\n    try {\n        if(distance> 10) {\n            throw\
  \ new IOException();\n        }\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n}\n```\n\n注意 `catch` 语句使用的是 `Exception`而不是 `IOException`。由于 `IOException`\
  \ 是 `Exception` 的子类，因此 `catch` 块允许捕获它。我们将在本章稍后部分详细介绍 `try` 和 `catch` 块。\n\n####\
  \ 非检异常 (Unchecked Exceptions)\n\n\n\n\n\n未检查异常（Unchecked exception）是指任何不需要在抛出的应用程序代码中声明或处理的异常。未检查异常通常被称为运行时异常（runtime\
  \ exceptions），尽管在 Java 中，未检查异常包括继承 `RuntimeException` 或 `Error` 的类。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n处理或声明未检查异常是允许的。尽管如此，在 Javadoc 注释中记录调用者应该知道的未检查异常，比直接声明一个未检查异常要好。\n\n运行时异常定义为 `RuntimeException`\
  \ 类及其子类。运行时异常往往是意料之外的，但不一定是致命的。例如，访问无效的数组索引是意料之外。尽管它们继承了 `Exception` 类，但它们并不是检查异常（checked\
  \ exceptions）。\n\n未检查异常可能发生在代码的任何某行，因为它不需要被处理或声明。例如，如果输入引用为 `null`，则可以在以下方法的体中抛出\
  \ `NullPointerException`：\n\n```java\nvoid fall(String input) {\n    System.out.println(input.toLowerCase());\n\
  }\n```\n\n我们在 Java 中频繁地处理对象，以至于 `NullPointerException` 几乎可能发生在任何地方。如果你必须在每个地方声明未检查异常，那么每个方法都会变得杂乱！记住，如果你声明了冗余的未检查异常，代码仍然可以编译。\n\
  \n### Error 和 Throwable\n\n`Error` 意味着发生了极其严重的错误，以至于你的程序不应该尝试从中恢复。例如，磁盘驱动器“消失”或程序内存耗尽。这些是你不太可能遇到且无法恢复的异常状况。\n\
  \n对于考试，你唯一需要了解关于 `Throwable` 的点是它是所有异常的父类，包括 `Error` 类。虽然你可以处理 `Throwable` 和 `Error`\
  \ 异常，但不建议在应用程序代码中这样做。当我们在本章中提到异常时，通常指的是任何继承自 `Throwable` 的类，尽管我们几乎总是在处理 `Exception`\
  \ 类或其子类。\n\n### 审查异常类型\n\n请务必仔细学习 表 11.1 中的所有内容。对于考试，请记住 `Throwable` 要么是 `Exception`，要么是\
  \ `Error`。你不应该在代码中直接捕获 `Throwable`。\n\nTABLE 11.1 异常和错误的类型\n\n| 类型 | 如何识别 | 程序可以捕获吗？\
  \ | 程序需要处理或声明吗？ |\n\n| --- | --- | --- | --- |\n| 未检查异常 | `RuntimeException` 的子类\
  \ | 是 | 否 |\n| 检查异常 | `Exception` 的子类但不是 RuntimeException 的子类 | 是 | 是 |\n| Error\
  \ | `Error` 的子类 | 否 | 否 |\n\n### 抛出异常\n\n任何 Java 代码都可以抛出异常；包括你编写的代码。Java 提供了一些异常。你可能会遇到一个为了考试而虚的异常。这没关系。题目会通过类名以\
  \ `Exception` 结尾来让你明显看出这是一个异常。例如，`MyMadeUpException` 显然是一个异常。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n在 Java 中，异常类以 `Exception` 单词结尾是常见做法，但并不是强制要求的。尽管在创建自己的异常类时，你应该遵循这一惯例！\n\n在考试中，你会看到两种导致异常的代码类型。第一种是错误的代码。这里有一个例子：\n\
  \n```java\nString[] animals = new String[0];\nSystem.out.println(animals[0]); //\
  \ ArrayIndexOutOfBoundsException\n```\n\n这段代码会抛出 `ArrayIndexOutOfBoundsException`，因为数组没有元素。这意味着关于异常的问题可能隐藏在看似是关于其他内容的问题中。\n\
  \n![](img/image_rsrc10B8.jpg)\n\n在考试中，有些题目会有关于“无法编译”和“抛出异常”的选择。特别注意调用 `null` 引用上的方法，或引用无效数组或\
  \ `List` 索引的代码。如果你发现了这一点，你就知道正确答案是代码在运行时抛出了异常。\n\n代码导致异常的另一种方法是显式请求 Java 抛出一个异常。Java\
  \ 允许你编写这样的语句：\n\n```java\nthrow new Exception();\nthrow new Exception(\"Ow! I fell.\"\
  );\nthrow new RuntimeException();\nthrow new RuntimeException(\"Ow! I fell.\");\n\
  ```\n\n`throw` 关键字告诉 Java 你想让代码的其他部分来处理该异常。这就像小女孩哭着找爸爸一样。需要其他人来想如何处理这个异常。\n\n###\
  \ throw vs. throws\n\n在考试中任何当你看到 `throw` 或 `throws` 时，请确保使用的是正确的一个。`throw` 关键字作为代码块内部语句使用，用于抛出新异常或重新抛出现有异常；而\
  \ `throws` 关键字仅用于方法声明的末尾，指示它支持哪些异常。\n\n在创建异常时，通常可以传递一个带有消息的 `String` 参数，也可以不传递任何参数并使用默认值。我们说“通常”是因为这是一种惯例。有人声明了接收\
  \ `String` 的构造函数。别人也可以创建一个不具有接收消息的构造函数的异常类。\n\n此外，你应该知道 `Exception` 是一个 `Object`。这意味着你可以将其存储在对象引用中，这是合法的：\n\
  \n```java\nvar e = new RuntimeException();\nthrow e;\n```\n\n代码在某一行实例化异常，然后在在另一行将其抛出。异常可以来自任何地方，甚至可以被传递到方法中。只要它是有效的异常，就可以被抛出。\n\
  \n考试还可能尝试欺骗你。你看到为什么这段代码无法编译了吗？\n\n```java\nthrow RuntimeException(); // 无法编译\n```\n\
  如果你的答案是缺少 `new` 关键字，你是对的。异常从未被实例化。\n\n让我们看看考试可能尝试欺骗你的另一个地方。你能看到为什么以下代码无法编译吗？\n\n\
  ```java\ntry {\n    throw new RuntimeException();\n    throw new ArrayIndexOutOfBoundsException();\
  \ // 不可达的代码\n} catch (Exception e) {}\n```\n由于第一行抛出了异常，第二行无法到达。编译器识别出这一点并报告不可达的代码。\n\
  \n### 调用抛出异常的方法\n\n当你调用一个抛出异常的方法时，规则与在方法内部处理异常相同。你看到为什么以下代码无法编译了吗？\n\n```java\n\
  class NoMoreCarrotsException extends Exception {}\npublic class Bunny {\n    private\
  \ void eatCarrot() throws NoMoreCarrotsException {}\n    public void hopAround()\
  \ {\n        eatCarrot(); // 无法编译\n    }\n}\n```\n\n问题是 `NoMoreCarrotsException`\
  \ 是检查异常。检查异常必须被处理或声明。如果你将 `hopAround()` 方法改为以下任一，代码就可以编译：\n\n选项 1：\n```java\npublic\
  \ void hopAround() throws NoMoreCarrotsException {\n    eatCarrot();\n}\n```\n\n\
  选项 2：\n```java\npublic void hopAround() {\n    try {\n        eatCarrot();\n   \
  \ } catch (NoMoreCarrotsException e) {\n        System.out.print(\"sad rabbit\"\
  );\n    }\n}\n```\n\n你可能注意到 `eatCarrot()` 并没有抛出异常；它只是声明了可能会抛出。这足以让编译器要求调用者处理或声明该异常。\n\
  \n编译器仍然在寻找不可达的代码。声明一个未使用的异常并不被视为不可达的代码。它为该方法提供了未来更改实现以抛出该异常的可能性。你看到这里的问题了吗？\n\n\
  ```java\npublic class Bunny {\n    private void eatCarrot() {}\n    public void\
  \ bad() {\n        try {\n            eatCarrot();\n        } catch (NoMoreCarrotsException\
  \ e) { // 无法编译\n            System.out.print(\"sad rabbit\");\n        }\n    }\n\
  }\n```\n\n\n\n\n\nJava 知晓 `eatCarrot()` 不能抛出受检异常（checked exception），这意味着 `bad()`\
  \ 方法中的 `catch` 块无法被访问。\n\n![](img/image_rsrc10B8.jpg)\n\n当你在考试中看到 `catch` 块内部声明受检异常时，请确保相关\
  \ `try` 块中的代码能够抛出该异常或其异常子类。否则，该代码是不可达的且无法编译。记住，这条规则不适用于未受检异常（unchecked exceptions）或在方法签名中声明的异常。\n\
  \n### 带有异常的方法重写\n\n我们在第 6 章“类设计”中引入重写方法时，包含了一条与异常相关的规则。重写的方法不能声明比其继承的方法任何新的或更宽的受检异常。例如，以下代码是不允许的：\n\
  \n```java\nclass CanNotHopException extends Exception {}\n\nclass Hopper {\n   \
  \ public void hop() {}\n}\n\npublic class Bunny extends Hopper {\n    public void\
  \ hop() throws CanNotHopException {}  // 编译\n}\n```\n\nJava 知晓 `hop()` 不允许抛出任何受检异常，因为父类\
  \ `Hopper` 中的 `hop()` 方法没有声明任何异常。想象一下如果子类的方法可以添加受检异常会发生什么——你可能会编写调用 `Hopper` 的 `hop()`\
  \ 方法的代码却而不处理任何异常。那么，如果用 `Bunny` 替它，代码将不知道如何处理或声明 `CanNotHopException`。\n\n子类中的重写方法允许声明比父类或接口少的异常。这是合法的，因为调用者已经在处理它们了。\n\
  \n```java\nclass Hopper {\n    public void hop() throws CanNotHopException {}\n\
  }\n\npublic class Bunny extends Hopper {\n    public void hop() {}  // 这是没问题的\n\
  }\n```\n\n重写方法未声明父方法抛出的异常之一，这类似于方法声明它会抛出一个它实际上从未抛出的异常。这是完全合法的。同样，一个类被允许声明一个异常类型的子类。道理是相同的：父类或接口已经处理了更宽的类型。\n\
  \n### 打印异常\n\n打印异常有三种方法。你可以让 Java 打印它、只打印消息，或者打印堆栈跟踪（stack trace）的来源。这个示例展示了所有的方法：\n\
  \n```java\n5:  public static void main(String[] args) {\n6:      try {\n7:     \
  \     hop();\n8:      } catch (Exception e) {\n9:          System.out.println(e\
  \ + \"\\n\");\n10:         System.out.println(e.getMessage()+ \"\\n\");\n11:   \
  \      e.printStackTrace();\n12:     }\n13: }\n14: private static void hop() {\n\
  15:     throw new RuntimeException(\"cannot hop\");\n16: }\n```\n\n这段代码输出了以下内容：\n\
  \n```text\njava.lang.RuntimeException: cannot hop\ncannot hop\njava.lang.RuntimeException:\
  \ cannot hop\n    at Handling.hop(Handling.java:15)\n    at Handling.main(Handling.java:7)\n\
  ```\n\n第一行显示 Java 默认打印的内容：异常类型和消息。第二行只显示消息。其余部分显示堆栈跟踪。堆栈跟踪通常有用，因为它显示了到达抛出异常行时所执行的方法调用层次结构。\n\
  \n### 识别异常类\n\n你需要在考试中识别三组异常类：`RuntimeException`、受检异常（checked Exception）和 `Error`。我们来看每种类型的常见示例。对于考试，你需要识别它属于哪种类型的异常，以及它是由\
  \ Java 虚拟机 (JVM) 还是程序员抛出的。对于某些异常，你还需要知道哪些异常是相互继承的。\n\n### RuntimeException 类\n\n\
  `RuntimeException` 及其子类是未受检异常，不需要被处理或声明。它们可以由程序员或 JVM 抛出。常见的未受检异常类列表 11.2 中。\n\n\
  表 11.2 未受检异常\n\n| 未受检异常 | 描述 |\n| --- | --- |\n| ArithmeticException | 代码尝试除以 0\
  \ 时抛出。 |\n| ArrayIndexOutOfBoundsException | 代码使用非法索引访问数组时抛出。 |\n| ClassCastException\
  \ | 尝试将对象转换为其不是实例的类时抛出。 |\n| NullPointerException | 在需要对象的地方存在 null 引用时抛出。 |\n|\
  \ IllegalArgumentException | 由程序员抛出，表示方法传递了非法或不适当的参数。 |\n| NumberFormatException\
  \ | `IllegalArgumentException` 的子类。尝试将 String 转换为数值类型但 String 没有适当格式时抛出。 |\n\n####\
  \ ArithmeticException\n\n尝试将 int 除以 0 会得到未定义的结果。当这种情况发生时，JVM 将抛出 `ArithmeticException`。\n\
  \n```java\nint answer = 11 / 0;\n```\n\n运行这段代码得到以下输出：\n\n```text\nException in thread\
  \ \"main\" java.lang.ArithmeticException: / zero\n```\n\n`Exception in thread \"\
  main\" java.lang.ArithmeticException: / zero`\nJava 不会详细说明。没关系，因为我们知道 `/` 是运算符。线程\
  \ \"main\" 正在告诉你发生了除法。\n\n#### ArrayIndexOutOfBoundsException\n\n你现在知道数组索引从 0 开始，到数组长度减一——这意味着这段代码将抛出\
  \ `ArrayIndexOutOfBoundsException`。\n\n```java\nint[] countsMoose = new int[3];\n\
  System.out.println(countsMoose[-1]);\n```\n\n由于没有这样的索引，这是一个问题。运行这段代码得到：\n\n```text\n\
  Exception in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: -1 of bounds\
  \ for length 3\n```\n\n#### ClassCastException\n\nJava 尝试保护你不进行可能的转换。这段代码无法编译，因为\
  \ `Integer` 不是 `String` 的子类：\n\n```java\nString type = \"moose\";\nInteger number\
  \ = (Integer) type;\n```\n\n更复杂的代码破坏了 Java 的保护尝试。当转换在运行时失败时，Java 将抛出 `ClassCastException`。\n\
  \n```java\nString type = \"moose\";\nObject obj = type;\nInteger number = (Integer)\
  \ obj; // 编译器看到了从 `Object` 到 `Integer` 的转换\n\n#### NullPointerException\n\n实例变量和方法必须在非空引用上调用。如果引用为\
  \ null，JVM 将抛出 `NullPointerException`。\n\n```java\npublic class Frog {\n    static\
  \ String name;\n    public void hop() {\n        System.out.print(name.toLowerCase()\
  \ + \" is hopping\");\n    }\n    public static void main(String[] args) {\n   \
  \     new Frog().hop();\n    }\n}\n```\n\n记得第 5 章“方法”，静态变量被初始化为 null。运行这段代码得到以下输出：\n\
  \n```text\nException in thread \"main\" java.lang.NullPointerException: Cannot invoke\
  \ \"String.toLowerCase()\" because \"Frog.name\" is null\n```\n\n注意到这个输出的特殊之处了吗？Java\
  \ 包含一项名为“帮助性空指针异常”的功能，其中 JVM 会告诉你触发 `NullPointerException` 的对象引用。\n\n在实例变量和静态变量上，JVM\
  \ 将以我们刚刚看到的漂亮、易读的格式告诉你变量名。在局部变量（包括方法参数）上，它并不友好。让我们尝试一个示例：\n\n```java\npublic class\
  \ Frog {\n    public void hop(String name) {\n        System.out.print(name.toLowerCase()\
  \ + \" is hopping\");\n    }\n}\n```\n\n\n\n\n```java\npublic static void main(String[]\
  \ args) {\n    new Frog().hop(null);\n}\n```\n\n该程序打印以下内容：\n\n```\nException in\
  \ thread \"main\" java.lang.NullPointerException:\n    Cannot invoke \"String.toLowerCase()\"\
  \ because \"<parameter1>\" is null\n```\n\n等等，`<parameter1>` 是什么？在方法参数上，它打印 `<parameterX>`，而在局部变量上，它打印\
  \ `<localX>`，其中 X 是变量在方法中出现的顺序。之所以出现这种情况，是因为变量名在代码编译时就丢失了。\n\n这没什么帮助，对吧？别担心，有解决方法！如果使用\
  \ `-g:vars` 参数编译该类，那么代码将在运行时将打印变量名：\n\n```\njavac -g:vars Frog.java\njava Frog\n\
  ```\n\n这是一个调试参数，旨在在代码行为出现异常时提供额外信息。这段代码现在在运行时会打印以下内容：\n\n```\nException in thread\
  \ \"main\" java.lang.NullPointerException:\n    Cannot invoke \"String.toLowerCase()\"\
  \ because \"name\" is null\n```\n\n记住，该参数仅适用于局部变量和方法参数，并且必须在代码编译时使用。\n\n![](img/image_rsrc10B.jpg)\n\
  \n#### `IllegalArgumentException`\n\n`IllegalArgumentException` 是你的程序保护自身的一种方式。你想告诉调用者某些出了问题——最好是以一种显而易见的方式让调用者无法忽略，这样程序员就会修复问题。看到代码以异常结束是一个关于出现问题的很好的提醒。当它被调用为\
  \ `setNumberEggs(-2)` 时，考虑这个示例：\n\n```java\npublic void setNumberEggs(int numberEggs)\
  \ {\n    if (numberEggs < 0)\n        throw new IllegalArgumentException(\"# eggs\
  \ must not be negative\");\n    this.numberEggs = numberEggs;\n}\n```\n\n当程序对参数值不满意时，它会抛出一个异常。输出如下：\n\
  \n```\nException in thread \"main\" java.lang.IllegalArgumentException:\n    # eggs\
  \ must not be negative\n```\n\n显然，如果程序员想让程序执行任何有用的操作，这就是一个必须修复的问题。\n\n#### `NumberFormatException`\n\
  \nJava 提供了将字符串转换为数字的方法。当向这些方法传递无效值时，它们会抛出 `NumberFormatException`。其思想与 `IllegalArgumentException`\
  \ 类似。由于这是一个常见问题，Java 给它一个单独的类。事实上，`NumberFormatException` 是 `IllegalArgumentException`\
  \ 的子类。这里有一个尝试将非数字内容转换为 `int` 的示例：\n\n```java\nInteger.parseInt(\"abc\");\n```\n\n\
  输出如下：\n\n```\nException in thread \"main\" java.lang.NumberFormatException:\n  \
  \  For input string: \"abc\"\n```\n\n对于考试，你需要知道 `NumberFormatException` 是 `IllegalArgumentException`\
  \ 的子类。我们将在章节的后面介绍更多关于为什么这很重要。\n\n### 检查异常类 (Checked Exception Classes)\n\n检查异常的层次结构中包含\
  \ `Exception`但不包含 `RuntimeException`。它们必须被处理或声明。常见的检查异常列在 表 11.3。\n\nTABLE 11.3\
  \ 检查异常\n\n| 检查异常 |  |\n| --- | --- |\n| `FileNotFoundException` | `IOException`\
  \ 的子类。当代码尝试引用不存在的文件时，程序化抛出。 |\n| `IOException` | 当读取或写入文件出现问题时，程序化抛出。 |\n| `NotSerializableException`\
  \ | `IOException` 的子类。当尝试序列化或反序列化不可序列类时，程序化抛出。 |\n| `ParseException` | 表示解析输入出现问题。\
  \ |\n\n对于考试，你需要知道这些都是必须处理或声明的检查异常。你还需要知道 `FileNotFoundException` 和 `NotSerializableException`\
  \ 是 `IOException` 的子类。你将在本章后面的部分看到 `ParseException`，另外三个类则在 第 14 章 “I/O”。\n\n###\
  \ 错误类 (Error Classes)\n\n错误是扩展 `Error` 类的未检查异常。它们由 JVM 抛出，不应被处理或声明。错误非常罕见，但你可能会看到表\
  \ 11.4 中列出的。\n\nTABLE 11.4 错误\n\n| 错误 |  |\n| --- | --- |\n| `ExceptionInInitializerError`\
  \ | 当静态初始化器抛出异常且未处理时抛出 |\n| `StackOverflowError` | 当方法调用自身次数过多时抛出（称为无限递归，因为方法通常无休止地调用自身）\
  \ |\n| `NoClassDefFoundError` | 当代码使用的类在编译时可用但在运行时不可时抛出 |\n\n对于考试，你只需要知道这些错误是未检查的，并且代码通常无法从从中恢复。\n\
  \n## 处理异常 (Handling Exceptions)\n\n当你遇到异常时该怎么办？你如何处理或从异常中恢复？在本节中，我们将展示 Java 中支持处理异常的语句。\n\
  \n### 使用 `try` 和 `catch` 语句\n\n既然你已经知道异常是什么，让我们探索如何处理它们。Java 使用 `try` 语句将可能抛出异常的逻辑与处理该异常的逻辑分开。图\
  \ 11.2 显示了 `try` 语句的语法。\n\n![](img/image_rsrc10B.jpg)\n\n`try` 语句的语法包括 `try` 关键字、大括号、`catch`\
  \ 关键字、异常对象的标识符以及被捕获的异常类型。`try` 块的代码正常运行。如果 `try` 块中的任何语句抛出了由 `catch` 块列出的异常，则 `try`\
  \ 块将停止，执行将转到 `catch` 块。\n\n你可能注意到“block”（块）和“clause”（句）这两个词互换使用。考试也是如此，所以要习惯它。两者都是正确的。Block\
  \ 是正确的，因为有大括号。Clause 是正确的，因为它是 try 语句的一部分。\n\n这里的规则并不多。try 块和 catch 块都需要大括号。在我们的示例中，当小女孩第一次摔倒就站了起来。如下所示：\n\
  \n```java\nvoid explore() {\n    try {\n        fall();\n        System.out.println(\"\
  never get here\");\n    } catch (RuntimeException e) {\n        getUp();\n    }\n\
  \    seeAnimals();\n}\nvoid fall() {\n    throw new RuntimeException();\n}\n```\n\
  \n首先，第 5 行调用了 `fall()` 方法。第 12 行抛出了异常。这意味着 Java 直接跳转到 catch 块，跳过了第 6 行。女孩在第 8 行处起身。现在\
  \ try 语句结束，正常执行到第 10 行。\n\n现在让我们看看一些考试可能会试图误骗你的无效 try 语句。你看到这一个哪里有问题了吗？\n\n```java\n\
  try // 编译错误\n    fall();\ncatch (Exception e)\n    System.out.println(\"get up\"\
  );\n```\n\n问题是缺少了大括号 `{}`。try 语句就像方法一样，即使代码块内只有一个语句，大括号也是必须的，而 if 语句和循环是特殊的，允许省略大括号。\n\
  \n那么这一个呢？\n\n```java\ntry { // 编译错误\n    fall();\n}\n```\n\n这段代码无法编译，因为 try 块后面没有任何内容。记住，try\
  \ 语句的意义是在抛出异常时能够执行某些操作。如果没有另一个句，try 语句就是孤单的。正如很快就会看到的，有一种特殊类型的 try 语句包含一个隐式的 finally\
  \ 块，尽管其语法与此示例非常不同。\n\n### 链式 catch 块 (Chaining catch Blocks)\n\n\n\n\n\n在考试中，你可能会遇到异常类，并需要理解它们是如何运行的。以下是处理方法。首先，你必须能够识别异常是受检异常（checked\
  \ exception）还是未检异常（unchecked exception）。其次，你需要判断这些异常是否是彼此的子类。\n\n```java\nclass\
  \ AnimalsOutForAWalk extends RuntimeException {}\n\nclass ExhibitClosed extends\
  \ RuntimeException {}\n\nclass ExhibitClosedForLunch extends ExhibitClosed {}\n\
  ```\n\n在这个示例中，有三个自定义异常。它们都是未检异常，因为它们直接或间接地继承了 `RuntimeException`。现在我们通过两个 catch\
  \ 块链联这两种异常，并通过打印适当的消息来处理它们：\n\n```java\npublic void visitPorcupine() {\n    try\
  \ {\n      seeAnimal();\n    } catch (AnimalsOutForAWalk e) {  // 第一个 catch 块\n\
  \      System.out.print(\"try back later\");\n    } catch (ExhibitClosed e) {  \
  \      // 第二个 catch 块\n      System.out.print(\"not today\");\n    }\n}\n```\n\n\
  这段代码运行时有可能。如果 `seeAnimal()` 没有抛出异常，则什么都不会打印。如果动物出去散步，则只有第一个 catch 块运行。如果展馆关闭，则只有第二个\
  \ catch 块运行。像这样链联时，两个 catch 块是不可能同时执行的。\n\ncatch 块的顺序存在一条规则。Java 按照它们出现的顺序进行检查。如果其中一个\
  \ catch 块无法被执行，就会发生关于“不可达代码”（unreachable code）的编译错误。例如，当父类的 catch 块出现在子类的 catch\
  \ 块之前时，就会发生这种情况。记住，我们警告过你要注意任何子类异常！\n\n在刺豪的示例中，catch 块的顺序可以反过来，因为这些异常之间没有继承关系。而且，我们确实见过刺豪被牵着绳子散步。\n\
  \n下面的示例展示了彼此继承的异常类型：\n\n```java\npublic void visitMonkeys() {\n    try {\n     \
  \ seeAnimal();\n    } catch (ExhibitClosedForLunch e) {  // 子类异常\n      System.out.print(\"\
  try back later\");\n    } catch (ExhibitClosed e) {           // 父类异常\n      System.out.print(\"\
  not today\");\n    }\n}\n```\n\n如果抛出了更具体的 `ExhibitClosedForLunch` 异常，则运行第一个 catch\
  \ 块。如果不是，Java 会检查是否抛出了父类 `ExhibitClosed` 异常并捕获它。这一次，catch 块的顺序就变得重要了。反过来是不行的。\n\n\
  ```java\npublic void visitMonkeys() {\n    try {\n      seeAnimal();\n    } catch\
  \ (ExhibitClosed e) {\n      System.out.print(\"not today\");\n    } catch (ExhibitClosedForLunch\
  \ e) {  // 无法编译\n      System.out.print(\"try back later\");\n    }\n}\n```\n\n\
  如果抛出了更具体的 `ExhibitClosedForLunch` 异常，则运行 `ExhibitClosed` 的 catch 块——这意味着第二个 catch\
  \ 块无法运行。Java 正确地告诉你有有一个不可达的块。让我们再试一次。你看出为什么这段代码无法编译了吗？\n\n```java\npublic void visitSnakes()\
  \ {\n    try {\n      seeAnimal();\n    } catch (IllegalArgumentException e) {\n\
  \    } catch (NumberFormatException e) {  // 无法编译\n}\n```\n\n记得我们之前说过你需要知道 `NumberFormatException`\
  \ 是 `IllegalArgumentException` 的子类吗？这就是例子的原因。由于 `NumberFormatException` 是子类，它将始终被第一个\
  \ catch 块捕获，导致第二个 catch 块不可达。同样，对于考试，你需要知道 `FileNotFoundException` 是 `IOException`\
  \ 的子类，不能以类似的方式使用。\n\n复习多个 catch 块时，记住最多只有一个 catch 块会运行，而且它将是第一个能够处理该异常的 catch 块。此外，记住由\
  \ catch 语句定义的异常其作用范围仅限于该块内部。例如，以下代码会导致编译错误，因为它尝试在定义异常对象的块之外使用异常对象：\n\n```java\n\
  public void visitmanes() {\n    try {\n    } catch (NumberFormatException e1) {\n\
  \      System.out.println(e1);\n    } catch (IllegalArgumentException e2) { // 无法编译\n\
  }\n```\n\n### 应用多捕获块 (Multi-catch Block)\n\n通常，我们希望抛出的异常结果是相同的，无论抛出的是哪种特定的异常。例如，看这个方法：\n\
  \n```java\npublic static void main(String args[]) {\n    try {\n      System.out.println(Integer.parseInt(args[1]));\n\
  \    } catch (ArrayIndexOutOfBoundsException e) {\n      System.out.println(\"Missing\
  \ or invalid input\");\n    } catch (NumberFormatException e) {\n      System.out.println(\"\
  Missing or invalid input\");\n    }\n}\n```\n\n注意我们在两个不同的 catch 块中使用了相同的 `println()`\
  \ 语句。我们可以使用多捕获块来更优雅地处理这一点。多捕获块允许多个异常类型被同一个 catch 块捕获。让我们使用多捕获块重写上一个示例：\n\n```java\n\
  public static void main(String[] args) {\n    try {\n      System.out.println(Integer.parseInt(args[1]));\n\
  \    } catch (ArrayIndexOutOfBoundsException | NumberFormatException e) {\n    \
  \  System.out.println(\"Missing or invalid input\");\n    }\n}\n```\n\n这好得多。没有重复代码，公共逻辑都在一个地方。如果你需要，你仍然可以为\
  \ `Exception` 设置第二个 catch 块。多捕获块中的逻辑正出现在你预期的位置。\n\n考试可能会用无效语法来欺骗你。记住，异常可以以任何顺序列在\
  \ catch 语句中。然而，变量名必须只出现一次且位于最后。你看出这些是有效还是无效的吗？\n\n```java\ncatch(Exception1 e |\
  \ Exception2 e | Exception3 e)   // 无法编译\ncatch(Exception1 e1 | Exception2 e2 |\
  \ Exception3 e3) // 无法编译\ncatch(Exception1 | Exception2 | Exception3 e)\n```\n\n\
  第一行是错误的，因为变量名出现了三次。即使它恰好是同一个变量名也不行。第二行也是错误的，因为变量名再次出现了三次。使用不同的变量名也不会让它更好。第三行可以编译。它展示了指定三个异常类型的正确语法。\n\
  \nJava 的意图是将多捕获用于不相关的异常，并且它防止你在多捕获中指定冗余的类型。你看出这里有问题了吗？\n\n```java\ntry {\n  throw\
  \ new IOException();\n} catch (FileNotFoundException | IOException p) {} // 无法编译\n\
  ```\n\n在多捕获中指定相关的异常是冗余的，编译器会给出类似这样的消息：\n\n异常 FileNotFoundException 已被备选的 IOException\
  \ 捕获\n\n\n\n\n由于 `FileNotFoundException` 是 `IOException` 的子类，这段代码将无法编译。多捕获块（multi-catch\
  \ block）遵循的与链式 catch 块类似的规则，你在上一节中已经见过。例如，当它们遇到不可达的代码或重复捕获的异常时，两者都会触发编译器错误。多捕获块与链式\
  \ catch 块之间的唯一区别在于，在单个 catch 表达式中，多捕获块的顺序并不重要。\n\n回到示例，正确的做法只是去掉多余的子类引用，如下所示：\n\n\
  ```java\ntry {\n    throw new IOException();\n} catch (IOException e) {}\n```\n\n\
  ### 添加 finally 块\n\n`try` 语句允许你使用 `finally` 子句在末尾运行代码，无论是否抛出异常。图 11.4 显示了带有此额外功能的\
  \ `try` 语句的语法。\n\n![示例结构说明了 Java 脚本中 try 语句的语法。变量、catch 块在使用了 finally 时是可选的，finally\
  \ 块无论是否发生异常都会执行，最后是 finally 关键字。](img/image_rsrc10DD.jpg)\n\n图 11.4 带有 finally 的\
  \ try 语句语法\n\n同时包含 `catch` 和 `finally` 的代码有两种路径。如果抛出了异常，`finally` 块会在 `catch` 块之后运行。如果没有抛出异常，`finally`\
  \ 块会在 `try` 块完成之后运行。\n\n让我们回到小女孩的例子，这次加上 `finally`：\n\n```java\n12: void explore()\
  \ {\n13:    try {\n14:        seeAnimals();\n15:        fall();\n16:    } catch\
  \ (Exception e) {\n17:        getHugFromDaddy();\n18:    } finally {\n19:      \
  \  seeMoreAnimals();\n20:    }\n21:    goHome();\n22: }\n```\n\n女孩在第 15 行摔倒了。如果她自己站了起来，代码将继续进入\
  \ `finally` 块并执行第 19 行。然后 `try` 语句结束，代码继续到第 21 行。如果女孩没有自己站起来，她就会抛出一个异常。`catch` 块运行，她在第\
  \ 17 行得到了一个拥抱。有了这个拥抱，她准备好在第 19 行去看更多的动物了。然后 `try` 语句结束，代码继续到第 21 行。无论哪种，结果都是样的。`finally`\
  \ 块会被执行，执行在 `try` 语句之后继续。\n\n考试会尝试通过缺失子句或顺序错误的子句来考你。你看出为什么以下代码可以或无法编译了吗？\n\n```java\n\
  25: try {  // 无法编译\n26:     fall();\n27: } finally {\n28:     System.out.println(\"\
  all better\");\n29: } catch (Exception e) {\n30:     System.out.println(\"get up\"\
  );\n31: }\n\n33: try {  // 无法编译\n34:     fall();\n35: }\n\n37: try {\n38:     fall();\n\
  39: } finally {\n40:     System.out.println(\"all better\");\n41: }\n```\n\n第一个示例（第\
  \ 25–31 行）无法编译，是因为 `catch` 和 `finally` 块的顺序错误。第二个示例（第 33–35 行）无法编译，因为必须有一个 `catch`\
  \ 或 `finally` 块。第三个示例（第 37–41 行）是完美的。如果存在 `finally`，则不需要 `catch` 块。\n\n你在考试中遇到的大多数关于\
  \ `finally` 的示例看起来都是很刻意的。例如，你会被问到这类问题：这段代码输出什么：\n\n```java\npublic static void main(String[]\
  \ unused) {\n    StringBuilder sb = new StringBuilder();\n    try {\n        sb.append(\"\
  t\");\n    } catch (Exception e) {\n        sb.append(\"c\");\n    } finally {\n\
  \        sb.append(\"f\");\n    }\n    sb.append(\"a\");\n    System.out.print(sb.toString());\n\
  }\n```\n\n答案是 `tfa`。执行 `try` 块。由于没有抛出异常，Java 直接进入 `finally` 块。然后运行 `try` 语句之后的代码。我们这是一个愚蠢的例子，但你可以预期在考试中看到类似的示例。\n\
  \n关于 `finally` 块，你还需要知道一个额外规则。如果进入了带有 `finally` 块的 `try` 语句，那么无论代码是否成功完成，`finally`\
  \ 块始终会被执行。看这里。假设第 14 行可能抛出也可能不抛出异常，这段代码可能打印的值有哪些？\n\n```java\n12: int goHome() {\n\
  13:    try {\n14:        // 可选择抛出异常\n15:        System.out.print(\"1\");\n16:  \
  \  } catch (Exception e) {\n17:        System.out.print(\"2\");\n18:        return\
  \ -1;\n19:    } finally {\n20:        System.out.print(\"3\");\n21:    return -2;\n\
  22: }\n```\n\n如果在第 14 行抛出异常，`finally` 块会在 `catch` 块之后运行。如果没有抛出异常，`finally` 块会在 `try`\
  \ 块完成之后运行。无论哪种，结果都是样的。`finally` 块会被执行，执行在 `try` 语句之后。\n\n### System.exit()\n\n“finally\
  \ 块始终会被执行”这一规则有一个例外：Java 定义了一个名为 `System.exit()` 的方法。它接受一个整数参数表示返回状态。\n\n```java\n\
  try {\n    System.exit(0);\n} finally {\n    System.out.print(\"Never going here\"\
  );\n}\n```\n\n当在 `try` 或 `catch` 块中调用 `System.exit()` 时，`finally` 块不会运行。\n\n## 资源管理\n\
  \n应用程序通常与文件、数据库和各种连接对象工作。这些数据源被称为资源。在许多情况下，你会打开连接，无论是在网络上还是文件系统中。然后你读取/写入你需要的数据。最后，关闭资源以表示你已完成。\n\
  \n如果你在完成后没有关闭资源会怎样？简单来说，会发生很多糟糕的事情。如果你正在连接数据库，可能会耗尽所有连接，这意味着在你释放连接之前，没人可以访问数据库。虽然你经常听到内存泄漏会导致程序失败，但资源泄漏同样糟糕，它发生在程序未能释放资源连接时，导致资源无法访问。这可能意味着你的程序无法再与数据库通信——或者更糟，所有程序都无法访问数据库！\n\
  \n对于考试来说，资源通常是指需要某种流或连接来读写数据的文件或数据库。在第 14 章中，你将创建许多在使用后需要关闭的资源。\n\n### 引入 try-with-resources\n\
  \n让我们来看一个打开文件并关闭它的方法：\n\n```java\n4:public void readFile(String file) {\n5:    FileInputStream\
  \ is = null;\n6:    try {\n7:        is = new FileInputStream(\"myfile.txt\");\n\
  8:        // 读取文件数据\n9:    } catch (IOException e) {\n10:        e.printStackTrace();\n\
  11:   } finally {\n12:        if(is != null) {\n```\n\n\n\n\n```java\n13:      \
  \     try {\n14:                is.close();\n15:           } catch (IOException\
  \ e2) {\n16:                e2.printStackTrace();\n17:           }\n18:        \
  \ }\n19:     }\n20: }\n```\n\n哇，这是一个长方法！为什么我们需要两个 `try` 和 `catch` 块？嗯，第 7 行和第 14\
  \ 行都包含了受检的 `IOException` 调用，这些需要在方法中被捕获或由方法重新抛出。这个方法中一半的代码行都用于关闭资源。资源越多，这种代码就会变得越长。例如，你可能有多个需要按特定顺序关闭的资源。你也不希望关闭一个资源时引起的异常阻止了另一个资源的关闭。\n\
  \n为了解决这个问题，Java 包含了 `try-with-resources` 语句，它可以自动关闭在 `try` 子句中打开的所有资源。此功能也被称为“自动资源管理”，因为\
  \ Java 会自动处理关闭工作。\n\n让我们来看一下使用 `try-with-resources` 语句的相同示例：\n\n```java\n4: public\
  \ void readFile(String file) {\n5:     try (FileInputStream is = new FileInputStream(\"\
  myfile.txt\")) {\n6:         // Read file data\n7:     } catch (IOException e) {\n\
  8:         e.printStackTrace();\n9:     }\n10: }\n```\n\n在功能上，它们是相似的，但我们的新版本行数少了一半。更重要的是，通过使用\
  \ `try-with-resources` 语句，我们保证了连接一旦离开作用范围，Java 就会尝试在同一个方法内将其关闭。\n\n在幕后，编译器会将 `try-with-resources`\
  \ 块替换为 `try` 和 `finally` 块。我们将这个“隐藏”的 `finally` 块称为“隐式 `finally` 块”，因为它是由编译器自动创建并使用的。在使用\
  \ `try-with-resources` 语句时，你仍然可以创建一个程序员定义的 `finally` 块；只需注意，隐式的块会被先调用。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n与垃圾回收不同，资源在离开作用范围时并不会自动关闭。因此，建议你在打开资源的同一代码块中关闭它们。通过使用 `try-with-resources` 语句打开你所有的资源，这一切会自动发生。\n\
  \n### Try-with-Resources 基础\n\n图 11.5 显示了 `try-with-resources` 语句的样子。注意在 `try` 子句中可以打开一个或多个资源。当打开多个资源时，它们关闭的顺序与它们创建的顺序相反。此外，注意使用圆括号来列出这些资源，并使用分号来分隔声明。这与在\
  \ `for` 循环中声明多个索引的工作一样。\n\n![示例结构说明了 Java 脚本中基础资源语句的语法。变量包括资源、资源之间所需的分号、可选的分号、反序关闭的资源，以及可选的\
  \ catch 和 finally 子句。](img/image_rsrc10DE.jpg)\n\n图 11.5 基础 try-with-resources 语句的语法\n\
  \n图 11.5 中的 `catch` 块发生了什么？嗯，事实证明对于 `try-with-resources` 语句，`catch` 块是可选的。例如，我们可以重写之前的\
  \ `readFile()` 示例，让方法声明异常以使其变得更短：\n\n```java\n4: public void readFile(String file)\
  \ throws IOException {\n5:     try (FileInputStream is = new FileInputStream(\"\
  myfile.txt\")) {\n6:         // Read file data\n7:     }\n8: }\n```\n\n在章节的前面的部分，你学过\
  \ `try` 语句必须包含一个或多个 `catch` 块或一个 `finally` 块。`try-with-resources` 语句与 `try` 语句的区别在于，这两者都不是强制要求的，尽管开发者可以两者都添加。对于考试来说，你需要知道隐式的\
  \ `finally` 块会在任何程序员编写的块之前运行。\n\n### 构建 Try-with-Resources 语句\n\n只有实现了 `AutoCloseable`\
  \ 接口的类才能在 `try-with-resources` 语句中使用。例如，以下代码无法编译，因为 `String` 没有实现 `AutoCloseable`\
  \ 接口：\n\n```java\ntry (String reptile = \"lizard\") {}\n```\n\n继承 `AutoCloseable`\
  \ 需要实现一个兼容的 `close()` 方法。\n\n```java\ninterface AutoCloseable {\n    public void\
  \ close() throws Exception;\n}\n```\n\n根据你对方法重写的学习，这意味着实现的 `close()` 版本可以选择抛出 `Exception`\
  \ 或其子类，或者完全不抛出任何异常。\n\n在本节的其余部分，我们使用以下代码，在调用 `close()` 时简单打印一条消息：\n\n```java\npublic\
  \ class MyFileClass implements AutoCloseable {\n    private int num;\n    public\
  \ MyFileClass(int num) {\n        this.num = num;\n    }\n    @Override\n    public\
  \ void close() {\n        System.out.println(\"Closing: \" + num);\n    }\n}\n```\n\
  ![](img/image_rsrc10B.jpg)\n\n在第 14 章 中，你会遇到实现 `Closeable` 而不是 `AutoCloseable` 的资源。由于\
  \ `Closeable` 扩展了 `AutoCloseable`，它们在 `try-with-resources` 中是支持的。\n\n#### 声明资源\n\
  \n虽然 `try-with-resources` 支持多个变量，但每个变量必须在独立的语句中声明。例如，以下代码无法编译：\n\n```java\ntry (MyFileClass\
  \ is = MyFileClass(1), os = MyFileClass(2))\n```\n\n第一个示例无法编译是因为缺少数据类型，第二个示例是因为它使用了逗号而不是分号。每个资源必须包含数据类型并用分号分隔。\n\
  \n你可以在 `try-with-resources` 语句中使用 `var` 作为数据类型声明资源，因为资源是局部的。\n\n```java\ntry (var\
  \ f = BufferedInputStream(new FileInputStream(\"it.txt\"))) {\n    // Process file\n\
  }\n```\n声明资源是 `var` 非常有用的场景，它可以缩短长代码行。\n\n#### Try-with-Resources 的作用域\n\n在 `try`\
  \ 子句中创建的资源的作用域仅限于 `try` 块。这有助于记住隐式的 `finally` 在任何你编写的 `catch`/`finally` 块之前运行。隐式的\
  \ `close()` 已经运行，资源不再可用。你知道为什么这个示例中的第 6 行和第 8 行无法编译吗？\n\n```java\n3: try (Scanner\
  \ s = new Scanner(System.in)) {\n4:     s.nextLine();\n5: catch(Exception e) {\n\
  6:     s.nextInt(); // 无法编译\n7: } finally {\n8:     s.nextInt(); // 无法编译\n9: }\n\
  ```\n\n问题在于 `Scanner` 在 `try` 子句结束时离开了作用范围。第 6 行和第 8 行无法访问它。这是一个很好的特性。你不会意外使用已关闭的对象。在传统的\
  \ `try` 语句中，必须在 `try` 语句之前声明变量以便 `try` 和 `finally` 块都能访问它，这产生了一个副作用，即该变量在方法的其余部分都有效，诱使你意外调用它。\n\
  \n#### 遵循操作顺序\n\n在使用 `try-with-resources` 语句时，重要的是资源关闭的顺序与它们创建的顺序相反。使用我们自定义的 `MyFileClass`，你能看出这个方法打印了什么吗？\n\
  \n```java\npublic static void main(String… xyz) {\n    try (MyFileClass bookReader\
  \ = new MyFileClass(1);\n         MyFileClass movieReader = new MyFileClass(2))\
  \ {\n        System.out.println(\"Try Block\");\n        throw new RuntimeException();\n\
  \    } catch (Exception e) {\n        System.out.println(\"Catch Block\");\n   \
  \ } finally {\n        System.out.println(\"Finally Block\");\n    }\n}\n```\n\n\
  \n\n\n虽然这个例子在实践中看起来有点复杂，但在考试中这类问题很常见。它的输出如下：\n\nTry Block\n\nClosing: 2\n\nClosing:\
  \ 1\n\nCatch Block\n\nFinally Block\n\n对于考试，请务必理解为什么该方法按此顺序打印语句。请记住，资源关闭的顺序与它们声明的顺序相反，并且隐式的\
  \ `finally` 会在程序员定义的 `finally` 之前执行。\n\n### 应用有效最终（Effectively Final）\n\n虽然资源通常在\
  \ `try-with-resources` 语句中创建，但也可以提前声明它们，前提它们被标记为 `final` 或是有效最终（effectively final）。如果你想回顾什么是“有效最终”，请参阅第\
  \ 5 章。\n\n该语法使用资源名称来代替资源声明，并用分号（`;`）分隔。让我们尝试另一个例子：\n\n```java\n11: public static\
  \ void main(String… xyz) {\n12:     final var bookReader = new MyFileClass(4);\n\
  13:     MyFileClass movieReader = new MyFileClass(5);\n14:     try (bookReader;\n\
  15:             var tvReader = new MyFileClass(6);\n16:             movieReader)\
  \ {\n17:         System.out.println(\"Try Block\");\n18:     } finally {\n19:  \
  \       System.out.println(\"Finally Block\");\n20:     } }\n```\n\n让我们逐行分析。第 12\
  \ 行声明了一个 `final` 变量 `bookReader`，而第 13 行声明了一个有效最终的变量 `movieReader`。这两个资源都可以在 `try-with-resources`\
  \ 语句中使用。我们知道 `movieReader` 是有效最终的，因为它是一个只被赋值一次的局部变量。记住，测试有效最终的标准是：如果我们在声明变量时插入 `final`\
  \ 关键字，代码仍然可以编译。\n\n第 14 行和第 16 行使用新语法在 `try-with-resources` 语句中声明资源，仅使用变量名并用分号（`;`）分隔资源。第\
  \ 15 行使用普通语法在 `try` 句中声明新资源。\n\n在执行时，代码将打印以下内容：\n\nTry Block\n\nClosing: 5\n\nClosing:\
  \ 6\n\nClosing: 4\n\nFinally Block\n\n如果你在考试中遇到使用 `try-with-resources` 语句但变量未在 `try`\
  \ 句中声明的问题，请确保它是有效最终的。例如，以下代码无法编译：\n\n```java\n31: var writer = Files.newBufferedWriter(path);\n\
  32: try (writer) {  // 无法编译\n33:     writer.append(\"Welcome to the zoo!\");\n34:\
  \ }\n35: writer = null;\n```\n\n变量 `writer` 在第 35 行被重新赋值，导致编译器认为它不再是有效最终的。由于它不是一个有效最终变量，因此无法在第\
  \ 32 行的 `try-with-resources` 语句中使用。\n\n考试可能会试图欺骗你的另一个地方是在资源关闭后访问它。考虑以下情况：\n\n```java\n\
  41: var writer = Files.newBufferedWriter(path);\n42: writer.append(\"This write\
  \ is permitted but a really bad idea!\");\n43: try (writer) {\n44:     writer.append(\"\
  Welcome to the zoo!\");\n45: }\n46: writer.append(\"This write will fail!\");  //\
  \ IOException\n```\n\n这段代码可以编译，但在第 46 行会抛出异常，信息为 `Stream closed`。虽然可以在 `try-with-resources`\
  \ 语句之前向资源写入内容，但在之后不行。\n\n### 理解被抑制异常（Suppressed Exceptions）\n\n我们用可能最困惑的话题结束对异常的讨论：被抑制异常。如果\
  \ `close()` 方法抛出异常会怎样？让我们尝试一个说明性例子：\n\n```java\npublic class TurkeyCage implements\
  \ AutoCloseable {\n    public void close() {\n        System.out.println(\"Close\
  \ gate\");\n    }\n    public static void main(String[] args) {\n        try (var\
  \ t = new TurkeyCage()) {\n            System.out.println(\"Put turkeys in\");\n\
  \        }\n    } } }\n```\n\n如果 `TurkeyCage` 没有关闭，火鸡可能会全部逃掉。显然，我们需要处理这种情况。我们已经知道资源在任何程序员编写的\
  \ `catch` 块运行之前会被关闭。这意味着如果我们愿意，可以捕获 `close()` 抛出的异常。或者，我们可以允许调用者来处理它。\n\n让我们用新的\
  \ `JammedTurkeyCage` 实现来扩展我们的示例，如下：\n\n```java\n1:  public class JammedTurkeyCage\
  \ implements AutoCloseable {\n2:      public void close() throws IllegalStateException\
  \ {\n3:          throw new IllegalStateException(\"Cage not close\");\n4:      }\n\
  5:  public static void main(String[] args) {\n6:          try (JammedTurkeyCage\
  \ t = new JammedTurkeyCage()) {\n7:              System.out.println(\"Put turkeys\
  \ in\");\n8:          } catch (IllegalStateException e) {\n9:              System.out.println(\"\
  Caught: \" + e.getMessage());\n10:         }\n11:     }\n```\n\n等待，提供的 `JammedTurkeyCage`\
  \ 示例文本是碎片化/交织的。我将根据提供的文本片段重建逻辑，同时保持格式规则。\n\n*注意：源文本包含了多个代码和解释的交织版本。我已根据指令整合了核心内容。*\n\
  \n\n\n```java\ntry (JammedTurkeyCage t = new JammedTurkeyCage()) {\n    throw new\
  \ IllegalStateException(\"Turkeys ran off\");\n} finally {\n    throw new RuntimeException(\"\
  and we couldn't find them\");\n}\n```\n`line 7` 抛出一个异常。然后 Java 尝试关闭资源并向其添加了一个抑制异常（suppressed\
  \ exception）。现在我们遇到了问题。`finally` 块在这一切之后运行。由于 `line 9` 同样抛出了异常，来自 `line 7` 的之前的异常丢失了，代码打印如下内容：\n\
  \n```\nException in thread \"main\" java.lang.RuntimeException:\n    and we couldn’t\
  \ find them\n    at JammedTurkeyCage.main(JammedTurkeyCage.java:9)\n```\n\n这一直以来并且一直是糟糕的编程习惯。我们不希望丢失异常！虽然这不在考试范围内，但其原因与向后兼容有关。这种行为在引入自动资源管理之前就已经存在。\n\
  \n## 值格式化\n\n我们现在稍微转换一下，讨论如何为用户格式化数据。在本节中，我们将处理数字、日期和时间。这在下一节我们将自定义扩展到不同的语言和区域时尤为重要。如果你需要复习创建各种日期/时间对象，可能想要查看第\
  \ 4 章，“核心 API”。\n\n### 数字格式化\n\n在第 4 章中，你看到了如何使用 `String.format()` 方法控制数字的输出。这对于简单的内容很有用，但有时你需要更细粒度的控制。为此，我们引入了\
  \ `NumberFormat` 抽象类，它有两个常用的方法：\n\n```java\npublic final String format(double number)\n\
  public final String format(long number)\n```\n\n由于 `NumberFormat` 是抽象类，我们需要使用具体的\
  \ `DecimalFormat` 类来使用它。它包含一个接受模式 `String` 的构造函数：\n\n```java\npublic DecimalFormat(String\
  \ pattern)\n```\n\n模式可能会变得非常复杂。但幸运的是，对于考试，你只需要了解两个格式化字符，如表 11.5 所示。\n\n#### 表 11.5\
  \ DecimalFormat 符号\n\n| 符号 | 含义 | 示例 |\n| --- | --- | --- |\n| # | 如果没有数字，则省略该位置。\
  \ | $2.2 |\n| 0 | 如果没有数字，则在该位置填充 0。 | $002.20 |\n\n这些示例应该有助于解释这些符号是如何工作原理：\n\n```java\n\
  double d = 1234.567;\nNumberFormat f1 = new DecimalFormat(\"###,###,###.0\");\n\
  System.out.println(f1.format(d));  // 1,234.6\n\nNumberFormat f2 = new DecimalFormat(\"\
  000,000,000.00000\");\nSystem.out.println(f2.format(d));  // 000,001,234.56700\n\
  \nNumberFormat f3 = new DecimalFormat(\"Your Balance $#,###,###.##\");\nSystem.out.println(f3.format(d));\
  \  // Your Balance $1,234.57\n```\n\n`line 14` 显示数字中的数字，并四舍五入到小数点后一位。左侧额外的位置被省略了，因为我们使用了\
  \ `#`。`line 17` 添加了前导和后缀零，使输出达到所需的长度。`line 20` 显示了带有非格式化字符的前缀以及舍入，因为打印的数字比可用的数字少。注意，如果在\
  \ `#` 符号之间使用逗号，逗号会被删除。\n\n正如你在本章的本地化部分将看到的，还有另一个继承 `NumberFormat` 的具体类叫做 `CompactNumberFormat`，你需要了解它。\n\
  \n### 日期和时间格式化\n\n日期时间类支持许多方法来从中获取数据。\n\n```java\nLocalDate date = LocalDate.of(2025,\
  \ Month.OCTOBER, 20);\nSystem.out.println(date.getDayOfWeek());  // MONDAY\nSystem.out.println(date.getMonth());\
  \  // OCTOBER\nSystem.out.println(date.getYear());  // 2025\nSystem.out.println(date.getDayOfYear());\
  \ // Java 提供了一个名为 `DateTimeFormatter` 的类来显示标准格式。\n\n```java\nLocalDate date = LocalDate.of(2025,\
  \ Month.OCTOBER, 20);\nLocalTime time = LocalTime.of(11, 12, 34);\nLocalDateTime\
  \ dt = LocalDateTime.of(date, time);\nSystem.out.println(date.format(DateTimeFormatter.ISO_DATE));\n\
  System.out.println(time.format(DateTimeFormatter.ISO_TIME));\nSystem.out.println(dt.format(DateTimeFormatter.ISO_DATE_TIME));\n\
  ```\n\n代码片段打印如下：\n\n```\n2025-10-20\n11:12:34\n2025-10-20T11:12:34\n```\n\n`DateTimeFormatter`\
  \ 在遇到不兼容类型时会抛出异常。例如，以下每一项都会运行时产生异常，因为它尝试将日期格式化为时间，反之亦然：\n\n```java\ndate.format(DateTimeFormatter.ISO_TIME);\
  \  // RuntimeException\ntime.format(DateTimeFormatter.ISO_DATE);  // RuntimeException\n\
  ```\n\n### 自定义日期/时间格式\n\n如果你不想使用预定义的格式之一，`DateTimeFormatter` 支持使用日期格式 `String` 进行自定义格式。\n\
  \n```java\nvar f = DateTimeFormatter.ofPattern(\"MMMM dd, yyyy ’at’ hh:mm\");\n\
  System.out.println(dt.format(f));  // October 20, 2025 at 11:12\n```\n\n\n\n\n正如你在上一个示例中所看到的，你需要确保\
  \ `String` 格式与底层的日期/时间类型兼容。表 11.7 显示了在每个日期/时间对象上可以使用哪些符号。\n\n表 11.7 支持的日期/时间符号\n\
  \n| 符号 | LocalDate | LocalTime | LocalDateTime | ZonedDateTime |\n| --- | --- |\
  \ --- | --- | --- |\n| y | √ |  | √ | √ |\n| M | √ |  | √ | √ |\n| d | √ |  | √\
  \ | √ |\n| h |  | √ | √ | √ |\n| m |  | √ | √ | √ |\n| s |  | √ | √ | √ |\n| a |\
  \  | √ | √ | √ |\n| z |  |  |  | √ |\n| Z |  |  |  | √ |\n\n请确保你了解哪些符号与哪些日期时间类型兼容。例如，尝试为\
  \ `LocalTime` 格式化月份或为 `LocalDate` 格式化小时将导致运行时异常。\n\n### 选择 `format()` 方法\n\n日期/时间类包含一个\
  \ `format()` 方法，它可以接收一个格式化器；而格式化器类包含一个 `format()` 方法，它可以接收一个日期/时间值。结果是，以下两种方式都是可以的：\n\
  \n```\nvar dateTime = LocalDateTime.of(2025, Month.OCTOBER, 20, 6, 15, 30);\nvar\
  \ formatter = DateTimeFormatter.ofPattern(\"MM/dd/yyyy hh:mm:ss\");\n\nSystem.out.println(dateTime.format(formatter));\
  \  // 10/20/2025 06:15:30\nSystem.out.println(formatter.format(dateTime));  // 10/20/2025\
  \ 06:15:30\n```\n\n这些语句在运行时打印相同的值。使用哪种语法取决于你。\n\n### 添加自定义文本值\n\n如果你想让格式包含一些自定义文本值该怎么办？如果你直接将它们作为格式\
  \ `String` 的一部分输入，格式化器会将每个字符解释为日期/时间符号。在最好的情况下，它将根据你输入的额外符号显示奇怪的数据；在最坏的情况下，它会因为字符包含无效符号而抛出异常。这两种都不是想要的！\n\
  \n解决此问题的方法是将格式化器拆分为多个较小的格式化器，然后拼接结果。\n\n```\nvar dt = LocalDateTime.of(2025, Month.OCTOBER,\
  \ 20, 6, 15, 30);\nvar f1 = DateTimeFormatter.ofPattern(\"MMMM dd, yyyy \");\nvar\
  \ f2 = DateTimeFormatter.ofPattern(\" hh:mm\");\n\nSystem.out.println(dt.format(f1)\
  \ + \"at\" + dt.format(f2));  \n```\n\n这在运行时打印 October 20, 2025 at 06:15。\n\n虽然这种方法有效，但如果大量的文本值和日期符号混合在一起，可能会变得困难。幸运的是，Java\
  \ 包含了一个更简单的解决方案。你可以通过一对单引号（’）包裹文本来对其转义。转义文本指示格式化器忽略单引号内部的值，并直接将其作为最终值的一部分插入。\n\n\
  ```\nvar f = DateTimeFormatter.ofPattern(\"MMMM dd, yyyy ’at’ hh:mm\");\n\nSystem.out.println(dt.format(f));\
  \  // October 20, 2025 at 06:15\n```\n\n但如果你还需要在输出中显示单引号怎么办？欢迎来到字符转义的乐趣！Java 通过将两个单引号放在一起来实现这一点。\n\
  \n我们通过一些依赖于文本值的格式及其输出示例来结束对日期格式的讨论，如下所示：\n\n```\nvar g1 = DateTimeFormatter.ofPattern(\"\
  MMMM dd’, Party’’s at’ hh:mm\");\nSystem.out.println(dt.format(g1));  // October\
  \ 20, Party’s at 06:15\n\nvar g2 = DateTimeFormatter.ofPattern(\"’System format,\
  \ hh:mm: ’hh:mm\");\nSystem.out.println(dt.format(g2));  // System format, hh:mm:\
  \ 06:15\n\nvar g3 = DateTimeFormatter.ofPattern(\"’NEW! ’yyyy’, yay!’\");\nSystem.out.println(dt.format(g3));\
  \  // NEW! 2025, yay!\n```\n\n如果你没有用单引号转义文本值，当文本无法被解释为日期/时间符号时，运行时将抛出异常。\n\n```\n\
  DateTimeFormatter.ofPattern(\"The time is hh:mm\");  // IllegalArgumentException\n\
  ```\n\n此行 own 异常，因为 `T` 是未知符号。考试还可能向你展示不完整的转义序列。\n\n```\nDateTimeFormatter.ofPattern(\"\
  ’Time is: hh:mm: \");  // IllegalArgumentException\n```\n\n未能终止转义序列将触发运行时异常。\n\n\
  ## 支持国际化和本地化\n\n许多应用程序需要在不同的国家和使用不同的语言工作。例如，考虑句子“The zoo is holding a special event\
  \ on 4/1/25 to look at animal behaviors.” 活动什么时候举行？在美国，是在 4 月 1 日。然而，英国读者会将其解释为\
  \ 1 月 4 日。英国读者可能还会奇怪为什么我们不使用本地化。国际化是设计应用程序以适应不同语言和地区的过程。\n\n\n\n\n第一个示例选择了德语，这种语言在许多国家被使用，包括奥地利（`de_AT`）和列支敦登（`de_LI`）。第二个示例同时选择了作为语言的德语和作为国家的德国。虽然这些示例看起来相似，但它们并不是同一种。只有其中一个包含国家代码。\n\
  \n选择 `Locale` 的另一种方法是使用工厂方法 `Locale.of()`。你可以只传递一种语言，也可以同时传递语言和国家：\n\n```java\n\
  System.out.println(Locale.of(\"fr\"));      // fr\nSystem.out.println(Locale.of(\"\
  hi\", \"IN\"));  // hi_IN\n```\n\n第一个是法语，第二个是印度的印地语。同样，你不需要记住这些代码。Java 允许你创建一个带有无效语言或国家的\
  \ `Locale`，例如 `xx_XX`。然而，它将无法匹配你想使用的 `Locale`，你的程序行为将不会符合预期。\n\n还有第三种创建 `Locale`\
  \ 的方法，它更加灵活。构建器设计模式允许你设置所有关心的属性，最后再构建 `Locale`。这意味着你可以以任何顺序指定属性。以下两个 `Locale` 值都代表\
  \ `en_US`：\n\n```java\nLocale l1 = new Locale.Builder()\n   .setLanguage(\"en\"\
  )\n   .setRegion(\"US\")\n   .build();\n\nLocale l2 = new Locale.Builder()\n   .setRegion(\"\
  US\")\n   .setLanguage(\"en\")\n   .build();\n```\n\n![](img/image_rsrc10B8.jpg)\n\
  \n实际上还有第四种创建 `Locale` 实例的方法，使用 `Locale` 构造函数，例如 `new Locale(\"en\")` 或 `new Locale(\"\
  en\", \"US\")`。这些构造函数现在已弃用，请使用之前的三种技术之一。\n\n在测试程序时，你可能需要使用计算机默认之外的 `Locale`。\n\n\
  ```java\nSystem.out.println(Locale.getDefault());  // en_US\nLocale locale = Locale.of(\"\
  fr\");\nLocale.setDefault(locale);\nSystem.out.println(Locale.getDefault());  //\
  \ fr\n```\n\n尝试一下不用担心——Locale 只会在那一个 Java 程序中更改。它不会改变你计算机上的任何设置。它甚至不会改变同一程序的后续执行。\n\
  \n![](img/image_rsrc10B8.jpg)\n\n考试可能会使用 `setDefault()`，因为它无法假设你所处的位置。在实践中，我们很少编写代码来更改用户的默认\
  \ locale。\n\n## 数字本地化\n\n你可能会感到惊讶，格式化或解析货币和数值值会根据你的 locale 而改变。例如，在美国，美元符号位于数值之前，并且对于小于\
  \ 1 美元的数值，会带有一个小数点，例如 $2.15。但在德国，欧元符号附加在数值之后，且对于小于 1 欧元的数值会使用逗号，例如 2,15 €。\n\n幸运的是，`java.text`\
  \ 包包含了解决这些问题的类。后续章节涵盖了如何根据 locale 格式化数字、货币和日期。\n\n格式化或解析数据的第一步相同：获取 `NumberFormat`\
  \ 实例。表 11.8 显示了可用的工厂方法。\n\n### 获取 NumberFormat 的工厂方法\n\n| 说明 | 使用默认 Locale | 指定\
  \ Locale |\n| :--- | :--- | :--- |\n| 通用格式化器 | `NumberFormat.getInstance()` | `NumberFormat.getInstance(locale)`\
  \ |\n| 与 getInstance 相同 | `NumberFormat.getNumberInstance()` | `NumberFormat.getNumberInstance(locale)`\
  \ |\n| 用于格式化金额 | `NumberFormat.getCurrencyInstance()` | `NumberFormat.getCurrencyInstance(locale)`\
  \ |\n| 用于格式化百分比 | `NumberFormat.getPercentInstance()` | `NumberFormat.getPercentInstance(locale)`\
  \ |\n| 在显示前舍入小数值 | `NumberFormat.getIntegerInstance()` | `NumberFormat.getIntegerInstance(locale)`\
  \ |\n| 返回紧凑数字格式化器 | `NumberFormat.getCompactNumberInstance()` | `NumberFormat.getCompactNumberInstance(locale,\
  \ formatStyle)` |\n\n一旦你有了 `NumberFormat` 实例，就可以调用 `format()` 将数字转换为 String，可以使用\
  \ `parse()` 将 String 转换为数字。\n\n![](img/image_rsrc0BA.jpg)\n\n格式化类不是线程安全的。不要将它们存储在实例变量或静态变量中。在第\
  \ 13 章中了解更多关于线程安全的知识。\n\n### 格式化数字\n\n当我们格式化数据时，将其从结构化对象或原始值转换为 String。`NumberFormat.format()`\
  \ 方法根据与 `NumberFormat` 对象关联的 locale 格式化给定数字。\n\n让我们回到我们的动物园看一会儿。为了营销，我们想分享圣地亚动物园的平均每月访问人数。以下显示了在三个不同的\
