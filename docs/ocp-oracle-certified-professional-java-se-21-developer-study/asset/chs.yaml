  4. 1\n5. 2\n6. 3\n\n**30. 假设以下类被声明在同一个文件中作为顶级类型，哪些类包含编译错误？（选择所有项）**\n\n```java\n\
  sealed class Bird {\n    public final class Flamingo extends Bird {}\n}\n\nsealed\
  \ class Monkey {}\n\nclass EmperorTamarin extends Monkey {}\n\nnon-sealed class\
  \ Mandrill extends Monkey {}\n\nsealed class Friendly extends Mandrill permits Silly\
  \ {}\n\nfinal class Silly {}\n```\n\n1. Bird\n2. Monkey\n3. EmperorTamarin\n4. Mandrill\n\
  5. Friendly\n6. Silly\n\n\n\n\n7. 所有类正常编译，没有问题。\n\n# 第 8 章\n\n## Lambda 表达式与函数式接口\n\
  \n本章涵盖的 OCP 考试目标：\n\n*   在 Java 中使用面向对象概念\n    *   理解变量作用域、应用封装并创建不可变对象。使用局部变量类型推断。\n\
  \    *   创建和使用接口，识别函数式接口，并利用私有、静态和默认接口方法。\n\n在本章中，我们首先开始介绍 Lambda，这是一种新语法。Lambda\
  \ 允许你指定在程序稍后运行的代码。\n\n接下来，我们引入了函数式接口的概念，展示了如何编写你自己的接口以及如何识别一个接口是否为函数式接口。之后，我们引入了另一种新语法：方法引用。这些就像是\
  \ Lambda 的简写形式。\n\n然后，我们介绍了考试中需要掌握的函数式接口。最后，我们强调了变量是如何适配到 Lambda 的。\n\nLambda、方法引用和函数式接口在第\
  \ 9 章“集合与泛型”以及第 10 章“流（Streams）”中被频繁使用。\n\n## 编写简单的 Lambda\n\nJava 本质上是一种面向对象的语言。到目前，你已经看到了很多对象。函数式编程是一种更具声明性的编写代码的方式。你指定你想做什么，而不是处理对象的状态。你更关注表达式而不是循环。\n\
  \n函数式编程使用 Lambda 表达式来编写代码。Lambda 表达式是一段可以随处传递的代码块。你可以将 Lambda 表达式想象成存在匿名类内部的无名方法，就像你在第\
  \ 7 章“超越类”中看到的那些一样。它和完整的方法一样拥有参数和主体，但它没有像真实方法那样的名字。Lambda 通常简称为 Lambda。如果 Java 不是你的第一语言，你可能也知道它们被称为闭包（closures）。如果你过去对闭包有糟糕的经历，不要担心。它们在\
  \ Java 中要简单得多。\n\nLambda 允许你在 Java 中编写强大的代码。在本节中，我们将涵盖一个说明为什么 Lambda 有帮助的示例以及 Lambda\
  \ 的语法。\n\n### 查看 Lambda 示例\n\n我们的目标是根据某些标准打印列表中所有的动物。我们将向你展示如何在不使用 Lambda 的情况下这样做，以说明\
  \ Lambda 的用处。我们从 `Animal` 记录开始。\n\n```java\npublic record Animal(String species,\
  \ boolean canHop, boolean canSwim) { }\n```\n\n`Animal` 记录有三个字段。假设我们有一个动物列表，并且想要根据特定属性处理数据。例如，我们打印所有能跳跃的动物。我们可以定义一个接口来泛化这个概念并支持多种检查。\n\
  \n```java\npublic interface CheckTrait {\n    boolean test(Animal a);\n}\n```\n\n\
  我们想要检查的第一点是 `Animal` 能不能跳跃。我们提供了一个实现我们接口的类。\n\n```java\npublic class CheckIfHopper\
  \ implements CheckTrait {\n    public boolean test(Animal a) {\n        return a.canHop();\n\
  \    }\n}\n```\n\n这个类看起来很简单——事实也如此。这是 Lambda 要解决的问题之一。请稍等一下。现在我们拥有了编写代码来查找 `Animal`\
  \ 能否跳跃所需。\n\n```java\n1: import java.util.*;\n2: public class TraditionalSearch\
  \ {\n3:     public static void main(String[] args) {\n4:\n5:         // list of\
  \ animals\n6:         var animals = new ArrayList<Animal>();\n7:         animals.add(new\
  \ Animal(\"fish\", false, true));\n8:         animals.add(new Animal(\"kangaroo\"\
  , true, false));\n9:         animals.add(new Animal(\"rabbit\", true, false));\n\
  10:        animals.add(new Animal(\"turtle\", false, true));\n11:\n12:         //\
  \ pass class that does check\n13:         print(animals, new CheckIfHopper());\n\
  14:     }\n15:     private static void print(List<Animal> animals, CheckTrait checker)\
  \ {\n16:         for (Animal animal : animals) {\n17:\n18:             // General\
  \ check\n19:             if (checker.test(animal))\n20:                 System.out.print(animal\
  \ + \" \");\n21:         }\n22:     }\n23:         System.out.print(\"\\n\");\n\
  24: }\n```\n（注：上面的代码块根据提供的文本行重构，以确保 Java 结构有效的同时保持原始逻辑）。\n\n这个类看起来很简单——事实也如此。这是\
  \ Lambda 要解决的问题之一。请稍等一下。现在我们拥有了编写代码来查找 `Animal` 能否跳跃所需。\n\n### 学习 Lambda 语法\n\n\
  你可以编写的最简单的 Lambda 表达式就是刚刚看到的那个。\n\n`a -> a.canHop()`\n\nLambda 适用于仅有一个抽象方法的接口。在这种情况下，Java\
  \ 查看了 `CheckTrait` 接口，它有一个方法。我们示例中的 Lambda 建议 Java 调用一个带有 Animal 参数并返回布尔值的方法。\n\n\
  Lambda 的语法很复杂，因为很多部分都是可选的。这两行代码的作用完全相同：\n\n```java\na -> a.canHop()\n(Animal a)\
  \ -> { return a.canHop(); }\n```\n\n让我们看看这里发生了什么。第一个示例如图 8.1 所示，包含三个部分：\n\n*   命名为\
  \ `a` 的单个参数\n*   箭头操作符 (`->`) 用于分隔参数和主体\n*   调用单个方法并返回该方法结果的主体\n\n\n\n\n\n![Java\
  \ 脚本中省略可选部分的 lambda 语法示例结构。变量是一个命名为 `a` 的单个参数，用于分隔参数和主体的箭头运算符，以及一个调用单个方法的正体。](img/image_rsrc10CV.jpg)\n\
  \n图 8.1 省略可选部分的 Lambda 语法\n\n第二个示例展示了返回布尔值的 lambda 最冗长的形式（参见图 8.2）。\n\n*   一个指定名称为\
  \ `a` 的单参数，并声明其类型为 `Animal`\n*   用于分隔参数和正体主体的箭头运算符 (`->`）\n*   包含一行或多行代码的正体，包括一个分号和一个返回语句\n\
  \n![Java 脚本中包含可选部分的 lambda 语法示例结构。变量是一个命名为 `a` 的单个参数并声明其类型为 `Animal`，用于分隔参数和主体的箭头运算符，以及一个包含一行或多行代码的正体，包括一个分号和一个返回语句。](img/image_rsrc10CW.jpg)\n\
  \n图 8.2 包含可选部分的 Lambda 语法\n\n只有当只有一个参数且其类型没有显式声明时，才能省略 lambda 参数周围的括号。Java 这样做是因为开发者通常习惯这样使用\
  \ lambda 表达式，并且尽可能减少输入量。\n\n对你来说，这可能不算新闻：当我们只有一个语句时，是可以省略大括号的。我们在 `if` 语句和循环中已经这样做了。在不使用大括号时，Java\
  \ 允许你省略返回语句和分号（`;`）。当你有两个或多个语句时，这个特殊的快捷方式不起作用。至少这与在别处使用 `{}` 创建代码块的做法是一致的。\n\n图\
  \ 8.1 和图 8.2 中的语法可以混合组合使用。例如，以下内容都是有效的：\n\n```\na -> { return a.canHop(); }\n\n\
  (Animal a) -> a.canHop()\n```\n\n![](img/image_rsrc10B8.jpg)\n\n这里有一个趣知识：`s -> {}`\
  \ 是一个有效的 lambda。如果表达式右侧没有代码，你就不需要分号或返回语句。\n\n表 8.1 显示返回布尔值的有效 lambda 示例。\n\n表 8.1\
  \ 返回布尔值的有效 lambda\n\n| Lambda | 参数数量 |\n| --- | --- |\n| () -> true | 0 |\n| x ->\
  \ x.startsWith(\"test\") | 1 |\n| (String x) -> x.startsWith(\"test\") | 1 |\n|\
  \ (x, y) -> { return x.startsWith(\"test\"); } | 2 |\n| (String x, String y) ->\
  \ x.startsWith(\"test\") | 2 |\n\n第一行接受零参数并始终返回布尔值 `true`。第二行接受一个参数并对其调用该方法，返回结果。第三行也是如此，只是显式地定义了变量\
  \ `x` 的类型。最后两行接收两个参数并忽略了其中一个——并没有规则规定你必须使用所有定义的参数。\n\n现在，让我们确保你能识别表 8.2 中每一行的无效语法，其中每个\
  \ lambda 都应该返回一个布尔值。确保你理解这些内容的错误之处。\n\n表 8.2 应该返回布尔值的无效 lambda\n\n| 无效 lambda |\
  \ 原因 |\n| --- | --- |\n| x, y -> x.startsWith(\"fish\") | 左侧缺少括号 |\n| x -> { x.startsWith(\"\
  camel\"); } | 右侧缺少 return |\n| x -> { return x.startsWith(\"giraffe\") } | 大括号内部缺少分号\
  \ |\n| String x -> x.endsWith(\"eagle\") | 左侧缺少括号 |\n\n记住，只有当存在一个参数且没有声明类型时，括号才是可选的。这些是编写\
  \ lambda 的基础。在章节结束时，我们将介绍关于在 lambda 中使用变量的额外规则。\n\n### 将 Lambda 赋值给 `var`\n\n你认为为什么这行代码无法编译？\n\
  \n```\nvar invalid = (Animal a) -> a.canHop();  // 无法编译\n```\n\n还记得我们讨论过 Java 如何从上下文中推断\
  \ lambda 的信息吗？`var` 也会根据上下文推断类型。这里没有足够的上下文！lambda 或 `var` 都没有足够的信息来确定应该使用哪种函数式接口。\n\
  \n## 编写函数式接口\n\n在本章前面，我们声明了 `CheckTrait` 接口，它供实现者编写的方法正好有一个。lambda 与此类接口有特殊的关系。事实上，这些接口有一个名称。函数式接口（Functional\
  \ interface）是一个包含单个抽象方法的接口。你的朋友 Sam 可以帮助你记住这一点，因为官方正式称为单抽象方法（SAM）规则。\n\n### 定义函数式接口\n\
  \n让我们来看一个函数式接口和实现它的类的示例：\n\n```java\n@FunctionalInterface\npublic interface Sprint\
  \ {\n    public void sprint(int speed);\n}\n\npublic class Tiger implements Sprint\
  \ {\n    public void sprint(int speed) {\n        System.out.println(\"Animal is\
  \ sprinting! \" + speed);\n    }\n}\n```\n\n在这个示例中，`Sprint` 接口是一个函数式接口，因为它只包含一个抽象方法，而\
  \ `Tiger` 类是实现该接口的类。\n\n### @FunctionalInterface 注解\n\n`@FunctionalInterface` 注解告诉编译器你打算让接口成为函数式接口。如果接口不符合函数式接口的规则，编译器将报错。\n\
  \n```java\n@FunctionalInterface  // 无法编译\npublic interface Dance {\n    void move();\n\
  \    void rest();\n}\n```\n\nJava 在某些但并非所有函数式接口上都 `@FunctionalInterface`。这个注解意味着接口的作者承诺在未来在\
  \ lambda 中使用它是安全的。然而，仅仅没有看到注解并不意味着它不是函数式接口。记住，拥有一个抽象方法才是成为函数式接口的关键，而不是注解。\n\n考虑以下四个接口。给定之前的\
  \ `Sprint` 函数式接口，以下哪些是函数式接口？\n\n```java\npublic interface Dash extends Sprint {}\n\
  \npublic interface Skip extends Sprint {\n    void skip();\n}\n\npublic interface\
  \ Sleep {\n    private void snore() {}\n    default int getzzz() { return 1; }\n\
  }\n\npublic interface Climb {\n    void reach();\n    default void fall() {}\n \
  \   static int getBackUp() { return 100; }\n    private static boolean checkHeight()\
  \ { return true; }\n}\n```\n\n这四个都是有效的接口，但并不是所有的都是函数式接口。`Dash` 接口是一个函数式接口，因为它扩展了\
  \ `Sprint` 接口并继承了唯一的抽象方法 `sprint()`。`Skip` 接口不是有效的函数式接口，因为它有两个抽象方法：继承的 `sprint()`\
  \ 方法和声明的 `skip()` 方法。\n\n`Sleep` 接口也不是函数式接口。`snore()` 和 `getzzz()` 都不满足单个抽象方法的标准。尽管默认方法的作用类似于抽象方法（它们可以在实现接口的类中被重写），但它们不足以满足单个抽象方法的要求。\n\
  \n最后，`Climb` 接口是一个函数式接口。尽管定义了一系列静态、私默认方法，它只包含一个抽象方法：`reach()`。\n\n### 添加 Object\
  \ 方法\n\n所有类都继承 `Object` 的某些方法。对于考试，你应该掌握以下 `Object` 方法的签名：\n\n*   `public String\
  \ toString()`\n\n*   `public boolean equals(Object)`\n*   `public int hashCode()`\n\
  \n\n\n\n\n我们现在提到这一点，是因为“单一抽象方法规则”有一个你应该熟悉的例外。如果一个函数式接口包含的抽象方法，与 `Object` 类中的某个公共方法具有相同的签名，那么这些方法不会计入单一抽象方法的测试。该规则背后的动机是，任何实现该接口的类都会像所有类一样继承自\
  \ `Object`，因此总是会实现这些方法。\n\n![](img/image_rsrc10B8.jpg)\n\n由于 Java 假设所有类都继承自 `Object`，因此你不能在接口中声明一个与\
  \ `Object` 不兼容的接口方法。例如，在接口中声明一个抽象方法 `int toString()` 将无法通过编译，因为 `Object` 版本的方法返回的是一个\
  \ `String`。\n\n让我们来看一个例子。`Soar` 类是函数式接口吗？\n\n```java\npublic interface Soar {\n\
  \   abstract String toString();\n}\n```\n\n它不是。由于 `toString()` 是 `Object` 中实现的一个公共方法，它不计入单一抽象方法的测试。另一方面，`Dive`\
  \ 的以下实现是一个函数式接口：\n\n```java\npublic interface Dive {\n   String toString();\n  \
  \ public boolean equals(Object o);\n   public abstract int hashCode();\n   public\
  \ void dive();\n}\n```\n\n`dive()` 方法是唯一的抽象方法，而其他方法由于是在 `Object` 类中定义的公共方法，因此不计数。\n\
  \n注意那些与 `Object` 类方法相似但实际上并未定义在 `Object` 类中的示例。你看到为什么下面这个不是一个有效的函数式接口了吗？\n\n```java\n\
  public interface Hibernate {\n   String toString();\n   public boolean equals(Hibernate\
  \ o);\n   public abstract int hashCode();\n   public void rest();\n}\n```\n\n尽管\
  \ `Hibernate` 接口看起来和我们的 `Dive` 接口相似，但它使用的是 `equals(Hibernate)` 而不是 `equals(Object)`。因为这与\
  \ `Object` 类中定义的 `equals(Object)` 方法签名不匹配，此接口被认为包含两个抽象方法：`equals(Hibernate)` 和 `rest()`。\n\
  \n## 使用方法引用\n\n方法引用是另一种让代码更易读的方式，例如简单提到方法名。和 Lambda 表达式一样，适应新语法也需要时间。在本节中，我们将展示语法以及四种类型的方法引用。我们还会结合\
  \ Lambda 与方法引用使用。\n\n假设我们正在编写一个试图学习如何嘎叫的小鸭子的代码。首先我们有一个函数式接口：\n\n```java\npublic\
  \ interface LearnToSpeak {\n   void speak(String sound);\n}\n```\n\n接下来，我们发现我们的小鸭子很幸运。有一个小鸭子可以配合辅助类。我们省略了教小鸭子如何嘎叫的细节，留下了调用函数式接口的部分：\n\
  \n```java\npublic class DuckHelper {\n   public static void teacher(String name,\
  \ LearnToSpeak learner) {\n      // 保持耐心（省略）\n      learner.speak(name);\n   }\n\
  }\n```\n\n最后，是时候把所有内容整合在一起并见到我们的小鸭子了。这段代码使用 Lambda 实现了函数式接口：\n\n```java\npublic\
  \ class Duckling {\n   public static void makeSound(String sound) {\n      LearnToSpeak\
  \ learner = s -> System.out.println(s);\n      DuckHelper.teacher(sound, learner);\n\
  \   }\n}\n```\n\n还不错。不过有一点冗余。Lambda 声明了一个名为 `s` 的参数。然而，除了将该参数传递给另一个方法外，它什么都没做。方法引用让我们消除了这种冗余，而是写成这样：\n\
  \n```java\nLearnToSpeak learner = System.out::println;\n```\n\n`::` 运算符告诉 Java 稍后调用\
  \ `println()` 方法。适应这种语法需要一点时间。一旦你习惯了，可能会发现你的代码更短了。\n\n\n\n\n\n这一次，我们将调用一个不接受任何参数的实例方法。技巧在于，我们将在事先不知道实例的情况下执行此操作。这次我们需要一个不同的函数式接口，因为它需要感知\
  \ `String` 类型。\n\n```java\ninterface StringParameterChecker {\n    boolean check(String\
  \ text);\n}\n```\n\n我们可以如下实现这个函数式接口：\n\n23: `StringParameterChecker methodRef =\
  \ String::isEmpty;`\n24: `StringParameterChecker lambda = s -> s.isEmpty();`\n26:\
  \ `System.out.println(methodRef.check(\"Zoo\")); // false`\n\n第 23 行表示我们要调用的方法声明在\
  \ `String` 类中。它看起来像是一个静态方法，但实际上不是。相反，Java 知道 `isEmpty()` 是一个不接受任何参数的实例方法。Java 使用运行时提供的参数作为调用方法的实例。\n\
  \n将第 23 行和 24 行与我们实例示例中的第 19 行和 20 行进行比较。它们看起来相似，尽管一个引用了名为 `str` 的局部变量，而另一个只引用了函数式接口的参数。\n\
  \n你甚至可以结合两种类型的实例方法引用。同样，我们需要一个接受两个参数的新函数式接口。\n\n```java\ninterface StringTwoParameterChecker\
  \ {\n    boolean check(String text, String prefix);\n}\n```\n\n在阅读实现时请注意参数的顺序。\n\
  \n26: `StringTwoParameterChecker methodRef = String::startsWith;`\n27: `StringTwoParameterChecker\
  \ lambda = (s, p) -> s.startsWith(p);`\n29: `System.out.println(methodRef.check(\"\
  Zoo\", \"A\")); // false`\n\n由于函数式接口接受两个参数，Java 必须弄清楚它们代表什么。对于实例方法，第一个参数始终是对象的实例。其他的都是方法参数。\n\
  \n记住，第 26 行看起来像是一个静态方法，但它实际上是一个方法引用，声明对象的实例将在稍后指定。第 27 行展示了方法引用的强大之处。这次我们能够替换两个\
  \ lambda 参数。\n\n### 调用构造函数\n\n构造函数引用是方法引用的一种特殊类型，它使用 `new` 而替方法并实例化对象。对于这个示例，我们的函数式接口将不接受任何参数，但将返回一个\
  \ `String`。\n\n```java\ninterface EmptyStringCreator {\n    String create();\n}\n\
  ```\n\n要调用它，我们把 `new` 当作方法名使用。\n\n30: `EmptyStringCreator methodRef = String::new;`\n\
  31: `EmptyStringCreator lambda = () -> new String();`\n33: `var myString = methodRef.create();`\n\
  34: `System.out.println(myString.equals(\"Snake\")); // false`\n\n它的扩展方式与你目前为止看到的方法引用类似。在上一个示例中，lambda\
  \ 没有参数。\n\n方法引用可能会很棘手。这次我们创建了一个接受一个参数并返回结果的函数式接口：\n\n```java\ninterface StringCopier\
  \ {\n    String copy(String value);\n}\n```\n\n在实现中，注意接下来的示例中第 32 行与上一个示例中的第 30\
  \ 行具有的方法引用：\n\n32: `StringCopier methodRef = String::new;`\n33: `StringCopier lambda\
  \ = x -> new String(x);`\n35: `var myString = methodRef.copy(\"Zebra\");`\n36: `System.out.println(myString.equals(\"\
  Zebra\")); // true`\n\n这意味着你不能总是通过观察方法引用来确定可以调用哪个方法。相反，你必须查看上下文以确定使用了哪些参数以及是否有返回值。在这个示例中，Java\
  \ 看到我们正在传递一个 `String` 参数，并调用了接受此类参数的 `String` 构造函数。\n\n### 复习方法引用\n\n阅读方法引用有助于理解代码。表\
  \ 8.3 显示了四种类型的方法引用。如果这个表看起来没意义，请重读上一节。方法引用可能需要尝试几次才能开始变得清晰易懂。\n\n表 8.3 方法引用\n\n\
  | 类型 | 冒号之前 | 冒号之后 | 示例 |\n| --- | --- | --- | --- |\n| 静态方法 | 类名 | 方法名 | `Math::random`\
  \ |\n| 特定对象上的实例方法 | 实例变量名 | 方法名 | `str::startsWith` |\n| 参数上的实例方法 | 类名 | 方法名 | `String::isEmpty`\
  \ |\n| 构造函数 | 类名 | New | `String::new` |\n\n### 使用内置函数式接口\n\n如果每当你想要写 lambda 时都自己编写函数式接口，那将非常不便。幸运的是，为你提供了大量的通用函数式接口。我们在这一节中介绍它们。\n\
  \n表 8.4 中的核心函数式接口提供在 `java.util.function` 包中。我们将在下一章介绍泛型，但目前你只需要知道 `<T>` 允许接口接受指定类型的对象。如果需要第二个类型参数，我们使用下一个字母\
  \ `U`。如果需要不同的返回类型，我们选择 `R`（return）作为泛型类型。\n\n表 8.4 常见函数式接口\n\n| 函数式接口 | 返回类型 | 方法名\
  \ | 参数数量 |\n| --- | --- | --- | --- |\n| `Supplier<T>` | `T` | `get()` | 0 |\n|\
  \ `Consumer<T>` | `void` | `accept(T)` | 1 |\n| `BiConsumer<T, U>` | `void` | `accept(T,\
  \ U)` | 2 |\n| `Predicate<T>` | `boolean` | `test(T)` | 1 |\n| `BiPredicate<T, U>`\
  \ | `boolean` | `test(T, U)` | 2 |\n| `Function<T, R>` | `R` | `apply(T)` | 1 |\n\
  | `BiFunction<T, U, R>` | `R` | `apply(T, U)` | 2 |\n| `UnaryOperator<T>` | `T`\
  \ | `apply(T)` | 1 |\n| `BinaryOperator<T>` | `T` | `apply(T, T)` | 2 |\n\n如果每当你想要写\
  \ lambda 时都自己编写函数式接口，那将非常不便。幸运的是，为你提供了大量的通用函数式接口。我们在这一节中介绍它们。\n\n（后续文本继续）\n\n我们引入这些名称是为了让你更好地理解发生的情况。到下一章，我们将假设你已经掌握了这些，并停止创建中间变量。\n\
  \n![image_rsrc10B8]\n\n你将在书的后续学习一些函数式接口。在下一章中，我们将介绍 `Comparator`。在第 13 章“并发”中，我们将讨论\
  \ `Runnable` 和 `Callable`。当要求识别函数式接口时，这些可能会考试中。\n\n让我们看看如何实现这些接口。由于 lambda 和方法引用在考试中随处可见，我们在可能的情况下展示两者的实现。在介绍接口后，我们还会涵盖这些接口的一些便利方法。\n\
  \n### 实现 Supplier\n\n`Supplier` 用于在不接受任何输入的情况下生成或提供值。`Supplier` 接口定义如下：\n\n```java\n\
  @FunctionalInterface\npublic interface Supplier<T> {\n    T get();\n}\n```\n\n你可以使用工厂方法\
  \ `now()` 创建 `LocalDate` 对象。示例展示了如何使用 `Supplier` 调用该工厂方法：\n\n`Supplier<LocalDate>\
  \ s1 = LocalDate::now;`\n`Supplier<LocalDate> s2 = () -> LocalDate.now();`\n\n`LocalDate\
  \ d1 = s1.get();`\n`LocalDate d2 = s2.get();`\n\n`System.out.println(d1); // 2025-02-20`\n\
  `System.out.println(d2); // 2025-02-20`\n\n这个示例打印了两次日期。这也是复习静态方法的很好的机会。`LocalDate::now`\
  \ 方法引用用于创建一个 `Supplier` 并赋值给中间变量 `s1`。`Supplier` 通常用于构造新对象。例如，我们可以打印两个空的 `StringBuilder`\
  \ 对象。\n\n`Supplier<StringBuilder> s1 = StringBuilder::new;`\n`Supplier<StringBuilder>\
  \ s2 = () -> new StringBuilder();`\n\n`System.out.println(s1.get()); // Empty string`\n\
  `System.out.println(s2.get()); // Empty string`\n\n\n\n\n\n这次，我们使用构造方法引用来创建对象。我们一直在使用泛型来声明我们正在使用的\
  \ `Supplier` 类型。这读起来可能有点长。你能猜出以下代码是做什么的吗？只需一步步来。\n\n```\nSupplier<ArrayList<String>>\
  \ s3 = ArrayList::new;\n\nArrayList<String> a1 = s3.get();\n\nSystem.out.println(a1);\
  \  // []\n```\n\n我们有一个特定类型的 `Supplier`。该类型恰好是 `ArrayList<String>`。然后调用 `get()` 就会创建一个\
  \ `ArrayList<String>` 的新实例，它就是 `Supplier` 的泛型类型——换句话说，一个包含另一个泛型的泛型。当出现此类类型时，请务必仔细查看代码。\n\
  \n注意我们是如何在函数式接口上调用 `get()` 的。如果我们尝试打印 `s3` 本身会发生什么？\n\n```\nSystem.out.println(s3);\n\
  ```\n\n代码打印的内容类似于所示：\n\n```\nfunctionalinterface.BuiltIns$$Lambda$1/0x0000000800066840@4909b8da\n\
  ```\n\n这是对 lambda 表达式调用 `toString()` 的结果。真讨厌。这实际上意味着某些含义。我们的测试类名为 `BuiltIns`，它位于我们创建的名为\
  \ `functionalinterface` 包中。然后是 `$$`，这意味着该类在文件系统的类文件中不存在。它只存在于内存中。你不需要担心其他部分。\n\n\
  ### 实现 Consumer 和 BiConsumer\n\n当你想要对参数进行某些操作但不返回任何内容时，就会使用 `Consumer`。`BiConsumer`\
  \ 执行同样的操作，只是它接收两个参数。接口定义如下：\n\n```java\n@FunctionalInterface\npublic interface Consumer<T>\
  \ {\n   void accept(T t);\n   // 省略默认方法\n}\n\n@FunctionalInterface\npublic interface\
  \ BiConsumer<T, U> {\n   void accept(T t, U u);\n   // 省略默认方法\n}\n```\n\n![](img/image_rsrc10BA.jpg)\n\
  \n你会注意到这种模式。`Bi` 意味着“二”。它源自拉丁语，但你可以从英语单词如 binary（二进制，0 或 1）或 bicycle（双轮车）中记住它。当你看到\
  \ `Bi` 时，接口方法始终将接收两个输入。\n\n打印是 `Consumer` 接口的一个常见用途。\n\n```\nConsumer<String> c1\
  \ = System.out::println;\n\nConsumer<String> c2 = x -> System.out.println(x);\n\n\
  c1.accept(\"Annie\");  // Annie\n\nc2.accept(\"Annie\");  // Annie\n```\n\n`BiConsumer`\
  \ 调用时带有两个参数。它们的类型不需要是相同的。例如，我们可以使用此接口在 map 中放入一个键和一个值：\n\n```java\nvar map = new\
  \ HashMap<String, Integer>();\n\nBiConsumer<String, Integer> b1 = map::put;\n\n\
  BiConsumer<String, Integer> b2 = (k, v) -> map.put(k, v);\n\nb1.accept(\"chicken\"\
  , 7);\n\nb2.accept(\"chick\", 1);\n\nSystem.out.println(map);  // {chicken=7, chick=1}\n\
  ```\n\n输出是 `{chicken=7, chick=1}`，这说明两个 `BiConsumer` 实现都被调用了。在声明 `b1` 时，我们在对象上使用了实例方法引用，因为我们想在局部变量\
  \ `map` 上调用方法。实例化 `b1` 的代码比 `b2` 的代码短得多。这可能就是为什么考试非常喜欢方法引用的原因。\n\n另一个例子是，为两个泛型参数使用相同的类型：\n\
  \n```java\nvar map = new HashMap<String, String>();\n\nBiConsumer<String, String>\
  \ b1 = map::put;\n\nBiConsumer<String, String> b2 = (k, v) -> map.put(k, v);\n\n\
  b1.accept(\"chicken\", \"Cluck\");\n\nb2.accept(\"chick\", \"Tweep\");\n\nSystem.out.println(map);\
  \  // {chicken=Cluck, chick=Tweep}\n```\n\n这表明 `BiConsumer` 可以为 `T` 和 `U` 泛型参数使用相同的类型。\n\
  \n### 实现 Predicate 和 BiPredicate\n\n`Predicate` 通常用于过滤或匹配。两者都是常见操作。`BiPredicate`\
  \ 与 `Predicate` 相似，区别在于它接收两个参数而不是一个。接口定义如下：\n\n```java\n@FunctionalInterface\npublic\
  \ interface Predicate<T> {\n   boolean test(T t);\n   // 省略默认和静态方法\n}\n\n@FunctionalInterface\n\
  public interface BiPredicate<T, U> {\n   boolean test(T t, U u);\n   // 省略默认方法\n\
  }\n```\n\n你可以使用 `Predicate` 来测试条件。\n\n```\nPredicate<String> p1 = String::isEmpty;\n\
  \nPredicate<String> p2 = x -> x.isEmpty();\n\nSystem.out.println(p1.test(\"\"));\
  \  // true\n\nSystem.out.println(p2.test(\"\"));  // true\n```\n\n这打印了两次 true。更有趣的是\
  \ `BiPredicate`。这个例子也打印了两次 true：\n\n```\nBiPredicate<String, String> b1 = String::startsWith;\n\
  \nBiPredicate<String, String> b2 =\n   (string, prefix) -> string.startsWith(prefix);\n\
  \nSystem.out.println(b1.test(\"chicken\", \"ch\")); // true\n```\n\n### 实现 Function\
  \ 和 BiFunction\n\n`Function` 负责将一个参数转换为值。同样，`BiFunction` 负责将两个参数转换为值。接口定义如下：\n\n\
  ```java\n@FunctionalInterface\npublic interface Function<T, R> {\n   R apply(T t);\n\
  \   // 省略默认方法\n}\n\n@FunctionalInterface\npublic interface BiFunction<T, U, R> {\n\
  \   R apply(T t, U u);\n   // 省略默认方法\n}\n```\n\n例如，这个函数将 `String` 转换为其长度：\n\n```\n\
  Function<String, Integer> f1 = String::length;\n\nFunction<String, Integer> f2 =\
  \ x -> x.length();\n\nSystem.out.println(f1.apply(\"\"));  // 0\n\nSystem.out.println(f2.apply(\"\
  \"));  // 0\n```\n\n`BiFunction` 的前两个类型是输入类型。第三个是结果类型。\n\n```\nBiFunction<String,\
  \ String, String> b1 = String::concat;\n\nBiFunction<String, String, String> b2\
  \ = (string, toAdd) -> string.concat(toAdd);\n\nSystem.out.println(b1.apply(\"baby\
  \ \", \"chick\"));  // baby chick\n\nSystem.out.println(b2.apply(\"baby \", \"chick\"\
  ));  // baby chick\n```\n\n### 实现 UnaryOperator 和 BinaryOperator\n\n`UnaryOperator`\
  \ 和 `BinaryOperator` 是 `Function` 的特例。它们要求所有泛型参数都是相同的。`UnaryOperator` 将值转换为相同类型。例如，增加\
  \ 1 是一个元操作。事实上，`UnaryOperator` 继承自 `Function`。`BinaryOperator` 将两个值合并为相同类型。同样，`BinaryOperator`\
  \ 继承自 `BiFunction`。接口定义如下：\n\n```java\n@FunctionalInterface\npublic interface UnaryOperator<T>\
  \ extends Function<T, T> {\n   // 省略静态方法\n}\n\n@FunctionalInterface\npublic interface\
  \ BinaryOperator<T> extends BiFunction<T, T, T> {\n   // 省略静态方法\n}\n```\n\n这意味着方法签名如下：\n\
  \n```\nT apply(T t); // UnaryOperator\nT apply(T t1, T t2); // BinaryOperator\n\
  ```\n\n在 Javadoc 中，你会注意到这些方法继承自 `Function`/BiFunction`。子类的泛型声明强制了类型相同。对于元操作，注意返回类型与参数类型相同。\n\
  \n```\nUnaryOperator<String> u1 = String::toUpperCase;\n\nUnaryOperator<String>\
  \ u2 = x -> x.toUpperCase();\n\nSystem.out.println(u1.apply(\"chirp\"));  // CHIRP\n\
  \nSystem.out.println(u2.apply(\"chirp\"));  // CHIRP\n```\n\n这打印了两次 CHIRP。我们不需要在泛型中指定返回类型，因为\
  \ `UnaryOperator` 要求它与参数相同。现在是二元操作：\n\n```\nBinaryOperator<String> b1 = String::concat;\n\
  \nBinaryOperator<String> b2 = (string, toAdd) -> string.concat(toAdd);\n\nSystem.out.println(b1.apply(\"\
  baby \", \"chick\"));  // baby chick\n```\n\n\n\n\n\n```java\nSystem.out.println(b2.apply(\"\
  baby \", \"chick\")); // baby chick\n```\n\n注意，这与 `BiFunction` 示例的作用相同。代码更加简洁，这显示了使用最佳函数式接口的重要性。与其指定三个类型，只需指定一个泛型要好得多。\n\
  \n### 检查函数式接口\n\n了解每个函数式接口的参数数量、类型、返回值和方法名称非常重要。如果你还没有背过，现在是记忆 表 8.4 的好时机。让我们通过一些例子来练习。\n\
  \n在以下三种情况下，你会使用哪种函数式接口？\n\n* 不接受任何参数并返回一个 String\n* 接收一个 String 并返回一个 Boolean\n\
  * 接收两个 Integer 并返回一个 Integer\n\n好了吗？在继续之前想想你的答案。真的，你必须对此烂熟于心。好的，第一个是 `Supplier<String>`，因为它生成一个对象且接受零参数。第二个是\
  \ `Function<String,Boolean>`，因为它接受一个参数并返回另一种类型。这有点棘手。你可能认为它是 `Predicate<String>`。注意\
  \ `Predicate` 返回的是布尔原始类型而不是 `Boolean` 对象。\n\n最后，第三个是 `BinaryOperator<Integer>` 或\
  \ `BiFunction<Integer,Integer,Integer>`。由于 `BinaryOperator` 是 `BiFunction` 的特殊情况，两者任一都是正确答案。`BinaryOperator<Integer>`\
  \ 是更好的答案，因为它更具体。\n\n让我们再次尝试这个练习，但使用代码。使用代码会更。你做的第一件事是看 lambda 接受多少个参数以及是否有返回值。你会用哪种函数式接口来填充空白？\n\
  \n```java\n6:  ___________<List> ex1 = x -> \"\".equals(x.get(0));\n7:  ___________<Long>\
  \ ex2 = (Long l) -> System.out.println(l);\n8:  ___________<String, String> ex3\
  \ = (s1, s2) -> false;\n```\n\n同样，在继续之前想想答案。好了吗？第 6 行向 lambda 传递了一个 `List` 参数并返回布尔值。这告诉我们它是\
  \ `Predicate` 或 `Function`。由于泛型声明只有一个参数，所以它是 `Predicate`。\n\n第 7 行向 lambda 传递了一个\
  \ `Long` 参数且没有返回值。这告诉我们它是 `Consumer`。第 8 行接收两个参数并返回布尔值。当你看到返回布尔值时，除非泛型指定了 `Boolean`\
  \ 返回类型，否则考虑 `Predicate`。在这种情况下，有两个参数，所以它是 `BiPredicate`。\n\n你觉得这些容易吗？如果觉得不像，请再次查看\
  \ 表 8.4。我们不是在开玩笑。你需要非常熟悉这张表。现在你刚学完这张表，我们将来玩“找错误”。这些题目是设计用来故意为难的。\n\n```java\n6:\
  \ Function<List<String>> ex1 = x -> x.get(0); // 无法编译\n7: UnaryOperator<Long> ex2\
  \ = (Long l) -> 3.14; // 无法编译\n```\n\n第 6 行声称是一个 `Function`。`Function` 需要指定两个泛型类型：输入参数类型和返回值类型。第\
  \ 6 行缺少返回值类型，导致代码无法编译。第 7 行是 `UnaryOperator`，它返回的类型与传入的类型相同。示例返回的是 `double` 而不是\
  \ `Long`，导致代码无法编译。\n\n### 在函数式接口使用便利方法\n\n根据定义，所有函数式接口都有一个抽象方法。但这并不意味着它们只能有一个方法。一些常见的函数式接口提供了许多有用的默认接口方法。\n\
  \n表 8.5 显示了考试需要需要的内置函数式接口的便利方法。所有这些方法都便于修改或组合相同类型的函数式接口。注意 表 8.5 只显示了主要接口。`BiConsumer`、`BiFunction`\
  \ 和 `BiPredicate` 接口也有类似的方法。\n\n表 8.5 便利方法\n\n| 接口实例 | 方法返回类型 | 方法名 | 方法参数 |\n|\
  \ --- | --- | --- | --- |\n| Consumer | Consumer | `andThen()` | Consumer |\n| Function\
  \ | Function | `andThen()` | Function |\n| Function | Function | `compose()` | Function\
  \ |\n| Predicate | Predicate | `and()` | Predicate |\n| Predicate | Predicate |\
  \ `negate()` | — |\n| Predicate | Predicate | `or()` | Predicate |\n\n让我们从这两个 `Predicate`\
  \ 变量开始：\n\n```java\nPredicate<String> egg = s -> s.contains(\"egg\");\nPredicate<String>\
  \ brown = s -> s.contains(\"brown\");\n```\n\n现在我们想要一个针对棕色蛋的 `Predicate`，另一个针对所有其他颜色的蛋的。我们可以像这里所示这样手动编写：\n\
  \n```java\nPredicate<String> brownEggs = s -> s.contains(\"egg\") && s.contains(\"\
  brown\");\nPredicate<String> otherEggs = s -> s.contains(\"egg\") && !s.contains(\"\
  brown\");\n```\n\n这行得通，但并不完美。它有点长，而且包含重复内容。如果我们决定 egg 中的字母 `e` 应该大写呢？我们需要在三个变量中修改它：`egg`、`brown`、`otherEggs`。\n\
  \n\n\n\n大多数函数接口都是针对 `double`、`int` 和 `long` 的。表 8.6 显示了这些基本类型对应表 8.4 的等效内容。你可能不会对需要记忆这些内容而感到意外。幸运的是，你现在已经记住了表\
  \ 8.4，并且可以将所学的知识应用到表 8.6。\n\n### 表 8.6 针对基本类型的常用函数接口\n\n| 函数接口 | 返回类型 | 单个抽象方法 |\
  \ 参数个数 |\n| --- | --- | --- | --- |\n| `DoubleSupplier`, `IntSupplier`, `LongSupplier`\
  \ | `double`, `int`, `long` | `getAsDouble()`, `getAsInt()`, `getAsLong()` | 0 |\n\
  | `Consumer`, `IntConsumer`, `LongConsumer` | `void` | `accept()` | 1 (double),\
  \ 1 (int), 1 (long) |\n| `Predicate`, `IntPredicate`, `LongPredicate` | `boolean`\
  \ | `test()` | 1 (double), 1 (int), 1 (long) |\n| `DoubleFunction<R>`, `IntFunction<R>`,\
  \ `LongFunction<R>` | `R` | `apply()` | 1 (double), 1 (int), 1 (long) |\n| `DoubleUnaryOperator`,\
  \ `IntUnaryOperator`, `LongUnaryOperator` | `double`, `int`, `long` | `applyAsDouble()`,\
  \ `applyAsInt()`, `applyAsLong()` | 1 (double), 1 (int), 1 (long) |\n| `DoubleBinaryOperator`,\
  \ `IntBinaryOperator`, `LongBinaryOperator` | `double`, `int`, `long` | `applyAsDouble()`,\
  \ `applyAsInt()`, `applyAsLong()` | 2 (double, double), 2 (int, int), 2 (long, long)\
  \ |\n\n有几点不同之处需要注意，这些不同点存在于表 8.4 和表 8.6 之间。\n\n*   某些接口中删除了泛型，而是通过类型名称告诉我们涉及的是哪种基本类型。在其他情况下，例如\
  \ `IntFunction`，只需要返回类型的泛型，因为我们正在将基本类型 `int` 转换为对象。\n*   当返回基本类型时，单个抽象方法的名称通常会被重命名。\n\
  \n除了表 8.4 的等效接口外，某些接口是专门针对基本类型的。表 8.7 列出了这些接口。\n\n### 表 8.7 特定的基本类型函数接口\n\n| 函数接口\
  \ | 返回类型 | 单个抽象方法 | 参数个数 |\n| --- | --- | --- | --- |\n| `ToDoubleFunction<T>`,\
  \ `ToIntFunction<T>`, `ToLongFunction<T>` | `double`, `int`, `long` | `applyAsDouble()`,\
  \ `applyAsInt()`, `applyAsLong()` | 1 (T) |\n| `ToDoubleBiFunction<T, U>`, `ToIntBiFunction<T,\
  \ U>`, `ToLongBiFunction<T, U>` | `double`, `int`, `long` | `applyAsDouble()`, `applyAsInt()`,\
  \ `applyAsLong()` | 2 (T, U) |\n| `DoubleToIntFunction`, `DoubleToLongFunction`,\
  \ `IntToDoubleFunction`, `IntToLongFunction`, `LongToDoubleFunction`, `LongToIntFunction`\
  \ | `int`, `long`, `double`, `long`, `double`, `int` | `applyAsInt()`, `applyAsLong()`,\
  \ `applyAsDouble()`, `applyAsLong()`, `applyAsDouble()`, `applyAsInt()` | 1 (double),\
  \ 1 (double), 1 (int), 1 (int), 1 (long), 1 (long) |\n| `ObjDoubleConsumer<T>`,\
  \ `ObjIntConsumer<T>`, `ObjLongConsumer<T>` | `void` | `accept()` | 2 (T, double),\
  \ 2 (T, int), 2 (T, long) |\n\n我们已经使用函数接口有一段时间了，所以你应该已经很熟悉如何阅读这些表格。让我们来看一个例子以确保理解。你会使用哪个函数接口来填充空白，使以下代码能够编译？\n\
  \n```java\nvar d = 1.0;\n\n______________ f1 = x -> 1;\n\nf1.applyAsInt(d);\n```\n\
  \n当你看到这样的问题时，请寻找线索。你可以看到所说的函数接口接受一个 `double` 参数并返回一个 `int`。你还可以看到它有一个名为 `applyAsInt`\
  \ 的单个抽象方法。`DoubleToIntFunction` 和 `ToIntFunction` 接口都符合这三个标准。\n\n## 在 Lambda 中使用变量\n\
  \n现在我们已经学习了函数接口，我们将使用它们来展示变量的不同处理方法。相对于 Lambda 来说，变量可以出现在三个地方：参数列表、Lambda 体内部声明的局部变量，以及从\
  \ Lambda 体中引用的变量。这三者都是考试设置陷阱的机会。我们将探索每一种情况，以便在陷阱出现时你保持警惕！\n\n### 列出参数\n\n在本章稍早之前，你学习了如何列出参数。\n\
  \n（注：由于提供的原文文本后续似乎存在重复或乱码内容，此处根据您提供的翻译逻辑进行结构处理。若原文内容有误，请提供准确的源文本。）\n\n*注：由于您提供的待翻译文本在“Listing\
  \ Parameters”之后出现了大量逻辑重复且无意义的英文片段（如 \"The exam might ask you...\" 的重复描述），我已根据文档工程师逻辑进行了结构化翻译。如果需要翻译特定的后续文本，请重新提供。*\n\
  \n\n\n变量 `p1` 末尾缺少一个分号。在 `}` 之前有一个分号，但它是在代码块内部。虽然你通常不需要寻找漏掉的分号，但在这一领域 lambda 比较棘手，所以务加小心！\n\
  \n## ![](img/image_rsrc10BB.jpg) 真实世界场景\n\n### 保持你的 Lambda 短小\n\n\n\n一个包含多行和返回语句的\
  \ lambda 通常是你应该进行重构并将该代码放入方法中的线索。例如，上一个示例可以重写如下：\n\n```java\nPredicate<Integer>\
  \ p1 = a -> returnSame(a);\n```\n\n这种更简单的形式可以进一步重构为使用方法引用：\n\n```java\nPredicate<Integer>\
  \ p1 = this::returnSame;\n```\n\n你可能会奇怪为什么这如此重要。在第 10 章中，lambda 和方法引用被用于链式方法调用。lambda\
  \ 越短，代码就越易读。\n\n### 在 Lambda 句体内引用变量\n\nLambda 句体允许引用周围代码中的某些变量。以下代码是合法的：\n\n```java\n\
  public class Crow {\n    private String color;\n    public void caw(String name)\
  \ {\n        String volume = \"loudly\";\n        Consumer<String> consumer = s\
  \ ->\n            System.out.println(name + \" says \"\n                    + volume\
  \ + \" that she is \" + color);\n    }\n}\n```\n\n这表明 lambda 在某些条件下可以访问实例变量、方法参数或局部变量。实例变量（以及类变量）总是被允许的。\n\
  \nlambda 无法访问的不是最终的（final）或有效最终的（effectively final）的变量。如果你需要复习有效最终变量，请参第 5 章“方法”。\n\
  \n当你观察变量不是有效最终的的编译器错误发生的位置时，情况会变得更有趣了。\n\n```java\n2:  public class Crow {\n3: \
  \     private String color;\n4:      public void caw(String name) {\n5:        \
  \  String volume = \"loudly\";\n6:          name = \"Caty\";\n7:          color\
  \ = \"black\";\n8:\n9:          Consumer<String> consumer = s ->\n10:          \
  \   System.out.println(name + \" says \"      // 编译失败\n11:                 + volume\
  \ + \" that she is \" + color);  // 编译失败\n12:         volume = \"softly\";\n13:\
  \     }\n14: }\n```\n\n在这个示例中，方法参数名 `name` 不是有效最终的，因为它在第 6 行被设置了。然而，编译器错误发生在第 10\
  \ 行。给非最终变量赋值并没有问题。但是，一旦 lambda 尝试使用它，我们就有了问题。由于该变量不再是有效最终的，因此 lambda 不允许使用该变量。\n\
  \n变量 `volume` 也不是有效最终的，因为它在第 12 行被更新。在这种情况下，编译器错误在第 11 行。那是在重新赋值之前！再次，赋值的动作仅从 lambda\
  \ 的角度来看才是一个问题。因此，lambda 必须是生成编译器错误的方。\n\n复一下，请确保你已经背下了表 8.8。\n\n### 表 8.8 在方法内部从\
  \ lambda 句体访问变量的规则\n\n| 变量类型 | 规则 |\n| --- | --- |\n| 实例变量 | 允许 |\n| 静态变量 | 允许 |\n\
  | 局部变量 | 如果 final 或有效 final 则允许 |\n| 方法参数 | 如果 final 或有效 final 则允许 |\n| Lambda 参数\
  \ | 允许 |\n\n### 总结\n\n我们在本章花费了大量时间教你如何使用 lambda 表达式，这是有原因的。接下来两章很大取决于你创建和使用 lambda\
