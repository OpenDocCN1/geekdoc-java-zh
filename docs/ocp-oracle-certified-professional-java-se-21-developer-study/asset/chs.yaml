  hi\", \"IN\"));  // hi_IN\n```\n\n第一个是法语，第二个是印度的印地语。同样，你不需要记住这些代码。Java 允许你创建一个带有无效语言或国家的\
  \ `Locale`，例如 `xx_XX`。然而，它将无法匹配你想使用的 `Locale`，你的程序行为将不会符合预期。\n\n还有第三种创建 `Locale`\
  \ 的方法，它更加灵活。构建器设计模式允许你设置所有关心的属性，最后再构建 `Locale`。这意味着你可以以任何顺序指定属性。以下两个 `Locale` 值都代表\
  \ `en_US`：\n\n```java\nLocale l1 = new Locale.Builder()\n   .setLanguage(\"en\"\
  )\n   .setRegion(\"US\")\n   .build();\n\nLocale l2 = new Locale.Builder()\n   .setRegion(\"\
  US\")\n   .setLanguage(\"en\")\n   .build();\n```\n\n![](img/image_rsrc10B8.jpg)\n\
  \n实际上还有第四种创建 `Locale` 实例的方法，使用 `Locale` 构造函数，例如 `new Locale(\"en\")` 或 `new Locale(\"\
  en\", \"US\")`。这些构造函数现在已弃用，请使用之前的三种技术之一。\n\n在测试程序时，你可能需要使用计算机默认之外的 `Locale`。\n\n\
  ```java\nSystem.out.println(Locale.getDefault());  // en_US\nLocale locale = Locale.of(\"\
  fr\");\nLocale.setDefault(locale);\nSystem.out.println(Locale.getDefault());  //\
  \ fr\n```\n\n尝试一下不用担心——Locale 只会在那一个 Java 程序中更改。它不会改变你计算机上的任何设置。它甚至不会改变同一程序的后续执行。\n\
  \n![](img/image_rsrc10B8.jpg)\n\n考试可能会使用 `setDefault()`，因为它无法假设你所处的位置。在实践中，我们很少编写代码来更改用户的默认\
  \ locale。\n\n## 数字本地化\n\n你可能会感到惊讶，格式化或解析货币和数值值会根据你的 locale 而改变。例如，在美国，美元符号位于数值之前，并且对于小于\
  \ 1 美元的数值，会带有一个小数点，例如 $2.15。但在德国，欧元符号附加在数值之后，且对于小于 1 欧元的数值会使用逗号，例如 2,15 €。\n\n幸运的是，`java.text`\
  \ 包包含了解决这些问题的类。后续章节涵盖了如何根据 locale 格式化数字、货币和日期。\n\n格式化或解析数据的第一步相同：获取 `NumberFormat`\
  \ 实例。表 11.8 显示了可用的工厂方法。\n\n### 获取 NumberFormat 的工厂方法\n\n| 说明 | 使用默认 Locale | 指定\
  \ Locale |\n| :--- | :--- | :--- |\n| 通用格式化器 | `NumberFormat.getInstance()` | `NumberFormat.getInstance(locale)`\
  \ |\n| 与 getInstance 相同 | `NumberFormat.getNumberInstance()` | `NumberFormat.getNumberInstance(locale)`\
  \ |\n| 用于格式化金额 | `NumberFormat.getCurrencyInstance()` | `NumberFormat.getCurrencyInstance(locale)`\
  \ |\n| 用于格式化百分比 | `NumberFormat.getPercentInstance()` | `NumberFormat.getPercentInstance(locale)`\
  \ |\n| 在显示前舍入小数值 | `NumberFormat.getIntegerInstance()` | `NumberFormat.getIntegerInstance(locale)`\
  \ |\n| 返回紧凑数字格式化器 | `NumberFormat.getCompactNumberInstance()` | `NumberFormat.getCompactNumberInstance(locale,\
  \ formatStyle)` |\n\n一旦你有了 `NumberFormat` 实例，就可以调用 `format()` 将数字转换为 String，或者可以使用\
  \ `parse()` 将 String 转换为数字。\n\n![](img/image_rsrc0BA.jpg)\n\n格式化类不是线程安全的。不要将它们存储在实例变量或静态变量中。在第\
  \ 13 章中了解更多关于线程安全的知识。\n\n### 格式化数字\n\n当我们格式化数据时，将其从结构化对象或原始值转换为 String。`NumberFormat.format()`\
  \ 方法根据与 `NumberFormat` 对象关联的 locale 格式化给定数字。\n\n让我们回到我们的动物园看一会儿。为了营销，我们想分享圣地亚动物园的平均每月访问人数。以下显示了在三个不同的\
  \ locale 下打印同一个数字：\n\n```java\nint attendeesPerYear = 3200000;\nint attendeesPerMonth\
  \ = attendeesPerYear / 12;\nvar us = NumberFormat.getInstance(Locale.US);\nSystem.out.println(us.format(attendeesPerMonth));\
  \ // 266,666\nvar gr = NumberFormat.getInstance(Locale.GERMANY);\nSystem.out.println(gr.format(attendeesPerMonth));\
  \ // 266.666\nvar ca = NumberFormat.getInstance(Locale.CANADA_FRENCH);\nSystem.out.println(ca.format(attendeesPerMonth));\
  \ // 266 666\n```\n\n\n\n货币字符串 `\"$92,807.99\"` 包含一个美元符号和一个逗号。`parse` 方法会剥离这些字符并将值转换为数字。`parse`\
  \ 的返回值是一个 `Number` 对象。`Number` 是所有 `java.lang` 包装类的父类，因此返回值可以强制转换为适当的数据类型。该 `Number`\
  \ 被强制转换为 `Double`，然后自动拆箱为 `double`。\n\n## 使用 CompactNumberFormat 进行格式化\n\n考试中你还需要了解的第二个继承自\
  \ `NumberFormat` 的类是 `CompactNumberFormat`。如果你以前没见过它，不要担心，我们将在本节中介绍它。\n\n`CompactNumberFormat`\
  \ 与 `DecimalFormat` 类似，但它设计用于打印空间可能有限的地方。它具有“主见性”，因为它会为你选择一种格式；并且具有“特定特定性”，因为输出会根据你的位置而改变。\n\
  \n考虑以下示例代码，它对一组本地区域应用了 `CompactNumberFormat`，并对 `Style`（一个具有 `SHORT` 或 `LONG` 值的枚举）使用了静态导入：\n\
  \n```java\nvar formatters = Stream.of(\n    NumberFormat.getCompactNumberInstance(),\n\
  \    NumberFormat.getCompactNumberInstance(Locale.getDefault(), Style.SHORT),\n\
  \    NumberFormat.getCompactNumberInstance(Locale.getDefault(), Style.LONG),\n \
  \   NumberFormat.getCompactNumberInstance(Locale.GERMAN, Style.SHORT),\n    NumberFormat.getCompactNumberInstance(Locale.GERMAN,\
  \ Style.LONG),\n    NumberFormat.getNumberInstance());\nformatters.map(s -> s.format(7_123_456)).forEach(System.out::println);\n\
  ```\n\n此代码在 `en_US` 本地区域运行时输出内容如下（为了可读性添加了换行）：\n\n```\n7M\n7M\n7 million\n7 Mio.\n\
  7 Millionen\n7,123,456\n```\n\n注意前两行是相同的。如果你不指定样式，默认将使用 `SHORT`。接下来，注意除最后一个值（它没有使用紧凑数字格式化器）外，其他值都被截断了。这就是它被称为紧凑数字格式化器的原因之一！此外，注意短格式对大值使用了常用标签，例如代表千的\
  \ `K`。最后但同样重要的是，当你运行此代码时输出可能有所不同，因为它是在 `en_US` 本地区域运行的。\n\n使用相同的格式化器，让我们尝试另一个示例：\n\
  \n```java\nformatters.map(s -> s.format(314_900_000)).forEach(System.out::println);\n\
  ```\n\n这在 `en_US` 本地区域运行时输出如下：\n\n```\n315M\n315M\n315 million\n315 Mio.\n315 Millionen\n\
  314,900,000\n```\n\n注意，对于使用 `CompactNumberFormat` 的条目，第三位数字会自动四舍五入。以下是 `CompactNumberFormat`\
  \ 的规则总结：\n\n- 首先，它确定数字的最高范围，例如千 (`K`)、百万 (`M`)、十亿 (`B`) 或万亿 (`T`)。\n- 然后它返回该范围的前三个数字，根据需要对最后一位进行舍。\n\
  - 最后，它打印一个标识符。如果使用 `SHORT`，则返回符号。如果使用 `LONG`，则返回一个空格后跟一个单词。\n\n对于考试，请确保你理解 `SHORT`\
  \ 和 `LONG` 格式之间的差异，以及像代表百万的 `M` 常用符号。\n\n![](img/image_rsrc10B8.jpg)\n\n虽然显然不在考试范围内，但如果值高于支持的范围，某些\
  \ `CompactNumberFormat` 实例将显示三个以上的数字。例如，在之前的示例中使用 `Long.MAX_VALUE` 将显示七位数字 (`9223372T`)，因为万亿\
  \ (`10¹²`) 是该实例将使用的最高范围。\n\n`CompactNumberFormat` 也可以用于解析，尽管并不总是以你预期的方式工作！考虑这个示例：\n\
  \n```java\n20: var locale = Locale.of(\"en\", \"US\");\n21: var compact = NumberFormat.getCompactNumberInstance(\n\
  22:     locale, Style.SHORT);\n23: System.out.println(compact.format(1_000_000));\
  \  // 1M\n24: System.out.println(compact.parse(\"1M\"));         // 1000000\n25:\
  \ System.out.println(compact.parse(\"1000000\"));    // 1000000\n26: System.out.println(compact.parse(\"\
  1,000,000\")); // 1\n27: System.out.println(compact.parse(\"$1000000\"));  // ParseException\n\
  ```\n\n第 20-23 行看起来很熟悉。它们使用短格式 `1M` 打印百万。第 24 行和第 25 行显示该格式可以接受原始格式或缩短格式。第 26 行可能会让你惊讶，因为\
  \ Java 在初始标点符号处停止并只打印 1。相比之下，第 27 行就太过分了。Java 不知道如何处理 `$` 并会抛出 `ParseException`。\n\
  \n### 日期本地化\n\n和数字一样，日期格式可以随本地区域而异。表 11.9 显示了获取 `DateTimeFormatter` 实例的方法：\n\n|\
  \ 描述 | 使用默认值 |\n| --- | --- |\n| 日期 | `DateTimeFormatter.ofLocalizedDate(FormatStyle)`\
  \ |\n| 时间 | `DateTimeFormatter.ofLocalizedTime(FormatStyle)` |\n| 日期和时间 | `DateTimeFormatter.ofLocalizedDateTime(FormatStyle,\
  \ FormatStyle)` |\n\n每个方法都接受一个 `FormatStyle` 参数（`SHORT`、`MEDIUM`、`LONG`）。对于考试，你需要了解这些可能的值。如果你需要特定的本地区域怎么办？只需在调用时添加\
  \ `withLocale(locale)` 即可。让我们将其整合。查看以下代码片段：\n\n```java\npublic static void print(DateTimeFormatter\
  \ dtf, Locale locale) {\n    System.out.println(dtf.withLocale(locale).format(dateTime)\
  \ + \" --- \");\n}\n\npublic static void main(String[] args) {\n    Locale.setDefault(Locale.of(\"\
  en\", \"US\"));\n    var italy = Locale.of(\"it\", \"IT\");\n    var dt = LocalDateTime.of(2025,\
  \ Month.OCTOBER, 20, 15, 30);\n\n    System.out.println(dtf.ofLocalizedDate(FormatStyle.SHORT).format(dt));\
  \ // 10/20/25\n    System.out.println(dtf.ofLocalizedTime(FormatStyle.SHORT).format(dt));\
  \ // 15:30\n    System.out.println(dtf.ofLocalizedDateTime(FormatStyle.SHORT, FormatStyle.SHORT).format(dt));\
  \ // 10/20/25, 15:30\n}\n```\n\n### 指定本地区域类别\n\n当你调用 `Locale.setDefault(locale)`\
  \ 时，内部会选择若干显示和格式选项。如果你需要对默认本地区域进行细粒度的控制，Java 使用 `Locale.Category` 枚举将格式选项分为不同的类别。\n\
  \n`Locale.Category` 枚举是 `Locale` 中的一个嵌套元素，支持显示和格式化的不同本地区域。对于考试，你应该熟悉 表 11.10 中的两个值。\n\
  \n表 11.10 Locale.Category 值\n\n| 值 | 描述 |\n| --- | --- |\n| DISPLAY | 用于显示本地区域数据的类别\
  \ |\n| FORMAT | 用于格式化日期、数字或货币的类别 |\n\n当你调用 `Locale.setDefault(locale)` 时，`DISPLAY`\
  \ 和 `FORMAT` 会一起设置。让我们看一个示例：\n\n```java\npublic static void printCurrency(Locale\
  \ locale, double money) {\n    System.out.println(\n        NumberFormat.getCurrencyInstance().format(money)\n\
  \        + \", \" + locale.getDisplayLanguage());\n}\n\npublic static void main(String[]\
  \ args) {\n    var spain = Locale.of(\"es\", \"ES\");\n    var money = 1.23;\n\n\
  \    // 使用默认本地区域打印\n    Locale.setDefault(Locale.of(\"en\", \"US\"));\n    printCurrency(spain,\
  \ money); // $1.23, Spanish\n\n    // 使用指定的本地区域显示打印\n    Locale.setDefault(Category.DISPLAY,\
  \ spain);\n    printCurrency(spain, money); // $1.23, español\n\n    // 使用指定的本地区域格式打印\n\
  \    Locale.setDefault(Category.FORMAT, spain);\n    printCurrency(spain, money);\
  \ // €1,23, español\n}\n```\n\n\n\n\n```java\nprintCurrency(spain, money);  // 1,23\
  \ €, español\n\n}\n```\n\n这段代码打印了三次相同的数据。首先，它使用 `en_US` 区域打印 `money` 变量和 `spain`\
  \ 的语言值。然后，它使用 `es_ES` 的 `DISPLAY` 类别打印，而 `FORMAT` 类别保持为 `en_US`。最后，它在两个类别都设置为 `es_ES`\
  \ 的情况下打印数据。\n\n对于考试来说，你不需要记忆每个类别的各种显示和格式选项。你只需要知道你可以独立设置区域的 set。你还应该知道，在执行上述代码段之后调用\
  \ `Locale.setDefault(Locale.US)` 将将两个区域类别都改为 `en_US`。\n\n# 使用资源包（Resource Bundles）加载属性\n\
  \n到目前为止，我们一直将显示给用户的所有文本字符串作为程序的一部分，存储在使用它们的类中。本地化要求将它们外部化到其他地方。\n\n资源包（Resource\
  \ bundle）包含了程序使用的、特定于区域的对象。它就像一个带有键和值的映射表。资源包通常存储在属性文件（properties file）中。属性文件是一种特定格式的文本文件，包含键/值对。\n\
  \n我们的动物园程序非常成功。现在我们收到了另外三家动物园使用它的请求！我们已经有了对美国动物园的支持。现在我们需要添加法国的帕尔米尔动物园（Zoo de La\
  \ Palmyre）、加拿大英语地区的温哥动物园（Greater Vancouver Zoo）以及加拿大法语地区的格兰比动物园（Zoo de Granby）。\n\
  \n我们立即意识到我们需要对程序进行国际化。资源包将非常有帮助。它们能让我们轻松地将应用程序翻译到多个区域，甚至同时支持多个区域。如果以后更多国家的动物园感兴趣，也可以轻松添加更多区域。我们考虑了需要支持哪些区域，得出了这四个：\n\
  \n```java\nLocale us = Locale.of(\"en\", \"US\");\nLocale france = Locale.of(\"\
  fr\", \"FR\");\nLocale englishCanada = Locale.of(\"en\", \"CA\");\nLocale frenchCanada\
  \ = Locale.of(\"fr\", \"CA\");\n```\n\n在接下来的章节中，我们将使用属性文件创建一个资源包。它在概念上类似于一个 `Map<String,String>`，每行代表一个不同的键/值。键和值由等号\
  \ (`=`) 或冒号 (`:`) 分隔。为了简单起见，我们在整个章节中使用等号。我们还将查看 Java 如何决定使用哪一个资源包。\n\n## 创建资源包\n\
  \n我们将更新应用程序以支持之前列出的四个区域。幸运的是，Java 并不要求我们创建四个不同的资源包。如果没有特定国家的资源包，Java 将使用特定语言的资源包。情况会比这稍微复杂一点，但让我们从一个简单的示例开始。\n\
  \n现在，我们需要为动物园资源包准备英语和法语属性文件。首先，创建两个属性文件。\n\n**Zoo_en.properties**\n```properties\n\
  hello=Hello\nopen=The zoo is open\n```\n\n**Zoo_fr.properties**\n```properties\n\
  hello=Bonjour\nopen=Le zoo est ouvert\n```\n\n文件名与我们的资源包名称 `Zoo` 。随后是下划线（`_`）、目标区域和\
  \ `.properties` 文件扩展名。我们可以编写第一个使用资源包来打印这些信息的程序。\n\n```java\n10: public static void\
  \ printWelcomeMessage(Locale locale) {\n11:     var rb = ResourceBundle.getBundle(\"\
  Zoo\", locale);\n12:     System.out.println(rb.getString(\"hello\")\n13:       \
  \  + \", \" + rb.getString(\"open\"));\n14: }\n15: public static void main(String[]\
  \ args) {\n16:     var us = Locale.of(\"en\", \"US\");\n17:     var france = Locale.of(\"\
  fr\", \"FR\");\n18:     printWelcomeMessage(us);     // Hello, The zoo is open\n\
  19:     printWelcomeMessage(france); // Bonjour, Le zoo est ouvert\n20: }\n```\n\
  \n第 16 和 17 行创建了我们想要测试的两个区域，但 10-14 行的方法执行了实际工作。第 11 行调用 `ResourceBundle` 上的工厂方法来获取正确的资源包。第\
  \ 12 和 13 行从资源包检索正确的字符串并打印结果。\n\n由于资源包包含键/值对，你甚至可以遍历它们来列出所有的对。`ResourceBundle` 类提供了一个\
  \ `keySet()` 方法来获取所有键的集合。\n\n```java\nvar us = Locale.of(\"en\", \"US\");\nResourceBundle\
  \ rb = ResourceBundle.getBundle(\"Zoo\", us);\nrb.keySet().stream()\n    .map(k\
  \ -> k + \": \" + rb.getString(k))\n    .forEach(System.out::println);\n```\n\n\
  这个示例遍历了所有的键。它在打印所有内容之前，将每个键映射到一个包含键和对应值的 `String`。\n\n```text\nhello: Hello\nopen:\
  \ The zoo is open\n```\n\n### ![](img/image_rsrc10BB.jpg) 真实世界场景\n\n## 在运行时加载资源包文件\n\
  \n对于考试来说，你不需要记忆每个类别的各种显示和格式选项。你只需要知道你可以独立设置区域的 set。你还应该知道，在执行上述代码段之后调用 `Locale.setDefault(Locale.US)`\
  \ 将将两个区域类别都改为 `en_US`。\n\n## 选择资源包\n\n有两种获取资源包的方法是你应该熟悉的知的：\n\n- `ResourceBundle.getBundle(\"\
  name\")`\n- `ResourceBundle.getBundle(\"name\", locale)`\n\n第一种使用默认区域。你可能在程序中使用它。\n\
  \n### 表 11.11 针对法语/法国、默认区域选择资源包\n\n| 步骤 | 查找文件 | 原因 |\n| --- | --- | --- |\n| 1\
  \ | `Zoo_fr_FR.properties` | 请求区域 |\n| 2 | `Zoo_fr.properties` | 无国家的语言 |\n| 3 |\
  \ `Zoo_en_US.properties` | 默认区域 |\n| 4 | `Zoo_en.properties` | 无国家的默认语言 |\n| 5 |\
  \ `Zoo.properties` | 无区域——默认包 |\n| 6 | `MissingResourceException` | 如果仍未找到，抛出异常\
  \ |\n\n另一种记忆表格的方法是学习这些步骤：\n\n1. 查找请求区域的资源包，然后是默认区域。\n2. 对于每个区域，检查语言/国家，然后只检查语言。\n\
  3. 如果找不到匹配的区域，使用默认资源包。\n\n![](img/image_rsrc10B8.jpg)\n\n正如我们之前提到的，Java 支持来自 Java\
  \ 类和属性的资源包。当 Java 搜索匹配的资源包时，它首先检查匹配类名的资源包。对于考试，你只需要知道如何处理属性文件。\n\n让我们看看你是否理解这个：为了通过以下代码找到合适的资源包，Java\
  \ 最多需要考虑多少文件？\n\n```java\nLocale.setDefault(Locale.of(\"hi\"));\nResourceBundle\
  \ rb = ResourceBundle.getBundle(\"Zoo\", Locale.of(\"en\"));\n```\n\n答案是三个。它们列如下：\n\
  \n1. `Zoo_en.properties`\n2. `Zoo_hi.properties`\n3. `Zoo.properties`\n\n\n\n\n\n\
  请求的区域是 `en`，因此我们从这里开始。由于 `en` 区域不包含国家，我们移动到默认区域 `hi`。再次，由于没有国家，因此我们以默认束包（bundle）结束。\n\
  \n### 选择资源包值\n\n都明白了吗？很好——这里有一个转折。我们到目前为止讨论的步骤是用于查找匹配的资源包作为基类。Java 并不要求从同一个资源包中获取所有的键。它可以从匹配资源包的任何父级包中获取键。层级结构中的父级资源包会移除名称的组件，直到到达顶层。表\
  \ 11.12 显示了如何操作。\n\n表 11.12 选择资源包属性\n\n| 匹配的资源包 | 属性文件的键可能取自于 |\n| --- | --- |\n\
  | `Zoo_fr_FR` | `Zoo_fr_FR.properties` `Zoo_fr.properties` `Zoo.properties` |\n\n\
  一旦选择了资源包，将只会使用单一层级结构上的属性。将此行为与 表 11.11 进行对比，在没有其他可用资源包的情况下，将默认的 `en_US` 资源包。\n\n\
  这具体意味着什么？假设请求的区域是 `fr_FR`，默认是 `en_US`。只有在没有匹配的 `fr_FR` 或 `fr` 资源包时，JVM 才会从 `en_US`\
  \ 提供数据。如果它找到了 `fr_FR` 或 `fr` 资源包，则只会使用这些包以及默认包。\n\n让我们整合这一切，并打印一些关于我们动物园的信息。这次我们有很多属性文件。\n\
  \n`Zoo.properties`\n`name=Vancouver Zoo`\n\n`Zoo_en.properties`\n`hello=Hello`\n\
  `open=is open`\n\n`Zoo_en_US.properties`\n`name=The Zoo`\n\n`Zoo_en_CA.properties`\n\
  `visitors=Canada visitors`\n\n假设我们有一位来自魁北（Québec，其默认区域为加拿大法语）的访客，他要求程序提供英语信息。你认为输出结果是什么？\n\
  \n```\n10: Locale.setDefault(Locale.of(\"en\", \"US\"));\n11: var locale = Locale.of(\"\
  en\", \"CA\");\n12: ResourceBundle rb = ResourceBundle.getBundle(\"Zoo\", locale);\n\
  13:\n14: System.out.print(rb.getString(\"hello\"));\n15: System.out.print(\". \"\
  );\n16: System.out.print(rb.getString(\"name\"));\n17: System.out.print(\" \");\n\
  18: System.out.print(rb.getString(\"open\"));\n19: System.out.print(\" \");\n20:\
  \ System.out.print(rb.getString(\"visitors\"));\n```\n\n程序打印以下内容：\nHello. Vancouver\
  \ Zoo is open Canada visitors\n\n默认区域是 `en_US`，请求的区域是 `en_CA`。首先，Java 遍历可用的资源包以查找匹配项。它立即通过\
  \ `Zoo_en_CA.properties` 找到了匹配项。这意味着默认区域 `en_US` 是无关的。\n\n在第 12 行之后，资源包被选中，Java\
  \ 只会考虑它找到的属于该资源包的文件，即 `Zoo_en_CA.properties`、`Zoo_en.properties` 和 `Zoo.properties`，按此顺序排列。\n\
  \n第 14 行在 `Zoo_en_CA.properties` 中未找到键 `hello` 的匹配项，因此它向上层级查找到 `Zoo_en.properties`。第\
  \ 16 行在前两个属性文件中都没有找到 `name` 的匹配项，因此它必须一直到层级顶端的 `Zoo.properties`。第 18 行的经历与第 14 行相同，使用了\
  \ `Zoo_en.properties`。最后，第 20 行的任务就轻松得多，它在 `Zoo_en_CA.properties` 中找到了匹配的键。\n\n\
  在这个例子中，只使用了三个属性文件。即使在 `en_CA` 或 `en` 资源包中没有找到该属性，程序也倾向于使用 `Zoo.properties`（默认资源包）而不是\
  \ `Zoo_en_US.properties`（默认区域）。\n\n如果在任何资源包中都未找到某个属性怎么办？这时会抛出一个异常。例如，尝试检索一个不存在的属性会导致异常：\n\
  \n```\nSystem.out.print(rb.getString(\"close\"));  // MissingResourceException\n\
  ```\n\n### 格式化消息\n\n通常我们只想输出资源包中的文本数据，但有时你想用参数来格式化这些数据。在实际程序中，在资源包字符串中间替换变量是常见做法。惯例是在括号内使用数字，例如\
  \ `{0}`、`{1}` 等。数字表示传递参数的顺序。虽然资源包不直接支持这一点，但 `MessageFormat` 类支持。\n\n例如，假设我们定义了这样一个属性：\n\
  `helloGreeting=Hello, {0} and {1}`\n\n在 Java 中，我们可以正常地读取该值。之后，我们可以将其通过 `MessageFormat`\
  \ 类运行以替换参数。`format()` 的第二个参数是一个可变参数（vararg），允许指定指定数量的输入值。\n\n假设我们有一个资源包 `rb`：\n\
  ```\nString greeting = rb.getString(\"helloGreeting\");\nSystem.out.print(MessageFormat.format(greeting,\
  \ \"Tammy\", \"Henry\"));\n```\n\n这将打印以下内容：\nHello, Tammy and Henry\n\n### 使用 Properties\
  \ 类\n\n在处理 `ResourceBundle` 类时，你可能还会遇到 `Properties` 类。它的功能类似于你在第 9 章“集合与泛型”中学习的\
  \ `HashMap` 类，不同的是它的键和值使用 String 类型。让我们创建一个并设置一些值。\n\n```java\nimport java.util.Properties;\n\
  \npublic class ZooOptions {\n    public static void main(String[] args) {\n    \
  \    var props = new Properties();\n        props.setProperty(\"name\", \"Our zoo\"\
  );\n        props.setProperty(\"open\", \"10am\");\n    }\n}\n```\n\n`Properties`\
  \ 类常用于处理可能不存在的值。\n\n```\nSystem.out.println(props.getProperty(\"camel\"));     \
  \ // null\nSystem.out.println(props.getProperty(\"camel\", \"Bob\")); // Bob\n```\n\
  \n如果传递了一个实际存在的键，两个语句都将打印它。这通常被称为为缺失键提供默认值。\n\n`Properties` 类也包含 `get()` 方法，但只有 `getProperty()`\
  \ 允许默认值。例如，以下调用是无效的，因为 `get()` 只接受一个参数：\n\n```\nprops.get(\"open\"); // Error\n\
  props.getProperty(\"open\", \"The zoo will be open\");\n```\n\n### 总结\n\n本章涵盖了围绕构建良好响应应用程序的广泛主题。我们从异常处理开始讨论。异常可以分为两类：编译异常和运行时异常。在\
  \ Java 中，编译异常继承 `Exception` 但不是 `RuntimeException`，必须处理或声明。运行时异常继承 `RuntimeException`\
  \ 或 `Error`，不需要处理或声明。捕捉 `Error` 被认为是不良。\n\n可以使用 try-with-resources 语句启用自动资源管理，以确保资源正确关闭。资源在\
  \ try 块结束时关闭，顺序与声明相反。当发生多个异常时会产生抑制异常，这通常发生在 finally 块或 try-with-resources 的 `close()`\
  \ 操作中。\n\nJava 提供了一些用于格式化数字和日期的内置类。我们回顾了如何为每种类型创建自定义格式化器。你应该在遇到这些自定义格式时能够识别它们。\n\
  \n本地化涉及创建适应变化的程序。你可以创建一个 `Locale` 类，它包含一个强制性的小写语言代码和一个可选的大写国家代码。例如，`en` 和 `en_US`\
  \ 分别是英语和美国英语的区域。你需要知道如何根据区域格式化数字和日期/时间值，包括新的 `CompactNumberFormat` 类。\n\n\n\n\n\n\
  `ResourceBundle` 允许在属性文件中指定键/值对。Java 会按照从具体到通用的顺序遍历候选资源包以查找匹配项。如果请求的语言区域（locale）没有找到匹配项，Java\
  \ 将切换到默认语言区域，最后切换到默认资源包。一旦找到匹配的资源包，Java 将仅在该资源包的层级结构中查找选择值。\n\n通过将在本章中学习的原理应用于你自己的项目，你可以构建出更持久的应用程序，并对可能出现的任何意外事件提供内置支持。\n\
  \n## 考试要点\n\n**理解各种类型的异常。** 所有异常都是 `java.lang.Throwable` 的子类。不应捕获 `java.lang.Error`\
  \ 的子类。应用程序代码中只应处理 `java.lang.Exception` 的子类。\n\n**区分检查异常（checked）和未检查异常（unchecked）。**\
  \ 未检查异常不需要捕获或处理，它们是 `java.lang.RuntimeException` 或 `java.lang.Error` 的子类。`java.lang.Exception`\
  \ 的所有其他子类都是检查异常，必须进行处理或声明。\n\n**理解 try 语句的流程。** `try` 语句必须有一个 `catch` 或 `finally`\
  \ 块。多个 `catch` 块可以链在一起，前提是父类异常类型不会出现在其子类之前的 `catch` 块中。可以使用多异常异常（multi-catch）在同一个\
  \ `catch` 块中处理多个异常，前提是其中一个异常不是另一个的子类。无论是否抛出异常，`finally` 块最后运行。\n\n**能够遵循 try-with-resources\
  \ 语句的顺序。** `try-with-resources` 语句是一种特殊的 `try` 块，其中声明了一个或多个资源，并按照它们声明的反向顺序自动关闭。它可以在带或不带\
  \ `catch` 或 `finally` 块的情况下使用，其中 `finally` 块始终执行。\n\n**能够编写声明异常的方法。** 理解 `throw`\
  \ 和 `throws` 关键字之间的区别，以及如何编写声明异常的方法。\n\n**识别有效的语言区域（locale）。** 知道语言代码（language code）是小写且强制的，而国家代码（country\
  \ code）是大写且可选的。能够使用内置常量、工厂方法或构建器类选择 `locale`。\n\n**格式化日期、数字和消息。** 能够将日期、数字和消息格式化为各种\
  \ `String` 格式，并知道 `locale` 如何影响这些格式。知道各种格式化器（货币、百分比、紧凑）的区别。能够使用符号编写自定义的日期或数字格式化器。\n\
  \n**确定 Java 使用哪个资源包查找键。** 使用属性文件创建资源包。知道 Java 选择资源包的顺序以及如何考虑默认语言资源包。一旦找到资源包，识别用于选择值的层级结构。\n\
