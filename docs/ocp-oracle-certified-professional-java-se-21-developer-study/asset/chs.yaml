- "# OCP Oracle Certified Professional Java SE 21 开发者学习指南\n\n\n\n![](img/cover.jpeg)\n\
  \n\n\n静态变量的一个常见用途是计数实例的数量：\n\n```java\npublic class Counter {\n    private static\
  \ int count;\n    public Counter() { count++; }\n    public static void main(String[]\
  \ args) {\n        Counter c1 = new Counter();\n        Counter c2 = new Counter();\n\
  \        Counter c3 = new Counter();\n        System.out.println(count);     //\
  \ 3\n    }\n}\n```\n\n每调用一次构造函数，`count` 就会增加 1。这个例子基于这样一个事实：静态（以及实例）变量会自动初始化为该类型的默认值，对于\
  \ `int` 来说是 0。参见第 1 章复习默认值。\n\n另外注意，我们没有写 `Counter.count`。我们本可以写的。但没有必要，因为我们已经在该类中了，所以编译器可以推断出来。\n\
  \n![](img/image_rsrc10BA.jpg)\n\n请确保你彻底理解这一节。它在书中处处出现。甚至在我们讨论第 7 章中的接口时，也会看到类似的话题。例如，静态接口方法在没有引用的情况下无法调用默认接口方法，这与类内部的静态方法在没有引用的情况下无法调用实例方法相似。\n\
  \n## 静态变量修饰符\n\n回看表 5.3，静态变量可以使用实例变量相同的修饰符声明，例如 `final`、`transient` 和 `volatile`。虽然某些静态变量旨在程序运行过程中更改（如我们的\
  \ `count` 示例），但另一些则永远不会改变。这种类型的静态变量被称为常量。它使用 `final` 修饰符来确保变量永远改变。\n\n常量使用 `static\
  \ final` 修饰符，并采用与其他变量不同的命名规范。它们使用全大写字母，并在“单词”之间使用下划线。这里是一个例子：\n\n```java\npublic\
  \ class ZooPen {\n    private static final int NUM_BUCKETS = 45;\n    public static\
  \ void main(String[] args) {\n        NUM_BUCKETS = 5;  // 无法编译\n    }\n}\n```\n\
  \n编译器会确保你不会意外尝试更新 `final` 变量。这可能会变得有趣。你认为以下代码可以编译吗？\n\n```java\nimport java.util.*;\n\
  \npublic class ZooInventoryManager {\n    private static final String[] treats =\
  \ new String[10];\n    public static void main(String[] args) {\n        treats[0]\
  \ = \"xxx\";\n    }\n}\n```\n\n编译器会确保你不会意外尝试更新 `final` 变量。这可能会变得有趣。你认为以下代码可以编译吗？（注意：上面的代码经过修改以说明逻辑）。\n\
  \n实际上，`treats` 是一个引用。我们被允许修改数组的内容，但不能让 `treats` 指向不同的对象。`final` 变量的规则与实例变量相似，但它们不使用构造函数——而是使用静态初始化器。\n\
  \n```java\npublic class Panda {\n    final String name = \"Ronda\";\n    final int\
  \ height;\n}\n```\n\n`name` 变量被赋值了一个值。`height` 变量没有初始化，所以这无法编译。\n\n## 静态初始化器\n\n\
  在第 1 章中，我们涵盖了像方法一样的实例初始化器。现在我们介绍静态初始化器，它们在类加载时运行。这里有一个例子：\n\n```java\nprivate static\
  \ int SECONDS_PER_MINUTE;\nprivate static int MINUTES_PER_HOUR;\nprivate static\
  \ int SECONDS_PER_HOUR;\n\nstatic {\n    SECONDS_PER_MINUTE = 60;\n    MINUTES_PER_HOUR\
  \ = 60;\n    SECONDS_PER_HOUR = SECONDS_PER_MINUTE * MINUTES_PER_HOUR;\n}\n```\n\
  \n所有静态初始化器按照定义的顺序运行。这里是另一个例子：\n\n```java\nprivate static int one;\nprivate static\
  \ int two;\nprivate static int three;\n\nstatic {\n    one = 1;\n}\nstatic {\n \
  \   two = 2;\n}\nstatic {\n    three = 3;\n}\n```\n\n`one` 变量是静态的且不是 final。我们可以根据需要对其多次赋值。\n\
  \n```java\nprivate static int one;\nprivate static final two;\nstatic int three\
  \ = 3;\n\nstatic {\n    one = 1;\n}\nstatic {\n    two = 2; // 无法编译\n}\nstatic {\n\
  \    three = 4; // 无法编译\n}\n```\n\n`two` 变量是静态且 final 的。这意味着我们可以在静态块中精确初始化一次。`three`\
  \ 变量是静态的并且同时初始化的。\n\n```java\nprivate static int one;\nprivate static final two;\n\
  private static int three = 3;\n\nstatic {\n    one = 1;\n}\nstatic {\n    two =\
  \ 2;\n}\nstatic {\n    three = 4; // 无法编译\n}\n```\n\n`three` 变量是 final 且从未初始化。编译器给出编译错误，因为它知道静态块是唯一可能初始化它的地方。\n\
  \n```java\nprivate static int one;\nprivate static final two;\nprivate static int\
  \ three;\n\nstatic {\n    one = 1;\n}\nstatic {\n    two = 2;\n}\n```\n\n### ![](img/image_rsrc10BB.jpg)\
  \ 现实场景\n\n## 尽量避免静态和实例初始化器\n\n使用静态和实例初始化器会让代码变得难以阅读。任何可以在实例初始化器中完成的操作都可以通过构造函数完成。\n\
  \n使用静态初始化器的常见情况：当你需要初始化静态字段，且执行该操作的代码超过一行时。这通常发生在你想初始化集合（如 `ArrayList` 或 `HashMap`）时。当你确实需要静态初始化时，将所有的静态初始化放在同一个块中。这样顺序一目了然。\n\
  \n## 静态导入\n\n在第 1 章中，你看到可以导入特定的类或包中的所有类。\n\n```java\nimport java.util.ArrayList;\n\
  \nimport java.util.*;\n```\n\n我们可以使用这种技术来导入两个类：\n\n```java\nimport java.util.List;\n\
  \nimport java.util.Arrays;\n```\n\n\n\n```java\npublic class Imports {\n    public\
  \ static void main(String[] args) {\n        List<String> list = Arrays.asList(\"\
  one\", \"two\");\n    }\n}\n```\n\n`Imports`（导入）非常方便，因为你不需要在每次使用类时都指定该类从哪里来。另一种类型的导入被称为\
  \ `static import`（静态导入）。普通导入用于导入类，而 `static imports` 用于导入类的静态成员，例如变量和方法。\n\n与普通导入一样，你可以使用通配符或导入特定的成员。其核心思想是，你不应该在每次使用每个静态方法或变量时都指定它从哪里来。静态导入大显身威的一个例子是，当你引用另一个类中的大量常量时。\n\
  \n我们可以重写之前的示例来使用 `static import`。这样做会得到以下结果：\n\n```java\nimport java.util.List;\n\
  import static java.util.Arrays.asList;           // 静态导入\n\npublic class ZooParking\
  \ {\n    public static void main(String[] args) {\n        List<String> list = asList(\"\
  one\", \"two\"); // 无 Arrays. 前缀\n    }\n}\n```\n\n在这个示例中，我们专门导入了 `asList` 方法。这意味着在类中任何引用\
  \ `asList` 的地方，都会调用 `Arrays.asList()`。\n\n一个有趣的情况是，如果我们在 `ZooParking` 类中创建了一个 `asList`\
  \ 方法会发生什么。Java 会优先使用该方法而不是导入的那个，并将使用我们编写的方法。\n\n考试会通过误用静态导入来刁弄你。这个示例展示了你几乎可以犯的所有错误。你能看出每个处代码的错误出在哪里吗？\n\
  \n1: `import static java.util.Arrays;` // 无法编译\n2: `import static java.util.Arrays.asList;`\n\
  3: `static import java.util.Arrays.*;` // 无法编译\n4: `public class BadZooParking {`\n\
  5: `    public static void main(String[] args) {`\n6: `        Arrays.asList(\"\
  one\");` // 无法编译\n7: `    }`\n8: `}`\n\n第 `1` 行尝试使用静态导入来导入一个类。记住，静态导入仅用于导入方法或变量等静态成员。普通导入用于导入类。第\
  \ `3` 行试图测试你是否关注关键字的顺序。语法是 `import static` 而不是相反。第 `6` 行很狡猾。`asList` 方法在第 `2` 行被导入了。然而，`Arrays`\
  \ 类在任何地方都没有被导入。这使得编写 `asList(\"one\")` 是的，但 `Arrays.asList(\"one\")` 则不是。\n\n静态导入只有最后一种情况。在第\
  \ 1 章中，你学习了导入两个同名的类会导致编译器错误。静态导入也是如此。如果你尝试显式静态导入两个同名的方法或两个同名的静态变量，编译器会报错。这里有一个例子：\n\
  \n```java\nimport static zoo.A.TYPE;\nimport static zoo.B.TYPE; // 无法编译\n```\n\n\
  幸运的是，当这种情况发生时，我们只需要在代码中通过类名来引用静态成员，而不需要尝试使用静态导入。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n在大型程序中，静态导入可能会过度使用。当从太多地方导入内容时，很难记住每个静态成员来自哪里。请节节使用！\n\n## 方法之间的数据传递\n\nJava 是一种“按值传递”语言。这意味着会创建变量的副本，方法接收该副本。在方法中进行的赋值不会影响调用者。让我们来看一个例子：\n\
  \n```java\n2: public static void main(String[] args) {\n3:    int num = 4;\n4: \
  \   newNumber(num);\n5:    System.out.print(num);     // 4\n6: }\n7: public static\
  \ void newNumber(int num) {\n8:     num = 8;\n9: }\n```\n\n在第 `3` 行，`num` 被赋值为 `4`。在第\
  \ `4` 行，我们调用了一个方法。在第 `8` 行，方法中的参数 `num` 被设置为 `8`。虽然这个参数的名字与第 `3` 行的变量相同，但这只是巧合。名字可以是任何的。考试经常使用相同的名称来试图混淆你。第\
  \ 3 行的变量从未改变，因为没有对它进行赋值。\n\n### 传递对象\n\n现在你已经看到了基本数据类型，让我们尝试一个引用类型的示例。你认为以下代码的输出是什么？\n\
  \n```java\npublic class Dog {\n    public static void main(String[] args) {\n  \
  \      String name = \"Webby\";\n        speak(name);\n        System.out.print(name);\n\
  \    }\n    public static void speak(String name) {\n        name = \"orgette\"\
  ;\n    }\n}\n```\n\n正确答案是 `Webby`。就像基本类型示例一样，变量赋值仅在方法内部，不会影响调用者。注意我们是如何处理关于变量赋值的。这是因为我们可以对参数调用方法。例如，这里有一段代码对传递给方法的\
  \ `StringBuilder` 调用了方法：\n\n```java\npublic class Dog {\n    public static void\
  \ main(String[] args) {\n        StringBuilder name = new StringBuilder(\"Webby\"\
  );\n        speak(name);\n        System.out.print(name);\n    }\n    public static\
  \ void speak(StringBuilder s) {\n        s.append(\"orgette\");\n    }\n}\n```\n\
  \n在此示例中，我们专门导入了 `asList` 方法。这意味着在类中任何引用 `asList` 的地方，它都会调用 `Arrays.asList()`。\n\n\
