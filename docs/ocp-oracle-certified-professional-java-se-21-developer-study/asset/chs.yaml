  8. 代码可以编译但在运行时抛出异常。\n\n# 第 10 章\n\n### Streams\n\n本章涵盖的 OCP 考试目标：\n\n* 使用 Streams\
  \ 和 Lambda 表达式\n    * 使用 Java 对象流和原始流（包括实现函数式接口的 Lambda 表达式），创建、过滤、转换、处理和排序数据。\n\
  \    * 在顺序流和并行流上执行分解、合并、归约以及分组和分区操作。\n\n到此时，你应该已经熟悉了 Lambda 和方法引用的语法。两者都用于实现函数式接口。如果你需要更多练习，可能想回回顾第\
  \ 8 章“Lambdas 和函数式接口”以及第 9 章“集合与泛型”。在本章中，我们在此基础上增加了实际函数式编程，重点关注 Streams API。\n\n\
  注意，本章中的 Streams API 用于函数式编程。相比之下，还有 `java.io` 流，我们将在第 14 章](#cP9B.xhtml)“I/O”中讨论。尽管两者都使用了“stream”一词，但它们完全不同。\n\
  \n在本章中，我们引入了 `Optional`。然后介绍了 Stream 流水线（pipeline）并将它们整合在一起。在做复习题之前，你可能想读两遍，以便真正理解。函数式编程的学习曲线通常很陡，但一旦掌握了它，就会非常有趣。\n\
  \n## 返回一个 Optional\n\n假设你正在上一门 Java 入门课程，在前两次考试中获得了 90 分和 100 分。现在，我们问你平均分是多少。平均分是通过分数相加并除以分数数量计算的，所以是\
  \ `(90+100)/2`。这得到 `190/2`，所以你的回答是 `95`。太棒了！\n\n现在假设你正在上第二门 Java 课程，今天是第一天。我们问你这门刚开始的课程的平均分是多少。你还没有参加过任何考试，所以没有什么可以计算平均分。说你的平均分是零是不准确的。这听起来很糟糕，而且事实如此。根本没有数据，所以你没有平均分。\n\
  \n我们如何在 Java 中表达这种“我们不知道”或“不适用”的答案呢？我们使用 `Optional` 类型。`Optional` 是通过工厂方法创建的。你可以请求一个空的\
  \ `Optional`，或者传递一个值给 `Optional` 进行封装。将 `Optional` 想象成一个盒子，里面可能有东西，也可能是空的。图 10.1\
  \ 显示了这两种选项。\n\n### 创建 Optional\n\n以下是编写平均分方法的方法：\n\n```\n10: public static Optional<Double>\
  \ average(int… scores) {\n11:     if (scores.length == 0) return Optional.empty();\n\
  12:     int sum = 0;\n13:     for (int score: scores) sum += score;\n14:     return\
  \ Optional.of((double) sum / scores.length);\n15: }\n```\n\n![两个三维正方形 optional 对象。左侧的\
  \ optional 对象是空的，右侧是包含 95 的 optional。](img/image_rsrc10D5.jpg)\n\n图 10.1 Optional\n\
  \n当无法计算平均分时，第 11 行返回一个空的 `Optional`。第 12 行和第 13 行计算和。第 14 行返回 `Optional.of((double)\
  \ sum / scores.length)`。\n\n使用 `Optional.empty()` 允许我们表示值的缺失。使用 `Optional.of(value)`\
  \ 允许我们封装一个值。这避免了返回 `null`，`null` 会导致 `NullPointerException`。\n\n当我们想要检查 `Optional`\
  \ 是否有值时，使用 `isPresent()`。要获取值，使用 `get()`。然而，在空的 `Optional` 上调用 `get()` 会抛出 `NoSuchElementException`。\n\
  \n替代地，我们可以使用 `Optional.ofNullable(value)` 来处理值可能为 `null`的情况。如果值为 `null`，它会返回一个空的\
  \ `Optional`；否则它会封装该值。\n\n\n\n\n\n剩余的方法允许你指定当值不存在时执行的操作。有几种选择。前两种允许你直接指定一个返回值，或者使用\
  \ `Supplier`（供应者）。\n\n```\n30: Optional<Double> opt = average();\n31: System.out.println(opt.orElse(Double.NaN));\n\
  32: System.out.println(opt.orElseGet(() -> Math.random()));\n```\n\n这会输出类似如下的内容：\n\
  \n```\nNaN\n0.49775932295380165\n```\n\n第 31 行显示你可以返回一个特定的值或变量。在我们的案例中，打印了“非数字”（NaN）值。第\
  \ 32 行显示了使用 `Supplier` 在运行时生成一个值并进行返回。不过，我很幸教授们没有给我们一个随机的平均值！\n\n另一种，我们可以让代码在 `Optional`\
  \ 为空时抛出异常。\n\n```java\n30: Optional<Double> opt = average();\n31: System.out.println(opt.orElseThrow());\n\
  ```\n\n这会输出类似如下的内容：\n\n```\nException in thread \"main\" java.util.NoSuchElementException:\n\
  \    No value present\n    at java.base/java.util.Optional.orElseThrow(Optional.java:382)\n\
  ```\n\n如果不为异常指定 `Supplier`，Java 将抛出 `NoSuchElementException`。另一种方式，我们可以让代码在 `Optional`\
  \ 为空时抛出一个自定义异常。请记住，堆栈跟踪看起来很奇怪，是因为 lambda 表达式是生成的，而不是命名的类。\n\n```java\n30: Optional<Double>\
  \ opt = average();\n31: System.out.println(opt.orElseThrow(\n32:    () -> new IllegalStateException()));\n\
  ```\n\n这会输出类似如下的内容：\n\n```\nException in thread \"main\" java.lang.IllegalStateException\n\
  \    at optionals.Methods.lambda$orElse$1(Methods.java:31)\n    at java.base/java.util.Optional.orElseThrow(Optional.java:408)\n\
  ```\n\n第 32 行显示了使用 `Supplier` 来创建一个应该被抛出的异常。注意，我们没有写 `throw new IllegalStateException()`。`orElseThrow()`\
  \ 方法会在我们运行时负责实际上抛出该异常。\n\n两个接收 `Supplier` 的方法名称不同。你看出为什么这段代码无法编译了吗？\n\n```java\n\
  System.out.println(opt.orElseGet(\n    () -> new IllegalStateException())); // 无法编译\n\
  ```\n\n`opt` 变量是一个 `Optional<Double>`。这意味着 `Supplier` 必须返回一个 `Double`。由于这个 `Supplier`\
  \ 返回的是一个异常，类型不匹配。\n\n最后一个关于 `Optional` 的示例非常简单。你认为它会做什么？\n\n```java\nOptional<Double>\
  \ opt = average(90, 100);\nSystem.out.println(opt.orElse(Double.NaN));\nSystem.out.println(opt.orElseGet(()\
  \ -> Math.random()));\nSystem.out.println(opt.orElseThrow());\n```\n\n它打印三次 95.0。因为该值存在，所以不需要使用“否则”逻辑。\n\
  \n### Optional 等于 null 吗？\n\n`Optional` 的替代方案是返回 `null`。这种方法有几个缺点。其中之一没有清晰的方法来表达\
  \ `null` 可能是一个特殊值。相比之下，返回一个 `Optional` 是 API 中一个明确的声明，表示可能没有值。\n\n`Optional` 的另一个优势是你可以使用\
  \ `ifPresent()` 和其他方法使用函数式编程风格，而不需要 `if` 语句。最后，你在章节末尾可以看到你可以链式调用 `Optional`。\n\n\
  ## 使用流（Streams）\n\nJava 中的流（stream）是数据的序列。流流水线（stream pipeline）由在流上运行产生结果的操作组成。注意，人们经常交叉使用\
  \ `stream` 和 `stream pipeline` 来指代流水线。首先，我们从概念上观察流水线的流程。然后，我们进入代码。\n\n### 理解流水线流程\n\
  \n将流流水线想象成工厂里的流水线。假设我们正在运行一条流水线，为动物园的动物展览制作牌子。我们有很多工作。一个人的工作是从箱子里取出牌子。第二个人的工作是给牌子上漆。第三个人的工作是在牌子上模板刻上动物的名字。最后一个人的工作是将完成的牌子放在箱子里，运往合适的展区。\n\
  \n注意，在第一个人从箱子里拿出一个牌子之前，第二个人无法做任何事。同样，在其中一个牌子被漆好之前，第三个人无法做任何事，而在牌子被模板刻字之前，最后一个人无法做任何事。\n\
  \n制作牌子的流水线是有限的。一旦我们处理完牌子箱里的内容，任务就结束了。有限流有一个限制。其他流水线本质上是永远运行的，比如食品生产流水线。当然，它们在工厂关闭时会在某个时间点停止，但假定这不会发生。或者把日出/日落循环看作无限的，因为在极长的时间内它都不会结束。\n\
  \n流水线的另一个重要特征是，每个人都接触每个元素来执行自己的操作，然后该部分数据就消失了。它不会回来。下一个人在那个时刻处理它。这与你在上一章看到的列表（lists）和队列（queues）不同。在列表中，你可以随时访问任何元素。在队列中，你访问的元素受到限制，但所有元素都在那里。在流中，数据不是预先生成的——而是在需要时创建的。这是延迟求值（lazy\
  \ evaluation）的一个示例，它将执行推到需要的时候。\n\n#### 图 10.2：流流水线\n\n- **源（Source）**：流来自何。\n-\
  \ **中间操作（Intermediate operations）**：将流转换为另一个流。中间操作的数量可以非常少，也可以很多。由于流使用了延迟求值，在执行终端操作之前，中间操作不会运行。\n\
  - **终端操作（Terminal operation）**：产生结果。由于流只能使用一次，因此在终端操作后，该流不再有效。\n\n#### 表 10.2：中间操作与终端操作对比\n\
  \n| 场景 | 中间操作 | 终端操作 |\n| --- | --- | --- |\n| 有用流水线的必要部分？ | 否 | 是 |\n| 在流水线中出现多次？\
  \ | 是 | 否 |\n| 返回类型是流类型？ | 是 | 否 |\n| 调用方法时执行？ | 否 | 是 |\n| 调用后流是否有效？ | 是 | 否 |\n\
  \n\n\n\n让我们来看几个例子。在这些示例中我们没有使用代码，因为在开始编写代码之前，理解流流水线（stream pipeline）概念至关重要。图 10.3\
  \ 展示了一个包含一个中间操作的流流水线。\n\n![一张带有一个中间操作的流流水线图像。它从从箱中取出牌子开始，接着是涂漆牌子的中间选项，最后是将牌子放入堆中结束。在底部，操作视角分\
  \ 1 到 2 步和 2 到 3 步，下方是两个拆箱框中的 4 到 5 步和 5 到 6 步。](img/image_rsrc10D7.jpg)\n\n图 10.3\
  \ 运行流流水线的步骤\n\n让我们从工头的角度看看发生了什么。首先，他们看到源头正在箱子里取出牌子。工头在桌子上安排了一个工人来拆箱，并说等待信号以开始。然后，工头看到了涂漆牌子的中间操作。他们安排了一个带油漆的工人，并说等待信号以开始。最后，工头看到了将牌子放入堆中的终端操作。他们安排了一个工人来做这项工作，并大喊让三个工人全部开始。\n\
  \n假设箱子里有两个牌子。第 1 步是第一个工人从箱子里取出一个牌子并交给第二个工人。第 2 步是第二个工人对其涂漆并将其交给第三个工人。第 3 步是第三个工人将其放入堆中。第\
  \ 4–6 步是另一个牌子的相同过程。然后，工头看到没有剩下的牌子了，于是关闭了整个企业。\n\n工头很聪明，可以根据需要做出如何最好完成工作的决策。例如，让我们探索一下图\
  \ 10.4 中的流流水线。\n\n![一张带有限制的流流水线图像。它从从箱中取出牌子开始，接着是涂漆牌子的中间选项，只做 2 个牌子，最后是将牌子放入堆中结束。](img/image_rsrc10D8.jpg)\n\
  \n图 10.4 带有限制的流流水线\n\n工头仍然看到源头从箱子里取出牌子，并命令分配一个工人去执行。他们仍然看到了一个涂漆的中间操作，并安排了另一个工人，指令是等待然后涂漆。然后，他们看到了一个中间步骤，我们只需要两个牌子。他们安排了一个工人来计算经过的牌子，并在工人看到两个牌子时通知工头。最后，他们安排了一个工人执行终端操作，将牌子放入堆中。\n\
  \n这次，假设箱子里有 10 个牌子。我们像上次一样开始。第一张牌子沿着流水线向下移动。第二个牌子也沿着流水线向下移动。当负责计数的工人看到第二个牌子时，他们告诉了工头。工头让终端操作工人完成任务，然后大喊道：“停线！”。箱子里还有八个牌子没关系。我们不需要它们，所以涂漆它们将是多余的工作。而我们都想避免不必要的工作！\n\
  \n同样，如果终端操作是找到第一个生成的牌子，工头会在第一个牌子出现后就停止流水线。\n\n在接下来的章节中，我们将涵盖流水线的三个部分。我们还会讨论基本数据类型的特殊流以及如何打印流。\n\
  \n### 创建流源\n\n在 Java 中，我们一直讨论的流由 `Stream<T>` 接口表示，该接口定义在 `java.util.stream` 包中。\n\
  \n#### 创建有限流\n\n为了简单起见，我们从有限流开始。创建它们有几种方法。\n\n```\n11: Stream<String> empty = Stream.empty();\
  \           // count = 0\n12: Stream<Integer> singleElement = Stream.of(1);   //\
  \ count = 1\n13: Stream<Integer> fromArray = Stream.of(1, 2, 3); // count = 3\n\
  ```\n\n第 11 行显示如何创建一个空流。第 12 行显示如何创建一个单个元素的流。第 13 行显示如何从变参数创建流。\n\nJava 还提供了将 `Collection`\
  \ 转换为流的方便方法。\n\n```\n14: var list = List.of(\"a\", \"b\", \"c\");\n15: Stream<String>\
  \ fromList = list.stream();\n```\n\n第 15 行显示通过简单的方法调用即可从列表创建流。这很有帮助，因为这种转换非常常见。\n\
  \n### 创建并行流\n\n从列表创建并行流同样简单。\n\n```\n24: var list = List.of(\"a\", \"b\", \"c\"\
  );\n25: Stream<String> fromListParallel = list.parallelStream();\n```\n\n这是一个非常棒的功能，因为你甚至在学习什么是线程之前，就可以编写使用并发的代码了。使用并行流就像设置了多张工作桌，他们可以执行相同的任务。如果我们有五个位油漆工来涂漆牌子而不是只有一个，那么涂漆速度会快得多。只需记住，某些任务无法并行执行，例如按照流中创建的顺序将牌子收好。另外要注意协调是有成本的。\n\
  \n#### 创建无限流\n\n到为止，这并不令人深刻。我们可以对列表做到这一点。然而，我们可以创建无限流，这让流变得强大。\n\n```\n17: Stream<Double>\
  \ randoms = Stream.generate(Math::random);\n18: Stream<Integer> oddNumbers = Stream.iterate(1,\
  \ n -> n + 2);\n```\n\n第 17 行生成了一个随机数流。有多少个？取决于你需要。记住，在调用终端操作之前，源并不会创建值。第 18 行提供了更多。`iterate()`\
  \ 方法接受种子值作为第一个参数。另一个参数是获取值的 Lambda 表达式。\n\n### 打印流\n\n如果你打印流，你会得到类似的内容：\n\n```\n\
  System.out.print(stream); // java.util.stream.ReferencePipeline$3@4517da3\n```\n\
  \n这与 `Collection` 不同，后者会显示内容。你考试不需要知道这个。\n\n如果你想要小于 100 的奇数呢？`iterate()` 的重载版本很有帮助：\n\
  \n```\n19: Stream<Integer> oddNumber100 = Stream.iterate(\n    1,\n    n -> n <\
  \ 100, // 指定何时结束的谓词\n    n -> n + 2); // 获取下一个值的元运算符\n```\n\n该方法接受三个参数。注意它们是用逗号（,）分隔的，与其他所有方法一样。考试可能会用分号来欺骗你，因为它与\
  \ for 循环相似。此外，你必须注意不要创建一个永远运行的流。\n\n#### 复习流的创建方法\n\n为了复习，请确保你了解表 10.3 中的所有方法。这些是给给定\
  \ `Collection` 实例创建流源的方法。\n\n[表 10.3] 创建源\n\n| 方法 | 有限还是无限？ | 备注 |\n| --- | ---\
  \ | --- |\n| `Stream.empty()` | 有限 | 创建包含零元素的流。 |\n| `Stream.of(varargs)` | 有限 |\
  \ 创建包含列出元素的流。 |\n| `coll.stream()` | 有限 | 从集合创建流。 |\n| `coll.parallelStream()` |\
  \ 有限 | 从集合创建流，该流可以并行运行。 |\n\n\n\n\n| `Stream.generate(supplier)` | `Infinite` |\
  \ 在请求时为每个元素调用 `Supplier` 以创建 Stream。 |\n| `Stream.iterate(seed, unaryOperator)`\
  \ | `Infinite` | 在请求时，使用 `seed` 作为第一个元素，并对每个后续元素调用 `UnaryOperator` 以创建 Stream。 |\n\
  | `Stream.iterate(seed, predicate, unaryOperator)` | `Finite or infinite` | 在请求时，使用\
  \ `seed` 作为第一个元素，并对每个后续元素调用 `UnaryOperator` 以创建 Stream。如果 `Predicate` 返回 `false`，则停止。\
  \ | |\n\n### 使用常用的终端操作\n\n你可以在不进行任何中间操作的情况下执行终端操作，但反之则不行。这就是为什么我们先讨论终端操作。归约（Reductions）是一种特殊的终端操作，它将流的所有内容合并成单个原始类型或对象。例如，你最终可能会得到一个\
  \ `int` 或一个 `Collection`。\n\n表 10.4 总结了本节。你可以随地将其作为指南，在我们逐一介绍每个内容时记住最重要的要点。我们按照从简单到复杂的顺序进行解释，而不是字母顺序。\n\
  \n表 10.4 终端流操作\n\n| 方法 | 在无限流上发生了什么 | 返回值 | 归约 |\n| --- | --- | --- | --- |\n| `count()`\
  \ | 不终止 | `long` | 是 |\n| `min()` `max()` | 不终止 | `Optional<T>` | 是 |\n| `findAny()`\
  \ `findFirst()` | 终止 | `Optional<T>` | 否 |\n| `allMatch()` `anyMatch()` `noneMatch()`\
  \ | 有时终止 | `boolean` | 否 |\n| `forEach()` | 不终止 | `void` | 否 |\n| `reduce()` | 不终止\
  \ | 变化异 | 是 |\n| `collect()` | 不终止 | 变化而异 | 是 |\n\n#### 计数\n\n`count()` 方法确定有限流中元素的数量。对于无限流，它永远不会终止。为什么？从\
  \ 1 数到无穷大，等你数完了再告诉我们！或者说，不要这样做，因为我们宁愿你为了考试复习，也不要用尽余生去数。`count()` 方法是一种归约，因为它查看流中的每个元素并返回单个值。该方法的签名如下：\n\
  \n```java\npublic long count()\n```\n\n此示例显示了在有限流上调用 `count()`：\n\n```java\nStream<String>\
  \ s = Stream.of(\"monkey\", \"gorilla\", \"bonobo\");\nSystem.out.println(s.count());\
  \ // 3\n```\n\n#### 寻找最小和最大\n\n`min()` 和 `max()` 方法允许你传递一个自定义的 `comparator`，并根据该排序顺序在有限流中找到最小或值。类似于\
  \ `count()` 方法，`min()` 和 `max()` 在无限流上会阻塞，因为它们无法确定在后面是否会出现更小或更大的值。这两个方法都是归约，因为它们在查看整个流后返回一个单值。该方法的签名如下：\n\
  \n```java\npublic Optional<T> min(Comparator<? super T> comparator)\npublic Optional<T>\
  \ max(Comparator<? super T> comparator)\n```\n\n此示例寻找名称中字母最少的动物：\n\n```java\nStream<String>\
  \ s = Stream.of(\"monkey\", \"ape\", \"bonobo\");\nOptional<String> min = s.min((s1,\
  \ s2) -> s1.length() - s2.length());\nmin.ifPresent(System.out::println); // ape\n\
  ```\n\n注意代码返回的是一个 `Optional` 而不是值。这允许方法指定没有找到最小值或最大值。我们使用 `Optional` 方法 `ifPresent()`\
  \ 和方法引用，仅在找到值时才打印出该值。作为一个没有最小值的例子，让我们来看一个空流：\n\n```java\nOptional<?> minEmpty =\
  \ Stream.empty().min((s1, s2) -> 0);\nSystem.out.println(minEmpty.isPresent());\
  \ // false\n```\n\n由于流是空的，`comparator` 永远不会被调用，`Optional` 中不存在任何值。\n\n![](img/image_rsrc10B8.jpg)\n\
  \n如果你需要同一个流的 `min()` 和 `max()` 值怎么办？目前，你无法同时拥有两者，至少使用这些方法是如此。记住，一个流只能有一个终端操作。一旦运行了终端操作，该流就无法再次使用。正如你在本章的稍后部分看到的，某些数值流有内置的摘要方法，它们会为你计算一组值。\n\
  \n#### 寻找一个值\n\n`findAny()` 和 `findFirst()` 方法返回流中的元素，除非流是空的。如果流为空，它们将返回一个空的 `Optional`。这是你看到的第一个可以在无限流上终止的方法。由于\
  \ Java 只生成你所需的流数据量，因此无限流只需要生成一个元素。\n\n正如其名，`findAny()` 方法可以返回流的任何元素。当在目前为止你过的流上调用它时，它通常返回第一个元素，尽管这种行为是不保证的。正如你在第\
  \ 13 章所示，在处理并行流时，`findAny()` 方法更有可能返回随机元素。\n\n这些方法是终端操作，但不是归约。原因是它们有时会在不处理所有内容的情况下返回。\n\
  \n方法的签名如下：\n\n```java\npublic Optional<T> findAny()\npublic Optional<T> findFirst()\n\
  ```\n\n此示例找到一个动物：\n\n```java\nStream<String> s = Stream.of(\"monkey\", \"ape\",\
  \ \"bonobo\");\nOptional<String> min = s.min((s1, s2) -> s1.length() - s2.length());\
  \ // 注意：此处原文逻辑应为 find，但示例是 min\n```\n（注：原文示例代码中逻辑是 `findAny`，但代码用的是 `min`，此处保持翻译一致）\n\
  \n#### 匹配\n\n`allMatch()`、`anyMatch()` 和 `noneMatch()` 方法搜索流并返回关于流如何符合 `predicate`\
  \ 的信息。对于无限流，这些方法可能会终止。与查找方法一样，它们不是归约，因为它们并不一定查看所有元素。\n\n方法的签名如下：\n\n```java\npublic\
  \ boolean anyMatch(Predicate<? super T> predicate)\npublic boolean allMatch(Predicate<?\
  \ super T> predicate)\npublic boolean noneMatch(Predicate<? super T> predicate)\n\
  ```\n\n此示例检查名称是否以字母开头：\n\n```java\nvar list = List.of(\"monkey\", \"2\", \"chimp\"\
  );\nStream<String> infinite = Stream.generate(() -> \"chimp\");\nPredicate<String>\
  \ pred = x -> Character.isLetter(x.charAt(0));\nSystem.out.println(list.stream().anyMatch(pred));\
  \ // true\nSystem.out.println(list.stream().allMatch(pred)); // false\nSystem.out.println(list.stream().noneMatch(pred));\
  \ // false\nSystem.out.println(infinite.anyMatch(pred)); // true\n```\n\n\n\n\n\n\
  与 Java 集合框架一样，遍历流（stream）中的元素是常见操作。正如预期的，在无限流上调用 `forEach()` 不会终止。由于没有返回值，因此它不是一种归约（reduction）。\n\
  \n在使用之前，请考虑其他方法是否更好。先学习编写循环的开发者倾向于用循环处理所有事情。例如，一个带有 `if` 语句的循环可以用 `filter` 来编写。你将在中间操作部分学习关于过滤器。\n\
  \n方法签名如下：\n\n```java\npublic void forEach(Consumer<? super T> action)\n```\n\n注意，这是唯一一个返回类型为\
  \ `void` 的终端操作。如果你想让某些操作发生，你必须在 `Consumer` 中实现它。这里是打印流元素的一种方法（还有其他方法，我们将在章节稍后部分介绍）：\n\
  \n```java\nStream<String> s = Stream.of(\"Monkey\", \"Gorilla\", \"Bonobo\");\n\
  s.forEach(System.out::print); // MonkeyGorillaBonobo\n```\n\n![](img/image_rsrc10B8.jpg)\n\
  \n记住你可以直接在 `Collection` 或 `Stream` 上调用 `forEach()`。在考试时看到这两种方法，不要感到困惑。\n\n注意，你不能在流上使用传统的\
  \ `for` 循环。\n\n```java\nStream<Integer> s = Stream.of(1);\nfor (Integer i : s) {}\
  \ // 无法编译\n```\n\n虽然 `forEach()` 听起来像循环，但它实际上是流的终端操作符。流不能作为 for-each 循环的源，因为它们没有实现\
  \ `Iterable` 接口。\n\n###  Reducing\n\n`reduce()` 方法将流合并为单个对象。它们（显然）是归约，意味着它们会处理所有元素。这三个方法的签名如下：\n\
  \n```java\npublic T reduce(T identity, BinaryOperator<T> accumulator)\npublic Optional<T>\
  \ reduce(BinaryOperator<T> accumulator)\npublic <U> U reduce(U identity,\n    BiFunction<U,?\
  \ super T,U> accumulator,\n    BinaryOperator<U> combiner)\n```\n\n让我们逐一来看。最常见的归约方法是从一个初始值开始，不断将其与下一个值合并。考虑一下在不使用函数式编程的情况下，你如何将一个\
  \ `String` 对象数组拼接成单个 `String`。它看起来可能像这样：\n\n```java\nvar array = new String[] {\
  \ \"w\", \"o\", \"l\", \"f\" };\nvar result = \"\";\nfor (var s: array) result =\
  \ result + s;\nSystem.out.println(result); // wolf\n```\n\n`identity` 是归约的初始值，在这种情况下是一个空\
  \ `String`。`accumulator` 将当前结果与流中的当前值相。。通过 Lambda 表达式，我们可以使用流和归约来实现相同的功能：\n\n```java\n\
  Stream<String> stream = Stream.of(\"w\", \"o\", \"l\", \"f\");\nString word = stream.reduce(\"\
  \", (s, c) -> s + c);\nSystem.out.println(word); // wolf\n```\n\n注意我们仍然使用空 `String`\
  \ 作为 `identity`。我们仍然通过串联 `String` 对象来获取下一个值。我们甚至可以使用方法引用来重写它：\n\n```java\nStream<String>\
  \ stream = Stream.of(\"w\", \"o\", \"l\", \"f\");\nString word = stream.reduce(\"\
  \", String::concat);\nSystem.out.println(word); // wolf\n```\n\n让我们再试一个。你能写一个归约来乘以流中所有的\
  \ `Integer` 对象吗？尝试一下。我们的解决方案在这里：\n\n```java\nStream<Integer> stream = Stream.of(3,\
  \ 5, 6);\nSystem.out.println(stream.reduce(1, (a, b) -> a*b)); // 90\n```\n\n我们将\
  \ `identity` 设置为 `1`，并将 `accumulator` 设置为乘法。在很多情况下，`identity` 并不是真正需要的，因此 Java 允许省略它。当你不指定\
  \ `identity` 时，会返回一个 `Optional`，因为可能没有任何数据。`Optional` 中的内容三种选择：\n\n- 如果流为空，返回一个空\
  \ `Optional`。\n- 如果流有一个元素，则返回该元素。\n- 如果流有多个元素，则应用 `accumulator` 将它们合并。\n\n以下说明了这些种场景：\n\
  \n```java\nBinaryOperator<Integer> op = (a, b) -> a * b;\nStream<Integer> empty\
  \ = Stream.empty();\nStream<Integer> oneElement = Stream.of(3);\nStream<Integer>\
  \ threeElements = Stream.of(3, 5, 6);\n\nempty.reduce(op).ifPresent(System.out::println);\
  \         // 无输出\noneElement.reduce(op).ifPresent(System.out::println);    // 3\n\
  threeElements.reduce(op).ifPresent(System.out::println); // 90\n```\n\n为什么有两个相似的方法？为什么不总是要求\
  \ `identity` 呢？Java 本可以那样做。然而，有时区分“流为空的情况”与“存在一个恰好匹配计算结果的 `identity` 的值”是很有用的。返回\
  \ `Optional` 的签名让我们能够区分这些情况。例如，当流为空时我们可能返回 `Optional.empty()`，当有值时返回 `Optional.of(3)`。\n\
  \n第三种方法签名用于我们处理不同类型时。它允许 Java 创建中间归约并在最后将它们合并。让我们来看一个统计字符数量的示例。（注：提供的文本在此处似乎中断或合并，逻辑如下）。\n\
  \n### Collecting\n\n`collect()` 方法是归约的一种特殊类型，称为可变归约（mutable reduction）。它比普通的归约更高效，因为我们在累加时使用了同一个对象。常见的可变对象包括\
  \ `StringBuilder` 和 `ArrayList`。方法签名如下：\n\n```java\npublic <R> R collect(Supplier<R>\
  \ supplier, BiConsumer<R, ? super T> accumulator, BiConsumer<R, R> combiner)\npublic\
  \ <R,A> R collect(Collector<? super T, A,R> collector)\n```\n\n当我们想要专门编写如何进行收集时，使用第一个签名。我们在\
  \ `reduce` 中的 wolf 示例可以转换为使用 `collect()`：\n\n```java\nStream<String> stream = Stream.of(\"\
  w\", \"o\", \"l\", \"f\");\nStringBuilder word = stream.collect(\n    StringBuilder::new,\n\
  \    StringBuilder::append,\n    StringBuilder::append\n);\nSystem.out.println(word);\
  \ // wolf\n```\n\n第一个参数是 `supplier`，用于创建存储结果的对象。第二个 `accumulator` 是一个 `BiConsumer`，将更多元素添加到数据集合中。`combiner`\
  \ 是一个 `BiConsumer`，用于合并两个数据集合，这对并行处理非常有用。\n\n\n\n\n\n```java\nStream<String> stream\
  \ = Stream.of(\"w\", \"o\", \"l\", \"f\");\n\nTreeSet<String> set = stream.collect(\n\
  \    TreeSet::new,\n    TreeSet::add,\n    TreeSet::addAll);\nSystem.out.println(set);\
  \ // [f, l, o, w]\n```\n\n该收集器与一样包含三个部分。`supplier`（供应者）创建一个空的 `TreeSet`。`accumulator`（累加器）将\
  \ `Stream` 中的单个 `String` 添加到 `TreeSet`。`combiner`（合并器）在操作并行执行并需要合并时，将一个 `TreeSet`\
  \ 的元素添加到另一个 `TreeSet` 中。\n\n我们之所以从长签名，是因为这是实现自定义收集器的方法。对于考试来说，了解如何这样做以及理解收集器的工作原理是非常重要的。在实践中，许多常用的收集器会反复出现。为了避免开发者不断重复实现相同的收集器，Java\
  \ 提供了一个命名为 `Collectors` 的类，其中包含了常用的收集器。这种方法也让代码更易读，因为它更具表现力。例如，我们可以将之前的示例重写如下：\n\
  \n```java\nStream<String> stream = Stream.of(\"w\", \"o\", \"l\", \"f\");\n\nTreeSet<String>\
  \ set = stream.collect(Collectors.toCollection(TreeSet::new));\n\nSystem.out.println(set);\
  \ // [f, l, o, w]\n```\n\n如果我们不需要 `set` 排序，可以让代码变得更短：\n\n```java\nStream<String>\
  \ stream = Stream.of(\"w\", \"o\", \"l\", \"f\");\n\nSet<String> set = stream.collect(Collectors.toSet());\n\
  \nSystem.out.println(set); // [f, w, l, o]\n```\n\n对于最后一个，你可能会得到不同的输出，因为 `toSet()`\
  \ 不保证你会得到哪种 `Set` 的实现。它可能是一个 `HashSet`，但你不应该预期或依赖这一点。\n\n![](img/image_rsrc10B8.jpg)\n\
  \n考试要求你不仅能够通过传递 `supplier`、`accumulator` 和 `combiner` 来编写自己的收集器，还要求了解常见的预定义收集器。\n\
  \n在本章的后续部分，我们将展示许多用于数据分组的 `Collectors`。这是一个大话题，因此在混合中加入过多 `Collectors` 之前，最好先掌握流的工作原理。\n\
  \n### 使用常用的中间操作\n\n与终端操作不同，中间操作产生的结果是一个流（stream）。中间操作也可以通过简单地返回另一个无限流来处理无限流。由于元素只在需要时才产生，这种方法运行良好。流水线上的工人不需要担心会有多少后续元素通过，而是可以关注当前元素。\n\
  \n#### 过滤 (Filtering)\n\n`filter()` 方法返回一个包含匹配给定表达式的元素的 `Stream`。其方法签名如下：\n\n```java\n\
  public Stream<T> filter(Predicate<? super T> predicate)\n```\n\n这个操作易于记忆且强大，因为我们可以向它传递任何\
  \ `Predicate`（谓词）。例如，这保留了所有以字母 m 开头的元素：\n\n```java\nStream<String> s = Stream.of(\"\
  monkey\", \"gorilla\", \"bonobo\");\n\ns.filter(x -> x.startsWith(\"m\"))\n    .forEach(System.out::print);\
  \ // monkey\n```\n\n#### 去重 (Removing Duplicates)\n\n`distinct()` 方法返回一个去除了重复值的流。重复值不需要相邻即可被移除。正如你想象的那样，Java\
  \ 调用 `equals()` 来判断对象是否等效。方法签名如下：\n\n```java\npublic Stream<T> distinct()\n```\n\
  \n这里是一个示例：\n\n```java\nStream<String> s = Stream.of(\"duck\", \"duck\", \"duck\"\
  , \"goose\");\n\ns.distinct()\n    .forEach(System.out::print); // duckgoose\n```\n\
  \n#### 按位置限制 (Restricting by Position)\n\n`limit()` 和 `skip()` 方法可以使 `Stream` 变小。`limit()`\
  \ 方法还可以从无限流创建一个有限流。方法签名所示：\n\n```java\npublic Stream<T> limit(long maxSize)\npublic\
  \ Stream<T> skip(long n)\n```\n\n以下代码创建了一个从 1 开始计数的无限数字流。`skip()` 操作返回一个从 6 开始计数的无限流，因为它跳过了前五个元素。`limit()`\
  \ 调用取了其中的前两个。现在我们有一个有两个元素的有限流，然后我们可以用 `forEach()` 方法打印它：\n\n```java\nStream<Integer>\
  \ s = Stream.iterate(1, n -> n + 1);\n\ns.skip(5)\n    .limit(2)\n    .forEach(System.out::print);\
  \ // 67\n```\n\n#### 映射 (Mapping)\n\n`map()` 方法创建从流中的元素到流的下一步元素的一对一映射。方法签名如下：\n\n\
  ```java\npublic <R> Stream<R> map(Function<? super T, ? extends R> mapper)\n```\n\
  \n这看起来比你看到的其他操作复杂。它使用 lambda 表达式来确定传递给函数的类型和返回的类型。\n\n![](img/image_rsrc10B8.jpg)\n\
  \n流上的 `map()` 方法用于转换数据。不要将其与 `Map` 混淆，后者是将键映射到值。\n\n作为一个示例，这段代码将 `String` 对象列表转换为表示其长度的\
  \ `Integer` 对象列表：\n\n```java\nStream<String> s = Stream.of(\"monkey\", \"gorilla\"\
  , \"bonobo\");\n\ns.map(String::length)\n    .forEach(System.out::print); // 67\n\
  ```\n\n记得 `String::length` 是 `x -> x.length()` 的简写。\n\n#### 使用 flatMap\n\n`flatMap()`\
  \ 方法获取流中的每个元素并将其转变为单个流。当你想要移除空列表时这很有用。你应该理解签名：\n\n```java\npublic <R> Stream<R>\
  \ flatMap(Function<? super T, ? extends Stream<? R>> mapper)\n```\n\n### 合并流 (Concatenating\
  \ Streams)\n\n虽然 `flatMap()` 适用于通用情况，但有一种更方便的方法合并两个流：\n\n```java\nvar one = Stream.of(\"\
  Bonobo\");\nvar two = Stream.of(\"Mama Gorilla\", \"Baby Gorilla\");\n\nStream.concat(one,\
  \ two)\n    .forEach(System.out::println);\n```\n\n#### 排序 (Sorting)\n\n`sorted()`\
  \ 方法返回一个元素排序的流。就像数组数组，除非我们指定 `comparator`（比较器），否则 Java 使用自然排序。方法签名如下：\n\n```java\n\
  public Stream<T> sorted()\npublic Stream<T> sorted(Comparator<? super T> comparator)\n\
  ```\n\n调用第一个签名使用默认排序。\n\n```java\nStream<String> s = Stream.of(\"brown-\", \"bear-\"\
  );\n\ns.sorted()\n    .forEach(System.out::print); // bear-brown-\n```\n\n我们可以通过方法或\
  \ lambda 可选使用 `Comparator` 实现。在示例中，我们使用了一个方法：\n\n```java\nStream<String> s = Stream.of(\"\
  brown bear-\", \"grizzly-\");\n\ns.sorted(Comparator.reverseOrder())\n    .forEach(System.out::print);\
  \ // grizzly-brown bear-\n```\n\n\n\n\n\n再次查看第二个 `sorted()` 方法的签名。它接收一个 `Comparator`，这是一个接收两个参数并返回\
  \ `int` 的函数式接口。然而，`Comparator::reverseOrder` 并不是那样的。因为 `reverseOrder()` 不接受参数并返回一个值，该方法引用等同于\
  \ `() -> Comparator.reverseOrder()`，这实际上是一个 `Supplier<Comparator>`。这与 `sorted()`是不兼容的。我们提到这一点是为了提醒你，你确实需要熟练掌握方法引用。\n\
  \n## 窥探一下\n\n`peek()` 方法是我们的最后一个中间操作。它对调试非常有用，因为允许我们在在不改变流的情况下执行流操作。其方法签名如下：\n\n\
  ```java\npublic Stream<T> peek(Consumer<? super T> action)\n```\n\n你可能会注意到，中间操作\
  \ `peek()` 的参数与终端操作 `forEach()` 的参数相同。可以将 `peek()` 视为 `forEach()` 的一个间接版本，它会将原始流返回给你。\n\
  \n`peek()` 最常见的用途是在流流过时输出其内容。假设我们写了一个拼写错误，统计了以字母 `g` 开头的而非以 `b` 开头的熊。我们对计数为 1 而不是\
  \ 2 感到困惑。我们可以添加一个 `peek()` 方法来找出原因。\n\n```java\nvar stream = Stream.of(\"black bear\"\
  , \"brown bear\", \"grizzly\");\n\nlong count = stream.filter(s -> s.startsWith(\"\
  g\"))\n    .peek(System.out::println).count();             // grizzly\n\nSystem.out.println(count);\
  \                          // 1\n```\n\n在第 9 章中，你看到在处理 `Queue` 时，`peek()` 只查看第一个元素。在流中，`peek()`\
  \ 会查看通过流管道该部分的每个元素。这就像有一个工作人员对流程中特定步骤的执行情况做笔记。\n\n## 危险：改变状态\n\n通常情况下，在流管道中产生副作用是不良实践。例如，使用收集器（collector）创建一个新列表，比修改现有列表中的元素更好。同样，如果你试图跟踪某些内容，让流返回计数比增加实例变量计数器更好。然而，在考试中，你可能会看到为了使代码更简洁而使用的副作用，如下所示：\n\
  \n```java\nprivate static int count = 20;\n\npublic void incrementCountBadly() {\n\
  \    Stream.iterate(0, n -> n + 1)\n        .limit(10)\n        .forEach(p -> count++);\n\
  }\n```\n\n同样，`peek()` 的意图是在不改变结果的情况下执行操作。这是一个没有使用 `peek()` 的简单流管道：\n\n```java\n\
  var numbers = new ArrayList<>();\nvar letters = new ArrayList<>();\nnumbers.add(1);\n\
  letters.add('a');\nStream<List<?>> stream = Stream.of(numbers, letters);\nstream.map(List::size).forEach(System.out::print);\
  \ // 11\n```\n\n现在我们添加一个 `peek()` 调用并注意 Java 并没有阻止我们编写糟糕的 `peek` 代码：\n\n```java\n\
  Stream<List<?>> bad = Stream.of(numbers, letters);\nbad.peek(x -> x.remove(0))\n\
  \    .map(List::size)\n    .forEach(System.out::print); // 00\n```\n\n这个例子是非常糟糕的，因为\
  \ `peek()` 正在修改流中使用的数据结构，这导致流管道的结果与 `peek` 不存在时的结果不同。\n\n## 组合管道\n\n流允许你使用链式调用并表达你想实现的目标，而不是如何实现。假设我们想要按字母顺序获取我们的朋友中前两个长度为四个字符的名字。如果不使用流，我们必须写类似下面的代码：\n\
  \n```java\nvar list = List.of(\"Toby\", \"Anna\", \"Leroy\", \"Alex\");\nList<String>\
  \ filtered = new ArrayList<>();\nfor (String name: list)\n    if (name.length()\
  \ == 4) filtered.add(name);\nCollections.sort(filtered);\nvar iter = filtered.iterator();\n\
  if (iter.hasNext()) System.out.println(iter.next());\nif (iter.hasNext()) System.out.println(iter.next());\n\
  ```\n\n这可以行通。但它需要一些阅读和思考才能弄清楚发生了什么。我们试图解决的问题丢失在了实现细节中。它也非常关注“怎么做”而不是“做什么”。使用流，等效的代码如下：\n\
  \n```java\nvar list = List.of(\"Toby\", \"Anna\", \"Leroy\", \"Alex\");\nlist.stream().filter(n\
  \ -> n.length() == 4).sorted()\n    .limit(2).forEach(System.out::println);\n```\n\
  \n在你说它更难读之前，我们可以对它进行格式化。\n\n\n\n\n\n```java\n.forEach(System.out::println);\n```\n\
  \n这段代码会打印两次 Elsa。`filter` 允许元素通过，而 `limit()` 在两个两个元素后就会停止前面的操作。现在 `sorted()` 可以排序了，因为我们有一个有限的列表。最后，你认为这段代码会发生什么？\n\
  \n```java\nStream.generate(() -> \"Olaf Lazisson\")\n    .filter(n -> n.length()\
  \ == 4)\n    .limit(2)\n    .sorted()\n    .forEach(System.out::println);\n```\n\
  \n这段代码也会挂起，直到我们杀死程序为止。`filter` 不允许任何内容通过，因此 `limit()` 永远看不到两个元素。这意味着我们必须继续等待，并希望它们出现。\n\
  \n你甚至可以将两个流水线组合在一起。看看你能否识别出这段代码中的两个源（source）和两个终端操作（terminal operations）。\n\n```java\n\
  30: long count = Stream.of(\"goldfish\", \"finch\")\n31:     .filter(s -> s.length()>\
  \ 5)\n32:     .collect(Collectors.toList())\n33:     .stream()\n34:     .count();\n\
  35: System.out.println(count);   // 1\n```\n\n第 30–32 行是一个流水线，第 33 和 34 行是另一个。对于第一个流水线，第\
  \ 30 行是源，第 32 行是终端操作。对于第二个流水线，第 33 行是源，第 34 行是终端操作。现在输出数字 1 的方法可真复杂！\n\n![](img/image_rsrc10BA.jpg)\n\
  \n在考试中，你可能会看到长或复杂的流水线作为选项。如果发生这种情况，请关注答案之间的差异。那些将成为你找到正确答案的线索。这种方法还能节省你的时间，因为不需要研究每个选项中的整个流水线。\n\
  \n当你看到链式流水线时，注意源和终端操作的位置。这将帮助你跟踪当前的状况。你甚至可以在脑中重写代码，在中间设置一个变量，这样它就不会那么长那么复杂了。我们之前的示例可以写成：\n\
  \n```java\nList<String> helper = Stream.of(\"goldfish\", \"finch\")\n    .filter(s\
  \ -> s.length()> 5)\n    .collect(Collectors.toList());\n\nlong count = helper.stream()\n\
  \    .count();\n\nSystem.out.println(count);\n```\n\n使用哪种风格取决于你。然而，在参加考试之前，你需要能够读懂这两种风格。\n\
  \n## 使用原始类型流（Primitive Streams）\n\n到目前，我们创建的所有流都使用了带有泛型类型的 `Stream` 接口，例如 `Stream<String>`、`Stream<Integer>`\
  \ 等。对于数值值，我们一直在使用包装类。我们在第 9 章中通过 Collections API 这样做过，所以感觉起来应该很自然。\n\nJava 实际上包含了除了\
  \ `Stream` 之外的其它流接口，可以使用它们来处理特定的原始类型：int, double, 和 long。让我们来看看为什么需要这些。假设我们要计算一个有限流中数字之和：\n\
  \n```java\nStream<Integer> stream = Stream.of(1, 2, 3);\nSystem.out.println(stream.reduce(0,\
  \ (s, n) -> s + n));  // 6\n```\n\n还不错。写一个规约（reduction）并不困难。我们从零开始累加。然后每当流中出现一个数字，我们就将其加到该运行总和中。还有另一种方法，如下所示：\n\
  \n```java\nStream<Integer> stream = Stream.of(1, 2, 3);\nSystem.out.println(stream.mapToInt(x\
  \ -> x).sum());  // 6\n```\n\n这一次，我们将 `Stream<Integer>` 转换为 `IntStream`，并要求 `IntStream`\
  \ 为我们计算总和。`IntStream` 拥有许多与 `Stream` 相同的中间操作和终端方法，但包含了用于处理数值数据的专门方法。原始类型流知道如何自动执行某些常用操作。\n\
  \n对于像平均值这样计算起来更费力的操作，它甚至更加有用：\n\n```java\nIntStream intStream = IntStream.of(1,\
  \ 2, 3);\nOptionalDouble avg = intStream.average();\nSystem.out.println(avg.getAsDouble());\
  \  // 2.0\n```\n\n不仅可以计算平均值，而且这样做很容易。显然，原始类型流是非常重要的。我们将查看创建和使用此类流，包括可选类型（optionals）和函数式接口。\n\
  \n### 创建原始类型流\n\n这里是三种类型的原始类型流：\n\n*   `IntStream`: 用于原始类型 `int`、`short`、`byte`\
  \ 和 `char`\n*   `LongStream`: 用于原始类型 `long`\n*   `DoubleStream`: 用于原始类型 `double`\
  \ 和 `float`\n\n为什么每个原始类型没有它自己的原始类型流呢？这三种是最常见的，所以 API 设计者选择了它们。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n当你在考试中看到“stream”一词时，请注意大小写。用大写字母 S 或在代码中，`Stream` 是包含 Object 类型的接口名称。用小写 s 时，stream\
  \ 是一个概念，可能是 `Stream`、`DoubleStream`、`IntStream` 或 `LongStream`。\n\n表 10.5 显示了一些原始类型流特有的方法。\n\
  \n| 方法 | 原始类型流 | 说明 |\n| :--- | :--- | :--- |\n| `average()` | `OptionalDouble`\
  \ | 平均值 |\n| `boxed()` | `Stream<T>` | 包装 |\n| `empty()` | `DoubleStream` | 空 |\n\
  | `of()` | `Stream<T>` | 单个值 |\n| `range(int start, int end)` | `IntStream` | 范围\
  \ |\n| `rangeClosed(int start, int end)` | `IntStream` | 闭区间范围 |\n| `count()` |\
  \ `long` | 计数 |\n| `sum()` | `long` | 求和 |\n| `sum()` | `double` | 求和 |\n| `summaryStatistics()`\
  \ | `IntSummary` | 统计信息 |\n| `summaryStatistics()` | `LongSummary` | 统计信息 |\n| `summaryStatistics()`\
  \ | `DoubleSummary` | 统计信息 |\n\n某些创建原始类型流的方法与我们创建 `Stream` 的方式相同。\n\n```java\nDoubleStream\
  \ empty = DoubleStream.empty();\n```\n\n另一种方法是使用 `of()` 方法从单个值或可变参数。\n\n```java\n\
  DoubleStream oneValue = DoubleStream.of(3.14);\noneValue.forEach(System.out::println);\n\
  \nDoubleStream varargs = DoubleStream.of(1.0, 1.1, 1.2);\nvarargs.forEach(System.out::println);\n\
  ```\n\n这段代码输出：\n\n3.14\n1.0\n1.1\n1.2\n\n你也可以使用创建无限流的方法，就像我们对 `Stream` 一样。\n\n```java\n\
  var random = DoubleStream.generate(Math::random);\nvar fractions = DoubleStream.iterate(.5,\
  \ d -> d / 2);\n\nrandom.limit(3).forEach(System.out::println);\nfractions.limit(3).forEach(System.out::println);\n\
  ```\n\n由于流是无限的，我们添加了 `limit` 中间操作，以免输出无限打印。第一个流调用 `Math` 的静态方法来获取随机双。由于数字是随机的，你的输出显然不同。第二个流不断创建更小的数字，每次将上一个值除以二。我们运行这段代码时的输出如下：\n\
  \n0.07890654781186413\n0.28564363465842346\n0.6311403511266134\n0.5\n0.25\n0.125\n\
  \n当处理 `int` 或 `long` 原始类型时，计数是很常见的。假设我们想要一个从 1 到 5 的数字流。我们可以使用到目前为止解释的内容这样写：\n\n\
  ```java\nIntStream count = IntStream.iterate(1, n -> n + 1).limit(5);\n```\n\n\n\
  \n\n\n```java\ncount.forEach(System.out::print); // 12345\n```\n\n这段代码确实打印了数字 1–5。然而，为了实现这么简单的事情，写了太多的代码。Java\
  \ 提供了一个可以生成数字范围的方法。\n\n```java\nIntStream range = IntStream.range(1, 6);\n\nrange.forEach(System.out::print);\
  \ // 12345\n```\n\n这样更好了。如果我们想要 1–5 的数字，为什么要传递 1–6 呢？`range()` 方法的第一个参数是包含的（inclusive），意味着它包含该数字。`range()`\
  \ 方法的第二个参数是不包含的（exclusive），意味着它在那个数字之前就停止。然而，这仍然可以更清晰一些。我们想要包含 1–5 在内的数字。幸运的是，还有另一个方法\
  \ `rangeClosed()`，它对两个参数都是包含的。\n\n```java\nIntStream rangeClosed = IntStream.rangeClosed(1,\
  \ 5);\n\nrangeClosed.forEach(System.out::print); // 12345\n```\n\n更好了。这次我们表达了想要一个闭区间或包含边界的范围。这个方法更符合我们用纯正英语表达数字范围的方式。\n\
  \n### 映射流（Mapping Streams）\n\n创建原始流的另一种方法是通过从另一种流类型进行映射。表 10.6 显示，有一种可以在任何流类型之间进行映射的方法。\n\
  \n表 10.6 不同类型流之间的映射方法\n\n| 源流 | 创建 Stream | 创建 DoubleStream | 创建 IntStream | 创建\
  \ LongStream |\n| --- | --- | --- | --- | --- |\n| `Stream<T>` | `map()` | `mapToDouble()`\
  \ | `mapToInt()` | `mapToLong()` |\n| `DoubleStream` | `mapToObj()` | `map()` |\
  \ `mapToInt()` | `mapToLong()` |\n| `IntStream` | `mapToObj()` | `mapToDouble()`\
  \ | `map()` | `mapToLong()` |\n| `LongStream` | `mapToObj()` | `mapToDouble()` |\
  \ `mapToInt()` | `map()` |\n\n显然，为了让这些操作工作，类型必须是兼容的。Java 要求提供一个映射函数作为参数，例如：\n\n\
  ```java\nStream<String> objStream = Stream.of(\"penguin\", \"fish\");\n\nIntStream\
  \ intStream = objStream.mapToInt(s -> s.length());\n```\n\n此函数接收一个 `Object`，在当前情况下是\
  \ `String`。该函数返回一个 `int`。这里的函数映射是直观的。它们接收源类型并返回目标类型。在这个示例中，实际的函数类型是 `ToIntFunction`。表\
  \ 10.7 显示了映射函数的名称。如你所见，它们正如你所预期那样工作。\n\n表 10.7 流类型之间映射时的函数参数\n\n| 源流 | 创建 Stream\
  \ | 创建 DoubleStream | 创建 IntStream | 创建 LongStream |\n| --- | --- | --- | --- |\
  \ --- |\n| `Stream<T>` | `Function<T,R>` | `ToDoubleFunction<T>` | `ToIntFunction<T>`\
  \ | `ToLongFunction<T>` |\n| `DoubleStream` | `Double Function<R>` | `DoubleUnary\
  \ Operator` | `DoubleToInt Function` | `DoubleToLong Function` |\n| `IntStream`\
  \ | `IntFunction<R>` | `IntToDouble Function` | `IntUnary Operator` | `IntToLong\
  \ Function` |\n| `LongStream` | `Long Function<R>` | `LongToDouble Function` | `LongToInt\
  \ Function` | `LongUnary Operator` |\n\n你确实需要记忆 表 10.6 和 表 10.7。这并没有看起来有那么难。如果你记住几条规则，名称中是有模式的。对于\
  \ 表 10.6，映射到你开始时的相同类型仅被称为 `map()`。当返回对象流时，该方法是 `mapToObj()`。除此之外，它就是 map 方法名中原始类型的名称。\n\
  \n对于 表 10.7，你可以从思考源类型和目标类型开始。当目标类型是对象时，去掉名称中的 `To`。当映射到你开始时的相同类型时，对于原始流，你使用一元运算符（unary\
  \ operator）而不是函数。\n\n### 使用 flatMap()\n\n我们也可以对原始流使用这种方法。它的工作方式与普通 Stream 相同，只是方法名不同。这里有一个示例：\n\
  \n```java\nvar integerList = new ArrayList<Integer>();\n\nIntStream ints = integerList.stream()\n\
  \    .flatMapToInt(x -> IntStream.of(x));\n\nDoubleStream doubles = integerList.stream()\n\
  \    .flatMapToDouble(x -> DoubleStream.of(x));\n\nLongStream longs = integerList.stream()\n\
  \    .flatMapToLong(x -> LongStream.of(x));\n```\n\n此外，你可以从原始流创建一个 `Stream`。这些方法展示了实现此点的两种方式：\n\
  \n```java\nprivate static Stream<Integer> mapping(IntStream stream) {\n    return\
  \ stream.boxed();\n}\n\nprivate static Stream<Integer> mapping(IntStream stream)\
  \ {\n    return stream.mapToObj(x -> x);\n}\n```\n\n（注：原文示例中方法名重复，第一个方法是 `boxed()`，第二个是\
  \ `mapToObj(x -> x)`，此处根据逻辑补全，翻译时保持原意）我们也可以对原始流使用这种方法。它的工作方式与普通 Stream 相同，只是方法名不同。这里有一个示例：\n\
  （代码上略）\n此外，你可以从原始流创建一个 `Stream`。这些方法展示了实现此点的两种方式：\n（代码上略）\n\n\n\n\n\n```java\nreturn\
  \ optional.orElseThrow(RuntimeException::new);\n\n}\n```\n\n这到目前应该是老生忘了。因为我们有一个\
  \ `IntStream`，所以得到了一个 `OptionalInt`。如果该可选值包含值，我们就返回它。否则，我们抛出一个新的 `RuntimeException`。\n\
  \n现在我们想更改方法，使其接收一个 `IntStream` 并返回一个范围。该范围是最大值减去最小值。哦不。`min()` 和 `max()` 都是终端操作，这意味着它们在执行时会消耗掉该流。我们不能在同一个流上运行两次终端操作。幸运的是，这是一个常见问题，原始类型流通过汇总统计（summary\
  \ statistics）为我们解决了这个问题。`Statistic`（统计量）只是从数据中计算出的数字的统称。\n\n```java\nprivate static\
  \ int range(IntStream ints) {\n    IntSummaryStatistics stats = ints.summaryStatistics();\n\
  \    if (stats.getCount() == 0) throw new RuntimeException();\n    return stats.getMax()\
  \ - stats.getMin();\n}\n```\n\n在这里，我们要求 Java 对流进行许多计算。汇总统计包括以下：\n\n*   `getCount()`：返回一个表示数量的\
  \ `long`。\n*   `getAverage()`：返回一个表示平均值的 `double`。如果流为空，则返回 `0.0`。\n*   `getSum()`：对于\
  \ `DoubleSummaryStatistics` 返回 `double` 类型的总和，对于 `IntSummaryStatistics` 和 `LongStatistics`\
  \ 返回 `long` 类型。\n*   `getMin()`：返回最小的数字（最小值），根据流的类型返回 `double`、`int` 或 `long`。如果流为空，则返回该类型的最大数值。\n\
  *   `getMax()`：返回最大的数字（最大值），根据流的类型返回 `double`、`int` 或 `long`。如果流为空，则返回该类型的最小数值。\n\
  \n## 高高级流流水线概念的操作\n\n恭喜你，你只剩下最后几个主题了！在最后一个流章节中，我们学习了流与底层数据之间的关系、`Optional` 链式、分组收集器（grouping\
  \ collectors）以及使用 `Spliterator`。之后，你就是流操作的专家了！\n\n### 将流链接到底层数据\n\n你认为这会输出什么？\n\n\
  ```java\n25: var cats = new ArrayList<String>();\n26: cats.add(\"Annie\");\n27:\
  \ cats.add(\"Ripley\");\n28: var stream = cats.stream();\n29: cats.add(\"KC\");\n\
  30: System.out.println(stream.count());\n```\n\n正确答案是 3。第 25-27 行创建了一个包含两个元素的 `List`。第\
  \ 28 行请求从该 `List` 创建流。记住，流是懒性求值的。这意味着流并没有在第 28 行创建，而是创建了一个知道需要时去哪里查找数据的对象。在第 29\
  \ 行，`List` 获取了一个新元素。在第 30 行，流流水线在运行时看到了三个元素，从而给了我们那个计数。\n\n### Optional 链式\n\n到目前，你已经熟悉在流流水线中进行链式操作的好处。流提供的一些中间操作也适用于\
  \ `Optional`，如表 10.9 所示。\n\n**表 10.9 高级 Optional 实例方法**\n\n| 方法 | 当 Optional 为空时\
  \ | 当 Optional 值时 |\n| --- | --- | --- |\n| `filter(Predicate p)` | 返回空 `Optional`\
  \ | 如果元素匹配 `Predicate`，则返回包含元素的 `Optional`，否则返回空 `Optional` |\n| `flatMap(Function\
  \ f)` | 返回空 `Optional` | 返回将 `Function` 应用于元素的 `Optional`。`Function` 的返回类型必须继承 `Optional`。\
  \ |\n| `map(Function f)` | 返回空 `Optional` | 返回将 `Function` 应用于元素的 `Optional` |\n\
  \n假设你得到了一个 `Optional<Integer>` 并被要求打印该值，但仅当它是三位数时。如果不使用函数式编程，你可以写如下代码：\n\n```java\n\
  private static void threeDigit(Optional<Integer> optional) {\n    if (optional.isPresent())\
  \ {  // 外层 if\n        var num = optional.get();\n        var string = \"\" + num;\n\
  \        if (string.length() == 3) // 内层 if\n            System.out.println(string);\n\
  \    }\n}\n```\n\n这可以工作，但它包含了嵌套的 if 语句。那是额外的复杂度。让我们再次用函数式编程试一次：\n\n```java\nprivate\
  \ static void threeDigit(Optional<Integer> optional) {\n        optional.map(n ->\
  \ \"\" + n)               // 部分 1\n        .filter(s -> s.length() == 3)      //\
  \ 部分 2\n        .ifPresent(System.out::println);  // 部分 3\n}\n```\n\n这要短得多且更具表现力。对于\
  \ Lambda 表达式，考试非常喜欢将单个语句拆分并用注释标识各个部分。我们在这里这样做是为了展示函数式编程和非函数式编程方法都会发生什么。\n\n假设我们得到了一个空的\
  \ `Optional`。第一种方法对外层 if 语句返回 false。第二种方法看到空的 `Optional`，并让 `map()` 和 `filter()`\
  \ 都通过它。然后 `ifPresent()` 看到一个空的 `Optional`。\n\n等等，第一种方法对外层 if 语句返回 false。第二种方法看到空的\
  \ `Optional`，并让 `map()` 和 `filter()` 都通过它。然后 `ifPresent()` 看到一个空的 `Optional`。\n\n\
  等等，第一种方法对外层 if 语句返回 false。第二种方法看到空的 `Optional`，并让 `map()` 和 `filter()` 都通过它。然后 `ifPresent()`\
  \ 看到一个空的 `Optional`。\n\n等等，第一种方法对外层 if 语句返回 false。第二种方法看到空的 `Optional`，并让 `map()`\
  \ 和 `filter()` 都通过它。然后 `ifPresent()` 看到一个空的 `Optional`。\n\n最后情况是给了一个数字。假设我们想获取一个\
  \ `Optional<Integer>` 来表示 String 的长度。这很简单：\n\n```java\nOptional<Integer> result\
  \ = optional.map(String::length);\n```\n\n如果我们有一个接收 String 并为我们执行逻辑的辅助方法呢？它会返回 `Optional<Integer>`，如下：\n\
  \n```java\npublic static Optional<Integer> calculator(String text) {\n    // 计算\n\
  }\n```\n\n使用 `map` 调用它不起作用：\n\n```java\nOptional<Integer> result = optional.map(calculator);\
  \ // 编译错误\n```\n\n问题在于 `calculator` 返回 `Optional<Integer>`。`map()` 方法又增加了一层 `Optional`，给了我们\
  \ `Optional<Optional<Integer>>`。好吧，那不太好。解决方案是调用 `flatMap()`，而不是：\n\n```java\nOptional<Integer>\
  \ result = optional.flatMap(calculator);\n```\n\n这个可以工作，因为 `flatMap` 移除了不必要的层。换句话说，它展平了结果。链式调用\
  \ `flatMap()` 当你想将一个 `Optional` 类型转换为另一种时非常有用。\n\n### 真实世界场景\n\n![](img/image_rsrc10BB.jpg)\n\
  \n### 异常与函数接口\n\n你现在可能已经注意到大多数函数接口都不声明检查异常。这通常没问题。但在处理声明检查异常的方法时，会出现问题。假设我们有一个抛出检查异常的类。\n\
  \n```java\nimport java.io.*;\nimport java.util.*;\n\npublic class ExceptionCaseStudy\
  \ {\n    private static List<String> create() throws IOException {\n        throw\
  \ new IOException();\n    }\n}\n```\n\n现在现在我们在流中使用它：\n\n```java\npublic void good()\
  \ throws IOException {\n    ExceptionCaseStudy.create().stream().count();\n}\n```\n\
  \n没什么新奇了。`create()` 方法抛出检查异常。调用方法处理或声明了它。现在，这一个呢？\n\n```java\npublic void bad()\
  \ throws IOException {\n    Supplier<List<String>> s = ExceptionCaseStudy::create;\
  \ // 编译错误\n}\n```\n\n实际的编译器错误如下：\n\n`unhandled exception type IOException`\n\n说什么？问题是该方法引用展开的函数接口没有声明异常。`Supplier`\
  \ 接口不允许检查异常。有两种方法可以绕过这个问题。一种方法是捕获异常并将其转换为运行时异常。\n\n```java\npublic void ugly() {\n\
  \    Supplier<List<String>> s = () -> {\n        try {\n            return ExceptionCaseStudy.create();\n\
  \        } catch (IOException e) {\n```\n\n\n\n```java\nthrow new RuntimeException(e);\n\
  \n}\n\n};\n\n}\n```\n\n这种写法可以运行。但代码看起来很丑陋。函数式编程的好处之一是代码应该是易读且简洁的。另一种替代方案是创建一个带有\
  \ try/catch 的包装方法。\n\n```java\nprivate static List<String> createSafe() {\n    try\
  \ {\n        return ExceptionCaseStudy.create();\n    } catch (IOException e) {\n\
  \        throw new RuntimeException(e);\n    } }\n```\n\n现在我们可以无问题地在 `Supplier`\
  \ 中这个安全的包装方法了。\n\n```java\npublic void wrapped() {\n    Supplier<List<String>> s2\
  \ = ExceptionCaseStudy::createSafe;\n}\n```\n\n### 收集结果\n\n你几乎完成了关于流的学习。最后一个主题基于你目前所学的知识来对结果进行分组。在章节早期，你看到了\
  \ `collect()` 终端操作。有很多预定义的收集器，包括表 10.10 所示所示。这些收集器可以通过 `Collectors` 类上的静态方法可用。我们在接下来的章节中查看不同类型的收集器。为了简单起见，我们省略了泛型。\n\
  \nTABLE 10.10 分组/分区收集器示例\n\n| 收集器 | 说明 | 传递给 collect 时的返回值 |\n| --- | --- | ---\
  \ |\n| `averagingDouble( ToDoubleFunction f)` `averagingInt(ToIntFunction f)` `averagingLong(ToLongFunction\
  \ f)` | 计算三个核心原始类型类型的平均值 | Double |\n| `counting()` | 统计元素数量 | Long |\n| `filtering(Predicate\
  \ p, Collector c)` | 在调用下游收集器之前应用过滤器 | R |\n| `groupingBy(Function f)` | 根据指定函数分组创建\
  \ map，带有可选的 map 类型供应商和可选的 D 类型下游收集器 | Map<K, List<T>> |\n| `groupingBy(Function\
  \ f, Collector dc)` | Map<K, List<D>> |\n| `groupingBy(Function f, Supplier s, Collector\
  \ dc)` | Map<K, List<D>> |\n| `joining(CharSequence cs)` | 如果指定了 cs，则使用元素元素分隔符创建单个\
  \ String | String |\n| `maxBy(Comparator c) minBy(Comparator c)` | 找到最大/最小元素 | Optional<T>\
  \ |\n| `mapping(Function f, Collector dc)` | 添加另一层收集器 | Collector |\n| `partitioningBy(Predicate\
  \ p) partitioningBy(Predicate p, Collector dc)` | 根据指定谓词分组创建 map，带有可选的进一步下游收集器 |\
  \ Map<Boolean, List<T>>| |\n| `summarizingDouble( ToDoubleFunction f)` `summarizingInt(ToIntFunction\
  \ f)` `summarizingLong(ToLongFunction f)` | 计算平均值、最小值、最大值等 | DoubleSummaryStatistics\
  \ IntSummaryStatistics LongSummaryStatistics |\n| `summingDouble( ToDoubleFunction\
  \ f)` `summingInt(ToIntFunction f)` `summingLong(ToLongFunction f)` | 计算我们三个核心原始类型的和\
  \ | Double Integer Long |\n| `teeing(Collector c1, Collector c2, BiFunction f)`\
  \ | 与两个收集器的结果配合创建新类型 | R |\n| `toList() toSet()` | 创建任意类型的列表或集合 | List Set |\n|\
  \ `toCollection(Supplier s)` | 创建指定类型的 Collection | Collection |\n| `toMap(Function\
  \ k, Function v) toMap(Function k, Function v, BinaryOperator m)` `toMap(Function\
  \ k, Function v, BinaryOperator m, Supplier s)` | 使用函数来映射键、值、可选的合并函数以及可选的 map 类型供应商创建\
  \ map | Map |\n\n![](img/image_rsrc10B8.jpg)\n\n还有一个名为 `reducing()` 的收集器。考试不需要知道它。它是一个通用规约，以防之前所有的收集器都不能满足你的。\n\
  \n#### 使用基本收集器\n\n幸运的是，许多收集器的工作方式是相同的。让我们来看一个例子：\n\n```java\nvar ohMy = Stream.of(\"\
  lions\", \"tigers\", \"bears\");\nString result = ohMy.collect(Collectors.joining(\"\
  , \"));\nSystem.out.println(result); // lions, tigers, bears\n```\n\n注意预定义的收集器是在\
  \ `Collectors` 类中而不是 `Collector` 接口中。这是一个常见的主题，你在对比 `Collection` 和 `Collections`\
  \ 时就见过。事实上，在第 14 章中处理 `Paths`、`Path` 和其他相关类型时再次看到了这种模式。\n\n我们将预定义的 `joining()` 收集器传递给\
  \ `collect()` 方法。流的所有元素随后将合并为一个 `String`，每个元素之间使用指定的分隔符。将 `Collector` 传递给 `collect`\
  \ 方法是重要的。它的目的是帮助收集元素。`Collector` 本身什么都不做。\n\n让我们尝试另一个。这三个动物名称的平均长度是多少？\n\n```java\n\
  var ohMy = Stream.of(\"lions\", \"tigers\", \"bears\");\nDouble result = ohMy.collect(Collectors.averagingInt(String::length));\n\
  System.out.println(result); // 5.333333333333333\n```\n\n模式是相同的。我们将收集器传递给 `collect()`，它为我们执行平均计算。这次，我们需要传递一个函数来告诉收集器要对什么取平均值。\n\
  \n（此处省略重复的示例代码块翻译）\n\n\n\n\n现在我们想反过来操作，将动物名称的长度映射到名称本身。我们第一次错误的尝试在此所示：\n\n```java\n\
  var ohMy = Stream.of(\"lions\", \"tigers\", \"bears\");\n\nMap<Integer, String>\
  \ map = ohMy.collect(Collectors.toMap(\n   String::length,\n   k -> k)); // BAD\n\
  ```\n\n运行这段代码会产生一个类似于下面的异常：\n\n```\nException in thread \"main\" java.lang.IllegalStateException:\n\
  \    Duplicate key 5 (attempted merging values lions and bears)\n```\n\n哪里出错了？两个动物名称的长度相同。我们没有告诉\
  \ `Java` 应该怎么做。收集器应该选择它遇到的第一个一个？还是最后一个一个？还是将两者合并？由于收集器并不知道该做什么，它通过抛出异常来“解决”这个问题，并把问题留给了我们。真周到啊。让我们假设我们的需求是创建一个用逗号分隔的包含名称的\
  \ `String`。我们可以这样写：\n\n```java\nvar ohMy = Stream.of(\"lions\", \"tigers\", \"bears\"\
  );\n\nMap<Integer, String> map = ohMy.collect(Collectors.toMap(\n   String::length,\n\
  \   k -> k,\n   (s1, s2) -> s1 + \",\" + s2));\n\nSystem.out.println(map);     \
  \         // {5=lions,bears, 6=tigers}\nSystem.out.println(map.getClass()); // class\
  \ java.util.HashMap\n```\n\n返回的 `Map` 恰好是一个 `HashMap`。这种行为是不保证的。假设我们想强制代码返回一个 `TreeMap`。没问题。我们只需要添加一个构造函数引用作为参数：\n\
  \n```java\nvar ohMy = Stream.of(\"lions\", \"tigers\", \"bears\");\n\nTreeMap<Integer,\
  \ String> map = ohMy.collect(Collectors.toMap(\n   String::length,\n   k -> k,\n\
  \   (s1, s2) -> s1 + \",\" + s2,\n   TreeMap::new));\n\nSystem.out.println(map);\
  \              // {5=lions,bears, 6=tigers}\nSystem.out.println(map.getClass());\
  \ // class java.util.TreeMap\n```\n\n这一次我们得到了指定的类型。到目前为止都明白了吗？这段代码很长，但并不是特别复杂。我们确实向你承诺过代码会很长的！\n\
  \n## 分组、分区与映射\n\n到这里做得很好。出题者喜欢询问 `groupingBy()` 和 `partitioningBy()`，所以请确保你非常理解这些部分。现在假设我们想按长度对名称进行分组。我们可以通过说想按长度分组来实现。\n\
  \n```java\nvar ohMy = Stream.of(\"lions\", \"tigers\", \"bears\");\n\nMap<Integer,\
  \ List<String>> map = ohMy.collect(\n   Collectors.groupingBy(String::length));\n\
  \nSystem.out.println(map);  // {5=[lions, bears], 6=[tigers]}\n```\n\n`groupingBy()`\
  \ 收集器告诉 `collect()` 它应该将流中的所有元素分组到一个 `Map` 中。函数决定了 `Map` 中的键。`Map` 中的每个值都是匹配该键的所有条目的\
  \ `List`。\n\n![](img/image_rsrc10B8.jpg)\n\n注意，你在 `groupingBy()` 中调用的函数不能返回 `null`。它不允许空键。\n\
  \n假设我们不想让 map 的值为 `List`，而是更倾向于使用 `Set`。没问题。另一种方法签名允许我们传递一个下游收集器。这是第二个收集器，它对值进行特殊处理。\n\
  \n```java\nvar ohMy = Stream.of(\"lions\", \"tigers\", \"bears\");\n\nMap<Integer,\
  \ Set<String>> map = ohMy.collect(\n   Collectors.groupingBy(\n       String::length,\n\
  \       Collectors.toSet()));\n\nSystem.out.println(map);  // {5=[lions, bears],\
  \ 6=[tigers]}\n```\n\n我们甚至可以通过另一个参数来更改返回的 `Map` 类型。\n\n```java\nvar ohMy = Stream.of(\"\
  lions\", \"tigers\", \"bears\");\n\nTreeMap<Integer, Set<String>> map = ohMy.collect(\n\
  \   Collectors.groupingBy(\n       String::length,\n       TreeMap::new,\n     \
  \  Collectors.toSet()));\n\nSystem.out.println(map); // {5=[lions, bears], 6=[tigers]}\n\
  ```\n\n这非常灵活。如果我们想改变返回的 `Map` 类型，但保持值的类型为 `List` 呢？并没有专门的方法，因为使用现有的方法就能很容易写。\n\n\
  ```java\nvar ohMy = Stream.of(\"lions\", \"tigers\", \"bears\");\n\nTreeMap<Integer,\
  \ List<String>> map = ohMy.collect(\n   Collectors.groupingBy(\n       String::length,\n\
  \       TreeMap::new,\n       Collectors.toList()));\n```\n\n\n\n\n我们不会告诉你这段代码易于阅读。我们会告诉你，它是你考试中需要理解的最复杂的内容。与上一个示例相比，你可以看到我们将\
  \ `counting()` 替换为了 `mapping()`。恰好的是 `mapping()` 接受两个参数：用于值的函数以及如何对其进行进一步分组的方法。\n\
  \n你可能会看到配合静态导入（static import）使用 `collect` 以使代码更短。考试甚至可能会使用 `var` 作为返回值，并使用比我们更少的缩进。这意味着你可能会看到类似如下的内容：\n\
  \n```java\nvar ohMy = Stream.of(\"lions\", \"tigers\", \"bears\");\n\nvar map =\
  \ ohMy.collect(groupingBy(String::length,\n    mapping(s -> s.charAt(0), minBy((a,\
  \ b) -> a - b))));\nSystem.out.println(map);    // {5=Optional[b], 6=Optional[t]}\n\
  ```\n\n这段代码的作用与上一个示例相同。这意味着识别收集器（collector）的名称很重要，因为你可能没有 `Collectors` 类名来引起你的注意。\n\
  \n### Teeing 收集器 (Teeing Collectors)\n\n假设你想返回两个东西。正如我们所学的，这在流（streams）中是有问题的，因为你只能遍历一次。当你需要这些操作时，汇总统计（summary\
  \ statistics）很好用。幸运的是，你可以使用 `teeing()` 来返回自己的多个值。\n\n首先，定义返回值。我们在这里使用了一个 record：\n\
  \n```java\nrecord Separations(String spaceSeparated, String commaSeparated) {}\n\
  ```\n\n现在我们编写流。在阅读时，请注意收集器的数量：\n\n```java\nvar list = List.of(\"x\", \"y\", \"z\"\
  );\n\nSeparations result = list.stream()\n    .collect(Collectors.teeing(\n    \
  \    Collectors.joining(\" \"),\n        Collectors.joining(\",\"),\n        (s,\
  \ c) -> new Separations(s, c)));\nSystem.out.println(result);\n```\n\n执行时，代码将打印以下内容：\n\
  \n`Separations[spaceSeparated=x y z, commaSeparated=x,y,z]`\n\n这段代码中有三个收集器。其中两个用于\
  \ `joining()` 并产生我们想要返回的值。第三是 `teeing()`，它将结果合并为我们想要返回的单个对象。这样一来，Java 很高兴，因为只返回了一个对象；而我们也很开心，因为我们不需要遍历两次流。\n\
  \n### 使用 分割器 (Spliterator)\n\n假设你买了一袋食物，这样两个孩子可以在宠物动物园喂动物。为了避免争吵，你准备了一个额外的空袋。你从主袋中取出大约一半的食物，放入你从家里带的袋子里。原始袋里仍然存在另一半食物。\n\
  \n`Spliterator` 为处理过程提供了这种程度的控制。它始于一个 `Collection` 或 `stream`——这就是你的那袋食物。你调用 `trySplit()`\
  \ 从袋中取出一些食物。剩下的食物留在原始的 `Spliterator` 对象中。\n\n`Spliterator` 的特性取决于底层数据源。`Collection`\
  \ 数据源是基础的 `Spliterator`。相比之下，当使用 `Stream` 数据源时，`Spliterator` 可以是并行甚至是无限的。`Stream`\
  \ 本身是延迟执行的，而不是在创建 `Spliterator` 时执行。\n\n实现你自己的 `Spliterator` 可能会变得复杂，幸运的是它不在考试范围内。你确实需要知道如何使用在该接口上声明的一些常用方法。你需要掌握的简化方法在表\
  \ 10.11 中。\n\n#### 表 10.11 Spliterator 方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `Spliterator<T>\
  \ trySplit()` | 返回一个包含理想情况下一半数据的 `Spliterator`，这些数据已从当前 `Spliterator` 中移除。该方法可以被多次调用，并在数据不再可拆时最终返回\
  \ `null`。 |\n| `void forEachRemaining(Consumer<T> c)` | 处理 `Spliterator` 中剩余的元素。\
  \ |\n| `boolean tryAdvance(Consumer<T> c)` | 如果 `Spliterator` 中还有剩余元素，则处理其中一个元素。返回元素是否被处理。\
  \ |\n\n现在让我们来看一个将袋子分成三部分的示例：\n\n```java\n12: var stream = List.of(\"bird-\", \"\
  bunny-\", \"cat-\", \"dog-\", \"fish-\", \"lamb-\",\n13:     \"mouse-\");\n14: Spliterator<String>\
  \ originalBagOfFood = stream.spliterator();\n15: Spliterator<String> emmasBag =\
  \ originalBagOfFood.trySplit();\n16: emmasBag.forEachRemaining(System.out::print);\
  \  // bird-bunny-cat-\n17:\n18: Spliterator<String> jillsBag = originalBagOfFood.trySplit();\n\
  19: jillsBag.tryAdvance(System.out::print);         // dog-\n20: jillsBag.forEachRemaining(System.out::print);\
  \  // fish-\n```\n\n\n\n\n你可以使用 `Collector` 将流（stream）转换为传统的集合（collection）。你甚至可以对字段分组以在一行代码中创建一个复杂的\
  \ map。分区（Partitioning）的工作与分组（grouping）相同，但键始终是 `true` 和 `false`。分区 map 始终有两个键，即使某个键的值为空。一个\
  \ `teeing` 收集器允许你组合另外两个收集器的结果。\n\n你应该记忆表 10.6 和表 10.7。至少，要能够识别出不兼容之处，例如类型差异。最后，记住流是惰性求求的。它们接受\
  \ lambda 表达式或方法引用作为参数，这些表达式在方法运行时稍后执行。\n\n## 考试要点\n\n**编写使用 `Optional` 的代码。**\n\
  创建 `Optional` 使用 `Optional.empty()` 或 `Optional.of()`。获取值频繁使用 `isPresent()` 和 `get()`。或者，还有函数式的\
  \ `ifPresent()` 和 `orElseGet()` 方法。\n\n**识别哪些操作会导致流流水线执行。**\n中间操作在遇到终端操作之前不会运行。如果流水线中没有终端操作，将返回一个\
  \ `Stream` 但不执行。终端操作的示例包括 `collect()`、`forEach()`、`min()` 和 `reduce()`。\n\n**确定哪些终端操作是归约（reductions）。**\n\
  归约使用流中的所有元素来确定结果。你需要掌握的归约有 `collect()`、`count()`、`max()`、`min()` 和 `reduce()`。可变归约在执行过程中收集到同一个对象中。`collect()`\
  \ 方法就是可变归约。\n\n**编写常用中间操作的代码。**\n`filter()` 方法返回一个根据 `Predicate<T>` 过滤的 `Stream<T>`。`map()`\
  \ 方法返回一个 `Stream`，通过 `Function<T,R>` 将类型为 `T` 的每个元素转换为类型 `R`。`flatMap()` 方法将嵌套流扁平化为单层并移除空流。\n\
  \n**比较原始类型流与 `Stream<T>`。**\n原始类型流用于对数值类型执行常用操作，包括如 `average()`、`sum()` 等统计数据。有三个原始类型流接口：`DoubleStream`、`IntStream`\
  \ 和 `LongStream`。还有三个原始 Optional 类：`OptionalDouble`、`OptionalInt` 和 `OptionalLong`。除了\
  \ `BooleanSupplier` 之外，它们都涉及 `double`、`int` 或 `long` 原始类型。\n\n**将原始类型流转换为转换为原始类型流类型。**\n\
  通常，在映射时，你只需调用 `map()` 方法。当更改用于流的接口时，需要不同的方法。转换为 `Stream` 使用 `mapToObj()`。转换为 `DoubleStream`，使用\
  \ `mapToDouble()`。转换为 `IntStream`，使用 `mapToInt()`。转换为 `LongStream`，使用 `mapToLong()`。\n\
  \n**使用 `peek()` 检查流。**\n`peek()` 方法是一种经常用于调试的中间操作。它在输入上执行 lambda 表达式或方法引用，并将相同的输入通过流水线传递给下一个操作符。它对于打印通过流中某个特定点的内容非常有用。\n\
  \n**搜索流。**\n`findFirst()` 和 `findAny()` 方法从流中返回单个元素的 `Optional` 包。`anyMatch()`、`allMatch()`\
  \ 和 `noneMatch()` 方法返回布尔值。要小心，因为这三个方法在带有数据的无限流上调用时可能会挂起。所有这些方法都是终端操作。\n\n**排序流。**\n\
  `sorted()` 方法是一种对流进行排序的中间操作。有两个版本：零参数的签名使用自然排序顺序进行排序，以及带有一个参数的签名使用该 `Comparator`\
  \ 作为排序顺序。\n\n**比较 `groupingBy()` 和 `partitioningBy()`**\n`groupingBy()` 方法用于创建 `Map`\
  \ 的终端操作。键和返回类型由你传递的参数决定。`Map` 中的值是所有映射到该键的条目的一个 `Collection`。`partitioningBy()`\
  \ 方法也返回一个 `Map`。这次，键是 `true` 和 `false`。值再次是项的 `Collection`。如果该布尔值没有匹配项，则 `Collection`\
  \ 为空。\n\n## 复习题\n\n章节复习题的答案可以在录中找到。\n\n1. 以下代码的输出可能是？\n```\nvar stream = Stream.iterate(\"\
