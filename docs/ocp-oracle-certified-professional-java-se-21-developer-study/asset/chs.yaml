  \ j…)\n```\n\n# 第 6 章\n\n## 类设计\n\n本章涵盖的 OCP 考试目标：\n\n- 在 Java 中使用面向对象概念\n    -\
  \ 创建类和记录（records），定义并使用实例和静态字段、方法、构造函数，以及实例和静态初始化器。\n    - 理解变量作用域，应用封装并创建不可变对象。使用局部变量类型推断。\n\
  \    - 实现继承，包括抽象类型、密封类型（sealed types）以及记录类。重写方法，包括 `Object` 类的方法。实现多态并区分对象类型和引用类型。执行引用类型强制转换，使用\
  \ `instanceof` 运算符识别对象类型，并结合 `instanceof` 运算符和 `switch` 结构进行模式匹配。\n\n在第 1 章“构建块”中，我们介绍了\
  \ Java 类的基本定义。在第 5 章“方法”中，我们深入研究了方法和修符，并展示了如何使用它们来构建更有结构化的类。在本章中，我们将更进一步，展示类结构和继承如何作为\
  \ Java 语言中最强大的特征之一。\n\n从核心上说，良好的 Java 类设计关于代码的可用性、功能的增强和标准化。例如，通过创建一个扩展现有类的新类，你可能会获得大量继承的原始类型、对象和方法，从而增加了代码的复用。\n\
  \n本章是 Java 中一些最重要主题的总结，包括继承、类设计、构造函数、初始化顺序、方法重写、抽象类和不可变对象。请仔细阅读本章，确保你充分理解了所有主题。本章是第\
  \ 7 章“超越类”的基础，在该章节中，我们将扩展对类型的讨论，包含其他顶层类型和嵌套类型。\n\n## 理解继承\n\n在 Java 中创建新类时，你可以将该类定义为继承自现有类。继承是子类自动包含父类中定义的某些成员（包括原始类型、对象或方法）的过程。\n\
  \n为了说明起，我们将任何继承自另一个类的类称为子类（subclass）或子类（child class），因为它被认为是该类的后代。相反，我们将子类继承的类称为超类（superclass）或父类（parent\
  \ class），因为它被认为是该类的祖先。\n\n![](img/image_rsrc10B8.jpg)\n\n在处理其他类型（如接口）时，我们倾向于使用子类型（subtype）和超类型（supertype）这些通用术语。你将在下一章中看到更多。\n\
  \n### 声明子类\n\n让我们从类及其子类的声明开始。图 6.1 展示了超类 `Mammal`（哺乳动物）和子类 `Rhinoceros`（犀牛）的示例。\n\
  \n![类及其子类声明的示例结构。变量为 public 或包访问、final 关键字、class 关键字、类名、extends 父类、超类和子类。](img/image_rsrc10CG.jpg)\n\
  \n图 6.1 子类和超类的声明\n\n我们通过使用 `extends` 关键字声明一个类是子类。除了确保它没有被标记为 `final` 之外，不需要在超类任何任何。稍后详细介绍。\n\
  \n继承的一个关键方面是它的传递性。假设有三个类 `[X, Y, Z]`，如果 `X` 继承 `Y`，`Y` 继承 `Z`，那么 `X` 被视为 `Z` 的子类或后代。同样，`Z`\
  \ 是 `X` 的超类或祖先。我们有时使用“直接子类”或“直接后代”来指示直接扩展父类的类。例如，`X` 是类 `Y` 的直接后代，而不是 `Z`。\n\n在上一章中，你学习了四种访问级别：`public`、`protected`、`package`\
  \ 和 `private`。当一个类继承自父类时，所有 `public` 和 `protected` 成员都会自动作为子类的一部分可用。如果两个类在同一个包中，那么\
  \ `package` 成员对子类可用。最后但同样重要的是，`private` 成员被限制在定义的类中，永远无法通过继承访问。这并不意味着父类不能拥有存储数据或修改对象的\
  \ `private` 成员；它只是子类无法直接访问它们。\n\n让我们来看一个简单的示例：\n\n```java\npublic class BigCat {\n\
  \    protected double size;\n}\n\npublic class Jaguar extends BigCat {\n    public\
  \ Jaguar() {\n        size = 10.2;\n    }\n    public void printDetails() {\n  \
  \      System.out.print(size);\n    }\n}\n\npublic class Spider {\n    public void\
  \ printDetails() {\n        System.out.println(size);  // 无法编译\n    }\n}\n```\n\n\
  `Jaguar` 是 `BigCat` 的子类，使得 `BigCat` 成为 `Jaguar` 的超类。在 `Jaguar` 类中，`size` 可用，因为它被标记为\
  \ `protected`。相比之下，`Spider` 类无法访问 `size`，因为它没有继承。\n\n### 类修饰符\n\n和方法和变量一样，类声明可以有各种修饰符。表\
  \ 6.1 列出了你应该掌握的修饰符。\n\n表 6.1 类修饰符\n\n| 修饰符 | 说明 | 章节 |\n| --- | --- | --- |\n| `final`\
  \ | 类不能被扩展。 | 第 6 章 |\n| `abstract` | 类是抽象的，可能包含抽象方法，需要具体的子类来实例化。 | 第 6 章 |\n| `sealed`\
  \ | 类仅允许特定的类扩展。 | 第 7 章 |\n| `non-sealed` | 密封类的子类允许未命子类。 | 第 7 章 |\n| `static`\
  \ | 用于类内部的静态类。 | 第 7 章 |\n\n我们将在本章之后讨论抽象类。在下一章，我们将讨论密封类和非密封类以及静态嵌套类。\n\n现在，让我们谈谈标记为\
  \ `final` 的类。`final` 修饰符阻止一个类被进一步扩展。例如，以下代码无法编译：\n\n```java\npublic class Mammal\
  \ {}\n\npublic final class Rhinoceros extends Mammal {}\n\npublic class Clara extends\
  \ Rhinoceros {} // 无法编译\n```\n\n在考试中，请注意任何标记为 `final` 的类。如果你看到另一个类扩展它，你就知道代码无法编译。\n\
  \n\n\n\n\n图 6.2 展示了各种类型的继承模型。左侧的项目被视为单继承，因为每个子类恰有一个父类。你可能会注意到，单继承并不排除父类拥有多个子类。右侧显示了具有多重继承的项目。如你所示，`Dog`\
  \ 对象具有多个父类标记。\n\n![各种继承模型的两种示例结构。左侧的项目是单继承。动物被细分为哺乳动物和鸟类，哺乳动物进一步细分为蝙蝠和老虎，鸟类进一步细分为鹦鹉和鹰。右侧的项目是多重继承。动物、宠物和友好组合在一起以描述狗，狗进一步细分为哈士奇和贵宾。所有箭头都指向上方。](img/image_rsrc10CH.jpg)\n\
  \n图 6.2 继承的类型\n\n多重继承之所以复杂的原因之一在于在发生冲突时确定要从哪个父类继承值。例如，如果你在所有父类中都定义了一个对象或方法，子类应该继承哪一个呢？在这个例子中，父类之间没有自然的顺序，这就是为什么\
  \ Java 通过完全禁止多重继承来避免这些问题。\n\n### 继承 Object\n\n在本书对 Java 的讨论中，我们多次使用了 `object` 这个词——这非常有道理。在\
  \ Java 中，所有类都继承自一个单一的类：`java.lang.Object`，或者简称为 `Object`。此外，`Object` 是唯一一个没有父类的类。\n\
  \n你可能会想：“我到为止写的类中没有类一个扩展了 `Object`，那么所有类是如何继承自它的呢？”答案是，编译器会自动向你编写的任何没有扩展特定类的类中插入代码。例如，以下两者是等价的：\n\
  \n```java\npublic class Zoo { }\n\npublic class Zoo extends java.lang.Object { }\n\
  ```\n\n关键在于，当 Java 看到你定义一个没有扩展另一个类的类时，编译器会自动在类定义中添加 `extends java.lang.Object` 语法。结果是每个类都获得了访问\
  \ `Object` 类中任何可用方法的权限。例如，`toString()` 和 `equals()` 方法在 `Object` 中是可用的；因此它们在所有类中都是可访问的。不过，如果不在子类中进行重写，它们可能并没有特别有用。我们将在本章后面的部分介绍重写方法。\n\
  \n另一方面，当你定义一个扩展现有类的类类时，Java 不会自动扩展 `Object` 类。由于所有类都继承自 `Object`，扩展现有类意味着子类根据定义已经继承了\
  \ `Object`。如果你查看任何类的继承结构，它始终会以树顶部的 `Object` 结束，如图图 6.3 所示。\n\n![java 对象继承的流程。结构从底部开始，变量\
  \ ox 到 mammal，然后通过几次循环到 object。程序是所有对象都继承 java.lang.Object。](img/image_rsrc10CJ.jpg)\n\
  \n图 6.3 Java 对象继承\n\n如 `int` 和 `boolean` 等原始类型不继承自 `Object`，因为它们不是类。正如你在第 5 章中所学习到的，通过自动装箱，它们可以作为关联包装类的实例被赋值或传递，而包装类确实继承自\
  \ `Object`。\n\n### 创建类\n\n现在我们已经确定了 Java 中继承是如何工作的，我们就可以使用它来定义和创建复杂的类关系。在本节中，我们将回顾创建和操作类的基础知识。\n\
  \n### 扩展类\n\n让我们在同一个包中创建两个文件，`Animal.java` 和 `Lion.java`。\n\n```java\n// Animal.java\n\
  public class Animal {\n    private int age;\n    protected String name;\n    public\
  \ int getAge() {\n        return age;\n    }\n    public void setAge(int newAge)\
  \ {\n        age = newAge;\n    }\n}\n\n// Lion.java\npublic class Lion extends\
  \ Animal {\n    protected void setProperties(int age, String n) {\n        setAge(age);\n\
  \        name = n;\n    }\n    public void roar() {\n        System.out.print(name\
  \ + \", age \" + getAge() + \", says: Roar!\");\n    }\n    public static void main(String[]\
  \ args) {\n        var lion = new Lion();\n        lion.setProperties(3, \"kion\"\
  );\n        lion.roar();\n    }\n}\n```\n\n我们知道，这里有很多操作！`age` 变量存在于父类 `Animal` 中，在\
  \ `Lion` 子类中无法直接访问。它是通过 `setAge()` 方法间接访问的。`name` 变量是 `protected` 的，所以它在 `Lion`\
  \ 类中被继承并可以直接访问。我们在 `main()` 方法中创建 `Lion` 实例并使用 `setProperties()` 设置实例变量。最后，我们调用\
  \ `roar()` 方法，它打印出：\n\n`kion, age 3, says: Roar!`\n\n### 应用类修饰符\n\n就像变量和方法一样，你可以对类应用访问修饰符。正如你可能从第\
  \ 1 章中记得的，顶层类是不在另一个类内部的类。虽然一个 `.java` 文件最多有一个公共（public）类，但你可以拥有任意数量的具有包访问（package\
  \ access）权限的类（顺序任意）。事实上，你甚至不需要声明公共类！以下声明了三个具有包访问权限的类：\n\n```java\n// Bear.java\n\
  class Bird {}\nclass Bear {}\nclass Fish {}\n```\n\n但是，尝试使用 `protected` 或 `private`\
  \ 声明顶层类会导致编译错误：\n\n```java\n// ClownFish.java\nprotected class ClownFish {} // 无法编译\n\
  \n// BlueTang.java\nprivate class BlueTang {} // 无法编译\n```\n\n### 访问 this 引用\n\n\
  当方法参数与实例变量同名时会发生什么？让我们来看一个例子。你认为以下程序会打印什么？\n\n```java\npublic class Flamingo {\n\
  \    private String color = null;\n    public void setColor(String color) {\n  \
  \      color = color;\n    }\n    public static void main(String[] unused) {\n \
  \       var f = new Flamingo();\n        f.setColor(\"PINK\");\n        System.out.print(f.color);\n\
  \    }\n}\n```\n\n如果你说是 `null`，那么你是正确的。Java 使用最细粒度的范围，所以当它看到 `color = color` 时，它认为你正在将方法参数的值赋值给它（而不是实例变量）。赋值在方法内部成功完成，但实例变量\
  \ `color` 的值从未被修改，在 `main()` 方法中打印时为 `null`。\n\n当局部变量与实例变量同名时，修复方法是使用 `this` 引用或关键字。`this`\
  \ 引用指向类的当前实例，并用于访问类的任何成员，包括继承的成员。我们将此应用到我们之前的方法实现中：\n\n```java\npublic void setColor(String\
  \ color) {\n```\n\n\n\n\n\n```java\nthis.color = color;  // 用方法参数为实例变量赋值\n\n}\n\
  ```\n\n修正后的代码现在会如预期般打印 PINK。在很多情况下，`this` 引用是可选的。如果 Java 遇到无法找到的变量或方法，它将检查类层次结构以查看其是否可用。\n\
  \n现在让我们来看一些不常见但在考试中你可能会看到的的例子：\n\n```java\n1: public class Duck {\n2:     private\
  \ String color;\n3:     private int height;\n4:     private int length;\n5:\n6:\
  \     public void setData(int length, int theHeight) {\n7:         length = this.length;\
  \  // 反向了——不妙！\n8:         height = theHeight;    // 很好，因为名字不同\n9:         this.color\
  \ = \"white\";  // 很好，但 this 引用并非必要\n10:     }\n11:\n12:     public static void\
  \ main(String[] args) {\n13:         Duck b = new Duck();\n14:         b.setData(1,2);\n\
  15:         System.out.print(b.length + \" \" + b.height + \" \" + b.color);\n16:\
  \     } }\n```\n\n这段代码可以编译并打印以下内容：\n\n0 2 white\n\n不过，这可能不是你预期的。第 7 行是错误的，你在考试中应该注意。实例变量\
  \ `length` 的初始值为 0。这个 0 被赋值给了方法参数 `length`。实例变量保持为 0。第 8 行更直观。参数 `theHeight` 和实例变量\
  \ `height` 名字不同。由于没有命名冲突，因此不需要 `this`。最后，第 9 行显示，即使变量名没有重复，变量赋值也允许使用 `this` 引用。\n\
  \n### 调用 super 引用\n\n在 Java 中，变量或方法可以同时在父类和子类中定义。这意味着对象实例实际上持有了两个具有相同底层名称的相同变量副本。当这种情况发生时，我们如何引用父类中的版本而不是当前类的版本呢？让我们来看这个例子：\n\
  \n`// Reptile.java`\n\n```java\n1: public class Reptile {\n2:     protected int\
  \ speed = 10;\n3: }\n```\n\n`// Crocodile.java`\n\n```java\n1: public class Crocodile\
  \ extends Reptile {\n2:     protected int speed = 20;\n3:     public int getSpeed()\
  \ {\n4:         return speed;\n5:     }\n6:     public static void main(String[]\
  \ data) {\n7:         var croc = new Crocodile();\n8:         System.out.println(croc.getSpeed());\
  \  // 20\n9:     } }\n```\n\n关于这段代码需要记住的重要点之一是 `Crocodile` 的实例为 `speed` 存储了两个独立的值：一个在\
  \ `Reptile` 级别，另一个在 `Crocodile` 级别。在第 4 行，Java 首先检查是否存在名为 `speed` 的局部变量或方法参数。由于不存在，它接着检查\
  \ `this.speed;;`，并且由于它存在，程序打印了 20。\n\n![](img/image_rsrc10B8.jpg)\n\n声明一个与继承变量同名的变量被称为“隐藏变量”（hiding\
  \ a variable），将在本章的稍后部分讨论。\n\n但如果我们想要程序打印 `Reptile` 类中的值呢？在 `Crocodile` 类中，我们可以通过使用\
  \ `super` 引用或关键字来访问 `speed` 的父类值。`super` 引用类似于 `this` 引用，但排除了在当前类中找到任何成员。换句话说，该成员必须可以通过继承来访问。\n\
  \n```java\n3:     public int getSpeed() {\n4:         return super.speed;  // 使程序现在打印\
  \ 10\n5:     }\n```\n\n让我们看看你是否掌握了 `this` 和 `super`。以下程序的输出输出什么？\n\n```java\n1:\
  \ class Insect {\n2:     protected int numberOfLegs = 4;\n3:     String label =\
  \ \"buggy\";\n4: }\n5:\n6: public class Beetle extends Insect {\n7:     protected\
  \ int numberOfLegs = 6;\n8:     short age = 3;\n9:     public void printData() {\n\
  10:        System.out.println(this.label);\n11:        System.out.println(super.label);\n\
  12:        System.out.println(this.age);\n13:        System.out.println(super.age);\n\
  14:        System.out.println(this.numberOfLegs);\n15:        System.out.println(super.numberOfLegs);\n\
  16:    }\n17:    public static void main(String[] n) {\n18:        new Beetle();\n\
  19:    }\n```\n\n呼，好多内容啊！使用 `this` 和 `super` 可能需要时间适应。\n\n### 声明构造函数\n\n正如你在前面的节中学到的，构造函数是一个特殊方法，它与类名匹配且没有返回类型。它在创建实例时被调用。在本节中，我们将展示如何编写构造函数。\n\
  \n### 创建构造函数\n\n从一个简单的构造函数开始：\n\n```java\npublic class Bunny {\n    public Bunny()\
  \ {\n        System.out.print(\"hop\");\n    }\n}\n```\n\n构造函数的名称 `Bunny` 与类名 `Bunny`\
  \ 匹配，且没有返回类型（即使是 `void`）。这使得这是一个构造函数。你能看出为什么这两个对于 `Bunny` 类不是有效的构造函数吗？\n\n```java\n\
  public class Bunny {\n    public bunny() {} // 错误\n    public void Bunny() {}\n\
  }\n```\n\n第一个没有匹配类名，因为 Java 是区分大小写的。由于不匹配，Java 知道它不是构造函数，而应该是普通方法。然而，它缺少返回类型且无法编译。第二个方法是一个很好的方法，但不是构造函数，因为它有返回类型。\n\
  \n像参数一样，构造函数参数可以是任何有效的类、数组或原始类型，包括泛型，但不能包含 `var`。例如，以下代码无法编译：\n\n```java\npublic\
  \ class Bonobo {\n    public Bonobo(var food) {\n    }\n}\n```\n\n类可以有多个构造函数，只要每个构造函数都有唯一的构造函数签名。在这种情况下，这意味着构造函数参数必须不同。就像同名但签名不同的方法一样，声明不同签名的构造函数被称为“构造函数重载”（constructor\
  \ overloading）。下面的 `Turtle` 类有四个不同的重载构造函数：\n\n```java\npublic class Turtle {\n \
  \   private String name;\n    public Turtle() {\n        name = \"John Doe\";\n\
  \    }\n    public Turtle(int age) {}\n    public Turtle(long age) {}\n    public\
  \ Turtle(String newName, String… favoriteFoods) {\n        name = newName;\n   \
  \ }\n}\n```\n\n构造函数用于创建新对象。这个过程被称为“实例化”（instantiation），因为创建了类的类的实例。当我们写下 `new` 后面跟着想要实例化的类名时，构造函数会被调用。这是一个例子：\n\
  \n```java\nnew Turtle(15)\n```\n\n\n\n\n\n当 Java 看到 `new` 关键字时，它会为新对象分配内存。然后它会寻找一个签名相匹配的构造函数并调用它。\n\
  \n### 默认构造函数\n\nJava 中的每个类都有一个构造函数，无论你是否编写了它。如果你没有在类中包含任何构造函数，Java 将自动为你创建一个不带参数的构造函数。这个由\
  \ Java 创建的构造函数被称为默认构造函数，每当声明类时没有任何构造函数，它就会被添加。为了清晰起见，我们通常将其称为默认无参构造函数。这里有一个示例：\n\
  \n```java\npublic class Rabbit {\n    public static void main(String[] args) {\n\
  \        new Rabbit();      // 调用默认构造函数\n    }\n}\n```\n\n在 `Rabbit` 类中，Java 看到没有编写构造函数，于是创建了一个。之前的类等同于以下代码，在代码中提供了默认构造函数，因此编译器不会再插入它：\n\
  \n```java\npublic class Rabbit {\n    public Rabbit() {}\n    public static void\
  \ main(String[] args) {\n        new Rabbit();      // 调用用户定义的构造函数\n    }\n}\n```\n\
  \n默认构造函数有一个空的参数列表和空的方法体。你自己输入这些代码没有问题。但是，由于它没有执行任何操作，Java 乐意为你生成它并节省一些打字时间。\n\n\
  我们一直说“生成”。这发生在编译步骤。如果你查看扩展名为 `.java` 的文件，构造函数仍然是不存在的。它只会在扩展名为 `.class` 的编译后的文件中出现。\n\
  \n对于考试来说，你需要知道的最重要规则之一是：编译器只有在没有定义任何构造函数时才会插入默认构造函数。你认为这些类中哪些拥有默认构造函数？\n\n```java\n\
  public class Rabbit1 {}\n\npublic class Rabbit2 {\n    public Rabbit2() {}\n}\n\n\
  public class Rabbit3 {\n    public Rabbit3(boolean b) {}\n}\n\npublic class Rabbit4\
  \ {\n    private Rabbit4() {}\n}\n```\n\n只有 `Rabbit1` 获得了默认无参构造函数。因为它没有编写构造函数，所以\
  \ Java 生成了默认无参构造函数。`Rabbit2` 和 `Rabbit3` 都已经有了公有构造函数。`Rabbit4` 拥有一个私有构造函数。由于这三个类都定义了构造函数，因此不会为你插入默认无参构造函数。\n\
  \n让我们快速看看如何调用这些构造函数：\n\n1: `public class RabbitsMultiply {`\n2: `public static void\
  \ main(String[] args) {`\n3: `var r1 = new Rabbit1();`\n4: `var r2 = new Rabbit2();`\n\
  5: `var r3 = new Rabbit3(true);`\n6: `var r4 = new Rabbit4();  // 无法编译`\n7: `}`\n\
  \n第 3 行调用生成的无参构造函数。第 4 和 5 行调用用户提供的构造函数。第 6 行无法编译。`Rabbit4` 将构造函数设为私有，因此其他类无法调用它。类中仅有私有构造函数告诉编译器不要提供默认无参构造函数。它还防止其他类实例化该类。这当一个类只有静态方法或开发者想要完全控制所有创建类实例的调用时非常有用。\n\
  \n### 使用 `this()` 调用重载构造函数\n\n掌握创建和引用构造函数的基础知识了吗？很好，因为接下来将变得复杂一点。由于一个类可以包含多个构造函数，这些构造函数实际上可以调用另一个。让我们从一个包含两个构造函数的简单类开始：\n\
  \n```java\npublic class Hamster {\n    private String color;\n    private int weight;\n\
  \    public Hamster(int weight, String color) { // 第一个构造函数\n        this.weight\
  \ = weight;\n        this.color = color;\n    }\n    public Hamster(int weight)\
  \ { // 第二构造函数\n        this.weight = weight;\n        color = \"brown\";\n    }\n\
  }\n```\n\n其中一个构造函数接受单个 `int` 参数。另一个接受 `int` 和 `String`。由于这些参数列表不同，因此构造函数成功地重载了。这里有一些重复，因为\
  \ `this.weight` 在两个构造函数中是以相同的方式赋值的。在编程中，即使是一点重复，随着我们不断添加“仅仅一个东西”，往往会变成大量的重复。例如，想象我们有五个像\
  \ `this.weight` 这样的变量要设置，而不是只有一个。我们真正想要让第一个构造函数调用带参数的第二个构造函数。那么，如何让一个构造函数调用另一个呢？你可能会想将第一个构造函数重写为：\n\
  \n```java\npublic Hamster(int weight) { // 第二构造函数\n    Hamster(weight, \"brown\"\
  ); // 无法编译\n}\n```\n\n这是行不通的。构造函数只能通过在名称前写 `new` 来调用。它们不像你可以调用的普通方法。如果我们在构造函数名称之前加上\
  \ `new` 会发生什么？\n\n```java\npublic Hamster(int weight) { // 第二构造函数\n    new Hamster(weight,\
  \ \"brown\"); // 可以编译，但创建了额外的对象\n}\n```\n\n这种尝试可以编译。但它并没有实现我们的目标。当这个构造函数被调用时，它会创建一个具有默认重量和颜色的新对象。然后它又创建一个具有所需重量和颜色的不同对象。通过这种方式，我们得到了两个对象，其中一个在创建后就被丢弃了。这并不是我们想要的。我们想要在最初尝试实例化的对象上设置重量和颜色。\n\
  \nJava 提供了一个解决方案：`this()`——是的，就是我们用于引用成员的同一个关键字，但加上了括号。当 `this()` 带有括号时，它调用类中的另一个构造函数。\n\
  \n```java\npublic Hamster(int weight) { // 第二构造函数\n    this(weight, \"brown\");\n\
  }\n```\n\n成功！现在 Java 调用了带有两个参数的构造函数，重量和颜色如预期般设置。\n\n### `this` 与 `this()`\n\n尽管使用了相同的关键字，`this`\
  \ 和 `this()` 也大不同。前者 `this` 指类的实例，而后者 `this()` 指类内的构造函数调用。考试可能会通过混合使用它们来误你，确保你知道该用哪一个以及为什么。\n\
  \n调用 `this()` 有一个你需要知道的特殊规则。如果你选择它，`this()` 调用必须是构造函数中的第一个语句。它的副作用是任何构造函数中只能有一次\
  \ `this()` 调用。\n\n3: `public Hamster(int weight) {`\n4: `System.out.println(\"chew\"\
  );`\n5: `// 设置重量和默认颜色`\n6: `this(weight, \"brown\"); // 无法编译`\n7: `}`\n\n即使第 4 行的打印语句没有改变任何变量，它仍然是一个\
  \ Java 语句，不允许插入到 `this()` 调用之前。第 5 行的注释就没问题。注释可以出现在任何地方。\n\n对于重载构造函数，还有一个你应该注意的最后一个规则。考虑以下\
  \ `Gopher` 类的定义：\n\n```java\npublic class Gopher {\n    public Gopher(int dugHoles)\
  \ {\n        this(5); // 无法编译\n    }\n}\n```\n\n编译器能够检测到此构造函数正在无限调用自己。这通常被称为循环，与我们在第三章“决策”中讨论的无限循环相似。由于代码永远不会终止，编译器会停止并报告此错误。同样，这段代码无法编译。\n\
  \n```java\npublic class Gopher {\n    public Gopher() {\n        this(5); // 无法编译\n\
  \    }\n    public Gopher(int dugHoles) {\n        this(); // 无法编译\n    }\n}\n```\n\
  \n在这里我们总结了在本节中涵盖的关于构造函数的你应该的规则。好好学习它们！\n\n\n\n\n\n*   类可以包含多个重载构造函数，只要每个构造函数的签名是独特的。\n\
  *   如果没有声明任何构造函数，编译器会插入一个默认的无参数构造函数。\n*   如果构造函数调用了 `this()`，那么它必须是构造函数的第一行。\n*\
  \   Java 不允许循环调用构造函数。\n\n### 使用 `super()` 调用父类构造函数\n\n恭喜你，你在成为构造函数专家的道路上又进了一！不过对于调用父类中的构造函数，我们还需要涵盖一套规则。毕竟，父类的实例成员是如何初始化的？\n\
  \n每个构造函数的第一个语句都是使用 `super()` 调用父类构造函数，或者使用 `this()` 调用该类中的另一个构造函数。请多读一遍这句话，确保记住它。这非常重要！\n\
  \n![](img/image_rsrc10B8.jpg)\n\n为了本节简单起见，我们经常用 `super()` 和 `this()` 来指代任何父类或重载构造函数的调用，即使是带参数的调用。\n\
  \n让我们来看 `Animal` 类及其子类 `Zebra`，看看它们的构造函数是如何正确编写以相互调用的：\n\n```java\npublic class\
  \ Animal {\n   private int age;\n   public Animal(int age) {\n      super();   \
  \   // 指向 java.lang.Object 中的构造函数\n      this.age = age;\n   }\n}\n\npublic class\
  \ Zebra extends Animal {\n   public Zebra(int age) {\n      super(age);  // 指向 Animal\
  \ 中的构造函数\n   }\n   public Zebra() {\n      this(4);      // 指向带有 int 参数的 Zebra 构造函数\n\
  \   }\n}\n```\n\n在 `Animal` 类中，构造函数的第一个语句是调用 `java.lang.Object` 中定义的父类构造函数，它不接受参数。在第二个类\
  \ `Zebra` 中，第一个构造函数的第一个语句是调用 `Animal` 的构造函数，它接受一个参数。`Zebra` 类还包含第二个无参数构造函数，它没有调用\
  \ `super()`，而是使用 `this(4)` 调用 `Zebra` 类中的另一个构造函数。\n\n### `super` 与 `super()`\n\n\
  在 Java 中，`super` 和 `super()` 与 `this()` 一样是不相关的。前者 `super` 用于引用父类的成员，而后者 `super()`\
  \ 则调用父类构造函数。在考试中任何时候看到关键字 `super`，请确保它的用法是正确的。\n\n与调用 `this()` 类似，调用 `super()` 只能作为构造函数的第一个语句。例如，以下两个类定义将无法编译：\n\
  \n```java\npublic class Zoo {\n   public Zoo() {\n      System.out.println(\"Zoo\
  \ created\");\n      super();      // 无法编译\n   }\n}\n\npublic class Zoo {\n   public\
  \ Zoo() {\n      super();\n      System.out.println(\"Zoo created\");\n      super();\
  \      // 无法编译\n   }\n}\n```\n\n第一个类无法编译，因为对父类构造函数的调用必须是构造函数的第一个语句。在第二个代码段中，`super()`\
  \ 是构造函数的第一个语句，但它也被用作第三语句。由于 `super()` 只能作为第一个语句调用一次，代码将无法编译。\n\n如果父类有多个构造函数，子类可以在其定义中使用任何有效且可访问的父类构造函数，如下例所示：\n\
  \n```java\npublic class Animal {\n   private int age;\n   private String name;\n\
  \   public Animal(int age, String name) {\n      super();\n      this.age = age;\n\
  \      this.name = name;\n   }\n   public Animal(int age) {\n      super();\n  \
  \    this.age = age;\n      this.name = null;\n   }\n}\n\npublic class Gorilla extends\
  \ Animal {\n   public Gorilla(int age) {\n      super(age, \"Gorilla\");  // 调用第一个\
  \ Animal 构造函数\n   }\n   public Gorilla() {\n      super(5);               // 调用第二个\
  \ Animal 构造函数\n   }\n}\n```\n\n在这个示例中，第一个子类构造函数调用第一个 `Animal` 构造函数。第二个子类构造函数调用第二个\
  \ `Animal` 构造函数。\n\n### 理解编译器\n\n我们我们说每个构造函数的第一行都是调用父类构造函数，但如果我们不写会怎样？如果你不写，编译器会为你插入一个\
  \ `super()` 调用。但如果你写了 `this()`，编译器就不会插入 `super()`。\n\n例如，以下代码将无法编译：\n\n```java\n\
  public class Zoo {\n   public Zoo() {\n      System.out.println(\"Zoo created\"\
  );\n      super();      // 无法编译\n   }\n}\n```\n\n第一个类无法编译，因为 `super()` 必须是第一个语句。在第二个片段中：\n\
  \n```java\npublic class Zoo {\n   public Zoo() {\n      super();\n      System.out.println(\"\
  Zoo created\");\n      super();      // 无法编译\n   }\n}\n```\n\n第二个代码将无法编译，因为 `super()`\
  \ 只能被调用一次。\n\n### 构造函数技巧与技巧\n\n如果父类没有无参数构造函数怎么办？编译器将无法为你插入 `super()`。\n\n```java\n\
  public class Mammal {\n   public Mammal(int age) {}\n}\n\npublic class Seal extends\
  \ Mammal {\n   public Seal() { // 无法编译\n}\n```\n\n要修复这个问题，你必须显式地调用可用的父类构造函数：\n\n\
  ```java\npublic class Seal extends Mammal {\n   public Seal() {\n      super(10);\n\
  \   }\n}\n```\n\n如果父类有多个构造函数怎么办？\n\n```java\npublic class Mammal {\n   public Mammal(int\
  \ age) {}\n   public Mammal(int age, String name) {}\n}\n\npublic class Seal extends\
  \ Mammal {\n   public Seal() {\n      super(10); // 有效\n   }\n}\n```\n\n### `super()`\
  \ 始终指向最直接的父类\n\n一个类可以通过继承拥有多个祖先。在我们之前的示例中，`AfricanElephant` 是 `Elephant` 的子类，而 `Elephant`\
  \ 又是 `Mammal` 的子类。但对于构造函数来说，`super()` 始终指向最直接的父类。在这个示例中，在 `AfricanElephant` 类内部调用\
  \ `super()` 始终指向 `Elephant` 类，而永远不会指向 `Mammal` 类。\n\n\n\n\n\n- 如果构造函数调用了 `super()`\
  \ 或 `this()`，那么它必须是构造函数的第一行。\n- 如果构造函数不包含 `this()` 或 `super()` 引用，编译器会自动将不带参数的 `super()`\
  \ 作为构造函数的第一行。\n\n恭喜你，你已经学习了关于声明构造函数的所有能教你的内容。接下来，我们将转向初始化并讨论如何使用构造函数。\n\n## 初始化对象\n\
  \n在第 1 章中，我们涵盖了初始化顺序，尽管方式非常简单。初始化顺序指的是类成员被赋值的方式。它们可以被赋予默认值（例如 `int` 默默为 `0`），或者需要显式赋值，例如\
  \ `final` 变量。在本节中，我们将更详细地讨论初始化顺序是如何运作的，以及如何在考试中发现错误。\n\n### 初始化类\n\n我们从类的初始化开始讨论初始化顺序。首先，我们初始化类，这涉及到调用类层次结构中的所有静态成员，从最高级的父类开始向下进行。这有时被称为加载类。Java\
  \ 虚拟机 (`JVM`) 控制类初始化的时机，尽管你可以假设类在在使用之前已经加载了。类可能在程序启动时初始化、当类的静态成员被引用时初始化，或者在类实例创建之前的不久初始化。\n\
  \n类初始化最重要的规则之一是每个类最多初始化一次。如果类在程序中没有未使用，它可能永远不会被加载。我们将类的初始化顺序总结如下：\n\n### 初始化类 X\n\
  \n1. 初始化 `X` 的父类。\n2. 按照静态变量在类中出现的顺序处理所有的声明。\n3. 按照静态初始化器在类中出现的顺序处理所有的静态初始化块。\n\n\
  看这个例子，以下程序会打印什么？\n\n```java\npublic class Animal {\n    static { System.out.print(\"\
  A\"); }\n}\n\npublic class Hippo extends Animal {\n    public static void main(String[]\
  \ grass) {\n        System.out.print(\"C\");\n        new Hippo();\n        new\
  \ Hippo();\n        new Hippo();\n    }\n    static { System.out.print(\"B\"); }\n\
  }\n```\n\n它恰好打印 ABC。由于 `main()` 方法在 `Hippo` 类内部，该类将首先初始化，从父类开始并打印 AB。之后，执行 `main()`\
  \ 方法，打印 C。尽管 `main()` 方法创建了三个实例，但类只加载了一次。\n\n### 为什么 Hippo 程序在 AB 之后打印 C\n\n在之前的示例中，`Hippo`\
  \ 类在 `main()` 方法执行之前就已经初始化了。这是因为我们的 `main()` 方法位于执行的类内部，所以它必须在启动时加载。如果你在另一个程序中调用\
  \ `Hippo` 会怎样？\n\n```java\npublic class HippoFriend {\n    public static void main(String[]\
  \ grass) {\n        System.out.print(\"C\");\n        new Hippo();\n    }\n}\n```\n\
  \n假设该类没有在其他地方引用，此程序可能会打印 CAB，直到在 `main()` 方法内部需要时 `Hippo` 类才被加载。我们说“可能”是因为类加载时机的规则是由\
  \ `JVM` 在运行时决定的。对于考试，你需要知道类在被引用或使用之前必须初始化。此外，包含程序入口点（即 `main()` 方法）的类会在 `main()`\
  \ 方法执行之前被加载。\n\n### 初始化 final 字段\n\n在我们深入研究实例成员的初始化顺序之前，我们需要简要讨论 `final` 字段（实例变量）。当我们于第\
  \ 1 章中介绍实例和类变量时，我们告诉过如果没有指定值，它们将根据类型被赋予默认值。例如，`double` 初始化为 `0.0`，而对象引用初始化为 `null`。不过，默认值仅适用于非\
  \ `final` 字段。\n\n正如你在第 5 章所示，`final static` 变量必须显式赋值且一次。标记为 `final` 的字段遵循类似的规则。它们可以在声明行中赋值，也可以在实例初始化器中赋值。\n\
  \n```java\npublic class MouseHouse {\n    private final int volume;\n    private\
  \ final String name = \"The Mouse House\";  // 赋值\n    {\n        volume = 10; \
  \ // 实例初始化器赋值\n    }\n}\n```\n\n与静态类成员不同，`final` 实例字段也可以构造函数中设置。构造函数是初始化过程的一部分，因此允许分配\
  \ `final` 实例变量。对于考试，你需要记住一个规则：当构造函数完成时，所有 `final` 实例变量必须被赋值一次。\n\n让我们在一个例子中尝试一下：\n\
  \n```java\npublic class MouseHouse {\n    private final int volume;\n    private\
  \ final String name;\n    public MouseHouse() {\n        this.name = \"Empty House\"\
  ;\n    }\n}\n```\n\n```java\npublic class MouseHouse {\n    private final int volume;\n\
  \    private final String name;\n    public MouseHouse() {\n        this.name =\
  \ \"Empty House\";  // 构造函数赋值\n    }\n    {\n        volume = 10;  // 实例初始化器赋值\n\
  \    }\n}\n```\n\n（注：原文文本中存在大量重复的逻辑块，此处已根据要求进行了去重和格式化。）\n\n\n\n\n首先，从使用 `new` 关键字的低级构造函数开始。记住，每个构造函数的第一行都是对\
  \ `this()` 或 `super()` 的调用，如果省略，编译器会自动插入对父类无参数构造函数 `super()` 的调用。然后，向上移动并注意构造函数的顺序。最后，从父类开始初始化每个类，按照每个类被实例化的反向顺序，处理每个类中的实例初始化器和构造函数。我们将一个实例的初始化顺序总结如下：\n\
  \n### 初始化 X 的实例\n\n1. 如果类 `X` 尚未被初始化，则初始化类 `X`。\n2. 初始化 `X` 的父类实例。\n3. 按照实例变量在类中出现的顺序处理所有实例变量声明。\n\
  4. 按照实例初始化器在类中出现的顺序处理所有初始化器。\n5. 初始化构造函数，包括任何通过 `this()` 引用的重载构造函数。\n\n让我们尝试一个没有继承的示例。看看你能否猜出以下程序的输出：\n\
  \n```java\npublic class ZooTickets {\n    private String name = \"BestZoo\";\n \
  \   { System.out.print(name + \"-\"); }\n    private static int COUNT = 0;\n   \
  \ static { System.out.print(COUNT + \"-\"); }\n    static { COUNT += 10; System.out.print(COUNT\
  \ + \"-\"); }\n\n    public ZooTickets() {\n        System.out.print(\"z-\");\n\
  \    }\n\n    public static void main(String... patrons) {\n        new ZooTickets();\n\
  \    }\n}\n```\n\n输出如下：\n`0-10-BestZoo-z-`\n\n首先，我们必须初始化该类。由于没有声明父类，这意味着父类是 `Object`，我们可以从\
  \ `ZooTickets` 的静态组件开始。在这种情况下，第 4、5 和 6 行被执行，打印 `0-` 和 `10-`。接下来，我们初始化第 13 行创建的实例。同样，由于没有声明父类，我们从实例组件开始。执行第\
  \ 2 和 3 行，打印 `BestZoo-`。最后，运行第 8–10 行的构造函数，输出 `z-`。\n\n接下来，让我们尝试一个带有继承的简单示例：\n\n\
  ```java\nclass Primate {\n    public Primate() {\n        System.out.print(\"Primate-\"\
  );\n    }\n}\n\nclass Ape extends Primate {\n    public Ape(int fur) {\n       \
  \ System.out.print(\"Ape1-\");\n    }\n    public Ape() {\n        System.out.print(\"\
  Ape2-\");\n    }\n}\n\npublic class Chimpanzee extends Ape {\n    public Chimpanzee()\
  \ {\n        super(2);\n        System.out.print(\"Chimpanzee-\");\n    }\n    public\
  \ static void main(String[] args) {\n        new Chimpanzee();\n    }\n}\n```\n\n\
  编译器将 `super()` 命令作为 `Primate` 和 `Ape` 构造函数的第一条语句插入。代码执行时会先调用父类构造函数，并产生以下输出：\n`Primate-Ape1-Chimpanzee-`\n\
  \n注意，两个 `Ape()` 构造函数中只有一个被调用。你需要从调用 `new Chimpanzee()` 开始，以确定哪些构造函数将被执行。记住，构造函数是从底向上执行的，但由于每个构造函数的第一行都是对另一个构造函数的调用，最终导致是父类构造函数在子类构造函数之前执行。\n\
  \n下一个例子稍微复杂一点。你认为这里会发生什么？\n\n```java\npublic class Cuttlefish {\n    private String\
  \ name = \"swimmy\";\n    { System.out.println(name); }\n    private static int\
  \ COUNT = 0;\n    static { System.out.println(COUNT); }\n    { COUNT++; System.out.println(COUNT);\
  \ }\n\n    public Cuttlefish() {\n        System.out.println(\"Constructor\");\n\
  \    }\n\n    public static void main(String[] args) {\n        System.out.println(\"\
  Ready\");\n        new Cuttlefish();\n    }\n}\n```\n\n输出看起来是：\n`0`\n`Ready`\n`swimmy`\n\
  `1`\n`Constructor`\n\n没有声明父类，因此我们可以跳过任何与继承相关的步骤。我们首先处理静态变量和静态初始化器——第 4 和 5 行，第 5\
  \ 行打印 `0`。现在静态初始化器完成了，`main()` 方法可以运行，打印 `Ready`。接下来我们在第 14 行创建一个实例。处理第 2、3 和 6\
  \ 行，第 3 行打印 `swimmy`，第 6 行打印 `1`。最后，运行第 8–10 行的构造函数，打印 `Constructor`。\n\n准备好面对一个更难的、你可能在考试中看到的例子了吗？以下输出是什么？\n\
  \n```java\nclass GiraffeFamily {\n    static { System.out.print(\"A\"); }\n    {\
  \ System.out.print(\"B\"); }\n    public GiraffeFamily(String name) {\n        this(1);\n\
  \        System.out.print(\"C\");\n    }\n    public GiraffeFamily() {\n       \
  \ System.out.print(\"D\");\n    }\n    public GiraffeFamily(int stripes) {\n   \
  \     System.out.print(\"E\");\n    }\n}\n\nclass Okapi extends GiraffeFamily {\n\
  \    static { System.out.print(\"F\"); }\n    public Okapi(int stripes) {\n    \
  \    super(\"sugar\");\n        System.out.print(\"G\");\n    }\n    { System.out.print(\"\
  H\"); }\n    public static void main(String[] args) {\n        new Okapi(1);\n \
  \       new Okapi(2);\n        System.out.println();\n    }\n}\n```\n\n程序输出如下：\n\
  `AFBECHG`\n`BECHG`\n\n让我们走一遍流程。首先初始化 `Okapi` 类。由于它有一个父类 `GiraffeFamily`，先初始化它，在第\
  \ 2 行打印 `A`。接下来，初始化 `Okapi` 类，在第 19 行打印 `F`。\n\n类初始化完成后，执行第 27 行的 `main()` 方法。`main()`\
  \ 方法创建了 `new Okapi`，触发了实例化过程。根据第二条规则，先初始化 `GiraffeFamily` 的实例。根据第四条规则，调用 `GiraffeFamily`\
  \ 的实例初始化器，在第 3 行打印 `B`。根据第五条规则，我们初始化构造函数。在这种情况下，这涉及到调用第 14 行的重载构造函数。结果是打印 `EC`，因为构造函数体按照调用的反向执行。\n\
  \n该过程继续初始化 `Okapi` 实例本身。根据第四和第五条规则，分别在第 25 行打印 `H` 和在第 23 行打印 `G`。当不需要调用任何重载构造函数时，过程变得简单得多。第\
  \ 29 行随后插入一个换行符。最后，第 30 行初始化另一个 `new Okapi`。初始化顺序与第 28 行相同，但不包含类初始化，因此再次打印 `BECHG`。注意\
  \ `D` 从未被打印，因为 `GiraffeFamily` 的三个构造函数中只有两个被调用。\n\n这个例子有点棘手，原因有几个：它有多个重载构造函数、大量的初始化器，以及一条复杂的构造函数路径。幸运的是，这类题目在考试中并不常见。如果你遇到，只需在阅读代码时记录下发生的情况即可。\n\
  \n我们通过列出考试中需要掌握的重要规则来结束本节：\n\n*   类在被引用或使用之前，最多会被 `JVM` 初始化一次。\n*   所有 `static final`\
  \ 变量必须被赋值一次，要么是在声明时，要么是在静态块中。\n*   所有 `final` 字段必须被赋值一次，要么是在声明时、在实例初始化器中或在构造函数中。\n\
  *   未赋值的非 final 静态和实例变量将根据其类型分配默认值。\n*   初始化顺序如下：变量声明，然后是初始化器，最后是构造函数。\n\n\n\n\n\
  既然我们已经创建了一个类，我们能用它做什么呢？Java 最大的优势之一就是利用其继承模型来简化代码。例如，假设你有五个类，每个类都继承自 `Animal` 类。此外，每个类都定义了一个具有相同实现的\
  \ `eat()` 方法。在这种情况下，在 `Animal` 类中定义一次 `eat()` 方法，比在五个独立的类中维护相同的方法要好得多。\n\n继承一个类不仅允许你访问父类中被继承的方法，还为父类和子类中定义的方法之间可能发生的冲突铺平了道路。在本节中，我们将回顾方法继承的规则以及\
  \ Java 如何处理此类场景。\n\n我们将对象呈现出许多不同形式的能力称为多态（polymorphism）。我们将在下一章中详细介绍这一点，但现在你只需要知道对象可以以多种方式使用，这在某种程度上取决于调用对象时使用的引用变量。\n\
  \n### 重写方法\n\n如果在父类和子类中定义了签名相同的方法会怎样？例如，你可能想定义该方法的新版本，并使其在该子类中表现出不同的行为。解决方案是在子类中重写该方法。在\
  \ Java 中，当子类对继承的方法声明具有相同签名和兼容返回类型的新实现时，就会发生方法重写。\n\n![](img/image_rsrc10B8.jpg)\n\
  \n记住，方法签名（method signature）由方法名和方法参数组成。它不包括返回类型、访问修饰符、可选指定符或任何声明的异常。\n\n当你重写方法时，仍然可以使用\
  \ `super` 关键字引用父类版本的方法。通过这种方式，`this` 和 `super` 关键字允许你分别在当前版本和父类版本之间进行选择。我们通过以下示例来说明这一点：\n\
  \n```java\npublic class Marsupial {\n\n    public double getAverageWeight() {\n\
  \        return 50;\n    }\n}\n\npublic class Kangaroo extends Marsupial {\n   \
  \ public double getAverageWeight() {\n        return super.getAverageWeight()+20;\n\
  \    }\n\n    public static void main(String[] args) {\n        System.out.println(new\
  \ Marsupial().getAverageWeight());  // 50.0\n        System.out.println(new Kangaroo().getAverageWeight());\
  \   // 70.0\n    }\n}\n```\n\n在这个示例中，`Kangaroo` 类重写了 `getAverageWeight()` 方法，但在过程中使用\
  \ `super` 引用调用了父类版本。\n\n### 方法重写的无限调用\n\n你可能会疑惑在上一个示例中使用 `super` 是必须的。例如，如果我们删掉\
  \ `super` 关键字，以下代码将输出什么？\n\n```java\npublic double getAverageWeight() {\n    return\
  \ getAverageWeight()+20;  // StackOverflowError\n}\n```\n\n在这个示例中，编译器不会调用父类 `Marsupial`\
  \ 方法；它会调用当前的 `Kangaroo` 方法。应用程序将尝试无限调用自己并在运行时产生 `StackOverflowError`。\n\n要重写方法，你必须遵循若干规则。当你重写方法时，编译器执行以下检查：\n\
  \n1. 子类中的方法必须与父类中的方法具有相同的签名。\n2. 子类中的方法访问权限至少要与父类方法相同。\n3. 子类中的方法不能声明比父类方法声明的任何异常更新或更广泛的检查异常（checked\
  \ exception）。\n4. 如果方法返回值，它必须与父类方法的返回值相同或是其子类型，这被称为协变返回类型（covariant return types）。\n\
  \n虽然这些规则初看起来可能很混乱或随意，但它们为了一致性是必不可少的。如果没有这些规则，Java 语言内部可能会产生矛盾。\n\n### 规则 #1：方法签名\n\
  \n重写方法的第一个规则是不言而喻的。如果两个方法的名称相同但签名不同，则这些方法是重载（overloaded），而不是重写（overridden）。重载方法被认为是独立的，不具有与重写方法相同的多态属性。\n\
  \n![](img/image_rsrc10B8.jpg)\n\n我们已经在 第 5 章 中介绍过方法的重载，它与重写方法相似，因为两者都涉及使用相同的名称定义方法。重载与重写的区别在于，重载方法使用不同的参数列表。对于考试来说，理解这种区别，并知道重写方法具有相同签名且比重载方法多得多的规则是非常关重要的。\n\
  \n### 规则 #2：访问修饰符\n\n关于访问修饰符的第二个规则目的是什么？让我们尝试一个说明性示例：\n\n```java\npublic class Camel\
  \ {\n    public int getNumberOfHumps() {\n        return 1;\n    }\n}\n\npublic\
  \ class BactrianCamel extends Camel {\n    private int getNumberOfHumps() {  //\
  \ 编译失败\n        return 2;\n    }\n}\n```\n\n在这个示例中，`BactrianCamel` 尝试重写父类中定义的 `getNumberOfHumps()`\
  \ 方法，但失败了，因为 `private` 比 `public` 限制更严格。\n\n假设 `BactrianCamel` 被允许编译。这个程序会打印什么？\n\
  \n```java\npublic class Rider {\n    public static void main(String[] args) {\n\
  \        Camel c = new BactrianCamel();\n        System.out.print(c.getNumberOfHumps());\
  \ // ???\n    }\n}\n```\n\n答案是，我们不知道。对象的引用类型是 `Camel`，其中方法被声明为 `public`，但对象实际上是类型\
  \ `BactrianCamel` 的实例，其中该方法被声明为 `private`。Java 通过将重写方法的访问修饰符限制为比继承方法可访问或权限更高的修饰符，避免了这种歧义性。\n\
  \n### 规则 #3：检查异常\n\n第三条规则规定，重写方法不能声明新的检查异常，或声明比继承方法更广泛的检查异常。这样做是为了多态性考虑，与限制访问修饰符类似。换句话说，你可能会得到一个比其赋值的引用类型更严格的对象，导致产生未处理或未声明的检查异常。该规则的一个影响是，重写方法可以声明任意数量的非检查异常（unchecked\
  \ exceptions）。\n\n![](img/image_rsrc10B8.jpg)\n\n如果你不知道什么是检查异常或非检查异常，不要担心。我们将在 第\
  \ 11 章 “异常与本地化”中介绍这些。现在你只需要知道该规则仅适用于检查异常。了解 `IOException` 和 `FileNotFoundException`\
  \ 都是检查异常，并且 `FileNotFoundException` 是 `IOException` 的子类也是有帮助的。\n\n让我们尝试一个示例：\n\n\
  ```java\npublic class Reptile {\n    protected void sleep() throws IOException {}\n\
  \    protected void hide() {}\n    protected void exitShell() throws FileNotFoundException\
  \ {}\n}\n\npublic class GalapagosTortoise extends Reptile {\n    public void sleep()\
  \ throws FileNotFoundException {}\n    public void hide() throws FileNotFoundException\
  \ {} // 编译失败\n    public void exitShell() throws IOException {} // 编译失败\n}\n```\n\
  \n在这个示例中，我们有三个重写方法。这些重写方法使用了权限更高的 `public` 修饰符，根据我们重写方法的第二个规则，这是允许的。`GalapagosTortoise`\
  \ 中的第一个重写方法 `sleep()` 编译通过，因为声明的异常比父类方法中声明的异常更窄。\n\n\n\n\n\n被重写的 `hide()` 方法无法编译，因为它声明了一个父类声明中不存在的新检查异常。被重写的\
  \ `exitShell()` 也无法编译，因为 `IOException` 是比 `FileNotFoundException` 更宽泛的检查异常。我们将在第\
  \ 11 章 中重新回顾这些异常类，包括记忆哪些类是彼此的子类。\n\n## 规则 #4：协变返回类型\n\n关于方法重写的第四条也是最后一条规则可能是最复杂的，因为它要求了解返回类型之间的关系。重写方法必须使用与被继承方法的返回类型协变的返回类型。\n\
  \n为了便于说明，我们来来看一个例子：\n\n```java\npublic class Rhino {\n    protected CharSequence\
  \ getName() {\n        return \"rhino\";\n    }\n    protected String getColor()\
  \ {\n        return \"grey, black, or white\";\n    }\n}\n\npublic class JavanRhino\
  \ extends Rhino {\n    public String getName() {\n        return \"javan rhino\"\
  ;\n    }\n    public CharSequence getColor() {  // 无法编译\n        return \"grey\"\
  ;\n    }\n}\n```\n\n子类 `JavanRhino` 尝试重写 `Rhino` 中的两个方法：`getName()` 和 `getColor()`。这两个被重写方法与被继承的方法具有相同的名称和签名。重写方法具有比继承方法更宽的访问修饰符\
  \ `public`。记住，在重写方法中使用更宽的访问修饰符是可以的。\n\n从第 4 章“核心 API”，我们学习到 `String` 实现了 `CharSequence`\
  \ 接口，使得 `String` 成为 `CharSequence` 的子类型。因此，`JavanRhino` 中 `getName()` 的返回类型与 `Rhino`\
  \ 中 `getName()` 的返回类型协变。\n\n另一方面，重写的 `getColor()` 方法无法编译，因为 `CharSequence` 不是 `String`\
  \ 的子类型。换句话说，所有的 `String` 值都是 `CharSequence` 值，但并不是所有的 `CharSequence` 值都是 `String`\
  \ 值。例如，`StringBuilder` 是 `CharSequence` 但不是 `String`。对于考试，你需要知道重写方法的返回类型是否与被继承方法的返回类型相同或为其子类型。\n\
  \n![](img/image_rsrc10BA.jpg)\n\n协变的一个简单测试是：给定一个被继承的返回类型 `A` 和一个重写的返回类型 `B`，你可以在不需要强制转换的情况下将\
  \ `B` 的实例赋值给引用变量 `A` ？如果是，它们就是协变的。这条规则同样适用于原始类型和对象类型。如果返回类型之一是 `void`，那么它们都必须是 `void`，因为除了自身之外没有什么是与\
  \ `void` 协变的。\n\n这就是本章关于方法重写你需要了解的所有内容。在第 9 章“集合与泛型”中，我们将重新回顾涉及泛型的方法重写。学习无止境！\n\n\
  ## ![](img/image_rsrc10BB.jpg) 现实世界场景\n\n### 使用 @Override 注解标记方法\n\n注解是一种元数据标签，提供了有关代码的附加信息。你可以使用\
  \ `@Override` 注解告诉编译器你正尝试重写一个方法。\n\n```java\npublic class Fish {\n    public void\
  \ swim() {};\n}\n\npublic class Shark extends Fish {\n    @Override\n    public\
  \ void swim() {};\n}\n```\n\n当方法被正确重写时，添加注解不会影响代码。另一方面，当方法被错误重写时，此注解可以防止你犯错。以下代码由于存在\
  \ `@Override` 注解而无法编译：\n\n```java\npublic class Fish {\n    public void swim() {};\n\
  }\n\npublic class Shark extends Fish {\n    @Override\n    public void swim(int\
  \ speed) {};  // 无法编译\n}\n```\n\n编译器看到你正在尝试进行方法重写，并寻找一个接受 `int` 值的继承自 `swim()` 版本。由于编译器没有找到该方法，它会报告错误。虽然考试不需要了解高级主题（例如如何创建注解），但了解如何正确使用它们是必要的。\n\
  \n### 重新声明私有方法\n\n如果你尝试重写一个 `private` 方法会发生什么？在 Java 中，你不能重写 `private` 方法，因为它们没有被继承。仅仅因为子类无法访问父类方法，并不意味着子类不能定义它自己的方法版本。严格来说，这意味着新方法并不是父类类方法的重写版本。\n\
  \nJava 允许你在子类中重新声明一个与父类方法具有相同或修改后签名的新方法。子类中的这个方法是一个独立且单独的方法，与父类版本的方法无关，因此没有任何方法重写规则被触发。例如，这两个声明是可以通过编译的：\n\
  \n```java\npublic class Beetle {\n    private String getSize() {\n        return\
  \ \"Undefined\";\n    }\n}\n\npublic class RhinocerosBeetle extends Beetle {\n \
  \   private int getSize() {\n        return 5;\n    }\n}\n```\n\n注意子类方法中的返回类型有所不同。\n\
  \n### 隐藏方法\n\n`static` 方法不能被重写，因为对象的继承方式并不相同。另一方面，它们可以被隐藏。当子类定义了一个与父类中方法同名的 `static`\
  \ 方法时，就会发生隐藏。隐藏与重写相似，但并不完全相同。\n\n```java\npublic class Bear {\n    public static\
  \ void eat() {\n        System.out.println(\"Bear is eating\");\n    }\n}\n\npublic\
  \ class Panda extends Bear {\n    public static void eat() {\n        System.out.println(\"\
  Panda is chewing\");\n    }\n    public static void main(String[] args) {\n    \
  \    eat();\n    }\n}\n```\n\n在这个例中，代码可以正常编译并运行。`Panda` 类中的 `eat()` 方法隐藏了 `Bear`\
  \ 类中的 `eat()` 方法，在运行时打印“Panda is chewing”。因为两者都被标记为 `static`，所以这不被视为重写方法。\n\n\n\n\
  \n在这个示例中，`sneeze()` 在父类中被标记为静态，但在子类中不是。编译器检测到你正尝试使用实例方法来重写它。然而，`sneeze()` 是一个应该被隐藏（hide）的静态方法，这会导致编译器生成错误。第二个方法\
  \ `hibernate()` 则由于相反的原因无法编译。该方法在子类中被标记为静态，但在父类中不是。\n\n最后，`laugh()` 方法无法编译。尽管该方法的两个版本都被标记为静态，但\
  \ `SunBear` 中的版本使用的访问修饰符比它继承的版本更具限制性，这违反了方法重写的第二条规则。请记住，在隐藏静态方法时必须遵循重写方法的四条规则。\n\
  \n### 隐藏变量\n\n正如你在方法重写中所看到的，当两个方法具有相同的签名且定义在父类和子类中时，会有很多规则。幸运的是，父类和子类中同名变量的规则要简单得多。事实上，Java\
  \ 不允许重写变量。不过，变量可以被隐藏。\n\n当子类定义了一个与父类中继承的变量同名的变量时，就会发生变量隐藏。这在子类实例中创建了两个不同的变量拷贝：一个定义在父类中，另一个定义在子类中。\n\
  \n就像隐藏静态方法一样，你不能重写变量，只能隐藏它。让我们来看一个隐藏变量。你认为以下程序会打印什么？\n\n```java\nclass Carnivore\
  \ {\n    protected boolean hasFur = false;\n}\n\npublic class Meerkat extends Carnivore\
  \ {\n    protected boolean hasFur = true;\n\n    public static void main(String[]\
  \ args) {\n        Meerkat m = new Meerkat();\n        Carnivore c = m;\n      \
  \  System.out.println(m.hasFur);  // true\n        System.out.println(c.hasFur);\
  \  // false\n    }\n}\n```\n\n对输出感到困惑吗？这两个类都定义了 `hasFur` 变量，但值不同。尽管 `main()` 方法只创建了一个对象，两个变量也是独立存在的。输出取决于所使用的引用变量。\n\
  \n如果你没有理解最后一个示例，不要担心。我们将在下一章更详细地介绍多态。现在，你只需要知道，重写方法会替换所有引用变量上的父方法（`super` 除外），而隐藏方法或变量仅在使用子类引用类型时才会替换成员。\n\
  \n### 编写 final 方法\n\n我们用一个相当自言自义的规则来结束对方法继承的讨论：`final` 方法不能被重写。通过将方法标记为 `final`，你禁止了子类替换该方法。这一规则无论是在重写方法还是隐藏方法时都有效。也就是说，如果一个静态方法在父类中被标记为\
  \ `final`，则你不能在子类中隐藏该静态方法。\n\n让我们来看一个示例：\n\n```java\npublic class Bird {\n    public\
  \ final boolean hasFeathers() {\n        return true;\n    }\n    public final static\
  \ void flyAway() {}\n}\n\npublic class Penguin extends Bird {\n    public final\
  \ boolean hasFeathers() {  // 无法编译\n        return false;\n    }\n    public final\
  \ static void flyAway() {}  // 无法编译\n}\n```\n\n在这个示例中，实例方法 `hasFeathers()` 在父类 `Bird`\
  \ 中被标记为 `final`，因此子类 `Penguin` 无法重写父方法，导致编译器错误。静态方法 `flyAway()` 也被标记为 `final`，因此无法在子类中隐藏。在这个示例中，子方法是否使用\
  \ `final` 关键字并不重要——代码如何都无法编译。\n\n此规则仅适用于继承的方法。例如，如果两个方法在父类 `Bird` 类中被标记为 `private`，那么按照定义的\
  \ `Penguin` 类将可以通过编译。在这种情况下，私有方法将被重新声明，而不是重写或隐藏。\n\n## 创建抽象类\n\n在设计模型时，我们有时想要创建一个无法直接实例化的实体。例如，假设我们有一个\
  \ `Canine` 类，其子类为 `Wolf`、`Fox` 和 `Coyote`。我们希望其他开发者能够创建子类的实例，但可能不希望他们能够创建 `Canine`\
  \ 实例。换句话说，我们希望强制所有 `Canine` 对象在运行时具有特定的类型。\n\n### 引入抽象类\n\n引入抽象类。抽象类是一个用 `abstract`\
  \ 修饰符声明的类，它不能直接实例化，并可能包含抽象方法。让我们来看一个基于 `Canine` 数据模型的示例：\n\n```java\npublic abstract\
  \ class Canine {}\npublic class Wolf extends Canine {}\npublic class Fox extends\
  \ Canine {}\npublic class Coyote extends Canine {}\n```\n\n在这个示例中，其他开发者可以创建 `Wolf`、`Fox`\
  \ 或 `Coyote` 的实例，但不能创建 `Canine`。当然，他们可以将变量引用作为 `Canine` 传递，但在运行时底层对象必须是 `Canine`\
  \ 的子类。\n\n等一下，还有更多！抽象类可以包含抽象方法。抽象方法是一个用 `abstract` 修饰符声明且没有定义体的方法。换句话说，抽象方法强制子类进行重写。我们为什么要这样做呢？当然是为了多态性！通过将方法标记为\
  \ `abstract`，我们可以保证在实例上会有某个版本可用，而不需要在父类中指定该版本是什么。\n\n```java\npublic abstract class\
  \ Canine {\n    public abstract String getSound();\n    public void bark() { System.out.println(getSound());\
  \ }\n}\n\npublic class Wolf extends Canine {\n    public String getSound() {\n \
  \       return \"Wooooof!\";\n    }\n}\n\npublic class Fox extends Canine {\n  \
  \  public String getSound() {\n        return \"Squeak!\";\n    }\n}\n\npublic class\
  \ Coyote extends Canine {\n    public String getSound() {\n        return \"Roar!\"\
  ;\n    }\n}\n```\n\n我们可以创建一个 `Fox` 实例并将其赋值给父类型 `Canine`。运行时将使用重写的方法。\n\n```java\n\
  public static void main(String[] p) {\n    Canine w = new Fox();\n    w.bark();\
  \ // Squeak!\n}\n```\n\n到目前为止很容易。但还有一些你需要注意的规则：\n\n- 只有实例方法可以在类中标记为 `abstract`，变量、构造函数或静态方法不行。\n\
  - 抽象类可以包含零或多个抽象方法，而非抽象类不能包含。\n- 继承抽象类的非抽象必须实现所有继承的抽象方法。\n- 重写抽象方法遵循你之前学的方法重写规则。\n\
  \n看看能否看出为什么这些类声明无法编译：\n\n```java\npublic class FennecFox extends Canine {\n    public\
  \ int getSound() {\n        return 10;\n    }\n}\n\npublic class ArcticFox extends\
  \ Canine {}\n\npublic class Direwolf extends Canine {\n    public abstract void\
  \ rest();\n    public String getSound() {\n        return \"Roof!\";\n    }\n}\n\
  \npublic class Jackal extends Canine {\n    public abstract String name;\n    public\
  \ String getSound() {\n        return \"Laugh\";\n    }\n}\n```\n\n首先，`FennecFox`\
  \ 类无法编译，因为它是一个无效的方法重写。特别是，返回类型不是协变的。`ArcticFox` 类无法编译，因为它没有重写抽象方法 `getSound()`。`Direwolf`\
  \ 类无法编译，因为它不是抽象类却声明了抽象方法 `rest()`。最后，`Jackal` 类无法编译，是因为变量不能被标记为抽象。\n\n抽象类通常用于我们希望另一个类继承特定类的属性，但又希望子类来填充某些实现细节的情况。\n\
  \n\n\n\n早些时候，我们提到抽象类是无法实例化的。这意味着如果你尝试实例化它，编译器将报告异常，如本例所示：\n\n```java\nabstract class\
  \ Alligator {\n    public static void main(String… food) {\n        var a = new\
  \ Alligator();  // 无法编译\n    }\n}\n```\n\n抽象类可以被初始化，但只能作为非抽象子类实例化过程的一部分。\n\n## 声明抽象方法\n\
  \n抽象方法总是在不带方法体的情况下声明的。它在方法声明之后还必须包含一个分号（`;`）。正如你在上一个示例中看到的，抽象类可以包含非抽象方法，在本例中就是包含了\
  \ `bark()` 方法。事实上，抽象类可以包含与非抽象类相同的所有成员，包括变量、静态和实例方法、构造函数等。\n\n你可能会惊讶地发现，抽象类并不要求包含任何抽象方法。例如，下面的代码即使没有定义任何抽象方法，也是可以通过编译的：\n\
  \n```java\npublic abstract class Llama {\n    public void chew() {}\n}\n```\n\n\
  即使没有抽象方法，该类也无法直接实例化。对于考试，请注意声明在抽象类之外的抽象方法，例如如下：\n\n```java\npublic class Egret {\
  \  // 无法编译\n    public abstract void peck();\n}\n```\n\n考试出题者喜欢包含无效的类声明，将非抽象类与抽象方法混合。\n\
  \n与 `final` 修饰符一样，`abstract` 修饰符可以放在类和方法声明中访问修饰符之前或之后，如这个 `Tiger` 类所示：\n\n```java\n\
  abstract public class Tiger {\n    abstract public int claw();\n}\n```\n\n在类声明中，`abstract`\
  \ 修饰符不能放在 `class` 关键字之后，在方法声明中不能放在返回类型之后。以下 `Bear` 和 `howl()` 的声明由于这些原因无法编译：\n\n\
  ```java\npublic class abstract Bear     // 无法编译\n    public int abstract howl();\
  \  // 无法编译\n}\n```\n\n![](img/image_rsrc10B8.jpg)\n\n无法定义一个带有方法体或默认实现的抽象方法。你仍然可以定义一个带有方法体的默认方法——你只是不能将其标记为\
  \ `abstract`。只要你不将方法标记为 `final`，子类就有权重写该继承的方法。\n\n## 创建具体类\n\n当抽象类被一个具体子类扩展时，它就变得可用了。具体类是非抽象类。第一个扩展抽象类的具体子类必须实现所有继承的抽象方法。这包括实现从继承的接口继承来的任何抽象方法，正如你在下一章中看到的那样。\n\
  \n当你在考试中看到具体类扩展抽象类时，请检查并确保它实现了所有要求的抽象方法。你能看出为什么下面的 `Walrus` 类无法编译的吗？\n\n```java\n\
  public abstract class Animal {\n    public abstract String getName();\n}\n\npublic\
  \ class Walrus extends Animal {} // 无法编译\n```\n\n在这个示例中，我们看到 `Animal` 被标记为 `abstract`，而\
  \ `Walrus` 没有，使得 `Walrus` 成为 `Animal` 的具体子类。由于 `Walrus` 是第一个具体子类，它必须实现所有继承的抽象方法——在本例中为\
  \ `getName()`。由于它没有实现，编译器会在 `Walrus` 的声明处报告错误。\n\n我们强调第一个具体子类是有原因的。抽象类可以扩展非抽象类，反之亦然。每当具体类扩展抽象类时，它必须实现所有作为抽象方法继承的方法。让我们通过一组继承的类来说说明这一点：\n\
  \n```java\npublic abstract class Mammal {\n    abstract void showHorn();\n    abstract\
  \ void eatLeaf();\n}\n\npublic abstract class Rhino extends Mammal {\n    void showHorn()\
  \ {}  // 继承自 Mammal\n}\n\npublic class BlackRhino extends Rhino {\n    void eatLeaf()\
  \ {}   // 继承自 Mammal\n}\n```\n\n在这个示例中，`BlackRhino` 类是第一个具体子类，而 `Mammal` 和 `Rhino`\
  \ 类是抽象类。`BlackRhino` 类继承了抽象的 `eatLeaf()` 方法，因此被要求提供一个实现，它确实提供了。\n\n那么 `showHorn()`\
  \ 方法呢？由于父类 `Rhino` 提供了 `showHorn()` 的实现，该方法在 `BlackRhino` 中是以非抽象方法的形式被继承的。由于这个原因，`BlackRhino`\
  \ 类允许但并不要求重写 `showHorn()` 方法。此示例中的三个类定义正确且可以编译。\n\n如果我们修改 `Rhino` 的声明以移除 `abstract`\
  \ 修饰符会怎样？\n\n```java\npublic class Rhino extends Mammal {  // 无法编译\n    void showHorn()\
  \ {}\n}\n```\n\n通过将 `Rhino` 变为具体类，它变成了扩展抽象类 `Mammal` 的第一个非抽象类。因此，它必须为 `showHorn()`\
  \ 和 `eatLeaf()` 方法提供实现。由于它只提供了其中一个方法，修改后的 `Rhino` 声明无法编译。\n\n让我们再尝试一个例子。下面的具体类 `Lion`\
  \ 继承了两个抽象方法：`getName()` 和 `roar()`：\n\n```java\npublic abstract class Animal {\n\
  \    abstract String getName();\n}\n\npublic abstract class BigCat extends Animal\
  \ {\n    protected abstract void roar();\n}\n\npublic class Lion extends BigCat\
  \ {\n    public String getName() {\n        return \"Lion\";\n    }\n    public\
  \ void roar() {\n        System.out.println(\"The Lion lets out a ROAR!\");\n  \
  \  }\n}\n```\n\n在示例代码中，`BigCat` 扩展了 `Animal` 但被标记为 `abstract`；因此，它不需要为 `getName()`\
  \ 方法提供实现。类 `Lion` 没有被标记为抽象，作为第一个具体子类，它必须实现所有抽象方法。\n\n## 在抽象类中创建构造函数\n\n尽管抽象类不能实例化，但它们仍然通过子类进行初始化。例如，考虑以下程序：\n\
  \n```java\nabstract class Mammal {\n    abstract String chew();\n    public Mammal()\
  \ {\n        System.out.println(chew()); // 这行可以编译吗？\n    }\n}\n\npublic class Platypus\
  \ extends Mammal {\n    String chew() { return \"yummy!\"; }\n    public static\
  \ void main(String[] args) {\n        new Platypus();\n    }\n}\n```\n\n使用你在本章早期学到的构造函数规则，编译器在\
  \ `Plypus` 类中插入了一个默认无参构造函数，该函数首先调用 `Mammal` 类中的 `super()`。只有当抽象类通过子类进行初始化时，才会调用\
  \ `Mammal` 构造函数；因此在调用构造函数时存在 `chew()` 的实现。代码编译并在运行时打印 \"yummy!\"。\n\n对于考试，记住抽象类的初始化方式与非抽象类相同。例如，如果抽象类没有提供构造函数，编译器会自动插入一个默认无参构造函数。抽象类构造函数与非抽象类构造函数的主要区别在于，抽象类的构造函数只有在被非抽象子类初始化时才可被调用。这是逻辑的，因为抽象类无法被实例化。\n\
  \n## 识别无效声明\n\n我们对抽象类的讨论将以回顾一些在考试中比在现实生活中更容易遇到的潜在问题作为结束。考试出题者喜欢设计那些既标记为抽象方法又定义了实现的题目。例如，你能看出为什么以下每个方法无法编译吗？\n\
  \n```java\npublic abstract class Turtle {\n    public abstract long eat();     //\
  \ 无法编译\n    public abstract void swim() {}; // 无法编译\n    public abstract int getAge()\
  \ {  // 无法编译\n        return 10;\n    }\n}\n```\n\n\n\n\n```java\n    public abstract\
  \ void sleep;    // 无法编译\n\n    public void goInShell();        // 无法编译\n\n}\n```\n\
  \n第一个方法 `eat()` 无法编译，因为它被标记为抽象（abstract），但没有以分号（`;`）结尾。接两个方法 `swim()` 和 `getAge()`\
  \ 无法编译，是因为它们被标记为抽象，但提供了一个由大括号（`{}`）包含的实现块。考试时，请记住抽象方法的声明必须以分号结尾，且不能有任何大括号。下一个方法\
  \ `sleep` 无法编译，是因为缺少了方法参数的括号 `()`。最后一个方法 `goInShell()` 无法编译，因为它没有被标记为抽象，因此必须提供一个由大括号（`{}`）包含体。\n\
  \n确保你理解为什么之前的每个方法都无法编译，并且你能够在考试中识别出此类错误。如果你在考试中遇到类或方法被标记为抽象的问题，请确保在尝试解决问题之前，该类已正确实现。\n\
  \n### abstract 和 final 修饰符\n\n如果你将一个类或方法同时标记为 abstract 和 final，会发生什么？如果你将某物标记为 abstract，意味着你意图让其他人扩展或实现它。但如果你将某物标记为\
  \ final，你就在阻止任何人扩展或实现它。这两个概念是相互冲突的。\n\n由于这种不兼容性，Java 不允许一个类或方法同时被标记为 abstract 和\
  \ final。例如，以下代码将无法编译：\n\n```java\npublic abstract final class Tortoise {  // 无法编译\n\
  \n    public abstract final void walk();   // 无法编译\n\n}\n```\n\n在这个示例中，类声明和方法声明都无法编译，因为它们同时被标记为\
  \ abstract 和 final。考试通常不会频繁对类或方法使用 final 修饰符，所以如果你看到了它们，请确保它们没有与 abstract 修饰符一起使用。\n\
  \n### abstract 和 private 修饰符\n\n方法不能同时被标记为 abstract 和 private。如果你仔细考虑，这个规则是有意义的。如果一个方法没有被子类继承，你该如何定义一个实现该方法的子类呢？答案是你做不到，这就是为什么当你尝试以下操作时，编译器会报错：\n\
  \n```java\npublic abstract class Whale {\n\n    private abstract void sing();  //\
  \ 无法编译\n\n}\n\npublic class HumpbackWhale extends Whale {\n\n    private void sing()\
  \ {\n\n        System.out.println(\"Humpback whale is singing\");\n\n    } }\n```\n\
  \n在这个示例中，父类 `Whale` 中定义的抽象方法 `sing()` 对子类 `HumpbackWhale` 是不可见的。尽管 `HumpbackWhale`\
  \ 提供了一个实现，但这并不被视为对抽象方法的重写，因为该抽象方法没有被继承。编译器在父类中识别了这一点，一旦对同一个方法应用 private 和 abstract\
  \ 就会报错。\n\n![](img/image_rsrc10B8.jpg)\n\n无法将方法声明为 abstract 和 private，但将方法声明为 final\
  \ 和 private 是可能的（尽管是冗的）。\n\n如果我们将父类 `Whale` 中的访问修饰符从 private 改为 protected，代码可以编译吗？\n\
  \n```java\npublic abstract class Whale {\n\n    protected abstract void sing();\n\
  }\n\npublic class HumpbackWhale extends Whale {\n\n    private void sing() {  //\
  \ 无法编译\n\n        System.out.println(\"Humpback whale is singing\");\n\n    }\n\n\
  }\n```\n\n在修改后的示例中，代码仍然无法编译，但原因完全不同。如果你记得重写方法的规则，子类不能降低父类方法 `sing()` 的可见性。由于该方法在父类中被声明为\
  \ protected，它在子类中必须被标记为 protected 或 public。即使是抽象方法，也必须遵守重写方法的规则。\n\n### abstract\
  \ 和 static 修饰符\n\n正如我们在本章前面讨论的，由于静态方法只能被隐藏（hide），而不能被重写（override）。它被定义为属于类，而不是类的实例。如果静态方法不能被重写，那么推导出它也不能被标记为抽象，因为它永远无法被实现。例如，以下类无法编译：\n\
  \n```java\nabstract class Hippopotamus {\n\n    abstract static void swim();  //\
  \ 无法编译\n}\n```\n\n考试时，请确保你知道哪些修饰符可以和不能一起使用，特别是对于抽象类和接口。\n\n## 创建不可变对象\n\n正如你可能从第\
  \ 4 章 记得的那，不可变对象是在创建后不能改变状态的对象。不可变对象模式是一种面向对象的设计模式，其中对象在创建后无法被修改。\n\n在编写安全代码时，不可变对象非常有帮助，因为你不需要担心值会改变。在处理并发问题时，它们也简化了代码，因为不可变对象可以轻松地在多个线程之间共享。\n\
  \n### 声明不可变类\n\n虽然编写不可变类有很多技巧，但你应该熟悉一种使类变为不可变的常用策略：\n\n1. 将类标记为 `final` 或将所有构造函数设为\
  \ `private`。\n2. 将所有实例变量标记为 `private` 和 `final`。\n3. 不要定义任何 setter 方法（设置方法）。\n4.\
  \ 不要允许引用的可变对象被修改。\n5. 如果需要，使用构造函数设置所有属性。\n\n第一条规则防止了任何人创建子类。第二和第三条规则确保调用者不会修改实例变量，这是良好封装的标志，也是我们在第\
  \ 7 章 中讨论 records 时提到过的话题。创建不可变对象的第四条规则很微妙。基本上，这意味着你不应该暴露可变字段的访问器（accessor 或 getter）方法。\n\
  \n```java\nimport java.util.*;\n\npublic final class Animal {  // 一个类声明\n    private\
  \ final ArrayList<String> favoriteFoods;\n\n    public Animal() {\n        this.favoriteFoods\
  \ = new ArrayList<String>();\n        this.favoriteFoods.add(\"Apples\");\n    }\n\
  \n    public List<String> getFavoriteFoods() {\n        return favoriteFoods;\n\
  \    }\n```\n\n我们仔细遵循了前三条规则，但遗憾的是，恶意的调用者仍然可以修改我们的数据。\n\n```java\nvar zebra = new\
  \ Animal();\nSystem.out.println(zebra.getFavoriteFoods()); // [Apples]\nzebra.getFavoriteFoods().clear();\n\
  zebra.getFavoriteFoods().add(\"Chocolate Chip Cookies\");\nSystem.out.println(zebra.getFavoriteFoods());\
  \ // [Chocolate Chip Cookies]\n```\n\n噢不！斑马不应该吃巧克力饼干！如果内容就改变不可变对象！如果我们没有 `favoriteFoods`\
  \ 对象的 getter，调用者如何访问它？简单：通过使用委托或包装方法来读取数据。\n\n```java\nimport java.util.*;\n\npublic\
  \ final class Animal {  // 一个类声明\n    private final List<String> favoriteFoods;\n\
  \n    public Animal() {\n        this.favoriteFoods = new ArrayList<String>();\n\
  \        this.favoriteFoods.add(\"Apples\");\n    }\n\n    public int getFavoriteFoodsCount()\
  \ {\n        return favoriteFoods.size();\n    }\n\n    public String getFavoriteFoodsItem(int\
  \ index) {\n        return favoriteFoods.get(index);\n    }\n}\n```\n\n在这个改进后的版本中，数据仍然可用。然而，它是一个真正的不可变对象，因为可变变量无法被调用者修改。\n\
  \n### 读取复制访问器方法\n\n除了委托私有可变对象的访问，另一种方法是在每次请求可变对象时对该对象创建一个副本。\n\n```java\npublic\
  \ ArrayList<String> getFavoriteFoods() {\n    return new ArrayList<String>(this.favoriteFoods);\n\
  }\n```\n\n\n\n当然，副本的更改不会反映在原始对象上，但至少原始对象免受了外部更改的影响。如果调用者频繁调用此操作，可能会是一项开销较大的操作。\n\
  \n### 执行防御拷贝\n\n那么，创建不可变对象的第五条也是最后一条规则是关于什么的？在设计我们的类时，假设我们希望有一个规则：`favoriteFoods`\
  \ 的数据由调用者提供，并且它始终包含一个元素。这种规则通常被称为**不变性**（invariant）；当我们拥有该对象的实例时，它总是成立的。\n\n```java\n\
  import java.util.*;\n\npublic final class Animal { // 不是一个不可变对象的声明\n\n   private\
  \ final ArrayList<String> favoriteFoods;\n\n   public Animal(ArrayList<String> favoriteFoods)\
  \ {\n      if (favoriteFoods == null || favoriteFoods.size() == 0)\n          throw\
  \ new RuntimeException(\"favoriteFoods is required\");\n      this.favoriteFoods\
  \ = favoriteFoods;\n   }\n\n   public int getFavoriteFoodsCount() {\n      return\
  \ favoriteFoods.size();\n   }\n\n   public String getFavoriteFoodsItem(int index)\
  \ {\n      return favoriteFoods.get(index);\n   }\n }\n```\n\n为了确保 `favoriteFoods`\
  \ 被提供，我们在构造函数中对其进行了验证，如果未提供则抛出异常。那么，它是不可变的吗？不完全！恶意的调用者可能会耍花筋，保留他们对我们 `favoriteFoods`\
  \ 对象的私有引用，他们可以直接修改它。\n\n```java\nvar favorites = new ArrayList<String>();\n\nfavorites.add(\"\
  Apples\");\n\nvar zebra = new Animal(favorites); // 调用者仍然可以访问 favorites \n\nSystem.out.println(zebra.getFavoriteFoodsItem(0));\
  \ // [Apples]\n\nfavorites.clear();\n\nfavorites.add(\"Chocolate Chip Cookies\"\
  );\n\nSystem.out.println(zebra.getFavoriteFoodsItem(0)); // [Chocolate Chip Cookies]\n\
  ```\n\n哎呀！`Animal` 似乎不再是不可变的了，因为它的内容在创建后可以改变。解决方案是创建一个包含相同元素的列表副本。\n\n```java\n\
  public Animal(List<String> favoriteFoods) {\n      if (favoriteFoods == null ||\
  \ favoriteFoods.size() == 0)\n          throw new RuntimeException(\"favoriteFoods\
  \ is required\");\n      this.favoriteFoods = new ArrayList<String>(favoriteFoods);\n\
  \   }\n```\n\n这种拷贝操作被称为**防御拷贝**（defensive copy），因为进行拷贝是为了防止其他代码发生意想不到的操作。这与防御性驾驶的原理相同：在问题发生之前防止它。通过这种方法，我们的\
  \ `Animal` 类再次变为了不可变。\n\n### 总结\n\n本章基于我们在整本书中介绍的基础类结构，通过引入继承的概念对其进行了扩展。Java 类遵循单继承模式，其中每个类都恰好有一个直接父类，所有类最终都继承自\
  \ `java.lang.Object`。\n\n继承一个类可以让你访问该类所有的公共（public）和受保护（protected）成员。如果类在同一个包中，你还可以访问该类的包成员。所有的实例方法、构造函数和实例初始化器都可以访问两个特殊的引用变量：`this`\
  \ 和 `super`。`this` 和 `super` 都提供了对所有继承成员的访问权限，但只有 `this` 提供对当前类声明中所有成员的访问。\n\n构造函数是使用类名且没有返回类型的特殊方法。它们用于实例化新对象。声明构造函数需要遵循许多重要规则。如果没有提供构造函数，编译器将自动在类中插入一个默认的无参构造函数。每个构造函数的第一行都是调用重载的构造函数\
  \ `this()` 或父类构造函数 `super()`；否则，编译器会在构造函数的第一行插入对 `super()` 的调用。在某些情况下（例如父类没有定义无参构造函数），这可能会导致编译错误。考试时，请特别注意任何定义了带参数构造函数但没有定义无参构造函数的类。\n\
  \n类的初始化按照预定的顺序进行：父类初始化；静态变量和静态初始化器按出现的顺序初始化；实例变量和实例初始化器按出现的顺序初始化；最后是构造函数。所有 `final`\
  \ 实例变量必须恰好赋值一次。\n\n我们回顾了重载（overloaded）、重写（overridden）、隐藏（hidden）和重新声明（redeclared）方法，并展示了它们之间的区别。如果一个方法与另一个可访问方法名称相同但签名不同，则该方法是**重载**的。如果一个方法与继承的方法具有相同的签名，且访问修饰符、异常和返回类型兼容，则该方法是**重写**的。如果一个静态方法与继承的静态方法具有相同的签名，则该方法是**隐藏**的。最后，如果一个方法与未继承的方法具有相同的名称且可能相同的签名，则该方法是**重新声明**的。\n\
  \n接着我们讨论了抽象类，它们与普通类相似，不同之处在于不能实例化并且可能包含抽象方法。抽象类可以扩展非抽象类，反之亦然。抽象类可以用于定义一个框架，其他开发者基于该框架编写子类。**抽象方法**是在声明时不包含方法体的方法。抽象方法只能放置在抽象类内部。此外，抽象方法可以被重写。\n\
  \n最后，本章向你展示了如何创建不可变对象。虽然有很多不同的技术可以实现，但我们包含了你应该掌握的最常用方法。\n\n## 考试要点\n\n能够编写扩展其他类的代码。��A\
  \ 扩展另一个类的 Java 类继承了它所有的公共和受保护方法。如果类在同一个包中，它还继承包成员。标记为 `final` 的类不能被扩展。最后，Java 中的所有类都直接或通过父类继承\
  \ `java.lang.Object`。\n\n能够区分并使用 `this`、`this()`、`super` 和 `super()`。��A 要访问类的当前或继承成员，可以使用\
  \ `this` 引用。要访问继承成员，可以使用 `super` 引用。`super` 引用通常用于减少歧义，例如当类重用继承的方法或变量的名称时。对 `this()`\
  \ 和 `super()` 的调用分别用于访问同类和父类的构造函数。\n\n评估涉及构造函数的代码。��A 每个构造函数的第一行都是使用 `this()` 调用类内的另一个构造函数，或使用\
  \ `super()` 调用父类的构造函数。如果没有声明任何构造函数调用，编译器将插入对 `super()` 的调用。如果父类不包含无参构造函数，则必须提供对父类构造函数的显式调用。能够识别何时提供了默认构造函数。记住初始化顺序是初始化类层级结构中的所有类，从父类开始。然后初始化实例，同样从父类开始。在构造函数结束时，所有\
  \ `final` 变量必须恰好赋值一次值。\n\n理解方法重写的规则。��A 如果遵循某些规则，Java 允许重写方法（或替换）：方法必须具有相同的签名、访问权限不低于父方法、不能声明任何新的或更宽泛的异常，并且使用协变返回类型。标记为\
  \ `final` 的方法不能被重写或隐藏。\n\n\n\n\n# 识别方法重写与方法重载的区别\n\n方法重载和重写都涉及创建一个与现有方法同名的新方法。当方法签名相同时，它被称为方法重写（method\
  \ overriding），并且必须遵循特定的重写规则才能编译。当方法签名不同（即方法接收的输入不同）时，被称为方法重载（method overloading），且不需要遵循任何重写规则。方法重写对多态至关重要，因为它替换了所有对方法的调用，即使是在父类中进行的调用。\n\
  \n# 理解隐藏方法和变量的规则。\n\n当在子类中重写静态（static）方法时，它被称为方法隐藏（method hiding）。同样，变量隐藏是指在子类中重用继承的变量名。在在这两种情况下，原始方法或变量仍然存在，并且取决于访问的位置和所使用的引用类型是可以访问的。对于方法隐藏，父类和子类之间方法声明中的\
  \ `static` 关键字必须保持一致。最后，通常应该避免变量和方法隐藏，因为这会导致代码逻辑混乱且难以追踪。\n\n# 能够编写创建和扩展抽象类的代码。\n\
  \n在 Java 中，类和方法可以声明为 `abstract`（抽象）。抽象类不能被实例化。抽象类的实例只能通过具体的子类（concrete subclass）获得。抽象类可以包含任意数量的抽象和非抽象方法，包括零。抽象方法遵循所有的方法重写规则，并且只能定义在抽象类中。抽象类的第一个具体子类必须实现所有继承的方法。抽象类和方法不能标记为\
  \ `final`。\n\n# 创建不可变对象。\n\n不可变对象是在声明后无法修改的对象。不可变类通常通过 `private` 构造函数、不提供设置 方法（setter\
  \ methods）以及没有修改类中所包含的可变对象的能力来实现。\n\n## 复习题\n\n章节复习题的答案可以在附录中找到。\n\n1. 插入哪行代码可以使其打印\
  \ 2？\n\n```java\npublic class BirdSeed {\n    private int numberBags;\n    boolean\
  \ call;\n    public BirdSeed() {\n        // LINE 1\n        call = false;\n   \
  \     // LINE 2\n    }\n    public BirdSeed(int numberBags) {\n        this.numberBags\
  \ = numberBags;\n    }\n    public static void main(String[] args) {\n        var\
  \ seed = new BirdSeed();\n        System.out.print(seed.numberBags);\n    }\n}\n\
  ```\n\n1. 将第 1 行替换为 `BirdSeed(2);`\n2. 将第 2 行替换为 `BirdSeed(2);`\n3. 将第 1 行替换为 `new\
  \ BirdSeed(2);`\n4. 将第 2 行替换为 `new BirdSeed(2);`\n5. 将第 1 行替换为 `this(2);`\n6. 将第\
