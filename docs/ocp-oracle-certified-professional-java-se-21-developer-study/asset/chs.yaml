  \n**27. 假设 record 定义了至少一个字段，编译器总是插入哪些组件？（选择所有项）**\n\n1. 无参数构造函数\n2. 访问方法\n3. toString()\n\
  4. equals() 方法\n5. 变器方法\n6. 排序方法\n7. hashCode()\n\n**28. 下列类和接口无法编译？（选择所有项）**\n\n\
