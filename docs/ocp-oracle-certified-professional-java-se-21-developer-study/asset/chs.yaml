  \nFIGURE 7.2 实现接口\n\n### 扩展接口\n\n像类一样，接口可以使用 `extends` 关键字扩展另一个接口。\n\n```java\n\
  public interface Nocturnal {}\n\npublic interface HasEyes extends Nocturnal {}\n\
  ```\n\n与类（只能继承一个类）不同，接口可以扩展多个接口。\n\n```java\npublic interface Nocturnal {\n\n  \
  \  int hunt();\n}\n\npublic interface CanFly extends Nocturnal {}\n\n\n在这个示例中，`Owl`\
  \ 类实现了 `HasEyes` 并必须实现 `hunt()` 和 `flap()` 方法。扩展两个接口是允许的，因为接口不属于类层次结构。它们不包含构造函数。接口只是定义了类必须遵循的规则和方法。\n\
  \n### 继承接口\n\n像抽象类一样，当具体类继承接口时，所有的抽象方法都必须被实现。我们在图 7.3 中说明了这一原则。具体类 `Swan` 继承了多少个抽象方法？\n\
  \n![接口继承的流程图。对象位于抽象类 animal、抽象类 bird、类 swan、接口 fly 和接口 swim 之间。向上箭头表示 extends，侧向箭头表示\
  \ implements。](img/image_rsrc10CN.jpg)\n\nFIGURE 7.3 接口继承\n\n放弃了吗？具体类 `Swan` 继承了四个抽象方法，它必须重写这些方法：`getType()`、`canSwoop()`、`fly()`\
  \ 和 `swim()`。\n\n让我们来看另一个涉及实现接口的抽象类的示例：\n\n```java\npublic interface HasTail {\n\
  \n    int getTailLength();\n}\n\npublic interface HasWhiskers {\n\n    int getNumberOfWhiskers();\n\
  }\n\npublic abstract class HarborSeal implements HasTail, HasWhiskers {}\n\npublic\
  \ class CommonSeal extends HarborSeal {} // 无法编译\n\n`HarborSeal` 类可以通过编译是因为它是抽象的，不要求实现它继承的任何抽象方法。然而，具体的\
  \ `CommonSeal` 类必须重写所有继承的抽象方法。\n\n### 混合类和接口关键字\n\n出题者喜欢混合类和接口术语的问题。虽然类可以实现接口，但类不能扩展接口。同样，虽然接口可以扩展另一个接口，但接口不能实现另一个接口。以下示例说明了这些原则：\n\
  \n```java\npublic interface CanRun {}\n\npublic class Cheetah extends CanRun {}\
  \ // 无法编译\n\npublic class Hyena {}\n\npublic interface HasFur extends Hyena {} //\
  \ 无法编译\n```\n\n\n\n\n\n请留小心混合了类声明和接口的的题目。\n\n## 继承重复的抽象方法\n\nJava 支持继承两个方法声明兼容的抽象方法。\n\
  \n```java\npublic interface Herbivore { public int eatPlants(int plantsLeft); }\n\
  public interface Omnivore { public int eatPlants(int foodRemaining); }\npublic class\
  \ Bear implements Herbivore, Omnivore {\n    public int eatPlants(int plants) {\n\
  \        System.out.print(\"Eating plants\");\n        return plants - 1;\n    }\n\
  \ }\n```\n\n所谓“兼容”，是指可以编写一个方法来正确地重写两个被继承的方法：例如，使用您在第 6 章中学习过的协变返回类型。注意，方法的参数名称不需要匹配，类型匹配即可。\n\
  \n以下是一个不兼容声明的示例：\n\n```java\npublic interface Herbivore { public void eatPlants(int\
  \ plantsLeft); }\npublic interface Omnivore  { public int eatPlants(int foodRemaining);\
  \ }\npublic class Tiger implements Herbivore, Omnivore { // 无法编译\n    // 没关系！\n\
  }\n```\n\n在这种情况下，`Tiger` 的实现并不重要，因为无法写出一个同时满足两个被继承的抽象方法的 `Tiger` 版本。无论 `Tiger` 类内部声明了什么，代码都无法编译。\n\
  \n## 插入隐式修饰符\n\n如前所述，隐式修饰符是编译器会自动插入的。这让人让人想起编译器在您没有定义构造函数时插入默认的无参数构造函数，这是您在第 6 章中学习过的。您可以选择自己插入这些隐式修饰符，也可以让编译器为您插入。\n\
  \n以下列表包含了考试中需要的接口隐式修饰符：\n\n- 接口是隐式的抽象类（abstract）。\n- 接口变量是隐式的公有的（public）、静态的（static）且最后的（final）。\n\
  - 没有方法体的接口方法是隐式的抽象的（abstract）。\n- 没有 `private` 修饰符的接口方法是隐式的公共（public）。\n\n最后一条规则适用于\
  \ `abstract`、`default` 和 `static` 接口方法，我们将在下一节介绍。\n\n让我们来看一个示例。以下两个接口定义是等价的，因为编译器会将它们都转换为第二种声明：\n\
  \n```java\npublic interface Soar {\n    int MAX_HEIGHT = 10;\n    final static boolean\
  \ UNDERWATER = true;\n    void fly(int speed);\n    abstract void takeoff();\n \
  \   public abstract double dive();\n}\n\npublic abstract interface Soar {\n    public\
  \ static final int MAX_HEIGHT = 10;\n    public final static boolean UNDERWATER\
  \ = true;\n    public abstract void fly(int speed);\n    public abstract void takeoff();\n\
  \    public abstract double dive();\n}\n```\n\n在这个示例中，我们用**粗体**标记了编译器自动插入的隐式修饰符。\n\
  \n## 冲突的修饰符\n\n如果开发者将方法或变量标记为与隐式修饰符冲突符会发生什么？例如，如果一个抽象方法是隐式的 `public`，它可以被显式地标记为\
  \ `protected` 或 `private` 吗？\n\n```java\npublic interface Dance {\n    private int\
  \ count = 4;  // 无法编译\n    protected void step();  // 无法编译\n}\n```\n\n这两个接口成员声明都无法编译，因为编译器将对两者都应用\
  \ `public` 修饰符，导致冲突。\n\n## 接口与抽象类的区别\n\n尽管抽象类和接口都被视为抽象类型，但只有接口使用了隐式修饰符。在以下两个定义中\
  \ `play()` 方法有何区别？\n\n```java\nabstract class Husky {     // 需要 abstract 修饰符\n \
  \   abstract void play();  // 需要 abstract 修饰符\n}\n\ninterface Poodle {         //\
  \ abstract 修饰符可选\n    void play();           // abstract 修饰符可选\n}\n```\n\n这两个方法定义都被认为是抽象的。尽管如此，如果\
  \ `play()` 方法没有被标记为 `abstract`，则 `Husky` 类将无法编译；而 `Poodle` 接口中的方法无论是否标记 `abstract`\
  \ 修饰符都可以编译。\n\n那么 `play()` 方法的访问级别又是呢？你能发现以下使用我们抽象类型的类定义中存在什么问题吗？\n\n```java\npublic\
  \ class Webby extends Husky {\n    void play() {}      // play() 在 Husky 中被声明为包访问权限（package\
  \ access）\n}\n\npublic class Georgette implements Poodle {\n    void play() {} \
  \   // 无法编译 - play() 在 Poodle 中是 public 的\n}\n```\n\n`Webby` 类可以编译，但 `Georgette`\
  \ 类不能。尽管两个方法的实现完全相同，但 `Georgette` 类中的方法将方法的访问修饰符从 `public` 降低到了包访问权限。\n\n## 声明具体的接口方法\n\
  \n表 7.1 列出了考试中需要需要的六种接口成员类型。我们已经涵盖了抽象方法和常量，因此在本节中我们关注剩余的四个具体方法。\n\n在表 7.1 中，成员类型决定了如何访问它。成员类型为\
  \ `class` 的方法在接口的所有实例间共享，而成员类型为 `instance` 的方法与特定实例关联。\n\n| | 成员类型 | 需要的修饰符 | 隐式修饰符\
  \ | 有值或方法体？ |\n| --- | --- | --- | --- | --- |\n| 常量变量 | Class | | public static\
  \ final | 是 |\n| 抽象方法 | Instance | | public abstract | 否 |\n| default 方法 | Instance\
  \ | | default public | 是 |\n| 静态方法 | Class | | static public | 是 |\n| 私有方法 | Instance\
  \ | | private | 是 |\n| 私有静态方法 | Class | | private static | 是 |\n\n## 保护或包成员？\n\n\
  接口不支持 `protected` 成员，因为类不能扩展接口。它们也不支持包访问成员，可能是出于语法原因和向后兼容性。由于没有访问修饰符的接口方法是隐式的 `public`，更改这种行为将破坏许多现有程序。\n\
  \n## 编写 default 方法\n\n考试中你应该熟悉的第一种具体方法类型是 `default` 方法。`default` 方法是接口中定义的、带有 `default`\
  \ 关键字并包含方法体的方法。它可以被实现它的类可选地重写。\n\n`default` 方法的一个用途是向后兼容。您可以向接口添加新的 `default` 方法，而无需修改所有实现接口的现有类。旧类将直接使用方法的默认实现。这就是\
  \ default 方法名称的由来！\n\n以下是接口中定义的 `default` 方法的示例：\n\n```java\npublic interface IsColdBlooded\
  \ {\n    boolean hasScales();\n    default double getTemperature() {\n        return\
  \ 10.0;\n    }\n}\n```\n\n这个示例定义了两个接口方法，一个抽象的，一个默认的。以下 `Snake` 类实现了 `IsColdBlooded`，必须实现\
  \ `hasScales()`。它可以依赖 `getTemperature()` 的默认实现，也可以用自己的版本重写该方法：\n\n```java\npublic\
  \ class Snake implements IsColdBlooded {\n    public boolean hasScales() { // 强制重写\n\
  \        return true;\n    }\n    public double getTemperature() { // 可选重写\n   \
  \     return 12.2;\n    }\n }\n```\n\n![](img/image_rsrc10B8.jpg)\n\n注意，接口 `default`\
  \ 方法修饰符与 switch 中使用的 `default` 标签不同。同样，尽管包访问有时被称为默认访问，但该功能是通过省略访问修饰符来实现的。如果这让你感到困惑，深表歉意！我们同意\
  \ Java 多年来过度使用 default 这个词了！\n\n\n\n\n\n为了考试，你应该熟悉声明默认方法的各种规则。\n\n# 默认接口方法定义规则\n\
  \n1. 默认方法只能在接口内部声明。\n2. 默认方法必须标记有 `default` 关键字并包含方法体。\n3. 默认方法是隐式公有（public）的。\n\
  4. 默认方法不能被标记为 `abstract`、`final` 或 `static`。\n5. 默认方法可以被实现接口的类重写。\n6. 如果一个类继承了两个或多个具有相同方法签名的默认方法，则该类必须重写该方法。\n\
  \n第一条规则让你感到安心，因为你只会在接口中看到默认方法。如果你在考试的类或枚举中看到它们，说明出问题了。第二条规则仅关于语法，因为默认方法必须使用 `default`\
  \ 关键字。例如，以下代码段将无法编译，因为它们混淆了具体的接口方法和抽象方法：\n\n```java\npublic interface Carnivore\
  \ {\n    public default void eatMeat();      // 无法编译\n    public int getRequiredFoodAmount()\
  \ {  // 无法编译\n        return 13;\n    } \n}\n```\n\n接下来的三条默认方法规则源于它们与抽象接口方法的关系。与抽象接口方法一样，默认方法是隐式\
  \ public。但与抽象方法不同，默认接口方法不能标记为 `abstract`，因为它们提供了方法体。它们也不能被标记为 `final`，因为它们的设计允许在实现接口的类中被重写，就像抽象方法一样。最后，它们不能标记为\
  \ `static`，因为它们与实现接口的类实例相关。\n\n## 继承重复的默认方法\n\n创建默认接口方法的最后一条规则需要解释。例如，以下代码会输出什么值？\n\
  \n```java\npublic interface Walk {\n    public default int getSpeed() { return 5;\
  \ }\n}\n\npublic interface Run {\n    public default int getSpeed() { return 10;\
  \ }\n}\n\npublic class Cat implements Walk, Run {}  // 无法编译\n```\n\n在这个示例中，`Cat`\
  \ 继承了两个 `getSpeed()` 默认方法，那么它使用哪一个呢？由于 `Walk` 和 `Run` 在 `Cat` 类中的用法被视为同级关系，尚不清楚应该输出\
  \ `5` 还是 `10`。在这种情况下，编译器会摊摊手说：“太难了，我放弃了！”并报错。\n\n不过，一切并非没有。如果实现接口的类重写了重复的默认方法，代码就能顺利编译。通过重写冲突的方法，消除了关于要调用哪个版本的方法的歧义。例如，以下对\
  \ `Cat` 的修改后的实现可以编译：\n\n```java\npublic class Cat implements Walk, Run {\n    public\
  \ int getSpeed() { return 1; }\n}\n```\n\n## 调用默认方法\n\n默认方法存在于任何继承了接口的对象上，而不是接口本身。换句话说，你应该将其看作一个可以可选重写的继承方法，而不是静态方法。考虑以下代码：\n\
  \n```java\npublic interface Dance {\n    default int getRhythm() { return 33; }\n\
  }\n\npublic class Snake implements Dance {\n    static void move() {\n        var\
  \ snake = new Snake();\n        System.out.print(snake.getRhythm());\n        System.out.print(Dance.getRhythm());\
  \ // 无法编译\n    } \n}\n```\n\n第一次调用 `getRhythm()` 可以编译，因为它是在 `Snake` 的一个实例上调用的。第二次调用无法编译，因为它不是静态方法，需要\
  \ `Dance` 的实例。\n\n在上一节中，我们展示了 `Cat` 类如何重写一对冲突的默认方法，但如果 `Cat` 类想要访问 `Walk` 或 `Run`\
  \ 中“隐藏”的 `getSpeed()` 版本呢？它仍然可以访问吗？可以的，但需要一些特殊的语法。\n\n```java\npublic class Cat\
  \ implements Walk, Run {\n    public int getSpeed() {\n        return 1;\n    }\n\
  \    public int getWalkSpeed() {\n        return Walk.super.getSpeed();\n    } \n\
  }\n```\n\n这是一个默认方法 `getSpeed()` 同时表现出实例方法和静态方法特性的领域。我们使用接口名称指定要调用的方法，但使用 `super`\
  \ 关键字表示我们遵循的是实例继承，而不是类继承。注意，调用 `Walk.this.getSpeed()` 是不起作用的。我们知道这有点困惑，但考试你需要熟悉这种语法。\n\
  \n# 声明静态接口方法\n\n接口也可以包含静态方法。这些方法使用 `static` 关键字显式定义，在大多数情况下，它们的行为与类中定义的静态方法完全一致。\n\
  \n### 静态接口方法定义规则\n\n1. 静态方法必须标记有 `static` 关键字并包含方法体。\n2. 没有访问修饰符的静态方法是隐式 public\
  \ 的。\n3. 静态方法不能被标记为 `abstract` 或 `final`。\n4. 静态方法不被继承，在实现接口的类中，如果没有接口名称引用则无法访问。\n\
  \n这些规则基于你目前对类、接口和静态方法的了解。例如，你不能声明没有方法体的静态方法。与默认和抽象接口方法一样，如果声明时没有访问修饰符，静态方法是隐式 public\
  \ 的。如你所见，静态方法可以使用 `private` 修饰符。让我们来看静态方法：\n\n```java\npublic interface Hop {\n\
  \    static int getHeight() {\n        return 8;\n    }\n}\n```\n\n由于该方法在定义时没有访问修饰符，编译器会自动插入\
  \ `public` 修饰符。`getHeight()` 方法 own 就像类中的静态方法一样。换句话说，不需要类实例即可访问。\n\n```java\npublic\
  \ class Skip implements Hop {\n    public int skip() {\n        return Hop.getHeight();\n\
  \    }\n}\n```\n\n关于继承的最后一条规则可能有点困惑，让我们来看一个例子。以下是一个实现了 `Hop` 但无法编译的类 `Bunny`：\n\n\
  ```java\npublic class Bunny implements Hop {\n    public void printDetails() {\n\
  \        System.out.println(getHeight()); // 无法编译\n    }\n}\n```\n\n如果没有接口名称的引用，代码无法编译，即使\
  \ `Bunny` 实现了 `Hop`。这可以通过接口名称轻松修复：\n\n```java\npublic class Bunny implements Hop\
  \ {\n    public void printDetails() {\n        System.out.println(Hop.getHeight());\n\
  \    }\n}\n```\n\n注意，我们没有遇到继承两个默认方法时遇到过的问题。Java 通过不允许静态方法被继承来“解决”静态方法的多继承问题！\n\n\
  \n\n\n\n你可以通过将 `checkTime()` 方法的内容复制到所有使用它的地方，在不使用私有方法的情况下编写此接口。如果不这样做，代码会短得多且更容易读！既然\
  \ Java 的作者们足够好心地为了我们的便利添加了这个功能，我们何不用用它呢！\n\n![](img/image_rsrc10B8.jpg)\n\n在上一个示例中，我们也可以将\
  \ `checkTime()` 声明为 `public`，但会将该方法暴露给接口之外。封装的一个重要原则是：在不需要时不要暴露类或接口的内部实现机制。我们将在本章稍后的部分介绍封装。\n\
  \n非静态私有方法与静态方法之间的区别，类似于类中声明的实例方法与静态方法之间的区别。具体来说，这在于每个方法可以从哪些地方被调用。\n\n## 私有接口方法的定义规则\n\
  \n1. 私有接口方法必须标记为 `private` 修饰符，并包含方法体。\n2. 私有静态接口方法可以被接口定义内部的任何方法调用。\n3. 私有接口方法只能被接口定义中的默认方法和其他私有非静态方法调用。\n\
  \n另一种思考方式是，私有接口方法仅对接口内部定义的非静态方法可见。而，私有静态接口方法可以被接口中的任何方法访问。对于这两种私有方法，继承接口的类都不能直接调用它们。\n\
  \n### 复习接口成员\n\n我们通过表 7.2 结束对接口成员的讨论，该表显示了接口内外成员的访问规则。\n\nTABLE 7.2 接口成员访问\n\n|\
  \ | 可从接口内部的默认和私有方法访问吗？ | 可从接口内部的静态方法访问吗？ | 可从继承接口类的方法访问吗？ | 在没有接口实例的情况下访问吗？ |\n\
  | --- | --- | --- | --- | --- |\n| 常量变量 | 是 | 是 | 是 | 是 |\n| 抽象方法 | 是 | 否 | 是 |\
  \ 否 |\n| 默认方法 | 是 | 否 | 是 | 否 |\n| 静态方法 | 是 | 是 | 是 (需要接口名) | 是 (需要接口名) |\n| 私有方法\
  \ | 是 | 否 | 否 | 否 |\n| 私有静态方法 | 是 | 是 | 否 | 否 |\n\n虽然表 7.2 看起来需要记住很多内容，但这里有一些针对考试的快速技巧：\n\
  \n*   将抽象、默认和非静态私有方法视为属于接口的实例。\n*   将静态方法和变量视为接口类对象。\n*   所有类型的私有接口方法都仅在接口声明内部可见。\n\
  \n使用这些规则，下列方法中哪些无法编译？\n\n```java\npublic interface ZooTrainTour {\n    abstract\
  \ int getTrainName();\n    private static void ride() {}\n    default void playHorn()\
  \ { getTrainName(); ride(); }\n    public static void slowDown() { playHorn(); }\n\
  \    static void speedUp() { ride(); }\n}\n```\n\n`ride()` 方法是私有且静态的，因此可以被接口声明内的任何默认或静态方法访问。`getTrainName()`\
  \ 是抽象的，因此可以由关联实例的默认方法访问。然而`slowDown()` 方法是静态的，在没有显式引用对象的情况下，无法调用默认或私有方法（如 `playHorn()`）。因此，`slowDown()`\
  \ 方法无法编译。\n\n给自己鼓鼓掌！你刚刚学习了许多关于接口的知识，可能比你想的要多。现在深呼吸。准备好了吗？我们将涵盖的下一个类型是枚举（enums）。\n\
  \n## 使用枚举\n\n在编程中，通常有一种类型只能有一组有限的数值，例如星期几、季节、原色等。枚举（enumeration），简称为 `enum`，就像一组固定的常量。\n\
  \n使用 `enum` 比使用一组常量好得多，因为它提供了类型安全检查。使用数值或 `String` 常量，你可以传递一个无效值且直到运行时才会发现。使用枚举，在不引入编译器错误的情况下，创建一个无效的枚举值是不可能的。\n\
  \n每当你有一组类型在编译时已知的项目时，枚举就会出现。常见的例子包括指南方向、月份、太阳系中的行星以及扑牌（嗯，考虑到冥王星的行星地位被撤销，可能不包括太阳系行星）。\n\
  \n### 创建简单枚举\n\n要创建一个 `enum`，请使用 `enum` 关键字声明一个类型、一个名称和值列表，如图 7.4 所示。\n\n我们将仅包含值列表的枚举称为简单枚举。在处理简单枚举时，列表末尾的分号是可选的。请保留\
  \ `Season` 枚举，因为我们在整个本节中都会用到它。\n\n![简单枚举的示例结构。变量是 public 或包访问权限，enum 关键字，enum 名称，简单枚举的分号是可选的，以及冬、春、夏、秋的枚举值。](img/image_rsrc10CP.jpg)\n\
  \nFIGURE 7.4 定义简单枚举\n\n![](img/image_rsrc10B8.jpg)\n\n枚举值被视为常量，通常使用蛇形命名法（snake_case）编写。例如，一个声明冰淇淋口味的枚举可能包含\
  \ `VANILLA`、`ROCKY_ROAD`、`MINT_CHOCOLATE_CHIP`等值。\n\n使用枚举非常简单。\n\n```java\nvar s\
  \ = Season.SUMMER;\nSystem.out.println(Season.SUMMER); // SUMMER\nSystem.out.println(s\
  \ == Season.SUMMER); // true\n```\n\n你不能做的一件事是扩展枚举。\n\n```java\npublic enum ExtendedSeason\
  \ extends Season {} // 无法编译\n\n### 调用常用的枚举方法\n\n枚举提供了 `values()` 方法来获取所有值的数组。你可以像使用普通数组一样使用它，包括在\
  \ for-each 循环中。此外，每个枚举值包含两个方法：`name()` 和 `ordinal()`。以下显示了三个方法：\n\n```java\nfor(var\
  \ season: Season.values()) {\n    System.out.println(season.name() + \" \" + season.ordinal());\n\
  }\n```\n\n`ordinal()` 方法返回一个整数，表示其在枚举中声明的顺序：\n* WINTER 0\n* SPRING 1\n* SUMMER 2\n\
  * FALL 3\n\n通常情况下，如果你坚持人类可读的枚举值而不是 `ordinal()` 值，代码会更容易读。你还无法直接比较整数和枚举值，因为枚举值是一个对象。\n\
  \n```java\nif (Season.SUMMER == 2) {} // 无法编译\n```\n\n枚举提供了一个实用的 `valueOf()` 方法，用于从\
  \ `String` 转换为枚举值。这在处理旧代码或解析用户输入时非常有用。不过，传入的 `String` 必须与枚举值完全匹配。\n\n```java\nSeason\
  \ s = Season.valueOf(\"SUMMER\"); // SUMMER\nSeason t = Season.valueOf(\"summer\"\
  ); // IllegalArgumentException\n```\n\n第一条语句执行成功并将正确的枚举值分配给 `s`。注意，这一行并没有创建枚举值，至少不是直接创建。每个枚举值在枚举首次加载时创建一次。一旦枚举已加载，它就会检索与匹配名称的单个枚举值。\n\
  \n第二个语句遇到了问题。没有小写名称 summer 的枚举值。Java 投降了手，并抛出了 `IllegalArgumentException`。\n\n###\
  \ 在 switch 语句中使用枚举\n\n\n\n\n\n正如我们在第 3 章“做决策”中所看到的，枚举（enums）可以用于 `switch` 语句和表达式。枚举有一个独特的属性，即如果处理了所有的枚举值，则在详尽的\
  \ `switch` 中不需要默认分支（default branch）。\n\n```java\nString getWeather(Season value)\
  \ {\n    return switch (value) {\n        case SUMMER        -> \"Too hot\";\n \
  \       case Season.WINTER -> \"Too cold\";\n        case SPRING, FALL  -> \"Just\
  \ right\";        \n    };\n}\n```\n\n也可以添加默认分支，但不是必须的，只要所有值都被处理即可。还要注意，在每个 `case`\
  \ 子句中，枚举的名称 `Season` 现在是可选的。在 Java 之前的版本中，不允许使用枚举名称。\n\n虽然每个枚举值都有一个对应的序数值（ordinal\
  \ value），但它不能直接用在 `case` 子句中。例如，以下代码无法编译：\n\n```java\nString getWeather(Season value)\
  \ {\n    return switch (value) {\n        case SUMMER -> \"Too hot\";\n        case\
  \ 0      -> \"Too cold\";  // 无法编译\n        default -> \"Just right\";\n    };\n\
  }\n```\n\n### 处理复杂枚举\n\n虽然简单的枚举仅由一个值列表组成，但我们可以定义一个带有额外元素的复杂枚举。假设我们的动物园想要跟踪流量模式，以确定哪个季节的游客最多。\n\
  \n```java\ninterface Visitors { \n    void printVisitors(); \n}\n\nenum SeasonWithVisitors\
  \ implements Visitors {\n    WINTER(\"Low\"), SPRING(\"Medium\"), SUMMER(\"High\"\
  ), FALL(\"Medium\");\n\n    private final String visitors;\n    public static final\
  \ String DESCRIPTION = \"Weather\";\n\n    private SeasonWithVisitors(String visitors)\
  \ {\n        System.out.print(\"constructing,\");\n        this.visitors = visitors;\n\
  \    }\n\n    @Override \n    public void printVisitors() {\n        System.out.println(visitors);\n\
  \    }\n}\n```\n\n这里有几点需要注意。在第 23 行，枚举值列表以分号结束。虽然对于简单枚举可选可选，但如果枚举中包含任何内容，它是必须的。第\
  \ 25–33 行是普通的 Java 代码。我们有实例变量和静态变量（第 25–26 行）、一个构造函数（第 27–30 行）和一个方法（第 31–33 行）。\n\
  \n![](img/image10B.jpg)\n\n你可能注意到，在我们的枚举示例中，值列表首先。这并不是偶然。对于复杂枚举（以及显而简单的枚举），值列表始终在前面。\n\
  \n### 创建枚举变量\n\n枚举声明可以同时包含静态变量和实例变量。在 `SeasonWithVisitors` 实现中（第 25–26 行），我们将变量标记为\
  \ `final`，这样我们的枚举属性就无法被修改。虽然可以创建一个带有可修改实例变量的枚举，但是一种非常糟糕的做法，因为它们在 JVM 中是共享的。在设计枚举值时，它们应该是不可变的。\n\
  \n### 声明枚举构造函数\n\n所有枚举构造函数都是隐式的 `private`，该修饰符是可选的。这是合理的，因为你不能扩展枚举，且构造函数只能在枚举内部被调用。事实上，如果枚举构造函数包含\
  \ `public` 或 `protected` 修饰符，它将无法编译。\n\n```java\npublic SeasonWithVisitors(String\
  \ visitors) { // 无法编译\n```\n\n`SeasonWithVisitors` 第 23 行上的所有括号是怎么？那些是构造函数调用，但没有使用用于对象的\
  \ `new` 关键字。当我们第一次请求任何枚举值时，Java 会构造所有的枚举值。此后，Java 仅返回已经构造好的枚举值。\n\n根据这个解释，你可以看到为什么这段代码只调用了一次每个构造函数：\n\
  \n```java\nSystem.out.print(\"begin,\");\nvar firstCall = SeasonWithVisitors.SUMMER;\
  \ // 打印 4 次\nSystem.out.print(\"middle,\");\nvar secondCall = SeasonWithVisitors.SUMMER;\
  \ // 什么都不打印\nSystem.out.print(\"end\");\n```\n\n此程序打印以下内容：\n`begin,constructing,constructing,constructing,middle,end`\n\
  \n如果 `SeasonWithVisitors` 枚举在程序更早的地方使用（因此初始化更早），那么声明 `firstCall` 变量的行将不会打印打印。\n\n\
  ### 编写枚举方法\n\n像类一样，枚举可以包含静态和实例方法。枚举甚至可以实现接口，正如我们在 `SeasonWithVisitors` 的第 21–22\
  \ 行所示。我们在第 31 行包含了 `@Override` 注解，以明确它是被继承的方法。\n\n我们如何调用枚举实例方法？这也很简单：我们只需要使用枚举值，后跟方法调用即可。\n\
  \n`SeasonWithVisitors.SUMMER.printVisitors()`\n\n有时你想为每个枚举定义不同的方法。例如，我们的动物园有不同的季节开放时间。冬季天气寒冷，黑得早。我们可以通过实例变量来跟踪时间，或者我们可以让每个枚举值自己管理时间。\n\
  \n```java\npublic enum SeasonWithTimes {\n    WINTER {\n        public String getHours()\
  \ { return \"10am-3pm\"; }\n    },\n    SPRING {\n        public String getHours()\
  \ { return \"9am-5pm\"; }\n    },\n    SUMMER {\n        public String getHours()\
  \ { return \"9am-7pm\"; }\n    },\n    FALL {\n        public String getHours()\
  \ { return \"9am-5pm\"; }\n    };\n\n    public abstract String getHours();\n}\n\
  ```\n\n这里发生了什么？看起来像我们创建了一个抽象类和许多小型子类。在某种程度上，枚举本身有一个抽象方法。这意味着每个枚举值都要求实现它。如果我们忘记为某个值实现方法，我们会得到编译错误：\n\
  `常量 WINTER 必须实现抽象方法 getHours()`\n\n但如果我们不想每个枚举值都有方法呢？没问题。我们可以为所有值创建一个实现，只对特殊情况进行重写。这看起来更好。我们只为特殊情况编写，让其他的使用枚举提供的实现。\n\
  \n![](img/image10A.jpg)\n\n因为枚举有很多方法并不意味着它应该这样做。尽量保持你的枚举简单。如果你的枚举超过了两个屏幕长度，它可能太长了。\n\
  \n## 密封类 (Sealing Classes)\n\n密封类是一种限制其他类可以扩展它的类。\n\n### 声明密封类\n\n让我们从一个简单的示例开始。密封类声明了可以扩展它的类列表，而子类则声明它们扩展该密封类。图\
  \ 7.5 声明了一个带有两个子类的密封类。\n\n图 7.5 包含了你在考试中熟悉的三个关键字。\n\n![Java 脚本中密封类的示例结构。变量为 sealed\
  \ 关键字、class 关键字、permits 关键字、允许的类列表、extends 密封类以及 final、sealed 或 non-sealed 子类修饰符。](img/image10CR.jpg)\n\
  \n### 密封类关键字\n\n*   `sealed`: 表明类或接口只能被命名的类或接口扩展/实现\n*   `permits`: 与 `sealed` 关键字一起使用，列出允许的类和接口\n\
  *   `non-sealed`: 应用于扩展密封类的类或接口，表示它可以被未指定的类扩展\n\n到到目前为止都挺简单的，对吧？考试同样可能测试你密封类不能用于哪些地方。例如，你能看出为什么以下两组声明都无法编译吗？\n\
  \n\n\n\n\n```java\npublic class sealed Frog permits GlassFrog {} // 无法编译\n\npublic\
  \ final class GlassFrog extends Frog {}\n\npublic abstract sealed class Mammal permits\
  \ Wolf {}\n\npublic final class Wolf extends Mammal {}\n\npublic final class Tiger\
  \ extends Mammal {} // 无法编译\n```\n\n第一个示例无法编译，因为 `class` 和 `sealed` 修饰符的顺序错误。修饰符必须放在类类型之前。第二个示例无法编译是因为\
  \ `Tiger` 没有在 `Mammal` 的声明中列出。\n\n![](img/image_rsrc10B8.jpg)\n\n密封类（Sealed classes）通常使用\
  \ `abstract` 修饰符声明，尽管这并不是要求的。\n\n使用 `sealed` 修饰符声明密封类是简单的。在大多数情况下，如果你在考试中遇到关于密封类的问题，它们是在测试你是否知道子类是否正确地扩展了密封类。为了应对考试，你还需要了解一些重要的规则，所以请仔细阅读接下来的章节。\n\
  \n## 编译密封类\n\n假设我们创建了一个 `Penguin` 类，并在没有其他源代码的情况下，在一个新的包中编译它。基于此考虑，以下代码可以编译吗？\n\n\
  ```java\n// Penguin.java\npackage zoo;\n\npublic sealed class Penguin permits Emperor\
  \ {}\n```\n\n不，不能编译！为什么？答案是，密封类必须与其直接子类在同一个包中进行声明（并编译）。但是子类本身呢？它们必须必须扩展（extend）该密封类。例如，以下两个声明无法编译：\n\
  \n```java\n// Penguin.java\npackage zoo;\n\npublic sealed class Penguin permits\
  \ Emperor {} // 无法编译\n\n// Emperor.java\npackage zoo;\n\npublic final class Emperor\
  \ {}\n```\n\n尽管声明了 `Emperor` 类，但它并没有扩展 `Penguin` 类。\n\n![](img/image_rsrc10B8.jpg)\n\
  \n等一下，还有更多内容！在第 12 章“模块”中，你将学习到命名模块（named modules），它允许密封类及其直接子类位于不同的包中，只要它们处于处于同一个命名模块中即可。\n\
  \n## 指定子类修饰符\n\n虽然某些类型（如接口）具有特定数量的隐式修饰符，但密封类没有。每个直接扩展密封类的类必须精确指定以下三个修饰符之一：`final`、`sealed`\
  \ 或 `non-sealed`。记住这个规则，考试用！\n\n### 创建 final 子类\n\n我们将查看的第一个可以应用于密封类直接子类的修饰符是 `final`\
  \ 修饰符。仅包含 `final` 子类的密封类拥有一组固定的类型，这类似于具有固定值集合的 `enum`（枚举）。\n\n```java\npublic sealed\
  \ class Antelope permits Gazelle {}\n\npublic final class Gazelle extends Antelope\
  \ {}\n\npublic class DamaGazelle extends Gazelle {} // 无法编译\n```\n\n就像普通类一样，`final`\
  \ 修饰符阻止了子类 `Gazelle` 被进一步扩展。\n\n### 创建 sealed 子类\n\n接下来，让我们来看一个使用 `sealed` 修饰符的示例：\n\
  \n```java\npublic sealed class Fish permits ClownFish {}\n\npublic sealed class\
  \ ClownFish extends Fish permits OrangeClownFish {}\n\npublic final class OrangeClownFish\
  \ extends ClownFish {}\n```\n\n应用到子类 `ClownFish` 的 `sealed` 修饰符意味着必须存在与应用于父类 `Fish`\
  \ 相同的规则。也就是说，`ClownFish` 定义了自己的允许的子类列表。注意在这个示例中，`OrangeClownFish` 是 `Fish` 的间接子类，但没有在\
  \ `Fish` 类中命名。\n\n尽管允许不在 `Fish` 中命名的间接子类，但可以继承 `Fish` 的类列表在编译时仍然是固定。如果你有一个 `Fish`\
  \ 对象的引用，它必须是 `Fish`、`ClownFish` 或 `OrangeClownFish`。\n\n### 创建 non-sealed 子类\n\n\
  `non-sealed` 修饰符用于向潜在未知的子类开放密封父类。\n\n```java\nabstract sealed class Mammal permits\
  \ Feline {}\n\nnon-sealed class Feline extends Mammal {}\n\nclass Tiger extends\
  \ Feline {}\n```\n\n在这个示例中，我们能够创建一个 `Mammal` 的间接子类（`Tiger`），它没有在 `Mammal` 的声明中命名。此外注意\
  \ `Tiger` 不是 `final`，因此它可以被任何子类扩展，例如 `BengalTiger`。\n\n```java\nclass BengalTiger\
  \ extends Tiger {}\n```\n\n乍看之下，这可能有点违背直觉。毕竟，我们能够创建未在 `Mammal` 中声明的 `Mammal` 子类。那么\
  \ `Mammal` 还是密封的吗？是的，但归功于多态。任何 `Tiger` 或 `BengalTiger` 的实例也是 `Feline` 的实例，而 `Feline`\
  \ 在 `Mammal` 的声明中被命名。我们将在本章节末尾讨论多态。现在，你只需要理解 `Mammal` 对于 `Feline` 及其子类是密封的。\n\n\
  ![](img/image_rsrc10BA.jpg)\n\n如果你仍然担心通过 `non-sealed` 子类过度地开放密封类，请记住，编写密封类的人可以在编译时看到所有直接子类的声明。他们可以决定是否允许该\
  \ `non-sealed` 子类。\n\n## 省略 permits 子句\n\n到目前为止，你看到的所有示例在声明密封类时都需要 `permits` 子句，但情况并非总是如此。假设你有一个\
  \ `Snake.java` 文件，其中定义了两个顶层类：\n\n```java\n// Snake.java\npublic sealed class Snake\
  \ permits Cobra {}\n\nfinal class Cobra extends Snake {}\n```\n\n在这种情况下，`permits`\
  \ 子句是可选的，可以省略。不过，子类中仍然需要 `extends` 关键字：\n\n```java\n// Snake.java\npublic sealed\
  \ class Snake {}\n\nfinal class Cobra extends Snake {}\n```\n\n如果这些类在不同的文件中，这段代码将无法编译！要省略\
  \ `permits` 子句，声明必须在同一个文件中。\n\n如果子类是嵌套的，`permits` 子句也可以省略。\n\n```java\npublic sealed\
  \ class Snake {\n    final class Cobra extends Snake {}\n}\n```\n\n我们很快会介绍嵌套类。现在，你只需要知道嵌套类是类内部的类，并且省略规则也适用于嵌套类。表\
  \ 7.3 是这些情况的方便参考。\n\n### 表 7.3 密封类中 permits 子句的使用\n\n| 直接子类的位置 | permits 子句 |\n\
  | --- | --- |\n| 在密封类的不同文件中 | 必须 |\n| 与密封类在同一个文件中 | 允许，但不需要 |\n| 嵌套在密封类内部 | 允许，但不需要\
  \ |\n\n### 引用嵌套子类\n\n虽然省略嵌套子类的 `permits` 子句会让代码更易读，但你也可以命名它们。然而，语法可能与你预期的不同。\n\n\
  ```java\npublic sealed class Snake permits Cobra { // 无法编译\n    final class Cobra\
  \ extends Snake {}\n}\n```\n\n这段代码无法编译，是因为 `Cobra` 需要对 `Snake` 命名空间的引用。以下修复此问题：\n\
  \n```java\npublic sealed class Snake permits Snake.Cobra {\n    final class Cobra\
  \ extends Snake {}\n}\n```\n\n当所有的子类都是嵌套的时，我们强烈建议省略 permits 类。\n\n## 密封接口\n\n除了类，接口也可以是密封的。这种思想与类相似，许多规则也适用。例如，密封接口必须与其直接扩展或实现它的类或接口出现在同一个包或命名模块中。\n\
  \n密封接口的一个独特之处是 `permits` 列表可以应用于实现接口的类或扩展接口的接口。\n\n```java\n// 密封接口\npublic sealed\
  \ interface Swims permits Duck, Swan, Floats {}\n\n// 允许实现密封接口的类\npublic final class\
  \ Duck implements Swims {}\n\npublic final class Swan implements Swims {}\n\n//\
  \ 允许扩展密封接口的接口\npublic non-sealed interface Floats extends Swims {}\n```\n\n\n\n\n\
  扩展密封接口（sealed interface）的接口允许哪些修饰符？记住，接口是隐式抽象的，不能标记为 `final`。因此，扩展密封接口的接口只能被标记为\
  \ `sealed` 或 `non-sealed`。它们不能被标记为 `final`。\n\n### 在密封类上应用模式匹配\n\n回想第 3 章，`switch`\
  \ 现在支持模式匹配。想象一下，如果我们通过应用模式匹配，在 `switch` 中像对待枚举一样对待密封类会会怎样。嗯，我们可以做到！给定一个包含两个直接子类的密封类\
  \ `Fish`：\n\n```java\nabstract sealed class Fish permits Trout, Bass {}\nfinal class\
  \ Trout extends Fish {}\nfinal class Bass extends Fish {}\n```\n\n我们可以定义一个不需要 `default`\
  \ 子句的 `switch` 表达式：\n\n```java\npublic String getType(Fish fish) {\n    return switch\
  \ (fish) {\n        case Trout t -> \"Trout!\";\n        case Bass b -> \"Bass!\"\
  ;\n    };\n}\n```\n\n这之所以可行是因为 `Fish` 是 `abstract` 且 `sealed` 的，并且所有可能的子类都已处理。如果我们移除\
  \ `Fish` 声明中的 `abstract` 修饰符，那么该 `switch` 表达式将无法编译。作为一个给读者的练习，请尝试找出有多少种不同的方法可以修改\
  \ `switch` 表达式，使其能够再次编译。\n\n与枚举一样，确保如果 `switch` 使用带有模式匹配的密封类，则所有可能的类型都已覆盖，或者包含一个\
  \ `default` 子句。\n\n### 复习密封类规则\n\n在考试中任何你看到密封类时，请密切关注子类的声明和修饰符。\n\n### 密封类规则\n\n\
  - `sealed` 类使用 `sealed` 和 `permits` 修饰符声明。\n- `Sealed` 类必须与它们的直接子类在同一个包或同一个命名模块中声明。\n\
  - `sealed` 类的直接子类必须标记为 `final`、`sealed` 或 `non-sealed`。对于扩展密封接口的接口，只允许 `sealed`\
  \ 和 `non-sealed` 修饰符。\n- 如果 `sealed` 类及其直接子类在同一个文件中声明，或者子类嵌套在密封类内部，则 `permits` 子句是可选的。\n\
  - 接口可以是 `sealed` 的，以限制实现它们的类或扩展它们的接口。\n\n## 使用 Record 封装数据\n\nRecord 是非常有用的工具，用于创建面向数据的类，这些类可以消除大量的样板代码。在介绍\
  \ Record 之前，了解它们为什么被添加到语言中的背景会有帮助，因此我们从封装开始。\n\n### 理解封装\n\n`POJO` 代表 Plain Old\
  \ Java Object（纯旧 Java 对象），是一种用于数据建模和传递数据的类，通常带有很少或没有复杂的方法（因此有了定义中的“纯旧”部分）。你可能也听过\
  \ `JavaBean`，它是应用了一些额外规则的 `POJO`。\n\n让我们创建一个带有两个字段的简单 `POJO`：\n\n```java\npublic\
  \ class Crane {\n    int numberEggs;\n    String name;\n    public Crane(int numberEggs,\
  \ String name) {\n        this.numberEggs = numberEggs;\n        this.name = name;\n\
  \    }\n}\n```\n\n噢糟糕，字段是包访问权限的。我们为什么要关心这个？这意味着同一包中类外部的人可以更改这些值，并创建如下无效数据：\n\n```java\n\
  public class Poacher {\n    public void badActor() {\n        var mother = new Crane(5,\
  \ \"Cathy\");\n        mother.numberEggs = -100;\n    }\n}\n```\n\n这显然是不好的。我们不希望母鹤\
  \ `Crane` 拥有负数的蛋！封装来救场。封装是一种保护类成员的方法，通过限制对这些成员的访问。在 Java 中，通常通过将所有实例变量声明为 `private`\
  \ 来实现。调用者要求使用方法来获取或修改实例变量。\n\n封装是为了保护类免受意外使用。它还允许我们以后修改类的方法和行为，而不会导致有人已经直接访问类内部的实例变量。例如，我们可以更改实例变量的数据类型，但保持相同的方法签名。通过这种方式，我们对类的内部运行机制保持完全的控制。\n\
  \n让我们来看看新封装的（且不可变的）`Crane` 类：\n\n```java\n1:  public final class Crane {\n2:   \
  \   private final int numberEggs;\n3:      private final String name;\n4:      public\
  \ Crane(int numberEggs, String name) {\n5:          if (numberEggs >= 0) this.numberEggs\
  \ = numberEggs;  // 守卫\n6:          else throw new IllegalArgumentException();\n\
  7:          this.name = name;\n8:      }\n9:      public int getNumberEggs() { \
  \           // getter\n10:         return numberEggs;\n11:     }\n12:     public\
  \ String getName() {               // getter\n13:         return name;\n14:    \
  \ }\n15: }\n```\n\n注意，实例变量现在第 2 行和第 3 行是 `private` 的。这意味着只有类内部的代码可以读取或写入它们的值。由于我们编写了这个类，我们很知道不要设置负数的蛋。我们在第\
  \ 9-11 行添加了一个方法来读取该值，这被称为访问器方法或 getter。\n\n你可能已经注意到我们将类及其实例变量都标记为 `final`，并且我们没有任何变变器方法（或\
  \ setters）来修改实例变量的值。这是因为我们希望我们的类不仅是封装良好的，而且是不可变的。正如你在第 6 章中看到的，不可变对象模式是一种面向对象的设计模式，其中对象在创建后无法被修改。与其修改对象，不如创建一个新对象。\n\
  \n```java\npublic class Vet {\n     String name = \"Dr Rogers\";\n    private intExperience\
  \ = 25;\n}\n```\n\n### 应用 Record\n\n我们的 `Crane` 类有 15 行长。我们可以更简洁地编写它，如图 7.6](#cA43.xhtml_a063）所示。先不考虑构造函数中\
  \ `numberEggs` 的守卫语句，这个 record 是等效且不可变的！\n\n![Java 脚本中 record 定义的示例结构。变量是 record\
  \ 关键字、record 名称、字段列表以及可选的构造函数和常量。EBEBPS/image_src10CS.))\n\n[  7.6 cA43.xhtml_a05U)\
  \ 定义一个 record\n\n哇！它只有一行长！record 是一种特殊的面向数据的类，编译器在其中为你插入了样板代码。\n\n事实上，编译器插入的内容比我们之前写的\
  \ 14 行要多得多。作为额外奖励，编译器插入了 `Object` 方法 `equals()`、`hashCode()` 和 `toString()` 的有用实现。我们在一行代码中涵盖了大量内容！\n\
  \n现在想象一下我们有 10 个数据字段而不是 2 个。那是我们省去编写的大量方法。我们还没有讨论构造函数呢！更糟糕的是每每有人更改一个字段时，几十行相关代码可能都需要更新。例如，name\
  \ 可能会在构造函数、`toString()`、`equals()` 方法等中使用。如果我们的应用程序中有数百个 POJO，record 可以为我们节省宝贵的时间。\n\
  \n创建一个 `Crane` 实例并打印某些字段是简单的：\n\n```java\nvar mommy = new Crane(4, \"Cammy\");\n\
  \nSystem.out.println(mommy.numberEggs());  // 4\n\nSystem.out.println(mommy.name());\
  \       // Cammy\n```\n\n\n\n\n这里有几点需要注意。首先，我们从未在 `Crane` 声明中定义过任何构造函数或方法。编译器是如何知道该做什么的？在后台，它会为你创建一个构造函数，其参数顺序与记录声明中出现的顺序相同。遗漏或更改类型顺序会导致编译器错误：\n\
  \n```java\nvar mommy1 = new Crane(\"Cammy\", 4);  // 无法编译\nvar mommy2 = new Crane(\"\
  Cammy\");     // 无法编译\n```\n\n对于每个字段，它还会创建一个以字段名命名的访问器（accessor），并加上一组括号。与传统的 POJO\
  \ 或 JavaBeans 不同，这些方法没有 `get` 或 `is` 前缀。仅仅少这几个字符，记录就为你省去了手动输入的麻烦！最后，记录还自动为你重写了 `Object`\
  \ 类中的许多方法。\n\n### 自动添加到记录的成员\n\n*   **构造函数**：一个参数顺序与记录声明完全相同的构造函数。\n*   **访问器方法**：每个字段对应一个访问器。\n\
  *   `equals()`：一个用于比较两个元素的方法，如果每个字段在 `equals()` 方面都相等，则返回 `true`。\n*   `hashCode()`：一个使用所有字段的一致性\
  \ `hashCode()` 方法。\n*   `toString()`：一个 `toString()` 实现，以一种方便且易于阅读的格式打印记录的每个字段。\n\
  \n以下展示了新方法的示例。请记住，`println()` 方法会自动对传递给它的任何对象调用 `toString()` 方法调用：\n\n```java\n\
  var father = new Crane(0, \"Craig\");\nSystem.out.println(father);             \
  \  // Crane[numberEggs=0, name=Craig]\n\nvar copy = new Crane(0, \"Craig\");\nSystem.out.println(copy);\
  \                 // Crane[numberEggs=0, name=Craig]\nSystem.out.println(father.equals(copy));\
  \  // true\nSystem.out.println(father.hashCode() + \", \" + copy.hashCode()); //\
  \ 1007, 1007\n```\n\n这就是记录的基础知识。我们称之为“基础”，是因为正如你将在后续章节中看到的，你可以对它们做更多操作。\n\n![](img/image_rsrc10B8.jpg)\n\
  \n考虑到我们对 `Crane` 的单行声明，想象一下编写一个等效类需要多少代码和工作。它可能轻松占据 40 多行！尝试编写记录所提供的所有方法可能是一个有趣的练习。\n\
  \n冷知识：拥有一个不包含任何字段的记录是合法的。它只需要用 `record` 关键字和括号来声明：\n\n```java\npublic record Crane()\
  \ {}\n```\n\n这并不是你在自己的代码中会使用的类型，但它可能会出现在考试中。\n\n### ### 声明构造函数\n\n如果你需要像之前那样声明一个带有某些守卫条件（guards）的记录怎么办？在本节中，我们将介绍使用记录实现此点的两种方法。\n\
  \n### 长构造函数 (The Long Constructor)\n\n首先，我们可以直接声明编译器通常自动插入的构造函数，我们将其称为“长构造函数”。\n\
  \n```java\npublic record Crane(int numberEggs, String name) {\n    public Crane(int\
  \ numberEggs, String name) {\n        if (numberEggs < 0) throw new IllegalArgumentException();\n\
  \        this.numberEggs = numberEggs;\n        this.name = name;\n    }\n}\n```\n\
  \n如果你以相同的参数列表和相同的顺序定义了一个构造函数，编译器就不会再插入一个。由于每个字段都是 `final` 的，构造函数必须设置每个字段。例如，这个记录无法编译：\n\
  \n```java\npublic record Crane(int numberEggs, String name) {\n    public Crane(int\
  \ numberEggs, String name) {}  // 无法编译\n}\n```\n\n虽然能够声明构造函数是记录的一个很棒特性，但它存在问题。如果我们有\
  \ 20 个字段，我们需要为每一个字段声明赋值，这引入了我们正想要消除的样板代码。噢，麻烦！\n\n### 紧凑构造函数 (Compact Constructors)\n\
  \n幸运的是，Java 的作者增加了为记录定义紧凑构造函数的能力。紧凑构造函数是一种特殊的构造函数类型，用于简洁地处理验证和转换。它不接受参数并隐式地设置所有字段。图\
  \ 7.7 显示了紧凑构造函数的示例。\n\n![紧凑构造函数的示例结构。变量是紧凑构造，没有括号或构造函数参数、守卫条件、输入参数引用，并在紧凑构造函数末尾隐式调用长构造函数。](img/image_rsrc10CT.jpg)\n\
  \n图 7.7 声明紧凑构造函数\n\n太棒了！现在我们可以检查想要的值，而不需要列出所有的构造函数参数和琐碎的赋值。Java 将在紧凑构造函数之后执行完整的构造函数。你应该也记住紧凑构造函数是不带括号声明的，因为考试可能会在这里考难你。如图\
  \ 7.7 所示，正如我们在下一节中进一步讨论的，我们还可以转换构造函数参数。\n\n### 转换参数\n\n紧凑构造函数提供了对任何输入值进行转换的机会。看看你能看出这是做什么的：\n\
  \n```java\npublic record Crane(int numberEggs, String name) {\n    Crane {\n   \
  \     if (name == null || name.length() < 1)\n            throw new IllegalArgumentException();\n\
  \        name = name.substring(0, 1).toUpperCase() + name.substring(1).toLowerCase();\n\
  \    }\n}\n```\n\n虽然紧凑构造函数可以修改参数，但它们不能修改字段。例如，以下代码无法编译：\n\n```java\npublic record\
  \ Crane(int numberEggs, String name) {\n    Crane {\n        this.numberEggs = 10;\
  \ // 无法编译\n    }\n}\n```\n\n![](img/image_rsrc10BA.jpg)\n\n### 重载构造函数 (Overloaded\
  \ Constructors)\n\n你还可以创建接受不同参数列表的重载构造函数。它们与长构造函数相关，并且不使用紧凑构造函数的特性。\n\n```java\n\
  public record Crane(int numberEggs, String name) {\n    public Crane(String firstName,\
  \ String lastName) {\n        this(0, firstName + \" \" + lastName);\n    }\n}\n\
  ```\n\n重载构造函数的第一行必须通过 `this()` 显式调用另一个构造函数。如果没有其他构造函数，则必须调用长构造函数。这与你在第 6 章](#c8ZW.xhtml)中学到的不同，在那里调用\
  \ `super()` 或 `this()` 是可选的。此外，与紧凑构造函数不同，你只能在第一行转换数据。第一行之后，所有字段都已赋值，对象是不可变的。\n\n\
  ```java\npublic record Crane(int numberEggs, String name) {\n    public Crane(int\
  \ numberEggs, String firstName, String lastName) {\n        this(numberEggs + 1,\
  \ firstName + \" \" + lastName);\n        numberEggs = 10; // 无影响（作用于参数而非实例字段）\n\
  \        this.numberEggs = 20; // 无法编译\n    }\n}\n```\n\n\n\n\n正如你所看到的，`record`\
  \ 没有 setter 方法。每个字段本质上都是 `final` 的，在构造函数中写入后就无法再修改。要“修改”一个 `record`，你必须创建一个新对象并复制所有你想保留的数据。\n\
  \n```java\nvar cousin = new Crane(3, \"Jenny\");\nvar friend = new Crane(cousin.numberEggs(),\
  \ \"Janeice\");\n```\n\n就像接口是隐式抽象的一样，`record` 也是隐式 `final` 的。`final` 修饰符是可选的，但会被认为是存在的。\n\
  \n```java\npublic final record Crane(int numberEggs, String name) {}\n```\n\n像枚举（enum）一样，这意味着你不能扩展或继承\
  \ `record`。\n\n```java\npublic record BlueCrane() extends Crane {}  // 无法编译\n```\n\
  \n同样像枚举一样，`record` 可以实现普通接口或密封接口（sealed），只要它实现了所有的抽象方法。\n\n```java\npublic interface\
  \ Bird {}\npublic record Crane(int numberEggs, String name) implements Bird {}\n\
  ```\n\n虽然 `record` 的实例成员是 `final` 的，但 `static` 成员并不要求是 `final`。例如，下面的代码定义了一个不可变的\
  \ `record`，每当创建一个 `record` 时，`static` 值就会更新一次。\n\n```java\npublic record WhoopingCrane(String\
  \ name, int position) {\n    private static int counter = 0;\n    public WhoopingCrane(String\
  \ name) {\n        this(name, counter++);\n    }\n}\n```\n\n![](img/image_rsrc10BA.jpg)\n\
  \n尽管这已经超出了本书的范围，但使数据导向类变为不可变有很多很好的理由。这样做可以产生更不容易出错的代码，因为每次修改数据都会建立一个新的对象。它还让类本质上是线程安全的，并且可以在并发框架中使用。\n\
  \n### 在 Record 中模式匹配\n\n`record` 是 Java 21 的新特性，已经更新以支持模式匹配。起初你可能会认为这并不是什么新东西。毕竟，我们在\
  \ Java 17 中就可以配合模式匹配使用 `record`。这个新功能实际上关于 `record` 的成员，而不是 `record` 本身。让我们尝试一个例子：\n\
  \n```java\nrecord Monkey(String name, int age) {}\n\npublic class Zoo {\n    public\
  \ static void main(String[] args) {\n        Object animal = new Monkey(\"George\"\
  , 3);\n        if(animal instanceof Monkey(String name, int myAge)) {\n        \
  \    System.out.println(\"Hello \" + name);\n            System.out.println(\"Your\
  \ age is \" + myAge);\n        } \n    }\n}\n```\n\n等等，第 8 行发生了什么？看起来我们像是重新声明了 `record`\
  \ 的定义。别担心，我们并没有！但我们所做的是定义了一个与 `Monkey` `record` 兼容的模式。我们还命名了两个元素：`name` 和 `myAge`。就像你在第\
  \ 3 章看到的模式匹配一样，这允许我们在第 9 行和第 10 行将它们作为局部变量使用，而不需要引用变量。\n\n对于考试，在处理模式匹配和 `record`\
  \ 时，你应该注意以下规则：\n\n*   如果包含了 `record` 中声明的任何字段，则所有字段都必须包含在。\n*   字段的顺序必须与 `record`\
  \ 中的顺序一致。\n*   字段的名称不需要匹配。\n*   在编译时，字段的类型必须与 `record` 中声明的类型兼容。\n*   如果 `record`\
  \ 支持各种类型的元素，则模式在运行时可能无法匹配。\n\n处理 `record` 和模式匹配的操作与强制类型转换（casting）有一些相似之处。例如，编译器会禁止它认为无效的操作。不过，也存在一些差异，我们稍后会讲。\n\
  \n测试时间！给定我们之前的 `Monkey` `record`，以下哪些行代码无法编译？\n\n```java\nif(animal instanceof Monkey\
  \ myMonkey) {}\nif(animal instanceof Monkey(String n, int a) myMonkey) {}\nif(animal\
  \ instanceof Monkey(String n, long a)) {}\nif(animal instanceof Monkey(Object n,\
  \ int a)) {}\n```\n\n第一个示例是可以编译的，因为这只是我们在第 3 章看到的简单模式匹配。然而，第 12 行无法编译。你可以为 `record`\
  \ 或其字段命名，但不能兼者兼顾。第 13 行也无法编译，因为不支持数值提升（numeric promotion）。最后一行可以编译，因为 `String` 与\
  \ `Object` 兼容。\n\n### 匹配 Record\n\n关于 `record` 匹配的最后两条规则值得进一步讨论。`record` 的模式匹配包括同时匹配\
  \ `record` 的类型和每个字段的类型。在给定这五个模式匹配语句的情况下，下面的代码会打印什么？\n\n```java\nrecord Fish(Object\
  \ type) {}\npublic class Veterinarian {\n    public static void main(String[] args)\
  \ {\n        Fish f1 = new Fish(\"Nemo\");\n        Fish f2 = new Fish(Integer.valueOf(1));\n\
  \        if(f1 instanceof Fish(Object t)) {\n            System.out.print(\"Match1-\"\
  );\n        }\n        if(f1 instanceof Fish(String t)) {\n            System.out.print(\"\
  Match2-\");\n        }\n        if(f1 instanceof Fish(Integer t)) {\n          \
  \  System.out.print(\"Match3-\");\n        }\n        if(f2 instanceof Fish(String\
  \ t)) {\n            System.out.print(\"Match4-\");\n        }\n        if(f2 instanceof\
  \ Fish(Integer x)) {\n            System.out.print(\"Match5\");\n        } \n  \
  \  }\n}\n```\n\n第一个和第二个模式匹配语句匹配，因为 \"Nemo\" 分别可以转换为 `Object` 和 `String`。第三个语句通过但无法匹配，因为\
  \ \"Nemo\" 不能转换为 `Integer`。第四个语句通过但无法匹配，因为整数无法转换为 `String`。最后一条语句匹配，因为两者的类型都是 `Integer`。代码可以编译并输出：Match1-Match2-Match5\n\
  \n如果我们把 `Fish` 的声明改为如下内容会发生什么？\n\n```java\nrecord Fish(Integer type)\n```\n\n首先，第\
  \ 4 行定义的 `f1` 将不再可以编译！如果我们修复了变量声明，第 10 行和第 16 行无法编译。\n\n#### 嵌套 Record 模式\n\n如果一个\
  \ `record` 包含了其他 record，你可以可选地匹配 record 中的值。准备好看到它是如何工作的了吗？让我们从两个 `record` 开始。\n\
  \n```java\nrecord Bear(String name, List<String> favoriteThings) {}\nrecord Couple(Bear\
  \ a, Bear b) {}\n```\n\n现在假设我们在方法中定义了一个 `Couple` 实例。\n\n```java\nvar c = new Couple(new\
  \ Bear(\"Yogi\", List.of(\"PicnicBaskets\")), new Bear(\"Fozzie\", List.of(\"BadJokes\"\
  )));\n```\n\n以下哪些模式匹配语句可以通过？\n\n```java\nif(c instanceof Couple(Bear a, Bear b))\
  \ {\n    System.out.print(a.name() + \" \" + b.name());\n}\nif(c instanceof Couple(Bear(String\
  \ firstName, List<String> f), Bear b)) {\n    System.out.print(firstName + \" \"\
  \ + b.name());\n}\nif(c instanceof Couple(Bear(String name, List<String> f1), Bear(String\
  \ name, List<String> f2))) {\n    System.out.print(name + \" \" + name); // 变量重名\n\
  }\n```\n\n第一个模式匹配语句通过并使用了 `Couple` 而没有展开嵌套的 `Bear` record。第二个示例展开了第一个 `Bear` record，使\
  \ `firstName` 和 `b` 成为模式匹配语句中的局部变量。第三个模式匹配语句无法编译。虽然你可以展开两个 record，但必须给它们不同的名称。我们可以这样修复：\n\
  \n```java\nif(c instanceof Couple(Bear(String name1, List<String> f1), Bear(String\
  \ name2, List<String> f2))) {\n    System.out.print(name1 + \" \" + name2);\n}\n\
  ```\n\n#### 使用 var 和泛型匹配 Record\n\n你也可以在模式匹配的 `record` 中使用 `var`。让我们将其应用于之前的示例中。\n\
  \n```java\nvar c = new Couple(new Bear(\"Yogi\", List.of(\"PicnicBaskets\")), new\
  \ Bear(\"Fozzie\", List.of(\"BadJokes\")));\nif (c instanceof Couple(var a, var\
  \ b)) {\n    System.out.print(a.name() + \" \" + b.name());\n}\nif (c instanceof\
  \ Couple(Bear(var firstName, List<String> f), var b)) {\n    System.out.print(firstName\
  \ + \" \" + b.name());\n}\n```\n\n\n\n如你所见，你可以用 `var` 任何元素引用类型。当 `var` 用于记录的某个元素时，编译器会假设该类型与记录中的类型完全匹配。\n\
  \n记录中的泛型模式匹配遵循与泛型方法重载相似的规则。如果你以前没见过泛型重载，请不要担心，我们将在第 9 章“集合与泛型”中介绍这一内容。不过，让我们尝试几个示例，看看考试可能会向你出哪些类的问题。以下每段代码都能顺利编译：\n\
  \n```java\nif(c instanceof Couple(Bear(var n, Object f), var b)) {}\nif(c instanceof\
  \ Couple(Bear(var n, List f), var b)) {}\nif(c instanceof Couple(Bear(var n, List<?>\
  \ f), var b)) {}\nif(c instanceof Couple(Bear(var n, List<? extends Object> f),\
  \ var b)) {}\nif(c instanceof Couple(Bear(var n, ArrayList<String> f), var b)) {}\n\
  ```\n\n然而这也是有限制的。例如，以下两个示例无法编译：\n\n```java\nif(c instanceof Couple(Bear(var n, List<>\
  \ f), var b)) {}\nif(c instanceof Couple(Bear(var n, List<Object> f), var b)) {}\n\
  ```\n\n第一个示例无法编译，是因为菱操作符 `<>` 不能用于模式匹配（同样无法用于泛型重载）。第二个示例无法编译，是因为 `List<Object>`\
  \ 与 `List<String>` 不兼容。由于类型擦除，如果这些类型被应用于继承方法的参数参数，同样也无法编译。同样，我们将在第 9 章中更详细地介绍泛型和类型擦除。\n\
  \n在这些示例中，请记住 `f` 是模式类型，而不是原始的 `List<String>`。基于此，你能推导出为什么这段代码无法编译吗？\n\n```java\n\
  if(c instanceof Couple(Bear(var n, List f), var b)\n    && f.getFirst().toLowerCase().contains(\"\
  p\")) {  // 无法编译\n    System.out.print(\"Yummy\");\n}\n```\n\n`f` 的引用类型是 `List`\
  \ 而不是 `List<String>`，因此 `f.getFirst()` 返回的是一个 `Object` 引用，而不是 `String` 引用。由于 `Object`\
  \ 上没有定义 `toLowerCase()` 方法，代码无法编译。要通过编译，你必须显式地将其强制转换为 `String`，或者使用不同的模式匹配类型。\n\n\
  ### 将模式匹配记录应用于 Switch\n\n你可以在 `switch` 中配合模式匹配和记录，这可能并不意外。规则与你已经学到的相同，我们只是将你在第 3\
  \ 章中学过的 `switch` 模式匹配规则与本章的内容结合在一起。\n\n假设我们有如下 `Snake` 记录：\n\n```java\nrecord Snake(Object\
  \ data) {}\n```\n\n接下来，让我们构造一个操作 `Snake` 实例的方法。\n\n```java\nlong showData(Snake\
  \ snake) {\n    return switch(snake) {\n        case Snake(Long hiss)      -> hiss\
  \ + 1;\n        case Snake(Integer nagina) -> nagina + 10;\n        case Snake(Number\
  \ crowley) -> crowley.intValue() + 100;\n        case Snake(Object kaa)      ->\
  \ -1;\n    };\n}\n```\n\n正如你可能在第 3 章中回想到的，如果模式匹配表达式涵盖了所有类型，则不需要 `default` 子句。根据这段代码，看看你能否跟随这些示例生成的输出：\n\
  \n```java\nSystem.out.println(showData(new Snake(1)));    // 11\nSystem.out.println(showData(new\
  \ Snake(2L)));   // 3\nSystem.out.println(showData(new Snake(3.0)));  // 103\n```\n\
  \n记住，对于任何相关的 `when` 子句，类型至关重要。例如，以下代码无法编译，因为 `kaa` 的类型是 `Object`，它没有 `doubleValue()`\
  \ 方法：\n\n```java\nlong showData(Snake snake) {\n    return switch(snake) {\n   \
  \     case Snake(Object kaa) when kaa.doubleValue() > 0 -> -1;\n        default\
  \ -> 1_000;\n    };\n}\n```\n\n恭喜，你已经学习了考试所需的记录模式匹配的所有知识。由于这是一项新功能，预计至少会看到一道相关的题目！\n\
  \n### 自定义记录\n\n由于这是一项新功能，预计至少会看到一道相关的题目！（等一下，提供的文本此处有重复，我将处理提供的唯一逻辑内容）。\n\n记录可以包含某些成员：\n\
  *   重载的构造函数\n*   包括 `equals()`、`hashCode()`、`toString()` 在内的实例方法\n*   静态字段\n\n\n\
  \n内部类具有以下属性：\n\n- 可以声明为 `public`、`protected`、`package` 或 `private`\n- 可以继承一个类并实现接口\n\
  - 可以标记为 `abstract` 或 `final`\n- 可以访问外部类的成员，包括 `private` 成员\n\n最后一个属性非常酷。这意味着内部类可以在不进行任何特殊操作的情况下访问外部类中的变量。准备好用一种复杂的方式来打印三次\
  \ `Hi` 吗？\n\n```java\n1:  public class Home {\n2:      private String greeting =\
  \ \"Hi\";  // 外部类实例变量\n3:\n4:      protected class Room {             // 内部类声明\n\
  5:          public int repeat = 3;\n6:          public void enter() {\n7:      \
  \        for (int i = 0; i < repeat; i++) greet(greeting);\n8:          }\n9:  \
  \        private static void greet(String message) {\n10:             System.out.println(message);\n\
  11:         }\n12:     }\n13:\n14:     public void enterRoom() {          // 外部类的实例方法\n\
  15:         var room = new Room();         // 创建内部类实例\n16:         room.enter();\n\
  17:     }\n18:     public static void main(String[] args) {\n19:         var home\
  \ = new Home();         // 创建外部类实例\n20:         home.enterRoom();\n21: } }\n```\n\
  \n内部类的声明看起来和独立类的声明完全一样，只不过它恰好位于另一个类内部。第 7 行显示，内部类直接引用 `greeting` 就像它在 `Room` 类中可用一样。这之所以可行，是因为它实际上确实是可用的。尽管该变量是\
  \ `private` 的，但在同一个类内部是可以访问的。\n\n由于内部类不是 `static` 的，它必须使用外部类的实例来调用。这意味着你必须创建两个对象。第\
  \ 19 行创建了外部 `Home` 对象，而第 15 行创建了内部 `Room` 对象。注意的是，第 15 行不需要 `Home` 的显式实例，因为它是 `Home`\
  \ 内部的一个实例方法。这之所以可行，是因为 `enterRoom()` 是 `Home` 类中的实例方法。`Room` 和 `enterRoom()` 都是\
  \ `Home` 的成员。\n\n### 实例化内部类的实例\n\n另一种实例化 `Room` 的方法初看之下很奇怪。好吧，也许不只是初看如此。这种语法的使用频率不够高，导致人们很难习惯：\n\
  \n```java\n20:     public static void main(String[] args) {\n21:         var home\
  \ = new Home();\n22:         Room room = home.new Room();  // 创建内部类实例\n23:     \
  \    room.enter();\n24:     }\n```\n\n让我们仔细观察第 21 行和第 22 行。我们需要一个 `Home` 实例来创建 `Room`。我们不能直接在\
  \ `static main()` 方法中调用 `new Room()`，因为 Java 不知道它应该关联到哪个 `Home` 实例。Java 通过将 `new`\
