  \ `Reader` 或 `Writer`。\n\n### 17. B, C, E\n选项 B 和 C 是 NIO.2 的属性，也是使用它而不是 `java.io.File`\
  \ 类的良好理由。选项 A 是错误的，因为两个 API 只能删除空目录，不能删除目录树。使用视图（view）读取多个属性可以减少进程与文件系统之间的往返次数并获得更好的性能，使得选项\
  \ E 正确。视图可以访问 `Files` 方法中不可用的文件系统特定属性；因此，选项 D 是错误的。`Files` 是 NIO.2 的一部分，而 `File`\
  \ 是 `java.io` 的一部分，这意味着选项 F 是错误的。\n\n### 18. C\n首先，`P` 先被添加到 `StringBuilder` 中。接下来，假设支持\
  \ `mark()`，在 `E` 之前标记了流中的位置。`E` 被添加到 `StringBuilder` 中，跳过了 `AC`，然后 `O` 被添加到 `StringBuilder`\
  \ 中，跳过了 `CK`。然后流被 `reset()` 到 `E` 之前的位置。调用 `skip(0)` 什么都不做，因为没有字符需要跳过，所以在在下一次 `read()`\
  \ 调用中，`E` 被添加到 `StringBuilder` 中。打印出的值为 `PEOE`，选项 C 是正确的。选项 G 是错误的，因为 `mark()` 可能不受支持。\n\
  \n### 19. C\n代码可以编译并运行且没有问题，所以选项 G 是错误的。如果你简化冗余的路径符号，`p1` 和 `p2` 代表相同的路径 `/lizard/walking.txt`。因此，`isSameFile()`\
  \ 返回 `true`。第二个输出是 `false`，因为 `equals()` 检查路径值是否相同。最后，`mismatch()` 发现内容相同并返回 -1。由于这些原因，选项\
  \ C 是正确的。\n\n### 20. C\n`move()` 操作后的目标路径是 `/animals`，而不是 `/animals.txt`，所以 A 和\
  \ B 都是错误的。运行时都会抛出异常，因为 `/animals` 已经存在且是一个目录。`ATOMIC_MOVE` 意味着监控文件系统的进程不会看到不完整的文件，所以选项\
  \ C 是正确的。\n\n### 21. C\n代码可以编译并运行且没有问题，所以 D、E 和 F 是错误的。最重要的是 `find()` 方法的第二个参数指定的深度为\
  \ 0，这意味着被搜索的记录只有顶层目录。由于我们知道顶目录是目录而不是符号链接，因此不会访问其他路径，也不会打印任何内容。由于这些原因，选项 C 是正确答案。\n\
  \n### 22. G\n代码可以通过编译，所以选项 F 是错误的。要被序列化，类必须实现 `Serializable` 接口，Zebra 类是这样做的。它还必须包含标记为\
  \ `transient` 或可序列化的实例成员。实例成员 `stripes` 的类型为 `Object`，它是不可序列化的。如果 `Object` 实现了 `Serializable`，那么所有对象默认都是可序列化的，这违背了\
  \ `Serializable` 接口的意义。因此，Zebra 类是不可序列化的，在序列化时程序会抛出异常，使得选项 G 正确。如果从类中删除 `stripes`，选项\
  \ A 和 D 将是正确答案，因为 `name` 和 `age` 都标记为 `transient`。\n\n### 23. A, D\n代码编译没有问题，所以\
  \ E 和 F 是错误的。`toRealPath()` 方法会将路径简化为 `/animals`，如果它不存在则抛出异常，使得选项 D 正确。如果路径存在，对其调用\
  \ `getParent()` 将返回根目录。使用过滤表达式遍历根目录将打印根目录下所有的 `.java` 文件（以及目录树中所有的 `.java` 文件），使得选项\
  \ A 正确。选项 B 是错误的，因为它跳过了不以 `.java` 结尾的文件和目录。选项 C 也是错误的，因为 `Files.walk()` 默认不跟随符号链接。只有在提供了\
  \ `FOLLOW_LINKS` 选项并遇到循环时，才会抛出异常。\n\n\n\n\n\n## 24\nB. 该方法编译没有问题，因此选项 E 是错误的。选项\
