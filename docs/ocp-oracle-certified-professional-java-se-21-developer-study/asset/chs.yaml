  \n\n\nFIGURE 12.1 模块化系统设计\n\n现在让我们深入研究其中一个模块。图 12.2 显示了 `zoo.animal.talks` 模块内部的内容。该模块有三个包，每个包有两个类（这是一个小动物园）。还有一个名为\
  \ `module-info.java` 的特殊文件。该文件要求存在于所有模块中。我们将在本章后面的部分详细解释这一点。\n\n### 模块的优势\n\n模块看起来就像是你编程时需要了解的另一层内容。虽然使用模块是可选的，但理解它们旨在解决的问题是非常重要的。\n\
  \n*   **更好的访问控制**：除了第 5 章“方法”中涵盖的访问控制级别外，你还可以拥有仅允许模块内其他包访问的包。\n*   **更清晰的依赖管理**：由于模块指定了它们依赖的内容，Java\
  \ 可以在启动程序时就缺失的 JAR 包报错，而不是在运行时第一次访问时才报错。\n*   **自定义 Java 构建**：你可以创建一个只包含程序所需的 JDK\
  \ 部分的 Java 环境，而不是超过 150 MB 的完整版本。\n*   **改进的安全性**：由于你可以在自定义构建中省略 JDK 的部分，因此你不必担心在你不使用的部分中发现漏洞。\n\
  *   **改进的性能**：更小的 Java 包的另一个优点是缩短启动时间并降低对内存的需求。\n*   **唯一包强制**：由于模块指定了导出的包，Java\
  \ 可以确保每个包仅来自一个模块，并避免对运行内容的产生混淆。\n\n![图像展示了模块的内部视图。模型是 zoo.animal.talks，它包含了三个类：zoo.animal.talks.content、zoo.animal.talks.schedule\
  \ 和 zoo.animal.talks.media。功能性包是 module-info.java。](img/image_rsrc10DH.jpg)\n\n\
  FIGURE 12.2 深入模块内部\n\n## 创建和运行模块化程序\n\n在本节中，我们将创建、构建并运行 `zoo.animal.feeding` 模块。我们选择这一个作为开始是因为所有其他模块都依赖于它。图\
  \ 12.3 显示了该模块的设计。除了 `module-info.java` 文件外，它包含一个类类的包。\n\n在接下来的章节中，我们将创建、编译、运行并打包\
  \ `zoo.animal.feeding` 模块。\n\n![图像展示了 zoo.animal.feeding 的内容模块。它有两个类：zoo.animal.feeding\
  \ 的 task.java 和 module-info.java。](img/image_rsrc10DJ.jpg)\n\nFIGURE 12.3 zoo.animal.feeding\
  \ 的内容\n\n### 创建文件\n\n首先，我们有一个非常简单的类，在 `main()` 方法中打印一行内容。我们知道，这算不上什么实现。我们雇佣的所有程序员都可以用业务逻辑填充它。在本书书中，我们关注你考试需要知道的知识。所以，让我们创建一个简单的类。\n\
  \n```java\npackage zoo.animal.feeding;\n\npublic class Task {\n\n    public static\
  \ void main(String… args) {\n        System.out.println(\"All fed!\");\n    }\n\
  }\n```\n\n接下来是 `module-info.java` 文件。这是最简单的一个：\n\n```java\nmodule zoo.animal.feeding\
  \ {\n\n}\n```\n\n模块声明与普通 Java 类声明之间有几个关键区别：\n\n*   `module-info.java` 文件必须位于模块的根目录中。普通\
  \ Java 类应该放在包中。\n*   模块声明必须使用关键字 `module` 而不是 `class`、`interface` 或 `enum`。\n* \
  \  模块名遵循包名的命名规则。它在名称中通常包含点（`.`）。普通类名和包名不允许有连字符（`-`）。模块名也遵循相同的规则。\n\n对于这个最简单的文件来说，规则已经很多了。当我们在本章后面的部分充实该文件时，会有更多的规则。\n\
  \n下一步是确保文件位于正确的目录结构中。图 12.4 显示了预期的目录结构。![图像展示了 zoo.animal.feeding 模块的目录结构。逐步过程包括\
  \ mods、在 feeding 和 zoo、animal、feeding 之间的 module-info.java，以及逐一位于下方的 task.java。](img/image_rsrc10DK.jpg)\n\
  \nFIGURE 12.4  zoo.animal.feeding 目录结构\n\n特别地，`feeding` 是模块目录，`module-info.java`\
  \ 文件直接位于其下就像普通的 JAR 文件一样，我们也有 `zoo.animal.feeding` 包，名称的每个部分有一个子文件夹。`Task` 类位于其包相应的子文件夹中。\n\
  \n此外，注意我们在模块同级目录下创建了一个名为 `mods` 的目录。我们将在章节稍后的部分使用它来存储模块产物。该目录可以命名为任何名称，但 `mods`\
  \ 是常用名称。如果你在跟随在线代码示例，请注意 `mods` 目录。\n\n### 编译我们的第一个模块\n\n在运行模块化代码之前，我们需要编译它。除了 `module-path`\
  \ 选项外，这段代码看起来看起来第 1 章很熟悉：\n\n```bash\njavac --module-path mods\n    -d feeding\n\
  \    feeding/zoo/animal/feeding/*.java module-info.java\n```\n\n![](img/image_rsrc10B8.jpg)\n\
  \n在命令行输入命令时，它们应该全部写在一行。我们在书中使用换行是为了让命令更容易阅读和学习。\n\n### 关于 classpath\n\n`classpath`\
  \ 选项有三种可能的格式：`-cp`、`--class-path` 和 `classpath`。你仍然可以使用这些选项。事实上，在编写非模块化程序时这样做很常见。\n\
  \n（文本继续...）\n就像 `classpath` 一样，你可以在命令中使用缩写。语法 `--module-path` 和 `-p` 是等效的。这意味着我们可以在之前的命令位置许多许多命令。如果你选择\
  \ `-p`，以下命令是替代方案：\n\n```bash\njavac -p mods -d feeding\n    feeding/zoo/animal/feeding/*.java\
  \ feeding/*.java\n```\n\n```bash\njavac -p mods -d feeding\n    feeding/zoo.animal/feeding/*.java\
  \ module-info.java\n```\n\n```bash\njavac -p mods -d feeding\n    feeding/zoo.animal/feeding/Task.java\
  \ module-info.java\n```\n\n```bash\njavac -p mods -d feeding\n    feeding/zoo/animal/feeding/Task.java\
  \ feeding/*.java\n```\n\n虽然你可以使用你最喜欢的，但请确保你能够识别考试的所有有效格式。表 12.1 列出了编译模块时需要良好掌握的选项。传递给\
  \ `javac` 命令的选项还有，但这些是你预计可能会被测试的。\n\nTABLE 12.1 使用 javac 使用模块时所需的选项\n\n| 用途 | 缩写\
  \ | 完整形式 |\n| :--- | :--- | :--- |\n| 类文件目录 | `-d <dir>` | n/a |\n| 模块路径 | `-p <path>`\
  \ | `--module-path <path>` |\n\n### 构建模块\n\n即使没有模块，在真实项目中手动运行 `javac` 和 `java` 命令也是罕见的。它们会变得变得长且复杂。大多数开发者使用\
  \ Maven 或 Gradle 等构建工具。这些构建工具建议了放置类文件的目录，例如 `target/classes`。\n\n\n\n\n你可能只有在考试时才需要了解这些命令的语法。无论如何，概念本身是有用的。\n\
  \n请务必记住模块命令的语法。你将在考试中遇到这方面的测试。我们提供了许多关于语法的练习题来加深记忆。\n\n### 运行我们的第一个模块\n\n在打包模块之前，我们应该通过运行它来确保它可以工作正常。为了做到这一点，我们需要学习完整的语法。假设有一个名为\
  \ `book.module` 的模块。该模块内部有一个名为 `com.sybex` 的包，该包包含一个带有 `main()` 方法的类 `OCP`。图 12.5\
  \ 显示了运行模块的语法。请特别注意 `book.module/com.sybex.OCP` 部分。需要记住，你必须指定模块名，后面后跟一个斜杠（`/`），然后是完全限定类名。\n\
  \n![一个 Java 脚本中运行模块的示例结构。变量分别是模块的位置、模块或包的分隔符、类名、模块名和包名。](img/image_rsrc10DM.jpg)\n\
  \n图 12.5 使用 java 运行模块\n\n现在我们已经看到了语法，可以编写命令来运行 `zoo.animal.feeding` 包中的 `Task` 类。在接下来的示例中，包名和模块名是相同的。模块名与完整包名或其开头匹配是常见现象。\n\
  \n```\njava --module-path feeding\n   --module zoo.animal.feeding/zoo.animal.feeding.Task\n\
  ```\n\n由于你已经看到 `--module-path` 使用了 `-p` 的短形式，我们打赌你不会对发现 `--module` 也有短形式感到惊讶。短选项是\
  \ `-m`。这意味着以下命令是等价的：\n\n```\njava -p feeding\n   -m zoo.animal.feeding/zoo.animal.feeding.Task\n\
  ```\n\n在这些示例中，我们使用 `feeding` 作为模块路径，因为我们是在那里编译代码的。一旦我们打包并运行该模块，这种情况就会改变。\n\n表 12.2\
  \ 列出了使用 `java` 命令时需要了解的选项。\n\n表 12.2 使用 java 使用模块时需要了解的选项\n\n| 用途 | 缩写 | 完整形式 |\n\
  | :--- | :--- | :--- |\n| 模块名 | `-m <name>` | `--module <name>` |\n| 模块路径 | `-p\
  \ <path>` | `--module-path <path>` |\n\n### 打包我们的第一个模块\n\n如果模块只能在创建它的文件夹中运行，那么它没什么用。我们的下一步是打包它。在运行此命令之前，请确保创建一个\
  \ `mods` 目录：\n\n```\njar -cvf mods/zoo.animal.feeding.jar -C feeding/.\n```\n\n\
  这里没有任何模块特定的内容。我们正在打包 `feeding` 目录下的所有内容，并将其存储在 `mods` 文件夹下名为 `zoo.animal.feeding.jar`\
  \ 的 JAR 文件中。这代表了模块 JAR 对于想要它的其他代码的样子。\n\n现在让我们再次运行程序，但这次使用 `mods` 目录而不是散乱的类：\n\n\
  ```\njava -p mods\n   -m zoo.animal.feeding/zoo.animal.feeding.Task\n```\n\n你可能会注意到，这个命令与上一节中的命令完全相同，只是目录不同。在上一个示例中，它是\
  \ `feeding`。在这一次中，它是 `mods` 的模块路径。由于使用了模块路径，正在运行一个模块 JAR。\n\n## 更新我们的示例以包含多个模块\n\
  \n现在我们的 `zoo.animal.feeding` 模块已经稳固了，我们可以开始考虑其他模块了。正如图 12.6 所示，我们系统中的其他三个模块都依赖于\
  \ `zoo.animal.feeding` 模块。\n\n![一个关于 zoo.animal.feeding 的模块化系统图像。矩形框中有四个模型，分别是 zoo.animal.feeding、zoo.animal.care、zoo.animal.talks\
  \ 和 zoo.staff。每个模型都通过箭头标记连接。](img/image_rsrc10DN.jpg)\n\n图 12.6 依赖于 zoo.animal.feeding\
  \ 的模块\n\n### 更新喂养模块\n\n由于我们的其他模块将调用 `zoo.animal.feeding` 包中的代码，我们需要在模块声明中声明这一意图。\n\
  \n`exports` 指令用于指示模块意图让这些包被模块外的 Java 代码使用。正如你预期的那样，如果没有 `exports` 指令，该模块只能在命令行中独立运行。在接下来的示例中，我们导出了一个包：\n\
  \n```\nmodule zoo.animal.feeding {\n   exports zoo.animal.feeding;\n}\n```\n\n重新编译并重新打包模块将更新\
  \ `zoo.animal.feeding.jar` 文件内部的 `module-info.class`。这些是你之前运行过的相同 `javac` 和 `jar`\
  \ 命令：\n\n```\njavac -p mods\n   -d feeding\n   feeding/zoo/animal/feeding/*.java\
  \ feeding/module-info.java\n\njar -cvf mods/zoo.animal.feeding.jar -C feeding/ .\n\
  ```\n\n### 创建 Care 模块\n\n接下来，创建 `zoo.animal.care` 模块。这一次我们将有两个包。`zoo.animal.care.medical`\
  \ 和 `zoo.animal.care.details` 包。`zoo.animal.care.medical` 包包含一个带有 `main()` 方法的类\
  \ `OCP`（注：此处根据原文逻辑推断为类名）。\n\n这里的 `module.info.java` 如下：\n\n```\nmodule zoo.animal.care\
  \ {\n   exports zoo.animal.care.medical;\n   requires zoo.animal.feeding;\n}\n```\n\
  \n```java\n// HippoBirthday.java\npackage zoo.animal.care.details;\nimport zoo.animal.feeding.*;\n\
  public class HippoBirthday {\n   private Task task;\n}\n```\n\n```java\n// Diet.java\n\
  package zoo.animal.care.medical;\npublic class Diet { }\n```\n\n重新编译并重新打包模块：\n\n\
  ```\njavac -p mods\n   -d care\n   care/zoo/animal/care/details/*.java\n   care/zoo/animal/care/medical/*.java\n\
  \   care/module-info.java\n\njar -cvf mods/zoo.animal.care.jar -C care/\n```\n\n\
  ### 创建 Talks 模块\n\n到目前，我们在模块中用了一个 `exports` 和 `requires` 语句。现在你将学习如何处理多个包或需要多个模块。在图\
  \ 12.8 中，观察到 `zoo.animal.talks` 模块依赖两个模块：`zoo.animal.feeding` 和 `zoo.animal.care`。这意味着\
  \ `module-info.java` 文件中必须有两个 `requires` 语句。\n\n\n\n\n\n![zoo.animal.talks 上的模块化系统图像。矩形框中有四个模型，它们是\
  \ zoo.animal.feeding、zoo.animal.care、zoo.animal.talks 和 zoo.staff。每个模型都通过箭头标记连接。](img/image_rsrc10DR.jpg)\n\
  \nFIGURE 12.8 zoo.animal.talks 的依赖关系\n\n图 12.9 显示了该模块的内容。我们将导出此模块中的三个包。\n\n![一张图片说明了\
  \ zoo.animal.talks 的内容模块。它有四个类：zoo.animal.talks.content 下的 ElephantScript.java 和\
  \ SeaLionScript.java，zoo.animal.talks.media 下的 Announcement.java 和 Signage.java，zoo.animal.talks.schedule\
  \ 下的 Weekday.java 和 Weekend.java，以及 module-info.java。](img/image_rsrc10DS.jpg)\n\
  \nFIGURE 12.9 zoo.animal.talks 的内容\n\n首先，让我们来看 `zoo.animal.talks` 的 `module-info.java`\
  \ 文件：\n\n```java\n1: module zoo.animal.talks {\n2:     exports zoo.animal.talks.content;\n\
  3:     exports zoo.animal.talks.media;\n4:     exports zoo.animal.talks.schedule;\n\
  5:\n6:     requires zoo.animal.feeding;\n7:     requires zoo.animal.care;\n8: }\n\
  ```\n\n第 1 行显示模块名称。第 2–4 行允许其他模块引用所有三个包。第 6 和 7 行指定了该模块依赖的两个模块。\n\n然后我们有六个类，所示：\n\
  \n```java\n// ElephantScript.java\npackage zoo.animal.talks.content;\npublic class\
  \ ElephantScript { }\n\n// SeaLionScript.java\npackage zoo.animal.talks.content;\n\
  public class SeaLionScript { }\n\n// Announcement.java\npackage zoo.animal.talks.media;\n\
  public class Announcement {\n   public static void main(String[] args) {\n     \
  \  System.out.println(\"We will be having talks\");\n   }\n}\n\n// Signage.java\n\
  package zoo.animal.talks.media;\npublic class Signage { }\n\n// Weekday.java\npackage\
  \ zoo.animal.talks.schedule;\npublic class Weekday { }\n\n// Weekend.java\npackage\
  \ zoo.animal.talks.schedule;\npublic class Weekend {}\n```\n\n如果你仍在电脑上跟进操作，请在包中创建这些类。以下是编译和构建模块的命令：\n\
  \n```bash\njavac -p mods\n    -d talks\n    talks/zoo/animal/talks/content/*.java\
  \ talks/zoo/animal/talks/media/*.java\n    talks/zoo/animal/talks/schedule/*.java\
  \ talks/module-info.java\n\njar -cvf mods/zoo.animal.talks.jar -C talks/ .\n```\n\
  \n### 创建 Staff 模块\n\n我们的最后一个模块是 `zoo.staff`。图 12.10 显示内部只有一个包。我们不会在模块外部暴露这个包。\n\n\
  ![一张图片说明了 zoo.animal.staff 的内容模块。它有两个类：zoo.staff 的 Jobs.java 以及 module-info.java。](img/image_rsrc10DT.jpg)\n\
  \nFIGURE 12.10 zoo.staff 的内容\n\n根据图 12.11，你认为 `module-info.java` 中应该写什么吗？\n\n图 12.11\
  \ 中有三个箭头从 `zoo.staff` 指向其他模块。这些代表了所需的三个模块。由于 `zoo.staff` 不暴露任何包，因此没有 `exports` 语句。这为我们提供了以下结果：\n\
  \n```java\nmodule zoo.staff {\n   requires zoo.animal.feeding;\n   requires zoo.animal.care;\n\
  \   requires zoo.animal.talks;\n}\n```\n\n![zoo.staff 依赖关系上的模块化系统图像。矩形框中有四个模型，它们是\
  \ zoo.animal.feeding、zoo.animal.care、zoo.animal.talks 和 zoo.staff。每个模型都通过箭头标记连接。](img/image_rsrc10DU.jpg)\n\
  \nFIGURE 12.11 zoo.staff 的依赖关系\n\n在该模块中，我们在 `Jobs.java` 文件中有一个单类：\n\n```java\npackage\
  \ zoo.staff;\npublic class Jobs { }\n```\n\n对于那些在电脑上跟进操作的人，请在包中创建一个类。以下是编译和构建模块的命令：\n\
  \n```bash\njavac -p mods\n    -d staff\n    staff/zoo/staff/*.java staff/module-info.java\n\
  \njar -cvf mods/zoo.staff.jar -C staff/ .\n```\n\n## 深入研究模块声明\n\n### 导出包\n\n我们一直在讨论导出一个包。但这到底意味着什么？假设我们只需要访问权限。我们可以如下所示更新模块声明：\n\
  \n```java\nmodule zoo.animal.talks {\n   exports zoo.animal.talks.content;\n   exports\
  \ zoo.animal.talks.media;\n   exports zoo.animal.talks.schedule;\n   requires zoo.animal.feeding;\n\
  \   requires zoo.animal.care;\n}\n```\n\n我们已经看到 `exports` 是如何工作的。然而，我们只允许访问。\n\n\
  ### 导出类型\n\n我们一直在讨论导出一个包。但这到底意味着什么？所有公共的类、接口、枚举和记录都是导出的。此外，任何公共字段和方法都是可见的。\n\n私有字段是不可见的。同样，包的字段和方法也是不可见的。\n\
  \n`exports` 指令为我们提供了更多级别的访问控制。表 12.3 列出了完整的访问控制。\n\n### 传递性需要模块\n\n正如你在本章之前看到的，`requires\
  \ moduleName` 指定当前模块依赖于 `moduleName`。还有 `requires transitive moduleName`，这意味着需要该模块的任何模块也将依赖\
  \ `moduleName`。\n\n这听起来很绕。让我们来看一个例子。图 12.12 显示了模块，虚线表示冗余关系，实线表示 `module-info.java`\
  \ 中指定的关系。\n\n例如，`zoo.animal.talks` 依赖于 `zoo.animal.care`，而 `zoo.animal.care` 依赖于\
  \ `zoo.animal.feeding`。这意味着 `zoo.animal.talks` 和 `zoo.animal.feeding` 之间的箭头不再出现在图\
  \ 12.12 中。\n\n![传递性依赖的模块化系统图像。矩形框中有四个模型，它们是 zoo.animal.feeding、zoo.animal.care、zoo.animal.talks\
  \ 和 zoo.staff。zoo.staff - zoo.animal.talks - zoo.animal.care - zoo.animal.feeding\
  \ 用窄箭头连接。zoo.staff - zoo.animal.care、zoo.staff - zoo.animal.feeding 以及 zoo.animal.talks\
  \ - zoo.animal.feeding 用点状箭头连接。](img/image_rsrc10DV.jpg)\n\nFIGURE 12.12 我们的模块的传递性依赖版本\n\
  \n现在来看这四个模块声明。第一个模块保持不变。我们向任何使用该模块的包导出一个包。\n\n```java\nmodule zoo.animal.feeding\
  \ {\n   exports zoo.animal.feeding;\n}\n```\n\n\n\n\n`zoo.animal.care` 模块是改进的第一个契机。代码并没有强制所有剩余模块显式指定\
  \ `zoo.animal.feeding`，而是使用了 `requires transitive`。\n\n```java\nmodule zoo.animal.care\
  \ {\n   exports zoo.animal.care.medical;\n   requires transitive zoo.animal.feeding;\n\
  }\n```\n\n在 `zoo.animal.talks` 模块中，我们进行了类似的更改，并且不再强制其他模块指定 `zoo.animal.care`。我们也不再需要指定\
  \ `zoo.animal.feeding`，因此那行代码被注释掉了。\n\n```java\nmodule zoo.animal.talks {\n   exports\
  \ zoo.animal.talks.content to zoo.staff;\n   exports zoo.animal.talks.media;\n \
  \  exports zoo.animal.talks.schedule;\n   // no longer needed requires zoo.animal.feeding;\n\
  \   // no longer needed requires zoo.animal.care;\n   requires transitive zoo.animal.care;\n\
  }\n```\n\n最后，在 `zoo.staff` 模块中，我们可以删掉两个 `requires` 语句。\n\n```java\nmodule zoo.staff\
  \ {\n   // no longer needed requires zoo.animal.feeding;\n   // no longer needed\
  \ requires zoo.animal.care;\n   requires zoo.animal.talks;\n}\n```\n\n模块越多，`requires\
  \ transitive` 组合带来的益处就越大。对于调用者来说也更加方便。如果你尝试操作这个动物园，你只需要 `require zoo.staff`，剩余的依赖就会被自动推断。\n\
  \n### `requires transitive` 的效果\n\n根据我们新的模块声明，并结合图 12.12，对我们的 `zoo.animal.care`\
  \ 模块中的 `requires` 语句应用 `transitive` 修饰符会有什么效果？应用 `transitive` 修饰符具有以下效果：\n\n- `zoo.animal.talks`\
  \ 模块可以选择性声明它需要 `zoo.animal.feeding` 模块，但这不是强制要求的。\n- 如果没有访问 `zoo.animal.feeding`\
  \ 模块，`zoo.animal.care` 模块无法编译或执行。\n- 如果没有访问 `zoo.animal.care` 模块，`zoo.animal.talks`\
  \ 模块无法编译或执行。\n\n即使 `zoo.animal.care` 和 `zoo.animal.talks` 模块没有显式引用 `zoo.animal.feeding`\
  \ 模块中的任何包，这些规则依然有效。另一方面，如果没有在 `zoo.animal.care` 的模块声明中使用 `transitive` 修饰符，其他模块必须显式使用\
  \ `requires` 才能引用 `zoo.animal.feeding` 模块中的任何包。\n\n### 重复的 `requires` 语句\n\n考试可能会欺骗你的地方是混合使用\
  \ `requires` 和 `requires transitive`。你能想出这段代码无法编译的原因吗？\n\n```java\nmodule bad.module\
  \ {\n   requires zoo.animal.talks;\n   requires transitive zoo.animal.talks;\n}\n\
  ```\n\nJava 不允许在 `requires` 子句中重复同一个模块。这是冗余的，而且极可能是一个编码错误。记住 `requires transitive`\
  \ 相当于 `requires` 加上了一些额外的行为。\n\n### 开放包\n\nJava 允许调用者通过一种称为反射（reflection）的技术在运行时检查并调用代码。这是一种强大的方法，允许调用编译时可能不存在的代码。它甚至可以用于绕过访问控制！别担心——为了考试，你不需要知道如何使用反射编写代码。\n\
  \n`opens` 指令用于启用模块内包的反射。对于考试，你只需要知道 `opens` 指令存在即可，而不需要详细理解它。\n\n由于反射可能是危险的，如果开发者希望允许调用模块使用反射，模块系统要求他们在模块声明中显式地允许反射。以下示₺了展示了如何为\
  \ `zoo.animal.talks` 模块中的两个包启用反射功能：\n\n```java\nmodule zoo.animal.talks {\n   opens\
  \ zoo.animal.talks.schedule;\n   opens zoo.animal.talks.media to zoo.staff;\n}\n\
  ```\n\n第一个示例允许任何使用该模块的模块使用反射。第二个示例仅将该权限赋予 `zoo.staff` 模块。考试还需要你了解另外两个指令——`provides`\
  \ 和 `uses`——它们将在下一节中介绍。\n\n### ![](img/image_rsrc10BB.jpg) 现实世界场景\n\n### 开放整个模块\n\
  \n在上一个示例中，我们在 `zoo.animal.talks` 模块中开放了两个包，但假设我们想要为所有包开放反射。没问题。我们可以使用 `open` 模块修饰符，而不是\
  \ `opens` 指令（注意多了 s 的区别）：\n\n```java\nopen module zoo.animal.talks {\n\n}\n```\n\
  \n使用此模块修饰符，Java 知道我们希望模块中的所有包都是开放的。如果同时应用两者会发生什么？\n\n```java\nopen module zoo.animal.talks\
  \ {\n   opens zoo.animal.talks.schedule;  //无法编译\n}\n```\n\n这无法编译，因为使用 `open` 修饰符的模块被允许使用\
  \ `opens` 指令。毕竟，包已经是开放的了\n\n## 创建服务\n\n在本节中，你将学习如何创建一个服务。服务由一个接口、该接口引用的任何类以及一种查找接口实现的方法组成。实现类本身不是服务的一部分。\n\
  \n我们将使用一个旅游应用作为示例。服务在旅游应用中如图 12.12 所示![一张图片展示了四个模块。](img/image_rsrc10BB.jpg) 12.13\
  \ 模块在旅游应用中](OEBPS/image_rsrc10.jpg) 你并不需要四个独立的模块。服务提供接口在旅游应用中。为了说明这些概念，我们这样做。例如，服务提供接口和服务定位器可以在同一个模块中。\n\
  \n### 定义服务提供接口\n\n首先，`zoo.tours.api` 模块定义了一个名为 `Souvenir` 的 Java 对象。它是服务的一部分，因为它会被接口引用。\n\
  \n```java\n// Souvenir.java\npackage zoo.tours.api;\n\npublic record Souvenir(String\
  \ description) { }\n```\n\n接下来，模块包含一个 Java 接口类型。这个接口被称为接口，因为它指定了我们服务的行为。在这种情况下，它是具有三个方法的简单\
  \ API。\n\n```java\n// Tour.java\npackage zoo.tours.api;\n\npublic interface Tour\
  \ {\n   String name();\n   int length();\n   Souvenir getSouvenir();\n}\n```\n\n\
  所有三个方法都使用了隐式的 `public` 修饰符。由于我们在使用模块，我们还需要创建一个 `module-info.java` 文件，以便我们的模块导出包含接口的包。\n\
  \n```java\n// module-info.java\nmodule zoo.tours.api {\n   exports zoo.tours.api;\n\
  }\n```\n\n现在我们有了这两个文件，可以编译并打包该模块。\n\n```bash\njavac -d serviceProviderModule serviceProviderModule/zoo/tours/api/*.java\n\
  serviceProviderModule/module-info.java\n\njar -cvf mods/zoo.tours.api.jar -C serviceProviderModule\
  \ .\n```\n\n服务提供“接口”可以是抽象类，而不是真正的接口。由于你在考试中只会看到它是接口，我们在书中使用这个术语。\n\n回顾一下，服务包含了服务提供接口及其引用的支持类。服务还包含了查找功能，我们将在下一步定义。\n\
  \n### 创建服务定位器\n\n为了完成我们的服务，我们需要一个服务定位器。服务定位器可以找到实现服务提供接口的任何类。\n\n幸运的是，Java 提供了 `ServiceLoader`\
  \ 类来协助完成此任务。你将服务提供接口类型传递给 `load()` 方法，Java 就会返回它找到的所有实现服务。以下类展示了它的用法：\n\n```java\n\
  // TourFinder.java\npackage zoo.tours.reservations;\n\nimport java.util.*;\n\nimport\
  \ zoo.tours.api.*;\n```\n\n\n\n\n```java\npublic class TourFinder {\n\n    public\
  \ static Tour findSingleTour() {\n        ServiceLoader<Tour> loader = ServiceLoader.load(Tour.class);\n\
  \        for (Tour tour : loader)\n            return tour;\n        return null;\n\
  \    }\n\n    public static List<Tour> findAllTours() {\n        List<Tour> tours\
  \ = new ArrayList<>();\n        ServiceLoader<Tour> loader = ServiceLoader.load(Tour.class);\n\
  \        for (Tour tour : loader)\n            tours.add(tour);\n        return\
  \ tours;\n    }\n}\n```\n\n如你所见，我们提供了两个查找方法。第一个是一个便利方法，适用于你预期恰好返回一个 `Tour` 的情况。另一个方法返回一个\
  \ `List`，它可以容纳任意数量的服务提供者。在运行时，服务定位器可能会找到许多服务提供者（或者一个）。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n`ServiceLoader.load()` 的调用开销相对较大。如果你正在编写一个真实的应用程序，最好缓存该结果。\n\n我们的模块定义导出了包含查找类\
  \ `TourFinder` 的包。它需要服务提供者接口包。它还包含 `uses` 指令，因为它将查找服务。\n\n```java\n// module-info.java\n\
  module zoo.tours.reservations {\n    exports zoo.tours.reservations;\n    requires\
  \ zoo.tours.api;\n    uses zoo.tours.api.Tour;\n}\n```\n\n记住，`requires` 和 `uses`\
  \ 都是需要的，一个用于编译，一个用于查找。最后，我们编译并打包该模块。\n\n```bash\njavac -p mods -d serviceLocatorModule\n\
  \    serviceLocatorModule/zoo/tours/reservations/*.java\n    serviceLocatorModule/module-info.java\n\
  \njar -cvf mods/zoo.tours.reservations.jar -C serviceLocatorModule/ .\n```\n\n现在我们有了接口和查找逻辑，已经完成了我们的服务。\n\
  \n### 使用 ServiceLoader\n\n`ServiceLoader` 中有两个方法是你考试时需要掌握的。声明如下（不包含具体实现）：\n\n```java\n\
  public final class ServiceLoader<S> implements Iterable<S> {\n    public static\
  \ <S> ServiceLoader<S> load(Class<S> service) { … }\n    public Stream<Provider<S>>\
  \ stream() { … }\n    // Additional methods\n}\n```\n\n正如我们已经看到的，调用 `ServiceLoader.load()`\
  \ 返回的是一个可以正常遍历的对象。然而，请求一个 `Stream` 则会给你一个不同的类型。这是因为 `Stream` 控制了元素何时进行求值。因此，`ServiceLoader`\
  \ 返回的是 `Provider` 对象的 `Stream`。你必须调用 `get()` 来从每个 `Provider` 中获取你想要的值，如下例所示：\n\n\
  ```java\nServiceLoader.load(Tour.class)\n  .stream()\n  .map(Provider::get)\n  .mapToInt(Tour::length)\n\
  \  .max()\n  .ifPresent(System.out::println);\n```\n\n### 从消费者调用\n\n下一步是由消费者来调用服务定位器。消费者（或客户端）指的是一个获取并使用服务的模块。一旦消费者通过服务定位器获取了服务，它就能调用服务提供者接口所提供的方法。\n\
  \n```java\n// Tourist.java\npackage zoo.visitor;\n\nimport java.util.*;\nimport\
  \ zoo.tours.api.*;\nimport zoo.tours.reservations.*;\n\npublic class Tourist {\n\
  \    public static void main(String[] args) {\n        Tour tour = TourFinder.findSingleTour();\n\
  \        System.out.println(\"Single tour: \" + tour);\n        List<Tour> tours\
  \ = TourFinder.findAllTours();\n        System.out.println(\"# tours: \" + tours.size());\n\
  \    }\n}\n```\n\n我们的模块定义不需要知道关于实现的任何信息，因为 `zoo.tours.reservations` 正在处理查找。\n\n\
  ```java\n// module-info.java\nmodule zoo.visitor {\n    requires zoo.tours.api;\n\
  \    requires zoo.tours.reservations;\n}\n```\n\n这一次，我们在编译和打包后可以运行程序。\n\n```bash\n\
  javac -p mods -d consumerModule\n    consumerModule/zoo/visitor/*.java consumerModule/module-info.java\n\
  \njar -cvf mods/zoo.visitor.jar -C consumerModule/ .\n\njava -p mods -m zoo.visitor/zoo.visitor.Tourist\n\
  ```\n\n程序输出如下：\n\n```\nSingle tour: null\n# tours: 0\n```\n\n嗯，这很合理。我们还没有写实现。\n\n\
  ### 添加服务提供者\n\n服务提供者是接口的实现。正如我们之前所说的，可能有多个实现。我们现在先保留一个 `Tour`。\n\n```java\n// TourImpl.java\n\
  package zoo.tours.agency;\n\nimport zoo.tours.api.*;\n\npublic class TourImpl implements\
  \ Tour {\n    public String name() {\n        return \"Behind the Scenes\";\n  \
  \  }\n\n    public int length() {\n        return 120;\n    }\n\n    public Souvenir\
  \ getvenir() {\n        return \"stuffed animal\";\n    }\n}\n```\n\n再次，我们需要 `module-info.java`\
  \ 来创建该模块。\n\n```java\n// module-info.java\nmodule zoo.tours.agency {\n    requires\
  \ zoo.tours.api;\n    provides zoo.tours.api.Tour with zoo.tours.agency.TourImpl;\n\
  }\n```\n\n`provides` 指令允许我们指定实现。语法如下：`provides interfaceName with className;`。\n\
  \n![](img/image_rsrc10BA.jpg)\n\n最后，我们编译并打包它。\n\n```bash\njavac -p mods -d serviceProviderModule\n\
  \    serviceProviderModule/zoo/tours/agency/*.java\n    serviceProviderModule/module-info.java\n\
  ```\n\n现在到了最酷的部分。我们可以再次运行原始的 `zoo.visitor` 程序。\n\n```bash\njava -p mods -m zoo.visitor/zoo.visitor.Tourist\n\
  ```\n\n这一次，我们看到了：\n\n```\nSingle tour: zoo.tours.agency.TourImpl@1936f5\n# tours:\
  \ 1\n```\n\n注意我们没有重新编译 `zoo.tours.reservations` 或 `zoo.visitor`。服务定位器能够观察到现在有一个可用的服务提供者并为我们找到。这对于独立于其他代码的功能非常有用，例如自定义报告或日志。\n\
  \n（此处为图片，内容同上）\n\n在软件开发中，将不同组件拆分为独立部分的概念被称为松耦合。松耦合代码的优点是可以在对使用它的代码进行少量更改的情况下交换或替换。松耦合结构允许服务模块在运行时轻松扩展。\n\
  \n### 复习指令与服务\n\n表 12.4 总结了我们在服务章节中涵盖的内容。我们建议深入掌握当每个构件位于独立模块时需要的内容。这最可能是你在考试中遇到的内容，并能确保你理解这些概念。表\
  \ 12.5 列出了你考试中需要的所有指令。\n\n**复习服务**\n\n| 构件 | 是否服务的一部分 | 需要的指令 |\n| :--- | :--- |\
  \ :--- |\n| 服务提供者接口 | 是 | exports |\n| 服务提供者 | 否 | requires provides |\n| 服务定位器\
  \ | 是 | exports requires uses |\n| 消费者 | 否 | requires |\n\n**复习指令**\n\n| 指令 | 描述\
  \ |\n| :--- | :--- |\n| exports package; exports packageto module; | 使包对外部可用 |\n\
  | requires module; requires transitive module; | 指定另一个模块作为依赖 |\n| opens package;\
  \ opens packageto module; | 允许反射使用包 |\n| provides serviceInterface with implName;\
  \ | 使服务可用 |\n| uses serviceInterface; | 引用服务 |\n\n\n\n\n到目前为止，我们一直在使用自己编写的模块。即使\
  \ JDK 内置的类也是模块化的。在本节中，我们将向你如何使用命令来学习模块。\n\n### 识别内置模块\n\n最需要了解的模块是 `java.base`。它包含了你为考试学习的大多数包。事实上，它非常重要，你甚至不需要使用\
  \ `requires` 指令；它对所有模块化应用程序都是可用的。如果你显式要求 `java.base`，你的 `module-info.java` 文件仍然可以编译。然而，这样做是冗余的，因此最好省略它。表\
  \ 12.6 列出了一些常见模块及其包含的内容。\n\n| 模块名称 | 包含内容 | 在书中的覆盖范围 |\n| :--- | :--- | :--- |\n\
  | `java.base` | 集合、数学、IO、NIO.2、并发等 | 本书的大部分内容 |\n| `java.desktop` | 抽象窗口工具包 (AWT)\
  \ 和 Swing | 考试中不考模块名 |\n| `java.logging` | 日志 | 考试中不考模块名 |\n| `java.sql` | JDBC\
  \ | 考试中不考模块名 |\n| `java.xml` | 可扩展标记语言 (XML) | 考试中不考模块名 |\n\n考试命题者认为识别 JDK 提供的模块名称是重要的。虽然你不需要死记硬背这些名称，但你确实需要在列表中挑选出它们。\n\
  \n对于考试，你需要知道你可能使用的 API 模块名以 `java` 开头，而 JDK 特有的 API 模块名以 `jdk` 开头。表 12.7 列出了所有以\
  \ `java` 开头的模块。\n\n### 使用 java 获取详情\n\n`java` 命令有三个与模块相关的选项。一个描述模块，另一个列出可用模块，第三个显示模块解析逻辑。\n\
  \n![](img/image_rsrc10B8.jpg)\n\n#### 描述模块\n\n`java` 命令有三个与模块相关的选项。一个描述模块，另一个列出可用模块，第三个显示模块解析逻辑。\n\
  \n\n\n\n如果列出模块没有给你提供足够的输出，你还可以使用 `--show-module-resolution` 选项。你可以将其视为调试模块的方法。它在程序启动时会输出大量内容，然后运行程序。\n\
  \n```bash\njava --show-module-resolution -p feeding -m zoo.animal.feeding/zoo.animal.feeding.Task\n\
  ```\n\n幸运的是，你不需要理解这些输出。尽管虽如此，但见过它们会更容易记忆。这里是输出的一个片段：\n\n```text\nroot zoo.animal.feeding\
  \ file:///absolutePath/feeding/ \njava.base binds java.desktop jrt:/java.desktop\n\
  java.base binds jdk.jartool jrt:/jdk.jartool\n…\njdk.security.auth requires java.naming\
  \ jrt:/java.naming\njdk.security.auth requires java.security.jgss jrt:/java.security.jgss\n\
  …\nAll fed!\n```\n\n它首先列出根模块。那正是我们正在运行的那个模块：`zoo.animal.feeding`。然后它列出了强制模块 `java.base`\
  \ 包含的许多包。过了一会儿，它列出了具有依赖项的模块。最后，它输出了程序的运行：All fed!。\n\n### 使用 jar 进行描述\n\n与 `java`\
  \ 命令一样，`jar` 命令也可以描述模块。这些命令是等价的：\n\n```bash\njar -f mods/zoo.animal.feeding.jar\
  \ -d\njar --file mods/zoo.animal.feeding.jar --describe-module\n```\n\n输出与我们使用 `java`\
  \ 命令描述模块时略有不同。使用 `jar` 时，它输出以下内容：\n\n```text\nzoo.animal.feeding jar:file:///absolutePath/mods/zoo.animal.feeding.jar\n\
  /!module-info.class\nexports zoo.animal.feeding\nrequires java.base mandated\n```\n\
  \nJAR 版本在文件名中包含了 `module-info.class`，这在整体方案上并不是特别大的区别。你不需要知道这个区别。你确实需要知道这两个命令都可以描述模块。\n\
  \n### 使用 jdeps 学习依赖关系\n\n`jdeps` 命令为你提供关于模块内部依赖关系的信息。与描述模块不同，它除了模块声明外还会查看代码。这会告诉你哪些依赖项是实际被使用的，而不仅仅是声明的。幸运的是，考试并不要求你记忆所有的选项。\n\
  \n你被要求理解如何将 `jdeps` 用于尚未模块化的项目，以帮助识别依赖关系和问题。首先，我们将从这个类创建一个 JAR 文件。如果你正在跟着操作，可以从本章节开头引用的在线示例中复制该类，而不是手动输入。\n\
  \n```java\n// Animatronic.java\npackage zoo.dinos;\n\nimport java.time.*;\nimport\
  \ java.util.*;\nimport sun.misc.Unsafe;\n\npublic class Animatronic {\n    private\
  \ List<String> names;\n    private LocalDate visitDate;\n\n    public Animatronic(List<String>\
  \ names, LocalDate visitDate) {\n        this.names = names;\n        this.visitDate\
  \ = visitDate;\n    }\n\n    public void unsafeMethod() {\n        Unsafe unsafe\
  \ = Unsafe.getUnsafe();\n    }\n}\n```\n\n这个例子很无聊。它使用了许多不相关的类。布朗克斯动物园确实曾经有过电子移动恐龙，所以至少在动物园里有恐龙的想法并非遥不可及。\n\
  \n现在我们可以编译这个文件。你可能已经没有没有 `module-info.java` 文件。那是因为我们并没有创建模块。我们正在查看在对这个 JAR 进行模块化时需要哪些依赖项。\n\
  \n```bash\njavac zoo/dinos/*.java\n```\n\n编译成功了，但它向你提供了一些关于 `safe` 是内部 API 的警告。现在先不要担心这些——我们稍后会讨论。（也许恐龙的灭绝是因为它们做了一些不安全的事。）\n\
  \n接下来，我们创建一个 JAR 文件。\n\n```bash\njar -cvf zoo.dino.jar .\n```\n\n我们可以对这个 JAR 运行\
  \ `jdeps` 命令来了解它的依赖关系。首先，让我们在不带任何选项的情况下运行该命令。在前两行中，命令打印了我们在迁移到模块系统时需要通过 `requires`\
  \ 指令添加的模块。它还打印了一个表，显示了哪些哪些包以及它们对应的模块。\n\n```bash\njdeps zoo.dino.jar\n```\n\n```text\n\
  zoo.dino.jar -> java.base\nzoo.dino.jar -> jdk.unsupported\n   zoo.dinos     ->\
  \ java.lang      java.base\n   zoo.dinos     -> java.time      java.base\n   zoo.dinos\
  \     -> java.util      java.base\n   zoo.dinos     -> sun.misc       JDK internal\
  \ API (jdk.unsupported)\n```\n\n注意 `java.base` 总是被包含的。它还说明了哪些模块包含了被使用的包。如果我们以摘要模式运行，只能看到第一部分。有两种格式可以使用：\n\
  \n```bash\njdeps zoo.dino.jar\n```\n\n```bash\njdeps -s zoo.dino.jar\n```\n\n```bash\n\
  summary zoo.dino.jar\n```\n\n```text\nzoo.dino.jar -> java.base\nzoo.dino.jar ->\
  \ jdk.unsupported\n```\n\n对于真实项目，依赖列表可能包含几十或数百个。这种方法会让 `jdeps` 只显示模块。你还有一个可以使用的\
  \ `--module-path` 选项。\n\n### 使用 --jdk-internals 标志\n\n`jdeps` 命令有一个选项可以提供关于这些 API\
  \ 的信息。输出如下：\n\n```bash\njdeps --jdk-internals zoo.dino.jar\n```\n\n```text\nzoo.dino.jar\
  \ -> java.base\nzoo.dino.jar -> jdk.unsupported\n   zoo.dinos     -> java.lang \
  \     java.base\n   zoo.dinos     -> java.time      java.base\n   zoo.dinos    \
  \ -> java.util      java.base\n   zoo.dinos     -> sun.misc       JDK internal API\
  \ (jdk.unsupported)\n```\n\n`--jdk-internals` 选项列出了你使用的任何调用内部 API 的类以及对应的。在最后，它提供了一个建议你该如何做的表格。如果你编写了调用内部\
  \ API 的代码，这个信息是有用的。如果不是，这个信息对编写该代码的团队是有用的。而你，可能需要更新或完全替换该 JAR 文件以修复该问题的版本。注意 `-jdkinternals`\
  \ 等于 `--jdk-internals`。\n\n### 关于 sun.misc.Unsafe\n\n在 Java 模块系统之前，如果你想在包外使用类，它必须是公共的。在\
  \ JDK 代码中使用该类是合理的，因为那是与 JDK 紧密耦合的低级代码。由于它在多个包中被需要，该类被公开了。Sun 甚至将其命名为 `Unsafe`，心认为这可以防止任何人在\
  \ JDK 之外使用它。\n\n然而，开发者们很聪明，既然它是可用的，就使用了它。许多广泛使用的开源库都开始使用它。虽然你不太可能直接使用这个类，但你可能使用了某个正在使用它的开源库。\n\
  \n`jdeps` 命令允许你查看这些 JAR，以查看 Oracle 最终阻止使用该类时你是否会遇到问题。\n\n### 使用 jmod 使用模块文件\n\n\
  你考试需要需要的下一个命令是 `jmod`。你可能认为 JMOD 文件是 Java 模块文件。并不是。Oracle 只有在你有原生库或其他无法放入 JAR 文件的某些时才建议使用\
  \ JMOD 文件。这在现实世界中可能对你产生影响。\n\n\n\n\n\n最需要记住的一点是 `jmod` 仅用于处理 `JMOD` 文件。方便的是，你不需要记忆\
  \ `jmod` 的语法。表 12.9 列出了常见的操作模式。\n\n### 表 12.9 使用 `jmod` 的模式\n\n| 操作 | 描述 |\n| :---\
  \ | :--- |\n| create | 创建 JMOD 文件。 |\n| extract | 从 JMOD 中提取所有文件。作用类似于解压。 |\n| describe\
  \ | 打印模块详情，如依赖项（requires）。 |\n| list | 列出 JMOD 文件中的所有文件。 |\n| hash | 打印或记录哈希值。 |\n\
  \n### 使用 `jlink` 创建 Java 运行时镜像\n\n模块的好处之一是可以仅提供你需要的 Java 部分。我们在章节开始时的 zoo 示例并没有许多依赖项。如果用户还没有\
  \ Java，或者在一个内存不大的设备上运行，下载一个超过 150 MB 的 JDK 是一个巨大的负担。让我们看看包实际需要有多大！此命令创建了我们较小的发行版，称为运行时镜像：\n\
  \n```bash\njlink --module-path mods --add-modules zoo.animal.talks --output zooApp\n\
  ```\n\n首先，我们使用 `-p` 或 `--module-path` 指定查找自定义模块的位置。然后，我们使用 `--add-modules` 指定模块名称。只要这些模块可以找到，它就会包含它们所需的依赖。最后，我们使用\
  \ `--output` 指定较小 JDK 的文件夹名称。\n\n我们的运行时镜像存储在输出目录中，包含 `bin`、`conf`、`include`、`legal`、`lib`\
  \ 和 `man` 目录以及一个 release 文件。这些看起来应该很熟悉，因为在完整的 JDK 中也能找到它们。\n\n当我们运行此命令并压缩 `zooApp`\
  \ 目录时，文件只有 15 MB。这比完整的 JDK 小了一个数量级。这些空间节省从哪里来呢？JDK 中有很多我们不需要的模块。此外，像 `javac` 这样的开发工具不需要在运行时镜像中。\n\
  \n有很多可以自定义此过程的项目是你考试不需要知道的。例如，你可以跳过生成帮助文档以节省更多空间![](img/image_rsrc10B8.jpg)。记住，像\
  \ `jlink` 创建的 Java 运行时镜像是一个多个文件夹、库和可执行文件的文件夹。它没有被打包成单个“文件”。正如我们在下一节看到的，可以使用 `jpackage`\
  \ 创建单个可执行包。\n\n### 使用 `jpackage` 创建自包含的应用程序\n\n与 `jlink` 只能创建运行时镜像不同，`jpackage`\
  \ 命令可以创建应用程序镜像。应用程序镜像是在特定平台上运行的单个可执行文件。例如，在 Windows 上获得一个 `.exe` 文件，在 Mac 上获得一个\
  \ `.dmg` 文件。\n\n`jlink` 和 `jpackage` 都提供了运行所需的 Java 部分。而且对于两者，你都不需要在运行应用程序的系统上安装\
  \ JDK。\n\n除了输出格式，`jlink` 和 `jpackage` 的大区别在于 `jpackage` 可以封装模块化和非模块化的应用程序，而 `jlink`\
  \ 限于模块化应用程序。本章用于创建 `zoo.animal.feeding` 模块化应用程序的命令：\n\n```bash\njpackage --name\
  \ feedingTask --module-path mods --module zoo.animal.feeding\n```\n\n在 Mac 上，这会创建一个\
  \ `feedingTask-1.0.dmg` 文件。让我们来看看选项。首先，`--name` 或 `-n` 提供创建的应用程序的名称。如果你想要 1.0 以外的版本，可以传递\
  \ `--app-version`。`--module-path`（或 `-p`）和 `--module`（或 `-m`）参数在运行模块化应用程序时很熟悉。你甚至可以像\
  \ `jlink` 一样调用 `--add-modules` 来添加 `module-info` 文件中没有的额外模块。\n\n考试不需要知道这些，但你可以运行\
  \ `jlink` 创建运行时镜像，并将其作为输入来创建一个一个应用程序镜像！\n\n### 使用 `jpackage` 处理非模块化应用程序\n\n你可以针对非模块化的\
  \ jar 包运行 `jpackage` 命令。例如：\n\n```bash\njpackage --name myApp --input myDir --main-class\
  \ com.wiley.java.Cat --main-jar myApp.jar\n```\n\n与模块化示例一样，`--name` 或 `-n` 用于创建的应用程序名称。`--input`\
  \ 或 `-i` 指定封装文件所在的目录。`--main-class` 指定要运行的全限定类名，`--main-jar` 指定该类的位置。\n\n### 复习命令行选项\n\
  \n本节提供了若干表格，涵盖了考试中运行所需的命令行选项。\n\n表 12.10 显示了你在考试可能会遇到的命令行操作。文档中还有更多选项。例如，`javac`\
  \ 上有一个 `--module` 选项可以将编译限制到该模块。幸运的是，考试不需要知道这些。\n\n### 表 12.10 命令行操作对比\n\n| 描述 |\
  \ 语法 |\n| :--- | :--- |\n| 编译非模块化代码 | `javac -cp classpath -d directory classesToCompile`\
  \ `javac --class-path classpath -d directory classesToCompile` |\n| 运行非模块化代码 | `java\
  \ -cp classpath className` `java --class-path classpath className` |\n| 编译模块 | `javac\
  \ -p moduleFolderName -d directory classesToCompile` `javac --module-path moduleFolderName\
  \ -d directory classesToCompile` |\n| 运行模块 | `java -p moduleFolderName -m moduleName/ClassName`\
  \ `java --module-path moduleFolderName --module moduleName/ClassName` |\n| 描述模块\
  \ | `java --path moduleFolderName --describe moduleName/ClassName` `java --module-path\
  \ moduleFolderName --describe moduleName/ClassName` |\n| 列出可用模块 | `java --list --module-path\
  \ moduleFolderName` `java --list --module-path moduleFolderName` |\n| 查看依赖项 | `jdeps\
  \ -summary --module-path moduleFolderName jarName` `jdeps -summary --module-path\
  \ moduleFolderName jarName` |\n| 显示模块解析 | `java --module-path moduleFolderName --resolve\
  \ moduleName/ClassName` `java --module-path moduleFolderName --resolve moduleName/ClassName`\
  \ |\n| 创建运行时 JAR | `jlink --module-path moduleFolderName --add-modules moduleName\
  \ --output zooApp` `jlink --module-path moduleFolderName --add-modules moduleName\
  \ --output zooApp` |\n| 创建自包含的 Java 应用程序 | `jpackage --name name -p moduleFolderName\
  \ -m moduleName/ClassName` `jpackage --name name --module-path moduleFolderName\
  \ --module moduleName/ClassName` |\n| 创建非模块化应用程序 | `jpackage --name myApp --input\
  \ myDir --main-class ClassName --main-jar myApp.jar` `jpackage --name myApp -i myDir\
  \ --main-class ClassName --main-jar myApp.jar` |\n\n表 12.11 显示 `javac` 的选项，表 12.12\
  \ 显示 `java` 的选项，表 12.13 显示 `jar` 的选项，以及表 12.14 显示 `jdeps` 的选项。最后，表 12.15 显示 `jlink`\
  \ 的选项，表 12.16 显示 `jpackage` 的选项。\n\n### 表 12.11 考试需要的 `javac` 选项\n\n| 选项 | 描述 |\n\
  | :--- | :--- |\n| 非模块化程序中的 JAR 路径 | `-cp <classpath>` `--class-path <classpath>`\
  \ |\n| 存放生成的类文件的目录 | `-d <dir>` |\n| 模块化程序中的 JAR 路径 | `-p <path>` `--module-path\
  \ <path>` |\n\n### 表 12.12 考试需要的 `java` 选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `-cp\
  \ <classpath>` `--class-path <classpath>` |\n| `-p <path>` |\n\n\n\n\n\n| `--module-path\
  \ <path>` | 非模块化程序中的 JAR 路径 / 模块化程序中的 JAR 路径 |\n| `-m <name> --module <name>` |\
  \ 要运行的模块名称 |\n| `-d --describe-module` | 描述模块细节 |\n| `--list-modules` | 在不运行程序的情况下列出可观测的模块\
  \ |\n| `--show-module-resolution` | 在程序运行时显示模块 |\n\n### 表 12.13 (#cJRD.xhtml_a102B)\
  \ 考试需要的选项：jar\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-c --create` | 创建新的 JAR 文件 |\n\
  | `-v ---verbose` | 在处理 JAR 文件时打印详细信息 |\n| `-f --file` | JAR 文件名 |\n| `-C <dir>`\
  \ | 包含创建 JAR 所用文件的目录 |\n| `-d --describe-module` | 描述模块细节 |\n\n### 表 12.14 (#cJRD.xhtml_a101P)\
  \ 考试需要的选项：jdeps\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `--module-path <path>` | 模块化程序中的\
  \ JAR 路径 |\n| `-s -summary` | 汇总输出 |\n| `--jdk-internals -jdkinternals` | 列出对内部\
  \ API 的使用 |\n\n### 表 12.15 (#cJRD.xhtml_aZUE) 考试需要的选项：jlink\n\n| 选项 | 说明 |\n| :---\
  \ | :--- |\n| `-p <path> --module-path <path>` | 模块化程序中的 JAR 路径 |\n| `--add-modules\
  \ <name>` | 要打包的模块列表 |\n| `--output` | 输出目录名称 |\n\n### 表 12.16 (#cJRD.xhtml_a1011)\
  \ 考试需要的选项：jpackage\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-n <name> --name <name>`\
  \ | 输出文件的前缀。将与版本号和后缀结合 |\n| `-p <path> --module-path <path>` | 模块化程序中的 JAR 路径。 |\n\
  | `--add-modules <name>` | 要打包的模块列表。 |\n| `--app-version` | 输出文件名的可选版本号。如果未指定，默认为\
  \ 1.0。 |\n| `--i <dir> --input <dir>` | 包含非模块化应用打包文件的输入目录。 |\n| `--main-class` |\
  \ 在非模块化 jar 中运行的全限定类名。 |\n| `--main-jar` | 包含要运行类的非模块化 jar。 |\n\n## 比较模块类型\n\n我们在本章到目前为止的所有模块都称为命名模块（named\
  \ modules）。还有两种类型的模块：自动模块（automatic modules）和未命名模块（unnamed modules）。在本节中，我们将描述这三种类型的模块。在考试中，你将能够对它们进行比较。\n\
  \n### 命名模块\n\n命名模块是包含 `module-info.java` 文件的模块。复习一下，该文件出现在 JAR 根目录下与一个或多个包一起。除非另有指定，否则模块都是命名模块。命名模块出现在模块路径（module\
  \ path）而不是类路径（classpath）。稍后，你将学习如果包含 `module-info.java` 文件的 JAR 在类路径上会发生什么。目前，只需知道它不被视为命名模块，因为它不在模块路径上。\n\
  \n为了记住这一点，命名模块的名称位于 `module-info.java` 文件内部，并且位于模块路径上。\n\n![](img/image_rsrc10B8.jpg)\n\
  \n记得第 7 章“超越类”，密封类（sealed classes）的子类位于不同包的唯一方法是位于同名的模块中。\n\n### 自动模块\n\n自动模块出现在模块路径上，但不包含\
  \ `module-info.java` 文件。它仅仅是放在模块路径上的普通 JAR 文件，并被视为模块。\n\n为了记住这一点，Java 会自动确定模块名称。引用自动模块的代码将其处理就像存在\
  \ `module-info.java` 文件一样。它会自动导出所有包。它还会确定模块名称。你问它是如何确定模块名称的？问得好。\n\n为了回答这个问题，我们需要提供关于\
  \ JAR 文件和模块采用的一些历史。每个 JAR 文件都包含一个名为 `META-INF` 的特殊文件夹，其中有一个名为 `MANIFEST.MF` 的文本文件。它可以在创建\
  \ JAR 时自动创建，也可以由 JAR 作者手动创建。回到模块，许多 Java 库在该特性引入时还没有准备好模块化。作者们鼓励通过在 `MANIFEST.MF`\
  \ 文件中添加名为 `Automatic-Module-Name` 的属性，来声明他们打算为模块使用的名称。\n\n### 关于 MANIFEST.MF 文件\n\
  \nJAR 文件包含一个名为 `META-INF/MANIFEST.MF` 的特殊文本文件，其中包含 JAR 的信息。它的出现时间比模块早得多——确切地说，从\
  \ Java 和 JAR 的早期开始。该图显示了清单如何到 JAR 文件的目录结构中。\n\n![一张图片说明了 MANIFEST.MF 模块的目录结构。逐步过程包括\
  \ zoo、meta.inf 之间的 MANIFEST.MF，以及 sales、holiday 和 data 逐一位于。](img/image_rsrc10DX.jpg)\n\
  \n清单包含关于 JAR 文件的额外信息。例如，它通常包含构建 JAR 文件的 Java 版本。对于命令行程序，通常指定带有 `main()` 方法的类。\n\n\
  清单中的每行都是由冒号分隔的键值对。你可以将清单视为属性名称的映射。Java 21 的默认清单如下：\n\n```\nManifest-Version: 1.0\n\
  Created-By: Oracle\n```\n\n如果 JAR 未指定自动模块名称，Java 仍然允许你在模块路径上使用它。在清单中指定单个属性允许供应商为想要在模块化应用程序中使用它的应用程序提供便利。\n\
  \n由于规则较多，让我们回顾一下确定自动模块名称的算法：\n\n1. 如果 `MANIFEST.MF` 指定了 `Automatic-Module-Name`，则使用它。否则继续后续规则。\n\
  2. 从 JAR 名称中删除扩展名。\n3. 从名称末尾删除版本信息。版本是数字和点，可能带有附加信息：例如 `-1.0.0` 或 `-1.0-RC`。\n4.\
  \ 将除字母和数字以外的剩余字符替换为点。\n5. 将连续的点替换为单个点。\n6. 如果点是结果的首尾，则将其删除。\n\n表 12.17 显示了如何将这些规则应用于两个在清单中未指定自动模块名称的示例。\n\
  \n### 表 12.17 (#cJRD.xhtml_a106P) 练习自动模块名称\n\n| # | 说明 | 示例 1 | 示例 2 |\n| :--- |\
  \ :--- | :--- | :--- |\n| 1 | 初始 JAR 名称 | commons2-x-1.0.0-SNAPSHOT.jar | mod_$-1.0.jar\
  \ |\n| 2 | 删除扩展名 | commons2-x-1.0.0-SNAPSHOT | mod_$-1.0 |\n| 3 | 删除版本信息 | commons2-x\
  \ | mod_$ |\n| 4 | 替换特殊字符 | commons2.x | mod.. |\n\n\n\n\n\n| 5 | 替换点序列 | commons2.x\
  \ | mod. |\n| 6 | 删除头部/末尾的点（结果为自动模块名） | commons2.x | mod |\n\n虽然创建自动模块名的算法尽力而为，但它并不总是能生成一个好的名字。例如，`1.2.0-calendar-1.2.2-good-1.jar`\
  \ 并不便于使用。幸运的是，这种名字非常罕见，且不在考试范围之内。\n\n### 未命名模块 (Unnamed Modules)\n\n未命名模块出现在类路径（classpath）上。与自动模块一样，它是一个普通的\
  \ JAR。与自动模块不同的是，它在类路径上而不是模块路径（module path）。这意味着未命名模块被视为旧代码，是模块眼中的“二等公民”。\n\n未命名模块通常不包含\
  \ `module-info.java` 文件。如果它恰好包含该文件，该文件也将被忽略，因为它位于类路径上。\n\n未命名模块不向命名模块导出任何包。未命名模块可以从类路径或模块路径上的任何\
  \ JAR 读取内容。你可以将未命名模块认为是按照 Java 在模块出现之前的运行运行的代码。是的，我们知道一个并不是真正的模块，名称里却带有“模块”一词确实很让人困惑。\n\
  \n### 复习模块类型 (Reviewing Module Types)\n\n你可以预计考试中会有关于比较这三种模块类型的问题。请彻底学习 表 12.18，并准备好回答关于这些项目的任何组合问题。需要记住的一个关键点是：类路径上的代码可以访问模块路径。相比之下，模块路径上的代码无法从类路径读取。\n\
  \nTABLE 12.18 模块类型的属性\n\n| 属性 | 命名 (Named) | 自动 (Automatic) | 未命名 (Unnamed) |\n\
  | :--- | :--- | :--- | :--- |\n| ______ 模块是否包含 `module-info.java` 文件？ | 是 | 否 |\
  \ 如果存在则被忽略 |\n| ______ 模块向命名模块导出哪些包？ | `module-info.java` 文件中的包 | 所有包 | 无包 |\n|\
  \ ______ 模块向自动模块导出哪些包？ | `module-info.java` 文件中的包 | 所有包 | 所有包 |\n| 模块路径上的其他模块可以读取\
  \ ______ 模块吗？ | 是 | 是 | 否 |\n| 类路径上的其他 JAR 可以读取 ______ 模块吗？ | 是 | 是 | 是 |\n\n##\
  \ 迁移应用程序 (Migrating an Application)\n\n许多应用程序的设计并没有使用 Java 平台模块系统，因为它们在系统创建之前就已经编写好了，或者选择了不使用它。理想情况下，它们至少是按项目结构设计的，而不是像一团乱麻（big\
  \ ball of mud）。本节概述了将现有应用程序迁移到使用模块的策略。我们涵盖了模块排序、自下向上迁移、自上向下迁移以及如何拆分现有项目。\n\n###\
  \ ![](img/image_rsrc10BB.jpg) 现实世界场景\n\n### 在工作中迁移你的应用程序\n\n考试存在于一个虚拟的宇宙中，那里没有开源依赖，且应用程序非常小。这些场景让学习和讨论迁移变得容易得多。在现实世界中，应用程序拥有\
  \ 10 年或久未更新的库、复杂的依赖图以及各种意外。\n\n请注意，你可以在不将应用程序转换为模块的情况下使用 Java 21 的所有功能（当然，本章节中的功能除外！）。请确保你有迁移的理由，不要认为迁移是强制性的。\n\
  \n本章在教授你考试所需知识方面做得很好。然而，它并没有充分让你准备好将真实应用程序转换为模块。如果你发现自己处于那种情况下，请考虑阅读 Nicolai Parlog\
  \ 的《The Java Module System》（Manning Publications, 2019）。\n\n### 确定顺序 (Determining\
  \ the Order)\n\n在我们将应用程序迁移到模块之前，我们需要知道现有应用程序中的包和库是如何结构的。假设我们有一个包含三个 JAR 文件的简单应用程序，如图\
  \ 12.14 所示。项目之间的依赖关系形成了一个图。图 12.14 中的两种表示方法都是等价的。箭头显示了依赖关系，从需要依赖的项目指向提供该依赖的项目。在模块语言中，箭头将从\
  \ `requires` 指向 `exports`。\n\n![一个流程图说明了按顺序排列 JAR 文件的应用程序。左侧是鸡生蛋、鸡到巢、巢到蛋的循环流动。右侧是鸡-巢-蛋以及流程过程中的鸡生蛋。箭头代表依赖函数。](img/image_rsrc10DY.jpg)\n\
  \nFIGURE 12.14 确定顺序\n\n图表的右侧有助于更容易识别自上向下和自下向上迁移所指的“顶部”和“底部”。没有任何依赖的项目位于底部。有依赖的项目位于顶部。\n\
  \n在这个例子中，只有一种从上到下的顺序可以满足所有依赖关系。图 12.15 显示顺序并不总是唯一的。由于两个项目之间没有箭头，因此在决定迁移顺序时，任何一种顺序都是允许的。\n\
  \n### 探索自下向上迁移策略 (Exploring a Bottom-Up Migration Strategy)\n\n迁移最简单的方法是自下向上迁移。当你有权转换任何尚未模块化的\
  \ JAR 文件时，这种方法效果最好。对于自下向上的迁移，你遵循以下步骤：\n\n1. 选择尚未迁移的最低层项目。\n2. 为该项目添加 `module-info.java`\
  \ 文件。确保导出高层项目使用的任何包。\n3. 将此新迁移的命名模块从类路径移动到模块路径。\n4. 确保尚未迁移的项目作为未命名模块保留在类路径上。\n5.\
  \ 重复下一个低层项目，直到完成。\n\n![三个流程图说明了顺序是不唯一的。左侧是鸡生蛋和鸡到蛋的圆形路径，鸡位于顶部。右侧是鸡到蛋和鸡生蛋的直线路径，鸡位于顶部。](img/image_rsrc10DZ.jpg)\n\
  \nFIGURE 12.15 不唯一的顺序\n\n你可以看到此程序应用于迁移 图 12.16 中的三个项目。注意每个项目都依次转换为模块。\n\n通过自下向上的迁移，你正在让底层项目处于良好状态。这使得最后迁移顶层项目变得更容易。它还鼓励在导出时更加谨慎。\n\
  \n在迁移期间，你拥有命名模块和未命名模块的混合。命名模块是已经迁移的底层项目。它们位于模块路径上，不允许访问任何未命名模块。\n\n未命名模块位于类路径上。它们可以访问类路径和模块路径上的\
  \ JAR 文件。\n\n### 探索自上向下迁移策略 (Exploring a Top-Down Migration Strategy)\n\n当你无法控制应用程序使用的每个\
  \ JAR 文件时，自上向下的迁移策略最为有用。例如，假设另一个团队拥有一个项目。他们太忙了无法迁移。你不希望这种情况阻塞你的整个迁移进程。\n\n对于自上向下的迁移，你遵循以下步骤：\n\
  \n1. 将所有项目放在模块路径上。\n2. 选择尚未迁移的高层项目。\n3. 为该项目添加 `module-info.java` 文件，将自动模块转换为命名模块。再次，记住添加任何导出或需要性指令。在编写\
  \ `requires` 指令时，由于模块路径上的大多数项目还没有命名，因此你可以使用其他模块的自动模块名。\n4. 重复下一个高层项目，直到完成。\n\n\n\
  \n\n\n![一张图片说明了自底向上迁移的过程。该过程被应用于 classpath 和 module path 中的三个项目：chicken、nest 和 egg。在步骤\
  \ 1 中，所有三个项目都在类路径中，而 module path 为空。在步骤 2 中，带命名的 egg 移动到了 module path，classpath\
  \ 中留下了两个未命名的项目。在步骤 3 中，带命名的 egg 和 nest 移动到了 module path，classpath 中留下了未命名的 chicken。在步骤\
  \ 4 中，所有带命名的项目都移动到了 module path。](img/image_rsrc10E0.jpg)\n\n### 图 12.16 自底向上的迁移]\n\
  \n你可以看到此过程被应用于图 12.17 中三个项目的迁移。请注意，每个项目都是轮流转换为模块。\n\n使用自顶向下迁移时，你承认所有低层依赖项尚未准备绪，但你想让应用程序本身成为一个模块。\n\
  \n在迁移期间，你会同时拥有具命名模块和自动模块。具命名模块是已经迁移的高层模块。它们位于 module path 上，并且可以访问自动模块。自动模块也在 module\
  \ path 上。\n\n表 12.19 回顾了关于两种主要迁移策略你需要了解的知识。确保你已经熟悉了它们。\n\n![一张图片说明了自顶向下迁移的过程。该过程被应用于\
  \ classpath 和 module path 中的三个项目：chicken、nest 和 egg。在步骤 1 中，所有三个项目都在类路径中，而 module\
  \ path 为空。在步骤 2 中，所有项目移动到了 module path，其中 chicken 是具名的，nest 和 egg 是自动的。在步骤 3 中，chicken\
  \ 和 nest 是具名的而 egg 在 module path 中是自动的。在步骤 4 中，所有项目在 module path 中都是具名的。(OEBPS/image_rsrc10E1.jpg)\n\
  \n### 图 12.17 自顶向下的迁移]\n\n### 表 12.19 迁移策略对比]\n\n| 类别 | 自底向上 (Bottom-Up) | 自顶向下\
  \ (Top-Down) |\n| :--- | :--- | :--- |\n| 依赖于所有其他项目 | 类路径上的未命名模块 | module path 上的具命名模块\
  \ |\n| 无依赖的项目 | module path 上的具命名模块 | module path 上的自动模块 |\n\n### 将大项目拆分为模块\n\n\
  对于考试，你需要理解将一个大项目拆分为模块的基本过程。当然，你不会被给一个大项目。毕竟，提问的空间是有限的。幸运的是，小项目的过程是一致的。\n\n假设你从一个包含许多包的应用程序开始。第一步是将它们拆分为逻辑分组，并画出它们之间的依赖关系。图\
  \ 12.18 显示了一个虚拟系统的拆分。注意，左右两边都有七个包。模块的数量较少，是因为某些包共享同一个模块。\n\n这种拆分存在一个问题。你看到了吗？Java\
  \ 平台模块系统不允许循环依赖。循环依赖（或称为环形依赖）是指两个事物直接或间接地相互依赖。如果 `zoo.tickets.delivery` 模块需要 `zoo.tickets.discount`\
  \ 模块，那么 `zoo.tickets.discount` 就不允许需要 `zoo.tickets.delivery` 模块。\n\n![一张图片说明了第一次尝试的拆分。在左侧，模块出现之前有\
  \ `zoo.tickets.cash`、`zoo.tickets.coupons`、`zoo.tickets.credit`、`zoo.tickets.etickets`、`zoo.tickets.promos`、`zoo.tickets.printer`\
  \ 和 `zoo.tickets.type`。在右侧，模块出现之后有 `zoo.tickets.delivery`、`zoo.tickets.model`、`zoo.tickets.discount`\
  \ 和 `zoo.tickets.payment` 以及相应的类。(OEBPS/image_rsrc10E2.jpg)\n\n### 图 12.18 拆分的第一次尝试]\n\
  \n既然我们知道图 12.18 中的拆分行不通，我们能做什么呢？常用技术是引入另一个模块。该模块包含另外两个模块共享的代码。图 12.19 显示了没有任何任何循环依赖的新模块。注意新模块\
  \ `zoo.tickets.etech`。我们创建了新包放入该模块中。这允许开发者将公共代码放在那里并打破依赖。不再有循环依赖了！\n\n![一张图片说明了移除循环依赖的过程。在左侧，模块出现之前有\
  \ `zoo.tickets.delivery`、`zoo.tickets.model`、`zoo.tickets.discount` 和 `zoo.tickets.payment`。在右侧，模块出现之后有\
  \ `zoo.tickets.delivery`、`zoo.tickets.etech`、`zoo.tickets.discount`、`zoo.tickets.model`\
  \ 和 `zoo.tickets.payment` 以及相应的类。箭头表示依赖关系函数。(OEBPS/image_rsrc10E3.jpg)\n\n### 图\
  \ 12.19 移除循环依赖]\n\n### 循环依赖导致无法编译\n\n理解 Java 不允许你编译具有循环依赖的模块是非常关重要的。在本节中，我们来看一个导致该错误的示例。考虑这里的\
  \ `zoo.butterfly` 模块：\n\n```java\n// Butterfly.java\n\npackage zoo.butterfly;\n\n\
  public class Butterfly {\n    // ...\n}\n```\n\n```java\n// module-info.java\n\n\
  module zoo.butterfly {\n    exports zoo.butterfly;\n    requires caterpillar;\n\
  }\n```\n\n我们无法编译这个，因为我们需要先构建 `caterpillar`。毕竟，蝴蝶需要它。现在来看 `caterpillar`：\n\n```java\n\
  // Caterpillar.java\n\npackage zoo.caterpillar;\n\npublic class Caterpillar {\n\
  \    void emergeCocoon() {\n        // ...\n    }\n}\n```\n\n```java\n// module-info.java\n\
  \nmodule zoo.caterpillar {\n    exports zoo.caterpillar;\n    requires butterfly;\n\
  }\n```\n\n我们仍然无法编译，因为我们需要先构建 `butterfly`。哦！现在僵局了。两个模块无法编译。这就是循环依赖的作用。\n\n这是模块系统的优势之一。它防止编写具有循环依赖的代码。这种代码无法编译！\n\
  \n你可能会想如果涉及到三个模块会发生什么。假设 `moduleA` 需要 `moduleB`，而 `moduleB` 需要 `moduleC`。那么 `moduleC`\
  \ 可以需要 `moduleA` 吗？不可以。这会产生循环依赖。不相信？试着画一下。你可以顺着线条从 `moduleA` 绕到 `moduleB` 再到 `moduleC`，最后回到\
  \ `moduleA`……嗯，你懂的。要考虑的事情太多了！\n\n![](img/image_rsrc10BA.jpg)\n\nJava 仍然允许模块内部的包之间存在循环依赖。它强制模块之间不能有循环依赖。\n\
  \n### 总结\n\nJava 平台模块系统在更高的层次上组织代码。每个模块包含一个或多个包以及一个 `module-info.java` 文件。`java.base`\
  \ 模块是最常见的，作为依赖提供所有模块。\n\n编译和运行模块的过程使用 `--module-path`，也称为 `-p`。运行模块使用 `--module`\
  \ 选项，也称为 `-m`。要运行的类遵循格式 `moduleName/className`。\n\n模块声明支持多种指令。`exports` 指令指定包可以从外部访问。它可以可选地将该导出限制为特定模块。`requires`\
  \ 指令用于一个模块依赖于另一个模块的代码。此外，`requires transitive` 可用于当需要某个模块的模块也总是需要另一个模块时。`provides`\
  \ 和 `uses` 指令用于共享和消费服务。最后，`opens` 指令用于通过反射访问。\n\n\n\n\n\n# 概述\n`java` 和 `jar` 命令都可以用于描述模块的内容。`java`\
  \ 命令还可以列出可用的模块并显示模块解析。`jdeps` 命令除了模块级信息外，还会打印所用包的信息。`jmod` 命令用于处理不符合 `JAR` 要求的文件。`jlink`\
  \ 命令创建一个较小的 Java 运行时镜像。`jpackage` 命令创建一个应用程序镜像，这是一个自包含的、特定于操作系统的文件。\n\n模块有三种类型。命名模块包含一个\
  \ `module-info.java` 文件并位于模块路径（module path）上。它们只能从模块路径读取。自动模块也位于模块路径上，但尚未被模块化。它们在清单文件（manifest）中可能设置了自动模块名称。未命名模块位于类路径路径（classpath）上。\n\
  \n两种最常见的迁移策略是自上而下和自下而上。自上而下的迁移从依赖项最多的模块开始迁移，并将所有其他模块放在模块路径上。自下而上的迁移从没有依赖的模块开始迁移，一次移动一个模块到模块路径。这两种策略都需要确保你没有任何循环依赖，因为\
  \ Java 模块系统不允许循环依赖编译。\n\n## 考试要点\n\n**创建 `module-info.java` 文件。** 将 `module-info.java`\
  \ 文件放置在模块的根目录下。了解如何编写 `exports`、`requires`、`provides` 和 `uses` 指令。此外，熟悉 `opens`\
  \ 指令。\n\n**使用命令行操作模块模块。** `java` 命令可以描述模块、列出可用模块或显示模块解析。`jar` 命令可以像 `java` 命令一样描述模块。`jdeps`\
  \ 命令打印有关模块和包的详细信息。`jmod` 命令提供了处理 `JMOD` 文件而非 `JAR` 文件的各种模式。`jlink` 命令创建自定义 Java\
  \ 镜像。`jpackage` 命令创建可执行文件。\n\n**识别三种模块类型。** 命名模块是已经模块化的 `JAR`。未命名模块尚未模块化。自动模块介于两者之间。它们位于模块路径上，但没有\
  \ `module-info.java` 文件。\n\n**列出内置 JDK 模块。** `java.base` 模块对所有模块可用。JDK 还提供了约 20\
  \ 个其他以 `java.*` 开头的模块和约 30 个以 `jdk.*` 开头的模块。\n\n**解释自上而下和自下而上的迁移。** 自上而下的迁移将所有 `JAR`\
  \ 放在模块路径上，在从上到下的迁移过程中使它们成为自动模块。自下而上的迁移将所有 `JAR` 留存在类路径上，在从下到上的迁移过程中使它们成为未命名模块。\n\
  \n**区分服务的四个主要部分。** 服务提供接口（service provider interface）声明服务必须实现的接口。服务定位器（service locator）查找服务，消费者（consumer）调用服务。最后，服务提供者（service\
  \ provider）实现服务。\n\n## 复习题\n\n章节复习题的答案可以在附录中找到。\n\n1. 关于以下模块的哪个描述是正确的？\n\n```\n\
