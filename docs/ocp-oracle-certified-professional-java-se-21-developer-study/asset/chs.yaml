  \ 和 `F` 是错误的。\n\n## 11. D, G, H\n选项 `A`、`B`、`E` 和 `F` 是错误的，因为它们引用了不存在的指令。当指定一个模块供请求模块以及任何其他使用请求模块的模块使用时，使用\
