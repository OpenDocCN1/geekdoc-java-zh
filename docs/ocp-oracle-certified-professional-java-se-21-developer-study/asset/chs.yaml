  \ \n31: \n32: \n33: \n34: \n35: \n36: \n\n1. x is 0\n2. x is 24\n3. 第 6 行编译错误。\n\
  4. 第 8 行编译错误。\n5. 第 11 行编译错误。\n6. 以上不是。\n\n**26. 下列程序的输出是什么？**\n\n```java\n20: enum\
