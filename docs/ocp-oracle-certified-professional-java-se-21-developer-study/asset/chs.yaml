  7. 因为第 17 行代码无法编译。\n8. 以上均不是。\n\n# 第 7 章：超越类\n\n## 本章涵盖的 OCP 考试目标：\n\n 在 Java 中使用面向对象概念\n\
  * 声明并实例化 Java 对象（包括嵌套类对象），并解释对象的生命周期，包括创建、重新赋值引用和垃圾收集。\n* 创建类和记录（records），并定义和使用实例及静态字段、方法、构造函数以及实例和静态初始化器。\n\
  * 理解变量作用域、应用封装并创建不可变对象。使用局部变量类型推断。\n* 实现继承，包括抽象类型、密封类型以及记录类。重写方法，包括 `Object` 类的方法。实现多态并区分对象类型和引用类型。执行引用类型转换，使用\
  \ `instanceof` 运算符识别对象类型，并结合 `instanceof` 运算符和 `switch` 结构进行模式匹配。\n* 创建并使用接口，识别函数接口并利用私有、静态和默认接口方法。\n\
  * 创建和使用带有字段、方法和构造函数的枚举类型。\n\n在第 6 章“类设计”中，我们展示了如何创建、初始化和扩展抽象类和具体类。在本章中，我们将超越类，介绍\
  \ Java 中提供的其他类型，包括接口、枚举、密封类和记录。你在第 5 章“方法”中学习的许多基本规则仍然适用，例如访问修饰符和静态成员，但每种类型都有额外的规则。我们还涵盖了封装以及如何正确保护实例成员。最后，我们通过讨论嵌套类型和多态继承来结束本章。\n\
  \n\n\n\n\n在实践中，创建自己的注解也是一项很有用的技能，尽管考试并不要求掌握这部分知识。\n\n## 实现接口\n\n在第 6 章中，你学习了抽象类，特别是如何创建和扩展抽象类。由于类只能继承一个类，因此它们在继承方面的用处是有限的。另一方面，一个类可以实现任意数量的接口。接口是一种抽象数据数据类型，它声明了一系列抽象方法，任何实现该接口的类都必须提供这些方法。\n\
  \n随着时间的推移，接口的精确定义发生了变化，因为现在支持了额外的方法类型。在本章中，我们将从接口的基本定义开始，并将其扩展到涵盖所有支持的成员。\n\n###\
  \ 声明和使用接口\n\n在 Java 中，接口用 `interface` 关键字定义，类似于在定义类时使用的 `class` 关键字。请参考图 7.1 获取正确的接口声明。\n\
  \n![Java 脚本中接口声明的示例结构。变量为公共（public）或包级访问、隐式修饰符、interface 关键字、接口名称、抽象接口方法和常量变量。](img/image_rsrc10CK.jpg)\n\
  \nFIGURE 7.1 定义接口\n\n在图 7.1 中，我们的接口声明包含一个抽象方法和一个常量变量。接口变量被称为常量，因为它们被假设是 `public`、`static`\
  \ 且 `final` 的。它们在声明时被初始化为常量值。由于它们是公共且 `static` 的，它们可以在接口声明之外使用，而不需要接口的实例。图 7.1 还包含一个抽象方法，该方法与接口变量一样被假设是公共的。\n\
  \n![](img/image_rsrc10B8.jpg)\n\n为了简洁起见，在本章中经常说“接口的实例”，是指实现该接口的类的实例。\n\n变量或方法被假设为某种类型意味着什么？接口声明中与抽象类不同的一个方面是它包含了隐式修饰符。隐式修饰符是编译器自动插入代码的修饰符。例如，接口始终被认为是\
  \ `abstract` 的，即使它没有被标记！我们稍后会详细介绍隐式修饰符的规则和示例。\n\n让我们从一个简单的例子开始。假设我们有一个接口 `WalksOnTwoLegs`，定义如下：\n\
  \n```java\npublic abstract interface WalksOnTwoLegs {}\n```\n\n它是可以编译的，因为接口并不要求定义任何方法。此示例中的\
  \ `abstract` 修饰符对于接口是可选的，如果未提供，编译器会插入它。现在，考虑以下两个示例：\n\n```java\nfinal interface\
  \ WalksOnEightLegs {}  // 无法编译\n\npublic class Biped {\n\n    public static void\
  \ main(String[] args) {\n        var e = new WalksOnTwoLegs(); // 无法编译\n    }\n\
  }\n```\n\n`WalksOnEightLegs` 接口无法编译是因为接口不能被标记为 `final`，原因与抽象类不能被标记为 `final` 的相同。将接口标记为\
  \ `final` 意味着没有任何类可以实现它。`Biped` 类无法编译，因为 `WalksOnTwoLegs` 是一个接口，不能实例化。\n\n你如何使用接口？假设我们有一个接口\
  \ `Climb`，定义如下：\n\n```java\npublic interface Climb {\n\n    Number getSpeed(int\
  \ age);\n}\n```\n\n接下来，我们有一个具体类 `FieldMouse` 实现了 `Climb` 接口，如图 7.2 所示。\n\n![Java\
  \ 脚本中接口实现的示例结构。变量包括类、implements 关键字、接口名称、逗号分隔的接口、方法签名。](img/image_rsrc10B.jpg)\n\
  \nFIGURE 7.2 实现接口\n\n在图 7.1 中，我们的接口声明包含一个抽象方法和一个常量变量。接口变量被称为常量，因为它们被假设是 `public`、`static`\
  \ 且 `final` 的。它们在声明时被初始化为常量值。由于它们是公共且 `static` 的，它们可以在接口声明之外使用，而不需要接口的实例。图 7.1 还包含一个抽象方法，该方法与接口变量一样被假设是公共的。\n\
  \n为了简洁起见，在本章中经常说“接口的实例”，是指实现该接口的类的实例。\n\n变量或方法被假设为某种类型意味着什么？接口声明中与抽象类不同的一个方面是它包含了隐式修饰符。隐式修饰符是编译器自动插入代码的修饰符。例如，接口始终被认为是\
  \ `abstract` 的，即使它没有被标记！我们稍后会详细介绍隐式修饰符的规则和示例。\n\n让我们从一个简单的例子开始。假设我们有一个接口 `WalksOnTwoLegs`，定义如下：\n\
  \n```java\npublic abstract interface WalksOnTwoLegs {}\n```\n\n它是可以编译的，因为接口并不要求定义任何方法。此示例中的\
