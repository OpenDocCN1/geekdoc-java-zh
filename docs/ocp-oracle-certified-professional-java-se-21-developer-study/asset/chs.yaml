  4:    public Primate() {\n5:      this().age = 3;\n6:    }\n7: }\n8:  public class\
  \ Orangutan {\n9:    protected int age = 4;\n10:   { age = 5; }\n11:   public Orangutan()\
  \ {\n12:     this().age = 6;\n13:   }\n14:   public static void main(String[] bananas)\
