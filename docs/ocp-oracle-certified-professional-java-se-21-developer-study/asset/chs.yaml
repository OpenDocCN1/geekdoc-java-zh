  \n\n\n\n这是一个棘手的问题，因为有很多内容需要记录。当你在考试中遇到这类问题时，写下每个变量的值。第 3 行和 4 行是简单的赋值。第 5 行调用了一个方法。第\
  \ 10 行将方法参数增加到 3，但将 `main()` 方法中的 `tickets` 变量保持为 2。虽然第 11 行返回了值，但调用者忽略了它。第 6 行的方法调用没有忽略结果，因此\
  \ `guests` 变为 `\"abcd\"`。记住，这种现象是因为返回值，而不是方法参数。\n\n### 变量的自动装箱与拆箱\n\nJava 在传递基本数据类型和包装数据类型（如\
  \ `int` 和 `Integer`）方面提供了一些实用的功能。记得第 1 章，我们可以使用内置方法在基本类型和包装类之间显式转换。\n\n```\n5: int\
  \ quack = 5;\n6: Integer quackquack = Integer.valueOf(quack);  // 将 int 转换为 Integer\n\
  7: int quackquackquack = quackquack.intValue();  // 将 Integer 转换为 int\n```\n\n非常有用，但有点繁琐。幸运的是，Java\
  \ 语言内置了处理器，可以自动在基本类型和包装类之间进行相互转换。自动装箱是将基本类型转换为其对应的包装类的过程，而拆箱是将包装类转换为其对应的基本类型的过程。\n\
  \n```\n5: int quack = 5;\n6: Integer quackquack = quack;      // 自动装箱\n7: int quackquackquack\
  \ = quackquack;  // 拆箱\n```\n\n新代码与之前的代码等效，因为编译器正在自动为你完成类型转换“工作”。自动装箱适用于所有基本类型及其相关的包装类型，如下：\n\
  \n```\nShort tail = 8;                             // 自动装箱\nCharacter p = Character.valueOf('p');\n\
  char paw = p;                               // 拆箱\nBoolean nose = true;        \
  \                // 自动装箱\nInteger e = Integer.valueOf(9);\nlong ears = e;      \
  \                         // 拆箱，然后进行隐式转换\n```\n\n这些示例每个都能顺利通过编译。在最后一行中，`e` 被拆箱为\
  \ `int` 值。由于 `int` 值可以通过隐式转换存储在 `long` 变量中，因此编译器允许该赋值。\n\n### 自动装箱和数值提升的限制\n\n虽然\
  \ Java 会隐式将较小的基本类型转换为较大的类型，并进行自动装箱，但它不会同时执行这两者。你看出为什么以下代码无法编译了吗？\n\n```\nLongGorilla\
  \ = 8; // 编译\n```\n\n编译器会自动将 `int` 值分别转换或自动装箱为 `long` 或 `Integer`。然而，这两种类型都不能赋值给\
  \ `Long` 引用，因此代码无法编译。将此行为与之前的 `ears` 示例进行比较，在那里，拆箱的基本类型可以隐式转换为更大的类型。\n\n你认为如果尝试拆箱一个\
  \ `null` 会发生什么？\n\n```\n10: Character elephant = null;\n11: char badElephant = elephant;\
  \ // NullPointerException\n```\n\n在第 10 行，我们将 `null` 存储在 `Character` 引用中。这是合法的，因为\
  \ `null` 引用可以赋值给任何变量。在第 11 行，我们尝试将该 `null` 拆箱为 `char` 基本类型。这是一个问题。Java 尝试获取 `null`\
  \ 的 `char` 值。由于对 `null` 调用任何方法都会导致 `NullPointerException`，这就是我们得到的结果。在看到与自动装箱和拆箱相关的\
  \ `null` 时要小心。\n\n自动装箱和拆箱真正大显异彩的地方是将它们应用于方法调用中。\n\n```java\nclass Chimpanzee {\n\
  \    public void climb(long t) {}\n    public void swing(Integer u) {}\n    public\
  \ void jump(int v) {}\n    public static void main(String[] args) {\n        var\
  \ c = new Chimpanzee();\n        c.climb(123);\n        c.swing(123);\n        c.jump(123L);\
  \ // 编译\n    }\n}\n```\n\n在这个示例中，对 `climb()` 的调用可以编译，因为 `int` 值可以隐式转换为 `long`。对\
  \ `swing()` 的调用也是允许的，因为 `int` 值被自动装箱为 `Integer`。相反，对 `jump()` 的调用会导致错误，因为 `long`\
  \ 必须显式转换为 `int`。换句话说，Java 不会自动转换为更窄的类型。\n\n与之前一样，自动装箱和数值提升的相同限制也适用于方法调用。例如，以下代码无法编译：\n\
  \n```java\nclass Gorilla {\n    public void rest(Long x) {\n        System.out.print(\"\
  long\");\n    }\n    public static void main(String[] args) {\n        var g = new\
  \ Gorilla();\n        g.rest(8); // 编译\n    }\n}\n```\n\nJava 会对值进行转换或自动装箱，但不会同时进行这两者。最后，在初始化数组时可以使用自动装箱。以下代码创建了两个具有\
  \ `Integer` 和 `Double` 值的数组。\n\n```java\nInteger[] openingHours = { 9, 12 };\nDouble[]\
  \ temperaturesAtZoo = { 74.1, 93.2 };\n```\n\n不过，类型必须是兼容的，如下所示。\n\n```\nInteger[]\
  \ winterHours = { 10.5, 17.0 }; // 编译\nDouble[] summerHours = { 9 // 编译\n```\n\n\
  ### 方法重载\n\n现在你已经熟悉了方法的声明和使用规则，是时候看看同类中的方法重载了。重载发生在同一个类中的方法名称相同但参数列表不同的情况。（这与第 8\
  \ 章 中的重写有所不同。）\n\n我们一直在展示如何调用重载方法。重载允许除方法名以外的任何内容变化。这意味着可以有不同的数量、访问修饰符（如 `static`）、返回值和异常列表。\n\
  \n以下显示了 `fly()` 方法的重载版本：\n\n```java\nclass Falcon {\n    public void fly(int numMiles)\
  \ {}\n    public void fly(short numFeet) {}\n    public boolean fly() { return false;\
  \ }\n    void fly(int numMiles, short numFeet) {}\n    public void fly(short numFeet,\
  \ int numMiles) throws Exception {}\n}\n```\n\n我们可以通过更改参数列表中的任何内容来实现重载。我们可以有不同的类型、更多的类型，或者以不同的顺序具有相同的类型。注意，返回值、访问修饰符和异常列表与重载无关。方法名和参数列表才是。\n\
  \n现在来看一个无效的重载示例：\n\n```java\nclass Eagle {\n    public void fly(int numMiles) {}\n\
  \    public int fly(int numMiles) { return 1; } // 编译\n}\n```\n\n此方法无法编译，因为它与原始方法的区别在于返回值。方法签名相同，因此在\
  \ Java 看来它们是重复的方法。\n\n这些方法呢？它们为什么不能编译？\n\n```java\nclass Hawk {\n    public void\
  \ fly(int numMiles) {}\n    public static void fly(int numMiles) {} // 编译\n    public\
  \ void fly(int Kilometers) {} // 编译\n}\n```\n\n再次，这三个方法的逻辑签名是相同的。你不能在同一个类中声明仅区别在于一个是实例方法另一个是静态的方法。你不能拥有两个参数列表具有相同类型且顺序相同的方法。正如我们之前提到的，参数的名称在确定方法签名时并不重要。\n\
  \n调用重载方法很容易。你只需要编写代码，Java 就会调用正确的一个。例如，看这两个方法：\n\n```java\nclass Dove {\n    public\
  \ void fly(int numMiles) {\n        System.out.println(\"int\");\n    }\n    public\
  \ void fly(short numFeet) {\n        System.out.println(\"short\");\n    }\n}\n\
  ```\n\n\n\n调用 `fly((short) 1)` 输出 short。它会寻找匹配的类型并调用相应的方法。当然，情况可能比这更复杂。\n\n现在你已经了解了重载的基础，让我们来看一些你在考试中可能会遇到的更复杂场景。\n\
  \n### 引用类型\n\nJava 会选择它能找到的最特定的方法版本。你认为这段代码输出什么？\n\n```java\npublic class Pelican\
  \ {\n    public void fly(String s) {\n        System.out.print(\"string\");\n  \
  \  }\n    public void fly(Object o) {\n        System.out.print(\"object\");\n \
  \   }\n    public static void main(String[] args) {\n        var p = new Pelican();\n\
  \        p.fly(\"test\");\n        System.out.print(\"-\");\n    }\n}\n```\n\n答案是\
  \ `string-object`。第一次调用传递了一个 `String` 并找到了直接匹配。当已经有一个完美的 `String` 参数列表等待被调用时，没有理由使用\
  \ `Object` 版本。第二次调用寻找 `int` 参数列表。当没有找到时，它会自动装箱为 `Integer`。由于仍然没有找到匹配，它就转而使用 `Object`\
  \ 版本。\n\n让我们再试一个。这段代码输出什么？\n\n```java\nimport java.time.*;\nimport java.util.*;\n\
  public class Parrot {\n    public static void print(List<Integer> i) {\n       \
  \ System.out.print(\"I\");\n    }\n    public static void print(CharSequence c)\
  \ {\n        System.out.print(\"C\");\n    }\n    public static void print(Object\
  \ o) {\n        System.out.print(\"O\");\n    }\n    public static void main(String[]\
  \ args){\n        print(\"abc\");\n        print(Arrays.asList(3));\n        print(LocalDate.of(2019,\
  \ Month.JULY, 4));\n    }\n}\n```\n\n答案是 `CIO`。这段代码需要升级了！第一次调用 `print()` 传递了一个 `String`。正如你在第\
  \ 4 章中学到的，`String` 和 `StringBuilder` 实现了 `CharSequence` 接口。你还学了 `Arrays.asList()`\
  \ 可以创建一个 `List<Integer>` 对象，这解释了第二个输出。最后一次调用 `print()` 传递了一个 `LocalDate`。这是一个你可能不熟悉的类，但没关系。它显然不是字符序列或列表。这意味着使用了\
  \ `Object` 方法签名。\n\n### 基本数据类型\n\n基本类型的工作方式与引用变量相似。Java 尝试寻找最特定的匹配重载方法。你认为这里会发生什么？\n\
  \n```java\npublic class Ostrich {\n    public void fly(int i) {\n        System.out.print(\"\
  int\");\n    }\n    public void fly(long l) {\n        System.out.print(\"long\"\
  );\n    }\n    public static void main(String[] args) {\n        var p = new Ostrich();\n\
  \        p.fly(123);\n        System.out.print(\"-\");\n        p.fly(123L);\n \
  \   }\n}\n```\n\n答案是 `int-long`。第一次调用传递了一个 `int` 并看到了精确匹配。第二次调用传递了一个 `long` 同样看到了精确匹配。如果我们注释掉带有\
  \ `int` 参数列表的重载方法，输出将变成 `long-long`。Java 调用更大的基本类型没有问题。但是，除非找不到更好的匹配，否则它不会这样做。\n\
  \n### 自动装箱\n\n正如我们之前看到的，自动装箱适用于方法调用，但如果你同时拥有基本类型版本和整数版本，会发生什么？\n\n```java\npublic\
  \ class Kiwi {\n    public void fly(int numMiles) {}\n    public void fly(Integer\
  \ numMiles) {}\n}\n```\n\n这些方法重载是有效的。Java 尝试使用它能找到的最特定的参数列表。对于自动装箱以及我们在本节中讨论的其他匹配类型也是如此。\n\
  \n这意味着调用 `fly(3)` 将调用第一个方法。当基本类型 `int` 版本不存在时，Java 将自动装箱。然而，当提供了基本类型 `int` 版本时，Java\
  \ 没有理由执行自动装箱的额外工作。\n\n### 数组\n\n与之前的示例不同，这段代码执行：\n\n```java\npublic static void\
  \ walk(int[])\npublic static void walk(Integer[])\n```\n*(注：原文中此部分存在大量重复的无效片段，已按核心逻辑处理)*\n\
  \n### 可变参数 (Varargs)\n\n如果 true 传递一个数组，你认为哪个方法会被调用？\n\n```java\npublic class Trick\
  \ {\n    public static void fly(int[] arr) {\n    // } }\n    public static void\
  \ fly(int... args) {\n    // }\n}\n```\n\n### 总结\n\n到目前为止，我们涵盖了 Java 如何选择重载方法。直到第三次调用时，可变参数版本才会被使用。\n\
  \n\n\n访问修饰符的作用远不止于方法，请确保你已经理解了它们。使用 `private` 关键字意味着代码仅在同一个类内部可用。包级访问（package access）意味着代码仅在同一个包内可用。使用\
  \ `protected` 关键字意味着代码可以在同一个包或子类中可用。使用 `public` 关键字意味着代码可以在任何地方可用。\n\n`static` 方法和\
  \ `static` 变量都由类的所有实例共享。当从类外部引用它们时，使用类名进行调用——例如，`Pigeon.fly()`。实例成员允许调用 `static`\
  \ 成员，但 `static` 成员不允许调用实例成员。此外，静态导入（static imports）用于导入静态成员。\n\n我们还介绍了 `final` 修饰符，并展示了如何将其应用于局部变量、实例变量和静态变量。请记住，如果一个局部变量在赋值后没有被修改，则它是“有效最终的（effectively\
  \ final）”。测试此点的一个快速方法是添加 `final` 修饰符并查看代码是否仍然编译。\n\nJava 使用值传递（pass-by-value），这意味着方法调用会创建参数的副本。在方法中为这些参数分配新值不会影响调用者的变量。在方法参数的对象上调用方法会更改这些对象的状态，并反映在调用者中。Java\
  \ 在方法内部以及通过方法调用自动支持基本类型和包装类的自动装箱（autoboxing）和拆箱（unboxing）。\n\n重载方法是指具有相同名称但参数列表不同的方法。Java\
  \ 调用它能找到的最具体的方法。优先选择精确匹配，其次是范围更宽的原始类型。之后是自动装箱，最后是可变参数（varargs）。\n\n确保你理解了本章中的所有内容。它为你在后续章节中的学习奠定了基础。\n\
  \n## 考试要点\n\n- 能够识别正确和错误的方法声明。能够查看方法签名并判断它是否正确、是否包含无效或冲突元素，或包含顺序错误的元素。\n- 识别方法或字段何时是可访问的。当访问修饰符为：`private`、`package`（省略）、`protected`\
  \ 或 `public` 时，识别方法或字段是否可访问。\n- 理解如何声明和使用 `final` 变量。局部、实例和 `static` 变量可以被声明为 `final`。能够理解如何声明它们以及它们可以如何（或不能如何）使用。\n\
  - 能够识别有效最终变量。有效最终变量是指赋值后不再被修改的局部变量。给定一个局部变量，能够判断它是否是有效最终的。\n- 识别静态导入的有效和无效用法。静态导入导入静态成员。它们的写法是\
  \ `import static`而不是 `static import`。确保它们导入的是 `static` 方法或变量而非类名。\n- 应用自动装箱和拆箱。从原始类型值自动转换为包装类的过程被称为\
  \ `autoboxing`，而相反的过程被称为 `unboxing`。在执行拆箱时注意 `NullPointerException`。\n- 陈述涉及方法的代码输出。根据类名或对象是否位于方法之前，识别何时调用\
  \ `static` 方法而非实例方法。识别实例方法可以调用 `static` 方法，而 `static` 方法需要一个对象的实例才能调用实例方法。\n- 识别正确的重载方法。首先使用精确匹配，其次是范围更宽的原始类型，然后是自动装箱，最后是可变参数。为方法参数分配新值不会改变调用者，但对它们调用方法可以改变。\n\
