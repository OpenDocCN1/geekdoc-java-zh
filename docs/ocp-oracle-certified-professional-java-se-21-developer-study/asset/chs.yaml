  6. `Train`\n7. 以上都不是有效的函数式接口。\n\n# 第 9 章\n\n### 集合与泛型\n\n本章涵盖的 OCP 考试目标：\n* 数组与集合的操作：\n\
  \    * 创建数组、`List`、`Set`、`Map` 和 `Deque` 集合，并对其元素进行添加、删除、更新、检索和排序。\n\n在本章中，我们将介绍考试所需的\
  \ Java 集合框架类和接口。线程安全的集合将在第 13 章“并发”中讨论。\n\n正如你可能从第 8 章“Lambda 和函数式接口”中所记得，我们涵盖了\
  \ lambda、方法引用和内置函数式接口。许多内容在本章中都会反复使用。\n\n接下来，我们将介绍 `Comparator`、`Comparable` 和排序的细节。我们还介绍了新的顺序集合（sequenced\
  \ collections）接口。最后，我们将讨论如何创建使用泛型的自定义类和方法，以便同一个类可以用于许多类型。\n\n## 使用常用的集合 API\n\n\
  集合是包含在一个对象中的对象组。Java 集合框架是 `java.util` 中用于存储集合的一组类。Java 集合框架中有四个接口。\n\n* `List`：列表是元素的有序集合，允许重复项。列表中的元素可以通过\
  \ `int` 索引访问。\n* `Set`：集合是不允许重复项的集合。\n* `Queue`：队列是允许两端访问的集合。\n* `Map`：映射是一个将键映射到值的集合。\n\
  \n图 9.1 （注：根据指令省略图像描述）\n\n### 理解泛型类型\n\n在上一章中，我们展示了使用泛型的函数式接口。但泛型是什么？在 Java 中，泛型只是表达参数化类型的一种方式。例如，`List<Integer>`\
  \ 是一个数字列表，而 `Set<String>` 是一个字符串集合。\n\n如果没有泛型，我们必须编写许多类似下面的代码：\n\n```java\nList\
  \ numbers = new ArrayList(List.of(1,2,3));\nInteger element = (Integer)numbers.get(0);\
  \ // 需要强制类型转换才能编译\nnumbers.add(\"Welcome to the zoo!\"); // 允许无关的类型\n```\n\n有了泛型，我们可以做得更好。以下更改不仅消除了之前代码中所需的强制类型转换，还防止无关对象被添加到集合中：\n\
  \n```java\nList<Integer> numbers = new ArrayList<Integer>(List.of(1,2,3));\nInteger\
  \ element = numbers.get(0); // 不需要转换\nnumbers.add(\"Welcome to the zoo!\"); // 无法编译\n\
  ```\n\n### 简化泛型代码\n\n在上一小节中，你看到了在左右两侧都声明了类型的泛型，如下：\n\n```java\nList<Integer> list\
  \ = new ArrayList<Integer>();\n```\n\n你甚至可能会看到包含其他泛型的泛型，例如：\n\n\n\n\n\n```java\n\
  Map<Long,List<Integer>> mapOfLists = new HashMap<Long,List<Integer>>();\n```\n\n\
  要写这么多重复代码真麻烦！在本节中，我们提供了两种缩短这些代码的方法。\n\n## 应用菱形运算符\n\n菱形运算符 `<>` 是一种简写符号，允许你在类型可以推断时省略语句右侧的泛型类型。它被称为菱形运算符是因为\
  \ `<>` 看起来像一个菱形。将之前的声明与这些新的、更短的版本进行比较：\n\n```java\nList<Integer> list = new ArrayList<>();\n\
  \nMap<Long,List<Integer>> mapOfLists = new HashMap<>();\n```\n\n对于编译器来说，这两个声明与之前的之前的是等价的。注意，菱形运算符不能作为变量声明中的类型。它只能用于赋值操作的右侧。例如，以下代码均无法编译：\n\
  \n```java\nList<> list = new ArrayList<Integer>();      // 无法编译\n\nclass InvalidUse\
  \ {\n  void use(List<> data) {}                // 无法编译\n}\n```\n\n## 应用 var\n\n\
  正如你在书中前面的部分看到的，你也可以使用 `var` 来缩短带有泛型的表达式。\n\n```java\nvar list = new ArrayList<Integer>();\n\
  \nvar mapOfLists = new HashMap<Long,List<Integer>>();\n```\n\n注意泛型类型又回到了右侧。这是因为\
  \ `var` 从声明的右侧推断类型，而菱形运算符是从左侧推断类型。\n\n使用哪种风格，`var` 还是菱形运算符取决于你。只需不要在 `=` 的两侧都指定泛型类型，因为那是冗余的！\n\
  \n## 同时使用两种缩写方式\n\n如果你同时使用 `var` 和菱形运算符会发生什么？\n\n```java\nvar map = new HashMap<>();\n\
  ```\n\n信不信由，这是可以编译的！如果你尝试让它们都进行推断，信息将不足，你会得到 `Object` 作为泛型类型。这等同于以下：\n\n```java\n\
  HashMap<Object, Object> map = new HashMap<Object, Object>();\n```\n\n## 添加数据\n\n\
  `add()` 方法向 `Collection` 插入新元素并返回操作是否成功。方法签名如下：\n\n```java\npublic boolean add(E\
  \ element)\n```\n\n记住 `Collections` 框架使用了泛型。你会频繁看到 `E` 的出现。它表示创建集合时使用的泛型类型。对于某些\
  \ `Collection` 类型，`add()` 总是返回 `true`。对于其他类型，则有逻辑判断 `add()` 调用是否成功。以下显示了如何使用此方法：\n\
  \n```java\n3: Collection<String> list = new ArrayList<>();\n4: System.out.println(list.add(\"\
  Sparrow\")); // true\n5: System.out.println(list.add(\"Sparrow\")); // true\n6:\n\
  7: Collection<String> set = new HashSet<>();\n8: System.out.println(set.add(\"Sparrow\"\
  )); // true\n9: System.out.println(set.add(\"Sparrow\")); // false\n```\n\n`List`\
  \ 允许重复，因此每次返回 `true`。`Set` 不允许重复。在第 9 行，我们尝试添加重复项，因此 Java 从 `add()` 方法返回了 `false`。\n\
  \n## 数据\n\n`remove()` 方法从 `Collection` 中移除单个匹配的值并返回操作是否成功。方法签名如下：\n\n```java\npublic\
  \ boolean remove(Object object)\n```\n\n这一次，布尔返回值告诉我们是否删除了匹配项。以下显示了如何使用此方法：\n\n\
  ```java\n3: Collection<String> birds = new ArrayList<>();\n4: birds.add(\"hawk\"\
  );                            // [hawk]\n5: birds.add(\"hawk\");               \
  \             // [hawk, hawk]\n6: System.out.println(birds.remove(\"cardinal\"));\
  \ // false\n7: System.out.println(birds.remove(\"hawk\"));     // true\n8: System.out.println(birds);\
  \                   // [hawk]\n```\n\n第 6 行尝试移除 `birds` 中不存在的元素。它返回 `false` 是因为没有找到该元素。第\
  \ 7 行尝试移除 `birds` 中存在的元素，因此它返回 `true`。注意，它只移除了一个匹配项。\n\n## 计数元素\n\n`isEmpty()` 和\
  \ `size()` 方法查看 `Collection` 中有多少个元素。方法签名如下：\n\n```java\npublic boolean isEmpty()\n\
  public int size()\n```\n\n以下显示了如何使用这些方法：\n\n```java\nCollection<String> birds =\
  \ new ArrayList<>();\nSystem.out.println(birds.isEmpty()); // true\nSystem.out.println(birds.size());\
  \    // 0\nbirds.add(\"hawk\");                  // [hawk]\nbirds.add(\"hawk\");\
  \                  // [hawk, hawk] (等等，原文写了两次 `birds.add(\"hawk\")`，但它是一个列表，所以我们遵循文本逻辑)\n\
  ```\n*根据文本逻辑进行的修正：*\n```java\nSystem.out.println(birds.isEmpty()); // false\nSystem.out.println(birds.size());\
  \    // 2\n```\n\n## 清空集合\n\n`clear()` 方法提供了一种丢弃 `Collection` 所有元素的简单方法。方法签名如下：\n\
  \n```java\npublic void clear()\n```\n\n以下显示了如何使用此方法：\n\n```java\nCollection<String>\
  \ list = new ArrayList<>();\nSystem.out.println(list.isEmpty()); // true\nSystem.out.println(list.size());\
  \    // 0\n```\n\n## 检查内容\n\n`contains()` 方法检查值是否在 `Collection` 中。方法签名如下：\n\n```java\n\
  public boolean contains(Object object)\n```\n\n以下显示了如何使用此方法：\n\n```java\nCollection<String>\
  \ birds = new ArrayList<>();\nbirds.add(\"hawk\");\nSystem.out.println(birds.contains(\"\
  hawk\")); // true\nSystem.out.println(birds.contains(\"robin\")); // false\n```\n\
  \n## 根据条件删除\n\n`removeIf()` 方法移除所有符合条件的元素。我们可以使用代码块或方法引用来指定要删除的内容。方法签名如下：\n\n```java\n\
  public boolean removeIf(Predicate<? super E> filter)\n```\n\n它使用 `Predicate`，该者接收一个参数并返回\
  \ `boolean`。让我们来看一个示例：\n\n```java\nCollection<String> list = new ArrayList<>();\n\
  list.add(\"Magician\");\nlist.add(\"Assistant\");\nSystem.out.println(list); //\
  \ [Magician, Assistant]\nlist.removeIf(s -> s.startsWith(\"A\"));\nSystem.out.println(list);\
  \ // [Magician]\n```\n\n## 遍历集合\n\n你可以在 `Collection` 上调用 `forEach()` 方法而不是编写循环。它使用一个接收单个参数且不返回内容的\
  \ `Consumer`。方法签名如下：\n\n```java\npublic void forEach(Consumer<? super T> action)\n\
  ```\n\n猫喜欢探索，让我们使用方法引用和 Lambda 打印出它们：\n\n```java\nCollection<String> cats = List.of(\"\
  Annie\", \"Ripley\");\ncats.forEach(System.out::println);\ncats.forEach(c -> System.out.println(c));\n\
  ```\n\n### 其他遍历方法\n\n还有其他遍历 `Collection` 的方法。例如，在第 3 章“决策”中，你见过过如何使用增强 for 循环遍历列表。\n\
  \n```java\nfor (String element: coll) {\n  System.out.println(element);\n}\n```\n\
  \n\n\n\n你可能会看到另一种较旧的方法。\n\n```java\nIterator<String> iter = coll.iterator();\nwhile(iter.hasNext())\
  \ {\n    String name = iter.next();\n    System.out.println(name);\n}\n```\n\n注意这些技术之间的区别。`hasNext()`\
  \ 方法检查是否存在下一个值。换句话说，它告诉你 `next()` 是否会在不抛出异常的情况下执行。`next()` 方法实际上会将 `Iterator` 移动到下一个元素。\n\
  \n### 确定等等性\n\n`equals()` 有自定义的实现，你可以比较两个 `Collections` 来比较它们的类型和内容。具体的实现方式各异。例如，`ArrayList`\
  \ 会检查顺序，而 `HashSet` 则不检查。\n\n```java\nboolean equals(Object object)\n```\n\n以下显示了一个示例：\n\
  \n```java\n23: var list1 = List.of(1, 2);\n24: var list2 = List.of(2, 1);\n25: var\
  \ set1 = Set.of(1, 2);\n26: var set2 = Set.of(2, 1);\n\n27:\n28: System.out.println(list1.equals(list2));\
  \  // false\n29: System.out.println(set1.equals(set2));     // true\n30: System.out.println(list1.equals(set1));\
  \   // false\n```\n\n第 28 行打印 `false` 是因为元素的顺序不同，而 `List` 是重视顺序的。相比之下，第 29 行打印 `true`\
  \ 是因为 `Set` 对顺序不敏感。最后，第 30 行打印 `false` 是因为类型不同。\n\n### 解箱空值\n\nJava 保护我们免受 `Collections`\
  \ 许多问题的影响。然而，仍然可能写出 `NullPointerException`。\n\n```java\n3: var heights = new ArrayList<Integer>();\n\
  4: heights.add(null);\n5: int h = heights.get(0);  // NullPointerException\n```\n\
  \n在第 4 行，我们向列表中添加了 `null`。这是合法的，因为 `null` 引用可以赋值给任何引用变量。在第 5 行，我们尝试将该 `null` 解箱为\
  \ `int` 原始类型。这是一个问题。Java 尝试获取 `null` 的 `int` 值。由于在 `null` 上调用任何方法都会导致 `NullPointerException`，所以我们得到的就是这个。在涉及自动装箱（autoboxing）时看到\
  \ `null` 时要小心。\n\n## 使用 List 接口\n\n现在你已经熟悉了一些常用的 `Collection` 接口方法，让我们进入特定的接口。当你需要一个可以包含重复条目的有序集合时，你会使用\
  \ `list`。例如，名称列表可能包含重复项，因为两个动物可以有相同的名称。可以根据 `int` 索引在列表的特定位置检索和插入项，就像数组一样。然而，与数组不同，许多\
  \ `List` 实现在声明后可以改变大小。\n\n`Lists` 经常被使用，是因为在编程中有很多情况你需要跟踪一个对象列表。例如，你可能会列一个在动物园想看的内容列表：首先看狮子，因为它们睡得早；其次看熊猫，因为一天晚些时候会有很长的排队；以此类推。\n\
  \n图 9.2 显示了你可以如何想象一个 `List`。`List` 的每个元素都有一个索引，且索引从零开始。\n\n![一个表格说明了列表的实现。有序索引的元素是\
  \ 0, 1, 2 等。数据类是狮子、熊猫、斑马等。](img/image_rsrc10CY.jpg)\n\n图 9.2 List 示例\n\n 有时你并不在乎列表中元素的顺序。`List`\
  \ 就像是“去那里（go to）”数据类型。当我们去商店之前列购物清单时，列表的顺序恰好是我们想到这些物品的顺序。我们可能并不依赖那个特定的顺序，但它也没有任何坏处。\n\
  \n虽然实现 `List` 接口的类有许多方法，但你只需要知道最常见的几个。幸运的是，这些方法对于可能在考试中出现的所有实现来说都是相同的。\n\n所有 `List`\
  \ 实现的共同点是它们是有序的并且允许重复的。除此之外，它们各自提供了不同的功能。我们来看一下你需要了解的实现和可用方法。\n\n![](img/image_rsrc10B8.jpg)\n\
  \n请特别注意哪些名称是类，哪些是接口。考试可能会问你对于某种场景哪个是最好的类或哪个是最好的接口。\n\n### 比较 List 实现\n\n回顾图 9.1，你需要了解两个实现\
  \ `List` 接口的类：`ArrayList` 和 `LinkedList`。`ArrayList` 就像一个可调整大小的数组。当添加元素时，`ArrayList`\
  \ 会自动增长。当你不确定使用哪种集合时，请使用 `ArrayList`。\n\n`ArrayList` 的主要优势是你可以在常数时间内查找任何元素。添加或删除元素比访问元素慢。这使得当你读取\
  \ `ArrayList` 的频率高于（或等于）写入的频率时，`ArrayList` 是一个很好的选择。\n\n`LinkedList` 是特殊的，因为它同时实现了\
  \ `List` 和 `Deque`。`LinkedList` 的主要优势是你可以以常数时间访问、添加或删除头部或尾部。权衡是处理任意索引需要线性时间。这使得当你将\
  \ `List` 用作 `Deque` 时，`LinkedList` 是一个很好的选择。\n\n### 创建 List 的工厂方法\n\n当你创建一个 `ArrayList`\
  \ 或 `LinkedList` 时，你需要知道这种类型。有些方法可以让你创建列表。这在测试时非常方便。\n\n表 9.1 创建列表的工厂方法\n\n| 方法\
  \ | 说明 | 可以添加元素 | 可以替换元素 | 可以删除元素 |\n| :--- | :--- | :--- | :--- | :--- |\n| `Arrays.asList(varargs)`\
  \ | 返回由数组支持的大小列表 | 否 | 是 | 否 |\n| `List.of(varargs)` | 返回不可变列表 | 否 | 否 | 否 |\n|\
  \ `List.copyOf(collection)` | 返回原始集合的不可变列表 | 否 | 否 | 否 |\n\n```java\n16: String[]\
  \ array = new String[] {\"a\", \"b\", \"c\"};\n17: List<String> asList = Arrays.asList(array);\
  \ // [a, b, c]\n18: List<String> of = List.of(array);           // [a, b, c]\n19:\
  \ List<String> copy = List.copyOf(asList);      // [a, b, c]\n20:\n21: array[0]\
  \ = \"z\";\n22:\n23: System.out.println(asList); // [z, b, c]\n24: System.out.println(of);\
  \    // [a, b, c]\n25: System.out.println(copy);  // [a, b, c]\n26:\n27: asList.set(0,\
  \ \"x\");\n28: System.out.println(Arrays.toString(array)); // [x, b, c]\n```\n\n\
  第 17 行创建了一个由数组支持的 `List`。第 21 行更改了数组，第 23 行反映了这一变化。第 27 行和 28 行显示了相反的情况，更改 List\
  \ 会更新数组。第 18 行和 19 行创建的都是不可变对象。\n\n### 使用构造函数创建 List\n\n大多数集合都有两个你考试需要知道的构造函数。以下是\
  \ `LinkedList` 的示例：\n\n```java\nvar linked1 = new LinkedList<String>();\nvar linked2\
  \ = new LinkedList<String>(linked1);\n```\n\n\n\n第一种是创建一个包含所有默认值的空 `LinkedList`。第二种是告诉\
  \ Java 我们想创建另一个 `LinkedList` 的副本。诚然，在这个例子中 `linked1` 是空的，所以它并不特别有趣。\n\n`ArrayList`\
  \ 有一个你需要知道的额外构造函数。现在我们展示这三个构造函数。\n\n```java\nvar list1 = new ArrayList<String>();\n\
  var list2 = new ArrayList<String>(list1);\nvar list3 = new ArrayList<String>(10);\n\
  ```\n\n前两个是你对所有 `Collections` 都需要了解的常用构造函数。最后一个示例是创建一个包含特定数量槽位的 `ArrayList`，但同样没有分配任何元素。你可以将其理解为底层数组的大小。\n\
  \n### 使用 List 方法操作\n\n`List` 接口中的方法用于处理索引。除了继承的 `Collection` 方法外，为了考试，你还应该了解表 9.2\
  \ 中的方法。\n\nTABLE 9.2 List 方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `boolean add(E element)`\
  \ | 将元素添加到末尾（所有 Collection API 均可用）。 |\n| `void add(int index, E element)` | 在索引处添加元素，并将其余元素向后移动。\
  \ |\n| `E get(int index)` | 返回索引处的元素。 |\n| `int indexOf(Object o)` | 返回第一个匹配元素的索引，如果未找到则返回\
  \ -1。 |\n| `int lastIndexOf(Object o)` | 返回最后一个匹配元素的索引，如果未找到则返回 -1。 |\n| `E remove(int\
  \ index)` | 索引处的元素，并将其余元素向前移动。 |\n| `default void replaceAll(UnaryOperator<E> op)`\
  \ | 将列表中的每个元素替换为运算符的结果。 |\n| `E set(int index, E e)` | 替换索引处的元素并返回原始元素。如果索引无效，则抛出\
  \ `IndexOutOfBoundsException`。 |\n| `default void sort(Comparator<? super E> c)`\
  \ | 排序列表。我们将在本章节稍后在“数据排序”部分中讨论此内容。 |\n\n以下语句演示了大部分这些操作 `List` 的方法：\n\n```java\n\
  3: List<String> list = new ArrayList<>();\n4: list.add(\"SD\");                //\
  \ [SD]\n5: list.add(0, \"NY\");             // [NY,SD]\n6: list.set(1, \"FL\");\
  \             // [NY,FL]\n7: System.out.println(list.get(0)); // NY\n8: list.remove(\"\
  NY\");             // [FL]\n9: list.remove(0);                // []\n10: list.set(0,\
  \ \"?\");              // IndexOutOfBoundsException\n```\n\n在第 3 行，`list` 是空的。第\
  \ 4 行在列表末尾添加了一个元素。第 5 行在索引 0 处添加了一个元素，这会将原始的索引 0 推到索引 1。注意 `ArrayList` 现在自动变大了一个。第\
  \ 6 行用新值替换索引 1 处的元素。\n\n第 7 行使用 `get()` 方法打印特定索引处的元素。第 8 行删除匹配 `NY` 的元素。最后，第 9 行删除了索引\
  \ 0 处的元素，`list` 再次为空。\n\n第 10 行抛出了 `IndexOutOfBoundsException`，因为 `List` 中没有元素。由于没有元素可以替换，即使是索引\
  \ 0 也不允许。如果将第 10 行移到第 4 行和第 5 行之间，调用将成功。\n\n如果你用 `LinkedList` 尝试这些示例，输出将是相同的。虽然代码效率会降低，但在你拥有非常大的列表之前，这种差异是不明显的。\n\
  \n现在让我们来看 `replaceAll()` 方法。它使用了一个接受一个参数并返回相同类型值的 `UnaryOperator`。\n\n```java\n\
  var numbers = Arrays.asList(1, 2, 3);\nnumbers.replaceAll(x -> x*2);\nSystem.out.println(numbers);\
  \   // [2, 4, 6]\n```\n\n这个 lambda 表达式将列表每个元素的值翻倍。`replaceAll()` 方法对列表的每个元素调用该 lambda，并替换该索引处的值。\n\
  \n### 重载的 `remove()` 方法\n\n我们现在看到了两个重载的 `remove()` 方法。来自 `Collection` 的删除与参数匹配的对象。相比之下，来自\
  \ `List` 的删除指定索引处的元素。\n\n当你使用 `Integer` 类型时，情况会变得复杂。你认为以下代码会打印什么？\n\n```java\n31:\
  \ var list = new LinkedList<Integer>();\n32: list.add(3);\n33: list.add(3);\n34:\
  \ list.add(1);\n35: list.remove(2);\n36: list.remove(Integer.valueOf(2));\n37: System.out.println(list);\n\
  ```\n\n\n\n再次查看图 9.1，你需要了解实现 `Set` 接口的三个类：`HashSet`、`LinkedHashSet` 和 `TreeSet`。`HashSet`\
  \ 将其元素存储在哈希表中，这意味着键是一个哈希值，而值是一个 `Object`。这意味着 `HashSet` 使用对象的 `hashCode()` 方法来更高效地检索它们。请记住，一个有效的\
  \ `hashCode()` 并不意味着每个对象都会获得一个唯一的值，但该方法通常被写成让哈希值分布在很大的范围内，以减少冲突。\n\n`LinkedHashSet`\
  \ 基本上是一个在其元素上运行着一个虚拟 `LinkedList` 的 `HashSet`。这允许你按照一个定义的相遇顺序（encounter order）遍历集合，该顺序通常是元素被插入的顺序。尽管如此，`LinkedHashSet`\
  \ 还包含了从集合的头部或尾部添加/删除元素的方法，允许你根据需要更改顺序。\n\n最后，`TreeSet` 将其元素存储在排序的树形结构中。它的主要优势是集合始终处于排序状态。代价是添加或删除元素所需的时间可能比\
  \ `HashSet` 更长，特别是当树变得越来越大时。\n\n图 9.4 展示了你可以如何想象这三个类的存储方式。`HashSet` 在现实中更为复杂，但对于考试目的来说足够了。\n\
  \n![一张图片展示了集合的三类示例。HashSet 将其元素存储在哈希表中，哈希值分别为 pandas 的 -995544615、zebras 的 -705903059\
  \ 和 lions 的 102978519。linkedhash set 在 pandas、lion 和 zebra 的元素之间包含一个链链。treeset 形成了一个元素的树形结构。](img/image_rsrc10D.jpg)\n\
  \n图 9.4 集合的示例\n\n对于考试，你不需要知道如何创建一个哈希集合类或树集合类（实现可能非常复杂）。呼！你只需要知道如何使用它们了！\n\n### 使用\
  \ Set 方法\n\n就像 `List` 一样，你可以用一行代码创建一个不可变的 `Set`，或者对现有的集合进行复制。\n\n```java\nSet<Character>\
  \ letters = Set.of('c', 'a', 't');\nSet<Character> copy = Set.copyOf(letters);\n\
  ```\n\n这些就是你考试针对 `Set` 接口需要知道的全部额外方法！你必须知道集合相对于传统的 `Collection` 方法时的行为。你还需要知道不同类型集合之间的区别。让我们从\
  \ `HashSet` 开始。\n\n```java\n3: Set<Integer> set = new HashSet<>();\n4: boolean b1\
  \ = set.add(66);  // true\n5: boolean b2 = set.add(10);  // true\n6: boolean b3\
  \ = set.add(66);  // false\n7: boolean b4 = set.add(8);   // true\n8: for (Integer\
  \ value: set)\n9:     System.out.print(value + \",\"); // 66,8,10,\n```\n\n`add()`\
  \ 方法应该是直观的。除非 `Integer` 已经在集合中，否则它们返回 `true`。第 6 行返回 `false`，因为集合中已经有了 `66`，而集合必须保持唯一性。第\
  \ 8 行以任意顺序打印集合中的元素。在这种情况下，它恰好不是排序顺序，也不是我们添加元素的顺序。\n\n请记住 `equals()` 方法用于判断等等性。`hashCode()`\
  \ 方法用于知道应该在哪个桶桶，这样 Java 就不需要遍历整个集合来确定对象是否存在。最好的情况是哈希值是唯一的，Java 只需要对一个对象调用 `equals()`。最坏的情况是所有实现都返回相同的\
  \ `hashCode()`，此时 Java 仍然必须对集合中的每个元素调用 `equals()`。\n\n让我们用 `LinkedHashSet` 替换第 3\
  \ 行，看看输出会有什么变化。\n\n```java\n3: Set<Integer> set = new LinkedHashSet<>();\n```\n\n\
  这一次，代码按照元素插入的顺序打印元素。\n\n`66,10,8,`\n\n最后，我们可以在第 3 行使用 `TreeSet`。\n\n```java\n3:\
  \ Set<Integer> set = new TreeSet<>();\n```\n\n元素现在按照它们的自然排序顺序打印出来。\n\n`8,10,66,`\n\
  \n数字包装类型实现了 Java 中的 `Comparable` 接口，该接口用于排序。在章节的后续部分，你将学习如何创建自己的 `Comparable` 对象。\n\
  \n### 使用 Queue 和 Deque 接口\n\n当元素按特定顺序添加和删除时，你会使用 `Queue`。你可以将队列想象成一条队。例如，当你想进入体育场而有人在排队时，你就站在那个人后面。如果你是英国人，你就会排在那个人后面，这真的非常好记！这是一个\
  \ FIFO（先入先出）队列。\n\n`Deque`（双端队列，通常读作“deck”）扩展了 `Queue`，但它与普通队列的不同之处在于，你可以从头部（head）和尾部（tail）插入和移除元素。想象：“Woodie\
  \ Flowers 博士，立刻到最前面去！你是唯一受到这种特殊对待的人。”\n\n\n\n这更为复杂，因此我们使用图 9.6 来显示代码在每个步骤中队列的状态。\n\
  \n第 13 行和第 14 行分别成功地将元素添加到队列的头部和尾部。某些队列的大小有限，这会导致向队列添加元素失败。在考试中你不会遇到这种情况。第 15 行查看队列中的第一个元素，但没有移除它。第\
  \ 16 行和第 17 行从队列中移除元素，每端一个。这导致队列为空。第 18 行和第 19 行尝试查看队列的第一个元素，结果为 null。\n\n除了 FIFO（先进先出）队列外，还有\
  \ LIFO（后进先出）队列，通常被称为栈。想象一叠盘子。你总是从栈的顶部添加或移除盘子，以避免混乱。幸运的是，我们可以使用相同的双端队列实现。为了清晰起见，使用了不同的方法，如表\
  \ 9.5 所示。\n\n![图像说明了 Java 脚本中代码的队列步骤。第 13 行和第 14 行将元素添加到队列的前部和后面，第 15 行查看队列中的第一个元素，第\
  \ 16 行和第 17 行从队列中移除元素，每端一个，第 18 行和第 19 行查看队列的第一个元素，结果为 null。](img/image_rsrc10D2.jpg)\n\
  \n图 9.6 使用 Deque\n\n表 9.5 将 Deque 作为栈\n\n| 功能 | 方法 |\n| --- | --- |\n| 添加到头部/顶部\
  \ | `void push(E e)` |\n| 从头部/顶部移除 | `E pop()` |\n| 获取第一个元素 | `E peek()` |\n\n让我们尝试另一种使用\
  \ `Deque` 作为栈的方法：\n\n\n\n```\nDeque<Integer> stack = new ArrayDeque<>();\n```\n\n\
  这次，图 9.7 显示了代码在每个步骤中栈的状态。第 13 行和第 14 行成功地将元素放在栈的头部/顶部。其余代码也查看了头部。\n\n![图像说明了 Java\
  \ 脚本中代码的栈步骤。第 13 行和第 14 行将元素放在栈的头部或顶部。其余代码也查看了头部](img/image_rsrc10D3.jpg)\n\n图 9.7\
  \ 使用栈\n\n在使用 `Deque` 时，确定它是被用作 FIFO 队列、LIFO 栈还是双端队列是非常重要的。回顾一下，FIFO 队列就像一排队的人。你从后面上队，从前面离开。LIFO\
  \ 栈就像一叠盘子。你把盘子放在顶部，并从顶部取下。双端队列同时使用两个端。\n\n## 使用 Map 接口\n\n当你想要通过键来标识值时，就会使用 `Map`。例如，当你使用手机中的联系人列表时，你查找“George”，而不是逐个查看每个电话号码。\n\
  \n你可以想象如图 9.8 所示的 `Map`。你不需要知道不同 map 实现的特定接口名称，但你确实需要知道 `LinkedHashMap` 是有序的而 `TreeMap`\
  \ 是排序的。\n\n![map 接口的示例结构。key 和 maps 是 map 的两个变量。key 的元素是 george 和 may，对应的值分别是 555-555-5555\
  \ 和 777-777-7777。](img/image_rsrc10D4.jpg)\n\n图 9.8 Map 示例\n\n所有 `Map` 类的共同点是它们都拥有键（keys）和值（values）。除此之外，它们各提供不同的功能。我们来看你需要了解的实现和可用方法。\n\
  \n### Map.of() 和 Map.copyOf()\n\n就像 `List` 和 `Set` 一样，有一个工厂方法来创建 `Map`。你可以传递最多 10\
  \ 组键值对。\n\n```\nMap.of(\"key1\", \"value1\", \"key2\", \"value2\");\n```\n\n与 `List`\
  \ 和 `Set` 不同，这种方式并不理想。传递键和值的可读性较差，因为你必须记住哪个参数对应哪个。幸运的是，有一种更好的方法。`Map` 还提供了一个方法允许你提供键值对。\n\
  \n```\nMap.ofEntries(\n    Map.entry(\"key1\", \"value1\"),\n    Map.entry(\"key2\"\
  , \"value2\"));\n```\n\n现在我们不能忘记传递值。如果漏掉一个参数，`entry()` 方法将无法编译。方便的是，`Map.copyOf(map)`\
  \ 的作用与 `List` 和 `Set` 接口的 `copyOf()` 方法一样。\n\n### 比较 Map 实现\n\n从图 9.1 来看，`HashMap`、`LinkedHashMap`\
  \ 和 `TreeMap` 是实现 `Map` 接口的类。`HashMap` 使用哈希表。`LinkedHashMap` 支持插入顺序。`TreeMap` 按排序顺序存储。\n\
  \n### 使用 Map\n\n表 9.6 这是一个很长的方法列表，不用担心；很多方法都是直观的。例如，`containsKey()` 可以替换 `get()`\
  \ 调用。使用哪种取决于你。\n\n| 方法 | 说明 |\n| --- | --- |\n| `clear()` | 清除所有键和值。 |\n| `containsKey(Object\
  \ key)` | 返回键是否存在于 map 中。 |\n| `containsValue(Object value)` | 返回值是否存在于 map 中。 |\n\
  | `entrySet()` | 返回键值对的集合。 |\n| `forEach(BiConsumer<K, V> action)` | 遍历每个键值对。 |\n\
  | `get(Object key)` | 返回键映射的值，若无则返回 null。 |\n| `getOrDefault(Object key, V defaultValue)`\
  \ | 返回键映射的值，若无则返回默认值。 |\n| `isEmpty()` | 返回 map 是否为空。 |\n| `keySet()` | 返回所有键的集合。\
  \ |\n| `merge(K key, V value, BiFunction<V, V, V> func)` | 如果键不存在则设置值；如果键已存在则运行函数。\
  \ |\n| `put(K key, V value)` | 添加或替换键值对。返回之前的值或 null。 |\n| `putIfAbsent(K key, V\
  \ value)` | 如果键不存在则添加值并返回 null。否则，返回现有值。 |\n| `remove(Object key)` | 并返回键映射的值。 |\n\
  | `replace(K key, V value)` | 如果键设置则替换值。返回原始值或 null。 |\n| `replaceAll(BiFunction<K,\
  \ V, V> func)` | 用函数的结果替换每个值。 |\n| `size()` | 返回 map 中条目（键值对）的数量。 |\n| `values()`\
  \ | 返回所有值的集合。 |\n\n### 调用基础方法\n\n让我们先比较一下每个 Map 类的行为。考虑以下方法：\n\n```\nvoid addElementsAndPrint(Map<String,\
  \ String> map) {\n    map.put(\"koala\", \"bamboo\");\n    map.put(\"lion\", \"\
  meat\");\n    map.put(\"giraffe\", \"leaf\");\n    String food = map.get(\"koala\"\
  ); // bamboo\n    for (String key: map.keySet()) {\n        System.out.print(key\
  \ + \",\");\n    }\n}\n```\n\n在这里我们使用 `put()` 方法向 map 中添加键值对，并使用 `get()` 根据键获取值。我们还使用了\
  \ `keySet()` 方法获取所有键。然后我们可以将此方法应用于我们的三个 Map 类。\n\n```\naddElementsAndPrint(new HashMap<>());\
  \ // koala,giraffe,lion,\n```\n\n\n\n\n```java\naddElementsAndPrint(new LinkedHashMap<>());\
  \  // koala,lion,giraffe,\naddElementsAndPrint(new TreeMap<>());        // giraffe,koala,lion,\n\
  ```\n\n正如我们在 `Set` 类中看到的那样，`HashMap` 使用键的 `hashCode()` 按照任意顺序打印元素。`LinkedHashMap`\
  \ 按照元素插入的顺序打印元素。最后，`TreeMap` 根据键的顺序打印元素。\n\n使用我们的 `HashMap` 实例，我们可以尝试一些布尔值检查。\n\n\
  ```java\nSystem.out.println(map.containsKey(\"lion\"));    // true\nSystem.out.println(map.containsValue(\"\
  lion\"));  // false\nSystem.out.println(map.size());               // 3\nmap.clear();\n\
  System.out.println(map.size());               // 0\nSystem.out.println(map.isEmpty());\
  \            // true\n```\n\n前两行显示了键和值是分开进行检查的。我们可以看到 map 中有三个键值对。然后我们清空了 map 内容，发现元素数量为零且它是空的。\n\
  \n你发现（为什么这段代码无法编译了吗？\n\n```java\nSystem.out.println(map.contains(\"lion\"));   \
  \   // DOES NOT COMPILE\n```\n\n它无法编译是因为 `contains()` 方法存在 `Collection` 接口中，而不是\
  \ `Map` 接口中。在接下来的章节中，我们将展示一些你可能不太熟悉的 `Map` 方法。\n\n### 遍历 Map\n\n你之前在本章中看到过 `forEach()`\
  \ 方法。请注意它在 `Map` 上的工作方式略有不同。这一次，`forEach()` 方法使用的 lambda 有两个参数：键和值。让我们来看这个示例：\n\n\
  ```java\nMap<Integer, Character> map = new HashMap<>();\nmap.put(1, 'a');\nmap.put(2,\
  \ 'b');\nmap.put(3, 'c');\nmap.forEach((k, v) -> System.out.println(v));\n```\n\n\
  该 lambda 同时将键和值作为参数。它恰好打印了值，但也可以对键和/或值进行任何操作。有趣的是，由于我们不在乎键，这段特定的代码可以使用 `values()`\
  \ 方法和方法引用来编写。\n\n```java\nmap.values().forEach(System.out::println);\n```\n\n遍历\
  \ map 中数据的另一种方法是使用 `entrySet()`，它返回一个包含 `Map.Entry<K, V>` 对象的集合。如果这个类型看起来有点奇怪，别担心！这只是在对象中存储键值对的一种高级方式。它提供了检索每个值对的键和值的方法。\n\
  \n```java\nmap.entrySet().forEach(e ->\n    System.out.println(e.getKey() + \" \"\
  \ + e.getValue()));\n```\n\n在这种情况下，每个元素 `e` 的类型为 `Map.Entry<Integer, Character>`。\n\
  \n### 安全地获取值\n\n如果请求的键不在 map 中，`get()` 方法将返回 `null`。有时你可能希望返回不同的值。幸运的是，`getOrDefault()`\
  \ 方法让这变得简单。让我们比较一下这两个方法。\n\n```java\n3: Map<Character, String> map = new HashMap<>();\n\
  4: map.put('x', \"spot\");\n5: System.out.println(\"X marks the \" + map.get('x'));\n\
  6: System.out.println(\"X marks the \" + map.getOrDefault('x', \"\"));\n7: System.out.println(\"\
  Y marks the \" + map.get('y'));\n8: System.out.println(\"Y marks the \" + map.getOrDefault('y',\
  \ \"\"));\n```\n\n这段代码输出如下：\n```\nX marks the spot\nX marks the spot\nY marks the\
  \ null\nY marks the\n```\n\n你可以看到，第 5 行和第 6 行输出相同，因为当键存在时，`get()` 和 `getOrDefault()`的行为相同。它们返回该键映射的值。第\
  \ 7 行和第 8 行输出不同，说明当键不存在时，`get()` 返回 `null`。相比之下，`getOrDefault()` 返回了我们作为参数传递的空字符串。\n\
  \n### 替换值\n\n这些方法与 `List` 版本相似，区别在于涉及到键：\n\n```java\n21: Map<Integer, Integer> map\
  \ = new HashMap<>();\n22: map.put(1, 2);\n23: map.put(2, 4);\n24: Integer original\
  \ = map.replace(2, 10); // 4\n25: System.out.println(map);    // {1=2, 2=10}\n26:\
  \ map.replaceAll((k, v) -> k + v);\n27: System.out.println(map);    // {1=3, 2=12}\n\
  ```\n\n第 24 行替换了键 2 的值并返回原始值。第 26 行调用了一个函数，并将 map 中每个元素的值设置为该函数的结果。在我们的例子中，我们将键和值相加了。\n\
  \n注意，如果 map 不包含该键，`replace()` 和 `replaceAll()` 不修改 map。与 `put()` 相比，`put()` 总是尝试设置一个值。\n\
  \n### 如果不存在则放入\n\n`putIfAbsent()` 方法在 map 中设置一个值，但如果该值已经设置为非空值，则会跳过。\n\n```java\n\
  Map<String, String> map = new HashMap<>();\nmap.putIfAbsent(\"key\", \"value\");\n\
  map.putIfAbsent(\"key\", \"newvalue\");\n```\n\n\n\n\n\n| 不在 map 中 | N/A (未调用映射函数)\
  \ | 直接将带有值参数的键添加到 map 中，而不调用映射函数。 |\n\n## 数据排序\n\n我们讨论了 `TreeSet` 和 `TreeMap` 类的“顺序”问题。对于数字，顺序显而易见——即数值顺序。对于\
  \ `String` 对象，顺序根据 Unicode 字符映射定义。\n\n![](img/image_rsrc10B8.jpg)\n\n还记得第 4 章 中“核心\
  \ API”里的 7Up 吗？在处理 `String` 时，数字在字母之前，大写字母在小写字母之前。\n\n我们在这些许多示例中使用了 `Collections.sort()`。它返回\
  \ `void`，因为方法的参数就是被排序的对象。\n\n你也可以对自己创建的对象进行排序。Java 提供了一个名为 `Comparable` 的接口。如果你的类实现了\
  \ `Comparable`，它就可以用于需要比较的数据结构中。事实上，你已经在书中见过许多实现 `Comparable` 类，包括 `String`、`StringBuilder`、`BigDecimal`、`BigInteger`\
  \ 以及基本类型包装类。还有一个名为 `Comparator` 的类，用于指定你想使用一种与对象本身提供的不同的顺序。\n\n`Comparable` 和 `Comparator`\
  \ 足够相似，以至于产生误导。考试喜欢测试是否能诱导你混淆两者。不要被困扰！在本节中，我们先讨论 `Comparable`。然后当我们介绍 `Comparator`\
  \ 时，我们会指出所有的区别。\n\n### 创建一个 Comparable 类\n\n`Comparable` 接口只有一个方法。事实上，这就是整个接口：\n\
  \n```java\npublic interface Comparable<T> {\n    int compareTo(T o);\n}\n```\n\n\
  泛型 `T` 允许你实现此方法并指定你的对象的类型。这让你在实现 `compareTo()` 时可以避免了强制类型转换。任何对象都可以是 `Comparable`\
  \ 的。例如，我们有一群鸭子并想按名称对它们进行排序。首先，我们创建一个继承 `Comparable<Duck>` 的记录，然后实现 `compareTo()`\
  \ 方法。\n\n```java\npublic record Duck(String name) implements Comparable<Duck> {\n\
  \    public int compareTo(Duck d) {\n        return name.compareTo(d.name);  //\
  \ 按名称升序排序\n    }\n}\n```\n\n接下来，我们可以如下所示排序鸭子：\n\n```java\n11: var ducks = new ArrayList<Duck>();\n\
  12: ducks.add(new Duck(\"Quack\"));\n13: ducks.add(new Duck(\"Puddles\"));\n14:\
  \ Collections.sort(ducks);  // 按名称排序\n15: System.out.print(ducks);  // [Duck[name=Puddles],\
  \ Duck[name=Quack]]\n```\n\n如果我们没有实现 `Comparable` 接口，我们拥有的只有一个名为 `compareTo()` 的方法，而\
  \ 14 行将无法编译。我们也可以为 `T` 实现 `Comparable<Object>` 或其他类，但对于排序一组 `Duck` 对象来说没有那么用。\n\n\
  最后，`Duck` 类实现了 `compareTo()`。由于 `Duck` 比较的是 `String` 类型的对象，而 `String` 类已经有 `compareTo()`\
  \ 方法，因此它可以直接进行委托。\n\n![](img/image_rsrc10B8.jpg)\n\n你可能已经注意到我们这里使用了 record（记录）。从第\
  \ 7 章“超越类”开始，record 提供了许多有用的模板代码，如构造函数和 `toString()` 的有意义实现。记住，record 和类都可以实现 `Comparable`。\n\
  \n#### 设计 compareTo() 方法\n\n在在上一个示例中，我们依赖于内置的 `String compareTo()` 方法，但很多时候你需要创建自己的方法。在编写\
  \ `compareTo()` 方法时，最重要的部分是返回值。以下规则适用于你的 `compareTo()` 方法的返回值：\n\n*   当当前对象等同于 `compareTo()`\
  \ 的参数时，返回数字 `0`。\n*   当当前对象小于 `compareTo()` 的参数时，返回一个负数（小于 `0`）。\n*   当当前对象大于 `compareTo()`\
  \ 的参数时，返回一个正数（大于 `0`）。\n\n让我们来看一个 `compareTo()` 的实现，它比较的是数字而不是 `String` 对象：\n\n\
  ```java\n2: public record ZooDuck(int id, String name) implements Comparable<ZooDuck>\
  \ {\n3:     public int compareTo(ZooDuck d) {\n4:         return id - d.id;  //\
  \ 按 id 升序排序\n5:     }\n6: }\n```\n\n第 4 行显示了比较两个 `int` 值的一种方法。我们可以使用 `Integer.compare(id,\
  \ d.id)`，但我们想向你展示如何创建自己的方法。确保你能识别这两种方法。记住 `id - d.id` 是升序排序，而 `d.id - id` 是降序排序。\n\
  \n让我们在代码中尝试这个新方法：\n\n```java\n21: var d1 = new ZooDuck (5, \"Daffy\");\n22: var\
  \ d2 = new ZooDuck(7, \"Donald\");\n23: System.out.println(d1.compareTo(d2));  //\
  \ -2\n24: System.out.println(d1.compareTo(d1));  // 0\n25: System.out.println(d2.compareTo(d1));\
  \  // 2\n```\n\n第 23 行比较了一个较小的 `id` 和较大的 `id`，因此打印出一个负数。第 24 行比较同一个对象，因此打印 `0`。第\
  \ 25 行比较了一个较大的 `id` 和较小的 `id`，因此打印出一个正数。\n\n#### 强制转换 compareTo() 参数\n\n在处理 `Comparable`\
  \ 且不使用泛型的代码时，`compareTo()` 需要一个 `Object`。\n\n```java\npublic record LegacyDuck(String\
  \ name) implements Comparable {\n    public int compareTo(Object obj) {\n      \
  \  if (obj instanceof LegacyDuck d) {\n            return name.compareTo(d.name);\n\
  \        }\n        throw new IllegalArgumentException(\"Not a duck\");\n    }\n\
  }\n```\n\n#### 检查 null\n\n在本章中处理 `Comparable` 时，我们假设数据有值，但情况并非如此。\n\n```java\npublic\
  \ record MissingDuck(String name) implements Comparable<MissingDuck> {\n    public\
  \ int compareTo(MissingDuck quack) {\n        if (quack == null) {\n           \
  \ throw new IllegalArgumentException(\"Poorly formed!\");\n        }\n        if\
  \ (name == null && quack.name == null) {\n            return 0;\n        } else\
  \ if (name == null) {\n            return -1;\n        } else if (quack.name ==\
  \ null) {\n            return 1;\n        } else return name.compareTo(quack.name);\n\
  \    }\n}\n```\n\n#### 保持 compareTo() 和 equals() 一致\n\n如果你编写了一个实现 `Comparable` 的类，你就引入了新的相等判断逻辑。`compareTo()`\
  \ 方法在两个对象相等时返回 `0`，而你的 `equals()` 方法在两个对象相等时返回 `true`。如果使用 `compareTo()` 的自然排序，当且仅当\
  \ `x.compareTo(y)` 等于 `0` 时 `x.equals(y)` 为 `true`，则称该排序与 `equals` 是一致的。\n\n同样，当\
  \ `x.compareTo(y)` 不为 `0` 时，`x.equals(y)` 必须为 `false`。强烈建议让你的 `Comparable` 类与 `equals`\
  \ 保持一致，因为如果 `compareTo()` 和 `equals()` 方法不一致，并不是所有类的行为都是可预测的。\n\n例如，接下来的 `Product`\
  \ 类定义了一个与 `equals` 不一致的 `compareTo()` 方法：\n\n```java\npublic class Product implements\
  \ Comparable<Product> {\n    private int id;\n    private String name;\n\n    public\
  \ int hashCode() { return id; }\n\n    public boolean equals(Object obj) {\n   \
  \     if (obj instanceof Product other) {\n            return this.id == other.id;\n\
  \        }\n        return false;\n    }\n\n    public int compareTo(Product obj)\
  \ {\n        return this.name.compareTo(obj.name);\n    }\n}\n```\n\n该类通过 `id` 检查相等性，但按\
  \ `name` 排序。假设名称不是唯一的，这意味着可能有很多元素对，其 `compareTo()` 返回 `0`，但 `equals()` 返回 `false`。\n\
  \n\n\n\n有时你想对一个没有实现 `Comparable` 的对象进行排序，或者你想在不同时间以不同的方式对对象进行排序。假设我们给 `Duck` 类增加了重量。\n\
  \n```java\npublic record Duck(String name, int weight) implements Comparable<Duck>\
  \ {\n    public int compareTo(Duck d) {\n        return name.compareTo(d.name);\n\
  \    }\n    public String toString() { return name; }\n}\n```\n\n我们还重写了 `toString()`，以便我们的下次输出更短。现在我们有了以下代码：\n\
  \n```java\nComparator<Duck> byWeight = new Comparator<>() {\n    public int compare(Duck\
  \ d1, Duck d2) {\n        return d1.weight() - d2.weight();\n    }\n};\nvar ducks\
  \ = new ArrayList<Duck>();\nducks.add(new Duck(\"Quack\", 7));\nducks.add(new Duck(\"\
  Puddles\", 10));\nCollections.sort(ducks);\nSystem.out.println(ducks);  // [Puddles,\
  \ Quack]\nCollections.sort(ducks, byWeight);\nSystem.out.println(ducks);  // [Quack,\
  \ Puddles]\n```\n\n`Duck` 类本身只能定义一个 `compareTo()` 方法。在这种情况下，选择了 `name`。如果我们想按其他内容排序，就必须在\
  \ `compareTo()` 方法外部使用单独的类或 Lambda 表达式来定义排序顺序。\n\n第 11–15 行显示了如何使用匿名类定义 `Comparator`。在第\
  \ 19–22 行，我们先用类的内部 `Comparator` 排序，然后使用单独 `Comparator` 排序，以查看输出的差异。\n\n`Comparator`\
  \ 是一个函数接口，因为它只有一个抽象方法需要实现。这意味着我们可以使用 Lambda 表达式重写第 11–15 行的 `Comparator`，如下：\n\n\
  ```java\nComparator<Duck> byWeight = (d1, d2) -> d1.weight()-d2.weight();\n```\n\
  \n或者，我们可以使用方法引用和辅助方法来指定我们要按重量排序。\n\n```java\nComparator<Duck> byWeight = Comparator.comparing(Duck::weight);\n\
  ```\n\n在这个示例中，`Comparator.comparing()` 是一个静态接口方法，它根据 Lambda 表达式或方法引用创建一个 `Comparator`。很方便，不是吗？\n\
  \n### Comparable 是函数接口吗？\n\n我们说过 `Comparator` 是函数接口，因为它只有一个抽象方法。`Comparable` 也是函数接口，因为它也只有一个抽象方法。然而，为\
  \ `Comparable` 使用 Lambda 是愚蠢的。`Comparable` 的意义在于被比较的对象内部实现它。\n\n### 比较 Comparable\
  \ 和 Comparator\n\n`Comparable` 和 `Comparator` 之间有几处不同。我们已经在表 9.8 中为你你列出了它们。\n\n\
  #### Comparable 和 Comparator 的比较\n\n| 区别 | Comparable | Comparator |\n| --- | ---\
  \ | --- |\n| 包名 | java.lang | java.util |\n| 比较对象的类必须实现？ | 是 | 否 |\n| 接口中的方法名 |\
  \ `compareTo()` | `compare()` |\n| 参数数量 | 1 | 2 |\n| 是否通常使用 lambda 声明 | 否 | 是 |\n\
  \n记住这张表——真的。考试会尝试通过混淆这两种来陷害你，看你是否能发现。你看到为什么这不能编译了吗？\n\n```java\nvar byWeight = new\
  \ Comparator<Duck>() { // 无法编译\n    public int compareTo(Duck d1, Duck d2) {\n \
  \       return d1.getWeight()-d2.getWeight();\n    }\n};\n```\n\n方法名是错误的。`Comparator`\
  \ 必须实现一个名为 `compare()` 的方法。在问题中看到 `Comparator` 和 `Comparable` 时，请特别注意方法名和参数数量。\n\
  \n### 比较多个字段\n\n编写比较多个实例变量的 `Comparator` 时，代码会变得有点混乱。假设我们有一个 `Squirrel` 记录，如下：\n\
  \n```java\npublic record Squirrel(int weight, String species) {}\n```\n\n我们想写一个\
  \ `Comparator` 按物种名称排序。如果两只松鼠是同品种，我们想让重量最小的排在前面。我们可以像下面的代码来实现：\n\n```java\npublic\
  \ class MultiFieldComparator implements Comparator<Squirrel> {\n    public int compare(Squirrel\
  \ s1, Squirrel s2) {\n        int result = s1.species().compareTo(s2.species());\n\
  \        if (result != 0) return result;\n        else return s1.weight() - s2.weight();\n\
  \    }\n}\n```\n\n这假设没有物种名称是空。它检查一个字段。如果不匹配，排序就结束了。如果匹配，则查看下一个字段。但这并不易于阅读。也很出错。将\
  \ `!=` 改为 `==` 会完全破坏排序。\n\n或者，我们可以使用方法引用并构建 `Comparator`。这段代码代表了如下逻辑：\n\n```java\n\
  Comparator<Squirrel> c = Comparator.comparing(Squirrel::species).thenComparingInt(Squirrel::weight);\n\
  ```\n\n这一次，我们链式调用方法。首先，我们在物种上创建一个 `Comparator`。假设我们想按降序排序：\n\n```java\nvar c = Comparator.comparing(Squirrel::species).reversed();\n\
  ```\n\n表 9.9 显示了用于构建 `Comparator` 的方法。为了让你关注方法本身，我们省略了类型。\n\n| 方法 | 描述 |\n| ---\
  \ | --- |\n| `comparing(function)` | 按函数返回的 Object（或自动装箱为）排序。 |\n| `comparingDouble(function)`\
  \ | 按函数返回的 double 排序。 |\n| `comparingInt(function)` | 按函数返回的 int 排序。 |\n| `comparingLong(function)`\
  \ | 按函数返回的 long 排序。 |\n| `naturalOrder()` | 使用 `Comparable` 实现的顺序排序。 |\n| `reverseOrder()`\
  \ | 使用 `Comparable` 实现的反向顺序排序。 |\n\n表 9.10 显示了你可以链接到 `Comparator` 以扩展其行为的方法。\n\n\
  | 方法 | 描述 |\n| --- | --- |\n| `reversed()` | 翻转链式 `Comparator`。 |\n| `thenComparing(function)`\
  \ | 如果之前的 `Comparator` 返回 0，则使用此比较函数返回 Object 或自动装箱为一个。否则，返回之前 `Comparator` 的结果。\
  \ |\n| `thenComparingDouble(function)` | 如果之前的 `Comparator` 返回 0，则使用此比较函数返回 double。否则，返回之前\
  \ `Comparator` 的结果。 |\n| `thenComparingInt(function)` | 如果之前的 `Comparator` 返回 0，则使用此比较函数返回\
  \ int。否则，返回之前 `Comparator` 的结果。 |\n| `thenComparingLong(function)` | 如果之前的 `Comparator`\
  \ 返回 0，则使用此比较函数返回 long。否则，返回之前 `Comparator` 的结果。 |\n\n到为止你可能已经注意到我们在检查相等性和比较对象时经常忽略空值。这在考试中没问题。但在现实世界中，情况并非如此简单。你必须决定如何处理空值或防止它们出现在对象中。\n\
  \n### 排序与搜索\n\n现在你已经学习了 `Comparable` 和 `Comparator`，我们终于可以利用它们做些有用的事，比如排序。`Collections.sort()`\
  \ 方法使用 `compareTo()` 方法进行排序。它期望被排序的对象实现了 `Comparable`。\n\n```java\nclass SortRabbits\
  \ {\n    static record Rabbit(int id) {}\n    public static void main(String[] args)\
  \ {\n        List<Rabbit> rabbits = new ArrayList<>();\n        rabbits.add(new\
  \ Rabbit(3));\n        rabbits.add(new Rabbit(1));\n        Collections.sort(rabbits);\
  \ // 无法编译\n    }\n}\n```\n\n\n\nJava 知道 `Rabbit` 记录没有实现 `Comparable`。它知道排序将会失败，因此甚至不会让代码编译。你可以通过向\
  \ `sort()` 传递一个 `Comparator` 来修复这个问题。记住，当你想要在不使用 `compareTo()` 方法的情况下指定排序顺序时，`Comparator`\
  \ 是非常有用的。\n\n```java\nComparator<Rabbit> c = (r1, r2) -> r1.id - r2.id;\nCollections.sort(rabbits,\
  \ c);\nSystem.out.println(rabbits);  // [Rabbit[id=1], Rabbit[id=3]]\n```\n\n假设你想降序对兔子进行排序。你可以将\
  \ `Comparator` 改为 `r2.id - r1.id`。或者，你可以在之后反转列表的内容：\n\n```java\nComparator<Rabbit>\
  \ c = (r1, r2) -> r1.id - r2.id;\nCollections.sort(rabbits, c);\nCollections.reverse(rabbits);\n\
  System.out.println(rabbits);  // [Rabbit[id=3], Rabbit[id=1]]\n```\n\n`sort()` 和\
  \ `binarySearch()` 方法允许在你不想使用自然顺序时传入一个 `Comparator` 对象。\n\n### 审查 `binarySearch()`\n\
  \n`binarySearch()` 方法需要一个排序过的 `List`。\n\n```java\nList<Integer> list = Arrays.asList(6,9,1,8);\n\
  Collections.sort(list); // [1, 6, 8, 9]\nSystem.out.println(Collections.binarySearch(list,\
  \ 6)); // 1\nSystem.out.println(Collections.binarySearch(list, 3)); // -2\n```\n\
  \n第 12 行对 `List` 进行排序，以便我们可以正确调用二分查找。第 13 行打印找到匹配项的索引。第 14 行打印请求值需要插入位置的取反索引减 1。数字\
  \ 3 需要插入到索引 1 处（数字 1 之后，数字 6 之前）。取反后得到 −1，再减去 1 得到 −2。\n\n在使用 `binarySearch()` 时有一个技巧。你认为以下输出会是什么？\n\
  \n```java\nvar names = Arrays.asList(\"Fluffy\", \"Hoppy\");\nComparator<String>\
  \ c = Comparator.reverseOrder();\nvar index = Collections.binarySearch(names, \"\
  Hoppy\", c);\nSystem.out.println(index);\n```\n\n答案恰好是 -1。在你恐慌之前，你不需要知道答案是 -1。你只需要知道答案是未定义的。第\
  \ 3 行创建了一个列表 `[Fluffy, Hoppy]`。这个列表恰好是升序排列的。第 4 行创建了一个反转自然顺序的 `Comparator`。第 5 行请求降序二分查找。由于列表不是按该顺序，我们不满足执行搜索的先决条件。\n\
  \n虽然在排序不当的列表上调用 `binarySearch()` 的结果是未定义的，但有时你可以运气不错。例如，搜索从一个奇数长度列表的中间开始。如果你恰好请求中间元素，返回的索引将是你所预期的那样。\n\
  \n在本章的早期阶段，我们讨论了需要类实现 `Comparable` 的集合。与排序不同，它们不会在编译时检查你是否实现了 `Comparable`。\n\n\
  回到我们没有实现 `Comparable` 的 `Rabbit`，我们尝试将其添加到 `TreeSet` 中：\n\n```java\npublic class\
  \ UseTreeSet {\n    record Rabbit(int id) {}\n    public static void main(String[]\
  \ args) {\n        Set<Duck> ducks = new TreeSet<>();\n        ducks.add(new Duck(\"\
  Puddles\"));\n\n        Set<Rabbit> rabbits = new TreeSet<>();\n        rabbits.add(new\
  \ Rabbit(1));  // ClassCastException\n    }\n}\n```\n\n第 6 行是正常的。`Duck` 实现了 `Comparable`。`TreeSet`\
  \ 能够将其排序到集合中的正确位置。第 9 行有问题。当 `TreeSet` 尝试对其排序时，Java 发现 `Rabbit` 没有实现 `Comparable`。Java\
  \ 抛出了类似这样的异常：\n\n```\nException in thread \"main\" java.lang.ClassCastException:\n\
  \    class UseTreeSet$Rabbit cannot be cast to class java.lang.Comparable\n```\n\
  \n在向集合添加第一个对象时抛出此异常似乎很奇怪。毕竟，现在还没有东西可以比较。Java 这样做是为了保持一致性。\n\n就像搜索和排序一样，你可以告诉需要排序的集合你想使用特定的\
  \ `Comparator`。例如：\n\n```java\nSet<Rabbit> rabbits = new TreeSet<>();\n```\n\n###\
  \ 排序列表\n\n当一个排序不当的列表，结果是未定义的……\n\n### 引入顺序化集合 (Sequenced Collections)\n\nJava 21\
  \ 新引入了顺序化集合，包括以下内容：\n\n*   `SequencedCollection`\n*   `SequencedSet`\n*   `SequencedMap`\n\
  \n顺序化集合是一种遇到顺序（encounter order）定义明确的集合。这特别重要。\n\n### 使用 SequencedCollection\n\n\
  让我们从顺序化集合最简单的示例 `ArrayList` 开始。\n\n**表 9.11：SequencedCollection 方法**\n\n| 方法 | 描述\
  \ |\n| :--- | :--- |\n| `addFirst(E e)` | 将元素作为集合中的第一个元素添加 |\n| `addLast(E e)` |\
  \ 将元素作为集合中的最后一个元素添加 |\n| `getFirst()` | 获取集合中的第一个元素 |\n| `getLast()` | 获取集合中的最后一个元素\
  \ |\n| `removeFirst()` | 移除集合中的第一个元素 |\n| `removeLast()` | 移除集合中的最后一个元素 |\n| `reversed()`\
  \ | 返回集合的反序视图 |\n\n对于 `ArrayList`，这些大多数方法是如何实现的应该是显而易见的。例如，为了添加或获取第一个元素，你可以分别调用\
  \ `add(0,e)` 和 `get(0)`。`SequencedCollection` 接口的目的并不一定是为了添加新功能，而是为了更容易处理相关类型。例如，假设我们有如下方法来欢迎欢迎动物园的下一个访问者：\n\
  \n```java\npublic void welcomeNext(SequencedCollection<String> visitors) {\n   \
  \ System.out.println(\"欢迎动物园！\" + visitors.getFirst());\n    visitors.removeFirst();\n\
  }\n```\n\n我们现在可以将各种顺序化集合应用到这个方法中：\n\n```java\nvar visitArrayList = new ArrayList<String>(List.of(\"\
  Huey\", \"Dewey\", \"Louie\"));\nvar visitLinkedList = new LinkedList<String>(List.of(\"\
  Moe\", \"Larry\", \"Shemp\"));\nvar visitTreeSet = new TreeSet<String>(Set.of(\"\
  Alvin\", \"Simon\", \"Theodore\"));\n```\n\nwelcomeNext(visitArrayList); // 欢迎动物园！Huey\n\
  welcomeNext(visitLinkedList); // 欢迎动物园！Moe\nwelcomeNext(visitTreeSet); // 欢迎动物园！Alvin\n\
  \n顺序化集合赋予了我们处理许多具有明确遇到顺序的不同类型的能力。通过其他方法，我们甚至可以重新排列元素。\n\n```java\npublic void moveToEnd(SequencedCollection<String>\
  \ visitors) {\n```\n\n\n\n```\nvisitors.addLast(visitors.removeFirst());\n}\n```\n\
  \n如果在另一组集合上调用这个新方法会发生什么？\n\n```java\nvar visitArrayList = new ArrayList<String>(\n\
  \    List.of(\"Bluey\", \"Bingo\", \"Socks\"));\n\nvar visitLinkedList = new LinkedList<String>(List.of(\"\
  Garfield\", \"Odie\"));\n\nvar visitTreeSet = new TreeSet<String>(Set.of(\"Tom\"\
  , \"Jerry\"));\n\nmoveToEnd(visitArrayList);\nwelcomeNext(visitArrayList);  // 欢迎动物园！Bingo\n\
  \nmoveToEnd(visitLinkedList);\nwelcomeNext(visitLinkedList); // 欢迎动物园！Odie\n\nmoveToEnd(visitTreeSet);\
  \      // java.lang.UnsupportedOperationException\nwelcomeNext(visitTreeSet);\n\
  ```\n\n哦，为什么上一个例子不起作用？仅仅因为一个方法实现了 `SequencedCollection`并不意味着该类支持表 9.11 中的所有方法。在这个中，`addLast()`\
  \ 调用在运行时失败了，因为你不能在排序结构的末尾插入项。这样做可能会违反 `TreeSet` 内部的比较器。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n对于考试，你不需要知道哪些集合支持表 9.11 中的哪些方法，但你应该知道有序集合（sequenced collection）和排序集合（sorted collection）之间的区别。\n\
  \n`SequencedSet` 是 `SequencedCollection` 的子类型；因此，它继承了它的所有方法。它只适用于同时也实现了 `Set` 接口\
  \ `SequencedCollection` 类，例如 `LinkedHashSet` 和 `TreeSet`。\n\n### 操作 SequencedMap\n\
  \n正如你可能猜到的那样，`SequencedMap` 是一个具有定义遭遇顺序的 `Map`。我们在表 9.12 中定义了常用方法。\n\n表 9.12 常用\
  \ SequencedMap 方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `firstEntry()` | 获取 map 中的第一个键/值对\
  \ |\n| `lastEntry()` | 获取 map 中的最后一个键/值对 |\n| `pollFirstEntry()` | 移除并获取 map 中的第一个键/值对\
  \ |\n| `pollLastEntry()` | 移除并获取 map 中的最后一个键/值对 |\n| `putFirst(K k, V v)` | 将键/值对作为\
  \ map 中的第一个元素添加 |\n| `putLast(K k, V v)` | 将键/值对作为 map 中的最后一个元素添加 |\n| `reversed()`\
  \ | 返回 map 的反排序视图 |\n\n让我们定义一个用于操作 `SequencedMap` 的方法。\n\n```java\npublic void welcomeNext(SequencedMap<String,\
  \ String> visitors) {\n    System.out.println(\"Welcome to the Zoo! \" + visitors.pollFirstEntry());\n\
  }\n```\n\n你认为以下代码会打印什么？\n\n```java\nvar visitHashMap = new HashMap<String,String>(\n\
  \    Map.of(\"1\", \"Yakko\", \"2\", \"Wakko\", \"3\", \"Dot\"));\n\nwelcomeNext(visitHashMap);\n\
  ```\n\n陷阱题！它实际上无法编译。正如我们之前解释 `HashSet` 时说的那样，`HashMap` 没有顺序，因此它不能用作 `SequencedMap`。那这个例子呢？\n\
  \n```java\nvar visitTreeMap = new TreeMap<String,String>(\n    Map.of(\"Pink\",\
  \ \"Blossom\", \"Green\", \"Buttercup\", \"Blue\", \"Bubbles\"));\n\nwelcomeNext(visitTreeMap);\n\
  ```\n\n如果你猜的是 `Welcome to the Zoo! Blue=Bubbles`，那么在讲解 `TreeMap` 时你注意了。`TreeMap`\
  \ 按自然顺序对项进行排序，而不是它们被添加到 map 中的顺序。由于 `Blue` 是排序顺序中的第一个键，它是打印出的第一个对。\n\n![](img/image_rsrc10B8.jpg)\n\
  \n你在整本书中处理过的集合大部分是有序的。两个异常是 `HashSet` 和 `HashMap`。\n\n## 复习集合类型\n\n我们通过回顾各种集合类型的规则来结束本章的这部分。\n\
  \n### 使用不可修改的视图\n\n不可修改视图（unmodifiable view）是集合的包装对象，无法通过视图本身进行修改。虽然视图对象不能修改，但底层数据仍然可以修改。\n\
  \n为了考试，你应该熟悉以下创建集合不可修改视图的方法：\n\n```java\nCollection<String> coll = Collections.unmodifiableCollection(List.of(\"\
  brown\"));\nList<String> list = Collections.unmodifiableList(List.of(\"orange\"\
  ));\nSet<String> set = Collections.unmodifiableSet(Set.of(\"green\"));\nMap<String,Integer>\
  \ map = Collections.unmodifiableMap(Map.of(\"red\", 1));\n```\n\n\n\n\n| SequencedCollection\
  \ | Yes | No | No | No |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| LinkedHashSet\
  \ | Set SequencedSet | Yes | No | No | No |\n| LinkedHashMap | Map SequencedMap\
  \ | Yes | No | No | No |\n| TreeMap | Map SequencedMap | Yes | Yes | No | Yes |\n\
  | TreeSet | Set SequencedCollection | Yes | Yes | No | Yes |\n\n考试要求你了解：涉及排序的数据结构在处理\
  \ `null` 时需要格外小心。对于排序集合（sorted sets），这意味着不允许使用 `null`；对于排序映射（sorted maps），这意味着不允许\
  \ `null` 键（keys）。\n\n最后，考试要求你能够根据问题的描述选择正确的集合类型。我们建议首先识别问题询问的是哪种类型的集合。确定你寻找的是 `list`（列表）、`map`（映射）、`queue`（队列）还是\
  \ `set`（集合）。这可以让你排除很多选项。然后你就可以在剩余的选项中找出最佳答案。\n\n### ![](img/image_rsrc10BB.jpg)\
  \ 现实世界场景\n\n### 旧版集合\n\n有几个集合不再出现在考试中，但你可能会在旧代码中遇到它们。这三者都是早期可与线程一起的 Java 数据结构。\n\
  \n* `Vector`: 实现了 `List`\n* `Hashtable`: 实现了 `Map`\n* `Stack`: 实现了 `List`\n\n这些类现在很少被使用了，因为有许多更好的并发替代方案，我们将在第\
  \ 13 章中介绍它们。\n\n## 使用泛型\n\n我们用 Java 语言中最有用且有时最令人困惑的特性之一来结束本章：泛型（generics）。在本节中，我们将介绍更高级的主题，包括创建泛型类和方法。\n\
  \n### 创建泛型类\n\n你可以在自己的类中引入泛型。引入泛型的语法是在尖括号中声明一个形式类型参数。例如，下面这个名为 `Crate` 的类在类名后声明了一个泛型类型变量：\n\
  \n```java\npublic class Crate<T> {\n   private T contents;\n   public T lookInCrate()\
  \ {\n      return contents;\n   }\n   public void packCrate(T contents) {\n    \
  \  this.contents = contents;\n   }\n}\n```\n\n泛型类型 `T` 在 `Crate` 类内部任何地方可用。当你实例化该类时，你告诉编译器该特定实例\
  \ `T` 应该是什么。\n\n### 泛型的命名规范\n\n类型参数可以命名为任何你想要的。习惯是使用单个大写字母，以便明显看出它们不是真实的类名。以下是常用的字母：\n\
  \n* `E` 代表元素（element）\n* `K` 代表映射的键（map key）\n* `V` 代表映射的值（map value）\n* `N` 代表数字（number）\n\
  * `T` 代表泛型数据类型\n* `S`, `U`, `V` 等用于多个泛型\n\n例如，假设存在一个 `Elephant`（大象）类，我们正把大象移到动物园一个新的更大的围圈里。（圣地亚哥动物园在\
  \ 2009 年这样做过。看到那个大金属箱很有趣。）\n\n```java\nElephant elephant = new Elephant();\nCrate<Elephant>\
  \ crateForElephant = new Crate<>();\ncrateForElephant.packCrate(elephant);\nElephant\
  \ inNewHome = crateForElephant.lookInCrate();\n```\n\n公平地说，与其说我们装了箱子，不如说是大象自己走进去的。然而，你可以看到\
  \ `Crate` 类能够在不了解关于 `Elephant` 任何信息的情况下处理它。\n\n这可能看起来并没有特别了不起。在编写 `Crate` 时，我们可以直接输入\
  \ `Elephant` 而不是 `T`。如果我们想为另一种动物创建一个 `Crate` 呢？\n\n```java\nCrate<Zebra> crateForZebra\
  \ = new Crate<>();\n```\n\n现在我们不能再简单地在 `Crate` 类中硬编码 `Elephant`，因为 `Zebra`（斑马）不是\
  \ `Elephant`。但是，我们可以创建一个 `Animal` 超类或接口，并在 `Crate` 中使用它。\n\n当用作类型参数的类之间完全没有任何关系时，泛型类就变得有用了。例如，我们需要将我们\
  \ 120 磅的机器人运到另一个城市。\n\n```java\nRobot joeBot = new Robot();\nCrate<Robot> robotCrate\
  \ = new Crate<>();\nrobotCrate.packCrate(joeBot);\n// 发送到休斯顿\nRobot atDestination\
  \ = robotCrate.lookInCrate();\n```\n\n现在开始变得有趣了。`Crate` 类可以与任何类型的类工作。在泛型出现之前，我们需要\
  \ `Crate` 使用 `Object` 类作为其实例变量，这会将负担交给调用者，在清空箱时对其接收到的对象进行强制类型转换。\n\n除了 `Crate` 不需要了解放入其中的对象外，这些对象也不需要了解\
  \ `Crate`。我们没有要求对象实现名为 `Crateable` 或类似的接口。任何类都可以在不进行任何更改的情况下放入 `Crate` 中。\n\n![](img/image_rsrc10BA.jpg)\n\
  \n如果你想不出你自己的泛型类的用途，请不要担心。除非你正在为他人编写可供其复用的库，否则泛型几乎不会出现在你编写的类定义中。你已经在你调用的代码中频繁看到它们了，例如函数式接口和集合。\n\
  \n泛型类在用作类型参数的类之间可以完全没有任何关系时变得有用。例如，我们需要把我们 120 磅的机器人运到另一个城市。\n\n```java\nRobot joeBot\
