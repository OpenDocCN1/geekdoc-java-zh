    The graph opposite shows the wide range of blood insulin levels in a large group
    of healthy people.


    All organs in the body usually work at rest less than their maximum capacity.
    Your heart rate at rest be around 70 beats per minute, although if you feel your
    pulse while climbing stairs it might be over 100 beats per minute. Yet your maximum
    heart rate could be as high as 180, depending on age and fitness. Also, you probably
    have two kidneys, but their job could be done by just half of one. The pancreas
    is the same. Normally, there is huge reserve capacity in the amount of insulin
    that can be made. We know that three quarters of the pancreas can be removed without
    blood glucose control being affected in most people. Compensating for an insulin-resistant
    liver is not usually a huge problem. The pancreas simply works a little harder,
    and provided the insulin-producing cells can still compensate, blood glucose levels
    stay in the reasonable range. The people with the higher insulin levels shown
    in the graph above are normal, and all is still in balance.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_46_0.png)


    ## 3.3 A wide range of insulin levels in 100 people without diabetes. Each bar
    shows the level in a group of healthy people.


    But every pancreas has its limits, and when an insulin-resistant person builds
    up too much fat inside the pancreas, it may become unable to compensate fully,
    and that does become a problem, as we see later.


    ## Quick, more energy!


    When your body is just ticking over at rest, fat can provide the energy for the
    muscles. But if you catch that bus, the burst of muscle action can only be fuelled
    by glucose. For instance, imagine your ancestors chasing after dinner with a spear.
    After no food for a couple of days, blood glucose levels would still be normal.
    If there was a sudden need to run – perhaps on hearing the shout of ‘Lion!’– there
    would be an immediate surge of adrenaline. Adrenaline is the hormone that triggers
    the fight-or-flight response in bodies. It works very quickly, and one of its
    effects is to cut down insulin production. The liver starts to pour out more glucose,
    to provide more energy for sprinting away from danger – or for chasing dinner.


    So the reason that you can live without thinking about energy for life is simple.
    Your liver organises the food and produces exactly the right amount of glucose
    for the body. Your liver ‘knows’ how much glucose to make, because insulin is
    in charge.


    ## Surviving a meal onslaught


    Taking on board a meal is a severe stress for the body. In the UK, a typical dinner
    of, say, 800 calories would probably contain around half of the energy as carbohydrate.
    That means 400 calories are eaten as carbohydrate, or the equivalent of 100g of
    carbohydrate. No matter how brown the rice, no how rustic the loaf, the body sees
    all food in a very provocative manner. The digestible carbohydrate is converted
    into glucose (if you read the nutritional information on packets of food, carbohydrate
    is listed separately from ‘sugar’, but the process of digestion turns it into
    sugar). Certainly, this happens more slowly with some forms of carbohydrate that
    are absorbed less rapidly. But your 800-calorie dinner, half made up of carbohydrate,
    will result in 100g of glucose being dropped into your body during digestion.
    This would cause disastrous effects unless rapid action occurred. In fact, if
    there was no insulin response, blood glucose would rise seven-fold. The normal
    level would go up to dangerous heights. You would feel very indeed.


    Fortunately, rapid action is provided by the beta cells of the pancreas. When
    you start to eat your meal, blood glucose levels begin to rise. The moment that
    this happens, there is an enormous increase in the rate of insulin production.
    Blood levels of insulin increase 10-15 fold. Wow. That is the biggest change in
    any substance in the blood that can happen in normal life. If you imagine this
    in terms of speed, it is like accelerating from 10 miles (16km) per hour to over
    100 miles (160km) per hour.


    So what happens to all the extra insulin? Most of it goes directly to the liver.
    And within 30 minutes, production of glucose by the liver has almost completely
    stopped. Not just slowed, but almost stopped. The ongoing needs of your brain
    are supplied by glucose from food for a few hours.


    The overall result is that in someone of normal health, blood glucose rises very
    little after a meal and the level returns close to normal within 90 minutes. A
    miracle. In the background, glucose is being steadily stored as glycogen in both
    the muscle and the liver.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_48_0.png)


    ## 3.4 The normal insulin response to eating. Just after eating, the increase
    in blood insulin is startingly rapid before falling again.


    ## What did you do with your cornflakes?


    Twenty-five years ago, I carried out some research in America which showed where
    you store away your meal carbohydrates. I had to work for a year at Yale University
    with my friend and colleague Jerry Shulman, after his team had discovered how
    to measure the level of glycogen in the body using special techniques on an MRI
    scanner. This was a game changer in terms of understanding what happens to the
    body after eating because for the first time its secrets could be probed without
    needles. Most carbon is non-magnetic, exactly 1.1% of all carbon in nature is,
    a slightly different form, known as carbon-13. And this, we now knew, could be
    measured using a very powerful MRI scanner. Changes in the level of carbon-13
    exactly mirror changes in all carbon.


    As a first step, we measured the levels of glycogen in a group of healthy people.
    There are only two storage depots for carbohydrates – the liver and the muscles
    – and we found in these people about a third of the carbohydrate in a meal was
    stored in muscles and about a fifth in the liver. It took four to five hours after
    a meal for all the carbohydrate to be stored away (see figure 3.4, left).


    This storage process is very dependent on insulin and, as we have seen, there
    is normally plenty after a meal. But just as the liver''s sensitivity to insulin
    can vary between individuals, so can muscle''s. And what we found on continuing
    our research in the UK was that people with type 2 diabetes who had insulin-resistant
    muscles did not store anywhere as much glycogen. Figure 3.5 overleaf shows just
    how big the difference was found to be.


    If you don''t put much glucose into muscle, what happens to it? Well, as we saw
    in Chapter 2, some will be stored as glycogen in the liver. A small amount will
    certainly be burned for energy after a meal. But there is only one other option
    for the body to deal with the glucose influx. It has to be changed into fat. This
    is a neat solution, as there is much greater capacity to store fat.


    Provided that it is burned for energy in a day or two, a temporary parking of
    extra carbohydrate in the form of fat does not matter too much. Store it into
    puffs. Then out. No problem. The body remains in balance, day to day and week
    to week. But if, rather than the odd mouthful or two more food than you need every
    day, then that fat will slowly build up in the body and eventually in the liver.
    Just how readily this happens on the degree of insulin resistance in your muscle,
    and this is why ''insulin resistance'' is not a good thing long term. The more
    insulin-resistant you are, the more likely you are to turn any excess carbohydrate
    into fat. The effects of this are explained in Chapter 4.


    **3.5 Amount of glucose stored as glycogen in muscles during a normal day.** The
    lightest grey bars show the levels before breakfast, but by only a small amount
    in people with type 2 diabetes, compared with the large increase in storage in
    people without diabetes. The darkest grey bars show that after lunch the muscle
    glycogen levels in type 2 diabetes have changed little from the fasting level
    whereas there was a large increase in those of people without type 2 diabetes.

