    与名人一起进餐。这一定是真的——看看那照片就知道了。这个想法是如何产生的，以及是否真的经过了测试，在很大程度上并不重要。


    你知道蓝莓是一种“超级食物”吗？我在报纸上读到的。人类想要相信食物具有魔力这种感性的愿望是非常强大的。我担心，尽管对维生素和微量营养素有很多夸大，但这几乎肯定是另一个谎言。最可能的解释是，在任何调查中，吃蓝莓的人确实会被发现比吃的人更健康。尝试在城镇最贫富的地区买蓝莓，那里由于各种原因，人们健康状况较差，那里根本没有卖。在富裕地区，人们的行为在许多方面都有于增加预期寿命。此外，他们商店里的食物种类丰富得多。食用蓝莓——连同西兰花、石榴籽等——只是降低疾病风险的一系列行为之一。如果你喜欢，就尽情享受这些美味吧。但目前为止，向城市贫困地区的人提供蓝莓并没有证明能改善他们的健康。


    关于食用多种食物的长期智慧固然重要。但“超级食物”则不然。


    ## 什么是健康饮食？


    鉴于当今人口面临的最紧迫的健康问题，一些非常基础的概念也许应该重新思考。无疑，我们在过去200年中学到的关于避免疾病所需的维生素、矿物质和蛋白质的最少量仍然是正确的。而且，对于大多数富裕社会的人来说来说，只要食用合理范围内的食物，营养缺乏并不是问题。有些食物既高热量密度又不能解饱肚子，必须考虑在内。任何食物都没有魔力，没有任何食物本身是“健康”的。正如我们所看到的，魔鬼主要不在于食物的种类，而在于数量。


    如果萨缪尔·约翰逊能够用他简洁的风格评论的话，也许健康饮食可以定义为让你的体重在整个成年生活中保持稳定的饮食。


    快速阅读


    - 研究规模越大，产生误导性结果的可能性就越大

    - 警惕谎言——基于关联的谬误

    - 警惕 EFIs——缺乏证据的想法

    - “低脂对你有好处”和“鸡蛋会导致心脏发作”都是 EFIs

    - “每天五份水果蔬菜”真的应该是“每天五种而非五份”（5-instead-a-day）

    - 早餐是可选的

    - 一旦某个观点被广泛接受，它就无法通过仔细的研究进行事实性的纠正


    ## 食谱章节


    在制定 Counterpoint 研究的原始饮食计划时，我知道生活不仅仅是为了新陈。肠道必须保持愉快。在液体配方饮食中，很容易发生便秘。出于这个原因，我们建议添加一些非淀粉蔬菜以提供额外的纤维——这样做是有效的。此外，人们很想念咀嚼的感觉——口感和清脆感是棒的！我们提供了一些简单的示例供遵循，当研究志愿者带着自己的想法回到我们这里时，我们感到非常高兴。


    这一部分收集了由业内人士设计的食谱：那些真正遵循了 1、2、3 减肥法的人。它们不仅包括第 1 阶段极低热量的菜肴，还包括第 2 和第 3 阶段，即我们正慢慢回到“正常”的饮食方式，添加含有蛋白质和少量碳水化合物的食物。你可以将这些食谱变成你缺少原料的购物清单，并储备你的储柜、冰箱和冷冻柜以准备。


    关于蔬菜的一句话：即使你不特别喜欢它们，你可能会让自己感到惊讶。只需尝试一些想法。理想情况下，在开始低热量饮食之前，你应该每天吃一点各种生蔬菜，因为你的味蕾接触新口味的次数越多，它们就越容易被接受。保持开放的心态，尝试你以前不喜欢的东西。目标是找到足够种类的你可以食用并喜欢的蔬菜，以帮助你度过低热量饮食及以后。


    ## 第 1 阶段食谱


    在这个阶段，你可以配合液体替代奶昔吃蔬菜菜，以提供一些清脆感和纤维。这里是一些帮助你起的建议。食谱中提供了用量。使用小盘（8-10 英寸或 20-25 厘米直径）。当然，你也可以尝试自己的蔬菜和香草/香料组合。另一方面，你可以让事情非常简单——每天一份绿色沙拉。


    ## 什么是“非淀粉”蔬菜？


    “非淀粉”是区分益益蔬菜和应避免的蔬菜的一种有用方法，但所有蔬菜都含有少量的碳水化合物。


