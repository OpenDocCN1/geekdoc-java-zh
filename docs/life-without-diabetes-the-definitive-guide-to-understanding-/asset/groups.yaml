    Well over a decade ago, it was suggested that the huge mass of bacteria in our
    low bowels might produce chemicals that could affect our metabolism. It was an
    interesting concept, and clearly capable of being tested. Everyone waited for
    clear-cut studies to demonstrate how great an effect the bugs had. The years ticked
    by. Even at the time of writing there is no evidence of a cause-effect relationship
    in people. Evidence of lack of effect is beginning to appear. But the belief lives
    on.


    Unsurprisingly, changing the types of foods eaten can allow some types of faulty
    to flourish. Drastically decreasing the quantity of food eaten can change the
    proportions of bacteria in the gut – and of course blood glucose control improves.
