    如果你患有 2 型糖尿病，你的身体在多年里拥有的食物比需要消耗的得多。你的脂肪储备将溢满。事实上，你的身体将淹没在过量的化学能量中。当燃料箱溢出时，必然会有严重的后果。这一章描述了如果你患了
    2 型糖尿病，你的身体里发生了什么，以及它最初是如何产生的。


    ## 2 型糖尿病引起的变化


    ### 你的血液


    显而易见的是你的血糖水平过高。这一点很容易。可以使用市售血糖血糖测量血糖水平。葡萄糖本身可能让你感到口渴，并比平时排尿更多。


    较少为人知的是，你血液中的胰岛素水平会比正常高。这可能会让你惊讶。这无疑让医学生感到困惑！这是你的胰腺竭力将血糖水平恢复到正常的结果。最后，在患多年 2 型糖尿病后，胰岛素水平逐渐下降，可怜的
    β细胞变得越来越无法胜任工作。


    你血液中普通脂肪水平也会过高。这是因为你血液中部分过量的葡萄糖会转化为脂肪——这些应该被储存起来。考虑到葡萄糖、胰岛素和脂肪在维持生命方面起着至关重要的作用，将整个局面描述为一片混乱也是公平的。难怪你可能会感到不适。


