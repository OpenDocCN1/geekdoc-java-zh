    # Praise for Life Without Diabetes


    ‘Roy Taylor and his team at Newcastle University have not only cracked the mystery
    of what causes type 2 diabetes, the greatest health problem of our time, but shown
    the world how to get rid of it. This is a terrific book, which could help a huge
    number of people.’


    Dr Michael Mosley, bestselling author of The Fast 800, The Clever Guts Diet and
    The 8-week Blood Sugar Diet


    ‘Professor Taylor’s remarkable tenacity in researching the concept that some people
    are able to put their type 2 diabetes into remission is changing how we think
    about and treat this pervasive condition.’


    Elizabeth Robertson, Director of Research, Diabetes UK


    ‘When I met Roy in 2012, I had type 2 diabetes – and he showed me another way.
    Now my blood sugars are normal and my diabetes is a thing of the past.’


    Dave Myers, Hairy Biker


    ‘Fascinating, informative and, in today’s world, important. For anyone with type
    2 diabetes it’s a no-brainer; follow Roy’s roadmap and reverse it. And if you
    haven’t got type 2 diabetes – yet – avoid it.’


    Jimmy Nail, actor and musician


    > This book is dedicated to my patients and research volunteers, who taught me
    so much


