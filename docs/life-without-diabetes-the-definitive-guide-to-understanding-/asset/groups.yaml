    ## 一个患者的故事：戴夫·迈尔斯（Dave Myers），毛发大厨师


    2012 年我在拍摄《毛发大厨师》（*The Hairy Dieters*）系列节目时，我有极大的幸运遇到了罗伊·泰勒（Roy Taylor）教授。那次会面的意义远超关于“两个需要减脂的胖厨师”的电视节目，它是一次改变我生活的相遇。七后的今天，我比多年来的任何时候都更健康。


    泰勒教授有能力帮助你理解身体里发生了什么以及为什么。有时，这是一种“严厉的爱”，你需要约束自己并改掉习惯才能获得健康。他用真诚的关怀和感染力的热情传达了这一点。


    显而易见罗伊懂人心，正如他所说，医学的核心在于倾听人的意见。在镜头之外，他倾听了我们这两个需要帮助的人的需求。罗伊是该领域的专家，他在纽卡斯尔建立的研究中心令人惊叹。但更令人震撼的是他的员工。他们是一群非常棒的伙伴。他们的研究颠覆了人们对糖尿病的认知，让许多人恢复了健康。这本书解释了你的身体如何处理食物，以及为什么
    2 型糖尿病可能会影响你。这里没有捷径可走，只有核心基于科学科学和专业知识的帮助。


    罗伊给我的第一个建议是这样的：为了长期健康，我们应该能够穿进我们 21 岁时穿的裤子。当我们在泰恩茅斯海滩（Tynemouth beach）与他跳舞时，他穿着那条旧的金雀黄色灯芯绒喇叭裤向我们证明了他的言行合一！我没有完全回到年轻时34
    英寸（86.4厘米）的腰围，但成功减到了 36 英寸（91.4 厘米）……考虑到三个月前 49 英寸（124.5 厘米）的起点，这已经很不错了。对我来说，最大的不仅是能穿上更酷的牛仔裤，而是找回了健康。


    2012 年我遇到罗伊时，我患有 2 型糖尿病——血糖很高，并且正在药物控制。罗伊向我展示了另一种方法。现在我的血糖正常，糖尿病已成为过去式。我每个月都会接受测试，结果都是正常的。这意味着我规避了
    2 型糖尿病可能导致的痛苦、失明和截肢等折磨。


    这本书读起来像是一部冒险故事；它是一段不可思议的发现之旅。它还充满了见解和宝贵信息。在不给你任何虚假希望的情况下，它包含了你为了逃离自己的 2 型糖尿病可能需要的所有知识。最后一章揭示了围绕着健康饮食这一无尽困惑的某些神话和误区。


    我所能说的只有，由于遇见了罗伊·泰勒教授，我的 2 型糖尿病消失了，在过去的七年里我没有吃过任何药物。


    你也可以与这本书产生一次幸运的邂逅。

    祝健康。


    ## 如何使用这本书


    有些书应该被一口气读完，而有些则适合翻阅或部分阅读。


    对于想要立即逃离疾病的 2 型糖尿病患者，第 7 章可能是你的入门点。对于任何对身体如何正常处理食物，以及发生了什么问题导致 2 型糖尿病的代谢紊乱感兴趣的人，请先看第
    1 到 6 章。对于急性的人，可以通过阅读每章末尾的“快速阅读”（Quick）框并参考图片，在几分钟内掌握书精华。


    但如果你想读一个科学冒险故事，并理解你的身体如何处理食物，那么刘易斯·卡罗的方法适合你：从开始读，一直到最后，然后停止。


    本书提供信息，但不提供个人医疗建议。如果你已经在接受糖尿病治疗，在做出任何改变之前，请务必与你的医生或糖尿病护士讨论。


    ## 引言


    七天？只需要七天就能击败魔吗？


    几个世纪以来，医生一直将 2 型糖尿病视为一种终身疾病。这种疾病会导致巨大的痛苦——对视力、肢体、心脏造成威胁——而且越越糟，需要越来越多的药物，最终是胰岛素。当医生说“你得了糖尿病”的那一刻，生活就改变了。这像重击一样。你的健康突然变得脆弱。未来充满了不确定。


    但突然，在页面上出现了一个潜在的突破——拼图的最后一块，它让 2 型糖尿病看起来简单且可逆转。那是 2006 年，我正坐在我现在的办公桌前。阅读科学期刊并关注糖尿病的最新信息是我的工作的一部分，我刚刚翻开了一本领先糖尿病出版物的一页。那张图表直击我的眼球。它展示了在手术后后，2
    型糖尿病患者的血糖发生了什么。这种正常化在之前是所未见的。在七天内，血糖水平下降到绝对正常。过去几十年的研究似乎在这一刻汇聚在了一起。这可能吗？这令人兴奋。


    但这个故事真正始于 1970 年，当时我在爱丁医学院读书时，参加了雷金纳德·帕瑟（Reginald Passer）教授的一系列讲座，他解释了生理学。生理学是身体运作的科学。我仍然能看到他满头白发的样子，他阐述了清晰的推理——总是带着幽默感。令我着迷的是，他证明了常被接受的“知识”可以根据逻辑思维进行重新评估。在七天内，这种正常化是可能实现的吗？


    但帕斯莫永远是正确的，在支持医疗决策时，任何被接受的框架必须不断重新评估，随着新概念的出现。


