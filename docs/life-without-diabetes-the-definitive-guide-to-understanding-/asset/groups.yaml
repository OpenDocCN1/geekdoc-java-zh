- md: '

    personal limit of tolerance for carrying excess fat. The capacity to store fat
    in the tissue under the skin varies considerably between individuals.


    Some people have positively athletic fat tissue under the skin, which can handle
    anything thrown at it, with apparently endless storage capacity. Lucky people,
    we might say from a metabolic point of view. Of course, if they acquire more and
    more fat it may look excessive, but it is all locked up safely. As we have seen,
    the metabolic trouble starts when fat can no longer be stored safely and has to
    be stowed somewhere else.


    ## Insight from a classic research study


    One research study stands out as having influenced knowledge on type 2 diabetes
    than any other. Twenty-five years ago, it also profoundly changed how doctors
    treated the condition. It asked the main question: does better control of blood
    glucose prevent long-term complications of diabetes? The United Kingdom Prospective
    Diabetes Study, universally abbreviated to UKPDS, enrolled people with newly diagnosed
    type 2 diabetes between 1977 and 1991. The main findings emerged in 1998.


    It was the brainchild of Dr Robert Turner at Oxford University. He battled against
    seemingly seemingly impossible odds to keep the study going by obtaining funding
    throughout the 20 years of the main study. He was an independent thinker, an excellent
    doctor and had formidable determination. But over and above all of that, he could
    attract and maintain a loyal group of doctors scattered across the UK. He was
    a remarkable man, and needed all his attributes to launch, execute and complete
    the study. In 1975, Dr Turner and his team were joined by another enlightened
    medical academic, Dr now Professor Rury Holman. He was also instrumental in making
    the trial work from conception to completion In 2012, he agreed to collaborate
    with me in reanalysing some of the old UKDS data to test the Personal Fat Threshold
    idea: it was possible that individuals had a certain level of fat stores that
    was safe for them but different from others?


    UKPDS was by far the ''randomised'' trial in diabetes at the time. Randomized
    means that people were assigned at random: either to the intensive treatment group
    or to a ''control'' group. This design is important as it minimises the risk of
    getting a misleading result. If people choose which treatment group they are to
    join it is highly likely it would influence the findings, and any differences
    measured at the end could merely reflect this. Any bias between the groups would
    mean that the results may not be due to the treatment given to that group but
    to something else unidentified – personal experience of previous medical issues
    or background beliefs about illness. The participants in the control group in
    UKPDS were treated as usual (diet, eventually tablets and reality insulin) but
    those in the intensive group were treated with tablets or insulin as needed with
    the revolutionary aim of keeping fast blood glucose below 6mmol/l.


    At the time UKPDS was designed, some randomised trials were rare in studying any
    disease. But Robert Turner was a pioneer who wanted to establish new knowledge
    that was beyond criticism. There has been no other study like UKPDS. A total of
    5102 people with diabetes took part in it. Twenty years later, it produced absolutely
    dramatic information. It found that better control of blood glucose brought about
    worthwhile reductions in all the complications of diabetes – eye, nerve, kidney,
    foot and brain. That was big news. At the time, many doctors thought that diabetic
    complications happened irrespective of how well the blood glucose level was controlled.
    This old belief took very long time to be replaced, but today there is universal
    acceptance of the link between blood glucose control and the risk of long-term
    complications.


    The research also showed that blood glucose levels rose steadily over the years,
    irrespective of whether people were in the control or intensive group. Type 2
    diabetes seemed to get inexably worse. Everyone appeared to need increasing numbers
    of tablets and by 10 years, half had been started on insulin injections. This
    clear proof of steady deterioration was eventually accepted worldwide, reinforcing
    the simple observation of most specialists in diabetes: people had type 2 diabetes
    for life and blood glucose levels steadily got worse. Subsequently, all this coalesced
    into a fixed belief that type 2 diabetes inevitably progressed and sooner or later
    insulin treatment would be needed; everyone went downhill however energetically
    tablets were prescribed. You may have been introduced to the gloom and doom when
    you were diagnosed. Nonetheless, UKPDS brought about a revolution in knowledge
    about how type 2 diabetes appeared to be best treated.


    The importance of UKPDS in this chapter, though, involves a different matter.
    In UKPDS, what was the weight of this group of people with newly diagnosed diabetes?
    The average BMI was 27. That is not high at all. It is in the lower part of the
    ''overweight'', range, far short of ''obesity''. Approximately one third of the
    people developing very ordinary type 2 diabetes has a completely normal BMI —
    less than 25.


    In fact, the distribution of the grey dots in figure 6.4 exactly reflects the
    BMI of the people who enrolled in UKPDS.


    It may seem strange, given the way type 2 diabetes is portrayed and reported on
    now, but back in the 1970s and early 1980s it was accepted that obesity had nothing
    directly to do with the cause of type 2 diabetes. Several well-known studies seemed
    to show this. As a young doctor, I myself reviewed all the best evidence and published
    a summary concluding that there was no link! How could this be? We now see that
    the few obese people around the time would have had an increased risk of type
    2 diabetes but the effect overall was undetectable because the small number of
    obese people.


    Where was the obesity in UKPDS? Good question. The nature of type 2 diabetes was
    just the same, then as now. But individuals in the background population were
    very different — they were quite simply heavy.


    It is somewhat paradoxical, then, that the background population were very different
    — they were quite simply heavy.


    It is somewhat paradoxical, then, that the background population were very different
    — they were quite simply heavy.


    It is somewhat paradoxical, then, that the background population were very different
    — they were quite simply heavy.


    It is somewhat paradoxical, then, that the background population were very different
    — they were quite simply heavy.


    It is somewhat paradoxical, then, that the background population were very different
