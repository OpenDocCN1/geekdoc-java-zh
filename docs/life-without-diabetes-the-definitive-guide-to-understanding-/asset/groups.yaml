    | 葡萄糖 mmol/l | 胰岛素 mmol/l | 脂肪 mmol/l |

    | :--- | :--- | :--- |

    | 2 非糖尿病 | 2 非糖尿病 | 2 非糖尿病 |


    4.1 2 型糖尿病患者与非糖尿病患者 24 小时血糖、胰岛素和脂肪的平均水平。


    ### 你的胰腺


    正如第 1 章提到的，只有当胰腺中的 β 细胞对葡萄糖失去反应时，才会发生 2 型糖尿病。医学研究长期以来认为这些细胞正在逐渐一个一个死亡。为什么？在显微镜下观察尸检胰腺时，科学家发现细胞数量只有正常的一半。大多数科学家和医生认为不同的人有不同的产生原因。但在
    2 型糖尿病中，一个单一因素脱颖而出。这种疾病在食物短缺的人群中罕见，但在食物充足的人群中常见。而且，如果食物充足的人群突然面临食物配给，2 型糖尿病会变得少得多，正如
