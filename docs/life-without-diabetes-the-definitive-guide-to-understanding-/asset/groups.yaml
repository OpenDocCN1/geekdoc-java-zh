    The scientific work on finding the case of type 2 diabetes and exactly what happens
    to bring the body back to normal depended upon developing and carrying out laboratory
    tests. Dr Ahmad Al-Mrabeh took the work to new heights with his scientific ability
    and ingenuity. This was not always straightforward, as world events impinge upon
    science. Ahmed came from Syria to the UK to undertake PhD studies, completed these
    several years – but was then marooned here by the outbreak of war back home. His
    fantastic contribution to reversing type 2 diabetes was carried forwards at the
    same time as six years of battling extradition by an automatic bureaucratic process.
    Fortunately for people with diabetes, for UK science and for Ahmed, the long struggle
    with the immigration process to contribute further to diabetes research has been
    won.


    Professor Mike Lean of the University of Glasgow is one of the world''s leading
    experts in obesity, nutrition and diabetes and the Diabetes Remission Clinical
    Trial (DIRECT) is a triumph of our collaboration. It was essential to find out
    if the means of achieving remission of type 2 diabetes could be rolled out in
    routine NHS practice, and our combined expertise was needed to make the trial
    success. The full story of DIRECT (a large team effort) is yet to be told, and
    this book is focused upon the early studies on the how and why of reversal of
    type 2 diabetes. I must make special mention of Alison Barnes who joined DIRECT
    as senior researcher dietitian to train NHS staff in the Newcastle area. Her energy
    and professionalism in transferring skills to primary care nurses or dietitians
    were legendary. Alison has also contributed to many ways to spread knowledge of
