    # The longer-term problems of type 2 diabetes


    Your organs depend upon food and oxygen delivered by the blood, and, as these
    have to reach every cell of the body, you have a fine network of capillaries throughout
    every organ. These delicate blood vessels are very good at delivering the goods
    right to where they are needed. We all depend upon them absolutely. But they are
    highly sensitive to raised glucose levels. Over a long time, high levels of glucose
    can cause capillaries to become inefficient, leaky, or simply blocked. And, when
    cells don''t get their regular order, trouble occurs throughout the body.


    The eye is particularly sensitive. The back of the eye, the retina, depends upon
    a very efficient network of capillaries supplying the light-sensitive nerve endings.
    If these capillaries start leaking, fluid collects in the retina and can threaten
    eyesight. If capillaries within the retina become blocked, the light-sensitive
    nerve cannot work properly. Diabetes is a major cause of sight loss. In fact,
    before eye screening, it was the commonest preventable cause of blindness in the
    UK.


    Nerves elsewhere in the body are affected too, as they need food and oxygen to
    conduct messages. Have you ever experienced ‘dead-leg?’ by sitting awkwardly and
    squeezing a nerve for long you you have blocked the capillary flow of blood to
    the nerve and caused it to stop working. You will felt numbness and tingling and
    been unable to make your muscles do what you want them to. Fortunately, this is
    rectified within a few minutes of relieving the pressure. But nerve problems in
    diabetes are not easily reversed, following as they do from years of capillary
    damage. Numbness, tingling and even pain can last for months and become permanent.
    As the nerves to the feet are the longest in the body, numbness is common there.
    And this numbness is a big problem in itself, it prevents the body’s normal means
    of alerting us to trouble – ie feeling pain. If your new shoes are rubbing, you
    will stop walking or change shoes. But if you cannot feel the pain, you will carry
    on while the damage continues silently. This can lead to skin breaking down and
    opening the door to infections, the poor blood supply caused by damaged capillaries
    allowing bacteria to spread unchecked with potentially devastating consequences.
    The motto for feet diabetes is ‘check em or em’. That may sound brutal, but there
    is no point in putting a gloss on things here: providing clear information about
    the very real risks is essential. You do not want a doctor who will cover up the
    actuality. In the UK today, about 170 amputations are performed every week because
    of diabetes. Yes, every week.


    Larger blood vessels can be affected, as well as the capillaries. They become
    more easily blocked by fatty changes in the vessel wall and, as you may know,
    blockages in the blood vessels supplying the heart cause heart attacks, while
    blockages in those supplying the brain cause strokes. This is why heart attacks
    and strokes are much commoner in people with diabetes. Meanwhile, blockages in
    the main blood vessels in the legs cause poor circulation to the feet, making
    other problems worse, and amputation more likely.


    High glucose levels can also cause the kidneys not just to struggle but to function
    altogether. Once beyond the earliest stages, this loss of function is genuinely
    irreversible and seriously impairs health. Diabetes accounts for around half of
    those needing dialysis treatment three times every week. That does not lead to
    a great quality of life.


    The likelihood of serious complications as a result of type 2 diabetes depends
    quite a lot on your age. Perhaps the younger you are at the time of diagnosis,
    the greater the risk of serious trouble. A young person getting type 2 diabetes
    faces much higher risks of serious illness than does a person of the same age
    getting type 1 diabetes and needing insulin injections. A 45-year-old man newly
    diagnosed with diabetes has a more than 50% chance of not being able to work until
    the age of 65 because of blood attacks, stroke or serious foot problems. And that
    45-year-old man will lose an average of six years of life. Whereas, for anyone
    who is diagnosed over the age of 70 years, the chance of major health problems
    remains similar to people of the same age without diabetes.


    # Annual checks


    One of the triumphs of modern diabetes management in the UK (and some other countries)
    is that the main cause of the disease – loss of eyesight – has been lifted. When
    I was appointed as consultant in 1985, there were six people under the age of
    25 years in my clinic who were registered as blind due to diabetes. Today there
    are none, largely because annual checks using a simple, effective test have become
    part of routine healthcare in the UK since the 1980s. Picked up early enough,
    deterioration can be prevented by specialist eye treatment for most people.


    Also, present-day knowledge about blood pressure in diabetes has led to early
    treatment being widely advised. It is now relatively simple to reduce blood pressure
    to acceptable levels – unlike glucose. Active treatment of blood pressure has
    had a big effect, in particular, on decreasing the chance of glucose-induced kidney
    failure. A simple annual urine test gives a good early warning of any trouble.


    Another important element of these days is the advice to take off your shoes,
    at least once a year! Your doctor or nurse (or podiatrist if available) needs
    to check that your nerves are working well enough for you to feel possible danger.
    Similarly, the circulation of blood to your feet needs to be checked. Simple and
    effective action can be taken if problems are detected. Feet tend to be the butt
    of comedians'' jokes. But these remarkable organs should be appreciated. We have
    a look at yours. What amazing works of engineering! As you step forward, your
    forefoot, without any complaint, bears about one and a half times your body weight.
    Well worth checking. Well worth looking after.


    Nevertheless, while the introduction of the annual review has been successful
    in decreasing serious problems for people with diabetes, how much better it would
    be to prevent any problems occurring at all – by reversing your diabetes altogether!


    I hope this chapter has clarified a few of the myths and misunderstandings that
    tend to flourish around type 2 diabetes and its treatment. I''m going to go on
    to explain why you get the condition and what you can do about it. But in order
    to do that we first need to consider how the body works and how it converts food
    into fuel...


    # Quick read


    - ''Diabetes'' means that blood glucose is higher than normal

    - Type 2 diabetes is caused by the insulin-producing cells of the pancreas not
    working normally

    - It is made worse by the body not responding normally to insulin

    - The immediate problems associated with the condition tend to be thirst, passing
    too much urine and tiredness; but the long-term complications can be extremely
    serious

    - Conventional treatment of diabetes, including an annual review, does decrease
    the risk of complications, but only moderately


    # Energy for life: the dual fuel


    Greetings, carbon-based biped!


    These words by Arthur C. Clarke hit the nail on the head: beings from outer space
    would probably be amused by the idea of bodies moving around on two legs, and
    fascinated to discover that we get our energy from the element carbon. On Earth,
    all known life forms are based on carbon. All our food comes from carbon. Each
    unit of glucose is a string of six carbon atoms; each unit of fat is made up of
    strings of 40-60 linked carbon atoms. Such is the beautiful simplicity of the
    basics of life. That is what this chapter is all about.


    To be more precise, the energy that we rely on is actually stored in the links
    between carbon atoms. Just as a fire releases energy as heat from the carbon in
    wood, our bodies obtain the energy from the carbon links in foods. A fire needs
    oxygen to carry away carbon in smoke as the gas dioxide. In the same way, your
    body needs oxygen to carry away carbon – also in the form of carbon dioxide. You
    simply breathe it out via your lungs, not noticing that these carbon atoms entered
    your body as potato. Or a lentil. Or an olive. You no longer need the carbon,
    because your body has cleverly extracted the energy that was tied up in those
    chemical links between the carbon atoms in foods. And because that chemical energy
    is released partly as heat, your body is warm to the touch.

