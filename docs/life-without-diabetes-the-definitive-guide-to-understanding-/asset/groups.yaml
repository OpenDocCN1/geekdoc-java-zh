    it needs to store glycogen whenever the blood glucose level rises. Liver cells
    have no barrier to glucose as it floods into them, and is then turned into glycogen.
    That is okay, but the liver can store only a relatively small amount of glucose
    as glycogen.


    # Your muscle


    The earliest detectable clue that someone is likely to develop type 2 diabetes
    in the future is that their muscles are relatively resistant to insulin. That
    is to say, insulin, the master controller of the metabolism, cannot fully switch
    on the uptake of glucose in muscle. This will have been true from childhood. It
    is mainly determined by the mixture of genes you happen to inherit. The lack of
    a full response to insulin does not cause any immediate problems and most people
    are unaware of it. Their muscle will simply be more insulin-resistant than that
    of their friends who are not destined to develop type 2 diabetes.


    Chapter 3 describes what happens to the carbohydrate in meals, in a person with
    normal sensitivity to insulin in their muscle: after breakfast, the rise in blood
    insulin levels causes the muscles in the body to start taking up more glucose
    and storing it as glycogen. The muscle stores do a very important job in allowing
    safe storage of glucose to cope with the huge influx from each meal. That food
    energy is later on to other tissues. Muscle normally acts as a dynamic buffer,
    smoothing the swings in blood glucose that would otherwise happen. As all the
    muscle make it the largest organ in the body, this is important.


    But in those prone to type 2 diabetes, storage of glucose as glycogen in muscle
    is inadequate. The pie charts overleaf show the results of one of our very early
    studies applying magnetic resonance to try and understand type 2 diabetes. This
    study involved measuring the amount of glycogen in thick muscle before, and then
    at intervals after, breakfast before lunch. The chart in figure 4.2 shows the
    increase in glycogen stores in people who do not have muscle insulin resistance.
    But just look at what happens to the people who do. They are unable to store more
    than a tiny fraction of the meal carbohydrate as muscle glycogen.'
