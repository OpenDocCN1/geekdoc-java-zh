    # Step 2 in practice


    Moving from the weight loss phase back to eating ordinary foods needs some careful
    planning. We realised this after the Counterpoint study, which was designed only
    to test the Twin Cycle Hypothesis. We had focused mainly on how to lose a lot
    of weight fast, without sufficiently thinking through the challenge of the re-entry
    period. Our research volunteers described feeling at sea going back into the kitchen.
    What to eat? How much to eat? Could they drink?


    But what we also learned that there was an opportunity for people here: eight
    weeks of just eating a package for each meal created a blank slate on which to
    write new dietary habits.


    Just as there is a clear focus during the initial weight loss phase, there must
    also be a definite plan for the stepped food reintroduction phase.


    +   * Start with the evening meal, going back to a normal (smaller than usual)
    plate of food instead of the shake, but continuing your weight loss diet during
    the rest of the day.'
  - '[PAGE 123]


