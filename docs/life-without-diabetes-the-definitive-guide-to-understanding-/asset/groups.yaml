    ## Don’t be fooled


    How do you know if something is true? Can you be certain that the information
    in this book is true?


    Health stories are everywhere – in newspapers, magazines, on radio and television,
    and on social media. Tips and advice about food and ‘healthy eating’ are especially
    common. And they range from ‘highly likely to be true’ to ‘almost certainly nonsense’.
    Don’t assume that any one piece of information is correct; everything demands
    a questioning approach. Here are some ideas and ground rules that may help you
    to sort out solid information from misleading observations or baseless opinion.


    ## Fallacy by association


    From the 1970s to the 1990s several large studies showed that postmenopausal women
    could decrease their risk of heart disease by 35-50% by taking hormone replacement
    therapy (HRT). HRT is clearly evident in relieving menopausal symptoms, but the
    decision whether or not to advise its use was swayed by the likely benefit for
    the heart, especially in women with diabetes. By the 1990s, HRT agents were the
    most commonly prescribed class of drug in the United States. But all this was
    based on cross sectional studies which looked at groups of women who were taking
    HRT and comparing outcomes with those who were not.


    As discussed earlier, the only way to be certain that a treatment produces the
    benefits intended is to carry out an intervention study. In 1998, the first randomised
    trial of HRT on preventing heart disease was reported. There was no benefit –
    and alarmingly, a slight suggestion of a higher risk of heart disease in HRT users.
    These findings have been confirmed. So why did the original large studies mislead
    on such a grand scale? There are likely to have been several reasons. One is that
    women who sought out HRT tended to be healthier, wealthier and behaved in other
    ways that decreased risk of heart disease. But the important point is that large
    studies count events in different groups are bedevilled with unrecognised associations
    which may lead to a false conclusion.


    Another classic example was the notion that eating a high-fibre diet had a major
    effect on protection against bowel cancer. This idea also arose in the 1970s,
    following observation of the notably high-fibre intake in African people living
    a traditional lifestyle and their very low rates of bowel cancer. The belief in
    a causative link between low-fibre diets and increased risk of bowel cancer ran
    for quite a long time and still pops from time to time. However, the lack of bowel
    cancer in these early observations in Africa was largely a result of few surviving
    into older age when the incidence of bowel cancer rises sharply. Certainly it
    is a good thing to eat fibre-containing foods as vegetables to keep the bowels
    happy, but this should be separated from the associated myths.


    When reading a newspaper or watching TV – it tends to be the media that broadcast
    these cause-and-effect stories, rather than the scientists around the collecting
    of data – look out for fallacy by association (appropriately shortened to feb,
    as in ‘fib’). How can one be spotted? There are several clues. Firstly, beware
    of very large studies. If a study has involved hundreds or thousands of people
    it may be merely a ‘counting heads’ type of study. These can be very important
    in identifying patterns of disease, but are not able to ‘prove’ that a disease
    is caused by some factor. Reasonable proof can come only from testing an idea.
    If you want to find out whether eating a certain food makes it more likely that
    a disease will develop, a change has to be made in a group of people and the effect
    of this measured. an intervention study is needed. To prevent casual associations
    confusing the results, it is necessary to divide the willing volunteers into groups
    at random, resulting in groups as similar in all respects as possible before they
    are treated differently. Then one group is given the food under test and the other,
    a ‘control’ group, is asked not to eat it. Research studies are difficult to do,
    require a lot of money and take a long time. But only they can give a clear answer
    to the question.


    One complete example of this is provided by the work of my colleague Roden, who
    is Director of the German Diabetes Centre in Dusseldorf. He organised a large
    population study which found that people who ate a lot of red meat were insulin-resistant
    than those who did not. The same study showed that drinking a lot of caffeine
    and not enough fibre were also associated with insulin resistance. Almost always,
    epidemiological studies stop there, and the beliefs develop. Headlines follow
    and the lifestyle pages of newspapers and magazines spread the word. So does insulin
    resistance increase if people eat a lot of red meat, drink a lot of coffee and
    have foods fibre?


    Michael is an all-round scientist, so he went on to do the definitive study. This
    involved dividing new volunteers into groups at random, to ensure that they were
    similar. One group was assigned to eat lots of red meat, drink lots of coffee
    and to avoid fibre. The other group was instructed to do the opposite. Importantly,
    urine tests were carried out on everyone to check whether they were following
    the research guidance. It was very carefully conducted. And the answer? Eating
    lots of red meat, drinking lots of caffeine and avoiding fibre had no effect at
    all in causing insulin resistance. It had not been for careful scientific work
    continued over a long time, the myths surrounding red meat, caffeine and fibre
    would have been perpetuated.


    There was another important observation in this study that would have confused
    the results if there had not been a ''control'' group to allow comparison. Not
    only was there because both groups had actually lost around 5kg in weight without
    being asked to do so. This is a recognised phenomenon, called ''the Hawthorne
    effect''. When people take part in a study, even over a long period of time, they
    behave slightly differently.


    The Hawthorne effect was first described in experiments for very different reasons.
    Back in the 1920s at the Hawthorne light-bulb factory in Chicago, the idea was
    that brighter lighting increased productivity. It was discussed with all the workers
    and at first the answer seemed to be very clear: turn up the lighting and productivity
    goes up.

