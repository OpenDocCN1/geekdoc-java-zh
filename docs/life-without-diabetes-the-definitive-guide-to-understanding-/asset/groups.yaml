    “平衡之道”的结果格外引人注目，因为在研究期间逆转了糖尿病的组并没有变瘦。平均 BMI（身体质量指数）从 33 开始，下降到 29。因此，大约有一一半的人在技术上仍然属于“肥胖”。但他们继续免受糖尿病。他们携带的脂肪比实际需要的多，但对他们来说，脂肪留在皮肤下的安全脂肪层中，没有重新分布并堵塞肝脏和胰腺。至少在整个
    9 个月的研究期间是如此。


    哇！一个理解 2 型糖尿病的新世界正在开启。“平衡之道”证实，逆转糖尿病的过程可能作为 2 型糖尿病患者的常规治疗方法。


    ## “胰腺”研究


    预测其中一些有争议的 β 细胞因为体内和周围脂肪过多而正处于挣扎。当“对照点”的结果公布时，这一讨论变得非常重要。一些专家以非常合理的观点指出，细胞的恢复可能与减重只有间接关系。也许这种苏醒是巧合，是由于其他原因引起的。胰腺脂肪的下降仅仅是因为减重本身吗？也许在减重后，所有器官的脂肪水平都会下降。如果是这样的话，这种情况也会发生在没有患有
    2 型糖尿病的人身上。这是我们可以测试的：胰腺脂肪的下降是糖尿病患者身上发生的特殊现象，还是也会发生在非糖尿病患者身上？


    实现这一点最简单的方法是比较减重手术后的情况。手术后的减重无论个人是否患有 2 型糖尿病都是那样的。我们可以比较每组胰腺脂肪的变化。


    减重手术在引起体重减轻方面非常有效。出乎意料的是：如果你的胃突然缩小到拇指大小，你也会减轻体重。在英格兰东北部，我们拥有最大的减重手术服务之一，并有卓越的外科医生。Peter
    Small 先生和 Sean Woodcock 先生在策划合作研究方面提供了巨大的帮助。在欧洲糖尿病基金会的资助下，“胰腺”研究启动了。患有和不患糖尿病的参与者在体重和年龄上相似。八周后，无论是否患，都减轻了约
    13 公斤。这项研究证实，糖尿病患者胰腺内的脂肪水平异常高，但在食物摄入减少后这种水平会下降。相比之下，非糖尿病患者则完全没有下降。我们现在可以相当确定，脂肪的下降与糖尿病本身有关，并与胰岛素分泌的恢复有关。医学上很少有绝对确定。


    “胰腺”研究还允许我们测试另一个想法。正如之前提到的，一些人认为减重手术通过肠促胰激素改善血糖控制具有“特殊”作用。这在理论上看起来不太，但现在我们有机会发现我是对是错。等待减重手术的糖尿病患者被随机分为两组。一组接受手术，并在前后测试。另一组进行为期一周的低卡路量饮食，并在前后测试（然后他们才接受手术）。这完全取决于食物摄入的突然减少。


    Sarah Steven 设计了一种特殊的少量测试食物，供减重手术后的人使用。在手术组中，由于胃旁路，这种小测试食物迅速进入小肠。手术后，肠促胰激素剧增（七倍）。但无论人们是接受了手术还是仅仅减少了等量的卡路量，餐后的胰岛素反应是相同的。在美国进行的一项类似研究发现了相同的结果。

