    # A word on alcohol


    Alcohol requires special consideration, because it is so calorific. One gram of
    alcohol contains almost as many calories as one gram of fat: seven calories in
    a gram of alcohol, to be precise, compared with nine calories in fat. However,
    I certainly would not advocate a total ban on alcohol. For many people, it is
    a source of much enjoyment, and can be built into a way of life consistent with
    keeping weight steady.


    Everything revolves around quantity. A home-poured glass of wine may contain 140
    calories. That does not sound much – about the same as a slice and a half of bread.
    But three glasses can just slip down, and they would bless you with 420 calories
    – a huge number if taken on a regular basis. Similarly, a pint of beer contains
    200 calories. Downing five pints on an evening out adds 1000 calories to your
    daily intake. No wonder a man''s expanding waistline is sometimes referred to
    as ‘beer-belly’.


    The basic message on alcohol is to enjoy it in moderation – as long as you are
    honest with yourself about how much is going down and you can keep your consumption
    within the weekly calorie envelope that will keep your weight steady.


    # Getting around


    The single, clearest finding of all the scientific studies on preventing weight
    gain is this: the best long-term outcome will be gained from a combination of
    avoiding excessive eating and drinking together with a sustained increase in daily
    physical activity. The benefits of regular, prolonged activity are discussed in
    Chapter 2. For people who enjoy exercise of any sort (dancing, aerobics, tennis,
    running) that is wonderful – but provided no extra food is taken because of ‘exercise’.
    Walk past those vending machines positioned for maximum temptation as you leave
    the gym.


    How can you ensure a reasonable level of physical activity each day? Make it part
    of getting where you have to go. For instance, people living in London have the
    highest average step count of any city in the UK, because most cannot park anywhere
    near their place of work. There may be several reasons why people living in'
  - '[PAGE 141]


    London also have the lowest average BMI in the UK, but one of them is that they
    do more walking.


    But we can all build more walking into our lives. Absolutely anywhere is within
    walking distance - if you have the time. However, in practice, for longer distances,
    cycling can be good anything other than sitting in a car or on a bus. People who
    cycle regularly have been shown to have longer, healthier lives, provided that
    the route to work is safe.


    # # What is in your cupboard?


    There is frequent talk about our ''obesogenic environment''. It is assumed to
    refer to the pernicious combination of readily available, commercially produced
    high-calorie foods and our increasingly sedentary lifestyle. However, less attention
    has been paid to the obesogenic microenvironment of the home. Have a look at yours.


    You may spend more hours in your home than anywhere else. If you are in employment,
    perhaps you spend 40 hours at work, but on most mornings, evenings, weekends and
    some holidays you will be at home. If you are not working full time, you are likely
    to spend even more time at home. What happens if you feel hungry, or a little
    bored? Many people browse around to find something to put into their mouths.


    Why do we do this? Over those 200,000 years of human evolution (and 3.6 million
    years of mammalian evolution before that), we have been searching out available
    food a top priority. In the distant past, frequent periods of food scarcity due
    to natural disaster or social upheaval made it imperative to make hay while the
    sun shone. Who were best at this would survive the next cycle of crop failure
    or the lack of successful hunting. Critically, as we saw in Chapter 2, undernourished
    people are less fertile – just look at fertility symbols from any civil civilisation
    and you will see the fat necessary for reproduction are prominent. For generations,
    being adequately nourished has been seen as a very good thing. Undernourished
    people tend not to pass on their genes. Continuing the species is an absolute
    necessity. Thanks, ancestors!


    However, the fine specimens who seek out food most successfully have been rudely
    wrong-footed in the last 60 years. In this brief period for Homo sapiens, food
    supply for much of the world has enabled the poorest to obtain toxic quantities
    of things to eat. The full impact of this toxicity for the general'
