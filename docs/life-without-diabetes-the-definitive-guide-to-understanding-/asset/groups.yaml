    在 2 型糖尿病中，一半的β细胞似乎被杀害了。谁是嫌疑人呢？根据帕斯莫尔的洞察，“肠促胰素先生”（Mr Incretin）似乎有完美的不在证明。其他热门的反派还包括神秘的淀粉样蛋白小姐（Ms
    Amyloid）和炎症先生（Mr Inflammation）。


    淀粉样蛋白有时在 2 型糖尿病患者的胰岛中观察到。20 世纪 80 年代，认为淀粉样蛋白是 2 型糖尿病β细胞死亡原因的观点被广泛建立，但其依据是最薄弱的。它一直作为一个潜在的反派潜伏着，因为从理论上讲，虽然淀粉样蛋白小姐可能有这种手段，但她偶尔才会出现在犯罪现场。


    炎症可以在身体许多不同部位引起许多问题。它有时会是一个杀手——例如，在“儿童期”糖尿病或 1 型糖尿病中。在那种类型的糖尿病中，炎症细胞的免疫攻击是导致β细胞死亡问题的绝对核心。在
    2 型糖尿病中，炎症的程度似乎不足以作为杀人武器。炎症先生也没有位列嫌疑人名单的前列，无论是因为手段还是因为出现在现场。


    肝脏先生，请留。在纽卡斯尔和其他等地的研究已经显示了肝脏如何一直控制血糖。它控制夜间和餐后的葡萄糖流——在 2 型糖尿病患者中控制得非常糟糕。我们知道肝脏会根据胰岛素的反应设定血糖水平。在
    2006 年那个重要日子之前的八年里，我们一直在研究肝脏脂肪的影响，并发现过量的脂肪会强烈阻止胰岛素发挥作用。脂肪本身使肝脏产生了胰岛素抵抗。


    我在美国耶鲁大学的亲密同事基特·彼得森（Kitt Petersen）和杰里·舒尔曼（Jerry Shulman）在前一年就显示，几个月的中适度饮食限制可以改善肝脏脂肪水平。这反过来又提高了肝脏对胰岛素的反应。1990-1991
