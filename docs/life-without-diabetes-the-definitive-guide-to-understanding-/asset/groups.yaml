    - 5. 对于减肥阶段的食谱，将布麦与其他塔布勒拉配料混合并备用。塔布勒拉可以提前准备并直接从冰箱取出使用。

    - 6. 当你准备好煮鸡肉时，将烤架预热至中火。将鸡肉条串在木签上。

    - 7. 将串签放在烤架下，每几分钟翻面一次，直到鸡肉煮熟（约15 分钟）。

    - 8. 然后用叉子将鸡肉从签上取出，放在盘子里，配上塔布勒拉、酸乳酱和橄榄油调味的绿色沙拉一同享（3份橄榄油加1份柠檬汁、盐和黑胡椒，在瓶中摇匀混合）。


    ## 浓郁汤


    使用步骤 1 的食谱：大块蔬菜汤


    准备时间：15分钟；烹饪时间：30分钟；可4人份


    其他配料

    - 400g 罐装奶油豆

    - 一把珍珠大麦


    做法

    在加入芹菜时，在汤煮沸之前拌入滤干的一罐奶油豆和一把珍珠大麦。豆类能为汤提供蛋白质，使其更饱腹，而大麦是慢释放的淀粉来源。


    ## 晚餐：印度香料卷菜鸡喱


    使用步骤 1 的食谱：简单蔬菜咖喱。我们在咖喱中加入了扁豆提供蛋白质和慢释放碳水化合物，以及卷菜和更多的香料。


    准备时间：15分钟；烹饪时间：60分钟；可4人份


    其他配料

    - 4 个无骨鸡腿，切块

    - 100g 扁豆

    - 1 汤橄榄油

    - ½ 茶匙孜然籽

    - ½ 茶匙芥末籽

    - 0-2 个青辣椒（可选，视口味而定），切片

    - ½ 茶匙黄黄粉

    - ½ 茶匙香菜粉

    - 1 头小头白甘蓝，切片；也可根据喜好替换其他切片的绿叶蔬菜

    - ½ 个柠檬汁


    做法


    1. 拌入咖喱粉后，将鸡肉加入锅中煎至四面封口，频繁翻炒。

    2. 与番茄同时拌入扁豆。

    3. 在大号不粘锅中用中火加热橄榄油，让孜然籽和芥末籽在油中滋 1 分钟。

    4. 加入辣椒（如果使用）和姜黄，煎 1-2 分钟。

    5. 加入甘蓝和少许水，搅拌均匀使其裹上香料。

    6. 盖盖煮 4-5 分钟，在上桌前加入柠檬汁和香菜粉，配咖喱一同。


    作为替代方案，咖喱也可以搭配花椰米饭。


    ## 烤三文鱼配炒蔬菜


    使用 [Helen 的无面炒面食谱](https://www.example.com/recipe)


    准备时间：10分钟；烹饪时间：20分钟；可2人份


    其他配料：

    - 2 片野生三文鱼排

    - 少许老抽油

    - 1 个红辣椒，去籽切片

    - 1cm 姜根，擦末

    - 1 瓣大蒜，压碎

    - 1 个青柠汁

    - 1 份全麦面


    做法


    1. 将烤箱预热至 180°C/燃气标志 4。

    2. 将酱油、辣椒、姜、大蒜和青柠汁在一个碗中混合。

    3. 撕下至少鱼排两倍长的铝箔，制作 2 个大型铝箔包。将铝箔对折并密封 2 侧，留出第 3 侧。

    4. 为鱼排调味。放入铝箔包中。在封口最后一侧之前加入几勺酱汁混合物。

    5. 放在烤盘上，在烤箱中烤 15 分钟。

    6. 与此同时，按照包装说明煮面。

    7. 制作炒蔬菜（见第 262 页的炒面），将其加入滤干的面中。

    8. 从烤箱取出铝箔包。用利刀小心戳破铝箔。在蒸汽散出时务必退后。

    9. 用铲子或鱼铲将鱼转移到 2 个盘子里，与炒蔬菜一同上菜。


    ## 步骤 3 的食谱


    在低热量饮食后，缓解期的人吃什么？除了摄入过量食物，几乎可以吃任何东西，尤其是高热量食物。有很多好书提供了美味、饱腹餐点的想法，但这里提供了一些之前研究参与者的喜爱食谱。


    ## 青酱脆皮鳕鱼配烤地中海蔬菜


    准备时间：15分钟；烹饪时间：45分钟；可2人份


    配料


    - 用于青酱脆皮鳕鱼：

    - 2 片鳕鱼（或其他白肉鱼）

    - 2 汤匙罗勒青酱

    - 2 片全谷面包*，去皮

    - ½ 个柠檬汁


    - 用于烤制地中海蔬菜：

    - 1 汤匙橄榄油

    - 切成大块的混合蔬菜——红洋葱、西葫芦、椒和樱女番茄效果很好

    - 新鲜或干百里香

    - 盐和黑胡椒


    - 做法

    1. 将烤箱预热至 200°C/燃气标志 6。

    2. 用厨房纸吸干鱼排并备用。

    3. 将蔬菜放入碗中，加入橄榄油和百里香，搅拌均匀。

    4. 将蔬菜铺在烤盘上，在烤箱中层烤 20 分钟。

    5. 在食物处理器中将面包打成面包屑。

    6. 将面包屑与柠檬汁混合。

    7. 将混合物铺在鱼排上。

    8. 在烤箱中烤 15 分钟直到呈金黄色。

    9. 从烤箱中取出盘。

    10. 搭配烤蔬菜食用。


    ## Helen 的奶油西芹配鱼


    准备时间：30分钟；烹饪时间：45分钟；可2人份


    配料

    - 1 汤匙橄榄油

    - 1 个小头洋葱，切碎

    - 2 片鱼（鳕鱼、黑鳕）

    - ½ 杯水

    - 1 个红椒，去籽切碎

    - 1 根西葫芦，切片

    - 一束新鲜莳萝

    - 2 根西芹，去皮切成块

    - 2 汤匙奶油乳士（或酸奶油）

    - 伍斯特酱

    - 一小撮碎肉豆蔻粉

    - 1 汤匙碎帕玛森芝士

    - 盐和黑胡椒


    做法


    1. 将烤箱预热至 180°C/燃气标志 4。

    2. 用橄榄油煎炒洋葱直到变透明。

    3. 将黑鳕放入带盖的砂陶锅中，加入水、红椒和莳萝。

    4. 盖上盖烤 25 分钟。

    5. 与此同时，将西芹放入沸水中煮 20 分钟。

    6. 沥砂陶锅中的大部分水。

    7. 捣碎西芹，加入奶油乳士、伍斯特酱、肉豆蔻粉和调味。

    8. 将西芹泥抹在鱼混合物上。

    9. 撒上帕玛森芝士。

    10. 再次将锅不带盖放入烤箱，再再烤 15 分钟。

    11. 搭配一份绿豆角食用。


