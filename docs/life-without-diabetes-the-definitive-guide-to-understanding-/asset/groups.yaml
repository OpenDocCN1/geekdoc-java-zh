    # Eggplant and Ricotta Rolls with Tomato Sauce


    Prep: 15 minutes; cook: 30 minutes; makes 2 servings


    INGREDIENTS

    2 medium eggplants, cut into ½cm slices lengthways

    2 tablespoons olive oil


    For the filling:

    500g baby spinach, blanched and drained

    250g ricotta

    1 buffalo mozzarella

    Pinch of grated nutmeg

    2 spring onions, finely chopped


    For the sauce:

    1 tablespoon extra-virgin olive oil

    450g cherry tomatoes, halved

    1 garlic clove, crushed

    Salt and black pepper


    WHAT TO DO

    1. Preheat the oven to 220°C/gas mark 7.

    2. Brush both sides of the eggplant slices with oil, then lay them on a large
    baking sheet.

    3. Bake for 15-20 minutes until tender, turning once. Remove the tray from the
    oven.

    4. Turn down the oven temperature to 180°C/gas mark

    5. To make the filling, mix the spinach, ricotta, mozzarella, nutmeg and spring
    onions in a bowl.

    6. Lay all of the eggplant slices on a clean surface. Place about one teaspoon
    of filling at the bottom edge of each one.

    7. Roll up each eggplant slice, like a cigar, around the filling, then rest seam
    side down on a plate.

    8. For the sauce, heat the olive oil in a pan and add the cherry tomatoes.

    9. Simmer for 8-10 minutes or until the tomatoes begin to break down.

    10. Remove from the heat and stir in the garlic. Season, to taste, with salt and
    freshly black pepper.

    11. Spoon half of the sauce into the bottom of an ovenproof dish.'
