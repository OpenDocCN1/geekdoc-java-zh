    ## 一场谋杀案与双周期


    ### 谁是凶手？


    失踪发生了，人们怀疑是谋杀。受害者是β细胞。当在显微镜下观察2 型糖尿病患者的胰腺组织时，似乎一半的β细胞直接消失了。失踪，推测已死亡。而在糖尿病病程较长的人中，几乎三分之二的细胞已经消失。事实似乎是肯定的：β细胞正在被一个一个地杀害。到底发生了什么？凶手能被绳诸法网吗？


    2006 年，正如引言中所描述的，我面对那张图表，它显示 2 型糖尿病的高血糖可以在七天内恢复正常。该科学论文报告，这是由于为了极肥胖者减肥而进行的减道手术。作者认为，血糖的快速变化可能是由于肠道产生的激素引起的——肠促胰激素。距离我作为医学生听从雷格纳德·帕斯莫尔（Reginald
    Passmore）教授预测这些激素的存在已经过去了 35 年，而这些激素随后被鉴定出来。看到他的科学推断是如此正确，令人欣慰。但这些肠促胰激素极不可能是论文中所述的清晨血糖如此迅速变化的原因。肠促胰激素根本无法做到这一点。它们在夜夜和清晨对血糖没有产生主要影响；它们几乎完全在餐后起作用。而且我们知道，那些接受胃部手术的人在术后七天内没有吃过任何东西。没有进餐——就没有肠促胰激素的增加。这一切都是宝贵的见解。因为如果不是肠促胰激素导致了血糖变化，那么就是其他东西在起。


