    ## 5.6 在易感人群中，胰岛素细胞内过多的脂肪会导致它们逐渐停止正常产生胰岛素。在2型糖尿病的早期，这是一个可逆的过程，但如果持续时间太长，就会变得不可逆转。


    这个迷人的故事并没有于此结束。2型糖尿病患者承受多余脂肪代谢冲击的能力各不相同。有些人在患有2型糖尿病20多年后，仍能恢复到非糖尿病的血糖控制水平。而有些人似乎很快就丧失了这种能力。换句话说，不同的人面对脂肪攻击时，其β细胞的耐用性不同。那些在患病24年后仍能逆转2型糖尿病的人，一定拥有具有易感但异常耐用的β细胞。看起来似乎有一组不同的基因决定了β细胞的耐用性。在未来的几年里，我们无疑会看到这一领域的进一步进展。


    但对于任何病期的2型糖尿病患者来说，底线是：目前，发现是否可能逃离糖尿病的唯一方法就是大幅减轻体重。


    ## 快速阅读


    - 双循环假设将关于血糖控制的最优可用证据联系在在一起

    - 该假设的预测在一系列研究中得到了验证

    - 实验结果显示，2型糖尿病是由肝脏产生过多的葡萄糖和脂肪引发的

    - 过量的脂肪导致胰腺β细胞失去产生胰岛素的特殊能力

    - 肝脏和胰腺的缺陷都可以通过减轻减轻来纠正

    - 所谓的“谋杀”从未发生：当β细胞被阻止产生胰岛素时，它们在显微镜下无法检测到，但仍然存活


    ## 6


    ## 个人脂肪阈值


    关于2型糖尿病的新闻经常伴随着体型巨大的人的照片，给人一种2型糖尿病是由肥胖引起的印象。即使是医生有时也会说2型糖尿病的流行是“由于肥胖”。这种普遍的假设认为，如果一个人患有2型糖尿病，他们一定是肥胖的，而且都是他们自己的错。


    但事实是，绝大多数极胖的人并没有患2型糖尿病，而在所有患该疾病的人中，只有一半人的BMI处于肥胖范围内。

    让我们面对现实吧。


    ### 为什么我得了2型糖尿病？


    勒内·柯霍（René Laennec）是发明听诊器的著名法国医生。他经常对学生们说：“听听你们患者的话。他们正在给你诊断。”他并不是说用他的新发明去听心脏或肺部。他谈论的是医生最重要的技能——知情的倾听。倾听患者讲述他们为何寻求医疗建议的故事，可以帮助理解导致他们症状的疾病类型。这种信息在今天仍然具有意义。


    2011年，当我们关于逆转2型糖尿病的第一项研究结果在报纸和电视上被报道时，我们收到了大量糖尿病患者的邮件，他们告诉我们自己的状况、患病了多久、经历过哪些并发症以及控制情况是否良好。许多人只想知道他们如何摆脱糖尿病。但有很大一部分少数人发来邮件说，他们并不超重，但仍然得了2型糖尿病。许多医生对这种现象并不熟悉，并且已经习惯了患者询问他们为什么会这样：“为什么我得了2型糖尿病，而我的朋友都比我胖，他们却没得呢？”


    起初，这似乎与第5章描述的“双循环假设”相矛盾。该假设的起点是：长期摄入超过身体所需的食物是导致该疾病发生的必要条件。


    对我来说，对2型糖尿病中可能发生的情况的早期见解，几年前来自一个有有疾病的非肥胖者。我们这个人称为马克（Mark）。马克对糖尿病发生在他身上感到愤怒，因为他并不肥胖——甚至不超重——而且不得不来看是否有方法可以摆脱它。我们进行了血液检查，结果显示他的肝功能没有想象的那么健康，这引起了我的注意。在“双循环假设”建立之前，我就知道在2型糖尿病中，这些特定的检测结果往往处于正常范围的上限——或者略高。通过我们的研究，我还知道2型糖尿病患者肝脏中存在高水平的脂肪，这会导致肝脏产生过多的葡萄糖。


    因此我推断，高水平的肝脂肪可能导致了问题，进而导致了2型糖尿病。如果是这样，我们可能就有行动方案了。为什么不建议减轻体重作为消除马克肝脏脂肪的一种可能方法，从而可能改善他对糖尿病的控制呢？这种非常规的建议在提供时并没有保证成功；它只是恢复健康的一种可能途径，而且在最好的情况下，履行了希波克拉底很久以前提出的准则：“不伤害”。但马克坚持认为他想恢复正常，或尽可能恢复到正常，并说他会尝试一下。


    于是，“正常体重”的马克减轻了体重。他的BMI从24下降到略低于20。糖尿病消失了。


    有趣的是，恢复正常的不仅是清晨的第一口血糖。吞下测试性葡萄糖饮料两小时后的血糖水平也恢复了正常。显然，除了预测的肝脏变化外，还有其他变化在发生。那种变化很可能是胰腺功能的变化。这让我们有点意外。


    马克是变得异常消瘦了吗？对他来说，完全没有。事实上，他只是把体重减回到了他20多岁时的水平。似乎他积累的脂肪超过了他的身体能安全储存的量，他确实无法应对他肝脏中的脂肪量。这导致了一个他的身体无法管理的局面。他的体重对他来说太高了——尽管与大多数人的“正常”标准相比，这并不起。整个经历让我开始思考对于某一个人来说“正常”是什么，以及这如何无法通过整个人群的“正常”范围来体现。


    所以，回到2011年，当时“反点计划”（Counterpoint）取得了戏剧性结果。正如之前提到的，在我们收到的邮件中，有相当一部分来自BMI正常的2型糖尿病患者。由于对马克的良好效果以及“反点计划”的结果，提供在这种情况下减轻体重可以摆脱2型糖尿病的信息似乎是合理的。在邮件回复医疗问题时，医生只能提供信息而不能提供医疗建议。不干涉患者自己的医生至关重要。我们限制为只提供这些信息，并建议人们与医生或护士讨论。


    你可能猜到了接下来发生了什么。我们开始收到这类“正常体重”的人恢复正常血糖水平的邮件。许多人遵循了预先与医生或护士讨论减肥计划的建议——但被拒绝了。不要这样做，他们得到了不确定的回复，因为他们的BMI已经在正常范围内，减轻体重是不健康的。但在大多数这些人中，摆脱2型糖尿病的愿望如此强烈，以至于他们忽略了这些善意的建议。


