    # Helen’s Fish Pie with Celeriac Topping


    Prep: 30 minutes; cook: 40-45 minutes; makes 2 servings


    INGREDIENTS

    1 tablespoon olive oil

    1 small onion, chopped

    2 frozen fish fillets (cod, haddock, polock)

    ½ cup of water

    1 red capsicum, deseeded and chopped

    1 zucchini, sliced

    Bunch of fresh dill, chopped

    1 small celeriac, peeled and chopped into 2cm chunks

    2 tablespoons celeriac cream cheese (or crème fraîche)

    Worcestershire sauce

    Pinch of grated nutmeg

    Salt and pepper

    1 tablespoon grated Parmesan

    Green beans to serve as a side dish


    WHAT TO DO


    +   1. Preheat the oven to 180°C/gas mark 4.

    2. Fry the onion in the olive oil until it turns translucent

    3. Place the fish in a lidded casserole dish with the water and add the onion,
    capsicum, zucchini and dill on top.

    4. Put the lid on and bake in the centre of the oven for 25 minutes

    5. Meanwhile, cook the celeriac in a pan of boiling water for 20 minutes.

    6. Drain the celeriac, return it to the pan and add a tablespoon of cream cheese.
    Mash adding some casserole water for additional moisture if required.

    7. Drain most of the remaining water from the casserole dish. Add the remaining
    cream cheese, a splash of Worcestershire sauce, a pinch of grated nutmeg and some
    seasoning.

    8. Cut the fish to break it up a bit and stir to combine all the flavours.

    9. Spoon the mashed celeriac onto the fish mixture and spread out with a fork.

    10. Scatter over the Parmesan

    11. Return the dish to the oven without the lid this time, and cook for a further
