    I am very grateful to Professors Ashley Adamson, Falko Sniehotta and John Mathers
    of the Institute of Health and Society, for advice and support. My longstanding
    colleague, Professor Naveed Sattar of the University of Glasgow, has been a much-appreciated
    touchstone for discussion and honing of ideas over many years. Similarly, collaboration
    with Professor Rury Holman of Oxford University was extremely valuable in developing
    the Personal Fat Threshold concept.


    In tackling big questions of medicine, it is essential to know your enemy. Most
    of my insights into diabetes were gained by talking with patients. This was hugely
    amplified by discussions with and insights from Deidre Keyes-Grebzalski, diabetes
    specialist nurse colleague throughout most of my clinical career. Professor Sir
    George Alberti created the fabulously fertile diabetes research scene in Newcastle
    and was my research supervisor in the early 1980s, and I appreciate very much
    his enormous influence upon my work. I have benefited from discussions with my
    consultant colleagues, especially Professor Sally Marshall, over the years.


    The Diabetes UK Research Committee had the imagination and foresight to fund the
    Counterpoint study, which revealed the cause of type 2 diabetes and why it is
    a reversible condition. That was the essential step that opened up all the subsequent
    research and deserves widespread recognition. Diabetes UK also funded the DiRECT
    study, which tested general applicability of achieving remission in primary care.
    I have no commercial ties. I serve on a UK government working group (Scientific
    Advisory Committee on Nutrition, jointly with Diabetes UK), assessing the published
    evidence about low-carbohydrate diets. The views expressed in this book are personal
    and not those of the working group.'
