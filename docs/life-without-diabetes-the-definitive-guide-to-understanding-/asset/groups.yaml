    识别这样一个概念就是给它起一个名字。由于我们谈论的是一种“无证据观点”（Evidence-Free Idea），让我们称其为 EFI（读音为 effie）。有时
    EFI 显得如此显而易见，以几乎每个人都接受它。有时它会吸引一个群体，然后由他们开始向其他人推销它的有效性。偶尔，它可能出于商业原因而被推广。


    ## 近的一些 EFI


    ## 1. 对鸡蛋的大妖魔化


    当高胆固醇被认为是心脏病发发的风险因素时，含有胆固醇的食物被认为对心脏有害。鸡蛋含有胆固醇。于是逻辑就变成了：我们最好限制摄入量。每天不要吃超过一个！更好的是，避免所有的鸡蛋！健康饮食专家极力推崇这一概念，公共卫生机构也对此对其不加质疑。即使是那些脚踏实地的医生也接受了它。毕竟，这看起来是理而易见的。胆固醇导致心脏发作，而鸡蛋含有胆固醇。


    但等一下——让我们问几个问题。“胆固醇会导致心脏发作吗？”无疑，胆固醇水平升高与未来心脏发发的风险有关。但在大多数人中，这种关联有多强呢？你可能会问：“鸡蛋会升高胆固醇吗？”同样，并没有证据表明两者存在因果关系，尽管那些经常吃鸡蛋的人往往具有较高的血胆固醇水平。少数对胆固醇拥有专业知识的人在世界飞速发展时只是报以苦笑。这种对鸡蛋的恐慌就是一个
    EFI 的例子。


    胆固醇是身体所有细胞所需的，它是每个细胞膜中至关重要的组成部分。没有它，我们的身体就会解体。它被用于制造胆盐以帮助消化。它还用于制造重要的激素。考虑到它在生命中这种核心作用，你的身体为你制造它并不意外奇。它是在肝脏中产生的。如果需要，你每天可以产生高达一克。但如果胆固醇通过食物现成的提供给身体，一套复杂的控制系统就会减慢肝脏的产生。大自然总是吝啬的，如果可能，制造胆固醇所需的能量会被节约。


    一个大鸡蛋含有的胆固醇不到五分之一克（全在蛋黄中）。如果你每天吃超过五个大鸡蛋，理论上可能会出现问题——尽管身体可能会通过其数量的调节机制之一来处理。此外必须说，控制胆固醇时可能会出现异常问题，针对个人的特定医疗建议是非常重要的。然而，从未有过令人满意的证明吃鸡蛋会导致高胆固醇或心脏发作，或者限制人群的鸡蛋摄入能改善健康。


    这个 EFI 持续了数十年，但终于被官方揭穿。英国鸡蛋营销委员会的旧口号“为了鸡蛋去工作吧”可以被平反了。


    必须添加一段后记。元分析（Meta-analysis）露出了它的丑脸。另一项仅仅报告吃鸡蛋这一古老关联性的研究刚刚发表（2019年）。预意之中的标题出现了，尽管没有新信息，只是对旧事实的回收利用。


    ## 2. 杀手脂肪


    另一个 EFI 的例子是认为健康饮食必须低脂肪的观点。它源于一项流行病学研究，该研究统计了习惯性摄入脂肪的量与心脏病的死亡率。之间似乎存在某种关联。这项 20
    世纪 60 年的研究被称为“七国研究”。事实上，它观察了七个国家，发现心脏病在富裕国家更常见。这并不意外。接着出现了关联性联系：这些富裕国家负担得起让民众食用土地的脂肪。他们在生活方式上也有许多其他差异。更糟糕，似乎其他国家的信息并没有包含内。如果包含了，这种关联性将会变得弱得多。这在几年后变得很清楚。从
    20 世纪 70 年代起，研究发现低脂肪饮食本身似乎对预期寿命没有影响。但要影响这种信念体系已经太晚了。


    当科学误区被政府采纳时，就会发生大问题。美国政府 1977 年关于“饮食”的第一份官方建议建议减少动物脂肪摄入，使其占每天食物的 30% 而非约 40%。这种建议可能在某种程度上受到了艾森威尔总统遭受心脏发作的影响。是的！在一个遭受着看似心脏发作流行病的国家背景下，显然必须做点什么。饮食中脂肪水平与心脏发作死亡之间的关联，足以强行做出决定，命名并指责那个显而易见的罪首。许多暴民曾针对过错误的人。但当政府犯错时，这种错误往往会变成接受的规范——有时在过去的四十年里，这种错误一直在累积。


    尽管有几十年的证据，这个特定的 EFI 仍然不会消失。吃很多脂肪确实带来了摄入大量热量的可能。然而，正如第 8 章讨论的，有些人发现通过高脂肪、低碳水化合物的饮食最容易避免过度进入，而另一些人可能发现低脂肪、高碳水化合物的饮食限制热量摄入更容易。食物的总量决定了长期增加重的风险，从而决定了对健康的风险。人类的悖论再次抬头——生物学事实并不一定决定人类的结果。对个人的个人和社会影响（习惯、食欲、家庭和社会规范、朋友和同事的行为）在决定真实发生的事情方面起着作用。


    在揭穿了健康源于低饮食的观点后，必须说，关于脂肪的辩论存在一些微妙之处。脂肪有几种形式。饱和脂肪和不饱和脂肪之间的区别在框中解释。


    ## 什么是饱和脂肪？


    如第 2 章所解释的，脂肪分子包含长碳链。为了形成链链，碳原子必须与氢握手。然而，如果每个碳原子使用了两只手，这种脂肪被称为“饱和的”。但有些碳原子握的手较少——如果只有一个链路是不饱和的，那么这种脂肪被称为“单不饱和的”。如果几个链路是不饱和的，它被称为“多不饱和的”。


    饱和脂肪通常来自动物。不饱和脂肪通常来自植物，如食用油。简而言之。


    有合理的证据表明，人们摄入的脂肪类型对健康有微小但值得的影响，饱和脂肪不如不饱和脂肪好。用橄榄油代替猪油，或吃更多的鱼类和坚果可以获得这种微小的益处。


    事实可能会让你惊讶。


    | 来源 | 饱和 | 单不饱和 |

    | :--- | :--- | :--- |

    | 牛脂 | 低 50% | 高 50% |

    | 橄榄油 | 约 10% | 约 75% |

    | 杏仁 | 约 8% | 60% |


    '
