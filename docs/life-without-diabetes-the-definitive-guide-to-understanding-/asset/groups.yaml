    In the Counterbalance and DiRECT studies, a team of psychologists led by Professor
    Falko Sniehotta interviewed the participants to find out what contributed to their
    success in keeping their weight steady, and also what had been the main barriers
    to success. Prior to joining the study, many participants had tried and failed
    to lose weight and keep it off. One of the main reasons for this was the slow
    rate of their weight loss; over a prolonged period of trying to adhere to a regime
    boredom had set in. Or social habits around food were difficult to change. On
    their previous diets, some people had experienced nagging hunger, and had actively
    disliked the extent of the food restriction necessary to continue losing weight.
    By contrast, most participants viewed the 1,2,3 approach favourably in general,
    both for its speed and because they had felt so well during the low-calorie phase.
    They also said that ongoing support from their general-practice nurse or dietitian
    was useful in prompting action if they weight started to edge upwards.


