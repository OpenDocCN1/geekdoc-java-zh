    ## 3. The importance of breakfast


    A steady flow of research studies on the importance of breakfast is published
    each year, usually in less prominent scientific journals but trumpeted in the
    media. Most show that people who eat breakfast tend to be slimmer than those who
    skip it. Again, this is an association, not proof of cause and effect. And it
    is quite different from showing that if overweight people eat breakfast they will
    become slimmer. Let’s take a close look at how studies may be set up and what
    they actually show.


    Unsurprisingly, these studies are often funded by the breakfast cereal industry,
    and usually work a similar dodge. ‘Breakfast’ could be defined as a meal taken
    before leaving the house in the morning. Those with more chaotic lifestyles tend
