    # Kath’s Roasted Chipolatas with Apple


    Prep: 10 minutes; cook: 20 minutes; makes 3 servings


    Kath’s favourite recipes use lots of vegetables from her allotment and are easy,
    quick, one-pot dishes.


    ## INGREDIENTS


    - 1 sweet potato, peeled and cut into small chunks

    - 2 eating apples, cored and sliced

    - 1 red onion, cut into wedges

    - 6 chipolata sausages

    - 1 tablespoon olive oil

    - 1 tablespoon honey

    - Sprigs of fresh thyme

    - Green beans to serve as a side dish


    ## WHAT TO DO


    - 1. Preheat the oven to 200°C/gas mark 6.

    - 2. Layer the sweet potato, onion, apples and sausages in a roasting dish and
    drizzle with oil. Bake in the centre of the oven for 5 minutes.

    - 3. Remove from the oven and stir in the honey and thyme.

    - 4. Bake for another 15 minutes, then serve piping hot with steamed green beans.


    # Carol’s Parmesan Chicken with Garlic Stir-fried Broccoli and Mushrooms


    Prep: 10 minutes; cook: 30 minutes; makes 4 servings


    ## INGREDIENTS


    For the chicken:

    - 4 chicken breasts

    - 125g full-fat Greek yoghurt

    - 2 tablespoons mayonnaise

    - ½ cup grated Parmesan

    - 1 tablespoon garlic powder

    - Salt and pepper


    For the veg:

    - 1 tablespoon olive oil

    - 1 small onion, finely sliced

    - 2-3 garlic cloves, finely chopped

    - 1 broccoli head, cut into small florets

    - 500g mushrooms, sliced

    - 2 tablespoons soy sauce


    ## WHAT TO DO


    - 1. Preheat the oven to 190°C/gas mark 5.

    - 2. Flatten the chicken breasts (lay them on clingfilm on a chopping board, fold
    the film loosely over the top and bash them with a rolling pin).

    - 3. Mix the yoghurt, mayonnaise, Parmesan and garlic powder in a bowl with some
    seasoning, and dip the chicken in it.

    - 4. Lay the chicken in an ovenproof dish greased with a little oil and place
    in the oven for 25-30 minutes.

    - 5. 10 minutes before the chicken is ready, add the oil to a wok or frying pan
    and fry the onion and garlic gently for 2 minutes.

    - 6. Add the broccoli and mushrooms to the pan and stir-fry for about 5 minutes,
    leaving the veg with some crunch.

    - 7. Finally, add the soy sauce. Serve the stir-fry with the chicken.


    # Tara’s Tacos


    Prep: 15 minutes; cook: 35 minutes; makes 2 servings


    Tara loves this simple one-pot dish which is great for dinner parties/kids/big
    groups. Make it as spicy – or as mild – as you like! Kevin’s Sofrito sauce is
    an ideal base for this recipe. And gem lettuce leaves replace the corn tacos.


    ## INGREDIENTS


    - 1 tablespoon olive oil

    - 1 garlic cloves, crushed or finely chopped

    - 1 medium onion, chopped lengthways into large segments

    - 1 teaspoon paprika

    - ½ teaspoon cumin

    - Either 2 chicken breasts, cut into chunks, or 300g minced beef

    - 2 capsicums, of different colours, desseed and chopped into large chunks

    - 200g mushrooms, cut into quarters

    - ½ to ¾ tin of chopped tomatoes

    - Salt and pepper

    - 4 little gem lettuce leaves, to serve

    - Squeeze of lime juice


    ## WHAT TO DO


    - 1. Place a medium flat-bottomed pan over a low heat and add the oil.

    - 2. Fry the garlic and onion for about 5 minutes, stirring frequently.

    - 3. Add the spices and keep stirring for another 1-2 minutes.

    - 4. Add the chicken or mince to continue cook, stirring every minute or so the
    meat is sealed (the chicken has turned from pink to white, or the mince from red
    to brown).

    - 5. Add the chopped capsicums and mushrooms and cook for a further 3 minutes
    until the peppers start to soften.

    - 6. Tip in the chopped tomatoes, season with salt and pepper and let everything
    simmer for at least 20 minutes, or longer for a richer flavour.

    - 7. Spoon some sauce into the centre of each lettuce leaf (you could also top
    with a teaspoon of sour cream and/or guacamole).

    - 8. Add a squeeze of lime juice.

    - 9. Wrap and enjoy!


    NB. The cooking time can be reduced to 15 minutes if using pre-made sofrito.


    # Kevin’s Carrot & Celeriac Curry


    Prep: 15 minutes; cook: 60 minutes; makes 4 servings


    Don’t be put off by the spice mixes in this tasty curry. You can buy Methi in
    most large supermarkets; and the ‘jeera’ and ‘haldi’ you can mix up yourself at
    home.


    ## INGREDIENTS


    - 2 tablespoons olive oil

    - 3 teaspoons ‘jeera’ spices (mixture of whole cumin seeds, brown mustard seeds,
    fenugreek seeds and nigella seeds)

    - 2 red onions, finely chopped

    - 2 garlic cloves, finely chopped

    - 450g celeriac, cut into cubes

    - 3 medium carrots, cut into slices

    - 50g red lentils

    - 2 teaspoons ‘haldi’ spices (mixture of turmeric, ground coriander, crushed cumin,
    ground fenugreek seeds and a little ground black cardamom)

    - 2 teaspoons ground Kashmiri chilli (or hot paprika)

    - 1 tin of chopped tomatoes

    - 200g green beans, cut into small pieces

    - Juice of ½ lemon

    - 2 teaspoons Methi spices (fenugreek seeds, cinnamon, fennel seeds, ground cardamom
    seeds and cloves all ground together)


    ## WHAT TO DO


    - 1. Heat the olive oil in flat-bottomed pan and fry the jeera spices for about
    a minute over a medium to high heat.

    - 2. Reduce the heat to low, add the onion and garlic and fry gently for 15 minutes.

    - 3. Stir in the celeriac, carrots, lentils, haldi and methi spices, together
    with a teaspoon of salt and mix everything together.

    - 4. Add 450ml water, bring to the boil and simmer with the lid for 20 minutes.

    - 5. Mash all the ingredients together, then add the tomatoes. Cook for a further
    15 minutes.

    - 6. Finally, add the green beans, lemon juice and methi spices and cook over
    a low heat.


    # Allan’s Ginger Chicken


    Allan tells us ‘fairly simple’. Something he likes is marinated in soy sauce.


    Prep: 15 minutes; cook: 15 minutes; serves 4


    ## INGREDIENTS


    - 1 chicken breast, cut into chunks

    - 1 onion, roughly chopped

    - 1 tablespoon soy sauce

    - 1 teaspoon ginger paste

    - Shredded iceberg lettuce

    -  cherry tomatoes


    ## WHAT TO DO


    - 1. Mix the chicken with the marinade in a bowl, cover with clingfilm until ready.

    - 2. Thread the chicken onto skewers, alternating with onion and capsicum.

    - 3. Place under medium grill until cooked (about 10 minutes).

    - 4. Serve with shredded lettuce and tomatoes.


    # Tony’s Alternative Sunday Lunch


    Prep: 15 minutes; cook: 40 minutes; makes 3 servings


    Tony has an allotment and loves preparing food from fresh ingredients. He says
    that, along with the smell of it, adds to the pleasure of eating.


    ## INGREDIENTS


    - 2 chicken breasts, cut into cubes

    - 1 carrot, cut into chunks

    - 1 beetroot, peeled and cut

    - 6 brussel sprouts

    - 1 parsnip, cut into chunks

    - 4 shallots, cut in half

    - 2 celery sticks, cut into chunks

    - ½ small turnip, cut into chunks

    - 2 sage leaves

    - Pepper to taste


    ## WHAT TO DO


    - 1. Preheat the oven to 200°C/gas mark 6.

    - 2. Place the chicken in the centre of a large roasting tin and arrange the vegetables
    around it – this will keep moist.

    - 3. Add the sage leaves and a sprinkling of pepper.

    - 4. Place the tin in the centre of the oven and cook for 40 minutes, giving it
    a stir halfway.


    # Kieran’s Chipotle Sausage Capsule


    Prep: 15 minutes; cook: 55 minutes; makes 3 servings


    ## INGREDIENTS


    - 8 good-quality sausages (less than 4g carbohydrate per 100g on label)

    - 1 tablespoon extra-virgin olive oil

    - 1 medium onion, sliced

    - 4 garlic cloves, finely chopped

    - 2 teaspoons chipotle paste

    - 1 teaspoon ground cumin

    - 1 teaspoon ground coriander

    - 400g tin of chopped tomatoes

    - 400g tin of butter beans

    - 1 red capsicum, cut into 1cm chunks

    - 80-100g green beans, cut into 2cm pieces

    - 1 tablespoon tomato purée

    - 150ml water

    - 2 bay leaves

    - Salt and pepper


    ## WHAT TO DO


    - 1. Place a large pan over medium heat and brown the sausages in the olive oil.
    Remove from heat and cut each sausage into 4 pieces and set aside.

    - 2. Add the onion and garlic to the pan and fry gently until soft.

    - 3. Stir in the chipotle paste and the spices, return the sausage pieces back
    to the pan.

    - 4. Mix together over heat for 3 minutes and continue to cook.

    - 5. Add the tomatoes, butter beans, red capsicum, green beans, purée, water and
    bay leaves, then bring to the boil, cover and simmer for 40 minutes.

