  - '[PAGE 191]


    # Lesley’s Oven Frittata


    Lesley regularly makes this quick and easy dish for husband Ray, who has now been
    in remission for over four years. He recommends it as a great way to use leftover
    veg from the night before.


    Prep: 5 minutes; cook: 25-30 minutes; serves 4 as a breakfast or brunch, or 2
    as a main meal


    # INGREDIENTS


    +   1 tablespoon olive oil

    1 small onion, sliced

    Leftover cooked veg (any kind will work)

    4 eggs

    Salt and pepper

    Splash of semi-skimmed milk

    1 large tomato, sliced

    Fresh or dried herbs of your choice e.g. thyme or basil


    # WHAT TO DO


    +   1. Preheat the oven to 200°C/gas mark 6.

    2. Place the olive oil in a frying pan over a medium heat.

    3. Fry the onion for a few minutes until it begins to soften, then tip it into
    a baking dish (around 20cm x 15cm), using a fork to spread it evenly. This also
    helps the dish to prevent sticking.

    4. Now add the vegetables to form a single layer in the bottom of the dish.

    5. Beat the eggs with a fork in a glass bowl or jug, add a splash of milk and
    season with salt and pepper.

    6. Pour the egg mixture over the vegetables – there should be enough to just cover
    them.

    7. Arrange the sliced tomato on top and sprinkle the herbs over.

    8. Bake in the centre of the oven for 20-25 minutes or until golden brown.

    9. Allow it to cool slightly, then run a sharp knife or pallet knife around the
    edges.

    10. Place a chopping board over the dish, then turn it over and give it a few
    sharp taps to turn out the frittata.

    11. When it has set firm, cut it into four pieces and serve it with a tasty mixed
    salad or wrap it in the foil to take for lunch the next day.'
