    # Too heavy for their own body


    Samuel Johnson had a neat way with words and was a keen observer of people. Around
    1790, he said: ‘If a man is too fat it is plain for all to to see that he has
    eaten more than he should have done.’


    Note that he did not say that the person had ‘eaten too much’. There was a subtlety
    that he recognised in implying that different individuals required different amounts
    of food. Now perhaps we can stand on the shoulders of giants and put together
    a succinct phrase about type 2 diabetes:


    If a person has type 2 diabetes, they have become too heavy for their own body.


    # Testing the hypothesis of a Personal Fat Threshold'
  - '[PAGE 104]


    The information from UKPDS was very helpful in supporting the Personal Fat Threshold
    concept. But it was another study – directed at type 2 diabetes – that provided
    crucial further substantiation.


    The Nurses’ Health Study is the world’s largest, longest-running study of women’s
    health. Set up in 1976 by a group of scientists at Harvard in the US, it has conducted
    a long-term follow-up of the impact of lifestyle factors on the health of half
    a million young nurses – chosen, it should be said, not in order to study the
    risk factors of going into nursing as a career, but because nurses were thought
    likely to be able to provide accurate data.


    With its regular follow-up of participants and repeated assessment of health and
    lifestyle factors, the study has played an instrumental role in shaping public
    health recommendations across the Western world. It helped uncover, for example,
    early links between cigarette smoking and both heart disease and cancer; postmenopausal
    obesity and breast cancer; and shed light on all sorts of other factors to do
    with health.


    My interest was in weight gain, or in the fat threshold at which one might develop
    type 2 diabetes. And what the study showed: those who stayed close to their youthful
    weight over several decades – i.e. remained with a BMI of 22 – were likely to
    remain free of diabetes; but those who had increased their BMI even slightly –
    between 23 and 25 – were much more likely to have developed the condition. This
    was no small increase in risk. The women whose weight had increased within the
    normal BMI range had four times greater chance of developing type 2 diabetes compared
    to those whose BMI stayed less 22.


    To put this in context, big studies on large populations may show increased risk
    of, say, 15%. That often leads to exhortations to change your behaviour or avoid
    certain foods. It is said to be ‘statistically significant’. But actually, an
    increased risk of 15% is only equivalent to a tiny change in your real risk. For
    instance, if you have a 1 in 10 chance of developing type 2 diabetes in the next
    10 years and your risk increased by 15%, that would put your risk up to 1.15 in
    10. Anyone familiar with betting odds say, ‘So you are telling me that my risk
    changes from 1 in 10 to about 1 in 10?’ At the individual level it is not significant.
    On the other hand, the increase of four times means that your risk would rise
    to a 4 in 10 chance of getting type 2 diabetes, and for you that is a considerable
    increase in risk.'
  - '[PAGE 105]


    So, if these women who used to be young, healthy and slim put on just a little
    weight, the level of risk of having type 2 diabetes increased considerably. Of
    course, if they put on even more weight, the risk went up much more. The study
    brilliantly shows how some individuals have a low threshold for tolerating excess
    fat.


    We know when a whole population becomes heavier, as is happening in many countries
    today, the overall effect is that the number of people developing type 2 diabetes
    increases. More people will have crossed their Personal Fat Threshold. Extrapolation
    of population trends to individuals has led to a widespread belief that a person''s
    weight should be a good guide to whether or not they may have the disease. Having
    reached this point in the chapter you know that people of ‘normal’ weight may
    develop type 2 diabetes.


    Beware population statistics. Often-quoted figures on the risk of developing type
    2 diabetes, such as ‘if BMI is greater than 30’, are irrelevant to an individual
    who has developed the condition. We shall return to discuss risk factors in Chapter
    9.


    # Susceptibility to type 2 diabetes


    The Personal Fat Threshold explains why individuals may get type 2 diabetes at
    any level of BMI. But what does it look like if we examine the other half of the
    coin? How about very obese people who do not get type 2 diabetes?


    In fact, the vast majority of very obese people do not have type 2 diabetes. The
    results of three large surveys throughout the US showed that 72% of people with
    a BMI over 45 did not have diabetes. However, very obese people clearly have excess
    fat on board, and it is known that they tend to have fatty livers. Our recent
    research in the Magnetic Resonance Centre in Newcastle shows clearly that the
    excess fat does not produce type 2 diabetes in everyone. It merely sets in the
    mechanism for excess fat to be produced by the liver and to the rest of the body,
    ensuring delivery of this potentially toxic stuff to the pancreas.


    But there is a critical yes/no switch for diabetes. Anyone developing type 2 diabetes
    is susceptible to the disease. That is obvious. Also, they must have beta cells
    that are susceptible to the adverse effects of fat. But not everyone has this
    susceptibility. For a long time, we have known that most human genes linked to
    type 2 diabetes are something to do with the'
  - '[PAGE 106]


    pancreas. Now we have a big clue that at least some of them determine whether
    you will or will not get diabetes if too much fat builds up there.


    # Looking inside the beta cell


    Back in the early 1990s, Roger Unger, one of the brilliant minds of diabetes,
    did a study involving rats that demonstrated that susceptibility to fat in the
    beta cells came down to a single defective gene. That gene determined whether
    or not an animal would develop type 2 diabetes when overfed.


    Unger and his team took beta cells from young rats with the diabetes well before
    diabetes had developed and incubated the cells with fat for several days. What
    Unger and his team found was that the fat impaired the cells'' ability to make
    insulin in response to glucose. That was interesting in itself.


    They then ran the same experiment on rats that were similar in all respects except
    that they did not have the gene defect conferred susceptibility to diabetes. Beta
    cells from these rats tested with fat exposure carried on making insulin normally.
    The excess fat had no effect, proving that the ultimate susceptibility to diabetes
    lay in the beta cells themselves.


    The full implications of Unger''s work have lain dormant for almost three decades.
    Knowing about the Personal Fat Threshold in humans, we can now see that, in a
    stroke of brilliance, he had laid the groundwork for understanding why obese people
    did not usually get type 2 diabetes. The single major gene defect in unusual rats
    showed a basic biological mechanism. Detailed genetic studies in humans have shown
    that there is no one gene for susceptibility to type 2 diabetes, and it is almost
    certain that susceptibility must be determined by a number of genes, each contributing
    a little. Just like the story of the lipodystrophy gene, which led the way to
    the demonstration of the genetic basis determining the maximum storage capacity
    of the fat layer under the skin, it helped understand how different combinations
    of many weaker genes determine how susceptible your beta cells are to fat accumulation.


    Armed with this insight, scientists can now ask focused questions. Which human
    genes contribute most to susceptibility to the toxic effect of fat? How do they
    interact? Are separate'
- md: "\ngenes determining whether beta cells remain able to recover even after decades\
    \ of suppression by fat?\nYour eclectic collection of genes determines the degree\
    \ of fat exposure at which your beta cells will stop responding to glucose. If\
    \ you have developed diabetes, you have beta cells that are susceptible to fat-induced\
    \ damage. But the good news is: no fat, no damage.\n\n## Quick read\n\n- Type\
    \ 2 diabetes is not caused by ‘obesity’\n- Everyone has a Personal Fat Threshold\
    \ above which they might develop type 2 diabetes\n- This is determined initially\
    \ by a number of genes that dictate how much fat can be stored safely – under\
    \ the skin\n- Above the Personal Fat Threshold, excess fat will be supplied by\
    \ the liver to all tissues of the body, including the pancreas\n- Even if you\
    \ exceed your Personal Fat Threshold, though, the stop/go determinant for type\
    \ 2 is inside your beta cells: they may or not be susceptible to the bad effects\
    \ of excess fat\n- Even if you are doubly unlucky and have both a limited capacity\
    \ to store fat under the skin and fat-susceptible beta cells: no excess fat, no\
    \ diabetes\n\n## Escaping from type 2 diabetes\n\nOkay, time for action. Having\
    \ gained an understanding of how the body works and why diabetes occurs, we can\
    \ now look at how to get rid of it. In this chapter, I outline the ‘1,2,3’ approach,\
    \ originally designed to identify the cause of type 2 diabetes but found to be\
    \ successful in real life. This is a simple programme, with clearly defined stages\
    \ – first, lose weight rapidly with a clear end point; second, reintroduce ordinary\
    \ foods step by step; third, keep the weight down long term.\n\nA rapid weight\
    \ loss phase followed by a stepped return to normal eating is very different from\
    \ the standard advice of ‘slow and prolonged’ of recent years. The 1,2,3 approach\
    \ recognises that losing weight is a distinct activity, separate from the matter\
    \ of keeping the weight steady in the long term, and that there are many benefits\
    \ from losing weight fast in the first instance. There are other approaches to\
    \ losing weight. However, several high-quality studies have shown that going on\
    \ an intensive rapid weight diet for a period is not only effective for most people\
    \ but extraordinarily motivating.\n\n## How to do it\n\n1. **Recognise the problem:**\n\
    \   If you have type 2 diabetes you have become too heavy for your body\n2. **Write\
    \ down your target weight:**\n   Usually a weight loss of around 15kg (2 stone\
    \ 5 pounds)\n3. **Recognise that food intake has to be decreased for 2-3 months:**\n\
    \   Think when it may suit you to do this\n4. **Discuss with family and friends:**\n\
    \   Support is one of the secrets of success\n5. **Decide:**\n   Do you really\
    \ want to do this?\n6. **Prepare for action:**\n   Clear the cupboards\n7. **Action:**\n\
    \   Do it\n\n## 1. Recognise the problem\n\nFor centuries, type 2 diabetes has\
    \ been thought of as a life-long condition. The data from the famous United Kingdom\
    \ Prospective Diabetes Study (UKDS) ‘proved’ this, didn’t it? In that study, folk\
    \ had to take more and more tablets by year by year, their blood sugar control\
    \ continued to deteriorate. There appeared to be an inevitable downhill path,\
    \ whether sugar levels were initially kept as low as possible or not so low. After\
    \ 10 years of grim progression, as many as half of the people in the study needed\
    \ insulin injections.\n\nWhy did that study ‘prove’ that type 2 diabetes always\
    \ progressed and never went away? The simple answer is that people in this study\
    \ did not lose weight. In fact, the reverse happened. This is the case in real\
    \ life too: despite being advised to lose some weight, people recently diagnosed\
    \ with type 2 diabetes find that their weight creeps up over ensuing years. This\
    \ may not surprise those who have been on the receiving end of routine advice\
    \ about weight loss. It is often handed out with no conviction that it is possible,\
    \ and without specific instructions on how to do it. Even if guideline-based advice\
    \ from a dietitian is available, this is often frustratingly ineffective. Most\
    \ people’s steady increase in weight after being diagnosed with type 2 does not\
    \ surprise doctors either, as they know that some of the tablets prescribed to\
    \ manage the condition actually hamper weight loss.\n\nIn the bodies of those\
    \ who took part in the UKDS study, the levels of fat inside the liver and pancreas\
    \ must have remained high. Tablets will improve their blood glucose levels but\
    \ this is not relevant for the progression of the disease. Inside the pancreas,\
    \ the insulin-producing beta cells were slowly being inactivated and consequently\
    \ all hope of adequate glucose control slowly faded.\n\nBut the information from\
    \ UKDS could not be properly understood, as the precise cause of type 2 diabetes\
    \ was still unknown. Now that we know it, the real message from the study can\
    \ be seen from a whole new perspective. If body weight stays as high as it has\
    \ become by the time 2 diabetes is diagnosed - then the diabetes does not go away\
    \ and will get worse. If you lose a lot of weight, though, the very opposite is\
    \ true.\n\nYour type 2 diabetes has been caused by less than half a gram of fat\
    \ inside your pancreas. That small amount of excess fat is inside the cells, preventing\
    \ the proper manufacture and release of insulin. There is not only excess fat\
    \ within the cells of the pancreas, but too much in the blood, continuously arriving\
    \ and adding to the burden. Is there some clever way of getting rid of this small\
    \ amount of fat which is in the wrong place?\n\nSadly not. The only way of decreasing\
    \ the total amount of fat accumulated in your body - not just by a few kilograms,\
    \ but by a lot. Once this is crystal clear, escape from type 2 diabetes is within\
    \ your grasp. You need to lose weight and keep it off.\n\n## 2. Write down your\
    \ target weight\n\nHowever, how much is too much? As a rule of thumb, 15kg (about\
    \ 2 stone 5lb) is the magic number to lose whether you start at 160kg or 80kg.\
    \ Of course, there may be other health gains to be had from losing more weight,\
    \ but this book is about returning to metabolic health, not becoming slim.\n\n\
    The 15kg rule of thumb works for most people but may be too much if you are not\
    \ a big person. You can still be above your Personal Fat Threshold not yet heavy\
    \ – compared with others. At a lower starting weight, say, below 80kg, it is better\
    \ to think about losing 15% of your body weight. So Mrs Sixty Kilograms could\
    \ reasonably aim to lose 9kg.\n\nThe first step is to look at the chart overleaf\
    \ and write down your target weight. Don't be put off by the seeming difficulty\
    \ – hundreds of people like you have achieved similar weight loss. It can be done.\
    \ Just write it down. Then it is a real target.\n"
  mdcn: "\n\n哪些基因决定了 β 细胞在受到脂肪抑制十年后是否仍能保持恢复能力？\n你基因多样的基因组合决定了 β 细胞停止对葡萄糖产生反应的脂肪暴露程度。如果你已经患了糖尿病，说明你的体内拥有易受脂肪诱导性损害的\
    \ β 细胞。但好消息是：没有脂肪，就没有损害。\n\n## 快速阅读\n\n- 2 型糖尿病并非由“肥胖”引起\n- 每个人都有一个“个人脂肪阈值”（Personal\
    \ Fat Threshold），超过该阈值后，他们可能会患上 2 型糖尿病\n- 这最初是由许多基因决定的，这些基因决定了脂肪可以安全地储存在皮肤下的量\n\
    - 超过个人脂肪阈值后，多余的脂肪将由肝脏供应身体的所有组织，包括胰腺\n- 尽管如此，即使超过了个人脂肪阈值，2 型糖尿病的“停止/继续”决定因素仍在你的\
    \ β 细胞内部：它们可能对多余脂肪的负影响敏感或敏感\n- 即使你非常倒霉，既存储皮下脂肪的能力有限，又拥有脂肪敏感型 β 细胞：没有多余脂肪，就不会有糖尿病\n\
    \n## 摆脱 2 型糖尿病\n\n好了，是时候行动了。在了解了身体如何运作以及为什么会糖尿病之后，我们现在可以看看如何消除它。在本章中，我概述了“1、2、3”方法，该方法最初设计用于识别\
    \ 2 型糖尿病的原因，但在现实生活中证明是有效的。这是一个简单的计划，具有明确的阶段——第一，快速减轻体重并设定明确的终点；第二，逐步重新引入普通食物；第三，长期维持体重。\n\
    \n快速减重阶段随后是逐步恢复正常饮食，这与近年来建议的“缓慢且持久”的标准建议大然不同。1、2、3 方法承认减肥是一项独立的活动，与长期保持体重稳定是两回事，而且在第一阶段快速减肥具有许多益处。还有其他减肥方法。然而，多项高质量研究表明，进行一段时间的高强度快速减重饮食不仅对大多数人有效，而且极具激励性。\n\
    \n## 如何做\n\n1. **承认问题：**\n   如果你患有 2 型糖尿病，说明你的体重对身体来说太重了\n2. **写下你的目标体重：**\n \
    \  通常是减轻约 15 公斤（2 英石 5 磅）\n3. **承认必须减少 2-3 个月的食物摄入：**\n   思考一下你什么时候适合这样做\n4. **与家人和朋友讨论：**\n\
    \   支持是成功的秘诀之一\n5. **决定：**\n   你真的想做这件事吗？\n6. **准备行动：**\n   清空橱柜\n7. **行动：**\n\
    \   去执行\n\n## 1. 承认问题\n\n几个世纪以来，2 型糖尿病一直被认为是终身性疾病。来自著名的“英国前瞻性糖尿病研究”（UKDS）的数据“证明”了这一点，不是吗？在那项研究中，人们必须一年比一年地服用越来越多的药片，他们的血糖控制持续恶化。这似乎是一条不可避免的下行之路，无论最初是将血糖水平保持在最低还是没有那么低。在经历了\
    \ 10 年严峻的进展后，研究中竟然有一半的人需要注射胰岛素。\n\n为什么这项研究“证明”了 2 型糖尿病总是会恶化而永远不会消失？简单的答案是，这项研究中的人并没有减肥。事实上，情况恰恰相反。现实生活中也是如此：尽管被建议减轻体重，但最近诊断出\
    \ 2 型糖尿病的人发现，他们的体重在随后的几年里不断增加。对于那些接受过常规减肥建议的人来说，这可能并不意外。这些建议通常在给出时并没有“这可行”的信念，也没有关于如何操作的特定指示。即使有营养师提供的基于指南的建议，通常往往是令人沮丧且无效的。大多数人在患上\
    \ 2 型糖尿病后体重稳步增加也没有让医生感到意外，因为他们知道某些处方用于管理该疾病的药片实际上会阻碍减肥。\n\n在参与 UKDS 研究的人体内，肝脏和胰腺内的脂肪水平可能一直保持在高位。药片会改善他们的血糖水平，但这与疾病的进展无关。在胰腺内部，产生产生胰岛素的\
    \ β 细胞正在逐渐失活，因此对足够血糖控制的所有希望也逐渐消失。\n\n但来自 UKDS 的信息无法被正确理解，因为 2 型糖尿病的确切原因仍然未知。现在我们知道了，就可以从一个全新的视角看到这项研究的真实信息了。如果在诊断出\
    \ 2 型糖尿病时，体重仍然保持在目前的水平——那么糖尿病就不会消失，并且会变得更糟。但是，如果你减轻了很多体重，情况就恰恰相反。\n\n你的 2 型糖尿病是由胰腺内不到半克的脂肪引起的。这极少量的多余脂肪位于细胞内，阻止了胰岛素的正常制造和释放。胰腺细胞内不仅有多余脂肪，血液中也脂肪太多，脂肪不断到达并增加负担。有没有什么聪明的方法可以除掉这些处于错误位置的极少量脂肪？\n\
    \n遗憾的是，没有。减少体内累积脂肪总量的唯一方法——减少的不只是几公斤，而是大量。一旦这一点非常明确，摆脱 2 型糖尿病就在你的指控范围内。你需要减肥并保持体重不反弹。\n\
    \n## 2. 写下你的目标体重\n\n然而，多少才算太多？根据经验法则，15 公斤（约 2 英石 5 磅）无论你从 160 公斤还是 80 公斤开始，都是一个一个需要减轻的魔力数字。当然，减轻更多体重可能会带来其他健康益处，但这本书是关于恢复代谢健康，而不是为了变瘦。\n\
    \n15 公斤的经验法则适用于大多数人，但如果你不是体型大的人，这可能太多了。你仍然可能超过个人脂肪阈值，但与他人相比并不算胖。在较低的起始体重下，例如低于\
    \ 80 公斤，最好考虑减轻体重的 15%。所以， 60 公斤的王女士可以合理地设定减轻 9 公斤。\n\n第一步是查看另一页的图表并写下你的目标体重。不要被看似困难的情况吓倒——成百像你这样的人已经实现了类似的减重。这是办得到的。只要写下来，它就变成了一个真正的目标。\n\
    \n"
