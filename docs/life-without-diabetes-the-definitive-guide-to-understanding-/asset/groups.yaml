    # Janet’s Zucchini with Spring Onions


    Prep: 5 minutes; cook: 11 minutes; makes 2 servings


    INGREDIENTS

    2 medium zucchinis

    2 teaspoons olive oil

    3 garlic cloves, crushed

    6 spring onions, finely chopped


    WHAT TO DO


