  mdcn: '

    ……糖尿病可能帮助所有人实现并维持显著的减重。


    还有其他大问题等待着解答。在缓解后，糖尿病还会至少远离两年吗？尽管我们知道许多人在减重后，没有该疾病的时间已经超过了这一年，但只有对大群体进行正式研究，才能给出能够说服其他医生的答案。此外，肝脏和胰脏较低的脂肪水平会随着这些器官功能的正常而维持吗？


    我资助此类研究的申请被英国糖尿病协会（Diabetes UK）拒绝了。但这种拒绝是建设性的。在同一次会议上，讨论了另一项申请。那是迈克·里恩（Mike Lean）教授提出的，他是国际著名的肥胖与营养专家。当时，他正在针对肥胖测试一种低热量液体饮食，随后是结构化的体重维持计划。重要的是，这项试验是在常规的基础级护理中进行的。几个月前，他曾请我协助他的申请，将试验扩大到应对2型糖尿病，因此我们的名字已经联系在一起了。但我们的申请被拒绝了——不过带来了一个富有启发性的思考。


    资助委员会请迈克和我合作开展一项规模更大的联合研究。迈克对肥胖及其与基础护理联系的专业知识，可以与我逆转2型糖尿病的经验相结合。科学领域交叉界面的工作可以是变革性的，我们毫不犹豫地接受了挑战。


    我们计划了 DIRECT 研究，目标是取得具有临床意义的结果。我们决定，在一年后让五个人中的一个脱离糖尿病，并停止所有药物，这将是非常有用的——这对每个个体很重要，对提供医疗服务的成本也重要。研究的规模是基于这一假设规划的。迈克对我的护理采用了一种近乎整体的方法（被称为
    Counterweight Plus），但在减重阶段每天喝四瓶代摇蛋白且不吃蔬菜，我们决定在试验中使用这种变体。


    事实上，我们发现减重组中每两人中就有一人一年后没有患有糖尿病，不再需要药片或注射。两年后，处于缓解状态的比例仍然超过三分之一——比我们计划的要得多，即使是在一年这个时间点也是如此。在一年时糖尿病获得缓解的人中，绝大多数人在两年后仍保持无糖尿病。


    更令人惊的是，人们维持了超过10公斤的减重效果两年，然后三个人中有两人仍处于缓解状态。


    那些摆脱了疾病的人所的喜悦，对于整个 DIRECT 团队来说本身就是一种享受。此外，医疗保健服务的成本节约潜力是惊人的。糖尿病的主要成本实际上在于治疗疾病的并发症，而
    DIRECT 观察到与按照常规官方指南治疗的人相比，减重组的并发症更少。长期的随访对于获得并发症减少的确切水平的硬性信息至关重要，但结果已显而易见。


    在研究期间，对居住在泰恩赛（Tyneside）及其周边地区的人群进行了详细的代谢研究。研究显示，所有减重的人都实现了肝脏脂肪正常化以及肝脏向身体输出脂肪的速率正常。胰腺脂肪水平下降了。这些益处出现在每个减重的人身上——即使是那些仍然患有糖尿病的人。我们此前并未预料到这一点。我们第一次看到，实现2型糖尿病缓解的最终决定因素是在β细胞内部。消除脂肪是必要的，但是不够的。然而，那些没有摆脱糖尿病的人的β细胞可能受到了过量脂肪的影响太严重了。我们已经发现，持续时间较长的2型糖尿病完全逆转的可能性小得多，这解释了为什么有些人无法实现缓解。


    有少数人在一年时处于缓解状态，但在两年时又恢复了大部分减去的体重。尽管团队付出了最大努力，他们不幸地复了糖尿病。这提供了一个极好的科学机会。我们能够观察糖尿病的发展过程。这在以前从未实现过。双循环假说（Twin
    Cycle Hypothesis）的预测得到了证实——肝脏脂肪输出增加，胰腺脂肪增加，β细胞中的胰岛素产生失败。


    ## 从假设到行动


    从2006年构思双循环假说，到2011年证明糖尿病恢复正常的机制，这一历程一直持续到2017年12月。那是 DIRECT 研究第一年度结果公布的时候。“重要器官内部物质过多导致2型糖尿病”的理念逐渐占据主流。但常规医疗保健人员对这一知识的成功应用促成了游戏局势的定格。2018年6月，美国糖尿病协会改变了政策，正式将2型糖尿病缓解认可为治疗的理想目标。同年，英格兰国家医疗服务体系（NHS）和苏格兰
    NHS 都宣布资助基于减重的实现2型糖尿病缓解的方法。信念体系缓慢渐进的变化带来了政策的转变。


    在 Counterpoint 研究的第一份报告（2011）发布后，许多人问为什么 NHS 还没有资助2型糖尿病的缓解。如果你看到自己的糖尿病消失了，产生这种疑问是自然的。临床实践的推广是否应该发生得更快？可能不。。医学概念的重大变革在被接受之前受到挑战和彻底测试是至关重要的。科学家和医生必须保持怀疑态度，以确保医疗保健的进步建立在经过仔细测试的坚实的基础上。


    这是一个故事的开始，而不是结束。还有许多发现等待被发现，特别是关于长期维持体重的最佳方法。详细研究表明，2型糖尿病并不是一种复杂的、异质性的疾病，而是一种发生在异质性人群中的简单疾病。至少我们已经从假设，通过证明，走向了实用建议。现在对2型糖尿病有了新的理解。


    ## 为什么脂肪会关闭β细胞？


    因此，关于消失β细胞的最后一个未解之。通过 Counterpoint 和 DIRECT 研究，我们了解到消除脂肪通常会让β细胞苏醒并开始产生胰岛素。我们已经走了很远的路，但无法显示β细胞内部可能发生了什么。为了破解这个困扰数十年的谜题，我们要感谢纽约的
    Domenico Accili 教授和纽卡斯尔的 James Shaw 教授，他们的研究展示了脂肪影响β细胞导致糖尿病的机制。


    β细胞对能量供应极其敏感，因为它们的本质是在燃料充足时产生胰岛素。过量的脂肪会导致某些人的β细胞产生压力——由于持续的脂肪，β细胞通过进入生存模式自我保护。一旦糖尿病发生且血糖升高，这种压力会加剧；为了生存，β细胞会关闭产生胰岛素所需的基因。它们会一直待在那里，专注于自身的生存，留有剩余能力来服务身体。

