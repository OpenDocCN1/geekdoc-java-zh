    at the usual smooth curve for a population, the pundits would say: ''Just look
    at the fall in obesity rate — from 36% to less 7%.'' This approach focuses on
    the fixed cut-off for obesity — a BMI of over 30. And once again, the important
    point would have been overlooked.


    In the lower panel, we can see what happened to just three of these individuals.
    Let call them Jack, Mary and Harry (right to left). Jack lost 15kg, his BMI changed
