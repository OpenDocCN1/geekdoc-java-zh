  - '[PAGE 81]


    go to any lengths to escape from it. Most doctors and nurses did not know that.
    Secondly, motivated people could return to normal glucose control when simply
    provided with clear information on how to do it.


    All of a sudden, the research broadened out from its initial goal. I had set out
    to find out what caused type 2 diabetes. I had hoped to clarify the mechanisms
    involved and perhaps point a way forward for future treatment. Job done. But the
    tool developed to test the hypothesis – a low-calorie liquid diet – seemed to
    be a real-world solution for many people who could use it to get rid of their
    own diabetes.


    Encouraged by this ‘proof in the pudding’ (or maybe proof of pudding), we pressed
    on with more research.


    # Counterbalance


    Is it possible to enjoy long-term remission from type 2 diabetes while eating
    normally? This was the most important question that faced us. After rapid weight
    loss, could the body remain in balance and control glucose levels normally on
    a return to eating ordinary food? The original Counterpoint study had shown that
    we could COUNTER Pancreatic inhibition of Insulin secretionN Triglyceride. The
    acronym had proved true, at least in the short term. We called the second major
    study Counterbalance. That stood for COUNTERActing BetaA cell failure by Long-term
    Action to Normalize Calorie intakeE’. A bit long, but did it said it on the tin!


    Under the guidance of Dr Sarah Steven, just like its older sister, this study
    took on a life of its own. In Counterbalance, rapid weight loss was achieved in
    eight weeks using exactly the same diet as Counterpoint; and then we introduced
    normal foods in a stepwise fashion over two weeks. We had learned from the Counterpoint
    pioneers when they stopped the one-package-per-meal diet it was tough to readjust
    to deciding what food to eat.


    Sarah gave individualized advice on how much to eat and what foods to avoid and
    saw each once per month. Over the following six months, our research participants
    kept their average weight rock steady. At the end of this, everyone who had got
    rid of their diabetes after the initial weight loss remained non-diabetic. Just
    like in Counterpoint, the pancreas woke up after weight loss'
  - '[PAGE 82]


    and started to produce insulin normally again, this time for nine months after
    the start of the study. Importantly for understanding how this happened, liver
    fat remained low, at 2%, and their pancreas fell to even safer levels. Diabetes
    had gone away and stayed away.


    Falko Snieotta, Professor of Psychology at Newcastle, and his team carried out
    tests to identify the main barriers to success, and also what advice was most
    helpful for people to succeed in losing weight and keeping it off. The results
    of this have informed the information provided in Chapters 7 and 8.


    Did the duration of diabetes make a difference?


    Yes. The duration of type 2 diabetes, the lower the likelihood of getting back
    to normal glucose control. But never say never. Counterbalance determined the
    betting odds of achieving remission of diabetes. This decreased from close to
    a dead cert soon after diagnosis to 50/50 in the first 10 years, then much lower
    chances after that. Betting odds are a guide to how likely it is to win, but they
    jump home, and the results from time to time, the 100 to 1 outsiders did not mean
    that nobody with very long-duration type 2 diabetes could benefit. Some people
    living with type 2 diabetes for more than 20 years have successfully reversed
    to normal. Two individuals in Newcastle who had 24 years of diabetes and poor
    blood glucose control, on two kinds of tablets every day, have returned to normal
    off tablets after losing over 15kg in weight. The important message is that it
    is never too late to attempt to reverse your diabetes, although success is not
    guaranteed.


    The Counterbalance results were all the more remarkable because the group who
    reversed their diabetes during the study had not become slim. The average BMI
    (Body Mass Index) had started at 33, and it decreased to 29. So approximately
    half of the group were still technically ‘obese’. But they continued to be free
    of diabetes. They were carrying more fat than they really needed, but for them,
    it stayed in the safety of the fat layer under the skin and did not redistribute
    to clog the liver and pancreas. At least over the total study duration of around
    months.


    Wow! A new world of understanding of type 2 diabetes was opening up. Counterbalance
    confirmed that the process of reversing diabetes could potentially be used as
    a normal treatment for people with type 2.'
  - '[PAGE 83]


    # The ‘Pancreas’ study


    One of the most controversial beta cells were predicted to be struggling as a
    result of too much fat inside and around them. When the Counterpoint results were
    announced, this discussion became important. Some experts pointed out – quite
    reasonably – that the recovery of the cells may have been only indirectly related
    to weight loss. Maybe the waking up was coincidental and due to something else.
    Was the fall in fat pancreas merely because of the weight loss itself? Perhaps
    fat levels decreased in all organs after weight loss. Well, if so, it would happen
    in people who did not have type 2 diabetes too. This was something we could test:
    was the fall in pancreas something special that happened in people with diabetes,
    or would it happen to people without diabetes too?


    The easiest way to do this was to compare what happened after bariatric surgery.
    Weight loss after the operation would be the same whether or not individuals had
    type 2 diabetes. We could compare what happened to pancreas fat in each group.


    Bariatric surgery is highly effective at causing weight loss. Unsurprisingly:
    if your stomach was suddenly reduced to the size of your thumb, you would lose
    weight too. In the North East of England, we have one of the largest bariatric
    surgery services, with superb surgeons. Mr Peter Small and Mr Sean Woodcock were
    hugely helpful in planning a collaborative research study. With funding from the
    European Foundation for the Study of Diabetes, the ‘Pancreas’ study got underway.


    Participants with and without diabetes were of similar weight and age, and there
    was a male/female balance. Peter and Sean did their magic: everyone had a stomach
    bypass operation, performed entirely via telescopes and tubes (laparoscopic surgery)
    and, after eight weeks, both those with and without diabetes had lost around 13kg.


    This study confirmed that the level of fat inside the pancreas was abnormally
    high in people with type 2 diabetes, but that this high level dropped when food
    intake was suddenly decreased. In contrast, it did not fall at all in people without
    diabetes during the eight weeks of this study. We can now be reasonably sure that
    the fall in fat levels inside the pancreas is related to the diabetes itself and
    linked to recovery of normal insulin secretion. Absolute certainty in medicine
    is rare.'
  - '[PAGE 84]


    The ''Pancreas'' study also allowed us to test another idea. As mentioned earlier,
    some people thought that bariatric surgery had a ''special'' effect in improving
    blood glucose control via incretin hormones. This appeared unlikely to on theoretical
    grounds, but now we had a chance to find out if I was right or wrong. The people
    with diabetes awaiting bariatric surgery were randomly divided into two groups.
    Half the bariatric surgery, with tests before and one week later. The other half
    had a week of a very low-calorie diet with tests before and after (and only then
    they had their surgery). It was all about the sudden decrease in food intake.
    Was there any special effect of bariatric surgery via the incretin hormones?


    Sarah Steven devised a special, small test meal that could be managed by people
    after bariatric surgery. In the surgery group, because of the stomach bypass,
    the small test meal went rapidly into the small intestine. After the surgery,
    there was a huge (seven-fold) increase in incretin hormones. But the insulin response
    was identical after the meal whether people had undergone surgery or just an equivalent
    drop in calorie intake. The effect of bariatric surgery on the incretin hormones
    was real but had nothing at all to do with the sudden return to normal of blood
    glucose levels. This was merely an effect of the drastic decrease in food intake.
    A similar study carried out in America found identical results. Whether food intake
    is voluntarily decreased by diet or enforced by surgery, the results on glucose
    levels are the same. Once again, careful testing yielded a clear result.


    # DiRECT – the Diabetes Remission Clinical Trial


    Our early studies had set the stage and explained what was going on in the body,
    but it became clear during Counterbalance what had been developed as a tool to
    test the hypothesis (the low-calorie diet) might be useful in routine care. It
    was actually liked by people with type 2 diabetes, even though they found it challenging.
    The question was, would it work in real life? So, the treatment had only been
    carried out in research centres by specialist doctors on patients who were motivated
    to join the study. Type 2 diabetes is usually managed in primary care. We had
    to find out whether the staff who provided the routine care for people'
- md: '

    with diabetes could help everyone achieve and maintain substantial weight loss.


    There were other big questions waiting to be answered. After going into remission,
    would diabetes stay away for at least two years? Although we knew of many people
    who had been free of the disease for longer than this after weight loss, only
    a formal study on a large group of people could give an answer that would convince
    other doctors. And would the lower levels of fat in the liver and pancreas be
    maintained with normal function of these organs?


    My application to fund such a study was rejected by Diabetes UK. But it was turned
    down constructively. At the same meeting, a separate application had been discussed.
    That from Professor Mike Lean, an internationally renowned expert on obesity and
    nutrition. At that time, he was testing a low-calorie liquid diet, followed by
    a structured weight maintenance programme, in obesity. Importantly, this trial
    being being conducted in routine primary care. Some months before, he had asked
    me to help with his application to expand the trial to tackle type 2 diabetes,
    so our names were already linked. But our applications were rejected – but with
    an inspired bit of thinking.


    The Grants Committee asked Mike and me to collaborate on a combined, much larger
    size study. Mike’s special knowledge about obesity and links with primary care
    could be combined with my experience of reversing type 2 diabetes. Work at the
    interface of scientific areas can be transformational, and we did not hesitate
    in taking on the challenge.


    We planned DIRECT with the aim of achieving a clinically important result. We
    decided that releasing one in five people from diabetes, off all tablets, at one
    year would be very useful – important for each individual, and important for the
    costs of providing healthcare. The size of the study was planned on this assumption.
    Mike had an almost overall approach (known as Counterweight Plus) to mine care
    but with four shakes per day and no vegetables for the weight loss phase, and
    we decided to use this variation in the trial.


    In fact, we found that one person in two of the weight loss group had no diabetes
    at one year, and no longer needed tablets or injections. After two years, the
    proportion in remission was still over one third – far better than we had planned,
    even for the one-year mark. Of those who were in remission from their diabetes
    at one year, the vast majority remained diabetes-free at two years.


    Even more remarkably, people maintained weight loss of more than 10kg for two
    years, then two out of three remained in remission.


    The joy of those people who got rid of their disease was in itself a pleasure
    to behold for the whole DIRECT team. Also, the health service cost savings were
    potentially eye-watering. The major costs of diabetes are actually in treating
    the complications of the disease, and DIRECT observed fewer of them in the weight
    loss group compared with those treated according to the conventional official
    guidelines. Longer-term follow-up will be important to obtain hard information
    on the exact level of reduction of complications, but the writing is clearly on
    the wall.


    As of the study, detailed metabolic studies were done on those people who lived
    in or around Tyneside. The studies showed that everyone who lost weight achieved
    normalisation of liver fat and rates of export of liver fat to the body. Pancreas
    fat levels fell. These benefits were seen in everyone who lost weight - even in
    those who remained diabetic. We had not anticipated that. For the first time,
    we saw that the ultimate deciding factor in achieving remission of type 2 diabetes
    was inside the beta cell itself. Getting rid of the fat was necessary, but not
    sufficient. It looked though the beta cells in the people who did not get rid
    of their diabetes may have been too badly affected by the excess fat. We had already
    discovered that longer-duration type 2 diabetes was much less likely to reverse
    completely, and this explained why some people do not achieve remission.


    There was a small number of people who had been in remission at one year but regained
    most of the weight loss by two years. They unfortunately slipped back into diabetes,
    despite the best efforts of the team. This provided a great scientific opportunity.
    We were able to watch the diabetes as it developed. That had never been done before.
    And the predictions of the Twin Cycle Hypothesis were confirmed – liver fat export
    increased, pancreas fat increased and insulin production failed in the beta cells.


    ## From hypothesis to action


    It had taken from 2006, when the Twin Cycle Hypothesis was conceived, through
    2011, when the mechanisms by which diabetes returned to normal were proven, to
    December 2017. That is when the first-year results of DIRECT were announced. The
    concept that too much inside vital organs caused type 2 diabetes gradually gaining
    ground. But the demonstration of the successful application of this knowledge
    by routine healthcare staff precipitated game, set and match. In June 2018, the
    American Diabetes Association changed its policy and officially recognised remission
    of type 2 diabetes as a desirable aim of treatment. That same year, both NHS England
    and NHS Scotland announced funding for the weight loss-based approach to achieving
    remission of type 2 diabetes. Slow, gradual change in the belief system has brought
    about change in policy.


    After the first report of the Counterpoint study (2011), many people asked why
    remission of type 2 diabetes was not already funded by the NHS. It is natural
    to wonder why, if you have seen your own diabetes disappear. Should roll-out into
    clinical practice happen more quickly? Probably not. It is critically important
    that major changes in medical concepts are challenged and thoroughly tested before
    acceptance. Scientists and doctors have to be sceptical that medicine healthcare
    – moves forward on a carefully tested, solid basis.


    This is the beginning of a story, not the end. Much is yet to be discovered, especially
    about the best way to keep weight off in the long term. The detailed research
    has shown that type 2 diabetes was not a complex, heterogeneous condition but
    a simple condition happening in a heterogeneous group of people. At least we have
    moved from hypothesis, through proof, to practical advice. There is now a new
    understanding of type 2 diabetes.


    ## Why does fat switch off beta cells?


    And so to the final unanswered question about the missing beta cells. From Counterpoint
    and DIRECT, we have learned that removing the fat would usually allow the beta
    cells to wake up and start producing insulin. We had come a long way, but could
    not show precisely what might be happening inside beta cells. For clarity on this
    puzzle, which had remained unsolved for decades, we have to thank Professor Domenico
    Accili in New York and Professor James Shaw in Newcastle, whose research has shown
    the mechanism by which fat affects beta cells to cause diabetes.


    Beta cells are exquisitely sensitive to the supply of energy as their special
    business is making insulin when fuel is coming. Excess fat causes stress in the
    beta cells of some people – because of sustained fat attack, beta cells take cover
    by going into survival mode. This is intensified once diabetes develops and glucose
    levels rise; and to survive the beta cells switch off the genes needed for insulin
    production. They will just sit there, concentrating on their own survival with
    spare capacity to serve the rest of the body.


    Because the insulin production had been switched off in many beta cells these
    were not missing but merely functioning. This process of a cell losing its specialist
    function is called ‘de-differentiation’, because specialist cells acquire their
    special function by ‘differentiating’ from basic cells. The process is illustrated
    in figure 5.6.


    Back in 2008, the Twin Cycle Hypothesis predicted that the beta cell problem in
    type 2 diabetes should be a reversible process. We now know why removing the excess
    fat allows resumption of business as usual – the switch-off of those genes for
    insulin production is reversible unless it continues too long the apparatus to
    make insulin seems to become ineffective.


    But hang on, you may say: How does all this square with the observation described
    at the start of this chapter that around half of the beta cells seemed to have
    died? This is simple. Scientists recognise beta cells under the microscope by
    staining them with a marker that shows up the insulin content. Because the insulin
    production had been switched off in many beta cells these were not detectable
    under the microscope. The cells were still alive, but you may have said ‘gone
    under cover’. The cells were not missing but merely hidden from view.


    No murder, but just dormant state. If asked, perhaps a beta cell in type 2 diabetes
    would quote Mark Twain: ‘Rumours of my death have been much exaggerated!’

