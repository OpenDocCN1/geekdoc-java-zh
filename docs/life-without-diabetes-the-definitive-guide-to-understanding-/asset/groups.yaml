    At the opposite end of the scale are the very small studies. However, they are
    potentially significant, and make a huge difference to individual. When our Counterpoint
    study demonstrated normal glucose, liver fat and insulin response of the beta
    cells, everyone in a group became free of diabetes. The size of effect achieved
    was huge. Nevertheless, at the time, it was frequently dismissed by experts as
    being merely a ‘small’ study. Did they have a point? No, but with one exception.
    Small groups carry the potential risk that they might not be representative of
    everyone with type 2 diabetes. However, we could show that the Counterpoint participants
    were typical. And given that the intervention had a big effect that was both clinically
    important and statistically significant, the result indicated a potentially large
    benefit for most individuals. That cannot be said for most large studies.


