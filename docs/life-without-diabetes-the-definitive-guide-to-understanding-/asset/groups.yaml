    described ‘compensatory eating’ (part conscious and part-subconscious). So just
    remain normally active during Step 1.


    - Write down why you are doing this. This can be really useful to read later if
    you are struggling with the balance between daily life and avoiding putting weight
    back on.

    - During a liquid diet, you will have lots of time on your hands as you won’t
    be sitting at the family table at mealtimes, plan ahead as what you are going
    to do with that time. Write a list.

    - Plan what you are going to do if you feel tempted to eat something off-limits.
    Writing your own list of distractions can be helpful – jobs around the house,
    surprising the dog with an extra walk, drinking a pint of water, planning future
    holidays.

    - You also need to plan for how to supply yourself with your special meals when
    out of the house. This is easiest if your chosen liquid diet powder is designed
    to be dissolved in water rather than milk, but advance planning will make things
    manageable in either case.

    - No alcohol during the weight loss phase. Alcohol is high in calories. Think
    of it as liquid fat. Not helpful. Just don’t do it.

    - Continue to enjoy tea and coffee, with skimmed milk if preferred (not more than
    50ml per day).

    - Discuss your plans with your doctor or diabetes nurse.


    This is what people said about their experience of the liquid diet in our studies:


    > ‘I was so surprised, what I was eating compared to what I have been eating over
    the last weeks. I really would have thought that I would have been hungry from
    the moment I opened my eyes to the moment I closed my eyes, but I wasn’t.’ (Woman,
    aged 42, one year after reverting to normal).


    > ‘It was fairly hard to start with but it get easier as the weeks went on and
    then I started getting a bit fitter and could walk further and stand up and dig
    the garden it’s great now. I feel great’ (Man, aged 44, two and a half years since
    diagnosis).’


    Although the majority reflected these thoughts, not everyone found it feasible:


    ''Because the smells of people eating all around you... I was in town at one point,
    and it was ridiculous, I couldn''t concentrate... I would have been fine if I
    had been at home. I would have lost weight this week and I would still have been
    on it, but I couldn''t stick to it.'' (Man, aged 52, one year since diagnosis).


    The next quote gives an insight into what has happened to our high streets and
    elsewhere over the last two to three decades. This person was not alone in lamenting
    the all-pervasive offerings of food in our society today:


    “You can''t get away from food. Pick up the paper and there is Jamie Oliver doing
    something clever with a leg of lamb. Turn on the telly and there is Mary Berry
    baking cakes. So you take yourself off to the football only to find yourself surrounded
    by hamburger adverts and stalls. I couldn''t sit at the family dinner table. I
    had to fill in time by going to the cinema to watch anything. Poor sad old geezer
    sitting by himself. But it worked.'' (Man, aged 57, still free of diabetes two
    years after the study).


    ## Step 2 in practice


    Moving from the weight loss phase back to eating ordinary foods needs some careful
    planning. We realised this after the Counterpoint study, which was designed only
    to test the Twin Cycle Hypothesis. We had focused mainly on how to lose a lot
    of weight fast, without sufficiently thinking through the challenge of the re-entry
    period. Our research volunteers described feeling at sea going back into the kitchen.
    What to eat? How much to eat? Could they drink?


    But what we also learned that there was an opportunity for people here: eight
    weeks of just eating a package for each meal created a blank slate on which to
    write new dietary habits.


    Just as there is a clear focus during the initial weight loss phase, there must
    also be a definite plan for the stepped food reintroduction phase.


    - Start with the evening meal, going back to a normal (smaller than usual) plate
    of food instead of the shake, but continuing your weight loss diet during the
    rest of the day.


    - It is sensible to do some advance planning here too: a ''normal'' meal should
    still be relatively low in carbohydrates and contain plenty of veg. Avoid sweet
    or starchy foods.

    - After two weeks, you can add in a lunchtime meal, stopping the shake but, again,
    exercising portion control.

    - After four weeks, you can be back into a fairly normal pattern of eating that
    is sustainable for life – without regaining weight. And drink alcohol if you wish.
    It is normal during this phase for your weight to rise by around 1kg (2lb) because
    glycogen stores are building back up – water is always stored along with glycogen.


    Using stepped food reintroduction, our volunteers found the transition to normal
    eating to be less troublesome and more sustainable in the long term. They reported
    that the directed approach to starting one low-calorie meal per day was helpful.
    They also appreciated being armed with definitive information about what quantity
    of food to eat. More information about foods for this stage is given in the recipe
    section at the back.


    ## Step 3 in practice


    By this stage you should feel very proud of yourself. You will have lost a substantial
    amount of weight; you will hopefully have achieved remission of your type 2 diabetes;
    and you will be feeling dramatically better, both in mind and body: more energised,
    confident and motivated. Welcome to the beginning of your new life.


    Perhaps it would be safer to call it the ‘new normal’. It is so worthwhile to
    work at maintaining your recovered health. While you can enjoy family and friends,
    even indulge in a special treat, you must avoid slipping back into old habits.
    Stick with these rules:


    - As a rough guide, you will need to eat three quarters of the amount you used
    to.

