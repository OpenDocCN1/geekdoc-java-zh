  mdcn: '


    ## 香菜椰奶西葫芦汤


    准备时间：5分钟；烹饪时间：15分钟；份量：2人


    食材


    - 1 茶匙椰子油

    - 1 平勺孜然种子

    - 1 个小洋葱，切成环

    - 300g 西葫芦，切片

    - 10 粒黑胡椒

    - 500ml 开水

    - ½ 茶匙磨豆蔻粉

    - ¼ 茶匙磨孜然粉

    - 一小撮盐

    - 一小把新鲜香菜


    制作方法


    1. 在大平锅中用中火加热椰子油。

    2. 加入孜然种子煎香 1 分钟。

    3. 拌入洋葱，翻炒至呈透明状。

    4. 加入西葫芦，接着加入黑胡椒和水。

    5. 煮沸后盖盖锅用小火煮 10 分钟。

    6. 关火。加入豆蔻粉、孜然粉和一些调料。用食物料理机或手持搅拌机搅拌成浓稠的汤汁。

    7. 享用前撒上新鲜香菜。


    搅拌汤在与每日代餐饮料结合时，可能看起来液体稍多，因此这里提供了一些既增加口感又极其美味的食谱。


    ## 什蔬菜汤


    准备时间：10分钟；烹饪时间：30分钟；份量：4人


    食材


    - 1 汤匙特初榨橄榄油

    - 1 个中等葱（100g），切 1cm 片

    - 3 根大胡萝卜，去皮并切 1cm 片

    - 1 升鸡肉汤或蔬菜汤（用汤块或汤宝调制）

    - 4 根芹菜茎，切 1cm 小段

    - 6 片春甘蓝、羽衣甘蓝或黑色羽衣蓝，切片

    - 1 片月桂叶

    - 干香料，如百里香或混合香料

    - 盐和黑胡椒


    制作方法


    1. 在大汤锅中加热油。

    2. 加入葱和胡萝卜翻炒 10 分钟，直到它们开始变软。

    3. 倒入汤底。

    4. 加入芹菜和切好的菜叶，以及月桂叶和香料。用少许盐和黑胡椒调味。

    5. 煮沸后转小火，盖上盖子焖煮 20 分钟。

    6. 享用前再现磨一点黑胡椒，享受这些汁水多汁的蔬菜块。这道菜第二天加热后更好吃。


    ## 泰式豆芽小白菜汤


    准备时间：10分钟；烹饪时间：4 分钟；份量：4人


    食材


    - 1 升蔬菜汤（用汤块或汤宝调制）

    - 1 根香茅，切成 3 段并拍碎以释放风味

    - 1-2 根红辣椒，去籽并切碎

    - 1cm 厚的生姜根，去皮切薄片

    - 1 个红灯椒，去籽并切细片

    - 200g 豆芽

    - 2 颗小白菜，粗切（或 150g 卷曲羽衣甘蓝）

    - 2 根小葱，切片

    - 1–2 汤匙淡生抽

    - 1 个柠檬的汁

    - 新鲜香菜，装饰


    制作方法


    1. 将香茅、生姜和辣椒放入大锅中，加入汤底煮沸。

    2. 转小火煮开，加入灯椒、豆芽和小菜。

    3. 大约 3 分钟后，加入小葱和生抽。

    4. 享用前挤入柠檬汁，并撒上几片新鲜香菜装饰。


    剩余的份量可以在冰箱中保存 2-3 天，或冷却后放入冷冻袋冷冻。


    ## 第二阶段食谱


    一旦你度过了高强度低热量阶段，就可以开始在你熟悉并喜爱的蔬菜食谱中加入蛋白质食物（以及多一点碳水化合物）。一顿令人满足的餐点将取代奶昔！蛋白质是饮食中最能饱腹的部分，较高的蛋白质摄入量与液体低热量饮食后更成功的体重维持相关联。


    ## 早餐篇


    ### 辣味早餐蛋


    使用第 1 阶段食谱：凯文的烟熏味底料（Sofrito）。


    准备时间：5分钟；烹饪时间：25分钟（如果使用现成底料则需15 分钟）；份量：2人


    食材


    如果你有现成的底料，可以在这里使用（足够在锅中铺设底层）。如果没有，你需要按照下文说明制作一个快速版本。


    - 4 颗蛋

    - 切碎的香菜

    - 快速版底料：1 个洋葱，1 瓣大蒜，1 根红辣椒（全部细切），1 罐切丁的番茄


    制作方法


    1. 在厚平底煎锅中加热底料（确保你有能盖住锅的盖子）。如果制作快速版底料，用橄榄油煎洋葱、大蒜和辣椒 10-15 分钟，直到变软并焦化，然后用勺子搅拌将其压碎。将混合物煮沸，然后转小火用中火煮至浓稠（约
    5 分钟）。

    2. 用勺在混合物中挖 4 个凹槽。

    3. 迅速将每个蛋入每个凹槽，用少许盐和胡椒调味，盖上盖子。

    4. 在底料中水煮蛋约 5 分钟（或达到你喜好的程度）。

    5. 每人盛出 2 个蛋和一半酱汁，撒上一些切碎的香菜。


    ### 莱斯利的烤箱蛋饼（Frittata）


    莱斯利经常早餐做这道简单快捷的菜，使用前一晚上剩余的蔬菜。


    准备时间：5分钟；烹饪时间：25-30分钟；份量：4人


    食材


    - 1 汤匙橄榄油

    - 1 个小洋葱，切片

    - 4 颗蛋

    - 盐和胡椒

    - 少量淋入牛奶

    - 1 个大番茄，切片

    - 新鲜香料，如你喜好的百里香或罗勒


    制作方法


    1. 将烤箱预热至 200°C。

    2. 在煎锅中放入橄榄油。

    3. 在碗中打蛋，加入牛奶。

    4. 将混合物倒入烤盘中。

    5. 煎洋葱直到它开始变软。

    6. 均匀地摆放番茄和剩余的蔬菜。

    7. 在顶部撒上香料。

    8. 在烤箱中心烘烤 20-25 分钟，直到金黄色。

    9. 稍稍冷却。

    10. 切成块。

    11. 搭配小沙拉或主食享用。


    ### 菲塔奶士烤茄子


    使用第 1 阶段食谱：简单烤茄子


    准备时间：5分钟；烹饪时间：10分钟；份：1人


    食材


    - 100g 菲塔奶士，切块

    - 橄榄油


    制作方法


    1. 在茄子上子上淋上橄榄油。

    2. 撒上菲塔奶士。

    3. 完成！


    ### 凯的浓郁蔬菜辣椒酱


    准备时间：15分钟；烹饪时间：20分钟；份量：4人


    食材


    - 1 汤匙橄榄油

    - 1 个红洋葱，细切

    - 1 个橙色灯椒，去籽并切片

    - 1 个西葫芦，细切

    - 2 瓣大蒜，细切

    - 1 罐斑豆或红腰豆

    - 1 罐切丁的番茄

    - 一小撮辣椒粉

    - 盐和黑胡椒

    - 一把新鲜香菜叶，粗切


    制作方法


    1. 用油煎香洋葱 2 分钟。

    2. 加入灯椒、西葫芦和大蒜，继续煎 5 分钟，期间频繁翻炒。

    3. 拌入豆类、罐装番茄、辣椒粉以及盐和黑胡椒，小火煮 10-15 分钟。

    4. 将辣椒酱淋在烤红薯上，配上一些酸奶油和香菜叶。


