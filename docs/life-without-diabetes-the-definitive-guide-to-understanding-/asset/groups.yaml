    commercial ready meals; just good, honest food to be prepared mealtimes.


    # A helping hand


    As John observed so long ago, no man is an island. Nor is any woman. We live in
    a social network which is a whole subject in itself. The time that this really
    comes to the fore is when the world seems to be against you or when something
    bad has happened. Then support from your nearest, dearest or closest is likely
    to be very important. When the going gets rough, such help of moral support is
    invaluable in dealing with problems that life throws up. Unpredictable events
    may upset how you thought your day was going to go. Your best intentions may be
    really tested, and they may not hold up under severe stress. Picking up one’s
    bruised ego and resetting those intentions is not easy.


    Support from someone else is so helpful in these circumstances. Psychologists
    call it ‘outside agency’, and it can potentially affect your behaviour. Who can
    help? Could it be your spouse, partner, friend, healthcare professional, muse,
    barber/hairdresser – the list of possibilities is endless.


    In our very first study on reversing type 2 diabetes I was surprised that I could
    not predict who would do outstandingly and who would do less well. After being
    a doctor for four decades, reading people had been something I took for granted.
    It is useful to be able to anticipate a person’s likely persistence in following
    advice. But this just did not work in our studies on diabetes remission. Then
    the penny dropped. It wasn''t about the individual participants themselves. The
    research volunteers would often bring along someone to sit with them during the
    very long early studies, and I was able to talk with both.


    An understanding so dawned: the predictor of success lay to a considerable extent
    with someone’s ‘significant other’. Also, we observed a ‘buddy’ effect. A volunteer’s
    partner/relative/friend would confirm surprisingly often that they had lost weight.
    This was a clear sign that the cupboards no longer contained biscuits, crisps
    and snacks and that eating habits in the house had changed. Some enterprising
    individuals (outside the formal research studies) even set up self-help groups
    to capitalize upon the supportive effect. We can’t stop life stresses happening.
    But it is possible to insure against such problems blowing us off course.


    # We are creatures of our environment


    Why should obesity rates have soared in the last few decades? Often fingers are
    pointed and there is a great deal of muttering about sloth and greed. Clearly,
    obesity genes cannot have become more prevalent in a generation or two. But everyone
    today is heavier than they would have been if living in 1980 (as discussed in
    Chapter 6). That usually includes the finger-pointers. The current environment
    promoting excessive accumulation of fat is a major problem for society as a whole.
    The average weight of children and young people is likely to continue to rise
    if nothing is changed. Our research volunteers described, often very mighty, the
    trials and pains of living in our food-observed world: how difficult it was to
    get away from advertising, ‘recipe’ talk or counters laden with muffins and cake.
    This topic is large and beyond the scope of this book, but some key points can
    be summarised.


    How about increasing legislation to regulate harmful food provision? Whenever
    this is proposed, well-meaning voices – and some well-meaning – are raised against
    it. The mantra of ‘individual responsibility’ is often heard. We should all have
    the freedom to choose, loud voices incite. The dramatic fall in deaths due to
    road accidents that followed the compulsory use of seat belts and wearing of motorcycle
    helmets has not drawn comment from the same voices. Likewise, after smoking was
    outlawed in enclosed public spaces, major health improvements followed. These
    were far greater than any that could have been achieved by appealing to individuals.
    So what food? Surely if we can introduce legislation on the provision of toxic
    cigarettes, why not regulate calorie density foods that are toxic? The control
    of food is trickier, given that it is essential for life in moderation. Nevertheless,
    the motivation for a society to change its food environment should be potent.
    In the UK, the NHS spends an estimated £6.1 billion ($11.4 billion AUD) annually
    (2014–15) on treating obesity, and type 2 diabetes accounts for the greater part
    of £10 billion ($18.7 billion AUD) spent on diabetes as a whole. Overall, the
    cost of obesity to the economy is far greater than this, considering days off
    work and other direct costs. It has been claimed that we spend more each year
    on the treatment of obesity and diabetes than we do on the police, fire service
    and judicial system combined. Ouch. Taxpayers need to know, especially as rates
    of obesity look set to rise.


    The effect of human obesity on the environment also deserves greater recognition.
    If a population of one billion people increased average BMI in step with the change
    in the UK between 1970 and 2010, it is estimated that the additional food production
    and transport costs for these heavier people would increase carbon dioxide emissions
    by 19%, or 1.4 gigatonnes per year. This is no trivial amount, as global carbon
    dioxide production is around 42 gigatonnes.


    Societies face a big challenge. Major international food companies act to protect
    profits. They devote large sums of money to spreading misinformation and bending
    political ears just as they did prior to legislation. Often this is done via impressive-sounding
    ‘institutes’ or ‘research groups’, introduced in the media as the ‘industry think
    tank...’ Possibly one of the best-documented examples of a big company’s machinations
    is the campaign run by a major manufacturer of sugary drinks to protect its sales
    in China, a substantial market. By establishing a ‘research and advisory’ group
    and nesting within a government agency via political connections, the company
    was able to subvert the public-health campaign against obesity. It did this by
    ensuring that the anti-obesity advertising campaign was restricted solely to promoting
    exercise. Sales were protected. Is this wrong? In Western democracies, we expect
    companies to produce goods or services and make a profit. Clever marketing tactics
    are justified to achieve these aims. Regulation would still leave a level field
    for competition.


    At the present time, there are few politicians ready to face up to their responsibilities.
    Only a few years ago, a UK minister for health abolished the Food Standards Agency
    with its independent experts, substituting a body largely composed of representatives
    of the food industry. Since then, some of the resulting harm has been undone,
    but we can only wonder about what lay behind this decision. The first step towards
    fixing our environment will be to recognise the inappropriateness of political
    parties accepting funding from major food companies. The recent introduction of
    a sugar tax on soft drinks in the UK is a tiny step in the right direction.


    | 5 ideas for legislators |

    | Simple steps to decrease population level food intake. Several more are also
    feasible, but this would be a good start. |

    | 1. Restrictions on fast-food outlets operating close to schools |

    | 2. Regulation of added sugar and fat in processed/ready meals |

    | 3. Labelling of calorie content of single consumption items (e.g. fast food,
    ready meals, restaurant meals, individual cakes in coffee shops, cans of beer)
    which is clear, visible and easy to understand |

    | 4. Regulation of oversize and bargain meals |

    | 5. Continuation of sugar tax on sugar-sweetened beverages |


