    ## 7. Action!


    All our research work on reversing type 2 diabetes has depended upon a method
    for losing weight that can be achieved by all the participants within a defined
    period of time – a combination of low-calorie soups and shakes to maintain a daily
    intake around the 800-calorie mark (in our Counterpoint study, we got our volunteers
    to stick around 700 calories per day for 8 weeks, but in a research study, it
    is vital to have a uniform, reproducible way of bringing change that is acceptable
    to most people. But you are not ‘most people’. You are an individual and, for
    a range of reasons, you may be able to achieve the goal – 15kg weight loss – by
    other means. Perhaps you have the idea of low-calorie drinks and would rather
    cook for yourself. And that is fine. Whatever works for you.


    You need to plan for long-term weight control right from the beginning. And, once
    you have shed the 15kg, and after you have congratulated yourself (and your supporters),
    you need to be prepared for the fact that you will need less food than you previously
    ate. In practice, this will be three quarters of the amount you habitually put
    on your plate and swallowed. Remember, this marks the beginning of the rest of
    your life. And eating less will be the only way to maintain your new, healthy,
    comparatively svelte form. Knowing this from the outset is important.


    ## The 1,2,3 approach


    In our early studies in Newcastle to test the Twin Cycle Hypothesis, we had to
    come up with a simple, practical and effective way for our volunteers to achieve
    a big change in body weight. In the first instance, I devised an eight-week programme
    of low-calorie powdered shakes, offering complete nutrition in an easy way, requiring
    minimum prep. ‘Complete nutrition’ means that the diet provided all the necessary
    protein, minerals and micronutrients.


    More fibre was provided by a daily trial helping of non-starchy vegetables. Following
    the first trial, however, our research volunteers told us of the difficulty they
    had in restarting normal eating. They described how, after eight weeks of simply
    choosing which flavour packet to make up in water, they were all at sea, or even
    panicked, when trying to prepare a meal. As a result, we devised a clearly directed
    stepped approach, whereby first one meal of normal foodstuffs (usually the evening
    meal) was substituted for a shake for at least two weeks, and then, a week later,
    the same was done for lunch. If the individual was ready, breakfast could then
    be restarted. The quantity of food was carefully described – usually three quarters
    of that habitually eaten weight loss.


    We used this stepped food reintroduction in the Counterbalance study and were
    pleased to find that the participants avoided the problems of a sudden switch
    – and keep their weight steady after rapid weight loss. The low-calorie weight
    loss phase followed by the new stepped programme became known as the ‘Newcastle
    Diet’. And then, for the DiRECT study, we used a similar strategy that had been
    separately developed in Glasgow as ‘Counterweight-Plus’.


    First get the weight down, focusing entirely on it. Secondly, reintroduce ordinary
    foods step by step. Thirdly, keep the weight down long term.


    Recognising that these stages are three clear-cut operations is important. Careful
    research has shown that major weight loss can be achieved by this clear separation
    of a relatively short but intense period of weight loss from the long-term keep-it-down
    phase. But a word of caution is needed: the best studies to date lasted for only
    two years, and weight regain must be avoided for life. (Further information is
    available on the website: https://go.ncl.ac.uk/diabetes-reversal.)


    ## What to eat: overview


    Step 1. For the 8 weeks of weight loss, the simplest option is to use a liquid
    formula product to provide around 600 calories per day, with one helping of non-starchy
    vegetables (around 100 calories). No alcohol (and no additional exercise).


    Step 2. For the transition to normal eating, one small meal of ordinary foods
    (400-500 calories) is substituted for the evening liquid meal for approximately
    2 weeks. Then a small lunch (around 400 calories) is introduced for the next 2
    weeks. Then the liquid meals are stopped.


    Step 3. For long-term maintenance, your weighing scales are your best friend.
    Eating is back to being a normal, social activity – but with a close eye on quantities.
    The same goes for alcohol,


    ## Food vs liquid formula


    Having a packet of one of the many commercially available liquid formula diets
    per meal is by far the easier option for most people. Some brands have a wide
    range of flavours to choose from and minimise boredom. On our ‘Newcastle Diet’,
    we also encouraged participants to add in some non-starchy veg at me, for something
    to chew on (an activity which is badly missed by some) mainly because veg help
    to avoid constipation. (In our DiRECT trial we missed out the vegetables in favour
    of a fourth packet of liquid formula meal because of the need to minimise differences
    between people in this research study; however, regular laxatives were needed
    with this regime to deal with constipation.)


    And, if you can''t bear the idea of going on liquid formula drinks for several
    weeks with or without vegetables, you can of course ordinary foods. You would
    have to make up meals containing 200 calories, with no more than 800 calories
    a day. This involves a lot of planning and preparation time in the kitchen, and
    many people find it more difficult because of the daily burden of decisions and
    choices.


    If you go for real foods to provide approximately 800 calories per day, you would
    need a high proportion of protein foods (fish, meat) to meet your daily need and
    keep you satisfied for longer. Plenty of non-starchy vegetables are important
    to fill you up and keep your bowels regular. It may take a bit longer to cruise
    down to your target weight – about three to four months as opposed to two months
    on liquid formula.


    There is also a possibility that you could run a little short on some vitamins,
    and for this reason food based diets of around 800 calories a day are best supplemented
    with a multivitamin tablet. But whole books devoted entirely to low-calorie eating,
    and such approaches can suit some people very well. This is not rocket science.
    If you can achieve rapid weight loss simply by a drastic reduction in the amount
    of food you eat every is in fine


    Choose your low-calorie diet. If it is to be a liquid diet, then you must decide
    which brand and which flavours you like. Whichever brand you choose, it *must*
    be described as ‘complete nutrition’ (as opposed to just a ‘meal replacement’)
    in other words, that it contains all the vitamins, minerals and trace elements
    in addition to protein, sugar and fat.


    You may be surprised by the high sugar content of some brands – but not worry
    as this is low compared with what your liver makes every day. The protein content
    will be high: around 25% and much higher than you might usually eat in a meal.
    It comes as one packet per meal (no decisions or room for inadvertently adjusted
    doses). Each packet will contain around 200 calories (see our website for some
    brands: https://go.ncl.ac.uk/diabetes-reversal).


    Liquid diets are easier for most people


    If you are going for the real-food option, or a mixture of the two, you will need
    to be prepared with the right ingredients and recipes to keep going. And realistic:
    you will not want to spend hours preparing gourmet low-calorie meals every day;
    have some quick, easy, calorie-counted options at the ready – some grilled chicken
    or fish with a pile of non-starchy vegetables, for example. Make this your default
    main meal every day if you need.


    Do not embark on an exercise programme during Step 1. Perhaps surprisingly, this
    can seriously impede weight loss especially in very overweight people. This may
    be the best kept secret in the weight loss field, and I came across it only from
    listening to participants in one of our exercise studies.

