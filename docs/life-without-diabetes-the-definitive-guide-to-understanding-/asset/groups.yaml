- md: '

    Over the long period of our evolution, human beings have had to cope with periods
    of crop failure or runs of bad luck on the hunting front. As a result, we have
    developed very clever mechanisms for storing food energy.


    All our energy comes from food or drink. Although that is a statement of the obvious,
    it is a good place to start considering energy for life. After food is eaten,
    it is broken down by digestion to simpler substances. The liver is a factory that
    turns substances into useful forms. There are only a few sources of food calories:
    carbohydrates, fat, protein and alcohol. From your plate to the body, it goes
    like this:


    - **Carbohydrates** – potatoes, rice, bread and all sugars: all broken down to
    glucose.

    - **Fat** – butter, oils, dairy produce, and fat in meat: all broken down to simpler
    fats.

    - **Protein** – meat, lentils, beans, dairy protein: all broken down to the basic
    building blocks (called amino acids) used for muscle and other tissues. But any
    surplus is turned into glucose.

    - **Alcohol** – broken down and stored as fat.


    If you glance down the list again, you can see that all your food is turned into
    either glucose or fat. And those fuels are the source of all energy for your body.


    So you can now look at your plate in a new light. Carbohydrates are effectively
    sugar, and fat is fat. Glucose can be stored as glycogen in the liver and muscles,
    and fat can be stored under the skin. Any excess protein ends up as glucose. Contrary
    to popular belief, encouraged by advertisements for protein supplements, intake
    of protein does not build huge muscles. Products with exotic-sounding names as
    branch chain amino acids and ox protein boost nothing more than wishful thinking.
    Amino acids are merely the basic building blocks for proteins. In excess, these
    building blocks are dealt with summarily by the body – the atoms that make them
    different are stripped off and carbon skeletons are thrown into the pool to turn
    into glucose.


    What about alcohol? Surely that is a special fuel? Not at all. Alcohol is essentially
    liquid fat. It contains almost as much energy as fat – seven calories in every
    gram, compared with nine in gram of fat. The liver removes the particular atoms
    that make alcohol different. Alcohol is simply burned – or stored – as fat.


    So in terms of energy storage in the body and energy usage, we can talk about
    just glucose and fat. That is the beautiful economy of nature.


    - Energy metabolism is simple

    - Only two fuels are burned for energy by your body – glucose and fat. Both can
    be stored and used when required.

    - Protein is broken down into the building blocks our body needs for growth and
    maintenance. However, in the Western world, we tend to eat more protein than we
    need and any excess is converted by the body into glucose.

    - Alcohol? Ever efficient, the body merely breaks down alcohol as burns it just
    as though it had been fat.

    - Metabolism is simply the coordinated handling of glucose and fat.


    ## Storing energy as glucose


    Glucose is tricky to store. It attracts water, and therefore tissues storing glucose
    would quickly become engorged and damaged. So the body has developed an amazing
    work-around. By linking together glucose molecules in a chain, or polymer (rather
    like a string of beads), it effectively immobilize them, holding them ready for
    use without causing local problems. The glucose is no longer able to attract water
    and is safe to store inside muscle or liver cells. This concentrated form of glucose
    is known as ‘glycogen’.


    Glycogen comes to popular attention most often in relation to long-distance running.
    Glycogen-loading is what pasta parties before marathons are all about. Take lots
    of carbohydrate and fill the tank to maximum. However, in everyday life, the role
    of glycogen stores is to help the body control blood glucose after meals. Here’s
    how: after eating a meal, blood glucose levels rise, and the body gets to work
    removing absorbed glucose from the blood and muscles. Overnight, the body can
    use these stores of glucose, and both day and night, the liver calmly delivers
    the right amount of glucose into the blood to provide energy for the rest of the
    body – minute – whether we eat or not.


    The graphs opposite show what happens.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_37_0.png)


    ## 2.5a Change in muscle glycogen after eating breakfast only.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_37_1.png)


    ## 2.5b Increase in muscle glycogen during a day of eating 3 meals – and decrease
    during the night.


    Once the tsunami of glucose from a meal has been tucked away, the fuel will be
    redistributed to provide energy for the rest of the body. Liver glycogen can be
    used to put glucose into the blood as needed. Muscle glycogen is broken down into
    short chains of carbon, carried by the blood to the liver and made back into glucose.
    Glycogen can also be used on the spot to power your muscle for a sudden burst
    of physical exertion, but for most sedentary people, it is just a useful temporary
    storage depot. In the graph, you can see that it takes around five hours after
    a meal for the glycogen levels to peak; then they decrease as the fuel is redistributed.


    I say ‘temporary’ storage depot, and that is certainly the ideal. But in Western
    society people typically eat three meals a day, leaving no time for the glycogen
    to be used. Instead, what happens as shown in the lower graph on the previous
    page is that there is a further rise in glycogen levels after the second meal,
    and again after the third, at which point the stores reach their highest level
    in the day.


    Glucose that cannot be stored as glycogen has to find another home. And the only
    way the body has of dealing with it is to transform it into fat. This process
    happens in the liver. The newly formed fat can either provide energy for the liver
    if needed, or be sent elsewhere in the body. However, if the energy is not needed
    in a 24-hour period, the levels stored there will gradually increase. Eat too
    much fat or carbohydrate, and fat will accumulate in the liver.


    ## Overspill of glucose into fat


    The body can cope fine if you eat too much carbohydrate – in the short term. When
    the glycogen stores are full, the excess glucose has to be stored elsewhere. This
    is the key to understanding why surplus carbohydrate and fat share the same fate.
    Our bodies have only one way of handling this excess – it has to be transformed
    into fat.


    That process – of transforming glucose into fat – happens only in the liver. But
    if this newly formed fat is not needed to burn for energy, then levels of fat
    stored in the liver will gradually increase. This process is of central importance
    for the development of type 2 diabetes, as will become clear.


    ## Where do you store your fat?


    It is no understatement to say that our ability to store energy as fat is the
    secret to our survival. If shipwrecked on a desert island, the average person
    can survive for many weeks without any food at all. The first body draws on glycogen
    – although this is a minor player as those stores will be exhausted after about
    48 hours. Then, if there are still no ships on the horizon, it will turn to the
    fat stores. Body fat can provide us with all the energy we need for life for weeks.


    The long string of carbon atoms that makes a fat molecule holds lots of energy.
    In every gram of fat, nine calories are locked up. A pound of fat contains just
    over 4000 calories (or a kilogram 9000 calories).


    It is just the same for the fat in food, which is fatty foods are also high-calorie
    foods. For fat in your body, the high-calorie content means efficient storage
    of energy.


    Fat is stored mainly just under the skin. Some people are able to store lots of
    fat there, even though our 21st-century eyes this may look undesirable. But for
    most of human history, it has been extremely desirable, signifying that they could
    afford to eat well and indicating a person''s success and high status. And there''s
    another very potent factor that was recognised long ago: reproduction requires
    adequate nutrition, and undernourished people are less fertile. This is why images
    and artefacts symbolising fertility all show very fat figures.

