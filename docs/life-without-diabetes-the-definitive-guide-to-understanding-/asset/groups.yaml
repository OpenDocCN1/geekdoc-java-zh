    recognising such a notion is to give it a name. As we are talking about an Evidence-Free
    Idea, let’s call it an EFI (pronounced effie). Sometimes the EFI appears so self-evident
    that almost everyone accepts it. Sometimes it appeals to a group who then set
    about convincing everyone else of its efficacy. Occasionally one may be promoted
    for commercial reasons.


    ## Some recent EFIs


    ## 1. The great egg demonisation


    When high blood cholesterol was recognised as being a risk factor for heart attacks,
    foods containing cholesterol were assumed to be bad for the heart. Eggs contain
    cholesterol. So the thinking went, we’d best limit our intake of them. Don’t eat
    more than one per day! Better still, avoid all eggs! Pundits on healthy eating
    vigorously promoted the concept, which went unquestioned by public-health bodies.
    Even doctors with their feet firmly on the ground accepted it. After all, it seemed
    obvious. Cholesterol causes heart attacks and eggs contain cholesterol.


    But wait a minute – let us ask some questions. ‘Does cholesterol cause heart attacks?’
    Certainly a higher level of blood cholesterol is associated with the risk of future
    heart attacks. How strong is that association in most people? Then you may ask:
    ‘Does eggs raise cholesterol?’ Again, there is no evidence of a causative link,
    although people who generally eat eggs and tend to have high blood cholesterol.
    The few people with specialist knowledge about cholesterol smile to themselves
    as the world rushes on. The panic about eggs is an example of an EFI.


    Cholesterol is needed by all the cells of the body as a vital constituent of the
    membrane surrounding each and every one. We would fall apart without it. It is
    used to make bile salts which help digestion. It is also used to make important
    hormones. Given this central role in life, is not surprising that your body makes
    it for you. It is made in the liver. You can make up to a gram per day if needed.
    But if cholesterol is handed to your body ready made via food, then a sophisticated
    control system slows down the liver’s production of it. Nature is always parsimonious,
    and the energy needed to manufacture cholesterol is conserved if possible.


    A large egg contains less than one fifth of a gram of cholesterol (all in the
    yolk). If you eat more than five large eggs a day, there may theoretically be
    a problem – although it is likely that the body can deal with this by one of its
    myriad regulatory mechanisms. It also has to be said that unusual problems in
    controlling cholesterol can occur, specific medical advice for individuals is
    important. However, there was never any satisfactory proof that eating eggs causes
    high cholesterol or heart attacks, or that restricting the egg intake of a population
    improves health.


    The EFI persisted for decades, but at last has been officially debunked. The old
    slogan of the British Egg Marketing Board ‘Go to work on an egg’ can be rehabilitated.


    A postscript has to be added. Meta-analysis rears its ugly head. Yet another lumping-together
    of studies that merely report the age-old associations of egg eating has just
    been published (2019). The predictable headlines have appeared, even though there
    is no new information, just a recycling of old facts.


    ## 2. Killer fat


    Another example of a EFI is the notion that a healthy diet has to be low in fat.
    It developed as a spin-off from an epidemiological study that counted how much
    fat was habitually eaten and rates of deaths from heart disease. There seemed
    to be an association. This 1960s study was known as the Seven Countries Study.
    Indeed, it looked over seven countries, and found that heart disease was commoner
    in the affluent ones. No surprise there. Then came the link by association: these
    affluent countries could afford for their populations to eat the fat of the land.
    They also had many other differences in lifestyle. Even worse, it seems that information
    from other countries was not included. Had they been included, the association
    would have become much weaker. That became clear some years later. Through the
    1970s and onwards, studies found that low-fat eating itself seemed to have no
    effect on life expectancy. But it was too late to affect the belief system.


    Big problems occur when a scientific misconception is adopted by governments.
    The US government’s first official advice on ‘diet’ in 1977 recommended decreasing
    animal fat consumption so that it made up 30% rather than around 40% of the food
    every day. It is likely that this advice was influenced to some degree by the
    heart attacks suffered by President Eisenhower. Yes! In the context of a country
    suffering what appeared to be an epidemic of heart attacks, clearly something
    had to be done. The association between the level of fat in the diet and deaths
    from heart attacks was sufficient to railroad a decision to name and shame the
    apparent culprit. Many lynch mobs have targeted the wrong man. But when governments
    get it wrong, the error tends to become the accepted norm – sometimes accumulating
    against it for the past four decades.


    Despite evidence decades, this particular EFI won’t go away. Eating lots of fat
    certainly brings with it the possibility that many calories will be consumed.
    However, as discussed in Chapter 8, some people find it easiest to avoid overeating
    on a higher-fat, lower-carbohydrate diet, whereas others may find limiting calorie
    intake easier on a lower fat, higher-carb diet. It is the total amount of food
    that determines the risk of weight gain in the long term, and hence the risk to
    health. The human paradox raises its head again – biological facts do not necessarily
    determine human outcomes. All the personal and social influences on a person (habit,
    appetite, family and society norms, behaviour of friends and coworkers) play a
    part in determining what really happens.


    Having debunked the notion that health flows from eating a low diet, it has to
    be said that there are some subtleties in the debate about fat. Fat comes in several
    forms. The difference between saturated and unsaturated is explained in the box.


    ## What is saturated fat?


    As explained in Chapter 2, fat molecules contain long strings of carbon. To make
    the string, a carbon atom has to hold hands with hydrogen. However, if each carbon
    uses two hands the fat is said to be ‘saturated’. But some carbons hold on as
    many hands – if just one link is unsaturated then the fat is called ‘monounsaturated’.
    If a few links are unsaturated it is called ‘polyunsaturated’.


    Saturated fat is typically of animal origin. Unsaturated fat is typically of plant
    origin, such as in cooking oils. That is the brief.


    There is reasonable evidence that the type of fat one eats makes a modest but
    worthwhile difference to health, with saturated fat being less good than unsaturated
    fat. Substituting olive oil for lard, or eating more fish and nuts can achieve
    this modest benefit.


    The facts may surprise you.


    | Source | Saturated | Monounsaturated |

    | :--- | :--- | :--- |

    | Beef fat | under 50% | over 50% |

    | Olive oil | around 10% | around 75% |

    | Almonds | about 8% | 60% |


    ## Should we cut down on all types of fat?


    In Chapter 3, the fat of glucose was described. Anything in excess of what your
    muscle and liver are able to store or burn for medium- or longer-term storage.
    And there is the rub. Because the process for doing this produces 100% saturated
    fat. If taken in amounts greater than your body is able to immediately use, all
    the extra carbohydrate is turned into the riskiest kind of fat, however brown
    the rice or wholemeal the bread.


    This process happens much more readily in people who are insulin-resistant, as
    explained in Chapter 4.


    However, as always, provides a let-out of sorts. Your liver will process some
    of the 100% saturated fat that you produce from any extra carbohydrate, changing
    a proportion to unsaturated.

