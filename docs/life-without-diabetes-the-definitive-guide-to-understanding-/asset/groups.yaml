    通过观察当今的人口状况，任何人都能看到脂肪在人体部位的分布方式差异巨大。有些人肚子很大，而另一些人则腿部和臀部很大。得益于剑桥大学一群科学家进行的研究，我们现在知道，自身脂肪层的最大容量由许多基因决定，每种基因都具有影响；但除了脂肪性营养不良综合症等罕见疾病外，在普通人群中并没有一个单一的“脂肪”基因能决定一个人在皮肤下可以储存多少脂肪。当然，你储存了多少取决于你长期以来摄入了多少食物，以及日常活动中消耗了多少能量。我们非常不善概念化时间，无论是地质时间，还是微小影响导致体重大幅增加的漫长时期。


    如果在分配给你的基因的彩票中，你脂肪的“安全存款”相当有限，那么在脂肪必须向其他地方堆积之前，你不需要增加太多体重。正如我们从“双相循环假说”（Twin Cycle
    Hypothesis）所知，这就是为什么人们在并不胖的情况下也会患上 2 型糖尿病。


    这一切可以提炼为一个极其重要的事实：如果一个人患了 2 型糖尿病，说明他们对于自己的身体来说已经太重了。


    ## 对自己的身体来说太重了


    塞缪尔·约翰逊（Samuel Johnson）辞藻精炼，是一个敏锐的观察者。在 1790 年左右，他说：“如果一个人太胖了，显而易见他吃得比应该吃的多。”


    注意，他并没有说这个人“吃得太多”。他察觉了一种细微的差别，即不同个体需要不同数量的食物。现在，也许我们可以站在巨人的肩膀上，对 2 型糖尿病给出一个简洁的表述：


    如果一个人患了 2 型糖尿病，说明他们对于自己的身体来说已经太重了。


    ## 测试个人脂肪阈值假说


    来自英国糖尿病研究计划（UKPDS）的信息对于支持“个人脂肪阈值”概念非常有帮助。但另一项针对 2 型糖尿病的研究提供了更关键的进一步证实。


    《护士健康研究》（Nurses’ Health Study）是世界上规模最大、持续时间最长的女性健康研究。该研究由美国哈佛的一群科学家于 1976 年建立，对五十万名年轻护士的生活方式因素对其健康的影响进行了长期随访——应该说明的是，选择这些护士并不是为了研究从事护理职业的风险因素，而是因为护士可能被认为能够提供准确的数据。


    通过对参与者的定期随访以及对健康和生活方式因素的反复评估，该研究在塑造西方世界的公共卫生建议方面发挥了重要作用。它帮助揭示了例如，吸烟与心脏病及癌症之间的早期联系；绝经后肥胖与乳腺癌之间的关系；并阐明了其他与其他健康的因素。


    我感兴趣的是体重增加，或者人可能患上 2 型糖尿病的脂肪阈值。研究显示：那些在几十年中保持接近年轻时体重的人（即 BMI 保持在 22）可能不会患上糖尿病；但那些
    BMI 即使轻微增加的人（在 23 到 25 之间）患上该病的可能性要高得多。这种风险的增加绝非小道。体重在正常 BMI 范围内增加的女性，患 2 型糖尿病的概率是
    BMI 保持在 22 以下女性的四倍。


    为了联系背景，针对大规模人群的大型研究可能会显示风险增加了，例如增加了 15%。这通常会导致人们劝告改变行为或避免某些食物。这被称为“在统计学上有意义”。但实际上，15%
    的风险增加仅相当于你真实风险的微小变化。例如，如果你在未来 10 年患 2 型糖尿病的几是 10 分之一1，而你的风险增加了 15%，那么你的风险就会变成
    10 年中 1.15。任何熟悉赔率的人都会说：“所以你是想说我的风险从 10 分之一1 变成了大约 10 分之一1 吗？”在个体层面这并不显著。另一方面，四倍的增加意味着你患
    2 型糖尿病的风险将上升到 10 分之4，这对你来说是风险巨大的增加。


    所以，如果这些曾经年轻、健康且纤细的女性只增加一点体重，患 2 型糖尿病的风险水平就会大幅增加。当然，如果她们增加更多体重，风险会上升得多。这项研究有力地展示了某些个体对过度脂肪的耐受阈值很低。


    我们知道当整个人群变得越来越胖时（正如今天许多国家发生的情况），整体影响是患 2 型糖尿病的人数增加。会有更多的人超过他们的个人脂肪阈值。将人口趋势外推到个体，导致了一种广泛的观点，即人的体重应该是判断其是否可能患该疾病的良好依据。读到章节的这里，你知道“正常”体重的人也可能患
    2 型糖尿病。


    留意人口统计数据。经常被引用的关于患 2 型糖尿病风险的数字，例如“如果 BMI 大于 30”，对于已经患此病的个体来说是无关的。我们将在第 9 章讨论风险因素。


    ## 对 2 型糖尿病的敏感性


    个人脂肪阈值解释了为什么个体在任何 BMI 水平下都可能患 2 型糖尿病。但如果我们观察硬币的另一面，情况又是怎样的？那些非常肥胖但没有患 2 型糖尿病的人又是怎样的？


    事实上，大多数非常肥胖的人并没有患 2 型糖尿病。在美国范围内进行的三项调查显示，BMI 超过 45 的人没有患糖尿病。我们在纽卡斯尔磁共振中心的最新研究清楚表明，脂肪脂肪并不会导致所有人产生
    2 型糖尿病。它只是在肝脏产生脂肪，并确保这些潜在的毒性物质输送到胰腺。


    但是糖尿病有一个关键的“是/否”开关。任何患 2 型糖尿病的人对这种疾病都是敏感的。这是显而易见的。此外，他们必须拥有对脂肪负面影响敏感的β细胞。长期以来，我们知道大多数与糖尿病相关的人类基因与胰腺有关。现在我们有了一个大线索，即至少某些基因决定了如果脂肪堆积你是否会患糖尿病。


    ## 观察β细胞


    在20世纪90年代初，罗杰·恩格（Roger Unger），糖尿病领域的一位天才大脑进行了一项涉及大鼠的研究，证明了对脂肪的敏感性归于单一基因。该基因决定了动物在过度营养后是否会患糖尿病。


    恩格和他的团队从患病之前的年轻大鼠身上提取了β细胞，并用脂肪将其培养了几天。恩格和他的团队发现，脂肪损害了细胞对葡萄糖产生胰岛素的能力。这本身就很有趣。


    随后，他们在其他方面相似但没有基因缺陷的大鼠身上进行了相同的实验。这些大鼠的β细胞在暴露于脂肪的情况下继续正常产生胰岛素。脂肪脂肪没有产生影响，证明了糖尿病的最终敏感性在于β细胞本身。


