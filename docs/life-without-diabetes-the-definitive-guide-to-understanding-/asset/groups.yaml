    ## 2.6 从侧面观察身体，这些图片展示了下躯干内部的结构。


    脊柱位于中央延伸。在腹腔内，肠道环是灰色的，其余部分填充了内脏脂肪（白色）。左侧的扫描图是一个 BMI 为 35 的 2 型糖尿病患者，右侧图片显示的是同一人在体重减轻
    15kg 后的状态。原始的 MR（核磁共振）扫描结果可以在这里（https://go.ncl.ac.uk/diabetes-reversal）在线查看。


