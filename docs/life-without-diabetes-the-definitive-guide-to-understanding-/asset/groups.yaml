    # Low carb?


    Around 50% of the average British diet is made up of carbohydrate. Given that
    most countries in the rest of Europe eat 43-45% as carbohydrate, this may give
    pause for thought. After all, the UK is the Fat Man of Europe. This statistic
    is far from proof of cause and only an association, but the experience of many
    people suggests that moderately limiting carbohydrate intake may help with weight
    control.


    Curiously, the hard evidence from research studies suggests that the effect of
    low-carb eating is relatively modest. There is a small benefit in the early months,
    in terms of both weight control and blood glucose control. But the very small
    number of longer-term studies show no benefit after one to two years. Why should
    this be? Probably because the basic premise that any way of eating is best for
    everyone is flawed.


    And then there is the issue of what exactly is meant by ‘low carb’. How low is
    low?


    Eyeing short-term weight loss can be achieved by reducing carbohydrate intake
    drastically to 20-50g per day. This means eating no bread, potato, rice, or other
    mainly carbohydrate-based foods. Certainly, some populations, such as the Inuit
    in northern Canada, have thrived on such a diet. Healthy life is undoubtedly compatible
    with a low-carbohydrate diet. After all, agriculture developed only around 10,000
    years ago and during the previous 200,000 years of our evolution as a species,
    our ancestors simply did not have carbohydrate-rich foods.


    For most people, ‘low carb’ would mean 50-130g of carbs per day. That would allow
