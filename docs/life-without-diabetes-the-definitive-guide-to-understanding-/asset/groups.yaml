    ## 人口迁移


    记住之前提到的数字——平均而言，男女女性的体重比现在轻 10 公斤。1980 年时他们的平均 BMI 为 24。回到第 135 页，尝试在街景照片中寻找“肥胖”的人。背景人群的
    BMI 为 27，在照片中找到肥胖的人并不困难。


    ## 为什么 UKPDS 大多数参与者并不肥胖？


    我们看到，对于任何给定的 BMI，有些人皮肤下储存了相当多的脂肪，而胃腔内不多；而其他人皮肤下含量正常，内部很多。使用磁共振方法研究我们如何处理食物的一个大优势是，身体内部结构是可见且可用于测量脂肪、糖原和其他物质的。查看图
    2.6 和 2.7 以了解不同人的内部情况。


    储存在胃腔内的脂肪本身并不一定坏。但它是皮肤下正常的储存库已经满了，因此脂肪在任何可以产生的地方聚集，包括器官内部。我们现在知道，这种脂肪是问题的根源，这也是我们理解为什么非肥胖者也会患
    2 型糖尿病的线索。


    ## 来自自然意外的洞察


    有时，自然的意外可以推动科学理解产生飞跃。例如，某些罕见个体出生时皮肤下没有脂肪，他们通过在其他地方储存脂肪来生存。这种疾病被称为脂肪不良症，由单个缺陷基因引起。这种病的人极其消瘦，但他们的肝脏充满了脂肪。在读了第
    4 章和第 5 章后，得知他们经常患有 2 型糖尿病可能并不会感到意外。

