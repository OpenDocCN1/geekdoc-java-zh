    # The Personal Fat Threshold — let’s hear it for the individual


    The graphs overleaf illustrate that the average BMI has increased – the whole
    mountain has moved (compare figures 6.2 and 6.3). But while it is shocking that
    the population has become so much heavier, this is population science, not medicine.
    We are all individuals. Doctors have just one patient in front of them in a consultation.
    Let''s imagine some of the individuals.


    Panel A shows individuals according to their BMI. The overall information is similar
    to the population distribution graph, figure 6.2, on page 136, but instead of
    just a smooth line telling us about the whole population, individuals are shown.
    Each dark grey dot is one person with type 2 diabetes. For this group, you will
    see that the common BMI is around 27. The graph enables us to see what might happen
    to each person with diabetes over time. For instance, what if they lose 15kg in
    weight?


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_97_0.png)


    6.4 Each dot is one person, showing their BMI. ‘Normal’ BMI is between the dotted
    lines. The most common BMI is 28 in this group of people with type 2 diabetes.


