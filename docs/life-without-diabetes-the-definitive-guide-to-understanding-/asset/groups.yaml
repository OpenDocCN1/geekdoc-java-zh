    回到那张纸上。假设胰脏中脂肪的存在阻碍了运作，并防止胰岛素在餐后快速产生，我们可以预见到对进食的正常胰岛素反应会逐渐迟钝，这反过来会导致餐后血糖水平持续较长时间。众所周知，对于
    2 型糖尿病患者，在病情发生前，餐后胰岛素反应就会变得不足。但现在我能看到，持续的高血糖还会导致血液中基础胰岛素水平升高，而且在肝脏中会导致葡萄糖向脂肪的转化进一步增加。


    一旦建立，这两个恶性循环将相互作用并互相加强。来自肝脏的过多脂肪将驱动胰腺循环，而高血糖水平最终会推高胰岛素水平，从而驱动肝脏循环。


