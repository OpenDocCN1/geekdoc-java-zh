    # Carol’s Ratatouille


    Carol loved this vegetable recipe with rich tomato sauce and chunky, juicy Mediterranean
    vegetables. If you have some pre-made sofrito you can use it as the base for the
    veg, replacing the tinned tomatoes and other ingredients here.


    Prep: 15 minutes; cook: 1 hour; makes 4 servings


    +   INGREDIENTS

    For the chunky veg:

    * 1 medium red onion, peeled and chopped into 2cm chunks 2 zucchinis, ends removed
    and sliced into 1cm discs, then cut in half (or quarter, if it''s a large zucchini)

    * 1 eggplant, top and bottom removed, sliced into 1cm slices then cut into chunks
    of a similar size to the zucchini

    * 3 medium tomatoes, cut into eighths

    Olive oil spray (or 1 teaspoon olive oil)


    +   For the tomato sauce (can be replaced with your readymade sofrito):

    * 1 tin of chopped tomatoes

    * 2 teaspoons apple cider vinegar (optional)

    * 3 garlic cloves, grated or crushed

    * 1 teaspoon each of dried rosemary, oregano, thyme and chilli flakes

    * Salt and pepper to season

    * A few fresh basil leaves, torn into pieces


    +   WHAT TO DO

    1. Preheat the oven to 180°C/gas mark 4.

    2. Spray an unproof dish with oil.

    3. Mix the chopped tomatoes, cider vinegar, dried herbs, chilli flakes and garlic
    together, season with salt and pepper and pour them into the bottom of the dish
    (or use your pre-made sofrito sauce for this element of the recipe).

    4. Lay the sliced veg over the tomato mixture.

    5. Spray with oil and scatter the basil leaves on top.

    6. Cook in the oven for 1 hour.

    7. Serve in a bowl and enjoy.'
