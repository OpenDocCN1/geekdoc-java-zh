    ## Helen’s Garlicky Greens with Mushrooms


    Prep: 5 minutes; cook: 15 minutes; makes 2 servings


    INGREDIENTS

    - 250g kale (or any other greens)

    - 1 tablespoon olive oil

    - 1 garlic clove, crushed

    - 1 red onion, sliced

    - 200g mushrooms, sliced

    - 1 teaspoon dried chilli flakes


    WHAT TO DO


    1. Steam the kale in a pan with a little boiling water for about 5 minutes or
    until tender. For extra aromatic flavour, try adding the crushed seeds of 4 cardamom
    pods before steaming.

    2. Tip the kale into a colander to drain.

    3. Dry off the pan, add the oil and heat on medium.

    4. Add the crushed garlic and sliced onion and sauté for 2 minutes.

    5. Add the mushrooms and chilli flakes. Cook for another 8 minutes, stirring frequently,
    until golden brown.

    6. Stir the kale into the mixture, and cook until it’s heated through.


    ## Janet’s Zucchini with Spring Onions


    Prep: 5 minutes; cook: 11 minutes; makes 2 servings


    INGREDIENTS

    - 2 medium zucchinis

    - 2 teaspoons olive oil

    - 3 garlic cloves, crushed

    - 6 spring onions, finely chopped


    WHAT TO DO


    1. Slice the zucchinis into 1cm rounds.

    2. Heat the olive oil in a frying pan over a medium heat.

    3. Add the garlic and fry for 1 minute, stirring continuously to stop it burning.

    4. Add the sliced zucchinis and cook for 5 minutes, stirring frequently.

    5. Add the spring onions to the pan and cook for a further 5 minutes.


    ## Mediterranean-Style Artichoke Salad


    Prep: 15 minutes; makes 4 servings


    INGREDIENTS

    - 1 jar/tin of quartered artichoke hearts, drained

    - 1 jar of roasted red capsicum (or use raw red capsicum if preferred), diced

    - 1 cucumber, deseeded and diced

    - 2 garlic cloves, crushed

    - 1 small red onion, finely chopped

    - 1 tablespoon extra-virgin olive oil

    - 1 tablespoon dried oregano

    - Juice of ½ lemon


    WHAT TO DO

    1. Put all the ingredients in a large bowl and mix them together.

    2. Cover with clingfilm and chill for an hour to allow the flavours to blend before
    serving. Keeps in the fridge for 2 days.


    ## Butternut Pumpkin and Coriander Salad


    This flavoursome dish is especially good as a cold lunch the day after cooking.
    Use plenty of coriander and lime juice for a really fresh taste.


    Prep: 10 minutes; cook: 20 minutes; makes 4 servings


    INGREDIENTS

    - 1 small butternut pumpkin, peeled and cut into 2cm chunks

    - 1 tablespoon olive oil

    - 1 red onion, diced

    - 1 teaspoon dried cumin seeds

    - 1 teaspoon ground coriander

    - Juice of 1 lime

    - Chopped fresh coriander to serve


    WHAT TO DO


    1. Bring a medium pan of water to the boil and cook the pumpkin for 10-15 minutes
    or until tender when prodded with a fork.

    2. Drain in a colander and cool under cold running water. Set aside.

    3. Heat the olive oil in a frying pan.

    4. Add the diced red onion and cumin seeds and cook for 2 minutes, stirring frequently.

    5. Add the drained butternut pumpkin, sprinkle over the ground coriander and cook
    for a further 3 minutes, stirring frequently.

    6. Stir in the lime juice.

    7. Allow to cool, and sprinkle over fresh coriander before serving.


    ## Helen’s No-noodle Chow Mein


    Helen''s dish is a good alternative to a more calorific takeaway chow mein dish.
    Chow mein literally means ''stir-fried noodles'', but in keeping with the veg-only
    approach, bean sprouts take the place of noodles. Helen comments ''It''s the most
    yummiest thing. Very tasty!''


    Prep: 5 minutes; cook: 5 minutes; makes 3 servings


    INGREDIENTS

    - 500g (1 bag) bean sprouts

    - 1 teaspoon sesame oil

    - 3 teaspoons dark soy sauce

    - 1 tablespoon olive oil

    - 1 teaspoon fresh ginger, finely chopped

    - ½ garlic clove, finely chopped

    - 1 carrot, peeled into strips using a vegetable peeler

    - 4 spring onions, sliced

    - 6 mushrooms

    - 1 small tin of sliced water chestnuts, drained

    - 1 red chilli (optional), deseeded and chopped

    - Dash of Worcestershire sauce (optional)

    - 1 pak choi, sliced into strips


    WHAT TO DO


    1. Place the bean sprouts in a bowl, add the sesame oil and 1 teaspoon of soy
    sauce and mix well to coat them.

    2. Heat the oil on high in a wok or heavy-based frying pan.

    3. Add the garlic and ginger. Stir-fry quickly for a minute.

    4. Add the carrot strips, spring onions, mushrooms, water chestnuts and red chilli.
    Stir-fry for another minute.

    5. Add a dash of water – enough to loosen the mixture – then stir in the remaining
    soy sauce and a dash of Worcestershire sauce, ensuring everything gets a good
    coating.

    6. Tip the bean sprouts into the pan, followed by the pak choi.

    7. Stir-fry for 2 minutes and serve.


    ## Easy Vegetable Curry


    You can use any spices you like to make your own curry, and try different veg
    (cauliflower and spinach work really well) for variety. This version uses curry
    powder to keep things easy.


    Prep: 15 minutes; cook: 60 minutes; makes 4 servings


    INGREDIENTS

    - 1 tablespoon olive oil

    - 1 large onion, thickly sliced

    - 1 large onion, thickly sliced

    - 2 garlic cloves, crushed

    - 2 tablespoons curry powder

    - 2 large carrots, thickly sliced

    - 400g swede, cut into chunks

    - 400g tin of tomatoes

    - 425ml vegetable stock

    - 4 tablespoons fresh coriander


    WHAT TO DO

    1. Heat the oil in a large pan.

    2. Stir-fry the shallots for 2 minutes.

    3. Add the pumpkin, curry powder, cinnamon and season to the pan for 5 minutes.

    4. Pour in the vegetable stock and bring to a boil.

    5. Reduce the heat to a simmer with the lid on and cook for 30 minutes until the
    pumpkin is tender (check by inserting a fork).

    6. Allow the soup to cool slightly.

    7. Blend everything in batches.

    8. Return the soup to the pan and stir in the fresh coriander.

    9. Cover with a lid and cook until the vegetables are soft.


    ## SOUPS


    ## Lynda’s Curried Butternut Pumpkin


    Prep: 5 minutes; cook: 25 minutes; makes 4 servings


    INGREDIENTS

    - 1 tablespoon coconut oil

    - 1 small shallot, finely diced

    - 1 butternut pumpkin, peeled and chopped

    - 2 teaspoons curry powder

    - 1 litre vegetable stock (made with a stock cube or stock pot)

    - 4 handfuls of fresh spinach


    WHAT TO DO

    1. Place the coconut oil in a large pan.

    2. Stir-fry the shallots for 2 minutes.

    3. Add the pumpkin, curry powder, cinnamon and season to the pan for 5 minutes.

    4. Pour in the vegetable stock and bring to a boil.

    5. Reduce the heat to a simmer with the lid on and cook for 25 minutes until the
    pumpkin is soft.

    6. Allow the soup to cool slightly, then blend everything in batches.


    ## Watercress Soup


    Increase your intake of leafy greens without even noticing! This version replaces
    the usual potato with white turnip to keep the carbohydrate content down.


    Prep: 10 minutes; cook: 35 minutes; makes 4 servings


    INGREDIENTS

    - 1 tablespoon olive oil

    - 1 small onion, diced

    - 2 small white turnips, peeled and chopped

    - 1 litre chicken or vegetable stock (made with a stock cube or stock pot)

    - 2 bags of fresh watercress

    - A splash of milk

    - 1 teaspoon grated nutmeg

    - Salt and black pepper


    WHAT TO DO


    1. Heat the oil in a large pan on a medium heat.

    2. Fry the onion for about 5 minutes, stirring constantly until it begins to soften.

    3. Add the chopped turnip, cover with a lid and cook for another 5 minutes.

    4. Pour in the stock and turn up the heat to bring it to the boil.

    5. Reduce the heat to a simmer and cook for 20 minutes with the lid until the
    turnip is soft.

    6. Add the watercress, turn off the heat and allow the soup to cool slightly.

    7. Blend in batches, then return the soup to the pan and add a splash of milk,
    along with the nutmeg and some salt and pepper.

