    Fred和Bill是邻居，体重都是100公斤。Fred想减几磅，所以他掸掉他的壁球拍，在缓慢开始后，在周六早晨开始打半小时球。Bill喜欢在自己的花园周围活动。他稳定地修剪、除草和整理，从不气喘。一个周六早晨，Fred满脸通红，他靠着围栏告诉Bill他应该做运动。但Fred发现自己的体重并没有减少。谁在周六早晨消耗的能量更多？答案在于时间。在球场上运动半小时，能量消耗从每分钟1.3卡路里增加到8卡路里。在半小时内他消耗了240卡路里。然后他坐下来看报纸，在早晨剩下的时间里，消耗了315卡路里。Bill在在花园里活动，活动了四个半小时，比多多消耗了555卡路里。对于Fred来说，还有一个障碍。离开壁球俱乐部时，他路过自动售卖机，奖励自己一小块巧克力（只有100克），在两分钟内又增加了400卡路里。


