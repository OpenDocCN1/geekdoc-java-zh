    week may be fine. Beer would be problematic, given that it is so full of calories
    (around 200 in one pint!).


    # Why do I feel cold?


    Some people feel cold all the time while losing weight. A common misconception
    is that this is due to the thinning of the insulating layer of fat under the skin
    – a most unlikely explanation since coldness tends to come on so soon after starting
    to lose weight. Feeling cold is more likely to be caused by the smaller amounts
    of heat generated by the body when deprived of calories. The only thing you can
    do is wrap up warmly (thermal vest?) and accept it as a better option than being
    too heavy and too sweaty.


    # Will my thinning hair regrowth?


    This is unusual, but the answer is yes – providing that is due to the sudden change
    in nutrition. A few people notice hair loss after weight loss. In fact, under
    any unusual circumstance (exams, pregnancy, family illness) the growth cycle of
    hair follicles tends to become synchronised, which means that instead of losing
    the normal 70 hairs per day as they come to the end of their growth cycle and
    fall out, several hundred fall out every day for a short time. But don’t worry
    – they will all grow back over a few months.


    # How can I fix my constipation?


    There are people who, despite chomping through a large plate of lettuce, celery,
    peppers and tomatoes every single day, find that they are still constipated while
    dieting. What to do? The simplest thing is to ask your own doctor to prescribe
    a medicine that will bulk up your bowel movements.


    # Can weight loss cause gallstones?'
- md: '

    A low-calorie diet generally makes gallstones smaller, which means there is a
    small chance that they may squeeze into the biliary duct (through which the juices
    enter the gut), causing pain. Among people with type 2 diabetes, gallstones are
    very common – they are present in around one person in five. In our DIRECT trial,
    only one person of the 149 undergoing weight loss had gall bladder trouble during
    the study. This is not very different from the number that would be expected in
    a group of people with type 2 diabetes undergoing standard medical treatment.
    Therefore, although there is a small risk of having a biliary attack as gallstones
    get smaller, if no weight is lost there is a greater chance of a future episode
    of gallstone pain away.


    ## Can I change where the fat disappears?


    Sometimes it seems as though the fat is dropping away, but from all the wrong
    places. Sadly, we have no way of affecting this. In fact, it is amazing that even
    now, with our detailed knowledge about so much of the human body, we have no idea
    why fat is stored in the places it is on any one person’s body. What controls
    this? What stops it being heaped together in a hump somewhere? Bar the obvious
    effect of sex hormones on the distribution of some parts of the fat layer in a
    typically female or male pattern, we have no idea.


    ## Can I avoid looking puny after weight loss?


    This might sound an odd question, given the aspiration to being thin and fit in
    our modern culture. But it is, interestingly, often posed by people in positions
    of power. It has a greater importance in some cultures than in others. Views may
    be changing in the UK, where in times gone by, most company directors, most civic
    mayors and most leaders would be large, imposing people. Elsewhere in the world,
    the phrase ‘avoir poids – i.e. to have gravitas, or power – could be applied to
    many of the ‘top’ people. The best way to avoid looking ‘impressive’ weight loss
    is to undertake weight training to build up the neck and shoulders. And to have
    self-confidence. You don’t need extra weight to give the impression of clout.


    ## Quick read


    - Recognise the problem: if you have type 2 diabetes you have become too heavy
    for your body

    - Write down your target weight: usually a weight loss of 15kg (2 stone 5 pounds)

    - Recognise that food intake has to be decreased for 2-3 months: think when it
    may suit you to do this

    - Discuss with family and friends: support is one of the secrets of success

    - Decide: do you really want to do this?

    - Prepare for action: clear the cupboards

    - Action: do it


    The simple bottom line is: avoid weight regain.

    Having worked so hard to get your weight down, you will be feeling better than
    you have for years, ready to embrace life with renewed vigour and confidence.
    And so you should. But do not relax too much! The period after rapid weight loss,
    when you start the switch back to more normal eating, can be a dangerous one.
    You will need all your resolve to keep to your goals and stay well. Stick reminders
    on the fridge and enlist friends and family to spur you on.

    Remember, you will not be able to return to eating the amount you used to regard
    as normal. Keeping down your calorie intake is crucial, as is regular physical
    activity. However, you must bear in mind that the balance between food energy
    taken in and energy burned by physical activity is very delicate: a couple of
    extra mouthfuls of food can easily cancel out the effects of half an hour of exercise.


    The rest of this chapter considers some strategies to help you plan your approach
    and avoid the bear-traps that would cause weight regain and ill health.


    ## What really happens after weight loss?


    In Chapter 2, I made the observation that big animals need more calories than
    small animals. If you have a smaller body to keep alive, and so you need less
    food. This is sometimes dressed up in scientific language – your metabolic rate
    has decreased. But that creates an aura of mystic; the real problem is the very
    human one of habit. Most of our lives run on autopilot – it would be exhausting
    to make new decisions every minute of the day – so we easily slip back into those
    deeply ploughed furrows. Think about your food behaviour: when do you find yourself
    eating? And with whom? How much do you usually put on your plate? How often do
    you cook with fresh ingredients instead of buying ready-made meals? It is vital
    to make aware of your eating habits if you are going to make effective, targeted
    changes.


    First, let''s look at the experience of other individuals who have won through
    and escaped from diabetes. It is true that in any group, the average weight will
    tend to creep up over time. But as is often the case, the average does not reflect
    what is really going on. Behind the apparently steadily increasing weight we can
    identify several patterns.


    The commonest pattern is to have a reasonably steady weight – one that has involved
    a clear change in eating habits and requires ongoing effort, and everything seems
    to be okay... until a life event happens. It might be illness in the family or
    trouble at work, or any number of other things. Life does not run smoothly all
    the time. Naturally, the event fills the mind and has to be coped with. And, in
    the meantime, all that focus on one''s change of habits tend to fade into the
    background. Yes, it remains important, but it is displaced by whatever is immediately
    threatening the smoothing running of life. As a result, weight increases quite
    rapidly.


    Of course, in real life sorts of events happen to different people at different
    times – although this is not reflected in the statistics, where everyone’s weight
    is merely averaged over time. So the weight graph appears to rise steadily. There
    is an important message to be taken from this: you need to be prepared for how
    you manage when life deals a hard blow. Being aware that stress can pose a problem
    is a good start, but you should have a rescue plan. It is too late to think about
    ordering a life when you are already in the water. In our studies, about one in
    two people required at least one return to the liquid diet, and some people required
    two or three. Telling the overall weight loss at two years was very similar in
    those who had cruised along at a steady weight and those who had run into life
    events and needed occasional life.


    A second pattern of weight gain is, as you might expect, a steadier increase –
    week on week, month on month, which means that something in excess of calorie
    requirements is being consumed. Sorting this out requires a clear-headed evaluation
    of what is happening. Sometimes an ongoing problem, such as stress at work, is
    chronically requiring effort from weight maintenance, and it may be useful to
    emphas this. Sometimes it is to do with food habits: eating between meals, or
    getting lax about portion control. You may have reverted to your old habit of
    putting too much on the plate. By hook or crook, these behaviours have to be tackled.
    Consumption of beer, wine and spirits may have to be restricted to weekends or
    partially substituted by zero-calorie drinks. Tap water is delightfully inexpensive
    – but the problem is often in the social pressure of buying rounds.


    Another pattern of weight regain could be called the cruise holiday. Being exposed
    to pre-paid food in limitless quantities is a sure recipe for putting on weight.
    Sometimes the weight gain is prodigious. It is easy to understand how this happens.
    You have been away from your routine, in a glorious escapist bubble; but on your
    return home from holiday you must be under no illusion that type 2 diabetes is
    ready to spring its trap. The weight gain needs to be recognised and dealt with
    urgently.

