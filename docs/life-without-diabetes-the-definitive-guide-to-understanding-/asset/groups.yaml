    # About the Author


    **Professor Roy Taylor** is Professor of Medicine and Metabolism at Newcastle
    University and Honorary Consultant Physician at Newcastle upon Tyne Hospitals
    NHS Foundation Trust. He qualified in Medicine at the University of Edinburgh.
    He was visiting Professor of Medicine at Yale University, USA (1990-91) where
    he acquired new MRI methods to look into the human body. On returning to the UK
    he raised £5.2 million to establish the Newcastle MR Centre. He also developed
    the UK system for screening of diabetic eye disease and is the author of over
    300 scientific papers.


