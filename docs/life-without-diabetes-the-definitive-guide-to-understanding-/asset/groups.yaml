    ### 推断


    情况是这样的：减道手术研究中的这些人非常胖。这就是他们接受手术的原因。计算他们为了生存每 24 小时大约需要多少热量非常简单。我们每天至少需要 2700 卡路里，仅仅是整天躺在床上，一动不动。这比普通人在活动时摄入的还要多。当然，在医生对胃进行手术之前，至少
    12 小时内不能进食。这些人的通常摄入量在手术前一天晚上突然下降，从大量的量变为零，当时护士在他们的床头挂了一个牌子：“禁口”。身体必须存活——并且每天需要
