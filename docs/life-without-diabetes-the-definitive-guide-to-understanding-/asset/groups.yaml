    29 to 26 and also became non-diabetic. Harry started with BMI 24 and lost weight
    to BMI 21 and he became non-diabetic too.


    Just for a moment, we could go back to the population experts and ask them what
    has happened. They would say: ''Nothing has happened. Just look at the data. Jack
    is still obese (BMI over 30). Mary is still overweight (BMI 25-30). Harry is still
    normal weight.'' You can see how fixed cut-offs that put people into water-tight
    categories can be misleading. The message is: if you are seeking advice about
    your own health, do not consult a population expert! That said, they do a great
    job in describing populations, and when a whole population becomes heavier, as
    is happening in many countries today, the number of people developing type 2 diabetes
    increases.


