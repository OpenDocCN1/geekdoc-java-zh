    # Your pancreas


    As mentioned in Chapter 1, type 2 diabetes only develops if the beta cells in
    the pancreas have become unable to respond normally to glucose. It had long been
    believed by medical researchers that these cells were dying off gradually, one
    by one. Why? Looking at a post-mortem pancreas under the microscope, scientists
    could see that there were about half the normal number of insulin-producing cells.
    Most scientists and doctors believed that there were different causes for this
    in different people. Yet yet in type 2 diabetes, a single factor stands out. The
    condition is rare in populations short of food but common in those with plenty
    of food. And, if populations with plenty of food suddenly run into food rationing,
    type 2 diabetes becomes far less common, as was documented in Cuba after the economic
    collapse in the 1990s. A simple change determining the frequency of a disease
    implies one single cause.


    Overnight, in a person with type 2, the remaining beta cells try to control glucose
    levels but it''s a struggle. Then, after eating, the problem becomes very clear.
    The beta cells can walk, gradually managing to pump more insulin into the blood,
    but they cannot run in response to a sudden demand. Try as they might, the beta
    cells have become incapable of responding rapidly to rising blood glucose levels.
    The demand for a surge in insulin production goes unanswered. That is really the
    hallmark of type 2 diabetes – lack of a rapid response to demand.


    # Your liver


    If you have type 2 diabetes, your liver will be insulin-resistant. As explained
    in Chapter 3, this lack of response to the controlling hormone, insulin, will
    make it unable to shut off the production of glucose. Consequently, glucose pours
    into the blood.


    This happens not only through the night but also during the day. It continues
    after you eat your breakfast. Instead of glucose production stopping to make room
    for the incoming flood of glucose from meal carbohydrates, your body has to deal
    with a double whammy. Food is causing the glucose level to rise but your liver
    is cheerfully shovelling more into the blood at the same time.


    One other job of your liver after meals is to store glucose as glycogen. You will
    be relieved to know that your liver does this just'
