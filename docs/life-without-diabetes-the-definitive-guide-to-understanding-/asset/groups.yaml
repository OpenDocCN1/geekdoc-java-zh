    ## 5.6 Too much fat inside insulin-producing cells – in susceptible people – gradually
    causes them to stop making insulin normally. This is a reversible process in the
    early years of type 2 diabetes, but if it continues too long then it becomes irreversible.


    The fascinating story does not end there. Individuals with type 2 diabetes vary
    in their ability to withstand the metabolic onslaught of excess fat. Some people
    can still return to non-diabetic levels of blood glucose control after more than
    20 years of type 2 diabetes. Some seem to lose this capacity relatively rapidly.
    In other words, different people have differing levels of beta cell durability
    in the face of fat attack. Those people who were able to reverse their type 2
    diabetes after 24 years must have had susceptible, exceptionally durable beta
    cells. It looks very much as though there is a different set of genes that determines
    the durability of the beta cell. In years to come, we will no doubt see further
    developments on this front.


    But the bottom line for a person with type 2 diabetes of any duration is: currently,
    the only way to find out if it is possible to escape from diabetes is to lose
    a substantial amount of weight.


    ## Quick read


    - The Twin Cycle Hypothesis tied together the best available evidence about control
    of blood glucose

    - The predictions of the hypothesis were tested in a series of studies

    - Type 2 diabetes was shown to be initiated by too much glucose and fat being
    produced by the liver

    - The excess fat causes pancreatic beta cells to lose their special ability to
    make insulin

    - Defects in both the liver and pancreas can be corrected by substantial weight
    loss

    - The alleged murder never happened: when beta cells are prevented from making
    insulin they cannot be detected under the microscope but are still living


    ## 6


    ## The Personal Fat Threshold


    News items about type 2 diabetes are frequently accompanied by pictures of very
    large people, creating an impression that type 2 diabetes is caused by obesity.
    Even doctors sometimes state that the type 2 diabetes epidemic is ‘due to obesity’.
    This common assumption that if an individual has type 2 diabetes, they must be
    obese and it is all their own fault.


    But the truth is that vast majority of very heavy people do not have type 2 diabetes,
    and only half of all people developing the condition have a BMI in the obese range.

    Let’s have a reality check.


    ### Why have I got type 2 diabetes?


    René Laennec was the famous French doctor who invented the stethoscope. He used
    to say to his students: ‘Listen to your patients. They are giving you the diagnosis.’
    He was not talking about listening to the heart or lungs with his new invention.
    He was talking about the most important skill of a doctor — informed listening.
    Listening to the story a patient tells about why they have sought medical advice
    can lead to an understanding of the sort of disease that has caused their symptoms.
    It is the message still relevant today.


    When the results of our first study on reversing type 2 diabetes were reported
    by the newspapers and on television in 2011, we were inundated by emails from
    people with diabetes telling us about their condition, how long they had it, what
    complications they had experienced and whether it was well controlled. Many people
    just wanted to learn how they could get rid of their diabetes. But there was a
    substantial minority who emailed to say that they were not overweight but had
    still developed type 2 diabetes. Many doctors will be familiar with this phenomenon,
    and will be accustomed to their patients asking why this is the case: ‘Why I have
    got type 2 diabetes when my friends are all fatter than me and they don’t have
    it?’


    At first, this might seem to be at odds with the Twin Cycle Hypothesis described
    in Chapter 5. That starts off with the idea that eating more than the body requires
    over a long period of time is necessary for the condition to develop.


    For me, an early insight into what may be going on in type 2 diabetes had come
    some years earlier from a non-obese person who had the disease. Let’s call this
    person Mark. Mark was outraged that diabetes had happened to him, a person who
    was not obese – not even overweight – and had to come to see there was any way
    of getting rid of it. We performed blood tests, which showed that his liver was
    not as healthy as it should have been, and that caught my attention. All of this
    was before the Twin Cycle Hypothesis was developed, I already knew that in type
    2 diabetes, these particular tests were often round the upper border of normal
    – or a little high. I also knew, from our research, that there were high levels
    of fat in the liver in type 2 diabetes and that this caused the liver to make
    too much glucose.


    I therefore reasoned that the high levels of liver fat might be causing a problem,
    which was in turn leading to type 2 diabetes. If this was true, then we possibly
    had a plan of action. Why not suggest substantial weight loss as a possible way
    of getting rid of Mark’s liver fat and thereby potentially improving the control
    of his diabetes too? This unconventional advice was offered with no guarantees
    of success; it was just a possible way to return to health and, at best, fulfilled
    the criterion long ago by Hippocrates: ‘At do no harm’. But Mark was adamant that
    he wanted to get back to normal or as normal as he could and said he would try
    it.


    So ‘normal-weight’ Mark lost weight. His BMI went down 24 to just below 20. And
    the diabetes went away.


    Interestingly, it was not just the blood glucose first thing in the morning that
    normalized. It was also the level of blood glucose two hours after swallowing
    a test glucose drink. Clearly, something else was going on as well as the predicted
    liver changes. And that something was likely to be a change in the function of
    the pancreas. Which came as a bit of a surprise.


    Had Mark become abnormally thin? Not at all – for him. In fact, he had merely
    decreased his weight to what it was in the 20s. It seemed that he had accumulated
    more fat than he could store safely, and he had certainly been unable to cope
    with the amount of fat in his liver. That had brought about a situation that his
    body had not been able to manage. His weight had been too high for him – even
    though it was unremarkable compared with what was ‘normal’ for most people. The
    whole episode set me thinking about what was ‘normal’ for one person, and how
    this was not represented by the ‘normal’ range for the whole population.


    So, fast-forward to 2011, when the dramatic results of Counterpoint were published.
    As mentioned before, among the emails we received a fair number from people with
    type 2 diabetes with a normal BMI. Because of the good effect on Mark and the
    Counterpoint results, it seemed reasonable to provide the information that losing
    weight in such circumstances could rid of type 2 diabetes. In responding to medical
    questions by email, a doctor can only put forward information and not medical
    advice. It is essential not to get in the way of the person’s own doctor. We limited
    ourselves to providing this information and advising people to discuss it with
    their doctor or nurse.


    You may guess what happened next. We started to receive emails reporting return
    to normal glucose levels from this group of ‘normal-weight’ people. Many followed
    the recommendation to discuss the weight loss plan in advance with their doctor
    or nurse – and had been rebuffed. Don’t do it, they were told in uncertain terms,
    it is unhealthy to lose weight as their BMI is already in the normal range. But
    in most of these people the desire to escape from type 2 diabetes was so strong
    that they ignored this well-meaning advice. One of them was a journalist, and
    he wrote about his experience in the *Guardian* (see Bibliography). His article
    helped a considerable number of people.


    In many ways of life well as in medicine, limits are set for what is ‘normal’.
    But time and again during my scientific career, I have found that such limits
    can be too restrictive. There is really no one size that fits all. Perhaps as
    a society we need to shake off the shackles of ‘political correctness’. A ‘normal’
    BMI is defined as less than 25. But just look at your fellow beings in the street.
    We come in all shapes and sizes. What if those who do not look chubby on the outside
    actually have too much fat on the inside? To me, years ago when I first met Mark,
    this notion was not new. It previously been described by several names, including
    TOFI –

