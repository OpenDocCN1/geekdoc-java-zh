    Keeps refrigerated for 2-3 days. Alternatively, divide into portions once cooled
    and freeze for a quick and easy microwave dish during the week.


    ## Celeriac Bravas


    A lower-starch root vegetable replaces the potatoes in the traditional Spanish
    tapas dish, keeping the carbohydrate and calorie content down. Serve with a simple
    mixed-leaf salad as one of your vegetable dishes once or twice a week.


    Prep: 10 minutes; cook: 40 minutes; makes 4 servings


    INGREDIENTS

    - 1 large celeriac

    - Olive oil spray

    - Pre-made sofrito sauce (recipe on page 248)

    - Handful of fresh parsley, chopped

    - Mixed salad leaves to serve


    WHAT TO DO


    1. Preheat the oven to 200°C/gas mark 6.

    2. Using a large knife, slice the top and bottom off the celeriac so you have
    a flat surface.

    3. Stand it on a chopping board and use the knife to slice down around the edges,
    removing the skin and any gnarly bits.

    4. Chop it in half and then chop each into 1-2cm cubes.

    5. Spray a roasting tin with oil, add the celeriac cubes and then spray more oil
    over them so they are lightly coated.

    6. Roast on the top shelf of the oven for 40 minutes (turning halfway through
    ensure even cooking) or until golden and crispy.

    7. Take the roasting tray out of the oven and transfer the celeriac to a bowl
    to cool slightly.

    8. While it''s cooling, place a few spoonfuls of sofrito sauce in a glass bowl,
    cover with clingfilm and heat in the microwave for 2 minutes or until adequately
    heated, stirring halfway through.

    9. Divide the celeriac between 4 bowls and spoon the sauce over the top. Sprinkle
    with chopped fresh parsley.

    10. Serve with a handful of mixed leaves.


    ## Zoodle Arrabbiata


    Replicate a classic recipe using spiralised zucchini in place of the pasta, and
    your pre-made sofrito as the spicy sauce – just add some Italian herbs and you’re
    done! Spiralisers are now widely available online or in supermarkets and home
    stores.


    As a simple alternative, just cook the zucchini and stir it into a teaspoon of
    pesto paste.


    Prep: 5 minutes; cook: 5 minutes; 2 servings per large zucchini


    INGREDIENTS

    - 1 whole zucchini, ends chopped off

    - 1 teaspoon extra-virgin olive oil

    - Pre-made sofrito sauce (recipe on page 248) – add ½ chilli flakes to spice things
    up

    - 1 teaspoon dried oregano

    - Handful of fresh basil leaves, roughly chopped, and some more to garnish


    WHAT TO DO


    1. Use the spiraliser to shred the zucchini into ‘zoodle’ spirals.

    2. Place the oil in a frying pan over a medium heat.

    3. Spoon 2 portions of sofrito into a microwaveable bowl and add the oregano,
    fresh basil and chilli flakes. Heat on a couple of minutes, stirring part-way
    through.

    4. While the sauce is in the microwave, add the zoodles to the pan and stir-fry
    for about 5 minutes, until soft.

    5. Stir the sauce into the zoodles, scatter some basil leaves on top and finish
    with a grinding of black pepper.


    ## Cauliflower Rice


    A portion of cauliflower ''rice'' is carb-free and can accompany other veg ingredients
    in a variety of dishes where rice would usually be used. Here''s how to make the
    rice itself.


    INGREDIENTS

    - 1 large cauliflower, leaves removed

    - Squeeze of lemon juice

    - Salt and pepper

    - Herbs or spices of your choice (optional)


    WHAT TO DO


    1. Cut the cauliflower into quarters and remove most of the tough core. Chop each
    quarter into 4 smaller chunks. Blitz a few pieces at a time in a food processor
    until it resembles rice or couscous grains. If you don''t have a food processor
    you could use the coarse side of a grater instead.

    2. Add the lemon juice and season with a little salt and pepper. Adding spices,
    such as cumin, chilli or coriander, or dried herbs, such as thyme or oregano,
    before cooking gives this neutral dish a more aromatic flavour.

    3. It can now be cooked in a few minutes by either microwaving in a large bowl
    covered with clingfilm for 3 minutes on high (4 minutes frozen) – be careful of
    steam when removing clingfilm! – or roasting in the oven, which gives a drier
    texture and nought flavour, but takes a few minutes longer. To do this, mix a
    teaspoon of olive oil into the chilli, spread it in a single layer on a baking
    tray and place in the centre of a preheated oven at 200°C/gas mark 6 for 12 minutes.
    Stir halfway through to ensure even cooking.

    4. Divide your cooked cauli rice into 100g portions. These can be kept in the
    fridge for 3 days, or in the freezer for 2 months and reheated in the microwave
    or oven from frozen.


    The following 3 recipes are ideas for using the cauli rice in your daily vegetable
    meals.


    ## Cauliflower Tabbouleh


    Traditionally, tabbouleh is made using bulgur wheat, but replacing this with cauliflower
    makes a super-fresh all-veg version. It should be bright green with the flakes
    of white ''rice'' barely visible, so don''t be sparing with the herbs!


    Prep: 20 minutes; makes 4 servings


    INGREDIENTS

    - 2 x 100g portions of your pre-made cauliflower rice, defrosted if frozen

    - Juice of 1 lemon

    - Leaves from 2 long stems of fresh mint

    - A large bunch of flat-leaf parsley, stalks removed (you should have about 10
    times as much parsley as mint)

    - 8 spring onions, finely sliced

    - 1 garlic clove, minced, (or use garlic paste for ease)

    - 2 large tomatoes, sliced and finely diced

    - 1 tablespoon extra-virgin olive oil

    - Salt and black pepper

    - Little gem lettuce


    WHAT TO DO


    1. Add the lemon juice to the cauliflower rice.

    2. Put the mint, parsley, garlic and spring onions into a food processor or mini
    chopper and whizz for a few seconds to give a vivid green mixture (this can be
    done with a knife and chopping board instead).

    3. Stir the herb mix into the cauliflower rice, add the tomatoes and olive oil,
    season with salt and pepper, and then give it a good mix with a large spoon.

    4. Serve each portion of tabbouleh with a few gem lettuce leaves which to scoop
    it up.


    ## Harissa Stuffed Red Capsicum


    Use your cauliflower rice as a filling and give it a Middle Eastern twist with
    the addition of harissa paste, made from chillies and widely available ready in
    a jar. Harissa varies a lot in spiciness, from mild to very hot, so experiment
    the amount you use to suit your taste. This dish can be served hot straight from
    the oven or kept in the fridge for lunch.


    Prep: 10 minutes; cook: 20-25 minutes; makes 2 servings


    INGREDIENTS

    - 2 medium-large red capsicum

    - 2 x 100g portions of pre-made cauliflower rice, defrosted if frozen

    - 2 spring onions, finely sliced

    - Squeeze of lemon juice

    - 1 tablespoon harissa paste (adjust amount depending on preference)

    - Bunch of chopped flat-leaf parsley garnish


    WHAT TO DO


    1. Preheat the oven to 180°C/gas mark 4.

    2. Slice each pepper in half vertically. Remove the stalks and seeds and discard
    them.

    3. Place the peppers on a microwave plate and cook on high for around 5 minutes
    until softened.

    4. Mix the harissa paste and spring onions into the cauliflower rice in a bowl.
    Add a squeeze of lemon juice.

    5. Stuff each pepper half with the cauli rice.

    6. Place on a baking tray lined with parchment.

    7. Bake in the centre of the oven for 15-20 minutes.


    It Is possible to make the whole dish in the microwave. Once the peppers are stuffed,
    place the plate back in the microwave and cook on high for a further 8-10 minutes.
    Oven cooking chars the edges nicely, adding flavour and texture, which you won''t
    get from the microwave.


    ## Simple Grilled Eggplant


    Eggplants have a firmer, meatier texture when cooked whole rather than chopped
    up. Delicious when simply combined with garlic and olive oil, surprisingly filling.


    Prep: 2 minutes; cook: 10-15 minutes; serves 1 or more


    INGREDIENTS

    - 1 small eggplant per person

    - 1 garlic clove, cut in half

    - Drizzle of olive oil

    - Salt and pepper

    - Salad leaves and lemon juice to serve


    WHAT TO DO


    1. Preheat the grill to medium.

    2. Using a sharp knife, hold the eggplant stalk and make 4 slits at even intervals,
    lengthways, just deep enough to pierce the skin.

    3. Place the eggplant under the grill, turning it as the skin starts to char and
    darken. Rotate it round, and repeat until all sides are slightly charred, 10-15
    minutes.

    4. Remove from the grill and allow to cool slightly before removing the skin.
    It should come easily.

    5. Slice the eggplant in half lengthways and place on a plate.

    6. Rub the surface of each eggplant half with the garlic, and drizzle over a teaspoon
    of olive oil.

    7. Season with salt and pepper. Serve with some salad leaves and a squeeze of
    lemon juice.

