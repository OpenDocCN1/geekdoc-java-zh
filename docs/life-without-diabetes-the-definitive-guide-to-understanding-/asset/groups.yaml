    # Pesto Crusted Cod with Roasted Mediterranean Vegetables


    Prep: 15 minutes; cook: 45 minutes; makes 2 servings


    # INGREDIENTS


    +   For the pesto crusted cod:

    2 cod (or other white fish) fillets

    2 tablespoons basil pesto

    2 slices granary bread*, crusts removed

    Juice of ½ lemon


    +   For the roasted Mediterranean veg:

    1 tablespoon olive oil

    Mixture of vegetables cut into large chunks – red onions, zucchinis, capsicum
    and cherry tomatoes work well

    Fresh or dried thyme

    Salt and pepper


    +   WHAT TO DO

    1. Preheat the oven to 200°C/gas mark 6.

    2. Pat the fish fillets dry with kitchen roll and set aside.

    3. Place the veg in a bowl, with the olive oil and thyme and mix well.

    4. Spread the veg out on a baking tray and bake on the middle shelf of the oven
    for 20-30 minutes.

    5. Blitz the bread in a food processor to make breadcrumbs, add the pesto and
    lemon juice and pulse everything is well combined.

    6. Season each fish fillet with salt and pepper, then coat them with the pesto
    mixture.

    7. Bake them in a greased ovenproof dish for 11 minutes.

    8. Remove the dish from the oven and place under a medium grill for about 4 minutes,
    until the crust is nicely browned. Serve the fish with the roasted veg on the
    side.


    > *Granary bread is made from brown flour with malted wheat grains added for a
    nutty flavour.'
