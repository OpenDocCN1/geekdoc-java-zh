    > ''I was frazzled I went up to the desk and there was some chocolates in front
    of us [me] and I was so tempted to have one but I walked away from them, although
    I had to say I walked up to the tin and lifted the lid three times but each time
    I just walked away from it because I thought no, because that would have felt
    like I had given in and I didn''t want to do that.'' (Woman, aged 35, one and
    a half years since diagnosis.)


    ## Why might previous weight loss attempts have failed?


    In the Counterbalance and DiRECT studies, a team of psychologists led by Professor
    Falko Sniehotta interviewed the participants to find out what contributed to their
    success in keeping their weight steady, and also what had been the main barriers
    to success. Prior to joining the study, many participants had tried and failed
    to lose weight and keep it off. One of the main reasons for this was the slow
    rate of their weight loss; over a prolonged period of trying to adhere to a regime
    boredom had set in. Or social habits around food were difficult to change. On
    their previous diets, some people had experienced nagging hunger, and had actively
    disliked the extent of the food restriction necessary to continue losing weight.
    By contrast, most participants viewed the 1,2,3 approach favourably in general,
    both for its speed and because they had felt so well during the low-calorie phase.
    They also said that ongoing support from their general-practice nurse or dietitian
    was useful in prompting action if they weight started to edge upwards.


    The longer follow-up, still ongoing in DiRECT, is showing that their weight regain
    remains a challenge. There are no easy answers. The general advice above is the
    best we can do at present. Stick with it!


    ## Why lose weight rapidly?


    If food intake is decreased to around 800 calories per day for a two-month period,
    there are several advantages. Once underway, you are unlikely to feel very hungry.
    This is possibly a survival mechanism that evolved during our hunter-gatherer
    millennia. It would have been difficult to hunt successfully if all you could
    think about was being ravenously hungry. A second major advantage is that you
    start feeling so much better within a short period of time that you will want
    to keep going. You will find moving around more easily; you sleep much more soundly.
    You will start feeling more energetic.


    In the first week of a 700-800 calorie diet, the average weight is 3.5kg. During
    the whole eight weeks it is just over 15kg. This might sound rather alarming:
    is it healthy to cut so much on eating? Sudden weight loss is usually thought
    of as an indicator of serious disease. But the hard evidence is that for anyone
    who has increased their weight during adult life, or has always been overweight,
    losing the extra weight and then eating less long term is of huge benefit to health.
    In our overfed society, fasting is not usually dangerous, but eating is.


    As mentioned above, if you opt for total food replacement using a liquid product
    to lose weight, there are some additional advantages. The first is that it is
    easy to have a high proportion of protein at each meal, and this helps to control
    hunger. The second is that there are no difficult choices about what and how much
    to eat. Freeing yourself from the cumulative burden of decisions, decisions, decisions
    makes weight loss genuinely easier.


    You don''t have to lose weight fast to reverse your diabetes, but for most people
    it''s the easiest way of losing the requisite number of kilos. Overall, the 1,2,3
    approach works because the defined goals of each stage are humanly possible, and
    the early wins increase motivation to succeed.


    ## Strategies for behaviour regulation


    A lot of what we do from day to day is subconscious. Our actions are determined
    to a large extent by habit and social conformity, and it is worth trying to identify
    particular influences that might be modifiable. In Newcastle, Professor Sniehotta
    and his team have identified some potentially useful strategies to consider:


    - Avoidance. Identify situations of maximum pressure to conform to social eating.

    - Distraction. Have your own list of things that you need to do. Mending, fixing,
    phoning – all the things that may be difficult to pull at the critical moment,
    but can be remembered and listed from time to time. Add to the to-list: ‘Write
    to MP to remind him/her of the importance of legislation to restrain commercially
    driven excess calorie provision’.

    - Drinking water. Tap water is inexpensive. Keep a large jug in the fridge. Drinking
    a pint of water fills the stomach and also occupies the mind during moments of
    temptation. Have fizzy water for a change. Flavoured waters with zero calories
    are also an option to have in the fridge.

    - Removing the wrong sort of food from your environment. Your cupboards will ideally
    be a biscuit-, crisp-, cake- and chocolate-free zone.

    - Reminding yourself of your goals. Write down why you wanted to escape from diabetes
    in the first place. This can be a few words on the first page of your diary or
    on your phone. Read it every now and then. The reasons why you started out on
    this programme to blur and fade with time: 1. Wanting not to suffer like Dad;
    2. Wanting not to have the tummy upset from those tablets; 3. Wanting not to worry
    about eyesight or heart; 4. Feeling generally unhealthy. Your reasons will be
    just as valid years later – if you only could remember them.

    - Social disclosure. Your family will already be aware of why they should not
    offer you biscuits with your coffee. Hopefully, you can be entirely open with
    colleagues and friends about your aim to stay healthy by minimizing the chronic
    food poisoning. It is true, not everyone is susceptible to this food as you have
    found out that. Your explanations should not be seen as preaching to all – but
    everyone can benefit from knowing that body weight should not rise during adult
    life.


    ## Frequently asked questions


    ### Is the speed of weight loss important?


    It is important only in fast weight loss makes losing 15kg(2st 5lb) easier for
    most people. The effect of removing fat from the liver and then the pancreas is
    the same whether weight loss happens over two months or a year. The simple biology
    of type 2 diabetes speaks for itself: get the excess fat out of the pancreas and
    the insulin production starts up again (as long as the beta cells have not been
    damaged for too long).


    ### I have been told I have pre-diabetes. What should I do?


    Get started on the 1,2,3. By losing approximately 10kg (or 10% of your weight
    if you are less than 80kg) you will almost certainly take yourself out of this
    category and transform your chances of remaining healthy long term.


    ### Can I use a milk diet?


    Ideally, you will use the liquid formula packets that provide complete nutrition.
    But if there is some reason why this is not feasible, then yes, a milk-based diet
    (2 litres of semi-skimmed milk per day) is both inexpensive and feasible. It will
    be important to take a multivitamin daily and to eat some non-starchy vegetables
    – to provide some roughage and to chew on.


    ### Can I really not drink alcohol during Step 1?


    No, because alcohol is effectively liquid fat, as explained in Chapter 2. However,
    one of our most successful research participants insisted on having a glass of
    wine every Friday. It was sipped very slowly and not refilled. The acid test is
    whether you are achieving adequate weight loss. So, provided that you lose around
    3.5kg in the first week and around 1.5kg each week after that, a glass of wine
    per week may be fine. Beer would be problematic, given that it is so full of calories
    (around 200 in one pint!).


    ### Why do I feel cold?


    Some people feel cold all the time while losing weight. A common misconception
    is that this is due to the thinning of the insulating layer of fat under the skin
    – a most unlikely explanation since coldness tends to come on soon after starting
    to lose weight. Feeling cold is more likely to be caused by the smaller amounts
    of heat generated by the body when deprived of calories. The only thing you can
    do is wrap up warmly (thermal vest?) and accept it as a better option than being
    too heavy and sweaty.


    ### Will my thinning hair regrowth?


    This is unusual, but the answer is yes – providing that is due to the sudden change
    in nutrition. A few people notice hair loss after weight loss. In fact, under
    any unusual circumstance (exams, pregnancy, family illness) the growth cycle of
    hair follicles tends to become synchronised, which means that instead of losing
    the normal 70 hairs per day as they come to the end of their growth cycle and
    fall out, several hundred fall out every day for a short time. But don’t worry
    – they will all grow back over a few months.


    ### How can I fix my constipation?


    There are people who, despite chomping through a large plate of lettuce, celery,
    peppers and tomatoes every single day, find that they are still constipated while
    dieting. What to do? The simplest thing is to ask your own doctor to prescribe
    a medicine that will bulk up your bowel movements.


