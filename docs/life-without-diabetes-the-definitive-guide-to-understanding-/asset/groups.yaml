    # 《没有糖尿病的生活》好誉


    “罗伊·泰勒和纽卡斯尔大学的团队不仅破解了导致2型糖尿病这一时代最大健康问题的谜秘，还向世界展示了如何消除它。这是一本极棒的书，可以帮助许多人。”


    迈克尔·莫斯利博士（Dr Michael Mosley），畅销书《快速800饮食法》、《聪明肠道饮食》和《8周血糖饮食法》的作者


    “泰勒教授在研究‘某些人能够使2型糖尿病缓解’这一概念时表现出的非凡毅力，正在改变我们思考和治疗这种普遍疾病的方式。”


    伊莉莎白·罗伯逊（Elizabeth Robertson），英国糖尿病协会（Diabetes UK）研究总监


    “2012年我罗伊时，我有2型糖尿病——他向我展示了另一种方法。现在我的血糖正常，糖尿病已成为过去。”


    戴夫·迈尔斯（Dave Myers），毛发机车手（Hairy Biker）


    “引人入胜，信息量丰富，在当今世界非常重要。对于任何2型糖尿病患者来说，这都不用想；遵循罗伊的路线图并逆转它。如果你还没有得2型糖尿病——请避免它。”


    吉米·尼尔（Jimmy Nail），演员兼音乐家


