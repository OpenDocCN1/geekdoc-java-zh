    Holding up a mirror to today’s population, anyone can see that the way fat is
    distributed on people’s bodies varies hugely. Some people have big stomachs whereas
    others have large legs and buttocks. We now know, thanks to research carried out
    by a group of scientists at Cambridge University, that the maximum capacity of
    your own fat layer is determined by many genes, which each have a bearing; but
    that, apart from rare conditions such as lipodystrophy, there is no single ‘fat’
    gene in the general population determining how much fat a person can store under
    the skin. Of course, how much you have stored depends on how much you have eaten,
    and how much energy you have burned in daily activity – over a long period of
    time. We are very poor at conceptualising time, whether it be geological time
    or the long periods over which tiny influences can produce major weight gain.


    If, in the lottery that allocated your genes to you, your safe deposit for fat
    is rather limited, then you do not need to put on too much weight before fat has
    to build up elsewhere. And this, as we know from the Twin Cycle Hypothesis, is
    why people will develop type 2 diabetes without being very heavy.


    All of this can be distilled into one profoundly important fact: if an individual
    develops type 2 diabetes, they have become too heavy for their own body.


    ## Too heavy for their own body


    Samuel Johnson had a neat way with words and was a keen observer of people. Around
    1790, he said: ‘If a man is too fat it is plain for all to see that he has eaten
    more than he should have done.’


    Note that he did not say that the person had ‘eaten too much’. There was a subtlety
    that he recognised in implying that different individuals required different amounts
    of food. Now perhaps we can stand on the shoulders of giants and put together
    a succinct phrase about type 2 diabetes:


    If a person has type 2 diabetes, they have become too heavy for their own body.


    ## Testing the hypothesis of a Personal Fat Threshold


    The information from UKPDS was very helpful in supporting the Personal Fat Threshold
    concept. But it was another study – directed at type 2 diabetes – that provided
    crucial further substantiation.


    The Nurses’ Health Study is the world’s largest, longest-running study of women’s
    health. Set up in 1976 by a group of scientists at Harvard in the US, it has conducted
    a long-term follow-up of the impact of lifestyle factors on the health of half
    a million young nurses – chosen, it should be said, not in order to study the
    risk factors of going into nursing as a career, but because nurses were thought
    likely to be able to provide accurate data.


    With its regular follow-up of participants and repeated assessment of health and
    lifestyle factors, the study has played an instrumental role in shaping public
    health recommendations across the Western world. It helped uncover, for example,
    early links between cigarette smoking and both heart disease and cancer; postmenopausal
    obesity and breast cancer; and shed light on all sorts of other factors to do
    with health.


    My interest was in weight gain, or in the fat threshold at which one might develop
    type 2 diabetes. And what the study showed: those who stayed close to their youthful
    weight over several decades – i.e. remained with a BMI of 22 – were likely to
    remain free of diabetes; but those who had increased their BMI even slightly –
    between 23 and 25 – were much more likely to have developed the condition. This
    was no small increase in risk. The women whose weight had increased within the
    normal BMI range had four times greater chance of developing type 2 diabetes compared
    to those whose BMI stayed less than 22.


    To put this in context, big studies on large populations may show increased risk
    of, say, 15%. That often leads to exhortations to change your behaviour or avoid
    certain foods. It is said to be ‘statistically significant’. But actually, an
    increased risk of 15% is only equivalent to a tiny change in your real risk. For
    instance, if you have a 1 in 10 chance of developing type 2 diabetes in the next
    10 years and your risk increased by 15%, that would put your risk up to 1.15 in
    10. Anyone familiar with betting odds say, ‘So you are telling me that my risk
    changes from 1 in 10 to about 1 in 10?’ At the individual level it is not significant.
    On the other hand, the increase of four times means that your risk would rise
    to a 4 in 10 chance of getting type 2 diabetes, and for you that is a considerable
    increase in risk.


    So, if these women who used to be young, healthy and slim put on just a little
    weight, the level of risk of having type 2 diabetes increased considerably. Of
    course, if they put on even more weight, the risk went up much more. The study
    brilliantly shows how some individuals have a low threshold for tolerating excess
    fat.


    We know when a whole population becomes heavier, as is happening in many countries
    today, the overall effect is that the number of people developing type 2 diabetes
    increases. More people will have crossed their Personal Fat Threshold. Extrapolation
    of population trends to individuals has led to a widespread belief that a person''s
    weight should be a good guide to whether or not they may have the disease. Having
    reached this point in the chapter you know that people of ‘normal’ weight may
    develop type 2 diabetes.


    Beware population statistics. Often-quoted figures on the risk of developing type
    2 diabetes, such as ‘if BMI is greater than 30’, are irrelevant to an individual
    who has developed the condition. We shall return to discuss risk factors in Chapter
    9.


    ## Susceptibility to type 2 diabetes


    The Personal Fat Threshold explains why individuals may get type 2 diabetes at
    any level of BMI. But what does it look like if we examine the other half of the
    coin? How about very obese people who do not get type 2 diabetes?


    In fact, the vast majority of very obese people do not have type 2 diabetes. The
    results of three large surveys throughout the US showed that 72% of people with
    a BMI over 45 did not have diabetes. However, very obese people clearly have excess
    fat on board, and it is known that they tend to have fatty livers. Our recent
    research in the Magnetic Resonance Centre in Newcastle shows clearly that the
    excess fat does not produce type 2 diabetes in everyone. It merely sets in the
    mechanism for excess fat to be produced by the liver and to the rest of the body,
    ensuring delivery of this potentially toxic stuff to the pancreas.


    But there is a critical yes/no switch for diabetes. Anyone developing type 2 diabetes
    is susceptible to the disease. That is obvious. Also, they must have beta cells
    that are susceptible to the adverse effects of fat. But not everyone has this
    susceptibility. For a long time, we have known that most human genes linked to
    type 2 diabetes are something to do with the pancreas. Now we have a big clue
    that at least some of them determine whether you will or not get diabetes if fat
    builds up there.


