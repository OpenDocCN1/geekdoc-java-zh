    Glucose that cannot be stored as glycogen has to find another home. And the only
    way the body has of dealing with it is to transform it into fat. This process
    happens in the liver. The newly formed fat can either provide energy for the liver
    if needed, or be sent elsewhere in the body. However, if the energy is not needed
    in a 24-hour period, the levels stored there will gradually increase. Eat too
    much fat or carbohydrate, and fat will accumulate in the liver.


    # # Overspill of glucose into fat


    The body can cope fine if you eat too much carbohydrate – in the short term. When
    the glycogen stores are full, the excess glucose has to be stored elsewhere. This
    is the key to understanding why surplus carbohydrate and fat share the same fate.
    Our bodies have only one way of handling this excess – it has to be transformed
    into fat.


    That process – of transforming glucose into fat – happens only in the liver. But
    if this newly formed fat is not needed to burn for energy, then levels of fat
    stored in the liver will gradually increase. This process is of central importance
    for the development of type 2 diabetes, as will become clear.


    # # Where do you store your fat?


    It is no understatement to say that our ability to store energy as fat is the
    secret to our survival. If shipwrecked on a desert island, the average person
    can survive for many weeks without any food at all. The first body draws on glycogen
    – although this is a minor player as those stores will be exhausted after about
    48 hours. Then, if there are still no ships on the horizon, it will turn to the
    fat stores. Body fat can provide us with all the energy we need for life for weeks.


    The long string of carbon atoms that makes a fat molecule holds lots of energy.
    In every gram of fat, nine calories are locked up. A pound of fat contains just
    over 4000 calories (or a kilogram 9000 calories).


    It is just the same for the fat in food, which is fatty foods are also high-calorie
    foods. For fat in your body, the high-calorie content means efficient storage
    of energy.'
