    简单来说，你摄入的碳化合物和脂肪的比例远没有总总量重要，因为被认为“健康”的碳化合物可能会被你的身体转化为不良的饱和脂肪。如果你的体重在增加，这些不良的脂肪可能会留下来并大作祟。另一方面，如果你在成年生活中体重一直保持稳定，那么无论食物构成如何，你可能都为自己的健康做得很很好。


    另一个警告：对于热量相当的食物，如果脂肪百分比很低，那么碳化合物的比例可能就会很高。被推崇为健康的低脂食品实际上含有更多的糖分或碳化合物，从而增加了身体中饱和脂肪的负担。超市货架上摆满了“低脂”产品，很少有人会阅读标签来发现这些产品中的脂肪到底被什么取代了。通常情况下是某种形式的碳化合物——而这种做法的明智性非常值得怀疑。


    ## 3. 早餐的重要性


    每年都会发表大量关于早餐重要性的研究报告，通常发表在知名度不高的科学期刊上，但在媒体上被大肆吹捧。大多数研究显示，吃早餐的人往往比不吃早餐的人更瘦。同样，这是一种相关性，而不是因果关系的证明。这与证明“胖人如果吃早餐就会变瘦”完全不同。让我们仔细看看这些研究是如何设计的，以及它们实际上显示了什么。


    意不意外的是，这些研究通常是由早餐麦片行业资助的，而且通常采用类似的花招。“早餐”可以被定义为每天早上出门前吃的一顿饭。生活方式比较混乱的人倾向于不在家里吃，而是选择在早上甚至在上班路上吃快餐（饼干、甜甜圈、薯片、汉堡）。这些快餐或零食通常是高热量密集的，并且不能让饱腹感维持多久。它们还倾向于强化在坐着用餐的时间之间吃零食的习惯，而我们知道零食可能与体重增加有关。通过限制对“早餐”的定义，就创造了体重重与跳过早餐之间的相关性。药效生效了：产生了一种统计学上的倾向，即体重重的人倾向于在路中吃早餐而不是出门前吃。


    “早餐是一天中最重要的一餐”这一口号纯粹是商业虚构，但它已被转化为“健康饮食”。这种观念已经根根：定期吃早餐对每个人来说都是必须的。


    有些人更倾向于在醒来后只喝杯咖啡，早上不坐下来吃；结果，设计良好的研究显示，他们通过避免不必要的早餐时间用餐，降低了每日热量摄入。然而，对于那些不吃早餐就无法运转的人来说，他们在出门前确实吃点东西要好得多。也许是一个煮蛋？


    人是个性的，而吃早餐是强制性的神话应该被扫入历史。黄金法则仍然是——不要在两餐之间吃东西。


    有些人是自己发现这一点的特伦斯·基利（Terence Keeley）的书《早餐是一顿危险的餐》（Breakfast Is a Dangerous Meal）中包含了对个人发现之旅的迷人描述。


    ## 4. 健康的肠道菌群改善代谢


    十多年前，有人建议我们低肠中大量的细菌可能会产生影响我们代谢的化学物质。这是一个有趣的概念，而且显然是可以测试的。每个人都在等待明确的研究来证明这些微生物有多大的影响。年年流逝。即使在写本文时，也没有证据表明人体中存在这种因果关系。缺乏效果的证据开始出现。但这种信念依然存在。


    意不意外的是，改变摄入食物的类型可以允许某些类型的故障菌滋生。大幅减少摄入食物的数量可以改变肠道内细菌的比例——当然，血糖控制得到了改善。然而，这仍然是与血糖控制的相关性，而不是因果关系，因为减轻体重从许多方面深刻地改变了代谢，同时也让不同的细菌能够在肠道中生存。当进行研究向肠道中添加所谓的“益生”细菌时，并没有看到对血糖控制有任何用处。


    关于最可能对身体产生影响的细菌，很少讨论——即那些生活在粘液层、紧贴肠道壁细胞的细菌。这些细菌确实会随着肠道内容物冲走，在粪便中几乎不存在。一个例子是引起胃溃疡的螺旋杆菌。但在大多数关于肠道内“微生物”的研究中，统计的是混合在粪便中的、远离身体本身的细菌。如果我们粪便中的局部友善细菌对代谢有任何影响，这种影响可能很微小。


    我得出这个结论会错吗？一位医学教授每天都要这样问自己。知识很少是非黑即白的。显示肠道细菌影响代谢健康的具体证据可能触手可及——但目前看起来非常不可能。


    ## 5. 每天五份蔬菜


    这个短语听起来很有道理。当然，多吃水果和蔬菜必须提高健康。它被视为一种提高国家健康的低成本政策。它已成为关于“健康饮食”最被接受的信念之一。


    一个早晨，我被收音机新闻吵醒。关于“每天五份蔬菜”的主要研究没有益处的消息并没有让我感到惊讶，也没有加速我的醒来。但随后采访了一位“专家”，他立即说是数字错了，人们可能需要每天吃10份。随着意识逐渐浮现，我隐约地意识到实际上是4月1日。所以我假设这会是一个愚人节。事实并非如此。那些努力获取知识框架的专家们往往是最后才发现问题的人。


    改变摄入食物类型可以允许某些故障菌生长。专家们很难发现基本的错误已经渗入。这些观念根深蒂固。


    关于“每天五份”活动如何改变食物摄入的客观信息。国家食品调查记录了每年每种食物的食用量。自从“每天五份”以来，卷心菜的量并没有增加。真意外！其他水果蔬菜的量也完全没有。增加的是果汁和奶昔。“这算作你五份中的之一。”咨询机构在将这些高热量食物排除在口号之外方面异常缓慢。


    这个想法作为一种解决方案出现。横断面研究清楚显示水果蔬菜摄入与较差健康结果有关。这似乎是一个显而易见的问题。然后进行了一些干预研究，衡量改为“每天五份”后健康改善有多大。设计良好的干预研究（据我所知）未能显示显著益处。例如，在一个荟萃分析中，18份横断面研究中只有三份显示与心脏病或中风有关，但轻微的相关性使其得出结论，认为每天五份有明确益处。这种概念有一个根本性的缺陷。它假设水果蔬菜份具有益健康的属性。抗氧化剂和微量元素被提到但缺乏证据支持。尽管所有营养专家都可能同意吃水果蔬菜对多样化饮食模式非常有益，但“每天五份”的口号尚未证明能改善健康。


    看起来最可能的情况不是摄入定量的蔬菜或水果，而是用蔬菜或水果代替更多的热量食物。在横断面研究中观察到的健康关联可能出现在那些摄入总量较少但比例相对较高的人身上。仅仅增加蔬菜或水果不太可能增加健康，因为高热量食物的摄入仍在持续。另一方面，不吃蛋糕而是吃一个苹果可能会改善大多数人的健康。与其多吃土豆，不如多吃大葱？


    对最佳可能信息的澄清不应理解为蔬菜不是大多数人的总目标。也许这个口号可以很好地重新表述为“替代五份”？

