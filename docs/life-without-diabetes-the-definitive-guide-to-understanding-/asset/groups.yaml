    # Mediterranean?


    The ‘Mediterranean’ diet has received considerable attention. It is the way of
    eating most often found to be superior in comparative studies, provided it is
    moderately low carb too. This pattern of eating is based on vegetables, olive
    oil and meats or cheeses. There are legions of recipe books on this topic. However,
    it does require more planning than just cutting back or missing out some foods.
    And the people you eat with regularly have to like it too. Otherwise, the problem
    of preparing ‘special foods’ for yourself rears its more complicated head. Busy
    lives need simple refuelling.


    # Intermittent fasting?


    Michael Mosley’s very readable books have popularised the ‘5:2’ diet – a regime
    that involves eating normally (but not excessively) on five days per week but
    minimally on the other two. Then, in order to keep weight steady following weight
