  - '[PAGE 139]


    maintain a 6:1 approach, in which, for example, every Wednesday would be a fasting
    day with minimal food. Although some people do find this easy to sustain, it is
    an approach that suits others – such as couples who follow it – very well indeed.


    One variation of intermittent fasting is to skip one meal every day. For those
    who do not want to eat breakfast, and are comfortable eating until lunchtime,
    this approach is ideal. There is no truth whatsoever in the catchphrase ‘breakfast
    is the most important meal of the day’ (see Chapter 9). Others may prefer to omit
    lunch.


    A further variation is ‘timed fasting’, where you eat all your day’s calories
    within a specific time window. You could start with eating nothing before 12 noon,
    normally in the morning and early evening and then nothing after 8pm at night.
    That would give you a ‘fasting’ window of 16 hours. But you could modify this
    to: eat nothing before 2pm? Eat nothing after 6pm? At present there is little
    scientific evidence to prove that intermittent keeps weight down in the long term,
    but if it suits you and your family or friends, go for it. Your weighing scale
    will tell you if it is working.


    # Low fat?


    A low-fat diet to lose weight sounds superficially so obvious. Fats are the most
    calorie-dense foods. Certainly, avoiding excessive fat is a good idea in general.
    However, fat improves the palatability of some foods, and if you remove too much
    of it you can end up with a dry rather mouthful. The major studies comparing different
    diets have shown that the low-fat approach is as good as any other in keeping
    weight down (with the study problem described above). But beware ‘low-fat’ foods
    that have added sugar to make them taste better. They may be highly caloric and
    will not satisfy your appetite for very long.


    There is only one way to find out if a particular way of eating is good for you.
    Suck it and see! You may really lock onto a low-carb approach. Great. You may
    lock onto an intermittent-fasting approach. Great. Discover what really suits
    you for long-term health and happiness.


    The key to success is finding a way of eating that you like and which keeps your
    weight steady. It must be sustainable for the long term.'
