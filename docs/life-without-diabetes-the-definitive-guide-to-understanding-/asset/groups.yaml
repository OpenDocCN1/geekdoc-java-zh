    years was 10%. People who start taking a statin have about a 25% reduction in
    risk. So the real risk to you would decrease by 25%. Your risk would actually
    drop from 10% to 7.5%. ''So, doc, if I don''t take the pills my risk is about
    1 in 10, and if I take the pills my risk is about 1 in 10?''


    But if your risk of having a heart attack in the next 10 years was 50%, using
    a statin drug could cause the same 25% risk reduction – then your actual risk
    of 50% will drop below 40%. That is probably worthwhile. In betting terms, changing
    the odds from a 1 in 2 chance to about 1 in 3 is pretty good. If 100 people with
    the same risk as you did not take a statin, then so would have a heart attack
    in 10 years. If a very similar group of people did take a statin, only 37 would
    have a heart attack,


    So, what matters to you is absolute risk. If you can change it to a worthwhile
    extent, then some action may be useful. If, for instance, a new treatment halved
    the chance of getting a disease, most people might want to take the tablets.


