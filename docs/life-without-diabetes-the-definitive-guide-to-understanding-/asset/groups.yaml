    Did you know that blueberries were a ''superfood''? I read it in a newspaper.
    The touchingly human wish to believe in food with powers is very potent. I’m afraid
    that, despite the hyperbole about vitamins and micronutrients, this is almost
    certainly another fib. The most likely explanation is that any survey, people
    eating blueberries would indeed be found to be more healthy than those who did
    not. Try and buy blueberries in the least-prosperous areas of town where, for
    a whole slew of reasons, are less healthy. There are none on sale. In the prosperous
    areas, people tend to behave in many ways that increase life expectancy. Also,
    there is a much greater variety of foodstuffs in their shops. The consumption
    of blueberries – along broccoli, pomegranate seeds, etc. – is just one of a range
    of behaviours that decrease the risk of disease. Do enjoy these delights if you
    like them. But so far, feeding blueberries to the people in the poorer parts of
    town has not been shown to improve their health.


    Longstanding wisdom about eating a range of foodstuffs is of course important.
    Superfoods are not.


    ## So what is a healthy diet?


    Given the most pressing health problems of today’s population, some very basic
    concepts should perhaps be rethought. Certainly, all that we have learned in the
    last 200 years about the minimum amount of vitamins, minerals and protein needed
    to avoid disease remains correct. And, for most people in relatively affluent
    societies, nutritional deficiencies are not a problem if a reasonable range of
    foodstuffs is eaten. Some foods are both calorie-dense and unsatisfying, and must
    be factored in. There is no magic to any food, and no food is ‘healthy’ in itself.
    The devil, as we have seen, is not primarily in the type of food but in the quantity.


    If Samuel Johnson were able to comment, perhaps in his pithy style, that a healthy
    diet could be defined as that which keeps your body weight stable throughout adult
    life.


    Quick read


    - The bigger study, the more chance that it could give misleading results

    - Look out for fibs – fallacies by associations

    - Look out for EFIs – evidence-free ideas

    - ‘Low fat is good for you’, and ‘eggs cause heart attacks’ are EFIs

    - 5-a-day really should be 5-instead-a-day

    - Breakfast is optional

    - Once an idea becomes widely believed, it is impervious to factual correction
    by careful research


