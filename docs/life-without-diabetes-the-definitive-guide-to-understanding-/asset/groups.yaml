    But metformin has only a modest effect on blood glucose control and after a while
    additional medication will be required. The cheaper options, such as gliclizide,
    glicclamide and gliquidone, all cause weight gain, as well as sudden dizziness
    if your glucose levels get too low (i.e. a hypo). Expensive options (e.g. pioglitazone)
    do not cause hypos, pile on the weight and may make your ankles swell. The most
    expensive newer options (gliptins or gliflozins) do neither of these things but
    have other side effects. For a proportion of people, having to take tablets is
    undesirable for very good reasons.


    Once you are taking two or three different tablets and your glucose levels are
    still uncontrolled, an injection may be recommended. Liraglutide and drugs like
    it are very different from insulin. Basically, what these drugs do is slow down
    the rate at which the stomach empties after a meal, thus preventing food, and
    particularly glucose, from getting into the body too fast. They also have the
    really useful effect of limiting the amount of food you eat, as your stomach feels
    sooner. Some people vomit or feel nauseous when they start this treatment – but
    don''t worry, it is only a side effect!


    And then there is insulin. In many people, insulin can improve the control of
    blood glucose modestly, but the devil is in the detail of a particular side effect
    – the hypos. You may find your blood glucose is pushed too low in an entirely
    unpredictable manner. This can cause all kinds of problems in day-to-day life–
    for instance when driving, climbing up ladders, or just postering around the kitchen.
    The driving implications are serious, and when you first go on insulin your driving
    licence has to be renewed every three years. If this was not bad enough, most
    people put on more weight after being started on insulin.


    ‘Treatment’ is another word that is open to interpretation. When a patient asks
    ‘Can my diabetes be treated, doctor?’ they want to know whether treatment can
    restore normality, as with antibiotics for an infection, or a plaster cast for
    a broken bone. But what the doctor tends to hear is ‘Are there guidelines on treatment
    with drugs for this condition?’ and so answers ‘Yes’. There are plenty of official
    guidelines. But neither the small effect of these making better, nor the likely
    reality of future problems gets much of a mention.


    The good news that type 2 diabetes can be ‘treated’ conveys the wrong message
    to many people and creates a false sense of security. This is exacerbated by the
    tendency of well-meaning official information sites to make light of the reality
    of the condition, emphasising that life can continue as normal with it. The uncomfortable
    truth is not stated – the main complications are only somewhat mitigated and that
    even the best conventional treatments do not eliminate the considerable risk of
    future health problems.


    ## I am not obese so why do I have type 2 diabetes?


    Contrary to popular opinion, type 2 diabetes actually has very little to do with
    obesity – although it does concern weight, and more specifically whether you are
    overweight *for you*.


    Today, the steadily increasing average weight means that there are of course more
    people who are very heavy or ''morbidly obese''. With media attention focusing
    upon this very serious condition in any discussion of weight, you would be forgiven
    for thinking it is the main problem. But in fact, the elephant in the room is
    not the number of very heavy people, who are just heavier than would be ideal.


    The trouble is that many people regard themselves as being of normal weight because
    they are similar to the majority of other people of the same age. But the word
    ''normal'' has a double meaning. The range typical of the population, they can
    be said to be ''normal''. But that is not necessarily healthy or ideal.


    Are you the same weight as when you were 25 years old? Just look at folk in the
    high street. People aged around 20 years tend to be slimmer than those aged around
    60 years. In Western society we gain half a kilogram a year through most of our
    adult life. This is not to do with ageing or hormones – it simply reflects the
    environment we live in. And that environment is setting up a time bomb. In the
    UK, even though people aged 20 tend to be slimmer than those aged 60, young people
    too are heavier than ever before, and one third start adult life for too heavy.
    As a group, it is certain they will get type 2 diabetes at a younger age than
    their parents. This time bomb deserves a book to itself.


    There is no biological reason why people need to put on weight during adult life.
    In societies where food is not a heavily promoted pastime, and it is necessary
    to walk or cycle for exercise body weight tends to remain much more stable as
    people age. But obviously, in the consumerist environment we inhabit in the developed
    world, where enticing, quick-fix, calorie-dense food is everywhere and heavily
    marketed, you actually have to be unusually disciplined (or just not that bothered
    by food) to avoid putting on weight.


    Societal perceptions are important in all this. And for much of my career as a
    doctor and academic I have been pondering these and how we might agree to change
    them. Perhaps TV and film producers could move towards avoiding the usual stereotypes?
    Certainly, this issue deserves wide discussion.


    ## Food for diabetes or diabetic food


    Part of the treatment for type 2 involves adjusting the kinds of foods eaten.
    In chemists’ and in supermarkets


    It is certainly true that what and how you eat can modify well you control your
    blood glucose. Guidelines are steadily changing towards the rational approach
    of avoiding high-sugar foods and too much carbohydrate, but information sources
    offer varying advice and few emphasise the central importance of limiting the
    total quantity of food. Magazines and newspapers frequently advise that choice
    is misleading.


    What do you eat? In everyday life, most people eat what their family or friends
    eat. It can be a challenge to change family habits but small adjustments can make
    a big difference. For instance, halving your portion of potato/rice and doubling
    your serving of vegetables would be good. There are plenty of ideas later in the
    book about how to set in better eating habits.


    ## Living with the immediate problems of type 2 diabetes


    If you found out about your diabetes after a visit to the doctor prompted by troublesome
    symptoms, then you will already know some of the problems the condition causes.


    When glucose levels get too high, glucose starts spilling into the urine. And,
    because glucose draws water along with it, this causes the kidneys to make more
    urine than usual. In people without diabetes, the kidneys keep all the glucose
    in the blood, and do not waste any of it in urine. As descendants of people who
    survived famine after famine over millennia, we have evolved to be energy-efficient.
    Losing energy obtained from food would be a problem. But when presented with an
    overwhelming amount of glucose, the poor old kidneys cannot cope. They have not
    evolved to deal with that.


    If you have diabetes, passing large volumes of urine will be all too familiar.
    If your diabetes is out of control – perhaps you''ve eaten too much or forgotten
    your tablets or injections – passing too much urine is a sure sign that blood
    glucose has become too high. It''s likely that you will have to get up in the
    night to go to the loo more often. Also, because water is being lost from the
    body, you will feel thirsty and find yourself wanting to drink a lot of fluids.
    This might have been one of the warning symptoms announcing the presence of your
    diabetes; however, because the threshold for spilling glucose into the urine varies
    so much between individuals, other problems may have occurred.


    For instance, you may feel generally out of sorts or tired. Of course, fatigue
    can be caused by many things, so if other symptoms have not occurred, a link with
    diabetes may not have immediately been made. But it is often the start of a catalogue
    of problems. Among the commonest problems leading to a diagnosis of diabetes are
    infections of the skin. Other life forms to feed on glucose, and they set up wherever
    easy pickings are to be had. Itiness and inflammation of the penis or vulva can
    result from candida infections. Any sort of bacterial infection is more likely
    when blood glucose levels are raised. Breaks in the skin – small cuts or trivial
    injuries – are prone to get infected, and urine infections are very common. This
    may sound like a depressing list – but that is not the worst of it.


    This section has described only the immediate consequences. If blood glucose levels
    are raised for years, then more serious term problems may start stacking up.

