    during the morning or even on the way to work. These fast foods or snacks are
    typically calorie-dense and do not satisfy the appetite for long. They also tend
    to reinforce the habit of eating between sit-down mealtimes and we know that snacking
    is likely to be associated with increasing weight. By limiting what counts as
