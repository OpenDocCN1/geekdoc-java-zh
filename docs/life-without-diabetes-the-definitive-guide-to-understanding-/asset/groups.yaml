    fine, even with your type 2 diabetes. This is because liver gets the hint that
    it needs to store glycogen whenever the blood glucose level rises. Liver cells
    have no barrier to glucose as it floods into them, and is then turned into glycogen.
    That is okay, but the liver can store only a relatively small amount of glucose
    as glycogen.


    ## Your muscle


    The earliest detectable clue that someone is likely to develop type 2 diabetes
    in the future is that their muscles are relatively resistant to insulin. That
    is to say, insulin, the master controller of the metabolism, cannot fully switch
    on the uptake of glucose in muscle. This will have been true from childhood. It
    is mainly determined by the mixture of genes you happen to inherit. The lack of
    a full response to insulin does not cause any immediate problems and most people
    are unaware of it. Their muscle will simply be more insulin-resistant than that
    of their friends who are not destined to develop type 2 diabetes.


    Chapter 3 describes what happens to the carbohydrate in meals, in a person with
    normal sensitivity to insulin in their muscle: after breakfast, the rise in blood
    insulin levels causes the muscles in the body to start taking up more glucose
    and storing it as glycogen. The muscle stores do a very important job in allowing
    safe storage of glucose to cope with the huge influx from each meal. That food
    energy is later on to other tissues. Muscle normally acts as a dynamic buffer,
    smoothing the swings in blood glucose that would otherwise happen. As all the
    muscle make it the largest organ in the body, this is important.


    But in those prone to type 2 diabetes, storage of glucose as glycogen in muscle
    is inadequate. The pie charts overleaf show the results of one of our very early
    studies applying magnetic resonance to try and understand type 2 diabetes. This
    study involved measuring the amount of glycogen in thick muscle before, and then
    at intervals after, breakfast before lunch. The chart in figure 4.2 shows the
    increase in glycogen stores in people who do not have muscle insulin resistance.
    But just look at what happens to the people who do. They are unable to store more
    than a tiny fraction of the meal carbohydrate as muscle glycogen.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_61_0.png)


    ## INSULIN RESISTANT


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_61_1.png)


    4.2 Where do you store your meal carbohydrate? Normally around one third is stored
    in muscle (upper panel). But if the muscles are insulin resistant then much less
    can be stored and the rest is turned into fat (lower panel).


    If the glucose is refused entry into muscle it has to stay in the blood. No wonder
    blood glucose shoots up after breakfast and usually stays high all day. But something
    has to be done, and as we know from Chapter 3, the only other way the body has
    of dealing with excess glucose is to turn it into fat. As the pie charts show,
    in people with insulin-sensitive muscles, only a minute proportion of the carbohydrate
    in a meal is turned into fat, but in people with insulin-resistant muscle, this
    rises to around a quarter.


    Being forced to make fat may seem a rather gloomy fate – particularly as you are
    stuck with the genes that determine your general level of muscle insulin resistance.
    But there is a clear message here: if a person keeps their weight healthy throughout
    adult life, there is no excess fuel hanging around day to day. Anything initially
    changed into fat will be used in that 24-hour period, tiding the body over to
    the following day. On the other hand, if not all the fat is used, it will slowly
    silt up in the body. Remember: no excess food, no food poisoning.


    There is another vital message: insulin resistance in muscle can be moderately
    improved by exercise. Over many years, this will have a considerable effect on
    health. Regular exercise is a great way to delay or prevent the onset of type
    2 diabetes, although once the damage has been done it is usually too little too
    late. The younger you are when you start, the greater the benefit over lifetime.
    You will share many of your genes with family members. So if you have type 2 diabetes,
    it is even more important than usual to set an example for your children, nieces,
    nephews or grandchildren. Get them in the habit of walking whenever possible,
    as well as cycling and playing outside.


    ## When did things start to go wrong?


    You may wonder when things started going out of kil and your type 2 diabetes began
    to develop. Just a few months ago? Last year?


    A remarkable story that followed people over a very long time was able to throw
    some light on the years leading up to the onset of type 2 diabetes. This was the
    Whitehall 2 study. It involved repeated blood tests on 6538 civil servants, and
    observed what happened over time. Eventually, of course, some people developed
    type 2 diabetes. In fact, over 500 people – around 1 in 10 – did so. And, because
    blood samples had been taken and stored every year, it was possible to find out
    how fast the blood glucose went up before diabetes was diagnosed.


    Even 13 years before diagnosis, blood glucose was raised – just a tiny bit. It
    then gradually increased that over almost a decade the average blood glucose had
    risen from 5.5 to 5.8mmol/l. This was still well within the normal range (of to
    6.1mmol/l). Then, especially in the 18 months before diagnosis of type 2 diabetes,
    things started moving more rapidly, with a sharp rise in blood glucose to an average
    of 7.4mmol/l by the time condition was confirmed. This is shown in the graph in
    figure 4.3.


    Keep in mind that this information is based on average data from a large group
    and reflects the average person''s path to type 2 diabetes. Your own path may
    be different. For example, if you put on a moderate amount of weight in your 20s
    and 30s, remained at a steady weight, type 2 diabetes coming on at age 60 may
    have been percolating away gently for 30 years. If, on the other hand, you remained
    at a steady weight between the ages of 20 and 55, then had piled on the weight,
    it is possible that your diabetes, also diagnosed at the age of 60, may have been
    rumbling for only four or five years. Remember that averages are only useful on
    average.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_63_0.png)


    4.3 Blood glucose before breakfast rises very slowly - it is usually over a decade
    before diabetes appears (solid line). There is then a relatively rapid rise in
    the couple of years leading to diabetes appearing. People who do not develop type
    2 keep steady, normal levels (dotted line).


    ## WOSCPS


    As acronym go, WOSCPS is one of the most memorable. It stands for ''The West of
    Scotland Prevention Study''. This study, published in 1995, was not designed to
    provide clues about how type 2 diabetes developed, but it managed to do that.
    (Its purpose was to test the effect of a statin drug in preventing heart attacks).


    No one with type 2 diabetes was included at the start of the study but during
    the course of the five years it was conducted, some people went on develop it.
    It is very common. It happened to around 1% of the whole group over the five years.


    During the study, blood samples were stored. After it had finished, my colleague
    Professor Naveed Sattar in Glasgow had the brilliant idea that these six-monthly
    blood samples could be put to good use. No one knew what detailed changes in the
    blood in the years leading up to type 2 diabetes. And what Prof Sattar could realise
    was, that at the end of the study participants could be divided into two groups
    – those who had developed type 2 diabetes and for comparison those who had not
    – the stored blood samples could show how the body had been changing before type
    2 diabetes was diagnosed. This information was published in 2008 and helped formulate
    my Twin Cycle Hypothesis, of which more in the next chapter.


    The graphs opposite show the results of two important blood tests over the 18
    months before diagnosis. Firstly, levels of fat in the blood were abnormally high
    in those on track to develop type 2 diabetes (almost 50% higher). Secondly, the
    ''ALT'' test, which is the best indicator of distress in the liver, was raised
    compared with levels in those who did not develop diabetes.

