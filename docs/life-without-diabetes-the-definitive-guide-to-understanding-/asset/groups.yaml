    当你尝试遵循严格的计划时，要考虑到如何应对。在开始之前，想清楚你会如何应对这类情况是一个好主意。


    ## 7. 行动起来！


    我们所有关于逆转2型糖尿病的研究工作都依赖于一种让所有参与者都能在规定时间内实现的减重方法——即通过低卡路里汤和奶昔的组合，将每日摄入量维持在每天800卡路左右（在我们的Counterpoint研究中，我们让志愿者在8周内每天坚持在700卡路左右，但在科学研究中，拥有一种统一、可重复且能被大多数人接受的改变方式是至关重要的）。但你并不是“大多数人”。你是一个个体，由于各种原因，你可能可以通过其他方式实现减重15公斤的目标。也许你对低卡路里饮料有想法，或者更倾向于自己做饭。这没关系，只要对你有效即可。


    从一开始你就需要规划长期的体重控制。而且，一旦你减掉了15公斤，在祝贺自己（以及你的支持者）之后，你必须准备好面对事实：你需要的食物比以前吃得要少。在实践中，这将是你习惯性装在盘子里并吃下的分量的四之三。记住，这是你余生的开始。而少吃是维持你崭新的、健康且相对匀称体型的唯一途径。从一开始就知道这一点是非常重要的。


    ## 1、2、3法


    在纽卡斯尔测试双循环假设（Twin Cycle Hypothesis）的早期研究中，我们必须想出一个简单、实用且有效的方法，让志愿者实现体重的巨大变化。首先，我设计了一个为期八周的低卡路里粉奶昔计划，以简单的方式提供完全营养，且准备工作最少。“完全营养”意味着该饮食提供了所有必要的蛋白质、矿物质和微量元素。


    每天尝试一份非淀粉蔬菜可以提供更多的纤维素。然而，在第一次尝试后，我们的研究志愿者告诉我们，他们在重新恢复正常饮食时遇到了困难。他们描述了在经过八周仅仅是选择哪种口味的粉冲水后，当尝试准备正餐时，他们不知所措，甚至感到恐慌。因此，我们设计了一个清晰的阶进式方法：首先，用一顿正常的食物（通常是晚餐）代替奶昔，至少持续两周；然后一周后，对午餐进行同样的操作。如果个人准备就绪，就可以恢复早餐。食物的量经过仔细描述——通常是习惯食用体量的四之三（用于减重）。


    我们在Counterbalance研究中使用了这种阶进式的食物重新引入法，并高兴地发现参与者避免了突然切换带来的问题，并在快速减重后保持了体重稳定。这种低卡路里减重阶段加上新的阶进式计划被称为“纽卡斯尔饮食”（Newcastle
    Diet）。随后，在DiRECT研究中，我们使用了另一种此前在格拉斯哥单独开发的、名为“Counterweight-Plus”的类似策略。


    首先，降低体重，完全专注于此。其次，一步步地重新引入常常食物。第三，长期维持体重。


    意识到这三个阶段是三个清晰的操作是非常重要的。仔细的研究表明，通过将一段较短但剧烈的减重期与长期维持期进行清晰分离，可以实现重大的减重。但需要提醒的是：到目前为止最好的研究仅持续了两年，必须终生避免体重反弹。（更多信息请访问网站：https://go.ncl.ac.uk/diabetes-reversal。）


    ## 吃什么：概览


    第一步：在8周减重期间，最简单的选择是使用液体配方产品每天提供约600卡路里，并搭配一份非淀粉蔬菜（约100卡路里）。不喝酒（且不进行额外运动）。


    第二步：过渡到正常饮食，用一小顿常常食物（400-500卡路里）代替晚餐液体餐，持续约2周。然后在接下来的2周内引入一份小午餐（约400卡路里）。然后停止液体饮食。


    第三步：对于长期维持，体重秤是你的最好的朋友。饮食恢复为正常的社交活动——但要密切关注量。酒精也是如此，


    ## 食物对比液体配方


    每餐使用一包许多市售液体配方饮食之一，对大多数人来说是目前是最容易的选择。有些品牌有多种口味供选择，可以最大限度地减少无味。在我们的“纽卡斯尔饮食”中，我们还鼓励参与者在水中加入一些非淀粉蔬菜以便咀嚼（一些人非常想念这种活动），主要是因为蔬菜有助于避免便秘。（在我们的DiRECT试验中，由于这项研究需要尽量缩小人与人之间的差异，我们放弃了蔬菜而使用第四包液体配方餐；然而，这种方案需要定期服用通便剂来处理便秘。）


    而且，如果你无法忍受连续几周加不加蔬菜喝液体配方饮料，你当然可以选择常常食物。你需要制作包含200卡路里的餐食，每天不超过800卡路里。这涉及到厨房中大量的计划和准备时间，许多人发现由于每天决策和选择的负担，这更加困难。


    如果你选择真正的食物来每天提供约800卡路里，你需要高比例的蛋白质食物（鱼、肉）来满足你的每日需求并让你保持饱腹感。大量的非淀粉蔬菜对于增加饱腹感保持肠道通畅非常重要。达到目标体重可能需要更长——大约三四个月，而使用液体配方只需要两个月。


    你也有可能缺少某些维生素，因此基于食物的每天800卡路里饮食最好补充复合维生素片。但完全专注于低卡路里饮食的方法非常适合某些人。这并不是科学。如果你能通过大幅减少食物摄入量来实现快速减重，那是没问题的。


    选择你的低卡路里饮食。如果是液体饮食，你必须决定喜欢哪个品牌和口味。无论你选择哪个品牌，它**必须**被描述为“完全营养”（而不是只是“代餐”），也就是说，除了蛋白质、糖和脂肪外，它含有所有的维生素、矿物质和微量元素。


    你可能会对某些品牌的高糖含量感到惊讶——但不用担心，与你每天产生的量相比，这很低。蛋白质含量会很高：约为25%，比你通常每餐摄入的要得多。它是每餐一包（没有决策或调整的空间）。每包含有约200卡路里（某些品牌见我们的网站：https://go.ncl.ac.uk/diabetes-reversal）。


    液体饮食对大多数更容易


    如果你选择真实食物方案或两者的结合，你需要准备好原料和食谱以坚持下去。要现实：你不会想每天都花几个小时准备精致的低卡路里餐；要准备好一些快捷简单且热量化的选项——例如烤鸡肉或鱼配上一堆非淀粉蔬菜。如果需要，可以将其作为你每天的主餐。


    不要在第一阶段开始运动计划。可能令人惊讶的是，这会严重阻碍减重，特别是对于超重的人来说。这可能是减重领域最好的秘密，我是从听取我们一项运动研究的参与者的话时得知的。

