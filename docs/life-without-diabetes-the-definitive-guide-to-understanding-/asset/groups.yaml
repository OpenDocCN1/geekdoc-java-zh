    # Foreword by Professor KGMM Alberti

    Senior Research Investigator, Imperial College, London;

    previously President, European Association for the Study of diabetes and International
    Diabetes Federation


    Type 2 diabetes has reached pandemic proportions worldwide. In 1980 we estimated
    that there were fewer than 100 million people affected – but since then numbers
    have increased by year so that are now heading for 450 million plus as again at
    high risk. No populations have been spared but figures are particularly highest
    among countries in the Middle East and South Asians. What is the cause? The big
    increase has been related to the epidemic of obesity, lack of exercise and adoption
    of “modern” nutrition against a genetic susceptibility background. But the precise
    cause has not previously been identified. Indeed when WHO reclassified types of
    diabetes in 1979, type 2 diabetes was excluded by exclusion: it was what was left
    over after type 1 diabetes and other types with known cases were excluded. It
    was anticipated that the number of people in the type 2 category would fall as
    specific causes were found. However, in the intervening 40 years one could cynically
    suggest that not too much has changed. There has been a massive hunt for responsible
    genes with only limited success. The association with overweight/obesity has certainly
    been strengthened although many people with type 2 diabetes are not particularly
    overweight. Otherwise it has a slightly gloomy picture particularly for those
    who have the disorder. There has also been the view that it is in most people
    an irreversible disorder.


    Professor Taylor in this book shows that the situation is more optimistic. With
    appropriate food habits and weight loss diabetes CAN be reversed in many people.
    This is encouraging for the many who have tried but failed due to lack of support
    and appropriate advice. Even more important he has identified the key role that
    fat deposits in the liver and pancreas are fundamental to the development of type
    2 diabetes, explaining its hallmarks of diminished insulin secretion and insulin
    resistance.


    The book has something for everyone and is written in an engaging style. There
