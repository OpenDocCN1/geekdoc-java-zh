    7 章和第 8 章中提供的信息。


    糖尿病的持续时间会有影响吗？


    有的。2 型糖尿病的持续时间越长，恢复正常血糖控制的可能性就越低。但永远不要说不可能。“平衡之道”研究确定了实现糖尿病缓解的赔率。这种概率从诊断后不久的几乎是板上钉钉，下降到前
