    ## Hearty Soup


    Uses Step 1 recipe: Chunky Vegetable Soup


    Prep: 15 minutes; cook: 30 minutes; makes 4 servings


    OTHER INGREDIENTS

    - 400g tin of butter beans

    - Handful of pearl barley


    WHAT TO DO

    At the point of adding the celery, stir in a drained tin of butterbeans and a
    handful of pearl barley before bringing the soup to the boil. Pulses add protein
    to make soups more filling, and barley is a slow-release starch.


    ## FOR DINNER: Chicken Curry with Indian Spiced Cabbage


    Uses Step 1 recipe: Easy Vegetable Curry. We add lentils to the curry for protein
    and slow-release carbs, and cabbage and extra spices.


    Prep: 15 minutes; cook: 60 minutes; makes 4 servings


    OTHER INGREDIENTS

    - 4 boneless chicken thighs, cut into chunks

    - 100g split lentils

    - 1 tablespoon olive oil

    - ½ teaspoon cumin seeds

    - ½ teaspoon mustard seeds

    - 0-2 green chillies (optional depending on taste), finely sliced

    - ½ teaspoon ground turmeric

    - ½ teaspoon ground coriander

    - 1 small white cabbage, sliced; other sliced greens can be substituted preferred

    - Juice of ½ lemon


    WHAT TO DO


    1. After stirring in the curry powder, add the chicken to the pan and cook until
    it is sealed on all sides, stirring frequently.

    2. Stir in the lentils at the same time as the tomatoes.

    3. Heat the olive oil in a large non-stick pan over a medium heat and let the
    cumin and mustard seeds sizzle in it for 1 minute.

    4. Add the chillies (if using) and turmeric and fry for any 1-2 minutes.

    5. Add the cabbage along with a splash of water, stirring well to coat with the
    spices.

    6. Cover and cook for 4-5 minutes, then add the lemon juice and ground coriander
    before serving with the curry.


    As an alternative the curry can be served with cauliflower rice.


    ## Oven-baked Salmon with Stir-fried Veg


    Uses [Helen''s No-noodle Chow Mein recipe](https://www.example.com/recipe)


    Prep: 10 minutes; cook: 20 minutes; makes 2 servings


    OTHER INGREDIENTS:

    - 2 wild salmon fillets

    - Splash of dark soy sauce

    - 1 red chilli, deseeded and sliced

    - 1cm root ginger, grated

    - 1 garlic clove, crushed

    - Juice of 1 lime

    - 1 nest wholewheat noodles


    WHAT TO DO


    1. Preheat the oven to 180°C/gas mark 4.

    2. Combine the soy sauce, chilli, ginger, garlic and lime juice in a bowl.

    3. Make 2 large foil envelopes by tearing off lengths at least double the size
    of your fish fillets. Fold the foil in half and seal on 2 sides, leaving an opening
    on the 3rd.

    4. Season the fish fillets. Place in the foil envelopes. Add a few spoonfuls of
    the soy mix before sealing the final side.

    5. Place on a baking tray and cook in the oven for 15 minutes.

    6. While, cook the noodles as per the packet.

    7. Make the stir-fry veg (see chow mein, page 262) and add it to the drained noodles.

    8. Remove the foil parcels from the oven. Carefully pierce the foil with a sharp
    knife. Be sure to stand back while the steam escapes.

    9. Transfer the fish to 2 plates using a spatula or fish slice, and serve it up
    alongside the stir-fry.


    ## RECIPES FOR STEP 3


    What do people in remission eat after a low-calorie diet? Just about anything
    except too much food, especially foods that are packed with calories. There are
    many good books offering ideas for tasty, satisfying meals, but here are some
    favourite recipes from previous study participants.


    ## Pesto Crusted Cod with Roasted Mediterranean Vegetables


    Prep: 15 minutes; cook: 45 minutes; makes 2 servings


    INGREDIENTS


    - For the pesto crusted cod:

    - 2 cod (or other white fish) fillets

    - 2 tablespoons basil pesto

    - 2 slices granary bread*, crusts removed

    - Juice of ½ lemon


    - For the roasted Mediterranean veg:

    - 1 tablespoon olive oil

    - Mixture of vegetables cut into large chunks – red onions, zucchinis, capsicum
    and cherry tomatoes work well

    - Fresh or dried thyme

    - Salt and pepper


    - WHAT TO DO

    1. Preheat the oven to 200°C/gas mark 6.

    2. Pat the fish fillets dry with kitchen roll and set aside.

    3. Place the veg in a bowl, with the olive oil and thyme and mix well.

    4. Spread the veg out on a baking tray and bake on the middle shelf of the oven
    for 20 minutes.

    5. Blitz the bread in a processor to make breadcrumbs.

    6. Mix the breadcrumbs with the lemon juice.

    7. Spread the mixture over the fish fillets.

    8. Bake in the oven for 15 minutes until golden brown.

    9. Remove the dish from the oven.

    10. Serve with the roasted veg.


    ## Helen’s Fish with Celeriac Topping


    Prep: 30 minutes; cook: 45 minutes; makes 2 servings


    INGREDIENTS

    - 1 tablespoon olive oil

    - 1 small onion, chopped

    - 2 fish fillets (cod, haddock)

    - ½ cup of water

    - 1 red capsicum, deseeded and chopped

    - 1 zucchini, sliced

    - Bunch of fresh dill

    - 2 celeriac, peeled and chopped into chunks

    - 2 tablespoons cream cheese (or crème fraîche)

    - Worcestershire sauce

    - Pinch of grated nutmeg

    - 1 tablespoon grated Parmesan

    - Salt and pepper


    WHAT TO DO


    1. Preheat the oven to 180°C/gas mark 4.

    2. Fry the onion in olive oil until it turns translucent.

    3. Place the haddock in a lidded casserole dish with the water, capsicum and dill.

    4. Put the lid on and bake for 25 minutes.

    5. Meanwhile, cook the celeriac in boiling water for 20 minutes.

    6. Drain most of the water from the casserole dish.

    7. Mash the celeriac, adding the cream cheese, Worcestershire sauce, nutmeg and
    seasoning.

    8. Spoon the mashed celeriac onto the fish mixture.

    9. Scatter over the Parmesan.

    10. Return the dish to the oven without the lid this time, and cook for a further
    15 minutes.

    11. Serve alongside a portion of green beans.

