- md: '

    # Wood Burning

    Person Living


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_30_0.png)


    2.1 A fire releases energy as heat from the links between carbon atoms in wood.
    The waste carbon is carried away in smoke. The human body releases energy to use
    for both heat and movement from the links between carbons in food. The waste carbon
    is breathed out as carbon dioxide.


    Like animals, plants need to generate and store energy. This happens at a basic
    level as plants forge chemical links by building up chains using sunlight energy.
    To do this, they take up carbon dioxide from the air and link the carbons to create
    high-energy sugars or fats. Plants conveniently store these, and in turn we might
    eat them perhaps as potatoes, rice or cassava or equally, a farmer might feed
    them to other animals, to promote a concentration of energy in milk or meat.


    The bottom line is that, whether we are eating animals or vegetables, food provides
    us with carbon-based energy that allows us to live and work and play. Our bodies
    merely need to direct the right amounts of food energy to storage and the right
    amount to releasing the essential energy, second by second and minute by minute.


    # Just ticking over


    We don’t expect machines to run without fuel. You would not get far in your car
    without it. The human body is no different, and an average person may use 2400
    calories of energy per day. Even if you are reading this lying in bed completely
    relaxed, your body works constantly, pumping blood around the body. Every cell
    in your body is continuously busy, pumping out substances it doesn’t need and
    pumping in others. The liver in particular is busy – manufacturing whatever sort
    of fuel the body requires at this moment in time. It can make glucose from substances
    released elsewhere in the body – for instance, from lactic acid (a string of three
    carbons) or the components of any protein surplus to requirements. If there is
    too much glucose around, the liver can turn it into fat. The liver never rests.


    Staying alive demands a lot of energy and we have evolved ways of building up
    reserves whenever possible. If you were snowed in and your cupboards were bare?
    shipwrecked on a desert island? This would not cause a problem for your clever
    body, or at least not for several weeks. The only daily essential is water.


    That said, big creatures require more energy than small creatures to stay alive.
    How much energy you need when lying depends upon your size. If two dogs are snoozing
    peacefully in front of the fire, the St Bernard is burning more energy than the
    Chihuahua. The person paying for the dog food may have guessed this.


    For humans, the amount of energy the resting body needs every minute can be measured
    directly. The graph below shows results from a large number of people and demonstrates
    how the need for energy increases steadily as weight increases. It also shows
    how the need for energy decreases if weight decreases.


    Imagine a person weighing 70kg lying perfectly still. On average, for each kilogram
    of body weight in a woman, just under one calorie is needed every minute. For
    the whole 70kg body, 60 calories are used every hour to power the vital processes
    of life. Over a 24-hour period of lying completely still, that amounts to 1450
    calories being required. Whereas for a woman weighing 100kg, 1.2 calories are
    required every minute, or about 1770 calories in the 24-hour period.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_32_0.png)


    ## 2.2 Energy needs – bigger people need more to keep weight steady.


    The average man requires slightly more energy due to his typically different body
    composition, but the effect of body size is just the same. A 70kg man will burn
    around 1500 calories at rest in 24 hours, while a 100kg man will require almost
    25% more (around 1900 calories). Of course, these are average numbers and individuals
    may need more or less.


    ## Exercise versus activity


    Everyone expects that the body will need more energy if it is moving around. And
    to some extent, this is true. But the actual amount of energy spent during exercise
    is much smaller than most people imagine. The diagram opposite shows how much
    extra energy is burned in a half-hour period of various activities. For comparison,
    the energy required just to keep the body ticking over is also shown.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_32_1.png)


    ## 2.3 How many calories are burned in half an hour? The numbers shown are for
    a woman weighing 80 kilograms, during moderately brisk walking, cycling and running.


    Fred and Bill are neighbours and both weigh 100kg. Fred wants to lose a few pounds,
    so he dusts down his squash racquet and after a slow start settles into playing
    for half an hour on Saturday mornings. Bill enjoys around his garden. He steadily
    trims, weeds and sorts, never out of breath. One Saturday morning, rather red
    in the face, Fred leans over the fence and tells Bill that he ought to take some
    exercise. But Fred finds that his own weight does not decrease, he builds up even
    more of a sweat during his half-hour on the squash court. Who burns more each
    Saturday morning?


    The answer lies in the time that the body is burning more than the resting level.
    For the half-hour on the court, Fred increases his energy usage from 1.3 calories
    each minute to an average of eight calories every minute. In half an hour he burns
    240 calories. Then he sits down to recover and reads the paper for the rest of
    the morning, feeling good. In the next three and a half hours, seated, he burns
    315 calories. Each Saturday morning a total of 555 calories are burned.


    Bill meanwhile walks around his garden, moving this and that and trimming here
    and there. He is active for four hours and a half hours longer than Fred and spends
    more energy without breaking a sweat. Staying on his feet, carrying his 100kg
    around, he uses an average of 2.5 calories per minute – 600 calories in all, which
    is 45 more than Fred. And, for Fred, there is a further snag. On leaving his squash
    club, he has to walk past the vending machines, and with the glow of righteous
    exercise, he often treats himself to a little chocolate bar (only 100g), in two
    minutes flat acquiring another 400 calories.


    So is it the duration of physical activity rather than the intensity that has
    more effect in determining how much energy is used. As an extreme example, when
    Ranulph Fiennes and Mike Stroud walked across Antarctica pulling heavy sledges
    over mountains and crevasses for up to 14 hours per day, it was estimated that
    they burned 11,500 calories every day! Gluttons for punishment as they are, even
    Fiennes and Stroud would not have been able to burn anything like that in shorter
    bursts of more intense exercise.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_34_0.png)


    ## 2.4 Number of calories burned on a Saturday morning and why Fred did not lose
    weight.


    If your aim is to prevent weight gain, being moderately active for hours is more
    effective than a quick burst in the gym. You don’t have to take sweaty exercise
    – although, if your aim is to maximise heart function and fitness, then bursts
    of additional brisk exercise are important. Advice handed out by exercise experts
    or public-health doctors tends not to point out the important difference between
    the very separate aims of cardiovascular fitness and weight control. With his
    bouts of squash, Fred’s head is likely in better shape than Bill’s – but that
    was not his goal. He started playing again because he wanted to lose a few pounds.


    Preventing weight gain is arguably one of the most important issues facing society
    today, and one that could certainly be helped by, for example, changing transport
    policy to encourage people to be more active or walk or cycle more, along with
    legislation on food policy. But preventing weight gain is not the same thing as
    losing weight; getting rid of excess fat that has accumulated over a long period
    of time requires a different approach, as we shall see.


    Suffice to say that the balance between energy burned during exercise – whatever
    form of activity you engage in – and energy pouring in food is very unequal. And
    for people who want to lose weight, the overwhelming priority must be to cut down
    on the consumption of food and calorie-containing drinks.


