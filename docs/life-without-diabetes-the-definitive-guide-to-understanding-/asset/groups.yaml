    # Butternut Pumpkin and Coriander Salad


    This flavoursome dish is especially good as a cold lunch the day after cooking.
    Use plenty of coriander and lime juice for a really fresh taste.


    Prep: 10 minutes; cook: 20 minutes; makes 4 servings


    INGREDIENTS


    +   1 small butternut pumpkin, peeled and cut into 2cm chunks

    1 tablespoon olive oil

    1 red onion, diced

    1 teaspoon dried cumin seeds

    1 teaspoon ground coriander

    Juice of 1 lime

    Chopped fresh coriander to serve


    WHAT TO DO


    +   1. Bring a medium pan of water to the boil and cook the pumpkin for 10-15
    minutes or until tender when prodded with a fork.

    2. Drain in a colander and cool under cold running water. Set aside.

    3. Heat the olive oil in a frying pan.

    4. Add the diced red onion and cumin seeds and cook for 2 minutes, stirring frequently.

    5. Add the drained butternut pumpkin, sprinkle over the ground coriander and cook
    for a further 3 minutes, stirring frequently.

    6. Stir in the lime juice.

    7. Allow to cool, and sprinkle over fresh coriander before serving.'
  - '[PAGE 182]


    # Helen’s No-noodle Chow Mein


    Helen''s dish is a good alternative to a more calorific takeaway chow mein dish.
    Chow mein literally means ''stir-fried noodles'', but in keeping with the veg-only
    approach, beansrouts take the place of noodles. Helen comments ''It''s the most
    yummiest thing. Very tasty!


    Prep: 5 minutes; cook: 5 minutes; makes 3 servings


    INGREDIENTS


    +   500g (1 bag) beansrouts

    1 teaspoon sesame oil

    3 teaspoons dark soy sauce

    1 tablespoon olive oil

    1 teaspoon fresh ginger, finely chopped

    ½ garlic clove, finely chopped

    1 carrot, peeled into strips using a vegetable peeler

    4 spring onions, sliced

    6 mushrooms

    1 small tin of sliced water chestnuts, drained

    1 red chilli (optional), deseeded and chopped

    Dash of Worcestershire sauce (optional)

    1 pak choi, sliced into strips


    WHAT TO DO


    +   1. Place the beansrouts in a bowl, add the sesame oil and 1 teaspoon of soy
    sauce and mix well to coat them.

    2. Heat the oil on high in a wok or heavy-based frying pan.

    3. Add the garlic and ginger. Stir-fry quickly for a minute.

    4. Add the carrot strips, spring onions, mushrooms, water chestnuts and red chilli.
    Stir-fry for another minute.

    5. Add a dash of water – enough to loosen the mixture – then stir in the remaining
    soy sauce and a dash of Worcestershire sauce, ensuring everything gets a good
    coating.

    6. Tip the beansrouts into the pan, followed by the pak choi.

    7. Stir-fry for 2 minutes and serve.'
  - '[PAGE 183]


    # Easy Vegetable Curry


    You can use any spices you like to make your own curry, and try different veg
    (cauliflower and spinach work really well) for variety. This version uses curry
    powder to keep things easy.


    Prep: 15 minutes; cook: 60 minutes; makes 4 servings


    # INGREDIENTS


    +   1 tablespoon olive oil

    1 large onion, thickly sliced

    2 garlic cloves, crushed

    2 tablespoons curry powder

    2 large carrots, thickly sliced

    400g swede, cut into 2cm chunks

    400g tin of chopped tomatoes

    425ml hot vegetable stock

    4 tablespoons fresh coriander, chopped


    # WHAT TO DO


    +   1. Heat the oil in a large pan over a medium heat.

    2. Add the onion and garlic and cook gently, stirring frequently, until the onion
    softens, about 5-8 minutes.

    3. Stir in the curry powder and cook for a further minute.

    4. Add the carrots and swede to the pan, followed by the tomatoes, and stock 3
    tablespoons of the coriander, and give it a good stir.

    5. Bring the pan to the boil, turn the heat down and put the lid on.

    6. Simmer for half an hour, stirring occasionally.

    7. Remove the lid and cook for a further 20 minutes, or until the vegetables are
    soft and the liquid has reduced and thickened a little.

    8. Season with salt and pepper and scatter over the remaining coriander before
    serving.'
  - '[PAGE 184]


    # SOUPS


    Lynda’s Curried Butternut Pumpkin Soup Lynda loves curries and she

    experimented with different vegetables before hitting on this delicious

    combination of butternut pumpkin and spinach.


    Prep: 5 minutes; cook: 25 minutes; makes 4 servings


    # INGREDIENTS


    +   1 tablespoon coconut oil

    2 shallots, finely diced

    2 garlic cloves, peeled, minced (or use garlic paste)

    1 small butternut pumpkin, peeled and chopped

    3 teaspoons curry powder

    ¼ teaspoon ground cinnamon Salt and black pepper

    1 litre vegetable stock (made with a stock cube or stock poach)

    4 handfuls of fresh spinach leaves or 4 cubes of frozen spinach


    # WHAT TO DO


    +   1. Place a large pan over a medium heat and add the oil.

    2. Stir-fry the shallots and garlic for 2 minutes.

    3. Add the pumpkin, curry powder, cinnamon and some seasoning to the

    pan and mix everything together.

    4. Put the lid on and cook for 4 minutes, stirring occasionally.

    5. Add the vegetable stock and bring to a low boil over a medium heat.

    6. Turn off the heat, cover and simmer for 15 minutes or until the

    ternut pumpkin is tender (check by inserting a fork).

    7. Allow the soup to cool slightly, then blend with a hand blender or in

    batches in a food processor.

    8. Return the soup to the pan and stir in the fresh spinach. Cover it and

    let it cook over a medium heat until the spinach has wilted, or if using

    frozen spinach, until it has defrosted and completely heated through.


    Keeps in the fridge for 3-4 days, or portions can be frozen for up to a month

    and microwaved or reheated in a pan when required.'
  - '[PAGE 185]


    # # Watercress Soup


    Increase your Intake of leafy greens without even noticing! This version replaces
    the usual potato with white turnip to keep the carbohydrate content down.


    Prep: 10 minutes; cook: 35 minutes; makes 4 servings


    INGREDIENTS


    +   - 1 tablespoon olive oil

    - 1 small onion, diced

    - 2 small white turnips, peeled and chopped

    - 1 litre chicken or vegetable stock (made with a stock cube or stock pot)

    - 2 bags of fresh watercress

    - Splash of milk

    - 1 teaspoon grated nutmeg

    - Salt and black pepper


    WHAT TO DO


    +   1. Heat the oil in a large pan on a medium heat.

    2. Fry the onion for about 5 minutes, stirring constantly until it begins to soften.

    3. Add the chopped turnip, cover with a lid and cook for another 5 minutes.

    4. Pour in the stock and turn up the heat to bring it to the boil.

    5. Reduce the heat to a simmer and cook for 20 minutes with the lid until the
    turnip is soft.

    6. Add the watercress, turn off the heat and allow the soup to cool slightly.

    7. Blend in batches, then return the soup to the pan and add a splash of milk,
    along with the nutmeg and some salt and pepper.'
- md: '

    ## Zucchini and Coconut Soup with Coriander


    Prep: 5 minutes; cook: 15 minutes; makes 2 servings


    INGREDIENTS


    - 1 teaspoon coconut oil

    - 1 level teaspoon cumin seeds

    - 1 small onion, sliced into rings

    - 300g zucchinis, sliced

    - 10 peppercorns

    - 500ml boiling water

    - ½ teaspoon ground cardamom

    - ¼ teaspoon ground cumin

    - Pinch of salt

    - Small bunch of fresh coriander


    WHAT TO DO


    1. Place the coconut oil in a large pan over a medium heat.

    2. Add the cumin seeds and fry for 1 minute.

    3. Stir in the onion and sauté until it turns translucent.

    4. Add the zucchinis, followed by the peppercorns and water.

    5. Bring to the boil, cover and simmer for 10 minutes.

    6. Turn off the heat. Add the cardamom, ground cumin and some seasoning. Blend
    it in a food processor or with a hand blender to produce a creamy soup.

    7. Garnish with fresh coriander before serving.


    Blended soups may seem just a bit too much liquid when combined with the daily
    meal replacement drinks, so here are some recipes which add texture as well as
    being incredibly tasty.


    ## Chunky Vegetable Soup


    Prep: 10 minutes; cook: 30 minutes; makes 4 servings


    INGREDIENTS


    - 1 tablespoon extra-virgin olive oil

    - 1 medium leek (100g), cut into 1cm slices

    - 3 large carrots, peeled and cut into 1cm slices

    - 1 litre chicken or vegetable stock (made with a stock cube or stock pot)

    - 4 celery stalks, cut into 1cm pieces

    - 6 spring cabbage, kale or cavolo nero leaves, sliced

    - 1 bay leaf

    - Dried herbs e.g. thyme or mixed herbs

    - Salt and black pepper


    WHAT TO DO


    1. Heat the oil in a large saucepan.

    2. Add the leek and carrots and sauté for 10 minutes until they start to soften.

    3. Pour in the stock.

    4. Add the celery and sliced cabbage leaves, along with the bay leaf and herbs.
    Season with a little salt and black pepper.

    5. Bring it to the boil, then reduce the heat and let it simmer for 20 minutes,
    part covered with a lid.

    6. Add an extra grind of black pepper just before serving and enjoy the juicy
    chunks of veg. This dish is even tastier reheated the next day.


    ## Thai-Style Beansprout and Pak Choi Soup


    Prep: 10 mins; cook: 4 minutes; makes 4 servings


    INGREDIENTS


    - 1 litre vegetable stock (made with a stock cube or stock pot)

    - 1 stalk lemongrass, cut into 3 and bashed to release the flavour

    - 1-2 red chillies, deseeded and finely chopped

    - 1cm root ginger, peeled and thinly sliced

    - 1 red capsicum, deseeded and finely sliced

    - 200g beansrouts

    - 2 pak choi, roughly chopped (or 150g curly kale)

    - 2 spring onions, sliced

    - 1–2 tablespoons light soy sauce

    - Juice of 1 lime

    - Fresh coriander to garnish


    WHAT TO DO


    1. Place the lemongrass, ginger and chillies in a large pan with the stock and
    bring to boil.

    2. Reduce the heat to a simmer and add the capsicum, beansrouts and pak choi.

    3. After about 3 minutes, add the spring onion and soy sauce.

    4. Just before serving, add a squeeze of lime and a few fresh coriander leaves
    to garnish.


    Remaining servings can be kept in the fridge for 2-3 days, or frozen in freezer
    bags when cooled.


    ## RECIPES FOR STEP 2


    Once you are through the intensive low-calorie stage, you can start adding in
    protein foods (and a little more carbohydrate) to the veg recipes you now know
    and love. A satisfying meal appears in place of a shake! Protein is the most filling
    part of the diet, and higher protein intakes are linked with more successful weight
    maintenance after a liquid low-calorie diet.


    ## FOR BREAKFAST


    ### Spicy Breakfast Eggs


    Uses Step 1 recipe: Kevin''s Smoky Sofrito.


    Prep: 5 minutes; cook: 25 minutes (15 minutes if using pre-made sofrito); makes
    2 servings


    INGREDIENTS


    If you have ready-made sofrito, you can use it here (enough to make a base layer
    in the pan). If not, you''ll need to make a quick version as explained below.


    - 4 eggs

    - Chopped coriander

    - Quick sofrito: 1 onion, 1 garlic clove, 1 red chilli (all finely chopped), 1
    tin of chopped tomatoes


    WHAT TO DO


    1. Heat your sofrito into a heavy-bottomed frying pan (make sure you have a lid
    that will cover it). If making a quick sofrito, fry the onion, garlic and chilli
    in olive oil for 10-15 minutes until soft and caramelised, then stir in with your
    spoon to break them up. Bring the mixture to the boil, then reduce and cook on
    medium until thickened (about 5 minutes).

    2. Use a spoon to make 4 wells in the mixture.

    3. Swiftly crack 1 egg into each well, season with a little salt and pepper, and
    cover with the lid.

    4. Poach the eggs in the sofrito for about 5 minutes (or until done to your liking).

    5. Serve up 2 eggs and half the sauce per person, with some chopped coriander
    sprinkled over.


    ### Lesley’s Oven Frittata


    Lesley regularly makes this quick and easy dish for breakfast, who uses leftover
    veg from the night before.


    Prep: 5 minutes; cook: 25-30 minutes; makes 4


    INGREDIENTS


    - 1 tablespoon olive oil

    - 1 small onion, sliced

    - 4 eggs

    - Salt and pepper

    - Splash of milk

    - 1 large tomato, sliced

    - Fresh herbs e.g. thyme or basil of your choice


    WHAT TO DO


    1. Preheat the oven to 200°C.

    2. Place the olive oil in a frying pan.

    3. Beat the eggs in a bowl, add the milk.

    4. Pour the mixture into a baking dish.

    5. Fry the onion until it begins to soften.

    6. Arrange the tomato and leftover veg evenly.

    7. Sprinkle the herbs on top.

    8. Bake in the centre for 20-25 minutes until golden brown.

    9. Allow it to cool slightly.

    10. Cut into pieces.

    11. Serve with a small salad or a main meal.


    ### Feta and Grilled Eggplant


    Uses Step 1 recipe: Simple Grilled Eggplant


    Prep: 5 minutes; cook: 10 minutes; serves 1


    INGREDIENTS


    - 100g feta cheese, cubed

    - olive oil


    WHAT TO DO


    1. Drizzle olive oil over the eggplant.

    2. Scatter the feta on top.

    3. Done!


    ### Kath’s Hearty Veg Chilli


    Prep: 15 minutes; cook: 20 minutes; serves 4


    INGREDIENTS


    - 1 tablespoon olive oil

    - 1 red onion, finely chopped

    - 1 orange capsicum, deseeded and sliced

    - 1 zucchini, finely chopped

    - 2 garlic cloves, finely chopped

    - 1 tin of pinto beans or kidney beans

    - 1 tin of chopped tomatoes

    - Pinch of chilli powder

    - Salt and pepper

    - Handful of fresh coriander leaves, roughly chopped


    WHAT TO DO


    1. Fry the onion in oil for 2 minutes.

    2. Add the capsicum, zucchini and garlic and cook for a further 5 minutes, stirring
    frequently.

    3. Stir in the beans, tinned tomatoes, chilli powder and salt and pepper and simmer
    for 10-15 minutes.

    4. Serve the chilli on top of a roast sweet potato with some crème fraîche and
    coriander leaves.

