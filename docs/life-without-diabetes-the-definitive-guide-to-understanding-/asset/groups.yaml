    携带多余脂肪的个人耐受极限。皮肤下组织储存脂肪的能力在个体之间存在巨大差异。


    有些人皮肤下拥有非常健康的运动型脂肪组织，它们可以处理任何投掷给它的东西，似乎具有无尽的储存能力。从代谢的角度来看，我们可以说这些人是幸运的。当然，如果他们积累的脂肪越来越多，看起来可能很过分，但所有脂肪都被安全地锁起来了。正如我们所看到的，当脂肪无法再安全储存而必须存放在其他地方时，代谢问题就开始了。


    ## 来自经典研究报告的洞察


    有一项研究对 2 型糖尿病知识的影响比其他任何一项研究都更为深远。二十五年前，它还深刻地改变了医生治疗这种疾病的方式。它提出了一个核心问题：更好地控制血糖可以预防糖尿病的长期并发症吗？英国前瞻性糖尿病研究（通用简称为
    UKPDS）招募了 1977 年至 1991 年间新确诊为 2 型糖尿病的患者。主要结果于 1998 年得出。


    这是牛津大学罗伯特·特纳博士（Dr Robert Turner）的脑力结晶。他与看似不可能的困难作斗争，在为期 20 年的主要研究期间获得了资金以维持研究进行。他是一个独立思考者，一位卓越的医生，拥有强大的毅力。但最重要的是，他能够吸引并维持一个分布在英国各地的忠实医生群体。他是一个卓越的人，需要他所有的素质来启动、执行并完成这项研究。1975
    年，特纳博士的团队加入了另一位开明的医学学者鲁里·霍尔曼教授（Dr now Professor Rury Holman）。他在使试验从构思到完成的整个过程中也起了关键作用。2012
    年，他同意与我合作重新分析一些旧的 UKPDS 数据，以测试“个人脂肪阈值”（Personal Fat Threshold）的概念：个体是否具有某种水平的脂肪储备，对其是安全的但与其他人不同？


    UKPDS 是当时糖尿病领域迄为止最大的“随机”试验。随机意味着人们被随机分配：要么进入强化治疗组，要么进入“对照”组。这种设计非常重要，因为它减少了获得误导性结果的风险。如果人们自己选择加入哪个治疗组，很可能会影响结果，最后测得的任何差异可能仅仅反映了这一点。组之间的任何偏差都意味着，结果可能不是由于给予该组的治疗，而是源于其他未识别的因素——过往医疗问题的个人经验或对疾病的背景信念。UKPDS
    对照组的参与者接受常规治疗（饮食、最终是药物和真实性胰岛素），但强化组的患者根据需要使用药物或胰岛素进行治疗，其革命性的目标是将空血糖保持在 6mmol/l
    以下。


    在 UKPDS 设计时，在研究任何疾病时，随机试验都是很罕见的。但罗伯特·特纳是一个先驱，他希望建立不受批评的新知识。没有其他任何项像 UKPDS 这样的研究。总共有
    5102 名糖尿病患者参与了这项研究。二十年后，它产生了极其震撼的信息。它发现，更好地控制血糖可以使糖尿病的所有并发症——眼部、神经、肾脏、足部和大脑——产生显著的减少。这是一个大新闻。在当时，许多医生认为糖尿病并发症的发生与血糖控制得如何无关。这种旧观念花费了很长的时间才被取代，但今天，人们已普遍接受血糖控制与长期并发症风险之间的联系。


    研究还显示，血糖水平多年来稳步上升，无论人们处于对照组还是强化组。2 型糖尿病似乎在不可避免地恶化。每个人似乎都需要越来越多的药物，到第 10 年时，半数的人已经开始注射胰岛素。这种稳步恶化的明确证据最终被全球所接受，强化了大多数糖尿病专家的简单观察：人们终身患有
    2 型糖尿病，血糖水平会不断变差。随后，这一切汇聚成一种固定的信念：2 型糖尿病不可避免地进展，早晚需要胰岛素治疗；然而，无论处方了多少药物，每个人的状况都在恶化。当你被确诊时，可能已经接触到了这种绝望的论调。尽管如此，UKPDS
    带来了关于 2 型糖尿病最佳治疗方法知识的一场革命。


    然而，UKPDS 在本章中的重要性涉及另一件事。在 UKPDS 中，这群新确诊糖尿病患者的体重如何？平均 BMI 为 27。这一点也不高。它处于“超重”范围的低端，远未达到“肥胖”。患有非常普通的
    2 型糖尿病的人中，约有三分之一的人具有完全正常的 BMI——小于 25。


    事实上，图 6.4 中灰点的分布准确反映了参加 UKPDS 的人的 BMI。


    考虑到现在对 2 型糖尿病的描述和报道方式，这似乎很奇怪，但在 20 世纪 70 年代和 80 年代初，人们认为肥胖与 2 型糖尿病之间没有直接关系。几个著名的研究似乎证明了这一点。作为一名年轻医生，我自己审查了所有的最佳证据并发表了一份总结，结论是没有联系的！这怎么可能？我们现在看到，那个时期少数肥胖人患
