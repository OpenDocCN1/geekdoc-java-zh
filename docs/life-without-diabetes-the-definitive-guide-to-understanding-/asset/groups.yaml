    型糖尿病缓解的方法是否可以在常规的英国医疗服务体系（NHS）实践中推广至关重要，我们需要双方的专业知识来确保试验的成功。DIRECT 的完整故事（这是一个大型团队的努力）尚未讲述完毕，而本书专注于关于
    2 型糖尿病逆转的机制及其背后原因的早期研究。我必须特别提到 Alison Barnes，她作为高级研究员营养师加入 DIRECT，负责培训纽卡斯尔地区的
    NHS 员工。她在将技能传递给基础护理护士或营养师时所表现出的活力和专业精神是传奇性的。Alison 还通过多种方式在英国传播如何实现 2 型糖尿病缓解的知识。她想出了绝佳的主意，包含了从研究参与者那里收集的食谱建议，而食谱部分大部分是她的工作。


    我非常感谢健康与学会的 Ashley Adamson 教授、Falko Sniehotta 教授和 John Mathers 教授提供的建议和支持。我的长期同事格拉斯哥大学的
    Naveed Sattar 教授一直是我讨论和完善想法时深受感激的基石。同样，与牛津大学 Rury Holman 教授的合作在开发“个人脂肪临界值”（Personal
    Fat Threshold）概念方面极具价值。


    在应对医学重大问题时，了解敌人至关重要。我对糖尿病的大多数洞察是通过与患者交谈获得的。通过与我在临床职业生涯大部分时间工作的糖尿病专家护士同事 Deidre
    Keyes-Grebzalski 的讨论并获得她的见解，这些洞察得到了极大的加强。George Alberti 爵士在纽卡斯尔创造了极其肥厚的糖尿病研究环境，并在
    20 世纪 80 年代担任我的研究导师，我非常感激对我工作的巨大影响。多年来，我受益于与顾问同事的讨论，特别是 Sally Marshall 教授。


    英国糖尿病协会研究委员会具有想象力和远见，资助了 Counterpoint 研究，该研究揭示了 2 型糖尿病的原因以及它为何是一种可逆转的。那是开启所有后续研究的关键步骤，理应广泛认可。英国糖尿病协会还资助了
    DIRECT 研究，该测试了在基础护理中实现缓解的普遍适用性。我没有商业关系。我是英国政府工作小组（与英国糖尿病协会共同组成的营养科学顾问委员会）的成员，负责评估低化合物饮食的发表证据。书中表达的观点是个人观点，而非工作小组的观点。


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_221_0.png)


    研究的主要英雄们。从左上开始：Peter Carey 博士、Ravi Balasubramanian 博士、E Lin Lim 博士、Sarah Steven
    博士、Carl Peters 博士、Svetlana Zhuzhneuskaya 博士、Gavin Macaulay 博士、Ahmad Al-Mrabeh
    博士、Alison Barnes 小士、Kieren Hollingsworth 博士、Pete Thelwall 博士以及 Andrew Blmire 教授。


    我特别感谢两位阅读手稿的人：James Taylor（我的儿子，兼业医生）和 Paul Stein（从小学起起的朋友，对所有维京事物的爱好者）。他们提出了改进建议，并指出了晦涩的评论和逻辑不通之处。留下的问题完全是我的责任！将想法和信息转化为一本书，出版代理人
    Jaime Marshall 和出版商 Aurea Carpenter 提供了极大帮助。


    如果没有长时间远离家人，这项工作是不可能实现的——通常是身体不在家，但心也经常不在焉。我非常感谢我的妻子 Aileen 以及以及儿子们 James、Donald、Alasdair
    和 Duncan 长期以来的包容与支持。


    # 关于作者


    **Roy Taylor 教授**是纽卡斯尔大学的医学与代谢教授，同时是纽卡斯尔港畔泰恩医院 NHS 基金信会的荣誉兼业医师。他在爱丁堡大学获得医学学位。他曾担任美国耶尔大学的医学访问教授（1990-91年），在在那里他获取了新的
    MRI 观察成像方法来观察人体。回到英国后，他筹集了 520 万英镑建立了纽卡斯尔 MRI 中心。他还开发了英国糖尿病视网膜筛查系统，并发表了300 多篇科学论文。


