    ## 海伦的蒜香蘑菇炒绿菜


    准备时间：5分钟；烹饪时间：15分钟；份量：2


    食材

    - 250g 羽甘蓝（或任何其他绿色蔬菜）

    - 1汤匙橄榄油

    - 1 瓣大蒜，压碎

    - 1 个红洋葱，切片

    - 200g 蘑菇，切片

    - 1 茶匙干辣椒碎


    做法


    1. 在锅中加入少量沸水，将羽甘蓝蒸约 5 分钟或直到变软。为了让风味更浓郁，尝试在蒸制前加入 4 颗豆蔻的压碎种子。

    2. 将羽甘蓝倒入滤网中沥干。

    3. 擦干锅，加入油并用中火加热。

    4. 加入压碎的大蒜和洋葱片，翻炒 2 分钟。

    5. 加入蘑菇和辣椒碎。再煎煮 8 分钟，期间经常翻炒，直到呈金黄色。

    6. 将羽甘蓝加入混合物中，炒至热透即可。


    ## 珍妮的葱香西芦


    准备时间：5分钟；烹饪时间：11分钟；份量：2


    食材

    - 2 个中等西芦

    - 2 茶匙橄榄油

    - 3 瓣大蒜，压碎

    - 6 根葱，细切


    做法


    1. 将西芦切成 1cm 厚的圆片。

    2. 在煎锅中中火加热橄榄油。

    3. 加入大蒜煎 1 分钟，不断翻炒防止烧焦。

    4. 加入西芦片煎煮 5 分钟，期间经常翻炒。

    5. 将葱加入锅中，再煎煮 5 分钟。


    ## 地中海风洋菜花沙拉


    准备时间：15分钟；份量：4


    食材

    - 1 罐四分之一的洋菜花心，沥干

    - 1 罐烤红灯椒（或根据喜好使用生红灯椒），切丁

    - 1 根黄瓜，去籽并切丁

    - 2 瓣大蒜，压碎

    - 1 个小红洋葱，切碎

    - 1 汤匙特级初榨橄榄油

    - 1 汤匙干牛香草

    - 半个柠檬汁


    做法

    1. 将所有食材放入大碗中混合均匀。

    2. 用保鲜膜覆盖并冷藏一小时以让风味融合，然后享用。在冰箱中可保存 2 天。


    ## 南瓜香菜沙拉


    这道风味佳的菜肴特别适合作为第二天第二日的冷午餐。使用大量的香菜和柠檬汁可以获得非常清新的口感。


    准备时间：10分钟；烹饪时间：20分钟；份量：4


    食材

    - 1 个小南瓜，去皮并切成 2cm 大块

    - 1 汤匙橄榄油

    - 1 个红洋葱，切丁

    - 1 茶匙干孜然粒

    - 1 茶匙芫香菜粉

    - 1 个柠檬的汁

    - 切好的新鲜香菜，备装饰用


    做法


    1. 将中锅水烧开，将南瓜煮 10-15 分钟，或直到用叉子戳时变软。

    2. 在滤网中沥干，并在冷水下冷却。备用。

    3. 在煎锅中加热橄榄油。

    4. 加入切丁的红洋葱和孜然粒，炒 2 分钟，期间经常翻炒。

    5. 加入沥干的南瓜，撒上芫香菜粉，再炒 3 分钟，期间经常翻炒。

    6. 拌入柠檬汁。

    7. 放置冷却，在享用前撒上新鲜香菜。


    ## 海伦的无面炒面


    海伦的这道菜是高热量外卖炒面的极佳替代品。“Chow mein”的字面意思是“炒面条”，但为了符合纯素做法，我们用豆芽代替了面条。海伦评价道：“这是最好吃的了。非常美味！”


    准备时间：5分钟；烹饪时间：5分钟；份量：3


    食材

    - 500g（一袋）豆芽

    - 1 茶匙芝麻油

    - 3 茶匙老抽

    - 1 汤匙橄榄油

    - 1 茶匙新鲜姜，细切

    - ½ 瓣大蒜，细切

    - 1 根胡萝卜，用削皮刀削成条

    - 4 根葱，切片

    - 6 朵蘑菇

    - 1 小罐切片水栗，沥干

    - 1 根红辣椒（可选），去籽并切碎

    - 少许伍斯特酱（可选）

    - 1 棵小白菜（大白菜），切成条


    做法


    1. 将豆芽放入碗中，加入芝麻油和 1 茶匙酱抽，拌匀使其裹上酱汁。

    2. 在镬或厚底煎锅中大火加热油。

    3. 加入大蒜和姜。快速翻炒 1 分钟。

    4. 加入胡萝卜条、葱、蘑菇、水栗和红辣椒。再翻炒 1 分钟。

    5. 加入少许水——足以弄松混合物即可——然后拌入剩余的酱抽和少许伍斯特酱，确保所有食材上色均匀。

    6. 将豆芽倒入锅中，接着放入小白菜。

    7. 翻炒 2 分钟即可享用。


    ## 简易蔬菜咖


    你可以使用任何喜欢的香料来制作自己的咖喱，并尝试不同的蔬菜（花椰菜和菠菜效果非常好）来增加多样性。这个版本使用咖喱粉以保持简单。


    准备时间：15分钟；烹饪时间：60分钟；份量：4


    食材

    - 1 汤匙橄榄油

    - 1 个大洋葱，切片

    - 1 个大洋葱，切片

    - 2 瓣大蒜，压碎

    - 2 汤匙咖喱粉

    - 2 根大胡萝卜，切片

    - 400g 芜菁，切块

    - 400g 罐装番茄

    - 425ml 蔬菜汤

    - 4 汤匙新鲜香菜


    做法

    1. 在锅中加热油。

    2. 加入洋葱片翻炒 2 分钟。

    3. 加入胡萝卜片，压碎即可。

    4. 加入洋葱、咖喱粉、肉桂，放入锅中煮 5 分钟。

    5. 倒入蔬菜汤并煮沸。

    6. 转小火，盖盖子慢炖 30 分钟直到芜菁变软（用叉子测试）。

    7. 让汤稍凉。

    8. 分批搅拌。

    9. 将汤倒回锅中，加入新鲜香菜。

    10. 盖盖子煮至蔬菜软。


    ## 汤类


    ##琳达的咖喱南瓜


    准备时间：5分钟；烹饪时间：25分钟；份量：4


    食材

    - 1 汤匙椰子油

    - 1 个小红洋葱，切碎

    - 1 个小南瓜，去皮并切块

    - 2 茶匙咖喱粉

    - 1 公升蔬菜汤（用汤块或汤调料调制）

    - 4 抓手新鲜菠菜


    做法

    1. 在大锅中放入椰子油。

    2. 加入洋葱碎翻炒 2 分钟。

    3. 加入南瓜、咖喱粉、肉桂，放入锅中煮 5 分钟。

    4. 倒入蔬菜汤并煮沸。

    5. 转小火，盖盖子慢炖 25 分钟直到南瓜变软。

    6. 让汤稍凉，然后分批搅拌。


    ## 水菜汤


    在不知不觉中增加绿叶蔬菜的摄入！这个版本用白菁代替了传统的土豆以降低碳水含量。


    准备时间：10分钟；烹饪时间：35分钟；份量：4


    食材

    - 1 汤匙橄榄油

    - 1 个小洋葱，切丁

    - 2 个小白菁，去皮并切块

    - 1 公升鸡汤或蔬菜汤（用汤块或汤调料调制）

    - 2 袋新鲜水菜

    - 少许牛奶

    - 1 茶匙磨豆蔻粉

    - 盐和黑胡椒


    做法


    1. 在大锅中中火加热油。

    2. 煎洋葱约 5 分钟，不断翻炒直到变软。

    3. 加入切好的白菁，盖盖子煮 5 分钟。

    4. 倒入汤汁并转大火煮沸。

    5. 转小火，盖盖子慢炖 20 分钟直到白菁变软。

    6. 加入水菜，关火并让汤稍凉。

    7. 分批搅拌，将汤倒回锅中，加入少许牛奶、以及豆蔻粉、盐和黑胡椒。


