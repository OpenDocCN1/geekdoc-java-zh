    # # Appendix


    # What are the other types of diabetes?


    A. Type 1 diabetes


    This typically occurs in children and younger people. The peak age of onset is
    around 13 years. It is unusual after the age of 40 years but can occasionally
    occur even in later life. The start of this disease is usually abrupt, with symptoms
    including a strong thirst and a need to pass urine many times each night. These
    problems come on usually over a period of weeks, and most people start losing
    weight.


    Type 1 diabetes is absolutely nothing to do with being too heavy or eating too
    much sugar. It is caused by the body destroying the insulin-producing cells with
    an ‘autoimmune’ attack. We still do not know what starts this process. Unless
    insulin injections are started without delay, the condition is fatal.


    Sometimes, especially in adults, type 1 diabetes can develop more slowly, which
    can make diagnosis more difficult. This is known as ‘onset’ type 1 diabetes, and
    it is often mistaken for type 2 diabetes. Blood tests can sometimes be useful
    in showing that type 1 diabetes is more likely than type 2 diabetes, but they
    are not 100% accurate.


    In countries with a modern health service, around 8% of all diabetes is type 1.
    The figure is lower in less developed countries, where many people die from type
    1 diabetes before being diagnosed.


    B. MODY


    MODY or ‘Maturity Onset Diabetes of Youth’ is due to an alteration in just one
    gene. This abnormal gene causes the process of insulin production to be faulty.
    There are a handful of specific genes that can cause this — these have nothing
    to do with type 2 diabetes. Neither is this type of diabetes anything to do with
    being too heavy. Typically, many relatives are affected, and diabetes skips a
    generation — parents, brothers or sisters, grandparents, and even young children
    can be affected. Because there are several distinct types, and specific genetic
    tests are available for some of these, definite diagnosis is usually but not always
    possible.


    Around 1% of all diabetes is MODY.'
  - '[PAGE 215]


    # C. Gestational diabetes


    This comes on usually between the 6th and 7th month of pregnancy. It goes away
    after pregnancy, but affected women are at high risk of developing type 2 diabetes
    over the next few years or in later life. It should be seen as an early warning.
    While in gestational diabetes does not cause long-term problems, if body weight
    is allowed to stay too high, type 2 diabetes is likely to develop within a decade
    or so.


    Gestational diabetes affects 5-15% of women during pregnancy, depending on which
    level of glucose is chosen to define it.


    # D. Pancreatic diabetes


    The pancreas is an organ behind the stomach that contains the insulin-producing
    cells. Any serious disease of the pancreas can damage these cells and cause diabetes.
    The commonest such disease is chronic pancreatitis, which results in destructive
    inflammation of the whole pancreas. Cystic fibrosis also causes diabetes in many
    adults with the condition.


    In pancreatic diabetes, often the effects of the pancreatic diabetes itself –
    such as weight loss and looseness of the bowels – are more obvious than the diabetes.
    However, diagnosis of this cause of diabetes is not usually in doubt. It accounts
    for a tiny fraction of all diagnoses of diabetes.


    In summary, type 2 diabetes is assumed to be the diagnosis when middle-aged or
    older people are found to have a raised blood glucose and when there are no obvious
    clues to any of the other conditions listed above. Doctors know that nothing is
    certain in medicine, and reassessing the diagnosis is sometimes necessary. As
    time goes by, strong clues pointing to alternative diagnoses may emerge.'
  - '[PAGE 216]


    # The 1, 2, 3 approach


    **Step 1**: For the 8 weeks of rapid weight loss, the simplest option is to use
    a liquid formula product to provide around 600 calories per day, with one helping
    of non-starchy vegetables or salad (around 100 calories).


    Other options for your daily helping of non-starchy veg or salad on **Step 1**


    +   CAROL''S RATATOUILLE


    +   ZOODLES ARRABIATA


    +   HELEN''S NO-NOODLE CHOW MEIN


    +   WATERCRESS SOUP


    Recipes of approximately 400-500 calories for the transition to normal eating
    in **Step 2**


    +   FETA AND GRILLED EGGPLANT


    +   CHICKEN SKEWERS WITH TABBOULLEH


    +   LESLEY''S OVEN FRITTATA


    +   OVEN-BAKED SALMON WITH STIR-FRIED VEG


    On **Step 3**, eating is back to being a normal, social activity – but with a
    close eye on quantities


    +   HELEN''S FISH PIE WITH CELERIAC TOPPING


    +   KATH''S ROASTED CHIPOLATAS WITH APPLE


    +   TONY''S ALTERNATIVE SUNDAY LUNCH


    +   TARA''S TACOS


    Foods to enjoy in a life free of type 2 diabetes'
