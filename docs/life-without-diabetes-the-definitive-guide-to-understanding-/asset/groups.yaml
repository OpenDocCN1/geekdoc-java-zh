    ## A patient’s story: Dave Myers, Hairy Biker


    It was my great good fortune to meet Professor Roy Taylor when I filmed the series,
    *The Hairy Dieters*, back in 2012. It was a meeting that went far beyond a TV
    show about, ‘two fat cooks who needed to shed some timber’, to a union that changed
    my life. Seven years on I am fitter than I had been for years.


    Professor Taylor has the ability to help you understand what goes on in the body
    and why. Sometimes it is tough love and you need to get a grip on yourself and
    your bad habits to get healthy. This he conveys with genuine care and an infectious
    enthusiasm.


    It is clear Roy understands people, and as he says, medicine is all about listening
    to people. He listened to us, as two people who needed help, beyond the cameras.
    Roy is the expert in this field, and the research centre he has created in Newcastle
    is amazing. But what is even more striking is the staff. What a great bunch. Their
    research has turned the understanding of diabetes upside down, and allowed many
    people to regain their health. This book explains how your body deals with food
    and why type 2 diabetes may affect you. There are no short cuts possible, just
    help based on sound science and expertise at its core.


    Roy’s first piece of advice to me was this: for long-term health, we should be
    able to fit into the trousers we wore when we met 21. He proved to us he practised
    what he preached, when we danced with him, in his old canary-yellow corduroy flares
    at Tynemouth beach! I never quite made it to the 34-inch (86.4cm) waist of my
    youth but had managed a 36-inch (91.4cm) waist… which wasn’t bad from a starting
    point of 49 inches (124.5cm) some three months previously. The biggest benefit
    for me was not just being able to wear cooler jeans, it was getting my health
    back.


    When I met Roy in 2012 I had type 2 diabetes – with high blood sugars and I was
    on medicine to control this. Roy showed me another way. Now my blood sugars are
    normal and my diabetes is a thing of the past. I am tested every month and the
    results are normal. This means I have avoided the misery of type 2 diabetes that
    can result in pain, blindness and amputation.


    This book reads like an adventure story; it is an amazing journey of discovery.
    It is also packed with insights and valuable information. Without giving you any
    false hopes, it contains what you might need to know to be able to escape from
    your own type 2 diabetes. The final chapter lays bare some of the myths and misconceptions
    that surround the endless confusion of healthy eating.


    All I can say is that as a result of meeting up with Professor Roy Taylor my type
    2 diabetes has gone away and I have taken no tablets for the last seven years.


    You too could have a lucky meeting with this book.

    Stay well.


    ## How to use this book


    Some books are to be swallowed whole, others to be browsed or enjoyed in part.


    For people with type 2 diabetes who wish to escape without delay, Chapter 7 might
    be where it is opened. For anyone interested in how the body normally cops with
    food and what goes wrong to cause the metabolic mayhem of type 2 diabetes, Chapters
    1 to 6 come first. For people in a hurry, the essence of the book can be picked
    up in minutes by reading the Quick boxes at the end of each chapter, and maybe
    looking at the pictures.


    But if you would like to read a story of scientific adventure, and understand
    how your body deals with food, then the Lewis Carroll approach is for you: start
    at the beginning, go on to the end, then stop.


    The book provides information but not personal medical advice. If you are already
    on treatment for diabetes, do discuss with your doctor or diabetes nurse before
    making changes.


    ## Introduction


    Seven days? Just seven days to slay the monster?


    For centuries, doctors have regarded type 2 diabetes as a life-long disease. A
    disease that can cause great misery – threats to eyesight, to limbs, to the heart
    – and one that gets worse and worse, needing more and more tablets and eventually
    insulin. The moment your doctor says, ‘You have diabetes’, life changes. It is
    a hammer blow. Your health suddenly appears very fragile. The future is uncertain.


    But suddenly, there on the page was a potential breakthrough – the final piece
    of a jigsaw that made type 2 diabetes look simple and reversible. It was 2006
    and I was sitting where I am now, at my desk. Reading scientific journals and
    keeping up with the latest information about diabetes is part of my job, and I
    had just turned over a page in one of the leading diabetes publications. The graph
    hit me between the eyes.


    It showed what happened to blood sugar in the days immediately after bariatric
    surgery in people with type 2 diabetes. The graph line plunged from the usual
    high level on the day before surgery all the way down to absolutely normal by
    day seven. Normal blood sugar levels? In seven days? That had never been seen
    before. No other treatment could achieve this dramatic normalisation. All the
    research of the previous decades seemed to come together in a flash. But could
    it be true?


    But this story really starts in 1970, when as a student at Edinburgh Medical School
    I attended a series of lectures by Professor Reginald Passer, in which he explained
    physiology as a sequence of logical thoughts. Physiology is the science of how
    the body works. I can still see his tall, frame topped with grey hair as he laid
    out clear lines of reasoning – always with a dry sense of humour. It was riveted
    as he demonstrated that commonly accepted ‘knowledge’ could be reassessed by clear
    thinking and using solid logic about how things work. How certain or uncertain
    could we be about common beliefs? This was exciting. Suddenly, ‘facts’ could be
    seen to be merely links of varying reliability. Anything could and should be re-examined
    in the light of new information. After all, Newton seemed to be conclusively correct
    about his laws of motion and gravity from the 17th century onwards, by Einstein
    showed that they were not exactly correct. In turn, current knowledge shows that
    Einstein was not entirely correct – subatomic particles do not obey the theory
    of relativity.


    But Passmore will be forever correct in having that knowledge should be continually
    reassessed, especially in supporting medical decisions, where any part of the
    accepted framework of ‘facts’ must remain open to repeated scrutiny as new concepts
    emerge.


    Skip on a few years and, as a newly qualified doctor, I became fascinated by the
    way in which all the hormones in our bodies work together to help control our
    health, and in particular, by the fact that the hormone insulin doesn’t function
    properly in people with type 2 diabetes. I spent a number of years trying to understand
    the link between insulin and diabetes. During this time I continued to work as
    a doctor, mainly dealing with medical emergencies as they came into hospital,
    but gradually specialising more and more in diabetes.


    In 2006, I had brought together, as part of a multi-pound research project at
    Newcastle University, brilliant physicists with state-of-the-art scanners to create
