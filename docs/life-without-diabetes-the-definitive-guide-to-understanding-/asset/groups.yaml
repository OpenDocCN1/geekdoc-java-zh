    population (unlike for the wealthy few) is still unfolding, and it is not good
    news. We are undergoing a gigantic experiment on the human condition. In our present
    environment, it seems the biological elites have become disadvantaged.


    As a result of evolution, we have developed sophisticated mechanisms to promote
    eating behaviour. Neural mechanisms in the brain and clever hormones acting on
    the brain encourage us to find food and increase the chances of survival.


    Yet we have evolved absolutely no mechanism to prevent accumulation of food energy.
    The problem is that we can still feel hungry, even though the body may be groaning
    under the influence of excess fat. Overall, if you are a person who has tended
    to increase in weight after the age of 21, you should be proud of your genes -
    but look to your environment and eating habits for salvation.


    Let''s take a look in your cupboards. Ideally there will be no biscuits. There
    will be no crisps or small snacks. There will be no cakes or sweets. Why would
    you voluntarily push calories into your mouth during meals? You know from reading
    the earlier chapters of this book that your body is designed to work just without
    any food for long periods. Between lunch and dinner is only a few hours.


    How about your fridge? It is worth reiterating that the fridge should contain
    a jug of tap water (so if you feel desperately peckish, you can drink a pint of
    cold, refreshing water). For special occasions or just for a change, there will
    be a few bottles of sparkling water. Your fridge will never contain fruit juice
    or smoothies. These dangerous calorie bombs contain far too much sugar, which
    slips down your throat and does not satisfy hunger. In our current environment,
    contrary to the claims of seductive advertisements, there is nothing healthy about
    fruit juice or smoothies.


