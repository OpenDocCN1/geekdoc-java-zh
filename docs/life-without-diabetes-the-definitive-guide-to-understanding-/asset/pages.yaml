    # Looking inside the beta cell


    Back in the early 1990s, Roger Unger, one of the brilliant minds of diabetes,
    did a study involving rats that demonstrated that susceptibility to fat in the
    beta cells came down to a single defective gene. That gene determined whether
    or not an animal would develop type 2 diabetes when overfed.


    Unger and his team took beta cells from young rats with the diabetes well before
    diabetes had developed and incubated the cells with fat for several days. What
    Unger and his team found was that the fat impaired the cells'' ability to make
    insulin in response to glucose. That was interesting in itself.


    They then ran the same experiment on rats that were similar in all respects except
    that they did not have the gene defect conferred susceptibility to diabetes. Beta
    cells from these rats tested with fat exposure carried on making insulin normally.
    The excess fat had no effect, proving that the ultimate susceptibility to diabetes
    lay in the beta cells themselves.


    The full implications of Unger''s work have lain dormant for almost three decades.
    Knowing about the Personal Fat Threshold in humans, we can now see that, in a
    stroke of brilliance, he had laid the groundwork for understanding why obese people
    did not usually get type 2 diabetes. The single major gene defect in unusual rats
    showed a basic biological mechanism. Detailed genetic studies in humans have shown
    that there is no one gene for susceptibility to type 2 diabetes, and it is almost
    certain that susceptibility must be determined by a number of genes, each contributing
    a little. Just like the story of the lipodystrophy gene, which led the way to
    the demonstration of the genetic basis determining the maximum storage capacity
    of the fat layer under the skin, it helped understand how different combinations
    of many weaker genes determine how susceptible your beta cells are to fat accumulation.


    Armed with this insight, scientists can now ask focused questions. Which human
    genes contribute most to susceptibility to the toxic effect of fat? How do they
    interact? Are separate'
