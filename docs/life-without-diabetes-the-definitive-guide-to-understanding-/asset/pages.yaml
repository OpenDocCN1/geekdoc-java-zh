    – the hypos. You may find your blood glucose is pushed too low in an entirely
    unpredictable manner. This can cause all kinds of problems in day-to-day life–
    for instance when driving, climbing up ladders, or just postering around the kitchen.
    The driving implications are serious, and when you first go on insulin your driving
