  md: '# How to use this book


    Some books are to be swallowed whole, others to be browsed or enjoyed in part.


    For people with type 2 diabetes who wish to escape without delay, Chapter 7 might
    be where it is opened. For anyone interested in how the body normally cops with
    food and what goes wrong to cause the metabolic mayhem of type 2 diabetes, Chapters
    1 to 6 come first. For people in a hurry, the essence of the book can be picked
    up in minutes by reading the Quick boxes at the end of each chapter, and maybe
    looking at the pictures.


    But if you would like to read a story of scientific adventure, and understand
    how your body deals with food, then the Lewis Carroll approach is for you: start
    at the beginning, go on to the end, then stop.


    The book provides information but not personal medical advice. If you are already
    on treatment for diabetes, do discuss with your doctor or diabetes nurse before
