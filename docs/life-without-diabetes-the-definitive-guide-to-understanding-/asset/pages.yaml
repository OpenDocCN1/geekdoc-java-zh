  md: '# Kevin’s Smoky Sofrito


    Kevin perfected his sofrito during one of our studies, adding paprika to a classic
    tomato sauce to give extra smoky depth. It can be used as a sauce for other veg
    recipes, or cold as a dip for raw veg sticks. Make a batch at weekends and keep
    it in a jar in the fridge to use as required during the week.


    Prep: 10 minutes; cook: 1h 15 minutes for a beautiful flavour – can be reduced
    if you''re in a hurry; makes 4 servings as a main dish (e.g. sauce for a whole
    meal) or 6-8 if used as a base or a side dish (e.g. ratatouille).


    # INGREDIENTS


    +   1 tablespoon olive oil

    2 large onions, finely sliced

    3 garlic cloves, finely chopped (or 3 tsp garlic paste)

    2 sweet pointed red chillies, deseeded and chopped into 2cm pieces

    4 teaspoons smoked paprika

    1 teaspoon hot (picante) paprika Pinch of salt

    2 tins of chopped tomatoes


    # WHAT TO DO


    +   1. Heat the oil in a large flat-bottomed pan over a low heat.

    2. Add the onions and garlic and cook for 15 minutes.

    3. Add the chopped red chillies to the pan and cook for another 5 minutes.

    4. Add both paprikas and a pinch of salt, stirring well with a wooden spatula.

    5. Turn up the heat to medium and add the 2 tins of chopped tomatoes. Stir well.

    6. When the sauce starts to bubble, turn the heat back down to low and simmer
    for 40 minutes.

    7. Remove from the heat and allow to cool, then blend to a smooth paste with a
    hand blender or food processor.


    The following recipes suggest a few ideas for using this versatile sauce during
    the very low-calorie diet stage.'
