    # What did you do with your cornflakes?


    Twenty-five years ago, I carried out some research in America which showed where
    you store away your meal carbohydrates. I had to work for a year at Yale University
    with my friend and colleague Jerry Shulman, after his team had discovered how
    to measure the level of glycogen in the body using special techniques on an MRI
    scanner. This was a game changer in terms of understanding what happens to the
    body after eating because for the first time its secrets could be probed without
    needles. Most carbon is non-magnetic, exactly 1.1% of all carbon in nature is,
    a slightly different form, known as carbon-13. And this, we now knew, could be
    measured using a very powerful MRI scanner. Changes in the level of carbon-13
    exactly mirror changes in all carbon.


    As a first step, we measured the levels of glycogen in a group of healthy people.
    There are only two storage depots for carbohydrates – the liver and the muscles
    – and we found in these people about a third of the carbohydrate in a meal was
    stored in muscles and about a fifth in the liver. It took four to five hours after
    a meal for all the carbohydrate to be stored away (see figure 3.4, left).'
