    took in UKPDS has provided the majority of today''s conventional knowledge of
    type 2 diabetes. Such are the pitfalls of ''accepted beliefs'': because type 2
    has come to be associated with being overweight, even most diabetes experts today
    will look at the study''s results and believe their assumptions confirmed. What
    they may not appreciate is that the population studied in UKPDS looked very different
    from any average group of people with type 2 diabetes today. Only one in 14 people
    back then was obese and and astonishing, from today''s perspective, one in three
