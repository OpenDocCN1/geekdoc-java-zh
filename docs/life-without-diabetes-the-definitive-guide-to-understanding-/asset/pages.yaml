    # No one size fits all


    The common notion that there is one ''healthy diet'' deserves great scepticism.
    A single pattern of eating that is best for all individuals is improbable. Individuals
    differ markedly in food preferences and cultural habits. What is a healthy diet?
    Is it really the idealised plate of shiny vegetables often pictured in magazines?


    Then bear in mind that your body sees little of the food you eat. It is broken
    down to its component parts in the gut, and these are then pounced upon by your
    liver. And as we know, it is your liver ultimately decides how much of what kind
    of fat goes where, and what happens to the glucose. It gets first helping to decide
    which proteins to reassemble. But there is one respect in which what you eat calls
    the shots, and that is regarding the quantity. It is not correct to say that you
    are what you eat — you are how much you eat.


    If your weight has gone up by more than a small amount since your mid-20s, then
    your diet has not been entirely healthy. Excess fat inside your body is a greater
    risk to health than the kind of food you consume. Excess fat inside your organs
    is threatening, whereas the risk conferred by any given pattern of eating depends
    largely upon calorie balance. Almost all long-term studies of foods and health
    have been conducted in populations steadily gaining weight. That is a critically
    important factor overlooked by many opinions on how to eat for health.


    There are a number of general approaches that might help you limit your overall
    calorie intake. Try these one by one. Only you can'
