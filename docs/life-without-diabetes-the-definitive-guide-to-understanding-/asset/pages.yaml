  md: 'fine, even with your type 2 diabetes. This is because liver gets the hint that
    it needs to store glycogen whenever the blood glucose level rises. Liver cells
    have no barrier to glucose as it floods into them, and is then turned into glycogen.
    That is okay, but the liver can store only a relatively small amount of glucose
