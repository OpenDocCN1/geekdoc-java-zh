  md: 'simple, effective test have become part of routine healthcare in the UK since
    the 1980s. Picked up early enough, deterioration can be prevented by specialist
    eye treatment for most people.


    Also, present-day knowledge about blood pressure in diabetes has led to early
    treatment being widely advised. It is now relatively simple to reduce blood pressure
    to acceptable levels – unlike glucose. Active treatment of blood pressure has
    had a big effect, in particular, on decreasing the chance of glucose-induced kidney
    failure. A simple annual urine test gives a good early warning of any trouble.


    Another important element of these days is the advice to take off your shoes,
