  md: 'Sadly, very large observational studies tend to attract a lot of attention.
    Even worse is the influence of what is inappropriately called ‘evidence-based
    medicine’. While definite information is exactly what we seek and use in medicine,
    the term ‘evidence-based medicine’ ‘meta-analysis’ describes a belief system that
    places a process known as ‘meta-analysis’ at the top of the list of quality of
    evidence. Large, carefully designed studies are important, and each deserves careful
    consideration. But meta-analysis is merely the process of adding together results
    from different studies – and believing the result of this must be correct. It
    takes little account of the vital details of the individual studies that a true
    expert would examine, such as the exact methods used in each study. It is also
    open to bias regarding which studies are selected for inclusion. Even worse, it
    ignores a vital practical point. The size of any one study is designed in a way
    that allows a clinically important effect to be detected, if present. An appropriate
    number of people are included so that such a clinical effect would be statistically
    significant. By lumping together lots of studies which show no significant effect,
    meta-analysis allows tiny effects to become significant – in a statistical sense
    only. And such a minuscule effect may not be relevant to any one individual. The
    headlines may shout that a certain food or drug can shorten life, in fact this
    could be by a few hours over a lifetime.


    Observational studies on populations provide invaluable information on patterns
    of disease. But knowledge about the ‘cause’ of any intervention study simply cannot
    be obtained at the same time. A specific interpretation is necessary.


    Inappropriate interpretation of information becomes perpetuated by meta-analysis.
    Eventually, thankfully, this unfortunate belief system will drop out of common
    usage, but for the moment, the media and government agencies are bedazzled by
    large numbers.


    # Understanding risk


    Let’s put risk into perspective. Many health stories in the report that eating
    in a particular way or taking a particular drug will decrease the chance of developing
    some disease by a certain percentage. Let’s say by 25%. That sounds somewhat persuasive
    and worthwhile, but in fact it is likely to be a small change. The reason is that
    the 25% figure is not about your real risk. It is the risk *relative* to some
    other group.'
