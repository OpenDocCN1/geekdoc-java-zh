    It may seem strange, given the way type 2 diabetes is portrayed and reported on
    now, but back in the 1970s and early 1980s it was accepted that obesity had nothing
    directly to do with the cause of type 2 diabetes. Several well-known studies seemed
    to show this. As a young doctor, I myself reviewed all the best evidence and published
    a summary concluding that there was no link! How could this be? We now see that
    the few obese people around the time would have had an increased risk of type
    2 diabetes but the effect overall was undetectable because the small number of
    obese people.


    Where was the obesity in UKPDS? Good question. The nature of type 2 diabetes was
