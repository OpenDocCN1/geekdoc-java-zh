  md: '# Recipe section


    In planning the original diet for the Counterpoint study, I knew that life was
    not solely about metabolism. The gut has to be kept happy. On a liquid formula
    diet, constipation is very likely. For that reason we advised adding in some non-starchy
    vegetables to provide additional fibre – and this worked. Also, people miss simply
    chewing – texture and crunch are great! We provided some simple examples to follow,
    and were pleased when our research volunteers came back to us with their own ideas.


    This section gathers some of the recipes devised by the people who know: those
    who actually followed the 1,2,3 approach to losing weight. They include dishes
    not just for the very low-calorie stage at Step 1, but also for Steps 2 and 3,
    when we are slowly returning to a ‘normal’ way of eating, adding foods containing
    protein and a little carbohydrate. You could turn these recipes into a shopping
    list for those ingredients you don''t have, and stock your store cupboard, fridge
    and freezer in preparation.


    A word on vegetables: even if you don''t particularly like them you may surprise
    yourself. Just try some of the ideas. Ideally, you would nibble on various raw
    veg daily before starting the low-calorie diet, as the more times your taste buds
    are exposed to new flavours, the more they come to them. Have an open mind and
    try things you didn''t like previously. The aim is to find enough of a range of
    vegetables that you can eat and enjoy in order to carry you through the low-calorie
    diet and beyond.'
