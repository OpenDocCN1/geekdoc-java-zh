  md: 'On that sheet of paper, the ideas gradually settled into a pattern that reflected
    what we knew. There had to be two vicious cycles that interacted. The first happened
    in the liver. By taking a mouthful or two more food each day that your body actually
    needs, you very gradually increase your liver fat levels. This is exacerbated
    by the fact that, because your muscles have been relatively insulin-resistant
    from birth, they do not store the normal amount of glucose after each meal. Instead,
    the glucose is taken up by the liver and turned into fat. The gradually increasing
    insulin resistance causes the liver to make more glucose and your poor beleaguered
    pancreases to make a little insulin.


    But it is a fact of life that insulin actually speeds up the conversion of glucose
    to fat in the liver... and so the whole unfortunate cycle begins again, causing
    the level of liver fat to go up further, with all the unfortunate knock-on effects.


    Figure 5.1 shows how these events are linked.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_71_0.png)


    **5.1 Twin cycle hypothesis: First of the twin cycles – the vicious cycle in the
    liver.** An extra mouthful of food daily over a long period of time causes fat
    in the liver to build up. This makes the liver unable to respond properly to insulin.
    Blood glucose starts to creep up and this causes higher background levels of insulin.
    This insulin then oils the wheels for glucose to be turned into liver fat.'
