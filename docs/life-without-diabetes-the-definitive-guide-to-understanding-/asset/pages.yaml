  md: '# A murder mystery and the Twin Cycles


    # Who dunnit?


    There had been disappearances and murder was suspected. The victims were the beta
    cells. When pancreas tissue from people with type 2 diabetes was looked at under
    a microscope, it seemed that half of the beta cells had simply disappeared. Missing,
    presumed dead. And in people whose diabetes had been longstanding, almost two
    thirds of the cells had gone. It appeared conclusive that the beta cells were
    being murdered, one by one. What was going on? Could the killer be brought to
    justice?


    In 2006, as described in the introduction, I came to face with that graph showing
    that the high blood glucose levels in type 2 diabetes could be normalised in seven
    days. The scientific paper reported this was due to bariatric surgery, carried
    out to bring about weight loss in very heavy people. The authors suggested that
    the rapid change in blood glucose might be due to hormones made by the gut – incretin
    hormones. It was 35 years since I had listened as a medical student to Professor
    Reginald Passmore predicting the existence of these hormones, and they had subsequently
    identified. It was pleasing to see how correct his scientific deduction had been.
    But these incretin hormones were extremely unlikely to be the reason early-morning
    blood glucose levels had so rapidly changed, as described in the paper. Incretin
    hormones simply could not do that. They do not have a major effect on blood glucose
    overnight and in the early morning; they work almost entirely after meals. And
    we know that those people undergoing stomach surgery had not eaten anything in
    the seven days since the operation. No meals — no increase in'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'incretin hormones. All of this was a valuable insight. Because if the incretin
    hormones were not causing the glucose to change then something else was.


    # Details of the case


    In type 2 diabetes, half the beta cells seemed to have been murdered. Who were
    the suspects? From the Passmore insights, Mr Incretin seemed to have an alibi.
    Other popular villains included the mysterious Ms Amyloid and Mr Inflammation.


    Amyloid is a substance that is sometimes observed in the islets of people with
    type 2 diabetes. Belief in amyloid as a cause of beta cell death in type 2 diabetes
    became widely established in the 1980s, but on the flimiest of evidence. It has
    lurked as a potential villain, since on theoretical grounds, although Ms Amyloid
    might have the means she is only occasionally present at the scene of the crime.


    Inflammation can cause lots of problems in many different parts of the body. It
    can sometimes be a killer - for instance, in ‘childhood’ or type 1 diabetes. In
    that very type of diabetes, an immune attack by inflammatory cells is absolutely
    central to the problem of beta cell death. In type 2 diabetes, the extent of inflammation
    seemed insufficient to be threatening as a murder weapon. Mr Inflammation was
    not high on the suspect list, either by means or by presence at the scene.


    Step forward, Mr Liver. Research in Newcastle and elsewhere had shown how the
    liver controls blood sugar at all times. It controls the flow of glucose both
    during the night and after eating – rather poorly in people with type 2 diabetes.
    And we know that the liver sets the blood glucose level in response to insulin.
    Over the eight years leading up to that important day in 2006, we had been researching
    the effect of fat inside the liver and had discovered that excess fat was potent
    in preventing insulin doing its job. The fat itself was making the liver insulin-resistant.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'My close colleagues at Yale University in the US, Kitt Petersen and Jerry Shulman,
    had shown just the previous year that moderate food restriction over a couple
    of months could improve liver fat levels. And that this in turn improved the response
    of the liver to insulin. I worked with Jerry and Kitt, living beside Long Island
    Sound in 1990-91, and knew how carefully they conducted scientific studies. Their
    work, my work and all previous observations on liver fat suddenly clicked together
    to explain the dramatic normalisation of blood sugar only seven days after bariatric
    surgery. It also explained what might be happening to the beta cells.


    # Deduction


    It went like this: the people in the bariatric surgery study were of course very
    heavy. That is why they were having the operation. It was simple to work out approximately
    how many calories they would need every 24 hours to stay alive. We would require
    at least 2700 calories every day, just lying in bed all day, not moving a muscle.
    That is more than the average person eats even when they are moving around. Before
    a surgeon operates on the stomach, of course, no eating is allowed for least 12
    hours. The usual food intake for these people had suddenly dropped, from a very
    considerable amount to zero on the evening before surgery, when the nurse hung
    a sign on their bed: ''nil by mouth''. The body must stay alive – and still need
    2700 calories to do so day. Over the seven days following the operation, seven
    times this amount would need to be found – a total of 19,000 calories. A small
    number would be provided by supporting fluids into a vein, but the vast majority
    would have to be found elsewhere.


    Fortunately for all of us, our bodies are built for survival, with stores for
    a rainy day. And just look at that available fuel, sitting there in the liver
    poised for action. The heavier the person, the more likely they are to have large
    amounts of fat inside the liver. We knew that this particular store of fat is
    used first. It is far easier for the body to mobilise energy fat from the long-term
    storage depot under the skin. So it seemed likely that in those bariatric patients
    the liver fat levels might have dropped rapidly. Supposing that had caused the
    insulin response of the liver to decrease equally rapidly? In turn, the sudden
    return of a normal response to insulin would surely'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'switch off the previous outpouring of glucose. Very suddenly. According to
    this reasoning, the rapid change in blood glucose could be a simple consequence
    of using excess liver fat and nothing to do with the beta cell.


    So maybe the rapid normalisation of blood glucose was not due to the surgeon''s
    undisputed and fantastic skill but just reflected that sign hanging on the bed
    - nil by mouth? Of course, people can eat again a week or so undergoing that particular
    type of surgery, but their stomachs will have been cut down to a fraction of the
    original size (to approximately the size of your thumb). They continue to be very
    limited regarding how much food they can consume. Therefore the sudden improvement
    in blood glucose would surely be maintained.


    But what about the presumed murder scene? What about the change in blood glucose
    at seven days was nothing to do with them? They could not be expected to recover
    magically in a week, whoever the villain out to be.


    Remember that type 2 diabetes behaves in populations though there was a simple
    case. If - just what if - the drop in fat content of the pancreas? Could this
    allow normal function of the pancreas to return, in such a way insulin could be
    made normally again? If it was all due to excess fat, as in the liver, then there
    might indeed be one simple cause for type 2 diabetes, not separate cases in different
    organs, as had been believed.


    Visions of liver, fat, beta cell and life appeared in a glorious melange, changing
    places with each other. All the right ideas were there, but to borrow a phrase
    from Eric Morecombe, not necessarily in the right order. One of the most important
    sets of scientific equipment is the blank sheet of paper, a pencil and the human
    brain. Each detail could be written down, considered in relation to other items,
    rubbed out and more. Had there been a murder? What actually caused what? Which
    came first? How are they all connected? It took several months to capture the
