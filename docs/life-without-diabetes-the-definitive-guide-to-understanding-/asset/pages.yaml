    Publication of the results of the Counterpoint study in 2011 was followed by considerable
    interest but also enormous scepticism from experts. After all, there were very
    good reasons why doctors believed that type 2 diabetes was a life-long, inevitably
    progressive condition. Their own experience told them that the condition became
    more severe over years, needing more and more drugs for control. Even more persuasively
    for doctors, large studies on people with type 2 diabetes followed up over many
    years had clearly shown a steady deterioration in control. After 10 years of living
    with the disease, as many one in two people required insulin injections. However,
    one key thing had been overlooked: that all those observations were made on people
    who were undergoing progressive weight gain or at best carrying continued excess
    weight. That is what happens in practice. After diagnosis, most people become
    steadily heavier over the years. So it was true that folk with type 2 diabetes
    tended to get into more and more trouble – but perhaps not inevitably.'
