- img_proc: true
  md: 'scientific jargon) to the pancreas and the liver. What name to choose? Back
    to the paper and pencil. A page was covered with possibilities. Ideally, the name
    would be meaningful. One gradually emerged: ''COUNTERPOINT'' – COUNacting the
    Pancreatic inhibition Of Insulin secretion by Triglyceride. Completely irrelevantly,
    and persuasively for me, the word suggested a favourite novel – Aldous Huxley''s
    Point Counter Point. The study was named.


    In a working life of testing hypotheses, nothing had paved the way for the starkly
    clear results of the Counterpoint study. A group of people with very ordinary
    type 2 diabetes switched to a low-calorie diet, a simple formula diet with non-starchy
    vegetables that I designed merely as a tool to find out the twin cycles could
    be reversed. At the same time, they stopped taking their tablets to decrease blood
    glucose. Within seven days, their levels of early-morning blood glucose had dropped
    to normal – just like after bariatric surgery. All the special tests on liver
    and pancreas confirmed that the hypothesis had predicted – the fat levels these
    organs decreased.


    So it seemed our hypothesis might be correct – at least in people with short-duration
    type 2 diabetes. We had shown that in people who had been diagnosed with type
    2 diabetes no more than four years previously, the imagined twin cycles within
    the liver and pancreas could be reversed to normal. Normal!


    The study produced several surprises. The first surprise was seeing how fatty
    the liver was in people with type 2 diabetes. At the start of the study, their
    liver fat level averaged over 13%, which is above the normal range (up to 5.5%).
    And to us, at the time, this seemed quite extraordinary in people with ordinary
    type 2 diabetes was good going ‘fatty liver disease’. Not a nice condition. It
    is a sign of future heart disease, and it can lead to cirrhosis or worse. Whether
    you have type 2 diabetes or not, knowing that you have too much fat in your liver
    should be a wake-up call.


    The second surprise was how the participants'' blood glucose fell after they started
    the very low-calorie diet (see figure 5.3). Equally exciting was the fact that,
    within seven days, the insulin resistance of the liver had also vanished, as fat
