  md: '# # Introduction


    Seven days? Just seven days to slay the monster?


    For centuries, doctors have regarded type 2 diabetes as a life-long disease. A
    disease that can cause great misery – threats to eyesight, to limbs, to the heart
    – and one that gets worse and worse, needing more and more tablets and eventually
    insulin. The moment your doctor says, ‘You have diabetes’, life changes. It is
    a hammer blow. Your health suddenly appears very fragile. The future is uncertain.


    But suddenly, there on the page was a potential breakthrough – the final piece
    of a jigsaw that made type 2 diabetes look simple and reversible. It was 2006
    and I was sitting where I am now, at my desk. Reading scientific journals and
    keeping up with the latest information about diabetes is part of my job, and I
    had just turned over a page in one of the leading diabetes publications. The graph
    hit me between the eyes.


    It showed what happened to blood sugar in the days immediately after bariatric
    surgery in people with type 2 diabetes. The graph line plunged from the usual
    high level on the day before surgery all the way down to absolutely normal by
    day seven. Normal blood sugar levels? In seven days? That had never been seen
    before. No other treatment could achieve this dramatic normalisation. All the
    research of the previous decades seemed to come together in a flash. But could
    it be true?


    But this story really starts in 1970, when as a student at Edinburgh Medical School
    I attended a series of lectures by Professor Reginald Passer, in which he explained
    physiology as a sequence of logical thoughts. Physiology is the science of how
    the body works. I can still see his tall, frame topped with grey hair as he laid
    out clear lines of reasoning – always with a dry sense of humour. It was riveted
    as he demonstrated that commonly accepted ‘knowledge’ could be reassessed by clear
    thinking and using solid about how things work. How certain or uncertain could
    we be about common beliefs? This was exciting. Suddenly, ‘facts’ could be seen
    to be merely links of varying reliability. Anything could and should be re-examined
    in the light of new'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'information. After all, Newton seemed to be conclusively correct about his
    laws of motion and gravity from the 17th century onwards, by Einstein showed that
    they were not exactly correct. In turn, current knowledge shows that Einstein
    was not entirely correct – subatomic particles do not obey the theory of relativity.


    But Passmore will be forever correct in having that knowledge should be continually
    reassessed, especially in supporting medical decisions, where any part of the
    accepted framework of ‘facts’ must remain open to repeated scrutiny as new concepts
    emerge.


    Skip on a few years and, as a newly qualified doctor, I became fascinated by the
    way in which all the hormones in our bodies work together to help control our
    health, and in particular, by the fact that the hormone insulin doesn’t function
    properly in people with type 2 diabetes. I spent a number of years trying to understand
    the link between insulin and diabetes. During this time I continued to work as
    a doctor, mainly dealing with medical emergencies as they came into hospital,
    but gradually specialising more and more in diabetes.


    In 2006, I had brought together, as part of a multi-pound research project at
    Newcastle University, brilliant physicists with state-of-the-art scanners to create
    the Newcastle Magnetic Resonance Centre. The idea was to develop new techniques
    to look at any organ in the body, but of course my interest was to investigate
    the main organs involved with diabetes. And it was not long after we had established
    the centre that I experienced the eureka moment – that graph with its new concept
    that high blood sugar levels in type 2 diabetes could be normalised in seven days.
    By coincidence we were in a perfect position to carry out the breakthrough studies
    described in this book.


    By 2011, we were able to publish the scientific proof that type 2 diabetes was
    reversible, and within five years to confirm the ‘how’ and the ‘why’ of this apparent
    impossibility. Both the initial proof and the follow-up studies were based on
    the amazing story of how the body manages energy from food.


    You will remember snippets from your school lessons. The heart pumps blood around
    the body, the lungs enable us to take in oxygen and get rid of carbon dioxide.
    But there is one dynamic function, absolutely key to the maintenance of a healthy
    body, of which most people are totally unaware: what happens to'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'food after it leaves the gut. How is the energy supply managed? All will be
    explained.


    Ask someone what type 2 diabetes is and they are likely to tell you that the disease
    is something to do with too much sugar. It is true that diabetes occurs when there
    is excess glucose in the bloodstream – with devastating effects on the eyes, heart
    and brain. However, my research has shown that type 2 diabetes is caused by just
    one factor: too fat in the liver and pancreas. In the normal functioning of the
    body, the pancreas produces insulin to help the liver control the supply of glucose
    to the rest of the body. When there is excess fat in the liver, however, it responds
    poorly to insulin, produces too much glucose and passes excess fat to the pancreas.
    As a result of that, the insulin-producing cells of the pancreas cease to function
    properly.


    It is important to say that you do not have to be obese, or even overlook, to
    have type 2 diabetes. Every individual has their ‘personal fat threshold’ – the
    point at which no more can be taken into their fat cells (in the fatty layer under
    the skin, especially around the thighs and trunk). The fat has to go somewhere,
    and it ends up not only inside the tummy cavity but also inside the main organs
    of the body. If the insulin-secreting cells in the pancreas are susceptible to
    fat-induced problems, this is the tipping point for diabetes. This susceptibility
    is just the luck of the draw, depending on your genes.


    My goal in this book is to make the new understanding of type 2 diabetes accessible
    to all. And by doing so, to help people with this devastating condition, and their
    families, to deal with it as effectively as possible. Drawing on the latest experimental
    insights, I will offer a definitive account of how type 2 diabetes develops. Along
    the way, I will explain the workings of your body and show how our modern lifestyle
    has interfered with the beautifully balanced processes over millennia.


    There is a surprisingly simple solution. One that most definitely involves weight
    loss, but which is not really about a diet. The word ‘diet’ is enough to put anyone
    off. It tends to be associated with an unpalatable change to eating and (usually)
    a failure to bring about desired weight. Our original approach to Newcastle recognised
    that two different phases were required: first, a step change in weight and then,
    a long-term way of living. In our first study we also learned that an additional
    phase, a gradual, managed transition between these two phases was helpful.'
