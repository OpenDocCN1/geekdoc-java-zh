  md: 'A low-calorie diet generally makes gallstones smaller, which means there is
    a small chance that they may squeeze into the biliary duct (through which the
    juices enter the gut), causing pain. Among people with type 2 diabetes, gallstones
    are very common – they are present in around one person in five. In our DIRECT
