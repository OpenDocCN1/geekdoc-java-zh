    2.1 A fire releases energy as heat from the links between carbon atoms in wood.
    The waste carbon is carried away in smoke. The human body releases energy to use
    for both heat and movement from the links between carbons in food. The waste carbon
    is breathed out as carbon dioxide.


    Like animals, plants need to generate and store energy. This happens at a basic
    level as plants forge chemical links by building up chains using sunlight energy.
    To do this, they take up carbon dioxide from the air and link the carbons to create
    highenergy sugars or fats. Plants conveniently store these, and in turn we might
    eat them perhaps as potatoes, rice or cassava or equally, a farmer might feed
    them to other animals, to promote a concentration of energy in milk or meat.


    The bottom line is that, whether we are eating animals or vegetables, food provides
    us with carbon-based energy that allows us to live and work and play. Our bodies
    merely need to direct the right amounts of food energy to storage and the right
    amount to releasing the essential energy, second by second and minute by minute.


