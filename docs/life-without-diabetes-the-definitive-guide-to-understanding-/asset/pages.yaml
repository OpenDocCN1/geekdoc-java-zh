  md: '# Acknowledgements


    Behind every research project is a story about people. The adventures in science
    and medicine which are described in this book involve many individuals to whom
    I am enormously grateful for their skills, knowledge and dedication. None of this
    excitement and discovery would have been possible without the people who volunteered
    to give up a slice of their lives, repeatedly lying in scanners and parting with
    armfuls of blood. Taking part in clinical research calls for a high degree of
    altruism, and this is highly appreciated. I hope that the whole picture that they
    helped to create. Many outstanding scientists have worked so hard on the projects
    described, developing ways of testing the body never previously possible. Each
    project also required a doctor interested in gaining experience of clinical research,
    to enroll participants, to carry out the hands-on special tests and to gather
    the data. These diabetes specialists of the future spend a few years in research
    as a way of enhancing clarity of thought in clinical diagnosis and interpretation
    of data. They are all now consultant physicians specialising in diabetes, so their
    patients can tell you whether it worked! Several senior colleagues have collaborated,
    permitted research at the interface between different areas of expertise.


    As early work depended on taking tissue samples of fat or muscle, without discomfort,
    I was excited to hear that techniques using magnetic resonance (MR) rather than
    needles had been developed at Yale University. Professor Jerry Shulman welcomed
    me to his team for a one-year visit in 1990-91. Without the insights and ongoing
    collaboration with Jerry and also Professor Kitt Petersen, type 2 diabetes might
    still be regarded as an incurable, progressive disease.


    Dr Parag Singhal spent a whirlwind year with me, and identified the big diabetes
    problem of the liver making too much glucose. His careful work with people, backed
    up by the mathematical brilliance of Professor Claudio Cobelli of Padova, laid
    the basis for the Twin Cycle Hypothesis. Some years later, Dr Peter Carey came
    to work with me before the Newcastle Magnetic Resonance Centre'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'had been built, and our research volunteers agreed to travel from Newcastle
