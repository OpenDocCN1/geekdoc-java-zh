  md: 'consumption. ''It counts as one of your 5-a-day.'' Advisory bodies have been
    woefully slow to exclude these calorie-dense soft from the slogan.


    The idea emerged as a fb. Cross-sectional studies clearly showed fruit and vegetable
    consumption to be linked to worse health outcomes. It seemed to be a no-brainer.
    Then a number of intervention studies were done to measure how great the improvement
    in health was after changing to 5-a-day. Well-designed intervention studies (to
    my knowledge) failed to show significant benefit. For instance, in one meta-analysis,
    only three out of 18 cross-sectional studies showed a meaningful relationship
    with heart or stroke disease, but slight associations led it to conclude that
    there was a clear benefit in the 5-a-day message. There is a fundamental flaw
    with the concept. It assumes that portions of fruit and veg have essential health-giving
    properties. Antioxidants and micronutrients are mentioned without evidence of
    relevance. Although all experts on nutrition are likely to agree that eating fruit
    and vegetables contributes veryfully to a wise pattern of eating a wide range
    of foodstuffs, the 5-a-day slogan has not been shown to improve health.


    It appears most likely that it is not consuming a certain amount of vegetables
    or fruit that is important, but rather eating veg or fruit instead of more caloric
    food. The health associations observed in the cross-sectional studies presumably
    were in people who ate relatively less food but relatively more vegetables. Merely
    adding vegetables or fruit is unlikely to add to health, as the eating of calorie-dense
    foods just continues. On the other hand, not eating a cake but instead having
    an apple could improve health in the majority. Instead of more potato, maybe more
    leeks?


    This clarification of best-possible information should not be taken to suggest
    that vegetables are not an overall goal for most people. Perhaps the slogan could
    usefully rephrased as ''5-insteads-a-day?


    # 6. Magic foods


    The notion of ''superfoods'' that have special benefits is widespread. Celebrities
    sometimes attribute their body shape, their glowing skin and their energy to individual
    foods. Magazines and papers love the concept. Cue attractive pictures of marvellous
    items of'
