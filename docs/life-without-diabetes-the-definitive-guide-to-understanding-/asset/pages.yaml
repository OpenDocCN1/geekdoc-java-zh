    # Why do I feel cold?


    Some people feel cold all the time while losing weight. A common misconception
    is that this is due to the thinning of the insulating layer of fat under the skin
    – a most unlikely explanation since coldness tends to come on so soon after starting
    to lose weight. Feeling cold is more likely to be caused by the smaller amounts
    of heat generated by the body when deprived of calories. The only thing you can
    do is wrap up warmly (thermal vest?) and accept it as a better option than being
    too heavy and too sweaty.


    # Will my thinning hair regrowth?


    This is unusual, but the answer is yes – providing that is due to the sudden change
    in nutrition. A few people notice hair loss after weight loss. In fact, under
    any unusual circumstance (exams, pregnancy, family illness) the growth cycle of
    hair follicles tends to become synchronised, which means that instead of losing
    the normal 70 hairs per day as they come to the end of their growth cycle and
    fall out, several hundred fall out every day for a short time. But don’t worry
    – they will all grow back over a few months.


    # How can I fix my constipation?


    There are people who, despite chomping through a large plate of lettuce, celery,
    peppers and tomatoes every single day, find that they are still constipated while
    dieting. What to do? The simplest thing is to ask your own doctor to prescribe
    a medicine that will bulk up your bowel movements.


