  md: 'Medical research is expensive, and a study cannot be carried out without funding.
    Obtaining the funding is very much like the TV programme Dragons’ Den (or Shark
    Tank), in which business ideas are presented to a panel of potential investors.
    Competition is stiff and the panel members are hard-headed and critical. Scientific
    grant applications take months of evening and weekend work to prepare and submit.
    Then the application is sent to half a dozen international experts for their critical
    review. After that, the Dragons (scientists) on the grant-funding committee discuss
    both the application itself and the expert opinions. Then they prioritise all
    applications, and the few (only one in 10) funded. I applied to Diabetes UK, the
    largest funder of diabetes research in the UK. My application had appeared doomed
    after scathing review and sceptical discussion. What a wild and wacky idea. But
    just one panel member pointed out that in the unlikely chance the hypothesis was
    correct, it could be very important. That person argued that for the modest cost
    involved it was worth a point. The application was successful!


    The chase began to find out whether the Twin Cycle Hypothesis was wrong – right.
    We would do this by asking people with type 2 diabetes to lose a lot of weight.
    This meant that a sudden drop in food intake would be the only change, with no
    other complicating factors such as surgery. If their blood glucose stayed high,
    and we would have shown the hypothesis to be wrong and we could go back to the
    drawing board. If their blood glucose normalised, type 2 diabetes would have been
    shown to be reversible. Just as importantly, we would be able to use our MR methods
    to test whether the mechanisms predicted were correct. We would be able to observe
    what happened as diabetes changed back to normal – and this would show in reverse
    how diabetes developed. In other words, might be able to identify the cause of
    type 2 diabetes.


    # Testing the hypothesis


    # The Counterpoint study


    Research studies are like people – they need a name and soon take on a life of
    their own. Most study names are modified acronyms. Our first study had to counteract
    the effect of fat (‘triglyceride’ in'
