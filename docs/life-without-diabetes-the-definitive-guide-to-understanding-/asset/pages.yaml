  md: 'The graph opposite shows the wide range of blood insulin levels in a large
    group of healthy people.


    All organs in the body usually work at rest less than their maximum capacity.
    Your heart rate at rest be around 70 beats per minute, although if you feel your
    pulse while climbing stairs it might be over 100 beats per minute. Yet your maximum
    heart rate could be as high as 180, depending on age and fitness. Also, you probably
