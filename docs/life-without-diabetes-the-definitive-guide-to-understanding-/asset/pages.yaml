    shows the level in a group of healthy people.


    But every pancreas has its limits, and when an insulin-resistant person builds
    up too much fat inside the pancreas, it may become unable to compensate fully,
    and that does become a problem, as we see later.


    # Quick, more energy!


    When your body is just ticking over at rest, fat can provide the energy for the
    muscles. But if you catch that bus, the burst of muscle action can only be fuelled
    by glucose. For instance, imagine your ancestors chasing after dinner with a spear.
    After no food for a couple of days, blood glucose levels would still be normal.
    If there was a sudden need to run – perhaps on hearing the shout of ‘Lion!’'
