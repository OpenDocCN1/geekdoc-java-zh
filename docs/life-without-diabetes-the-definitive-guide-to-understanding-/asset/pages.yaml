  md: '# 4


    # # Type 2 diabetes: a bad case of food poisoning


    Even water can be bad for you – in large quantities. Simply by drinking far too
    much you may die. Water intoxication is a real thing. Although we may think of
    a poison as a substance that is inherently toxic, in reality it is often the dose
    of the substance that dictates the harm. For instance, vitamins are essential
    for life, but some can be toxic if too large a quantity is taken. Alcohol can
    enhance enjoyment of life in small doses, but it can lead to serious illness and
    death in excess.


    In the same way, food can enhance enjoyment of life. But, sadly, if you take even
    a little more than your body needs over a long period of time, you will run into
    problems. For those who are susceptible, the most hazardous of these problems
    is type 2 diabetes. Most people can deal with excess amounts of food without getting
    diabetes. The arbitrary cut-off which defines ‘obesity’ has nothing to do with
    type 2 diabetes you do not have to be obese to develop the condition. You simply
    have to be susceptible to excess fat... in the wrong place. That is the key to
    understanding why the insidious long-term poison of excess food might or not bring
    about diabetes.


    The term ‘food poisoning’ has traditionally been used to describe acute upsets.
    But perhaps it is now appropriate to broaden its use, to draw attention to the
    chronic problems in our society today caused by the constant availability of food.


    If you have type 2 diabetes, your body will have more food than it needed to burn
    off over many years. Your fat stores will be full to the brim. In fact, your body
    will be drowning in excess chemical energy. And when fuel tanks overspill, there
    are inevitably serious consequences. This chapter describes what is going on in
    your'
