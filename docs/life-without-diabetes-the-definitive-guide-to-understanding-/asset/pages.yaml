  md: '# What are ‘non-starchy’ vegetables?


    ''Non-starchy'' is a useful way of distinguishing the vegetables that it''s good
    to eat from the ones to avoid, but of course all vegetables have small amounts
    of carbohydrate.


    # Green leafy vegetables


    | Lettuce and other salad leaves | Broccoli | Cabbage | Spinach |

    | Pak choi | Kohlrabi | Kale | Collard greens, cavolo nero |


    # Other vegetables


    | Fresh tomatoes | tinned Sugarsnap peas | Carrots & pumpkin | Cucumbers |

    | Capsicum | Mushrooms | Radishes | Besprouts |

    | Peas | Spring onions | Onions / shallots | Water chestnuts |

    | Okras | Artichokes | Cauliflower | Asparagus |

    | Green Beans | Zucchini | Brussel sprouts | Leeks |

    | Eggplants | Turnip/swede | Celeriac | Fennel |


    # And avoid


    Potatoes, sweet potato, parsnip, yam, plantain, cassava, sweetcorn beetroot due
    to their higher starch content. All fruit, nuts and seeds – as these are far caloric.


    # Dressings, fats and oils


    A small amount of fat adds flavour and texture to vegetable recipes. As they are
    high in calories, be very careful with portion sizes during this stage. Not more
    than once per day, you could add:


    +   * 1 tsp olive oil

    * 1 tsp oil-based salad dressing

    * 1 tsp mayonnaise or crème fraîche

    * 1 tsp pesto paste

    * 1 tsp butter

    * 1 tsp coconut oil


    # Herbs, spices and flavourours'
