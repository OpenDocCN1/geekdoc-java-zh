  md: 'Having too much fat inside it, your liver very reasonably tries to shunt it
    off to safe storage under the skin, increasing the rate at which it exports fat
    into the blood. Some people have almost unlimited safe storage capacity for fat,
    and if so, diabetes may not happen for a long time. But in some people this depot
    under the skin is already full, and so the level of fat in their blood stays too
    high.


    Have you ever had a full cupboard, been forced to put things elsewhere and then
    been annoyed by them being left in inconvenient places? Imagine the rest of your
    body being exposed to long-term high levels of fat in the blood. Eventually, the
    fat is going to build up in inconvenient places. One such place might be inside
    the pancreas.


    # Then, the pancreas cycle


    Back to that piece of paper. Assuming the presence of fat in the pancreas did
    gum up the works and prevent insulin from being made rapidly after meals, we could
    expect a gradual blunting of the normal insulin response to eating, which in turn
    would lead to raised blood glucose levels for longer after meals. It was already
    known that in people with type 2, the meal-time response of insulin becomes inadequate
    before the condition comes. But now I could see that the prolonged high glucose
    levels would also cause a rise in the background level of insulin in the blood,
    and that in the liver would also cause a further rise in the conversion of glucose
    into fat.


    Once established, these two vicious cycles will interact and reinforce each other.
    Too much fat from the liver will drive the pancreas cycle, and high glucose levels
    will eventually force up the insulin levels, driving the liver cycle.


    In 2007, I presented these tentative answers as a lecture to the annual UK Diabetes
    Conference in Glasgow. Fortuitously, the editor of the main European diabetes
    journal was in the audience and asked me to write up the hypothesis as a paper
    for publication. That was a challenge.'
