  md: 'economy of nature.


    +   Energy metabolism is simple

    * Only two fuels are burned for energy by your body – glucose and fat. Both can
    be stored and used when required.

    * Protein is broken down into the building blocks our body needs for growth and
    maintenance. However, in the Western world, we tend to eat more protein than we
    need and any excess is converted by the body into glucose.

    * Alcohol? Ever efficient, the body merely breaks down alcohol as burns it just
    as though it had been fat.

    * Metabolism is simply the coordinated handling of glucose and fat.


    # Storing energy as glucose


    Glucose is tricky to store. It attracts water, and therefore tissues storing glucose
    would quickly become engorged and damaged. So the body has developed an amazing
    work-around. By linking together glucose molecules in a chain, or polymer (rather
    like a string of beads), it effectively immobil them, holding them ready for use
    without causing local problems. The glucose is no longer able to attract water
    and is safe to store inside muscle or liver cells. This concentrated form of glucose
    is known as ‘glycogen’.

    Glycogen comes to popular attention most often in relation to long-distance running.
    Glycogen-loading is what pasta parties before marathons are all about. Take lots
    of carbohydrate and fill the tank to maximum. However, in everyday life, the role
    of glycogen stores is to help the body control blood glucose after meals. Here’s
    how: after eating a meal, blood glucose levels rise, and the body gets to work
    removing absorbed glucose from the blood and muscles. Overnight, the body can
    use these stores of glucose, and both day and night, the liver calmly delivers
    the right amount of glucose into the blood to provide energy for the rest of the
    body – minute – whether we eat or not.

    The graphs opposite show what happens.'
