  md: '# 3


    # How your body deals with food


    We are social animals. And a huge part of our social life centres around food:
    it oils the wheels of communication and is a framework for spending time with
    family and friends. This is all well and good – at least while we are young and
    healthy. The body deals with whatever is eaten – or drunk. We might eat to wild
    excess and take in far too much alcohol, but nothing too serious seems to result.
    Likewise, it copes if a meal is missed. The amazing body lives on.


    But then, as adult life unfolds, our relationship with food tends to change. By
    now, food has become a habit. Rather than eating instinctively and stopping when
    we have had enough – we eat because it’s there and because we have got used to
    a certain amount of food, and we find increasingly hard to skip a meal or change
    our routine. Nowadays, average adult body weight in the UK increases by half a
    kilogram every year between the ages of 20 and 60. Some people gain only a little
    and gain much more than the person who weighed 70kg at the age of 25 will on average
    weigh 80kg by the time they are 45. The upshot is that many people try to lose
    weight – often repeatedly. But the pressures of life – work, family, money are
    relentless, and the main focus of life tends to be less on avoiding weight gain
    and more on dealing with whatever is most urgent. Sometimes, life just feels like
    survival. And throughout it all, the body lives on, seemingly oblivious to whatever
    is put into it – but getting heavier.


    The way in which the body performs the miracle of keeping going whether you eat
    mainly cassava or mainly meat is astonishing.


    # Staying alive overnight'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'There is one organ that continues to demand the same amount of fuel throughout
    every 24-hour cycle. This organ is the brain. Day and night, your brain needs
    a steady and substantial amount of energy. It uses only one fuel glucose — and,
    whether it is consciously busy or not, it uses the same amount. That may be disappointing
    news if at this moment you are tired after a long day of decision-making and planning.
    But the truth is that your brain will not have used more food-derived energy than
    you had been daydreaming.


    One funny thing about humans is that we have huge brains compared with other animals.
    You may well know the brain gets enough fuel between meals, and especially overnight.
    Does it really depend upon glucose from the last meal? Surely, not, that blood
    glucose levels return to baseline just a few hours after eating and remain stable
    during the many hours spent asleep. So the glucose has be coming from somewhere
    else.


    Fortunately, a different organ has the very special job of keeping the glucose
    supply steady. This is the liver, as mentioned in Chapter 2. It keeps the brain
    supplied with glucose not just between meals but overnight too. The liver makes
    glucose every minute. In fact, most of the glucose in the blood comes not directly
    from food but from the liver.


    ![](img/4ebdc20e18f78682656cb1f1c020f0a0_43_0.png)


    # 3.1 To keep the brain supplied with the glucose energy it must have, the liver
    makes glucose at just the right rate, and blood glucose levels steady.


    Because the level of glucose in the blood is similar on going to bed and when
    waking up, it may seem as if nothing has happened. In fact, every morsel of glucose
    in the blood is changed every 90 minutes. As glucose is taken up and used by the
    brain, new glucose from the liver replaces it. It''s just like a fast-flowing
    river, where the water is constantly moving on but the level remains constant.


    During any period without food, the liver produces a constant, small amount of
    glucose for every kilogram of body weight. So, for instance, a man weighing 75kg
    would produce about one gram every minute. In an hour, this adds up to about 10g
    of'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'glucose (two teaspoonfuls). During your eight-hour sleep, eight times this
    amount, or about 80g (16 teaspoonfuls), is added to your blood. That is a lot
    of glucose to be made while your body is relatively inactive. To ingest the equivalent
    as carbohydrate, you would need to eat four chunky slices of bread.


    When you woke up this morning, every molecule of glucose in your blood had been
    manufactured by you, so they really were ‘sweet dreams’. The brain demands, and
    the liver provides. All other tissues can rely on it for energy.


    This balancing act sounds simple – the liver puts the sugar into the blood for
    transport to the brain and the brain uses it to stay alive. But the link between
    usage and replacement is critical, and hidden. How does the liver know how much
    glucose to add to the blood?


    # The role of insulin


    The answer is to be found in an amazing hormone called insulin. It really is the
    master controller of our internal ‘National Grid’, regulating the supply of energy.
    Insulin is made in the beta cells, within the pancreas gland. It is the pancreas,
    hidden deep in the stomach cavity and quite going about its business, which ensures
    that the right amount is released into the blood minute by minute. The plumbing
    for the pancreas is very clever, and different from other parts of the body. Blood
    passing through tissues is usually collected into veins, which take it back to
    the heart for general recirculation. But blood from the pancreas is collected
    into a special vein which delivers it straight to the liver.


    Thus the insulin is not loose into the whole body but immediately delivered to
    the liver, cutting out any delay in action. The fact that the system evolved in
    this way gives a clue to the most important action of insulin: it puts an immediate
    brake on the liver’s enthusiasm to make more and more glucose. Left to its own
    devices, the liver would churn out large amounts of glucose.


    What happens to this control is shown in the diagram opposite. If blood glucose
    starts to creep up, less insulin is made. If blood glucose starts to drop, less
    insulin is made. As insulin lasts only a few minutes in the blood, it achieves
    a very tight regulation of blood glucose by increasing or decreasing production
    according to requirements – with an immediate and direct impact on the liver.'
