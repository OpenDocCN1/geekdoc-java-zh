    # The effect of long-term success on your pancreas


    The discovery that the pancreas was undersized in people with type 2 diabetes
    was a puzzle, as discussed earlier. Was the pancreas born small, or had smallness
    been thrust upon it by diabetes? We found a big clue to the answer in what was
    already widely known about the pancreas from another kind of diabetes - type 1
    or childhood diabetes. Type 1 is caused by the genuine death of insulin-producing
    cells and an almost complete lack of insulin. It has been known for some time
    that the pancreas shrinks as type 1 diabetes develops. This was assumed to be
