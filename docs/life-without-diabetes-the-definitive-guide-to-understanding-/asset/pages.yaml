  md: '# # A patient’s story: Dave Myers, Hairy Biker


    It was my great good fortune to meet Professor Roy Taylor when I filmed the series,
    *The Hairy Dieters*, back in 2012. It was a meeting that went far beyond a TV
    show about, ‘two fat cooks who needed to shed some timber’, to a union that changed
    my life. Seven years on I fitter than I had been for years.


    Professor Taylor has the ability to help you understand what goes on in the body
    and why. Sometimes it is tough love and you need to get a grip on yourself and
    your bad habits to get healthy. This he conveys with genuine care and an infectious
    enthusiasm.


    It is clear Roy understands people, and as he says, medicine is all about listening
    to people. He listened to us, as two people who needed help, beyond the cameras.
    Roy is the expert in this field, and the research centre he has created in Newcastle
    is amazing. But what is even more striking is the staff. What a great bunch. Their
    research has turned the understanding of diabetes upside down, and allowed many
    people to regain their health. This book explains how your body deals with food
    and why type 2 diabetes may affect you. There are no short cuts possible, just
    help based on sound science and expertise at its core.


    Roy’s first piece of advice to me was this: for long-term health, we should be
    able to fit into the trousers we wore when we met 21. He proved to us he practised
    what he preached, when we danced with him, in his old canary-yellow corduroy flares
    at Tynemouth beach! I never quite made it to the 34-inch (86.4cm) waist of my
    youth but had managed a 36-inch (91.4cm) waist… which wasn’t bad from a starting
    point of 49 inches (124.5cm) some three months previously. The biggest benefit
    for me was not just being able to wear cooler jeans, it was getting my health
    back.


    When I met Roy in 2012 I had type 2 diabetes – with high blood sugars and I was
    on medicine to control this. Roy showed me another way. Now my blood sugars are
    normal and my diabetes is a thing of the past. I am tested every months and the
    results are normal. This means I have avoided the misery of type 2 diabetes that
    can result in pain, blindness and amputation.'
