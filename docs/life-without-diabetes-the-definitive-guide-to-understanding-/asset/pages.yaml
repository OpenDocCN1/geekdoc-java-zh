    # 5. Decide


    How do you make a decision? Some people weigh up all the facts, ponder on them
    for a while and only then come to a conclusion. Other people – maybe a majority
    – come to a snap decision either immediately on hearing the pros and cons or later
    triggered by something else.


    Psychologists used to talk about something called ‘the cycle of change’. This
    was the idea that everyone went first through a phase of pre-contemplation, not
    yet thinking about any decision, then a phase of contemplation, weighing up advantages
    and disadvantages. Next there would be ‘preparation’, the intention to make a
    decision, and then, a phase of action. It is now recognised that most people do
    not go through these theoretical stages but rather come to a rapid decision at
    an unpredictable time. This decision may be precipitated by events or ideas that
    may seem to you completely unrelated and which you don’t recognise as the trigger
    for moving your forward mind.


    Imagine, if instead of diabetes, you had developed a threatening disease that
    could only be cured by an operation, and that your doctor said this would mean
    taking three months off work, and stopping all normal activities of life. Faced
    with a life-threatening condition, you would not hesitate to accept this. It would
    be a no-brainer. You would plan for the operation and work out how to fit your
    life around this period of down time.


    Given that type 2 diabetes causes all the misery and shortening of life described
    in Chapter 1, the same thinking should be applied. It is a serious condition that
    threatens your eyesight, your feet and your heart, not to mention doubling the
