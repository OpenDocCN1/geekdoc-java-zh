  md: '# 1


    # What is type 2 diabetes?


    # A snake in the grass


    Diabetes is a condition that slowly attacks important parts of the body – without
    warning.


    The process happens over many years and during this time people may feel perfectly
    well. However, silently, stealthily, high glucose levels are stacking up problems,
    and serious consequences then often appear suddenly, at which point it can be
    difficult to return to full health. Doctors refer to these as ‘complications’
    of diabetes, a polite term which rather underplays the awfulness for the person
    concerned. However, once you know that there is a snake hidden in the grass, and
    that it is very venomous, you can minimise the chance of being bitten.


    The good news is that the risk of developing these long-term problems can be decreased
    by controlling the level of blood glucose as well as possible. The better news
    is that if blood glucose is returned to normal, then the risk of damage to eyes,
    nerves, feet, heart and brain returns to the same level as for people of similar
    age and weight without diabetes. From the point of view of the person staring
    down the barrel of a gun, that is a miracle. Explaining this miracle is the main
    purpose of this book.


    # Sugar and diabetes


    ‘Diabetes’ just means the level of sugar in the blood is too high.


    What exactly is sugar? The word covers any sweet, simple form of carbohydrate.
    The sugar in your blood is a particular kind called glucose. Ordinary table sugar
    is made up of two kinds of sugar'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'bound together. Half is glucose and the other half is fructose (which is a
    very similar sugar commonly found in fruit). But the kind of sugar does not matter,
    as your body will convert the fructose to glucose as needed. Glucose is the basic
    form of sugar that your body uses for energy.


    In healthy people, blood glucose levels are very tightly controlled. Overnight,
    this control happens minute by minute to keep levels constant. Even after a birthday
    banquet, the increase in blood glucose is quite small. This is achieved by a huge
    and rapid increase in the blood level of insulin, the main hormone that controls
    blood glucose. If this mechanism breaks down, blood glucose rises too much after
    eating.


    Does this matter? Sugar looks so innocent, sitting there in the sugar bowl, so
    ubiquitous in our lives today that it may be difficult to imagine that it was
    once a luxury item, with the supply of honey from monasteries being the only source
    of added sweetness to food. We have become accustomed to it being added to almost
    everything. Well, yes, it does matter, if the glucose levels in blood become too
    high, problems will occur throughout the body.


    This book is all about type 2 diabetes, which is by far the commonest form of
    the disease. The other types each have a different cause (take a look at the Appendix
    for details). But all forms result in high blood glucose levels and can cause
    similar long-term complications. Being sure that a person has one type of diabetes
    rather than another is not easy. Around 90% of people found to have high blood
    glucose have type 2. And if you put on weight in adult life, over 30 years old
    and have high blood sugars, it is highly likely that you have type 2 rather than
    one of the other forms.


    But there is no test that can definitively confirm this diagnosis and the other
    types of diabetes can sometimes be mistaken for type 2. It is up to the doctor
    to consider whether one of the other could be the correct diagnosis.


    If you or someone close to you has type 2 diabetes, you will probably have a lot
    of questions. What will it do to me? Is it the serious kind? How can I control
    my blood sugar levels? Let''s look at these and some other key concerns surrounding
    the disease.


    # Why do glucose levels shoot up after meals?'
