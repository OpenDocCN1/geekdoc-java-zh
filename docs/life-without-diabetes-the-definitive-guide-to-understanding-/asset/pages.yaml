  md: 'lack of the regular big increases in insulin that have effects on growth (and
    maintenance of size) of all tissues.


    Insulin is such a clever hormone that it not only controls how the body handles
    glucose, but at high concentrations also acts as a ‘growth hormone’. In normal
    health, at high levels after a meal, insulin effectively flicks a switch to maintain
    growth. Although usually we think about the level of insulin in the blood, the
    levels within the pancreas surrounding islet must be much, much higher. It is
    this huge level that may possibly help maintain the size of the pancreas. If the
    insulin spike were not to happen after every meal, we could understand why the
    organ might shrink.


    Can the pancreas re-expand over a period of time if the surges in insulin levels
    are resumed? In Our Counterbalance study, there was almost no change in the size
    of the pancreas over six months of follow-up. But in DiRECT, we have been able
    to analyse data up to 12 months at the time of writing, and found that the volume
    of the pancreas had increased modestly. So all is not lost if you have type 2
    diabetes – a small pancreas. Keep your weight down in the long term, and this
    vital organ is likely to increase in size.


