    # 3.6 What happens to carbohydrate food once swallowed?


    # But what about the fat in our food?


    So far, we have talked mainly about the carbohydrates in our food and how they
    affect glucose levels; now it''s time to look at what happens to the fat we eat.
    As you''ll see in this section, the processing of fat and glucose actually go
    hand in hand.


    Let’s return, briefly, to when you woke up this morning, and when your body was
    largely relying on fat for fuel. Fat was flowing from the fat stores to the tissues
    where it was required. Only the brain was burning glucose. That happy balance
    would have lasted until the first meal of the day. Ideally, by then you would
    have used all the fat you had temporarily stored from yesterday''s meals.


    As soon as you eat in the morning, the increase in insulin in the blood rapidly
    switches off the release of fat from fat stores. But if you don''t eat in the
    morning, or indeed for the rest of the day, your bodies will just continue to
    burn fat (and some glucose). After the first meal of the day, some of the fat
    from your meal is delivered to the liver, and some goes straight from the gut
    to muscle or fat tissue. Overall, this sets up your body so that all tissues have
    enough fuel to be going on, and stores in fat are topped up so they can release
    a steady supply between meals or overnight.


    And how about surviving on that desert island? Exactly how would your body cope
    if marooned for weeks? Let’s imagine the essential water is available. But no
    food.'
