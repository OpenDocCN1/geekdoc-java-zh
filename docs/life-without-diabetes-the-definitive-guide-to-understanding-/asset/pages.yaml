  md: '# A population shift


    Remember the figures mentioned before – on average both men and women weighed
    10kg less than they do today in 1980 both had an average BMI of 24. Turn back
    to page 135 and try to find ‘obese’ people in the photograph of a Newcastle street
    scene from that era. The background population has a BMI of 27, and finding obese
    people in a current photograph would not be difficult because the whole population
    has increased in weight.


    # Why were the majority of UKPDS participants non-obese?


    We have seen, for any given level of BMI, some people may have quite a lot of
    fat stored under the skin and not much inside the stomach cavity, whereas others
    may have ordinary amounts under the skin but a lot inside. The big advantage of
    using magnetic resonance methods to study how we handle food is that the inside
    structures of the body are routinely visible and accessible for measuring content
    of fat, glycogen and other goodies. Look at figures 2.6 and 2.7 to see just how
    different people look inside.

    The fat stored inside the stomach cavity is not necessarily bad in itself. But
    it is an indicator that the normal safe storage depot under the skin is full,
    so fat is building up anywhere it can, including inside the body’s organs. We
    now know that it is this fat that causes problems and this was the first clue
    to our understanding of why non-obese people can develop type 2 diabetes.


    # Insight from an accident of nature


    Sometimes accidents of nature can propel a big jump forward in our scientific
    understanding. Some rare individuals, for example, are born with an absence of
    fat under the skin, and they survive by storing fat everywhere else. This condition
    is known as lipodystrophy and is caused by a single faulty gene. People with the
    condition painfully thin, but their livers are full of fat. After reading Chapters
    4 and 5, it may not surprise you to learn that they often have type 2 diabetes.'
