    # 1. Recognise the problem


    For centuries, type 2 diabetes has been thought of as a life-long condition. The
    data from the famous United Kingdom Prospective Diabetes Study (UKDS) ‘proved’
    this, didn’t it? In that study, folk had to take more and more tablets by year
    by year, their blood sugar control continued to deteriorate. There appeared to
    be an inevitable downhill path, whether sugar levels were initially kept as low
    as possible or not so low. After 10 years of grim progression, as many as half
    of the people in the study needed insulin injections.


    Why did that study ‘prove’ that type 2 diabetes always progressed and never went
    away? The simple answer is that people in this study did not lose weight. In fact,
    the reverse happened. This is the case in real life too: despite being advised
    to lose some weight, people recently diagnosed with type 2 diabetes find that
    their weight creeps up over ensuing years. This may not surprise those who have
    been on the receiving end of routine advice about weight loss. It is often handed
    out with no conviction that it is possible, and without specific instructions
    on how to do it. Even if guideline-based advice from a dietitian is available,
    this is often frustratingly ineffective. Most people’s steady increase in weight
    after being diagnosed with type 2 does not surprise doctors either, as they know
    that some of the tablets prescribed to manage the condition actually hamper weight
    loss.


    In the bodies of those who took part in the UKDS study, the levels of fat inside
    the liver and pancreas must have remained high. Tablets will improve their blood
    glucose levels but this is not relevant for the progression of the disease. Inside
    the pancreas, the insulin-producing beta cells were slowly being inactivated and
    consequently all hope of adequate glucose control slowly faded.


