    As a result, the pancreas is the least studied organ in diabetes. Which is astonishing,
    given that it is the most important.


    And then, to top it all, the pancreas is not one organ, but two. Part deals with
    digestion of food, and part makes hormones.


    Most of the pancreas''s bulk is devoted to making the digestive juices that flow
    into the gut to break down food into what the body wants. It is made up of tiny
    lobules having a tiny drainage duct. The tiny lobules are grouped together into
    irregularly shaped lobules from which small tubules flow into a main tube running
    the length of the pancreas and delivering the juices to the intestine. These larger
    lobules are separated by sheets of fatty tissue. None of this is directly related
    to making insulin.


    Of the various hormones in our bodies, only a handful are vital. Along with insulin,
    including thyroxine, cortisol, oestrogen and testosterone, each of which is made
    by a special, distinct organ: the thyroid gland in the neck, the adrenal gland
    above each kidney and the ovaries or testes respectively. Nothing so simple for
    our friend insulin, however! For insulin is made not by a single, identifiable
    organ, but by clusters of cells called beta cells, which are scattered throughout
    the microscope, these clusters look like little islands in a sea of other tissue,
    they are known as ''islets''.


    Until recently, all that we know the human pancreas comes from looking at the
    dissected organ after death or surgical removal because of disease. The lack of
    study was partly because of its awkward position in the body and its shape. But
    now, thanks to special MR studies, we know more about it than ever before. These
    special studies led to the findings that underpin this book. They have enabled
    us not just to gain full view of the pancreas but to measure the level of fat
    within it.


