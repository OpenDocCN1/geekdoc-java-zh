  md: 'You must go back to serious, focused weight loss for a planned period of weeks.


    Steroids cause weight gain. We are not talking about ‘anabolic steroids’, which
    occasionally hit the headlines misused by some athletes to enhance performance.
    We are talking about the steroids that are essential for life and made naturally
    in your body. Given in high doses, these steroid hormones can be used as powerful
    drugs for some serious illnesses. These drugs directly stimulate the appetite.
    There is no easy answer to this unwanted effect. Seek advice from your doctor
    or nurse how to avoid foods that are calorie-dense and ask them to help you find
    alternatives, or try a low-calorie liquid formula, as these products tend to produce
    a feeling of fullness. Fortunately, few people require high doses of steroids
    for months on end, and so once the storm has passed, undertaking a definitive
    period of weight loss will get you back on track.


    And then there are the people who do not have any great problem in avoiding weight
    regain. These are often the people who had never thought about their weight in
    the past. They had just eating according to their family and social habits, and
    if they had put on weight over the years, this had been slow and incremental and
    not associated with emotional and psychological ups and downs. On waking up to
    the consequences, this lucky minority can simply eat less on a regular basis without
    apparent difficulty. Probably they will not be reading this chapter.


    # Eating food, not diets


    Eating is a social activity. Many people eat in the same way as their close family.
    Whatever pattern of eating you decide on, it has to fit in with whatever is going
    on the table.


    There has been much research into whether the amount of carbohydrate, fat or protein
    in the diet is helpful. There are plentiful opinions on this; enthusiasts for
    any particular type of high-this or low-that can easily be found. In one sense,
    they are all right – any given diet may suit some people very well. Is there a
    best approach?


    The basics of nutrition remain valid today as they were first worked out over
    a century ago:'
