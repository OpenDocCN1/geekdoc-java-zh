  md: 'Fat is stored mainly just under the skin. Some people are able to store lots
    of fat there, even though our 21st-century eyes this may look undesirable. But
    for most of human history, it has been extremely desirable, signifying that they
    could afford to eat well and indicating a person''s success and high social status.
    And there''s another very potent factor that was recognised long ago: reproduction
    requires adequate nutrition, and undernourished people are less fertile. This
    is why images and artefacts symbolising fertility all show very fat figures.


    Humans tend to have a curious belief that if a little of something is good for
    you, then a lot is better! This is rarely true. Under the skin, fat is safely
    stashed away in a form that causes no harm to the rest of the body. However, although
    comfy layer may not be too bad a thing in itself, it may be an indicator that
    there could see opposite and overleaf); and how much an individual can store in
    this safe, purpose-built storage layer varies a lot. If there is more fat than
    can be accommodated, the extra fat has to be stored elsewhere, such as within
    the stomach cavity. There it is known as ‘visceral’ fat and is useful as a rough
    guide to how much excess fat the body has future heart attack – and diabetes.
    The more visceral fat is present, the higher the risk of future


    Why? Well, because the presence of a lot of visceral fat, although not directly
    dangerous, is an indication of something else that most definitely is, namely,
    fat accumulating inside the main organs – the liver, pancreas, heart and muscle
    tissue. While the amount of visceral fat can be estimated with a tape measure
    around the waist, the fat that builds inside the main organs is truly hidden.
    And, when it comes to the liver and pancreas, it can cause serious problems –
    of which more later.


    In the next chapter, we shall see what conducts this whole orchestra of carbon
    moving around the body and why the music goes horribly wrong in type 2 diabetes.'
