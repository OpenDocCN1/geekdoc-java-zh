  md: '# A word on alcohol


    Alcohol requires special consideration, because it is so calorific. One gram of
    alcohol contains almost as many calories as one gram of fat: seven calories in
    a gram of alcohol, to be precise, compared with nine calories in fat. However,
    I certainly would not advocate a total ban on alcohol. For many people, it is
    a source of much enjoyment, and can be built into a way of life consistent with
    keeping weight steady.


    Everything revolves around quantity. A home-poured glass of wine may contain 140
    calories. That does not sound much – about the same as a slice and a half of bread.
    But three glasses can just slip down, and they would bless you with 420 calories
    – a huge number if taken on a regular basis. Similarly, a pint of beer contains
    200 calories. Downing five pints on an evening out adds 1000 calories to your
    daily intake. No wonder a man''s expanding waistline is sometimes referred to
    as ‘beer-belly’.


    The basic message on alcohol is to enjoy it in moderation – as long as you are
    honest with yourself about how much is going down and you can keep your consumption
    within the weekly calorie envelope that will keep your weight steady.


