    # 5.2 Second of the twin cycles – the vicious cycle in hypothesis. The normal
    fat export from the liver can deal with the high liver fat – until the safe storage
    depot under the skin is full. Then blood levels of fat rise. The pancreas is one
    of the tissues susceptible to the increased fat. Eventually, after several years,
    this causes the insulin producing cells to shut down. Over a short time, blood
    levels then rise.


    Talking about ideas is easy compared with the hard grind of setting down in black
    and white all the details supported by careful scientific argument. The details
    could not be imaginary or hopeful. Each had to be linked to sound, published research.
    Assembling all the detailed scientific justification took six months and then
    there were further weeks and months while the editor conducted the standard process
    of asking other scientists to carry out a rigorous scrutiny of the science before
    deciding whether to accept the article. But eventually the Twin Cycle Hypothesis
    was published.


    The cardinal sin in science is to fall in love with your hypothesis. All scientists
    know that setting a hypothesis down on paper is the first and very necessary step
    to discovering how right or wrong it is. The purpose of a hypothesis is to set
    out in detail what appears to cause what, so that the component ideas can be tested
    separately. Tested to destruction. Perhaps best not even to say ‘hypothesis’.
    Try some word substitution. Say ‘fairytale’ instead; that is after all a product
    of the imagination. I had to say to myself that this was the Twin Cycle Fairytale.
    That spurred on the process of setting rigorous testing, with no pre-conceived
    ideas. We needed clarity.


