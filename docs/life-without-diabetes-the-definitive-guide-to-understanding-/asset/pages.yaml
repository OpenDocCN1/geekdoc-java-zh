    Ideally, you will use the liquid formula packets that provide complete nutrition.
    But if there is some reason why this is not feasible, then yes, a milk-based diet
    (2 litres of semi-skimmed milk per day) is both inexpensive and feasible. It will
    be important to take a multivitamin tablet daily and to eat some non-starchy vegetables
    – to provide some roughage and to chew on.


