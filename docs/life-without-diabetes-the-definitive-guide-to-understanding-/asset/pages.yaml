  md: 'message to be taken from this: you need to be prepared for how you are going
    to manage when life deals a hard blow. Being aware that stress can pose a problem
    is a good start, but you should have a rescue plan. It is too late to think about
    ordering a life belt when you are already in the water. This is one of the clear
    lessons we learned from DIRECT: Rescue plans were lined up in advance. If someone
    gained more than 4kg in weight, we offered a liquid formula diet to help them
    get rid of the extra weight as soon as possible. Low-calorie shakes are a simple,
    effective option, but there are other effective ways of cutting back drastically
    upon your calorie intake.


    In our studies, about one in two people required at least one return to the low-calorie
    liquid diet, and some people required two or three. Telling, the overall weight
    loss at two years was very similar in those who had cruised along at a steady
    weight and those who had run into life events and needed an occasional life. Without
    recognition that life events occur, and that the stress of these makes us likely
    to regain weight, many of us would find our weight rising unchecked over the years.


    A second pattern of weight gain is, as you might expect, a steadier increase –
    week on week, month on month, which means that something in excess of calorie
    requirements is being consumed. Sorting this out requires a clear-headed evaluation
    of what is happening. Sometimes an ongoing problem, such as stress at work, is
    chronically requiring effort from weight maintenance, and it may be useful to
    emphas this. Sometimes it is to do with food habits: eating between meals, or
    getting lax about portion control. You may have reverted to your old habit of
    putting too much on the plate. By hook or crook, these behaviours have to be tackled.
    Consumption of beer, wine and spirits may have to be restricted to weekends or
    partially substituted by zero-calorie drinks. Tap water is delightfully inexpensive
    – but the problem is often in the social pressure of buying rounds.


    Another pattern of weight regain could be called the cruise holiday. Being exposed
    to pre-paid food in limitless quantities is a sure recipe for putting on weight.
    Sometimes the weight gain is prodigious. It is easy to understand how this happens.
    You have been away from your routine, in a glorious escapist bubble; but on your
    return home from holiday you must be under no illusion that type 2 diabetes is
    ready to spring its trap. The weight gain needs to be recognised and dealt with
