  md: 'By one of those great coincidences of scientific life, in 2006 I had just opened
    a research centre based on magnetic resonance (MR). The MRI scan is familiar to
    all as a routine medical test. It stands for ‘Magnetic Resonance Imaging’. But
    the same technique could be developed by experts to look inside the body and see
    how different organs were actually functioning. The chemical composition of organs
    could be measured.


    The original idea had been open to the Newcastle MR Centre to advance my ongoing
    research on what happened to food in the body health and in diabetes, but also
    to tackle a wide range of questions in all medical specialties: from dementia
    to muscular dystrophy, from coronary artery disease to arthritis. It had taken
    me from 2000 to 2004 to raise £5.2 million ($9.8 million AUD), and from 2004 to
    2006 to design and build the centre. However, this was just the groundwork for
    the critical business. Having the building and the equipment would be useless
    without expert physicists who could invent the necessary methods to measure things
    that had never been measured before. The challenge was to build a world-class
    MR physics centre from scratch.


    I met Andy Blamire, an MR physicist, when we had both worked in the US, and was
    very fortunate in persuading him to move from Oxford to become Professor of MR
    Physics in Newcastle. We then attracted Dr Pete Thewall from Dr Kieren Hollingsworth
    from Cambridge University to join the team. A dream team! And what an exciting
    era resulted. They devised new techniques for the market to answer some of the
    most important questions of health in every speciality – involving the heart,
    lung, brain, muscle, kidney, liver and of course – the pancreas.


    To test the Twin Cycle Hypothesis, we needed to be able to measure the fat content
    of the liver and pancreas. The liver measurement was quite straightforward to
    set up, but the pancreas required a brand-new approach. I asked Kieren whether
    he thought it was possible. He looked up at the ceiling, for a few seconds (the
    longest few seconds in the history of the MR Centre) and said ‘Yes’. We were underway.
    The steeplease could continue to the next hurdle – finding money to do the work.


