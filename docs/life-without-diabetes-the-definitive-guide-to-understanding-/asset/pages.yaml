- img_proc: true
  md: 'Different parts of the body have different requirements. We need to distinguish
    between the brain and the rest of the body here, because in normal life the brain
    can only burn glucose to keep going whereas the muscles and tissues can run on
    fat or glucose.


    At first, in the absence of food, stores of glycogen in the liver and muscles
    will be used to provide the glucose that your brain demands. And during this time,
    everything will swing into action to minimise the use of glucose by the other
    muscles and tissues - which will gradually switch over to burning fat. After three
    days, however, the cupboard will be bare; glycogen stores will have been used
    up.


    How does the brain survive without glucose being freely available? Never fear!
    Mammals have evolved another startling workaround. In the previous chapter, we
    saw that fat is made up of chains of carbon atoms. What this means is, instead
    of burning the whole chain completely for energy, smart fuels can be made. These
    are ketones, and the brilliant thing is these small molecules can easily diffuse
    into tissues. This includes brain cells, which adapt to the switch from glucose
    to ketones as fuel. The carbon links of the ketones are broken to release the
    essential energy, and the brain does just fine.


    In fact, it can do very well indeed. Burning ketones seems to leave you alert
    and possibly hungry. It enables you to focus without distraction on the matter
    of chasing after dinner. It is rumoured that penneless artists, languishing in
    garret rooms, produce their best work from a ketone-powered brain. Some people
    find that their brain is at its sharpest in the early morning — hence-changing
    discoveries are being made before breakfast. Whether or not this is entirely the
    result of a ketone-fuelled brain is still uncertain. What is certain is that ketones
    are the secret of our survival as a species despite famines and social upheavals.


    If, for example, you had a lie-in this morning, your ketone levels would be rising,
    and if you tested your urine, a small amount of ketones, normal for the circumstance,
    would be found. If you tested your urine immediately after rescued from your desert
    island, you would find a moderately large amount of ketones, their presence merely
    indicating that your clever body is setting itself up to survive without much
    food coming in. It has devised a glucose substitute to power your brain.


    You may have seen ‘ketogenic’ diets advertised as ‘fat-burning’ diets, but this
    rather distorts the truth. If less food is eaten at'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'the body requires in any 24-hour period, then stored fat must indeed be burned,
    and this is whatever the composition of the diet. There will be more ketones in
    urine than usual. If the diet is very low in carbohydrates, more of the calories
    will come from fat. Because the burning of fat from food will also yield ketones,
    the levels in the urine will be higher still — even though this is no guide to
    how much of your own body fat is being burned. Quite simply, weight loss will
    occur whenever less the required calories are coming from food. Cutting down on
    carbohydrates is successful in decreasing total calorie intake in some people,
    but there is no metabolic mystique to ''ketogenic diets''.


    # Why your doctor fears ketones


    There is a dark side to ketones. Doctors and nurses tend to fear them, and this
    is for one reason. In type 1 diabetes — a very different disease from type 2 —
    the body is completely dependent upon insulin being injected. If insulin is not
    injected for any reason or if illness demands a much higher insulin dose, the
    severe insulin deficiency causes the liver to produce a huge amount of ketones.
    This can lead to a lifethreatening condition — known as diabetic ketoacidosis
    — for which urgent life-saving treatment is needed.


    There is usually no doubt that ketones are worryingly high — i.e. far, far above
    the levels seen during normal fasting — but ordinary levels of ketones are broadly
    good: they are the molecules of survival.


    # The secret life of the pancreas


    So far in this chapter we have considered the normal regulation of metabolism
    in health. Control by insulin is central to the whole business so we should consider
    in more detail the organ that produces it and calls the shots in health (and in
    type 2 diabetes).


    The pancreas is a shy organ. It hides away and does its vital job of making insulin
    without fuss — normally. It controls what you do with food and how you provide
    energy for everything. Insulin is known as the master regulator of metabolism
    because it is by far the most controller of your energy supply. Other hormones
    have modest effects on what happens to glucose, but insulin can override these.'
