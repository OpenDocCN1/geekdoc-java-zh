    Therefore, although there is a small risk of having a biliary attack as gallstones
    get smaller, if no weight is lost there is a greater chance of a future episode
    of gallstone pain away.


    # # Can I change where the fat disappears?


    Sometimes it seems as though the fat is dropping away, but from all the wrong
    places. Sadly, we have no way of affecting this. In fact, it is amazing that even
    now, with our detailed knowledge about so much of the human body, we have no idea
    why fat is stored in the places it is on any one person’s body. What controls
    this? What stops it being heaped together in a hump somewhere? Bar the obvious
    effect of sex hormones on the distribution of some parts of the fat layer in a
    typically female or male pattern, we have no idea.


    # # Can I avoid looking puny after weight loss?


    This might sound an odd question, given the aspiration to being thin and fit in
    our modern culture. But it is, interestingly, often posed by people in positions
    of power. It has a greater importance in some cultures than in others. Views may
    be changing in the UK, where in times gone by, most company directors, most civic
    mayors and most leaders would be large, imposing people. Elsewhere in the world,
    the phrase ‘avoir poids – i.e. to have gravitas, or power – could be applied to
    many of the ‘top’ people. The best way to avoid looking ‘impressive’ weight loss
    is to undertake weight training to build up the neck and shoulders. And to have
    self-confidence. You don’t need extra weight to give the impression of clout.'
