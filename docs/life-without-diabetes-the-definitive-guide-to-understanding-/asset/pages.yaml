    # 2.4 Number of calories burned on a Saturday morning and why Fred did not lose
    weight.


    If your aim is to prevent weight gain, being moderately active for hours is more
    effective than a quick burst in the gym. You don’t have to take sweaty exercise
    – although, if your aim is to maximise heart function and fitness, then bursts
    of additional brisk exercise are important. Advice handed out by exercise experts
    or public-health doctors tends not to point out the important difference between
    the very separate aims of cardiovascular fitness and weight control. With his
    bouts of squash, Fred’s head is likely in better shape than Bill’s – but that
    was not his goal. He started playing again because he wanted to lose a few pounds.


    Preventing weight gain is arguably one of the most important issues facing society
    today, and one that could certainly be helped by, for example, changing transport
    policy to encourage people to be more active or walk or cycle more, along with
    legislation on food policy. But preventing weight gain is not the same thing as
    losing weight; getting rid of excess fat that has accumulated over a long period
    of time requires a different approach, as we shall see.


    Suffice to say that the balance between energy burned during exercise – whatever
    form of activity you engage in – and energy pouring in food is very unequal. And
    for people who want to lose weight, the overwhelming priority must be to cut down
    on the consumption of food and calorie-containing drinks.


