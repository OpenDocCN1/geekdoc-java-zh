    # Chapter 9: Methods


    Let’s revisit the `VariableCalculator.java` code we wrote in Chapter 5:

    ![Code 9.1: VariableCalculator code from Chapter 5](Image00194.jpg)

    Code 9.1: VariableCalculator code from Chapter 5


    Just from a glance, the code looks messy. Inside the `main()` method, we have
    written 12 lines of code, not including the comments or white spaces.


    ### Flaws with this code:

    1. The code is too long to be inside one method (the `main()` container). Generally,
    we try not to clog one method container with so much code.

    2. It’s not easy to read. We needed comments to know what is happening at each
    calculation step.

    3. There’s more than one thing happening inside `main()`. `main()` is responsible
    for adding, subtracting, multiplying, dividing, and finding remainders. That’s
    a lot of responsibilities.


    But instead what if our `main()` could look like this?

    ![Code 9.2: What if we had cleaner code?](Image00195.jpg)

    Code 9.2: What if we had cleaner code?


    Code 9.2 is much easier to read. We now have five lines of code inside `main()`.
    This was all achievable by creating and using methods.

    The `add()`, `subtract()`, `multiply()`, `divide()`, and `modulus()` are what
    we call methods.


    **Goal of this chapter:** let’s take some burden off of `main()` and organize
    the code in a cleaner manner by creating new methods.


    We’ll use a new class file called `CleanCalculator.java` to rewrite our `VariableCalculator`
    code. The program’s output should still be the same:

    ![Code 9.3: Outline of the CleanCalculator code](Image00196.jpg)

    Code 9.3: Outline of the CleanCalculator code


    ## Section 9.1: What is a method?


    A method is a group of code that performs a specific operation. One method should
    be doing one thing. For example, one method should perform addition, another subtraction,
    and so on.


    If you ever watched a film, then you’ve probably seen the credits screen at the
    end. The different roles mentioned in the credits are what programmers consider
    to be “methods.” A film director is its own method, while a music director is
    another. All responsibilities are divided into different roles so we''re not overloading
    one person to do everything, and these roles are needed to make one film. In programming,
    these different methods are needed to create one program.


    You should create methods:

    * When your code is cluttered and hard to read

    * When you notice there’s the same code repeated throughout the program


    So methods are a way for programmers to organize similar groups of code together
    to avoid repetitive code. Methods will live inside the class container, alongside
    the `main()` method. To organize the code in `VariableCalculator` class, we’ll
    plan on having five different methods to support the math operations.


    ## Section 9.2: How to write a method


    Let’s look at the structure of the `main()` method.

    ![Code 9.4: A basic main() method that prints “Hello World”](Image00197.jpg)

    Code 9.4: A basic `main()` method that prints “Hello World”


    There are six components needed to create a method, but we’ll focus on four of
    them in this chapter. The six components that compose a method are the following:

    1. Access Modifiers: `public` in `main()`

    2. `static` keyword

    3. Return type: `void` in `main()`

    4. Method name: `main()`

    5. Arguments for a method: `String[] args`

    6. Body of the method: `System.out.println("Hello World");`


    We’ll ignore the first two for now and focus on the last four components:

    * Return type

    * Method name

    * Arguments for a method

    * Body


    We’ll come back to what the access modifiers and the `static` keyword mean in
    later chapters. For now, we’ll just remember to add them to our method construction.


    ### 9.2.1 Return Type in a Method


    The return type is the data type the method returns after it has performed its
    operation. This part is similar to declaring the data type of a variable. For
    example, if you want to create a method for adding, then you’ll want to return
    a number. In our case, we’ll return an integer. We’ll start creating the definition
    of the `add()` method based on what we know so far. We also need to do this outside
    of the `main()` method:

    ![Code 9.5: Declaring the return type of the method as “int. Ignore public and
    static.](Image00198.jpg)

    Code 9.5: Declaring the return type of the method as `int`. Ignore `public` and
    `static`. Just know they need to be there. You can declare the following return
    types:

    * `int`, `String`, `Object`, `float`, any data type you’d like

    * `void`: when your method doesn’t return any value at the end


    ### 9.2.2 Method name


    Method names should reflect what the method is doing. This is important in programming
    because we like to revisit our code, and if we don’t understand the purpose of
    a method from its name, then improvements need to be made. For our method to add
    numbers we can simply call it `add()`. You could also call it `addition()`, anything
    you’d like. The method names aren’t set in stone by Java and are at the programmer.

    ![Code 9.6: Creating the method name, “add. The parenthesis will indicate this
    add() is a method.](Image00199.jpg)

    Code 9.6: Creating the method name, `add`. The parentheses will indicate this
    `add()` is a method.


    ### 9.2.3 Argument for a Method


    Arguments are general inputs the method can use rather than using hardcoded values.
    We achieve this by using variables. In our case, we want the `add()` method to
    add two numbers together, not just 2 and 4, so arguments help us generalize the
    inputs. To add arguments to your method, you simply need to declare a variable
    that will act as the input. In order to add more arguments, you need to separate
    them out by comma:

    ![Code 9.7: Adding arguments to the method](Image00200.jpg)

    Code 9.7: Adding arguments to the method Note we don''t initialize these variables
    because we''t know what they are. We will only know the once we start using the
    method. Now the `add()` method should always expect to have two inputs. If you
    don’t provide two inputs, then Java will throw a compilation error. You can name
    your variable arguments anything’d like. I arbitrarily chose `x` and `y`. Some
    things you may wonder:

    * How many arguments can you have? I recommend keeping it at most 5~7 arguments
    to ensure your code is still readable.

    * What data types can you use to pass in arguments? Any data type

    * What if you don’t want any arguments? That’s okay too. Just don’t add anything
    in the parentheses `()`


    ### 9.2.3 Body of a Method


    The body has the code that needs to be executed by the method. The body is denoted
    by two curly braces `{}`. For `add()`, we want to add two numbers together. In
    this case, we will add arguments `x` and `y`.

    ![Code 9.8: Writing the code the method must execute inside its body](Image00201.jpg)

    Code 9.8: Writing the code the method must execute inside its body We need to
    also return the added value at the end of the method’s body:

    ![Code 9.9: Adding the return statement](Image00202.jpg)

    Code 9.9: Adding the return statement The `return` is a Java keyword used to return
    data at the end of the method. Note again that code in Java is run by line, so
    the `return` statement must always go at the end of a method. For example, we
    cannot do this:

    ![Code 9.10: Erroneous code. You cannot return earlier when there’s more code
    to process afterwards.](Image00203.jpg)

    Code 9.10: Erroneous code. You cannot return earlier when there’s more code to
    process afterwards. Code 9.10 will throw us a compilation error because Java sees
    that there is another line of code it must process after the return statement.
    Also note that a method cannot return more than one data. It can only return one.
    But now we’re pretty much done with the `add()` method. Since the original code
    also prints our operation, I will create an additional print statement:

    ![Code 9.11: Adding print statement to add method](Image00204.jpg)

    Code 9.11: Adding print statement to `add()` method Congratulations! You have
    created your own method!


    ### 9.2.4 Calling a Method


    We’ve defined our `add()` method, but if you run the `CleanCalculator` code now,
    nothing will happen. This is because we haven’t written the code that actually
    uses `add()`. Calling methods is the programming term for “using methods.” Calling
    methods from the same class file is simple. You need to type out the method name
    and provide input values to the arguments. Code 9.2 demonstrates this with `add(2,4)`.
    Note that you must still use the `main()` method as the entrypoint to start the
    calculation. Meaning, we need to call `add()` in `main()`.

    ![Code 9.12: Calling the add method in side the main() method](Image00205.jpg)

    Code 9.12: Calling the `add()` method inside the `main()` method Remembering from
    Chapter 5, we always read the variable initialization from right to left. On the
    right side of the equal sign, we called the `add()` method. The call will have
    Java execute the code inside `add()`. At the end, the method will return 6. When
    we return, we go back to the code we were at before the call: `int calculatedNumber
    = add(2,4)`. The `add(2,4)` gets replaced with the 6, and that 6 gets stored inside
    the variable.

    ![Diagram 9.1: Workflow of method call](Image00206.jpg)

    Diagram 9.1: Workflow of method call Let’s compile and run this code:

    ![Image00207.jpg)


