    # Chapter 12: Classes and Objects


    Chapter 12 and Chapter 13 will be the most important as they are the foundation
    of object oriented programming. We have been using classes in every code we wrote,
    starting it with `public`. We used classes like a file, but there''s more to them.
    Classes are used to create objects, and objects are used to write clean and powerful
    code. Goal of this chapter: let’s create a proper class. In Chapter 13, we’ll
    learn to create objects from this class.


    ## Section 12.1: What is a Class?


    A class is a template we can use to create objects. For example, you’re a designer
    who wants to create different bags to sell to vendors. But in order to create
    these bags, you need to first create a basic design for it. This basic design,
    or template, is a class.

    ![Diagram 12.1: A bag blueprint. In programming, this would be a class](Image00237.jpg)

    Diagram 12.1: A bag blueprint. In programming, this would be a class Inside a
    blueprint, you would define the general attributes needed to create a bag. The
