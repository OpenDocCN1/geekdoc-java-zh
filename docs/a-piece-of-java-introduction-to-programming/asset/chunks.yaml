    Code 12.5: Creating the constructor We have declared the constructor, but what
    about the body? We don’t know the values of our fields yet, so can we initialize
    them? We have two options:

    * Option 1: Create a `Bag()` constructor and define all the fields to empty values.
    The programmer can reassign values at their convenience.

    * Option 2: Create a `Bag()` constructor with arguments you can pass in to initialize
    the fields. The programmer can specify values of the attributes while constructing
    the object with this approach. I will implement both ways in the code. Option
    1: we can initialize all of the global variables to be an “empty” value. I will
    make all integers -1 to indicate they aren’t defined properly, and will assign
    the String variables with quotes to show that these attributes are not yet:

