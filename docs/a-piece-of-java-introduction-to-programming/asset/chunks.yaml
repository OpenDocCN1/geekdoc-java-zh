    ## Section 6.1: Compilation Errors

    Compilation errors occur when you compile your code (`javac ErrorTest.java`).
    When compiling, Java proofreads if you have any grammatical errors in your code,
    such as missing a semicolon, typo in variable name, or incorrect data types. Compilation
    errors will prevent your code from creating that class file in your directory.
    For example, let’s say you have the following code:

    ![Code 6.2: Erroneous code](Image117.jpg)

    Code 6.2: Erroneous code

    Can you tell what’s wrong?

    This code will throw a compilation error because we declared a variable of type
    `String`, yet we assigned an integer `2`. This is a data type mismatch. Let’s
    see what happens when we compile this code.![](118.jpg)

    Let’s break down this error message. First, we see the class file and line number
    on which the error occurred: `ErrorTest.java:5: error`

    The 5 is the line number of the erroneous code. It might be a different number
    for you. My line 5 is `String number = 2`. Next, we see what the issue is: `incompatible
    types: int cannot be converted to String`. So let’s fix it. You could change the
    variable type to an `int` or change the value `2` to `String`.

    ![Code 6.3: Fixed code](Image119.jpg)

    Code 6.3: Fixed code

    Now if we compile this code, we won’t run into any issues.![](120.jpg)


    ## Section 6.2: Runtime Error

    Runtime error occurs when you are running your code (`ErrorTest`). They’re usually
    functional errors that compilers cannot catch. Let’s look at the below:

    ![Code 6.4: This code would compile fine](Image121.jpg)

    Code 6.4: This code would compile fine

    Just by looking at it, isn’t any grammatical mistake nor data type mismatch. The
    code looks to make sense, and thus the compiler will let it pass. Then what is
    wrong with this code? When we look at `int calculatedNumber = 2/0`, we know it’s
    impossible to divide any number by zero. Therefore, this will throw us a error.![](122.jpg)

    As you see here, we compiled perfectly, but ran into following error: `Exception
    in thread "main" java.lang.ArithmeticException`. We specifically ran into `ArithmeticException`.
    This means that we tried to perform a math operation that isn’t possible. Overall,
    finding errors in Java is like when you’re writing a book and proofreading it.
    Compilation errors are when you have typos and grammatical errors in your sentences.
    Runtime errors are any plot holes you may have in your story. There are different
    kinds of exceptions, but you’t need to memorize them. Programmers just look it
    up when they get one.

