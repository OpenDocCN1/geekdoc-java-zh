    ## Section 5.3: Common Data Types

    There are other data types variables can use.


    ### 5.3.1: Number Data Types

    As you know, `int` stores whole numbers, both negative and positive.

    `long` is a data type that stores bigger whole numbers than the `int` data type.
    You probably won’t see this data type often in this book since we deal with smaller
    integers. When you assign a `long` value, you should put an `L` at the end of
    the number, though this is optional as long as you explicitly declare the variable
    to be `long`:![](102.jpg)

    `float` stores decimal numbers. We’ll commonly use this to store the majority
    of our decimal numbers in this book. You must put an `f` at the end of the number:![](103.jpg)

    `double` stores larger decimal numbers than a `float`. Much like `long`, you might
    not use it often in introductory Java. You should add a `d` at the end of the
    number, though it''s optional:![](104.jpg)


    ### 5.3.2: String

    We’ve been using the double quotes “ ” to denote texts. These texts also have
    a data type called `String`. For the rest of this book, we’ll call the texts `String`
    instead. In order to create `Strings`, you must always use double quotes “ “.
    You cannot use single quotes as that denotes a different data type (denotes `char`).
    This is how you would declare and initialize a `String` variable:![](105.jpg)

    As you’ve learned in Chapter 3, we can append texts together:![](106.jpg)

    This appending of texts is called concatenation. We have concatenated the `String`
    “Hello “ and “World” together. We’ll revisit `String` in a later chapter once
    we’ve learned more advanced topics.


    ### 5.3.3: boolean

    The data type `boolean` is used to represent two values: `true`, `false`. In Chapter
    4, we learned about comparing two numbers, and how Java would return either `true`
    or `false` based on the comparison. Java was returning `boolean` values. This
    is how we declare and initialize `boolean` variables:![](107.jpg)

    Note that `true` and `false` are keywords and are case-sensitive. You can also
    store comparison inside a variable:![](108.jpg)

    `x` should store `true` while `y` should store `false`.


