    ## Section 12.4: Creating the Bag Class


    A basic class template is made up of three:

    * Global variables that represent the class’s attributes (i.e. color of bag, size,
    fabric, etc..)

    * A Constructor that can be used to create objects

    * Methods to help access or set a different value for the attributes; we can add
    other methods that may be useful to the object Not all three components are required
    to create a class, but they will be used to create the Bag class. Note: when we’re
    constructing the Bag class, we will not be using the `static` keyword to declare
    our global variables and methods. We will go over why in Chapter 14, but for now,
    know that we will dropping the `static` keyword.


