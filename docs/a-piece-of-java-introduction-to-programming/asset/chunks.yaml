    it’s 3, then use attack 3.The Game class is really free for all, so you can do
    whatever you want with it!Chapter 14: StaticIn Chapter 9, we learned about creating
    and using methods, and in our method declaration, we added the keyword static.
    But in Chapter 12, we dropped the static keyword in our global variable and method
    declarations.Why?In this chapter, we will learn what static means.Section 14.1
    Properties that Belong to ObjectsThere are fields and methods that belong to objects
    and those that belong to the class.All the fields and methods we wrote for the
    Bag class belong to the objects . A copy of the fields and methods are made when
    a new object is created.Let’s look at an example. We still have the same Bag class
