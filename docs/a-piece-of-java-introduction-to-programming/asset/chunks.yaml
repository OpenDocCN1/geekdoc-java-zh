    ![Code 14.2: Change bluepack’s fabric field to Velvet](Image00279.jpg)

    Code 14.2: Change `bluebackpack`’s fabric field to `Velvet` Visually we have the
    following:

    ![Diagram 14.2: Fabric field changed to Velvet for bluepack](Image00280.jpg)

    Diagram 14.2: Fabric field changed to `Velvet` for `bluebackpack` Notice that
    when we changed the fabric of `bluebackpack` to Velvet, it only changed the fabric
    of `bluebackpack` and not for `pinkPurse`. This is because `bluebackpack` and
    `pinkPurse` have their own copies of the fabric field.


    ## Section 14.2: Properties that Belong to the Class


    We use the `static` keyword when a global variable or method belongs to the class.
    Copies of static global variables and methods will not be made for each object.
    Let’s say we add a new global variable to the `Bag` class, but declare it as `static`.
    Perhaps we want to know the name of the designer who created these bags.

