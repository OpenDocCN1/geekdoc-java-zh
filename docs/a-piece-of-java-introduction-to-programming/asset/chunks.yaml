    ## 10.3: When to Use Local vs. Variables


    Questions to ask yourself:

    * Do all your methods need access to the variable’s information?

    * Or you only need it for one method?

    * Can we just pass the value into the method, or is that possible?


    Global variables will become more important when we learn about classes and objects.


