    `calculatedNumber` is a local variable to the `main()` method. Why? Because we
    declared the variable inside the `main()` method. This means that the data of
    `calculatedNumber` cannot be accessed by other methods, such as `add()`, `subtract()`,
    `multiply()`, `divide()`, `modulus()`. See what happens when you try to access
    `calculatedNumber` from `subtract()`:

