    ranges:●           x = 0, y = 10●           x = 11, y = 2●           x = 10, y
    = 0Chapter 12: Classes and ObjectsChapter 12 and Chapter 13 will be the most important
    chapters as they are the foundation of object oriented programming.We have been
    using classes in every code we wrote, starting it with public class . We used
    classes like a file, but there''s more to them. Classes are used to create objects,
    and objects are used to write clean and powerful code.Goal of this chapter : Let’s
    create a proper class. In Chapter 13, we’ll learn to create objects from this
    class.Section 12.1 What is a Class?A class is a template we can use to create
    objects.For example, you’re a designer who wants to create  different bags to
    sell to vendors. But in order to create these bags, you need to first create a
    basic design for it. This basic design, or template, is a class.![Diagram 12.1:
    A bag blueprint. In programming, this would be a class.](Image00237.jpg)Diagram
    12.1: A bag blueprint. In programming, this would be a class.Inside a blueprint,
    you would define the general attributes needed to create a bag. The list of attributes
    is limitless, but here are a few things we could consider:●           Color of
    the bag●           Bag size (how many items can we put in our bag?)●          
    Fabric of the bag (leather, patent, velvet, etc..)●           Number of straps●          
    Strap length (short, medium long?)●           Type (Is it a backpack? Purse? Messenger
    bag?)From this template, we should be able to create different kinds of bags.
    In terms of programming, we should be able to create multiple objects from one
    class template.So a class provides general attributes needed to create an object.Section
    12.2 What is an Object?Objects are the specific “things” we create from the class
    template. In our bag scenario, let’s say we want to create a blue backpack and
    a pink purse. These bags can be created from the same bag template we outlined
    previously:●           Blue backpack○           Color: blue○           Bag size:
    Can fit 10 items○           Fabric: Polyester○           Number of straps: 2○          
    Strap length: medium○           Type: backpack●           Pink purse:○          
    Color: pink○           Bag size: Can fit 3 items○           Fabric: Fur○          
    Number of straps: 1○           Strap length: short○           Type: Purse![Diagram
    12.2: These series of bags are objects created from the bag blueprint, or class.](Image00238.jpg)Diagram
    12.2: The blue backpack and pink purse are objects created from the bag blueprint.We
    were able to create two bags from the template, and they are what we call objects.
    They are the specific "things" we made from the blueprint.Section 12.3: Why Use
    Classes and Objects?Let’s say we wanted to create bags right now without having
    any knowledge of classes and objects.What we have learned so far is storing data
    in variables and organizing code into different methods.Below is the code attempting
    to create the blue backpack and pink purse using variables. You can also take
