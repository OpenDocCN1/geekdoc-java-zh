    ## Section 14.3: To Do’s and Don’ts With Static


    Objects can access things that belong to the class. This is because static values
    do not change based on objects. Classes cannot access methods and variables that
    belong to objects. This is because object fields/methods depend on the creation
    of objects. For example, let''s say there is a classroom with a whiteboard at
    the front of the room. The classroom is the class, the students are the objects,
    and the whiteboard is the static field. Students can freely access the whiteboard
    whenever they walk up to it. The whiteboard is static in its position while students
    are not. For a programming example, you cannot do this:

    ![Code 14.8: Erroneous code](Image00289.jpg)

    Code 14.8: Erroneous code Compilation error:

    ![Image00290.jpg)

    You cannot access the field within a static method, because color belongs to the
    object.


    ## Section 14.4: When Use Static Variables and Methods


    A question to ask yourself:

    * Do I know the value of this variable before creating an object?

    * If I want to change the value of a variable, do I want to apply this change
    for all objects, or should the change object-specific?


    So why did we make our methods and variables static in the beginning? This was
    because we hadn’t gone over the concepts of objects, and we needed to call the
    methods in `main()`. If you created a non-static method and called it in `main()`,
    your code will complain. You would''ve needed to create an object to call that
    method. Use instance methods when possible.


    # Chapter 15: Javadocs


    We’ve written our `Bag` class that could be used to create objects. Now we need
