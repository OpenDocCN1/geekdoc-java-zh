    Javadoc. Javadocs are online documentations of the classes available for programmers
    to reference. The JDK also provides the tool to create such documentations. Here
    is an example of what Javadocs look like for the `String` class provided by Oracle:
    [https://docs.oracle.com/javase/8/docs/api/lang/String.html](https://docs.oracle.com/javase/8/docs/api/lang/String.html)

    You can look up Javadocs easily on the search engine when you type the name of
    the class and “Java” into your search.


    ## Section 15.1: Components of a Javadoc


    There are five information Javadocs provide:

    1. Where to import the class:![Image00291.jpg)

    We didn’t need to import anything yet, but as we learn to use more advanced classes,
    we’ll need to pull them in manually. We’ll learn more about this in the next chapter.

    2. Description of the class:![Image00292.jpg)

    Javadocs provide a description of what the class is and how it can be used.

    3. Fields![Image00293.jpg)

    If the fields are private, they usually won’t show up on the Javadocs. Since we
    have control over the `Bag` class, there are specific commands we can use to display
    private fields.

    4. Constructors:![Image00294.jpg)

    Javadocs provide a list of constructors programmers can use to create an object
    from this class.

    5. Methods:![Image00295.jpg)

    Javadocs provide a list of methods programmers can use for this class, both static
    and instance methods. If you scroll further down in the Javadocs, there will be
    more detailed information on how you can use these methods and constructors.


