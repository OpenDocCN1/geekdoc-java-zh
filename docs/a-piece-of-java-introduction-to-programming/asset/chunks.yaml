    ## Section 9.3: Reusing Code With Methods


    Doesn’t it look like overall had to write more code for `Calculator` than `VariableCalculator`?
    That’s true, but here are some benefits to creating methods:

    * It’s more readable. It’s easier to read `add()` than it is to read `x + y`.

    * You don’t have to rewrite the same code in parts of your program. You can just
    call the method and be done with it.


    Without methods, we would write our code like this:

    ![Code 14: Longer code for main method when not using methods](Image00210.jpg)

    Code 14: Longer code for `main()` method when not using methods. This is written
    in `CleanCalculator` class. Output:

    ![Image00211.jpg)

    Or we could organize our code by calling the `add()` method instead:

    ![Code 15: Cleaner code with methods. More readable and less cluttered](Image00212.jpg)

    Code 15: Cleaner code with methods. More readable and less cluttered Same result:
    This is why methods are useful; you can reuse the same code simply by calling
    the method.


    ## Section 9.4: Organizing Methods, Does Order Matter?


    Does it matter that the the `add()` method was defined before `subtract()`? No.
    You can write the method definitions in any order. What is the order in which
    you call the methods. General practice is to either keep the `main()` method at
    the beginning of the class or at the end of the class.


    To wrap up:

    * A method is a group of code that performs one function.

    * A method is made up at least six components: access modifier, static, return
    type, method name, argument, body.

    * `void` is a return type declared for a method when you don’t return anything.

    * `return` is a Java keyword used to return data. The data returned must match
    the data type declared in the method. You cannot return more than one.


