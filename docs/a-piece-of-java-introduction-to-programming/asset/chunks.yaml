  trans: "\n- `for` 是 Java 中用于启动 `for-loop` 的关键字。\n- 在括号 `( )` 内部有三个用分号隔开的代码语句：\n\
    \    - `int i = 0` → 这条语句告诉循环计数器从哪里开始。`i` 将是计数器，用于记录我们循环的次数。我们通常让 `i` 从 0 开始。\n\
    \    - `i < x` → `x` 是我们想要循环的次数。这是一个条件语句，意思是“一直循环直到 `i` 达到 `x`”或“如果 `i` 仍然小于 `x`，则继续循环”。**\n\
    \    - `i++` → 将计数器 `i` 加 1。这等同于 `i = i + 1`。`i` 将不断增加直到达到 `x`。\n- 注意，当我们定义 `x`\
    \ 时，`x` 必须大于我们为 `i` 定义的起始数字（在这种情况下 `x` 必须大于 0）。\n- `{ }` 是 `for-loop` 的体体，我们在这里编写需要重复\
    \ `x` 次的代码。\n\n现在，让我们使用以下类文件通过 `for-loop` 打印六次“Hello World”：\n![代码 8.3: HelloWorld\
    \ 类文件的结构](img/Image00165.jpg)\n代码 8.3: ForLoopHelloWorld 类文件的结构\n\n通过编写骨架结构启动\
    \ `for-loop`：\n![代码 8.4: 启动 for-loop 的结构](img/Image00166.jpg)\n代码 8.4: 启动 for-loop\
    \ 的结构\n\n我们想要重复打印“Hello World”，因此在体内部编写打印语句：\n![代码 8.5: 编写 for-loop 的体](img/Image00167.jpg)\n\
    代码 8.5: 编写 for-loop 的体\n\n现在我们需要定义计数器，我们将循环六次。我们将让计数器 `i` 从 0 开始。\n![代码 8.6: 声明并初始化计数器\
    \ i 为 0](img/Image00168.jpg)\n代码 8.6: 声明并初始化计数器 i 为 0\n\n接下来，我们需要定义 `i` 应该数到几。由于\
    \ `i` 从 0 开始，`i` 应该数到 5（0, 1, 2, 3, 4, 5 总共是六个数）。我们可以将条件语句写为 `i <= 5`：\n![代码 8.7:\
    \ 为计数器 i 编写条件语句](img/Image00169.jpg)\n代码 8.7: 为计数器 i 编写条件语句\n\n现在我们需要显式地告诉 `for-loop`\
    \ 它应该如何增加 `i`。我们每次增加 1：\n![代码 8.8: 定义计数器 i 的增加方式](img/Image00170.jpg)\n代码 8.8:\
