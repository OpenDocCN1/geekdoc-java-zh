    # Chapter 7: If/Else Statements

    In the previous chapters, we got familiar with boolean values by printing them,
    but there''s more they can do. We can use booleans to execute certain blocks of
    code based on one condition, another block of code for a different condition.
    We’ll learn how to do this using if/else statements. I recommend revisiting Table
    4.2 from Chapter 4 for the comparison operators. We will be using them in this
    chapter.


    ## Section 7.1: Writing If/Else Statements

    We use `if/else` statements to trigger certain blocks of code for one condition,
    and another block of code for a different condition. For example, let’s say your
    plan was to hang out with friends if the weather is nice. So, if the weather is
    nice, then you’ll hang out with friends. Else, if it’s raining outside, then you
    will decide not to go out. Your going outside is conditional to the weather. The
    syntax, or grammatical structure, for If/Else Statements in Java is the following:

    ![Code 7.1: General structure of an if/else statement](Image124.jpg)

    Code 7.1: General structure of an if/else statement

    Structure of the `if` statement:

    - `if` is a Java keyword used to start the conditional statement.

    - `()` is where we will include the boolean condition, which evaluates to either
    true or false.

    - `{}` is the body for the `if` statement. We will execute the blocks of code
    written here if the if-condition is true.

    Structure of the `else` statement:

    - `else` is a Java keyword. We enter this case if we don'' meet the `if` condition.

    - `{}` is the body of the `else` statement that will execute when `else` is triggered.

    ![Diagram 7.1: Visual diagram of if/else statements](Image125.jpg)

    Diagram 7.1: Visual diagram of if/else statements

    There’s also another conditional statement: `else-if`. If the first condition
    wasn’t met, then we can specify another condition to check using `else-if`:

    ![Code 7.2: General structure of an if-else-if/else statement](Image126.jpg)

    Code 7.2: General structure of an if-else-if/else statement

    ![Diagram 7.2: Visual diagram of if-else-if/else statement](Image127.jpg)

    Diagram 7.2: Visual diagram of if-else-if/else statement

    Some things to note for conditional statements:

    - You must always begin with an `if` statement. You cannot start with `else-if`
    or `else` statements.

    - `Else-if` and `else` statements are optional. You technically only need the
    `if` statement.

    - You can have multiple `else-if` statements. They must all be defined after the
    `if` statement and before the `else` statement. `else-ifs` are always the “middleman.”

    - You can also have multiple `if` statements in the same code, and they will be
    treated independently from each other.

    - For each `if` statement, you can only have one `else` statement.


