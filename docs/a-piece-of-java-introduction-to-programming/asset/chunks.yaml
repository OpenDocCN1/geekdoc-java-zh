    # 第 0 章：欢迎来到 Java

    欢迎学习使用 Java 编程！这本书是为编程初学者准备的，祝喜你开启了这段旅程。


    书中提供了许多代码示例，我强烈建议你跟着代码一起输入，并避免复制和粘贴。我们希望在你的打字中建立肌肉记忆，让你在编写 Java 代码时感到从容。


    要学习的内容非常多，我本身并不是专家。我在大学期间学习 `Java` 时曾经历过挣扎，我希望传递一些我的知识，让你不至于像我当年那样吃力。


    本书将不会涉及 `Java` 在机器层面如何运行的底层细节，只会提供足够让你开始编码的信息。


    ## 什么是 Java？

    `Java` 是一种由 `Sun MicroSystems` 在 20 世纪 90 年代最初的编程语言，后来在 21 世纪被 `Oracle Corporation`
    收。`Java` 用于创建桌面应用程序、Web 应用程序甚至移动应用，因此它的用途非常广泛。


    `Java` 是学习并构建编程基础的极佳语言，特别是面向对象编程方面。我相信当你学会了 `Java`，就能很快地上手其他语言，因为面向对象编程（OOP）的原理是一致的。所以
    `Java` 是一项非常实用的迁移技能。


    如前提到的，书中有很多代码示例。代码的最终版本和练习题可以在这里获取：[`bit.ly/introtojavabook`](http://bit.ly/introtojavabook)


    如果你在排查 `Java` 问题时遇到困难，或者对编程概念有更深入的疑问，请随时通过邮件联系我：`apieceofjava@gmail.com`


    # 第 1 章：安装 Java

    我将提供两种体验 `Java` 的方案：

    * 方案 1：在你的电脑上编写并运行 `Java`。这将是我们在书中学习 `Java` 的主要方式。

    * 方案 2：使用在线平台编写并运行 `Java`。如果你无法让方案 1 工作，可以使用方案。


    ## 第 1.1 节：运行 Java 需要的工具

    编写和运行 `Java` 需要三样东西：

    1. 文件管理器（File Organizer）

    2. 文本编辑器（Text Editor）

    3. 命令行窗口（Command Window）


    我提到的这三个组件已经存在于你的电脑中了。让我们逐一介绍。


    ### 工具 1：文件管理器

    这是你创建新文件夹保存代码的地方。


    在我的桌面上，我创建了一个名为 `Java_Practice` 的新文件夹。我将所有的代码都保在这个文件夹里。

    ![](img/Image00002.jpg)


    ### 工具 2：文本编辑器

    就像你使用文字处理程序来写论文一样，你需要一个应用程序来写代码。


    你电脑上自带的基础编辑器有：

    * Windows 用户：`Notepad`（记事本）

    * Macintosh 用户：`TextEdit`


    我们将使用这些编辑器来保存 `Java` 文件。它们并不漂亮（不支持代码高亮），但完成任务。


    如果你想要代码高亮，我建议下载 Atom。`Atom` 是一个支持 Windows 和 Macintosh 的编辑器：https://atom.io/


    ### 工具 3：命令行窗口

    在 Windows 上，它被称为 `Command Line` 或 `Command Prompt`（命令提示符）。在 Macintosh 上，它被称为 `Terminal`（终端）。在本书中我统称之为命令行窗口。


    命令行窗口是你电脑的远程控制台。它了解目录以及其中存在的文件。你也可以跳转文件夹。我们可以使用命令行窗口运行代码。在我们的案例，我们将运行 `Java` 程序。在
    Windows 上查找“Command Line”，在 Macintosh 上查找“Terminal”。它看起来应该是：

    ![](img/Image00003.jpg)


    对于 Windows 用户，它应该是一个黑框。Macintosh 用户通常是白框。注意 `C:\Users\`，这是命令行窗口所感知的路径。由于电脑不同，你的文件路径也会不同。在
    Windows 上，你可能会看到 `C:\Users\<用户名>`；在 Macintosh 上你可能会看到 `~\<用户名>`。那是根目录，通常也是下载、桌面和文档文件夹所在的位置。


    你应该学会以下命令：`cd <路径>`。“切换目录”允许你进入不同的文件夹。我想让命令行窗口位于 `Java_Practice` 文件夹，它位于桌面。首先我们需要使用以下命令进入桌面：

    ```

    cd desktop

    ```

    ![](img/Image00004.jpg)


    按下回车后，注意文件路径变为 `C:\Users\Desktop`。这意味着命令生效了并成功进入了桌面文件夹。现在我们要进入 `Java_Practice`
    文件夹。我们使用相同的命令，但名称不同：

    ![](img/Image0005.jpg)


    太好了，现在命令行窗口的文件路径是 `C:\Users\Desktop\Java_Practice`。这意味着我们成功将命令行窗口移动到了 `Java_Practice`
    文件夹。我们下一章学习更多运行程序的命令。


    ## 第 1.2 节：安装 Java

    ### 方案 1：在你的电脑上安装 Java

    我们目前的命令行还没有理解 `Java` 的工具，所以还无法运行程序。因此，我们需要下载一个能让窗口理解的包。这个包被称为 `JDK`（Java 开发工具包）。本书将使用
    `JDK` 8，但我建议你使用 Oracle 网站上的最新版本，目前是 `JDK` 15：https://www.oracle.com/java/technologies/javase-15-downloads.html


    使用哪个版本的 `JDK` 并不重要，因为所有版本的内核编程概念都是共通的。如果你想下载旧版本，Oracle 要求登录账号。最新版本不需要。这里是所有可下载的
    `JDK` 的通用链接：https://www.oracle.com/java/technologies/javase-downloads.html


    对于 Macintosh 用户，点击“Mac OS Installer”（Mac OS 安装程序）下载。对于 Windows 用户，使用“x64 Installer”下载。此
    `JDK` 支持 64 位操作系统。要检查你的操作系统，前往“设置” > “关于电脑”，然后检查系统类型。如果你是 32 位的，可以下载 `JDK` 8（在“Windows
    x86”下）：https://www.oracle.com/java/technologies/javase/javase-8-downloads.html


    按照下载说明完成安装。Windows 用户：下载后可能需要重启电脑，以便 `Java` 正确更新到你的电脑。


    对于所有用户，要检查是否正确下载了 `Java`，在提示符中输入以下命令：

    ```

    java -version

    ```

    如果下载正确，窗口应该显示 `Java` 版本。如果没有，它会提示无法识别 `java` 命令。


    ### 方案 2：在线编写 Java 代码

    如果你无法让方案 1 工作，我建议使用在线 `Java` 编译器。我推荐 `Codiva`：https://www.codiva.io/ 但你也可以查找其他编译器来使用。


    当你深入探索编程世界时，你可能会遇到一种被称为 `IDE`（集成开发环境）的工具。`IDE` 是一个在一个程序内就为你提供全部三个组件（文件管理器、文本编辑器、命令行窗口）的平台。这样，你就不需要像在方案
    1 中那样手动操作一切。`Codiva` 就是一个在线 `IDE`。


    既然可以做方案 2，为什么还要费劲做方案 1 呢？你可以这样做，但我认为方案 1 会让你对 `Java` 的原理有更好的理解。


