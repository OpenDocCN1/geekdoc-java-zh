    Diagram 5.3: Visual representation of Code 5.8, initializing your variable

    You can also declare your variable and wait to initialize it later in the code:

    ![Code 5.9: You can declare your variable and initialize later in your code](Image0085.jpg)

    Code 5.9: You can declare your variable and initialize later in your code

    Declaring a variable can be its own statement, denoted by the semicolon. You cannot
    have the initialization by itself.

    Things to note about initializing:

    - Must store values that align with the declared data type. Meaning, you can’t
    store a text inside the `int calculatedNumber` variable.

    - You can reassign new values to the same variable as much as you want.

    Overall, the initialization step `calculatedNumber = 2 + 4` happens right to left.
    Meaning, we can read it as, “We are assigning the value 2 + 4 to an integer variable
    `calculatedNumber`.”


    ### 5.1.2 The Assignment Operator

    When we want to store values into variables, we use the `=` sign. The `=` is called
    the assignment operator. In the last chapter, we learned about checking the equality
    between two numbers using `==`. never use the `=` sign to check for equality.
    It is purely for assigning values to variables. This is one of the most common
    mistakes programmers make.

