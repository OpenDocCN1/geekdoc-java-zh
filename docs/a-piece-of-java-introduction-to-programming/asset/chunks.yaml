    ### 5.2.1: Calculator vs. VariableCalculator class

    You might be wondering how this code is better than the `Calculator` class. The
    code looks a lot more, making it harder to read. But here are some benefits from
    variables:

    1. You, the human, don’t need to keep track of the calculated number at each step.
    You are doing less work.

    2. If you want to change some numbers around, you don’t have to rewrite your entire
    code to accommodate the number.

    From Chapter 4’s Exercise 4, you probably realized you needed to make around 10
    changes to the `Calculator` program if you wanted to use `2+8` instead in your
    initial calculation. That’s a lot of changes. What about `VariableCalculator`?
    You need 2 changes:

