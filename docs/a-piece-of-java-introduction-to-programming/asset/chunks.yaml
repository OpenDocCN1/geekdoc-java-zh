    with all fields initialized to “undefined” valuesOption 2: We can pass in arguments
    to the Bag() constructor to initialize the fields:![Code 12.7: Option 2, creating
    a Bag constructor with arguments](Image00246.jpg)Code 12.7: Option 2, creating
    a Bag constructor with argumentsLet''s evaluate Code 12.7:Are we allowed to have
    two methods of the same name?●      Yes. Java can tell they are two different
    methods because they have different arguments (one has none and the other has
    six).●       Creating methods with the same name but different arguments is called
    overloading in programming.What is this in Java?●      We use this to ensure Java
    doesn’t confuse the fields’ names with the names of the arguments passed into
    the methods. In our case, this.color or this.size is referring to the fields in
    the class, whereas color and size are referring to the arguments being passed
    in.●        this essentially refers to the object that can be created from the
    class, and what the class should do with that object.●       this says, “If I
    were an object created from this class, then I want to do the following things
    associated with this object.”○          i.e. “If I were a Bag object created from
    the Bag class, then I want to know the color of this particular Bag and change
    it to something else.”12.4.3: Getters and SettersNow we need a way to access the
    values of the fields and change them as needed. We can create methods to access
    and change fields.Getters : methods defined to access values of the fields.Setters
    : methods defined to reassign new values to the fieldsLet’s first start with creating
