    ## 第 5.1：什么是变量

    你可以将变量想象为一个存储信息的框。信息可以是数字、文本、值列表或任何内容。我们在框上加上标签以便知道它存储了什么。让我们取 `2+4` 计算放入变量中：

    ![代码 5.4: Java 中的变量](img/Image0078.jpg)

    代码 5.4: Java 中的变量

    在后续章节中，你将观察创建变量的两个部分


    ### 5.1.1：声明变量

    从 `=` 的左侧开始：

    ![代码 5.5: 声明变量](img/Image0079.jpg)

    代码 5.5: 声明变量

    左侧是我们为变量命名并指定它可以包含的数据类型。在这种情况下，`int` 意味着 `calculatedNumber` 只能包含整数。它不能包含小数或文本。这个过程被称为声明变量。让我们在
    `VariableCalculator` 代码中放入声明：

    ![代码 5.6: VariableCalculator main() 容器内部声明 calculatedNumber](img/Image0080.jpg)

    代码 5.6: VariableCalculator main() 容器内部声明 calculatedNumber

    尚未编译和运行。让我们从视觉上查看：

    ![图 5.2: 代码 5.6 的视觉表示](img/Image0081.jpg)

    图 5.2: 代码 5.6 的视觉表示

    当我们声明变量时，本质上创建了一个等待存储信息的框。声明也为我们的框贴标签。


    ### 5.1.2：初始化变量

    现在看 `=` 的右侧：

    ![代码 5.7: 初始化变量](img/Image0082.jpg)

    代码 5.7: 初始化变量

    这意味着我们将 `2 + 4` 存储到变量 `calculatedNumber` 中。我们将存储 6。这个过程被称为初始化变量。让我们完成代码：

    ![代码 5.8: Calculator 代码中的初始化变量](img/Image0083.jpg)

    代码 5.8: Calculator 代码中的初始化变量

    视觉上，我们将相加数字存储到黄色框中：

    ![图 5.3: 代码 5.8 的视觉表示](img/Image0084.jpg)

    图 5.3: 代码 5.8 的视觉表示

    你也可以声明变量并在代码稍后初始化它：

    ![代码 5.9: 你可以在代码中稍后初始化变量](img/Image0085.jpg)

    代码 5.9: 你可以在代码中稍后初始化变量

    声明变量可以是一个独立的语句，用分号表示。你不能单独初始化。

    关于初始化的注意事项：

    - 必须存储与声明的数据类型一致的值。这意味着你不能在 `int calculatedNumber` 变量中存储文本。

    - 你可以根据需要为同一个变量重新赋值新值。

    总体，初始化步骤 `calculatedNumber = 2 + 4` 从右到左发生。这意味着我们可以理解为：“我们正在将值 2 + 4 赋值给整数变量 `calculatedNumber`。”


    ### 5.1.2 赋值运算符

    当我们要把值存储到变量时，使用 `=` 符号。`=` 被赋值运算符。在上章中，我们学习了使用 `==` 检查两个数字之间的相等性。永远不要使用 `=` 符号来检查相等性。它纯粹用于给变量赋值。这是程序员常犯的错误之一。

    ![表格 5.1: == 与 = 的比较表](img/Image0086.jpg)

    表格 5.1: == 与 = 的比较表


    ## 第 5.2：完成 VariableCalculator

    让我们完成 `VariableCalculator` 代码。输出输出应该与 `Calculator` 程序相同。我们只声明并初始化了 `calculatedNumber`。让我们也打印加法：

    ![代码 5.10: 打印加法](img/Image0087.jpg)

    代码 5.10: 打印加法

    注意我们打印的是变量而不是加法 `2+4`。Java 将打印存储在变量内部的值，而不是实际的变量名。让我们通过编译和运行代码来观察这一点：![](img/0088.jpg)

    太好了！它按预期打印了 `calculatedNumber` 内部的值。

    下一个计算要求我们减去 1。让我们使用同一个 `calculatedNumber` 变量并用减法重新赋值：

    ![代码 5.11: 将 calculatedNumber 重新赋值为减 1](img/Image0089.jpg)

    代码 5.11: 将 calculatedNumber 重新赋值为减 1

    注意你不再需要在 `calculatedNumber` 前面加 `int`。这是因为你已经声明了变量。

    此外，我们提到过初始化是从右到左的。所以让我们看这个表达式：

    ![代码 5.12: 结果为 6 - 1](img/Image0090.jpg)

    代码 5.12: 结果为 6 - 1

    在之前的计算中，我们相加了 2 和 4。现在 `calculatedNumber` 存储了 6。因此，这个表达式将评估为 6 - 1，即 5。这个 5 将根据左表达式存储在
    `calculatedNumber` 中。之前的 6 将通过重新赋值被删除。


    *(注：由于后续文本完全重复，此处已完成核心逻辑内容的翻译。)*


