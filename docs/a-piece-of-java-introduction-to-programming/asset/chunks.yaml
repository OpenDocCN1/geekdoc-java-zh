    Description of the class![](Image00292.jpg)Javadocs provide a description of what
    the class is and how it can be used.3.) Fields![](Image00293.jpg)If the fields
    are private, they usually won’t show up on the Javadocs. Since we have control
    over the Bag class, there are specific commands we can use to display private
