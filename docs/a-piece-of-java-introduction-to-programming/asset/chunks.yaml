    # Chapter 0: Welcome to Java

    Welcome to learning how to program in Java! This book is meant for beginners in
    programming, so congratulations on starting your journey.


    There’s many code examples provided, so I highly recommend you type along with
    the code and refrain from copying and pasting. We want to build the muscle memory
    in your typing to get comfortable with writing in Java.


    There’s so much to learn, and I am no expert myself. I have struggled in my college
    years learning `Java`, and I hope to pass on some of my knowledge so that you
    don’t struggle as much as I did.


    This book will not go over the nitty gritty technicals of how `Java` works at
    a machine level but just enough information to get you coding.


    ## What is Java?

    `Java` is a programming language first created by `Sun MicroSystems` in the 1990s,
    then later acquired by `Oracle Corporation` in the 2000s. `Java` is used to create
    desktop applications, web applications, and even apps for mobile devices, so it’s
    pretty versatile in use.


    `Java` is a great language to learn to build your foundation in programming, specifically
    in object oriented programming. I believe when you learn `Java`, you''re able
    to pick up on other languages pretty quickly since the OOP principles stay consistent.
    So `Java` is a nice transferable skill to have.


    As mentioned before, there’s many code examples. The final version of the code
    and solutions to exercises will be available here: [http://bit.ly/introtojavabook](http://bit.ly/introtojavabook)


    Should you run into issues troubleshooting `Java` or would like more clarification
    on programming concepts, please feel free to email me: `apieceofjava@gmail.com`


    # Chapter 1: Setting up Java

    I will provide two options in which you can experience `Java`:

    * Option 1: Writing and Running `Java` on your computer. This will be the primary
    way we will learn `Java` in this book.

    * Option 2: Use an online platform to write and run `Java`. If you cannot get
    Option 1 to work, then you can use this option.


    ## Section 1.1: Tools You Need to Run Java

    There are three things you need to write and run `Java`:

    1. File Organizer

    2. Text Editor

    3. Command Window


    The three components I’ve mentioned exist on your computer already. Let’s go over
    each one.


    ### Tool 1: File Organizer

    This is where you will create new folders to save your code.


    On my desktop, I’ve created a new folder called `Java_Practice`. I will be saving
    all of my code to this folder.

    ![](Image00002.jpg)


    ### Tool 2: Text Editor

    Just as you would use applications like a word processor to write your essays,
    you need an application to write and save code.


    The basic text editors you can use on your computer is the following:

    * For Windows® users: `Notepad`

    * For Macintosh® users: `TextEdit`


    We''ll use these text editors to save `Java` files. They aren’t pretty as they
    don’t color code, but they get the basic job done.


    If you want color coding, then I suggest downloading Atom. `Atom` is a text editor
    supported for both Windows and Macintosh computers: [https://atom.io/](https://atom.io/)


    ### Tool 3: Command Window

    On Windows computers, it’s called the `Command Line` or `Command Prompt`. On Macintosh
    computers, it’s called `Terminal`. Throughout this book, I will mostly call it
    the command window, though I may use these terms.


    A command window is a remote control to your computer. It knows about directories,
    file locations, and what files exist in those. You can also travel to folders.
    We can use the command window to also run code. In our case, we’ll be running
    `Java` programs. Look up “Command Line” on your Windows machine or “Terminal”
    on your Macintosh computer. It should look like this:

    ![](Image00003.jpg)


    For Windows users, it should be a black box. The default display for Macintosh
    users is usually a white box. Notice the `C:\Users\Faith`. This is telling us
    the current location the command window is aware of. Your file path will look
    different since we’re on different computers. On Windows, you may see `C:\Users\<name
    of user>` On Macintosh computers, you may see `~<name of user>` That is your root
    directory, and that''s usually where your downloads, desktop, and documents folders
    are located.


    You should know the following command for this book:

    `cd <name of directory>` “change directory” allows you to go into different folders.
    So I want my command window to be at `Java_Practice` folder, which is located
    in the desktop. First, we need to travel to desktop using the following command:

    ```

    cd desktop

    ```

    ![](Image00004.jpg)


    After hitting Enter, notice how the file path is now `C:\Users\Desktop`. This
    means our command worked and successfully moved into the desktop folder. Now we
    want to go inside the `Java_Practice` folder. We use the same command again but
    with a different name:

    ![](Image00005.jpg)


    Great, now the command window''s file path is `C:\Users\Desktop\Java_Practice`.
    This means we successfully moved the command window over to the `Java_Practice`
    folder. We’ll learn more commands to run programs in the next chapter.


    ## Section 1.2: Setting up Java

    ### Option 1: Setting up Java on Your Computer

    Our current command window doesn’t have the tools to understand `Java`, so we
    can''t run programs yet. Therefore, we need to download the kit that will help
    our window understand. This kit is called `JDK` (Java Development Kit). This book
    will use `JDK` version 8, but I recommend you use the latest version available
    on Oracle''s website, which is `JDK` 15 currently: [https://www.oracle.com/java/technologies/javase-15-downloads.html](https://www.oracle.com/java/technologies/javase-15-downloads.html)


    It shouldn''t matter which `JDK` version you use, as the core programming concepts
    are the same for all versions. If you want to download older versions, Oracle
    requires an account sign-in. The latest version doesn''t. Here is a general link
    to all `JDKs` available for download: [https://www.oracle.com/java/technologies/javase-downloads.html](https://www.oracle.com/java/technologies/javase-downloads.html)


    For Macintosh users, click on the "Mac OS Installer" download. For Windows users,
    use the "x64 Installer" download. This `JDK` is supported on the 64-bit Operating
    System. To check your OS, go to Settings > About Your PC, then check the System
    type. If you are on 32-bit, then you can download `JDK` 8 instead (under "Windows
    x86"): [https://www.oracle.com/java/technologies/javase/javase-8-downloads.html](https://www.oracle.com/java/technologies/javase/javase-8-downloads.html)


    Follow the download’s directions to complete installation. Windows users: You
    might need to reboot your computer after the download so that `Java` gets properly
    updated to your computer.


    For both users, to check if you downloaded `Java` properly, type in the following
    command in the prompt:

    ```

    java -version

    ```

    If you downloaded correctly, then the window should display the `Java` version.
    If not, then it will tell you it doesn''t recognize the `java` command.


    ### Option 2: Code In Java Online

    If you couldn’t get Option 1 to work, then I suggest using an online `Java` compiler.
    I will recommend `Codiva`: [https://www.codiva.io/](https://www.codiva.io/) but
    you can look up another compiler to use.


    As you delve further into the programming world, you may come across something
    called an `IDE` (integrated development environment). An `IDE` is a platform that
    gives you the three components (file organizer, text editor, command window) in
    one program. That way, you don’t have to do everything manually like in Option
    1. `Codiva` is an online `IDE`.


    Then why bother doing Option 1 if we can do Option 2? You can, but I think Option
    1 will give you a better understanding of how `Java` works. Learning the basics
    will help us understand the "easier" options on a fundamental level. But we don’t
    want the frustrations of downloading `Java` become a blocker to coding. Therefore,
    using an online `IDE` is still a good option.


    # Chapter 2: First Look at Java Code

    Now that `Java` is accessible to us, let’s write some code. Note that there’s
    a lot of terminology you won’t understand with this first look. No worries! Let’s
    try to get a high level.


    ## Section 2.1: Writing and Running Java

    Open up the text editor of your choice. Within the `Java_Practice` folder, we
    create:

    ![](Image00006.jpg)


    ### Step 1: Create the Class

    The goal of our program is to print "Hello World". Notice how we use the curly
    braces to denote `class`.

    { is the beginning of `class`

    } is the end of `class`.

    Visually, this is what we have:

    ![](Image00007.jpg)


    ### Step 2: Saving the File

    Save the file as `.java`. Note the file name will be `HelloWorld`.

    ![](Image00008.jpg)


    ### Step 3: Create the “main” Container

    Inside the `class` container, we need:

    ![](Image00009.jpg)


    ### Step 4: Print Hello World

    Inside the `main()` container, we need `println()`. Deducing from the name `println`,
    you can tell that it will write out something. In order to tell `println()` what
    to write, we give it an input between the parentheses, “Hello World.” Notice every
    time we write Java sentences, or statements, we end with a semicolon. It’s like
    the period for `Java`.

