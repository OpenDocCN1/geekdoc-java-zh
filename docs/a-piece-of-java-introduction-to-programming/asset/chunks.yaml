    `javadoc Bag.java -private -d ./` That `-private` tells the program we want to
    display private fields and methods as well.


    # Chapter 16: Importing Packages


    Code in this book doesn’t require us to import packages (a package is a group
    of classes). However, more advanced topics will require such imports, as as for
    Data Structures, Input/Outputs (I/O), and so more. When we want to import a new
    package or class, we add this line before our class: `import <package name>.<class
    name>;`


    ## Section 16.1: Basic structure of importing different packages


    `import` is a Java keyword that tells the program to pull in the class/package
    we want to use. To know the package name, we can go to the Javadoc page of the
    class. The below example is a sneak peek into Data Structures, and there’s no
    need to completely understand the code, but I hope this will help you understand
    why and how we use imports. Let’s say we want to store a list of `Strings` under
    one variable. We can use something called an `ArrayList`.

