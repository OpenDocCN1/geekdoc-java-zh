    Let’s change the designer’s name to “Felicia”:![Code 14.6: This code will print
    the designer’s name before and after setting it to Felicia](Image00287.jpg)Code
    14.6: This code will print the designer’s name before and after setting it to
    Felicia![](Image00288.jpg)Section 14.3: To Do’s and Don’ts With Static●   Objects
    can access things that belong to the class. This is because static values do not
    change based on objects.●    Classes cannot access methods and variables that
    belong to objects. This is because object fields/methods depend on the creation
    of objects to know the values.For example, let''s say there is a classroom with
    a whiteboard at the front of the room along with students coming in for the class
    period. The classroom is the class file, the students are the objects, and the
    whiteboard is the static field. Students can freely access the whiteboard whenever
    they walk up to it to solve a problem. The whiteboard does not have access to
    the students as it cannot look through their things. The whiteboard is static
    in its position while students are not.For a programming example, you cannot do
    this:![Code 14.8: Erroneous code](Image00289.jpg)Code 14.8: Erroneous codeCompilation
    error:![](Image00290.jpg)You cannot access the field color within a static method,
    because color belongs to the object.Section 14.4: When To Use Static Variables
    and MethodsA question to ask yourself:●           Do I know the value of this
    variable before creating an object for it?●          If I want to change the value
    of a variable, do I want to apply this change for all objects, or should the change
    be object-specific?○          i.e. Do I want to change the color of my bag to
    pink for all the bags I create, or just the one I care about?So why did we make
    our methods and global variables static in the beginning of this book? This was
    because we hadn’t gone over the concepts of objects, and we needed to call the
    methods in main(). If you created a non-static method and called it in main(),
    your code will complain. You would''ve needed to create an object to call that
    method. This is because static methods (main() ) cannot directly call methods
    that belong to an object (non-static, instance methods).In the long run, there
    was no special reason, but I recommend using instance methods rather than static
    methods from hereon when possible.Exercises:1\. In the Bag class, we created a
    static global variable called designer and created static getters and setters
