    next condition?” The condition for our `else-if` is “temperature is between 14
    and 22.” Another way to say this is “temperature is greater than or equal to 14
    AND temperature is less than or equal to 22.”

    ![Code 7.17: Boolean condition for else-if](Image150.jpg)

    Code 7.17: Boolean condition for `else-if`

