    ![Code 7.19: Adding the third condition as else-if](Image152.jpg)

    Code 7.19: Adding the third condition as `else-if`

    Now we have the last condition to code when `temperature` is greater than 30.
    We can write another `else` statement, but because our first three conditions
    covered all the number ranges up to 30, we can use the `else` statement instead:

    ![Code 7.20: Final condition, else statement](Image153.jpg)

    Code 7.20: Final condition, `else` statement

    Now let’s try to compile and run the `WeatherReport` class. Which message do you
    think it will print?!![](154.jpg)

    The program triggered the first condition, `temperature <= 13`, because we defined
    our `temperature` to be 10. Now what will happen if I put 100 as the value for
    `temperature`?![](155.jpg)

    Compile and Run:![](156.jpg)

    This time we got into the last condition (the `else` statement). You can change
    the temperature value around to trigger the second and third conditions and see
    what the program will print.


    ## Section 7.4: Writing Else-ifs vs. Series of Ifs

    So why did we write a series of `else-if` statements instead of having a bunch
    of `if` statements? For example, why didn’t we write it like this?![Code 7.21:
    Writing series of if statements for WeatherReport](Image157.jpg)

    Code 7.21: Writing series of `if` statements for `WeatherReport`

    We certainly could have, but your program will be doing extra work. When looking
    at Code 7.21, we see that the temperature is set to 10, meaning it will trigger
    the first `if-statement`. We should be done with the program upon triggering the
    first condition. But in reality, your program is going to look through every single
    `if` condition you defined. This is because Java treats each `if` statement independently
    from each other. That''s where `else-if` statements can help. Once one of the
    condition is triggered, your program will not look at the rest of the `else-if`
    and `else` statements. A lot of this is invisible work done by Java. But there
    are also valid cases when you would want to use a series of `if` statements. Let’s
    say we still want to print out the original messages in `WeatherReport`, but we
    also want to print another message when it''s 9℃: “It’s 9 degrees Celsius today,
    which is divisible by 3, and 3 is a lucky number! Hoorah!” We can write another
    `if` statement after the original conditions:![Code 7.22: Adding another if statement
    to WeatherReport](Image158.jpg)

    Code 7.22: Adding another `if` statement to `WeatherReport`

    We’d get the following when we compile and run:![](159.jpg)

    Notice how we print the message from both `if` statements.


