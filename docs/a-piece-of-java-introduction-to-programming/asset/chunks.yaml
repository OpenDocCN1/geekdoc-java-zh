    # Chapter 11: Access Modifiers


    In Chapter 9, we created methods inside `CleanCalculator` that performs math operations.
    Calling a method that''s defined within the same class was easy to do, but if
    we wanted to use `CleanCalculator`s methods in another class file? Access modifiers
    can help with this.


    ## Section 11.1: What is an Access Modifier?


    An access modifier determines whether you can use or get data from another class
    file. There two types of modifiers we''ll cover: `public` and `private`. We can
    set the access permission for:

    * Classes, but we’ll always make our classes `public`.

    * Methods

    * Global variables


    `public`: other files can freely access the class/method/global variable.

    `private`: access is restricted. Other files cannot access class/method/global
    variable.


