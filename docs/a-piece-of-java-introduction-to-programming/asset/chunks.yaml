    to import all classes in the `java.util` package, then you can use the asterisk:
    `import java.util.*;`


    ## Section 16.5: Importing everything from java.util


    Think of the packages as different sections in a library. If you need a book on
    microbiology, then you need to go to the science section. If you’re looking for
    music, then you need to go to the music section. The packages are like these sections,
    and you only need to import the sections you need.


