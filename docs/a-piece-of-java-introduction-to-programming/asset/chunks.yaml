    ## Section 15.3: Generating the Javadoc Page


    Use the following command in your terminal: `javadoc Bag.java -d ./`

    * `javadoc`: Command used to generate the Javadoc page

    * `Bag.java`: the name of the class file we’re creating the Javadoc for

    * `-d`: Tells the program we’ll save our Javadoc page in one of the directories

    * `./`: The file path where the Javadoc page will be saved. The `./` means to
    save it on the current directory the command window is aware of, but you can have
    a different file path to save it elsewhere.


    Therefore, the general structure of the javadoc command is: `javadoc <Name of
    Class>.java -d <filepath to save the Javadoc>`

    Let’s put this command in our window and hit enter:![Image00302.jpg) If you see
    something like this, then means your Javadoc was successfully created.


