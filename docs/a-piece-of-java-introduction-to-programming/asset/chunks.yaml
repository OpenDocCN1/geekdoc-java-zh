    Option 2: we can pass in arguments to the `Bag()` constructor to initialize the
    fields:

    ![Code 12.7: Creating a constructor with arguments](Image00246.jpg)

    Code 12.7: Creating a constructor with arguments Let''s evaluate Code 12.7: Are
    we allowed to have two methods of the same name? Yes. Java can tell they are two
    methods because they have different arguments (one has none and the other has
    six). Creating methods with the same name but different arguments is called overloading.
    What is this in Java? We use `this` to ensure Java’t confuse the fields’ names
    with the names of the arguments passed into the methods. In our case, `this.color`
    or `this.size` is referring to the fields in the class, whereas `color` and `size`
    are referring to the arguments passed in. `this` essentially refers to the object
    that can be created from the class, and what the class should do with that object.
    `this` says, “If I were an object created from this class, then I want to know
    the color of this particular Bag and change it to something.”


    ### 12.4.3 Getters and Setters


    Now we need a way to access the values of the fields and change them as needed.
    We can create methods to access and change fields. Getters: methods defined to
    access values of the fields. Setters: methods defined to reassign new values to
    the fields. Let’s first start with creating getters for the Bag class. I will
    create a getter for the color field:

    ![Code 12.8: Creating the getter method for the color field](Image00247.jpg)

    Code 12.8: Creating the getter method for the color field When creating a getter
    method:

    * Make it `public` so that other files can use it.

    * The return type should match the data type of the field. In this case, we return
    `String` because color is of type `String`.

    * The standard naming convention for a getter method is to append `get` with the
    name of the field camel-cased (hence, `getColor`).

    * For the body of the method, we simply return the field. Now let’s create the
    setters. I will create a setter for the color field:

    ![Code 12.9: Creating a setter for the color field](Image00248.jpg)

    Code 12.9: Creating a setter for the color field When creating setters:

    * Like getters, make the methods `public` so other files can use them.

    * The return type should all be `void` because we''re only reassigning values
    to the fields. No need to return anything.

    * Pass in arguments to setter methods so you can reassign the fields with new
    values. Once again, we use `this` in `this.color = color` so we know `this.color`
    refers to the object’s field and `color` refers to the value being passed into
    the method. If you don’t want to use `this` to distinguish between the two variables,
