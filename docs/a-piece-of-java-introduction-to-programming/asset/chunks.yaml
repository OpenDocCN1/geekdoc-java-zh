    For example, we can’t access the color of the pink purse or the blue backpack.This
    is why we use class templates to create objects. You can:●           Access different
    attributes of an object freely (access color, fabric, etc..)●           Change
    the value of the object flexibly  (i.e. change color of the backpack)●          
    Access the object from different class files easilyA Bag class and object may
    not be useful to the real world. But the concepts we’re learning here are important
    fundamentals that will help you create objects that hold more meaningful data.Section
    12.4: Creating the Bag Class A basic class template is made up of three components:●          
    Global variables that represent the class’s attributes (i.e. color of bag, size,
    fabric, etc..)●           A Constructor that can be used to create objects●         
    Methods to help access or set a different value for the attributes; we can add
    other methods that may be useful to the objectNot all three components are required
    to create a class, but they will be used to create the Bag class.Note: When we’re
    constructing the Bag class, we will not be using the static keyword to declare
    our global variables and methods. We will go over why in Chapter 14, but for now,
    know that we will be dropping the static keyword.12.4.1 Fields: The Attributes
    of a ClassFirst, let’s create an empty Bag class:![Code 12.3: Basic outline of
