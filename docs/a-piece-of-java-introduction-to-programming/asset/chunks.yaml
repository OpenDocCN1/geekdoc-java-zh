    ## Section 5.4: Naming Your Variables

    There’s also conventions for naming your variables.


    ### 5.4.1: Can’ts

    - You cannot start your variable name with a number. For example, you can’t have
    `1variableName`, but you can have `variable1`.

    - You also cannot use Java keywords as variable names. For example, `String` is
    a keyword since it’s a data type. You can’t have a variable named `String`.

    - You also can’t use punctuations in your variable name, so you can’t have `variable!`.


    ### 5.4.2: Camel Casing

    Camel casing is a convention we use in how we capitalize variable names. With
    camel casing, you lowercase the first word of the variable and capitalize the
    first letter of the rest. For example, we could have written this variable as
    `lastnumber`, but that’s hard to read. With camel casing, we write it as `lastNumber`.
    That way, you can tell there are three words in the variable. Why is it called
    camel casing? Because the humps created in the variable look like humps on a camel!


