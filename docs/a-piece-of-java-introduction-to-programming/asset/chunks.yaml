  trans: "\n2. 查看下方的 `for` 循环：![](img/Image00193.jpg)在不在命令行窗口运行这段代码的情况下，写出每次迭代时 `print`\
    \ 语句的内容。\n3. 使用 `while` 循环重写问题 2 代码。\n4. 创建一个带有 `main()` 方法的新类文件。编写一个`for`循环来累加从\
    \ `x` 到 `y` 的数字。例如，从 `x = 1` 到 `y = 5` 相加应该得到 `1 + 2 + 3 + 4 + 5 = 15`。假设 `x`\
    \ 始终小于 `y`。\n5. 创建一个带有 `main()` 方法的新类文件。编写一个计算阶角的循环。例如，`5!` 应该得到 `5 * 4 * 3 *\
    \ 2 * 1 = 120`。用 `for` 循环写一个，再用 `while` 循环写一个。\n\n# 第 9 章：方法\n\n让我们回顾一下在第 5 章编写的\
    \ `VariableCalculator.java` 代码：\n![Code 9.1: VariableCalculator code from Chapter\
    \ 5](img/Image00194.jpg)\n代码 9.1: 第 5 章的 VariableCalculator 代码\n\n仅仅看一眼，代码看起来很杂乱。在\
    \ `main()` 方法内部，我们写了 12 行代码，不包括注释或空格。\n\n### 此代码的缺陷：\n1. 代码太长了，不适合放在一个方法（`main()`\
    \ 容器）中。通常，我们尽量避免在一个方法容器中塞入这么多代码。\n2. 它不易阅读。我们需要注释来了解每个计算步骤发生了什么。\n3. `main()`\
    \ 内部发生了多件事。`main()` 负责加、减、乘、除以及寻找余数。这责任太太重了。\n\n但是，如果我们的 `main()` 看起来像这样呢？\n![Code\
    \ 9.2: What if we had cleaner code?](img/Image00195.jpg)\n代码 9.2: 如果我们有更整洁的代码会怎样？\n\
    \n代码 9.2 要容易读得多。现在 `main()` 内部只有五行代码。这都是通过创建和使用方法就能实现的。\n`add()`、`subtract()`、`multiply()`、`divide()`\
    \ 和 `modulus()` 就是我们所的方法。\n\n**本章目标：** 让我们减轻 `main()` 的负担，通过创建新方法以更整洁的方式组织代码。\n\
    \n我们将使用一个名为 `CleanCalculator.java` 的新类文件来重写 `VariableCalculator` 代码。程序的输出应该保持一致：\n\
    ![Code 9.3: Outline of the CleanCalculator code](img/Image00196.jpg)\n代码 9.3:\
    \ CleanCalculator 代码大纲\n\n## 第 9.1 节：什么是方法？\n\n方法是执行特定操作的代码组。一个方法应该只做一件。例如，一个方法负责加法，另一个方法负责减法，以此此类推。\n\
    \n如果你看过电影，可能看过结尾的演职员表。演职员中提到的不同角色就是程序员所说的“方法”。电影导演是一个方法，而音乐导演是另一个。所有的职责都被分配到不同的角色，这样我们就不会让一个人承担所有工作，而这些角色对于制作一部电影是必要的。在编程中，创建一个程序需要这些不同的方法。\n\
    \n你应该在以下情况下创建方法：\n* 当你的代码混乱且难以阅读时\n* 当你注意到程序中到处重复相同的代码时\n\n所以，方法是程序员将相似的代码组织在一起以避免重复代码的方法。方法存在于类容器内部，与\
    \ `main()` 方法并列。为了组织 `VariableCalculator` 类中的代码，我们计划拥有五个不同的方法来支持数学运算。\n\n## 第\
    \ 9.2 节：如何编写方法\n\n让我们看看 `main()` 方法的结构。\n![Code 9.4: A basic main() method that\
    \ prints “Hello World”](img/Image00197.jpg)\n代码 9.4: 一个打印“Hello World”的简单 `main()`\
    \ 方法\n\n创建一个方法需要六个组件，但我们在本章中将关注其中四个。组成方法的六个组件如下：\n1. 访问修饰符：`main()` 中的 `public`\n\
    2. `static` 关键字\n3. 返回类型：`main()` 中的 `void`\n4. 方法名：`main()`\n5. 方法的参数：`String[]\
    \ args`\n6. 方法体：`System.out.println(\"Hello World\");`\n\n我们暂时忽略前两个，关注最后四个组件：\n\
    * 返回类型\n* 方法名\n* 方法的参数\n* 方法体\n\n我们将在后面的章节中回到访问修饰符和 `static` 关键字的含义。现在，我们只需记住在构造方法时加上它们即可。\n\
    \n### 9.2.1 方法中的返回类型\n\n返回类型是方法在执行完操作后返回的数据类型。这部分与声明变量的数据类型类似。例如，如果你想创建一个用于加法的方法，那么你想返回一个数字。在我们的案例中，我们将返回一个整数。我们将根据目前已知的知识开始创建\
    \ `add()` 方法的定义。我们还需要在 `main()` 方法之外执行此操作：\n![Code 9.5: Declaring the return type...](img/Image00198.jpg)\n\
    代码 9.5: 声明方法的返回类型为 `int`。忽略 `public` 和 `static`。只需知道它们需要在那。你可以声明以下返回类型：\n* `int`、`String`、`Object`、`float`\
    \ 等任何你的数据类型\n* `void`：当方法不返回任何值时\n\n### 2.2 方法名\n\n方法名应该反映方法的功能。这在编程中很重要，因为我们喜欢回顾代码，如果无法通过名称理解方法的作用，就需要改进。对于我们的加法方法，我们可以简单地称之为\
    \ `add()`。你也可以叫它 `addition()`，任何你喜欢的。方法名并不是 Java 固定的，由程序员决定。\n![Code 9.6](img/Image00199.jpg)\n\
    代码 9.6: 创建方法名 `add`。括号将表示 `add()` 是一个方法。\n\n### 2.2.3 方法参数\n\n参数是方法可以使用通用输入，而不是硬编码的值。我们通过使用变量来实现。在我们的案例中，我们希望\
    \ `add()` 方法将两个数字相加，而不是简单的 2 和 4，所以参数帮助我们泛化输入。为方法添加参数只需要声明变量。为了添加更多参数，你需要用逗号将它们分开：\n\
    ![Code 9.7](img/Image00200.jpg)\n代码 9.7: 为方法添加参数。注意我们还没有初始化这些变量，因为我们不知道它们是什么。当我们开始使用该方法时才知道。现在\
    \ `add()` 方法应该期望有两个输入。如果你不提供两个输入，Java 将抛出编译错误。你可以随意命名你的变量。我随机选择了 `x` 和 `y`。你可能会问：\n\
    * 你可以有多少个参数？我建议最多 5~7 个，以确保你的代码具有可读性。\n* 你可以使用什么数据类型传递参数？任何数据类型。\n* 如果你不需要参数呢？也可以。不在括号\
    \ `()` 中添加任何内容。\n\n### 9.2.3 方法体\n\n方法体包含了需要执行的代码。方法体由两个大括号 `{}` 表示。对于 `add()`，我们希望将两个数字相加。在这种案例中，我们将添加参数\
    \ `x` 和 `y`。\n![Code 9.8](img/Image00201.jpg)\n代码 9.8: 在方法体内编写需要执行的代码。我们还需要在方法的结尾返回加的值：\n\
    ![Code 9.9](img/Image00202.jpg)\n代码 9.9: 添加返回语句。`return` 是 Java 关键字，用于在方法结束时返回数据。再次注意\
    \ Java 代码是按行运行的，所以 `return` 语句位于方法的结尾。例如，我们不能这样做：\n![Code 9.10](img/Image00203.jpg)\n\
    代码 9.10: 错误代码。当后面还有代码需要处理时，不能提前返回。代码 9.10 将导致编译错误，因为 Java 看到在返回语句之后还有另一行需要处理的代码。此外注意方法不能返回多个数据。它只能返回一个。但现在我们基本完成了\
    \ `add()` 方法。由于原始代码也打印了我们的操作，我将创建一个额外的打印语句：\n![Code 9.11](img/Image00204.jpg)\n\
    代码 9.11: 为 `add()` 方法添加打印语句。恭喜！你创建了自己的方法！\n\n### 9.2.4 调用方法\n\n我们定义了 `add()` 方法，但如果现在运行\
    \ `CleanCalculator` 代码，什么都不会发生。这是因为我们还没有编写实际使用 `add()` 的代码。调用方法是“使用方法”的编程术语。从同一个类文件调用方法很简单。你需要输入方法名并为参数提供输入值。代码\
    \ 9.2 通过 `add(2,4)` 演示了这一点。注意你仍然必须使用 `main()` 方法作为入口来开始计算。这意味着我们需要在 `main()` 中调用\
    \ `add()`。\n![Code 9.12](img/Image00205.jpg)\n代码 9.12: 在 `main()` 方法内部调用 `add()`\
    \ 方法。记得第 5 章，我们总是从右到左读取变量初始化。在等号右侧，我们调用了 `add()` 方法。调用将让 Java 执行 `add()` 内部的代码。在最后，方法将返回\
    \ 6。当我们返回时，我们回到调用之前的代码：`int calculatedNumber = add(2,4)`。`add(2,4)` 被替换为 6。\n\
    ![Diagram 9.1](img/Image00206.jpg)\n图 9.1: 方法调用流程。让我们编译并运行这段代码：\n![Image00207.jpg)###\
    \ 9.2.5: 完整的 CleanCalculator 代码现在我们可以对剩余的操作（`subtract`、`multiply`、`divide`、`modulus`）这样做。在查看下面的解决方案之前，请自己尝试这些方法。![Code\
    \ 13](img/Image00208.jpg)\n代码 13: 完整的 `CleanCalculator.java` 代码。编译并运行：\n![Image00209.jpg)注意输出与第\
    \ 5 章的 `VariableCalculator` 完全一样。## 第 9.3 节：使用方法重用代码整体看起来比 `VariableCalculator`\
    \ 需要更多代码吗？是的，但创建方法有一些好处：* 它更具可读性。读 `add()` 比读 `x + y` 更。* 你不需要在程序的各个部分重写相同的代码。调用方法即可搞定。如果没有方法，我们会这样写代码：![Code\
    \ 14](img/Image00210.jpg)\n代码 14: 不使用方法时 `main()` 方法的冗长代码。这是写在 `CleanCalculator`\
    \ 类中的。输出：\n![Image00211.jpg)或者我们可以通过调用 `add()` 方法组织我们的代码：![Code 15](img/Image00212.jpg)\n\
    代码 15: 使用方法的更整洁的代码。结果相同：这就是为什么方法很有用；你可以通过调用方法重用相同的代码。\n\n## 第 9.4 节：组织方法，顺序重要吗？\n\
    \n`add()` 方法定义在 `subtract()` 之前重要吗？不。你可以按任何顺序写方法定义。重要的是你调用方法的顺序。通常做法是将 `main()`\
    \ 方法放在类的开头或末尾。\n\n总结一下：\n* 方法是执行一个功能的代码组。\n* 方法由至少六部分组成：访问修饰符、static、返回类型、方法名、参数、体。\n\
    * `void` 是方法不返回任何内容时声明返回类型。\n* `return` 是用于返回数据的 Java 关键字。返回的数据必须匹配方法声明的数据类型。\n\
    \n### 练习\n1. 在 `CleanCalculator` 类中创建另一个计算线性函数 `y = mx+b` 的方法。方法的输出应该是基于线性公式计算出的\
    \ `y` 值。方法应该接收 `m`、`x` 和偏移 `b`。\n   a. 使用输入 `y = 2x + 10` 调用方法，其中 `x = 2`。\n \
    \  b. 尝试 `y = (3/2)x + 2`，其中 `x = 3`。\n   c. 尝试 `y = x + 3`，其中 `x = 0`。\n2. 回顾第\
    \ 5 章的 `FillIn` 类：\n![Image00214.jpg)不要在 `main()` 方法中拥有这段代码，而是创建一个方法为我们构建这个句子。变量的值应该传递给方法。3.\
    \ 假设你在伊利诺州工作，想计算你每年需要缴纳的所得税。以下是已知信息：* 你的时薪为 $10* 你每年工作了 1000 小时* 你知道伊利诺州的所得税 5%创建一个名为\
    \ `IllinoisTaxCalculator` 的 Java 程序并创建以下方法：* 计算年收入的方法（`hourly wage * 工作小时数`）*\
    \ 计算年纳税收入的方法（`annual income * tax`）* 计算小时税额的方法（`hourly wage * tax`）* 计算净收入的方法（`annual\
    \ income - taxable income`）你的程序应该输出：![Image00215.jpg)# 第 10 章：局部 vs 变量现在我们学习了变量和创建不同的方法，可以谈论局部变量和全局变量之间的差异了。##\
    \ 第 10.1 节：局部变量到为止，我们在程序中只使用了局部变量。假设你正在电脑上写一篇文章，但你也需要在手机上访问它。文章目前保存在电脑的硬盘上，所以你的手机无法访问它。在这种情况下，文章是电脑局部的。在编程方面，局部变量是特定方法的“局部的”，其他方法无法访问该变量的数据。让我们看看以下版本的\
    \ `CleanCalculator` 代码：![Code 10.1](img/Image00216.jpg)\n代码 10.1: 第 10 章版本的 `CleanCalculator`\
    \ 的 `main()`。变量 `calculatedNumber` 是 `main()` 方法的局部变量。为什么？因为我们在 `main()` 方法内部声明了变量。这意味着\
    \ `calculatedNumber` 的数据不能被其他方法（如 `add()`、`subtract()`、`multiply()`、`divide()`、`modulus()`）访问。尝试从\
    \ `subtract()` 访问 `main` 的局部变量：\n![Code 10.2](img/Image00217.jpg)\n代码 10.2: 在\
    \ `subtract()` 中尝试访问 `main` 的局部变量。编译：\n![Image00218.jpg)我们得到一个编译错误，指出 Java 找不到符号\
    \ `calculatedNumber`。这是因为 `calculatedNumber` 是局部变量，对 `subtract()` 方法不可用。### 10.2：全局变量与其在电脑上写文章，不如你决定将其上传到网站，这样你就可以从任何地方访问它。现在文章可以认为是“全局”的。在编程中，全局变量是所有方法都可以访问的。为了将变量全局化，你必须在方法之外声明变量：![Code\
    \ 10.4](img/Image00220.jpg)\n代码 10.4: 全局化变量 `calculatedNumber`。忽略 `private` 和\
    \ `static`。重要的是我们在方法之外用 `int` 类型声明了 `calculatedNumber`。回到我们在 `subtract()` 方法中添加的打印语句。添加一个描述性的语句：\n\
    ![Code 10.5](img/Image00221.jpg)\n代码 10.5: `subtract()` 能够访问 `calculatedNumber`。编译并运行：\n\
    ![Image00222.jpg)你可以看到，`subtract()` 通过打印值访问了变量 `calculatedNumber`。如果程序过程中 `calculatedNumber`\
    \ 的值发生变化，`subtract()` 也会捕捉到这些变化。这是带有全局变量 `calculatedNumber` 的代码：![Code 10.6](img/Image00223.jpg)\n\
    代码 10.6: 注意 `calculatedNumber` 声明在 `CleanCalculator` 但在所有方法之外。\n\n## 10.3：何时使用局部\
    \ vs 变量\n\n问问自己：\n* 你的所有方法都需要该变量的信息吗？\n* 或者你只需要在一个方法中使用它？\n* 我们可以直接将值传递给方法是否可行？\n\
