    \n访问另一个类中的全局变量与我们访问方法相似。\n(此处省略重复内容，直接进入后续章节)\n\n# 第 12 章：类与对象\n\n第 12 章和第 13\
    \ 章是最重要的，因为它们是面向对象编程的基础。我们在每一段代码中使用了类，并以 `public` 开头。我们把类当作文件来使用，但它们不仅仅于此。类用于创建对象，而对象用于编写简洁且强大的代码。本章目标：创建一个真正的类。在第\
    \ 13 章，我们将学习从这个类中创建对象。\n\n## 第 12.1 节：什么是类？\n\n类是我们可以用来创建对象的模板。例如，你是一个设计师，想要制作不同的包卖给供应商。但为了制作这些包，你首先需要为它们创建一个基础设计。这个基础设计（或模板）就是一个类。\n\
    ![Diagram 12.1: A bag blueprint. In programming, this would be a class](img/Image00237.jpg)\n\
    图 12.1: 一个包的蓝图。在编程中，这就是一个类。在蓝图中，你定义了创建包所需的通用属性。属性列表是无限的，但这里是我们可以考虑的几点：\n* 包的颜色\n\
    * 包的大小（我们可以在包里放多少件物品？）\n* 包的面料（皮革、漆皮、丝绒等等）\n* 肩带的数量\n* 肩带的长度\n* 类型\n\n通过这个模板，我们应该能够创建不同类型的包。在编程中，类提供了创建对象所需的通用属性。\n\
    \n## 第 12.2 节：什么是对象？\n\n对象是我们在类中创建的特定“东西”。在包的场景中，假设我们想创建一个蓝色的背包和一个粉色的钱包。这些包是从同一个蓝图（类）创建的。从蓝图中创建的这些系列包被称为对象。\n\
    ![Diagram 12.2: These series of bags are objects from the blueprint](img/Image00238.jpg)\n\
    图 12.2: 这些系列包是从蓝图中创建的。\n\n## 第 12.3 节：为什么用类和对象？\n\n假设我们在没有任何关于类和对象的知识的情况下就想创建包。到为止我们学习的是将数据存储在变量中并将代码组织成不同的方法。以下是尝试创建蓝色背包和粉色钱包的代码：\n\
    ![Code 12.1](img/Image00239.jpg)\n代码 12.1: 杂乱的“创建”包的方式。如果我们运行这个程序，会得到以下：\n![Image00240.jpg)总的来说，我们必须使用变量来存储蓝色背包和粉色钱包的属性。也许我们可以通过方法让这更好。![Code\
    \ 12.2](img/Image00241.jpg)\n代码 12.2: 改进的“创建”包的方式。输出与 12.1 相同。\n\n但代码 12.2 中仍然有缺陷。尽管代码更短且更易读，但我们无法访问单个包的属性。例如，我们无法访问粉色钱包的颜色或蓝色背包。这就是我们使用类模板创建对象的原因。\n\
    \n## 第 12.4 节：创建类\n\n一个基础类模板由三部分组成：\n* 代表类的属性的全局变量（例如包的颜色、大小、面料等）\n* 用于创建对象的构造函数\n\
    * 用于访问或设置属性值的方法\n\n并不是创建类都需要这三个组件，但它们将用于创建 Bag 类。\n\n### 12.4.1 节：字段：类的属性\n\n\
    首先，让我们创建一个空的 Bag 类：\n![Code 12.3](img/Image00242.jpg)\n代码 12.3: Bag 类的大纲。为了给 Bag\
    \ 模板提供更多定义，我们需要定义 Bag 的属性。我们将使用之前概述过的那些。Bag 类的属性将作为全局变量添加：\n![Code 12.4](img/Image00243.jpg)\n\
    代码 12.4: 为 Bag 类声明字段。定义类属性的全局变量被称为字段。字段是特殊的，因为它们帮助描述类。没有它们，我们就不知道 Bag 类是做什么的。注意几点：\n\
    * 所有字段都被设置为 `private`。\n* 我们将创建公共方法来访问这些私有全局变量。\n* 我们只声明字段而不初始化它们。这是因为在创建真正的 Bag\
    \ 对象之前，你不知道这些属性的值。\n\n### 12.4.2 节：构造函数：创建对象的方法\n\n构造函数是用于创建对象的特殊方法。创建对象也称为实例化。我们将为\
    \ Bag 类创建构造函数。关于构造函数的一些注意事项：\n* 构造函数的名称必须与类名相同，因此与文件名相同。\n* 构造函数没有声明返回类型。\n* 构造函数通常是\
    \ `public` 的，以便其他文件可以从它创建对象。\n* 构造函数体是可以初始化类字段的地方。让我们在 Bag 类内部开始创建构造函数：\n![Code\
    \ 12.5](img/Image00244.jpg)\n代码 12.5: 创建构造函数。我们已经声明了构造函数，但体部分呢？我们还不知道字段的值，可以初始化它们吗？我们有两个选择：\n\
    * 选项 1：创建一个 `Bag()` 构造函数并将字段设为空值。程序员可以方便地以后重新赋值。\n* 选项 2：创建一个带参数的 `Bag()` 构造函数，在构造对象时传递值。我将在代码中实现两种方式：\n\
    ![Code 12.6](img/Image00245.jpg)\n代码 12.6: 带有空值的 Bag 构造函数。\n![Code 12.7](img/Image00246.jpg)\n\
    代码 12.7: 带参数的 Bag 构造函数。\n\n# 第 13 章：创建对象\n\n本章是第 12 章的延续。现在我们关注如何创建对象。\n\n## 第\
    \ 13.1 节：创建 Bag 对象\n\n现在创建实际蓝色的背包和粉色的钱包。我创建一个名为 `BagStore.java` 的独立类，并带有 `main()`\
    \ 方法。确保你的 `BagStore.java` 文件与 `Bag` 类位于相同的文件位置。\n![Code 13.1](img/Image00252.jpg)\n\
    代码 13.1: 实例化对象的类。让我们首先按照第 12 章提到的规格创建蓝色的背包：\n* 蓝色背包\n* 颜色：蓝色\n* 包的大小：可以放进 10 件物品\n\
    * 面料：聚酯\n* 肩带数量：2\n* 肩带长度：中等\n* 类型：背包\n\n我们需要首先将 `Bag` 对象存储在变量中。因此，让我们声明：\n![Code\
    \ 13.2](img/Image00253.jpg)\n代码 13.2: 声明 Bag 变量。注意我用类型 `Bag` 声明了变量 `backpack`。这就是类和对象的强大之处，它们允许我们创建自己的类型。现在，通过创建\
    \ Bag 对象来初始化变量：\n![Code 13.3](img/Image00254.jpg)\n代码 13.3: 创建我们的第一个对象蓝色背包。注意几点：\n\
    * 使用构造函数时，方法调用前必须有 `new` 关键字。这告诉 Java 你正在创建一个新对象。\n* 像调用其他方法一样调用构造函数（只需使用方法名即可）。\n\
    * 你不需要使用点符号 `.` 来指定 `Bag()` 从哪里来。Java 会自动知道，因为构造函数名字与类相同。\n![Code 13.4](img/Image00255.jpg)\n\
    代码 13.4: 创建对象的通用语法。现在让我们创建粉色钱包对象：\n![Code 13.5](img/Image00256.jpg)\n代码 13.5:\
    \ 创建粉色钱包对象。使用不需要参数的构造函数来初始化：\n![Code 13.6](img/Image00257.jpg)\n代码 13.6: 使用不需要参数的构造函数。\n\
    \n## 第 13.2 节：从对象调用方法\n\n现在我们想打印三个包的属性。记得我们把 `Bag` 类中的所有字段都为了 `private`，所以无法直接访问它们。我们将使用方法来访问并打印它们。让我们首先打印每个包的颜色；因此我们将使用\
    \ `getColor()` 方法。\n![Code 13.7](img/Image00259.jpg)\n代码 13.7: 使用对象方法的不完整方式。代码\
    \ 13.7 会打印什么？它不会打印任何内容，因为 Java 将抛出编译错误：我们需要定义想要访问的颜色。让我们先访问蓝色背包的颜色。我们需要使用点符号：\n\
    ![Code 13.8](img/Image00260.jpg)\n代码 13.8: 调用实例方法的正确方式，`getColor()`。编译并运行：\n注意：\n\
    * 我们使用了 `backpack.getColor()` 而不是 `Bag.getColor()`。逻辑上，这是因为我们想要蓝色背包的颜色，而不是 `Bag`\
    \ 模板（它根本没有初始化颜色）。在下一章节中，我们将讨论为什么从对象而不是类获取颜色。\n* 所以读取代码 `backpack.getColor()` 时，我会说：“我正在从蓝色背包对象调用\
    \ `getColor()` 方法。”\n![Diagram 13.2](img/Image00263.jpg)\n图 13.2: 每个对象中实例方法的视觉表示。注意：\n\
    ![Code 13.9](img/Image00264.jpg)\n代码 13.9: 每个 `Bag` 对象都有它自己的 `getColor()` 方法副本，返回其唯一的颜色属性。这就是为什么我们必须指定从哪个对象使用\
    \ `getColor()` 方法。现在让我们打印其他对象的颜色：\n![Image00265.jpg)代码 13.9: 每个 `Bag` 对象的颜色。编译并运行：我们成功打印了每个\
    \ `Bag` 对象的颜色属性，但没有看到 `brownMessengerBag` 的颜色。这是因为该对象的颜色被设置为了空字符串。如果我们打印 `brownMessengerBag`\
    \ 的所有属性，我们将得到：![Code 13.10](img/Image00266.jpg)\n代码 13.10: 打印 `brownMessengerBag`\
    \ 的属性。\n\n"
