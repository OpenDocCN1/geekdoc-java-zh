- fmt: "\n### 2.2.1 Compiling Java Code\nWhen we write in Java, it’s human readable\
    \ as it is written in the English language. But we need to translate the English-language\
    \ code to something that our computer understands. This is called compiling our\
    \ code.\n\nIn order to compile, you must use the following command:\n```bash\n\
    javac <Name of Java File>.java\n```\nThis command came with the JDK we downloaded\
    \ in the previous chapter. We can think of the “c” in `javac` as “c compiling.”\
    \ We must also provide the Java file we want to compile.\n\nLet's compile the\
    \ `HelloWorld.java` file:\n```bash\njavac HelloWorld.java\n```\nCode 2.4: Command\
    \ used to have the prompt compile Java code.\n\nLet’s run that on the command\
    \ window:\n![](Image00013.jpg)\nCode 2.5: HelloWorld class file compiled successfully.\n\
    \nIf the command window asks for the next prompt like Code 2.5, then that means\
    \ you compiled your program successfully. Also, notice that another file has been\
    \ created in your directory. The `javac` created a `HelloWorld.class` file:\n\
    ![](Image00014.jpg)\nDiagram 2.5: Compilation creates the .class in your folder.\n\
    \nJava will use this class file to execute your program.\n\n### 2.2.2 Running\
    \ Java Code\nNow we need to run our program. In our case, we want our program\
    \ to print “Hello World.”\n\nThe command to run our `HelloWorld` code is the following:\n\
    ```bash\njava HelloWorld\n```\nCode 2.6: Command to run Java program on command\
    \ window.\n\nNotice how we don’t include the “c” and the `.java` like we did for\
    \ the compile command. Let’s run this command on our window:\n![](Image00015.jpg)\n\
    Code 2.7: HelloWorld program ran successfully.\n\nCongratulations! You executed\
    \ your first program! Note that anytime you edit or write new code, you must compile\
    \ it before running it again.\n\n### 2.2.3 For Online IDE Users\nYou may not observe\
    \ the distinction between compiling and running your code when using online IDEs.\
    \ There's usually a \"run\" button you can click on that will immediately execute\
    \ your code. The online IDE already compiles your code behind the scenes and displays\
    \ the output on the terminal.\n\n### Section 2.3 Comments\nAs you write more hefty\
    \ programs, your code will get longer and harder to read. You can write comments\
    \ in your code to note what the code is doing.\n\nHere is an example comment written\
    \ for the `HelloWorld` class:\n![Code 2.9: Comments in Java](Image00016.jpg)\n\
    Code 2.8: Comments in Java.\n\nIn order to write a single-line comment, you precede\
    \ it with `//`. Comments are ignored by Java programs, and they solely exist to\
    \ communicate with programmers who are reading the code.\n\nThere are three types\
    \ of comments in Java:\n* `//` single line comment\n* `/* */` multi-line comments.\
    \ You can have as many lines of notes as you’d like.\n* `/**  /` Javadoc comments.\
    \ They’re similar to the multi-line comments but are for documentation purposes.\
    \ We’ll learn more about Javadocs in the later chapters.\n\nWe'll mostly use either\
    \ the single or multi-line comments.\n\n### Section 2.4 Summary\nLet’s summarize\
    \ some “rules of thumb” for reading and writing in Java.\n* Code is run line-by-line.\
    \ So the order of the code you write matters. You can’t write the print statement\
    \ before writing our class container.\n* Anytime you create a new Java file, you\
    \ must have the big container called `class`.\n    * This rule of thumb will change\
    \ as you advance in Java beyond this book.\n* Your class name must match the name\
    \ of your file.\n* In order to execute your program on the command window, you\
    \ must always have the `main()` method.\n* Anytime you see `()` in your code,\
    \ it’s usually a method.\n    * Exceptions to this rule: conditional statements,\
    \ loops, math calculations. We’ll explore these in this book.\n* Anything between\
    \ the curly braces `{ }` is called a `body`. This is where we write executable\
    \ code.\n* When you write “Java sentences,” or statements, they usually end with\
    \ a semicolon. Semicolons are the period of the Java sentences.\n* When you compile\
    \ your code, it’s `javac <Name of File>.java`.\n* When you run your code, it’s\
    \ `java <Name of File>`.\n* You have to compile your code before running it.\n\
    \nWe will be using `//` or `/* */` comments.\n\n*(Note: The remaining text in\
    \ the source appears to be a repetitive or fragmented sequence; I have processed\
    \ the core structural content provided in the main sections above.)*\n"
