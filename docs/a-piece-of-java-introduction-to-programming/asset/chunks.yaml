    exclamation points with text “@”](Image00354.jpg)Code 18.12: Replace exclamation
    points with text “@”![](Image00355.jpg)ExercisesUse the methods available in the
    String Javadoc to complete the problems.1\. Create a new class file with a main
    method. Using methods provided by the String class, try to print out the following
    output:![](Image00356.jpg)2\. Given the following code, implement the method isPalindrome():![](Image00357.jpg)Hint:
    To compare two chars, you can use ==3\. What if your String input from Problem
    2 had whitespaces? Modify your isPalindrome()  method to remove whitespaces in
    the String:![](Image00358.jpg)4.  Implement the method reverseString():![](Image00359.jpg)5.)
    Implement the method isEqual() to check if two Strings match. Do not use == operator
    to compare the two Strings directly. String inputs are case sensitive.![](Image00360.jpg)6.)
    Implement the method from Problem 5 but ignore the cases. Lowercase the String
    inputs then check for equality. Once again, do not use the == operator to compare
    two Strings directly.![](Image00361.jpg)Chapter 19: == vs. equals()We’ve learned
    how to compare the equality of two numbers using the == operator from Chapters
    4 and 7.We mostly used == to check the equality of two numbers. Note that you
    can use == to check the equality of any two primitive values .But what if we wanted
    to compare two objects instead?For objects:●        If you want to compare the
    memory location of two objects, you use ==●      If you want to compare the values
    held by the two objects, you use equals()The equals() method exists on all objects,
    but we’ll focus on how to use equals() with Strings.Section 19.1: ==Let’s look
    at the following version of StringTest class we wrote in the last chapter and
    focus on strObj and strObj2:![Code 19.1: StringTest class](Image00362.jpg)Code
    19.1: StringTest class![Diagram 19.1: Visual diagram of Code 19.0.](Image00363.jpg)Diagram
    19.1: Visual diagram of Code 19.1.We learned in the last chapter that Java explicitly
    creates different objects for strObj and strObj2 due to the new String("Hello
    World") rather than using a String literal.What if we added the following line
    of code to StringTest?![](Image00364.jpg)What do you think this will return? True
    or false?This will return false. Why? Because the == is simply comparing the memory
    address of strObj and strObj2.Visually, you would see a memory address associated
    with each String object:![Diagram 19.2: Memory address of each String object.](Image00365.jpg)Diagram
    19.2: Memory address of each String object.The == will compare memory addresses
    abcdef123 and xyzif0103.Let’s also observe in the code:![Code 19.2: Print strObj
    == strObj2](Image00366.jpg)Code 19.2: Print strObj == strObj2Compile and Run:![](Image00367.jpg)As
    expected, the Java program will print false.But what if we did str1 == str2 ?
    Or str2 == str3 ? What will that return?Both boolean conditions will return true.
    This is because they are String literals, and according to Diagram 19.2, we see
    that str1, str2, and str3 all point to the same object. All we’re doing is comparing
    the same memory address.Let’s observe this by printing it out in our program:![Code
    19.3: Comparing the equality of String literals](Image00368.jpg)Code 19.3: Comparing
    the equality of String literalsCompile and Run:![](Image00369.jpg)As expected,
    both boolean conditions evaluate to true.Section 19.2: equals()So strObj == strObj2
    returned false. What if we wanted to compare the value of strObj to strObj2, such
    as “Hello World?” We can use the equals() method.Take a look at String’s Javadoc
    to see what the equals() method does and how we can use it.The Javadoc says we
    need to pass in a data type Object to the equals() method.All objects created
    in Java are considered to be the Object data type . You don’t have to fully understand
    this. Just know that since we can pass in any object, then we can pass in a String
    for comparison.Let’s call the equals method and print:![Code 19.4: Checking the
    equality of two String values in strObj and strObj2 strObj.equals(strObj2) ](Image00370.jpg)Code
    19.4: Checking the equality of two String values in strObj and strObj2strObj.equals(strObj2)
    means, “Does strObj’s text value equal strObj2’s value?” You can also write it
    as strObj2.equals(strObj) which means “Does strObj2’s String value equal strObj’s
    String value?”Compile and Run:![](Image00371.jpg)As expected, the condition returns
    true.Conventionally, even if you are comparing String literals, you should still
    use the equals() method to ensure you''re comparing the text values and not the
    memory locations of the objects.There are other equals() methods specific to the
    String class, such as equalsIgnoreCase(). You can use this method if you want
    to compare two texts with no concern for lowercase or uppercase letters.Exercises1\.
    You have the following variable defined:![](Image00372.jpg)Based on attack, we
    want to figure out what type the attack is weak against and strong against. Create
    a series of if/else-if/else statements to print the following message on the command
    window:![](Image00373.jpg)Change the value of the variable attack to “Fire” and
    "Grass" to see what it will print out next. Here is the following relationship
    between the three attack types:●           Water: weak against grass, strong against
    fire●           Fire: weak against water, strong against grass●           Grass:
    weak against fire, strong against waterTo compare two Strings, should we use ==
    or equals()?2\. Put the following code inside your Bag class:![](Image00374.jpg)This
    code gives definition to the equals() method for the Bag class. It will specifically
    compare two Bag objects based on the Bag fields (color, size, fabric, number of
    straps, strap length, type). No need to understand how we came up with the definition
    of the equals() method or what hashCode() is. Just be aware they exist, and we
    can use it.Next, we have the following program:![](Image00375.jpg)What will the
    following code return and why?bag1 == bag2And what will this return and why?bag1.equals(bag2)bag2.equals(bag1)What
    if we had the following program instead?![](Image00376.jpg)What will bag1 == bag2
    return? Why?What about this code?bag1.equals(bag2)bag2.equals(bag1)AfterwordCongratulations!
    You have learned the basics of Java.Did you understand everything you covered
    in this book? If you didn’t, that’s completely normal. The concepts we’ve gone
    over may be called “basics,” but basics are always difficult to learn.The best
    way to move forward with programming is to practice. Practice the concepts you’ve
    learned in this book by creating your own programs. Think about the kinds of problems
    you want to solve. One of the things this book can''t give you is time and patience;
    that is something you must nurture yourself.Once you practice and have the muscle
    memory of writing classes, for-loops, methods, and so forth, things will start
    to click a little more.Nonetheless, you are already a programmer for even opening
    this book. If you have typed any Java code during this journey, you are a programmer!The
    tech field requires continuous learning regardless  of your programming level.
    So continue to persevere, and continue to code!About The AuthorFaith KimHi! Thanks
    again for reading my book.'
