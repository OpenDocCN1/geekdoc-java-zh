    # Chapter 10: Local vs. Variables


    Now that we’ve learned about variables and creating different methods, we can
    talk about the difference between local and global variables.


    ## Section 10.1: Local Variable


    So far we’ve only used local variables in our programs. Let''s say you are writing
    an essay on your computer, but you need to access it on your phone as well. The
    essay is currently saved to your computer''s hard drive, so your phone cannot
    access it. The essay in this case is local to the computer. In terms of programming,
    the local variable is "local" to a specific method, and other methods cannot access
    the data of this variable. Let’s look at the following version of the `CleanCalculator`
    code:

    ![Code 10.1: Chapter 10''s version of CleanCalculator''s main()](Image00216.jpg)

