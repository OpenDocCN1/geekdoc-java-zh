    Code 4.2: main() container inside Calculator class


    Now we''ll get started on writing meaningful code.


    ### 4.1.1: Addition

    We first want to add two numbers together and print it. I will arbitrarily choose
    2 and 4 to add. In order to add two numbers together, we use the `+` sign.

    ![Code 4.3: Print 2 + 4](Image00038.jpg)

    Code 4.3: Print 2 + 4


