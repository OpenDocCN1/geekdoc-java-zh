    \ 的方法呢？访问修饰符可以做到。## 第 11.1 节：什么是访问修饰符？访问修饰符决定了你是否可以使用从另一个类文件中获取数据。我们将涵盖两种修饰符：`public`\
    \ 和 `private`。我们可以为以下设置访问权限：* 类，但我们将类始终设为 `public`。* 方法* 全局变量`public`：其他文件可以自由访问类/方法/全局变量。`private`：访问受限。其他文件无法访问类/方法/全局变量。##\
