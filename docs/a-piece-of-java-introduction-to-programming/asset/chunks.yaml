    have empty values. The programmer can reassign values at their convenience.● 
    Option 2: Create a Bag() constructor with arguments you can pass in to initialize
    the fields. The programmer can specify values of the attributes  while constructing
    the object with this approach.I will implement both ways in the code.Option 1:
    We can initialize all of the global variables to be an “empty” value. I will make
