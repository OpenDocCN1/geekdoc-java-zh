    the designer’s name before even creating the bags. The objects also don''t need
    a copy of `designer` since all bags are created by the same person.

    ![Diagram 14.3: Bag class owns designer variable](Image00282.jpg)

    Diagram 14.3: `Bag` class owns `designer` variable Notice in Diagram 14.3 that
