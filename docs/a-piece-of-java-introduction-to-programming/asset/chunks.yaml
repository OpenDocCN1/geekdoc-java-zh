    我叫 Faith，在写这本书时，我已经在科技行业工作了大约 1.5 年。我拥有计算机科学学士学位，并从大二开始学习使用 `Java`。我曾担任过系计算机科学专业的助教，并为即将过渡到数据结构课程的学生开设过
    `Java` 速成班，这要求我在 `Java` 方面达到熟练的程度。


    作为一名同样在编程中挣扎过（尤其是作为一个学习较慢的人）的程序员，我希望能写下这本书。我认为自己是一个右脑型的人，因此必须训练自己进行计算性思维。我希望这本书能够消除大家对编程的某些畏难感，并让你能够按照自己的节奏进行学习。


    想了解更多关于我的信息，请访问我的网站：thefaithkim.com


    在空闲时间里，我喜欢看动漫和看书。一天中我喜欢的时刻是清晨喝的第一杯咖啡。占星术是我观察世界的方式，我有时也会进行塔罗占卜。

    '
