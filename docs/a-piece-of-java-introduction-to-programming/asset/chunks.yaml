    ### 4.1.6: Integer Division vs. Decimal Division

    We observed the division returned a nice whole number with 100 / 10. What if we
    had 105 / 10 instead?

    Let’s print that out:![](Image00050.jpg)

    Code 4.9: Integer division

    ![](Image00051.jpg)

    It still returns a whole number. If you put 105 / 10 into a real calculator, you’d
    get 10.5. Then why did Java return 10?

    This is because Java sees that 105 and 10 are whole numbers, or integers. When
    Java sees that we’re dividing two integers together, then it will round to the
    nearest whole number, rounding down. This holds true for negative integers as
