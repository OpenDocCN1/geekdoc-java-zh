    Code 16.2: We will test the `ArrayList` import in this code We''ll create an `ArrayList`
    object and add some texts in the list. We’ll print this list at the end of the
    program. We have not imported the `ArrayList` class.

    ![Code 14.3: Using ArrayList object in the code without importing](Image00305.jpg)

    Code 16.3: Using `ArrayList` object in the code without importing Let’s try to
    compile this:

    ![Image)

    We already have compilation errors because Java doesn’t understand what an `ArrayList`
    is. We need to import the `ArrayList` into our code so Java can run. We can go
    to the `ArrayList` Javadoc to figure out the package name: [https://docs.oracle.com/javase/8/docs/api/util/ArrayList.html](https://docs.oracle.com/javase/8/docs/api/util/ArrayList.html)
    It seems like we can access the `ArrayList` from the `java.util` package using
