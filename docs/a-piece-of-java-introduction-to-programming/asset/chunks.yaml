    # Chapter 4: Calculating and Comparing Numbers

    In this chapter, we’ll learn how to do math calculations and compare numbers in
    Java.


    ## Section 4.1: Arithmetic Operators

    The goal of this chapter is to explore basic math operations by creating a Java
    program. To start, let’s say we want to first add two numbers together, subtract
    by 1, multiply by 20, divide by 10, then get the remainder when divided by 5.
    It should print each step of the calculation.


    Let’s create a new class file called `Calculator.java`. We need to create our
    big “class” container:

