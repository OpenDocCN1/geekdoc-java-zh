    We needed to remember the calculated number at each step to do the next operation.
    It gets taxing having to do that mental math all the time. Instead of hardcoding
    the numbers into our program, or writing the actual data in our code, we can generalize
    it by using variables.


    In this chapter, we’ll be rewriting our `Calculator` code by using variables instead.
    Let’s get started by creating a new class file and a `main()` container. I’ll
    call mine `VariableCalculator.java`:

