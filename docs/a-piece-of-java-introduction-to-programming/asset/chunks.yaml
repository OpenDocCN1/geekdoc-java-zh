    ## Section 5.1 What is a Variable?

    You can think of a variable as a box that stores information. That information
    can be a number, text, list of values, anything. And we put a label on that box
    so we know what data holds. Let’s take the `2+4` calculation and put it inside
    a variable:

    ![Code 5.4: Variables in Java](Image0078.jpg)

    Code 5.4: Variables in Java

    In the next sections, you’ll observe the two parts in creating a variable:


    ### 5.1.1: Declaring a Variable

    Let’s start with the left side of `=`:

    ![Code 5.5: Declaring your variable](Image0079.jpg)

    Code 5.5: Declaring your variable

    The left side is where we name the variable and specify the data type this variable
    can hold. In this case, `int` means `calculatedNumber` only hold integer numbers.
    It cannot hold decimal numbers or texts. This process is called declaring your
    variable. Let’s put the declaration in our `VariableCalculator` code:

    ![Code 5.6: Declaring variable `calculatedNumber` inside `VariableCalculator`’s
    `main()` container](Image0080.jpg)

    Code 5.6: Declaring `calculatedNumber` inside `VariableCalculator`’s `main()`
    container

    Won’t compile and run yet. Let’s look at the current visually:

    ![Diagram 5.2: Visual representation of Code 5.6, declaring your variable](Image0081.jpg)

    Diagram 5.2: Visual representation of Code 5.6, declaring your variable

    When we declare a variable, it essentially creates a box that is waiting to store
    information. Declaring also labels our box.


    ### 5.1.2: Initializing a Variable

    Now let’s look at the right side of `=`:

    ![Code 5.7: Initializing your variable](Image0082.jpg)

    Code 5.7: Initializing your variable

    This means we will be storing the `2 + 4` into the variable `calculatedNumber`.
