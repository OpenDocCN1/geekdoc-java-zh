  trans: "\n\n### 2.2.1 编译 Java 代码\n当我们用 Java 编写代码时，由于是用英文编写的，它是人类可读的。但我们需要将这些英文代码转换为计算机能够理解的内容。这被称为编译我们的代码。\n\
    \n为了进行编译，你必须使用以下命令：\n```bash\njavac <Name of Java File>.java\n```\n该命令随我们在上一章节下载的\
    \ JDK 一起提供。可以将 `javac` 中的 “c” 理解为 “c compiling”（编译编译）。我们还必须提供想要编译的 Java 文件。\n\n\
    让我们来编译 `HelloWorld.java` 文件：\n```bash\njavac HelloWorld.java\n```\n代码 2.4：用于通过提示符编译\
    \ Java 代码的命令。\n\n让我们在命令行窗口运行它：\n![](img/Image00013.jpg)\n代码 2.5：HelloWorld 类文件编译成功。\n\
    \n如果命令行窗口显示了与代码 2.5 相同的下一个提示符，那么意味着你已成功编译了程序。此外，注意你的目录中创建了另一个文件。`javac` 创建了一个\
    \ `HelloWorld.class` 文件：\n![](img/Image00014.jpg)\n图 2.5：编译在你的文件夹中生成 .class 文件。\n\
    \nJava 将使用此类文件来执行你的程序。\n\n### 2.2.2 运行 Java 代码\n现在我们需要运行程序。在我们的情况下，我们希望程序打印“Hello\
    \ World”。\n\n运行我们的 `HelloWorld` 代码的命令如下：\n```bash\njava HelloWorld\n```\n代码 2.6：在命令行窗口上运行\
