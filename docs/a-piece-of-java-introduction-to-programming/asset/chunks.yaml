    ### 12.4.2 Constructor: Method to Create Objects


    A constructor is a special method that’s used to create objects. Creating objects
    is also known as instantiating objects. We''ll create constructors for the Bag
    class. Some things to note about a constructor:

    * The name of the constructor must be the same as the name of the class, and thus
    the same as the file.

    * is no return type declared for a constructor.

    * A constructor usually will be `public` so that other files can create an object
    from this.

    * The body of the constructor is where we can initialize the fields of the class.
    Let’s start creating the constructor inside the Bag class:

