    We get a compilation error, which states that our Java program couldn’t find the
    “symbol” `calculatedNumber`. This is because `calculatedNumber` is a local variable
    that’s not accessible to the `subtract()` method. But didn’t we pass in `calculatedNumber`
    into `subtract()` with this line of code?

