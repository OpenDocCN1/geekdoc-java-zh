    Mark pulled into a parking space that faced the silhouettes of the university’s
    adobe buildings spreading out below the starlight. He still felt the warmth of
    Sienna’s skin against his lips. She must think he was a lunatic. He should''ve
    just said yes to dinner with her and canceled his blind date, except it was a
    set up with a client''s daughter.


    He checked the texts on his phone to find the name of his date again. It looked
    familiar, but he couldn''t figure out why. It didn''t matter. He''d be polite
    but distant. A twinge of guilt pinched him as he stepped out of his car. He should
    go in with more of an open mind. For all he knew, Sienna never wanted to speak
    to him again. It''d probably be better to pursue someone who wasn''t his son''s
    teacher anyway.


    But he''d wanted Sienna since the first day of school.


    He walked up Central Avenue and enjoyed the eclectic neon signs that glowed in
    the night—a Zia symbol here, a coyote there, a sign that invited him to get his
    body pierced like a cactus. Though he was from Chicago, Albuquerque had enchanted
