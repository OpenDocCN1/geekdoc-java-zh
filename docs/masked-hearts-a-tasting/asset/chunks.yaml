    He looked suddenly grieved as he sighed and sat on the couch next to her. With
    his broad-shouldered build, he loomed over her even after sinking into the cushions.
    “My mom is really sick, so I took a job teaching here to be near her.”


    His proximity worsened the knot, and she slid a few inches away from him, towards
    the fire place. “Carol''s sick? I''m so sorry. What''s wrong?”


    “Breast cancer. She''s recovering from a double mastectomy. It''s going to be
    hard working full time. In a week or so, she''ll be starting chemo.”


    Even though she felt almost as bad as if it were her own mother, she wanted to
    snatch back her next words as soon as she said them, “Let me know if there''s
    anything I can do to help.”


    He took her hands in his, and her whole body cringed. He''d left her. He shouldn''t
    be sitting so close to her or, much worse, holding her hands. He said, “I knew
    I could count on you. Mom thought you wouldn''t talk to me after what happened,
    but you and her were so close, I thought you could set aside the incident.”


    Sienna ripped her hands away and stared with wide eyes at his choice of words.
    The ''incident'' he referred to was when he stood up to toast her at the rehearsal
    dinner and ended by saying, “I can''t do this. You''re wonderful, but I''ve had
    an offer to go teach in Argentina. I think I have to accept it.” The knot inside
    her stomach tightened so much that it snapped. “Don''t touch me. I''ll come by
    to see your mom. Not you.”


    Undaunted, he put his hand on her knee and said, “I never should''ve just left.
    I should''ve taken you with me. You would''ve loved those kids.”


    She pulled her knee away and smashed herself against the arm of the couch. Though
    the fire place was set on low, it felt like it blazed. She should stand up, but
    she feared her legs would shake if she tried. “We were teaching plenty of needy
    children as you recall. You didn''t just leave me, but a whole class of first
    graders who kept asking me why you didn''t like them anymore.”


    “I know, I''m really sorry. Why don''t I buy you lunch to make up for it and tell
    you about Argentina?”


    “Lunch is not going to make up for it...”


    While she ranted, he pulled out his phone and brought up a picture of his ragtag
    class looking both charming and neglected and passed it to her. “I know you''ll
    love hearing about all the kids. They''re amazing.”


    Her stomach growled and her heart wavered as she stared at the picture, but just
    as she was about to agree to lunch, Mark, dressed in khakis and a button up dark
    blue shirt, sat down on the couch across from them and said, “Hello, Ms. Carly.”


    ![](image4.jpg)


    Timing was everything that morning. If Mark arrived too early, he''d seem like
    a loser waiting for Sienna to show up. If he arrived too late, she might be gone
    already. Of course, she might not show up at the coffee shop at all.


    He decided to go around lunchtime and hope for the best. He had her phone number
    on a sheet she''d sent home at the beginning of the year, but for all he knew,
    that was a number she gave out only to parents and turned off on the weekends.
    Anyway this conversation would be better in person than over the phone.


    He arrived at the coffee house and spied her right away with another man. Fuck.
    Did she have a boyfriend? Sienna squirmed away from the guy. Okay, maybe not.
    Her hair was up in a ponytail again, and she wore jeans and a t-shirt that was
    tight enough to show the outline of her bra. He wanted more time to admire her,
    but the guy kept edging closer to her. Chloe waved, and Mark stepped up to the
    counter and asked, “Who''s with Sienna?”


    “I''ll tell you if you buy a ticket for our Halloween poetry night. Money goes
    to charity,” she said in a singsong voice, holding a flyer in front of him.


    “Extortion? Really?” But he smiled and paid her, adding a Toil and Trouble with
    extra cinnamon to the order.


    “Thank you, and you have to come.”


    “The man.”


    “They were engaged last year.”


    Damn. “What happened?”


    “You should ask her.”


    He frowned at Chloe but knew she wasn''t going to say any more. As he walked over
    to the couches, instincts made him want to knock the guy out, even though the
    guy was huge. He’d convinced himself that last night had just been a hiccup to
    the start of a fantastic relationship with Sienna, but the reunion of her and
    her ex could be a problem. Still, she''d pushed herself back against the armrest
    and seemed upset, though something on the phone was making her soften. He had
    to intervene. He sat down on the couch across from them. “Hello, Ms. Carly.”


    She looked up at him, harried, then relieved and then agitated all over again.
    She sat up straight and gave the phone back to the guy. Before she said anything,
    the guy gave a tight smile and said, “We were just going to have lunch. Please
    excuse us, Mr...”


    “Mark,” said Sienna.


    Mark couldn''t help but raise his eyebrows in surprise over her use of his first
    name. The guy she was with seemed taken aback as well.


    Sienna continued, “This is Glen. He was just leaving. Glen, this is my lunch date,
    Mark.”


    “Lunch date? But he called you Ms. Carly.”


