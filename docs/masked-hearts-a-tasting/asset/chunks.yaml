    ### ![](image2.jpg)


    Sienna felt like a wine rack must''ve fallen on her when she walked into The Cellar
    and saw Mark holding hands across the table with Mia Warren. Her cheek burned
    where he''d kissed her, and rage almost made her shake. If the bastard was trying
    to decide which of his kids'' teachers to date, he could''ve at least mentioned
    he was coming tonight.


    He pulled his hands away from Mia and turned to look at her as the other third
    grade teachers whispered and stared. They treated their grade level like it was
    a sorority and rarely deigned to collaborate with other teachers. Sienna''s vision
    blurred until a voice broke through, calling her name.


    “Sienna,” yelled Krista from a table a few feet away from Mark''s. It snapped
    her out of her stare, and she stalked by him, knowing she''d look ridiculous if
    she turned and fled.


    Krista sat on a long bench against the wall. She was fortyish, with sandy hair
    that fell to her shoulders. Her dress was maybe five years out of fashion, but
    Sienna knew Krista didn''t care about that. Anyway, it looked good on her. Krista
    scooted over and said, “Wow, you clean up nice.”


    “Thanks,” said Sienna in a voice like one of her shy students. “You look nice
    too.” She sat in the space that Krista had left for her.


    “For an old married lady, I know,” said Krista.


    “Here''s to old married ladies,” toasted one of the other kindergarten teachers.
    It seemed as if everyone down the long table heard her because all the teachers
    raised their glasses, said, “Woo!” took a drink and laughed.


    “What''s the joke?” asked Sienna.


    “You missed a big ''woo'' over at the third grade table before you got here. I
    took it from the shocked look on your face that you saw who came with Ms. Mia.”


    Sienna kept her eyes straight ahead, refusing to glance over at Mark. “I shouldn''t
    be so surprised. She''s gorgeous.”


    “He looks miserable, and he keeps staring at you.”


    Sienna finally turned to see one of the third grade teachers draped over him getting
    a selfie. “Yeah, poor guy, getting all that attention.”


    A waitress stepped up and asked for Sienna''s order.


    “Just water please.”


    “Water?” asked Krista. “You need something stronger than that!”


    “Maybe later.” But she didn''t want to stay another minute. The waitress walked
    away, and Sienna tried to figure out what the hell was going on. The kiss at the
    cafe had been so weird but led her to believe he was interested in her. Mia''s
    high-pitched laugh pierced her ears, making her head hurt. At least this time
    the relationship had ended before it had begun. She gritted her teeth. How long
    before she could leave with some semblance of dignity?'
