    “I''ll tell you if you buy a ticket for our Halloween poetry night. Money goes
    to charity,” she said in a singsong voice, holding a flyer in front of him.


    “Extortion? Really?” But he smiled and paid her, adding a Toil and Trouble with
    extra cinnamon to the order.


    “Thank you, and you have to come.”


    “The man.”


    “They were engaged last year.”


    Damn. “What happened?”


    “You should ask her.”


    He frowned at Chloe but knew she wasn''t going to say any more. As he walked over
    to the couches, instincts made him want to knock the guy out, even though the
    guy was huge. He’d convinced himself that last night had just been a hiccup to
    the start of a fantastic relationship with Sienna, but the reunion of her and
