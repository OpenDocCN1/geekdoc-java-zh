    她的手机响起了短信提示音。她关掉水流，跪着挪向另一盆兰花。当手机再次响起，提醒她她有一条未读消息时，她放下浇水壶，从膝盖站起身。她走向手机并点亮屏幕：正如承诺的那样，马克（Mark）的地址。是时候做决定了。


    她放下手机走向浴室，对着镜子看着自己枯燥无味的衣服和平平无奇的外表。即使她去参加电影约会，也得让自己打扮得精致。真很难相信他会放弃米娅而选择她；米娅看起来更符合他的口味，长得漂亮，而且从她的奥迪汽车和设计师服装来看，她很有钱。


    但手机里存着马克地址的人是她。她的脑海中浮现出在电影放映时在沙发上依偎在他身上的画面。也许他会准备一些红酒，而且他提到过玫瑰……


    洗衣机嗡嗡响起来，洗涤结束，粉碎了她美好的约会幻想。


    她转过镜子走向衣帽间。那里也没有什么选择，除非——她拉开角落的几件外套，看到了自己大学毕业后买的那件黑色皮夹克。也许配双高跟鞋……


    ### ![](img/image6.jpg)


    马克选了一部浪漫喜剧和一部动作片。他完全不确定她是否会出现，但午餐时的谈话非常愉快，直到她的手机响了：可能是那个混蛋。他看着自己选的浪漫喜剧片皱了皱眉：《公主新娘》。该死，那部电影流行时他还只是个孩子。她那时出生了吗？他不想想这些。他拿起遥控去找别的，但门铃响了。他的心跳加速了。她真的来了。他把《公主新娘》放在《复仇者联盟》电影下面，希望她喜欢漫画超级英雄。


    他最后环视了一下书房。他试过把孩子的玩具都收起来，但米色的墙壁底部到处是蜡笔涂鸦，那是孩子蹒跚走路时画的。他从未想过把它们刷掉。至少后墙是一扇窗户，可以看到窗外的沙漠和铺开的阿尔伯克基市，灯火到处闪烁。


    他穿过厨房，那里有一尘不染的不锈钢电器，中岛上放着几本食谱，以此向她证明自己会做饭。他还在厨房桌上放了一碗水果，向她展示自己知道如何照顾孩子。为了给一个幼儿园老师留下好印象，他必须处理好所有细节。


    门铃再次响起。至少他知道自己不是幻听了第一声。他跑过门口回到客厅，客厅由于有皮沙发和玻璃茶几，显然对儿童不友好，但他们不会在那里停留。走两步路就是宽敞的前走廊，一面墙上放着沙发，另一面墙有一面镜子，让走廊看起来更宽大。


    镜子旁的小桌上放着花瓶，里面插着一十二朵红玫瑰和十二朵白玫瑰。花上插着一张卡片；信封上歪写着西娜（Sienna）的名字。他花了一整个晚上的时间思考在卡片上写什么。现在他犹豫了。不，没事的。但他打算把卡留在桌子上，而不是拿着它去开门——它实在太大了。


    他伸手握住门把，开了门。


    他惊讶得掉掉了下巴。


    西娜把棕色的头发扎成一个凌乱的马尾，几缕碎发落在脸的一侧。她的红口红为唇部增添了一种丰润感，他以前从未观察过，但在今天早些时候的吻中确实感受过。她穿着一件在腰间束紧的黑色皮夹克。他想象她皮夹克里面什么都没穿，因为她的双腿是裸露的，光滑修长，一直延伸到黑色的尖钉高跟鞋。


