    他整了整领带，为即将到来的夜晚做好了心理准备。约会应该是很有趣的。至少这是一种练习，这样当他再次见到 Sienna 时，在强制自己不约会了两年之后，他可能不会表现得那么像个傻瓜。他走过写着“地窖”的银色霓虹灯，下楼进入了一家到处弥漫着爵士乐的酒吧。


    由于时间还早，观众只有空舞台旁的一对夫妇、吧台边的一个男人，以及——他的目光扫向另一侧——坐在角落里对他微笑的沃伦小姐士。他的眼睛瞪大了。他再次检查了手机上的名字，看到是
    `Mia Warren`。难怪听起来很耳熟。她是他女儿的三年级老师。


    现在他觉得自己像个傻瓜。与 Sienna 不同，他从未费心去记她的名字，总是称呼她为 `Ms. Warren`。


    他再次盯着她。她的笑容消失了，但看起来依然很抱希望。这将是一场灾难。他对她完全没有兴趣。


    他抚平领带，露出了职业性的微笑。她绽放了，他不得不承认她很美。她的金发垂过肩膀，刚好停在胸部上方，胸部被蓝色鸡尾酒裙的深 V 领口衬托起，展现出迷人的曲线。但她的魅力让他太想起了他的前妻。Sienna
    那种内敛的美和机敏的反应让他感到兴奋得多。


    “沃伦小姐，非常抱歉，我没意识到你今晚是我的约会对象。我本该在学校就说出来的。”他坐下，她一直笑着。


    “没关系。我也不确定我爸给我安排的对象到底是不是你。我不知道你是阿根廷学校的建筑师。”


    她眼神中的某种东西让他有些反感，但他并找不出是什么。“是的，那是我在业务淡季时做的事。幸运的是，它给我带来了几个有偿的工作。”


    “你过得似乎不错。”


    他看着她的目光在他身上扫过，在座位上不安地挪了挪。“额，我们就喝口酒大笑一下这件事吧，然后散场。既然你教我女儿，我们可能不应该约会。”


    “放轻松吧！那是工作，这是玩乐。”


    他的手指滑过衬衫领，听着他原本计划如果 Sienna 拒绝约会家长时会对她说的话。这时，一群老师的出现让他免于了作答。


    “Mia！”一个年轻女性大叫道，她穿得更像个轻浮的辣妹，而不是他认识的那个三年级老师。他往她身后看，看到 `Desert Eagle Elementary`
    的半数教职员工正陆续走进来。


    想起 Sienna 提到过要参加员工的欢乐聚会（Happy Hour），他转过头瞪着 `Mia`。她早就知道自己被安排的对象是谁了，并带他来这里为了在同事面前炫耀。然而，他轻蔑的目光并没有被她注意到到，她向大家介绍他是她班上的一个家长。“我们是相亲约会的。你能相信吗？这是缘分。”


    那个俏泼的女孩用双手托住他的脸说：“你简直太美了，我现在就想把你吃掉。”


    “我先来，”`Mia` 说，两人都大笑起来。老师松开他的脸，和另一个女人一起坐在他们的桌旁。那三个老师聊天的样子就像在参加某种集体约会。


    几个和他年龄相仿的女性和几个他在学校认识的男人坐在附近的长桌旁，一边聊天一边盯着他们小组。他必须在 Sienna 出现之前离开这里。她可能会误解整个情况。尽管服务员很快来点餐并迅速送回饮料，但在
    `Mark` 看来仿佛过了一个世纪。他一直瞥向门口，希望 Sienna 不要出现。现在他的威士忌到位了，他喝完就走。


    `Mia` 握住他的手，将他的注意力从门口引向她身上。“所以，你上一次和这么多美女坐在一起是什么时候？`Shelly` 说你从从不出门。”


    “Shelly？”他张掉了嘴巴。


    “是，我们经常聊天。她很有趣，对班级万圣节派对非常有想法。”


    他完全可以想象 `Ms. Warren` 和他的前妻合得很好。`Ms. Warren` 看起来不像那种会在周六记录学生进度的人，而 `Shelly` 是个彻头的派对女孩。他想缩回手，但她抓得很紧。他说：“最好小心，别让
    Shelly 有太多建议。她可能会预订一个木偶戏、一个故事讲述者和一只马。”


    “没错！那会太棒了！”


    仿佛排好队，桌旁的三个老师大喊：“噢！”


    他必须离开这个糟糕的春假梦。旁边的女人低声说：“看起来有人在嫉妒你，Mia。”


    `Mark` 甩开手，转过头看到 `Sienna`，她双拳紧握在身体两侧，惊讶地睁大双眼睛。


    Sienna 眼睛中的火光点燃了他的激情。她的深色长发落在肩，末梢带着波浪，而不是她平时在学校时扎起来的马尾。她的皮肤透着自然小麦色，显得光滑无暇。那件吊带裙完美地贴合着她纤细的身材，让他想在所有人面前像电影里的情侣一样吻她。


    老天，他真是个傻瓜。他确信她再也不会理他了。


