    needy children in Argentina. All her former boyfriends had big hearts—just not
    big enough for her. Mark was bound to up and run away to freaking Habitat for
    Humanity in Asia. She needed to mask her heart from romance and enjoy a purely
    physical relationship.


    But a student''s parent was not an appropriate fuck buddy.


    She grabbed the folders, deciding she needed the caffeine and atmosphere of the
    cafe. If Mark showed up, he could say whatever he wanted to say, and they could
    go back to being parent and teacher. She''d find somebody else to screw for fun
    or just keep consoling herself with a vibrator.


