    “I''m sorry. I already have plans tonight.”


    She should''ve seen it coming. When she thought about it, it was a surprise his
    Saturday wasn’t completely booked with dates with beautiful women. Probably why
    he’d suggested early Saturday morning. “That''s okay,” she gushed out to avoid
    the awkwardness. “The teachers get together for Happy Hour on Fridays anyway,
    and I already told one of the Kindergarten teachers that I''d meet her there.”
    She actually hated the Happy Hour Fridays, but it was go or be talked about, so
    she always went. She grabbed her drink and stood up, needing to get out of there
    as soon as possible.


