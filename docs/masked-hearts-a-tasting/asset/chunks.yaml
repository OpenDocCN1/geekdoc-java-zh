    had been spun everywhere. Chloe bounced up to the cash register with a pointy
    witch''s hat on and said, “So, when are you seeing Mark?”


    “Monday when he picks his son up from school.”


    “Oh, come on. You guys seemed perfect together yesterday.”


    She wanted to spill the whole incident at Happy Hour because she didn''t have
    anyone else to talk to about it, but it didn''t seem right. “It''s just tricky
    because he''s a parent,” she finally said.


    Chloe slid a flyer to her about their Halloween poetry slam and concert. “Here,
    buy a ticket to this. I bet he does too, and then you can meet again in disguise.
    We won''t let anyone in who''s not in costume. Then you can see how it is with
    less pressure.”


    “How do you know he''ll come?”


    “I know all my customers,” she said with a wink.


