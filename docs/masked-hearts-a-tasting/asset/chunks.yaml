    Her phone chimed a text notification. She cut off the stream of water and scooted
    on her knees to the next orchid. When it chimed again to remind her that she had
    a message waiting, she set down the watering can and pulled herself up off her
    knees. She walked to her phone and clicked it on: Mark''s address as promised.
    Time to decide.


    She dropped the phone and walked to the bathroom, looking in the mirror at her
    boring clothes and plain Jane appearance. Even if she went for the movie date,
    she''d have to spice herself up. It was hard to believe he''d chosen her over
    Mia; Mia seemed much more his type with her beauty and, judging by her Audi and
    designer clothes, money.


    But she was the one with Mark''s address on her phone. Visions of snuggling close
    to him on the couch while a movie played filled her mind. Maybe he''d have some
    wine out, and he''d said something about roses...


    The washing machine buzzed the end of the load, smashing her picturesque date.


    She turned from the mirror and headed to the coat closet. Not much of a selection
    there either except—she pulled some coats away from the corner and saw the black
    leather jacket that she''d bought fresh out of college. Maybe with some heels...


    ### ![](image6.jpg)


    Mark had one romantic comedy picked out and one action movie picked out. He wasn’t
    at all sure she’d show up, but the lunch conversation had been fantastic until
    her phone rang: probably the douche bag. He frowned at his romantic comedy selection:
    The Princess Bride. Shit, he''d been a kid when that was popular. Had she even
    been born? He didn''t want to think about it. He picked it up to go find something
    else, but the doorbell rang. His heart pounded. She''d actually come. He put The
    Princess Bride under the Avengers movie and hoped she was into comic book super
    heroes.


    He took a final glance around the den. He''d tried to put away all of his kids''
    toys, but crayon scribbles covered the bottoms of the beige walls where his kids
    had drawn as toddlers. He''d never wanted to paint over them. At least the back
    wall was a window looking out onto the desert and down over the splayed city of
    Albuquerque, lights twinkling everywhere.


    He walked through the kitchen with its spotless stainless steel appliances and
    an island where he’d set out a few recipe books to show her he cooked. He''d also
    left a bowl of fruit on the kitchen table to show her he knew how to feed his
    children. He’d have to get all the details right to impress a kindergarten teacher.


    The doorbell rang again. At least he knew he hadn''t imagined the first ring.
    He jogged through the doorway to the living room, which was definitely not kid
    friendly with its leather couches and glass coffee table, but they wouldn''t be
    spending any time there. Two steps led down to the large front hallway with a
    couch on one wall and a mirror to make the hallway look even larger on the other
    wall.


    On a small table by the mirror was a vase filled with a dozen red roses and a
    dozen white interspersed together. There was a card sticking out of the top; Sienna''s
    name was scrawled on the envelope. He''d spent most of the evening figuring out
    what to write in the card. Now he had second thoughts. No it was fine. But he''d
    leave it on the table rather than answering the door with it—it was just too big.


    He reached for the knob and opened the door.


    His jaw dropped.


    Sienna had her brown hair pulled up in a messy ponytail, stray strands falling
    over one side of her face. Her red lipstick brought a lushness to her lips that
    he''d never observed before but had definitely felt in her kiss earlier that day.
    She wore a black leather jacket tied at the waist. He imagined she wore nothing
    under the jacket because her legs were bare and shaved smooth all the way down
    to the black, spiked high heels.


