    After her water arrived she noticed Mark extracting himself from the third grade
    teachers. He ran a hand through his hair and approached her. Suddenly, the water
    became the most interesting thing she''d ever seen. She heard him say, “Ms. Carly,
    I''m sorry to interrupt your evening, but I was wondering if I could talk to you
    about the incident with Tyler yesterday.”


    She wanted to sigh in relief at the out he''d given her, but at the same time
    it took every ounce of her professionalism to tilt her head up to him and say,
    “I was just leaving. We can talk about it on the way to my car--” she gave a scathing
    glance toward `Mia`, “if you can be away from your date that long.”


    He cleared his throat and turned red before he said, “I''m sure she understands,
    being a teacher and all.”


    Sienna rolled her eyes and said her goodbyes to the rest of the teachers. They
    protested her leaving so early, but she begged off by saying she had too much
    work tomorrow and needed to make it an early night.


    When she stood to leave, Mark stepped back to allow her to pass in the narrow
    space. Her arm brushed against his chest, and she heard his breath hitch. Her
    body sang with all the bells and whistles of sudden desire just from that momentary
    collision. But she wasn''t going to let her body lead the conversation. So what
    if he was smoldering hot with a silky smooth voice? It didn''t make up for his
    actions tonight.


    She strode to the stairs; her flats slapped against the tile. She could feel him
    right behind her, though he didn''t touch her as they climbed the stairs. It wasn''t
    until they were outside in the chilly October night that he said anything. “Sienna,
    I don''t want you to misunderstand this situation.”


    She rounded on her heel and glared at him. “Everything looks perfectly clear to
    me. You''re on a date with `Mia` tonight, and you wanted to take me out tomorrow.
    What is this, a competition between your children''s teachers?”


    He took her arms and pleaded, “No, it''s not that way at all.”


    She shrugged out of his grip and said, “You could''ve at least told me you were
    coming to the Happy Hour so I would''ve been prepared or better yet stayed at
    home.”


    “I didn''t know this was where your Happy Hour was. I didn''t even know I was
    going out with `Ms. Warren`. It''s a blind date, and I didn''t recognize her name.”


    “She''s your daughter''s teacher!”


    “Yeah, but I always call her `Ms. Warren`. I didn''t know her first name was `Mia`.”


    “You knew my name.” Her voice mimicked his, “Call me `Mark`, Sienna.”


    “That''s because I''ve been crazy about you since the first day of school.”


    Sienna took a step back, too shocked to reply. Then the door opened, and `Mia`
    appeared. A breeze blew her hair back like she was in a perfume commercial, making
    her a striking compliment to Mark. “Everything okay with Tyler?” she asked with
    a voice that really said, “What are you doing alone with my man?”


    Mark kept his eyes on Sienna, who finally found her voice. “If you''re so crazy
    about me, why are you on a blind date at all?”


    She turned and strode down the sidewalk. She heard `Mia` plead with Mark to come
    back, and Mark made no objection. The pain in her heart was much sharper than
    it should''ve been. The headlights of passing cars seemed to shine like a spotlight
    on her, showing the world how vulnerable she''d made herself again. With relief
    she turned a corner onto a darker street and found her car. As she unlocked the
    door, she heard Mark calling to her.


    ### ![](image3.jpg)


    When Sienna left for her car, Mark followed `Mia` but stopped just inside the
    door. He said, “Thanks for sharing a drink with me, but I think it''s a bad idea
    for you and I to date.”


    `Mia` narrowed her eyes and said, “But it''s okay to date Sienna? She''s a teacher
    too.”


    “You being a teacher isn’t the issue. You''re beautiful and fun-loving and very
