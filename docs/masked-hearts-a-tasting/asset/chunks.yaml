    当她的水送来时，她注意到马克从三年级的老师中抽出身身。他用手理了理头发，朝她走来。突然，那杯水成了她见过的最有趣的事物。她听到他说：“卡莉小姐，很抱歉打扰了你的晚间，但我想知道能不能和你谈谈昨天关于泰勒的那件事。”


    她本想为他给出的台阶而松了一口气，但与此同时，她用尽了所有的职业素养才抬抬头看向他，说道：“我正准备离开。我们可以在我去车的路上聊这事——”她向 `Mia`
    投了一个轻蔑的眼神，“如果你能离开你的约会会那么久的话。”


    他清了清嗓子，脸红了，说道：“我相信她能理解的，毕竟她也是个老师。”


    西恩翻了翻白眼，向其他老师告别。他们反对她这么早离开，但她推口拒绝了，说她明天有太多工作，需要早点休息。


    当她站起身离开时，马克向后退了一步，让她在狭窄的空间里通过。她的手臂擦过他的胸膛，她听到他的呼吸一滞。仅仅是那瞬间的碰撞，她的身体就因突如其来的欲望而悸动。但她不想让身体主导对话。就算他散发着迷人的魅力、声音如丝般顺滑又怎样？这无法弥补他今晚的行为。


    她大步走向楼梯；平底鞋在瓷砖上发出啪啪声。她能感觉到他就在她身后，尽管在爬楼时他没有碰她。直到他们来到外面凉冷的十月夜里，他才开口道。“西恩，我不希望你误解这种状况。”


    她转过脚瞪着他。“对我来说一切看起来非常清楚。你今晚在和 `Mia` 约会，明天你想带我出去。这是什么，你们孩子老师之间的竞争吗？”


    他抓住她的手臂，恳求道：“不，完全不是那样的。”


    她挣脱他的抓握，说道：“你至少可以告诉我你要来 Happy Hour，这样我就能有所准备，或者更好一点，干脆待在家里。”


    “我不知道这就是你们 Happy Hour 的地点。我甚至不知道我是去和 `Ms. Warren` 约会。这是一场盲恋，我没认出她的名字。”


    “她是你女儿的老师！”


    “是的，但我一直直叫她 `Ms. Warren`。我不知道她的名字叫 `Mia`。”


    “你认识我的名字。”她的语气模仿了他的声音，“叫我 `Mark`，西恩。”


    “那是因为从开学第一天起我就迷恋你了。”


    西恩向后退了一步，震惊得无法回答。这时门开了，`Mia` 出现了。一阵微风吹起她的头发，就像在香水广告里一样，让她成了马克身边格外耀眼的衬托。“泰勒还好吗？”她问道，声音里显然是在说：“你为什么要单独和我我的男人在一起？”


    马克一直盯着西恩，而西恩终于找回了自己的声音。“如果你那么迷恋我，为什么还要去相亲？”


    她转过身大步走在人行道上。她听到 `Mia` 恳求马克回来，而马克没有异议。她内心的痛苦比本该的尖锐得多。驶过的汽车大灯似乎像聚光灯一样照在她身上，向世界展示了她再次变得多么脆弱。她松了口气，转过角进入一条更昏暗的街道找到了她的车。当她解锁门时，听到马克在叫她的名字。


    ### ![](img/image3.jpg)


    当西恩走向车子时，马克跟在 `Mia` 后面，但在门口停住了。他说：“谢谢你跟我一起喝了，但我觉得你和我约会是个坏主意。”


    `Mia` 眯起眼睛说：“但和西恩约会没关系吧？她也是老师。”


    “你当老师不是问题。你美丽、爱玩，而且非常像我的前妻。我们离婚是有原因的。你很快就会发现我是个无趣的混蛋。”


    “我确定那不是——”


    “抱歉了，`Ms. Warren`。”他再次开门，朝着西恩离开的方向在人行道上跑去。在看到她之前，他先听到了汽车遥控器的锁车声，然后向她喊道。有一刻，他们对视着，但随后西恩坐进了车里离开了。


    “该死，”他对着上方嗡嗡响的路灯大吼。走回自己的车时，他试图思考如何和西恩恢复好关系。也许明天可以在咖啡馆和她谈谈，那里她看起来要放松得多。


    ## 3 | 未婚夫


    西恩几乎没有去咖啡馆做周六早晨的工作。她把纸张扔在桌上试图翻阅，但脑海里不断转着马克。她本应该留下来听听他想说的。不，去他的吧。她再次让心产生了一点点希望，但他已经把它粉碎了。这段关系会像其他感情一样结束。


    她的高中恋人在毕业后离开了，去非洲参加传教活动。她的大学男朋友加入了“无国界医生”并逃到了伊朗。当然，她的未婚夫取消了婚约，去阿根廷教导需要帮助的孩子。她所有的前男友心很大——只是不够爱她。


    沙发是空着的，所以西恩在别人进来占座之前，把文件夹堆在咖啡桌上。在拿回拿铁后，她的笔填满了一个又一框百分比和水平。当她写到一半时，听到了一个几个月没听过的声音，尽管那依然让她的心缩成一团。“我就以为你会在这里。”


    当她到达咖啡馆时，她立刻注意到到处都挂着蜘蛛网装饰。克洛伊戴着女巫帽跳到收银台前说道：“所以，你什么时候见马克？”


    “周一他接儿子放学的时候。”


    “噢，得吧。你们在一起看起来很完美。”


