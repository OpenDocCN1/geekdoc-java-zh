    她点了点头，当他起身去点餐时，感觉到坐垫移动了一下。她立刻把所有的文件夹堆在一起，准备快速溜之。和他一起吃午饭比回家里陷入新的愤怒和背叛感中要好。至少马克看起来知道他自己做错了。而格伦则假装他从没有和她分手过。


    “在计划你的逃亡呢，”马克再次坐在她身边，在她面前放了一杯新的拿铁。她很喜欢他微笑时眼角眯起的细细纹。


    “没没你的意思，但所有男人都是混蛋，正如你昨晚证明的那样。我确保自己随时都能抽身而走。”


    “我觉得你确实是故意的（冒犯），但我能忍受。我会确保昨晚是我对你所做的最后一件恶事。”


    西恩娜摇了摇头。“你现在是这么说，但迟早会发生的。也许你可以帮我个忙，让它发生得快一点。”


    马克皱起眉头，看起来很困惑。“你说话的样子就像男人对你有什么私人恩怨似的。”


    “难道不是吗？”西恩娜已经不知道自己在说什么了。再次见到格伦，接着又是和马克约午餐，这让她比一个在跳房子游戏时试图捡起地上石子的幼儿园小孩更不知所措。“好男人抱怨被迫扮演大哥的角色，但好女孩会被一直剥削，直到像用过的过的避孕套一样被扔进垃圾桶。”


    马克退到沙发边缘说：“你用那张嘴教我儿子的吗？”


    西恩娜知道自己的脸一定脸红了。她低声道歉，并很感激克洛伊此时带着三明治和拿铁为他送了。当克洛伊走开时，西恩娜说：“我真的不会在孩子面前那样说话的。”


    马克笑了说：“算了。我只是在开玩笑，好吧，有一点震惊。你看起来确实有那种纯洁如雪的老师长相。”


    “噢，我不是。所以你现在可以把这个念头抛脑掉了。”


    马克摇摇头：“不。做不到。我喜欢你外表和内在之间的反差。再说句脏话吧。”


    “不。”西恩娜咬了一口三明治，发现自己既被迷住又很放松。她咽下后说：“所以你约我去远足。那是你经常做的事吗？”


    那之后，对话转向了普通的约会话题。西恩娜不需要推开关于格伦的不愉快念头，因为她的心完全被这一刻占据了。她本以为由于年龄差异，和马克的对话可能会困难，但并没有出现任何尴尬的情况。他热情地谈论他的建筑项目，转而倾听她对教学的热爱。


    在三明治吃完被遗忘后的某个时刻，她注意到他们面对面坐，肩膀靠在沙发背上，身体只隔几英寸。她希望他再次握住她的手，并好奇如果她握住他的会有什么反应。她正让自己的心再次在拿铁铺就的小路上漫游，尽管她之前还争辩过应该坚持纯粹肉体关系。


    这时，她的手机在包包里响了。


    不幸的是，那不是普通的铃声：那是很久以前为格伦设置的铃声。她忽略了它。


    “你需要接一下吗？”马克问。


    “不，”西恩娜说。她的心在呼吸间瞬间崩塌又硬化。


    手机又响了几声，马克说：“你确定吗？”


    “我该走了。”


    “嘿，”马克说着，手放在她的肩膀上拦住她。“怎么了？”


    “我不能再这样了。我不能让你对我浪漫、爱上你，最后却以一场糟糕的分手结束。我宁愿我们直接做完就完事。”她咬着唇，自责不已。她不敢相信自己竟然对一个孩子的父亲说了那种话。从他的表情来看，她知道他也不敢相信。


    当她收拾好文件夹离开时，手机终于停止了响。她预计他会叫住她，但随后想起男人都是混蛋。他当然不会的。


    在户外，尴尬之感袭来，仿佛夏日的阳光照射在她身上，而不是清凉的秋光。她跑向她的车，没有听到身后急促的脚步声，因为她的耳朵里充满了自己心跳的声音。


    她把文件夹放在车顶上。在她用遥控器按下锁车按键之前，一只手抓住了她的肩膀并将她转过身来。马克盯着她的眼睛一会，然后用身体将她抵在车上，身体紧贴着她。他用一种她从未感受过的激情吻了她，即使从格伦那里也没有过，这让她身体颤抖。他的手游过她的手臂到达臀部，她感觉到他的挺起抵在她大腿和小腹之间的缝隙处。她的内心涌动欲望，当他结束接吻说话时，嘴唇掠过她的耳朵，这种欲望变得更加强烈。


    ![](img/image5.jpg)


    马克感觉到她的身体向他靠拢并开始颤抖。老天，他太久没有做爱了。久到克制几乎是不可能的，他完全地贴着她，性器彰显了他的渴望。


    他断开接吻，低语了一些他希望在欲望的迷雾中依然听得懂的话。“我很想带你出去约会，在咖啡和玫瑰花丛中慢慢爱上你。但我已经两年没有性交了，如果你想要的只是纯肉体关系，我会接受。”


    （注：原文此处存在大量重复的段落，根据指令“一定不要重复输出原文”，译文仅保留核心内容，不再重复翻译相同的段落）


    马克感觉到她的身体向他靠拢并开始颤抖。老天，他太久没有做爱了。久到克制几乎是不可能的，他完全地贴着她，性器彰显了他的渴望。


    他断开接吻，低语了一些他希望在欲望的迷雾中依然听得懂的话。“我很想带你出去约会，在咖啡和玫瑰花丛中慢慢爱上你。但我已经两年没有性交了，如果你想要的只是纯肉体关系，我会接受。”

