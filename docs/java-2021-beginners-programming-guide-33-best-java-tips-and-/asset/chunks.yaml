    < String >() : Optional. ofNullable(true); for ( int i = 0 ; i < possibleLocations.
    length ; ++ i ) { possibleLocations[i] = Optional. ofNullable(null); }


    If the method is attempting to convert a String to a non-object type, the assignment
    should use an object.


    The following is equivalent to the previous code:


