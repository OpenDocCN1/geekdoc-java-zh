    # 第 3 章 什么是 Java 编程的插件？


    但什么是 Java 插件呢？它们与其他 Java 技术有何不同？我如何在 Linux 中构建一个 Java 插件？


    ## 用于 .NET 的 Java 插件


    Java 插件是旨在增强你的 .NET 性能或开发新应用程序的软件和库。正如其名所示，它们与 .NET `DLL`（直接对象引用模型）非常相似。然而，它们是不同的，并且不需要运行时环境即可工作。这使得它们成为开发新的、自定义或内部
    .NET 应用程序的理想方式。


    ## 为什么你应该为 .NET 创建 Java 插件？


    如今，世界很大程度上是由 `Java`、`Python`、`Ruby` 等许多编程语言的使用驱动的。在这些语言开发的应用程序方面，它们拥有巨大的市场份额。如果你为
    Java 编程语言创建一个插件，它将允许你向所有的 .NET 程序员出售你的产品/服务。


    另一个优势是，由于它们拥有巨大的市场份额，相比于为每种其他语言创建一个，你更有可能吸引人们使用你的插件。


    ## 但如何为 .NET 创建 Java 插件？


    有很多方法可以为 .NET 创建 Java 插件。让我们探索一些：


    - 创建一个测试与 .NET 运行时兼容的完整 Java 应用。

    - 开发一个官方或专用工具。

    - 构建一个从外部库导入或导出并通过 `API` 访问接口的插件。


    ## .NET Java 插件的缺点有哪些？


    .NET 的 Java 插件适用于小型团队。然而，它们并不容易构建。开发过程中存在额外的成本，编程也是一项挑战。技术挑战有很多，需要大量的经验和技术知识来构建它们。这给开发者带来了额外负担，并让
    .NET 插件的开发变得更加困难。


    ## 开始需要什么？


    这取决于你的需求。示例包括：


    - 你需要从 Java 项目导入一些类。

    - 你需要将插件与现有的插件和库集成。

    - 你正在构建一个官方或专用产品。

    - 你正在将插件与托管的 .NET 解决方案集成。

    - 你想第一次自制 Java 插件。


    为了开始整个过程，你可以使用可用的 .NET IDE 来工作，或者可以使用以下 Java 插件框架来帮助你：


    - `jWidgets`

    - `JSP`

    - `JDK Native`

    - `领域驱动设计 (DDD)` 插件


