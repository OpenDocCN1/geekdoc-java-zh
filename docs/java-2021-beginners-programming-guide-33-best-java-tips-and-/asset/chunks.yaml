- fmt: '

    Some people who are used to functionally doing things will say that functional
    languages are harder to learn because they have to think in functional ways. Functional
    languages might be easier to learn, but they also might be harder to use. There’s
    some of that in `Java`.


    Yeah, I’m sure that they are, but the good thing about functional programming
    is that the reason you have to think that way is that functional languages are
    more restrictive. `Java` doesn’t care about that. The same as `Java` doesn’t care
    about concurrency, in `Java`, you can’t have lazy operations, you can’t have pure
    functions. They’re all part of the `Java` language.


    You have to know some functional programming. I would recommend when you read
    some of the books, I would recommend learning some functional programming languages
    like `Clojure`. If you want to learn `Clojure`, I would suggest the book “Clojure
    for the Joke,” or some other book that teaches about `Clojure`.


    `Clojure` is another example, one of the reasons people have trouble with `Clojure`
    is because they’re used to imperative languages.


    `Java` is more general-purpose, `Java` is a general-purpose language, it can do
    anything, but people see it’s a functional language and they’re all excited. But
    you can’t do anything with it.


    Then you look at a `Java` library, and you realize that they’re not functional.
    If they’re like `jQuery`, which is a library for `JavaScript`, and there are a
    lot of functional libraries for `JavaScript`, people like those too. If you look
    at the `Erlang` project, there are lots of them. When you’re doing `Erlang`, which
    is a functional programming language, you have a lot of these functional libraries
    for `Erlang`, but they’re not really in `Erlang`.


    There’s a big community of functional programmers, but you don’t see a lot of
    them as developers. They’re more like innovators.


    We have a lot of people like that in `Erlang`, and they come up with new ideas.
    They come up with new features and implement them, and maybe others will use them
    later. Maybe they’ll have a smaller company, and their clients will want a new
    feature, and they’ll go and implement that and maybe sell a smaller company.


    All those ideas are there, that’s the nature of it, it’s the nature of most programming
    languages.


    It’s the same with functional programming. It doesn’t mean that it’s more important
    than imperative programming. You can write programs in functional languages just
    as well as in imperative languages. It just means that your programming skills
    will improve if you learn a functional programming language.


    It depends on the thing you want to do, but if it’s something that’s driven by
    functional programming, you’re probably going to be better off. You’ll learn about
    functional programming. It’ll increase your communication skills. It will make
    you able to build those things more efficiently because you’ll be less dependent
    on conventional programming practices.


    Oh, and I think that people who’ve had kids will appreciate the importance of
    functional programming. That’s kind of a given, when you have a kid, you’ll want
    to have a program, and you’ll want to spend some time with it.


    I remember having a kid when I was at the University of Toronto in the late ’70s,
    and there were no such things as microcomputers at that point. We used those little
    weird computers in the student union, and we would program programs with them.
    The programs that we would write back then weren’t written for the microcomputer,
    we just wrote them in assembly language.


    But now, you have those programs with `C++`, `Java`, or `C#`, and you have to
    run the thing. It’s a machine-language program. You have to change it into machine
    language. And all those errors that you have in the assembly program you wrote
    are going to mess the thing up in the machine language.


    You go back to functional programming, and you have the code on a stack. You have
    a stack, and you have a couple of functions you want to run on the stack. What
    you say is, “I want to put these functions on the stack.” It doesn’t matter that
    they’re in the wrong order. What matters is, “What order are they in? How do I
    interpret them?” You don’t know that until you interpret them.


    And that forces you to write unambiguous code, it forces you to do it differently.
    And you can do it more efficiently, you can do it more effectively.


    When you do that, and when you learn the advantages of functional programming,
    you’ll discover something more important than that, the people who’ve had kids
    will find that to be an advantage as well.


    ## Introduction to Functional Programming


    In this session, I’ll show a little bit of the `Erlang` programming language.
    Then I’ll show the `BufHandle` and a few functions, then I’ll show a few functional-style
    functions.


    But that’s not enough, so let’s start with an introduction to functional programming.
    I will introduce the following terminology, and I will try to make it clear why
    we use this terminology.


    First off, I’ll say that we use the term “Functional Programming” to mean “Unary
    Operations.” Unary Operations are the functions that are called on a single input
    and that return a single result. And you say that as one word, and then you explain
    it. But you can also use the term “Functional Programming” as a blanket term for
    programming in general.


    Some people say, “I want to program in functional programming.” You could program
    in `Erlang` using some purely functional language, or you could program in `Erlang`,
    and then use `Haskell`, `Scala`, or whatever the hell you want.


    But I think it’s more productive to program in a purely functional language if
    you want to do it. But if you don’t want to do it, then, by all means, do it in
    an imperative language. I think it’s more productive to program in a purely functional
    language.


    One of the other things to say, the other term is “unary operators.” So we usually
    think of an expression as being an `AND` or an `OR`. You can put the `AND` on
    the right, or the `OR` on the left, and they’re both on the right.


    But these are not correct; you have to use not `OR`, but `AND`. So you have an
    expression and then you have two sides. One side would be an `AND`, and the other
    side would be an `OR`.


    And so when you put an `AND` on the right, and an `OR` on the left, you get a
    new expression on the right. So you can say that these are NOT in order. They’re
    not actually in the order. The correct order is like this: `AND OR`, `OR OR`.
    But you get the idea.


    So the other terms are also not correct. You can put an `AND` on the left, and
    you can put an `OR` on the right. It’s not the same expression; it’s different.


    In `Erlang`, you do not need these terms. There is a feature of `Erlang` called
    partial application, which allows you to put the function on one side of the function,
    and put the side on the other side, and then the body will be applied to that
    function. So if you put an `AND` on the left, then you will get a different function.
    If you put an `OR` on the left, you will get the function. It’s kind of magic,
    the way it works.


    You see this on every call to the standard library. You’ve probably got something
    on your screen right now, like for example, the standard library will give you
    the `list` function. It’s not in the standard library. But if you do not specify
    a list argument, then it will give you a list of all the lists. If you do specify
    a list argument, it will give you a list of the pairs. So you can have one pair
    of two lists, and you can have another pair of a pair of lists, and then you can
    have another pair of a pair of lists. You can have every permutation. It’s just
    a permutation in the permutation language.

