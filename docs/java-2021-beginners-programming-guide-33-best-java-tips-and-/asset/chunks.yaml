- fmt: '

    So you know how pattern matching works. And the thing is, sometimes, you have
    to make a huge, giant type check and you need to start annotating everything,
    and so you have to make it more brittle. If you use pattern matching, instead
    of having to annotate everything, you only have to annotate some things. So when
    you say matches on tuples, we can just say this part matches on tuples and that
    part doesn’t. So now we can have one type of checker that says, “This is a case
    where this part is a case where”. That makes it much easier to do type checking.


    So for example, I sometimes want to put objects into an array that’s going to
    be kept in memory in a distributed fashion. So I want to be able to put any type
    into a hash, which is how I’m going to manage this, into this array. And so that’s
    exactly the problem that I was trying to solve before. So I can now use this pattern
    matching to do that, and this way, I can annotate only these cases and only the
    relevant cases. So you don’t have to have this huge huge type of checker everywhere.
    You can just have this little pattern checker. But the other thing is, that with
    type checking, you have the whole library, and then you have a single class that
    you use for pattern matching. You can’t do that with pattern matching. You can’t
    say, “Oh, okay. So I have this method that matches on this pattern, and it can
    only match on this part of the system.” If you use pattern matching, you can only
    match on this part of the system, and that’s the only case that you need to check.


    So also it’s useful, because when you have these large type checks when you have
    these type checks that are going to come down the wire, I also find it useful,
    this matching. So that’s kind of a separate question. And I’m not even going to
    tell you how to do pattern matching, but this is also another approach. I think
    it also fits the model that I’m talking about, where we do a lot of object hierarchies,
    and it’s very easy to forget about one level or the other and to fall back to
    type checking.


    ## Using the WSDL for validation


    So before you write a library, it’s a good idea to have a signature, a validator,
    in the system. So we’ve got these `WSDLs`, and they tell you what the documentation
    of your library is going to be like, and that makes it very easy to keep it straight,
    what documentation you’re going to have, what requirements you’re going to have
    from the users. So I think that’s a good thing. And then the way I use that signature
    is by building a grammar for a single pattern, and then you can define what an
    implementation is, and then if you want to validate your library concretely, you
    can do that using a `lexer` or a `parser`.


    ## Faces vs. Extensible Markup Language


    So I think this has a lot of applications. So for example, maybe you have a huge
    codebase, and you want to get rid of the language and just want to use `HTML`
    markup. You can do that, and that’s what we do in the `blog` package. But the
    big problem is, you have to make sure that you have syntax highlighting for every
    code that you’re using. And when you’re doing that, you have to make sure that
    the people who are going to use this library are used to seeing `HTML`. But you
    can do that, you can have syntax highlighting, but if you’re using that kind of
    markup for your actual code, then it’s very confusing. So to use this markup for
    your code, then, yeah, it’s also a good idea.


    So I’ve done that. And then I’ve used this idea that I change the regular expression
    each time you use it. So I’m going to mark it up and then change it all the time.
    And that’s kind of a good idea. So you do not have to be stuck with the regular
    expressions that you have when you are writing your code. And that also has a
    lot of different applications. I don’t want to go into that now, because we’ve
    got the talk, but I think this is a very good approach.


    So actually, just taking a look at that type of signature, you may have noticed
    that in the library, there is no special type for reading from a file. But in
    reality, people do read from a file, so you have to include some kind of package
    for that. Or you might be using `sockets`, and you’re using `sockets` a lot, so
    you have to include a `socket` package. So I think it’s also a good idea to have
    these packages that have extra support for that kind of stuff.


    ## Tools for the Real World


    This is another case where I’m thinking about a lot of type signatures. There
    are some kinds of functionality that I use very often, and the kind of signatures
    that I use is to find a number, and then I know what the answer is, because I
    get the number and I get the specification of what I need, or I get the number
    and I know exactly what I’m supposed to do. When you work on a large codebase,
    that kind of signature often works pretty well, and people usually use them. So
    you can have a special type for that, that is a pattern for a function. So say,
    you have a file that you want to open, you can put something like `file open`.
    That’s the package that should contain the signature for the function, and then
    when someone’s going to read that file, they know what the answer is. They can
    run it against a file that has a similar signature. You have a file that has a
    different signature, so you can use that, and you just get the kind of the signature,
    and you use it in your code.


    But the real world is not like that. In the real world, you have to make sure
    that people use that code, and then you have to also make sure that you test that
    code, and test that code with real people, and test that code with real bodies
    of code. So you have to be more flexible, and you have to be more kind of, maybe
    more careful about the types because you don’t want to break the types that people
    are using. So it’s also a good idea to have a more flexible type system in the
    real world.


    A more flexible type system also means that you can make more cases where you
    use different types of functions, and it might be easier for them to know what
    to expect. But, at the same time, you can also make the real function that someone’s
    going to use more complex, so they can be more sure that what they’re going to
    get is what they’re supposed to get. So you can do that with a type system, and
    also you can do it with other ways of limiting the access that people have to
    a certain piece of functionality. I’m not going to talk about that in this talk.

