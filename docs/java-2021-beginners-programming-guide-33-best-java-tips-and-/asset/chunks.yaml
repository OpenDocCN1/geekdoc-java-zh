    JDBC is a database access mechanism that is closely tied to the JPA specification.
    The basic implementation of JPA is the `UseWhen( dependent parameters: ...)` method.
    The actual API of JPA is a series of APIs that manage the state of the database
    and introduce mapping between user objects and the entity in the database. The
    two main database drivers are `Oracle` and `SQL Server`.


    ## Why Is It Important?


    It''s important for applications that use the JPA specification to be able to
    use database adapters that are not specifically tied to a specific database. It
    can be useful for a customer to buy database drivers that support JPA, but also
    be able to use `Oracle`, `SQL Server`, or another database without having to add
    additional drivers or database adapters.


    ## What Is JPA 3.0


    The name of JPA 3.0 is "Entity Framework 1.0", although it''s not an overly serious
    effort to port `Entity Framework 1.0` to `JPA`. It was probably the biggest long-term
    effort to solve the problems that `Entity Framework` is known for, and how to
    best make the mapping between entities and database back-ends that are being developed
    with `JPA`.


    From the above description, it''s obvious that there are many difficulties in
    doing a true port of `Entity Framework` to `JPA`. From my perspective, `Entity
    Framework` is one of the best available options for database integration. So the
    effort is not to develop a very expensive port of `Entity Framework` to `JPA`.
    The goal is to develop a library that can be easily implemented and extended with
    `JPA` extensions that have a low barrier to entry.


    `Entity Framework` uses an HTTP protocol to expose its functionality. The problem
    is that the `JPA` spec does not provide a standard way to interface HTTP clients
    with `JPA`. The standard way to provide `JPA` clients with HTTP clients is through
    the use of a web server. Several very popular web servers are available, but they
    also each have their drawbacks.


    The JavaScript-based, minified version of `Hibernate` is the canonical implementation
    of `JPA` client API. It provides client functionality for any database. The original
    version of `Hibernate` is based on the functionality of an earlier, obsolete version
    of `Hibernate`. The other major `JPA` implementations are `JBoss EAP` and `Grails-JPA`.
    They provide client functionality for each database.


    There have been some efforts to standardize HTTP clients to `JPA`, but they are
    currently not sufficiently widespread to make a real difference in the `JPA` landscape.
    It''s probably going to take another generation of `JPA` implementations to become
    widespread enough that the "standard" client libraries are widely available.


    The API changes in `JPA` 3.0 are the result of the efforts to bring better interoperability
    and reliability to the inter-op between `Hibernate` and `JPA` clients.


    All entities and their relations are created as a resource by the database. The
    entity resource can be placed into the class resources table. The user then provides
    a context to the resource. The database then resolves the user''s context property
    and maps it to the specified relations. Each application object is created as
    a resource with a context created by the database. It has one single interface,
    which is called the `Projective Model (PM)` interface. The `PM` interface has
    a single method that provides a mapping between the user''s project and the database''s
    entity resource. The `PM` interface has a "select statement" for sending a user
    to the entity resource. The query is queried against the entity resource with
    various tables and relationship types, and each entity has one or more fields.
    The application can populate the various fields. It can retrieve the current properties
    and/or get the associated properties. It can query the associated relations. It
    can get all entities and/or all the relations. It can access association resources.
    It can filter results. It can select relations or access relations. The application
    can query the database to find entities, relations, properties, or any combination
    of those.


    These basic design principles have helped a lot with making the above example
    code more readable. However, I see several design issues and practical issues
    that are currently hindering the adoption of `JPA`.


    ## Caveat #1


    This section is more of a warning, rather than a real complaint. I am not claiming
    that every member of the `JPA` committee is a bad person or that every member
    of the `JPA` committee is evil. There are certainly more good people than bad
    people in the `JPA` community.


    One `JPA` expert said that the biggest flaw in the `JPA` specification is that
    it is "too full of complexity." The question that I asked him is what he means
    by "complicated." Does complexity come from covering all possible variations in
    each of the implementation details or does it come from covering all possible
    variations in each of the client codes? He said that `JPA` is far too complex.
    However, I am not convinced that there are many implementations, or at least nearly
    all implementations, of `JPA` in use that are this complex.


    ## Caveat #2


    There is some disagreement on the definition of a "real" database. One person
    said that an `Oracle` database is a real database, while another said that a `DB2`
    database is a real database. That is unfortunate because both `DB2` and `Oracle`
    support `JPA`. There are a large number of `JPA` implementations that use `JDBC`.
    The problem is that they typically are not provided as standalone or integrated
    support, and are usually just used to work around the Java community''s lack of
    a well-supported `JPA` implementation. For example, one `JPA` implementation,
    `JSR 341`, provides an application toolkit, which gives each registered application
    a set of mechanisms to do `JPA`. There are two problems with this approach: first,
    it may be too complex for most users to understand. Second, even if the user has
    been able to find a way to use the `JPA` tools, it may require a lot of work for
    the user to be able to work with other third-party tools that support non-`JPA`
    interfaces. This does not mean that there are no third-party tools that support
    non-`JPA` interfaces, but they are few and far between.


    Many people are claiming that `Oracle` will only support `JPA` when other vendors
    support it. I think that is a bit of nonsense. What we need are `JPA` implementations
    that use the standard `JDBC` interface, as many third-party tools support the
    standard `JDBC` interface. Of course, several factors make this even more difficult.
    The `JPA` toolkit implements an interface for each database, not just `Oracle`
    or `DB2`. The toolkit is itself proprietary, so it is proprietary to each vendor
    that chooses to implement it. Finally, the toolkit usually contains a large number
    of features, such as the ability to talk to a very large number of objects. It
    is often very difficult to reconcile these various requirements.


    Many developers believe that an Object Relational Mapper (`ORM`) is a good way
    to solve the data access problem. The problem is that there are two major drawbacks
    to the `ORM` solution:


    First, it is too complicated. Even though an `ORM` may be used to allow a developer
    to do business things like reading and writing simple objects and relationships,
    the complexity of the `ORM` and the configuration of the various features often
    require a lot of expertise, which many developers do not have. Second, it does
    not work well when it is possible to change the data model or implement a different
    way to do the business calculations. A large number of table views and combinations
    of those views have been very troublesome for a large number of people.

    '
