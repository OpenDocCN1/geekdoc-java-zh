    A fourth option is to look at the tutorials on the forums on the SpringSource
    Developers blog. It is already quite hard to find some of the best solutions,
    and then you are inspired to write your own. I know of several projects that would
    take a weekend to write themselves, and that a weekend of serious effort would
    make them easy to write.


    It is also possible to work with someone else to write an implementation of a
    design pattern that you like. If there are significant problems, or if you can
    get significant benefits by sharing them, then you should consider making the
    effort to create your implementation and share it with the community.


    Finally, if you have the time and resources, you could go ahead and write an implementation
    of a design pattern that has a significant benefit to the Java platform and write
    it yourself. I would not suggest that, because it could have a substantial impact
    on your career if you end up doing that.


    # Chapter 14: What are the web services for Java?


    A `JSR 307™` web services specification for Java is known as the `WebSocket Specification`.
    The official specification was published by the `W3C Web Applications Working
    Group` on 20 June 2010. This page explains more about the `W3C WebSocket` specification.


    ## What are libraries and tools for Java web services?


    Most libraries for building applications on top of Java web services are commercial.
    Developers must often choose between some of the leading commercial services such
    as `Stormpath` and many others. However, there are also many open source projects
    out there, including several `Java EE` communities with an active support community.


    * Open source projects

    * Java EE Web Services

    * SWARM

    * OWASP WEB-API-Security

    * Docker for Java


    ## What about Java EE 7?


    If you are a `Java EE 7` developer, there are several new features added in `Java
    EE 7` and its specification. This page includes the list of changes.


    ## What is the difference between Java EE 6 and Java EE 7?


    `Java EE 7` is not a new version of `Java EE 6`. `Java EE 6` is not intended to
    be a superset of `Java EE 7`. If you want to know the details of the differences
    between these two versions, we have written about this topic many times, including
    a detailed blog post by `Rich Landa`.


    ## Java EE specifications


    The official `Java EE` specifications for `Java EE 7` are derived from the following
    specifications:


    * HTTP Basic Authentication

    * JavaServer Pages, JavaServer Faces, JavaServer Display Faces (JSF)

    * CloudFoundry

    * PolicyKit

    * JavaSE API for RESTful Web Services

    * Cloud-Build

    * Container IPC

    * Lifecycle Methods (LINQ)

    * API Gateway

    * Hosting

    * JAX-RS

    * JAX-WS

    * CDI


    With a few modifications, most of these specifications also provide the concepts
    required for implementing Java web services. However, `Java EE 7` comes with many
    additional features which were implemented in different modules or provided by
    open-source projects:


    * Java API for RESTful Web Services (JAX-RS)

    * Cloud Foundry

    * JavaServer Faces

    * JavaServer Display Faces (JSF)

    * JAX-WS

    * Java EE Web Services (JSR 307)


    ## What about the status of the Java EE 7 and its specifications?


    The implementation of `Java EE 7` as a part of `Cloud Foundry`, based on the `Cloud
    Foundry Integration Pack`, is available for download. There are several implementations
    of the `Java EE 7` specification in various projects. For example, `Codeplex`,
    `Apache OpenJPA`, and `Apache TomEE` are all available for download. These projects
    are available as open-source or for free.


    In the following sections, we summarize the status of the `Java EE 7` specification
    and its modules. The status of a project can be found in its `GitHub` repository.


    Java EE 7 Released as an Eclipse MicroProfile: As of July 2015, `Eclipse` has
    included `Java EE 7` and its modular implementation, as an `Eclipse MicroProfile
    (EM)` module. The `ECMA-376 Java EE 7` specification is mature. `Eclipse MicroProfile`
    is an `Eclipse` component that is built on top of the `Java EE 7` modular implementation.


    Java EE 7 and JavaEE 6 compatibility: `Java EE 7` is an entirely new specification
    and therefore is incompatible with `Java EE 6`. To ensure interoperability, `Eclipse''s
    Java EE 7` capabilities may be used with existing `Java EE 6` technologies as
    well as all previous `Java EE` versions.


    Java EE 7 and the Java SE API for RESTful Web Services: Most APIs in `Java SE`
    for RESTful Web Services (REST) are based on the `JSR 307` specification, but
    `Java EE 7` is also compatible with this specification. If your next project needs
    to use `JSR 307` APIs, you should consider using `Java EE 7` or another implementation
    of `Java SE APIs for RESTful Web Services`.


    Java EE 7 and Cloud Foundry: As of July 2015, `Eclipse` has included the `Java
    EE 7` specification as an `Eclipse MicroProfile`. `Cloud Foundry` supports `Java
    EE 7`.


    Java EE 7 and PolicyKit: As of July 2015, `Eclipse` has included the `Java EE
    7` specification as an `Eclipse MicroProfile`. `PolicyKit`, a `Java API for RESTful
    Web Services`, is an `Eclipse MicroProfile`.


    Java EE 7 and Entity Framework (EF): Although `EF` is not a supported dependency
    in `Java EE 7`, `Java EE 7` supports the following modules:


    * javax.model

    * javax.relation

    * javax.Security

    * javax.spout

    * javax.sapi

    * javax.tls


    The implementation of `Java EE 7` is compatible with all previous `Java EE` versions,
    so you can reuse the capabilities for the earlier versions.


    ## How do I know which Java EE 7 specifications are available in my IDE?


    Java EE 7 Complemented

    * Eclipse MicroProfile Support

    * Eclipse EE 6 Support

    * Eclipse EE 5 Support


    Java EE 7 Java EE 7 Module Signature Compatibility

    * None: Partial Java EE 6 Compatibility: Partial Java EE 7 Compatibility: Complete
    javax.weboid module javax.tls module


    The `Eclipse MicroProfile` implementation of `Java EE 7` consists of a `Java EE
    7` implementation of the `JSR 307` standard module, a `JAX-RS 2.1` implementation,
    and an `EJB 3.1` implementation. In contrast, the `JSR 285` modular implementation
    implemented for `Java EE 6` is a standalone `JSR-292` implementation.


    ## Eclipse Enterprise for Java 6


    The `Eclipse Enterprise for Java 6 (EE6)` provides the complete `Java EE 6` functionality.
    The `EE6` implementation includes all of the `Java EE 6` services as well as all
    of the previous `Java EE` specifications for `JAX-RS`, `JSF`, and `JAX-WS`. The
    `EE6` implementation includes the `Java EE 7` JSRs and is interoperable with `Java
    EE 7`.


    ## Eclipse Enterprise for Java 7


    The `Eclipse Enterprise for Java 7 (EE7)` implementation provides the complete
    `Java EE 7` functionality. The `EE7` implementation includes all of the `Java
    EE 7` services as well as all of the `Java EE 6` specifications for `JAX-RS`,
    `JSF`, and `JAX-WS`. The `EE7` implementation is interoperable with `Java EE 6`
    and will be the default `Java EE 7` implementation in `Eclipse EE 7`, with new
    `Java EE 7` JSRs to be added to EE7.


    ## Eclipse EE 7 and Cloud Foundry

