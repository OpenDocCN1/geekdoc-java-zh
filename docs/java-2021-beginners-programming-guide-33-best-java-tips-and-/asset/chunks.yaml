- fmt: '

    Java is a programming language and is a reflection of how the programmer wants
    to use it: direct, declarative, object-oriented, and sometimes even functional.
    It follows the same logic as your design principles in programming: choose only
    those components that help you build a system, like containers, and use those
    components exclusively. There is no reason to create a container (which in Java,
    is just a container of immutable data) to house arrays, instead of a pointer to
    an array or the latter in a slice. All you have to do is write a function and
    stick it in the same class as the container (and a few lines of code later, the
    container is instantiated, with all those names in it).


    How to use Java? In Java, the element of fun is expressed in the language itself.
    There is no need to compile it or call an external library to access it (although
    it is extremely useful for lightweight projects). Where the expressions are meant
    to be analyzed and created, the program is going to provide that analysis. Java
    is the largest, most mature language out there (by a wide margin). Its community
    is a large, well-established one (see the documentation to find out how to join),
    and the ecosystem is the largest and best in the computing world. Java is an all-or-nothing
    language. The language is always there, always available. It comes with a rich
    set of libraries that allows you to do almost anything you want. In the past years,
    a whole new set of the library has been available for those who like to use `Scala`,
    a type of functional programming language. Java offers an easy learning curve
    (compared to other languages) and an equally comfortable reading experience. The
    examples and examples make you feel like a genius even if you are not. When it
    comes to the language, this means that all the examples are in Java and all the
    comments in the code are written in Java. This should not scare anyone. The separation
    of concerns is apparent, and the use of readable code makes it easier to follow
    the story of the code. If you ever wonder why Java is the most widely used programming
    language in the world (together with `C#`, `Perl`, `Python`, `Ruby`, and a host
    of others) consider all those facts. All you have to do is switch off the lazy
    eye and read. Java can solve most problems you are going to encounter. It''s mature
    and stable. Java can also solve most problems you do not want to solve (unless
    you are in a game like driving in a car, then you may want to go with `C++`).
    Java is perfect for embedded and portable systems (hence the popularity of `Android`,
    `Embedded Java`, and mobile devices like Java tablets). If you have a problem,
    Java can solve it. Java has a small development time, both for development and
    for testing. This is the main reason for its success.


    ## Java as an industry-wide movement


    Today, Java is everywhere. Companies don''t have to come together to innovate.
    Instead, they develop software with well-defined teams of experts and then just
    release the software to the world. It''s done! Although Java is available as a
    free download, you will need an installation on your machine. In practice, Java
    is just a new way to develop the same programs that were developed in the old
    days (`Unix`/`Linux`, `Visual Basic`, `Visual C++`, ...) with a few changes and
    optimizations. There is no need to reinvent the wheel. With all the advantages
    of the new paradigm, this new development approach is increasing productivity
    and allowing companies to streamline their resources and approach problems more
    efficiently.


    ## Java FAQ for Scala newcomers


    Java has been the gold standard of server and enterprise software development
    for more than 15 years, with more than 1 billion users in more than 180 countries.
    It is the most popular language in the world for mobile, consumer, and embedded
    devices. Java is the first programming language and is used for all of the server/enterprise,
    mobile, embedded, scientific, and animation applications. Java is very popular
    in the Automotive industry (`Tesla`), is the default technology in the mobile
    industry (`Google Nexus One`, `Android`), and is embedded in all kinds of smart
    devices (Internet of Things). Java is powerful and has an easy-to-use syntax.


    ## Why are so many people switching to Scala, and what is the reason?


    Since I am a `Scala` developer and this is not a question about `Scala` itself,
    let me try to answer it as a Java developer. `Scala` is an object-oriented language
    for the `JVM` and in this post, I want to write about the `Scala` language.


    ## Java language is too big for its good


    There are 2 reasons for this phenomenon.


    First, the Java language is huge. It has a high abstraction level, with lots of
    type-safe features. Each language feature that can be coded in Java is coded in
    Java and then the syntax is translated to a `JVM`-specific syntax. Since Java
    is not yet an interpreted language, a developer needs to compile the Java code
    into bytecode, which is executed by the `JVM`. `Scala`, on the other hand, is
    not an interpreted language, and in general, it has many fewer language constructs.


    Also, the features in the Java language are not the only features of the Java
    language. Most Java developers are not aware of the bigger Java picture, and even
    if they are aware of the bigger Java picture, they can''t keep track of the entire
    set of Java language features. For example, the following Java code is not safe:


    ```java

    public class Person { public static int id { get ; set ; } public static String
    name { get ; set ; } public static int age { get ; set ; } }

    ```


    It might work, but it could also result in a `NullPointerException`, and because
    the language offers few types, it could even result in a runtime error (such as
    an undefined variable).


    Note that this language error can be detected via checking for null-safety, which
    is an aspect of the language which is very similar to function safety, but there
    are other aspects of functionality that the Java developer is not aware of and
    does not have time to learn. Functionality such as stack safety and perhaps memory
    safety is often easier to implement than functionality such as null-safety.


    The second reason why Java is bloated and not easily understandable is that the
    Java language specification is very large. The Java Language Specification is
    1,835 pages long, and this includes everything the Java language offers. So the
    Java language is so large that it can be hard to read the specification. The fact
    that this specification is also difficult to work with makes it even more likely
    that people will overlook the issue.


    ## Exposure to more complex languages


    According to the Code Trends Study, most developers only work with `Scala` and
    `Python`, but I am not aware of any survey to find out what languages developers
    are using if they work with other languages. From my experience, `Scala` and `Python`
    are not popular among Java developers. However, among these developers, many are
    exposed to more complex languages.


    For example, when working with other languages, the Java developers can learn
    things such as:


    - `GCC` or `MinGW/PowerPC` compiler

    - `javac` and `gradle` (inherited from the Java developer)

    - Compilers `GCC` or `MinGW/PowerPC` compiler `javac` and `gradle` (inherited
    from the Java developer) Language tools such as the `Reflection API` (or methods
    like `reflection` or `function introspection`)

    - `Netbeans IDE` (or `Eclipse`) and other Java IDE

    - Portable libraries (e.g., the ones included in the `JDK`, such as `javax.outs`
    or `java.util`)

    - Different capabilities of the `JVM` (such as high-performance threads and fine-grain
    concurrency control)


    There is little downside to these additional capabilities, since the new capabilities
    typically offer only a slight speedup for existing code. Also, if Java programmers
    know how to use them and can implement them, they can make their existing Java
    code faster.

    '
