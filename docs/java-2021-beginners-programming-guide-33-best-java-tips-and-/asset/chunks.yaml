    我们接触过的多数开发者都属于“太简单”阵营，即少数几个工具可以“开箱即用”，无需任何配置（或者至少比所需的要少得多）。一些开发者属于“不简单”阵营，他们必须对功能进行配置才能使其变得有用（例如打印、查询以及许多其他操作）。还有一些人属于“没用”阵营，由于任务不适合任何现有的工具，这些工具完全没有被使用。


    ## 工具运行良好吗？


    将使用以下问题陈述来评估工具的有效性：


    “标准 `JVM` 的目的是允许我们以单线程、低延迟的方式运行 Java 代码。因此，在通常情况下，我们希望 `JVM` 以单线程、低延迟的方式运行。然而，我们的一些项目可能更适合多线程、高延迟操作，例如从网络下载图像的
    Web 应用。这些项目将受益于线程的使用，而 `JVM` 可能会赋予我们以多线程、高延迟的方式运行这些项目的能力。”


    当然，上述陈述包含许多子部分，每个部分都有不同层次的抽象。通常情况下，我倾向于从低级抽象开始，然后逐步向上，并在过程中考虑真实开发者的关注点。换句话说，这是对真实开发者想法的非常粗略的近似，而不是一套硬性需求。


    ## 工具提供了必要的配置吗？


    要让一个工具有用，它必须提供足够的配置以供使用。这可能是最让大多数开发者感到困惑的地方，因为配置工具有许多方法。


    一种方法是对开发者如何使用工具做出假设（例如，“所有开发者都是同的，所以让我们配置工具在所有开发者中都以相同的方式运行”）。也就是说，如果你的目标是为你的工具提供一张“配置映射”，那么你很可能会失败。


    另一种方法是采用开发者使用工具的典型方式（例如用户层、通过命令行进行配置等），然后反向推，设计一种能够按照用户当前使用工具的方式运行的工具。也就是说，确保工具运行在
    `JVM` 上，而不是运行在某些其他处理器上（Java Web Start 并非如此）。


    这引出了另一个我称之为“模式匹配”的概念，因为它涉及到项目/应用程序与特定配置的匹配（可以是特定的 `JDK` 版本，甚至是特定的 `JVM` 配置）。这可以使用与项目或应用程序对应的代理配置文件来实现，通过解析这些文件来确定哪些配置文件是合适的。（这篇文章对模式匹配有很好的介绍。）


    另一种方法是确保工具为每种支持的配置都包含一个配置文件。然而，这是一种繁琐的方法，对于许多只有单一配置的小型项目来说并不实际。此外，混合配置文件也存在一些顾虑：如果你需要在同一个
    `JDK` 版本之间切换，但你有两个不同的配置，会发生什么？配置文件也是不同的，所以你无法在项目之间复用配置文件。


    因此，问题是：如何为给定的配置提供正确格式的配置？


    ## 配置组织得当吗？


    有时，你必须关注细节。你需要一个文件来存储配置，并且需要确保该文件包含正确的选项。同时，你希望配置是易读的。


    ## 配置是自定义的吗？


    当然，如果配置不易修改，工具的用途就有限了。配置本身呢？你希望它是可编辑的吗？（Java Web Start 无法做到这一点。）


    最后，Web Start 的配置略有不同。在抽象层次方面，有许多方法可以配置工具使其在 `JVM` 上运行。然而，Web Start 在如何创建该配置提供了一些灵活性：它支持一种原生配置解析器，并可以修改程序以运行在不同的
    `JVM` 上（例如在 Oracle 支持的 `JVMs` 之间）。


    因此，Web Start 为开发者在创建配置方面提供了更大的灵活性。


    ## 未来


    有许多方法可以定义工具的配置模式（schema）。某些采用“配置映射”方法，而另一些则使用配置文件模式。但有一点是可以肯定的：任何提供在工具中创建配置能力的工具，都需要为特定配置提供正确的格式，而正确的格式随工具和配置而异。（我还没有研究如何为仅允许你创建单个配置的某个工具提供配置支持，但这绝对可能的。）


    作为 PostgreSQL Console 持续开发的一部分，我们创建了一个原型解决方案，为 `PostgreSQL`、`JRockit` 和 `Percona
    XtraDB` 的配置文件提供支持。（我们将其命名为 Percona XtraDB Console。）


    与其为 PostgreSQL Console 开发类似的解决方案，在我们的下一次大发布中，我们将专注于扩展用户编写的类型与现有提供程序配合使用的能力。


    第一个建议是将类型参数添加到由配置创建的客户端的 `pathname` 属性中。该类型名称随后必须以架构文件的类型名称为缀，这样如果你想创建一个与类型中配置不同的新类型，你就需要指定包含该配置类型的文件。


    然而，这将要求开发者对他们想要使用的类型更加明确：他们需要为配置类型指定一个值。


    另一个选项是扩展 `System.IO.Configuration` 接口（它是为 .NET 4.6 设计的）。该接口提供了创建类型的方法，只要它们符合 `System.IO.Configuration.Types`
    接口（由于 `System.IO.Configuration.Types` 不是 `System.IO` 类型，它需要内置）。因此，我们可以在 API 中提供一个接受
    `TypeBuilder` 的模块，它提供了创建新类型的声明语言。类型构建器将返回一个 `TypeBuilderValue` 类型，它是访问其配置属性的简单封装器。


    未来的目标是将配置类型添加到提供程序的命名空间中，使其成为工具内置的一部分。


    另一种方法是为配置文件尝试类似的解决方案，允许开发者在工具的“config”目录中创建一个文件，并使用单行将其导入工具，而不是像现有配置那样需要多行。


    因此，我们正在调查提供如下内容的可能性：


    ```

    # 在文件 "settings" 中创建一个新类型 . {"ConfigFileType" . {"configFilePath" }

    # 在工具提供程序 "TypeBuilder" 中定义的类型构建器中导入该类型 . new "ConfigFileType" . configFilePath
    {"configFileType" . {"configFilePath" }

    ```


    但是，正如我在开头提到的，这引发了关于如何命名这些不同类型的顾虑。这种想法与为工具中提供的类型提供一组公共类是一致的，从而提供创建遵循相同 API 的不同类型的能力。例如，可以有一个符合
    `Base` 类的类，一个符合 `ConfigAttribute` 类的类，一个符合 `ConfigAttributeConstraint` 类的类，等等。


