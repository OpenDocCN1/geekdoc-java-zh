  trans: '

    Java 语言的一些特性被其他语言所使用。这是拥有易于演进的语言（相对于反应式语言）的自然结果。许多 Java 特性非常有用，但由于 Java 虚拟机能力的差异，并没有被广泛使用。此外，某些
    Java 特性有用但未被广泛使用，是因为开发者社区在推广或与其他开发者共享这些特性方面做得并不好。


    此外，我不认为大多数 Java 开发者都接触过 `JVM` 提供的额外能力。许多其他开发者特性对 `JVM` 的效率有显著影响。最重要的例子就是动态代码生成。这些技术对
    `JVM` 的性能有巨大影响。然而，由于大多数开发者不使用动态代码生成，他们无法享受到其带来的处。


    兴趣进一步了解 `JVM` 能力以及如何实现它们的程序员，可以查阅 `Oracle JDK` 的优秀文档，例如 `JVM internals`、`JVM tips`
    等。这些文档有专门的章节解释如何实现 `JVM` 的各种功能，例如编译时元编程和动态代码生成。然而，这些功能中的许多很难理解。


    因此，我提出了六个理由，说明为什么 `java.util.concurrent.Flow` 不是在应用程序中处理错误的好方法。在下一篇文章中，我将讨论为什么它是处理错误的坏方法。这篇文章描述了线程如何同步访问一个对象。下一篇文章将讨论为什么在我看来，使用线程来同步对对象的访问是不被鼓励的。最后，我将解释为什么我将同步原语视为一种过时的编程技术。


    # 结论


    Java 全球范围内的标准可用性和免费的社区参与，是目前为止对任何接触 Java 的开发者来说最大的优势。一个支持这些特性的实现并不是忽视 Java 优点的理由。Java
    最大的益处是它的测试工具，因为它们适用于几乎所有的编程语言，并且提供了与 IDE 的集成。


    Java 语言层面的一些问题：


    * `jdbc adapter` 尚未实现（有太多的异常无法在此处记录）

    * `Classloader` 极其复杂（但好处是你可以不需要从零开始修复它）

    * 命名问题（Naming issues`）

    * 作为抽象类的接口（Interfaces`）


    Java 的语法允许开发者提高可读性并减少可读性问题。这并不意味着其他语言不能做到，但这并不是一个普遍规律。


    `JVM` 有一个复杂的 `GC`。但它非常一致，并且知道如何运行。


    Java 开发者可以构建大规模可扩展、低延迟的系统。


    Java 世界中有很多工具可以改进调试和分析。一些重要的工具包括：


    * `JUnit`

    * `JDebugger`

    * `JUnit profiles`


    ## 为什么 Java 存在了这么久？


    Java 花了多年时间才成为一种可行的语言。由于语言和编译器的巨大复杂性，对于从其他语言来的人来说，门槛很高。直到 Borland 构建了 `Apache
    JVM`，Java 才变得流行，它胆于吸取 `C/C++` 编译器的所有优秀部分并将其编译到 `JVM`。


    `JVM` 已经存在 10 年了。这是一个很长的时间，在这么短的时间内，该领域有很多创新。特别是在 `Java 8` 版本中，有如此创新。


    我们（苹果）关心 Java 并花费了大量时间在上面工作。这是正确的方法。其他公司也应该这样做。如果 Java 是一项新技术，那么他们会充分利用它，但事实并非如此。它是一项老技术，人们需要理解，我们不会因为你开始使用
    Java 就死去。


    ## 人如何轻松地从 Java 切换到其他语言？


    不同的语言解决不同的问题。Java 解决了为程序员（以及在未来的某一个工业家）为计算机运行计算机、编程计算机的问题。如果你能解决一个问题，那是一个很高的标准，如果有人能解决它，为什么不交给他们呢？


    很多成为开发者的用户无法解决系统编程的问题。这就是像 `Clojure` 和 `F#` 这样的动态语言大显身手的地方。像 `Rust` 和 `Go` 这样的语言也可以上用场。从一种语言切换到另一种解决特定问题的语言很容易。


    我没有看到任何语言可以用来编写大型、复杂的数据驱动的系统。因为发生的事情实在太多了。如果你问一个 Java 开发者“Java、`C++` 和 `.Net`
    之间有什么区别？”


    大多数人说 Java 是一种糟糕的语言，但他们说的另一点是它是强大的。


    ## 你认为从其他语言转到 Java 时，最重要的学习内容是什么？


    首先，这关乎心态。你必须理解在 Java 中编写程序实际上非常简单。你不需要担心内存管理，不需要担心我是否会对这些东西做某些愚蠢的事导致内存泄漏。你有一堆论据，你只需要说“这就是这样做的方法”。这就是
    Java 能够做到它的力量所在。


    但这不仅仅关乎 Java，还关乎你的心态以及你处理问题的方式。仅仅知道写 Java 代码是不够的。你必须理解如何处理它的困难部分。例如，为什么我不在乎缓存安全？如果我桌上有十个对象，我想如何处理它们？我不可能担心内存泄漏。


    但这不仅仅关乎 Java，还关乎你的心态以及你处理问题的方式。仅仅知道写 Java 代码是不够的。你必须理解如何处理它的困难部分。例如，为什么我不在乎缓存安全？如果我桌上有十个对象，我想如何处理它们？我不可能担心内存泄漏。

