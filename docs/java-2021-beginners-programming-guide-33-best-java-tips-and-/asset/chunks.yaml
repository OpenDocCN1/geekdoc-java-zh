    Optional instances represent an arbitrary type parameterized by a set of optional
    type parameters. For example, a Tuple[A, B] instance, a class with a C# standard
    set of optional type parameters, could be constructed like this:


    ●     Optional<A, B> Tuple<A, B>(A a, B b)


