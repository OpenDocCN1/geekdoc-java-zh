    所以你已经了解模式匹配是如何运作的。问题是，有时候你必须进行极其巨大的、极其巨大的类型检查，并且你需要开始对所有内容进行标注，这会让它变得非常脆弱。如果你使用模式匹配，就不需要标注所有内容，只需要标注部分内容。所以当你说对元组进行匹配（matches
    on tuples）时，我们只需要说这部分匹配元组，而那部分不匹配。现在我们可以有一个类型检查器，它说：“这是一个情况，其中部分是某种情况”。这使得类型检查变得容易得多。


    例如，我有时想将对象放入数组中，这些数组将以分布式的方式在内存中保留。我想能够将任何类型放入一个哈希（hash）中，这是我管理它并放入这个数组的方法。这正是我之前尝试解决的问题。现在我可以使用这种模式匹配来实现，通过这种方式，我只需要对这些情况以及相关的案例进行标注。所以你不需要到处都有这个巨大的巨大的类型检查器。你只需要这个小小的模式检查器。但另一点是，在类型检查中，你拥有整个库，然后你有一个用于模式匹配的单一类。在模式匹配中你是无法做到这一点的。你不能说：“噢，好的。我有这个方法来匹配这个模式，它只能匹配系统的这部分。”如果你使用模式匹配，你只能匹配系统的这部分，而这是你唯一需要检查的情况。


    所以它也很有用，因为当你有这些大型类型检查时，当你有这些要传输传输的类型检查时，我也发现这种匹配（matching）很有用。这算是一个独立的问题。我甚至不会告诉你们如何进行模式匹配，但这也是另一种方法。我认为它也符合我正在讨论的模型，即我们处理了大量的对象层级结构，而人们很容易忘记某一层或某一层，从而退回到类型检查中。


    ## 使用 WSDL 进行验证


    所以在你编写库之前，在系统中有一个签名（signature）或一个验证器（validator）是一个好主意。我们有了这些 `WSDLs`，它们会告诉你你的库的文档将是什么样子的，这让你非常容易地清楚你将拥有哪些文档，对用户会有什么要求。我认为这是一个好主意。然后我使用该签名的方法是为单个模式构建一个语法（grammar），然后你可以定义什么是实现，如果如果你想具体地验证你的库，可以使用
    `lexer`（词法分析器）或 `parser`（解析器）来实现。


    ## 脸 vs. 可扩展标记语言


    我认为这有很多应用。例如，也许你有一个巨大的代码库，你想摆弃某种语言，只想使用 `HTML` 标记。你可以这样做，这正是我们在 `blog` 包中所做的。但大问题是，你必须确保对你使用的每段代码都有语法高亮。而且当你这么做时，你必须确保使用这个库的人习惯于看到
    `HTML`。但你可以这样做，你可以拥有语法高亮，但如果你在实际代码中使用那种标记，那么它会非常困惑。所以为了给你的代码使用这种标记，是的，这也是一个好主意。


    我已经这样做了。然后我使用了这个想法：每次你使用正则表达式时我都更改它。我会对其进行标记，然后不断地改变它。这确实是个好主意。所以你在编写代码时，不必受限于你拥有的正则表达式。这也有许多不同的应用。我现在不想深入讨论，因为我们还有演讲，但我认为这是一个非常好的方法。


    实际上，只要看那种类型的签名，你可能已经注意到在库中没有从文件读取的特殊类型。但现实中，人们确实会从文件中读取，所以你必须为此包含某种程序包。或者你可能正在使用
    `sockets`，而且你频繁使用 `sockets`，所以你必须包含一个 `socket` 包。我认为拥有这些对这类内容提供额外支持的包也是一个好主意。


    ## 现实世界的工具


    这是另一个我考虑很多类型签名的情况。我经常使用某些功能，我使用的签名类型是找到一个数字，然后我知道答案是什么，因为我得到了数字以及我所需的规范，或者我得到了数字并确切知道我该做什么。当你在大型代码库上工作时，那种签名通常运行得很好，人们通常会使用它们。所以你可以为此准备一个特殊类型，那是一个函数的模式。比方你有一个想要打开的文件，你可以放置类似
    `file open` 的内容。那个包应该包含该函数的签名，然后当有人要读取那个文件时，他们就知道答案是什么。他们可以针对具有相似签名的文件运行它。你有一个具有不同签名的文件，你可以使用它，你只需要获取那种签名，并在你的代码中使用它。


    但现实世界并非如此。在现实世界中，你必须确保人们使用这段代码，然后你还必须确保测试了这段代码，用真实的人测试这段代码，用真实的代码库测试这段代码。所以你必须更加灵活，并且对类型可能要更加小心，因为你不想破坏人们正在使用的类型。因此在现实世界中，拥有一个更灵活的类型系统也是一个好主意。


    更灵活的类型系统意味着你可以创建更多使用不同类型函数的情况，这可能让他们更容易知道预期。但同时，你也可以让某人使用的真实函数变得更复杂，这样他们可以更确定他们得到的是他们应该得到的。所以你可以通过类型系统实现这一点，也可以通过其他限制人们访问特定功能的方法来实现这一点。我不会在这次演讲中讨论那个。

