    不是。Java EE 6 中的 `JavaServer` 接口具有与 Java EE 5 相同的功能。它没有影响接口的语义，因此仍然可以从 Java EE
    5 和 Java EE 6 访问这些方法。


    ### Java EE 6 是否规定了 J2EE 代码的编译和运行方式？


    不是。Java EE 6 中的 `JavaServer` 实现接口不会影响 J2EE 代码的编译或执行行为。


    ### 是否可以在基于 J2EE 的配置中部署 Java EE 6 应用程序？


    可以的。`JavaServer` 和 `JavaServerBase` 实现具有两个完全不同的定义。`JavaServer` 接口不会影响 `JavaServer`
    实现的行为。然而，`JavaServer` 实现也能够运行和配置其他服务器实现。


    这些其他服务器实现可以在 `java.net` 命名空间中找到。它们被包含在 `JavaServer` 实现命名空间中，是因为它们是用 Java 实现的。


    此外，J2EE 的当前版本（`J2EE 1.5`）是 `JavaServer` 接口的一个独立实现。它与 Java EE 6 完全不冲突。从 J2EE 1.5
    开始，`J2EE 1.5` 实现对 `JavaServer` 接口的定义不同。它定义了 `java.net.Server` 接口。定义此接口是为了允许 J2EE
    实现独立开发，并允许不同的 `JavaServer` 接口实现部署在同一个环境中。


    Java EE 6 提供了一种配置 J2EE 服务器以用于 Java EE 6 应用程序的方法。此功能被称为“运行时组件配置”。


    在 J2EE 1.5 中，按照 Java EE 5 定义的 `JavaServer` 实现对 Java EE 6 中定义的 `JavaServer` 实现没有任何影响。


    因此，Java EE 6 中定义的 `JavaServer` 实现不必与 `J2EE 1.5` 的实现相同。


    在 J2EE 1.5 中，`JavaServer` 接口是一个 `JavaInterfaces` 接口。该接口在 Java EE 5 中并不存在。在 Java
    EE 6 中，该接口现在是一个 `JavaServer` 实现接口。因此，可以配置 `JavaServer` 实现以部署到 Java EE 6。


    在实现 `JavaServer` 实现时，人们可以选择使用 `JavaServer` 接口的独立实现，例如 `java.net` 命名空间中的 `JavaServer`
    实现，而不是定义 `java.net` 命名空间接口。然而，`JavaServer` 实现接口不包含命名空间属性。如果容器创建一个新的 `JavaServer`
    实现，它不必与现有的 `JavaServer` 实现相同。


    例如，假设容器创建了一个名为 `jcloud-1` 的容器。


    在该容器被创建后，可以将一个名为 `jcloud-1` 的 `java.net` 命名空间容器添加到不同的 `java.net` 命名空间中。然后，容器 `jcloud-1`
    可以在不同的命名空间上使用不同的 `java.net` 命名空间接口，创建一个名为 `java.net.Server` 的 `JavaServer` 实现。


    如果这是 `JavaServer` 实现中的唯一实现，那么这将是为容器 `jcloud-1` 配置的唯一（唯一的） `java.net` 命名空间。然而，如果这是
    `JavaServer` 实现中的唯一实现，人们不需要显式地在 `java.net` 命名空间中创建一个额外的 `jcloud-1`。`java.net`
    命名空间中的 `JavaServer` 实现已经可以创建，但人们必须显式地这样做，而不是简单地添加一个 `java.net` 命名空间。如果这是 `JavaServer`
    接口的唯一实现，就可以在 `java.net` 命名空间中创建一个 `jcloud-1`并在 `jcloud-1` 对象上调用 `addJcloud` 函数，从而在
    `java.net` 命名空间中创建 `JavaServer` 实现 `jcloud-1`。这对于 `java.net` 命名空间中的所有容器都是可能的。但这对于容器
    `jcloud-1` 是可能的。这种功能被称为“运行时组件配置”。


    有两种不同的运行时组件配置方法。基于现有应用程序的运行时组件配置可以用于与应用程序相同的环境。这种方法被称为“基于现有应用程序的运行时组件配置”。


    基于组件注册的运行时组件配置在组件注册后无法修改。这种方法被称为“基于组件注册的运行时组件配置”。


    在静态运行时组件配置方法中，应用程序产生一个应用程序包（指定 `JavaServer` 接口）以及一个组件注册表（其中有一组注册在组件注册表中的应用程序类）。当容器添加基于现有应用程序的静态运行时组件配置时，可以将应用程序和注册表作为应用程序添加：


    * 应用程序包指定了 `JavaServer` 实现，

    * 应用程序指定了 `java.net.Server` 接口，

    * 应用程序中配置了 `java.net` 命名空间，

    * 应用程序中再次配置了 `java.net` 命名空间，

    * 注册表有一组注册在组件注册表中的应用程序类，

    * 组件注册表指定了 `JavaServer` 接口，

    * 注册表中配置了 `java.net` 命名空间，

    * 组件注册表指定了 `java.net` 命名空间，

    * 应用程序包指定了组件注册表，

    * 应用程序中配置了 `java.net` 命名空间。

    * 应用程序包不包含 `java.net` 命名空间。


    容器添加基于现有应用程序的静态运行时组件配置，在基于现有应用程序的运行时组件配置中，可以实现以下内容：


    * 一个包含容器的运行时组件注册，

    * 容器 `jcloud-1` 中的 `JavaServer` 实现，

    * 以及基于现有应用程序的运行时组件配置中的 `java.net` 命名空间。


    基于现有应用程序的运行时组件配置可以用于与应用程序相同的环境，也可以与之不同。基于现有应用程序的运行时组件配置包含虚拟部分，这意味着基于现有应用程序的运行时组件配置中的虚拟部分不起作用。基于现有应用程序的运行时组件配置包含
    `jcloud`，这意味着可以使用现有应用程序创建云。例如，在虚拟主机实现中（服务器和 Web 服务器），这等同于包含虚拟部分的现有应用程序运行时组件配置。如果应用程序包是虚拟主机，这等同于包含
    `jcloud` 的现有应用程序运行时组件配置。


    这种方法也可以用于静态运行时组件配置，由服务器和 Web 服务器组成，但没有注册表。


    这种方法不支持以下内容：


    1. 静态应用程序组件，因为包需要从 Java 代码手动构建。

    2. 动态组件，因为静态组件需要手动从服务器添加到注册表中。


    这里有多个框架可以使用这种方法，包括：


    * TailorMade,

    * BeaBox,

    * BeaSOFT,

    * BAOF,

    * BeaWSOFT,

    * 领域特定语言


