    Microsoft Visual JScript 编译器的主要缺点是它没有集成版本的 .NET 框架，因此你无法使用 `Mono` 中提供的所有内置 `.NET`
    API。在当今时代，这并不算糟糕，因为大多数 API 对于 Microsoft Visual JScript 编译器来说都是可用的，这让你能够使用更多标准的
    `.NET` 库。但如果你有更大的雄心勃勃，想要使用 Microsoft Visual JScript 编译器中未包含的 `.NET` API，你就必须使用
    Microsoft Visual Studio 2005 或 2008 版本，这些版本在开发和部署上要稍微复杂一些。


    Microsoft Visual JScript 编译器和 Microsoft Visual Studio 2005 版本的 `.NET` 框架都内置了 Java
    运行时库，并支持 `C++`，而且这仅仅是基于 Windows 的。但也有适用于 `Linux` 和 `OS X` 的版本可以在 `Wine` 软件模拟器下运行。这些版本的构建和部署要稍微复杂一些，但它们拥有所有的标准库以及一些针对特定平台的额外库。


    另一方面，Microsoft Visual Studio 2005 版本的 `.NET` 框架确实需要一些重量级的 Java 代码。你必须手动为各种平台编译代码（包含一些适用于
    `Windows` 和 `OS X` 的库），然后运行。这就是为什么 Visual Studio 2005 版本的 `.NET` 框架对于大多数 Windows
    开发者来说并不是一个选择。


    最佳选择取决于你正在开发的应用程序类型。如果你有一个基于服务器的应用或桌面应用，Microsoft Visual JScript 编译器的效果非常好，它可能可能是最好的选择。但如果你正在开发一个比
    Visual JScript 编译器能提供更多功能的桌面应用或基于服务器的应用，你可能想查看一下 `.NET` 框架。


    ## 选择合适的编辑器


    选择要使用的哪种 `IDE` 有一些原因。首先，最重要的是，你需要确保它是高效的。如果不选择正确的编辑器，你就无法构建出一个高效的工作环境。


    选择一个良好的 `IDE` 的另一个原因是它的易学性。通过 Windows 版本的 Visual Studio，你将可以使用 Windows Visual
    Studio `IDE`，这意味着你可以与你开发团队的其他成员在相同的环境中学习它。这使得学习变得容易得多。


    相比之下，Visual Studio 软件为 `Mac` 和 `Linux` 提供了集成开发环境（但 `Mac` 版本中不支持 `Linux`）。`.NET`
    框架的 Linux 版本支持带有 `Mono` 开发包的 `Eclipse`，但你必须迁移你的代码来使用它。


    拥有集成开发环境会让学习语言变得更容易。例如，如果你通过 `IntelliJ` 学习 `Java`，那么你可以很容易地过渡到使用 Visual Studio。相反，如果你通过
    `Eclipse` 学习 `C#`，那么你就必须在不同的 `IDE` 中学习它，这会让学习过程变得困难得多。


    选择正确的 `IDE` 可能是你作为软件开发者所做出的最重要的决定之一。毕竟，学习编程的方式是你创建软件的最重要因素之一。


    ## Java 语言的优势是什么？


    与其他编程语言相比，`Java` 语言具有许多优势，包括：


    -   **一致性**。每个 `Java` 程序都可以编译成相同的字节码。这允许人们以这种方式编写程序，使得每个运行的程序看起来都一样。虽然每个 `Java`
    程序也可以被即时解释，但其性能更为局限。

    -   **硬件赋能**。由于 `Java` 虚拟机被编译为 `Java` 字节码，`JVM` 可以运行所有所有支持的处理器。

    -   **打包应用开发**。与其他编程语言不同，`Java` 程序的编写方式可以使整个程序被打包、放入磁盘并进行部署。这显著缩短了部署和生产所需的时间。

    -   **编译器即代码**。`Java` 程序被编译成机器码（通常是某种指令集架构的变体），然后由计算机执行。这避免了在运行时重写代码的需求。


    在使用 `Java` 时，某些优势只有通过使用 `JVM` 才能实现。好消息是，通过 `JVM` 可以提高应用程序的性能。


    ## Java 语言的缺点是什么？


    使用 `Java` 有许多缺点。一个缺点是许多开发者认为它是一门复杂的语言。另一个缺点是它比其他编程语言更消耗内存。


    这意味着即使应用程序使用的内存较少，也可能会产生性能影响。更重要的是，如果应用程序加载时间过长或发生冻结，将影响用户体验。


    一个不经常移动或变化的应用程序将获得更好的用户体验。使用 `Java` 的一个良好例子是 `Yahoo! Finance`。


    如果你是一家企业或能够证明你是一家企业，你可以使用替代的编程语言，例如 `PHP`。


    ## Oracle Digital Cloud Office 中可以使用哪些编程语言？


    现在我们已经了解了 Oracle Digital Cloud Office 的一切，你也应该意识到可以使用的不同编程语言。以下是在 Oracle Digital
    Cloud Office 中可以使用语言。


    -   `Apache Flex` 是一个 Oracle 软件库，旨在帮助移动开发者创建桌面和移动应用，将 `HTML5` 的最佳功能与 `Java` 的组件相结合。

    -   `OpenJDK` 是基于标准 `Java` 虚拟机 (`JVM`) 的 `Java` 实现。

    -   `PHP` 是一种用于软件开发的通用编程语言。`PHP` 替代了旧的 `Java`、`.NET` 和 `C++`。

    -   `Clojure` 是一种类 Lisp 的函数式编程语言，允许开发者构建像命令式语言一样灵活的数据结构。

    -   `Fortran` 是一种通用计算机编程语言。它是 `BASIC` 的后代，最早于 1958 年。

    -   `Erlang` 是一种通用多语言编程语言，源自 1968 年利日大学开发的 `ALGOL` 编译器。

    -   `Tcl` 是一种简洁的壳脚本语言。

    -   `Apache Storm` 是一种包含分布式事件驱动架构的开源分布式处理框架。它在商品服务器集群上运行。

    -   `Apache Drill` 是一种开源分布式处理框架。它允许开发者部署微服务分布式应用程序。

    -   `Swing` 是一套 `Java` 编码标准、惯例和实践。它提供了一个业务逻辑与展示分离的系统框架。


    ## 如何 Oracle Digital Cloud Office 中安装 Java？


    我们最后需要讨论如何在 Oracle Digital Cloud Office 中安装 `Java`。


    安装 `Java` 的简单方法是使用 `Oracle Java SE Platform Enterprise Edition (Java SE)`。它是与
    `Oracle Database`、`Oracle WebLogic Server` 以及 `Oracle Community Technology Preview
    (CTP)` 版本相同的代码。


    如果你在使用 `Oracle Community Technology Preview`，你需要使用旧版本的 `Java`。如果你使用的是 `Oracle
    Community Technology Preview`4 或更高版本，你需要 `Oracle Java SE Platform Enterprise Edition
    (Java SE)`。


    由于不受 Oracle 支持，这个安装过程稍微麻烦。要安装 `Oracle Java SE`，你需要从 Oracle 网站下载它，然后点击 `Install`
    按钮。一旦 `Oracle Java SE` 安装完成，你的站点就可以运行了。


