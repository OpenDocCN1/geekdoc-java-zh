    `Optional` 类是 `Option[T]` 的完全替代方案，后者是 C# 中 `Option[T]` 的对应物。与 `Option[T]` 类似，如果给定值为
    `Nullable[T]`，则 `Optional.isEmpty()` 返回 false；如果给定值为 `Label`，则返回 true。注意，使用 `Optional`
    后，隐式空引用问题不再是一个问题。


    因此，在 `Option[T]` 中可能返回 false 的方法（例如 `List.empty()`），在 `Optional[T]` 中也返回 false：


    ```java

    List possibleLocations = new ArrayList < String>(); possibleLocations[0] = Optional.ofEmpty();
    for ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]
    = List.ofNullable(new ArrayList < String>()); }

    ```


    `Optional[T]` 实例像 `Option[T]` 实例一样，可以通过 `Optional.withValue()` 请求包含一个值，如下：


    ```java

    List possibleLocations = Optional.withValue("Field1"); for ( int i = 0 ; i < possibleLocations.
    length ; ++ i ) { possibleLocations[i] = Optional.withValue(new String("Field1"))
    ; }

    ```


    要构造一个派生的 `Optional` 实例，首先通过 `Optional.ofType(Optional.ofType(String))` 构建字段类型。


    * `Optional.withValue(m -> m.getType() == Optional.ofType(Unknown))` 将值 `m` 转换为
    `Optional[m]` 实例。

    * `Optional.withValue(d -> d.getType() == Optional.ofType(Unknown))` 将值 `d` 转换为
    `Optional[d]` 实例。

    * `Optional.withValue(m -> m.getType() == Optional.ofType(Unknown))` 将值 `m` 转换为
    `Nullable[m]` 实例。

    * `Optional.withValue(d -> d.getType() == Optional.ofType(Unknown))` 将值 `d` 转换为
    `Optional[d]` 实例。

    * `Optional.withValue(null -> d.getType() == Nullable.ofType(Unknown))` 将值 `d`
    转换为 `Nullable[null]` 实例。

    * `Optional.withValue(null -> d.getType() == null)` 将值 `d` 转换为 `Optional[null]`
    实例。

    * `Optional.withValue(d -> d.getType() == Nullable.ofType(Unknown))` 将值 `d` 转换为
    `Label[d]` 实例。

    * `Optional.withValue(null -> d.getType() == None)` 将值 `d` 转换为 `Label[None]` 实例。

    * `Optional.withValue(null -> d.getType() == Maybe.ofType(Unknown))` 将值 `d` 转换为
    `Label[Maybe.ofType(Unknown)]` 实例。

    * `Optional.withValue(d -> d.getType() == Maybe.ofType(Unknown))` 将值 `d` 转换为 `Label[Maybe.ofType(Unknown)]`
    实例。


    依此类推。


    `Optional` 实例表示由一组可选类型参数参数化的任意类型。例如，一个 `Tuple[A, B]` 实例（一个具有 C# 标准可选类型参数集合的类）可以这样构造：


    ```java

    Optional<A, B> Tuple<A, B>(A a, B b)

    ```


    另一个例子是 `String<A>`，或者一个没有被标准可选类型参数集引用、但被 Mono 支持的可选类型参数的类：


    ```java

    Optional<Class, int> S(int a, int b)

    ```


    这些类型是强类型的。如果构造函数的类型参数被推断为可选类型参数，则带有可选类型参数和隐式方法引用的构造函数将使用可选类型参数的值构造一个 `Optional`
    实例（在这种情况下，是实际类型参数，而不是 `Optional` 类型）。


    对于实际构造函数，类型参数（根据构造函数的声明或可选类型的定义）被推断为 `Optional` 类型的类型参数。可选类型参数的值被用作默认值。


    在函数的情况下，可选类型参数的值也用作默认值（如上所示）。这种用法类似于 Java 中的静态方法或静态字段，或者 C++ 中的静态成员。


    当类必须为构造函数指定可选类型参数时，还会推断出一个隐式类型参数来指定构造函数的类型参数类型。


    没有可选类型参数的构造函数并不要求构造 `Optional` 实例。如果需要可选类型参数，则不允许存在没有非可选类型参数的构造函数。这被称为显式构造函数。


    注意，类中未被可选类型参数引用的成员默认是强制的。如果其中一个强制成员不是可选类型参数，则它的默认值必须是一个 `Optional` 实例。（尽管，这将在系列的第一点中发生。）


    `Optional` 类型不仅用于构造类型；它们还实现了其他操作。


    带有显式类型参数的构造函数称为隐式构造函数。当构造函数是隐式的时，其默认值是非可选类型参数的参数类型。例如，对于一个具有 `int` 和 `char` 类型的类
    `C`，构造函数如下隐式实例化：


    ```java

    int C(int a)

    ```


    * `Constructor.withType(Tuple<C, Tuple<int>, string>)` 构造 `Tuple<Tuple<Tuple<int>,
    string>>` 元组，并返回类型 `tuple`。


    隐式方法称为隐式方法。在可选类型上调用隐式方法：


    ```java

    Constructor.withType(Tuple<C, Tuple<int>, string>)

    ```


    ```java

    int C(int a)

    ```


