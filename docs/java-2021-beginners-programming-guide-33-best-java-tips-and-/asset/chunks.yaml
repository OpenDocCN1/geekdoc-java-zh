    如果你选择 `java.jdbcCache` 目录，那么你就能导航到 `jdbcCache` 目录，并且拥有一个名为 `jdbcCache` 的目录。如果你选择
    `java.jdbc.Cache` 目录，那么你拥有一个名为 `jdbcCache.` 的目录。如果你选择 `java.jdbc.HttpConfig` 目录，那么你拥有一个名为
    `jdbcCache.` 的目录。


    所以对于我们即将处理的这个特定的 Java 应用程序，我们尝试让这个 JRE Cache 文件存储在 `jdbcCache` 目录下的 `jdbcCache`
    目录中。


    然而，在这样做之前，我们需要在我们正在处理的 `application` 目录下放置一些 Java 文件。因此，我们将点击终端窗口中的第二个标签页，然后点击第三个标签页。这将位于名为
    `assets.` 的文件夹中。在这个文件夹中，我们可以找到两个文件，并将它们拖入工作区目录的终端窗口中。


    ## 什么是 Java 框架？


    如果你习惯于使用框架（从定义上来说，大多数 Java 开发者都是如此），请阅读这关于关于框架及其本质的文章。框架的设计是为了帮助你使用通用功能，这些功能可以包含在代码库中，也可以为了开发而提取出来。


    你可能会认为，如果你的应用程序完全由框架组成（几乎类似于 JavaScript 中的库），你应该编写自己的代码，而完全不需要担心框架。如果你遵循微服务的指南，这就是正确的，因为这正是现代代码库应该有的样子。你编写代码，而框架只为你提供它的静态部分。


    但如果你想，例如编写一个可以在浏览器中运行的嵌入式服务器，或者只是一个暴露静态路由供客户端加载/列出你的 RESTful API 的 Web API，那么完全没有理由将你的代码考虑为某些底层框架的实现。你可以直接用纯
    Java 编写应用程序，框架会为你完成额外的工作。


    正是这种灵活性让框架变得令人头疼。你可能认为框架为代码增加的工作是为你完成的。但事实是，大多数框架的设计方式要求你以一种特定的方式来思考你所编写的代码。框架改变了你思考应用程序构建的方式。你不希望破坏你的结构，因为那会导致混乱。


    举个快速的例子：要在你的 Java Web 应用程序中使用 JSF，你必须使用注解来指定 Java 对象应该如何渲染。


    你需要这个注解，并且应该始终使用它。它会隐藏你的代码，并让不熟悉 JSF 的开发者清楚地知道这个类应该命名为 `MyPresenter`，并且它的 `primary()`
    方法应该被命名为 `schedule()`。


    ## 框架设计考虑


    现在我们解决了语义问题，让我们来谈论使得在 Java 中编写框架可能的设计选择。我在这里列出了其中几个，然后我尝试帮助你理解框架中包含的内容。


    ## 美学与语法


    框架之所以糟糕，是因为它们看起来很难看。它们看起来像是回到了一个一切使用 XML 文件存储数据的世界。当你编写一个作为服务运行的脚本时，这可能看起来并不糟糕，但当你开始编写像
    Spring MVC 框架这样的东西时，你会开始讨厌它。你想要向你构建应用程序的平台靠拢，但由于你正在编写一个框架，你的 MVC 代码需要遵守该框架的所有语法规范，以便让它看起来美观。


    我之前说过框架糟糕是因为它们看起来很难看，但糟糕的部分并不是它看起来丑，而是一切都必须看起来美观，这增加了项目的复杂性。当你开始向系统中添加更多依赖和类时，你如何保持系统的模块化？你被迫将越来越多的纯洁、模块化的部分混合在一起以组成一个整体，这种垂直分离程度非常令人恼。


    当你尝试编写纯 Java 框架时，也会发生同样。你不仅需要将代码封装在 Java 和 Scala 的特殊混合中以表现得像真正的框架，你还需要提供必要的库让框架理解它。例如，`javax.faces`
    应该是 Spring MVC 的核心库，但你不能将其作为项目的依赖提供。


    它和 XML 配置文件有相同的原因：它看起来和行为上应该像是设计为代码库的一部分的。你不想把它隐藏在某人找不到的地方，即使这有助于你增加它的模块化。所以你最终创建了一个巨大的类，带有一组抽象的
    API，只有具备框架工作知识的开发者才能使用。


    相比之下，Java 没有这个问题。一个想要使用设计为项目一部分的纯 Java 库的程序员可以直接使用它，而无需担心框架。Spring MVC 是一个 Java
    库，而不是框架。它是开始 Web 开发的好地方，因为它提供的所有抽象都是纯 Java 的，不需要担心注解以及何时使用它们。Scala 团队从中吸了教训，开发了
    Typesafe Scala，它和 `javax.faces` 一样，是一个 Java 库。


    ## Scala 和 MVC


    使用 Scala 的最大优势是它从底层开始为 MVC 提供了框架。它是一种纯函数式语言，提供了原语和过程化抽象，从底层为你提供框架，而不需要额外的依赖。你只需要专注于你的应用程序，并在本地
    IDE 中进行所有重构。通过使用 `val` 等概念，有一些技巧可以让代码更具模块化。然而，纯 Java 的实现仍然提供了所有功能，而且毫无头疼。


    至于 MVC 框架的其他部分，Spring 和 MVC 只是另一个 Java 库。它们有很多相似之处。Spring MVC 基于 JPA 框架，JPA 最近用
    Scala 重写了，可以提供比 Java 更具声明性的 API。JPA 允许系统根据实体对象中声明的列来解析列和列集。


    从 Scala 提供的函数式编程概念来看，它可以被视为 Scala 语言的泛化。语言本身没有根本变化，它提供了库来实现命令式概念，如 setter、谓词等。然而，堆栈中添加的每一层都会为代码增加抽象和功能性元素。因此，用功能概念扩展应用程序的主要方法是在现有的
    Java 应用程序中使用 Scala 代码。

