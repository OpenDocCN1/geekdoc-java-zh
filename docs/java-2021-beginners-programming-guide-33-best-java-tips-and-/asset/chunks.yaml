    我目前正在使用的这个 Erlang 版本可能会包含一个支持列表函数和其他形式的偏应用函数的 API。所以你可能能理解为什么在 Erlang 中你应该使用命令式编程而不是函数式编程。函数式编程比命令式编程容易理解得多，但当你处理使用标准库的关键系统时，可能很难考虑到所有可用的选项型，以及如何将它们应用到你的问题中。而且，如果你处理的是关键系统，你可能根本不想去考虑这些。


    ## 命令式编程与排版（Typesetting）


    在我看来，使用命令式编程的另一个好理由是，它允许你进行一种被称为“排版”（typesetting）的操作。你以某种方式编写程序，使其能够被编译，并被转换成一种可读的方式。Erlang
    中有不同层级的排版，例如，编译器可以自动将你的程序转换为函数式语言。然后，你程序的不同部分（如方法），你可以用函数式语言来编写。


    对于 `Java`、`C++` 或任何其他你可能使用的语言也是如此。编译器会识别出它是一门语言，并且程序的部分部分将在命令式语言中执行，而程序的其余部分将在函数式语言中执行。这就是动态类型编程。


    ## 动态翻译（Dynamic Translation）


    你编写程序的方式使其能够被动态地翻译。也就是说，如果你用函数式语言编写了一个程序，并想在其中放入一些数据（比如一个或两个函数），那么这些数据将被自动转换为命令式语句或命令式数据结构，这样你就可以将它们插入程序的中间，看看会发生什么。然后当你运行程序时，你可以获得你放入的那些数据产生的结果。


    所以如果你不怕动态排版，那么你可能应该考虑使用 Erlang，你的编程风格可能会发生一点变化。但你看不出来，因为你只是盯着屏幕看。


    ## Erlang 中的分布式计算


    我要给出的最后一个例子之一是关于分布式计算的，即你有多个节点在相互作用。这与细胞自动机在分布式计算中使用的范式非常相似，因为在 Erlang 中，每个进程都必须与它有访问权限的所有其他进程进行通信。这非常酷。


    这是一种全局的、分布式的并行计算模型，进程之间的通信可以在多个不同的层次进行。每个进程都可以访问它有权的所有进程，在每个通信层级上，都有被称为 `message`（消息）的东西，而这个
    `message` 就是发送和接收数据的媒介。


    例如，你可能在运行 Erlang 的同一台机器上有一个进程，它有两个不同的邮件列表，或者可能有一个邮件列表。它们都可以发送邮件或互相回复。你可以做很多事情。你可以建立分布式处理，这很棒。


    你所拥有的、但许多其他语言不具备的功能之一，就是进程之间的通信。要以分布的方式编写程序，你必须学习如何以分布的方式编写程序。因此在上一个例子中，你必须学习如何编写分布式的
    Erlang。


    ## 分布式类型系统（Distributed Type Systems）


    你拥有的其他东西之一是分布式类型系统。Erlang 中的类型系统不仅仅是静态类型检查；它不仅仅是对标量进行静态类型检查。它也是动态类型化的。


    换句话说，如果我写了一个程序并把它交给编译器，编译器会自动识别出我提供给编译器的代码必须能够处理该程序运行在一个互连的节点集群中的事实，并且节点之间正在相互通信。编译器必须知道如何识别这些节点何时接收到集群一部分节点发送的
    `messages`。因此，也存在分布式类型系统。


    通过分布式类型系统可以实现的酷点之一是对 Erlang 节点的动态类型检查。所以如果我熟悉我语言中的某种类型系统，并且我想要一个分布式类型系统，酷的地方在于我不需要做任何特殊处理。因为如果我有一个类型系统，并且我可以与分布式类型系统通信，我可以向分布式类型系统发送消息。它会对我给它的代码进行类型检查。所以这非常酷。


    拥有分布式类型系统的另一个酷点是，如果存在一种分布式类型系统无法处理或不知道如何处理的类型，它会为你提供一些帮助。所以如果进来一个分布式类型系统尚未处理过的
    `message`，那么这个 `message` 将为你提供一个提示，告诉该如何处理该 `message`，而且它会在你不需要阅读该 `message` 代码的情况下完成这一点。


    这就是 Erlang 的另一个酷之处。当涉及到这些分布式类型系统时，它不仅仅是分布式类型系统；它还是分布式类型检查。所以如果你写了具有正确类型签名的代码并将并将代码发送到分布式类型系统，那么分布式类型系统提供的类型检查器将验证代码，但它不会自动对代码进行类型检查。它只会告诉你类型是什么以及它们来自何处。当你阅读代码时，你就会知道类型是什么。


    很棒的一点是这些分布式类型系统确实存在。当你熟悉它们时，可以去了解。它们正在被构建中。所以我有一个开发这些系统的 IRC 频道，还有一个供开发人员讨论的邮件列表。所以未来充满了与
    Erlang 协作的分布式类型系统。


    ## 通信协议（Communication Protocols）


    这些都很有趣。但这里有一个问题。我正在构建一个分布式类型系统，而 Erlang 是一种分布式语言。那么我如何与我的类型系统通信呢？


    Erlang 确实拥有一种协议。它被称为 `SIGTERM`。它非常简单。它说：“离开一会儿，因为你将被阻塞一段时间。”但它也有其他复杂的协议。其中之一是
    `SIGQUIT`，当你对任何类型调用系统方法时，它会弹出该类型，然后告诉你该类型已经弹出。仅此而已。

    '
- fmt: '

    So this has some serious problems. So the first problem is that if you have too
    many parameters in your system call, then when the type checker is getting to
    the message, it has to look for the parameters. So it has to check all of the
    parameters that are in the system call to see if it can find them. And then it
    has to look for the parameters in the message and find out if it can find them.
    So if you have a long system call, it’ll just be completely jammed. It won’t know
    where to look, because it has to check the whole system call before it can find
    the parameters. And it won’t look for the parameters in the message, because it
    can’t find them, and it can’t emit the message until it finds them.


    And the second problem is that it will emit the message even if you call `SIGQUIT`
    and use `SIGTERM` on it. So if you have a long system call, you’ll get another
    message back that says, “The type checker is trying to emit a message. It can’t
    find it, but please let it emit it.” And this means that for really long system
    calls, you have to run the entire system call again. You’ll get two messages.
    One saying “No, no, no, no, no, no, no, no, no,” and one saying, “Let it emit
    it.” So it’s not a good idea to do this.


    So these problems, we found, are hard to solve. And the way that we solved them
    was by changing the system call that handles the type checker. So the code that
    handles the type checker, the block system call, was rewritten to use a different
    system call, which just has a different set of parameters. It has a little simpler
    set of parameters. So it’s saying, “I’m not going to find the parameters, and
    I’m not going to try to emit the message.” But the reason that you’re not allowed
    to do that is that it will cause a memory leak. The storage that the type checker
    is using just cannot fit into your process’s memory. So if you want to use the
    type checker, then you’ll have to be sure that you’re only sending it data that
    is in a structure that will fit in the space that the type checker is using. So
    that’s why you can’t do that.


    Then when you get a new type, that is a really big type, then you just have to
    say, “Look, I’m done. I’m going to need to unpack the structure to see what the
    type is.” And then you can emit it. It’s still a memory leak, but at least it’s
    not a huge memory leak.


    So that was the other major improvement that we made for making that new type
    of system a lot better.


    ## Responsibilities of the Type System


    So you have a lot of responsibilities, including some of the problems with the
    type checker. So you have, of course, the normal responsibilities that all the
    people on a type system have. So you have to keep the type system secure. You
    have to keep it from all kinds of attacks, from any kind of impostors or impersonators.
    And there’s a lot of things that you need to do to make that secure. So one of
    the things that you have to do is to have somebody put in some work to be able
    to call your type system.


    But there’s another part of your responsibility, which is that you’re also responsible
    for trying to protect people from themselves, trying to help them to write better
    programs. So this is going to get even harder than the problem of giving up your
    code because people will often be trying to write better programs than they can.
    So a lot of times, you can’t do a lot of the things you’d like to do. So this
    is a bit of a tradeoff.


    I’ve already talked about the existence of the type checker. So there’s no point
    in having a type checker if you don’t want to use it. So we made the type checker
    available as a library so that people can write their code in a language that
    they understand, and then they can just call the type checker from the outside
    of their code, which means that you don’t have to run it.


    But even without using the type checker, if you’re just writing your code with
    the assumption that you will be using the type checker, then you have to also
    have a way to make sure that your type definitions are all valid. And a lot of
    the way that type checking works is to try to figure out what you mean by the
    type, and then you have to check your code against it, and it’s quite expensive.


    So the other thing that we did was that we made it more economical for the type
    checker to do the checks for you. So if you write a check that doesn’t match,
    you don’t have to worry about that check. The type checker will just make sure
    that it doesn’t do that. So if you get a check and you don’t match, you don’t
    have to worry about that check. The type checker will just forget about that check.
    So you have a program that is free from the worry of having to match, or having
    to check, all of your type definitions. And if the type checker did some kind
