- fmt: '

    Pair programming is a development practice in which two developers work on the
    same application. By working together, they can find issues faster and avoid misunderstandings.


    Partnering up to complete a project is a great way to help developers learn best
    practices and test each other''s work.


    ## Find a mentor


    If you haven''t already, you should try to find a mentor who has experience in
    your area of expertise.


    Getting a mentor is great for several reasons. You''ll learn how other developers
    interact with `Java` and build your skills in the process. Plus, you will receive
    constructive criticism to help you grow as a developer.


    Your mentor is a great way to understand the tools that are available, so it is
    highly recommended that you work with someone who understands these issues.


    ## Use revision control


    Revision control allows developers to track the progress of a project through
    many points. Before deciding on a project, the developer should establish a design
    document that lists all of the various components and functions they want to implement.


    The developer can then go through the project and create an iterative set of tests
    to check the functionality of the software and make changes as needed.


    The design document can provide clarity on what the program needs to accomplish,
    and by creating a set of test cases, the developer will know when they are close
    to creating a functional product.


    ## Start learning


    Once you have reached a level of proficiency, you should start learning new languages
    or even learning an entirely new one. New language syntax often provides greater
    versatility and functionality in terms of the features that are supported in the
    application.


    To continue learning, you should set up a time each day where you practice and
    review the material you have studied. Use the extra time to learn as much as you
    can about the language or application you are using.


    ## Keep documentation


    Documentation is a great way to keep the developer and user as happy as possible.
    Having documentation helps people find what they need and understand how to use
    the application.


    This document serves as a reference for the developers to make any necessary changes.


    ## Replace the use of save points with "hot reload"


    What we call save points are hot reload points. That is, we can see the changes
    we are making when we save the application. A hot reload feature, however, will
    allow the developer to make a change right before it is saved.


    Hot reload is a great way to test out your code without having to recompile it.
    When it saves, the changes are committed, and the developer can use the application
    immediately.


    ## Don''t repeat yourself


    It is a developer''s responsibility to avoid repeating himself.


    We tend to gravitate to what is familiar. What we are doing is normal and therefore
    normal will work.


    Instead of following the norm, try to provide developers with opportunities to
    stretch themselves and learn about new technology.


    ## Use extreme coding


    Extreme coding is a method of developing applications that require extensive code
    for design or functionality. This is also known as craftsmanship or "night-school"
    programming.


    As a developer, you should try to avoid following the traditional coding patterns
    that are taught to us in school.


    By applying extreme coding, you are working in a set of patterns that provides
    a solid structure and structure for your application. These patterns often encourage
    creativity and make the developer more productive.


    ## Avoid the large code base


    Code that is too large is difficult to debug, and harder to maintain. Code that
    is too small is difficult to test and generally leads to a bloated application.


    The size of your code should be proportional to the size of the application.


    ## Use the linter


    Writing code that looks correct to other developers is important. Making sure
    that your code does not have typos is good practice.


    However, it can be tedious to test all of your code each time you make a change.
    A linter, however, ensures that your code always reflects your intentions.


    ## Use classes rather than Object Oriented Programming


    By coding in an object-oriented manner, your project becomes more complicated.


    Using classes helps simplify your project because it follows a single class throughout
    your application. This means that every class and every method is clearly described.


    ## Avoid virtual spaces


    Virtual spaces are just that: spaces where you can interact with each other over
    the internet. These are virtual worlds that are created through game developers
    and people who have spent a lot of money building them.


    Virtually, you can be wherever you want to be with anyone you want to be with.


    ## Simplify code


    When you follow the KISS principle, you make code easier to understand.


    The code should always make sense. Simplify the program by removing unnecessary
    actions, like the code that moves a field from one variable to another.


    These actions are redundant and difficult to understand.


    ## Avoid the keyword ''a''


    ''A'' is a generic keyword that refers to all types of values that a developer
    can use.


    For E.g.''`a''` is the integer value of `4`. You should generally avoid the use
    of `''a''` for generic types, as this leads to typos in your code.


    ## "Begs the question"


    "Begs the question" is a writing style that focuses on asking the same question
    that a reader is thinking.


    A common example is:


    I asked a question about sum types, and you asked a question about bounded types.
    These are valid questions that were asked, but they are being addressed two different
    ways. This is a common way to use the question.


    This is something that should be addressed within your code:


    This type is Bounded, but what is `Int`? Can you give me an example of what the
    default is? I haven''t written much code, but I have read some code. What is my
    value of `Int`? This is `Int`, what is `''Int''`? What is the limit of? Which
    definition of?


    ## Describe, don''t ask


    Describing the code is a way to specify the intentions and structure of your code.
    It is better than just asking.


    Write down the purpose of each part of your code, including its name, responsibility,
    and purpose.


    ## Recursive


    Recursive is a programming style that allows you to construct functions that are
    larger than necessary, but that is still well structured and concise.


    This means that you don''t have to write so intermediate code (The size of your
    code shouldn''t increase too much if you want to add new functions).


    ## Promises


    A promise is an object that specifies the status of future action.


    By using promises you allow the user to complete an action when the promise gets
    fulfilled.


    The most common use of promises is a promise to complete an action when an error
    has been raised, but you can use them to produce data as well.


    In this example, we create an `A` that represents an action to perform when an
    `A` is made. The success of the operation is represented by `A` and the error
    is represented by `Not A`.


    Because we use promises, this will automatically terminate our code. The idea
    is that the code should only exit when the promise is fulfilled.


    A few things to remember:


    - Promises are a powerful concept, but they''re also very easy to misunderstand.

    - Don''t make promises that are not needed.

    - Avoid casting or arbitrary functions.

    - Avoid the use of function literals.

    - Don''t rely on jQuery.

    - Don''t use template literals.

    - Avoid the use of return `''b''` values.

    - Never return something that the browser can understand.

    - Avoid function curly braces.

    - Avoid the use of anonymous functions.

    - Never use `''in''` on objects.

    - Avoid the use of `this`, `const`, or `Object`.

    - Avoid returning the value of `undefined` when the function finishes.

    - Avoid using `Boolean`, `true`, or `false`.

    - Don''t use `null` to mark a variable as an empty variable.

    - Avoid having more than one return statement.

