    \ 编程？\n\n作为一名 Java 开发人员，我最大的问题是缺乏用这种编程语言进行编程的信心。我花了几年时间才掌握了 `Java` 编程的窍门。别问我的\
    \ `C#` 技能，我完全不知道。我很幸运有这么一位妻子，她是国内一些最大、最好机构的专业 IT 招聘人员。她也是经验丰富的 `Java` 开发人员，并支持并教我。直到今天我依然结婚，这对我的\
    \ `Java` 技能产生了奇效。我非常敬佩那些必须独立完成大量 `Java` 到 `Java` 转换的 Java 开发人员。`Java` 语言，特别是如果是\
    \ `Java 2`，有很多大量的手工工作。出于某种原因，我一直在阅读书籍并学习关于内存安全和其他 `Java` 方面的知识，这是我必须做的。我认为原因是我的急躁。\n\
    \n在 Steve Freeman 写的《Risking My Career by Writing My Own Java Module》书中，他讲述了一个招聘一名编程新手\
    \ Java 开发人员的故事。在第一次培训课程，该开发人员询问 `Java` 中的 `Constant` 和 `ConstantField` 之间有什么区别。\n\
    \nFreeman 解释了什么是常量以及他如何在 `Java` 中构建类。该开发人员说他从未见过这样的东西，并好奇在 `Java` 中创建一个常量字段是如何可能的。“困难的部分在于设计你的程序使其在每个细节上都是正确的，特别是要设计你的程序使其在不应该崩溃的时候不崩溃，并且以这种方式使得人们无法预测程序在特定情况下的行为，”Freeman\
    \ 说道。\n\n这让我想起最初的 `Java` 编程经历。相比于那个根本没听过也无法构建常量字段的 Java 开发人员的平庸轶事，这个故事是多么不可思议。\n\
    \n在学习 `Java` 编程时，你应该考虑以下几个问题：\n\n## 什么是常量？\n\n常量是一个整数或浮点值。它没有单一的可能值。如果你有一个浮点数，你应该预期它有一个单一的可能值。例如，在\
    \ `Java` 中，浮点数被表示为 32 位整数，而两个可能的值是 `2.71828182845e-18` 和 `2.71828182845e-15`。整数被表示为\
    \ 32 位浮点数，而两个可能的值是 `0.5` 和 `1.0`。\n\n当你开始学习 `Java` 编程时，记住这个硬的事实：数字永远是数字。\n\n##\
    \ 最大的质数是多少？\n\n它是 `253`。\n\n换句话说，最大的质数是 `253`。\n\n你还应该知道，你可以使用带有许多不同非常量值的 `Integer`\
    \ 字段。它们存在于每个类中，且不应该被使用。\n\n你还应该知道设计对象有很多方法。如果你以后改变了主意，可以更改字段的默认值。例如，你可以将 `Int`\
    \ 中字段的默认值从 `0.5` 改为 `1`，或者将其更改为 `2.71828182845e-15`。\n\n## Java 中的常量(T) 是什么？\n\
    \n常量被作常量的变量，该变量与常量同名。\n\n示例：\n\n```java\nclass ParameterizedInteger<T> {\n   \
    \ static Integer constant1 = T;\n    static Integer constant2 = T;\n    static\
    \ Integer constant3 = T;\n    static int final constant = 0;\n    public static\
    \ int defaultValue = constant;\n    public static T value = constant;\n    private\
    \ int maxValue;\n    private int minValue;\n    private int stepSize;\n\n    public\
    \ static void setDefaultValue(T value) {\n        if (value <= 0) {\n        \
    \    value = value.toString();\n        } else if (value > maxValue) {\n     \
    \       value = value.toString();\n        } else if (value < minValue) {\n  \
    \          value = value.toString();\n        } else {\n            value = 0;\n\
    \        }\n    }\n\n    public static void setMaxValue(T value) {\n        maxValue\
    \ = value.toString();\n    }\n\n    public static void setMinValue(T value) {\n\
    \        minValue = value.toString();\n    }\n\n    public static int getValue()\
    \ {\n        return value;\n    }\n\n    public static T getValues() {\n     \
    \   return values;\n    }\n\n    public static void setValues(T values) {\n  \
    \      values.Clear();\n        values.Add(new ParameterizedInteger<T>(values));\n\
    \    }\n\n    public static T getValues() {\n        return values;\n    }\n}\n\
    ```\n\n注意：如果你对 `Java` 有疑问，记住那句俗：“总是使用可以两次显示相同内容的工具。”在你的编程工作中使用多种工具，例如电子表格计算器、DDE\
    \ 视图和编译器。\n\n## 如何定义参数的类型？\n\n"
- fmt: "\nYou can define a parameter of a class by declaring a default value or by\
    \ declaring the type of the parameter. For example, the default parameter in the\
    \ `Integer` class is also `Integer`. In this case, a default parameter is a parameter\
    \ with the type `Integer`. You can also define the type as being `ConstInt` or\
    \ `Comparable`.\n\nCreate a new package and add the following code:\n\n```java\n\
    public class ParameterizedInteger<T> { \n    public T value; \n    public ConstInt\
    \ value; \n    public Comparable<T> valueComparator; \n    public T getValue()\
    \ { return value; } \n    public static T getValues() { return values; } \n}\n\
    ```\n\nNow, create another new class, named `Integer` and in it, add the following\
    \ code:\n\n```java\npublic class Integer implements ParameterizedInteger<T> {\
    \ \n    public Integer value; \n    public T getValue() { return value; } \n \
    \   public static T getValues() { return values; } \n}\n```\n\nYou can change\
    \ the parameter declaration in the class like this:\n\n```java\npublic class ParameterizedInteger<T>\
    \ { \n    public T value; \n    public ConstInt value; \n    public Comparable<T>\
    \ valueComparator; \n    public T getValue() { return value; } \n    public static\
    \ T getValues() { return values; } \n}\n```\n\nIt's important to know that when\
    \ you create the parameter declaration in the parameterized class, you should\
    \ have different versions of the parameter.\n\nIn the first version, you should\
    \ have `T` for the type of the parameter.\n\nIn the second version, you should\
    \ have `ConstInt` for the type of the parameter.\n\nHere is an example:\n\n```java\n\
    public class ExampleParameterizedInteger<T> { \n    public T value; \n    public\
    \ ConstInt valueComparator; \n    public T getValue() { return valueComparator.compare(value.getValue());\
    \ } \n    public static T getValues() { return values; } \n}\n```\n\n## How do\
    \ you return the value of a parameter in a method?\n\nYou can return the parameter\
    \ value like this:\n\n```java\npublic class ParameterizedInteger<T> { \n    public\
    \ T value; \n    public ConstInt valueComparator; \n    public T getValue() {\
    \ return valueComparator.compare(value.getValue()); } \n    public static T getValues()\
    \ { return values; } \n}\n```\n\nHere is the implementation of the parameterized\
    \ class:\n\n```java\npublic class ParameterizedInteger<T> { \n    public T value;\
    \ \n    public ConstInt valueComparator; \n    public T getValue() { return valueComparator.compare(value.getValue());\
    \ } \n    public static T getValues() { return values; } \n}\n```\n\nThe parameterized\
    \ class definition with the parameter definition with the equals sign is part\
    \ of the parameterized classes in the `parameterization` package. You can also\
    \ add other parameter types to the parameterized classes.\n\n## What are the methods\
    \ of the parameterized classes?\n\nIn a parameterized class, you have to declare\
    \ one or more methods. In this class, there are two method declarations:\n\n```java\n\
    public void compare(T value, T comparator) { if (value == comparator) { return;\
    \ } } \npublic void returnValue(T value) { return value; }\n```\n\nThe `compare()`\
    \ method compares the parameter value with the value of the parameter in the `comparator`.\n\
    \nThe `returnValue()` method returns the value of the parameter. You can call\
    \ the `returnValue()` method with the parameter reference as the first parameter.\n\
    \n## Do you have to create a class and implement methods with the parameters of\
    \ the parameterized classes?\n\nNo. There is a class named `ParameterizedMethod`\
    \ and in it, there is one class named `ParameterizedMethodBuilder` that you can\
    \ use for parameterizing your method definitions.\n\n## How to add a ParameterizedMethodBuilder\
    \ to a parameterized class?\n\nThe `ParameterizedMethodBuilder` class is implemented\
    \ as a `ServiceProvider` and you can register the `ParameterizedMethodBuilder`\
    \ into a parameterized class. Here is an example:\n\n```java\npublic class ExampleParameterizedMethodBuilder\
    \ { \n    public ParameterizedMethodBuilder(ServiceProviderParameterizedMethodBuilderBuilderProvider)\
    \ { \n        this.ParameterizedMethodBuilderProvider = ParameterizedMethodBuilderProvider.create();\
    \ \n    } \n    public ParameterizedMethodBuilderBuilder create() { \n       \
    \ this.ParameterizedMethodBuilderProvider.register(new ParameterizedMethodBuilder(NewParameterizedParameterizerProvider.class));\
    \ \n        return this; \n    } \n}\n```\n\nThe `ParameterizedMethodBuilder`\
    \ is an instance of the `ServiceProvider`. In a parameterized class, there is\
    \ no instance of the `ServiceProvider`, so `ParameterizedMethodBuilder` uses the\
    \ service provider for the parameterized class.\n\n## Do you have to create a\
    \ custom implementation of a custom class in order to call the methods of the\
    \ parameterized classes?\n\nNo. You can call the methods of the parameterized\
    \ classes like this:\n\n```java\npublic class ParameterizedType<T> { \n    public\
    \ T value; \n    public bool equals; \n    public T getValue() { return value.getValue();\
    \ } \n    public void setValue(T value) { this.value = value; } \n    public static\
    \ T getValues() { return values; } \n}\n```\n\nThe `ParameterizedType<T>` is an\
    \ instance of the `CustomType` class. You can also create a new parameterized\
    \ type with the initializer:\n\n```java\npublic class CustomType<T> { \n    public\
    \ CustomType(T t) { t = t; } \n    public CustomType(T value) { t = value; } \n\
    \    public void setValue(T value) { this.value = value; } \n    public void setNumber(int\
    \ number) { this.number = number; } \n    public void setNoEqual(bool isEqual)\
    \ { this.noEqual = isEqual; } \n    public int getNoEqual() { return noEqual;\
    \ } \n}\n```\n\nYou can create another parameterized type as an interface and\
    \ call the methods with the parameter as an argument.\n\nThis is the same as this\
    \ code:\n\n```java\npublic interface CustomType<T> { public T value; } \npublic\
    \ class CustomType<T> implements CustomType<T> { \n    public T value; \n    public\
    \ CustomType(T value) { this.value = value; } \n    public void setValue(T value)\
    \ { this.value = value; } \n    public void setNoEqual(bool isEqual) { this.noEqual\
    \ = isEqual; } \n    public int getNoEqual() { return noEqual; } \n}\n```\n\n\
    Here is an example of creating an instance of `CustomType`:\n\n```java\npublic\
    \ interface CustomType<T> { public T value; }\npublic class CustomType<T> implements\
    \ CustomType<T> { \n    public T value; \n    public T value; \n    public CustomType(T\
    \ value) { this.value = value; } \n    public CustomType(T value) { this.value\
    \ = value; } \n    public setValue(T value) { this.value = value; } \n    public\
    \ int getNoEqual() { return noEqual; } \n}\n```\n\n## How to use a parameterized\
    \ class as a parameterized class?\n\nThere is a `ParameterizedType<T>` that represents\
    \ an instance of a parameterized class, so you can call the methods of the parameterized\
    \ class like this:\n\n```java\nParameterizedType<T> myComponent;\nvoid doSomethingMethod(InputMyComponent,\
    \ MyComponent) { \n    myComponent.setValue(1); \n    myComponent.setNumber(9);\
    \ \n}\n```\n\n## Do parameterized classes have to be subclassed?\n\nNo. The parameterized\
    \ classes just use the static methods of the parameterized classes.\n\n## Can\
    \ I call the methods of the parameterized classes like this:\n\n```java\npublic\
    \ class ParameterizedType<T> { \n    public T value; \n    public bool equals;\
    \ \n    public T getValue() { return value.getValue(); } \n    public void setValue(T\
    \ value) { this.value = value; } \n    public void setEqual(bool isEqual) { this.noEqual\
    \ = isEqual; } \n    public int getNoEqual() { return noEqual; } \n    public\
    \ int getNoEqual() { return noEqual; } \n}\n```\n\nI want to add my own custom\
    \ parameters to the `CustomType` class and have them available through parameterized\
    \ methods. For instance, I can put a number and a string as parameters and call\
    \ these parameters by passing a parameter as a tuple:\n\n```java\npublic class\
    \ CustomType<T> implements CustomType<T> { \n    public CustomType(T value) {\
    \ this.value = value; } \n    public CustomType(T value, string name) { this.value\
    \ = value, name; } \n    public CustomType(T value, int number) { this.value =\
    \ number, name; } \n    public CustomType(T value, bool equals) { this.noEqual\
    \ = equals; } \n    public CustomType(T value, int noEqual) { this.noEqual = noEqual;\
    \ } \n    public T getValue() { return value.getValue(); } \n    public CustomType(T\
    \ value) { this.value = value; } \n    public CustomType(T value, int noNumber)\
    \ { this.noNumber = noNumber; } \n    public int getNoNumber() { return noNumber;\
    \ } \n    public int getNoNumber() { return noNumber; } \n}\n```\n\n## What is\
    \ the difference between a weak parameterized class and a strong one?\n"
