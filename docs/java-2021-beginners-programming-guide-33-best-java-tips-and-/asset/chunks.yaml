    as well as all of the Java EE 6 specifications for JAX-RS, JSF, and JAX-WS. The
    EE7 implementation is interoperable with Java EE 6 and will be the default Java
    EE 7 implementation in Eclipse EE 7, with new Java EE 7 JSRs to be added to EE7.


    ## Eclipse EE 7 and Cloud Foundry'
