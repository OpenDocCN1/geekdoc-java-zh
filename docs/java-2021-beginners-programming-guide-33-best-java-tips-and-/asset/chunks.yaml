    i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i] = List.
    ofNullable(new ArrayList < String >()); }


    Not all Optional instances are capable of converting a value to a Label or an
    ExpectedLine. For example, the following example cannot convert an Optional[String]
