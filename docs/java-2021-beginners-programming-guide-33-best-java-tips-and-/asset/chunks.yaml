    ●     List[String] possibleLocations = new ArrayList < String >(); possibleLocations.
    add ( null ); for ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]
    = toIsTodo; }


    Each possible value of an optional collection is presented in a fixed-size array.


    If an Optional[T] is passed to a method, the method must first ensure that the
    given value is a possible value of that type before attempting to convert it to
    a different type. If a method does not convert a given value to a different type,
    the method returns null. A method may also return null if it is not trying to
    convert a given value to a different type.


