    6.


    ## What’s New in Java 9?


    Java 9 is going to introduce a lot of new transitive data types:


    First of all, let’s take a look at the `java.util.Date` type, which will provide
    you with the ability to create, sort, and analyse dates:


    ```java

    java.util.Date type java.util.Date.getFormatting(''MM/dd/yyyy''); String formattedDate
    = new java.util.Date(new java.util.Calendar().getTimesUnit());

    ```


    As you can see, the formatting methods are removed in the latest version of Java
    9, but we’ve still got to import `Calendar` to use the date class. This is now
    going to be the new default, but it’s not a mandatory requirement for Java 9.


    One thing that will be different, however, is that when we created the date class
    in Java 7, we used the static `getFormatting()` method, which doesn’t exist anymore.


    So, if we want to use the date class from Java 9, we’ll need to create a class
    that contains the `DateFormat` class and add the static `getDateFormatting()`
    method to it.


    ```java

    DateFormatter formattedDate = new java.util.DateFormatter(); String formattedDate
    = new java.util.Date(new java.util.Calendar().getTimesUnit()); formattedDate.setFormatting(new
    java.util.DateFormatting());

    ```


    That’s the only additional file we’ll need to create, and the only additional
    class we’ll need to create.


    ## Java 9 Transitive Data Types


    A new type has been introduced in Java 9, and this one is similar to `Date`. It’s
    called `Time`, and is a Transitive Data Type that lets you create and manage dates:


    ```java

    Time new = new java.util.Date(new java.util.Calendar().getTimesUnit()); Time setCurrentDate(Time
    new); Time yesterday = new java.util.Date(new java.util.Calendar().getTimesUnit());
    time = new java.util.Date(new java.util.Calendar().getTimesUnit());

    ```


    Like `Date`, `Time` also has a static `getDateFormatting()` method, but we’re
    using the static `getCurrentDate()` method to get the current time.


    If we want to store something in a `Time`, we can use the static `getCurrentDate()`
    method and set its format to whatever we want:


    ```java

    setCurrentDate(Time new); Time yesterday = new java.util.Date(new java.util.Calendar().getTimesUnit());

    ```


    The main difference between `Time` and `Date` is that `Time` uses a different
    format to get the current time. `Time` uses the `java.util.DateTime` format. If
    we want to create a `Time` that stores the current date and time, we’d need to
    use the static `getCurrentDate()` method:


    ```java

    current = Time.now(); System.out.println("Created at " + current.getCurrentDate());

    ```


    The above code creates a new `Time` object that stores the current date and time,
    and shows it by writing it to the console. You can get a better idea of how to
    do this in the following code snippet:


    ```java

    System.out.println(current.getCurrentDate()); System.out.println("Time is " +
    current.getTime());

    ```


    If we don’t specify an absolute reference to the `Time`, it stores the time as
    the year -4,000:


    ```java

    current = Time.now(); System.out.println("Created at " + current.getCurrentDate());
    System.out.println("Time is " + current.getTime()); System.out.println("An additional
    time has not been created yet");

    ```


    Java 9 also introduces a new interface called `LinearDisplayTime` that implements
    the `LinearDisplayFormat` interface and allows you to specify your format and
    date format:


    ```java

    LinearDisplayFormat spec = new LinearDisplayFormat("Format") .setDailyWidth(2)
    .setDailyHeight(2) .setMonth(1) .setYear(12); System.out.println("Calculation
    performed by " + (System.currentTimeMillis() - (null).getTime()));

    ```


    Notice that we have created a second `LinearDisplayFormat` object and that the
    `getDateFormatting()` method has been changed to use the new `LinearDisplayFormat`
    interface.

