    # Chapter 5 What are tools for Java language?


    Imagine that there are several language constructs and facilities available to
    you. Some of them, such as inlining or only-functional constructs, will give you
    better performance, but might not work for all situations. Some features improve
    Java’s safety, readability, or developer productivity, but not necessarily in
    a way that they would be advantageous in every situation. Furthermore, several
    idioms make it difficult to do certain tasks.


    These issues have led some developers to use Java’s tools in many different ways.
    For some people, tooling is not very important, but for others, it is very important.
    As an example, some people use Eclipse, and other people use IntelliJ, and the
    question is whether Eclipse or IntelliJ is better in some respects. The same goes
    for the JVM itself. Some people use it in a strictly single-threaded fashion.
    Others prefer to use JVM-level optimizations or JITs. As with so many things,
    there is no “best” approach, but rather a spectrum of approaches that will result
    in different tools for the same problem. It’s important that you understand the
    differences between tools for any given problem, and that you understand the tradeoffs
    involved, to make the best decision for your case.


    In other words, find a suitable tool for the problem, suggest it to the developer,
    and also provide the required configuration to be used. If we break it down, tooling
    is something that “picks out” and shows you what to use, and “suggests” the appropriate
    tool for the problem. Tools that are too hard to use will simply not get the developer’s
    attention (and thus, will not be used). On the other hand, tools that are too
    easy to use will likely not be used at all. If we break it down further, some
    tasks (e.g., printing ) are “hard” and require a lot of configuration. Other tasks
    (e.g., querying ) are “easy”, and require no configuration. And other tasks (e.g.,
    querying ) are “not a tool, but rather a method”. And as you can see, there is
    considerable variation in this area.'
