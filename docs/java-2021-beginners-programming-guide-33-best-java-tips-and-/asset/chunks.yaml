    ## How do I add a source folder to my .NET project?


    To add a source folder to your .NET project, you need to click on the “Add Project”
    option in the project wizard. It also shows the steps to add a source folder.
    The following section gives you the detailed step-by-step guide for adding a source
    folder to your project.


    In the “Project Configuration” screen, there are two tasks:

    - Add a source folder.

    - Add a new package.


    To add a source folder, click on the `Add Source Folder` option. To add a new
    package, click on the `Add a new Package` option. Now, add a source folder and
    the first package by using the menu. Then, click on the `OK` button. It will ask
    you to confirm your change. Click on the `OK` button to see the new source folders
    and the new package.


    ## How do I add a source folder to my .NET project using Eclipse?


    To add a source folder to your .NET project in Eclipse. To add a source folder,
    add a new source folder. Right-click on the new source folder and click on “Create
    folder”. After creating the new source folder, click on “OK`. This time, instead
    of using the `Add a new project` option, you can just select `Add Package`. After
    you add a source folder and the first package, click on the `OK` button. This
    means that you can add source folders and packages to your project with Eclipse
    as well.


    ## How do I add source folders to my .NET project using Visual Studio?


    To add a source folder to your .NET project, click on the `Add a New Project`
    option in the project wizard. At first, it will ask you to check whether you want
    to use the project template that you have created previously. It will show you
    the following step. Click on the `Add a source folder` button.


    If you check the `Add a source folder source of type X` checkbox, it will create
    a new folder that contains the source folders of type `X`. Click on the `OK` button
    to add the second source folder. Click on the `OK` button to add the second source
    package.


    # Chapter 4 Do Java and Javascript the same?


    In all likelihood, they will be very similar because if anything they are going
    to be a better place for you to get your initial exposure, say back into the center
    of the internet. But don’t be surprised if you see some quite obvious differences.


    On a very basic level, the distinction between Javascript and Java is that when
    Javascript runs on a computer it accesses a separate portion of the operating
    system called the network stack and will then run on top of it. The Java version
    will be run on the standard operating system, called the operating system. There
    is a difference in the semantics of what your computer does when Javascript runs
    than when it runs on Java.


    The programming languages will be quite similar, but in the context of actually
    understanding a business and the specifics of how it’s run the languages will
    differ in terms of their semantics. If you are running a business you will be
    doing more high-level tasks and the syntax of the language will be very different
    than if you are using the language to run as a hobbyist in the developer’s world.


    ## What should I learn first?


    In the case of Javascript, you are probably interested in programming in it because
    of the way that Google does its search. The basic functions in Javascript are
    very similar to those of Java in that you’ll be able to create functions with
    arguments, get function results and return functions, all of which are Java-like
    constructs.


    You should also consider that Javascript has these two other tricks that Java
    doesn’t have, namely closures and anonymous functions. Closures are a way of defining
    a block that cannot be accessed in any way, but that you can access in another
    function or a block on the stack, and also anonymous functions are another thing
    where the function will return a value, but it will not be in any way bound to
    the global scope and so that the next function can call the function, and so forth
    so you can pass around variables in a very natural way. Those are the basic building
    blocks of Javascript.


    You’ll also be looking at functions of smaller and smaller expressions that in
    Java are called lambdas, and in the context of Javascript will be function functions,
    that will allow you to do things that are very different from the Java approach,
    where you can’t pass the variable through a function as you can in Javascript.


    But a lot of the time, if your only exposure to Javascript is from doing Google
    searches and from reading about the language on places like Stack Overflow, you’re
    going to see a lot of small and very common JavaScript patterns that you’re going
    to start learning quite quickly and then as your understanding and familiarity
    grow the real fundamental syntax and language features will be far more complex
    and won’t be things that you will understand if you don’t know the smaller and
    simpler parts of the language.


    My experience is that at some point, no matter how much you study Javascript,
    no matter how much code you write, you’re going to hit a point where you are going
    to have to read somebody else’s code and that may take you a while. But for the
    most part, if you start to study Javascript now, I would recommend that you begin
    by learning some programming languages that aren’t in Javascript, to help your
    foundation.


    ## Java


    Java, on the other hand, is a language designed with the need of running very
    large and very diverse, and very complicated systems in mind. The truth is that
    not everybody needs to be designing and implementing their bespoke systems in
    Java, that’s certainly true of a lot of businesses, but for the individual developer
    that is not all important. In fact, for the individual developer that is not all
    important, but as a programmer, you are going to want to be learning Java anyway
    because Java is just the most powerful and most mature and most highly-regarded
    of the languages that most developers learn.


    Java isn’t a tool for creating websites. A lot of people, including Google, have
    given up on the notion of writing website in Java, they’re going to use an HTML
    engine or maybe they’ll use PHP or something like that. But you should not write
    your website in Java. You should not design your website in Java, you should not
    write your apps in Java, you should use Java to allow you to write applications
    that are larger and more complex than the smallest personal website.


    Java has a very comprehensive API. So all sorts of libraries and APIs that you
    may want to use are already included, such as the network stuff, including the
    Netbeans development environment. And the most important part of all of that is
    the fact that as soon as you download a copy of Java you can create a new Java
    virtual machine or a separate process that will allow you to run your Java code
    in the same browser window that it was originally written in if you want.


    In the context of web development, you’re going to want to do that. So you’ll
    use the `JDK` which is the Java Development Kit to download your virtual machine.
    If you’re familiar with Windows XP, you’re going to have to create a second `CD`,
    and you’ll install that CD on your computer with all of the tools that you’ll
    need. That process is almost identical to what you’ll need to do to install a
    Windows virtual machine, except for the fact that you’ll want to add some drivers
    for your computer so that it’ll recognize the virtual machine that you’re installing.


    Once you’ve made those two CDs or DVDs, you’re ready to go, and now you can write
    Java in the same environment that you would use to develop for Windows or Mac
    OS X or Linux. The syntax for things like strings, numbers, variables, lambda
    functions, iteration, if statements, and so on are almost the same as they are
    on those other platforms.

