- fmt: "\nOracle is now providing an all-in-one offering for Java users with its Oracle\
    \ Digital Cloud Office. This is a completely customizable Java environment, including\
    \ development tools, a development environment, and all the tools required to\
    \ build, test and deploy Java software applications.\n\nIt is a complete package\
    \ and you can use it on any computer, whether it is a Mac, PC, or Linux computer.\
    \ \n\nOne of the advantages of using Oracle’s Digital Cloud Office is that it\
    \ is free. Oracle is not trying to sell any software. It is completely free. The\
    \ only cost is time to download and install the Oracle Digital Cloud Office.\n\
    \nA second advantage of using the Oracle Digital Cloud Office is that it is very\
    \ easy to use. It is very fast. The Oracle Digital Cloud Office allows you to\
    \ focus on the development process.\n\nIf you use Oracle’s Digital Cloud Office\
    \ for your Java development, you can rest assured that you will have the best\
    \ tools available to develop your software.\n\n# Chapter 1 What are the features\
    \ of the Java language?\n\nThe Java language supports static types, modern programming\
    \ styles (non-recursion-based, for example), and algorithms, including a wide\
    \ variety of computing-optimized ones, such as array computations, string handling,\
    \ bit-manipulation, sorting, linking, reverse-engineering, binary-code manipulation,\
    \ Boolean logic, genetic programming, and graph algorithms, among others.\n\n\
    ## Are there any flaws in the Java language design?\n\nFor a mature programming\
    \ language, it should be unlikely for a programming error to occur. However, even\
    \ mature programming languages can suffer from programming errors if the design\
    \ is not designed in such a way that it can be fixed efficiently.\n\n## Are there\
    \ any design flaws in the J2EE application server design?\n\n**Incompatibility\
    \ with other application servers**: The J2EE application server specification\
    \ does not explicitly support interoperability between different J2EE application\
    \ servers.\n\n**Changes to the requirements**: Changes to the requirements are\
    \ not made through the specification, and it is not clear what the changes will\
    \ be. Such changes may be required by a future release of the specification.\n\
    \n## Are the versions specified by the Java Language Specification (JLS) to be\
    \ the final versions, or will they be revised in some way?\n\nThe versions specified\
    \ by the Java Language Specification are pure specifications, and no final version\
    \ has been specified. For example, it is not possible to find any articles on\
    \ the web which define what version of the Java language is the latest. If the\
    \ JLS changes in some way, it will probably affect the most recent version of\
    \ the Java language specifications.\n\n## Should I write J2EE applications using\
    \ the J2EE application server specification?\n\nThe Java language specification\
    \ does not require that the application server specifications are used for J2EE\
    \ applications. J2EE implementations can exist which do not use the specification\
    \ or which work with the specifications, but which are built differently from\
    \ the current, most common implementations.\n\n## How can a J2EE server be used?\n\
    \nJ2EE provides an abstraction that provides an interface to program clients.\
    \ Program clients can use the interface to communicate with the server and take\
    \ actions on the server.\n\n## How does a J2EE client know how to create a program\
    \ to communicate with the server?\n\nIt can create a program to communicate with\
    \ the server through the interface, which it defines. A program to communicate\
    \ with the server may use any types that the server supports, and a client using\
    \ a type can treat the program as if it were the server. It also can use any behavior\
    \ of the program, whether the behavior is provided by the program itself, or by\
    \ other client methods. A J2EE client does not have to create its J2EE server;\
    \ it can use any existing server if the existing server supports the client interface.\n\
    \nA program communicating with the application server uses the `Session` protocol\
    \ to do this. The client defines an interface to the server. It may then use any\
    \ of the methods in the interface, or a different class, to communicate with the\
    \ server.\n\nThe client also needs a way to receive messages from the server.\
    \ The message type is created using the `read` method of the client class. It\
    \ can receive any type of message from the server, as long as the type is compatible\
    \ with the class. In particular, it can receive both method messages and message-based\
    \ messages.\n\nThe client also can send messages to the server, but it must use\
    \ the `write` method of the client class to write the message, and it must wait\
    \ for the message to be sent before sending its message. In this way, the client\
    \ can send messages in a way similar to how a client program would communicate\
    \ with a human program, such as a web browser.\n\n## What J2EE features and standard\
    \ J2EE servers have been defined by the J2EE specification?\n\nJ2EE defines several\
    \ standard methods, each of which is described in the respective specification.\
    \ The following list of J2EE features is provided to illustrate how the J2EE standard\
    \ defines these features.\n\nAnother J2EE feature is that methods can be called\
    \ and handlers can be defined without the need to define an implementation. The\
    \ default implementation for each of these methods is then provided for clients\
    \ that implement the interface.\n\nA Java class which conforms to a standard J2EE\
    \ server has the code below added to the class definition:\n\n```java\npublic\
    \ final class JavaServer implements Service {\n    public void write(Session session,\
    \ ReadableReusableData<String> data) {\n        WriteableReusableData<String>\
    \ data = data;\n        return true;\n    }\n    public void read(Session session,\
    \ String s) {\n        String data = s;\n        return true;\n    }\n}\n```\n\
    \n## How does the JavaServer interface work?\n\nThe `JavaServer` interface specifies\
    \ the methods that the server supports.\n\nThe `write` method is called by a client,\
    \ and it provides a way for the client to send data to the server. It returns\
    \ true if the server responds, and returns false otherwise. The `read` method\
    \ is called by the server when the client sends data to it. It returns the actual\
    \ value of the data, whether the data is correct or not.\n\nThe `JavaServer` implementation\
    \ is a subclass of the `JavaServerBase` class. In particular, it adds the methods\
    \ of the `java.lang` package, and the server implementation. The implementation\
    \ also defines a default implementation for the `read` method, so that clients\
    \ who do not implement the interface can still access a default implementation\
    \ of the `read` method.\n\nThe `JavaServer` class also defines several factory\
    \ methods that allow clients to set up a ready-to-use `JavaServer` instance when\
    \ they do not implement the interface. The standard J2EE implementation supports\
    \ the following:\n\n- `java.util.Scanner` for reading individual messages.\n-\
    \ `java.io.InputStreamReader` for reading message data.\n- `java.io.OutputStreamWriter`\
    \ for writing message data.\n- `java.io.OutputStreamStream` for writing binary\
    \ messages.\n- J2EE is not yet integrated into Java EE 6.\n\n## Can Java EE 6\
    \ use J2EE?\n\nNo. J2EE is not an official part of Java EE 6. While J2EE may be\
    \ available in JRE, the implementation provided by Oracle is not compatible with\
    \ Java EE 6. Java EE 6, while defining the `JavaServer` interface, also defines\
    \ other interfaces which are not compatible with J2EE.\n\n## Can Java EE 6 use\
    \ J2EE libraries?\n\nNo. J2EE is not an official part of Java EE 6. While J2EE\
    \ may be available in JRE, the implementation provided by Oracle is not compatible\
    \ with Java EE 6. Java EE 6, while defining the `JavaServer` interface, also defines\
    \ other interfaces which are not compatible with J2EE.\n\n## Does the JavaServer\
    \ implementation interface behave differently in Java EE 6 than in Java EE 5?\n"
  raw: 'Oracle is now providing an all-in-one offering for Java users with its Oracle
    Digital Cloud Office. This is a completely customizable Java environment, including
    development tools, a development environment, and all the tools required to build,
    test and deploy Java software applications.


    It is a complete package and you can use it on any computer, whether it is a Mac,
    PC, or Linux computer.


    One of the advantages of using Oracle’s Digital Cloud Office is that it is free.
    Oracle is not trying to sell any software. It is completely free. The only cost
    is time to download and install the Oracle Digital Cloud Office.


    A second advantage of using the Oracle Digital Cloud Office is that it is very
    easy to use. It is very fast. The Oracle Digital Cloud Office allows you to focus
    on the development process.


    If you use Oracle’s Digital Cloud Office for your Java development, you can rest
    assured that you will have the best tools available to develop your software.


    # Chapter 1 What are the features of the Java language?


    The Java language supports static types, modern programming styles (non-recursion-based,
    for example), and algorithms, including a wide variety of computing-optimized
    ones, such as array computations, string handling, bit-manipulation, sorting,
    linking, reverse-engineering, binary-code manipulation, Boolean logic, genetic
    programming, and graph algorithms, among others.


    ## Are there any flaws in the Java language design?


    For a mature programming language, it should be unlikely for a programming error
    to occur. However, even mature programming languages can suffer from programming
    errors if the design is not designed in such a way that it can be fixed efficiently.


    ## Are there any design flaws in the J2EE application server design?


    Incompatibility with other application servers: The J2EE application server specification
    does not explicitly support interoperability between different J2EE application
    servers.


    Changes to the requirements: Changes to the requirements are not made through
    the specification, and it is not clear what the changes will be. Such changes
    may be required by a future release of the specification.


    ## Are the versions specified by the Java Language Specification (JLS) to be the
    final versions, or will they be revised in some way?


    The versions specified by the Java Language Specification are pure specifications,
    and no final version has been specified. For example, it is not possible to find
    any articles on the web which define what version of the Java language is the
    latest. If the JLS changes in some way, it will probably affect the most recent
    version of the Java language specifications.


    ## Should I write J2EE applications using the J2EE application server specification?


    The Java language specification does not require that the application server specifications
    are used for J2EE applications. J2EE implementations can exist which do not use
    the specification or which work with the specifications, but which are built differently
    from the current, most common implementations.


    ## How can a J2EE server be used?


    J2EE provides an abstraction that provides an interface to program clients. Program
    clients can use the interface to communicate with the server and take actions
    on the server.


    ## How does a J2EE client know how to create a program to communicate with the
    server?


    It can create a program to communicate with the server through the interface,
    which it defines. A program to communicate with the server may use any types that
    the server supports, and a client using a type can treat the program as if it
    were the server. It also can use any behavior of the program, whether the behavior
    is provided by the program itself, or by other client methods. A J2EE client does
    not have to create its J2EE server; it can use any existing server if the existing
    server supports the client interface.


    A program communicating with the application server uses the Session protocol
    to do this. The client defines an interface to the server. It may then use any
    of the methods in the interface, or a different class, to communicate with the
    server.


    The client also needs a way to receive messages from the server. The message type
    is created using the read method of the client class. It can receive any type
    of message from the server, as long as the type is compatible with the class.
    In particular, it can receive both method messages and message-based messages.


    The client also can send messages to the server, but it must use the write method
    of the client class to write the message, and it must wait for the message to
    be sent before sending its message. In this way, the client can send messages
    in a way similar to how a client program would communicate with a human program,
    such as a web browser.


    ## What J2EE features and standard J2EE servers have been defined by the J2EE
    specification?


    J2EE defines several standard methods, each of which is described in the respective
    specification. The following list of J2EE features is provided to illustrate how
    the J2EE standard defines these features.


    Another J2EE feature is that methods can be called and handlers can be defined
    without the need to define an implementation. The default implementation for each
    of these methods is then provided for clients that implement the interface.


    A Java class which conforms to a standard J2EE server has the code below added
    to the class definition:


    ●     public final class JavaServer implements Service { public void write(Session
    session, ReadableReusableData<String> data) { WriteableReusableData<String> data
    = data; return true; } public void read(Session session, String s) { String data
    = s; return true; } }


    ## How does the JavaServer interface work?


    The JavaServer interface specifies the methods that the server supports.


    The write method is called by a client, and it provides a way for the client to
    send data to the server. It returns true if the server responds, and returns false
    otherwise. The read method is called by the server when the client sends data
    to it. It returns the actual value of the data, whether the data is correct or
    not.


    The JavaServer implementation is a subclass of the JavaServerBase class. In particular,
    it adds the methods of the java.lang.class package, and the server implementation
    itself. The implementation also defines a default implementation for the read
    method, so that clients who do not implement the JavaServer interface can still
    access a default implementation of the read method.


    The JavaServer class also defines several factory methods that allow clients to
    set up a ready-to-use JavaServer instance when they do not implement the interface.
    The standard J2EE implementation supports the following:


    ●     java.util.Scanner for reading individual messages.


    ●     for reading individual messages. java.io.InputStreamReader for reading message
    data.


    ●     for reading message data. java.io.OutputStreamWriter for writing message
    data.


    ●     for writing message data. java.io.OutputStreamStream for writing binary
    messages.


    ●     J2EE is not yet integrated into Java EE 6.


    ## Can Java EE 6 use J2EE?


    No. J2EE is not an official part of Java EE 6\. While J2EE may be available in
    JRE, the implementation provided by Oracle is not compatible with Java EE 6\.
    Java EE 6, while defining the JavaServer interface, also defines other interfaces
    which are not compatible with J2EE.


    ## Can Java EE 6 use J2EE libraries?


    No. J2EE is not an official part of Java EE 6\. While J2EE may be available in
    JRE, the implementation provided by Oracle is not compatible with Java EE 6\.
    Java EE 6, while defining the JavaServer interface, also defines other interfaces
    which are not compatible with J2EE.


    ## Does the JavaServer implementation interface behave differently in Java EE
    6 than in Java EE 5?'
