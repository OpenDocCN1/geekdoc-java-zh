    “由于 `JSR` 针对的是终端用户而非开发团队，预计所有的 `APIs` 都不会被实现，”Schulman 说，“因此，在进行测试时，需要更多地关注使用框架来检测性能问题和逻辑漏洞。”


    ## 手机版 Java - 对 Java 意味着什么

    根据 Schulman 的说法，`API` 有可能移植到其他平台。这为编写目标移动设备的应用程序提供了一个绝佳的机会，而无需迁移 `JVM`。


    他还注意到，通过实现额外的封装器，可以相对容易地使用手机版 Java 进行测试。然而，他不认为这会形成一个巨大的用户群体。“目前，`Android` 社区有很多人正致力于将
    `Java` 引入其他设备，尤其是手机手机。”


    ## 那么 Java 开发者会对手机版 Java 感兴趣吗？

    Schulman 认为，开发者使用的语言特性越多越好。手机版 Java 的主要目标是让跨平台的应用程序创建变得简单。他还指出，由于 `Java` 对正则表达式有强力支持，`JSR`
    提供了一个编写无需编码程序的机会。


    “`Java` 是一种涵盖大量领域的大型语言，而其中一个覆盖得不是很好的领域就是手机版 `Java`。最后，Schulman 指出 `JSR 310` 正在积极开发中。开发者可以期待添加到手机版
    Java 中的语言特性很快可用。规范正在重写，某些提议的功能可能不会删除。”


    ## 什么是 Java 开发？

    `Java` 是一种已经存在多年的软件语言。它用 `Java` 编写并由 Sun Microsystems, Ltd. 开发。由于它是设计为 PC、`Mac`
    以及最近的 `Android` 和 `iOS` 操作系统开发应用程序，因此非常灵活。


    ## 它的优势是什么？

    `Java` 是一种多功能语言，可以用于构建各种应用程序，包括 Web 应用、桌面应用、服务器应用等。由于其广泛的使用，它已被一些公司和企业组织采用。


    开发者喜爱 `Java` 是因为它是一种强大的语言。由于它是基于 `Java` 的语言，开发者可以使用 `C`、`C++`、`C#`、`Clojure`、`ClojureScript`、`Kotlin`、`Go`、`Groovy`、`JRuby`、`Python`、`Ruby`
    和 `Scala`。它还具有兼容性，因此使用标准语法将代码移植到另一种语言非常容易。`Java` 也非常安全，并提供易于集成的 Java 环境 (`JRE`)。


    ## 它的劣势是什么？

    多年来，开发者在使用 `Java` 时遇到过一些问题。`Java` 对非 Java 应用也有影响，最近的 `Java 8` 也没有什么帮助。由于此，Java
    开发者正在寻找其他日益受欢迎的替代方案。


    此外，于 4 月发布的 `Java 9` 还没有准备就绪。Java 开发者已经等待了这个版本的发布多年，而在 `Java` 变得完全可用并适用于所有支持的版本之前，还有很漫长的等待。


    ## 我可以用 Java 使用什么？

    许多语言可以用于开发 `Java` 应用程序。有些是原生语言，另一些是解释型。对于服务器、后端应用程序以及桌面应用也有不同的选择。


    要开始，你可以从 Java 虚拟机 (`JVM`) 开始，它在 `Windows`、`Mac` 或 `Linux` 上运行 `Java` 的虚拟副本。从那里，你可以在虚拟机上运行
    `C` 或 `C++` 运行时（例如 `Java 7`、`Java 8` 或 `Java 9`），以开发桌面应用。


    对于服务器应用，你可以使用 `Apache Maven`，这是一个开源的 `Java` 应用程序框架，用于构建、管理和打包 `Java` 应用程序。它包含了开发
    `Java` 应用程序的各种工具，如构建工具、依赖管理等。


    对于 `iOS` 和 `Android` 开发，可以使用苹果的 `Swift` 或 Google 的 `Go`，它们都是用于开发服务器和桌面应用的解释型语言。


    如果你需要构建 Web 端，可以使用 `Node.js`，它是一个开源的服务端 JavaScript 平台。


    ## 它的替代方案有哪些？

    目前，`Java` 持续主导服务器和桌面开发市场。然而，关注目前流行的替代语言和框架是重要的。下面我们将查看一些最流行的替代方案。


    ## Swift

    当你考虑 `iOS` 和桌面的编程语言时，你可能会考虑 `Objective-C`，可能还会考虑 `Python` 或 `Ruby`。然而，这些语言是解释型的，如果你在使用最现代的开发技术开发桌面和服务器应用，你需要一种静态语言。


    其中一种语言就是 `Swift`。这种语言由苹果开发，包含了一些有趣的特性，如可选类型、包含 `check` 和 `assert` 等函数的标准库、一等函数语法等。它非常受欢迎，下载量超过
    9 亿次，并且在服务器、桌面和移动开发领域变得非常流行。


    `Swift` 仍然很年轻，版本 `1.0` 和 `1.2` 已经发布。最新版本是 `1.3`。`1.4.1` beta 版本现可用。


    ## Flock

    `Flock` 是一种静态类型编程语言，但在几个关键方面与 `Java` 非常不同。其中之一是它的语法，简单得多。它还具有面向对象的编程特性，如闭包和双向数据流。


    `Flock` 和 `Swift` 的主要区别在于 `Flock` 是开源的，并且与 `Swift` 不同，它可以同时用于服务器和桌面开发。


