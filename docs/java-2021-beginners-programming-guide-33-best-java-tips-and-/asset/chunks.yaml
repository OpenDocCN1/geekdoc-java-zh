    - `will be a if` 如果它不能置空。`Optional` 类型将对于空值返回 `Iterator`，对于任何 `Optional` 类型的值返回
    `Iterator`。

    - `the type will be for empty values and any value of type. ` 如果元素不存在或没有找到它的方法，`Array`
    将是一个 `TypeError`。

    - `for-all` 循环可以用于编写 for-a 循环的单个示例。


