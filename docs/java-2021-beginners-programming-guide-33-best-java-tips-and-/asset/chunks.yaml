- fmt: "\nThe `Optional` class is a complete replacement for `Option[T]`, the analog\
    \ of `Option[T]` in C#. Like `Option[T]`, `Optional.isEmpty()` returns false if\
    \ the given value is a `Nullable[T]` and true if the given value is a `Label`.\
    \ Note that the problem of implicit null references is no longer an issue with\
    \ `Optional`.\n\nAs a consequence, a method that could return false in `Option[T]`,\
    \ e.g. `List.empty()`, also returns false in `Optional[T]`:\n\n```java\nList possibleLocations\
    \ = new ArrayList < String>(); possibleLocations[0] = Optional.ofEmpty(); for\
    \ ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]\
    \ = List.ofNullable(new ArrayList < String>()); }\n```\n\nAn instance of `Optional[T]`,\
    \ like an instance of `Option[T]`, may be requested to contain a value by using\
    \ `Optional.withValue()`, like this:\n\n```java\nList possibleLocations = Optional.withValue(\"\
    Field1\"); for ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]\
    \ = Optional.withValue(new String(\"Field1\")) ; }\n```\n\nTo construct a derived\
    \ `Optional` instance, first, the field type is constructed with `Optional.ofType(Optional.ofType(String))`.\n\
    \n* `Optional.withValue(m -> m.getType() == Optional.ofType(Unknown))` converts\
    \ the value `m` to an `Optional[m]` instance. \n* `Optional.withValue(d -> d.getType()\
    \ == Optional.ofType(Unknown))` converts the value `d` to an `Optional[d]` instance.\
    \ \n* `Optional.withValue(m -> m.getType() == Optional.ofType(Unknown))` converts\
    \ the value `m` to a `Nullable[m]` instance.\n* `Optional.withValue(d -> d.getType()\
    \ == Optional.ofType(Unknown))` converts the value `d` to an `Optional[d]` instance.\n\
    * `Optional.withValue(null -> d.getType() == Nullable.ofType(Unknown))` converts\
    \ the value `d` to an `Nullable[null]` instance.\n* `Optional.withValue(null ->\
    \ d.getType() == null)` converts the value `d` to an `Optional[null]` instance.\n\
    * `Optional.withValue(d -> d.getType() == Nullable.ofType(Unknown))` converts\
    \ the value `d` to a `Label[d]` instance.\n* `Optional.withValue(null -> d.getType()\
    \ == None)` converts the value `d` to a `Label[None]` instance.\n* `Optional.withValue(null\
    \ -> d.getType() == Maybe.ofType(Unknown))` converts the value `d` to a `Label[Maybe.ofType(Unknown)]`\
    \ instance.\n* `Optional.withValue(d -> d.getType() == Maybe.ofType(Unknown))`\
    \ converts the value `d` to a `Label[Maybe.ofType(Unknown)]` instance.\n\nAnd\
    \ so on.\n\n`Optional` instances represent an arbitrary type parameterized by\
    \ a set of optional type parameters. For example, a `Tuple[A, B]` instance, a\
    \ class with a C# standard set of optional type parameters, could be constructed\
    \ like this:\n\n```java\nOptional<A, B> Tuple<A, B>(A a, B b)\n```\n\nAnother\
    \ example is a `String<A>`, or a class with Optional type parameters that are\
    \ not referenced by the standard set of optional type parameters, but that is\
    \ supported by Mono:\n\n```java\nOptional<Class, int> S(int a, int b)\n```\n\n\
    These types are strictly typed. If a type parameter of a constructor is inferred\
    \ to be an optional type parameter, a constructor with optional type parameters\
    \ and an implicit method reference will construct an `Optional` instance with\
    \ the value of the optional type parameter (in this case, the actual type parameter,\
    \ and not of type `Optional`).\n\nFor the actual constructor, the type parameter\
    \ is inferred (from the declaration of the constructor, or the type definition\
    \ of optional) to be a type parameter of type `Optional`. The value of the optional\
    \ type parameter is used as the default value.\n\nIn the case of functions, the\
    \ value of the optional type parameter is also used as the default value (as shown\
    \ above). This works like a static method or static field from Java, or a static\
    \ member from C++.\n\nWhen a class must specify an optional type parameter for\
    \ a constructor, an implicit type parameter to specify the constructor type parameter\
    \ is also inferred.\n\nConstructors without optional type parameters are not required\
    \ to construct an `Optional` instance. If the `Optional` type parameter is required,\
    \ no constructor without a non-optional type parameter is allowed. This is known\
    \ as an explicit constructor.\n\nNote that the members of a class that are not\
    \ referenced by an optional type parameter are, by default, required. If one of\
    \ the required members is not an optional type parameter, its default value must\
    \ be an `Optional` instance. (This will change, though, in the first point in\
    \ the series.)\n\n`Optional` types are not just for constructing types; they implement\
    \ other operations as well.\n\nThe constructor with an explicit type parameter\
    \ is called the implicit constructor. When a constructor is implicit, its default\
