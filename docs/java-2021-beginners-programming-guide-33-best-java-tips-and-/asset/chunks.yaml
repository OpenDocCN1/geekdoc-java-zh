    If you were to create an array of objects, you could have an item in the array
    with the same name as an item that is already in the array. If you then modified
    the original item, you would have to change the reference in your array.


    The problem with this is that once you modify an item, then the entire array is
    changed. Therefore, object-based data structures are less scalable than array-based
    data structures.


    In addition, the amount of space required to store a large object is usually a
    limiting factor with many large data structures. If you want to store a ton of
    large objects, you can use a big data structure such as a graph, hash table, or
    matrix.


    ## The best comparison that I can make is the following:


    ### Array-based

    Array-based objects can be very large in terms of RAM and disk space and have
    a lot of efficiency problems. One of the ways to solve these problems is to use
    a cache, which should keep all the data in memory. You can put the cache in a
    variable and then assign an object from the cache when you need the data.


    ### Struct-based

    Struct-based data structures allow you to define a structure and make some of
    its member variables private. Then, whenever you need a member variable you make
    it available via its interface so that you only have to apply it to the data structure
    and it doesn’t have to be passed around to all the members. It should be noted
    that this is sometimes a better fit for the structure and should not be used if
    you want to keep the structure private and allow each member to be updated independently
    of the whole structure.


    In other words, you can have a `Struct` as follows:


    ```

    struct Patient { String name ; Integer age ; String address ; } ;

    ```


    In this case, you don’t have to worry about the members being passed from one
    class to the next, but they are still available via their interfaces.


    Another advantage of struct-based structures is that they allow you to add an
    optional member to the data structure, which the object exposes via its interface.
    Therefore, you can have more than one component of a structured data structure,
    which means that they can be smaller than arrays.


    Array-based data structures offer very good performance, especially when you have
    very large objects that don’t need to be updated often, such as big databases
    or maps.


    Java has a very interesting data structure called the hash table, which is used
    for large-scale object-oriented databases. But, in Java, you need to implement
    it as an object-oriented data structure, which means that you need to make sure
    that each property of a data structure is separate from every other property.
    Also, you can’t make changes to a hash table class if a value that belongs to
