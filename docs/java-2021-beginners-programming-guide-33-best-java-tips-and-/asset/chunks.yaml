- fmt: '

    The root of a `Classpath Component Registry` is the application package, which
    specifies all of the component registries in a specific top-level directory. The
    root of a `Classpath Component Registry` has its `config.properties` file in the
    component registry, which defines its `config.xml` files and the layout of the
    folder.


    Although it may seem like a big step backward, a service manager, an IPC module,
    or a component layer with a service manager, an IPC module, or a component layer
    can also be added as a `Classpath Component Registry`.


    ## Database Component Registry


    The `Database Component Registry` is used by the `JDBC` driver. To register a
    database driver as a service manager, you need a repository to identify the services
    to the driver. The `JDBC` driver does not use the registry as the dependency registry
    for the drivers, but the registry is used by the `IOLib` API for the driver. The
    same goes for `SQL JDBC`.


    ## Message Component Registry


    The `Message Component Registry` is used by the `Hibernate Message Service`. As
    a basic example, an input annotation defines the value of a `Hibernate Query`,
    which triggers a `Hibernate Entry`. The following demonstrates a basic message
    component registry.


    ## What features for Java development?


    It includes the `JSR 336` security enhancements of the `JCP` standard. It also
    contains other changes and enhancements.


    It features a secure server model, `JAX-RS`. It is meant to give better security
    and privacy for HTTP calls, especially for `SSL` connections.


    JDK 9 also enables components for the forthcoming `HTTP/2`, `HTTP Basic Authentication`,
    and as an `HTTP header`. These components are already implemented in some environments,
    but they don’t have a proper `API` to make HTTP calls directly.


    The `DAL` (Data Access Layer) is a lightweight API to retrieve data from one or
    more `Java Persistence Units` (`JPA`, `Hibernate`, etc.).


    As of JDK 9, there is a new `Native Call API` to access the `FFI`. It will help
    in avoiding the problems of `JNI` and other `JNI` issues.


    Furthermore, there is a new session proxy and `JMX` (Java Monitoring and Eventing)
    `API`.


    ## Notable changes in JDK 9


    JDK 9 adds a new direct optimization pipeline for garbage collection. This pipeline
    is based on a new aggregate-collector design.


    Java SE 9 SP1 Update 9 or the “regular” SP1 is expected to be released in March
    2015. If SP1 is released earlier, JDK 9 might also be released with SP1.


    ## ProdJ99077 New features of JDK 9


    There are quite a few significant changes in the JDK 9 JDK. We summarize the significant
    changes here.


    - Memory reduction and performance improvements.

    - `Java™ Virtual Machine`

    - New Compiler: Small Improvements for Smart and Proxy Compilers


    The JDK 9 compiler has some optimizations for “smart compilers.” These include
    improvements for out-of-bounds array access, out-of-memory, and heap scans. They
    also include more and faster operator overloading. The compiler will now also
    optimize subexpression-elimination, type inference, and compile-time parallelism
    for compilers, particularly when moving to large compilers and static analysis
    tools.


    ## Improved Exception Handling


    This feature contains the type of exception handling that we will have in the
    future. It includes “like kind and reference exception handling.” The compiler
    will now use a derived type for `JavaBean` classes and fields, and whether they
    are default or not, when an exception is thrown.


    It also includes the proper handling of return values, which includes automatic
    conversion of return values to type and return values to any default. The `Type`
    system has been significantly improved, for instance, in `JVM` arithmetic calculations.


    - Performance improvements

    - Overhead Hinting


    This feature enables the profiling of the code for a particular exception class.
    The compiler will inject hints for various overloads of different `JavaException`
    classes, which are then evaluated when profiling the code. This feature is one
    of the most efficient in terms of performance.


    ## Separately Generated Type Hints


    It enables “separately generated type hints.” This is an experimental feature
    and, although it has seen quite a few bugs and issues, its performance has improved
    quite a bit. It will improve as we get more compiler feedback and feedback from
    applications using it.


    Also, the finalization order is checked and replaced, which improves the `jOOQ`
    database.


    ## Null Pointer Exceptions


    With this feature, if a value of a static class (such as `String`) has a null
    pointer, then the static class pointer value will be null. In that case, it is
    important to handle the null pointer and to do so correctly, as that can lead
    to `NullPointerExceptions`, which can be very expensive.


    Furthermore, this feature enables `if-else` clauses (that may contain an `else`
    block) to be used on finalizers as a keyword to avoid needless casts of any type
    during the call, as explained here.


    ## Optimizations


    Highly Parallel Linking for Generic File-Level Processing


    The implementation of JDK 9 implements a high level of parallelization for all
    types of generic file-level processing.


    However, when all programs run with the same prefix of `MIME` encoding, the situation
    becomes rather complex. This requires that the application passes a special configuration
    file to the JDK, using the (native) JDK’s `GzipPlugin`.


    The workaround to this problem is to send the configuration file using `HTTP`
    via the `TCP/UDP` library. This allows the application to set the default `MIME`
    encoder and cipher settings when it needs to.


    ## New Inline Function Generator


    Compilers are designed to generate code that is always as fast as possible. This
    is why optimizing compilers like `LLVM` optimize code in memory and perform code
    simplification. The new inline function generator from `LLVM` (previously called
    `Polymorphic inline function generator`) will perform such optimizations even
    on small programs.


    This will help boost the performance of languages like `CoffeeScript` and `TypeScript`
    that natively support languages that are compiled down to machine code.


    In the case of Scala, because Scala includes many functions that compile to native
    machine code, this feature will make Scala code faster when the function is rewritten
    to take advantage of its ability to optimize in memory (and also do code simplification).


    ## Null in type inference


    Type inference is crucial for any type of system because it can help avoid a lot
    of common runtime errors, such as null references. For instance, a null in a type
    inference error is simply a matter of how the type system can recognize when the
    null value is necessary and when it isn’t.


    So, several design decisions have been made by the Scala team to make type inference
    as accurate as possible.


    A null check is never generated for such types (this is something you can try
    to fix by manually setting the type in compile tasks). So, for such types, if
    you are unsure if the value of the item will be null, then you must pass an argument,
    such as a null value or a reference to another element in an array.


    If the types don’t support nullable values, then the value will be null even if
    you supply a string value to the method that returns the value (but you may pass
    in a null parameter to that method as well, just so you’re not forced to be explicit
    about what value to return).


    This means that, unlike languages like `JavaScript`, `C#`, and `Java` where you
    need to be explicit about what you mean by null, in Scala, you must think in terms
    of nullable types. This is a disadvantage when some of these types are represented
    with primitive types, but the upside is that type inference in Scala is so good
    that this type of issue is very rare.

