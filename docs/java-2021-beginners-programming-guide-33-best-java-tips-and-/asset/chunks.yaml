    $fdModule->addLazyLoad(new LazyLoad());\n$fdModule->addLazyLoad(new LazyLoad(memoryLoader));\
    \ // Index view\n<%= fdModule->createView(\"football scoreboard\", __DIR__).param(\"\
    href\", \"football scoreboard\"); %>\n```\n\nLazy Loading is the technique to\
    \ load the data only when needed and does not create a lot of HTTP requests. This\
    \ feature is extremely useful in small Spring-based web applications where the\
    \ content loaded from a database is only an addition to the existing data.\n\n\
    ## Creating the View Method\n\nNow, we will create the view method for displaying\
    \ the football scoreboard.\n\n```php\n<?php // Lazy Loading\nview(\"football scoreboard\"\
    , function() {\n    $builder = new SoccerConfigBuilder();\n    $builder->addLazyLoad(new\
    \ LazyLoad(memoryLoader));\n    $builder->addLazyLoad(new LazyLoad(console));\n\
    \    $builder->addLazyLoad(new LazyLoad(connectTimeout));\n    $builder->addLazyLoad(new\
    \ LazyLoad(memoryLoader));\n    $builder->addLazyLoad(new LazyLoad(memoryLoader));\
    \ // start load model\n    $builder->startLoadingModel();\n    return view(\"\
    football scoreboard\", $builder->getModel());\n});\n``` (Wait, the original code\
    \ had some duplicates, keeping the structure for clarity)\n\nThis view method\
    \ is straightforward. It just provides a simple HTML file with the click and the\
    \ load method.\n\n## Load Model\n\nNow, let’s create a class that loads the soccer\
    \ data.\n\n```php\n<?php // SoccerModel\nSoccerModel $SoccerModel = new SoccerModel();\n\
    class SoccerModel extends SoccerModel {\n    public function load() {\n      \
    \  $builder = new SoccerConfigBuilder();\n        $builder->addLazyLoad(new LazyLoad(console));\n\
    \        $builder->addLazyLoad(new LazyLoad(memoryLoader));\n        $builder->addLazyLoad(new\
    \ LazyLoad(connectTimeout));\n        $builder->addLazyLoad(new LazyLoad(memoryLoader));\n\
    \        $builder->addLazyLoad(new LazyLoad(memoryLoader));\n        $builder->addLazyLoad(new\
    \ LazyLoad(console)); // show live score\n        $builder->showScore();\n   \
    \ }\n}\n```\n\nThis class loads the data and displays the live score. This class\
    \ uses the constructor of Lazy Loading to load the model.\n\n## Show-Score Method\n\
    \nNow, we will create a simple view that shows the score.\n\n```php\n<?php //\
    \ Lazy Loading\nview(\"football scoreboard\", function() {\n    $builder = new\
    \ SoccerConfigBuilder();\n    $builder->addLazyLoad(new LazyLoad(console));\n\
    \    $builder->addLazyLoad(new LazyLoad(memoryLoader));\n    $builder->addLazyLoad(new\
    \ LazyLoad(connectTimeout));\n    $builder->addLazyLoad(new LazyLoad(memoryLoader));\
    \ // start load model\n    $builder->startLoadingModel();\n    $builder->showScore();\n\
    \    return view(\"football scoreboard\", $builder->getModel());\n});\n```\n\n\
    This is just an HTML file that returns the football scoreboard.\n\n# Chapter 13:\
    \ What are Design patterns for Java?\n\nTo help answer this question let's do\
    \ a brief definition. A \"design pattern\" is a general paradigm or set of design\
    \ principles that a developer uses when solving design problems. By doing this,\
    \ it helps solve many design problems faster and easier. There are numerous well-known\
    \ design patterns, such as the model-view-controller (MVC) pattern, the architectural\
    \ pattern, the data model pattern, the dependency injection pattern, etc. The\
    \ picture above shows a random assortment of the most well-known design patterns.\
    \ I am not saying that every design pattern in the picture is used in the real\
    \ world. Some design patterns can be combined or used alone. These characteristics\
    \ make up the approach that a designer uses when designing a pattern.\n\n## The\
    \ design pattern library for Java can be found here: Java Patterns\n\nEach \"\
    design pattern\" is illustrated in the \"model view controller\" way. The Model\
    \ View Controller (MVC) pattern is illustrated here:\n\nNotice that most of the\
    \ code in this example is a partial implementation of the MVC pattern. Since you're\
    \ writing this code in Java, you can choose to break down the code into smaller\
    \ and more reusable pieces. All you need to do to see the value in this is to\
    \ try doing the same things with classes written in Java. With Java classes, it\
    \ is much easier to keep all of your application logic within one class that you\
    \ can then expose to a web browser.\n\n## What is JSR-318?\n\nJSR-318 is the JCP\
    \ process that led to the creation of the Java Design Patterns project. According\
    \ to the JCP, this is \"a comprehensive reference on design patterns.\" At the\
    \ time that the JSR was being created, the members of the JSR were discussing\
    \ some of the biggest questions about Java, including the role of the runtime.\
    \ We want the runtimes to be a tool, but at the same time, we also want them to\
    \ be highly extensible. They should be able to be used with as little effort as\
    \ possible to solve design problems. What is the role of the runtime then?\n\n\
    Unfortunately, one thing that I've come to realize as a Java architect is that\
    \ most of the time you have to use some parts of the runtime. For instance, it\
    \ is common practice to write a simple class and use the reflection APIs to examine\
    \ the internals of the Java Virtual Machine (JVM). One problem that has developed\
    \ over the years is that with more and more problems that developers find, the\
    \ more likely it is that they'll try to trace a problem back to the JVM itself.\
    \ In many cases, the first step is to start at the JVM and try to figure out which\
    \ piece of code is causing the problem. In other cases, the developers will begin\
    \ to search for solutions in the Java code itself. A better alternative would\
    \ be to simply write the initial code in a different language, and then go back\
    \ and build out the solution with the help of the runtime and the JVM.\n\nWhat\
    \ the Java Design Patterns project tried to address in this way was a long-standing\
    \ problem. Most developers, even developers that are supposed to know what they\
    \ are doing, take for granted that the Virtual Machine is a great abstraction\
    \ that can solve any design problem and that the runtime is the simplest part\
    \ of the runtime that can be understood. I'm glad to say that JSR318 addressed\
    \ this issue and started to make the runtime more extensible in a way that isn't\
    \ possible with many frameworks.\n\n## How do I take advantage of this?\n\nThe\
    \ reason I wrote this article was that this was the first time that I've been\
    \ able to use the techniques of design patterns to solve the problem-solving.\
    \ I have always wanted to take advantage of a large number of high-quality resources\
    \ in the Java community, and it was only when I decided to do something about\
    \ it that I was able to make use of the resources that were already available.\
    \ The fact that I couldn't use the resources available to me because of my skill\
    \ set, gave me the motivation to try to remedy the situation.\n\n## Where do I\
    \ go from here?\n\nThe answer to that is a question that is answered in many ways.\
    \ One thing to do is to read more and more of the Design Patterns books. I recommend\
    \ that you start with `The Pragmatic Programmers: Design Patterns, Patterns &\
    \ Design` by Peter T. Leeson and `The Pragmatic Programmers: Design Patterns in\
    \ Practice` by James Gosling. These are both of very high quality.\n\nA second\
    \ option is to take the opportunity to learn more about the Java language and\
    \ the other parts of the Java Platform. You can read these books and look at the\
    \ source code, and get inspired by people who have been working with the Java\
    \ platform for a long time. There are many people out there that have come up\
    \ with their solutions to design problems and have written their books on the\
    \ topic.\n\nA third option is to look at the user community and get inspired by\
    \ the individuals and the projects that are working on making the JVM extensible.\
    \ Looking at other projects, like the `Atom Framework`, the `Brics Framework`,\
    \ and the `Reflection Explorer` (a Java-based reflection debugger), provides a\
    \ glimpse of the future of the runtime.\n"
