    最后，当你点击“新建”（New Source）按钮时，项目就会创建。然后，你可以添加一个源文件夹和一个新包。我将在接下来的步骤中详细讨论这一部分。


    ## 如何向我的 .NET 项目添加源文件夹？


    要向你的 .NET 项目添加源文件夹，你需要点击项目向导中的“添加项目”（Add Project）选项。它还会显示添加源文件夹的步骤。接下来的部分将为你提供向项目添加源文件夹的详细步骤指南。


    在“项目配置”（Project Configuration）屏幕上，有两个任务：

    - 添加源文件夹。

    - 添加新包。


    要添加源文件夹，点击 `Add Source Folder` 选项。要添加新包，点击 `Add a new Package` 选项。现在，使用菜单添加源文件夹和第一个包。然后，点击
    `OK` 按钮。它会要求你确认更改。点击 `OK` 按钮查看新的源文件夹和新包。


    ## 如何使用 Eclipse 为我的 .NET 项目添加源文件夹？


    要在 Eclipse 中为你的 .NET 项目添加源文件夹。要添加源文件夹，请添加一个新的源文件夹。右键点击新的源文件夹并点击“创建文件夹”（Create
    folder）。创建新源文件夹后，点击 `OK`。这一次，无需使用 `Add a new project` 选项，你只需选择 `Add Package`。在你添加源文件夹和第一个包后，点击
    `OK` 按钮。这意味着你也可以用 Eclipse 为项目添加源文件夹和包。


    ## 如何使用 Visual Studio 为我的 .NET 项目添加源文件夹？


    要向你的 .NET 项目添加源文件夹，请点击项目向导中的 `Add a New Project` 选项。首先，它会询问你是否要使用之前创建的项目模板。它将向你显示下一步。点击
    `Add a source folder` 按钮。


    如果你勾选了 `Add a source folder source of type X` 复选框，它将创建一个包含类型为 `X` 的源文件夹文件夹。点击
    `OK` 按钮添加第二个源文件夹。点击 `OK` 按钮添加第二个源包。


    # 第 4 章 Java 和 Javascript 是一样的吗？


    极有可能，它们会非常相似，因为如果说有什么的话，它们将是你最初接触互联网的好地方，比如回到世界的中心。但如果你发现一些非常明显的区别，也不要惊讶。


    在非常基础的层，Javascript 和 Java 的区别在于，当 Javascript 在计算机上运行时，它会访问操作系统的一个称为“网络堆栈”（network
    stack）的独立并在并在上运行。Java 版本将在标准的操作系统（即操作系统）上运行。Javascript 运行时与运行在 Java 上运行时，你的计算机行为在语义上存在差异。


    这些语言会非常相似，但在实际理解业务及其运行细节的语境下，这些语言在语义上会有不同。如果你在经营业务，你将执行更多高层次的任务，该语言的语法与你作为开发者世界中的爱好者使用该语言时会非常不同。


    ## 我应该先学什么？


    在 Javascript 的情况下，你可能对它的编程感兴趣是因为 Google 处理其搜索的方式。Javascript 的基本函数与 Java 非常相似，你能够创建带有参数的函数、获取函数结果并返回函数，这些都是类
    Java 的构造。


    你还应该考虑 Javascript 还有另外两个 Java 没有的“技巧”，即闭包（closures）和匿名函数（anonymous functions）。闭包是一种定义块的方式，该块无法以任何方式访问，但你可以在另一个函数或栈上的另一个块中访问它；匿名函数是另一种形式，函数将返回一个值，但它不会以任何方式绑定到全局作用域，以便下一个函数可以调用该函数，依此类推，你可以非常自然地传递变量。这些都是
    Javascript 的基本构建模块。


    你还会看到越越小的表达式函数，这些在 Java 中被称为 lambdas，在 Javascript 语境下将是函数，它们允许你执行与 Java 方法非常不同的事情，在
    Java 中，你无法像在 Javascript 中那样通过函数传递变量。


    但很多时候，如果你对 Javascript 的唯一接触仅于 Google 搜索以及在 Stack Overflow 等地方阅读关于该语言的文章，你会看到很多小而常见的
    JavaScript 模式，你会很快开始学习它们，随着你理解和熟悉程度的增加，真正的基础语法和语言特征将复杂得多，如果你不了解语言中更小、更简单的部分，将无法理解这些内容。


    我的经验是，在某一点，无论你学习 Javascript 多久，无论你写多少代码，你都会遇到必须阅读别人代码的时刻，这可能需要你花费一段时间。但大多数情况下，如果你现在开始学习
    Javascript，我建议你从学习一些 Javascript 中没有的编程语言开始，以帮助建立基础。


    ## Java


    另一方面，Java 是一种在设计时考虑了运行非常庞大、非常多样且非常复杂的系统的需求的语言。事实是，并不是所有人都需要用 Java 设计和实现自己的定制系统，这对于许多企业来说确实如此，但对于个人开发者来说，这并不是所有重要的。事实上，对于个人开发者来说这并不重要，但作为一个程序员，你还是会想要学习
    Java，因为 Java 是开发者学习的语言中最强大、最成熟、最受推的。


    Java 不是创建网站的工具。许多人（包括 Google）已经放弃了用 Java 编写网站的想法，他们将使用 HTML 引擎或者 PHP 之类的。但你不应该用
    Java 写网站。你不应该用 Java 设计网站，你不应该用 Java 编写应用程序，你应该使用 Java 来编写比个人网站更大、更复杂的应用程序。


    Java 拥有非常全面的 API。因此你可能需要的各种库和 API 都已经包含了，例如网络部分，包括 Netbeans 开发环境。这一切最重要的部分是，只要你下载了
    Java 副本，就可以创建一个新的 Java 虚拟机或独立进程，允许你在编写代码的同一个浏览器窗口中运行 Java 代码。


    在 Web 开发语境下，你会希望这样做。因此你将使用 `JDK`（Java 开发工具包）来下载虚拟机。如果你熟悉 Windows XP，你将需要制作第二个
    `CD`，并在计算机上安装该 CD 以及所有你需要的工具。这个过程与你安装 Windows 虚拟机的过程几乎相同，区别在于你需要为计算机添加一些驱动程序，以便它识别你正在安装的虚拟机。


    一旦你制作了这两个 CD 或 DVD，你就可以准备就绪，现在你可以在为 Windows、Mac OS X 或 Linux 开发的相同环境中编写 Java。字符串、数字、变量、lambda
    函数、迭代、if 语句等内容的语法在这些其他平台上几乎相同。

