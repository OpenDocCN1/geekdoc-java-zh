    add ( null ); for ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]
    = toIsTodo; }

    ```


    可选集合的每个可能值都在固定大小的数组中。


    如果将 `Optional[T]` 传递给方法，该方法在尝试将其转换为不同类型之前，必须首先确保给定值是该类型的可能值。如果方法没有将给定值转换为不同类型，则方法返回
    `null`。如果方法没有尝试将给定值转换为不同类型，方法也可能返回 `null`。


    以下示例为 `Optional[String]` 分配了一个 `Object` 类型的项：


    ```java

