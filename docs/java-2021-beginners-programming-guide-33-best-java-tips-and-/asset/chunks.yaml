    Java 是一种为生产级应用程序设计的语言，最重要的是，事实证明，商业应用程序与工具类应用程序之间几乎没有区别。工具类应用程序非常常见且成功，一旦你开始，开发这些应用程序对你来说不会是一个巨大的障碍。工具类应用程序在某种程度上被设计为一次性的，这没关系，但它们不是那种会一直伴随你的应用程序。


    关于 Java 每个人都需要知道的最重要的一点是，Java 是一个通用可用并公发的开源软件包，这与我们之前经历的 Java 版本（例如具有专有属性的 `J2EE`）相比是一个巨大的变化。Java
    是太阳微系统公司（Sun Microsystems）战略计划的重要部分，该计划旨在通过其虚拟机（Virtual Machine）启动并运行其开源策略。


    重要的是，太阳微系统公司在开源许可下发布了 Java，这意味着任何使用 Java 代码的人都可以对其进行修改，并以任何他们认为合适的方式使用它，而无需向太阳微系统支付使用费用。


    你甚至可以修改代码并将其作为你的版本发布，或者修改它来开发针对其他编程语言（如 `C++`）的插件，他们将其称为“Java Native Interface”（Java
    原生接口）。因此，Java 可以被其他语言使用。如果你使用另一种语言（如 `C`）编写插件，那么你在 Java 中使用的对象模型直接源于你在 `C` 中开发的对象模型。Java
    编译器只是该对象模型的前端。


    太阳微系统公司制作了一份非常好的演示文，展示了这一切是如何运作的。在他们为推广 Java 而制作的 YouTube 视频中，我将其嵌入在文章的底部。


    网络上有大量的文档，但当然，如果你想学习所有内容，就得自己去阅读，所以这里有一些提供相关信息的网站。


    还有一本由 Web 设计师 Jeff Atwood 写的优秀书籍，Jeff Atwood 创建了一个关于如何设置 Java 开发环境的完整、循序渐的教程。


    ## 给 Java 开发者的一些建议


    如果你是一名 Java 开发者，我为 Java 开发者提供了几个不同的建议。你可能想在笔记本电脑上尝试 `JRE`，而不是使用系统的 Java，这样如果你的网络连接缓慢或机器出现问题，你的
    Java 应用程序就不会受到这些的影响。


    如果你是一个与团队工作的 Java 开发者，或者你计划加入一个团队，你可以做的最重要的事情之一就是理解 `JRE` 支持的所有不同编程语言。有五种符合 Java
    标准的编程语言可以用于开发 `JRE` 应用程序，我将它们列在文章底部。它们是：


    * `C`

    * `Haskell`

    * `Groovy`

    * `JavaScript`

    * `Java Servlet` 和 `JSF`


    如果你与团队一起工作，你将希望这些所有内容放在一个项目目录中，然后你希望把刚刚下载的 `JRE` 添加到该项目目录，该项目将成为该团队内开发的默认应用程序。


    你会发现每种语言都已放置在项目内部各自的目录中。


    使用了六个函数来实现一个 `JRE` 应用程序的构建过程。它们被称为 `jar` 文件。创建 Java `jar` 文件的过程被称为“编译”，这意味着它正在编译一个
    `JAR` 文件，即具有 `JAR` 扩展名的 jar 文件。


    但这里是你需要知道的：你可以使用包含在 `JRE` 中的任何语言。


    唯一的要求是你的计算机上必须安装了 Java 编译器，并且为了使用 `JRE`，你需要一个在 `JRE` 内部使用的 Java 应用程序。


    在这个示例中，我们在后端有一个导入 `SQL` 表的数据源。我不会详细介绍我一直讨论的特定数据源，因为关于这那里有很多很棒的信息。


    图表还显示了一个 `JavaBean`，它只是 Java 类的封装器，它有一个全局的“Bean”作为类名。


    这个特定的 `JavaBean` 类有一些方法，这些方法在这里都已清晰地列出，但如果我逐一解释所有方法的作用，我可能会将它们分成三个不同的页面，因为它们是三个独立的
    Java 类。


    我将在这里使用一些简单的 Java 代码来演示它是如何运作的。`JavaBean` 类中名为 `contains` 的方法是类中的一个简单成员函数。该方法在数组中包含一个
    `String`。


    如果你运行该示例程序，将打印出以下信息：


    * `http://localhost/jdbc/items?table=items&stored_entity=com.JMCallback.com.bqn.my_name.co_item`


    关于这个 `JavaBean` 你只需要知道这些就了，但如果你在 `IntelliJ` 中查看它，它看起来是这样的：


    在上面的 `JRE` 项目文件中，你可以看到 `JavaBean` 类的第二部分，它被称为 `java.jdbcCache`，是一个存储在静态数据文件夹中的
    Java 类。


    当这些数据导入到 `JavaBean` 类时，它被插入到单独的静态类中。


