    Of course, we can’t use this idea for the `TypeBuilder` interface that is part
    of the `System.IO.Type System`. As such, we have a choice: either we can expand
    the `System.IO.Type System` classes (in a similar fashion that it was expanded
    with the change from `Connection` to `ConnectionBuilder`) to support more types,
    or we can add a specific design that would require developers to explicitly specify
    what kinds of the type they are using.


    ## Structural improvements


    The other big topic that came up during the discussions was the ability to make
    structural changes to the `TypeBuilder` interface. Currently, these changes are
    only supported on the `WFT` and `TypeProvider` interfaces, but we would like to
    expand this support to many of the other types, such as the `WCF-type providers`.


    Right now, if the user chooses to replace the built-in type, they are forced to
    remove it from the `TypeBuilder` interface. To use a type that has not been defined
    on the interface, they would need to provide an extra constructor argument.


    This is a nice feature when you’re working with the `WCF` providers, but it becomes
    more complicated when you have a type that already exists in the tooling. For
    example, we may have a type called `CustomType`, which is implemented in the `TypeBuilder`
    interface, but the type is already defined on the `WCF` providers. This can be
    considered a separate “type” and should be treated as such. If the user were to
    change the `TypeBuilder` interface, they would need to modify the types that they
    are using, since their constructor argument would need to be different.


    So what are some possible solutions for this? One of the ideas is to change the
    `TypeBuilder` interface so that instead of providing a constructor for the types
    that do not currently exist on the interface, you provide a constructor for the
    type in question, which has a method signature that allows for different types.


    Another idea is to implement the constructor for the type so that it provides
    the constructors for all of the interfaces that it can be used with, and then
    the user should be able to do the right thing.


    # Chapter 6 How to learn Java programming language


