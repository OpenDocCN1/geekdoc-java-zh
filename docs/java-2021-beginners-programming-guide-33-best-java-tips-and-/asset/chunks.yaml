    Java 有两种特殊类型的 for 循环。for-each 循环是 for 循环的默认形式。for-all 循环是一个为给定大小的数组生成单个迭代器的函数。for-all
    循环是 for-a 循环的常见形式。


    ### Java 代码中的每个 For 循环


    ### Java 代码中的每个 For-All 循环


    你可以将 `Integer` 对象的数组想象成头部在左、尾部在右的栈。`Integer` 对象是一个 `Integer` 对象的链表。`Integer` 对象是一个
    `Integer` 对象的链表。在以下代码中：


