    Java is a language that is designed for production applications and most importantly,
    as it turns out, there’s very little difference between a commercial app and a
    utility application. Utility apps are very common and very successful and the
    need to develop those applications is not going to be a huge hurdle for you once
    you get started. Utility applications are sort of designed to be disposable and
    that is okay, but those are not apps that are going to stay with you.


    The most important thing about Java that everybody needs to know is that Java
    is a generally available and publicly released open-source software package, and
    that is a big change from what we’ve experienced with previous versions of Java,
    such as `J2EE` which was quite proprietary. Java is an important part of Sun Microsystems’s
    strategic plan to get its open-source strategy up and running with its Virtual
    Machine.


    It is important to understand that Sun Microsystems released Java under an open-source
    license, which means that anyone who uses the Java code can make changes to it
    and use it in any way that they see fit without paying Sun for that use.


    You can even modify the code and release it as your version, or you can modify
    it to develop what is called a plugin for other programming languages, such as
    `C++`, and they call that a “Java Native Interface`. So Java can be used by other
    languages. And if you’re using another language, such as `C`, for your plugin,
    then the object model that you’re using in Java comes directly from the object
    model that you’re developing in `C`. The Java compiler is simply a front end for
    the object model.


    There’s a very nice presentation that Sun Microsystems put together that shows
    how that all works. In the YouTube video they''ve put together to promote Java,
    I’ve embedded it at the bottom of this article.


    There’s a huge amount of documentation on the web, but of course, if you want
    to learn all of that you’ll have to read it yourself, so here are some sites that
    provide some information.


    There’s also an excellent book that was written by Jeff Atwood, a Web Designer,
    and Jeff Atwood created a complete, step by step, tutorial on how to set up a
    Java Development Environment.


    ## Some tips for Java developers


    I’ve got a couple of different suggestions for Java developers if you’re a Java
    developer. You might want to try a `JRE` on your laptop, instead of using the
    system Java, so that if your internet connection is slow or the machine is having
    problems, your Java app isn’t going to be impacted because of that.


    If you’re a Java developer working with a team, or you’re planning to join a team,
    one of the most important things you can do is understand all of the different
    programming languages that are supported by the `JRE`. There are five different
    Java-compliant programming languages that you can use for developing `JRE` apps,
    which I’ve listed for you at the bottom of this article. They are:


    * `C`

    * `Haskell`

    * `Groovy`

    * `JavaScript`

    * `Java Servlet` and `JSF`


    If you are working with a team, you’ll want to put those all together in a project
    directory, and then you’ll want to add the `JRE` you just downloaded to that project
    directory, and that project is going to be the default application that’s going
    to be developed within that team.


    You’re going to see that each of those languages has been placed into its directory
    within the project.


    Six functions are used to implement the build process for a `JRE` app. They’re
    called `jar` files. The process of creating a Java `jar` file is called “compiling”,
    which means that it’s compiling a `JAR` file, which is a jar file that has a `JAR`
    extension.


    But here’s what you need to know: You can use any language that’s included with
    the `JRE`.


    The only requirement is that you’ve got to have a Java compiler installed on your
    computer, and to use the `JRE` you’ll need to have a Java app that you’re using
    within the `JRE`.


    In this example, we’ve got a data source in the back end that’s importing `SQL`
    tables. I’m not going to go into any great detail about the specific data source
    that I’ve been talking about, because there’s a lot of great information out there
    about this.


    The diagram also shows a `JavaBean`, which is just a wrapper around a Java class,
    and it has this global “Bean” that’s going to be the class name.


    This particular `JavaBean` class has some methods, which are all clearly outlined
    here, but if I were to go through and explain what all those methods do, I’d probably
    break it up into three different pages, because they are three separate Java classes.


    I’m going to use some really simple Java code here to demonstrate how this works.
    The method called `contains` within the `JavaBean` class is a simple member function
    within the class. This method contains one `String` in an array.


    If you were to run the sample program, the following information would be printed
    out:


    * `http://localhost/jdbc/items?table=items&stored_entity=com.JMCallback.com.bqn.my_name.co_item`


    That’s just about all you need to know about that `JavaBean`, but if you were
    to take a look at this in `IntelliJ`, here’s what it would look like:


    In the above `JRE` project file, you can see the second part of the `JavaBean`
    class, which is called `java.jdbcCache`, and is a Java class that is stored in
    a static data folder.


    When this data is imported into a `JavaBean` class, it’s inserted into a separate
    static data folder, and then this class is known as the `JRE` Cache class.


    Within this `JRE` Cache class, which is stored inside of the `/resources` folder,
    we have all of the methods that we’ve seen in the previous `JavaBean` class.


    The first method within the `JRE` Cache class is called `loadFromCache`. This
    method has the following parameter that’s going to be filled in with the name
    of the `JavaBean` class that you want to be able to load into a `JRE` Cache.


    You can use the `application:directory` feature within `IntelliJ` to select from
    the application folder where you’ve been running this Java app, and you can choose
    the file `application/com.jmcallback.jdbcCache`. If you chose this file, then
    this will be the name of the `JavaBean` class that you will use to reference when
    you’re creating the `JRE` Cache file within the `JRE` Cache project file.


    The second method within the `JRE` Cache class, which is called `setContentDirectory`,
    and has the following parameter that’s going to be filled in with the name of
    the directory where you want this `JRE` Cache file to be placed.


    If you chose the `JRE App` folder, then you would just go ahead and navigate to
    the `application` directory.


    If you chose the `java.jdbcCache` directory, then you would be able to navigate
    to the `JRE Cache` directory within the `java.jdbcCache` directory.


    So in the above, the `application` directory has a class called `JRE`, and the
    `java.jdbcCache` directory has a class called `JRECache`. If you looked in the
    folder `application` within the `JRE` directory, you would have seen a class called
    `java.jdbc.JdbcCache`. So here, this particular class has two fields, `name` and
    `url`. When you call the `name` field, then you’re going to be able to fill in
    the name of the `JavaBean` that you want to load into this `JRE` Cache file.


    The `url` field, here, will be something that we will modify later on in the article
    to put in a path to a website where we will be able to get the `JRE` Cache file,
    and this will be stored in the `application` directory of this particular `JRE`
    Cache file.


    The third method within the `JRE` Cache class is called `getRequestCacheDir`.
    This method has the following parameter, and it’s going to return a directory
    that you can navigate to for accessing the `JRE` Cache file.


    If you chose to select the `JRE App` folder, then you will be able to navigate
    to the `JRE App` folder, and you would have a directory named `application/com.jmcallback.jdbcCache`.

