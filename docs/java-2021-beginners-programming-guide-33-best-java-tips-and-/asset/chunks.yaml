    Note that we can use the keyword `type` to specify a type that contains all the
    values we want to convert to `Tuple`:


    - `Tuple<String, int> t = t.withType(Int);`

    - `Constructor.withType(Tuple<int, String>, AnyType)` constructs a tuple of `int`
    and `string` values.


    The `with-type()` keyword, like `withType()` and `implicit-methods()`, can be
    used only in constructors. For instance, the following constructors are implicitly
    defined:


    - `public static void constructor() { }`

    - `myConstructor()`

    - `withType(Tuple<int, int>, string>, AnyType)`

    - `withType(Tuple<int, string>)`


    With the `withType()` keyword, a parameter type is used to describe what type
    of constructor to call and the default value for the default constructor. It has
    the following syntax:


    - `withType(Tuple<int, int>, Tuple<string, string>, AnyType), AnyType)`

    - `withType(Tuple<int, int>, Tuple<string, string>, AnyType)`


    The keyword `withType()` is sometimes used as the default argument parameter (`implicit
    type`) for a new constructor (`explicit type parameter`) in which the default
    type is a generic type, such as:


    - `public Tuple<int, string>, Tuple<string, string>, AnyType> tupleWithType(string)`


    We will refer to `withType()` in this paragraph as an optional type to emphasize
    that it can be used only for optional type parameters and is used as such. When
    the keyword optional type parameter is used as the default argument type for a
    new constructor, then it refers to the optional type parameter in the argument
    list. In a block, the keyword optional type parameter is used the following way:


    - The argument list of the new constructor:

    - `type of new constructor;`

    - `type-implicit-methods()` introduced an optional parameter type in a function
    expression, which is usually used in the argument list for the return type:


    - `variable typeParam1 arg1;`

    - `variable typeParam2 arg2;`


    This optional value parameter is not a formal parameter of a function expression.
    It cannot be passed to the function expression or called from it. A parameter
    with a type parameter may be either a literal parameter or a local variable whose
    value has to be assigned to a variable, which is referred to as binding. The documentation
    of the variable parameter can be seen in a form like this:


    - `LocalVariable parameter1; localVariable parameter2`


    Example:


    - `variable typeParam1 arg1; variable typeParam2 arg2; foo(variable typeParam1
    arg1); foo(localVariable typeParam2 arg2)`


    Notice that the variable `typeParam1` is not a formal parameter of a function
    expression. The result of the above two expressions is:


    - `typeParam1: int;`

    - `typeParam2: string;`


    Therefore, the variable `typeParam1` is not binding. However, the expression `foo(localVariable
    typeParam2 arg2)` is not binding because the type parameter is not binding. The
    result of `foo(typeParam1 arg1)` is:


    - `typeParam1: int;`

    - `typeParam2: string;`


    Neither type parameter has been used in a function expression. If a function expression
    was evaluated, the result would be:


    - `typeParam1: int;`

    - `typeParam2: string;`


    Therefore, the variable `typeParam2` has to be assigned to a local variable (i.e.,
    an unbound local variable), which can be referred to as a binding. A local variable
    can be identified using the `variable-name-of-the-variable` syntax. The type parameter
    of the `parameter-name-of-the-variable` syntax is a formal parameter, in contrast
    to the variable type parameter.


    # Chapter 10 What is Java string handling?


    Without a doubt, one of the biggest factors to why Java has some issues scaling
    to several GPUs/customization of the most basic things like string handling. I
    will give a rundown of what I feel is Java’s weakness in using a low-level, generic
    function. This is one of the points where the main use of generics shines, as
    you can use them when it makes sense and when it doesn’t.


    Java strings are a rather tricky beast since there are several different string
    handling options:


    - `java.util.String`

    - `Java 7 String Types`

    - `Java 8 String Operations`

    - `Java 9 Regular Expressions`

