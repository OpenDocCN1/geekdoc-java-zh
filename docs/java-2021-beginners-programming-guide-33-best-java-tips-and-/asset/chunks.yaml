  trans: '

    习惯用函数式处理事务的人会说，函数式语言更难学习，因为你必须以函数式的方式思考。函数式语言可能更容易学习，但也可能更难使用。`Java` 中也有这种倾向。


    是的，我确定它们确实如此，但函数式编程的好处在于，你之所以必须那样思考，是因为函数式语言更具限制性。`Java` 并不关心这一点。就像 `Java` 并不关心并发一样，在
    `Java` 中，你不能拥有惰性操作，不能拥有纯函数。它们都是 `Java` 语言的一部分。


    你必须了解一些函数式编程。我建议你在读一些书籍时，建议你学习一些像 `Clojure` 这样的函数式语言。如果你想学习 `Clojure`，我建议看《Clojure
    for the Joke》这本书，或者其他一些教 `Clojure` 的书。


    `Clojure` 是另一个例子，人们在 `Clojure` 上遇到困难的原因之一是因为他们习惯了命令式语言。


    `Java` 更加通用，`Java` 是一门通用语言，它可以做任何事情，但人们看到它是一种函数式语言就都非常兴奋。但你用它什么也做不了。


    然后你看一个 `Java` 库，你会发现它们不是函数式的。如果它们像 `jQuery`（一个用于 `JavaScript` 的库），而 `JavaScript`
    有很多函数式库，人们也会也喜欢那些。如果你看 `Erlang` 项目，有很多这样的。当你在使用 `Erlang`（一种函数式编程语言）时，你有许多针对 `Erlang`
    的函数式库，但它们并不真正属于 `Erlang` 内部。


    函数式程序员有一个庞大的社区，但你作为开发者并不会看到很多他们。他们更像是创新者。


    我们在 `Erlang` 中有很多这样的人，他们会提出新想法。他们提出新功能并实现它们，也许以后其他人会使用它们。也许他们有一家较小的公司，客户想要一个新功能，他们就会去实现它并可能卖掉这家小公司。


    所有这些想法都在那里，这就是本质，也是大多数编程语言的本质。


    函数式编程也是如此。这并不意味着它比命令式编程更重要。你在函数式语言中编写程序和在命令式语言中编写一样好。这只是意味着如果你学习了函数式编程语言，你的编程技能将会提高。


    这取决于你想做的事情，但如果是由函数式编程驱动的，你可能会获益。你会学到函数式编程。它会提高你的沟通能力。它让你能够更高效地构建这些东西，因为你对传统编程实践的依赖会更少。


    噢，我想有过孩子的人会理解函数式编程的重要性。这是理所当然的，当你有了孩子，你会想要有一个程序，你会想要花一些时间陪伴它。


    我记得 20 世纪 70 年代我在多伦多大学时生了一个孩子，那时候还没有微型计算机这种东西。我们使用学生会里那些小而奇怪的电脑，用它们编写程序。我们当时编写的程序并不是为微型计算机设计的，我们只是用汇编语言写的。


    但现在，你有用 `C++`、`Java` 或 `C#` 编写的程序，你必须运行它。它是一个机器语言程序。你必须把它转换成机器语言。你在编写的汇编程序中的所有错误，都会把机器语言中的程序搞乱。


    回到函数式编程，你的代码在栈上。你有一个栈，你有几个想在栈上运行的函数。你说：“我想把这些函数放在栈上。”它们的顺序不对没关系。重要的是：“它们在什么顺序上？我该如何解释它们？”在你解释它们之前，你并不知道这一点。


    这迫使你写出无歧的代码，它迫使你以不同的方式去做。而且你可以做得更高效，做得更有成效。


    当你这样做之后，并且当你学习了函数式编程的优势时，你会发现比这更重要的东西，有过孩子的人也会发现那也是一个优势。


    ## 函数式编程简介


    在这节课程中，我将展示一下 `Erlang` 编程语言。然后我会展示 `BufHandle` 和几个函数，接着我会展示几个函数式风格的函数。


    但这还不够，所以让我们从函数式编程的介绍开始。我将介绍以下术语，并会尝试解释清楚我们为什么要使用这些术语。


    首先，我会说我们使用“函数式编程”一词是指“一元操作（Unary Operations）”。一元操作是在单个输入上进行调用并返回单个结果的函数。你把它说成一个词，然后解释它。你也可以把“函数式编程”作为泛指编程的术语。


    有些人说：“我想用函数式编程来编程。”你可以使用某些纯函数式语言在 `Erlang` 中编程，或者你也可以在 `Erlang` 中编程，使用 `Haskell`、`Scala`
    或任何你想要的语言。


    但我想如果你想这样做，用纯函数式语言编程会更有效率。但如果你不想这样做，尽管可以使用命令式语言。我想用函数式语言编程会更有成效。


    另一个要说的术语是“一元运算符（unary operators）”。我们通常把一个表达式看作 `AND` 或 `OR`。你可以把 `AND` 放在右边，或者把
    `OR` 放在左边，它们都在右边。


    但这些是不正确的；你必须不是 `OR`，而是 `AND`。所以你有一个表达式，然后有两个边。一边是 `AND`，另一边是 `OR`。


    所以当你把 `AND` 放在右边，把 `OR` 放在左边时，你在右边得到一个新的表达式。所以你可以说这些是没有顺序的。它们实际上不在顺序上。正确的顺序是这样的：`AND
    OR`，`OR OR`。但你明白我的意思。


    所以其他的术语也不正确。你可以把 `AND` 放在左边，把 `OR` 放在右边。它们不是同一个表达式；它是不同的。


    在 `Erlang` 中，你不需要这些术语。`Erlang` 有一个特性叫做部分应用（partial application），它允许你把函数放在函数的一侧，把参数放在另一侧，然后主体将应用到该函数。所以如果你把
    `AND` 放在左边，你将得到一个不同的函数。如果你把 `OR` 放在左边，你会得到该函数。它的工作方式简直很神奇。


    你在对标准库的每次调用中都能看到这一点。你现在可能在屏幕上看到一些东西，例如标准库会给你一个 `list` 函数。它不在标准库里。但如果你不指定列表参数，它会给你一个所有列表的列表。如果你指定了列表参数，它会给你一个对的列表。所以你可以有一个两个列表的对，也可以有另一个对的对，然后再有另一个对的对对。你可以拥有所有的排列。这只是排列语言中的一种排列。

