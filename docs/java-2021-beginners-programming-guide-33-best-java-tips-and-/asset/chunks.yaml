    Another alternative language to consider is Go. As its name indicates, Go is a
    compiled programming language based on the Go programming language by Google.
    It has no garbage collection, and it offers a more simple syntax.


    Go is quite popular, with hundreds of production applications written in it. Like
    Flock, Go is open source, and many companies use it, including Uber, Pinterest,
    IBM, Netflix, Nvidia, Facebook, Google, Dropbox, The New York Times, Instagram,
    and Walmart.


    Also like Flock, Go is still relatively young. Its version `1.1.1` was released
    in July 2017, and it’s available under a license that is more permissive than
    the Apache 2 license of Swift, which means that it’s available for free.


    ## Frameworks


    Developing apps with these types of languages requires a different set of tools.
    So, while this post is mostly aimed at learning more about building desktop and
    server apps with `Java` and `Go`, there’s a wealth of information on other languages,
    frameworks, and tooling that can be helpful as well. Below, we’ll list some of
    the most popular libraries and tools that you’ll want to look into.


    ## Swift Starter


    `SwiftStarter` is a solid introduction to programming in `Swift`. This site provides
    several courses that show you how to write useful `Swift` applications, including
    handling errors and data structures, using the standard library, and creating
    iOS and Mac OS X apps.


    ## CodeProject


    The `CodeProject` site is a great place to learn the basics of different programming
    languages. You’ll find useful articles and tutorials that show you how to get
    started with topics like compiler debugging, `Jekyll` documentation, `Xcode`,
    `React` and `Redux` frontend development, and `Ruby on Rails` apps.


    ## Frugal


    `Frugal` is one of the most popular testing frameworks available for iOS and `macOS`.
    It’s a good example of the type of self-hosted, open-source development tools
    you’ll see in these posts.


    ## Elixir


    `Elixir` is an event-driven programming language that offers functional programming
    features and some object-oriented programming features. It’s an active open source
    project, and you’ll find many articles and tutorials for learning it.


    ## AWS Lambda


    `AWS Lambda` is an end-to-end serverless computing service from Amazon that makes
