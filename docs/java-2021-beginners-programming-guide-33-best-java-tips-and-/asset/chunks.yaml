- fmt: '

    In essence, the MVC pattern is a set of methods that are used by a Spring application,
    so that you can bootstrap an application and pass the main parameters that you
    want to expose into the components of the MVC structure. Spring takes the template
    system that you can find in `JSF` and a couple of specific annotations that extend
    the default behavior of the system and generates an interface to the design, which
    you can implement using any convention you like.


    For example, you can define the view as a template, and it''s perfectly valid
    to pass it as an argument to the constructor or to use a specific piece of code
    as a view to define the view and get an instance of the view that can be manipulated.
    An entity could be a class that you can implement, but it can also be a lambda
    expression.


    What you have to remember is that the MVC pattern is still a pattern, but it''s
    one of the most used patterns in the `Java` programming language. So, whenever
    you see it in your code, it''s probably part of a web framework, which is defined
    as a set of rules for the development of an MVC structure.


    Notably, `Spring MVC` doesn''t contain the MVC concept that I spoke about at the
    beginning of this article, which is separating models from views and controllers.
    The idea is still the same: the view is just a convenient API for creating a view,
    which implements the components in an MVC structure, whereas the controller is
    a class that inherits from the `Spring MVC Controller` class. The model is the
    implementation of the `ViewModel` interface, and the controller is an implementation
    of the `Controller` interface. The problem with `Spring MVC` is that it doesn''t
    scale very well. It''s an "it works for small projects" kind of pattern. It''s
    an excellent choice if you are working on something really small, like a little
    site or something, but if you want to deploy that web application into production,
    then you''ll need to look at other patterns.


    That is why I suggested in the beginning that if you work on a big web application,
    then use an `OOP` pattern such as Reactive programming. Reactive programming is
    an object-oriented paradigm that involves elements that model reactive behavior
    (and consequently, it is often combined with reactive programming) and that allow
    you to model the real-world world, where there are real-time systems with many
    asynchronous elements and a lot of data flow. Reactive programming is pretty much
    a good way to model real-time systems.


    Real-time is an abstract concept, but Reactive Programming does help you to have
    the ability to handle reactive elements within an abstract set of concepts that
    you can model within an `OOP` environment. Real-time has been around for a long
    time, and Reactive programming can be used with any `OOP` environment. One example
    of it is with a database, so you can read data in real-time and modify that data
    in real-time while keeping the state as static as possible. Another example is
    that you can use `REST` and more generally, event-driven programming. You can
    model real-time as a stateless functional programming paradigm. I''ve seen many
    projects over the years that are started with a database and that use a variety
    of reactive techniques.


    Most of the time, Reactive Programming helps you to cope with real-time systems
    and reactive elements in a declarative fashion, which allows you to model things
    in a declarative way and then to write code to handle those reactive elements
    and to deal with the time-critical elements.


    If you think of a typical web application that is being developed today, that''s
    pretty much what you would do with a Reactive programming web application. I will
    describe a simple Reactive programming web application as a case study that you
    can study in the next section.


    ## Reactive programming in a web application - A real-world case


    Earlier I explained that if you have a reactive software problem, then you usually
    need to write code to handle the reactive elements, such as making an `HTTP call`,
    reading from a database, processing a request for request parameters, making an
    `HTTP call`, and so on. Reactive programming usually also involves a bunch of
    data structures, both structurally and dynamically. This whole set of data structures,
    what we would call a reactive database or a reactive cache, helps us to model
    the reactivity of the system.


    I will use an example from the `Linux` operating system to explain how to build
    a reactive database. For me, the `Linux kernel` is the most interesting single
    component in the `Linux` operating system. Most of the systems in the `Linux kernel`
    are just simple examples of very complex systems that we build in some of our
    other projects. That is why the kernel is the classic example of a reactive system
    and in particular a Reactive system.


    The `Linux kernel` is all about data flow, but in particular about performance.
    Let me just state it very simply: if we have a set of users connected to our network,
    then we need to handle the influx of user connections in a very efficient and
    responsive way, and one way to do it is by having a micro-kernel that lets the
    network stack manage the user connections, as well as the access to hardware such
    as network interfaces.


    I love the idea of having a micro-kernel that lets the network stack manage user
    connections, but my favorite part about the kernel is the networking stack. Every
    time I turn on my computer, I connect to the `Linux kernel` in the hardware layer,
    and I am connected to all the services that the kernel provides.


    For the user sessions, I connect to the main kernel thread (`CPU`) in a very specific
    way, because I also need to be able to share my device with other users and to
    share some of my CPU. The CPU access is managed by the kernel in the hardware
    layer. For example, if I have a graphic driver, then I can use the graphics device
    directly from the CPU. If I don''t use a graphic driver, then I also connect to
    the CPU through an `IPC service`.


    However, for a session to connect to the networking stack and to read data from
    the network, I have to connect to the kernel. That means that I must bind to a
    specific `CPU`. I can do that either via socket programming or via a lock that
    I register with the kernel. You can see that the Kernel is a Reactive system that
    allows me to create the session directly from the kernel and also has this very
    interesting ability to read from the kernel. This is why I prefer the networking
    stack as the core of the Reactive system.


    ## How to Build a Reactive system


    A Reactive system in a web application is similar to how a micro-kernel connects
    to the kernel in a `Linux kernel`. This means that for a client to connect to
    a Reactive system, we need to create a web application and connect to the database,
    as shown in the following diagram:


