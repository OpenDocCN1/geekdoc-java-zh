    另一个可以考虑的语言是 Go。正如其名称所示，Go 是由 Google 开发的基于 Go 语言的编译型语言。它没有垃圾回收，并且提供了更简单的语法。


    Go 非常流行，有数百个生产应用是用它编写的。与 Flock 一样，Go 是开源的，许多公司在使用它，包括 Uber、Pinterest、IBM、Netflix、Nvidia、Facebook、Google、Dropbox、纽约时报、Instagram
    和沃尔玛。


    同样像 Flock 一样，Go 仍然相对年轻。它的 `1.1.1` 版本于 2017 年 7 月发布，并采用比 Swift 的 Apache 2 许可证更宽松的许可，这意味着它是免费提供的。


    ## 框架


    使用这些类型的语言开发应用需要一套不同的工具。因此，虽然这篇文章主要面向学习如何使用 `Java` 和 `Go` 构建桌面应用和服务器应用，但关于其他语言、框架和工具的丰富信息也可以对你有所帮助。在下面，我们将列出你可能想要研究的一些流行的库和工具。


    ## Swift 入门


    `SwiftStarter` 是 `Swift` 编程的一个实用的介绍。该网站提供了几门课程，向你展示如何编写实用的 `Swift` 应用，包括处理错误和数据结构、使用标准库以及创建
    iOS 和 Mac OS X 应用。


    ## CodeProject


    `CodeProject` 网站是学习不同编程语言基础的好佳地方。你将发现实用的文章和教程，教你如何开始编译器调试、`Jekyll` 文档、`Xcode`、`React`
    和 `Redux` 前端开发以及 `Ruby on Rails` 应用等。


    ## Frugal


    `Frugal` 是 iOS 和 `macOS` 最流行的测试框架之一。它是这些文章中看到的自托管、开源开发工具的良好示例。


    ## Elixir


    `Elixir` 是一种事件驱动的编程语言，提供了函数编程特性和一些面向对象的编程特性。这是一个活跃的开源项目，你会发现很多学习它的文章和教程。


    ## AWS Lambda


    `AWS Lambda` 是 Amazon 提供的一种端到端无服务器计算服务，可以轻松创建响应事件执行代码的函数。


    ## ActiveMQ


    `ActiveMQ` 是一个开源消息中间件。该项目仍在活跃开发中，因此它为这些框架中常见的 RESTful 消息队列和流系统（又称 `Apache Kafka`）提供了一个可靠的替代方案。


    ## Node.js


    `Node.js` 是一种服务器端 JavaScript 编程语言，让构建服务器端 Web 应用变得简单。它是 `PHP` 的替代方案。


    ## Github


    `Github` 是托管你自己项目的好地方，但它并不严格限于开源软件项目。你也可以创建私有的 `GitHub` 仓库。


    ## Distributed.org


    `Distributed.org` 是一个为你在 `GitHub` 上发现的开源项目策划代码的组织。


    ## 学习 Java


    学习 `Java` 编程语言有很多非常优秀的博客、书籍、课程和其他资源可用。


    上面的列表强调了开源世界中最流行和最广泛使用的编程语言、框架和工具。你可以自行挑选，但在大多数情况下，你将拥有非常广泛的选择范围。右侧的集合绝非详尽，但它为你提供了一个很好的起点。


    如果你想学习更多关于这些语言和框架的知识，或者想提高开发者中最流行的语言和框架技能，你可能想看看这些开源课程。你会发现编写得良好的课程主题，其细节比典型的博客文章丰富得多，我们甚至会为你创建一个真实的
    `GitHub` 组织，以便你在那里进行学习。


