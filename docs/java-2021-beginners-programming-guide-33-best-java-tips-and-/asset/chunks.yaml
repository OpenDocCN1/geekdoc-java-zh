    # Chapter 11 What is Java Database Connectivity?


    JBDC is an extension of Java Community Process that is being developed to simplify
    the integration of JDBC with Microsoft SQL Server. It provides a set of APIs that
    makes it easier for application developers to use JPA. It also allows Java application
    developers to connect to databases that are not explicitly supported by JPA.


    The Java DB2 connector is not supported in Java EE 6 and 7\. JDBC is not a standard.
    The JBDC specification is actually a set of implementations, one for each of the
    different database drivers and access patterns that are supported by Oracle.


    ## Why Is It Important?


    JBA is a database standard and thus most database adapters are agnostic as to
    which JPA driver to use. However, in a database architecture that requires JPA
    application developers to manage the state with the database, it can be beneficial
    to have a consistent standard interface and implementation that integrates with
    different database drivers. For example, many databases require a specific table
    to be defined for a given user. JBDC provides the interface for such tables and
    provides functionality to manage and query them.


    The API documentation of JBDC has been fully updated to provide a consistent interface
    across all the different database drivers that support it. An example of one of
    the JBDC implementations that supports the different database drivers is JDBC
    Connector.


