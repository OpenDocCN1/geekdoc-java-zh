    \n注意，此示例中的大多数代码是 MVC 模式的局部实现。由于你正在 Java 中编写这些代码，你可以选择将代码拆分为更小、更具重用性的部分。要看到其中的价值，你只需要尝试用\
    \ Java 编写的类来做相同的事情。使用 Java 类，可以更容易将所有的应用程序逻辑保持在一个类中，然后将其暴露给 Web 浏览器。\n\n## 什么是\
    \ JSR-318？ (What is JSR-318?)\n\nJSR-318 是导致 Java 设计模式项目创建的 JCP 进程。根据 JCP 的说法，这是“关于设计模式的全面参考”。在创建\
    \ JSR 之时，JSR 成员正在讨论关于 Java 的一些重大问题，包括运行环境的作用。我们希望运行时是一个工具，但同时，我们也希望它们具有高度的可扩展性。它们应该能够以尽可能少的努力来解决设计问题。那么，运行时的角色是什么呢？\n\
    \n遗憾的是，作为一个 Java 架构师，我意识到的一点是，大多数时候你必须使用运行时的一些部分。例如，通常的做法是写一个简单的类并使用反射 API 来检查\
    \ Java 虚拟机（JVM）的内部。多年来出现的一个问题是，随着开发者发现的问题越来越多，他们就可能尝试将问题追溯到 JVM 本身。在许多情况下，第一步是从\
    \ JVM 开始，试图弄清楚哪部分代码导致了问题。在其他情况下，开发者将开始在 JVM 中搜索解决方案。\n\n"
