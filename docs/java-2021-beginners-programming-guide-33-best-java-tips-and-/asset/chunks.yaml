    本质上，MVC 模式是 Spring 应用使用的一组方法，以便你可以启动应用程序并将你想要暴露的主要参数传递到 MVC 结构的组件中。Spring 汲取了你可以在
    `JSF` 中找到的模板系统，以及一些扩展了系统默认行为的特定注解，并生成了一个设计接口，你可以使用任何你喜欢的约定来实现它。


    例如，你可以将视图（View）定义为模板，将其作为参数传递给构造函数是完全有效的，或者使用一段特定的代码作为视图来定义视图并获取一个可以操作的视图实例。实体（Entity）可以是一个由你实现的类，也可以是一个
    Lambda 表达式。


    你必须记住的是，MVC 模式仍然是一种模式，但它是 `Java` 编程语言中最常用的模式之一。因此，每当你在代码中看到它时，它可能是一个 框架的一部分，该框架被定义为开发
    MVC 结构的一套规则。


    值得注意的是，`Spring MVC`并不并不我在文章开头提到的 MVC 概念，即将模型（Model）、视图（View）和控制器（Controller）分离。其核心思想仍然相同：视图只是创建一个视图的便捷
    API，它实现了 MVC 结构中的组件；而控制器是继承自 `Spring MVC Controller` 类的类。模型是 `ViewModel` 接口的实现，控制器是
    `Controller` 接口的实现。`Spring MVC` 的问题在于它的扩展性不是很好。它是一种“适用于小型项目”的模式。如果你正在处理一些非常小的东西，比如一个小网站之类的，它是一个极佳的选择；但如果你想将该
    Web 应用部署到生产环境，那么你就需要考虑其他模式。


    这就是为什么我在开头建议，如果你在开发一个大型 Web 应用，请使用诸如响应式编程等 `OOP` 模式。响应式编程是一种面向对象的范式，涉及建模响应式行为的元素（因此，它通常与响应式编程结合），并允许你对真实世界建模，即具有许多异步元素和大量数据流的实时系统。响应式编程是实时系统建模的一种很好的方法。


    实时是一个抽象概念，但响应式编程确实帮助你能够在 `OOP` 环境内建模的抽象概念集中，具备处理响应元素的能力。实时性已经存在很长时间了，响应式编程可以用于任何
    `OOP` 环境。其中一个例子是数据库，你可以实时读取数据并实时修改这些数据，同时保持状态尽可能静态。另一个例子是你可以使用 `REST` 以及更通泛的事件驱动编程。你可以将实时性建模为一种无状态函数式编程范式。多年来，我看到许多从数据库启动并使用各种响应式技术的项目。


    大多数，响应式编程帮助你以声明式的方式应对实时系统和响应元素，这允许你以声明式的方式对事物建模，然后编写代码来处理这些响应元素并处理对时间敏感的元素。


    如果你考虑当今正在开发的典型 Web 应用，这基本上就是你对响应式编程 Web 应用时所会做的事情。我将描述一个简单的响应式编程 Web 应用作为一个案例研究，你可以在下一节中进行学习。


    ## Web 应用中的响应式编程 - 真实案例


    早些时候解释过，如果你有一个响应式的软件问题，你通常需要编写代码来处理响应元素，例如发起 `HTTP call`、从数据库读取数据、处理请求参数的请求、发起
    `HTTP call` 等。响应式编程通常还涉及大量数据结构，包括结构性和动态。这整套数据结构（我们称之为响应式数据库或响应式缓存）帮助我们对系统的响应性建模。


    我将使用 `Linux` 操作系统的例子来解释如何构建响应式数据库。对我来说，`Linux 内核`是 `Linux` 操作系统中最趣的单一组件。`Linux
    内核`中的大部分系统只是我们在其他项目中构建的极其复杂系统的简单示例。这就是为什么内核是响应式系统的经典案例，特别是响应式系统的示例。


    `Linux 内核`的核心完全在于数据流，特别是关于性能。让我简单地说明：如果我们有一组用户连接到我们的网络，我们需要以一种非常高效且响应迅速的方式处理用户连接的涌入，其中一种方法是使用微内核，让网络栈管理用户连接以及对如网络接口等硬件的访问。


    我喜欢这种使用微内核让网络栈管理用户连接的想法，但我对内核最喜欢的部分是网络栈。每当我打开电脑时，我都会在硬件层连接到 `Linux 内核`，并连接到内核提供的所有服务。


    对于用户会话，我以非常特定的方式连接到主内核线程（`CPU`），因为我还需要能够与其他用户共享我的设备并共享我的部分 CPU。CPU 的访问由硬件层的内核管理。例如，如果我有显卡驱动程序，我可以直接从
    CPU 使用图形设备。如果没有使用显卡驱动程序，我也会通过 `IPC service` 连接到 CPU。


    然而，为了让会话连接到网络栈并从网络读取数据，我必须连接到内核。这意味着我必须绑定特定的 `CPU`。这可以通过套接字编程或向内核注册的锁来实现。你可以看到内核是一个响应式系统，允许我直接从内核创建会话，并具有这种非常有趣的读取内核的能力。这就是为什么我倾向将网络栈作为响应式系统的核心。


    ## 如何构建响应式系统


    Web 应用中的响应式系统类似于微内核连接到 `Linux 内核` 中的内核。这意味着为了客户端连接到响应式系统，我们需要创建一个 Web 应用并连接到数据库，如下所示：


    我想展示如何结合响应式技术。我们可以展示如何连接到数据库，以及如何使用各种技术通过响应式数据库处理查询。在这里特别涵盖连接数据库的技巧，但也会展示如何通用的构建响应式数据库。


    ## 在 Scala 中连接响应式数据库


    作为起点，让我们首先创建一个作为数据库容器的服务。我们应用程序的主要组件是一个基础分发器（Dispatcher），它是不同数据库服务的接口。该组件负责在分发器接收到操作时调用不同的数据库服务。以下是该组件的高级形式示例：

    ```


    '
- fmt: "\n\n```scala\nimport org.scalatest.transducers.Console\nimport org.scalatest.transducers.Reactive\n\
    import scala.concurrent.TimeUnit\nimport org.scalatest.tools.reactive.Network\n\
    import scalatest.implicits.UsingRuntimeImplicits\nvar dispatcher: RuntimeImplicit\n\
    def getPermissions(handler: Handler): Reactive = {\n  val options = Handler(handler)(options)\n\
    \  return (handler)(options)\n}\nval runningReactor = Server(\"testdb\")(reactive\
    \ dispatcher)\nval operatingReactor = Server(Reactive.class)\nval queryReactor\
    \ = Reactive.class\nval sessionReactor = Reactive.class\nReactive.start()\nval\
    \ databaseConnector = DatabaseConnector(databaseConnector(\"testdb\"))\nval connectionConnector\
    \ = DatabaseConnector(connectionConnector(\"testdb\"))\nval connectionReactor\
    \ = ConnectionReactor(connectionReactor(\"testdb\"))\nval databaseConnector: DatabaseConnector\
    \ = connectionConnector(\"testdb\")\nval databaseConnectorFailedReactor = ConnectionReactor(connectionConnectorFailedReactor)(active\
    \ dispatcher)\n```\n\nTo be able to connect to a database, we first need to create\
    \ a connection and register it with the database connector. The `connectionConnector`\
    \ is a dispatcher of our data source and holds the connection details for the\
    \ database. The database connector contains the database details, for example,\
    \ the database name and the table names. To connect to the database, the dispatcher\
    \ will create a reactor. In this example, the reactor will be a basic service\
    \ that starts an instance of the database connector. The Reactive framework will\
    \ automatically register the reactors, so we don't need to register them manually.\n\
    \nThe Reactive framework makes it easy to connect to a database by extending `Reactive.class`.\
    \ Here is the complete constructor that extends `Reactive.class`:\n\n```scala\n\
    import org.scalatest.transducers.Console\nimport org.scalatest.transducers.Console.routes\n\
    import org.scalatest.tools.reactive.Network\nimport org.scalatest.implicits.UsingRuntimeImplicits\n\
    val router = Router(routes)\nvar reactor: Reactive = new DefaultLoader\nreactor.register(\n\
    \  new DefaultExecutionListener {\n    override fun onTransactionSuccess(executor:\
    \ ExecutionContext, result: ExecutionResult) {\n      transaction.finishExecution(result)\n\
    \    }\n    override fun onTransactionFailure(executor: ExecutionContext, result:\
    \ ExecutionResult) {\n      transaction.failure(result)\n    }\n    override fun\
    \ onStop() {\n      dispatcher.stop()\n    }\n    override fun onStart() {\n \
    \     reactor.start()\n    }\n    override fun onFinish() {\n      reactor.stop()\n\
    \    }\n    val currentConnectionFailedReactor = connectionConnectorFailedReactor(connectionConnectorFailedReactor)\n\
    \    reactor.connect()\n)\n```\n\nIn the constructor, we register the initial\
    \ state of the `Reactive` class and all the necessary endpoints that we can use\
    \ to interact with the database. The `Reactive` class also contains a new `DefaultExecutionListener`\
    \ that is responsible for handling the transaction process.\n\nWe call the `execute()`\
    \ method that starts the transaction and handles the result. In case of success,\
    \ the transaction is completed. In case of a failure, we catch the exception and\
    \ call the `stop()` method, which signals the termination of the transaction.\n\
    \nTo be able to handle the database connection details, we register a new default\
    \ execution listener. When the connection is active, we call them on the `onTransactionSuccess`\
    \ method to perform the transaction. In case of a failure, we catch the exception\
    \ and call the `stop()` method, which signals the termination of the transaction.\n\
    \nAfter we handle the database connection details, we have the reference to the\
    \ database connection. We can inject it into the reactor using the `connect()`\
    \ method.\n\n```scala\nclass DatabaseConnector extends Reactive.class {\n  def\
    \ connection: Connection = new DefaultConnection(\"testdb\")\n  def reactor: Reactive\
    \ = new DefaultLoader\n  reactor.register(\n    new DefaultExecutionListener {\n\
    \      override fun onTransactionSuccess(executor: ExecutionContext, result: ExecutionResult)\
    \ {\n        transaction.finishExecution(result)\n      }\n      override fun\
    \ onTransactionFailure(executor: ExecutionContext, result: ExecutionResult) {\n\
    \        transaction.failure(result)\n      }\n      override fun onStop() {\n\
    \        dispatcher.stop()\n      }\n      override fun onStart() {\n        reactor.start()\n\
    \      }\n      override fun onFinish() {\n        reactor.stop()\n      }\n \
    \     def onSuccess(transaction: Transaction): ExecutionResult = transaction.transactionCompleted(result)\n\
    \      def onSuccess(transaction: Transaction): ExecutionResult = transaction.transactionStarted(result)\n\
    \    }\n  )\n  // The constructor needs to add the connection to the network so\
    \ that we can\n  // register other reactor after it\n  def connectionConnector(db:\
    \ DatabaseConnection) = DatabaseConnector(db)\n}\n```\n\nWe define a new connection\
    \ listener that registers a connection, which is used to connect to the database\
    \ and attaches it to the `Reactive` class. The reactor class becomes the receiver\
    \ of all the calls to the database.\n\nAt this point, our thread can run the queries\
    \ and events. But it’s still synchronous and can’t do anything else. The next\
    \ step is to remove the Synchronous dependency from our `run` method.\n\nAll you\
    \ have to do is create a new `JobBuilder` with a timer that runs in the background\
    \ and kill the main thread when the timer expires.\n\n```scala\nval job = JobBuilder()\n\
    val reactor = reactor()\nreactor.run(job)\n1 2 3 4 5\nval job = JobBuilder ( )\n\
    val reactor = reactor ( )\nreactor . run ( job )\n```\n\nAnd we get rid of the\
    \ need for an external thread. All the heavy lifting is done inside the `reactor`\
    \ class.\n\n`Run` is the default `ExecutionListener` that is bound to the `onStart()`\
    \ method. In our `run` method, we call the `onUpgrade()` method that replaces\
    \ the existing receiver with the new one.\n\nWhile running the actual business\
    \ logic, the reactor class simply calls our state transformer `onUpdate()`. This\
    \ method is called when we perform the database transaction, and we can do whatever\
    \ we want with the data.\n\n# Chapter 5: What are tools for Java language?\n\n\
    Imagine that there are several language constructs and facilities available to\
    \ you. Some of them, such as inlining or only-functional constructs, will give\
    \ you better performance, but might not work for all situations. Some features\
    \ improve Java’s safety, readability, or developer productivity, but not necessarily\
    \ in a way that would be advantageous in every situation. Furthermore, several\
    \ idioms make it difficult to do certain tasks.\n\nThese issues have led some\
    \ developers to use Java’s tools in many different ways. For some people, tooling\
    \ is not very important, but for others, it is very important. As an example,\
    \ some people use `Eclipse`, and other people use `IntelliJ`, and the question\
    \ is whether `Eclipse` or `IntelliJ` is better in some respects. The same goes\
    \ for the `JVM` itself. Some people use it in a strictly single-threaded fashion.\
    \ Others prefer to use `JVM`-level optimizations or `JITs`. As with so many things,\
    \ there is no “best” approach, but rather a spectrum of approaches that will result\
    \ in different tools for the same problem. It’s important that you understand\
    \ the differences between tools for any given problem, and that you understand\
    \ the tradeoffs involved, to make the best decision for your case.\n\nIn other\
    \ words, find a suitable tool for the problem, suggest it to the developer, and\
    \ also provide the required configuration to be used. If we break it down, tooling\
    \ is something that “picks out” and shows you what to use, and “suggests” the\
    \ appropriate tool for the problem. Tools that are too hard to use will simply\
    \ not get the developer’s attention (and thus, will not be used). On the other\
    \ hand, tools that are too easy to use will likely not be used at all. If we break\
    \ it down further, tasks (e.g., `printing`) are “hard” and require a lot of configuration.\
    \ Other tasks (e.g., `querying`) are “easy”, and require no configuration. And\
    \ other tasks (e.g., `querying`) are “not a tool, but rather a method”. And as\
    \ you can see, there is considerable variation in this area.\n"
