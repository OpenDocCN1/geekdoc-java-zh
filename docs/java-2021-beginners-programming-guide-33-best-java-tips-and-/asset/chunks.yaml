    The last remaining vestige of the old type system is that, if you make a reference
    to an object with an instance of the operator and try to set the value of the
    instance of the object to null, the compiler will throw an exception. It will
    also always throw an exception if you try to pass a value that the type system
    believes to be an uninitialized value (i.e., a value whose type does not include
    a constructor method). But you can’t define a failure condition that produces
    an exception that is a normal case of what Scala already does in the case of uninitialized
    arrays, null, and so on.


    ## Favor closed over types


    One last area of Scala that can benefit from type inference is one of the least
    used Scala types: the first argument to a function. This is a type of the type
    `AssertionError`. This type is effectively a boolean that indicates whether or
    not an assertion failed, and it is used for things like logging the first argument
    to a function. The call to a method will either succeed (if it succeeds, then
    the code in that method was successful) or fail (if it fails, then the call to
    the method was unsuccessful).


    So, the first argument to a function can be a type that has the type `AssertionError`
    (i.e., either `False` or `Some [Failure]`) if you are unsure that you need to
    worry about making the first argument optional. In this case, you are free to
    say that the argument is of type `AssertionError` (true if the argument is the
    first argument, and true otherwise) or `AssertionError` (false if the argument
    is the first argument, and false otherwise) and not need to worry about making
    it a type that includes the value of the first argument. This, combined with the
    type inference, means that the first argument to a function is an uninitialized
    tuple of value `False` or `Some[Failure]` because type inference has no trouble
    figuring out what value the function expects the first argument to be, without
    any explicit instantiation.


    In case you were wondering, the reason that the compiler is smart about not throwing
    an `AssertionError` when the first argument to a function is uninitialized is
    that you’re always putting the first argument to a function into a list, and it
    is then de-facto an uninitialized tuple. And since in this case you are guaranteed
    to put the first argument into a list, and because lists of tuples always have
    a single value, there is nothing else that the compiler is going to worry about.
    As long as you don’t start passing a list to a function that expects an uninitialized
    tuple, the compiler is safe.


    In many other cases, the type of the first argument to a function doesn’t matter.
    If the function has a few parameters, it may make sense to omit the first argument
    if the function is doing some transformation of a large collection. Or, if the
    first argument is just something very simple like a tuple or a function that returns
    a tuple, it may not matter at all.


    ## Why the first argument matters


    But it is important to have the first argument as a function of at least one parameter.
    For one thing, you can’t just pass a function that expects an uninitialized tuple
    to an actual method that expects a boolean. For another thing, if the function
    has an interface type argument, you want to provide a reasonable default value
    (or at least a reasonable possible value) for the first argument to the function.
    This helps keep things consistent.


    Many functions that expect to be called by a different function will need some
    extra level of safety in the first argument. For example, suppose you have a function
    like this:


    ```scala

    def greet(person: Person, greeting: String) = person.greeting

    ```


    This function expects to be called from a function that also expects to be called
    from a function that expects a string. In that case, if the first argument is
    uninitialized, there is no reasonable default value for the first argument, so
    you may need to put in an extra step before calling the first function:


    ```scala

    def greet(person: Person, greeting: String) = person.greeting unless greeting.nil?

    ```


    Another place where you need to be sure that the first argument is specified as
    uninitialized is if the function returns some sort of value as its second argument.


    For example, suppose that you have a function that takes a `Person` and returns
    a function that will say something to that person. One common way of doing this
    is to have the first argument be a constructor that you make a copy of, and pass
    to the function, and then assign that copy to the second argument. In that case,
    if you make that copy an uninitialized argument, you’ll need to make sure that
    the first argument is specified as uninitialized, or else this program won’t work:


    ```scala

    def greet(person: Person, greeting: String) = person.greeting unless person.has
    last name("Garrity")

    ```


    If you pass in a string that is expected by the `greet` function, it will never
    make sense to make a copy of the person that you want to greet. In that case,
    you may have to provide an extra step:


    ```scala

    def greet(person: Person, greeting: String) = person.greeting unless greeting.nil?

    ```


    But there’s another case where you don’t have to worry about the first argument’s
    type. Suppose that you have a function that takes a `Person` and returns a function
    that you call with a list of `Person` and you want the second argument to be either
    `nil` or a string. In that case, you don’t need to specify the type of the second
    argument as uninitialized.


    You just need to know if the second argument is a list or a string. But if you
    have a function that takes a `Person` and returns a function that you call with
    a list of `Person` and you want the second argument to be either `nil` or a string,
    you have no way to know if the second argument is a list or a string, so you must
    specify the type of the second argument to be either a list or a string, or else
    you may never know, and so you must provide some extra step:


    ```scala

    def greet(person: Person, greeting: String) = person.greeting unless greeting.nil?

    ```


    This second example works because you can specify the second argument’s type with
    a boolean expression, and the parameter passed into the second argument can either
    be a list or a string. But the second example is a bit unsatisfactory because
    it’s a bit harder to test for the second argument type. So in the common case,
    you may want to put in a bit of extra work to ensure that the second argument
    is either a list or a string.


    Some of the examples from this section will let you understand why you have to
    specify the type of the second argument, but it’s not a one-to-one relationship,
    and sometimes you may not even be able to say why you need to specify the type.


    For example, suppose that you have a function that takes a `Person` and returns
    a function that you call with a list of `Person` and you want the second argument
    to be either `nil` or a string. In that case, you don’t need to specify the type
    of the second argument’s type, because it could be either a list or a string.
    The problem is that this isn’t a one-to-one relationship, because sometimes the
    second argument may be a list or a string. What you may need to do, then, is specify
    the type of the second argument is `nil`, and if you don’t want to specify the
    second argument’s type, then you may have to provide an extra step to specify
    the second argument’s type.


    This is somewhat disappointing since I can’t always know why I need to specify
    the second argument’s type, but there are a few situations where you do need to
    specify the second argument’s type.


    One of the situations that I need to use the type of the second argument quite
    often is when I’m writing a function that receives a `Person` and a list of `Persons`
    as arguments, and I want the second argument to be a list or a string. I should
    be able to say something like this:


    ```scala

    def function(person: Person, list: List[Person]) = person.greeting, list.length

    ```

