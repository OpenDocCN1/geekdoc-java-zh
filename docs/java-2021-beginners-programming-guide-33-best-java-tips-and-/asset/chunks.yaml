    # Chapter 10 What is Java string handling?


    Without a doubt one of the biggest factors to why Java has some issues scaling
    to several GPUs/customization of the most basic things like string handling.


    I will give a rundown of what I feel is Java’s weakness in using a low-level,
    generic function. This is one of the points where the main use of generics shines,
    as you can use them when it makes sense and when it doesn’t.


    Java strings are a rather tricky beast since there are several different string
    handling options:


    java.util.String Java 7 String Types Java 8 String Operations Java 9 Regular Expressions
    String Modes


    Each of the above is different and will work in slightly different ways. However,
    the first two will often dominate the heap.


    ## Java 7 String Types


    Java 7 also introduced the java.lang.String types, which are also part of Java
    8\. The main purpose of these types is to handle strings from any library (through
    the java.util.Allocation class) and ensure that they conform to Java’s type system
    (IntelliSense and the compiler are also set up to tell you which is which).


    What this means is that, should the library change the format of the string, the
    java.util.String types will get the same format, and they are automatically converted
    to the new format when you call java.util.String.toString() .


    This means that it’s very easy to work with strings via a library or another program,
    but if you need to change the format of the string yourself, then all you need
    to do is call the old and new version of toString(), and they will both work with
    the original format.


    Note, if the string you’re trying to access doesn’t actually conform to the java.util.String
    type, then the string will probably get an error (e.g. java.lang.String.format("a",
    "b", "c")).


    To look at the most basic examples of the different Java 7 string types and to
    see how the compiler parses them:


    Below is a very basic example of using the java.util.String object.


    Notice how it has been wrapped in a java.util.String object so it’s obviously
    of the java.util.String type.


    The code below uses the toString() method to show how to access the string.


    Just to give you an idea, the String object below has a startIndex, endIndex,
    readUntilEnd, and readToEnd methods:


    It’s also important to note that Java 7 strings also have a writeBeforeEnd and
    writeAfterEnd method, just like java.io.Buffers. Writing and reading without these
    methods in the same object would not work.


    The endIndex method takes an argument of type ByteBuffer. This means that it will
    work in a memory array of Buffers. For now, this is not possible in Java 8 due
    to a limitation in the Java VM. However, this is something we can change with
    a little bit of code:


    ●     var oldString = "abcdefghijklmnopqrstuvwxyz"; var newString = "abcdefghijklmnopqrstuvwxyz";
    var buffer = new ByteBuffer(newString.startIndex); oldString.writeToBuffer(buffer);
    newString.writeBeforeEnd(); newString.writeAfterEnd();


    This code changes the contents of the oldString object so it uses the buffer that
    has been created. If we then run the code above and pass in the old string and
    the new one, we should be able to see the contents of the strings:


    If you need to edit the contents of a String object, you can do this via the writeToBuffer
    and writeBeforeEnd methods. However, since Java 9 the writeBeforeEnd method will
    only return a method you can call, not a copy of the original.


    ## Java 8 String Operations


    Just like java.util.String types, Java 8 introduced two new types that work well
    with Java’s type system and have had a huge impact on the way we work with strings:
    the java.util.UObject and the java.util.Long object.


    The UObject type provides a lot of functionality that you might not be familiar
    with, and it’s worth diving into in more detail.


    However, UObject types have an entirely different syntax to the java.util.String
    types, and the documentation has a good example on what’s actually a UObject and
    what isn’t:'
