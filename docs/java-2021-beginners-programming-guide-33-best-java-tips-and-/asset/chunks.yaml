    如果你创建一个对象数组，数组中的某个项可能与数组中已有的某个项具有相同的名称。如果你随后修改了原始项，你就必须更改数组中的引用。


    这样做的问题在于，一旦你修改了其中一个项，整个数组都会发生变化。因此，基于对象的数据结构的可扩展性低于基于数组的数据结构。


    此外，存储大型对象所需的空间大小通常是许多大型数据结构的限制因素。如果你想存储大量的大型对象，可以使用如图、哈希表或矩阵等大型数据结构。


    ## 我能做出的最佳对比如下：


    ### 基于数组的 (Array-based)

    基于数组的对象在内存和磁盘空间方面可能非常大，并且存在很多效率性问题。解决这些问题的方法之一是使用缓存，缓存应该将所有数据都保留在内存中。你可以将缓存放在一个变量中，然后在需要数据时从缓存中分配一个对象。


    ### 基于结构体（ (Struct-based)

    基于结构体的数据结构允许你定义一个结构并将其某些成员变量设为私有。然后，每当你需要某个成员变量时，你通过其接口提供它，这样你只需要将其应用于数据结构，而不需要将其传递给所有成员。需要注意的是，这有时更适合该结构，但如果你想保持结构私有并允许每个成员独立于整个结构进行更新，则不应使用它。


    换句话说，你可以拥有如下的 `Struct`：


    ```

    struct Patient { String name ; Integer age ; String address ; } ;

    ```


    在这种情况下，你不需要担心成员会从一个类传递到另一个类，但它们仍然可以通过其接口可用。


    基于结构体的结构的另一个优势是，它们允许你向数据结构添加一个可选成员，该对象通过其接口暴露该成员。因此，你可以拥有结构化数据结构的多个组件，这意味着它们可以比数组更小。


    基于数组的数据结构提供了非常好的性能，特别是当你拥有不需要经常更新的大型对象时，例如大型数据库或映射（maps）。


    Java 有一种非常有趣的数据结构叫做哈希表，它用于大规模面向对象的数据库。但在 Java 中，你需要将其实现为一种面向对象的数据结构，这意味着你需要确保数据结构的每个属性都与其他任何属性隔离开来。此外，如果属于该属性的值发生变化，你就无法对哈希表类进行任何更改，这使得开销非常大。


    简而言之，每种数据结构都有优缺点，但我更喜欢数组而不是哈希表，而且数组速度更快。


    ## 根据需要创建新树


    在我们开始设计数据结构之前，我们应该问问自己：到目前为止我们创建的树中，哪些我们应该保留？


    我想说的第一类树是“空”树。空树内部没有任何数据，但通过添加一些对象可以变成一棵树。


    所以，这里有一个没有对象的树。这棵树也可以通过添加一些对象变成树。但如果我们想创建一个只包含一个对象的树呢？我们必须创建一个只有一个对象的新树：


    而且我们必须以略有不同的方式创建这棵树，因为我们想给每个孩子提供一些内部结构。当树被添加到 DOM 时，每个孩子都必须指向它的父节点。我们还需要确保放在树内部的
    DOM 节点也指向它的父节点。所以，它不是一个空树。但它仍然是一个很小的树。


    现在，让我们尝试创建一个恰好有两个孩子的树。这里的问题是，我们需要确保其中一个孩子也具有内部结构，因为如果不这样做，这棵树可能会变成一个非常巨大且不可读的混乱局面：


    现在，我们创建的 `Tree` 类是非常通用的，所以我们可以尝试创建其他类型的空树。例如，创建一个只有两个孩子的“空”树是可能的：


    但如果我们想创建一个有三个孩子的“空”树呢？这是可能的，但我们必须创建两棵具有相同内部结构的空树：


    ## 但我们如何创建一个有四个孩子的树呢？


    嗯，`Tree` 类不处理大小小于 11 的对象。因此，在像下面这样的空树上添加两个孩子是可能的：


    ## 但我们如何创建一个有八个孩子的树呢？


    `Tree` 类不处理大小小于 11 的对象，这正是为什么我们之前的树看起来像有八个孩子。


    为了添加最后一个孩子，我们必须创建一个新的空树，其中有八个内部节点：


    ## 现在，如果我们想创建一个有十个孩子的树呢？


    好的，我们正在说的是，我们的新树应该大一点，我们应该用另外两个具有相同内部结构的树来组成它。第一个是一个有八个孩子的三元树（triple-tree）。


    第二个是有四个孩子的四元树（quadruple tree）。


    现在，我们需要再创建一个具有相同内部结构和大小的树，并称之为三元树。


    这将创建一个具有十个内部节点的三元树。


    所以，我们创建了三棵新树，每棵树都具有我们想要的内部结构。


    ## 但是，我们的新三元树里只有五个节点。但如果我们想要一个十个节点的二元树（double-tree）呢？


    如你所见，很容易创建另一个具有相同结构但具有八个内部节点的树：我们创建的两个树仍然位于二元树内部，它有十个节点。所以，我们现在有五棵具有内部结构的树。我们还可以有三棵相同大小的树。所以，我们将有三个带有内部节点的树。


    当我们创建一个新树时，还需要创建一个 DOM 节点。我们在这里想说明点是，只要我们的树中有三个或更多内部节点，内部结构是什么样并不重要。


    ## 那么，树的内部结构的常见大小是多少？


    这取决于我们正在创建哪种树。如果我们正在创建一种类似于链表的树，那么我们通常在内部没有内部节点。相反，内部结构只是单个父节点和许多子节点：


    所以，我们可以为我们的三元树添加三个内部节点。这将使其成为一个有十个节点的二元树。并且这将创建一个具有十二个内部节点的三元树。


    我们可以添加三个内部节点，但我们仍然有一个单个内部节点，这使得我们的树成为一个具有十二个节点的四元树：


    我们之前创建的两个例子也是类似的。唯一的区别是第一个有八个内部节点，而第二个有九个。


    我们可以再添加一个只有五个内部节点的树，并称之为“猫树”（cat-tree）。这将创建一个具有五个节点的猫树。


    ## 那么，当我们不需要创建新树而只需合并现有树时呢？


    为了制作具有两个内部节点的树，我们首先需要确保我们要合并的另外两棵树已经具有相同的内部结构。我们需要通过创建额外的树来实现这一点，这棵树将与我们要合并的第一棵树相同。所以，为了合并两棵树，我们首先创建一个带有单个内部节点的第一个棵树。当我们创建一个新树时，还需要确保我们要合并的树已经具有相同的内部结构，这样我们就可以创建另一个相同结构的树。

