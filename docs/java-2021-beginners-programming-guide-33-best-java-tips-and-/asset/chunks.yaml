    This is a perfectly reasonable statement. Here, I’m specifying that the second
    argument is either a list or a string, but you might have a different need than
    I do, and it might be that you only need to provide the second argument’s type
    if you don’t want to specify the second argument’s type. So in that case, you’ll
    want to be able to say:


    *   `def function(person: Person, list: List[Person]) = person.greeting, list.length`


    In that case, you could put in a bit of extra work to ensure that the second argument
    is a list or a string, but you don’t have to do this, since you can define your
    functions with a function parameter without specifying the second-argument’s type.
    But what if you do want to specify the second argument’s type?


    I’m thinking about a function that’s particularly common to Javascript functions,
    which I call `typeof` and that’s defined as:


    *   `typeof "object"`


    It seems to me that `typeof` should be the only case where you would need to specify
    the type of the second argument of a function. This is because, if the second
    argument’s type is `nil`, then the value of `typeof(object)` is either an object
    or the string "object". So if the second argument’s type is a `string`, then `typeof(object)`
    would return a `string`, and if the second argument’s type is `object`, then `typeof(object)`
    would return an object. In other words, if the second argument’s type is `nil`,
    then `typeof(object)` is going to return an empty string or `nil`, and if the
    second argument’s type is `object`, then `typeof(object)` is going to return an
    object of some sort.


    This is all well and good. But this is where it becomes a bit more confusing.
    Imagine that we’ve gone back to the old-fashioned `typeof(object)` and we have
    it return a string. Well, then we’ll have `typeof(object)` return a string if
    the second argument is an `object`, and `typeof(object)` will return an object
    if the second argument is a `string`. But what if the second argument is `nil`?
    What happens if we put in this code:


    ```javascript

    function typeof(object) { var self = this; if (typeof(object) == "object") return
    typeof(object); if (typeof(object) == "string") return "object string string";
    }

    ```


    Now we’re in a pretty strange situation:


    *   When we call `typeof("string", "object string string")`, `typeof("string",
    "object string string")` will return a string.

    *   When we call `typeof("object", "string", "object string string")`, `typeof("object",
    "string", "string")` will return an object.

    *   When we call `typeof("object", "string", "object string string")`, `typeof("object",
    "string", "string")` will return an object of some sort.


    Unfortunately, we can’t put in any conditionals on these types:


    *   `if (typeof("object", "string", "object string string") == "string") return
    "string";`


    We’re stuck, and the only way to get out of this situation is to change the `typeof`
    function to return:


    ```javascript

    function typeof(object) { var self = this; if (typeof(object) == "object") return
    typeof(object); if (typeof(object) == "string") return "string string"; }

    ```


    The tricky part is that this means we can no longer define a function that returns
    an object and it has to return a string, or it has to return some sort of object.
    The only option is to add a further condition on the return type of the function:


    ```javascript

    function typeof(object) { var self = this; if (typeof(object) == "object") return
    typeof(object); if (typeof(object) == "string") return "string string string";
    }

    ```


    In my opinion, this doesn’t seem like a very great improvement. It seems like
    it’s going to be pretty messy, and I have a strong suspicion that there’s going
    to be some problems. It’s hard to avoid the conclusion that `typeof(object)` is
    probably going to need to be changed again, and we’re going to have to make the
    return types of functions that return an object and some sort of object both depend
    on the type of the first argument.


    First, we need to find a function that returns an object in the first argument
    but returns a string in the second argument.


    A nice enough example that I could find is this one:


    ```javascript

    function str() { return "text" ; } function s(val) { return "string" ; } function
    b(str) { return s(str) + " " ; }

    ```


    Now, given this function, we can modify `typeof` to get back a function that returns
    an object and then returns a string, so this code:


    ```javascript

    function typeof(object) { var self = this; if (typeof(object) == "object") return
    typeof(object); if (typeof(object) == "string") return "string string string";
    }

    ```


    Now we can do the same thing we did before:


    ```javascript

    function typeof(object) { var self = this; if (typeof(object) == "object") return
    typeof(object); if (typeof(object) == "string") return "string string string";
    }

    ```


    Now, this isn’t so bad: it works without too much trouble, and it looks much better
    than what we had before.

