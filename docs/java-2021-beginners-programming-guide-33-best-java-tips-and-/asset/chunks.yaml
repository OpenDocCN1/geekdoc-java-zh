    >() : Optional. ofNullable(true); for ( int i = 0 ; i < possibleLocations. length
    ; ++ i ) { possibleLocations[i] = Optional. ofNullable(null); }

    ```


    如果方法正尝试将 `String` 转换为非对象类型，则赋值应使用对象。


    以下等同于之前的代码：


    ```java

    Optional[String] possibleLocations = Optional. isEmpty() ? new ArrayList < String
    >() : Optional. ofNullable(false); for ( int i = 0 ; i < possibleLocations. length
    ; ++ i ) { possibleLocations[i] = Optional. ofNullable(null); }

    ```


    以下示例可以被视为一个 for-all 循环：


    ```java

    for ( int i = 0 ; i < 10 ; i++){ possibleLocations[i] = toIsTodo; }

    ```


    下面的示例等同于之前的代码：


    ```java

    for ( int i = 0 ; i < 10 ; i++){ possibleLocations[i] = toIsTodo; }

    ```


    以下示例显示，如果给定值为 `Nullable[T]`，则 `Optional.isEmpty()` 方法返回 `false`：


    ```java

    Optional[String] possibleLocations = Optional. isEmpty() ? new ArrayList < Nullable[T]
    >() : Optional. ofNullable(false); for ( int i = 0 ; i < possibleLocations. length
    ; ++ i ) { possibleLocations[i] = Nullable. ofNullable(false); }

    ```


    `Iterator` 和 `Optional.isEmpty()` 方法定义的组合等同于之前的代码：


    ```java

    Optional[String] possibleLocations = Optional. isEmpty() ? new ArrayList < String
    >() : Optional. ofNullable(true); for ( int i = 0 ; i < possibleLocations. length
    ; ++ i ) { possibleLocations[i] = toIsTodo; }

    ```


    最后，如果给定值具有关联标签（例如 `ExpectedLine`），方法 `toIsTodo` 返回 `true`；如果具有关联字段（例如 `Text`），则返回
    `false`。因此，以下示例将 `String` 转换为 `List` 类型的标签：


    ```java

    List[String] possibleLocations = new ArrayList < String >(); possibleLocations.
    add ( "Field1" ); List[String] possibleLocations = Optional. ofNullable(true);
    for ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]
    = List. ofNullable(new ArrayList < String>()); }

    ```


    以下代码等同于之前的代码：


    ```java

    List[String] possibleLocations = Optional. ofNullable(false); for ( int i = 0
    ; i < possibleLocations. length ; ++ i ) { possibleLocations[i] = List. ofNullable(new
    ArrayList < String>()); }

    ```


    并不是所有的 `Optional` 实例都能将值转换为 `Label` 或 `ExpectedLine`。例如，以下示例无法将 `Optional[String]`
    转换为 `Label`：


    ```java

    Optional[String] possibleLocations = Optional. ofEmpty() ? new ArrayList < String
    >() : Optional. ofNullable(true); for ( int i = 0 ; i < possibleLocations. length
    ; ++ i ) { possibleLocations[i] = Optional. ofEmpty(); }

    ```


    同样，以下示例无法将 `Optional[String]` 转换为 `Label`：


    ```java

    Optional[String] possibleLocations = Optional. ofEmpty() ? new ArrayList < String
    >() : Optional. ofNullable(false); for ( int i = 0 ; i < possibleLocations. length
    ; ++ i ) { possibleLocations[i] = Optional. ofEmpty(); }

    ```


    以下示例显示了执行此类转换的实例：


    ```java

    List possibleLocations = new ArrayList < String >(); possibleLocations[0] = Optional.
    ofEmpty(); for ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]
    = List. ofNullable(new ArrayList < String>()); } possibleLocations = Optional.
    ofEmpty(); possibleLocations[0] = Optional. ofEmpty(); for ( int i = 0 ; i < possibleLocations.
    length ; ++ i ) { possibleLocations[i] = Optional. ofNullable(new ArrayList <
    String>()); }

    ```


