    The below example is equivalent to the previous code:


    ●     for ( int i = 0 ; i < 10 ; i++){ possibleLocations[i] = toIsTodo; }


    The following example shows that the Optional.isEmpty() method returns false if
    the given value is a Nullable[T] :


