    \ 章：什么是手机版 Java？\n\n手机版 Java（Java for phones）是开源、免费的并由 Sun 公司开发。Sun 公司已明确表示，一家名为\
    \ Maturity in Telecommunications (`MT`）的独立公司将负责此项目。\n\n对于 Java 社区而言，策略是在所有主要平台和功能尺寸上获得单一的运行时和应用平台。其目标是在所有不同形式的手持设备和网络笔记本/智能手机产品中创建统一的用户体验。\n\
    \n## 手机版 Java 将如何工作\n\n根据官方文档，手机版 Java 基于 `Java EE 5`。因此，经典的 `J2EE` 应用服务器也受支持。不再支持其他传统的服务器开发库；任何平台的内存消耗和复杂性将显著降低。\n\
    \n手机版 Java 用 `Java` 编写，这意味着代码将可以到任何 `Java 1.5` 语言变体，包括 `Java 6`。\n\n分布式应用程序使用通用的\
    \ Java 框架编写。这意味着可以使用现有的 Java 应用服务器。预计应用程序将在单线程中运行，并使用单独的线程进行高性能处理。\n\n## 灵活的领域对象\n\
    \n基于 Java 开发移动应用程序有多种面向对象的方法，但基本前提是构建单个原生的或分布式的应用程序，这些程序应使用相同类型的系统，可以访问底层结构，并根据需要利用语言/库\
    \ API。\n\n不假设存在通用的语言/API。因此，使用了针对不同类型警报的意图（intents）和事件方法。手机版 Java 尚未支持此类功能。\n\n\
    \ 手机版 Java 支持的平台\n\n手机版 Java 针对三种不同的设备形态：智能手机、网络笔记本和智能卡。经过一些调整，它也能够运行在其他形态上，如个人数字助理（`PDA`）和手持游戏机。\n\
    \n## 手机目标\n\n对于原生用户界面，该系统围绕 Java 构建，而来自手机制造商的原生接口是原生布局和设计的起点。这意味着只要编写代码时尊重了预期的目标设备，任何预先存在的\
    \ Java API 都应该能够正常工作。\n\nJava 开发者需要为手机版 Java 开发原生代码，以访问手机功能。\n\n“由于渲染原生应用 UI 以及读取/写入/编辑用户数据的功能无法从运行时的其他部分抽象出来，因此\
    \ `JDK` 本身的构建方式需要让 Android 团队无需为访问这些功能而添加任何特殊功能或更改，”Oracle 的 Elliot Schulman 说。\n\
    \n对于使用原生操作系统 API 的应用程序，使用了标准的 Android API。这意味着 Java 前端将能够利用原生栈提供平台集成以及用户界面代码本身。\n\
    \n## 手机 API 目标\n\n手机版 Java 围绕统一 API 构建。由于该平台专注于支持原生代码，传统的 Java 语言将无法提供 API。\n\n\
    “现有的 Java  API 在手机版 Java 框架中得到了支持，并达到了完整范围。因此，可以使用该 API 并利用现有库来提供丰富的应用程序功能，”手机版\
    \ FAQ 表示。\n\n## 测试手机版 Java 平台\n\n集成测试是测试手机版 Java 平台的方法。Oracle 的 Schulman 指出，构建使用手机版\
    \ Java API 的应用程序相对容易，并且测试应用程序将如何运行、API 接口如何以及手机版 Java 测试框架支持什么。\n\n由于测试框架需要能够在\
    \ `JSR` 中自动注册，因此新的测试框架应该考虑到手机版 Java 进行编写。\n\n网络集成测试也将非常重要。\n\n“当应用程序提供给所有终端用户时，也将获得发现问题和对\
    \ API 提供反馈的机会，”Schulman 说，“因此在开发的每个阶段都应该对 API 功能进行测试。”\n\n这意味着与原生代码集成也是重要的。“自然的选择是使用与手机版\
    \ Java 框架相同的 Java 库。”\n\n再次，有机会编写新的测试框架来利用手机版 Java 框架。\n\n"
