- fmt: '

    The Eclipse EE 7 and Cloud Foundry implementation of Java EE 7 can use the Cloud
    Foundry APIs for RESTful Web Services, including those from Cloud Foundry Enterprise
    2.0, for client and server authentication, session management, and HTTP and XML
    API authentication. The Eclipse EE 7 integration with Cloud Foundry is enabled
    with the use of the Cloud Foundry Assert API, which provides the capability for
    the Cloud Foundry API provider to issue a Cloud Foundry Assert for either a client
    or server, based on a Cloud Foundry Cloud Explorer. This ensures that Java EE
    7 implementations do not interfere with the Cloud Foundry APIs for RESTful Web
    Services.


    The Eclipse EE 7 and Cloud Foundry integration can be used together, or separately,
    to meet the needs of multi-tier applications. A Cloud Foundry add-on provides
    an API for the use of the Eclipse EE 7 and Cloud Foundry integration. The Eclipse
    EE 7 support also provides the Eclipse UI and Java EE 7 Web Toolkit (`JWT`) and
    other Eclipse Components for Java EE 7.


    ## Eclipse EE 7 and Tomcat


    The Eclipse EE 7 implementation is compatible with the `Java 7 JDK`. The `Java
    7` implementation is interoperable with `Tomcat 8.3` and above.


    ## Eclipse EE 7 and JBoss


    The Eclipse EE 7 implementation of `JAX-RS`, `JSF`, `JAX-WS`, `JAX-WS Multi Resource
    Pattern`, and `JAX-RS WebSocket` provides interoperability with `JBoss AS 7.3`
    and above. The implementation also is compatible with the JBoss application server
    technologies, including `JSF` and `JAX-WS`.


    ## Eclipse EE 7 and NetBeans


    The Eclipse EE 7 implementation of `JAX-WS` provides interoperability with the
    `NetBeans IDE 8.0 EAP` and with the `Java EE Web Profile 3.1`.


    ## Eclipse EE 7 and Maven


    The Eclipse EE 7 implementation of `JAX-RS`, `JSF`, and `JAX-WS` is compatible
    with the `Maven Central Repository 1.7.3` and requires no Maven Dependency Injection
    packages. The implementation also is compatible with the `JAX-WS Middleware Service
    Provider`. The NetBeans integration is compatible with `Java SE 6`.


    ## Eclipse EE 7 and JBoss (Continued)


    The Eclipse EE 7 implementation of `JAX-WS` provides interoperability with the
    JBoss implementation of the `JAX-WS` middleware service provider. The Java EE
    implementation is interoperable with the Eclipse EE 7 `JAX-WS` support in the
    NetBeans Web Project.


    Eclipse can be used with existing Java EE applications in Eclipse to provide extended
    development and deployment support for the Java EE platform. You can start by
    writing Eclipse Java EE applications, and then later add Eclipse EE support to
    provide application performance, increased management options, and other benefits.


    The Java EE 7 and Cloud Foundry implementations of Java EE 7 provide a great way
    for you to move your existing Java EE 7 implementations into a production environment
    that can be extended as you see fit. It''s important to realize, however, that
    Eclipse 7 does not replace `Java EE Development Edition`. It can add to your existing
    investment, but it''s not a complete replacement. It can only be used in conjunction
    with `Java EE Development Edition`, as an enhancement to Java EE.


    The Eclipse EE 7 and Cloud Foundry implementations are available in the Eclipse
    Marketplace. You can learn more about the Eclipse EE 7 Cloud Foundry integration
    at the Cloud Foundry site.


    # Chapter 15: What is Java for phones?


    Java for phones is open source, free, and developed by Sun. Sun has made it clear
    that a separate company, which it has named Maturity in Telecommunications (`MT`),
    will be working on this project.


    For the Java community, the strategy is to get a single runtime and application
    platform across all the major platforms and feature sizes. The aim is to create
    a uniform user experience across all the diverse forms of handheld and netbook/smartphone
    products.


    ## How Java for phones will work


    According to the official documentation, Java for phones is based on `Java EE
    5`. So the classic `J2EE` application server is also supported. No other traditional
    server development libraries are supported; the memory consumption and complexity
    of any platform will be significantly reduced.


    Java for phones is written in `Java`, which means the code will be portable to
    any `Java 1.5` language variant, including `Java 6`.


    Distributed applications are written in the generic Java application frameworks.
    This means that existing Java app servers can be used. It is expected that applications
    will run in a single thread, with separate threads for high-performance processing.


    ## Flexible domain objects


    There are several object-oriented approaches to developing a mobile application
    based on Java, but the basic premise is to build individual native or distributed
    applications that use the same type of system, can access the underlying structure,
    and utilize the language/library APIs as appropriate.


    A common language/API is not assumed. So a feature like intents and event methods
    for the different types of alerts is used. This is not yet supported for Java
    for phones.


    ## Supported platforms for Java for phones


    Java for phones is targeted at three different device form factors: smartphones,
    netbooks, and smartcards. With some tweaks, it should also be able to run on other
    form factors like personal digital assistants (`PDA`) and handheld game consoles.


    ## Phone targets


    For a native user interface, the system is built around Java and the native interfaces
    from the phone manufacturer are the starting point for the native layout and design.
    This means that any pre-existing Java APIs should also work, as long as they are
    written to respect the intended target device.


    Java developers will need to develop native code for Java for phones to access
    the phone features.


    "Since the functionality to render the native app UI and to read/write/edit user
    data cannot be abstracted off from the rest of the runtime, the `JDK` itself needs
    to be built in such a way that the Android team does not need to add any special
    functionality or changes for native code to access those capabilities," says Oracle''s
    Elliot Schulman.


    For applications that use the native OS APIs, standard Android APIs are used.
    This means that the Java front-end will be able to take advantage of the native
    Java stack to provide the platform integrations as well as the user interface
    code itself.


    ## Phone API targets


    Java for phones is built around a unified API. Since the platform is focused on
    supporting the native code, APIs will not be available in the traditional Java
    programming language.


    "The existing Java platform APIs are supported in the Java for phones framework,
    to their full extent. So it is possible to use this platform API and leverage
    existing libraries to provide the rich functionality of an application." says
    the Java for phones FAQ.


    ## Testing the Java for phones platform


    Integration tests are the method to test the Java for phones platform. Oracle''s
    Schulman points out that it will be relatively easy to build applications that
    use the Java for phones API and test how the application will behave, what the
    API interfaces look like and what the Java for phones test framework supports.


    Since test frameworks need to be able to automatically register themselves with
    the `JSR`, new test frameworks should be written with Java for phones in mind.


    Network integration testing is also going to be important.


    "When the app is made available to all of the end-users, there will also be opportunities
    to detect problems and provide feedback on the API," says Schulman. "So testing
    the API function should be performed at every stage of development. "


    That also means that integrating with native code is important. "The natural choice
    is to use the same Java libraries as in the Java for phones framework."


    Again, there is an opportunity for new test frameworks to be written to take advantage
    of the Java for phones framework.

    '
