  trans: '

    JDBC 是一种数据库访问机制，与 JPA 规范紧密相关。JPA 的基本实现是 `UseWhen( dependent parameters: ...)`
    方法。JPA 的实际 API 是一系列管理数据库状态并在用户对象与数据库实体之间引入映射的 API。两个主要的数据库驱动程序是 `Oracle` 和 `SQL
    Server`。


    ## 为什么它很重要？


    对于使用 JPA 规范的应用程序来说，能够使用不绑定到特定数据库的数据库适配器是非常重要的。对于客户来说，购买支持 JPA 的数据库驱动是有用的，同时可以在无需添加额外驱动程序或数据库适配器的情况下使用
    `Oracle`、`SQL Server` 或其他数据库。


    ## 什么是 JPA 3.0


    JPA 3.0 的名称是 "Entity Framework 1.0"，尽管这并不是一个为了将 `Entity Framework 1.0` 迁移到 `JPA`
    而过度努力的任务。它可能是为了解决 `Entity Framework` 所名的问题而付出的最大长期努力，以及如何为使用 `JPA` 开发的实体与数据库后端之间建立最佳映射。


    从上述描述中可以看出，将 `Entity Framework` 真正迁移到 `JPA` 存在许多困难。从我看来，`Entity Framework` 是数据库集成可用最佳选项之一。因此，努力的方向并不是开发一个非常昂贵的
    `Entity Framework` 到 `JPA` 的迁移。其目标是开发一个可以通过 `JPA` 扩展轻松实现和扩展、且门槛较低的库。


    `Entity Framework` 使用 HTTP 协议来暴露其功能。问题是 `JPA` 规范没有提供标准的方法让 HTTP 客户端与 `JPA` 接口。为
    `JPA` 客户端提供 HTTP 客户端的标准方法是通过使用 Web 服务器。有几个非常流行的 Web 服务器，但它们各自也有缺点。


    基于 JavaScript 的精简版 `Hibernate` 是 `JPA` 客户端 API 的标准实现。它为任何数据库提供客户端功能。`Hibernate`
    的原始版本基于更早的、过时的 `Hibernate` 版本的功能。其他主要的 `JPA` 实现是 `JBoss EAP` 和 `Grails-JPA`。它们为每个数据库提供客户端功能。


    已经有一些将 HTTP 客户端标准化到 `JPA` 的努力，但它们目前还不够广泛，不足以对 `JPA` 领域产生实质影响。可能还需要另一代 `JPA` 实现才能变得足够广泛，从而使“标准”客户端库广泛可用。


    `JPA` 3.0 中的 API 变化是为了提高 `Hibernate` 与 `JPA` 客户端之间互操作性和可靠性的努力结果。


    所有实体及其关系都由数据库作为资源被创建。实体资源可以放置在类资源表中。然后用户为资源提供一个上下文。随后，数据库解析用户的上下文属性并将其映射到指定的关系。每个应用程序对象都作为一个资源被创建，并带有由数据库创建的上下文。它有一个单一接口，称为
    `Projective Model (PM)` 接口。`PM` 接口有一个方法，提供用户项目与数据库实体资源之间的映射。`PM` 接口有一个“select
    语句”用于将用户发送到实体资源。查询针对各种表和关系类型对实体资源进行查询，每个实体都有一个或多个字段。应用程序可以填充各种字段。它可以检索当前属性和/或获取关联属性。它可以查询关联关系。它可以获取所有实体和/或所有关系关系。它可以访问关联资源。它可以过滤结果。它可以选择关系或访问关系。应用程序可以查询数据库以查找实体、关系、属性或它们的任何组合。


    这些基本设计原则对于提高上述示例代码的可读性非常有帮助。然而，我看到了几个目前阻碍 `JPA` 采用的设计和实际问题。


    ## 注意事项 #1


    这一部分更多是一个警告，而不是真正的抱怨。我并不是声称 `JPA` 委员会的每位成员都是坏人，或者 `JPA` 委员会的每位成员都是邪恶。`JPA` 社区的好人确实多于坏人。


    一位 `JPA` 专家说 `JPA` 规范最大的缺陷是它“充满了复杂性”。我问他的“复杂”是什么意思。复杂性是来自涵盖每个实现细节中所有可能的变体，还是来自每个客户端代码中所有可能的变体？他说
    `JPA` 太复杂了。然而，我不信在使用的 `JPA` 实现有很多（或至少几乎所有的实现）是这样复杂的。


    ## 注意事项 #2


    对于“真实”数据库的定义存在一些分歧。有人说 `Oracle` 数据库是真实的数据库，而另人说 `DB2` 数据库是真实的数据库。这很遗憾，因为 `DB2`
    和 `Oracle` 都支持 `JPA`。有大量使用 `JDBC` 的 `JPA` 实现。问题是，它们通常不是作为独立或集成的支持提供的，通常只是被用来绕过
    Java 社区缺乏良好支持的 `JPA` 实现。例如，一个 `JPA` 实现 `JSR 341` 提供了一个应用程序工具包，为每个注册的应用程序提供了一套执行
    `JPA` 的机制。这种方法有两个问题：首先，它对大多数用户来说可能太复杂了；其次，即使用户找到了使用 `JPA` 工具的方法，要与支持非 `JPA` 接口的第三方工具协作可能需要大量工作。这并不没有支持非
    `JPA` 接口的第三方工具，但它们非常少。


    许多人声称 `Oracle` 只有在其他厂商支持时才会支持 `JPA`。我认为这有点胡扯。我们需要的是使用标准 `JDBC` 接口的 `JPA` 实现，因为许多第三方工具支持
    `JDBC` 接口。当然，某些因素使得这变得更加困难。`JPA` 工具包为每个数据库实现了接口，而不只是 `Oracle` 或 `DB2`。工具包本身是私有的，因此对于选择实现它的每个厂商都是私有的。最后，工具包通常包含大量功能，例如与大量对象通信的能力。协调这些各种需求通常非常困难。

    '
- fmt: "\nWith so many people complaining about the `JPA API` and other issues, I\
    \ hope that we will be able to see a standard and well-supported `JPA API` soon.\
    \ However, it has been well over a year since `JSR 343` (a.k.a. `JPA 2.1`) was\
    \ submitted and we are still in the beginning phases of development. Since most\
    \ of the tools that I work with do not offer `JPA support`, I suspect that there\
    \ is no replacement for the `JPA` toolkit in most development environments.\n\n\
    # Chapter 12 What is Java framework spring?\n\nOne of the most versatile Java\
    \ frameworks, which offers not only the best programming language practices but\
    \ also several Java services which facilitate your projects efficiently. `Spring`\
    \ is a flexible and fast framework, which helps you to efficiently deal with large\
    \ and medium scale projects.\n\n## What are the different types of spring frameworks?\n\
    \nThere are 2 major types of spring frameworks:\n\n● `Spring Boot`, `Spring MVC`\n\
    ● `Spring Cloud`, `Spring Cloud Helper`, and `Spring Batch`\n\n## What is Spring\
    \ Framework vs Spring 4?\n\nFor the `Spring Framework`, you should know that it\
    \ has a new name and it is called `Spring Framework 5`, which offers several great\
    \ benefits to the developers.\n\n## Spring Framework vs Spring 4.1\n\nFor developers\
    \ who want to use this new version of spring frameworks, but are using `Spring\
    \ 4.1` versions, then you can read about this type of difference in the article.\n\
    \n## What is Spring 5?\n\n`Spring 5` is the most recent version of the spring\
    \ framework, which offers new features to the developers.\n\n## Can you use spring-boot\
    \ to solve your project issues?\n\nYes, you can use `spring-boot` to solve your\
    \ project issues. If you want to check this, then you can try the following examples:\n\
    \n● Let's say that you have to deploy your project on different servers.\n● To\
    \ do this, first, you have to set up a web server.\n● Then, you have to configure\
    \ the server to run this specific application.\n● The final step is to upload\
    \ your application to the web server and then start it.\n\n## How to integrate\
    \ Spring Framework?\n\nTo integrate `Spring Framework` into your existing application,\
    \ then you have to make one more procedure. The final step is to run this application\
    \ with the help of different `Spring Boot` libraries.\n\n## How to integrate spring-web\n\
    \nThe first approach is to integrate `spring-web`. In this case, your application\
    \ will be a web application, but also it will be hosted on a different server.\n\
    \nTo use this application, you will need to create a new project.\n\nNow, you\
    \ need to create a new repository from where you can download this application.\n\
    \nWe are going to use `Spring Data JPA` because we have to handle only a `JPA`\
    \ connection and no database yet.\n\n## Let’s see a detailed example of Spring\
    \ Data JPA\n\nFirst of all, you will need to create a new project in a folder\
    \ that contains a `spring-data-JPA-example`.\n\nNow, you need to configure your\
    \ project with a migration database name. In this tutorial, we are going to use\
    \ the `postgres` database name. In our project, it will be `psql-postgres`.\n\n\
    After you finish the migration, you can go to the command prompt of your favorite\
    \ operating system, and then run the following command.\n\n● `curl-I http://localhost:9200/spring-data-jpa-example/spring-data-jpa-example-migrations/create_app.py`\n\
    \nThis command will create a new file named `create_app.py` in the `./data/lib/jpa`\
    \ directory of the project.\n\nIf you want to see how it’s used, then you can\
    \ run the following command.\n\n● `python manage.py makemigrations`\n\nThis command\
    \ will create a file named `create_app.py` in the `./data/lib/jpa/jpa_project`\
    \ directory of the project.\n\nNow, you need to run the following command to start\
    \ the web server in your environment.\n\n● `java -Xmx1024m -jar create_app.py`\n\
    \nThis command will start the database in your environment, and then, you need\
    \ to go to the `http://localhost:9200/`. You can start the `Spring` web server\
    \ with the help of the command below.\n\n● `java -Xmx1024m spring-boot:run`\n\n\
    You can see how it’s used in the following example.\n\n● ```java\npublic class\
    \ HttpApplication extends Runnable {\n    private static final String VERSION\
    \ = \"0.0.1\";\n    private static final String ENVIRONMENT = \"test\";\n    public\
    \ static void main(String[] args) {\n        HttpApplication app = new HttpApplication();\n\
    \        app.setVersion(VERSION);\n        app.setEnvironment(ENVIRONMENT);\n\
    \        app.start();\n    }\n    private static void main(String[] args) {\n\
    \        SpringApplication.run(HttpApplication.class, args);\n    }\n}\n``````\n\
    \nNow, your `Spring` application is running, and you can check it by running the\
    \ following command.\n\n● `java -Xmx1024m -jar create_app.py`\n● Go to `http://localhost:9200/`,\
    \ and then you can see the result of the `Spring` application.\n\n## How to integrate\
