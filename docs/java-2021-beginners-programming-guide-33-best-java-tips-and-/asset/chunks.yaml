  raw: 'With so many people complaining about the JPA API and other issues, I hope
    that we will be able to see a standard and well-supported JPA API soon. However,
    it has been well over a year since JSR 343 (a.k.a. JPA 2.1) was submitted and
    we are still in the beginning phases of development. Since most of the tools that
    I work with do not offer JPA support, I suspect that there is no replacement for
    the JPA toolkit in most development environments.


    # Chapter 12 What is Java framework spring?


    One of the most versatile Java frameworks, which offers not only the best programming
    language practices but also several Java services which facilitate your projects
    efficiently. Spring is a flexible and fast framework, which helps you to efficiently
    deal with large and medium scale projects.


    ## What are the different types of spring frameworks?


    There are 2 major types of spring frameworks:


    ●     Spring Boot, Spring MVC


    ●     Spring Cloud, Spring Cloud Helper, and Spring Batch


    ## What is Spring Framework vs Spring 4?


    For the Spring Framework, you should know that it has a new name and it is called
    Spring Framework 5, which offers several great benefits to the developers.


    ## Spring Framework vs Spring 4.1


    For developers who want to use this new version of spring frameworks, but are
    using Spring 4.1 versions, then you can read about this type of difference in
    the article.


    ## What is Spring 5?


    Spring 5 is the most recent version of the spring framework, which offers new
    features to the developers.


    ## Can you use spring-boot to solve your project issues?


    Yes, you can use spring-boot to solve your project issues. If you want to check
    this, then you can try the following examples:


    ●     Let''s say that you have to deploy your project on different servers.


    ●     To do this, first, you have to set up a web server.


    ●     Then, you have to configure the server to run this specific application.


    ●     The final step is to upload your application to the web server and then
    start it.


    ## How to integrate Spring Framework?


    To integrate Spring Framework into your existing application, then you have to
    make one more procedure. The final step is to run this application with the help
    of different Spring Boot libraries.


    ## How to integrate spring-web


    The first approach is to integrate spring-web. In this case, your application
    will be a web application, but also it will be hosted on a different server.


    To use this application, you will need to create a new project.


    Now, you need to create a new repository from where you can download this application.


    We are going to use Spring Data JPA because we have to handle only a JPA connection
    and no database yet.


    ## Let’s see a detailed example of Spring Data JPA


    First of all, you will need to create a new project in a folder that contains
    a spring-data-JPA-example.


    Now, you need to configure your project with a migration database name. In this
    tutorial, we are going to use the postgres database name. In our project, it will
    be psql-postgres.


    After you finish the migration, you can go to the command prompt of your favorite
    operating system, and then run the following command.


    ●     curl-I http://localhost:9200/spring-data-jpa-example/spring-data-jpa-example-migrations/migrations/create_app.py


    This command will create a new file named create_app.py in the ./data/lib/jpa
    directory of the project.


    If you want to see how it’s used, then you can run the following command.


    ●     python manage.py makemigrations


    This command will create a file named create_app.py in the ./data/lib/jpa/jpa_project
    directory of the project.


    Now, you need to run the following command to start the web server in your environment.


    ●     java -Xmx1024m -jar create_app.py


    This command will start the database in your environment, and then, you need to
    go to the http://localhost:9200/. You can start the Spring web server with the
    help of the command below.


    ●     java -Xmx1024m spring-boot:run


    You can see how it’s used in the following example.


    ●     public class HttpApplication extends Runnable { private static final String
    VERSION = "0.0.1"; private static final String ENVIRONMENT = "test"; public static
    void main(String[] args) { HttpApplication app = new HttpApplication(); app.setVersion(VERSION);
    app.setEnvironment(ENVIRONMENT); app.start(); } private static void main(String[]
    args) { SpringApplication.run(HttpApplication.class, args); } }


    Now, your Spring application is running, and you can check it by running the following
    command.


    ●     java -Xmx1024m -jar create_app.py


    ●     Go to http://localhost:9200/, and then you can see the result of the Spring
    application.


    ## How to integrate spring-mvc


    If you are ready to use Spring Framework for your web application, then you can
    use spring-mvc as an integration point.


    For this, you need to create a new project.


    Now, you need to configure your project with a migration database name. In this
    tutorial, we are going to use the postgres database name.


    After you finish the migration, you can go to the command prompt of your favorite
    operating system, and then run the following command.


    ●     curl-i http://localhost:9200/spring-mvc/spring-mvc-migrations/migrations/db_migrations.py


    ●     This command will create a new file named db_migrations.py in the ./data/lib/migrations/
    directory of the project.


    Now, you need to run the following command to start the web server in your environment.


    ●     java -Xmx1024m spring-boot:run


    You can see how it’s used in the following example.


    ●     public class HttpApplication extends Runnable { private static final String
    VERSION = "0.0.1"; private static final String ENVIRONMENT = "test"; public static
    void main(String[] args) { HttpApplication app = new HttpApplication(); app.setVersion(VERSION);
    app.setEnvironment(ENVIRONMENT); app.start(); } private static void main(String[]
    args) { SpringApplication.run(HttpApplication.class, args); } }


    This command will start the database in your environment, and then, you need to
    go to the http://localhost:9200/. You can check the result of the Spring application
    by going to the http://localhost:9200/spring-mvc/spring-mvc page.


    ## What else can Spring Framework do?


    We have already seen the basic features of Spring Framework. You can read more
    about the Spring Framework by visiting its official website.


    Now, we have to discuss how you can use Spring Framework to improve the performance
    of your Spring-based web application. In this section, we are going to talk about
    Spring MVC.


    ## What is Spring MVC?


    Spring MVC is a part of Spring framework. This project implements a common programming
    interface for multiple web applications. There are several features implemented
    in this project that can be used for increasing the performance of a Spring-based
    web application.


    The Spring MVC provides several features like:


    ●     Enterprise-grade support


    ●     Simple user interface


    ●     Easy unit testing


    ●     The fast loading web application


    ●     Highly configurable


    ●     Consistent MVC


    ## PHPStorm: Spring MVC


    We are going to build a real-time website in PHP. The website will be used to
    display live football results.


    We will use three technologies:


    ●     Spring Boot


    ●     Spring Data Rest


    ●     Lazy Loading


    Lazy Loading is a feature provided by Spring Framework that allows us to load
    the data only when it’s needed. It’s a good technique for improving the overall
    performance of a Spring-based web application.


    The following code snippet shows a simple view of the football scoreboard. It’s
    a very simple HTML file that just contains a line that says “Click me to watch
    the game”.


    ●     <body> <div> <h1>Welcome</h1> <p>Live football results: </p> </div> </body>


    We will create the template for the football scoreboard view, and we will use
    Lazy Load for lazy loading the data from the database.


    ## Creating the View


