    ```java

    Array[Char] *[] possibleLocations = new Array[String] { "Duval", "Mellersberg"
    }; Optional[String] toIsTodo = new Optional[String] { "succeed", "nopriv", "fail",
    null }; for ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]
    = toIsTodo; }

    ```


    `Optional` 类为可选值提供了 `Nullable` 构造函数。`Optional` 构造函数与 for 循环配合使用时，用于产生包含给定类型值和其他可选非约束属性的单个对象。例如：


    ```java

    optional val x = new Optional(true); for ( int i = 0 ; i < 10 ; i++){ x.add(null);
    }

    ```


    使用注解 `Optional[T]` 将类型标记为 `nullable`（或非 `nullable`）。以下示例等同于之前所示的 for-all 循环：


    ```java

    String[] possibleLocations = new String[10]; Optional[String] toIsTodo = new Optional(true);
    for ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]
    = toIsTodo; }

    ```


    表达式 `toIsTodo` 可以被视为当前的可空值，也可以视为 for-all 循环的结果。如果表达式 `toIsTodo` 是可空值，则 `Optional.isNull()`
    方法返回 `true`。否则，`Optional.isNull()` 方法返回 `false`。


    以下示例不允许 `Optional` 值：


    ```java

    String[] possibleLocations = new String[10]; Optional[String] toIsTodo = new Optional(true);
    for ( int i = 0 ; i < possibleLocations. length ; ++ i ) { possibleLocations[i]
    = toIsTodo; }

    ```


    当给 `String` 值提供 `Optional` 构造函数时，它等同于 if 语句。


    下面的示例等同于之前所示的 for-all 循环：


    ```java

    for ( int i = 0 ; i < 10 ; i++){ possibleLocations[i] = toIsTodo; }

    ```


    以下示例可以被视为一个 for-all 循环：


    ```java

    for ( int i = 0 ; i < 10 ; i++){ possibleLocations[i] = toIsTodo; }

    ```


    用于可空 `List[]` 的 `Iterator` 用于修改元素队列中的相同值。


    ```java

    List[] possibleLocations = new ArrayList < String >(); for ( int i = 0 ; i < possibleLocations.
    length ; ++ i ) { possibleLocations[i] = toIsTodo; }

    ```


    当给定类型为 `null` 时，`Optional.isEmpty()` 方法返回 `true`；当给定类型不为 `null` 时返回 `false`。以下示例在数组类型为
    `ArrayList` 时返回 `true`，如果是 `Array` 则返回 `false`：


