- fmt: '

    Now the version of Erlang that I’m working on will probably have an API that will
    support list functions and other forms of partially applied functions. So you
    can probably see why you should use imperative programming in Erlang instead of
    functional programming. Functional programming is much easier to understand than
    imperative programming, but when you’re dealing with critical systems, where you
    are using the standard library, it can be very hard to think about all of the
    available options, and how to apply them to your problem. And if you’re dealing
    with critical systems, you probably don’t want to think about it at all.


    ## Imperative Programming and Typesetting


    Another good reason to use imperative programming, in my opinion, is that it allows
    you to do this thing called typesetting. You write your programs in a way that
    it gets compiled, it is converted, into a way that it can be read. There are different
    levels of typesetting in Erlang, for example, the compiler can automatically convert
    your program into a functional language. And then the different parts of your
    program, like methods, you can write them in a functional language.


    The same is true of `Java`, `C++`, or any other language you might want to use.
    The compiler will recognize that it is a language and that parts of the program
    are going to be executed in the imperative language, and the rest of the program
    is going to be executed in the functional language. And this is the dynamic type
    of programming.


    ## Dynamic Translation


    You write your programs in a way that they can be dynamically translated. That
    is if you write a program in a functional language, and you want to put some data
    in there, like a function or two, then those data are going to be automatically
    converted into the form of an imperative statement, or an imperative data structure,
    so you can insert them in the middle of your program, and see what’s going to
    happen. And then when you run the program, you can get the effect of those data
    that you were putting in there.


    So if you’re not afraid of dynamic typesetting, then you should probably consider
    using Erlang, and your programming style will probably change a bit. But you can’t
    see it because you’re just staring at your screen.


    ## Distributed Computing in Erlang


    One of the last examples I’m going to give is about distributed computing, where
    you have multiple nodes interacting with each other. This is pretty much the same
    paradigm that is used in distributed computing with cellular automata, in that
    in Erlang, every process has to be able to communicate with every other process
    that they have access to. And it’s cool.


    It’s kind of a global, distributed, parallel computing model, where the communication
    between processes can be at several different levels. Each process has access
    to all of the processes that they have access to, and at each level of communication,
    there’s something called a `message`, and that `message` is what is sending and
    receiving data.


    For example, you might have a process on the same machine that you’re running
    Erlang in that has two different mailing lists, or maybe one email list. And they
    can both send mail or reply to each other. There are a lot of things you can do.
    You can set up distributed processing, which is neat.


    One of the things you do have access to, but many other languages don’t have access
    to, is the communication between processes. To write programs in a distributed
    way, you have to learn how to write programs in a distributed way. So in the previous
    example, you had to learn how to write distributed Erlang.


    ## Distributed Type Systems


    One of the other things that you do have access to is a distributed type system.
    The type system in Erlang is not just static type checking; it’s not just static
    type checking for scalars. It’s also dynamically typed.


    In other words, if I write a program and I give it to the compiler, the compiler
    automatically recognizes that the code that I am giving the compiler has to be
    able to handle the fact that this program is running in an interconnected cluster
    of nodes, and the nodes are communicating with each other. And the compiler has
    to know how to recognize when these nodes receive the `messages` sent by the nodes
    that are a part of the cluster. So there are also distributed type systems.


    One of the cool things that are possible with a distributed type system is dynamic
    type checking for Erlang nodes. So if I have a type system that I’m familiar with
    in my language, and I want to have a distributed type system, the cool thing is
    that I don’t have to do anything special. Because if I have a type system, and
    I can communicate with the distributed type system, I can send messages to the
    distributed type system. And it will type check the code that I give to it. So
    it’s very cool.


    And one of the other cool things about having a distributed type system is that
    if there’s a type that a distributed type system can’t handle, or doesn’t know
    how to handle, then it will provide you with some help. So if a `message` comes
    in that is not something that a distributed type system has yet to deal with,
    then that `message` will provide you with a hint that tells you how to deal with
    that `message`, and it will do so without you having to read the code for that
    `message`.


    So that’s another thing that’s cool about Erlang. And when it comes to these distributed
    type systems, it’s not just distributed type systems; it’s also distributed type
    checking. So if you write code that has the correct type signature, and you send
    that code to a distributed type system, then the type checker that the distributed
    type system provides will validate the code, but it won’t automatically type check
    the code. It will just tell you what the types are and where they come from. And
    when you read the code, you’ll know what the types are.


    And the nice thing is that these distributed-type systems exist. They’re something
    that you can go and talk to if you’re not familiar with them. They are being built.
    So I have an IRC channel that has people that work on them, and I have a mailing
    list that people that work on use to talk about them. So the future is full of
    distributed-type systems that work with Erlang.


    ## Communication Protocols


    This is all interesting. But there’s a problem with this. I’m building a distributed
    type system, and Erlang is a distributed language. So how do I communicate with
    my type system?


    There is one protocol that Erlang does have. It’s called `SIGTERM`. And it’s really
    simple. It says, “Go away for a bit because you’re going to be blocked for some
    time.” But it also has other elaborate protocols. One of those is `SIGQUIT`, which
    is something that when you call the system method on any type, it will eject the
    type, and then it will tell you that the type has ejected itself. And that’s it.


    So `SIGTERM` and `SIGQUIT` are used for two different purposes. So when you call
    `SIGTERM`, you’re telling the language runtime that something is going to block
    in your program, and you don’t want to see it for some time. And when you call
    `SIGQUIT`, you’re telling the language runtime that you don’t want to see the
    type again, for any reason, ever.


    But there are a couple of problems with this. So if I want to share data with
    my distributed type system, then I have to use two different ways of communicating
    with it. I have to use `SIGTERM`, and I have to use `SIGQUIT`. If I want to see
    what type a message is in, I have to know the type of message that it’s emitting.
    And if I want to communicate with that type of message, then I have to know the
    type of that message.

