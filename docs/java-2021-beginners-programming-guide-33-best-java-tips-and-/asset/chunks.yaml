    第四种选择是查看 SpringSource Developers 博客上的论坛教程。找到其中的一些最佳解决方案已经相当困难了，而这会激发你的灵感去编写自己的实现。我了解过几个项目，它们自己编写需要一个周末，而只要经过周末的认真努力就能轻松写出来。


    你也可以与其他人合作编写一个你喜欢的的设计模式的实现。如果存在重大问题，或者如果你通过共享这些问题可以获得巨大收益，那么你就应该考虑投入精力创建你的实现并将其与社区共享。


    最后，如果你有时间和资源，你可以亲自亲手编写一个对 Java 平台有重大收益的设计模式实现。我不建议你这样做，因为如果你真的那样做了，可能会对你的职业生涯产生重大影响。


    # 第 14 章节：什么是 Java 的 Web 服务？


    用于 Java 的 `JSR 307™` Web 服务规范被称为 `WebSocket Specification`。官方规范由 `W3C Web Applications
    Working Group` 于 2010 年 6 月 20 日发布。本页将介绍更多关于 `W3C WebSocket` 规范的内容。


    ## 什么是 Java Web 服务的库和工具？


    大多数用于在 Java Web 服务之上构建应用程序的库都是商业性的。开发者通常必须在一些领先的商业服务（如 `Stormpath` 等许多服务）之间进行选择。然而，也有许多开源项目，包括几个拥有活跃支持社区的
    `Java EE` 社区。


    * 开源项目

    * Java EE Web Services

    * SWARM

    * OWASP WEB-API-Security

    * Docker for Java


    ## Java EE 7 怎么样？


    如果你是一个 `Java EE 7` 开发者，那么 `Java EE 7` 及其规范中添加了一些新功能。本页包含了这些变更列表。


    ## Java EE 6 和 Java EE 7 之间有什么区别？


    `Java EE 7` 并不是 `Java EE 6` 的新版本。`Java EE 6` 并不打算作为 `Java EE 7` 的超集。如果你想了解这两个版本之间差异的细节，我们已经多次写过这个主题，包括
    `Rich Landa` 写的一篇详细博客文章。


    ## Java EE 规范


    `Java EE 7` 的官方 `Java EE` 规范源自以下规范：


    * HTTP Basic 身份验证

    * JavaServer Pages, JavaServer Faces, JavaServer Display Faces (JSF)

    * CloudFoundry

    * PolicyKit

    * JavaSE API for RESTful Web Services

    * Cloud-Build

    * Container IPC

    * Lifecycle Methods (LINQ)

    * API Gateway

    * 托管 (Hosting)

    * JAX-RS

    * JAX-WS

    * CDI


    通过少量的修改，这些规范大部分提供了实现 Java Web 服务所需的概念。然而，`Java EE 7` 带有许多额外的功能，这些功能在不同的模块中实现或由开源项目提供：


    * Java API for RESTful Web Services (JAX-RS)

    * Cloud Foundry

    * JavaServer Faces

    * JavaServer Display Faces (JSF)

    * JAX-WS

    * Java EE Web Services (JSR 307)


    ## Java EE 7 及其规范的状态如何？


    基于 `Cloud Foundry Integration Pack` 的作为 `Cloud Foundry` 一部分的 `Java EE 7` 实现已供下载。在不同的项目中有
    `Java EE 7` 规范的实现。例如，`Codeplex`、`Apache OpenJPA` 和 `Apache TomEE` 都可以下载。这些项目以开源形式或免费提供。


    在以下章节中，我们总结了 `Java EE 7` 规范及其模块的状态。项目的状态可以在其 `GitHub` 仓库中找到。


    Java EE 7 作为 Eclipse MicroProfile 发布：截至 2015 年 7 月，`Eclipse` 已将 `Java EE 7` 及其模块化实现作为
    `Eclipse MicroProfile (EM)` 模块包含在。`ECMA-376 Java EE 7` 规范已经成熟。`Eclipse MicroProfile`
    是构建在 `Java EE 7` 模块化实现之上的 `Eclipse` 组件。


    Java EE 7 和 JavaEE 6 的兼容性：`Java EE 7` 是一个全新的规范，因此与 `Java EE 6` 不兼容。为了确保互操作性，`Eclipse
    Java EE 7` 功能可以与现 `Java EE 6` 技术以及所有之前的 `Java EE` 版本一起使用。


    Java EE 7 和 Java SE API for RESTful Web Services：`Java SE` 中用于 RESTful 服务 (REST)
    的大多数 API 都基于 `JSR 307` 规范，但 `Java EE 7` 也兼容该规范。如果你的下一个项目需要使用 `JSR 307` API，你应该考虑使用
    `Java EE 7` 或另一个 `Java SE APIs for RESTful Web Services` 的实现。


    Java EE 7 和 Cloud Foundry：截至 2015 年 7 月，`Eclipse` 已将 `Java EE 7` 规范作为 `Eclipse
    MicroProfile` 包含。`Cloud Foundry` 支持 `Java EE 7`。


    Java EE 7 和 PolicyKit：截至 2015 年 7 月，`Eclipse` 已将 `Java EE 7` 规范作为 `Eclipse MicroProfile`
    包含。`PolicyKit`（`Java API for RESTful Web Services`）是一个 `Eclipse MicroProfile`。


    Java EE 7 和 Entity Framework (EF)：虽然 `EF` 不是 `Java EE 7` 支持的依赖，但 `Java EE 7` 支持以下模块：


    * javax.model

    * javax.relation

    * javax.Security

    * javax.spout

    * javax.sapi

    * javax.tls


    `Java EE 7` 的实现兼容所有之前的 `Java EE` 版本，因此你可以重用早期版本的功能。


    ## 如何知道我的 IDE 中哪些 Java EE 7 规范？


    Java EE 7 支持

    * Eclipse MicroProfile 支持

    * Eclipse EE 6 支持

    * Eclipse EE 5 支持


    Java EE 7 Java EE 7 模块兼容性

    * 无：Java EE 6 兼容：部分：Java EE 7 兼容：完整


    `Eclipse MicroProfile` 的 `Java EE 7` 实现由 `JSR 307` 标准模块实现、一个 `JAX-RS 2.1` 实现以及一个
    `EJB 3.1` 实现。相比之下，为 `Java EE 6` 实现的 `JSR 285` 模块化实现是一个独立的 `JSR-292` 实现。


    ## Eclipse Enterprise for Java 6


    Eclipse Enterprise for Java 6 (EE6) 提供了 `Java EE 6` 功能。`EE6` 实现包含了 `Java EE 6`
    服务以及所有之前的 `Java EE` 规范（`JAX-RS`、`JSF` 和 `JAX-WS`）。`EE6` 实现包含了 `Java EE 7` 的 JSR，并与
    `Java EE 7` 互操作。


    ## Eclipse Enterprise for Java 7


    Eclipse Enterprise for Java 7 (EE7) 实现提供了完整的 `Java EE 7` 功能。`EE7` 实现包含了所有的 `Java
    EE 7` 服务以及所有 `Java EE 6` 规范（`JAX-RS`、`JSF` 和 `JAX-WS`）。`EE7` 实现与 `Java EE 6` 互操作，并将成为
    `Eclipse EE 7` 中默认的 `Java EE 7` 实现，新的 `Java EE 7` JSR 将被添加到 EE7 中。

