    If you chose to select the `java.jdbcCache` directory, then you would be able
    to navigate to the `jdbcCache` directory, and you would have a directory named
    `jdbcCache`. If you chose to select the `java.jdbc.Cache` directory, then you
    would have a directory named `jdbcCache.` If you chose to select the `java.jdbc.HttpConfig`
    directory, then you would have a directory named `jdbcCache.`


    So for this particular Java app that we’re going to be working with, we want to
    try to get this JRE Cache file to be stored in the `jdbcCache` directory within
    the `jdbcCache` directory.


    However, before we can do that, we are going to need to have some Java files located
    within the `application` directory that we’re working with. So we are going to
    go ahead and click on the second tab in our terminal window, and then click on
    the third tab. This will be within the folder called `assets.` Within this folder,
    we will be able to find two files that we’re going to drag into the terminal window
    within our workspace directory.


    ## What are frameworks for Java?


    If you are used to working with frameworks, and this is by definition the majority
    of Java developers, then please read this article about frameworks and what they
    are not. Frameworks are designed to help you use common functionality, which can
    be included in the codebase or extracted for development.


    You might think that if your application is fully composed of frameworks (almost
    like a library in JavaScript), you should write your code and not worry about
    the framework at all. This is true if you follow the guidelines of microservices,
    which is exactly how a modern codebase should look like. You write the code and
    the framework just provides you with its static pieces.


    But if you want to, for example, write an embedded server that you can run in
    your browser or just a web API to expose a static route for clients to load/list
    your RESTful API, then there is absolutely no reason to be thinking of your code
    as an implementation of some underlying framework. You can just write the application
    in pure Java, and the framework will do the extra bits of work for you.


    It is this flexibility that makes frameworks a headache. You might imagine that
    the work a framework adds to the code is done for you. The truth is that most
    frameworks are designed in such a way that they require a certain way of thinking
    about the code you write. Frameworks change the way you think about how your application
    is constructed. You don''t want to break your structure, because that can cause
    a mess.


    A quick example: To use JSF for your Java web applications, you must use the annotations
    to specify how a Java object should be rendered.


    You need this annotation, and you should always use it. It will hide your code,
    and make it clear to a developer who is unfamiliar with JSF that this class should
    be called `MyPresenter` and should have its `primary()` method called `schedule()`.


    ## Framework design considerations


    Now that we got the semantics out of the way, let''s talk about the design choices
    that made it possible to write a framework in Java in the first place. I have
    listed a few of them here, and then I will try to help you understand what is
    in a framework.


    ## Aesthetics and syntax


    Frameworks are bad because they look bad. They look like a throwback to a world
    where everything used XML files to store data. This may not seem too bad when
    you''re writing a script that runs as a service, but it makes you start to hate
    it when you come to write something like a Spring MVC framework. You want to move
    towards the platform on which you want to build an application, but since you
    are writing a framework, your MVC code needs to obey all the syntactic norms of
    the framework that makes it look pretty.


    I said earlier that frameworks are bad because they look bad, but the bad part
    is not the fact that it looks ugly. It''s the fact that everything needs to look
    nice, which adds to the complexity of the project. How can you keep the modularity
    of the system when you start adding more dependencies and classes to it? You are
    forced to mix more and more clean, modular parts together to make up a whole,
    with a level of vertical separation that is quite annoying.


    The same thing happens when you try to write a pure Java framework. Not only do
    you need to wrap your code in a peculiar mixture of Java and Scala to behave like
    a true framework, but you also need to provide the libraries necessary to get
    the framework to understand it. For example, `javax.faces` should be a core library
    for Spring MVC, but you cannot provide it as a dependency of your project.


    It has the same reason as an XML configuration file: it needs to look and behave
    like it is designed to be part of a codebase. You don''t want to hide it somewhere
    where someone can''t find it, even if it would help you to increase its modularity.
    So you end up making a huge class with an abstract set of API that only a developer
    who has a working knowledge of the framework can use.


    Java, on the other hand, does not have this issue. A programmer who wants to use
    a pure Java library, that is designed to be part of a project, can just use it,
    without worrying about the framework. Spring MVC is a Java library, not a framework.
    It is a good place to start your Web development, because all the abstractions
    it provides are pure Java, without worrying about annotations and when to use
    them. The Scala team learned from this to develop Typesafe Scala, which, just
    like `javax.faces`, is a Java library.


    ## Scala and MVC


    The biggest advantage of using Scala is that it provides the framework from the
    ground up for MVC. It''s a purely functional language that provides primitives
    and procedural abstractions to give you the framework from the ground up, without
    additional dependencies. You can just focus on your application and do all refactoring
    in your local IDE. There are some tricks you can do to make your code more modular
    by using concepts like `val`. However, the pure Java implementation still provides
    all the power, and it does it without headache.


    As for the rest of the MVC framework, Spring and MVC, it is just another Java
    library. They have many similarities. Spring MVC is based on the JPA framework,
    which has been recently rewritten in Scala and can provide a more declarative
    API than Java types. JPA enables a system to resolve columns and column sets of
    a database based on columns that are declared in the entity objects that are created
    in the controller classes.


    In terms of the functional programming concepts that Scala offers, it can be seen
    as a generalization of the Scala language. There are no fundamental changes to
    the language, which provides libraries to implement imperative concepts, like
    setters, predicates, and the like. However, every layer of the stack that is added
    to the application, adds abstractions to the code and adds functional elements.
    Thus, a major way to extend your application with functional concepts is to use
    Scala code within an existing Java application.


    Generally, a more functional language will handle more abstract concepts of the
    real world. Java, on the other hand, provides more of the imperative concepts,
    and more of the more special-purpose techniques used in object-oriented programming.
    You can use functions to iterate over arrays, you can use a callback, you can
    use multiple return values, etc. In functional programming, you don''t care about
    any of these abstractions and instead focus on working with concrete concepts.


    ## MVC and Spring


    Spring MVC is a small library that implements the MVC pattern for the Spring framework,
    which is a community-driven Java framework that allows you to extend the native
    API of Java applications. You don''t need to get this library from somewhere else,
    it''s built into Spring.

