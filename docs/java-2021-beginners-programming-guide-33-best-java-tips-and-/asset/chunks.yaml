    结对编程是一种开发实践，两名开发人员在同一个应用程序上工作。通过协作，他们可以更快地发现问题并避免误解。


    结伴完成项目是帮助开发者学习最佳实践和相互测试工作的极佳方法。


    ## 寻找导师


    如果你还没有导师，应该尝试寻找一位在你专业领域有经验的导师。


    寻找导师有几个很好的原因。你将学习到其他开发者如何与 `Java` 交互，并在此过程中提升自己的技能。此外，你将获得建设性的批评，帮助你作为开发者不断成长。


    导师是理解可用工具的绝佳途径，因此强烈建议你与理解这些问题的人一起工作。


    ## 使用版本控制


    版本控制允许开发者通过许多节点来跟踪项目的进度。在决定一个项目之前，开发者应该建立一份设计文档，列出他们想要实现的所有各种组件和功能。


    然后，开发者可以检查整个项目并创建一组迭代测试来检查软件的功能，并根据需要进行更改。


    设计文档可以使程序需要完成的任务更加清晰，通过创建一组测试用例，开发者将知道自己何时接近创建出一个功能性产品。


    ## 开始学习


    一旦你达到了熟练水平，就应该开始学习新语言，甚至学习一种完全全新的语言。新语言的语法通常在应用程序支持的功能方面提供更大的灵活性和功能。


    为了继续学习，你应该每天留出时间来练习和复习你学过的材料。利用额外的时间尽可能多学习你正在使用的语言或应用程序。


    ## 编写文档


    文档是让开发者和用户尽可能满意的极佳方法。拥有文档有助于人们找到他们需要的内容并理解如何使用该应用程序。


    本文档作为开发者进行任何必要更改的参考。


    ## 将“保存点”替换为“热重载”


    我们所谓的保存点实际上是热重载点。也就是说，当我们保存应用程序时，我们可以看到我们正在所做的更改。然而，热重载功能允许开发者在保存之前直接进行更改。


    热重载是无需重新编译即可测试代码的极佳方法。当它保存时，更改会被提交，开发者可以立即使用应用程序。


    ## 不要重复自己 (DRY)


    避免重复自己是开发者的责任。


    我们倾向于接触熟悉的事物。我们所做的是常态，因此常态就会起作用。


    与其遵循常态，不如尝试为开发者提供自我挑战和学习新技术的机会。


    ## 使用极端编码


    极端编码是一种开发应用程序的方法，要求为了设计或功能需要大量的代码。这也被称为手工艺或“夜校”编程。


    作为一名开发者，你应该尝试避免遵循学校里教给我们的传统编码模式。


    通过应用极端编码，你工作的一系列模式为你的应用程序提供了稳固的结构和架构。这些模式通常鼓励创造力，并提高开发者的效率。


    ## 避免大型代码库


    代码过大难以调试，更难以维护。代码过小难以测试，通常会导致应用程序臃肿。


    你的代码大小应该与应用程序的大小成比例。


    ## 使用代码检查工具 (Linter)


    编写在其他开发者看来正确的代码是非常重要的。确保你的代码没有拼写错误是一个良好的习惯。


    然而，每次进行更改时测试所有代码可能是枯燥的。但是，代码检查工具可以确保你的代码始终反映你的意图。


    ## 使用类而不是面向对象编程


    通过以面向对象的方式编码，你的项目会变得更加复杂。


    使用类有助于简化你的项目，因为它在整个应用程序中遵循单一类。这意味着每个类和每个方法都得到了清晰的描述。


    ## 避免虚拟空间


    虚拟空间仅仅是空间：你可以在互联网上相互交流的空间。这些是由游戏开发者和投入大量资金构建它们的人创建的虚拟世界。


    在虚拟世界，你可以去你想去的任何地方，和任何你想见的人在一起。


    ## 简化代码


    当你遵循 KISS 原则时，你让代码变得更容易理解。


    代码应该始终逻辑通顺。通过删除不必要的动作来简化程序，例如将字段从一个变量移动到另一个变量的代码。


    这些操作是冗余且难以理解的。


    ## 避免关键字 ''a''


    ''a'' 是一个通用关键字，指代开发者可以使用所有类型的值。


    例如：`''a''` 是 `4` 的整数值。你通常应该避免对泛型类型使用 `''a''`，因为这会导致代码中的拼写错误。


    ## “乞题 (Begs the question)”


    “乞题”是一种写作风格，侧重于提出读者正在思考的相同问题。


    常见的例子是：


    我问了一个关于和类型（sum types）的问题，而你问了一个关于边界类型（bounded types）的问题。这些都是提出的有效问题，但它们以两种不同的方式被处理。这是使用该问题的一种常见方式。


    这是应该在你的代码中解决的问题：


    这种类型是有边界的，但 `Int` 是什么？你能给我一个关于默认值的示例吗？我没有写多少代码，但我读过一些代码。我的 `Int` 值是多少？这是 `Int`，那么
    `''Int''` 是什么？限制是什么？哪种定义的限制？


    ## 描述，而不是提问


    描述代码是指定你代码意图和结构的一种。它比仅仅提问更好。


    写下你代码每个部分的作用，包括它的名称。


    ## 递归


    递归是一种编程风格，允许你构建比需要更大的函数，但仍然保持良好的结构。


    这意味着你不需要编写中间代码（如果你想添加新函数，代码的大小不应该增加太多）。


    ## 承诺


    承诺是一个指定未来状态的对象。


    通过使用承诺，你允许在承诺完成时执行操作。


    承诺常用的用法是当错误发生时完成操作，你也可以用它们来生成数据。


    在这个示例中，我们创建一个 `A`，表示在制作 `A` 时执行的操作。操作成功由 `A` 表示，错误由 `Not A` 表示。


    由于我们使用了承诺，这将自动终止我们的代码。想法是代码应该在承诺完成时才退出。


    几点需要注意：


    - 承诺是一个强大的概念，但也非常容易被误解。

    - 不要创建不需要的承诺。

    - 避免转换或任意函数。

    - 避免使用函数字面量。

    - 不要依赖 jQuery。

    - 不要使用模板字面量。

    - 避免返回 `''b''` 值。

    - 永远不要返回浏览器理解的内容。


