    value, int number) { this.value = number; } public CustomType(T value, bool equals)
    { this.noEqual = equals; } public CustomType(T value, int noNumber) { this.noNumber
    = noNumber; } public T getValue() { return value.getValue(); } public void setValue(T
    value) { this.value = value; } public void setNoEqual(bool isEqual) { this.noEqual
    = isEqual; } public int getNoEqual() { return noEqual; } public int getNoEqual()
