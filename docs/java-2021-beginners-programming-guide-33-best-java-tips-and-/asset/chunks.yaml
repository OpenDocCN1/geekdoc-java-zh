    The difference is that the parameterized class is “inherited” from the base parameterized
    class, but not “entitlement”. If you use a weak parameterized class, the parameter
    can be changed by its child classes.


    For instance, in the `CustomType` class, you could have changed the value of the
    parameter so that it has no effect. If the parameter parameterized class is a
    `WeakParameterizedType<T>`, it would still be inherit from the base class, so
    you would still have to call the method as in the following example:


    ```java

    public class CustomType<T> { public WeakParameterizedType<T> (T value) { this.value
    = value; } public WeakParameterizedType<T>(T value, string name) { this.value
    = name; } public WeakParameterizedType<T>(T value, int number) { this.value =
    number; } public WeakParameterizedType<T>(T value, bool equals) { this.noEqual
    = equals; } public WeakParameterizedType<T>(T value, int noNumber) { this.noNumber
    = noNumber; } public T getValue() { return value.getValue(); } public WeakParameterizedType<T>(T
    value, string name) { this.value = name; } public WeakParameterizedType<T>(T value,
    int noNumber) { this.noNumber = noNumber; } public void setValue(T value) { this.value
    = value; } public void setNoEqual(bool isEqual) { this.noEqual = isEqual; } public
    int getNoEqual() { return noEqual; } public int getNoEqual() { return noEqual;
    } }

    ```


    You could change the parameter so that the value is changed to null , and you’d
    still be calling the same methods that you’d be calling with a strong parameterized
    class:


    ```java

    public class CustomType<T> { public CustomType(T value) { this.value = value;
    } public CustomType(T value, string name) { this.value = name; } public CustomType(T
    value, int number) { this.value = number; } public CustomType(T value, bool equals)
    { this.noEqual = equals; } public CustomType(T value, int noNumber) { this.noNumber
    = noNumber; } public T getValue() { return value.getValue(); } public void setValue(T
    value) { this.value = value; } public void setNoEqual(bool isEqual) { this.noEqual
    = isEqual; } public int getNoEqual() { return noEqual; } public int getNoEqual()
    { return noEqual; } }

    ```


    # Chapter 7 How to use Java programming libraries?


    Before we get started, it’s important to note that Java programming libraries
    (sometimes called Java libraries) are just a part of the Java language. We should
    understand them and how they can help us, but in no way should we think of them
    as an alternative to writing our code. With that out of the way, here are the
    most important things you need to know about writing Java programs using libraries
    and with libraries.


    ## The Best of both worlds: Libraries for Java programming.


    When you’re developing programs, Java libraries offer you an excellent option
    for solving a wide range of problems. It’s so convenient! It’s a relief, especially
    if you have to solve a lot of similar problems over and over again. They simplify
    the job of writing programs. And it’s all because they take care of most of the
    details for you: you just need to write your program and they take care of the
    rest.


    They can save you from writing a lot of tedious tasks, like security checks, for
    example, or code that requires tedious type-checks to perform correctly.


    ## Some of the many uses for Java libraries.


    However, before you start using a Java library, make sure you’re familiar with
    it. There are many Java libraries. Some, such as those that handle SQL, XML, and
    JSON strings, are quite specific to a certain programming language. Others, such
    as those provided by the Java compiler itself, tend to come with a large codebase
    and provide a lot of utility for the average Java programmer.


    The beauty of libraries is that they let you write as much code as you need for
    your project. You don’t have to worry about managing and maintaining your code
    in the same way you’d have to do if you were doing it by yourself. You can add
    new functionality to a library with just a few lines of code. The last thing you
    want to worry about is finding out which function you’re using is new to the library,
    or whether it has been updated recently. Libraries take care of that for you!


    In addition, you can easily use a library without having to write anything from
    scratch. With a good library, you don’t need to write a single line of code to
    make it work. This is also a very useful feature.


    ## Not so easy to use: Libraries require some effort


    The other characteristic of libraries is that they are not easily accessible.
    They often require you to create and register a full-fledged project in order
    to use it. Sometimes they have different registration schemes. But then, it might
    require you to write different, customized code for every single library you use.
    The tasks needed to use some libraries, especially complex libraries, might seem
    daunting.


    Another difficult aspect of using libraries is that they can have different interfaces.
    You have to study how they work, how to use them, and what you can do with them,
    in order to fully grasp the utility they provide and the final implementation
    of your program.


    Finally, some libraries contain substantial code. If you use them, you’ll have
    to spend time understanding all their pieces in order to use them. Even worse,
    sometimes there are incompatibilities between libraries. This usually means that
    you can’t reuse or integrate libraries without making changes. This can be even
    more annoying because you have to fix the resulting program, which you have created.


    ## What are some of the problems you face when using libraries?


    I’ll discuss the problems you can encounter when using libraries in Java. As you
    will see, sometimes it can be hard to see the forest for the trees, which is something
    that libraries are especially good at.


    Let’s start with some general problems, then we’ll get into a few libraries’ specific
    problems.


    ### Scalability


    Scalability is one of the big problems of using libraries in Java. With lots of
    developers writing lots of programs in Java, sometimes the systems get overwhelmed.
    As a result, a lot of your code is being run by the same server.


    In particular, a very large number of users using a single site (or worse, trying
    to use the same code to deal with a large number of users) can lead to it “quaking”
    under the weight of too many users. This is called jitter.


    It’s easy to find out how jitter works and prevent it in your applications. One
    way to prevent jitter is to keep the load on the server low enough that you’re
    not crashing and have to restart the whole application for jitter to go away.


    Another way is to use `CDN` and keep your application outside the application’s
    main server. In this case, the load is distributed across several servers. But,
    keep in mind that when applications run on the same server they tend to get more
    and similar in terms of functionality.


    One common solution to the jitter problem is to use a service like `Level3 CDN`.
    You give `Level3` the URL of your application and the `CDN` takes care of moving
    your code from the main server to the `CDN` server and on to your users, so you
    don’t have to worry about any jitter.


    ### Instance-based Data Structures


    There are two types of data structures in Java: `Object` and array-based.


    Array-based data structures allow you to store a group of objects in a single
    list, but they don’t let you assign or change any of the objects in the list.
    If you wanted to, you could replicate a particular item in the list by doing something
    like:


    ```java

    int [] anItem = new int [list.length -1]

    ```


    Object-based data structures provide similar functionality, but they also provide
    a way to modify an item at a given point in the list.

