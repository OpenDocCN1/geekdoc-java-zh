    旧类型系统的最后残留遗迹是：如果你对一个带有操作符实例的对象进行引用，并尝试将该对象实例的值设置为 `null`，编译器将抛出异常。如果你尝试传递一个类型系统认为未初始化的值（即其类型不包含构造方法的值），它也总是会抛出异常。但你无法定义一种产生异常的失败条件，而这种异常在
    Scala 处理未初始化数组、`null` 等情况时本应是正常情况。


    ## 优先使用闭包而非具体类型 (Favor closed over types)


    Scala 的最后一个一个可以从类型推断中获益的领域是极少使用的 Scala 类型之一：函数的第一个参数。这是一个类型为 `AssertionError`
    类型。该类型本质上是一个布尔值，表示断言是否失败，通常用于记录函数的第一个参数等操作。方法的调用要么成功（如果成功，则该方法中的代码执行成功），要么失败（如果失败，则方法调用未成功）。


    因此，如果你不确定是否需要担心让第一个参数变为可选，函数的第一个参数可以是类型为 `AssertionError` 的类型（即 `False` 或 `Some
    [Failure]`）。在这种情况下，你可以自由地声明参数类型为 `AssertionError`（如果参数是第一个参数则为 `true`，否则也为 `true`）或
    `AssertionError`（如果参数是第一个参数则为 `false`，否则为 `false`），而无需担心将其设为包含第一个参数值的类型。这结合类型推断，这意味着函数的第一个参数是一个值为
    `False` 或 `Some[Failure]` 的未初始化元组，因为类型推断可以轻松识别出函数期望第一个参数的什么值，而无需任何显式实例化。


    如果你在好奇，编译器之所以在函数第一个参数未初始化时智能地不抛出 `AssertionError`，原因在于：你总是将函数的第一个参数放入一个列表中，因此它在实际上是一个未初始化的元组。由于在这种情况下你保证会把第一个参数放入列表，而且由于元组列表始终只有一个值，因此编译器不需要担心其他问题。只要你不是开始向一个期望未初始化元组的函数传递列表，就是安全的。


    在许多其他情况下，函数第一个参数的类型并不重要。如果函数有几个参数，如果函数正在对大型集合进行某种转换，那么省略第一个参数可能是合理的。或者，如果第一个参数只是非常简单的东西，比如元组或返回元组的函数，它可能完全没有影响。


    ## 为什么第一个参数很重要 (Why the first argument matters)


    但让第一个参数作为一个至少包含一个参数的函数是非常重要的。其一，你不能将一个期望未初始化元组的函数传递给一个期望布尔值的实际方法。另一方面，如果函数有一个接口类型参数，你可能希望为函数的第一个参数提供一个合理的默认值（或至少是一个合理的可能值）。这有助于保持一致性。


    许多期望被另一个函数调用的函数，在第一个参数上需要一些额外的安全保障。例如，假设你有这样一个函数：


    ```scala

    def greet(person: Person, greeting: String) = person.greeting

    ```


    此函数期望被另一个函数调用，而该函数又期望被另一个期望字符串的函数调用。在这种情况下，如果第一个参数未初始化，则第一个参数没有合理的默认值，因此你可能需要在调用第一个函数之前增加一个额外步骤：


    ```scala

    def greet(person: Person, greeting: String) = person.greeting unless greeting.nil?

    ```


    另一个你需要确保第一个参数被指定为未初始化的情况是：当函数作为第二个参数返回某种值时。


    例如，假设你有一个函数接收 `Person` 并返回一个对该人员说话的函数。实现此点的常用方法是让第一个参数成为你进行拷贝并传递给构造构造，然后将拷贝赋值给第二个参数。在这种情况下，如果你将该拷贝设为未初始化参数，你必须确保第一个参数被指定为未初始化，否则程序将无法工作：


    ```scala

    def greet(person: Person, greeting: String) = person.greeting unless person.has
    last name("Garrity")

    ```


    如果你传递一个 `greet` 函数期望的字符串，那么对你想要打招呼的人进行拷贝将毫无意义。在这种情况下，你可能需要提供额外的步骤：


    ```scala

    def greet(person: Person, greeting: String) = person.greeting unless greeting.nil?

    ```


    但还有一种你不需要担心第一个参数类型的情况。假设你有一个函数接收 `Person` 并返回一个你用 `Person` 列表调用的函数，并且你希望第二个参数是
    `nil` 或字符串。在这种情况下，你不需要将第二个参数的类型指定为未初始化。


    你只需要知道第二个参数是列表还是字符串。但如果你有一个函数接收 `Person` 并返回一个你用 `Person` 列表调用的函数，且你希望第二个参数是 `nil`
    或字符串，你无法得知第二个参数是列表还是字符串，因此你必须指定第二个参数为列表或字符串，否则你可能需要一个额外的步骤：


    ```scala

    def greet(person: Person, greeting: String) = person.greeting unless greeting.nil?

    ```


    这个第二个例子是行的，因为你可以用布尔表达式指定第二个参数的类型，且第二个参数可以是列表或字符串。但第二个例子并不尽如人意，因为测试第二个参数比较困难。因此在通常情况下，你可能需要投入额外工作来确保第二个参数是列表或字符串。


    本节中的某些示例可以让你理解为什么必须指定第二个参数的类型，但它们并不是一对关系，有时你甚至无法说明为什么需要指定类型。


    例如，假设你有一个函数接收 `Person` 并返回一个你用 `Person` 列表调用的函数，并且你希望第二个参数是 `nil` 或字符串。在这种情况下，你不需要指定第二个参数的类型，因为它可以是列表或字符串。问题是这并不是一对关系，因为有时第二个参数可能是列表或字符串。那么，你可能需要的是指定第二个参数的类型为
    `nil`，如果你不想指定第二个参数的类型，你可能需要提供一个额外的步骤来指定第二个参数的类型。


    这相当令人失望，因为我并不总是知道为什么需要指定第二个参数的类型，但某些情况下你确实需要指定第二个参数的类型。


    我经常需要使用第二个参数类型的情况之一，是当我编写一个接收 `Person` 和 `Persons` 列表作为参数的函数，并且我希望第二个参数是列表或字符串时。我应该这样写：


    ```scala

    def function(person: Person, list: List[Person]) = person.greeting, list.length

    ```

