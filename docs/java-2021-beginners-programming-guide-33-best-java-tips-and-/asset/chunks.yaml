    The major drawback with the Microsoft Visual JScript compiler is that it doesn''t
    have an integrated version of the .NET framework, so you can''t use all of the
    built-in `.NET` APIs that are available in `Mono`. That''s not so bad in this
    day and age, because most APIs are available to the Microsoft Visual JScript compiler,
    which enables you to use more of the standard `.NET` libraries. But if you need
    to be more ambitious and use `.NET` APIs that aren''t included in the Microsoft
    Visual JScript compiler, you have to use the Microsoft Visual Studio 2005 or 2008
    versions, which are a little more complex to develop and deploy with.


    Both the Microsoft Visual JScript compiler and the Microsoft Visual Studio 2005
    version of the `.NET` Framework have integrated Java runtime libraries built-in,
    as well as support for `C++`, and that''s just based on Windows. But there are
    also versions for `Linux` and `OS X` that can run under the `Wine` software emulator.
    These versions are a little more complex to build and deploy, but they have all
    of the standard libraries and some more that are specific to that platform.


    On the other hand, the Microsoft Visual Studio 2005 version of the `.NET` Framework
    does require some heavy-weight Java code. You''ll have to manually compile the
    code for various platforms (with some libraries for `Windows` and `OS X` included)
    and then run them. This is why the Visual Studio 2005 version of the `.NET` Framework
    is not an option for the majority of Windows developers.


    The best option depends on the type of application you''re working on. If you
    have a server-based app or a desktop app, the Microsoft Visual JScript compiler
    works great and it''s probably the best way to go. But if you are working on a
    desktop app or a server-based app that needs more functionality than the Visual
    JScript compiler can provide, you''ll probably want to look at the `.NET` Framework.


    ## Choosing the right editor


    There are some reasons to choose which `IDE` you''re going to use. First and foremost,
    you need to make sure that it''s productive. You can''t build a productive environment
    without choosing the right editor.


    Another reason for choosing a good `IDE` is for its ease of learning. With the
    Windows version of Visual Studio, you''ll get to use the Windows Visual Studio
    `IDE`, which means that you can learn it in the same environment as the rest of
    your development team. This makes it much easier to learn.


    The Visual Studio software, on the other hand, has an integrated development environment
    for `Mac` and `Linux` (but not for `Linux` in the `Mac` version). The Linux version
    of the `.NET` Framework supports `Eclipse` with the `Mono` Development Kit, but
    you''ll have to port your code to use it.


    Having an integrated development environment makes learning a language easier.
    Just as an example, if you learn `Java` through `IntelliJ`, then you can easily
    transition to using Visual Studio. In contrast, if you learn `C#` through `Eclipse`,
    then you have to learn it in a different `IDE`, which makes learning a much more
    difficult process.


    Selecting the right `IDE` is probably one of the most important decisions you
    make as a software developer. After all, the way that you learn to program is
    one of the most important factors in the way you create software.


    ## What are the advantages of the Java language?


    Compared with other programming languages, the `Java` language comes with several
    benefits, which include:


    - **Consistency**. Every `Java` program can be compiled to the same bytecode.
    This allows programs to be written in such a way that every running program looks
    the same. While each `Java` program can also be interpreted on the fly, its performance
    is more limited.

    - **Hardware enablement**. Since the `Java` virtual machine is compiled to `Java`
    bytecode, the `JVM` can run all supported processors.

    - **Packaged app development**. Unlike other programming languages, `Java` programs
    can be written in such a way that the entire program can be packaged up, put on
    a disk, and then deployed. This significantly reduces the time required for deployment
    and production.

    - **Compiler as code**. `Java` programs are compiled to machine code (usually
    some variant of an instruction set architecture), which is then executed by the
    computer. This avoids the need for code rewriting in a run-time environment.


    When using `Java`, some of the advantages can only be implemented with the use
    of a `JVM`. The good thing is that with the `JVM`, the performance of the applications
    can be increased.


    ## What are the drawbacks of the Java language?


    There are many drawbacks to using `Java`. One of the drawbacks is that a lot of
    developers find it a complex language. Another drawback is that it is more memory-constrained
    than other programming languages.


    This means that even if the app is using less memory, there may be a performance
    hit. More significantly, if the app takes a long time to load or freeze, it will
    affect the user experience.


    An application that is not constantly moving or changing will get a better user
    experience. A good example of an application that uses `Java` is `Yahoo! Finance`.


    If you are a business or can prove that you are a business, you can use an alternative
    programming language, such as `PHP`.


    ## Which programming languages can be used in the Oracle Digital Cloud Office?


    Now that we know what the Oracle Digital Cloud Office is all about, you should
    also be aware of the different programming languages that can be used. Below are
    the languages that can be used in the Oracle Digital Cloud Office.


    - `Apache Flex` is an Oracle software library, which is designed to help mobile
    developers create desktop and mobile applications that combine the best features
    of `HTML5` with components of the `Java` programming language.

    - `OpenJDK` is a `Java` implementation based on the standard `Java` Virtual Machine
    (`JVM`).

    - `PHP` is a general-purpose programming language designed for software development.
    `PHP` has replaced the older languages `Java`, `.NET`, and `C++`.

    - `Clojure` is a Lisp-like, functional programming language that allows developers
    to construct data structures that are as flexible as an imperative language and
    are expressive enough to express all sorts of algorithms.

    - `Fortran` is a general-purpose computer programming language. It’s a descendant
    of `BASIC` that first appeared in 1958.

    - `Erlang` is a general-purpose, multilingual programming language that is developed
    from the `ALGOL` compiler which was developed at the `Université de Liège` in
    1968.

    - `Tcl` is a concise shell scripting language.

    - `Apache Storm` is an open-source distributed-processing framework that includes
    a distributed event-driven architecture. It works across a cluster of commodity
    servers.

    - `Apache Drill` is an open-source distributed processing framework. It allows
    developers to deploy microservice-based distributed applications.

    - `Swing` is a collection of `Java` coding standards, conventions, and practices.
    It provides a framework to define and deploy systems with separation between business
    logic and presentation.


    ## How to install Java on the Oracle Digital Cloud Office?


    The last thing we need to discuss is how to install `Java` on the Oracle Digital
    Cloud Office.


    The easiest way to install `Java` is to use the `Oracle Java SE Platform Enterprise
    Edition (Java SE)`. It is the same code that is included with the `Oracle Database`,
    `Oracle WebLogic Server` and the `Oracle Community Technology Preview (CTP)` releases.


    If you are using the `Oracle Community Technology Preview`, you will need to use
    an older release of `Java`. If you are using the `Oracle Community Technology
    Preview`4 or later, you will need the `Oracle Java SE Platform Enterprise Edition
    (Java SE)`.


    This is a slightly more cumbersome installation process because it is not supported
    by Oracle. To install `Oracle Java SE` you need to download it from the Oracle
    website and then click on the `Install` button. Once `Oracle Java SE` is installed,
    your site is ready to run.


    ## Wrapping it up

