- fmt: '

    Most developers that we talk to fall into the “too easy” camp, where a handful
    of tooling “just works” without any configuration (or at least, much less than
    is necessary). Some developers fall into the “not easy” camp, where they must
    configure things to be useful (e.g., printing, querying, and many other things).
    And some fall into the “not useful” camp, where the tooling is not used at all
    because the task is not well suited to any of the available tooling.


    ## Does the tooling work well?


    The following problem statement will be used to assess tooling effectiveness:


    “The purpose of the standard `JVM` is to allow us to run our Java code in a single-threaded,
    low-latency manner. Therefore, in general, we will want the `JVM` to operate in
    a single-threaded, low-latency manner. However, we have some projects which are
    probably better suited to multithreaded, high-latency operations, such as web
    applications that download images from the web. These projects would benefit from
    the use of threads, and the `JVM` will likely want to give us the ability to run
    them in a multi-threaded, high-latency manner.”


    Of course, there are many sub-parts to the statement above, each with a different
    level of abstraction. In general, I tend to start with low-level abstractions
    and then work my way up, taking into account the concerns of real developers as
    I go. In other words, this is a very rough approximation of what real developers
    think and not a hard set of requirements.


    ## Does the tool provide the necessary configuration?


    For a tool to be useful, it must provide enough configuration to be used. This
    is the one that probably seems to trip up most developers, as there are many ways
    to configure the tooling.


    One way is by making assumptions about how a developer uses the tool (e.g., “all
    developers are the same, so let’s configure the tool to run in the same way across
    all developers”). That is, if your goal is to provide a “configurability map”
    for your tool, you’re probably going to fail.


    Another approach is to take the typical way that developers use the tool (e.g.,
    userland, configuration via the command line, etc.), and then work backward to
    design a tool that can function the way users are using the tool today. That is,
    make sure that the tool runs on the `JVM`, and not on some other processor (which
    is not the case with Java Web Start).


    This leads to another concept that I call “pattern matching”, as it involves matching
    the project/app to a specific configuration (which could be a particular `JDK`
    version or even a particular `JVM` configuration). This can be done using proxy
    config files that correspond to the project or application, and that is parsed
    to determine which configuration file(s) are appropriate. (This post gives a good
    introduction to pattern matching.)


    Another approach is to ensure that the tool includes a configuration file for
    each supported configuration. This is, however, a somewhat tedious approach, and
    is only practical for many smaller projects that have only a single configuration.
    There are also several concerns about mixing the configuration files: what happens
    if you need to switch between the same `JDK` version, but you have two different
    configurations? The configuration files are also different, so you can’t reuse
    configuration files between projects.


    So, the question is: how do you provide a configuration in the right format for
    a given configuration?


    ## Is the configuration properly organized?


    Sometimes, you have to focus on the details. You need a file where you can store
    the configuration, and you need to make sure that the file contains the proper
    options. At the same time, you want the configuration to be easy to read.


    ## Is the configuration customizable?


    Of course, if the configuration is not easily modified, the tooling is of limited
    use. What about the configuration? Do you want it to be editable? (You can’t do
    that for Java Web Start.)


    Finally, the configuration is a little different with Web Start. In a similar
    vein to the level of abstraction, there are many ways to configure the tool to
    work on the `JVM`. Web Start, however, provides some flexibility on how that configuration
    is created: there is a native configuration parser that it supports, and can modify
    the program to work on different `JVMs` (e.g., among the `JVMs` that Oracle supports).


    As such, Web Start offers developers much greater flexibility in how the configuration
    is created.


    ## The Future


    There are many ways to define the configuration schema for a tool. Some take a
    “configuration map” approach, whereas others use configuration file patterns.
    One thing is for certain, though: any tool that provides the ability to create
    a configuration in the tooling will need to provide the proper format for a particular
    configuration, and the proper format varies based on the tools and configurations.
    (I have not investigated how to provide config support for just the one tool that
    allows you to create a single configuration, but it is certainly possible.)


    As part of the ongoing development of PostgreSQL Console, we’ve created a prototype
    solution that provides support for configuration files for `PostgreSQL`, `JRockit`,
    and `Percona XtraDB`. (We’re calling it the Percona XtraDB Console.)


    Rather than having to develop a similar solution for PostgreSQL Console, for our
    next major release, we’ll focus on extending the capability for user-written types
    to be used with the existing provider.


    The first suggestion was to add the type parameter to the `pathname` attribute
    of the client created by the configuration. This type name would then have to
    be prefixed by the type name of the schema file so that if you wanted to create
    a new type that had a configuration that was different from that in the type,
    you would need to specify the file that contained the configuration type.


    This, however, would require developers to be even more explicit about the types
    they wanted to use: they would need to specify a value for the configuration type,
    and they would need to use an explicit type name.


    Another option is to extend the `System.IO.Configuration` interface (which was
    designed for .NET 4.6.) This interface provides a means to create new types, as
    long as they conform to the `System.IO.Configuration.Types` interface (since `System.IO.Configuration.Types`
    is not part of the `System.IO. Type System`, it would need to be built-in). As
    such, we could provide a module in the API that would accept a `TypeBuilder`,
    which provides a declaration language for creating new types. The type builder
    would then return a `TypeBuilderValue` type, which is a simple wrapper for a type
    that could be used to access its configuration property.


    A future goal is to add the configuration type to the `Provider‘s` namespace so
    that it becomes something that could be built into the tooling.


    Another option is to try a similar solution for config files, that would allow
    developers to create a file in the tool’s “config” directory, and import it into
    the tool using a single line, rather than requiring multiple lines as the existing
    configuration.


    As such, we are investigating the possibility of providing something like the
    following:


    ```

    # create a new type in files "settings" . {"ConfigFileType" . {"configFilePath"
    }

    # import this type in the type builder defined in the tooling object provider
    "TypeBuilder" . new "ConfigFileType" . configFilePath {"configFileType" . {"configFilePath"
    }

    ```


    But, as I mentioned at the outset, this raises a concern about what to name these
    different types. This idea is consistent with the idea of providing a common set
    of classes for types that come in the tooling so that it can offer the ability
    to create different kinds of types that adhere to the same API. For example, there
    could be one class that conforms to the `Base` class, one that conforms to the
    `ConfigAttribute` class, one that conforms to the `ConfigAttributeConstraint`
    class, etc.

