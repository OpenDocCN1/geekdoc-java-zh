- fmt: '

    Some of the Java language features are used by other languages. This is a natural
    outcome of having an evolution-friendly language (as opposed to a reactive language).
    Many Java language features are useful, but not widely used, because of the different
    capabilities of the Java virtual machine. Also, some Java language features are
    useful but not widely used, because the developer community has not done a good
    job promoting or sharing them with other developers.


    Additionally, I don''t think most Java developers are exposed to additional capabilities
    offered by the `JVM`. Many other developer features have a significant impact
    on the efficiency of the `JVM`. The most important example is dynamic code generation.
    These techniques have a significant impact on the performance of the `JVM`. However,
    because most developers don''t use dynamic code generation, they are not exposed
    to its benefits.


    Programmers interested in learning more about the capabilities of the `JVM`, and
    how to implement them, can check out the excellent documentation for the `Oracle
    JDK`, such as `JVM internals`, `JVM tips`, and so on. This documentation has sections
    that explain how to implement various capabilities of the `JVM`, such as compile-time
    metaprogramming and dynamic code generation. However, many of these capabilities
    are difficult to understand.


    So, I proposed six reasons why `java.util.concurrent.Flow` is not a good way to
    use for error-handling in an application. In the next article, I will discuss
    why it is a bad way to use for error-handling. This article describes how a thread
    synchronized access to an object. The next article discusses why, in my opinion,
    using a thread to synchronize access to an object should be discouraged. Finally,
    I will explain why I consider synchronization primitives as a programming technique
    to be deprecated.


    # Conclusion


    Java’s worldwide standard availability and free community involvement are by far
    the biggest advantages for any developer coming to Java. An implementation that
    supports it is not an excuse to ignore Java’s strengths. The biggest benefit for
    Java is its testing tools because they work on virtually all programming languages
    and also offer integration with IDEs.


    Some of the language level issues in Java:


    * `jdbc adapter` is not implemented (there are way too many exceptions to be documented
    here)

    * `Classloader` is extremely complex (but the good thing is that you don’t need
    to fix it from scratch)

    * `Naming issues`

    * `Interfaces` as abstract classes


    Java’s syntax allows developers to improve the readability and reduce readability
    issues. It doesn’t mean that other languages couldn’t do it, but that’s not a
    general rule.


    `JVM` has a complex `GC`. But it’s very consistent and knows how to behave.


    Java developers can build massively scalable, low latency systems.


    There are a lot of tools in the Java world to improve debugging and analysis.
    Some important ones are:


    * `JUnit`

    * `JDebugger`

    * `JUnit profiles`


    ## Why has Java been around so long?


    It took Java years to build up as a viable language. There is a significant barrier
    to entry for people coming from other languages because of the huge complexity
    of the language and the compiler. Java didn’t become popular until Borland built
    the `Apache JVM` which had the guts to take all the best parts of the `C/C++`
    compiler and compile them to the `JVM`.


    `JVM` has been around for 10 years. That’s a long time, in this short time, there’s
    a lot of innovation in the field. Especially in the `Java 8` version, there was
    so much innovation.


    We (Apple) care about Java and spend a lot of time working on it. That’s the right
    way to be doing it. That’s what other companies should do. If Java was a new technology,
    then they would make the best of it, but that’s not the case. It’s an old technology,
    and people need to understand that we’re not going to drop dead because you started
    using Java.


    ## How can someone easily switch from Java to other languages?


    Different languages solve different problems. Java solved the problem of running
    a computer, programming a computer, for a programmer, and sometime in the future,
    an industrialist. If you can solve a problem, that’s a high bar, and if someone
    can solve it, then why not give it to them?


    A lot of users who become developers can’t solve the problems of systems programming
    or system programming. That’s where dynamic languages like `Clojure` and `F#`
    step in. Even languages like `Rust` and `Go` can step in. It’s easy to switch
    from one language to another language that solves a particular problem.


    I don’t see any language that can be used to write a large, complex, data-driven
    system. Because there are just too many things happening. If you ask a Java developer
    “what’s the difference between Java, `C++`, and `.Net`?”


    Most people say Java is a bad language, but the other thing they say is that it’s
    powerful.


    ## What do you think are the most important things to learn when coming from another
    language to Java?


    First, it’s about the mindset. You have to understand that writing programs in
    Java is really easy. You don’t need to worry about memory management, how do I
    know I’m not going to do something stupid with this thing and it could cause a
    memory leak. You have a bunch of arguments, and you just say “this is the way
    to do it.” That’s how Java has the power to do what it can do.


    But it’s not just about Java, it’s about your mindset, and how you approach problems.
    It’s not enough to know how to write Java code. You have to understand how to
    do the hard parts of it. For example, why don’t I care about cache safety? If
    I have ten objects on a table, how do I want to handle that? It could be that
    I don’t care about memory leaks.


    You can create Java-like `VB`, but that’s not the right way to do it. When you
    go back to `C#`, `C++`, or `Visual Basic`, you can see that lot of these people
    spent 10 years learning how to do it. When they were first starting they probably
    had some experiences with other languages, they just didn’t realize it. I’ve spent
    about 25 years and I spent that time learning. Some people spend 1, 3 years learning,
    some people spend 5 years, and some people spend a long time. I would say you
    have to have some experience to know how to do this. Then you can go out and learn
    how to do this stuff. I’m sure some people have spent 20 years before they understand
    it.


    Most people are surprised that my question about the difference between object-oriented
    languages and functional languages came up. People didn’t understand it because
    they didn''t know how to program. It’s just a language for telling people how
    to program, how to describe the problem. If you look at some functional programming
    languages like `Scala` or `Clojure`, you’ll see it looks more like mathematics.
    There are functions, functions that have more than one parameter, pure functions,
    lazy functions, functions that have a return value and you don’t see them a lot.
    But they’re easy to implement, they’re easy to implement in functional languages.


    Some people like `Scala` are used to having imperative languages, where you have
    to iterate over arrays, and update methods, update state. Functional languages
    are a little bit more functional. They don’t have that as much, but they have
    that kind of thinking in there, and it makes it easier. But you still have to
    have good programming skills.


    Some people think that the other way is bad because they don’t have to think about
    memory. One person I interviewed said, “people who use object-oriented languages
    think they have to worry about memory,” but they don’t, it’s almost an illusion.

