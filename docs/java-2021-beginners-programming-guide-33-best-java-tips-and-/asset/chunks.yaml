  trans: "\nOracle 现在正通过其 Oracle Digital Cloud Office 为 Java 用户提供一站式解决方案。这是一个完全可定制的\
    \ Java 环境，包含了开发工具、开发环境以及构建、测试和部署 Java 软件应用程序所需的所有工具。\n\n这是一个完整的软件包，你可以在任何计算机上使用它，无论是\
    \ Mac、PC 还是 Linux 计算机。\n\n使用 Oracle Digital Cloud Office 的优势之一是免费的。Oracle 并不试图出售任何软件。它是完全免费的。唯一的成本是下载和安装\
    \ Oracle Digital Cloud Office 的时间。\n\n使用 Oracle Digital Cloud Office 的另一个优势是非常易用。它运行非常快。Oracle\
    \ Digital Cloud Office 允许你专注于开发过程。\n\n如果你使用 Oracle Digital Cloud Office 进行 Java\
    \ 开发，你可以放心，你将拥有开发软件所需的最可用工具。\n\n# 第 1 章 Java 语言具有哪些特性？\n\nJava 语言支持静态类型、现代编程风格（例如，非递归风格）以及算法，包括各种针对计算优化的算法，如数组计算、字符串处理、位操作、排序、链接、反向工程、二进制代码操作、布尔逻辑、遗传编程和图算法等。\n\
    \n## Java 语言设计是否存在缺陷？\n\n对于一种成熟的编程语言来说，发生编程错误的可能性很低。然而，如果设计上无法高效地修复，即使是成熟的编程语言也可能受到编程错误的影响。\n\
    \n## J2EE 应用服务器设计是否存在设计缺陷？\n\n**与其他应用服务器不兼容**：J2EE 应用服务器规范没有显式支持不同 J2EE 应用服务器之间的互操作性。\n\
    \n**对需求的更改**：需求的更改不是通过规范进行的，而且目前还不清楚更改将是什么。未来的规范版本可能需要此类更改。\n\n## Java 语言规范 (JLS)\
    \ 指定的版本是最终版本吗，还是会以某种方式进行修订？\n\nJava 语言规范指定的版本是纯粹的规范，尚未指定任何最终版本。例如，在网上无法找到任何定义哪个版本的\
    \ Java 语言是最新版本的文章。如果 JLS 发生某种变化，可能会影响 Java 语言规范的最新版本。\n\n## 我应该使用 J2EE 应用服务器规范来编写\
    \ J2EE 应用程序吗？\n\nJava 语言规范并没有要求为 J2EE 应用程序使用应用服务器规范。可以存在不使用规范或与规范配合的 J2EE 实现，但它们的构建方式与当前最常见的实现不同。\n\
    \n## 如何使用 J2EE 服务器？\n\nJ2EE 提供了一种抽象，为程序客户端提供了一个接口。程序客户端可以使用该接口与服务器通信，并在服务器上执行操作。\n\
    \n## J2EE 客户端知道如何创建一个与服务器通信的程序？\n\n它可以通过其定义的接口创建一个与服务器通信的程序。与服务器通信的程序可以使用服务器支持的任何类型，使用该类型的客户端可以将该程序视为服务器。它还可以使用该程序的任何行为，无论该行为是由程序本身提供的还是由其他客户端方法提供的。J2EE\
    \ 客户端不需要创建自己的 J2EE 服务器；如果现有服务器支持客户端接口，它可以使用任何现有的服务器。\n\n与应用服务器通信的程序使用 `Session`\
    \ 协议来实现此。客户端定义了一个指向服务器的接口。然后，它可以使用接口中的任何方法或不同的类来与服务器通信。\n\n客户端还需要一种从服务器接收消息的方法。消息类型使用客户端类的\
    \ `read` 方法创建。只要该类型与类兼容，它就可以从服务器接收任何类型的消息。特别是，它可以同时接收基于方法的消息和基于消息的消息。\n\n客户端也可以向服务器发送消息，但它必须使用客户端类的\
    \ `write` 方法来写入消息，并且在发送自己的消息之前必须等待消息发送完毕。通过这种方式，客户端可以以类似于客户端程序与人类程序（如网络浏览器）通信的方式发送消息。\n\
    \n## J2EE 规范定义了哪些 J2EE 特性和标准 J2EE 服务器？\n\nJ2EE 定义了几种标准方法，每个方法都在各自的规范中描述。提供的 J2EE\
    \ 特性列表说明了 J2EE 标准如何定义这些特性。\n\n另一个 J2EE 特性是可以可以在定义定义实现的情况下调用方法并定义处理器。然后，为实现接口的客户端提供这些方法中每个方法的默认实现。\n\
    \n符合标准 J2EE 服务器的 Java 类在类定义中添加以下代码：\n\n```java\npublic final class JavaServer\
    \ implements Service {\n    public void write(Session session, ReadableReusableData<String>\
    \ data) {\n        WriteableReusableData<String> data = data;\n        return\
    \ true;\n    }\n    public void read(Session session, String s) {\n        String\
    \ data = s;\n        return true;\n    }\n}\n```\n\n## JavaServer 接口是如何工作的？\n\n\
    `JavaServer` 接口指定了服务器支持的方法。\n\n`write` 方法由客户端调用，它为客户端向服务器发送数据提供了一种方法。如果服务器有响应，则返回\
    \ true，否则返回 false。`read` 方法在客户端向服务器发送数据时由服务器调用。它返回数据的实际值，无论数据是否正确。\n\n`JavaServer`\
    \ 实现是 `JavaServerBase` 类的子类。特别是，它添加了 `java.lang` 包中的方法以及服务器实现。该实现还为 `read` 方法定义了默认实现，以便没有实现接口的客户端仍然访问\
    \ `read` 方法的默认实现。\n\n`JavaServer` 类还定义了几个工厂方法，允许客户端在没有实现接口时设置一个备备用的 `JavaServer`\
    \ 实例。标准 J2EE 实现支持以下内容：\n\n- `java.util.Scanner` 用于读取单条消息。\n- `java.io.InputStreamReader`\
    \ 用于读取消息数据。\n- `java.io.OutputStreamWriter` 用于写入消息数据。\n- `java.io.OutputStream`\
    \ 用于写入二进制消息。\n- J2EE 尚未集成到 Java EE 6。\n\n## Java EE 6 可以使用 J2EE 吗？\n\n不可以。J2EE\
    \ 不是 Java EE 6 的官方部分。虽然 J2EE 可能存在于 JRE 中，但 Oracle 提供的实现与 Java EE 6 不兼容。Java EE\
    \ 6 在定义 `JavaServer` 接口的同时，还定义了其他与 J2EE 不兼容的接口。\n\n## Java EE 6 可以使用 J2EE 库吗？\n\
    \n不可以。J2EE 不是 Java EE 6 的官方部分。虽然 J2EE 可能存在于 JRE 中，但 Oracle 提供的实现与 Java EE 6 不兼容。Java\
    \ EE 6 在定义 `JavaServer` 接口的同时，还定义了其他与 J2EE 不兼容的接口。\n\n## JavaServer 实现接口在 Java\
    \ EE 6 中的行为与 Java EE 5 有何不同？\n\n"
- fmt: 'No. The `JavaServer` interface in Java EE 6 has the same functionality as
    it had in Java EE 5. It does not affect the semantics of the interface, so it
    is still possible to access the methods from Java EE 5 and Java EE 6.


    ### Does Java EE 6 specify the way that J2EE code is compiled and run?


    No. The `JavaServer` implementation interface in Java EE 6 does not affect the
    compilation or execution behavior of the J2EE code.


    ### Is it possible to deploy Java EE 6 applications in J2EE-based configuration?


    Yes. The `JavaServer` and `JavaServerBase` implementations have two entirely different
    definitions. The `JavaServer` interface does not affect the behavior of the `JavaServer`
    implementation. However, the `JavaServer` implementation is also able to run and
    configure other server implementations.


    These other server implementations can be found in the `java.net` namespace. They
    are included in the `JavaServer` implementation namespace because they are implemented
    in Java.


    In addition, the current version of J2EE (`J2EE 1.5`) is a separate implementation
    of the `JavaServer` interface. It does not conflict with Java EE 6 at all. As
    of J2EE 1.5, the `J2EE 1.5` implementation defines the `JavaServer` interface
    differently. It defines the `java.net.Server` interface. It defines this interface
    to allow independent development of J2EE implementations and to allow for different
    implementations of the `JavaServer` interface to be deployed in the same environment.


    Java EE 6 offers a means to configure J2EE servers for use in Java EE 6 applications.
    This feature is called "runtime component configuration".


    In J2EE 1.5, the `JavaServer` implementer, as defined in Java EE 5, does not have
    any effect on the `JavaServer` implementation-defined in Java EE 6.


    Therefore, the `JavaServer` implementation-defined in Java EE 6 does not have
    to be the same as the `J2EE 1.5` implementation.


    In J2EE 1.5, the `JavaServer` interface is a `JavaInterfaces` interface. This
    interface was not present in Java EE 5. In Java EE 6, this interface is now a
    `JavaServer` implementation interface. As a consequence, it is possible to configure
    `JavaServer` implementations for deployment with Java EE 6.


    When implementing the `JavaServer` implementation, one could choose to use a separate
    implementation of the `JavaServer` interface, such as a `JavaServer` implementation
    of the `java.net` namespace, rather than defining the `java.net` namespace interface.
    However, the `JavaServer` implementation interface does not include a namespace
    property. If a container creates a new `JavaServer` implementation implementation,
    it does not have to be the same as the existing `JavaServer` implementation.


    As an example, suppose that a container creates a container named `jcloud-1`.


    After this container has been created, a `java.net` namespace container named
    `jcloud-1` can be added to a different `java.net` namespace. Then, the container
    `jcloud-1` can create a `JavaServer` implementation with the name `java.net.Server`
    on a different namespace, using a different `java.net` namespace interface.


    If this was the only implementation in the `JavaServer` implementation, this would
    have the the only `java.net` namespace that would be configured for use with the
    container `jcloud-1`. However, if this is the only implementation in the `JavaServer`
    implementation, one does not have to explicitly create an additional `jcloud-1`
    in the `java.net` namespace. `JavaServer` implementations in the `java.net` namespace
    can already be created, but one has to explicitly do this, instead of simply adding
    a `java.net` namespace. If this is the only implementation of the `JavaServer`
    interface, then it would be possible to create a `jcloud-1` in the `java.net`
    namespace and call an `addJcloud` function on the `jcloud-1` object, thereby creating
    a `JavaServer` implementation `jcloud-1` in the `java.net` namespace. This would
    be possible for all the containers in the `java.net` namespace. However, this
    is only possible for the container `jcloud-1`. This feature is called "runtime
    component configuration".


