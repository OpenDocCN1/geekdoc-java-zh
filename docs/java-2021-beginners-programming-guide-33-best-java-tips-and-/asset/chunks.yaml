    当然，我们不能将此主意用于 `System.IO.Type System` 的 `TypeBuilder` 接口。因此，我们面临选择：要么扩展 `System.IO.Type
    System` 类（类似于从 `Connection` 变为 `ConnectionBuilder` 时的扩展方式）以支持更多类型，或者我们可以添加一种特定的设计，要求开发者显式指定他们正在使用的类型种类。


    ## 结构改进


    讨论过程中出现的另一个大话题是对 `TypeBuilder` 接口进行结构性更改的能力。目前，这些更改仅支持 `WFT` 和 `TypeProvider`
    接口，但我们希望将此支持扩展到许多其他类型，例如 `WCF-type providers`。


    现在，如果用户选择替换内置类型，他们被迫从 `TypeBuilder` 接口中删除它。要使用未在接口上定义的类型，他们需要提供额外的构造函数参数。


    当你与 `WCF` 提供程序工作时，这是一个很好的功能，但当你有一个在工具中已经存在的类型时，情况就会变得复杂。例如，我们可能有一个名为 `CustomType`
    的类型，它在 `TypeBuilder` 接口中实现，但该类型已经在 `WCF` 提供程序中定义。这可以被视为一个独立的“类型”并应该被这样对待。如果用户更改了
    `TypeBuilder` 接口，他们需要修改正在使用的类型，因为他们的构造函数参数将变得不同。


    那么，针对这个问题可能的解决方案有哪些？其中一个想法是更改 `TypeBuilder` 接口，不再为当前接口上不存在的类型提供构造函数，而是为涉及的类型提供一个构造函数，其方法签名允许不同的类型。


    另一个想法是实现该类型的构造函数，使其为它可以被用的所有接口提供构造函数，然后用户就能执行正确的操作。


