    # Java 开发者应该关注手机端的 Java 吗？


    ## 什么是 Java 语言？


    Java 是一种高级、编译型、过程化的语言，通常用作 Java 虚拟机 (`JVM`) 的底层引擎，并作为 Java 标准库的基础。


    Java 是几种可以编译为机器码并运行的编程语言之一，它可以运行在 IBM 主机、英特尔 x86 处理器以及许多其他架构上。


    由于 Java 是一种脚本语言，它被认为是一门动态编程语言，这意味着很容易自动化执行包含许多步骤的任务，且很少或没有样板代码。


    Java 运行在许多不同的平台上：它运行在 Unix、Linux 和 macOS 操作系统上；运行在 Microsoft Windows 上；它是 Android
    的首选语言。你还可以在服务器、容器化环境以及嵌入式系统（如树莓派）上运行 Java。


    Java 是一种以开发者为中心的编程语言，这意味着它是为那些希望为从命令行到网络浏览器的各种系统编写代码的程序员而设计的。它也是一种对扩展和自定义非常友好的语言。


    传统上，Java 被认为是一门“服务端”语言，这意味着它非常适合编写服务器应用程序。但随着时间的推移，它创建桌面应用程序的潜力不断增长。这部分归功于其 Cordova
    软件开发包，它允许 Java 代码作为移动应用程序的基础。


