    `Classpath Component Registry` 的根是应用程序包，它指定了特定顶层目录下的所有组件注册表。`Classpath Component
    Registry` 的根在组件注册表中包含一个 `config.properties` 文件，该文件定义了它的 `config.xml` 文件和文件夹布局。


    尽管这似乎是一个巨大的退步，但服务管理器、IPC 模块或带有服务管理器、IPC 模块或组件层的层也可以作为 `Classpath Component Registry`
    添加。


    ## 数据库组件注册表 (Database Component Registry)


    `Database Component Registry` 被 `JDBC` 驱动使用。要将数据库驱动程序注册为服务管理器，你需要一个仓库来为驱动程序识别服务。`JDBC`
    驱动并不使用注册表作为驱动程序的依赖注册表，但该注册表被 `IOLib` API 用于驱动程序。`SQL JDBC` 也是如此。


    ## 消息组件注册表 (Message Component Registry)


    `Message Component Registry` 被 `Hibernate Message Service` 使用。作为一个示例，输入注解定义了 `Hibernate
    Query` 的值，触发了 `Hibernate Entry`。以下演示了一个基础的消息组件注册表。


    ## Java 开发有哪些特性？


    它包含了 `JCP` 标准的 `JSR 336` 安全增强。它还包含其他更改和增强。


    它具有一个安全的服务器模型 `JAX-RS`。它旨在为 HTTP 调用提供更好的安全性和隐私保护，特别是对于 `SSL` 连接。


    JDK 9 还启用了用于即将推出的 `HTTP/2`、`HTTP Basic Authentication` 以及作为 `HTTP header` 的组件。这些组件已经在某些环境中实现，但它们还没有一个可以直接进行
    HTTP 用的 `API`。


    `DAL`（数据访问层）是一个轻量级 API，用于从一个或多个 `Java Persistence Units`（`JPA`、`Hibernate` 等）检索数据。


    从 JDK 9 开始，有一个新的 `Native Call API` 可以访问 `FFI`。它有助于避免 `JNI` 以及其他 `JNI` 问题。


    此外，还有一个会话代理和 `JMX`（Java 监控与事件）`API`。


    ## JDK 9 的变化


    JDK 9 为垃圾收集添加了新的直接优化流水线。该流水线基于新的聚合收集器设计。


    Java SE 9 SP1 Update 9 或“常规” SP1 预计将于 2015 年 3 月发布。如果 SP1 提前发布，JDK 9 也可能随 SP1
    一起发布。


    ## ProdJ99077 JDK 9 的新特性


    JDK 9 中有许多显著的变化。我们在这里总结了这些重大变化。


    - 内存减少和性能提升。

    - `Java™ Virtual Machine`

    - 新编译器：针对智能编译器和代理编译器的细微改进。


    JDK 9 编译器对“智能编译器”进行了一些优化。这些包括对数组越界访问、内存溢出和堆栈扫描的改进。它们还包含了更多、更快的运算符重载。编译器现在还会为编译器优化子表达式消除、类型推断和编译时并行处理，特别是在迁移到大型编译器和静态分析工具时。


    ## 改进的异常处理 (Exception Handling)


    该特性包含了我们未来将拥有的异常处理类型。它包括“类和引用异常处理”。当抛出异常时，编译器现在将为 `JavaBean` 类和字段使用派生类型，无论它们是否为默认值。


    它还包括对返回值的正确处理，包括返回值到类型以及返回值到任何默认值的自动转换。`Type` 系统已显著改进，例如在 `JVM` 算术计算中。


    - 性能改进

    - 开销提示 (Overhead Hinting)


    该特性允许对特定异常类的代码进行性能分析。编译器将为不同 `JavaException` 类的各种重载注入提示，这些提示会在分析代码分析时进行评估。该特性在性能方面是最高效的。


    ## 独立生成的类型提示 (Separately Generated Type Hints)


    它实现了“独立生成的类型提示”。这是一个实验性特性，尽管出现了很多 Bug 和问题，但它的性能已经有了很大提高。随着我们获得更多编译器反馈以及使用它的应用程序反馈，它将会改进。


    此外，终结顺序会被检查并替换，这改进了 `jOOQ` 数据库。


    ## 空指针异常 (Null Pointer Exceptions)


    通过此特性，如果静态类（如 `String`）的值具有空指针，那么静态类指针值将为空。在这种情况下，正确处理空指针至关重要，因为这可能导致 `NullPointerExceptions`，而这种异常的开销很大。


    此外，此特性允许在终结器上使用 `if-else` 子句（可能包含 `else` 块）作为关键字，以避免调用期间对任何类型进行无谓转换，如此处所示。


    ## 优化 (Optimizations)


    针对泛型文件级处理的高并行链接


    JDK 9 的实现对所有类型的泛型文件级处理实现了高度的并行化。


    然而，当所有程序都以相同的 `MIME` 编码前缀运行时，情况会变得相当复杂。这要求应用程序使用（原生的）JDK 的 `GzipPlugin` 向 JDK
    传递特殊的配置文件。


    该问题的解决办法是通过 `TCP/UDP` 库通过 `HTTP` 发送配置文件。这允许应用程序在需要时设置默认的 `MIME` 编码和加密设置。


    ## 新内联函数生成器 (New Inline Function Generator)


    编译器的设计目标是生成尽可能快的代码。这就是为什么像 `LLVM` 这样的优化编译器会在内存中优化代码并执行代码简化。来自 `LLVM` 的新内联函数生成器（以前称为多态内联函数生成器）即使会对小型程序执行此类优化。


    这将有助于提高 `CoffeeScript` 和 `TypeScript` 等原生支持编译为机器码语言的性能。


    对于 Scala 来说，由于 Scala 包含了许多编译为机器码的函数，此功能将使 Scala 利用其在内存中优化并简化代码的速度更快。


    ## 类型推断中的空 (Null in type inference)


    类型推断对于任何类型系统都是至关重要的，因为它可以帮助避免许多常见的错误，例如空引用。例如，类型推断中的空错误简单取决于类型系统如何识别何时需要空值，何时不需要。


    因此，Scala 团队做出了若干设计决策，以使类型推断尽可能准确。


    此类类型永远不会生成空检查（这可以通过在编译任务中手动设置类型来尝试修复）。因此，对于此类类型，如果你不确定值是否为空，则必须传递一个参数，例如空值或数组中另一个元素的引用。


    如果类型不支持可空值，那么即使你向返回值的方法提供字符串值，该值也将为空。


    这意味着，不像 `JavaScript`、`C#` 和 `Java` 等语言需要明确表达“空”的含义，在 Scala 中，你必须以可空类型来思考。当某些这些类型用原始类型表示时，这是一个缺点，但优点是
    Scala 的类型推断非常出色，以至于这类问题非常罕见。


