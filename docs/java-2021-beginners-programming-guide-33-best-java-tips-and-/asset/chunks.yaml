    ●     ParameterizedType<T> myComponent; void doSomethingMethod(InputInputMyComponentInput,
    MyComponent myComponent) { myComponent.value.setValue(1); myComponent.value.setNumber(9);
    }


    ## Do parameterized classes have to be subclassed?


    No. The parameterized classes just use the static methods of the parameterized
    classes.


    ## Can I call the methods of the parameterized classes like this:


    ●     public class ParameterizedType<T> { public T value; public bool equals;
    public T getValue() { return value.getValue(); } public void setValue(T value)
    { this.value = value; } public void setEqual(bool isEqual) { this.noEqual = isEqual;
    } public int getNoEqual() { return noEqual; } public int getNoEqual() { return
    noEqual; } }


    I want to add my own custom parameters to the CustomType class and have them available
    through parameterized methods. For instance, I can put a number and a string as
    parameters and call these parameters by passing a parameter as a tuple:


    ●     public class CustomType<T> implements CustomType<T> { public CustomType(T
    value) { this.value = value; } public CustomType(T value, string name) { this.value
    = value, name; } public CustomType(T value, int number) { this.value = number,
    name; } public CustomType(T value, bool equals) { this.noEqual = equals; } public
    CustomType(T value, int noEqual) { this.noEqual = noEqual; } public T getValue()
    { return value.getValue(); } public CustomType(T value) { this.value = value;
    } public CustomType(T value, int noNumber) { this.noNumber = noNumber; } public
    int getNoNumber() { return noNumber; } public int getNoNumber() { return noNumber;
    } }


