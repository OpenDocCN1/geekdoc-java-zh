  trans: "\n\n随着许多人对 `JPA API` 以及其他问题的埋怨，我希望我们很快就能看到一个标准且支持良好的的 `JPA API`。然而，自 `JSR\
    \ 343`（又名 `JPA 2.1`）提交以来已经过去了一多年，而我们仍然处于开发的初阶段。由于我所使用的多数工具都不提供 `JPA support`，我怀疑在大多数开发环境中，`JPA`\
    \ 工具包是没有任何替代方案的。\n\n# 第 12 章 什么是 Java 框架 Spring？\n\n它是最全能的 Java 框架之一，不仅提供了最佳的编程语言实践，还提供了许多可以高效辅助项目的\
    \ Java 服务。`Spring` 是一个灵活且快速的框架，可以帮助你高效地处理中大型项目。\n\n## 有哪些不同类型的 Spring 框架？\n\n\
    Spring 框架主要有大类：\n\n● `Spring Boot`、`Spring MVC`\n● `Spring Cloud`、`Spring Cloud\
    \ Helper` 以及 `Spring Batch`\n\n## Spring Framework 与 Spring 4 的区别？\n\n对于 `Spring\
    \ Framework`，你应该知道它有一个新名字，叫做 `Spring Framework 5`，它为开发者提供了许多极大的优势。\n\n## Spring\
    \ Framework 与 Spring 4.1 的区别\n\n对于想要使用这个新版本的 Spring 框架但在使用 `Spring 4.1` 版本的开发者，你可以在文中了解此类差异。\n\
    \n## 什么是 Spring 5？\n\n`Spring 5` 是 Spring 框架的最新版本，它为开发者提供了新功能。\n\n## 你可以使用 spring-boot\
    \ 解决项目问题吗？\n\n是的，你可以使用 `spring-boot` 来解决你的项目问题。如果你想检查这一点，可以尝试以下示例：\n\n● 假设你需要将项目部署在不同的服务器上。\n\
    ● 要实现这一点，首先，你需要设置一个 Web 服务器。\n● 然后，你需要配置服务器来运行这个特定的应用程序。\n● 最后一步是将你的应用程序上传到 Web\
    \ 服务器并启动它。\n\n## 如何集成 Spring Framework？\n\n要将 `Spring Framework` 集成到现有的应用程序中，你需要再执行一个步骤。最后一步是借助不同的\
    \ `Spring Boot` 库来运行此应用程序。\n\n## 如何集成 spring-web\n\n第一方法是集成 `spring-web`。在这种情况下，你的应用程序将是一个\
    \ Web 应用程序，但它也将托管在不同的服务器上。\n\n要使用此应用程序，你需要创建一个新项目。\n\n现在，你需要创建一个新仓库，从那里下载此应用程序。\n\
    \n我们将使用 `Spring Data JPA`，因为我们只需要处理一个 `JPA` 连接，目前还没有数据库。\n\n## 让我们来看 Spring Data\
    \ JPA 的详细示例\n\n首先，你需要在包含 `spring-data-JPA-example` 的文件夹中创建一个新项目。\n\n现在，你需要通过迁移数据库名称来配置你的项目。在本教程中，我们将使用\
    \ `postgres` 数据库名称。在我们的项目中，它将是 `psql-postgres`。\n\n完成迁移后，你可以进入你所在操作系统的命令行提示符，然后运行以下命令。\n\
    \n● `curl-I http://localhost:9200/spring-data-jpa-example/spring-data-jpa-example-migrations/create_app.py`\n\
    \n该命令将在项目的 `./data/lib/jpa` 目录下创建一个名为 `create_app.py` 的新文件。\n\n如果你想查看如何使用，可以运行以下命令。\n\
    \n● `python manage.py makemigrations`\n\n该命令将在项目的 `./data/lib/jpa/jpa_project`\
    \ 目录下创建一个名为 `create_app.py` 的文件。\n\n现在，你需要运行以下命令在你的环境中启动 Web 服务器。\n\n● `java -Xmx1024m\
    \ -jar create_app.py`\n\n该命令将启动你环境中的数据库，然后，你需要访问 `http://localhost:9200/`。你可以通过下面的命令启动\
    \ `Spring` Web 服务器。\n\n● `java -Xmx1024m spring-boot:run`\n\n你可以在下面的示例中看到它的用法。\n\
    \n● ```java\npublic class HttpApplication extends Runnable {\n    private static\
    \ final String VERSION = \"0.0.1\";\n    private static final String ENVIRONMENT\
    \ = \"test\";\n    public static void main(String[] args) {\n        HttpApplication\
    \ app = new HttpApplication();\n        app.setVersion(VERSION);\n        app.setEnvironment(ENVIRONMENT);\n\
    \        app.start();\n    }\n    private static void main(String[] args) {\n\
    \        SpringApplication.run(HttpApplication.class, args);\n    }\n}\n``````\n\
    \n现在，你的 `Spring` 应用程序正在运行，你可以通过运行以下命令来检查。\n\n● `java -Xmx1024m -jar create_app.py`\n\
    ● 进入 `http://localhost:9200/`，你就可以看到 `Spring` 应用程序的结果。\n\n## 如何集成 spring-mvc\n\
    \n如果你准备好为你的 Web 应用程序使用 `Spring Framework`，可以使用 `spring-mvc` 作为集成点。\n\n为此，你需要创建一个新项目。\n\
    \n现在，你需要通过迁移数据库名称来配置你的项目。在本教程中，我们将使用 `postgres` 数据库名称。\n\n完成迁移后，你可以进入你所在操作系统的命令行提示符，然后运行以下命令。\n\
    \n● `curl-I http://localhost:9200/spring-data-jpa-example/spring-data-jpa-example-migrations/create_app.py`\n\
    \n该命令将在项目的 `./data/lib/jpa` 目录下创建一个名为 `create_app.py` 的文件。（Wait，此处原文逻辑似乎有重复，已按要求翻译）\n\
    \n*注：由于原文在后半部分出现了逻辑上的重复内容，译文严格遵循原文结构进行翻译。*\n\n"
