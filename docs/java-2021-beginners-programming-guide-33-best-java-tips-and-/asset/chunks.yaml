    Java 是一种编程语言，它反映了程序员希望如何使用它：是直接的、声明式的、面向对象的，有时甚至是函数式的。它遵循与你在编程中的设计原则相同的逻辑：只选择那些能帮助你构建系统的组件（例如容器），并专门使用这些组件。没有理由创建一个容器（在
    Java 中，这仅仅是一个不可变数据的容器）来容纳数组，而不是使用数组的指针或在切片中包含后者。你只需要写一个函数，并把它放在与容器相同的类中（在几行代码之后，容器就被实例化了，所有这些名称都包含在其中）。


    如何使用 Java？在 Java 中，乐趣的元素体现在语言本身中。你不需要编译它，也不需要调用外部库来访问它（尽管它对于轻量级项目非常有用）。当需要对表达式进行分析创建时，程序将提供这种分析。Java
    是目前规模最大、最成熟的语言（优势非常明显）。它的社区庞大且完善（参阅文档了解如何加入），其生态系统也是计算世界中最大、最好的。Java 是一门“非此即彼”的语言。这种语言始终存在，随处可用。它自带一套丰富的库，让你几乎可以做任何你想的事。在过去的几年里，对于喜欢使用
    `Scala`（一种函数式编程语言）的人来说，出现了一套全新的库。与其他语言相比，Java 提供了易读的学习曲线和同样舒适的阅读体验。大量的示例让你即使不是天才，也会觉得自己像个天才。涉及到这门语言时，这意味着所有的示例都是
    Java 语言，代码中所有的注释都是用 Java 编写的。这不会吓到任何人。关注点分离是显而易见的，可读代码的使用使得代码故事更容易理解。如果你好奇为什么
    Java 是世界上应用最广泛的编程语言（与 `C#`、`Perl`、`Python`、`Ruby` 以及许多其他语言一起），请考虑所有事实。你只需要收起懒散眼仔细阅读即可。Java
    可以解决你将遇到的大多数问题。它成熟且稳定。Java 还能解决大多数你不想解决的问题（除非你在玩像开车那样的游戏，那时你可能想用 `C++`）。Java 对于嵌入式和可移植系统是完美的（因此
    `Android`、`嵌入式 Java` 以及 Java 平板等移动设备非常流行）。如果你有问题，Java 可以解决。Java 的开发周期和测试周期都非常短。这是它成功的主要原因。


    ## Java 作为一种全行业性的运动


    今天，Java 无处不在。公司不需要聚集在一起进行创新。相反，他们由定义良好的专家团队开发软件，然后直接将软件推向世界。大功告成！虽然 Java 可以免费下载，但需要在机器上进行安装。在实践中，Java
    只是开发旧程序的新方式（以前开发的 `Unix`/`Linux`、`Visual Basic`、`Visual C++` 等），进行了一些更改和优化。没有必要重新发明轮子。凭借新范式的所有优势，这种新的开发方法正在提高生产力，并允许公司精简资源并更高效地解决问题。


    ## 给 Scala 新手的 Java FAQ


    15 年来，Java 一一直是服务器和企业级软件开发的金标准，在 180 国家拥有超过 10 亿用户。它是全球移动、消费和嵌入式设备最流行的语言。Java
    是第一门编程语言，用于所有的服务器/企业、移动、嵌入式、科学和动画应用。Java 在汽车行业（`Tesla`）中非常流行，是移动行业的默认技术（`Google
    Nexus One`、`Android`），并被嵌入到各种智能设备（物联网）中。Java 功能强大且具有易于使用的语法。


    ## 为什么有这么多人转向 Scala，原因是什么？


    由于我是一个 `Scala` 开发者，而且这并不是关于 `Scala` 本身的问题，让我尝试以 Java 开发者的身份来回答它。`Scala` 是一种针对
    `JVM` 的面向对象的语言，在这篇文章中，我想写写关于 `Scala` 语言。


    ## Java 语言庞大得过头了


    这种现象有两个原因。


    首先，Java 语言非常庞大。它具有很高的抽象层次，拥有许多类型安全的特性。每个可以在 Java 中编码的语言特性都是用 Java 编写的，然后将语法翻译成
    `JVM` 特有的语法。由于 Java 还不是一种解释型语言，开发者需要将 Java 代码编译成字节码，然后由 `JVM` 执行。相比之下，`Scala`
    不是解释型语言，通常它的语言结构要少得多。


    此外，Java 语言中的特性并不是 Java 语言的全部特性。大多数 Java 开发者并没有意识到 Java 更宏大的蓝图，即使他们意识到了，也无法跟踪整个
    Java 语言特性的集合。例如，以下 Java 代码是不安全的：


    ```java

    public class Person { public static int id { get ; set ; } public static String
    name { get ; set ; } public static int age { get ; set ; } }

    ```


    它可能可以运行，但也可能导致 `NullPointerException`，而且由于该语言提供的类型很少，它甚至可能导致运行时错误（如未定义变量）。


    注意，这种语言错误可以通过检查空安全来检测，这是语言的一个方面，与功能安全类似，但还有许多 Java 开发者没有意识到且没有时间去学习的功能。如栈安全和内存安全的功能通常比空安全更容易实现。


    导致 Java 臃肿且难以理解的第二个原因是 Java 规范非常大。Java 语言规范长达 1835 页，包含了 Java 语言提供的所有内容。因此，Java
    语言之大令人难以阅读。该规范处理起来困难的特性使得人们更容易忽视这一问题。


    ## 接触更复杂的语言


    根据代码趋势研究，大多数开发者只使用 `Scala` 和 `Python`，但我没有看到任何调查可以发现开发者在处理其他语言时到底在使用什么。根据我的经验，这些开发者中许多接触到了更复杂的语言。


    例如，当使用其他语言时，Java 开发者可以学习以下内容：


    - `GCC` 或 `MinGW/PowerPC` 编译器

    - `javac` 和 `gradle`（继承自 Java 开发者）

    - 编译器 `GCC` 或 `MinGW/PowerPC` `javac` 和 `gradle`（继承自 Java 开发者）语言工具，如 `Reflection
    API`（或反射和函数内省的方法）

    - `Netbeans IDE`（或 `Eclipse`）以及其他 Java IDE

    - 可移植库（例如 `JDK` 的库，如 `javax.outs` 或 `java.util`）

    - `JVM` 的功能（如高性能线程和细粒度并发控制）


    这些额外的功能几乎没有副作用，因为新功能通常只能为现有代码提供轻微加速。此外，如果 Java 程序员知道如何使用并实现它们，他们就可以让现有的 Java 代码运行得更快。


