    the result of political control (Coedes 1968). But the involvement was always
    curious, and the area did not generate any of the same interest in India as did
    the connection with Central Asia through the northwest, despite the large Indian
    migration into Southeast Asia. Lord William Bentinck summed the generally ambiguous
