  md: 'x Preface


    Though Ainslie utilizes the colonial sources, this does not mean that there was
    by any means unanimity among their points of view. One of the fascinating aspects
    of the book''s narrative is the degree to which administrators argued and disagreed
    among each other, and how in some cases the figures in India ignored or rejected
    the points of view of London officials. A major theme of this book, in fact, is
    how many of the British officers in India regarded their responsibility towards
    India as a nation. Though London may have seen the role of the British primarily
    in mercantile and extractive terms, the administrators in the subcontinent sided
    best with the national interests of India, and what they thought was best for
    the security and integrity of the emerging nation gives a much richer and more
    textured view of British colonial rule than is often portrayed.


    Because of the attention given by British officers in India to the integrity of
    India as a nation, Ainslie can recall one of the outcomes of boundary creation
    to be nation building. As he says, many of the early nationalist leaders in India
    held on to the idea promulgated by British colonial authorities that India had
    ''natural boundaries'' that destined it for national integrity. India''s first
    prime minister, Jawaharlal Nehru, among others would refer to this in creating
    an image of a Mother India that had endured for centuries.


    This quest for ''natural boundaries'' was central to the British administrators''
    attempts to create boundary markers along India''s frontiers. They were no doubt
    influenced by the European notion of nationalism that gave national status to
    regions defined by a common culture, and they assumed that India must have one
    within its natural boundaries. But such boundaries were also an essential aspect
    of security: determining locations where military defence could provide protection
    against any possible incursions from foreign powers. For this reason, this book
    is primarily concerned with India''s external borders, and not with interstate
    boundary creation. Since the issue of external boundaries was primarily a matter
    of land demarcation, it involves, almost exclusively, North India rather than
    South India. But the narrative of nation building relates to the whole of the
    Indian subcontinent.


    In going through the manuscript, I edited very little. My main task was to decipher
    Ainslie''s handwritten insertions, correct typographical errors, and complete
    unfinished sentences and paragraphs. Though'
