    It is hard to say how much significance these acquisitions along the eastern coast
    of the Bay of Bengal had for India. The whole of the bay was fringed by Indian
    territory, making the Government of India what it had never been before, a Southeast
    Asian power. This statement presupposed the correctness of the interpretation
