  md: '# About the Author and Editor


    # Author


    Ainslie T. Embree (1921–2017) was Professor of History (1958–91) and Professor
    Emeritus of History (1991–2017), Columbia University, New York, USA. He also taught
    in Indore, India, served in the US Embassy in New Delhi, and was president of
    the Association of Asian Studies and the American Institute of Indian Studies,
    USA. Among his many books is Charles Grant and the British Rule in India (1960).
    He was editor-in-chief of the four-volume Encyclopedia of Asian History (1989)
    and editor of the revised Sources of Indian Tradition (1988); Asia in Western
    and World History (with Carol Gluck, 1997), and India’s World and U.S. Scholars:
    1947–1997 (with others, 1998).


    # Editor


    Mark Juergensmeyer is Distinguished Professor of Sociology and Global Studies
    and Founding Director, Orfalea Center for Global and'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'International Studies, University of California, Santa Barbara, USA. He has
    previously edited two of Embree''s books of essays, Utopias in Conflict (1990)
    and Imagining India: Essays on Indian History (1989). He is an expert on religious
    violence, conflict resolution, and South Asian religion and politics, and has
    published more than 200 articles and 20 books. Some of his books include Terror
    in the Mind of God: The Global Rise of Religious Violence (2000); Global Rebellion:
    Religious Challenges to the Secular State (2008); and The Oxford Handbook of Religion
    and Violence (co-edited, 2018).'
