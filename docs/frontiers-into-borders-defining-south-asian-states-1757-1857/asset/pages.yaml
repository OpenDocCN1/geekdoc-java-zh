    that the active consent of the border states concerned was necessary, and, when
    Russia was involved, prolonged and careful diplomatic negotiations would be the
    normal course to allow in defining frontiers.


    The other point is somewhat theoretical but of greater importance. Owen Lattimore
    in his studies of China''s frontier history insisted that to see the frontiers
    of the great empires only in terms of defence against intruders is to miss much
    of their significance. The frontier, whether a zone or a linear boundary, is intended
    to set the limits for expansion from within. Efficient administration, taking
    into account economic resources and military requirements, has to decide how large
