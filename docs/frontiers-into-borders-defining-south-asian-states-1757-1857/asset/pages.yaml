  md: 'In the search for frontiers in the northwest, these four determinants—the fear
    of Russia, the hope for trade, the fascination of the unknown, and the impulse
    for expansion built into the Indian historical experience—were intertwined. They
    reinforced each other, but very often in official writing one was frequently emphasized
    to the exclusion of the others. This was the Russian danger, which seemed to provide
    the clearest justification for either actual territorial conquest or radical political
    intrusion. In fact, the more potent impulse was coming from India itself, from
    the most compulsive movement to make political control march towards what were
    conceived to be the natural frontiers of an Indian government.


    The search for a ''buffer state'' in the northwest was the result. With his long
    experience in Delhi, Metcalfe had argued that the Sutlej was the true northern
    frontier of India, with the Sikh kingdom of Ranjit Singh, and to lesser extent
    the territories of the Amirs of Sind, providing all that was needed by way of
    a buffer. By by the 1830s, the durability of the Sikh kingdom was being questioned,
    and the political structures of Sind were regarded as confused anachronisms. Thus,
    young Alexander Burnes, on his historic voyage up the Indus in 1831 at a time
    when Ranjit Singh''s power was at his height, shrewdly suggested that with his
    death this kingdom would collapse. The very source of Ranjit''s strength—the feuds
    between his chieftains and their complete dependence after him, and the ties with
    the Army were purely personal (Burnes 1831). The obvious answer was to look beyond
    them to the barrier to the Afghan country, to find in the mountains and plateaus
    the Indian plains through forming connections that would, in Sir Alfred Lyall''s
    terms, create a buffer state that would be placed under political taboo as for
    concerns rival powers whose hostility would be serious (Lyall 1891, 1931), and
    by reciprocal understanding would be guaranteed against foreign aggression. There
    were two possible general lines of action that might be taken in the creation
    of a client state: through subsidies and guarantees to make the acceptance of
    client status worthwhile to an incumbent ruler; or overthrow a ruler and replace
    him with someone with claims to legitimize succession. The decision was finally
    made in favour of the second expedient, but it was preceded by a decade of activity
    and debate in which those other determinants'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Frontiers and the Mountain Wall, 1833–57 145


    of frontier policy—trade and the challenge of the unknown—reacted with the policy
    of containment.


    Reliable political and geographical information was needed before any decisions
    could be made on frontier policy, and an attempt to meet this need was made through
    the famous episode of the gift of dray horses to Ranjit Singh. The belief that
    the Indus was navigable, and that it could provide an entrance into the heart
    of Central Asia, had been urged for a decade, but by surveys of the river were
    impossible because of the distrust of the Amirs of Sind, whose territory it passed;
    like Lord Glenely, they were aware that commercial enterprise had been followed
    by war. It was apparently Lord Amherst had suggested as a pretext for a survey
    that Ranjit Singh be present of horses up the Indus. Henry Pottinger, who had
    been the Company’s agent in Sind, added the suggestion that the gift should include
    a large carriage; since this would be too big a package to send by land, the Amirs
    might not be suspicious (Malcolm 1880). No one was fooled, of course, by this
    elaborate game, except perhaps the Calcutta government itself, had little little
    checking on the information supplied by Burns, the young lieutenant in charge
    of the expedition to the Indus (see Davis 1927, 23–6). The Amirs opposed the barges
    being sent up the Indus, but they did not possess the power to oppose the thinly
    veiled reminders that only British power stood between them and their enemies—the
    Afghans and the Sikhs. As for Ranjit Singh, he was as anxious as the Amirs that
    the British should not gain detailed information about the Indus and the country
    beyond it; having made a career of accommodation and compromise, he was not disposed
    to raise any many objections to the new British plans for Indus navigation and
    commerce.


    The schemes for Indus navigation in the early 1830s have a special place in the
    development of the Indian administration, for they provide one of the most striking
    examples of the change from the rapid hazard methods of the early period to the
    systematic compilation of reports. In this emphasis on investigation and report,
    it is tempting to see the influences of Benthamism working through Lord William
    Bentinck, although this aspect of British intellectual impact on Indian administration
    has probably been somewhat exaggerated. The two major reports come from Burns
    and Charles Trevelyan, with Burns’s based on his voyage up the Indus with Ranjit
    Singh’s horses and'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'Trevelyan''s on information available in the Calcutta secretariat (Burns 1831;
    Trevelyan 1835). That both reports were optimistic about the chances of improved
    trade, the feasibility of the Indus as a great internal waterway, and the possibility
    of checking Russian expansion in Central Asia had some writers, in the light of
    later developments, to accuse Burns and Trevelyan of being irresponsible, if not
    deliberately misleading. By their reports, especially Burns''s, are cautions,
    emphasizing how partial their information was, and how little was known in detail
    of either the geography or politics of the regions beyond the Indus. Both drew
    heavily upon older accounts, with Herodotus and Arrian frequently evoked. No one
    who read the memoirs of the British in India can miss the continual appeal to
    classical experience. Schoolboy memories of Alexander and of Roman expansion fed
    the imagination of the young men who looked with restless ambition to the unknown
    beyond the Indus.


    Burnes was especially drawn to the parallels with Alexander''s voyage as he made
    his way up the Indus; consciously or not, he was linking himself with the romantic
    dream of Western destiny in Asia. It is at this point that personal involvement
    and private ambition mingle with the purposes of the state, distorting the weight
    of evidence to favour the idea of the necessity and possibility of extending the
    power of the Government of India beyond the Indus. Burns was perfectly aware,
    for example, that trade on the Indus was negligible, but he believed this was
    because the banks were in the control of ''barbarous princes'' whose extortions
    prevented channels. He knew the Indus was shallow, with constantly shifting channels,
    he was convinced that steamships built on the pattern of the flat-bottomed river
    boats could sail from the Delta to Lahore (Burns 1831; McCulloch 1849, 23).


    While Burns was fascinated by his role as an explorer retracing, in the reverse
    direction, the splendours of Alexander''s conquests, Trevelyan, the bureaucrat,
    was no less entranced by the possibilities of expansion. With some sophistry and
    a considerable degree of historical inaccuracy, he defaced his summary of trans-Indus
    trade with a careful assertion that the idea for penetration into Central Asia
    had originated wholly by the authorities in London in 1829. This emphasis is a
    reminder, in the words of a modern sociologist, ''social reaction is always influenced
    by an audience,'' with the discussion going into decision-making'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Frontiers and the Mountain Wall, 1833–57 147


    never being just linear between the actual participants (Caplow 1968, v). The
    audience in the 1830s, as the decision was being made on the location of the frontier,
    while a relatively restricted one, was heterogeneous. There were the members of
    Indian influence in London, including the directors of the Company whose influence
    was dwindling but who were still not unimportant, and the Board of Control, the
    link with the British government. The actual decision would be made by the Governor
    General, based on the information coming from direct reports from field agents,
    but more often filtered through the resident at Delhi, the political agents at
    Lahore, and executives such as Trevelyan in Calcutta.


    Information on the northwestern frontier did not come only from Burns and Trevelyan.
    Journeys had been made into the area, and all through the 1830s new facts and
    speculations met the demand created by the debate over the location of the frontier
    and the extent to which the Indian government involved itself in the regions beyond
    the Indus. The most prestigious of the Company’s servants in India, Charles Metcalfe,
    explored this interest. He remembered and regretted the enthusiasm of youth which
    inspired him, twenty years earlier when he had been sent as the envoy to Ranjit
    Singh’s court, to dream of being the agent for expansion into Central Asia. Now,
    he argued, ‘We could do better than by avoiding forcing intimacy, for our character
