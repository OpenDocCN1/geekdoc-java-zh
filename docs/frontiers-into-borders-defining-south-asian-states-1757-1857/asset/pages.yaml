  md: 'This seems to be one of the earliest usages of the expression ''natural frontiers''
    which became common in British India. The term originated in France in the late
    eighteenth century with a quasi-mystical idea that the destiny of the French nation
    had boundaries designed by nature to coincide with nationality. Obviously, this
    was not what the Company''s agent meant, but rather a boundary supplied by some
    natural feature, such as a river, a sea, or a mountain range, a feature that clearly
    demarcated one territory from another and was defensible from intruders. This
    was what Rennell, the geographer and surveyor, had in mind, as did the other boundary
    in the nineteenth and twentieth centuries such as Durand and McMahon.


    The search for ''natural frontiers'' in the British usage, not the French, led
    logically to the states bordering on Nepal, such Tibet, Bhutan, Assam, and Burma,
    and the Company took an interest in all of them because it was believed that they
    offered opportunities if boundaries could be satisfactorily defined, posing security
    threats if they were not. In addition, some of the Company''s officials had begun
    to develop an interest in Indian culture related to the intellectual trends in,,
    science as well as religion and philosophy, even though their aimed was not to
    clear a path for knowledge but for trade and administration. Another aspect that
    emerges in this early search for boundaries was what may be called ''judgmental
    humanitarian'', one that later would be encountered frequently to justify expanding
    the Company''s boundaries.


    One of the earliest pleas for intervention on such grounds came from Captain Welsh
    of the Bengal Army, who had been sent to investigate about rumours of uprisings
    in Assam threatening the Company''s borders. In his report to Calcutta he argued
    that the ignorance, imbecility, caprice, and execrable cruelty of the government''
    (Mackenzie 2012, 332) towards the people demanded the British presence to prevent
    anarchy and to restore the ''the ancient constitution''. By that he meant the
    Company''s forces should restore the ruler who had just been overthrown in an
    uprising and remain in Assam until order had been restored. The Governor General
    from 1793 to 1798, Sir John Shore, who opposed further expansion of British territory,
    gave a short answer to Welsh''s plea: Bring the Company''s troops back to Bengal.
    There was no reason for British power to restore a ruler, who'
