    but one also made by petty chiefs whose writ did not run much beyond their ancestral
    fields. It was the transitory nature of such claims that was derived in one of
    the great Hindu religious texts, the Vishnu Purana. Earth is pictured as saying
    that ''when I hear a king sending word to another by his ambassador, this earth
    is mine, immediately resign your pretensions to it; I am moved to violent laughter
    at first, but then one sides in pity for the infatuated fool'' (*The Vishnu Purana*
    1840, 488).


