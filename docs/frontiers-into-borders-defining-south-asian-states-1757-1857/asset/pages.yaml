    Shore, a long-time official of the Company and the last one to be Governor General,
    was always aware that, while managing a large political state, the Company was
    a commercial enterprise, and his policy of non-interference in the internal affairs
    of neighbouring states, whether within peninsular India or beyond it, both on
    the northwest and northeast frontiers, was approved by the Company''s directors
    in London. That further extension of territory would threaten the British position
    in India was acknowledged by Charles Grant, one of the most powerful of the directors.
    He said it was ''a long recognised maxim ... which experience has so much justified''
    that Parliament by the Indian Act of 1784 forbade any further conquests as repugnant
    to the wish, the honour, and the policy of the British nation'' (Morris 1898,
    56).


    By 1797, the letters from Calcutta to the Company''s directors in London begin
    to question the wisdom or feasibility of the policy of nonintervention, given
    the increasing challenges in maintaining the boundaries of the Company''s territories,
    both within peninsular India and along external frontiers in both the northwest
    and northeast. The directors, who viewed the policy as sound from a commercial
    point of'
