    region where the hill states of Manipur, Chachar and Jaintia separated Bengal
    from Burma, and the northern section where the border was with the ancient kingdom
    of Assam. Here, there was quite a well-defined border formed by river Manas, and
    although there had border incidents throughout the years, on the whole, the area
    had not attracted much attention until the 1790s. Its return to prominence as
    a problem began in 1817 when the Burmese became involved in the complex internal
    power struggles that had left Assam almost without an effective government for
    two generations. (For an overview of the historical literature of this period,
    see Bhuyan 1932, 291–5.) The pattern was one that had become familiar through
    the years in Indian politics: a claimant to power appeared for outside help, which
    was given a prelude to a loss of independence. Badan Chandra, who had been ousted
    from the office of Bar Phukan, governor of the western part of Assam, fled to
    Calcutta to seek support from the Bengal government; when it was refused, he turned
    to the Burmese in 1817; but they returned as a permanent occupying force for the
    time being; the Burmese responded by sending an expeditionary force that put their
