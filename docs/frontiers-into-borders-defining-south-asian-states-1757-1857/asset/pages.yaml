    Lyall''s idea of frontiers beyond the political boundary was given the name ''Three-fold
    Frontier'' by Curzon, with his flair for coining a phrase (Lyall 1899, 368–73).
    This summarized very well the concept of the Indian frontier that Lyall and others
    had striven to elaborate. One frontier the administrative boundary up to which
    the Government of India exercised its full authority enforcing its own legal and
    political systems as the standard for society. Beyond this a zone claimed no attempt
    to impose its laws or political jurisdiction but permitted tribal chieftains to
    order their affairs. The outer edge of this zone was demarcated by a fixed boundary.
    The tribal zone was the third area, the protectorate, an independent kingdom,
    but tied by special treaties of friendship and obligation to the Government of
    India. The classic example of such a border area was, of course, in the northwest.
    There was a defined administrative line in the Northwest Frontier Province, beyond
