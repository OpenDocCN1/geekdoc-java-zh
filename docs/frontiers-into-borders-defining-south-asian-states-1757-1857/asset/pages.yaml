    view, began to accept the arguments from the Company’s servants in India that
    the fluid boundaries of the multi-state system had to give way to fixed boundary
    lines demarcated by permanent ones, acknowledged by both parties. They also discovered
    that this meant compulsion by the British, which is the message behind the seemingly
    bland assertion of Lyall up to that line authority had to be extended in some
    plain and indisputable form.


    In other words, the making of boundaries meant war with the states bordering on
    the Company’s territories. Some of the Company’s agents saw other possibilities,
    as did Lieutenant Broughton at Chittagong. Knowing of the great interest that
    Shore took in the stability of landownership for gaining the support of the people,
    Broughton argued for giving land rights to the Mags, a tribal group living on
    disputed land between Bengal and Burma. Doing so, he argued, would make them good
    citizens, grateful to the British, who would provide Bengal with a boundary that
    was defined and defensible.


    In general, reading the correspondence between the Company’s servants in London,
    one gets the sense of unease over the border situation among the Company’s servants.
    The directors had expected that the revenue exerted from the Bengal peasantry
    would pay for the investment, the goods purchased for sale in Europe, but instead
    their servants in India were spending nearly 50 per of the revenue of Bengal and
    the other territories. For the safety of the Company’s continued profitable existence
    in India, the officials in India argued, defining the boundaries was the fundamental,
    but expensive, necessity.


    Hence, the idea of firm borders—in the British sense of following natural geographic
    features—has been part of the understanding of the states of South Asia since
    the eighteenth century. The frequent border clashes between India and Pakistan,
    and between India and China, indicate that contested borders continue to be a
    feature of twenty and twenty-first South Asian political life. The idea of natural
    borders in the French sense of state borders that expresses the natural social
    configuration of a national community has also had an expression in South Asian
    political life. This idea appeared in the writings of Indian nationalists, when
    it was argued that true nationhood was'
