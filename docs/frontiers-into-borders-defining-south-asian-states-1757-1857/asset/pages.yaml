    During the early years of the nineteenth century, the frontiers of Bengal attracted
    little official attention, but after the Nepalese War they once more assumed the
    importance they had held briefly in the 1770s and 1780s. The climax of this interest
    was the First Burmese War from 1824 to 1826. The standard explanation of the war,
    and the consequent enormous expansion of territory controlled from India, drew
    upon the classic nineteenth-century understanding of the nature and function of
    the frontiers: since there was no natural barrier of mountain or river to the
    province of Bengal upon the east, it was impossible to confine British power (Roberts
    1967, 294). But as had already been shown along the Nepalese border, and as to
    be made amply clear for the rest of the century in the northwest, neither rivers
    nor mountains in themselves provide boundaries that in anyway impede expansion,
    or at least the likelihood of war.


    Then, as now, political conditions, not natural frontiers, determined the relations
    between India and adjoining powers, and by the early 1820s these made for an unstable
    frontier in the northeast. On the one side the British power in Bengal, committed
    to a quest for internal stability and emphatic on its to prevent any intrusion
    into its territory. On the other side was Burma, with a dynasty no less desirous
    of asserting its internal authority and jealous of any restriction on its sovereignty.
    In such a situation, it was not the lack of natural frontiers but the existence
    of intervening territories with weak governments—Assam and the conglomeration
    of hill states of indeterminate political status—that led to conflict. The refusal
    of Burma to have normal trading relations, which was perhaps the major cause of
    the Second Burmese War in 1852, was not a significant factor in the 1820s. Economic
    considerations found virtually no mention in the contemporary records. The emphasis
    is on borders, and the problem generated by the British, from their point of view,
