  md: '# 4 FRONTIERS INTO BORDERS


    transferred to the Indian subcontinent by the British as they transformed frontiers
    into boundaries, just as spatial relations were transformed by the steam engine,
    the telegraph, and the postal system. Indian nationalists such as Jawaharlal Nehru
    were correct when they insisted that these were not gifts of civilization by the
    British to India, but elements of world revolutions in transportation that were
    coincident in time to the British commercial intrusion into India in the form
    of the Company, the first of the great multinationals (Nehru 1946, 294–306).


    The Company had begun trading in 1600, but there are remarkably few references
    to this in contemporary Indian documents, public or private. That this is so was
    because the trade was small in terms of the Mughal Empire''s total economy and
    the Company was operating on the coastal margins of the subcontinent, far from
    the centres of Mughal political power in Agra and Delhi. The Company''s trade
    was carried on the sufferance of the Mughal authorities from ''factories'': fortified
    warehouses in various places located in the villages that eventually developed
    into the great metropolises of Calcutta, Madras, and Bombay, known as ''Presidencies''
    because of the title assumed by the Company''s chief in these regions. Calcutta
    in Bengal, the wealthiest of the Mughal provinces, was by far the most important
    of the three, and was the centre from which the Company began to establish political
    control of the subcontinent as the central control of the Mughal Empire weakened.
    This was a complex process, but the essential feature depended on the Company
    supporting one claimant over another in the struggle for the very lucrative office
    of nawab, the Mughal Emperor''s governor of the province, or suba.


    The first decisive step towards the Company''s involvement in political control
    came in 1757 at the Battle of Plassey when its officials teamed up with influential
    members of the Hindu commercial classes to back the overthrow of Nawab Siraj ud-Daulah
    and to replace him with one his officers, Mir Jafar. The Company''s contribution
    to this action, under the leadership of Robert Clive, was the provision of three
    well-disciplined soldiers, two of whom were Indian mercenaries. The Company had
    made the discovery that Indian troops could be hired at far less expense than
    soldiers brought out from Britain and they survived better under Indian conditions.
    As General Arthur Wellesley, later Duke of Wellington, put it, the Indians'
