    where Burma and Bengal did meet, in the hills beyond Cachar and Chittagong, the
    watershed seemed to provide a wholly satisfactory line.

    A few years after the Treaty of Yandabo when Lord William Bentinck was sending
    a mission to Burma, he warned them that there was no need to meddle with any border
    questions, as the mere fact of the streams running towards the Irrawaddy or to
    the Brahampur [Brahmaputra] sufficiently marking the right of the lands through
    which they travel [sic] (Foreign Miscellaneous Reports, 26, ‘Minute by Bentinck
    June 20, 1831’). This is one of the earliest references to the watershed as an
    Indian frontier, which was to receive its most vigorous statement years later
    on the McMahon Line. There is no evidence that the Burmese in 1831, any more than
    the Chinese in 1914, shared this mystic fate in the watershed as a determinant
    of borders.


    The Burma War no means established the eastern frontier; the annexation of Burma
    took sixty years, and the rest of the new frontier there were few where an agreed
    boundary could be found. But all the main lines of frontier had now been laid
    down, and commitments made that would be fulfilled during the next century. These
    acquisitions in 1824 were not the product of impulse. The annexation of Assam
    in some form had been urged by local Company officials the early 1790s, and rejected
    then and later by Calcutta and London. In the case of Manipur, the first treaty
    of the Company with a country on effect had been with it in 1762: it had not been
    put into effect, but its provisions were not unlike those made in 1833 and 1834.
    The advance into Burma was an echo of the events of 1759 when the English merchants
    were massacred at the Burmese port of Negrais, when the Company had not been strong
    enough to take revenge. The expansion of British rule on the eastern frontier,
    as elsewhere, was thus neither rapid nor planned. It is true that at no time was
    there a policy of frontier expansion down either in London or Calcutta, except
    the prescription in the 1784 Act of conquest. But when the Company’s administration
    there were always those who argued, and, is more important, worked on the frontier
    itself, and then ratified in Calcutta and London after events forced a decision.
    Belief in expanding imperialism planned and directed from the metropolitan centres
    is possible in this instance only if one concentrates on the materials relating
    to final decision and to to justification of acts that had already taken place.'
