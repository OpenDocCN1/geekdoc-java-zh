    chapter, was deeply rooted in the Indian historical experience, and the regional
    powers that emerged as independent entities with the decay of the central authority
    of the Mughal Empire corresponded in a considerable degree to previous political
    structures. While the multi-state system was the characteristic political organization
    of the subcontinent in historic times, it was essentially unstable. An equally
    characteristic feature of Indian history was for one strong kingdom, particularly
    one based on the Gangetic plain, to move towards hegemony over the other powers.
    Before 1798, the movement in Bengal towards an assumption of this historic role
    is observable, even though, almost without exception, responsible officials both
