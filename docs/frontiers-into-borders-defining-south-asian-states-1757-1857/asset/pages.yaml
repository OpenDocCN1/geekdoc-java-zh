    In addition to the coastal annexations, the war with Burma brought large new area
    under Indian control along the eastern frontier of the old Bengal district of
    Chittagong. In the Treaty of Yandabo, these annexations were defined in a negative
    fashion: The king of Ava renounces all claims, and will abstain from all future
    interference with, the principality of Assam and its dependencies, and also with
    the contiguous states of Cachar and Jyntea. Beyond this exclusion of Burmese influence,
    there was no agreement as to the actual political arrangements for the area. Great
    increase in expense for defence of the new territories, which were generally not
    productive and returned little new revenue, was one of the main arguments against
    their acquisition.


    The most interesting solution to this problem came from Scott, who urged the establishment
    of military colonies in the temperate hill zones (Lord William Bentick Papers,
    no. 2791, ‘Letter from David Scott to Lord William Bentick, July 21, 1830’). British
    troops could be settled in an area like the Khasi Hills, and be given military
    service in return for their land. Nothing came of his proposal, but it is one
    of the examples of serious thought being given to the creation in India of a resident
    British military class. At the outbreak of the invasion, Scott had issued a proclamation
    announcing that the Burmese who had invaded Assam, slaughtering ‘Brahmins and
    women and cows’, were to be driven out and in part calculated to promote the happiness
    of all classes’ (Foreign Department, no. 662, 173-4, ‘Proclamation to the People
    of Assam’; Wilson 1827, 35). But Scott already had doubts about the wisdom of
    attempting to restore the ruling family in control of the whole of Assam, and
    it was decided to bring lower Assam—the valley areas to the west of Bishnah—under
    direct British control.


    The rest of the valley was restored to a member of the Ahom dynasty in 1833 but
    was annexed in 1838. The hill between Burma and the valley were left in control
    of tribal chiefs who agreed to maintain peace with the British territories; the
    hill areas Brahmaputra were not concerned in these transactions (McKenzie 1884,
    5). In the other direction, Manipur was brought into the circle of protected states,
    with the Indian government being given the right to station troops there against
    Burmese intrusions (43). As for a border'
