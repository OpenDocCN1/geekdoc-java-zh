    The concern with frontiers at one level can be seen as a problem in defence of
    the interests the Company had built up in Bengal, but there is more to it than.
    The reactions of the officials and the arguments they used were those of the defenders
    of a national state, with such abstractions as ''national honour'' being applied
    to their conduct. No other issue in sixty years of British rule pointed clearly
    to the development of what can only be called a national consciousness, incipient,
    as frontier problems. It would be difficult to demonstrate any significant difference
    between the attitude of the foreign rulers of Bengal in the 1820s and those of
    the Indian nationalists in the 1960s in relation to borders and frontiers.


    The conventional judgement on the Burmese war, which lasted two years, is that
    it was badly managed by the Indian government. Aside from the war with Nepal,
    however, this was the first time British power in India had confronted with war
    a national government, and even more than in the case of Nepal, a government that
    was fighting for survival and knew it. The Treaty of Yandabo signed in 1826 was
    much harsher than the Treaty of Sagauli, and was much more concerned with providing
    defined borders acceptable to both states; it was treaty clearly imposed by the
    victors. At the outbreak of the war, the emphasis was on security for the eastern
    frontier, and it was assumed that this would be achieved through reinstating the
    old rules in Assam, continuing the protected status of the hills of Manipur, Cachar,
    and Jaintia, and separating Chittagong Arakan from Burma, with some member of
    the old ruling family in charge (Foreign Political Consultation, no. 1, ''Memorandum
    of the Governor-General, February 20, 1824''). By the end of the war, there was
    less certainty about the creation of the ring of buffer states, with quasi-independent
    status. Since the beginning, Scott had thought the imbecility, cowardice, and
    treacherous principles of any of the Assamese princes made them unlikely candidates
    for the guardians of the frontiers against the Burmese (Foreign Department, no.
    662, ''Letter from David Scott, February 23, 1824''). From Chittagong, the same
    kind of advice went from Calcutta from the local officials. Arakan, it was argued,
    should be taken from Burma and brought under Indian rule. Only then could there
    be peace on the frontier. ''We must have the mountains as a barrier between us
    and you,'' the British agent told the Burmese commissioners to arrange the treaty,
    to prevent the recurrence of war'' (quoted in Banerjee 1962, 345).'
