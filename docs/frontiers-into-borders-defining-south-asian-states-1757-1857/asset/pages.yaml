    The process of annexation of the Punjab demonstrated once more two of the essential
    features of the expansion of the Indian borders. One was the dependence of the
    Government of India officials in Calcutta on their intelligence gathering service.
    The other was the autonomy of the government from effective direction by the authorities
    in London. To see the annexation by ‘British imperialism’ is to misunderstand
    the inner nature of the search for borders. For the imperialist expansion that
    ended in the conquest of the Sikh kingdom was only ‘British’ in the sense that
    the officials in Calcutta and their agents in Punjab were British citizens. The
    impetus to expansion came not from London but from Calcutta and the agents of
    the Government of India in the Punjab. These agents—not Resident Henry Lawrence,
    who opposed annexation—were young military and civilian officials, as enthusiasts
    for a showdown with the Sikhs, supplied the Governor General and his council in
    Calcutta with the information on which they based their decision for extending
    the administrative frontiers of the Government India beyond the Indus. The reports
    of the agents can be found in detail in the records of the Foreign Department
    and Dalhousie’s letters also make clear that he accepted the reports of the agents,
    disregarding the cautionary comments on them made by the resident at Lahore. Two
    of the best known of the frontier agents, Herbert Edwards and James Abbott, acted
    independently of the resident at Lahore, their superior, initiating actions that
    were calculated to antagonize the Sikhs and force them to behave in a manner that
    the Governor General would construe as rebellion, a modern historian has suggested
    that they were acting under secret orders from the Calcutta Government (Hasrat
    1968, 320).


