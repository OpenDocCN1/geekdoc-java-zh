  md: 'Treaties, 1765–2015. The earlier, fully typed manuscript with four complete
    chapters bears two titles, India: In Search of Frontiers, and then below it on
    the same page a different title, Frontiers into Boundaries: The Making of the
    Outer Boundaries of India and Pakistan. I have chosen to go with a variant of
    the second title of the earlier manuscript, changing the subtitle to broaden the
    scope since the book talks about the borders with Afghanistan, Nepal, Bhutan,
    and Burma as well as defines the external boundaries of what would become India
    and Pakistan. Hence, my subtitle, Defining South Asian States, and then giving
    the dates that the main chapters of the book cover from 1757 to 1857, even though
    the introductory chapter and Afterword briefly mention events up to the present.


    In much of the manuscript, Ainslie uses the term ‘boundaries’ rather than ‘borders’.
    Most dictionary definitions regard the two as synonyms, but I suspect Ainslie’s
    choice of terms was deliberate. The ‘borders’ describes how the separation between
    nations appears from the ground; once, the crosses to go from India to Pakistan,
    rather than crossing the boundary. ‘Boundary’ on the other hand indicates how
    this separation is precisely made by cartographers; so one would trace the boundaries
    between India and Pakistan on a map rather than tracing their borders. So much
    of this book is how how distant colonial administrators were debating where the
    lines should be drawn, the term ‘boundary’ is the appropriate term to use. For
    the title, however, I have chosen Ainslie’s wording throughout the book. For the
    more commonly used term ‘border’ as Ainslie himself did in his 2015 notation of
    the title for the book, perhaps he was aware of the growing subfield of border
    studies, for which this book provides an interesting example.


    What is impressive about the research for this book is how thoroughly Ainslie
    mined the archives of the British colonial administration both in London and in
    Delhi. In addition to official reports and correspondence, he was able to tap
    into the personal collections of correspondence of some of the figures involved
    in this study. Because this book is about the British colonial administrators’
    attempts to construct India’s boundaries, it is necessarily Eurocentric in its
    sources. Where relevant, Ainslie refers to the responses and interactions with
    Indian leaders and administrators, but to a large extent the book is based on
    English-language sources of the colonial administration.'
