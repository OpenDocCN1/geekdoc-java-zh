    provided a stable frontier (in Broughton Papers, MS 36,475, Lord Dalhousie to
    Sir J.C. Hobhouse, August 15, 1848). The judgement of British observers at the
    time they were sympathetic to the continuance of the Sikh kingdom as well as later
    of Sikh historians was that the Lahore court was goaded to despair—as it had been
    in 1845—by a combination of factional struggles and pressures from the Government
    of India’s officials in the Punjab. On another level, government officials were
    disturbed by intelligence reports that noted rumours were being spread in the
    bazaars that the British were cow killers, and the faith of the Guru was in danger.
    The importance of the chain of information for decision making at this time is
    clear. The reports of Sikh activities came from the young military and civilian
    officials who, as Lord Hardinge had noted, were enthusiastic for annexation.


    The old belief that the Punjab could serve as a buffer state between India and
    Afghanistan faded before the palpable weakness of the Sikh kingdom. A vague humanitarianism
    and a nostalgia for the old ways could not counter the realities of self-interest
    as perceived by the Government of India ‘Old women and young ladies’ opposed annexation
    on moral grounds, according to Governor Lord Dalhousie, and in those categories
    he included the resident at Lahore as well as many members of the British Cabinet.
    But the logic of events pointed to the necessity of bringing the whole of the
    Punjab completely under control of the Government of India. The troubles in the
    Punjab which the resident and the commander-in-chief saw as merely local rebellions,
    he insisted, massive insurrections by the whole Sikh kingdom that could only be
    ended by annexation (in Broughton Papers, MS 36,475, 183–220, Dalhousie to Hobhouse,
    August 15, 1848’). The armies were mobilized, and by the end of the rainy season
    in 1848 they moved against the remnants of the army that Ranjit Singh had created.
    By the end of March 1849, the war was'
