    The next decisive step, fateful for the control of Bengal and the-

    tiguous Mughal powers of Bihar and Orissa and for British power

    in India, was the Treaty of Allahabad in 1765 by which the Mughal

    emperor made the Company *diwan*, financial officer, of the three

    great provinces. Mughal provincial governments were divided between

    two offices: those in charge of the nabob and the governor of the suba in general

    ger. The office of the diwan, however, was directly under the emperor

    in Delhi and in charge of the collection of revenue. This was office that

    was transferred to the Company in what its officials in Bengal reported

    to the directors in London as a ‘great revolution’. Their possessions and

    influence were rendered permanent and secure. Clive told them, and

    no Indian power would be able to overthrow them. ‘All revolutions,’ he

    declared, must beforehand be an end.’ Clive summed up this belief

