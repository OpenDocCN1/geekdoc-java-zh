  md: '# Afterword 183


    rooted in a peoples’ primordial possession of a land with a cultural inheritance.


    Such ideas became associated in the twentieth century with a vigorous Hindu nationalism
    that sought to exclude other Indian groups such as Muslims and Christians, who
    was argued, had a foreign cultural inheritance that prevented them from sharing
    in that primordial inheritance rooted in the land. One of the most influential
    statements of the identity of a nation with territory is found in the writings
    of V.D. Savarkar, who argued that nation, religion, and language were bounded
    by natural frontiers—the great arc of the mountains, the seas, and in the northwest
    the great river Sindhu, later known as the Indus, was the boundary. The day when
    the patriarchs of our race [the Aryans] had crossed that stream (‘Mazumd 2003,
    230), they became reborn as a new people, destined to become a new nation of Hindu
    or Indians. While associated with nativist, exclusionary religious politics in
    modern India, this was given expression at a fateful moment in contemporary Indian
    history. In 1959, Prime Minister Jawaharlal Nehru, a secular socialist, perhaps
    not knowing its origin, raised this claim when India and China were moving towards
    away the issue of where the boundary between the two countries. The Chinese pointed
    out that the boundary line that the two nations had been arbitrarily drawn by
    Great Britain, an expansionist imperial power, that neither India nor China was
    in a position to negotiate it. Nehru’s answer was categorical: The boundary runs
    where it has run for nearly three thousand years (Fairbank 1987, 8), and the people
    enclosed by it had always regarded themselves as Indians. This is a long jump
    between Nepal in the 1770s to South Asia in the contemporary era but it indicates
    how policies enmeshed in the local commercial concerns of the Company have been
    linked through the centuries with the nationalist concern with boundaries in the
    twentieth century that continue today.


