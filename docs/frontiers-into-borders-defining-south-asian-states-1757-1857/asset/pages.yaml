    of the frontier agents with the Governor General’s conviction that the Punjab
    should be annexed. Agents such as Edwards and Abbott saw the possibility of the
    destruction of the Sikh kingdom, and this possibility became a moral imperative
    for action. In his diary, Edwardes contrasts conditions in Lahore before and after
