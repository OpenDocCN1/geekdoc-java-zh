  md: '# FRONTIERS INTO BORDERS


    to use an expression often used for the process. More recently, 1914 is the year
    of the last great exploit of British imperialism in drawing borders by its arbitrary
    declaration that the McMahon Line along the Himalayan ridges was the boundary
    line between British India and China. But the basic framework had been established
    a century before.


    The word ‘India’ itself is not of Indian origin, but comes from Persian, Greek,
    and Roman sources. As Max Müller, the great Indologist, told a class of young
    probationers for the Indian Civil Service in 1882, it is a part of modern Western
    history, but it has a place in the very life of history, the history of the human
    mind. Its precise meaning in British usage in the nineteenth century was described
    in what is known as the Interpretation Act passed by the British Parliament in
    1889. The expression ‘India,’ the Act stated,shall mean British India, together
    with any territories of any native prince or chief under the suzerainty of Her
    Majesty, exercised by the Governor General, or through any other officer subordinate
    to the Governor General of India.’ The imperialism of this naming their country
    understandably annoyed many Indian nationalists, and some members of the Constituent
    Assembly argued for the use of the ancient and indigenous name, Bharat, which
    is used in the Hindi translation. But the name ‘India’, as Prime Minister Jawaharlal
    Nehru and others argued, had become part of the vocabulary of world civilization.


    The drawing of boundaries between that imperial construct and neighbouring political
    entities is a determining feature of the political development of all eight modern
    states of South Asia and is one of the most significant innovations introduced
    into the ancient polities of South Asia. The modern nation state is itself a modern
    innovation, for fixed boundary lines acknowledged by all contiguous states are
    a primary characteristic, closely related to the concept of sovereignty as recognized
    in international law as well as to the growth of nationalism. And yet, as a writer
    noted in 1918, when the redrawing of boundary lines was an intense preoccupation,
    the evolution of the conception of a boundary line, and the records of the attempts
    made to realise it and its influence on the development of states, are sections
    of political history which do not appear to have received much attention’ (Fawcett
    1918, 24).'
