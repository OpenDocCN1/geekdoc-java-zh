  md: '# Preface


    Mark Juergensmeyer


    Shorly after Ainslie Emaree, the great historian of South Asia died on 6 June
    2017 at the end of a long and productive life, I visited his wife, Suzanne, at
    their retirement home outside Washington DC. She invited me to go through Ainslie''s
    papers in his study, and my eyes fastened on a remarkable thing: the draft of
    a manuscript typed on an old-fashioned Smith Corona typewriter, on the topic of
    how the uncertain frontiers of today''s South Asian states, largely fashioned
    into the definite boundaries that the British called India were by the political
    and military calculations of the colonial government.


    "This is for a book that may or may not get written.'' Ainslie wrote in notes
    for revisions and expansions of the manuscript that were found on his computer.
    ''But it should provide a focus for my reading and writing since I have no other
    commitments,'' he added in a parenthetical insertion labelled ''Note to Self.''
    It is not clear when he began working on this manuscript, though the Smith Corona
    typing would indicate some'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'time in the 1970s or 1980s. In addition to the typed manuscript, there was
    a large number of pen- and pencil-inserted edits and additions. On Ainslie''s
    computer were found several attempts at rewriting the first chapter and what appears
    to be a long introduction, which I have used for both the introductory chapter
    of this book and the concluding Afterword. The last date on which he appears to
    have made substantial changes and edits to the book was 2015, when Ainslie was
    94 years old.


    The time frame of this study changed at various places in his notes. In most versions,
    it was to begin in 1757; at other times 1754, or 1767. The ending date was even
    less certain. In some versions it was 1914; in others it was all the way up to
    the present, 2015, and would include not only the partition of the subcontinent
    and the creation of Pakistan, Bangladesh, and independent India, but also the
    border disputes with China and the continuing uncertainty over boundaries in what
    were the northwest and northeast frontiers. It was an expansive vision for a large
    project which is outlined in Chapter 1, though the next three chapters bring the
    reader only to 1850. In a remarkable way, however, the book is complete, since,
    Ainslie argues in these chapters, all the major parameters of the South Asian
    boundaries were set during this time—the latter half of the eighteenth century
    and the beginning of the nineteenth.


    Moreover, this was the period of Indian history that Ainslie knew best, early
    the British colonial years. One of the first works in Ainslie''s career was also
    his favourite: his study of Charles Grant, one of the key players in the British
    East India Company from the 1760s until the first decades of the nineteenth century.
    In his book *Charles Grant and British Rule in India*, Ainslie scored the historical
    field for the study of British colonialism in the subcontinent in the late eighteenth
    and early nineteenth centuries with all of its political intrigue, its arrogance,
    and its enduring impact. A return to this period of colonial rule was a natural
    and appropriate move for what would become Ainslie''s last major project.


    From the beginning of his work on this project, the phrase ''Frontiers into Boundaries''
    was frequently mentioned as the title, though he formally referred to it as ''the
    borders book''. In what appears to be Ainslie''s last attempt to revise the introduction
    to the book, in 2015, he gave it the title *The Formation of the Modern States
    of South Asia: Borders, Sovereignty,*'
