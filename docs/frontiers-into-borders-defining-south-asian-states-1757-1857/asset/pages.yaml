    because of the existence of the frontier. (Turner 1920, 37)


    The frontiers of India, Curzon believed, could provide the same qualities and
    serve the function. Their men would be saved from ‘the corroding era and morbid
    excitements of western civilization. The frontiers provided scope for courage;
    for without a world to conquer or a duty to perform’, men ‘would rot of atrophy
    and inaction’ (Curzon 1907, 55–88).


    This vision of the function of the frontier as a place for testing and renewal,
    which in one form or another dominates so much of the nineteenth-century writing
    about India, found its laureate in Rudyard Kipling. In ‘Ganga Din’—perhaps his
    most famous, and most misunderstood, poem—Kipling celebrated the paradox of the
    frontier: while its creation and defence made enemies, it imparted a spiritual
    and physical vitality that united the strong. Kipling’s preoccupation with the
    frontier as a symbol of life-giving conflict was an immediate reflection of social
    Darwinism, but its deeper roots were in historical experience of the making of
    modern India, which was the basis for policies elaborated by Rawlinson, Lyall,
    and Curzon. From the beginning of the British intrusion as a political force in
    Bengal in the middle of the eighteenth century, problems relating to the frontiers
    had absorbed the interests and energies of the new administrators. Many of these
    problems were inherent in the geography of the regions they controlled; many that
