  md: '# Frontiers and the Mountain Wall, 1833–57 141


    The explanation that has seemed most satisfactory to historians, as it was for
    contemporaries, of the shift in interest that took place in the 1830s the northwest
    was the product of fear of Russian expansion through Central Asia towards India.
    Whether this fear was a cause or an effect of Russophobia, which was a characteristic
    attitude in Great Britain at the time, is uncertain, the fact that it was so pervasive
    and dominant in official thinking in India than in Britain suggests, not an Indian
    origin, at least one that was peculiarly relevant to the Indian situation. In
    the formulation and execution of British foreign policy, Russian intentions were
    one among many factors that had to be considered, while in India Russia was the
    only great power that had to be taken into serious consideration throughout most
    of the nineteenth century. It is noteworthy that many of those in Great Britain
    were early advocates of a policy that would prevent Russian expansion were Indian
    connections such as Wellington, whose personal and family connections with India
    were intense and of long duration, or Ellenborough, who was president of the Board
    of Control, the Cabinet’s link with the Indian administration (see Norris 1967).
    The way in fear of Russia, or perhaps more, the desire to prevent Russian expansion
    into areas where the Government of India was considered to have special interests,
    preoccupied the thinking of officials in India is easy enough to document; the
    printed literature is vast, and the unpublished records provide almost inexhaustible
    sources for an explanation of ‘the Great Game in Asia’ (Davis 1927; Evans 2004).


    But despite the seemingly overwhelming evidence giving fear of a Russian invasion
    the dominant place in any explanation of the foreign policy of the Government
    of India, and hence of the definition of frontiers, was not the only, perhaps
    not even the major, determinant in the fascination the northwest exercised over
    so many minds. Some importance must be given to the old expectation for trade
    through the mountains to Central Asia. As has already been emphasized, this expectation
    was a lively element in the efforts by Warren Hastings and his contemporaries
    to forge links with Tibet, and it was given life after the close of the Napoleonic
    wars as England sought new markets, especially for cotton goods (Redford 1934,
    108–26; Ingram 1980). That later knowledge proved these hopes illusory does not,
    however, detract from their reality. When William Bentinck, as Governor General,
    spoke as late as 1831 for information about the'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# 142 FRONTIERS INTO BORDERS


    countries between the Indus and Caspian ''in aid of war or commerce'' (Bentinck
    1831a; Ludlow 1858). This equal emphasis on the two factors of trade and defence
    against Russia was probably justified. For men like Bentinck, perhaps imperial
    territorial expansion in terms of expanding trade was not to give away a guilty
    secret, but to provide it with a kind of moral justification.


    Policy relating to frontier expansion and trade was given historical continuity
    at this point by the appointment of Lord Glenel as president of the Board of Control.
    He was the son of Charles Grant, who as a dominant power in the Company for thirty
    years, had opposed all territorial advances, arguing that British interests could
    be served through trade, not conquest (Emree 1962). Choosing position, Glenberg
    reminded the Indian government:''our motive is to extend our commerce, and only
    our commerce, along the waters of the Indus'' (Norris 1967, 46). This warning
    was made with some pessimism, for Glenberg, perhaps recalling the many speeches
    in which his father had denounced the course of expansion, noted that war and
    conquest seem invariably to follow the extensions of our commercial interests
    with the natives of the East.


    An important aspect of the Government of India''s preoccupations with Russian
    expansion in Central Asia was fear of the effect it might have on India. References
    to public opinion are few in state papers meant for public criticism, as the Government
    of India neither then nor later wished to give any indication that it was responsive
    to public criticism; but, in fact, there was widespread anxiety not to arouse
    in any way the antagonism of people. This was not, as it is sometimes suggested,
    an attitude that developed as a result of the 1857 uprisings. The Company''s opposition
    to missionary work, for example, was largely based on the fear of a hostile reaction
    in India (Embrace 1962, 239–52). The great danger, according to a Government of
    India memorandum in 1831, was the ''moral effect'' Russia might have on the people
    and princes of India. Continual talk of the Russian danger, it was feared, might
    tempt Indians to a reassessment of British power and the possibilities of seeking
    assistance from Russia (Bentinck 1831). The British assumed that many people,
    especially in the princely states, were waiting for an opportunity to undermine
    their rule, and nothing was more likely to provide this than an awareness by Indian
    powers of the presence of a hostile'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Frontiers and the Mountain Wall, 1833–57 143


    on the frontiers. So, the implications of the Russian advance into central Asia
    were political in the deepest sense. What was urgently needed, in modern terminology,
    was a policy of containment.


    There is still another factor in northwest frontier policy that must be taken
    seriously, even though it is intangible, and less amenable to definition and documentation.
    This is ‘the challenge of the frontier’—the attitude, noted in the first chapter,
    by which Curzon in Great Britain and Turner in the United States of America were
    the historians and eulogists ‘The challenge of the frontier’ is a jej explanation,
    but it at least suggests something of the compelling appeal enticed by unexplored
    regions, particularly mountains, on the periphery of known territory. Two separate
    facets of meaning this challenge are recognizable in the Indian situation, one
    personal, related to the individuals involved, the other political, part of the
    historical experience of the Government of India as an Indian power. The personal
    element included the appeal that the unknown and dangerous has always made to
    some people. Scarcely separable from this was the impulse towards geographical
    exploration that remained an abiding British passion. Intermingled with both was
    the shrewd assessment that reports from areas such as Afghanistan and Central
    Asia might prove useful in advancing one career (Phillimore 1945–50).


    The element rooted in the Indian historical experience is more complex and tenuous:
    it depends upon the argument that strong powers in India move towards completion
    of territorial control of the whole subcontinent. Boundaries of Indian kingdoms,
    it was argued earlier, were essentially unstable, with the possession of power
    carrying it with almost a compulsion to expansion (Phillimore 1945–50). In the
    1830s, as in the 1760s, there were strong arguments for consolidation rather than
    expansion, with men such as Metcalfe arguing that the Sutlej and the Indus mark
    the limits of westward and northward expansion (Kaye 1854, vol. II). But there
    was always a sense of incompleteness of power, a need to find frontiers where
    power could reach with the assurance that it reached its logical limits. The mountain
    wall seemed a far more certain line of definition than did the rivers of the Punjab
    plains. Even before they were reached, it was argued that the frontier must be
    found beyond the mountains, or in the great plateaus beyond.'
