    The result was a treaty that reduced Burmese power and gave control of the territory
    to the Bengal government that had never been before under the direct control of
    an India-based power (Aitchison 1892, vol. 1). The Arakan district, along with
    the coastal islands, was annexed, with the Arakan Mountains providing a boundary
    from the north down to Cape Negros in the south. As was usual with mountains,
    this boundary was much less defined in practice than it seemed in the vague maps
    of the period, but after the troubles the Naf permitted a considerable degree
    of isolation from the Burmese territories. Pegu and the other districts of the
    Irrawaddy delta were not annexed, although some of the local officials, especially
    the army officers had urged that it either be a buffer state under some representative
    of the old dynasty, or that it be annexed (Banerjee 1964, 347). It was recognized
    that the Burmese would have been unwilling at this time to sign a treaty that
    gave up Pegu, but furthermore its acquisition had led to frontier problems, for
    the delta was entirely open to the north. It decided, however, to annex Tenasserim
    and the associated territories of Ye, Tavoy, and Mergui. The Salwe river demarcated
    the boundary with Pegu, with the Pakhan river marking the southwards extension
    of the territory and the Bilaukta Mountains providing an inner boundary with Siam.
    This new boundary, which was intended to lessen old frictions, quickly rose to
    new ones.


    From the beginning there was never much enthusiasm either in Calcutta or London
    for Tenasserim. Not only was it soon apparent that the revenues would not cover
    the costs of occupation, but that its possession created a new series of border
    problems making Indian territory, for the first time, contiguous with Siam. As
    traditional enemies of the Burmese, the Siamese had welcomed the war with Burma,
    but when its conclusion made the British their immediate neighbours, they threatened
    and frontier developed on the new frontier. British officials in the area began
    to report to Calcutta that the Siamese were hostile, and they urged that preparations
    should be made to impress them with British power (Foreground Committee, no. 671,
    ''Letter from Lord Amherst to Governor of Prince of Wales Island, July 23, 1821'').


    This militant anxiety of local officials, so familiar a feature of frontier life,
    was not shared in Calcutta. In a very shrewd analysis of the situation created
    by the contact of British power with Siamese, Lord Amherst'
