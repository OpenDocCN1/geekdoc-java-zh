  md: '# Introduction 3


    In asserting that boundary lines are a modern device, a distinction is made between
    a frontier and a boundary, not always recognized by writers. Sir Henry McMahon,
    who gave his name to one of the most famous and fateful boundaries between India
    and China, made the following differentiation between the two concepts:


    A frontier often has a wider and more general meaning than a boundary, and a frontier
    sometimes refers to a wide tract of border country, or to a hinterland or buffer
    states, undefined by any external boundary line. Such recent times were the Northwest
    Frontier and the Northeast Frontier; the one comprising the wide and indefinite
    area of independent tribes on the Indian-Afghan border, and the other wide tract
    of a similarly indefinite nature on the Indian borders of Tibet and China. (McMahon
    1935, 4)


    Frontiers were marks of an expanding power in the Indian subcontinent for the
    Mughal Empire throughout the sixteenth and seventeenth centuries and for the British
    Empire during the period with which this book is concerned. As a modern geographer
    puts it, a frontier is a manifestation of the spontaneous tendency for growth
    of the ecumene, the vanguard of a forward-moving political culture bent on occupying
    contiguous spaces. A boundary, or an enclosing, a shutting in, a ‘term appropriate
    to the present concept of a state, that is, a state as sovereign (or autonomous
    spatial unit, one among many; (Kristof 1959, 270). This concept of a boundary
    as a fixed line on the ground, accurately represented on a map, and described
    in a treaty by two impinging sovereigties, is a mark of the modern state system.
    McMahon insisted on clarity in understanding the two differences between boundaries
    was delimitation, the determination of a boundary line by treaty or otherwise,
    and its definition in written, verbal terms; the other is demarcation, the actual
    laying down of a boundary line on the ground, and its definition by boundary pillars
    or other similar physical means’ (McMahon 1935).


    That the creating of boundaries was a major preoccupation of the British in India
    is attested by the enormous mass of documents on the issue in the archives of
    the Company and of the Government of India. It is one of the many attributes of
    the modern nation state that was'
