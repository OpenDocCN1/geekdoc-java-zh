  md: 'The passing of the Charter Act by Parliament in 1833 confirming the Company''s
    administrative control in India for another twenty years is a significant landmark
    in the making of modern India. The change in name of the chief official in the
    Company''s administration from Governor General of the Presidency of Fort William
    in Bengal—the title he had held since the Regulating Act of 1773—to Governor General
    of India was more than a formality; it was evidence of the change that had taken
    place in the power structure in India.


    Up to the end of the eighteenth century, Bengal had remained what it essentially
    was in 1765 at the time of the transfer of the diwani: Indian power among many.
    Beginning with Wellesley''s administration, the multi-state system of eighteenth-century
    India had been replaced by the overwhelming predominance of the Bengal-based power.
    The expansion and definition of external frontiers made the Government of Bengal
    to the Government of India. The old presidencies of Madras and Bombay, which had
    retained some measure of autonomy, were brought under complete control of the
    Governor General. Now they were not, as the viceroyties of previous Indian empires
    have been, reductions of the central authority; linked to the imperial institutions
    largely through the governor, but integral units of a central authority. Where
    there was no actual administrative control, as in Central India and Rajputana,
    the princes had been brought into the new structure through an acceptance of British
    paramountcy. Outwardly, their status was not unlike that enjoyed by their counterparts,
    and in many cases, their linear predecessors, the Mughals; but in fact it was
    quite different. They were not, as the Mughals imperial appointees, part of the
    central administrative structure, deriving their status from position as military
    commanders and revenue officials. Under the new system, the princes had more of
    the symbols but less of the substance of power, with pressure continually exerted
    to bring their administration in line with that existing under the Government
    of India. By 1833 the multi-state system still existed only in the areas of the
    Punjab under Ranbir Singh''s control and in an attenuated form, in Sind. Beyond
    them were Afghanistan and Central Asia, occupying analogous political positions
    as Nepal and Burma on the eastern frontier. The definition of their relationships
    with the Government of India, which formally came into existence with the Charter
    Act of 1833, was to be the dominant theme in frontier history during the next
    thirty years.'
