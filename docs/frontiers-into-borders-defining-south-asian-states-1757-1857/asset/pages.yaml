    # The Continuing Problem of Borders


    That are the natural borders of the states of South Asia? As was mentioned earlier
    in this book, the issue of ''natural frontiers'' was raised as early as 1770 when
    the Company''s agents in the northern districts of Bihar and Bengal argued that
    the \u''natural frontiers'' of British territory were not the flatlands of the
    terai beneath the mountains but the foothills of the Himalayas. The issue arose
    because of the appeal by the ruler of Morang, a ''hill raja'' in the vocabulary
    of the time, to the Company for protection against the Gurkha ruler''s incursions.


    The Company''s agent at its trading post at Purnea, who was in touch with the
    Morang ruler, argued that an alliance would be much to the Company''s advantage,
    giving access to valuable timber resources and opportunities to send the Company''s
    goods into the Nepal hills; but above all, it would permit the Company to get
    control of the Morang ruler''s territory in the terai. This would give the Gurkha''s
    northern districts a fixed and secure boundary, the ''natural frontier'' (Pounds
    1951, 146\57) of the Himalayan foothills.


    Frontiers to Borders. Ainsle T. Emree and Mark Juergensmeyer, Oxford University
    Press (2020). © Oxford University Press. DOI: 10.1091/oso/9780190121068.003.0006.'
