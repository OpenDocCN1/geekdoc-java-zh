  md: '# 4 Frontiers and the Mountain Wall, 1833–57


    During the first 70 years of British territorial control in India, the northwest
    mountain perimeter, which dominated the foreign policy of the Government of India
    in the late nineteenth century, was of little consequence. The mountain ranges
    to the east and northeast of Bengal had attracted more attention, although even
    there was the general assumption that the foothills defined the limits of expansion.
    The deep thrust into the Himalayas between the Sutlej and the Kali rivers of the
    war with Nepal was an important exception, but because of political conditions
    in Tibet as well as the physical nature of the terrain, no immediate political
    consequences followed its annexation. In the east, the extension of political
    control over Cachar, Jaintia, and Manipur was not so much concerned with the special
    problems involved with mountain frontiers as a completion of the plan to exclude
    Burmese influence in the whole area from the Bay of Bengal to Assam. The settlement
    after the Burmese war brought this territory under Indian control left untouched
    the future


    Frontiers at Borders. Ainsley T. Embree and Edited by Mark Juergensmeyer, Oxford
    University Press (2020). \© Oxford University Press.

    DOI: 10.1093/oso/9780190121068.003.0005.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# 140 FRONTIERS INTO BORDERS


    of the hill country to the north of the Brahmaputra as well as the unknown country
    in the tangle of hills beyond the extreme eastern end of the Assam valley.


    In the northwest, the situation was somewhat different. The relation of the new
    British power with its base in Bengal to the mountain areas of the northwest had
    been raised at an early stage of the establishment of British power, by the Afghan
    invasions of North India and later by the threat of a French intrusion during
    the Napoleonic wars. With the cessation of these threats, the northwest mountain
    areas tended to disappear from official concern, for the Company''s government,
    even after Wellesley''s conquests, remained largely an Ganetic power. The acquisition
    of Delhi, however, made a basic change in power relationships within India, even
    though this was not immediately discerned by either Calcutta or London. With the
    advance of the frontier to the Sutlej, involvement with the politics of western
    Punjab and the Indus valley, and through these areas with the northwest mountains,
    was a foregone conclusion. The British would discover whatever coming from the
    northwest had always known: the mountains are a transitional zone into India.
    Power in the past had generally flowed downward from the mountains into the plains,
    finding access across the passes after the establishments of bases on the Afghan
    plateau; now the movement was to be in the reverse direction.

    By 1833, at the time of the formal creation of a Government of India, this process
    was already under way, with Lord William Bentinck''s administration showing a
    renewed interest, the hiatus that had followed the activity in the Napoleonic
    wars, in the search for frontiers in Sind and Punjab. During the next thirty-five
    years—a period defined by the Act India of 1833 on one extreme and at the other,
    the ending of Sir John Lawrence''s administration (when relations with Afghanistan
    changed considerably)—the frontiers reached their approximate limits but were
    not very precisely demarcated nor was even a general agreement as to the limits
    of actual territorial control could. During the next period, roughly from 1870
    to 1914, the first actual demarcation of boundaries in the mountains, as distinct
    from the demarcation along Nepal, was carried out. Even then much remained vague,
    but as far as British power in India was concerned, this marked the end of over
    a century of debate and negotiation.'
