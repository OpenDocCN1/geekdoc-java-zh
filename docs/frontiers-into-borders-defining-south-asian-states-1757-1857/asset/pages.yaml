  md: '# Introduction


    # Defining the Borders of South Asian States


    The history of what is now called South Asia, but which throughout the nineteenth
    and the first half of the twentieth centuries was often referred to as the Indian
    subcontinent or, even less accurately as India, is loosely defined as including
    Afghanistan, Pakistan, India, Nepal, Bhutan, Bangladesh, Sri Lanka, the island
    outlier. In the contemporary world, they are part of the international community
    that forms the South Asian Association for Regional Cooperation (SAARC), a loosely
    organized attempt to further regional cooperation (Embre 2010, 199–200). None
    of them existed as independent modern nation states before 1947, but their contemporary
    status as nations, were determined by the creation of the British Indian Empire
    and by the process of decolonization.

    The time frame for this study is the hundred years before 1757, since by 1857
    many of the major territorial boundary claims by the British had been made. By
    the Treaty of Allahabad in 1765, the British, more properly the East Company (henceforth
    referred to as the Company), had established the lines of its rule by ‘force and
    fraud;",


    Frontiers into Borders. Ailsle T. Embre and Edited by Mark Jurgensmeyer, Oxford
    University Press (2020). Oxford University Press.

    DOI: 10.1093/oso/9780190121688.003.0001.'
