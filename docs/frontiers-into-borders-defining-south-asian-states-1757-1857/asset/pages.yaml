    in his report to the Company’s directors in London:


    Every nation trading to the East Indies has usually imported silver for a

    return in commodities. The acquisition of the Dewan has rendered this

    mode of traffic no longer necessary for the English Company: our invest-

    ment may be furnished, our expenses, civil and military power, and a large

    quantity of bullion annually must be sent to China [for importing Chinese

    gooods into Europe], tho’ we import not a single dollar. (British Library

    1767, 27)


