  md: '+   - Classes for networking with internet and web protocols


    +   - The loading and linking of code at runtime, sandboxed by a security manager


    However, Java wasn''t yet ready for general-purpose programming: the JVM was slow
    and the standard library sparse.


    Java looked like a cross between C++ and Smalltalk, those two languages influenced
    the Java programming style of the time. The "getFoo" and "AbstractSingletonProxyFactoryBean"
    conventions that programmers of other languages poke fun at were not widespread.


    One of Java''s unsung innovations was an official coding convention that spelled
    out how programmers should name packages, classes, methods, and variables. C and
    C++ programmers followed a seemingly infinite variety of coding conventions, and
    code that combined multiple libraries ended up looking like a right dog''s dinner
    inconsistent. Java one true coding convention meant that Java programmers could
    seamlessly integrate strangers'' libraries into their programs, and encouraged
    the growth of a vibrant open source community that continues to today.


    # Bean Style


    After Java''s initial success, Sun set out to make it a practical tool for building
    applications. Java 1.1 (1996) added language features (most notably just-in-time
    compilation and reflection), and extended the standard library. Java 1.2 (1998)
    added a standard collections API and the Swing cross-platform GUI framework, which
    ensured Java applications looked and felt equally awkward on every desktop operating
    system.


    At this time, Sun was eyeing Microsoft''s and Borland''s dominance of software
    development. Java had the potential to be a strong competitor to Visual Basic
    and Delphi. Sun added a few of APIs that were heavily inspired by Microsoft APIs:
    JDBC for database access (equivalent to Microsoft''s ODBC), Swing for desktop
    GUI programming (equivalent to Microsoft''s MFC), and the framework that had the
    greatest influence on Java programming style, JavaBeans.


    The JavaBeans API was Sun''s answer to Microsoft''s ActiveX component for low-code,
    drag-and-drop programming. Windows programmers could use ActiveX Components in
    their Visual Basic programs or embed them in web pages on their corporate intranet.
    Despite how easy it was to use ActiveX Components, they were notoriously difficult
    to write. JavaBeans were much easier; you merely had to follow some additional
    coding conventions for your Java class to be considered a "bean" that could be
    instantiated and configured in a graphical designer. The promise of "Write once,
    run anywhere" meant you would also be able to use—or sell—components on any operating
    system, not just Windows.'
