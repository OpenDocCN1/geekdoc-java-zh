    Integer::sum does the same thing. Java system type still create awkward edge cases
    because of this distinction between reference and primitive types. The Streams
    API is missing some common higher-order functions that we would expect to find
    coming from a functional language (or even Ruby). Checked exceptions don''t play
    well with the Streams API and functional programming in general. And making immutable
    classes with value semantics still involves a lot of boilerplate code. With Java
    8, Java has fundamentally changed to make a functional style work, if not completely
    with the grain of the language, at least against it.


    The releases after Java 8 add a variety of smaller language and library features
    that support more functional programming idioms, but nothing that changes our
    sum calculation. And that brings us back to the present day.


    In the case of Java, the grain of the language, and the way programmers adapted
    to it, evolved through several distinct programming styles.


    # An Opinionated History of Java Programming Style


    # Primeval Style


    Originally intended for use in domestic applications and interactive TV, Java
    only took off when Netscape adopted Java applets in its hugely popular Navigator
    browser. Sun released the Java development kit 1.0, Microsoft included Java in
    Internet Explorer, and suddenly everyone with a web browser had a Java runtime
    environment. Interest in Java as a programming language exploded.


    The fundamentals of Java were in place by this time:


    +   - The Java virtual machine and its bytecode and class format

    - Primitive and reference types, null references, garbage collection

    - Classes and interfaces, methods and control flow statements

    - Checked exceptions for error handling, the abstract windowing toolkit'
