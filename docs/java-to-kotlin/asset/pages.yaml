  md: 'An extension function or property can also be a calculation if the data it
    depends on is a value:


    ```

    fun Customer.fullName() = "$givenName $familyName`

    val Customer.fullName get() = "$givenName $familyName`

    ```


    # Computed Property or Function?


    You may have wondered when to define a computed property and a function that returns
    a result. Computed properties are confusing if they return different results at
    different times, at least when defined on value types (and you''ll be realizing
    by now that your authors think most of your types should be value types). A good
    rule of thumb is to reserve computed properties for calculations. We expand on
    this topic in Chapter 11.


    The result of a calculation may depend on data that is not passed as parameters,
    only if that data does not change. Otherwise, the function''s result would be
    different before and after the change, which would make it an action. Even if
    a function always returns the same result for the same parameters, it will be
    an action if it mutates something (a parameter or an external resource such as
    a global variable or a database). For example:


    ```

    print("hello")

    ```


    print always returns the same unit given the same hello input, but it is not a
    calculation. It is an action.


    # Actions


    print is an action because it depends on when and how many times it is run. We
    don''t call it, nothing is output, which is different from calling it once, which
    is different from calling it twice. The order that we call print with different
    arguments also matters to the results we see on the console.


    We call print for its side effect—the effect it has on its environment. Side effect
    is a bit of a misleading term, unlike drug effects, they are often exactly the
    thing we want to happen. Outside effect would be a better name, to emphasize that
    they are external to a function''s parameters, local variables, and return value.
    In any case, functions with observable side effects are not calculations. Functions
    returning void or unit are always actions, because if they do, they have to do
    it by side effect.


    As we saw previously, code that reads from external mutable state must also be
    an action (provided that anything does actually mutate the state).'
