    \ = parse('support@traveler.com'),\n      subject = 'Thanks for your help',\n\
    \      body = \"...\"\n    )\n  )\n}\n```\n\nThe code may read the same, but it\
    \ generates very different, and fundamentally incompatible, bytecode."
