  md: '# Static State


    In the early days of Java, static state was a lot more common than it is today.
    We wrote singletons and argued about how to initialize them in a lazy safe way.
    We used static fields to implement per-class caches of instances. Then the millennium
    fad for testing code all killed static state. That''s very difficult to isolate
    one test from another they are coupled by state, and very hard to uncouple them
    when state is static and shared between all tests in a JVM. (Note that state here
    refer to mutable data—constants—less of a problem.)


    So we learned to keep otherwise static state in object fields and used dependency
    injection to arrange for there to be only one shared instance of the object in
    our application. (When we say "dependency injection" here, your authors mean "passing
    an object to a constructor" rather than the use of a framework).


    In this chapter, we will focus on code rather than state.


    Sometimes we have a class with nonstatic and static methods acting on the same
    type—for example, the email class with a static parsing method we saw in Chapter
    3. Often, we end up with a class composed of only static methods. When there is
    no static state for them to share, these methods are really just stand-alone functions
    grouped together and called via their class name, like the methods from the java.util.Collections
    class, for example:


    ```

    var max = Collections.max(list);

    ```


    Amazingly, the industry didn''t notice how much of a pain that collections.prefix
    was for a while. This is because we wrote our programs by adding more and more
    methods to types that we owned, so we rarely needed functions. Static functions
    are useful when we want to add functionality without adding a method to the type
    they act on. This might be our classes are already sagging under the weight of
    all the methods that we have already added to, or because we don''t own the class
    and can''t add the method to it. Another reason for using static functions rather
    than methods is because the functionality only applies to some instances of a
    generic type, so it cannot be declared as a member of the Generic. Collections.max,
    for example, only applies to a collection with comparable elements.


    Over time, we began to appreciate the advantages of using standard interfaces,
    like the Java collections, instead of working with our abstractions. Java 5 (with
    its generics) was the first release that allowed us to use collections directly
    rather than wrapping them with our own classes. It''s no accident that Java 5
    also brought the ability to import static java.util.Collections.max so that we
    could then write:


    ```

    var m = max(list);

    ```'
