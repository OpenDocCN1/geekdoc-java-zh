    \ =\\n    strings\n    .map { translate(it) }\n    .takeWhile { it.equals(\"STOP\"\
    , ignoreCase = true) }\n```\n\nBut all words in the input list will be translated\
    \ to another List by map, even after those STOP. Using a Sequence avoids translating\
