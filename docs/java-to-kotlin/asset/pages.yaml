  md: "For a while now, though, we haven't had to do that. Recently, we find that\
    \ most of the new functionality we add to Travelator involves adding new operations\
    \ to Itinerary and ItineraryItem rather than new types of ItineraryItem. Changes\
    \ to the Itinerary interface and its implementations are a common source of merge\
    \ conflicts between team members who are working on different features. With every\
    \ new feature, the Itinerary gets larger. It seems to attract behavior to support\
    \ distantly related parts of the application, with properties to support rendering,\
    \ cost estimation, ranking by comfort, maps drawing, and more hidden beyond that\
    \ and other methods. Paradoxically, in the core of our application, object-oriented\
    \ polymorphism is increasing coupling!\n\nObject-oriented polymorphism enables\
    \ variability of data types with an infrequently changing set of operations. For\
    \ a while, that was what our codebase needed, but now that it has stabilized,\
    \ we need the opposite: variability of operations applied to an infrequently changing\
    \ set of data types.\n\nIf we were writing in Java (at least up to Java 16), there\
    \ is no language feature to help us copy with this dimension. Java's principal\
    \ feature to support variability is object-oriented polymorphism, and that doesn't\
    \ help when operations change more frequently than the set of data types.\n\n\
    We could use the double dispatch pattern, which involves a lot of boilerplate\
    \ code, and because it does not play well with checked exceptions, is not widely\
    \ used in Java. Instead, Java programmers resort to runtime checks, using the\
    \ instanceof and downcast to run different code for different classes of object:\n\
    \n```\nif (item instanceof Journey) {\n  var journey = (Journey) item;\n  return\
    \ ...\n} else if (item instanceof Accommodation) {\n  var accommodation = (Accommodation)\
    \ item;\n  return ...\n} else if (item instanceof RestaurantBooking) {\n  var\
    \ restaurant = (RestaurantBooking) item;\n  return ...\n} else {\n  throw new\
    \ IllegalStateException(\"should never happen\\n}\n```\n\nExample 18.5 [open-to-sealed:0:src/main/java/travelator/itinerary/itineraryItems.java]\n\
    \nThat IllegalStateException shows that this approach is risky. Whereas the compiler\
    \ can type check our calls to polymorphic methods, our hand-coded checks circumvent\
    \ compile-time checks. The type checker cannot tell whether our casts are correct\
    \ or our conditional statement is exhaustive: whether it applies to all possible\
    \ subclasses. If returning a value from the method, we have to write an else clause\
    \ to return a dummy value or throw an exception, even if"
