  md: '# Moving On


    Extension functions and properties are the unsung heroes of the Kotlin language.
    Their canonical use is to add operations to types we cannot modify ourselves.


    However, Kotlin language features and tooling combine to encourage us—quite inconsistently—to
    write extension functions for our *own* types as well. Kotlin''s safe call operator
    makes it more convenient to call an extension function through a potentially null
    reference than to pass the reference to a function as a parameter when it is non-null.
    The type of a freestanding generic extension can express relationships between
    the receiver and its result that cannot be expressed by open methods. Autocompletion
    in IntelliJ includes extension functions along with the methods that can call
    on a value, but it does not show you functions that you can pass the value to
    as a parameter.


    As a result, extension functions allow us to write code that is more easily discovered,
    understood, and maintained. Many of the other techniques presented in this book
    build on extension functions, as we will see in Chapter 15, Encapsulated Collections
    to Type Aliases, Chapter 18, Open to Sealed Classes, and others.'
