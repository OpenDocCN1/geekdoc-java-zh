  md: '# Moving On


    Very often in engineering, we have to make compromises. In particular, attempts
    to make one thing simpler often complicate another. I/O complicates our software
    in two ways. It is an action, so we can''t just ignore whether or when it happens
    as we refactor; and it is subject to errors, which we have to deal with if we
    want a robust system. These errors may be simple environmental failures to read
    or write, or because the things that we are reading don''t meet our expectations—when
    the marketing file ends badly formatted, for example.


    Both actions and errors taint their callers, and the solution in both cases is
    the same: move the code closer to the entry points so that it taints less of our
    system. This, then, is an area where, rather than having to compromise, we can
    kill two birds with one stone. By moving I/O to the outside of our systems, we
    can reduce the ways that both actions and errors complicate our code.'
