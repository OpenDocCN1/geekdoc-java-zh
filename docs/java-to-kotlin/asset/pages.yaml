  md: '# Other Build Systems


    We''ve chosen to show the changes necessary to add Kotlin support to a Gradle
    build here, but you can use Maven or Ant by following the instructions provided
    in the Tools section of the Kotlin documentation. This also gives instructions
    for using the command-line compiler, kotinc.


    If you use Gradle, there is the option to use Kotlin, rather than the traditional
    Groovy, as the build definition language. This has the advantage of providing
    better tool support through strong typing, at the expense of having to translate
    Stack-Overflow into a new language.


    As are Java and Kotlin developers rather than Java and Groovy developers, your
    authors start new projects with the Kotlin DSL, but we don''t feel the need to
    convert existing Groovy at least not immediately. With the Java and Kotlin in
    production code, we can mix and match Kotlin and Groovy in our build, so this
    is a version that we can take our time over. We recommend that you switch your
    build from Groovy to Kotlin as your first act of conversion, and certainly don''t
    look to write a Groovy to Kotlin Gradle book!


    # Moving On


    We expect the technical information in this chapter to date very quickly, as neither
    Gradle nor plug-ins have a very stable interface. Your current Java build file
    is also almost certainly incompatible with our example in some crucial way. Despite
    this, adding Kotlin to a Java build is generally straightforward.


    Devising a strategy for moving code from Java to Kotlin is more complicated and
    context specific. Or at least differently complicated and context specific. Individual
    projects should examine whether Java is working for them, and where using Kotlin
    would alleviate problems and improve the code. You might choose to dive in and
    write some Kotlin from scratch, or to convert an existing Java class to Kotlin.
    In the spirit of this book, the latter is the approach we''ll take in Chapter
    3, Java to Kotlin Classes.'
