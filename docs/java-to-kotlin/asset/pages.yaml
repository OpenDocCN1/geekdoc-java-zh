  md: "```\n.sumBy(String::length)\n/ strings.size.toDouble()\n```\n\nsumBy (also\
    \ available as an extension on Iterable) avoids boxing by returning an Int. It\
    \ can do this because it is a terminal operation, so it doesn't return another\
    \ sequence or collection.\n\n# Multiple Iterations\n\nIf you use streams, you\
    \ have probably tried to to do something like this:\n\n```\npublic static double\
