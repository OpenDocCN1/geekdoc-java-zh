    # Extension Properties


    Kotlin also supports extension properties. As we discuss in Chapter 11, Kotlin
    properties are actually method calls. In the same way that extension functions
    are static functions that are called like methods, extension properties are static
    functions that are called like properties, which in turn methods. Extension properties
    can''t store any data because they don''t really add fields to their class—their
    value can only be computed.


    The nameForMarketing could have been defined as an extension property:


    ```

    val Customer.nameForMarketing get() = `$${familyName.uppercase()}, ${name}\`

    ```


    In fact, it should probably be a property, as we will discuss in Chapter 11.


    Most of what we have to say about extension functions applies to extension properties
    unless we specifically distinguish between them.


    ![](img/2cfc593bb874a4b3e87c679863832738_146_0.png)


    # Extensions Are Not Polymorphic


    Although invoking an extension function looks like a method call, it is not, sending
    a message to an object. For polymorphic method calls, Kotlin uses the dynamic
    type of the receiver at runtime to select the method to execute. For extensions,
    Kotlin uses the static type of the receiver at compile time to select the function
    to call.


    If we need to use extensions in a polymorphic way, we can often achieve this by
    calling polymorphic methods from our extension functions.


    # Conversions


    So far, we have seen extension functions adding operations to a type. Conversions
    from one type to another are a common case. Traveler needs to convert customer
