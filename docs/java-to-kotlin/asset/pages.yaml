    # Nullable Parameters


    Extensions really come into their own when we work with optional data. When we
    are sending messages to a potentially null object, we can use the safe-call operator
    ?. that we saw in Chapter 4. That doesn''t help with parameters though: to pass
    a nullable reference as an argument to a function that takes a null parameter,
    we have to wrap it in a conditional


    ```

    val customer: Customer? = loggedInCustomer()

    val greeting: String? = when (customer) {

    null -> null

    else -> greetingForCustomer(customer)

    }

    ```


    Kotlin''s scoping functions, as let, and also, can help you more. In particular,
    it converts its receiver into a lambda parameter:


    ```

    val customer: Customer? = loggedInCustomer()

    val greeting: String? = customer?.let { greetingForCustomer(it) }

    ```


