  md: '# Functional Programming and Textual Reasoning


    When we finished this book, we realized—to our surprise—that we had not included
    any software design diagrams.


    Partly, frankly, this was laziness. It''s hard enough to manage the multiple versions
    of the example code as it passes through refactorings without worrying about other
    views. But we also make it a habit to express ourselves in just the programming
    language that we have. If we can achieve comprehension in just the raw text, then
    in our day jobs, we won''t be forced to switch contexts to view a diagram that
    may or may not be in sync with the code.


    When we''ve written about object-oriented design, we''ve relied on diagrams to
    show the dynamic structure and behavior of the software and how changes affect
    its dynamic behavior. In object-oriented software, dynamic structure—the graph
    of objects and how messages flow between them—is largely implicit. It makes it
    hard to relate what you see in the source to what will happen at runtime, visualization
    is a vital part of object-oriented programming. Through the 1980s and 1990s, software
    designaries created a variety of design notations to visualize object-oriented
    software. In the mid 1990s, the designers of the most popular notations, Grady
    Booch, Jacob Jacobson, and James Rumbaugh, combined their efforts into the Unified
    Modeling Language (UML).


    The functional programming community doesn''t have such a focus on diagrams and
    visualization. The goal of functional programming is algebraic reasoning: reasoning
    about the behavior of a program by manipulating its textual expressions. Referential
    transparency and static types allow us to reason about our programs by using the
    syntax of the source code. This results in a much closer correspondence between
    source code and runtime. As our code becomes more functional, we find that we
    can read our system''s behavior without having to think about mechanisms that
    are not immediately apparent in the source and have to be understood.


    # Refactoring


    Along with the pragmatic functional programming, refactoring is the other key
    tenet of this book. Refactoring plays an important part in our professional lives
    because, if we don''t know enough about the eventual form of our system to get
    its design right the first time, we will have to transform what we have into what
    we need. Our authors, at least, have never known enough about the eventual form
    of a system to get its design right the first time. Even those applications we
    started with detailed requirements ended up very different from those specifications
    by the time they were delivered.'
