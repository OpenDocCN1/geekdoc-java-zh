- img_proc: true
  md: 'By this time, many JVM developers had dabbled in Scala. came to appreciate
    the advantages of using an Optional (named option in Scala’s standard library)
    when absence was possible, and plain references when it was not. Oracle muddied
    the waters by telling developers not to use its Optional for field or parameter
    values, but as with many features introduced in Java 8, it was good enough and
    adopted into the mainstream of java.


    Depending on your age, Java code might use some or all of these strategies for
    dealing with absence. It is certainly possible to have a codebase in which NullPointer
    Exceptions are never seen, but the reality is that this is hard work. Java is
    weighed down down by its halfhearted Optional type.


    In contrast, Kotlin embraces null. Making optionality of the type system safer
    than the standard library means that Kotlin replaces refresh uniformity in their
    treatment of missing values. It is not all perfect: Map<K, V>.get(key) returns
    null if there is no value for key; List<T>.get(index) throws IndexOutOfBoundsException
    when there is no value at index. Likewise, Iterable<T>.first() throws NoSuchElementException
    rather than returning null. Such imperfections are generally caused by the desire
    for backward compatibility with java.


    Where Kotlin has its APIs, they are good examples of how to safely use null to
    optional properties, parameters, and return values, and we can learn a lot from
    studying them. After youve experienced first-class nullability, returning to languages
    without this support feels unsafe; you are acutely aware that you are always only
    a deference away from a NullPointerException, and that youre relying on conviction
    to find the path through the mildew.


    Functional programmers may advise you to use an optional (also known as Maybe)
    type rather than nullability in Kotlin. We counsel against this, even though it
    will give you the option to use the same (monadic—there, we use tools) to represent
    potential errors, asynchronous; and so on. One reason not to use optional in Kotlin
    is that you lose access to the language features designed specifically to support
    nullability; in this the grain of Kotlin is different from the grain of say, Scala.


    Another reason not to use a wrapper type to represent optionality is subtle but
    important. In the Kotlin type system, T is a subtype of T?. If you have a String
    that cannot be null, then a nullable String is required. In contrast, T is not
    a subtype of Optional?. If you have a String and want to assign it to an optional
    variable, you have to wrap it in an Optional. However, if you have a function
    that returns an optional-string and later discover a way to return a result, changing
    the return type to String will break all your clients. Had your return type be
    the nullable?, you could have strengthened it to String while maintaining compatibility.
    The same applies to properties of data structures: you can easily migrate from
    optional to nonnullability—but, ironically, with Optional.


    36 | Chapter 4: Optional to Nullable'
