  md: '# Coupling


    A subtle difference between expressing a dependency as either an implementation
    of IEmail, or as an implementation of the function type (Email) -> Unit, is the
    coupling between the client and the implementation, in particular when they are
    in different code modules.


    Email has to be defined somewhere. The client cannot define it, because the implementation
    will depend on the interface, and the client on the implementation, leading to
    a circular dependency. So the interface has to be defined with either the implementation,
    or in a separate place (package or file) depended on both implementation and its
    clients. The latter (an application of the dependency inversion principle) is
    in theory better but in practice more work and thus often neglected.


    With or without dependency inversion, the result is the client and implementation
    being coupled by the interface in ways that can make hard to reason and refactor.
    Any change to methods on EmailSystem might affect all code that depends on the
    interface.


    In contrast, in the functional world, the runtime defines all the function types,
    so they don''t introduce a compile-time dependency between the client and implementation.
    Unlike IEmail, which we have to define somewhere, Email -> Unit in Java, Consumer<Email>
    is part of the language. Of course, will there be a runtime dependency—the constructor
    code needs to be visible where the dependency is created, and the client be able
    to invoke the implementation code—but these cause less coupling. For example,
    when a dependency is expressed as a function type, we can rename EmailSystem.send,
    and the only change in our client code will be to use a different method: the
    internals of sendThanks be unaffected.


    ![](img/2cfc593bb874a4b3e87c679863832738_262_0.png)


    # Only Pass Types That You Own or That the Runtime Defines


    An early rule of thumb for OO systems was that, on the inside of our systems,
    we should program in terms of types that we own rather than those supplied by
    libraries. That way we are insulated from changes that we don''t control and are
    more likely to write code that can be reused with different implementations.


    An exception to this rule is taking a dependency on types provided by the runtime;
    these are very unlikely to change. Function types allow us to easily convert from
    unstable to stable interfaces, allowing parts of our systems to evolve at different
    rates.


    # Object-Oriented or Functional?'
