  md: 'types without changing the code that defines those types. Which we choose depends
    on what we expect to vary most frequently as the code evolves: data types or operations.
    Managing variability in Kotlin involves mastering when to apply these two mechanisms
    to our domain models.


    If our bet turns out to have been wrong, we must refactor from one to the other.
    When all the code is in a single codebase, Kotlin and IntelliJ make refactoring
    between the two forms straightforward. This chapter described going from the kind
    of object-oriented polymorphism we wrote in Java to Kotlin’s sealed classes. Going
    the other way involves refactoring steps described in Martin Fowler’s *Refactoring:
    Improving the Design of Existing Code*, such as “Replace Conditional with Polymorphism,”
    so we won’t cover it in this book.'
