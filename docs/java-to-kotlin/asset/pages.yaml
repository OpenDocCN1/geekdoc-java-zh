    In these cases we have to be isolated from changes. List.copyOf(collection) was
    added in Java 10 to copy an underlying collection as an AbstractImmutableList,
    which is nonmodifiable subject to changes in the original collection.


    This second-guessing of whether the source or destination of a collection is likely
    to modify it, and taking appropriate action, is tedious and error-prone. The problem
    applies to any mutable data, but changing collections is particularly pernicious,
    because we often derive values (such as departsFrom) that get out of date if we
    change the collection that we extracted them from. Rather taking defensive copies
    at every function boundary, many teams, your authors'' included, adopted a simpler
    and more efficient strategy.


    # Don''t Mutate Shared Collections


    ![](img/2cfc593bb874a4b3e87c679863832738_84_0.png)


    Treat any collection shared between separate pieces of code as immutable. Sharing
    includes references received as a parameter, returned as a result, or assigned
    to a shared variable. This applies even if the collection started as mutable,
    but despite the mutation operations present in the Java interfaces.


    When code that we don''t own does not respect this convention, we can use copies
    to insulate our code from mutation.'
