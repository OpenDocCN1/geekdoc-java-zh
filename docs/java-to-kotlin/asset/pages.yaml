    \ help',\n      body = \"...\"\n    )\n  )\n}\n```\n\nBut this is not the same\
    \ as the OO. Instead of invoking a send method, what is actually happening here\
    \ is that we are calling getter to access a property of function type, and then\
    \ calling invoke on that:\n\n```\nfun sendThanks(sender: EmailSystem) {\n  sender.send.invoke(\n\
