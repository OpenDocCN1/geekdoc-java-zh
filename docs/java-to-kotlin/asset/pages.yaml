  md: 'Kotlin prefers static over dynamic binding.

    Kotlin encourages a type-safe, compositional coding style. Extension functions
    are bound statically. By default, classes are not extensible and methods are not
    polymorphic. You must explicitly opt in to polymorphism and inheritance. If you
    want to use reflection, you de add a platform-specific library dependency. Kotlin
    is designed for the outset to be used with a language-aware IDE that statically
    analyzes the code to guide the programmer, automate navigation, and automate program
    transformation.


    Kotlin doesn''t have special cases.


    Compared to Java, Kotlin has fewer special cases that interact in unpredictable
    ways. There is no distinction between primitive and reference types. There is
    no void type for functions that return but do not return a value; functions in
    Kotlin either return a value or not at all. Extension functions allow you to add
    new operations to existing types that look like the call point. You can write
    new control structures as inline functions, and the break, continue, and return
    statements act the same as they do in built-in control structures.


    Kotlin breaks its rules to make migration easier.


    The Kotlin language has features to allow idiomatic Java and Kotlin code to coexist
    in the same codebase. Some of those features remove guarantees provided by the
    type checker and should only be used to operate with legacy Java. For example,
    lateinit opens a hole in the type system so that dependency injection frameworks
    can inject values through the encapsulation boundaries that are normally enforced
    by the compiler. If you declare a property as lateinit it is up to you to ensure
    the code initializes the property before reading it. The compiler will not catch
    your mistakes.


    When we, Nat and Duncan, revisit the earliest code we wrote in Kotlin, it tends
    to look like Java dressed in Kotlin syntax. We came to Kotlin after years of Java
    and had inherited habits that affected how we wrote Kotlin. We wrote unnecessary
    boilerplate, didn''t make use of the standard library, and avoided using null
    because we were not yet used to the type checker enforcing null safety. The Scala
    programmers on our team went too far way—their code looked like Kotlin trying
    to be Scala, cosplaying as Haskell. None of us had yet found the sweet spot that
    comes from working with the grain of Kotlin.


    The path to idiomatic Kotlin is complicated by the Java code we have to keep working
    along the way. In practice, it is not enough to learn Kotlin. We have to work
    with the different grains of Java and Kotlin, being sympathetic to both as we
    gradally transition from one to the other.'
