  md: "Java and the JVM do not have the concept of internal visibility. Kotlin compiler\
    \ translates internal features of a class to a public feature in the JVM class\
    \ files it generates, and records the internal visibility as additional metadata\
    \ that is processed by the Kotlin compiler but ignored by the Java compiler. As\
    \ a result, Kotlin features declared as internal appear to be public to the Java\
    \ compiler and JVM, allowing us to create invalid values accidentally when we're\
    \ working in the Java code of our project. That makes top-level functions an unattractive\
    \ option.\n\nInstead, we can lean on Kotlin's overloading again. If we define\
    \ a function call operator for the Money class companion object, Kotlin code can\
    \ create Money values using the same syntax as if they were calling the constructor:\n\
    \n```\nval current = Money.of(BigDecimal(\"9.99\", GBP))\n\nval proposal = Money(BigDecimal(\"\
    9.99\", GBP))\n```\n\nIt won't be costly, though in this case:\n\n```\nval proposal\
    \ = Money.Companion.invoke(BigDecimal(\"9.99\", GBP))\n```\n\nJust as we were\
    \ renaming the add method to plus, if we try to achieve this by merely renaming\
    \ of to invoke, we have a knock-on effect on our Java code. Java code that creates\
    \ Money values from reading as Money.of(BigDecimal(100), EUR) to Money(BigDecimal(100),\
    \ EUR). The methods have two responsibilities: to enforce class constraints when\
    \ creating Money values, and to provide syntactic in the the that conforms to\
    \ Modern Java conventions for denoting values. Renaming of to invoke doesn't affect\
    \ the former but messes up the latter.\n\nWe can use the combination of extract\
    \ method and refactor the call to the extracted method and inline method to avoid\
    \ any negative effects on our Java code as we refactor our Kotlin code to follow\
    \ Kotlin conventions.\n\nFirst, the method of Money's entire body is a method\
    \ called invoke:\n\n```\nclass Money private constructor(\n  val amount: BigDecimal,\n\
    \  val currency: Currency\n) {\n\n  companion object {\n    @JvmStatic\n    fun\
    \ of(amount: BigDecimal, currency: Currency) =\n      invoke(amount, currency)\n\
    \n    private fun invoke(amount: BigDecimal, currency: Currency) =\n      Money(\n\
    \        amount.setScale(currency.defaultFractionDigits,\n        currency\n \
    \     )\n  }\n}\n```"
