  md: "# Expressive Function Types\n\nOnce we have our head in the functional mindset,\
    \ the type (Email) -> Unit may be expressive enough to tell us the role of the\
    \ function, especially when bound to a variable named. What can you do with an\
    \ email that doesn't return a result? If it doesn't return a result, it may be\
    \ an action (“Actions” on page 79), but deleting an email might also have a similar\
    \ signature. Objects that have advantage over functions—they get to name their\
    \ methods (sendemail) is obviously different than delete(email)—at the expense\
    \ of also having to name the type of object or interface.\n\nKotlin has a feature\
    \ that can help make functions more expressive: we can name the parameters. If\
    \ it helps, we could write (toSend: Email) -> Unit. It doesn't make a great difference\
    \ here but can be very useful in situations with parameters of the same type,\
    \ for example (username: String, password: String) -> AuthenticatedUser. If we\
    \ use this, IntelliJ will even helpfully name the parameters when we implement\
    \ the function with a lambda or a class.\n\nThere is another way of bridging the\
    \ OO-FP gap that doesn't involve making our classes implement function: create\
    \ a function reference at the point of translation. Here is our class-based solution:\n\
    \n```\nclass EmailSender(\n    private val serverAddress: InetAddress,\n    private\
    \ val username: String,\n    private val password: String\n) {\n    fun send(email:\
    \ Email) {\n        sendEmail(\n            email,\n            serverAddress,\n\
    \            username,\n            password\n        )\n    }\n}\n```\n\nWe can\
    \ convert an instance of EmailSender to a function type with a lambda:\n\n```\n\
    val instance = EmailSender(\n    inetAddress(\"smtp.traveler.com\"),\n    \"username\"\
    ,\n    \"password\"\n)\nval sender: (Email) -> Unit = { instance.send(it) }\n\
    ```\n\nor use a method reference:"
