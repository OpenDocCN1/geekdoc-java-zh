  md: "This is in contrast to the other fundamental building block: data. We expect\
    \ data to vary as we run our program, and different data is bound to variables.\
    \ Variables are called variables because they are, wait for it, variable. Even\
    \ when they are final, or val, they are usually bound to different data in different\
    \ invocations of a function.\n\nWe hinted earlier at a subdivision of functions\
    \ into those that return a result and those that do not. This might seem like\
    \ a fundamental difference, but in practice there is a more useful way to divide\
    \ functions: calculations and actions\n\nActions are functions that depend on\
    \ when or how many times they run; calculations are functions that don’t—they\
    \ are timeless. Most functions that we write are actions, because we have take\
    \ special care to write code that doesn't depend on when it is. How would we go\
    \ about doing that?\n\n# Calculations\n\nTo be called, a function must always\
    \ return the same result given the same inputs. The inputs to a function are its\
    \ parameters, which are bound to arguments when the function is called. So a calculation\
    \ returns the same value when called with the same arguments.\n\nTake a fullFunctionName:\n\
    \n```\nfun fullName(customer: Customer) = `${customer.givenName} ${customer.familyName}`\n\
    ```\n\nfullName is a calculation: it will always return the same value when supplied\
    \ the same Customer. This is true only if Customer is immutable, or at least givenName\
    \ and family Name cannot change. To keep things simple, we'll say that calculations\
    \ can only have parameters that are values, as defined in Chapter 5.\n\nMethods,\
    \ and the disguised methods are member properties, can also be calculations:\n\
    \n```\ndata class Customer(\n  val givenName: String,\n  val familyName: String\n\
    )\n  fun upperCaseGivenName() = givenName.toUpperCase()\n  val fullName get()\
    \ = \\`${givenName} ${familyName}\\`\n)\n```\n\nFor a method or extension, the\
    \ receiver receives this, and any property accessed via this, is also an input.\
    \ So both upperCaseGivenName and fullName are calculations given Name and familyName\
    \ are both values."
