  md: "The fact that we even have these options is a testament to how well Kotlin/Java\
    \ interop works in both directions. In practice, we don't have to choose. With\
    \ some reckoning tactics and a few annotations to control how the Kotlin compiler\
    \ generates code for the JVM, we can get the best of both worlds. We can define\
    \ Money in Kotlin, allowing us to take advantage of Kotlin's features, and still\
    \ provide an idiomatic API for Java that we are maintaining.\n\nWe converted the\
    \ Money class to Kotlin in Chapter 3. Since we left it at the end of that chapter,\
    \ have (without you, sorry) been able to make the code more concise without affecting\
    \ Java code that depends on it. We refactored most of the methods to single-expression\
    \ form (Chapter 9), and we took advantage of Kotlin's flow-sensitive type information\
    \ to simplify the code's method.\n\nHere is Money now. It's not significantly\
    \ different but has a less syntactic noise:\n\n```\nclass Money private constructor(\n\
    \    val amount: BigDecimal,\n    val currency: Currency\n) {\n    override fun\
    \ equals(other: Any?) = =\n        this === other ||\n        other is Money &&\n\
    \        amount == other.amount &&\n        currency == other.currency\n\n   \
    \ override fun hashCode() =\n        Objects.hash(amount, currency)\n\n    override\
    \ fun toString() =\n        amount.toString() + \" \" + currency.currencyCode\n\
