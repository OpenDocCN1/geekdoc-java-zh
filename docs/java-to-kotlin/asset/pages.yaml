  md: "# CHAPTER 1\n\n# Introduction\n\n# The Grain of a Programming Language\n\n\
    Like wood, a programming language has a grain. In both carpentry and programming,\
    \ when you work with the grain, things go smoothly. When you work against the\
    \ grain, things are more difficult. When you work against the grain of a programming\
    \ language, you have to write more code than necessary, performance suffers, you\
    \ are more likely to introduce defects, you usually have to override convenient\
    \ defaults, and you have to fight against the tooling every step of the way.\n\
    \nGoing against the grain involves constant effort with an uncertain payoff.\n\
    \nFor example, it has always been possible to write Java code in a functional\
    \ style, but few programmers before Java 8–for good reasons.\n\nHere’s Kotlin\
    \ code calculates the sum of a list of numbers by folding the list with the addition\
    \ operator:\n\n```\nval sum = numbers.fold(0, Int::plus)\n```\n\nLet’s compare\
    \ to what was required in Java 1.0 to do the.\n\nThe mists of time will pass over\
    \ while transporting you to 1995...\n\nJava 1.0 does not have first-class functions,\
    \ so we have to implement functions as objects and define our own interfaces for\
    \ different types of function. For example, the addition function takes two arguments,\
    \ so we have to define the type of two-argument functions:\n\n```\npublic interface\
    \ Function2 {\n    Object apply(Object arg1, Object arg2);\n}\n```"
