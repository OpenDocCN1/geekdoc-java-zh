  md: 'The grain of Kotlin is different from that of Java. Java’s grain favors mutable
    objects and reflection at the cost of composability and type safety. Compared
    to Java, Kotlin favors the transformation of immutable values and freestanding
    functions, and has a type system that is unobtrusive and helpful. Although it
    is easy to convert Java to Kotlin with IntelliJ, we end up with Kotlin syntax
    rather than taking advantage of all that the new language could offer if we changed
    our thinking, too.


    Java and Kotlin can coexist in the codebase, and the interop boundary is almost
    seamless, but there are risks when you pass information from the strictly typed
    world of Kotlin to the loosely typed world of Java. With care, we find that we
    can transform from idiomatic Java to idiomatic Kotlin in small, safe steps, using
    automated refactoring tools where possible and editing text as a last resort.
    We can also support the conventions of both languages at the same time when we
    must maintain Java code while we are converting it depends on on Kotlin.


    # Functional Thinking


    As we’ve seen in our history lessons, the grain of Java was formed in the 1990s,
    when we believed that object-oriented programming was the mythical silver bullet.
    When OO turned out to solve all our problems, mainstream programming languages,
    and Java itself, began to adopt ideas from functional programming. Kotlin was
    born from Java this age, and like our children are better equipped for the future
    than we are, Kotlin is more suited to modern programming than Java.


    What do we mean by functional thinking?


    Our software is ultimately limited by our ability to understand it. Our understanding
    is in turn limited by the complexity of the software we created, and a lot of
    complexity arises over confusion about when things happen. Functional programmers
    have learned that the way to tame complexity is simply to have things happen a
    lot. They say that happening an effect: a change that is observable in some scope.


    Mutating a variable or a collection inside a function is an effect, but unless
    that is shared outside the function, it doesn’t affect any other code. When the
    scope of an effect is local to a function, we don’t have to consider it when reasoning
    about what our system does. As soon as we mutate shared state (a parameter to
    the function, perhaps or a global variable, a file or network socket), our local
    effect becomes an effect in whatever scope can see the thread, and that quickly
    increases complexity and makes understanding more difficult.


    It is not enough that a function''t actually mutate shared state. If there is
    a possibility that a function could mutate shared state, we have to examine the
    source of the function and, recursively, every function that it calls, to understand
    what our system does. Every piece of global mutable state makes every function
    suspect. Similarly, if'
