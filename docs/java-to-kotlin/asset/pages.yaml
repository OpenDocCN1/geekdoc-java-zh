  md: '# The Legacy of Java


    Although we said earlier that “our runtime defines all the functions types,” that
    wasn’t true of Java until Java 8 introduced Supplier, Consumer, Predicate, and
    so on, and the ability to implement them with method references or lambdas.


    Because of this, legacy Java code usually expresses dependencies with the same-method
    interfaces that we would use to group them by subsystem (like EmailSystem), even
    when only one of these methods is required to implement the functionality. This
    leads to the coupling problems described earlier. It also leads to a need for
    mocking (or, more pedantically, faking) frameworks to create implementations of
    broad interfaces where in practice one method will be called. These fakes sprout
    the functionality to fail early if you call a method that you didn’t mean to call,
    a problem that would be solved at compile time if a single function expressed
    the dependency.


    Once we have introduced a mocking framework into our codebase (or, more usually,
    two or mocking frameworks to cater to different tastes), they allow us to solve
    problems, like generating implementations for unused methods and stubbing out
    interactions with external systems. Usually, our code could be improved by refactoring
    to avoid the need for mocks. Expressing dependencies as function types is one
    example; another is moving the interaction with external systems to the outer
    layers of our code, as we will see in Chapter 20. Chapter 17 how to reduce mock
    use by refactoring our tests to a more functional form.


    # Traceability


    There is a downside to expressing dependencies with function types, and it is
    a common issue with adding a layer of indirection. If we use IntelliJ to find
    the callers of EmailSystem.send, the trail goes to the point where EmailSystem::send
    is converted to (Email) -> Unit. The IDE doesn’t know that invocations of the
    function are actually calling the method. It’s like our hero enters a river, and
    the posse tracking them to scour both upstream and downstream to find where they
    get out.


    This is a price we pay for indirection with method calls, but our tooling is wise
    to these and can find all places where a particular method is implemented, and
    where an implementation is called through an interface. As using unencapsulated
    collections (Chapter 15), the price we pay for decoupling and generality is that
    tooling, and developers trust that IDE support will improve its functional analysis,
    and in the meantime, we can help by not passing function types too far from where
    they are initialized to use.'
