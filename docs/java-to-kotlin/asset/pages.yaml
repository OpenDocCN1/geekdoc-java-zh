  md: "However, it still retains the grain of Java, as does the Kotlin code that it\
    \ uses. The Money class follows conventions for value types that are common in\
    \ Modern Java, but are not the ways things are usually done in Kotlin. In particular,\
    \ it uses methods of a companion object to create values, and it uses methods\
    \ rather than operators for arithmetic.\n\nIn a monolingual codebase, it would\
    \ be pretty straightforward to address those issues. However, we have plenty of\
    \ Java code that uses the Money class. We will continue to make changes in Java\
    \ and Kotlin, until Kotlin has edged out altogether. In the meantime, we want\
    \ to ensure that code uses Money in either language is convenient enough not to\
    \ frighten the hordes\n\n# Adding a User-Defined Operator\n\nKotlin code that\
    \ calculates Money values is still rather clumsy:\n\n```\nval grossPrice = netPrice.add(netPrice.mul(taxRate))\n\
    ```\n\nIt is not significantly different from the equivalent Java:\n\n```\nfinal\
    \ var grossPrice = netPrice.add(netPrice.mul(taxRate));\n```\n\nUsing methods\
    \ for arithmetic operations makes the calculation harder to read. It's the best\
    \ we can do in Java, but in Kotlin we can define arithmetic operators for our\
    \ own classes, allowing us to use that calculation as:\n\n```\nvar grossPrice\
    \ = netPrice + netPrice * taxRate\n```\n\nTaking addition as an example, let's\
    \ take a look at how we can give our Money class arithmetic operators.\n\nWe give\
    \ the class + operator by writing an operator method or extension function called\
    \ plus. For our Money class, we can rename the add method to plus and add the\
    \ operator modifier:\n\n```\nclass Money private constructor(\n  val amount: BigDecimal,\n\
    \  val currency: Currency\n) {\n  ...\n  operator fun plus(that: Money) = Money\
    \ {\n    require(currency == that.currency) {\n      \"cannot add Money values\
    \ of different currencies\"\n    }\n    return Money(amount.add(that.amount),\
    \ currency)\n  }\n}\n```\n\nExample 12.2 [operators.2:src/main/java/travelor/moncy/Money.kt]"
