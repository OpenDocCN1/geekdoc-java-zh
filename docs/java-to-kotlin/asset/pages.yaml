  md: 'These individual refactorings rarely stand alone though. Now that the building-block
    refactorings can be performed automatically, we have the time and energy to combine
    them to make larger-scale changes to our codebase. When the IDE does not distinct-interface
    actions for a large-scale transformation we wish to, we have to perform it as
    a sequence of more granular refactorings. We use the IDE''s automatic refactoring
    whenever we can, and fall back on text editing when the IDE does not automate
    a refactoring we need.


    It''s tedious and error-prone to refactor by editing text. To reduce the risk,
    and our boredom, we minimize the amount of text editing we do. If we must edit
    text, we prefer that edit affect a single expression. So we use automatic refactorings
    to transform the code so that it is possible, edit one expression, and then use
    automatic refactorings to tidy back up to the final state we''re aiming for.


    The first time we decide a large-scale refactoring, we will go through it step
    by step and show how the code changes at each step. This takes a lot of space
    on the page and will take a bit of reading time to follow. In practice, however,
    these large refactorings are quick to apply. They typically take a few seconds,
    a few minutes at most.


    We expect the refactorings published to date quickly as tools improve. The individual
    IDE steps may be renamed, and some combinations might be implemented as single
    refactorings in their own right. Experiment in your context to find ways of gradually
    and safely transforming your code that are better than those we present, and share
    them with the world too.


    # We Assume Good Test Coverage


    As Martin Fowler says in Refactoring: Improving the Design of Existing Code: "I]f
    you want to refactor, the essential precondition is having solid tests." Good
    test coverage ensures the transformations that we want to improve design have
    not inadvertently changed your system''s behavior. In this book, we assume that
    you have good test coverage. We do not cover how to write automated tests. Others
    have addressed these topics in more detail than we could in this book, for example:
    Test-Driven Development By Example by Kent Beck (Addison-Wesley) and Growing Object-Oriented
    Software Guided Tests by Steve Freeman and Nat Pryce (Addison-Wesley). We do,
    however, how to apply Kotlin features to improve our tests.


    As we walk through multipestep code transformations, we won''t always say when
    we run the tests. We assume that we run our tests after every change that we show
    that, no matter how small.


    If your system does not already have good test coverage, it can be difficult (and
    expensive) to retrofit the code because the logic you want to test is entangled
    with other aspects of the system. You are in a chicken and egg situation: you
    have to'
