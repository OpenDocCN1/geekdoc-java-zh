  md: 'We can use the @JvmMultifileClass and @JvmName annotations to control how our
    toplevel declarations appear in JVM class files, so that moving declarations between
    source files won''t break binary compatibility. However, none of our Kotlin test
    or example code will have changed, so we can''t rely on them to warn us about
    this kind of breakage. We just have to take extra care if we move top-level functions
    published in a library, or use tools to check binary compatibility for us.


    # Moving On


    Static functions are the bread and butter of our programs. In Java these have
    to be static methods on a class, but in Kotlin we can and should default to defining
