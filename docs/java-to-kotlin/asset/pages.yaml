  md: 'Now that we have this concept in our codebase, we can identify other parts
    of our application that can use it. We can move logic from those parts into the
    Pricing Context, making it a one-stop shop for operations that need to convert
    monetary amounts into the traveler''s preferred currency. And should it end full
    of disparate methods for different use cases, then we can move the operations
    from methods to extension functions to keep them closer to where they are needed
    (see Chapter 10).


    # Moving On


    We started this chapter with a calculation that relied on shared, mutable state.
    It duplicated logic from the standard library and introduced the risk of aliasing
    errors. By the end of the chapter, we have refactored the same calculation to
    a transformation of immutable data.


    To do so, we moved out of our code in two directions, outward and inward. Outward
    was obvious: we made the CostSummaryCalculator treat the CostSummary class as
    an immutable value and then made CostSummary immutable. We made users of CostSummaryCalculator
    treat it as an immutable to a calculation and then made CostSummaryCalculator
    immutable. But inward? We replaced the imperative code that mutated collections
    and fields with standard higher-order functions, like groupBy, fold, and reduce.
    Under the hood, those functions may mutate state, but they hide mutation from
    their callers. From outside, the functions are calculations.


    We can use the same approach in our own code when we need to. Sometimes mutating
    the standard library does not always have a higher-order function that transforms
    data the way we want. If we need a mutable collection, we can hide mutation inside
    a calculation to limit the blast radius of any aliasing errors. However, every
    release adds functions to the standard library, so the need diminishes over time.


    Functional programming does not eliminate mutable state but instead makes it the
    responsibility of the runtime. A functional program declares that the runtime
    should calculate and lets the runtime be responsible for computing that calculation.
    Kotlin is not a pure functional language, but we benefit by following that principle
    we can.'
