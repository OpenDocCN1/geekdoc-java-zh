  md: 'refactor to be able to add tests so that you can safely refactor. Again, other
    authors have addressed these topics in more detail than we could, for example:
    Working Effectively with Legacy Code by Michael Feathers (Pearson).


    We''ve listed more books about these topics in the Bibliography.


    # We Commit for Git Bisect


    Just as we not explicitly state when we run tests, nor do we commit our changes.
    Assume we commit our changes whenever they have added value to the code, no matter
    how small.


    We know our test suite isntt perfect. If we accidentally break something that
    is not caught by our tests, we want to find the commit that introduced the fault
    and fix it as quickly as we can.


    The git bisect command automates that. We write a new test that demonstrates the
    error, and git bisect does a binary search of the history to find the first commit
    that makes that fail.


    If the commits in our history are large, and contain a mishmash of unrelated changes,
    git bisect won''t help us as much as it could. It cannot tell which of the source
    changes within a commit introduced the error. If commits mix refactoring and changes
    to behavior, reverting a bad refactoring step is likely to break other behavior
    in the system.


    Therefore we commit small, focused changes that separate refactorings from each
    other, and from change to behavior, making it easy to understand what was changed
    and fix any erroneous change. For the same reason, we rarely squash commits.


    > We prefer to commit changes straight onto the main branch—“trunk-development”—but
    changing code in a sequence of small, independent commits is just as beneficial
    as working in branches and merging less frequently.


