  md: 'To solve this problem, we resorted to converting our Lists to Sequences. Sequences
    have state and are not values, but with a little care we can treat them like lazy
    values—lazy in that they don''t require or return all their contents up, but can
    read or supply them on demand. They aren''t as simple as lists, but their compatible
    Kotlin API allows something of the best of both worlds.


    Our original Reader to writer version of generate had to worry about I/O errors,
    whereas the List to List version moved all I/O to its callers. The Sequence version
    is in a middle ground. It doesn''t worry about I/O errors because they are hidden
    from it by the Sequence abstractions wrapping the Reader and writer. That doesn''t
    mean that they can''t happen, just that generate isn''t responsible for them.
    We''ll take a break to see whether our colleagues in marketing have any more batter-based
    rewards before addressing that topic in Chapter 21, Exceptions to Values.'
