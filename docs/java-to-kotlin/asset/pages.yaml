    \n| Mock-Induced Test Damage |\n| David Heinemeier Hanson coined the term test-induced\
    \ design damage to refer to harm caused to systems in testability. In practice,\
    \ your authors don't recognize this as a problem; we find systems are usually\
    \ improved by the decoupling to test them. We do often see tests ruined by mocks,\
    \ so much that mocking has fallen out of favor in our circles. |\n\nThe problem\
