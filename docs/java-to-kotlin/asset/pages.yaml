  md: "Most object-oriented systems (C++ in particular) were based on this record\
    \ mechanism. Instance variables were simply record fields, and methods (aka member\
    \ functions) were holding pointers to functions. Smalltalk was different. Smalltalk\
    \ objects can have instance variables, but access to this state is by sending\
    \ a message to the object asking for the value. Messages, not fields, is the fundamental\
    \ abstraction.\n\nThe Java implementors a little of each approach. Objects can\
    \ have public fields, but clients can't reach into their memory to retrieve them;\
    \ they have to bytecode instructions to access their values. This allows us to\
    \ treat classes as records while allowing the runtime to enforce private field\
    \ access.\n\nAlthough direct access to fields was permitted, from the outset it\
    \ was discouraged. We can't change the internal representation of data if clients\
    \ access fields directly, at least not changing those fields. We also cannot maintain\
    \ any irrelevant relationships between fields if clients can mutate them, and\
    \ as we have seen in Chapter 5, those objects were all about mutation. Fields\
    \ access is also not polymorphic, so subclasses cannot change their implementation.\
    \ In those days, objects were all about subclassing too.\n\nSo instead of direct\
    \ access in Java, we usually write accessor methods: getters and (if need) setters.\
    \ Setters usually return nothing except the value of a field, but they may compute\
    \ a value from other fields. Setters may maintain invariants or fire events as\
    \ we update a field, or perhaps, more than one.\n\nSometimes, though data is just.\
    \ When it is, then direct access to public fields may be fine, especially when\
    \ they are immutable values (which is to say, fields of immutable types). For\
    \ more complicated models, polymorphic behavior and/or a uniform way of accessing\
    \ values from either field or a calculation become useful, and accessor methods\
    \ come into their own.\n\nThe Kotlin choose to take the decision away from us\
    \ and only support accessor methods. The language doesn't support giving direct\
    \ access to fields. Kotlin will generate code to access fields of Java classes\
    \ but does not define public fields itself. (A special annotation, @JField, provides\
    \ a back door if you really need it.) They did this to encourage us to use accessors\
    \ so we can change representation affecting clients.\n\nTo encourage accessors,\
    \ Kotlin allows us to generate both a private-variable and an accessor in a single\
    \ property declaration.\n\nSo in Java we can access to a field directly:\n\n```\n\
    public class PersonWithPublicFields {\n    public final String givenName;\n  \
    \  public final String lastName;\n    public final LocalDate dateOfBirth;\n```"
