    rather read-only view of a collection. As with the Java unmodifiedList, a read-only
    collection can''t be changed through its interface, but may be changed through
    some other mechanism. Only true immutable collections are guaranteed never to
    change.


    It is possible to have true immutable collections on the JVM, the result of java.util.list.of(...),
    for example, but that is not (yet) a standard Kotlin feature.


    This is the unfortunate consequence of having your mutable collections extend
    your otherwise nonmutable collections; the recipient of a nonmutable collection
    cannot modify it, but know that it won''t change, because a reference of type
    nonmutable list may be pointing to an object of type MutableList.


    The rigorous solution to this problem is to separate mutable from immutable by
    not having a subtype relationship. In this scheme, if we have a mutable list and
