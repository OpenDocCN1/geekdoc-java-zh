  md: "# Replacing Mocks with Maps\n\nBefore we go on, we will convert the tests to\
    \ Kotlin, because it has better support for function types. We could stay in Java,\
    \ but then we would have to work out which of the Java function types (Function,\
    \ BiFunction, etc.) expresses the operations. And we would still have Java.\n\n\
    The automated conversion is quite smooth, but for some reason the converter created\
    \ lambdas rather than using method references in the Recommendations constructor\
    \ that we have to replace by hand, leaving the setup as:\n\n```\nclass RecommendationsTests\
    \ (\n    private val distanceCalculator = mock(DistanceCalculator::class.java)\n\
    \    private val featuredDestinations = mock(FeaturedDestinations::class.java)\n\
    \n    private val recommendations = Recommendations(\n        featuredDestinations::findTo,\n\
    \        distanceCalculator::distanceInMetersBetween\n    )\n```\n\nExample 17.5\
    \ [mocks-to-maps:src/test/java/travelator/recommendations/RecommendationsTests.kt]\n\
    \nWe used Kotlin refitted types to avoid those ::class.java arguments, but we\
    \ are moving away from mocks, not toward them, so we resist.\n\nThe term when\
    \ is a keyword in Kotlin, but the converter is smart enough to quote it where\
    \ we required:\n\n```\nprivate fun givenFeaturedDestinationsFor(\n    location:\
    \ Location,\n    result: list<FeaturedDestination>\n) {\\n    Mockito.when(featuredDestinations.findTo(location))\n\
    \        .thenReturn(result)\n}\n```\n\nExample 17.6 [mocks-to-maps:src/test/java/travelator/recommendations/RecommendationsTests.kt]\n\
    \nTo see how to remove the mocking, it helps to view a function type as a mapping\
    \ between its parameters (as a tuple) and its result. So distanceFinder is a mapping\
    \ between a single Location and a List<FeaturedDestination>, and distanceInMeterBetween\
    \ is a mapping between Pat-Location, Location> and Int. The Map data structure\
    \ is our way of expressing a set of mappings—the name is not accidental. We can\
    \ fake a function by populating a Map with parameter keys and result values, and\
    \ replacing the function call with a lookup of the supplied parameters. You may\
    \ have used this trick to cache the result of expensive calculations. Here, we\
    \ won't cache, seed the Map with parameters and result that we expect to see.\n\
    \n256 | Chapter 17: Mocks to Maps"
