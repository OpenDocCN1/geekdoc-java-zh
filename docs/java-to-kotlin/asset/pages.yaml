  md: 'methods to extensions, and move their definitions close to where they are used.
    Because our class encapsulated a single collection, we were able to eliminate
    the class altogether and replace it with a type alias.


    Immutable collections and extensions allow us to organize our code in ways that
    are not available in Java. We can group all the logic required by a particular
    feature of the application in the same module, regardless of the domain classes
    the logic applies to. However, if we wanted methods of those domain classes to
    be polymorphic methods, we would have to define them on those classes and not
    in our feature module. Chapter 18, Open to Sealed Classes, we look at sealed classes,
    an alternative to object-oriented polymorphism that is more convenient when we
    define type hierarchies in one part of the code and operations on those types
    in another.


    Finally, note that reusing built-in types like List rather than defining a specific
    type is not without cost. We might be storing items in a List as an implementation
    detail rather than a modeling choice. It''s also a lot easier to "Find usages"
    of a specific wrapper class than a generic specialization. Nevertheless, the standard
    collection types are pervasive because they are such good abstractions—so good
    that we generally shouldn''t hide them. Chapter 22, Classes to Functions, looks
    at what happens if we take this idea and run it with.'
