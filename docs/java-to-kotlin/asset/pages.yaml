    \nWe now have the basics of a table parser, and we haven't introduced any new\
    \ types beyond those in the standard Kotlin runtime. This is often the way with\
    \ a more functional approach. The grain of Kotlin is to leverage the rich abstractions\
    \ provided by the standard library, where Java programs are more likely to define\
    \ new types. As we saw in Chapter 6 and Chapter 15, one reason for the difference\
    \ is that Kotlin allows us to treat collections as values, which makes them more\
    \ safely composable than Java's mutable objects. We are able to define an API\
    \ that takes and returns collections without worrying about aliasing.\n\nValue\
    \ types make for APIs of predictable calculations, but we can bring their own\
    \ problems. Our naive API suffers from the same issue as we saw in Chapter 20:\
    \ it works on List<String> loaded into memory and produces a List<Map<String,\
    \ String>> also in memory. Even discounting the cost of data structures, the memory\
    \ footprint of readable is the number of bytes of the input, which is (probably)\
    \ twice the size of a UTF-8 encoded file containing the data. To process large\
    \ files it would be nice to work in terms of sequences rather than terms of lists,\
    \ since if necessary sequences can keep only one item in each stage of a pipeline\
    \ in memory at time.\n\nAs we saw in Chapter 13, we can convert a Sequence to\
