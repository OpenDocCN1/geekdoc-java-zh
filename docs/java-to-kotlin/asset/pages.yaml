  md: '# CHAPTER 5


    # Beans to Values


    Many Java projects have settled on mutable JavaBeans and POJO (plain Java object)
    conventions for representing data. Mutability brings complications, though. Why
    are immutable values a better choice, and how can we reduce the cost of mutability
    in a codebase?


    # Beans


    As we discussed in "Bean Style" on page 5, JavaBeans were introduced to allow
    the development of drag-and-drop GUI builders in the Visual Basic style. A developer
    could drop a button onto a form, change its title and icon, and then wire it in
    an click handler. Behind the scenes, the GUI builder would write code to instantiate
    a button and call setters for the properties that the developer had changed.


    To define a JavaBean, a class needs a default (no-argument) constructor, getters
    for its properties, and setters for its mutable. (We''ll gloss over the Serializable
    requirement, although even Sun never took this seriously.) This makes sense for
    objects that have a lot of properties. GUI components typically have foreground
    and background colors, font, label, borders, size, alignments, paddings, and so
    on. Mostly the defaults for these properties are fine, so calling setters for
    the special values minimizes the amount of code to be generated. Even today, a
    mutable model is a solid choice for GUI toolkits.


    When JavaBeans were introduced, though thought most objects as mutable, not just
    UI components. I mean, why not? The point of objects was to encapsulate properties
    and manage the relationships between them. They were designed to solve problems
    like updating the width of a component when its bounds are changed, or the total
    of a shopping cart item as items are added. Objects were the solution to the problem
    of managing mutable state. Java was quite radical at the time in having an immutable
    String class (although it couldn''t help itself and still plumped for a mutable
    Date).


