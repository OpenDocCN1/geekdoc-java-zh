    # Functional Encapsulation


    Having seen how an OO programmer solves the problem of encapsulating pesky details
    so clients don''t have to supply them at the point of use, how would a functional
    programmer approach the same problem?


    Remember that we''re trying to get to a function with this signature:


    ```

    fun send(email: Email) {

    ...

    }

    ```


    But we actually need all this information to send the message:


    ```

    fun sendEmail(

    email: Email,

    serverAddress: InetAddress,

    username: String,

    password: String

    )

    {}

    ```


    In functional terms, this is an example of partial application: fixing the arguments
    to a function with fewer arguments. Although some languages provide built-in support
    for this, in Kotlin the easiest approach is to write a function to partially apply
    our configuration.


    What if we have a function that takes the configuration and returns a function
    that knows how to send an email:


    ```

    fun createEmailSender(

    serverAddress: InetAddress,

    username: String,

    password: String

    :(Email) -> Unit {

    ...

    }

    ```


