- img_proc: true
  md: 'Late in a project and against schedule pressure is no time to learn how to
    refactor your code. Instead, we take every opportunity to practice refactoring.
    As we saw in Chapter 22, Classes to Functions, even when writing code from scratch
    we often hard-code values to get a test to pass and then refactor to remove duplication
    between the tests and production code. We are always looking for ways to get testing
    quickly and then refactor our way into code that looks like we planned it. Sometimes
    we discover a new automated refactoring built into IntelliJ; other times, we find
    a way to combine existing refactorings to achieve our aims.


    When the scope of a change is small, we can get away with hand-editing a definition
    and its uses to match, or sometimes, the other way around. This becomes tedious
    and prone when a change affects many files though, so using the tools to achieve
    even small changes will equip us when faced with larger refactoring challenges.
    Where we do have a multistage refactor, or where we have to manually apply changes
    in multiple places, page 44 allows us to keep the system building and working
    throughout the process. This is vital when a change may take many days or even
    weeks, because it allows us to continually merge our work with other changes in
    the system. Once you''ve thrown away a month of work because a big-bang merge
    at the end proved impossible, you come to appreciate the value of this technique
    and practice it even when it isn''t strictly necessary.


    We hope that the refactorings in this book expand your ambition. Your authors
    have been lucky enough to work with some world-class practitioners, the sort of
    people who tut if you cause a compile error during a refactoring. The transformations
    we have shown may not be optimal (and even if they were, the state of the art
    will change with tooling and language changes), but they are genuine, and they
    do reflect how we write and refactor code.


    # Refactoring and Functional Thinking


    As we have seen on our tour, this is a relationship between functional thinking
    and refactoring. Refactoring is a rearrangement of our code, and that code represents
    actions (“Actions” on page 79)—that depends on when you run the rearrangement
    change when actions run, and so the functionality of the software. In contrast,
    calculations (“Calculations” on page 78) are rearrangement but are ultimately
    impot. (Without reading and writing, our code is simply generating.) Functional
    thinking encourages us to recognize and control actions, and by doing so, makes
    refactoring much safer.


    Your authors learned this hard way. We learned to refactor in the days of mutable
    objects, and introduced bugs when we failed to predict the consequences. This
    could have led us to abandoning refactoring, but we were never clever enough to
    design our systems right in the first place. Instead, we discovered a certain
    style of'
  merge: -1
  pgno: 409
- img_proc: true
  md: 'programming—object orientation with immutable objects—was expressive and understandable,
    refactorable and safe. When we adopted style in our Java code, it was often working
    against the grain, but despite this, it was much more productive than the alternatives.
    Discovering Kotlin, we realized that this is the sweet spot for us. Now we can
    use a modern language where functional thinking is part of the design, objects
    are still well-supported, and refactoring tooling is not an afterthought.


    As Kent Beck put it: “Make the change easy, then make the easy change.” Continually
    refactor so that every change you need to make is an easy change. Refactoring
    is the fundamental practice for tackling the inherent complexity of our software.


    Safe travels.'
