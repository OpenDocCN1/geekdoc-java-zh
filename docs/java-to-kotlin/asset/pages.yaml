  md: 'Compared to polymorphic methods, sealed classes and when expressions make it
    easy to add new operations that apply to a fixed type hierarchy, although we still
    have to change all those operations if we add a new type to that hierarchy. At
    this point the compiler will help us by checking that all those operations cover
    all possible types in the hierarchy.


    # Polymorphism or Sealed Classes?


    Some languages have mechanisms that let us vary types and operations without identifying
    existing code. Haskell has type classes, Scala has implicit parameters, Rust has
    traits, Swift has protocols, and Clojure and Common Lisp have polymorphic functions
    that dispatch on the classes of multiple arguments.


    Kotlin doesn''t have any equivalent. When we''re designing in Kotlin, we have
    to choose between object-oriented polymorphism or sealed classes based on the
    design—types or operations we expect to vary most frequently as the program evolves.
    Object-oriented polymorphism is preferable when the set of data types varies more
    frequently than the set of operations on those data types, and sealed class when
    the set of operations varies more frequently than the set of data types they apply
    to.


    ![](img/2cfc593bb874a4b3e87c679863832738_290_0.png)


    # Only Typecast Down a Sealed Class Hierarchy


    Only use typecast to cast to the root of a sealed class hierarchy to one of the
    children in an exhaustive when expression. Otherwise, it is risky to cast away
    from the static type. The actual class used to implement a value may have operations
    that violate the constraints expressed by its static type.


    For example, as we saw in Chapter 6, the static type List prevents mutation, but
    Kotlin''s higher-order functions return lists that can be mutated if you downcast
    from List to MutableList. A function is likely to introduce bugs in code, because
    it violates the expectations of its callers. It could introduce errors that are
    very hard to find, because the possibility of spooky action at distance is not
    explicit in the type declarations of the function''s signature. A future version
    of the Kotlin standard library returned immutable lists from its higher-order
    functions, the function would continue to compile successfully but crash at runtime.


    Just because you can cast from a super type to a subtype doesn''t mean you are
    intended to. The possibility is likely to be a mere implementation detail. A sealed
    class hierarchy signals that casting is intended, supported, and made safe by
    the compiler''s exhaustiveness checks.'
