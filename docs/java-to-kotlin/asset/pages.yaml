  md: "All operations (bar accessing the journeys) are now extensions, albeit in the\
    \ same file. But now that they are extensions, we can move them from this file\
    \ to others, even in different modules, to better decouple our dependencies.\n\
    \n# Substitute a Type Alias\n\nNow that we've achieved our goal of decoupling\
    \ the Route functionality from the class, is that class superfluous? Actually,\
    \ wrapping the List is worse than superfluous; it prevents us from easily using\
    \ all the useful extension in Kotlin's standard library to construct, transform,\
    \ and process routes. To quote one of Alan Perlis's epitograms of Programming:\
    \ \"It is better to have 100 functions operate on one data structure than 10 data\
    \ structures.\" We don't want a Route to have a List of Journey; we want it a\
    \ List of Journey. This is very easy to access in Kotlin with delegation:\n\n\
    ```\nclass Route(\n    val journeys: List<Journey>\n): List<Journey> by journeys\n\
    \n// Example 15.13 [encapsulated-collections.6:src/main/java/traveler/itinerary/Route.kt]\n\
    ```\n\nIn fact, we want more than for a Route to be a List of Journey; we want\
    \ a List of Journey to be a Route. To see why, let's look at what JourneyAt function\
    \ that weed over earlier.\n\nWhen a traveler decides that they would not travel\
    \ by camel, we can't replace a Journey, because Route is immutable. Instead, we\
    \ return a new Route where journeys is a copy of the relevant Journey replaced:\n\
    \n```\n@Test\nfun replaceJourney() {\n    val journey1 = Journey(waterloo, aton,\
    \ startTime(), startTime(), RAIL)\n    val journey2 = Journey(alton, alsford,\
    \ startTime(), startTime(), CAMEL)\n    val journey3 = Journey(alford, winchester,\
    \ startTime(), startTime(), BUS)\n    val route = Route(list(journey1, journey2,\
    \ journey3))\n\n    val replacement = Journey(alton, alsford, startTime(), startTime(),\
    \ RAIL)\n    val replaced = route.withJourneyAt(1, replacement)\n\n    assertEquals(journey1,\
    \ replaced.get(0))\n    assertEquals(replacement, replaced.get(1))\n    assertEquals(journey3,\
    \ replaced.get(2))\n}\n// Example 15.14 [encapsulated-collections.5:src/test/java/traveler/itinerary/RouteTests.kt]\n\
    ```\n\n(In passing, note that this test was made complicated by only having to\
    \ access the components of a route. We can fix that now we can access the journeys\
    \ directly.)\n\n216 | Chapter 15: Encapsulated Collections by Type Aliases"
