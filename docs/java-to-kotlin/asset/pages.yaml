  md: "# # Refactoring for Readability\n\nRefactoring for readability is often this\
    \ way. We might extract a function to make something more readable in context,\
    \ but when the context changes, the function extracted makes things worse. Time\
    \ is also a context. Sometimes something that we felt quite expressive when we\
    \ wrote it out to be less so when we read it later, or could now be improved because\
    \ we have internalized new idioms.\n\n# ## Efficient Writing\n\nWe're quite pleased\
    \ with this refactor. It has simplified our tests and the production code, and\
    \ we have moved from mixing I/O and logic to a simpler calculation with no side\
    \ effects.\n\nFor a while, all is in production too, but with the easing of COVID-19\
    \ travel restrictions, Travelor became the roaring success that we all knew it\
    \ would be. Eventually, the lovely people in market complaining that the report\
    \ generation is failing with an `OutOfMemoryError`. Could we look into it?\n\n\
    (Apart from running out of memory, we have two other issues with errors in this\
    \ code in living memory. Both times, the input file turned out to have been malformed,\
    \ but market sit next door and just call over to help if these occur. We feed\
    \ us in these cases, so we're so incentivized to do a better job of error handling\
    \ for now (but see Chapter 21). If we can fix the OutOfMemoryError quickly, we\
    \ think we saw some crumbles...)\n\nWe haven't bothered you with the details so\
    \ far, but there is a main method that invokes our report. It is designed to be\
    \ invoked with shell redirection, reading from a file as the standard input and\
    \ writing to a file collected from the standard output. Thus, our process doesn't\
    \ have to read filenames from the command line:\n\n```\nfun main() {\n    InputStreamReader(System.`in`).use\
    \ { reader ->\n        OutputStreamWriter(System.out).use { writer ->\n      \
    \      generate(reader, writer)\n        }\n    }\n}\n```\n\nExample 20.17 [io-to-data:src/main/java/travelor/HighValueCustomersMain.kt]\n\
    \nWhen we refactored generic to generate with Lists rather than a Reader and Writer,\
    \ IntelliJ automatically updated main to yield:\n\n```\nfun main() {\n    System.`in`.reader.use\
