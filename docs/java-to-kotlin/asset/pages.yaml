  md: "# Faking in Kotlin\n\nThere will be times, even in Kotlin, when we want to\
    \ implement some of an interface's methods for testing. On the JVM, we can combine\
    \ dynamic proxies with anonymous objects, delegation, and selective ordering over\
    \ time to write the:\n\n```\ninline fun <reified T> fake(): T =\n    Proxy.newProxyInstance(\n\
    \        T::class.java.classloader,\n        arrayOf(T::class.java)\n    ) {\n\
    \        TODO(\"not implemented\")\n    } as T\n```\n\n```\nval sentEmails = mutableListOf<Email>()\n\
    val testCollaborator: EmailSystem =\n    object : EmailSystem by fake() {\n  \
    \      override fun send(email: Email) {\n            sentEmails.add(email)\n\
    \        }\n    }\n```\n\n# Have We Really Weaned Off Mocks?\n\nAh, now that is\
    \ a good question!\n\nIn some ways, we have just implemented a poor imitation\
    \ of a mocking framework; we have no parameter matches, no way of failing if a\
    \ method is not called, and no way of expressing execution order.\n\nLooked another\
    \ way though, we have implemented the recommendation engine's dependencies as\
    \ two maps. Recommendations.recommendationsFor is beginning to look like a simple\
    \ calculation (\"Calculations\" on page 78). The result of calculation depends\
    \ on the journey parameter and on the contents of those maps that enable us to\
    \ look up featured destinations and distances. We know in reality when we call\
    \ recommendationsFor does matter; it is actually an action (\"Actions\" on page\
    \ 79). The distance between locations will not change over time, but which distances\
    \ we find a location as we add or remove from whatever database they are held.\
    \ In our tests, though, the distinction is moot, and we could treat recommendationsFor\
    \ as a calculation in much the same way as we saw with InMemoryTrips in Chapter\
    \ 7. Calculations are easier to test than actions—we just check that a given input\
    \ returns a given output—so let's pull on this thread."
