  md: 'onders to reduce coupling between disparate concerns in our codebases, but
    they are no substitute for polymorphic methods when that is what we need.


    In the end, one of the attractions of programming is its combination of the human
    and the mathematical. Objects and classes are, to your authors at least, a more
    human way of modeling the world, that is often a fine starting point. When we
    need rigor (which is often, but not as often as mugs might think), functional
    programming is for us. We see no reason to have one camp or the other when we
    can have two tents and move between them both, and Kotlin allows us to do that
    better than any other language we have found.


    # Simple Design


    If complexity is the limiting factor in our software, and functional thinking
    is a tool for reducing complexity, how does it fit with other maxims—in particular,
    Kent''s Rules of Simple Design (Extreme Programming Explained: Embrace Change)?
    These have served us well for decades, and say that a simple design:


    +   * Passes the tests

    * Reveals intention

    * Has no duplication

    * Has fewest intention


    Of these, “reveals intention” is the most open to interpretation, so let''s pull
    on that thread.


    An intention is “an aim or plan”; it implies change. It implies action. By differentiating
    between actions and calculations in our code, we show where we expect things to
    happen and where we don''t; which things may be affected by other things and which
    things won''t. When the majority of our code is in the form of calculations, we
    can be explicit about which functions are actions, better revealing our intent.


    As we saw in Chapter 7, Actions to Calculations, and Chapter 20, Performing I/O
    to Passing Data, our main technique to disentangle calculations from actions is
    moving the actions out to the entry points of our interactions, so they contaminate
    the least code. This is neither easy nor panacea, but we find that it does produce
    designs that are simpler and code that is less complex.'
