  md: '# Setting a global flag


    One problem with returning special special values is that they make it hard to
    signal which of several possible errors occurred. To solve this we can combine
    the special value with a global variable. When the special value is detected,
    the caller can read errno, for example, to establish what the problem was.


    This technique was popular in C but was largely superseded by exception-based
    error handling.


    # Returning a status code


    Another technique from the days before exceptions is returning a status code.
    This is possible when a function either returns no value (it is entirely side
    effect) or returns a value in another way, often by mutating a parameter passed
    by reference.


    # Invoking a special function


    Invoking a special function when an error occurs is sometimes a good strategy.
    Usually the error function is passed as a parameter to the invoked function. If
    a problem is detected, the error function is invoked with a value representing
    the error as a parameter. Sometimes the error function can signal by its return
    value if the failed operation should be retried or aborted. Another technique
    is for the error function to provide the value that should be returned by the
    invoked function.


    This technique is an example of the strategy pattern applied to error handling.
    Even when exceptions are available, it is a useful tool in niche situations.


    # Error Handling with Exceptions


    All techniques suffer from the drawback that the calling code is able, to be a
    greater or lesser extent, ignore that an error occurred.


    Exceptions solve this problem. The operation automatically aborts on error, and
    the caller explicitly handles the exception. If the caller does not handle it,
    the exception propagates further down the call stack until something does, and
    if nothing handles the exception, the thread terminates.


    # Java and Checked Exceptions


    Exceptions were relatively new when Java was released, and the language designers
    decided to innovate in this area. They made the exceptions that a method could
