  md: "At the moment, when we call recommendationsFor in tests matters too, because\
    \ the result will depend on the contents of the featuredDestinations and distanceInMeters\
    \ Between maps. These are initially empty, and are populated by calls to giveFeaturedDestinationsFor\
    \ and givenDistance.That's a sensitivity issue right there. What we need is to\
    \ convert an action to a calculation, and we can do that by manipulating scope.\n\
    \nIn Chapter 16, we can see that we can view methods as functions with some of\
    \ their arguments partly by capturing them as fields. In tests, we can reverse\
    \ this process. We can write a function that creates the object from its dependencies\
    \ once for each invocation. If we called the object subject of the tests, we can\
    \ create it from the state like this:\n\n```\nprivate fun subjectFor(\n    featuredDestinations:\
    \ Map<Location, List<FeaturedDestination>>,\n    distances: Map<Pair<Location,\
    \ Location>, Int>\n): Recommendations {\n    val destinationsLookup = featuredDestinations.withDefault(emptyList())\n\
    \    val distanceLookup = distances.withDefault(-1)\n    return Recommendations(destLookup::getValue,\
    \ distanceLookup::getValue)\n}\n```\n\nExample 17.16 [mocks-to-maps.5/src/test/java/travelor/recommendations/RecommendationsTests.kt]\n\
    \nHere we create a new instance of Recommendations every call so that we capture\
    \ immutable maps representing the state of the system.\n\nNow we can create a\
    \ resultfunction that uses subjectFor:\n\n```\nprivate fun resultFor(\n    featuredDestinations:\
    \ Map<Location, List<FeaturedDestination>>,\n    distances: Map<Pair<Location,\
    \ Location>, Int>,\n    locations: List<Location>\n): List<FeaturedDestinationSuggestion>\
    \ {\n    val subject = subjectFor(featuredDestinations, distances)\n    return\
    \ subject.recommendationsFor(locations)\n}\n```\n\nExample 17.18 [mocks-to-maps.5/src/test/travelor/recommendations/RecommendationsTests.kt]\n\
    \nOutside the scope of the resultfunction, there is no sensitivity issue, so it\
    \ is effectively calling.\n\nNow that we have a simple mapping of input to output\
    \ (resultFor), we can write tests that each test can just specify the input parameters\
    \ and check that the result is as we expect, with no need for state in the test\
    \ all.\nEvery test can then be of the:\n\n```\nprivate fun check(\n    featuredDestinations:\
    \ Map<Location, List<FeaturedDestination>>,\n    distances: Map<Pair<Location,\
    \ Location>, Int>\n)\n```\n\nHave We Really Weaned Off Mocks, Though? | 261"
