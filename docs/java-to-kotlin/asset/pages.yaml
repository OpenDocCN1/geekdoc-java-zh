    \ example of a Sequence that cannot be consumed more than once is backed by reading\
    \ from an external resource, such as a file or network socket. In such cases we\
    \ can in general just go back and replay input to iterate again.\n\nUnfortunately,\
    \ the difference between the two types of Sequence is not reflected in the type\
