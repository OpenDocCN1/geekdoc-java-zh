  md: '# Conventions for Denoting Values


    The static of functions on the companion object, used to denote Money values,
    also break Kotlin conventions.


    Java syntax distinguishes between instantiating a class with the new operator
    and obtaining an object as the result of a method call. A Modern Java convention
    is that stateful objects, for which identity is significant, are constructed with
    the new operator, and values are denoted by static functions. For example, the
    expression new ArrayList<>() constructs a new mutable list distinct from any other
    mutable list, while the expression List.of("a", "b", "c") denotes an immutable
    list value.


    Kotlin does not draw a distinction between constructing objects and calling functions:
    the syntax for instantiating a class is the same as for calling a function. There
    are some coding conventions to distinguish between constructing a new stateful
    object that has distinct identity and denoting values that it does.


    Although the Kotlin code for calling a function and instantiating a class look
    the same, they are implemented by JVM bytecode. Source-compatible change between
    calling constructor and a function will not be binary compatible.


    ![](img/2cfc593bb874a4b3e87c679863832738_186_0.png)


    Where a class needs multiple factory functions, as does our Money class, they
    are all defined as top-level functions, not on the companion object of the class.
    IntelliJ does its to nudge one toward this style: it is much better for autosuggesting
    top-level functions than methods on a companion object.


    So, it would be more conventional if we created Money instances with expressions
    like Money(...) or, alternatively, money(...), rather than Money.(..).


    As we saw in Chapter 3, Money has a private constructor (and isn''t a data class)
    to preserve the relationship between its currency and the precision of its amount.
    So like the easiest option would be to define top-level moneyOf functions in the
    same source file as the Money class. However, those money functions would have
    to call the Money class''s constructor. They can''t call it if it is still declared
    as private, but could we change the constructor to internal.


    Internal visibility would make the constructor visible to any Kotlin code in the
    same compilation unit (Gradle subproject or IntelliJ module) but prevent it from
    being called by Kotlin code in other compilation units. The compilation unit,
    rather than the class, would be responsible for guaranteeing the invariants of
    the Money class by never calling its constructor appropriately. That would be
    safe enough if it wasn''t for those Java parts of our system that we continue
    to maintain during our system''s transition to Kotlin.'
