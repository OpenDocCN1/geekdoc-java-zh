    # Moving On


    The absence or presence of information is inescapable in our code. By raising
    it to first-class status, Kotlin makes sure that we take account of absence when
    we have to and are not overwhelmed by it when we don''t. In comparison, Java''s
    Optional type feels clumsy. Luckily, we can easily migrate from Optional to nullable
    and support simultaneously when we are not ready to convert all our code to Kotlin.


    In Chapter 10, Functions to Extension Functions, we''ll see how nullable types
    combine with other Kotlin language features—the safe call and Elvis operators,
    and extension functions—to form a grain that results in designs quite different
    from those we write in Java.


    But that''s getting ahead of ourselves. In the next chapter, we''ll look at a
    typical Java class and translate it into a typical Kotlin class. Translation from
    Java to Kotlin is more syntactic: the two languages differ in their acceptance
    of mutable state.'
