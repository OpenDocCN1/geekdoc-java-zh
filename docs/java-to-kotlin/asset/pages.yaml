    # Kotlin Top-Level Functions, Objects, and Companions


    Kotlin allows functions (and properties and constants) to be declared outside
    of classes. In this case, the JVM has nowhere else for them to go, the compiler
    generates a class with static methods for these top-level declarations. By default,
    it derives the name of the class from the name of the file defining the functions.
    For example, functions defined in `top-level.kt` are up as static methods on a
    class called `Top_levelkt`. If we know the name of the class, we can reference
    it from Java by either static importing `Top_levelkt` or directly invoking `Top_levelkt.foo()`.
    If we don''t know the ugl of `Top_levelkt`, we can explicitly name the generated
    class by adding an annotation, `@file:name`, to the top of the file, as we''ll
    see later in this chapter.


    As well as these top-level functions, Kotlin allows us to define properties and
    functions scoped, like Java stats, to a class rather than an instance. Instead
    of marking these as static, Kotlin borrows from Scala and collects them into object
    declarations. This type of object declaration (as opposed to the object expression
    that creates anonymous types) defines a singleton with only one instance that
    provides a global point of access to that instance. All members of an object will
    be compiled to members of a class with the name of the object. They won''t be
    static methods unless specifically marked with `@Jvmstatic`, though. This is because
    Kotlin allows these objects to extend classes and implement interfaces, and that
    is incompatible with static declarations.


    When we need to group static and instance members in the same class, we can declare
    the static parts in a `companion` object inside the (otherwise static) class.
    We group them in the file, and code in a companion object can access private state
    in its containing class. Companion objects can also extend another class and implement
    interfaces—something Java stats cannot do. Compared to Java stats, companion objects
    are cumbersome if we just want to define one or two static methods.


    In Kotlin, then, we can write non-instance-scoped functions as either top-level
    functions or methods on a singleton object, and this object may be a companion
    object or not scoped to a type.


    Of these, all things being equal, we should default to top-level functions. They
    are the simplest to declare and reference, and can be moved from file to file
    without affecting Kotlin client (but see the "Moving Top-Level Functions on page
    104”). We reserve declarations as methods on a singleton object instead of top-level
    functions when we need the ability to implement an interface, or otherwise group
    functions more tightly. We use a companion object when we need'
