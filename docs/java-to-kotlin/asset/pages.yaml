  md: '# Moving On


    Defining our calculations as single-expression functions lets us communicate that
    they are different from side-effecting actions. Trying to express functions as
    a simple single expression is a useful discipline that can to well-factored, clean
    code. To achieve single-expression form, we usually have to factor out subexpressions
    into their own functions.


    Single-expression form is declarative: the expression describes the function''s
    result in terms of its parameters rather than the actions the computer must perform
    to compute the result. Factoring subexpressions into their own functions prompts
    us to think about what those subexpressions should be denoting, and so guides
    us to write clearer code. For example, String.splitAroundLast(''@'') better described
    what we wanted to calculate than emailAddress(value: String, index: Int).


    At a deeper level, this chapter is about more than single expressions; it''s about
    how we can rearrange our code without changing its behavior. Many different arrangements
    of statements and expressions will have the same behavior; refactoring is the
