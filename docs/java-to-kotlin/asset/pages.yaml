  md: '# CHAPTER 4

    Optional to Nullable


    Tony Hoare may consider the invention of null references his billion dollar mistake,¹
    we still need to represent the absence of things in our software systems. How
    can we use Kotlin to embrace null while still having safe software?


    # Representing Absence


    Perhaps Kotlin’s most attractive feature for Java programmers is its representation
    of nullability in the type system. This is another area where the grains of Java
    and Kotlin are different.


    Prior to Java 8, Java relied on convention, documentation, and intuition to distinguish
    references that could be or not be null. We can deduce that methods return an
    item from a collection must be able to return null, but can address be null, or
    do we use an empty string when there is no information?


    Over the years, your authors and colleagues settled into a convention where Java
    references are assumed to be nonnull unless flagged. So we might mean a field
    is null, or a method returns null. Within a codebase, this works well enough (if
    it is a little verbose, and requires eternal vigilance to avoid the scourge of
    NullPointerException)


    Some codebases opted for @Nullable and @NotNull annotations introduced, often
    supported by tools that would check for correctness. Java 8, released in 2014,
    enhanced support for annotations to the tools like the Checker Framework could
    statically check much more than just null safety. More crucially, though, Java
    8 also introduced a standard optional type.


    > ¹“Null References: The Billion Dollar Mistake” on YouTube.'
