    \ the Optional-returning findLongestLegOver.\n\n# Expand-and-Contract Refactoring\n\
    \nWe will use this technique (also known as parallel change) for managing changes\
    \ interfaces (with a lowercase i) throughout this book. It's a simple concept:\
    \ add the new interface, migrate uses of the old interface to the new one, and\
    \ when there are none uses of the old, delete it.\n\nIn this book we will often\
    \ combine refactoring with a conversion to Kotlin. Usually, as in this chapter,\
    \ we will convert the definition and implementation(s) of the interface to Kotlin,\
    \ then add the new interface to it. As we convert clients to use the new interface,\
    \ we take the opportunity to convert them to Kotlin as well.\n\nAlthough we migrate\
    \ between interfaces and convert between languages as part of this process, we\
    \ try not to do both at once. Like climbers keeping three points of contact with\
    \ the rock, don't let go with both hands at once! Make one move, make the tests\
    \ pass, then go on the next. If the change feels risky, now might be a good time\
    \ to stay in protection (run the pre-commit test suite, check-in, even deploy\
    \ a canary release) so that we don't fall too far things go wrong.\n\nAnd finish\
    \ the job. We refactor to make code better, which always means simpler, and simply\
    \ rarely correlates with larger. We allow code to get worse (with two ways of\
    \ doing the same thing) before it gets better (with everyone using the new interface),\
    \ but don't get stuck maintaining both versions. If we end up supporting two versions\
    \ of an interface for an extended period, they might diverge, or both need testing\
    \ to ensure that they don't, and the old version may gain new clients. We could\
    \ mark code as deprecated, but it's better to get on and finish the job. That\
    \ said, small small to support legacy code be allowed to live; we love Kotlin,\
    \ but we want to spend our time adding value rather than converting Java that\
    \ otherwise requires attention.\n\n# Refactoring to Idiomatic Kotlin\n\nNow all\
