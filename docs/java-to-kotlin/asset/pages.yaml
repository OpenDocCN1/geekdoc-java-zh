  md: 'we program in an environment in which every function can write to the database,
    we lose the ability to predict when such writes can occur and plan accordingly.


    So functional programmers take complexity by reducing mutation. Sometimes programmers
    in languages (like Cloure or Haskell) enforce controls on mutation. Otherwise,
    they work by convention. If we adopt these conventions in more general languages,
    we gain more ability to reason with our code. Kotlin chooses not to enforce the
    control of effects, but the language and its runtime come with built-in conventions
    to nudge us in the right direction. Compared to Java, we have, for example, an
    immutable `final` modifier, read-only views of collections and concise data classes
    to encourage copy-on-write rather than mutation. Many of this book''s chapters
    describe more subtle conventions with the same aim: [Chapter 5, Beans to Values,
    Chapter 6, Java to Kotlin Collections, Chapter 7, Actions to Calculations, Chapter
    14, Accumulating Objects to Transformations, and Chapter 20, Performing I/O to
    Passing Data.]


    There is


    If you research functional techniques, you will come across a lot of anti-object
    sentiment. This is all about mutable objects, but we shouldn''t throw the message-passing
    baby out with the mutable bathwater. Although we can use OO to manage shared mutable
    state, in practice, we generally use objects to encapsulate immutable state, or
    to represent services and their dependencies. We see in Chapter 16, Interfaces
    to Functions, that we can use both functions with closure, and classes with properties,
    to encapsulate data. Both can also hide code details and allow a client to work
    with different implementations. We need these points of inflection to build flexible,
    robust, and testable systems. Where in Java we traditionally reach for subclassing
    as a tool, Kotlin with its default classes encourages a more compositional style.
    Instead of overriding a protected method, we have a function-typed property representing
    a strategy or a collaborator. We should favor this style but not be embarrassed
    to define class and subclass hierarchies where they simplify our implementation.
    Similarly, extension functions in Chapter 10, Functions to Extension Functions,
    are all very well, and they can work


