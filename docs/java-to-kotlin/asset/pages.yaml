    \ CustomerData): Customer {\n        ...\n    }\n    fun find(id: String): Customer?\
    \ {\n        ...\n    }\n}\n```\n\nBoth save and find are actions; save creates\
    \ a new customer record in our database and returns it. This is an action because\
    \ the state of our database depends on when we call it. The result of find is\
