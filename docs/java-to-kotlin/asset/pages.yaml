  md: 'This strategy doesn''t stop us from creating mutable collections and populating
    them within a function, code should only change a collection that it has just
    created. As soon as we return a reference as a result, we should treat it as immutable—create,
    don''t mutate. We might occasionally enforce this immutability by wrapping with
    Collections.unmodifiableList() etc., but in an aligned development this is unnecessary,
    because no one would treat a shared collection as mutable.


    There will of course be exceptions to the rule, places where, usually for reasons
    of efficiency, we want to share a collection as a mutable collection. In these
    cases we get dispensation by naming `accumulator` (a good start) and by limiting
    the scope of the sharing as much as possible. Within a function is ideal, between
    private methods in a class module boundaries are rarely so. Chapter 14 discusses
    ways to avoid (visibly) mutable collections in these situations.


    Project teams that adopt this convention can produce stable and reliable software
    in spite of collections'' problems. On the whole, the benefits of treating collections
    as immutable outweigh the problems of a system that is lying to you, because values
    are so valuable. The JVM''s libraries may have back to the days when mutability
    was the norm, but this is a case where the grain of Java is shifting to the immutable,
    and it''s better to be ahead of this change behind it.


    # Kotlin Collections


    In contrast to Java, Kotlin and its standard library were designed in an age when
    mutability had fallen out of fashion. However, smooth interoperation with Java
    was a key goal, and Java has mutable collections. Scala had introducing its own
    sophisticated persistent (immutable but data-sharing) collections, but this forced
    developers to copy information between collections on the import boundary, which
    was both inefficient and annoying. How could Kotlin square the circle and have
    immutable collections operate seamlessly with Java?


    The Kotlin developers removed the mutation methods from the Java interfaces and
    published them in the kotlin.collections package as Collection<E>, List<E>, and
    so on. These were extended by MutableCollection<E>, MutableList<E>, etc., which
    add back in the Java mutation methods. In Kotlin we have MutableList, which is
    a subtype of List, which is a subtype of Collection..


    On the face of it, this is a simple scheme. Mutable collections have the same
    operations as collections that are not mutable, plus the mutation methods. It
    is safe to pass a MutableList as an argument to code that expects a List, because
    all the List methods will be present and be invoked. In terms of the Liskov Substitution
    Principle, we can substitute a MutableList for a List without affecting our program
    correctness.'
