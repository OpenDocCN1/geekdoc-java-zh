  md: '# CHAPTER 19


    # Throwing to Returning


    Java uses checked and unchecked exceptions to represent and handle errors. Kotlin
    supports exceptions, but doesn''t build checked exceptions into the language in
    the same way. Why did Kotlin reject Java''s approach, and what should we use instead?


    You don''t have program computers for long to discover that things go wrong...
    in so many ways.


    Early in their careers, your authors tended to gloss over errors. We often still
    do, at least in a project. As the system grows, though, we learn how failures
    affect the application and start to add code to cope—at first pieal, later with
    some strategy informed by experience. In this respect our error handling evolves
    in the same way as other aspects of our software design. Sometimes we design front,
    making use of experience of similar systems; other times we allow the writing
    of the software to teach us what it needs.


    In the absence of a more deliberate strategy, most systems default to raising
    exceptions when something goes wrong, and catching and logging those exceptions
    at some outer layer. Command-line utilities will just exit in this case, hopefully
    having enough information for the user to correct the problem and try again. A
    server app, or a GUI with an event loop, will usually abort the current interaction
    and get on with the next.


    Often this is just a poor experience for our users, but sometimes the error will
    corrupt the persistent state of the system, correcting the initial problem and
    retrying does not work. This is the source of the safe advice to "turn it off
    and on again." Our systems mainly start in a safe state, so that after a restart
    a retry should succeed. If not, well, you''ve probably been in a situation where
    the only solution has been to reinstall the operating system—the ultimate way
    of removing corrupted persistent state.'
