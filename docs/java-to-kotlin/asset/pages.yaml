  md: "# CHAPTER 13\n\n# Streams to Iterables to Sequences\n\nJava and Kotlin both\
    \ allow us to transform and reduce collections. They have different design goals\
    \ and implementations, though. What does Kotlin use instead of Java streams, when\
    \ should we convert, and how?\n\n# Java Streams\n\nJava 8 introduced streams in\
    \ 2014, making good use of the new lambdas. Say we want to work out the average\
    \ length of some strings, except that blank strings (those with only whitespace\
    \ characters) should be treated as if they are empty. Previously we wrote:\n\n\
    ```\npublic static double averageNonBlanklength(List<String> strings) {\n    var\
    \ sum = 0;\n    for (var s : strings) {\n        if (!s.isBlank()) {\n       \
    \     sum += s.length();\n        }\n    }\n    return sum / (double) strings.size();\n\
    }\n```\n\nWith Java streams, we can express this algorithm as filter, map, and\
    \ reduce by first converting the List to a Stream and applying transformations:\n\
    \n```\npublic static double averageNonBlanklength(List<String> strings) {\n  \
    \  return strings\n        .stream()\n        .filter(s -> !s.isBlank())\n   \
    \     .mapToInt(String::length)\n        .sum()\n    / (double) strings.size();\n\
    }\n```"
