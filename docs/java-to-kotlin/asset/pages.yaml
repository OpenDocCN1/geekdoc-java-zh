    \ method with the respect operator. Any of our Kotlin code that had calling .add\
    \ method before we turned into an operator will be left calling .plus instead\
    \ of using the + operator. IntelliJ can automatically refactor each of those calls\
    \ from a method to an operator, but we would have to go through them one by one,\
    \ invoking the refactoring individually.\n\nTo address this problem, we can use\
    \ a sequence of refactoring steps to switch all our Kotlin code over to use the\
    \ + operator once, and leave in the capability to replay the steps as we convert\
    \ Java classes to Kotlin. Let's re-verify our change and take another run at the\
    \ conversion.\n\nThis time, we will extract the entire body of the add method\
