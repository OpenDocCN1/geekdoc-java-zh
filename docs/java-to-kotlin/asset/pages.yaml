  md: 'Hard work and error-prone. Wasn''t computers supposed to free us from tasks
    like these, taking on the drudge work, so that we can focus on the fun creative
    stuff? Yes they were, so we will focus on error handling through the lens of how
    our programming language makes things safer and easier for programmers.


    # Error Handling Before Exceptions


    Most error handling these days is based on exceptions, but other techniques have
    been used and are still applicable in some circumstances. We''ll look at the pros
    and cons of those techniques first. The cons will show us why exceptions now dominate;
    the pros may give us options when exceptions aren''t appropriate.


    Ignoring errors

    We can ignore errors. Either the failing routine does nothing to bring them to
    the attention of the caller, or the caller doesn''t bother to check.


    This may lead to corruption of persistent data and silent failure to do the job,
    so in most cases we need to aid higher.


    Just crashing

    Some programs exit when an error is detected.


    Combined with a supervisor to restart on error and careful coding to prevent corruption
    of persistent state, this is a battle-tested strategy that may be appropriate.
    Throwing an exception to abort an operation is the application of this technique
    to a procedure rather than to a whole program.


    Returning a special value

    Returning a special value to signify an error can be a useful technique. For example,
    a function can return -1 instead of an index when an item is not found in a list.


    This technique cannot be used when all return values are valid results for a function.
    It can also be dangerous, because the caller has to know (and remember) the convention.
    If we try to calculate the distance between two items in a list by subtracting
    their indices, when one of them is not found and returns -1, our calculation will
    be incorrect unless we explicitly handle the special case. We can''t lean on the
    type checker to help us avoid errors.


    A special case of returning a special value is null on error. This is quite dangerous
    in most languages, because the caller doesn''t explicitly check for null, then
    using the result will throw a NullPointerException, which may be worse than the
    initial problem. In Kotlin, though, the type checker forces callers to deal with
    null, making this a safe and effective technique.'
