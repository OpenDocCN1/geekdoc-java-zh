  md: "# Multi- to Single-Expression Functions\n\nNat and Duncan love Kotlin's single-expression\
    \ function definitions. When should we use this form, why might we prefer it,\
    \ and what Kotlin features can we use to make more functions single expressions?\n\
    \nAs with Java, the code in a Kotlin function is usually (defined inside braces)\
    \ and uses return to define the result of the function (unless it is unit, Kotlin's\
    \ alias for void):\n\n```\nfun add(a: Int, b: Int): Int {\n  return a + b\n}\n\
    ```\n\nIf the top level of the code is a single expression though, we can optionally\
    \ drop the result type, and define the code with an expression after an equals\
    \ sign:\n\n```\nfun add(a: Int, b: Int): Int = a + b\n```\n\nWe can read this\
    \ as: the result of function adds a + b. Which makes sense for a single expression,\
    \ and can also read nicely when expression is itself composed of subexpressions:\n\
    \n```\nfun max(a: Int, b: Int): Int =\nwhen {\n  a > b -> a\n  else -> b\n}\n\
    ```\n\nThis interpretation makes less sense for functions that have side effects,\
    \ especially those that perform I/O or write to mutable state. For instance:\n\
    \n```\nfun printTwice(s: String): Unit = println(\"$s\\n$s\")\n```\n\nWe can't\
    \ read this as the result of printtwice equals println(...), because println doesn't\
    \ have a result, or at least it doesn't return one. Its function is entirely side\
    \ effects, as we explored in Chapter 7."
