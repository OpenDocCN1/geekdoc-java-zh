    \ this problem, we circumvented the solution because we were tired of updating\
    \ lists of classes when we add an operation.\n\nType checking and downcasting\
    \ are possible in Kotlin, too to carry the same overheads and risks. However,\
    \ Kotlin has another mechanism for organizing classes and behavior that makes\
    \ runtime checks safe and convenient: sealed classes. A sealed class is an abstract\
    \ class with a fixed set of direct subclasses. We must define the sealed class\
    \ and its subclasses in the same compilation unit and package; the compiler prevents\
    \ us from extending the sealed class elsewhere. Thanks to this restriction, runtime\
    \ type checks on sealed hierarchies have no runtime type checks in Java. The static\
    \ checker can guarantee that expressions that perform runtime type checks for\
    \ a subtype of a sealed class cover all possible cases and only the possible cases.\n\
    \n# When Statements Are Not Checked for Exhaustiveness\n\n![](img/2cfc593bb874a4b3e87c679863832738_289_0.png)\n\
    \nThe compiler checks when expressions for exhaustiveness but does not check when\
    \ statements; becomes a statement the value of the entire when expression is not\
    \ used. You can force the compiler to check for exhaustiveness by using the result\
    \ of the when, even though it is of type unit.\n\nIf the when is the only statement\
    \ in the body of a function, you can refactor the function to single-expression\
    \ form. If when is the last statement in a statement function, you can explicitly\
    \ use its value with the return keyword. When the when is in the middle of the\
    \ function, extracting it to its own function might make sense.\n\nWhen none of\
    \ those options apply, you can use the following utility function to force an\
    \ exhaustiveness check:\n\n```\nval <> T.exhaustive get() = this\n```\n\nWhen\
    \ used like this, it will prevent compilation when when is not exhaustive:\n\n\
    ```\nwhen (instanceOfSealedClass) {\n    is SubclassA -> println(\"A\")\n    is\
    \ SubclassB -> println(\"B\")\n}\\.exhaustive\n```"
