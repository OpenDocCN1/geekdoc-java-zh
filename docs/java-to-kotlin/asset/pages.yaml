    \ List<String>): List<String> =\n    strings\n    .asSequence()\n    .map { translate(it)\
    \ }\n    .takeWhile { it.equals(\"STOP\", ignoreCase = true) }\n    .toList()\n\
    ```\n\nIf we don't need lazy evaluation, for smaller collections, or when writing\
    \ from scratch in Kotlin, Iterable pipelines are simple, relatively quick, and\
    \ easy to read. With authors Kotlin will often convert to iterables to take advantage\
    \ of the far richer API that If iterables prove too slow (or sometimes too greedy\
    \ for memory) with collections, then we can convert to sequences. If that is still\
    \ not enough, we can move (hopefully not back) to streams, and maybe even take\
    \ advantage of parallelism.\n\n# Algebraic Transformation\n\nLaziness and parallelism\
    \ will course affect when the stages of our pipeline are invoked. If any of our\
    \ algorithm depends on the order of operations, we may be broken if we swap between\
    \ streams, iterables, and sequences. What we want is code with a predictable algebra:\
    \ a set of rules for manipulating operations while preserving behavior.\n\nWe\
    \ saw in Chapter 7 that we can categorize functions (actually any code, including\
    \ lambdas) by whether they depend on when they are run. (\"Calculations\" on page\
    \ 78) are safe to refactor because we can move their invocations around without\
    \ affecting their result or the result of any other code. In contrast, moving\
    \ an action (\"Actions\" on page 79) from an iterable to a sequence, or vice versa,\
    \ change when it is invoked, and enforce the outcome of our program. The more\
    \ of our code that is expressed as calculations, the more we can treat its representation\
    \ as something we can transform according to rules.\n\nWe can also apply another\
    \ algebra—arithmetic—to simplify our definition of average NonBlankLength. This\
    \ is currently:"
