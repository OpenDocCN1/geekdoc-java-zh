    # The Future


    The future of Java promises more features to make Modern Style easier to apply:
    records, pattern matching, user-defined value types, and eventually the unification
    of primitive and reference types into a uniform type system.


    However, this is a challenging effort that will take many years to complete. Java
    started off with some deep-seated inconsistencies and edge cases that are hard
    to unify into clean abstractions while staying backward compatible. Kotlin has
    the benefit of just 25 years of hindsight, and a clean slate when start to afresh.


    # The Grain of Kotlin


    Kotlin is a young language, but it clearly has a different grain than Java.


    When we wrote this, the “Why Kotlin” section of the Kotlin home page gave four
    design goals: concise, safe, interoperable, and tool-friendly. The designers of
    the language and its standard library also encoded implicit preferences that contribute
    to these design goals. These preferences include:


    Kotlin prefers the transformation of immutable data to mutation of state.


    +   Data classes make it easy to define new types with value semantics. The standard
    library makes it easy and more concise to transform collections of immutable data
    than to iterate and mutate data in place.


    Kotlin prefers behavior to be explicit.


    +   For example, there is no implicit coercion between types, even from smaller
    to larger range. Java implicitly converts int values to long values, because there
    is no loss of precision. In Kotlin, you have to call Int.toInt(). The preference
    for explicitness is especially strong when it comes to control flow. Although
    you can overload arithmetic and comparison operators for your own types, you cannot
    overload the shortcut logical operators (&& and ||), because that would allow
    you to define different control flow.'
