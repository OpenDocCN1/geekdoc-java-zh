    \ runtime to implement these steps for us.\n\nIf we are really in a hurry for\
    \ results, we can even write:\n\n```\npublic static double averageNon#blanklength(List<String>\
    \ strings) {\n    return strings\n        .parallelStream()\n        .filter(s\
    \ -> !s.isBlank())\n        .mapToInt(String::length)\n        .sum()\n      \
    \  / (double) strings.size();\n}\n```\n\nparallelStream will divide the work across\
