  md: 'The unlikely event that you''re joining us from JavaScript or Cloojure, the
    functional form will be familiar, but if you come to Kotlin from Java, this solution
    probably feels quite alien.


    # Function Types in Java


    Both object and functional forms have allowed us to encapsulate things (in this
    case configuration, but it could equally well have been collaborators) to transport
    them from the place where they are known to the place where they are used. Any
    structure could have done that, but because the object and the function both have
    an operation that can be run (send and invoke, respectively), the client can remain
    oblivious to the details of the configuration and pass the information that is
    specific to each invocation (the Email).


    One way of unifying the functional and OO solutions is to view an object with
    a single invoke method. This is exactly what Java did when it introduced lambdas.
    To refer to a function type, Java uses interfaces with a Single Abstract Method
    (SAM) that has the desired signature. Lambdas in Java are a special syntax to
    implement a SAM interface. The Java runtime defines SAM interfaces named after:
    Consumer, Supplier, Function, BiFunction, Predicate, and so on. It also provides
    primitive implementations, like DoublePredicate, to avoid boxing issues.


    Expressed in Java, our functional solution is:


    accept is the name of the single abstract method on the Consumer interface.'
