  md: '# # Refactoring to Kotlin


    When we started our journey to Kotlin, we were responsible for maintaining and
    enhancing business-critical systems. We were never able to focus *only on converting
    our Java codebase to Kotlin*. We always had to migrate code to Kotlin at the same
    time as changing the system to meet new business needs, maintaining a mixed Java/Kotlin
    codebase as we did. We managed the risk by working in small changes, each easy
    to understand and cheap to discard if we found it broke something. Our process
    was first to convert Java code to Kotlin, giving us a Java-esque design in Kotlin
    syntax. We then applied Kotlin language features to make the code increasingly
    easy to use, more type safe, more concise, and with a more compositional structure
    that is easier to change without unpleasant surprises.


    Small, safe, reversible changes that improved the design: we *refactored* from
    idiomatic Java to idiomatic Kotlin.


    Refactoring between languages is usually harder than refactoring *within* a single
    language because refactoring tools do not work well across the boundaries between
    the languages, if they work at all. Porting logic from one language to another
    must be done manually, which takes longer and introduces more risk. Once multiple
    languages are in use, the language boundary impedes refactoring when you refactor
    code in one language, the IDE does not update dependent code written in other
    languages to be compatible.


    What makes the combination of Java and Kotlin unique is the (relatively) seamless
    boundary between the two languages. Thanks to the design of the Kotlin language,
    the way it is mapped to the JVM platform, and JetBrains'' investment in developer
    tooling, refactoring Java to Kotlin and refactoring a combined Java/Kotlin codebase
    is almost as easy as refactoring in a single codebase.


    Our experience has been that we can refactor Java to Kotlin without affecting
    productivity, and that then accelerates as we convert more of the codebase to
    Kotlin.


    # ## Refactoring Principles


    The practice of refactoring has come a long way since its initial popularity in
    Martin Fowler''s book, *Improving the Design of Existing Code* (Addison-Wesley),
    published in 1999. This book had to detail manual steps for even simple refactorings
    like renaming identifiers but not notes that some state-of-the-art development
    environments were beginning to provide automated support to reduce such drudgery.
    Nowadays we expect our tools to automate even complicated scenarios such such
    as extracting an interface or changing function signatures.'
