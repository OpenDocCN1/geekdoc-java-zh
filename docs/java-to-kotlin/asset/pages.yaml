  md: 'As a profession, we have a more sophisticated understanding these days. We
    appreciate that we use objects to represent different types of things—values,
    entities, services, actions, transactions, and so on. And yet the default pattern
    for a Java object is still the JavaBean, a mutable object with getters and setters
    for its properties. Although it may be appropriate for a UI toolkit, this is not
    a good default pattern. For most things that we want to represent with objects,
    a value would be better.


    # Values


    Value is a much overloaded term in English. In computing, we say that variables,
    parameters, and fields have values: the primitive or reference that they are bound
    to. When we refer to a value in this book, we are referring to a specific type
    of primitive or reference: those with value semantics. An object has value semantics
    if its value is significant in its interactions, or its identity. Java primitives
    have all value semantics: every 7 is equal to every other 7. Objects may or not
    have value semantics though; in particular, mutable objects do not. In later chapters
    we''ll look at finer distinctions, but for now, let''s define a value to be an
    immutable piece of data, and a value type to be a type that defines the behavior
    of an immutable piece of data.


    So 7 is a value, and the boxed Integer is a value (because boxes are immutable),
    banana is a value (because Strings are immutable), a URI is a value (because URIs
    are immutable), and java.Date is not a value (because we can setYear and others
    on the date).


    An instance of an immutable DBConnectionInfo is a value, but an instance of Database
    is not a value, even if all its properties are immutable. This is because it is
    not a piece of data; it is a means of accessing, and mutating, pieces of data.


    Are JavaBeans values? Component JavaBeans are not values because UI components
    aren''t just data—two identical buttons have different identities. In the case
    of beans used to represent plain data, it will depend on whether they are immutable.
    It is possible to create immutable beans, but most developers would think of these
    as more than old java objects.


    Are POJO values? The term was coined to refer to classes that don''t extend from
    framework types to be useful. They usually represent data and conform to JavaBeans
    conventions for accessor methods. Many POJO will not have a default constructor,
    but instead define constructors to initialize properties that don''t have sensible
    defaults. Because of this, immutable POJOs are common and may have value semantics.
    Mutable POJOs seem to be the default though, so so much that many people consider
    that object-oriented programming in Java is synonymous with mutable objects. Mutable
    POJOs are not values.'
