    Java classes to Kotlin, and what differences will we see when we have?


    In this book, we''ll work together on the code in Traveler, our fictional trip-planning
    web app. Imagine that we have a feature to implement, but we want to take the
    opportunity to make our code a little better before we do. You''re pairing with
    one of Nat or Duncan (choose your favorite, just don''t let Nat know). The pair
    is we in our refactoring discussions; not just your author, but also you as part
    of the team working on Traveler. Welcome aboard!


    # Source Code


    We have published the Traveler source code in a public Git repository. "Using
    Code Examples" on page xvi details how to access it.


    Because this book is about refactoring, the important details are the changes,
    between single commits and over longer intervals. We have tried to show everything
    you need to make sense of the code here in; it helps to imagine that the last
    code sample is shown in the active editor pane we talk about the changes we are
    about to make. If we failed to make it sense, or you feel the need for more detail,
    then you can check the code and follow along in IntelliJ.


