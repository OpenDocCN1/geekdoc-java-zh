  md: "# The Limitations of Data Classes\n\nA drawback of data classes is that they\
    \ offer no encapsulation. We saw how the compiler generates equals, hashCode,\
    \ and toString methods for data classes but didn't mention that it also generates\
    \ a copy method that creates a new copy of the value with different values for\
    \ one or more of its properties.\n\nFor example, the following code creates a\
    \ copy of an EmailAddress with a localPart \"postmaster\" and the same domain:\n\
    \n```\nval postmasterEmail = customerEmail.copy(localPart = \"postmaster\")\n\
    ```\n\nFor many types, this is convenient. However, when a class abstracts its\
    \ internal representation or maintains invariants between its properties, that\
    \ copy method allows client direct access to the internal state of a value, which\
    \ can break its invariants.\n\nLet's look at an abstract data type in the Traveler\
    \ application, the Money class:\n\n```\npublic class Money {\n    private final\
    \ BigDecimal amount;\n    private final Currency currency;\n\n    private Money(BigDecimal\
    \ amount, Currency currency) {\n        this.amount = amount;\n        this.currency\
    \ = currency;\n    }\n\n    public static Money of(BigDecimal amount, Currency\
    \ currency) {\n        return new Money(\n            amount.setScale(currency.getDefaultFractionDigits(),\n\
    \            currency\n        );\n    }\n\n    and convenience overloads\n\n\
    \    public BigDecimal getAmount() {\n        return amount;\n    }\n\n    public\
    \ Currency getCurrency() {\n        return currency;\n    }\n\n    @Override\n\
    \    public boolean equals(Object o) {\n        if (this == o) return true;\n\
    \        if (o == null || getClass() != o.getClass()) return false;\n        Money\
    \ money = (Money) o;\n        return amount.equals(money.amount) &&\n        \
    \    currency.equals(money.currency);\n    }\n```"
