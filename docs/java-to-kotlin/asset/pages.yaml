  md: "# Kotlin Sequences\n\nThe Kotlin Sequence abstraction offers the same lazy\
    \ evaluation as Java streams. The map operation on a Sequence returns another\
    \ Sequence: the operations in the chain are only performed when some terminal\
    \ operation requires their evaluation. If we have a Collection, Iterable or even\
    \ an Iterator, they are asSequence() extension functions to convert. Apart the\
    \ API is suspiciously familiar:\n\n```\nfun averageNonBlankLength(strings: List<String>):\
    \ Double = =\n    strings\n    .asSequence()\n    .filter { it.isNotBlank() }\n\
    \    .map(String::length)\n    .sum()\n    // strings.size.toDouble()\n```\n\n\
    The familiarity is suspicious because all those operations (filter, map, sum)\
    \ are now extensions not on Iterable but Sequence, and return another Sequence.\
    \ Except, that is, for sum, which can't even pretend to do its job without reading\
    \ all the data, so this code reads the same as the iterable version, but each\
    \ of the functions is actually different.\n\n# Swapping Iterables and Sequences\n\
    \nIterable<T> and Sequence<T> have the same single method signature: public operator\
    \ iterator(): Iterator<T>. They also have extension functions for map, filter,\
    \ reduce, and so on, which take the same parameters. But they are not the same\
    \ type, because their semantics are lazy, whereas on Iterable are eager, so we\
    \ cannot swap one for the other with impunity (as we will see later in this chapter).\n\
    \nNevertheless, the fact that they have similar APIs means that in situations\
    \ like this, we can often change very little (source) code when we want to swap\
    \ between them.\n\nThe sequence version of averageNonBlankLength won't pay the\
    \ price of creating intermediate lists to hold the results of each stage, but\
    \ for small numbers of items, the cost of setting up and executing the pipeline\
    \ may be higher than creating the lists. In this case the Int lengths will still\
    \ be boxed as Integer, albeit at a time rather than creating a whole list of them.\
    \ In many cases, the API designers will have provided a clear solution to remove\
    \ boxing. In this case, it is sumBy:\n\n```\nfun averageNonBlankLength(strings:\
    \ List<String>): Double =\n    strings\n    .asSequence()\n    .filter { it.isNotBlank()\
    \ }\n```"
