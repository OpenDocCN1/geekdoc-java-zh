  md: '# Java to Kotlin Projects


    What is the first step of the journey from pure Java to a mixed and then increasingly
    Kotlin codebase?


    # Strategy


    The first time we, Nat and Duncan, introduced Kotlin to a Java codebase, we were
    members of a small team that included six developers, building a relatively greenfield
    project. We had already deployed some web applications with Kotlin, but our enterprise-
    architects insisted that we write the new system in Java 8. This was shortly after
    Kotlin 1.0 had been released, before Google announced that Kotlin was an official
    language for a language with an uncertain future for a strategic system that they
    expected to be around for decades.


    In Java, we leaned towards a functional approach, designing the core application
    domain model as immutable data types transformed by pipelines. However, we kept
    bumping into Java''s limitations: the verbosity required to implement immutable
    values, the distinction between primitive and reference types, null references,
    and Streams lacking common higher-order functions. Meanwhile, we could see Kotlin
    adopted at an ever-increasing rate across the industry and even within the company.
    When we saw Google''s announcement, we decided to start converting our Java to
    Kotlin.


    Our judgment was that starting in the core domain model would give us the biggest
    bang for our buck. Kotlin''s data classes shrank the code significantly, in some
    cases replacing hundreds of lines of code with a single declaration. We started
    carefully, using IntelliJ to convert a small value class that had no dependencies
    on other classes beyond those in the standard library, and examined how that affected
    the rest of our'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'Java codebase. It had no effect at all! Emboldened by this success, we picked
    up the pace. Whenever a new feature needed changes to a Java domain model class,
    we would first convert it to a Kotlin data class, commit the conversion, and implement
    the feature.


    As more of the domain model logic became pure Kotlin, we were able to make better
    use of Kotlin features. For example, we replaced calls to the Stream API with
    Kotlin’s standard functions on collections and sequences. The biggest improvement
    though, replacing our use of Java’s Optional with nullable references. This simplified
    our code and gave us greater confidence in its null safety.


    Another project in the company adopted Kotlin for a different reason. They had
    a mature Java system that was built on a dependency injection framework. The developers
    found that the framework’s use of reflection and annotations made the code difficult
    to understand and navigate in the IDE. Kotlin’s lightweight syntax for clauses
    offered a way to define the structure of their application and distinguish between
    objects instantiated for the whole application, for each HTTP request, or for
    each database transaction. We gradually refactored the underpinnings of their
    system from a framework that obscured the architecture to a style that composed
    functions and made the architecture visible in the code. This work became the
    http web programming toolkit.


    As these two examples show, your choice of starting point should depend on a number
    of factors, why your team is adopting Kotlin, how large the codebase is, and how
    frequently it changes. You know your project and can decide what is most important
    to change.


    If you are choosing Kotlin for its language features, it makes sense to convert
    the classes you are working in most frequently, as we did in our first project.
    If you are choosing Kotlin to use a specific library, then it makes sense to start
    Kotlin against the API, annotate it to make your Kotlin code convenient to the
    Java code in the rest of the app, and continue from there.


    In a small team it is easy to establish the Kotlin coding style for your system
    (beyond the standard style guide), for error handling conventions, how code is
    to be organized into files, which should be a top-level declaration and what should
    be in an object, and so on.


    Above a certain size, you run the risk of Kotlin code becoming inconsistent as
    people establish their own conventions in different parts of the system. It may
    be worth starting with a small subteam working in one area of the system, who
    establish conventions and build up a body of example code. Once there are some
    established conventions, you can expand the effort to the rest of the team and
    other parts of the system.'
