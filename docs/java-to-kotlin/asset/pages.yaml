  md: 'Other seemingly innocuous actions may be more noxious than we think. Changing
    the order of read and write actions causes concurrency bugs. Error handling is
    much more complicated if the second of two sequential actions fails after the
    first success. Actions prevent us from having free to refactor our code, because
    doing so may change when or whether they are invoked.


    Calculations, on the other hand, can be invoked at any time, with no consequences
    for calling them again and again with the same arguments except a waste of time
    and energy. If we are refactoring code and find that we don''t need the result
    of a calculation, we can safely invoke it. If it is an expensive calculation,
    we can safely cache its result; if it is inexpensive, we can safely recalculate
    on demand if it simplifies things. This is the feature of safety that puts the
    smug smile on the faces of functional programmers (well now that knowing a mandat
    is just a monoid in the category of endofunctors). Those functional programmers
    also have a property of the function that: referential transparency. If a function
    is referentially transparent, we can replace it with its result, and we can only
    do that if it doesn''t matter when or if we call it.


    # Procedural Code


    Nat and Duncan are both old enough to have to program in Sinclair BASIC on the
    ZX81. This dialect had no immutable data, and no support for subroutines, parameters,
    or local variables. It requires real discipline to program in such a system, because
    practically every line of code is an action and potentially affects the functioning
    of every other statement.


    This is in fact very close to the way that our computers actually work, with mutable
    values in registers and global memory, manipulated by machine-code actions. The
    evolution of programming languages has been a process of restricting the ultimate
    flexibility of this model, so that humans can better reason with the code that
    create.


    # Why Prefer Calculations?


    We like calculations because they are so much easier to work with, but ultimately
    our software needs to have an effect on the world, which is an action. There is
    no overlap; code can be an action or a calculation, both timeless and time-dependent.
    If we take some code that is a calculation and have invoke an action, then it
    becomes an action, because it will now depend on or whether it is called. We can
    think of calculations as will depend on the pure code, where code inherits the
    most tainted level of all of its dependencies. We see the same thing with susceptibility
    to errors in Chapter 19. If we value purity (which in all these cases bring ease
    of reasoning and refactoring), we must strive to pull the boundary between impure
    and pure code to the'
