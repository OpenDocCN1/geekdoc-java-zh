  md: '# # Rebooting the Internet


    Duncan had a problem where the integration between his Nest thermostat IfThisThenThat
    was not working. IFTTT was receiving notifications when the Nest entered home
    mode, but not away mode. The great AWS outage of February 28, 2017 mysteriously
    fixed the problem. It turns out that all it required was a reboot of the internet.


    If errors are not well managed, despite that this system becomes successful, diagnosing
    and fixing corruption due to errors can expand to fill all team''s time. This
    is not a great place for a software project to be. Ask us how we know!


    So we don''t want errors because they annoy our users and may result in corruption
    that takes a lot of effort to fix, if we can fix it all. What sort of errors do
    we see?


    Programs can go wrong for many reasons. When we say program, we also mean functions,
    methods, procedures—any code that we invoke. And when we say wrong, we mean to
    fail to do the job that we expected them to.


    Reasons for this failure include:


    +   * Some programs need to talk to other systems and that communication fails
    in some way.

    * Often we don''t give the software correct input it needs to do its job.

    * Apparently some programmers make errors: even instructing their computers to
    dereference null references or read the end of collections!

    * The environment that we are running in for some reason; for example, it might
    run out of memory or not be able to load a class.


    There are failures that don''t fit into these categories, but most do.


    That doesn''t seem to be too long, and yet as an industry we don''t have a great
    reputation for reliability. Error handling just seems to be hard. Why is that?


    Well, for a start we don''t know whether an operation can fail, and if, how it
    can fail. If we do know, then know how to handle an error may be in a long way
    away from where the problem is detected. The code that detects an error, and the
    code that recovers from it, are hard to isolate from the happy path and are hard
    to test. Combine these with the tendency for errors to leave our system in unrecoverable
    states, and we end up with a situation where most developers would rather hope
    for the best than the hard work and get it wrong.'
