  md: "# Choosing Between Streams, Iterables, and Sequences\n\nIf we already have\
    \ code using Java streams, it will continue to run just fine on the JVM, even\
    \ when converted to Kotlin. It will even look a little nicer, since Kotlin can\
    \ move the lambda outside the method and allow the use of the implicit it lambda\n\
    \n```\nfun averageNonBlankLength(strings: List<String>): Double = =\n  (strings\n\
    \    .stream()\n    .filter { it.isNotBlank() }\n    .mapToInt(String::length)\n\
    \    .sum()\n    / strings.size.toDouble())\n```\n\nIn addition, we can use extension\
    \ functions to add operations to streams, in the same way as Kotlin defines its\
    \ Sequence operations.\n\nIf our code is working on large collections, and in\
    \ particular using parallelStream(), then the default should be to leave the streams\
    \ alone, because in these cases they are well optimized by the JVM. The Kotlin\
    \ standard library provides extensions Stream<T>.asSequence() and Sequence<T>.asStream()\
    \ which allow us to swap them with ease, er Stream.\n\nIf we decide to convert\
    \ to a Kotlin abstraction, we can choose Iterable or Sequence, depending on whether\
    \ the streams takes advantage of lazy evaluation.\n\nLazy evaluation is required\
    \ if:\n\n+   * We need to produce results before we have finished reading the\
    \ input.\n* We need to process more data than we can fit into memory (including\
    \ intermediate results).\n\nLazy evaluation may give better performance for:\n\
    \n+   * Large collections with many pipeline stages, where building intermediate\
    \ collections may be slow.\n* Pipelines where early stages could be skipped, depending\
    \ on information only available in later stages.\n\nWe can illustrate the last\
    \ point with the same translation example we saw with streams:\n\n```\npublic\
    \ static List<String> translatedWordsUntilSTOP(List<String> strings) {\n  return\
    \ strings\n    .stream()\n    .map(word -> translate(word))\n    .takeWhile(translation\
    \ -> !translation.equalsIgnoreCase(\"STOP\"))\n```"
