  md: 'If our client code depends on the ISendEmail interface rather than the EmailSender
    class, we can configure our tests to use a fake implementation of ISendEmail,
    which doesn''t actually send emails but instead allows us to check what would
    be sent if it did. Not only can provide fakes that don''t send emails at, but
    also different genuine implementations like SmtEmailSender and X400EmailSender,
    each of which hides its configuration and implementation from its clients. We
    came for the information hiding but stayed for the implementation hiding.


    When we are hiding, it sounds a bit pejorative, but the concealment is useful
    to both client and implement. The former doesn''t have the problem of having to
    supply the configuration details at the point of use; the latter is able to evolve
    separately from its users (provided it doesn''t change API, expressed in the interface).


    Before we leave the object-oriented realm, note that we don''t have to create
    a named class to implement ISendEmail; we can do it anonymously:


    ```

    fun createEmailSender(

    serverAddress: InetAddress,

    username: String,

    password: String

    ): ISendEmail =

    object : ISendEmail {

    override fun send(email: Email) = =

    send(

    email,

    serverAddress,

    username,

    password

    )

    }

    ```


    Why might we want to do this? Well, when we don''t control all the clients of
    our code (we are publishing a library external to our organization, for example),
    this gives us flexibility to change our implementation, safe in the knowledge
    that clients cannot depend on a specific implementation class by downcasting to
    it and calling other methods. We call the object that return here a closure, because
    it closes over that it requires from its enclosing context (the function call),
    capturing it for later reference.


    In Kotlin 1.4, we can declare our ISendEmail interface as a interface (one with
    only one abstract method). This way, we can define the implementation of the single
    operation with a lambda rather than with an object with a single method:


    ```

    fun interface ISendEmail {

    fun send(email: Email)

    }

    ```


