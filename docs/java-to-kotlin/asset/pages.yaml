  md: "This works because the collect causes values to be sucked through the pipeline,\
    \ and takeWhile stops sucking from its predecessor when its predicate returns\
    \ false.\n\nOn the subject of sucking, streams can be surprisingly slow for small\
    \ collections. They are great for large-scale data crunching where we want to\
    \ throw all available cores at a problem—not great for summing the cost of five\
    \ items in a shopping cart. The problem is that Java streams were designed to\
    \ provide general collection transformations, lazy evaluation, and parallel processing,\
    \ and these have different demands. Kotlin doesn't try to implement parallel operations,\
    \ leaving two abstractions; iterables are good for transforming and reducing collections,\
    \ whereas sequences give lazy evaluation.\n\n# Kotlin Iterables\n\nInstead of\
    \ creating a new interface to define collections operations, Kotlin provides extension\
    \ functions on Iterable. The simplest Kotlin expression of the same-algorithm\
    \ is:\n\n```\nfun averageNonBlankLength(strings: List<String>): Double =\n  strings\n\
    \    .filter { it.isNotBlank() }\n    .map(String::length)\n    .sum()\n  / strings.size.toDouble()\n\
    ```\n\nHere filter is an extension function on Iterable. Unlike the Stream.filter,\
    \ though, which returns another Stream, the Kotlin filter returns a List (which\
    \ is Iterable, so we can continue the chain); map returns a list, too, so this\
    \ single expression creates two additional lists in memory.\n\nThe first is a\
    \ List of the nonblank strings, the second is a List of the lengths of those strings.\
    \ When (if) we care about performance, this can be a problem, because both of\
    \ those lists will take time to populate and memory to support.\n\nThe List of\
    \ lengths is a particular issue, because the integers will have been boxed (wrapped\
    \ in an Integer object) to fit in the list. The Java streams used mapToInt(String::length)\
    \ to avoid this problem. IntStream(LongStream and Double Stream, but curiously\
    \ not BooleanStream or charStream) were created to prevent streams having to box\
    \ and unbox, but you have to use them, and Int Stream is not a Stream<Integer>.\n\
    \nShould we care about performance? Mostly no—this Kotlin will be fast unless\
    \ we have large collections, the opposite of streams, which are only fast if we\
    \ have large collections. When we do have large collections, we can switch to\
    \ sequences."
