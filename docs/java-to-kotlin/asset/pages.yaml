  md: 'BigDecimal values with the same scale produces a BigDecimal that also has the
    same scale, and it can therefore call the constructor directly. The constructor,
    therefore, need only assign fields, in the knowledge that it is never called with
    parameters that violate the class invariant.


    However, the copy method of a data class is always public and would allow client
    code to create Money values that violate the invariant. Unlike EmailAddress, an
    abstract data type like the Money class cannot be implemented in a Kotlin data
    class.


    Don''t define a value type as a data class if it must maintain invariants between
    its properties.


    ![](img/2cfc593bb874a4b3e87c679863832738_53_0.png)


    We can still make the class more concise and convenient with Kotlin features that
    we will encounter in later chapters. So''ll leave the Money class for now and
    come back to it in Chapter 12 to give it a thorough makeover.


    # Moving On


    For most classes, it is quick and easy to convert Java to Kotlin. The result is
    completely compatible with existing Java code.


    If we want value semantics, data classes allow us to remove even boilerplate for
    simple classes like EmailAddress. Because data classes are so quick and easy to
    create, and require no maintenance, we use them to define new value types for
    more freedom in Kotlin than in Java: to declare application-specific “micro-types”
    that wrap primitive values, to hold intermediate results of a calculation pipeline,
    or to pivot data into temporary structures that make it easier to write application
    logic.


    If our value types must maintain invariants or encapsulate their representation,
    data classes are not suitable. In that case we have to implement value semantics
    ourselves.


    We left both EmailAddress and Money still looking Java-y...Java-ish?...Esque?...whatever.
    In the following chapters, we will explore how to apply Kotlin idioms to make
    code cleaner, more type safe, and how to build code upon. Chapter 9, Multi-to-Single-Expression
    Functions, looks at how we can make calculation functions and methods, such as
    the toString method of both classes, equals and hashCode of Money, more concise
    by refactoring them to single expression form. Chapter 12, Functions to Operators,
    we make the Money type more convenient to use in Kotlin by defining operators
    instead of methods.'
