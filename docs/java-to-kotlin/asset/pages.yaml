    # Java Collections


    In Chapter 5 saw how Java grew up in the days when we saw objects as fundamentally
    stable and mutable. This was particularly true for collections—I mean, what is
    the point of a list if you can''t add to it? We build collections by creating
    an empty one and adding to it. Need to remove an item from a shopping cart? Mutate
    the list. Shuffle a pack of cards? Obviously changes the order of the deck. We
    wouldn''t create a new paper-do list every time we need milk or take the cake
    to the vet. Mutable collections mirror our real experience.


    On its release, the quality of its built-in collections was a good reason to adopt
    Java. In those days many languages had no residencial collections in their standard
    library. Object technology allowed us to define and use mutable collections safely.
    It was only natural to use this superpower now that it had been given to us, so
    we went ahead and used Vector and Hashtable as intended. This is to say, we created
    them and mutated them. There was no choice, because all the constructors created
    empty collections.


    Java 2 (which was version 1.2 until Java had to compete with C# version numbers)
    introduced a revised collections library. This tidied up the hoc vector, Stack,
    and Hashtable classes and created a common interface with more implementations,
    including ArrayList and HashSet. It was now possible to create a collection as
    a copy of another collection. The static collections class provided some helpful
    utility operations, like sort and reverse.


    Java 5 introduced generics,'
