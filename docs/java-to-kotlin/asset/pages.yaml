    # Moving On


    We want our code to be simple and flexible. To this end, libraries need to hide
    implementation details from client code, and we want to be able to substitute
    one implementation details from some functionality with another.


    In OO, we hide configuration and implementation inside classes and express substitutable
    functionality with interfaces. In functional programming, functions take both
    roles. We might see the function as more fundamental, but we can view an object
    as a collection of functions, and a function as an object with a single method.
    Both Kotlin and Java allow us to move between realms at the boundaries between
    implementations and clients, by using native function types rather than interfaces.
    This allows even more decoupling than defining our own interfaces and should be
    our default approach.


    We continue refactoring this example, and examining this relationship, in Chapter
    17, Mocks to Maps.'
