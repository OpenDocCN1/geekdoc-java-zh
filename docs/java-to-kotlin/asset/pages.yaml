  md: "# CHAPTER 15\n\n# Encapsulated Collections to Type Aliases\n\nIn Java, we encapsulate\
    \ collections of objects in classes to control mutation and add operations. Controlling\
    \ mutation is less of a concern in Kotlin, and we can use extension functions\
    \ to add operations.  How would our designs be better without the encapsulation,\
    \ and how do we get there?\n\nChapter 6 we looked at the differences between the\
    \ grains of Java and Kotlin when it comes to collections. Java's collection interfaces,\
    \ in keeping with its object-oriented roots, are fundamentally mutable, whereas\
    \ Kotlin treats collections as value types. As we saw, if we mutate shared collections,\
    \ we can run into all sorts of trouble. We could \"Don't Mutate Shared Collections\"\
    \ on page 63, but in Java that's hard to do when those add and set methods are\
    \ just an autocomplete away. Instead of convention and discipline, most code simply\
    \ opts for the safer approach of simply not sharing raw collections. Instead,\
    \ collections are hidden another object.\n\nHere, for example class Route in Traveler:\n\
    \n```\npublic class Route {\n    private final List<Journey> journeys;\n\n   \
