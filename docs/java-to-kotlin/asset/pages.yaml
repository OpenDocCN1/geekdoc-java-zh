    # Moving On


    We are not going to claim that the refactored Kotlin code in this example is beautiful,
    but we do think that it is a significant improvement on the original Java. Extension
    functions, Kotlin''s lambda syntax, and improved type inference combine to reduce
    a lot of the noise associated with Java streams. When we have in-memory collections,
    using iterables rather than streams can also be more efficient as well as cleaner.'
