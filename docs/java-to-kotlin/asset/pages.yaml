    This is effectively a mutable String, which is not a subtype of String. Once we
    have a result we want to publish, we need to call .toString(), and subsequent
    modifications to the StringBuilder will not affect previous results. But Clojure
    and Scala adopted this approach for mutable collections—why doesn'' Kotlin?


