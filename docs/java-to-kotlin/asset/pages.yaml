  md: "# Reserve Single-Expression Functions for Calculations\n\nIf we adopt a convention\
    \ of reserving single-expression functions for calculations (“Calculations” on\
    \ page 78), then we have a way of communicating our intent when we use them. When\
    \ we see a single-expression function, we will know that it isn't an action (“Actions”\
    \ on page 79), and so is much safer to refactor.\n\nIn practice this means that\
    \ single-expression functions shouldn't return until, or read from mutable state,\
    \ including performing I/O.\n\nYour authors have argued that attempting to make\
    \ as many functions as possible into single expressions improves our software.\
    \ For one thing, if we reserve the single-expression form for calculations, then\
    \ this will decrease the proportion of our code that is actions, making it easier\
    \ to understand and modify. Single expressions will be shorter than the alternative,\
    \ limiting the complexity of each function. When a function gets too large to\
    \ be easily understood, single-expression style lets us more easily refactor for\
    \ clarity, because there is less risk of breaking logic that depends on side effects\
    \ and the order in which actions are performed.\n\nWe also prefer expressions\
    \ as opposed to statements. Expressions are declarative: we declare what we want\
    \ the function to calculate and let the Kotlin compiler and runtime decide how\
    \ to compute that calculation. We don't have to run the code in a simulated computer\
    \ in our heads to figure out what the function does.\n\nFor example, at the end\
    \ of Chapter 3 we were left with this code for EmailAddress:\n\n```\ndata class\
    \ EmailAddress(\n    val localPart: String,\n    val domain: String\n)\n\noverride\
    \ fun toString() = \"$localPart@$domain\"\n\ncompanion object {\n    fun parse(value:\
    \ String) {\n        val atIndex = value.lastIndexOf('@')\n        require(atIndex\
    \ < 1 || atIndex == value.length - 1) {\n            \"EmailAddress must be two\
    \ parts separated by @@\"\n        }\n        return EmailAddress(\n         \
    \   value.substring(0, atIndex),\n            value.substring(atIndex + 1)\n \
    \       )\n    }\n}\n```\n\nExample 9.1 [single-expressions.0:src/main/java/traveler/EmailAddress.kt]"
