  md: 'We could (and maybe should) write a whole book on error handling, but in the
    meantime you can follow Duncan''s journey down the rabbit hole on his blog. As
    well as the material covered here, this shows how to reduce the number of functions
    that are subject to failure because they are partial functions.


    Reducing the number of our functions that can fail is important, because code
    that is subject to error is very similar to the actions we saw in Chapter 7, Actions
    to Calculations. Actions pollute their callers: by default, code that calls an
    action becomes subject to failure. In the same way, code that calls code that
    is subject to failure is itself subject to failure. We can mitigate the effects
    of both actions and errors by moving them as close as we can to the entry points
    to our system, so that they taint the least code.


    We touched briefly in this chapter on making our code robust to errors when they
    occur. Actions are a problem here too, because they affect the state of our system.
    State can be corrupted when two things need to be updated, the first action writes,
    but the second doesn''t because an error happened before it was invoked. A rigorous
    focus on the difference between actions and calculations is the key to making
    robust software.


    We will return to error handling in Chapter 21, Exceptions to Values.'
