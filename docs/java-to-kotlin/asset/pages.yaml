    Subclasses of RuntimeException represent other errors. The intention was that
    these would be reserved for problems caused by programmer mistakes, such as accessing
    a null reference or trying to read out the bounds of a collection. In both cases
    the programmer could have been more careful. Again though, every piece of code
    is subject to programmer error, so RuntimeExceptions are also exempted from having
    to be declared.


