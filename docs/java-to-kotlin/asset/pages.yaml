  md: '# Java to Kotlin


    It takes a while to travel the 8.000 miles overland from Java to Kotlin. If you''re
    an experienced Java developer who has tried the Kotlin language, you were probably
    productive in about the same time.


    You''ll found that they do things differently in Kotlin, though Nullability is
    important, collections are different, and classes are final by default. Kotlin
    is more functional, but what does that mean, and how should it change the way
    that you program? And what about that Java code that you still have to support?


    Your guides Duncan and Nat First made the trip in 2015, and they''ve helped many
    teams and individuals follow in their footsteps. Travel with them as they break
    the route down into like Optional, Nullable, Beans to Values, and Open to Sealed
    Classes. Each explains a concept and shows you how to refactor Java to idiomatic
    Kotlin, gradually and safely, while maintaining interoperability.


    The resulting code is simpler, more expressive, and easier to change. By the end
    of the journey, you''ll be confident in refactoring Java to Kotlin, writing Kotlin
    from scratch, and managing a complex codebase as it evolves over time.


    Nat Pryce and Duncan McGregor are expert JVM developers, consultants, and trainers.
    Early adopters of both Java and Kotlin, they''ve learned to combine the techniques
    of object-oriented and functional programming, and to refactor between them. Their
    successful workshops at KotlinConf proved the value of teaching through refactoring
    and led to the worthy of this book.


    > To take familiar good Java code and see it transform, incrementally, into concise,
    clear, expressive and easy to maintain Kotlin code is a wonderful way to learn
    the language. Benefit from the experience McGregor and Pryce have distilled in
    this book.


    > —Dr. Venkat Subramanian and Founder

    Award-Winning Author of Agile Developer, Inc.


    > The fastest way to upgrade your skills from Java to Kotlin. Essential reading
    for any professional Java developer.


    > —Dawn Griffiths & David Griffiths

    Authors of Head First Kotlin


    PROGRAMMING / KOTLIN


