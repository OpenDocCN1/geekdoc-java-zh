  md: '# About the Authors


    Between them, **Nat Pryce and Duncan McGregor** have over five decades of professional
    experience in software development. They''ve written a lot of software in a lot
    of industries. They''ve also written a lot about writing software, written software
    to help them write about writing software, given talks about writing software,
    run workshops about writing software at conferences, and helped organize conferences
    about writing software.


    A lot of the software they wrote in Java. Not all, but a lot. They are old enough
    to remember when Java was a breath of fresh air compared to C++. And now they
    find Kotlin to be a breath of fresh air compared to Java. So they''ve written
    a book about writing software with Kotlin (and wrote some software to help them
    write it).


    # Colophon


    The animal on cover of Java is a Hausa genet (Genetta thierry), also known as
    Thierry''s genet. Genets are small, cat-like creatures in the forests, savannahs,
    and shrublands ranging from The Gambia to Cameroon. Their speed and agility make
    them difficult to observe in nature, Hausa genets have been spotted in the rainforests
    of Sierra Leone, Ghana, Côte dIvoire, the steppes of Senegal, and the woodlands
    of Guinea-Bissau.


    Hausa genets are typically light brown with rusty black spots on the body and
    stripes down the back. Large ears and round eyes protrude from their long, angular
    face. Their tails are as long as the body and banded with dark rings. The different
    genet species all have similar markings, grow from 13–33 inches, and weigh anywhere
    between 4–40 pounds. Hausa genets are on the smaller end of this range in size
    and weight. Because they have been so hard to study, we don''t know much about
    their behavior or diet. Other species of genet are nocturnal and spend their days
    sleeping in burrows or hollow trees. By night, these opportunistic omnivores hunt
    for small mammals and reptiles, or forage for eggs, fruit, insects, and rodents.


    Hausa genets are rare, and they are classified as a species of "Least Concern"
    by the IUCN due to the variety of habitats and relatively wide range they occupy
    in West Africa. However, they have been tracked for their skin or as pets in the
    past, and have been hunted as bushmeat. Many of the animals on O''Reilly covers
    endangered; all of them are important to the world.


    The cover illustration is by Karen Montgomery, based on a black and white engraving
    from Wood''s Animate Creation. The cover fonts are Gilroy Semibold and Guardian
    Sans. The text font is Adobe Minion Pro; the heading font is Adobe Myriad Condo;
    and the code font is Dalton Maag Ubuntu Mono.'
