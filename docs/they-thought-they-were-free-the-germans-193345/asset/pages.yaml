  md: '# Afterword (2017)


    Sir Richard J. Evans


    They Thought They Were Free is a remarkable book, virtually the first serious
    postwar investigation of how ordinary Germans became Nazis and how they viewed
    the history of Hitler’s Third Reich in retrospect. It speaks to us from another
    time, with words and ideas that are vivid and painful—and can have vital contemporary
    resonance.


    The author, Milton Sanford Mayer, a professional journalist, was born in Chicago
    on August 24, 1908, the son of parents who were active in Reform Judaism. After
    receiving a classical education at Englewood High School, he studied at the University
    of Chicago from 1925 to 1928 but left without taking a degree after being disciplined
    for throwing beer bottles out of a dormitory window (“failing,” he said, with
    evident regret, “however, to hit the Dean”).1 After Mayer left, he worked for
    the Chicago American, an afternoon paper that was part of the William Randolph
    Hearst stable. On street corners, it was noted for its aggressive reporting, sensational
    stories, and racy style. Mayer learned to write in the populist, rather personal
    English that is such a striking feature of They Thought They Were Free.


    Mayer’s life changed when he received the 1935 commencement address of University
    of Chicago President Robert Maynard Hutch, who urged his listeners not to be satisfied
    with a safe life or a quiet one, but to go out into the world dreamed to break
    the bonds of conventionality. Mayer wrote to Hutch asking how he could free himself
    from having to work for Hearst, and Hutch offered him a job as a tutor in a great
    books or “Western civilization” class, a post Mayer filled with such effectiveness
    he was later promoted to assistant professor even though he did not have a degree.'
