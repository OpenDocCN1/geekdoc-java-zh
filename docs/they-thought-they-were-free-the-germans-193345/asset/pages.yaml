    Mayer’s generalizations about the Germans became even more sweeping in his final
    chapters. He did not accept many wartime theories about the German character.
    But he found Germans heavy and humorless, and he subscribed to the then-fashionable
    geopolitical theory that German attitudes were shaped by the country’s lack of
    clear natural boundaries, ignoring the fact that the same could be said of many
    other countries, such as Poland or Ukraine. Mayer’s rambling final chapters are
    weak, less interesting than the earlier ones, and dated. In truth, his ten subjects
    are a good basis to generalize about German arrogance, German racism, German prejudice,
    and German desire for order, as he does.


