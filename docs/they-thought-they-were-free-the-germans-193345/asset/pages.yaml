  md: 'Nobody bothered him; nobody paid any attention to him. And vice versa.

    The other nonbeliever was really the truest believer of them all. He was a biologist
    and a rebel against a religious background. He had no trouble perverting Darwin’s
    ‘survival of the fittest’ into Nazi racism—he was the only teacher in the whole
    school who believed it.


    “Why didn’t he join the Party?”


    “He hated the local Kreisleiter, the County Leader of the Party, whose father
    had been a theologian and who himself never left the Church. The hatred was mutual.
    That’s why the biologist never joined. Now he’s an ‘anti-Nazi.’”


    “And you?”


    “Yes,” he said, blushing a little. “I joined. I had my past, of course, in East
    Prussia. All sorts of care had been taken to bury, but—one never knew. I had been
    active in the Old Staatsartei, the successor of the Democratic Party in 1930.
    I lectured regularly at the local folk school, the adult education program, which
    was promoted and largely attended by Social Democrats and Communists. In my book
    program, on the radio, I had praised the works of ‘treasonable’ writers after
    the Nazis took power.


    “For eight years I held the rank of Studienrektor. It carries no tenure with it.
    After 1939 my was not included in the list of candidates for Studienrat, the rank
    which is usually given after five years of highschool teaching. The spring the
    Nazis took power, I was dismissed from my radio program and from my adult-school
    lectureship. Then I transferred from the city to one small school after another.
    I resigned, very quietly, and came here, to Hesse. My father friend. But still
    I was not promoted, and I was afraid that something was suspected. I waited two
