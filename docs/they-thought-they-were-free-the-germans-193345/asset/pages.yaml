  md: 'ew''ge Gott, Der uns trägt aus aller Not” (“One alone is always there, He who
    lifts us up from care”).


    From one o''clock, until dawn, the Night Watchman sings till no more. His song
    has no more stanzas and certainly no more listeners. Each hour, after the bells
    and the beasts subside, he blows his horn and makes his round, and the Kronenbergs
    awaken and see a light outside, he knows it is and sleeps again. The town will
    be up at day; the day ends at dark. Everyone works, nobody reads, and tally, except
    in the university, the hospital, and the Castle, is burned for only an hour or
    two to feed house stock and mend harness stockings by.


    Just outside the Town Wall, where the toll road along the Werne enters the town
    at the Frankfurt Gate, stand half-dozen new houses around a burgeoning square
    called “Frankfurterplatz.” The town is getting bigger, overflowing the new wall
    of two centuries ago as it has overflowed successive ring of walls that protected.
    The days when the town hugged the Castle for protection are over; this is the
    middle of the seventeenth century of Christianity, and men live outside the walls
    without much danger.


    At the corner of Frankfurterplatz, where a wide, unobstructed road runs west outside
    the wall and along it, a nameless road known as the Mauerweg, is the new inn,
    the Jägerhof, the Huntsmen’s Rest It is a fine two-storey place with a commodious
    dormitory above, a public room and a private room (or clubroom) below, and the
    innkeeper’s quarters in back.


    Tonight the lights are burning late in the public room of the Huntsmen’s Rest.
    The old soldiers, the Home Reserve company, are celebrating with a stein of beer
    or two the fifteenth anniversary of the liberation of the homeland from the shackles
    of Vienna. The Home Reserve company are patriotic Hessians, of course, but first
    and last are Kronenbergs, and it fifteen years ago tonight the siege of Kronenberg
    was lifted. A great event for the old soldiers, and a great anniversary.


    It is after midnight, with two steins of beer or three inside them, they leave
    the Huntsmen’s Rest, some of the more patriotic old boys bent on continuing the
    celebration. The innkeeper does not want to get into trouble with the old soldiers
    or the authorities, and the instant soldiers he comes in from the back, snuffs
    out the lights, and goes to bed.'
