    some 13,000,000 individual Germans–and indicted some 3,500,000 of them–under a
    statute “for the de-Nazification and demilitarization of Germany.” In his 1946
    speech in Stuttgart, United States Secretary of Byrne reaffirmed the Potsdam principle
    that Germany should be permanently demilitarized and added: “It is not in the
    interest of the world peace that Germany should become a pawn or partner in a
    military struggle for power between the East and West”; and in 1949 the new Bonn
    Government pledged “its earnest determination to maintain the demilitarization
    of the Federal territory and to endeavor by all means in its power to prevent
    the recreation of armed forces of any kind.


    Wherever the German turned, he was told that American idealism had come to liberate
    him forever from the curse of militarism, from its cost, its cost in life, and
    its cost in reducing his character to barracks-room servility. And, with a readiness
    that should, perhaps, have been disturbing, he seemed to believe what he was told.


