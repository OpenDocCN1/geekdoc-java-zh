  md: '# Kronenberg


    # November 9, 1638:


    “HEAR, YE TOWNSFOLK, HONEST MEN”


    It is ten o''clock at night—give take ten minutes. The great E-bell of the Katherine
    Church has begun to strike the hour. Between its seventh and eighth strokes of
    the Parish bell begins to strike. You would suppose that the sacristan of the
    Parish Church had been awakened by the Katherine bell, pulled himself out of bed,
    and got to his bell rope just in time to avoid complete humiliation (like a man
    running shirtless and shoeless to a wedding to get there before the ceremony is
    over). But you would probably be wrong, for every night, ever since have been
    two bells in Kronenberg, the first stroke from the Parish Church has come just
    after the seventh from the Katherine; in deference, perhaps, for the Katherine
    Church was once (until the Reformation a century ago) a cathedral.


    Now Kronenberg, besides two church bells and two churches, six thousand souls;
    and a university, with a theological faculty and almost hundred students; and
    a Castle, which crowns the hill on which the closely packed, semicircular town
    is built a hill still in places that some of the houses can be entered only from
    the top floor); and a river at the foot of the hill, the Werne. The Werne is not
    navigable this far up from the Rhine, but its course around the flowering hill
    conspires with the Castle at the top, the messed gables of the timbered old houses
    that climb to the edge of the Castle park, and the cobblestone lanes and alleys
    that gird the hillside like tangled hoops, to make of Kronenberg a picture-book
    town on a picture-book countryside.


    The town has its troubles, as what town hasn’t? In the half-dozen centuries past
    it has changed hands a dozen times. It has been stormed,'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'taken, liberated, stormed and taken again. But has never been burned; its prettiness
    (for it is small enough to be pretty rather than beautiful) may have shamed off
    the torches which have gutted so many towns; and now, in 1638, Kronenberg is always
    designated as “old Kronenberg,” an ancient place.


    The Great War of Europe is twenty years old, but maybe it is over; the Prince
    of Hesse has decided to join the Peace of Prague, to drive the Protestant Swedes
    out of the Catholic Empire without, it is hoped, incurring submission to the Catholic
    Emperor in Vienna. True, Catholic France has just attacked Catholic Spain and
    in alliance with Protestant Sweden, has just declared war on the Emperor. But
    Kronenberg has only heard vaguely about these wonderful events, and who knows
    what they mean? “The King makes war, and the people die”; it’s an old, saying
    in Kronenberg.


    Times have been very hard everywhere these last years, in Kronenberg, too; taxes
    and tolls always higher, men, animals, and grain taken, always more, for the armies.
    But the war, moving from north to south, from south to north, and from north to
    south again, spared the town, except for a siege which was driven off by the Protestant
    armies. In all of, the Kronenbergers can complain. And they don’t.


    Pestilence and famine recur in Kronenberg—as where not they?—and, where there
    are Jews, what is it one effect? After the Black Death of 1348, the Judenschule,
    or prayer-house, was burned in Kronenberg, and the Jews were driven away. (Everyone
    knew they had poisoned the wells, all over Europe.) A few years afterwards the
    finances of the Prince of Hesse were so straened that he had to pawn Kronenberg
    to the Jews in Frankfurt, but in 1396 Good Wenclaus declared void all debts to
    the Christ-killers. But that was not the end of it, because the princes always
    brought the Jews back, to the un-Christian business of banking forbidden Christians
    by canon law. So it was, until 1525, the Bürgermeister of Kronenberg implored
    the Prince to drive the Jews out again. “They buy stolen articles,” he said.\If
    they were gone, there would be no more stealing.” So the Prince drove them out
    again; but he exercised the imperial privilege given by Karl V to keep a certain
    number of Jews in the town on the condition that they pay a protection tax, a
    Schutzgeld. If they failed to pay the Schutzgeld, the Prince removed his protection.'
