  pgno: 12
- img_proc: true
  md: 'Those were good times, before the Great War of Europe. Times are hard now;
    but they might be worse (and nearly everywhere are) than they are in Kronenberg,
    and tonight the burghers and their manservants and their maidmaids are sleeping
    contented, and contended as burghers and their manservants and maidmaids may reasonably
    expect to be in this life. So are their summer-fattened cattle and the better
    sheep in the meadows (it is not yet cold in early November), and their pigs and
    chickens and geese and ducks in the back of the house; sleeping, all, at ten o''clock.


    The two church bells are dissonant, the Parish bell''s A-flat ground tone against
    the Catherine''s E; workmanship was not what it was when the Catherine bell was
    cast three or four centuries ago. But it takes more than the dissonance of the
    bells to awaken the people of Kronenberg. It takes even more than the rooster
    on top of the Town Hall to do it.


    The Town Hall rooster is a wonderful rooster. It flaps its wings and crows a heroic
    crow, once for the quarter-hour, twice for the half-hour, three times for the
    three-quarter-hour, and four times for the hour—and then it crows. (If it does)
    it begins its ten o''clock crow when the Catherine bell is finished and the Parish
    bell has just struck its sixth stroke, the fault cannot be the rooster''s, for
    the bell-ringers are human and fallible, but the rooster is mechanical. To say
    that the rooster was wrong would be to say that the Town Clock was wrong, and
    this no one says.


    Now the dissonance of the two bells is as nothing to the cacophony of the rooster
    and the last four strokes of the Parish bell; still the Kronenberg sleep. They
    sleep until their own Sesh-and-blood roosters respond to the crowing at the Town
    Hall. The response begins, naturally, in the barns and dooryards near and fans
    out in an epidemic descent down the whole Kronenberg Hill awakens the ducks and
    the geese, the pigs and the sheep; then the cattle stir and low. The house dogs
    are the last to be heard from, but once barking, they are the last to stop.


    All Kronenberg turns underneath its mountainous feather beds. Everyone half-awakens
    with the dissimony, remains half-awake until it is over, and then slips back,
    but not all the way back, into sleep. The Kronenberg have yet to have their ten
    o''clock lullaby, the lullaby they have had, and their ancestors before them,
    every night of their lives, the Night Watchman''s Stundenrufe, or calling of the
    hours.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Every night Night Watchman stands in the Market Place until the clatter of
    the bells and the animals is ended; an old pensioner in the raiment of his office,
    a long green greatcoat and a high-crowned green hat, his horn slung over his back,
    his lantern in one hand, a pickestaff in the other. Staff, lantern, and horn,
    Night Watchman himself, are increasingly ornamental nowadays. As he makes his
    hourly round, he watches for fires, which are rare in cautious, pinchpenny old
    Kronenberg, and for a still rarer pig broken out of a barn.


    But he has his dignity, this man, if only symbolically these days, has the community
    in his care; he will not compete with roosters and geese. When the last echo of
    the clatter has died—and not before—he puts his horn to his lips and blows it
    ten times and then begins his descent through the town, clumping heavy-booted
    on the cobblestones, singing the Kronenbergs back to sleep:


    ![](img/851a06e326bce1b2acf6f116f7619396_14_0.png)


    By this time, of course, the Town Hall rooster has long since crowed one crow
    for 10:15.'
