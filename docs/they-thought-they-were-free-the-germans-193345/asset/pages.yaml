    # ## Are We the Same as the Russians?”


    The nineteenth century of Europe left untouched only three great bulwarks of autocracy—Russia,
    Prussia, and Austria. These were, in the phrase of the time, the three eastern
    great powers, in which always the pattern of postfeudal absolutism, serving an
    agrarian and military nobility, with a subservient church appended, still survived
    in the West. German royalty''s predilection for France and England—and its intermarriage
    with the latter''s ruling house—gave an early impression of Western orientation,
    fortified by the spectacular industrialization of the new Reich under Bismarck.
    The perennial preoccupation of German scholarship with Russia (and vice versa)
    might have been a better clue to the future of Europe than the diodes of court
    society.


    Russia (whose history has been epitomized as the search for a warm-water port)
    and Germany are the two-nots, subjectively, with a long history of like, and co-operative,
    behavior, beginning with their postmedieval colonization (including a half-dozen
    amicable partitions of Poland) and their failure (or inability) to colonize abroad.
    Bismarck''s support of Russia''s Black Sea ambitions; the German General Staff''s
    support of the October Revolution; Rapallo; the Molotov-Ribbentrop Pact—all these
    are seen, quite rightly, as German policy in a perpetual pincers situation. But
    German-Russian relations have always been happier than the relations of either
    with the other European great powers. Behind the events of the immediate past
    are five centuries of remarkably peaceful penetration of the western Slav world
    by German traders and agriculturists and the concomitant Slavic influence on the
    East Prussian and Silesian temperaments.'
