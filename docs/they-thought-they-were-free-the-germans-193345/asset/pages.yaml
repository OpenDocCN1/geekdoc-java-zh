    Besides the children who attended the ever repeated free movies of the Grand Canyon
    and Niagara Falls, the Amerika-Haus patrons were, in the main, pro-Americans from
    ''way back and students writing papers on American subjects assigned them by their
    hurriedly Americanized instructors. Prior to the onslaught of McCarthyism in 1952,
    the Amerika-Häuser still stocked American books of all sorts, all of them, unfortunately,
    in English. There were no more read by my friends—or burned—than the anti-Nazi
    New York Times had been when it was available in the fashionable hotels of Nazi
    Berlin.


    What the Germans needed to see that democracy was, not to hear it touted. But
    in my year in Kronberg there was not one controversial public discussion or debate
    under American sponsorship or control. In East Germany, a few miles away, the
    Communists were beating the drum for Communism; in Kronberg the Americans were
    blowing the trumpet for Americanism; and in both places, not so long, the Nazis
    had been burning the torch for Nazism. But the Germans had—in their own polite
    phrase—had a sizeof of beating, and burning.


    The Germans were, after 1945, in a position to begin to judge Nazism, whose blessings
