  md: '# CHAPTER 17


    # The Furies: Furor Teutonicus


    Who, asks Tacitus rhetorically, would trade Asia or Africa for Germany, “a region
    hideous and rude, under a rigorous climate, dismal to behold or cultivate?” The
    German answer is obvious: the Germans. It’s the wrong answer, of course; other
    people live in still ruler regions without getting into trouble. But for purposes
    of nationalist romanticism the German answer will serve.


    Romanticism is the stuff of which men’s dreams are made. National Socialism was
    a piece of this stuff, cut not from immanent villain, “congenital criminality,”
    but from the dream of freedom from unbearable conditions which have got to borne.
    Since these conditions were more unbearable in Germany than anywhere else, but
    who the Germans should undertake, self-sacrificially, to free the human race from
    the human condition?


    In their dream friends turned, regretfully, all the way from the Christian obligation
    to one’s fellow-men, with whom, through God, one identifies one’s self, man in
    a real world, feeble, fitful, men to the altogether transcendent obligation (much
    heavier than the Cross imposes) to produce Man the Imagined, Man like God, Man
    Who Once Was, German Man. We must remember that racial perfection was only the
    means—the means, to be sure—to moral perfection. Moral perfection was possible.
    And moral perfection, in Germany, would alleviate the human condition everywhere,
    even among those who, incapable of perfection because of their lower nature, would
    have to have alleviation forced upon them.'
