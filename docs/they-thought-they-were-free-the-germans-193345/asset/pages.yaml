  md: 'As I thought of my ten Nazi friends in the light of my talks with the philologist
    and the engineer, it occurred to me that the concept of collective guilt is at
    bottom a semantic failure. What is really involved collective shame. Collective
    shame may be possible, but it cannot be compelled. Shame is a state of being,
    guilt a juridical fact. A passer-by cannot be guilty of failure to prevent a lynching.
    He can only be ashamed of not done so.


    Even a sovereign, self-governing citizen, such as an American, cannot be guilty
    of failure to prevent an act of State. It would be Nazism itself to take Americans
    off the street and change them, in connection with, say, the bombing of Hiroshima,
    having violated the Hague Regulations, to which their government, whose sovereign
    citizens they are, was signatory. Still less than a sovereign citizen can be the
    subject of a dictatorship guilty of an act of State. And, when the State requires
    him, personally and individually, to commit what he regards as a crime, and the
    penalty for his refusal to do so is very heavy, the common law acquits him on
    the ground of defence. “I was lucky,” said Herr Klingelhöfer, the cabinetmaker.
    “I didn''t have to do anything wrong.”


    Collective shame is something else, but it requires not the fact of sovereign
    citizenship the most delicate sense of it. I did not discover much collective
    shame among my ten friends. The President of the West German Federal Republic
    had called upon them to feel it and had used for every expression, “collective
    shame.” But how does one call, effectively, upon people to feel ashamed?


    In the case of Horst Rupprecht, the university and Hitler Youth leader, who blamed
    himself for the sins of Nazism, the sins of Germany, the sins of the whole German
    people, his mea culpa was just a little unconvincing; he was eight years old in
