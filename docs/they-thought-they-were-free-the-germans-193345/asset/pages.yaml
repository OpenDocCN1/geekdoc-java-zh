    sweetness, their simplicity, and their subtlety. Their reactions are structuralized;
    like rubber balls (which we say “life” in them because they react in such lively
    fashion to the living impulse outside them), the harder they are bounced, the
    higher they go. Such, when they are not told to cut down a tree, they won''t cut
    down a tree, but when they are not told to cut down a man, they may cut down a
    man.


    The German who is dedicated to instant self-immolation for the sake of Germany
    is the same German whose-to-day egotism amazes the world. This egotism, always
    “idealized” (that is, romanticized), is, as has often observed, the very heart
