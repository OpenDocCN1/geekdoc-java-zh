  md: 'These views, of course, were not necessarily shared by the millions of former
    Communists and Social Democrats who had survived the Third Reich and emerged at
    the end of it to reestablish their party organizations and resurrect their ideologies
    and programs. The merger of the two parties in East Germany that was enforced
    by the Red Army effectively reduced the Social Democrats to a tool of the emerging
    Stalinist regime, and together with the Cold War, this shrank the Communist Party
    in West Germany down to a rump with no mass support before it was formally banned
    in 1957. The Social Democrats, however, retained their Marxist program, with its
    demands for the wholesale transformation of the German economy and society along
    socialist lines, until it was replaced by the more moderate and realistic Godesberg
    Program in 1959. During the time that Mayer was living in Marburg, they were led
    by Kurt Schumacher, who held out for German unity and blamed the Allies for not
    doing anything to free the working class in East Germany from the shackles of
    Communism. On the other hand, Schumacher was also highly critical of the Allies’
    role in what he saw as the restoration of a capitalist economy in West Germany.46


    Overly impressed by the nationalist element in Schumacher’s stance, Mayer misread
    the Social Democrats in both his own time and the past. The party had the largest
    in the Reichstag by 1912, and far from lacking “an independent program of its
    own for altering the very basis of government,” as Mayer claims (153), it pushed
    such a program as hard as it could come to power at the end of World War I. The
    Weimar Republic, the modern democracy founded in 1919 by the Social Democrats
    and their left-liberal political partners, owed existence existence the 1920s
    largely to party members’ loyalty to their principles. Mayer had to admit that
    the Prussian Democrats “stood firm in resistance” to the betrayal of these principles
    (154), but it is important to remember that Prussia was most of Germany at that
    time and included most of its population.


