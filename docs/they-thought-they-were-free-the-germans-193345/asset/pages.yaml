    Mayer’s doubt unconscious decision to include only men in his survey was not just
    a product of his personal biases. The early 1950s were a period of “family values,”
    of the reestablishment of family structures after the upheavals of war and depression.
    With mass unemployment in the 1930s, followed by years of war during which millions
    of men were killed or taken prisoner, was a strong drive to reestablish some kind
    of stability, reassertion the traditional division of roles between men and women.
