    veracity (he found no significant contradictions) and he sought confirmation among
    non-Nazi acquaintances in the town. And he carefully looked for self-contradictions
    and evasions in the stories themselves. He did not know German, but he noted,
    that this was not a handicap but an asset: “This circumstance almost reduced the
    traditional disparity between the professor and the ordinary German. In the presence
    of my linguistic superiors, I was a humble and earnest learner, and every one
    of them was in the happy position of being able patiently to deal with my stupidity.”
    In seven of the cases he began with an interpreter, one or the other of two German
    women whose services he had engaged for the purpose; in the other three cases
    he either conversed in French (Straub and Hare) or were able to follow because
    the subject spoke very clear German and understood some English (Bräutigam).15


    Mayer was also able to reduce his handicap by living modestly and walking to the
    men''s houses rather than driving there. He invariably mentioned that he was descended
    from Germans who had immigrated to America for political reasons after the failure
    of the 1848 revolution, which helped. The men did not approve of his pacifism
    during World War II, or at least he refused to fight against Germany. He had thought
