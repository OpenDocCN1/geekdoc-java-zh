  md: 'In this, as in many other respects, Mayer’s ten subjects, with the exception
    of the schoolteacher, had relatively untroubled memories of the Nazi period. But
    this was not characteristic of most Germans. World War II, the ultimate product
    of National Socialism, had caused enormous destruction in Germany. More than half
    a million German civilians had been killed by the carpet-bombing of German cities.
    Forty percent of the housing stock in large towns and cities had been destroyed.
    It took years to clear away the rubble—there were 13.5 million tons of it in Cologne,
    for example, and incomparably more in cities like Berlin and Hamburg, where 70
    percent of the houses and apartment blocks had been left uninhabitable. Marburg,
    in contrast, only 4 percent of its housing stock, 281 buildings in all, mainly
    around the railway station, which was targeted by Allied bombers. It was a small
    town, of little importance in terms of production, and so bombers left it largely
    in peace. Some five million German soldiers, sailors, and airmen in the war as
    well, but this did not seem to have touched Mayer’s subjects either, since none
    of them mentioned any losses in their families.42 These disasters turned many
    if not most Germans against the Nazi regime even before the end of the war, but
    not in Marburg.


    Moreover, at the time Mayer conducted his interviews, the German economy was still
    weak. No wonder that his interviewees could envisage a time in the future when
    there could be an economic recovery (62). The belief of many Germans that things
    could never be as good as they had been under Nazism would change in the 1960s,
    after a period of rapid economic growth known in Germany as “the economic miracle.”
