    the crimes of the Nazi era. The great majority now admitted that ordinary Germans
    had in one way or another involved. The gradual passing of the generation of Mayer’s
    ex-Nazi friends and the emergence of a new generation of Germans who were educated
    in the democratic post of war Europe made such a reassessment easier.


