    From Goethe, who said he preferred “injustice to disorder,” to Thomas Mann, who
    glorified in being nonpolitical, German intellectuals continued to live “above
    it all,” in “the land of poets and thinkers,” as Mme de Stael described the Germany
    of 1810. Those who continued to live in it all failed badly.


    Other nations sent their worst people after. Germany—drove, rather—best. Between
    Prince Metternich’s Mainz Commission of 1819 (the Un-German Activities Committee
    of its day) and the last renewal of Bismarck’s anti-Socialist laws in 1888, some
    four and a half million Germans came to the United States alone, 770,000 of them
    after the suppression of the Revolution of 1848. Wave after wave, after each wherever
    they went, the finest flower of immigration came to constitute, unsuccessful movement
    against autocracy. Their letters back brought home new and larger waves of their
    friends and relatives, who were, in large measure, moved more by economic opportunity
    than political hope or necessity—who, however, belonged to families or circles
