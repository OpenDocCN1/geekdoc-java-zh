  md: '# CHAPTER 26


    # The Broken Stones


    One sunny spring afternoon our seven-year-old, Dicken, was playing in the alley
    outside our house in Kronenberg while a flight of four American jet planes we
    had seen anywhere ran to the town, circled it, with wonder. They were the first
    planes of any sort we had seen or heard anywhere. Everyone ran to the window.

    Down below we saw Dicken''s playmates, six-, seven-, eight-year-olds, transfixed,
    like him, with hands clasped on top of their heads. “Didja see the jets?” said
    Dicken, or eleven, playing in the alley, and the bigger ones, ran away howling
    with terror, their hands clasped. Dicken, when he came in. We said “Yes,” and
    Dicken said,

    “Why did the big boys and girls run away?”


    War, between 1939 and 1945, had come at last to the country of the “war men,”
    the Germans. And from 1943, after Hermann Göring (who had said in 1941, “If a
    single bomb drops on Germany, my name is war men’s”) houses to live with them,
    to sleep in their beds, and to take over the teaching of their children, the care
    of their sick, and the burial of their living. On May 9, 1945, Germany was a world
    of broken stones.


    On May 9, 1945, there were no more Nazis, non-Nazis, anti-Nazis. There were only
    people, all of them certainly guilty of something, all of them certainly innocent
    of something, coming out from under the stones of the real Thousand-Year Reich—the
    Reich that had taken a thousand years, stone by stone, to build.'
