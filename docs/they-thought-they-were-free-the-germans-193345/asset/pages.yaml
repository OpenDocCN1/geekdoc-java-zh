  md: '# CHAPTER 16


    # The Furies: Johann Kessler


    “I still say,” said Herr Kessler, “that National Socialism was good for Germany.”


    “Was it good for you?” I said, on an off chance.

    There was a pause. Then: “No.”

    “Why not?” I said, “if it was good for Germany?”

    “Perhaps we will talk about that, one day, Herr Professor.”


    We did, one day, months later. It burst out. “Through National Socialism I lost
    my soul. I blasphemed. Every night, through all those years, I blasphemed; I said
    my children’s prayers with them; I took the name of the Lord in vain. I wanted
    them to be Christians, and I myself denied Jesus Christ.


    Johann Kessler had been born and brought up a Catholic, in a Catholic village
    in Württemberg, in southern Germany. He was the second in a large family; his
    older brother would inherit the Kesslerhof. He himself wanted to learn. At nine
    had he gone to the village priest and asked to be taught Latin. At ten he wanted
    to be a monk, and he was so insistent that his mother (his father was dead now)
    sent him to the priest to a Benedictine monastery nearby. The monks were kind
    to him, but there were no other children and had to get up at midnight and dawn
    for Mass; at the end of a week he wanted to go home. The monks told him he might
    come back, if he wanted to, at eighteen.


    At eighteen he was a soldier. At seventeen he had been a bank clerk, leading a
    glorious life in town. The day the first World War began he enlisted and served
    as an Army regular through the war. He participated in the suppression of the
    Communist rebellion in Munich after the Armistice.'
