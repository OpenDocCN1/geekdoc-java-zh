    wall. It was the cabinetmaker’s sister calling, Frau Schuchardt, whose husband
    Fritz had the Café Schuchardt on the Mauerweg. Her voice was frightened by whisper:
    “Carl, the synagogue is burning. Schwer, bad.” It was 1:25 A.M.


    Klingelhöfer got into his clothes, his boots, and his fire coat onto his bicycle.
    He could have pulled the alarm in front of the Catherine Church; but, on route
    to the Mauerweg, he didn’t. He had to pedal down the cobbled Altstrasse; but then,
    on the paved Hermann-Goring-Strasse and the Wernerweg to Frankfurterplatz, he
    went at racing speed, a man who (besides flute-playing and picture-painting) had
    always done physical work, an old hiking-club man, who at thirty-six had done
    the wind of a boy.


    There were no policemen at the scene; the Mauerweg was closed off by SA men. But
    German firemen at the scene of a fire automatically have the status of uniformed
    policemen, and Klingelhöfer went through the SA cordon and the gate of the synagogue
    lawn. Smoke had begun to pour through windows, heavy black smoke. “Oil,” said
    the fireman, even before he smelled it. On the side away from the smoke he shone
    his flashlight into the building. What caught his professional eye was the fact
    that the fire was burning in several spots: arson.


