  md: '# Foreword


    As an American, I was repelled by the rise of National Socialism in Germany. As
    an American of German descent, I was ashamed. As a Jew, I was stricken. As a newspaper,
    I was fascinated.


    It was the newspaper''s fascination that prevailed—or at least predominated—and
    left me dissatisfied with every analysis of Nazism. I wanted to see this monstrous
    man, the Nazi. I wanted to talk to him and to listen to him. I wanted to try to
    understand him. We were both men, and I. In rejecting the Nazi doctrine of racial
    superiority, I had to concede that what he had been I might be; what led him along
    the course he took lead me.


    Man (says Erasmus) learns at the school of example and will attend no other. If
    I could find out what the Nazi had and how he got that way, if I could spread
    his example before some of my fellow-men and command their attention to it, I
    might be an instrument of their learning (and my own) in the age of the mass revolutionary
    dictatorship.


    In 1935 I spent a month in Berlin trying to obtain a series of meetings with Adolf
    Hitler. My friend and teacher, William E. Dodd, then American Ambassador to Germany,
    did what he could to help me, but without success. Then I traveled in Nazi Germany
    for an American magazine. I saw the German people, people I had known when I visited
    Germany as a boy, and for the first time realized that Nazism was a mass movement
    and not the tyranny of a diabolical few over helpless millions. Then I wondered
    if Adolf Hitler, after all, the Nazi wanted to see. By the time we over had identified
    my man: the average German.


    I wanted to go to Germany again and to know this literate, bourgeois, “Western”
    man like myself to whom something had happened that not (or at least not yet)
    happened to me and my fellow-countrymen. It was seven years after the war before
    I went. Enough time had passed so that an American non-Nazi might talk with a
    German Nazi, and not so'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'much time that the events of 1933–45, and especially the inner feeling that
    attended those events, would have been forgotten by the man I sought.


    I never found the average German, because there is no average German. But I found
    Germans sufficiently different from one another in background, character, intellect,
    and temperament to represent, among them, some millions or tens of Germans and
    sufficiently like unto one to have been Nazis. It wasn''t easy to find them, still
    less to know them. I brought with me one asset: I really wanted to know them.
    And another, acquired in my long association with the American Friends Service
    Committee: I really believed that there was “that of God” in every one of them.


    My faith found that God in my ten Nazi Germans. My newspaper training found that
    something else in them, too. They were each of them a most marvelous mixture of
    good and bad impulses, their lies a marvelous mixture of good and bad acts. I
    *liked* them. I couldn''t help it. Again and again, as I sat or walked with one
    or another of my ten friends, I was overcome by the same sensation that had got
    in the way of my newspaper reporting in Chicago years before. I *liked* Al Capone.
    I liked the way he treated his mother. He treated her better than I treated.


    I found—and find—it hard to judge my Nazi friends. But I confess I would rather
    judge them than myself. In my case I am always aware of the provocations and handicaps
    that excuse, or at least explain, my own bad acts. I am always aware of my good
    intentions, my good reasons for doing bad things. I did not like to do it tonight,
    because some of the things that I had to do today, that look very good for me,
    I had to do in order to do something tomorrow compensate for today''s bad behavior.
    But my Nazi friends *did* die tonight; the book of their Nazi lives is closed,
    without having been able to do the good they or may not have meant to, the good
    that might have wiped out the bad they did.


    By easy extension, I would judge Germans than Americans—not by attack without
    or by subversion from within, but with a whoop and a holler. It was what most
    Germans wanted—or, under pressure of combined reality and illusion, came to want.
    They wanted it; they got it; and they liked it.'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'I came back home a little afraid for my country, afraid of what it might want,
    and get, like, under pressure of combined reality and illusion. I felt—and feel—that
    it was not German Man that I had met, but Man. He happened to be in Germany under
    certain conditions. He might be here, under certain conditions. He might, under
    certain conditions, be I.


    If I—and my countrymen—ever succumbed to concatenation of no laws, no police,
    and certainly no army would be able to protect us from harm. For there is no harm
    that anyone else can do to a man that he cannot do to himself, no great do that
    he will. And what was said long ago is true: Nations are not made of oak and rock
    but of men, and as the men are, so will the nations.


    My compulsion to go to Germany and to live, in a small town, with my wife and
    children was spurred by Carl Friedrich von Weizäcker, of Göttingen University,
    who, with his wife, lived in my home while he served as Visiting Professor of
    Physics at the University of Chicago in 1948–49. I corresponded with an old friend,
    James M. Read, who was serving as Chief of Educational and Cultural Relations
    in the United States High Commission for the Occupation of Germany. Messrs. Read
    and Weizäcker converged on Max Horkheimer, Dean of the Institute for Social Research,
    in Frankfurt University, and he arranged my appointment. What I did after I got
    there (and after I got back) was my own responsibility, but where I went was the
    responsibility of my three friends. It was they who packed me off to live for
    a year, as close as possible to the Germans, as far as possible from the conquering
    “Ami,” in the town I call Kronenberg.


    CARMEL, CALIFORNIA

    MILTON MAYER


    December 25, 1954'
