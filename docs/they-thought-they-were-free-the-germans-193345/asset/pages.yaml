  md: 'These ten men were not men of distinction. They were not men of influence.
    They were not opinion-makers. Nobody ever gave them a free sample of anything
    on the ground that what they thought of it would increase the sales of the product.
    Their importance lay in the fact that God—as Lincoln said of the common people—had
    made so many of them. In a nation of seventy million, they were the sixty-nine
    million plus. They were the Nazis, the little men to whom, they voiced their own
    views outside their own circles, bigger men politely to listen without ever asking
    them to elaborate.


    A year’s conversations, in their own language, under informal conditions involving
    meals, “a glass of wine,” or more precisely, a cup of coffee, exchange of family
    visits (including the children), and easy evenings, Saturday afternoons, or Sunday
    walks—these were things that not one of my ten friends had supposed possible with
    an American. None of them had any official American contacts. None had been to
    America or England or outside Germany as civilians, excepting the teacher, who
    had spent much time in France. None spoke English.


