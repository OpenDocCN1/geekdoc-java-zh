  md: '# The Furies: Heinrich Hildebrandt


    How was I to know, or to find out, how much my friends had suffered (if they had
    suffered at all) or whether they had suffered enough? If, as doctrine has it,
    man is perfected by suffering, none of my friends suffered enough, for none of
    them, I could see, even in my imperfect knowledge of them, was perfect.


    Seven of them ducked my question. My question, which I framed very carefully and
    put to them in a variety of ways in the last weeks of our conversations, was,
    “What did you do that was wrong, as you understand right and wrong, and what didn’t
    you do that was right?” The instinct that throws ramparts around the self-love
    of all of us came into immediate operation; my friends, in response, spoke of
    what was legal or illegal, or what was popular or unpopular, or what others did
    or didn’t do, or what was provoked or unprovoked. But I was interested, at this
    point, in none of these things. “Who knows the secret heart?” I knew all about
    Versailles and the Polish Corridor and the inflation, the unemployment, the Communists,
    the Jews, and the Talmud.


