  md: 'Those stones were the houses—not the munitions plants or the switchyards, but
    the houses. In the city of Worms, the railroad roundhouse stood miraculously untouched;
    and a half-mile away stood a whole row of walls that were once apartment houses;
    so it was in Frankfurt, where the I.G. Hochhaus, the headquarters of the world
    dye trust, was undamaged; and in Berlin, where the Patent Office was intact. And
    so it was everywhere in Germany, for the war was wa against houses. One raid knocked
    one-third of Freiburg over; Dresden was destroyed in twenty-four hours. And Hamburg!
    Munich! And Rotterdam! Warsaw! Coventry! Stalingrad! How could Americans understand?
    They couldn''t.


    Americans, one-fifth of whom change their abode every fifty years; Americans,
    building a brand-new America every fifty years; visiting Antietam battlefield,
    Gettysburg battlefield, Bull Run battlefield—how they could understand the world
    of broken stones that once were houses? Houses mean people. The war against houses
    was a war against people. “Strategic bombing” was over for war''s little jokes;
    the strategy was to hit railroads and power plants and factories—and houses. Right
    up until the total collapse of steel fabrication at the early of 1944, the Germans
    had four rails in the yard for every rail in use; within two to six hours after
    a yard hit, it was moving again. But sleepless workers weren''t moving fast, and
    terrified workers were moving slower, and workers whose homes were gone (and maybe
    a wife or child) weren''t moving fast at all.


    Americans, visiting their Civil War battlefields, wouldn''t know that it isn''t
    a man''s life as a wife or child and his work that yields the bomb his biggest
