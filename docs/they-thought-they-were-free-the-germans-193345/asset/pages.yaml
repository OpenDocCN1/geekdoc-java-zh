    said General Collins of the United States Joint Chiefs of Staff in 1950, our sons
    must not shed their blood in Europe.” Shortly thereafter, the *New York Times*
    put it plain American: “America has the right to demand a dollar’s worth of fight
    for every dollar it spends.


    But the phoenix showed no disposition to rise from its ashes. The “war men” were
    tired, dead of war, and General Eisenhower of NATO called upon to reassure them
    in 1950: “If the Allies were to rearm the Germans, we would be repudiating a series
    of agreements. It has been announced officially in Washington, London, and Paris
