  \ | | ItemStack | 返回玩家手中的物品。 |\n| `Player.teleport(position)` | `position`: Location\
  \ | | 将玩家传送到指定位置。 |\n\n# 第 15 章：持久化存储信息\n\n在编写标牌插件时，你已经遇到了使用变量带来的一个缺点：一旦服务器停止，所有存储在变量中的信息都会丢失。对于许多插件来说，这不是问题，但对于某些插件（例如标牌插件），这意味着在服务器重启后将丢失重要信息。\n\
  \n因此，我们将在本章中学习持久化存储信息的各种方法，以便它们在服务器重启后仍然可用。\n\n## 15.1 配置文件\n\n在设置 CanaryMod 服务器时，你已经接触过配置文件。它们是简单的文本文件，主要用于存储设置。它们的优点是易于使用，并且可以手动修改。它们主要适用于频繁读取但较少修改的数据。相比之下，它们对于海量数据并不太适用。\n\
  \n### 15.1.1 读取\n\n你创建的每个插件都拥有自己的配置文件，即 `plugin.yml`。我们将创建的下一个插件也同样从这样一个配置文件开始，你可以在\
  \ Listing 15.1 中看到它。像往常一样，你将其放在插件文件夹中的新文件夹里，或者如果你使用 Eclipse，则创建一个新项目。\n\n```\n1\
  \  name: Config-Plugin\n2  main: ConfigPlugin\n3  api-version: 1.15\n4  version:\
  \ 1.0 \n```\n\n**Listing 15.1:** `plugin.yml`\n\n与以往不同，这次我们在这个文件夹或项目中又创建了第二个配置文件，它的名为\
  \ `config.yml`，你可以在 Listing 15.2 中看到它的内容。\n\n```\n1  nachricht: Hallo Welt! \n```\n\
  \n**Listing 15.2:** `config.yml`\n\n现在缺少真正的插件了。它这次的内容非常短，你可以在 Listing 15.3 中看到。你只需要一行代码，即第\
  \ 5 行，就可以从配置文件 `config.yml` 中读取一个值。通过 `this.getConfig()` 你首先可以访问该文件，然后通过 `getString`\
  \ 告诉你的插件你想从配置文件中读取一个字符串。现在你只需要指定存储值的名称（在本例中为 `nachricht`），该值就可以存储在变量中并在之后输出到服务器控制台。\n\
  \n```\n1  import org.bukkit.plugin.java.JavaPlugin;\n2  \n3  public class ConfigPlugin\
  \ extends JavaPlugin {\n4      public void onEnable() {\n5          String nachricht\
  \ = this.getConfig().getString(\"nachricht\");\n6          this.getLogger().info(nachricht);\n\
  7      }\n8  \n9      public void onDisable() {\n10     }\n11  } \n```\n\n**Listing\
  \ 15.3:** Config-Plugin\n\n为了让这一切真正生效，在打包 Jar 文件时（特别是当你手动创建时），必须注意将 `config.yml`\
  \ 也打包进压缩包。相应的命令应为 `jar -cf ConfigPlugin.jar ConfigPlugin.class plugin.yml config.yml`。你预输出可以在\
  \ Listing 15.4 中看到。\n\n```\n1  Config-Plugin: Enabling Plugin\n2  Config-Plugin:\
  \ Hallo Welt!\n```\n\n**Listing 15.4:** 插件输出\n\n与以往不同，这次我们在这个文件夹或项目中又创建了第二个配置文件，名为\
  \ `config.yml`，你可以在 Listing 15.2 中看到它的内容。\n\n```\n1  nachricht: Hallo Welt! \n```\n\
  \n**Listing 15.2:** `config.yml`\n\n（此处省略原文中重复的说明性文本及代码块，保持翻译逻辑一致）\n\n\n\n\n我们在这一章中追求的目标，即从插件中持久化存储信息，仅靠读取还无法让我们更近一步。虽然我们可以将信息从配置文件加载到插件中，但到目前我们还无法将信息从插件中保存。因此，我们现在在本节中处理这个问题。\n\
  \n我们使用一个简单的插件作为示例，它统计服务器启动的次数。如果仅使用变量，这样的插件是无法实现的，因为变量在每次服务器启动时都会丢失它们的“记忆”。相比之下，使用配置文件可以相对容易地实现这样一个插件。\n\
  \n开头一如既往是 `plugin.yml`，你可以在 Listing 15.7 中看到它。\n\n```\n1  name: Zaehl-Plugin\n\n\
  2  main: ZaehlPlugin\n\n3  api-version: 1.15\n\n4  version: 1.0 \n```\n\n**Listing\
  \ 15.7:** `plugin.yml`\n\n与上一个插件一样，我们这次仍然在插件文件夹中创建一个名为 `config.yml` 的文件。正如你在 Listing\
  \ 15.8 中看到的，它由一个名为 `zaehler` 的条目组成，其初始值为 0。\n\n```\n1  zaehler: 0 \n```\n\n**Listing\
  \ 15.8:** `config.yml`\n\n插件文件夹中的配置文件始终包含配置的默认或初始值，并且无法修改。因此，如果你想存储值，必须先创建一个初始配置的副本。关于如何操作，你可以在\
  \ Listing 15.9 中看到。\n\n```\n 1  import org.bukkit.plugin.java.JavaPlugin;\n\n 2\
  \  \n\n 3  public class ZaehlPlugin extends JavaPlugin { \n\n 4      public void\
  \ onEnable() {\n\n 5      this.saveResource(\"config.yml\", false);\n\n 6      }\n\
  \n 7   \n\n 8      public void onDisable() {\n\n 9      }\n\n10  } \n```\n\n**Listing\
  \ 15.9:** 复制默认配置\n\n当你在此此状态下运行插件时，你会观察到它会在插件文件夹中创建一个名为“Zaehl-Plugin”的新文件夹，这就是你插件的数据文件夹。在这个数据文件夹中，你会找到\
  \ `config.yml` 的副本。这是由 `saveResource` 命令确保的，它将插件文件夹中的一个文件复制到插件的数据文件夹中，然后在那里对该文件进行修改。除了要复制的文件名（在此例中为\
  \ `config.yml`）之外，你还需要指定如果文件已经复制，插件应该如何表现。第二个参数为 `true` 将确保文件在每次启动时都用默认配置进行覆盖，因此计数器将在每次启动时都重置为\
  \ 0。这对于计数插件来说显然没有意义。因此，作为参数的 `false` 确保了只有在数据文件夹中尚不存在时才第一次复制。一旦你的配置文件位于数据文件夹中，你就可以在不需要任何编程知识的情况下手动修改它，而无需每次都重新创建\
  \ Jar 文件。\n\n在 Listing 15.10 中，你可以看到如何从这个复制的配置文件中读取值。为此，你必须首先在第 9 行指定文件的路径。该路径由\
  \ `getDataFolder()` 命令提供的数据文件夹路径以及配置文件的文件名组成。\n\n使用此路径和 `YamlConfiguration.loadConfiguration`\
  \ 命令，你可以加载配置文件并存储在一个变量中，这里是 `config`。有了这个变量，你就可以像之前学过的那样，例如通过 `getString`、`getInt`\
  \ 等来访问已有的值。\n\n第 12 行正是执行了这一操作，并将从配置文件读取的值加 1，以便在下一行输出它。\n\n```\n 1  import java.io.File;\n\
  \n 2  import org.bukkit.configuration.file.YamlConfiguration;\n\n 3  import org.bukkit.plugin.java.JavaPlugin;\n\
  \n 4  \n\n 5  public class ZaehlPlugin extends JavaPlugin { \n\n 6      public void\
  \ onEnable() {\n\n 7          this.saveResource(\"config.yml\", false);\n\n 8  \
  \        \n\n 9          File datei = new File(this.getDataFolder(), \"config.yml\"\
  );\n10          YamlConfiguration config = YamlConfiguration.loadConfiguration(datei);\n\
  \n11          \n12          int zaehler = config.getInt(\"zaehler\") + 1;\n13  \
  \        System.out.println(zaehler);\n```\n**Listing 15.10:** 读取复制的配置文件\n\n当你现在运行插件时，它会在启动时显示服务器是第一次启动。如果你现在手动更改数据文件夹中的\
  \ `config.yml`，下次启动时将加载新值。\n\n为了持久化保存更改，你必须将值写回文件。\n\n```\n 1  import java.io.File;\n\
  \n 2  import java.io.IOException;\n\n 3  import org.bukkit.configuration.file.YamlConfiguration;\n\
  \n 4  import org.bukkit.plugin.java.JavaPlugin;\n\n 5  \n\n 6  public class ZaehlPlugin\
  \ extends JavaPlugin { \n\n 7      public void onEnable() {\n\n 8          this.saveResource(\"\
  config.yml\", false);\n\n 9          \n10          File datei = new File(this.getDataFolder(),\
  \ \"config.yml\");\n11          YamlConfiguration config = YamlConfiguration.loadConfiguration(datei);\n\
  \n12          \n13          int zaehler = config.getInt(\"zaehler\") + 1;\n14  \
  \        this.getLogger().info(\"服务器第 \" + String.valueOf(zaehler) + \" 次启动.\");\n\
  \n15          \n16          config.set(\"zaehler\", zaehler);\n17          try {\n\
  18              config.save(datei);\n19          }\n20          catch(IOException\
  \ e){\n21              e.printStackTrace();\n22          }\n23      }\n\n24   \n\
  \n25      public void onDisable() {\n\n26      }\n27  }\n```\n**Listing 15.11:**\
  \ 写入配置文件\n\n记住\n\n配置中的更改只有通过调用 `save` 方法才会保存到相关的配置文件。\n\n使用 `set` 命令，你还可以向配置文件添加新条目，因为分配了值的不存在的条目会自动添加到文件中。通过点表示，例如\
  \ `set(\"zahlen.zahl1\", 42)`，可以通过这种方式对元素分组。\n\n## 15.2 在文件中保存对象\n\n如果你想存储大量数据，如所述，配置文件并不是特别好的解决方案。因此，如果你想持久化存储例如标牌插件的信息，你应该采用另一种方法。\n\
