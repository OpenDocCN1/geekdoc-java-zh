  \    //那只是土！\n\n10      }\n\n11  }\n\n12  else{\n\n13      //我对这个不感兴趣！\n\n14  }\
  \ \n```\n\n**Listing 8.7:** 使用 `else` 的解决方案\n\n但这个解决方案并没有好到哪里去，因为仍然需要列出所有情况，只不过是在开头。此外，和上一个解决方案一样，这里也执行了不必要的步骤：如果是一个金块，程序会输出第一条消息。之后程序其实可以停止，但它实际上还会检查所有后续条件，尽管很清楚这些条件已经不再可能为真。\n\
