  \ Listing 6.30 中是四个。文件柜的抽屉从“0”开始编号。对于一个有四个抽屉的文件柜，第一个抽屉是“0”，第二个是“1”，第三个是“2”，第四个是“3”。起初可能有些困惑，但随着时间的推移你会习惯的，因为程序员经常从\
