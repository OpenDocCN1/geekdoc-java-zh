  \ extends JavaPlugin {\n 7      public Material gesuchterGegenstand;\n 8      public\
  \ int anzahl;\n 9      public HashMap<UUID, Integer> gesammelt;\n10      \n11  \
  \    public void onEnable() {\n12      \n13      }\n14      \n15      public void\
  \ onDisable(){\n16      }\n17  } \n```\n\n**Listing 16.10:** 收集游戏骨架\n\n在 Listing\
  \ 16.11 中，你还会找到所需监听器的骨架。\n\n```\n 1  import org.bukkit.event.EventHandler;\n 2 \
  \ import org.bukkit.event.Listener;\n 3  import org.bukkit.event.player.PlayerPickupItemEvent;\n\
  \ 4  \n 5  public class PickupListener implements Listener {\n 6      @EventHandler\n\
  \ 7      public void onEvent(PlayerPickupItemEvent event){\n 8  \n 9      }\n10\
  \ }\n```\n\n**Listing 16.11:** 监听器骨架\n\n### 16.2.2 启动插件\n\n在游戏开始之前，必须启动插件。这通常发生在\
  \ `onEnable` 函数中的 Listing 16.12。在第二行首先初始化变量 `gesammelt`，然后注册监听器。\n\n```\n 1  public\
  \ void onEnable() {\n 2      gesammelt = new HashMap<UUID, Integer>();\n 3     \
  \ \n 4      PluginManager pluginManager = this.getServer().getPluginManager();\n\
  \ 5      \n 6      PickupListener listener = new PickupListener();\n 7      pluginManager.registerEvents(listener,\
  \ this);\n 8      \n 9      neueRundeStarten();\n10 }\n```\n\n**Listing 16.12:**\
  \ `onEnable` 函数\n\n插件的实际启动正如第 9 行所示，被提取到了名为 `neueRundeStarten` 的函数中。这简化了你的工作，因为当一个回合结束并需要开始新回合时，可以执行相同的命令。\n\
  \n具体哪些命令你可以在 Listing 16.13 中看到。首先会将变量 `gesammelt` 中的所有条目重置为零。这在服务器启动时是不需要的，因为此时该变量是空的，但由于之前提到的，该函数在回合结束后被调用，所以这些行不能缺少。\n\
  \n```\n 1  public void neueRundeStarten(){\n 2      Random zufallsgenerator = new\
  \ Random();\n 3      \n 4      UUID[] spielerListe = gesammelt.keySet().toArray(new\
  \ UUID[gesammelt.size()]);\n 5      \n 6      for(int i = 0; i < spielerListe.length;\
  \ i++){\n 7          gesammelt.put(spielerListe[i], 0);\n 8      }\n 9  \n10   \
  \    Material[] gegenstaende = {Material.YELLOW_FLOWER, Material.RED_ROSE, Material.EGG};\n\
  \ 11      gesuchterGegenstand = gegenstaende[zufallsgenerator.nextInt(gegenstaende.length)];\n\
  \ 12      anzahl = zufallsgenerator.nextInt(4)+1;\n 13      \n 14          ItemStack\
  \ g = new ItemStack(gesuchterGegenstand);   \n 15          this.getServer().broadcastMessage(\"\
  Neue Runde! Sammle \" + anzahl + \" \" + g.getItemMeta().getDisplayName() + \"!\"\
  );\n16  } \n```\n\n**Listing 16.13:** `neueRundeStarten`-函数\n\n为了防止游戏很快无味，不应该在每一回合都寻找相同的物品。因此，在第\
  \ 10 行，通过数组规定了插件应该从哪些物品中随机选择下一个任务。在示例中只有三个物品，你自然可以任意扩展该数组。\n\n\n\n\n要随机选择一个物品，你首先需要一个在第\
  \ 2 行初始化的随机生成器。一旦完成，你就可以使用 `nextInt(obereGrenze)` 命令生成一个从 0（包含）到指定的上限（不包含）之间的随机数。例如，`nextInt(4)`\
  \ 命令可以产生 0、1, 2 或 3 的结果。因此，对于数组来说，`array[zufallsgenerator.nextInt(array.length)]`\
  \ 会返回数组中的一个随机元素。\n\n此外，插件在第 12 行也会随机决定要找到多少次目标物品。由于寻找 0 次物品没有意义，因此这里会生成一个 0 到 4\
  \ 之间的随机数，然后加 1，因此可能的结果为 1、2、3 和 4。在函数的末尾，玩家还会被通知当前的任务是什么。\n\n### 16.2.3 玩家进入服务器\n\
