  \n**Listing 10.6：** `AutoInfoPlugin` 基础骨架\n\n\n\n通过这条信息，编译器想告诉你它不认识一个名为 `Auto` 的类。它又能从哪里认识呢，该类的定义在另一个文件中，所以我们必须告诉编译器在编译时也考虑该文件。\n\
  \n### 注意\n\n如果你使用 Eclipse 进行编程，则不会出现此错误，你可以直接跳到下一个章节。\n\n由于 `Auto` 类文件与 `AutoInfoPlugin`\
  \ 类位于同一个目录下，只需在命令末尾添加文件名即可，因此适用于 Windows 和 Bukkit 的完整命令如下：\n\n```\njavac AutoInfoPlugin.java\
  \ -cp C:\\server\\craftbukkit-1.15.1.jar Auto.java \n```\n\n或者对于 macOS：\n\n```\n\
  javac AutoInfoPlugin.java -cp /Users/Benutzername/server/craftbukkit-1.15.1.jar\
  \ Auto.java \n```\n\n以及 GNU/Linux：\n\n```\njavac AutoInfoPlugin.java -cp /home/Benutzername/server/craftbukkit-1.15.1.jar\
  \ Auto.java \n```\n\n对于 Windows 和 Spigot：\n\n```\njavac AutoInfoPlugin.java -cp\
  \ C:\\server\\spigot-1.15.1.jar Auto.java \n```\n\n或者对于 macOS：\n\n```\njavac AutoInfoPlugin.java\
  \ -cp /Users/Benutzername/server/spigot-1.15.1.jar Auto.java \n```\n\n以及 GNU/Linux：\n\
  \n```\njavac AutoInfoPlugin.java -cp /home/Benutzername/server/spigot-1.15.1.jar\
  \ Auto.java \n```\n\n如果你在编译后查看 plugins 文件夹，你会发现编译器现在生成了两个 `.class` 文件，每个 Java 文件对应一个。为了让最终的插件无无地从服务器加载，你必须确保生成的两个文件都被添加到\
  \ Jar 归档中。因此，打包文件的新命令为 `jar -cf AutoInfoPlugin.jar AutoInfoPlugin.class Auto.class\
  \ plugin.yml`。现在将此打包好的存档移动到服务器的插件文件夹并启动服务器，插件应该就能无问题地加载。\n\n## 10.3 类中的函数\n\n正如提到的，该插件目前还没有执行任何对用户可见的操作。实际上，你为止只是忙于使用构造函数在对象中存储信息。但只有当这些信息之后可以被检索时，这样做才有意义。为了解释这一点，我们再次回到一个老朋友：墙壁插件。如果你想用一个类来映射某个东西，无论是汽车还是墙壁，起初总是面临同一个问题：关于类对象的哪些信息对我的程序是重要的？如果你查看上一章节中的墙壁插件版本，立刻会有三条信息（或者用我们现在说的“属性”）映入眼帘：高度、宽度和材质。这就是你建造一堵墙所需的三个信息。\n\
  \n由此产生了 Listing 10.9 所示的 `Mauer` 类的定义。正如你可能预料的那样，你在这里发现了定义的三个属性和一个构造函数。\n\n```\n\
  \ 1  import org.bukkit.Material;\n\n 2  \n\n 3  class Mauer {\n\n 4      int hoehe;\n\
  \n 5      int breite;\n\n 6      Material material;\n\n 7      \n\n 8      public\
  \ Mauer(int hoehe, int breite, Material material) {\n\n 9          this.hoehe =\
  \ hoehe;\n10          this.breite = breite;\n11          this.material = material;\n\
  12      }\n13  } \n```\n\n**Listing 10.9:** 墙壁类\n\n然而，该类的构造函数有一个特殊之处。在第 6 章你学过：没有两个变量具有相同的名称。现在我们到了已经预告的例外。首先，你已经学过函数中的变量也只能在该函数内部使用。因此，像\
  \ Listing 10.10 那样的配置并没有问题，尽管有两个同名的变量，因为这两个变量位于不同的函数中。\n\n```\n1  public void funktionEins(){\n\
  2      int test = 1;\n3  }\n4  \n\n5  public void funktionZwei(){\n6      int test\
  \ = 2;\n7  } \n```\n\n**Listing 10.10:** 不同函数中的同名变量\n\n\n\nWie du in Listing 10.13\
  \ sehen kannst, reicht es nun, der `mauerBauen`-Funktion neben dem Spieler ein `Mauer`-Objekt\
