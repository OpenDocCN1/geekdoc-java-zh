  \ beendet und neu gestartet, geht die Liste der Schilder verloren, und bereits aufgestellte\
  \ Schilder können daher nicht mehr geändert werden. Wie es möglich ist, Informationen\
  \ dauerhaft zu speichern, damit sie erhalten bleiben, auch wenn der Server ausgeschaltet\
  \ wird, wirst du im späteren Verlauf des Buches aber noch sehen.\n\n## 12.5  Rätsel\n\
  \n\n\n\n想象一下你有一个包含 5 个元素的字符串列表。你必须如何操作才能交换第二个元素和第四个元素（即索引 1 和索引 3）的位置？\n\n## 12.6\
  \ 总结\n\n| 术语 | 含义 |\n| --- | --- |\n| List (列表) | Java 中的一种数据类型，行为类似于数组，但长度不是固定的。\
  \ |\n| UUID | 用于识别实体的唯一 ID，例如玩家。 |\n\n| 命令 | 参数 | 返回值 | 描述 |\n| --- | --- | ---\
  \ | --- |\n| `Sign.setLine(zeile, text)` | `zeile:` Integer, `text:` String | |\
  \ 设置指定行牌牌的文本。 |\n| `List<Typ> liste = new ArrayList<Typ>()` | `typ`: 任意变量类型 | |\
  \ 创建一个指定类型的新 ArrayList。 |\n| `List<Typ> liste = new LinkedList<Typ>()` | `typ`:\
  \ 任意变量类型 | | 创建一个指定类型的新 LinkedList。 |\n| `liste.add(wert)` | `liste`: List, `wert`:\
  \ 与列表相同类型 | | 向列表中添加指定的值。 |\n| `liste.add(index, wert)` | `liste`: List, `index`:\
  \ Integer, `wert`: 与列表相同类型 | | 在指定位置向列表添加指定的值。 |\n| `liste.remove(wert)` | `liste`:\
  \ List, `wert`: 与列表相同类型 | Boolean | 从列表中移除指定值的首次出现。 |\n| `liste.remove(index)` |\
  \ `liste`: List, `index`: Integer | Boolean | 从列表中移除指定位置的元素。 |\n| `liste.clear()`\
  \ | `liste`: List | | 清空列表。 |\n| `liste.get(index)` | `liste`: List, `index`: Integer\
  \ | 与列表相同类型 | 返回指定位置的元素。 |\n| `liste.set(index, wert)` | `liste`: List, `index`:\
  \ Integer, `wert`: 与列表相同类型 | | 将指定位置的元素设置为指定的值。 |\n| `liste.indexOf(wert)` | `liste`:\
  \ List, `wert`: 与列表相同类型 | | 返回指定元素首次出现的索引。 |\n| `liste.contains(wert)` | `liste`:\
  \ List, `wert`: 与列表相同类型 | Boolean | 检查列表中是否包含指定的值。 |\n| `Player.getTargetBlock(materialien,\
  \ entfernung)` | `materialien`: Set<Material>, `entfernung`: Integer | Block | 返回玩家正在查看区块，只要它在指定的范围内。所有传递的材质都会被视为空气。\
  \ |\n| `Player.getLineOfSight(materialien, entfernung)` | `materialien`: Set<Material>,\
  \ `entfernung`: Integer | List<Block> | 类似于 `getTargetBlock`，但玩家和目标区块之间的所有区块也会以列表形式返回。\
  \ |\n| `Player.getUUID()` | | UUID | 返回玩家的 UUID。 |\n\n# 第 13 章：Listener（监听器）\n\n\
  目前，你已经学习了许多影响和改变游戏世界的各种方法。到为止，触发这些变化的因素一直是玩家输入命令。但在本章中，你将看到，也可以编写插件使其对世界的变化做出反应，例如当某个区块被破坏或玩家进入某个区域时。这类插件也被称为\
  \ `Listener`（英语中意为“听者”），因为它们会不断地“倾听”游戏世界以发现变化。\n\n## 13.1 基础结构\n\n所有响应聊天命令的插件都有一个共同的\
  \ `onCommand` 函数的基础结构。Listener 插件也有这样的基础结构，你可以在 Listing 13.1 中看到它。\n\n```\n 1  import\
  \ org.bukkit.plugin.PluginManager;\n 2  import org.bukkit.plugin.java.JavaPlugin;\n\
  \ 3  import org.bukkit.event.Listener;\n 4  import org.bukkit.event.Event;\n 5 \
  \ import org.bukkit.event.EventHandler;\n 6  \n 7  public class ListenerPlugin extends\
  \ JavaPlugin {\n 8      public class MeinListener implements Listener {\n 9    \
  \      @EventHandler\n10          public void onEvent(Event event){\n11        \
  \      //在此处编写代码\n12          }\n13      }\n14      \n15      public void onEnable()\
  \ {\n16          PluginManager pluginManager = this.getServer().getPluginManager();\n\
  17          MeinListener listener = new MeinListener();\n18          pluginManager.registerEvents(listener,\
  \ this);\n19      }\n20  \n21      public void onDisable() {\n22      }\n23 }\n\
  ```\n**Listing 13.1:** Listener 的基础结构\n\n真正的 Listener（即可以对世界做出反应的部分）位于第 8 到 13 行。如你所见，Listener\
  \ 是了一个类。在 `onEnable` 函数中，必须注册 Listener，以便你的插件知道应该关注哪些事件。这在第 16 到 18 行通过 `PluginManager`\
  \ 完成。对于 Listener 插件，`plugin.yml` 没有特殊要求；如 Listing 13.2 所示。\n\n```\n1  name: Listener-Plugin\n\
  2  main: ListenerPlugin\n3  api-version: 1.15\n```\n**Listing 13.2:** Listener 的\
  \ `plugin.yml`\n\n## 13.2 玩家事件\n\n如果你到这里还没有理解这个原理，不要担心，通过一个具体的例子会变得非常清晰。想象你想编写一个插件，每当有玩家进入你的服务器时，就向他们发送一条欢迎消息。用我们之前的手段这是无法可能的，因为插件如何识别玩家何时进入服务器呢？而使用新的\
  \ Listener，这就不是问题了。Minecraft 中有很多种不同的事件你将在本章中学习，每个 Listener 都会监听此类事件。其中一个事件是 `PlayerJoinEvent`，它在玩家进入服务器时总是触发。关于如何在插件中使用此事件，请看\
  \ Listing 13.3。在那里，相对于基础结构中的 `Event` 类导入，你在第 5 行找到的是 `PlayerJoinEvent` 的导入。下方还导入了\
  \ `Player` 类，但你已经熟悉它了。\n\n```\n1  import org.bukkit.plugin.PluginManager;\n 2  import\
  \ org.bukkit.plugin.java.JavaPlugin;\n 3  import org.bukkit.event.Listener;\n 4\
  \  import org.bukkit.event.EventHandler;\n 5  import org.bukkit.event.player.PlayerJoinEvent;\n\
  \ 6  import org.bukkit.entity.Player;\n 7  \n 8  public class ListenerPlugin extends\
  \ JavaPlugin {\n 9      public class MeinListener implements Listener {\n10    \
  \      @EventHandler\n11          public void onEvent(PlayerJoinEvent event){\n\
  12                  Player spieler = event.getPlayer();\n13                  spieler.sendMessage(\"\
  欢迎来到我的服务器！\");\n14          }\n15      }\n16      \n17      public void onEnable()\
  \ {\n18          PluginManager pluginManager = this.getServer().getPluginManager();\n\
  19          MeinListener listener = new MeinListener();\n20          pluginManager.registerEvents(listener,\
  \ this);\n21      }\n22  \n23      public void onDisable() {\n24      }\n25 }\n\
  ```\n**Listing 13.3:** 使用 `PlayerJoinEvent` 的插件\n\n\n\n\n正如前面提到的，每个监听器（Listener）始终只关注一个事件；具体是哪一个是在第\
  \ 11 行定义的，在这种情况下自然是 `PlayerJoinEvent`。\n\n但经常会出现多个事件同时发生的情况。在这种情况下，可以通过事件优先级（Event\
  \ Priority）来确定哪个事件最重要，并因此让服务器优先处理。最重要的事件带有优先级 `HIGHEST`，稍次重要但仍然重要的事件优先级是 `HIGH`。正如你可能已经猜到的，`NORMAL`\
  \ 是普通的、平均的优先级。不重要的事件可以具有 `LOW` 优先级，而特别不重要的事件具有 `LOWEST` 优先级。\n\n优先级可以在 `@EventHandler`\
  \ 行中设置，例如使用 `@EventHandler(priority = EventPriority.HIGHEST)`。如果你在该处如 Listing 13.3\
  \ 所示没有指定任何内容，则将使用 `NORMAL` 优先级。\n\n由于在第 11 行已定义了这是一个 `PlayerJoinEvent` 的监听器，因此当玩家进入服务器时，`onEvent`\
  \ 函数就会被调用。`onEvent` 函数特别重要的是传递给它的变量 `event`，因为它获得了该事件的额外功能，你可以通过这些功能获取信息或影响事件。对于\
  \ `PlayerJoinEvent`，该变量包含了是哪个玩家刚刚加入服务器的信息。如第 13 行所示，你可以通过 `getPlayer` 命令访问此信息。之后，你只需要使用已知的\
  \ `sendMessage` 命令即可向玩家发送消息。\n\n`PlayerJoinEvent` 带来的另一个功能是例如 `setJoinMessage`。通过它，你可以指定当有新玩家加入时，向服务器上的所有玩家发送什么消息。例如：`event.setJoinMessage(event.getPlayer().getDisplayName()\
  \ + \"hat den Server betreten!\")`。\n\n到此为止，你的监听器已经写写了，但为了让它能被你的插件使用，你必须像在基础结构所示的那样，在你的插件中注册它。这发生在第\
  \ 19 行到第 21 行。首先，在第 19 行加载插件管理器（Plugin-Manager），它负责管理你的插件。在第 20 行创建了你的监听器类的新对象，并在第\
  \ 21 行最终通过插件管理器进行注册。在一个插件中注册多个监听器也是可能的，具体如何，你可以在 Section 13.10 中了解。\n\n有许多不同的事件类型，每个类型都拥有不同的功能，在这里详细介绍所有细节是不可能的，也是没有必要的，因为它们在原理上的工作方式是相同的。出于这个原因，你将在本章找到所有可用事件的概览表格。这些事件根据其类型进行了分类。在本节中，你可以找到所有与玩家相关的事件；在下一节中，你可以找到所有与其它生物（如怪物或动物）相关的事件。玩家事件列表可以在\
  \ Table 13.1 中找到。所有玩家事件的导入始终遵循以下模式：`import org.bukkit.event.player.BeispielEvent`，其中\
  \ `BeispielEvent` 被相应的事件替换，例如 `PlayerJoinEvent`。\n\n### 注意事项\n事件名称中的连字符仅仅是换行的结果。它们在编写时均不带连字符。\n\
  \n| 事件 | 功能 |  |\n| --- | --- | --- |\n| `PlayerAchievementAwardedEvent` | `getPlayer(),\
  \ getAchievement()` | 当玩家获得成就时调用。 |\n| `PlayerAnimationEvent` | `getPlayer(), getAnimationType()`\
  \ | 当玩家执行动画时调用。 |\n| `PlayerBedEnterEvent` | `getPlayer(), getBed()` | 当玩家躺在床上时调用。\
  \ |\n| `PlayerBedLeaveEvent` | `getPlayer(), getBed()` | 当玩家从床上起床时调用。 |\n| `PlayerBucketEvent`\
  \ | `getPlayer(), getBlockClicked(), getBlockFace(), getBucket(), getItemStack(),\
  \ setItemStack(itemStack)` | 当玩家使用水桶时调用。 |\n| `PlayerChangedMainHandEvent` | `getPlayer(),\
  \ getMainHand()` | 当玩家在设置中更改主手时调用。 |\n| `PlayerChangedWorldEvent` | `getPlayer(),\
  \ getFrom()` | 当玩家切换到另一个世界时调用。 |\n| `PlayerChannelEvent` | `getPlayer(), getChannel()`\
  \ | 当玩家注册或注销新的插件通道时调用。 |\n| `PlayerChatEvent` | `getPlayer(), getFormat(), getMessage(),\
  \ getRecipients(), setFormat(format), setMessage(nachricht), setPlayer(spieler)`\
  \ | 当玩家使用聊天时调用。 |\n| `PlayerChatTabCompleteEvent` | `getPlayer(), getLastToken()`\
  \ | 当玩家使用聊天自动补全时调用。 |\n| `PlayerCommandPreprocess` | `getPlayer(), getFormat(),\
  \ getMessage(), getRecipients(), setFormat(format), setMessage(nachricht), setPlayer(spieler)`\
  \ | 在玩家执行命令前调用。 |\n| `PlayerDropItemEvent` | `getPlayer(), getItemDrop()` | 当玩家从背包移除物品时调用。\
  \ |\n| `PlayerEditBookEvent` | `getPlayer(), getBookMeta(), getPreviousBookMeta(),\
  \ getSlot(), isSigning()` | 当玩家更改书籍内容时调用。 |\n| `PlayerEggThrowEvent` | `getPlayer(),\
  \ getEgg(), getHatchingType(), getNumHatches(), isHatching(), setHatching(EntityType),\
  \ setNumHatches(num)` | 当玩家扔蛋时调用。 |\n| `PlayerExpChangeEvent` | `getPlayer(), getAmount(),\
  \ setAmount(amount)` | 当玩家经验值改变时调用。 |\n| `PlayerFishEvent` | `getPlayer(), getCaught(),\
  \ getExpToDrop(), getHook(), getState(), setExpToDrop(amount)` | 当玩家钓鱼时调用。 |\n|\
  \ `PlayerGameModeChangeEvent` | `getPlayer(), getNewGameMode()` | 当玩家游戏模式改变时调用。\
  \ |\n| `PlayerInteractEntityEvent` | `getPlayer(), getHand(), getRightClicked()`\
  \ | 当玩家用右键点击生物时调用。 |\n| `PlayerInteractEvent` | `getPlayer(), getAction(), getBlockFace(),\
  \ getClickedBlock(), getHand(), getItem(), getMaterial(), hasBlock(), hasItem(),\
  \ isBlockInHand(), setUseInteractedBlock(block), setUseItemInHand(item), userInteractedBlock(),\
  \ useItemInHand()` | 当玩家点击区块、物体或空气时调用。 |\n| `PlayerItemBreakEvent` | `getPlayer(),\
  \ getBrokenItem()` | 当玩家物品损坏（例如铲子或剑）时调用。 |\n| `PlayerItemConsumeEvent` | `getPlayer(),\
  \ getItem(), setItem(item)` | 当玩家消耗某物品（例如食物或药水）时调用。 |\n| `PlayerItemHeldEvent` |\
  \ `getPlayer(), getNewSlot(), getPreviousSlot()` | 当玩家切换手中持有的物品时调用。 |\n| `PlayerJoinEvent`\
  \ | `getPlayer(), getJoinMessage(), setJoinMessage(nachricht)` | 当玩家进入服务器时调用。 |\n\
  | `PlayerKickEvent` | `getPlayer(), getLeaveMessage(), getReason(), setLeaveMessage(nachricht),\
  \ setReason(nachricht)` | 当玩家被踢出服务器时调用。 |\n\n\n\n\n| `PlayerLevelChangeEvent` |\
  \ `getPlayer(), getNewLevel(), getOldLevel()` | 当玩家等级改变时调用。 |\n| `PlayerLoginEvent`\
  \ | `getPlayer(), allow(), disallow(result, nachricht), getAddress(), getHostname(),\
  \ getKickMessage(), getResult(), setKickMessage(nachricht), setResult(result)` |\
  \ 当玩家登录时调用。 |\n| `PlayerMoveEvent` | `getPlayer(), getFrom(), getTo(), setFrom(position),\
  \ setTo(position)` | 当玩家移动时调用。 |\n| `PlayerPickupItemEvent` | `getPlayer(), getItem(),\
  \ getRemaining()` | 当玩家捡起物品时调用。 |\n| `PlayerQuitEvent` | `getPlayer(), getQuitMessage(),\
  \ setQuitMessage(nachricht)` | 当玩家离开服务器时调用。 |\n| `PlayerRespawnEvent` | `getPlayer(),\
  \ getRespwanLocation(), isBedSpawn(), setRespawnLocation(position)` | 当玩家重生时调用。\
  \ |\n| `PlayerShearEntityEvent` | `getPlayer(), getEntity()` | 当玩家剪毛生物时调用。 |\n|\
  \ `PlayerStatisticIncrementEvent` | `getPlayer(), getEntityType(), getMaterial(),\
  \ getNewValue(), getPreviousValue(), getStatistics()` | 当玩家的游戏统计数据改变时调用（排除移动统计数据）。\
  \ |\n| `PlayerSwapHandItemsEvent` | `getPlayer(), getMainHandItem(), getOffHandItem(),\
  \ setMainHandItem(item), setOffHandItem(item)` | 当玩家在主手和副手之间切换物品时调用。 |\n| `PlayerToggleFlightEvent`\
  \ | `getPlayer(), isFlying()` | 当玩家在飞行模式或普通模式切换时调用。 |\n| `PlayerToggleSneakEvent`\
  \ | `getPlayer(), isSneaking()` | 当玩家开始潜行或停止潜行时调用。 |\n| `PlayerToggleSprintEvent`\
  \ | `getPlayer(),isSprinting()` | 当玩家开始冲刺或停止冲刺时调用。 |\n| `PlayerVelocityEvent` |\
  \ `getPlayer(), getVelocity(), setVelocity(vektor)` | 当玩家的速度发生改变时调用。 |\n\n**表 13.1:**\
  \ 玩家事件\n\n### 注意事项\n\n某些事件调用的频率可能非常高。例如，`PlayerMoveEvent` 在玩家每走一步时都会被调用。在一个有很多玩家的服务器上，该事件在几秒钟内可能会被调用数百次。对于此类事件，你应该避免在\
  \ `onEvent` 函数中执行高耗时的计算，否则很容易导致你的服务器过载、运行变缓慢，甚至完全崩溃。\n\n## 13.3 生物事件\n\n生物事件组可以按照以下模式导入：`import\
