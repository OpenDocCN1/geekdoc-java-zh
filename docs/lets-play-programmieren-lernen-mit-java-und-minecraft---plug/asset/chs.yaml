  \ instanceof Player) && (angegriffener instanceof Player)){\n                  \
  \  Player a1 = (Player) angreifer;\n                    Player a2 = (Player) angegriffener;\n\
  \n                    if(punktestand.containsKey(a1.getUniqueId())){\n         \
  \               punktestand.put(a1.getUniqueId(), punktestand.get(a1.getUniqueId())\
  \ + 1);\n                    }\n                    else{\n                    \
  \    punktestand.put(a1.getUniqueId(), 1);\n                    }\n\n          \
  \          if(punktestand.containsKey(a2.getUniqueId())){\n                    \
  \    punktestand.put(a2.getUniqueId(), punktestand.get(a2.getUniqueId()) - 1);\n\
  \                    }\n                    else{\n                        punktestand.put(a2.getUniqueId(),\
  \ -1);\n                    }\n\n                    a1.sendMessage(\"Du hast jetzt\
  \ \" + punktestand.get(a1.getUniqueId()) + \" Punkte.\");\n                    a2.sendMessage(\"\
  Du hast jetzt \" + punktestand.get(a2.getUniqueId()) + \" Punkte.\");\n        \
