  \ Location.deserialize(position);\n 18      }\n 19  \n 20      public UUID getBesitzer()){\n\
  \ 21          return this.besitzer;\n 22      }\n 23  }\n```\n\n**Listing 15.13:**\
  \ `SilderEintag`-类\n\n\n\n\n\n## 序列化\n\n对于我们的项目来说，一个特别重要的信息位于类名后面。添加 `implements\
  \ Serializable` 确保了该类的对象以后可以非常方便地存储到文件中。为了能够保存对象，必须先将其转换，这个过程被称为序列化。并不是所有类都可以序列化，因此\
  \ Listing 15.13 中第 12 行的位置信息也通过 `serialize` 命令进行了转换。在 `getPosition` 函数中，该过程会被撤销。\n\
  \n在使用新类来存储信息之前，你自然还需要修改插件本身。如何操作，你可以在 Listing 15.14 中看到。如果你足够仔细，会在导入部分就注意到第一个变化。通过将一些功能导出到\
  \ `SchilderEintrag` 类，插件本身现在不再需要 `UUID` 类。\n\n第 17 行和第 20 行的更改变得更加明确，在列表的声明或初始化时，这里现在只需要一个列表，而不是像以前那样的。\n\
