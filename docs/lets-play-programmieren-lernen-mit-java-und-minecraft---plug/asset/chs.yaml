  ### 16.2.4 物品计数\n\n这个插件最重要的部分自然是计算收集的物品。当玩家捡起物品时，`PlayerPickupItemEvent` 就会被调用。你只需要检查捡起的物品是否是目标物品，并分配积分即可。\n\
  \n首先，你可能会注意到 `PickupListener` 类现在有一个构造函数。这是为了能够调用 `neueRundeStarten` 函数。因为该函数属于插件对象，所以必须将该对象传递给监听器。这是在构造函数中完成，正如你在\
  \ Listing 16.15 中所示。\n\n```\n 1  import org.bukkit.entity.Player;\n\n 2  import\
  \ org.bukkit.event.EventHandler;\n\n 3  import org.bukkit.event.Listener;\n\n 4\
  \  import org.bukkit.event.player.PlayerPickupItemEvent;\n 5  \n 6  public class\
  \ PickupListener implements Listener {\n 7      Sammelspiel plugin;\n 8      \n\
  \ 9      public PickupListener(Sammelspiel plugin){\n10          this.plugin = plugin;\n\
  11      }\n12      \n 13      @EventHandler\n14          public void onEvent(PlayerPickupItemEvent\
  \ event){\n15          Player spieler = event.getPlayer();\n16  \n17          if(event.getItem().getItemStack().getType()\
  \ == plugin.gesuchterGegenstand){\n18              plugin.gesammelt.put(spieler.getUniqueId(),\
  \ plugin.gesammelt.get(spieler.getUniqueId()) + 1);\n19  \n20              if(plugin.gesammelt.get(spieler.getUniqueId())\
  \ >= plugin.anzahl){\n21                  spieler.sendMessage(\"恭喜，你赢得了这轮比赛!\");\n\
  22                  spieler.giveExp(50);\n23                  plugin.neueRundeStarten();\n\
  24              }\n25              else{\n26                  spieler.sendMessage(\"\
  你还需要收集 \" + (plugin.anzahl-plugin.gesammelt.get(spieler.getUniqueId())) + \" 个物品.\"\
  );\n27              }\n28          }\n29      }\n30  } \n```\n\n**Listing 16.15:**\
  \ `PickupListener`类\n\n当玩家捡起物品时，会在第 17 行检查是否为目标物品，因为只有这样才需要操作。如果是的话，首先会在第 18 行增加玩家的数量。如果还没有达到要求的数量，则会在第\
  \ 26 行向玩家发送消息告知还需要收集多少物品。如果已经达到了所需数量，则会在第 21 行通知玩家并在第 22 行给予奖励，例如 50 点经验值。随后会在第\
  \ 23 行自动开始新一轮。\n\n### 16.2.5 显示任务\n\n如果你愿意，也可以为忘记的玩家提供一个小服务，允许他们通过聊天命令 `/aufgabe`\
