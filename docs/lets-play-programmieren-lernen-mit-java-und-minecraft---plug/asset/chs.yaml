  * 你在书中将要编写的所有插件（如果你不想从书里抄写代码的话）\n\n我特别感谢 Karl-Heinz Barzen，他用无数有用的评论和注释不辞倦地陪伴了这本书的创作过程，并为这本书变得尽可能易于理解和对初友好做出了重要贡献。\n\
  \n现在，我主要祝你在阅读、编程和发现的过程中获得许多乐趣！\n\nDaniel Braun\n\n# 第 1 章：Java\n\n无论是有意还是无意的，你已经做出了通往程序员之路道路上必须做出的最重要的决定之一：你想学习哪种编程语言。因为通过这本书，你选择了\
  \ Java 这种编程语言。但在我们研究 Java 的特殊之处以及为什么学习 Java 是一个明智的决定之前，首先应该讨论一下到底什么是编程语言，以及为什么需要它们。\n\
  \n## 1.1 编程语言\n\n编程本质上是程序员给计算机下达特定的任务并让其执行。为了做到这一点，计算机需要一个精确的操作指令，也称为`算法`。在日常生活中，我们也经常遇到操作指令，例如以食谱的形式出现：\n\
  \n1. 将 250 克面粉放入碗中\n2. 加入 500 毫升牛奶\n3. 加入 2 个鸡蛋\n4. 撒一撮盐调味\n5. 搅拌\n\n煎饼面就做好了！为了能正确执行操作指令，双方必须对一种共同语言达成一致。如果有人给你一份中文编写的食谱，你可能无法用它做什么。\n\
  \n计算机“说话”使用的是 0 和 1，即一种人类并不擅长处理的语言。而我们的语言，无论是德语、英语还是中文，对于计算机来说都太不精确了。以这句话为例：“前面有一张银行（Bank/长椅）。”\
  \ 尽管这是一个完全正确的德语句子，但这句话的真实含义并不十分明确。前面是一个可以坐的公园长椅（Bank），还是一个可以存款和取的银行网点（Bank）？如果你的计算机在网上购物时不小心买了德意志银行（Deutsche\
  \ Bank）而不是用于花园的椅子，那将是一个昂贵的错误。\n\n因此，算法不仅必须是操作指令，它们必须是`明确的操作指令`。对于像“一撮”这样的词，计算机也无法理解多少。正因如此，我们使用编程语言，因为它们允许我们制定明确的操作指令。尽管它们初看起来很复杂，但我们学习它们比学习由\
  \ 0 和 1 组成的语言容易得多。\n\n为了让计算机也能理解编程语言，它首先必须被翻译成所谓的`机器语言`。这种翻译是由一个名为`编译器`的程序完成的。结果就是所谓的`二进制文件`，它们可以被计算机执行。这些二进制文件正如图\
  \ 1.1 所示，只由 0 和 1 组成。\n\n![](img/1_Abbildung_1.1.jpg)\n\n**图 1.1：**编译器的工作原理\n\n\
  例如，简单的句子“这是一个测试。”变成了一个长度为 136 个字符的 0 和 1 链，你可以在列表 1.1 中看到它。\n\n```\n01000100 01100001\
  \ 01110011 00100000\n```\n\n**列表 1.1：**“这是一个测试。”的二进制编码\n\n###set\n\n* 算法是一个明确的操作指令。\n\
  * 编译器将编程语言翻译成机器语言。\n* 二进制文件由 0 和 1 组成。\n\n## 1.2 Java 的特性\n\n不同的编程语言有不同的优缺点。有些特别容易学习，例如\
  \ `Python`；另一些例如 `C` 特适用于时间敏感型应用，即对响应速度要求高的应用；另一些则非常通用，例如 `Java`。不存在所谓的“正确”或“最佳”编程语言——取决于应用场景，使用其他编程语言可能是有意义的。\n\
  \n使用 Java 编写插件的主要原因是 Minecraft 本身以及 Minecraft 服务器都是用 Java 编写的。此外，Java 程序与许多其他编程语言编写程序不同，可以轻松运行在所有主流操作系统上，特别是\
  \ Windows、GNU/Linux 和 macOS。\n\n为了实现这一点，Java 编译器的工作方式与其他编译器不同。它并不立即将编程语言转换成机器码，而是首先转换成所谓的`Java\
  \ 字节码`。这是人类易读的编程语言与计算机易读的机器码之间的中间步骤。只有所谓的`Java 虚拟机 (JVM)` 才会将程序转换为机器码。\n\n优点是：不需要为每个操作系统（例如\
  \ Windows、macOS 和 GNU/Linux）翻译每个程序成机器码，只需要为每个操作系统翻译一个程序，即 Java 虚拟机——这大大减少了工作量。\n\
  \n\n\n\n在开始真正的编程之前，你必须确保电脑上已经安装了 Java 虚拟机（JVM）和 Java 编译器。在某些系统上，特别是 GNU/Linux 系统，这两个程序已经预装了。要测试你的系统是否是这种情况，你首先需要打开命令提示符（Windows）或终端（GNU/Linux,\
  \ macOS），因为与我们今天所知的大多数现代程序不同，Java 编译器没有图形界面，而是完全通过命令行进行操作。在 Windows 上，你可以通过在开始菜单的搜索框中输入名称来找到命令提示符，也可以在开始菜单的“附件”下找到它。在\
  \ macOS 上，你可以在 `/应用程序/实用工具` 文件夹中找到终端，或者在搜索中输入 `Terminal`（终端）。在命令提示符或终端中，输入 `javac`\
  \ 命令并按回车键确认。如果之后显示如图 1.3。相反，如果你收到类似`“javac”不是内部或外部命令，也不是可运行程序`的消息，则必须在你的电脑上安装 Java\
  \ 编译器。\n\n![](img/1_Abbildung_1.3.jpg)\n\n**图 1.3:** Java 编译器正确安装后的输出\n\n### 1.3.1\
  \ 安装 Java 编译器\n\nJava 编译器和 Java 虚拟机一样，都是 `Java Development Kit`（`JDK`，Java 开发工具包）的一部分，可以在\
  \ `Oracle` 网站免费下载。你可以在 `buch.daniel-braun.com` 上找到下载链接。\n\n在 Oracle 页面上，你需要下载适用于你操作系统的文件。文件的命名格式为\
  \ `jdk-$u$$$-操作系统-x64`，其中 `$` 符号代表版本号，`操作系统` 代表你正在使用的操作系统名称。下载完成后，你只需双击打开文件并按照提示完成安装即可。\n\
  \n一旦安装完成，你应该重复第 1.3 节中描述的步骤，以测试 Java 编译器现在是否正确安装。如果你使用的是 Windows，命令可能仍然无法运行。这并不意味着安装过程中发生了错误，而是意味着你还需要设置所谓的“环境变量”。\n\
  \n为此，你首先需要打开电脑的“高级系统设置”。\n\n**Windows XP、Vista 和 7：** 在 Windows XP、Vista 和 7 中，你首先打开开始菜单，然后进入“控制面板”。在里面选择“系统和安全”类别下的“系统”，然后在弹出的窗口中选择“高级系统设置”。\n\
  \n**Windows 8 和 10：** 在 Windows 8 中，你可以通过直接在搜索框中输入该词来打开它。而在 Windows 10 中，你必须先右键点击左下角的\
  \ Windows 图标，点击“系统”，然后在打开窗口中再次点击“高级系统设置”。\n\n现在，无论你使用哪个版本的 Windows，都应该能看到图 1.4 所示的窗口。在窗口的右下角，你会找到一个名为“环境变量”的按钮。点击它将打开如图\
  \ 1.5 所示的窗口。\n\n在其中，按照如图 1.5 所示所示选择 `PATH` 条目，然后点击“编辑”。如果没有该条目，你可以直接跳转到下一个段落。之后会打开一个长文本框，其中包含许多绝对不能修改的条目。相反，你应该在末尾（并用分号隔开）指定你之前安装\
  \ Java Development Kit 的路径。默认情况下如下：\n\n`C:\\Program Files\\Java\\jdk1.8.0_121\\\
  bin;`\n\n![](img/1_Abbildung_1.4.jpg)\n\n**图 1.4:** 高级系统设置\n\n根据你安装的 Java 版本不同，路径（尤其是版本号部分）可能会略有不同。因此，务必注意使用实际的安装路径。之后，你只需点击“确定”和“应用”来确认更改。\n\
  \n如果你那里还没有名为 `PATH` 的条目，你可以自己创建一个。为此，点击“新建”而不是“编辑”。在打开的窗口中，变量名输入 `PATH`，值为以分号结尾的安装路径，并点击“确定”确认输入。随后，`javac`\
  \ 命令应该在命令提示符中正常工作了。\n\n![](img/1_Abbildung_1.5.jpg)\n\n**图 1.5:** 环境变量\n\n### 1.3.2\
  \ 设置文件夹\n\n在本书的后续，你将编写许多插件，其中一些还有不同的版本。为了以后更容易保持条理，你现在就应该做准备。最好的方法是创建一个自己的文件夹，以后将所有项目存储其中。原则上，你可以将其放置在与服务器相同的目录下，在\
  \ Windows 下下位于 `C:\\`，在 Linux/macOS 下位于 `/home/Benutzer`。文件夹名称可以简单选择 `plugins`。\n\
  \n### 1.4 编辑器\n\n到此，几乎所有的准备工作都完成了。你现在缺少的是一个编写未来程序的程序。基本上，你可以使用任何可以编写文本的程序。Windows\
  \ 自带的记事本（你可以在开始菜单的“附件”下找到）就完全足够了。macOS 自带了文本编辑（TextEdit），它位于 `/应用程序` 文件夹中，或者可以通过搜索找到。如果你选择\
  \ Windows 记事本，那么在保存时必须确保将文件类型选择为“所有文件”。在文本编辑程序中，新建文档后，应该选择菜单栏“格式”下的“制作纯文本”。无论你使用哪种程序，保存时都应该在文件名后添加\
  \ `.java` 扩展名，以便你的电脑知道保存的文件是 Java 代码。\n\n![](img/1_Abbildung_1.6.jpg)\n\n**图 1.6:**\
  \ 使用 Windows 记事本保存文件\n\n\n\n不过，这些工具有时操作非常复杂。因此，起初你可能应该选择一个稍微简单一点的编辑器，因为你最初并不会使用大型\
  \ IDE 的大部分功能。例如，`jEdit` 编辑器免费提供给所有主流操作系统，非常适合这种需求。你也可以在 `buch.daniel-braun.com`\
  \ 找到下载链接以及安装指南。\n\n![](img/1_Abbildung_1.7.jpg)\n\n**图 1.7:** jEdit\n\n## 1.5 总结\n\
  \n| 术语 | 含义 |\n| --- | --- |\n| 算法 | 一种明确的操作指令，规定了程序例如具体应该做什么。 |\n| 编译器 | 一个将编程语言翻译成机器语言的程序。\
  \ |\n| 二进制文件 | 一个包含机器语言的文件，仅由 0 和 1 组成。 |\n\n# 第 2 章：Minecraft 服务器\n\n独自玩 Minecraft\
  \ 已经很有趣了，但如果你和其他玩家在一起，和他们一起玩或对抗他们，会变得更有趣。为此，你可以在互联网各处找到数百个公共服务器中选择一个，也可以使用自己的服务器——这样你对所有设置都有完全的控制权。如果你在本书的过程中学会了为自己的服务器编写越来越精密的插件，以便根据你的设想扩展\
  \ Minecraft，那么自己的服务器将带给你更多乐趣。\n\n要运行自己的服务器，除了普通的 Minecraft 游戏（也称为 `Client`）外，你还需要另一个程序，即\
  \ Minecraft 服务器。“普通的”Minecraft 服务器（有时也称为“Vanilla 服务器”）你可以在 Minecraft 官方网站 [www.minecraft.net](http://www.minecraft.net)\
  \ 下载。除了这个版本外，还有许多所谓的 Mods，即原始服务器的修改版。在游戏语境下，Mods 或修改版指的是以某种形式改变过（即修改过）的游戏版本。这些这些通常由粉丝开发的\
  \ Mods 提供了 Vanilla 服务器不具备的许多额外功能和便利之处，例如编写自己插件的可能性。\n\n**注意**\n你独自玩时启动的普通 Minecraft\
  \ 游戏被称为 `Client`。而我们在本章中将安装的、你为了和朋友一起玩而所需的程序则被称为 `Server`。\n\n本书专为两种最受欢迎的服务器设计。你可以在\
  \ `CraftBukkit` 服务器（通常直接称为 Bukkit）和 `Spigot` 服务器之间进行选择。由于 Spigot 构建在 Bukkit 之上，我们在本书框架内编写的所有插件在两个服务器上都能运行。唯一的区别在于服务器的管理，Spigot\
  \ 提供了更多可能，但在操作上也稍微复杂一些。此外，Spigot 服务器效率更高，这意味着它需要的内存（RAM）较少。因此，对于第一次运行自己的服务器的初学者，建议首先使用\
  \ Bukkit；而已经具有 Minecraft 服务器管理经验的人，也可以尝试 Spigot。无论如何，你都可以随时进行切换。\n\n## 2.1 安装\n\n\
  现在你必须在这一步决定你想要使用哪种服务器来测试你的插件。如果你选择 Bukkit 服务器，可以继续阅读 第 2.1.1 节；如果你更倾向于使用 Spigot\
  \ 服务器，可以直接跳转到 第 2.1.2 节 。\n\n### 2.1.1 CraftBukkit\n\n你可以在书籍网站 [buch.daniel-braun.com](http://buch.daniel-braun.com)\
  \ 找到 Bukkit 服务器最新版本的下载链接。这是一个单一的所谓 Jar 文件，根据版本不同，名称可能类似于 `craftbukkit-1.15.1.jar`。首先，你应该创建一个空文件夹，并将该文件复制进去。原则上，你可以随意为该文件夹命名，在本书后续内容，我们将假设该文件夹名为\
  \ `server`，并在 Windows 下存放在 `C:\\server`，在 GNU/Linux 下存放在 `/home/用户名/server`，或者在\
  \ macOS 下存放在 `/Users/用户名/server`。\n\n要首次启动服务器，你必须首先打开命令提示符或终端并切换到服务器文件夹。你可以使用 `cd`\
  \ 命令来实现此。该英文缩写代表“change directory”，即“切换目录”，而你恰恰可以使用这个命令在不同的目录之间来回切换。因此，在 Windows\
  \ 中你例如输入 `cd C:\\server`，在 GNU/Linux 中输入 `cd /home/Benutername/server`。一旦进入正确的目录，就可以使用命令\
  \ `java -jar craftbukkit-1.15.1.jar` 启动服务器。\n\n**注意**\n服务器通过 `java -jar craftbukkit-1.15.1.jar`\
  \ 启动。请将命令中的版本号调整为你使用的版本。\n\n但在首次启动时，你首先会看到图 2.1 所示的警告。如果你现在查看文件夹，你会发现那里有两个文件和一个文件夹。\n\
  \n![](img/2_Abbildung_2.1.jpg)\n\n**图 2.1:** 首次启动后的输出\n\n![](img/2_Abbildung_2.2.jpg)\n\
  \n**图 2.2:** 首次启动后的文件夹内容\n\n为了同意条款，你必须打开现在存在的 `eula.txt` 文件。在该文件中你也可以找到可以阅读条款的链接。当你打开这个链接时，将被引导至\
  \ Minecraft 制造商的官方网站，在那里你可以找到德语版本。那里规定了你对游戏和服务器可以做什么以及不能做什么。那里还明确说明，如果你未满 18 岁，必须获得法定代表的许可（例如父母）。无论如何，你都应该仔细阅读这些条款。\n\
  \n`eula.txt` 的内容可以在列表 2.1 中找到。如果你同意这些条款，可以通过将文件的最后一行从 `eula=false` 改为 `eula=true`\
  \ 来表明。只有这样做之后，你才能使用该服务器。\n\n```\n#通过将下面的设置改为 TRUE，你表示同意我们的 EULA (https://account.mojang.com/documents/minecraft_eula)。\n\
  \n#Mon Apr 01 13:37:00 BST 2015\n\neula=false\n```\n\n**列表 2.1:** `eula.txt` 文件的内容\n\
  \n\n\n\n\n当你保存了更改后，可以再次尝试使用命令 `java -jar craftbukkit-1.15.1.jar` 启动服务器。这次启动过程可能持续一段时间，屏幕上会有很多行文字快速滚动。特别重要的是最后一行。如果那一行显示了类似\
  \ 诸如 `Done (13,370s)! For help, type \"help\" or \"?\"` 的内容，则意味着你的服务器现在已经无问题地运行了。再次查看服务器文件夹，你会发现那里如\
  \ Abbildung 2.3 所示，现在有明显更多文件了。\n\n![](img/2_Abbildung_2.3.jpg)\n\n**图 2.3：** 成功启动后服务器文件夹的内容\n\
  \n### **提示**\n 只有当相应的命令提示符或终端窗口保持打开时，服务器才会运行。如果你关闭窗口，服务器也将随之关闭。\n\n### 2.1.2 Spigot\n\
  \n你可以在书籍网站 [buch.daniel-braun.com](http://buch.daniel-braun.com) 找到最新版本 Spigot 服务器的下载链接。这是一个单一的\
  \ Jar 文件，根据版本不同，其名称可能类似于 `spigot-1.15.1.jar`。首先，你应该创建一个空文件夹并将该文件复制到其中。原则上，你可以随意命名该文件夹；在书的后续内容中，我们将假设文件夹名为\
  \ `server`，并位于 Windows 下的 `C:\\server`，GNU/Linux 下的 `/home/Benutzername/server`\
  \ 或者是 macOS 下的 `/Users/Benutzername/server`。\n\n要首次启动服务器，你必须再次打开命令提示符或终端，并切换到服务器文件夹。你可以使用\
  \ `cd` 命令来实现。例如，在 Windows 中输入 `cd C:\\server`，在 GNU/Linux 中输入 `cd /home/Benutzername/server`。一旦进入正确的文件夹，就可以使用命令\
  \ `java -jar spigot-1.15.1.jar` 启动服务器。但在第一次启动时，你只会看到在 Abbildung 2.4 中显示的警告信息。\n\n\
  ![](img/2_Abbildung_2.4.jpg)\n\n**图 2.4：** 首次启动服务器后的输出\n\n### **注意**\n使用命令 `java\
  \ -jar spigot-1.15.1.jar` 启动服务器。注意将命令中的版本号与你使用的服务器版本相匹配。\n\n那里基本上的意思是，在使用服务器之前你必须先同意使用条款。如果你现在查看你的服务器文件夹，你会发现如\
  \ Abbildung 2.5 所示，那里现在有两个额外的文件和一个文件夹。\n\n![](img/2_Abbildung_2.5.jpg)\n\n**图 2.5：**\
  \ 首次启动后服务器文件夹的内容\n\n为了同意使用条款，你需要打开现在已存在的 `eula.txt` 文件。在该文件中，你还会找到一个链接，可以通过该链接阅读条款。打开该链接后，你将被重定向到\
  \ Minecraft 制造商 Mojang 的官方页面，幸运的是，那里也可以找到德语版本的条款。那里规定了你对游戏和服务器可以做什么——以及不能做什么。此外，那里还明确规定，如果你未满\
  \ 18 岁，必须获得法定代表的同意（例如父母的同意）。无论如何，你都应该仔细阅读条款。\n\n`eula.txt` 的内容在 Listing 2.1 中也可以找到。如果你同意这些条款，可以通过将文件的最后一行从\
  \ `eula=false` 改为 `eula=true` 来表示此意。只有这样做，你才能使用服务器。文件的第一行中已经用英文详细解释了这一点。\n\n![](img/2_Abbildung_2.6.jpg)\n\
  \n**图 2.6：** 成功启动后服务器文件夹的内容\n\n当你保存了更改后，可以再次尝试使用命令 `java -jar spigot-1.15.1.jar`\
  \ 启动服务器。这次启动过程可能持续一段时间，屏幕上会有很多行文字快速滚动。特别重要的是最后一行。如果那一行显示了诸如 `Done (13,370s)! For\
  \ help, type \"help\" or \"?\"` 的内容，则意味着你的服务器现在已经无问题地运行了。再次查看服务器文件夹，你会发现那里现在有明显更多文件了。\n\
  \n### 2.2 配置\n\n只有当相应的命令提示符或终端窗口保持打开时，服务器才会运行。如果你关闭窗口，服务器也将随之关闭。\n\n`server.properties`\
  \ 文件包含了你可以调整的主要设置。它在首次启动后位于主文件夹中。使用任何文本编辑器（如记事本）打开文件进行修改。修改后保存文件。\n\n**重要：** 在修改\
  \ `server.properties` 后，你必须重启服务器使更改生效。\n\n以下是 `server.properties` 中主要设置的概述：\n\n\
  | 设置 | 说明 |\n| :--- | :--- |\n| `spawn-protection` | 决定出生点周围半径内的区块是否为不可破坏。 |\n|\
  \ `generator-settings` | 对于 `FLAT` 或 `CUSTOMIZED` 类型的世界，可以设置生成选项。 |\n| `op-permission-level`\
  \ | 决定拥有 Operator 状态的用户权限（1 = 修改出生保护区域，2 = 编辑命令块并执行聊天命令，3 = 封禁踢玩家并提升为 Operator，4\
  \ = 停止服务器）。 |\n| `allow-nether` | 启用 (true) 或禁用 (false) 下界门。 |\n| `level-name` |\
  \ 世界所在的文件夹名称。 |\n| `enable-query` | 启用 (true) 或禁用 (false) 用于查询服务器信息的接口。 |\n| `allow-flight`\
  \ | 允许 (true) 或禁止 (false) 玩家在生存模式下飞行。 |\n| `announce-player-ach` | 当玩家获得成就时，向所有玩家发送消息。\
  \ |\n| `server-port` | 设置服务器的端口（默认为 25565）。 |\n| `max-world-size` | 设置世界的大小（最大为\
  \ 30,000,000）。 |\n| `level-type` | 设置世界类型（DEFAULT = 标准世界，FLAT = 平坦世界，LARGEBIOMES\
  \ = 大群系，AMPLIFIED = 极端地形，CUSTOMIZED = 自定义世界）。 |\n\n\n\n\n\n| 设置 | 说明 |\n| :--- |\
  \ :--- |\n| `enable-rcon=false` | 激活 (true) 或禁用 (false) 对服务器控制台的远程访问。 |\n| `level-seed=`\
  \ | 允许为世界生成手动输入初始值（种子）。 |\n| `force-gamemode=false` | 决定玩家进入服务器时是回到离开服务器时的游戏模式 (false)，还是始终以默认模式开始\
  \ (true)。 |\n| `server-ip=` | 如果服务器应仅通过特定 IP 可访问，可以在此处输入该 IP。 |\n| `network-compression-threshold=256`\
  \ | 设置数据传输的压缩强度。 |\n| `max-build-height=256` | 设置最大建筑高度。 |\n| `spawn-npcs=true`\
  \ | 激活 (true) 或禁用 (false) 村民生成。 |\n| `white-list=false` | 决定是否仅允许名单上的玩家进入服务器 (true)，或允许所有未被封的玩家进入\
  \ (false)。 |\n| `spawn-animals=true` | 激活 (true) 或禁用 (false) 动物生成。 |\n| `hardcore=false`\
  \ | 激活 (true) 或禁用 (false) 硬核模式（玩家死亡后将被永久封禁）。 |\n| `snooper-enabled=true` | 激活 (true)\
  \ 或禁用 (false) 向 Mojang 发送匿名化的服务器数据。 |\n| `resource-pack-sha1=` | 资源包的校验和，可用于检查包是否未被修改。\
  \ |\n| `online-mode=true` | 如果激活 (true)，则将连接的玩家与 Mojang 数据库进行同步。防止假账号。 |\n| `resource-pack=`\
  \ | 设置服务器推荐的资源包。 |\n| `pvp=true` | 决定玩家是否可以互相攻击 (true) 或否 (false)。 |\n| `difficulty=1`\
  \ | 设置难度，从 0 (和平) 到 3 (困难)。 |\n| `enable-command-block=false` | 激活 (true) 或禁用 (false)\
  \ 命令块。 |\n| `gamemode=0` | 设置游戏模式（0 = 生存模式，1 = 创造模式，2 = 冒险模式，3 = 旁观模式）。 |\n| `player-idle-timeout=0`\
  \ | 设置闲置玩家多少分钟后被踢出服务器（0 = 完全不踢出）。 |\n| `max-players=20` | 设置服务器允许的最大玩家数量。 |\n| `max-tick-time=60000`\
  \ | 如果两次更新（Tick）之间超过了指定的毫秒数，服务器将自动关闭 (-1 = 禁用)。 |\n| `spawn-monsters=true` | 激活\
  \ (true) 或禁用 (false) 怪物生成。 |\n| `generate-structures=true` | 激活 (true) 或禁用 (false)\
  \ 村庄、神庙和其他建筑的生成。 |\n| `view-distance=10` | 设置视距。 |\n| `motd=A Minecraft Server`\
  \ | 在服务器列表中显示为描述的文本。 |\n\n**表 2.1:** `server.properties` 的设置选项\n\n#### `bukkit.yml`\
  \ 文件\n\n第二个重要的配置文件（尽管名称如此，但它在 Bukkit 和 Spigot 中都存在）是 `bukkit.yml`。它提供了另外 24 个设置选项，你可以在表\
  \ 2.2 中找到它们。\n\n| 设置 | 说明 |\n| :--- | --- |\n| `allow-end: true` | 激活 (true) 或禁用\
  \ (false) 末地传送门。 |\n| `warn-on-overload: true` | 激活 (true) 或禁用 (false) 服务器过载时的警告提示。\
  \ |\n| `permissions-file: permissions.yml` | 设定权限的文件名。 |\n| `update-folder: update`\
  \ | 设置存储插件更新的文件夹（在插件目录下）。 |\n| `plugin-profiling: false` | 激活 (true) 或禁用 (false)\
  \ `/timings` 命令。 |\n| `connection-throttle: 4000` | 客户端在断开连接后允许再次连接所需的毫秒数。 |\n|\
  \ `query-plugins: true` | 激活 (true) 或禁用 (false) 对插件列表的远程访问。 |\n| `deprecated-verbose:\
  \ default` | 激活 (true) 或禁用 (false) 使用过旧方法的插件的警告提示。 |\n| `shutdown-message: Server\
  \ closed` | 设置服务器关闭时发送给玩家的消息。 |\n| `spawn-monsters=true` | 激活 (true) 或禁用 (false)\
  \ 怪物生成。 |\n| `generate-structures=true` | 激活 (true) 或禁用 (false) 村庄、神庙和其他建筑的生成。 |\n\
  | `view-distance=10` | 设置视距。 |\n| `motd=A Minecraft Server` | 在服务器列表中显示为描述的文本。 |\n\
  \n\n\n\n\n这四个文件都按照这一原则构建，理论上也可以手动管理，前提是你知道玩家的 `uuid`（即其唯一用户标识符），并且你想将其添加到列表中。然而，这完全没有必要，因为通过在服务器中输入命令来管理所有这些列表要方便得多。具体的操作方法，将在下一节中介绍。\n\
  \n## 2.3 命令\n\n你可能已经从 Minecraft 的单机模式中熟悉了一些命令了。当你在游戏中按下 T 键打开聊天界面时，你可以可以使用各种命令或作弊（Cheats）来影响世界。例如，使用\
  \ `/weather rain` 可以让天气下雨，使用 `/time set day` 可以化黑为白。\n\n所有你已经在单机模式中熟过的命令在你的服务器上同样适用。你甚至可以直接将它们输入到已打开的服务器窗口中，但不需要去掉开头的斜杠，例如输入\
  \ `weather rain` 而不是 `/weather rain`。你可以在图 2.7 中看到它的样子。\n\n![](img/2_Abbildung_2.7.jpg)\n\
  \n**图 2.7：** 服务器窗口中的命令输入\n\n此外，你还有其他命令可以帮助你管理服务器。通过 `help` 命令，你可以获得所有可用命令的列表，其中最重要的命令按字母顺序列在表\
  \ 2.3 中。\n\n| 命令 |  |\n| --- | --- |\n| `/ban <spielername>` | 永久将玩家踢出服务器。 |\n|\
  \ `/ban-ip <ip>` | 永久封禁一个 IP 地址。 |\n| `/kick <spielername>` | 临时将玩家踢出服务器。 |\n| `/op\
  \ <spielername>` | 给玩家管理员权限。 |\n| `/pardon <spielername>` | 解封某个玩家。 |\n| `/pardon-ip\
  \ <ip>` | 取消对某个 IP 地址的封禁。。 |\n| `/restart` | 重启服务器。 |\n| `/say <nachricht>` | 向所有玩家发送消息。\
  \ |\n| `/spawnpoint <x> <y> <z>` | 将出生点设置为指定位置。 |\n| `/stop` | 关闭服务器。 |\n| `/tell\
  \ <spielername> <nachricht>` | 向特定玩家发送私信。 |\n| `/version` | 显示服务器版本号。 |\n| `/whitelist\
  \ on` | 仅允许白名单上的玩家进入服务器。 |\n| `/whitelist off` | 允许所有未被封的玩家进入服务器。 |\n| `/whitelist\
  \ add <spielername>` | 将玩家添加到白名单。 |\n| `/whitelist remove <spielername>` | 从白名单移除玩家。\
  \ |\n\n**表 2.3：** 服务器命令列表\n\n**注意**\n如果你直接在服务器窗口中输入命令，必须省略命令开头的斜杠。\n\n操作员（即通过 `op\
  \ <spielername>` 添加到列表的玩家）也可以像往一样通过聊天框直接在游戏中使用这些命令。\n\n## 2.4 连接\n\n现在你的服务器已经完美设置并配置完毕，因此是时候通过\
  \ Minecraft 客户端连接上去来测试它了。在此之前，你应该再次检查是否已执行了之前所有的步骤，并且你的服务器正在运行。\n\n**注意**\n在继续阅读之前，你应该再次检查是否执行了所有必要的安装步骤：\n\
  \n1. 安装 Java\n2. 从 [buch.daniel-braun.com](http://buch.daniel-braun.com) 下载服务器文件\n\
  3. 创建新文件夹 `server`并将文件拷贝到其中\n4. 使用 `java -jar` 启动文件\n5. 阅读并接受使用条款\n6. 重新服务器\n7.\
  \ 保持服务器窗口打开\n\n完成这些操作后，你就可以像往一样启动 Minecraft。在主菜单中选择“多人”（Mehrspieler）选项。随后会打开图 2.8\
  \ 所示的菜单。\n\n现在点击“直接连接”（Direkt verbinden）按钮，随后会弹出图 2.9 所示的界面。\n\n如果服务器和客户端运行在同一台电脑上，那么服务器地址必须始终填写\
  \ `127.0.0.1`。这告诉 Minecraft 服务器和客户端位于同一台机器。\n\n![](img/2_Abbildung_2.8.jpg)\n**图\
  \ 2.8：** 多人游戏\n\n![](img/2_Abbildung_2.9.jpg)\n**图 2.9：** 直接连接\n\n## 2.5 更新\n\n\
  至此，你已经成功搭建并测试了之后测试插件时所需的服务器。在本章的结束处，还有一个关于更新的提示：如你所所的，Minecraft 是一个不断发展的动态游戏。这些变化不仅影响游戏本身（客户端），也会影响服务器。每当\
  \ Minecraft 有带有新功能的重大版本更新时，必须同步更新服务器，无论你使用的是 Mod 还是原版服务器。\n\n\n\n\nWenn du im Minecraft-Launcher,\
  \ also dem Fenster, das sich vor dem Start des eigentlichen Spiels nach einem Doppelklick\
  \ auf das Minecraft-Icon öffnet, auf den Button Installationen klickst, und dort\
  \ dann auf Neu..., so öffnet sich das in Abbildung 2.13 gezeigte Fenster, das unter\
  \ anderem eine Versionsauswahl anbietet.\n\n![](img/2_Abbildung_2.13.jpg)\n\n**Abb.\
  \ 2.13:** Minecraft-Launcher 中的版本选择\n\nSollte dein Server einmal nicht auf dem neuesten\
  \ Stand sein, so kannst du aus dieser Liste einfach die Version auswählen, mit der\
  \ dein Server läuft, und problemlos weiterhin auf ihm spielen. Sobald dein Server\
  \ aktualisiert wurde, kannst du diese Einstellung selbstverständlich wieder zurücksetzen.\n\
  \n# 第 3 : 第第一个插件\n\nNachdem Java und der Minecraft-Server fertig eingerichtet sind,\
  \ kann es nun endlich mit dem Programmieren von Minecraft-Plugins losgehen. Da aller\
  \ Anfang bekanntlich schwer ist, wollen wir mit etwas Einfachem beginnen: einem\
  \ freundlichen kleinen Plugin, das dich beim Start des Servers mit den Wörtern »»Hallo\
  \ Welt!« begrüßt.\n\n## 3.1 编程\n\nDazu musst du zunächst eine neue Datei mit dem\
  \ Namen `HalloWeltPlugin.java` anlegen. Dafür erstellst du am besten im Plugin-Ordner,\
  \ den du im letzten Kapitel angelegt hast, ein neues Unterverzeichnis mit dem Namen\
  \ `HalloWeltPlugin`. Die neu erzeugte Datei füllst du dann mit folgendem Inhalt,\
  \ den wir im folgenden Schritt für Schritt anschauen werden:\n\n```\n 1  import\
  \ org.bukkit.plugin.java.JavaPlugin;\n\n 2  \n\n 3  public class HalloWeltPlugin\
  \ extends JavaPlugin {\n\n 4      public void onEnable() {\n\n 5          this.getLogger().info(\"\
  Hallo Welt!\");\n\n 6      }\n 7  \n\n 8      public void onDisable() {\n 9    \
  \  }\n10 } \n```\n\n**Listing 3.1:** `HalloWeltPlugin.java`\n\n### Tipp\n\nEs ist\
  \ eine gute Übung, die Programme aus dem Buch abzutippen, da du dir die verschiedenen\
  \ Befehle schneller einprägen kannst. Allerdings musst du darauf achten, dabei sehr\
  \ exakt vorzugehen, denn schon ein einzeliger Tippfehler kann dafür sorgen, dass\
  \ dein Programm nicht mehr funktioniert. Möchtest du die Programme trotzdem nicht\
  \ abtippen, so findest du sie, wie bereits in der Einleitung erwähnt, unter [buch.daniel-braun.com](http://buch.daniel-braun.com)\
  \ zum Download.\n\nDas sind auf den ersten Blick erst einmal ziemlich viele Wörter\
  \ und Zeichen, die wenig Sinn ergeben. Der Text in Listing 3.1 wird Programmcode,\
  \ Sourcecode oder Quellcode genannt. Er beinhaltet die Handlungsvorschriften, die\
  \ der Computer ausführen soll. In diesem Fall also die Vorschrift: Zeige beim Starten\
  \ des Servers die Nachricht »Hallo Welt!« an. Im Laufe der nächsten Kapitel wirst\
  \ du alle Befehle genau kennen- und verstehen lernen. Für den Anfang soll aber zunächst\
  \ einmal ein grober Überblick reichen.\n\nDie erste Zeile des Plugins beginnt mit\
  \ dem Wort `import` und endet mit dem Zeichen `;`, dem Semikolon. Mit dem Befehl\
  \ `import` kannst du dem Compiler sagen, welche speziellen Bestandteile und Funktionen\
  \ du für die Programmierung eines Plugins benötigst. Um ein Spigot- oder Bukkit-Plugin\
  \ zu programmieren, musst du daher zum Beispiel immer `org.bukkit.plugin.java.JavaPlugin`\
  \ importieren. Das Semikolon am Ende der Zeile markiert das Ende eines Befehls,\
  \ deshalb steht es am Ende vieler, wenn auch nicht aller Zeilen.\n\n### 注意\n\nSicher\
  \ ist dir auch schon aufgefallen, dass der Quellcode eine bestimmte Formatierung\
  \ besitzt. Die verschiedenen Zeilen sind unterschiedlich weit eingerückt und an\
  \ manchen Stellen findest du Leerzeilen. Diese spezielle Formatierung ist eine Konvention,\
  \ also eine Vereinbarung, auf die sich Programmierer über die Jahre einigt haben.\
  \ Nicht alle Konventionen sind ganz eindeutig und sie sind auch nicht verbindlich,\
  \ ihr Ziel ist es, Programmcode besser lesbar zu machen, gerade auch für Programmierer,\
  \ den ihn nicht selbst geschrieben haben.\n\nDer Programmcode in Listing 3.2 ist\
  \ für den Computer bei der Ausführung identisch mit dem Programmcode aus Listing\
  \ 3.1. Für Menschen ist er aber deutlich schwerer zu lesen und sollte der Compiler\
  \ einen Fehler finden und melden, wird es deutlich schwieriger, diesen zu finden,\
  \ da die Zeilenangabe wenig hilfreich ist, wenn alle Befehle in einer Zeile stehen.\
  \ Aus diesem Grund solltest du versuchen, auch wenn es nicht zwingend notwendig\
  \ ist, dich an die Konventionen zur Formatierung zu halten, die dir im Laufe dieses\
  \ Buches begegnen werden. Sie werden deine Arbeit deutlich vereinfachen.\n\n```\n\
  import org.bukkit.plugin.java.JavaPlugin; public class HalloWeltPlugin extends JavaPlugin\
  \ { public void onEnable() { this.getLogger().info(\"Hallo Welt!\"); } public void\
  \ onDisable() { } } \n```\n\n**Listing 3.2:** 无格式化的 `HalloWeltPlugin.java`\n\n\n\
  \n理论部分到此为止。稍后我们还会回到这一行，但首先你应该先确信，这个插件确实在执行它本该做的事情。\n\n## 3.2 编译\n\n### 笔记\n编译时，程序代码会被翻译成机器语言。\n\
  \n正如你在上一个章节中所知，你必须先对插件进行编译，然后才能对其测试。为此，你需要打开命令提示符或终端，并使用 `cd` 命令切换到你保存 `HalloWeltPlugin.java`\
  \ 文件的文件夹。\n\n在 Windows 上，你可以通过在命令提示符中输入 `cd C:\\plugins\\HalloWeltPlugin` 命令（假设你已经按照书中书中建议的那样命名了文件夹）来实现这一操作，前提是你已经按照书中建议的那样命名了文件夹。在\
  \ GNU/Linux 和 macOS 上，你需要在终端中输入的命令是 `cd /home/Benutzername/plugins/HalloWeltPlugin`\
  \ 或者对应的 `cd /Users/Benutzername/plugins/HalloWeltPlugin`，其中你必须将 `Benutzername` 替换为你自己的用户名。\n\
  \n一旦到达了正确的文件夹，你就可以可以使用命令编译你的第一个自定义插件。对于 Windows 和 Bukkit：\n\n```\njavac HalloWeltPlugin.java\
  \ -cp C:\\server\\craftbukkit-1.15.1.jar \n```\n\n或者对于 macOS\n\n```\njavac HalloWeltPlugin.java\
  \ -cp /Users/Benutzername/server/craftbukkit-1.15.1.jar \n```\n\n以及 GNU/Linux\n\n\
  ```\njavac HalloWeltPlugin.java -cp /home/Benutzername/server/craftbukkit-1.15.1.jar\
  \ \n```\n\n对于 Windows 和 Spigot：\n\n```\njavac HalloWeltPlugin.java -cp C:\\server\\\
  spigot-1.15.1.jar \n```\n\n或者对于 macOS\n\n```\njavac HalloWeltPlugin.java -cp /Users/Benutzername/server/spigot-1.15.1.jar\
  \ \n```\n\n以及 GNU/Linux\n\n```\njavac HalloWeltPlugin.java -cp /home/Benutzername/server/spigot-1.15.1.jar\
  \ \n```\n\n### 注意事项\n请注意，在 Windows 下使用所谓的反斜杠 `\\`（AltGr+?），而在 macOS 和 GNU/Linux\
  \ 下使用的是普通的正斜杠 `/`。此外，可能需要将 Spigot 或 Bukkit 服务器的版本号调整为你正在使用的版本。\n\n除了调用 Java 编译器的\
  \ `javac` 命令以及你要编译的文件名外，你还必须指定 `craftbukkit-1.15.1.jar` 或 `spigot-1.15.1.jar` 文件所在的路径。如果你的代码没有问题且编译器没有发现错误，则不会显示任何其他输出，你的插件就完成了编译。\n\
  \n在插件文件夹中，你将找到一个名为 `HalloWeltPlugin.class` 的新文件，其内容也可以在 Listing 3.3 中找到。正如在第一章 中提到的，这是所谓的\
  \ Java 字节码，正如你所见，它对于人类来说已经无法直接读取了，即使你可能还能认出某些单词。但这没有没有，因为这个文件完全是为你的计算机设计的。\n\n```\n\
  -  ()V Code -LineNumberTable onEnable onDisable SourceFile  HalloWeltPlugin.java\
  \      Hallo Welt!Ê    -þHalloWeltPlugin !org/bukkit/plugin/java/JavaPlugin getLogger\
  \ ()Ljava/util/logging/Logger; java/util/logging/Logger info -(Ljava/lang/String;)V\
  \ !     º      ¾ *4 · ±        &   * ¶  ¶ ±          ±      - \n```\n\n**Listing\
  \ 3.3:** `HalloWeltPlugin.class` 的内容\n\n### 3.2.1 查找错误\n如果编译失败了并且你收到的是错误信息而不是新文件，请不要担心。这种情况以后还会经常发生——即使是顶尖程序员也会遇到，因为编译器非常挑剔，一个字符就很容易被忽略。即使是最微小的错误，它也会拒绝工作，因此理解编译器的错误信息非常重要。因为这些信息有助于你快速发现并修复错误。\n\
  \n例如，假设你在输入第一行末尾时漏掉了分号。那么编译器会用以下错误信息提示你：\n\n```\n1  HalloWeltPlugin.java:1: error:\
  \ ';' expected\n\n2  import org.bukkit.plugin.java.JavaPlugin\n\n3             \
  \                              ˆ\n\n4  1 error \n```\n\n所以你已经意识到：编译器虽然非常挑剔，但它仍然非常有用的工具，因为它准确地显示了问题出在哪里。在这种情况下，第\
  \ 1 行（`HalloWeltPlugin.java` 后面的数字表示）缺少一个分号。总共发现了多少错误由该数字指定。\n\n由于编译器的错误信息并不总是那么明确，如果在第\
  \ 5 行漏掉了引号，例如 `this.info(\"Hallo Welt!`，错误信息如下：\n\n```\n1  HalloWeltPlugin.java:5:\
  \ error: unclosed string literal\n\n2  this.info(\"Hallo Welt!);\n\n3          \
  \                     ˆ\n\n4  \n5  HalloWeltPlugin.java:5: error: ';' expected\n\
  \n6  this.info(\"Hallo Welt!);\n\n7                               ˆ\n\n8  \n9  HalloWeltPlugin.java:8:\
  \ error: illegal start of expression\n\n10      public void onDisable()\n\n11  \
  \    ˆ\n\n12  \n13  HalloWeltPlugin.java:8: error: ';' expected\n\n14      public\
  \ void onDisable()\n\n15             ˆ\n\n16  \n17  HalloWeltPlugin.java:8: error:\
  \ ';' expected\n\n18      public void onDisable()\n\n19                        \
  \     ˆ\n\n20  \n21  HalloWeltPlugin.java:10: error: reached end of file while parsing\n\
  \n22  }\n\n23   ˆ\n\n24  \n25  6 errors \n```\n\n虽然编译器仍然指向错误，但它现在显示了五个实际上不是错误的错误。因此，应该先查看最重要的错误，尝试修复它，然后再次运行编译器来修复其他错误。\n\
  \n### 3.2.2 创建 Jar 文件\n在你启动已编译的插件之前，它还需要与一个额外的文件打包成 Jar 文件。Jar 文件（或 Java 归档文件）是一种专门为\
  \ Java 文件设计的 ZIP 文件，使得使用和分发变得非常简单。为此，你首先需要在新生成的 `.class` 文件所在的目录中创建一个名为 `plugin.yml`\
  \ 的新文件，该文件包含 Listing 3.4 内容。\n\n```\n1  name: Hallo_Welt-Plugin\n\n2  main: HalloWeltPlugin\n\
  \n3  api-version: 1.15\n\n4  version: 1.0 \n```\n\n**Listing 3.4:** plugin.yml\n\
  \n幸运的是，只有四行，信息文件非常直观且易于理解：\n\n在第一行通过 `name` 关键字设置插件名称。与你在 Java 文件中设置的名称不同，在这里你可以更有创意一些，例如使用连字符等字符。但是，变音符号在这里也是禁忌的，虽然理论上可以使用空格，但为了起见，不要这样做。你在这里指定的名称以后会在涉及你的插件时出现在服务器的日志中。\n\
  \n### 提示\n请注意，信息文件与源代码不同，行末不需要加分号。\n\n\n\n第三行确定了插件是针对哪个 API 版本进行优化。在本书中，所有插件都针对\
  \ `1.15` 版本进行了优化，因此此处的条目相应。\n\n最后，你可以在关键字 `version` 之后为你的插件指定版本号。如果你以后修改或继续开发你的某个插件，你和其他使用它的人就可以通过版本号轻松查看插件副本是否已经是最新版本。现在，需要将新生成的信息文件（Info-Datei）与\
  \ `.class` 文件一起打包到之前提到的 Jar 文件中。如果你位于插件文件夹中，可以在命令提示符或终端中使用以下命令 `jar -cf` 来创建一个包含之前两个生成文件的\
  \ Jar 文件：\n\n```\njar -cf HalloWeltPlugin.jar HalloWeltPlugin.class plugin.yml \n\
  ```\n\n通过 `jar` 命令，你调用了负责打包文件的程序。两个字母 `c`（`create`，创建）和 `f`（`file`，文件）向程序发出信号，表示你想创建一个新包（`c`），并使用指定的文件名（`f`）。随后是新创建的\
  \ Jar 文件应具有的名称，在此情况下为 `HalloWeltPlugin.jar`，以及包含在包中的文件名称，这里是 `HalloWeltPlugin.class`\
  \ 和 `plugin.yml`。\n\n按下回车键执行命令后，你的插件目录中应该会出现一个名为 `HalloWeltPlugin.jar` 的新文件。现在，你的第一个自己的插件终于可以使用了。\n\
  \n## 3.3 启动\n\n在带插件启动服务器之前，你必须先将刚刚生成的 Jar 文件从你自己的插件文件夹移动到服务器的插件文件夹中。如果你的服务器文件夹是\
  \ `C:\\server`，那么插件文件夹相应位于 `C:\\server\\plugins`。如果你的服务器文件夹是 `/home/benutzername/server`，那么服务器插件文件夹的路径就是\
  \ `/home/benutzername/server/plugins`。一旦 Jar 文件到达正确的位置，你只需要启动服务器。如你所知，启动服务器时会显示很多信息，但我们在这里特别感兴趣的是最后，因为它看起来应该像图\
  \ 3.1 所示所示。\n\n![](img/3_Abbildung_3.1.jpg)\n\n**图 3.1:** 服务器启动后的日志\n\n倒数第四行和倒数第三行特别有趣。在倒数第四行，你会找到插件已正确加载的信息：\n\
  \n```\n[10:55:31 INFO]: [Hallo_Welt-Plugin] Enabling Hallo_Welt-Plugin v1.0 \n```\n\
  \n在下面的一行中，你会看到你的插件正在工作，这里显示了我们想要实现的输出：\n\n```\n[10:55:31 INFO]: [Hallo_Welt-Plugin]\
  \ Hallo Welt! \n```\n\n如果这两行没有出现，可能是在打包 Jar 文件或创建信息文件时出了什么问题。这时，你会在服务器日志的某处找到一行以\
  \ `ERROR` 开头的消息，如列表 3.5 所示：\n\n```\n1  [12:12:15 ERROR]: Could not load 'plugins\\\
  HalloWeltPlugin.jar' in folder 'plugins'\n\n2  org.bukkit.plugin.InvalidPluginException:\
  \ Cannot find main class `HalloweltPlugin` \n```\n\n**列表 3.5:** 信息文件错误时服务器启动后的日志片段\n\
  \n在所示的情况下，信息文件中存在一个错误。`Cannot find main class 'HalloweltPlugin'` 告诉你找不到 Java 文件\
  \ `HalloweltPlugin`。这难怪，因为文件实际上实际上是 `HalloWeltPlugin`，带有一个大写的“W”。这里信息文件中的第二行填写错误：那里写的是\
  \ `main: HalloweltPlugin`，但应该是 `main: HalloWeltPlugin`。要解决这个问题，可以简单地相应调整信息文件，重新创建\
  \ Jar 文件并复制到服务器目录。\n\n**注意**\n\n你必须执行以下步骤才能根据源代码获得可运行的插件：\n\n1. 使用 `javac` 命令进行编译\n\
  2. 创建信息文件\n3. 使用 `jar` 命令打包\n4. 将 Jar 文件移动到服务器目录的插件文件夹\n\n## 3.4 探索\n\n恭喜你！你已经编写并启动了第一个插件，因此在学习编程的道路上迈出了第一步。结果看起来可能还不壮观，但这是一个里程碑。\n\
  \n## 3.5 谜题\n\n1.  列表 3.7 中的源代码包含两个错误，你能找到它们吗？\n\n```\n1  import org.bukkit.plugin.JavaPlugin;\n\
  \n2  \n\n3  public class HalloWeltPlugin {\n\n4      public void onEnable() {\n\n\
  5          this.getLogger().info(\"Hallo Welt!\")\n\n6      }\n7  \n\n8      public\
  \ void onDisable() {\n9          this.getLogger().info(Auf Wiedersehen!);\n\n10\
  \     }\n11 }\n```\n**列表 3.7:** 错误的源代码\n\n2.  你必须修改列表 3.1 中的源代码，以便将来显示“服务器已启动。”而不是“Hallo\
  \ Welt!”？\n\n3.  如果你想将插件重命名为 `ServerStartPlugin`，需要在哪些地方和文件中进行更改？\n\n4.  为什么以下命令永远无法创建一个带有功能插件的\
  \ Jar 文件：`jar -cf HalloWeltPlugin.jar HalloWeltPlugin.class`？\n\n## 3.6 总结\n\n|\
  \ 术语 | 含义 |\n| --- | --- |\n| 程序代码/源代码/源代码 | 构成程序的文本。 |\n| 信息文件 | 包含插件信息的文件，例如名称。\
  \ |\n| Jar 文件/Java 存档 | 包含 Java 代码和其他文件的打包文件。 |\n\n| 命令 | 参数 | 描述 |\n| --- | ---\
  \ | --- |\n| `import packetname` | `packetname`: 一个 Java 包的名称，例如`net.canarymod.plugin.Plugin.`\
  \ | 为插件添加指定的包。 |\n| `this.getLogger().info(meldung)` | `meldung`: 文本 | 写入带有指定消息的日志条目。\
  \ |\n\n\n\n\n通过“你好世界（Hallo Welt!）”插件，你已经让服务器变得更友好了一些。如果你作为玩家不做出相应的回应，那将非常不礼貌。因此，本章将介绍玩家如何以所谓的聊天命令（Chat\
  \ Commands）的形式向服务器发送消息。\n\n你可能在玩 Minecraft 时已经熟悉聊天命令了。它们是指输入到聊天控制台的命令，控制台可以通过 T\
  \ 键打开。例如，图 4.1 中，可以看到 `/help` 命令的输出，它会显示所有可用的聊天命令列表。本章的目标是创建一个 `/halloServer` 命令，让玩家可以用它向服务器发送问候。\n\
  \n![](img/4_Abbildung_4.1.jpg)\n\n**图 4.1：** 聊天命令\n\n### 4.1 定义自定义命令\n\n首先，最好是再次为该插件创建一个自己的文件夹，这样你以后更容易保持思路。文件夹的名字可以和插件一样，例如\
  \ `HalloServerPlugin`。在其中你仍然需要两个名为 `plugin.yml` 和 `HalloServerPlugin.java` 的文件。\n\
  \n你可以在 Listing 4.1 中看到的信息文件开头可能已经非常眼了，因为与上一章相比，这里变化很少，只有名称以及相应的 `main` 条目发生了变化，结构暂时保持不变。\n\
  \n```\n1  name: Hallo_Server-Plugin\n2  main: HalloServerPlugin\n\n3  api-version:\
  \ 1.15\n\n4  version: 1.0 \n```\n\n**Listing 4.1：** `plugin.yml` 步骤 1\n\n然而，这并不是完整的信息文件，因为要在你的插件中使用自定义的聊天命令，必须先在对应的\
  \ `plugin.yml` 中定义它们，位于 `commands` 术之后，正如你在 Listing 4.2 中所示。\n\n```\n1  name: Hallo_Server-Plugin\n\
  2  main: HalloServerPlugin\n\n3  api-version: 1.15\n\n4  version: 1.0\n\n5  commands:\n\
  \n6      halloserver:\n\n7          description: Sendet einen Gruss an den Server\n\
  \n8          usage: /halloServer \n```\n\n**Listing 4.2：** `plugin.yml` 步骤 2\n\n\
  命令本身（在此例中为 `halloServer`）在紧随其后的行定义。其后是 `description`，这是英语，意为“描述”。在这里你可以输入描述该命令作用的文本。这段文字稍后帮助界面显示给玩家。`usage`\
  \ 具有类似的功能，它也是英语，意为“用法”。在这里你可以给玩家提供如何正确使用命令的提示。对于这个非常简单的命令，只需输入以斜杠开头的名称即可。在这两个字段中，你都应该避免使用变音字母如\
  \ ä、ö、ü 以及 ß。\n\n**注意：** 在信息文件中不允许出现 ä、ö 或 ü 等变音字母以及 ß。\n\n这一次我们将分步来处理 Java 文件的内容。新插件的基础结构可以在\
  \ Listing 4.3 中找到。在那里你会看到一些可能已经熟悉的内容，但也有一些新内容。\n\n在前几行中，你一定会会注意到这次又多了三个导入（import），确保确保可以使用聊天命令系统和聊天本身。\n\
  \n```\n 1  import org.bukkit.Bukkit;\n2  import org.bukkit.plugin.java.JavaPlugin;\n\
  3  import org.bukkit.command.Command;\n4  import org.bukkit.command.CommandSender;\n\
  5 \n6  public class HalloServerPlugin extends JavaPlugin {\n7      public void onEnable()\
  \ {\n8      }\n9 \n10      public void onDisable() {\n11      }\n12 \n13      public\
  \ boolean onCommand(CommandSender sender, Command befehl, String befehlsname, String[]\
  \ args){\n14          return true;\n15      }\n16  } \n```\n\n**Listing 4.3：** `HalloServerPlugin.java`\
  \ 步骤 1\n\n在第 6 行你再次找到了熟悉的内容，尽管插件的名称显然改变了。在第 7 到 11 行中，你也找到了老朋友，你已经在上一章中了解过 `onEnable`\
  \ 和 `onDisable` 函数，这一次它们都是空的，因此不包含任何其他内容。\n\n\n\n唯一的更改位于第 14 行，这里添加了 `Bukkit.broadcastMessage()`\
  \ 命令。该命令的工作原理与你在上一节中学过的 Logger 非常相似。但是，Logger 的消息只会在服务器控制台中输出，只有服务器管理员可以看到，而登录服务器的玩家是看不到。相比之下，新命令使用聊天系统来发送消息，因此每个玩家都可以阅读。你可以使用该命令发送任何文本，只需更改引号中的文字即可。\n\
  \n```\n 1  import org.bukkit.Bukkit;\n 2  import org.bukkit.plugin.java.JavaPlugin;\n\
  \ 3  import org.bukkit.command.Command;\n 4  import org.bukkit.command.CommandSender;\n\
  \ 5  \n 6  public class HalloServerPlugin extends JavaPlugin {\n 7      public void\
  \ onEnable() {\n 8      }\n 9  \n10      public void onDisable() {\n11      }\n\
  12  \n13      public boolean onCommand(CommandSender sender, Command befehl, String\
  \ befehlsname, String[] args){\n14          Bukkit.broadcastMessage(\"Hallo Spieler\"\
  );\n15          return true;\n16      }\n17  } \n```\n\n**Listing 4.4:** `HalloServerPlugin.java`\
  \ 步骤 2\n\n编译、打包并复制修改后的插件后，你可以重新连接服务器并测试输入 `/halloServer` 命令会发生什么。如果一切运行正常，你将收到服务器返回的友善问候，如图\
  \ 4.3 所示。\n\n![](img/4_Abbildung_4.3.jpg)\n\n**图 4.3:** 插件的聊天输出\n\n## 4.3 谜题\n\n\
  1. 如果你想将聊天命令从 `/halloServer` 改为 `/hallo`，需要修改哪些行？\n2. 调整“Hallo Server!”插件，使服务器以后发送消息“Willkommen\
  \ Spieler!”而不是“Hallo Spieler!”。\n\n## 4.4 总结\n\n| 术语 | 含义 |\n| --- | --- |\n| 聊天命令\
  \ (Chat-Command) | 可以在 Minecraft 聊天中使用的命令，例如 `/help`。 |\n\n| 命令 | 参数 |  |\n| ---\
  \ | --- | --- |\n| `Bukkit.broadcastMessage(meldung)` | `meldung`: 文本 | 将指定的消息作为聊天消息发送给所有玩家。\
  \ |\n\n# 第 5 章：安装和配置 Eclipse\n\n在编写前两个插件时，你可能已经注意到对插件的任何更改都会产生大量工作。首先必须重新编译代码，然后创建\
  \ Jar 文件，最后还必须复制它。在本章中，你将学习一种简化此过程的方法。这将使用所谓的**集成开发环境**，英语为 *Integrated Development\
  \ Environment*，简称 **IDE**。\n\n这些内容在第一章末尾简要提到过。具体来说，我们在这里如何安装 **Eclipse**（Java 最著名的\
  \ IDE 之一）并将其配置用于编写 Minecraft 插件。\n\n## 5.1 安装\n\n首先，你需要下载 Eclipse，像往常一样，可以在书籍网站\
  \ [buch.daniel-braun.com](http://buch.daniel-braun.com) 找到链接。Eclipse 适用于 Windows、macOS\
  \ 和 GNU/Linux。\n\n在 macOS 和 GNU/Linux 上，下载 Eclipse 后只需将其解压即可开始。\n\n在 Windows 上，步骤稍有不同，但并不复杂。你可以双击启动下载的安装文件，随后会弹出图\
  \ 5.1 所示的窗口。在这里，只需点击即可选择第一项 Eclipse IDE for Java Developers。然后点击 Install，只需等待片刻，安装就会完成。\n\
  \n![](img/5_Abbildung_5.1.jpg)\n\n**图 5.1:** Windows 下安装 Eclipse\n\n## 5.2 配置\n\n\
  当你安装后首次启动 Eclipse 时，无论你的操作系统是什么，首先迎接你的将是图 5.2 所示的窗口。在这里，你可以设定所谓的“工作空间”（Workspace），即\
  \ Eclipse 存储你的程序代码（即你的插件）的文件夹。在这里，你可以选择之前的插件文件夹或任何其他文件夹。\n\n![](img/5_Abbildung_5.2.jpg)\n\
  \n**图 5.2:** 设置工作空间\n\n\n\n正如你所见，那里有许多 Einstellungsmöglichkeiten, die auf den ersten\
  \ Blick etwas überwältigend wirken können. Du musst dich jedoch lediglich auf ein\
  \ Feld konzentrieren：`Name`。Hier trägst du ein, wie die Java-Datei heißen soll,\
  \ also »HalloServerPlugin«. Sobald du diesen eingetragen hast, kannst du das Fenster\
  \ durch einen Klicken auf den Finish-Button schließen.\n\n![](img/5_Abbildung_5.7.jpg)\n\
  \n**Abb. 5.7:** New Java Class 窗口\n\nDanach erscheint im Package Explorer auf der\
  \ linken Seite, wie in bildung 5.8 zu sehen ist, ein Ordner `src`, in dem sich die\
  \ soeben angestellte Java-Datei befindet. Mit einem Doppelklick auf die Datei kannst\
  \ du sie im Editor in der Mitte des Bildschirms öffnen und den Inhalt der alten\
  \ `HalloServerPlugin`-Datei hineinkopieren, vergiss danach das Speichern nicht.\n\
  \n![](img/5_Abbildung_5.8.jpg)\n\n**Abb. 5.8:** Package Explorer mit Java-Datei\n\
  \n### 5.4.2 Info-Datei\n\nNun fehlt zur Vollständigkeit nur noch die Info-Datei.\
  \ Um diese zu erzeugen, musst du zuerst wieder auf `File` und `New` klicken und\
  \ im Anschluss diesmal auf `Untitled Text File`, also unbenannte Textdatei. Dadurch\
  \ öffnet sich im Editor einfach eine neue leere Datei, in die du den Inhalt der\
  \ im letzten Kapitel erstellten `plugin.yml` kopieren kannst. Um die Datei anschließend\
  \ zu speichern, klickst du zuerst auf `File` und dann auf `Save As...`, woraufhin\
  \ sich der in bildung 5.9 gezeigte Dialog öffnet. Hier wählst du zuerst das passende\
  \ Projekt aus, also `HalloServerPlugin`, gibst dann den passenden Dateinamen ein,\
  \ also `plugin.yml`, und klickst anschließend auf `OK`.\n\n![](img/5_Abbildung_5.9.jpg)\n\
  \n**Abb. 5.9:** Speichern-Dialog\n\n### 5.5 Kompilieren und packen\n\nBis zu dieser\
  \ Stelle fragst du dich vielleicht, wieso du überhaupt den Aufwand betreiben solltest,\
  \ Eclipse zu verwenden, denn von einer Vereinfachung ist bisher noch nichts zu merken.\
  \ Das wird sich nun allerdings ändern, wenn wir uns mit dem Kompilieren und Packen\
  \ der Dateien beschäftigen. Die Konsole beziehungsweise Eingabeaufforderung benötigst\
  \ du dank dank Eclipse in Zukunft nicht mehr, einige wenige Klicks reichen aus.\n\
  \nAuch hierfür klickst du zuerst wieder auf `File`, dann diesmal allerdings auf\
  \ `Export`. Im `Export`-Fenster wählst du dann, wie in bildung 5.10, im Ordner `Java`\
  \ den Eintrag `JAR file` aus und klickst anschließend auf `Next`.\n\n![](img/5_Abbildung_5.10.jpg)\n\
  \n**Abb. 5.10:** Export-Fenster\n\nIm folgenden Fenster kannst du dann auswählen,\
  \ welche Dateien in die Jar-Datei gepackt werden sollen. Wichtig ist hier, dass\
  \ du, wie in bildung 5.11, auf der linken Seite den `src`-Ordner auswlst und auf\
  \ der rechten Seite die Datei `plugin.yml`. Die Haken bei den beiden anderen Dateien\
  \ auf der rechten Seite kannst du dagegen entfernen.\n\n![](img/5_Abbildung_5.11.jpg)\n\
  \n**Abb. 5.11:** Jar-Export\n\nWenn du nun auf `Browse...` klickst, kannst du den\
  \ Namen festlegen, unter dem die Jar-Datei gespeichert werden soll, und in welchem\
  \ Ordner sie gespeichert werden soll. Wenn du hier direkt den Plugin-Ordner deines\
  \ Servers auswlst, kannst du dir ein späteres Kopieren der Datei sparen. Hast du\
  \ alle Eingaben gemacht, reicht ein Klick auf `Finish` und schon ist deine Jar-Datei\
  \ fertig. Immer wenn du Änderungen an deinem Plugin vornimmst, wiederholst du einfach\
  \ diese Schritte. So kannst du drei Arbeitsschritte, Kompilieren, Packen und Kopieren,\
  \ in einem kombinieren und musst keinen Text mehr in der Konsole oder Eingabeaufforderung\
  \ eingeben.\n\nWelche der beiden Methoden du in Zukunft verwenden willst, ist ganz\
  \ alleine dir überlassen. Sämtliche Plugins lassen sich sowohl über Eclipse als\
  \ auch über die Konsole beziehungsweise Eingabeaufforderung erstellen.\n\n# Kapitel\
  \ 6: Variablen und Konstanten\n\nNachdem du bereits zwei Plugins erfolgreich zum\
  \ Laufen bekommen hast, wollen wir in diesem Kapitel nun, wie versprochen, damit\
  \ beginnen, einen genaueren Blick auf die Programmiersprache Java zu werfen, um\
  \ zu verstehen, warum die Plugins das tun, was sie tun. Zunächst soll es um eines\
  \ der wichtigsten Konzepte in jedermiersprache gehen: um Variablen.\n\n## 6.1 Variablen\n\
  \nDie beiden Plugins, die du programmiert hast, haben gemeinsam, dass sie immer\
  \ dasselbe tun. Das »Hallo Welt!-Plugin zeigt bei jedem Start des Servers immer\
  \ wieder dieselbe Meldung an und das »Hallo Server!-Plugin versendet bei jeder Eingabe\
  \ des Befls dieselbe Chat-Nachricht. Für diese beiden kleinen Plugins mag das in\
  \ Ordnung sein, die meisten Programme müssen aber flexibler sein. Ein Programm zum\
  \ Online-Banking wäre zum Beispiel ziemlich nutzlos, wenn man damit immer nur Geld\
  \ auf dasselbe Konto überweisen könnte. Oder stell dir vor, man könnte bei einer\
  \ Suchmaschine immer nur nach demselben Begriff suchen.\n\nDamit das nicht der Fall\
  \ ist, müssen Programme auf Nutzereingaben reagieren. Diese Eingaben werden dann\
  \ von Programmen verarbeitet und es wird eine bestimmte Ausgabe erzeugt. Dieses\
  \ Vorgehen ist in der Datenverarbeitung ein grundlegendes Prinzip und wird als **EVA-Prinzip**\
  \ bezeichnet, nach den Anfangsbuchstaben von **E**ingabe, **V**erarbeitung und **A**usgabe.\n\
  \nStell dir zum Beispiel ein Programm vor, das zu jeder ganzen Zahl, die eingegeben\
  \ wird, die nächstgrößere ganze Zahl ausgibt. Also für »1» wäre die Antwort »2«,\
  \ für »2» wäre die Antwort »3«, für »100» wäre es »101» und immer so weiter. Wenn\
  \ man das Ganze ein wenig formaler ausdrücken möchte, könnte man zum Beispiel sagen:\
  \ Für jede Zahl x, die eingegeben wird, wird die Zahl x+1 ausgegeben. Weil es unmöglich\
  \ wäre, alle Fälle aufzuzählen (endlich gibt es unendlich viele ganze Zahlen), wurde\
  \ ein Platzhalter eingefügt, der für eine Zahl steht.\n\n\n\n\n-   Wenn ein Variablenname\
  \ aus zwei oder mehr Wörtern besteht, werden diese im sogenannten `CamelCase` (Dschnick)\
  \ geschrieben. Das bedeutet: Die Wörter werden zusammeneinandergeschrieben und der\
  \ Anfangsbuchstabe jedes Wortes außer dem ersten wird großgeschrieben. Also zum\
  \ Beispiel: `meineVariable`, `meineLangeVariable` und `meineSehrLangeVariable`.\n\
  \nNeben dem Namen enthält die Deklaration einer Variablen auch ihren `Typ`. Die\
  \ Variable in Listing 6.1 hat den Typ `int`, was die Abkürzung für `Integer` ist.\
  \ In Java – und den meisten anderen Programmiersprachen – wird nicht nur zwischen\
  \ verschiedenen Variablenarten (wie Zahlen oder Text) unterschieden, sondern auch\
  \ innerhalb der Zahlen gibt es verschiedene Datentypen.\n\nVariablen vom Typ `Integer`\
  \ können nur ganze Zahlen, also Zahlen ohne Nachkommastellen, speichern. Außerdem\
  \ können `Integer`-Variablen keine beliebig großen Zahlen speichern, sondern nur\
  \ solche, die zwischen -2.147.483.648 und 2.147.483.647 liegen. Für größere oder\
  \ kleinere ganze Zahlen bietet Java zudem verschiedene andere Datentypen an. Tabelle\
  \ 6.1 zeigt die Java-Variablentypen für Ganzzahlen und ihren jeweiligen Wertebereich.\n\
  \n| Typ | Wertebereich |\n| --- | --- |\n| `byte` | -128 bis 127 |\n| `short` |\
  \ -32.768 bis 32.767 |\n| `int` | -2.147.483.648 bis 2.147.483.647 |\n| `long` |\
  \ -9.223.372.036.854.775.808 bis 9.223.372.036.854.775.807 |\n\n**Tabelle 6.1:**\
  \ Primitive Ganzzahldatentypen in Java\n\nWahrscheinlich fragst du dich jetzt, warum\
  \ es eigentlich verschiedene Datentypen für Zahlen gibt. Es wäre doch am einfachsten,\
  \ immer eine `long`-Variable zu benutzen, schließlich kann sie die meisten Zahlen\
  \ speichern. Der Grund ist, dass die verschiedenen Datentypen unterschiedlich viel\
  \ Speicherplatz beanspruchen. Eine `long`-Variable benötigt nach ihrer Deklaration\
  \ immer die gleiche Menge Arbeitsspeicher, egal ob eine Null oder 9.223.372.036\
  \ darin gespeichert ist. Je kleiner der Wertebereich, desto kleiner auch der belegte\
  \ Speicherplatz. Eine `int`-Variable belegt zum Beispiel nur halb viel Speicherplatz\
  \ wie eine `long`-Variable. In der Praxis und auch in diesem Buch wird die `int`-Variable\
  \ in der Regel am häufigsten eingesetzt.\n\nZum Speichern von sogenannten Fließ-\
  \ oder Glekommazahlen, also Zahlen mit Nachkommastellen, bietet Java zwei verschiedene\
  \ Datentypen an: `float` und `double`. Diese unterscheiden sich, wie Tabelle 6.2\
  \ zeigt, in der Genauigkeit, also in der Anzahl der Nachkommastellen, die gespeichert\
  \ werden können.\n\n### Tipp\nObwohl man von Fließkommazahlen spricht, verwendet\
  \ man in Java einen Punkt statt eines Kommas. Das liegt daran, dass das Komma im\
  \ Englischen als Trennzeichen verwendet wird. Während man hier für 1337 auch `1.337`\
  \ schreiben könnte, schreibt man im Englischen `1,337`. Für 1/2 schreibt man im\
  \ Deutschen `0,5` und im Englischen `0.5`.\n\n| Typ | Wertebereich |\n| --- | ---\
  \ |\n| `float` | -3,40282347 x 10³⁸ bis 3,40282347 x 10³⁸ |\n| `double` | -1,797693134862157\
  \ x 10³⁰⁸ bis 1,797693134862157 x 10³⁰⁸ |\n\n**Tabelle 6.2:** Fließkommazdatentypen\n\
  \n### Hinweis\nDie hier angegebenen Wertebereiche dienen nur als Orientierung, tatsächlich\
