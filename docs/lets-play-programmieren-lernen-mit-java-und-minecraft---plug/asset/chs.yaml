  \n## A.7 第 7 章\n\n### A.7.1 谜题 1\n\n```java\na = true && false = false\nb = false\
  \ || true = true\nc = false\nd = (true || false) && true = true && true = true\n\
  e = true ^ true = false\n```\n\n### A.7.2 谜题 2\n\nDa die Laufbedingung der Schleife\
  \ `i < 5` ist, wird die Schleife abgebrochen, sobald `i` den Wert `5` erreicht.\
  \ Der Schleifenrumpf wird also nie mit diesem Wert ausgeführt und `b` bleibt daher\
  \ `false`.\n\n### A.7.3 谜题 3\n\nDie `while`-Schleife ist kopfgesteuert, das heißt,\
  \ es wird vor Ausführung der Schleife die Laufbedingung geprüft. Da `i = 0` und\
  \ die Laufbedingung `i < 0` ist, wird der Schleifenrumpf also überhaupt nicht ausgeführt\
  \ und `i` bleibt `0`.\n\n\n\n\n相反，`do-while` 循环是后置判断的（foot-controlled），这意味着它至少执行一次，然后才检查循环条件。因此，`j`\
  \ 被设置为 `1`。\n\n### A.7.4 谜题 4\n\n`x++` 语句仅位于外层循环内部。由于循环恰好运行了十次，因此 `x` 被累加了十次 1，在起始值为\
  \ `0` 的情况下，`x` 的结果为 `10`。\n\n`y++` 语句位于内层循环中。内层循环在每次外循环中会重复 `20` 次。但由于它位于外层循环内部，它总共会被完整地执行\
  \ `10` 次。十次二十次循环总共产生了两百次 `200` 次循环，因此对应的 `y` 值也为 `200`。\n\n## A.8 第 8 章\n\n### A.8.1\
  \ 谜题 1\n\n通过一个前置判断循环（head-controlled loop），可以以多种方式模拟分支的行为，例如如下：\n\n```\n1  boolean\
  \ b = true;\n\n2  \n\n3  while(a && b){\n\n4      //命令\n\n5      b = false;\n\n\
  6  } \n```\n\n例如，这个循环仅在 `a` 为真时才会执行，且仅执行一次。因此，它的行为类似于分支 `if(a)`。\n\n### A.8.2 谜题\
  \ 2\n\n由于 `a` 的起始值为 `false`，第 8 行的 `while` 循环不会执行，`i` 保持为 `0`。由于下一个循环是后置判断循环，尽管\
  \ `a` 仍然为 `false`，它也会执行一次。因此 `j` 的值增加到了 `1`。因如此，第 16 行的 `i` 和 `j` 不相等（`0 == 1`），因此执行分支的\
  \ `else` 部分，变量 `ausgabe` 获得值“不相等”。\n\n## A.9 第 9 章\n\n### A.9.1 谜题 1\n\n第一行指定的函数返回值类型为\
