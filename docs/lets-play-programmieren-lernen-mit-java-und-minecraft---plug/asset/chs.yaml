  \ int hoehe = Integer.valueOf(args[0]);\n 19              int breite = Integer.valueOf(args[1]);\n\
  \ 20              Player spieler = (Player) sender;\n 21              \n 22    \
  \          Mauer mauer = new Mauer(hoehe, breite, Material.GOLD_BLOCK);\n 23   \
  \       }\n 24          else{\n 25              this.getLogger().info(\"Dieser Befehl\
  \ kann nur von Spielern ausgefuehrt werden.\");\n 26          }\n 27  \n 28    \
  \      return true;\n 29      }\n 30  \n 31      public void mauerBauen(Player spieler,\
  \ Mauer mauer){\n 32          Location position = spieler.getLocation();\n 33  \
