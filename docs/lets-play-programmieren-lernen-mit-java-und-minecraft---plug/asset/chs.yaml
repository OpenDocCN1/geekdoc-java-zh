  \ `onDisable` 函数。它是 `onEnable` 函数的对应项，当你的插件关闭时它总是会被调用。从理论上讲，也可能出现插件在没有重启服务器的情况下被手动关闭。即使如此，数据也会丢失，因此在这种情况下也应该对其进行保存。在\
  \ Listing 15.15 中，你可以看到用于保存 `schilderListe` 的 `onDisable` 函数。\n\n在第 2 行中，首先检查 `schilderListe`\
  \ 的长度，并借此检查是否已经建造了牌子——如果没有的话，自然没有什么东西要保存的。虽然配置文件的管理主要由服务器负责，但你必须自己处理自己的文件，因此在第 3\
  \ 行中，首先使用 `exists` 命令检查插件的数据文件夹是否存在。如果不存在，则会在第 4 行使用 `mkdirs` 创建它。在第 7 行中，设定了存储列表的文件路径。该路径由数据文件夹的路径和文件名组成，如果你愿意，可以在文件名后添加后缀，例如用于\
  \ Java 对象的 `.jo`，但你不必这样做。实际的保存操作随后在第 10 行的 `try` 块中开始。首先必须加载一些保存所需的类，但这些类对我们来说不再进一步重要。关键是第\
  \ 12 行的命令。通过 `writeObject` 将对象保存到文件中。之后，只需用 `close` 关闭文件即可。\n\n```\n 1  public void\
  \ onDisable(){\n 2      if(schilderListe.size() > 0){\n 3          if(!this.getDataFolder().exists()){\n\
  \ 4              this.getDataFolder().mkdirs();\n 5          }\n 6          \n 7\
  \          File datei = new File(this.getDataFolder(), \"/schilderListe\");\n 8\
  \          \n 9          try {\n10              OutputStream stream = new FileOutputStream(datei);\n\
  11              ObjectOutputStream objectStream = new ObjectOutputStream(stream);\n\
  12              objectStream.writeObject(schilderListe);\n13              objectStream.close();\n\
  14          }\n15          catch (IOException e) {\n16              e.printStackTrace();\n\
  17          }\n18      }\n19  } \n```\n\n**Listing 15.15:** `onDisable` 函数\n\n但仅仅保存数据是不够的。在启动时，必须在使用这些文件之前再次已保存的文件。为此，必须像\
  \ Listing 15.16 所示那样调整 `onEnable` 函数。\n\n在这里，首先在第 4 行检查相应的文件是否存在。如果不存在，显然还没有建造牌子，可以像之前一样从空列表开始。反之，如果文件存在，则从第\
  \ 6 行开始，原则上按反向执行 Listing 15.15 中的步骤，直到在第 8 行实际上从文件中读取信息并存储在变量 `schilderListe` 中。此时，所有数据都回到了它们应该去的地方，即使重启后，你也可以继续顺利地更改牌子的文本。\n\
