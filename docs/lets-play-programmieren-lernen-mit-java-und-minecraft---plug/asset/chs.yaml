  \ 的新版本\n\n\n\n\nKehren wir zurück zu unserem ersten Beispiel, einem Programm oder\
  \ in diesem Fall einem Plugin, das jede eingegebene Zahl erhöht und das Ergebnis\
  \ ausibt. Auf ersten Blick sollte dies mit dem, was du bisher gelernt hast, eigentlich\
  \ kein Problem sein. Es gibt jedoch ein Problem: Beim letzten Plugin haben wir den\
  \ mit dem Befehl übergebenen Parameter in einer String-Variable gespeichert, also\
  \ als Zeichenkette. Wenn eine Zahl in einer String-Variable gespeichert wird, behandelt\
  \ Java diese als Zeichenkette, obwohl wir Menschen sofort erkennen, dass es sich\
  \ um eine Zahl handelt.\n\n```\n1  String zahl = \"7\";\n\n2  String zahl2 = zahl\
  \ + 1; \n```\n\n**Listing 6.12:** Beispiel Zahl als Zeichenkette\n\nWenn du nun\
  \ versuchen würdest ein Plugin zu schreiben, das den Parameter eines Befehls weiterhin\
  \ als String einliest und dann eins erhöht, würde der Code ähnlich aussehen wie\
  \ in Listing 6.12. Aber was wäre dann der Wert der Variable `zahl2`? 7 + 1, das\
  \ sollte eigentlich 8 sein. Allerdings wird die 7 hier als String interpretiert.\
  \ Und für Strings hat das Pluszeichen, wie du bereits weißt, eine andere Bedeutung:\
  \ Es fungiert als Konkatenationsoperator. Deshalb ist das Ergebnis von \"7\" + 1\
  \ und damit auch der Wert von `zahl2` \"71\".\n\nDas ist natürlich nicht das gewünschte\
  \ Ergebnis. Um dies zu erreichen, muss die 7 als Zahl und nicht mehr als Zeichenkette\
  \ interpretiert werden. Nun könnte man auf die Idee kommen in einer entsprechenden\
  \ Funktion eines Plugins einfach Folgendes zu schreiben:\n\n```\n1  int zahl = parameter[1];\n\
  \n2  int zahl2 = zahl + 1; \n```\n\nSpätestens beim Versuch, den entsprechenden\
  \ Quellcode zu kompilieren, wird auffallen, dass dies ebenfalls nicht der richtige\
  \ Weg ist, denn der Java-Compiler wird folgenden Fehler melden: `incompatible types:\
  \ String cannot be converted to int`. Der Grund ist, dass alles, was man in die\
  \ Chat-Zeile eingibt, von Java zuerst immer als String interpretiert wird. Woher\
  \ sollte Java auch wissen, ob der Nutzer mit einer Eingabe wie »42» die Zahl 42\
  \ oder die Zeichenkette aus vier und zwei meint? Wenn du in deinem Plugin eine Eingabe\
  \ als Zahl behandeln möchtest, musst du sie daher von einem String in eine Zahl\
  \ umwandeln. Man nennt diesen Vorgang auch konvertieren.\n\n```\n1  String text\
  \ = \"42\";\n\n2  int zahl = Integer.valueOf(text); \n```\n\n**Listing 6.13:** Konvertierung\
  \ von String zu Integer\n\nListing 6.13 zeigt beispielhaft wie die Konvertierung\
  \ von einem String zu einem Integer-Wert funktioniert. Dazu wird der Befehl `Integer.valueOf()`\
  \ verwendet. Dabei ist es zu beachten, dass die Konvertierung nur funktioniert,\
  \ wenn der Ausgangsstring auch tatsächlich einen Integer-Wert enthält. Wenn der\
  \ Wert des Strings `text` in Listing 6.13 zum Beispiel »Hallo» oder auch »13.37»\
  \ wäre, kä es beim Ausführen des Codes zu einem Fehler, wie in Listing 6.14 gezeigt.\n\
  \n```\n1  Exception in thread \"main\" java.lang.NumberFormatException: For input\
  \ string: \"Hallo\"\n\n2      at java.lang.NumberFormatException.forInputString(NumberFormatException.java:65)\n\
  \n3      at java.lang.Integer.parseInt(Integer.java:504)\n\n4      at java.lang.Integer.valueOf(Integer.java:582)\n\
  \n5      at HelloWorld.main(Konvertierung.java:2) \n```\n\n**Listing 6.14:** Fehlermeldung\
  \ bei einem fehlgeschlagenen Konvertierungsversuch\n\nAnalog funktioniert das Konvertieren\
  \ auch für `byte`-, `short`- und `long`-Variablen, wie Listing 6.15 zeigt.\n\n```\n\
  1  byte b = Byte.valueOf(\"42\");\n\n2  short s = Short.valueOf(\"1337\");\n\n3\
  \  long l = Long.valueOf(\"3000000000\"); \n```\n\n**Listing 6.15:** Konvertierung\
  \ von String zu anderen Ganzzahl-Datentypen\n\nAuch hier muss wieder darauf geachtet\
  \ werden, dass der zu konvertierende String auch tatsächlich einen für den Datentyp\
  \ gültigen Wert enthält, in den konvertiert werden soll. Die Anweisung `Byte.valueOf(\"\
  1337\")` würde zum Beispiel folgende Fehlermeldung produzieren: `Exception in thread\
  \ \"main\" java.lang.NumberFormatException: Value out of range`. Denn der Wertebereich\
  \ von Byte endet bei 127 und der Wert 1337 liegt dementsprechend außerhalb des Bereichs,\
  \ oder auf Englisch »out of range«.\n\nNatürlich können Strings auch in Fließkommazahlen\
  \ umgewandelt werden. Die entsprechenden Befehle für die beiden Datentypen `float`\
  \ und `double` zeigt Listing 6.16. Bei Fließkomahlen ist es wichtig zu achten, dass\
  \ ein Punkt statt eines Kommas genutzt wird.\n\n```\n1  float f = Float.valueOf(\"\
  13.37\");\n\n2  double d = Double.valueOf(\"100.0\"); \n```\n\n**Listing 6.16:**\
  \ Konvertierung von String zu Fließzahl\n\nDer umkehrte Weg – also die Konvertierung\
  \ von Numerischen in String – wird meistens verwendet, um Ausgaben zu erzeugen.\
  \ Listing 6.17 zeigt zwei Anwendungsbe.\n\n```\n1  int i = 1;\n\n2  String s1 =\
  \ String.valueOf(i);\n\n3  double d = 1.0;\n\n4  String s2 = String.valueOf(d);\
  \ \n```\n\n**Listing 6.17:** Konvertierung von Zahlen in Strings\n\n\n\n在数字前加上一个简单的\
  \ `(int)` 可以实现转换。然而，严格来说这不是真正的四舍五入，因为数字的小数部分被直接截断了。因此，在 Listing 6.18 示例中，两个整数变量的值都为\
  \ 12。对于日常使用，人们可能更希望另一个结果，即 `i1` 的值为 12，而 `i2` 的值为 13。\n\n这种行为可以通过 `Math.round()`\
  \ 命令实现。为了使用该命令，必须在 Java 文件的文件的输入一条额外的 `import` 命令：`import java.lang.Math;`。之后，就可以像\
  \ Listing 6.19 中一样使用该命令。通过它，`float` 变量可以四舍五入为 `int`，`double` 变量可以四舍五入为 `long`。\n\
  \n```\n1  float f = 1.4f;\n\n2  double d = 1.5;\n\n3  \n\n4  int i = Math.round(f);\n\
  \n5  long l = Math.round(d); \n```\n\n**Listing 6.19:** 商业四舍五入\n\n在所谓的商业四舍五入中，小于\
  \ .5（不包含）时向下舍入，大于等于 .5（包含）时向上舍入。例如，1.49999 会被向下舍入为 1，而 1.5 会向上舍入为 2。\n\n### 提示\n\
  \n如果你想在代码中直接为 `float` 变量赋值，如 Listing 6.19 中的第一行所示，数字后面必须始终跟一个 `f`。编译器会借此识别出这是一个\
  \ `float` 数字，因为否则浮点数会被自动视为 `double` 值。因此，如果你只写 `float f = 1.4;`，编译器会报错，认为你试图给 `float`\
  \ 变量赋值一个 `double` 值。\n\n除了商业四舍五入，Java 中还有其他三种舍入方法。使用 `Math.ceil()`可以将数字向上舍入到最近的整数。然而，与\
  \ `round` 命令不同，该命令的结果始终返回一个 `double` 变量，如果有需要，将其再次转换为整数变量。例如，`ceil` 方法将 `2.1` 变为\
  \ `3.0`。`Math.floor()` 的原理类似，但它始终向最近的整数舍入，因此例如 `2.9` 会变为 `2.0`。\n\n第三种也是最后一种舍入方法被称为“公平”舍入：如果两个整数距离相等（例如在\
  \ `5.5` 时），则始终舍入到最近的偶数。这意味着，不再像商业四舍五入那样在 .5 时总是向上舍入，而在一半的情况下向上舍入，另一半情况下向下舍入。例如 `5.5`\
  \ 变为 `6`，`4.5` 变为 `4`。对应的 Java 命令是 `Math.rint()`，它同样始终返回一个 `double` 值。\n\nListing\
  \ 6.20 展示了三个新介绍舍入函数的应用。为了使用这些函数，必须在文件开头导入 `java.lang.Math` 程序包。\n\n```\n1  double\
  \ d = 5.5;\n\n2  \n\n3  double auf = Math.ceil(d);\n\n4  double ab = Math.floor(d);\n\
  \n5  double fair = Math.rint(d);\n\n6  \n\n7  int fairInt = (int) fair; \n```\n\n\
  **Listing 6.20:** 其他三种舍入函数的应用\n\n### 提示\n\n根据应用的不同，你可能不想舍入到最近的整数，而是舍入到第一或第二位小数。通过你刚刚学习的命令可以使用一个小技巧来实现：要将一个数字舍入到\
  \ x 位小数，先将其乘以 10^x，进行舍入，然后再除以 10^x。例如，为了将 2.1234 舍入到小数点后两位，你先将该数字乘以 100（即 10²）。然后你得到\
  \ 212.34。这时，你使用任选的函数（例如 `rint`）对该数字进行舍入。之后你得到 212.0。现在将其再次除以 100，得到想要的结果，即 2.12。用\
  \ Java 代码表示，正如 Listing 6.21 所示。\n\n```\n1  float f = 2.1234;\n\n2  f = f * 100;\n\
  \n3  f = Math.rint(f);\n\n4  f = f / 100;\n```\n\n**Listing 6.21:** 舍入到两位小数\n\n\n\
  \n\n```java\n 1  public boolean onCommand(CommandSender sender, Command befehl,\
  \ String befehlsname, String[] args){\n\n 2      String eingabe = args[0];\n\n 3\
  \      long zahl = Long.valueOf(eingabe);\n\n 4      zahl += 1;\n\n 5  \n\n 6  \
  \    Bukkit.broadcastMessage(String.valueOf(zahl));\n\n 7  \n\n 8      return true;\n\
  \n 9  } \n```\n\n#### Listing 6.25：`plusEins` 函数\n\nIn der zweiten Ze wird zunächst\
  \ der eingegebene Parameter des Chats in einem String gespeichert, wie du ihn schon\
  \ vom letzten Plugin kennst. In der dritten Linie wird der String dann in eine Zahl\
  \ umgewandelt, in diesem Fall in eine `long`-Variable. Falls du nicht davon ausgehst,\
  \ dass jemand eine Zahl über zwei Milliarden eingibt, könntest du hierfür auch eine\
  \ `int`-Variable verwenden. In der nächsten Linie wird dann eins zur Variable addiert,\
  \ und zwar mit einer abgeürzten Schreibweise, die du bisher noch nicht kennelernt\
  \ hast.\n\nIn der »klassischen« Schreibweise, die wir bisher verwendet haben, müsste\
  \ diese Linie eigentlich `zahl = zahl + 1;` heißen. Da es aber sehr häufig vorkommt,\
  \ dass man zu einer Variable eine weitere Zahl addieren möchte, bietet Java dafür\
  \ auch die in Listing 6.25 verwendete Kurzschreibweise `zahl += 1;`. Analog dazu\
  \ gibt es auch für die anderen Rechenoperatoren Kurzschreibeweisen: `-=`, für `x\
  \ = x-y`, `*=`, für `x = x*y`, `/=`, für `x = x/y` und `%=`, für `x = x%y`. Für\
  \ den in Listing 6.25 gezeigten Spezialfall, also das Addieren von eins zu einer\
  \ Zahl, gibt es sogar eine noch kürzere Schreibweise: Man könnte die Linie auch\
  \ durch Folgendes ersetzen: `zahl++;`.\n\n**提示**\n\nEs gibt zwei Kurzschreibweisen,\
  \ um einen Wert zu einer Variable zu addieren:\n\nStatt `x = x + y` kannst du auch\
  \ `x += y` schreiben und statt `x = x +1` reicht sogar `x++`.\n\nNachdem die Eingabe\
  \ verarbeitet wurde, folgt in der sechsten Linie mit dem bereits bekannten Befehl\
  \ zum Versenden einer Chat-Nachricht die Ausgabe, wobei die Zahl wieder in einen\
  \ String umgewandelt werden muss. Und eigentlich wäre das Plugin damit auch schon\
  \ fertig. Denn wie in Listing 6.3 zu sehen ist, funktioniert das Plugin schon wie\
  \ erwartet. Auf die Eingabe `/help plusEins` wird eine passende Hilfe angezeigt\
  \ und auf die Eingabe `/plusEins 41` erfolgt erwartungsgemäß die Ausgabe `42`.\n\
  \n![](img/6_Abbildung_6.3.jpg)\n\n**图 6.3：** +1 插件的输出\n\nSchon beim vorherigen Plugin\
  \ gab es das Problem, dass eine Fehlermeldung angezeigt wird, falls der Spieler\
  \ keine zusätzliche Eingabe zum Befehl macht. Dieses Problem gibt es auch hier wieder,\
  \ aber darüber hinaus noch ein weiteres: Was passiert, wenn ein Spieler `/plusEins\
  \ null` oder `/plusEins 5.5` eingibt? Für den Spieler sichtbar passiert nichts,\
  \ allerdings funktioniert die Umwandlung des Strings in eine `long`-Variable nicht\
  \ mehr, und im Log-Fenster des Servers wird auch eine Fehlermeldung erscheinen,\
  \ wie du sie bereits in Listing 6.14 gesehen hast.\n\nImmer wenn du mit Benutzereingaben\
  \ zu tun hast, solltest du davon ausgehen, dass die späteren Nutzer deines Plugins\
  \ oder Programms mindestens so neugierig sind wie du. Früher oder später wird jemand\
  \ – egal ob absichtlich oder unabsichtlich – eine »falsche« Eingabe machen. Bei\
  \ einem Minecraft-Plugin kann das im schlimmsten Fall bedeuten, dass der Server\
  \ abstürzt und mit viel Pech dabei deine Welt, die du mühevvoll aufgebaut hast,\
  \ verloren geht. In den meisten Fällen wird es wie hier einfach dazu führen, dass\
  \ im Log eine entsprechende Fehlermeldung erscheint. Im Idealfall aber erkennt dein\
  \ Plugin die fehlerhafte Eingabe und informiert den Nutzer darüber.\n\nEine Konstruktion,\
  \ die das ermöglicht, hast du bereits kennelernt und sogar im +1-Plugin eingesetzt,\
  \ den try-catch-Block. Das Plugin versucht, die Eingabe dann in eine Zahl umzuwandeln\
  \ und zu verarbeiten, das ist der `try`-Block, und falls dies nicht funktioniert\
  \ wird der Fehler abgefangen und über den Chat ein entsprechende Hinweis verschickt,\
  \ das ist der `catch`-Block. Wie das Ganze in Java-Code umgesetzt aussieht, kannst\
  \ du in Listing 6.26 sehen.\n\n```java\n 1  public boolean onCommand(CommandSender\
  \ sender, Command befehl, String befehlsname, String[] args){\n\n 2      String\
  \ eingabe = args[0];\n\n 3      try{\n\n 4          long zahl = Long.valueOf(eingabe);\n\
  \n 5          zahl += 1;\n\n 6  \n\n 7          Bukkit.broadcastMessage(String.valueOf(zahl));\n\
  \n 8  \n\n 9          return true;\n\n 10      }\n 11      catch(Exception e){\n\
  \ 12          Bukkit.broadcastMessage(\"Fehlerhafte Eingabe!\");\n 13          return\
  \ false;\n 14      }\n 15 }\n```\n\n#### Listing 6.26：带 try-catch 块的 `plusEins`\
  \ 函数\n\nIn der zweiten Linie wird zunächst der eingegebene Parameter des Chat-Befehls\
  \ in einem String gespeichert, wie du ihn schon vom letzten Plugin kennst. In der\
  \ dritten Linie wird der String dann in eine Zahl umgewandelt, in diesem Fall in\
  \ eine `long`-Variable. Falls du nicht davon kannst, dass jemand eine Zahl über\
  \ zwei Milliarden eingibt, könntest du hierfür auch eine `int`-Variable verwenden.\
  \ In der nächsten Linie wird dann eins zur Variable addiert, und zwar mit einer\
  \ abgeürzten Schreibweise, die du bisher noch nicht kennelernt hast.\n\nIn der »klassischen«\
  \ Schreibweise, die wir bisher verwendet haben, müsste diese Linie eigentlich `zahl\
  \ = zahl + 1;` heißen. Da es aber sehr häufig vorkommt, dass man zu einer Variable\
  \ eine weitere Zahl addieren möchte, bietet Java dafür auch die in Listing 6.25\
  \ verwendete Kurzschreibweise `zahl += 1;`. Analog dazu gibt es auch für die anderen\
  \ Rechenoperatoren Kurzschreibeweisen: `-=`, für `x = x-y`, `*=`, für `x = x*y`,\
  \ `/=`, für `x = x/y` und `%=`, für `x = x%y`. Für den in Listing 6.25 gezeigten\
  \ Spezialfall, also das Addieren von eins zu einer Zahl, gibt es sogar eine noch\
  \ kürzere Schreibweise: Man könnte die Linie auch durch Folgendes ersetzen: `zahl++;`.\n\
  \n**提示**\n\nEs gibt zwei Kurzschreibweisen, um einen Wert zu einer Variable zu addieren:\n\
  \nStatt `x = x + y` kannst du auch `x += y` schreiben und statt `x = x +1` reicht\
  \ sogar `x++`.\n\nNachdem die Eingabe verarbeitet wurde, folgt in der sechsten Linie\
  \ mit dem bereits bekannten Befehl zum Versenden einer Chat-Nachricht die Ausgabe,\
  \ wobei die Zahl wieder in einen String umgewandelt werden muss. Und eigentlich\
  \ wäre das Plugin damit auch schon fertig. Denn wie in Listing 6.3 zu sehen ist,\
  \ funktioniert das Plugin schon wie erwartet. Auf die Eingabe `/help plusEins` wird\
  \ eine passende Hilfe angezeigt und auf die Eingabe `/plusEins 41` erfolgt erwartungsgemäß\
  \ die Ausgabe `42`.\n\n![](img/6_Abbildung_6.3.jpg)\n\n**图 6.3：** +1 插件的输出\n\nSchon\
  \ beim vorherigen Plugin gab es das Problem, dass eine Fehlermeldung angezeigt wird,\
  \ falls der Spieler keine zusätzliche Eingabe zum Befehl macht. Dieses Problem gibt\
  \ es auch hier wieder, aber darüber hinaus noch ein weiteres: Was passiert, wenn\
  \ ein Spieler `/plusEins null` oder `/plusEins 5.5` eingibt? Für den Spieler sichtbar\
  \ passiert nichts, allerdings funktioniert die Umwandlung des Strings in eine `long`-Variable\
  \ nicht mehr, und im Log-Fenster des Servers wird auch eine Fehlermeldung erscheinen,\
  \ wie du sie bereits in Listing 6.14 gesehen hast.\n\nImmer wenn du mit Benutzereingaben\
  \ zu tun hast, solltest du davon ausgehen, dass die späteren Nutzer deines Plugins\
  \ oder Programms mindestens so neugierig sind wie du. Früher oder später wird jemand\
  \ – egal ob absichtlich oder unabsichtlich – eine »falsche« Eingabe machen. Bei\
  \ einem Minecraft-Plugin kann das im schlimmsten Fall bedeuten, dass der Server\
  \ abstürzt und mit viel Pech dabei deine Welt, die du mühevoll aufgebaut hast, verloren\
  \ geht. In den meisten Fällen wird es wie hier einfach dazu führen, dass im Log\
  \ eine entsprechende Fehlermeldung erscheint. Im Idealfall aber erkennt dein Plugin\
  \ die fehlerhafte Eingabe und informiert den Nutzer darüber.\n\nEine Konstruktion,\
  \ die das ermöglicht, hast du bereits kennelernt und sogar im +1-Plugin eingesetzt,\
  \ den try-catch-Block. Das Plugin versucht, die Eingabe dann in eine Zahl umzuwandeln\
  \ und zu verarbeiten, das ist der `try`-Block, und falls dies nicht funktioniert\
  \ wird der Fehler abgefangen und über den Chat ein entsprechende Hinweis verschickt,\
  \ das ist der `catch`-Block. Wie das Ganze in Java-Code umgesetzt aussieht, kannst\
  \ du in Listing 6.26 sehen.\n\n```java\n 1  public boolean onCommand(CommandSender\
  \ sender, Command befehl, String befehlsname, String[] args){\n\n 2      String\
  \ eingabe = args[0];\n\n 3      try{\n\n 4          long zahl = Long.valueOf(eingabe);\n\
  \n 5          zahl += 1;\n\n 6  \n\n 7          Bukkit.broadcastMessage(String.valueOf(zahl));\n\
  \n 8  \n\n 9          return true;\n\n 10      }\n 11      catch(Exception e){\n\
  \ 12          Bukkit.broadcastMessage(\"Fehlerhafte Eingabe!\");\n 13          return\
  \ false;\n 14      }\n 15 }\n```\n\n#### Listing 6.26：带 try-catch 块的 `plusEins`\
  \ 函数\n\nIn der zweiten Linie wird zunächst der eingegebene Parameter des Chat-Befehls\
  \ in einem String gespeichert, wie du ihn schon vom letzten Plugin kennst. In der\
  \ dritten Linie wird der String dann in eine Zahl umgewandelt, in diesem Fall in\
  \ eine `long`-Variable. Falls du nicht davon kannst, dass jemand eine Zahl über\
  \ zwei Milliarden eingibt, könntest du hierfür auch eine `int`-Variable verwenden.\
  \ In der nächsten Linie wird dann eins zur Variable addiert, und zwar mit einer\
  \ abgeürzten Schreibweise, die du bisher noch nicht kennelernt hast.\n\nIn der »klassischen«\
  \ Schreibweise, die wir bisher verwendet haben, müsste diese Linie eigentlich `zahl\
  \ = zahl + 1;` heißen. Da es aber sehr häufig vorkommt, dass man zu einer Variable\
  \ eine weitere Zahl addieren möchte, bietet Java dafür auch die in Listing 6.25\
  \ verwendete Kurzschreibweise `zahl += 1;`. Analog dazu gibt es auch für die anderen\
  \ Rechenoperatoren Kurzschreibeweisen: `-=`, für `x = x-y`, `*=`, für `x = x*y`,\
  \ `/=`, für `x = x/y` und `%=`, für `x = x%y`. Für den in Listing 6.25 gezeigten\
  \ Spezialfall, also das Addieren von eins zu einer Zahl, gibt es sogar eine noch\
  \ kürzere Schreibweise: Man könnte die Linie auch durch Folgendes ersetzen: `zahl++;`.\n\
