  \n## 15.3 总结\n\n| 术语 |  |\n| --- | --- |\n| 配置文件 | 用于服务器或单个插件设置的文本文件。 |\n| 序列化 |\
  \ 将 Java 对象准备好存储（例如到文件中）。 |\n\n| 命令 | 参数 | 返回值 |  |\n| --- | --- | --- | --- |\n\
  | `this.getConfig()` |   | `FileConfiguration` | 加载该插件对应的配置文件。 |\n| `FileConfiguration.getInt(name)`\
  \ | `name`: String | int | 从配置文件加载指定名称的整数值。 |\n\n\n\n\n\n| 方法 | 参数 | 返回类型 |  |\n\
  | :--- | :--- | :--- | :--- |\n| `FileConfiguration.getString(name)` | `name`: String\
  \ | String | 从配置文件中加载指定名称的 String 值。 |\n| `FileConfiguration.getBoolean(name)` |\
  \ `name`: String | boolean | 从配置文件中加载指定名称的布尔值。 |\n| `FileConfiguration.getDouble(name)`\
  \ | `name`: String | float | 从配置文件中加载指定名称的 Float 值。 |\n| `FileConfiguration.getList(name)`\
  \ | `name`: String | `List<Object>` | 从配置文件中加载指定名称的列表。 |\n| `FileConfiguration.set(name,\
  \ wert)` | `name`: String, `wert`: Objekt | 在配置文件中保存指定名称的值。 |\n| `this.saveResource(dateiname,\
  \ ueberschreiben)` | `dateiname`: String, `ueberschreiben`: Boolean | 将 Jar 包中的指定文件保存到资源文件夹。\
  \ |\n| `File(ordner, dateiname)` | `ordner`: File, `dateiname`: String | File |\
  \ 从相应的文件夹加载指定的文件。 |\n| `YamlConfiguration.loadConfiguration(datei)` | `datei`: File\
  \ | `FileConfiguration` | 加载指定的配置文件。 |\n| `FileConfiguration.save()` | | | 保存配置文件中的更改。\
  \ |\n| `FileOutputStream(datei)` | `datei`: File | `FileOutputStream` | 创建一个新的 `FileOutputStream`。\
  \ |\n| `ObjectOutputStream(stream)` | `stream`: `FileOutputStream` | `ObjectOutputStream`\
  \ | 创建一个新的 `ObjectOutputStream`。 |\n| `ObjectOutputStream.writeObject(objekt)` |\
  \ `objekt`: Object | | 将对象保存到关联文件中。 |\n| `FileInputStream(datei)` | `datei`: File\
  \ | `FileInputStream` | 创建一个新的 `FileInputStream`。 |\n| `ObjectInputStream(stream)`\
  \ | `stream`: `FileInputStream` | `ObjectInputStream` | 创建一个新的 `ObjectInputStream`。\
  \ |\n| `ObjectInputStream.readObject()` | | Object | 从关联文件中读取保存的对象。 |\n\n# 第 16\
  \ 章：自定义游戏模式\n\n那些被 Minecraft 的魅力吸引的人经常抱怨 Minecraft 中没有预设的游戏目标。对于许多 Minecraft 粉丝和创意人才来说，这正是游戏的魅力所在，但尽管如此，作为插件开发者，如果你愿意，可以开发自定义游戏模式，让玩家必须完成某些任务才能获胜。要开发这样一个自定义游戏模式，你必须在一个插件中结合你之前学会几乎所有技术。\n\
  \n## 16.1 雪球大战\n\n例如，一个“雪球大战”游戏模式会如何？从名称就能看出它的运作方式：玩家之间互相投掷雪球，击中最多的人获胜。这听起来相对简单。但在真正变成一个插件之前，还需要解决一些问题。例如：玩家需要自己寻找雪球吗，还是拥有无限数量的雪球？是否有“永久”排行榜或限时回合？玩家是组队战斗，还是每个人互相斗争？\n\
  \n在开始编写插件之前，会产生这些以及许多问题。一如既常，你作为插件开发者在这些决策上是完全自由的，可以根据自己的意愿设计插件。这里列出的版本是一个简单得多的，但同时也为了给玩家带来巨大的乐趣。\n\
  \n插件的具体工作原理如下：每当玩家进入服务器时，他将获得 16 个雪球。一旦他投出一个雪球，他的库存就会自动补满。列表将记录服务器上每个玩家用雪球击中其他玩家的次数。当输入\
  \ `/highscore` 命令时，将显示一个排行榜，列出服务器上玩家已经收集了多少分。\n\n### 16.1.1 分发雪球\n\n因此，逻辑上的第一个步骤是让每个玩家进入服务器时配备一整叠雪球，即\
  \ 16 个。为了在玩家进入服务器时执行某些操作，正如你可能想到的，你需要一个监听器（Listener）。这个监听器等待 `PlayerJoinEvent`。但还有第二个需要补充雪球库存的机会，即玩家死亡后重新出现在地图上时。为此你可以使用\
  \ `PlayerRespawnEvent`。\n\n因此，在两种情况下，`onEvent` 函数中应该执行相同的操作：给玩家 16 个雪球。初学者可能会直接复制代码，但如果想更改雪球数量或类似的操作，就必须在两个地方调整代码。作为一名经验丰富且懒惰的程序员，你已经知道更好的解决方案，例如继承。\n\
  \n正如你在 `Listing 16.1` 中所示，`MasterListener` 类如你所知的实现了 `Listener` 类。`JoinListener`\
  \ 和 `RespawnListener` 类则继承自 `MasterListener`。实际的功能，即向玩家分发雪球，位于 `MasterListener`\
  \ 的 `schneebaelleGeben` 函数中。\n\n\n\n\n\n在 `schneebaelleGeben` 函数中，如你所示，必须区分三种不同的情况。你从第\
  \ 13 行开始可以看到最简单的一种情况：当玩家背包中已经存在雪球时发生。你可以使用 `contains` 命令来测试是否符合这种情况。在这种情况下，你首先通过\
  \ `inventar.first` 命令访问第一堆雪球，然后使用 `setAmount` 命令将其填满。\n\n如果玩家背包中**没有**雪球，则需要再次区分两种情况：背包（也称为\
  \ `Slot`，槽位）中是否还有空位？这里 `firstEmpty` 命令可以为你提供帮助。它返回第一个空槽的索引编号。如果没有空槽位，它将返回值 -1。相反，如果它返回一个大于\
  \ 35 的值，说明虽然有空槽位，但不是适合放置雪球的槽位。因为玩家背包中的普通物品编号为 0 到 35。上面的数字例如属于头盔槽位或背包中的合成栏。\n\n\
  因此，在 Listing 16.1 的第 19 行中，会检查是否存在槽位，或者只存在 ID 大于 35 的槽位。如果发生这两种情况之一，则说明背包已满，无法简单地添加雪球。\n\
  \n在这种情况下，你有两种选择：要么不给玩家雪球，要么在他的背包中腾出空间。前者可能会阻止玩家参与游戏，例如当他生成在荒漠中心且周围没有雪时。但后者完全可能让他感到非常不悦，例如他背包里的一堆钻石突然被直接替换成了雪球。你可以通过一些方法来缓解这个问题，例如确保你不会为了腾出背包空间而删除掉过于昂贵的物品。然而，在\
  \ Listing 16.1 中所示的版本并没有这样做，它只是直接清空了背包中的第一个槽位。\n\n在第 22 行，雪球会被添加到背包中，无论该空间是刚刚腾出来的还是原本就是空的。这涵盖了所有三种情况，并确保了每个玩家在开始时都配备了至少\
  \ 16 个雪球。\n\n### 16.1.2 自动补充雪球\n\n接下来，你应该确保雪球的供应不会枯竭。具体来说：你必须确保玩家每扔出一个雪球时，背包中就会增加一个新的雪球。\n\
  \n在这里，再次使用一个监听器来等待 `PlayerInteractEvent`，如你在 Listing 16.4 中的 `WurfListener` 类所示。由于该事件不仅在扔出雪球时被调用，例如在使用斧头时也会被调用，你必须首先检查使用的物品是否真的是雪球。\n\
  \n其工作原理你可以在第 13 行看到。如果是的话，你只需要像第 14 行那样将雪球的数量再次加一，就能确保雪球的无限供应了。\n\n```\n 1  import\
  \ org.bukkit.Material;\n 2  import org.bukkit.event.EventHandler;\n 3  import org.bukkit.event.Listener;\n\
  \ 4  import org.bukkit.event.player.PlayerInteractEvent;\n 5  import org.bukkit.inventory.ItemStack;\n\
  \ 6  \n 7  public class WurfListener implements Listener {\n 8      @EventHandler\n\
  \ 9      public void onEvent(PlayerInteractEvent event){\n10          if(event.hasItem()){\n\
  11              ItemStack gegenstand = event.getItem();\n12              \n13  \
  \            if(gegenstand.getType() == Material.SNOW_BALL){\n14               \
  \   gegenstand.setAmount(16);\n15              }\n16          }\n17      }\n18 \
  \ }\n```\n**Listing 16.4:** `WurfListener`-类\n\n### 16.1.3 分数计数\n\n为了将其变成一个真正的游戏模式，必须计算命中次数或分数。最简单的方法是每次命中给一分，那么你的分数就直接等于命中次数。如果你想使用一个更巧妙的系统，可以每命中一次目标加一分，每被命中一次扣一分。这样也可能出现负分，玩家不仅需要注意尽可能多地命中，还要注意保护自己。\n\
  \n为了计算这些分数，使用 `HashMap` 是理想的。`HashMap` 是一个列表，它的索引不仅可以是数字，还可以是任何对象。在具体情况下，你可以使用 `UUID`\
  \ 来访问玩家的分数。如何创建这样的 `HashMap`，你可以在 Listing 16.5 看到。\n\n```\n 1  import java.util.HashMap;\n\
  \ 2  import java.util.UUID;\n 3  import org.bukkit.plugin.PluginManager;\n 4  import\
  \ org.bukkit.plugin.java.JavaPlugin;\n 5  \n 6  \n 7  public class Schneeballschlacht\
  \ extends JavaPlugin {\n 8      HashMap<UUID, Integer> punktestand;\n 9  \n10  \
  \    public void onEnable() {\n11          punktestand = new HashMap<UUID, Integer>();\n\
  12          \n13          PluginManager pluginManager = this.getServer().getPluginManager();\n\
  14          \n15          JoinListener joinListener = new JoinListener();\n16  \
  \        pluginManager.registerEvents(joinListener, this);\n17  \n18          RespawnListener\
  \ respawnListener = new RespawnListener();\n19          pluginManager.registerEvents(respawnListener,\
  \ this);\n20  \n21          WurfListener wurfListener = new WurfListener();\n22\
  \          pluginManager.registerEvents(wurfListener, this);\n23  \n24         \
  \ TrefferListener trefferListener = new TrefferListener(punktestand);\n25      \
  \    pluginManager.registerEvents(trefferListener, this);\n26      }\n27  \n28 \
  \     public void onDisable() {\n29      }\n30  }\n```\n**Listing 16.5:** `Schneeballschlacht`-类\n\
  \n\n\n\n\n```java\nimport java.util.HashMap;\nimport java.util.UUID;\nimport org.bukkit.entity.Entity;\n\
  import org.bukkit.entity.EntityType;\nimport org.bukkit.entity.Player;\nimport org.bukkit.entity.Projectile;\n\
  import org.bukkit.event.EventHandler;\nimport org.bukkit.event.Listener;\nimport\
  \ org.bukkit.event.entity.EntityDamageByEntityEvent;\nimport org.bukkit.event.entity.EntityDamageEvent.DamageCause;\n\
  import org.bukkit.projectiles.ProjectileSource;\n\npublic class TrefferListener\
