  2. 写一个函数 `public int potenz(int a, int b)`，计算 `a^b`。计算幂 `a^b` 的方法是将 `a` 与自身相乘 `b`\
  \ 次。例如，`2³` 是 `2 × 2 × 2`，`9²` 是 `9 × 9`，以此此类推。`a⁰` 是一个例外，因为无论 `a` 代表什么数字，结果始终是\
  \ 1。\n\n## 9.6 总结\n\n| 术语 | 含义 |\n| --- | --- |\n| 函数 | 一种用于代码拆分和重复使用的构造结构。 |\n\
  | 返回值 | 函数执行完毕后返回的值。返回值通过 `return` 命令标记。 |\n| 参数 | 执行函数时传递给函数的一个或多个值。 |\n\n| 命令\
  \ | 参数 | 返回值 | 描述 |\n| --- | --- | --- | --- |\n| `public typ name(parameterTyp\
  \ parameterName){ }` | `typ`, `parameterTyp`: 任意变量类型 | 对于 `void` 无返回值，否则返回类型为 `typ`\
  \ 的值，例如 `int` 或 `String`。 | 声明一个函数 |\n| `return x;` | `x`: 与函数返回值类型相同的值。 | | 结束函数的执行并将\
  \ `x` 作为返回值输出。 | \n\n# 第 10 章：类与对象\n\n当你第一次输入“Hello World!”插件时，你可能只是简单地抄写了很多代码，而并不完全清楚它们是什么意思……（此处省略以保持语义）\n\
  \n当你第一次输入“Hello World!”插件时……（省略）\n\n…… 早在 1805 年，Joseph-Marie Jacquard 就发明了一台可编程的织机。\n\
  \n在本章中，我们将学习面向对象编程。\n\n## 10.1 世界是一个对象\n\n你会立刻发现，这里有大量的重复代码，毕竟为每辆车辆存储了相同的信息。你不需要多思就一定会同意汽车就是一个**对象**。在日常生活中，我们说的对象通常是指我们可以触碰的事物。在面向对象编程的背景下，对象也可以是无法触碰的东西，例如一个想法。\n\
  \n这个例子中的三个对象都属于汽车组。在 OOP 中，我们说这三个对象属于**类**（Class），更准确地说，它们是汽车类的**实例**（Instance）。一个特定的汽车型号就是汽车类的一个实例。\n\
  \n但按序来：这里到底是什么？是在程序中表示现实世界中的物体。\n\n```\nString marke1 = \"Porsche\";\nString modell1\
  \ = \"911\";\nint ps1 = 350;\nint maxw1 = 289;\nint tueren1 = 2;\nint preis1 = 90000;\n\
  \nString marke2 = \"BMW\";\nString modell2 = \"i8\";\nint ps2 = 362;\nint maxw2\
  \ = 250;\nint tueren2 = 2;\nint preis2 = 130000;\n\nString marke3 = \"Mercedes\"\
  ;\nString modell3 = \"S\";\nint ps3 = 333;\nint maxw3 = 250;\nint tueren3 = 4;\n\
  int preis3 = 81000;\n```\n**Listing 10.1:** 将汽车数据表示为变量\n\n因此，我们并不是试图 1:1 地映射物体，而是尝试映射对应用重要的属性。这种忽略无关属性并寻找对程序相关的属性的过程也被称为**抽象**（Abstraction）。\n\
  \n\n\n\n在 OOP 中，我们把这种抽象称为 `Klasse`（类）。在 Listing 10.2 中，你可以看到一个 `Klasse`，其中汇总了我们对汽车感兴趣的属性。这些汇总的属性也被称为\
  \ `Attribute`（属性）。正如你在 Listing 10.2 中看到的，类的定义以 `class` 关键字开始，后面跟着类名。按照惯例，类名始终以大写字母开头。\n\
  \n```\n1  class Auto{\n\n2      String marke;\n\n3      String modell;\n\n4    \
  \  int ps;\n\n5      int maxGeschw;\n\n6      int tueren;\n\n7      int preis;\n\
  \n8  } \n```\n\n**Listing 10.2：** `Auto` 类\n\n一个类本身并没有意义，因为它只是一个抽象概念。只有当你创建一个具体的对象，并为类的每个属性分配具体的值时，它才变得有用。\n\
  \n为了能够从类创建一个具体的对象（例如创建一个具体的汽车型号），类还需要一个所谓的 `Konstruktor`（构造函数），你可以在 Listing 10.3\
  \ 中看到 `Auto` 类的构造函数。构造函数是一个特殊的函数，它始终以 `public` 关键字开头，后面跟着类名。通常情况下，构造函数会像 Listing\
  \ 10.3 所示那样通过参数直接为类的属性赋值，例如汽车的品牌、型号、马力、最高速度、车门数量和价格。\n\n```\n 1  class Auto{\n\n\
  \ 2      String marke;\n\n 3      String modell;\n\n 4      int ps;\n\n 5      int\
  \ maxGeschw;\n\n 6      int tueren;\n\n 7      int preis;\n\n 8  \n\n 9      public\
  \ Auto(String ma, String mo, int p, int max, int t, int pr){\n\n10          marke\
  \ = ma;\n\n11          modell = mo;\n\n12          ps = p;\n\n13          maxGeschw\
  \ = max;\n\n14          t = tueren;\n\n15          pr = preis;\n\n16      }\n\n\
  17  } \n```\n\n**Listing 10.3：**带有构造函数的 `Auto` 类\n\n借助构造函数，可以像 Listing 10.4 所示那样创建\
  \ `Auto` 类的新对象。如你所见，这里的操作与声明变量类似。实际上，这里并没有发生其他变化。`porsche` 现在是一个 `Auto` 类型的变量。\n\
  \n```\n1  Auto porsche = new Auto(\"Porsche\", \"911\", 350, 289, 2, 90000);\n\n\
  2  Auto bmw = new Auto(\"BMW\", \"i8\", 362, 250, 2, 130000);\n\n3  Auto mercedes\
  \ = new Auto(\"Mercedes\", \"S\", 333, 250, 4, 81000); \n```\n\n**Listing 10.4：**创建\
  \ `Auto` 类的对象\n\n### 记忆\n\n`Klasse`（类）是编程语言中的一种构造，用于将汽车等事物映射为程序代码。属性通过被称为 `Attribute`（属性）的变量来表示。`Objekt`（对象）是类的具体实例化，以汽车为例，就是一个具体的型号。创建对象时使用一个名为\
  \ `Konstruktor`（构造函数）的特殊函数。\n\n## 10.2 创建自己的类\n\n现在你在理论上已经对类有了相当的了解，现在是时候在实践中以插件的形式测试一下整个这一切了。首先，你应该创建一个名为\
  \ `AutoInfoPlugin` 的插件文件夹。其中包含常见的信息文件（参见 Listing 10.5）以及常见的 Java 文件。\n\n```\n1 \
