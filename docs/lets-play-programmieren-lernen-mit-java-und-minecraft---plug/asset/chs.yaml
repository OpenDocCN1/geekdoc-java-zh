  \ 不使用 `else` 的解决方案\n\n虽然这种方法有效，但并不美观，因为需要区分的情况越多，最后一个 `if` 条件就变得越长、越混乱。简单将最后一个 `if`\
  \ 替换为 `else` 是行不通的。因为如果此时是一个金块，程序会输出第一条和最后一条消息。因为 `else` 总是只对应最后一个 `if` —— 而由于金块不是土块，最后一条消息也会被输出。\n\
  \n另一个可能的解决方案在 Listing 8.7 中显示，这次使用了 `else` 块。\n\n```\n 1  if(b == Material.GOLD_BLOCK\
  \ || b == Material.WATER || b == Material.DIRT){\n\n 2      if(b == Material.GOLD_BLOCK){\n\
  \n 3          //一个珍贵的方块！\n\n 4      }\n\n 5      if(b == Material.WATER){\n\n 6\
