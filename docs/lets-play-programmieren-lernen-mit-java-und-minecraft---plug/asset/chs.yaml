  \ DRM 的信息可以在相应供应商的页面找到。\n\n# 引言\n\n亲爱的读者：\n\nMinecraft 的世界充满了等待发现的事物。不同的景观、数百种不同的物品以及各种动物和怪物只是等待着你的探索。\n\
  \n但终有一天，即使这种可能性也会耗尽，让你觉得一切都看过了或做过了。如果你有这种感觉，那么这本书正适合你。因为在本书中，你将学习如何利用 `Java` 和 `Bukkit`\
  \ 或 `Spigot` 服务器为 Minecraft 编写自己的扩展程序（即 `Plugins`），然后你可以和朋友们一起在自己的 Minecraft 服务器上尝试它们。\n\
  \n无论你想设计新的合成配方、使用简单的聊天命令建造整栋房子，还是甚至编写一个自己的游戏模式，有了自己的插件，Minecraft 的世界将再次充满挑战和待发现的事物。顺便你还会学习编程——谁知道呢，也许有一天下一个\
  \ Minecraft 就出自你的手！\n\n在在那之前，你还有一段很长的路要走。因此，本书的前两章将首先介绍如何准备计算机来编写和测试自己的插件。书中将向你解释如何安装本书使用的\
  \ `Bukkit` 或 `Spigot` 服务器，如何根据你的需求进行配置，以及如何设置你的电脑以编写 `Java` 程序。\n\n紧接着，在第三章中，我们将直接进入编写第一个自己的插件的阶段。最初的步骤可能让你觉得有些平淡，但随着后续章节的进行，你将拥有越来越多的机会编写越来越复杂的插件。例如，在第四章中，你将学习如何编写和使用自己的聊天命令。\n\
  \n在第 5 章中，你将认识 `Eclipse`，一个支持支持你的编辑器。\n\n随后在第 6 章中，我们将继续学习编程的基本概念。在第 10 章中，你将学习如何让你的插件不会错过服务器上发生的任何事情。\n\
  \n\n\n\n\n在最后一章节中，你将简要地展望一下，除了编写 Minecraft 插件之外，你还可以用新获得的编程技能做些什么。因为当你读到书末时，乐趣远远没有结束，那时你已经拥有了所需的所有工具和知识来完全按照自己的设想设计完全自己的插件。书中附录中的一些列表可以为你提供帮助，你可以在那里快速查找命令以及特别需要的内容。因为无论程序员经验多丰富，并不是所有内容都必须背得下来，你只需要知道在哪里可以查阅——而这正是本书附录的作用。\n\
  \n如果你对本书或通用的 Minecraft 插件有任何问题、批评或建议，欢迎随时与我联系。你可以通过邮件 `info@daniel-braun.com` 与我取得联系，或者通过我的\
  \ Facebook 页面 [www.facebook.com/AutorDanielBraun](http://www.facebook.com/AutorDanielBraun)\
  \ 或我的网站 [www.daniel-braun.com](http://www.daniel-braun.com) 找到我。\n\n### 书籍下载\n\n\
