  \ `else if` 的用法\n\n\n\n`case` 分支不能用于所有的变量类型，而仅用于 `byte`、`short`、`int`、`char` 和 `String`\
  \ 变量。因此，例如使用 `float` 变量是不可能的。分支的主体正如你所知道的那样，是用大括号括起来的。\n\n实际的分类判断发生在主体内部，由关键字 `case`\
  \ 引导。由于在 代码列表 8.12 中比较的是数字，相应的行内容为 `case 1`、`case 2` 等。对于 `char` 变量，比较将是 `case 'a'`、`case\
  \ 'b'` 等，对于 `String` 字符串则是 `case \"String 1\"`、`case \"String 2\"` 等。\n\n与 `if`\
  \ 分支不同，`case` 分支只能与固定值进行比较，因此无法对两个变量进行比较。\n\n在分支主体的最末端还有一个 `default` 情况，它与 `if`\
  \ 分支的 `else` 情况一样，只有在之前的所有条件都不满足时才会执行。在用关键字 `case` 进行分类后，紧跟着一个冒号，然后是需要执行的代码。在 代码列表\
  \ 8.12 示例中，这只是对变量的赋值，但理论上这里可以跟随着任意长度且复杂的代码。\n\n但在下一个 `case` 之前，必须包含一个 `break`（中断），否则即使条件不满足，后续的所有指令也会被执行。对于\
  \ 代码列表 8.12 中的示例，这意味着无论变量 `monat` 的值如何，字符串末尾总是会被赋值值“Ungültiger Monat”（无效月份）。\n\n\
  ### 提示\n\n即使使用 `if` 分支，也可以检查字符串的相等性。对于两个 `String` 变量 `string1` 和 `string2`，正确的命令不是\
  \ `if(string1 == string2)`，而是 `if(string1.equals(string2))`。`==` 和 `equals` 之间的具体区别你将在书中后续章节中了解到。\n\
  \n## 8.3 谜题\n\n1. 想象一下 Java 中没有分支。你如何才能确保代码的某部分只在布尔变量 `a` 为真时执行，且仅执行一次？\n\n2. 在\
  \ 代码列表 8.13 代码结束时，变量 `ausgabe` 的值是多少？\n\n```\n 1  String ausgabe;\n 2  \n 3  int\
  \ i = 0;\n 4  int j = 0;\n 5  \n 6  boolean a = false;\n 7  \n 8  while(a){\n 9\
  \      i++;\n110  }\n 11  \n 12  do{\n 13      j++;\n 14  }while(a)\n 15  \n 16\
  \  if(i == j){\n 17      ausgabe = \"gleich\";\n 18  }\n 19  else{\n 20      ausgabe\
  \ = \"ungleich\";\n 21  }\n```\n\n**代码列表 8.13:** 谜题 2\n\n## 8.4 总结\n\n| 术语 | 含义\
  \ |\n| --- | --- |\n| 分支 | 一种在特定条件下执行源码的结构。 |\n\n| 指令 | 参数 | 返回值 | 描述 |\n| --- |\
  \ --- | --- | --- |\n| `var instanceof Class` | `var`: 任意变量 | boolean | 检查指定的变量是否为指定的类型。\
  \ |\n| `if(a){ }else if(b){ }else{ }` | `a, b`: boolean | | 如果 `a` 满足则执行 `if` 部分，如果\
  \ `b` 满足则执行 `else-if` 部分，如果两个条件都不满足则执行 `else` 部分。 |\n| `switch(x){ case A: //指令\
  \ break; case B: //指令 break; default: //指令 break; }` | `x`: byte, short, int, char,\
  \ String | | 如果 `x` 满足则执行 A 部分，如果 `x` 满足（此处原文可能有误，应为满足 B）则执行 B 部分，如果两个都不满足则执行 default\
  \ 部分。 |\n| `String.equals(s)` | `s`: String | boolean | 检查两个字符串是否匹配。 |\n\n# 第 9\
  \ 章：函数\n\n在最后几个章节中学习了两个重要概念——循环和分支后，在本章中我们将进一步学习**函数**。函数是程序的一部分，可以从其他地方调用。在下一章中你将详细研究\
  \ `public` 关键字，目前你只需要假设每个函数前面都必须有 `public`。\n\n## 9.1 函数声明\n\n在 代码列表 9.2 中，`void`\
  \ 单词并不一定属于函数。因为 `disable` 函数以 `public void` 开始，而 `enable` 函数以 `public boolean` 开始。\n\
  \n函数的声明示例可以在 代码列表 9.1 中看到。那里声明了一个名为 `testFunktion` 的函数，它输出“Dies ist ein Test!”（这是一个测试！）。\n\
  \n```\n1  public void testFunktion(){\n2      this.getLogger().info(\"Dies ist ein\
  \ Test!\");\n}\n```\n\n**代码列表 9.1:** 函数声明\n\n与循环或分支一样，函数也有一个主体，其中包含了相关的代码。函数可以通过其名称从程序的其他地方调用。如下代码：\n\
  \n```\n1  testFunktion();\n2  testFunktion();\n```\n\n因此，结合 代码列表 9.1 给出的函数声明，会在日志中输出文本。每次函数调用都会执行函数主体中的代码。\n\
  \n### 提示\n\n在函数名之前，还有 `public` 和 `void` 这两个单词。你可能对它们已经很熟悉，毕竟正如 代码列表 9.2 所示，你从第一个插件开始就在使用它们。\n\
  \n```\n 1  import org.bukkit.plugin.java.JavaPlugin;\n 2  \n 3  public class HalloWeltPlugin\
  \ extends JavaPlugin {\n 4      public void onEnable() {\n 5          this.getLogger().info(\"\
  Hallo Welt!\");\n 6      }\n 7  \n 8      public void onDisable() {\n 9        \
  \  this.getLogger().info(\"Auf Wiedersehen!\");\n 10      }\n 11  }\n```\n\n**代码列表\
  \ 9.2:** »Hallo Welt»插件\n\n就像变量名一样，函数名也遵循一种约定：第一个字母始终小写，多个单词之间通过驼峰命名法（CamelCase）或内部大写来区分，即每个新单词的首字母都大写。\n\
  \n## 9.2 返回值\n\n我们将在本章中找出 `return` 意味着什么。\n\n\n\n\n这第二个关键字 `boolean` 指定了函数所谓“返回值”的类型。在这里，`void`\
  \ 意味着函数没有返回值。相比之下，`enable` 函数返回一个 `Boolean` 类型的值，即 `true` 或 `false`，而 Listing 9.3\
  \ 中的示例函数则返回一个 `Integer` 类型的值，其返回值在该处为 1。\n\n```\n1  public int eins(){\n\n2    \
  \  return 1;\n\n3  } \n```\n\n**Listing 9.3：** 返回值示例\n\n如果你的函数不是一个 `void` 函数，你必须确保它也返回一个相应的值，否则在编译时会出错。值始终通过\
  \ `return` 命令返回。这意味着，每当你使用函数名调用它时，该名称在相应位置就会像变量一样被返回值替换。例如，`int x = 1 + eins();`\
  \ 这行代码会导致 `x` 获得值 2，因为 `eins()` 函数在 Listing 9.3 中提供了返回值 1，因此它的名称在该处会被值 1 替换。如果你将\
  \ Listing 9.3 中的返回值改为 3，那么这行代码将导致 `x` 获得值 4。\n\n## 9.3 参数\n\n你已经经常使用的另一个函数可以在 Listing\
  \ 9.4 中再次找到，即 `onCommand` 函数。\n\n```\n1  public boolean onCommand(CommandSender\
  \ sender, Command befehl, String befehlsname, String[] args){\n\n2      \n\n3  }\
  \ \n```\n\n**Listing 9.4：** `onCommand` 函数\n\n一个区别立刻显现出来：与之前的函数相比，函数名后的括号不是空的。括号内用逗号隔开着两个变量声明。在函数头圆括号中定义的变量称为\
  \ `Parameter`（参数）。例如，Listing 9.5 中的函数拥有三个参数。它们的名字分别为 `a`、`b` 和 `c`，且都是 `Integer`\
  \ 类型。\n\n```\n1  public int dreierSumme(int a, int b, int c){\n\n2      return a+b+c;\n\
  \n3  } \n```\n\n**Listing 9.5：** 参数示例\n\n通过参数可以将信息传递给函数。如果调用 Listing 9.5 中的函数并传入参数\
  \ 1, 2 和 3，即 `dreierSumme(1,2,3)`，返回值将是 6；而如果使用参数 4, 5 和 6，即 `dreierSumme(4,5,6)`，返回值将是\
  \ 15。\n\n参数在所属的函数内部的行为与普通变量一样。在任何你使用参数名称的地方，它都会被参数当前的值替换。区别在于，你可以在调用函数时直接设置参数的值，而不需要像通常那样编写\
  \ `a = 4`、`b = 5` 等代码。\n\n## 9.4 应用示例\n\n为了阐明函数的原理，我们想通过一个函数编写一个具体的插件。准确来说，是要改进一个现有的插件，即墙插件（Mauer-Plugin）。\n\
