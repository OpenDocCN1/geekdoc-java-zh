  \ |\n\n# 第 11 章：建造\n\n在过去的几个章节中，我们主要涉及 Java 以及学习 Java 中的新结构，而本章的重点完全放在了在 Minecraft\
  \ 中创造事物上。在这里，你在之前章节中学的知识自然会非常有帮助。\n\n## 11.1 应急避难所\n\n几乎每个 Minecraft 玩家都遇到过这个问题：你正在世界中进行探索，远离家园，突然夜色降临了游戏世界。附近没有床，没有可见的避难所，身后你已经听到第一个苦力怪正在缓慢爬近的声。\n\
  \n如果能快速建造一个应急避难所该该有多实用啊。遗憾的是 Minecraft 中没有这种东西。但对于程序员你来说这完全不是问题，你可以为自己写一个插件！\n\n\
  在开始编写新插件之前，你应该始终先考虑插件完成后具体要实现什么功能。在这种情况下，主要是考虑完成后的应急避难所应该长什么样。它至少应该有四面墙和一个屋顶，毕竟要让怪物留在外面。如果有一扇门也不错，你总得能进出你的避难所。内部还应该有光和一张床。对于目前来说这应该足够了，毕竟这只是一个过夜用的应急避难所。\n\
  \n门、床和火炬各占一个方块，因此只要知道相应的方块类型，放置它们相对容易。建造外壳可能会稍微复杂一些。在不同方向上建造四面墙，再加上一个屋顶，这听起来工作量很大。但也有另一种非常优雅且简单的解决方案：你只需要将两个立方体嵌套放置即可。首先用稍后形成外壳的材料创建一个立方体，然后在里面放置一个在每个方向上都小两个方块的空气立方体。你的应急避难所的外墙和天花板就建好了。\n\
  \n### 11.1.1 墙和天花板\n\n你可以重用已经创建的 `Quader` 类，但需要进行微小的调整。因为目前位置是在 `Quader` 类内部确定的。因此，如果你修改\
  \ `bauen` 函数，允许传递一个构建立方体的位置，那么建造两个嵌套的立方体就是可行的。正如 `Listing 11.1` 所示，这并不是问题。\n\n```\n\
