  \ Answer:**\n\n[content]\n两者具有相同的循环条件，拥有相同的循环体。唯一的区别：一个是尾部控制循环，另一个是头部控制循环。在 Listing\
  \ 7.18 中发生了什么？在尾部控制循环中，循环条件在执行循环后才会被检查。这意味着循环体会被执行一次，`i` 被赋值为值 1，循环条件不满足，循环终止。而在\
  \ Listing 7.19 中的头部控制循环中，循环条件在第一次执行之前就会被检查。由于循环条件从一开始就不满足，这里的循环体一次也没有执行。\n\n因此，头部控制循环和尾部控制循环之间的区别在于检查循环条件的时机。这导致尾部控制循环总是*至少会被执行一次*，这对于某些应用场景可能是实用的。\n\
  \n### 注意事项\n\n在本章中，你学习了三种不同的循环：\n\n* `for` 循环\n* `while` 循环\n* `do-while` 循环\n\n\
  只要它们的`循环条件`满足，循环就会重复执行。对于 `for` 和 `while` 循环，它们被称为`头部控制循环`，这意味着循环条件在循环第一次执行之前会被检查。对于\
  \ `do-while` 循环，它是一个`尾部控制循环`，这里循环条件在第一次执行后才被检查。循环中检查循环条件的部分称为`循环头`，而带有实际命令的部分称为`循环体`。\n\
