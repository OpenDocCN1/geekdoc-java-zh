  \ 谜题 4\n\n## 7.4 总结\n\n| 术语 | 含义 |\n| :--- | :--- |\n| 总结 | 一种 |\n| 语法 | 这里的 |\n\
  | 循环 | 一种 |\n| 初始值 | 一个的开始。 |\n| 循环条件 | 必须满足的条件。 |\n| 头部循环 | 位于循环开头的。 |\n| 尾部循环\
  \ | 位于循环结尾的。 |\n| 分支 | 在特定条件下执行代码。 |\n| 命令 | 返回值 |\n| `Player.getLocation()` | 返回玩家的位置。\
  \ |\n| `Location.getX()` | 返回 `Location` 的 X 值。 |\n| `Location.getY()` | 返回 `Location`\
  \ 的 Y 值。 |\n| `Location.getZ()` | `Location` 的 Z 值。 |\n| `Location.setX(x)` | 将\
  \ `Location` 的 X 值更改为 ` 值。 |\n| `Location.setY(y)` | 将 `Location` 的 Y 值更改为 ` 值。\
  \ |\n| `Location.setZ(z)` | 将 `Location` 的 Z 值更改为 ` 值。 |\n| `Player.getWorld()`\
  \ | 返回玩家所在的世界。 |\n| `World.getBlockAt(position)` | 返回该位置的区块。 |\n| `Block.setType(material)`\
  \ | 将区块类型更改为指定的材料。 |\n| `for(int i = 0; i < y; i++)` | 在循环条件满足时重复循环体内的命令。 |\n| `i--`\
  \ | `x = x -1` 的简写形式。 |\n| `while(a)` | 在循环条件满足时重复循环体内的命令。 |\n| `a && b` | 两个真值的逻辑与运算。\
  \ |\n| `a &#124;&#124; b` | 两个真值的逻辑或运算。 |\n| `a ˆ b` | 两个真值的逻辑异或运算。 |\n| `!a` |\
  \ 真值的取反。 |\n| `do{...}while(a)` | 在循环条件满足时重复循环体内的命令，但至少执行一次。 |\n\n\n\n\n你刚刚编写的 Mauer（墙壁）插件是使用此类分支在某些情况下有意义的一个良好示例。为什么会这样，你可以很容易地发现：启动带有\
  \ Mauer 插件的服务器，然后在服务器窗口的命令行中输入命令 `mauer`。结果是一条很长的错误信息，在信息的末尾，你还会发现以下几行：`Caused by:\
  \ java.lang.ClassCastException: org.bukkit.craftbukkit.v1_11_R1.command.ColouredConsoleSender\
  \ cannot be cast to org.bukkit.entity.Player at MauerPlugin.onCommand(MauerPlugin.java:17)\
  \ ~[?:?]`。\n\n这条错误信息想告诉你：在 Mauer 插件的第 17 行中，`sender` 被存储在一个类型为 `Player` 的变量中。因此，插件假设该命令是由一个玩家调用的。在之前的测试中，情况一直是如此，插件也因此运行良好顺畅。但现在调用者不再是玩家，而是服务器本身。通过这种方式，插件无法工作——因为墙壁是在调用者面前建造的。但由于服务器完全不知道地图上的任何位置，这无法实现。\n\
  \n因此，插件实际上应该首先检查调用者是否为玩家，只有在是玩家的情况下才建造墙。这正是分支派上用场的地方。在 Listing 8.1 中，你可以看到所谓 `if`\
  \ 分支的语法。\n\n```\n1  if(true){\n\n2      //Befehle\n\n3  } \n```\n\n**Listing 8.1:**\
  \ if 分支语法\n\n英文单词“if”翻译过来的意思是“如果”或“假如”，这很好地描述了分支的作用。在 `if` 后面跟着一个圆括号，里面是一个条件。在这里，就像循环的运行条件一样，期望一个布尔值，即\
  \ `true` 或 `false`，或者提供这些值的表达式，如比较操作等。接着同样像循环一样，是大括号，它们限制了分支的主体。因此，`if` 分支在原理上的工作方式类似于\
  \ `while` 循环，区别在于主体最多只会被执行一次。\n\n### 提示\n\n由于 `if` 分支和循环具有高度相似性，有时会被错误地称为 `if` 循环。但作为一名优秀的程序员，你自然知道\
  \ `if` 结构是一个分支——而不是循环。\n\n为了调整 Mauer 插件，你现在还需要一个函数来检查调用者是否为玩家，并返回 `true` 或 `false`。在这里\
  \ `instanceof` 命令可以帮助你，它的意思是“……的实例”，正如你在 Listing 8.2 中看到的。关于“实例”这个词到底是什么，我们稍后会讨论。这个命令检查变量是否是特定类型，在这种情况下，例如检查变量\
  \ `caller` 是否为 `Player` 类型（即玩家）。\n\n```\n1  boolean b = sender instanceof Player;\
  \ \n```\n\n**Listing 8.2:** `instanceof` 命令示例\n\n利用这个命令和 `if` 分支，你可以像 Listing 8.3\
  \ 那样扩展 `mauerPlatzieren` 函数。\n\n```\n 1  public boolean onCommand(CommandSender\
  \ sender, Command befehl, String befehlsname, String[] args){\n\n 2      if(sender\
  \ instanceof Player){\n\n 3          Player spieler = (Player) sender;\n\n 4   \
  \       \n\n 5          Location position = spieler.getLocation();\n\n 6       \
  \   World welt = spieler.getWorld();\n\n 7          \n\n 8          double yStart\
  \ = position.getY();\n\n 9          double zStart = position.getZ();\n\n10     \
  \     \n\n 11          position.setX(position.getX() + 2);\n\n 12          \n\n\
  \ 13          for(int y = 0; y < 10; y++){\n\n 14              position.setY(yStart\
  \ + y);\n\n 15              \n\n 16              for(int z = 0; z < 20; z++){\n\n\
  \ 17                  position.setZ(zStart + z);\n\n 18                  welt.getBlockAt(position).setType(Material.GOLD_BLOCK);\n\
  \n 19              }\n\n20          }\n\n21      }\n\n22  \n\n23      return true;\n\
  \n24  } \n```\n\n**Listing 8.3:** 带有 `if` 分支的 `mauerPlatzieren` 函数\n\n现在当你用这个修改后的插件作为玩家尝试建造墙时，它会像以前一样顺畅地工作。但如果你直接在服务器上输入命令，则什么都不会发生。虽然这总比出现错误信息要好，但远非理想。更好的做法是提示该命令仅对玩家可用。一种实现方法是：\n\
  \n```\n1  if(caller instanceof Player){\n\n2      //baue Mauer\n```\n\n第一个 `if`\
  \ 分支保持不变，之后是一个通过非运算符取反的 `if` 分支。你可以在 Listing 8.4 中看到。\n\n```\n1  if(caller instanceof\
  \ Player){\n\n2      //baue Mauer\n\n3  if(!(caller instanceof Player)){\n\n4  \
  \    //baue Mauer\n\n5  else\n\n6      //提示\n\n7\n```\n\n**Listing 8.4:** if 示例\n\
  \n`else` 关键字（英文为“否则”）只能与 `if` 一起出现，不需要条件，因为它在 `if` 条件不成立时总是会被执行。正如 Listing 8.5 所示，完整的\
  \ `mauerPlatzieren` 函数可以像这样：\n\n```\n1  public boolean onCommand(CommandSender sender,\
  \ Command befehl, String befehlsname, String[] args){\n\n 2      if(sender instanceof\
  \ Player){\n\n 3          Player spieler = (Player) sender;\n\n 4          \n\n\
  \ 5          Location position = spieler.getLocation();\n\n 6          World welt\
  \ = spieler.getWorld();\n\n 7          \n\n 8          double yStart = position.getY();\n\
  \n 9          double zStart = position.getZ();\n\n10          \n\n 11          position.setX(position.getX()\
  \ + 2);\n\n 12          \n\n 13          for(int y = 0; y < 10; y++){\n\n 14   \
  \           position.setY(yStart + y);\n\n 15              \n\n 16             \
  \ for(int z = 0; z < 20; z++){\n\n 17                  position.setZ(zStart + z);\n\
  \n 18                  welt.getBlockAt(position).setType(Material.GOLD_BLOCK);\n\
  \n 19              }\n\n20          }\n\n21      }\n\n22      else{\n\n23      \
  \    this.getLogger().info(\"Dieser Befehl kann nur von Spielern ausuehrt werden.\"\
  );\n\n24      }\n\n25  \n\n26      return true;\n\n27  }\n```\n\n**Listing 8.5:**\
  \ 带有 `if-else` 分支的 `mauerPlatzieren` 函数\n\n\n\n\n如何使用 `if` 和 `else` 实现此功能？一个完全不需要\
  \ `else` 的解决方案你可以在 Listing 8.6 中看到。\n\n```\n 1  if(b == Material.GOLD_BLOCK){\n\n\
  \ 2      //一个珍贵的方块！\n\n 3  }\n\n 4  if(b == Material.WATER){\n\n 5      //别让我弄湿！\n\
  \n 6  }\n\n 7  if(b == Material.DIRT){\n\n 8      //那只是土！\n\n 9  }\n\n10  if(b !=\
  \ Material.GOLD_BLOCK && b != Material.WATER && b != Material.DIRT){\n\n11     \
  \ //我对这个不感兴趣！\n\n12  } \n```\n\n**Listing 8.6:** 不使用 `else` 的解决方案\n\n虽然这种方法有效，但并不美观，因为需要区分的情况越多，最后一个\
  \ `if` 条件就变得越长、越混乱。简单将最后一个 `if` 替换为 `else` 是行不通的。因为如果此时是一个金块，程序会输出第一条和最后一条消息。因为\
  \ `else` 总是只对应最后一个 `if` —— 而由于金块不是土块，最后一条消息也会被输出。\n\n另一个可能的解决方案在 Listing 8.7 中显示，这次使用了\
  \ `else` 块。\n\n```\n 1  if(b == Material.GOLD_BLOCK || b == Material.WATER || b\
  \ == Material.DIRT){\n\n 2      if(b == Material.GOLD_BLOCK){\n\n 3          //一个珍贵的方块！\n\
  \n 4      }\n\n 5      if(b == Material.WATER){\n\n 6          //别让我弄湿！\n\n 7  \
  \    }\n\n 8      if(b == Material.DIRT){\n\n 9          //那只是土！\n\n10      }\n\n\
  11  }\n\n12  else{\n\n13      //我对这个不感兴趣！\n\n14  } \n```\n\n**Listing 8.7:** 使用\
  \ `else` 的解决方案\n\n但这个解决方案并没有好到哪里去，因为仍然需要列出所有情况，只不过这次是在开头。此外，和上一个解决方案一样，这里也执行了不必要的步骤：如果是一个金块，程序会输出第一条消息。之后程序其实可以停止，但它实际上还会检查所有后续条件，尽管很清楚这些条件已经不再可能为真。\n\
  \n解决问题的最佳方案是再次使用嵌套——参见 Listing 8.8。\n\n```\n 1  if(b == Material.GOLD_BLOCK){\n\n\
  \ 2      //一个珍贵的方块！\n\n 3  }\n\n 4  else{\n\n 5      if(b == Material.WATER){\n\n\
  \ 6          //别让我弄湿！\n\n 7      }\n\n 8      else{\n\n 9          if(b == Material.DIRT){\n\
