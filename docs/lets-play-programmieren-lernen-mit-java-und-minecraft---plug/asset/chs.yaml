  \ Horn 方法那样优雅，但它实现了目的——而且代码甚至比构建圆时还要短一些。\n\n插件在球体未来的中心点周围“构想”了一个立方体，它在每个方向上的扩展都是\
  \ `r` 个方块。从第 28 行开始，插件会遍历该构想立方体中的所有方块，如果该立方体位于球体内部，则在相应位置放置一个方块。在此，插件在第 31 行利用了这样一个事实：在半径为\
  \ `r` 的球体内，每个点 `(x, y, z)` 相对于点 `(x[Start], y[Start], z[Start])` 都满足不等式 `(x-x[Start])²\
  \ + (y-y[Start])² + (z-z[Start])² <= r²`。\n\n在这里，你也不一定需要关注数学细节。这种方法在任何情况下都是可行的，正如你在图\
  \ 11.7 和图 11.8 中所示。这里再次明显，半径越大，结果就越好。如果你想建造巨大的球体，还应该注意你与球体之间的距离（在第 25 行设置）足够大，否则你会突然被方块包围并站在球体中间，而不是球下方。\n\
  \n![](img/11_Abbildung_11.8.jpg)\n\n**图 11.8：** 半径为 25 的球\n\n### 提示\n\n如果你想计算数字的幂，例如\
  \ `2²`、`3⁵`、`4¹⁰` 或如 Listing 11.18 中的 `x²`，在 Java 中不仅可以通过计算 `x*x`，还可以使用 `Math.pow()`\
  \ 函数：`Math.pow(2, 2)`、`Math.pow(3, 5)`、`Math.pow(4, 10)` 和 `Math.pow(x, 2)`。\n\n\
  ## 11.3 总结\n\n| 术语 | 含义 |\n| --- | | |\n| 网格化 | 使用矩形网格绘制（例如圆）。 |\n| Horn 方法 | 用于圆的网格化的算法。\
  \ |\n\n| 命令 | 参数 | 返回值 | 描述 |\n| --- | --- | --- | --- |\n| `Block.getBlockData()`\
  \ | | BlockData | 返回方块的数据。 |\n| `Block.setBlockData(data)` | | | 设置方块的数据。 |\n| `Door.setFacing(richtung)`\
  \ | | | 设置门的方向。 |\n| `Door.setHalf(hafte)` | | | 确定是上半部分还是下部分。 |\n| `Location(welt,\
  \ x, y)` |)` | 创建一个新的 Location 对象。 |\n| `Bed.setPart(teil)` | | | 确定是头部还是脚部。 |\n\
  | `Math.pow(a, b)` | | | 计算 a 的幂。 |\n\n## 第 12 章：告示牌\n\n之前的章节侧重于数字，现在要讨论文本，即告示牌。告示牌有两种类型：墙上的和地上的上的。\n\
  \n### 12.1 悬挂告示牌\n\n在墙上或方块放置告示牌是最简单的。这里有四种放置告示牌的方式，而不是顶部或底部。在定位时要考虑到，告示牌并不如图 12.1\
  \ 示意所示与方块处于同一位置，而是位于其侧。因此，要放置在方块西侧的告示牌应该面向东，因为方向指的是告示牌自身的位置——而不是方块。\n\n![](img/12_Abbildung_12.1.jpg)\n\
  \n**图 12.1：** 方块上的告示牌方向\n\n否则，放置告示牌正如你在 Listing 12.1 中所示，在床和门那里已经可行。\n\n```java\n\
  Block schildBlock = welt.getBlockAt(position);\nschildBlock.setType(Material.WALL_SIGN);\n\
  \nBlockState schildStatus = schildBlock.getState();\nMaterialData schildDaten =\
  \ schildStatus.getData();\n\nSign schild = (Sign) schildDaten;\nschild.setFacingDirection(BlockFace.SOUTH);\n\
  \nschildStatus.setData(schild);\nschildStatus.update();\n```\n\n**Listing 12.1：**\
  \ 告示牌定位的示例\n\n### 12.2 立式告示牌\n\n正如提到的，在地面上放置告示牌有更多选择。实际的放置过程特别简单。因为一个立式告示牌尽管看起来可能如此，但是由单个方块组成的，因此像像其他方块一样被放置。\n\
  \n```java\nBlock schild = welt.getBlockAt(position);\nschild.setType(Material.LEGACY_SIGN_POST);\n\
  ```\n\n**Listing 12.2：** 在地面放置告示牌的示例\n\n\n\n\n在第 6 章中，你已经学习了变量，同时也学习了合理命名变量是多么重要。`WALL_SIGN`\
  \ 和 `LEGACY_SIGN_POST` 这两个类型就是命名不规范的典型例子，因为它们是不一致的。两者指的是同一种形式的牌子，这通过名称中的 `SIGN`\
  \ 可以清楚地看出，但 `SIGN` 一次在开头，一次在结尾。更美且更容易记忆的命名应该是如 `SIGN_WALL` 和 `SIGN_POST` 这样的统一命名。通过这个例子你可以看到，即使在像\
  \ Minecraft 这样的专业项目中，并非所有事情都是完美的。\n\n在对齐牌子时，有一个巨大的区别，因为这里不是 4 种可能，而是 16 种。在图 12.2\
  \ 中，你可以看到所有可能的旋转，并从 0 到 15 编号。牌子的可读侧通过一个黑色条进行标记。\n\n![](img/12_Abbildung_12.2.jpg)\n\
  \n**图 12.2：** 立在地面上的牌子的可能对齐方式\n\n对齐的代码在立式牌子和悬挂式牌子之间没有区别，但它们可用于对齐的选项是不同的，这正如你在表 12.1\
  \ 所示。\n\n例如，如果你想在负 X 方向放置一个牌子，这对应于编号为 4 的旋转以及名称 `WEST`。整个内容的程序代码形式是怎样的，你可以在列表 12.3\
  \ 中看到。\n\n```\n1 Block schildBlock = welt.getBlockAt(position);\n2 schildBlock.setType(Material.LEGACY_SIGN_POST);\n\
  3 \n4 BlockState schildStatus = schildBlock.getState();\n5 MaterialData schildDaten\
