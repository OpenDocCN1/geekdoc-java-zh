  \ 12.23:** Text zu Schildern zuweisen\n\nWenn der Command `/schild text` eingegeben\
  \ wird, soll das Plugin zuerst prüfen, ob auch die benötigten Parameter, nämlich\
  \ Schild-ID, Zeile und Text, eingegeben wurden. Diese werden in Zeile 7 bis 13 eingelesen\
  \ und gespeichert. Für Schild-ID und Zeile ist das einfach, interessanter ist das\
  \ Einlesen des Textes, da jedes Leerzeichen als Beginn eines neuen Parameters interpretiert\
  \ wird. Wenn du zum Beispiel den Command `/schild text 0 1 Hallo` eingibst, dann\
  \ sieht deine `args`-Variable wie folgt aus:\n\n```\nargs[0] = \"text\"\nargs[1]\
  \ = \"0\"\nargs[2] = \"1\"\nargs[3] = \"Hallo\"\nargs[4] = \"Alex\"\n```\n\n**Listing\
  \ 12.24:** `args`-Variable für `/schild text 0 1 Hallo`\n\nDa das Plugin den Text\
  \ als String benötigt, werden Texteingaben, die aus mehr als einem Wort bestehen,\
  \ durch die Schleife in Zeile 11 bis 13 einer Variablen zusammenfügt.\n\nIn Zeile\
  \ 16 folgt eine weitere Prüfung: Hier wird geprüft, ob die eingegebene Schild-ID\
  \ gültig ist, also ob sie weder negativ noch größer als die Anzahl der vorhandenen\
  \ Schilder ist. Ist auch diese Prüfung erfolgreich, kann der Text auf dem Schild\
  \ platziert werden. Wie das funktioniert, weiß du bereits.\n\n\n\n\nTheoretisch\
  \ wäre das Plugin an dieser Stelle bereits einsatzbereit, allerdings ist eine kleine\
  \ Anforderung, die wir am Anfang des Abschnitts definiert haben, noch nicht erfüllt.\
  \ Bisher kann jeder Spieler jedes aufgestellten Schild nach Belieben neu beschriften.\
  \ Besser wäre jedoch, wenn jeder Spieler nur die Schilder bearbeiten könnte, die\
  \ er selbst aufgestellt hat. Besonders auf einem Server mit vielen Spielern ist\
  \ dies ein wichtiger Aspekt.\n\nWie immer gibt es vielfältige Möglichkeiten, dies\
  \ in einem Plugin umzusetzen. Du könntest zum Beispiel eine Liste erstellen, in\
  \ der für jeden Spieler eine Liste mit Schildern gespeichert wird, also eine Liste\
  \ von Listen. Oder – und genau dieser Ansatz soll hier implementiert werden – du\
  \ fügst deinem Plugin einfach eine zweite Liste hinzu, die für jedes aufgestellte\
  \ Schild speichert, welcher Spieler es erstellt hat. Wenn ein Spieler anschließend\
  \ Text auf ein Schild schreiben möchte, kann einfach anhand der Liste überprüft\
  \ werden, ob er dazu berechtigt ist.\n\nDen entsprechend angepassten Quellcode des\
