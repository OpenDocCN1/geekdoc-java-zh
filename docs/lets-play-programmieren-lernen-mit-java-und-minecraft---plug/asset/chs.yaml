  \ 增加了床的内容\n\n### 11.1.4 火炬\n\n为了防止在晚上出现不速之客，你的应急避难所在在床旁边还应该配备一个光源，例如火炬。火炬同样有一个特殊之处。\n\
  \n与床相比，火炬虽然像往常一样由单个区块组成，但它带来了一个特性。这是因为火炬不能独立存在，它总是属于它旁边或下方的区块。如果该区块被破坏，火炬也会随之被。\n\
  \n尽管如此，放置火炬仍然是可以行的，正如你在 Listing 11.13 所示，与床非常相似。第 4 行的火炬对象类型是 `Directional`。该类型不仅专门用于火炬，还可以用于所有可以朝多个方向调整的对象。\n\
  \n```\n1  Block fackelBlock = welt.getBlockAt(position);\n\n2  fackelBlock.setType(Material.WALL_TORCH,\
  \ false);\n\n3  \n\n4  Directional fackel = (Directional) fackelBlock.getBlockData();\n\
  \n5  fackel.setFacing(BlockFace.NORTH);\n\n6  \n\n7  fackelBlock.setBlockData(fackel);\n\
