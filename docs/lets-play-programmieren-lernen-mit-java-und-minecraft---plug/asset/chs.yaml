  \n## 16.4 总结\n\n| 命令 | 参数 | 返回值 | 描述 |\n| --- | --- | --- | --- |\n| `Player.getInventory()`\
  \ | | PlayerInventory | 获取玩家的背包。 |\n| `PlayerInventory.getItem(typ)` | `typ`: Material\
  \ | ItemStack | 返回包含指定类型物品的物品栈。 |\n| `PlayerInventory.getItem(position)` | `position`:\
  \ Integer | ItemStack | 返回位于指定位置的物品栈。 |\n| `ItemStack.setAmount(x)` | `x`: int |\
  \ | 将堆叠物品的数量设置为指定的数字。 |\n| `PlayerInventory.firstEmpty()` | | ItemStack | 返回第一个空背包槽。\
  \ |\n| `PlayerInventory.remove(gegenstand)` | `gegenstand`: ItemStack | ItemStack\
  \ | 从背包中移除指定的物品。 |\n| `PlayerInventory.addItem(gegenstand)` | `gegenstand`: ItemStack\
  \ | | 向背包中添加指定的物品。 |\n| `Map.containsKey(index)` | `index`: Object | Boolean | 检查\
  \ Map 是否包含指定索引的项。 |\n| `Map.get(index)` | `index`: Object | Object | 返回与索引对应的对象。\
  \ |\n| `Map.keySet()` | | Object | 以数组形式返回 Map 的索引。 |\n| `Set.toArray(new Object[set.size()])`\
  \ | | Object | 将集合（Set）转换为数组。 |\n| `Random zufallsgenerator = new Random()` | |\
  \ | 初始化随机生成器 |\n| `Random.nextInt(obereGrenze)` | `obereGrenze`: Integer | Integer\
  \ | 生成一个随机数 |\n\n# 第 17 章：独立 Java 程序\n\n凭借你目前学到的知识，未来你不仅可以编写插件，还可以创建自己的程序。如果你感兴趣在插件之外如何实现，请继续阅读。\n\
  \n## 17.1 框架\n\n你已经对插件的基础框架非常熟悉。每个插件都需要一个 `enable` 和 `disable` 函数，且主类必须是 `Plugin`\
  \ 的子类。\n\n特别是 Java 程序，这里并不强制指定父类或导入某些内容。如果这对于你的程序是必要的或有用的，你也可以这样做；与插件不同，这不是编写可运行程序的先决条件。每个程序在任何位置都必须存在的函数是\
  \ `main` 函数。因为它是启动程序时被调用的函数，类似于插件中的 `enable` 函数。\n\n```java\npublic class KlassenName\
  \ {\n    public static void main(String[] args) {\n    }\n}\n```\n**Listing 17.1:**\
  \ 程序的框架\n\n## 17.2 静态变量和函数\n\n`public` 和 `void` 在函数名之前的含义你现在已经熟悉了，但在本书的范围内你还没有遇到\
  \ `static` 这个词。它可以出现在函数前面，也可以出现在变量前面，用于标记变量或函数。\n\n静态变量和函数的特点是，与你之前熟悉的不同，它们不属于某个对象（即类的实例），而是属于类本身。当你比较这些示例时，区别就会显而易见。\n\
  \n```java\npublic class Quadrat {\n    public int berechnen(int x) {\n        return\
  \ x*x;\n    }\n\n    public static void main(String[] args) {\n        Quadrat q\
  \ = new Quadrat();\n        q.berechnen(2);\n    }\n}\n```\n**Listing 17.2:** 无静态函数的方形程序\n\
  \n```java\npublic class QuadratStatisch {\n    public static int berechnen(int x)\
  \ {\n        return x*x;\n    }\n\n    public static void main(String[] args) {\n\
  \        QuadratStatisch.berechnen();\n    }\n}\n```\n**Listing 17.3:** 有静态函数的方形程序\n\
  \n\n\n\n在第一种方案中，`berechnen` 函数不是静态的，这意味着它属于 `Quadrat` 类的一个对象。因此，在使用该函数之前，必须先创建一个该类的对象，这在\
  \ `main` 函数中完成。相比之下，第二种方案中的函数是静态的，因此可以直接通过类名调用，而无需先创建对象。作为一个准则，你可以记住：从静态函数只能直接调用其他静态函数和变量。要访问非静态变量和函数，你始终需要先拥有相应类的对象。\n\
  \n现在人们自然会问，为什么不总是使用静态函数呢？毕竟那样要简单得多，而且不需要每次都创建一个新对象。为什么这并不总是一个好主意，可以通过 Listing 17.4\
  \ 中的伪代码示例来看到。这两个类之间的区别仅在于 `static` 关键字。如果你在示例代码末尾显示 `a1` 和 `a2` 的值，它们将如你预期的那样，是\
  \ 1 和 2。\n\n```\n 1  public class A{\n\n 2      int x;\n\n 3  }\n\n 4  \n\n 5  public\
  \ class B{\n\n 6      static int x;\n\n 7  }\n\n 8  \n\n 9  A a1 = new A();\n\n\
  10  A a2 = new A();\n\n11  \n\n12  B b1 = new B();\n\n13  B b2 = new B();\n\n14\
  \  \n\n15  a1.x = 1;\n\n16  a2.x = 2;\n\n17  \n\n18  b1.x = 1;\n\n19  b2.x = 2;\
  \ \n```\n\n**Listing 17.4:** 用于演示静态与非静态变量区别的伪代码示例\n\n然而，对于类 B 的两个对象来说情况并非如此，因为这里的\
  \ `x` 变量不属于对象，而是属于类，因此这两个对象共享同一个变量。所以，`b1` 和 `b2` 的值最后也都是 2。\n\n## 17.3 输入与输出\n\n\
  当我们今天想到计算机程序时，通常会立即想到图形用户界面、按钮和图形。在不遥远的过去，情况是不同的：计算机程序仅由文本组成，可以在命令行中输入和输出。当你开始编写自己的第一个程序时，你会感觉自己暂时回到了那个时代，因为图形用户界面是一项完全不同的挑战，只有在积累了命令行程序的初步经验后，才应该投入其中。\n\
  \n### 17.3.1 ”Hello World！”程序\n\n出于这个原因，我们首先想再次拜访一位老朋友——“Hello World!”插件，我们现在想把它做成一个真正的“Hello\
  \ World!”程序。\n\n你所需的所有内容可以在 Listing 17.5 中找到，如你所示，这并不复杂，因为你只需要一个命令。`System.out.println`\
  \ 命令负责在命令行输出文本，并接收一个字符串作为参数，因此它等于插件中的 `Canary.instance().getServer().broadcastMessage()`。\n\
  \n```\n1  public class HalloWelt{\n\n2      public static void main(String[] args){\n\
  \n3          System.out.println(\"Hallo Welt!\");\n\n4      }\n\n5  } \n```\n\n\
  **Listing 17.5:** ”Hello World！”程序\n\n像插件一样，程序在测试之前必须先进行编译。这在原理上与插件相同，只不过你在编译程序时不需要指定\
  \ `CanaryMod.jar` 的路径。因此，编译你的“Hello World!”程序只需执行 `javac HalloWelt.java` 命令即可。不过，你可以省略将其打包成\
  \ Jar 文件。启动方式也与你习惯的插件略有不同，毕竟现在启动你的作品不再需要 Minecraft 服务器了。相反，你只需要在命令行中输入 `java HalloWelt`，那里就会出现一个友好的“Hallo\
  \ Welt!”。\n\n提示\n正如插件一样，你程序的 Java 文件名称也应始终与其定义的类保持相同。\n\n### 17.3.2 输入\n\n正如插件的情况一样，程序只有在能够处理用户输入的数据时，才会变得真正有趣。如果你仔细观察\
  \ `main` 函数的参数，希望这能唤起你的记忆，即聊天命令。这里也有一个非常的参数：`String[] parameter`。事实上，这两个参数负责的是相同的任务。正如你所记得，字符串数组\
  \ `parameter` 中存储了与命令一起输入的输入。\n\n\n\n\n![](img/17_Abbildung_17.1.jpg)\n\n**图 17.1:**\
  \ `HalloName` 程序的输出\n\n## 17.4 编写测验程序\n\n到此为止，我们对 Java 程序世界的简短之旅就即将结束了。不过，在我们自己编写至少一个小游戏之前，这还没有结束。在这个阶段，我们可能还无法开发出下一个\
  \ Minecraft，但编写一个有趣的测验对你来说轻而易举。\n\n它的结构应该是非常经典的：玩家被问一个问题，并从四个选项中选择一个，很显然只有一个是正确的。\n\
  \n开始时，你应该像 Listing 17.8 那样创建一个类，用于表示一个问题。该类必须存储问题文本、正确答案和三个错误答案。\n\n```\n 1  public\
