  \ Listing 14.5 中看到。\n\n首先，剑将获得一个新的名字：为此，在第 11 行首先加载了剑的所谓的元数据。在元数据中存储了物品的额外信息，例如它们的名称。通过\
  \ `setDisplayName` 命令，可以将原始名称更改为任何其他名称，例如“火剑”。修改后的元数据随后可以如第 13 行所示重新分配给剑。\n\n为了让在背包中也能立即识别出这把剑是一个非常特殊的样本，它还应该获得附魔物品典型的“闪烁”效果。由于这只涉及外观而不是附魔的实际效果，最合理的方法是选择一个通常不能应用于剑的附魔，例如“海洋之幸运”。这样你就可以完全确定，你的配方结果保证是独一无二的。向物品添加附魔的命令是\
  \ `addUnsafeEnchantment`，正如你在第 14 行看到的那。命令中的 `Unsafe` 确保了服务器忽略该附魔实际上并不是为剑设计的这一事实，数字决定了附魔的等级。配方的其余部分只剩下已知的添加配料以及将配方交给服务器。\n\
