  `。代码列表 6.6 展示了如何用 Java 代码实现“Minecraft”示例。\n\n```\n1  String m = \"Mine\";\n\n2 \
  \ String c = \"craft\";\n\n3  String mc = m + c;\n```\n\n**列表 6.6：** 连接示例\n\n####\
  \ 应用示例\n\n通过字符串变量和连接运算符，你可以为上一章节的“Hallo Server!”插件扩展一个有趣的功能：不再总是发送相同的“你好玩家!”，插件将来可以根据名称单独问候每个玩家。输入\
  \ `halloServer Daniel` 会导致“你好 Daniel!”。首先，你需要为新版本的插件创建一个文件夹，命名为 `HalloServerPlugin`。对于任何其他插件，你都需要一个配置文件。如代码列表\
  \ 6.7 所示，你可以直接采用“Hallo Server!”插件的旧配置文件并进行微调。首先你需要增加版本号，更重要的是调整 `usage`，即提示玩家如何使用该命令。在这种情况下，它告诉用户：`/halloServer`\
  \ 命令在命令之后还需要一个输入作为名称。在游戏中，未来的帮助信息将如图 6.1](#final_stage2_06.htm_Rxx_ref419625799）所示。\n\
