  \n## 12.3 设置文本\n\n到目前你虽然已经知道如何放置和悬挂牌子，但最重要的一部分仍然缺失：为牌子添加文本。它是如何运作的，你可以在列表 12.4 中看到。\n\
  \n```\n1 Block schildBlock = welt.getBlockAt(position);\n2 schildBlock.setType(Material.LEGACY_SIGN_POST);\n\
  3 \n4 Sign schildStatus = (Sign) schildBlock.getState();\n5 schildStatus.setLine(0,\
  \ \"你好玩家!\");\n6 schildStatus.update(); \n```\n\n**列表 12.4：** 牌子 I\n\n在第 1 行和第 2\
  \ 行中，正如所知，首先放置牌子，然后在第 4 行访问牌子的状态。这里的新之处是状态不再存储在 `BlockState` 类型的变量中，而是存储在 `Sign`\
  \ 类型的变量中。这有点让人困惑，因为之前（例如在列表 12.3 中）我们已经遇到过 `Sign` 类。不过，它是来自 `org.bukkit.material`\
  \ 包，而来自列表 12.4 的 `Sign` 类位于 `org.bukkit.block` 包，因为它包含了牌子的状态，而不是像之前那样数据。\n\n第 5\
  \ 行的 `setLine` 命令也是新的。在使用 `setLine` 命令时，你首先指定文本出现在哪一行，如果你你想在负 X 方向放置一个牌子，这对应于编号为\
  \ 4 的旋转以及名称 `WEST`。整个内容的程序代码形式是怎样的，你可以在列表 12.3 中看到。\n\n记住每行最多应有 15 个字符。如果你有更长的文本，它会被截断。最后你必须调用\
  \ `update()`。为了使用颜色，你需要在插件开头导入 `org.bukkit.ChatColor` 类。\n\n通过这两种颜色你不仅可以为整行上色，还可以为单个单词或字母上色，因为每当新命令出现时，旧的就会被覆盖。在列表\
  \ 12.6 中，例如，“你好””是红色的，后面的感叹号是蓝色的。\n\n```\n1 Block schildBlock = welt.getBlockAt(position);\n\
  2 schildBlock.setType(Material.LEGACY_SIGN_POST);\n3 \n4 Sign schildStatus = (Sign)\
  \ schildBlock.getState();\n5 schildStatus.setLine(0, ChatColor.COLOR_CHAR + ChatColor.RED.getChar()\
  \ + \"Hallo Welt\" + ChatColor.COLOR_CHAR + ChatColor.BLUE.getChar() + \"!\");\n\
  6 schildStatus.update(); \n```\n\n**列表 12.6：** 在同一行中使用不同颜色\n\n### 12.3.2 格式化\n\n\
  通过这种方式你不仅可以为文本上色，还可以为它们添加各种其他格式化，正如你在图 12.3 中看到的那样。\n\n\n\n\n它的工作原理与文本染色完全相同，只不过你使用的不再是\
  \ `BLUE` 和 `BLACK` 等颜色，而是不同的格式设置，例如用于*斜体*的 `ITALIC` 或用于**加粗**的 `BOLD`。关于最终程序代码的完整样式，你可以在列表\
  \ 12.7 中看到。所有文本格式化命令的简要概述可以按照图 12.3 所示的顺序，在表 12.3 中找到。\n\n```\n 1  Block schildBlock\
  \ = welt.getBlockAt(position);\n 2  schildBlock.setType(Material.LEGACY_SIGN_POST);\n\
  \ 3  \n 4  Sign schildStatus = (Sign) schildBlock.getState();\n 5  \n 6  //fett\n\
  \ 7  schildStatus.setLine(0, ChatColor.COLOR_CHAR + ChatColor.BOLD.getChar() + \"\
  012345678901234\")\n 8  \n 9  //kursiv\n10 schildStatus.setLine(1, ChatColor.COLOR_CHAR\
  \ + ChatColor.ITALIC.getChar() + \"012345678901234\")\n11  \n12  //unterstrichen\n\
  13 schildStatus.setLine(2, ChatColor.COLOR_CHAR + ChatColor.UNDERLINED.getChar()\
