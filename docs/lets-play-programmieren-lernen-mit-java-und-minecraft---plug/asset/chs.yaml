  \ `KuerbisPlugin.java`\n\n提示\n\n由于 Listing 7.12 中不再使用 `Block` 类型的变量，可以删除开头的 `org.bukkit.block.Block`\
  \ 。\n\n如果你愿意，你可以在信息文件中将版本号改为 `2.0`，毕竟与之前的版本相比，你已经显著改进了插件。编译，打包。\n\n\n\n正如前面提到的，也可以构造出明显复杂的循环条件。例如，假设你想编写一个程序，让循环一直执行，直到玩家移动为止。循环条件可以用自然语言表述为：只要玩家位置的\
  \ X、Y、Z 值不发生变化，就执行循环。虽然你已经学习了用于检查两个数字是否相等的运算符，但在此之前所有的循环条件只包含一个检查，而这个条件包含了三个。关于如何实现，你可以查看\
  \ Listing 7.16 中的第 7 行。\n\n```\n 1  Location position = spieler.getLocation();\n\
