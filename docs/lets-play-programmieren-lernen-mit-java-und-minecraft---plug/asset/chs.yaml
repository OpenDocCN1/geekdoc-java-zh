  **Listing 12.17：** 告示插件步骤 1\n\n\n\n\n在第 17 行，你可以在那里找到列表变量的声明，第 20 行对其进行初始化。在 `onCommand`\
  \ 函数中，首先会像通常一样再次检查命令是否由玩家输入。在第 30 行，还会额外检查 `args` 数组的长度。你可能已经经常处理过插件了，这些插件期望通过命令传递一个参数，例如墙体插件中的宽度和高度。只要玩家正确使用命令并提供了所有参数，就不会出现问题。但是，如果你尝试在没有相应参数的情况下调用墙体插件，它将产生一个错误。为了避免这种情况，你可以使用\
  \ `length` 命令来检查向命令传递了多少或几个参数，因为每个传递的参数都意味着 `args` 中的一个额外条目。如果没有向 `/schild` 命令传递任何参数，插件将显示“请指定告示牌命令!”。如果传递了除“bauen”以外的参数，插件将向玩家显示以下信息：“未知的告示牌命令!”\n\
  \n如果玩家如预期输入了命令 `/schild bauen`，那么从第 34 行开始，将按照习惯在玩家面前放置一个告示牌。在第 53 行，该告示牌将通过 `add`\
  \ 命令添加到所有告示牌的列表中，并在第 54 行使用 `indexOf` 命令向玩家告知刚刚放置的告示牌的 ID。\n\n初看之下，插件的第一部分已经实现：建造一个告示牌，将其存储在所有告示牌的列表中，并通过聊天消息告知玩家\
  \ ID。然而，该插件目前在实际应用中还不够理想，因为所有告示牌始终朝向同一个方向，即朝南。当然，如果能完全按照意愿将告示牌对齐到任何可能的方向，会好得多。\n\
  \n对于程序员来说，最简单的解决方案是只需为命令传递一个额外的旋转参数。为此你只需要一条形式如 `args[1]` 的额外指令，问题就解决了。但对于玩家来说，这完全不方便，谁想记住\
  \ 16 种不同的旋转角度呢？更实用的方法是让告示牌像普通建筑一样，自动放置在玩家正看向的位置，并朝向玩家。这种对于玩家来说非常简单的解决方案对你这个程序员来说要具有挑战性得多，因为到目前为止你还不知道寻找玩家看向哪里的方法。是时候改变这一点了。\n\
  \n要找出玩家看向哪个方块首先并不困难。为此你只需要一个名为 `getTargetBlock` 的命令。在 Listing 12.18 中，你可以看到如何使用此命令查找告示牌的位置。该命令期望两个参数：第一个参数可以是一个被视为透明的材质列表。如果你只想忽略空气，在这里传递\
  \ `null` 即可。第二个参数指定了最大视距离。如果玩家看向的方块比指定的数字远，游戏将将其处理为正在看向空气。\n\n```\n1  // 放置告示牌\n\
  \n2  Block schildBlock = spieler.getTargetBlock((Set<Material>) null, 30);\n\n3\
  \  schildBlock.setType(Material.LEGACY_SIGN_POST);\n\n4  \n\n5  BlockState schildStatus\
  \ = schildBlock.getState();\n\n6  MaterialData schildDaten = schildStatus.getData();\n\
  \n7  \n\n8  Sign schild = (Sign) schildDaten;\n\n9  schild.setFacingDirection(BlockFace.WEST);\n\
  \n10 \n\n11  schildStatus.setData(schild);\n12  schildStatus.update(); \n```\n\n\
  **Listing 12.18:** 使用 `getTargetBlock` 命令放置告示牌\n\n如你所见，源代码通过这种方式甚至比之前更短了。然而，我们还没有实现预期的行为。首先，告示牌仍然朝向同一个方向，其次，放置功能也还没有完全按照预期工作。因为并不是将告示牌放置在玩家看向的方块上，而是该方块直接被告示牌替换了。\n\
  \n所以 `getTargetBlock` 命令并不是解决我们问题的办法。相反，我们需要 `getLineOfSight` 命令。它在原理上同样运行，甚至期望相同的参数，但它不仅返回玩家看向的方块，还返回其之间所有的方块。这样你不仅可以访问玩家看向的方块，还可以访问位于它正前面的方块。它的原理可以在\
  \ Listing 12.19 中看到。\n\n```\n1  Block finalBlock = welt.getBlockAt(spieler.getLocation());\n\
  \n2  List<Block> blockListe = spieler.getLineOfSight((Set<Material>) null, 30);\n\
  \n3  \n\n4  for(int i = 0; i < blockListe.size(); i++){\n5    if(blockList.get(i).getType()\
  \ != Material.AIR){\n6        finalBlock = blockListe.get(i);\n7    }else{\n8  \
  \      break;\n9    }\n10 }\n```\n\n**Listing 12.19:** 使用 `getLineOfSight` 命令放置告示牌\n\
  \n视线方块列表存储在 `blockList` 中。通过循环检查每个方块是否为空气。如果是，则将该方块存储在 `finalBlock`，在那里放置告示牌。\n\n\
  我们解决了一个问题，但对齐问题仍然未解决。为了让告示牌朝向玩家，你必须先找出玩家看向哪个方向。这里 `getYaw` 命令可以提供帮助。它返回一个 0 到 360\
  \ 之间的值。0 表示玩家看向南；90 表示玩家看向西；180 表示玩家看向北；270 表示玩家看向东。在 Abbildung 12.4 中，你可以再次看到数值与对应方向的关系。\n\
  \n![](img/12_Abbildung_12.4.jpg)\n\n**Abb. 12.4:** 方向转换为 Yaw 和告示牌朝向\n\n现在告示牌不应该朝向玩家相同的方向，否则他只会看到告示牌的背面而不是文字，而是相反的方向。但这个任务也可以轻松解决，使用最简单的数学方法。我们将原始旋转值加上\
  \ 180，然后使用取模运算计算除以 360 的余数，即 `(x + 180) % 360`。一个简单的测试：\n\n*   玩家看向南，因此 x = 0。0\
  \ + 180 % 360 = 180，告示牌因此朝北。\n*   玩家看向西，因此 x = 90。90 + 180 % 360 = 270，告示牌因此朝东。\n\
  *   玩家看向北，因此 x = 180。180 + 180 % 360 = 0，告示牌因此朝南。\n*   玩家看向东，因此 x = 270。270 + 180\
  \ % 360 = 90，告示牌因此朝西。\n\n\n\n我们的公式可以工作了。在正确对齐并放置标牌之前，还需要解决最后一个问题。如果你再次查看表 12.1，你会很快就会发现，使用\
  \ 90、180 和 270 等值的放置标牌命令是完全不起的。表 12.4 再次显示了标牌的所有可能朝向，这些方向你已经在表 12.1 中学习过了。但这次新增加的是“旋转数字”这一列。**\n\
  \n| 旋转数字 | 旋转名称 | 翻译 |\n| --- | --- | --- |\n| 0 | SOUTH | 南 |\n| 1 | SOUTH_SOUTH_WEST\
  \ | 南偏西 |\n| 2 | SOUTH_WEST | 西南 |\n| 3 | WEST_SOUTH_WEST | 西西南 |\n| 4 | WEST |\
  \ 西 |\n| 5 | WEST_NORTH_WEST | 西西北 |\n| 6 | NORTH_WEST | 西北 |\n| 7 | NORTH_NORTH_WEST\
  \ | 北偏西 |\n| 8 | NORTH | 北 |\n| 9 | NORTH_NORTH_EAST | 北偏东 |\n| 10 | NORTH_EAST\
  \ | 东北 |\n| 11 | EAST_NORTH_EAST | 东北东北 |\n| 12 | EAST | 东 |\n| 13 | EAST_SOUTH_EAST\
  \ | 东南东南 |\n| 14 | SOUTH_EAST | 东南 |\n| 15 | SOUTH_SOUTH_EAST | 南东南 |\n\n**表 12.4：**\
  \ 立在地面上的标牌的可能朝向\n\n现在，如果你创建一个名为 `rotationen` 的数组，按此顺序包含所有方向（如列表 12.20 中，旋转数字用黑色表示。圆形的每一个切片代表一种可能的朝向。因此，我们现在需要做的是将红色数字“转换”为黑色。这有多种方法。最简单但最精确的方法是直接将值除以\
  \ 22。因为如果我们想将 360 度分成 16 个不同的值，四舍入后的结果恰好是 `360/16 = 22`。\n\n所有这些理论考虑最终导致了你在列表 12.21\
  \ 中看到的代码行。在这里，读取玩家的旋转角度并将其转换为适用于标牌的旋转角度。特别注意的是，除以 22 后产生的值仍必须转换为整数，这是通过 `Math.round()`\
  \ 命令实现的。\n\n```\n 1  BlockFace[] rotationen = {BlockFace.SOUTH, BlockFace.SOUTH_SOUTH_WEST,\
  \ BlockFace.SOUTH_WEST, BlockFace.WEST_SOUTH_WEST, BlockFace.WEST, BlockFace.WEST_NORTH_WEST,\
