  );\n13          feuerschwert.setItemMeta(metaData);\n14          feuerschwert.addUnsafeEnchantment(Enchantment.LUCK,\
  \ 1);\n15  \n16          ShapelessRecipe feuerschwertRezept = new ShapelessRecipe(feuerschwert);\n\
  17          feuerschwertRezept.addIngredient(Material.IRON_SWORD);\n18         \
  \ feuerschwertRezept.addIngredient(Material.FLINT_AND_STEEL);\n19          this.getServer().addRecipe(feuerschwertRezept);\n\
  20      }\n21  \n22      public void onDisable() {\n23      }\n24  } \n```\n\n**Listing\
  \ 14.5:** `FeuerschwertPlugin.java` Schritt 1\n\nNun hast du zwar bereits einen\
  \ garantiert einmaligen Gegenstand, er verhält sich allerdings noch wie ein ganz\
