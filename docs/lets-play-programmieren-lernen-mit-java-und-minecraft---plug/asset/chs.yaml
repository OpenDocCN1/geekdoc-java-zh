  \ 5 行进行设定，与下半部分类似。同样在 Listing 11.8 中，最后一行再次确保了更改被应用到区块上。\n\n要将所学知识应用于你的应急避难所，你只需要找到合适的位置，使门位于你避难所的墙体中。你可以在\
