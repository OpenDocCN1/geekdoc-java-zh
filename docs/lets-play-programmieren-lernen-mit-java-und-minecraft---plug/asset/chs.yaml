  \ 类\n\n如你在第 21 行所示，该监听器使用了 `EntityDamageByEntityEvent`，该事件每当生物对另一个生物造成伤害时会被调用。但由于只有当玩家用雪球击中其他玩家时才会加分，因此首先需要进行一些检查。第一次检查发生在第\
  \ 22 行，在这里首先检查伤害是否是由投射物（例如箭或雪球）造成的。如果是，则在第 25 行检查该投射物是否为雪球。如果如此，则只剩下最后一次检查：第 29\
  \ 行检查攻击者和被攻击的生物是否都是玩家，因为只有这样才会评分。\n\n如果满足了这一条件，就开始了实际的评分逻辑。首先，在第 33 行检查攻击者在排行榜中是否已经存在条目。如果没有，则会创建一个值为\
  \ 1 的新条目，此时他就得了分。如果已经存在条目，则简单地增加其分数。随后，该过程会在被攻击者身上再次发生，他会获得一个 -1 的条目，因为他被击中了。\n\n\
  ### 16.1 显示排行榜\n\n到这里，你自己的游戏模式——雪球大战——几乎就完成了。现在缺少的是 `/highscore` 命令，它应该显示所有玩家的列表。这听起来很简单，但实现起来有很多陷阱，特别是在排序方面。一个合理的排行榜自然应该按分数排序，使得分数最高的玩家排在顶部。\n\
  \nHashMap 没有固定的顺序，因此不能进行排序。出于此原因，必须将 `HashMap` 转换为可以排序的所谓 `TreeMap`。为了实现这一点，你首先需要一个可以处理\
  \ `TreeMap` 排序的类。你可以在 `Listing 16.7` 中找到它。\n\n```java\nimport java.util.Comparator;\n\
  import java.util.Map;\nimport java.util.UUID;\n\npublic class Vergleich implements\
  \ Comparator<UUID> {\n    Map<UUID, Integer> map;\n\n    public Vergleich(Map<UUID,\
  \ Integer> map){\n        this.map = map;\n    }\n\n    public int compare(UUID\
  \ a, UUID b){\n        if(map.get(a) >= map.get(b)){\n            return -1;\n \
  \       }\n        else{\n            return 1;\n        }\n    }\n}\n```\n\n**Listing\
  \ 16.7:** `Vergleich.java`\n\n准确来说，这个类并不负责实际的排序——排序由 `TreeMap` 本身完成。`Vergleich`\
  \ 类顾如其名，负责 `TreeMap` 中元素的**比较**。如果你给 Java 两个数字，它自己知道如何对它们排序。然而，排行榜的元素由一个字符串和一个数字组成，因此\
  \ Java 无法轻易地知道如何对这些元素排序，你需要一个相应的类。它所做的只是在第 12 行检查元素 `a` 的分数是否大于或等于元素 `b` 的分数。如果是，则元素\
  \ `a` 应该排在列表元素 `b` 之前，否则顺序必须反过来。\n\n最后，你只需要 `onCommand` 函数，它负责接收并处理聊天命令。你可以在 `Listing\
  \ 16.8` 中找到它。正如之前提到的，这里在第 2 到第 4 行将 `HashMap` 转换为 `TreeMap`。为此，创建了 `Vergleich` 类的新对象，并将排行榜传递给它。然后创建一个名为\
  \ `map` 的 `TreeMap`，并将比较对象传递进去。接着在第 4 行将排行榜中的条目复制到新创建的 `TreeMap` 中。\n\n```java\n\
  public boolean onCommand(CommandSender sender, Command befehl, String befehlsname,\
  \ String[] args){\n    Vergleich verg =  new Vergleich(punktestand);\n    TreeMap<UUID,\
  \ Integer> map = new TreeMap<UUID, Integer>(verg);\n    map.putAll(punktestand);\n\
  \n    UUID[] spielerListe = map.keySet().toArray(new UUID[map.size()]);\n\n    for(int\
  \ i = 0; i < spielerListe.length; i++){\n        if(this.getServer().getPlayer(spielerListe[i])\
  \ != null){\n            String spielerName = this.getServer().getPlayer(spielerListe[i]).getDisplayName();\n\
  \            sender.sendMessage((i+1)+\": \" + spielerName + \" (\" + punktestand.get(spielerListe[i])\
  \ + \")\");\n        }\n    }\n\n    return true;\n}\n```\n\n**Listing 16.8:** `onCommand`\
  \ 函数\n\n\n\n\n现在你可以简单地将索引转换为数组并按顺序遍历它们，因为 `TreeMap` 中的元素现在已经正确排序了。实际的输出可以在第 11 行找到。如果你愿意，你自然也可以对其进行一些美化。例如，你可以将分数为负的玩家显示为红色，分数为正的显示为绿色，或者突出显示调用命令的玩家名称。一如既往，你的想象力不受限制。\n\
