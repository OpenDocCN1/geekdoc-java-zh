  与其这样存储数据，你首先应该考虑插件是否有改进空间，毕竟你自从第十章章学到了很多。将牌子和者存储在两个独立的列表中并不理想，当只更新其中一个列表时，可能会出现问题。你可以通过创建一个管理牌子及其所有者的类来消除这一缺陷。此外，告示牌需要以某种方式存储到文件中，不再存储告示牌对象，而是存储它的位置。\n\
