  \n为此，插件的 Java 文件自然需要像 Listing 14.6 那样调整到你已经熟悉的基础框架中。这意味着，首先要添加监听器类本身，还要在 `onEnable`\
  \ 函数中注册监听器。\n\n对于监听器类，首先出现的问题是你想使用哪个监听器。正如你在 Listing 14.6 中看到的，那里在那里选择了 `PlayerInteractEvent`。每当玩家点击方块时，它就会被调用。这正是需要的。但现在显然不应该每次玩家点击方块时都让一切点燃，只有当他手里也拿着火剑时才这样做。幸运的是，事件通过\
  \ `getItem()` 函数为我们提供了一种简单的方法来检查用户当前手里拿着什么物品。与之前设置显示名称不同，这次你必须检查这把剑是否带有相应的名称；只有在如此情况下，插件才会点燃被点击的方块。\n\
  \n```\n 1  import org.bukkit.Material;\n 2  import org.bukkit.block.Block;\n 3 \
