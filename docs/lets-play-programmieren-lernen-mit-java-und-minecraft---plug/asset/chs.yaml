  \n4  version: 1.0\n\n5  commands:\n\n6      schild:\n\n7          description: 在玩家面前放置告示牌\n\
  \n8          usage: /schild\n```\n**Listing 12.16：** `plugin.yml` 用于告示插件\n\n现在你需要创建一个名为\
