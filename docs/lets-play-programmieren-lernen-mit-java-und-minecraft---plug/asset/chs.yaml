  \ Version 3.0, Schritt 3\n\nDer Hauptvorteil beim Einsatz von Klassen ist allerdings,\
  \ dass sie leicht wiederverwendbar sind. Wann immer du in Zukunft ein Plugin programmierst,\
  \ in dem du an welcher Stelle eine Mauer bauen willst, kannst du immer wieder dieselbe\
  \ `Mauer`-Klasse benutzen und mit nur zwei Zeilen schnell und unkomiziert eine Mauer\
  \ errichten.\n\n## 10.4 Zugriffskontrolle\n\nDu kannst deine selbst erstellten Klassen\
  \ sogar im Internet mit anderen teilen und ihnen somit Arbeit ersparen, schließlich\
  \ muss das Rad nicht jedes Mal neu erfunden werden. Spätestens wenn du deinen Code\
  \ mit anderen teilst, am besten aber auch, wenn er nur für dich selbst ist, solltest\
  \ du dir allerdings Gedanken um die »Sicherheit“ deines Codes machen und dir solche\
  \ Fragen stellen wie: Was passiert eigentlich, wenn jemand ein `Mauer`-Objekt mit\
  \ der Höhe -1 anlegt und dann die `bauen`-Funktion aufruft?\n\n\n\n\n在具体情况下，你很幸运，什么都没有发生：循环根本没有执行一次，因此也没有建造任何墙壁。但总的来说，始终存在一种风险，在最坏的情况下，错误的值可能会导致你的插件崩溃。\n\
  \n为了防止这种情况，Java 提供了在外部隐藏类的属性和方法的方法。如代码列表 10.17 所示，这是通过在属性或方法前加上 `private` 关键字来实现的。\n\
  \n```\n1  class Mauer{\n\n2      private int hoehe;\n\n3      private int breite;\n\
  \n4      private Material material;\n\n5  } \n```\n\n**Listing 10.17:** 使用 `private`\n\
  \n如果你尝试在类本身外部访问某个属性，例如使用 `mauer.hoehe`，这将导致错误信息。该属性仅在类内部是可读可写的。`private` 的对应项是 `public`，它意味着也可以在类外部访问该属性或方法。如果这两个选项都没有被显式指定，则属性或方法将自动被设置为\
  \ `public`。然而，通常情况下应该选择相反的方法：尽可能在任何时候都将方法特别是属性声明为 `private`，只有在绝对必要时才声明为 `public`。将属性设置为\
  \ `private` 有哪些优点，请参见代码列表 10.18。\n\n```\n 1  class Mauer{\n\n 2      private int\
  \ hoehe;\n\n 3      private int breite;\n\n 4      private Material material;\n\n\
  \ 5  \n\n 6      public Mauer(int hoehe, int breite, Material material){\n\n 7 \
  \         if(hoehe > 0){\n\n 8              this.hoehe = hoehe;\n\n 9          }\n\
  10          else{\n\n11              this.hoehe = 1;\n\n12          }\n13      \
  \    if(breite > 0){\n\n14              this.breite = breite;\n\n15          }\n\
  16          else{\n\n17              this.breite = 1;\n\n18          }\n19     \
  \     this.material = material;\n\n20      }\n21  } \n```\n\n**Listing 10.18:**\
  \ »private»的优点示例\n\n如果一个属性是 `private` 的，那么在类外部只能通过方法对其进行访问。这样就可以精确地控制访问，例如在这个例子中，可以检查是否提供了大于零的值。因此，人们通常会认为类的所有属性都应该始终被声明为\
  \ `private`。对于访问，我们使用所谓的 `getter-` 和 `setter-` 方法。\n\n在代码列表 10.19 中，你可以看到使用 getter\
  \ 和 setter 方法的示例。set 方法通常是 `void` 类型，因此没有返回值，并设定变量的值。相比之下，get 方法读取变量的值并将其返回。但是，get\
  \ 方法的返回值并不一定与变量类型对应。这种可能的差异恰恰是这种处理方法的巨大优点之一。\n\n```\n 1  class A{\n\n 2      private\
  \ int b;\n\n 3      private String c;\n\n 4  \n\n 5      public void setB(int wert){\n\
  \n 6          this.b = wert;\n\n 7      }\n 8      public void setC(String wert){\n\
  \n 9          this.c = wert;\n10      }\n11  \n\n12      public int getB(){\n\n\
  13          return b;\n\n14      }\n15      public int getC(){\n\n16          return\
  \ c;\n\n17      }\n18  } \n```\n\n**Listing 10.19:** getter 和 setter 方法的示例\n\n例如，想象你出于何种原因，想将代码列表\
  \ 10.19 中类 `A` 变量 `b` 的类型从 `int` 更改为 `float`，例如因为你想在类内部添加一些使这成为必要的计算。如果你不使用 getter\
  \ 和 setter，这意味着使用你类的每一个人、使用该类的每个程序，都必须在访问属性 `b` 的每个地方进行修改——这是一项巨大的工作量。相反，如果你使用 getter\
  \ 和 setter，只需修改它们即可。你可以简单地将 B 的 getter 修改为：\n\n```\n1  public int getB(){\n\n2 \
  \     return Math.round(b);\n\n3  } \n```\n\n并且所有使用你类的程序都可以保持不变。\n\n**提示**\n\n方法也可以加上\
  \ `private` 关键字，这样它们就只能在类内部调用。\n\n## 10.5 继承\n\n还有一个最后一个重要的概念缺失了，这样你在类和对象方面就会成为真正的专家了。为了说明这一点，我们从墙转向立方体：在某些方面，立方体与墙有许多共同点，因为它拥有宽度和高度。此外，立方体还有深度，而墙则没有。这些要求导致了\
  \ `Quader` 设计，你可以在代码列表 10.20 中看到。\n\n```\n1  import org.bukkit.Location;\n\n2  import\
  \ org.bukkit.Material;\n\n3  import org.bukkit.World;\n\n4  import org.bukkit.entity.Player;\n\
  \n5  \n\n6  class Quader{\n\n7      private int hoehe;\n\n8      private int breite;\n\
  \n9      private int tiefe;\n\n10      private Material material;\n\n11  \n\n12\
  \      public Quader(int hoehe, int breite, int tiefe, Material material){\n\n13\
  \          this.hoehe = hoehe;\n\n14          this.breite = breite;\n\n15      \
  \    this.tiefe = tiefe;\n\n16          this.material = material;\n\n17      }\n\
  \n18  \n\n19      public void bauen(Player spieler){\n\n20      }\n21}\n```\n\n\
  **Listing 10.20:** `Quader` 类的设计\n\n如果你将此设计与代码列表 10.15 中的 `Mauer` 类比较，你应该立即发现类之间有很多相似之处。作为程序员，尽可能避免重复代码。这不仅是因为程序员很懒（尽管事实确实如此），而且是因为这会让程序的后期更改变得复杂得多。如果你以后决定将变量\
  \ `hoehe` 和 `breite` 的类型从 `int` 改为 `long`，那么必须在两个类中都进行修改。你的程序越大，忘记在某处进行修改并导致程序出现错误或完全不运行的风险就越大。\n\
  \n为了避免这种情况，Java 中有一个所谓的继承概念，它的工作原理如下：首先，连接这两个类的所有共同点都将转移到一个新的、所谓的父类中。在具体例子中，这些是三个共同属性和至少相似的构造函数。`bauen`\
  \ 函数具有相同的名称，但在代码上存在差异，因此它们最初不是父类的一部分。\n\n```\n1  import org.bukkit.Material;\n\n\
  2  \n\n3  class Viereckig{\n\n4      int hoehe;\n\n5      int breite;\n\n6     \
  \ Material material;\n\n7  \n\n8      public Viereckig(int hoehe, int breite, Material\
  \ material){\n\n9          this.hoehe = hoehe;\n\n10          this.breite = breite;\n\
  \n11          this.material = material;\n\n12      }\n\n13  } \n```\n\n**Listing\
  \ 10.21:** 父类 `Viereckig`\n\n\n\n\n基于此父类，可以创建所谓的 `子类`。这些子类会自动拥有其父类的所有属性和方法，也可以说`继承`。作为\
  \ `Viereckig` 类的子类，`Mauer` 类看起来如 Listing 10.22 所示。\n\n```\n 1  import org.bukkit.Material;\n\
  \n 2  import org.bukkit.entity.Player;\n\n 3  \n\n 4  class Mauer extends Viereckig{\n\
  \n 5      public Mauer(int breite, int hoehe, Material material){\n\n 6        \
  \  super(breite, hoehe, material);\n 7      }\n\n 8  \n\n 9      public void bauen(Player\
  \ spieler){\n10      }\n11 } \n```\n\n**Listing 10.22:** 作为 `Viereckig` 子类的 `Mauer`\
  \ 类\n\n属性不需要再次声明，构造函数的作用仅在于调用父类的构造函数，这是通过 `super` 关键字实现的。虽然属性现在不再显式地出现在类定义中，但它们仍然存在。例如，在\
  \ `bauen` 函数中可以随时方便地通过 `hoehe` 访问相应的属性。\n\n将 `Quader` 类转换为子类的方式非常相似，不同之处在于如 Listing\
  \ 10.23 所示，这里还需要声明额外的属性 `tiefe`。相应地，构造函数也需要另一个参数，并将其赋值给相应的属性。\n\n```\n 1  import\
  \ org.bukkit.Material;\n\n 2  import org.bukkit.entity.Player;\n\n 3  \n\n 4  class\
  \ Quader extends Viereckig{\n\n 5      private int tiefe;\n\n 6  \n\n 7      public\
  \ Quader(int hoehe, int breite, int tiefe, Material material){\n\n 8          super(hoehe,\
  \ breite, material);\n 9          this.tiefe = tiefe;\n10     }\n\n 11  \n\n 12\
  \      public void bauen(Player spieler){\n13      }\n14  } \n```\n\n**Listing 10.23:**\
  \ 作为 `Viereckig` 子类的 `Quader` 类\n\n### 重要提示\n\n父类构造函数的调用必须是子类构造函数中的第一个命令。\n\n你可以在\
  \ Figure 10.1 中找到这三个类及其方法和属性的图形概览。这种表示被称为 `UML 图`。属性前的负号表示它们是私有的（private），而方法前的加号则表示它们是公共的（public）。\
  \ `Mauer` 和 `Quader` 类指向 `Viereckig` 类的箭头显示这两个类是 `Viereckig` 类的子类。\n\n![](img/10_Abbildung_10.1.jpg)\n\
  \n**图 10.1:** 类概述\n\n在使用父类和子类时产生的另一个特性你可以在 Listing 10.24 中看到。在第 1 行和第 2 行中，你还会看到你已经足够熟悉的普通变量声明。但在第四行中，一个类型为\
  \ `Viereckig` 的变量被赋值了一个类型为 `Quader` 的变量。从乍上看这实际上是不可行的，毕竟你不能简单地给一个整数变量分配文本值。\n\n\
  ```\n1  Mauer m = new Mauer(3, 3, Material.DIRT);\n2  Quader q = new Quader(3, 3,\
  \ 3, Material.GOLD_BLOCK);\n3  \n\n4  Viereckig v = q;\n\n5  Viereckig v2 = new\
  \ Mauer(4, 4, Material.DIRT);\n\n6  \n\n7  Mauer m2 = q; // 错误 \n```\n\n**Listing\
  \ 10.24:** 子类与父类之间的关系\n\n在这种情况下这是可能的，因为 `Mauer` 是 `Viereckig` 的子类。变量始终可以被来自所有子类类型的值。而不可行的的是你在\
  \ Listing 10.24 最后一行中看到的。尽管值和变量都属于同一个父类，但这种赋值是不可能的，因为变量 `m2` 期望一个类型为 `Mauer` 的对象，而变量\
  \ `q` 的类型是 `Quader`。\n\n不过这里也有一些需要的地方：如果变量类型像 `v` 那样是一个父类，你只能访问父类的属性和方法。例如，`q` 的类型是\
  \ `Quader`，因此调用函数 `q.bauen(spieler)` 是没有问题的。尽管变量 `v` 现在分配了值 `q`，但 `v.bauen(spieler)`\
  \ 不是一个有效的调用，因为 `Viereckig` 类没有 `bauen` 函数。\n\n然而，从子类到父类的转换是可以撤销的，如 Listing 10.25\
  \ 所示。在第 7 行中，父类类型的变量重新变为了子类 `Quader` 类型的变量。这只需要在值前面的括号中写入子类的类型即可。但这只有当该值确实是对应子类的值时才有效，因此最后一行将产生一个错误。\n\
  \n```\n 1  Mauer m = new Mauer(3, 3, Material.DIRT);\n 2  Quader q = new Quader(3,\
  \ 3, 3, Material.GOLD_BLOCK);\n 3  \n 4  Viereckig v = m;\n 5  Viereckig v2 = q;\n\
  \ 6  \n 7  Quader q2 = (Quader) v2;\n 8  \n 9  if(v instanceof Mauer){\n10     Mauer\
  \ m2 = (Mauer) v;\n11 }\n12  \n13  q2 = m; // 错误 \n```\n\n**Listing 10.25:** 子类与父类之间的关系，部分\
  \ 2\n\n为了避免此类错误，你可以使用以前用过的 `instanceof` 命令来检查一个对象是否属于特定类，即它是否是该类的实例。\n\n## 10.6\
  \ 抽象方法和类\n\n到为止 `Viereckig` 类型仅被用于存储子类的值。但理论上也可以给这种变量分配 `Viereckig` 类型的值，如 Listing\
  \ 10.26 所示。\n\n```\n1  Viereckig v = new Viereckig(3, 3, Material.DIRT); \n```\n\
  \n**Listing 10.26:** 类型为 `Viereckig` 的变量赋值\n\n这起初并没有问题，但如果 `Viereckig` 类仅用于继承，而没有\
  \ `bauen` 函数或其他方法，那么它本身也几乎没有意义。仅作为父类使用且自身不创建对象（即实例）的类，在 Java 中被称为 `抽象类`，并通过 `abstract`\
  \ 关键字进行标记，如 Listing 10.27 所示。\n\n```\n1  abstract class Viereckig{\n2      \n3 }\
  \ \n```\n\n**Listing 10.27:** 抽象类的定义\n\n\n\n现在有一种抽象方法，如 Listing 10.28 第 15 行所示，它精确由签名组成，即仅包含返回值类型（在此例为\
  \ `void`）、名称（在此处为 `bauen`）以及参数（此处为 `spieler`，同样带有前置关键字 `abstract`）。子类本身可以保持不变。现在自然产生了一个问题：如果在实践中乍看完全没有任何变化，那么为什么要要做这些工作呢？\n\
  \n```\n 1  import org.bukkit.Material;\n\n 2  import org.bukkit.entity.Player;\n\
  \n 3  \n\n 4  abstract class Viereckig{\n\n 5      int hoehe;\n\n 6      int breite;\n\
  \n 7      Material material;\n\n 8  \n\n 9      public Viereckig(int hoehe, int\
  \ breite, Material material){\n\n10          this.hoehe = hoehe;\n\n11         \
  \ this.breite = breite;\n\n12          this.material = material;\n\n13      }\n\n\
  14  \n\n15      abstract void bauen(Player spieler);\n\n16  } \n```\n\n**Listing\
  \ 10.28:** 抽象函数的定义\n\n实际上，通过新的 `Viereckig` 类，有两个重要的变化：每个 `Viereckig` 的子类现在必须包含一个\
  \ `bauen` 函数，否则在编译时会报错。此外，如 Listing 10.29 所示，现在可以通过 `Viereckig` 类型的变量访问 `bauen`\
  \ 函数。这在没有抽象方法之前是不可能的。为什么这有时在实践中很有用，你将在下一个节中看到。\n\n```\n1  Quader q = new Quader\
  \ (3, 3, 3, Material.GOLD_BLOCK);\n\n2  Viereckig v = q;\n\n3  q.bauen(spieler);\
  \ \n```\n\n**Listing 10.29:** 访问 bauen 函数\n\n### 提示\n抽象方法只能出现在抽象类中，但抽象类并不一定非要包含抽象方法。\n\
  \n抽象方法的替代方案是方法重写（Overriding），你并在不知的情况下已经在每个插件中使用了它。\n\n它是如何工作的，你可以在 Listing 10.30\
  \ 中看到。在那里，你在第 10 行会遇到一种完全全新的源代码，即 `@Override` 注解。类 `B` 是类 `A` 的子类，通常它应该有权访问类 `A`\
  \ 中的方法 `funktion`。但如果你想为子类重新定义该方法，可以使用 `@Override` 来实现。与使用抽象函数的本质区别在于，子类在重写时可以选择是继承父类的函数，还是倾向于使用自己的函数。相反，如果一个函数被标记为抽象的，则子类必须每个提供一个自己的版本。\n\
  \n```\n 1  class A{\n\n 2      int zahl;\n\n 3  \n\n 4      public void funktion(){\n\
  \n 5          zahl = 3;\n\n 6      }\n\n 7  }\n\n 8  \n\n 9  class B extends A{\n\
  \n10      @Override\n\n11      public void funktion(){\n\n12          zahl = 6;\n\
  \n13      }\n\n14  } \n```\n\n**Listing 10.30:** 方法重写\n\n一种特殊情况是所谓的 `Interfaces`（接口）。它们是仅包含抽象方法的抽象类。\n\
  \n在 Listing 10.31 中，你可以看到如何使用它们。它们不是用 `class` 关键字引导，而是使用 `interface` 关键字。由于接口的所有方法都是抽象的，因此方法前的\
  \ `abstract` 关键字可以省略。接口的子类也被称为“实现类”（Implementations）。在这里使用 `implements` 关键字而不是 `extends`。\n\
  \n```\n 1  interface A{\n\n 2      int zahl;\n\n 3  public void funktion();\n\n\
  \ 4  }\n\n 5  \n\n 6  class B implements A{\n\n 7      public void funktion(){\n\
  \n 8          zahl = 6;\n\n 9      }\n\n10  } \n```\n\n**Listing 10.31:** 接口的使用\n\
