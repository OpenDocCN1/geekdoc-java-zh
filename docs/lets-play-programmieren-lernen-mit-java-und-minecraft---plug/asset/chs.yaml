  \  this.material = material;\n 15      }\n 16      \n 17      public void bauen(Player\
  \ spieler){\n 18          Location position = spieler.getLocation();\n 19      \
  \    World welt = spieler.getWorld();\n 20          \n 21          double yStart\
  \ = position.getY();\n 22          double zStart = position.getZ();\n 23       \
  \   \n 24          position.setX(position.getX() + 2);\n 25          \n 26     \
  \     for(int y = 0; y < this.hoehe; y++){\n 27              position.setY(yStart\
  \ + y);\n 28              \n 29              for(int z = 0; z < this.breite; z++){\n\
  \ 30                  position.setZ(zStart + z);\n 31                  welt.getBlockAt(position).setType(this.material);\n\
