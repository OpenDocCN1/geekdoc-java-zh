  \ BlockFace.NORTH_EAST, BlockFace.EAST_NORTH_EAST, BlockFace.EAST, BlockFace.EAST_SOUTH_EAST,\
  \ BlockFace.SOUTH_EAST, BlockFace.SOUTH_SOUTH_EAST};\n\n 2  \n\n 3  float rotation\
  \ = spieler.getLocation().getYaw();\n\n 4  rotation = (rotation + 180) % 360; //相反方向\n\
  \n 5  rotation = rotation / 22; //为标牌转换\n\n 6  \n\n 7  finalBlock.setType(Material.LEGACY_SIGN_POST);\n\
  \n 8  \n\n 9  BlockState schildStatus = finalBlock.getState();\n\n10  MaterialData\
  \ schildDaten = schildStatus.getData();\n\n11  \n\n12  Sign schild = (Sign) schildDaten;\n\
  \n13  schild.setFacingDirection(rotationen[Math.round(rotation)]);\n\n14  \n\n15\
  \  schildStatus.setData(schild);\n\n16  schildStatus.update(); \n```\n\n**列表 12.21：**\
