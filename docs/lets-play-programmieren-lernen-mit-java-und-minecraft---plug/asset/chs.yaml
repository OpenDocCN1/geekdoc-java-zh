  \  }\n\n 11  \n\n 12      public String getFrage(){\n\n 13          return this.frage;\n\
  \n 14      }\n\n 15  \n\n 16      public String getRichtigeAntwort(){\n\n 17   \
  \       return this.richtigeAntwort;\n\n 18      }\n\n 19  \n\n 20      public String[]\
  \ getFalscheAntworten(){\n\n 21          return this.falscheAntworten;\n\n 22  \
  \    }\n\n 23  } \n```\n\n**Listing 17.8:** `Fragen.java`\n\n借助这个类，你稍后可以在 `Quiz`\
  \ 类中（如 Listing 17.9 所示）非常轻松地添加新问题。但现在自然还需要输出问题并等待答案。\n\n```\n 1  import java.util.LinkedList;\n\
  \n 2  \n\n 3  public class Quiz{\n\n 4      public static void main(String[] args){\n\
  \n 5          LinkedList<Frage> fragen = new LinkedList <Frage>();\n\n 6       \
