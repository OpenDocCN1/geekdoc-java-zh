  \n正如前面提到的，数组中只能存储相同数据类型的值，在本例中为 `String` 类型。因此，声明也以 `String` 单词开头。随后的方括号 `[]` 表示这是一个数组。与其他变量类型一样，后面紧跟的是变量名。因此，一个整数数组的声明如下：`int[]\
  \ zahlen;`。\n\n在 Listing 6.29 中，不仅声明了变量，还立即为其分配了一个值，确切地说，是了多个值。这个过程，即首次给变量赋值，也称为`初始化`。如果你想一次性给数组分配所有值，只需像\
  \ Listing 6.29 那样，在大花括号中用逗号分隔连续写入这些值即可。但通常，我们想稍后逐渐给数组分配各个值。这时就需要另一种初始化形式，它在 Listing\
  \ 6.30 中所示。\n\n```\n1  String[] nameSpieler = new String[4]; \n```\n\n**Listing\
  \ 6.30:** 指定长度的数组初始化\n\n这里在方括号中只指定了数组的长度，即以后要在数组中存储多少个值。数组是固定长度的，这意味着以后无法轻易删除一个元素或向数组添加另一个元素。如果以这种方式初始化数组，以后可以像\
  \ Listing 6.31 所示为其赋值值。正如那里演示的，可以同时对数组的所有部分赋值，也可以只针对单个部分。其他类型的数组声明方式类似，例如一个整数数组的声明如下：`int[]\
