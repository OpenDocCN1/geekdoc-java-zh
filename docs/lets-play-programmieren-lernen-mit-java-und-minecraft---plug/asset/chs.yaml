  ## 12.4 告示牌插件 (列表)\n\n在我们对告示牌的学习最后，我们现在还想要创建一个插件，它不仅允许你放置告示牌，还允许你在放置后更改其文本。\n\n\
  当然，这个插件不应该只能管理一个告示牌，因为那样实现起来太简单，而是应该能同时管理多个。因此，该插件的工作原理应该是：当输入命令 `/schild bauen`\
  \ 时，在调用命令的玩家面前会建造一个告示牌。此外，该玩家应该收到一条包含新建造的告示牌 ID 的聊天消息，例如“新建造的告示牌 ID 为 4...”。随后，玩家可以使用\
  \ `/schild text` 命令更改告示牌的文本。例如 `/schild text 4 2 \"Hallo\"` 会在 ID 为 4 的告示牌的第二行写入文本“Hallo”。为了防止告示牌被破坏，只有放置了该告示牌的玩家才能更改其内容。\n\
  \n对于作为程序员的你来说，这个插件提供了许多有趣的挑战。首先，插件必须记住所有玩家放置的告示牌。但是，告示牌的数量以及放置告示牌的玩家数量从先来看都是未，并且会不断变化。你目前所学的所有变量类型都有固定的大小：普通的整数和字符串变量只能存储一个值。数组虽然可以存储多个值，但它们的大小必须从先确定。现在的一种方法是创建一个非常大的数组（例如长度为\
  \ 5000）并信任它。\n\n### 12.4.1 列表基础\n\n你需要一种像数组一样可以存储多个值、但具有动态长度的变量类型（List）。有多种列表类型，其中\
  \ `ArrayList` 和 `LinkedList` 是最常用的。在列表 12.9 中可以看到如何声明列表。\n\n```\n1  List<String>\
  \ liste1 = new ArrayList<>();\n2  List<Integer> liste2 = new LinkedList<>();\n```\n\
  \n**列表 12.9:** 列表声明\n\n### 12.4.1.2 添加元素\n\n在使用方面，`ArrayList` 和 `LinkedList` 并没有区别。如何向列表添加元素，可以在列表\
  \ 12.10 中看到。为此，你只需使用 `add()` 命令。\n\n```\n1  liste1.add(\"Mosel\");\n2  liste1.add(\"\
  Saar\");\n3  liste1.add(0, \"Rhein\");\n4  \n5  liste2.add(42);\n6  liste2.add(1337);\n\
  7  liste2.add(8);\n```\n\n**列表 12.10:** 向列表添加元素\n\n你也可以配合位置参数使用该命令，这样可以在列表的任意位置插入新元素。如果在插入新元素时不指定位置，则元素将始终添加到列表末尾。列表\
  \ 12.10 中的命令将生成列表。通过 `size()` 命令，例如 `liste1.size()`，你可以查询列表的当前长度。\n\n### 12.4.1.3\
  \ 删除元素\n\n一旦添加的元素也可以从列表中删除。关于它是如何工作的，你可以查看[列表 12.11]。如你所见，这里也有多种方法。首先，你可以指定要删除的具体对象，例如在\
  \ `liste1` 的情况下指定字符串。此时，`remove()` 命令返回一个布尔值，指示删除是否成功。在列表 12.11 的情况下，`b` 的值将是 `false`，因为列表不包含\
  \ `Donau` 元素。如果一个元素在列表中出现多次（这也是可能的），那么只会删除该元素的第一个出现处。\n\n```\n1  liste1.remove(\"\
  Rhein\");\n2  \n3  boolean b = liste1.remove(\"Donau\");\n4  \n5  liste2.remove(2);\
  \ \n```\n\n**列表 12.11:** 从列表中删除元素\n\n\n\n\n如果你想完全清空一个列表，即一次性删除所有元素，可以使用 `clear()`\
  \ 命令，例如 `liste2.clear();`。\n\n### 读取元素\n将对象保存到列表中，只有在之后能够从该列表中读取它们时才有意义。读取操作如 Listing\
  \ 12.12 所示，使用 `get` 命令来完成，该命令需要配合要读取的元素索引来调用。\n\n```\n1  String s = liste1.get(1);\
  \ \n```\n\n**Listing 12.12：** 从列表中读取元素\n\n### 修改元素\n如果你想事后更改列表中的元素，可以像 Listing 12.13\
  \ 所示使用 `set` 命令。它除了需要对象的新值外，还需要要修改对象所在的位置作为参数。\n\n在 `liste1` 中，执行完 Listing 12.13\
  \ 中的行后，项目“Donau”将位于第一位，随后是“Mosel”，因为原始第一个项目“Rhein”已经在 Listing 12.12 中删除了。\n\n```\n\
  1  liste1.set(0, \"Donau\"); \n```\n\n**Listing 12.13：** 修改列表中的元素\n\n### 查找元素\n\
  如你所发现的，对于许多命令来说，知道对象处于什么位置是非常重要的。幸运的是，有一种非常简单的方法可以找到，如 Listing 12.14 所示。`indexOf`\
  \ 命令返回元素在列表的位置。如果元素在列表中出现多次，则返回第一次出现的位置；如果元素完全不在列表中，该命令将返回值 -1。\n\n```\n1  int position\
  \ = liste1.indexOf(\"Saar\"); \n```\n\n**Listing 12.14：** 查找元素的位置\n\n一个元素是否存在于列表中，可以通过\
  \ `contains` 命令进行检查，如 Listing 12.15 所示。\n\n```\n1  boolean enthaelt = liste1.contains(\"\
  Mosel\"); \n```\n\n**Listing 12.15：** 检查元素是否存在\n\n正如你所看到的，使用 `ArrayList` 与使用 `LinkedList`\
  \ 没有区别。这在一方面是实用的，因为你需要记忆的内容更少，但引发了一个问题：为什么会有不同的列表类型？实际上，不同的列表类型之间确实存在差异，但仅限于内部管理，而不是外部的访问权限。`ArrayList`\
  \ 正如其名，内部使用数组来存储数据，而 `LinkedList` 使用了所谓的双向链表。根据使用领域的不同，不同的列表类型在访问速度和内存消耗方面可能提供优势。简单来说，当经常在列表中间删除或添加元素时，`LinkedList`\
  \ 特别具有优势。相比之下，对于普通的列表访问，`ArrayList` 更合适。然而，这种差异非常微小，对于我们在本书中追求的目的来说，没有明显的区别。如果你不确定哪种列表是更好的选择，作为准则，在疑问时应优先选择\
  \ `ArrayList`。\n\n### 12.4.2 插件\n掌握了使用列表的知识，你现在可以尝试实现插件的第一部分。首先，你应该让玩家能够放置一个告示牌，然后将其存储在所有告示牌列表中，随后向玩家发送一条包含新放置告示牌\
  \ ID 的聊天消息。\n\n这听起来起初并不神奇，但正如你即将看到的，它并不简单。开头又是 Listing 12.16 所示的 `plugin.yml` 文件。这里目前还没有特殊之处。正如开头提到的，稍后我们将再次对命令描述进行调整，最终它应该允许更改文本。但对于开始，我们只需要一个用于构建的命令。\n\
