  \ 收集游戏\n\n如果你更像是一个收集者而不是猎人，你也可以设计一种游戏模式，其目标不是猎杀敌人，而是收集物品。为了让整个过程对玩家来说更有吸引力，你可以为第一个完成收集任务的玩家提供奖励。这种奖励可以是金子或钻石等稀有物品，也可以经验值。\n\
  \n### 16.2.1 插件的结构\n\n首先，我们来处理插件的大致结构。首先你需要一个变量 `gesuchterGegenstand`（寻找的物品）。它将存储当前正在寻找什么种类的物品，另一个变量\
  \ `anzahl`（数量）将存储需要多少个。一个名为 `gesammelt`（已收集）的 Map 将将存储每个玩家已经收集了多少个物品。然后你还需要一个监听器，这次是针对\
  \ `PlayerPickupItemEvent` 的。当玩家捡起物品时，该事件就会被调用。插件的骨架你可以在 Listing 16.10 中看到。\n\n```\n\
