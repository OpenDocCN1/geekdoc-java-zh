  \ Mauer-Plugin Version 3.0, Schritt 2\n\nWarum überhaupt der ganze Aufwand? Bisher\
  \ hat der Einsatz von Objekten im Mauer-Plugin den Quellcode eher unübersichtlicher\
  \ gemacht und kaum Vorteile gebracht. Das kannst du aber ändern, indem du die Baufunktion\
  \ in die `Mauer`-Klasse selbst auslagerst. Denn Klassen können in Java nicht nur\
  \ aus Variablen, also Attributen, bestehen, sie können auch eigene Funktionen besitzen.\
  \ Man spricht auch von den Methoden einer Klasse.\n\nDie um die `Bauen`-Funktion\
  \ erweiterte `Mauer`-Klasse findest du in Listing 10.15. Von anfänglich drei Parametern,\
  \ als sie noch ganz ohne Objekte gearbeitet hat, benötigt die Klasse nun nur noch\
  \ einen Parameter, nämlich den Spieler. Da die Funktion nun Teil der `Mauer`-Klasse\
  \ an ein konkretes Objekt gebunden ist, nämlich eine Mauer mit fester Höhe und vorgegebenem\
  \ Material, hat sie direkten Zugriff auf diese Attribute und sie nicht mehr übergeben\
  \ werden.\n\n```\n 1  import org.bukkit.Location;\n 2  import org.bukkit.Material;\n\
  \ 3  import org.bukkit.World;\n 4  import org.bukkit.entity.Player;\n 5  \n 6  class\
