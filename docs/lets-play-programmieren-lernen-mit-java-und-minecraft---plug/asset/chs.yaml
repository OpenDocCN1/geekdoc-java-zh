  \ Ein Plugin mit mehreren Listener\n\nWie du in den letzten Abschnitten gesehen\
  \ hast, gibt es wirklich eine Vielzahl von verschiedenen Events. Größere Plugins\
  \ benutzen deshalb oft mehr als einen Listener, um auf verschiedene Events reagieren\
  \ zu können. Wie das aussehen kann, kannst du in Listing 13.4 sehen: Das dort gezeigte\
  \ Plugin reagiert sowohl auf das `PlayerJoinEvent` als auch auf das `PlayerQuitEvent`.\n\
  \n```\n 1  import org.bukkit.plugin.PluginManager;\n 2  import org.bukkit.plugin.java.JavaPlugin;\n\
  \ 3  import org.bukkit.event.Listener;\n 4  import org.bukkit.entity.Player;\n 5\
  \  import org.bukkit.event.EventHandler;\n 6  import org.bukkit.event.player.PlayerJoinEvent;\n\
  \ 7  import org.bukkit.event.player.PlayerQuitEvent;\n 8  \n 9  public class ListenerPlugin\
