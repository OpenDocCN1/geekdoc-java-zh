  ```\n\n**Listing 13.4:** Verwendung mehrerer Listener in einem Plugin\n\nUm zwei\
  \ Listener innerhalb eines Plugins zu verwenden, musst du in der `onEnable`-Funktion,\
  \ wie in Listing 13.4 gezeigt, darauf achten, dass beide Listener registriert werden.\
  \ Du kannst dies mit `pluginManager.registerEvents(listener, this)` tun. Wenn du\
  \ mehrere Listener verwenden möchtest, musst du dies für jeden separat machen. Achte\
  \ darauf, dass alle benötigten Klassen importiert sind, wie zum Beispiel `org.bukkit.plugin.PluginManager`,\
  \ `org.bukkit.plugin.java.JavaPlugin`, `org.bukkit.event.Listener`, `org.bukkit.entity.Player`,\
  \ `org.bukkit.event.EventHandler` sowie die spezifischen Events wie `PlayerJoinEvent`\
  \ und `PlayerQuitEvent`. Zudem solltest nicht vergessen, die Klassen korrekt zu\
  \ erstellen und das `Listener`-Interface zu implementieren.\n\n## 13.11 Zusammenfassung\n\
  \n| Event | Funktionen | Beschreibung |\n| --- | --- | --- |\n| `VehicleCreateEvent`\
  \ | `getVehicle()` | Wenn ein Fahrzeug erstellt wird, aufgerufen. |\n| `VehicleDamageEvent`\
  \ | `getVehicle(), getAttacker(), getDamage(), setDamage(float)` | Wenn ein Fahrzeug\
  \ beschädigt wird, aufgerufen. |\n| `VehicleDestroyEvent` | `getVehicle(), getAttacker()`\
  \ | Wenn ein Fahrzeug zerstört wird, aufgerufen. |\n| `VehicleEnterEvent` | `getVehicle(),\
  \ getEntered()` | Wenn eine Kreatur ein Fahrzeug betritt, aufgerufen. |\n| `VehicleExitEvent`\
  \ | `getVehicle(), getExited()` | Wenn eine Kreatur ein Fahrzeug verlässt, aufgerufen.\
  \ |\n| `VehicleMoveEvent` | `getVehicle(), getFrom(), getTo()` | Wenn sich ein Fahrzeug\
  \ bewegt, aufgerufen. |\n| `VehicleUpdateEvent` | `getVehicle()` | Wenn ein Fahrzeug\
  \ aktualisiert wird, aufgerufen. |\n\n| Begriff | Bedeutung |\n| --- | --- |\n|\
  \ `Listener` | Ein Plugin, das auf Veränderungen reagiert. |\n| `Event` | Eine Veränderung\
  \ auf dem Server, die von einem Listener wahrgenommen wird. |\n| `JavaPlugin.getServer().getPluginManager()`\
  \ | Gibt den Plugin-Manager zurück. |\n| `PluginManager.registerEvents(listener,\
  \ this)` | Registriert einen Listener. |\n| `@EventHandler` | Leitet eine Funktion\
  \ ein, die von einem Listener bei einer festgestellten Veränderung aufgerufen wird.\
  \ |\n\n\n\n\n随后将创建新的配方。在创建配方对象时，必须将所需的结果（在此情况下为变量 `steinknopf`）作为参数传递。之后，才能在第 3\
  \ 行设定配方的材料。在这种情况下这非常简单，因为该配方只由一种材料组成，即一个石块。但原则上，你可以使用 `addIngredient` 命令添加多达九种材料。如果你想添加多个相同类型的材料，你也可以通过传递一个数字作为额外参数来方便地实现这一点，例如使用\
  \ `steinknopfRezept.addIngredient(3, Material.STONE)`，这样就可以向配方中添加三块石块作为材料了。\n\n\
  ```\n1  ItemStack steinknopf = new ItemStack(Material.STONE_BUTTON);\n2  ShapelessRecipe\
  \ steinknopfRezept = new ShapelessRecipe(steinknopf);\n3  steinknopfRezept.addIngredient(Material.STONE);\n\
  4  this.getServer().addRecipe(steinknopfRezept); \n```\n\n**Listing 14.1：** 石按钮配方\n\
  \n虽然配方在原则上已经完成，但在玩家实际使用之前，必须让服务器知道它。最后一行的命令确保了这一点，它将传递给服务器的配方添加到服务器中。\n\n创建材料位置固定的配方要稍微复杂一些，因为在这里不仅需要指定材料，还需要指定它们的位置。一个你一定熟悉的此类配方例子是\
  \ 图 14.1 所示的钓竿配方。只有当三根木棍和两根线精确地位于所示的位置时，才能制作出钓竿。\n\n![](img/14_Abbildung_14.1.jpg)\n\
  \n**图 14.1：** 钓竿配方\n\n关于如何创建这样一个所谓的 `ShapedRecipe`（即形状型配方），你可以在 Listing 14.2 中看到。在这里开头同样是所需的结果，在此情况下即钓竿。随后再次是配方的初始化，这次自然是作为\
  \ `ShapedRecipe`。不过，之后的情况有所不同：这里不是设定材料，而是首先使用 `shape` 函数设定配方的形状。\n\n```\n1  ItemStack\
  \ angel = new ItemStack(Material.FISHING_ROD);\n2  ShapedRecipe angelRezept = new\
  \ ShapedRecipe(angel);\n3  angelRezept.shape(\"  /\", \" /*\", \"/ *\");\n4  angelRezept.setIngredient('/',\
  \ Material.STICK);\n5  angelRezept.setIngredient('*', Material.STRING);\n6  this.getServer().addRecipe(angelRezept);\
  \ \n```\n\n**Listing 14.2：** 钓竿配方\n\n乍一看，命令括号中的三个字符串看起来可能有些神秘，但实际上非常容易理解。三个字符串中的每一个代表合成栏中的一行。字符串本身又由正好三个字符组成，每个字符代表一个格子。如果将这三个字符串如\
  \ 表格 14.1 那样整齐地排列在一起，那么它与 图 14.1 中的钓竿配方非常相似。字符串中的每个空格代表配方中的一个空格子；如果同一个字符出现在字符串的两个位置，那么配方中对应的位置也必须放置相同的材料。\n\
  \n| | | / |\n| | / | * |\n| / | | * |\n\n**表格 14.1：** 钓竿配方的形状\n\n使用哪种字符对应什么材料并不重要，因为你可以自行定义映射。例如在\
  \ Listing 14.2 的第 4 行中设定字符 `/` 代表木棍，第 5 行设定字符 `*` 代表线。同样，你也可以反转映射或使用完全不同的字符，重要的是相同的材料必须使用相同的字符。最后，你也已经知道了，这里还需要将配方传递给服务器，钓竿配方就制作完成了。\n\
  \n除了像钓竿这样需要完全固定顺序的配方外，还有允许一定变化的配方。一个例子是火炬配方，其不同的变体显示在 图 14.2 中。\n\n![](img/14_Abbildung_14.2.jpg)\n\
  \n**图 14.2：** 火炬配方\n\n## 14.2 设计自己的配方\n\n除了像钓竿这样需要完全固定顺序的配方外，还有允许一定变化的配方。一个例子是火炬配方，其不同的变体显示在\
  \ 图 14.2 中。（*注：此处原文中存在大量重复段落，根据指令“一定不要重复输出原文”，译文已保留核心逻辑并去除冗余*）\n\n\n\n\n第一步 ist\
  \ natürlich die Erstellung eines entsprechenden Rezepts. Anders als bisher geht\
  \ es dabei nicht nur darum, die Zutaten festzulegen, diesmal soll vor allem der\
  \ Gegenstand, der als Ergebnis des Rezeptpts erstellt wird, verändert werden. Wie\
  \ genau, kannst du in Listing 14.5 sehen.\n\nZunächst einmal erhält das Schwert\
  \ einen neuen Namen: Dazu werden in Zeile 11 zuerst die sogenannten Meta-Daten des\
  \ Schwertes geladen. In den Meta-Daten werden zusätzliche Informationen zu Items\
  \ gespeichert, wie zum Beispiel deren Name. Mit dem Befehl `setDisplayName` kann\
  \ der ursprüngliche Name dann in einen beliebigen anderen geändert werden, zum Beispiel\
  \ » Feuerwert». Die so geänderten Meta-Daten können dann wieder dem Schwert zugewiesen\
  \ werden, wie in Zeile 13 gezeigt.\n\nDamit man auch im Inventar sofort erkennen\
  \ kann, dass es sich bei diesem Schwert um ein ganz besonderes Exemplar handelt,\
  \ soll es außerdem noch das typische »Glitzern» eines verzauberten Gegenstands erhalten.\
  \ Da es nur um das Aussehen und nicht um den eigentlichen Effekt der Verzauberung\
  \ geht, ist es am sinnvollsten, eine Verzauberung zu wählen, die normalerweise nicht\
  \ auf ein Schwert angewendet werden kann, wie zum Beispiel »Glück des Meeres«. So\
  \ kannst du ganz sicher sein, dass das Ergebnis deines Recipes garantiert einzigartig\
  \ ist. Der Befehl zum Hinzufügen einer Verzauberung zu einem Gegenstand lautet `addUnsafeEnchantment`,\
  \ wie du in Zeile 14 sehen kannst. Das `Unsafe` im Befehl sorgt dabei, dass der\
  \ Server ignoriert, dass diese Verzauberung eigentlich nicht für Schwerter gedacht\
  \ ist, die Zahl legt die Stufe der Verzauberung fest. Der Rest des Recipes besteht\
  \ dann nur noch aus dem bereits bekannten Hinzufügen der Zutaten und der Übergabe\
  \ des Rezeptpts an den Server.\n\n```\n 1  import org.bukkit.Material;\n 2  import\
