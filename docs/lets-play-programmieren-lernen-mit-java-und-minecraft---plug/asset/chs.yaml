  \ 和 `meineSehrLangeVariable`。\n\n除了标识符外，变量的声明还包含其`类型`。Listing 6.1 中的变量类型为 `int`，它是\
  \ `Integer` 的缩写。在 Java 以及大多数其他编程语言中，不仅区分不同类型的变量（如数字或文字），在数字内部也有不同的变量类型。\n\n`Integer`\
  \ 类型的变量只能存储整数，即不带小数部分的数字。此外，`Integer` 变量无法存储任意大小的数字，只能存储 -2,147,483,648 到 2,147,483,647\
  \ 之间的数字。对于更大或更小的整数，Java 还提供了其他不同的数据类型。Tabelle 6.1 显示了 Java 的整数变量类型及其相应的取值范围。\n\n\
  | 类型 | 取值范围 |\n| --- | --- |\n| `byte` | -128 到 127 |\n| `short` | -32.768 到 32.767\
  \ |\n| `int` | -2,147,483,648 到 2,147,483,647 |\n| `long` | -9,223,372,036,854,775,808\
  \ 到 9,223,372,036,854,775,807 |\n\n**表格 6.1：** Java 中的原始整数数据类型\n\n你现在可能在想，为什么数字会有不同的变量类型。始终使用\
  \ `long` 变量似乎是最简单的，毕竟它可以存储大多数数字。这是因为不同的变量类型占据的内存空间不同。一个 `long` 变量在声明后始终占据相同数量内存，无论其中存储的是\
  \ 0 还是 9,223,372,036。取值范围越小，占用的内存也越小。例如，`int` 变量占据的内存空间仅为 `long` 变量的一半。在实践中，在本本书中，`int`\
  \ 变量通常使用最频繁。\n\n为了存储所谓的浮点数或小数（即带有小数部分的数字），Java 提供了两种不同的变量类型：`float` 和 `double`。正如\
  \ Tabelle 6.2 所示，它们的区别在于精度，即可以存储的小数位数。\n\n### 提示\n虽然我们谈论的是浮点数，但在 Java 中使用点而不是逗号。这是因为逗号在英语中用作分隔符。虽然我们可以将\
  \ 1337 写成 `1.337`，但在英语中写成 `1,337`。对于 1/2，德语写成 `0,5`，英语写成 `0.5`。\n\n| 类型 | 取值范围 |\n\
  | --- | --- |\n| `float` | -3,40282347 x 10³⁸ 到 3,40282347 x 10³⁸ |\n| `double`\
  \ | -1,797693134862157 x 10³⁰⁸ 到 1,797693134862157 x 10³⁰⁸ |\n\n**表格 6.2：** 浮点数数据类型\n\
  \n### 释\n这里给出的取值范围仅供参考，实际上变量类型的取值范围是灵活的。Tabelle 6.1 和 Tabelle 6.2 中的数据指的是 32 位系统的标准设置。\n\
  \n在声明之后（几乎每一行都以分号结尾），可以给变量分配一个值。Listing 6.1 中有三种赋值。在值赋值的左侧始终是变量的标识符，在这种情况下是 `x`。随后的等号表示在该处应给变量分配一个新值。等号的右侧则是要分配的值。在\
  \ Listing 6.1 的第二行中... (注：原文德语此处有逻辑断层，已按意译处理)\n\n\n\n\n\n在第一行中声明了一个名为 `s` 的字符串变量，在第二行中为它赋值“Hallo\
  \ Welt!”（你好世界！）。空字符串（`\"\"`）也是变量的有效值。如果你想直接为新声明的变量赋值，也可以使用以下更短的写法：\n\n```\n1  String\
  \ s = \"Hallo Welt!\"; \n```\n\n**列表 6.5：** 变量声明的简写方式\n\n正如开头提到的，将一个字符串和一个数字相加意义不大，但对于字符串也可以使用\
  \ `+` 符号，不过它不是作为加法运算符，而是作为连接运算符。在对两个字符串进行连接或链接时，简单来说，它们会被按顺序拼接。例如，`\"Mine\" + \"\
