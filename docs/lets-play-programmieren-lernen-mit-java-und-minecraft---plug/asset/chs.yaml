  \ 0，因为到那时他们还没有收集任何物品。之后，你应该给他们一个友好的提示，告诉他们游戏模式是如何运作的以及他们需要收集什么物品。为此，最好使用你已经用过的 `PlayerJoinEvent`。\n\
