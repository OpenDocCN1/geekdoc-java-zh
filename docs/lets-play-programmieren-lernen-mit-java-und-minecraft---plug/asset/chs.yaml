  \n## 7.2 不同的循环\n\n借助 `setType` 命令，你还可以简单地将多个区块堆叠在一起，如 Listing 7.8 所示。第一行加载玩家的位置，并将\
  \ X 值增加二。之后，每放置一个区块，Y 坐标就会增加一，以便区块区块能够垂直排列。X 值对每个区块都保持不变。\n\n```\n 1  Location position\
  \ = spieler.getLocation();\n\n 2  position.setX(position.getX() + 2);\n\n 3  welt.getBlockAt(position).setType(Material.PUMPKIN);\n\
  \n 4  position.setY(position.getY() + 1);\n\n 5  welt.getBlockAt(position).setType(Material.PUMPKIN);\n\
  \n 6  position.setY(position.getY() + 1);\n\n 7  welt.getBlockAt(position).setType(Material.PUMPKIN);\n\
  \n 8  position.setY(position.getY() + 1);\n\n 9  welt.getBlockAt(position).setType(Material.PUMPKIN);\
  \ \n```\n\n**Listing 7.8：** 手动创建的南瓜区块塔\n\n在 Listing 7.8 中你再次发现了一种简写方式，这次将\n\n```\n\
  1  Block block = welt.getBlockAt(position);\n\n2  block.setType(Material.PUMPKIN);\
  \ \n```\n\n被\n\n```\n1  welt.getBlockAt(position).setType(Material.PUMPKIN) \n```\n\
  \n替换了。\n\n尽管如此，如你所见，即使是四个区块，这也是大量的代码，而且还在不断重复。如果你现在想更改区块类型，你必须对每个区块单独进行操作。如果你想堆叠十个甚至\
  \ 20 个区块，你的程序代码将很快变得非常混乱。\n\n因此，在本节中，我们将学习所谓的循环。通过循环，你可以连续执行多次程序代码，从而避免不必要的编写工作并保持代码的整洁。\n\
  \n### 7.2.1 for-循环\n\nJava 拥有三种不同类型的循环。我们从所谓的 `for` 循环开始，其语法表示方式可以在 Listing 7.9\
  \ 中找到。\n\n```\n1  for(int i = 0; i < 5; i++){\n\n2      //Befehle\n\n3  } \n```\n\
  \n**Listing 7.9：** `for`-循环的语法\n\n在第一行是所谓的循环头。它以关键字 `for` 开始，可以立即看出这是一个 `for` 循环。随后的圆括号内指定了循环中命令执行的次数。\n\
  \n为此，`for` 循环使用了一个所谓的循环变量。它首先在括号中声明并设置为 0。我们也称之为循环变量的初始值为 0。原则上，你当然可以像通常一样自由选择循环变量的名字，但使用\
  \ `i` 作为标识符是非常常见的。同样，初始值也可以自由选择。\n\n在声明循环变量之后，用分号隔开的是所谓的运行条件，它决定了循环重复或“遍历”的次数。在每次重复之前，循环都会检查这个运行条件。只有当满足该条件时，循环内部的代码才会再次执行。在\
  \ Listing 7.9 的示例中，运行条件是：一旦 `i` 于 `5`，循环不再重复。\n\n\n\n最初的目标建造一个由十个南瓜组成的塔，现在多亏于 `for`\
  \ 循环可以轻松实现。只需要像 Listing 7.11 所示那样调整 `kuerbisPlatzieren` 函数即可。\n\n```java\n 1  public\
  \ boolean onCommand(CommandSender sender, Command befehl, String befehlsname, String[]\
  \ args){\n\n 2      Player spieler = (Player) sender;\n\n 3  \n\n 4      Location\
  \ position = spieler.getLocation();\n\n 5      World welt = spieler.getWorld();\n\
  \n 6      \n 7      position.setX(position.getX() + 2);\n 8      double yStart =\
  \ position.getY();\n\n 9  \n10      for(int i = 0; i < 10; i++){\n11          position.setY(yStart\
  \ + i);\n12          welt.getBlockAt(position).setType(Material.PUMPKIN);\n13  \
  \    }\n14  \n15      return true;\n16  } \n```\n\n**Listing 7.11:** 带有循环的 `kuerbisPlatzieren`\
  \ 函数\n\n在使用循环时，最重要的是注意哪些内容必须放在循环体中，以及哪些命令可以或必须放在循环的之前或之后。例如，Listing 7.11 中的第 2 到第\
  \ 5 行完全可以很方便地放在循环体中，这对结果完全没有影响。然而，这将导致内存和计算时间的浪费浪费，不必要地减慢插件速度。对于 10 次循环，这还不是特别严重，但在循环次数很多时，循环内部每条额外的命令都会很快变得明显。因此，人们应该始终尝试在循环体中只放置尽可能少但必不可少的内容。\n\
  \n相比之下，`position.setX(position.getX() + 2)` 命令必须放在循环体之外。因为为了建造一座塔，只有放置区块的 Y 坐标可以改变，而\
  \ X 坐标不能。因此，必须在循环之前修改一次 X 坐标，以便塔在玩家面前生成。\n\n在循环体中，我们每次循环都会向之前保存的 Y 起始位置加上循环变量的当前值，即第一次循环为\
  \ 0，第二次为 1，以此此类推。然后我们在该位置放置一个南瓜。这就是为什么选择循环变量的初始值为 0 而不是 1 是有意义的：这样塔就会从玩家所在的高度开始。出于这个原因，10\
  \ 次循环的运行条件是 `< 10` 而不是 `<= 10`（如果初始值为 1，则应该是后者）。\n\n用于建造南瓜塔的完整插件，你仍然可以在 Listing\
