    What do we call a method in our day to day life? You might have your own secret
    methods of study, or your method of beating a game. Your secret method of study
    could be taking short notes that help you remember the whole concept easily, or
    your method of beating the game could be to stay sneaky until the time is right
    to take down your opponent. Anyway, a method is made of multiple steps that we
