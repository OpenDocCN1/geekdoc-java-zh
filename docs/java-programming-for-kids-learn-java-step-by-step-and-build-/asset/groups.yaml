    # Java Programming For Kids


    # What is a “strongly typed language”?


    Now I am going to explain a new concept to you. Have you ever heard that Java
    is a “strongly typed language?” What does it mean? Hey, don’t panic! It is a very
    simple concept.


    When someone tells you “Ann is the sister of Alan,” you understand that;


    +   a) Ann is a girl or woman because we use the term sister to refer to a girl
    or woman.


    +   b) Ann has at least one sibling, because you need to have at least one sister
    or brother, also known as a sibling.


    Henceforth whenever you hear about Ann, you will think of her as a girl having
    a sibling. She will not be included in other categories like “boy,” “husband,”
    or even “only child.”


    Similarly, strongly typed language means that once you define a variable of a
    particular data type, you cannot use it to store another data type. For example,
    you define a variable named “firstNum” of int type, then you are allowed to store
    only integers within firstNum, not String or Boolean.


    In fact, there are some other programming languages that do not need you to classify
    the type of variable when you create it. In other words, some programming languages
    allow you to store different types of data in the same variable, but not simultaneously,
    of course. Such languages are known as “loosely typed languages.” Some of the
    loosely typed languages are “Perl” and “JavaScript.” Once you understand the basic
    Java concepts, learning JavaScript is an easy task.'
