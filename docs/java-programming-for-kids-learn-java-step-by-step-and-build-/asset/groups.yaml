    Methods chapter that I have been referring to. Now it is time to understand what
    those jargons are. Read carefully.


    Any method should have a “method header” and a “method body.” The method body
    contains the lines of code that do a particular job. The method header gives the
    basic information about your method to Java. In our example, public static int
    calculateSum(int first, int second) is the method header.


    Let’s see all the items in the method header one by one. You see public has the
    first value in the method header. What is it? It is known as an “access modifier.”


    Before explaining the topic, let me ask you a simple question. Suppose your father
    has an expensive car. Will everyone, including your relatives, neighbors, or your
    father’s colleagues be allowed to drive that car? No, your father or your mother
    might be the only people who drive that car? Am I right? Now suppose your father
    has a cheap used car that he plans to sell very soon. Your father might allow
    even his colleagues or neighbors if they ask him to use it. Here, your father
    decides who can access a thing (expensive and cheap cars here) based on some criteria.


    Similarly in Java, access modifiers decide whether other classes use a class or
    the members of a class. What are the members of a class? The members of a class
    are “properties” and “methods.”'
