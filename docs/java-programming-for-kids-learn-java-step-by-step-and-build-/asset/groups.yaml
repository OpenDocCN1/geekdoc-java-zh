    Java 程序将成为你酷的入场券。你可以在 `C:\`、`D:\` 或任何你喜欢的目录下创建它。打开 Notepad++ 应用程序，点击顶部的“文件”菜单，然后点击“保存”选项（用红圈圈出）。


