    Java 此应用程序的执行应该从哪里开始。`public`、`static` 和 `void` 等不同术语将在稍后的“方法”章节中进行解释。


    任何程序的主方法都应该位于公共（public）类中。这就是为什么我们在 `HelloWorld` 公共类中包含了主方法。主方法应该对所有其他类可见，因此我们像对待
    `HelloWorld` 类一样将其设置为 `public`。


    我们正在调用 `System` 库中的一个函数来显示字符串 "Hello World!!!"。这个库无非是一个资源的集合，就像你学校或家里的图书馆一样。


    现在让我们尝试运行这段代码并查看结果。首先，在你的任何目录中创建一个文件夹。你只需在目录内部点击右键，选择“新建”，然后点击“文件夹”即可创建文件夹。


