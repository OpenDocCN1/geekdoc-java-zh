    accounting, and finance matters.


    The learning becomes complete only when we are able to apply what we have learned.
    In the case of programming, your learning becomes a success when you make an application
    out of your knowledge.


    You might have used the calculator application available on your computer at least
    once. What about creating a calculator on your own? You are going to develop a
    cool calculator that will not only do basic mathematical calculations, but also
    ask you questions and interact with you based on your answers. So, you can use
    the calculator you design to help you in math and also to have some fun.


    Whether you eat a piece of apple pie or a piece of pizza, your digestive system
    digests the food by breaking it down. This is similar to Java.


    1. Understand how a Java program is processed.

    2. Set up the basic Java development environment and start developing applications.

    3. Learn how to set the PATH variable to make the program execution faster.

    4. Understand what variables are and how to use them.

    5. Learn to do math using Java.

    6. Understand how to use conditional statements to decide the flow of execution.

    7. Understand how to make your programs reusable and structured with the help
    of methods.

    8. Learn how to collect inputs from the user.

    9. Create a number of Java programs.

    10. Develop a cool Talking Calculator.


    It''s alright if you don''t understand all of what was said right away, that''s
    what this book is about! So, let''s get started...


    In this section, I am going to explain to you simply how a Java program is processed.
    We said that Java is “platform independent.” What does that mean? It means that
    the same Java program can run on many platforms, like Windows, OSx, and Linux,
    without changing even a single line of code, while other programming languages
    can only be used on certain platforms. For example C++ is run on the Xbox and
    Windows, primarily. The fact that Java can run on many platforms is its power.
    How is it possible?


    Before explaining the answer to the above question, let me ask a few questions.
    Do you like pepperoni pizza? Do you ask your mother to prepare your favorite apple
    pie or cornbread? After having your delicious lunch or dinner, have you ever thought
    what was happening to that pizza, the pie, or the cornbread you ate?


    In fact, we all have a very complex digestive system that turns the food we eat
    into nutrients that the body can easily absorb. Whether you eat a piece of apple
    pie or a piece of pizza, your digestive system digests the food by breaking it
    down.


    Java code, also known as source code, gets converted into another language called
    “ByteCode.” The process of converting source code into ByteCode is known as “compilation.”


    A virtual machine called “Java Virtual Machine” or “JVM” interprets the byte code
    so that it can work. The responsibility of JVM is translating the byte code into
    instructions that the underlying system understands.


    ## Setup the Environment


    In this section, I am going to help you set up the environment that you need to
    write your Java code and also check whether your code works correctly. You need
    to download and install a couple of software applications to set up the environment.


    Java’s environment is much like your room. It is set up a certain way, so that
    you feel at home, and so that you can work privately without distractions and
    other problems. Similarly, Java also needs a proper environment to work in, which
    we are going to set up.


    We are going to use “Notepad++.” It is a free text editor that you can get from
    the Internet.

