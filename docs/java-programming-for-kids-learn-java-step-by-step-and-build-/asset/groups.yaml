    # 少儿童 Java 编程


    ## 前言


    准备好学习 Java 编程了吗？Java 是一种非常强大的语言，同时它设计得非常易学。Java 如此优秀有很多原因。它是一门完全免费的语言。它是平台无关的，你几分钟内就能理解这一点。最重要的是，Java
    无处不在，在你的手机上、电脑上以及你每天周围的其它设备上。


    只有当我们能够应用所学的知识时，学习才算完成。在编程领域，当你将知识转化为一个应用程序时，你的学习就取得了成功。


    你可能至少使用过一次电脑上的计算器应用程序。那么自己创建一个计算器呢？你将开发一个酷酷的计算器，它不仅能进行基础数学计算，还能根据你的回答向你提问并与你互动。所以你可以你可以自己设计的计算器来帮助学习数学并增加一些乐趣。


    在本教程结束时，你将：


    1. 理解 Java 程序是如何处理的。

    2. 设置基本的 Java 开发环境并开始开发应用程序。

    3. 学习如何设置 PATH 变量使程序运行更快。

    4. 理解什么是变量以及如何使用它们。

    5. 学习使用 Java 进行数学运算。

    6. 理解如何使用条件语句来决定执行流。

    7. 理解如何通过方法让你的程序具有可重用性和结构化。

    8. 学习如何从用户那里收集输入。

    9. 创建多个 Java 程序。

    10. 开发一个酷酷的会话式计算器。


    如果你不能立即理解所说的一切也没关系，这正是本书的主题！所以，让我们开始吧……


