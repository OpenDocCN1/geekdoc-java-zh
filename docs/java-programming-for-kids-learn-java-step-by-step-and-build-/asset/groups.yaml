    \n# 少儿童 Java 编程\n\n# 条件语句\n\n在本节中，我将解释如何使用条件语句来决定执行流。条件语句在这里可以帮助我们。老师之前可能告诉过大家：“如果你没交作业，就会得到零分，但如果你交了，你就很好。”让我换一种方式重新排列这句话：\n\
