- md: "\n# Java Programming For Kids\n\n![](img/edb351e9cc5e07690c74c646d62b2751_44_0.png)\n\
    \nWhy? The reason is that you are trying to access two variables, firstNum and\
    \ secondNum, at a place where it does not have scope. Those variables have scope\
    \ only until the sum is displayed. After that, those two variables are destroyed.\
    \ If you see the detail of the error, you could find that the compiler cannot\
    \ find symbols firstNum and secondNum.\n\nIf you want to get the correct output,\
    \ remove the opening curly brace just above the comment //declare two integer\
    \ variables and also the closing curly brace before the comment //calculates the\
    \ product. Now try, and you will get the output for sure.\n\nIn this section,\
    \ we deussed what variables are, different types of variables, and the scope of\
    \ a variable. We have also seen why Java is called a strongly typed language.\n\
    \n# Chandler Thompson\n\n# Java Math and Operators\n\nIn this section, I am going\
    \ to explain to you how to do math operations using Java. It is as simple as the\
    \ math you learn in school. Our calculator has two parts, mathematic calculations\
    \ and simple interaction.\n\nTo perform mathematic calculations, we use the operators\
    \ +, -, /, *, x, and =. We also use these symbols in Java. As in mathematics,\
    \ an operator is a symbol that represents an operation, and there should be at\
    \ least one operand to perform an operation.\n\nThe operators +, -, *, /, %, ++\
    \ and -- are known as “arithmetic operators.”\n\n- + is for addition\n- - is for\
    \ subtraction\n- * is for multiplication\n- / is for division\n- % is to get the\
    \ remainder after division\n- ++ is to increase the value by 1. ++ is called increment\
    \ operator.\n- -- is to decrease the value by 1. -- is called decrement operator.\n\
    \nThe following application performs some basic mathematical calculations using\
    \ arithmetic operators. You will add two numbers, subtract one number from another\
    \ number, multiply two numbers, divide one number by another to calculate the\
    \ quotient and the remainder, add 1 to a number and finally subtract 1 from a\
    \ number.\n\n# Java Programming For Kids\n\n// Program that performs mathematical\
    \ calculations\n\n```\npublic class MathCalculations\n{\n    // The entry point\n\
    \    public static void main(String[] args)\n    {\n        // declare two integer\
    \ variables\n        int firstNum = 35;\n        int secondNum = 27;\n       \
    \ // addition\n        int sum = firstNum + secondNum;\n        // subtraction\n\
    \        int difference = firstNum - secondNum;\n        // multiplication\n \
    \       int product = firstNum * secondNum;\n        // division\n        int\
    \ quotient = firstNum / secondNum;\n        // remainder\n        int remainder\
    \ = firstNum % secondNum;\n    }\n}\n```\n\n# Chandler Thompson\n\n// displays\
    \ the results\n\n```\nSystem.out.println(\"The sum of \" + firstNum + \" and \"\
    \ + secondNum + \" is \" + sum + \".\");\n```\n\n```\nSystem.out.println(\"You\
    \ will get \" + difference + \" if you subtract \" + secondNum + \" from \" +\
    \ firstNum + \".\");\n```\n\n```\nSystem.out.println(\"The product of \" + firstNum\
    \ + \" and \" + secondNum + \" is \" + product + \".\");\n```\n\n```\nSystem.out.println(\"\
    The quotient of \" + firstNum + \" / \" + secondNum + \" is \" + quotient);\n\
    ```\n\n```\nSystem.out.println(\"The remainder of \" + firstNum + \" / \" + secondNum\
    \ + \" is \" + remainder);\n```\n\n```\nSystem.out.println(\"Add 1 to \" + firstNum\
    \ + \" (increment) to get \" + (++firstNum) + \".\");\n```\n\n```\nSystem.out.println(\"\
    Subtract 1 from \" + secondNum + \" (decrement) to get \" + (--secondNum) + \"\
    .\");\n```\n\nYou will get the correct output for sum, difference, product, quotient,\
    \ remainder, increase by one, and decrease by one. You will use the arithmetic\
    \ operators +, -, *, /, %, ++ and -- respectively to do this. I am sure you know\
    \ how to add two numbers, subtract one number from another, multiply two numbers,\
    \ add 1 to a number, and subtract 1 from a number. It is easy for you. Isn't it?\
    \ \n\nHowever, do you have any doubts when it comes to division? How will you\
    \ divide 35 by 27? Take a piece of paper and a pen. Divide 35 by 27. Hey, don't\
    \ check the answer now. Once you complete, check whether both of us have got the\
    \ same answer. OK?\n\nHere is my answer.\n\n![](img/edb351e9cc5e07690c74c646d62b2751_48_0.png)\n\
    \nHere 35 is the dividend, 27 is the divisor, 1 is quotient and 8 is the remainder.\
    \ Didn't you get the same values for quotient and divisor when you run your program?\n\
    \nIn addition to arithmetic operators, there are some more types of operators\
    \ in Java.\n\nOne group is “relational operators” that are used to compare two\
    \ values. The relational operators include:\n\n- < (less than)\n- > (greater than)\n\
    - != (not equal to)\n- == (equal to)\n- <= (less than or equal to)\n- >= (greater\
    \ than or equal to)\n\nThere are also “logical operators” which are used to check\
    \ conditions:\n\n- && (AND)\n- || (OR)\n- ! (NOT)\n\nThere are also “assignment\
    \ operators,” “bitwise operators,” and “ternary operators.”\n\n# Java Programming\
    \ For Kids\n\n# Conditional Statements\n\nIn this section, I am going to explain\
    \ how to decide the flow of execution using conditional statements. Conditional\
    \ statements can help us here. Your teacher has probably told class before: “If\
    \ you didn’t turn in the assignment, you’ll get a zero, but if you did, you’re\
    \ fine.” Let me just arrange the same sentence in a different way:\n\nIf (you\
    \ didn’t turn in the assignment) Then you’ll get a zero But if you did Then you’re\
    \ fine\n\nI did not change your teacher’s statement at all. Did I? I included\
    \ the section “you didn’t turn in assignment” within parentheses. Correct? Now\
    \ what is that within the parentheses? It is the condition which will be either\
    \ satisfied or not. If that condition is satisfied, the first thing will happen.\
    \ Otherwise, the second thing will happen. \n\nThe syntax of a conditional statement\
    \ is as follows:\n\n```\nif (condition1)\n{\n    statements that are to be executed\
    \ if condition1 is satisfied\n}\nelse\n{\n    statements that are to be executed\
    \ if condition1 is not satisfied\n}\n```\n\nHere the condition1 will return either\
    \ true or false. Let's try an example as always. This program will compare two\
    \ numbers and display a message telling us whether the two numbers are same or\
    \ not.\n\n```\n// Example that illustrates simple if-else\npublic class Conditions\n\
    {\n    //The entry point\n    public static void main(String[] args)\n    {\n\
    \      // declare two integer variables\n      int firstNum = 17;\n      int secondNum\
    \ = 17;\n\n      // Checking for the condition whether first number and second\
    \ number are the same\n      if(firstNum == secondNum) {\n        // statement\
    \ to be executed if the condition is satisfied\n        System.out.println(\"\
    The first number \" + firstNum + \" is equal to the second number \" + secondNum);\n\
    \      } \n      // otherwise\n      else {\n        // statement to be executed\
    \ if the condition is not satisfied\n        System.out.println(\"The first number\
    \ \" + firstNum + \" is not equal to the second number \" + secondNum);\n    \
    \  }\n    }\n}\n```\n"
  mdcn: "\n\n# 少儿童 Java 编程\n\n![](img/edb351e9cc5e07690c74c646d62b2751_44_0.png)\n\
    \n为什么呢？原因是你正试图在一个没有作用范围的地方访问两个变量：`firstNum` 和 `secondNum`。这些变量的作用范围仅持续到显示和为止。此之后，这两个变量就会被销毁。如果你查看错误详情，你会发现编译器找不到符号\
    \ `firstNum` 和 `secondNum`。\n\n如果你想获得正确的输出，请删除注释 //declare two integer variables（声明两个整数变量）正上方的左大括号，以及删除注释\
    \ //calculates the product（计算乘积）正之前的右大括号。现在试一下，你一定能得到输出。\n\n在这一节中，我们讨论了什么是变量、不同类型的变量以及变量的作用范围。我们还了解了为什么\
    \ Java 被称为强类型语言。\n\n# Chandler Thompson\n\n# Java 数学与运算符\n\n在本节中，我将向你解释如何使用 Java\
    \ 进行数学运算。这和你在学校学的数学一样简单。我们的计算器有两个部分：数学计算和简单交互。\n\n要执行数学计算，我们使用运算符 `+`、`-`、`/`、`*`\
    \ 和 `=`。我们在 Java 中也使用这些符号。就像在数学中一样，运算符是表示操作的符号，并且至少有一个操作数来执行操作。\n\n运算符 `+`、`-`、`*`、`/`、`%`、`++`\
    \ 和 `--` 被称为“算术运算符”。\n\n- `+` 用于加法\n- `-` 用于减法\n- `*` 用于乘法\n- `/` 用于除法\n- `%`\
    \ 用于获取余数\n- `++` 将值加1。称为增运算符\n- `--` 将值减1。称为减运算符\n\n以下程序使用算术运算符执行了一些基础数学计算。你将两个数字相加、从一个数字中减去另一个、两个数字相乘、将一个数字除以另一个以计算商和余数、给一个数字加\
    \ 1，最后从一个数字中减 1。\n\n# 少儿童 Java 编程\n\n// 执行数学计算的程序\n\n```\npublic class MathCalculations\n\
    {\n    // 入口点\n    public static void main(String[] args)\n    {\n        // 声明两个整数变量\n\
    \        int firstNum = 35;\n        int secondNum = 27;\n        // 加法\n    \
    \    int sum = firstNum + secondNum;\n        // 减法\n        int difference =\
    \ firstNum - secondNum;\n        // 乘法\n        int product = firstNum * secondNum;\n\
    \        // 除法\n        int quotient = firstNum / secondNum;\n        // 余数\n\
    \        int remainder = firstNum % secondNum;\n    }\n}\n```\n\n# Chandler Thompson\n\
    \n// 显示结果\n\n```\nSystem.out.println(\"The sum of \" + firstNum + \" and \" +\
    \ secondNum + \" is \" + sum + \".\");\n```\n\n```\nSystem.out.println(\"You will\
    \ get \" + difference + \" if you subtract \" + secondNum + \" from \" + firstNum\
    \ + \".\");\n```\n\n```\nSystem.out.println(\"The product of \" + firstNum + \"\
    \ and \" + secondNum + \" is \" + product + \".\");\n```\n\n```\nSystem.out.println(\"\
    The quotient of \" + firstNum + \" / \" + secondNum + \" is \" + quotient);\n\
    ```\n\n```\nSystem.out.println(\"The remainder of \" + firstNum + \" / \" + secondNum\
    \ + \" is \" + remainder);\n```\n\n```\nSystem.out.println(\"Add 1 to \" + firstNum\
    \ + \" (increment) to get \" + (++firstNum) + \".\");\n```\n\n```\nSystem.out.println(\"\
    Subtract 1 from \" + secondNum + \" (decrement) to get \" + (--secondNum) + \"\
    .\");\n```\n\n你将获得和、差、乘积、商、余数、加一和减一的正确输出。你将分别使用算术运算符 `+`、`-`、`*`、`/`、`%`、`++`\
