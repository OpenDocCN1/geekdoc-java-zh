    Do not worry about seeing these strange lines of code. It is very simple.


    Every programming language has a set of rules referred to as “syntax.” Syntax
    defines how the code should be presented so that the compiler can understand it
    and translate it into ByteCode in the case of Java. To make it simple, think of
    syntax as the grammar of English.


    Computers are just machines that work based on instructions. If your instructions
    are wrong, the computer will not understand what it is expected to do. When you
    write Java code, make sure that your syntax is correct. Otherwise, you will get
    errors when you try to run your application and will not get the expected result.
    If you already know C, C++, or PHP, you might find that the Java syntax is very
    similar to theirs.


    In English, how do you find the end of a sentence? It is with a full stop (.).
    Every statement in the Java language ends with a semicolon (;) as at the end of
    the line

    “System.out.println("Hello World!!!");” Semicolon tells the program that it has
    finished one instruction.


    Next, you could see three lines of code that start with // (two forward slashes).
    What are they? They are just comments that describe the code. In other words,
    they are just for the programmer to understand what he or she is telling the computer
    to do, but the computer completely ignores them. You might now be having a question
    in your mind, “Why should I waste time adding comments? I am developing the'
