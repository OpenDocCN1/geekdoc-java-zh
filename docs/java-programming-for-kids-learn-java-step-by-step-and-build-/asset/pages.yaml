    # Conditional Statements


    In this section, I am going to explain how to decide the flow of execution in
    Java using “conditional statements.” The calculator we are planning to develop
    needs to perform different calculations. For example, if the user wants to add
    two numbers, it should add. If the user wants to multiply two numbers, it should
    do so. If the user does not want to perform any mathematical calculations, but
    just interact with the calculator and have fun, then that also should be possible.
    We need to perform different things based on different conditions. Conditional
    statements can help us here.


    Your teacher has probably told your class this before: “If you didn’t turn in
    the assignment, you’ll get a zero, but if you did, you’re fine.” Let me just arrange
    the same sentence in a different way.


    If (you didn’t turn in the assignment)


    Then you’ll get a zero


    But if you did Then you’re fine


