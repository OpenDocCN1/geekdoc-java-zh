    “you didn’t turn in the assignment” within parentheses. Correct? Now what is that
    within the parentheses? It is the condition which will be either satisfied or
    not satisfied. If that condition is satisfied, the first thing will happen. Otherwise,
    the second thing will happen, not the first one. Is it clear? We are using similar
    syntax for checking conditions in Java with a few changes.'
