    # Setup the Environment


    In this section, I am going to help you set up the environment that you need to
    write your Java code and also to check whether your code works correctly. You
    need to download and install a couple of software applications to set up the environment.


    Java’s environment is much like your room. It is set up a certain way, so that
    you feel at home, and so that you can work privately without distractions and
    other problems.


    Similarly, Java also needs a proper environment to work in, which we are going
    to set up it. Don''t worry, I will explain to you how to do it step by step. Let’s
    make the process simple and set up a basic development environment. Now you might
    be having doubts. Is there a complex development environment available then? Yes,
    I will tell you at the end of this tutorial how to setup the other environment.
    Until you become comfortable with Java coding, we will work on the basic or simple
    development environment.


    As we proceed, you are going to download and install a few software applications.
    It is not at all a complex process. Still, if you are not comfortable with installing
    software applications, get help from someone who is. We need the following software
    programs to develop and run our Java applications:


    +   1. A simple and powerful text editor to write our Java code.


    +   2. Java Development Kit (JDK).


    We are going to use “Notepad++.” It is a free text editor that you can get from
    the Internet. You can think of Notepad++'
