    # Java Math and Operators


    In this section, I am going to explain to you how to do math operations using
    Java. It is as simple as the math you learn in school. Our calculator has two
    parts, mathematic calculations and simple interaction.


    To perform mathematic calculations, we use the operators +,-, /,x, and =. We also
    use these symbols in Java. As in mathematics, an operator is a symbol that represents
    an operation, and there should be at least one operand to perform an operation.


    The operators +, -, *, /, %, ++ and -- are known as “arithmetic operators.”


    +   + is for addition

    - is for subtraction

    - is for multiplication

    - / is for division

    - % is to get the remainder after division

    - ++ is to increase the value by 1. ++ is called increment operator.

    - is to decrease the value by 1. -- is called decrement operator.


    The following application performs some basic mathematical calculations using
    arithmetic operators. You will add two numbers, subtract one number from another
    number, multiply two numbers, divide one number by another to calculate the quotient
    and the remainder, add 1 to a number and finally subtract 1 from a number.'
