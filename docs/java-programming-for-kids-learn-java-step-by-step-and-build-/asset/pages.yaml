    program and I know what the purpose of each line of code is.” That is true when
    you do something for learning purposes or when you develop a very simple program
    like this HelloWorld program. However, do you really want to be a software developer
    or programmer? If so, you won''t be developing simple applications with a few
    lines of code. You might be working in a team where you will develop a part of
    a software application, or you will be maintaining an application developed by
    others. Will you be able to understand other codes if they have not added proper
    comments, or will others be able to understand your code? No, because there are
    a thousand ways to solve one problem, and their way of solving it will likely
    be different from your way. You should get into the practice of adding comments
    whenever and wherever you can.


    The first comment announces that this is our first Java program. If your comment
    is a single line comment, then you can add the comment just after two forward
    slashes. If you have a very lengthy comment that spans more than one line, you
    can enclose it within /* and */. There is no need to put two forward slashes at
    the start of each comment line if your comment is really lengthy.


    Example:


    ```

    //This is a single line comment.


    /*This is a very lengthy comment.


    I am doing a number of complex tasks.


    So, I am adding comment like this. */

    ```


    The multi-line comment also helps when you have a bunch of code that you don''t
    want to run just yet, but also don''t want'
