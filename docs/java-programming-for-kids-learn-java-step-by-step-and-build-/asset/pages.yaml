  md: '# Chandler Thompson


    to delete. You can just comment it out, and the computer will ignore it.


    After the first comment, what do you see? A line of code: “public class HelloWorld.”
    Are these new terms for you? I am going to introduce you to the term “class.”
    What is a class? A class is a template or blueprint from which we can create objects.
    You can consider an object as a real world thing. A car is an object, an apple
    is another object, a bicycle is some other object.


    Every object is built from a class. If you consider shape as a class, then triangle,
    square, rectangle and other shapes can be considered as objects of the type shape.
    If you consider vehicle as a class, then car, bus, and bicycle are some objects
    of vehicle class. A vehicle will have certain characteristics. These characteristics
    are the properties of the class. Some of the properties of a class could be number
    of sides, the area, and the perimeter. For now, just understand that each class
    can have a number of properties and methods.


    You have learned a very important concept known as “object oriented programming.”
    Object oriented programming is a kind of programming in which objects are used
    to create applications. As you proceed, you will find that everything in Java
    is based on classes and objects.


    You now understand what a class is, but you might have noticed the term “public”
    just before the word “class.” For the time being, just understand that the word
    “public” makes our class accessible to other classes. This will be explained in
    detail the chapter Methods. This section is just to familiarize you with a simple
    Hello World program.


    Every Java application must have at least one public class. You need to create
    a class with a special word or “keyword” class. In our program, the name of our
    class is HelloWorld.'
