  md: '# Java Programming For Kids


    # Conclusion


    Now you have learned a number of Java concepts. You have seen how a Java program
    is processed using java compiler and Java Virtual Machine. You also have set up
    the basic development environment by installing Notepad++ and JDK. You understand
    what object oriented programming is. You have also learned about variables, methods,
    operators, and the Scanner class. Above all, you have developed a cool and wonderful
    Talking Calculator on your own.


    Do you remember that I promised to help you in setting up a complex development
    environment? With the basic setup we have, we need to go to the command prompt
    every time to compile and run our Java programs. However, if you want to make
    the whole process of development and execution a lot easier, you can install any
    of the popular Integrated Development Environments. If you want to, you can get
    NetBeans or Eclipse from the Internet and install it. The procedure you need to
    follow is almost the same. Try it if you want.


    You have learned the basics of Java, and the equivalent to a college programming
    class! Now you are in a position to understand advanced Java material on your
    own. Try to learn more and develop wonderful Java applications. I wish you luck
    for all your future Java learning endeavors!!!


    Chandler'
