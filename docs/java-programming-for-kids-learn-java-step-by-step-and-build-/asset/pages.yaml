    in order to execute or run your programs easily and quickly. You might know how
    to save a number into your phone so that do not have to enter the phone number
    every time to call that person. You just need to click the name. Here, by setting
    a variable called “PATH,” we do not have to specify a lengthy path every time
    while running your Java program. In other words, we will be able to run our Java
    programs easily and quickly if we set the PATH variable.


