  md: '# Java Programming For Kids


    # Introduction


    Are you ready to learn Java programming? Java is a very powerful language that
    at the same time was made to be very easy to learn. There are many reasons why
    Java is so great. It is an absolutely FREE language. It is platform independent,
    which you will understand in a couple of minutes. Most importantly, Java is everywhere,
    on your phone, on your computer, and on other devices that are around you every
    day.


    The learning becomes complete only when we are able to apply what we have learned.
    In the case of programming, your learning becomes a success when you make an application
    out of your knowledge.


    You might have used the calculator application available on your computer at least
    once. What about creating a calculator on your own? You are going to develop a
    cool calculator that will not only do basic mathematical calculations, but also
    ask you questions and interact with you based your answers. So, you can use the
    calculator you design to help you in math and also to have some fun.


    By the end of this tutorial, you will;


    +   1. Understand how a Java program is processed.

    2. Set up the basic Java development environment and start developing applications.

    3. Learn how to set the PATH variable to make the program execution faster.

    4. Understand what variables are and how to use them.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '+   5. Learn to do math using Java.


    +   6. Understand how to use conditional statements to decide the flow of execution.


    +   7. Understand how to make your programs reusable and structured with the help
    of methods.


    +   8. Learn how to collect inputs from the user.


    +   9. Create a number of Java programs.


    +   10. Develop a cool Talking Calculator.


    It''s alright if you don''t understand all of what was said right away, that''s
    what this book is about! So, let''s get started...'
