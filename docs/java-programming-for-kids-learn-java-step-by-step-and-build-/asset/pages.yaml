  md: '# Java Programming For Kids


    # Java Program Processing


    In this section, I am going to explain to you simply how a Java program is processed.
    We said that Java is “platform independent.” What does that mean? It means that
    the same Java program can run on many platforms, like Windows, OSx, and Linux,
    without changing even a single line of code, while other programming languages
    can only be used on certain platforms. For example C++ is run on the Xbox and
    Windows, primarily. The fact that Java can run on many platforms its power. How
    is it possible?


    Before explaining the answer to the above question, let me ask a few questions.
    Do you like pepperoni pizza? Do you ask your mother to prepare your favorite apple
    pie or cornbread? After having your delicious lunch or dinner, have you ever thought
    what was happening to that pizza, the pie, or the cornbread you ate?


    In fact, we all have a very complex digestive system that turns the food we eat
    into nutrients that the body can easily absorb. Whether you eat a piece of apple
    pie or a piece of pizza, your digestive system digests the food by breaking it
    down into nutrients. Finally, our small intestine absorbs the nutrients so that
    you will have the energy to play outside, do sports, and play video games (even
    though you wouldn''t think that takes up much energy.) Similar actions are happening
    in the case of Java as well.


    The operating system of your computer might or might not be the same as that of
    your friend. You might be using a computer with Windows operating system, while
    your friend might be using a computer with Mac operating system.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Java code, also known as source code, that you write using your Windows computer
    or Mac computer gets converted to another language known as “ByteCode.” Just like
    the food we eat, whether pepperoni pizza or apple pie, ByteCode turns into nutrients
    for the body to absorb.


    The process of converting source code into ByteCode is known as “compilation.”
    This is similar to the digestion process where food gets turned into nutrients.
    Regardless of the operating system upon which the source code exists, the ByteCode
    will be the same for the program no matter which operating system you run it on,
    just like the nutrients will be the same after digestion whether you eat apple
    pie, a double bacon cheeseburger, or drink milk.


    The nutrients get absorbed into your body through the small intestine. Similarly,
    a virtual machine called “Java Virtual Machine” or “JVM” interprets the byte code
    to your computer so that your Java code is ready to work. The responsibility of
    JVM is translating the byte code into instructions that the underlying operating
    system understands.


    See the image below that explains the processing of a Java program.'
