    `objectOutputFile.writeObject(r);`\n\n## 短答 (Short Answer)\n\n1. 异常对象是为了响应发生的错误而创建的。\n\
    \n*Gaddis: Starting Out with Java: From Control Structures through Data Structures,\
    \ 2/e © 2012 Pearson Education* 4\n2. 程序拦截并响应异常。\n3. 控制权传递给调用栈中的上方法（即调用异常的方法）。如果该方法无法处理异常，控制权再次向上调用栈传递给上一个方法。直到到达\
    \ `main` 方法。如果 `main` 方法没有处理异常，程序将停止并由默认异常处理器处理。\n4. `finally` 语句的块在 `try` 块执行后执行，如果抛出了异常，则在任何\
    \ `catch` 块执行后执行。`finally` 块中的语句无论是否发生异常都会执行。\n5. `try/catch` 构造之后的语句。\n6. 是。当同一个\
    \ `try` 语句中处理多个异常且某些异常之间通过继承相关联时，你应该在通用异常类之前处理具体的异常类。否则，旨在捕捉通用异常的 `catch` 语句可能会通过多态捕捉更具体的异常。\n\
    7. 任何继承自 `Throwable` 类的对象。\n8. 当方法代码可能抛出检查异常且方法未处理时，该方法必须有一个 `throws` 子句。\n9.\
    \ 未检查异常是继承自 `Error` 类或 `RuntimeException` 类的异常。你不应该处理这些异常，因为导致它们的情况很难在程序内部处理。所有异常（即未继承自\
    \ `Error` 或 `RuntimeException` 的异常）都是*检查*异常。这些是你应该在程序中处理的异常。\n10. `throw` 语句导致异常的抛出。`throws`\
    \ 子句告知编译器方法抛出了异常 11. 文本文件中存储的所有数据都以文本格式化。即使是数值数据在存储到文本文件中也会被转换为文本。你可以通过文本编辑器（如记事本）查看存储在文本中的数据。在二进制文件中，数据不是以文本格式化的。因此，你无法用文本编辑器查看二进制文件的内容。\n\
    12. 使用顺序访问时，当打开文件输入时，其读取位置位于文件开头。这意味着第一次从文件中读取数据时，数据将从开始读取。随着读取的继续，文件的读取位置顺序通过文件内容。在随机文件访问中，程序可以立即跳转到文件的任何位置，而无需先读取之前的字节。顺序访问和随机文件访问的区别就像磁带和光盘的区别。在听\
    \ CD 时，不需要听或快进过不需要的歌曲。你只需跳转到你想听的曲目即可。\n13. 当对象被序列化时，它被转换为一系列字节并写入文件。当对象被反序列化时，这些字节被转换回对象。\n\
