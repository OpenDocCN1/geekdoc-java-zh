  trans: "\n在多线程*.**。`StringBuilder` 类不是同步的，因此它避免了同步开销，当已知程序永远不会使用线程时，应该使用它。\n\n***Java\
    \ 入门教程：从控制结构到数据结构***\n\n# 复习题答案\n\n## 第 21 章\n\n### 单选题与判断题\n1. b\n2. a\n3. b\n\
    4. a\n5. c\n6. b\n7. 错误\n8. 错误\n9. 错误\n10. 错误\n\n### 找错\n1. 执行流从未到达 `top --;`\
    \ 语句。\n2. 使用 `rear.next = new Node(x);` 向非空队列添加元素。\n3. `pop` 忘记了从栈中移除该值。\n4. 运算符\
    \ `++` 不能应用于引用。使用 `front = front.next;`。\n5. `dequeue` 应该从头部删除，而不是尾部。此外，当索引到达末尾时，应该循环回到数组开头。\n\
    \n### 算法工作台\n1.\n```java\nstatic boolean palindrome(String s)\n{\n    Stack<Character>\
    \ stack = new Stack<Character>();\n    // 将字符串的拷贝推入栈中\n    for(int k = 0; k <\
    \ s.length(); k++)\n        stack.push(s.charAt(k));\n    // 使用栈比较这两个拷贝\n    for\
    \ (int k = 0; k < s.length(); k++)\n    {\n        if (s.charAt(k) != stack.pop())\n\
    \            return false;\n    }\n    // 发现任何差异，所以 s 是回文，返回 true;\n}\n```\n\n\
    2.\n```java\nclass MyStack\n{\n    private int [] s;\n    private int top = -1;\n\
    \n    public MyStack(int capacity)\n    {\n        s = new int[capacity];\n  \
    \  }\n\n    public int pop()\n    {\n        if (empty())\n            throw new\
    \ RuntimeException(\"Stack Empty\"); top --;\n        return s[top+1];\n    }\n\
    \n    public void push(int x)\n    {\n        if (top == s.length-1)\n       \
    \     throw new RuntimeException(\"Stack Overflow\"); top ++;\n        s[top]\
    \ = x;\n    }\n\n    public boolean empty()\n    {\n        return top == -1;\n\
    \    }\n}\n```\n\n3. 要向队列添加 `x`，将 `x` 推入第一个栈。要从队列中移除一个元素，从第一个栈中弹出所有元素并将其存储在第二个栈中，然后从第二个栈的顶部弹出元素并保存以便返回。将第二个栈中的所有元素重新推回第一个栈。返回保存的元素。\n\
    \n### 简答\n1. 一个栈\n2. 一个队列\n3. 一个栈\n4. 它会抛出一个异常。\n5. 为了便于垃圾收集。\n6. 在移除最后一个元素时，指向队列最后一个元素的引用没有帮助。你需要从列表头部开始一直遍历到列表末尾，以获取最后一个元素的前驱节点，这样才能删除它。\n\
    \n***Java 入门教程：从控制结构到数据结构***\n\n# 复习题答案\n\n## 第 22 章\n\n### 单选题与判断题\n1. d\n2.\
    \ a\n3. c\n4. a\n5. c\n6. b\n7. a\n8. d\n9. b\n10. a\n11. 错误\n12. 正\n13. 正\n14.\
    \ 错误\n15. 正\n16. 错误\n17. 正\n18. 正\n19. 错误\n20. 正\n21. 错误\n\n### 找错\n1. 函数没有使用递归调用的返回值。应该是：`if\
    \ (tree!= null) return NodeCount(tree.left)+ NodeCount(tree.right)+1; else return\
    \ 0;`\n2. 递归调的结果需要接回树中：`if (value < tree.value) { tree.left = add(tree.left, value);\
    \ return tree; } else { tree.right = add(tree.right, value); return tree; }`\n\
    3. 如果 `tree` 为空，代码将失败。\n\n### 简答\n1. 它保持了树的高度较浅，使得从根到叶子遍历树路径的算法更高效。\n2. `root`（根）。\n\
    3. 从根到叶子的最长路径的长度。\n4. 优先级队列的顺序决定了元素移除的顺序。\n5. 一种存储来自有序集合元素的集合，并根据该顺序移除元素，其中顺序最小的元素最先移除。\n\
    6. 因为树是平衡的，每当你向下移动一层，剩余的节点就少于一半。这意味着节点数不会超过 `log n + 1` 个。\n7. AVL 树必须满足平衡条件：任何节点的两个子树的高度差最多为\
    \ 1。\n\n### 算法工作台\n1. \n```java\nNode preorder(Node bTree)\n{\n    if (tree !=\
    \ null)\n    {\n        System.out.print(bTree.value + \" \");\n        preorder(bTree.left);\n\
    \        preorder(bTree.right);\n    }\n}\n```\n2.\n```java\nNode postorder(Node\
    \ bTree)\n{\n    if (tree != null)\n    {\n        postorder(bTree.left);\n  \
    \      postorder(bTree.right);\n        System.out.print(bTree.value + \" \");\n\
    \    }\n}\n```\n3.\n```java\nint treeSize(Node bTree) \n{\n    if (bTree == null)\n\
    \    return 0;\n    else\n    return treeSize(bTree.left) + treeSize(bTree.right)\
    \ + 1;\n}\n```\n4.\n```java\nint leafCount(Node btree) \n{\n    if (btree == null)\n\
    \    return 0;\n    if (btree.left == null && btree.right == null) return 1;\n\
    \    else\n    return leafCount(btree.left) + leafCount(btree.right);\n}\n```\n\
    5.\n```java\nboolean contains(Node btree, int x) \n{ \n    if (btree == null)\n\
    \    return false;\n    if (btree.value == x)\n    return true;\n    if (contains(btree.left,\
    \ x))\n        return true;\n    if (contains(btree.right, x))\n        return\
    \ true;\n    else\n    return false;\n}\n```\n6.\n```java\nstatic class DecOrder\
    \ implements Comparator<Integer>\n{\n    public int compare(Integer x, Integer\
    \ y)\n    {\n        return y.compareTo(x);\n    }\n}\nint capacity = 10;\nDecOrder\
    \ c = new DecOrder();\nPriorityQueue<Integer> pQueue = new PriorityQueue<Integer>(capacity,\
    \ c);\n```\n7.\n```java\nstatic class DecOrder implements Comparator<String>\n\
    {\n    public int compare(String x, String y)\n    {\n        if (x.length() ==\
    \ y.length())\n        return x.compareTo(y);\n        else\n        return x.length()\
    \ - y.length();\n    }\n}\n```\n\n# 文档目录\n- 第 1 章复习答案\n- 第 2 章复习答案\n- 第 3 章复习答案\n\
