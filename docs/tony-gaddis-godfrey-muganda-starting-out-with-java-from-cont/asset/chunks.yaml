  trans: "\n\n单选按钮通常用于在多个可能的项目中选择一个。由于单选按钮之间通常存在互斥关系，因此只能选择其中一个项目。复选框可以单独出现也可以一组出现，允许用户进行“是/否”或“开启/关闭”的选择。由于复选框之间通常不存在互斥关系，当它们一组出现时，用户可以选择其中任意数量。\n\
    \n## 4.\n\n通过创建一个派自 `JPanel` 的类。\n\n*Gaddis: Starting Out with Java: From Control\
    \ Structures through Data Structures, 2/e © 2012 Pearson Education* 1\n\n## 复习题答案\n\
    \n### 第 8 章\n\n### 单选题与判断题\n1. b\n2. a\n3. b\n4. d\n5. c\n6. c\n7. b\n8. a\n9.\
    \ c\n10. a\n11. a\n12. True\n13. False\n14. True\n15. True\n16. True\n17. True\n\
    18. True\n19. False\n20. True\n21. True\n\n### 找错\n1. 大小声明符不能为负。\n2. 初始化列表必须包含在大括号中。\n\
    3. 循环使用了 1 到 10 作为下标。它应该使用 0 到 9。\n4. 对于数组，`length` 是一个字段。对于 `String`，`length`\
    \ 是一个方法。这段代码使用 `length` 的方式就像它在数组中是方法而在 `String` 中是字段。\n5. 单词应该使用下标，例如 `words[0].toUpperCase()`。\n\
    \n### 算法工作台\n1.\n```java\nfor (int i = 0; i < 20; i++)\n    System.out.println(names[i]);\n\
    ```\n2.\n```java\nfor (int i = 0; i < 100; i++)\n    numberArray2[i] = numberArray1[i];\n\
    ```\n3.\n*Gaddis: Starting Out with Java: From Control Structures through Data\
    \ Structures, 2/e © 2012 Pearson Education* 2\n\na)\n```java\nString[] scientists\
    \ = {\"Einstein\", \"Newton\", \"Copernicus\", \"Kepler\"};\n```\nb)\n```java\n\
    for (int i = 0; i < scientists.length; i++) \n    System.out.println(scientists[i]);\n\
    ```\nc)\n```java\nint total = 0;\nfor (int i = 0; i < scientists.length; i++)\
    \ \n    total += scientists[i].length();\nSystem.out.println(\"The total length\
    \ is \" + total);\n```\n4. a)\n```java\n// 定义数组。\nfinal int NUM_COUNTRIES = 12;\n\
    String[] countries = new String[NUM_COUNTRIES]; \nlong[] populations = new long[NUM_COUNTRIES];\n\
    ```\nb)\n```java\n// 显示它们内容。\nfor (int i = 0; i < NUM_COUNTRIES; i++) {\n    System.out.println(\"\
    The population of \" + countries[1] + \" is \" + populations[i]);\n}\n```\n5.\
    \ a)\n```java\n// 定义数组。\nint[] id = new int[10];\ndouble[] weeklyPay = new double[10];\n\
    ```\nb)\n```java\n// 显示每个员工的周总薪。\nfor (int i = 0; i < 10; i++) {\n    System.out.println(\"\
    The pay for employee \" + id[i] + \" is $\" + weeklyPay[i]);\n}\n```\n6.\n```java\n\
    final int NUM_ROWS = 30;\nfinal int NUM_COLS = 10;\nint[][] grades = new int[NUM_ROWS][NUM_COLS];\n\
    ```\n7.\n```java\nfinal int NUM_ROWS = 30;\nfinal int NUM_COLS = 10;\nint total\
    \ = 0;\ndouble average;\nfor (int row = 0; row < grades.length; row++) {\n   \
    \ for (int col = 0; col < grades[row].length; col++) {\n*Gaddis: Starting Out\
    \ with Java: From Control Structures through Data Structures, 2/e © 2012 Pearson\
    \ Education* 3\n        total += grades[row][col];\n    }\n}\naverage = (double)\
    \ total / (NUM_ROWS * NUM_COLS);\n```\n8. a)\n```java\nnumberArray[0][0] = 145;\n\
    ```\nb)\n```java\nnumberArray[8][10] = 18;\n```\n9.\n```java\ndouble total = 0.0;\
    \ // 累加器\n// 求数组值的和。\nfor (int row = 0; row < 10; row++) {\n    for (int col =\
    \ 0; col < 20; col++)\n        total += values[row][col];\n}\n```\n10. a) 求数组中每行的和：\n\
    ```java\nint total; // 累加器\n// 显示每行的和。\nfor (int row = 0; row < 29; row++) {\n\
    \    // 设置累加器。\n    total = 0;\n    // 求某行的和。\n    for (int col = 0; col < 5;\
    \ col++)\n        total += days[row][col];\n    // 显示该行的总和。\n    System.out.println(\"\
    The total for row \" + row + \" is \" + total);\n}\n```\n```java\n11. a)\n```java\n\
    // 创建数组。\nArrayList<String> cars = new ArrayList<>();\n```\nb)\n```java\n// 显示内容。\n\
    for (String car : cars)\n    System.out.println(car);\n```\nc)\n```java\n// 向\
    \ ArrayList 中添加元素。\ncars.add(\"Porsche\");\ncars.add(\"BMW\");\ncars.add(\"Jaguar\"\
    );\n```\nd)\n```java\n// 删除元素。\ncars.remove(0);\n```\n\n### 简答\n1. 访问非静态成员。\n\
    2. 它们可以根据需要从类直接调用。它们用于创建不需要收集数据的工具类。\n3. 当变量作为参数传递时，传递的是变量的内容。接收方法无法访问变量本身。当对象作为参数传递时，传递的是对象的引用（即对象的地址）。这允许接收方法访问该对象。\n\
    4. 默认的 equals 方法在所比较的两个对象的内存地址相同时返回 true。\n5. 这意味着存在聚合关系。当类 B 的对象是类 A 的成员时，可以说类\
    \ A “拥有”一个类 B。\n6. 程序将崩溃。\n7. 这是不建议的，因为它允许访问私有字段。这种情况的例外是字段是 `String` 对象。这是因为\
    \ `String` 对象是不可变的，意味着它们不能被更改。\n8. 关键字 this 是引用变量的名称，对象可以使用它引用自己。它在所有非静态方法中都可用。\n\
