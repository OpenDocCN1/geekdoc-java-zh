    编程风格指的是程序员使用空格、缩进、空行和标点字符在视觉上安排程序源代码的方式。不一致的编程风格会给阅读代码的人带来困惑。\n\n### 12.\n原因之一是对于人类读者来说，`PI`\
    \ 比数字 `3.14.` 更有意义。另一个原因是，每当常量表示的值需要更改时，我们只需要更改常量的初始化值。我们不需要在程序中搜索使用该值的每个语句。\n\
    \n### 13.\n`javadoc SalesAverage.java`\n\n### 14.\n结果将是一个 `int`。\n\n*Gaddis: Starting\
