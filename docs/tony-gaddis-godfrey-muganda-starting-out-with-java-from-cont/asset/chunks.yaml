    \ rear. Also, the index should wrap to the beginning of the array when it gets\
    \ to the end.\n\n### Algorithm Workbench\n1.\n```java\nstatic boolean palindrome(String\
    \ s)\n{\n    Stack<Character> stack = new Stack<Character>();\n    // Push a copy\
    \ of the string onto the stack\n    for(int k = 0; k < s.length(); k++)\n    \
    \    stack.push(s.charAt(k));\n    // Compare the two copies using the stack\n\
    \    for (int k = 0; k < s.length(); k++)\n    {\n        if (s.charAt(k) != stack.pop())\n\
    \            return false;\n    }\n    // No discrepancy found, so s is a palindrome\
    \ return true;\n}\n```\n\n2.\n```java\nclass MyStack\n{\n    private int [] s;\n\
    \    private int top = -1;\n\n    public MyStack(int capacity)\n    {\n      \
    \  s = new int[capacity];\n    }\n\n    public int pop()\n    {\n        if (empty())\n\
    \            throw new RuntimeException(\"Stack Empty\"); top --;\n        return\
    \ s[top+1];\n    }\n\n    public void push(int x)\n    {\n        if (top == s.length-1)\n\
    \            throw new RuntimeException(\"Stack Overflow\"); top ++;\n       \
