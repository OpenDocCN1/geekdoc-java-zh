  trans: "\n`finally` 块必须出现在 `catch` 块之后。\n\n3.\n\n`catch (Exception e)` 语句及其块应该出现在其他\
    \ `catch` 块之后，因为这是一个更通用的异常。\n\n## 算法工作台 (Algorithm Workbench)\n\n1. B D\n2. B\n\
    \n*Gaddis: Starting Out with Java: From Control Structures through Data Structures,\
    \ 2/e © 2012 Pearson Education* 2\nD E\n3. \n```java\npublic static int arraySearch(int[]\
    \ array, int value) throws Exception\n{\n    int i; // 循环控制变量\n    int element;\
    \ // 找到元素的索引\n    boolean found; // 表示搜索结果的标志\n\n    // 元素 0 是搜索的起始点。\n    i =\
    \ 0;\n\n    // 存储默认值 element 和 found。\n    element = -1;\n    found = false;\n\
    \n    // 搜索数组。\n    while (!found && i < array.length)\n    {\n        if (array[i]\
    \ == value)\n        {\n            found = true;\n            element = i;\n\
    \        }\n        i++;\n    }\n\n    if (element == -1)\n        throw new Exception(\"\
    Element not found.\");\n    else\n    return element;\n}\n```\n4. `throw new IllegalArgumentException(\"\
    Argument cannot \" + \"be negative.\");`\n5. \n```java\npublic class NegativeNumber\
    \ extends Exception\n{\n    /**\n    无参数构造函数\n    */\n    public NegativeNumber()\n\
    \    {\n        super(\"Error: number\");\n    }\n\n    /**\n    以下构造函数接收引起异常的数字。\n\
    \    @param n 数字。\n    */\n    public NegativeNumber(int n)\n    {\n        super(\"\
    Error: number: \" + n);\n    }\n}\n```\n6. `throw new NegativeNumber();`\n或者\n\
    `throw new NegativeNumber(number);`\n7. `public int getValueFromFile() throws\
    \ IOException, FileNotFoundException`\n8. \n```java\ntry\n{\n    value = getValueFromFile();\n\
    }\ncatch (FileNotFoundException e)\n{\n    System.out.println(e.getMessage());\n\
    }\ncatch (IOException e)\n{\n    System.out.println(e.getMessage());\n}\n```\n\
    9. `FileOutputStream fstream = new FileOutputStream(\"Configuration.dat\");`\n\
    10. `RandomAccessFile randomFile = new RandomAccessFile(\"Customers.dat\", \"\
