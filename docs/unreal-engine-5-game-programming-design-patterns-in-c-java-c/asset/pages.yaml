  md: '# You Sunk My Battleship... Strategy Pattern


    The GoF defines the Strategy pattern as a “policy” (Gamma et.al, 1995). We would
    like to have a family of algorithms as be interchangeable and vary independently.
    This will become more clear with the following example.


    # The Good


    +   - Provides an alternative to subclassing (Gamma et.al, 1995).


    # The Not So Good


    +   - The numbers of object may increase unavoidably.


    # Strategy Pattern Implementation


    We have a strategy for combating different enemies at sea. The brute force strategy
    is used if the threat is small. We use the divide and conquer strategy if there
    are many enemies. The retreat strategy is executed if the battle is deemed futile.
    The Strategy_Main class:'
