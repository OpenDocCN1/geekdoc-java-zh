- img_proc: true
  md: "# The ClockTower class:\n\n```\nimport java.util.ArrayList;\n\npublic class\
    \ ClockTower implements Publisher {\n    private ArrayList<Subscriber> subscribers;\n\
    \    private String time;\n\n    public ClockTower() {\n        subscribers =\
    \ new ArrayList<Subscriber>();\n    }\n\n    public void subscribe(Subscriber\
    \ s) {\n        subscribers.add(s);\n    }\n\n    public void unsubscribe(Subscriber\
    \ s) {\n        int i = subscribers.indexOf(s);\n        if (i >= 0) {\n     \
    \       subscribers.remove(i);\n        }\n    }\n\n    public void notifySubscribers()\
    \ {\n        for (Subscriber subscriber : subscribers) {\n            subscriber.update(time);\n\
    \        }\n    }\nn    public void timeChanged() {\n        notifySubscribers();\n\
    \    }\n\n    public void setTimeOfDay(String time) {\n        this.time = time;\n\
    \        timeChanged();\n    }\n```"
