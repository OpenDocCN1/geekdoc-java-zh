  md: '# Hotel Motel Holiday Inn... Builder Pattern


    Do you want to encapsulate the creation of complex objects? The Builder pattern
    might be for you. The Builder pattern seeks to decouple the construction of complex
    objects from its actual representation (Gamma et.al, 1995). This is done to create
    flexibility in the construction process because the “products” implementations
    can be easily swapped in and out.


    # The Good


    +   - Decouple construction of complex objects from representation

    - Easily swap products to be built/constructed

    - Build objects in a step-by-step fashion


    # The Not So Good


    +   - Necessary to create concrete builders for each product.

    - Some overlap with the Composite design pattern.


    # Builder Pattern Implementation


    We want to build some lodgings in our game, namely hotels and motels. One can
    easily replace “hotel” and “motel” with any other thing that needs to be built
    step by step. However, the interface must be shared for the builder pattern to
    make sense. For example, an airplane should not logical should share the same
    construction interface as a pizza...unless, NO!


    The Builder class contains the main function here. In terms of Blueprints, we
    can think of this class as the one that needs to be physically dragged into the
    game world. The other “concrete” classes do not need to be physically dragged
    into the world.'
