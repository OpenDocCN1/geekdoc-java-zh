- img_proc: true
  md: '# Strategy Pattern Implementation


    We have a strategy for combating different enemies at sea. The brute force strategy
    is used if the threat is small. We use the divide and conquer strategy if there
    are many enemies. The retreat strategy is executed if the battle is deemed futile.
    The Strategy_Main class:'
  merge: -1
  pgno: 498
- img_proc: true
  md: "```\nusing System;\n\nnamespace Strategy\n{\n    class Strategy_Main\n    {\n\
    \        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    A tiny frigate wants some trouble\");\n            BattleShip battleship = new\
    \ BattleShip(new BruteForceStrategy());\n            battleship.engage();\n  \
    \          Console.WriteLine(\"Four frigates want some trouble\");\n         \
    \   battleship.alterManeuvers(new DivideConquerStrategy());\n            battleship.engage();\n\
    \            Console.WriteLine(\"An aircraft carrier group wants some trouble\"\
    );\n            battleship.alterManeuvers(new RetreatStrategy());\n          \
    \  battleship.engage();\n        }\n    }\n}\n```"
