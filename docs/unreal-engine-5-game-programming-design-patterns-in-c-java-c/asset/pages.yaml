  md: '# The Freaks Come out at night...

    Observer Pattern


    The Observer pattern is a very popular pattern used throughout many different
    software develop paradigms. Another name for this pattern is the publisher subscriber
    pattern. We have a publisher who broadcasts state changes and subscribers who
    listen for said broadcasts.


    # The Good


    +   - Great way to abstract publisher away from subscribers

    - Publisher need not know anything about subscribers


    # The Not So Good


    +   - Special care must be taken to unsubscribe due to what GoF calls “dangling
    references.”


    # Observer Pattern Implementation


    A clock tower is our publisher for the Observer pattern example. The subscribers
    consist of a group of freaks who change their behavior based on the time of day.
    The freaks receive notifications from the clock tower when the clock towers time
    state has changed. The Observer_Main class:'
