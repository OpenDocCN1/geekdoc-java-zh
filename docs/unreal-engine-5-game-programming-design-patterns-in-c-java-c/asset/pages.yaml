  md: '# Singleton Pattern Implementation


    There is no clear-cut way to create a custom Singleton blueprint in Unreal. However,
    it appears the Game Instance is a first party solution to the Singleton. An inventory
    system is a great example for demonstrating the Singleton design pattern. We only
    want one inventory instance at all times. Additionally, we want to be able to
    easily access that inventory system throughout our game.


    The main Singleton class *Singleton_Main*:'
