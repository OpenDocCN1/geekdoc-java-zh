  md: '# Factory Method Implementation


    We have creator, concrete creator, and product participants in the Factory Method
    design pattern. Our example implementation has a PotionShop abstract class as
    a creator. The concrete creators are InnerRealmPotionShop and OuterRealmPotion.
    These concrete creators inherit functionality from the PotionShop abstract class.
    Our concrete products are:


    +   - InnerRealmHealthPotion

    - InnerRealmPowerPotion

    - InnerRealmSkillPotion

    - OuterRealmHealthPotion

    - OuterRealmPowerPotion

    - OuterRealmSkillPotion


    All these products inherit functionality from the Potion abstract class. Using
    blueprints, we are going to implement the InnerRealmPotionShop and its products,
    namely:


    +   - InnerRealmHealthPotion

    - InnerRealmPowerPotion

    - InnerRealmSkillPotion


    The same ideas and principles apply to the creation of the OuterRealmPotionShop
    and its products.


    The FactoryMethod class contains the main function in Java. In terms of Blueprints,
    we can think of this class as the one that actually needs to be physically dragged
    into the game world. The other “concrete” classes do not need to be physically
    dragged into the world.'
