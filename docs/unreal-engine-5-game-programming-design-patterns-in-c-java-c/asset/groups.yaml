    # Make It Rain... State Pattern


    The GoF describes the State pattern as allowing object to change their behavior
    when their internal state changes (Gamma et.al, 1995).


    # The Good


    +   - Localizes state specific behavior (Gamma et.al, 1995).


    # The Not So Good


    +   - Fairly similar to the Strategy pattern


    # State Pattern Implementation


    We are going to implement an old school slot machine. As we know, there are a
    few states the slot machine can assume. These states are no coin inserted, coin
    inserted, no dollars, won dollars. The no dollars state indicates the lack of
    funds inside of a slot machine. The won dollars state indicate a player winning.
