    The equivalent blueprint interface is very mundane. The following are the nodes
    representing the functions in the FloorPlan interface.


    ![](img/5f4ffc80ed68fa818624623b02ce6c32_277_0.png)


    The saying goes, “Program to an Interface, not an implementation” (Gamma et.al,
    1995). In fact, it is a core principle in object-oriented design. The main benefit
    of programming to an interface is that it reduces implementation dependencies
    between subsystems (Gamma et.al, 1995). We see this first hand in our Builder
    Pattern example. Specifically, The Builder pattern seeks to decouple the construction
    of complex objects from its actual representation (Gamma et.al, 1995).'
