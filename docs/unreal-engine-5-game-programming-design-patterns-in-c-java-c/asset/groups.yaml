    \ event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_91_0.png)\n\nThe loop\
    \ is present to demonstrate attempts to create more than one instance of our designated\
    \ Singleton object. We should never be allowed to create multiple instances of\
    \ our inventory If everything is set up correctly.\n\n# The Create_Inventory_Instance\
    \ collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_91_1.png)\n\n#\
    \ The Instance_Created_Message collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_91_2.png)\n\
    \n# The Inventory class:\n\n# Inventory.h\n\n```cpp\n#pragma once\n\n#include\
    \ \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"Inventory.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API AInventory : public AActor\n{\n    GENERATED_BODY()\n\
    \npublic:\n    // Sets default values for this actor's properties\n    AInventory();\n\
    \n    //The instance of this Class\n    UPROPERTY()\n    AInventory* Instance;\n\
    \nprotected:\n    // Called when the game starts or when spawned\n    virtual\
    \ void BeginPlay() override;\n\npublic:\n    // Called every frame\n    virtual\
    \ void Tick(float DeltaTime) override;\n\n};\n```\n\n# Inventory.cpp\n\n```cpp\n\
    #include \"Inventory.h\"\n#include \"Kismet/GameplayStatics.h\"\n```\n\n```cpp\n\
    // Sets default values\nAInventory::AInventory()\n{\n    // Set this actor to\
    \ call Tick() every frame. You can turn this off to\n    // improve performance\
    \ if you don't need it.\n    PrimaryActorTick.bCanEverTick = true;\n\n    // Search\
    \ for existing Instances of this class\n    TArray<AActor*> Instances;\n    UGameplayStatics::GetAllOfClass(GetWorld(),\
    \ AInventory::StaticClass(), Instances);\n\n    if (Instances.Num() > 1)\n   \
    \ {\n        // If at least one of them, set the instance with the first found\
    \ one\n        Instance = Cast<AInventory>(Instances[0]);\n        Engine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow,\n        FString::Printf(TEXT(\"%s already exists\"),\
    \ *Instance->GetName()));\n\n        // Then Destroy this Actor\n        Destroy();\n\
    \    }\n}\n\n// Called when the game starts or when spawned\nvoid AInventory::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n\n// Called every frame\nvoid AInventory::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n\n# The Inventory blueprint\
    \ construction script:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_95_0.png)\n\
    \nThe concept of a private construction does not exist in Unreal. Therefore, we\
    \ must create another way of keeping Singleton objects from being created. We\
    \ do this by checking if an inventory instance already exists. If an inventory\
    \ instance does in fact exists, the attempted Singleton object is destroyed.\n\
