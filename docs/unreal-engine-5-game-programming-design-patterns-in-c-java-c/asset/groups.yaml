    Decorators provide a flexible alternative to sub-classing for extending functionality\"\
    \ (Gamma et al., 1995).\n\n## The Good\n- Easily add functionality to individual\
    \ objects\n- Avoids affecting objects of the same class\n\n## The Not So Good\n\
    - May end up creating what GoF calls \"Lots of little objects\".\nBasically, all\
    \ these semi-identical objects become difficult to debug.\n\n## Decorator Pattern\
    \ Implementation\n\nOur implementation consists of an enemy who is initially a\
    \ melee enemy. We want to \"Decorate\" the enemy and make an enemy who can use\
    \ projectiles. Thus the added functionality is the projectile ability.\n\nThe\
    \ Decorator_Main class:\n\n# Decorator_Main.h\n\n```cpp\n#pragma once\n\n#include\
