    \        this.lodgingBuilder.buildRooms();\n        this.lodgingBuilder.buildRestaurants();\n\
    \    }\n}\n```\n\nThe ArchitecturalEngineer construction script:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_290_0.png)\n\
    \nThe Check lodgingBuilder isValid node:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_290_1.png)\n\
    \nThis validity check is executed as a safety mechanism. We want to make sure\
    \ the object is not null before we start to perform operations on object. A “Not\
    \ Valid” string prints to the viewport if the object is indeed null.\n\nThe ArchitecturalEngineer\
    \ contains a few important functions, namely getLodging and constructLodging.\n\
    \nThe getLodging function graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_290_2.png)\n\
