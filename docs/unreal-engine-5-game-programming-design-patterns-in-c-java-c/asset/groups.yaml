    \ 编程精英的克星……单例模式\n- 结构型模式\n  - 适应并克服……适配器模式\n  - 装饰强大的敌人……装饰器模式\n  - 太空旅行看起来很简单……\
    \ Fac面模式\n- 行为型模式\n  - 怪物在深夜出没……观察者模式\n  - 天下大雨……状态模式\n  - 你击毁了我的战斗……策略模式\n- 创建型模式\
    \ (Java)\n  - 酒店、酒店、假日酒店……建造者模式 (Java)\n  - 煮沸与泡腾、酿造与装瓶……工厂方法 (Java)\n  - 编程精英的克星……单例模式\
    \ (Java)\n- 结构型模式 (Java)\n  - 适应并克服……适配器模式 (Java)\n  - 装饰强大的敌人……装饰器模式 (Java)\n\
    \  - 太空旅行看起来很简单…… Fac面模式 (Java)\n- 行为型模式 (Java)\n  - 怪物在深夜出没……观察者模式 (Java)\n \
    \ - 天下大雨……状态模式 (Java)\n  - 你击毁了我的战斗……策略模式 (Java)\n- 使用 C# 的模式\n  - 酒店、假日酒店……建造者模式\
    \ (C#)\n  - 编程精英的克星……单例模式 (C#)\n  - 适应并克服……适配器模式 (C#)\n  - 怪物在深夜出没……观察者模式 (C#)\n\
    # 你击毁了我的战舰... 策略模式 (C#)\n\n 结论\n\n# 引言\n\n你好，欢迎阅读《虚幻引擎 5 游戏编程设计模式：C++,Java,C#\
    \ 和蓝图》。我写这本书是因为我在学习虚幻引擎的“蓝图（Blueprints）”视觉脚本系统时遇到了困难。\n\n我觉得我在蓝图中做的每件事都像是某种“权宜之计（hack）”。你看，我熟悉许多传统编程语言的编程，并拥有来自\
    \ ABET 认证机构的软件工程硕士学位。事实上，我的技能水平在 Java、C++ 和 JavaScript 方面属于中高级水平。然而，这些语言非常成熟，人们只需通过\
    \ Google 就能找到任何问题的解决方案。但对于视觉脚本来说，情况**远非如此**！\n\n视觉脚本并不新鲜。虚幻引擎不是实现这类编程的第一个工具，也不会是最后一个……我看着你呢，Unity！\n\
    \n随着虚幻引擎和 Unity 变得越来越流行，关于视觉脚本的学习资源将会激增。本书旨在成为第一本讨论设计模式的书。我们将使用虚幻引擎编辑器 5.0 版本，并在\
    \ Java 和 C# 示例中使用 4.2x.x 版本。4.2x.x 版本的蓝图在 UE5 中的工作方式是完全相同的。\n\n# 如何阅读此书\n\n首先应该从\
    \ sonicworkflow.com 获取蓝图文件，以获得最大的理解。建议从“建造者（Builder）”部分开始。一旦理解了建造者部分，其余部分可能会变得更加清晰。\n\
    \n# 错误\n\n提交至 support@sonicworkflow.com\n\n# 本书中包含什么？\n\n视觉脚本并不新鲜。虚幻引擎不是实现这类编程的第一个工具，也不会是最后一个……我看着你呢，Unity！\n\
    \n随着虚幻引擎和 Unity 变得越来越流行，关于视觉脚本的学习资源将会激增。本书旨在成为第一本讨论设计模式的书。我们将使用虚幻引擎编辑器 5.0 版本，并在\
    \ Java 和 C# 示例中使用 4.2x.x 版本。4.2x.x 版本的蓝图在 UE5 中的工作方式是完全相同的。\n\n# 本书中不包含什么？\n\n\
    本书不是一本“最佳实践”书籍。请不要将此书作为蓝图实践的参考。本书试图尽可能遵循“等效（equivalent）”代码。Epic（虚幻引擎公司）花费了大量精力来抽象蓝图中的常见任务。我鼓励你学习官方\
    \ API，因为通常“有相应的节点可以实现这一点”。\n\n# 蓝图的怪异与非传统方法论\n\n# 蓝图接口\n\n虚幻中的脚本有多种方式来实现传统的编程结构。最令人困惑的话（尤其是对于软件工程背景的人来说）是蓝图接口。蓝图接口被广泛认为是一种“通信”工具。\n\
    \n> > 蓝图接口是一个或多个函数的集合——仅包含名称，没有可以添加到其他蓝图实现。任何添加了接口的蓝图都保证拥有这些函数……这本质上类似于通用编程中的接口概念。\n\
    - https://docs.unrealengine.com/en-Engine/Blueprints/UserGuide/Types/Interface\n\
    \n# 不能在构造脚本中生成\n\n标题自俗易懂。在“构造函数（constructor）”中尝试构建对象之所以面临挑战是因为它并不直观。构造脚本在游戏在编辑器中运行之前执行。如果没有可以生成的区域，我们无法“生成（spawn）”对象。解决方法是使用“添加子\
    \ Actor 组件（Add Child Actor Component）”节点。这样就可以……\n"
