    \    void LibertyCall();\n\n    // 执行集合任务\n    void CrewMuster();\n\n    // 执行传递的任务\n\
    \    void Task(const TArray<FString>& Tasks);\n\n    // 执行职责。它是纯虚函数，在此类中不需要实现\n\
