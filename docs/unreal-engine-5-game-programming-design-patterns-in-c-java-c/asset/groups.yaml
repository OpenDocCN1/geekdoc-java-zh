  - '[PAGE 98]


    # # Adapt and Overcome... Adapter Pattern


    A large amount of modern technology uses the idea of the wrapper. One can think
    of high-level programming languages as wrappers around lower-level programming
    languages. But how do these wrapped languages and their client languages communicate?
    We need some sort of adapter. GoF tells us the Adapter pattern facilitates the
    ability for classes to work together that couldn''t otherwise because of incompatible
    interfaces (Gamma et.al, 1995).


    # ## The Good


    +   - Reuse complex code that is otherwise not compatible with a new code base

    - Fairly easy to implement


    # ## The Not So Good


    +   - Can be overuse just to get a square peg into a round hole

    - Difficulty in recognizing necessity for new implementation or using adapter


    # ## Adapter Pattern Implementation


    In our Adapter pattern implementation, we have a shooter who uses a sling shot.
    We want to be able to allow our shooter to fire a gun. However, we want to use
    the existing code we have already implemented by using the Adapter pattern.


    The main adapter class:'
