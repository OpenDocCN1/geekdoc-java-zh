  - '[PAGE 8]


    # What is in this Book?


    This book is a crosswalk from traditional code to visual scripting. This book
    is about reconstructing traditional and widely used design patterns in a visual
    scripting environment. The visual scripting environment is Unreal Engine’s “Blueprints.”
    We will discuss design patterns to implement design patterns to solve some of
    the most common problems in programming. You will not need to read much of the
    background material on the design patterns if you are an experienced coder. Chances
    are, you probably have used many of these patterns previously. Do not If you are
    not a coder. If you are familiar with Blueprints, then you can, and should implement
    design patterns into your workflow when necessary.


    C++, Java, and C# “equivalent” code is provided for each design pattern discussed.
    Additionally, there is an accompanying UML diagram for each design pattern of
    the Java code implementation. We follow the code in blueprints as close as possible.
    Some of you may be thinking, “Hey Umar, why would you use Java and C# when Unreal’s
    main coding language is C++.\” I have nothing against C++. I chose to add Java
    and C# for a few reasons.


    +   1. Java and C# are easier to read. Especially if you are coming from Unity.
    Unity uses C#. It possesses keywords that immediately communicate interfaces,
    and abstract classes. There is no need to explicitly compose pure virtual functions
    in Java or C#.


    +   2. If one knows C++, then Java and C# are a breeze. If one knows Java and
    C#, C++ is still difficult to master.


    +   3. I think one would agree that Blueprints are closer in spirit to Java and
    C# than to C++.'
  - '[PAGE 9]


    # What is Not in this Book?


    This book is not about how to start using blueprints from scratch. This is not
    a zero to hero blueprints quest. You will struggle if you do not have a decent
    familiarity with blueprints. Plainly, this is not a beginner’s book. Comparatively,
    one would not attempt to “learn” C++ from the “Gang of Four’s” design patterns
    book. Since I brought it up, Design Patterns, Elements of Reusable Object-Oriented
    Software is the granddaddy of design patterns references. It is basically the
    authority on the topic of design patterns. You would be hard pressed to find a
    reputable source on the topic not borrowing ideas from that book. The “Gang of
    Four”, aka GoF, refer to the book’s authors.


    This book is not a treatise on design patterns. The Gang of Four’s book is a must
    read for further depth and understanding of the topic.


    This book is not a level design, artificial intelligence, user interface, animation
    etc. blueprint tutorial. The example implementations are trivial, like printing
    a string to the screen/viewport trial. To that end, focus is set on the design
    patterns themselves, not bells and whistles in Unreal Engine. This is reduce obsolescence.
    Unreal Engine changes so frequently that a large portion of written publications
    are all obsolete by the time they are published.


    Also, this is not a “best practices” book. Please not use this book as a reference
    for blueprint best practices. This book tries to follow the “equivalent” code
    as much as possible. To that end, we may diverge from blueprint best practices
    to mimic as close as possible what is written in code. Epic has taken great pains
    to abstract away common programming tasks in blueprints. I encourage you to learn
    the official API, because often… “there’s a node for that”.


    There are many ways to skin a cat, so to speak. The implementation of each Design
    pattern may possess alternative and perhaps even better blueprint implementations.
    This book only provides one example of many.'
  - '[PAGE 10]


    # Blueprint Weirdness and Unconventional Methodologies


    # Blueprint Interfaces


    Blueprint scripting in Unreal has some different ways of implementing traditional
    programming constructs. The most confusing topic, especially coming from a software
    engineering background is the blueprint interface. The blueprint interface is
    widely cited as being a “communication” tool. I nearly had a panic attack when
    I heard Epic''s staff say this in a live training stream. The same “communication”
    idea is echoed in the documentation. I cannot tell you how many times I yelled
    at my computer screen while reading documentation on blueprint interfaces. I would
    yell, “No, interfaces have nothing to do with communication!” All interfaces do
    define a guaranteed behavioral contract for objects which implement them. Yet,
    I''m wrong. One must let go of their traditional understanding of an interface.
    One must embrace the blueprint interface “communication” deal. Before you think
    I''m bashing Unreal, let me provide you with a great except on blueprint interfaces
    from their documentation:


    > >A Blueprint Interface is a collection of one or more functions - name only,
    no implementation that can be added to other Blueprints. Any Blueprint that has
    the Interface added is guaranteed to have those functions... This is essentially
    like the concept of an interface in general programming"

    - https://docs.unrealengine.com/en-Engine/Blueprints/UserGuide/Types/Interface


    # Cannot spawn in construction script


    The heading is self-explanatory. Why this poses a challenge when trying to construct
    objects in the “constructor” is not intuitive. The construction script is executed
    before the game runs in the editor. We cannot “spawn” objects without a world
    to spawn into. The workaround was using the Add Child Actor Component node. There
    may be a better way, but this works so'
- md: "\nfar. We shy away from the extensive use of the construction script in the\
    \ C++ blueprints but make extensive use of it for the Java and C# implementation.\n\
    \n# Sequence Node Usage\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_11_0.png)\n\
    \nThere is heavy use of the sequence node to encourage overall blueprint flow\
    \ from top to bottom. This is necessary for readability of larger blueprints.\
    \ Most blueprints are generally composed with a left to right flow. However, there\
    \ is more space vertically than horizontally in a book.\n\n# Collapse Node\n\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_11_1.png)\n\nThe collapsed graph node\
    \ is used to separate large blueprints into presentable chunks.\n\n# Yellow Interface\
    \ check\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_12_0.png)\n\nThe collapsed\
    \ graph with a yellow hue represents an interface check. Specifically, it accepts\
    \ a test object and checks if it implements the target interface. There may be\
    \ a validity check on the test object depending on the source of the test object's\
    \ source. This node is singled out because we will not always go inside this type\
    \ of collapsed graph for the sake of brevity.\n\n# Creational Patterns\n\nThe\
    \ creational patterns we discuss help to abstract the instantiation process. We\
    \ use creational patterns when we want to decouple a client from object it may\
    \ need instantiate. This is especially important. As the number of objects grow,\
    \ their behavior may begin to diverge. We cannot hardcode every object’s behavior\
    \ into the client. The client would turn into a monolithic mess and the blueprint\
    \ equivalent would be a nightmare to maintain.\n\n# Hotel Motel Holiday Inn...\
    \ Builder Pattern\n\nDo you want to encapsulate the creation of complex objects?\
    \ The Builder pattern might be for you. The Builder pattern seeks to decouple\
    \ the construction of complex objects from its actual representation (Gamma et.al,\
    \ 1995). This is done to create flexibility in the construction process because\
    \ the “products” implementations can be easily swapped in and out.\n\n# The Good\n\
    \n- Decouple construction of complex objects from representation\n- Easily swap\
    \ products to be built/constructed\n- Build objects in a step-by-step fashion\n\
    \n# The Not So Good\n\n- Necessary to create concrete builders for each product.\n\
    - Some overlap with the Composite design pattern.\n\n# Builder Pattern Implementation\n\
    \nWe want to build some lodgings in our game, namely hotels and motels. One can\
    \ easily replace “hotel” and “motel” with any other thing that needs to be built\
    \ step by step. However, the interface must be shared for the builder pattern\
    \ to make sense. For example, an airplane should not logically share the same\
    \ construction interface as a pizza...unless, NO!\n\nThe Builder class contains\
    \ the main function here. In terms of Blueprints, we can think of this class as\
    \ the one that needs to be physically dragged into the game world. The other “concrete”\
    \ classes do not need to be physically dragged into the world.\n\n```\n#pragma\
    \ once\n\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include\
    \ \"Builder_Main.generated.h\"\n\nUCLASS()\nclass DESIGN_PATTERNS_API ABuilder_Main\
    \ : public AActor\n{\n    GENERATED_BODY()\n\npublic:\n// Sets default values\
    \ for this actor's properties\nABuilder_Main();\n\nprivate:\n// The Builder Actor\n\
    UPROPERTY(VisibleAnywhere, Category = \"Main\")class AHotelLodgingBuilder* HotelBuilder;\n\
    \n//The Engineer Actor\nUPROPERTY(VisibleAnywhere, Category = \"Main\")class AArchitecturalEngineer*\
    \ Engineer;\n\nprotected:\n// Called when the game starts or when spawned\nvirtual\
    \ void BeginPlay() override;\n\npublic:\n// Called every frame\nvirtual void Tick(float\
    \ DeltaTime) override;\n\n};\n```\n\n```\nBuilder_Main.cpp\n\n#include \"Builder_Main.h\"\
    \n#include \"HotelLodgingBuilder.h\"\n#include \"ArchitecturalEngineer.h\"\n#include\
    \ \"Lodging.h\"\n```\n\n```\n// Sets default values\nABuilder::ABuilderMain()\n\
    {\n    // Set this actor to call Tick() every frame. You can turn this off to\n\
    \    // improve performance if you don't need it.\n    PrimaryActor::bCanEverTick\
    \ = true;\n}\n```\n\n```\n// Called when the game starts or when spawned\nvoid\
    \ ABuilder::BeginPlay()\n{\n    Super::BeginPlay();\n\n    // Spawn Builder and\
    \ Engineer\n    HotelBuilder = GetWorld()->SpawnActor<AHotelLodgingBuilder>\n\
    \    (AHotelLodgingBuilder::StaticClass());\n    Engineer = GetWorld()->SpawnActor<AAArchitecturalEngineer>\n\
    \    (AAArchitecturalEngineer::StaticClass());\n\n    // Set the Builder for the\
    \ Engineer and create the buildings\n    Engineer->SetLodgingBuilder(HotelBuilder);\n\
    \    Engineer->ConstructLodging();\n\n    // Get the Engineer's Lodging and Logs\
    \ the created buildings\n    ALodging* Lodging = Engineer->GetLodging();\n   \
    \ Lodging->LodgingCharacteristics();\n}\n```\n\n```\n// Called every frame\nvoid\
    \ ABuilder_Main::Tick(float DeltaTime)\n{\n  Super::Tick(DeltaTime);\n}\n```\n\
    \nThe blueprint equivalent of the Builder class: ![](img/5f4ffc80ed68fa818624623b02ce6c32_18_0.png)\n\
    \nThe interface check node: ![](img/5f4ffc80ed68fa818624623b02ce6c32_18_1.png)\n\
    \nThe collapsed graph node: ![](img/5f4ffc80ed68fa818624623b02ce6c32_19_0.png)\n\
    \nThe sequence node logic: ![](img/5f4ffc80ed68fa818624623b02ce6c32_20_0.png)\n\
    \nThe interface check result: ![](img/5f4ffc80ed68fa818624623b02ce6c32_20_1.png)\n"
  mdcn: "\n……远。我们在 C++ 蓝图中避免大量使用构造脚本，但在 Java 和 C# 的实现中广泛使用了它。\n\n# 序列节点（Sequence Node）用法\n\
    \n![](img/5f4ffc80ed68fa818624623b02ce6c32_11_0.png)\n\n我们大量使用序列节点来鼓励蓝图的整体流程遵循从上到下的方向。这对于大型蓝图的可读性至关重要。大多数蓝图通常是从左到右流构建的。然而，书籍的垂直空间通常大于水平空间。\n\
    \n# 折叠节点（Collapse Node）\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_11_1.png)\n\
    \n折叠图节点用于将大型蓝图拆分为易于展示的区块。\n\n# 黄色接口检查（Yellow Interface check）\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_12_0.png)\n\
    \n带有黄色调的折叠图表示接口检查。具体而言，它接受一个测试对象并检查其是否实现了目标接口。根据测试对象的来源，可能会对测试对象进行有效性检查。该节点之所以单独列出，是因为为了简洁起见，我们不会总是进入这种类型的折叠图内部。\n\
    \n# 创建模式（Creational Patterns）\n\n我们讨论的创建模式有助于抽象实例化过程。当我们想要将客户端与其可能需要实例化的对象解耦时，就会使用创建模式。这尤为重要。随着对象数量的增加，它们的行为可能会开始产生。我们无法将每个对象的行为硬编码到客户端中，否则客户端将变成一个臃肿的混乱体，而蓝图对应的产物在维护上将是一场噩梦。\n\
    \n# 酒店、旅馆、假日庄园……建造者模式（Builder Pattern）\n\n你想要封装复杂对象的创建过程吗？建造者模式可能适合你。建造者模式寻求将复杂对象的构建与其实际表示解耦（Gamma\
    \ et.al, 1995）。这样做是为了在构建过程中创建灵活性，因为“产品”的实现可以容易地切换。\n\n# 优点\n\n- 将复杂对象的构建与表示解耦\n\
    - 轻松切换要构建/构造的产品\n- 以逐步的方式构建对象\n\n# 不足之处\n\n- 需要为每种产品创建具体的建造者。\n- 与组合模式（Composite\
    \ design pattern）有某些重叠。\n\n# 建造者模式实现\n\n我们想在游戏中建造一些住宿，例如酒店和旅馆。人们可以很容易将“酒店”和“旅馆”替换为任何需要逐步构建的东西。然而，为了让建造者模式产生意义，必须共享接口。例如，飞机在逻辑上不应该与披萨共享相同的构建接口……除非，不！\n\
    \nBuilder 类在此处包含了主函数。在蓝图中，我们可以将此类视为那些物理上拖入游戏世界的类。其他的“具体”类则不需要物理地拖入世界。\n\n```cpp\n\
    #pragma once\n\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"Builder_Main.generated.h\"\n\nUCLASS()\nclass DESIGN_PATTERNS_API\
    \ ABuilder_Main : public AActor\n{\n    GENERATED_BODY()\n\npublic:\n// 设置此 actor\
    \ 属性的默认值\nABuilder_Main();\n\nprivate:\n// 建造者 Actor\nUPROPERTY(VisibleAnywhere,\
    \ Category = \"Main\")class AHotelLodgingBuilder* HotelBuilder;\n\n// 工程师 Actor\n\
    UPROPERTY(VisibleAnywhere, Category = \"Main\")class AArchitecturalEngineer* Engineer;\n\
    \nprotected:\n// 当游戏开始或生成时被调用\nvirtual void BeginPlay() override;\n\npublic:\n\
    // 每帧被调用\nvirtual void Tick(float DeltaTime) override;\n\n};\n```\n\n```cpp\n\
    Builder_Main.cpp\n\n#include \"Builder_Main.h\"\n#include \"HotelLodgingBuilder.h\"\
    \n#include \"ArchitecturalEngineer.h\"\n#include \"Lodging.h\"\n```\n\n```cpp\n\
    // 设置默认值\nABuilder::ABuilderMain()\n{\n    // 设置此 actor 每帧调用 Tick()。如果不需要，\n \
    \   // 可以关闭它以提高性能。\n    PrimaryActor::bCanEverTick = true;\n}\n```\n\n```cpp\n\
    // 当游戏开始或生成时被调用\nvoid ABuilder::BeginPlay()\n{\n    Super::BeginPlay();\n\n  \
    \  // 生成建造者和工程师\n    HotelBuilder = GetWorld()->SpawnActor<AHotelLodgingBuilder>\n\
    \    (AHotelLodgingBuilder::StaticClass());\n    Engineer = GetWorld()->SpawnActor<AAArchitecturalEngineer>\n\
    \    (AAArchitecturalEngineer::StaticClass());\n\n    // 为工程师设置建造者并创建建筑\n    Engineer->SetLodgingBuilder(HotelBuilder);\n\
    \    Engineer->ConstructLodging();\n\n    // 获取工程师的住宿并记录创建的建筑\n    ALodging* Lodging\
