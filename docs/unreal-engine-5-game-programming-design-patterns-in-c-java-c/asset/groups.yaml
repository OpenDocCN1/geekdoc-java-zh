- md: "\nThe HotelLodgingBuilder Event Begin Play section of the event graph:\n\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_39_0.png)\n\nThe remaining part of the\
    \ HotelLodgingBuilder event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_40_0.png)\n\
    \nThe **isLodgingImplementInterface** function is a custom interface check function\
    \ like the yellow hood collapsed graphs.\n\nThe **isLodgingImplementInterface**\
    \ function:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_40_1.png)\n\nNow we need\
    \ an architectural engineer to coordinate the step-by-step construction of the\
    \ lodging.\n\n## ArchitecturalEngineer.h\n\n```\n#include \"CoreMinimal.h\"\n\
    #include \"GameFramework/Actor.h\"\n#include \"LodgingBuilder.h\"\n#include \"\
    ArchitecturalEngineer.generated.h\"\n```\n\n```\nUCLASS()\nclass DESIGN_PATTERNS_API\
    \ AArchitecturalEngineer : public AActor\n{\n    GENERATED_BODY()\n```\n\n```\n\
    public:\n// Sets default values for this actor's properties\nAArchitecturalEngineer();\n\
    ```\n\n```\nprivate:\n// The Builder Actor, that must be a LodgingBuilder\nILodgingBuilder*\
    \ LodgingBuilder;\n```\n\n```\nprotected:\n// Called when the game starts or when\
    \ spawned\nvirtual void BeginPlay() override;\n```\n\n```\npublic:\n// Called\
    \ every frame\nvirtual void Tick(float DeltaTime) override;\n```\n\n```\n//Creates\
    \ the buildings\nvoid ConstructLodging();\n```\n\n```\n//Set the Builder Actor\n\
    void SetLodgingBuilder(AActor* Builder);\n```\n\n```\n//Get the Lodging of the\
    \ Builder\nclass ALodging* GetLodging();\n```\n\n## ArchitecturalEngineer.cpp\n\
    \n```\n#include \"ArchitecturalEngineer.h\"\n#include \"Lodging.h\"\n```\n\n```\n\
    // Sets default values\nAArchitecturalEngineer::AArchitecturalEngineer()\n{\n\
    \    // Set this actor to call Tick() every frame. You can turn this off to improve\
    \ performance if you need it.\n    PrimaryActorTick.bCanEverTick = true;\n}\n\
    ```\n\n```\n// Called when the game starts or when spawned\nvoid AArchitecturalEngineer::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n```\n\n```\n// Called every frame\nvoid AArchitecturalEngineer::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n\n```\nvoid AArchitecturalEngineer::SetLodgingBuilder(AActor*\
    \ Builder)\n{\n    // Cast the Actor and set the Builder\n    LodgingBuilder =\
    \ Cast<ILodgingBuilder>(Builder);\n\n    if (!LodgingBuilder) //Log Error if cast\
    \ fails\n    {\n        GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Red,\
    \ TEXT(\"Invalid Cast! See Output log for more details\"));\n        UE_LOG(LogTemp,\
    \ Error, TEXT(\"SetLodgingBuilder(): The Actor is not a LodgingBuilder! Are you\
    \ sure that the Actor implements that interface?\"));\n    }\n}\n```\n\n```\n\
    ALodging* AArchitecturalEngineer::GetLodging()\n{\n    if (LodgingBuilder)\n \
    \       //Returns the Lodging of the Builder\n        return LodgingBuilder->GetLodging();\n\
    \n    //Log if the Builder is NULL\n    UE_LOG(LogTemp, Error, TEXT(\"GetLodging():\
    \ Return nullptr\"));\n    return nullptr;\n}\n```\n\n```\nvoid AArchitecturalEngineer::ConstructLodging()\n\
    {\n    if (!LodgingBuilder) { \n        UE_LOG(LogTemp, Error, TEXT(\"ConstructLodging():\
    \ LodgingBuilder is NULL, make sure it's initialized.\")); \n        return; \n\
    \    }\n\n    //Creates the buildings\n    LodgingBuilder->BuildSwimmingPool();\n\
    \    LodgingBuilder->BuildLobbyArea();\n    LodgingBuilder->BuildRooms();\n  \
    \  LodgingBuilder->BuildRestaurants();\n}\n```\n\nThe ArchitecturalEngineer construction\
    \ script:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_45_0.png)\n\nThe Check lodgingBuilder\
    \ isValid node:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_45_1.png)\n\nThis\
    \ validity check is executed as a safety mechanism. We want to make sure the object\
    \ is not null before we start to perform operations on said object. A “Not Valid”\
    \ string prints to the viewport If the object is indeed null.\n\nThe ArchitecturalEngineer\
    \ contains a few important functions, namely GetLodging and ConstructLodging.\n\
    \nThe GetLodging function graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_45_2.png)\n\
    \nThe ConstructLodging function graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_46_0.png)\n\
    \nThe collapsed graphs represent the body of the ConstructLodging function:\n\n\
    ```\nvoid AArchitecturalEngineer::ConstructLodging()\n{\n    //Log if the Builder\
    \ is NULL\n    if (!LodgingBuilder) { \n        UE_LOG(LogTemp, Error, TEXT(\"\
    ConstructLodging(): LodgingBuilder is NULL, make sure it's initialized.\")); \n\
    \        return; \n    }\n\n    //Creates the buildings\n    LodgingBuilder->BuildSwimmingPool();\n\
    \    LodgingBuilder->BuildLobbyArea();\n    LodgingBuilder->BuildRooms();\n  \
    \  LodgingBuilder->BuildRestaurants();\n}\n```\n\nThe BuildSwimmingPool, BuildLobbyArea,\
    \ BuildRooms, and BuildRestaurants graphs are respectively:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_48_0.png)\n\
    \n![](img/5f4ffc80ed68fa818624623b02ce6c32_49_0.png)\n\nThis is the final screenshot\
    \ of the construction of a hotel.\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_49_1.png)\n\
    \nStrings printed to the viewport are not impressive. However, these strings represent\
    \ “what could be.” In development, one has the 3D or 2D artwork associated with\
    \ these strings. Thanks to the Builder Pattern, we have a framework to build different\
    \ versions of hotels piece by piece.\n\n## Boil and Bubble, Brew and Bottle...\n\
    ### Factory Method\n\nGoF says the intent of the Factory Method is to “define\
    \ an interface for creating an object, but let subclasses decide which class to\
    \ instantiate” (Gamma et.al, 1995). The Factory Method invokes another important\
    \ object-oriented principle. That principle is called “Dependency Inversion”.\
    \ We want subclasses to depend on abstractions and not the other way around. Basically,\
    \ we want children to depend on their parents.\n\n## The Good\n\n- Encapsulate\
    \ instantiation\n- Concrete products are not coupled to their creator\n\n## The\
    \ Not So Good\n\n- Can difficult to follow code because of level of abstraction.\n\
    \n### Factory Method Implementation\n\nWe have Potion abstract class as a creator.\
    \ Our example has Potion abstract class. The concrete creators are InnerRealmPotionShop\
    \ and OuterRealmPotion. \n\nAll products inherit functionality from Potion abstract\
    \ class. \n\nUsing blueprints, we are going to implement the InnerRealmPotionShop\
    \ and its products, namely:\n\n- InnerRealmHealthPotion\n- InnerRealmPowerPotion\n\
    - InnerRealmSkillPotion\n- OuterRealmHealthPotion\n- OuterRealmPowerPotion\n-\
    \ OuterRealmSkillPotion\n\nThe FactoryMethod class contains the main function.\
    \ In terms of Blueprints, we can think of this class as the one that needs to\
