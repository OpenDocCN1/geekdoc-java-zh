    \nThe saying goes, “Program to an Interface, not an implementation” (Gamma et.al,\
    \ 1995). In fact, it is a core principle in object-oriented design.\n\nThe main\
    \ benefit of programming to an interface is that it reduces implementation dependencies\
    \ between subsystems (Gamma et.al, 1995). We see this first hand in our Builder\
    \ Pattern example. Specifically, The Builder pattern seeks to decouple the construction\
    \ of complex objects from its actual representation (Gamma et.al, 1995).\n\nThe\
    \ LodgingBuilder interface:\n\n# LodgingBuilder.h\n\n```cpp\n#pragma once\n\n\
    #include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include \"LodgingBuilder.generated.h\"\
    \n\n// This class does not need to be modified.\nUINTERFACE(MinimalAPI)\nclass\
    \ ULodgingBuilder : public UInterface\n{\n    GENERATED_BODY()\n};\n\nclass DESIGN_PATTERNS_API\
    \ ILodgingBuilder\n{\n    GENERATED_BODY()\n\n    // Add interface functions to\
