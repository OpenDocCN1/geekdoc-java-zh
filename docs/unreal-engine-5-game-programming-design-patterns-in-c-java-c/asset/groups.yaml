    };\n```\n\n```cpp\n#include \"BruteForceStrategy.h\"\n\n// 设置默认值\nAButeForceStrategy::AButeForceStrategy()\n\
    {\n    // 设置此 actor 每一帧调用 Tick()。如果你不需要它，可以关闭它以提高性能。\n    PrimaryActor->bCanEverTick\
    \ = true;\n}\n\n// 当游戏开始或生成时被调用\nvoid AButeForceStrategy::BeginPlay()\n{\n   \
    \ Super::BeginPlay();\n}\n\n// 每一帧调用\nvoid AButeForceStrategy::Tick(float DeltaTime)\n\
    {\n    Super::Tick(DeltaTime);\n}\n\nvoid AButeForceStrategy::Maneuver()\n{\n\
