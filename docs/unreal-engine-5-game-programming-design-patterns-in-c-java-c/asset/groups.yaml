    \ shoot a gun causing damage of 100.\n\n## Space Travel Looks Easy... Façade\n\
    ### Pattern (Java)\n\nFaçade Pattern UML Diagram\n\n| <<Java Class>> | <<Java\
    \ Class>> |\n| :--- | :--- |\n| **@StarShipFacade** (default package) | **@Facade_Main**\
    \ (default package) |\n| - crew: List<StarShipCrewMember> | - main(String[] args):\
    \ void |\n| - tasks: List<String> | |\n| + StarShipFacade() | |\n| + reveille():\
    \ void | |\n| + planOfDay(): void | |\n| + taps(): void | |\n| + performTasks(List<StarShipCrewMember>,\
    \ List<String>): void | |\n\n| <<Java Class>> |\n| :--- |\n| **StarShipCrewMember**\
    \ (default package) |\n| + StarShipCrewMember() void |\n| + turnLightsOut(): void\
    \ |\n| + hearOutUp(): void |\n| + libertyCall(): void |\n| + crewMuster(): void\
    \ |\n| + task(String): void |\n| + task(List<String>): void |\n| + duty(): void\
    \ |\n| + crewTitle(): String |\n\n| <<Java Class>> | <<Java Class>> | <<Java Class>>\
    \ |\n| :--- | :--- | :--- |\n| **StarShipNavigationOfficer** (default package)\
    \ | **StarShipSupplyOfficer** (default package) | **StarShipOperationsOfficer**\
    \ (default package) |\n| + StarShipNavigationOfficer() | + StarShipSupplyOfficer()\
    \ | + StarShipOperationsOfficer() |\n| + duty(): void | + duty(): void | + duty():\
    \ void |\n| + crewTitle(): String | + crewTitle(): String | + crewTitle(): String\
    \ |\n\n## Façade Pattern Implementation\n\nSpace travel is not easy. The most\
    \ important part of space travel is the starship. However, the starship has complexity\
    \ of its own. This is where the StarShipFacade comes into play. The Façade main\
    \ class:\n\n```java\npublic class Facade_Main {\n    public static void main(String[]\
    \ args) {\n        StarShipFacade shipFacade = new StarShipFacade();\n       \
    \ shipFacade.reveille();\n        shipFacade.planOfTheDay();\n        shipFacade.taps();\n\
    \    }\n}\n```\n\nFrom Façade_Main we can see how easy it is to run a starship.\
    \ This is merely a façade using the Façade pattern. The complexity lies ahead.\n\
    \nThe Façade_Main event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_355_0.png)\n\
    \nThe Create_Starship_Facade collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_355_1.png)\n\
    \nThe StarShipFacade class:\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\
    \npublic class StarShipFacade {\n    private final List<StarShipCrewMember> crew;\n\
    \n    private List<String> tasks;\n\n    public StarShipFacade() {\n        crew\
    \ = new ArrayList<>();\n        tasks = new ArrayList<>();\n        crew.add(new\
    \ StarShipNavigationOfficer());\n        crew.add(new StarShipSupplyOfficer());\n\
    \        crew.add(new StarShipOperationsOfficer());\n    }\n\n    public void\
    \ reveille() {\n        tasks.clear();\n        tasks.add(\"trice_up\");\n   \
    \     tasks.add(\"muster\");\n        performTasks(crew, tasks);\n    }\n\n  \
    \  public void planOfTheDay() {\n        tasks.clear();\n        tasks.add(\"\
    duty\");\n        performTasks(crew, tasks);\n    }\n\n    public void taps()\
    \ {\n        tasks.clear();\n        tasks.add(\"liberty_call\");\n        tasks.add(\"\
    lights_out\");\n        performTasks(crew, tasks);\n    }\n\n    private static\
    \ void performTasks(List<StarShipCrewMember> crew, List<String> tasks) {\n   \
    \   for (StarShipCrewMember crewMember : crew) {\n        crewMember.task(tasks);\n\
    \      }\n    }\n}\n```\n\nThe StarShipFacade class is where the meat of this\
    \ pattern lies. We did not use the construction script as demonstrated in the\
    \ code. We placed the construction code inside of the event graph. The StarshipFacade\
    \ event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_358_0.png)\n\nThe Add\
    \ Navigation Officer to crew collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_358_1.png)\n\
    \nThe Add Supply Officer to crew collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_359_0.png)\n\
    \nThe Add Operations Officer to crew collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_359_1.png)\n\
    \nThe Reveille blueprint function:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_360_0.png)\n\
    \nThe PlanOfTheDay blueprint function:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_360_1.png)\n\
    \nThe Taps blueprint function:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_361_0.png)\n\
    \nThe Perform blueprint function:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_361_1.png)\n\
    \nThe abstract class StarShipCrewMember:\n\n```java\nimport java.util.List;\n\n\
    public abstract class StarShipCrewMember {\n    public void turnLightsOut() {\n\
    \        System.out.println(crewTitle() + \" taps, lights out.\");\n    }\n\n\
    \    public void hearOutriceUp() {\n        System.out.println(crewTitle() + \"\
    \ all hands heave out and trice up.\");\n    }\n\n    public void libertyCall()\
    \ {\n        System.out.println(crewTitle() + \" liberty call, liberty call.\"\
    );\n    }\n\n    public void crewMuster() {\n        System.out.println(crewTitle()\
    \ + \" time for muster.\");\n    }\n\n    private void task(String task) {\n \
    \       switch (task) {\n            case \"lights_out\":\n                turnLightsOut();\n\
    \                break;\n            case \"trice_up\":\n                hearOutriceUp();\n\
    \                break;\n            case \"liberty_call\":\n                libertyCall();\n\
    \                break;\n            case \"muster\":\n                crewMuster();\n\
    \                break;\n            case \"duty\":\n                duty();\n\
    \                break;\n            default:\n                System.out.println(\"\
