    \ Strategy Pattern (C#)\n\nConclusion\n\n# Introduction\n\nHi, and welcome to\
    \ Unreal Engine 5 Game Programming Design Patterns in C++, Java, C#, and Blueprints.\
    \ I wrote this book because I struggled with learning Unreal Engine’s “Blueprints”\
    \ visual scripting system.\n\nI felt like everything I did in Blueprints was sort\
    \ of a hack. You see, I knew how to program in many traditional programming languages\
    \ and possessed a master's in software engineering from an ABET accredited institution.\
    \ In fact, my skill level was intermediate to advanced Java, C++, and JavaScript.\
    \ However, these languages are very mature and one can just use Google to find\
    \ the solution to almost any question. This is FAR from the case when it comes\
    \ to visual scripting!\n\nVisual scripting is not novel. Unreal Engine is not\
    \ the first tool to implement this kind of programming, nor will it be the last...\
    \ I see you Unity!\n\nThere will be a proliferation in learning resources regarding\
    \ visual scripting as Unreal and Unity become more popular. This book seeks to\
    \ be the first one discussing design patterns. We will be using Unreal Engine\
    \ Editor version 5.0 and we will use 4.2x.x for the Java and C# examples. The\
    \ 4.2x.x blueprints work in UE5 identically.\n\n# How to Read this Book\n\nBlueprint\
    \ files should be obtained first for maximal understanding from sonicworkflow.com.\
    \ It is advisable to start with the Builder section. It is likely that the remaining\
    \ sections are clearer once the Builder section is understood.\n\n# Errors\n\n\
