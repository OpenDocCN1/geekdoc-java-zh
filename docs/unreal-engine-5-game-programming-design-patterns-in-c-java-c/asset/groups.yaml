    # # Decorating Overpowered Enemies...

    Decorator Pattern


    The Decorator pattern allows for the possibility of adding features functionality
    to objects at runtime. GoF states that, “Decorators provide a flexible alternative
    to sub-classing for extending functionality” (Gamma et.al, 1995).


    # ## The Good


    +   - Easily add functionality to individual objects

    - Avoids affecting objects of the same class


    # ## The Not So Good


    +   - May end up creating what GoF calls “Lots of little objects”.

    Basically, all these little semi-identical objects may become difficult to debug.


    # ## Decorator Pattern Implementation


    Our implementation consists of an enemy who is initially a melee enemy. We want
    to “Decorate” the enemy and make an enemy who can use projectiles. Thus, the added
    functionality is the projectile ability.


    The *Decorator_Main* class:'
