    ```\n\n```cpp\nUCLASS()\nclass DESIGN_PATTERNS_API ASingleton_Main : public AActor\n\
    {\n    GENERATED_BODY()\n\npublic:\n    // Sets default values for this actor's\
    \ properties\n    ASingleton_Main();\n\nprivate:\n    //The Inventory of this\
    \ Actor\n    UPROPERTY()\n    class AInventory* Inventory;\n\nprotected:\n   \
