- md: "\n```sharp\npublic void constructLodging()\n{\n    this.lodgingBuilder.buildSwimmingPool();\n\
    \    this.lodgingBuilder.buildLobbyArea();\n    this.lodgingBuilder.buildRooms();\n\
    \    this.lodgingBuilder.buildRestaurants();\n}\n```\n\nThe buildSwimmingPool,\
    \ buildLobbyArea, buildRooms, and buildRestaurants graphs are respectively:\n\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_451_0.png)\n\nThis is the final screenshot\
    \ of the construction of a hotel.\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_452_0.png)\n\
    \nStrings printed to the viewport are not impressive. However, these strings represent\
    \ “what could be.” In development, one has the 3D or 2D artwork associated with\
    \ these strings. Thanks to the Builder Pattern, we have a framework to build different\
    \ versions of hotels piece by piece.\n\n## Programming Elitists’ Bane... Singleton\
    \ Pattern (C#)\n\nSingleton Pattern UML Diagram\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_453_0.png)\n\
    \n## Singleton Pattern Implementation\n\nThere is no clear-cut way to create a\
    \ custom Singleton blueprint in Unreal. However, it appears the Game Instance\
    \ is a first party solution to the Singleton. An inventory system is a great example\
    \ for demonstrating the Singleton design pattern. We only want one inventory instance\
    \ at all times. Additionally, we want to be able to easily access that inventory\
    \ system throughout our game.\n\nThe main Singleton class *Singleton_Main*:\n\n\
    ```sharp\nusing System;\nnamespace Singleton\n{\n    class Singleton_Main\n  \
    \  {\n        static void Main(string[] args)\n        {\n            Inventory\
    \ myInventory = Inventory.GetInstance();\n            Console.WriteLine(myInventory);\n\
    \        }\n    }\n}\n```\n\nThe Singleton_Main blueprint event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_456_0.png)\n\
    \nThe for loop is present to demonstrate attempts to create one instance of our\
    \ designated Singleton object. We should never be allowed to create multiple instances\
    \ of our inventory If everything is set up correctly.\n\nThe Create_Inventory_Instance\
    \ collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_456_1.png)\n\n\
    The Instance_Created_Message collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_456_2.png)\n\
    \nThe Inventory class:\n\n```sharp\npublic class Inventory {\n    private static\
    \ readonly Inventory Instance = new Inventory();\n    private Inventory() {}\n\
    \    public static Inventory getInstance() {\n        return Instance;\n    }\n\
    }\n```\n\nThe Inventory blueprint construction script:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_458_0.png)\n\
    \nThe concept of a private construction does not exist in Unreal. Therefore, we\
    \ must create another way of keeping new Singleton objects from being created.\
    \ We do this by checking if an inventory instance already exists. If an an inventory\
    \ instance does in fact already exists, the attempted new Singleton object is\
    \ destroyed.\n\nThe isInstance_already_exist collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_458_1.png)\n\
    \nThe kill_yourself collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_459_0.png)\n\
    \nThe Singleton pattern viewport screen print:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_459_1.png)\n\
    \n## Adapt and Overcome... Adapter Pattern (C#)\n\nAdapter Pattern UML Diagram\n\
    \n![](img/5f4ffc80ed68fa818624623b02ce6c32_460_0.png)\n\n## Adapter Pattern Implementation\n\
    \nIn our Adapter pattern implementation, we have a shooter who uses a sling shot.\
    \ We want to be able to allow our shooter to fire a gun. However, we want to use\
    \ the existing code we have already implemented by using the Adapter pattern.\n\
