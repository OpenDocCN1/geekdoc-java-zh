    \ FreakyAllen 变成了一个扭动的物体\nFreakyAllen 被订阅\n\n## 来实现……状态模式 (Java)\n\n状态模式 UML 图\n\
    \n| 类名 | 属性 | 方法 |\n| :--- | :--- | :--- |\n| OldState | | main(String[] args)\
    \ |\n| OldConstructorState | | OldConstructorState(OldStateMachine) |\n| OldStateMachine\
    \ | | OldStateMachine(OldConstructorState) |\n| OldState | - constructorState:\
    \ State, - state: State, - count: int | insert(StateSoftMachine), pullState(),\
    \ getCount(), getConstructorState(), getOldStateState(), toString() |\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_387_0.png)\n\
    \n## 状态模式实现\n\n我们将实现一个旧老虎机。正如我们所知，老虎机可以处于几种状态。这些状态是：无硬币、有硬币、无金额、中奖。无金额状态表示老虎机内部缺乏资金。中奖状态表示玩家赢了。`State_Main`\
    \ 类：\n\n"
