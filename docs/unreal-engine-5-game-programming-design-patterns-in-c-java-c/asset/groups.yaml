    \       Console.WriteLine(myInventory);\n        }\n    }\n}\n```\n\nSingleton_Main\
    \ 蓝图事件图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_456_0.png)\n\n存在 for 循环是为了演示尝试为我们指定的单例对象创建一个实例。如果一切设置正确，我们永远不应该允许创建多个库存实例。\n\
