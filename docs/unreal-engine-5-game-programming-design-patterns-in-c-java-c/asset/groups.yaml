    # # Space Travel Looks Easy... Façade Pattern


    GoF defines the Façade pattern as providing a central interface to a set of interfaces
    (Gamma et.al, 1995). The Façade pattern is great when we want to simplify the
    interaction between a client and a very complex system.


    # ## The Good


    +   - Simplifies the use of a very complex system

    - Reduces coupling between clients and various subsystems


    # ## The Not So Good


    +   - Hides possibly overly complex characteristics of a subsystem


    # ## Façade Pattern Implementation


    Space travel is not easy. The most important part of space travel is the starship.
    However, the starship has complexity of its own. This is where the StarShipFacade
    comes into play.


    The Façade main class:'
