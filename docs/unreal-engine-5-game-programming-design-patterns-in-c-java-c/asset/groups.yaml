    \ Method)\n\nGoF（设计模式 Go）指出，工厂方法的意图是“为创建对象定义接口，但让子类决定实例化哪个类”（Gamma et.al，1995）。工厂方法调用了另一个重要的面向对象原则。该原则被称为“依赖倒置”。我们希望子类依赖于抽象，而不是反过来。基本上，我们希望子类依赖于它们的父类。\n\
