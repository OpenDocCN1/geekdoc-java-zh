    \ Singleton Pattern\n\nThe Singleton pattern is often singled out for being one\
    \ of, if not the worst commonly used design pattern. Singletons are like credit\
    \ cards. Everyone uses them, but you can get into a real predicament if you use\
    \ them irresponsibly. Programming puristsathe the Singleton pattern. In fact,\
    \ I have never seen any modern published literature discuss the Singleton pattern\
    \ without telling the reader about its use, ironically. The gang of four describe\
    \ a Singleton as a class possessing only one instance, and provides a global point\
    \ of access (Gamma et.al, 1995).\n\n# **The Good**\n\n- Encapsulates sole instance\n\
    - Global (ease of access)\n\n# **The Not So Good**\n\n- Global (ease of modification)\n\
    - May create unknown dependencies\n\n# **Singleton Pattern Implementation**\n\n\
    There is no clear-cut way to create a custom Singleton blueprint in Unreal. However,\
    \ it appears the Game Instance is a first party solution to the Singleton. An\
    \ inventory system is a great example for demonstrating the Singleton design pattern.\
    \ We only want one inventory instance at all times. Additionally, we want to be\
    \ able to easily access that inventory system throughout our game.\n\nThe main\
    \ Singleton class *Singleton_Main*:\n"
