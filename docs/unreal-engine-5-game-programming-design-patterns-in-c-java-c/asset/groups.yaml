- md: "\n# Builder Pattern Implementation\n\nThe Builder class contains the main function\
    \ in Java. In terms of Blueprints, we can think of this class as the one that\
    \ actually needs to be physically dragged into the game world. The other “concrete”\
    \ classes do not need to be physically dragged into the world.\n\n```java\nclass\
    \ Builder_Main {\n    public static void main(String[] args) {\n        LodgingBuilder\
    \ hotelBuilder = new HotelLodgingBuilder();\n        ArchitecturalEngineer engineer\
    \ = new ArchitecturalEngineer(hotelBuilder);\n\n        engineer.constructLodging();\n\
    \n        Lodging lodging = engineer.getLodging();\n\n        lodging.lodgingCharacteristics();\n\
    \    }\n}\n```\n\nThe blueprint equivalent of the Builder_Main class:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_273_0.png)\n\
    \nThe Set hotelBuilder and Set engineer collapsed graph are respectively:\n\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_273_1.png)\n\nand\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_273_2.png)\n\
    \nThe Set hotelBuilder collapsed graph represents this line of code: `LodgingBuilder\
    \ hotelBuilder = new HotelLodgingBuilder();`\n\nThe Spawn Actor From Class node\
    \ is akin to the new keyword in Java and other languages. The class to spawn is\
    \ chosen using the dropdown box under the word “Class”. The Spawn Transform is\
    \ to one’s own specific scenario. For simplicity, we can just right click on the\
    \ Spawn Transform and choose “Promote to Variable”. If there is no Spawn Transform\
    \ then the blueprint will compile with errors. We set (or “initialize”) our hotelBuilder\
    \ variable once the desired actor is spawned.\n\nThe same basic idea applies to\
    \ the Set engineer collapsed graph. However, Architectural Engineer needs LodgingBuilder\
    \ to be passed into its constructor as follows in this line of code:\n\n`ArchitecturalEngineer\
    \ engineer = new ArchitecturalEngineer(hotelBuilder);`\n\nLater, we will not be\
    \ going into such detail on every spawning activity. Trust that there are many\
    \ spawn actor requirements, and discussing each one will become an exercise in\
    \ tedium.\n\nThe Builder_Main blueprint continues with the Construct Lodging function\
    \ call node. This function is called on the engineer we spawned previously. The\
    \ equivalent line of code:\n\n```java\nengineer.constructLodging();\n```\n\nNote\
    \ the Sequence node in Builder_Main. Sequence 0 finishes once the Construct Lodging\
    \ function executes. Sequence 1 starts executing. The Set lodging collapsed graph:\n\
    \n![](img/5f4ffc80ed68fa818624623b02ce6c32_274_0.png)\n\nNow, we are equivalently\
    \ executing this line of code:\n\n`Lodging lodging = engineer.getLodging();`\n\
    \nThis is the last line of code in the Builder class. However, we need to make\
    \ some validation checks and make sure we built a hotel. We want to make sure\
    \ the lodging actor implements the FloorPlan interface. The lodging isFloorPlan_int\
    \ collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_275_0.png)\n\n\
    Going forward we will not be showing this interface check collapsed graph. Note,\
    \ the collapsed graph for this check always possesses a yellow hue. The only item\
    \ that changes inside the collapsed node is the target interface we are checking\
    \ the object against. The target interface is always part of the collapsed graph\
    \ name.\n\nThe Builder_Main blueprint ends execution with a print string to let\
    \ us know if the hotel is actually built. \"Failed to Build a Hotel\" If an error\
    \ in logic occurs somewhere in any of the blueprints.\n\nNow we can discuss the\
    \ interfaces we use in this pattern. First, we create a floor plan interface for\
    \ all lodgings to implement. Most commercial lodgings in the USA contain a pool,\
    \ lobby area, rooms, and restaurants. We also create a lodging builder interface\
    \ for our specific lodging builder classes to implement. The FloorPlan interface:\n\
    \n```java\ninterface FloorPlan{\n    public void setSwimmingPool(String swimmingPool);\n\
    \    public void setLobbyArea(String lobbyArea);\n    public void setRooms(String\
    \ rooms);\n    public void setRestaurants(String restaurants);\n}\n```\n\nThe\
    \ equivalent blueprint interface is very mundane. The following are the nodes\
    \ representing the functions in the FloorPlan interface.\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_277_0.png)\n\
    \nThe saying goes, “Program to an Interface, not an implementation” (Gamma et.al,\
    \ 1995). In fact, it is a core principle in object-oriented design. The main benefit\
    \ of programming to an interface is that it reduces implementation dependencies\
    \ between subsystems (Gamma et.al, 1995). We see this first hand in our Builder\
    \ Pattern example. Specifically, The Builder pattern seeks to decouple the construction\
    \ of complex objects from its actual representation (Gamma et.al, 1995).\n\n```java\n\
    interface LodgingBuilder\n{\n    public void buildSwimmingPool();\n    public\
    \ void buildLobbyArea();\n    public void buildRooms();\n    public void buildRestaurants();\n\
    \    public Lodging getLodging();\n}\n```\n\nThe blueprint version of the Lodging\
    \ follows the same as FloorPlan interface and is thus removed for the sake of\
    \ brevity. Next, we create the Lodging class which implements the FloorPlan.\n\
    \n```java\nclass Lodging implements FloorPlan{\n    private String swimmingPool;\n\
    \    private String lobbyArea;\n    private String rooms;\n    private String\
    \ restaurants;\n\n    @Override\n    public void setSwimmingPool(String swimmingPool)\
    \ {\n        this.swimmingPool = swimmingPool;\n    }\n\n    @Override\n    public\
    \ void setLobbyArea(String lobbyArea) {\n        this.lobbyArea = lobbyArea;\n\
    \    }\n\n    @Override\n    public void setRooms(String rooms) {\n        this.rooms\
    \ = rooms;\n    }\n\n    @Override\n    public void setRestaurants(String restaurants)\
    \ {\n        this.restaurants = restaurants;\n    }\n\n    public void lodgingCharacteristics()\
    \ {\n        System.out.println(swimmingPool);\n        System.out.println(lobbyArea);\n\
    \        System.out.println(rooms);\n        System.out.println(restaurants);\n\
    \    }\n}\n```\n\n# The Lodging blueprint\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_281_0.png)\n\
    \nBlueprints use Event nodes when calling void functions. Also, we must make sure\
    \ the class implements the FloorPlan by adding it in the class settings. The next\
    \ two classes, HotelLodgingBuilder and MotelLodgingBuilder, implement the lodging\
    \ builder interface and provide the custom specs for each type of lodging.\n\n\
    ```java\nclass HotelLodgingBuilder implements LodgingBuilder {\n    private Lodging\
    \ lodging;\n\n    public HotelLodgingBuilder(){\n        this.lodging = new Lodging();\n\
    \    }\n\n    @Override\n    public void buildLobbyArea() {\n        lodging.setLobbyArea(\"\
    Grand Hall\");\n    }\n\n    @Override\n    public void buildRestaurants() {\n\
    \        lodging.setRestaurants(\"5 star Buffet\");\n    }\n\n    @Override\n\
    \    public void buildRooms() {\n        lodging.setRooms(\"Luxury Suites\");\n\
    \    }\n\n    @Override\n    public void buildSwimmingPool() {\n        lodging.setSwimmingPool(\"\
    Indoor Lagoon\");\n    }\n\n    @Override\n    public Lodging getLodging() {\n\
    \        return this.lodging;\n    }\n}\n```\n\n# The HotelLodgingBuilder blueprint\
    \ construction script event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_284_0.png)\n\
    \n# The Set lodging collapsed graph node:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_284_1.png)\n\
    \nThe Add Child Actor Component is a work around for not being able to use the\
    \ Spawn Actor of Class node. We can see the HotelLodgingBuilder constructor instantiates\
    \ a new Lodging object in our code:\n\n```java\npublic HotelLodgingBuilder(){\n\
    \    this.lodging = new Lodging();\n}\n```\n\nWe will see an even more dynamic\
    \ way to initialize objects around construction script constraints when we get\
    \ to the State Pattern.\n\nHotelLodgingBuilder event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_285_0.png)\n\
    \nThe isLodgingImplementInterface function is a custom interface check function\
    \ similar the yellow hue collapsed graphs.\n\nThe isLodgingImplementInterface\
    \ function:\n"
  mdcn: "\n\n# 建造模式实现\n\n`Builder` 类包含了 Java 中的主函数。从蓝图（Blueprints）的角度来看，我们可以将此类类为真正需要物理地拖入游戏世界的类。其他的“具体”类则不需要物理地拖入世界中。\n\
    \n```java\nclass Builder_Main {\n    public static void main(String[] args) {\n\
    \        LodgingBuilder hotelBuilder = new HotelLodgingBuilder();\n        ArchitecturalEngineer\
    \ engineer = new ArchitecturalEngineer(hotelBuilder);\n\n        engineer.constructLodging();\n\
    \n        Lodging lodging = engineer.getLodging();\n\n        lodging.lodgingCharacteristics();\n\
    \    }\n}\n```\n\n`Builder_Main` 类的蓝图等实现：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_273_0.png)\n\
    \n`Set hotelBuilder` 和 `Set engineer` 的折叠图分别为：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_273_1.png)\n\
    \n以及\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_273_2.png)\n\n`Set hotelBuilder`\
    \ 折叠图代表了这行代码：`LodgingBuilder hotelBuilder = new HotelLodgingBuilder();`\n\n`Spawn\
    \ Actor From Class` 节点类似于 Java 和其他语言中的 `new` 关键字。要生成的类通过“Class”单词下方的下拉框进行选择。`Spawn\
    \ Transform` 对应于个人的特定场景。为了简单起见，我们只需右键点击 `Spawn Transform` 并选择“提升为变量（Promote to\
    \ Variable）”。如果没有 `Spawn Transform`，蓝图将带有错误编译。在所需的 actor 生成后，我们设置（或“初始化”）我们的 `hotelBuilder`\
