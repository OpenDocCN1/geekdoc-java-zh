    # Factory Method (Java)\n\n## Factory Method UML Diagram\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_295_0.png)\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_295_1.png)\n![](img/5f4ffc80ed68fa818624623b02ce6c32_295_2.png)\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_295_3.png)\n![](img/5f4ffc80ed68fa818624623b02ce6c32_295_4.png)\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_295_5.png)\n![](img/5f4ffc80ed68fa818624623b02ce6c32_295_6.png)\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_295_7.png)\n![](img/5f4ffc80ed68fa818624623b02ce6c32_295_8.png)\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_295_9.png)\n![](img/5f4ffc80ed68fa818624623b02ce6c32_295_10.png)\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_295_11.png)\n![](img/5f4ffc80ed68fa818624623b02ce6c32_295_12.png)\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_295_13.png)\n\n# Factory Method Implementation\n\
    \nWe have creator, concrete creator, and product participants in the Factory Method\
    \ design. Our example has a PotionShop abstract class as a creator. The concrete\
    \ creators are InnerRealmShop and OuterRealmPotion. These concrete creators inherit\
    \ functionality from the PotionShop abstract class. Our concrete products are:\n\
    \n- InnerHealthPotion\n- InnerRealmPowerPotion\n- InnerRealmSkillPotion\n- OuterHealthPotion\n\
    - OuterRealmPowerPotion\n- OuterRealmSkillPotion\n\nAll these products inherit\
    \ functionality from the Potion abstract class. Using blueprints, we are going\
    \ to implement the InnerRealmShop and its products, namely:\n\n- InnerHealthPotion\n\
    - InnerRealmPowerPotion\n- InnerRealmSkillPotion\n\nThe same ideas and principles\
    \ apply to the creation of the OuterRealmShop and its products.\n\nThe FactoryMethod\
    \ class contains the main function in Java. In terms of Blueprints, we can think\
    \ of this class as the one that needs to be physically dragged into the game.\
    \ The other “concrete” classes do not need to be physically dragged into the world.\n\
    \n```java\npublic class FactoryMethod_Main {\n    public static void main(String[]\
    \ args) {\n        PotionShop outerRealmShop = new OuterRealmShop();\n       \
    \ PotionShop innerRealmShop = new InnerRealmShop();\n\n        Potion potion =\
    \ outerRealmShop.orderPotion(\"Health\");\n        System.out.println(\"Potion\
    \ is \" + potion.getPotionName() + \"\\n\");\n\n        potion = innerRealmShop.orderPotion(\"\
    Health\");\n        System.out.println(\"Potion is \" + potion.getPotionName()\
    \ + \"\\n\");\n\n        potion = outerRealmShop.orderPotion(\"Power\");\n   \
    \     System.out.println(\"Potion is \" + potion.getPotionName() + \"\\n\");\n\
    \n        potion = innerRealmShop.orderPotion(\"Power\");\n        System.out.println(\"\
    Potion is \" + potion.getPotionName() + \"\\n\");\n\n        potion = outerRealmShop.orderPotion(\"\
