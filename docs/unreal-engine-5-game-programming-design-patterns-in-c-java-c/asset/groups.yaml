- md: "\n# Behavioral Patterns (Java)\n\nThe behavioral patterns we discuss help us\
    \ determine how objects interact. Additionally, object responsibilities are defined\
    \ in behavioral patterns as well. We must mention communication in are behavioral\
    \ pattern overview. Runtime communication between objects is a staple in behavioral\
    \ pattern implementations.\n\n## The Freaks Come out at night...\n\n## Observer\
    \ Pattern (Java)\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_373_0.png)\n\n##\
    \ Observer Pattern Implementation\n\nA clock tower is our publisher for the Observer\
    \ pattern example. The subscribers consist of a group of freaks who change their\
    \ behavior based on the time of day. The freaks receive notifications from the\
    \ clock tower when the clock towers' time state has changed. The Observer_Main\
    \ class:\n\n```java\npublic class Observer_Main {\n    public static void main(String[]\
    \ args) {\n        ClockTower clockTower = new ClockTower();\n\n        FreakyAllen\
    \ freakyAllen = new FreakyAllen(clockTower);\n        FreakySue freakySue = new\
    \ FreakySue(clockTower);\n        FreakyJeff freakyJeff = new FreakyJeff(clockTower);\n\
    \n        clockTower.setTimeOfDay(\"Morning\");\n        clockTower.setTimeOfDay(\"\
    Midday\");\n        clockTower.setTimeOfDay(\"Evening\");\n    }\n}\n```\n\nThe\
    \ Observer_Main blueprint event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_376_0.png)\n\
    \nThe Create ClockTower collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_376_1.png)\n\
    \nThe Create FreakyAllen collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_377_0.png)\n\
    \nLet’s implement the *Subscriber* interface:\n\n```java\npublic interface Subscriber\
    \ {\n    public void update(String time);\n}\n```\n\nLet’s implement the *Publisher*\
    \ interface:\n\n```java\npublic interface Publisher {\n    public void subscribe(Subscriber\
    \ s);\n    public void unsubscribe(Subscriber s);\n    public void notifySubscribers();\n\
    }\n```\n\n### The ClockTower class:\n\n```java\nimport java.util.ArrayList;\n\n\
    public class ClockTower implements Publisher {\n    private ArrayList<Subscriber>\
    \ subscribers;\n    private String time;\n\n    public ClockTower() {\n      \
    \  subscribers = new ArrayList<Subscriber>();\n    }\n\n    public void subscribe(Subscriber\
    \ s) {\n        subscribers.add(s);\n    }\n\n    public void unsubscribe(Subscriber\
    \ s) {\n        int i = subscribers.indexOf(s);\n        if (i >= 0) {\n     \
    \       subscribers.remove(i);\n        }\n    }\n\n    public void notifySubscribers()\
    \ {\n        for (Subscriber subscriber : subscribers) {\n            subscriber.update(time);\n\
    \        }\n    }\n\n    public void timeChanged() {\n        notifySubscribers();\n\
    \    }\n\n    public void setTimeOfDay(String time) {\n        this.time = time;\n\
    \        timeChanged();\n    }\n\n    public String getTime() {\n        return\
    \ time;\n    }\n}\n```\n\nThe ClockTower blueprint event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_380_0.png)\n\
    \nThe setTimeOfDay function:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_380_1.png)\n\
    \nThe getTime function:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_380_2.png)\n\
    \nThe timeChanged function:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_381_0.png)\n\
    \nLet's implement the Morph interface our freaks will all share:\n\n```java\n\
    public interface Morph {\n    public void morph();\n}\n```\n\nThe FreakyAllen\
    \ class:\n\n```java\npublic class FreakyAllen implements Subscriber, Morph {\n\
    \    private String time;\n    private Publisher clockTower;\n\n    public FreakyAllen(Publisher\
    \ clockTower) {\n        this.clockTower = clockTower;\n        clockTower.subscribe(this);\n\
    \    }\n\n    public void update(String time) {\n        this.time = time;\n \
    \       morph();\n    }\n\n    public void morph() {\n        if (time.equals(\"\
    Morning\")) {\n            System.out.println(\"It is \" + time + \", so FreakyAllen\
    \ makes a bowl of cereal\");\n        } else if (time.equals(\"Midday\")) {\n\
    \            System.out.println(\"It is \" + time + \", so FreakyAllen's right\
    \ eye starts to twitch\");\n        } else if (time.equals(\"Evening\")) {\n \
    \           System.out.println(\"It is \" + time + \", so FreakyAllen morphs into\
    \ a wiggle\");\n        }\n    }\n}\n```\n\nThe FreakyAllen construction:\n\n\
    ![](img/5f4ffc80ed68fa818624623b02ce6c32_383_0.png)\n\nThe Subscribe_FreakyAllen_to_ClockTower\
    \ collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_383_1.png)\n\n\
    The Print_Subscribe_Request graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_383_2.png)\n\
    \nThe FreakyAllen event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_384_0.png)\n\
    \nThe Morning_Morph collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_384_1.png)\n\
    \nThe Midday_Morph collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_385_0.png)\n\
    \nThe Evening_Morph collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_385_1.png)\n\
    \nThe other freaks follow the same implementation with the exception of the strings\
    \ that define their individual states and thus removed for brevity.\n\nThe Observer\
    \ pattern print:\n\n> Evening, so FreakyAllen morphs into a wiggle  \n> Midday,\
    \ so FreakyAllen's right eye starts to twitch  \n> Morning, so FreakyAllen makes\
    \ a bowl of cereal  \nFreakyAllen to be subscribed\n\n## Make It... State Pattern\
    \ (Java)\n\nState Pattern UML Diagram\n\n| Class | Attributes | Methods |\n| :---\
    \ | :--- | :--- |\n| OldState | | main(String[] args) |\n| OldConstructorState\
    \ | | OldConstructorState(OldStateMachine) |\n| OldStateMachine | | OldStateMachine(OldConstructorState)\
    \ |\n| OldState | - constructorState: State, - state: State, - count: int | insert(OldStateSoftMachine),\
    \ pullState(), getCount(), getConstructorState(), getOldStateState(), toString()\
    \ |\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_387_0.png)\n\n## State Pattern\
    \ Implementation\n\nWe are going to implement an old school slot machine. As we\
    \ know, there are a few states the slot machine can assume. These states are:\
    \ no coin inserted, coin inserted, no dollars, won dollars. The no dollars state\
    \ indicates the lack of funds inside of a slot machine. The won dollars state\
    \ indicate a player winning. The State_Main class:\n\n```java\npublic class State_Main\
    \ {\n    public static void main(String[] args) {\n        OldSchoolSlotMachine\
    \ oldSchoolSlotMachine = new OldSchoolSlotMachine(100);\n\n        System.out.println(oldSchoolSlotMachine.getCurrentState());\n\
    \n        oldSchoolSlotMachine.insertCoin();\n        oldSchoolSlotMachine.pullLever();\n\
    \n        System.out.println(oldSchoolSlotMachine.getCurrentState());\n\n    \
    \    oldSchoolSlotMachine.insertCoin();\n        oldSchoolSlotMachine.pullLever();\n\
    \        oldSchoolSlotMachine.insertCoin();\n\n        System.out.println(oldSchoolSlotMachine.getCurrentState());\n\
    \n        oldSchoolSlotMachine.pullLever();\n\n        oldSchoolSlotMachine.restockDinars(100);\n\
    \        oldSchoolSlotMachine.insertCoin();\n        oldSchoolSlotMachine.pullLever();\n\
    \n        System.out.println(oldSchoolSlotMachine.getCurrentState());\n    }\n\
    }\n```\n"
  mdcn: "\n\n# 行为模式 (Java)\n\n我们讨论的行为模式帮助我们确定对象之间如何交互。此外，行为模式中也定义了对象的职责。我们必须在行为模式概述中提到通信。对象之间的运行时通信是行为模式实现的核心。\n\
    \n## 变人会在深夜出没……\n\n## 观察者模式 (Java)\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_373_0.png)\n\
    \n## 观察者模式实现\n\n钟楼是我们观察者模式示例中的发布者（Publisher）。订阅者由一组根据一天之中改变行为的怪人组成。当钟楼的时间状态发生变化时，怪人会收到来自钟楼的通知。`Observer_Main`\
    \ 类：\n\n```java\npublic class Observer_Main {\n    public static void main(String[]\
    \ args) {\n        ClockTower clockTower = new ClockTower();\n\n        FreakyAllen\
    \ freakyAllen = new FreakyAllen(clockTower);\n        FreakySue freakySue = new\
    \ FreakySue(clockTower);\n        FreakyJeff freakyJeff = new FreakyJeff(clockTower);\n\
    \n        clockTower.setTimeOfDay(\"Morning\");\n        clockTower.setTimeOfDay(\"\
    Midday\");\n        clockTower.setTimeOfDay(\"Evening\");\n    }\n}\n```\n\n`Observer_Main`\
    \ 蓝图事件图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_376_0.png)\n\n`Create ClockTower`\
    \ 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_376_1.png)\n\n`Create FreakyAllen`\
    \ 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_377_0.png)\n\n让我们来实现 *Subscriber*（订阅者）接口：\n\
    \n```java\npublic interface Subscriber {\n    public void update(String time);\n\
    }\n```\n\n让我们来实现 *Publisher*（发布者）接口：\n\n```java\npublic interface Publisher {\n\
    \    public void subscribe(Subscriber s);\n    public void unsubscribe(Subscriber\
    \ s);\n    public void notifySubscribers();\n}\n```\n\n### `ClockTower` 类：\n\n\
    ```java\nimport java.util.ArrayList;\n\npublic class ClockTower implements Publisher\
    \ {\n    private ArrayList<Subscriber> subscribers;\n    private String time;\n\
    \n    public ClockTower() {\n        subscribers = new ArrayList<Subscriber>();\n\
    \    }\n\n    public void subscribe(Subscriber s) {\n        subscribers.add(s);\n\
    \    }\n\n    public void unsubscribe(Subscriber s) {\n        int i = subscribers.indexOf(s);\n\
    \        if (i >= 0) {\n            subscribers.remove(i);\n        }\n    }\n\
    \n    public void notifySubscribers() {\n        for (Subscriber subscriber :\
    \ subscribers) {\n            subscriber.update(time);\n        }\n    }\n\n \
    \   public void timeChanged() {\n        notifySubscribers();\n    }\n\n    public\
    \ void setTimeOfDay(String time) {\n        this.time = time;\n        timeChanged();\n\
    \    }\n\n    public String getTime() {\n        return time;\n    }\n}\n```\n\
    \n`ClockTower` 蓝图事件图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_380_0.png)\n\
    \n`setTimeOfDay` 函数：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_380_1.png)\n\n\
    `getTime` 函数：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_380_2.png)\n\n`timeChanged`\
    \ 函数：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_381_0.png)\n\n让我们来实现所有怪人共享的\
    \ `Morph`（变形）接口：\n\n```java\npublic interface Morph {\n    public void morph();\n\
    }\n```\n\n`FreakyAllen` 类：\n\n```java\npublic class FreakyAllen implements Subscriber,\
    \ Morph {\n    private String time;\n    private Publisher clockTower;\n\n   \
    \ public FreakyAllen(Publisher clockTower) {\n        this.clockTower = clockTower;\n\
    \        clockTower.subscribe(this);\n    }\n\n    public void update(String time)\
    \ {\n        this.time = time;\n        morph();\n    }\n\n    public void morph()\
    \ {\n        if (time.equals(\"Morning\")) {\n            System.out.println(\"\
    It is \" + time + \", so FreakyAllen makes a bowl of cereal\");\n        } else\
    \ if (time.equals(\"Midday\")) {\n            System.out.println(\"It is \" +\
    \ time + \", so FreakyAllen's right eye starts to twitch\");\n        } else if\
    \ (time.equals(\"Evening\")) {\n            System.out.println(\"It is \" + time\
    \ + \", so FreakyAllen morphs into a wiggle\");\n        }\n    }\n}\n```\n\n\
    `FreakyAllen` 构造：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_383_0.png)\n\n`Subscribe_FreakyAllen_to_ClockTower`\
