- md: "\nWe can see from the Decorator_Main that we do not need to make a separate\
    \ Enemy class to add features. We merely “Decorate” the enemy, and now we have\
    \ a projectile enemy. Effectively, we changed the behavior of the enemy at runtime\
    \ by using a decorator.\n\nThe Decorator_Main blueprint event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_118_0.png)\n\
    \nThe melee enemy and the decorated projectile enemy are broken down into separate\
    \ collapsed graphs for readability.\n\nThe Melee_Enemy_Actions collapsed graph:\n\
    \n![](img/5f4ffc80ed68fa818624623b02ce6c32_118_1.png)\n\nThe Create_Enemy collapsed\
    \ graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_119_0.png)\n\nThe *Enemy_Fight*\
    \ collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_119_1.png)\n\n\
    The *Enemy_Die* collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_120_0.png)\n\
    \nThe *Enemy_GetDamage* collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_120_1.png)\n\
    \nThe *Enemy_Damage_Message* collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_120_2.png)\n\
    \nThe *Projectile_Enemy_Actions* collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_121_0.png)\n\
    \n# The Create_Projectile_Enemy collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_121_1.png)\n\
    \nThe notable difference between the melee enemy and the projectile enemy is construction.\
    \ The projectile enemy constructor accepts the previously created enemy as an\
    \ argument. This is so we can reuse it to decorate an enemy object.\n\nThe Projectile_Enemy_Fight\
    \ collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_121_2.png)\n\n\
    The Projectile_Enemy_Die collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_122_0.png)\n\
    \nThe Projectile_Enemy_GetDamage collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_122_1.png)\n\
    \nThe Projectile_Enemy_Damage_Message collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_122_2.png)\n\
    \nThe Enemy Interface:\n\n# Enemy.h\n\n```cpp\n#pragma once\n\n#include \"CoreMinimal.h\"\
    \n#include \"UObject/Interface.h\"\n#include \"Enemy.generated.h\"\n```\n\n```cpp\n\
    // This class does not need to be modified.\nUINTERFACE(MinimalAPI)\nclass UEnemy\
    \ : public UInterface\n{\n    GENERATED_BODY()\n};\n```\n\n```cpp\n/*\n* Component\n\
    * defines an interface for objects that can have responsibilities\n* added to\
    \ them dynamically\n*/\n```\n\n```cpp\nclass DESIGN_PATTERNS_API IEnemy\n{\n \
    \   GENERATED_BODY()\n    // Add interface functions to this class. This is the\
    \ class that will be inherited to implement this interface.\npublic:\n    virtual\
    \ void Fight() = 0;\n    virtual int GetDamage() = 0;\n    virtual void Die()\
    \ = 0;\n};\n```\n\n# Enemy.cpp\n\n```cpp\n#include \"Enemy.h\"\n```\n\n// Add\
    \ default functionality here for any IEnemy functions that are not pure virtual.\n\
    \nThe Enemy interface is shared across all enemy objects. The MeleeEnemy class:\n\
    \n# MeleeEnemy.h\n\n```cpp\n#pragma once\n\n#include \"CoreMinimal.h\"\n#include\
    \ \"Decorator.h\"\n#include \"MeleeEnemy.generated.h\"\n\n/*\n * Concrete Decorators\n\
    \ * add responsibilities to the component (can extend the state)\n * of the component\n\
    \ */\n```\n\n```cpp\nUCLASS()\nclass DESIGN_PATTERNS_API AMeleeEnemy : public\
    \ ADecorator\n{\n    GENERATED_BODY()\npublic:\n    //Start Fighting\n    virtual\
    \ void Fight() override;\n\n    //Returns how much damage this enemy has taken\n\
    \    virtual int GetDamage() override;\n\n    //Kill this enemy\n    virtual void\
    \ Die() override;\n};\n```\n\n# MeleeEnemy.cpp\n\n```cpp\n#include \"MeleeEnemy.h\"\
    \n\nvoid AMeleleeEnemy::Fight()\n{\n    //Call the parent function and log a message\n\
    \    Super::Fight();\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ TEXT(\"The enemy throws punches\"));\n}\n\nint AMeleleeEnemy::GetDamage()\n\
    {\n    //Returns the base Damage + 5\n    return Super::GetDamage() + 5;\n}\n\n\
    void AMeleleeEnemy::Die()\n{\n    //Call the parent function and log a message\n\
    \    Super::Die();\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ TEXT(\"The enemy writhes in agony and disintegrates\"));\n}\n```\n\nThe MeleeEnemy\
    \ blueprint event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_128_0.png)\n\
    \nThe GetDamage function in the MeleeEnemy blueprint:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_128_1.png)\n\
    \nThe ProjectileEnemy class:\n\n```cpp\n#pragma once\n\n#include \"CoreMinimal.h\"\
    \n#include \"Decorator.h\"\n#include \"ProjectileEnemy.generated.h\"\n\nUCLASS()\n\
    class DESIGN_PATTERNS_API AProjectileEnemy : public ADecorator\n{\n    GENERATED_BODY()\n\
    \npublic:\n    //Start Fighting\n    virtual void Fight() override;\n\n    //Returns\
    \ how much damage this enemy has taken\n    virtual int GetDamage() override;\n\
    \n    //Kill this enemy\n    virtual void Die() override;\n};\n```\n\n# ProjectileEnemy.cpp\n\
    \n```cpp\n#include \"ProjectileEnemy.h\"\n\nvoid AProjectileEnemy::Fight()\n{\n\
    \    //Call the parent function and log a message\n    Super::Fight();\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"The enemy blows a kiss and fires a gun\"));\n}\n\
    \nint AProjectileEnemy::GetDamage()\n{\n    //Returns the base Damage + 95\n \
    \   return Super::GetDamage() + 95;\n}\n\nvoid AProjectileEnemy::Die()\n{\n  \
    \  //Call the parent function and log a message\n    Super::Die();\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"The enemy writhes in agony and disintegrates more\"\
    ));\n}\n```\n\nWe can see that the projectile enemy causes more damage than the\
    \ melee enemy. We use the melee damage attribute and increase it by 95 for the\
    \ projectile enemy.\n\nThe ProjectileEnemy blueprint event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_131_0.png)\n\
    \nThe GetDamage function in the ProjectileEnemy blueprint:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_131_1.png)\n\
    \nDecorator Pattern viewport print:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_132_0.png)\n\
    \nWe can see the melee enemies coming. The melee enemy fights us with punches.\
    \ The enemy dies. However, we take a 5-count damage from the melee enemy. The\
    \ melee enemy is then given new functionality in the form of a projectile. The\
    \ enemy can punch and shoot a gun causing damage of 100.\n\n# Space Travel Looks\
    \ Easy... Façade Pattern\n\nGoF defines the Façade pattern as providing a central\
    \ interface to a set of interfaces (Gamma et al., 1995). The Façade pattern is\
    \ great when we want to simplify the interaction between a client and a very complex\
    \ system.\n\n## The Good\n\n- Simplifies the use of a very complex system\n- Reduces\
    \ coupling between clients and various subsystems\n\n## The Not So Good\n\n- Hides\
    \ possibly overly complex characteristics of a subsystem\n\n## Façade Pattern\
    \ Implementation\n\nSpace travel is not easy. The most important part of space\
    \ travel is the starship. However, the starship has complexity of its own. This\
    \ is where the StarShipFacade comes into play.\n\nThe Façade main class:\n\n```cpp\n\
    #pragma once\n\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"StarShipCrewMember.h\"\n#include \"StarShipFacade_Main.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API AStarShipFacade_Main : public AActor\n\
    {\n    GENERATED_BODY()\n\npublic:\n    // Sets default values for this actor's\
    \ properties\n    AStarShipFacade_Main();\n\nprotected:\n    // Called when the\
    \ game starts or spawned\n    virtual void BeginPlay() override;\n\npublic:\n\
    \    // Called every frame\n    virtual void Tick(float DeltaTime) override;\n\
    \n};\n```\n\n# StarShipFacade.cpp\n\n```cpp\n#include \"StarShipFacade_Main.h\"\
    \n#include \"StarShipFacade.h\"\n```\n\n```cpp\n// Sets default values\nAStarShipFacade_Main::AStarShipFacade_Main()\n\
    {\n    // Set this actor to call Tick() every frame. You can turn this off to\n\
    \    improve performance if you don't need it.\n    PrimaryTick.bCanEverTick =\
    \ true;\n}\n```\n\n```cpp\n// Called when the game starts or when spawned\nvoid\
    \ AStarShipFacade_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\n    // Create\
    \ the ShipFacade Actor\n    AStarShipFacade* ShipFacade = GetWorld()->SpawnActor<AStarShipFacade>(AStarShipFacade::StaticClass());\n\
    \n    // Execute the needed Facade\n    ShipFacade->Reveille();\n    ShipFacade->PlanOfTheDay();\n\
    \    ShipFacade->Taps();\n}\n```\n\n```cpp\n// Called every frame\nvoid AStarShipFacade_Main::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n\nFaçade_Main we can see\
    \ how easy it is to run a starship. This is merely a façade using the Façade pattern.\
    \ The complexity lies ahead.\n"
  mdcn: "\n\n从 Decorator_Main 中看到，我们不需要创建一个单独 Enemy（敌人）类来添加功能。我们只需要对敌人进行“装饰”，现在我们就有了一个带射物的敌人。实质上，我们通过使用装饰器在运行时更改了敌的行为。\n\
    \nDecorator_Main 蓝图事件图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_118_0.png)\n\
    \n为了提高可读性，近战敌人和装饰后的射程敌人被拆分成了独立的折叠图。\n\nMelee_Enemy_Actions 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_118_1.png)\n\
    \nCreate_Enemy 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_119_0.png)\n\n\
    *Enemy_Fight* 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_119_1.png)\n\n\
    *Enemy_Die* 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_120_0.png)\n\n*Enemy_GetDamage*\
    \ 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_120_1.png)\n\n*Enemy_Damage_Message*\
    \ 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_120_2.png)\n\n*Projectile_Enemy_Actions*\
    \ 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_121_0.png)\n\n# Create_Projectile_Enemy\
    \ 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_121_1.png)\n\n近战敌人和射程敌人之间的显著区别在于构造。射程敌人构造函数接受之前创建的敌人作为参数。这样做我们可以重用它来装饰一个敌人对象。\n\
    \nProjectile_Enemy_Fight 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_121_2.png)\n\
    \nProjectile_Enemy_Die 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_122_0.png)\n\
    \nProjectile_Enemy_GetDamage 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_122_1.png)\n\
    \nProjectile_Enemy_Damage_Message 折叠图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_122_2.png)\n\
    \n敌人接口：\n\n# Enemy.h\n\n```cpp\n#pragma once\n\n#include \"CoreMinimal.h\"\n#include\
    \ \"UObject/Interface.h\"\n#include \"Enemy.generated.h\"\n```\n\n```cpp\n// 此类不需要修改。\n\
    UINTERFACE(MinimalAPI)\nclass UEnemy : public UInterface\n{\n    GENERATED_BODY()\n\
    };\n```\n\n```cpp\n/*\n* 为动态添加职责的组件定义接口\n*/\n```cpp\nclass DESIGN_TERTER_API IEnemy\n\
    {\n    GENERATED_BODY()\n    // 将接口添加到此类。该类将继承此接口。\n    virtual void Fight() =\
    \ 0;\n    virtual int GetDamage() = 0;\n    virtual void Die() = 0;\n};\n\n# Enemy.cpp\n\
    \n```cpp\n#include \"Enemy.h\"\n\n// 为任何纯虚 Enemy 函数添加默认功能\n\n接口在所有敌人之间共享。近战敌人类：\n\
    \n# MeleeEnemy.h\n\n```cpp\n#pragma once\n\n#include \"CoreMinimal.h\"\n#include\
    \ \"Decorator.h\"\n#include \"MeleeEnemy.generated.h\"\n\n/*\n * 具体的装饰器\n * 向组件添加职责（可以扩展状态）\n\
    \ */\n```\n\n```cpp\nUCLASS()\nclass DESIGN_PATNS_API AMeleeEnemy : public Decorator\n\
    {\n    GENERATED_BODY()\npublic:\n    // 开始战斗\n    virtual void Fight() override;\n\
    \n    // 返回敌人受到了多少伤害\n    virtual int GetDamage() override;\n\n    // 杀死敌人\n \
    \   virtual void Die() override;\n};\n```\n\n# MeleeEnemy.cpp\n\n```cpp\n#include\
    \ \"MeleeEnemy.h\"\n\nvoid AMeleeEnemy::Fight()\n{\n    // 调用父类函数并记录消息\n    Super::Fight();\n\
    \    GEngine->AddScreenDebugMessage(-1, 15.f, FColor::Yellow, TEXT(\"敌人出手了\"));\n\
    }\n\nint AMeleeEnemy::GetDamage()\n{\n    // 返回基础伤害 + 5\n    return Super::GetDamage()\
    \ + 5;\n}\n\nvoid AMeleeEnemy::Die()\n{\n    // 调用父类函数并记录消息\n    Super::Die();\n\
    \    GEngine->AddScreenDebugMessage(-1, 15.f, FColor::Yellow, TEXT(\"敌人痛苦地挣扎着\"\
    ));\n}\n```\n\n近战敌人蓝图事件图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_128_0.png)\n\
    \nMeleeEnemy 蓝图中的 GetDamage 函数：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_128_1.png)\n\
    \n射程敌人类：\n\n```cpp\n#pragma once\n\n#include \"CoreMinimal.h\"\n#include \"Decorator.h\"\
    \n#include \"ProjectileEnemy.generated.h\"\n\nUCLASS()\nclass DESIGN_TERNS_API\
    \ AProjectileEnemy : public Decorator\n{\n    GENERATED_BODY()\n\npublic:\n  \
    \  // 开始战斗\n    virtual void Fight() override;\n\n    // 返回敌人受到了多少伤害\n    virtual\
    \ int GetDamage() override;\n\n    // 杀死敌人\n    virtual void Die() override;\n\
    };\n```\n\n# ProjectileEnemy.cpp\n\n```cpp\n#include \"ProjectileEnemy.h\"\n\n\
    void AProjectileEnemy::Fight()\n{\n    // 调用父类函数并记录消息\n    Super::Fight();\n \
    \   GEngine->AddScreenDebugMessage(-1, 15.f, FColor::Yellow, TEXT(\"敌人飞了一个吻并射了枪\"\
    ));\n}\n\nint AProjectileEnemy::GetDamage()\n{\n    // 返回基础伤害 + 95\n    return\
    \ Super::GetDamage() + 95;\n}\n\nvoid AProjectileEnemy::Die()\n{\n    // 调用父类函数并记录消息\n\
    \    Super::Die();\n    GEngine->AddScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ TEXT(\"敌人痛苦地挣扎并瓦解得更彻底\"));\n}\n```\n\n我们可以看到射程敌人造成的伤害比近战敌人更多。我们使用了近战伤害属性并为射程敌人增加了\
    \ 95。\n\nProjectileEnemy 蓝图事件图：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_131_0.png)\n\
    \nProjectileEnemy 蓝图中的 GetDamage 函数：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_131_1.png)\n\
    \n装饰器模式视图打印：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_132_0.png)\n\n我们可以看到近战敌人过来了。近战敌人用拳头与我们战斗。敌人死了。然而，我们从近战敌人那里受到了\
    \ 5 点伤害。随后，近战敌人被赋予了射物形式的新功能。敌人可以挥拳并射击，造成 100 点伤害。\n\n# 太空旅行看起来看起来简单……外观模式 (Facade\
    \ Pattern)\n\nGoF 定义外观模式为为一组接口提供一个中心接口（Gamma 等人，1995）。当我们想要简化客户端与非常复杂的系统之间的交互时，外观模式非常棒。\n\
    \n## 优点\n\n- 简化了非常复杂系统的使用\n- 减少了客户端与各种系统之间的耦合\n\n## 缺点\n\n- 隐藏了子系统可能复杂的特性\n\n\
    ## 外观模式实现\n\n太空旅行并不容易。太空旅行最重要的部分是飞船。然而，飞船有自己的复杂性。这就是外观模式大显身手的地方。\n\n外观类：\n\n```cpp\n\
    #pragma once\n\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"StarShipCrewMember.h\"\n#include \"StarShipFacade_Main.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_NS_API AStarShipFacade_Main : public AActor\n{\n  \
    \  GENERATED_BODY()\n\npublic:\n    // 设置此类的默认值\n    AStarShipFacade_Main();\n\
    \nprotected:\n    // 游戏开始或生成时调用\n    virtual void BeginPlay() override;\n\npublic:\n\
    \    // 每帧调用\n    virtual void Tick(float DeltaTime) override;\n\n};\n```\n\n\
    # StarShipFacade.cpp\n\n```cpp\n#include \"StarShipFacade_Main.h\"\n#include \"\
    StarShipFacade.h\"\n```\n\n```cpp\n// 设置默认值\nAStarShipFacade_Main::AStarShipFacade_Main()\n\
    {\n    // 设置此 Actor 每帧调用 Tick()。如果不需要，可以关闭以提高性能。\n    PrimaryTick.bCanEverTick\
    \ = true;\n}\n```\n\n```cpp\n// 游戏开始或生成时调用\nvoid AStarShipFacade_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n\n    // 创建 ShipFacade Actor\n    AStarShipFacade*\
    \ ShipFacade = GetWorld()->SpawnActor<AStarShipFacade>(AStarShipFacade::StaticClass());\n\
    \n    // 执行需要的外观方法\n    ShipFacade->Reveille();\n    ShipFacade->PlanOfTheDay();\n\
    \    ShipFacade->Taps();\n}\n```\n\n```cpp\n// 每帧调用\nvoid AStarShipFacade_Main::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n\n通过 Facade_Main我们可以看到运行飞船有多简单。这仅仅是使用外观模式的外观。复杂性在后面。\n\
    \n"
