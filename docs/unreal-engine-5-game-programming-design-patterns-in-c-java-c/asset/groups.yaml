  mdcn: "\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_351_0.png)\n\n我们可以看到近战敌人正在靠近。近战敌人用拳头攻击我们。随后敌人死亡了。然而，我们受到了近战敌人造成的\
