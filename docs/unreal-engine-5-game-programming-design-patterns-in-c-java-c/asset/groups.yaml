    ```\n\n```cpp\nvoid ALodging::SetLobbyArea(FString myLobbyArea)\n{\n    // 设置大堂区域的名字\n\
    \    LobbyArea = myLobbyArea;\n}\n```\n\n```cpp\nvoid ALodging::SetRooms(FString\
    \ myRooms)\n{\n  // 设置房间的名字\n  Rooms = myRooms;\n}\n```\n\n```cpp\nvoid ALodging::SetRestaurants(FString\
    \ myRestaurants)\n{\n  // 设置餐厅的名字\n  Restaurants = myRestaurants;\n}\n```\n\n\
    ```cpp\nvoid ALodging::LodgingCharacteristics()\n{\n  // 记录每一层的名字\n  GEngine->AddOnScreenMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), *SwimmingPool));\n  // -1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), *LobbyArea)); // 注意：此处修正了逻辑对应\n\
    \  // -1, 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), *Rooms));\n  //\
    \ -1, 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), *Restaurants));\n}\n\
    ```\n\n还记得主蓝图中的 **LodgingCharacteristics** 节点吗？在这里：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_32_0.png)\n\
    \nLodging 蓝图还包含架构工程师之后调用的事件：\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_33_0.png)\n\
    \n蓝图使用事件节点。Lodging 类的蓝图版本除了设置本地变量外，还会打印传递的值。此外，我们必须在类设置中确保此类实现了 FloorPlan 接口。该类是\
    \ *HotelLodgingBuilder*。它实现了 lodging 接口并为每种类型的 lodging 提供了自定义规格。\n\n# HotelLodgingBuilder.h\n\
    \n```cpp\n#pragma once\n\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"LodgingBuilder.h\"\n#include \"HotelLodgingBuilder.generated.h\"\n\
    ```\n\n```cpp\nUCLASS()\nclass DESIGN_PATTERNS_API AHotelLodgingBuilder : public\
    \ AActor, public ILodgingBuilder\n{\n    GENERATED_BODY()\n\npublic:\n    // 设置此节点属性的默认值\n\
    \    AHotelLodgingBuilder();\n\nprivate:\n    // Lodging Actor\n    UPROPERTY(VisibleAnywhere,\
    \ Category = \"Hotel Lodging\")\n    class ALodging* Lodging;\n\nprotected:\n\
    \    // 当游戏开始或生成时被调用\n    virtual void BeginPlay() override;\n\npublic:\n    //\
    \ 每帧调用\n    virtual void Tick(float DeltaTime) override;\n\n    // 创建游泳池\n   \
    \ virtual void BuildSwimmingPool() override;\n\n    // 创建大堂区域\n    virtual void\
    \ BuildLobbyArea() override;\n\n    // 创建餐厅\n    virtual void BuildRestaurants()\
    \ override;\n\n    // 创建房间\n    virtual void BuildRooms() override;\n\n    //\
    \ 返回 Lodging\n    virtual class ALodging* GetLodging() override;\n};\n```\n\n\
    # HotelLodgingBuilder.cpp\n\n```cpp\n#include \"HotelLodgingBuilder.h\"\n#include\
    \ \"Lodging.h\"\n```\n\n```cpp\n// 设置默认值\nAHotelLodgingBuilder::AHotelLodgingBuilder()\n\
    {\n    // 设置此节点每帧调用 Tick()。\n    // 如果不需要，可以关闭它来提高性能。\n    PrimaryActor::Tick.bCanEverTick\
    \ = true;\n}\n```\n\n```cpp\n// 当游戏开始或生成时调用\nvoid AHotelLodgingBuilder::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    \n    // 生成 Lodging Actor\n    Lodging = GetWorld()->SpawnActor<ALodging>(ALodging::StaticClass());\n\
    \    // 将其挂载到构建器（自己）\n    if (Lodging)\n        Lodging->AttachToActor(this, FAttachmentTransformRules::KeepRelativeTransform());\n\
    }\n```\n\n```cpp\n// 每帧调用\nvoid AHotelLodgingBuilder::Tick(float DeltaTime)\n\
    {\n    Super::Tick(DeltaTime);\n}\n```\n\n```cpp\nvoid AHotelLodgingBuilder::BuildSwimmingPool()\n\
    {\n    if (!Lodging) \n    {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildSwimmingPool():\
    \ Lodging is NULL, make sure it's initialized.\"));\n        return;\n    }\n\
    \    // 设置 Lodging 的游泳池\n    Lodging->SetSwimmingPool(\"Indoor Lagoon\");\n}\n\
    ```\n\n```cpp\nvoid AHotelLodgingBuilder::BuildLobbyArea()\n{\n    if (!Lodging)\
    \ \n    {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildLobbyArea(): Lodging is\
    \ NULL, make sure it's initialized.\"));\n        return;\n    }\n    // 设置 Lodging的大堂区域\n\
    \    Lodging->SetLobbyArea(\"Grand Hall\");\n}\n```\n\n```cpp\nvoid AHotelLodgingBuilder::BuildRestaurants()\n\
    {\n    if (!Lodging) \n    {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildRestaurants():\
    \ Lodging is NULL, make sure it's initialized.\"));\n        return;\n    }\n\
    \    // 设置 Lodging 的餐厅\n    Lodging->SetRestaurants(\"5 star Buffet\");\n}\n```\n\
    \n```cpp\nvoid AHotelLodgingBuilder::BuildRooms()\n{\n    if (!Lodging) \n   \
    \ {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildRooms(): Lodging is NULL, make\
    \ sure it's initialized.\"));\n        return;\n    }\n    // 设置 Lodging 的房间\n\
    \    Lodging->SetRooms(\"Luxury Suites\");\n}\n```\n\n```cpp\nALodging* AHotelLodgingBuilder::GetLodging()\n\
    {\n    // 返回构建器的 Lodging Actor（自己）\n    return Lodging;\n}\n```\n\n"
