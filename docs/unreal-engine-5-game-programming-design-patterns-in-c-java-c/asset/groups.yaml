    ![](img/5f4ffc80ed68fa818624623b02ce6c32_197_0.png)\n\nThe other freaks follow\
    \ the same implementation with the exception of the strings that define their\
    \ individual states and thus removed for brevity.\n\nThe Observer pattern viewport\
    \ print:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_197_1.png)\n\n# Make It Rain...\
    \ State Pattern\n\nThe GoF describes the State pattern as allowing object to change\
    \ their behavior when their internal state changes (Gamma et.al.).\n\n## The Good\n\
    - Localizes state behavior (Gamma et.al.).\n\n## The Not So Good\n- Fairly similar\
    \ to Strategy pattern\n\n## State Pattern Implementation\nWe are going to implement\
    \ an old slot machine. As we know, there are a few states the slot machine can\
    \ assume: no coin, coin inserted, no dollars, won dollars. The no dollars state\
    \ indicates the lack of funds. The won dollars state indicates a player winning.\n\
    \n### State_Main.h\n```cpp\n#pragma once\n\n#include \"CoreMinimal.h\"\n#include\
    \ \"GameFramework/Actor.h\"\n#include \"State_Main.generated.h\"\n\nUCLASS()\n\
    class DESIGN_PATTERNS_API AState_Main : public AActor\n{\n    GENERATED_BODY()\n\
    \npublic:\n    // Sets default values for this actor\n    AState_Main();\n\nprotected:\n\
    \    // Called when the game starts or spawned\n    virtual void BeginPlay() override;\n\
    \npublic:\n    // Called every frame\n    virtual void Tick(float DeltaTime) override;\n\
    };\n```\n\n### State_Main.cpp\n```cpp\n#include \"State_Main.h\"\n#include \"\
    OldSchoolSlotMachine.h\"\n\nAState_Main()\n{\n    // Set actor to call Tick()\
    \ every frame. You can turn this off to improve performance if you don't need\
    \ it.\n    PrimaryActorTick.bCanEverTick = true;\n}\n\nvoid AState_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n\n    // Create the Slot Machine and set its Dollars\
    \ to 100\n    OldSchoolSlotMachine* OldSchoolSlotMachine = GetWorld()->SpawnActor<OldSchoolSlotMachine>(OldSchoolSlotMachine::StaticClass());\n\
    \    OldSchoolSlotMachine->Initialize(100);\n\n    // Log the current Slot Machine\
    \ state\n    GEngine->AddOnScreenMessage(-1, 5.f, FColor::Yellow, FString::Printf(TEXT(\"\
    %s\"), OldSchoolSlotMachine->GetState()->ToString()));\n\n    // Insert coin and\
    \ Pull the lever\n    OldSchoolSlotMachine->InsertCoin();\n    OldSchoolSlotMachine->PullLever();\n\
    \n    // Log the current Slot Machine state\n    GEngine->AddOnScreenMessage(-1,\
    \ 5.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), OldSchoolSlotMachine->GetState()->ToString()));\n\
    \n    // Insert coin, Pull the lever, then coin again\n    OldSchoolSlotMachine->InsertCoin();\n\
    \    OldSchoolSlotMachine->PullLever();\n    OldSchoolSlotMachine->InsertCoin();\n\
    \n    // Pull the lever\n    OldSchoolSlotMachine->PullLever();\n\n    // Add\
    \ 100 Dollars\n    OldSchoolSlotMachine->RestockDollars(100);\n\n    // Insert\
    \ coin and Pull the lever\n    OldSchoolSlotMachine->InsertCoin();\n    OldSchoolSlotMachine->PullLever();\n\
    \n    // Log the current Slot Machine state\n    GEngine->AddOnScreenMessage(-1,\
    \ 5.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), OldSchoolSlotMachine->GetState()->ToString()));\n\
    }\n\n// Called every frame\nvoid AState_Main::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n```\n\nThe State_Main blueprint event graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_202_0.png)\n\
    \nThe Create OldSchoolSlotMachine collapsed node:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_202_1.png)\n\
