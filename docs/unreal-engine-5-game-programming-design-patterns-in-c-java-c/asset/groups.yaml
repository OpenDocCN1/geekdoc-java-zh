    \n# The kill_yourself collapsed graph:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_96_0.png)\n\
    \n# The Singleton viewport print:\n\n![](img/5f4ffc80ed68fa818624623b02ce6c32_96_1.png)\n\
    \n# Structural Patterns\n\nThe structural patterns help us to compose larger structures\
    \ from classes. One the most important goals of this category is to be able to\
    \ alter composition at runtime.\n\n# Adapt and Overcome...\n\nA large amount of\
    \ modern technology uses the idea of wrapper. One can think of high-level programming\
    \ as wrappers around lower-level programming. But how do these languages communicate?\
    \ We need some sort of adapter to facilitate classes to work together because\
    \ of incompatible interfaces.\n\n## The Good\n- Reuse complex code\n- Fairly easy\
    \ to implement\n\n## The Not So Good\n- Can overuse just to get a square peg into\
    \ a round hole\n- Difficulty in recognizing necessity for new implementation\n\
    \n## Adapter Pattern\n\nIn our Adapter pattern implementation, we have a shooter\
    \ who uses a shot. We want to be able to allow our shooter to fire a gun. However,\
    \ we want to use the existing code we have implemented by using the Adapter pattern.\n\
    \n# The main class:\n\n```cpp\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"Adapter_Main.generated.h\"\n```\n\n```cpp\nUCLASS()\nclass DESIGN_PATTERNS_API\
    \ AAdapter_Main : public AActor\n{\n    GENERATED_BODY()\n\npublic:\n    // Sets\
    \ default values for this actor's properties\n    AAdapter_Main();\n\nprivate:\n\
    \    //The Shooter that holds Gun Adapter\n    UPROPERTY()\n    class AShooter*\
    \ Shooter;\n\nprotected:\n    // Called when the game starts or when spawned\n\
    \    virtual void BeginPlay() override;\n\npublic:\n    // Called every frame\n\
    \    virtual void Tick(float DeltaTime) override;\n\n};\n```\n\n# Adapter_Main.cpp\n\
    \n```cpp\n#include \"Adapter_Main.h\"\n#include \"GunAdapter.h\"\n#include \"\
    Shooter.h\"\n```\n\n```cpp\n// Sets default values\nAAdapter_Main::AAdapter_Main()\n\
    {\n    // Set this actor to call Tick() every frame. You can turn this off to\n\
    \    // improve performance if you don't need it.\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// Called when the game starts or when spawned\nvoid AAdapter_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n\n    // Spawn the Gun Adapter\n    AGunAdapter* GunAdapter\
    \ = GetWorld()->SpawnActor<AGunAdapter>(AGunAdapter::StaticClass());\n\n    //\
    \ Spawn the Shooter and set the Gun Adapter\n    Shooter = GetWorld()->SpawnActor<AShooter>(AShooter::StaticClass());\n\
    \    Shooter->SetSlingShot(GunAdapter);\n\n    // Shoot\n    Shooter->Sling();\n\
    }\n\n// Called every frame\nvoid AAdapter_Main::Tick(float DeltaTime)\n{\n   \
