  - '[PAGE 51]


    # Boil and Bubble, Brew and Bottle...

    Factory Method


    GoF says the intent of the Factory Method is to “define an interface for creating
    an object, but let subclasses decide which class to instantiate” (Gamma et.al,
    1995). The Factory Method invokes another important object-oriented principle.
    That principle is called “Dependency Inversion”. We want subclasses to depend
    on abstractions and not the other way around. Basically, we want children to depend
    on their parents.


    # The Good


    +   - Encapsulate instantiation

    - Concrete products are not coupled to their creator


    # The Not So Good


    +   - Can create difficult to follow code because of the level of abstraction.


    # Factory Method Implementation


    We have creator, concrete creator, and product participants in the Factory Method
    design pattern. Our example implementation has a PotionShop abstract class as
    a creator. The concrete creators are InnerRealmPotionShop and OuterRealmPotionShop.
    These concrete creators inherit functionality from the PotionShop abstract class.
    Our products are:


    ```

    InnerRealmHealthPotion

    InnerRealmPowerPotion

    InnerRealmSkillPotion

    OuterRealmHealthPotion

    OuterRealmPowerPotion

    OuterRealmSkillPotion

    ```


    All these products inherit functionality from the Potion abstract class.'
