    \nprotected:\n    // Called when the game starts or when spawned\n    virtual\
    \ void BeginPlay() override;\n\npublic:\n    // Called every frame\n    virtual\
    \ void Tick(float DeltaTime) override;\n};\n```\n\n## FactoryMethod_Main.cpp\n\
    \n```cpp\n#include \"FactoryMethod_Main.h\"\n#include \"OuterRealmPotionShop.h\"\
