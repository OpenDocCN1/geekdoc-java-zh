  md: 'allocated memory back to the heap. The size of the heap shrinks and fries during
    the program''s execution as the program deallocates and allocates dynamic memory
    using the delete and new.


    +   * Stack: Function parameters and local variables are always stored in the
    stack. Function parameters and local variables disappear when the function returns
    and appears when a function is called. The size of the stack also shrinks and
    grows during the program''s execution as various functions execute.


    Generally, operating systems limit the size of the stack. Deep recursion can consume
    a considerable amount of stack space. For example, let''s consider an improperly
    written recursive function of one that omits the base case and thus exhibits as
    an "infinite" recursion that would consume all the space that is available on
    the stack. A situation such as is known as a stack overflow. Modern operating
    systems terminate any process that consumes a lot of stack space. However, on
    some embedded systems, this stack overflow may go undetected. Typically, heap
    space is plentiful, and operating systems can use virtual memory to provide more
    space than it''s available in real memory for an executing program. The extra
    space for the virtual memory comes from a disk drive, and the operating system
    shuttles data from the disk to real memory as needed by the executing program.
    Programs that make use of a virtual memory run a lot more slowly than programs
    that make use of little virtual memory.


