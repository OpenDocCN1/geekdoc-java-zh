  md: '+   ○ Class names can contain numbers, letters, dollar signs, and underscores.
    Dollar signs and underscores are usually not used.


    +   ○ Blanks or periods aren''t allowed in class names.


    +   ○ Class names cannot start with a number.


    +   ○ Class names typically start with an uppercase letter.


    +   ○ If the class name includes more than one word, the first letter of each
    word is usually uppercase, and the rest of the letters are lowercase.


    +   ○ Classes can have one or more constructors.


    +   ○ The class constructor is named the same as the class and must be declared
    as public. Constructors will be explained more in later lessons.


    +   ○ A constructor is called by using new, followed by the name of the constructor
    and parentheses. For example, new HelloWorld() in the main() method calls the
    HelloWorld constructor.


    +   ○ Blocks of code are enclosed in curly brackets, { }, and each line of code
    ends with a semicolon;


    +   ○ Every Java program runs the main() method first. ○ The main() method calls
    the class constructor in all the programs in this book. Therefore, the main()
    method will run first, followed by the class constructor.


    +   ○ Each statement within the curly brackets is run, one at a time, in the order
    it appears in the code.


    +   ○ Blank lines between lines of code have no effect on how the code runs. Blank
    lines are added to make the code easier for you to read.


    +   ○ Print ( ) statements print the text in the parentheses to a window.


    +   ○ Each print() statement prints on a new line.


    +   ○ To print a blank line, use print() with empty parentheses.'
