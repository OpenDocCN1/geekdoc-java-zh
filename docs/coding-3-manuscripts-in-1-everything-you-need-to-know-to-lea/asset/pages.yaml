    ''Hello World''

    "Hello World"


    The two statements would produce the same output if we were to run it.


    # Using Quotes Inside Strings


    In Python programming, using strings, an opening string with a quote must match
    the ending quote. When you begin a string using a double quotation mark, Python
    takes the next double quotation mark as the ending of the string. This applies
    to a single quotation mark.


    If you decide to use double quotes inside a string, you have to escape the single,
    and double them inside single quotes. The example below will show it better.

    statement = ''Fred is a boy that lives in New York"


    Let''s assume you want to use both single and double quotes in a string. In this
    situation, you have to escape the single, and double quote misses by using backslash
    (\). The example below will demonstrate it.


    ```

    statement_in_single = ''Fred\''s a wonderful car in his garage''

    statement_in_double = "Fred \s a wonderful car in his garage\"

    ```


    # Methods to Change Case in String


    One simple task you can perform using strings is to change the case of a particular
    word. What do you think the output will be for the code below?

    full_name = "johnson boris"


    ```

    print(full_name.title())

    Once you write the code, save the file as name.py before running it.

    The output will be as:

    Johnson Boris

    ```'
