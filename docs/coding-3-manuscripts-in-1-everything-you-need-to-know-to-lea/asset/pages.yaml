    +   * Function: Refers to a code block that is called when a programmer uses a
    calling program. The goal is to also provide free services and accurate calculation.

    * Class: A template for developing user-defined objects. It is friendly and easy
    to use by everyone, including the beginners.


    Ver Immutable: Refers to an object with a fixed value and is contained within
    the code. These can be numbers, strings, or tuples. Such as an object cannot be
    changed.


    St Docstring: Refers to a string that is displayed in the function, class definition,
    and module. This object is always available in the documentation tools.


    +   * List: Refers to the data type built into the Python and contains values
    sorted. Such values include strings and numbers.


    LE IDLE: Stands for an integrated development environment that allows the users
    to type the code while interpreting and editing it in the same window. Best suited
    for beginners because it is an excellent example of code.

    Interactive: Python has become the most suitable programming language for beginners
    due to its interactive nature. As a beginner, you can try many things in the IDLE
    (interpreter to see their response and effects).


    Qu Triple Quoted String: The string helps an individual to have single and double
    quotes in the string, making it easy to go through different lines of code.


    +   * Object: It refers to all data in a state such as attitudes, methods, defined
    behaviors, or values.

    * Type: Refers to a group of data categories in the programming language and differences
    in properties, functions, and methods.'
