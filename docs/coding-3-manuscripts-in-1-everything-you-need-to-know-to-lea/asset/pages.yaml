  md: '# Avoiding Variable Name Errors


    As a beginner, you will make mistakes. Professionals aren’t exempted from this
    situation, but they know how to tackle these these errors efficiently. Let us
    look at a more likely mistake you will make as you are beginning your Python-programming
    course. I will intentionally write an error code by misspelling the word "outcome."


    ```

    outcome = "Hello, Welcome to Learning Python!"

    #program will generate an error

    print(outcome)

    ```


    When such an error occurs, the Python interpreter figures the best way to solve
    the problem. It provides a traceback once the program cannot run successfully.
    Not many programming languages have this feature to traceback an error. Let us
    look at how the interpreter will respond to our program above


    +   Traceback (most recent call last):

    1. File "hello.py", line 3, in <module>

    2. Print(outcome)


    +   3. NameError: name ‘outcome’ is not defined Line 1 reports the presence of
    an error in line 3 with filename “hello.py” however, the interpreter quickly identifies
    the error and informs us what particular type of error it is in line 3. In a situation
    like this will signify a name error. Additionally, it will reports that our variable
    hasn’t been properly defined. Whenever you see a name error, it means there is
    a spelling error, or we didn’t set a value to the variable. However, in example,
    it was a wrong spelling where we didn’t include the letter “e” from our variable.


    ```

    outcome="Hello, Welcome to Python Programming!"

    print(outcome)

    out = "Hello, Welcome to Learning Python!"

    print(outcome)

    The program output will be:

    ```'
