    \        Path realPath = path.toRealPath(LinkOption.NOFOLLOW_LINKS);\n       \
    \ System.out.println(realPath.toString());\n        String originalPath = \"d:\\\
    \\data\\\\projects\\\\a-project\\\\..\\\\another-project\";\n        Path path1\
    \ = Paths.get(originalPath);\n        Path path2 = path1.normalize();\n      \
    \  System.out.println(\"path2 = \" + path2);\n    }\n}\n```\n\n# File\n\nJava\
    \ NIO package provide one more utility API named as `Files` which is basically\
    \ used for manipulating files and directories using its static methods which mostly\
    \ works on `Path` object.\n\nAs mentioned in Path tutorial that `Path` interface\
    \ is introduced in Java NIO package during Java 7 version in file package. So\
    \ this tutorial is for same File package. \n\nThis class consists exclusively\
    \ of static methods that operate on files, directories, or other types of files.\
    \ In most cases, the methods defined here will delegate to the associated file\
    \ system provider to perform the file operations.\n\nThere are many methods defined\
    \ in the `Files` class which could also be read from Java docs. In this tutorial\
    \ we tried to cover some of the important methods among all of the methods of\
    \ Java NIO `Files` class.\n\n## Important methods of Files class.\n\nFollowing\
    \ are the important methods defined in Java NIO `Files` class.\n\n* `createFile(Path\
    \ filePath, FileAttribute attrs)` − `Files` class provides this method to create\
    \ file using specified `Path`.\n\n## Example\n\n```java\npackage com.java.nio;\n\
    \nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
    import java.nio.file.Paths;\n\npublic class CreateFile {\n    public static void\
    \ main(String[] args) {\n        //initialize Path object\n        Path path =\
    \ Paths.get(\"D:file.txt\");\n        //create file\n        try {\n         \
