    \nSo far we know that what is path interface why do we need that and how could\
    \ we access it. Now we would know what are the important methods which Path interface\
    \ provide us.\n\n## Important methods of Path Interface\n\n* `getFileName()` −\
    \ Returns the file system that created this object.\n* `getName()` − Returns a\
    \ name element of this path as a `Path` object.\n* `getNameCount()` − Returns\
    \ the number of name elements in the path.\n* `subpath()` − Returns a relative\
    \ `Path` that is a subsequence of the name elements of this path.\n* `getParent()`\
    \ − Returns the parent path, or null if this path does not have a parent.\n* `getRoot()`\
    \ − Returns the root component of this path as a `Path` object, or null if this\
