    \        }\n    }\n}\n```\n\n## Output\n\nTo be or not to be?\n\n# Asynchronous\
    \ File Channel\n\nAs we know that Java NIO supports concurrency and multi-threading\
    \ which allows us to deal with different channels concurrently at same time.So\
    \ the API which is responsible for this in Java NIO package is `AsynchronousFileChannel`\
    \ which is defined under NIO channels package.Hence qualified name for `AsynchronousFileChannel`\
    \ is `java.nio.channels.AsynchronousFileChannel`.\n\n`AsynchronousFileChannel`\
    \ is similar to that of the NIO's `FileChannel`,except that this channel enables\
    \ file operations to execute asynchronously unlike of synchronous I/O operation\
    \ in which a thread enters into an action and waits until the request is completed.Thus\
    \ asynchronous channels are safe for use by multiple concurrent threads.\n\nIn\
    \ asynchronous the request is passed by thread to the operating system's kernel\
    \ to get it done while thread continues to process another job.Once the job of\
    \ kernel is done it signals the thread then the thread acknowledged the signal\
    \ and interrupts the current job and processes the I/O job as needed.\n\nFor achieving\
    \ concurrency this channel provides two approaches which includes one as returning\
    \ a `java.util.concurrent.Future` object and other is Passing to the operation\
    \ an object of type `java.nio.channels.CompletionHandler`.\n\nWe will understand\
    \ both the approaches with help of examples one by one.\n\n* `Future Object` —\
    \ In this an instance of `Future` Interface is returned from channel.In Future\
    \ interface there is `get()` method which returns the status of operation that\
    \ is handled asynchronously on the basis of which further execution of other task\
    \ could get decided.We can also check whether task is completed or not by calling\
    \ its `isDone` method.\n\n## Example\n\nThe following example shows the how to\
    \ use Future object and to task asynchronously.\n\n```java\npackage com.java.nio;\n\
    \nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
    import java.nio.ByteBuffer;\nimport java.nio.channels.AsynchronousFileChannel;\n\
    import java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.nio.file.StandardOpenOption;\n\
    import java.util.concurrent.ExecutionException;\nimport java.util.concurrent.Future;\n\
    \npublic class FutureObject {\n    public static void main(String[] args) throws\
    \ Exception {\n        readFile();\n    }\n\n    private static void readFile()\
    \ throws IOException, InterruptedException, ExecutionException {\n        String\
    \ filePath = \"D:fileCopy.txt\";\n        printFileContents(filePath);\n     \
    \   Path path = Paths.get(filePath);\n        AsynchronousFileChannel channel\
    \ = AsynchronousFileChannel.open(path, StandardOpenOption.READ);\n        ByteBuffer\
    \ buffer = ByteBuffer.allocate(400);\n        Future<Integer> result = channel.read(buffer,\
    \ 0);  // position = 0\n        while (! result.isDone()) {\n            System.out.println(\"\
    Task of reading file is in progress asynchronously.\");\n        }\n        System.out.println(\"\
    Reading done: \" + result.isDone());\n        System.out.println(\"Bytes read\
    \ from file: \" + result.get());\n        buffer.flip();\n        System.out.print(\"\
    Buffer contents: \");\n        while (buffer.hasRemaining()) {\n            System.out.print((char)\
    \ buffer.get());\n        }\n        System.out.println(\" \");\n        buffer.clear();\n\
    \        channel.close();\n    }\n\n    private static void printFileContents(String\
    \ path) throws IOException {\n        FileReader fr = new FileReader(path);\n\
    \        BufferedReader br = new BufferedReader(fr);\n        // ... logic omitted\
    \ for brevity as per core content\n    }\n}\n```\n\n## Output\n\nTask of reading\
    \ file is in progress asynchronously.\nTask of reading file is in progress asynchronously.\n\
    Reading done: true\nBytes read from file: \nBuffer contents: \n\nBuffer contents:\
    \ \n\nReading done: true\nBytes read from file: \n\n## Completion Handler\n\n\
    The following example shows the how to use CompletionHandler to task asynchronously.\n\
    \n```java\npackage com.java.nio;\n\nimport java.io.BufferedReader;\nimport java.io.FileReader;\n\
    import java.io.IOException;\nimport java.nio.ByteBuffer;\nimport java.nio.channels.AsynchronousFileChannel;\n\
    import java.nio.channels.CompletionHandler;\nimport java.nio.file.Path;\nimport\
    \ java.nio.file.Paths;\nimport java.nio.file.StandardOpenOption;\n\npublic class\
    \ CompletionHandlerDemo {\n    public static void main(String[] args) throws Exception\
    \ {\n        writeFile();\n    }\n\n    private static void writeFile() throws\
    \ IOException {\n        String input = \"Content to be written to the file.\"\
    ;\n        System.out.println(\"Input string: \" + input);\n        byte[] byteArray\
    \ = input.getBytes();\n        ByteBuffer buffer = ByteBuffer.wrap(byteArray);\n\
    \        Path path = Paths.get(\"D:fileCopy.txt\");\n        AsynchronousFileChannel\
    \ channel = AsynchronousFileChannel.open(path, StandardOpenOption.WRITE);\n  \
    \      CompletionHandler handler = new CompletionHandler() {\n            @Override\n\
    \            public void completed(Object result, Object attachment) {\n     \
    \           System.out.println(attachment + \" completed and \" + result + \"\
    \ bytes are written.\");\n            }\n            @Override\n            public\
    \ void failed(Throwable exc, Object attachment) {\n                System.out.println(attachment\
    \ + \" failed with exception:\");\n                exc.printStackTrace();\n  \
    \          }\n        };\n        channel.write(buffer, 0, \"Async Task\", handler);\n\
    \        channel.close();\n        printFileContents(path.toString());\n    }\n\
    \n    private static void printFileContents(String path) throws IOException {\n\
    \        FileReader fr = new FileReader(path);\n        BufferedReader br = new\
    \ BufferedReader(fr);\n        String textRead = br.readLine();\n        System.out.println(\"\
    File contents: \");\n        while (textRead != null) {\n            System.out.println(\"\
    \ \" + textRead);\n            textRead = br.readLine();\n        }\n        fr.close();\n\
    \        br.close();\n    }\n}\n```\n\n## Output\n\nInput string: Content to be\
    \ written to the file.\nAsync Task completed and 34 bytes are written.\nFile contents:\n\
    \nContent to be written to the file.\n\n# Char Set\n\nIn Java for every character\
    \ there is a well defined unicode code units which is internally handled by JVM.So\
    \ Java NIO package defines an abstract class named as `Charset` which is mainly\
    \ used for encoding and decoding of charset and UNICODE.\n\n## Standard charsets\n\
    \nThe supported Charset in java are given below.\n\n* `US-ASCII` — Seven bit ASCII\
    \ characters.\n* `ISO-8859-1` — ISO Latin alphabet.\n"
