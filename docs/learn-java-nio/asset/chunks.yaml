    \nAs we know that Java NIO is a more optimized API for data IO operations as compared\
    \ to the conventional IO API of Java.One more additional support which Java NIO\
    \ provides is to read/write data from/to multiple buffers to channel.This multiple\
    \ read and write support is termed as Scatter and Gather in which data is scattered\
    \ to multiple buffers from single channel in case of read data while data is gathered\
    \ from multiple buffers to single channel in case of write data.\n\nIn order to\
    \ achieve this multiple read and write from channel there is `ScatteringByteChannel`\
    \ and `GatheringByteChannel` API which Java NIO provides for read and write the\
    \ data as illustrate in below example.\n\n## ScatteringByteChannel\n\n**Read from\
    \ multiple channels** - In this we made to reads data from a single channel into\
    \ multiple buffers.For this multiple buffers are allocated and are added to a\
    \ buffer type array.Then this array is passed as parameter to the `ScatteringByteChannel\
    \ read()` method which then writes data from the channel in the sequence.Once\
    \ a buffer is full, the channel moves on to the next buffer.\n\nThe following\
    \ example shows how scattering of data is performed in Java\n\n### `C:/Test/temp.txt`\n\
    \nHello World!\n\nimport java.io.FileInputStream;\nimport java.io.FileNotFoundException;\n\
