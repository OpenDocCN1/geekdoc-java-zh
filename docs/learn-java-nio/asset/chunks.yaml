  trans: "\n\n![](img/cover00113.jpeg)\n\n版权所有 版权所有\n\n未经出版者书面许可，本书的任何部分均不得复制、存储在检索系统中或以任何形式或通过任何手段（电子、机械、复印、录制或其他）进行传输。\n\
    \n我想将这本书献给将使用这本书的学生们。祝愿你们未来的事业成功，希望你们永不停止学习。\n\n# 目录\n\n- 概述\n- 环境搭建\n- Java NIO\
    \ vs IO\n- 通道 (Channels)\n- 文件通道 (File Channel)\n- 数据报通道 (Datagram Channel)\n\
    - 套接通道 (Socket Channel)\n- 服务器套接通道 (Server Socket Channel)\n- 分散 (Scatter)\n-\
    \ 聚集 (Gather)\n- 缓冲区 (Buffer)\n- 选择器 (Selector)\n- 管道 (Pipe)\n- 路径 (Path)\n- 文件\
    \ (File)\n- 异步文件通道 (Asynchronous File Channel)\n- 字符集 (Char Set)\n- 文件锁 (File\
    \ Lock)\n\n# 概述\n\n`java.nio` 包在 java 1.4 中引入。与 Java I/O 相比，Java NIO 引入了面向缓冲区和通道的\
    \ I/O 操作数据流，从而提供了更快的执行和更好的性能。\n\n此外，NIO API 提供了 `selectors`（选择器），它引入了异步或非阻塞的方式监听多个通道的\
    \ IO 事件的功能。在 NIO 中，最耗时的 I/O 活动（包括向操作系统填充和排空缓冲区）其速度得到了提升。\n\nNIO API 的核心抽象如下：\n\
    \n- 缓冲区 (Buffers)，它们是数据、字符集及其关联解码器和编码器的容器，用于在字节和 Unicode 字符之间进行转换。\n- 各种类型的通道\
    \ (Channels)，代表与能够执行 I/O 操作的实体的连接。\n- 选择器 (Selectors) 和选择键 (selection keys)，它们与可选通道共同定义了一个复用的、非阻塞的\
    \ IO 设施。\n\n# 环境搭建\n\n本节将指导你如何在你的机器上下载并设置 Java。请按照以下步骤设置环境。\n\nJava SE 可以从 **下载\
    \ Java** 链接免费获取。因此你可以根据你的操作系统下载相应的版本。\n\n按照说明下载 java 并运行 `.exe` 在你的机器上安装 Java。一旦在你的机器上安装了\
    \ Java，你就需要设置环境变量以指向正确的安装目录 ——\n\n## 为 windows 2000/XP 设置路径\n\n假设你已将 Java 安装在\
    \ `c:\\Program Files\\java\\jdk` 目录下 ——\n\n- 右键点击“我的电脑”并选择“属性”。\n- 点击“高级”选项卡下的“环境变量”按钮。\n\
    - 现在修改 `Path` 变量，使其也包含 Java 可执行文件所在的路径。例如，如果路径当前设置为 'C:\\WINDOWS\\SYSTEM32'，则将你的路径更改为\
    \ 'C:\\WINDOWS\\SYSTEM32;c:\\Program Files\\java\\jdk\\bin'\n\n## 为 windows 95/98/ME\
    \ 设置路径\n\n假设你已将 Java 安装在 `c:\\Program Files\\java\\jdk` 目录下 deme\n\n- 编辑 'C:\\\
    autoexec.bat' 文件，并在末尾添加以下行：\n  `SET PATH = %PATH%;C:\\Program Files\\java\\jdk\\\
    bin`\n\n## 为 Linux, UNIX, Solaris, FreeBSD 设置路径\n\n环境变量 `PATH` 应该指向 java 二进制文件安装的位置。如果你在此操作时遇到困难，请参考你的\
    \ shell 文档。\n\n例如，如果你使用 `bash` 作为 shell，那么你需要在你的 `.bashrc` 末尾添加以下行：`export PATH\
    \ = /path/to/java:$PATH`\n\n## 流行的 Java 编辑器\n\n编写 Java 程序需要一个文本编辑器。市场上还有更复杂的 IDE\
    \ 可用。但目前你可以考虑以下之一 ——\n\n- **Notepad (记事本)** ー 在 Windows 机器上，你可以使用任何简单的文本编辑器，如\
    \ Notepad（本教程推荐）、TextPad。\n- **Netbeans** ー 是一个开源且免费的 Java IDE，可以从 `http://www.netbeans.org/`\
    \ 下载。\n- **Eclipse** ー 也是一个可以在 https://www.eclipse.org/ 获取的 Java IDE。\n\n# Java\
    \ NIO vs IO\n\n我们知道 NIO 是为了改进传统的 IO 而引入的。NIO 和 IO 之间的区别解释如下：\n\n- 如前文所述，引入了面向缓冲区和通道的\
    \ I/O 操作数据流，从而提供了更快的执行和更好的性能。\n- 此外，NIO API 提供了 `selectors`，它引入了以异步或非阻塞方式监听多个通道的\
    \ IO 事件的功能。在 NIO 中，最耗时的 I/O 活动（包括向操作系统填充和排空缓冲区）其速度得到了提升。\n- NIO API 的核心抽象如下：\n\
    \  - 缓冲区 (Buffers)，它们是数据、字符集及其关联解码器和编码器的容器，用于在字节和 Unicode 字符之间进行转换。\n  - 各种类型的通道\
    \ (Channels)，代表与能够执行 I/O 操作的实体的连接。\n  - 选择器 (Selectors) 和选择键 (selection keys)，它们与可选通道共同定义了一个复用的、非阻塞的\
    \ IO 设施。\n\n# 通道 (Channels)\n\n正如其名所示，通道被用作从一端到另一端的数据流。在 Java NIO 中，通道在缓冲区和另一端的实体之间起到作用，换句话说，通道用于将数据读取到缓冲区，以及从缓冲区写入数据。\n\
    \n## 通道的实现\n\nJava NIO 通道主要在以下类中实现 deme\n\n- **FileChannel** ー 为了从文件读取数据，我们使用文件通道。文件通道对象只能通过调用文件对象的\
    \ `getChannel()` 方法创建，因为我们无法直接创建文件对象。\n- **DatagramChannel** ー 数据报通道可以通过 UDP（用户数据报协议）在网络上读取和写入数据。数据报通道对象可以使用工厂方法创建。\n\
    \n"
- fmt: "\n* `SocketChannel` - The `SocketChannel` channel can read and write the data\
    \ over the network via TCP (Transmission Control Protocol). It also uses the factory\
    \ methods for creating the new object.\n* `ServerSocketChannel` - The `ServerSocketChannel`\
    \ read and write the data over TCP connections, same as a web server. For every\
    \ incoming connection a `SocketChannel` is created.\n\n## Example\n\nFollowing\
    \ example reads from a text file from `C:/Test/temp.txt` and prints the content\
    \ to the console.\n\n### temp.txt\n\nHello World!\n\n### ChannelDemo.java\n\n\
    ```java\nimport java.io.IOException;\nimport java.io.RandomAccessFile;\nimport\
    \ java.nio.ByteBuffer;\nimport java.nio.channels.FileChannel;\n\npublic class\
    \ ChannelDemo {\n    public static void main(String args[]) throws IOException\
    \ {\n        RandomAccessFile file = new RandomAccessFile(\"C:/Test/temp.txt\"\
    , \"r\");\n        FileChannel fileChannel = file.getChannel();\n        ByteBuffer\
    \ byteBuffer = ByteBuffer.allocate(512);\n        while (fileChannel.read(byteBuffer)\
    \ > 0) {\n            // flip the buffer to prepare for get operation\n      \
    \      byteBuffer.flip();\n            while (byteBuffer.hasRemaining()) {\n \
    \               System.out.print((char) byteBuffer.get());\n            }\n  \
    \      }\n        file.close();\n    }\n}\n```\n\n## Output\n\nHello World!\n\n\
    # File Channel\n\n## Description\n\nAs already mentioned `FileChannel` implementation\
    \ of Java NIO channel is introduced to access meta data properties of the file\
    \ including creation, modification, size etc. Along with this File Channels are\
    \ multi threaded which again makes Java NIO more efficient than Java IO.\n\nIn\
    \ general we can say that `FileChannel` is a channel that is connected to a file\
    \ by which you can read data from a file, and write data to a file. Other important\
    \ characteristic of `FileChannel` is this that it cannot be set into non-blocking\
    \ mode and always runs in blocking mode.\n\nWe can't get file channel object directly,\
    \ Object of file channel is obtained either by -\n\n* `getChannel()` - method\
    \ on any either `FileInputStream`, `FileOutputStream` or `RandomAccessFile`.\n\
    * `open()` - method of File channel which by default open the channel.\n\nThe\
    \ object type of File channel depends on type of class called from object creation\
    \ i.e if object is created by calling `getchannel` method of `FileInputStream`\
    \ then File channel is opened for reading and will throw `NonWritableChannelException`\
    \ in case attempt to write to it.\n\n## Example\n\nThe following example shows\
    \ the how to read and write data from Java NIO `FileChannel`.\n\nFollowing example\
    \ reads from a text file from `C:/Test/temp.txt` and prints the content to the\
    \ console.\n\n### temp.txt\n\nHello World!\n\n### FileChannelDemo.java\n\n```java\n\
    import java.io.IOException;\nimport java.io.RandomAccessFile;\nimport java.nio.ByteBuffer;\n\
    import java.nio.channels.FileChannel;\nimport java.nio.charset.Charset;\nimport\
    \ java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.nio.file.StandardOpenOption;\n\
    import java.util.HashSet;\nimport java.util.Set;\n\npublic class FileChannelDemo\
    \ {\n    public static void main(String args[]) throws IOException {\n       \
    \ //append the content to existing file\n        writeFileChannel(ByteBuffer.wrap(\"\
    Welcome to TutorialsPoint\".getBytes()));\n        //read the file\n        readFileChannel();\n\
    \    }\n\n    public static void readFileChannel() throws IOException {\n    \
