    \ = Paths.get(originalPath);\n        Path path2 = path1.normalize();\n      \
    \  System.out.println(\"path2 = \" + path2);\n    }\n}\n```\n\n# File\n\nJava\
    \ NIO 包提供了另一个名为 `Files` 的实用 API，它主要用于通过其静态方法操作文件和目录，这些方法大多作用于 `Path` 对象。\n\n正如\
    \ Path 教程提到的，`Path` 接口是在 Java 7 版本中引入 Java NIO 包的 file 包中的。因此，本教程也是针对同一个 file\
    \ 包。\n\n该类完全由操作文件、目录或其他类型文件的静态方法组成。在大多数情况下，在这里定义的方法将委托给关联的文件系统提供程序来执行文件操作。\n\n\
    `Files` 类中定义了许多方法，也可以从 Java 文档中读取。在本教程中，我们尝试涵盖 Java NIO `Files` 类所有方法中的一些重要方法。\n\
    \n## Files 类的重要方法。\n\n以下是 Java NIO `Files` 类中定义的重要方法。\n\n* `createFile(Path filePath,\
