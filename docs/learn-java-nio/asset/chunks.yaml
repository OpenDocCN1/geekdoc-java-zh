    import java.io.IOException;


    import java.nio.ByteBuffer;


    import java.nio.channels.GatheringByteChannel;


    public  class  GatherExample  {


    private  static  String FILENAME =  "C:/Test/temp.txt";


    public  static  void main(String[] args)  {


    String stream1 =  "Gather data stream first";


    String stream2 =  "Gather data stream second";


    ByteBuffer bLen1 =  ByteBuffer.allocate(1024);


    ByteBuffer bLen2 =  ByteBuffer.allocate(1024);


    // Next two buffer hold the data we want to write


    ByteBuffer bstream1 =  ByteBuffer.wrap(stream1.getBytes());


    ByteBuffer bstream2 =  ByteBuffer.wrap(stream2.getBytes());


    int len1 = stream1.length();


    int len2 = stream2.length();


    // Writing length(data) to the Buffer


    bLen1.asIntBuffer().put(len1);


    bLen2.asIntBuffer().put(len2);


    System.out.println("Gathering : Len1 = "  + len1);


    System.out.println("Gathering : Len2 = "  + len2);


    // Write data to the file


    try  {


    FileOutputStream  out  =  new  FileOutputStream(FILENAME);


    GatheringByteChannel gather =  out.getChannel();                                    


    gather.write(new  ByteBuffer[]  {bLen1, bLen2, bstream1, bstream2});


    out.close();


    gather.close();


    }


    catch  (FileNotFoundException exObj)  {


    exObj.printStackTrace();


    }


    catch(IOException ioObj)  {


    ioObj.printStackTrace();


    }


    }


    }


    ## Output


    Gathering : Len1 = 24


    Gathering : Len2 = 25


    In last it can be concluded that scatter/gather approach in Java NIO is introduced
    as an optimized and multitasked when used properly.It allows you to delegate to
    the operating system the grunt work of separating out the data you read into multiple
    buckets, or assembling disparate chunks of data into a whole.No doubt this saves
    time and uses operating system more efficiently by avoiding buffer copies, and
    reduces the amount of code need to write and debug.


    # Buffer


    Buffers in Java NIO can be treated as a simple object which act as a fixed sized
    container of data chunks that can be used to write data to channel or read data
    from channel so that buffers act as endpoints to the channels.


    It provide set of methods that make more convenient to deal with memory block
    in order to read and write data to and from channels.


    Buffers makes NIO package more efficient and faster as compared to classic IO
    as in case of IO data is deal in the form of streams which do not support asynchronous
    and concurrent flow of data.Also IO does not allow data execution in chunk or
    group of bytes.


    Primary parameters that defines Java NIO buffer could be defined as −


    *   **Capacity** − Maximum Amount of data/byte that can be stored in the Buffer.Capacity
    of a buffer can not be altered.Once the buffer is full it should be cleared before
    writing to it.


    *   **Limit** − Limit has meaning as per the mode of Buffer i.e. in write mode
    of Buffer Limit is equal to the capacity which means that maximum data that could
    be write in buffer.While in read mode of buffer Limit means the limit of how much
    data can be read from the Buffer.


    *   **Position** − Points to the current location of cursor in buffer.Initially
    setted as 0 at the time of creation of buffer or in other words it is the index
    of the next element to be read or written which get updated automatically by get()
    and put() methods.


    *   **Mark** − Mark a bookmark of the position in a buffer.When mark() method
    is called the current position is recorded and when reset() is called the marked
    position is restored.


    ## Buffer Type


    Java NIO buffers can be classified in following variants on the basis of data
    types the buffer deals with −


    *   ByteBuffer


    *   MappedByteBuffer


    *   CharBuffer


    *   DoubleBuffer


    *   FloatBuffer


    *   IntBuffer


    *   LongBuffer


    *   ShortBuffer


    ## Important methods of Buffer


    As mentioned already that Buffer act as memory object which provide set of methods
    that make more convenient to deal with memory block.Following are the important
    methods of Buffer −


    *   **allocate(int capacity)** − This method is use to allocate a new buffer with
    capacity as parameter.Allocate method throws IllegalArgumentException in case
    the passed capacity is a negative integer.


    *   **read() and put()** − read method of channel is used to write data from channel
    to buffer while put is a method of buffer which is used to write data in buffer.


    *   **flip()** − The flip method switches the mode of Buffer from writing to reading
    mode.It also sets the position back to 0, and sets the limit to where position
    was at time of writing.


    *   **write() and get()** − write method of channel is used to write data from
    buffer to channel while get is a method of buffer which is used to read data from
    buffer.


    *   **rewind()** − rewind method is used when reread is required as it sets the
    position back to zero and do not alter the value of limit.


    *   **clear() and compact()** − clear and compact both methods are used to make
    buffer from read to write mode.**clear()** method makes the position to zero and
    limit equals to capacity,in this method the data in the buffer is not cleared
    only the markers get re initialized.


    On other hand **compact()** method is use when there remained some un-read data
    and still we use write mode of buffer in this case compact method copies all unread
    data to the beginning of the buffer and sets position to right after the last
    unread element.The limit property is still set to capacity.


    *   **mark() and reset()** − As name suggest mark method is used to mark any particular
    position in a buffer while reset make position back to marked position.


    ## Example


    The following example shows the implementation of above defined methods.


    import java.nio.ByteBuffer;


    import java.nio.CharBuffer;


    public  class  BufferDemo  {


    public  static  void main (String  [] args)  {


    //allocate a character type buffer.


    CharBuffer buffer =  CharBuffer.allocate(10);


    String text =  "bufferDemo";


    System.out.println("Input text: "  + text);


    for  (int i =  0; i < text.length(); i++)  {


    char c = text.charAt(i);


    //put character in buffer.


           buffer.put(c);


    }


    int buffPos = buffer.position();


    System.out.println("Position after data is written into buffer: "  + buffPos);


    buffer.flip();


    System.out.println("Reading buffer contents:");


    while  (buffer.hasRemaining())  {


    System.out.println(buffer.get());


    }


    //set the position of buffer to 5.


    buffer.position(5);


    //sets this buffer''s mark at its position


    buffer.mark();


    //try to change the position


    buffer.position(6);


    //calling reset method to restore to the position we marked.


    //reset() raise InvalidMarkException if either the new position is less


    //than the position marked or merk has not been setted.


    buffer.reset();


    System.out.println("Restored buffer position : "  + buffer.position());


    }


    }


    ## Output


    Input text: bufferDemo


    Position after data is written into buffer: 10


    Reading buffer contents:


    b


    u


    f


    f


    e


    r


    D


    e


    m


    o


    Restored buffer position : 5


    # Selector


    As we know that Java NIO supports multiple transaction from and to channels and
    buffer.So in order to examine one or more NIO Channel''s, and determine which
    channels are ready for data transaction i.e reading or writing Java NIO provide
    Selector.


    With Selector we can make a thread to know that which channel is ready for data
    writing and reading and could deal that particular channel.


    We can get selector instance by calling its static method **open()**.After open
    selector we have to register a non blocking mode channel with it which returns
    a instance of SelectionKey.


    SelectionKey is basically a collection of operations that can be performed with
    channel or we can say that we could know the state of channel with the help of
    selection key.


    The major operations or state of channel represented by selection key are −


    *   **SelectionKey.OP_CONNECT** − Channel which is ready to connect to server.


    *   **SelectionKey.OP_ACCEPT** − Channel which is ready to accept incoming connections.'
