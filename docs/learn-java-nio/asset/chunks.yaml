    # Pipe\n\n在 Java NIO 中，pipe 是一种用于在两个线程之间读写数据的组件。Pipe 主要由两个负责数据传播的通道组成。\n\n在两个组成通道中，一个被称为\
    \ Sink channel（汇通道），主要用于写入数据；另一个是 Source channel（源通道），其主要目的是从 Sink 通读取数据。\n\n\
    在数据读写过程中会保持数据同步，因为必须确保读取数据的的顺序与写入 Pipe 的顺序相同。\n\n必须注意，Pipe 中是单向数据流，即数据只写入 Sink\
    \ 通道，且只能从 Source 通道读取。\n\n在 Java NIO 中，pipe 被定义为一个抽象类，主要包含三个方法，其中两个是抽象方法。\n\n\
    ## Methods of Pipe class\n\n* `open()` - 此方法用于获取 Pipe 实例，或者说通过调用此方法创建 pipe。\n\
    * `sink()` - 此方法返回 Pipe 的 sink channel，通过调用其 `write()` 方法来写入数据。\n* `source()`\
    \ - 此方法返回 Pipe 的 source channel，通过调用其 `read()` 方法读取数据。\n\n## Example\n\n以下示例展示了\
    \ Java NIO pipe 的实现。\n\n```java\nimport java.io.IOException;\nimport java.nio.ByteBuffer;\n\
    import java.nio.channels.Pipe;\n\npublic class PipeDemo {\npublic static void\
    \ main(String[] args) throws IOException {\n// 创建 Pipe 实例\nPipe pipe = Pipe.open();\n\
    // 获取 pipe 的 sink channel\nPipe.SinkChannel skChannel = pipe.sink();\nString testData\
    \ = \"Test Data to Check java NIO Pipe.\";\nByteBuffer buffer = ByteBuffer.allocate(512);\n\
    buffer.clear();\nbuffer.put(testData.getBytes());\nbuffer.flip();\n// 将数据写入 sink\
    \ channel\nwhile(buffer.hasRemaining()) {\nskChannel.write(buffer);\n}\n// 获取\
    \ pipe 的 source channel\nPipe.SourceChannel sourceChannel = pipe.source();\nbuffer\
    \ = ByteBuffer.allocate(512);\n// 将数据写入控制台\nwhile(sourceChannel.read(buffer) >\
    \ 0){\n// limit 设置为当前位置，位置置为 0\nbuffer.flip();\nwhile(buffer.hasRemaining()){\n\
    char ch = (char) buffer.get();\nSystem.out.print(ch);\n}\n// 位置置为 0，limit 设置为容量以清空\
    \ buffer\nbuffer.clear();\n}\n}\n}\n```\n\n## Output\n\nTest Data to Check java\
    \ NIO Pipe.假设有一个文件 `c:/test.txt`，内容如下。该文件将作为我们示例程序的输入。\n\n# Path\n\n正如名称所示，Path\
    \ 是文件系统中某个实体（如文件或目录）的特定位置，以便在该位置对其进行搜索和访问。\n\n从 Java 技术角度来看，Path 是在 Java 7 版本引入\
    \ Java NIO file 包中的一个接口，它是特定文件系统中位置的表示。由于 path 接口位于 Java NIO 包，因此其全限定名为 java.nio.file.Path。\n\
    \n通常，实体的路径有两种类型：一种是绝对路径（absolute path），另一种是相对路径（relative path）。正如路径名称所示，绝对路径是从根目录到实体的位置地址，而相对路径是相对于其他路径的位置地址。Path\
    \ 在其定义中使用分隔符，Windows 使用 \"\\”，Unix 操作系统使用 \"/\"。\n\n为了获取 Path 实例，我们可以使用 `java.nio.file.Paths`\
    \ 类的静态方法 `get()`。此方法将路径字符串或一组组合成路径字符串的字符串转换为 Path 实例。如果传递的参数包含非法字符，该方法还会抛出运行时异常\
    \ InvalidPathException。\n\n"
