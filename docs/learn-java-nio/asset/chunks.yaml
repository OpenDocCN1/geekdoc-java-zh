    # Server Socket Channel


    Java NIO server socket channel is again a selectable type channel used for stream
    oriented data flow connecting sockets.Server Socket channel can be created by
    invoking its static **open()** method,providing any pre-existing socket is not
    already present.Server Socket channel is created by invoking open method but not
    yet bound.In order to bound socket channel **bind()** method is to be called.


    One point to be mentioned here is if channel is not bound and any I/O operation
    is tried to be attempted then NotYetBoundException is thrown by this channel.So
    one must be ensure that channel is bounded before performing any IO operation.


    Incoming connections for the server socket channel are listen by calling the ServerSocketChannel.accept()
    method. When the accept() method returns, it returns a SocketChannel with an incoming
    connection. Thus, the accept() method blocks until an incoming connection arrives.If
    the channel is in non-blocking mode then accept method will immediately return
    null if there are no pending connections. Otherwise it will block indefinitely
    until a new connection is available or an I/O error occurs.


    The new channel''s socket is initially unbound; it must be bound to a specific
    address via one of its socket''s bind methods before connections can be accepted.Also
    the new channel is created by invoking the openServerSocketChannel method of the
    system-wide default SelectorProvider object.


    Like socket channel server socket channel could read data using **read()** method.Firstly
    the buffer is allocated. The data read from a ServerSocketChannel is stored into
    the buffer.Secondly we call the ServerSocketChannel.read() method and it reads
    the data from a ServerSocketChannel into a buffer. The integer value of the read()
    method returns how many bytes were written into the buffer


    Similarly data could be written to server socket channel using **write()** method
    using buffer as a parameter.Commonly uses write method in a while loop as need
    to repeat the write() method until the Buffer has no further bytes available to
    write.


