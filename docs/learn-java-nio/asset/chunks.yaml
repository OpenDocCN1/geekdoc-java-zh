    \n[File Lock](#part0020.xhtml_id_Toc71623341)\n\n# Overview\n\nJava.nio package\
    \ was introduced in java 1.4\\. In contrast of java I/O in java NIO the buffer\
    \ and channel oriented data flow for I/O operations is introduced which in result\
    \ provide faster execution and better performance.\n\nAlso NIO API offer selectors\
    \ which introduces the functionality of listen to multiple channels for IO events\
    \ in asynchronous or non blocking way.In NIO the most time-consuming I/O activities\
    \ including filling and draining of buffers to the operating system which increases\
    \ in speed.\n\nThe central abstractions of the NIO APIs are following −\n\n* \
    \  Buffers,which are containers for data,charsets and their associated decoders\
    \ and encoders,which translate between bytes and Unicode characters.\n\n*   Channels\
    \ of various types,which represent connections to entities capable of performing\
    \ I/O operations\n\n*   Selectors and selection keys, which together with selectable\
    \ channels define a multiplexed, non-blocking I/O facility.\n\n# Environment Setup\n\
    \nThis section guides you on how to download and set up Java on your machine.\
    \ Please follow the following steps to set up the environment.\n\nJava SE is freely\
    \ available from the link **Download Java**. So you download a version based on\
    \ your operating system.\n\nFollow the instructions to download java and run the **.exe** to\
    \ install Java on your machine. Once you installed Java on your machine, you would\
    \ need to set environment variables to point to correct installation directories\
    \ −\n\n## Setting up the path for windows 2000/XP\n\nAssuming you have installed\
    \ Java in *c:\\Program Files\\java\\jdk* directory −\n\n*   Right-click on 'My\
    \ Computer' and select 'Properties'.\n\n*   Click on the 'Environment variables'\
    \ button under the 'Advanced' tab.\n\n*   Now alter the 'Path' variable so that\
    \ it also contains the path to the Java executable. Example, if the path is currently\
    \ set to 'C:\\WINDOWS\\SYSTEM32', then change your path to read 'C:\\WINDOWS\\\
    SYSTEM32;c:\\Program Files\\java\\jdk\\bin'.\n\n## Setting up the path for windows\
    \ 95/98/ME\n\nAssuming you have installed Java in *c:\\Program Files\\java\\jdk* directory\
    \ −\n\n*   Edit the 'C:\\autoexec.bat' file and add the following line at the\
    \ end:\n\n    'SET PATH = %PATH%;C:\\Program Files\\java\\jdk\\bin'\n\n## Setting\
    \ up the path for Linux, UNIX, Solaris, FreeBSD\n\nEnvironment variable PATH should\
    \ be set to point to where the java binaries have been installed. Refer to your\
    \ shell documentation if you have trouble doing this.\n\nExample, if you use *bash* as\
    \ your shell, then you would add the following line to the end of your '.bashrc:\
    \ export PATH = /path/to/java:$PATH'\n\n## Popular Java Editors\n\nTo write your\
    \ java programs you will need a text editor. There are even more sophisticated\
    \ IDE available in the market. But for now, you can consider one of the following\
    \ −\n\n*   **Notepad** − On Windows machine you can use any simple text editor\
    \ like Notepad (Recommended for this tutorial), TextPad.\n\n*   **Netbeans** −\
    \ is a Java IDE that is open source and free which can be downloaded from **http://www.netbeans.org/index.html**.\n\
    \n*   **Eclipse** − is also a java IDE developed by the eclipse open source community\
    \ and can be downloaded from **https://www.eclipse.org/**.\n\n# Java NIO vs IO\n\
    \nAs we know that java NIO is introduced for advancement of conventional java\
    \ IO API.The main enhancements which make NIO more efficient than IO are channel\
    \ data flow model used in NIO and use of operating system for conventional IO\
    \ tasks.\n\nThe difference between Java NIO and Java IO can be explained as following\
    \ −\n\n*   As mentioned in previous post in NIO buffer and channel oriented data\
    \ flow for I/O operations which provide faster execution and better performance\
    \ as compare to IO.Also NIO uses operating system for conventional I/O tasks which\
    \ again makes it more efficient.\n\n*   Other aspect of difference between NIO\
    \ and IO is this IO uses stream line data flow i.e one more byte at a time and\
    \ relies on converting data objects into bytes and vice-e-versa while NIO deals\
    \ with the data blocks which are chunks of bytes.\n\n*   In java IO stream objects\
    \ are unidirectional while in NIO channels are bidirectional meaning a channel\
    \ can be used for both reading and writing data.\n\n*   The streamline data flow\
    \ in IO does not allow move forth and back in the data.If case need to move forth\
    \ and back in the data read from a stream need to cache it in a buffer first.While\
    \ in case of NIO we uses buffer oriented which allows to access data back and\
    \ forth without need of caching.\n\n*   NIO API also supports multi threading\
    \ so that data can be read and written asynchronously in such as a way that while\
    \ performing IO operations current thread is not blocked.This again make it more\
    \ efficient than conventional java IO API.\n\n*   Concept of multi threading is\
    \ introduced with the introduction of **Selectors** in java NIO which allow to\
    \ listen to multiple channels for IO events in asynchronous or non blocking way.\n\
    \n*   Multi threading in NIO make it Non blocking which means that thread is requested\
    \ to read or write only when data is available otherwise thread can be used in\
    \ other task for mean time.But this is not possible in case of conventional java\
    \ IO as no multi threading is supported in it which make it as Blocking.\n\n*\
    \   NIO allows to manage multiple channels using only a single thread,but the\
    \ cost is that parsing the data might be somewhat more complicated than when reading\
    \ data from a blocking stream in case of java IO.So in case fewer connections\
    \ with very high bandwidth are required with sending a lot of data at a time,than\
    \ in this case java IO API might be the best fit.\n\n# Channels\n\n## Description\n\
    \nAs name suggests channel is used as mean of data flow from one end to other.Here\
    \ in java NIO channel act same between buffer and an entity at other end in other\
    \ words channel are use to read data to buffer and also write data from buffer.\n\
    \nUnlike from streams which are used in conventional Java IO channels are two\
    \ way i.e can read as well as write.Java NIO channel supports asynchronous flow\
    \ of data both in blocking and non blocking mode.\n\n## Implementations of Channel\n\
    \nJava NIO channel is implemented primarily in following classes −\n\n*   **FileChannel** −\
    \ In order to read data from file we uses file channel. Object of file channel\
    \ can be created only by calling the getChannel() method on file object as we\
    \ can't create file object directly.\n\n*   **DatagramChannel** − The datagram\
    \ channel can read and write the data over the network via UDP (User Datagram\
    \ Protocol).Object of DataGramchannel can be created using factory methods."
