    Connection Set: /127.0.0.1:49558\nFile Received\n\n# 散播 (Scatter)\n\n众所周知，与 Java\
    \ 传统的 IO API 相比，Java NIO 是一个针对数据 IO 操作优化的 API。Java NIO 提供的另一个额外支持是从多个缓冲区向通道通道读/写数据。这种多重读写支持被称为散播\
    \ (Scatter) 和聚集 (Gather)，其中在读取数据时，数据从单个通道散播到多个缓冲区；而在写入数据时，数据则从多个缓冲区聚集到单个通道中。\n\
    \n为了实现这种从通道进行多重读写，Java NIO 提供了 `ScatteringByteChannel` 和 `GatheringByteChannel`\
    \ API，用于数据的读和写，如下例所示。\n\n## ScatteringByteChannel\n\n**从多个通道读取** - 在这里，我们实现了从单个通道将数据读取到多个缓冲区。为此，我们分配了多个缓冲区并将它们添加到缓冲区类型的数组中。然后，将此数组作为参数传递给\
    \ `ScatteringByteChannel read()` 方法，该方法将按顺序从通道写入数据。一旦某个缓冲区满，通道将移动到下一个缓冲区。\n\n\
    以下示例展示了在 Java 中如何进行数据的散播：\n\n### `C:/Test/temp.txt`\n\nHello World!\n\nimport\
    \ java.io.FileInputStream;\nimport java.io.FileNotFoundException;\nimport java.io.IOException;\n\
    import java.nio.ByteBuffer;\nimport java.nio.channels.ScatteringByteChannel;\n\
    \npublic class Scatter {\n    private static String FILENAME = \"C:/Test/temp.txt\"\
    ;\n    public static void main(String[] args) {\n        ByteBuffer bLen1 = ByteBuffer.allocate(1024);\n\
    \        ByteBuffer bLen2 = ByteBuffer.allocate(1024);\n        FileInputStream\
    \ in;\n        try {\n            in = new FileInputStream(FILENAME);\n      \
    \      ScatteringByteChannel scatter = in.getChannel();\n            scatter.read(new\
    \ ByteBuffer[]{bLen1, bLen2});\n            bLen1.position(0);\n            bLen2.position(0);\n\
    \            int len1 = bLen1.asIntBuffer().get();\n            int len2 = bLen2.asIntBuffer().get();\n\
    \            System.out.println(\"Scattering : Len1 = \" + len1);\n          \
    \  System.out.println(\"Scattering : Len2 = \" + len2);\n        } catch (FileNotFoundException\
    \ exObj) {\n            exObj.printStackTrace();\n        } catch (IOException\
    \ ioObj) {\n            ioObj.printStackTrace();\n        }\n    }\n}\n```\n\n\
    ## 输出\n\nScattering : Len1 = 1214606444\nScattering : Len2 = 0\n\n最后得出结论，Java\
    \ NIO 中的散播/聚集方法在合理使用的情况下是优化且支持多任务的。它允许让操作系统完成将数据拆分到多个桶中的繁重工作，或者将分散的数据块组合成整体。无疑这通过避免缓冲区拷贝了时间并更有效地使用了操作系统，同时也减少了编写和调试的代码量。\n\
    \n# 聚集 (Gather)\n\n众所周知，与 Java 传统的 IO API 相比，Java NIO 是一个针对数据 IO 操作优化的 API。Java\
    \ NIO 提供的另一个额外支持是从多个缓冲区向通道读/写数据。这种多重读写支持被称为散播 (Scatter) 和聚集 (Gather)，其中在读取数据时，数据从单个通道散播到多个缓冲区；而在写入数据时，数据则从多个缓冲区聚集到单个通道中。\n\
    \n为了实现这种从通道进行多重读写，Java NIO 提供了 `ScatteringByteChannel` 和 `GatheringByteChannel`\
    \ API，用于数据的读和写，如下例所示。\n\n## GatheringByteChannel\n\n**写入多个通道** - 在这里，我们实现了从多个缓冲区将数据写入单个通道。为此，再次分配了多个缓冲区并将它们添加到缓冲区类型的数组中。然后，将此数组作为参数传递给\
    \ `GatheringByteChannel write()` 方法，该方法将按缓冲区在数组中出现的顺序从多个缓冲区写入数据。这里需要记住的一点是，只有缓冲区位置和限制之间的数据会被写入。\n\
    \n以下示例展示了在 Java 中如何进行数据的聚集：\n\nimport java.io.FileNotFoundException;\n\n"
- fmt: "\n```java\nimport java.io.FileOutputStream;\nimport java.io.IOException;\n\
    import java.nio.ByteBuffer;\nimport java.nio.channels.GatheringByteChannel;\n\n\
    public class GatherExample {\n    private static String FILENAME = \"C:/Test/temp.txt\"\
    ;\n\n    public static void main(String[] args) {\n        String stream1 = \"\
    Gather data stream first\";\n        String stream2 = \"Gather data stream second\"\
    ;\n        ByteBuffer bLen1 = ByteBuffer.allocate(1024);\n        ByteBuffer bLen2\
    \ = ByteBuffer.allocate(1024);\n        // Next two buffer hold the data we want\
    \ to write\n        ByteBuffer bstream1 = ByteBuffer.wrap(stream1.getBytes());\n\
    \        ByteBuffer bstream2 = ByteBuffer.wrap(stream2.getBytes());\n        int\
    \ len1 = stream1.length();\n        int len2 = stream2.length();\n        // Writing\
    \ length(data) to the Buffer\n        bLen1.asIntBuffer().put(len1);\n       \
    \ bLen2.asIntBuffer().put(len2);\n        System.out.println(\"Gathering : Len1\
    \ = \" + len1);\n        System.out.println(\"Gathering : Len2 = \" + len2);\n\
    \        // Write data to the file\n        try {\n            FileOutputStream\
    \ out = new FileOutputStream(FILENAME);\n            GatheringByteChannel gather\
    \ = out.getChannel();\n            gather.write(new ByteBuffer[] {bLen1, bLen2,\
    \ bstream1, bstream2});\n            out.close();\n            gather.close();\n\
    \        } catch (FileNotFoundException exObj) {\n            exObj.printStackTrace();\n\
    \        } catch (IOException ioObj) {\n            ioObj.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n## Output\n\n```\nGathering : Len1 = 24\nGathering\
    \ : Len2 = 25\n```\n\nIn last it can be concluded that scatter/gather approach\
    \ in Java NIO is introduced as an optimized and multitasked when used properly.\
    \ It allows you to delegate to the operating system the grunt work of separating\
    \ out the data you read into multiple buckets, or assembling disparate chunks\
    \ of data into a whole. No doubt this saves time and uses operating system more\
    \ efficiently by avoiding buffer copies, and reduces the amount of code need to\
    \ write and debug.\n\n# Buffer\n\nBuffers in Java NIO can be treated as a simple\
    \ object which act as a fixed sized container of data chunks that can be used\
    \ to write data to channel or read data from channel so that buffers act as endpoints\
    \ to the channels.\n\nIt provide set of methods that make more convenient to deal\
    \ with memory block in order to read and write data to and from channels.\n\n\
    Buffers makes NIO package more efficient and faster as compared to classic IO\
    \ as in case of IO data is deal in the form of streams which do not support asynchronous\
    \ and concurrent flow of data. Also IO does not allow data execution in chunk\
    \ or group of bytes.\n\nPrimary parameters that defines Java NIO buffer could\
    \ be defined as −\n\n*   **Capacity** − Maximum Amount of data/byte that can be\
    \ stored in the Buffer. `Capacity` of a buffer can not be altered. Once the buffer\
    \ is full it should be cleared before writing to it.\n*   **Limit** — `Limit`\
    \ has meaning as per the mode of Buffer i.e. in write mode of Buffer `Limit` is\
    \ equal to the capacity which means that maximum data that could be write in buffer.\
    \ While in read mode of buffer `Limit` means the limit of how much data can be\
    \ read from the Buffer.\n*   **Position** — Points to the current location of\
    \ cursor in buffer. Initially setted as 0 at the time of creation of buffer or\
    \ in other words it is the index of the next element to be read or written which\
    \ get updated automatically by `get()` and `put()` methods.\n*   **Mark** — `Mark`\
    \ a bookmark of the position in a buffer. When `mark()` method is called the current\
    \ position is recorded and when `reset()` is called the marked position is restored.\n\
    \n## Buffer Type\n\nJava NIO buffers can be classified in following variants on\
    \ the basis of data types the buffer deals with −\n\n*   `ByteBuffer`\n*   `MappedByteBuffer`\n\
    *   `CharBuffer`\n*   `DoubleBuffer`\n*   `FloatBuffer`\n*   `IntBuffer`\n*  \
    \ `LongBuffer`\n*   `ShortBuffer`\n\n## Important methods of Buffer\n\nAs mentioned\
    \ already that Buffer act as memory object which provide set of methods that make\
    \ more convenient to deal with memory block. Following are the important methods\
    \ of Buffer −\n\n*   `allocate(int capacity)` — This method is use to allocate\
    \ a new buffer with capacity as parameter. `Allocate` method throws `IllegalArgumentException`\
    \ in case the passed capacity is a negative integer.\n*   `read()` and `put()`\
    \ — `read` method of channel is used to write data from channel to buffer while\
    \ `put` is a method of buffer which is used to write data in buffer.\n*   `flip()`\
    \ — The `flip` method switches the mode of Buffer from writing to reading mode.\
    \ It also sets the position back to 0, and sets the limit to where position was\
    \ at time of writing.\n*   `write()` and `get()` — `write` method of channel is\
    \ used to write data from buffer to channel while `get` is a method of buffer\
    \ which is used to read data from buffer.\n*   `rewind()` — `rewind` method is\
    \ used when reread is required as it sets the position back to zero and do not\
    \ alter the value of limit.\n*   `clear()` and `compact()` — `clear()` and `compact()`\
    \ both methods are used to make `clear()` method makes position to zero and limit\
    \ equals capacity. On other hand `compact()` method copies all unread data to\
    \ the beginning of the buffer and sets position to right.\n*   `mark()` and `reset()`\
    \ — `mark` method is used to mark any particular position in a buffer. As name\
    \ suggest `reset` method restore to the marked position.\n\n## Example\n\nThe\
