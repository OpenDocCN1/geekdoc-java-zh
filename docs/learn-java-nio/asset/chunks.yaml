    # File Channel


    ## Description


    As already mentioned FileChannel implementation of Java NIO channel is introduced
    to access meta data properties of the file including creation, modification, size
    etc.Along with this File Channels are multi threaded which again makes Java NIO
    more efficient than Java IO.


    In general we can say that FileChannel is a channel that is connected to a file
    by which you can read data from a file, and write data to a file.Other important
    characteristic of FileChannel is this that it cannot be set into non-blocking
    mode and always runs in blocking mode.


    We can''t get file channel object directly, Object of file channel is obtained
    either by −


    *   **getChannel()** − method on any either FileInputStream, FileOutputStream
    or RandomAccessFile.


    *   **open()** − method of File channel which by default open the channel.


    The object type of File channel depends on type of class called from object creation
    i.e if object is created by calling getchannel method of FileInputStream then
    File channel is opened for reading and will throw NonWritableChannelException
    in case attempt to write to it.


    ## Example


    The following example shows the how to read and write data from Java NIO FileChannel.


    Following example reads from a text file from **C:/Test/temp.txt** and prints
    the content to the console.


    ### temp.txt


    Hello World!


    ### FileChannelDemo.java


    import java.io.IOException;


    import java.io.RandomAccessFile;


    import java.nio.ByteBuffer;


    import java.nio.channels.FileChannel;


    import java.nio.charset.Charset;


    import java.nio.file.Path;


    import java.nio.file.Paths;


    import java.nio.file.StandardOpenOption;


    import java.util.HashSet;


    import java.util.Set;


    public  class  FileChannelDemo  {


    public  static  void main(String args[])  throws  IOException  {


    //append the content to existing file


    writeFileChannel(ByteBuffer.wrap("Welcome to TutorialsPoint".getBytes()));


    //read the file


    readFileChannel();


    }


    public  static  void readFileChannel()  throws  IOException  {


    RandomAccessFile randomAccessFile =  new  RandomAccessFile("C:/Test/temp.txt",


    "rw");


    FileChannel fileChannel = randomAccessFile.getChannel();


    ByteBuffer byteBuffer =  ByteBuffer.allocate(512);


    Charset charset =  Charset.forName("US-ASCII");


    while  (fileChannel.read(byteBuffer)  >  0)  {


    byteBuffer.rewind();


    System.out.print(charset.decode(byteBuffer));


    byteBuffer.flip();


    }


    fileChannel.close();


    randomAccessFile.close();


    }


    public  static  void writeFileChannel(ByteBuffer byteBuffer)throws  IOException  {


    Set<StandardOpenOption> options =  new  HashSet<>();


    options.add(StandardOpenOption.CREATE);


    options.add(StandardOpenOption.APPEND);


    Path path =  Paths.get("C:/Test/temp.txt");


    FileChannel fileChannel =  FileChannel.open(path, options);


    fileChannel.write(byteBuffer);


    fileChannel.close();


    }


    }


    ## Output


    Hello World! Welcome to TutorialsPoint


    # Datagram Channel


    Java NIO Datagram is used as channel which can send and receive UDP packets over
    a connection less protocol.By default datagram channel is blocking while it can
    be use in non blocking mode.In order to make it non-blocking we can use the configureBlocking(false)
    method.DataGram channel can be open by calling its one of the static method named
    as **open()** which can also take IP address as parameter so that it can be used
    for multi casting.


    Datagram channel alike of FileChannel do not connected by default in order to
    make it connected we have to explicitly call its connect() method.However datagram
    channel need not be connected in order for the send and receive methods to be
    used while it must be connected in order to use the read and write methods, since
    those methods do not accept or return socket addresses.


    We can check the connection status of datagram channel by calling its **isConnected()** method.Once
    connected, a datagram channel remains connected until it is disconnected or closed.Datagram
    channels are thread safe and supports multi-threading and concurrency simultaneously.


    ## Important methods of datagram channel


    *   **bind(SocketAddress local)** − This method is used to bind the datagram channel''s
    socket to the local address which is provided as the parameter to this method.


    *   **connect(SocketAddress remote)** − This method is used to connect the socket
    to the remote address.


    *   **disconnect()** − This method is used to disconnect the socket to the remote
    address.


    *   **getRemoteAddress()** − This method return the address of remote location
    to which the channel''s socket is connected.


    *   **isConnected()** − As already mentioned this method returns the status of
    connection of datagram channel i.e whether it is connected or not.


    *   **open() and open(ProtocolFamily family)** − Open method is used open a datagram
    channel for single address while parametrized open method open channel for multiple
    addresses represented as protocol family.


    *   **read(ByteBuffer dst)** − This method is used to read data from the given
    buffer through datagram channel.


    *   **receive(ByteBuffer dst)** − This method is used to receive datagram via
    this channel.


    *   **send(ByteBuffer src, SocketAddress target)** − This method is used to send
    datagram via this channel.


    ## Example


    The following example shows the how to send data from Java NIO DataGramChannel.


    ### Server: DatagramChannelServer.java


    import java.io.IOException;


    import java.net.InetSocketAddress;


    import java.net.SocketAddress;


    import java.nio.ByteBuffer;


    import java.nio.channels.DatagramChannel;


    public  class  DatagramChannelServer  {


    public  static  void main(String[] args)  throws  IOException  {


    DatagramChannel server =  DatagramChannel.open();


    InetSocketAddress iAdd =  new  InetSocketAddress("localhost",  8989);


    server.bind(iAdd);


    System.out.println("Server Started: "  + iAdd);


    ByteBuffer buffer =  ByteBuffer.allocate(1024);


    //receive buffer from client.


    SocketAddress remoteAdd = server.receive(buffer);


    //change mode of buffer


    buffer.flip();


    int limits = buffer.limit();


    byte bytes[]  =  new  byte[limits];


    buffer.get(bytes,  0, limits);


    String msg =  new  String(bytes);


    System.out.println("Client at "  + remoteAdd +  " sent: "  + msg);


    server.send(buffer,remoteAdd);


    server.close();


    }


    }


    ### Output


    Server Started: localhost/127.0.0.1:8989


