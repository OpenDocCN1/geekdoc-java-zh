  trans: "\n\n```\nGathering : Len1 = 24\nGathering : Len2 = 25\n```\n\n最后可以得出结论，Java\
    \ NIO 中的分散/聚集（scatter/gather）方法在用得当时被引入为一种优化和多任务方案。它允许你委托操作系统来处理繁重的工作，即将你读取到的数据分离到多个桶中，或将分散的数据块组装成整体。无疑，这通过避免缓冲区拷贝节省了时间，并更有效地利用了操作系统，同时减少了需要编写和调试的代码量。\n\
    \n# Buffer（缓冲区）\n\nJava NIO 中的 Buffer 也可以被视为一种简单的对象，它作为一个固定大小的数据块容器，可以用于向通道写入数据或从通道读取数据，因此\
    \ Buffer 充当了通道的端点。\n\n它提供了一组方法，可以更方便地处理内存块，以便从通道中读写数据。\n\n与经典的 IO 相比，Buffer 使得\
    \ NIO 包更加高效且快速，因为在 IO 的情况下，数据是以流的形式处理的，而流不支持异步和并发的数据流。此外，IO 不允许以字节块或字节组的形式执行数据。\n\
    \n定义 Java NIO Buffer 的主要参数可以定义为 −\n\n*   **Capacity（容量)** − Buffer 中可以存储的最大数据/字节量。Buffer\
    \ 的 `Capacity` 无法更改。一旦缓冲区满，在向其写入之前必须清除。\n*   **Limit（限制）** — `Limit` 的含义取决于 Buffer\
    \ 的模式。即在 Buffer 的写模式下，`Limit` 等于容量，这意味着可以写入缓冲区的最大数据。而在 Buffer 的读模式下，`Limit` 意味着从\
    \ Buffer 中读取数据的限制。\n*   **Position（位置）** — 指向缓冲区中当前的位置。在创建缓冲区时初始设置为 0，换句话说，它是下一个要读取或写入元素的索引，由\
    \ `get()` 和 `put()` 方法自动更新。\n*   **Mark（标记）** — `Mark` 是缓冲区中位置的一个书签。当调用 `mark()`\
    \ 方法时，会记录当前位置，当调用 `reset()` 时，会恢复到标记的位置。\n\n## Buffer Type（缓冲区类型）\n\nJava NIO\
    \ Buffer 可以根据其所处理的数据类型分类为以下变体 −\n\n*   `ByteBuffer`\n*   `MappedByteBuffer`\n\
    *   `CharBuffer`\n*   `DoubleBuffer`\n*   `FloatBuffer`\n*   `IntBuffer`\n*  \
    \ `LongBuffer`\n*   `ShortBuffer`\n\n## Important methods of Buffer（Buffer 的重要方法）\n\
    \n如前所述，Buffer 作为内存对象提供了一组更方便处理内存块的方法。以下是 Buffer 的重要方法 −\n\n*   `allocate(int capacity)`\
    \ — 该方法用于分配一个容量为参数的新缓冲区。如果传递的容量为负整数，`Allocate` 方法将抛出 `IllegalArgumentException`。\n\
    *   `read()` 和 `put()` — 通道的 `read` 方法用于将数据从通道写入缓冲区，而 `put` 是缓冲区的一个方法，用于向缓冲区中写入数据。\n\
    *   `flip()` — `flip` 方法将 Buffer 的模式从写模式切换到读模式。它还会将位置置回 0，并将限制设置为写入时位置所在的位置。\n\
    *   `write()` 和 `get()` — 通道的 `write` 方法用于将数据从缓冲区写入通道，而 `get` 是缓冲区的一个方法，用于从缓冲区中读取数据。\n\
    *   `rewind()` — 当需要重新读取时使用 `rewind` 方法，因为它将位置置回零且不改变限制的值。\n*   `clear()` 和 `compact()`\
    \ — `clear()` 和 `compact()` 两个方法都用于：`clear()` 方法将位置置为零并将限制等于容量。另一方面，`compact()`\
    \ 方法将所有未读的数据拷贝到缓冲区的开头并将位置设置为正确的位置。\n*   `mark()` 和 `reset()` — `mark` 是缓冲区中位置的标记。调用\
    \ `mark()` 方法时会记录当前位置，调用 `reset()` 时会恢复到标记的位置。\n\n## Example（示例）\n\n以下示例展示了上述方法的实现。\n\
    \n```java\nimport java.nio.ByteBuffer;\nimport java.nio.CharBuffer;\n\npublic\
    \ class BufferDemo {\n    public static void main (String[] args) {\n        //\
    \ 分配一个字符缓冲区\n        CharBuffer buffer = CharBuffer.allocate(10);\n        String\
    \ text = \"bufferDemo\";\n        System.out.println(\"Input text: \" + text);\n\
    \        for (int i = 0; i < text.length(); i++) {\n            char c = text.charAt(i);\n\
    \            // 将字符放入缓冲区\n            buffer.put(c);\n        }\n        int buffPos\
    \ = buffer.position();\n        System.out.println(\"Position after data is written\
    \ into buffer: \" + buffPos);\n        buffer.flip();\n        System.out.println(\"\
    Reading buffer contents:\");\n        while (buffer.hasRemaining()) {\n      \
    \      System.out.println(buffer.get());\n        }\n        // 将缓冲区的位置设置为 5\n\
    \        buffer.position(5);\n        // 在当前位置设置标记\n        buffer.mark();\n \
    \       // 尝试更改位置\n        buffer.position(6);\n        // 调用 reset 方法恢复到标记的位置\n\
    \        buffer.reset();\n        System.out.println(\"Restored buffer position\
    \ : \" + buffer.position());\n    }\n}\n```\n\n## Output\n\n```\nInput text: bufferDemo\n\
    Position after data is written into buffer: 10\nReading buffer contents:\nb\n\
    u\nf\nf\ne\nr\nD\ne\nm\no\nRestored buffer position : 5\n```\n\n# Selector（选择器）\n\
    \n众所周知，Java NIO 支持通道和缓冲区之间的多次事务。因此，为了检查一个或多个通道并确定哪些通道准备好进行数据事务（即读取或写入），Java NIO\
    \ 提供了 Selector。\n\n通过 Selector，我们可以创建一个线程来感知哪些通道已准备好进行数据读写，并处理特定的通道。\n\n我们可以通过调用其静态方法\
    \ `open()` 获取 selector 实例。打开 selector 后，我们需要将其注册一个非阻塞模式的通道，这将返回一个 `SelectionKey`\
    \ 实例。\n\nSelectionKey 基本上是与通道可以执行的操作集合，或者说，我们可以通过选择 key 了解通道的状态。\n\n由选择 key 表示的主要操作或状态有\
    \ −\n\n*   `SelectionKey.OP_CONNECT` — 准备好连接到服务器的通道。\n*   `SelectionKey.OP_ACCEPT`\
    \ — 准备好接受传入连接的通道。\n\n"
- fmt: "\n* `SelectionKey.OP_READ` - Channel which is ready to data read.\n* `SelectionKey.OP_WRITE`\
    \ - Channel which is ready to data write.\n\nSelection key obtained after registration\
    \ has some important methods as mentioned below −\n\n* `attach()` - This method\
    \ is used to attach an object with the key.The main purpose of attaching an object\
    \ to a channel is to recognizing the same channel.\n* `attachment()` - This method\
    \ is used to retain the attached object from the channel.\n* `channel()` - This\
    \ method is used to get the channel for which the particular key is created.\n\
    * `selector()` - This method is used to get the selector for which the particular\
    \ key is created.\n* `isValid()` - This method returns weather the key is valid\
    \ or not.\n* `isReadable()` - This method states that weather key's channel is\
    \ ready for read or not.\n* `isWritable()` - This method states that weather key's\
    \ channel is ready for write or not.\n* `isAcceptable()` - This method states\
    \ that weather key's channel is ready for accepting incoming connection or not.\n\
    * `isConnectable()` - This method tests whether this key's channel has either\
    \ finished, or failed to finish, its socket-connection operation.\n* `isAcceptable()`\
    \ - This method tests whether this key's channel is ready to accept a new socket\
    \ connection.\n* `interestOps()` - This method retrieves this key's interest set.\n\
    * `readyOps()` - This method retrieves the ready set which is the set of operations\
    \ the channel is ready for.\n\nWe can select a channel from selector by calling\
    \ its static method `select()`.Select method of selector is overloaded as −\n\n\
    * `select()` - This method blocks the current thread until at least one channel\
    \ is ready for the events it is registered for.\n* `select(long timeout)` - This\
    \ method does the same as `select()` except it blocks the thread for a maximum\
    \ of timeout milliseconds (the parameter).\n* `selectNow()` - This method doesn't\
    \ block at all.It returns immediately with whatever channels are ready.\n\nAlso\
    \ in order to leave a blocked thread which call out select method,`wakeup()` method\
    \ can be called from selector instance after which the thread waiting inside `select()`\
    \ will then return immediately.\n\nIn last we can close the selector by calling\
    \ `close()` method which also invalidates all `SelectionKey` instances registered\
    \ with this Selector along with closing the selector.\n\n## Example\n\n```java\n\
    import java.io.FileInputStream;\nimport java.io.IOException;\nimport java.net.InetSocketAddress;\n\
    import java.nio.ByteBuffer;\nimport java.nio.channels.FileChannel;\nimport java.nio.channels.SelectionKey;\n\
    import java.nio.channels.Selector;\nimport java.nio.channels.ServerSocketChannel;\n\
    import java.nio.channels.SocketChannel;\nimport java.util.Iterator;\nimport java.util.Set;\n\
    \npublic class SelectorDemo {\npublic static void main(String[] args) throws IOException\
    \ {\nString demo_text = \"This is a demo String\";      \nSelector selector =\
    \ Selector.open();\nServerSocketChannel serverSocket = ServerSocketChannel.open();\n\
    serverSocket.bind(new InetSocketAddress(\"localhost\", 5454));\nserverSocket.configureBlocking(false);\n\
    serverSocket.register(selector, SelectionKey.OP_ACCEPT);\nByteBuffer buffer =\
    \ ByteBuffer.allocate(256);\nwhile (true) {\nselector.select();\nSet<SelectionKey>\
    \ selectedKeys = selector.selectedKeys();\nIterator<SelectionKey> iter = selectedKeys.iterator();\n\
    while (iter.hasNext()) {\nSelectionKey key = iter.next();\nint interestOps = key.interestOps();\n\
    System.out.println(interestOps);\nif (key.isAcceptable()) {\nSocketChannel client\
    \ = serverSocket.accept();\nclient.configureBlocking(false);\nclient.register(selector,\
    \ SelectionKey.OP_READ);\n}\nif (key.isReadable()) {\nSocketChannel client = (SocketChannel)\
    \ key.channel();\nclient.read(buffer);\nif (new String(buffer.array()).trim().equals(demo_text))\
    \ {\nclient.close();\nSystem.out.println(\"Not accepting client messages anymore\"\
    );\n}\nbuffer.flip();\nclient.write(buffer);\nbuffer.clear();\n}\niter.remove();\n\
    }\n}\n}\n}\n```\n\n# Pipe\n\nIn Java NIO pipe is a component which is used to\
    \ write and read data between two threads.Pipe mainly consist of two channels\
    \ which are responsible for data propagation.\n\nAmong two constituent channels\
    \ one is called as Sink channel which is mainly for writing data and other is\
    \ Source channel whose main purpose is to read data from Sink channel.\n\nData\
    \ synchronization is kept in order during data writing and reading as it must\
    \ be ensured that data must be read in the same order in which it is written to\
    \ the Pipe.\n\nIt must kept in notice that it is a unidirectional flow of data\
    \ in Pipe i.e data is written in Sink channel only and could only be read from\
    \ Source channel.\n\nIn Java NIO pipe is defined as a abstract class with mainly\
    \ three methods out of which two are abstract.\n\n## Methods of Pipe class\n\n\
    * `open()` - This method is used get an instance of Pipe or we can say pipe is\
    \ created by calling out this method.\n* `sink()` - This method returns the Pipe's\
    \ sink channel which is used to write data by calling its `write()` method.\n\
    * `source()` - This method returns the Pipe's source channel which is used to\
    \ read data by calling its `read()` method.\n\n## Example\n\nThe following example\
    \ shows the implementation of Java NIO pipe.\n\n```java\nimport java.io.IOException;\n\
    import java.nio.ByteBuffer;\nimport java.nio.channels.Pipe;\n\npublic class PipeDemo\
    \ {\npublic static void main(String[] args) throws IOException {\n//An instance\
    \ of Pipe is created\nPipe pipe = Pipe.open();\n// gets the pipe's sink channel\n\
    Pipe.SinkChannel skChannel = pipe.sink();\nString testData = \"Test Data to Check\
    \ java NIO Channels Pipe.\";\nByteBuffer buffer = ByteBuffer.allocate(512);\n\
    buffer.clear();\nbuffer.put(testData.getBytes());\nbuffer.flip();\n//write data\
    \ into sink channel.\nwhile(buffer.hasRemaining()) {\nskChannel.write(buffer);\n\
    }\n//gets pipe's source channel\nPipe.SourceChannel sourceChannel = pipe.source();\n\
    buffer = ByteBuffer.allocate(512);\n//write data into console\nwhile(sourceChannel.read(buffer)\
    \ > 0){\n//limit is set to current position and position is set to zero\nbuffer.flip();\n\
    while(buffer.hasRemaining()){\nchar ch = (char) buffer.get();\nSystem.out.print(ch);\n\
    }\n//position is set to zero and limit is set to capacity to clear the buffer.\n\
    buffer.clear();\n}\n}\n}\n```\n\n## Output\n\nTest Data to Check java NIO Channels\
    \ Pipe.\n\nAssuming we have a text file `c:/test.txt`, which has the following\
    \ content. This file will be used as an input for our example program.\n\n# Path\n\
    \nAs name suggests Path is the particular location of an entity such as file or\
    \ a directory in a file system so that one can search and access it at that particular\
    \ location.\n\nTechnically in terms of Java, Path is an interface which is introduced\
    \ in Java NIO file package during Java version 7,and is the representation of\
    \ location in particular file system.As path interface is in Java NIO package\
    \ so it get its qualified name as java.nio.file.Path.\n\nIn general path of an\
    \ entity could be of two types one is absolute path and other is relative path.As\
    \ name of both paths suggests that absolute path is the location address from\
    \ the root to the entity where it locates while relative path is the location\
    \ address which is relative to some other path.Path uses delimiters in its definition\
    \ as \"\\\" for Windows and \"/\" for unix operating systems.\n\nIn order to get\
    \ the instance of Path we can use static method of `java.nio.file.Paths` class\
    \ `get()`.This method converts a path string, or a sequence of strings that when\
    \ joined form a path string, to a Path instance.This method also throws runtime\
    \ InvalidPathException if the arguments passed contains illegal characters.\n"
