    ## Important methods of Path Interface


    *   **getFileName()** − Returns the file system that created this object.


    *   **getName()** − Returns a name element of this path as a Path object.


    *   **getNameCount()** − Returns the number of name elements in the path.


    *   **subpath()** − Returns a relative Path that is a subsequence of the name
    elements of this path.


    *   **getParent()** − Returns the parent path, or null if this path does not have
    a parent.


    *   **getRoot()** − Returns the root component of this path as a Path object,
    or null if this path does not have a root component.


    *   **toAbsolutePath()** − Returns a Path object representing the absolute path
    of this path.


    *   **toRealPath()** − Returns the real path of an existing file.


    *   **toFile()** − Returns a File object representing this path.


    *   **normalize()** − Returns a path that is this path with redundant name elements
    eliminated.


    *   **compareTo(Path other)** − Compares two abstract paths lexicographically.This
    method returns zero if the argument is equal to this path, a value less than zero
    if this path is lexicographically less than the argument, or a value greater than
    zero if this path is lexicographically greater than the argument.


    *   **endsWith(Path other)** − Tests if this path ends with the given path.If
    the given path has N elements, and no root component, and this path has N or more
    elements, then this path ends with the given path if the last N elements of each
    path, starting at the element farthest from the root, are equal.


    *   **endsWith(String other)** − Tests if this path ends with a Path, constructed
    by converting the given path string, in exactly the manner specified by the endsWith(Path)
    method.


    ## Example


    Following example illustartes the different methods of Path interface which are
    mentioned above −


    package com.java.nio;


    import java.io.IOException;


    import java.nio.Buffer;


    import java.nio.ByteBuffer;


    import java.nio.file.FileSystem;


    import java.nio.file.LinkOption;


    import java.nio.file.Path;


    import java.nio.file.Paths;


    public  class  PathDemo  {


    public  static  void main(String[] args)  throws  IOException  {


    Path path =  Paths.get("D:/workspace/ContentW/Saurav_CV.docx");


    FileSystem fs = path.getFileSystem();


    System.out.println(fs.toString());


    System.out.println(path.isAbsolute());


    System.out.println(path.getFileName());


    System.out.println(path.toAbsolutePath().toString());


    System.out.println(path.getRoot());


    System.out.println(path.getParent());


    System.out.println(path.getNameCount());


    System.out.println(path.getName(0));


    System.out.println(path.subpath(0,  2));


    System.out.println(path.toString());


    System.out.println(path.getNameCount());


    Path realPath = path.toRealPath(LinkOption.NOFOLLOW_LINKS);


    System.out.println(realPath.toString());


    String originalPath =  "d:\\data\\projects\\a-project\\..\\another-project";


    Path path1 =  Paths.get(originalPath);


    Path path2 = path1.normalize();


    System.out.println("path2 = "  + path2);


    }


    }


    # File


    Java NIO package provide one more utility API named as Files which is basically
    used for manipulating files and directories using its static methods which mostly
    works on Path object.


    As mentioned in Path tutorial that Path interface is introduced in Java NIO package
    during Java 7 version in file package.So this tutorial is for same File package.


    This class consists exclusively of static methods that operate on files, directories,
    or other types of files.In most cases, the methods defined here will delegate
    to the associated file system provider to perform the file operations.


    There are many methods defined in the Files class which could also be read from
    Java docs.In this tutorial we tried to cover some of the important methods among
    all of the methods of Java NIO Files class.


    ## Important methods of Files class.


    Following are the important methods defined in Java NIO Files class.


    *   **createFile(Path filePath, FileAttribute attrs)** − Files class provides
    this method to create file using specified Path.


    ## Example


    package com.java.nio;


    import java.io.IOException;


    import java.nio.file.Files;


    import java.nio.file.Path;


    import java.nio.file.Paths;


    public  class  CreateFile  {


    public  static  void main(String[] args)  {


    //initialize Path object


    Path path =  Paths.get("D:file.txt");


    //create file


    try  {


    Path createdFilePath =  Files.createFile(path);


    System.out.println("Created a file at : "+createdFilePath);


    }


    catch  (IOException e)  {


    e.printStackTrace();


    }


    }


    }


    ## Output


    Created a file at : D:\data\file.txt


    *   **copy(InputStream in, Path target, CopyOption… options)** − This method is
    used to copies all bytes from specified input stream to specified target file
    and returns number of bytes read or written as long value.LinkOption for this
    parameter with the following values −


    *   **COPY_ATTRIBUTES **− copy attributes to the new file, e.g. last-modified-time
    attribute.


    *   **REPLACE_EXISTING** − replace an existing file if it exists.


    *   **NOFOLLOW_LINKS** − If a file is a symbolic link, then the link itself, not
    the target of the link, is copied.


    ## Example


    package com.java.nio;


    import java.io.IOException;


    import java.nio.charset.Charset;


    import java.nio.file.Files;


    import java.nio.file.Path;


    import java.nio.file.Paths;


    import java.nio.file.StandardCopyOption;


    import java.util.List;


    public  class  WriteFile  {


    public  static  void main(String[] args)  {


    Path sourceFile =  Paths.get("D:file.txt");


    Path targetFile =  Paths.get("D:fileCopy.txt");


    try  {


    Files.copy(sourceFile, targetFile,


    StandardCopyOption.REPLACE_EXISTING);


    }


    catch  (IOException ex)  {


    System.err.format("I/O Error when copying file");


    }


    Path wiki_path =  Paths.get("D:fileCopy.txt");


    Charset charset =  Charset.forName("ISO-8859-1");


    try  {


    List<String> lines =  Files.readAllLines(wiki_path, charset);


    for  (String line : lines)  {


    System.out.println(line);


    }


    }


    catch  (IOException e)  {


    System.out.println(e);


    }


    }      


    }


    ## Output


    To be or not to be?


    *   **createDirectories(Path dir, FileAttribute<?>...attrs)** − This method is
    used to create directories using given path by creating all nonexistent parent
    directories.


    *   **delete(Path path)** − This method is used to deletes the file from specified
    path.It throws NoSuchFileException if the file is not exists at specified path
    or if the file is directory and it may not empty and cannot be deleted.


    *   **exists(Path path)** − This method is used to check if file exists at specified
    path and if the file exists it will return true or else it returns false.


    *   **readAllBytes(Path path)** − This method is used to reads all the bytes from
    the file at given path and returns the byte array containing the bytes read from
    the file.


    ## Example


