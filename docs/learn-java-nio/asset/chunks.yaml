    Created a file at : \"+createdFilePath);\n        } catch (IOException e) {\n\
    \            e.printStackTrace();\n        }\n    }\n}\n```\n\n## Output\n\nCreated\
    \ a file at : D:\\data\\file.txt\n\n* `copy(InputStream in, Path target, CopyOption…\
    \ options)` − This method is used to copies all bytes from specified input stream\
    \ to specified target file and returns number of bytes read or written as long\
    \ value. `LinkOption` for this parameter with the following values −\n* `COPY_ATTRIBUTES`\
    \ − copy attributes to the new file, e.g. last-modified time.\n* `REPLACE_EXISTING`\
    \ − replace an existing file if it exists.\n* `NOFOLLOW_LINKS` − If a file is\
