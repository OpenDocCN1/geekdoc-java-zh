  raw: '*   **bind(SocketAddress local)** − This method is used to bind the socket
    channel to the local address which is provided as the parameter to this method.


    *   **accept()** − This method is used to accepts a connection made to this channel''s
    socket.


    *   **connect(SocketAddress remote)** − This method is used to connect the socket
    to the remote address.


    *   **finishConnect()** − This method is used to finishes the process of connecting
    a socket channel.


    *   **getRemoteAddress()** − This method return the address of remote location
    to which the channel''s socket is connected.


    *   **isConnected()** − As already mentioned this method returns the status of
    connection of socket channel i.e whether it is connected or not.


    *   **open()** − Open method is used open a socket channel for no specified address.This
    convenience method works as if by invoking the open() method, invoking the connect
    method upon the resulting server socket channel, passing it remote, and then returning
    that channel.


    *   **read(ByteBuffer dst)** − This method is used to read data from the given
    buffer through socket channel.


    *   **setOption(SocketOption<T> name, T value)** − This method sets the value
    of a socket option.


    *   **socket()** − This method retrieves a server socket associated with this
    channel.


    *   **validOps()** − This method returns an operation set identifying this channel''s
    supported operations.Server-socket channels only support the accepting of new
    connections, so this method returns SelectionKey.OP_ACCEPT.


    ## Example


    The following example shows the how to send data from Java NIO ServerSocketChannel.


    ### C:/Test/temp.txt


    Hello World!


    ### Client: SocketChannelClient.java


    import java.io.IOException;


    import java.net.InetSocketAddress;


    import java.nio.ByteBuffer;


    import java.nio.channels.FileChannel;


    import java.nio.channels.ServerSocketChannel;


    import java.nio.channels.SocketChannel;


    import java.nio.file.Path;


    import java.nio.file.Paths;


    import java.nio.file.StandardOpenOption;


    import java.util.EnumSet;


    public  class  SocketChannelClient  {


    public  static  void main(String[] args)  throws  IOException  {


    ServerSocketChannel serverSocket =  null;


    SocketChannel client =  null;


    serverSocket =  ServerSocketChannel.open();


    serverSocket.socket().bind(new  InetSocketAddress(9000));


    client = serverSocket.accept();


    System.out.println("Connection Set: "  + client.getRemoteAddress());


    Path path =  Paths.get("C:/Test/temp1.txt");


    FileChannel fileChannel =  FileChannel.open(path,


    EnumSet.of(StandardOpenOption.CREATE,


    StandardOpenOption.TRUNCATE_EXISTING,


    StandardOpenOption.WRITE)


    );


    ByteBuffer buffer =  ByteBuffer.allocate(1024);


    while(client.read(buffer)  >  0)  {


    buffer.flip();


    fileChannel.write(buffer);


    buffer.clear();


    }


    fileChannel.close();


    System.out.println("File Received");


    client.close();


    }


    }


