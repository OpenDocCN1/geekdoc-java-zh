    \ targetFile, StandardCopyOption.REPLACE_EXISTING);\n        } catch (IOException\
    \ ex) {\n            System.err.format(\"I/O Error when copying file\");\n   \
    \     }\n\n        Path wiki_path = Paths.get(\"D:fileCopy.txt\");\n        Charset\
    \ charset = Charset.forName(\"ISO-8859-1\");\n        try {\n            List<String>\
    \ lines = Files.readAllLines(wiki_path, charset);\n            for (String line\
    \ : lines) {\n                System.out.println(line);\n            }\n     \
    \   } catch (IOException e) {\n            System.out.println(e);\n        }\n\
    \    }\n}\n```\n\n## Output\n\nTo be or not to be?\n\n* `createDirectories(Path\
    \ dir, FileAttribute<?>...attrs)` − This method is used to create directories\
    \ using given path by creating all nonexistent parent directories.\n* `delete(Path\
    \ path)` − This method is used to deletes the file from specified path. It throws\
    \ `NoSuchFileException` if the file is not exists at specified path or if the\
    \ file is directory and it may not empty and cannot be deleted.\n* `exists(Path\
    \ path)` − This method is used to check if file exists at specified path and if\
