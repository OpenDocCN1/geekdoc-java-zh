    Selection key obtained after registration has some important methods as mentioned
    below −


    *   **attach()** − This method is used to attach an object with the key.The main
    purpose of attaching an object to a channel is to recognizing the same channel.


    *   **attachment()** − This method is used to retain the attached object from
    the channel.


    *   **channel()** − This method is used to get the channel for which the particular
    key is created.


    *   **selector()** − This method is used to get the selector for which the particular
    key is created.


    *   **isValid()** − This method returns weather the key is valid or not.


    *   **isReadable()** − This method states that weather key''s channel is ready
    for read or not.


    *   **isWritable()** − This method states that weather key''s channel is ready
    for write or not.


    *   **isAcceptable()** − This method states that weather key''s channel is ready
    for accepting incoming connection or not.


    *   **isConnectable()** − This method tests whether this key''s channel has either
    finished, or failed to finish, its socket-connection operation.


    *   **isAcceptable()** − This method tests whether this key''s channel is ready
    to accept a new socket connection.


    *   **interestOps()** − This method retrieves this key''s interest set.


    *   **readyOps()** − This method retrieves the ready set which is the set of operations
    the channel is ready for.


    We can select a channel from selector by calling its static method **select()**.Select
    method of selector is overloaded as −


    *   **select()** − This method blocks the current thread until at least one channel
    is ready for the events it is registered for.


    *   **select(long timeout)** − This method does the same as select() except it
    blocks the thread for a maximum of timeout milliseconds (the parameter).


    *   **selectNow()** − This method doesn''t block at all.It returns immediately
    with whatever channels are ready.


    Also in order to leave a blocked thread which call out select method,**wakeup()** method
    can be called from selector instance after which the thread waiting inside select()
    will then return immediately.


    In last we can close the selector by calling **close()** method which also invalidates
    all SelectionKey instances registered with this Selector along with closing the
    selector.


    ## Example


    import java.io.FileInputStream;


    import java.io.IOException;


    import java.net.InetSocketAddress;


    import java.nio.ByteBuffer;


    import java.nio.channels.FileChannel;


    import java.nio.channels.SelectionKey;


    import java.nio.channels.Selector;


    import java.nio.channels.ServerSocketChannel;


    import java.nio.channels.SocketChannel;


    import java.util.Iterator;


    import java.util.Set;


    public  class  SelectorDemo  {


    public  static  void main(String[] args)  throws  IOException  {


    String demo_text =  "This is a demo String";      


    Selector selector =  Selector.open();


    ServerSocketChannel serverSocket =  ServerSocketChannel.open();


    serverSocket.bind(new  InetSocketAddress("localhost",  5454));


    serverSocket.configureBlocking(false);


    serverSocket.register(selector,  SelectionKey.OP_ACCEPT);


    ByteBuffer buffer =  ByteBuffer.allocate(256);


    while  (true)  {


    selector.select();


    Set<SelectionKey> selectedKeys = selector.selectedKeys();


    Iterator<SelectionKey> iter = selectedKeys.iterator();


    while  (iter.hasNext())  {


    SelectionKey key = iter.next();


    int interestOps = key.interestOps();


    System.out.println(interestOps);


    if  (key.isAcceptable())  {


    SocketChannel client = serverSocket.accept();


    client.configureBlocking(false);


    client.register(selector,  SelectionKey.OP_READ);


    }


    if  (key.isReadable())  {


    SocketChannel client =  (SocketChannel) key.channel();


    client.read(buffer);


    if  (new  String(buffer.array()).trim().equals(demo_text))  {


    client.close();


    System.out.println("Not accepting client messages anymore");


    }


    buffer.flip();


    client.write(buffer);


    buffer.clear();


    }


    iter.remove();


    }


    }


    }


    }


    # Pipe


    In Java NIO pipe is a component which is used to write and read data between two
    threads.Pipe mainly consist of two channels which are responsible for data propagation.


    Among two constituent channels one is called as Sink channel which is mainly for
    writing data and other is Source channel whose main purpose is to read data from
    Sink channel.


    Data synchronization is kept in order during data writing and reading as it must
    be ensured that data must be read in a same order in which it is written to the
    Pipe.


    It must kept in notice that it is a unidirectional flow of data in Pipe i.e data
    is written in Sink channel only and could only be read from Source channel.


    In Java NIO pipe is defined as a abstract class with mainly three methods out
    of which two are abstract.


    ## Methods of Pipe class


    *   **open()** − This method is used get an instance of Pipe or we can say pipe
    is created by calling out this method.


    *   **sink()** − This method returns the Pipe''s sink channel which is used to
    write data by calling its write method.


    *   **source()** − This method returns the Pipe''s source channel which is used
    to read data by calling its read method.


    ## Example


    The following example shows the implementation of Java NIO pipe.


    import java.io.IOException;


    import java.nio.ByteBuffer;


    import java.nio.channels.Pipe;


    public  class  PipeDemo  {


    public  static  void main(String[] args)  throws  IOException  {


    //An instance of Pipe is created


    Pipe pipe =  Pipe.open();


    // gets the pipe''s sink channel


    Pipe.SinkChannel skChannel = pipe.sink();


    String testData =  "Test Data to Check java NIO Channels Pipe.";


    ByteBuffer buffer =  ByteBuffer.allocate(512);


    buffer.clear();


    buffer.put(testData.getBytes());


    buffer.flip();


    //write data into sink channel.


    while(buffer.hasRemaining())  {


    skChannel.write(buffer);


    }


    //gets pipe''s source channel


    Pipe.SourceChannel sourceChannel = pipe.source();


    buffer =  ByteBuffer.allocate(512);


    //write data into console


    while(sourceChannel.read(buffer)  >  0){


    //limit is set to current position and position is set to zero


    buffer.flip();


    while(buffer.hasRemaining()){


    char ch =  (char) buffer.get();


    System.out.print(ch);


    }


    //position is set to zero and limit is set to capacity to clear the buffer.


    buffer.clear();


    }


    }


    }


    ## Output


    Test Data to Check java NIO Channels Pipe.


    Assuming we have a text file **c:/test.txt**, which has the following content.
    This file will be used as an input for our example program.


    # Path


    As name suggests Path is the particular location of an entity such as file or
    a directory in a file system so that one can search and access it at that particular
    location.


    Technically in terms of Java, Path is an interface which is introduced in Java
    NIO file package during Java version 7,and is the representation of location in
    particular file system.As path interface is in Java NIO package so it get its
    qualified name as java.nio.file.Path.


    In general path of an entity could be of two types one is absolute path and other
    is relative path.As name of both paths suggests that absolute path is the location
    address from the root to the entity where it locates while relative path is the
    location address which is relative to some other path.Path uses delimiters in
    its definition as "\" for Windows and "/" for unix operating systems.


    In order to get the instance of Path we can use static method of java.nio.file.Paths
    class **get()**.This method converts a path string, or a sequence of strings that
    when joined form a path string, to a Path instance.This method also throws runtime
    InvalidPathException if the arguments passed contains illegal characters.'
