  md: '# 302 Conquering JavaScript


    # REACT JSX


    All React components have a render method, as we have previously seen. A React
    component''s HTML output is defined by the render function. A React plugin called
    JSX (JavaScript Extension) enables the creation of JavaScript code that resembles
    HTML.9


    To it another way, JSX is an extension of ECMAScript utilized by React to allow
    HTML-like syntax to coexist alongside JavaScript/React code. Preprocessors (also
    known as transpilers, such as babel) employ the syntax to convert HTML-like syntax
    into typical JavaScript objects that a JavaScript engine interprets.


    In the same file where we write JSX enables us to write HTML/XML-like structures
    (such as DOM-tree style structures). A preprocessor will subsequently convert
    these expressions into JavaScript code. JSX tags contain a tag name, attributes,
    and children much as XML/HTML tags do.


    # Example


    In this section, we''ll put JX syntax in a JSX file and examine the associated
    JavaScript code that a preprocessor converts (babel).


    # JSX File


    ```

    <div>Hello Everyone</div>

    ```


    # Output


    ```

    React.createElement("div", null, "Hello Everyone");

    ```


    The code above creates a react element with three arguments, the first of which
    is the element''s name, "div," the second of which is the attributes supplied
    in the div tag, and the third of which is the content we supply, "Hello Everyone."


    # Why Use JSX?


    +   - Because it conducts optimization when converting the code to JavaScript,
    it is quicker than standard JavaScript.'
