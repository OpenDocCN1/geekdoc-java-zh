  md: '# Conquering JavaScript


    Conquering JavaScript: The Practical Handbook helps the reader master the JavaScript
    (JS) programming language for faster and more robust development. JS is a highly
    popular language and is often termed as the ‘language of the web.’ In addition
    to the internet, JS is also being used actively in game development, mobile apps,
    progressive applications, and now even desktop apps. As such, it is safe to say
    that JS is probably the most cross-platform language currently in use, and it
    rises in popularity with each passing day.


    This book covers the basics and moves on to advanced concepts using a hands-on
    approach with practical lessons and tutorials. JS programming, JS frameworks and
    various use-case scenarios are discussed in detail. Bridging the gap between beginner
    and intermediate-level JS literature, this book is a valuable resource to build
    robust knowledge.'
  merge: -1
  pgno: 1
- img_proc: true
  md: '# About the Series


    The **Conquering JavaScript** series covers a wide range of topics, pertaining
    specifically to the JavaScript programming ecosystem, such as frameworks and libraries.
    Each book of this series is focused on a singular topic, and covers said topic
    at length, focusing especially on real-world usage and a code-oriented approach,
    adhering to an industry-standard coding paradigm, so as to help the learners gain
    practical expertise that can be useful for real-world projects.


    Some of the key aspects of books in this series are:


    +   - Crystal-clear text, spanning various JavaScript-related topics sorted by
    relevance.


    +   - Special focus on practical exercises with numerous code samples and programs.


    +   - A guided approach to JS coding with step-by-step tutorials and walkthroughs.


    +   - Keen emphasis on the real-world utility of skills, thereby cutting the redundant
    and seldom-used concepts and bloatware.


    +   - A wide range of references and resources to help the readers gain the most
    out of the books.


    The **Conquering JavaScript** series of books assume a basic understanding of
    coding fundamentals.


    The **Conquering JavaScript** series is edited by Sufyan Uzair, a writer and educator
    having over a decade of experience in the computing field. Sufyan holds multiple
    degrees, and has taught at universities and institutions worldwide. Having authored
    and edited over 50 books thusfar, Sufyan brings a wide array of experience to
    the series. Learn more about his works at sufyanism.com.


    https://www.routledge.com/Conquering-JavaScript/book-series/CRCCONJAV'
