    by the server before being sent to the browser.


    When a web browser encounters a block of JavaScript code, it will analyze it from
    top to bottom.


    Because it is order-sensitive, remember to reference the objects or variables
    inside the block before altering them.


    Variables with no values will produce an undefined error.


