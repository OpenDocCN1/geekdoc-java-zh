  md: '# 10 ■ Conquering JavaScript


    JS, which was originally intended to be part of Java, grew swiftly, and eventually
    became a separate programming language with its own ECMAScript definition.


    In terms of frontend development, GBKSOFT employs the JavaScript Programming Language,
    the Node.js environment, and the AngularJS framework.


    The final two are frameworks created in the JavaScript Programming Language.


    # What JavaScript Can Do For Us


    Modern JavaScript is a risk-free programming language. Because it lacks access
    to low-level resources such as memory or CPU. In reality, JS was first solely
    on browsers and browser interaction. Because the browser area is independent of
    the operating system, JavaScript is playing it safe. However, as time passed,
    developers began to apply JavaScript outside of the browser area. As a result,
    the capabilities of JavaScript now depend solely on the context in which it runs.
    JavaScript can do anything relating to web page manipulations, user interactions,
    and server interactions when it is executing in the browser (to some extent).


