    # ERRORS AND EXCEPTIONS IN JAVASCRIPT


    An exception denotes the occurrence of an abnormal circumstance that necessitates
    the use of unique operational approaches. An exception in programming is a piece
    of code that deviates from the regular flow of the code. Such exceptions need
    the use of particular programming structures in order to be executed.


    What Exactly Is Exception Handling?


    Exception handling is a procedure or method in programming that is used to handle
    and execute anomalous statements in code. It also allows you to regulate the flow
    of the code/program.


    Various handlers process the exception and the code are utilized to handle the
    code. For instance, dividing a non-zero number by zero always results in infinity,
    and this is an exception. Thus, it may be performed and managed with the aid of
    exception handling.


    To raise an exception in exception handling, a throw statement is used to throw
    an exception. Wrapping the exception in a try...catch block handles the thrown
    exception. If an error occurs, the catch block is performed; otherwise, just the
    try block instructions are executed.


    Thus, numerous forms of mistakes may occur in a programming language, interfering
    with the correct execution of the program. In programming, there are three categories
    of errors:


    +   - a. Syntax errors.

    - b. Runtime errors.

    - c. Logical errors.'
