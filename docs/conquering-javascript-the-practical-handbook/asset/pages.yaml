    The Global Variable in JavaScript


    A global variable in JavaScript may be accessed from any function.

    A global variable is one that is defined outside of the function or declared with
    the window object. As an example:


    ```

    <script>

    var data=250;//gloabal variable

    function d() {

    document.writeln(data);

    }

    function e() {

    document.writeln(data);

    }

