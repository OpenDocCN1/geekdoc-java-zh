  md: '# 144 Conquering JavaScript


    # Asynchronous


    When the HTML parser discovers this element, it sends a request to the server
    to get the script. If the script has to be downloaded while the page is being
    parsed and displayed, the async functionality it will do in the background. When
    the script is downloaded, the HTML parsing is halted and the script is executed.
    When the operation is complete, HTML parsing will restart.


    The page and other scripts do not wait for async scripts, and they do not wait
    for them. It is ideal for both independent and externally located scripts.


    # Syntax:


    ```

    <script async src = "script.js"></script>

    ```


    # Deferred


    The defer property instructs the browser not to interfere with HTML processing
    and to only run the script file once the HTML page has been completely processed.


    When a script with this attribute is discovered, the downloading of the script
    begins asynchronously in the background, and the scripts are only run once the
    HTML parsing is completed.


    # Syntax:


    ```

    <script defer src = "script.js"></script>

    ```


    # Asynchronous vs Deferred


    | Asynchronous | Deferred |

    | --- | --- |

    | Asynchronous prevents the page from being parsed. | Deferred never obstructs
    the page. |

    | Scripts do not rely on one another. As a result, a smaller script comes second
    in the list, it will be loaded before the prior lenght script. | Deferred scripts
    keep their relative order, which implies that the first script will be loaded
    first, followed by the others. |

    | Script execution begins with pause parsing. | However, script execution begins
    only after parsing is complete but before the document''s DOMContentLoaded event.
    |'
