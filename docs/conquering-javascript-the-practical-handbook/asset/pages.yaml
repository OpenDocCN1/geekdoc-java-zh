  md: '# Introduction to JavaScript 3


    # CLIENT-SIDE JAVASCRIPT


    The most frequent version of the language is client-side JavaScript. For the HTML
    code to be understood by the browser, the script must be integrated into or utilized
    as a reference by an HTML page. It suggests that a web page need not be static
    HTML, but rather incorporate programs that communicate with users, manage browsers,
    and dynamically create HTML content.


    The JavaScript client-side technique outperforms classic CGI server-side scripts
    in many ways. JavaScript might be used to validate user input in a form field,
    such as an email address. The JavaScript code is called when the user submits
    the form, and only if all of the inputs are accurate are they transmitted to the
    web server.


    JavaScript may be used to record explicitly or implicitly performed actions by
    users, such as button clicks, link navigation, and other actions.


    # WHAT IS THE PURPOSE OF JAVASCRIPT?


    The scripting language’s early versions were restricted for internal usage.


    The path was opened for ECMAScript to be published when Netscape submitted JavaScript
    to ECMA International as a standard specification for internet browsers.


    It was a general-purpose high-level programming language used to guarantee the
    interoperability of online pages across various browsers and devices.²


    Since then, JavaScript has grown with new browsers such as Mozilla Firefox and
    Google Chrome.


    The latter ever began V8, the first contemporary JavaScript engine that translates
    bytecode into native machine code.


    AngularJS, jQuery, and ReactJS are just a few of the frameworks and tools available
    for JavaScript today.


    Initially executed on the client side, the JavaScript implementation has expanded
    to the server side after the introduction of Node.js, a cross-platform server
    environment based on the Google Chrome JavaScript V8 engine.


    While it primarily caters to web-based applications, JavaScript programming capabilities
    have numerous uses in many fields.'
  merge: -1
