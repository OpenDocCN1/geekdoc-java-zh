    # DATA TYPES IN JAVASCRIPT


    JavaScript supports many data types for storing various sorts of values. In JavaScript,
    there are two kinds of data types:¹³


    +   * Primitive data type

    * Non-primitive data type


    JavaScript is a dynamic type language; therefore, there''s no need to specify
    the variable''s type before using it in code. To indicate the data type, we must
    use here.


    It may store any sort of value, such as integers, strings, and so on. As an example:


    ```

    var a=60;//hold number

    var b="Raman";//hold string

    ```


    # Primitive Data Types in JavaScript


    In JavaScript, there are five basic data types. These are their names:


    | Data Type | Description |

    | --- | --- |

    | String | Indicates a set of characters, as such "hi." |

    | Number | Depicts a set of numbers, e.g., 100. |

    | Boolean | Indicates a Boolean value that can be false or true |

    | Undefined | Signifies an undefined value. |

    | Null | Represents null, that is, no value at all. |


    # NON-PRIMITIVE DATA TYPES IN JAVASCRIPT


    The following are the non-primitive data types:


    | Data Type | Description |

    | --- | --- |

    | Object | Represents an instance that allows us to access members. |

    | Array | Indicates a set of values that are comparable. |

    | RegExp | Stands for regular expression. |'
