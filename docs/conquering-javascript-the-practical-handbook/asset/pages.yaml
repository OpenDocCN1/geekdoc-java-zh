    Using the command below, we can see how many different Node.js versions are currently
    installed and active on our machine.


    ```

    nvm list

    ```


    On our system, Node.js version 14.15.4 is currently active. If necessary, we may
    also install other, distinct Node.js versions on a machine (while building another
    Node.js project based on a different version). Choose a different Node.js version
    from the list provided by nvm, then execute the command below to install it.


    ```

    nvm install 12.20.2

    ```


    Here, we''ve chosen to install Node version 12.20.2; it also downloads and sets
    up a suitable version of npm on our smartphone.'
