    Asynchronous JavaScript

    Asynchronous code enables the program to be run instantly, but synchronous code
    prevents continued execution of remaining code until the current one is completed.
    This may not seem to be a major issue, but when seen in context, it might result
    in the User Interface being delayed.


    Let''s look at an example of how Asynchronous JavaScript works.


    ```

    <script>

    document.write("Hey"); // First

    document.write("<br>");


    document.write("Mayank") // Second

    document.write("<br>");


    document.write("How are you doing"); // Third

    </script>

    ```


    In the preceding code snippet, the first line of code Hey will be logged first,
    followed by the second line Mayank, and finally, the third line will be recorded
    after its completion.


    How are you doing. As we can see, the codes operate sequentially. Every line of
    code waits for the one before it is executed before it is run.


    Asynchronous JavaScript: Asynchronous code enables the program to be run instantly,
