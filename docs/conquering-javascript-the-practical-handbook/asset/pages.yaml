  md: 'There is a chance that dividing a number by an array was not something you
    intended to do. It is possible that you intended to divide a number by an array,
    maybe to find out what would happen if you did so, but in the vast majority of
    situations, this is a mistake in the code. The objective of the built-in type
    checker in TypeScript is to allow correct programs to execute while identifying
    as many common programming errors as is reasonably possible under the circumstances.


    When you move some code from a JavaScript file to a TypeScript file, you can discover
    type issues in the TypeScript file depending on how the code was written in the
    JavaScript file. It''s conceivable that these are legitimate problems with the
    code, but it''s also possible that TypeScript is being too cautious for no reason.
    In this post, we will demonstrate how to include a range of TypeScript syntax
    in order to eliminate errors as these.


    # Behavior During Runtime


    While JavaScript is being performed, another programming language known as TypeScript
    keeps the functionality intact. In JavaScript, for example, the operation of division
    by zero produces the value infinite without causing an error to occur during the
    execution of the program. The execution of JavaScript code will not be affected
    in any significant way by TypeScript, as a general rule.


    Because of this, when you migrate code from JavaScript to TypeScript, even if
    TypeScript deems the code to have type errors, it is assured that the code will
    run in the same manner as it did in JavaScript. Both JavaScript and TypeScript
    make use of the same grammar, which is why this is the case.


    One of the most important guarantees made about TypeScript is that it will keep
    the runtime behavior as JavaScript. This indicates that you will be able to transition
    between the two languages in a smooth manner without having to worry about any
    little modifications that may cause your application to stop operating properly.


    # Erased Types


    When the TypeScript compiler has completed checking your code and is ready to
    build the “compiled” version of the code, it will often erase all of the types.
    This is done in preparation for the next step in the process. This indicates that
    the simple JS that is created when your code is compiled does not contain any
    type information.'
