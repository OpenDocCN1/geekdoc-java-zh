  md: '# 278 Conquering JavaScript


    JSX


    JavaScript XML is what JX refers to. It''s a new addition to the JavaScript syntax.


    ReactJS employs a syntax that''s similar to XML or HTML.

    Calls to the React Framework''s Java API are generated from this syntax. By enhancing
    ES6, it allows HTML-like text to coexist with JavaScript react code. In ReactJS,
    JSX is not required but is highly encouraged.


    # Components


    Components are the backbone of ReactJS. Each individual ‘component’ in a ReactJS
    program has its set of rules and processing capabilities. Because of its modular
    nature, these parts can be reused, making it easier to manage the codebase of
    large-scale projects.


    # Data Binding, One Way Only


    Due to its architecture, ReactJS only supports one-way data binding and flows
    in just one direction. Using one-way binding, you may exert more command over
    the whole program.


    If information is flowing in the other way, then supplementary capabilities are
    needed.


    > This is due to the fact that data included inside components should be immutable.
    The flux pattern is useful for ensuring that your data flows in just one way.
    The application''s newly discovered flexibility is the main cause of the higher
    efficiency.


    # Virtual DOM


    A DOM object that exists only in a computer''s memory is called a ‘virtual DOM
    object.’

    The effect is similar to a one-way data binding.


    If there are any changes made to the web app, the complete user interface will
    be re-rendered in a virtual DOM representation. Then, it compares the old DOM
    representation to the new one. Afterward, just the modified elements will be reflected
    in the true DOM. This eliminates memory waste and speeds up the program.


    # Simplicity


    Because it is written in JSX files, ReactJS is easy to learn and implement.'
