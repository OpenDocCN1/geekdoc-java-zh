  md: "# 168 Conquering JavaScript\n\n```\nconst my_Cookie = document.\ngetById(\"\
    setcookie\")\nmyCookie.addEventListener(\"click\", e=> document.\ncookie = \"\
    mycookie=2\"\n</script>\n</body>\n</html>\n```\n\nIt will display a button component\
    \ on our website page based on the preceding example. When we press the button,\
    \ the requested cookie is created for our system storage.\nSimilarly, we may construct\
    \ the cookie with any other event listener. To set the cookie, we can alternatively\
    \ add an onload event.\nLet’s look at few cookie properties:\n\n# Properties of\
    \ Cookies\n\nThe cookie attributes are consistent across all sorts of cookies;\
    \ the following are some of the typical cookie properties:\n\n# Scope of Cookies\n\
    \nThe scope of a cookie specifies which URLs are transmitted with the cookie.\
    \ Cookie scope is separated into two distinct attributes:\n\n+   - Path\n The\
    \ path is one of the properties that define a cookie’s scope. It defines a specific\
    \ URL route in the HTTP header to transmit the cookie. To set the cookie to various\
    \ routes, use the following code:\n\n```\ndocument.cookie=\"cookiefirst=1; path=/path1\"\
    \ndocument.cookie=\"cookiesecond=2; path=/path2\"\n```\n\nWhen we visit a website\
    \ with the provided URL, such as example.com/path1, we will now submit a cookie\
    \ header with the value “cookiefirst=1.”\nIf we navigate to another URL, such\
    \ as example.com/path2, we will submit a cookie header with the value “cookiesecond=2.”\n\
    Except for the defined URLs, other requested routes will not transmit any cookie\
    \ headers."
