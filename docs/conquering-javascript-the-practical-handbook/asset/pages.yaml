  md: '# 212 Conquering JavaScript


    Naturally, JavaScript frameworks aren''t actual buildings like our tent, but the
    idea is the same.


    Let''s take a minute to address two frequently asked topics before on to the most
    well-known JavaScript frameworks.


    What Distinguishes a JavaScript Framework


    from a JavaScript Library?


    Libraries in JavaScript are collections of code created for certain use cases.


    For instance, the Day.js package is devoted to making use of dates in JavaScript,
    which may be challenging for experienced developers.


    jQuery is a well-known JavaScript library that simplifies the syntax for DOM traversal,
    event handling, animations, and other typical operations. On the other hand, frameworks
    are designed to perform various tasks and serve as the foundation of a web application.


    Like Angular, several frameworks design the complete site tree. In other words,
    they support the full application. Like Vue.js, allow for gradual usage, allowing
    our application to make restricted use of the framework.


    For particular cases that our framework doesn''t handle, we''ll probably utilize
    libraries in our application. Remember those annoying dates with Day.js? This
    library is not required to be used in views that exclude dates.


    However, regardless of the functionalities we use, if our application is created
    using Angular, the page template is written in Angular''s syntax. In contrast,
    Day.js may be called where it is necessary and not called where it is.


    Use a JavaScript Framework, But Why?


    Because frameworks are constructed on top of JavaScript, we can accomplish any
    function a framework does using standard JavaScript.


    But because the hard work has already been done, we go through all that bother
    again?


    This underlines the fundamental advantage of using a JavaScript framework: More
    capability without the need for us to produce new code.


    For instance, the virtual document object model is used by both React and Vue.js
    (DOM).


    Because it only updates altered HTML components, the virtual DOM is quicker at
    handling HTML elements.


    Contrarily, regular JavaScript will render the whole DOM once regardless of the
    amount of the change.'
