  md: "# Conquering JavaScript\n\n+   - Authentication\n Cookies are also essential\
    \ for user authentication. When a user checks in, the server responds with the\
    \ Set-Cookie HTTP header, which sets a cookie with a unique “session identifier.”\n\
    The cookie is sent across the internet via the Cookie HTTP header the next time\
    \ same user requests the same website.\nAs a result, the server can determine\
    \ who made the request.\n\n# How Do Cookies Work?\n\nEach time a user interacts\
    \ with a website, a new request is made to the server, and each time he does any\
    \ action within the program, a new request is sent to the server. Every new request\
    \ submitted by a separate user was taken into account by the server.\nTo identify\
    \ requests from the same user, developers must include the cookie in the server’s\
    \ response, which is kept in the system’s local memory. If the same user submits\
    \ a request to the server, the server recognizes the user using cookies.\nThe\
    \ web browser is the client-side communication channel that sends requests from\
    \ the client to the server.\nOnce the cookie is added by the developers, the requests\
    \ submitted by users are detected, and the server provides the answer based on\
    \ the customization.\nCookies are critical from the standpoints of both users\
    \ and developers. It aids both parties in responding appropriately.\nLet’s look\
    \ at how to make cookies with JavaScript.\n\n# Cookies in JavaScript\n\nLet’s\
    \ look at how to make cookies with JavaScript:\n\n# Create Cookies\n\nWhen a request\
    \ is received, the server may respond with one or more Set-Cookie headers. It\
    \ will be saved in the system’s local storage. So, the next time when the browser\
    \ sends a request to the server, it will also send the cookie with the request.\n\
    We may optionally set an expiration date or time period after which the cookie\
    \ will be invalid and not be transmitted. We may also apply some extra constraints\
    \ to a specified domain and path to limit when the cookie is transmitted."
  merge: -1
  pgno: 206
- img_proc: true
  md: "# Getting Started with JavaScript II ■ 167\n\nTo create, read, update, and\
    \ remove cookies, JavaScript offers the document.cookie property.\nThe syntax\
    \ for creating a cookie is as follows:\n\n```\ndocument.cookie=\"classname=value\"\
    ;\n```\n\nAn HTTP cookie can be generated in two ways. Cookies can be created\
    \ on the client using the browser interface or added from the server in the file's\
    \ script section. To add from the client side, we may open the console and type\
    \ the JavaScript code into the browser. Set-cookie headers are included from the\
    \ server side to generate one or more cookies.\n\nLet's look at how cookies are\
    \ created on both the client and server sides.\n\n# Client Side\n\nTo access the\
    \ cookie from the client side, open the console in our browser and enter the following\
    \ code:\n\n```\ndocument.cookie=\"mycookie=1\";\n```\n\nUsing the web browser's\
    \ dev tool, we can also examine the cookies saved on the local system. To see\
    \ if the cookie has been added, go to the dev tool's application tab and pick\
    \ the Cookies.\n\n# Web Server Side\n\nTo add the server cookie, we must create\
    \ the cookie on an activity when the user visits the page.\nConsider the following\
