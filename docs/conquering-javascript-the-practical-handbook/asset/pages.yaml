    # Performance


    Traditional Document Object Model (DOM) necessitates an update for each code change,
    which degrades the efficiency of the application. Virtual DOM accelerates the
    process by functioning as temporary memory storage for user interface interfaces.


    A procedure called diffusion or reconciliation delays updates until they can be
    successfully updated and rendered.


    React utilizes virtual DOM to decompose an application’s code as the code is run.


    VDOM improves React’s performance over conventional JavaScript languages. However,
    Svelte improves efficiency by avoiding the VDOM diffing procedure. Svelte is a
    compiler that renders DOM documents using reactive programming. The DOM is updated
    whenever an assignment causes a change in the component stage. As a serverless-first
    framework, Svelte is therefore seen as more reactive than React.


