    In this example, we will learn three alternative methods to print ‘Hello

    World’ in JavaScript.


    A ‘Hello, World!’ program is a basic program that prints the phrase

    “Hello, World!’ on the screen.


    Because it is a fairly basic program, it is often used to teach newbies

    new programming language.


    We’ll print ‘Hello, World!’ in three different ways.


    +   * console.log()

    * alert()

    * document.write()


    +   1. **Using console.log()

    The console.log() function is used to debug the code.


    ```

    ``` // program of hello world

    console.log(''Hello World!''); ```

    ```


    +   2. **Using alert()

    The alert() function displays an alert box with the supplied message

    over the current window.


    ```

    ``` // program of hello world

    alert("Hello, World!"); ```

    ```


    +   3. **Using document.write()

    When we wish to print information to an HTML document, we use

    document.write().


    ```

    ``` // program of hello world

    document.write(''Hello, World!''); ```

    ```


