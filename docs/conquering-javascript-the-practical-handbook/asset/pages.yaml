  md: '# 336 Conquering JavaScript


    The Downsides of Node.js


    Heavy Calculation Activities Cause Performance Constraints

    Even today, the most significant limitation of Node.js is its inability to handle
    CPU-bound activities.³


    But, in order to comprehend the underlying causes of this problem, we need some
    context.


    Let''s start with the fundamentals: JavaScript. Node.js, as we know, is a server-side
    runtime environment that runs JavaScript. JavaScript, as a frontend programming
    language, works on a single thread. Threading is not necessary since JavaScript
    tasks are lightweight and consume minimal CPU.


    Returning to Node.js, we now understand why it is deemed single threaded:


    It executes JavaScript in a single thread.


    A non-blocking input/output architecture means that Node.js responds to the client
    call to start a request and processes the job as the call-back is finished, the
    task is ready.


    Node executes JS code on an event basis on its single thread while processing
    jobs asynchronously. That is referred to an event loop.


    The issue arises when Node.js gets a CPU constrained task: if a big request arrives
    in the event loop, Node.js will set all available CPU to handle it first, before
    answering other requests queued. Because of the sluggish processing and overall
    latency in the event loop, Node.js is not recommended for intensive computing.


    However, with the 10.5.0 upgrade in 2018, multithreading was added as an experimental
    capability in Node.js.


    A new feature the worker threads module allows you to employ extra threads from
    a thread pool to carry out CPU-bound activities.


    However, this is only possible on machines with several cores, because Node.js
    still enables us to use one core for one thread.


    This means that heavy parallel tasks can be run on a separate thread. This functionality
    is still experimental in Node.js version 12; however, it has been greatly improved.


    # Callback Hell Is a Problem


    Because of its asynchronous nature, Node.js mainly relies on callbacks, which
    are routines that execute when each job in the queue is completed.'
