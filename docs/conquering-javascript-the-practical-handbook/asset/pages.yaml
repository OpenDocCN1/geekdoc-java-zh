  md: '# 474 Appendix II


    +   - Variables are scalar in nature. To put it another way, a variable declaration
    can never contain more than one at a time regardless of the circumstances. This
    suggests that in order for a program to be able to hold n values, there will need
    to be n variable declarations made before the program can run. When one has to
    retain a larger collection of data, the use of variables is not an option since
    it is not realistic. This means that one cannot use variables.


    +   - It may be difficult to retrieve or read the values in the order in which
    they were declared since the memory for the variables in a program is allocated
    in what seems to be an arbitrary sequence.


    In order to address this issue, the programming language TypeScript has a component
    called as arrays in its toolkit. When we speak about arrays, we refer to collections
    of things that all have the same data type. An item collection known as an array
    has elements that are all of the same kind. It is sort that the user chooses for
    themselves to have.


    # What Makes Up an Array


    The following is a list that outlines, in more depth, the qualities of an array:


    +   - Memory will be allotted in a sequential manner whenever a declaration of
    an array is made.


    +   - There is never any variation in arrays. This signifies that once an array
    has been started, its size cannot be altered in any way after it has been started.


    +   - Each memory block is a substitute for one of the array''s items.


    +   - The subscript or index of an array element is a single number that is used
    to identify element inside the array specifically. This number may also be referred
    to as the array element''s index.


    +   - Just like variables, arrays need to have their definitions written before
    they can be used in a program. This is a prerequisite for using arrays. Utilizing
    the var keyword is necessary before an array can be declared.'
