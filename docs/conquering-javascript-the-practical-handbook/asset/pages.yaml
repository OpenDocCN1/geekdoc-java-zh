  md: '# Getting Started with JavaScript ■ 73


    Many newcomers with minimal understanding attempt to study a framework; no surprise,
    they get stopped someplace and eventually stop concentrating on the basics of
    Vanilla js.


    When they are comfortable, they begin studying frameworks again, and this time
    they learn considerably faster. Other significant benefits of the vanilla script
    include:


    +   * **Interoperability**: We can inject JavaScript into any of the web pages,
    but not in another programming language. Consider PHP. We may also use it in a
    variety of applications because it supports other languages such as PHP and Pearl,
    among others.


    +   * **Server Load**: Load on the server. Because we know that JavaScript is
    executed on the client side, it minimizes the need for server utilization. Furthermore,
    the basic program does not require any interaction from the server.


    +   * **Rich user interfaces**: We can use JavaScript to construct high-quality
    features like drag-and-drop and components like a slider. This can have a good
    influence on the user experience on the website.


    +   * **Speed**: Because it is executed on the client side and does not require
    any external resources, the speed is great. Calls to a backend server have no
    effect on the performance of JavaScript.


    Vanilla Script’s Disadvantages


    +   * One of the most fundamental downsides of vanilla script is client-side security,
    since we all know that JavaScript code is readable on the client. As a result,
    anybody with the ability to change it may use it as a weapon or tool for nefarious
    reasons.


    +   * Another significant drawback of JavaScript is the absence of a Debugging
    Facility.


    +   * We can''t utilize it for network-based apps since there isn''t any such
    support.


    +   * The vanilla script also lacks certain features, such as multiprocessors
    and multithreading.


    +   * It also prohibits reading and writing data for security reasons.'
