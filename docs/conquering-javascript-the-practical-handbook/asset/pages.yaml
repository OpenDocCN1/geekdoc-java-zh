  md: '# TypeScript’s Support for Structural Typing


    The programming language TypeScript is a structurally typed language, which means
    that in order for two items to be deemed to be the same type, they must have equivalent
    and similar properties.


    # Inference of Type Utilizing TypeScript


    In the event that no explicit type is supplied, the TypeScript compiler may make
    an attempt, based on its own logic, to infer the type to a variable or function
    based on the initial values of the variable or the application of the function,
    respectively.


    When you create variables, set default values, or figure out the type of the result
    that a function should return, you are most likely engaging in some kind of inference.


    ```

    const platform = ''freeCodeCamp'';

    const add = (a: number, b: number) => a + b

    ```


    In the example that was just shown, the variable platform is given the string
    value even though we did not do so explicitly. Additionally, the return value
    of the function is assumed to have the type number.


    # Deleted Characters in TypeScript


    During compilation, TypeScript eliminates the following constructs of the type
    system:


    Input


    let x: someType;


    Output


    let x;


    # WHY SHOULD YOU USE TYPESCRIPT?


    Checking for Typos and Doing Static Analysis of the Code


    Since this, the total number of faults in your code will decrease overall because
    TS will alert you whenever you make an incorrect usage of a particular type.'
