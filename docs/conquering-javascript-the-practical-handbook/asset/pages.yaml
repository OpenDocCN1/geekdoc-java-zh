  md: '# Backend Development ■ 339


    The Node.js distribution is available as a binary installable for SunOS, Linux,
    Mac OS X, and Windows operating systems that support the 32-bit (386) and 64-bit
    (amd64) x86 CPU architectures.


    The section that follows will show us how to install the Node.js distribution
    on different operating systems.


    The Node.js Archive


    Visit https://nodejs.org/download to obtain the most recent installable archive
    file for Node.js. The versions that are available on various OS as of the time
    this was written are listed below.


    | OS | Archive Name |

    | --- | --- |

    | Windows | node-v6.3.1-x64.msi |

    | Mac | node-v6.3.1-darwin-x86.tar.gz |

    | Linux | node-v6.3.1-linux-x86.tar.gz |

    | SunOS | node-v6.3.1-sunos-x86.tar.gz |


    Installation on SunOS, Mac OS X, Linux, and UNIX


    Install and extract the node-v6.3.1-osname.tar.gz archive into /tmp according
    to the OS architecture for our computer, and then move the extracted contents
    to /usr/local/nodejs. For instance:


    ```

    $ cd /tmp

