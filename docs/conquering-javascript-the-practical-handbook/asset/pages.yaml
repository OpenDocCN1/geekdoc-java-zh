    - Stack Overflow


    Most people may also find it difficult to accept that the number of websites that
    use vanilla JavaScript is much more than the number of websites that utilize JQuery.


    # Why Should We Learn Pure JS?


    This is a typical issue among beginners: why should they learn and utilize vanilla
    Js when there are so many sophisticated frameworks and packages available?


    We intend to study and use vanilla js for our projects for a variety of reasons.

    The three biggest and most essential of them are discussed below.


    # Website Performance


    Because it is the most costly and critical portion of the frontend stack, this
    is far better for web performance than many other frameworks and tools. Unlike
    HTML and CSS files, which are only accessible when downloaded, vanilla js code
    must be built and processed. A 50kb file has a considerably greater influence
    on web speed than the same size HTML and CSS files.


    # User Interface


    It offers a simple yet user-friendly development experience. A developer may begin
    building an application or website using JavaScript by simply opening a text editor.
    There is no need for the developer to undertake time-consuming tasks such as npm
    install, compilation processes, and no build, among others.


    It also Makes Working with Frameworks Simpler

    A developer still wants to utilize one of the other frameworks, this makes working
    with them more pleasant. As we are all aware, getting started with a framework
    is difficult. The documentation has a lot of assumed knowledge, and knowing how
    all accessible tools function it much simpler to learn.'
