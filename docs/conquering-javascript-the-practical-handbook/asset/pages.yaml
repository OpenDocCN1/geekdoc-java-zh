    MongoDB Data Modeling

    As we saw in the introduction, MongoDB data has a flexible structure.8

    Unlike SQL databases, which require you to define the schema of a table before
    entering data, MongoDB''s collections do not impose document structure.

    This kind of adaptability is what makes MongoDB so effective.

    Keep the following points in mind when modeling in Mongo.


    +   * What are the application''s requirements?—Examine the application''s business
    requirements to determine what data and the sort of data it requires.

    * As a result, ensure that the structure of the document is determined appropriately.
    What are data retrieval patterns?—If we anticipate a high volume of queries, consider
    including indexes in our data model to query performance.

    * Are frequent inserts, updates, and deletions in the database? To increase the
    overall efficiency of our MongoDB system, reconsider the usage of indexes or add
    sharding if necessary in your data modeling strategy.


    What Distinguishes MongoDB from RDBMS

    The following are some significant differences between MongoDB and RDBMS:


    | MongoDB | RDBMS |

    | It is a document-oriented, non-relational database. | The database is a relational
    one. |

    | It is appropriate for storing hierarchical data. | It is not appropriate for
    storing hierarchical data. |

    | Its schema is dynamic. | It already has a schema. |

    | The CAP theorem is at its core (Consistency, Availability, and Partition tolerance).
    | It focuses on the characteristics of ACID (Atomicity, Consistency, Isolation,
    and Durability). |

    | It performs significantly better than RDBMS in terms of speed. | It performs
    worse than MongoDB in terms of speed.'
