    Features of npm


    +   - Package.json files, which are used to define all npm packages.


    +   - The package.json file''s content must write in JSON.


    +   - The name and version fields must both be included in the definition file.


    package.json


    When we use npm init to launch a JavaScript/Node.js project, a “package-json”
    file will create with the essential metadata details supplied by developers.


    +   - Name: This is the title of our JavaScript project or library.


    +   - version: This is the project''s version.'
