    TypeScript can construct a type system compatible with JavaScript code but also
    has types since it understands how JavaScript works. This provides a type system
    without requiring you to add characters to your code to make the types obvious.
    That is how TypeScript is able to determine that the HelloWorld variable represents
    a string in the example that was just shown.


    You could have used the editor auto-completion feature in Visual Studio Code while
    you were writing JavaScript. Under the hood, Visual Studio Code uses TypeScript,
    simplifying the process of working with JavaScript.'
