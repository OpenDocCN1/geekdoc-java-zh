    # HTTP COOKIES


    A web cookie, also known as an HTTP cookie, is a little piece of data sent by
    the server to the online browser. The cookies may be stored by the browser and
    sent back to the server along with subsequent requests.¹³ Cookies are commonly
    used to detect repeated requests from the same site (browser). It assists the
    user in remaining logged in and tracking their data, by user name and session.
    It’s also a good idea to keep track of the stateful information for the stateless
    HTTP protocol.


    If we are a developer, we cannot avoid cookies because they are necessary for
    session management and monitoring other user information. A cookie is as crucial
    nowadays as any other app functionality. Cookies facilitate various tasks for
    both the user and the programmer.


    Cookies have been around for a while and are still changing now. A cookie is just
    textual data about a web app. When a user visits a website, certain information
    is stored to the system''s local storage so that the app may recognize the user
    and display appropriate results if they visit.


    When the user visits a website, the server requests the application''s home page,
    and he performs a specific action, the server requests any other page of the application.
    So, if the user visits the 100th time, the request will be unique each time. Because
    server queries are so intense, saving data directly to the server is unfeasible;
    moreover, it may cause a server overload. Furthermore, if the user does not return,
    the information gathered will be outdated.


    As a result, in order to remember the user''s identity, the server transmits cookies
    with the response, which are saved to the system''s local storage. When the same
    client performs the same request again, the server will identify its identity
    and display the appropriate response.'
