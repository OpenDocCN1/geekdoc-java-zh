    # NUMBER OBJECT IN JAVASCRIPT


    We may express a numeric value using the JavaScript number object.

    It may be either integer or floating point. To represent floating-point

    numbers, the JavaScript number object adheres to the IEEE standard.28

    In JavaScript, we may build a number object with the Number()

    constructor. As an example:


    ```

    var nm=new Number(value);

    ```


    If the value cannot be converted to a number, it returns NaN (Not a

    Number), which may be tested using the isNaN() function.

    We may also assign a number to a variable. As an example:


    ```

    var x=110;//integer value

    var y=132.7;//floating point value

    var z=1e46;//exponent value, output: 140000

    var n=new Number(15);//integer value by number object

    ```


    Number Constants in JavaScript

    Check the defined JavaScript constants for numbers.


    | Constant | Description |

    | MIN_VALUE | The biggest minimum value is returned. |

    | MAX_VALUE | The biggest maximum value is returned. |

    | POSITIVE_INFINITY | overflow value, yields positive infinity. |

    | NEGATIVE_INFINITY | overflow value, yields negative infinity. |

    | NaN | reflects the value "Not a Number." |'
