  md: '# WHAT EXACTLY ‘VANILLA JAVASCRIPT’?


    The phrase vanilla script refers to pure JavaScript (or simple JavaScript) that
    does not include any other libraries.


    It was often used as a joke that ‘nowadays various things may also be done without
    the usage of any extra JavaScript libraries.’


    One of its lightest frameworks ever made is the vanilla script. It''s quite easy
    to use and comprehend, and it''s also very straightforward.⁸


    Using the vanilla script, you may construct big and influential apps as well as
    websites. The individuals who developed vanilla JavaScript are always striving
    to enhance it and make it more helpful for web developers.


    Let''s look at some of the most prominent websites using simple JavaScript right
    now.


    The websites listed below are presently utilizing vanilla JavaScript, and they
    are also mentioned on the vanilla JavaScript home page.


    +   - Google

    - Facebook

    - Yahoo

    - Wikipedia

    - YouTube

    - Twitter

    - Apple

    - Amazon

