  md: "# Getting Started with JavaScript II ■ 159\n\n# Axios\n\nAxios is a well-known\
    \ third-party program for performing HTTP requests in JavaScript. Under the hood,\
    \ it collaborates with the native XMLHttpRequest API to provide a straightforward\
    \ and comprehensive collection of functionality for handling specific challenges\
    \ as intercepting HTTP requests and delivering simultaneous requests. It, like\
    \ Fetch, enables promises for dealing with asynchronous requests.\n\nWhen performing\
    \ GET requests using Axios, we may compile the request using the specialized axios.get()\
    \ function. We've presented an example of implementation here:\n\n```\naxios.get(\"\
    https://world.openfoodfacts.org/category/pastas/1.json\")\n.then(response => {\n\
    \  // access the parsed JSON response data using the\n  data = response.data\n\
    \  console.log(data.count)\n  console.log(data.products)\n})\n.catch(error =>\
