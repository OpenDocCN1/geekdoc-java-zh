  md: '# Getting Started with JavaScript II ■ 169


    +   * Domain

    The domain is the cookie''s second property. Domains function as a container for
    cookies. The cookie provides a unique domain name to itself, which assists the
    administrator in keeping the cookies particular and organized for http request
    for web pages. An example of a domain-specific cookie is shown below:

    Domain=google.com enables cookies for the domain google. and its subdomains, including
    pasta.google.com.


    +   * Expires and Max-Age

    A cookie''s "Expires" and "Max-Age" parameters define its lifetime or expiration
    date. They are classified as persistent cookies. With the exception of the term
    "permanent cookie," the "Expires" property can remove a cookie on a certain date.
    Furthermore, the "Max-Age" deletes cookies after a given time.

    Session cookies, on the other hand, are destroyed when the current session expires.
    Some browsers allow us to choose when the current session will finish, which can
    be any length of time, indefinitely.


    +   * SameSite

    The SameSite property enables us to set the cookie when a link within a page is
    clicked. We have spoken about how to establish cookies for a certain URL, but
    what if we want to put the cookie on a link inside that direct URL? Using the
    SameSite, we may transmit cookies by clicking on a link from a redirected page.
    We can instruct SameSite to transmit cookies in response to cross-site requests
    or if a user clicks on a web page.

    Let''s look at an actual scenario where the SameSite property enables cross-site
    cookies. The flow chart explains how cookies are transmitted and received while
    moving from one page to another.

    The user navigates to a URL (for example, google.com)

    They''ll get a first-party cookie.

    The user will go to google.com and click on the link that may retrieve request
    to another site, such as www.googleexample.com.

    Tutorialexample.com will place a cookie with the domain name Domain=googleexample.com.'
  merge: -1
  pgno: 209
- img_proc: true
  md: "# 170 ■ Mastering JavaScript\n\nGoogle.com now stores a third-party cookie\
    \ from googleandample.com.\n\nWith the following three values, the SameSite property\
    \ defines whether third-party cookies are sent:\n\n+   - Strict\n  The strict\
    \ value for the SameSite property will only be transmitted through a first-party\
    \ cookie context. Third-party cookies will not be considered.\n\n+   - Lax\n \
    \ When a user hits a link with third-party navigation, the “Lax” value of a SameSite\
    \ property is delivered. If the SameSite property is not explicitly specified\
    \ on the third-party link, the default value is lax.\n\n+   - None\n  If the SameSite\
    \ property is set to “None,” cookies are transmitted in all contexts.\n  We’ve\
    \ spoken about cookies and their attributes; now let’s look at the many sorts\
    \ of cookies:\n\nVarieties of Cookie\n\nCookies are classified into the following\
    \ kinds based on their usage and behaviors:\n\nFirst-Party Cookies\n\nFirst-party\
    \ cookies are those that are transmitted to the system directly from the server\
    \ of the website that we are viewing. The visited website stores these cookies\
    \ directly on our computer. Most websites send cookies to their visitors to collect\
    \ useful information and analytics in order to improve the user experience.\n\n\
    Authentication is the greatest example of a first-party cookie. When a user registers\
    \ in an application, the server sends cookies to the client, which keeps them\
    \ on the user’s local machine. We do not need to enter the login credentials again\
    \ the next time you check in the program. The website cannot identify the user\
    \ without first-party cookies and will not automatically log us in or remember\
    \ our choices from previous sessions."
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Getting Started with JavaScript II ■ 171


    Third-Party Cookies

    nThe third-party domains to which we are redirected create third-party cookies.


    It is not created by the domain in which we are currently logged in.

    These cookies are typically used for tracking and are retained even after the
    browser is closed. Ad tracking from websites is an excellent example of a third-party
    cookie. We may have noticed that after browsing a few products from various eCommerce
    sites, we will begin to see ads for those products. Because we may have been exposed
    to third-party cookies from a domain other than that specific website while browsing
    the products.


    When we close the browser or that specific website, a third-party cookie can be
    used to track our browsing details, such as which products you have seen or not
    we have purchased them. After that, we''ll have to start receiving emails about
    those products and seeing advertisements from various agencies.


    # Session Cookies


    Session cookies are transient cookies that are deleted when the user closes the
    browser tab.


    +   Session cookies are often utilized when a user inputs their login credentials
    and connects to an application. When session cookies are utilized, users must
    provide their credentials each time they attempt to log in to the application.


    The shopping cart management on an eCommerce site is a good example of a session
    cookie.


    Session cookies aid in the organization of a user''s shopping cart.

    If the site does not employ session cookies, users will have a more difficult
    time remembering the goods they have chosen.


    # Secure Cookies


    The cookies include a Secure feature to prevent unwanted access from cookies given
    to a user as part of an HTTP response. When cookies are used in conjunction with
    the Secure property, all HTTP requests will contain the cookie only if it is communicated
    over a secure medium.


    In 2002, Microsoft Internet Explorer introduced HttpOnly. Cookies with the HttpOnly
    flag can be included in a Set-Cookie HTTP header. The HttpOnly property decreases
    the possibility of users clicking on a malicious link that exploits cross-site
    scripting vulnerabilities.'
