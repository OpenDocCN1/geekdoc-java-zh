    Types


    TypeScript, on the other hand, is a typed superset that extends the rules that
    control different kinds of values may be applied. It does this by extending the
    rules that govern how values are applied. The issue that had been occurring before
    with obj.height was not due to a syntax error; rather, it was an error that happened
    as a result of the incorrect application of some sort of value (a type).


    Another example of this would be the piece of JavaScript code that follows, when
