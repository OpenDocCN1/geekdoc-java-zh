  md: '# MongoDB Features Include


    +   - Schema-less Database: MongoDB offers a nice feature called schema-less databases.
    A schema-less database allows several types of documents to be stored in a single
    collection. That is to say, in the MongoDB database, several documents of varying
    field counts, content types, and sizes may coexist in the same collection. It
    is not required for one document to be comparable to another, as in relational
    databases. MongoDB’s interesting feature gathers a lot of flexibility.


    +   - Oriented to Documents: As MongoDB, all data is kept in documents rather
    than tables in RDBMS. In these documents, data is kept in fields (key-value pairs)
    rather than rows and columns, making the data far more flexible than in RDBMS.
    And each document has a distinct object id.


    +   - Indexing: Every field in the documents in the MongoDB database is indexed
    with main and secondary indices, making it easier and taking time to obtain or
    search data from the pool of data. If the data is not indexed, the database must
    search each document individually with the supplied query, which takes a long
    time and is inefficient.


    +   - Scalability: MongoDB offers horizontal scalability via sharding. Sharding
    is the process of distributing data over numerous servers. A huge quantity of
    data is partitioned into data chunks using the shard key, and these data pieces
    are distributed evenly across shards that exist across many physical servers.
    It will also add additional machines to an already active database.


    +   - Replication: With the aid of replication, MongoDB enables high availability
    and redundancy by creating several copies of the data and sending these copies
    to a separate server so if one server fails, the data may be accessed from another
    server.


    +   - Aggregation: It allows us to conduct actions on aggregated data to obtain
    a single or calculated output. It is analogous to the SQL GROUPBY clause. It offers
    three types of aggregations: aggregation pipelines, map-reduce functions, and
    single-purpose aggregation techniques.'
