  md: '# Frontend Development ■ 297


    # Characteristics of ReactJS


    +   - JSX: JSX is a syntactic extension for JavaScript. The JSX syntax is converted
    into React Framework JavaScript calls. It extends ES6 so that HTML-like text may
    coexist with React code written in JavaScript.


    +   - Components: Components are fundamental to ReactJS. Multiple components make
    up a ReactJS application, and each component has its own logic and controls. These
    components are reusable, which makes it easier to maintain the code in bigger
    projects.


    +   - One-way Data Binding: ReactJS uses unidirectional data flow, or one-way
    data binding. The one-way data binding provides more application-wide control.
    If the data flow is in the other direction, then extra characteristics are required.
    This is because components are intended to be immutable and their data cannot
    be modified.


    +   - Virtual DOM: A virtual DOM object is a representation of a physical DOM
    object. When changes are made to a web application, the complete user interface
    is re-rendered in virtual DOM form. The difference between the existing DOM representation
    and the new DOM is then examined. Once complete, the actual DOM will only update
    the modified elements. It speeds up the program and eliminates memory waste.


    +   - Simplicity: ReactJS utilizes the JSX file, which makes the application easy
    to both create and comprehend. In addition, ReactJS is a component-based framework
    that allows code to be reused as required. It makes it easy to use and understand.


    +   - Performance: ReactJS is renowned for its excellent performance. This is
    because it has control over a virtual DOM. The DOM is purely memory-based. As
    a result, when we construct a component, we do not immediately write to the DOM.
    Instead, we are developing virtual components that will transform into the DOM,
    resulting in a more efficient and fluid user experience.'
