    ```

    console.log(4 / []);

    ```


    Grammatically correct software tracks of infinity. TypeScript, on the other hand,
    will throw an error if you try to divide a number by an array it deems this to
    be a meaningless operation.


    ```

    console.log(4 / []);

    ```


    On the right side of an arithmetic operation, you are free to use any type that
    is numeric, bigint, or or enum. On the right hand side of an arithmetic operation,
    you may use a type that begins with “any,” “number,” or “bigint,” or you can use
