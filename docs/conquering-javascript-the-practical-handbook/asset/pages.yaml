    # TYPESCRIPT FOR DEVELOPERS WORKING IN JAVASCRIPT


    The connection between TypeScript and JavaScript is not what one may expect. TypeScript
    provides all of the functionality that JavaScript does, in addition to an extra
    layer on top of these features called the type system for TypeScript.


    JavaScript, for instance, offers language primitives such strings and numbers,
    but the programming language does not verify to ensure that you have consistently
    allocated them. TypeScript does.


    This indicates that the JavaScript code you have already written that is functioning
    properly is also valid TypeScript code. The primary advantage of using TypeScript
    is that it reduces the likelihood of errors by pointing out areas of your code
    that exhibit unexpected behavior.


    # Types Deduced from Inference


    TypeScript is familiar with the JavaScript programming language and, in instances,
    automatically creates types for you. For instance, when a variable is created
    in TypeScript and a specific value is assigned to it, TypeScript will utilize
    the value as the variable''s type.


