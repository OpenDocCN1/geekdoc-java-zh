  md: '# NAMESPACES IN TYPESCRIPT


    Using a namespace allows you to organize your code in a meaningful manner. TypeScript
    was designed with this feature in mind, unlike JavaScript, where variable declarations
    are placed in a global scope and might be overwritten or misunderstood if various
    JavaScript files are used inside the same project.


    # Namespace Determination


    In order to define a namespace, you must first use the term “namespace,” followed
    by the actual namespace’s name, like in


    ```

    namespace SomeNameNamespace {

    export interface ISomeInterfaceName {}

    export class SomeClassName { }

    }

    ```


    The term export must be used to indicate which classes or interfaces should be
    exposed outside of the namespace.


    The syntax for using a class or interface that is defined in a different namespace
    is to use the form namespaceName.className.

    SomeNameNamespace.SomeClassName;


    If the initial namespace is defined in a completely distinct TypeScript file,
    the triple slash reference syntax must be used to access it.


    ```

    /// <reference path = "FileName.ts" />

    ```


    Nested Namespaces

    An nested namespace definition looks like this:


    ```

    namespace namespace_1 {

    export namespace namespace_2 {

    export class class_name { }

    }

    ```


