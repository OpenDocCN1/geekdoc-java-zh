  md: '# 506 Appendix III


    Publishing a Package


    As long as a directory includes a "package.json," we can publish it from our PC.


    Verify that npm is installed:


    ```

    C:\>npm

    ```


    Verify our logged-in status:


    ```

    C:\>npm whoami

    ```


    If not, login:


    ```

    C:\>npm login

    Username: <our username>

    Password: <our password>

    ```


    Go to your project''s page and publish it:


    ```

    C:\Users\my_user>cd my_project

    C:\Users\my_user\my_project>npm publish

    ```


