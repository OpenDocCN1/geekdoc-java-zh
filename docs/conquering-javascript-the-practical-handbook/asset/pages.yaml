    Similarly, we can use the getElementsByClassName() function to get element collections
    for various classes.


    Distinction between the Methods getElementsByClassName(), querySelector(), and
    queryquerySelectorAll()


    +   - getElementsByClassName(): This method searches for items that match the
    supplied class and provides a list of the elements that match. The items returned
    are a live HTML collection of elements. If the Document Object Model is changed,
    these components will be updated.

    - querySelector(): This function returns a single element that matches the supplied
    className. If no matching element is found, it returns null.


    The essential aspect to remember is that all of the methods mentioned above return
    either one element or a list, but the getClassName() function handles dynamic
    updates, while the other two handle static updates.'
