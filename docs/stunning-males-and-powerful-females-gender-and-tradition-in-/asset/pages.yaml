    (Helligwig 1993: 51: Spiller 2008: 186–189, 192–193). Given that at some events,
    male guests enter the performance space, request a song as they tip the performers,
    and dance with the dancers, jaipongan is sometimes “reconstituted” as a participatory
    dance form (Spiller 2008: 193–194). Despite what happens in some cases, the idea
    is that “[b] separating the roles of singer and dancer, women performers circumvent
    some of the assumptions of low morals associated with ranging [female singer-dancers]”
    (Spiller 2010: 98).


    Similarly in central java, in some cases, the roles of the singer-dancer have
    been separated (Sutton 1984, 1987); Choy 1984: 65). R. Anderson Sutton showed
    that although the late nineteenth century, and perhaps earlier, there were females
    who sang but did not dance, the separation of the roles of singer and dancer in
    courtly and urban gamelan performances was more recent (1984: 124, 126; 1987:
    114). Many of the older female vocalists at the time of the publication of his
    essays in the 1980s have been famous singer-dancers in their youth (1984: 127;
    1987: 114). Sutton’s scholarship and observations suggest that the change from
    “singer-dancer” to “singer” or “dancer” in courtly and urban contexts was occurring
    during the course of the twentieth century. The separation of these roles in Besalan
    Putri in the 1960s, I believe, was part of this trend. Despite disputes of respect
    and some women’s specialization in either singing or dancing, female performers
    nonetheless have to contend with the negative image of the singer-dancer through
    New Order times and the present (Sutton 1984:127, 131; Cooper 2000: 626–627; Spiller
    2007: 46; 2008: 193; Hughes2008c; Larasati 2013: 131–132).


    At the same time, the line between female singers and dancers is not always so
    easy to draw. Many women continue to be competent in both singing and dancing,
    and a number of traditions featuring female singer-dancers have continued to be
    performed throughout the course of the twentieth and the twenty-first century.
    Tayub with her female singer-dancers was alive in Malang, females sang and danced
    in the course of performing Ngromo Tayub (see chapter two). It was rare for female
    dancers to sing as they performed Besalan Putri, the practice was not entirely
    extinct, a point I return to later in this chapter. Other traditions of singing
    and dancing also exist in Java. Females sang and danced in central Javanese-dramas,
    including langendrian and parts of wayang song (Sutton 1984: 126, n31; 1917: 114).
    Traditions featuring female singer-dancers have also continued in performances
    of popular music, such as campur sari and dangdut, and the female singer continues
    to inspire cultural expression about female sexuality (Browne 2000; Spiller 2008:
    197; Richter 2008; Daniels 2009: 81–94; Weintraub 2010, 2011; Bader 2011).'
