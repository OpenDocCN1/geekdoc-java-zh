    It seems that when it comes to the issues of innovation and change, some performers
    invoked double standards. Although they criticized “nowadays” for “ruining” Ngromo
    Lanang, they underscored the flexibility of this dance, repeatedly explaining
    how they made changes so that their audiences would not become bored. As performers
    recalled that during busy months, they performed Ngromo almost every day—and sometimes
    twice a day—it became clear that the potential boredom was real. As performers
    recalled inserting other compositions, using different types of song texts, and
    incorporating different movements, it was apparent that Ngromo has a remarkably
    flexible dance, subject to trends since the last 1950s. Departure from the “original”
    was not unique to Ngromo Tayub, but some performers perceived changes to tradition
    as acceptable and others as not, revealing their ambivalence about women’s power,
