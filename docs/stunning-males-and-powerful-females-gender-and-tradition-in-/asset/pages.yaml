    # Experiences of Individual Male Dancers


    Muliono


    I initially came to know Muliono (b ca. 1976?), or Mul for, as a dancer who specialized
    in strong style masked dances. Several performers in Tumpang recognized his special
    ability to perform the strong style male masked dance Klana in particular. When
    I saw him perform Klana, I, too, was transfixed by his presence and energy as
    a dancer. M. Soleh Adi Pramono suggested that I study with him because he had
    a special inner strength as a dancer, I did. I was pleasantly shocked, then, when
    Mul told me that he used to perform female characters for masked dance when he
    was younger and smaller in size. As he spoke to me, he seemed to be asserting
    his masculinity as he talked about embodying femininity, which I have come to
    understand as one effect of the social pressures he felt to be manly.


    Mul linked the femaleness embodied in masked dance specifically to the stage in
    a number of ways. He talked about performing female characters out of necessity
    to the performance, explaining that female dancers at time were performing masked
    dance, and no one else (i.e., other masked dancers) could perform female style
    dance (p.c.), January 3, 2006). He also talked about embodying femeness in terms
    of his competence, explaining that he became “female” through the dance movement,
    saying that the movement had to be supple, like a woman. He also'
