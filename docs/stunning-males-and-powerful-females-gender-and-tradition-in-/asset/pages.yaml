    a useful analytical frame for the analysis of ways changes made in one type of
    performance have affected performance practices in another, how males and females
    have affected each other in different ways, and ways in which dancers and musicians
    have negotiated conceptual and physical boundaries of gender through types of
    performance.


    # Performance Structure and Roles


    Performers conformed to and/or pushed cultural expectations about their gendered
    and sexed identities through their roles in a performance structure that usually
    featured male or female dancers, an authoritative male drummer, and predominantly
    male musicians (Sunardi 2001). Dancers interacted closely with the drummer, articulating
    in movement what the drummer articulated in sound through the patterns played
    on the drum. Dancers also wore a set of small spherical bells called the gong
    on their right ankles (see Photograph 1.2) for Bekalan, Ngromo, and the male style
    masked dancers Gunung Sari, Klana, and Baping. Perform used the gong as a distinctive
    feature of East Javanese dance. Dancers used the gong to accent the movements
    and particular beats and off-beats, adding another sonic dimension to the performance.
    Dancers could also use the gong to cue the drummer in various ways or to signal
    to the drummer that he or she understood the drummer’s cue.


    Dancers played other roles in the performance structure as well. By performing
    in the appropriate character, dancers (ideally) inspired the drummer and musicians
    to play with the appropriate feeling. In some cases for some dances, dancers sang.
    Dancers often sang in the course of performing Ngromo, welcoming the audience
    and/or guests and presenting poetic texts with a variety of meanings.


    Some of the terms used to refer to dancers had gender implications. The use of
    “tandhak,” or “female singer-dancer,” was one way that gender was constructed
    through performing roles, allowing cultural and discursive space for both females
    and males to be associated with femelessness.\Tandhak” was associated with femininity
    in many ways. For it was used to refer to singer-dancers who were biologically
    female. Key in this usage was the biological sex of the singer-dancer: at the
    tayub events I attended, female tandhak performed as singer-dancers dressed as
    females, and if Ngromo Tayub was performed as an opening dance, male style dance.
    “Tandhak” was also used to refer to males who specialized in performing as female
    singer-dancers and to males who specialized in female roles in ludruk, the latter
    of whom were more specifically referred to as tandhak ludruk.'
