    female impersonation: an 1822 account of a performance called ludruk described
    two male performers, a clown and a female impersonator (Piegaud 1938: cited in
    Peacock 1987: 29). Ludruk developed as a form of theater in the twentieth century,
    males continued to play female and male roles (Brandon 1967: 48–49; Peacock 1987:
    29–31). According to several performers in Malang, since the 1960s females have
    also taken female roles, this was more common in places outside of Malang, such
    as Surabaya. In the ludruk shows that I attended in Malang by groups from Malang,
    for the most part, males dominated the casts, although females sometimes did perform
    in the course of the opening acts as singers or dancers.


