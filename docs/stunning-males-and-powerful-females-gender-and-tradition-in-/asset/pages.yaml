  md: '# Glossary


    asli: original, authentic, real

    Beskalan: the name of a Malangan presentational dance

    Beskalan Langang: Beskalan in the male style

    Beskalan Putri: Beskalan in the female style

    Beskalan asli: the “original,” “real,” “authentic” Beskalan

    gamelan: a type of ensemble that in Java is usually comprised mostly of gongs,
    metalkeyed percussion instruments, and drum(s)

    gongseng: a set of small spherical bells that dancers wear on their right ankles
    for some dances

    ilmu: knowledge; science; or a particular type of knowledge that is of a secret,
    spiritual nature; see ngèlmu

    kidungan: a type of east Javanese singing

    Ludruk: (or ludruk): a form of east Javanese popular theater

    Malangan: or pertaining to Malang, in Malang style

    ngèlmu: knowledge, of of a secret, spiritual nature; see ilmu

    Ngromo: the name of an east Javanese presentational dance

    Ngromo Langang: Ngromo in the male style

    Ngromo Putri: Ngromo in the female style

    Ngromo Tayub: a sub-type of Ngromo Langang

    PSMD: Padepokan Seni Mangun Dharma (Malang Dharma Art Center)

    tandhak: female singer-dancer or a male performer who performs as a female singerdancer

    tandhak ludruk: artist who plays female roles in ludruk; in Malang most tandhak

    ludruk are male

    tayub: event in which professional female dancers sing and dance with guests for
    tips; also called tayuban

    waria: a male who dresses and lives as female'
