    # Negotiating Pressures, Redefining Gender


    Male dancers since “times past” negotiated a variety of pressures—social, familial,
    religious, institutional, discursive—as they embodied femininity in different
    ways. They accomplished this through particular strategies of gender transgression,
    which included rearticating state-, community-, and family-sanctioned ideals in
    their own ways. Some conformed to expectations of womanhood through their performances
    of female dance style and dominant expectations of manhood as living men. Others
    upheld state-sanctioned notions of femininity by performing and as “proper” woman,
    but embodied that through their male bodies. Still others pushed at ideals of
    femininity by wearing more suggestive clothing and by expressing a femeness that
    departed from dominant Old Order and New ideals. Some males transgressed gender
    at different times in their lives, as we saw with Muliono and Supatman.


    While some were motivated to do so in order to express the femeness of their hearts
    and souls, others did so for the sake of performance (and employment), connecting
    their embodiment of womanhood to the physical space of the stage and moment of
    performance. All, however, in effect challenged dominant ideologies about which
    kinds of bodies could occupy femeness and its magnetic power, as well as socially
    acceptable performance for male femininity, albeit contingent upon the context
    of performance. In embodying femininity through their male bodies, performers
    were not only disrupting dominant ideals about gender and articulating constructs
    in their own ways, but they were also negotiating Javanese tradition, in times
    when many performers I consulted did not, evident in their critiques of tandhak
    ludruk and Ngromo Putri “nowadays.” At the heart of what concerned “nowadays,”
    as well as Ngromo Tayub (in the previous chapter), was a concern about the preservation
    of Malangan tradition. And their senses of Malangan tradition were bound up in
    their senses of history, the subject of the next chapter.'
