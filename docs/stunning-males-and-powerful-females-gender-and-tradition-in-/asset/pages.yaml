    # Approaching Islam


    No less of an impetus in writing this book has been to complicate assumptions
    about what it means to be a man, a woman, someone in between, or simply an artist
    in a Muslim-majority society, where the presence of Islam in the performing arts
    was strong (Sunardi 2012, 2013). Almost every performer was Muslim, albeit of
    different degrees of piety. Performances were held for Muslim celebrations as
