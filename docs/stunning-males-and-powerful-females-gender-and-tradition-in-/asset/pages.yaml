    For some, the degree to which masculinity was internalized was contingent upon
    the dance. Karen Elizabeth explained that she did not feel like a man when dancing
    Ngremo Tayub, emphasizing that it was not her goal to feel like a man because
    being a woman is part of the dance. For the male style danced Bapang, however,
    she feels that she becomes the male character named Bapang. For masked dance,
