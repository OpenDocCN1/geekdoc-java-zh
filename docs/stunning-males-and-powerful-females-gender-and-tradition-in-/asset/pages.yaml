  md: '# xxvi Interactions with me as a foreign researcher Preface


    Interactions with me as a foreign researcher were further complicated by several
    other factors that ultimately shaped the knowledge that I acquired while conducting
    fieldwork and had used to produce this book. Odd enough, my foreignness was tempered
    by a dab of central Javanese. Starting my research in Malang, I had spent many
    years of studying central Javanese gamelan music and dance in Yogyakarta and in
    California, had married a Javanese man, and spent time living with his family
    in a village just south of the city of Yogyakarta. Not completely new to Javanese
    arts and culture, fluent in Indonesian, I had had previous study in the basics
    of the Javanese language, I was able to learn east Javanese gamelan techniques
    and dance movements more quickly than foreign students without previous experience.
    My prior exposure to central Javanese arts contributed to several mistaken assumptions
    I made about east Javanese arts and a certain feel in my playing and movement
    that performers recognized as central Javanese. Moments of my confusion and physical
    awkward sparked by my teachers and generated questions I asked, affecting answers
    I received (Sunardi 2010a: 188–119).


    My marriage to a central Javanese man also affected my relationships with performers
    and members of the community in which we resided. My husband garnered respect
    and bit of awe because he was the culturally prestigious area of Yogyakarta (which
    was prestigious for the courts in the city of Yogyakarta). In addition, he had
    married an American, he lived in America, he appeared to have an endless supply
    of money without having to work, he was generous with cigarettes, and he helped
    his neighbors. His jokes and chitchat at lessons, rehearsals, performances, and
    when out and about put people at ease and made them more comfortable with me.
    Most seemed to believe that I had married a Javanese man, I must have truly adored,
    admired, and appreciated Javanese culture and people. In some cases, his marital
    status (the perceived sexual experience and activity that came with that status)
    put people at ease in talking about matters of sex more openly and frankly with
    me. One of my teachers said that since I was already married he could talk about
    matters with me, including relations between a husband and wife as a “biological
    necessity” (“keperluan biologis”).


    My difference was further mitigated because I did not look as foreign as those
