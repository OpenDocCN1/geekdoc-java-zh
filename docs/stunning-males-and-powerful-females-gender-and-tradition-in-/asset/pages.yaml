    Since New Order times and into the Reformation era (1998–2005), males who dress
    and live as female have insisted on their visibility and acceptance both socially
    and politically (Boellstororf 2004b; 2005b: 56–57, 2007). Such males are called
    waria—a composite of the Indonesian words wanita (woman) and pria (man)—or by
    less culturally sensitive terms such as banci or bencong (Boellstororf 2004b;
    2005b: 9, 11; 2007: 80; Oomo 1996, 2000). Strikingly, despite New Order ideologies,
    waria have been, to a certain extent, tolerated and supported by the government.
    Waria have received recognition and support from local governments since the second
    half of the 1960s (Oetomo 2000: 51). In fact, the term waria "originate[d] not
    in tradition in government dictate and dates from 1978” (Boellstororf 2007: 83).


    Tom Boellstorff proactively discusses the challenges of using terms in English
    for waria, such as “transvestite,” “transgender,” and “transexual” (2007: 82).
    While he explains his preference for “male transvestites,” he with the recognition
    that, “[a] is always the case with any of interpretation, terms are always to
    be taken as contingent devices. The goal is not to find a perfect or permanent
    term to craft a vocabulary—the modification and clarification of which is part
    of cultural critique itself” (Boellstororf 2007: 82). “The working vocabulary”
    I use as a gloss for waria—who dress and live as female—is meant to communicate
    the femininity that is a key part of waria identity (Boellstororf 2004b, 2005b,
    2007) and to allow for the recognition of waria as an identity that is distinct
    from that of “woman” (Boellstororf 2005b, 2007), points to which I return later
    in this chapter. At the same time, I do not mean to imply that there is any one
    way of living as female.


    Since the mid-1960s, waria have been working to increase their visibility and
    social acceptance, seeing themselves as part of national culture, by openly wearing
    women’s clothes and establishing themselves in salon work (Boellstororf 2004b;
    2007: 86–87). According to the waria Mama Samu and their partner Tok Suprarto,
    waria have started to have the confidence to live openly since the 1970s as waria
    started to appear naturally and internationally in such competitions in makeup,
    beauty, and fashion (p.c., May 9 and 16, 2006). Tom Boellstororf observes a “shift
    after around 1980, when some people began identifying as waria on an ongoing basis
    in public (as opposed to more circumscribed contexts like theatrical performances)”
    (2005b: 56).


    Indicative of increased visibility, waria was a contender for mayor in the city
    of Malang in 2003 (Boellstororf 2004b: 187 n19; 2007: 226 n15). I also noticed
    waria’s visibility during my fieldwork, seeing waria working'
