  md: '# Preface


    xix


    thought through issues together. Because these moments of interaction were also
    affected by the agents—both the "subject" and the "researcher”—were at a particular
    time in their lives when the encounter occurred, and what the agents were feeling
    at a particular moment—curious about a new acquaintance, nervous in front of a
    new teacher, mad at a spouse, worried about finances, sleepy from an afternoon
    nap, meaily comfortable with their foreign student, remembering deceased loved
    ones—I have chosen to write much of this book in the past tense.


    My relationships with my teachers, particular individuals with particular takes
    on the arts, shaped the ways I framed my analyses as well the ways I have come
    to understand and write about the performing arts in Malang. Kusnadi, a highly
    respected senior musician in Malang, was my primary teacher (Photograph 0.1).
    Born in 1944 in the village of Tubulas, he grew up in a family of performers that
    included an uncle who was a puppeteer and two brothers, one of whom, Djaman, is
    a musician and another of whom, Asbari, is a puppeteer and musician. Kusnadi began
    to play gamelan as a boy in the 1950s, mastering East and central Javanese styles
    of gamelan music and dancing over the course of his long career. At the time of
    my fieldwork, he was the director of the men’s gamelan group at PSMD where he
    had worked since the center’s funding in the 1980s (p.c., November 17, 2005; February
    4, 2006). In addition to his musical activities, he and his wife ran a food stall
    (warung) at the market in Tumpang. Their daughter helped out, too. Teaching me
    elements several times a week, Kusnadi quickly became like a father. The musicians
    in his group, including the two aforementioned brothers, became like uncles. I
    have continued to study with and practice with the musicians in his group during
    subsequent visits to Malang following my fieldwork and still regard him as an
    important teacher and mentor.


    I might not have had this relationship with Kusnadi had it not for M. Soleh Adi
    Pramano (1951) and the American artist Karen Elizabeth Sekarakum (by 1964, Karen
    Elizabeth Schieber), who at the time of my fieldwork were running PSMD as a husband-wife
    team.¹¹ PSMD provided a space for artists, students, scholars, and aficionados
    interested in performing, researching, studying, and sponsoring performances of
    a variety of Malang music and dance practices, which has accomplished much in
    promoting and developing Malang arts locally and nationally. Soleh, an artist
    who came from a family of performers and is a graduate of the college level academy
    in Yogyakarta, founded PSMD in the 1980s.² He was active there as a choreographer,
    puppet master, masked dance narrator, musician, and teacher. Karen Elizabeth,
    who had spent part of her childhood living and studying in Java, came to Malang
