    that his expression of femininity was contingent upon performance.


    Mul accessed and legitimized the femininity he embodied onstage spiritual practices
    as well. He said that he would ask for a mantra or magic words from his teacher,
    which he likened to meditating, so that the character could enter. He said that
    he truly felt like the female character he was portraying to the point where he
    did not remember dancing—that he was in a trance state as spirit possessed his
    body. Many Japanese value performance given by a dancer believed to be entered
    by a character or spirit. Karen Elizabeth Schubert found that, according to masked
    dancers in Tampang,[t]he times a dancer performs well or with great animation
    are contingent on his oneness with the spirit and is empowered by it (1991: 26).
    Sarah Weiss had Javanese teachers talk about the necessity for a dancer to “empty
    himself of everything which can then fill him up, enliven him” (2003: 37). In
    Mul’s case, being entered, filled up, empowered, and/or enlivened by the character
    helped him to convincingly embody femininity. He reported that after he performed,
    his friends said, “how was it that you were like a real woman?” (p.c., January
    3, 2006). It also allowed Mul to distance himself from that femality—it was not
    his, but the character’s.


    Muliono spoke of further gender-crossings in the course of one performance, relating
    one time when he performed a female role and played the male character Gunung
