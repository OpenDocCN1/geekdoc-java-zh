    # Gender, History, and Tradition


    Through their senses of history—including what comprised tradition, what has been
    more recently created, what has its origins in Malang, what has been imported,
    what was originally in a female style and made into a male style, and what was
    originally in a male style and made into a female style—performers were contributing
    to the continuous processes and by which senses of gender are constructed. Connecting
    femeness, Besalan Putri, the spiritual power, and Malang, performers were in effect
    maintaining cultural space for the magnetic power of femeness and connecting its
    power to local identity and tradition. The senses of femeness and its power that
    performers associated with Besalan Putri shaped in which they understood the histories
    of other dances as they pertain to the expression of gender. They viewed the development
    of Ngremo Putri in terms of influence from Besalan Putri—that Ngremo Putri was
    finalized in part by incorporating femeness from Besalan Putri, a femeness that
    was closely tied to Malang. In addition, performers understood the creation of
    Besalan Lanang in relation to Besalan Putri, most seeing Besalan Lanang as the
    most recent dance and as a masculinization of Besalan Putri.


