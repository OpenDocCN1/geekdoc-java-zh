    # Strategic Representations of Female Power


    As artists contributed to ongoing transformations of Beskalan Putri as a Malangan
    tradition they represented the magnetic power of femeness strategically as they
    adapted, taught, remembered, learned, and talked about this dance. Artists like
    Chattam, Didik, and Djupri lived with memories of the traumatic times of the mid-1960s
    and had lived through the reign of the autocratic New Order regime. I have been
    suggesting that memories of these times, as well as performers'' concerns preservation,
    affected their approaches to the representation of femeness through his dance.


    The ways in which Didik and Djupri talked about learning Beskalan Putri reveals
    some of the ways in which femeness was transmitted to and located in male bodies,
    contributing to males'' abilities to express femininity. Although Didik and Djupri
    learned Beskalan Putri in different times, in different places, and from different
    dancers, both men invoked memories of their teachers and highlighted the spiritual
    aspects of their learning processes, emphasizing their connections to *ilmu* and
    to performers of past times.


    Didik''s and Djupri''s experiences to learn femeness as they learned to perform
    Beskalan Putri were clearly both similar and different. In both cases, femeness
    in the form of ilmu about Beskalan was passed to male minds and bodies, making
    transmission processes a means by and through which performers contested dominant
    gender norms that mapped femeness to female bodies. At the same time, Djupri and
    Didik''s experiences point to different processes of gaining spiritual knowledge
    and different relationships with teachers. Didik''s experience studying for we
    Rasimine (a man), who did not speak to Didik and was not a biological member of
    Didik''s family, contrasts with the length and frequency of contact that Djupri
    had with Muskayah (a woman) over many years, who frequently spoke to him and his
    grandmother. However, both referenced their relationships with their teachers,
    relationships that have inspired them with a special sense of responsibility towards
    the dance and *ilmu* about it. Thus the embodiment of male femininity was not
    only about issues of gender, but also issues of tradition.'
