    aspects of the body itself must be taken together. While bodies are sites of cultural
    production and signifiers of culturally and historically constructed meanings,
    they are also physical, material sites and through which culture, cultural meanings,
    and cultural knowledge are lived, experienced, and transmitted (Foster 1986, 1995;
    Cowan 1990: 4, 23; Ellington 1990: 11–15, 36–37; Franco 1993; Hahn 2007: 1–6;
    Hughes-Freeland 2008b: 20). Given that "the body is also marked by culture and
