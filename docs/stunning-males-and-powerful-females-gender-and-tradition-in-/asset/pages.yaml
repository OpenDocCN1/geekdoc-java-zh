    oberved Chattam''s adaptation performed by young women, and in those

    cases, their sexual magnetism was somewhat "contained" by their singing.

    As with jaipongan, Chattam provided a means for females to perform as

    dancers and thereby "circumvent" some of the assumptions of low morals

    stemming from rongeng "female singer-dancers" (Spiller 2010: 98).


    Chattam made his selections to tradition in a complex historical and ideal-

    ogical context. While I do not want to suggest that Chattam was an unthinkable-

    strument of the New Order regime (who he certainly not), neither

    do I wish to underestimate the impact of cultural and political pressures

    stemming from the time when Chattam was adapting Besalan.

    Furthermore, Chattam was of a generation living with the social memories

    of violence against artists in the mid-1960s as well as women who

    pushed too hard against state-sanctioned norms, such as members of the

    progressive women''s organization Gerwani (see chapter two). As he worked

    to preserve the dance and keep it in performed repertoire, in effect bal-\anced
    his sense of the essence of the dance with pressures during the New

    Order to project ideal constructions of femininity as sweet, demure,

    and located in the bodies of "respectable" females. In doing, he maintained

    a representation of female power through the costume suggesting martial

    prowess.


    Chattam was also working in an atmosphere of concern with cultural

    preservation. The Indonesian government was officially recognizing the per-

    forming arts of East Java in the 1970s, recognition that was manifest in part

    through the founding of a high-school–conservative conservatory in Surabaya in

    1973 (Sutton 1991: 179). Music and dance experts in East Javanese styles were

    concerned about the disappearance of local styles and wished to preserve

    them (ibid. 1991: 179). I view Chattam''s work to preserve Besalan Putri as

    part of artists'' and government officials'' efforts to identify, preserve, and

    prom East Javanese traditions—but to preserve these traditions in a way

    that held currency in New Order times by being shortened and representing

    gender in ways that were in line with official ideologies.


    The representations of femininity and regional culture in Chattam''s adapt-

    ation of Besalan Putri as performed by girls and young women continued

    to carry currency into Reforma eras (1998–present). At the time'
