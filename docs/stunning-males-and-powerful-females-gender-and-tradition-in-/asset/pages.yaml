    and central Java, I believe, have the cultural value given to particular regional
    styles.


    The institutionalization of culture in Indonesia since the declaration of independence
    in 1945, among other factors, has contributed to the varying levels of prestige
    that most people in Java have given the performing arts associated with different
    places (see also Sunardi 2010a: 92–93). There is a complex history, lengthy centuries
    of cultural interaction between people from different regions in Java as well
    as between people from urban or rural areas which effectively blurs the boundaries
    of these very courts (Sutton 1991: 170; Day 2002: 189–190; Weiss 2006: 92–94,
    114–120; Sumarsam 2008). Nonetheless, higher prestige has been given to arts associated
    with courts and urban areas (Perelman 1998: 57; Weiss 2002: 2006: 114–120). At
    the time of my fieldwork, the most prestigious music, dance, and theater traditions
    were those associated with the central Javanese courts—the Suluhanan and Mangkunegaran
    in the city of Surakarta, the Kasultanan and the Paku Alam in the city of Yogyakarta—were
    established in the eighteenth and nineteenth centuries (Sumarsam 1995: 49; Ricklefs
    2008: 12). Next in terms of prestige were the arts associated with the central
    Javanese courts Surakarta and Yogyakarta but not necessarily of the courts. Arts
    associated with central or east Javanese non-courts ranked lower still, and at
    the bottom were associated with towns and villages.


    Disrupting this order—and providing fodder for those who insisted on the cultural
    value of east Javanese arts—was the general knowledge in Java that kingdoms with
    court culture flourished in east Java prior to the establishment of Java kingdoms
    with the present-day courts of Surakarta and Yogyakarta. Such east Javanese kingdoms
    included Singosari (1222–1292) and Majapahit (1293 or 1294 until 1478 or c.1520),
    the latter of which was a great empire at the height of its power (Holt 1967:
    66; Kinney 2003: 155–163; Ricklefs 2008: 20–21, 39). Like R. Anderson Sutton,
    I could not help notice the ruins of temples that were “reminders of the courtly
    culture that once existed and contributed to the “awareness that [east Java] was
    once a center of mighty court culture” (1991: 123). The thirteenth-century Kidal
    Temple and to mid-fourteenth-century Jago Temple were located in Tumpang, where
    I was, no doubt affecting performers’ senses of the past and cultural heritage
    (Holt 1967: 68, 71; Kinney 2003: 89, 93, 95, 124). A sub-district in Malang named
    Singosari, home to the thirteenth-fourteenth-century Singosari Temple (Holt 1967:
    68; Kinney 2003: 137, 148), which further reinforced local senses of a courtly
    past.'
