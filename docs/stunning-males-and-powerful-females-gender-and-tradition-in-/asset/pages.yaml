    Using ilmu, male and female performers gain the power of presence to affect audiences
    emotionally—making them feel happy, thrilled, in love—physically—giving them their
    eyes, widening their expressions—and sometimes spiritually—healing their hearts
    and minds. Without ilmu, a performer may be very good, even excellent, but she
