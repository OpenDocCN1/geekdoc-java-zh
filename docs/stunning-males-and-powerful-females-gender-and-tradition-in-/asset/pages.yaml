    “a little stiffness ...perhaps in the neck or somewhere else (“ada kaka-kakunya
    sedikit ...munkin di leher atau mungkin di apa ya”). She also explained, “Sometimes
    we think, ‘hey, she’s beautiful, her body is good—it seems if compared to a real
    women the difference is still apparent” (“Kadang-kadang, kita kan eh, bodinya
    bagus—ketihatannya. Tapi kalau dibandingkan dengan sama putri asli itu tidak kadang-kadang
    masih kelihatan berbeda)” (p.c., 2006). By saying that “sometimes the difference
    is still apparent,” she indicated that the difference between a male tandhak and
    a “real woman” was not always apparent.


    My mother-in-law, a Javanese woman visiting from Yogyakarta, was convinced that
    a tandhak at a lukruk show we attended was female. Surprised to learn that the
    artist was male, she was impressed with his ability to look so womanly. She had
    been convinced, too, because she was less familiar with lukruk casting conventions
    in Malang than local audiences, and, as I explored later, many audience members
    in Malang delighted in the confusion and on, on some level, allowed them to be
    foled.


    The photographs of a female dancer in a Bekalan Putri costume (Photograph 3.1)
    and Ngero Putri costumes (Photograph 3.2) help to illustrate some of the ways
    male femininity was perceived to be similar and different from female femininity,
    despite the stunning beauty of some male tandhak. As highlighted through comments
    from other performers and people in the general public, male bodies were tended
    to be bigger than female bodies, particularly noticeable in males’ larger arms
    and hands, broader shoulders, and thicker necks. Most males tended to be taller
    than most females as well.


