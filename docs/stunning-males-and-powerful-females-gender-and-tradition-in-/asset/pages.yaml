    As indicated earlier, some males danced as waria (males who dress and live as
    female). To better understand the perspectives and experiences of waria artists,
    I interviewed Samsartu (b. 1955), a waria who began to study the arts as a child
    and actively performed in lukduk theater from 1978–1991.⁵ An important figure
