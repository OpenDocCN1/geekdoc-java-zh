    contributed to national unity through performance by singing songs in support
    of the nation. On the other hand, they were discouraged from taking gender transgression
    into their daily lives; instead they were encouraged to be modern, Indonesian
    men—to have short hair, pants, and be heads of households (Peacock 1987: 206–207;
    see also Boellstorf 2007: 86–87).


    Official ideologies that males were "manly," "fatherly," and heterosexual were
    reinforced and more strictly enforced during the New Order era (1966–1998) (Shiraishi
    1997; Boellstorf 2005b: 96, 196), paralle the regulation of women’s roles and
    behavior discussed in chapter two. For example, the sanctity of the nuclear family
    and heteronormativity was imposed through the government''s control over men''s
    behavior in Reog Ponorogo, a tradition of East Javanese dance involving large,
    impressive masks. Jan Wilson (1999) writes that, the performers called warok spiritually
    powerful figures. To preserve their polity, warok avoided sexual intercourse;
    instead of living with women, they took in young boys gambak to help with household
    chores. Gambak also performed with warok, sometimes wearing female dress (Pigeaud
    1938: 300–301; Kartomi 1976: 87). Further reflecting the changed political dynamics
    after 1965, the government and conservative Muslim groups viewed their warok-gambak
    relationship as homosexual and thus as intolerable (Wilson 1999: par. 8–9). The
    New Order government was suspicious of any powerful forces under their direct
    influence. For these reasons, among others, Reog Ponorogo and warok styles were
    adapted. More specifically, “[a]side from discouraging practices involving communication
    with ancestor spirits, the government outlaws the taking of gambak in 1983, encouraging
    reog troops to replace gambak dancers with young girls” (Wilson 1999: par. 9).
    One result, Wilson argues, that Reog Ponorogo was reconstructed to become an apolitical
    tradition rather than a practice that could potentially undermine official constructions
    of masculinity, motherhood, and the family (1999).


    The increasing separation of "male" and "female" and a tendency toward favoring
    "strong," heterosexual senses of masculinity in the 1940s has not been without
    resistance. Observing masked dance in Malang 1963—during Old Order times—Okahman
    mentions the role of a transvestite as an artistic guise to a troop leader (1972:
    117, 119). That person was “a well situated villager” (ibid.: 119) suggests that
    s/he, in some ways, did not occupy a completely marginalized position within the
    community. James Peacock describes that all of the tandak ludruk he consulted
    in the early 1960s embodied femininity in their daily lives by women’s attire
    and working jobs associated with women—“such as tailoring women’s'
