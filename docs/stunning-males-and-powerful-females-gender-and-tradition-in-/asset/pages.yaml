  md: '# xxviii Preface


    Aware of the prestige foreign scholarship carries in Java, performers took seriously
    their roles as sources for my research and strove to convey what they believed
    was true and correct. One individual, dissatisfied with existing publications,
    asked that I fix incorrect information.


    I write this not to imply that I am "correcting" the literature. I am comfortably
    well aware of my own flaws, weaknesses, inevitable errors, and potential misunderstandings.
    Furthermore, given the flexibility of dance and music in Malang, what some artists
    might have perceived as errors or incorrect information may have been a matter
    of differing interpretations, approaches, or versions. I do, however, to underscore
    that for all of their generosity, performers sought to make me and my benefit
    to a realization, that has also been influenced by Anthony Seeger’s discussion
    of his fieldwork among the Suay people of Brazil. His point that he and Judy Seeger
    became the Suya’s “Whitemen” who studied them and could be counted on brings gifts
    and sometimes as intermediaries for the rest of Brazilian society (Seeger 2004:
    24), has helped me to understand that similarly, in Malang I became a foreign
    musicologist who could sponsor rehearsals and performances, bringing gifts, share
    over-the-counter medicines like Adv, and represent the perspectives and musical
    traditions of the artists I consulted—thereby putting traditions on equal with
    the more prestigious (and more researched) traditions from central Java and Bali.
    By inserting their knowledge about east Javanese performing arts (and those of
    Malang in particular) into the prestigious cultural spaces of U.S. academia, they
    hoped that I would bring them international recognition, which in turn would bring
    them economic benefits in the form of increased employment opportunities (Sunardi
    2010: 94).


    Although I was foreign-but-so foreign, I was no less ambiguous in other ways.
    In the general population they believed I a waria, a male who dressed and lived
    as female. At about five feet, eight inches, I was noticeably taller than any
    Indonesian female I met in Malang (at least, as far as I can recall), and for
    that, most Indonesian females were. My relatively broad shoulders and slender,
    athletic build reinforced the male people perceived, as I did my studies and performances
    of Ngre Putri, a female style dance that was usually performed by males as a cross-gender
    dance. Association with male dancers who lived as waria in their daily lives—waves
    and smiles to the waria who had seen me hanging out backstage at performances
    or sitting with the gamelan musicians at performances, sometimes playing, sometimes
    taking photos, sometimes videotaping—was further evidence that I was a waria,
    too. My personal experiences of the fas-'
