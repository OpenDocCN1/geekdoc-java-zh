    Some individuals were proud and inspired that I, as someone from the United States,
    the world’s most powerful nation, had decided to come to Malang to study east
    Juvenile arts. They were particularly proud that I chose to conduct my research
    in Java rather than in central Java or Bali, places they know to be more prestigious
    and better known in both Indonesian and foreign academic and artistic circles.
    A friend revealed that my studying singing in the course of performing the female
    style Ngreme Putri motivated her to learn it; since I, a foreigner could learn,
    she believed that she, a Javanese, should be able to as well. Many performers
    were also impressed that I dedicated so much time and money to studying what they
    identified as traditional arts, especially given that many young Javanese were
    not interested in these forms of music and dance. This, too, was not unique to
    my experience. The historian historian Laurie attending shadow puppet plays in
    central Java, writes that puppeteers often commented on her, “[taking] the opportunity
    to praise this effort at cross-cultural understanding, to chime the Javanese for
    not taking a greater interest in their own performance traditions, and to express
    that the most powerful culture in the world would send people to Java to learn
    its language and arts” (1996b: 297).


    One disturbing psychological effect of Dutch colonialism also affected my relationships
    with performers. Many Javanese talked about themselves as members of a nation
    that was not as advanced as a western country as the United States. My internalized
    beliefs about the superiority of westerners’ intellects used attention from westerners
    to legitimize the cultural prestige of something or someone in Java. Sumarsam
    (1995) has traced the historical impact of such assumptions, showing that the
    status given to court styles of Javanese gamelan music as “high art” resulted,
    in part, from the interaction between Dutch scholars and Javanese elites in profoundly
    affected psychologically and intellectually. Javanese scholars absorbed western
    attitudes, which have persisted into the present and have been reinforced with
    continuing western ethnomusicological interest in gamelan styles associated with
    the Javanese courts (Sumarsam 1995: 10, 102–160). In the context of this history,
    my association with an individual in Malang had the potential to increase his
    or her prestige as well as that of the music and/or he she practiced—a potential
    that may have motivated performers to work with me.'
