    culture. Specifically, they were negotiating their authority, a manifestation
    of their spiritual power, as they compromised and cooperated to actively produce
    tradition, and in so doing, articulated senses of gender (see also Sunardi 2011).


    This chapter expands and develops a previously published analysis of performer
    interaction and gender (Sunardi 2011). My interest in the cultural implications
    of performer interaction in that article and in this chapter has been most strongly
    influenced by the work of Benjamin Brinner (1995), whose theory of interaction
    and attention to performers'' competence orient my approach. Building on Brinner''s
    attention to the importance of competence and authority in shaping interactions
    between performers as well as the ways interactions affect what is performed,
    I focus on the relationship between the dancer and the drummer, showing that who
    actually leads and when depends on a number of factors, who is more experienced,
    and who is more assertive (Brinner 1995: 288). Equally pertinent is who makes
    a mistake at what point in the performance. Tensions between submitting to and
    resisting authority also affect interaction, particularly given leadership roles
    in Javanese performance structures are driven (Brinner 1995: 297; Walter 2007:
    37). My research correlates Henry Spiller''s space for the negotiation of authority—that
    exists when it is not clear who is leading and who is following—allows dancers
    and drummers to negotiate their senses of gender (2010: 73, 75). I also build
    on Sarah Weiss''s attention to interactions as gendered and the importance of
    gendered interactions to the continuous production of a performance tradition
    (2006: 161).


    I argue that contradictions between dominant ideologies privilege the knowledge
    of a more senior male and a performance structure in which leadership roles provide
    flexible spaces for men and women to negotiate their authority and articulate
    senses of gender in different ways as they negotiate the form and content of a
    dance. This argument underscores ways in which interaction between drummers and
    dancers affect culture: interaction in performance provides spaces for males and
    females to work out, contest, transform, and/or reinforce social norms that privilege
    the authority of older men; and through their interactions, performers generate
    a particular interpretation of dance and its music, contributing and transformation
    of particular dance traditions. Like Sonja Lynn Downing, who also builds on Brinner
    (1995), I am interested in how gender, competence, confidence, experience, and
    age—as well as performers'' perceptions of these factors—affect the ways performers
    negotiate authority and produce particular senses of'
