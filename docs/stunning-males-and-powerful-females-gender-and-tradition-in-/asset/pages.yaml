    behavior and personalities in their everyday lives. Although the females I consulted
    performed male style dances neither described themselves as a third gender nor
    lived in their daily lives, some attribute their affinity for male style dance
    to their strong personalities. Warananingiyas Palupi (b. 1980) complicated cases
    of gender recognizing that her femininity did not map to the representation of
    femininity expressed through refined styles of dance. In talking about her preferences
    for male style dance (such as Beskalan Lanang), she tied aspects of dance to her
    char'
