    # Negotiating Gender On- and Offstage


    Female performers'' negotiations of dance have intersected with other aspects
    of their lives since "times past." Djupri expressed his wonder and admiration
    as he recounted his grandmother''s life (c. 1890s-1990s) and career, saying that
    she looked strong in a manly way (gagah) when she did pencak silat martial arts.
    He also remembered his drumming:


    Her drum strokes were distinct, pleasant to listen to—like a man''s. "Oh, I have
    to be like a man," she said]. She had to be manly, using whatever worked. Indeed
    when she played "tak" it was like a line, just the same. That was the strange
    thing, that was indeed, as it may called, a sacred aspect, ilmu.8


    Tak is the name of a drum stroke that is quite loud and sharp. Speaking from my
    own experiences drumming, it does require a particular strength in the form of
    a focused energy to execute. By attributing her abilities and physical strength
    as a drummer and as a dancer to her ilmu, Djupri underlined the possession of
    spiritual knowledge as a strategy of gender transgression in different realms
    of activity.


    Musayah also assumed a "male" role as spiritual teacher. Women have been recognized
    for their spiritual potential and,, some have achieved high positions in mystic
    sects (Geertz 1960: 328–329; Beaty 1999: 22). The role of teacher or master, however,
    is gendered male as a father figure, and men have usually taken leading roles
    (Geertz 1960: 329; Mulder 2005: 55; Beaty 1999). In talking about Musayah as master
    of spiritual knowledge herself as her abilities in martial arts and drumming,
    Djupri remembered and portrayed her as one who pushed ideology about what women''s
    activities and behaviors should entail. By praising Musayah, Djupri himself subverted
    Old and New Order ideology about manhood with which he had grown up. The discrepancies
    between official ideals and social realities, and between official ideas of an
    idealized family member, are striking.


