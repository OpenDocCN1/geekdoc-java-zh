  md: '# CHAPTER 6


    consistently reinforced dominant constructions of an ideal young woman—polite,
    smiling, friendly, beautiful, and respectful of older men.


    In the course of making selections to tradition, performers produced senses of
    madness and femelessness as performers portrayed in the dance and as their own
    selves. Strikingly, critics to what they deemed "successful" performances of gender
    were aspects that reinforced dominant ideals characteristic of Old and New Order
    times, which were being carried forth and also contested in the Reformation era.


    Through their interactions with each other, musicians and dancers intentionally
    and unintentionally made selections to produce tradition, negotiate knowledge,
    and articulate senses of gender. The agents involved predominantly demonstrates
    the importance of malice in producing femelessness. Selling and buying, performers
    put forth their personal ideas of correctness, yet so did not necessarily mean
    that a performer insisted on his or her correctness during performance. Performers
    often manifested their authority by maintaining the control to make decisions—whether
    to sell or to buy.


    Performers in Malang negotiated authority and articulated different senses of
    gender as they interacted in the seemingly paradoxical, ironic, and subtle Kusadi
    reinforced the model of an authoritative figure consistent with dominant constructions
    about manhood following Utomo. In the course of performing female style dance,
    Utomo negotiated his authority as a younger man in relation to an older man, Kusadi.
    Through her articulations of femelessness, including defence as a younger woman,
    Wahyu reinforced the authority of her own knowledge, allowed Kusadi to reinforce
    his, and fostered a comfortable atmosphere among the musicians, all of whom were
    male. Yet, Kusadi’s, Utomo’s, and Wahyu’s were not unusual in a cultural context
    where female style dance may be performed by males or females, where the expression
    of authority may be manifest by following the lead of another, and where the power
    of femelessness is important to performers’ senses of local tradition and identity.


