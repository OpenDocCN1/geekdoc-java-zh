  md: '# CHAPTER 6


    by buying not necessarily concede their authority, but in some cases prove both
    their authority and their competence. In "taking care" of Utomo, Kusn effectively
    demonstrated to the other performers present that he had greater command of the
    dance, delicately balancing his motivations to maintain authenticity and to assert
    a fatherly sense of authority by deciding when to follow and when led.


    Kusn''s work to take care of Utomo also includes ideas about power and relationships
    between males in Java. On one level, manifesting authority subtly in performance
    is consistent with the value that many Javanese on indirect expressions of power.
    As discussed in this book, according to dominant, male-centered Javanese aristocratic
    ideals, refined behavior manifests an individual''s power and is thus often highly
    valued in many contexts, particularly in interactions between males (Andersen
    1990a; Keeler 1987; Djajinrating-Nieuwenhuis 1987; Brenner 1995; Weiss 2006; Sears
    2007). Refined, indirect expressions of authority are also preferred in interactions
    between musicians in the performance of central Javanese gam (Brner 1995) and
    between the puppeteer and musicians in the performance of central Javanese shadow
    puppet theater (Keeler 1987: 180–183), also contents involving predominantly male
    performers. It is also important to be aware, as Karen Elizabeth Schrieber shows
    through analysis of Malangan hobbydancing and masked dance drama, that no Javanese
    aspire to refinement and that performers also negotiate power and authority through
    more refined means (1991).


    Following dominant notions of power in Java, ideal expressions of authority are
    those that are refined and indirect because powerful individuals should not have
    to visibly exercise their authority by raising their voices or giving orders;
    a sign of power is that they need only to make suggestions or requests (Andersen
    1990a: 54). In addition to manifesting power, indirect and refined expressions
    of authority imply the high amount of knowledge that an individual has become
    one to gain power through knowledge (Andersen 1990a: 54–58), also seen in this
    book. In words, the more one knows, the more power he or she can gain and/or access.
    If one were to directly and insist on his or her authority, it would be showing
    that he or she has a lesser amount of power and is therefore less knowledgeable.
    By taking care of Utomo, Kusn was indirectly asserting his authority and manifesting
    his power and his knowledge as a masculine, fatherly figure through a dominant,
    male-centered paradigm of power.


    On another level, Kusn''s decision to follow Utomo adds another dimension to the
    expression and negotiation of power in Java. It may seem that'
