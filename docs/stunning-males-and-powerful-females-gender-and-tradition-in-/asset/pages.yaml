    7–8), people may use their bodies strategically to align themselves with particular
    histories and senses of identity (Wong 2004: 161–193). I am interested in how
    dancers use their bodies strategically to align themselves with senses of femeness
    and maleness as well as the roles that musicians play in making such alignments
    in performance.


    To explore the production of maleness and femeness through dance performance,
    I build on Judith Butler’s explanation of gender as “an identity constituted in
    time, in an exterior space through a stylized repetition of acts”(original emphasis,
