    movements that bear many similarities to the movement styles of refined female
    characters (Brakel-Papenhuyzen 1995: 53–56; Hughes-Freeland 1995: 190–191; Benamou
    2002: 275). Cultural spaces also existed for homosexuality and transvestism. James
    Peacock writes that “Pure” Javanese tradition does not condemn homosexuality and
    regards a very wide range of behavior, from he-man to rather (in our terms) ‘effeminate’,
    as properly masculine’ (1987: 204 n3).


    However, in the 1940s, 1950s and 1960s—the times of the Indonesian revolution
    and the Old Order era of Sukarno’s reign (1945–1966), a “strong” manly type came
    to be held as as ideal model of masculinity in national and popular men were encouraged
    to assume positions of leadership within the family and within the new nation
    as political leaders and lawmakers (Wieringa 2002: 99; Shiraishi 1997: 90–91;
    Spiller 2010: 26). President Peacock, a national hero, promoted a standard rooted
    in his own good looks, sexual prowess, bravery, to the national, charisma, and
    as Shiraishi notes, “his deep baritone voice” (1997: 91). Dipping into Javanese
    theater, he held up “the model for the new Indonesian character Gatotkaca, a legendary
    knight known for his physical strength, strong body type, determination, loyalty,
    and patriotism (Anderson 1965: 28; see also Weinraut 2004b: 11). Acknowledging
    the influence of popular culture, Benedict Anderson, writing in the 1960s, observes
    that the ‘he-man heroes’ popularized in the movies contributed to changing perceptions
    of refined heroes in traditional theater, such as Arjuna, and effeminate (1985:
    28). Some Islamic ideologies likely reinforced these these social pressures exerted
    on males to live as “manly” strength (Peacock 1987: 204 n13).


    James Peacock points to the impact that dominant discourses had on performers’
    behavior and lifestyles in 1960s Surabaya, that is his fieldwork on ludruk. Noting
    that after the Indonesian revolution, it was considered more progressive and modern
    for tandhak ludruk to live as men, he cites two tandhak who had cut their long
    hair for “progress” (1987: 206–207). Peacock emphasizes that cutting long hair
    was not without distress because long hair, as a part of the body, “may have signified
    a more sustained commitment to the womanly role that does interest in extra-social
    feminine trappings” (Peacock 1987: 207). Peacock also identifies contradictory
    expectations that tandhak faced in terms of their gender identities. On one hand,
    they were encouraged to be ideal when doing so'
