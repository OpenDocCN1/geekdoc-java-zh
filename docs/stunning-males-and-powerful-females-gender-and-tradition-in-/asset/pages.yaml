  md: '# Where Tradition, Power, and Gender Intersect 181


    in which I participated were products of specific cultural contexts and historical
    moments that involved my presence in Malangan as a foreign researcher, particular
    relationships with musicians and dancers, and their motivations to assert the
    senses of the past through performance. My teachers were invested in their cultural
    authority in the context of recording sessions because they felt responsible as
    my teachers and because they sought to preserve their particular interpretations
    of Malangan and east Javanese dances that I have documented, however, they believed
    were disappearing and not being represented satisfactorily in other forums. The
    performances that I have documented, however, are realizations of completely fixed
    dances and music not authoritatively renditions of a single original but, like
    most performances documented or not, interpretations that come from negotiations
    between individuals.


    Particular realizations of Malangan dances have now become a part of the specific
    archive that I have assembled. My archive, like any, is the product of decisions—mistakes—that
    performers and I made, the cultural politics that affected those decisions, and
    the politics of the documentation processes. These performances are neither realizations
    of fixed texts nor “authentic” renditions of a single, authoritative;“original”
    Beskalan, Ngromo, or masked dance because such dances no longer exist, if they
    ever did. As Kusnadi put it, what was drummed for a particular performance is
    what the dance becomes (p.c., April 24, 2006). A dancer might add that what is
    danced for a particular performance is what the dance becomes.'
