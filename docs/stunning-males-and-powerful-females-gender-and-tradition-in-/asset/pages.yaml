    # Cross-Gender Dance in Perspective


    It is important to keep in mind that in Malang, cross-gender dance was not unusual.
    The performers (and audience members) I consulted were quite used to dances performed
    as cross-gender dancers, recalling the practices into the past. For example, one
    performer recalled seeing a woman perform *Ngromo Lanang* as an opening dance
    for shadow puppet theater in 1955 (p.c., Asbari, June 30, 2006). Another musician
    recalled when he was playing tayub about 1963, the dancers (females) were still
    dancing Bekalan Putri. It was pointed to the use of *Ngromo Lanang*, starting
    in 1965 (p.c., Achmad Swarno, April 3, 2006). Growing up with ludruk, performers
    were quite accustomed to males performing female roles. Performers also recalled
    it becoming customary for males to play female roles in masked dance drama “in
    the past.” When I was in Malang, I noticed many female dancers performing as well
    as female roles.


    A brief sampling of cross-gender traditions in Java puts cross-gender dance in
    Malang in a larger context, further showing it to be not unusual. Crossgender
    performance has existed throughout what is now the Indonesian province of East
    Java since the nineteenth century (Pigeaud 1938: 277, 301, 321–323). The 1882
    account of female impersonation in a performance described as ludruk that Peacock’s
    book has already been mentioned (Pigeaud 1938: cited, in Peacock 1987: 29). In
    Banyuwangi, males dressed as females in the nineteenth century performed a type
    of dance called *seblang* (Sutton 1993: 136; Wolbers 1989: 8) and a type of social
    dance called *gandrung* (Wolbers 1986: 79; 1989: 35; Polovsky 1991: Sutton 1993:
    136). In Central Java, males have performed female roles in a variety of contexts—such
    as female style court dance in eighteenth-, and twentieth-century courts (Sumarnas
    1995: 276 n159; Raffles 1988: 342; Hughes-Freeland 1995: 184; 2006: 65–66; 2008b:
    154–157; Ponder 1990: 134). Prior to Indonesian independence, males also played
    female roles in Yogyakarta court performances of *wayang wong dance'
