  md: '# Constructing Gender and Tradition through Senses of History


    activity in the performing arts and criticized Muskayah for her involvement. Such
    criticisms were likely connected to negative assumptions about female singer-dancers,
    especially those who were itinerant. He said that Muskayah did not want her own
    daughters to become dancers because she did not want them to feel the pain of
    denunciation, indicating that she was deeply affected. Djpuri seemed to be responding
    as much to her hurt as to the censure from mens the community.


    Through his narratives about Muskayah''s call to become a singer-dancer, Djpuri
    implied that she was neither lower class nor a prostitute but was a healer given
    an important morally virtuous duty by a spirit with some connection to Islam.
    In situating the command to perform as andhong to such a spirit, Djpuri elevated
    the status of andhong as a tradition. Furthermore, since Muskayah''s power and
    knowledge came from a spirit she also had a connection to Islam, suggesting the
    importance of the religion to Malangan tradition. Speaking to her ultimate triumph
    within her community, Djpuri recounted that even the devout Muslims—the same people
    who criticized her—came to her when they needed a help.


    Performers'' senses of history in other regions of Java show connections musicians
    and dancers have made between performing arts, spiritual power, and Islam, thereby
    legitimizing the art forms. For example, the master gamelan Marsdingat (1882–1975)
    of the Surakarta court situated the origins of gamelan sekaten, a type of ensemble
    that is played in the courtyard of the court mosque as part of the celebrations
    commemorating the birth of the Muslim Prophet Muhammad (Sumarsum 1995: 29, plate
    13; 2011: 48). While there is no historical evidence to support this, linking
    gamelan sekaten to Islam enhances the spiritual power and status of the instruments
    (Sumarsum 2011: 48–49). As Sumarsum explains, "linking the origin and use of gamelan
    sekaten to the rise of Islam is common among the Japanese and scholars of Javanese
    culture" (2011: 48). In Cirebon, West Java, the curative power of masked dancers
    of pedigree, who may be female or male, is believed to be in part from their Muslim
    lineage, which they trace to Sun Kalijaga (Ross 2011: 146–147).


    The manner in which Djpuri talked about Muskayah—her curative powers stemming
    from a figure who appeared in seemingly Muslim dress, suggesting a Muslim lineage
    of sorts—also demonstrates the way he connected spiritual power, Islam, the past,
    and performance. In short, through his narratives about Muskayah''s dream experience
    as a child, Djpuri elevated andhong and Beskalan Putri, represented Islam and
    gender in ways that justified his grandmother''s activity as an artist and asserted
    her importance in the history of Malangan traditions.'
