    In the context of national discourses about womanhood and social memories of violence
    associated with Gerwani members, Djupri''s emphasis that Musayah “did not know”
    as she gained her *ilmu* was a very safe talk about a woman''s knowledge. While
    he recognized that she became the bearer of this knowledge, he feared of her responsibility
    for it or potential dangers it could bring. The *ilmu*, after all, was not hers
    to begin with, but bestowed upon her, transferred to her body. Djupri in effect
    downloaded her intellectual capacity. However, he also recognized that Musayah
    had her own additions over the course of her life, thereby acknowledging her personal
    touches, but without emphasizing her creativity as an intellectual process (p.c.,
    November 12, 2005). The dance entering the body of a dancer was what Did talked
    about being “entered,” earlier. As with Didik, such sudden abilities to perform
    a dance imply that beings in the unseen world had selected an individual as the
    recipient of something special, bestowing them with knowledge, spiritual potency,
    and cultural authority.


    Djupri emphasized Musayah did not gain her ability through worldly experience
    or interaction with other humans because the dance did not exist at the time (p.c.,
    November 12, 2005). He implied that Musayah reviewed a dance from hundreds of
    years ago that had become completely extinct after the fall of Majapahit in 1478
    or c. 1520 (see chapter four). She gained knowledge of this edge not through her
    own experience, intellectual capacity as an artist, or from studying with another
    person, but through a supernatural encounter. Djupri recalled, “Now I asked her),],In
    the past you taught you, Ma?” “Who taught me?” Djupri said, chaining to a higher-pitched,
    almost defensive tone to indicate Musayah''s voice. “I got it when I was ill,
    from I dreamed it. It appeared to make me like this and that.” Like he thus reinforced
    the spiritual nature of her learning by replacing Musayah''s own insistence that
    she gained her abilities through her dream.


    Although the political climate in Indonesia had changed since the mid-1960s, and
    Musayah was no longer living with Djupri related these stories about in 2005–2006,
    I contend that she was still affected by social memories of violence against women
    who were to be too independently minded like Gerwani members—whose perceived radical
    nature was linked to their perceived uncontrollable sexuality. Already deceased,
    Musayah was not in physical danger, but Djupri was still personally and emotionally
    invested in remembering her in particular ways.'
