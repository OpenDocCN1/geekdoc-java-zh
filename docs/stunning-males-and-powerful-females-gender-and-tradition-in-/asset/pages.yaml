  md: '# 5. Maintaining the Representation of Female Power through Beskalan Putri


    This chapter examines some of the ways in which artists have maintained cultural
    space for the representation of female power through Beskalan Putri as they have
    adapted, taught, remembered, learned, performed, and talked about this dance.
    I focus on representations of female power through Beskalan Putri because, building
    on the senses of history explored in the previous chapter, this dance and the
    femeness performers associated with it were critical to their senses of Malangan
    tradition. This analysis further illustrates the selection of tradition and the
    construction of gender as mutually constitutive cultural processes. Considering
    artists'' concerns with preservation as well the impact of social, political,
    and cultural climates on the ways artists represented female power through this
    dance, I argue that artists represented female power strategically—that is, in
    a “safe” way in times following trauma.


    # Changes to Beskalan Putri

    in Times Following Trauma


    Beskalan Putri has undergone some striking transformations since the 1960s, including
    changes in performance contexts. Andhong (an itinerant dance tradition featuring
    one or more female singer-dancers accompanied by a gamelan ensemble) fell out
    of practice and was no longer a context for the performance of Beskalan Putri.
    The dance came to be infrequently used to open tayub dance and ludruk theater
    in part male and female styles of Ngromo replaced Beskalan in popularity.


    The political events surrounding Soeharto’s rise to power in the mid-1960s, discussed
    in chapter two, also affected the decline in the frequency of the'
