    # A Lesson and a Recording Session


    Even moments of interaction reveal the many cultural, personal, and aesthetic
    factors that affect a particular realization of a dance and thereby contribute
    to the movements and sounds that are selected to comprise tradition. To foreground
    some of the decision-making processes and cultural factors that underlie specific
    interactions in particular contexts, I analyze interactions that contributed to
    particular realizations of Besalan Putri. I draw examples from two instances with
    which I was most familiar, one of my lessons and one of the video recording sessions
    I sponsored to document Besalan sing. As the participating artists worked to remember
    Besalan asli, they negotiated their senses of tradition and their senses of their
    authority. In doing so, they articulated senses of masculinity and femininity
    as they interacted within cultural structures and within structures of performance
    related to gender and age.'
