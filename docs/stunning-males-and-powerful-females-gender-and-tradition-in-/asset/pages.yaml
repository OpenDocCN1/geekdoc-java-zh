  md: '# Preface


    xxvii


    confusion because he was not white and thus was different from what Javanese imagine
    when they think of a generic American. Daniels found that “m]any local Javanese
    perceive ‘Negres’ and ‘Africans’, much like the dark-skinned Indonesian ethnic
    groups such as the ‘Papuans’ of Irian Raya, to be backwards and uncivilized” (2009:11).
    There were, however, certain advantages in being perceived as a dark-skinned person
    whose complexion happened to be similar to that of many Javanese people’s. I was
    dark enough to not be “white,” but light enough to be “Black” either. For many
    Javanese, my brown skin distanced me from the Dutch who were involved in a complicated
    history of colonialism in what is now Indonesia. I was also perceived as different
    from the Americans (i.e., white Americans) who had so much influence in world
    politics and economics the mid–twenty century.


    Instead, for those who thought I was from South Asia, my color linked me to the
    celebrities of the Indian films popular in Java. For those who mistook me for
    an Arab, I was also associated with the religious Muslims of the Middle East.
    In a Muslim-majority society where Arab cultural models and the Arabic language
    held a great amount of prestige for many (Rasmussen 2010:64), the significance
    of being taken for an Arab cannot be underestimated. For the Javanese and other
    Indonesians who thought I was from one of the eastern Indonesian islands, I was
    believed to share their national identity. Surprised to learn that I was from
    the United States, new acquaintances felt their arms next to mine, making comments
    such as, “Your skin is the same,” “we are like an Indonesian, aren’t we?” For
    better or worse, I brought the benefits of westernness without the cultural, political,
    and economic baggage of whiteness. Such perceptions of African Americans, including
    persons of mixed race, may change with the increasing presence of African figures
    in international politics such as former Secretary of State Condoleezza Rice,
    President Barack Obama, and First Lady Michelle Obama.


    Some performers, however, perceived to be a means to insert their unheard (or
    heard) voices into the prestigious space of academic literature (see Sunardi 2010:
    94, 118; 2011: 37). As a brown person, I was assumed to be sensitive and sympathetic
    to the perspectives of historically disowered groups, whether such groups be performers
    with little formal education in relation to those with degrees from college-level
    institutions, east Javanese performers in relation to central Javanese performers,
    or those who understood their perspectives as coming from marginalized, disadvantaged,
    and/or suboptimal positions in other ways. As an American doctoral student, I
    was also assumed to have wealth and powerful contacts.'
