    Concerns with Preserving Regional Culture


    My principals teachers taught Ngremo, Besalan, and masked dance to reinforce concerns
    of femininity and maleness that they had come to consider normal and to maintain
    the conventions of east Javanese dance performance, which they described in terms
    of “tradition” (tradisi) (see also Sundari 2009). They were not bothered by the
    onstage transvestism per se when these dances were performed or remembered as
    being cross-gender dances. They were, however, bothered by what they perceived
    as current performers’ failures to perform gender convincingly, competently, and
    artistically. Both males’ performance of female style dance and females’ performance
    of male style dance at the midway frequently fell short of their expectations.
    Fundamentally, they were concerned that performers—“nowadays”—since the 1990s,
    by others were departing from established conventions of tradition. The sixty
    or so other artists I consulted echoed such sentiments. For their parts, the musicians
    and dancers being criticized were expressing masculinity and femininity in their
    own ways and in doing so, pushing established conventions of performance and asserting
    their prerogative to define gender and their own ways. The concern with east Javanese
    tradition (and Malangan tradition in particular) shows that “aspects of identity”
    other than gender are also “at stake in transgendering and cross-dressing” (Morris
    1995: 53). Since the issues most pressing for artists in their conversations with
    me were related to regional identity and the maintenance of tradition, these issues
    became a focus of my attention.


    Underlying artists concern that Malangan traditions are maintained through what
    they deemed correct and convincing performances of male and female style dances
    was their fear that Malangan artists would eventually die out or disappear. Performers
    were also responding to the dominance of central Javanese and Surabaya artists
    in Malang (see Ongkokham 1972: Sutton 1991: 169–170; Sundari 2010). The dominance
    of these styles was nothing new. Drawing on observations made in Malang in 1963,
    Ongkokham noted the dominance of central Javanese and Surabaya styles at that,
    attributing their dominance to “[the increase of travel between the different
    parts of Java and the influence of radio broadcasting from the urban centers [which]
    were centralizing tendencies in Javanese culture at the cost of local art traditions”
    (1972: 111). For example, for the opening of a wayang topèng (masked dance theater)
    performance he observed, he found that Ngremo—a dance associated with Surabaya—had
    replaced a “bapang'
