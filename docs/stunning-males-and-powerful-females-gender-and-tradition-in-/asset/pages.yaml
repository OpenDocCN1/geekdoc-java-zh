    My thinking has been influenced by Sarah Weiss''s analysis of gender and performers''
    senses of the past in her studies of female musicians who play gender (a type
    of metallophone with two mallets) for central Javanese shadow-puppet performers
    (2002, 2006). She explores the cultural contradictions surrounding a gender playing
    style that has been gendered female because it has been historically associated
    with gender players, recognizing that females and males can do that. Weiss shows
    that, paradoxically, while central Javanese performers associate female style
    gender playing with “village style,” and village in general is usually denig by
    musicians in the urban traditions of the courts and arts academies, female-style
    gender playing is also connected to an older style of performance and thus valued
    (2002: 299–300; 2006). This older style is characterized by an “aesthetic . .
    of following the rasa, or feeling, of the performance and thus changes and develops,”
    rather than the schooled precision” typically associated with more recent, urban
    styles that are associated with mostly male musicians (Weiss 2002: 300; 2006).
    Weiss suggests that the connections between femeness, the past, and rasa-full
    performance—that is, performance full of feeling, affective power, and deep knowledge
    (see chapter one)—is one way in which performers have recognized female power
    through their senses of the past and thus maintained space for the recognition
    of female power in the present. Applying these perspectives to dance performance
    in Malang and developing a previously published analysis of performers'' senses
    of history (Sunardi 2010a, 2010b), I show that performers recognized female power
    in the present as they connected Besalan Putri to the past, spiritual power, and
    female figures, so so in different ways through their individual senses of history.'
