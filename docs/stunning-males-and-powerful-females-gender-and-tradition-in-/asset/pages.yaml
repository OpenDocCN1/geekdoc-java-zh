  md: '# Preface


    # Inspiration


    I did not expect that my derrière would be the subject of discussion between a
    former dancer in his eighties, a loud, energetic middle-aged woman, a young man
    who was one of my masked dance teachers, and a middle-aged male dressed like a
    woman selling tofu in an east Javanese village in the Malang area. And yet, there
    was. Or rather, my derriere was.


    Muliono, a strong but quiet young dancer had driven me through treacherous, hilly,
    rural roads to interview the old man, Supeno, about the east Javanese female style
    Besalan Putri “in past times” (as performers often put it). One of Supeno’s daughters,
    who was either visiting or lived with him, took the rather unusual opportunity
    to meet a visitor from America. Noticing the activity while making rounds, the
    tofu seller, who also had been a dancer, stopped and joined the conversation.
    Before long we were talking about spiritual knowledge and costing tricks used
    when they performed female style dance. Knowing that I was studying Besalan Putri,
    Supeno’s daughter imagined me in costume with a bit of padding to enhance my buttocks.


    > “If Auntie America were like that, she would look like better, she is tall.
    She is tall, but yet, like that for real!” she exclaimed, talking about me in
    the third person to be polite, as is typical in Java.

    And it would be really good, I’m telling you! Oh Dad, she’s got the body!”


    > “She’s got the body,” the tofu seller added. The woman continued to clock away
    at my figure as the tofu seller considered how she or Supeno might look tall.


    Stunning Males and Powerful Females: Gender and Tradition in East Javanese Dance.
