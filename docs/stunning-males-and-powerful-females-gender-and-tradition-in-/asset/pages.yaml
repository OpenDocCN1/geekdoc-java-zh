  md: '# Maintaining the Representation of Female Power


    divisional (this case male) used his sense of the past and his memories to recognize,
    represent, and thereby maintain the power of femeness, despite official ideologies
    that worked to control and subdue it. Djupri (b. 1939), too, lived with social
    memories from the mid-1960s that linked violence, freethinking women, and female
    sexuality. I contend that synthesized personal and social memories, remembering
    his grandmother strategically. Rather than focusing on the sexual or intellectual
    aspects of a woman''s power as a performer—which could carry potentially dangerous
    implications—he focused on his grandmother''s spiritual power, recasting the representation
    of a female singer-dancer (his grandmother) as a spiritually potent healer. It
    might also have been awkward for a grandson to speak about (or think about) his
    grandmother''s sexuality, another possible motivation for focusing on the spiritual,
    rather than sexual dimensions of his female power.


    In remembering his grandmother in particular ways, Djupri noted multiple ideologies
    of femininity and womanhood in Java, including those stemming from Javanese spiritual
    beliefs, national Indonesian discourses, and Islamic perspectives. At the same
    time, constructing femeness to include spiritual and physical strength and in
    emphasizing women''s roles as mothers, healers, and fighters, he contested some
    dominant constructs of femininity while reinforcing others, all while making sense
    of Muskayah''s power in a "safe" way. By doing so, he contributed to the preservation
    of Besalan Putri as a tradition that was steeped in femeness and female power
    as he taught me, a foreign researcher who could preserve his narratives through
    my projects, such as this book.


    # Embodying Ilmu and Spiritual Power


    Appreciating ilmu as transferable, "embodiable" packets of knowledge (chapter
    one) is critical to understand the implications of Djupri''s narratives and, in
    particular, the process and through which Muskayah gained ilmu about Besalan Putri
    as a process of embodiment. In his tellings of Muskayah''s reception, the dance
    emphasized that Muskayah was not consciously aware of what was happening as spirit
    infused her body with knowledge of the movements and musical accompaniment. He
    explained,


    And it seemed as though someone were making her arms move like a dancer''s, going
    through the sequence of the dance and singing the music. And it was heard as though
    there was a drummer, a gamelan performance: there were those playing the music,
    there was a drummer, a complete ensemble. It seemed like she was taken through
    the sequence of the dance. It [the [spirit]] was behind her.'
