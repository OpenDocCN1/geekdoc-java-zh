    she talked about waria''s struggles to be accepted by their families and communities,
    as the individuals Boelstorf consulted (2004b, 2007). Mama Samsu explained that
    many tandhak lukduk have women''s hearts, but do not live openly as waria. The
    stage was an important socially acceptable space for males with women''s hearts
    to embody womanhood, and her partner Totok explained, if only temporarily (p.c.,
    May 9, 2006).


    Mama Samsu pointed to social pressures, particularly in village communities, to
    conform to dominant assumptions about gender. In villages, people are still close-minded
    and the families of males with women''s hearts often make them live as men and
    many women, with tragic consequences. Mama Samsu said that people in the city
    were more tolerant of waria and their work in makeup, fashion, and performance
    was appreciated. However, even in the city, Mama Samsu noted that not all with
    women''s hearts who were active in lukduk (or in general) have the confidence
    to live openly as waria.⁶ She experienced discrimination by an institution of
    higher learning when her BA thesis failed because she dressed like a woman, although
    she did in 1982.


