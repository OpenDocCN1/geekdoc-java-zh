    At that time the dance was Tari Jombang—after Jombang. Dancers initially wore
    a long cloth wrapped around the body (kan), batik—cloth wrapped around the torso
    (angkin), and a scarf or sash (slendang). In Malang, dancers from Surabaya saw
    Besalan Putri and started to order the same or very similar costumes. By about
    1963, most dancers used this costume and the dance was called Ngremo Putri (p.c.),
    Chattam Amat Redjo, April 14, 2006; July 24, 2007.


