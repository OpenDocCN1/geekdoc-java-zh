    # Martial Power


    Women''s physical and emotional strength as fighters has similarly occupied an
    ambiguous place in the Javanese imagination. As sexual and economic power, there
    is a long history of women''s martial power in Java. Through the course of the
    seventeenth to the nineteenth century, female soldiers in the central Javanese
    courts were highly trained in the use of weapons and cavalry maneuvers, and female
    bodyguards were entrusted with the duty to protect the ruler (Kumar 1980: 3–8,3;
    Carey and Houben 1987: 18–19; Sumarsam 1995: 26–27; Weiss 2006: 61). During the
    Java War (1825–1830), a Javanese rebellion against Dutch rule, the “well-born
    lady” Raden Ayu Sreng showed her bravery and prowess as a warrior leading a cavalry
    cavalry squadron (Carey and Houben 1987: 21). In the twentieth century, women
    have been active rebels, guerrilla fighters, soldiers, social and political organizers,
    and leaders of Islamic organizations, in some cases risking jail time, their well-being,
    and their lives (Anderson 1965: 26; Walton 1996: 135–136; Wieringa 2002; Blackburn
    2008: 8).


    One cultural model for “strength” women exists in the figure of Sriandi, a female
    character in Javanese theater who is well known for her confidence, eloquent speech,
    social interaction, and skill as a warrior (Carey and Houben 1987: 13–15; Pausacker
    1991; Wieringa 2002: 233).¹ There are tales, too, in which she is transformed
    into a man and even fathers, suggesting cultural space for the crossing of conceptual
    and physical boundaries of sex and gender in Javanese stories (Pausacker 1991:
    281–282, 286–287). Significantly, the figure of Sririkandi was referenced in official
    discourse. According to Benedict Anderson, “not only the women''s units in the
    Indonesian Army took Sririkandi as their model, but also the first woman warrior
    who landed in West I during the 1962 liberation campaign was waged by Sukarno
    and by the general public” (1965: 26). At the same time, holding up the figure
    of Sririkandi has built a cultural ambience surrounding women''s power in the
    form of their strength as fighters, as well as other expressions of women''s magnetic
    power, contributing to dominant discourses stemming—a male-controlled structure
    of power—in which women have been portrayed as loyal, submissive wives and mothers.


