  md: '# Note on Conventions


    sent pitches, a period is used to designate a rest, and the symbols indicated
    in Figure o.a are used to indicate colomotic instruments. For basic drum patterns,
    however, I depart from kepatihan notation to write the syllables of the strokes
    as I learned from my principal teacher Kusni. These syllables closely resemble
    the sound made on the drum. My hope is that this is easier to read for nonspecialists
    than the symbols typically used to note drum patterns in kepatihan. George Rucker''s
    (2004) use of syllables to note patterns played on the North Indian tabla (a set
    of two drums) inspired my usage of Javanese syllables.


    Returning to kepatihan notation, a horizontal line above a number, or drum syllable
    indicates a rhythmic subdivision. Underlined numbers for vocal melodies indicate
    that a syllable of a word is sung over more than one note. There is no standard
    tuning for pitches in Java; however, one way to approximately equate Western pitches
    to the Javanese used in the two tuning systems of sléndro and pélog as follows:
    for sléndro, 1 = d-flat, 2 = e-flat, 3 = g-flat, 5 = a-flat, 6 = b-flat, and for
    pélog, 1 = d, 2 = e, 3 = f, 4 = a-flat, 5 = a, 6 = b-flat, and 7 = c. Pitches
    without dots indicate the middle register. A dot above the number indicates the
    upper register while a dot below the number indicates the lower register.


    Colomotic instruments are indicated by placing the symbols in Figure o.a above
    a particular beat.


    = Kempul – set of smaller hanging gongs


    = Kenong – set of horizontal gongs


    = Gong – large gong gongs


    Figure o.a: Symbols for colomotic instruments.


    The drum patterns and vocal melodies that are noted are basic patterns and melodies
    as I learned from my teachers and would typically be performed with more elaboration
    or ornamentation. For the vocal melodies, the rhythm is somewhat free and then
    loosely indicated. There is some flexibility to when a singer may begin and end
    particular phrases within the structure of the piece, although the singer ideally
    should sing the last note of a phrase going to the gong tone shortly before or
    on the gong stroke and typically sustains the last note past the gong.'
