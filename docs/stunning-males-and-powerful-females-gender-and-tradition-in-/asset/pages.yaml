  md: '# Note on Conventions


    the north (Sutton 1991: 121; Crawford 2001: 329). When performers in Malang spoke
    about “central Javanese” arts, they were usually referring to the arts of Surakarta
    (a court city in the province of Central Java) and sometimes to the arts of Yogyakarta
    (a court city and special administrative area in south Java). My use of “central
    Javanese” includes the arts of Surakarta and Yogyakarta areas as follows Sunardi
    2010a: 89). It is important to note that the connections between styles of arts
    and particular regions did not mean these regional forms were exclusively practiced
    in the region with which they were associated.


    # Spelling and Names


    I have spelled Indonesian and Javanese words according to standard conventions
    used in Indonesia. In older spellings, some individuals used for their names,
    “oe” is used instead of “u,”tj” is used instead of “c,”dj” is used instead of
    “j,” and “j” is used instead of “y”. Because I encountered many ways of spelling
    the dance Ngromo in Javanese (including different ways to accent the “e”), I followed
    my principal gamelan teacher’s advice and used the Indonesian spelling–Ngromo.


    I capitalize the names of dances, such as Ngromo. Lowercase letters are used to
    refer to types of music, dance, or theater, whether in Indonesian, Javanese, or
    an English translation. I also capitalize styles with the name of a place that
    is capitalized, such as Malangan (in the style of Malang) (see also Sunardi 2001:
    52 n8).


    While using terms of address appropriately is critical in speaking Indonesian
    and Javanese politely in Java, I have chosen mostly not to use honorifics in this
    book because their usage is not fixed. The appropriate term of address a person
    uses when speaking to someone is determined by a number of factors, including
    the relationship of speaker to an addressee, the context, and their social and
    cultural status at a particular moment. For example, a person I may address as
    “father” or “mother,” another person may address as “brother” or “sister.” I mean
    no disrespect to the people I consulted by using honorifics. When referring to
    a publication for the author used an honorific as part of his or her name, however,
    I do include the honorific when referencing the author’s name.


    # Notation


    I have noted musical examples primarily, but not entirely, in the kepatihan system,
    a standard system used in Java in which numbers are used to repre-'
