    Some performers emphasized the costume used for Ngremo Putri was taken from Besalan
    Putri. Chattam explained that Ngremo Putri originated in Surabaya, where it derived
    from Ngremo Lanang. Drawing on his memories, he recalled that Ngremo Putri came
