    from Bali, and other parts of Asia (see Janarto 2005; Ross 2005; Mrasek 2005;
    Hatfield 2008: 161–163, 267; Hughes-Freeland 2008b: 16–162). He has dedicated
    much of his artistic and scholarly life to raising awareness about cross-gender
    traditions in Indonesia and other parts of Asia. He has also been contributing
    to the preservation and transformation of Javanese regional arts, including the
    Malangan dance Bekalan Putri. It was his hauntingly beautiful performance of this
    dance in San Francisco in 2003 that captivated my interest in Malang arts in the
    first place, and it was he who led me to PSMD and M. Soleh Adi Pramono in 2004
    when he helped my husband and we make a preliminary visit to Malang to scout potential
    sites.


    Because of us and most of the other artists I consulted were male, male voices
    are the core of this book. My principal teachers, Sumi’anah was the only woman.
    I have attempted, however, to somewhat balance male perspectives with the voices,
    perspectives, and experiences of the women I consulted, as well as my own perspectives
    as female. Through analysis of the experiences of both males and females, I hope
    that this book focuses a focus on what that has dominated in studies of gender
    in Southeast Asian studies (Andaya 2007: 127; Peletz 2006: 309).


    As I worked with my teachers and other performers in Malang, I entered a complex
    and delicate network of professional and personal (including familial) relationships
    between the people I consulted. Each individual had particular relationships with
    other artists and particular positions within interrelated circles of other performers,
    sponsors, and institutions (Brinner 2009: 163–212). For me to consider as a researcher
    is that performers make decisions about what information to share with me in the
    context of their position(s) within these complex webs of professional and personal
    relationships. Moreover, each of these individuals unique takes and,, in some
    cases, worked to assert the cultural authority of his or her particular perspectives
    on and interpretations of dance and music.


