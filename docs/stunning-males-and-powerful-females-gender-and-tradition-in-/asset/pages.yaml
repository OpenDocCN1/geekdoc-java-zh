    of the mask (p.c., November 29, 2005). Karen Elizabeth was in effect identifying
    different approaches she took to the embodiment of masculinity for different dances.
    Making such choices was another means and through which dancers expressed contented
    senses of female masculinity.


    # Negotiating Islam


    Performing male style dance was also a means by through which women could negotiate
    Islamic orthodoxy and piety: “Because Islam has comprehensive teachings about
    women’s role and place in society,” Susan Blackburn instructively writes, “almost
    anything one can do be seen as political in the sense of either accepting, supporting
    or challenging religious practices and beliefs” (2008:84). Sri, identified as
    Muslim responded to my question as whether she felt any incompatibility with her
    religious beliefs by explaining,


    > No, that is our work, you. Why should we feel ashamed, why? It is our work,
    right work in order to eat, right? As far as religious matters, that is between
    us and the one above. Yes, [work and religion] cannot be all mixed up. The important
    thing is that we are right, yes?—Work a job that is halal.(p.c., March 29, 2006)


    In using the word “halal”—what is permitted or allowed by Islam—Sri was evoking
    religion in order to legitimize her profession as an artist, with some striking
    assertion given the immoral stereotype of female singer-dancers in Java, as well
    as her activity performing male style dance. Invoking Islamic discourse, she was
    insisting on the “rightness” of her profession.


    Other Muslim performers have drawn on religious discourse to legitimize their
    practice, offering examples of “women sharing Islam” (van Doorn-Harder 2006).
    These performers have included other Javanese female singer-dancers (tledhek)
    that Robert Hefner encountered who performed at tayuban (including tledhek) (1987b:
