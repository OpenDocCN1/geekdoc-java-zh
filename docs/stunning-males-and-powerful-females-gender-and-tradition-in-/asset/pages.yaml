    own experience dancing, the dancer can communicate to the drummer by signaling
    the beginnings and endings of particular sections, adjusting the tempo by tapping
    the gongseng faster or slower, and using the gongseng to remind the drummer when
    he has forgotten a movement. The gongseng also provides continuous sonic input
    to the drummer, giving him a sense of what the dancer is doing, or going to do—alerting
    him when the dancer’s movements do not match the drumming—even if he is not looking
    at the dancer. At the same time, the gongseng can sonically confirm that dancers
    “bought” from the drummer. Not surprisingly, performers such as Sumantri and Lestari,
    who believed the dancer should follow the drummer, not attribute a leading role
    to the gongseng (p.c., Sumantri, April 23, 2006; Lestari, April 30, 2006).


    The drummer most typically sided to the dancer through drumming patterns. Given
    that drumming patterns and movements do not necessarily correspond to a one-to-one
    relationship, the dancer’s knowledge of the dance affected him or her ability
    to buy from the drummer. Already having memorized, or at least having some idea
    of the movements and their order, the dancer could be reminded of a specific movement
    by the drumming. Sometimes the drummer intentionally drum patterns to correct
    the dancer’s mistakes or lapses of memory: rather than buying the error, the drummer
    reminded the dancer by playing the pattern of the “correct” movement—sometimes
    slightly louder to gain the dancer’s attention.


    Strikingly, “forgetting” can also reinforce a performer’s intention to determine
    the course of the dance. Kusn admitted to masked dancers (who were men younger
    than him) during a rehearsal that he could forget the order of some sections and
    they should know which movements went with drumming patterns that they could follow
    (p.c., May 1, 2006). By telling the dancers that he might forget, Kusn indirectly
    ensured that they pay attention and buy from him, the more senior man. This was
    a particularly effective strategy—whether intentional or not—when he and dancers
    had different opinions about the correct way to perform a dance.'
