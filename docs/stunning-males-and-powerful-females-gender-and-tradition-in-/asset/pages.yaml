    In separating the roles of singing and dancing in his adaptation of Besalan

    Putri, Chattam in effect removed one way of representing female sexuality

    that was associated with female singer-dancers and had negative connotations.

    in some senses, this makes Besalan Putri more appropriate for children to

    learn—that is, girls who are not yet sexually mature and are expected

