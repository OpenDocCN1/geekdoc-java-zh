    # Ilmu (Spiritual Knowledge)


    Ilmu (Indonesian), or élmu/ngèlmu, is a complicated term in Java with different
    shades of meaning. An Arabic-derived word (Daniels 2009: 41), it has broader meanings
    as "knowledge" or "science." It also has particular shadings that are more connected
    to mystical beliefs and practices in Java. Other scholars have translated, or
    described ilmu/ngèlmu as "science" and "a kind of abstract knowledge or supernatural
    skill" (Geertz 1960: 88); "esoteric knowledge/science" (Mulder 2005: 165); and
    "mystical knowledge" (Keeler 1987: 235; Daniels 2009: 41). Like Clifford Geertz,
    who conducted fieldwork in Java in the 1950s, I also found that some individuals
    talked ilmu as a kind of substantive magical power (1960: 88), suggesting a continuity
    of some ideas about ilmu. While I recognize ilmu as it relates to mystical beliefs
    and practices may mean different things to different people, I have come to understand
    ilmu as a substantive "packet" of knowledge, of a secret and esoteric nature that
    can lead to a remarkable ability to do something by helping a person to access
    and embody spiritual power, and it is this sense of ilmu that is the focus of
    this book.


    Ilmu exists for many different kinds of abilities, as to disappear; to fly; to
    be invincible; to be present in more than one place simultaneously; to win the
    love of another; and to perform music, dance, and theater (see also Geertz 1960:
    88–89). In writing about forms of ilmu, I have done my best to be clear in my
    explanations, examples, and analyses while also respecting the wishes of some
    performers to keep some aspects confidential. In the context of performance, ilmu
    is knowledge that enables artists—including musicians,'
