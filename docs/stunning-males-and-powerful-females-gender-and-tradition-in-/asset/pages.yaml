  md: 'masculinity and femininity through these negotiations (Downing 2010: 54, 66–68,
    71–72). I am also interested in the ways some performers embody the magnetic power
    of femaleness, maintaining it in Javanese culture.


    # Relationships between Performers

    in Terms of Relationships within a Family


    In talking about east Javanese presentational dance and its accompanying gamelan
    music, B. Suprono Hadi Prasastya described the relationship between the drummer
    and the dancer as one of partnership, explaining that you could call them husband
    and wife (p.c., November 10, 2005). Suprono’s use of this metaphor captures the
    relationship between the drummer and the dancer in Malangan dance, evoking dynamics
    of power and constructions of gender in a contemporary Javanese context. Complex
    cultural traditions underlie the husband-wife metaphor. Like a family, dance performance
    involves particular roles and relationships between the performers. With these
    relationships comes dynamics of power related to structures of gender and age
    (Locher-Scholten and Niehof 1987: 9; Errington 1990: 47–48).


    On one hand, the metaphor expresses the complementary nature of male and female
    elements characteristic of some Javanese worldviews, the powerful position that
    many women hold within the family as discussed in chapter two (Brenner 1995, 1998),
    and the give-and-take relationship between the dancer and the drummer. A special
    and complex relationship exists between the dancer and the drummer in part because
    the dance movements and drumming patterns are intricately related: the drum expresses
    what the dancer performs. As one of sorts, the dancer and the drummer shape a
    particular realization of the dance as they work together. In the context of performers’
    discourses about interacting in ideal situations, the husband-wife metaphor implies
    a more-or-less equal, gendered partnership between the drummer and the dancer.


    On the other hand, in the context of dominant discourses about family and nation
    in Indonesia, it evokes the power and authority given to men as husbands and fathers
    (Shiraishi 1997; Blackwood 2005). When most drummers are male and frequently authoritative
    members of a group, the husband-wife metaphor implies that dancers defer to the
    drummer as women should defer to their bands and as sons and daughters should
    defer to their fathers. Also implied is that the musicians should primarily follow
    the drummer—rather than the dancer—as the dominant “father” figure.'
