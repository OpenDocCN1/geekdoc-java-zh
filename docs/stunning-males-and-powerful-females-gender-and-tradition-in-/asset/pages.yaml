  md: '# xviii Preface


    factors me to see this book through to completion. Moreover, as Michael Bakan
    (1999) and Michelle Kisliuk (2000) highlight by reflecting on their own experiences,
    analysis of the researcher''s relationships with the people who are the subjects
    of study recognizes the roles that researchers and subjects play in generating
    the instances, and unexpected results, that lead to new insights during fieldwork
    (see also Sunardi 2011: 37).


    Interactions with artists, with my dance and music teachers in particular, have
    made this book very much a product of collaboration, albeit mediated through my
    voice, understandings, and aims. While conducting fieldwork, I spent most of my
    time in private lessons, practicing (alone or with another artist), observing
    and/or participating in rehearsals or group practice sessions, observing and/or
    documenting performances, and conducting interviews. Much of what I learned was
    gained through conversations that occurred during my private lessons, at practice
    sessions and rehearsals, and at performances, in some of which I played a musical
    instrument or danced. My studies of performance practice—particularly dancing,
    drumming, and singing—and experiencing performances have been critical to my understanding
    of ways in which musicians and dancers sense of gender. At the time, chat with
    taxi drivers, at performances, with performers backstage, and with others as I
    was out or about as people (including artists) dropped in to visit my husband
    and at the home that we were renting was also important to my understandings of
    East Javanese arts, senses of gender, and a range of individuals'' perspectives.


    My private lessons were particularly rich moments of interaction. In the course
    of hours-long lessons, my teachers imported their memories of past performances,
    their own learning processes, and the secrets of forming well, at times entrusted
    me with knowledge that to them was special, personal, and spiritual. They insisted
    on my ability to learn dance movements, drumming patterns, meticulous elaborations
    on other gamelan instruments, and vocal melodies, even when I—exhausted, frustrated,
    insecure about what I was doing in “the field,” on some of the breaks (and, on
    a few occasions, in tears)—was ready to give up. By passing us to drink some coffee,
    tea, or water, offering a snack, or telling a story, they encouraged me with sensitivity
    and care.


    My teachers were actively involved in other aspects of the research process. They
    facilitated my entry into arts communities by introducing me to other performers
    who introduced me to others. My teachers helped me to organize recording and video
    sessions, took me to performances, and provided me opportunities to play or dance.
    No less crucial were their insights as we analyzed audio and video recordings,
    including my field recordings, and'
