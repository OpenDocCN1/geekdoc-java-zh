    # Understanding Besalan Langang in Relation to Besalan Langang


    Skepticism about the Antiquity of Besalan Langang


    Given that performers talked about Besalan Putri’s performance “in the past” (dulu)
    without hesitation, I was struck that they frequently raised the issue of Besalan
