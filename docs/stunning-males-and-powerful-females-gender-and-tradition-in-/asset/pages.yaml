    strenuously that they are good Muslims” (1987b: 77). Female dangdut singers—including
    Inul Darat who was at the center of national controversy in the early 2000s for
    a style of dancing that some Indonesians proved to be too provocative—have also
    positioned themselves as Muslims, maintaining that their art and their religion
    were separate matters (Daniels 2009: 88–89; Bader 2011: 346). Other dangdut singers
    negotiated Islam and their profession through their belief that the money earned
    as an entertainer at a place where alcohol was consumed was halal as long as they
    did not drink the alcohol themselves (Browne 2000: 29). As they negotiated Islam,
    Sri and other female performers were subverting dominant Indonesian ideologies
    that insisted that women be “proper wives and mothers,” making cultural space
    for women—including Muslim women—to publicly assert other roles (e.g., as artists)
    as well as their sexuality (Browne 2000: 2, 30). Doing so through the performance
    of male style dances, as Sri did when she performed Ngremo Tayub, made such negotiations
    of gender and religion all the more complex.


    # Being like Men without Being Men?


    By performing male style dance, female dancers and the musicians (mostly male)
    who accompanied them negotiated boundaries of gender and visually and sonically,
    maintaining and making cultural space for women’s expression of female power despite
    pressures from state and society to control and subdue it. In particular, performers
    were negotiating expectations that women should be powerful but also refined,
    submissive wives and mothers. Some women clearly did not identify exclusively
    with official representations of ideal femininity projected through figures like
    Sumbabra and Kartini, but instead used male style dance as a means to embody alternative
    senses of womanhood. The given precedent of violence against women who pushed
    too hard against official constructions—not only the destruction of Gerwani in
    the 1960s but also highly publicized cases of murder in the 1980s—allowed performers
    to articulate official ideologies in ways that did not overtly challenge the state’s
    authority. Onstage, performing male style dance, women embodied and expressed
    their power as females in different ways—sexually, physically, and economically—as
    well as showed that they could be like men—physically strong, move quickly and
    freely, independently artistically. By expressing their femininity visually and
    sonically through a male veneer, women demonstrated that females could be like
    men without being male or living as men.'
