    acter and behavior in her everyday life. Palupi that has a hard time with refined
    female style dances because they are too slow; she is not slow or relaxed (p.c.,
    November 15-16, 2005). Tri Wahyunungtyas (pictured in Photograph 2.1) preferred
    male style dance (such as Bekalan Lanang and Ngremo Lanang) because of its strength
    and freer movements:


    Perhaps it is the character, the character from the movement that is stronger,
    also wider and more open. I just feel more comfortable performing it . . . When
    I think of female (movement), it is smaller, more, I don''t know, one has to—ah,
    too much! It''s more intricate than male movement, which is freer and has strength.


    Women Palupi and Tri could use the stage as a space to rehearse and formulate
    ways of moving and acting that they could take to varying extent into their daily
    lives. As Sylvia Theo has argued, women make sense of their identities despite
    dominant ideologies that they portrayed as ideal models like Kartini or uncontrollable
    maniacs like German members (1996).


    Women’s expression of masculinity in Malang also speaks to a larger issue of how
    women in various parts of the world perform as a means to embody gender identities.
    For example, Deborah Wong shows that performing taiko is a strategy that Asian
    American women use to embody an femininity that is loud and assertive, challenging
    cultural expectations and stereotypes that Asian American women are quiet and
    demure (2004: 216–218). Tomie Hahn shows that Japanese women are able to take
    on identities through *nihon buyo* dances in which a single dancer portrays different
    characters, including male and female (313). She argues, “the metaphoric shifting
    presence in nihon buyo choreography offers an embodiment of multiled identities
    with flexible notions of self within a society that has historically restricted
    their expression” (Hahn 2004:323). Women’s embodiment of different senses of gender
    performance can be an important means of resisting norms.


    In Malang, women internalized the maleness of the characters they portrayed to
    different degrees, contributing to the expression of female masculinity in different
    ways. Tri, for example, embodied maleness by concentrating from the heart. She
    talked about the importance of becoming the character from the dancer’s heart
    or soul, explaining that if there were no disturbances, she felt like the male
    character she was portraying and no longer herself. As a dancer, she expounded,
    “one has to be able to feel the character and have enthusiasm from the inside;
    otherwise, the dance will not have form” (p.c., Tri Wahyunungtyas, July 1, 2006).'
