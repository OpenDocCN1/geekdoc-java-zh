  md: '# Preface


    XV


    ninity, not just for the visual impact, but for everything that the power of\femeness
    and dance performance contributed to their senses of tradition,

    history, and identity. My captivation with the ways musicians and dancers

    have approached this power has to Stunning Males and Powerful Females,

    a book that explores how performers—males and females—have expressed,

    bodied, embodied, and continuously reproduced power through

    est Javanese dance and its accompanying gamelan music (played on an

    ensemble comprised of gongs, keyed percussion instruments, and

    drum[s]) in Malang. This has grown out of and develops my earlier

    work on performance in this fascinating place (Sunardi 2007, 2009, 2010a,

    2010b, 2011, 2013).


    I found Malang to be a complex and vibrant locale. Known in Java (and

    beyond) for its breathtaking mountains, cool climate, and apple orchards,

    Malang is home to diverse ethnicities, including those of ethnic\Japanese, Madurese,
    Chinese, and Arab backgrounds. Ethnic diversity is

    character of other places in East Java as well, sometimes contributing to

    complex senses of ethnic identity, as in the case of mixed Madurese

    Javanese heritage in Proboling by Konstantinos Retikas

    (2007a, 2007b). Religious diversity has also characterized Malang, despite

    the large Muslim majority. One of my teachers was Catholic. Hinduism is

    also practiced, particularly in the Tengger mountain communities that span

    tencies of Malang, Pasuruan, Probolinggo, and Lumajang (Hefner

    1985: 44). Local Javanese spiritual beliefs and practices are also quite present.

    And no less important, as I explore in this book, the diversity of

    gender identities and sexual orientations. I was so enchanted with Malang 2005
    to

    August 2006, I returned, writing parts of my dissertation and conducting

    more fieldwork from mid-January to early September 2007, and have

    multiple trips to visit my teachers since.


    During my fieldwork and ensuing visits I resided in the village of Tulusbe-

    sar (or Tulus Besar) in the district of Tumpang. I lived near the Mangun

    hara Art Center (Podepani Seni Agung Dharma, and PSMD), which was

    about-three kilometers off the city of Malang. While I stud-

    ied primarily with artists who lived in Tumpang and in Konokusumo,

    neighboring district, I also consulted and observed artists in other parts

