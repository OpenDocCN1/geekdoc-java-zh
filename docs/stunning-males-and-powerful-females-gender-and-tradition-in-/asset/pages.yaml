    “all troops must have an official government sponsor and many are associated with
    the military” (1971: 94). In addition to the military, the police also funded
    ludruk groups (Hater 2008: 31). Such surveillance of performers ensured little
    overt criticism (Peacock 1987: 258–359).


    The trauma of violence and the increased presence of the military affecting the
    performing arts in parts of Java. Laurie Ross describes a new type of registration
    card that was issued to performers in the Cirebon region of West Java as “an unapologetic,
    unsimental top-down affair with the singular purpose of establishing the parameters
    of the new military’s role” (2011: 66). Similarly, performers in central Java
    exercised caution. Puppeteers tended to choose subjects for humor that would be
    “irrelevant to the government,” as other orders of puppet theater (Sears 1996b:
    1). Barbara Hathaway found that many ketoprak performers in Yogyakarta have felt
    too timid to resist and/or grateful for the work opportunity (2008: 37). The same
    may have been the case among ludruk performers in east Java. Given that many performers
    in different parts of Java were also recovering psychologically from the trauma
    of violence (and grieving for those they had lost), it is not surprising that
    they tended to avoid explicit challenges to the state by blatantly resisting New
    Order ideologies, although some artists did voice opposing views during the New
    Order era, seeking repercussion (Sutton 2004: 203).


    People responded to pressures from the state in different ways. In some cases,
    performers demonstrated their abilities to comply with the state’s ideals through
    the ways they talked and performed gender. Other artists, however, may have been
    sincerely attracted to the state’s ideas; some may have been indifferent, and
    some may have complied–a strategy of survival, with subversive effects, as Ariel
    Heryanto identifies as “hyper-obedience” (2006: 136). Some may have approached
    performance with all of these feelings and attitudes toward the state at different
    points in time (Sunardi 2009: 470–471). It was in this New Order context, with
    the social memory of violence, that Beskan Putri came to be performed primarily
    by females, and the dance was shortened.'
