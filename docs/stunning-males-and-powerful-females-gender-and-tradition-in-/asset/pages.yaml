  md: '# Note on Conventions


    Malang, “east Java,” and “East Java”


    Malang is both a regency (kabupaten) and a city that lie within the cultural region
    of east Java, Indonesia (Map 0.1). Unless I specify "the culture of Malang,""
    my references to Malang are references to the regency. As R. Anderson Sutton demonstrated
    in his study of regional gamelan traditions in Java, national political divisions
    (including the names of provinces) and cultural regions do not always neatly correlate
    (1991). Following Sutton''s approach, I use lowercase letters to refer to names
    of Indonesian provinces (i.e., east Java, central Java) and uppercase letters
    to refer to cultural regions (i.e., East Java, Central Java) (Sundari 2010: 120
    n3). The traditions of music, dance, and theater that musicians in Malang I referred
    to as east Javanese from the central part of the province of East Java, including
    Malang, Mojokerto, and Surabaya, corroborating Sutton of this cultural region
    “the triangular area marked by Surabaya, Mojokerto (or Jombang), and the coast
    south of Malang” (1991: 121; also see Sundari 2010a: 89).


    The dances which this book revolves—Besalan Putri, Besalan Laang, Ngromo Putri,
    Ngromo Lanang, Ngromo Tayub, and masked dance—are east Javanese (Jawa timuran),
    meaning that these dances are from the cultural region of east Java and associated
    primarily with ethnic Javanese culture of this region. This is not to suggest,
    however, that these arts are practiced and supported exclusively by ethnic Javanese
    or that these arts have not been influenced by other regional traditions. Performing
    arts that are related to but distinct from those of east Java are linked to other
    cultural regions in East Java, such as Banyuwangi at the eastern end of Java and
    the island of Madura to'
