    # Recognizing Dferences, Identifying Malangness


    Performers were also aware of the differences in the musical accompaniment and
    dance movements for Ngremo Putri and Besalan Putri, which they used to distinguish
    Besalan Putri as a Malangan dance (also discussed in Sundari 2010a and 2010b).
    For example, “Juli Juli” and “Gendhing Besalan” are nearly identical structurally
    and melodically (see Figure 4.1).perform heard “Gendhing Besalan” and “Juli Juli”
    as different because part cause “Gendhing Besalan” has also been used to accompany
    the masked dance Babang, and has been used for another dance that performers believe
    was characteristically Malangan (p.c., Budi Uoto, December 26, 2006; Gimun, December
    26, 2006; Kusnadi, May 2006). “Gendhing Besalan” is thus part of a musical repertoire
    that performers perceive as Malangan. In contrast, performers heard “Juli Juli”
    as part of a general Javanese repertoire. Perhaps because “Gendhing Besalan” and
    “Juli Juli” are similar melodic,perform down on their sense of history to underscore
    differences in characteristic systems.


    Tuning System Performers explained the basic differences between Besalan Ngremo
    by polarizing the dances in terms of tuning. They said that Besalan Putri is performed
    in pelog, a seven-toned system with larger and smaller intervals, while Ngremo
    is performed in slendro, a five-toned system with more or less equally spaced
    intervals. Associating tuning system with place, they linked pelog, Besalan, Malangan
    and opposed to slendro, Ngremo, and Surabaya/longman.


    Performers and researchers have emphasized the use of pelog in Malang. Jaap Kunsts
    tabulations of complete bronze slendro and pelog sets in areas of East Java (with
    other information, including the number of inhabitants based on the 1930 census)
    confirm the prevalence of pelog gamelan ensembles in Malangan historically. The
    predominance of pelog distinguished Malangan music from that of neighboring areas,
    where there were significantly more slendro sets (Kunst 1954–567; Sutton 1991:
    132). Decades later in the 1980s, R. Anderson Sutton observed that slendro was'
