    ideas and to justify her male femininity in offstage day-to-day life. Using the
    question of who was judging, humans or God, answered that God is the one to judge,
    and that everyone is God’s creation. Referring to many waria’s and handhak’s experiences
    of being forced to live as men and women, unable to satisfy their wives (implying
    sexually), Samsu said that they cannot help it because they were made like that
    by God (p.c., May 9, 2006). In other words, God made some feminine and sexually
    desirable male partners, not females. Samsu was also speaking to an important
    aspect of waria identity—having a male body with a woman’s heart, making the waria
    identity distinct from that of “woman” (Boellhorst 2005b: 57, 169, 171; 2007:
    88, 90, 92, 99).


    When I asked Samsu what her religion was, she replied, “neutral”—implying her
    independent and open-minded approach. She went on to explain that at one time
    she and her long-term partner Totok argued about religion. She questioned why
    one had no access to God through Islam, articulating her belief in a Supreme while
    also expressing reservation about choosing Islam as the way to practice monotheism.
    Mama Samsu decided, however, to “enter Islam” (masuk Islam) with Totok and went
    to an Islamic board, consulting an Islamic teacher (kyai). Totok, however, distanced
    himself from Samsu, which led to a fight that resulted in their temporary separation.
    Relating their reunification, she explained that Totok became ill and Samsu was
    asked to pick him up, concluding the narrative with the point that “the one to
    judge is God, not people” (“yang ialah Tuan, bukan orang itu”) (p.c., Sansuarto,
    May 9, 2006).


    The example of Samsu and her relationship with Totok provides a provocative comparison
    to other Indonesians identifying with normative gender identities and sexual orientations
    made sense of their sexuality, lifestyles, and Islam, as explained by Tom Boellhorst
    (2005a, 2007) and Evelyn Blackwood (2010). While many males who identified as
    gay (males who live as men and desire other males who live as men) did find being
    gay a sin, the predominant views Boellhorst found that being gay was either sinful
    nor “a minor easily forgiven by God” (2005a: 580; 2005b: 183; 2007: 151). Similar
    to Samsu, many of Boellhorst’s gay Muslim interlocutors referenced ultimate judgment
    by God. Also in the same vein as Samsu, “many gay Muslims concluded they were
    created by God and, thus, that they were not sinning” (Boellhorst 2005a: 580;
    see also 2005b: 183).


