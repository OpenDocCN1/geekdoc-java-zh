    # “Selling and Buying”


    Describing ideal situations, many drummers and dancers explained that no one person
    leads in real-time performance, but that the dancer and drummer “sell and buy”
    (dol-tinuku in Javanese and jual-beli in Indonesian) so that the articulation
    of the dancers'' movements and the drumming patterns precisely match. To “sell”
    is to initiate an interaction while “buy” is to follow, or what has been “offered.”
    Buying and selling between drummers and dancers is possible because there is room
    for them to intentionally or unintentionally make decisions in the course of performance
    (Nettl 1998). The dances that I have discussed in this book—Beskalan, Ngremo,
    and masked dance—are memorialized, but not entirely fixed. Dancers and drummers
    usually know or decide upon the movement order or general movement order. Some
    movement sequences may be repeated, and often the number of repetitions is also
    decided prior to performance. Sometimes, however, performers intentionally or
    unintentionally repeat particular sections, omit movements, vary the movement
    order, and/or adjust the tempo as they realize the. The spaces for the drummer
    and the dancer to lead and follow each other facilitate the realization of the
    dance in performance because little or no rehearsal is involved.


    The formality of drumming patterns and dance movements as well as the correlation
    between these patterns and movements allow competent performers to make quick
    decisions as they listen to and watch each other in action. Similarly, in his
    study of drummer-dancer interaction in Martinican bèlè, Julian Gerstin recognizes
    that performers can respond to each other'
