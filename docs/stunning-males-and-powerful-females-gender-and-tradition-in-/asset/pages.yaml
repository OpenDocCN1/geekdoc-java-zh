  md: '# Afterword


    In exploring dance performance as a dynamic site of cultural negotiation and change,
    this book has argued that through the continuous transformations performers have
    made to tradition, they have been: negotiating culturally constructed boundaries
    of gender and sex—sometimes reinforcing these boundaries, sometimes transgressing
    them, sometimes doing simultaneously. I have approached the cultural production
    of tradition and gender as mutually constitutive processes, examining how dancers
    and musicians have pushed the gender dualism characteristic of dominant ideologies
    to articulate complex senses of gender—including senses of female masculinity
    and male femininity (Halberstam 1998; Boellstorf 2004b, 2005b, 2007)—in particular
    ways in specific contexts. In effect performers were creating cultural space for
    the expression of gender pluralism (Peletz 2006). They were also showing the expression
    of gender to often be contingent or situational (Oetomo 2000; Boellstorf 2007;
    Blackwood 2010).


    As we have seen, individual artists developed strategies for situating themselves
    within the constantly evolving constellations of personal, local, national, and
    global values that surround the negotiation of masculinity and femininity. Such
    strategies have included theatrical approaches (e.g., makeup, costuming, movements),
    musical approaches (e.g., ways of singing, playing of the drum), and spiritual
    approaches (e.g., negotiating Islamic beliefs and practices, using *ilmu* and/or
    mantras, interacting with spirits). Some individuals have taken gender transgender
    in various ways, from living as a woman who knows she is not slow or relaxed,
    to living as a woman with the controversial occupation of singer-dancer, to living
    as a man who recognizes the femaleness in himself, to living as a *waria*. These'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Afterword


    have not always been comfortable processes for individuals, and living with the
    social consequences of their decisions and/or activities as artists has not always
    been easy.


    I have been particularly interested in the ways performers maintain and make cultural
    space for the magnetic power of femeness through their hearts, minds, and bodies
    depict a variety of cultural pressures that to contain, control, and suppress
    it. We have seen this power expressed in various ways, including sexually, economically,
    spiritually, martially, through leading roles—as in the direction of artistic
    innovation—and through following. We have also seen different ways male and female
    performers through same-gender dance, through their senses of history, and through
    their senses of local tradition. Indic senses of bhakti—spiritual power or cosmic
    energy gendered female—present in Javanese medieval times, are not only present
    but are a critical aspect of Javanese culture (Becker 1988, 1991, 1993; Hughes-Freeland
    1995). In Malang, female power is essential to performers'' senses of local tradition,
    particularly as represented in Besalan Putri.


    In spite of performers'' concerns about the future of local tradition—or because
    these concerns were so strong—I remain optimistic and excited about the future
    of the performing arts in Malang. On visits following the period of my fieldwork,
    I have seen younger dancers coming into their own as artists and new drummers
    in the making. The news my husband and I have received from friends in Malang
    through text messages and Facebook, as well as the videos we have found on YouTube,
    suggest that musicians and dancers are continuing to actively engage with the
    arts. I was pleasantly surprised when my husband showed me a photograph on Facebook
    of one our friends, a young male dancer known for his strong style masked dancing,
    in a Besalan Putri costume. I do not have the sense that Malang arts are dying;
    I have a sense that they are very alive and will continue to transform—sometimes
    subtly and sometimes dramatically, intentionally and sometimes unintentionally—as
    artists continue to make music and dance relevant and meaningful within their
    communities, as well as critical sites of cultural and ideological work in the
    twenty-first century.'
