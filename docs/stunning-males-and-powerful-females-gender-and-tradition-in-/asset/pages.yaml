  md: '# CHAPTER 5


    performance. Among those with any association, or suspected association, with
    communist organizations who were imprisoned, exiled, or killed in 1965–1966 were
    performers, including musicians and dancers (see also Sunardi 2009: 40–471). Ludruk
    performers were targeted because ludruk often featured social and political criticism,
    some performers were associated with communist activity, and some troupes were
    associated with communist organizations (Peacock 1987: 27–28, 40–41). Following
    the murder of the generals and lieutenant in 1965, ludruk groups were disbanded
    and performers killed or imprisoned (Peacock 1987: 258). Henri Supriyanto and
    Wahyudiyanto called the 1965 and the ensuing years (until 1968) as a “vacuum period”
    (masa vakum) as a result of the events and performers'' fear, suggesting that
    ludruk activity stopped or virtually stopped (Supriyanto 1992: 14, 20; 18, 26;
    Wahyudiyanto 2006: 68). Similarly, ketoprak, a type of Javanese dance, ceased
    for some years in Yogyakarta (Hatley 2008: 30–31), and in Indramayu, a regency
    in West Java, masked dance and puppet theater were banned through 1969 (Ross 2011:
    162). Performers consulted in Malang the fear and suspicion that pervaded their
    communities; some spoke in hushed tones, indicating that the violence and disorder
    of the period were etched into their minds.


    While some artists returned to the stage when the political situation became less
    volatile in the late 1960s, others did not. Many were still traumatized. In places
    affected by the violence, many friends, neighbors, family members, and mentors.
    As mentioned in chapter two, some artists were banned due to suspicions of association
    with the Indonesian Communist Party or of-left-leaning organizations (Larasati
    2013: 57, 123). Some artists were prohibited by stigma and/or “[official policy
    [that] made it illegal for former prisoners to work in education, the arts, the
    media, in the public sector, and many other roles” (translator’s note to Rachmati
    2005: 213). Some artists felt too afraid to perform anything or had other motives
    for their interests to other activities.


    As a new generation of performers became active in ludruk in the 1960s and early
    1970s, they danced to Ngromo Putri, a dance that had gaining in popularity prior
    to the political disorder. After the 1960s, males came to perform Besalan Putri
    infrequently, largely because Ngromo Putri replaced Besalan Putri as an opening
    dance for ludruk, the primary context in which males performed Besalan Putri (p.c.,
    Asbari, June 29, 2006; Chattam Amat Redjo, April 14, 2006; July 24, 2007; Supriyanto
    2001: 24).


    The performers filled the vacancies in the late 1960s and 1970s, including a younger
    generation of artists, brought with them a more cautious'
