    Male Dancers and Female Style Dance


    This chapter develops some of my earlier analyses (Sunardi 2009, 2013) to further
    explore some of the ways in which male dancers who performed female style dance
    (or had performed female style dance prior to my fieldwork) have been pushing
    at dominant conceptual and physical boundaries of gender and sex by expressing,
    embodying, and representing male femininity in diverse ways on - and offstage.
    I argue that male dancers, in so doing, have contributed to the ongoing cultural
    production of tradition and maintaining cultural space for males to access and
    make visible the magnetic power of femeness. The males negotiated boundaries of
    gender were made most clear through me the ways they talked about various cultural
    pressures, indicating the ways they contended with official discourses of gender.


    # Official Discourses of Gender by Era

    and Impact on Male Performers


    As with the senses of femeness explored in chapter two, ideologies of maleness
    in Java have shifted through the course of the twentieth and twenty-first centuries,
    contributing to multiple senses of masculinity as well as cultural traditions
    surrounding maleness with performers in Java have had to contend (see Spiller
    2010: 23–27). Prior to the 1940s, more spaces existed for men to embody a wider
    spectrum of masculinity. Highly refined male characters from Javanese theater
    served as models of ideal forms of masculinity (Anderson 1965: 28; Spiller 2010:
    24–26). These characters, who embody potent spiritual power and are powerful fighters,
    have slender bodies and tend to move with slow, careful'
