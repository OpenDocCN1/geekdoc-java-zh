    Strikingly, performers'' use of the term tandhak to identify female or male performers
    contributed to the blurring of boundaries separating femeness and maleness.^4


    With the exception of female vocalists, professional adult musicians were predominantly
    male (Photographs 1.4 and 1.5).^5 Playing a number of roles, the drummer provided
    the sonic articulation of the dance movements through the drum patterns. Some,
    performers believed that the basis of the dance was in the drum patterns. Furthermore,
    by playing the drum, the drummer communicated to the rest of the musical ensemble
    as the group leader. By mediating the dancer''s wishes, such as to adjust the
    tempo or to a different section of the dance, the drummer was the liaison between
    the dancer and the rest of the musicians. The drummer also had a responsibility
    to energize the dance, which he often did by pushing and pulling the tempo. The
    drummer was frequently one of the most authoritative members, if not the most
    authoritative, of a particular group. In the group which I regularly played, my
    teacher Kusnadi was considered the most authoritative member and he played the
    drum. Sometimes, however, he would turn the instrument over to another drummer
    or allow a younger musician who was learning to play the drum an opportunity to
    gain experience by playing for a rehearsal/or performance. Usually the most authoritative
    member played the drum to lead the other gamelan musicians, as in other regions
    styles of gamelan, including central Javanese (Binner 1995). The difficulty of
    playing the drum also necessitated a very high level of competence, generally
    gained through years of experience, as also in other regions, including central
    Java (Binner 1995: 133–164).


    Usually at the end of the chain of command, the rest of the gamelan musicians
    followed cues communicated by the drummer or dancer. They also followed the drummer''s
    fluctuations of tempo, some of which were quite subtle while others were fairly
    dramatic. This is not always easy for new to East Javanese gamelan music, but
    competent musicians seemed to not have too much trouble because of their experience,
    already knew which movements to expect to be slower or faster.


    Following the drummer and dance through aural and visual signals, the gamelan
    musicians contributed to the performance in many important ways. The musicians
    playing the colot instruments (Kenong, kendemp, and gong) helped to keep the dancer,
