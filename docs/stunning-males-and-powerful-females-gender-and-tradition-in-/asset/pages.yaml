  md: '# Maintaining Female Power through Male Style Dance


    # Negotiating Boundaries of Gender


    In performing male style dance, females have articulated senses of female masculinity—distinct
    senses of masculinity expressed by females (Halberstam 1998)—that entailed keeping
    their femeness visible and audible. Building further from Judith Halberstam, I
    view such approaches as forms of “layering,” a theatrical strategy in which a
    performed gender role is noticeably superimposed—layered onto an actor’s gendered
    self (Halberstam 1998: 260–261). One form of layering occurs “[w]hen a drag performs
    as a recognizable male persona and “choose] to allow her femeness to peek through”
    (ibid.: 260). Similarly, female dancers in Malang “layered” masculinity onto their
    female bodies when performing the recognizable male personas portrayed through
    male style dances, allowing their femeness to “peek through”. They were thereby
    showing that women could be like men (physically strong, the lead), but without
    being men. In other words, women were insisting on their power as women, thereby
    maintaining the magnetic power of femeness. In doing so, women were pushing tradition
    in particular directions visually and sonically.


    # Negotiating Boundaries of the Body’s Appearance


    Movement Ngremo Tayub offers one of the most obvious examples of the ways women
    learned maleness through movements. Movements associated with masculinity—higher
    arm positions, wider stances, and larger head movements—included those drawn from
    various male style dances and from a form of martial arts called pencak silat.
    However, females tended to articulate these movements in a more supple manner
    than males did for style dances and allowing a certain grace and fluidity that
    are associated with female style dances (and femeness more broadly) to permeate
    the execution of their movements. Movements were associated more directly with
    femeness, such as movements drawn from aerobics—typically a woman’s activity—and
    from “pat-a-cake” hand games—movements associated with children’s activities.
    Movements associated with femeness juxtaposed with those associated with maleness
    but executed in a more supple manner in the context of a male style dance performed
    by female bodies produced a complex sense of gender index.


    When women performed other male style dances, such as Ngremo Lanang, Beskalan
    Lanang, and male style masked dances, they tended to execute the movements less
    sharply and less forcefully than male dancers, similarly allowing their femeness
    to “peek through.” Speaking to this femeness,'
