    that by the late 1970s to mid-1980s, a section in which viewers could tip the
    performers, request a song, and with the dancers was incorporated into Ngromo
    Lanang, which female singer-dancers performed as an opening for tayub events.
    By the 1990s, a subtle dynasty that came to be Ngromo Tayub emerged. Although
    this style was named for tayub, it has been performed for a variety of performances,
    not just for tayub, and may be performed with or without a tipping section.


    The incorporation of a section in which guests could request a song inspired a
    bit of controversy among performers. Some said almost with disgust that this was
    just a way for the dancers to make money. They seemed to imply that this innovation
    to Ngromo was economically driven and had little artistic merit, suggesting that
    they were interpreting this change through the lens of the dominant, male-oriented
    Javanese ideology of power that links concerns with money to crudeness. Performers
    may have also internalized views that the “desire and cash” is what makes female
    singer-dancers and their performances “deemed unsuitable as approved national
    culture” (Hughes-Frehner 2008c:144). In the eyes of some, inserting a tipping
    section was inappropriate for the brave, proud, nightly male character of Ngromo
    Lanang, a dance that was usually performed to welcome and honor guests; a tipping
    section effectively degraded the dance into a display of money.


    The ambience about the tipping innovation may also lie in women’s control of the
    money. Significantly more tip money went to the female dancers, rather than to
    the male musicians, and it was largely a dancer’s decision as to whether she would
    share her tips and how much she would share with the musicians (usually with the
    drummer). This innovation that augmented their status. Susan Browne found that
    the tip earned by female dangdut singers in nightclubs, providing a means of giving
    them economic status, “does not enhance their social status”(2000: 16). However,
    guests’ requests for songs and paying tips gave women certain economic authority
    to “rule the root” as they performed Ngromo, like many women have done in the
    home (Brenner 1995).


