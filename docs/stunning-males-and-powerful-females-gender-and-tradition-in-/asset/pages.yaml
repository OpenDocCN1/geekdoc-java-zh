  md: '# CHAPTER 1


    While many central and east Javanese performers and scholars recognize the greatness
    of the east Javanese courts and trace aspects of central and east Javanese arts
    to, most generally do not think of present-day Javanese arts as "court" arts per
    because these courts fell hundreds of years ago, and prior to the establishment
    of the existing central Javanese courts. Rather, Javanese arts are generally connected
    to city, town, and village cultures. Within the arts from Surabaya, the capital
    city of the province of East Java, are generally given more institutionalized
    prestige than arts from Malang, which are often associated with villages.


    The higher status given to central Javanese and Surabayan styles in conjunction
    with audiences'' desires had material consequences for the performers consulted.
    In part due to government cultural policy that has promoted what it defined as
    the most prestigious arts, the presence of Javanese and Surabayan styles been
    reinforced in Malang, contributing to the dominance of these styles in performed
    repertoires. Audiences in general had to prefer central Javanese and Surabayan
    styles, and were more likely to hire artists who performed them. In addition,
    performers had to compete with popular music such as dangdut, a genre that features
    electric guitar(s), bass, keyboard(s), and drums at its core, often with flute,
    and has been influenced by Malay, Indian film music, Middle Eastern popular music,
    as well as American and British rock (Frederick 1982; Manuel 1988: 210–211; Yampolsky
    1991b; Weintraub 2010). Another genre that was quite popular campur sari, which
    combines gamelan instruments with electric keyboards, bass, and guitar, and other
    instruments depending on the group (Brinner 2008: 19; Supanggah 2003). Aware of
    these market factors, musicians and dancers constantly explained that they had
    to perform what audiences desired in order to be hired, and like the artists Tony
