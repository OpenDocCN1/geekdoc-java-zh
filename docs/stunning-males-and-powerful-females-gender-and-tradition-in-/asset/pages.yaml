    # Motivations to Sell and Buy:

    Concerns with the Preservation of Tradition


    In addition to the social norms and conventions of performance that affected interactions,
    performers had their own reasons for selling and buying in particular ways. Brinner
    uses “interactive motivation” as a “rubric” for the “why” of interaction, the
    goals, rewards, pitfalls, and sanctions” (1995: 169). The goals of performing
    well and the avoidance of a dancer or embarrassing the former in front of the
    audience were two motivations I have already identified. Any one individual might
    have many motivations for participating, including economic (getting paid) and
    social (playing with friends).


    Correctness was also a key motivation in the realizations of asli forms of Besalan,
    Ngremo, and masked dance. Eve Harwood provides insight into why personal ideas
    of correctness were so important to performers. In her study of African American
    girls'' singing games, she writes, “everyone in an oral tradition becomes responsible
    in some sense for maintaining the authenticity of the repertoire” (Harwood 1998:
    114). In the case of Besalan, Ngremo, and masked dance, although the basic or
    skeletal melody—and sometimes the colotomic structure—of the music was noted,
    the dances and movements of the musical elaboration were not. Much of the knowledge
    about these dances and their music lay in the realm of oral (and visual) tradition.
    Ideas of correctness were important to performers because, working without a single,
    fixed, written, authoritative text, they were striving to maintain authentic Malang
    and east Javanese traditions.


    As have seen in this book, many performers were concerned with the maintenance
    of local tradition and witnessed the decline in the popularity of Besalan Putri
    and masked dance over the course of their lifetimes; they feared these dances
    as well as Malang performing arts in general would be completely replaced by more
    popular styles of music, dance, and theater from central Java and Surabaya (see
    also Sutton 1991; Sunardi 2010a). Reinforcing this fear of loss is lost that when
