  md: '# 6. Where Tradition, Power, and Gender Intersect


    # Performer Interactions


    This chapter uses analysis of performer interaction to round off my exploration
    into gender, power, and tradition, bringing together many of the themes and issues
    discussed in previous chapters to demonstrate some of the ways that micro-moments
    of interaction on- and offstage are critical moments of complex cultural and ideological
    work. Intrigued by what my teachers indicated were the asli–the authentic, real,
    original, complete—forms of Besalan, Ngremo, and masked dancers, which they talked
    about reverently but rarely had opportunities to perform, I sponsored rehearsals
    and sessions with the aim of documenting as many of these dances in their entirety
    as I could. My teachers and the other musicians and I expressed their enthusiasm
    about these opportunities to remember and transmit their senses of the past and
    tradition through these projects. The prospect of actually seeing and hearing
    what my teachers had implied were almost-forgotten movements and drumming patterns
    sent ripples of excitement down my spine.


    My bright-eyed optimism was soon replaced by surprise and then when disagreements
    arose between performers as they interacted. Initially I had assumed they imagined
    the same choreographies and drum patterns when they referred to the asli forms
    of these dances. I quickly learned, however, that they had their own senses of
    correctness about the movements and movement order that comprised the original,
    authentic, complete forms of the dances so central to their conceptions of Malangan
    and east Javanese tradition. I have come to understand and posit here that by
    resolving their differences of opinion prior to, during, and after any particular
    performance or rehearsal, musicians and dancers were continuously affecting'
