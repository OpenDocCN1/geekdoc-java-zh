    # Supatman


    The experiences of Supatman (b. 1945), a former tandhak ludruk, further point

    to pressures on male artists to live as men. In Supatman''s case, the pressures

    came from his family, and in a roundabout way, other performers. Supatman,

    however, recognized the femininity he once embodied in his offspring stage.


    Remembering decades into the past, he recalled performing Ngremo Putri

    in lrok (an old term for ludruk) in the late 1950s. While he recalled his

    popularity—sometimes performing eighteen times a month—he also recalled

    that performers, lively jealous, attacked him with black magic so

    he would stop performing. Suffering the effects of this sorcery, he went crazy,

    and was in a state of distress for twenty-one days. His parents helped him to

    get cured, but made him promise to perform in lrok. After he

    stopp performing in lrok, he turned to a type of central Javanese theater

    called wayang orang, which he performed Ngremo Langang and other male

    roles for two years, from 1958 to 1960. He then turned to a form of sum

    poetry macacat and by 1962 was performing professionally (p.c.,

    December 6, 2005; March 26, 2006).


