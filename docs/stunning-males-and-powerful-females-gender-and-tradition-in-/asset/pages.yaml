    # Studying the Arts in Malang as a Tall-Broad-Shouldered-Foreign-But-Brown Female
    Researcher


    Learning to dance and play music as a research strategy has heightened my awareness
    of the ways in which my own body–my sex, my color, my stature, and other aspects–affected
    how people interacted with me as I conducted field. The impact of my body as a
    researcher is critical to consider because “as a mean of access to information”
    (Buckland 2006: 13), the researcher’s body affects conclusions that are drawn
    from her or his particular experiences conducting fieldwork. Helen Thomas and
    Jamilah Ahmed highlighted that “[t]the researcher’s body is immersed in the field
    and is simultaneously outside the research (by means of lack of knowledge) and
    in the research (by the fact of its physical presence)” (2004: 3). My body was
    strangely and undeniably present. At the risk of self-indifference, I take further
    from Nicole Beaudry (1997: 81–82) and Carol Babicki (1997), who considered the
    impact their gender may have on their fieldwork; from Eileen Hayes who positively
    presented herself as a “mad bad woman festiger” (2010: 9–31); from Tomie Hahn
    and the reflexive writing approach she takes in her study of Japanese dance (2007:
    9–14); and from James Clifford to emphasize that I, as a heterosexual American
    researcher of mixed race who was married to a Javanese man, was neither “an undgendered,
    unsexed, sexually inactive subject[ing] . . . with interlocutors” (Clifford 1997:
    202), nor was I perceived to be.


    Attitudes toward me were complex. In some ways, Javanese did not always evaluate
    the quality of my dancing, singing, or drumming. More appealing for some performers
    and some in the general population was that I was a foreign woman. Like Williams
    Williams who regularly performed a'
