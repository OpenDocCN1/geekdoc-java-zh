  md: "# Object-Oriented Programming (OOP) Concepts ■ 57\n\nClass C is only available\
    \ from inside the same module in this case. Even though class D may be accessed\
    \ everywhere, the variable int and method display() are only available inside\
    \ the same module.\n\nProtected Modifier\n\nThe protected modifier in Kotlin only\
    \ enables access to the declaring class and its subclasses. At the top level,\
    \ the protected modifier cannot be disclosed. We used the derived class's getValue()\
    \ function to retrieve the int variable in the following example.\n\n```\n// base\
    \ class\nopen class C {\n    // protected variable\n    protected val int = 20\n\
    }\n\n// derived class\nclass D: C() {\n    fun getValue(): Int {\n        // accessed\
    \ from the subclass\n        return int\n    }\n}\n\nfun main(args: Array<String>)\
    \ {\n    var a = D()\n    println(\"The value of integer is: \"+a.getValue())\n\
    }\n```\n\nOverriding of Protected Modifier\nTo override the protected variable\
    \ or function in the derived class, we must mark it with an open keyword. In the\
    \ following program, we override the int variable.\n\n```\n// base class\nopen\
    \ class C {\n    // protected variable\n    open protected val int = 20\n}\n```"
