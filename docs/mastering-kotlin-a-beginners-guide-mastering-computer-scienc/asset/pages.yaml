    # WHAT ARE THE BENEFITS OF KOTLIN?


    Kotlin was created by Lead Developer Dmitry Jemerov''s search for functionality
    that he couldn''t find in Java. Scala is another language that runs on the JVM;
    it came close, but compiling too long.


    Jemerov desired a language with all of the characteristics of most recent programming
    languages, which could operate on the JVM and compile as quickly as Java. As a
    result, he developed his language, Kotlin.


    Kotlin was supposed to be a substitute for Java on the Android system. In 2019,
    Google ultimately agreed with Jemerov and most Android developers and proclaimed
    that Kotlin was the ideal language for Android app development eight years after
    it was launched.


    Here are some of the reasons why developers choose Kotlin over Java:


    +   - Kotlin is succinct, which saves time spent creating boilerplate code in
    Java.


    +   - A script may use to convert a Java file to a Kotlin file.


    +   - There is no runtime overhead with Kotlin. Adding features to a language
    can result in increased overhead, which reduces efficiency. Not the case with
    Kotlin.


    +   - Kotlin has a sizable user base. If we get stuck, we may obtain support from
    other developers on coding forums and social networks.


    +   - Kotlin makes asynchronous programming more accessible. Making asynchronous
    network and database calls in Java is clunky and inconvenient. Coroutines in Kotlin
    make asynchronous programming efficient and straightforward.'
