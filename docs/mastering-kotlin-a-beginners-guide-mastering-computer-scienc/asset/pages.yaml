  md: "# 116 Mastering Kotlin: A Beginner's Guide\n\nSmart casts do not operate if\
    \ the compiler cannot ensure that the variable will not change between the check\
    \ and the usage. The following guidelines regulate the use of smart casts:\n\n\
    +   - Except for local delegated properties, val local variables always works.\n\
    \n+   - val properties only work if the property is private or internal, or if\
    \ the check is done in the same module as the property is defined. Smart casts\
    \ do not work on open properties or properties with custom getters.\n\n+   - var\
    \ local variables only work if the variable has not been modified between the\
    \ check and usage, is not captured in lambda that modifies it, and it is not a\
    \ local delegated property.\n\n+   - Because the variable can change at any time,\
    \ var properties never operate.\n\n# EXPLICIT TYPE CASTING IN KOTLIN\n\nTo check\
    \ the type of a variable in Smart Casting, we usually use the or|is operator,\
    \ and the compiler automatically casts the variables to the target type, and while\
    \ in explicit casting, we use the as operator.\n\nExplicit type casting can be\
    \ accomplished by employing:\n\n+   - Unsafe cast operator: as\n\n+   - Safe cast\
    \ operator: as?\n\nUnsafe Cast Operator: as\n\nWe utilize the type cast operator\
    \ to cast a variable to the target type manually.\n\nVariable st1 of string type\
    \ is cast to target type using operator in the following program.\n\n```\nfun\
    \ main(args: Array<String>) {\n    val st1: String = \"works fine\"\n    val st2:\
    \ String = st1 as String // Works\n    println(st1)\n}\n```\n\nIt is possible\
    \ that we cannot cast a variable to the target type, and it throws an exception\
    \ at runtime, which is why it is called unsafe casting."
