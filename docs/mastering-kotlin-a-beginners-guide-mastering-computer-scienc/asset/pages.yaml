  md: "# 98 Mastering Kotlin: A Beginner's Guide\n\nExceptions are classified into\
    \ two types:\n\n+   - Checked Exception: Exceptions are often put on methods and\
    \ checked at build time, such as IOException, FileNotFoundException, etc.\n- Unchecked\
    \ Exception: Exceptions are often caused by logical mistakes and are checked at\
    \ run time, such as NullPointerException, ArrayOutOfBoundsException, etc.\n\n\
    Exceptions in Kotlin\n\nExceptions in Kotlin are only unchecked and may be detected\
    \ only at run time. All exception classes are descended from the Throwable class.\n\
    \nTo throw an exception object, we often use the throw-expression:\n\n```\nthrow\
    \ Exception(\"Throwme\")\n```\n\nAmong the most common exceptions are:\n\n+  \
    \ - NullPointerException: When we try to execute a property or method on a null\
    \ object, we get a NullPointerException.\n- ArithmeticException: This exception\
    \ is thrown when numbers are subjected to improper arithmetic operations. For\
    \ example, divide by zero.\n- SecurityException: This exception is thrown to signify\
    \ a security breach.\n- ArrayOutOfBoundsException: This exception is thrown when\
    \ we attempt to retrieve an array's incorrect index value.\n\nThrowing an arithmetic\
    \ exception in Kotlin program:\n\n```\nfun main(args : Array<String>) {\n    var\
    \ num = 20 / 0    // throws exception\n    println(num)\n}\n```\n\nIn the above\
    \ program, we start the num variable with the value 20/0, although we know that\
    \ dividing by zero is not permitted in arithmetic. When we try to run the application,\
    \ an exception is thrown.\nTo address this issue, we must employ the try-catch\
    \ block."
