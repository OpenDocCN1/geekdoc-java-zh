  md: '# Mastering Kotlin: A Beginner’s Guide


    # HISTORY OF KOTLIN


    The following are significant landmarks in Kotlin’s history:


    +   - Kotlin v1.0 was released in 2016.

    - Google made an announcement in 2017 about first-class Kotlin support in Android.

    - Kotlin v1.3 was released in 2018, adding coroutines for asynchronous programming.

    - Google chose Kotlin as their preferred programming language for Android app
    developers in 2019.


    # FEATURES OF KOTLIN


    The following are major Kotlin features:


    +   - Provides Reduced Coding.

    - Kotlin uses the JVM, which combines the benefits of OOP with functional programming.

    - Provides quick compilation.

    - Kotlin supports a wide range of extension functions without code modifications.

