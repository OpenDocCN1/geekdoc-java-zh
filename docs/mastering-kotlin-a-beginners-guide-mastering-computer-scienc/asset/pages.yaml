  md: '# DEFAULT AND NAMED ARGUMENTS IN KOTLIN


    Most programming languages require us to declare all of the parameters that a
    function takes when calling function, but one of the significant characteristics
    of Kotlin is that we do not need to specify all of the arguments a function accepts
    when calling that function. We may remove this requirement and make parameters
    optional, allowing us to choose whether or not to give an argument when calling
    a function.


    Function arguments in Kotlin are separated by comma and defined using Pascal notation.


    ```

    fun fun_names(names1: data_type, names2: data_type)

    ```


    In Kotlin, there are two kinds of arguments:


    +   - Default arguments

    - Named arguments


    Default Arguments in Kotlin

    The parameters that do not need to be specified explicitly when invoking a function
    are referred to as default arguments.


    If function is called without any arguments, the function''s default arguments
    are utilized as parameters. If arguments are given during a function call, they
    are utilized as function parameters in other circumstances.


    There are three scenarios in which default parameters are used:


    +   - No arguments are passed while calling a function

    - Partial arguments are passed while calling a function

    - All arguments are passed while calling a function


    No Arguments Are Passed While Calling a Function

    When no arguments are given when calling a function, the function parameters are
    the default arguments. When defining a function, we must initialize the variables.


    Program for calling the students() method in Kotlin without supplying any parameters:


    ```

    // the default arguments in the function definition

    names, standard and roll_no

    ```'
