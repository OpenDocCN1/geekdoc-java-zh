  md: '# 242 Mastering Kotlin: A Beginner''s Guide


    # ANNOTATIONS IN KOTLIN


    Annotations are a Kotlin feature that allows the programmer to embed additional
    information in the source file. This information, however, does not affect the
    program''s activities. A variety of tools utilizes this data during both development
    and deployment.


    The following arguments are typically included in annotations and must be compile-time
    constants:


    +   * Primitive types (Int, Long, etc.)

    * Strings

    * Enumerations

    * Other annotations

    * Arrays of the types mentioned above


    Using Annotation


    We may use annotation by placing its name in front of a code element prefixing
    it with the @ symbol. For example, if we want to use the annotation Positive,
    we should write the following. If we want to use the annotation Pos, we should
    write the following:


    ```

    @Positive val x: Int

    ```


    Similar to a function call, an argument can be passed to an annotation in parentheses.


    ```

    @Allowedlanguage("Kotlin")

    ```


    The @ symbol should be omitted when an annotation is used as a parameter in another
    annotation, the @ symbol should be omitted. We''ve used the ReplaceWith() annotation
    as a parameter here.


    ```

    @Deprecated("function use = = = instead", ReplaceWith("this = = other")\))

    ```


    When an annotation parameter is a class object, we should add::class to the class
    name as:


    ```

    @Throws(IOException::class)

    ```'
