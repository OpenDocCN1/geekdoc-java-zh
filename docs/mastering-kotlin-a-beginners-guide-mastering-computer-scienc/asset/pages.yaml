  md: "# 254 Mastering Kotlin: A Beginner's Guide\n\nSpecifies if x is not equal to\
    \ null, the function equals(y) is called; otherwise, if x is determined to be\
    \ null, it tries to see whether y is referentially equal to null.\n\nNote: When\
    \ (x == null), it is immediately translated to referential equality (x === null);\
    \ therefore, no optimization is required.\n\nAs a result, to use == on instances\
    \ of a type, the type must override the equals() method.\n\nThe structural equality\
    \ of a string compares its contents.\n\n# Referential Equality\n\nIn Kotlin, referential\
    \ equality is tested using the === operator and its opposite, the !== operator.\
    \ This equality returns true only if two instances of the same type refer to the\
    \ same memory address. When used on types that are transformed to primitives at\
    \ runtime, the === check is converted to == check, and the !== is converted to\
    \ !!\n\nProgram using Kotlin to illustrate structural and referential equality:\n\
    \n```\nclass Squares(val side: Int) {\n    override fun equals(other: Any?): Boolean\
