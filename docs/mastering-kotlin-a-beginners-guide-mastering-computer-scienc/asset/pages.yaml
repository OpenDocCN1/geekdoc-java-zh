  md: '# Variable Scope in Nested Blocks


    Unless a variable with the same name is declared at the head of the inner block,
    the variables declared at the block’s head are visible throughout the block and
    any nested blocks. When a new declaration becomes effective throughout the inner
    block, the outer declaration reverts to being effective after the inner block.
    As a result, variables have nested scopes.


