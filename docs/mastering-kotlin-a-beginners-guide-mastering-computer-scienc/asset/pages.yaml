  md: '# Collections in Kotlin ■ 241


    # HashMap Time Complexity


    If the function is designed correctly and the items are appropriately dispersed,
    Kotlin HashMap gives constant time or O(1) complexity for fundamental operations
    like get and put. When searching in a HashMap, containsKey() is merely a get()
    that throws the received result; therefore, it''s O(1) (assuming the hash function
    works properly).

    Other features of the Kotlin HashMap class include:


    +   - Boolean consistsKey(key: K): This function returns true if the Map contains
    the specified key.

    - Boolean containsValue(value: V): If the Map maps one or more keys to the supplied
    value, it returns true.

    - void clear(): It eliminates all Map elements.

    - remove(key: K): It deletes the provided key and associated value from the Map.'
