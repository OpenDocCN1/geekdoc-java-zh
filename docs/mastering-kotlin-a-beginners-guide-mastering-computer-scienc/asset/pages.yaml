  md: "# MENUS FOR ANDROID\n\nThe menu is an essential UI component in Android that\
    \ provides certain common functions throughout the application. The Menu allows\
    \ the user to have a smooth and consistent experience across the program.\n\n\
    To use a menu, we must define it in a separate XML file and then use that in our\
    \ program based on our needs. In addition, we can utilize menu APIs to represent\
    \ user actions and other options in our Android app activities.\n\n# How Can We\
    \ Define a Menu in an XML File?\n\nAndroid Studio provides a standard XML format\
    \ for kinds of menus to specify menu elements. Instead of writing code, we can\
    \ describe the menu and its items in an XML menu resource and load the menu resource\
    \ as a menu object in the activity or fragment used in our Android application.\n\
    \nTo define the menu, we need to create a new folder within our project directory\
    \ (res/menu) and add a new XML file with the following components.\n\nThe example\
    \ of defining a menu in an XML file (menu example.xml) is shown below:\n\n```\n\
    <xml version=\"1.0\" encoding=\"utf-8\"?>\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    >\n  <item android:id=\"@id/mail\"\n    android:icon=\"@drawable/ic_mail\"\n \
    \   android:title=\"@string/mail\" />\n  <item android:id=\"@id/upload\"\n   \
    \ android:icon=\"@drawable/ic_upload\"\n    android:title=\"@string/upload\"\n\
    \    android:showAsAction=\"ifRoom\" />\n  <item android:id=\"@id/share\"\n  \
    \  android:icon=\"@drawable/ic_share\"\n    android:title=\"@string/share\" />\n\
    </menu>\n```\n\n+   * <Menu>: The XML file's root element that helps define the\
    \ Menu and holds various items.\n* <item>: It is used to generate a single menu\
    \ item. It also has nested <Menu> elements to form a submenu."
