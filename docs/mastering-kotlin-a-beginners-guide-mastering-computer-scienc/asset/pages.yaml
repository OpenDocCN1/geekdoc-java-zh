    # ENUM CLASSES IN KOTLIN


    It is occasionally necessary for a type to contain just particular values in programming.
    The idea of enumeration was invented to do this. A named list of constants is
    an enumeration.


    An enum has its specialized type in Kotlin, as it does in many other programming
    languages, signifying that something has several possible values. Kotlin enums
    are classes, as opposed to Java enums.


    Some key facts to remember regarding enum classes in Kotlin:


    +   * Enum constants are more than just collections of constants; they contain
    attributes, methods, and so forth.

    * A comma denotes each enum constant function as a single class and instance.

    * Enums enhance code readability by assigning predefined names to constants.

    * Constructors cannot use to create an instance of the enum class.


    Enums are defined by using the "enum" keyword in front of a class, as seen below:


    ```

    enum class DAYS{

    MONDAY,

    TUESDAY,

    WEDNESDAY,

    THURSDAY,

    FRIDAY,

    SATURDAY,

    SUNDAY

    }

    ```'
