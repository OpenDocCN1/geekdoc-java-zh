  md: "# Mastering Kotlin: A Beginner's Guide\n\nPrivate Modifier\n\nPrivate modifiers\
    \ in Kotlin restrict access to code defined inside the same scope. It prevents\
    \ access to the modifier variable or function from being available outside of\
    \ the scope. Unlike Java, Kotlin enables several top-level declarations in the\
    \ same file – a private top-level element in the same file is accessible by everything\
    \ else in the same file.\n\n```\n// class C is accessible from the same source\
    \ file\nprivate class C {\n    private val int = 20\n    fun display() {\n   \
    \     // we can access int in the same class\n        println(int)\n        println(\"\
    Accessing int successful\")\n    }\n}\nfun main(args: Array<String>) {\n    var\
    \ c = C()\n    c.display()\n    // can not access 'int': it is private in class\
    \ C\n    println(c.int)\n}\n```\n\nIn this case, class C can only access from\
    \ within the same source file, and the int variable can only be accessed from\
    \ within same class C. When we attempted to access int from outside the class,\
    \ we met with a compile-time error.\n\nInternal Modifier\n\nThe internal modifier\
    \ is a newly introduced modifier in Kotlin that Java does not support. Internal\
    \ signifies that it will only be available in the same module; attempting to access\
    \ the declaration from another module will result in an error. A module is a collection\
    \ of files that have been built together.\n\n```\ninternal class C {\n}\npublic\
    \ class D {\n    internal val int = 20\n    internal fun display() {\n}\n}\n```"
