  md: "# COVARIANCE\n\nCovariance states that substituting subtypes is permissible\
    \ but not super-types, i.e., the generic function/class may accept subtypes of\
    \ the data type for which it is already defined, for example, a generic class\
    \ defined for Number can accept Int, while a generic class defined for Int cannot\
    \ accept Number. This may be implemented in Kotlin using the out keyword as seen\
    \ below:\n\n```\nfun main(args: Array<String>) {\n    val a: MyClass<Any> = MyClass<Int>()\n\
    \    // Error: Type mismatch\n    val b: MyClass<out Any> = MyClass<String>()\n\
    \    // Works since String is a subtype of Any\n    val c: MyClass<out String>\
    \ = MyClass<Any>()\n    // Error since Any is a supertype of String\n}\nclass\
    \ MyClass<D>\n```\n\nWe may immediately allow covariance by appending the out\
    \ keyword to the declaration site. The following code works perfectly.\n\n```\n\
    fun main(args: Array<String>) {\n    val b: MyClass<Any> = MyClass<String>()\n\
    \    // Compiles without error\n}\nclass MyClass<out D>\n```\n\n# CONTRAVARIANCE\n\
    \nIt is used to replace a supertype value in the subtypes, i.e., the generic function\
    \ or class may accept supertypes of the data type it is already defined. For example,\
    \ a generic class defined for Number cannot take Int, while a generic class defined\
    \ for Int may accept Number. In Kotlin, it is accomplished using the in keyword\
    \ as follows: \n\n```\nfun main(args: Array<String>) {\n    var x: Container<Dog>\
    \ = Container<Animal>()\n    //compiles without error\n    var y: Container<Animal>\
    \ = Container<Dog>()\n    //gives compilation error\n}\nopen class Animal\nclass\
    \ Dog : Animal()\nclass Container<in D>\n```"
