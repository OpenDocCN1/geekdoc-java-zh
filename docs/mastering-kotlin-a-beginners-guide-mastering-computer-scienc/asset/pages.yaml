  md: 'The variable name inherited from the base class as well as the “Derived class.”


    Inheritance Use


    Assume a corporation has three employees: a webDeveloper, an iOS-Developer, and
    an AndroidDeveloper. They all have certain characteristics in common, such as
    a name and an age and some unique abilities.


    First, we divide the individuals into three classes, and each class has certain
    common and specific skills.


    ![](img/c8fb61a877190d2274cca7a29bf19ca9_82_0.png)


    All three developers have the same name and age, but their programming skills
    are very different. We would be replicating the identical code for each character’s
    name and age in each class.


    If we wish to add a salary() function, we must duplicate the code in all three
    classes. This results in duplicate copies of code in our program, which will almost
    certainly result in more complicated and chaotic code.


    The work is made more accessible by employing inheritance. We may construct a
    new base class Employee that contains the features shared by the three original
    types. These three classes can inherit common characteristics from the base class
    and add their unique features. We can easily add the salary functionality to the
    Employee class without creating duplicates.'
