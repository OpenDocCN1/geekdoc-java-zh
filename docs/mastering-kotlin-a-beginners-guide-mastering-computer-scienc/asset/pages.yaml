  md: "# Object-Oriented Programming (OOP) Concepts ■ 91\n\n# KOTLIN GENERICS\n\n\
    Generics are useful features that enable us to build classes, methods, and properties\
    \ that are accessible using various data types while maintaining compile-time\
    \ type safety.\n\nCreating parameterized classes: A generic type is a type-parameterized\
    \ class or function. We always use angle brackets () to define the parameter in\
    \ the program.\n\nThe following is the definition of the generic class:\n\n```\n\
    class myClass<D>(text: D) {\n  var name = text\n}\n```\n\nTo build an instance\
    \ of such a class, we must provide the following type arguments:\n\n```\nval my\
    \ : myClass<String> = MyClass<String>\n(\"Hubtutors\")\n```\n\nIf the parameters\
    \ can deduce from the constructor arguments, the type arguments can be omitted:\n\
    \n```\nval my = myClass(\"Hubtutors\")\n```\n\nBecause Hubtutors has the type\
    \ String, the compiler figures out that we are discussing myclass<String>.\n\n\
    # Advantages of generic:\n\n+   - Avoiding typecasting: There is no need to typecast\
    \ the object.\n- Type safety: Generic permits just a single type of object at\
