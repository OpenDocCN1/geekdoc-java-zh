  md: "Arrays and Strings, Functions, and Java Interoperability ■ 183\n\n# TAIL RECURSION\
    \ IN KOTLIN\n\nIn a traditional recursion call, we perform our recursive call\
    \ first, then take the recursive call's return value and compute the result. In\
    \ tail recursion, however, the computation is performed first, followed by the\
    \ recursive call, with the results of the current step being sent to the next\
    \ recursive call. In the end, both recursion and tail recursion send the same\
    \ result.\n\nThe must-follow rule for tail recursion is that the recursive call\
    \ should be the method's final call.\n\nBenefits of Employing Tail Recursion\n\
    \n+   In tail recursion, the function is the last item done by the function, and\
    \ there is nothing left to run in the current function. As a result, there is\
    \ no need to save the current function in stack memory, and the compiler can reuse\
    \ that stack space for the next recursive call.\nStackOverflowError does not occur\
    \ during program execution in tail recursion.\n\nFirst Example: Using tail-recursion,\
    \ calculate the factorial of a number\n\n```\n// program of factorial using tail-recursion\n\
    fun Fact(num: Int, x:Int):Long{\n    return if (num==1) // terminate-condition\n\
    \        x.toLong()\n    else\n        Fact(num-1,x*num) //tail-recursion\n}\n\
    fun main() {\n    var n = 1\n    var result = Fact(5,n)\n    println(\"The Factorial\
    \ of 5 is: $result\")\n}\n```\n\nSecond Example: Using tail-recursion, calculate\
    \ the sum of an array's elements\n\n```\n// two parameters passed an array and\
    \ the size of an array\n```"
