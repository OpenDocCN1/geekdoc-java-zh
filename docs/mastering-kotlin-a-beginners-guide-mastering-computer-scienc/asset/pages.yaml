    \ implement the comparable interface to compare two instances of a type. However,\
    \ since they must be compared automatically in ordering instances, and because\
    \ the order might vary depending on numerous criteria, Kotlin offers a basic comparator\
    \ interface. This interface compares and organizes two items of the same type.\n\
    \n# Function\n\n**compare**: This function compares two instances of the same\
    \ type and returns zero if they are equal, a negative integer if the second instance\
    \ is larger, and a positive number otherwise.\n\n```\nabstract fun compare(x:\
    \ T, y: T) : Int\n```\n\n# Functions of Extension\n\n**reversed**: This function\
    \ accepts a comparator as an input and returns the comparator with the same ordering\
    \ as the passed comparator.\n\n```\nfun <D> Comparator<D>. reversed(): Comparator<D>\n\
    ```\n\n**then**: This function combines two comparator, and the second one is\
    \ utilized only when the values in the first comparator are equal.\n\n```\ninfix\
    \ fun <D> Comparator<D>.\nthen(\n    comparator: Comparator<in D>\n): Comparator<D>\n\
    ```\n\n**As an example**, consider the compare, then, and reversed functions:\n\
    \n```\nclass Names(val firstNames: String,val lastNames: String){\n    override\
