  md: "# Object-Oriented Programming (OOP) Concepts ■ 95\n\n# TYPE PROJECTIONS\n\n\
    It is feasible to copy all the members of an array of some type into an array\
    \ of Any type, but for the compiler to compile our code, we must annotate the\
    \ input argument with the out keyword. As a result, the compiler concludes that\
    \ the input argument can be a subtype of the Any type.\n\nKotlin program for copying\
    \ array elements into another:\n\n```\nfun copy(from: Array-out Any>, to: Array<Any>)\
    \ {\n    assert(from.size == to.size)\n    // copying (array) to (to) array\n\
    \    for (c in from.indices) \n        to[c] = from[c]\n    // printing elements\
    \ of array in which copied\n    for (c in to.indices) {\n        println(to[c])\n\
    \    }\n}\n\nfun main(args :Array<String>) {\n    val ints: Array<Int> = arrayOf(1,\
    \ 2, 3, 4)\n    val any :Array<Any> = Array<Any>(4) { \"\" }\n    copy(ints, any)\n\
    }\n```\n\nWhen we don't know sort of value we're looking for and merely to print\
    \ all the items of our array, we use the star(*) projection.\n\nProgram of using\
    \ star projections in Kotlin:\n\n```\n// star projection in array\nfun printArray(array:\
    \ Array<*>) {\n    array.forEach { print(it) }\n}\n\nfun main(args :Array<String>)\
    \ {\n    val name = arrayOf(\"Good\",\"for\",\"Good\")\n    printArray(name)\n\
    }\n```\n\n# CONCLUSION\n\nThis chapter covered OOP's concept, where we learned\
    \ class and object, nested class, constructors, and inheritances. We also covered\
    \ interfaces, abstract class, and Generic Type in Kotlin."
