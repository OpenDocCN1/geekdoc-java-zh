  md: '# Getting Started ■ 21


    println(roll-no)

    println(name)


    Above is the local variable roll-no, whose value is 54 and whose type is Integer
    because the literal type is int, and another variable, name, whose type is String.


    Variables in Kotlin are declared using one of two kinds:


    +   - Immutable using val keyword

    - Mutable using var keyword


    Immutable Using Val Keyword

    Immutable variables are sometimes known as read-only variables. As a result, we
    cannot alter the variable''s value specified by the val keyword.


    ```

    val myName = "Gautam" // compile-time error

    myName = "Preeniti"

    // It gives an error

    ```


    Because it can be initialized with the value of a variable, an immutable variable
    is not a constant. It implies that the value of an immutable variable does not
    have to be known at compile-time, and if it is defined within a construct it can
    take on a new value with each function call.


    ```

    var myBirthDate = "01/11/1996"

    val myBirthDate = myBirthDate

    println(myBirthDate)

    ```


    We can alter the value of a variable in a Mutable variable:


    ```

    var myAge = 26 // compiles successfully

    myAge = 27

    println("My new age is ${myAge}")

    ```


    # Variable Scope


    A variable exists just within the codeblock({...}) where it was defined. Outside
    of the loop, we cannot access the variable. The same variable can declare inside
    the nested loop - for example, if a function has an argument x and we create a
    new variable x inside the same loop, the variable x inside the loop is different
    from the argument.'
