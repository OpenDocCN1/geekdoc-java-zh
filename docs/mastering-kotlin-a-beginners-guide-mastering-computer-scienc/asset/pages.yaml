    |

    | android:fromAlpha | It is the initial alpha value for the animation, where 1.0
    indicates entirely opaque, and 0.0 implies fully transparent. |

    | android:toAlpha | It is the final alpha value. |

    | android:id | Sets the view''s unique id. |

    | android:fromYDelta | The Y coordinate modification will be applied at the start
    of the animation. |

    | android:toYDelta | The Y coordinate modification will be applied at the conclusion
    of the animation. |


