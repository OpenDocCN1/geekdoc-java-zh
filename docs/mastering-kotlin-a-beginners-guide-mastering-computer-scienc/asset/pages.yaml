  md: "# Mastering Kotlin: A Beginner’s Guide\n\n+   - <group>: It is optional and\
    \ unnoticed for item> elements to classify menu items so that they can share features\
    \ such as active status and visibility.\n\nactivity_main.xml: If we wish to include\
    \ a submenu in a menu item, must consist of a <menu> element as child of item.\n\
    \nThe following is an example of defining a submenu in a menu item:\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"utf-8\"?>\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    >\n  <item android:id=\"@id/file\"\n      android:title=\"@string/file\">\n  \
    \  <!-- submenu -->\n    <menu>\n      <item android:id=\"@id/create_new\"\n \
    \         android:title=\"@string/create_new\" />\n      <item android:id=\"@id/open\"\
    \n          android:title=\"@string/open\" />\n    </menu>\n  </item>\n</menu>\n\
    ```\n\nDifferent Sorts of Menus in Android\n\nThere are three types of menus accessible\
    \ in Android for defining a collection of options and actions in our android applications.\n\
    \nThe Android application’s menus are as follows:\n\n+   - Android Options Menu:\
    \ In an Android application, a menu is a primary collection of menu items that\
    \ is important for activities that have a worldwide impact on the searching application.\n\
    \n+   - Android Context Menu: Android Context Menu is a floating menu that shows\
    \ only when the user clicks on an element for an extended period of time. It is\
    \ ideal for components that affect the chosen content or context frame.\n\n+ \
    \  - Android Popup Menu: The Android Popup Menu shows a list of items in a vertical\
    \ list to the view that activated the Menu and is handy for providing an overflow\
    \ of actions connected to specific content."
