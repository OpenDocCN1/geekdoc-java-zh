  md: '# TYPE CONVERSION IN KOTLIN


    Type conversion (also known as type casting) converts the entity of one data type
    variable into another data type variable.


    As we all know, Java provides implicit type conversion from smaller to bigger
    data types. Long data type can be allocated an integer value.


    As an example:


    ```

    var myNumber = 110

    var myLong: Long = myNumber

    ```


    However, implicit type conversion is not supported in Kotlin. An integer data
    type cannot be allocated an integer value.


    ```

    var myNumber = 110

    var myLong: Long = myNumber // Compiler error

    // Mismatch in type: the inferred type is Int,

    alough Long was anticipated.

    ```


    In Kotlin, a helper function can be used to convert one data type to another explicitly.


    # Example:


    ```

    var myNumber = 110

    var myLong: Long = myNumber.toLong()

    ```


    To convert one data type to another, use the following helper function:


    +   * toShort()

    * toByte()

    * toInt()

    * toFloat()

    * toLong()

    * toChar()

    * toDouble()'
