    \ at utilizing a break expression to leave a loop. When the break statement is\
    \ encountered in a program, it returns to the nearest enclosing loop.\n\n**In\
    \ Kotlin, there are two sorts of break expressions:** As we all know, unlabeled\
    \ break is used to terminate the nearest enclosing loop when a given condition\
    \ is met.\n\nHowever, a labeled break returns to a desired loop when a given condition\
    \ is met. It is possible to accomplish this with the use of labels. Label is an\
    \ identifier followed by a @ sign, such as inner@, outer@, first@, second@, and\
    \ so on. Label can use any expression, but it must be written in front of it.\n\
    \nWe’ll see how to employ labeled break expressions in while, do-while, and for\
    \ loops.\n\n# Use of Labeled Break in a While Loop\n\nWhen a certain condition\
    \ is met, a labeled break is used to leave the target block without verifying\
    \ the condition in the while loop. The control is then passed to the next statement\
