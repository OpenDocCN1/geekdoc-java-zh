  md: "# Object-Oriented Programming (OOP) Concepts ■ 93\n\nThe out Keyword\nWe may\
    \ utilize the out keyword on the generic type in Kotlin to assign this reference\
    \ to any of its supertypes. The out value can only be created by the specified\
    \ class and cannot be consumed:\n\n```\nclass OutClass<out D>(val value: D) {\n\
    \    fun get(): D {\n        return value\n    }\n}\n```\n\nWe defined an OutClass\
    \ class above that can return a value of type T. Then, for the reference that\
    \ is a supertype of it, we may allocate an instance of the OutClass:\n\n```\n\
    val out = OutClass(\"string\")\nval ref: OutClass<Any> = out\n```\n\n**Note:**\
    \ If we did not utilize the out type in the preceding class, the next statement\
    \ will result in a compiler error.\n\n# The in Keyword\n\n```\nclass InClass<in\
    \ D> {\n    fun toString(value: D): String {\n        return value.toString()\n\
    \    }\n}\n```\n\nIn this case, we've declared a toString() method that exclusively\
    \ accepts D values. Then we may allocate a reference of type Number to its subtype\
    \ - Int:\n\n```\nval inClassObject: InClass<Number> = InClass()\nval ref<Int>\
    \ = inClassObject\n```\n\n**Note:** If we did not utilize the in type in the preceding\
    \ class, the following sentence would result in a compiler error."
