  md: "# Object-Oriented Programming (OOP) Concepts ■ 55\n\nIn Kotlin, there are four\
    \ visibility modifiers:\n\n| Modifier | Description |\n|---|---|\n Public | Visible\
    \ everywhere |\n Private | Visible inside the same class only |\n Internal | Visible\
    \ inside the same module |\n Protected | Visible inside the same class and its\
    \ subclasses |\n\nIf no modifier is supplied, it is public by default. Let’s go\
    \ through the modifiers one by one by.\n\n# Public Modifier\n\nThe default modifier\
    \ in Kotlin is public. It is the most often used modifier in the language, and\
    \ there are extra limits on who may view the part being modified. Unlike Java,\
    \ there is no need to define anything as public in Kotlin – if no modifier is\
    \ declared – works the same in Kotlin as it does in Java. When the public modifier\
    \ is applied to top-level items – classes, methods, or variables defined directly\
    \ within a package – any other code can access them. If the public modifier is\
    \ applied to a nested element – an inner class or function within a class – then\
    \ any code that can access the container may also access this element.\n\n```\n\
    // by default public\nclass C {\n    var int = 20\n}\n\n// specified with public\
    \ modifier\npublic class D {\n    var int2 = 30\n    fun display() {\n       \
    \ println(\"Accessible everywhere\")\n    }\n}\n```\n\nClasses C and D are available\
    \ from anywhere in the code, and the variables int and int2 and the method display()\
    \ are accessible from everything that can access classes C and D."
