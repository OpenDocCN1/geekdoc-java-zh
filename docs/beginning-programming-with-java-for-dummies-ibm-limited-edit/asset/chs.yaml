  \n### 示例程序\n\n列表 13-1 包含一个键盘/屏幕程序。程序将单价乘以数量以获得总价。代码的运行如图 13-3 所示。\n\n![9781118407813-fg1303.tif](img/9781118407813-fg1303_fmt.png)\n\
  \n图 13-3：使用键盘和屏幕。\n\n\n\n\n要使用列表 [13-3]，请为你的类取一个名称。将该名称插入第一个空白处。在第二个空格（引号之间）输入输入文件的名称。然后，要从输入文件中读取一个整数，请调用\
