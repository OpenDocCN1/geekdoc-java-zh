  \n当你用双等号比较两个事物时，引用类型和基本类型的行为是不相同的。例如 `int` 和 `String`：\n\n* 你可以使用双等号比较两个 `int` 值。这样做时，结果如你预期。例如，以下代码中的条件为真：\n\
