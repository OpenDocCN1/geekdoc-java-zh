  \ && fahrenheit <= 69.8 + 0.1` 这样的条件来判断 `fahrenheit` 是否在 69.8 的 0.01 范围内。欲了解更多关于包含\
  \ `&&` 运算符的条件，请参阅第 10 章。\n\n### 比较字符\n\n表 8 中的比较运算符对字符同样有效。简单来说，运算符 `<` 意味着“在字母表中靠前”。但你必须注意以下几点：\n\
  \n*   因为 B 在字母表中于 H 之前，所以条件 `'B' < 'H'` 为 true。这并不意外。\n*   因为 b 在字母表中于 h 之前，所以条件\
  \ `'b' < 'h'` 为 true。这也不意外。\n*   每个大写字母都在任何小写字母之前，所以条件 `'b' < 'H'` 为 false。这个就很意外了（见图\
  \ 8-14）。\n\n![9781118407813-fg0814.tif](img/9781118407813-fg0814_fmt.png)\n\n图 8-14：字母的顺序。\n\
  \n在实践中，你很少理由比较一个字母另一个字母。但在第 18 章 中，你可以学习 Java 的 `String` 类型。通过 `String` 类型，你可以比较单词、名字和其他精彩内容。到那时，你必须仔细考虑字母顺序，图\
  \ 8-14 中的想法将派上用。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 在底层，字母 A 到\
  \ Z 以数字代码 65 到 90 存储。字母 a 到 z 以代码 97 到 122 存储。这就是为什么每个大写字母都“小于”任何小写字母。\n\n\n\n\n\
