  \n当你比较两个数字是否相等（使用 `==`）或不相等（使用 `!=`）时，要小心。当你处理 Java 的 `double` 类型或 `float` 类型时，微小的误差可能会渗透到任何地方。几个小误差累积就会变成巨大的误差。当你比较两个\
