  \ 的朋友们称这个版本“Java 8”。）\n\n### 在 Linux 上\n\n要在 Linux 电脑上检查 Java 安装情况（或未安装 Java），请执行以下操作：\n\
  \n1. **在桌面菜单中寻找名为 `Terminal` 的项（也称为 `Konsole`）。**\n\n   打开 `Terminal` 窗口（通常是 `Konsole`）。\n\
