  \ 程序是如何工作的\n\n当你还是一个婴儿躺在母亲怀里时，她告诉你如何从计算机获取字符。有很多方法可以实现，但我在本章推荐的方法是\n\nSystem.nextLine()`\n\
  \n现在，有趣的部分来了。调用 `nextLine()` 方法不仅仅是从键盘提取字符。为了理解这一点，请看列表 5-1 中的语句：\n\n```\nSystem.out.println(nextLine());\n\
  ```\n\n当你运行程序时，计算机看到了你对 `nextLine()` 的调用并停滞了。。（参见图 5-3））计算机等待你输入一行文本。于是你输入这一行：\n\
  \nHey, there's an echo in here.\n\n计算机用这一整行替换了程序中的 `nextLine()` 调用。这一过程在图 5-5 中所示。\n\
  \n`nextLine()` 调用嵌套在 `System.out.println()` 调用内部。因此，当一切完成后，计算机的行为就像列表 5-1 中的语句看起来如下：\n\
  \n```\nSystem.out.println(\"Hey, there's an echo in here.\");\n```\n\n计算机在屏幕上显示了另一个文本\
  \ Hey, there's an echo in here. 的副本。\n\n\n\n\n在示例 5-1 中，`keyboard.nextLine()` 方法从键盘获取整行文本。所以如果你输入\n\
  \n```\nTesting 1 2 3\n```\n\n示例 5-1 中的程序会回显 `Testing 1 2 3`。\n\n有时候你并不希望程序获取整行文本，而是希望程序获取行的一部分。例如，当你输入\
  \ `1 2 3` 时，你可能希望计算机获取 `1`（可能 `1` 代表某一个数字）。在这种情况下，你不要在程序中使用 `keyboard.nextLine()`，而是使用\
  \ `keyboard.nextInt()`。\n\n表 5-1](#10_978111840713-ch05.xhtml_table-1) 显示了 `Scanner`\
  \ 的几种变体。遗憾的是，表中的内容并不规律。要读取一行，你调用 `nextLine`。但要读取一个单词，你并不调用 `nextWord`（Java API 没有\
  \ `nextWord` 方法）。相反，要读取一个单词，你调用 `next`。\n\n表 5-1 Scanner 方法\n\n| 读取什么… | 调用此方法 |\n\
  | :--- | :--- |\n| 不带小数点的数字 | `nextInt()` |\n| 带有小数点的数字 | `nextDouble()` |\n| 一个单词（例如以空格结尾）\
  \ | `next()` |\n| 一行（在你已经读取了某些数据后剩余的部分） | `nextLine()` |\n| 单个字符（如字母、数字或标点符号） |\
  \ `charAt(0)` |\n\n此外，表还有一个意外的结尾。要读取单个字符，你并不调用 `nextSomething`，而是可以调用奇特的 `charAt(0)`\
  \ 方法组合。（你可能得原谅创建 `Scanner` 类的人，他们是从一个特殊的角度创建它的。）\n\n为了查看表中方法的实际运行效果，请检查书中的其他程序示例。第\
  \ 6 章、第 7 章 和第 8 章 有一些非常棒的例子。\n\n### 输入三行代码，不要回头\n\n在示例 5-1 内部静静地埋着三行额外的代码。这些代码帮助计算机从键盘读取输入。这三行代码是：\n\
  \n```java\nimport java.util.Scanner;\n\n    Scanner keyboard = new Scanner(System.in);\n\
  \    keyboard.close();\n```\n\n关于这三行代码，有一个坏消息和一个好消息。\n\n*   **坏消息是，这些代码背后的原理很难理解。**\
  \ 在第 5 章 中尤其如此，在这里我介绍了 Java 最基础的概念。\n*   **好消息是，你不需要理解这三行代码背后的原理。** 你可以将这些代码复制并粘贴到任何从键盘获取输入的程序中。你不需要以任何方式更改这些行。这些代码在各种\
  \ Java 程序中无需修改即可工作。\n\n只需确保将这些代码放在正确的位置：\n\n*   将 `import java.util.Scanner` 行作为程序的第一行。\n\
  *   将 `Scanner keyboard = new Scanner(System.in)` 行放在 `main` 方法中，紧接 `public static\
  \ void main(String args[]) {` 行之后。\n*   将 `keyboard.close()` 行作为程序的最后一行。\n\n在未来的某个时刻，你可能需要更注意这三行代码的位置。但目前，我提供的规则将对你有帮助。\n\
  \n### 预料意外\n\n不久前，我遇到一位很有有趣的讲师。他说：“有时当我授课时，我会在计算机上从零编写一个程序。我当着学生的面这样做。如果程序第一次尝试就编译并正确运行，我希望学生能给我热烈的掌声。”\n\
  \n起初，你可能觉得这个人自负极大，但你必须客观看待问题。程序第一次就能编译并正确运行是不常的。几乎总是拼写错误或其他类型的错误。\n\n因此，本节处理当你第一次编译和运行程序时看到的正常的、预料之中的错误。每个人都会犯这些错误，即使是经验最丰富的旅行者也是。关键是保持冷静。以下是我的通用建议：\n\
  \n*   **不要期望你输入的程序第一次就能编译。** 准备好返回编辑器并修复一些错误。\n*   **不要期望你输入的程序第一次就能运行。** 即使没有错误，你的程序也可能有缺陷。\n\
  *   **不要期望你的程序第一次就能运行。** 即使没有错误，你的程序也可能有缺陷。\n*   **不要认为只有你一个人很慢。** 如果你慢，请问问别人。\n\
  *   **不要胆怯。** 如果你不明白为什么，请问问。在论坛上发帖。\n\n### 诊断问题\n\n本章前面的“输入和运行程序”部分告诉了如何运行。如果一切顺利，你的屏幕将像图\
  \ 5-1 那样。但事情并不总是顺利。有时你的手指滑滑，在程序中输入了拼写错误。有时你忽略了某个细节，结果就得到了一个糟糕的信息。\n\n当然，示例 5-1 中的某些内容是可以修改的。并不是示例\
  \ 5-1 中的每一个字都是一字成型的。所以这里有一个棘手的问题——我不能告诉你必须完全按照所示的样子重打示例。某些更改是可以的，另一些不行。请继续阅读某些“实例”。\n\
  \n#### 大小敏感\n\nJava 是*大小写敏感*的。除此之外，大小敏感意味着在 Java 程序中，字母 `P` 和字母 `p` 是不一样的。如果你给我写封粉丝信，开头写的是“Dear\
  \ barry”而不是“Dear Barry”，我仍然知道你的意思。但 Java 的工作方式不是这样的。\n\n所以，在 Java 程序中只改一个字符，得到的就不是风顺的编译，而是一个大头疼！像这样将\
  \ `p` 改为 `P`：\n\n```java\n// 下行是错误的\nSystem.out.Println(keyboard.nextLine());\n\
  ```\n\n当你在 Eclipse 编辑器中输入程序时，你会得到图 5-6 所示的丑陋。\n\n\n\n图 5-6：Java 编译器理解 `println`，但不理解\
  \ `Println`。\n\n当你看到错误标记和快速修复（如图 5-6 所示的那样）时，最好的办法是保持冷静并仔细阅读信息。有时候，这些信息包含有用的提示。（当然，有时候它们并不包含。）图\
  \ 5-6 中的信息是 `The method Println(String) is undefined for the type PrintStream.`。用通俗易懂的话来说就是：“Java\
  \ 编译器无法解释 `Println` 这个词。”（这条信息并没有直接说：“别输入 `Println` 这个词，你这个大笨蛋！”）无论如何，如果电脑说你是我们这些笨蛋中的一个，你应该把它看作一种赞美。）现在，有很多理由导致编译器无法理解像\
  \ `Println` 这样的单词。但对于初级程序员来说，你应该立即检查两个重要的点：\n\n- **你的单词拼写正确吗？**\n  你是否不小心输入了 `printlin`（数字\
  \ 1）而不是 `println`？\n\n- **所有字母的大小写正确吗？**\n  你是否错误地输入了 `Println` 或 `PrintLn` 而不是\
  \ `println`？\n\n这两个错误任何一个都可能让 Java 编译器陷入混乱。因此，请将你的输入内容与认可的单词逐字地（以及逐字母地）进行对比。当你发现差异时，回到编辑器并修复问题。然后再次尝试编译程序。\n\
  \n![tip.eps](img/tip_fmt.png) 当你在 Eclipse 编辑器中输入程序时，Eclipse 会尝试编译该程序。当 Eclipse 发现编译时错误时，编辑器通常会显示至少三个红色错误标记（参见图\
  \ 5-6）。编辑器左侧边缘的标记有一个像 X 的符号，有时带有一个小灯泡。右侧边缘的标记是一个小矩形。中间的标记是一条红色的波浪线。\n\n如果你将鼠标悬停在这些标记的任何一个上，Eclipse\
  \ 会显示一条试图描述错误性质的消息。如果你悬停在波浪线上，Eclipse 会显示一条消息并可能给出一个建议的解决方案列表。（每个建议的解决方案被称为*快速修复*。）如果你右键点击左侧边缘的标记（或在\
  \ Mac 上按控制键点击）并在弹出的上下文菜单中选择 `Quick Fix`，Eclipse 会显示建议的解决方案。要让 Eclipse 自动修改你的代码（使用快速修复列表中的建议），请单击或双击快速修复列表中的项目。（也就是说，单击任何看起来像链接的内容；双击任何看起来不像链接的内容。）\n\
  \n### 遗漏标点符号\n\n在英语和 Java 中（使用正确的！标点符号是非常重要的）\n\n以代码列表 5-1 中的分号 为例。如果你忘记输入分号，会发生什么？\n\
  \n```java\n// 以下代码是错误的：\nSystem.out.println(keyboard.nextLine())\n}\n```\n\n如果你漏掉了分号，你就会看到图\
  \ 5-7 所示的消息。\n\n![9781118407813-fg0507.tif](img/9781118407813-fg0507_fmt.png)\n\n\
  图 5-7：有用的错误信息。\n\n像图 5-8 这样的消息会让你的生活变得简单得多。我不需要解释这条信息，你也不需要苦结信息的意思。直接按照 `insert\
  \ \";\" to complete Statement` 的字面意思操作。在 `System.out.println(keyboard.nextLine())`\
  \ 语句的结尾与随后的任何代码之间插入分号。（为了让代码更易阅读和理解，将分号加在 `System.out.println(keyboard.nextLine())`\
  \ 语句的末尾。）\n\n![9781118407813-fg0508.tif](img/9781118407813-fg0508_fmt.png)\n\n图\
  \ 5-8：一个多余的分号搞乱了一切。\n\n### 使用过多的标点符号\n\n初中，我的英语老师说，每当我通常需要停顿呼吸时，就应该使用逗号。这个建议在过敏季节效果并不好，因为那时我句子里的逗号比单词还多。即使作为一名有薪水的作者，我在决定逗号该放在哪里时也很困难，所以我经常为了保险起见而多加几个逗号。这给我的文字编辑\
  \ Melba 增加了更多工作，她办公室桌旁的垃圾桶里装满了逗号。\n\n在 Java 程序中也是一样。你可以沉溺于标点符号中。例如，考虑代码列表 5-1 中的\
  \ `main` 方法头。这一行代码对于新手程序员来说是一个危险的弯路。\n\n关于*方法头*和*方法体*的信息，请参阅第 4 章。通常情况下，你不应该用分号结束方法头。但人们还是会加上分号。\n\
  \n```java\n// 以下代码是错误的：\npublic static void main(String args);\n```\n\n如果你在列表 5-1\
  \ 中添加了这个分号，你就会得到图 5-7 所示的消息。\n\n图 5-8 中的信息有点困惑。当电脑尝试编译 `public static void main(String\
  \ args)` 时，它很困惑。\n\n![9781118407813-fg0509.tif](img/9781118407813-fg0509_fmt.png)\n\
  \n图 5-9：电脑在想什么？\n\n如果你选择 Add Body 修复，Eclipse 会创建以下代码：\n\n```java\nimport java.util.Scanner;\n\
  \nclass EchoLine {\n    public static void main(String args) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        System.out.println(keyboard.nextLine());\n\
  \        keyboard.close();\n    }\n}\n```\n\n这段“修复”代码没有编译错误。但当你运行这段代码时，什么也没有发生。\n\
  \n我们都知道电脑是非常耐心且富有同情的机器。这就是为什么电脑会查看你的代码并给你最后一次。电脑记得 Java 有一种高级功能，可以在不写方法体的情况下写方法头。这样做，你就会得到所谓的*抽象方法*——这是我在书中完全没有用到的东西。总之，在图\
  \ 5-9 中，电脑看到了一个没有体的方法。所以它对自己说：“我知道了！也许程序员想写一个抽象方法。问题是，抽象方法头必须包含 abstract 这个词。我应该提醒一下程序员。”于是电脑提供了图\
  \ 5-9 中的添加 'abstract' 修饰符修复。\n\n无论如何，如果你不读懂言外之意，就无法理解图 5-9 中的信息和快速修复。因此，这里有一些可以帮助你破解晦涩信息的技巧：\n\
  \n- **避免条件反应。**\n  有些人看到图 5-9 中的添加 'abstract' 修饰符修复时，会想该在哪里添加修饰符。\n\n- **盯着坏代码行看好久。**\n\
  \n\n\n\n如果你仔细观察图 5-9 中的 `public static . . .` 一行，你最终会发现它与代码列表 5-1 中的对应行不同。代码列表 5-1\
  \ 中的行没有分号，但图 5-9 中的行有一个。\n\n当然，你并不总是从像代码列表 5-1 中那样的预写代码开始的。这正是熟能生巧的地方。你写的代码越多，你的眼睛对多余的分号和其他编程错误就会变得越敏感。\n\
  \n### 大括号太多\n\n你正在寻找最近的加油站，所以你问了一个当地人。“在第一个红绿灯处左转，”当地人说。你直直走了几个街，看到一个闪烁的黄色信号。你在信号处左转，行驶了一英里左右。什么？没有加油站？也许你把闪烁的信号误认为是真正的红绿灯。\n\
  \n你来到一个分路口，对自己说：“指示里没提到分路口。我该往哪边走？”你向右偏转，但一分钟后，你被迫上了高速。你看到一个写着“下一个出口 24 英里”的标志牌。现在你真的迷路了，油表指向“S”。（“S”代表“搁\
  \ anded”。）\n\n所以事情是这样的：你犯了一个诚实的错误。你不应该在黄色闪烁的灯处左转。单单那个错误并不糟糕。但第一个错误导致了更多的困惑，最终，你的选择完全没有意义。如果你没有在闪烁的灯处转弯，你就永远不会遇到那个该死的分路口。然后上高速完全是一场灾难。\n\
  \n这个故事有什么意义吗？当然有。计算机也会陷入同样的困境。计算机注意到了你程序中的一个错误。然后，比喻地说，计算机到了一个分路口——一个基于原始错误的分路口——一个没有任何替代方案能导致良好结果的分路口。\n\
  \n这是一个例子。你正在重新输入代码列表 5-1 中的代码，你不多打了一个大括号：\n\n```java\n//The following code is incorrect:\n\
  import java.util.Scanner;\n\nclass EchoLine {\n\n    public static void main(String\
  \ args[]) {\n        Scanner keyboard = new Scanner(System.in);\n    }\n       \
  \ System.out.println(keyboard.nextLine());\n        keyboard.close();    \n    }\n\
  }\n```\n\n在 Eclipse 的编辑器中，你悬停在最左侧的标记上。你看到了图 5-10 中显示的消息。\n\n![9781118407813-fg0510.tif](img/9781118407813-fg0510_fmt.png)\n\
  \n图 5-10：三个错误消息。\n\nEclipse 困惑了，因为 `System.out.println` 的调用完全位置不对。Eclipse 显示了三条消息——关于\
  \ `println` 的、关于括号的，以及一个关于构造位置不当的非常晦涩的消息。这些消息都没有解决问题的根源。Eclipse 试图在糟糕的局面中尽力而为，但在此时，你不应该相信\
  \ Eclipse 说的任何话。\n\n计算机不是聪明的动物，如果有人程序让 Eclipse 说“misplaced construct(s)（构造位置错误）”，Eclipse\
  \ 就真的这么说。（有些人说计算机让他们觉得自己很愚蠢。对我来说，恰恰相反。计算机提醒了我机器可以有多愚蠢，而人可以有多聪明。我喜欢这一点。）\n\n所以当你看到一堆错误消息时，仔细阅读每条错误消息。问问自己能从每条消息中学习到什么。但不要把每条消息都视为权威真理。当你耗尽了研究\
  \ Eclipse 消息的精力后，回到仔细观察代码上上。\n\n![remember.eps](img/remember_fmt.png) 如果你得到多个错误消息，始终仔细查看这组消息中的每一条。有时，一条非常有用的消息隐藏在一堆不怎么有用的消息之中。\n\
  \n### 单词拼写错误（以及其他错误）\n\n你找到了一份祖传的魔鬼蛋食谱（我最喜欢的菜之一）。你尽可能仔细地遵循每一个步骤，但因为你奶奶的高血压，你漏掉了盐。你递给你奶奶一个鸡蛋（我最喜欢的菜之一）。\n\
  \n（注：提供的文本包含大量重复句子，我根据指令处理了核心叙事并去除了冗余格式，专注于所提供解释的逻辑流。）\n\n\n\n到本章为止，我描述了在编译程序时会出现的错误。另一类错误则直到你运行程序时才会显现。一个典型的例子就是\
  \ `main` 单词拼写错误或大小写不当。\n\n假设在一次心血来潮中，你错误地将 `main` 写成了大写的 `Main`：\n\n```java\n//The\
  \ following line is incorrect:\npublic static void Main(String args[]) {\n```\n\n\
  当你输入代码时，一切看起来都很正常。你没有看到任何错误标记。\n\n但随后当你尝试运行程序时，这时情况开始变得糟糕了。这场灾难在图 5-13 中所示。\n\n\
  ![9781118407813-fg0513.tif](img/9781118407813-fg0513_fmt.png)\n\n图 5-13：你说的“在 EchoLine\
  \ 类未找到 Main 方法”是什么意思？\n\n当然，你的程序里确实有一个名为 `Main` 的东西，但它有一个名为 `main` 的东西吗？（是的，我听说过一位名叫\
  \ e. e. cummings 的著名诗人，但 E. E. Cummings 到底是谁？）计算机并不会假设你写的单词 `Main` 与预期的单词 `main`\
  \ 是一个意思。你需要将 `Main` 改回 `main`。这样一切都会正常。\n\n但在在此期间（或者在“主时间”里），这种不当的大小写是如何逃过编译器的？为什么你在编译程序时没有收到错误信息？如果一个大写的\
  \ `M` 没有惊扰编译器，为什么这个大写的 `M` 在运行时却搞乱了一切呢？\n\n答案在于 Java 编程语言中不同类型的单词。正如我在第 4 章中所说的，Java\
  \ 有标识符和关键字。\n\nJava 中的关键字是板上钉钉。如果你将 `class` 改为 `Class` 或将 `public` 改为 `Public`，你就得到了一个新东西——一个计算机可能无法理解的东西。这就是为什么编译器会对不当的关键字大小写感到卡壳。确保所有关键字都被正确使用是编译器的职责。\n\
  \n另一方面，标识符可以到处变动。确实，有一个名为 `main` 的标识符，但你可以发明一个名为 `Main` 的新标识符。（不过你不应该这样做。对于那些知道\
  \ Java 中 `main` 单词通常含义的人来说，这太让人困惑了。）当编译器看到一行写错的代码时，例如 `public static void Main`，编译器只会认为你正在创建一个全新的名称。因此，编译器允许这行代码通过。你不会从你的老朋友——编译器那里那里得到任何抱怨。\n\
  \n但是，当你尝试运行代码时，计算机就发疯了。Java 虚拟机（JVM）运行你的代码。（详情请参阅第 1 章）。JVM 需要找到一个开始执行代码中语句的地方，因此\
  \ JVM 会寻找一个名为 `main`（小写 m）的起点。如果 JVM 没有看到任何名为 `main` 的东西，它就会生气。JVM 说：“在 EchoLine\
  \ 类未找到 Main 方法”。因此，在运行时，是 JVM 而不是编译器给了你一个错误信息。\n\n![tip.eps](img/tip_fmt.png) 一个更好的错误信息应该是\
  \ `EchoLine 类中未找到 main 方法`，其中 `main` 是小写字母 `m`。在这里或那里，创建错误信息的人会忽略一两个细节。\n\n### 什么问题？我没看到什么问题\n\
  \n我以一个乐观的基调结束本章，向你展示可以在代码 5-1 中在不影响大局的情况下更改的内容。\n\n#### 你创建的标识符\n\n如果你创建了一个标识符，那么这个名称是可以随意使用的。例如，在代码\
  \ 5-1 中，你可以将 `EchoLine` 改为 `RepeatAfterMe`。\n\n```java\nclass RepeatAfterMe {\n\
  \  public static void main ... *etc*.\n```\n\n这完全没有问题，只要你愿意保持一致。只需遵循本章前面的部分“输入和运行程序”中的大部分步骤即可。\n\
  \n*   在步骤 6 中，不要输入 `EchoLine`，而是在“新建 Java 类”对话框的 Name 字段中输入 `RepeatAfterMe`。\n*\
  \   在步骤 8 中，当你从代码 5-1 复制代码时，不要在代码顶部输入：\n    ```java\n    class EchoLine {\n    ```\n\
  \    相反，输入这些单词：\n\n    ```java\n    class RepeatAfterMe {\n    ```\n\n#### 空格和缩进\n\
  \nJava 对空格和缩进的使用并不挑剔。你只需要保持你的程序组织良好且可读即可。以下是代码 5-1 中空格和缩进的另一种写法：\n\n```java\nimport\
  \ java.util.Scanner;\nclass EchoLine {\n  public static void main(String args) {\n\
  \    Scanner keyboard = new Scanner(System.in);\n    System.out.println(keyboard.nextLine());\n\
  \    keyboard.close();\n  }\n}\n```\n\n# 第 6 章\n\n# 使用构建块：变量与类型\n\n## 本章内容\n\n*\
  \   声明变量\n*   赋值\n*   处理数字\n*   使用 Java\n\n1946 年，约翰·冯·诺依曼写了一篇关于新兴技术的开创性论文。在其他方面，他确立了一个基本事实：计算机的主要业务是将数据从一个地方移动到另一个地方。提取数字——银行账户的余额。将这个数字从内存移动到处理单元。给余额增加金额，然后移回内存。数据的移动——仅此。\n\
  \n好了！本章将向你如何处理数据。\n\n## 使用变量\n\n这里是某软件公司网站的一个摘：\n\nSnitSoft 意识到对信息技术社区的责任。由于这个原因，SnitSoft\
  \ 正以低廉的价格提供最受欢迎的应用。只需 5.95 美加运费，你就能获得一张包含 SnitSoft 优质产品的光盘。\n\n去吧。点击“立即下单！”链接。看看发生什么。你会得到一个包含两个项目的订单表。其中一个项目标记为\
  \ 5.95 美元（光盘），另一个项目显示为 25.00 美元（运费）。真是抢劫！亏了 SnitSoft 的慷慨，你只需支付 30.95 美元就能获得价值巨大的软件。\n\
  \n在 SnitSoft 网页的后台，一个计算机程序正在进行一些坏人的算术。该程序看起来像代码 6-1。\n\n代码列表 6-1：SnitSoft 的大骗局\n\
  \n```java\nclass SnitSoft {\n  public static void main(String args[]) {\n    double\
  \ amount;\n    amount = 5.95;\n    amount = amount + 25.00;\n    System.out.print(\"\
  We will bill $\");\n  }\n}\n```\n\n\n\n```java\nSystem.out.print(amount);\nSystem.out.println(\"\
  \ to your credit card.\");\n}\n```\n\n当我在自己的电脑上（而不是 SnitSoft 的电脑）运行列表 [6-1] 时，我得到了如图\
  \ [6-1] 所示的输出。\n\n![9781118407813-fg0601.tif](img/9781118407813-fg0601_fmt.png)\n\
  \n图 6-1: 运行列表 [6-1] 中的代码。\n\n## 使用变量\n\n列表 [6-1] 中的代码使用了一个名为 `amount` 的变量。`variable`（变量）是一个占位符。你可以将像\
  \ `5.95` 这样的数字放入变量中。在变量中放置一个数字后，你可以改变主意，并将另一个数字（如 `30.95`）放入变量中。（这就是变量中发生变化的地方。）当然，当你向变量中放入一个新数字时，旧数字就不存在了。如果你没有在其他地方保存旧数字，旧数字就消失了。\n\
  \n图 [6-2] 展示了列表 [6-1] 代码执行前后的对比。当电脑执行 `amount = 5.95` 时，变量 `amount` 中包含了数字 `5.95`。然后，在执行\
  \ `amount = amount + 25.00` 语句后，变量 `amount` 突然变成了 `30.95`。当你思考变量时，请想象计算机内存中的某个地方，电线和晶体管存储着\
  \ `5.95`、`30.95` 或任何内容。在图 [6-2] 中，想象每个箱子都被百万个类似的箱子包围。\n\n![9781118407813-fg0602.tif](img/9781118407813-fg0602_fmt.png)\n\
  \n图 6-2: 变量（变化前和后）。\n\n现在你需要一些术语。（你可以参考图 [6-3] 查看。）存储在变量中的东西被称为 `value`（值）。变量的值可以在程序运行期间改变（例如，当\
  \ SnitSoft 添加运费和手续费时）。存储在变量中的值并不一定是数字。（例如，你可以创建一个始终存储字母的变量。）存储在变量中的值的种类是变量的 `type`（类型）（你可以在本章其余部分以及接两个章节中阅读更多关于类型的知识。）\n\
  \n![9781118407813-fg0603.tif](img/9781118407813-fg0603_fmt.png)\n\n图 6-3: 变量、它的值及其类型。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 变量与变量的 `name`（名称）之间存在细微、几乎难以察觉的区别。即使在正式写作中，当我指的是\
  \ `variable name`（变量名）时，也经常使用 `variable`。严格来说，`amount` 是变量名，而与 `amount` 相关的所有内存存储（包括\
  \ `amount` 的值和类型）都是变量本身。如果你认为 `variable` 和 `variable name` 之间的这种区别太微妙，不值得去担心，请加入我们的俱乐部。\n\
  \n每个变量名都是一个 `identifier`（标识符）——一个你可以在自己的代码中自定义的名字（更多信息，请参见第 [4] 章）。在准备列表 [6-1] 时，我构思了\
  \ `amount` 这个名字。\n\n### 理解赋值语句\n\n列表 [6-1] 中带有等号的语句被称为 `assignment statements`（赋值语句）。在赋值语句中，你为某个东西分配值。在很多情况下，这个东西是一个变量。\n\
  \n你应该养成从右到左读取赋值语句的习惯。例如，列表 [6-1] 中的第一个赋值语句说：“将 `5.95` 赋值给 `amount` 变量。”第二个赋值语句就稍微复杂一点。从右到左读取第二个赋值语句，你得到：“将\
  \ `amount` 变量中已有的加上 `25.00`，并让该数字（`30.95`）成为 `amount` 变量的新值。”关于此点的直观、击击脑的说明，请参见图\
  \ [6-4]。\n\n![9781118407813-fg0604.tif](img/9781118407813-fg0604_fmt.png)\n\n图 6-4:\
  \ 从右到左读取赋值语句。\n\n![remember.eps](img/remember_fmt.png) 在赋值语句中，被赋值值的东西始终在左侧。\n\n\
