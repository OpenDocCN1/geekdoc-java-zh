  \ 所示的运行。\n\n### 运行跨文件的代码\n\n从 Eclipse 的角度来看，一个包含两个 Java 源文件的项目并没有什么问题。你在同一个项目中创建两个类，然后选择“运行⇒运行方式⇒Java\
  \ ”。一切都按照你预期的方式运行。\n\n只有当一个项目中有两个 `main` 方法时，情况才会变得棘。本节的示例没有这种困扰。但随着你对代码的实验，你可以轻松添加带有额外\
  \ `main` 方法的类。你可能还会创建一个具有多个入口点的应用程序。\n\n当一个项目有多个 `main` 方法时，Eclipse 可能会弹出提示并询问你想运行哪个类的\
  \ `main` 方法。但有时 Eclipse 并不会提示你。相反，Eclipse 会随机选择一个 `main` 方法并忽略所有其他方法。这可能会让你非常困惑。你在错误的\
  \ `main` 方法中添加了 `println` 调用，但控制台视图中什么都没有出现。嘿，怎么回事？\n\n\n\n\n你可以按照以下步骤解决此问题：\n\n\
  1. 在包资源管理器（Package Explorer）中展开项目分支。\n2. 展开项目分支下的 `src` 文件夹。\n3. 展开 `src` 分支下的 `(default\
  \ package)` 分支。\n   `(default package)` 分支包含 `.java` 文件。\n4. （在 Windows 上）右键点击你想运行的\
  \ `main` 方法所在的 `.java` 文件。（在 Mac 上）按 Control 键点击你想运行的 `main` 方法所在的 `.java` 文件。\n\
  5. 在弹出的右菜单中，选择 `Run As⇒Java Application`。\n\n![remember.eps](img/remember_fmt.png)\
  \ 你无法运行没有 `main` 方法的项目。如果你尝试这样做，会得到一个之前图 17-2 所示的对话框。\n\n### 为什么要这么做？\n\n从表面上看，列表\
  \ 17-3 中的代码更长、更复杂且更难阅读。但请想象一堆脏衣物。找一个篮子并将袜子丢进篮子里可能需要时间。但当你把衣服放在篮子里后，携带起来要容易得多。列表\
  \ 17-3 中的代码也是同样的道理。当你把数据放在一个“购物篮”（Purchase basket）中时，处理复杂的购买事务就会变得得多。\n\n## 从类到对象\n\
  \n列表 17-2 中的代码定义了一个 `class`（类）。`class` 是一个设计方案；它描述了你打算组合和使用数据的方式。例如，列表 17-2 中的代码宣告了你的意图：将\
  \ `double`、`boolean` 和 `double` 值组合起来创建新的 `Purchase` 值。\n\n类是所有 Java 编程的核心。但 Java\
  \ 被称为面向对象的语言。Java 并不被称为面向类的语言。事实上，没有人使用“面向类的语言”这个术语。这是为什么呢？\n\n嗯，你无法拥抱一个 `class`。`class`\
  \ 并不真实的。没有对象的类就像没有巧克力的日子。如果你现在坐在一个房间里，看看房间里所有的椅子。房间里有几把椅子？两把？五把？还是二十把？在一个有五把椅子的房间里，你有五个椅子对象。每把椅子（每个对象）都是真实存在的，是你可以使用、可以坐的东西。\n\
  \n像 Java 这样的语言既有类也有对象。那么类和对象之间有什么区别呢？\n\n* 对象是一个实体。\n* 类是对该类型事物的设计方案。\n\n例如，你会如何描述什么是椅子？嗯，椅子有一个座面、靠背和腿。在\
  \ Java 中，你可以编写列表 17-4 中的内容。\n\n列表 17-4：作为椅子的含义\n\n```java\n/*\n * 这是一个真实的 Java 代码，但这段代码\n\
  \ *  不能单独编译：\n */\nclass Chair {\n    FlatHorizonalPanel seat;\n    FlatVerticalPanel\
  \ back;\n    LongSkinnyVerticalRods legs;\n}\n```\n\n前面的代码是椅子的设计方案。代码告诉你是每把椅子都有三样东西。代码为这些东西命名（`seat`、`back`\
  \ 和 `legs`）并告诉了关于每样东西的一些信息（例如，座面是一个 `FlatHorizontalPanel`）。同样，列表 17-2 中的代码告诉你每笔购买都有三样东西。代码为这些东西命名（`amount`、`taxable`\
  \ 和 `total`）并告诉了每样东西的原始类型。\n\n想象在宇宙边缘有一个巨大的工厂。当你每晚上睡觉时，这个工厂就会冲压出实体对象——你在第二天清醒时会遇到的那些对象。明天你要去\
  \ Sloshy Shoes 公司面试。所以今晚，工厂为该公司的办公室制造椅子。工厂根据列表 17-4 中几乎真实的代码制造椅子对象，如图 17-3 所示。\n\
  \n![9781118407813-fg1703.tif](img/9781118407813-fg1703_fmt.png)\n\n图 17-3：来自 Chair\
  \ 类的椅子对象。\n\n在列表 17-3 中，`PurchasePurchase = new Purchase();` 的行为就像宇宙边缘那个巨大的工厂。列表\
  \ 17-3 中的该行并不是创建椅子对象，而是像图 17-4 所示创建了一个购买对象。列表 17-3 中的该行是带初始化的声明。就像 `int count =\
  \ 0;` 声明了 `count` 变量并将其设置为 `0` 一样，列表 17-3 中的行声明了 `onePurchase` 变量并让 `onePurchase`\
  \ 指向一个新的对象。该新对象包含三个部分：金额部分、应税部分和总额部分。\n\n![9781118407813-fg1704.tif](img/9781118407813-fg1704_fmt.png)\n\
  \n图 17-4：从 Purchase 类创建的对象。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 如果你想挑剔的话，图 17-4 中的内容与列表 17-3 中语句的动作之间存在区别。图 17-4 显示了一个存储了 `20.00`、`true` 和 `21.00`\
  \ 值的对象。列表 17-3 中的语句创建了一个对象，但它并没有为对象填充有用的值。获取值是在列表 17-3 之后的。\n\n### 理解（或忽略）细微差别\n\
  \n有时当你提到一个特定的对象时，你想强调它来自哪个类。嗯，重点上的细微差别需要术语上的巨大差异。以下是 Java 程序员使用术语的方式：\n\n* 列表 17-3\
  \ 中的加粗行创建一个新的 `object`（对象）。\n* 列表 17-3 中的加粗行创建一个新的 `instance of the Purchase`（类的实例）。\n\
  \n`object` 和 `instance` 几乎是同义词，但 Java 程序员从不说“Purchase class object”（如果他们说了，会觉得很怪）。\n\
  \n顺便说一下，如果你搞混了术语并说“Purchase class object”，没人会责你。每个人都理解你的意思，生活照常进行。事实上，我经常使用“Purchase\
  \ object”（购买对象）这样的短语来描述一个类的实例。对象和实例之间的区别并不重要。但记住 `object` 和 `instance` 具有相同含义是非常重要的。（好吧！它们*几乎*具有相同的含义。）\n\
  \n### 引用对象的部分\n\n创建对象后，你使用点来引用对象的各个。例如，在列表 17-3 中，我通过以下代码将一个值放入 `onePurchase` 对象的金额部分：\n\
  \n```java\nonePurchase.amount = keyboard.nextDouble();\n```\n\n在列表 17-3 之后，我通过以下代码获取金额部分的值：\n\
  \n```java\nonePurchase.total = onePurchase.amount * 1.05;\n```\n\n这种点操作看起来可能麻烦，但当程序员尝试组织代码时确实非常有帮助。在列表\
  \ 17-1 中，每个变量都是独立的实体。但在列表 17-3 中，每个对 `amount` 单词的使用与购买的概念是密不可分的。这很好。\n\n### 创建多个对象\n\
  \n创建 `Purchase` 类后，你可以创建任意数量的购买对象。例如，在列表 17-5 中，我创建了三个购买对象。\n\n列表 17-5：处理购买\n\n\
  ```java\nimport java.util.Scanner;\n\nclass ProcessPurchasesss {\n    public static\
  \ void main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
  \        Purchase aPurchase;\n    }\n}\n```\n\n\n\n\n```java\nfor (int count = 0;\
  \ count < 3; count++) {\n    aPurchase = new Purchase();\n    System.out.print(\"\
  Amount: \");\n    aPurchase.amount = keyboard.nextDouble();\n    System.out.print(\"\
  Taxable? (true/false) \");\n    aPurchase.taxable = keyboard.nextBoolean();\n  \
  \  if (aPurchase.taxable) {\n        aPurchase.total = aPurchase.amount * 1.05;\n\
  \    } else {\n        aPurchase.total = aPurchase.amount;\n    }\n    System.out.print(\"\
  Total: \");\n    System.out.println(aPurchase.total);\n    System.out.println();\n\
  }\nkeyboard.close();\n}\n```\n\n图 17-5 显示了列表 17-5 中代码的运行情况，图 17-6 则说明了这一概念。\n\n\
  ![9781118407813-fg1705.tif](img/9781118407813-fg1705_fmt.png)\n\n图 17-5：运行列表 17-5\
  \ 中的代码。\n\n![9781118407813-fg1706.tif](img/9781118407813-fg1706_fmt.png)\n\n图 17-6：从一个类产生三个对象。\n\
  \n![remember.eps](img/remember_fmt.png) 要编译列表 17-5 中的代码，你必须在同一个项目中拥有 `Purchase`\
  \ 类的副本。（`Purchase` 类在列表 17-2 中）。要将类的代码从一个项目复制到另一个项目，请参阅第 16 章。（该章节的一个侧边栏描述了复制和粘贴的程序。）\n\
  \n列表 17-5 只有一个引用购买对象的变量（该变量名为 `aPurchase`）。程序之所以有三个购买对象，是因为赋值语句 `aPurchase = new\
  \ Purchase();` 执行了三次（对应 `for` 循环的每次迭代）。就像你可以将 `int` 变量的赋值与变量声明分开一样：\n\n```java\n\
  int count;\ncount = 0;\n```\n\n你也可以将 `Purchase` 变量的赋值与变量声明分开：\n\n```java\nPurchase\
  \ aPurchase;\nfor (int count = 0; count < 3; count++) {\n    aPurchase = new Purchase();\n\
  }\n```\n\n事实上，在你创建了列表 17-2 中的代码后，`Purchase` 一词代表了一个全新的类型——引用类型。Java 有八种内置基本类型，而引用类型的数量取决于你一生中能定义的数量，是无限的。在列表\
  \ 17-2 中，我定义了 `Purchase` 引用类型，你也可以定义引用类型。\n\n表 17-2 对基本类型和引用类型进行了简要比较。\n\n表 17-2\
  \ Java 类型\n\n| | 基本类型 | 引用类型 |\n| :--- | :--- | :--- |\n| 如何创建 | 语言内置 | 定义为 Java\
  \ 类 |\n| 数量有多少 | 八种 | 无限多个 |\n| 示例变量声明 | `int count;` | `Purchase aPurchase;` |\n\
  | 示例赋值 | `count = 0;` | `aPurchase = new Purchase();` |\n| 为其中一个部分赋值 | （不适用） | `aPurchase.amount\
  \ = 20.00;` |\n\n## 另一种思考方式\n\n当你开始学习面向对象编程时，你可能会认为这个“类”的想法是个骗局。硅谷的一些极客可能无所事事，他们去酒吧编造了一些令人困惑的胡言乱语。他们并不知道这意味着什么，但看着别人挣扎着理解却觉得很有趣。嗯，这并不是类的本质。类是严肃的。而且，类是非常实用的。许多信誉良好的研究表明，类和面向对象编程节省时间和金钱。尽管如此，类的概念可能非常难以捉摸。即使是经验丰富的程序员——那些刚接触面向对象编程的人——也难以理解对象与类的区别。\n\
  \n### 类、对象与表格\n\n由于类如此神秘，我将用另一个类比来扩展你的理解。图 17-7 是一个包含三个购买项目的表格。表格标题由一个单词组成（“Purchase”），表格有三个表头——“amount”、“taxable”和“total”。而列表\
  \ 17-2 中的代码具有相同的内容——`Purchase`、`amount` 和 `total`。所以在图 17-7 中，将表格的顶部部分（标题和表头）看作类。就像列表\
  \ 17-2 中的代码一样，表格的这部分告诉我们 `Purchase` 意味着什么（意味着拥有 `amount` 值、一个 `taxable` 值和一个 `total`\
  \ 值）。\n\n![9781118407813-fg1707.tif](img/9781118407813-fg1707_fmt.png)\n\n图 17-7：购买项目的表格。\n\
  \n类就像表格的顶部部分。那么对象呢？嗯，对象就像表格的一行。例如，通过列表 17-5 中的代码和图 17-5 中的输入，我创建了三个对象（`Purchase`\
  \ 类的三个实例）。第一个对象的 `amount`值为 20.00，`taxable`值为 `true`，`total`值为 21.00。在表格中，第一行就有这三个值——20.00、`true`\
  \ 和 21.00，如图 17-8 所示。\n\n![9781118407813-fg1708.tif](img/9781118407813-fg1708_fmt.png)\n\
  \n图 17-8：一次购买对应表格的一行。\n\n### 问题解答\n\n这里是世界上最简短的面向对象编程常见问题解答：\n\n*   **我可以在没有类的情况下创建一个对象吗？**\n\
  \    不可以。在 Java 中，每个对象都是类的实例。\n*   **我可以在没有对象的情况下创建一个类吗？**\n    可以。事实上，书中的几乎每个程序都创建了一个类。以列表\
  \ 17-5 为例。列表 17-5 中的代码定义了一个名为 `ProcessPurchass` 的类。在列表 [17-5]中（或任何其他地方），我都没有创建 `ProcessPurchass`\
  \ 类的实例。我有一个没有对象的类。这没问题。一切照常。\n*   **在我创建了类及其实例之后，我还可以向该类添加更多实例吗？**\n    可以。在列表 17-5\
  \ 中，我创建了一个实例，然后另一个，然后第三个。如果我再运行一次 `for` 循环，我就会有一个四个实例，并在图 17-8 的表格中添加第四行。无论没有对象、三个对象、四个对象还是更多对象，我还是那个旧的\
  \ `Purchase` 类。\n*   **对象可以来自多个类吗？**\n    闭嘴！也许其他面向对象的语言允许这种糟糕的“类繁殖”，但在 Java 中，这是严格禁止的。这是\
  \ Java 区别于它之前的一些语言之一。\n\n第 18 章\n\n# 使用 Java 类的方法和变量\n\n在本章中\n\n*   使用 Java 的 `String`\
  \ 类\n*   调用方法\n*   理解静态和非静态方法及变量\n*   让数字更好看\n\n我希望你没有读第 17 章，因为我在章节的开头撒了一个大谎。实际上，这并不是谎言。这是一个夸张。\n\
  \n实际上，这并不是夸张。这是一个严谨的用词选择。在第 17 章中，我写道将数据收集到类中是面向对象编程的开始。嗯，这是。。很多编程语言在面向对象编程流行之前就已经有了数据收集的功能。\n\
  \n\n\n\n要极其精确地说，将数据分组为可用的块只是面向对象编程的先决条件。只有当你在类中结合了数据和方法时，你才真正在进行面向对象编程。\n\n本章开启了“数据与方法”的序幕，而第\
  \ 19 章将完善这幅蓝图。\n\n## String 类\n\n`String` 类在 Java API 中定义。这意味着在你从 java.com 下载的内容中，某个地方有一个名为\
  \ `String.java` 的文件。如果你找到这个 `String.java` 文件并查看一眼其代码，你会发现一些非常熟悉的内容：\n\n```java\n\
  class String {\n    ...And so on.\n```\n\n在你自己的代码中，你可以直接使用这个 `String` 类，而无需看到过 `String.java`\
  \ 文件的内部内容。这是面向对象编程的伟大之处之一。\n\n### 一个简单的示例\n\n一个 `String` 是一组字符。它就像连续排列的几个 `char`\
  \ 值。你可以声明一个类型为 `String` 的变量，并在变量中存储几个字母。列表 18-1 列出了一个微型示例。\n\n列表 18-1：我再次重复一遍（又一遍）\n\
  \n```java\nimport java.util.Scanner;\n\nclass JazzyEchoLine {\n    public static\
  \ void main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
  \        String lineIn;\n        lineIn = keyboard.nextLine();\n        System.out.println(lineIn);\n\
  \        keyboard.close();\n    }\n}\n```\n\n列表 18-1 的运行结果如图图 18-1 所示。这次运行的结果与第\
  \ 5 章中列表 5-1 的运行惊人地相似。这是因为列表 18-1 是列表 5-1 工作的重演。\n\n![9781118407813-fg1801.tif](img/9781118407813-fg1801_fmt.png)\n\
  \n图 18-1：运行列表 18-1 中的代码。\n\n列表 18-1 中的新想法是使用 `String`。在列表 5-1 中，我没有变量来存储用户的输入。但在列表\
  \ 18-1 中，我创建了 `lineIn` 变量。这个变量存储了一组字母，就像“照我写的做，不要照我做的”这些字母一样。\n\n### 将 String 变量用好\n\
  \n列表 18-1 中的程序获取用户的输入并将其回回到屏幕上。这是一个很好的程序，但（就像我认识的许多大学管理者一样），它似乎并不特别有用。\n\n所以，让我们来看看\
  \ Java `String` 类型更有用的应用。一个很不错的例子在列表 18-2 中。\n\n列表 18-2：将姓名存入 String 变量\n\n```java\n\
  import java.util.Scanner;\nimport static java.lang.System.out;\n\nclass ProcessMoreData\
  \ {\n    public static void main(String args[]) {\n        Scanner keyboard = new\
  \ Scanner(System.in);\n        String fullName;\n        double amount;\n      \
  \  boolean taxable;\n        double total;\n        out.print(\"Customer's full\
  \ name: \");\n        fullName = keyboard.nextLine();\n        out.print(\"Amount:\
  \ \");\n        amount = keyboard.nextDouble();\n        out.print(\"Taxable? (true/false)\
  \ \");\n        taxable = keyboard.nextBoolean();\n        if (taxable) {\n    \
  \        total = amount * 1.05;\n        } else {\n            total = amount;\n\
  \        }\n        out.println();\n        out.print(\"The total for \");\n   \
  \     out.print(fullName);\n        out.print(\" is \");\n        out.print(total);\n\
  \        out.println(\".\");\n        keyboard.close();\n    }\n}\n```\n\n列表 18-2\
  \ 代码的运行结果如图 18-2 所示。代码将 Barry A. 存储在名为 `fullName` 的变量中，并将 `fullName` 的内容输出。为了让这个程序运行，你必须在某处存储\
  \ Barry A.。最后程序遵循以下大纲：\n- 获取姓名。\n- 获取一些内容。\n- 计算总额。\n- 显示姓名（以及其他内容）。\n\n![9781118407813-fg1802.tif](img/9781118407813-fg1802_fmt.png)\n\
  \n图 18-2：购物。如果你没有在程序完成其他工作并计算总额之前存储姓名，它就无法显示姓名。\n\n### 读写字符串\n\n要从键盘读取 `String`\
  \ 值，你可以调用 `next()` 或 `nextLine()`：\n- `next()` 方法读取到下一个空格。例如，输入 Barry A.，语句：\n```java\n\
  String firstName = keyboard.next();\nString middleInit = keyboard.next();\nString\
  \ lastName = keyboard.next();\n```\n将 Barry 赋值给 `firstName`，A. 赋值给 `middleInit`，Burd\
  \ 赋值给 `lastName`。\n- `nextLine()` 方法读取到行尾。例如，输入 Barry A.，语句：\n```java\nString fullName\
  \ = keyboard.nextLine();\n```\n（嘿，当作者有些好处。）\n\n要显示 `String` 值，你可以调用你的老朋友 `System.out.print`\
  \ 或 `System.out.println`。事实上，书中的大多数程序都显示 `String` 值。在列表 18-2 中，这样的语句：\n```java\n\
  out.print(\"Customer's full name: \");\n```\n显示 `String` 值 `\"Customer's full name:\
  \ \"`。![tip.eps](img/tip_fmt.png) 你可以使用 `print` 和 `println` 将 `String` 值写入磁盘。详情请参阅第\
  \ 13 章。\n\n第 4 章引入了一组用双引号括起来的字符：`\"Chocolate, royalties, sleep\"`\n\n在第 4 章中，我将其称为某种字面量（literal）（因为它和变量不同，它看起来就像它所代表的内容一样。）好吧，在本章中，我可以继续讲述关于\
  \ Java 字面量的故事：\n- 在列表 18-2 中，`amount` 和 `total` 是 double 变量，而 `1.05` 是一个 double\
  \ 字面量。\n- 在列表 18-2 中，`fullName` 是一个 `String` 变量，而像 `\"Customer's full name: \"`\
  \ 这样的就是 String 字面量。\n\n![remember.eps](img/remember_fmt.png) 在 Java 程序，你用双引号包裹 `String`\
  \ 字面量的字母。\n\n## 使用对象的方法\n\n如果你不太担心类和引用类型，那么在列表 18-2 中使用 `String` 类型并什么大不了。几乎你用基本类型所做的一切似乎在\
  \ `String` 类型上也有效。但危险在下一个转弯。看看列表 18-3 中的代码以及图 18-3 所示的代码运行结果。\n\n列表 18-3：错误的密码检查器\n\
  \n```java\n/**\n * 这段代码无法工作：\n */\nimport java.util.Scanner;\nimport static java.lang.System.out;\n\
