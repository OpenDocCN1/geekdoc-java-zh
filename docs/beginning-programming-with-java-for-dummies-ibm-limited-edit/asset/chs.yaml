  \ 6-1: Running the code from Listing [6-1].\n\n### Using a variable\n\nThe code\
  \ in Listing [6-1] makes use of a variable named `amount`. A `variable` is a placeholder.\
  \ You can stick a number like `5.95` into a variable. After you’ve placed a number\
  \ in the variable, you can change your mind and put a different number, like `30.95`,\
  \ into the variable. (That’s what varies in a variable.) Of course, when you put\
  \ a new number in a variable, the old number is no longer there. If you didn’t save\
  \ the old number somewhere else, the old number is gone.\n\nFigure [6-2] gives a\
  \ before-and-after picture of the code in Listing [6-1]. When the computer executes\
  \ `amount = 5.95`, the variable `amount` has the number `5.95` in it. Then, after\
  \ the `amount = amount + 25.00` statement is executed, the variable `amount` suddenly\
  \ has `30.95` in it. When you think about a variable, picture a place in the computer’s\
  \ memory where wires and transistors store `5.95`, `30.95`, or whatever. In Figure\
  \ [6-2], imagine that each box is surrounded by millions of other such boxes.\n\n\
  ![9781118407813-fg0602.tif](img/9781118407813-fg0602_fmt.png)\n\nFigure 6-2: A variable\
  \ (before and after).\n\nNow you need some terminology. (You can follow along in\
  \ Figure 6-3$.) The thing stored in a variable is called a `value`. A variable’s\
  \ value can change during the run of a program (when SnitSoft adds the shipping\
  \ and handling cost, for example). The value stored in a variable isn’t necessarily\
  \ a number. (You can, for example, create a variable that always stores a letter.)\
  \ The kind of value stored in a variable is a variable’s `type`. (You can read more\
  \ about types in the rest of this chapter and in the next two chapters as well.)\n\
  \n![9781118407813-fg0603.tifFigure 6-3: A variable, its value, and its type.![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ There’s a subtle, almost unnoticeable difference between a variable and a variable’s\
  \ `name`. Even in formal writing, I often use the word `variable` when I mean `variable\
  \ name`. Strictly speaking, `amount` is the variable name, and all the memory storage\
  \ associated with `amount` (including the value and type of `amount`) is the variable\
  \ itself. If you think this distinction between `variable` and `variable name` is\
  \ too subtle for you to worry about, join the club.\n\nEvery variable name is an\
  \ `identifier` — a name that you can make up in your own code (for more about this,\
  \ see Chapter [4]). In preparing Listing [6-1], I made up the name `amount`.\n\n\
  ### Understanding assignment statements\n\nThe statements with equal signs in Listing\
  \ [6-1] are called `assignment statements`. In an assignment statement, you assign\
  \ a value to something. In many cases, this something is a variable.\n\nYou should\
  \ get into the habit of reading assignment statements from right to left. For example,\
  \ the first assignment statement in Listing [6-1] says, “Assign `5.95` to the `amount`\
  \ variable.” The second assignment statement is just a bit complicated. Reading\
  \ the second assignment statement from right to left, you get “Add `25.00` to the\
  \ value that’s already in the `amount` variable and make that number (`30.95`) be\
  \ the new value of the `amount` variable.” For a graphic, hit-you-the-head illustration\
  \ of this, see Figure [6-4].\n\n![9781118407813-fg0604.tif](img/9781118407813-fg0604_fmt.png)\n\
  \nFigure 6-4: Reading an assignment statement from right to left.\n\n![remember.eps](img/remember_fmt.png)\
