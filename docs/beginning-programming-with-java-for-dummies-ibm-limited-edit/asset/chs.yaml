- "# Java 编程入门指南，IBM 限量版\n\n\n\n![](img/cover.jpg)\n\n![cover.eps](img/cover.jpg)\n\
  \n\n访问 [www.dummies.com/cheatsheet/beginningprogrammingwithjava](http://www.dummies.com/cheatsheet/beginningprogrammingwithjava)\
  \ 查看此书的速查表。\n\n## 指南\n\n\n\n\n\n\n\n\n\n你的故事是什么？\n\n*   你是一个上班族，对了解公司电脑是如何运作感兴趣？\n\
  *   你是一个学生，需要额外的阅读材料来通过计算机课程？\n*   你是一个典型的电脑用户——处理过很多文字，想用电脑做些更有趣的事？\n*   你是一个求职者，对进入快速、华丽且受关注的编程世界（或者至少是收入不错的编程世界）感兴趣？\n\
  \n如果你想写计算机程序，这本书就适合你。这本书避开了那些傲慢的“你当然已经知道了”的假设，从零开始描述编程。\n\n## 关于本书\n\n本书使用了 `Java`\
  \ —— 一种强大的通用的计算机编程语言。但 `Java` 的微妙之处和特性并不是本书的重点。相反，本书强调的是过程——创建让计算机遵循的指令的过程。许多高深上的书籍描述了这一过程的机制——规则、规范和形式化。\n\
  \n\n\n\n在这本书中，我对你的计算机经验几乎不作任何假设。当你阅读每一章节时，你将进入我的思维世界。你会看到我面临的问题、我思考的内容，以及我找到的解决方案。有些问题是我作为新手时记得自己遇到过的类；而另一些问题则是我作为专家所面临的类。我帮助你理解，帮助你视觉化，并帮助你亲手创建解决方案。我甚至还可以给你讲几个有趣的故事。\n\
  \n## 如何使用本书\n\n我真希望自己可以说：“打开这本书的随机一页，开始编写 `Java` 代码。只需填空空白处，不要回头看。”从某种意义上说，这是事实的。你编写\
  \ `Java` 代码不会弄坏任何东西，所以你可以一直自由地进行实验。\n\n但我必须诚实。如果你不理解大局，编写程序是非常困难的。对于任何计算机编程语言都是如此——而不仅仅是\
  \ `Java`。如果你在不知道代码含义的情况下输入代码，而代码没有完全按照你想要的方式运行，那么你就是彻底陷入了困局。\n\n因此，在本书中，我将编程划分为易管理的区块。每个区块（多或少）就是一个章节。你可以从任何地方切入——第\
  \ 5 章、第 10 章或任何地方。你甚至可以从章节的中间开始研究。我尝试让示例变得有趣，同时不让一个章节依赖于另一个。当我使用另一个章节中的重要概念时，我会包含一条注释帮助你找到思路。\n\
  \n通常情况下，我的建议如下：\n\n- 如果你已经了解某些内容，就不要费心读它了。\n- 如果你感到好奇，不要害怕跳读。如果你真的需要，你也可以随时偷看之前的章节。\n\
  \n## 本书使用的符号规范\n\n几乎每本技术书籍的开头都有一个小型的字体图例，《浅显自学 Java 编程入门》（*Beginning Programming\
  \ with Java For Dummies*）第 4 版也不例外。以下是书中所用字体的简要说明：\n\n- 新术语使用*斜体*。\n- 当我想要你输入某些短内容或执行某个步骤时，我使用**粗体**。\n\
  - 你还会看到这种宽字体。我使用等宽字体表示 `Java` 代码、文件名、网页地址（URL）、屏幕消息以及其他此类内容。此外，如果你需要输入的内容非常长，它将以等宽字体单独占一行（或几行）显示。\n\
  - 当你在自己的电脑键盘上输入某些内容时，需要进行更改。例如，我可能会要求你输入\n\n```java\nclass Anyname\n```\n\n这意味着你应该输入\
  \ `class`，然后输入一个你自己构思的名字。你需要替换为自己的单词的词汇将使用*斜体等宽字体*。\n\n## 你不需要阅读的内容\n\n选择第一个包含你尚不知材料的章节或节，并从那里开始阅读。当然，你可能和我我一样讨厌做决定。如果是这样，这里有一些你可以遵循的准则：\n\
  \n- 如果你已经了解计算机编程是怎么回事，请跳过第 1 章的前半部分。相信我，我不介意的。\n- 如果被要求使用 `Eclipse`以外的开发环境，你可以跳过第\
  \ 2 章。这适用于计划使用 `NetBeans`、`IntelliJ IDEA` 或许多其他开发环境的情况。本书大部分示例都需要 `Java 5.0` 或更高版本，某些示例需要\
  \ `Java 7` 或更高版本。因此，确保你的系统使用的是 `Java 7` 或更高版本。如果你不确定电脑的 `Java` 版本，或者在选择开发环境方面有余地，最安全的做法是阅读第\
  \ 3 章。\n- 如果你已经做过一点计算机编程，请准备扫读第 6 章到 8 章。深入阅读第 9 章，看看感觉是否顺手。（如果是，就继续读。如果不是，重新扫读第\
  \ 6 章、7 章和 8 章。）\n- 如果你觉得用 `Java` 以外的语言编写程序很轻松，这本书不适合你。把这本书当作纪念，并购买由 John Wiley\
  \ & Sons, Inc. 出版的《浅显自学 Java》（*Java For Dummies*）第 6 版。\n\n如果你想跳过侧边栏和“技术细节”（Technical\
  \ Stuff）图标，请尽管这样做。\n\n## 愚的假设\n\n在书中，我对你（读者）做了几个假设。如果这些假设有一个错了，你可能没问题。如果全部错了，也尽管买这本书。\n\
  \n- **我假设你拥有一台电脑。** 好消息是：你可以在任何电脑上运行这些代码。你不能使用的电脑是八年前的古董（左右）。你可以在 Windows 或 Linux\
  \ 上运行最新版本。\n- **我假设你能操作电脑的菜单和对话框。** 你不需要是 Windows、Linux 或 Macintosh 高级用户，但你应该能够启动程序、找到文件、将文件放入目录之类的。当你在书中练习时，大部分是在键盘上输入，而不是点击鼠标。在极少数需要拖放、复制粘贴或即插用的情况下，我会仔细引导你完成步骤。但你的电脑配置可能有多种方式，我的指令可能并不完全适用。所以当你遇到这些特定平台的任务时，请尝试遵循步骤。\n\
  - **我假设你能逻辑思考。** 计算机编程完全就是逻辑思考。如果你能逻辑思考，你就行了。如果你不相信自己能逻辑思考，请继续读。你可能会感到惊喜。\n- **我假设你对计算机编程一无所知。**\
  \ 这不是一本面向所有人的书。我不迎合专家，我专门针对新手——从未编程过计算机或从未对编程感到轻松的人。如果你是这些人之一，你读对了这本书。\n\n## 本书的结构\n\
  \n本书被分为小节，小节组成节，节组成章节，最后分成五个部分。（写书时，你会非常熟悉书的结构。写几个月后，睡觉时梦的都是章节和节。）书的部分列如下：\n\n###\
  \ 第一部分：开始 Java 编程\n\n第 I 部分为你整体编程体验做准备。在这些章节中，你会发现编程到底是什么，并准备好电脑编写和测试程序。\n\n###\
  \ 第二部分：编写自己的 Java 程序\n\n这部分涵盖了基础构建块——任何 Java 程序以及任何使用 Java 类语言编写的程序的元素。在这一部分，你将发现如何表示数据以及如何从现有值获取新值。程序示例很短，但很可爱。\n\
  \n### 第三部分：控制流\n\n\n\n\n第 III 部分 包含我最喜欢的章节。在这些章节中，你让计算机从程序的某部分导航到另一个部分。将你的程序想象成一座大豪宅，计算机在各个房间之间移动。有时，计算机会在两条或多条走廊之间选择，有时，它会回到某些房间。作为一名程序员，你的工作就是规划计算机在豪宅中的巡游路线。这非常有趣。\n\
  \n## 第四部分：使用程序单元\n\n你是否曾经通过将一个大问题分解成更小、更易管理的部分来解决？这正是你在本书的第 IV 部分 中所做的。你将发现将编程问题拆分的最佳方法，并为新发现的部分创建解决方案。你还将学会如何使用他人的解决方案。这感觉像是在偷窃，但并不是。\n\
  \n这一部分还包含一个关于使用窗口、按钮和其他图形项目进行编程的章节。如果你觉得你的鼠标被书中的示例忽略了，请阅读第 20 章。\n\n## 第五部分：十之篇\n\
  \n“十之篇”是一个初级程序员的小糖果店。在十之篇中，你可以找到列表——提示列表、资源以及各种有趣读物的列表。\n\n我在 [www.dummies.com/extras/beginningprogrammingwithjava](http://www.dummies.com/extras/beginningprogrammingwithjava)\
  \ 添加了一篇文章，帮助你熟悉 Java 的文档。没有我的 Java 编程文档，我无法编写程序。事实上，没有 Java 程序员可以在没有这些至关文档的情况下编写程序。这些文档是网页格式的，因此容易查找且方便导航。但如果你不熟悉所有的术语，文档可能会让你感到无从从。\n\
  \n## 本书使用的图标\n\n如果你能看到我如何写这本书，你会看到我坐在电脑前，自言自语。我会在脑海中反复读每一个句子。当我有一个额外的想法、旁旁评论或某些不属于正文流的内容时，我会稍微歪一下头。这样一来，任何在听我说话的人（通常没人）就知道我进入了暂时的离题。\n\
  \n当然，在印刷版中，你看不见我歪头。我需要其他方式将旁旁想法单独设置在角落里。我用图标来实现。当你看到“提示”（Tip）图标或“记住”（Remember）图标时，你就知道我正在进行快速的绕行。\n\
  \n以下是我书中使用的图标列表：\n\n![tip.eps](img/tip_fmt.png) **提示**是一条额外信息——其他书籍可能忘记告诉你的有用信息。\n\
  \n![warning.eps](img/warning_fmt.png) 每个人都会犯错。上天知道我这辈子也犯过好几次错。总之，当我想到一个人们特别容易犯的错误时，我会在“警告”（Warning）图标中写下这个错误。\n\
  \n![remember.eps](img/remember_fmt.png) 有时，我想请一个空中写字飞机小组。白色的烟云说：“巴里，如果你想比较两个数字，请使用双等号。请不要忘记这样做。”因为我付不起空中写字的费用，所以我采用更简约的方案。我创建了一个“记住”（Remember）图标。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 偶尔，我会遇到一些技术小知识。这些小知识可能帮助你理解幕后人员（Java\
  \ 的开发者）在想什么。你不必读它，但你可能会发现它很有用。如果你计划阅读其他关于 Java 的（更极客的）书籍，可能会发现这些小知识很有帮助。\n\n![ontheweb.eps](img/ontheweb_fmt.png)\
  \ 此图标引起你对网上可以找到的有用材料的。（不需要等很久就能看到这些图标之一。我在引言的结尾就用了一个！）\n\n## 书籍之外\n\n我写了许多在书中找不到的额外内容。请访问网上查找以下内容：\n\
  \n*   **备查表（Cheat Sheet）：** 请查看 [www.dummies.com/cheatsheet/beginningprogrammingwithjava](http://www.dummies.com/cheatsheet/beginningprogrammingwithjava)。\n\
  *   **在线文章（Online Articles）：** 在打开本书每个部分时打开的几个页面中，你可以找到 *For Dummies* 人们称为“网络额外”（Web\
  \ Extras）的链接，这些链接扩展了我在特定章节中讨论的某些概念。你可以在 [www.dummies.com/extras/beginningprogrammingwithjava](http://www.dummies.com/extras/beginningprogrammingwithjava)\
  \ 找到所有此类额外内容。\n\n## 从何何去\n\n如果你已经读到了这里，你就准备好开始学习计算机编程了。将我（作者）想象成你的向导、你的主人、你的私人助理。我会尽一切努力保持趣味性，最重要的是，帮助你理解。\n\
  \n![ontheweb.eps](img/ontheweb_fmt.png) 如果你喜欢读的内容，请给我发送电子邮件，在我的 Facebook 墙上留言，或者给我发一条推特。我专门为关于这本书的评论和问题创建了邮箱地址\
  \ `BeginProg@allmycode.com`。我的 Facebook 页面是 `/allmycode`，我的 Twitter 账号是 `@allmycode`。\n\
  \n\n\n\n*   然后跳转到下一行。\n\n否则（如果列数大于 60），\n\n则保持在同一行。\n\n总有人得编写出如示例 1-1 所示的代码。这段代码连同数百万行其他代码共同构成了名为\
  \ Microsoft Word 的程序。\n\n那么网页浏览呢？你点击一个本该直接带你到 Yahoo.com 的链接。在后台，有人写了如下所示的代码：\n\n\
  ```\nGo to <a href=\"http://www.yahoo.com\">Yahoo</a>a>.\n```\n\n无论如何，总有人得编写程序。这样的人被被称为\
  \ `programmer`（程序员）。\n\n### 告诉计算机要做什么\n\n你对计算机所做的一切都涉及到大量的代码。例如，每一款电脑游戏实际上都是一大堆（不，是“非常非常大”的一堆！）计算机代码。在某个时刻，总有人得编写出游戏程序：\n\
  \n```\nif (person.touches(goldenRing)) {\n    person.getPoints(10);\n}\n```\n\n\
  毫无疑问，编写程序的人拥有宝贵的技能。这些人有两个两个重要的特质：\n\n*   他们知道如何将大问题拆分为更小的、逐步执行的步骤。\n*   他们能够用非常精确的语言表达这些步骤。\n\
  \n编写步骤的语言被称为 `programming language`（编程语言），而 Java 只是几千种实用编程语言之一。示例 1-1 中的内容是用 Java\
  \ 编程语言编写的。\n\n### 选择你的“毒药”\n\n这本书并不是关于编程语言之间的差异的，但你应该看一些其他语言的代码，以便理解大局。例如，还有另一种语言叫\
  \ Visual Basic，它的代码看起来与 Java 编写的代码略有不同。Visual Basic 程序的一个片段可能像这样：\n\n```\nIf columnNumber\
  \ > 60 Then\n    Call wrapToNextLine\nElse\n    Call continueSameLine\nEnd If\n\
  ```\n\nVisual Basic 代码看起来比示例 1-1 中的 Java 代码更像普通的英语。但是，如果你认为 Visual Basic 像英语，那么看一眼用\
  \ COBOL 编写的代码：\n\n```\nIF COLUMN-NUMBER IS GREATER THAN 60 THEN\n    PERFORM WRAP-TO-NEXT-LINE\n\
  ELSE\n    PERFORM CONTINUE-SAME-LINE\nEND-IF.\n```\n\n在光谱的另一端，你会发现像 Haskell 这样的语言。这里有一个短的\
  \ Haskell 程序，以及程序的输入和输出：\n\n```\nmedian aList =\n  [ x | x <- aList,\n    length([y\
  \ | y <- aList, y < x]) ==\n    length([y | y <- aList, y > x])]\n*Main> median\
  \ [4,7,2,1,0,9,6]\n[4]\n```\n\n计算机语言之间可能非常不同，但在某些方面，它们又是相同的。当你习惯了编写 `IF COLUMN-NUMBER\
  \ IS GREATER THAN 60` 时，你也可以习惯编写 `if (columnNumber > 60)`。这只是将一组符号替换为另一组符号的心理替换。最终，编写像\
  \ `if (columnNumber > 60)` 这样的内容将成为本能。\n\n## 从你的大脑到计算机处理器\n\n当你创建一个新的计算机程序时，你会经历一个多步骤的过程。该过程涉及三个重要的工具：\n\
  \n*   **编译器 (Compiler)：** 编译器将你的代码翻译成计算机友好（但人类不友好）的指令。\n*   **虚拟机 (Virtual machine)：**\
  \ 虚拟机按步骤执行计算机友好的指令。\n*   **应用程序接口 (Application programming interface)：** 应用程序接口包含了有用的预写代码。\n\
  \n接下来的三个章节将描述这三个工具。\n\n### 翻译你的代码\n\n你可能听过计算机处理 0 和 1。这确实是真的，但它意味着什么呢？首先，计算机电路并不直接处理字母表中的字母。当你屏幕上看到\
  \ `Start` 这个词时，计算机在内部将该单词存储为 `01010011 01110100 01100001 01110010 01110100`。你看到看起来友好的五个字母单词时的感觉，是你对计算机屏幕像素的解释，仅此而已。计算机将一切拆解为极低级的、不友好的\
  \ 0 和 1 序列，然后将它们重新组合，以便人类处理结果。\n\n那么当你编写计算机程序时发生了什么？嗯，程序必须被翻译成 0 和 1。这种翻译过程的正式名称是\
  \ `compilation`（编译）。没有编译，计算机无法运行你的程序。\n\n我编译了示例 1-1 中的代码。然后我进行了一些无害的黑客操作来帮助查看它。\n\
  \n\n\n\n\n## 图 1-4：计算机如何运行 Java 程序。\n\n图 1-4 中的指令告诉计算机如何遵循其他指令。计算机的第一条指令并不是从内存中\
  \ `Get columnNumber`（获取列号），而是：“执行字节码文件中写着要执行的操作。”（当然，在字节码文件中，第一条指令恰好就是从内存中 `Get\
  \ columnNumber`。）\n\n有一个特殊的软件来执行图 1-4 中的指令。这件特殊的软件被称为 `Java Virtual Machine`（简称\
  \ `JVM`）。`JVM` 引导你的计算机执行某些字节码指令。当你运行一个 Java 程序时，你的计算机实际上在运行 `JVM`。该 `JVM` 会逐个字节地、一个接一个字节地检查你的字节码，并执行字节码中描述的指令。\n\
  \n有很多很好的比喻可以描述 `JVM`。把 `JVM` 想象成一个代理人、一个跑腿的或一个中间人。通过某种方式，你面临了图 1-5 所示的情况。在 (a) 端是你使用大多数编程语言时的情况——计算机运行某些机器代码。在\
  \ (b) 端是 Java 的情况——计算机运行 `JVM`，而 `JVM` 遵循字节码的指令。\n\n![9781118407813-fg0105.tif](img/9781118407813-fg0105_fmt.png)\n\
  \n## 图 1-5：运行计算机程序的两种方式。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 你的计算机硬盘可能有名为\
  \ `javac` 和 `java` 的文件（或 `javac.exe` 和 `java.exe`）。`java`（或 `java.exe`）文件包含了之前在图\
  \ 1-4 中所示的指令——即 `JVM` 中的指令。作为一名 Java 程序员，你经常告诉计算机运行一个 Java 程序。你的计算机通过在后台运行 `java`\
  \ 文件中的指令来完成这一愿望。\n\n### 你可以使用的代码\n\n在 20 世纪 80 年代初，我的表弟 Chris 在一家计算机软件公司工作。该公司为文字处理机编写代码。（在当时，如果你想在不用打字机的情况下编写文档，你就买一台除了文字处理之外什么都不干的“计算机”。）Chris\
  \ 抱怨被要求反复编写同样的老旧代码。“首先，我写一个搜索替换程序。然后我写一个拼写检查器。接着我又写了另一个搜索替换程序。然后是一个不同类型的拼写检查器。最后，是一个更好的搜索替换程序。”\n\
  \nChris 是如何对工作保持兴趣的？Chris 的雇主又是如何经营的？每隔几个月，Chris 就必须重新发明轮子。扔掉旧的搜索替换程序并从头开始写新程序。这太低效了。更糟糕的是这很无聊。\n\
  \n多年来，计算机专家一直在寻找圣杯——一种编写软件的方法，以便于复用。不要反复编写和重写你的搜索替换代码。只需将任务分解成微小的部分。一个部分搜索单个字符，另一个部分寻找空格，第三部分将一个字母替换为另一个字母。当你拥有所有部分后，只需将这些部分组合成一个搜索替换程序即可。以后当你你想为你的文字处理软件设计新功能时，只需以稍微不同的方式重新组装这些部分。这是明智的、有成本效益的，而且有趣得多。\n\
  \n20 世纪 80 年代后期，软件开发取得了若干进展，到 20 世纪 90 年代初，许多大型编程项目已通过预制组件编写。Java 在 1995 年出现，因此该语言的创始人创建一个可复用的代码库是理所当然的。该库包含了\
  \ 250 多个程序，包括处理磁盘文件的代码、创建窗口的代码以及通过互联网传递信息的代码。自 1995 年以来，该库已增长到包含 4000 多个程序。这个库被称为\
  \ `Application Programming Interface`（简称 `API`，应用程序接口）。\n\n每个 Java 程序，即使是最简单的程序，也会调用\
  \ Java `API` 中的代码。这个 Java `API` 既实用又强大。它之所以实用，是因为你可以用 `API` 中的程序做很多事情。它之所以强大，是因为\
  \ `API` 极其详尽。没有人能记住 Java `API` 提供的所有功能。程序员会记住他们经常使用的功能，并在急需时查找需要的功能。他们会在名为 `API\
  \ Specification`（API 规范，大多数 Java 程序员亲切地称其为 `API documentation` 或 `Javadocs`）的在线文档中查找这些功能。\n\
  \n`API documentation`（参见 [`docs.oracle.com/javase/8/docs/api/`](http://docs.oracle.com/javase/8/docs/api/))）描述了\
  \ Java `API` 中的数千个功能。作为一名 Java 程序员，你每天都会查阅这份 `API documentation`。你可以在 Oracle 网站上对该文档进行书签标记。\n\
  \n## 编程工具集\n\n编写 Java 程序，你需要之前描述的工具：\n\n*   **你需要编译器。**（参见翻译代码）\n*   **你需要 JVM。**（参见运行代码）\n\
  *   **你需要 API。**（参见使用代码）\n*   **你需要访问 API 文档。**（再次参见使用代码）\n\n你还需要一些不那么奇特的工具：\n\n\
  *   **你需要一个编辑器来编写程序。**  1-1 包含了程序的一部分。编辑器非常像 Microsoft Word，或者像任何其他文字处理程序。巨大的区别在于编辑器不会为你的文本添加格式——没有加粗、斜体或字体区分。计算机程序没有任何格式。它们除了普通的字母、数字和其他熟悉的键盘字符之外，什么都没有。\n\
  \n    当你编辑程序时，你可能会看到加粗、斜体和多种颜色的文本。但你的程序并不包含这些格式。如果你看到看起来像格式的内容，那是因为你使用的编辑器具有*语法高亮*。通过语法高亮，编辑器使文本看起来经过了格式化，以便你理解程序的结构。相信我，语法高亮非常有帮助。\n\
  \n## 最理想的情况\n\n在最理想的世界里，你通过一个友好的界面完成所有的程序编辑、文档阅读和命令发布。这个界面被称为*集成开发环境* (*IDE*)。\n\
  \n\n\n\n典型的 `IDE` 将你的屏幕工作区域分为几个窗格——一个窗格用于编辑程序，另一个窗格用于列出程序名称，第三个窗格用于发布命令，其他窗格帮助你编写和测试程序。你可以安排这些窗格以便快速访问。此外，如果你更改了一个窗格中的信息，`IDE`\
  \ 会自动更新所有其他窗格中的信息。\n\n`IDE` 帮助你从编程任务的某一部分无缝移动到另一部分。有了 `IDE`，你就不需要担心编辑、编译和运行 `JVM`\
  \ 的机械性工作。相反，你可以担心编写程序的逻辑。（你还不是知道吗？无论如何，你总会有有事情要担心！）\n\n### 你的硬盘上现在已经有了什么？\n\n你可能已经拥有了创建\
  \ `Java` 程序所需的一些工具。但是，在较旧的电脑上，你的工具可能已经过时了。本书大多数示例都运行在所有版本的 `Java` 上。但某些示例不在 `Java\
  \ 5.0` 之前的版本上运行。其他示例仅运行在 `Java 6`、`Java 7`、`Java 8` 或更高版本上。\n\n最稳妥的办法是从 `java.com`\
  \ 或 `Oracle` 网站重新下载工具。要获取有关下载的详细说明，请参见第 2 章。\n\n### Eclipse\n\n本书中的程序适用于任何可以运行 `Java`\
  \ 的 `IDE`。这包括 `NetBeans`、`IntelliJ IDEA`、`JDeveloper`、`JCreator` 等 `IDE`。你甚至可以在没有\
  \ `IDE` 的情况下运行程序。为了为了书中的示例，我使用了 `Eclipse` IDE。我选择 `Eclipse` 而不是其他 `IDEs` 有以下几个原因：\n\
  \n* `Eclipse` 是免费的。\n* 在所有的 `Java IDEs` 中，`Eclipse` 是专业程序员最常用的。\n* `Eclipse` 有很多花功能，但你可以忽略其中大部分功能，并学习重复几次例行的步骤序列。在使用\
  \ `Eclipse` 几次后，你的大脑会自动执行这些例行步骤。从那时起，你就可以停止担心 `Eclipse` 并专注于 `Java` 编程了。\n* `Eclipse`\
  \ 是免费的。（这值得提两次。）\n\n# 第 2 章：设置你的电脑\n\n## 本章内容\n\n* ![arrow](img/arrow.png) 安装 Java\n\
  * ![arrow](img/arrow.png) 下载并安装 `Eclipse` 集成开发环境\n* ![arrow](img/arrow.png) 检查你的\
  \ `Eclipse` 配置\n* ![arrow](img/arrow.png) 获取书中示例中的代码\n\n本书告诉你如何编写 `Java` 程序，而在你编写\
  \ `Java` 程序之前，你需要一些软件。至少，你需要的我在第 1 章中描述的软件——一个 `Java` 编译器和一个 `Java Virtual Machine`（简称为\
  \ `JVM`）。你也可以使用一个良好的集成开发环境（`IDE`）和一些示例代码来入门。\n\n编写 `Java` 程序所需的所有软件都是免费的。这些软件分为三个下载包——一份来自本书的网站，另一份来自\
  \ `Oracle`，第三份来自 `eclipse.org`。\n\n![remember.eps](img/remember_fmt.png) 我在本章描述的\
  \ `Oracle` 和 `Eclipse` 网站总在变化。你从这些网站下载的软件也会发生变化。诸如“点击右上角的按钮”之类的特定指令很快就会过时（甚至产生误导）。因此，在本章中，我提供了详尽的步骤列表，但也描述了步骤背后的思想。浏览每个建议的网站，并寻找获取我描述的软件的方法。当一个网站为你提供几个选项时，请检查本章中的说明以获取选择最佳选项的提示。如果你的电脑上的\
  \ `Eclipse` 窗口看起来和本章插图中的窗口不太一样，请扫描你的电脑窗口寻找我描述的任何选项。如果在尝试了这一切之后，你仍然找不到想要的内容，请检查本书的网站（[`allmycode.com/BeginProg``](http://allmycode.com/begin-prog)）或向\
  \ `BeginProg@allmycode.com` 向我发送电子邮件。你也可以在 Facebook 上的 `/allmycode` 或 Twitter 上的\
  \ `@allmycode` 找到我。\n\n## 如果你不喜欢阅读说明书……\n\n我在本章的开头非常简要（但很有用）地概述了获取所需软件的步骤。如果你是安装软件的老手，而且如果你的电脑并不古怪，这些步骤可能对你很有帮助。如果不是，你可以阅读后面几节中更详细的说明。\n\
  \n以下是获取创建 `Java` 程序软件的方法：\n\n1. **访问** [`http://allmycode.com/BeginProg`](http://allmycode.com/beginprog)\
  \ **并下载包含书中所有程序示例的文件。**\n2. **访问** [`www.oracle.com/technetwork/java/javase/downloads`](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ **获取最新版本的 `JDK` 版本。**\n   选择一个与你的操作系统（Windows、Macintosh 或其他）匹配的软件版本。如果你在选择 32\
  \ 位软件和 64 位软件之间有困难，32 位版本更安全。如果你在 `JRE` 和 `JDK` 之间有困难，请选择 `JDK`。\n   ![tip.eps](img/tip_fmt.png)\
  \ 如果你赶时间（谁不呢？），访问 [`http://java.com`](http://java.com) 可能会有帮助。java.com` 网站提供了一个省心的一键\
  \ `Java` 安装程序。（只需点击巨大的 `Java Download` 按钮。）`Java Download` 按钮在所有电脑上都有效。但如果对你有效，挥一下虚拟魔棒，你就完成了这一步。你可以跳过\
  \ `oracle.com` 网站的复杂性，直接进入第 3 步。\n3. **访问** [`http://eclipse.org/downloads`](http://eclipse.org/downloads)\
  \ **获取 `Eclipse IDE`。**\n   选择 `Eclipse IDE For Developers`。下载的结果压缩存档（Windows 为\
  \ `.zip` 文件；其他操作系统包括 macOS X 为 `.tar.gz` 文件）。\n4. **解压下载的 `Eclipse` 存档。**\n   存档包含一个名为\
  \ `eclipse` 的文件夹。将此 `eclipse` 文件夹解压到电脑硬盘方便的地方。例如，在我的 Windows 电脑上，我有 `C:\\eclipse`\
  \ 文件夹。在我的 Mac 上，我在 `Applications` 文件夹中有一个 `eclipse` 文件夹。\n   ![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 在 Windows 中，“Program Files”中的空格会干扰某些 `Java` 。我不认为本书的任何软件会有这种问题，但我无法保证。所以，如果你愿意，可以将\
  \ `Eclipse` 解压到 `C:\\Program Files` 或 `C:\\Program Files (x86)` 文件夹。但请记住你的选择（以防遇到任何问题）。\n\
  5. **启动 `Eclipse` 并点击欢迎屏幕上的 `Workbench` 图标。**\n   最初，欢迎屏幕上的图标没有文字标签。但当你悬停在图标上时，会出现工具提示。选择工具提示标题为\
  \ `Workbench` 的图标。\n6. **在 `Eclipse` 中导入你在第 1 步中下载的代码。**\n\n关于这些内容的详细信息，请参见后面几节。\n\
  \n## 获取书中的示例程序\n\n要获取书中示例程序的副本，请访问 [`allmycode.com/BeginProg``](http://allmycode.com/begin-prog)\
  \ 并点击链接下载书中程序。将下载的文件 `BeginProgJavaDummies4.zip` 保存到你的电脑硬盘上。\n\n\n\n你可以访问 [www.oracle.com/technetwork/java/javase/downloads](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ 获取最新、最出色的 Java 版本。寻找 `JDK` 的最新可用版本。选择一个运行于你电脑操作系统上的版本。图 2-1 显示我在 Oracle 网站上点击\
  \ `Download JDK` 按钮（大约 2014 年 3 月）。\n\n![9781118407813-fg0201.tif](img/9781118407813-fg0201_fmt.png)\n\
  \n图 2-1：获取 Java `JDK`。\n\n如果你无法确定最合适的 Java 版本，或者想知道 `JRE` 和 `JDK` 这两个缩写代表什么，请参阅侧边栏“Eenie,\
  \ meenie, miney mo”。\n\n在你接受许可协议并点击 Java 安装文件链接后，你的电脑会执行以下两种操作之一：\n\n*   在你的系统上下载并安装\
  \ Java。\n*   下载 Java 安装文件并将文件保存在你电脑的硬盘上。\n\n如果安装自动开始，请按照说明进行操作，对任何提示回答“是”，并（除非你有充分理由不这样做）接受默认设置。如果安装没有自动开始，请双击下载的安装文件来启动安装。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 如果你的电脑运行 Linux，下载的文件可能是 `.tar.gz`\
  \ 文件。`.tar.gz` 文件是一个压缩包。将压缩包的内容解压到你选择的文件夹中，并遵循 Oracle 网站上发布的安装说明。\n\n关于文件名、文件类型和存档的更多信息，请参阅本章中的侧边栏“Those\
  \ pesky filename extensions”和“Compressed archive files”。\n\n![ontheweb.eps](img/ontheweb_fmt.png)\
  \ 当你访问 [www.oracle.com/technetwork/java/javase/downloads](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ 时，你还可以下载一份 Java API 文档。寻找标记为 Java SE Development Kit Documentation（或类似名称）的下载包。接受许可协议，点击下载链接，观察文件流向你电脑的硬盘。下载的文件是一个压缩的\
  \ `.zip` 存档，因此你可以像解压其他此类存档包一样解压它。（解压后的文件夹是一堆网页。要开始阅读 Java API 文档，请在该文件夹中寻找 `index`\
  \ 文件或 `index.html` 文件。双击该文件，你就可以开始了。）\n\n![tip.eps](img/tip_fmt.png) 有关 Java API\
  \ 文档的介绍，请参阅第 1 章。\n\n大多数人在访问 Oracle 网站 [`oracle.com/`](http://oracle.com/) 并使用网站菜单安装\
  \ Java 时没有遇到困难。但如果你的情况比大多数人更“有趣”，你可能需要做出一些决定并执行一些额外的步骤。接下来的几节描述了其中一些“有趣的”场景。\n\n\
  ### 在你的电脑上寻找 Java\n\n第 1 章描述了 Java 生态系统，包括它的编译器、虚拟机和其他部分。你的电脑可能已经有了这些 Java 小工具了。如果是这样，你可以继续使用已有的，也可以在系统中已有的任何内容上添加最新版本的\
  \ Java。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) Java 的版本并不像室内猫咪。它们可以在同一台电脑上共存，而不会互相打斗或嘶叫。如果你的电脑上有一个以上的版本的\
  \ Java，那就没问题。你甚至可以在同一台电脑上混合使用 32 位和 64 位版本（只要你至少有一个 Java 版本的字长与你的 Eclipse 版本匹配即可）。我的\
  \ Windows 8 电脑上有三个版本的 Java，我从没有遇到过麻烦。（偶尔，我会因为混淆了某个 Java 版本和另一个版本而自找麻烦。但本章的“在 Eclipse\
  \ 中配置 Java”部分能帮我理清思路。如果没有这本书在身边，我该怎么办？）\n\n要找出你已经拥有什么，并可能避免重新安装 Java，请继续阅读。\n\n\
  #### 在 Windows 8 上\n\n在启动屏幕上，按住 Windows 键点击 Q。在出现的搜索框中，输入 `Programs and Features`\
  \ 然后按回车。然后进入“所有 Windows 版本（XP 及更高版本）”部分。\n\n#### 在 Windows 7 上\n\n选择 `开始⇒控制面板⇒程序⇒程序和功能`。然后按照“所有\
  \ Windows 版本（XP 及更高版本）”部分中的说明操作。\n\n#### 在 Windows XP 上\n\n选择 `开始⇒控制面板⇒添加或删除程序`。然后按照“所有\
  \ Windows 版本（XP 及更高版本）”部分的操作。\n\n#### 在所有 Windows 版本（XP 及更高）中\n\n在列表中查找 `Java`（参见图\
  \ 2-2）。如果你看到的 Java 版本是 8 或更高，则没问题。如果你看到的 Java 版本低于 8，请查看 ![9781118407813-fg0201.tif](img/9781118407813-fg0201_fmt.png)\
  \ 图 2-2：Windows 程序和功能。![tip.eps](img/tip_fmt.png) 如果版本号是 5.0 或，你可以运行许多（并非所有）。\n\n\
  #### 在 Mac 上\n\nMac 电脑可以支持多种版本的 Java —— 一是 Apple 内部开发的，另一种由 Oracle 开发的。要查找 Apple\
  \ 的 Java，请查看 `/System/Library/Java Machines`。但要查找 Oracle 的 Java，请查看 `/Library/JavaMachines`。\n\
  \nTiger、Leopard 和 Snow Leopard（OS X 10.4、OS X 10.5 和 OS X 10.6）预装了 Java。Lion、Mountain\
  \ Lion 和 Mavericks（OS X 10.7、OS X 10.8 或 OS X 10.9）没有预装 Java。当你第一次运行需要 Java 的应用程序时，Lion、Mountain\
  \ Lion 或 Mavericks 会提示你安装 Apple 的 Java 或 Oracle 的 Java。例如，在本章后面你会安装 Eclipse。当你第一次尝试启动\
  \ Eclipse 时，如果还没有 Java，系统会建议你安装。\n\n表 2-1 描述了 Mac OS 与 Java 版本之间的对应关系。\n\n表 2-1\
  \ Mac OS 版本与 Java 版本\n\n| 如果你有这个 Mac OS 版本 … | 那么你有这个 Java 版本 … | 你可以可以安装 |\n| :---\
  \ | :--- | :--- |\n| OS X 10.4.11 (Tiger) | Apple 的 Java 5.0 | Apple 的 Java 5.0\
  \ |\n| OS X 10.5.8 (Leopard) PowerPC 且/或 32 位 | Apple 的 Java 5.0 | Apple 的 Java\
  \ 5.0 |\n| OS X 10.5.8 (Leopard) Intel 架构且是 64 位 | Apple 的 Java 6 | Apple 的 Java\
  \ 6 |\n| OS X 10.6.8 (Snow Leopard) | Apple 的 Java 6 | Apple 的 Java 6 |\n| OS X\
  \ 10.7.5 (Lion) | (没有 Java) | Apple 的 Java 6Oracle 的 Java 8 |\n| OS X 10.8.5 (Mountain\
  \ Lion) | (没有 Java) | Apple 的 Java 6Oracle 的 Java 8 |\n| OS X 10.9 (Mavericks) |\
  \ (没有 Java) | Apple 的 Java 6Oracle 的 Java 8 |\n\n要弄清楚你运行的是哪个版本的 OS X，请执行以下操作：\n\n\
  1.  选择 `Apple⇒关于本机`。\n\n2.  在出现的“关于本机”对话框中，寻找 `版本` 字样。\n\n    你会看到非常浅灰色字体显示的版本 10.9.2（或类似的内容）。\n\
  \n\n\n\n![tip.eps](img/tip_fmt.png) 表 2.1 中的信息适用于更新后的 Mac OS X 版本。如果你不定期进行软件更新，你运行的可能是\
  \ `OS X 10.8.1` 而不是 `10.8.5`。如果是这样，请在 Apple 菜单中选择 `Software Update` 并按照出现的提示进行操作。\n\
