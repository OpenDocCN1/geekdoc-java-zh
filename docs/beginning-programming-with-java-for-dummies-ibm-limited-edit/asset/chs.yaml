  \ 9 次。这很好。这正是我想要的。\n\n## 重复直到你得到所需的内容（Java do 语句）\n\n我在第 12 章中引入了 Java 的 `while`\
  \ 循环。当你创建一个 `while` 循环时，先编写循环的条件。在条件之后，你编写重复执行的代码。\n\n```java\nwhile (条件) {\n  \
  \  重复执行的代码\n}\n```\n\n这种编写 `while` 语句的方式并非偶然。该语句的形式强调了一个重要的一点——计算机在执行任何重复代码之前总是会检查条件。\n\
  \n如果循环的条件永远为真，那么循环内部的内容就永远不会执行——即使只有一次也不行。事实上，你可以轻松地构造一个语句从不执行的 `while` 循环（尽管我想不出你为什么会想那样做）：\n\
  \n```java\n//这部分代码不打印任何内容：\nint twoPlusTwo = 2 + 2;\nwhile (twoPlusTwo == 5) {\n\
  \    out.println(\"你在开玩笑吗？\");\n    out.println(\"2+2 不等于 5。\");\n    out.print(\"\
  大家都知道\");\n    out.println(\" 2+2 等于 3。\");\n}\n```\n\n尽管有这个幼稚的 `twoPlusTwo` 例子，`while`\
  \ 语句证明是 Java 循环结构中最实用的。特别是，`while` 循环适用于你必须“三思而后行”的情况。例如：“只要我的账户里还有钱，每个月就写一张房贷支票。”当你第一次遇到这个语句时，如果账户余额为零，你不想写房贷支票。\n\
  \n\n\n\n考虑一个删除文件的程序。在删除文件之前，程序会向用户请求确认。如果用户输入 `Y`，则删除；如果用户输入 `N`，则不删除。当然，删除文件是一件严肃的事。将一次错误的按键误认为是“是”的回答可能会删除公司的记录。（而将一次错误的按键误认为是“否”的回答则可能会保留公司的有罪证据。）因此，如果对用户的应答有任何疑问，程序应该要求用户再次回答。\n\
  \n停下来思考一下动作的执行流 —— 当计算机执行循环时，什么应该发生，什么不应该发生。这种类型的循环在获取用户的第一个响应之前不需要检查任何内容。事实上，在用户给出第一个响应之前，循环中没有什么东西是可以检查的。循环不应该以“只要用户的响应无效，就从用户那里获取另一个响应”开始。相反，循环应该直接跳跃，获取用户的响应，然后检查该响应是否符合逻辑。执行所有这些操作的代码位于列表\
  \ 15-4 中。\n\n列表 15-4：在删除之前重复\n\n```java\n/*\n * 免责声明：作者、Wiley 出版公司\n * Inc. 以及任何与此本书创作有细微联系的人，\n\
