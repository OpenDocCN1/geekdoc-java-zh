  \ whichRoom;\n        out.print(\"Which room? \");\n        whichRoom = keyboard.nextInt();\n\
  \        for (int roomNum = 0; roomNum < whichRoom; roomNum++){\n            diskScanner.nextInt();\n\
  \        }\n        out.print(\"Room \");\n        out.print(whichRoom);\n     \
  \   out.print(\" has \");\n        out.print(diskScanner.nextInt());\n        out.println(\"\
  \ guest(s).\");\n        keyboard.close();\n        diskScanner.close();\n    }\n\
