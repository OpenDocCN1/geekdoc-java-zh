  \n* Rick Ross 在我写的另一本书里读到过关于“剥猫皮”的内容，他通过电子邮件给我了这些信息：“……你提到了‘剥猫皮’并继续讨论了猫砂盆之类的东西。请注意，‘剥猫皮的方法不止一种’这个句子指的是从鲶鱼身上去除不可食皮肉的困难性，而且做这件事有多种方法。这些方法从将动物的尾巴钉在板上并用钳子剥下来，到让那种长了毛的猫自己拥有那该死的东西而干脆不管它不等。我是在河边长大的（那条从美国南北流过的、以\
