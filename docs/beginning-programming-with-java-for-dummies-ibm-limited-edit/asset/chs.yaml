  \ ‘O Nine Tails）是那种鞭子的名字，而且系绳子或‘剥皮’鞭子的方法不止一种。”无论如何，我是时候向我的小宠物道歉了。\n\n# 第 10 章：他去哪儿了？\n\
  \n## 本章内容\n\n- ![arrow](img/arrow.png) 理顺复杂的条件\n- ![arrow](img/arrow.png) 编写酷的条件代码\n\
  - ![arrow](img/arrow.png) 让你的 if 语句交织\n\n又到报税季节了。目前，我正在处理 12432-89B 表。它是这样说的：\n\n\
  如果你已婚且孩子少于三个，且你的收入高于 EIQ（预计收入配额），或者如果你单身且居住在非住宅区（根据《统一分区法案》第 10 节第 iii 部分），并且你是\
  \ LLC（有限责任公司）自雇或你符合退军人福利条件，那么根据你对问题 2a 和 3d 的回答，跳过步骤 3 和 4，或者步骤 4、5 和 6。\n\n难怪我没时间写东西！我太忙于解读这些税表了。\n\
  \n总之，本章涉及 if 语句的潜在复杂性。本章中没有像 12432-89B 表那样复杂的东西，但如果你以后遇到那么复杂的事情，你就已经准备好了。\n\n##\
  \ 构建更大、更好的条件\n\n在代码列表 9-2 中，本章没有像 12432-89B 表那样复杂的东西，但如果你以后遇到那么复杂的事情，你就已经准备好了。\n\
  \n\n\n\n![warning.eps](img/warning_fmt.png) 在 Java 中，你不能像在普通英语中那样组合比较运算符。在英语中，你可能会说：“晚宴桌上将会有三到十个人。”但在\
  \ Java 中，如果你写成 `3 <= people <= 10`，就会得到一个错误信息。要进行这种比较，你需要使用类似 `3 <= people && people\
  \ <= 10` 这样的代码。\n\n## 合并条件：一个示例\n\n这是一个关于逻辑运算符使用的简用示例。某电影院公布了入场票价：\n\n* 普通票：$9.25\n\
  * 12 岁以下儿童：$5.25\n* 老年人（65 岁及以上）：$5.25\n\n由于儿童和老年人的价格相同，你可以将这些价格合并到一个类别中。（这并不总是最好的编程策略，但在这个示例中尽管这样做这样做吧。）为了找到某个特定观影观众的票价，你需要一个或多个\
  \ `if` 语句。你可以以许多方式结构化条件，我为列表 10-1 中的代码选择了这些方法之一。\n\n列表 10-1：你付得太多钱了吗？\n\n```java\n\
  import java.util.Scanner;\n\nclass TicketPrice {\n\n    public static void main(String\
  \ args[]) {\n        Scanner keyboard = new Scanner(System.in);\n        int age;\n\
  \        double price = 0.00;\n        System.out.print(\"How old are you? \");\n\
  \        age = keyboard.nextInt();\n        if (age >= 12 && age < 65) {\n     \
  \       price = 9.25;\n        }\n        if (age < 12 || age >= 65) {\n       \
  \     price = 5.25;\n        }\n        System.out.print(\"Please pay $\");\n  \
  \      System.out.print(price);\n        System.out.print(\". \");\n        System.out.println(\"\
  Enjoy the show!\");\n        keyboard.close();\n    }\n}\n```\n\n图 10-2 显示了 `TicketPrice`\
  \ 程序的多次运行（参见列表 10-1）。（为了方便阅读，我将运行结果从 Eclipse 的控制台复制到了 Windows 记事本中。）当你满 12 岁时，你开始支付全价。你一直支付全价直到你\
  \ 65 岁。到那个时候，你再次支付优惠价。\n\n列表 10-1 的关键部分是中间的一块 `if` 语句，它们在图 10-3 中所示。\n\n![9781118407813-fg1002.tif](img/9781118407813-fg1002_fmt.png)\n\
  图 10-2：《初学者学 Java 编程：电影版》的入场票价。\n\n![9781118407813-fg1003.tif](img/9781118407813-fg1003_fmt.png)\n\
  图 10-3：列表 10-1 中条件的含义。\n\n* 第一个 `if` 语句的条件测试的是普通票价组。任何年满 12 岁*且*未满 65 岁的人都属于这个组。\n\
  * 第二个 `if` 语句的条件测试的是边缘年龄。小于 12 岁*或*满 65 岁及以上的人属于这一类别。\n\n![tip.eps](img/tip_fmt.png)\
  \ 当你形成现有条件的对反条件时，你通常可以遵循列表 10-1 中的模式。`>=` 的反面对 `<`。`<` 的反面对 `>=`。`&&` 的反面对是 `||`。\n\
  \n![warning.eps](img/warning_fmt.png) 如果你更改了列表 10-1 中的金额，可能会遇到麻烦。例如，使用语句 `price\
  \ = 5.00`，程序会显示 `Please pay $5`。这是因为 Java 不存储小数点后的零（并且不知道或不在乎 `5.00` 是一个货币金额）。要修复此类问题，请参阅第\
  \ 18 章关于 `NumberFormat.getCurrencyInstance` 的讨论。\n\n## 何时初始化\n\n看看列表 10-1 并注意：\n\
  `double price = 0.00;`\n这一行声明了 `price` 变量并将其初始值设置为 `0.00`。如果省略了这个初始化，我会得到一个错误：`variable\
  \ might not have been initialized`。编译器为什么纠结 `price` 变量？答案在于 `age` 赋值的位置。考虑以下两个事实：\n\
  * `age = keyboard.nextInt();` 语句为 `age` 赋值，它不在 `if` 语句内部。\n* `price = 9.25` 和 `price\
  \ = 5.25` 这两个为 `price` 赋值的语句位于 `if` 语句内部。如果你查看图 10-3，你会发现每个年龄段都被覆盖了。当你运行 `TicketPrice`\
  \ 程序时，只要有一个 `if` 条件为真，`price` 就会被赋值。如果没有这个初始化，`price` 就没有值。编译器并不足够聪明，知道 `price`\
  \ 总是会被赋值的。因此，在那个点，编译器会抛出异常。`System.out.print(price)` 语句只有在 `price` 有值时才能执行。\n\n\
  ## 更多条件\n\n昨晚我在比馆馆馆吃了一顿大餐。作为促销，我得到了一张优惠 2 美元的券。为了在 `TicketPrice` 程序中使用优惠券，我必须微调列表\
  \ 10-1。在图 10-5 中，我运行了该新代码几次。\n\n\n\n\n*   在第一个此类语句中，计算机检查 `reply` 变量存储的是字母 `Y` 还是字母\
  \ `y`。如果是其中一种情况，它就会从价格中减去 `2.00`。（有关如 `-=` 等运算符的信息，请参阅第 [7]章](#12_9781118407813-ch07.xhtml)。）\n\
  \n*   第二个此类语句包含一个非常复杂的条件。该条件测试 `reply` 变量是否存储了任何合理的值。如果 `reply` 既不是 `Y`，也不是 `y`，更不是\
  \ `N`，也不是 `n`，计算机就会通过显示“Huh?”来表达它的困惑。（作为一名付费客户，自动售票机屏幕上显示的“Huh?”一词无疑会引起你的注意。）\n\n\
  ![tip.eps](img/tip_fmt.png) 当你创建一个大的多部分条件时，你总有几种方法来考虑这个条件。例如，你可以将列表 10-2 中的最后一个条件重写为\
  \ `!(reply == 'Y' || reply == 'y' || reply == 'N' || reply == 'n')`。“如果回复不是 Y、y、N\
  \ 或 n，那么就显示‘Huh?’。”那么，哪种编写条件的方法更好呢——我在列表 10-2 中的写法，还是我在这个提示中的写法？这取决于你的喜味。哪种方法让你更容易理解逻辑，哪种就是更好的。\n\
  \n### 使用布尔变量\n\n无论程序有多优秀，你总是可以让它变得更好一点。看看列表 10-2 中的代码。这些 `if` 语句的森林让你感到紧张吗？当你阅读每个条件时速度是否慢得像爬一样？如果你能一眼看出一个条件并快速理解它，那不是很好吗？\n\
  \n在某种程度上，你可以做到的。如果你愿意创建一些额外的变量，就可以让你的代码更易读。列表 10-3 向你展示了如何做。\n\n列表 10-3：乔治·布尔会自豪\n\
  \n```java\nimport java.util.Scanner;\n\nclass NicePrice {\n    public static void\
  \ main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n  \
  \      int age;\n        double price = 0.00;\n        char reply;\n        boolean\
  \ isKid, isSenior, hasCoupon, hasNoCoupon;\n        System.out.print(\"How old are\
  \ you? \");\n        age = keyboard.nextInt();\n        System.out.print(\"Have\
  \ a coupon? (Y/N) \");\n        reply = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\
  \n        isKid = age < 12;\n        isSenior = age >= 65;\n        hasCoupon =\
  \ reply == 'Y' || reply == 'y';\n        hasNoCoupon = reply == 'N' || reply ==\
  \ 'n';\n\n        if (!isKid && !isSenior) {\n            price = 9.25;\n      \
  \  }\n        if (isKid || isSenior) {\n            price = 5.25;\n        }\n \
  \       if (hasCoupon) {\n            price -= 2.00;\n        }\n        if (!hasCoupon\
  \ && !hasNoCoupon) {\n            System.out.println(\"Huh?\");\n        }\n   \
  \     System.out.print(\"Please pay $\");\n        System.out.print(price);\n  \
  \      System.out.print(\". Enjoy the show!\");\n        keyboard.close();\n   \
  \ }\n}\n```\n\n列表 10-3 的运行结果看起来图 10-5 中的内容。列表 10-2 和 10-3 唯一的区别在于使用了布尔变量。在列表 10-3\
  \ 中，在开始任何 `if` 语句之前，你已经跳过了所有的小于号和双等号。当你遇到两个 `if` 语句时，条件可以使用简单的单词——像 `isKid`、`isSenior`\
  \ 和 `hasCoupon` 这样的词。有了这些变量，表达每个 `if` 语句都是轻而易举。你可以在第 [8]章](#13_9781118407813-ch08.xhtml)\
  \ 更多关于布尔变量的内容。\n\n添加布尔变量可以使你的代码更易管理。但某些编程语言没有布尔变量，因此许多程序员倾向于即时创建 `if` 条件。这就是为什么我在这书中混合了这两种技术（带有和不带布尔变量的条件）。\n\
  \n### 混合使用不同的运算符\n\n如果你读过列表 10-2，你就知道我当地剧院提供优惠券。问题是，我不能将优惠券与其他任何折扣一起使用。我试过说服售票员我不到\
  \ 12 岁，但他并不买账。行不通后，我尝试将优惠券与老年折扣结合。这也不行。剧院必须使用某些检查像我这样的人的软件。它看起来像列表 10-4 中的代码。要查看代码运行，请看图\
  \ 10-6。\n\n*(注：由于提供的原文存在大量重复和混乱，译文已根据上下文提取并整理了核心逻辑内容。)*\n\n\n\n\n在图 10-8 中，注意看 `y`\
  \ 和 `Y` 输入会产生不同的票价，尽管在两次运行中年龄都是 85 岁。这是因为，在没有括号的情况下，任何 `&&` 运算符都会在任何 `||` 运算符之前被求值。（这是\
  \ Java 编程语言的规则——先求值 `&&` 再求值 `||`。）当 `reply` 为 `Y` 时，那个错误的 `if` 语句中的条件呈现如下形式：\n\n\
  ```\nreply == 'Y' || some-other-stuff-that-doesn_t-matter\n```\n\n只要 `reply == 'Y'`\
  \ 为真，整个条件就会自动变为真，如图图 10-9 所示。\n\n![9781118407813-fg1009.tif](img/9781118407813-fg1009_fmt.png)\n\
  \n图 10-9：“真或假”导致了“真”。\n\n### 构建嵌套\n\n现在是 1968 年，《囚犯》（*The Prisoner*）正在电视上播放。在最后一集中，剧中的主角遇到了他的宿敌“一号”。起初，一号戴着一个诡异的笑脸/哭脸具，当面具摘掉后，下面是一个猴面具。要找出猴面具后面是什么，你必须看\
  \ DVD 版系列。但与此同时，请注意这种层次结构：嵌套中嵌套。你可以对 `if` 语句进行同样的操作。本节的示例将向你展示如何实现。\n\n但首先，看看列表\
  \ 10-4。在该代码中，条件 `age >= 12 && age < 65` 被测试了两次。两次，计算机都将数字 12、65 和 `age` 的值通过它复杂的电路；而且两次计算机都得到了相同的答案。这是很浪费，但浪费并不是你唯一关心的问题。\n\
  \n如果你决定更改老年票的年龄限制呢？从现在起，任何 100 岁以下的人都不获得老年折扣。你翻遍代码，看到了第一个 `age >= 12 && age < 65`\
  \ 测试。你将 65 改为 100，拍了拍自己的背，然后回家了。问题是，你改变了两个 `age >= 12 && age < 65` 测试之一，但没有改变另一个。如果把所有的\
  \ `age >= 12 && age < 65` 测试都保留在一个地方，不是更好吗？\n\n列表 10-5 派上了用场。在列表 10-5 中，我将所有的 `if`\
  \ 语句挤在一起成了一个大整体。代码很紧密，但它很好地完成了任务。\n\n### 列表 10-5：嵌套 if 语句\n\n```java\nimport java.util.Scanner;\n\
  \nclass AnotherAgeCheck {\n\n    public static void main(String args[]) {\n    \
  \    Scanner keyboard = new Scanner(System.in);\n        int age;\n        double\
  \ price = 0.00;\n        char reply;\n        System.out.print(\"How old are you?\
  \ \");\n        age = keyboard.nextInt();\n        System.out.print(\"Have a coupon?\
  \ (Y/N) \");\n        reply = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\n\
  \        if (age >= 12 && age < 65) {\n            price = 9.25;\n            if\
  \ (reply == 'Y' || reply == 'y') {\n                price -= 2.00;\n           \
  \ }\n        } else {\n            price = 5.25;\n        }\n        System.out.print(\"\
  Please pay $\");\n        System.out.print(price);\n        System.out.print(\"\
  . \");\n        System.out.println(\"Enjoy the show!\");\n        keyboard.close();\n\
  \    }\n}\n```\n\n### 嵌套 if 语句\n\n运行列表 10-5 中的代码看起来与运行列表 10-4 完全相同。你可以在图 10-6 中看到多次运行。列表\
  \ 10-5 的核心思想是将一个 `if` 语句放在另一个 `if` 语句内部。毕竟，第 9 章说 `if` 语句可以采取以下形式：\n\n```\nif (Condition)\
  \ {\n    Some\n} else {\n    Other\n}\n```\n\n谁说 `Some` 不能包含一个 `if` 语句呢？事实上，`Other`\
