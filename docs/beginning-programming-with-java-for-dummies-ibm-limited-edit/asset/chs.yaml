  \n## 静态方法\n\n你手里有一有一叠支票。每张支票都有一个号码、一个金额和一个收款人。你用自己的激光打印机打印这些支票。为了打印支票，你使用一个 Java\
  \ 类。从 `Check` 类创建的每个对象都有三个变量（`number`、`amount` 和 `payee`）。每个对象都有一个方法（一个 `print`\
  \ 方法）。你可以在图 18-7 中看到所有这些。\n\n![9781118407813-fg1807.tif](img/9781118407813-fg1807_fmt.png)\n\
