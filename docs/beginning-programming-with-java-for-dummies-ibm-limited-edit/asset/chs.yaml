  \nclass IHopeYouKnowWhatYoureDoing {\n  public static void main(String args[]) {\n\
  \    Scanner keyboard = new Scanner(System.in);\n    char reply;\n    do {\n   \
  \   System.out.print(\"Reply with Y or N...\");\n      System.out.print\n      \
  \   (\"  Delete the importantData file? \");\n      reply =\n          keyboard.findWithinHorizon(\"\
  .\", 0).charAt(0);\n    } while (reply != 'Y' && reply != 'N');\n    if (reply ==\
  \ 'Y') {\n      new File(\"importantData.txt\").delete();\n      System.out.println(\"\
  Deleted!\");\n    } else {\n      System.out.println(\"No harm in asking!\");\n\
  \    }\n    keyboard.close();\n  }\n}\n```\n\n### 删除文件\n\n图 15-6 显示了列表 15-4 程序的运行。在删除文件之前，程序询问用户是否可以删除。如果用户给出两个预期答案之一（Y\
