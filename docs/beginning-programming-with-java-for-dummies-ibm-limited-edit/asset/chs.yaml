  \n    图 20-5：从 `JFrame` 类创建的对象。在列表 20-1 中，当你\n\n```\nJFrame frame = new JFrame();\n\
  ```\n\n让一个变量指向一个新构造的对象。构造方法和方法有许多相似之处。你调用一个方法需要有该方法的声明（在 `nextLine` 的情况下，方法声明位于某处）。构造方法也是如此。你调用\
  \ `new JFrame()` 需要有 `JFrame` 类的构造方法。而且，在 Java API 中，你可以找到 `JFrame()` 的声明。代码看起来如下：\n\
  \n```\npublic class JFrame {\n    int height;\n    int width;\n    public Component\
  \ add() ...\n    public void setDefaultCloseOperation() ...\n    public void pack()\
  \ ...\n    public void setVisible() ...\n\n    /**\n     * 构建一个初始不可见的窗口。\n     */\n\
  \    public JFrame() {\n        ...\n    }\n    ...\n}\n```\n\n构造方法的声明看起来几乎像方法声明。但注意构造方法的声明并不以\
  \ `public void JFrame()` 或 `public double JFrame()` 或 `public anything JFrame()`开头。除了可选的\
  \ `public` 关键字外，构造方法只包含被构造类的类名。更多内容见下一节。\n\n## Swing 类：第二轮\n\n在你的 Java 之旅中，你会看到列表\
