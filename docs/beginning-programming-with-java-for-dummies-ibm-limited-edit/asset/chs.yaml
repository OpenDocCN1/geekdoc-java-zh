  \ 等的代码）。但现在它没有使用十个独立的变量，而是像列表 16-4 使用了一个数组。\n\n### 列表 16-4：正向和反向遍历数据\n\n```java\n\
  import java.util.Scanner;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
  \nclass VacanciesInReverse {\n    public static void main(String args[])\n     \
