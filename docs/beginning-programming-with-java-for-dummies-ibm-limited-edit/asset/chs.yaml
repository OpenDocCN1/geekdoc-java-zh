  *   恐慌。\n\n## 编写并运行你自己的代码\n\n上一节是关于运行别人的 Java 代码（你从本书网站下载的代码）。但最终，你将编写自己的代码。本节将向你展示如何使用\
  \ Eclipse IDE 创建代码。\n\n### 将你的程序与我的代码分开\n\n在第 2 章中，你从本书的网站下载了示例代码。然后你创建一个工作空间（workspace），并将示例代码导入其中。\n\
  \n你可以在同一个工作空间创建自己的项目。但如果你想将你的代码与我的分开，可以创建一个新的工作空间。这里是创建新工作空间的两种方法：\n\n*   **在 Eclipse\
  \ 启动器（Workspace Launcher）对话框的 Workspace 字段中输入一个新的文件夹名称。** 如果文件夹不存在，Eclipse 会创建它。如果文件夹已存在，Eclipse\
  \ 的资源管理器将列出其中包含的项目。\n\n*   **在 Eclipse 工作区的主菜单中，选择 File⇒Switch Workspace（见图 3-6）。**\
  \ 当你选择 `File⇒Switch Workspace` 时，Eclipse 会为你提供几个之前打开过的文件夹。如果你选择的文件夹不在列表中，选择 Other\
  \ 选项。随后，Eclipse 会重新打开启动器对话框。\n\n![9781118407813-fg0306.tif](img/9781118407813-fg0306_fmt.png)\n\
  \n图 3-6：切换不同的 Eclipse 工作空间。\n\n### 编写并运行你的程序\n\n以下是创建 Java 项目的方法：\n\n1.  启动 Eclipse。\n\
  2.  从 Eclipse 的菜单栏中，选择 File⇒New⇒Java Project。\n\n    出现 New Java Project 对话框。\n\
  3.  在新 Java Project 对话框中，为你的项目命名并点击 Finish。\n\n    在图 3-7 中，我使用了 `MyFirstProject`。\n\
  4.  在资源管理器中选择新创建的项目。\n\n    在图 3-8 中，我选择了 `MyFirstProject`。\n5.  在 Eclipse 的主菜单中，选择\
  \ File⇒New⇒Class。\n\n    在图 3-9 中，我选择了 `MyFirstProject`。\n6.  在新 Java Class 对话框的\
  \ Name 字段中，输入你的新类名称。\n\n    在本例示例中，我使用的名称是 `MyFirstJavaClass`，单词之间没有空格。\n7.  在 `public\
  \ static void main(String[] args)` 复选框中打钩。\n\n    你的勾选会告诉 Eclipse 创建一些样板 Java 代码。\n\
  8.  接受 New Java Class 对话框中其他所有默认设置（换句话说，点击 Finish）。\n\n    你甚至可以忽略对话框顶部附近的“Default\
  \ Package Is Discouraged”警告。\n\n\n\n\n\n点击 `Finish` 将你带回 Eclipse 的工作区。现在 `MyFirstProject`\
  \ 包含一个名为 `MyFirstJavaClass.java` 文件。为了方便起见，`MyFirstJavaClass.java` 文件已经包含了一些代码。Eclipse\
  \ 的编辑器显示了 Java 代码（参见图 3-10）。\n\n![9781118407813-fg0310.tif](img/9781118407813-fg0310_fmt.png)\n\
  \n图 3-10：Eclipse 在编辑器中编写了一些代码。\n\n#### 9. 替换新 Java 程序中的现有代码行。\n\n在 Eclipse 编辑器中输入一行代码。将该行：\n\
  \n```java\n// TODO Auto-generated method stub\n```\n\n替换为该行：\n\n```java\nSystem.out.println(\"\
  Chocolate, royalties, sleep\");\n```\n\n完全按照代码清单 3-1 中看到的样子复制新代码行。\n\n*   完全按照我在代码清单\
  \ 3-1 中的写法拼写每个单词。\n*   完全按照我在代码清单 3-1 中的方式大写每个单词。\n*   包含所有的符号符号——点、引号、分号，所有符号。\n\
  *   ![remember.eps](img/remember_fmt.png) 区分小写字母 `l` 和数字 `1`。单词 `println` 告诉计算机\
  \ `print` 一整 `line`。`println` 中的每个字符都是小写字母。该单词不包含数字。\n\n代码清单 3-1：显示我喜欢的事物的程序\n\n\
  ```java\npublic class MyFirstJavaClass {\n  /**\n   * @param args\n   */\n  public\
  \ static void main(String[] args) {\n    System.out.println(\"Chocolate, royalties,\
  \ sleep\");\n  }\n}\n```\n\n![warning.eps](img/warning_fmt.png) Java 是区分大小写的，这意味着\
  \ `system.out.printLn` 不同于 `System.out.println`。如果你输入 `system.out.printLn`，你的 `progrAm`\
  \ 将无法工作 (`worK`）。请确保你的代码大小写与代码清单 3-1 中的完全一致。\n\n![warning.eps](img/warning_fmt.png)\
  \ 如果从电子书中复制并粘贴代码，请检查代码中的引号是否为直引号 (\"\") 而弯引号（“”）。在 Java 程序中，直引号是正确的；弯引号会带来麻烦。\n\n\
  如果你输入的内容完全正确，你将看到图 3-11 中的内容。\n\n![9781118407813-fg0311.tif](img/9781118407813-fg0311_fmt.png)\n\
  \n图 3-11：Eclipse 编辑器中的 Java 程序。\n\n如果你输入的代码与代码清单 3-1 所示的不一致，你可能会在编辑器中看到锯齿状的红色下划线、带有\
  \ X 型标记的小型矩形或其他红色标记（参见图 3-12）。\n\n![9781118407813-fg0312.tif](img/9781118407813-fg0312_fmt.png)\n\
  \n图 3-12：输入错误的 Java 程序。\n\nEclipse 编辑器中的红色标记指的是你 Java 代码中的编译时错误。编译错误（也称为编译器错误）是阻止计算机翻译你代码的错误。（参见第\
  \ 1 章关于代码翻译的讨论。）\n\n![tip.eps](img/tip_fmt.png) 图 3-12 中的错误标记出现在 Java 程序的第 8 行。行号出现在编辑器的左边距。要让\
  \ Eclipse 编辑器显示行号，请选择 Windows 上的 `Window⇒Preferences` 或 Mac 上的 `Eclipse⇒Preferences`。然后选择\
  \ `General⇒Editors⇒Text Editors`。最后，勾选 `Show Line Numbers` 复选框。\n\n修复编译错误，你必须成为一名侦探。你加入了一个名为“法律与秩序”的精英小组。你很少找到简单的答案。相反，你需要逐个字符缓慢地检查代码，对比你在代码清单\
  \ 3-1 中看到的一切。例如，当你悬停在锯齿下划线上时，你会看到错误的简要解释以及一些建议。如果你点击某项建议，Eclipse 会为你替换代码。\n\n\n\n\
  \n你对 Eclipse 的之旅从一个宏观视角开始。\n\n- **Workbench（工作区）**：Eclipse 桌面（参考图 3-3）。`workbench`\
  \ 是你开发代码的环境。\n- **Area（区域）**：`workbench` 的一部分。图 3-3 中的 `workbench` 包含五个区域。为了说明这一点，我为每个区域都画了框（参见图\
  \ 3-15）。\n- **Window（窗口）**：Eclipse `workbench` 的副本。在 Eclipse 中，你可以同时打开多个 `workbench`\
  \ 副本。每个副本都显示在自己的 `window` 中。\n- **Action（操作）**：提供给你的选择，通常在你点击某些内容时出现。例如，当你在 Eclipse\
  \ 主菜单栏中选择 `File⇒New` 时，你会看到一个可以创建的新项列表。该列表通常包括 `Project`、`Folder`、`File` 和 `Other`，但也可能包含\
  \ `Package`、`Class` 和 `Interface` 等。这些中的每一个项（菜单中的每一项）都被称为 `action`。![9781118407813-fg0315.tif](img/9781118407813-fg0315_fmt.png)\n\
  \n图 3-15：工作区被分为若干区域。\n\n### 视图、编辑器和其他内容\n\n接下来的 get 术语涉及称为视图（views）、编辑器（editors）和标签（tabs）的内容。\n\
  \n![tip.eps](img/tip_fmt.png) 你可能很难理解视图和编辑器之间的区别。（视图像编辑器，而编辑器又像视图，大如此。）如果你觉得视图和编辑器看起来是一样的，并且不确定如何区分哪个是哪个，请不要沮丧。作为一个普通的\
  \ Eclipse 用户，随着使用 `workbench` 经验的积累，视图和编辑器的区别会自然形成。你很少需要判断你正在使用的东西是视图还是编辑器。\n\n\
  如果你必须决定什么是视图，什么是编辑器，这里是你需要知道的：\n\n- **View（视图）**：Eclipse `workbench` 的一部分，用于显示供你浏览的信息。在最简单的情况下，一个\
  \ `view` 满了 `workbench` 中的一个区域。例如，在图 3-3 中，`Package Explorer` 视图占据了左侧的区域。\n\n  许多视图以列表或树的形式显示信息。例如，在图\
  \ 3-10 中，`Package Explorer` 视图包含一个树。\n\n  你可以使用 `view` 对内容进行更改。例如，要删除图 3-10 中的 `SomeOtherProject`，可以在\
  \ `Package Explorer` 视图中右键点击 `SomeOtherProject` 分支。（在 Mac 上，`control-click` `SomeOtherProject`\
  \ 分支。）然后，在弹出的右键菜单中选择 `Delete`。\n\n  ![remember.eps](img/remember_fmt.png) 当你使用 `view`\
  \ 修改内容时，更改会立即发生。例如，当你在 `Package Explorer` 的右键菜单中选择 `Delete` 时，你选的项目会被立即删除。从某种上说，这种行为并不新鲜。在使用\
  \ `Windows Explorer` 回收文件或使用 `Macintosh Finder` 丢弃文件时，也会发生相同的情况。\n\n- **Editor（编辑器）**：Eclipse\
  \ `workbench` 的一部分，用于显示供你修改的信息。典型的 `editor` 以文本形式显示信息。这些可以是文件的内容。例如，图 3-10 中的编辑器显示了\
  \ `MyFirstJavaClass.java` 文件的内容。\n\n  ![remember.eps](img/remember_fmt.png) 当你使用\
  \ `editor` 修改内容时，更改不会立即发生。例如，看图 3-10 中的编辑器。这个编辑器显示了 `MyFirstJavaClass.java` 文件的内容。你可以在编辑器中输入各种内容。在你从\
  \ Eclipse 菜单栏选择 `File⇒Save` 之前，`MyFirstJavaClass.java` 不发生变化。当然，这种行为并不新鲜。你在 `Microsoft\
  \ Word` 或任何其他文字处理程序中工作，也会发生相同的情况。\n\n  ![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 像其他作者一样，我偶尔会偷懒，当我实际上指的是“视图或编辑器”时使用“视图”这个词。当你发现我这样做时，只需摇头并继续即可。当我得非常严谨时，我会使用 Eclipse\
  \ 的官方术语。我将视图和编辑器称为 Eclipse `workbench` 的 `parts`（部分）。遗憾的是，这个“parts”术语很难留在人们脑海中。一个\
  \ `workbench` 区域可能包含多个视图或多个编辑器。大多数 Eclipse 用户不需要考虑“多个视图”这件事也能相处很好。但如果你关心标签和视图的术语，这里是：\n\
  \n- **Tab（标签）**：除了通过称为“标签”来描述之外，无法描述的东西。我们以任何其他名称称为 `tab` 的东西会从一个视图移动到另一个，或从一个编辑器移动到另一个。重要的是，视图可以堆叠在另一个上面。Eclipse\
  \ 显示视图的方式就像标签笔记本中的页面一样。例如，图 3-14 显示了一个 `workbench` 区域。该区域包含五个视图（`Problems` 视图、`Javadoc`\
  \ 视图、`Search` 视图和 `Console` 视图）。每个视图都有自己的 `tab`。一组堆叠视图被称为 `tab group`（标签组）。要将栈中的某个视图带到前面，点击该视图的\
  \ `tab`。\n\n- **Active view or active editor（激活视图或激活编辑器）**：标签组中位于前面的视图或编辑器。在图 3-16\
  \ 中，`MyFirstJavaClass` 编辑器是激活编辑器。其他的是非的。\n\n### 视图或编辑器内部有什么？\n\n接下来的几个术语涉及单个视图、单个编辑器。\n\
  \n- **Toolbar（工具栏）**：视图顶部的按钮条（以及其他小东西）（参见图 3-17）。![9781118407813-fg0317.tif](img/9781118407813-fg0317_fmt.png)\n\
  \n图 3-17：`Package Explorer` 视图的工具栏。\n\n- **Menu button（菜单按钮）**：工具栏中指向下的箭头。当你点击 `menu\
  \ button` 时，会出现一个操作下拉列表（参见图 3-18）。你在列表中看到的动作随视图而异。![9781118407813-fg0318.tif](img/9781118407813-fg0318_fmt.png)\n\
  \n图 3-18：点击 `Package Explorer` 视图的菜单按钮。\n\n- **Close button（关闭按钮）**：移除特定视图或编辑器的按钮（参见图\
  \ 3-19）。![9781118407813-fg0319.tif](img/9781118407813-fg0319_fmt.png)\n\n图 3-19：编辑器的关闭按钮。\n\
  \n- **Chevron（双箭头）**：指示其他标签应该出现在某个区域的双箭头（但该区域不够）。图 3-20 中的 chevron 旁边有一个数字 2。2 告诉你，除了可见的标签外，还有两个是隐藏的。点击\
  \ chevron 会弹出一个包含所有标签名称的提示（参见图 3-20）。![9781118407813-fg0320.tif](img/9781118407813-fg0320_fmt.png)\n\
  \n图 3-20：chevron 指示有两个编辑器是隐藏的。\n\n\n\n\n*   `Marker bar`（标记栏）：编辑器区域左边缘的垂直标尺。Eclipse\
  \ 在标记栏内部显示微小的警告图标，称为 `markers`。（例如，请参见图 3-12。）\n\n## 回顾全局\n\n接下来两个术语涉及 Eclipse 的整体外观和感受。\n\
  \n*   `Layout`（布局）：某些视图的排列。图 3-3 中的布局包含七个视图，其中四个是清晰可见的：\n    *   在最左侧，你可以看到 `Package\
  \ Explorer`（包资源管理器）视图。\n    *   在最右侧，你有 `Task List`（任务列表）视图和 `Outline`（大纲）视图。\n\
  \    *   在底部，你可以获得 `Problems`（问题）、`Javadoc`、`Declaration`（声明）和 `Console`（控制台）视图。\n\
  \n    除了这些视图，布局包含一个单一的 `editor area`（编辑器区域）。任何所有打开的编辑器都会显示在此编辑器区域内。\n\n*   `Perspective`（透）：一种非常有用的布局。如果某个特定布局非常有用，就会给该布局起一个名字。如果一个布局有名字，你就可以在任何时候使用该布局。例如，图\
  \ 3-3 中的工作区显示了 Eclipse 的 `Java perspective`（Java 透）。默认情况下，`Java perspective` 包含六个视图，排列方式与图\
  \ 3-3 所示所示排列非常相似。\n\n    ![tip.eps](img/tip_fmt.png) `Console` 视图出现在图 3-3 中，但 `Console`\
  \ 视图并不总是 `Java perspective` 的一部分。通常，当你运行基于文本的 Java 程序时，`Console` 视图会自动出现。如果你想强制\
  \ `Console` 视图出现，选择 `Window⇒Show View⇒Other`。在生成的 `Show View` 对话框中，展开 `General`\
  \ 分支。最后，在 `General` 分支内，双击 `Console` 项目。\n\n    除了所有这些视图，`Java perspective` 还包含一个\
  \ `editor area`。（当然，`editor area` 有几个标签页，但标签页的数量与 `Java perspective` 无关。）\n\n  \
  \  你可以通过选择 Eclipse 主菜单栏中的 `Window⇒Open Perspective` 来在不同的透视图之间切换。本书几乎完全关注 Eclipse\
  \ 的 `Java perspective`。但如果你喜欢到处转转，可以访问其他透视图，以窥见 Eclipse 的强大和多功能。\n\n# 第二部分\n\n#\
  \ 编写你自己的 Java 程序\n\n![9781118407813-pp0201.tif](img/9781118407813-pp0201_fmt.png)\n\
  \n![webextras.eps](img/webextras_fmt.png) 在 [www.dummies.com/extras/beginningprogrammingwithjava](http://www.dummies.com/extras/beginningprogrammingwithjava)\
  \ 查看在线文章“理解 Java 的 API 文档”（以及更多）。\n\n在这一部分中……\n\n*   剖析程序并检查各个部分\n*   处理数字\n*  \
  \ 处理非数字\n\n# 第 4 章\n\n# 探索程序的组成部分\n\n## 本章内容\n\n![arrow](img/arrow.png) 识别 Java\
  \ 程序中的单词\n![arrow](img/arrow.png) 使用符号符号和缩进\n![arrow](img/arrow.png) 理解 Java 语句和方法\n\
  \n我在文文学院的科学大楼工作。当我路过生物实验室时，我总会在心里轻声感谢。我感谢自己不需要解剖小动物。在我的工作领域，我解剖的是计算机程序。计算机程序的味道比防腐的死动物要好得多。而且，当我解剖一个程序时，我不会联想到自己的终结。\n\
  \n在本章中，我邀请你和我一起剖析一个程序。我有一个小程序，名为 `ThingsILike`。我把程序切开，仔细研究程序的内部。准备好你的手术刀。我们开始吧！\n\
  \n## 第一次查看 Java 代码\n\n我必须向你坦白。当我第一次看别人的计算机程序时，我会感到有点不适。意识到我不理解代码中的某些内容（或许多内容）让我感到紧张。我写过成百个（也许成千个）程序，但当我开始阅读别人的代码时，我仍然感到不安全。\n\
  \n事实是，学习计算机程序是一个“自举”的过程。首先，我带着敬畏之情盯着程序看。然后我运行程序看它是做什么的。接着，我盯着程序看一会儿，或者阅读别人对程序及其部分的解释。然后我再多看一会儿，并再次运行程序。最终，我与程序达成了和。不要相信那些说他们从未经历过这些步骤的大人物。即使是经验丰富的程序员，在面对新项目时也是缓慢而谨慎的。\n\
  \n### 看！一个程序！\n\n在列表 4-1 中，你将看到大量的 Java 代码。像所有初级程序员一样，你会被谦卑地盯着代码看。但不要被吓到。当你掌握了之后，编程其实非常简单。是的，很有趣。\n\
  \n列表 4-1：一个简单的程序\n```java\nclass ThingsILike {\n    public static void main(String\
  \ args[]) {\n        System.out.println(\"Chocolate, royalties\");\n    }\n}\n```\n\
  \n当我运行列表 4-1 中的程序时，我得到了图 3-3 所示的结果。现在，我承认，为了让单词出现在屏幕上，编写和运行程序确实费了许多精力。\n\n![9781118407813-pp0201.tif](img/9781118407813-pp0201_fmt.png)\n\
  \n本书中的大多数程序都是基于文本的。相比之下，`GUI`（图形用户界面）显示窗口、按钮和其他控件来与用户交互。\n\n\n\n\n*Barry Burd 于\
  \ 2014 年 2 月 13 日编写了此程序。*\n\n*Barry 意识到你可能对这段代码有疑问，可以通过 BeginProg@allmycode.com\
  \ 联系他，在 Twitter 上关注 @allmycode，或在 Facebook 上访问 /allmycode。*\n\n这段代码定义了一个名为 `ThingsILike`\
  \ 的 Java 类。\n\n这是指令的 `main` 入口：\n在屏幕上显示巧克力、版税、睡眠。\n\n本章的其余部分（约 4500 字）将更详细地解释列表\
  \ 4-1 代码。\n\n## Java 程序中的元素\n\n英语和 Java 都被称为*语言*绝非巧合。你使用语言来表达思想。英语向人类表达思想，而 Java\
  \ 向计算机表达思想。此外，英语和 Java 都有像单词、名称和标点符号等内容。事实上，这两种语言之间最大的区别是 Java 比英语更容易学习。（如果英语很容易，那么计算机就能理解英语了。遗憾的是，它们并不能。）\n\
  \n拿一个普通的英语句子，并与列表 4-1 中的代码进行比较。这个句子是：\n\nSuzanne 说 “eh”，因为如你所知，她住在加拿大。\n\n在你的高中语法课上，你担心动词、形容词和其他此类内容。但在本书中，你将从关键字和标识符的角度思考，如图\
  \ 4-2 所示。\n\n![9781118407813-fg0402.tif](img/9781118407813-fg0402_fmt.png)\n\n图\
  \ 4-2：你在简单句子中发现的内容。\n\nSuzanne 的句子包含了各种元素。这些元素与计算机程序中发现的元素是相同的。所以计划是：将图 4-1 中的元素与列表\
  \ 4-1 中的相似元素进行比较。你已经理解英语，所以利用这种理解来发现关于 Java 的一些新知识。\n\n但首先，有一个友好的提醒：在接下来的几段落中，我将对比英语和\
  \ Java。在阅读这些段落时，保持开放的心态非常重要。例如，在比较 Java 和英语时，我可能会写道“名称并不等同于字典单词”。当然，你可以反驳说某些字典列出了专有名词，而且有些人的名字像\
  \ Hope、Prudence 和 Spike，但请不要这样做。如果你避免了纠结细节，你将从阅读中收获更多。好吗？我们还是朋友吧？\n\n### 关键字\n\n\
  *关键字*（keyword）是一个字典单词——一个内置在语言中的单词。\n\n在图 4-2 中，像 “says” 这样的单词是一个关键字，因为无论 “says”\
  \ 在英语句子中何时被使用，它都起着相同的作用。Suzanne 句子其他关键字有 “because”、“as”、“you”、“know”、“she”、“lives”\
  \ 和 “in”。\n\n计算机程序也有关键字。事实上，列表 4-1 中的程序使用了 Java 的四个关键字（已加粗显示）：\n\n```java\nclass\
  \ ThingsILike {\n    public static void main(String args[]) {\n}\n```\n\n每个 Java\
  \ 关键字都有特定的含义——这种含义在程序与程序之间保持不变。例如，每当我写一个 Java 程序时，`public` 单词始终表示程序中可被任何其他代码访问的部分。\n\
  \n![warning.eps](img/warning_fmt.png) Java 语言是*区分大小写*的。这意味着如果你将单词中的一个小写字母改为大写字母，你就改变了单词的含义。改变大小写可能会使整个单词从变为毫无意义。在列表\
  \ 4-1 中，你不能用 `Public` 替换 `public`。如果你这样做了，整个程序将停止工作。\n\n本章关于关键字 `class`、`public`、`static`\
  \ 和 `void` 的含义很少或没有细节。你可以提前查看其他章节的内容，也可以通过“作弊”来应。当你写程序时，只需从这里：\n\n```java\nclass\
  \ SomethingOrOther {\n```\n\n然后粘贴文本：\n\n```java\npublic static void main(String\
  \ args[]) {\n```\n\n在列表 4-1 中，你不能创建一个名为 `public` 的变量（稍等，文中没提到）。\n\n\n\n\n`(String\
  \ args[])` 中的 `args` 存储了你在运行 Java 程序命令时输入的任何额外内容。例如，如果你通过输入 `java ThingsILike won\
  \ too 3` 来运行程序，那么 `args` 就会存储额外的值：`won`、`too` 和 `3`。作为一名初级程序员，你不需要考虑 Java 的这个功能。只需将\
  \ `(String args[])` 粘贴到你的每个程序中即可。\n\n## 具有约定含义的标识符\n\n许多人的名字叫 Suzanne，但只有一个国家的名字叫\
  \ Canada（加拿大）。这是因为“Canada”这个词有一个标准的、众为人知的含义。它指的是旗帜上有一片红色枫叶的国家。如果你建立自己的国家，你应该避免将其命名为\
  \ Canada，因为命名为 Canada 只会让所有人都感到困惑。（我知道，肯塔基州有一个小镇叫 Canada，但这并不算数。记住，你应该忽略此类这样的例外。）\n\
  \n大多数编程语言都具有具有约定含义的标识符。在 Java 中，几乎所有这些标识符都定义在 Java API 中。列表 4-1 列出了五个这样的标识符。它们是单词\
  \ `main`、`String`、`System`、`out` 和 `println`：\n\n```java\npublic static void main(String\
  \ args[]) {\n    System.out.println(\"Chocolate, royalties, sleep\");\n}\n```\n\n\
  这里是这些名称含义的简要介绍（更详细的描述出现在本书中）：\n\n*   `main`：每个 Java 程序执行的主起点。\n*   `String`：一组文本；一行一个一个接一个的字符。\n\
  *   `System`：Java API 中的一个现成程序。该程序访问你计算机的某些在 Java 虚拟机 (JVM) 直接控制之外的功能。\n*   `out`：文本程序显示其文本的地方。（对于在\
  \ Eclipse 中运行的程序，`out` 单词代表控制台视图。要了解更多关于文本程序的知识，请查看第 3 章的前几段。）\n*   `println`：在你的电脑屏幕上显示文本。\n\
  \n![remember.eps](img/remember_fmt.png) `println` 这个名字来源于单词“print a line”（打印一行）。如果你被允许大写写这个名字，它将是\
  \ `PRINTLN`，单词末尾附近有一个字母 `L`。当计算机执行 `println` 时，计算机会将一些文本放在 Eclipse 的控制台视图中，然后立即移动到下一行的开头，为控制台视图中可能出现的任何其他内容做准备。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 严格来说，Java API 中标识符的含义并不是一成不变的。虽然你可以为\
  \ `System` 或 `println` 等单词创造你自己的含义，但这样做并不是个好主意——因为你会让其他程序员大大头转向，他们已经习惯了这些熟悉的标识符名称的标准\
  \ API 含义。\n\n## 字面量\n\n*字面量*（literal）是一段看起来非常像它所代表的任何值的文本块。在 Suzanne 的句子中（参见图 4-2），“eh”就是一个字面量，因为“eh”指的是单词“eh”。\n\
  \n编程语言也有字面量。例如，在列表 4-1 中，引号中的内容就是字面量：\n\n```java\nSystem.out.println(\"Chocolate,\
  \ royalties, sleep\");\n```\n\n当你运行 `ThingsILike` 程序时，你会在屏幕上看到 Chocolate, royalties,\
  \ sleep 这些单词。在列表 4-1 中，文本 \"Chocolate, royalties, sleep\" 指这些单词，正如它们在屏幕上显示的一样（不包括引号）。\n\
  \n你在计算机程序中使用的大数字都是字面量。如果你在计算机程序中放入语句\n\n```java\nmySalary = 1000000.00;\n```\n\n\
  那么 `1000000.00` 就是一个字面量。它代表数字 `1000000.00`（一百万）。\n\n如果你不喜欢数数字，你可以在你的 Java 7 程序中放入以下语句：\n\
  \n```java\nmySalary = 1_000_000.00;\n```\n\n从 Java 7 开始，带有下划线的数字允许作为字面量。\n\n![warning.eps](img/warning_fmt.png)\
  \ 在 Java 7 之前的版本中，你不能在代码中使用 `1_000_000.00` 等数字。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 不同国家使用不同的数字分隔符和不同的数字格式。例如，在美国，你写为 `1,234,567,890,55`。在法国，你写为 `1234567890,55`。在印度，你每两个或三个一组分组。你写为\
  \ `1,23,45,67,890.55`。你不能放入像 `mySalary = 1,234,567,890,55` 这样的语句。\n\n## 标点\n\n典型的计算机程序有很多标点。例如，考虑这个：\n\
  \n```java\nclass ThingsILike {\n    public static void main(String args[]) {\n \
  \       System.out.println(\"Chocolate, royalties, sleep\");\n    }\n}\n```\n\n\
  每个括号、每个大括号、每个波浪号都有作用。在英语中，我们很少这样做。相反在编程中，缩进显示了哪些部分是从的。为了让程序的结构一目了然，我们缩进盒子内部的内容。图\
  \ 4-3 和 4-4 显示了部分是如何包含在另一个。注意一对大括号就像一个盒子。\n\n![9781118407813-ch04.xhtml_z3.png](img/9781118407813-ch04.xhtml_z3.png)\
  \ \n图 4-3：一对大括号就像一个盒子。\n\n![9781118407813-ch04.xhtml_z4.png](img/9781118407813-ch04.xhtml_z4.png)\
  \ \n图 4-4：程序中的想法嵌套在另一个内部。\n\n![remember.eps](img/remember_fmt.png) 我无法再强调这一点了。如果你不对代码进行缩进，或者你缩进了但没有做得仔细，你的代码仍然可以编译和运行。但这种成功的运行给了你虚假的安全感。一旦你尝试更新缩进糟糕的代码，你就会陷入混乱。所以听我的建议：在过程的每一步都保持代码仔细缩进。无论你是在草拟快速测试程序，还是为富翁客户编写代码。\n\
  \n![tip.eps](img/tip_fmt.png) Eclipse 可以自动为你缩进代码。选择你想缩进代码的 .java 文件。然后，在 Eclipse\
  \ 主菜单中选择 Source⇒Format。Eclipse 会重新排列你编辑器中的行，缩进应该缩进的内容，并通常让你的代码看起来很好。\n\n## 注释\n\n\
  *注释*是位于流程之外的文本。在图 4-2 中，“注释:”这些单词并不是 Suzanne 句子的一部分。相反，这些单词是*关于* Suzanne 句子的。计算机程序中的注释也是如此。列表\
  \ 4-1 中的前五行形成了一个大注释。计算机不处理这个注释。这个注释内部没有供计算机执行的指令。相反，注释告诉其他程序员关于你代码的信息。\n\n\n\n\n\
  注释对你你自己也有好处。想象一下，你把代码搁了一段时间，去处理其他事情。当你以后回来继续处理这些代码时，注释能帮助你想起你正在做什么。\n\nJava 编程语言有三种注释：\n\
  \n*   **传统注释：** 列表 4-1 中的注释是*传统*注释。注释以 `/*` 开始，以 `*/` 结束。起始符号 `/*` 和结束符号 `*/` 之间的所有内容仅供人类视觉阅读。`/*`\
  \ 和 `*/` 之间的任何内容都不会被编译器翻译。\n\n    列表 4-1 中的第二、第三和第四行有额外的星号。我称它们为“额外”星号，因为在创建注释时并不需要这些星号。它们只是为了让注释看起来更漂亮。我将它们包含在列表\
  \ 4-1 中，是因为出于某种我不完全理解的原因，大多数 Java 程序员都会添加这些额外的星号。\n\n*   **行末注释：** 这里是带有行末注释的代码：\n\
  \n    ```java\n    class ThingsILike {\n      //Two things are missing\n\n     \
  \ public static void main(String args[]) {\n        System.out.println(\"sleep\"\
  ); // 这里缺少了内容\n      }\n    }\n    ```\n\n    *行末*注释以两个斜杠开始，一直到该行类型的末尾。\n\n    ![tip.eps](img/tip_fmt.png)\
  \ 你可能会听到程序员谈论*注释掉*（commenting out）代码的某些部分。当你编写程序且某些部分运行不正常时，尝试移除一些代码通常会有帮助。至少，你可以发现删掉那段可疑代码后会发生什么。当然，你可能并不喜欢代码被删除后的结果，所以你不想完全删除代码。相反，你将你的普通\
  \ Java 语句转变为注释。例如，将 `System.out.println(\"Sleep\");` 转换为 `/* System.out.println(\"\
  Sleep\"); */`。这可以让你在尝试找出程序问题时，不让 Java 编译器看到这些代码。\n\n*   **Javadoc 注释：** 特殊的*Javadoc*注释是指以额外星号开始的传统注释。\n\
  \n    ```java\n    /**\n    * 打印一个字符串并换行。\n    */\n    ```\n\n    这是一个很酷的 Java 特性。你可以从\
  \ java.sun.com 下载的软件包含一个名为 `javadoc` 的小程序。`javadoc` 程序会在你的代码中寻找这些特殊注释。程序使用这些注释创建一个全新的网页——一个为你代码定制的文档页面。要了解更多关于将\
  \ Javadoc 注释转换为网页的知识，请访问本书的网站（[`allmycode.com/BeginProg`](http://allmycode.com/beginprog)）。\n\
  \n# 理解简单的 Java 程序\n\n接下来的章节将介绍、解释、分析、剖析并以此揭秘列表 4-1 中的 Java 程序。\n\n## 什么是方法？\n\n\
  你正在一家高档修理厂担任汽车修理师。你的老板总是很匆忙，并且习惯把单词连在一起说，他说：“修理那辆旧福特的发电机（FixTheAlternator on that\
  \ junkyOldFord）。”在脑海中，你过了一个任务清单：“开车进维修位，打开引擎盖，拿一把扳手，松开发电机带”等等。这里发生了三件事：\n\n*   **你对必须要做的事情有了一个名字。**\
  \ 这个名字是 `FixTheAlternator`。\n*   **在你的脑海中，有一个与名字 `FixTheAlternator` 相关的任务列表。** 列表包括“开车进维修位，打开引擎盖，拿一把扳手，松开发电机带”等等。\n\
  *   **你有一个脾气不的老板让你做所有这些工作。** 你的老板通过说“FixTheAlternator”让你开始工作。换句话说，你的老板通过说出你必须要做的名字来让你工作。\n\
  \n在这种情况下，使用*方法*（method）一词并不算违和。你有一个处理发电机的方法。你的老板启动了该方法，而你通过执行与该方法关联的指令列表中的所有事情来响应。\n\
  \n### Java 方法\n\n如果你相信上一节中的所有内容，那么你就准备好学习 Java 方法了。在 Java 中，*方法*是一份待办事项列表。每个方法都有一个名字，你通过在程序中使用方法的名字告诉计算机执行列表中的事项。\n\
  \n我从未写过让机器人修理发电机的程序。但如果我真的写了，该程序可能会包含一个名为 `FixTheAlternator` 的方法。我的 `FixTheAlternator`\
  \ 方法中的指令列表看起来就像列表 4-2 中的文本一样。\n\n列表 4-2：方法声明\n\n```java\nvoid FixTheAlternator()\
  \ {\n  DriveInto(car, bay);\n  Lift(hood);\n  Get(wrench);\n  Loosen(alternator);\n\
  }\n```\n\n在我的 Java 代码的其他地方（列表 4-2 之外），我需要一个指令来调用 `FixTheAlternator` 方法。调用方法的指令可能像列表\
  \ 4-3;\n```\n\n![warning.eps](img/warning.png) 不要仔细盯着列表 4-2 和 4-3，这些代码是伪造的为了看起来像\
  \ Java。列表 4-2 中的所有行和 4-3 并不是为了说明 Java 的规则。如果你有一点常识，会对列表 4-2 保留意见。\n\n![technicalstuff.eps](img/technicalstuff.png)\
  \ 几乎所有编程语言都有类似于 Java 的东西。如果你用过其他语言，你可能记得子程序、过程、函数或执行语句。无论你在你喜欢的语言中称它为什么，*方法*都是集合在一起的指令。\n\
  \n#### 声明、头部和调用\n\n如果你对方法及其如何工作有了基本理解（见上一节），你可以深入了解一些术语：\n\n*   如果我偷懒，我将列表 4-2 中的代码称为*方法*。如果我不偷懒，我将这段代码称为*方法声明*。\n\
  *   列表 4-2 中的方法声明包含两个部分。第一行（包含 `FixTheAlternator` 名字但不包含左大括号的部分）被称为*方法头部*。列表 4-2\
  \ 的剩余部分（在大括号包围的部分）是*方法体*。\n*   *方法声明*这一术语将列表 4-2 中的指令列表与列表 4-3 中的指令区分来，后者被称为*方法调用*。\n\
  \n有关所有方法术语的方便插图，请参见图 4-5。\n\n\n\n\n\n*   `FixTheAlternator()`: 把车开进维修区，打开引擎盖，拿扳手，松开发电机皮带，然后吃点巧克力。\n\
  \n相比之下，方法调用就像在句子中使用一个单词。方法调用会使某些代码运行起来。\n\n*   “我想吃点巧克力，否则我就发脾气。” 自己的\n*   “对那辆破旧福特（`junkyOldFord`）执行\
  \ `FixTheAlternator`。”\n\n![remember.eps](img/remember_fmt.png) *方法的声明*（method’s\
  \ declaration）告诉计算机，如果你调用该方法并让它运行，会发生什么。而*方法调用*（method call，它是一段独立的代码）告诉计算机实际上去调用该方法。方法的声明和方法的调用通常位于\
  \ Java 程序的不同部分。\n\n程序中的 main 方法\n\n在列表 4-1 中，代码的大部分是名为 `main` 的方法的声明。（只需在代码的方法头中寻找\
  \ `main` 单词即可。）目前，不要担心方法头中的其他单词 —— `public`、`static`、`void`、`String` 和 `args`。我将在接下来的几章中根据需要）解释这些单词。\n\
  \n就像任何 Java 方法一样，`main` 方法是一份食谱：\n\n*如何制作饼干：*\n\n*   预热烤箱。\n*   擀面团。\n*   烘焙擀好的面团。\n\
  \n或者\n\n*如何遵循 ThingsILike 代码中的主指令：*\n\n*   在屏幕上显示 Chocolate, royalties, sleep。\n\
  \n`main` 单词在 Java 中扮演着特殊的角色。特别地，你永远不会编写显式调用 `main` 方法运行的代码。`main` 单词是程序在开始运行时时被自动调用的方法名称。\n\
  \n当 ThingsILike 程序运行时，计算机会自动找到程序的 `main` 方法，并执行该方法体内部的任何指令。在 ThingsILike 程序中，`main`\
  \ 方法体内部只有一条指令。该指令告诉计算机在屏幕上显示 Chocolate, royalties, sleep。\n\n![remember.eps](img/remember_fmt.png)\
  \ 在方法被调用之前，方法中的任何指令都不会执行。但如果你给一个方法命名为 `main`，那么该方法就会被自动调用。\n\n### 你最终如何告诉计算机执行某事\n\
  \n在列表 4-1 的核心深处，隐藏着一行实际上向计算机发出直接指令的单行代码。这一行\n\n```\nSystem.out.println(\"Chocolate,\
  \ royalties, sleep\");\n```\n\n告诉计算机显示 Chocolate, royalties, sleep。（如果你使用 Eclipse，计算机会在控制台（Console）视图中显示\
  \ Chocolate, royalties, sleep。）可以用两种不同的方式来描述这行代码：\n\n*   **它是一条语句（statement）。**\
  \ 在 Java 中，告诉计算机执行某事的直接指令被称为*语句*（statement）。列表 4-1 中的语句告诉计算机显示某些文本。其他程序中的语句可能告诉计算机在某个内存位置存放\
  \ 7，或者在屏幕上弹出一个窗口。计算机程序中的语句执行着各种任务。\n\n*   **它是一个方法调用（method call）。** 在本章前面的“什么是方法？”部分中，我描述过一种名为“方法调用”的东西。语句\n\
  \n```\nFixTheAlternator(junkyOldFord);\n```\n\n是一个方法调用的示例，\n\n```\nSystem.out.println(\"\
  Chocolate, royalties, sleep\");\n```\n\n也是。\n\nJava 有许多不同类型的语句。方法调用只是其中一种。\n\n####\
  \ 用分号结束语句\n\n在 Java 中，每条语句都以分号结尾。列表 4-1 中的代码只有一条语句，因此列表 4-1 中只有一行以分号结尾。\n\n以列表 4-1\
  \ 中的任何其他行为例，例如方法头。方法头（包含 `main` 单词的行）并没有直接告诉计算机做任何事。相反，方法头描述了某些操作以供将来参考。头部宣布：“万一有人调用了\
  \ `main` 方法，接几行代码将告诉你如何响应该调用。”\n\n![remember.eps](img/remember_fmt.png) 每一个完整的 Java\
  \ 语句都以分号结尾。方法调用是一条语句，因此它以分号结尾，但方法头或方法声明都不是语句。\n\n#### 名为 System.out.println 的方法\n\
  \n列表 4-1 中间的语句告诉计算机显示 Chocolate, royalties, sleep。（如果你使用 Eclipse，计算机会在控制台中视图显示 Chocolate,\
  \ royalties, sleep。）可以用两种不同的方式描述这行代码：\n\n*   **它是一条语句。** 在 Java 中，告诉计算机执行某事的直接指令被称为*语句*。列表\
  \ 4-1 中的语句告诉计算机显示某些文本。其他程序中的语句可能告诉计算机在某个内存位置存放 7，或者在屏幕上弹出一个窗口。计算机程序中的语句执行着各种任务。\n\
  \n*   **它是一个方法调用。** 在本章前面的“什么是方法？”部分中，我描述过一种名为“方法调用”的东西。语句\n\n```\nFixTheAlternator(junkyOldFord);\n\
  ```\n\n是一个方法调用的示例，\n\n```\nSystem.out.println(\"Chocolate, royalties, sleep\");\n\
  ```也是。\n\nJava 有许多不同类型的语句。方法调用只是其中一种。\n\n#### 用分号结束语句\n\n在 Java 中，每条语句都以分号结尾。列表\
  \ 4-1 中的代码只有一条语句，因此列表 4-1 中只有一行以分号结尾。\n\n以列表 4-1 中的任何其他行为例，例如方法头。方法头（包含 `main` 单词的行）并没有直接告诉计算机做任何事。相反，方法头描述了某些操作以供将来参考。头部宣布：“万一有人调用了\
  \ `main` 方法，接几行代码将告诉你如何响应该调用。”\n\n![remember.eps](img/remember_fmt.png) 每一个完整的 Java\
  \ 语句都以分号结尾。方法调用是一条语句，因此它以分号结尾，但方法头或方法声明都不是语句。\n\n#### 名名为 System.out.println 的方法\n\
  \n列表 4-1 中间的语句告诉计算机显示 Chocolate, royalties, sleep。（如果你使用 Eclipse，计算机会在控制台中视图显示 Chocolate,\
  \ royalties, sleep。）可以用两种不同的方式描述这行代码：\n\n*   **它是一条语句。** 在 Java 中，告诉计算机执行某事的直接指令被称为*语句*。列表\
  \ 4-1 中的语句告诉计算机显示某些文本。其他程序中的语句可能告诉计算机在某个内存位置存放 7，或者在屏幕上弹出一个窗口。计算机程序中的语句执行着各种任务。\n\
  \n*   **它是一个方法调用。** 在本章前面的“什么是方法？”部分中，我描述过一种名为“方法调用”的东西。语句\n\n```\nFixTheAlternator(junkyOldFord);\n\
  ```\n\n是一个方法调用的示例，\n\n```\nSystem.out.println(\"Chocolate, royalties, sleep\");\n\
  ```\n也是。\n\nJava 有许多不同类型的语句。方法调用只是其中一种。\n\n#### 无处不在的方法\n\n两个方法在 ThingsILike 程序中发挥作用。图\
  \ 4-6 阐了这种情况，接下来的几个项目符号为你提供了导览。\n\n![9781118407813-fg0406.tif](img/9781118407813-fg0406_fmt.png)\n\
  \n图 4-6：调用 `System.out.println` 方法。\n\n*   **有一个 `main` 方法的声明。** 我自己写的 `main` 方法。每当我启动\
  \ ThingsILike 程序时，这个 `main` 方法就会被自动调用。\n\n*   **有一个对 `System.out.println` 方法的调用。**\
  \ `System.out.println` 方法调用是 `main` 方法体中的唯一语句。换句话说，调用 `System.out.println` 是 `main`\
  \ 方法待事项列表上的唯一事情。\n\n`System.out.println` 方法的声明隐藏在官方 Java API 中。要复习 Java API，请参考第\
  \ 1。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 当我说“System.out.println\
  \ 隐藏在 API 内部”时，我并没有公正地评价 API。诚然，你可以忽略 API 内部所有细微的 Java 代码。你只需要记住 `System.out.println`\
  \ 定义在这些代码的某处。但我让 API 代码听起来像某种东西是不公平的。API 仅仅是另一堆 Java 代码。\n\n### Java 类\n\n你听过*面向对象编程*（也称为\
  \ OOP）吗？OOP 是一种思考计算机编程问题的方法 —— 一种被多种编程语言支持的方法。OOP 起于 20 世纪 60 年代的一种名为 Simula 的语言。它在\
  \ 20 世纪 70 年代通过名为 Smalltalk 的语言得到了加强。在 20 世纪 80 年代，OOP 通过 C++ 语言大兴起。\n\n\n\n\n有些人想改变这个缩写，将其称为为\
  \ `COP` —— 类面向对象编程。这是因为面向对象的编程始于一种被称为 `class`（类）的东西。在 Java 中，一切都从类开始，一切都被封装在类中，一切都基于类。在创建某种类型的类之前，你在\
  \ Java 中什么也做不了。这就像是在参加《危险竞答》（Jeopardy）节目，你听到 Alex Trebek 说：“我们要进入广告了”，然后你打断他说：“对不起，亚克斯。在不把你的指令放在类里面的情况下，你无法发布指令。”\n\
  \n理解类到底是什么非常重要，所以我不敢在这一章中给出草率的解释。相反，我把第 17 章的大部分内容留用来回答“什么是类？”这个问题。总之，在 Java 中，你的\
  \ `main` 方法必须在一个类内部。我在列表 4-1 中编写了代码，所以我得为我的新类起个名字。我选择了名字 `ThingsILike`，因此列表 4-1\
  \ 中的代码以 `class ThingsILike` 开头。\n\n再看看列表 4-1，注意 `class ThingsILike` 一行之后发生了什么。代码的其他部分封装在大括号中。这些大括号标记了类内部所有的内容。没有这些大括号，你会知道\
  \ `ThingsILike` 类声明从哪里开始，但不知道声明在哪里结束。\n\n这就像是 `ThingsILike` 类内部的内容在一个盒子里一样。（参考图\
  \ 4-3）。要框选一段代码，你需要做两件事：\n\n*   **你使用大括号。** 这些大括号告诉编译器代码块从哪里开始何时结束。\n*   **你对代码进行缩进。**\
