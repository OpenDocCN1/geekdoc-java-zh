  \ 包含了三层嵌套的循环。以下是列表 15-6 中的策略：\n\n- 对于左侧轮盘可能出现的 4 个符号中的每一个符号，\n- 对于中间轮盘可能出现的 4 个符号中的每一个符号，\n\
