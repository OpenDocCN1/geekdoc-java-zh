  \n*   在图 19-5 的第三次调用中，余额为 8474.00，利率为 3.0。\n\n    当进行 `addInterest` 调用时，表达式 `balance\
  \ * (rate / 100.0)` 代表 8474.00 * (3.0 / 100.00)。\n\n## 从方法获取值\n\n假设你正在派一个朋友去买菜。你以方法调用的形式提出购物请求。你发出了如下调用：\n\
  \n```\ngoToTheSupermarketAndBuySome(bread);\ngoToTheSupermarketAndBuySome(bananas);\n\
  ```\n\n括号中的内容是参数。每当你调用 `goToTheSupermarketAndBuySome` 方法时，你都会方法的参数列表中放入不同的值。\n\n\
  现在，当你的朋友从超市回来时会发生什么？“这是你让我买的面包，”朋友说。由于执行了你的愿望，你的朋友向你返回了一些东西。你进行了一个方法调用，而方法返回了信息（或者更好，方法返回了一些食物）。\n\
  \n返回给你的东西被称为方法的 `返回值`（return value），而返回给你的东西的类型被称为方法的 `返回类型`（return type）。\n\n###\
  \ 示例\n\n为了查看返回值和返回类型如何在真实的 Java 程序中工作，请查看列表 19-8 和 19-9 中的代码。\n\n列表 19-8：返回值的方法\n\
  \n```java\nimport java.text.NumberFormat;\nimport static java.lang.System.out;\n\
  \nclass GoodAccount {\n    String lastName;\n    int id;\n    double balance;\n\n\
  \    double getInterest(double rate) {\n        double interest;\n        out.print(\"\
  Adding \");  \n        out.print(rate);\n        out.println(\" percent...\");\n\
  \        interest = balance * (rate / 100.0);\n        return interest;\n    }\n\
  \n    void display() {\n        NumberFormat currency = NumberFormat.getCurrency();\n\
  \        out.print(\"The account with last name \");\n        out.print(lastName);\n\
  \        out.print(\" and ID \");\n        out.print(id);\n        out.print(\"\
  \ has balance \");\n        out.println(currency.format(balance));\n    }\n}\n```\n\
  \n列表 19-9：调用列表 19-8 中的方法\n\n```java\nimport java.util.Random;\nimport java.text.NumberFormat;\n\
  \nclass ProcessAccounts {\n    public static void main(String args[]) {\n      \
  \  Random myRandom = new Random();\n        NumberFormat currency = NumberFormat.getCurrency();\n\
  \        GoodAccount anAccount;\n        double interestRate;\n        double yearlyInterest;\n\
  \        for (int i = 0; i < 3; i++) {\n            anAccount = new GoodAccount();\n\
  \            anAccount.lastName = \"\" + (char)(myRandom.nextInt(26) + 'A') + (char)(myRandom.nextInt(26)\
  \ + 'a') + (char)(myRandom.nextInt(26) + 'a');\n            anAccount.id = myRandom.nextInt(10000);\n\
  \            anAccount.balance = myRandom.nextInt(10000);\n            anAccount.display();\n\
  \            interestRate = myRandom.nextInt(5);\n            yearlyInterest = anAccount.getInterest(interestRate);\n\
  \            System.out.print(\"This year's interest is \");\n            System.out.println(currency.format(yearlyInterest));\n\
  \            System.out.println();\n        }\n    }\n}\n```\n\n为了查看列表 19-8 和 19-9\
  \ 代码的运行情况，请查看图 19-8。\n\n![9781118407813-fg1908.tif](img/9781118407813-fg1908_fmt.png)\n\
  \n图 19-8：运行列表 19-9 中的代码。\n\n\n\n\n总之，这个笑话的核心在于从小处着手并逐步向更大的目标努力。这正是你在阅读*Java 编程入门（Beginning\
  \ Programming with Java For Dummies, 4th Edition）*时所做的。\n\n书中的大多数程序都是基于文本的。`text-based`\
  \ 程序没有窗口、没有对话框，没有之类的东西。对于基于文本的程序，用户在 `Console` 视图中输入字符，程序则在同一个 `Console` 视图中显示输出。\n\
  \n如今，很少有公开的程序是基于文本的。几乎所有程序都使用 `GUI` —— 即“图形用户界面”。所以，如果你目前已经读完了这本书的每一个字，你可能在想：“我什么时候才能学会如何创建\
  \ GUI 呢？”\n\n嗯，就是现在！本章将带你进入 Java GUI 编程的世界。\n\n![ontheweb.eps](img/ontheweb_fmt.png)\
  \ 你可以通过访问书籍网站（[allmycode.com/BeginProg](http://allmycode.com/beginprog)）来查看书中许多示例的\
  \ GUI 版本。\n\n## Java Swing 类\n\nJava 的 `Swing` 类在计算机屏幕上创建图形对象。这些对象可以包括按钮、图标、文本字段、复选框以及让窗口变得如此实用的东西。\n\
  \n“Swing”这个名字并不是一个缩写。当 Sun Microsystems 的人员最初创建这些类的代码时，其中一名开发者将其命名为“Swing”，因为当时摇摆乐（swing\
  \ music）正经历着怀旧复兴。是的，除了 `String` 和 `Swing` 之外，标准 Java API 还有一个 `Spring` 类。但那是另一个故事了。\n\
  \n实际上，Java 的 API 拥有几组窗口组件。详情请参阅“[Java GUIs”侧边栏。\n\n### 在屏幕上显示图像\n\n代码列表 `20-1` 中的程序在你的计算机屏幕上显示了一个窗口。要查看该窗口，请看图\
  \ `20-1`。\n\n代码列表 `20-1` 中的代码本身几乎没有逻辑。相反，这些代码整合了 Java API 中的许多系列类。\n\n列表 20-1：创建一个带有图像的窗口\n\
  \n```java\nimport javax.swing.JFrame;\nimport javax.swing.ImageIcon;\nimport javax.swing.JLabel;\n\
  class ShowPicture {\n    public static void main(String args[]) {\n        JFrame\
  \ frame = new JFrame();\n        ImageIcon icon = new ImageIcon(\"androidBook.jpg\"\
  );\n        JLabel label = new JLabel(icon);\n        frame.add(label);\n      \
  \  frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n        frame.pack();\n\
  \        frame.setVisible(true);\n    }\n}\n```\n\n![9781118407813-fg2001.tif](img/9781118407813-fg2001_fmt.png)\n\
  \n图 20-1：多么漂亮的窗口！\n\n在代码列表 `17-3`（位于 `17` 章）中，我通过这一行创建了 `Purchase` 类的实例：\n\n`Purchase\
  \ onePurchase = new Purchase();`\n\n所以在代码列表 `20-1` 中，我做了类似的事情。我通过以下行创建了 `JFrame`、`ImageIcon`\
  \ 和 `JLabel` 类的实例：\n\n```java\nJFrame frame = new JFrame();\nImageIcon icon = new\
  \ ImageIcon(\"androidBook.jpg\");\nJLabel label = new JLabel(icon);\n```\n\n这里是关于这些行的小知识：\n\
  \n*   `JFrame` 就像一个窗口（除了它被称为 `JFrame` 而不是“window”）。在列表 `20-1` 中，行 `JFrame frame\
  \ = new JFrame();` 创建了一个 `JFrame` 对象，但这一行并没有在任何地方显示这个 `JFrame` 对象。\n*   `ImageIcon`\
  \ 是一图片。在列表 `20-1` 中，行 `ImageIcon icon = new ImageIcon(\"androidBook.jpg\");` 创建了一个\
  \ `ImageIcon` 对象。\n*   `JLabel` 是一个显示文本的地方。在列表 `20-1` 中，行 `JLabel label = new JLabel(icon);`\
  \ 创建了一个 `JLabel` 对象。\n\n\n\n\n但在列表 20-1 中，窗口就是整个应用程序——全部内容。因此，当你点击“x”时，你希望 Java\
  \ 虚拟机能够关闭自己。要实现这一点，你只需调用 `setDefaultCloseOperation` 方法并传入参数 `JFrame.EXIT_ON_CLOSE`。其他备选方案如下：\n\
  \n*   `JFrame.HIDE_ON_CLOSE`: 窗口消失，但它仍然存在于计算机的内存中。\n*   `JFrame.DISPOSE_ON_CLOSE`:\
  \ 窗口消失并且不再存在于内存中。\n*   `JFrame.DO_NOTHING_ON_CLOSE`: 窗口仍然显示、依然存在，并且在你点击“x”之前所做的一切依然。当你点击“x”时，什么都不会发生。因此，使用这个\
  \ `DO_NOTHING_ON_CLOSE` 选项可能会让你变得非常困惑。\n\n![warning.eps](img/warning_fmt.png) 如果你没有调用\
  \ `setDefaultCloseOperation`，Java 会自动选择 `HIDE_ON_CLOSE` 选项。当你点击“x”时，窗口消失了，但 Java\
  \ 程序继续运行。当然，没有可见的窗口，运行列表 20-1 并没有太大作用。运行的唯一明显效果是你开发环境的行为。在 Eclipse 中，控制台视图工具栏中的小方块保持着亮红色。当你悬停在小方块上时，你会看到“Terminate”（终止）提示。因此，要结束\
  \ Java 程序的运行（并让方块恢复到淡红灰色），只需点击这个小方块即可。\n\n*   窗口的 `pack` 方法会根据添加到窗口中的内容对窗口进行“收缩包围”。如果不调用\
  \ `pack`，窗口可能会比所需的尺寸大得多或小得多。\n\n    遗憾的是，默认设置是让窗口比需要的尺寸小得多。如果你在列表 20-1 中忘记调用 `frame.pack`，你就会得到图\
  \ 20-3 所示的微型窗口。当然，你可以用鼠标拖动窗口边缘来放大窗口。但你为什么要那样做呢？直接调用 `frame.pack` 就好了。\n\n    ![9781118407813-fg2003.tif](img/9781118407813-fg2003_fmt.png)\n\
  \n    图 20-3：一个没有 pack 的窗口。\n\n*   调用 `setVisible(true)` 会让窗口出现在你的屏幕上。如果你忘记调用 `setVisible(true)`（我经常也会忘记），当你运行列表\
  \ 20-1 中的代码时，你会在屏幕上什么也看不到。在弄清楚自己哪里错了之前，这种感觉总是很令人沮丧。\n\n### 构造方法调用\n\n在列表 17-3（位于第\
