  \ 窗口将返回以下内容（注意：输出将根据你的版本而异）。\n\n\n\n\n你关注的链接取决于 Eclipse 的众多镜像站点中哪一个提供了你的下载。只需在这些选项中选择并开始下载即可。\n\
  \n## 安装 Eclipse\n\n具体如何安装 Eclipse 取决于你的操作系统以及下载 Eclipse 时获得的什么类型的文件。以下是简要概述：\n\n\
  *   **如果你运行 Windows 且下载的是 `.exe` 文件：**\n    双击 `.exe` 文件的图标。\n\n*   **如果你运行 Windows\
  \ 且下载的是 `.zip` 文件：**\n    将文件内容提取到你选择的目录中。\n    换句话说，在 Windows 资源管理器（也称为 `File Explorer`）中找到\
  \ `.zip` 文件的图标。然后双击 `.zip` 文件的图标。（结果是资源管理器显示了 `.zip` 文件的内容，其中只包含一个文件夹——一个名为 `eclipse`\
  \ 的文件夹。）将 `eclipse` 文件夹拖到你计算机硬盘上一个方便的位置。\n    关于 `.zip` 文件的更多信息，请参阅本章的“压缩归档文件”侧边栏。\n\
  \    我最喜欢拖动 `eclipse` 文件夹的地方是直接到 `C:` 盘。因此我的 `C:` 盘上有名为 `Program Files`、`Windows`、`eclipse`\
  \ 等的文件夹。我避免让 `eclipse` 文件夹成为 `Program Files` 的子文件夹，因为我经常会在处理 `Program Files` 名称中的空格时遇到问题。\n\
  \n*   **如果你运行 Mac OS X：**\n    下载 Eclipse 时，你会得到一个 `.tar.gz` 文件或一个 `.dmg` 文件。\n\
  \    *   `.tar.gz` 文件是一个压缩归档文件。当你下载文件时，你的浏览器可能会为你自动完成解压。如果是这样，你不会在下载文件夹中找到 `.tar.gz`\
  \ 文件。相反，你会找到一个 `.tar` 文件（因为你的浏览器解压了 `.gz` 部分）或一个 `eclipse` 文件夹（因为你的浏览器同时解压了 `.tar`\
  \ 和 `.gz` 部分）。\n        如果你在下载文件夹中找到新的 `.tar` 文件或 `.tar.gz` 文件，反复双击文件直到你看到 `eclipse`\
  \ 文件夹。将这个新的 `eclipse` 文件夹拖到你的应用程序（Applications）文件夹，你就大功告成了。\n    *   如果你下载了 `.dmg`\
  \ 文件，你的浏览器可能会为你打开该文件。如果没有，在下载文件夹中找到 `.dmg` 文件并双击文件。按照双击后出现的任何说明进行操作。如果要求将 Eclipse\
  \ 拖入你的应用程序文件夹，请执行操作。\n\n*   **如果你运行 Linux：**\n    你可能会得到一个 `.tar.gz` 文件，但也有可能得到一个自解压的\
  \ `.bin` 文件。将 `.tar.gz` 文件提取到你喜欢的目录，或执行自解压的 `.bin` 文件。\n\n## 首次运行 Eclipse\n\n第一次启动\
  \ Eclipse 时，你需要执行几个额外的步骤。为了让 Eclipse 运行，请执行以下操作：\n\n1.  **启动 Eclipse。**\n    在 Windows\
  \ 中，开始菜单可能没有 Eclipse 图标。在这种情况下，在 Windows 资源管理器（即 `File Explorer`）中查找包含你提取的 Eclipse\
  \ 文件的文件夹。双击代表 `eclipse.exe` 文件的图标。（如果你看到了 eclipse 文件但没有看到 `eclipse.exe` 文件，请检查本章的“那些讨厌的文件扩展名”侧边栏。）\n\
  \    在 Mac 上，进入 Spotlight 并在搜索字段中输入 `Eclipse`。当 `Eclipse` 作为 Spotlight 列表中的顶部（Top\
  \ Hit）出现时，按回车键。\n    ![tip.eps](img/tip_fmt.png) 在 Mac 上第一次运行 Eclipse 时，可能会收到一条消息，告诉你\
  \ Eclipse 不是来自 App Store，也不是来自已标识的开发者。世界上没有任何东西是 100% 安全的，但我下载并安装 Eclipse 数百万次了，从未出现过问题。因此，为了跳过这个障碍，请在应用程序文件夹（或你安装\
  \ Eclipse 的其他地方）找到 Eclipse 应用项。按 Control 点击应用程序项，并在弹出的右键菜单中选择“打开”。此时会出现一个对话框。该对话框询问你是否确定要打开该应用程序。你确定，点击“打开”。\n\
  \    当你启动 Eclipse 时，你会看到工作空间启动器（Workspace Launcher）对话框（见图 2-10）。该对话框询问你想在计算机硬盘的何处存储你使用\
  \ Eclipse 创建的代码。\n    ![9781118407813-fg0210.tif](img/9781118407813_fg0210_fmt.png)\n\
  \    图 2-10：Eclipse 的工作空间启动器。\n\n2.  **在工作空间启动器对话框中，点击 OK 以接受默认值（或不要接受默认值！）**\n\
  \    无论如何，这都没什么！\n    因为这是你第一次使用特定的 Eclipse 工作空间，Eclipse 会启动并显示欢迎界面（见图 2-11）。由于这是你第一次使用特定的\
  \ Eclipse 工作空间，Eclipse 会启动并显示欢迎界面。\n\n3.  **在工作空间启动器对话框中，悬停在欢迎界面直到找到 Workbench。**\n\
  \n4.  **点击 Workbench 打开其主界面。**\n    一个新的工作空间主界面所示如图 2-11。\n    ![9781118407813-fg0211.tif](img/9781118407813_fg0211_fmt.png)\n\
  \    图 2-11：欢迎界面。\n\n### 在 Eclipse 中配置 Java\n\nEclipse 通常会在你的计算机上查找 Java 安装，并选择一个版本进行使用。你的计算机可能有多个\
  \ Java 版本，所以你可能需要进行检查。\n\n1.  **Windows 或 Linux 上：在 Eclipse 主菜单中选择 Window⇒Preferences。在\
  \ Mac 上：在 Eclipse 主菜单中选择 Eclipse⇒Preferences。**\n    结果是出现了 Preferences 对话框如图 2-13。\n\
  \    ![9781118407813-fg0213.tif](img/9781118407813_fg0213_fmt.png)\n    图 2-13：Preferences\
  \ 对话框。\n\n2.  **在 Preferences 对话框左侧的树中，展开 Java 分支。**\n\n3.  **在 Java 分支中，选择 Installed\
  \ JRE 子分支。**\n\n4.  **查看 Preferences 对话框主体中的 Java 版本列表（Installed JREs）。**\n    在列表中，每个\
  \ Java 版本都有一个复选框。Eclipse 使用勾选的版本。\n    ![9781118407813-fg0212.tif](img/9781118407813_fg0212_fmt.png)\n\
  \    图 2-12：欢迎界面。\n\n5.  **如果你的首选 Java 版本出现在 Installed JRE 列表中，请勾选该版本的复选框。**\n\n\
  6.  **如果你的首选 Java 版本没有出现在 Installed JRE 列表中，点击 Add 按钮。**\n    当你点击 Add 按钮时，会出现 JRE\
  \ Type 对话框（见图 2-14）。\n    ![9781118407813-fg0214.tif](img/9781118407813_fg0214_fmt.png)\n\
  \    图 2-14：JRE Type 对话框。\n\n7.  **在 JRE Type 对话框中，双击 Standard VM。**\n    结果出现了\
  \ JRE Definition 对话框（见图 2-15）。接下来的操作取决于几个不同的因素。\n\n8.  **填写对话框的 JRE Home 字段。**\n\
  \    如何执行此取决于你的操作系统。\n    *   在 Windows 上，浏览到你安装首选 Java 版本的目录。在我许多 Windows 计算机上该目录是\
  \ `C:\\Program Files\\Java\\jre8`、`C:\\Program Files\\Java\\jdk1.8.0`、`C:\\Program\
  \ Files (x86)\\Java\\jre8` 或类似的路径。\n    *   在 Mac 上，使用 Finder 浏览到你安装首选 Java 版本的目录。在对话框的\
  \ JRE Home 字段中输入该目录名称。\n\n\n\n\n我的 Mac 有一个名为 `/System/Library/Java/Java Virtual\
  \ Machines/1.6.0.jdk/Contents/Home` 的 Java 目录，另一个名为 `/Library/Java/JavaVirtualMachines/jdk\
  \ 1.8.0.jdk/Contents/Home` 的 Java 目录。（第一个是 Apple 旧版本的 Java；第二个是 Oracle 新版本的 Java。）你可能在\
  \ `/Library/Internet Plug-Ins/JavaAppletPlugin.plugin/Contents/Home` 目录下也找到 Oracle\
  \ 的 Java。\n\n![9781118407813-fg0215.tif](img/9781118407813-fg0215_fmt.png)\n\n图\
  \ 2-15：JRE 定义对话框（在你遵循步骤 8 和 9 之后）。\n\n![tip.eps](img/tip_fmt.png) 像 `/System` 和\
  \ `/Library` 这样的目录通常不在 Finder 窗口中。要浏览到这些目录之一（例如 `/Library` 目录），请在 Finder 菜单栏中选择\
  \ `前往⇒前往到文件夹`（Go⇒Go to Folder）。在弹出的对话框中，输入 `/Library` 然后按 `前往`。\n\n![tip.eps](img/tip_fmt.png)\
  \ 当你导航到包含首选 Java 版本的目录时，可能会遇到 `JDK 1.8.0.jdk` 图标或其他扩展名为 `.jdk` 的其他项目。要查看此项目的内容，控制点击项目图标，然后选择\
  \ `显示包内容`（Show Package Contents）。\n\n- 在 Linux 上，浏览到你安装首选 Java 版本的目录。如果不确定，请搜索名称以\
  \ `jre` 或 `jdk` 开头的目录。\n\n你可能还需要 JRE 定义对话框中再做一件事。\n\n### 9. **查看 JRE 定义对话框中的 JRE\
  \ 名称字段；如果 Eclipse 没有自动填充名称，请在 JRE 名称字段中输入一个名称（几乎任何文本都可以）。**\n\n### 10. **点击完成（Finish）关闭\
  \ JRE 定义对话框。**\n\nEclipse 的偏好设置对话框回到前景。框中的 `已安装 JRE` 列表包含你新添加的 Java 版本。\n\n### 11.\
  \ **在你新添加的 Java 版本旁边的复选框中打勾。**\n\n你快完成了。（你还有几几个步骤需要遵循。）\n\n### 12. **在偏好设置对话框左侧的\
  \ Java 分支内，选择编译器（Compiler）子分支。**\n\n在偏好设置对话框的主体内，你会看到一个 `编译器合性级别`（Compiler Compliance\
  \ Level）下拉列表（见 2-16）。\n\n![9781118407813-fg0216.tif](img/9781118407813-fg0216_fmt.png)\n\
  \n图 2-16：设置编译器合性级别。\n\n### 13. **在编译器合性级别下拉列表中，选择与你的首选 Java 版本匹配的数字。**\n\n对于 Java\
  \ 7，我选择合性级别 `1.7`。对于 Java 8，我选择合性级别 `1.8`。\n\n### 14. **呼！点击偏好设置对话框的 OK 按钮返回 Eclipse\
  \ 工作区。**\n\n### 导入本书的示例程序\n\n这个导入过程可能会很复杂。从一个对话框移动到另一个对话框时，许多选项的名称相似。这是因为 Eclipse\
  \ 提供了许多不同的方法来导入许多不同类型的内容。无论，只要遵循这些指令就没问题。\n\n1. **遵循本章较早之前的“获取本书的示例程序” 节中的步骤。**\n\
  \n2. **在 Eclipse 的主菜单中，选择 `文件⇒导入`（File⇒Import）（见图 2-17）。**\n\n   结果 Eclipse 显示了\
  \ `导入`（Import）对话框。\n\n![9781118407813-fg0217.tif](img/9781118407813-fg0217_fmt.png)\n\
  \n图 2-17：开始导入本书的代码。\n\n3. **在导入对话框的树状结构中，展开常规（General）分支。**\n\n4. **在常规分支下，双击 `将现有项目导入工作区`（Existing\
  \ Projects into Workspace）子分支（见图 2-18）。**\n\n   结果出现了一个 `导入项目`（Import Projects）对话框。\n\
  \n![9781118407813-fg0218.tif](img/9781118407813-fg0218_fmt.png)\n\n图 2-18：在所有选项中，选择\
  \ `将现有项目导入工作区`。\n\n5. **在导入项目对话框中，选择选择根目录（Select Root Directory）单选按钮或选择归档文件（Select\
  \ Archive File）单选按钮（见图 2-19）。**\n\n   这是如何决定选择哪个单选框：\n\n   首先，确保你遵循了侧边栏的建议。\n\n\
  \   - 当你导航到包含首选 Java 版本的目录时，可能会遇到 `JDK 1.8.0.jdk` 图标或其他扩展名为 `.jdk` 的其他项目。要查看此项目的内容，控制点击项目图标，然后选择\
  \ `显示包内容`。\n   - 像 `/System` 和 `/Library` 这样的目录通常不在 Finder 窗口中。要浏览到这些目录之一（例如 `/Library`\
  \ 目录），请在 Finder 菜单栏中选择 `前往⇒前往文件夹`。在弹出的对话框中，输入 `/Library` 然后按 `前往`。\n   - 在 Linux\
  \ 上，浏览到你安装首选 Java 版本的目录。如果不确定，请搜索名称以 `jre` 或 `jdk` 开头的目录。\n   - 如果浏览器会自动解压 `.zip`\
  \ 文件，请选择归档文件单选按钮。\n   - 如果你的浏览器没有自动解压 `.zip` 文件，请选择根目录单选按钮。\n\n6. **点击浏览（Browse）按钮找到本书的代码。**\n\
  \n   结果 `导入` 对话框显示了内部的项目名称。（见图 2-17）。\n\n7. **点击全选（Select All）按钮。**\n\n   本书的示例太令人兴奋了，你想导入所有！\n\
  \n8. **点击完成（Finish）按钮。**\n\n   结果主 Eclipse 工作区出现。`已安装 JRE` 列表包含你新添加的 Java 版本。\n\n\
  9. **在你新添加的 Java 版本旁边的复选框中打勾。**\n\n   你快完成了。（你还有几几个步骤需要遵循。）\n\n10. **在偏好设置对话框左侧的\
  \ Java 分支内，选择编译器（Compiler）子分支。**\n\n    在偏好设置对话框的主体内，你会看到一个 `编译器合性级别`（Compiler Compliance\
  \ Level）下拉列表（见图 2-16）。\n\n11. **在编译器合性级别下拉列表中，选择与你的首选 Java 版本匹配的数字。**\n\n    对于\
  \ Java 7，我选择合性级别 `1.7`。对于 Java 8，我选择合性级别 `1.8`。\n\n12. **点击偏好设置对话框的 OK 按钮返回 Eclipse\
  \ 工作区。**\n\n\n\n\n\n房贷贷款计算程序不会打开自己的窗口。相反，该程序在 Eclipse 的控制台（Console）视图中运行。控制台视图是\
  \ Eclipse 工作区右下角部分的标签卡之一（参见图 3-1）。完全在控制台视图中运行的程序被称为`基于文本程序`。\n\n![9781118407813-fg0301.tif](img/9781118407813-fg0301_fmt.png)\n\
  \n图 3-1：本章基于文本的房贷贷款程序的运行。\n\n![tip.eps](img/tip_fmt.png) 你可能在 Eclipse 工作区的右下角没有看到“控制台（Console）”标签卡。要让控制台视图显示，选择`Window（窗口）⇒Show\
  \ View（显示视图）⇒Other（其他）`。在弹出的“显示视图”对话框中，展开`General（通用）`分支。最后，在该 `General` 分支内，双击\
  \ `Console（控制台）`项目。\n\n有关控制台视图（以及关于 Eclipse 工作区）的更多信息，请参见本章后后的“[Views, editors,\
  \ and other stuff”部分。\n\n![ontheweb.eps](img/ontheweb_fmt.png) 你可以通过访问书籍的网站（[allmycode.com/BeginProg](http://allmycode.com/beginprog)），在图\
  \ 3-1 以及书中许多其他示例中看到该程序的 GUI 版本。\n\n实际上，当你运行房贷贷款程序时，你会在 Eclipse 的控制台视图中看到两个内容：\n\n\
