  \n图 6-1: 运行列表 [6-1] 中的代码。\n\n## 使用变量\n\n列表 [6-1] 中的代码使用了一个名为 `amount` 的变量。`variable`（变量）是一个占位符。你可以将像\
  \ `5.95` 这样的数字放入变量中。在变量中放置一个数字后，你可以改变主意，并将另一个数字（如 `30.95`）放入变量中。（这就是变量中发生变化的地方。）当然，当你向变量中放入一个新数字时，旧数字就不存在了。如果你没有在其他地方保存旧数字，旧数字就消失了。\n\
