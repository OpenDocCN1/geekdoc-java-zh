  \ `diskWriter.print()`。要向输出文件写入行的剩余部分，请调用 `diskWriter.println()`。\n\n![tip.eps](img/tip_fmt.png)\
  \ Eclipse 具有创建和插入代码模板的内置功能。要开始使用 Eclipse 模板，选择 `Window⇒Preferences`（Windows 系统）或\
  \ `Eclipse⇒Preferences`（Mac 系统）。在弹出的 Preferences 对话框中，选择 `Java⇒Editor⇒Templates`。创建新模板并不简单。但如果你稍微研究一下，就能完成很多工作。\n\
  \n如果你的程序从一个磁盘文件获取输入并向另一个文件写入输出，请结合列表 [13-3] 和 [13-4] 中的内容。当你这样做时，就会得到一个类似于列表 [13-2]\
  \ 中的程序。\n\n### 运行示例程序\n\n测试列表 [13-2] 中的代码是一个三步骤的过程。以下是这三个步骤的概述：\n\n1. 创建 `rawData.txt`\
  \ 文件。\n2. 运行列表 [13-2] 中的代码。\n3. 查看 `cookedData.txt` 文件的内容。\n\n接下来的几节将详细介绍每个步骤。\n\
  \n#### 创建输入文件\n\n你可以使用任何简单的文本编辑器为列表 [13-2] 中的代码创建一个输入文件。在本节中，我将向你展示如何使用 Eclipse\
  \ 的内置编辑器。要创建输入文件：\n\n1. 在 Eclipse 的 Package Explorer 中选择一个项目。在本例中，选择 `13-02` 项目（包含列表\
  \ [13-2] 中代码的项目）。\n![remember.eps](img/remember_fmt.png) 在 Package Explorer 中，选择标签为项目名称的分支。（选择\
  \ `13-02` 分支以运行列表 [13-2] 中的代码）。不要选择项目内部的项。（例如，不要选择 `src` 分支或 `default` 包分支。）\n2.\
  \ 在 Eclipse 的主菜单中，选择 `File⇒New⇒File`。打开 Eclipse 的 New File 对话框。\n3. 在 `File Name`\
  \ 字段中，输入你新数据文件的名称。你可以输入计算机认为有效的任何文件作为名称。对于本节的示例，我使用了 `rawData.txt` 作为名称，但其他名称如 `rawData.dat`、`rawData`\
  \ 或 `raw23.01.dataFile` 也可以。我尽量避免引起麻烦的名称（包括简短且无信息的名称以及包含空格的名称），但你选择的名称完全取决于你（以及你的电脑操作系统、你老板的喜好以及你客户的规范）。\n\
  4. 点击 Finish。文件名将出现在 Eclipse 的 Package Explorer 中。Eclipse 的编辑器区域将出现一个空编辑器（标签页上显示新文件的名称）。\n\
  5. 在编辑器中输入文本。为了创建本节的示例，我输入了文本 `19.955`，如图 [13-4] 所示。\n![9781118407813-fg1304.tif](img/9781118407813-fg1304_fmt.png)\n\
  图 13-4：编辑输入文件。\n![warning.eps](img/warning_fmt.png) 当你使用 Eclipse 创建输入文件时，适用本节步骤。你可以使用其他程序创建输入文件，例如\
  \ Windows 记本文或 Macintosh TextEdit。但如果你这样做，必须小心文件格式和文件后缀。例如，要使用 Windows 记本文创建一个名为\
  \ `raw23.01.dataFile` 的文件，在 Save As 对话框的 `File Name` 字段中输入 `\"raw23.01.dataFile\"\
  `（带引号）。如果不加引号，记本文可能会为文件名添加 `.txt`（将 `raw23.01.dataFile` 变为 `raw23.01.dataFile.txt`）。类似的问题也适用于\
  \ Macintosh TextEdit。默认情况下，TextEdit 为每个新文件添加 `.rtf` 扩展名。要覆盖特定文件的 `.rtf`，可以在保存文件之前选择\
  \ `Format⇒Make Plain Text`。在保存文件时，TextEdit 会询问是否添加 `.txt` 扩展名。在 Save As 对话框中，如果你不想文件名以\
  \ `.txt` 结尾，请取消勾选 `If no extension is provided, use \".txt\"`。\n\n### 运行代码\n\n要让\
  \ Eclipse 运行代码，执行与任何其他 Java 程序相同的操作。选择你要运行的项目（本例中为 13-02）。然后选择 `Run⇒Run As⇒Java\
  \ Application`。\n\n当你运行列表 [13-2] 中的程序时，Eclipse 的 Console 视图没有任何显示。这种完全没有输出的情况让人感到不安。事实上，列表\
  \ [13-2] 中的程序在后台工作。程序没有读取键盘的语句也没有打印到屏幕的语句。因此，如果你的硬盘很大，当你选择 `Run⇒Run As⇒Java Application`\
  \ 时可能会听到轻微的声音，但你不会输入任何输入，也看不到任何程序输出。\n\n程序将其所有输出发送到硬盘上的一个文件中。那么你如何查看文件内容呢？\n\n####\
  \ 查看输出文件\n\n要查看列表 [13-2] 的输出，请遵循以下步骤：\n\n1. 在 Package Explorer 中，选择 `13-02` 项目分支。\n\
  2. 在主菜单中，选择 `File⇒Refresh`。\n3. 在 Package Explorer 中，展开 `13-02` 项目分支。一个名为 `cookedData.txt`\
  \ 的新文件出现在 Package Explorer 树中（在 13-02 项目中）。\n4. 双击 Package Explorer 树中的 `cookedData.txt`\
  \ 分支。`cookedData.txt` 的出现在 Eclipse 编辑器中。（参见图 [13-5]。）\n\n![9781118407813-fg1305.tif](img/9781118407813-fg1305_fmt.png)\n\
  图 13-5：查看输出文件。\n\n### 磁盘文件问题的排排除\n\n\n\n\n当你运行代码列表 13-2 中的代码时，计算机会执行 `new Scanner(new\
  \ File(\"rawData.txt\"))`。如果 Java 虚拟机找不到 `rawData.txt` 文件，你会看到一条类似于图 13-6 所示的消息。这种错误信息可能会非常让人沮丧。在很多情况下，你很清楚硬盘上有一个\
  \ `rawData.txt` 文件，但那台笨的计算机就是找不到它。\n\n![9781118407813-fg1306.tif](img/9781118407813-fg1306_fmt.png)\n\
  \n图 13-6：计算机找不到你的文件。\n\n没有快速且万无一的方法来解决这个问题。但你应该始终首先检查以下几点：\n\n* **再次检查名为 `rawData.txt`\
  \ 的文件。**\n  打开“我的电脑”（Windows 系统）或“访达”（Mac 系统），寻找一个名为该名称的文件。\n  ![tip.eps](img/tip_fmt.png)\
  \ “我的电脑”和“访达”中显示的文件名具有误导性。你可能会看到名称 `rawData`，尽管文件的实际上是 `rawData.txt`。要从根本上解决这个问题，请参阅第\
  \ 2 章。\n\n* **检查文件名的拼写。**\n  确保程序中的名称与硬盘上的文件名完全相同。仅仅是一个字母的错误就可能导致计算机找不到文件。\n\n*\
  \ **如果你使用 Linux（或 Mac OS X 以外的 UNIX 变体），检查文件名的大小写。**\n  在 Linux 和许多版本的 UNIX 中，大写和小写字母之间的区别会让计算机产生困惑。\n\
  \n* **检查文件是否在正确的目录下。**\n  确实，你有一个名为 `rawData.txt` 的文件。但不要期望你的 Java 程序去搜索硬盘上的每一个文件夹来寻找该文件。你怎么知道哪个文件夹应该存放像\
  \ `rawData.txt` 这样的文件呢？\n\n它的工作原理是：每个 Eclipse 项目在你的计算机硬盘上都有自己的文件夹。在图 13-5 中，你可以看到\
  \ 13-02 项目文件夹及其 `src` 子文件夹。但在图 13-7 中，Windows 资源管理器显示了 13-02 文件夹、它的 `src` 子文件夹以及其他名为\
  \ `.settings` 和 `bin` 的其他子文件夹。（Mac 用户可以在访达窗口中看到相同的子文件夹）。\n\n`src`、`bin` 和 `.settings`\
  \ 文件夹包含自己的文件。但在图 13-7 中，`rawData.txt` 和 `cookedData.txt` 文件直接位于 13-02 项目文件夹内部。换句话说，`rawData.txt`\
  \ 和 `cookedData.txt` 文件位于 13-02 项目文件夹的根目录下。\n\n![remember.eps](img/remember_fmt.png)\
  \ 当你运行本节的示例时，`rawData.txt` 文件应该位于硬盘上 13-02 项目文件夹的根目录下。这就是为什么在“创建输入文件”部分的第 1 步中，我提醒你选择\
  \ 13-02 项目文件夹而不是项目的 `src` 子文件夹。\n\n图 13-7 显示了 Eclipse 项目根目录下的输入和输出文件。但通常情况下，文件位置可能会棘手，特别是当你从\
  \ Eclipse 切换到一个不熟悉的 IDE 时。通用规则（将输入和输出文件直接放在项目目录内）可能不适用于其他编程环境。\n\n所以这里有一个你可以使用的技巧：无论你使用哪种\
  \ IDE（甚至即使你在不使用 IDE 的情况下创建 Java 程序），都运行列表 13-2 中的这个精简版代码：\n\n```java\nimport java.io.File;\n\
  import java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\nclass JustWrite\
  \ {\n    public static void main(String args[])\n        throws FileNotFoundException\
  \ {\n        PrintStream diskWriter =\n            new PrintStream(\"cookedData.txt\"\
  );\n        diskWriter.println(99.75);\n        diskWriter.close();\n    }\n}\n\
  ```\n\n这个程序不需要死的 `rawData.txt` 文件。如果你运行这段代码且没有报错，请在你的硬盘上搜索该程序的输出（`cookedData.txt`\
  \ 文件）。注意包含 `cookedData.txt` 文件的文件夹名称。当你将 `rawData.txt` 放在同一个文件夹，运行列表 13-2 代码时遇到的任何问题都会消失。\n\
  \n![9781118407813-fg1307.tif](img/9781118407813-fg1307_fmt.png)\n\n图 13-7：计算机硬盘上的\
  \ 13-02 文件夹内容。\n\n* **检查 rawData.txt 文件的内容。**\n  查看 `rawData.txt` 文件没有坏，确保它包含数字\
  \ `99.75`。如果 `rawData.txt` 没有出现在 Eclipse 编辑器中，在包资源管理器中双击 13-2 默认情况下，Java 的 `Scanner`\
  \ 类查找值之间的空格。因此，此示例的 `rawData.txt` 文件应该包含 `99.75 5`，而不是 `99.755` 或 `99.75,5`。\n\n\
  ![technicalstuff.eps](img/technicalstuff_fmt.png) `Scanner` 类查找任何空白字符。这些空白字符包括空格、制表符和换行符。因此，例如，`rawData.txt`\
  \ 文件可能包含 `99.75 5`（在 `99.75` 和 `5` 之间有几个空格），或者分行显示 `99.75` 和 `5`。\n\n## 编写面向磁盘程序\n\
  \n列表 13-2 与列表 13-1 非常相似。事实上，你可以通过简单的编辑将列表 13-1 变为列表 13-2。方法如下：\n\n* **在代码开头添加以下导入声明：**\n\
  \  ```java\n  import java.io.File;\n  import java.io.FileNotFoundException;\n  import\
  \ java.io.PrintStream;\n  ```\n\n* **在方法头部添加以下 throws 子句：**\n  ```java\n  throws\
  \ FileNotFoundException\n  ```\n\n* **在 `new Scanner` 的调用中，将 `System.in` 替换为 `new\
  \ File` 的调用：**\n  ```java\n  Scanner aVariableName = new Scanner(new File(\"inputFileName\"\
  ));\n  ```\n\n* **创建一个用于写入磁盘文件的 `PrintStream`：**\n  ```java\n  PrintStream anotherVariableName\
  \ = new PrintStream(\"outputFileName\");\n  ```\n\n* **在 `nextInt()`、`nextLine()`\
  \ 等调用中使用 `Scanner` 变量名。**\n  例如，为了从列表 13-1 变为列表 13-2，我更改了：\n  ```java\n  unitPrice\
  \ = keyboard.nextDouble();\n  quantity = keyboard.nextInt();\n  ```\n  改为：\n  ```java\n\
  \  unitPrice = diskScanner.nextDouble();\n  quantity = diskScanner.nextInt();\n\
  \  ```\n\n* **在 `print` 和 `println` 调用中使用 `PrintStream` 变量名。**\n  例如，为了从列表 13-1\
  \ 变为列表 13-2，我更改了：\n  ```java\n  System.out.println(total);\n  ```\n  改为：\n  ```java\n\
  \  diskWriter.println(total);\n  ```\n\n* **在 `close()` 调用中使用 `Scanner` 变量名。**\n\
  \  例如，为了从列表 13-1 变为列表 13-2，我更改了：\n  ```java\n  keyboard.close();\n  ```\n  改为：\n\
  \  ```java\n  diskScanner.close();\n  ```\n\n* **在 `close()` 调用中使用 `PrintStream`\
  \ 变量名。**\n  例如，为了从列表 13-1 变为列表 13-2，我添加了：\n  ```java\n  diskWriter.close();\n  ```\n\
  \  在 main 方法结束处。\n\n### 读取文件\n\n所有的 `Scanner` 方法都可以从现有的磁盘文件读取。例如，要从名为 `mySpeech`\
  \ 的文件中读取一个单词，使用如下类型的代码：\n\n```java\nScanner diskScanner = new Scanner(new File(\"\
  mySpeech\"));\n```\n\n\n\n\n\n```java\nString oneWord = diskScanner.next();\n```\n\
  \n要从名为 `letters.dat` 的文件中读取一个字符并将该字符显示在屏幕上，你可以像这样做：\n\n```java\nScanner diskScanner\
  \ =\n    new Scanner(new File(\"letters.dat\"));\nSystem.out.println(\n    diskScanner.findWithinHorizon(\"\
  .\",0).charAt(0));\n```\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 注意看我是从名为\
  \ `mySpeech` 的文件中读取的，而不是 `mySpeech.txt` 或 `mySpeech.doc`。你放在点之后的任何内容都被称为*文件扩展名*，对于一个包含数字和其他数据的文件，文件扩展名是可选的。当然，一个\
  \ Java 程序必须命名为 `something.java`，但数据文件可以命名为 `mySpeech.txt`、`mySpeech.reallymine.allmine`\
  \ 或仅仅是 `mySpeech`。只要你在新的 `File` 调用中使用的名称与你电脑硬盘上的文件名相同，一切都是没问题的。\n\n### 写入文件\n\n\
  `print` 和 `println` 方法可以写入磁盘文件。这里有一些示例：\n\n- 在运行列表 13-2 中的代码期间，变量 `total` 存储了数字\
  \ `99.75`。要将 `99.75` 写入 `cookedData.txt` 文件，你执行：\n  ```java\n  diskWriter.println(total);\n\
  \  ```\n  由于列表 13-2 中的以下代码行，此 `println` 调用被写入了磁盘文件：\n  ```java\n  PrintStream diskWriter\
  \ =\n      new PrintStream(\"cookedData.txt\");\n  ```\n- 在程序的另一个版本中，你可能决定不使用 `total`\
  \ 变量。要将 `99.75` 写入 `cookedData.txt` 文件，你可以调用：\n  ```java\n  diskWriter.println(unitPrice\
  \ * quantity);\n  ```\n- 为了在屏幕上显示 `OK`，你可以进行以下方法调用：\n  ```java\n  System.out.print(\"\
  OK\");\n  ```\n  要将 `OK` 写入名为 `approval.txt` 的文件，你可以使用以下代码：\n  ```java\n  PrintStream\
  \ diskWriter =\n      new PrintStream(\"approval.txt\");\n  diskWriter.print(\"\
  OK\");\n  ```\n- 你可能决定将 `OK` 作为两个独立的字符写入。写入屏幕，你可以进行以下调用：\n  ```java\n  System.out.print('O');\n\
  \  System.out.print('K');\n  ```\n  要将 `OK` 写入 `approval.txt` 文件，你可以使用以下代码：\n  ```java\n\
  \  PrintStream diskWriter =\n      new PrintStream(\"approval.txt\");\n  diskWriter.print('O');\n\
  \  diskWriter.print('K');\n  ```\n- 与 `System.out` 的对应方法一样，磁盘写入 `print` 和 `println`\
  \ 方法在行尾行为上不同。例如，你想在屏幕上显示以下文本：\n  ```\n  Hankees  Socks\n  7         3\n  ```\n \
  \ 为了实现这一点，你可以进行以下方法调用：\n  ```java\n  System.out.print(\"Hankees  \");\n  System.out.println(\"\
  Socks\");\n  System.out.print(7);\n  System.out.print(\"        \");\n  System.out.println(3);\n\
  \  ```\n  要将相同的文本写入名为 `scores.dat` 的文件，你可以使用以下代码：\n  ```java\n  PrintStream diskWriter\
  \ =\n      new PrintStream(\"scores.dat\");\n  diskWriter.print(\"Hankees  \");\n\
  \  diskWriter.println(\"Socks\");\n  diskWriter.print(7);\n  diskWriter.print(\"\
  \        \");\n  diskWriter.println(3);\n  ```\n\n### 写入、重写和再次写入\n\n由于我顽皮的性格，我尝试了一个小实验。我问自己，如果多次运行同一个文件写入程序会发生什么。所以我创建了一个微型程序（列表\
  \ 13-5 中的程序），并且我运行了两次该程序。然后我检查了程序的输出文件。输出文件（图 13-8 所示）只包含两个字母。\n\n列表 13-5：一个小实验\n\
  \n```java\nimport java.io.File;\nimport java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\
  \nclass WriteOK {\n    public static void main(String args[])\n        throws FileNotFoundException\
  \ {\n        PrintStream diskWriter =\n            new PrintStream(new File(\"approval.txt\"\
  ));\n        diskWriter.print('O');\n        diskWriter.println('K');\n        diskWriter.close();\n\
  \    }\n}\n```\n\n![9781118407813-fg1308.tif](img/9781118407813-fg1308_fmt.png)\n\
  \n图 13-8：测试水\n\n以下是从实验开始到结束的步骤：\n\n1. 列表 13-5 中的 `new PrintStream(new File(\"approval.txt\"\
  ))` 调用创建了 `approval.txt`。（等，让我们重新检查）：\n   ```java\n   PrintStream diskWriter =\n\
  \       new PrintStream(\"approval.txt\"));\n   ```\n   最初，`approval.txt` 文件是空的。\n\
  2. 我运行列表 13-5 中的代码。\n   每个实验都有一个开始。\n3. 我再次运行列表 13-5 中的代码。\n   运行代码后，`approval.txt`\
  \ 文件只包含两个字母：`OK`。\n\n\n\n\n果真如此。BurdBrain.com 的网络管理员有一份包含 10,000 名员工电子邮件地址的列表。更准确地说，管理员硬盘上有一个名为\
  \ `email.txt` 的文件。该文件包含 10,000 个电子邮件地址，每行一个，如图 14-1 所示。\n\n![9781118407813-fg1401.tif](img/9781118407813-fg1401_fmt.png)\n\
  \n图 14-1：电子邮件地址列表。\n\n公司的电子邮件软件有一个有趣的功能。在公司内部发送邮件时，不需要输入整个电子邮件地址。例如，向 `John` 发送邮件时，只需要输入用户名\
  \ `John` 而不是 `John@BurdBrain.com`。（这个 `@BurdBrain.com` 部分被称为`主机名`。）\n\n因此，公司的网络管理员想要提炼\
  \ `email.txt` 文件的内容。她想要一个新文件 `usernames.txt`，其中包含没有主机名的用户名，如图 14-2 所示。\n\n![9781118407813-fg1402.tif](img/9781118407813-fg1402_fmt.png)\n\
  \n图 14-2：从电子邮件地址列表中提取的用户名。\n\n## 重构现有代码\n\n为了解决管理员的问题，你需要修改列表 12-5 中的代码。新版本从磁盘文件读取电子邮件地址，并将用户名写入另一个磁盘文件。新版本位于列表\
  \ 14-1 中。\n\n列表 14-1：从一个文件到另一个文件\n\n```java\nimport java.util.Scanner;\nimport java.io.File;\n\
  import java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\nclass ListOneUsername\
  \ {\n    public static void main(String args[])\n            throws FileNotFoundException\
  \ {\n        Scanner diskScanner =\n            new Scanner(new File(\"email.txt\"\
  ));\n        PrintStream diskWriter =\n            new PrintStream(\"usernames.txt\"\
  );\n        char symbol;\n        symbol =\n            diskScanner.findWithinHorizon(\"\
  .\",0).charAt(0);\n        while (symbol != '@') {\n            diskWriter.print(symbol);\n\
  \            symbol =\n                diskScanner.findWithinHorizon(\".\",0).charAt(0);\n\
  \        }\n        diskWriter.println();\n        diskScanner.close();\n      \
  \  diskWriter.close();\n    }\n}\n```\n\n列表 14-1 的的功能与列表 12-5 中的前身几乎相同。唯一的区别是列表\
  \ 14-1 中的代码不与用户交互。相反，列表 14-1 中的代码与磁盘文件交互。\n\n## 运行你的代码\n\n以下是运行列表 14-1 中代码的方法：\n\
  \n1. 在你的 Eclipse 项目目录中**创建一个名为** `email.txt` 的文件。\n   在 `email.txt` 文件中只放入一个电子邮件地址。只要地址包含\
  \ `@` 符号，即可。\n2. **将** `ListOneUsername.java` 文件（来自列表 14-1 的代码）放在项目的 `src/(default)`\
  \ 目录中。\n3. **运行列表** 14-1 中的代码。\n   当你运行代码时，控制台中什么都没有显示。真遗憾的！\n4. **查看** `usernames.txt`\
  \ 文件的内容。\n   如果你的 `email.txt` 文件包含 `John@BurdBrain.com`，那么 `usernames.txt` 文件就包含\
  \ `John`。\n\n有关这些步骤之一的更多详细信息，请参阅列表 13-2、13-3 以及第 13 章中的配套讨论。\n\n## 创建有用的代码\n\n上一节描述了管理员的问题——从一个充满电子邮件地址的文件创建一个包含用户名的文件。列表\
  \ 14-1 中的代码解决了部分问题——提取电子邮件地址。这是一个很好的开始，但为了获取一个用户名不需要计算机程序。纸和笔就能做到。\n\n所以不要让管理员等待。在本节中，你将开发一个处理硬盘上几十、数百甚至数千电子邮件地址的程序。\n\
  \n首先，你需要一个策略来创建程序。取列表 14-1 中的语句并重复执行它们。更好，是你已经知道如何重复某项操作：使用循环。（参见第 12 章的基础知识。）\n\
  \n所以策略是：将列表 14-1 中的语句封装在一个更大的循环中：\n\n```java\nwhile (not at the end of email.txt\
  \ file) {\n    Execute the statements in Listing 14-1\n}\n```\n\n回看列表 14-1 中的代码，你会发现代码自带一个\
  \ `while` 循环。因此这种策略涉及到将一个循环放在另一个循环内部：\n\n```java\nwhile (not at the end of email.txt\
  \ file) {\n    //Blah-blah\n    while (symbol != '@') {\n        //Blah-blah\n \
  \   }\n    //Blah-blah-blah\n}\n```\n\n由于一个循环在另一个内部，它们被称为嵌套循环。旧循环（`symbol != '@'`）是内层循环。新循环（文件结束）被称为外层循环。\n\
  \n### 检查文件结束\n\n现在你需要一种测试循环的方法。你如何知道到达了 `email.txt` 文件的末尾？\n\n答案来自 Java 的 `Scanner`\
  \ 类。该 `hasNext()` 方法回答以下问题：\n\n`email.txt` 文件还有可读的内容（在你已经读取的内容之外）吗？\n\n如果程序的 `findWithinHorizon`\
  \ 调用没有吞掉 `email.txt` 文件中的所有字符，`diskScanner.hasNext()` 的值为 `true`。因此，在到达 `email.txt`\
  \ 文件末尾之前继续循环，你需要执行操作：\n\n```java\nwhile (diskScanner.hasNext()) {\n    Execute the\
  \ statements in Listing 14-1\n}\n```\n\n这种策略的首次实现在列表 14-2 中。\n\n列表 14-2：循环的机械组合\n\
  \n```java\n/* 该代码无效（但你可以从错误中学习）。 */\nimport java.util.Scanner;\nimport java.io.File;\n\
  import java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\nclass ListAllnames\
  \ {\n    public static void main(String args[])\n            throws FileNotFoundException\
  \ {\n        Scanner diskScanner =\n            new Scanner(new File(\"email.txt\"\
  ));\n        PrintStream diskWriter =\n            new PrintStream(\"usernames.txt\"\
  );\n        char symbol;\n        while (diskScanner.hasNext()) {\n            symbol\
  \ = diskScanner.findWithinHorizon(\".\",0).charAt(0);\n            while (symbol\
  \ != '@') {\n                diskWriter.print(symbol);\n                symbol =\
  \ diskScanner.findWithinHorizon(\".\",0).charAt(0);\n            }\n           \
  \ diskWriter.println();\n        }\n        diskScanner.close();\n        diskWriter.close();\n\
  \    }\n}\n```\n\n当你运行列表 14-2 中的代码时，你会得到图 14-3 所示令人失望的响应。\n\n![9781118407813-fg1403.tif](img/9781118407813-fg1403_fmt.png)\n\
