  \ 号房间住一个客人，你执行了 `guestsIn[2] = 1`。现在你有两个变量——`numGuests` 和 `whichRoom`。也许 `numGuests`\
  \ 是 5，而 `whichRoom` 是 7。为了让 7 号房间住 `numGuests` 个客人，你可以执行 `guestsIn[whichRoom] =\
  \ numGuests`。\n* **询问用户程序是否继续运行。** 还有更多房间要入住吗？为了找出答案，执行这段代码：\n  ```java\n  out.print(\"\
  Do another? \");\n} while (keyboard.findWithin(\".0\").charAt(0) == 'Y');\n  \n\
  * **显示每个房间的人数。** 没问题！你已经做过了。你可以几乎封不动地从列表 16-1 拷贝代码：\n  ```java\n  out.println(\"\
  Room\\tGuests\");\n  for (int roomNum = 0; roomNum < 10; roomNum++) {\n      out.print(roomNum);\n\
  \      out.print(\"\\t\");\n      out.println(guestsIn[roomNum]);\n  }\n  ```\n\
  \  这段最新的代码与列表 16-1 中的内容的唯一区别在于，这段代码使用了 `guestsIn` 数组。第一次循环时，代码执行 `out.println(guestsIn[0])`\
  \ 显示 0 号房间的人数。下次循环时，代码执行 `out.println(guestsIn[1])` 显示 1 号房间的人数。最后一次循环时，代码执行 `out.println(guestsIn[9])`。非常完美。\n\
  \n将这五个部分组合后的完整程序在列表 16-5 中。程序的运行结果如图 16-7 所示。\n\n\n...\n\n\n\n章节 6, 7 和 8 介绍了 Java\
  \ 的原始类型——如 `int`、`double`、`char` 和 `boolean` 等类型。这很好，但现实世界中的问题有多频繁只处理这些简单的值呢？考虑一下商人和客户之间的交易。客户进行购买，这可能涉及物品名称、型号、信用卡信息、销售税率以及许多其他内容。\n\
  \n在旧的计算机编程语言中，你将整个购买过程看作一大堆未分类的衣物。想象有一堆袜子、衬衫和其他衣服。你没有篮子，所以你抓了尽可能多你能拿得的东西。当你走向洗衣机时，你掉了几件东西——这里掉了一只袜子，那里掉了一条毛巾。这就像是旧的存储购买值的方式。在旧语言中，没有所谓的“购买”。只有\
  \ `double` 值、`char` 值和其他零散的物品。你将购买金额放在一个变量里，将客户名字放在另一个里，将销售税数据放在其他地方。但这太糟糕了。在往编译器的路上，你往往会掉东西。由于程序中的微小错误，你很容易在这里漏掉一个金额，在那里漏掉一个名字。\n\
  \n所以，对于洗衣服和计算机编程来说，如果你有一个篮子情况会更好。较新的编程语言（如 Java）允许你组合这些值并创建新的、更有用的值类型。例如，在 Java\
  \ 中，你可以将 `double` 值、`boolean` 值和其他类型的值组合起来，创建一个你称为 `Purchase`（购买）的东西。因为你的购买信息都在一个大包里，所以跟踪购买的各个部分就变得更容易了。这是一个重要的计算机编程概念的开始——面向对象编程的概念。\n\
  \n## 创建类\n\n我从一个“传统”的示例开始。代码列表 17-1 中的程序处理简单的购买数据。图 17-1 显示了程序的两次运行。\n\n列表 17-1:\
  \ 采用式做法\n\n```java\nimport java.util.Scanner;\n\nclass ProcessData {\n    public\
  \ static void main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
  \        double amount;\n        boolean taxable;\n        double total;\n     \
  \   System.out.print(\"Amount: \");\n        amount = keyboard.nextDouble();\n \
  \       System.out.print(\"Taxable? (true/false) \");\n        taxable = keyboard.nextBoolean();\n\
  \        if (taxable) {\n            total = amount * 1.05;\n        } else {\n\
  \            total = amount;\n        }\n        System.out.print(\"Total: \");\n\
  \        System.out.println(total);\n        keyboard.close();\n    }\n}\n```\n\n\
  ![9781118407813-fg1701.tif](img/9781118407813-fg1701_fmt.png)\n\n图 17-1: 处理客户的购买。\n\
  \n如果图 17-1 中的输出看起来很奇怪，是因为我在代码中没有做任何操作来控制小数点后的位数。因此在输出中，值 $20.00$ 看起来像 20.0。这没关系。我会在第\
  \ 18 章向你展示如何解决这个问题。\n\n### 引用类型和 Java 类\n\n列表 17-1 中的代码涉及几个简单值——`amount`、`taxable`\
  \ 和 `total`。所以本章的核心观点是：通过组合几个值，你可以获得一个单一且更有用的值。这就是工作原理。你选取 Java 的一些原始类型，将它们混合成一个原始类型，你得到了什么？你得到了一个名为引用类型（reference\
  \ type）的更有用的类型。列表 17-2。\n\n列表 17-2: 什么是“购买”\n\n```java\nclass Purchase {\n    double\
  \ amount;\n    boolean taxable;\n    double total;\n}\n```\n\n列表 17-2 中的代码没有 `main`\
  \ 方法，所以 Eclipse 可以编译这段代码，但你无法运行它。当你从 Eclipse 的主菜单选择“运行方式”（Run As）时，结果菜单中没有“Java\
  \ ”（Java Application）。你可以点击 Eclipse 工具栏上微小的“运行方式”按钮并选择“Java ”。但你就会收到图 17-2 所示的消息。\n\
  \n![9781118407813-fg1702.tif](img/9781118407813-fg1702_fmt.png)\n\n图 17-2: 列表 17-2\
  \ 中的代码没有 `main` 方法。\n\n### 使用新定义的类\n\n为了对列表 17-2 中的代码做一些用的操作，你需要一个 `main` 方法。你可以将\
  \ `main` 方法放在单独的文件中。列表 17-3 向你展示了这样一个文件。\n\n列表 17-3: 使用你的 Purchase 类\n\n```java\n\
  import java.util.Scanner;\n\nclass ProcessData {\n    public static void main(String\
  \ args[]) {\n        Scanner keyboard = new Scanner(System.in);\n        Purchase\
  \ purchase = new Purchase();\n        System.out.print(\"Amount: \");\n        purchase.amount\
  \ = keyboard.nextDouble();\n        System.out.print(\"Taxable? (true/false) \"\
  );\n        purchase.taxable = keyboard.nextBoolean();\n        if (purchase.taxable)\
  \ {\n            purchase.total = purchase.amount * 1.05;\n        } else {\n  \
  \          purchase.total = purchase.amount;\n        }\n        System.out.print(\"\
  Total: \");\n        System.out.println(purchase.total);\n        keyboard.close();\n\
  \    }\n}\n```\n\n理解列表 17-3 代码的最佳方法是将其逐行与列表 17-1 进行对比。事实上，有一种机械公式可以将列表 17-1 中的代码转换为列表\
  \ 17-3 中的代码。表 17-1 描述了这种转换。\n\n表 17-1 将代码转换为类\n\n| 在列表 17-1 中 | 在列表 17-3 中 |\n|\
