  \n### 使用 JavaFX 和 Scene Builder\n\nGUI 程序有两个有趣的特性：\n\n*   **GUI 程序通常包含大量的代码。**\n\
  \    这些代码中的大部分一部分在不同的 GUI 程序之间区别很微小。\n*   **GUI 程序涉及视觉元素。**\n    描述视觉元素的最佳方式是“画”出它们。用代码来描述它们可能既缓慢又不直观。\n\
  \n所以，为了让你的 GUI 开发变得更容易，你可以使用 `JavaFX` 和 `Scene Builder`。通过 `Scene Builder`，你可以可视化的方式描述你的程序。`Scene\
  \ Builder` 会自动将你的视觉描述转换为 Java 源码和 XML 代码。\n\n### 安装 Scene Builder\n\n安装 `Scene Builder`\
  \ 与安装大多数软件一样。以下是操作方法：\n\n1.  **访问** [www.oracle.com/technetwork/java/javase/downloads](http://www.oracle.com/technetwork/java/javase/downloads)。\n\
  2.  **点击 JavaFX Scene Builder 的下载按钮。**\n3.  **接受许可协议。**\n4.  **点击对应你电脑操作系统的链接（Windows、Mac\
  \ 或 Linux）。**\n    完成后，下载将开始。在 Windows 电脑上，你将得到一个 `.exe` 文件或 `.msi` 文件。双击该文件开始安装。\n\
  \    在 Mac 上，你将得到一个 `.dmg` 文件。根据你 Mac 浏览器的设置，浏览器可能会或可能不会自动展开 `.dmg` 文件。如果没有，请双击\
  \ `.dmg` 文件开始安装。\n5.  **按照安装程序的说明进行操作。**\n    在 Windows 电脑上，你需要接受一系列默认设置。\n    在\
  \ Mac 上，你需要将 `Scene Builder` 图标拖到 Applications（应用程序）文件夹中。\n\n好了！你已经安装了 `Scene Builder`。\n\
  \n### 安装 e(fx)clipse\n\nEclipse 有自己一套完善的机制来整合新功能。一个 Eclipse 工具被称为 Eclipse 插件（plug-in）。当你首次安装\
  \ `Eclipse` 时，默认会获得许多插件。然后，为了增强 `Eclipse` 的功能，你可以安装许多额外的插件。\n\nEclipse 的 `e(fx)clipse`\
  \ 插件有助于创建 `JavaFX` 应用程序。你可以将该插件添加到你现有的 `Eclipse` 安装中，但下载一个新的 `Eclipse` 副本（已安装了 `e(fx)clipse`\
  \ 的副本）要简单得多。以下是获取新 `Eclipse` 副本的方法：\n\n1.  **访问** [efxclipse.bestsolution.at](http://efxclipse.bestsolution.at)。\n\
  2.  **寻找包含 All-in One downloads 的页面。**\n3.  **在 All-in One downloads 页面上，寻找适用于你操作系统的\
  \ `Eclipse` 副本副本。**\n    ![remember.eps](img/remember_fmt.png) 你的 `Eclipse` 下载包的位数（32\
  \ 位或 64 位）必须与你的 `Java` 版本的位数匹配。关于 32 位和 64 位宽数的详细信息，请参阅第 2 章。\n4.  **遵循相应的链接或点击相应的按钮开始下载。**\n\
  5.  **按照第 2 章中的说明，在你的电脑上安装这个新的 `Eclipse` 副本。**\n    将新的 `Eclipse` 副本放在一个全新的文件夹中。这样，你就不需要卸载旧的\
  \ `Eclipse` 副本了。（事实上，在电脑上拥有两个独立的 `Eclipse` 安装是有帮助的。）在我的 Windows 电脑上，我有一个 `c:\\eclipse`\
  \ 文件夹和一个 `c:\\eclipseFX` 文件夹。这两个文件夹都有自己的命名为 `configuration`、`features` 和 `plugins`\
  \ 的子文件夹。两个文件夹都有它们自己的 `eclipse.exe` 文件。同样，我的 Mac 在 Applications 文件夹内也有有 `eclipse`\
  \ 和 `e(fx)clipse` 文件夹。\n\n    ![tip.eps](img/tip_fmt.png) 当你打开任何副本的 `eclipse` 时，程序会提示你选择一个位置。\n\
  \n### 创建基础 JavaFX 项目\n\n有一句明智的老话：“一画胜于千言”。如果你把 `javafx.application` 之类的东西算作三个字，那么同样的画就值\
  \ 70 个字。在本节中，你将从 `Eclipse` 创建一张画。\n\n1.  **遵循之前章节中的说明（安装 Scene Builderclipse](#06_9781118407813-ch02.xhtml_a11)）。**\n\
  2.  **启动你新的 `Eclipse` 并点击欢迎界面的图标。**\n3.  **从 Eclipse 的菜单栏选择 File⇒New⇒Project。**\n\
  \    出现 New Project 对话框。\n4.  **在对话框列表中展开 JavaFX 分支。在该分支下，选择 JavaFX 项目并点击 Next。**\n\
  \    出现 New Java Project 对话框。\n5.  **在新 Java Project 对话框中，为项目命名。**\n    如果你按照我的指示操作，将项目命名为\
  \ `MyFirstJavaProject`。\n6.  **在新 Java Project 对话框中，选择 JavaSE-1.7 或 JavaSE-1.8。**\n\
  \    你可以使用早期版本的 `Java` 运行 `JavaFX` 程序，但使用 `Java 7 update 7` (`JDK 7u7`) 或更高版本会更容易。\n\
  7.  **点击 Finish 关闭 New Java Project 对话框。**\n    ![tip.eps](img/tip_fmt.png) 点击 Finish\
  \ 后，你可能会看到一个对话框提示 `Mercurial`（无论那是什么）配置不正确。如果你看到了这个对话框，请查找框上的 Restore Defaults 按钮。点击该按钮然后点击\
  \ OK。\n\n    你看到 `Eclipse` 工作区在 Package Explorer 中显示了你新创建的项目。\n\n### 运行你的基础 JavaFX\
  \ 项目\n\n在上节中，你使用 `e(fx)clipse` 创建了一个全新的 `JavaFX` 项目。当你运行新项目的代码时，你会看到图 20-8 中的内容。你会看到一个里面什么都没有的窗口。\n\
  \n![9781118407813-fg2008.tif](img/9781118407813-fg2008_fmt.png)\n\n图 20-8：空窗口。\n\
  \n\n\n\n\n这个窗口没有任何图像、没有按钮、没有文本字段——*什么都没有*，这源于 `e(fx)clipse` 创建你新项目的方式。`e(fx)clipse`\
  \ 工具会为项目填充最少量的代码。这样一来，新项目就像一张白纸——一个空外壳，你可以在此添加按钮、文本字段或其他实用组件。\n\n## 为你的 JavaFX 项目添加内容\n\
  \n我喜欢空旷的空间。当我大学毕业后刚自己住时，我的公寓墙上没有挂画。我不想日复一日地盯着同一件艺术品。我更倾向于用自己想象中的图像来填充那些纯白的空白处。所以对我来说，图\
  \ 20-8 中的空窗口是非常令人舒缓的。\n\n但如果图 20-8 没有被纽约现代艺术博物馆收藏，那么这个窗口就完全没用了。（顺便说一下，我还在等博物馆馆人的回复。）当你创建一个高功能的\
  \ GUI 程序时，你会从创建一个带有按钮和其他控件的窗口开始。然后，你添加方法来响应按键输入、按钮点击等事件。\n\n下一节包含了一些用于响应用户点击按钮的代码。在本节中，你将使用一个\
  \ XML 文件来描述一个按钮和一个文本字段：\n\n1. **遵循本章较早部分“创建一个基础的 JavaFX 项目”中的说明操作。**\n   在 Eclipse\
  \ 的包管理器（Package Explorer）中查找你在该节中创建的新项目。\n\n2. **在 Eclipse 的包管理器中展开新项目的分支。**\n \
  \  寻找 `application` 分支，它在 `src` 分支内部。\n\n3. **右键点击（在 Mac 上为控制+点击）application 分支。在出现的右键菜单中，选择\
  \ `File⇒New⇒Other`。**\n   出现选择向导（Select A Wizard）对话框。\n\n4. **在选择向导对话框的树形结构中，展开\
  \ JavaFX 分支。**\n\n5. **在 JavaFX 分支中，双击 New FXML Document 项。**\n   出现 FXML File 对话框，如图\
  \ 20-9 所示。\n\n6. **在对话框的 Name 字段中为你的新文件输入名称，然后点击 Finish。**\n   如果你严格按照我的说明操作，请将文件命名为\
  \ `Root`。\n   ![tip.eps](img/tip_fmt.png) 在图 20-9 中，你输入名称 `Root`，但 `e(fx)clipse`\
  \ 创建了一个全名为 `Root.fxml` 的文件。\n   这个新的 `Root.fxml` 文件描述了你新 JavaFX 应用中按钮、文本字段和其他内容的布局。这就是我在“代码汤：XML\
  \ 与 Java 的混合”节开头大费特章的那个 XML 文档。\n   ![9781118407813-fg2009.tif](img/9781118407813-fg2009_fmt.png)\n\
  \   图 20-9：FXML File 对话框。\n\n7. **在 Eclipse 的包管理器中右键点击（在 Mac 上为控制+点击）新的 Root.fxml\
  \ 分支。在出现的右键菜单中，选择 Open with SceneBuilder。**\n   出现 Scene Builder 窗口（见图 20-10）。\n\
  \   Scene Builder 窗口包含几个区域：\n   * Scene Builder 窗口的中间是 `Content panel`（内容面板），你可以在这里看到新应用的预览。（目前你的应用中什么可看，所以\
  \ `Content panel` 是一片巨大的空白。）\n   * 窗口的左上部分是 `Library panel`（库面板），它包含 Containers（容器）、Controls（控件）部分以及其他几个部分。\n\
  \     在 GUI 世界中，按钮、文本字段、标签和复选框等被称为 `controls`（控件）。`Library panel` 的 Controls 部分构成了一个调板。要创建一个\
  \ GUI 窗口，你可以从调板上拖拽控件并将其释放到 `Content panel`。\n   * 窗口的左下部分是 `Document panel`（文档面板），它包含\
  \ Hierarchy（层次结构）和 Controller（控制器）部分。Hierarchy 部分包含一个 `AnchorPane` 。\n     Hierarchy\
  \ 部分包含一个树，显示了窗口中的哪些元素位于哪些其他元素内部。`Controller section` 帮助你将设计的窗口与应用程序的 Java 代码关联。\n\
  \   * 窗口的最右侧部分是 `Inspector panel`（检查器面板），它包含 Properties（属性）、Layout（布局）和 Code（代码）部分。\n\
  \     在 `Properties section` 中，你描述窗口中元素的特征。在 `Code section` 中，你为窗口中元素相关的 Java 方法命名。\n\
