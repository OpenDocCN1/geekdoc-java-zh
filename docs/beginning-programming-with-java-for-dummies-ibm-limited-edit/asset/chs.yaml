  \   NumberFormat currency = NumberFormat.getCurrencyInstance(Locale.FRANCE);\n \
  \       String niceTotal;\n        System.out.print(\"Amount: \");\n        amount\
  \ = keyboard.nextDouble();\n        System.out.print(\"Taxable? (true/false) \"\
  );\n        taxable = keyboard.nextBoolean();\n        if (taxable) {\n        \
  \    total = amount * 1.05;\n        } else {\n            total = amount;\n   \
  \     }\n        niceTotal = currency.format(total);\n        System.out.print(\"\
  Total: \");\n        System.out.println(niceTotal);\n        keyboard.close();\n\
  \    }\n}\n```\n\n## 理解大局\n\n在本节中，我将回答在书中提出的一些问题：“`java.util` 代表什么？”“为什么我在代码的某些地方需要\
  \ `static`？”“Java 的学位如何帮助你？”\n\n我还将以一些独特且有趣的方式解释 `static`。毕竟，静态方法和变量并不容易理解。从几个角度了解\
  \ Java 的静态特性会有帮助。\n\n### 包和导入声明\n\n在 Java 中，你可以将一组类分到包（package）。事实上，Java 标准 API\
  \ 中的类被分为大约 200 个包。本书的示例大量使用了三个包——名为 `java.util`、`java.lang` 和 `java.io` 的包。\n\n\
  #### java.util.Scanner 类\n\n`java.util` 包包含大约 50 个类，包括非常有 `Scanner` 类。和其他大多数类一样，这个\
  \ `Scanner` 类有两个名称——*全限定名*（fully qualified name）和简化的*类名*（simple name）。该类的全限定名是 `java.util.Scanner`，而类名是\
  \ `Scanner`。通过在包名后加上类名来获取全限定名。\n\n导入声明允许你缩写类名。通过声明\n\n```\nimport java.util.Scanner;\n\
  ```\n\nJava 编译器会找出去哪里寻找 `Scanner` 类。因此，你不需要在代码中到处写 `java.util.Scanner`，只需写 `Scanner`\
  \ 即可。\n\n#### java.lang.System 类\n\n`java.lang` 包包含大约 35 个类，包括广受欢迎的 `System` 类。（该类的全限定名是\
  \ `java.lang.System`，类名是 `System`。）你不需要在代码中到处写 `java.lang.System`，只需写 `System`。你甚至不需要导入声明。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 在在 Java 所有的包中，`java.lang` 包是特殊的。无论是否有导入声明，编译器都会导入\
  \ `java.lang` 包中的所有内容。\n\n\n\n\n\n为了缩写 `System.out.println`，你必须进行什么样的导入？如何将其缩短为\
  \ `out.println`？导入声明允许你缩写一个 `class`（类）的名字。但在表达式 `System.out` 表达式中，`out` 这个词并不是一个类。`out`\
  \ 是一个静态变量。（`out` 变量指的是 Java 程序发送文本输出的地方。）所以你不能写：\n\n```java\n这行代码是错误的。不要使用它：\nimport\
  \ java.lang.System.out;\n```\n\n你该怎么做呢？你应该写：\n\n```java\nimport static java.lang.System.out;\n\
  ```\n\n要了解更多关于 `out` 变量作为静态变量的知识，请阅读下一节。\n\n### 揭示静态的黑暗\n\n我喜欢引用我自己。当我引用自己的话时，我不需要书面许可。我不需要担心版权侵权，也永远听不到律师的意见。最棒的是，我可以改变和扭曲我说的任何话。当我转述自己的观点时，我永远不会被误读。\n\
  \n考虑到这一点，这里有来自上一节的一段引用：\n\n*“任何静态（static）的东西都属于整个类，而不是属于该类的任何特定实例……。要调用静态方法，你使用类名加上一个点。”*\n\
  \n多么深奥啊！在列表 18-6 中，我引入了一个名为 `parseInt` 的静态方法。这里是将相同的引用应用到静态 `parseInt` 方法上：\n\n\
  *静态 `parseInt` 方法属于整个 `Integer` 类，而不是属于 `Integer` 类的任何特定实例……。要调用静态 `parseInt` 方法，你使用\
  \ `Integer` 类的名加上一个点。你写的代码类似于 `Integer.parseInt(reply)`。*\n\n这得太棒了！那么我在第 3 章中介绍的\
  \ `System.out` 又是呢？我也可以把我的引用应用到它上面。\n\n静态变量 `out` 属于整个 `System` 类，而不是属于 `System`\
  \ 类的任何特定实例……。要引用静态变量 `out`，你使用 `System` 类名加上一个点。你写的代码类似于 `System.out.println()`。*\n\
  \n如果你思考 `System.out` 的含义，这种静态机制就有意义了。毕竟，`System.out` 的名字指的是 Java 程序发送文本输出的地方。（当你使用\
  \ Eclipse 时，`System.out` 指的是 Eclipse 的控制台视图 Console view）。）一个典型的程序只有一个发送文本输出的地方。因此，一个\
  \ Java 程序只有一个 `out` 变量。无论你创建多少个对象——三个、十个或一个都没有——你只有一个 `out` 变量。当你把某样东西设为静态时，你就确保了程序只有一个这样的东西。\n\
  \n好了，那么！`out` 变量是静态的。\n\n为了缩写静态变量（或静态方法）的名字，你不能使用普通的导入声明。相反，你使用静态导入声明。这就是为什么在第 9\
  \ 章及之后，我使用 `static`get 来导入 `out` 变量：\n\n```java\nimport static java.lang.System.out;\n\
  ```\n\n### Barry 履行了古老的承诺\n\n在第 6 章中，我将变量声明放在 main 方法之外。我从列表 18-9 中的类代码变变成了列表 18-10\
