  \ has balance \");\n        out.println(currency.format(balance));\n    }\n}\n```\n\
  \n#### 列表 19-7：调用 addInterest 方法\n\n```java\nimport java.util.Random;\nclass ProcessNiceAccounts\
  \ {\n    public static void main(String args[]) {\n        Random myRandom = new\
  \ Random();\n        NiceAccount anAccount;\n        double interestRate;\n    \
