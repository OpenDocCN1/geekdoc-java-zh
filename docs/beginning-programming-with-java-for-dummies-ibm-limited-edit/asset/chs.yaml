  \ 的零钱吗？\n\n由于计算机内部使用 0 和 1，它进行算术的方式与我们习惯的方式并不完全相同。那么，你如何解决这个问题呢？\n\nJava API 有一个名为\
  \ `NumberFormat` 的类，而 `NumberFormat` 类有一个名为 `getCurrencyInstance` 的静态方法。当你括号内为空时调用\
