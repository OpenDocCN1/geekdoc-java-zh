  \ 显示的运行是在配置为美国的计算机上进行的，那里 `5.75` 表示“五点七五”。但在配置为我所说的“逗号国家”的计算机上，运行可能不同，那里 `5,75`\
  \ 表示“五点七五”。如果你住在逗号国家，并完全按照图 6-7 输入 `5.75`，你可能会得到一个错误（`InputMismatchException`）。如果是这样，请将文件中的数字改为你国家的格式。这样做就没问题了。\n\
  \n### 这些方法\n\n注意我在列表 6-2 中是如何使用 `keyboard.nextDouble()` 的。调用 `keyboard.nextDouble()`\
  \ 是赋值语句的一部分。如果你查看第 5 章关于 `EchoLine` 程序如何工作的章节，看到计算机可以用内容代替方法调用。计算机在列表 6-2 中就是这样做。当你在键盘上输入\
  \ `5.75` 时，计算机将：\n\n```\namount = keyboard.nextDouble();\n```\n变为\n```\namount =\
  \ 5.75;\n```\n（计算机并没有真正重写列表 6-2 中的代码。这行 `amount = 5.75` 只是说明了计算机的操作。）在列表 6-2 的第二个赋值语句中，计算机在\
  \ `amount` 中的 `5.75` 上加上了 `25.00`。\n\n某些方法调用具有替换效果，而另一些（如 `System.out.println()`）则没有。了解更多关于这个主题的信息，请参阅第\
  \ 19 章。\n\n### 主题的变体\n\n在列表 6-1 中，需要两行来给 `amount` 变量赋予第一个值：\n\n```java\ndouble amount;\n\
  amount = 5.95;\n```\n\n你只需要一行就能做同样的事情：\n\n```java\ndouble amount = 5.95;\n```\n\n\
  当你这样做时，你不会说你在给 `amount` 变量“赋值”一个值。`double amount=5.95` 这一行不被称为“赋值语句”。相反，这一行被称为带有*初始值*（initial）的声明。你正在*初始化*（initializing）`amount`\
  \ 变量。你可以对初始化进行各种操作，甚至是算术运算。\n\n```java\ndouble gasBill = 174.59;\ndouble elecBill\
  \ = 84.21;\ndouble H2OBill = 22.88;\ndouble total = gasBill + elecBill + H2OBill;\n\
  ```\n\n### 变量移动\n\n记住初始化和赋值之间的区别是有帮助的。例如，你可以将带有初始化的声明拖到方法之外。\n\n这是可以的：\n```java\n\
  class SnitSoft {\n    static double amount = 5.95;\n    public static void main(String\
  \ args[]) {\n        amount = amount + 25.00;\n        System.out.print(\"We will\
  \ bill $\");\n        System.out.print(amount);\n        System.out.println(\" to\
  \ your credit card.\");\n    }\n}\n```\n\n你不能对赋值语句做同样的事情。（查看下面的代码和图 6-8。）\n\n这段代码无法编译：\n\
  \n```java\nclass BadSnitSoftCode {\n    static double amount;\n    amount = 5.95;\
  \ //位置错误的语句\n    public static void main(String args[]) {\n        amount = amount\
  \ + 25.00;\n        System.out.print(\"We will bill $\");\n        System.out.print(amount);\n\
  \        System.out.println(\" to your credit card.\");\n    }\n}\n```\n\n\n\n\n\
  \n![9781118407813-fg0608.tif](img/9781118407813-fg0608_fmt.png)\n\n图 6-8：一次编译 `BadSnitSoftCode`\
  \ 的失败尝试。\n\n你不能将语句拖到方法之外。（即使变量声明以分号结尾，变量声明也不被视为一条语句。真是有其妙吧！）\n\n将声明放在方法之外的优势将在第\
  \ 19 章中进行说明。在你焦急地等待到达那一章时，请注意我我在从 `main` 方法中提取的每个声明中都添加了 `static` 单词。我必须这样做，是因为\
  \ `main` 方法的头部中包含了 `static` 单词。并不是所有方法都是 `static` 的。事实上，大多数方法都不是 `static` 的。但每当你从一个\
  \ `static` 方法中提取声明时，都必须在声明的开头添加 `static` 单词。关于 `static` 单词的所有谜团将在第 18 章中解决。\n\n\
  ### 组合变量声明\n\n列表 6-1 中的代码只有一个变量（就好像变量短缺一样）。你可以用几个变量获得相同的效果。\n\n```java\nclass SnitSoftNew\
  \ {\n\n    public static void main(String args[]) {\n        double cdPrice;\n \
  \       double shippingAndHandling;\n        double total;\n        cdPrice = 5.95;\n\
  \        shippingAndHandling = 25.00;\n        total = cdPrice + shippingAndHandling;\n\
  \        System.out.print(\"We will bill $\");\n        System.out.print(total);\n\
  \        System.out.println(\" to your credit card.\");\n    }\n}\n```\n\n这段新代码给出的输出与列表\
  \ 6-1 中的代码相同。（参考图 6-1。）\n\n新代码有三个声明——每个对应程序三个变量中的每一个。由于这三个变量具有相同的类型（`double` 类型），我可以修改代码并一次性声明所有三个变量：\n\
  \n```java\ndouble cdPrice, shippingAndHandling, total;\n```\n\n那么，一个声明好，还是三个声明好？没有哪者更好。这取决于个人风格。\n\
  \n你甚至可以在组合的声明中添加初始化。当你这样做时，每个初始化只适用于一个变量。例如，通过这一行：\n\n```java\ndouble cdPrice, shippingAndHandling\
  \ = 25.00, total;\n```\n\n`shippingAndHandling` 的值变成了 `25.00`，但变量 `cdPrice` 和 `total`\
  \ 没有得到特定的值。\n\n# 第 7 章\n\n# 数字与类型\n\n## 本章\n\n- ![arrow](img/arrow.png) 处理整数\n-\
  \ ![arrow](img/arrow.png) 从旧值创建新值\n- ![arrow](img/arrow.png) 理解 Java 更奇特的类型\n\n\
  不久前，人们还认为计算机除了大规模的数字计算外什么都不做。计算机解决算术问题，故事就此结束。\n\n在 20 世纪 80 代，随着文字处理程序的广泛使用，“大铁大脑”的神话被抛之脑后。但即便如此，计算机仍然是非常出色的计算器。毕竟，计算机非常快而且非常准确。计算机永远不需要数手指。最棒的是，计算机在进行算术运算时不会感到负担。我讨厌在好餐厅用餐时，因为担心税费和小费而结束晚餐，但计算机完全不在乎这些事情。（尽管如此，计算机也很少出门吃饭。）\n\
  \n## 使用整数\n\n让我告诉你吧，当成年人并不好玩。现在，我的客厅里有四个小孩子。他们正盯着我，因为我手里拿着一袋口香糖球。袋里有 30 颗口香糖，孩子们心里都在想：“谁最棒？谁能得到比别人更多的口香糖？谁会被不公平地对待？”他们坚持要进行完整、官方的口香糖计数，每个孩子获得完全相同数量的美味小零食。我必须小心。如果我不这样做，就永远没完没了。\n\
  \n有了 30 颗口香糖和 4 个孩子，没有办法平均分配这些口香糖。当然，如果我能去掉一个孩子，我就可以给每个孩子 10 颗。问题是，口香糖是一次性的，而孩子不是。所以，我唯一的替代方案是尽力分配口香糖，然后处理剩下的。“好了，快想，”我对自己说，“30\
  \ 颗口香糖和 4 个孩子，我能向每个孩子承诺多少颗口香糖？”\n\n我没有浪费时间编写程序来为我计算。当我完成时，我拥有了列表 7-1 中的代码。\n\n列表\
  \ 7-1：防止孩子们吵闹\n```java\nclass KeepingKids {\n    public static void main(String\
  \ args[]) {\n        int gumballs;\n        int kids;\n        int gumballsPerKid;\n\
  \        gumballs = 30;\n        kids = 4;\n        gumballsPerKid = gumballs /\
  \ kids;\n        System.out.print(\"Each kid gets \");\n        System.out.print(gumballsPerKid);\n\
  \        System.out.println(\" gumballs.\");\n    }\n}\n```\n\n图 7-1 显示了 `KeepingKids`\
  \ 的运行。如果每个孩子得到 7 颗，列表 7-1\n\n图 7-1：公平\n\n在口香糖问题的核心，我有整数。当你用 30 除以 4 时，我得到 7 ½。在列表\
  \ 7-1 中所有的 `gumballs`、`kids` 和 `gumballsPerKid` 都是 `int` 类型。当你像列表 7-1 那样用一个 `int`\
  \ 值除以另一个时，你得到另一个 `int`。在图 7-1 中，你可以看到 7 不是整数。\n\n```java\ngumballsPerKid = gumballs/kids;\n\
  System.out.print(gumballsPerKid);\n```\n\n把数字 7 放在屏幕上。\n\n### 从键盘读取整数\n\n这种生活！昨天我的客厅里有\
  \ 4 个孩子，我有 30 颗口香糖。今天我家里有 6 个孩子，我有 80 颗口香糖。我该如何应对这些变化？我知道！我会写一个从键盘读取口香糖和孩子数量的程序。该程序在列表\
  \ 7-2 中，其运行情况在图 7-2 中。\n\n列表 7-2：更通用的孩子口香糖程序\n```java\nimport java.util.Scanner;\n\
  class KeepingMoreKids {\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        int gumballs;\n        int kids;\n\
  \        int gumballsPerKid;\n        System.out.print(\"How many gumballs? How\
  \ many kids? \");\n        gumballs = keyboard.nextInt();\n        kids = keyboard.nextInt();\n\
  \        gumballsPerKid = gumballs / kids;\n        System.out.print(\"Each kid\
  \ gets \");\n        System.out.print(gumballsPerKid);\n        System.out.println(\"\
  \ gumballs.\");\n        keyboard.close();\n    }\n}\n```\n\n![9781118407813-fg0702.tif](img/9781118407813-fg0702_fmt.png)\n\
  \n图 7-2：下一个你就会发现，我有 70 个孩子和 1000 颗口香糖了。\n\n\n\n\n\n这个空白规则适用于许多 `Scanner` 方法。例如，这里有一段代码读取了三个数值：\n\
  \n```java\ngumballs = keyboard.nextInt();\ncostOfGumballs = keyboard.nextDouble();\n\
  kids = keyboard.nextInt();\n```\n\n图 7-3 显示了对于这三个方法调用的有效输入。\n\n![9781118407813-fg0703.tif](img/9781118407813-fg0703_fmt.png)\n\
  \n图 7-3：用于三个 `Scanner` 方法调用的三个数字。\n\n## 所见即所得\n\n当你编写你自己的代码时，你永远不应该认为任何事情是理所当然的。假设你不小心反转了代码列表\
  \ 7-2 中 `gumballs` 和 `kids` 赋值语句的顺序：\n\n```java\n//这段代码是有误导性的：\nSystem.out.print(\"\
  How many gumballs? How many kids? \");\nkids = keyboard.nextInt();\ngumballs = keyboard.nextInt();\n\
  ```\n\n在这里，`How many gumballs? How many kids?` 这一行非常有误导性。因为 `kids` 赋值语句在 `gumballs`\
  \ 赋值语句之前，你输入的第一个数字将成为 `kids` 的值，你输入的第二个数字将成为 `gumballs` 的值。你的程序显示消息 `How many gumballs?\
  \ How many kids?` 并不重要。重要的是程序中赋值语句的顺序。\n\n如果 `kids` 赋值语句意外排在前面，你会得到一个奇怪的答案，例如图 7-4\
  \ 中的零答案。这就是 `int` 除法的工作方式。它只是截断了任何余数。将一个小数（如 6）除以一个大数（如 80），你会得到 0。\n\n![9781118407813-fg0704.tif](img/9781118407813-fg0704_fmt.png)\n\
  \n图 7-4：如何让六个孩子非常不开心。\n\n## 通过运算符创建新值\n\n还有什么比老朋友加号更让人感到宽慰的呢？这是你在小学数学中学学会的第一个东西。几乎每个人都知道如何计算二加二是几。事实上，在英语用法中，“二加二”是一个用来比喻容易做的事情的比喻。每当你看到加号时，你大脑中的一个细胞就会说：“谢天谢地，事情可能比这复杂得多。”\n\
  \n所以 Java 有加号。你可以使用加号来相加两个数字：\n\n```java\nint apples, oranges, fruit;\napples =\
  \ 5;\noranges = 16;\nfruit = apples + oranges;\n```\n\n当然，旧的减号也是可用的：\n\n```java\n\
  apples = fruit - oranges;\n```\n\n使用星号进行乘法，使用正斜杠进行除法：\n\n```java\ndouble rate, pay,\
  \ withholding;\nint hours;\nrate = 6.25;\nhours = 35;\npay = rate * hours;\nwithholding\
  \ = pay / 3.0;\n```\n\n![tip.eps](img/tip_fmt.png) 当你用一个 `int` 值除以另一个 `int` 值时，你得到一个\
  \ `int` 值。计算机不会四舍五入。相反，计算机会截掉任何余数。如果你在程序中放入 `System.out.println(11 / 4)`，计算机会打印\
  \ 2，而不是 2.75。如果你需要小数答案，请将被除的数字中的一个（或两个）都变为 `double` 值。例如，如果你在程序中放入 `System.out.println(11.0\
  \ / 4)`，计算机将用一个 `double` 值 `11.0` 除以一个 `int` 值 `4`。因为两个值中至少有一个是 `double`，计算机会打印\
  \ 2.75。\n\n### 寻找余数\n\n有一个非常有用的算术运算符叫做余数 运算符。余数运算符的符号是百分号（`%`）。当你在程序中放入 `System.out.println(11\
  \ % 4)` 时，计算机会打印 3。之所以这样做是因为 4 可以整除 11 若干次，余数为 3。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 余数运算符的另一个名称是模运算运算符。事实证明余数运算符相当相当用的。毕竟，余数是你除以两个数字后剩余的量。如果你在为 $1.38 找零钱呢？在将 138\
  \ 除以 25 之后，你剩下 13 分，如图 7-5 所示。\n\n![9781118407813-fg0705.tif](img/97811118407813-fg0705_fmt.png)\n\
  \n图 7-5：嘿，哥们！有 138 的找零钱吗？代码列表 7-3 利用了余数。\n\n列表 7-3：找零\n```java\nimport java.util.Scanner;\n\
  class MakeChange {\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        int quarters, dimes, nickels, cents,\
  \ total, whatsLeft;\n        System.out.print(\"How many cents? \");\n        total\
  \ = keyboard.nextInt();\n        quarters = total / 25;\n        whatsLeft = total\
  \ % 25;\n        dimes = whatsLeft / 10;\n        whatsLeft = whatsLeft % 10;\n\
  \        nickels = whatsLeft / 5;\n        whatsLeft = whatsLeft % 5;\n        System.out.println(\"\
  From \" + total + \" cents you get\");\n        System.out.println(quarters + \"\
  \ quarters\");\n        System.out.println(dimes + \" dimes\");\n        System.out.println(nickels\
  \ + \" nickels\");\n        System.out.println(cents + \" cents\");\n        keyboard.close();\n\
  \    }\n}\n```\n\n运行列表 7-3 的结果如图 7-6 所示。\n\n图 7-6：1.38 的找零。\n\n*(注：由于原文中未提供图 7-6\
  \ 的具体描述，此处根据上下文推断翻译)*\n\n\n\n\nJava 有一些非常巧妙的运算符，让生活变得更轻松（对于计算机处理器、你的大脑以及你的手指都是如此）。总共有四种这样的运算符——两个自增运算符和两个自减运算符。自增运算符加\
  \ 1，自减运算符减 1。要看看它们是如何工作的，你需要一些示例。\n\n## 使用前自增 (preincrement)\n\n第一个示例在图 7-7。\n\n\
  ![9781118407813-fg0707.tif](img/9781118407813-fg0707_fmt.png)\n\n图 7-7：使用前自增。\n\n\
  图 7-7 中程序的运行情况如图图 7-8 所示。在这个极其平淡的运行过程中，`gumballs` 的计数被显示了三次。\n\n![9781118407813-fg0708.tif](img/9781118407813-fg0708_fmt.png)\n\
  \n图 7-8：前自增代码的运行（图 7-7 中的代码）。\n\n双加号有两个不同的名称，取决于你把它放在哪里。当你将 `++` 放在变量之前时，`++` 被称为`前自增`\
  \ (preincrement) 运算符。在 preincrement 这个词中，`pre` 代表 `before`（之前）。在这种情况下，`before` 这个词有两个不同的含义：\n\
  \n*   你将 `++` 放在变量之前。\n*   在变量被语句中的其他任何部分使用之前，计算机先将变量的值加 1。\n\n图 7-9 以慢动作即时回放展示了前自增运算符的操作。在图\
  \ 7-9 中，计算机遇到了 `System.out.println(++gumballs)` 语句。首先，计算机将 `gumballs` 加 1（将 `gumballs`\
  \ 的值提高到 29）。然后计算机执行 `System.out.println`，使用 `gumballs` 的新值（29）。\n\n![9781118407813-fg0709.tif](img/9781118407813-fg0709_fmt.png)\n\
  \n图 7-9：前自增运算符的操作。\n\n## 使用后自增 (postincrement)\n\n前自增的替代方案是后后自增 (postincrement)。在后自增中，`post`\
  \ 代表 `after`（之后）。`after` 这个词有两个不同的含义：\n\n*   你将 `++` 放在变量之后。\n*   在变量被语句中的其他任何部分使用之后，计算机再将变量的值加\
  \ 1。\n\n图 7-10 显示了后自增运算符的操作特写。在图 7-10 中，计算机遇到了 `System.out.println(gumballs++)`\
  \ 语句。首先，计算机执行 `System.out.println`，使用 `gumballs` 的`旧`值（28）。然后计算机将 `gumballs` 加 1（将\
  \ `gumballs` 的值提高到 29）。\n\n![9781118407813-fg0710.tif](img/9781118407813-fg0710_fmt.png)\n\
  \n图 7-10：后自增运算符的操作。\n\n看图 7-11 中的加粗代码行。计算机在屏幕上打印 `gumballs` 的旧值（28）。只有在打印了这个旧值之后，计算机才将\
  \ `gumballs` 加 1（将 gumballs 的值从 28 提高到 29）。\n\n![9781118407813-fg0711.tif](img/9781118407813-fg0711_fmt.png)\n\
  \n图 7-11：使用后自增。\n\n![remember.eps](img/remember_fmt.png) 使用 `System.out.println(gumballs++)`，计算机在打印了\
  \ `gumballs` 原有的旧值*之后*才对 `gumballs` 加 1。\n\n图 7-11 中代码的运行情况如图 7-12 所示。对比图 7-12 和图\
  \ 7-8 的运行情况（注：此处原文对应逻辑如下）：\n\n![9781118407813-fg0712.tif](img/9781118407813-fg0712_fmt.png)\n\
  \n图 7-12：后自增代码的运行（图 7-11 中的代码）。\n\n*   在图 7-8 中使用前自增，显示的值为 29。\n*   在图 7-12 中使用后自增，显示的值为\
  \ 28。\n\n![tip.eps](img/tip_fmt.png) 你在纠结用前自增还是后自增吗？仔细思考。大多数程序员使用后自增。在典型的 Java 程序中，你经常看到\
  \ `gumballs++`。\n\n除了前自增和后自增，Java 还有两个使用 `--` 的运算符。这些运算符被称为前自减 (predecrement) 和后自减\
  \ (postdecrement)：\n\n*   自减 (`--gumballs`) 在变量被语句的其他部分使用之前，从变量的值减 1。\n*   后减 (`gumballs--`)\
  \ 在变量被语句的其他部分使用之后，从变量的值减 1。\n\n### 赋值运算符 (Assignment operators)\n\n如果你看了上一节关于加 1\
  \ 的运算符，你可能会想是否可以使用这些运算符加 2、加 5 或加 10000。你可以写 `gumballs++++` 并自称 Java 程序员吗？如果你尝试这样做，Eclipse\
  \ 会给出一个错误信息：`Invalid argument to operation ++--`。\n\n如果你不使用 Eclipse，可能会看到不同的错误信息：`unexpected\
  \ type required: variable found: gumballs+++`。\n\n无论有没有 Eclipse，结果都是一样的：即你的代码包含错误，你必须修复它。\n\
  \n那么如何加 1 以外的值呢？幸运的是，Java 有许多你可以使用的`赋值运算符`。通过赋值运算符，你可以加、减、乘或除任意。你还可以进行其他酷操作。\n\n\
  例如，你可以通过以下代码给 `kids` 变量加 1：\n\n```java\nkids += 1;\n```\n\n这比 `kids++` 或 `kids =\
  \ kids + 1` 好吗？并不更好，它只是另一种替代方案。但你可以通过以下代码给 `kids` 变量加 5：\n\n```java\nkids += 5;\n\
  ```\n\n你无法通过前自增或后自增轻松地加 5。如果孩子们被困在科学家的克隆机中呢？语句\n\n```java\nkids *= 2;\n```\n\n将\
  \ `kids` 的数量乘以 2。\n\n通过赋值运算符，你可以对变量进行任何数字的加、减、乘、除。这个数字不需要字面量 (literal)。你可以在等号右侧使用数值型表达式：\n\
  \n```java\ndouble amount = 5.95;\ndouble shippingAndHandling = 25.00, discount =\
  \ 0.15;\namount += shippingAndHandling;\namount -= discount * 2;\n```\n\n前面的代码将\
  \ `amount` 的值加上 25.00 (`shippingAndHandling`)。然后代码从 `amount` 的值减去 0.30 (`discount\
  \ * 2`)。多慷慨！\n\n![crossreference.eps](img/cross-reference_fmt.png) 如果“literal”这个词让你感到陌生，请参考第\
  \ 4 章。\n\n## 尺寸很重要 (Size Matters)\n\n这里是今天的新词汇：\n\n*   **foregift** (fore-gift)\
  \ *n.* 承租人在取得租赁时支付给出租人的溢价。\n*   **hereinbefore** (here-in-be-fore) *adv.* 在本文的之前的部分。\n\
  \n现在想象你正在扫描某些压缩文本。在这些文本中，所有的空格都被删除了以节省空间。你遇到了以下字母序列：\n\n`hereinbeforegiftedit`\n\
  \n问题是，这些字母意味着什么？如果你知道每个单词的长度，你就可以回答这个问题：\n\n*   here in be foregift edit\n*   hereinbefore\
  \ gifted it\n*   herein before gift it\n\n计算机也面临同样的问题。当计算机在内存或磁盘上存储多个数字时，计算机不会在数字之间放置空格。所以想象计算机内存的一小块看起来就像图\
  \ 7-13 中的内容。（计算机完全处理 0 和 1，但图 7-13 使用的是普通数字。使用普通数字更容易看到发生了什么。）\n\n\n\n\n\n![9781118407813-fg0713.tif](img/9781118407813-fg0713_fmt.png)\n\
  \n图 7-13：存储数字 4221。\n\n图 7-13 中存储的是什么数字或几个数字？是两个数字 42 和 21 吗？还是一个数字 4,221？如果是存储四个数字\
  \ 4、2、2 和 1 呢？这取决于每个数字所占的空间。\n\n想象一个存储每月发工资天数的变量。这个数字永远不会超过 31。你只需要八个零和一就可以表示这个小数字。但一个计算宇宙中星星数量的变量呢？那个数字很容易超过一万亿，为了准确地表示一万亿，你需要\
  \ 64 个零和一。\n\n此时，Java 出现来救场。Java 有四种整数类型。就像列表 7-1 中一样，我声明：\n\n```java\nint gumballsPerKid;\n\
  ```\n\n我也可以声明：\n\n```java\nbyte paydaysInAMonth;\n```\n\n```java\nshort sickDaysDuringYourEmployment;\n\
  ```\n\n```java\nlong numberOfStars;\n```\n\n这些类型（`byte`、`short`、`int` 和 `long`）都有它们自己的取值范围（参见表\
  \ 7-1）。\n\n表 7-1 Java 的基本数值类型\n\n| 类型名称 | 取值范围 |\n| :--- | :--- |\n| **整数类型** |\
  \   |\n| byte | –128 到 127 |\n| short | –32768 到 32767 |\n| int | –2147483648 到\
  \ 2147483647 |\n| long | –9223372036854775808 到 9223372036854775807 |\n| **小数类型**\
  \ |   |\n| float | –3.4×10³⁸ 到 3.4×10³⁸ |\n| double | –1.8×10³⁰⁸ 到 1.8×10³⁰⁸ |\n\
  \nJava 有两种小数类型（小数点右带有数字的数字）。就像在列表 6-1 中（早在第 6 章）一样，我声明：\n\n```java\ndouble amount;\n\
  ```\n\n我也可以声明：\n\n```java\nfloat monthlySalary;\n```\n\n在 `double` 和 `float` 之间选择时，我总是选择\
  \ `double`。`double` 类型变量具有更大的取值范围和高得多的精度。（参见表 7-1）。\n\n表 7-1 列出了 Java 的六种*基本*类型（也称为*简单*类型）。Java\
  \ 只有八种基本类型，所以表 7-1 中只缺少了两种 Java 基本类型。\n\n第 8 章描述了剩下的两种基本类型。第 17 章介绍了非基本类型。\n\n作为一名初级程序员，你不需要在表\
  \ 7-1 的类型之间进行选择。只需对整数使用 `int`，对小数使用 `double` 即可。如果在学习过程中，你在别人的程序中看到类似 `short` 或\
  \ `float` 的内容，只需记住：\n\n* 类型 `byte`、`short`、`int` 和 `long` 代表整数。\n* 类型 `float` 和\
  \ `double` 代表小数。\n\n大多数时候，你只需要知道这些。\n\n# 第 8 章\n\n# 数字？谁需要数字？\n\n## 本章内容\n\n* ![arrow](img/arrow.png)\
  \ 处理字符\n* ![arrow](img/arrow.png) 处理“真”或“假”值\n* ![arrow](img/arrow.png) 完善你 Java\
  \ 基本类型的知识\n\n我不特别喜欢传真机。它们太低效了。发送一份短传真，你得到了什么？你得到了两块树的碎片——发送端一片，接收端一片。你还有数百万个点——散布在打印页上的小点。这些点区分了明亮区域和黑暗区域。真是浪费！\n\
  \n将传真与电子邮件进行对比。使用电子邮件，我可以发送一个包含 2500 个零和一的 25 字条目，而且不需要浪费纸张。最理想的是，电子邮件不需要描述明亮点和黑暗点。电子邮件包含每个字母的代码——代表字母\
  \ A 的零和一，代表字母 B 的另一段零和一，依此类推。会有什么是更简单的呢？\n\n现在想象发送一份 25 字的传真。传真的内容是“true（真）”，这被理解为：“是的，我接受编写《Java\
  \ 傻办法》的提议。”这条传真发送了字母 t-r-e，纸上有污迹的线条，墨盒运行的地方有点。\n\n但实际上，“true”消息的本质是什么？不是有两种可能性吗？消息可能是“true”或“false”，为了表示这些可能性，我不需要太费力。对于“false”用\
  \ 0，“true”用 1。\n\n* 他们问：“你接受编写《Java 傻办法》的提议吗？”\n* 我回答：“1”。\n\n可惜我几个月前没有考虑到这一点。无论如何，本章涉及字母和其他内容。\n\
  \n## 字符\n\n在第 6 章和第 7 章中，你在所有变量中存储数字。这没问题，但生活比数字更多。例如，我用电脑写这本书，书中包含了成千上万非数字内容。存储字符的\
  \ Java 类型是 `char`。列表 8-1 有一个使用 `char` 类型的简单程序，列表 8-1 的程序如图 8-1 {\n        char smallLetter,\
  \ bigLetter;\n        smallLetter = 'b';\n        bigLetter = Character.toUpperCase(smallLetter);\n\
  \        System.out.println(bigLetter);\n    }\n}\n```\n\n![9781118407813-fg0801.tif](img/9781118407813-fg0801_fmt.png)\n\
  \n图 8-1：有趣的程序输出！\n\n在列表 8-1 中，第一个赋值语句将字母 `b` 存储在 `smallLetter` 变量中。在该语句中，注意 `b`\
  \ 被单引号包围。在 Java 程序中，每个 `char` 字面量都以单引号开头和结尾。\n\n当你用引号括字母时，你告诉电脑该字母不是变量名。例如，在列表 8-1\
  \ 中，错误的语句 `smallLetter = b` 会告诉电脑去寻找名为 `b` 的变量。因为没有名为 `b` 的变量，你会收到“b 无法解析为变量”的消息。\n\
  \n在列表 8-1 的第二个赋值语句中，程序调用了一个名为 `Character.toUpperCase` 的 API 方法。`Character.toUpperCase`\
  \ 方法的作用如其名——该方法产生小写字母的大写形式。在列表 8-1 中，这个大写形式（字母 `B`）被赋值给变量 `bigLetter`，而 `bigLetter`\
  \ 中的 `B` 被打印在屏幕上，如图 8-2\n\n图 8-2：列表 8-1 中的操作。\n\n![remember.eps](img/remember_fmt.png)\
  \ 当电脑在屏幕上显示 `char` 值时，电脑不会用单引号包围字符。\n\n### 我跑题了……\n\n前段时间，我想过如果我调用 `Character.toUpperCase`\
  \ 方法并给该方法传递一个本来不是小写的字符会发生什么。我查了 Java API 文档，但没有发现有用的信息。文档说 `toUpperCase` “使用 UnicodeData\
  \ 文件中的大小映射信息将字符参数转换为大写”。谢谢，但这对我没用。\n\n\n\n\n\n虽然这听起来很愚蠢，但我问自己，如果我是 `toUpperCase`\
  \ 方法，我会怎么做？如果有人递给我一个大写的 R 并让我把这个字母大写化，我会说什么？我会说：“把你们那臭臭的大写 R 拿回去。”在计算机术语中，我会向那个人发送一条错误消息。因此我在想，如果我对字母\
  \ `R` 应用 `Character.toUpperCase`，是否会收到错误消息。\n\n我试了一下。我在代码清单 8-2 中设计了这个实验。\n\n代码清单\
  \ 8-2：调查 toUpperCase 的行为\n\n```java\nclass MyExperiment {\n    public static void\
  \ main(String args[]) {\n        char smallLetter, bigLetter;\n        smallLetter\
  \ = 'R';\n        bigLetter = Character.toUpperCase(smallLetter);\n        System.out.println(bigLetter);\n\
  \        smallLetter = '3';\n        bigLetter = Character.toUpperCase(smallLetter);\n\
  \        System.out.println(bigLetter);\n    }\n}\n```\n\n在我的实验中，我没有混合化学物质也没有引发爆炸。相反，我这样做：\n\
  \n- **我将 'R' 赋值给** `smallLetter`。**\n  `toUpperCase` 方法接收了大写的 R 并返还给了我另一个大写的 R。（参见图\
  \ 8-3）。我没有收到错误消息。这告诉我 `toUpperCase` 方法处理已经是大写的字母时是如何操作的。该方法什么都没做。\n- **我将 '3' 赋值给**\
  \ `smallLetter`。**\n  `toUpperCase` 方法接收了数字 3 并返回了相同的数字 3（参见图 8-3）。我没有收到错误消息。这告诉我\
  \ `toUpperCase` 方法处理非字母字符时是如何操作的。它什么都没做，完全没反应，一点事也没有。\n\n![9781118407813-fg0803.tif](img/9781118407813-fg0803_fmt.png)\n\
  \n图 8-3：运行代码清单 8-2 中的代码。\n\n我写这个实验是为了说明一个重要的点。当你你不计算机编程的某些内容时，编写测试程序通常很有帮助。想出一个实验并看看计算机是如何响应的。\n\
  \n我曾猜给 `toUpperCase` 方法传递一个大写的 R 会得到错误消息，但我错了。看到了吗？问题的答案并不是从天而降的。创建 Java API 的人们做出了决定。他们做出了一些显而易见的选择，也做了一些出乎意料的选择。没有人了解\
  \ Java 的所有特性，所以不要期望把所有答案都死记在脑子里。\n\nJava 文档很棒，但对于文档回答的每一个问题，它都忽略了另外三个问题。所以要大胆。不要害怕尝试。编写很多短小的、实验性的程序。你弄坏不了计算机，所以尽管和它一起玩吧。你的好奇心总会有回报的。\n\
  \n阅读并理解 Java 的 API 文档是一门艺术，而非科学。关于如何充分利用这些文档的建议，请阅读我的文章《理解 Java API 文档》，地址：[`www.dummies.com/extras/beginningprogrammingwithjava`](http://www.dummies.com/extras/beginningprogrammingwithjava)。\n\
  \n### 请仅使用一个字符\n\n`char` 变量只存储一个字符。所以如果你忍不住想写以下语句：\n\n```java\nchar smallLetters;\n\
  smallLetters = 'barry';\n```\n\n请克制这种诱惑。你无法在 `char` 变量中存储多个一个字母，无法在单引号之间放入超过一个字母。如果你试图存储单词或句子，则需要使用\
  \ `String`。查看第 18 章。\n\n### 变量与重用\n\n在清单 8-2 中，我使用了两次 `smallLetter`，使用了两次 `bigLetter`。这就是为什么他们把这些东西称为*变量*。首先，`smallLetter`\
  \ 的值是 R。稍后我改变了 `smallLetter` 的值，使其变为 3。\n\n当我给 `smallLetter` 赋值一个新值时，它的旧值就被抹除了。例如，在图\
  \ 8-4 中，第二次 `smallLetter` 赋值将 3 放入。当计算机执行这次赋值时，旧的 R 就消失了。\n\n![9781118407813-fg0804.tif](img/9781118407813-fg0804_fmt.png)\n\
  \n图 8-4：改变 `smallLetter` 的值。\n\n这样可以吗？你可以忘记 `smallLetter` 曾经具有的值吗？是的，在清单 8-2 中是可以的。当你通过语句\
  \ `bigLetter = Character.toUpperCase(smallLetter)` 给 `bigLetter` 赋值后，你可以忘记所有的 `smallLetter`\
  \ 值。你不需要这样做：\n\n```java\n// 这段代码很繁琐。\n// 额外的变量是不必要的。\nchar smallLetter1, bigLetter1;\n\
  char smallLetter2, bigLetter2;\nsmallLetter1 = 'R';\nbigLetter1 = Character.toUpperCase(smallLetter1);\n\
  System.out.println(bigLetter1);\nsmallLetter2 = '3';\nbigLetter2 = Character.toUpperCase(smallLetter2);\n\
  System.out.println(bigLetter2);\n```\n\n你不需要在独立的变量中存储旧新值。相反，你可以重用清单 8-2 中的 `smallLetter`\
  \ 和 `bigLetter`。这种变量的重用并没有节省大量的打字量，也没有多少内存。但重用变量可以保持程序整洁。当你看清单 8-2 时，你可以一眼看出代码分为两部分，并看到两部分都在做大致相同的事情。清单\
  \ 8-2 中的代码简单且易于管理。在这样的小程序中，简单性和管理性并不重要。但在大型程序中，仔细考虑每个变量是有的。\n\n### 何时不重用变量\n\n上一节讨论了通过重用变量使程序简洁易读。这一节展示了另一面。在这一节中，当前的问题迫你创建新的变量。\n\
  \n假设你正在编写代码来反转四个字母单词的字母。你将每个字母存储在自己的变量中。清单 8-3 显示代码，图 8-5 显示代码运行效果。\n\n代码清单 8-3：反转单词\n\
  \n```java\nimport java.util.Scanner;\nclass ReverseWord {\n    public static void\
  \ main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n  \
  \      char c1, c2, c3, c4;\n        c1 = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\
  \        c2 = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n        c3 = keyboard.findWithinHorizon(\"\
  .\", 0).charAt(0);\n        c4 = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\
  \        System.out.print(c4);\n        System.out.print(c3);\n        System.out.print(c2);\n\
  \        System.out.print(c1);\n        System.out.println();\n        keyboard.close();\n\
  \    }\n}\n```\n\n![9781118407813-fg0805.tif](img/9781118407813-fg0805_fmt.png)\n\
  \n图 8-5：停住那些罐子！\n\n清单 8-3 中的诀窍如下：\n\n- 按顺序给变量 `c1`、`c2`、`c3` 和 `c4` 赋值。\n- 在屏幕上反向显示这些变量的值：`c4`、`c3`、`c2`\
  \ 然后是 `c1`，如图 8-6 所示。\n\n![9781118407813-fg0806.tif](img/9781118407813-fg0806_fmt.png)\n\
  \n图 8-6：使用四个变量。\n\n如果不使用四个独立的变量，你就得不到想要的结果。例如，假设你只在一个变量中存储字符。你运行程序并输入单词 pots。当该反向显示单词时，计算机记得\
  \ pots 单词中最后的 s。但计算机并不记得 p、o 或 t，如图 8-7 所示。\n\n\n\n\n\n我希望我能给你 12 条简单的规则，帮助你判断何时以及何时重用变量。问题是，我做不到。这完全取决于你试图实现什么。那么，你如何自己判断何时以及何时重用变量呢？就像那个人告诉询问如何去卡内基厅的人所说：“练习，练习，再练习。”\n\
  \n### 读取字符\n\n创建 Java 的 `Scanner` 类的人并没有创建一个用于读取单个字符的 `next` 方法。因此，为了输入单个字符，我将两个\
  \ Java 方法拼接在一起。我使用了 `findWithinHorizon` 和 `charAt` 方法。\n\n第 5 章中的表 5-1 引入了这种用于读取单个输入字符的\
  \ `findWithinHorizon(\".\", 0).charAt(0)` 技术，而代码 8-3 使用该技术一次读取一个字符。（事实上，代码 8-3 使用该技术四次来读取四个独立的字符。）\n\
  \n注意图 8-5 中的输入格式。为了输入单词 `pots` 中的字符，我连续输入了四个字母，字母之间没有空格，也没有加引号。`findWithinHorizon(\"\
  .\", 0).charAt(0)` 技术就是这样工作的，但请不要怪我或怪我的技术。其他开发人员读取字符的方法也是以相同工作的。无论你使用谁的方法，读取字符与读取数字都是不同的。如下所示：\n\
  \n*   **使用如 `nextDouble` 和 `nextInt()` 等方法时，你在数字之间输入空格。**\n    如果我输入 `80 6`，那么两次调用\
  \ `nextInt()` 会读取数字 80，紧接着是数字 6。如果我输入 `806`，那么调用一次 `nextInt()` 就会读取数字 806（八百六），如图\
  \ 8-8 所示。\n\n*   **使用 `findWithinHorizon(\".\", 0).charAt(0)` 时，你不在字符之间输入空格。**\n\
  \    如果我输入 `po`，连续两次调用 `findWithinHorizon(\".\", 0).charAt(0)` 会读取字母 p，紧接着是字母 o。如果我输入\
  \ `p o`，那么两次调用 `findWithinHorizon(\".\", 0).charAt(0)` 会读取字母 p，紧接着是一个空格字符。（是的，空格也是一个字符！）再次参见图\
  \ 8-8。\n\n    ![9781118407813-fg0808.tif](img/9781118407813-fg0808_fmt.png)\n\n\
  \    图 8-8：读取数字和字符。\n\n    ![remember.eps](img/remember_fmt.png) 在计算机程序的文本中表示单个字符时，用单引号将该字符括起来。但当你作为程序输入输入字符时，你不需要用引号括住字符。\n\
  \n    ![warning.eps](img/warning_fmt.png) 假设你的程序调用了 `nextInt` 然后是 `findWithinHorizon(\"\
  .\", 0).charAt(0)`。如果你在键盘上输入 `80x`，你会得到错误消息。（消息显示 InputMismatchException。`nextInt`\
  \ 方法期望你在每个 int 值之后输入一个空格。）现在，如果不是输入 `80x`，而是在键盘上输入 `80 x` 会发生什么？那么程序获取 80 作为 int\
  \ 值，随后是一个空格作为字符值。为了让程序获取 `x`，程序必须再次调用一次 `findWithinHorizon(\".\", 0).charAt(0)`。这似乎很浪费，但从长远来看是合理的。\n\
  \n### boolean 类型\n\n我遇到大麻烦了。我有 140 颗糖珠，有 15 个孩子在我的客厅里跑跳尖叫。他们尖叫是因为每个孩子都想要 10 颗糖珠，他们跑跳是因为这是孩子们在拥挤客厅里的常态。我需要一个程序来告诉我是否可以给每个孩子\
  \ 10 颗糖珠。\n\n我需要一个 `boolean` 类型的变量。boolean 变量存储 2 个值之一 — true 或 false（true，我可以给每个孩子\
  \ 10 颗糖珠；或者 false，我不能给每个孩子 10 颗糖珠）。无论如何，孩子们都快疯了，所以我写了一个简短程序并把它放在代码 8-4 所示。\n\n代码\
  \ 8-4：使用 boolean 类型\n\n```java\nclass CanIKeepKids {\n    public static void main(String\
  \ args[]) {\n        int gumballs;\n        int kids;\n        int gumballsPerKid;\n\
  \        boolean eachKidGetsTen;\n        gumballs = 140;\n        kids = 15;\n\
  \        gumballsPerKid = gumballs / kids;\n        System.out.print(\"True or false?\
  \ \");\n        System.out.println(\"Each kid gets 10 gumballs.\");\n        eachKidGetsTen\
  \ = gumballsPerKid >= 10;\n        System.out.println(eachKidGetsTen);\n    }\n\
  }\n```\n\n    ![9781118407813-fg0809.tif](img/9781118407813-fg0809_png)\n\n    图\
  \ 8-9：噢，不！\n\n在代码 8-4。）\n\n    ![9781118407813-fg0810.tif](img/9781118407813-fg0810_fmt.png)\n\
  \n    图 8-10：给 `eachKidGetsTen` 变量赋值。\n\n### 表达式和条件\n\n在代码 8-4 true 和 false 这类值看起来包含字符，但实际上并不是。在内部，Java\
  \ 虚拟机并不用字母 `t-r-u-e` 或 `f-a-s-e` 存储 boolean 值。相反，JVM 存储代码，0 代表 false，1 代表 true。当计算机显示\
  \ boolean 值时（如 `System.out.println(eachKidGetsTen)`），Java 虚拟机会将 0 等代码转换为单词 false。\n\
  \n#### 比较数字；比较字符\n\n在代码 8-4 展示了你可以用于比较彼此的运算符。\n\n表 8-1 运算符\n\n| 运算符符号 | 含义 | 示例\
  \ |\n| :--- | :--- | :--- |\n| `==` | 等于 | `yourGuess == winningNumber` |\n| `!=`\
  \ | 不等于 | `5 != numberOfCows` |\n| `<` | 小于 | `strikes < 3` |\n| `>` | 大于 | `numberOfBoxtops\
  \ > 1000` |\n| `<=` | 小于等于 | `numberOfCows + numberOfBulls <= 5` |\n| `>=` | 大于等于\
  \ | `gumballsPerKid >= 10` |\n\n使用表 8-1 注意表 8-1 第一行的中的双等号。不要尝试使用单个等号来比较两个值。表达式 `yourGuess\
  \ = winningNumber`（带有单个等号）并不比较 `yourGuess` 和 `winningNumber`。相反，`yourGuess = winningNumber`\
  \ 会了 `yourGuess` 的值。（它将 `winningNumber` 的值赋值给变量 `yourGuess`。）\n\n\n\n\n\n你可以使用 `==`\
  \ 和 `!=` 运算符来比较数字和字符以外的其他内容。但当你这样做时，必须小心。欲需更多信息，请参阅第 18 章。\n\n### 比较数字\n\n没有什么比比较数字更平淡无了。“真还是假？五大于或等于十。”假。五既不大于十也不等于十。明白我的意思吗？*无聊透*。\n\
  \n比较整数是一个显而易见的问题。但遗憾的是，当你比较小数时，会出现一些小问题。以一个将摄氏度转换为华氏度的程序为例。等等！不要随便找一个程序；看代码列表 8-5\
  \ 中的程序。\n\n代码列表 8-5：这里暖和舒适\n\n```java\nimport java.util.Scanner;\n\nclass CelsiusToFahrenheit\
  \ {\n  public static void main(String args[]) {\n    Scanner keyboard = new Scanner(System.in);\n\
