  ) 指向名为 importantData.txt 的文件。如果该文件存在，删除删除。”\n是的，细节就在其中。\n\n### 使用 Java 的 do 语句\n\
  \n为了编写列表 15-4 中的程序，你需要一个循环 —— 一个反复询问用户是否删除 `importantData.txt` 文件的循环。图 15-7 说明了列表\
  \ 15-4 中的循环动作。循环会在用户给出有效响应之前继续询问。循环在每次迭代的结束时（在每次用户的响应之后）测试其条件。\n\n`do` 循环的格式如下：\n\
  \n```java\ndo {\n  *语句*\n} while (*条件*)\n```\n\n\n\n在循环末尾编写 `Condition` 提醒我，计算机首先执行循环内部的\
  \ `Statement`。在执行完 `Statement` 后，计算机会继续检查 `Condition`。如果 `Condition` 为真，计算机就会返回进行下一次\
  \ `Statement` 的迭代。\n\n使用 `do` 循环，计算机始终至少执行一次循环内部的语句：\n\n```java\n//This code prints\
  \ something:\nint twoPlusTwo = 2 + 2;\n\ndo {\n    System.out.println(\"Are you\
  \ kidding?\");\n    System.out.println(\"2+2 doesn't equal 5.\");\n    System.out.print\
  \ (\"Everyone knows that\");\n    System.out.println(\" 2+2 equals 3.\");\n} while\
  \ (twoPlusTwo == 5);\n```\n\n这段代码会显示 Are you kidding? 2+2 doesn't equal 5... 等等，然后测试条件\
  \ `twoPlusTwo == 5`。由于 `twoPlusTwo == 5` 为假，计算机不会返回进行下一次迭代。相反，计算机将跳转到循环紧随之后的任何代码。\n\
  \n## 使用预定值重复（Java 的增强型 for 语句）\n\n大多数人说他们“什么也没赢过”。其他人可能中过抽奖、幸运活动和竞赛，但他们没有赢得“东西”。好吧，我有一个消息要告诉这些人——其他人也没有赢得过东西。没有人赢得过东西。概率规律就是这样运作的。赢得美国热门彩票大奖的概率大约是\
  \ 135,000,000 分之 1。如果你卖掉价值 25 万美元的房子并用所有的钱买彩票，你的中奖概率仍然只有 540 分之 1。如果你每个月都玩（每天卖掉一个房子），你中大奖的概率仍然低于\
  \ 15 分之 1。\n\n当然，上一段话中的内容都不适用于我。我不买彩票，但我经常赢得东西。我的获胜连始于几年前。在在线研讨会结束时，我赢得了一些昂贵的 Java\
  \ 软件。那个月晚些时候，我赢得了一个带微芯片的小指环（1998 年 Java 大会的纪念品）。第二年我赢得了一个无线 PDA。就在上周，我赢得了一台高级商务级打印机。\n\
  \n我从不花钱参加任何比赛。所有这些奖品都是赠品。当全国计算机科学教育者会议在内华达州的里诺举行时，我的同事说服我去尝试了老虎机。我输了 23 美元，然后赢回了\
  \ 18 美元。那时我停止了。我想在只少 5 美元的时候退出。\n\n这就是为什么我写一个关于老虎机的 Java 程序是一件如此奇怪的事情。典型的老虎机有三个滚轮，每个滚轮大约有\
  \ 20 个符号。但为了说明本节的思想，我不需要 20 个符号。我使用了四个符号——樱桃、柠檬、金橘和芜根。\n\n### 创建增强型 for 循环\n\n当你玩我简化的老虎机时，你可以旋转\
  \ 60 多种组合中的任何一种——樱桃+樱桃+金橘、芜根+芜根+芜根，或其他。本章的目标是列出所有可能的组合。首先，我向你展示另一种循环。列表 15-5 为老虎机的符号定义了一个枚举（enum）类型，并显示了符号列表。（有关枚举类型的介绍，请参阅第\
  \ 10 章。）\n\n列表 15-5：老虎机符号\n\n```java\nimport static java.lang.System.out;\n\nclass\
  \ ListSymbols {\n  enum Symbol {\n    cherry, lemon, kumquat, rutab\n  }\n\n  public\
  \ static void main(String args[]) {\n    for (Symbol leftReel : Symbol.values())\
  \ {\n      out.println(leftReel);\n    }\n  }\n}\n```\n\n列表 15-5 使用了 Java 的 `enhanced\
  \ for loop`（增强 for 循环）。“增强”意味着“与 Java 早期版本的循环相比得到了增强”。增强 for 循环是在 Java 5.0 版本引入的。如果你运行\
  \ Java 1.4.2（或类似版本），就无法使用增强型 for 循环。\n\n以下是增强型 for 循环的格式：\n\n```java\nfor (TypeName\
  \ variableName : RangeOfValues) {\n    Statements\n}\n```\n\n列表 15-5 中的循环是如何遵循该格式的：\n\
  \n*   在列表 15-5 中，单词 `Symbol` 是类型的名称。`int` 类型描述像 0, 1, 2 这样的值。`boolean` 类型描述 true\
  \ 和 false 的值。而（由于列表 15-5 中的代码）`Symbol` 类型描述 cherry, lemon, kumquat 和 rutabaga 的值。\n\
  *   在列表 15-5 中，单词 `leftReel` 是变量的名称。列表 15-1 中的循环定义 `count` 为一个 `int` 变量。同样，列表 15-5\
  \ 中的循环定义 `leftReel` 为一个 `Symbol` 变量。所以从理论上讲，变量 `leftReel` 可以取四个 `Symbol` 值中的任何一个。\n\
  *   在列表 15-5 中，表达式 `Symbol.values()` 代表这四个值。\n\n    引用我上一个点中的话，“从理论上讲，变量 `leftReel`\
  \ 可以取四个 `Symbol` 值中的任何一个。”好吧，`for` 语句中的 `RangeOfValues` 部分将理论变成了实践。括号内的这三个项表示：“根据\
  \ `Symbol` 值的数量进行循环迭代，并在每次迭代中让 `leftReel` 取不同的 `Symbol` 值。”\n\n所以列表 15-5 中的循环进行了四次迭代——`leftReel`\
  \ 值为 cherry 的一次，另一次 `leftReel` 值为 lemon 的迭代，第三次 `leftReel` 值为 kumquat 的迭代，第四次 `leftReel`\
  \ 值为 rutab 的迭代。在每次迭代中，程序打印 `leftReel` 变量的值。\n\n通常，`someEnumTypeName.values()` 代表特定枚举类型可以具有的值集合。例如，在列表\
  \ 10-7 中，你可以使用表达式 `WhoWins.values()` 来引用 home, visitor 和 neither 值。\n\n类型名称（如 `Symbol`）与类型值（如\
  \ `Symbol.values()`）之间的区别非常微妙。幸运的是，你不必担心这种区别。作为初学者，你只需要在增强循环的 `RangeOfValues` 部分使用\
  \ `.values()` 后即可。\n\n### 嵌套增强 for 循环\n\n列表 15-5 以非常优雅的方式解决了一个简单的问题。所以在读完列表 15-5\
  \ 后，你提出了更复杂的问题。“我可以列出老虎机四个符号所有可能的三个滚轮组合吗？”可以的。列表 15-6 展示了如何实现。\n\n列表 15-6：列出组合\n\
  \n```java\nimport static java.lang.System.out;\n\nclass ListCombinations {\n  enum\
  \ Symbol {\n    cherry, lemon, kumquat, rutabaga\n  }\n\n  public static void main(String\
  \ args[]) {\n    for (Symbol leftReel : Symbol.values()) {\n      for (Symbol middleReel\
  \ : Symbol.values()) {\n        for (Symbol rightReel : Symbol.values()) {\n   \
  \     }\n      }\n    }\n  }\n}\n```\n\n\n\n\n\n```\n            out.print(leftReel);\n\
  \            out.print(\" \");\n            out.print(middleReel);\n           \
  \ out.print(\" \");\n            out.println(rightReel);\n        }\n    }\n   \
  \ }\n}\n```\n\n当你运行列表 15-6 中的程序时，你将得到 64 行输出。其中一些行（来自运行中间的行）显示在图 15-9 中。\n\n![9781118407813-fg1509.tif](img/9781118407813-fg1509_fmt.png)\n\
