  \ 和 1000.00 等值）。但为了给你的代码进行一些挑战性的锻炼，你应该使用一些意外之外的值。如果你有来自真实案例研究的值，你应该使用它们。但如果你没有真实数据，随机生成的值很容易创建。\n\
  \n要了解我是如何随机生成三个字母名称的，请查看本章的“随机生成单词”侧边栏。\n\n我需要一些代码来实现图 19-1 中的想法。幸运的是，我在代码列表 19-1\
  \ 中有了一些代码。\n\n代码列表 19-1：Account 类\n\n```java\nimport java.text.NumberFormat;\n\n\
  import static java.lang.System.out;\n\nclass Account {\n    String lastName;\n \
  \   int id;\n    double balance;\n\n    void display() {\n        NumberFormat currency\
  \ =\n            NumberFormat.getCurrencyInstance();\n        out.print(\"The account\
  \ with last name \");\n        out.print(lastName);\n        out.print(\" and ID\
  \ number \");\n        out.print(id);\n        out.print(\" has balance \");\n \
  \       out.println(currency.format(balance));\n    }\n}\n```\n\n代码列表 19-1 中的 `Account`\
  \ 类定义了四个内容——`lastName`、`id`、`balance` 和 `display`。因此，`Account` 类的每个实例都有它们自己的 `lastName`\
  \ 变量、自己的 `id` 变量、自己的 `balance` 变量以及自己的 `display` 方法。这些内容与图 19-1 中的四列相对应。\n\n###\
  \ 检查方法头部\n\n代码列表 19-1 包含了 `display` 方法的声明。就像 `main` 方法的声明一样，`display` 声明有一个头部和一个方法体（参见第\
  \ 4 章）。头部包含两个单词和一些括号：\n\n- `void` 告诉计算机当 `display` 方法被调用时，它不返回任何内容。\n- `display`\
  \ 是方法名。\n- 括号是空的，因为该方法不需要任何参数。\n- 大括号 `{}` 包含了方法体的内容。\n\n\n\n\n\n列表 19-3 中的代码运行结果如图\
  \ 19-3 所示。\n\n![9781118407813-fg1903.tif](img/9781118407813-fg1903_fmt.png)\n\n\
  图 19-3：运行列表 19-3 中的代码。\n\n![warning.eps](img/warning_fmt.png) 关于列表 19-3 中的代码，你的运行结果可能会有所不同。你看到的数值与图\
  \ 19-3 中的不相同。事实上，如果你多次运行列表 19-3，你（几乎可以肯定）每次都会得到不同的三字母名称、不同的 ID 号和不同的账户余额。这就是程序随机生成值时发生的情况。\n\
  \n### 控制流\n\n假设你正在运行列表 19-3 中的代码。计算机到达 `display` 方法调用：\n\n```\nanAccount.display();\n\
  ```\n\n在此时，计算机开始运行 `display` 方法内部的代码。换句话说，计算机跳转到了 `Account` 类代码的中间（列表 19-1 中的代码）。\n\
  \n执行完 `display` 方法的代码（那堆 `print` 和 `println` 调用）后，计算机返回到列表 19-3 中离开的地方。也就是说，计算机回到了\
  \ `display` 方法调用并从那里继续执行。\n\n所以，当你运行列表 19-3 中的代码时，每个循环迭代中的执行流并不是完全从顶到底部的。相反，动作是从\
  \ `for` 循环跳转到 `display` 方法，然后返回到 `for` 循环。整个过程如图 19-4 所示。\n\n![9781118407813-fg1904.tif](img/9781118407813-fg1904_fmt.png)\n\
  \n图 19-4：列表 19-1 和 19-3 之间的控制流。\n\n### 使用标点\n\n在列表 19-3 中，注意点号的使用。要引用存储在 `anAccount`\
  \ 对象中的 `lastName`，你写道：\n\n```\nanAccount.lastName\n```\n\n让 `anAccount` 对象显示自己，你写道：\n\
  \n```\nanAccount.display();\n```\n\n太棒了！当你引用对象的变量或调用对象的方法时，唯一的区别是：\n\n- 引用对象的变量时，不使用括号。\n\
  - 调用对象的方法时，使用括号。\n\n![remember.eps](img/remember_fmt.png) 当你调用方法时，在方法名后加上括号。即使括号里没有要放的内容也要这样做。\n\
  \n### 多能的加号\n\n列表 19-3 中的程序用到了一些小技巧。在 Java 中，你可以用加号做两件事：\n\n- **你可以用加号相加。** 例如，你可以写：\n\
  ```\nnumberOfSheep = 2 + 5;\n```\n- **你可以用加号拼接字符串。** 当你拼接字符串时，你将它们一个接一个地挤在一起。例如，表达式\n\
  ```\n\"Barry\" + \" \" + \"Burd\"\n```\n将 Barry、一个空格和 Burd 连在一起。新拼接的字符串是（你猜得到了）Burd。\n\
  \n在列表 19-3 中，语句\n\n```\nanAccount.lastName = \"\" + (char)(myRandom.nextInt(26)\
  \ + 'A') + (char)(myRandom.nextInt(26) + 'a') + (char)(myRandom.nextInt(26) + 'a');\n\
  ```\n有很多加号，一些加号拼接在一起。第一个部分是神秘的空字符串 `\"\"`。这个空字符串是不可见的，所以不会影响第二、第三和第四部分。在空字符串后面，程序拼接了第二个部分。第二个部分是表达式\
  \ `(char)(myRandom.nextInt(26) + 'A')` 的值。这个表达式看起来很复杂但其实没什么。它代表一个大写字母（随机生成）。在空字符串和大写字母后面，程序拼接了第三部分。第三部分是表达式\
  \ `(char)(myRandom.nextInt(26) + 'a')` 的值。这代表一个小写字母（随机生成）。所有这些部分，程序拼接了另一个小写字母。总之，你有了一个随机生成的三个字母名称。更多细节请参见侧边栏。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 在列表 19-3 中，语句 `anAccount.balance\
  \ = myRandom.nextInt(10000)` 将一个 `int` 值赋值给 `balance`。但 `balance` 是一个 `double` 变量。这没关系。在特殊情况下，Java\
  \ 允许你将 `int` 值赋值给 `double` 变量。赋值的结果并不意外。如果你将 `int` 值 `8734` 赋值给 `double` 变量 `balance`，`balance`\
  \ 的值变为 `8734.00`。结果如图 19-3 的第一行。\n\n![remember.eps](img/remember_fmt.png) 使用 `double`\
  \ 类型存储金额通常不是好主意。在本书中我使用 `double` 是为了保持示例简单。但对于金额，`int` 类型更好，而 `BigDecimal` 类型最好。更多细节请参见第\
  \ 7 章。\n\n## 让对象工作\n\n当我年轻的时候，还没有现在的对象这么智能。例如，考虑列表 19-4 中的对象。这个对象不仅可以显示自己，还可以填充值。\n\
  \n列表 19-4：具有两个方法的类\n\n```java\nimport java.util.Random;\nimport java.text.NumberFormat;\n\
  import static java.lang.System.out;\n\nclass BetterAccount {\n    String lastName;\n\
  \    int id;\n    double balance;\n\n    void fillData() {\n        Random myRandom\
  \ = new Random();\n        lastName = \"\" + (char)(myRandom.nextInt(26) + 'A')\
  \ + (char)(myRandom.nextInt(26) + 'a') + (char)(myRandom.nextInt(26) + 'a');\n \
  \       id = myRandom.nextInt(10000);\n        balance = myRandom.nextInt(10000);\n\
  \    }\n\n    void display() {\n        NumberFormat currency = NumberFormat.getCurrencyInstance();\n\
  \        out.print(\"The account with name \" + lastName);\n        out.print(\"\
  \ and ID number \" + id);\n        out.print(\" has balance \");\n        out.println(currency.format(balance));\n\
  \    }\n}\n```\n\n我写了一些代码来使用列表 19-4 中的类。这段新代码在列表 19-5 中。\n\n列表 19-5：这太酷了！\n\n```java\n\
  class ProcessBetterAccounts {\n    public static void main(String args[]) {\n  \
  \      BetterAccount anAccount;\n        for (int i = 0; i < 3; i++) {\n       \
  \     anAccount = new BetterAccount();\n            anAccount.fillData();\n    \
  \        anAccount.display();\n        }\n    }\n}\n```\n\n列表 19-5 非常干练。因为列表 19-4\
  \ 中的代码太聪明了，列表 19-5 中的新代码几乎不需要做什么工作。这段新代码只是创建了一个 `BetterAccount` 对象，然后调用列表 19-4 中的方法。\n\
  \n\n\n\n\n想象一下让某人去超市买面包。当你这样做时，你会说：“去超市买一些面包。”（在家里试试吧。你很快就能得到一块新鲜的面包！）当然，在其他时候，你又让同一个人去超市买香蕉。你会说：“去超市买一些香蕉。”那么这一切的意义是什么？嗯，你有一个方法，而且在你调用它时，有一些传递给它的即时信息（on-the-fly\
  \ information）。这个方法被命名为“去超市买一些……”。这些即时信息是“面包”或“香蕉”，取决于你的烹饪需求。在 Java 中，方法的调用看起来像这样：\n\
  \n```java\ngoToTheSupermarketAndBuySome(bread);\ngoToTheSupermarketAndBuySome(bananas);\n\
  ```\n\n括号中的内容被称为 `parameters`（参数）或 `parameter lists`（参数列表）。有了参数，你的方法会变得灵活得多。你不再是每次都获取相同的东西，而是可以一次让别人去超市买面包，下一次买香蕉，第三次买鸟食。当你调用你的\
  \ `goToTheSupermarketAndBuySome` 方法时，你就在那里决定要让你的朋友买什么。\n\n这些概念在代码列表 19-6 和 19-7\
  \ 中得到了具体的体现。\n\n#### 列表 19-6：添加利\n\n```java\nimport java.text.NumberFormat;\nimport\
