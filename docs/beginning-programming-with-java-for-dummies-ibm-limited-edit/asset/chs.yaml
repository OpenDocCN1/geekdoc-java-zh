  \n如果列表 16-2 有什么启示，那就是 `for` 循环的迭代次数可以在不同运行之间发生变化。列表 16-2 中的循环只要计数变量 `roomNum` 小于用户指定的房间号，它就会一直运行。当\
  \ `roomNum` 等于用户指定的数字时（即当 `roomNum` 等于 `whichRoom` 时），计算机就会跳出循环。然后，计算机从 `occupancy`\
  \ 文件中再获取一个 `int` 值，并将该值显示在屏幕上。\n\n当你盯着图 16-3 中的运行结果时，记住房间不寻常的编号很重要。3 号房间有两个客人，因为\
  \ 3 号房间是图 16-1 中 `occupancy` 文件中的*第四*个房间。这是因为该旅馆的房间是从 0 到 9 编号的。\n\n在 for 循环中使用各种条件\n\
  \n看图 16-3 中的运行，注意当用户询问不存在的房间时程序的糟糕行为。旅馆没有 10 号房间。如果你询问 10 号房间的客人数，程序会尝试读取超出 `occupancy`\
  \ 文件包含的内容。这次不幸的尝试导致了 `NoSuchElementException`。列表 16-3 解决了文件末尾的问题。\n\n列表 16-3：更完善的单房间代码\n\
  \n```java\nimport java.util.Scanner;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
  import static java.lang.System.out;\n\npublic class BetterOneRoom {\n    public\
  \ static void main(String args[]) throws FileNotFoundException {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        Scanner diskScanner = new Scanner(new\
  \ File(\"occupancy\"));\n        int whichRoom;\n        out.print(\"Which room?\
  \ \");\n        whichRoom = keyboard.nextInt();\n        for (int roomNum = 0; roomNum\
  \ < whichRoom; roomNum++) {\n            diskScanner.nextInt();\n        }\n   \
  \     if (diskScanner.hasNext()) {\n            out.print(\"Room \");\n        \
  \    out.print(whichRoom);\n            out.print(\" has \");\n            out.print(diskScanner.nextInt());\n\
  \            out.println(\" guest(s).\");\n        }\n        keyboard.close();\n\
  \        diskScanner.close();\n    }\n}\n```\n\n列表 16-3 是更加完善的版本。为了得到这种代码，你取列表 16-2\
  \ 的代码并对文件末尾进行一些测试。你在每次调用 `nextInt()` 之前执行 `diskScanner.hasNext()` 测试。这样，如果 `nextInt()`\
  \ 注定会失败，你可以在失败之前捕获它。列表 16-3 的几次测试运行如图 16-4 所示。\n\n![9781118407813-fg1604.tif](img/9781118407813-fg1604_fmt.png)\n\
  \n图 16-4：糟糕的房间号 10 没有响应。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 在列表\
  \ 16-3 中，我想知道 `occupancy` 文件是否包含任何数据（我尚未读取过的数据）。所以我调用了 `Scanner` 类的 `hasNext()`\
  \ 方法。`hasNext()` 方法查看我是否可以读取任何数据——`int` 值、`double` 值、单词、布尔值等等。这对于本节的示例来说是可以的，但在某些情况下，你需要对输入数据更加挑剔。例如，你可能想知道是否可以使用\
  \ `nextInt()`（而不是 `nextDouble()` 或 `nextLine()`）。幸运的是，Java 有满足你最挑剔需求的方法。像 `if (diskScanner.hasNextInt())`\
  \ 这样的方法测试是否可以从磁盘文件中读取 `int` 值。Java 还有如 `hasNextLine()`、`hasNext()` 等方法。关于普通的 `hasNext`\
  \ 方法的更多信息，请参阅第 14 章。\n\n##读者认识数组；数组认识读者\n\n一位疲惫的旅客来到 Java 旅馆的前台。“我想要一个房间，”旅客说。于是前台服务员运行了一份与图\
  \ 16-2 相同的报告。注意到列表中的第一个空房间，服务员建议入住 2 号房间。“我要那个，”旅客说。\n\n\n\n\n这就是呈现方式的细微变化产生巨大差异的地方。你需要一个按反序列出空闲房间的程序。这样，8\
  \ 号房间就会在 2 号房间之前引起服务员的注意。\n\n考虑一下一个反序显示数据的程序策略。根据图 16-1 的输入，程序的输出应该看起来像图 16-5 所示的那样。\n\
  \n![9781118407813-fg1605.tif](img/9781118407813-fg1605_fmt.png)\n\n图 16-5：空闲房间列表，优先显示房间号较大的房间。\n\
  \n这里是编程策略的第一个（糟糕的）想法：\n\n* 获取入住情况文件中的最后一个值。\n* 如果该值为 0，则打印房间号。\n* 获取入住情况文件中的倒数第二个值。\n\
  * 如果该值为 0，则打印房间号。\n* ……以此类推。\n\n对于某些花哨的输入输出程序，这种策略可能是行的。但无论你使用什么输入输出程序，直接跳转到文件的末尾或中间都是非常令人头疼的。如果你计划反复跳转，情况会更糟。所以，回到回到起点，想个更好的办法。\n\
  \n这里有一个主意！读取入住情况文件中的所有值，并将每个值存储在它自己的变量中。然后你按反序遍历这些变量，在适当的时候显示房间号。\n\n这个想法行得通，但代码太丑陋了，我不愿雅雅地称它为“列表（Listing）”。不，这只是那种“看以下代码”的内容。所以，请看以下丑陋的代码：\n\
  \n```java\n/*\n * 呃！我无法忍受这丑陋的代码！\n */\nguestsIn0 = diskScanner.nextInt();\nguestsIn1\
  \ = diskScanner.nextInt();\nguestsIn2 = diskScanner.nextInt();\nguestsIn3 = diskScanner.nextInt();\n\
  guestsIn4 = diskScanner.nextInt();\nguestsIn5 = diskScanner.nextInt();\nguestsIn6\
  \ = diskScanner.nextInt();\nguestsIn7 = diskScanner.nextInt();\nguestsIn8 = diskScanner.nextInt();\n\
  guestsIn9 = diskScanner.nextInt();\n\nif (guestsIn9 == 0) {\n    System.out.println(9);\n\
  }\nif (guestsIn8 == 0) {\n    System.out.println(8);\n}\nif (guestsIn7 == 0) {\n\
  \    System.out.println(7);\n}\nif (guestsIn6 == 0) {\n// *……依此类推。*\n```\n\n你缺乏的是一种统一命名十个变量的方法。也就是说，如果能写成这样就很好：\n\
  \n```java\n/*\n * 好主意不错，但这不是真正的 Java 代码：\n */\n// 正向读取\nfor (int roomNum = 0; roomNum\
  \ < 10; roomNum++) {\n    guestsIn***roomNum*** = diskScanner.nextInt();\n}\n//\
  \ 反向写入\nfor (int roomNum = 9; roomNum >= 0; roomNum--) {\n    if (guestsIn***roomNum***\
  \ == 0) {\n        System.out.println(***roomNum***);\n    }\n}\n```\n\n嗯，你可以写这种循环。你需要的只是方括号。当你向上述代码所示的想法中添加方括号时，你就得到了所谓的“数组（array）”。一个\
  \ `array` 是一行值，就像单层旅馆的一排房间一样。要在脑海中形成数组，只需想象 Java 旅馆（Java Motel）即可：\n\n* 首先，想象房间一个接一个地排在一起。\n\
  * 接下来，想象这些房间都缺少了前墙。在每个房间里，你可以看到特定数量的客人。\n* 如果可以的话，请忘记 9 号房间的两个客人正把一叠叠钞放入大公文包里。忽略\
  \ 5 号房间的客人一天半没离开电视机的事实。不要看这些细节，只看数字。在每个房间里，看一个代表该房间客人数量的数字。（如果你的长项不是自由形式可视化，请看图\
  \ 16-6。）![9781118407813-fg1606.tif](img/9781118407813-fg1606_fmt.png)\n\n图 16-6：Java\
  \ 旅馆房间的抽象快照。\n\n在 Java 编程术语中，整排房间被称为 `array`。数组中的每个房间被称为数组的 `component`（也称为数组 `element`，即元素）。每个组件都与两个数字相关：\n\
  \n* **Index（索引）**：在 Java 编程术语中，整排房间被称为 `array`。数组中的每个房间被称为数组的 `component`（也称为数组\
  \ `element`）。每个组件都与两个数字相关：\n* **Value（值）**：在 Java 编程术语中，整排房间被称为 `array`。数组中的每个房间被称为数组的\
  \ `component`（也称为数组 `element`）。\n\n**Index** 和 **Value**\n\n当你使用数组并使用 `for` 循环遍历数组组件时，通常将循环计数器设置为\
  \ 0。为了形成测试迭代的条件，你通常会编写类似 `roomNum < arraySize` 的表达式，其中 `arraySize` 是数组中组件的数量。\n\n\
