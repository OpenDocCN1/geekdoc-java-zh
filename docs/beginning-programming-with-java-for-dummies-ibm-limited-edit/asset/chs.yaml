  \ 10，所以“decimal”一词意味着十进制表示。因为计算机存储的是二进制（而非十进制）表示，因此用“decimal”来描述此类数字是不准确的。但在本书中，我控制不住。无论技术人员是否喜不喜欢，我都要称它们为“decimal\
  \ numbers”。\n\n### 从键盘读取小数\n\n我不敢相信！SnitSoft 正在打折！仅限此周，你只需 5.75 美元的低价即可获得 SnitSoft\
