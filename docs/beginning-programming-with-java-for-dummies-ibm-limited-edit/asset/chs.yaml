  \ 0) {\n                System.out.print(\"Room \");\n                System.out.print(roomNum);\n\
  \                System.out.println(\" is vacant.\");\n            }\n        }\n\
  \        diskScanner.close();\n    }\n}\n```\n\n注意 `VacanciesInReverse` 程序中第二个 for\
  \ 循环括号里的内容。这些地方很容易出错。你的目标是写一个检查 9 号房间，然后是 8 号房间，依此类推的循环。\n\n```java\nif (guestsIn[9]\
  \ == 0) {\n    System.out.print(roomNum);\n}\nif (guestsIn[8] == 0) {\n    System.out.print(roomNum);\n\
  }\nif (guestsIn[7] == 0) {\n    System.out.print(roomNum);\n}\n```\n...依此类推，直到你到达...\n\
  \n```java\nif (guestsIn[0] == 0) {\n    System.out.print(roomNum);\n}\n```\n\n关于这段代码的一些观察：\n\
  \n* 循环计数器必须从 9 开始：\n  `for (int roomNum = 9; roomNum >= 0; roomNum--)`\n* 每次循环时，计数器都减\
  \ 1：\n  `for (int roomNum = 9; roomNum >= 0; roomNum--)`\n* 只要计数器大于等于 0，循环就会继续：\n\
  \  `for (int roomNum = 9; roomNum >= 0; roomNum--)`\n\n仔细思考这三项中的每一项，你就能写出一个完美的 for\
  \ 循环。\n\n## 使用数组\n\n在本章稍早之前，一满车的独行者出现在了你的旅馆。当他们终于离开时，你很高兴能送走他们，尽管这意味着你的房间会空置段时间。但现在，另一辆车驶进了停车场。这辆车上挂着一个写有“社交俱乐部”的牌子。车上下了\
  \ 50 个人，每个人都比上一个更社交。现在，停车场里的每个人都急于结识其他人。当他们见面打招呼时，他们都在向前台嬉戏，唱着俱乐部的主题歌。（噢不不！那是《社交者之歌》！）\n\
  \n前五个社交者都想住 7 号房间。空间很挤，但你从没有失过阵脚。接着是一个三个人的小组，他们渴望入住 0 号房间（他们是程序员，觉得这个房间号很可爱）。然后有一群四个社交者想住\
  \ 3 号房间（那个池池对他们很有吸引力）。\n\n面对如此庞大的流量，你最好打开电脑。你启动了一个允许你输入新数据的程序。该程序有五个部分：\n\n* **创建一个数组并在数组的每个分量中放入\
  \ 0。** 当独行者俱乐部离开后，旅馆突然空了。（见鬼，甚至在独行者俱乐部离开之前，旅馆看起来就是空的）。要声明一个数组并用零填充，你需要执行以下类型的代码：\n\
