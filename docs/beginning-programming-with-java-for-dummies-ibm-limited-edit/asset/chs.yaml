  \ 可以登录了。\n\n### 类与方法的真相\n\n列表 18-5 中的魔之处在于使用了一个名为 `equals` 的方法。我有两种方法来解释 `equals`：一种简单的方法，另一种更详细的方法。首先，是简单的方法：`equals`\
  \ 方法比较两个字符串。\n\n![remember.eps](img/remember_fmt.png) 不要使用双等号来比较两个 `String`。相反，使用对象的\
  \ `equals` 方法。\n\n为了更详细地了解 `equals` 方法，请参阅第 17 章](#25_9781118407813-ch18.xhtml_z7)\
  \ 的第 18 页](#25_9781118407813-ch18.xhtml_z8) 节。第 17 章（第 17 行）展示了类之间的相似性。事实上，每个字符串（对象）都包含三项：\n\
  \n* 一个值（存储在字符串中的字符）\n* 一个计数（存储在字符串中的数字）\n* 一种与其他字符串比较的方法（对象的 equals 方法）\n\n这就是面向对象编程的精髓。每个字符串（`String`\
  \ 类的实例）都有它自己的 `equals` 方法。例如，在列表 18-5 中，`password` 字符串拥有它自己的 `equals` 方法。\n\n\n\n\
  \n调用字符串的 `equals` 方法就像获取一次购买的总额。无论是使用 `equals` 还是 `total`，你都会用到你的老朋友——点符号（.`）。例如，在列表\
  \ 17-3 中，你写道：\n\n```java\nSystem.out.println(onePurchase.total);\n```\n\n在列表 18-5\
  \ 中，你写道：\n\n```java\nif (password.equals(userInput))\n```\n\n点符号对于对象的变量和方法起的作用是相同的。无论在哪种情况下，点符号都会获取对象并提取出对象的某部分。无论该部分是某段数据（如\
  \ `onePurchase.total`）还是一个方法（如 `password.equals`），它都能工作。\n\n### 组合和使用数据\n\n在章节的这里，我终于可以说：“我早就告诉过你了”。这里是摘自第\
