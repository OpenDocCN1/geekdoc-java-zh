  `currency` 对象有一个 `format` 方法。因此，为了在 `niceTotal` 中获得正确的字符，你调用 `currency` 对象的 `format`\
  \ 方法。你将此方法应用于变量 `total`。\n\n### 你的国家；你的货币\n\n列表 18-7 中的代码在美国运行良好。但在另一个国家，货币可能不是美元符号\
  \ ($)，你可能使用除 20.0 以外的字符来表示二十。\n\nJava 调整输入和输出以匹配你计算机的区域设置（locale）。例如，假设你的计算机运行法国销售的版本。那么，对于\
  \ Java 而言，你计算机的区域设置就是 `Locale.FRANCE`，列表 18-7 代码的运行看起来就像图 18-1 所示。\n\n![9781118407813-fg1811.tif](img/9781118407813-fg1811_fmt.png)\n\
