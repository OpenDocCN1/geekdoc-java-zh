  \n列表 10-6 展示了一种思考问题的方法。你有一个问题，但有两个两个答案。（在本节的棒球问题中，问题是“谁会获胜？”，答案是“汉基队”、“袜子队”或“双方都没获胜”。）这个问题需要一个\
  \ `if` 语句，但 `if` 语句只有两个分支——真分支和假分支。因此，你将多个备选方案组合起来形成*级联 if 语句*。\n\n在列表 10-6 中，级联\
  \ if 语句的格式如下：\n\n```java\nif (Condition1) {\n    SomeStatements\n} else if (Condition2)\
  \ {\n    OtherStatements\n} else {\n    EvenMoreStatements\n}\n```\n\n通常情况下，你可以根据需要无限次使用\
  \ `else if`：\n\n```java\nif (hankeesWin) {\n    out.println(\"Hankees win...\");\n\
  \    out.print(\"Hankees: \");\n    out.println(hankees);\n    out.print(\"Socks:\
  \   \");\n    out.println(socks);\n} else if (socksWin) {\n    out.println(\"Socks\
  \ win...\");\n    out.print(\"Socks:   \");\n    out.println(socks);\n    out.print(\"\
  Hankees: \");\n    out.println(hankees);\n} else if (isATie) {\n    out.println(\"\
  It's a tie...\");\n    out.print(\"Hankees: \");\n    out.println(hankees);\n  \
  \  out.print(\"Socks:   \");\n    out.println(socks);\n} else if (gameCancelled)\
  \ {\n    out.println(\"Sorry, sports fans.\");\n} else {\n    out.println(\"The\
  \ game isn't over yet.\");\n}\n```\n\n级联 if 语句并没有什么特殊之处。这不是一种新的编程语言特性。级联 if 语句利用了\
  \ Java 的一个漏洞——即在某些情况下可以省略大括号的漏洞。除外，级联 if 语句只是为你提供了一种在代码中思考决策的新方式。\n\n**注意：*** 列表\
  \ 10-6 使用静态导入声明来避免无谓重复 `System.out` 单词。若想了解一些关于静态导入声明的内容（并对我没能更透彻地解释这一概念表示歉），请参阅第\
  \ 9 章。如果要了解静态导入声明的详情，请参阅第 18 章。\n\n## 列举所有可能性\n\n第 8 章介绍了 Java 的布尔类型——这种只有两个值（true\
  \ 和 false）的类型。布尔类型非常方便，但有时你需要更多值。毕竟，交通信号灯的值可以是绿色、黄色或红色。扑牌的花色可以是黑桃、梅花、红心或方块。工作日可以是周一、周二、周三、周四或周五。\n\
  \n生活充满了各种可能性集合，而 Java 有一种特性可以反映这些可能性。这种特性被称为枚举类型（enum type）。它从 Java 5.0 版本开始可用。\n\
  \n### 创建一个枚举类型\n\n列表 10-6 中的故事有三种可能的结局：汉基队获胜、袜子队获胜或比赛平局。你可以用以下 Java 代码行表示这些可能性：\n\
  \n```java\nenum WhoWins {home, visitor, neither}\n```\n\n本周的比赛在 Hankeeville 的 SnitSoft\
  \ 体育场举行，因此值 `home` 代表汉基队的获胜，而值 `visitor` 代表袜子队的获胜。\n\n计算机编程的目标之一是让每个程序的结构都能镜像该程序所解决的问题。当一个程序能让你想起它的底层问题时，该程序就容易理解且维护成本低。例如，一个统计客户账户的程序应该使用像\
  \ `customer` 和 `account` 的名称。一个处理三种可能结果（主队胜、客队胜和平局）的程序应该拥有一个具有三个可能值的变量。`enum WhoWins\
  \ {home, visitor, neither}` 这一行创建一个存储三个值的类型。\n\n`WhoWins` 类型被称为*枚举类型*（enum type）。将这个新的\
  \ `WhoWins` 类型想象成加强版的布尔值。与其只有两个值（true 和 false），`WhoWins` 类型有三个值（home, visitor 和\
  \ neither）。你可以创建一个 `WhoWins` 类型的变量：\n\n```java\nWhoWins who;\n```\n\n然后为新变量分配一个值。\n\
  \n```java\nwho = WhoWins.home;\n```\n\n在下一节中，我将 `WhoWins` 类型用上了大用用场。\n\n### 使用枚举类型\n\
  \n列表 10-7 展示了如何使用 `WhoWins` 类型。\n\n列表 10-7：胜者与负者\n\n```java\nimport java.util.Scanner;\n\
  import static java.lang.out.*;\n\nclass Scoreboard {\n    enum WhoWins {home, visitor,\
  \ neither}\n    public static void main(String args[]) {\n        Scanner keyboard\
  \ = new Scanner(System.in);\n        int hankees, socks;\n        WhoWins who;\n\
  \        out.print(\"Hankees and socks: \");\n        hankees = keyboard.nextInt();\n\
  \        socks = keyboard.nextInt();\n        if (hankees > socks) {\n         \
  \   who = WhoWins.home;\n            out.println(\"The Hankees win...\");\n    \
  \    } else if (socks > hankees) {\n            who = WhoWins.visitor;\n       \
  \     out.println(\"The Socks win...\");\n        } else {\n            who = WhoWins.neither;\n\
  \            out.println(\"It's a tie...\");\n        }\n        out.println(\"\
  Today's game is brought to you by\");\n        out.println(\"Hankeeville, the number\
  \ one in the area.\");\n        out.println(\"Remember, four doctors recommend\"\
  );\n        out.println(\"itSoft to their patients.\");\n        if (who == WhoWins.home)\
  \ {\n            out.println(\"We beat 'em good. Didn't we?\");\n        } else\
  \ if (who == WhoWins.visitor) {\n            out.println(\"The umpire made an unfair\
  \ call.\");\n        }\n        if (who == WhoWins.neither) {\n            out.println(\"\
  The game goes into overtime.\");\n        }\n        keyboard.close();\n    }\n\
  }\n```\n\n列表 10-7 的三次运行如图图 10-13 所示。\n\n![9781118407813-fg1013.tif](img/9781118407813-fg1013_fmt.png)\n\
  \n图 10-13：Hankeeville 的喜悦\n\n在列表 10-7 中发生了这些情况：\n\n\n\n\n但那种策略会很笨拙。在更复杂的程序中，我可能得检查几十次\
  \ `hankees > socks`。这就像是一遍又一遍地问同一个问题一样。\n\n与其反复检查 `hankees > socks` 条件，我不如将游戏的结果存储为一个枚举（enum）值。然后，我可以根据需要多次检查该枚举值。这是解决重复检查问题的一种非常整洁的方法。\n\
  \n# 第 11 章\n\n# 如何拨动虚拟开关\n\n本章内容\n\n* 处理多种替代方案\n* 从语句中间跳出\n* 处理替代赋值\n\n想象一下正在和十扇不同的门玩《幸运大王》（*Let’s\
  \ Make a Deal*）。“选择 1 号门、2 号门、3 号门、4 号门……等一下！我们休息一下看广告。等我们回来，我会说其他六扇门的名字。”\n\n蒙蒂·霍尔（Monty\
  \ Hall）需要的是 Java 的 `switch` 语句。\n\n## 认识 switch 语句\n\n第 [9]章](#15_9781118407813-ch09.xhtml)中列表\
  \ 9-2 的代码模拟了一个占卜玩具——一个电子神谕。向程序提一个问题，程序就会随机生成一个“是”或“否”的回答。但作为玩具，列表 9-2 中的代码并没好玩。代码只有两个可能的答案。没有变化可言。即使是最早的会说话娃娃也能说大约十句不同的句子。\n\
  \n假设你想增强列表 9-2 的代码。调用 `myRandom.nextInt(10) + 1` 会生成 1 到 10 之间的数字。所以也许你可以为这 10 个数字中的每一个显示不同的句子。一大堆\
  \ `if` 语句就能解决问题：\n\n```java\nif (randomNumber == 1) {\n    System.out.println(\"\
  Yes. Isn't it obvious?\");\n}\n\nif (randomNumber == 2) {\n    System.out.println(\"\
  No, and don't ask again.\");\n}\n\nif (randomNumber == 3) {\n    System.out.print(\"\
  Yessir, yessir!\");\n    System.out.println(\" Three bags full.\");\n}\n\nif (randomNumber\
  \ == 4)\n    .\n    .\n    .\nif (randomNumber < 1 || randomNumber > 10) {\n   \
  \ System.out.print(\"Sorry, the electronic oracle\");\n}\n```\n\n 假设你想增强列表 9-2 的代码。调用\
  \ `myRandom.nextInt(10) + 1` 生成 1 到 10 之间的数字。也许你可以为这 10 个数字中的每一个显示不同的句子。一大堆 `if`\
  \ 语句就能解决问题：\n\n```java\nif (randomNumber == 1) {\n    System.out.println(\"是的。这不是显而易见吗？\"\
  );\n}\n\nif (randomNumber == 2) {\n    System.out.println(\"不，别再问了。\");\n}\n\nif\
  \ (randomNumber == 3) {\n    System.out.print(\"是的，是的！\");\n    System.out.println(\"\
  \ 满满三袋。\");\n}\n\nif (randomNumber == 4)\n    .\n    .\n    .\nif (randomNumber\
  \ < 1 || randomNumber > 10) {\n    System.out.print(\"抱歉，电子神谕\");\n}\n```\n\n这种方法看起来很浪费。为什么不只检查一次\
  \ `randomNumber` 的值，然后根据该值采取操作呢？幸运的是，有这样的语句：`switch` 语句。列表 11-1 是 `switch` 语句的示例。\n\
  \n第 [9]章](#15_9781118407813-ch09.xhtml)中列表 9-2 的代码模拟了一个占卜玩具——一个电子神谕。向程序提一个问题，程序就会随机生成一个“是”或“否”的回答。但作为玩具，列表\
  \ 9-2 中的代码并没好玩。代码只有两个可能的答案。没有变化可言。即使是最早的会说话娃娃也能说大约十句不同的句子。\n\n假设你想增强列表 9-2 的代码。调用\
  \ `myRandom.nextInt(10) + 1` 生成 1 到 10 之间的数字。也许你可以为这 10 个数字中的每一个显示不同的句子。一大堆 `if`\
  \ 语句就能解决问题：\n\n```java\nif (randomNumber == 1) {\n    System.out.println(\"是的。这不是显而易见吗？\"\
  );\n}\n\nif (randomNumber == 2) {\n    System.out.println(\"不，别再问了。\");\n}\n\nif\
  \ (randomNumber == 3) {\n    System.out.print(\"是的，是的！\");\n    System.out.println(\"\
  \ 满满三袋。\");\n}\n\nif (randomNumber == 4)\n    .\n    .\n    .\nif (randomNumber\
  \ < 1 || randomNumber > 10) {\n    System.out.print(\"抱歉，电子神谕\");\n}\n```\n\n列表\
  \ 11-1 是 `switch` 语句的示例。\n\n```java\nimport java.util.Scanner;\nimport java.util.Random;\n\
  import static java.lang.System.out;\n\nclass TheSwitch {\n    public static void\
  \ main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n  \
  \      Random myRandom = new Random();\n        int randomNumber;\n        out.print(\"\
  输入问题：\");\n        randomNumber = myRandom.nextInt(10) + 1;\n\n        switch (randomNumber)\
  \ {\n            case 1:\n                out.println(\"是的。这不是显而易见吗？\");\n     \
  \           break;\n            case 2:\n                out.println(\"不，别再问了。\"\
  );\n                break;\n            case 3:\n                out.print(\"是的，是的！\"\
  );\n                out.println(\" 满满三袋。\");\n                break;\n         \
  \   case 4:\n                out.println(\"运气不错。\");\n                break;\n \
  \           case 5:\n                out.println(\"你猜错了。\");\n                break;\n\
  \            case 6:\n                out.println(\"再试一次。\");\n                break;\n\
  \            case 7:\n                out.print(\"是的，如果\");\n                out.println(\"\
  你有运气。\");\n                break;\n            case 8:\n                out.println(\"\
  我不在乎。\");\n                break;\n            case 9:\n                out.println(\"\
  我没明白。\");\n                break;\n            case 10:\n                out.println(\"\
  万如此！\");\n                break;\n            default:\n                out.print(\"\
  抱歉，电子神谕\");\n                out.println(\"坏了。\");\n        }\n        out.println(\"\
  结束。\");\n    }\n}\n```\n\n### switch 语句中的 cases\n\n 11-1 是一个 `switch` 语句的示例。图 11-1\
  \ 展示了 `switch` 语句的几次运行。在图 11-1 的第二次运行中：\n\n*   用户输入一个问题，变量 `randomNumber` 得到了一个值。\n\
  *   图 11-1 的执行到达 `switch` 语句的顶部。\n*   `randomNumber` 不匹配 `case 1`，所以计算机移动到下一个 case。\n\
  *   值 `2` 匹配了 `case 2`，所以计算机执行了 `case 2` 中的语句。\n*   `break` 语句将计算机跳出 `switch` 语句。\n\
  \n### switch 语句中的 default\n\n如果在列表 11-1 程序的运行时发生了错误怎么办？假设表达式 `myRandom.nextInt(10)\
  \ + 1` 生成了一个不在 1 到 10 范围内的数字。那么计算机将跳过所有的 `case` 子句。它没有落在任何 `case`，而是跳转到 `default`\
  \ 子句。在 `default` 子句中，计算机显示“你你有问题吗？”，然后跳出 `switch` 语句。\n\n### 关于 switch 语句的严格细节\n\
  \n`switch` 语句可以采用以下形式：\n\n```java\nswitch (Expression) {\ncase FirstValue:\n   \
  \ Statements\ncase SecondValue:\n    MoreStatements\n// ... 更多 cases...\ndefault:\n\
  \    EvenMoreStatements\n}\n```\n\n关于 switch 语句的一些小知识：\n\n*   `Expression` 不一定是\
  \ `int` 值。它可以是 `char`、`byte`、`short` 或 `int`。\n*   例如，以下代码在 Java 5 及更高版本中有效：\n\n\
  ```java\nchar letterGrade;\nletterGrade = keyboard.findWithinHorizon(\".\",0).charAt(0);\n\
  \nswitch (letterGrade) {\n    case 'A':\n        System.out.println(\"优秀\");\n \
  \       break;\n    case 'B':\n        System.out.println(\"良好\");\n        break;\n\
  }\n```\n\n\n\n\n```java\ncase 'C':\n    System.out.println(\"Average\");\n    break;\n\
  }\n```\n\n事实上，如果你避免使用 `Scanner` 类及其 `findWithinHorizon` 方法，那么这个项目符号的 `switch` 语句适用于所有版本的\
  \ Java ——无论是旧版本还是新版本。\n\n*   如果你使用 Java 7 或更高版本，`Expression` 可以是一个 `String`。例如，以下代码在\
  \ Java 6 中无法工作，但在 Java 7 中运行良好：\n\n```java\nString description;\ndescription = keyboard.next();\n\
  switch (description) {\n    case \"Excellent\":\n        System.out.println('A');\n\
  \        break;\n    case \"Good\":\n        System.out.println('B');\n        break;\n\
  \    case \"Average\":\n        System.out.println('C');\n        break;\n}\n```\n\
  \n*   `Expression` 不一定是一个变量。它可以是类型为 `char`、`byte`、`short` 或 `int` 的任意表达式。例如，你可以用以下代码模拟两个骰子的投掷：\n\
  \n```java\nint die1, die2;\ndie1 = myRandom.nextInt(6) + 1;\ndie2 = myRandom.nextInt(6)\
  \ + 1;\nswitch (die1 + die2) {\n  //...etc.\n}\n```\n\n*   `switch` 语句中的 `case`\
  \ 不一定按顺序排列。这里是可以接受的代码：\n\n```java\nswitch (randomNumber) {\n    case 2:\n      \
  \  System.out.println(\"No, and don't ask again.\");\n        break;\n    case 1:\n\
  \        System.out.println(\"Yes. Isn't it obvious?\");\n        break;\n    case\
  \ 3:\n        System.out.print(\"Yessir, yessir!\");\n        System.out.println(\"\
  \ Three bags full.\");\n        break;\n    //...etc.\n}\n```\n\n这种 `case` 的混合可能会在你尝试阅读程序时减慢你的速度，但它仍然是合法的。\n\
  \n*   你不需要为 `Expression` 的每个预期值编写一个 `case`。你可以将一些预期值留给 `default`。这里有一个例子：\n\n```java\n\
  switch (randomNumber) {\n    case 1:\n        System.out.println(\"Yes. Isn't it\
  \ obvious?\");\n        break;\n    case 5:\n        System.out.println(\"No chance,\
  \ Lance.\");\n        break;\n    case 7:\n        System.out.print(\"Yes, but only\
  \ if\");\n        System.out.println(\" you're nice to me.\");\n        break;\n\
  \    case 10:\n        System.out.print(\"No, not until\");\n        System.out.println(\"\
  \ Nell squeezes Rover.\");\n        break;\n    default:\n        System.out.print(\"\
  Sorry,\");\n        System.out.println(\" I just can't decide.\");\n        break;\n\
  }\n```\n\n*   `default` 子句是可选的。\n\n```java\nswitch (randomNumber) {\n    case 1:\n\
  \        System.out.println(\"Yes. Isn't it obvious?\");\n        break;\n    case\
  \ 2:\n        System.out.println(\"No, and don't ask again.\");\n        break;\n\
  \    case 3:\n        System.out.print(\"I'm too tired.\");\n        System.out.println(\"\
  \ Go ask somebody else.\");\n}\nSystem.out.println(\"Goodbye\");\n```\n\n如果你没有 `default`\
  \ 子句，并且出现一个没有被任何 `case` 覆盖的值，`switch` 语句将什么都不做。例如，如果 `randomNumber` 是 4，前面的代码将显示\
  \ `Goodbye`，不再有其他输出。\n\n*   在某些方面，`if` 语句比 `switch` 语句更灵活。例如，你不能在 `switch` 语句的 `Expression`\
  \ 中使用条件：\n\n```java\n// 你不能这么做：\nswitch (age >= 12 && age < 65)\n```\n\n你不能将条件作为\
  \ `case` 值：\n\n```java\n// 你不能这么做：\nswitch (age) {\n    case age <= 12: //...etc.\n\
  }\n```\n\n### 使用 break 还是不使用 break\n\n在某个时刻，每个 Java 程序员都会忘记使用 `break` 语句。起初，结果的输出会令人困惑，但随后程序员就会想起了“贯穿”（fall-through）。`fall-through`\
  \ 这个术语描述了当你结束一个 `case` 而没有使用 `break` 时发生的情况。发生的是代码的执行会贯穿到行的下一个 `case`。执行会一直贯穿，直到你遇到\
  \ `break` 或整个 `switch` 语句的结束。如果你不相信我，看看列表 1-2 即可。该列表的代码有一个坏掉的 `switch` 语句。\n\n列表\
  \ 1-2: 拜托，给我个机会（Break）吧！\n\n```java\n/**\n* 这不是代码。程序员忘记了一些\n* 的 break 语句。 */\nimport\
  \ java.util.Scanner;\nimport java.util.Random;\nimport static java.lang.System.out;\n\
  \nclass BadBreaks {\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        Random myRandom = new Random();\n\
  \        int randomNumber;\n        out.print(\"Type your question, child: \");\n\
  \        keyboard.nextLine();\n        randomNumber = myRandom.nextInt(10) + 1;\n\
  \        switch (randomNumber) {\n            case 1:\n                out.println(\"\
  Yes. Isn't it obvious?\");\n            case 2:\n                out.println(\"\
  No, and don't ask again.\");\n            case 3:\n                out.print(\"\
  Yessir, yessir!\");\n                out.println(\" Three bags full.\");\n     \
  \       case 4:\n                out.print(\"What part of\");\n                out.println(\"\
  \ you understand?\");\n            case 5:\n                out.println(\"No chance,\
  \ Lance.\");\n            case 6:\n                out.println(\"Sure, whatever.\"\
  );\n            case 7:\n                out.print(\"Yes, but only if\");\n    \
  \            out.println(\" you're nice to me.\");\n            case 8:\n      \
  \          out.println(\"Yes (as I care).\");\n            case 9:\n           \
  \     out.print(\"No, not until\");\n                out.println(\" Cromwell seizes.\"\
  );\n            case 10:\n                out.print(\"No, not until\");\n      \
  \          out.println(\" Nell squeezes Rover.\");\n            default:\n     \
  \           out.print(\"You think you\");\n                out.println(\" My number\
  \ generator is broken!\");\n        }\n        out.println(\"Goodbye\");\n     \
  \   keyboard.close();\n    }\n}\n```\n\n我把两次运行此代码放在了图 1-3 中。在第一次运行时，`randomNumber`\
  \ 是 7。程序执行 case 7 到 10，以及 `default`。在第二次运行时，`randomNumber` 是 3。程序执行 case 3 和 4。由于\
  \ case 4 有一个 `break` 语句，程序跳出了 switch 并显示 Goodbye。\n\n图 1-3: 请做好决定。列表 1-2 中的 `switch`\
  \ 语句缺少了一些 `break` 语句。\n\n## 利用贯穿的优势\n\n通常，当你使用 `switch` 语句时，你不希望贯穿，因此会在 `switch`\
  \ 中到处都是 `break` 语句。但有时，贯穿正是你所需要的。\n\n考虑月份的天数。这有什么简单的规则吗？包含字母“r”的月份有 31 天？“i”在“e”之前的（“c”除外）月份有\
  \ 30 天？你可以反复尝试 `if` 条件。但为了处理所有可能性，我更倾向于使用 `switch` 语句。列表 1-3 展示了这一思想。\n\n列表 1-3:\
  \ 查找月份的天数\n\n```java\nimport java.util.Scanner;\nclass DaysEachMonth {\n    public\
  \ static void main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
  \        int month, numberOfDays = 0;\n        boolean isLeapYear;\n        System.out.print(\"\
  Which month? \");\n        month = keyboard.nextInt();\n        switch (month) {\n\
  \            case 1:\n            case 3:\n            case 5:\n            case\
  \ 7:\n            case 8:\n            case 10:\n            case 12:\n        \
  \        numberOfDays = 31;\n                break;\n            case 4:\n     \
  \       case 6:\n            case 9:\n            case 11:\n                numberOfDays\
  \ = 30;\n                break;\n            case 2:\n                System.out.print(\"\
  Leap year (true/false)? \");\n                isLeapYear = keyboard.nextBoolean();\n\
  \                if (isLeapYear) {\n```\n\n\n\n\n\n```java\n            numberOfDays\
  \ = 29;\n\n        } else {\n            numberOfDays = 28;\n        }\n      }\n\
  \      System.out.print(numberOfDays);\n      System.out.println(\" days\");\n \
  \     keyboard.close();\n    }\n}\n```\n\n图 11-4 显示了列表 11-3 中程序的几次运行。对于月份数字 6，计算机跳转到\
  \ `case 6`。在 `case 6` 子句内部没有语句，因此程序运行的这部分相当相当无聊。\n\n![9781118407813-fg1104.tif](img/9781118407813-fg1104_fmt.png)\n\
  \n图 11-4：距离下一次大截止日期还有多少天？\n\n但由于 `case 6` 子句中没有 `break`，计算机直接一直运行到 `case 9`。计算机再次没有找到任何语句也没有\
  \ `break`，于是计算机进入到下一个 case，即 `case 11`。在这一点上，计算机发现了宝藏。计算机将 `numberOfDays` 赋值为 30，并跳出了整个\
  \ `switch` 语句（参见图 11-5）。\n\n二月是最好的月份。首先，列表 11-3 中的二月 case 包含了对 `Scanner` 类的 `nextBoolean()`\
  \ 方法的调用。该方法期望我输入 `true` 或 `false`。代码使用我输入的任何单词来给布尔变量赋值一个值。（在列表 11-3 中，我将 `true`\
  \ 或 `false` 赋值给 `isLeapYear` 变量。）\n\n![9781118407813-fg1105.tif](img/9781118407813-fg1105_fmt.png)\n\
  \n图 11-5：跟随跳球。\n\n二月也包含它自己的 `if` 语句。在第 10 章，我将 `if` 语句嵌套在其他 `if` 语句中。但在二月，我将一个 `if`\
  \ 语句嵌套在一个 `switch` 语句中。这很酷。\n\n## 条件运算符\n\nJava 有一个非常有趣的特性，我忍不住想写写它。使用这个特性，你可以以一种非常自然的方式考虑替代方案。\n\
  \n我说的“自然的方式”是指什么？如果我在模仿列表 11-3 结尾附近的 `if` 语句时大声思考，我得出了这些：\n\n**// 列表 11-3 中的思考：**\n\
  \n*接下来该做什么？*\n\n*如果这是一个闰年，*\n\n*我会让 `numberOfDays` 变为 29；*\n\n*否则，*\n\n*我会让 `numberOfDays`\
  \ 变为 28。*\n\n我正漫无目的地进入一个 `if` 语句，而对接下来要做什么毫无头绪。这看起来很愚蠢。现在是二月，每个人都知道你在二月要干什么。你是在问这个月有多少天。\n\
  \n在我看来，列表 11-3 中的代码并没有反映出思考二月最自然的方式。因此，这里有一种更自然的方式：\n\n**// 思考问题的更自然的方式：**\n\n*`numberOfDays`\
  \ 的值是...*\n\n*等等！这是闰年吗？*\n\n*如果是，29*\n\n*如果不是，28*\n\n在这种第二种更自然的思考方式中，我从一开始就知道我正在选择一个天数。因此，当我到达一个路口（这是闰年吗？）时，唯一的任务就是在\
  \ 29 和 28 之间做出选择。\n\n我可以优雅地做出选择：\n\n```java\ncase 2:\n    out.print(\"Leap year\
  \ (true/false)? \");\n    isLeapYear = keyboard.nextBoolean();\n    numberOfDays\
  \ = isLeapYear ? 29 : 28;\n```\n\n`? :` 组合被称为*条件运算符*。在图 11-6 中，我向你展示了对二月的自然思考如何转化为条件运算符的格式。\n\
  \n![9781118407813-fg1106.tif](img/9781118407813-fg1106_fmt.png)\n\n图 11-6：从你的大脑到计算机大脑。\n\
  \n整体来看，`isLeapYear ? 29 : 28` 是一个带有值的表达式。这个表达式有什么值呢？嗯，`isLeapYear ? 29 : 28` 的值是\
  \ 29 或 28。这取决于 `isLeapYear` 是真还是假。这就是条件运算符的工作方式：\n\n- 如果问号之前的内容为真，那么整个表达式的值就是问号和冒号之间的内容。\n\
  - 如果问号之前的内容为假，那么整个表达式的值就是冒号之后的内容。\n\n图 11-7 为你提供了一个可视化这些想法的趣味方式。\n\n![9781118407813-fg1107.tif](img/9781118407813-fg1107_fmt.png)\n\
  \n图 11-7：你有看到吗？\n\n\n\n\n\n大括号中的内容（不断重复的部分）是获取两个新随机数并显示这些随机数数值的代码。大括号中的语句只要 `die1\
  \ + die2 != 7 && die1 + die2 != 11` 保持为真，就会不断重复。\n\n循环中语句的每次执行被称为循环的次数*迭代*（iteration）。在图\
  \ 12-1 中，第一次运行有 2 次迭代，而第二次运行有 12 次迭代。\n\n当 `die1 + die2 != 7 && die1 + die2 != 11`\
  \ 不再为真时（即总和为 7 或 11 时），语句的重复就会立即停止。计算机将继续执行循环之后的语句。\n\n### 跟踪循环中的执行操作\n\n为了跟踪列表\
  \ 12-1 中代码的执行情况，我将借用图 12-1 中第一次运行的数据：\n\n*   开始时，`die1` 和 `die2` 的值均为 0。\n*   计算机到达\
  \ `while` 语句顶部，检查 `die1 + die2 != 7 && die1 + die2 != 11` 是否为真（见图 12-2）。条件为真，因此计算机沿着图\
  \ 12-3 中的真路径执行。\n\n    计算机执行了循环迭代。在这次迭代期间，计算机为 `die1` 和 `die2` 获取了新值并将它们打印在屏幕上。在图\
  \ 12-1 的第一次运行中，新值为 3 和 1。\n\n    ![9781118407813-fg1202.tif](img/9781118407813-fg1202_fmt.png)\n\
  \n    图 12-2：两个错不能一个对，但两个真就是一个真。\n\n    ![9781118407813-fg1203.tif](img/9781118407813-fg1203_fmt.png)\n\
  \n    图 12-3：列表 12-1 中代码的路径。\n\n*   计算机返回 `while` 语句顶部，检查 `die1 + die2 != 7 && die1\
  \ + die2 != 11` 是否仍然为真。条件为真，因此计算机沿着图 12-3 中的真路径执行。\n\n    计算机执行了循环的另一次迭代。在这次迭代期间，计算机为\
  \ `die1` 和 `die2` 获取了新值并将它们打印在屏幕上。在图 12-1 中，新值为 4 和 3。\n\n*   计算机返回 `while` 语句顶部，检查\
  \ `die1 + die2 != 7 && die1 + die2 != 11` 是否仍然为真。好哇！这个条件已经变为假了！（见图 12-4）。计算机沿着图\
  \ 12-3 中的假路径执行。\n\n    计算机跳转到循环之后的语句。计算机显示“掷了 7”（Rolled 7）并结束程序运行。\n\n    ![9781118407813-fg1204.tif](img/9781118407813-fg1204_fmt.png)\n\
  \n    图 12-4：看！我掷出了 7！\n\n### 没有提前退出\n\n在列表 12-1 中，当计算机发现 `die1 + die2 != 7 && die1\
  \ + die2 != 11` 为真时，它会继续执行循环大括号内的所有五个语句。计算机执行：\n\n```\ndie1 = myRandom.nextInt(6)\
  \ + 1;\ndie2 = myRandom.nextInt(6) + 1;\n```\n\n也许（仅仅是），`die1` 和 `die2` 的新值之和等于\
  \ 7。即便如此，计算机也不会在循环中间跳出。计算机完成迭代并执行：\n\n```\nout.print(die1);\nout.print(\" \");\n\
  out.println(die2);\n```\n\n再一次。计算机只有在完全执行完五条语句后，才会再次测试 `die1 + die2 != 7 && die1\
  \ + die2 != 11` 是否为真。\n\n## 思考循环（语句）\n\n这是一个简化版的扑牌游戏“21 点”：你不断抽牌，直到总和达到 21 或更高。如果总和为\
  \ 21，你就赢了；如果超过，你就输了。（顺便说，花牌算 10 点。）要玩这个游戏，你需要一个像图 12-5 那样的程序。\n\n![9781118407813-fg1205.tif](img/9781118407813-fg1205_fmt.png)\n\
  \n图 12-5：赢与输。\n\n本书的大多数章节，我将程序列表放在功能描述之前。但本节不同。本节涉及编写代码的策略。因此在本节中，我从头脑风暴开始。\n\n\
  ### 寻找片段\n\n如何编写一个运行简化版 21 点的程序？我从寻找本节中列出的游戏规则开始。这种“大搜寻”在图 12-6 中所示。\n\n![9781118407813-fg1206.tif](img/9781118407813-fg1206_fmt.png)\n\
  \n图 12-6：思考编程。\n\n根据图 12-6 中的逻辑，我需要一个循环和一个 if 语句：\n\n```\nwhile (total < 21) {\n\
  \    // 操作\n}\nif (total == 21) {\n    // 你赢了\n} else {\n    // 你输了\n}\n```\n\n\
  为了让这个程序运行还需要什么？看图 12-5 中的示例输出。我需要一个带有“Card”（牌）和“Total”（总和）字样的标题。这是对 `System.out.println`\
  \ 的调用：\n\n```\nSystem.out.println(\"Card Total\");\n```\n\n还需要几行输出——每行包含两个数字。例如，在图\
  \ 12-5 中，第 6 行显示两个变量的值。一个变量存储最近的一张牌；另一个变量存储到为止所有牌的总和：\n\n```\nSystem.out.print(card);\n\
  out.print(\" \");\nout.println(total);\n```\n\n现在我有四个代码片段，但我还没有决定它们如何组合在一起。好吧，你可以直接说我是疯了。在这个过程中，我想象这四个代码片段相互环绕，就像低预算电影中的梦境序列。正如你想象的，我不擅长在梦境中设计代码。尽管如此，我把我的想法给了\
  \ Wiley 出版的艺术部门，他们设计出了图 12-7 中的图片。\n\n![9781118407813-fg1207.tif](img/9781118407813-fg1207_fmt.png)\n\
  \n图 12-7：……以及它们何时停止，没人知道。\n\n### 组装片段\n\n我应该把每个代码片段放在哪里？处理这个问题最好的方法是问每个代码片段应该执行几次：\n\
  \n*   程序多次显示牌值和总和。例如，在图 12-5 的第一次运行中，程序显示这些值四次（首先是 8 8，然后是 6 14，以此此类推）。为了得到重复显示，我将创建显示的代码放在循环内部：\n\
  \n```\nwhile (total < 21) {\n    System.out.print(card);\n    System.out.print(\"\
  \      \");\n    System.out.println(total);\n}\n```\n\n*   程序每次运行只显示一次“Card Total”标题。这个显示位于任何重复数字显示之前，因此我将标题代码放在循环之前：\n\
  \n```\nSystem.out.println(\"Card Total\");\nwhile (total < 21) {\n    System.out.print(card);\n\
  \    System.out.print(\"      \");\n    System.out.println(total);\n}\n```\n\n*\
  \   程序每次运行只显示一次“赢了”或“输了”。这个消息显示位于重复数字显示之后。因此我将输赢代码放在循环之后：\n\n```\n// 初稿代码 - 尚未就绪\n\
  System.out.println(\"Card Total\");\nwhile (total < 21) {\n    System.out.print(card);\n\
  \    System.out.print(\"      \");\n    System.out.println(total);\n}\n\nif (total\
  \ == 21) {\n    System.out.println(\"You win :-)\");\n} else {\n    System.out.println(\"\
  You lose :-(\");\n}\n```\n\n\n\n\n我几乎有一个可以运行的程序了。但如果我把为心理测试开发的代码拿来运行，就会遇到几个问题。为了让你明白我的意思，请想象一下你从电脑的角度思考一分钟。（好吧，电脑没有鞋。想象你穿上电脑的靴子。）\n\
  \n你从上一节所示的代码顶部开始（即以 `Preliminary draft` 注释开头的代码）。在代码的第一条语句中，你显示了 `Card Total` 这几个字。到目前为止，一切正常。但接着你遇到了\
  \ `while` 循环，并测试了条件 `total < 21`。那么，`total` 是小于 21 吗？还是不是呢？老实说，我很想编一个答案，因为我对不知道\
  \ `total` 变量的值而感到很尴尬。（我确定计算机也觉得很尴尬。）\n\n在计算机到达 `while` 循环的顶部之前，`total` 变量必须有一个已知的值。因为玩家开始时一张牌都没有，所以初始\
  \ `total` 值应该是 `0`。这就定下来了。我在程序的开头声明了 `int total = 0`。\n\n但是我的朋友 `card` 变量呢？我应该也把\
  \ `card` 设置为零吗？不。扑牌组里没有值为 0 的牌（至少在我公平玩的时候不是如此）。此外，在程序运行期间，`card` 应该被赋予多次新值。\n\n\
  等一下！在上句话中，*several times* 这个词触动了我大脑中的神经元。它刺激了*在循环内部*的反射。因此，我在我的 `while` 循环内部放置了对\
  \ `card` 变量的赋值：\n\n```java\n//这是一个草稿 - 尚未完全准备好正式运行：\n\nint card, total = 0;\n\n\
  System.out.println(\"Card    Total\");\n\nwhile (total < 21) {\n    card = myRandom.nextInt(10)\
  \ + 1;\n    System.out.print(card);\n    System.out.print(\"        \");\n    System.out.println(total);\n\
  }\n\nif (total == 21) {\n    System.out.println(\"You win :-)\");\n} else {\n  \
  \  System.out.println(\"You lose :-(\");\n}\n```\n\n代码仍然有一个错误，我可能可以通过更多的计算机角色扮演来找到这个错误。但我现在变得胆大了。我运行了这段测试代码看看会发生什么。图\
  \ [12-8] 显示了运行的一部分。\n\n![9781118407813-fg1208.tif](img/9781118407813-fg1208_fmt.png)\n\
  \n图 12-8：一次错误的运行。\n\n遗憾的是，图 [12-8] 中的运行并没有自动停止。这种处理被称为*无限循环*。循环一直运行，运行，直到有人绊倒了电脑的电源线。\n\
  \n![remember.eps](img/remember_fmt.png) 你可以强行停止程序的运行。寻找 Eclipse 控制台（Console）视图顶部的红色小矩形。当鼠标悬停在矩形上时，工具提示会显示“Terminate”（终止）。当你点击矩形时，活跃的\
  \ Java 程序将停止运行，矩形变为灰色。\n\n### 从无限到亲和\n\n对于某些问题，无限循环是正常且理想的。例如，考虑一个实时任务关键型应用程序——空中交通控制或心肺机的监测。在这些情况下，程序应该一直运行、运行、运行。\n\
  \n但一场“二十一点”游戏应该很快结束。在图 [12-8] 中，游戏没有结束，是因为 `total` 从未达到 21 或更高。事实上，`total` 始终是 0。问题在于我的代码中没有改变\
  \ `total` 变量值的语句。我应该将每张牌的值加到 `total` 上：\n\n`total += card;`\n\n再次，我问自己这条语句应该放在代码的哪个位置。计算机应该执行这个赋值语句几次？在程序开始时一次？在运行结束时一次？重复执行？\n\
  \n计算机应该重复将牌的值加到运行总量中。事实上，计算机每当抽取一次牌，就应该给 `total` 加值。因此，之前的赋值语句应该在 `while` 循环内部，与获取新牌值的语句并列：\n\
  \n```java\ncard = myRandom.nextInt(10) + 1;\ntotal += card;\n```\n\n有了这个发现，我准备好查看完整的程序了。代码位于列表\
  \ [12-2] 中，图 [12-5] 显示了代码的两次运行。\n\n列表 12-2：二十一点游戏的简化版本\n```java\nimport java.util.Random;\n\
  class PlayTwentyOne {\n    public static void main(String args[]) {\n        Random\
  \ myRandom = new Random();\n        int card, total = 0;\n        System.out.println(\"\
  Card    Total\");\n        while (total < 21) {\n            card = myRandom.nextInt(10)\
  \ + 1;\n            total += card;\n            System.out.print(card);\n      \
  \      System.out.print(\"        \");\n            System.out.println(total);\n\
  \        }\n        if (total == 21) {\n            System.out.println(\"You win\
  \ :-)\");\n        } else {\n            System.out.println(\"You lose :-(\");\n\
  \        }\n    }\n}\n```\n如果你读了这一节，你会精疲力竭。创建一个循环可能很困难。坦诚地说，你练习越多，就越容易。\n\n## 关于循环（预热）\n\
  \n我记得当我还是个孩子的时候。我们住在前街，在费城附近。早早时候，我得去外面打水。如今，我需要一个能从电子邮件地址中提取用户名的程序。例如，程序处理 `John@Brain.com`。`while`\
  \ 循环是如何做的？就像章节中的其他例子一样，这个问题涉及重复：\n* 读取一个字符。\n* 输出该字符。\n\n程序在找到 `@` 符号时停止重复。我尝试编写这个程序。列表\
  \ [12-3]。\n\n列表 12-3：从电子邮件地址获取用户名\n```java\n/*\n* 这代码不起作用，但让我很沮丧。\n*/\nimport java.util.Scanner;\n\
  class FirstAttempt {\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        char symbol = ' ';\n        while\
  \ (symbol != '@') {\n            symbol = keyboard.next().charAt(0);\n         \
  \   System.out.print(symbol);\n        }\n        System.out.println();\n      \
  \  keyboard.close();\n    }\n}\n```\n当你运行列表 [12-3] 中的代码时，你会得到图 [12-9] 所示的输出。用户一个接一个输入字符——字母\
  \ J，然后是 o，以此类推。初，列表 [12-3] 中的程序什么都不输出（在用户按下回车之前，计算机不会发送任何输入）。在用户输入完整的电子邮件地址并按下回车后，程序得到了第一个字符（John\
  \ 中的 J）。\n\n![9781118407813-fg1209.tif](img/9781118407813-fg1209_fmt.png)\n\n图 12-9：哎！连\
  \ @ 也符号。\n\n遗憾的是，程序的输出不是你预期的。不是只有用户名 John，而是用户名和 @ 符号。\n\n要找出为什么发生这种情况，请跟随计算机读取\
  \ John@Brain.com 输入时的动作：\n* 将 `symbol` 设置为 ' '（一个空格）。\n* 这个空格是 `@` 符号吗？不是，所以执行循环迭代。\n\
  * 输入字母 'J'。\n* 输出字母 'J'。\n* 'J' 是 `@` 符号吗？不是，所以执行循环迭代。\n* 输入字母 'o'。\n* 输出字母 'o'。\n\
  * 'o' 是 `@` 符号吗？不是，所以执行循环迭代。\n* 输入字母 'h'。\n* 输出字母 'h'。\n* 'h' 是 `@` 符号吗？不是，所以执行循环迭代。\n\
  \n\n\n\n* 输入字母 'n'。\n* 打印字母 'n'。\n* 那个 'n' 和 @ 符号相同吗？//问题就在这里。\n* 不，所以执行一次循环迭代。\n\
  * 输入 @ 符号。\n* 打印 @ 符号。//哎呀！\n* 那个 @ 符号和 @ 符号相同吗？\n* 是，所以停止迭代。\n\n在程序运行接近结束时，计算机将字母\
  \ `n` 与 `@` 符号进行比较。由于 `n` 并不是 @ 符号，计算机直接进入了循环：\n\n* 循环中的第一个语句从键盘读取一个 `@` 符号。\n*\
  \ 循环中的第二个语句并没有检查是否到了打印的时间。相反，第二个语句直接向前执行并显示 `@` 符号。\n\n在你显示了 `@` 符号之后，就无法回头了。你不能改变主意并撤销已显示的\
  \ `@` 符号。因此列表 12-3 中的代码并不完全有效。\n\n### 解决问题\n\n你会从错误中学习。列表 12-3 的问题在于，在读取和写入字符之间，程序没有检查\
  \ `@` 符号。它没有执行“测试、输入、打印”，而应该执行“输入、测试、打印”。也就是说，与其执行这样做：\n\n* 那个 'o' 和 @ 符号相同吗？\n\
  * 不，所以执行一次循环迭代。\n* 输入字母 'h'。\n* 打印字母 'h'。\n* 那个 'h' 和 @ 符号相同吗？\n* 不，所以执行一次循环迭代。\n\
  * 输入字母 'n'。\n* 打印字母 'n'。\n* 那个 'n' 和 @ 符号相同吗？//问题就在这里。\n* 不，所以执行一次循环迭代。\n* 输入 @\
  \ 符号。\n* 打印 @ 符号。//哎呀！\n\n程序应该这样做：\n\n* 输入字母 'o'。\n* 那个 'o' 和 @ 符号相同吗？\n* 不，所以执行一次循环迭代。\n\
  * 打印字母 'o'。\n* 输入字母 'n'。\n* 那个 'n' 和 @ 符号相同吗？\n* 不，所以执行一次循环迭代。\n* 打印字母 'n'。\n* 输入\
  \ @ 符号。\n* 那个 @ 符号和 @ 符号相同吗？\n* 是，所以停止迭代。\n\n这个循环在图 12-10 中显示。\n\n![9781118407813-fg1210.tif](img/9781118407813-fg1210_fmt.png)\n\
  \n图 12-10：程序需要的。\n\n你可以尝试模仿以下非正式模式：\n\n* 输入一个字符。\n* 那个字符和 @ 符号相同吗？\n* 如果不是，执行一次循环迭代。\n\
  * 打印该字符。\n\n问题是，你不能将 while 循环的测试放在循环中间：\n\n```java\n// 这段代码无法\n// 按照你想要的方式工作：\n\
  {\n  symbol = keyboard.findWithinHorizon(\".\",0).charAt(0);\n  while (symbol !=\
  \ '@')\n    System.out.print(symbol);\n}\n```\n\n你不能将 while 语句的条件夹在你两个想要重复执行的语句之间。那么你能做什么呢？你需要遵循图\
  \ 12-11 中的流程。因为每个 while 循环都从测试开始，所以那是你进入循环的地方：首先测试，然后打印，最后输入。\n\n![9781118407813-fg1211.tif](img/9781118407813-fg1211_fmt.png)\n\
  \n图 12-11：进入循环。\n\n列表 12-4 展示了这种“先测试、后打印、再输入”策略的体现。\n\n列表 12-4：尝试得不错，但是……\n\n```java\n\
  /***\n * 这段代码几乎可用，但有一个细微的错误：\n **/\nimport java.util.Scanner;\n\nclass SecondAttempt\
  \ {\n  public static void main(String args[]) {\n    Scanner keyboard = new Scanner(System.in);\n\
  \    char symbol = ' ';\n    while (symbol != '@') {\n      System.out.print(symbol);\n\
  \      symbol = keyboard.findWithinHorizon(\".\",0).charAt(0);\n    }\n    System.out.println();\n\
  \    keyboard.close();\n  }\n}\n```\n\n列表 12-4 代码的运行结果如图 2-12 所示。代码几乎是正确的，但仍然有一个小问题。注意输入前的空格。程序第一次执行循环。\n\
  \n![9781118407813-fg1212.tif](img/9781118407813-fg1212_fmt.png)\n\n图 12-12：显示了额外的空格。\n\
  \n```java\nSystem.out.print(symbol);\nsymbol = keyboard.findWithinHorizon(\".\"\
  ,0).charAt(0);\n```\n\n计算机获取了 J。在某些应用程序中，额外的空格并不是大碍。但在另一些应用程序中，额外的输出可能是灾难性的。\n\n\
  ### 修复问题\n\n无论如何，额外的空格是逻辑缺陷的症状。程序不应该在有结果之前显示。解决这个问题的办法是（等掌）……初始化循环。列表 12-5 展示了如何操作。\n\
  \n列表 12-5：初始化循环\n\n```java\n/***\n * 这段代码可以工作！\n **/\nimport java.util.Scanner;\n\
  \nclass GetUserName {\n  public static void main(String args[]) {\n    Scanner keyboard\
  \ = new Scanner(System.in);\n    char symbol;\n    symbol = keyboard.findWithinHorizon(\"\
  .\",0).charAt(0);\n    while (symbol != '@') {\n      System.out.print(symbol);\n\
  \      symbol = keyboard.findWithinHorizon(\".\",0).charAt(0);\n    }\n    System.out.println();\n\
  \    keyboard.close();\n  }\n}\n```\n\n列表 12-5 遵循了图 12-13 所示的策略。首先获取一个字符（例如字母 J），然后进入循环。进入循环后，你将字符与\
  \ @ 符号进行测试，并在合适的情况下打印该字符。图 12-14 展示了 GetUserName 完美运行。\n\n![9781118407813-fg1213.tif](img/9781118407813-fg1213_fmt.png)\n\
  \n图 12-13：列表 12-5 中的策略。\n\n![9781118407813-fg1214.tif](img/9781118407813-fg1214_fmt.png)\n\
  \n图 12-14：列表 12-5 代码的运行结果。\n\n循环初始化是一项重要的编程技术。但它并不是故事的结束。在第 14 章、15 章和 16 章中，你可以学习其他的循环技巧。\n\
  \n\n\n\n\n在之前的章节中，示例从键盘获取输入并将输出发送到 Eclipse 的“控制台（Console view）”视图。这对于小任务来说没问题，但你不能让计算机为每一条夜空数据都向你提示。对于大问题，你需要大量的数据，而存储数据的最佳地方是计算机的硬盘硬盘。\n\
  \n## 运行面向磁盘的程序\n\n为了处理海量数据，你需要从磁盘文件读取（并写入）磁盘文件的工具。只要提到“磁盘文件”这个词，有些人的心里就开始由于恐惧心跳加速。毕竟，磁盘文件是难以捉摸且不可见的。它存储在你计算机内部的某处，通过某种神奇的磁过程存在。\n\
  \n事实是，从磁盘获取数据与从键盘获取数据非常相似。将数据打印到磁盘就像将数据打印到计算机屏幕上。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 在书中，将程序的文本输出“在计算机屏幕上”意味着在 Eclipse 的控制台视图中显示文本。如果你避开 Eclipse 而使用其他不同的 IDE（如 NetBeans\
  \ 或 IntelliJ IDEA），或者你放弃了所有 IDE 而选择使用系统的命令行窗口，那么对你来说，“在计算机屏幕上”的含义就略有不同。请根据需要读懂弦外音。此外，我很清楚有些计算机拥有闪存，内部并没有实实在在的磁盘。因此，“面向磁盘的”和“磁盘文件”等术语已显示出过时的迹象。但让我们面对事实：“唱片店”不再销售黑胶唱片了，在美国的测量单位中，12\
  \ 英寸不再是国王脚的长度了。现在的 LCD 屏幕不再需要保存。而且，与旧的机械汽车收音机不同，网页上的单选按钮不会标记你最喜欢的电台。\n\n考虑运行之前章节中代码的情景。你在键盘上输入了一些内容。程序获取这些内容并吐出一些它自己的内容。程序将这些新内容发送到控制台视图。实际上，数据流从键盘流到计算机内部，再流到屏幕，如图\
  \ 13-1 所示。\n\n![9781118407813-fg1301.tif](img/9781118407813-fg1301_fmt.png)\n\n\
  图 13-1：使用键盘和屏幕。\n\n当然，本章的目标是图 13-2 所示的情景。你的硬盘上有一个包含数据的文件。程序从磁盘文件中获取数据并吐出一些全新的数据。然后程序将这些新数据发送到硬盘上的另一个文件中。实际上，数据流从磁盘文件流到计算机内部，再流到另一个磁盘文件。\n\
  \n![9781118407813-fg1302.tif](img/9781118407813-fg1302_fmt.png)\n\n图 13-2：使用磁盘文件。\n\
  \n图 13-1 和 13-2 中的两种情景非常相似。事实上，记住这些基本点是有帮助的：\n\n*   **磁盘文件中的内容与你在键盘上输入的内容没有区别。**\n\
  \n    如果一个读取键盘的程序期望你输入 `19.95 5`，那么对应的磁盘读取程序就期望一个包含相同字符 `19.95 5` 的文件。如果读取键盘的程序期望你按下\
  \ `Enter` 并输入更多字符，那么对应的磁盘读取程序就期望在文件的下一行有更多字符。\n\n*   **磁盘文件中的内容与你在 Eclipse 控制台视图中看到的内容没有区别。**\n\
  \n    如果一个屏幕打印程序显示数字 `99.75`，那么对应的磁盘写入程序就会将数字 `99.75` 写入一个文件。如果一个屏幕打印程序将光标移动到下一行，那么对应的磁盘写入程序就会在文件中创建一个新行。\n\
  \n如果你很难想象磁盘文件中有什么，只需想象你在键盘上键入的文本，或者你在计算机屏幕上（即在 Eclipse 的控制台视图中）看到的文本即可。同样的文本可以出现在你磁盘上的一个文件里。\n\
