  \n## 计算机很笨\n\n计算机虽然很好用，但所有的计算机都在做同样的事情。它们*完全*按照你告诉它们去做的操作，而这有时非常不幸。例如，1962 年，一个飞往金星的水手号航天器在发射四分钟后就被摧毁了。为什么？是因为一个\
