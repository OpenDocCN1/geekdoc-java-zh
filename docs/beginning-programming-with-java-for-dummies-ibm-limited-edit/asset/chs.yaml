  \n图 15-14：最内层循环。\n\n\n\n\n\n![remember.eps](img/remember_fmt.png) 此示例的输入文件命名为 `occupancy`\
  \ 而不是 `occupancy.txt`。如果你使用 Windows 记事本创建一个 `occupancy` 文件，必须在“另存为”对话框的“文件名”字段中使用双引号。也就是说，你必须在“文件名”字段中输入\
