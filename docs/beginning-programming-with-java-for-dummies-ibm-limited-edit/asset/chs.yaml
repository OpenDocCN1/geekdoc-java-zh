  \n## 第 22 章\n\n# Java API 中的十个有用类\n\n## 本章内容\n\n![arrow](img/arrow.png) 了解更多关于类\n\
  ![arrow](img/arrow.png) 发现其他有用类\n\n我为自己感到自豪。我使用 Java API 中不到 30 个类编写了大约 400 页的 Java\
  \ 内容。标准 API 有大约 4000 个类，所以我认为做得非常好。\n\n总之，为了帮助你熟悉我最喜欢的一些 Java API 类，本章包含了一个简单的列表。列表中的某些类出现在本书的各个示例中。另一些类非常有用，若不包含它们，我就无法完成这本书。\n\
  \n有关本章中类类的更多信息，请查看 Java 的在线 API 文档：[`docs.oracle.com/javase/8/docs/api`](http://docs.oracle.com/javase/8/docs/api)。\n\
  \n### Applet\n\n哪本 Java 书是不提到一些 applet（小程序）就完整的呢？`applet` 是运行在 Web 浏览器窗口内段代码。例如，运行在网页上小矩形中的小型货币计算器可以是一段用\
  \ Java 编写的代码。\n\n曾几何时时，Java applets 非常火热，但现在人们对使用 Java 进行业务处理更感兴趣。总之，如果 applet 是你的菜，不要害。查看\
  \ Java API 文档中的 Applet 页面。\n\n### ArrayList\n\n第 16 章介绍了数组。这是很好的内容，但在任何编程语言中，数组都有其局限性。例如，取一个大小为\
  \ 100 的数组。如果你突然需要存储第 101 个值，你就彻底没运气了。你无法在重写代码的情况下更改数组的大小。在数组中插入值是另一个问题。为了在字母顺序上将\
  \ \"Tim\" 挤在 \"Thom\" 和 \"Tom\" 之间，你可能需要 `ArrayList`。`ArrayList` 类似于数组，但它的对象可以增长和缩小。`ArrayList`\
  \ 非常有用，因为 `ArrayList` 可以做数组做不到的事情。\n\n### File\n\n第 16 章介绍了数组。这是很好的内容，但在任何编程语言中，数组都有其局限性。例如，取一个大小为\
  \ 100 的数组。如果你突然需要存储第 101 个值，你就彻底没运气了。你无法在重写代码的情况下更改数组的大小。在数组中插入值是另一个问题。为了在字母顺序上将\
  \ \"Tim\" 挤在 \"Thom\" 和 \"Tom\" 之间，你可能需要 `ArrayList`。`ArrayList` 类似于数组，但它的对象可以增长和缩小。`ArrayList`\
  \ 非常有用，因为 `ArrayList` 可以做数组做不到的事情。\n\n### Integer\n\n第 16 章介绍了数组。这是很好的内容，但在任何编程语言中，数组都有其局限性。例如，取一个大小为\
  \ 100 的数组。如果你突然需要存储第 101 个值，你就彻底没运气了。你无法在重写代码的情况下更改数组的大小。在数组中插入值是另一个问题。为了在字母顺序上将\
  \ \"Tim\" 挤在 \"Thom\" 和 \"Tom\" 之间，你可能需要 `ArrayList`。`ArrayList` 类似于数组，但它的对象可以增长和缩小。`ArrayList`\
  \ 非常有用，因为 `ArrayList` 可以做数组做不到的事情。\n\n### Math\n\n你有任何数字需要处理吗？你使用计算机进行奇特的计算吗？如果是，尝试\
  \ Java 的 Math 类。（它是一段代码，不是坐下来听代数课程的地方。）Math 类处理 π、e、对数、三角函数、平方根以及所有让大多数人感到不安的数学问题。\n\
  \n### NumberFormat\n\n第 18 章有一个关于 `NumberFormat.getCurrencyInstance()` 方法的小节。通过这个方法，你可以将\
  \ 20.338500000000003 转换为 $20.34。如果美国不是美国，或者你的公司在全球销售产品，你可以用 Java `Locale` 增强你的货币实例。例如，通过\
  \ `euro = NumberFormat.getCurrencyInstance(Locale.FRANCE)`，调用 `euro.format(3)` 返回\
  \ 3,00 € 而不是 $3.00。\n\n### Scanner\n\nJava 的 Scanner 类能做的比它在示例中做的多。像 NumberFormat\
  \ 类一样，Scanner 可以处理来自不同区域的数字。例如，为了输入 3,5 并让它代表“三点半”，你可以输入 `myScanner.useLocale(Locale.FRANCE)`。你还可以告诉\
  \ Scanner 跳过某些输入字符串或使用 10 以外的数值进制。总之，Scanner 类非常多功能。\n\n## String\n\n\n\n\n第 18\
  \ 章节探讨了 Java 的 `String` 类。该章节详尽地（极其细节地）描述了一个名为 `equals` 的方法。`String` 类还有许多其他有用方法。例如，通过\
  \ `length` 方法，你可以找到字符串中的字符数量。通过 `replaceAll`，你可以轻松地将字符串中任何地方出现的 \"my fault\" 短语改为\
  \ \"your fault\"。通过 `compareTo`，你可以按照字母顺序对字符串进行排序。\n\n## String\n\n我经常需要将字符串切分成若干段。例如，我有一个名为\
  \ `fullName` 的变量，存储着我那自恋的字符串 \"Barry A. Burd\"。从这个 `fullName` 值中，我需要创建 `firstName`、`middleInitial`\
  \ 和 `lastName` 值。我有一个大字符串（\"Barry A. Burd\"），但我需要三个小字符串——\"Barry\"、A.\" 和 \"Burd\"\
  。\n\n幸运的是，`StringTokenizer` 类负责了这类苦力工作。使用这个类，你可以将 \"Barry A. Burd\" 或 \"Barry,A.,Burd\"\
  \ 甚至 \"Barry|<tab>*A.*<tab>*Burd\" 分成碎片。你也可以将每个分隔符视为有价值的数据，也可以像对待垃圾一样忽略它们。要使用字符串进行许多有趣的处理，请查看\
  \ Java 的 `StringTokenizer` 类。\n\n## System\n\n你可能对 `System.in` 和 `System.out` 非常熟悉。但\
  \ `System.getProperty` 呢？`getProperty` 方法可以了关于你计算机的各种信息。你可以找到的信息包括你的操作系统名称、处理器架构、Java\
  \ 虚拟机版本、类路径、用户名，以及你的系统是使用反斜杠还是正斜杠来分隔文件夹名称。当然，你可能已经知道这些内容了。但你的 Java 代码需要在运行时去发现这些信息吗？\n\
  \n# 关于作者\n\n`Dr. Barry Burd` 拥有罗格斯大学的计算机科学硕士学位和伊利诺伊大学的数学博士学位。在伊利诺伊州香槟-乌尔巴纳担任助教期间，他曾五次被选入全校范围的“学生评选优秀教师””名单。\n\
  \n自 1980 年以来，Burd 博士一直是新泽西州麦迪逊德鲁大学数学与计算机科学系的教授。当他不在德鲁大学授课时，Burd 博士会为商业和工业界的专业程序员领导培训课程。他曾在美国、欧洲、澳大利亚和亚洲的会议上进行过演讲。他是多篇文章和书籍的作者，包括\
  \ *Java For Dummies* 和 *Android Application Development All-in-One For Dummies*，这些书籍均由\
  \ John Wiley & Sons, Inc. 出版。\n\nBurd 博士与妻子和两个孩子住在新泽西州麦迪逊（两个孩子都二十多岁了，大部分已经自立）。作为一个热心的室内活动爱好者，Burd\
  \ 博士喜欢睡觉、聊天和吃饭。\n\n## 献献\n\n献 Harriet, Sam 和 Jennie，Sam 和 Ruth，Abram 和 Katie，Benjamin\
