  ## 决策，决策！\n\n想象一下你正走在一条宁静的乡村路上。你正在享受一个愉快的夏日。天气不不热，从北方吹来的微风让你感到清爽和警醒。你手里拿着这本书，翻到了第\
  \ 9 章节。你读了关于存储单词或句子的段落，然后抬起头。\n\n你看到一个十字路口。你看到两个路牌——一个指向右边；另一个指向左边。一个路牌写着：“存储单词或句子？真。”另一个路牌写着：“存储单词或句子？假。”你评估单词或句子的状况并继续前进，根据情况向右或向左转弯。这种决策的情况展示在图\
  \ 9-1 中。\n\n![9781118407813-pp0103.tif](img/97811118407813-pp0103_fmt.png)\n图 9-1：走哪条路？\n\
  \n*   **微波炉：**\n    *   放在微波炉上。\n    *   高火加热分钟。\n*   **传统方法：**\n    *   预热烤箱至 350\
  \ 度。\n    *   放在烤子上。\n    *   烘烤 25 分钟。\n\n生活充满了分叉路。\n\n### 决策（Java）\n\n当你处理程序时，你会做出决策。在\
  \ Java 中，这种分支被称为 *if* 语句。\n\n```java\nif (randomNumber > 5) {\n    System.out.println(\"\
  Yes. Isn't it?\");\n} else {\n    System.out.println(\"No, don't ask again.\");\n\
  }\n```\n\n跳转到代码 9-1 中的 `if` 语句。\n\n代码 9-1 中的 `if` 语句代表一个分支。用普通话来说，它的意思是：\n*   如果\
  \ `randomNumber` 变量大于 5，\n*   在屏幕上显示“是的。不是吗？”。\n*   否则，\n*   在屏幕上显示“不，不要再问了。”\n\n\
  ![9781118407813-pp0103.tif](img/9781118407813-pp0103_fmt.png)\n图 9-2：随机数决定你的命运。\n\
  \n### 仔细观察 if 语句\n\nif 语句可以采用以下形式：\n\n```\nif (Condition) {\n    SomeStatements\n\
  } else {\n    OtherStatements\n}\n```\n\n为了获得真实的 if 语句，请为三个占位符 *Condition*、*SomeStatements*\
  \ 和 *OtherStatements* 替换为有意义的文本。我们在代码 9-1 中这样进行替换：\n*   我用 `randomNumber > 5` 替换\
  \ `Condition`。\n*   我用 `System.out.println(\"Yes. Isn't it obvious?\");` 替换 `SomeStatements`。\n\
  *   我用 `System.out.println(\"No, don't ask again.\");` 替换 `OtherStatements`。\n\n\
  这些替换在图 9-3 中所示。\n\n有时我需要 if 语句的部分需要不同的名称。我将它们称为 *if 子句*（if clause）和 *else 子句*（else\
  \ clause）。\n\n\n\n\n\n```java\nif (Condition) {\n    if clause\n} else {\n    else\
  \ clause\n}\n```\n\n`if` 语句是 `compound statement`（复合语句）的一个示例——即内部包含其他语句的语句。列表 9-1\
  \ 中的 `if` 语句包含了两个 `println` 调用，而这些对 `println` 调用就是语句。\n\n注意我在列表 9-1 的 `if` 语句是如何使用括号和分号的。特别请注意以下几点：\n\
  \n*   条件必须放在括号内。\n*   `if` 子句内部的语句以分号结束。`else` 子句内部的语句也是如此。\n*   条件后面没有紧跟分号。\n*\
  \   `else` 后面没有紧跟分号。\n\n作为一名初级程序员，你可能认为这些规则是任意的。但它们并非如此。这些规则属于一个经过精心设计的语法体系。它们就像英语句子的语法规则一样，但它们更具逻辑性！（抱歉，Melba。）\n\
  \n表 9-1 展示了当你违反 `if` 语句的标点符号规则时可能出现的问题。表格中的最后两项是最臭名昭著的。在这情况下，编译器不会捕捉到错误。这会给你一种虚假的安全感。问题在于，当你运行程序时，代码的行为并不是你预期的那样。\n\
  \n### 表 9-1 常见的 if 语句错误信息\n\n| 错误 | 示例 | 最可能的消息或结果 |\n| :--- | :--- | :--- |\n|\
  \ 条件周围缺少括号 | `if randomNumber > 5 {` | `'(expectedSyntax error on token \"if\",\
  \ ( expected after this token` |\n| `if` 子句或 `else` 子句内部的语句后缺少分号 | `if (randomNumber\
  \ > 5) { System.out.println(\"Y\")}` | `';' expectedSyntax error, insert \";\" to\
  \ complete BlockStatements` |\n| 条件后直接紧跟分号 | `if (randomNumber > 5); { System.out.println(\"\
  Y\");} else {` | `'else' without 'if'Syntax error on token \"else\", delete this\
  \ token` |\n| `else` 单词后直接紧跟分号 | `} else; {` | 程序编译时无错误，但 `else` 之后的语句始终会被执行，无论条件为真还是假。\
  \ |\n| 缺少大括号 | `if (randomNumber > 5) System.out.println(\"Y\");elseSystem.out.println(\"\
  N\");` | 程序有时编译时无错误，但程序的运行可能不符合你的预期。（所以底线原则是，不要省略大括号。） |\n\n在编写代码时，将 `if` 语句视为一个不可分割的单元是有帮助的。与其输入整个第一行（包括条件），不如尝试输入\
  \ `if` 语句的骨架大纲。\n\n```java\nif () {             // 待办：填入条件。\n                  \
  \   // 待办：填入 SomeStatements。\n} else {\n                     // 待办：填入 OtherStatements。\n\
  }\n```\n\n在整个大纲就绪后，你就可以开始处理待办列表中的项目。当你将这种思维应用于复合语句时，就很难出错了。\n\n### 一个完整的程序\n\n列表\
  \ 9-2 包含一个带有简单 `if` 语句的完整程序。该列表的代码行为就像一个电子神谕。向程序提问一个是或否的问题，程序就会回答你。当然，你提问题的答案是随机生成的。但谁在乎呢？反正问问很有趣。\n\
  \n#### 列表 9-2：我无所不知\n\n```java\nimport java.util.Scanner;\nimport java.util.Random;\n\
  \nclass AnswerYesOrNo {\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        Random myRandom = new Random();\n\
  \        int randomNumber;\n        System.out.print(\"Type your question, my child:\
  \  \");\n        keyboard.nextLine();\n        randomNumber = myRandom.nextInt(10)\
  \ + 1;\n        if (randomNumber > 5) {\n            System.out.println(\"Yes. Isn't\
  \ it obvious?\");\n        } else {\n            System.out.println(\"No, and don't\
  \ ask again.\");\n        }\n        keyboard.close();\n    }\n}\n```\n\n图 9-4 显示了列表\
  \ 9-2 中程序的几次运行。程序的动作分为四个部分：\n\n1.  **提示用户。** 调用 `System.out.print`，告诉用户输入问题。\n2.\
  \  **从键盘获取用户的问题。** 在图 9-4 中，我运行了 `AnswerYesOrNo` 程序。\n3.  **获取一个 1 到 10 之间的随机数。**\
  \ （此处对应原文似乎存在重复乱码，已根据逻辑翻译）：在列表 9-2 中，`if` 语句的行为就像一个电子神谕。向程序提问一个是或否的问题，程序就会回答你。当然，你提问题的答案是随机生成的。但谁在乎呢？反正问问很有趣。\n\
  4.  **回答是或否。** （此处对应原文似乎存在重复乱码，已根据逻辑翻译）：如上所述。\n\n\n\n\n\n### 在代码中对 if 语句进行缩进\n\n\
  注意在列表 9-2 中，`if` 语句内部的 `println` 调用被缩进了。严格来说，你并不需要对 `if` 语句内部的语句进行缩进。对于编译器来说，你完全可以将整个程序写在一行内，或者将所有语句放置在一个巧妙的、扭曲的“之”字型结构中。问题是，如果你不以某种逻辑方式对语句进行缩进，那么无论你还是其他人都无法理解你的代码。在列表\
  \ 9-2 中，`println` 用的缩进有助于你的眼睛（以及大脑）快速看到这些语句是整个 `if/else` 流程的从属。\n\n在一个小型程序中，不缩进或缩进不当的代码尚强可以接受。但在复杂的程序中，不符合整齐、逻辑模式的缩进将是一个巨大的、丑陋的噩梦。\n\
  \n![remember.eps](img/remember_fmt.png) 始终缩进你的代码，以让程序的流程一目了然。\n\n![tip.eps](img/tip_fmt.png)\
  \ 你不需要担心缩进代码，因为 Eclipse 可以自动为你缩进代码。详情请参阅第 [4]章](#09_9781118407813-ch04.xhtml)。\n\
  \n### 主题的变体\n\n我不喜欢剥猫皮。但我听说，如果我真的需要剥一个皮，我有好几种技术可以选择。下次当我的猫“组胺”（Histamine）再次把地毯误认为猫砂时，我会记住这一点的。*\n\
  \n无论如何，无论你是在剥鲶皮、剥小猫皮，还是在编写计算机程序，原理都是一样的。你总有替代方案。列表 9-2 向你展示了编写 `if` 语句的一种方式。本章的其余部分（以及整个\
  \ [10]章](#16_9781118407813-ch10.xhtml））将向你展示创建 `if` 语句的其他方法。\n\n### ……否则怎样？\n\n\
  你可以创建一个不带 `else` 子句的 `if` 语句。例如，想象在一个网页上，随机抽取的访客中有一个分之一收到特别优惠。为了让访客保持好奇，我调用了 `Random`\
  \ 类的 `nextInt` 方法，并向任何幸运数字为 7 的人提供优惠。\n\n*   如果 `myRandom.nextInt(10) + 1` 生成了数字\
  \ 7，显示特殊优惠消息。\n*   如果 `myRandom.nextInt(10) + 1` 生成了除 7 以外的任何数字，则什么都不做。不要显示特殊优惠消息，也不显示令人沮丧的“对不起，您那里没有优惠”的消息。\n\
  \n实现这种策略的代码如列表 9-3 所示。代码的几次运行如图 9-5 所示。\n\n![9781118407813-fg0905.tif](img/9781118407813-fg0905_fmt.png)\n\
  \n图 9-5：列表 9-3 中代码的三次运行。\n\n列表 9-3：你幸运吗？\n\n```java\nimport java.util.Random;\n\n\
  class SpecialOffer {\n    public static void main(String args[]) {\n        Random\
  \ myRandom = new Random();\n        int randomNumber = myRandom.nextInt(10) + 1;\n\
  \        if (randomNumber == 7) {\n            System.out.println(\"An offer just\
  \ for you!\");\n        }\n        System.out.println(randomNumber);\n    }\n}\n\
  ```\n\n列表 9-3 中的 `if` 语句没有 `else` 子句。这个 `if` 语句的形式如下：\n\n```java\nif (Condition)\
  \ {\n    SomeStatements\n}\n```\n\n当 `randomNumber` 为 7 时，计算机显示 `An offer just for\
  \ you!`。当 `randomNumber` 不是 7 时，计算机就不显示 `An offer just for you!`。该操作在图 9-6 所示。\n\
  \n![9781118407813-fg0906.tif](img/9781118407813-fg0906_fmt.png)\n\n图 9-6：如果你无话说，就保持沉默。\n\
  \n![remember.eps](img/remember_fmt.png) 在比较两个值时，始终使用双等号。在 `if` 语句中比较两个值时，使用单等号（用于赋值）。\n\
  \n\n\n\n在程序的剩余部分，我可以将 `System.out` 替换为简单的 `out`。`System.in` 也是如此。通过在代码列表 9-4 顶部添加一个导入声明，我可以将\
