  \ 是一个 Java 关键字。这个 `double` 单词告诉计算机你打算在 `amount` 中存储什么种的数值。特别地，`double` 代表从 –1.8×10³⁰⁸\
  \ 到 1.8×10³⁰⁸ 之间的数字。这是一个巨大的数字范围。如果不使用花哨的 ×10 表示法，这些数字中的第二个是：\n\n```\n180000000000000000000000000000000000000000000000000000\n\
