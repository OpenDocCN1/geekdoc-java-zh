  \n### 第 15 章 老绕绕\n\n## 本章内容\n\n- 创建重复操作\n- 改进嵌套技术\n- 强制用户提供有效的响应\n- 遍历枚举值\n\n\n\n\
  \n然后，等付完账后，我们就坐下来吃晚饭。那时我想起为什么我如此厌恶这些拜访。晚餐简直无法忍受。埃德纳奶奶迷信“莱彻特法”（Fletcherism）——这是一场健康运动，追随者每一口食物都要嚼\
  \ 100 次。更虔诚的追随者会使用图表，为每种食物设定不同的嚼数。任何食物最少也要嚼 32 次——也就是嘴里每颗牙齿各咬一下。这样做的人说他们自己是在进行“莱彻特运动”。\n\
  \n爸爸妈妈觉得整个莱彻特那套很愚蠢，但他们尊重埃德纳奶奶，觉得对于她年纪的人应该顺着，而不是反抗。至于我，我觉得我会会被这种单调折疯。每顿饭都像没完没了一样。每一口都是一种折磨。我仍然记得我的咒语——那些我无意间对自己说的话：\n\
  \n*到目前为止我嚼了 0 次。*\n*我嚼了 100 次了吗？如果没有，就*\n*嚼！*\n*把我嚼的次数加 1。*\n*回到“我嚼了了吗”*\n*看看我到底完没。*\n\
  \n### 重复特定次数的语句（Java 语句）\n\n生活中充满了计数循环的例子。而计算机编程也镜像了生活（……或者是反过来的？）。当你告诉计算机要做什么时，你通常是在告诉计算机打印三行字、处理十个账户、拨一百万个电话，或者任何事情。因为计数循环在编程中非常常见，编程语言的开发者专门为这种循环开发了语句。在\
  \ Java 中，重复某些内容特定次数的语句被称为 `for` 语句。`for` 语句的一个示例在列表 [15-1] 中。\n\n列表 15-1：霍拉斯斯·莱彻特的复仇\n\
  \n```java\nimport static java.lang.System.out;\n\nclass AuntEdnaSettlesForTen {\n\
  \    public static void main(String args[]) {\n        for (int count = 0; count\
  \ < 10; count++) {\n            out.print(\"I've chewed \");\n            out.print(count);\n\
  \            out.println(\" time(s).\");\n        }\n        out.println(\"10 times!\
  \ Hooray!\");\n        out.println(\"I can swallow!\");\n    }\n}\n```\n\n图 [15-1]\
  \ 展示了当你运行列表 [15-1] 中的程序时的结果：\n\n* 列表 [15-1] 中的 `for` 语句首先将 `count` 变量设置为 0。\n* 接着，`for`\
  \ 语句进行测试，确保 `count` 小于 10（它确实如此）。\n* 随后，`for` 语句跳转并执行大括号之间的打印语句。在游戏的这个早期阶段，计算机打印\
  \ I've chewed 0 time(s)。\n*  然后，`for` 语句执行 `count++` ——那是 `for` 语句括号内的最后一个操作。这个最后的动作将\
  \ `count` 的值加 1。\n\n![9781118407813-fg1501.tif](img/9781118407813-fg1501_fmt.png)\n\
  图 15-1：嚼了十次。\n\n这结束了列表 [15-1] 中 `for` 语句的第一次迭代。当然，这个循环包含的不止一次迭代：\n\n* 当 `count`\
  \ 现在等于 1 时，`for` 语句再次检查确保 `count` 小于 10。（是的，1 比 10 小。）\n* 因为测试通过了，`for` 语句回到大括号包裹的语句中，并在屏幕上打印\
  \ I've chewed 1 time(s)。\n* 接着，`for` 语句执行其括号内的最后一个 `count++`。该语句将 `count` 的值加 1，将\
  \ `count` 的值增加到 2。\n\n以此此类推。这整个过程会一遍又一遍重复，直到十次迭代后，`count` 的值终于达到了 10。当这种情况发生时，对\
  \ `count` 小于 10 的检查失败，循环的执行结束。计算机跳转到 `for` 语句之后的任何语句。在列表 [15-1] 中，计算机打印 10 times!\
  \ Hooray! I can swallow! 整个过程如图 [15-2] 所示。\n\n![9781118407813-fg1502.tif](img/9781118407813-fg1502_fmt.png)\n\
  图 15-2：列表 [15-1] 中 for 循环的动作。\n\n### for 语句的构造分析\n\n一个典型的 `for` 语句看起来如下：\n`for (Initialization;\
  \ Condition; Update) { Statements }`\n\n在单词 `for` 之后，你在括号中放入了三个东西：一个 `initialization`（初始化）、一个\
  \ `condition`（条件）和一个 `update`（更新）。括号中的这三项内容各司其职：\n\n* **Initialization（初始化）：** 初始化执行一次，当你的程序运行到\
  \ `for` 语句时。\n* **Condition（条件）：** 条件会被测试多次（在每次迭代的开始）。\n* **Update（更新）：** 更新也会被求值多次（在每次迭代的结束）。\n\
  \n如果有帮助，把循环看作它的文本发生了偏移：\n\n```java\n// 这不是真实的代码\nint count = 0\nfor count < 0 {\n\
  \    out.print(\"I've chewed \");\n    out.print(count);\n    out.println();\n}\n\
