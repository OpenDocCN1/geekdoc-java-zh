    # 5.2 ORDINARY FILES


    You can use common files, as you know it from PC, and not enough, it goes a long
    way in the way as described in the book Java 5 about IO. The main difference is
    that files can be stored in two places, either internally they are stored together
    with the program in internal storage or external where they can be stored on an
    external SD card. I want to show the first option because the ability to save
    files remotely to a SD card is a security problem with Android, and that why Google
    has tightened the requirements for external files significantly and they probably
    not found the final solution yet. It''s actually possible to open a device so
    that you can easily create files on a SD card, but it is not recommended, so I''m
    looking only at the internal files, but with respect to the code, the difference
    is not big.


