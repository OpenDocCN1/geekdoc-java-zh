    +   2. A service is bounded when an application component binds to it by calling
    the

    method bindService(). A bound service offers a client-server interface that allows

    components to interact with the service, send requests, and also across

    processes. A bound service runs only as long as another application component

    bound to it. Multiple components can bind to the service at once, but when

    them unbind, the service is destroyed.


    By default, a service is performed in the same process as an application''s primary
    thread,

    but if it is a service that is started by an application, that service will usually
    perform its

    work in a secondary thread, and the service will be terminated with the end of
    the

    secondary thread.


    Android performs a number of predefined services that any application may apply
    if it is

    allowed. Use of these services usually occurs with a special Manager class using
    a method

    SystemService(), and the Context class defines more constants for these services.
    An

    application, in addition to these system services, define and apply new services
    that

    behave in the same way as system services. Custom services can generally be generated
    from

    other Android components, that is, activities, broadcast receivers and other services.


    The entire lifetime of a service happens between the call of a method onCreate()
    and the

    call of the method onDestroy() where onCreate() is used to all initial setup,
    while the release

    of resources is done in onDestroy(). The methods are called for all services,
    whether they''re

    created by startService() or bindService(). A service begins with its work to
    either

    onStartCommand() or onBind(). Each method is handled an Intent object passed to
    either

    startService() or bindService(), respectively. If the service is started, it ends
    its work when

    onStartCommand() returns, and if the service is bound, it ends when onUnbind()


    A service may be defined in AndroidManifest.xml and written as a class that inherits
    the

    class Service or one of its subclasses. As example, an Android component (and
    so far,

    to say an activity) can start a service with the method startService(), and as
    an alternative it can

    use bindService() that allows for direct communication with the service.


    A service starts its life with the method startService() and if the service is
    not already

    running, a service object is created in the service''s onCreate() method. Once
    running, a

    service can notify the user of the events using Toast notifications or Status
    Bar notifications,

    but the service can not directly call the user.'
