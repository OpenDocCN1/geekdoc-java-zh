    illustrate some of them through examples, but basically they used the same way
    you know it from controls in Java. Things are of called something else, and there
    are other properties that you can set, but the principles are the same. Widgets
    are arranged in an extensive class hierarchy, where the overall basic is called
    View. In this context, it is good to know the web address


    ```

    https://developer.android.com/reference/classes.html

    ```


    which is the reference for Android''s many features.


    As with Swing and JavaFX, the biggest challenges are getting a component placed
    in the window, where you now exactly want them to to be, but also that the window
    looks at different sizes of the screen, but that is the subject of the next chapter.


    In general, Android has the same widgets that you know as controls in Swing /
    JavaFX, but maybe they are called something else. However, there are also new
    ones that are not found in Java, and as an example, I want to show an application
    with two widgets


