    The method onStart() returns an int that indicates services should be restarted
    if it is terminated by Android and there are the following options:


    +   1. Service.START_STICKY, which means the service is restarted, but such that
    the Intent is null and used if the service maintains its state and does not depend
    on the Intent object.

    2. Service.START_NOT_STICKY, which indicates that the service will not be automatically
    restarted.

    3. Service.START_REDELIVER_INTENT, which means the same as the first option, but
    with the difference that the original Intent is sent to onStartCommand().


    One can end a service with the stopService() and a service can end with stopSelf().


    To create a bound service, you must implement the onBind() which returns an Binder
    that defines the interface for communication with the service. Other applications
    can call bindService() to retrieve the interface and begin calling methods on
    the service. The service is only alive as long as there are applications bound
    to it, and when there are no components bound to it, the system destroys it, and
    you do not need to stop a bound service in you must when the service is started
    with onStartCommand(). There are two ways you can define the IBinder interface:


    +   1. Extending the Binder. If your service is your own and runs in the same
    process as the application, which is often the case, you should create your interface
    by extending the Binder class and returning an instance of it onBind(). The client
    receives the Binder and can use it to directly access public methods available
    in either the Binder implementation or the Service. When the service is merely
    a background worker for the application it is way to create the Binder, and the
    only reason not to create the interface this way is because the service has been
    used by other applications or across processes.

    2. Using a Messenger. If your interface must work across different processes,
    you can create an interface for the service with a Messenger. In this manner,
    the service defines a Handler that responds to different types of Message objects.
    This Handler is the basis for a Messenger that can share an IBinder with the client,
    allowing the client to send commands to the service using Message objects. Also
    the client can define its own Messenger so the service can send messages back.
    This is the simplest way to perform intercommunication, because the Messenger
    queues all requests into a single thread so that you don''t have to design your
    service to be thread-safe.


    Application components can bind to a service by calling bindService(), and Android
    calls the service''s onBind() method, which returns an IBinder object for interacting
