    # # SQLITE


    You can also write apps for mobile phones that use databases, because Android
    is born with a very simple database called SQLite. The database is also widely
    used in many other places than on Android devices. It''s a simple database (what
    exactly is the goal) and it far from all the facilitators that other database
    products (like MySQL, Oracle, etc.) make available, it''s a complete SQL database
    where you can create local databases and performs the usual database operations
    – almost as you know from MySQL. In this chapter, I will show you how to use SQLite
    through an example.


    As example, I will write an app PhoneBook and it corresponds to the Contact app
    with which the phone is born, but it is not an alternative to that application,
    but only to use the of a database, and it should also be an example of a slightly
    larger app and thus a slightly realistic app than what the previous examples have
    shown. The application''s data must be stored in a database with two tables:


    | addresses | zipcodes |

    |---|---|n| id: integer | code: char(4) |

    | firstname: varchar(50) | city: varchar(30) |

    | lastname: varchar(30) | |

    | address: varchar(50) | |

    | code: char(4) | |

    | phone: varchar(20) | |

    | mail: varchar(50) | |

    | date: varchar(10) | |

    | title: varchar(50) | |


    When one table is a table with Danish codes, while the other contains contact
    information about persons. The column code in addresses is a foreign key to the
    table zipcodes. When you open the application, you get a window that shows an
    overview of zip codes (see below). At the top there are two input fields and two
    buttons that act as a filter for zip codes. In general, contacts are organized
    by zip code and in order to find a contact, hold your finger on a zip code, after
    which you get a context menu, where you can either view the contacts organized
    under that zip code or add a new contact. If you choose to view existing contacts,
    there are three options:


    +   1. There are no contacts, and you just get a simple Toast that tells you.

    2. There is a single contact and the program opens a window that displays the
    informations (see below). In this window you can also edit the contact and delete
    it.

    3. You will get a window that shows all contacts organized under the current zip
    code. I have not shown the window here, but it is nothing but a ListView with
    the names of those contacts. If you click on a name, you will come to the window
    with all the contact informations.


