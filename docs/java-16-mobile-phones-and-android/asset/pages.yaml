    \n```\nprivate static final int PERSON_UPDATED = 1;\n```\n\nYou must then add\
    \ the following method:\n\n```\npublic void onActivityResult(int requestCode,\
    \ int resultCode, Intent data) {\n    if (requestCode == PERSON_UPDATED) {\n \
    \       if (resultCode == RESULT_OK) {\n            // here you can save the changes\
    \ to the file\n            Person person = (Person)data.getSerializableExtra(\"\
    person\");\n        }\n    }\n}\n```\n\nThe method onActivityResult() is now a\
    \ method that can be called from your activity\nwhen it ends and wishes to send\
    \ a value back. It requires the new activity to be opened as:\n\n```\nstartActivityForResult(intent,\
    \ PERSON_UPDATED);\n```\n\nIn your new activity, you can then write the event\
