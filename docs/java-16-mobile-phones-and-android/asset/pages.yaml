  md: "# JAVA 16: MOBIL PHONES AND ANDROID:\nSOFTWARE DEVELOPMENT\n\n# SERVICES\n\n\
    ```\n```java\nprivate class Generator implements Runnable {\n  public void run()\
    \ {\n    long t = index == 0 ? 3 : prime + 2;\n    for (; running; t += 2) {\n\
    \      if (isPrime(t)) {\n        ++index;\n        prime = t;\n      }\n    }\n\
    \  }\n\n  private boolean isPrime(long n) {\n    if (n == 2 || n == 3 || n ==\
    \ 5) return true;\n    if (n < 11 || n % 2 == 0) return false;\n    for (long\
    \ t = 3, m = (long)Math.sqrt(n); t <= m; t += 2) {\n      if (n % t == 0) return\
    \ false;\n    }\n    return true;\n  }\n}\n```\n```\n\nFirst, note that the class\
    \ inherits the class Service, which is what makes it to a service.\nNote the class'\
    \ variables, where the first has the type IBinder, which is an interface that\
    \ defines how components can communicate with the service. The variable refers\
    \ to a PrimeBinder object, which is a public inner class inheriting the class\
    \ Binder, and the class does nothing but implement a method that returns a reference\
    \ to the current service. The following variables are for the current prime number,\
    \ which the last indicates whether the service is paused.\n\nThe class overrides\
    \ three methods from the class Service, which is performed when a component binds\
    \ or rebinds the service, and a method if a component unbinds. The last is trivial,\
    \ which it sets running to false, while the others call start(). It is the method\
    \ that starts the work of the service by starting a thread that runs until the\
    \ variable running becomes false. When the terminates (running becomes false)\
    \ the thread stops and the variables index and prime are not updated, but their\
    \ value are retained. This means that if the method start() is executed again,\
    \ it will start a new thread, which will then continue from the previous stopped.\n\
    \nThe thread itself is implemented by an inner class Generator, but here is nothing\
    \ new and the method isPrime(), is as you have seen it many times.\n\nDownload\
