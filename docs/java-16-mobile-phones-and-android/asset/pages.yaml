  md: 'JAVA 16: MOBIL PHONES AND ANDROID: SOFTWARE DEVELOPMENT FOREWORD


    # # FOREWORD


    The current book is the sixteenth in this series of books on software development
    in Java, and it is the same time the first of two books that focus on developing
    applications for Android, and especially for mobile phone applications. The books
    require basic knowledge of Java and system development in Java, and the goal is
    that the reader, reading this book, is able to write simple applications to an
    Android phone. Important topics are the most common widgets, layouts and basically
    about activities, but also use of files and databases are processed. Mobile phone
    programming is in many ways different from programming to a usual computer, for
    example the phone is another machine than a traditional computer, and the phone
    and, for that matter, other Android devices like tablets have other features that
    are not available on a PC. However, these features are dealt with in the following
    book.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying complete programs, but most by yourself
    to do it and write your programs from scratch. Therefore, an important part of
    the books is exercises and problems, where the reader has to write programs that
    correspond to the substance being treated in the text. All in the series are built
    around the skeleton and will consist of text and examples and exercises and problems
    that are placed in the text where they naturally belongs. The difference between
    exercises and problems is that the exercises largely deal with repetitions of
    the substance that is presented in the text, and furthermore it is relatively
    accurately described what to do. Problems are in more loosely described, and are
    typically a little bigger and there is rarely any clear solution. These books
    are to be read from start to finish, with the many code examples exercises and
    problems play a central role, and it is important that the reader predict in detail
    studying the code to the many examples and also solves the exercises and possibly
    just studying the recommended solutions.


    All books end with one or two larger sample programs, which focus primarily is
    on process and an explanation of how the program is written. On the other hand
    the code only to a limited extent - if at all - and the reader should study the
    finished program code while testing the program. In addition to show the development
    of programs that are larger than the examples, which otherwise is presented, the
    aim of the concluding examples are also to show program examples from varying
    fields of application.


    Most books also end with an appendix dealing with a subject that would not be
    treated in the books. It may be issues on the installation of software or other
    topics in computer


