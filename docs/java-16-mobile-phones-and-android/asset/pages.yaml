    @Override\npublic void onDestroy() {\n  running = false;\nToast.makeText(this,\
    \ \"Service destroyed\", Toast.LENGTH_LONG).show();\n}\n```\n\n```\nprivate void\
    \ sendMessage(int id) {\n  final int currentID = id;\n  Handler handler = new\
    \ Handler(Service.this.getMainLooper());\n  handler.post(new Runnable() {\n  \
    \  @Override\n    public void run() {\n      Toast.makeText(getContext(), \"Service\
    \ \" + currentID + \" is working\", Toast.LENGTH_LONG).show();\n    }\n  });\n\
    }\n```\n\nNote that at the start of the class, an instance variable is defined.\
    \ It must be used to ensure the service can start only one thread. It is not necessary,\
    \ but it is included to show how to stop a thread started by a service. Note,\
    \ in particular, the variable is set to false in the method onDestroy(), and it\
    \ is executed either because the thread stops or because onStartCommand() starts\
    \ this variable. Otherwise, if it is true, nothing happens than the method performs\
    \ a Toast. The method creates a thread that performs the same as in the previous\
    \ example, in which its iteration performs a Toast followed by a wait(). However,\
    \ there is a small problem. The message is sent from a secondary thread, and although\
    \ it is only a Toast, the thread must still update the user interface. It requires\
    \ a Handler and is performed in the method sendMessage(). A Handler is linked\
    \ to a message looper, and since a thread does not have a message loop, the method\
    \ getMainLooper() is used. The Handler object will then use the method post()\
    \ to insert a Runnable object that performs the desired Toast."
