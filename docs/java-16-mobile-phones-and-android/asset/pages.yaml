    # 7 THREADS


    Android is a multi-threaded operating system, so you can use threads almost the
    same way you know it from PC. Once an application is started, the runtime system
    will create a primary thread, and all the application components as defaulted
    be running in this thread. The primary thread''s main task is to handle the user
    interface, including processing events, but the thread can perform any other operation,
    which is the default. Like what you know from PC, the primary thread can start
    a secondary thread, and there are many good reasons for which the same as you
    know from earlier, but there are also the same challenges that a secondary thread
    directly updates the user interface, so the program will stop with an exception.
    If you use threads, you need a little more, and the purpose of this is to show
    what is needed.


    I will use an example that I have used earlier, which is an application that opens
    the following window:


    ![](img/445fbacc7c533ed1c3ccdac9a690c143_140_0.png)


