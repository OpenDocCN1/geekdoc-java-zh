    number. Also note that there are the two SQL expressions that create the database
    tables.


    The class imports SQLiteHelper, and the constructor in the base class checks,
    if there is a database with name. If not, it will perform onCreate(). If the database
    is found, the version number is tested and is larger than the database version
    method onUpgrade() is performed. If the version smaller than the database version
    method onDowgrade() is performed. A SQLiteHelper class should therefore override
    these three methods— however, in many cases you do not override the last one (the
    version number will be higher).


    In this case, onCreate() creates the two tables. Note that it is the constructor
    in the base class that creates the database, while onCreate() creates the tables.
    onCreate() calls the method insertZipcodes(). It uses a StringBuilder to dynamically
    create a SQL INSERT using the resource with the zip codes, and the methods return
    the result as a string. onCreate() has a parameter of type SQLiteDatabase and
    with methods, such as header execSQL(), performs a SQL statement. The method is
    used to create the two tables and can generally be used to execute a SQL statement
    represented as a string and also the result of insertZipcodes().


    The program also provides the other two methods from the base class: onUpgrade()
    and onDowngrade(). Both are trivial as the code has been commented out, meaning
    that you have to insert the code to use if the version number is increased (until
    you define the final version). When you develop a program, you will typically
    be interested in creating the database each time you run the program. This is
    enforced by increasing the version number, and then adding the code to onUpgrade()
    create them. That is the goal of your random generator every time the program
    runs, it gets a random version number (the constructor) and the result is that
    each onUpgrade or onDownload() is performed. You may, remember to remove this
    action before applying the application, otherwise delete the database every time
