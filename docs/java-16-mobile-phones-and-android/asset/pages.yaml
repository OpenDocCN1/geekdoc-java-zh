    In the following I will briefly mention what has happened. In the ConstraintLayout,
    I have defined a background color, and in the RelativeLayout I have defined a
    margin of 20. It does not matter how the individual widgets are placed, but are
    overall settings that are independent of the current layout manager.


    For the first TextView view I changed the name to lblHead1, and then I have defined
    a margin of 10 below the component. I have also changed the text (the text to
    be displayed on the screen) and I have defined a font size.


    The next TextView view I have called the lblDist, and then I have with android:layout_below
    defined that the component should be lblHead1. This is where the relative layout
    comes in, with android:layout_alignBaseline, I have defined the text to be displayed
    on the same baseline as for the following component, which is the input field,
    and the goal to get the two widgets aligned vertically to each other. Here you
    should especially note that in XML is to refer to a widget (txtDist) that is not
    yet defined. The next widget is defined and in addition to the name changed to
    txtDist, note that android:layout_width has changed to fill_parent which means
    that the component (here a Relative) has set aside, I need to use the rest of
    the window width. In addition, three attributes are defined where android:layout_ToEnd;
    the component should be located to the right of the TextField component and with
    android:layout_below it should sit under the header text and finally with android:layout_marginLeft
    that there is some space between the input field and the text


    The next widget is a RadioGroup. There is not much to explain here, but I have
    given it a name and defined that it should be below the input field and that there
    must be a margin of 10 to the input field. For the two RadioButton widgets which
    are also not much to notice except I have changed the names and indicate that
    the first one must be checked. Also note the attribute android:layout_weight.
    It is actually necessary but inserted by Android Studio and means that the entire
    height is to be used, but in other contexts it is important.


    Next, follows the two (top) buttons, and compared to what has already been explained,
    there is nothing new, but you should note that for both buttons are event handlers.


    The rest of the XML code is, in principle, just a repeat of the above, and the
    result of all is that the individual widgets are nicely adjusted to each other.
    The procedure may sound a little bit comprehensive, and it is, but with a little
    practice it is actually quite safe and also relatively effective way to design
    a complex window. The actual window is actually relative to mobile phones complex
    and should rarely be more complex.'
