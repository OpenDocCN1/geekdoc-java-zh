    \    public static final int ACOLNO_CODE = 4;\n    public static final int ACOLNO_PHONE\
    \ = 5;\n    public static final int ACOLNO_MAIL = 6;\n    public static final\
    \ int ACOLNO_DATE = 7;\n    public static final int ACOLNO_TITLE = 8;\n    public\
    \ static final String[] ATABLEN_COLUMNS = new String[] {\"id\",\"firstname\",\"\
    lastname\",\"address\",\"code\",\"phone\",\"mail\",\"date\",\"title\"};\n    private\
    \ static final String DBFILENAME=\"phonebook.db\";\n    private static final int\
    \ DBVERSION = 1;\n    private static final String ZINITIAL_SCHEMA = \"create table\
