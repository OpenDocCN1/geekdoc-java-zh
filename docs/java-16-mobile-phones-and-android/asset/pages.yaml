  md: '# JAVA 16: MOBIL PHONES AND ANDROID: SOFTWARE DEVELOPMENT


    When files are created internally, they are stored in the phone''s memory which
    in this context is called internal storage. It has pros and cons where I can mention:


    +   - Internal storage is something that always are and part of any Android device,
    but it''s limited in size and significantly less than what, an SD card makes available
    and there''s not a insignificant risk that applications often saves files in internal
    storage, so that it will be filled up.

    - Basically, files stored in internal storage are associated with an application
    and can only be used immediately by this application. Should the file be used
    by other applications, special efforts are required, and in fact, it is not at
    all the intention to share information between applications using internal files.

    - Files stored in internal storage are perceived as part of the application they
    are associated with, and if you delete the application, you also deletes its internal
    files.


    Internal files are thus primarily suitable for storing smaller amounts of data
    that must be available for a program the next time it starts up, but there is
    also a need for in many examples, so the conclusion is not to avoid using internal
    files, but just think about what they are for.


    As mentioned, internal files are associated with an application, and the application
    generally has unlimited access to a file and can both read and write the file
    – the application simply owns the file.


    When you open a file, you can specify the following modes:


    +   - MODE_PRIVATE, that is default and only the application that creates the
    file is allowed to access the file

    - MODE_APPEND


    In the following, I will look at an example that shows how to use a file.


