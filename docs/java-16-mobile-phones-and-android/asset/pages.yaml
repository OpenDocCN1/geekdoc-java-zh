  md: 'JAVA 16: MOBIL PHONES AND ANDROID SOFTWARE DEVELOPMENT SERVICES


    # 8 SERVICES


    A service is a component that is performed in the background without direct interaction
    with the user, and a service has no user interface. Services are used to perform
    special operations and often operations that take a long time. For example, it
    could be downloading a file from the Internet, testing for new data, and more.
    A service is performed with higher priority than activities, and there is therefore
    less chance that a service will be interrupted by Android if there is insufficient
    resources available. However, it is possible to provide a service with the same
    priority as foreground activities, and if so, it is necessary to have a visible
    indication that tells the service is active, something that is used by video and
    music players.


    There are two main types of services:


    +   1. A service is started when an application (an activity) starts by calling
    the service(). Once started, a service can run in the background indefinitely,
    even if the application that started the service is destroyed. Usually, a started
    service performs a single operation (as download or upload a file over the network)
    and does not return a result to the caller. When the operation is done, the service
    should stop itself.


    ![](img/445fbacc7c533ed1c3ccdac9a690c143_148_0.png)'
