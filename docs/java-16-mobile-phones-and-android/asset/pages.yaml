  md: '# JAVA 16: MOBILE PHONES AND ANDROIDnSOFTWARE DEVELOPMENT LAYOUT


    The inner LinearLayout contains three buttons with the texts A, B and C respectively,
    the result is that they are laid out horizontally. For each button, a margin is
    defined that indicates how much space should be outside of the button. A padding
    is also defined, and it specifies how the distance should be from the text to
    the edges of the component (if it is a component with a frame). For all three
    buttons, android:layout_weight are 1, which indicates that they have to share
    the space equally and thus get the same width.


    The outer LinearLayout has, in addition to the LinearLayout element above, three
    buttons, which are vertically laid out below the layout with the buttons A, B
    and C. The three lower buttons D, E and F have the weights 2, 1 and 3. This mean
    that they share the vertical space in the ratios 2/6, 1/6 and 3/6. With respect
    to the width of the components, note that for D, the width is determined of the
    content, while for E an absolute width is given. For F, it is the width of the
    parent and thus the width of the window. You should also note the attribute android:layout_gravity,
    which indicates alignment.


    Previously, LinearLayout was a very used layout manager, and it still makes sense
    in situations where a very simple layout is needed.


