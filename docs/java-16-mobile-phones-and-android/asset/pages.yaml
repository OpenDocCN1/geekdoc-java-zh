    \ copy the database to the application as a resource, but it can easily lead to\
    \ difficulties if the database has to be updated. For that reason, there is a\
    \ helper class that makes it easy to create the database in the code and ensures\
    \ that the database is automatically created the first time the application is\
    \ used, but also ensures that the database is updated if you change it — assuming\
    \ that you have added the required code. In the present case, I have added the\
    \ following class:\n\n```\npackage dk.data.torus.phonebook;\n\nimport android.content.Context;\n\
    import android.database.sqlite.SQLiteDatabase;\nimport android.database.sqlite.SQLiteOpenHelper;\n\
    import java.io.*;\n\npublic class DbHelper extends SQLiteOpenHelper {\n    public\
    \ static final java.util.Random rand = new java.util.Random();\n    public static\
    \ final String TABLE_NAME=\"zipcodes\";\n    public static final int ZCOLNO_CODE\
    \ = 0;\n    public static final int ZCOLNO_CITY = 1;\n    public static final\
    \ String[] ZCOLNO_COLUMNS = new String[] {\"code\",\"city\"};\n    public static\
    \ final String TABLE_NAME=\"addresses\";\n    public static final int ACOLNO_ID\
    \ = 0;\n    public static final int ACOLNO_FIRSTNAME = 1;\n    public static final\
