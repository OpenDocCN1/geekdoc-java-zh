  md: "# 8.6 SERVICEAPP\n\nThe next example shows a remote service, and it's just\
    \ a simple example, but more in the next book. The application opens a window\
    \ with two buttons. Clicking on the top button, the background color of the window\
    \ is changed and clicking on the bottom button sends a message (the current date\
    \ and time) to a remote service, which after 5 seconds shows a Toast with the\
    \ message. The meaning with the 5-second delay and the color change button are\
    \ you find the service does not block the application as it is performed in another\
    \ process, than the application. The service is quite simple:\n\n```\npackage\
    \ dk.data.torus.serviceapp5;\n\nimport android.app.Service;\nimport android.content.Intent;\n\
    import android.os.*;\nimport android.widget.Toast;\nimport android.os.Messenger;\n\
    import android.os.Handler;\n\npublic class TheService extends Service {\n    private\
    \ final Messenger theMessenger = new Messenger(new Handler());\n\n    class TheHandler\
    \ extends Handler {\n        @Override\n        public void handleMessage(Message\
    \ msg) {\n            Bundle data = msg.getData();\n            synchronized (this)\
    \ {\n                try {\n                    wait(5000);\n                }\
    \ catch (Exception e) {}\n            }\n            Toast.makeText(getContext(),\
    \ data.getString(\"message\"), Toast.LENGTH_LONG).show();\n        }\n    }\n\n\
    \    @Override\n    public IBinder onBind(Intent intent) {\n        return theMessenger.getBinder();\n\
    \    }\n}\n```\n\nThe class inherits Service as the other examples. It defines\
    \ an inner class that inherits Handler, and it overrides the method handleMessage().\
    \ The method's parameter has the type Message and represents the message that\
    \ a client sends. It is wrapped in a Bundle object."
