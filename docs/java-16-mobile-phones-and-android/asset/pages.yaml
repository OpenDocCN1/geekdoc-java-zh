    # 3.6 CONTAINERS


    Android also offers components that can display a family of objects. There are
    widgets called containers, and although layout managers are not directly containers,
    they have something to do with layout. In fact, I have already shown an example
    in the application Zipcodes, which used a ListView, which is a container that
    can display a number of objects. If the container more objects than there is room
    for the screen, you can scroll the content, and you can also associate an event
    handler with the container that fires each time you select an object. In principle,
    the different containers are used in the same way and use a data source with the
    current objects, the container itself, such as a ListView and then an adapter
    that has the task to update the container. I will start with a program that shows
    an overview of Danish kings:'
