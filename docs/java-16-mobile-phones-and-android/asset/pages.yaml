  md: 'JAVA 16: MOBIL AND ANDROID:

    SOFTWARE DEVELOPMENT


    APPENDIX A, INSTALLING OF ANDROID STUDIO


    To write Android applications you need two things:


    +   1. Android SDK can best be characterized as a number of libraries that contains
    all the components that an Android application may need.

    2. Android Tools, which are a number of tools used in the development of apps,
    including the emulator and more.


    When Android came on the market, the most widely used development environment
    Eclipse combined with the above two products, and it has since been a stable and
    efficient development platform. When I mention Eclipse here, also because the
    product is worth acquiring completely other reasons, as it is generally an effective
    tool for developing a Java application, and it''s in every way an alternative
    to NetBeans, and many prefer Eclipse rather than NetBeans. There may be long discussions
    about and will be-which of the two products is the best and in fact it is probably
    the product that for the user is the best known and has the most experience with.
    In these books I have used NetBeans everywhere, but it is good to know there is
    something called Eclipse and you can easily end up in a development organization
    using this tool, especially if the tasks relate to the development of apps for
    mobile phones or other mobile devices.


    The two products Android SDK and Android Tools come from Google, as with these
    products, Google has also developed an IDE for the development of Android applications.
    It has been quite a time underway, but today it has reached a stage where it is
    quite user-friendly and efficient tool. That''s the reason why I''ll use this
    everywhere, a tool which Google calls Android Studio.


    In principle, it is quite simple to install Android Studio, as it is all packed
    into a single package that can be downloaded and installed instantly, whereas
    Linux requires a little more. In the following, I will outline what I have done
    to set up a development environment on a Fedora machine, and it''s actually not
    easy to write a precise guide, partly because updates and changes are constantly
    being added and partly because the commands depend a little of the current Linux
    distribution. Fortunately, there are many guides online, and the best thing to
    do is follow these instructions, if it is manuals of recent date. The following
    are therefore primarily references to good guidelines.


    In order for you to develop Android applications in practice, you will need to
    have installed virtualization software, supported by a hardware accelerator, as
    the emulator runs intolerably slow. You can see how at the following addresses
    (for Fedora and Ubuntu, respectively):


    ```

    https://fedaproject.org/wiki/Getting_started_with_virtualization

    ```


