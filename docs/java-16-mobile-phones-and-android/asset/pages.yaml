    # 4.4 ABOUT ACTIVITIES


    I want to conclude this chapter by looking a little closer to the class Activity,
    and as shown in the previous examples, each mobile app has an Activity object.
    One might think of an Activity as an object that represents the program’s window
    and implements the logic that the application uses, and a program may therefore
    have more activities. An activity can be in four modes


    +   - Launched, when an activity comes in existence, usually as the result of
    a user performing some action to starts the application.

    - Running at which the users actually start your activity, after all of the various
    steps are performed.

    - Killed, that is a state in which the Android OS has determined to terminate
    the application.

    - Shut down at which all persistent state information is deleted.


    Changes are made on the basis of callback methods, where onCreate() is an example,
    but there are some others, and it’s all methods that you can override. In the
    following, I will mention the main callback methods.'
