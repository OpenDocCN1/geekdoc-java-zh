    # 3.5 A CONSTRAINTLAYOUT


    As the last layout manager, I would like to mention ConstraintLayout, which is
    the layout manager Android Studio defines as default for an activity. In principle,
    it works a bit like RelativeLayout, but it is more flexible and the goal is that
    you can design a complex layout using the mouse and in the Android Studio'' layout
    editor. That is, you can drag widgets from the toolbox and drag it into the places
    with the mouse. You can create the finished design without having to write XML
    yourself.


    To define the position of a view component, it must have at least one horizontal
    and at least one vertical constraint, each constraint being an attachment or an
    alignment to either view or parent layout. Each constraint defines a position
    either a horizontal or vertical axis, and there will be more constraints for each
    axis.


    If you draw a view in the layout editor, it has no constraints, but it sits where
    it is dropped. There are probably some attributes, and an example could be:


    ```

    <Button

    android:id="@id/button"

    android:layout_width="wrap_content"

    android:layout_height="wrap_content"

    android:text="Button"

    tools:layout_editor_absoluteX="148dp"

    tools:layout_editor_absoluteY="167dp" />

    ```


    where the two attributes tell you where the component is in the layout editor,
    but if you run the program, you will find that the button is located in the upper
    left corner, and the two attributes therefore do not matter to the finished program.


    Below is the XML code after I have also added an EditText widget and then I have
    drawn both views to those positions I think they should be:'
