    \ that the class implements the interface ServiceConnection. This interface defines\
    \ the first being called onConnected() and is executed after the program has connected\
    \ to the service. The other is called onDisconnected() and executed if the program\
    \ has been disconnected from the service. In this case, the program binds to the\
    \ service in the event handler onConnect(), and if the program is not already\
    \ bound, an Intent object is created for the current class (program) and service\
    \ class. Then, the program binds using the method bindService(), and note the\
    \ last parameter telling the service should be created if it is not already. After\
    \ bindService() is performed, Android calls the method onConnected(), and its\
    \ last parameter is IBinder and a reference to the service and the return value\
    \ of the service's onBind() method. This value is used to reference the service's\
    \ getService() method, so the program has a reference to service's methods, which\
    \ can be used in the two event handlers for the top buttons.\n\nYou should note\
    \ that a local service such as the above can be perceived as part of the program\
    \ and the current service is not typical as both service methods are trivial.\
    \ Typically, a program needs to have performed a work that takes time, and the\
    \ program starts a service that performs the work in a secondary thread."
