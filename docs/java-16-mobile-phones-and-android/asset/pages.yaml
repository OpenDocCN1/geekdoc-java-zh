    # USER INTERACTION


    ![](img/445fbacc7c533ed1c3ccdac9a690c143_91_0.png)


    onPause() is executed after an application is switched to the background state
    after Android has suspended the application. Viewed from the programmer, the method
    can be used to ensure data is saved when the application is suspended.


    onStop() sends the activity in background, and you can think of the method as
    the opposite of onStart() and the activity is no longer visible to the user, the
    view and properties still exist and are transferred to onResume() and onStart()
    if they are performed. Note that onStop() is not necessarily performed, if the
    Android decides to terminate the application, and it is therefore rare to override
    this method.


    onRestart() is executed at a state shift from stopped to start, allowing to some
    extend decide how to restart the activity.


    onDestroy() is performed when an activity is closed, but note that it concerns
    an activity and not the entire application. The method can only be used for a
    cleanup that relates to the current activity.


