    requested the activity or the activity is restarted due to changes in the environment,
    for

    example due to a rotation of the device. It is for that onCreate() has a parameter

    type Bundle, that can contain information about the state of the activity. Basically,

    onCreate() is used for:


    +   1. Load the layouts that the activity uses so components in the user interface
    can

    be constructed in the method onStart().

    2. Initialize the activity''s instance variables.


    There are some tasks that relate to onCreate() and primarily concerns restart
    of the activity,

    keeping track of existing global resources from the last time the activity was
    active.

    For example, if you programmatically change the layout depending on an user interaction

    of the application.


    onStart(), that is executed after onCreate() has created the required objects
    from the layout

    definitions and performed other initialization work, it is onStart() which is
    tasked with

    npresenting the current UI elements for the user. There is seldom the need to
    override this

    method. And if you do, it is important to call super.onStart().


    onResume() is executed immediately before the user interface becomes visible and
