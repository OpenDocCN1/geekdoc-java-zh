    The class Intent has not alone to do with services, and I have already used the
    class many times without mentioning what it is for. The class plays a crucial
    role in services, and I will briefly mention it here.


    The class primarily applies to activities, services and broadcast receivers. These
    components are created using messages called intents, which are a form of binding
    of components, so it always happens in the same way. An Intent object is a data
    structure that contains an abstract description of an operation to be performed
    or a description of something that has happened and to be advertised. There are
    several mechanisms to send intents to different types of components:


    +   An Intent object can be passed to Context.startActivity() or Activity.startForResult()
    to launch an activity or getting an activity to do something new. It can also
    be passed to Activity.setResult() to return information from the activity that
    has been performed with startActivityForResult().'
