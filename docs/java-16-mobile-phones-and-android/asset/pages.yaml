  md: '# JAVA 16: MOBIL PHONES AND ANDROID A FINAL EXAMPLE


    # The AppointmentService


    In fact, another feature still lacks, that warning the user if it is time for
    an appointment. The function is implemented as a service that starts when the
    program is started (if it is not already running). The service tests for appointments
    every second minute:


    +   1. If an appointment occurs within 5 minutes, the service sends a Toast.

    2. If an appointment occurs within 15 minutes, the service sends a Toast.

    3. If an appointment occurs within 1 hour, the service sends a Toast.


    If the time for an appointment has passed, the following occurs:


    +   1. The service in question is deleted in the database.

    2. The phone rings for 2 seconds.

    3. The service opens the Calendar''s MainActivity (if it is not already).

    4. The service will insert a notification in the window''s actor bar.


    Appointments have a feature Save, which indicates that an appointment should not
    be deleted (a feature inherited from the PC version of the program). This feature
    does not really sense, and as it complicates the current service, the option is
    removed. The database has not been changed, and the only thing that has happened
    is that in the activity AppointmentActivity, a CheckBox has been removed.


    For the purpose of notifications from the service, the program''s options menu
    is expanded with a function that you can delete all notifications in the action
    bar.


    The service starts when the application starts, if it is not already running.


    Then there is the implementation of the service itself, which is not quite simple,
    and which used to send notifications to the client, something that I have not
    mentioned. The service starts with a thread that performs the work, and the code
    for this thread (at least algorithm) is retrieved from the PC program. What complicates
    the service is that the thread must communicate with the program in the form of
    Toast messages or notifications to the status bar. It is therefore necessary to
    create Handler objects for the communication. Finally, there is the code that
    sends notifications, which is quite complex and difficult to figure out. If you
    not only want to take it as it, studying the online documentation best describes
    the meaning of it all.'
