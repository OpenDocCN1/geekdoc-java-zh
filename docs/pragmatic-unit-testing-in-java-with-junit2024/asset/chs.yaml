  \n[[17]](#f_0051.xhtml_FNPTR-17)\n\n[`jqwik.net`](https://jqwik.net)\n\nCopyright\
  \ © 2024, Pragmatic Books.\n\n# 第二部分：精通 JUnit\n\n> 断言（Assertions）是你通过 JUnit 的主要功能完成单元测试的需求。在接下来的章节中，我们将深入探讨\
  \ JUnit 的三个“E”：检查断言结果、组织测试以及执行测试。\n\n# 第 5 章：检查断言结果\n\n断言（或 asserts）是 JUnit 测试中的静态方法调用。如果断言不成立，测试将停止并抛出\
  \ `AssertionFailedError` 异常。为了使用最合适的断言，你将首先深入研究这两个流行的形式：`assertTrue` 和 `assertEquals`。随后，我们将探索\
  \ JUnit 提供的多种断言选项。我们还将概述 `AssertJ`，这是一个第三方断言库，允许你编写“流式”断言。此类断言可以让你的测试变得更加易读，并提供更精确的解释。\n\
  \n## 使用核心断言\n\n你大部分的断言将使用 `assertTrue` 或 `assertEquals`。让我们回顾并完善对这两个工具的知识。让我们看看如何通过消除杂来保持测试简洁。\n\
  \n### 最基础的断言：assertTrue\n\n最基础的断言接受一个布尔表达式或引用作为参数，如果该参数为假，则测试失败。\n\n```\norg.junit.jupiter.api.Assertions.assertTrue(someBooleanExpression);\n\
  ```\n\n这是一个使用 `assertTrue` 的示例：\n\n```java\n// utj3-junit/01/src/test/java/scratch/Account.java\n\
  \n@Test\nvoid hasPositiveBalanceAfterInitialDeposit() {\n    var account = new Account(\"\
  account name\");\n\n    account.deposit(50);\n\n    Assertions.assertTrue(account.hasPositiveBalance());\n\
  }\n\n// ...\n```\n\n### 消除杂质\n\n作为你将反复阅读和重读的文档，你希望简化你的测试。你在第一章中（参见第一章：构建你的第一个 JUnit\
  \ 测试）已经了解到，在声明 JUnit 测试类和测试方法时，`public` 关键字是不需要的。额外的关键字和其他不必要的元素就是杂质。\n\n![images/aside-icons/tip.png](img/tip.png)\n\
  通过消除不必要的杂质来简化你的测试。\n\n\n\n\n```java\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n\
  ```\n\n结果是一个去冗余、更简洁的断言语句：\n\n[utj3-junit/01/src/test/java/scratch/AnAccount.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/AnAccount.java)\n\
  \n```java\n@Test\nvoid hasPositiveBalanceAfterInitialDeposit() {\n    var account\
  \ = new Account(\"an account name\");\n\n    account.deposit(50);\n\n    assertTrue(account.hasPositiveBalance());\n\
  }\n```\n\n### 泛化断言\n\n这是另一个 `assertTrue` 的示例，它解释了结果与预期结果之间的关系：\n\n[utj3-junit/01/src/test/java/scratch/AnAccount.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/AnAccount.java)\n\
  \n```java\n@Test\nvoid depositIncreasesBalance() {\n    var account = new Account(\"\
  an account name\");\n    var initialBalance = account.getBalance();\n\n    account.deposit(100);\n\
  \n    assertTrue(account.getBalance() > initialBalance);\n}\n```\n\n测试名称——`depositIncreasesBalance`——是对你希望测试演示的行为的通用性陈述。它的断言——`assertTrue(balance\
  \ > initialBalance)`——对应于测试名称，确保了余额作为存款操作的结果而增加了。该测试没有显式地验证余额增加了多少。因此，你可能将其断言语句描述为泛化断言。\n\
  \n### 消除更多冗余\n\n前面的示例依赖于已初始化的 `Account` 实例的存在。你可以在 `@BeforeEach` 方法中创建 `Account`（更多信息请参阅\
  \ 使用 @BeforeEach 和 @BeforeAll 初始化），并将其引用作为字段存储在测试类中：\n\n[utj3-junit/02/src/test/java/scratch/AnAccount.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/02/src/test/java/scratch/AnAccount.java)\n\
  \n```java\nclass AnAccount {\n    Account account;\n\n    @BeforeEach\n    void\
  \ createAccount() {\n        account = new Account(\"an account name\");\n    }\n\
  \n    @Test\n    void hasPositiveBalanceAfterInitialDeposit() {\n        account.deposit(50);\n\
  \n        assertTrue(account.hasPositiveBalance());\n    }\n\n    // ...\n}\n```\n\
  \nJUnit 为每个测试创建一个测试类的新实例（进一步解释请参阅 观察 JUnit 周期）。这意味着你也可以安全地在字段的声明处初始化字段：\n\n[utj3-junit/03/src/test/java/scratch/AnAccount.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/03/src/test/java/scratch/AnAccount.java)\n\
  \n```java\nclass AnAccount {\n    Account account = new Account(\"an account name\"\
  );\n\n    @Test\n    void hasPositiveBalanceAfterInitialDeposit() {\n        //\
  \ ...\n    }\n\n    // ...\n}\n```\n\n### 使用 assertEquals 进行显式比较\n\n你的测试名称应该是行为的泛化，但每个测试都应该呈现一个具有特定结果的具体示例。如果测试进行了存款，你知道新的余额金额应该是多少。在大多数情况下，你应该对断言是显式的，并验证新的实际余额。\n\
  \n断言 `assertEquals` 将预期答案与实际答案比较，允许你显式地验证结果的值。它是重载的，因此你可以恰当地比较所有原始类型、包装类型和对象引用。（要比较两个数组，请使用\
  \ `assertArrayEquals`。）你的大多数断言可能应该是 `assertEquals`。\n\n这里是存款存款示例，通过余额增加的金额进行断言：\n\
  \n[utj3-junit/01/src/test/java/scratch/AnAccount.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/AnAccount.java)\n\
  \n```java\n@Test\nvoid depositIncreasesBalance() {\n    account.deposit(50);\n \
  \   account.deposit(100);\n\n    var balance = account.getBalance();\n\n    assertEquals(150,\
  \ balance);\n}\n```\n\n\n\n\n没有人都不喜欢双重否定（或者三重否定，我的编辑是这么认为的）。为了帮助你在测试中能够能够“直截了当”地表达观点，JUnit\
  \ 提供了一些反向断言。这里是 `assertFalse`——`assertTrue` 的反面——的用法示例：\n\n[utj3-junit/01/src/test/java/scratch/AnAccount.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/AnAccount.java)\n\
  \n```java\n@Test\nvoid doesNotHavePositiveBalanceWhenAccountCreated() {\n    assertFalse(account.hasPositiveBalance());\n\
  }\n```\n\n如果你心情反常，可以使用 `assertTrue` 编写等效的代码：\n\n[utj3-junit/01/src/test/java/scratch/AnAccount.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/AnAccount.java)\n\
  \n```java\n@Test\nvoid doesNotHavePositiveBalanceWhenAccountCreated() {\n    assertTrue(!account.hasPositiveBalance());\n\
  }\n```\n\n换句话说，它读起来很别扭：“断言真……不是账户有正余额”，这代表了那种让我们许多人感到困惑的逻辑。在你的测试中避免双重否定。当 `assertFalse`\
  \ 比 `assertTrue` 更易读时，请使用 `assertFalse`。\n\n### assertNotEquals\n\n适当使用 `assertNotEquals`\
  \ 的要少得多。如果你知道答案应该是什么，请使用 `assertEquals` 来表达。否则，使用 `assertNotEquals` 可能代表在进行一种你所谓的“弱断言”——一种不能完全验证结果的断言。\n\
  \n使用 `assertNotEquals` 的一些合理情况：\n\n*   你真的无法知道答案应该是什么。\n*   你已经解释了（可能在另一个测试中）实际答案可能是什么，而通过这个测试，你想强调它不可能是某些其他指定值。\n\
  *   要显式地对实际结果进行断言需要过多的数据细节。\n\n让我们来看一个例子。对于任何牌类游戏（例如扑克牌），在发任何牌之前，你必须洗牌。这里是 `Deck`\
  \ 类的初始实现，显示了洗牌是在构造函数中发生的：\n\n[utj3-junit/01/src/main/java/cards/Deck.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/main/java/cards/Deck.java)\n\
  \n```java\npublic class Deck {\n    private LinkedList<Card> cards;\n\n    Deck()\
  \ {\n        cards = newDeck();\n        Collections.shuffle(cards);\n    }\n\n\
  \    static LinkedList<Card> newDeck() {\n        var cards = new LinkedList<Card>();\n\
  \        for (var i = 1; i <= 13; i++) {\n            cards.add(new Card(i, \"C\"\
  ));\n            cards.add(new Card(i, \"D\"));\n            cards.add(new Card(i,\
  \ \"H\"));\n            cards.add(new Card(i, \"S\"));\n        }\n        return\
  \ cards;\n    }\n\n    public Card deal() {\n        return cards.removeFirst();\n\
  \    }\n\n    List<Card> remaining() {\n        return cards;\n    }\n}\n```\n\n\
  你想要验证洗牌确实发生了：\n\n[utj3-junit/01/src/test/java/cards/ADeck.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/cards/ADeck.java)\n\
  \n```java\npublic class ADeck {\n    Deck deck = new Deck();\n\n    // ... 其他的 Deck\
  \ 测试 ...\n\n    @Test\n    void hasBeenShuffled() {\n        var cards = deck.remaining();\n\
  \        assertNotEquals(Deck.newDeck(), cards);\n    }\n}\n```\n\n你可能会在想：“嘿，那看起来像是个弱断言！”在某种意义上确实如此——你不知道牌是否真的洗过。但那不是\
  \ `Deck` 类的职责。`Deck` 类是调用洗牌而不是实现它，它使用了 Java API 中的方法。你可以信任 `Collections.shuffle()`\
  \ 会适当地打乱顺序，尽管如果你在赌场，你可能需要一个更好的洗牌器。\n\n既然你可以信任 Java API，你就不需要证明它的质量。但你的单元测试确实需要验证牌是否真的被洗过。你可以通过几种相当复杂的方式来实现，例如使用测试双（test\
  \ doubles）或注入带种子的随机生成器来用于洗牌。\n\n确保实例化的 `Deck` 中的牌牌顺序与 `Deck.newDeck()` 返回的牌不等是足够且简单的。它证明了发生了某些操作。注意，这种弱断言也有极小的概率失败，即洗牌后恰好回到了牌的初始顺序。在你的一生中极不可能发生。在那个偶然的时刻再次运行测试吧。\n\
  \n是的，有人可以用糟糕的代码替换 `Collections.shuffle()` 的调用——例如，将一张牌从前面移动到后面的代码。但不用担心——单元测试的存在是为了保护你免受破坏性行为的影响。坚定的破坏者可以在不破坏任何测试的情况下破坏你的系统。除非你别无选择或它们强调了你真正想要测试表达的内容，否则请避免像\
  \ `assertNotEquals` 这样的弱断言。\n\n### assertSame\n\n`assertSame` 同样不常用，它验证两个引用指向内存中的同一个对象。\n\
  \n你的挑战是：在可能需要数百万个 `Time` 对象的调度中减少内存占用。这个示例基于“设计模式：享用模式”。大部分这些时间会在刻点（1:15, 4:30,\
  \ 10:15），因为我们喜欢这样安排。有些时间会在奇数分钟如 3:10 或 4:20，因为人们会在这些时间做事。\n\n享用模式的想法是有一个单一的对象池，允许多个部分共享相同值的对象。这对于不可变对象非常有效，否则则不佳。你的应用程序可以显著减少内存占用。\n\
  \n这里是两个生产类：\n\n[utj3-junit/01/src/main/java/time/Time.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/main/java/time/Time.java)\n\
  \n```java\nimport static java.lang.String.format;\n\npublic record Time(byte hour,\
  \ byte minute) {\n    static String key(byte hour, byte minute) {\n        return\
  \ format(\"%d:%d\", hour, minute);\n    }\n\n    @Override\n    public String toString()\
  \ {\n        return key(hour, minute);\n    }\n}\n```\n\n[utj3-junit/01/src/main/java/time/TimePool.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/main/java/time/TimePool.java)\n\
  \n```java\nimport java.util.HashMap;\nimport java.util.Map;\n\npublic class TimePool\
  \ {\n    private static Map<String, Time> times = new HashMap<>();\n\n    static\
  \ void reset() {\n        times.clear();\n    }\n\n    public static Time get(byte\
  \ hour, byte minute) {\n        return times.computeIfAbsent(Time.key(hour, minute),\n\
  \            k -> new Time(hour, minute));\n    }\n}\n```\n\n这里有两个测试：\n\n[utj3-junit/01/src/test/java/time/ATimePool.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/time/ATimePool.java)\n\
  \n```java\npublic class ATimePool {\n    @BeforeEach\n    void resetPool() {\n \
  \       TimePool.reset();\n    }\n}\n```\n\n\n\n\n```java\n@Test\nvoid getReturnsTimeInstance()\
  \ {\n    byte four = 4;\n    byte twenty = 20;\n    assertEquals(new Time(four,\
  \ twenty), TimePool.get(four, twenty));\n}\n\n@Test\nvoid getWithSameValuesReturnsSharedInstance()\
  \ {\n    byte ten = 10;\n    byte five = 5;\n    var firstRetrieved = TimePool.get(ten,\
  \ five);\n    var secondRetrieved = TimePool.get(ten, five);\n    assertSame(firstRetrieved,\
  \ secondRetrieved);\n}\n```\n\n第二个测试中的高亮行演示了 `assertSame` 的用法。安排（arrange）步骤调用了 `TimePool`\
  \ 上的 `get` 方法来获取第一个 `Time` 对象，然后在执行（act）步骤中再次调用了相同的方法。断言（assert）步骤验证了这两个 `Time`\
  \ 对象是同一个同一个实例。\n\n### assertNotSame\n\n`assertNotSame` 验证两个引用是否指向内存中不同的对象。\n\n你可能会使用\
  \ `assertNotSame` 来验证一个“持久化”在内存中的对象（例如在哈希表中）与存储的实例是不同的实例。否则，对“存活”对象的修改也会改变持久化的对象。这里是一些演示性的代码：\n\
  \n[utj3-junit/01/src/test/java/persistence/AnInMemoryDatabase.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/persistence/AnInMemoryDatabase.java)\n\
  \n```java\npackage persistence;\n\nimport org.junit.jupiter.api.Test;\nimport static\
  \ org.junit.jupiter.api.Assertions.*;\n\nclass AnInMemoryDatabase {\n    @Test\n\
  \    void objectCopiedWhenAddedToDatabase() {\n        var db = new InMemoryDatabase();\n\
  \        var customer = new Customer(\"1\", \"Smelt, Inc.\");\n        db.add(customer);\n\
  \        var retrieved = db.data.get(\"1\");\n        assertNotSame(retrieved, customer);\n\
  \    }\n}\n```\n\n该测试创建了一个 `InMemoryDatabase` 并通过数据库的 `add` 方法添加了一个客户。\n\n[utj3-junit/01/src/main/java/persistence/InMemoryDatabase.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/main/java/persistence/InMemoryDatabase.java)\n\
  \n```java\nimport java.util.HashMap;\nimport java.util.Map;\n\npublic class InMemoryDatabase\
  \ {\n    Map<String, Customer> data = new HashMap<>();\n\n    public void add(Customer\
  \ customer) {\n        data.put(customer.id(), new Customer(customer));\n    }\n\
  }\n```\n\n在生产代码的 `add` 方法中，高亮行展示了对 `Customer` 记录拷贝构造函数的使用，以确保向名为 `data` 的 `HashMap`\
  \ 中添加了一个新实例。\n\n如果不进行拷贝——而是使用此行作为 `add` 方法的实现：\n\n[utj3-junit/01/src/main/java/persistence/InMemoryDatabase.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/main/java/persistence/InMemoryDatabase.java)\n\
  \n```java\ndata.put(customer.id(), customer);\n```\n\n…测试将会失败。\n\n理解单元测试的一种方式是，它们为那些重要但并不显而易见的细节提供了保护以及相应的解释，例如本例中需要创建拷贝的操作。\n\
  \n![images/aside-icons/tip.png](img/tip.png) 单元测试不仅提供保护，还描述了成千上万种选择。\n\n### assertNull\n\
  \n`assertNull` 等同于 `assertEquals(null, someValue)`。\n\n`InMemoryDatabase` 类需要一种公开的方式让客户端根据\
  \ id 获取客户。以下是 `get` 方法的实现：\n\n[utj3-junit/01/src/test/java/persistence/AnInMemoryDatabase.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/persistence/AnInMemoryDatabase.java)\n\
  \n```java\npublic class InMemoryDatabase {\n    Map<String, Customer> data = new\
  \ HashMap<>();\n    // ...\n    public Customer get(String id) {\n        return\
  \ data.getOrDefault(id, null);\n    }\n}\n```\n\n覆盖该方法需要多少个测试？`getOrDefault` 中的“Or”（或）字是一个强力提示，说明你至少需要两个。在列表中，第一个测试是“正快路径”，即成功获取了\
  \ `Customer`：\n\n[utj3-junit/01/src/test/java/persistence/AnInMemoryDatabase.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/persistence/AnInMemoryDatabase.java)\n\
  \n```java\nInMemoryDatabase db = new InMemoryDatabase();\n\n@Test\nvoid returnsCustomerCorrespondingId()\
  \ {\n    var customer = new Customer(\"42\", \"Mr Creosote\");\n    db.add(customer);\n\
  \    var retrieved = db.get(\"42\");\n    assertEquals(customer, retrieved);\n}\n\
  \n@Test\nvoid returnsNotNullNonexistentKey() {\n    assertNull(db.get(\"42\"));\n\
  }\n```\n\n第二个测试演示了 `assertNull` 的用法：如果你尝试从 `db` 中获取任何内容（未插入的 \"42\"），它应该返回 `null`。\n\
  \n### assertNotNull\n\n`assertNotNull` 是 `assertNull` 的反面。它被用于验证引用指向了某些东西而不是空。\n\
  \n你可能会使用 `assertNotNull` 来验证一个“持久化”在内存中的对象（例如在哈希表中）与存储的实例是不同的实例。否则，对“存活”对象的修改也会改变持久化的对象。正如\
  \ `assertEquals` 一样，许多初接触 JUnit 的人引入 `assertNotNull` 来检查新实例化的引用：\n\n[utj3-junit/01/src/test/java/persistence/AnInMemoryDatabase.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/persistence/AnInMemoryDatabase.java)\n\
  \n```java\n@Test\nvoid returnsCustomerCorrespondingId() {\n    var customer = new\
  \ Customer(\"42\", \"Mr Creosote\");\n    assertNotNull(customer); // 可笑！这不会失败\n\
  \    db.add(customer);\n    var retrieved = db.get(\"42\");\n    assertEquals(customer,\
  \ retrieved);\n}\n```\n\n然而，那个 `assertNotNull` 永远不会失败。`customer` 变量在测试的第一行初始化，只有当\
  \ `Customer` 构造函数抛出异常时，它才可能是 `null`。如果抛出了异常，下一行代码——`assertNotNull` 语句就不会执行。如果没有抛出异常，`customer`\
  \ 引用将指向一个非空对象，因此如果执行了，它绝不会失败。不要这样做。\n\n`assertNotNull` 仅在你需要证明引用指向一个值且完全不在乎该值是什么时才有用。否则——如果你可以确定预期值——`assertNotNull`\
  \ 是一个弱弱的断言。你最好使用 `assertEquals` 来比较引用及其实际值。\n\n你会在少数情况下知道何时可以使用 `assertNotNull`。否则……不要这样做。\n\
  \n### 额外的断言集合\n\n等一下——还有更多！\n\nJUnit 的 `org.junit.jupiter.api.Assertions` 类提供了此处处没有描述的更多断言。如果不查阅用户指南或该类的庞大\
  \ Javadoc，你将不知道这些断言的存在。以下是它们及其简要描述：\n\n- `assertLinesMatch`: 验证两个字符串列表或流是否匹配；可以使用正则表达式和“快速跳进”。\n\
  - `assertAll`: 验证所有提供的执行体均未抛出异常。\n- `assertInstanceOf`: 验证实际值是否是预期类型的实例。\n- `assertIterableEquals`:\
  \ 验证提供的 `Iterable` 引用是深度相等的。\n- `assertTimeout`: 验证执行体在指定的持续时间内完成执行。\n\n\n\n\n\n\
  | `assertTimeoutPreemptively` | 类似于 assertTimeout，但会在单独线程中运行可执行代码 |\n\n## 预期异常\n\
  \n除了确保代码的“快乐路径”（happy path）运行正常外，你还需要验证“非健康情况”（unhappy cases）。例如，你希望编写测试来演示代码在何时会抛出异常。这些测试对于让必须处理这些代码的开发者充分理解其行为是必要的。\n\
  \nJava 语言的不断演进驱动了 JUnit 的持续发展——在 JUnit 中，少于四种编写基于异常测试的方法。你将查看其中几种。\n\n让我们来看一个简单的例子：确保当客户端尝试提取金额超过可用余额时，`Account`\
  \ 代码会抛出 `InsufficientFundsException`。\n\n### 新流派：assertThrows\n\n`assertThrows`\
  \ 断言从 JUnit 4.13 版本开始可用，它应该涵盖你编写基于异常测试时的所有需求。优先使用它而不是其他机制。\n\n最有用的 `assertThrows`\
  \ 形式接受两个参数：预期抛出的异常类型以及一个可执行对象（通常是 Lambda 表达式，但也可能是方法引用）。该可执行对象包含了预期抛出异常的代码。\n\n\
  当 JUnit 执行该断言时，Lambda 中的代码将被运行。如果该代码没有抛出异常，则断言将失败。如果 Lambda 中的代码确实抛出了异常，且该异常对象的类型匹配或是预期异常类型的子类，则测试通过。\n\
  \n这里是 `assertThrows` 的实际应用。`assertThrows` 的 Lambda 参数尝试从一个新创建的账户（即没有钱的账户）中提取 100\
  \ 元：\n\n```java\nimport static org.junit.jupiter.api.Assertions.assertThrows;\n\n\
  @Test\nvoid throwsWhenWithdrawingTooMuch() {\n    var thrown = assertThrows(InsufficientFundsException.class,\n\
  \        () -> account.withdraw(100));\n    assertEquals(\"balance only 0\", thrown.getMessage());\n\
  }\n```\n\n调用 `assertThrows` 会返回异常对象。此测试将其赋值给变量 `thrown`，以便对它的异常消息字符串进行断言。\n\n不要在\
  \ Lambda 中添加多余的代码。你不希望出现“假阳性”，即因为错误的代码行抛出了预期的异常而导致测试通过。\n\n当要提取的金额超过余额时，`withdraw`\
  \ 中的代码通过抛出 `InsufficientFundsException` 通过了 `assertThrows` 语句：\n\n```java\nvoid\
  \ withdraw(int dollars) {\n    if (balance < dollars) {\n        throw new InsufficientFundsException(\"\
  balance only \" + balance);\n    }\n    balance -= dollars;\n}\n```\n\n### 老流派\n\
  \n在 `assertThrows` 出现之前，你在 JUnit 中至少有三种预期异常的方法：使用 try/catch、注解和规则（rules）。如果你维护旧系统，可能会看到这些解决方案中的某些。JUnit\
  \ 5 不支持注解和规则，因此我在这里不会介绍它们。不过，我会向你展示它们是什么样的，以便你理解你看到的内容。\n\n这里是一个基于注解的机制示例：\n\n```java\n\
  @Test(expected=InsufficientFundsException.class)\npublic void throwsWhenWithdrawingTooMuch()\
  \ {\n    account.withdraw(100);\n}\n```\n\n如果你在 `@Test` 注解中看到 `expected=` 参数，请访问\
  \ JUnit 4 关于 `@Test` 的文档以获取进一步说明。\n\n以下是基于规则的机制（在 JUnit 4.7 中添加）的可能用法：\n\n```java\n\
  public class SimpleExpectedExceptionTest {\n    @Rule\n    public ExpectedException\
  \ thrown= ExpectedException.none();\n\n    @Test\n    public void throwsException()\
  \ {\n        thrown.expect(NullPointerException.class);\n        thrown.expectMessage(\"\
  happened\");\n\n        // ... 抛出异常的代码\n    }\n    // ...\n}\n```\n\n如果你看到一个实例化并带有\
  \ `@Rule` 注解的 `ExpectedException`……\n\n#### 使用 try/catch\n\ntry/catch 惯用法代表了允许空\
  \ catch 块的罕见情况。在示例中：\n\n```java\n@Test\nvoid throwsWhenWithdrawingTooMuch() {\n\
  \    try {\n        account.withdraw(100);\n        fail();\n    } catch (InsufficientFundsException\
  \ expected) {\n        assertEquals(\"balance only 0\", expected.getMessage());\n\
  \    }\n}\n```\n\n当 JUnit 执行 `try` 块中确实抛出异常的代码时，控制将转移到 `catch` 块。在示例中，由于代码确实抛出了\
  \ `InsufficientFundsException`，控制转移到 `assertEquals` 语句，该语句验证异常对象的消息。\n\n如果调用 `withdraw`\
  \ 没有抛出异常，则执行下一行。使用 `try/catch` 时，`try` 块中的最后一行应该是对 `org.junit.Assert.fail()` 的调用。正如你可能猜到的那样，JUnit\
  \ 的 `fail()` 方法会抛出 `AssertionFailedError` 以中止并失败测试。\n\ntry/catch 惯用法代表了允许空 catch\
  \ 块的罕见情况——也许你不在乎异常的内容。将异常变量命名为 `expected` 有助于向读者强调我们预期会有异常被抛出并捕获。考虑一下在异常抛出后你可能希望测试断言的其他事情。检查必须成立的后置条件。例如，断言提取失败后账户余额没有变化可能是有价值的。\n\
  \n你偶尔会在旧代码中看到 `try/catch` 机制。如果是这样，你可以不管它（你现在知道它是如何工作的了），或者可以通过将其替换为 `assertThrows`\
  \ 来简化你的测试。\n\n\n\n\n\n```java\nreturn s.chars().filter(ch -> ch == ',').count();\n\
  }\n\nvoid validate(String name) {\n    if (name.isEmpty() || commaCount(name) >\
  \ 1) {\n        throw new NameValidationException();\n    }\n}\n```\n\n你需要两个测试来证明\
  \ `validate` 在两种负例情况下的情况下都会抛出异常：\n\n[utj3-junit/01/src/test/java/scratch/ANameValidator.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/ANameValidator.java)\n\
  \n```java\nimport org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.assertDoesNotThrow;\n\
  import static org.junit.jupiter.api.Assertions.assertThrows;\n\nclass ANameValidator\
  \ {\n    NameValidator validator = new NameValidator();\n\n    @Test\n    void throwsWhenNameIsEmpty()\
  \ {\n        assertThrows(NameValidationException.class, () ->\n            validator.validate(\"\
  \"));\n    }\n\n    @Test\n    void throwsWhenNameContainsMultipleCommas() {\n \
  \       assertThrows(NameValidationException.class, () ->\n            validator.validate(\"\
  Langr, Jeffrey,J.\"));\n    }\n}\n```\n\n以及一个使用 `assertDoesNotThrow` 的测试，显示在其他情况下什么都不会发生：\n\
  \n[utj3-junit/01/src/test/java/scratch/ANameValidator.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/ANameValidator.java)\n\
  \n```java\n@Test\nvoid doesNotThrowWhenNoErrorsExist() {\n    assertDoesNotThrow(()\
  \ ->\n        validator.validate(\"Langr, Jeffrey J.\"));\n}\n```\n\n如果必须，可以使用 `assertDoesNotThrow`，但也许可以先探索不同的设计。对于这里的示例，将验证器改为暴露一个\
  \ `Boolean` 方法就能解决问题。\n\n### 异常——异常，谁需要它们？\n\n你编写的大多数测试将是更轻松心的“快乐路径”测试，这些测试极极可能抛出异常。但\
  \ Java 像个扫兴的人，坚持要求你承认任何受检异常类型。\n\n不要用 `try/catch` 块处理受检异常来干扰你的测试。相反，让这些异常释放出来！测试可以直接抛出它们：\n\
  \n[utj3-junit/01/src/test/java/scratch/SomeAssertExamples.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/SomeAssertExamples.java)\n\
  \n```java\n@Test\nvoid readsFromTestFile() throws IOException {\n    var writer\
  \ = new BufferedWriter(new FileWriter(\"test.txt\"));\n    writer.write(\"test data\"\
  );\n    writer.close();\n    // ...\n}\n```\n\n你设计这些正向测试是为了确保它们在 true 真正异常的情况下不会抛出异常。即使意外抛出了异常，JUnit\
  \ 也会为你捕获它，并将测试报告为错误（error）而不是失败（failure）。\n\n## 替代的断言方法\n\n你测试中的大多数断言都是对预期结果与实际结果的直接比较：平均信用分是\
  \ 780 吗？然而，有时直接比较并不是描述预期结果最有效的方法。\n\n例如，假设你编写了 `fastHalf` 方法，它使用位移来执行整数除以 2。代码显而易见，一些核心测试也是如此：\n\
  \n[utj3-junit/01/src/main/java/util/MathUtils.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/main/java/util/MathUtils.java)\n\
  \n```java\npublic class MathUtils {\n    static long fastHalf(long number) {\n \
  \       return number >> 1;\n    }\n}\n```\n\n```java\nimport org.junit.jupiter.api.Test;\n\
  import static org.junit.jupiter.api.Assertions.assertEquals;\nimport static MathUtils.fastHalf;\n\
  \nclass SomeMathUtils {\n    @Nested\n    class FastHalf {\n        @Test\n    \
  \    void isZeroWhenZero() {\n            assertEquals(0, fastHalf(0));\n      \
  \  }\n\n        @Test\n        void roundsDownToZero() {\n            assertEquals(0,\
  \ fastHalf(1));\n        }\n\n        @Test\n        void dividesEvenWhenEven()\
  \ {\n            assertEquals(11, fastHalf(22));\n        }\n\n        @Test\n \
  \       void roundsDownWhenOdd() {\n            assertEquals(10, fastHalf(21));\n\
  \        }\n\n        @Test\n        void handlesNegativeNumbers() {\n         \
  \   assertEquals(-2, fastHalf(-4));\n        }\n    }\n}\n```\n\n你可能想要另一个测试来验证该工具类对大数字是否有效：\n\
  \n[utj3-junit/01/src/test/java/util/SomeMathUtils.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/util/SomeMathUtils.java)\n\
  \n```java\n@Test\nvoid handlesLargeNumbers() {\n    var number = 489935889343890L;\n\
  \    assertEquals(244967944671945L, fastHalf(number));\n}\n```\n\n你可能想要另一个测试来验证该工具类对大数字是否有效：\n\
  \n你已经证明了 fast half 对 0、1、许多情况以及负例都是有效的。对于非常大的数字，与其在测试中显示很多难看的数字，你可以编写一个强调输入和输出之间反向关系的断言：\n\
  \n[utj3-junit/01/src/test/java/util/SomeMathUtils.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/util/SomeMathUtils.java)\n\
  \n```java\n@Test\nvoid handlesLargeNumbers() {\n    var number = 489935889343890L;\n\
  \    assertEquals(number, fastHalf(number) * 2);\n}\n```\n\n数学计算是反反关系的典型示例：你可以通过乘法验证除法，通过减法验证加法，通过平方验证平方根，以此类推。其他可以使用反向操作领域包括密码学、会计、物理、计算机图形、金融和数据压缩。\n\
  \n通过反向检查确保一切都对得上并平衡，就像复式记账系统中的总账一样。这并不是你应该经常使用的技巧，但它有时可以帮助你的测试更具表现力。当测试需要大量数据时，你可能会发现反向应用的特殊价值。\n\
  \n小心你用于验证的代码！如果实际程序和断言共享相同的代码（可能是你写的公共工具类），它们可能会共享相同的缺陷。\n\n## 第三方断言库\n\nJUnit 提供了你需要的所有断言，但值得看看流行的第三方断言库——AssertJ、Hamcrest、Truth\
  \ 以及更多。这些库主要寻求改进断言的表达能力，这可以帮助简化和优化你的测试。\n\n让我们快速看一眼流行的 AssertJ，看看它的部分威力。AssertJ\
  \ 提供了流式断言（fluent assertions），其设计旨在帮助测试流动更顺、读起来更自然。几个简单的示例就能让你快速掌握其精髓。每个示例都假设以下声明：\n\
  \n```java\nString name = \"my big fat acct\";\n```\n\n\n\n\n[content]\n\n当将 AssertJ\
  \ 断言应用于比较两个对象的这一常见需求时，它的写法如下——`isEqualTo` 类似于 JUnit 中的 `assertEquals`：\n\n[utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java)\n\
  \n```java\nassertThat(name).isEqualTo(\"my big fat acct\");\n```\n\n到目前为止，非常简单。需要注意的是：\n\
  \n*   你可以利用自动补全来完善断言。\n*   该断言读起来像一个英文句子，从左到右阅读。\n\nAssertJ 提供了许多陈述性断言的反向形式。因此，`isEqualTo`\
  \ 的反过来是 `isNotEqualTo`：\n\n[utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java)\n\
  \n```java\nassertThat(name).isNotEqualTo(\"plunderings\");\n```\n\n后面是更多示例。它们大多数都能自言说明，而这正是其目的所在。\n\
  \n你可以使用链式调用在单个语句中指定多个预期结果。如果 `name` 引用的字符串既以 \"my\" 开头又以 \"acct\" 结尾，则以下断言通过：\n\n\
  [utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java)\n\
  \n```java\nassertThat(name)\n    .startsWith(\"my\")\n    .endsWith(\"acct\");\n\
  ```\n\n一个类型检查的示例：\n\n[utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java)\n\
  \n```java\nassertThat(name).isInstanceOf(String.class);\n```\n\n使用正则表达式：\n\n[utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java)\n\
  \n```java\nassertThat(name).containsPattern(compile(\"\\\\s+(big fat|small)\\\\\
  s+\"));\n```\n\nAssertJ 包含了许多关于列表的测试：\n\n[utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java)\n\
  \n```java\n@Test\npublic void simpleListTests() {\n    var names = List.of(\"Moe\"\
  , \"Larry\", \"Curly\");\n\n    assertThat(names).contains(\"Curly\");\n    assertThat(names).contains(\"\
  Curly\", \"Moe\");\n    assertThat(names).anyMatch(name -> name.endsWith(\"y\"));\n\
  \    assertThat(names).allMatch(name -> name.length() < 6);\n}\n```\n\n第三个列表断言如果列表中任何一个或多个元素以子字符串\
  \ \"y\" 结尾，则断言通过。（这里的字符串 \"Larry\" 或 \"Curly\" 使它通过了测试。）\n\n第四个断言如果列表中所有元素的长度都小于\
  \ 6，则断言通过。（它们确实如此。）\n\n（注意：前述仅验证字符串部分内容的断言可能被认为是弱力断言。你可能需要验证更多内容。）\n\nAssertJ 失败的流式断言提供的失败信息比\
  \ JUnit 可能给你的要有用得多。这里有一个针对名称列表的失败断言：\n\n[utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java)\n\
  \n```java\nassertThat(names).allMatch(name -> name.length() < 5);\n```\n\n… 以及由\
  \ AssertJ 生成的失败信息：\n\n```\nExpecting all elements of:\n[\"Moe\", \"Larry\", \"Curly\"\
  ]\nto match given predicate but these elements did not:\n[\"Larry\", \"Curly\"]\n\
  ```\n\n确切知道断言失败的原因应该加快你的修复。\n\nAssertJ 允许你以尽可能简洁的方式表达断言，特别是当情况变得复杂时。偶尔，你的测试需要从结果中提取特定数据，以便对其进行有效的断言。\n\
  \n### 流式化的威力\n\n让我们来看一个小示例，它展示了 AssertJ 的某些威力。示例使用了两个类：\n\n*   一个声明了 segment 的 Flight\
  \ 类\n*   一个包含 distance 的 Segment 类\n\n[utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/SomeAssertJExamples.java)\n\
  \n```java\nassertThat(flights)\n    .filteredOn(flight -> flight.includes(\"DEN\"\
  ))\n    .extracting(\"segment.distance\", Integer.class)\n    .allMatch(distance\
  \ -> distance < 1700);\n```\n\n`filteredOn` 调用返回包含 \"DEN\" 的航班子集。\n\n`extracting`\
  \ 调用将属性引用 `segment.distance` 应用于每个 \"DEN\" 航班。引用告诉 AssertJ 首先从航班获取 segment 对象，然后从该\
  \ segment 获取距离值。\n\n是的，你可以手动编写等同于 AssertJ 解决方案的代码，但生成的代码将失去 AssertJ 提供的声明性质。你的测试在编写和阅读上需要更多精力。相比之下，AssertJ\
  \ 对链式调用的支持创建了一个单一概念的流畅句子。\n\n无论你选择采用 AssertJ 还是第三方断言库，都要简化你的测试使其成为简洁的文档。良好的断言设计可以减少逐步阅读。\n\
  \n## 消除非测试\n\n断言是测试成为测试的关键。在测试中省略断言将使它们毫无意义。然而，某些开发者这样做是为了轻松地满足代码覆盖率的要求。另一种常见的策略是编写执行大量代码的测试，然后断言非常简单的内容——例如，方法的返回值不为空。\n\
  \n这种非测试几乎没有价值，却消耗了大量的时间和精力。更糟糕的是，它们具有日益加负的投资回报：当它们失败或报错时，当它们出现在搜索结果中（“那是我们需要更新的真实测试，还是我们不需要担心？”），以及当我们必须更新它们以保持运行时（例如，当方法签名发生变化时），必须花费时间。\n\
  \n| ![images/aside-icons/tip.png](img/tip.png) | 消除不验证任何内容的测试。 |\n\n## 总结\n\n你在本章中学习了许多断言形式。你还学习了\
  \ AssertJ，这是另一种断言库。\n\n\n\n\n最初，如果你在大多数断言中使用 `assertEquals`，并偶尔配合 `assertTrue` 或\
  \ `assertFalse`，你还能应付过去。然而，你会希望尽快进入下一个阶段，并学习针对当前情况使用最简洁、表达力最强的断言。\n\n在对如何编写断言有了坚实的理解后，你接下来将深入研究测试类的组织结构，以便能够最有效地运行和维护相关的测试组。\n\
  \n### 注脚\n\n[[18]](#f_0057.xhtml_FNPTR-18)\n[`assertj.github.io/doc/`](https://assertj.github.io/doc/)\n\
  [[19]](#f_0058.xhtml_FNPTR-19)\n[`www.developer.com/design/working-with-design-patterns-flyweight/`](https://www.developer.com/design/working-with-design-patterns-flyweight/)\n\
  [[20]](#f_0059.xhtml_FNPTR-20)\n[`junit.org/junit4/javadoc/4.12/org/junit/Test.html`](https://junit.org/junit4/javadoc/4.12/org/junit/Test.html)\n\
  [[21]](#f_0059.xhtml_FNPTR-21)\n[`junit.org/junit4/javadoc/4.12/org/junit/rules/ExpectedException.html`](https://junit.org/junit4/javadoc/4.12/org/junit/rules/ExpectedException.html)\n\
  \nCopyright © 2024, The Pragmatic Bookshelf.\n\n# 第 6 章：在 JUnit 测试中建立组织\n\n你目前为止的\
  \ JUnit 学习包括：\n\n* 如何运行 JUnit 并理解其结果\n* 如何在测试类中对相关的测试方法分组\n* 如何将常见的测试初始化分组到 `@BeforeEach`\
  \ 方法中\n* 深入研究 JUnit 断言（上一章）\n\n通常情况下，你希望为你开发的每个生产类至少编写一个测试类。在本章中，你将研究测试类内部的测试组织主题。你将学习到：\n\
  \n* 测试的组成部分\n* 使用生命周期方法进行初始化和清理\n* 使用嵌套类对相关测试进行分组\n* JUnit 测试执行生命周期\n* 通过从不规定测试顺序来避免依赖挑战\n\
  * 使用参数化测试为单个测试执行多个测试用例\n\n## 单个测试的组成部分\n\n几个章节之前（参阅 ​*可扫描性：Arrange—Act—Assert*​)），你学会了\
  \ `AAA` 如何提供一个极佳的视觉记忆，帮助读者快速理解测试的核心部分。\n\n一些开发者称为“四阶段测试”，^([[22]](#f_0071.xhtml_FOOTNOTE-22))，其中每个测试都可以被分为（等一下哈）四个部分或阶段：\n\
  \n* 在有时被称为“固件”（fixture）的地方设置状态/数据。将固件想象成测试运行的上下文——俗来说，就是它的世界。固件由 JUnit 为你管理；你将在本章中作为\
  \ JUnit 测试执行生命周期的一部分学习更多相关知识。\n* 与系统交互以执行你想要验证的内容。\n* 进行验证（`assert`）。\n* 拆除固件——如有必要，清理任何副作用。这通常涉及清理测试可能使用过且可能影响其他测试执行的资源。在本章中，你将学习使用\
  \ `@AfterEach` 和 `@AfterAll` JUnit 钩子进行此类清理。\n\n对于任何意图和目的，`AAA` 都是四部分测试的前三个部分。`Arrange,\
  \ act, assert ≈ 设置, 执行, 验证`。\n\n事实证明第四部分“拆除”（tear down）在单元测试中是罕见的且应该是罕见的，因为你寻求（主要通过设计）避免与必须清理的对象交互。如果你觉得\
  \ `AAA` 剥夺了你的第四阶段，你可以添加第四个“A”……代表 `ANNIHILATION`（毁灭）！（如果这种暴力倾向让你感到不安，就在脑子里把它换成“After”。保持冷静并继续。）\n\
  \n## 使用生命周期方法进行设置和拆除\n\n你在第一个 JUnit 示例中学习了 `@BeforeEach`（参阅第 1 章，​*构建你的第一个 JUnit\
  \ 测试*​）。让我们仔细看看这个初始化钩子，以及 JUnit 提供的其他有用钩子。\n\n### 使用 @BeforeEach 和 @BeforeAll 进行初始化\n\
  \n在 ​*抽象：消除无聊细节*​] 中，你学习了使用 `@BeforeEach` 将公共初始化放在一个地方。标记了 `@BeforeEach` 的方法将在范围内的每个测试之前执行。\n\
  \nJUnit 还提供了另一个初始化钩子，称为 `@BeforeAll`，你必须将其声明为 `static` 方法。每个标记了 `@BeforeAll` 的方法每个测试类执行一次，并在在该类内执行任何其他内容之前。它的主要用途是确保执行较慢的初始化（例如，任何涉及数据库的内容）只需要执行一次。否则，优先使用\
  \ `@BeforeEach`。\n\n如果你发现自己极罕见地多次使用 `@BeforeAll`，那么你可能正在测试比单元更大的行为。这可能是可以的，但可能意味着你有机会减少系统中的依赖关系。参阅第\
  \ 3 章，​*使用测试双胞*​) 了解如何做到的想法。\n\n如果你发现自己极罕见地多次使用 `@BeforeAll`，那么你可能正在测试比单元更大的行为。这可能是可以的，但可能意味着你有机会减少系统中的依赖关系。参阅第\
  \ 3 章，​*使用测试双胞*​) 了解如何做到的想法。\n\n如果你发现自己极罕见地多次使用 `@BeforeAll`，那么你可能正在测试比单元更大的行为。这可能是可以的，但可能意味着你有机会减少系统中的依赖关系。参阅第\
  \ 3 章，​*使用测试双胞*​) 了解如何做到的想法。\n\n### 使用 @AfterEach 和 @AfterAll 进行清理\n\nJUnit 用相应的“拆除”生命周期方法\
  \ `@AfterEach` 和 `@AfterAll` 包围初始化钩子 `@BeforeEach` 和 `@BeforeAll`。这些方法允许你在完成后清理资源。即使测试抛出异常，`@AfterEach`\
  \ 和 `@AfterAll` 也保证执行（只要 JUnit 进程没有崩溃）。\n\n例如，在 `@AfterEach` 中你可能会关闭数据库连接或删除文件。如果你在\
  \ JUnit 中编写集成测试（非单元测试），这些清理钩子是至关重要的。\n\n然而，大多数单元测试不应与需要清理的代码交互。典型的、希望罕见的情况是多个测试更改了静态字段的状态。\n\
  \n## 使用嵌套类组织相关测试\n\n随着你的类由于承担更多行为而增长，你需要更多的测试来描述这些新行为。使用你的测试类大小作为一个提示：如果你在一个测试源文件中声明了数十个测试，那么很有可能是被测试的类太大了。请考虑将生产类拆分为两个或多个类，这意味着你也希望将测试方法分到至少两个或多个测试类中。\n\
  \n\n\n\n你最终可能仍会在一个测试类中遗留几几十个测试方法。一个较大的测试类不仅在导航上令人望而生畏，还会让你更难找到所有相互相关的测试。\n\n为了帮助分组相关的测试，你可能考虑让每个相关测试的名称以相同的词开头。这里有三个描述\
  \ `Account` 类中取款如何运作的测试：\n\n| | @Test void withdrawalReducesAccountBalance() { /*\
  \ ... */ } |\n| | @Test void withdrawalThrowsWhenAmountExceedsBalance() { /* ...\
  \ */ } |\n| | @Test void notifiesIRSWhenAmountExceedsThreshold() { /* ... */ } |\n\
  \n然而，更好的解决方案是将相关的测试分组在 JUnit 的 `@Nested` 类中：\n\n| | @Nested |\n| | class Withdrawal\
  \ { |\n| | @Test void reducesAccountBalance() { /* ... */ } |\n| | @Test void throwsWhenAmountExceedsBalance()\
  \ { /* ... */ } |\n| | @Test void notifiesIRSWhenAmountExceedsThreshold() { /* ...\
  \ */ } |\n| | } |\n\n你可以在你的测试类中创建多个 `@Nested` 类，同样地将其中的所有方法分组。嵌套类的名称描述了共同行为，可以从每个测试名称中移除。\n\
  \n你还可以使用 `@Nested` 类按上下文对测试分组——即测试中 `arrange`（准备）部分所建立的状态。例如：\n\n| | class AnAccount\
  \ |\n| | @Nested |\n| | class WithZeroBalance { |\n| | @Test void doesNotAccrueInterest()\
  \ { /* ... */ } |\n| | @Test void throwsOnWithdrawal() { /* ... */ } |\n| | } |\n\
  | | @Nested |\n| | class WithPositiveBalance { |\n| | @BeforeEach void fundAccount()\
  \ { account.deposit(1000); } |\n| | @Test void accruesInterest() { /* ... */ } |\n\
  | | @Test void reducesBalanceOnWithdrawal() { /* ... */ } |\n| | } |\n| | |\n\n\
  测试被分为需要零余额账户（`WithZeroBalance`）和正余额账户（`WithPositiveBalance`）。\n\n### 观察 JUnit 生命周期\n\
  \n你已经学习了如何使用 `before` 和 `after` 钩子，以及如何将相关的测试分组到嵌套类中。让我们通过一个骨架测试类，看看在运行测试时这些 JUnit\
  \ 元素实际上是如何参与的。\n\n`AFundedAccount` 包含六个测试。根据其名称，所有测试都可以假设账户已存在且具有正余额。`account` 对象在字段级别被创建，随后在\
  \ `@BeforeEach` 方法中注资金。这里是完整的 `AFundedAccount` 测试类，去除了每个测试的所有复杂细节。\n\n[`utj3-junit/01/src/test/java/scratch/AFundedAccount.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/scratch/AFundedAccount.java)\n\
  \n```java\nimport org.junit.jupiter.api.*;\n\nclass AFundedAccount {\n    Account\
  \ account = new Account(\"Jeff\");\n    AFundedAccount() {\n        // ...\n   \
  \ }\n\n    @BeforeEach\n    void fundAccount() {\n        account.deposit(1000);\n\
  \    }\n\n    @BeforeAll\n    static void clearAccountRegistry() {\n        // ...\n\
  \    }\n\n    @Nested\n    class AccruingInterest {\n\n        @BeforeEach\n   \
  \     void setInterestRate() {\n            account.setInterestRate(0.027d);\n \
  \       }\n\n        @Test\n        void occursWhenMinimumMet() {\n            //\
  \ ...\n        }\n\n        @Test\n        void doesNotOccurWhenNotMet() {\n   \
  \         // ...\n        }\n\n        @Test\n        void isReconciledWithAccount()\
  \ {\n            // ...\n        }\n\n        @Nested\n        class Withdrawal\
  \ {\n\n            @Test\n            void reducesAccountBalance() {\n         \
  \       // ...\n            }\n\n            @Test\n            void throwsWhenAmountExceedsBalance()\
  \ {\n                // ...\n            }\n\n            @Test\n            void\
  \ notifiesIRSWhenAmountExceedsThreshold() {\n                // ...\n          \
  \  }\n        }\n    }\n}\n```\n\n虽然你可以选择在 `@BeforeEach` 方法中实例化 `account` 字段，但使用字段级初始化也没有问题，特别是当内容不多时。`AFundedAccount`\
  \ 中的字段声明初始化了一个带有任意名称的账户，因此它并不有趣到值得专门写一个 `@BeforeEach` 方法。但如果你的共同初始化都很有趣或者需要一系列语句，你绝对会希望它在\
  \ `@BeforeEach` 方法中发生。\n\n使用 `@Nested` 使得在运行测试时可以获得组织良好的测试结果：\n\n![images/junit/testResultsHierarchy.png](img/testResultsHierarchy.png)\n\
  \n你可以清晰地看到相关测试的分组，这使得更容易找到你想要的内容。视觉上的分组也更容易发现必要测试的明显缺失，并检查其名称的一致性——与其他测试或其他，或符合你团队的测试命名标准。\n\
  \n我在每个 `@BeforeEach` 方法、`@Test` 方法和构造函数（在列表中隐式定义）中添加了 `System.out` 语句。以下是运行测试时的输出：\n\
  \n| @BeforeAll::clearAccountRegistry | AFundedAccount(); balance = 0 |\n| Withdrawal\
  \ | @BeforeEach::fundAccount | notifiesIRSWhenAmountExceedsThreshold | AFundedAccount();\
  \ balance = 0 |\n| Withdrawal | @BeforeEach::fundAccount | reducesAccountBalance\
  \ | AFundedAccount(); balance = 0 |\n| Withdrawal | @BeforeEach::fundAccount | throwsWhenAmountExceedsBalance\
  \ | AFundedAccount(); balance = 0 |\n| AccruingInterest | @BeforeEach::fundAccount\
  \ | @BeforeEach::setInterestRate | occursWhenMinimumMet | AFundedAccount(); balance\
  \ = 0 |\n| AccruingInterest | @BeforeEach::fundAccount | @BeforeEach::setInterestRate\
  \ | accruesNoInterestWhenMinimumMet | AFundedAccount(); balance = 0 |\n| AccruingInterest\
  \ | @BeforeEach::fundAccount | @BeforeEach::setInterestRate | doesNotOccurWhenNotMet\
  \ |\n\n静态 `@BeforeAll` 方法首先执行。\n\n输出显示每个执行的测试都会创建一个 `AFundedAccount` 实例。它还显示账户如预期地正确初始化了名称和零余额。\n\
  \n为每个测试创建新实例是 JUnit 故意设计的一部分。这有助于确保每个测试不受其他测试可能产生的副作用的影响。\n\n![images/aside-icons/important.png](img/important.png)\
  \ JUnit 为每个每个测试方法创建一个测试类的新实例。\n\n在 `AFundedAccount` 类顶层作用域定义的 `@BeforeEach` 方法 `fundAccount`\
  \ 在所有六个测试之前都会执行。\n\n在 `AccruingInterest` 作用域内定义的 `@BeforeEach` 方法 `setInterestRate`\
  \ 仅在该嵌套类内的三个测试之前执行。\n\n### 避免依赖性绝望：不要为测试排序！\n\nJUnit 测试并不是按照声明的顺序（从上到下）运行的。事实上，它们并不是按照任何你可以容易确定或依赖的顺序运行，例如按字母顺序。（它们很可能是按照\
  \ `java.lang.Class.getMethods()` 返回的顺序运行，根据其 Java 文档，该方法“没有排序，也没有特定的顺序”。）\n\n\n\n\
  \n\n你可能想让测试按照特定的顺序运行：“我正在编写一个关于新创建账户的第一个测试，这些账户余额为零。第二个测试可以向账户添加 100 美元，我可以验证该金额。然后我可以添加第三个运行的测试，在其中我存\
  \ 50 美元并确保新余额为 150 美元。”\n\n虽然 `JUnit 5` 提供了一种强制测试执行顺序的方法，但在单元测试中使用它并不是一个好主意。依赖测试顺序可能帮助你避免在多个测试用例中冗余地执行通用的设置。但它通常会引导你走上一条浪费时间的道路。例如，假设你正在运行测试，第四个测试失败了。是因为生产代码中存在真实问题吗？还是因为之前的三个测试中的一个（是哪一个？）让系统处于某种新意料之外的状态？\n\
  \n使用有序测试时，你在理解任何依赖于其他测试的测试时也会变得更加困难。在测试中增加依赖关系与在生产代码中一样昂贵。\n\n| ![images/aside-icons/tip.png](img/tip.png)\
  \ | 单元测试应该验证孤立的代码单元，而不应依赖于任何执行顺序。 |\n\n与其通过强制测试顺序来制造头疼，不如使用 `@BeforeEach` 来减少通用初始化的重复。你还可以提取辅助方法来减少冗余并提高你测试的抽象层次。\n\
  \n## 使用参数化测试执行多个数据用例\n\n你系统的许多行为将需要若干不同的测试用例。例如，在处理“零-一-多”的演变过程时，你通常会得到至少三个测试。\n\
  \n定义单独测试方法允许你在测试名称中显式地总结它们不同的行为：\n\n| ​  | storesEmptyStringWhenEmpty |\n| ​  |\
  \ storesInputStringWhenContainingOneElement |\n| ​  | storesCommaSeparatedStringWhenContainingManyElements\
  \ |\n\n通常，这三个测试用例的结构完全相同——其中所有的语句都是相同的，但输入和预期输出数据不同。如果这让你感到困扰，你可以通过辅助方法和 `@BeforeEach`\
  \ 方法来简化这些测试中的冗余。\n\n有时，当测试之间存在这种冗余时，并没有什么有趣的方法可以为它们命名不同的名称。例如，假设你有针对将阿拉伯数字转换为罗马数字对应项的代码的测试：\n\
  \n[utj3-junit/01/src/main/java/util/RomanNumberConverter.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/main/java/util/RomanNumberConverter.java)\n\
  \n```java\npublic class RomanNumberConverter {\n    record Digit(int arabic, String\
  \ roman) {}\n\n    Digit[] conversions = {\n        new Digit(1000, \"M\"),\n  \
  \      new Digit(900, \"CM\"),\n        new Digit(500, \"D\"),\n        new Digit(400,\
  \ \"CD\"),\n        new Digit(100, \"C\"),\n        new Digit(90, \"XC\"),\n   \
  \     new Digit(50, \"L\"),\n        new Digit(40, \"XL\"),\n        new Digit(10,\
  \ \"X\"),\n        new Digit(9, \"IX\"),\n        new Digit(5, \"V\"),\n       \
  \ new Digit(4, \"IV\"),\n        new Digit(1, \"I\")\n    };\n\n    public String\
  \ toRoman(int arabic) {\n        return Arrays.stream(conversions).reduce(\n   \
  \         new Digit(arabic, \"\"),\n            (acc, conversion) -> {\n       \
  \         var digitsRequired = acc.arabic / conversion.arabic;\n               \
  \ return new Digit(\n                    acc.arabic - digitsRequired * conversion.arabic,\n\
  \                    acc.roman + conversion.roman.repeat(digitsRequired));\n   \
  \         }\n        ).roman();\n    }\n}\n```\n\n算法本身或行为都不会根据输入而改变。如果你将此编写为单独的\
  \ JUnit 测试，这些测试之间几乎没有有用的区别：\n\n[utj3-junit/01/src/main/java/util/RomanNumberConverter.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/main/java/util/RomanNumberConverter.java)\n\
  \n```java\nimport org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\
  \nclass RomanNumberConverter {\n    RomanNumberConverter converter = new RomanNumberConverter();\n\
  \n    @Test\n    void convertsOne() {\n        assertEquals(\"I\", converter.toRoman(1));\n\
  \    }\n\n    @Test\n    void convertsTwo() {\n        assertEquals(\"II\", converter.toRoman(2));\n\
  \    }\n\n    @Test\n    void convertsThree() {\n        assertEquals(\"III\", converter.toRoman(3));\n\
  \    }\n}\n```\n\n幸运的是，JUnit 支持一种名为参数化测试的特殊测试形式。你通过在方法上使用 `@ParameterizedTest` 而不是\
  \ `@Test` 来创建参数化测试。\n\n```java\nimport org.junit.jupiter.params.ParameterizedTest;\n\
  import org.junit.jupiter.params.provider.CsvSource;\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\
  \nclass RomanNumberConverter {\n    RomanNumberConverter converter = new RomanNumberConverter();\n\
  \n    @ParameterizedTest\n    @CsvSource({\n        \"1, I\",\n        \"2, II\"\
  ,\n        \"3, III\",\n        \"10, X\",\n        \"20, XX\",\n        \"11, XI\"\
  ,\n        \"200, CC\",\n        \"732, DCCXXXII\",\n        \"2275, MMCCLXX\",\n\
  \        \"999, CMXCIX\",\n        \"444, CDXLIV\" // failure\n    })\n    void\
  \ convertAll(int arabic, String roman) {\n        assertEquals(roman, converter.toRoman(arabic));\n\
  \    }\n}\n```\n\n`@CsvSource` 中的第一个数据行（高亮）包含 CSV 字符串 \"1, I\"。JUnit 根据逗号分割此字符串并修剪结果值。它将这些值（数字\
  \ 1 和字符串 \"I”）传递给测试方法。\n\n由于上面的示例显示了十一行 CSV 数据，JUnit 将运行 `convertAll` 十一次。IntelliJ\
  \ 显示了每个测试用例的参数：\n\n![images/junit/parameterizedTest.png](img/parameterizedTest.png)\n\
  \n注意 JUnit 如何指示失败的（错误的）用例。\n\nJUnit 文档对各种各种数据源机制进行了详细说明。\n\n这里是快速摘要：\n\n| @ValueSource\
  \ | 单个值数组。仅当你的测试接收一个参数时有用（这意味着对于每个源值的预期结果都是相同的） |\n| @EnumSource | 遍历所有可能的枚举值，带有一些包含/排除和正则表达式匹配的选项\
  \ |\n| @MethodSource | 期望一个方法名称，该方法必须返回返回所有数据行 |\n\n\n\n\n\n| `@CsvFileSource` |\
  \ 大与 `@CsvSource` 相同，区别在于你需要指定一个包含 CSV 行的文件名 |\n| `@ArgumentsSource` | 允许你在扩展名为\
  \ `ArgumentsProvider` 接口的类中创建自定义的可重用数据源 |\n\n虽然 JUnit 中的参数化测试是非常强大且灵活的，但 `@CsvSource`\
  \ 就能满足你的大部分需求。我从未需要过其他数据源变体（尽管我不经常使用参数化测试）。\n\n总而言之，当你需要演示数据（而非行为）变体时，参数化测试是非常棒的。以下是两种普遍的需求：\n\
  \n- 如果参数为空或空字符串，则条件执行的代码。一个带有两个输入（`null` 和 `\"\"`）的参数化测试可以让你避免测试重复。\n- 边界条件周围的代码，特别是因为此类代码经常产生缺陷。例如，对于在\
  \ `n <= 0` 时条件执行的代码，请使用值为 `n - 1` 和 `n` 的参数化测试。\n\n否则，请创建一个新的 `@Test` 来描述不同的行为。\n\
  \n## 总结\n\n在大多数系统中，你最终会有成百甚至上千个单元测试。你希望利用一些 JUnit 特性（包括生命周期方法、嵌套类和参数化测试）来保持低维护成本。这些特性允许你减少冗余代码，并轻松运行一组相关的测试。\n\
  \n现在你已经学习了如何最好组织测试，在下一章中，你将深入研究与使用 JUnit 执行测试相关的话。你将养成一些良好的习惯，来决定运行多少测试（以及何时不运行测试）。你还将学习如何运行测试子集，以及如何临时禁用测试。\n\
  \n## 脚注\n\n- 22\n- [`xunitpatterns.com/Four%20Phase%20Test.html`](http://xunitpatterns.com/Four%20Phase%20Test.html)\n\
  - 23\n- [`junit.org/junit5/docs/current/user-guide/#writing-tests-parameterized-tests-sources`](https://junit.org/junit5/docs/current/user-guide/#writing-tests-parameterized-tests-sources)\n\
  \nCopyright © 2024, The Pragmatic Bookshelf.\n\n# 第 7 章：执行 JUnit 测试\n\n在本书的这一部分之前，你已经学习了断言、测试组织和\
  \ JUnit 的执行生命周期。\n\n如果你从不运行测试，那么世界上所有的测试都是没用的。在你自己的机器上构建软件时（如你一直以来所的那样），你会经常运行测试。但你还希望在部署之前对集成软件进行审核的过程中运行它们，也许作为持续构建过程的一部分。\n\
  \n在本章中，你将学习运行测试的“何时”、“什么”以及更多关于“如何”：\n\n- 在执行 JUnit 时你想要运行哪些组单元测试\n- 使用 JUnit `@Tag`\
  \ 注解对测试进行分组，这允许你执行任意组的测试\n- 使用 `@Disabled` 注解临时不运行你的测试\n\n## 测试习惯：运行哪些测试\n\n功能全\
  \ Java IDE（例如 IntelliJ IDEA 或 Eclipse）内置了对 JUnit 的支持。开箱即用，你可以加载项目、点击其测试目录并执行测试，无需配置任何内容。在第\
  \ 1 章“构建你的第一个 JUnit 测试”中，你已经看到了至少两种在 IntelliJ IDEA 内部运行 JUnit 测试的方法。在以下章节中，你将看到运行测试的数量如何影响结果。\n\
  \n### 运行所有测试\n\n如果你的测试运行很快，可以在几秒钟内运行数千个单元测试。当你有快速测试时，可以在每次细微更改后运行所有测试。如果你在代码库的其他地方搞坏了什么，你会立即知道。\n\
  \n### 尽可能运行你能忍受的测试\n\nIDEA 和其他 IDE 让你很容易选择运行所有内容的反面，即一次只运行一个测试。例如，IDEA 在每个测试方法的左侧提供了一个小的“播放”图标按钮。\n\
  \n假设你正在向测试类 `AFundedAccount` 添加一个名为 `issuesSMSAlertOnWithdrawal` 的测试。只运行 `issuesSMSAlertOnWithdrawal`\
  \ 的问题是，`AFundedAccount` 中还有许多其他测试，这些测试验证了 `Account` 生产类中可能相关的行为。当你开始更改 `Account`\
  \ 以支持新的短信警报行为时，可能会破坏这些其他 `Account` 行为。\n\n你希望在破坏其他代码的瞬间就发现。通常情况下，没有反馈你已经搞坏了东西的时间越长，你发现并修复问题的时间就越长。在缺陷代码周围堆积更多代码会开始模糊问题，并由于纠缠过多而变得更难修复。\n\
  \n单元测试的一个关键价值是快速反馈。然而，获得这种反馈的唯一方法就是实际运行这些东西。\n\n幸运的是，你正在学习设计让测试运行得快。因为耗时超过几秒钟而运行所有测试可能并不合理，但运行例如\
  \ `AFundedAccount` 中的所有测试应该是合理的。你的 IDE 应该让你轻松运行单个类中的所有测试。通过 JUnit，你还可以使用嵌套类对相关的测试子集进行分组。\n\
  \n## 使用标签创建任意测试组\n\nJUnit 5 允许你使用 `@Tag` 注解标记测试类或测试方法。你可以使用这些标签作为使用 JUnit 运行任意测试集的基础。这被称为过滤测试。\n\
  \n让我们来看一个例子。在修改 `Account` 类时，你应该运行 `AnAccount` 和 `AFundedAccount` 中的所有测试。你可以运行包含这两个类的包中的所有测试，但你也可以使用标签来精确确定要运行的测试子集。\n\
  \n为两个类都标记 `@Tag` 注解：\n\n```java\nimport org.junit.jupiter.api.Tag;\nimport org.junit.jupiter.api.Test;\n\
  \n// ...\n\n@Tag(\"account\")\nclass AnAccount {\n    // ...\n\n    @Test\n    void\
  \ withdrawalReducesAccountBalance() {\n        // ...\n    }\n\n    // ...\n}\n\
  ```\n\n\n\n\n\n[utj3-junit/01/src/test/java/tags/AnfundedAccount.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/tags/AnfundedAccount.java)\n\
  \n```java\nimport org.junit.jupiter.api.Tag;\nimport org.junit.jupiter.api.Test;\n\
  \n// ...\n@Tag(\"account\")\nclass UnfundedAccount {\n// ...\n    @Test\n    void\
  \ hasPositiveBalanceAfterInitialDeposit() {\n// ...\n    }\n\n    @Test\n    void\
  \ disallowsWithdrawals() {\n// ...\n    }\n}\n```\n\n要运行这两个带有标记的类中的测试，你必须为 JUnit\
  \ 提供一个过滤器。你的 IDE 可能允许你在运行测试时直接执行此操作。如果你使用 Maven 或 Gradle，这两个工具都提供了指定过滤器的支持。在最坏的情况下，你可以作为独立命令运行\
  \ JUnit 并在那时提供过滤器。请访问 JUnit 文档，了解如何使用 Maven、Gradle 或命令行使用标签运行测试。\n\n### 在 IntelliJ\
  \ IDEA 中使用标签\n\n在 IntelliJ IDEA 中，你可以在 `Run/Debug Configurations` 对话框中配置测试的运行方式。从\
  \ IDEA 的主菜单，选择 `Run ▶ Edit Configurations` 进入 `Run/Debug Configurations` 对话框。在 `Run/Debug\
  \ Configurations` 对话框中，点击 `+` 按钮添加新配置。IDEA 提供了一个名为 `Add New Configuration` 的下拉菜单；从其长列表中选择\
  \ JUnit。\n\n该对话框默认运行单个类中的测试；你可能需要更改此以告诉 JUnit 运行一个标签（tag）。在对话框的 `Build and run`\
  \ 部分，你应该能看到一个当前选中为 `Class` 的下拉菜单。从此下拉菜单选择 `Tags`。在下拉菜单右侧的输入字段中，输入文本 `account` 作为要执行的标签。此文本应与你在\
  \ `@Tag` 声明中指定的“account”字符串匹配。\n\n你的对话框看起来应该类似于图 14 (#f_074.xhtml)。\n\n![images/tags.png](img/tags.png)\n\
  \n![![aside-icons/warning.png](img/warning.png) 将 `utj3-junit` 指定为类路径 (`-cp`) 可能会产生错误。确保你已选择\
  \ `utj3-junit.test`。]\n\n现在你可以点击 `Apply` 然后点击 `Run` 来仅执行标记为“account”标签的测试。\n\n###\
  \ 标签表达式\n\nIDEA 支持标签表达式，这是允许进行更复杂过滤的布尔表达式。除了标记两个与账户相关的测试类外，假设你还想运行与发现的缺陷的热修复（hotfixes）相关的测试集。你可能为单个测试方法打了标签：\n\
  \n[utj3-junit/01/src/test/java/tags/AnInMemoryDatabase.java](http://media.pragprog.com/titles/utj3/code/utj3-junit/01/src/test/java/tags/AnInMemoryDatabase.java)\n\
  \n```java\nimport org.junit.jupiter.api.Tag;\nimport org.junit.jupiter.api.Test;\n\
  \n// ...\nclass AnInMemoryDatabase {\n// ...\n    @Tag(\"v11.1_defects\")\n    @Test\n\
  \    void objectCopiedWhenAddedToDatabaseFailing() {\n// ...\n    }\n// ...\n}\n\
  ```\n\n在运行配置中指定标签时，你可以输入以下标签表达式：\n\n`account | v11.1_defects`\n\n`|`（或）运算符表示 JUnit\
  \ 应该运行标记为“account”的测试与标记为“v11_defects”的测试的并集。具体而言，JUnit 将运行 `AnAccount` 和 `AnUnfundedAccount`\
  \ 中的测试，以及名为为 `objectCopiedWhenAddedToDatabaseFailing` 的测试。标签表达式支持使用 `!`（非）运算符反转过滤器，并使用\
  \ `&`（与）运算符运行两个标签的交集。它们还允许使用括号来澄清或强制运算符的优先级。\n\n### 过度使用标签\n\n与其他任何事物一样，过度使用标签功能可能可能是某些其他问题问题的迹象。如果你发现自己使用了或或是永久的标签名称（如\
  \ account），请尝试重新组织你的生产代码和/或测试代码，以消除对标签的需求。你可以提取一个新包、移动类的位置、将测试方法移动到其他类等。在单个测试类中，使用\
  \ `@Nested` 类来收集与单个概念（如“取款”）相关的集中测试集。\n\n## 使用 @Disabled 临时禁用测试\n\n偶尔，你会希望某个特定的测试不执行，通常是因为它失败了。也许你没有时间修复它。除了在你自己的机器上，禁用的测试不应该真正存在。避免集成禁用的测试——它们通常代表了关于系统健康的重大问题，例如：这个测试真的是需要的吗？我们可以直接删除它吗？对于为什么我们不能立即让它通过，我们目前了解什么？\n\
  \n`@Disabled` 注解是可选的。你使用的 JUnit 测试运行器（无论是内置在 IDE 中还是你的构建自动化工具中）都应该明确你的某些测试已停用。在下面的\
  \ IntelliJ 测试运行器中，测试 `disallowsWithdrawals` 被标记为灰色的“无符号”(⊘)，表示它已被禁用：\n\n![images/disabled.png](img/disabled.png)\n\
  \n你会感谢这个提醒，让你知道留下了一个悬而未决测试。\n\n遗憾的是，默认情况下，使用 Gradle 在命令行运行测试时，只有当至少有一个测试失败时，它才会告诉你存在禁用的测试。而且只有当你向上滚动\
  \ Gradle 输出时才能看到。\n\nGradle 是在持续构建环境中构建和运行测试的极佳方法。但不要使用 Gradle 进行交互式单元测试，除非你对其输出进行自定义以提醒你禁用的测试。如果存在任何禁用的测试，让测试运行失败，或者在输出的最后一行显示它们的数量。\n\
  \n\n\n\nJUnit 在过去的 20 多年里已经发展成为一个相当庞大且复杂的工具。在本章中学习到的功能可能足够满足你未来几年的需求。然而，JUnit 的其他某些功能也可能对你的特殊情况有所帮助。以下简要总结：\n\
  \n| 特性 | 描述 |\n| :--- | :--- |\n| 假设 (assumptions) | 如果假设不满足，则终止测试的执行（但不将其计为失败）。\
  \ |\n| 条件测试执行 (conditional test execution) | 根据条件启用或禁用测试。条件可以引用操作系统、架构、Java 版本、系统属性/环境变量的值，或自定义代码的谓词。\
  \ |\n| 显示名称 (display names) | 在测试运行期间，与其显示（通常是）驼峰命名法的测试名称，不如显示字符串的内容。 |\n| 显示名称生成器\
  \ (display name generators) | 通过转换测试方法名生成更具人类可读性的测试名称。例如，将测试名称中的下划线转换为空格。 |\n| 动态测试\
  \ (dynamic tests) | 在运行时生成测试。 |\n| 并行执行 (parallel execution) | 同时运行测试以加快其执行速度。 |\n\
  | 重复测试 (repeated tests) | 运行指定次数的测试。 |\n| 测试套件 (suites) | 以编程的方式声明要执行的过滤测试集合。 |\n\
  | 临时目录上下文 (temp dir context) | 编写在临时目录环境中执行的依赖于文件的测试。 |\n| 超时 (timeouts) | 如果测试（或生命周期方法）的执行时间超过特定时长，则失败。\
  \ |\n\n## 总结\n\n在本章以及之前的两个深入探讨 JUnit 的章节中，你学习了编写断言、组织测试和运行测试时所需的大部分知识。\n\n有了了 JUnit\
  \ 的这一坚实基础，你可以转向更重要的问题。在书的下一部分，你将关注测试及其与系统设计之间的关系。你将在“微观层面”重构代码，因为你有测试提供了进行此操作的信心。你还将触及更大的设计概念，并学习如何设计测试以增加你投入测试的回报。\n\
