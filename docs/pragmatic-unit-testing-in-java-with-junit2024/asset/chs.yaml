  \    }\n}\n```\n\n这里是 `TransactionType` 和 `Transaction` 的声明：\n\n[`utj3-tdd/31/src/main/java/app/TransactionType.java`](http://media.pragprog.com/titles/utj3/code/utj3-tdd/31/src/main/java/app/TransactionType.java)\n\
  \n```java\npublic enum TransactionType {\n    BUY, SELL;\n}\n```\n\n[`utj3-tdd/31/src/main/java/app/Transaction.java`](http://media.pragprog.com/titles/utj3/code/utj3-tdd/31/src/main/java/app/Transaction.java)\n\
  \n```java\nimport java.time.Instant;\npublic record Transaction(String symbol, int\
  \ shares, TransactionType type, Instant now) {}\n```\n\n在上一个增量中，你提取了 `sell` 和 `purchase`\
  \ 之间的冗余，创建一个新的 `updateShares` 方法。出于几个原因：\n\n- 它增加了抽象级别，从而提高了代码的可理解性。\n- 它提高了解决方案的简洁性。\n\
  \n添加第二个测试以确保交易类型被正确设置：\n\n[`utj3-tdd/32/src/test/java/app/APortfolio.java`](http://media.pragprog.com/titles/utj3/code/utj3-tdd/32/src/test/java/app/APortfolio.java)\n\
  \n```java\n@Test\nvoid returnsLastTransactionAfterSale() {\n    portfolio.purchase(\"\
  SONO\", 200);\n    portfolio.sell(\"SONO\", 40);\n    assertEquals(portfolio.lastTransaction(),\
  \ new Transaction(\"SONO\", 40, SELL, now));\n}\n```\n\n\n\n\n\n```java\nvoid injectFixedClock()\
  \ {\n  Clock clock = Clock.fixed(now, ZoneId.systemDefault());\n  portfolio.setClock(clock);\n\
  }\n\n@Test\nvoid returnsEmptyListWhenNoTransactionsMade() {\n  assertTrue(portfolio.transactions().isEmpty());\n\
  }\n\n@Test\nvoid returnsListOfTransactionsReverseChronologically() {\n  portfolio.purchase(\"\
  A\", 1);\n  portfolio.purchase(\"B\", 2);\n  portfolio.purchase(\"C\", 3);\n\n \
  \ assertEquals(portfolio.transactions(), List.of(\n    new Transaction(\"C\", 3,\
  \ BUY, now),\n    new Transaction(\"B\", 2, BUY, now),\n    new Transaction(\"A\"\
  , 1, BUY, now)\n  ));\n}\n```\n\n虽然这里为了简化书中的演示展示了两个测试，但请确保逐量地编写每个测试，并分别为它们开发解决方案。一次性编写多个测试是不恰当的\
  \ TDD 实践。\n\n实现代码：\n\n`utj3-tdd/33/src/main/java/app/Portfolio.java`\n\n```java\n\
  import java.time.Clock;\nimport java.util.LinkedList;\nimport java.util.List;\n\
  // ...\npublic class Portfolio {\n  private Transaction lastTransaction;\n  private\
  \ LinkedList transactions = new LinkedList();\n  // ...\n  private void updateShares(String\
  \ symbol, int shares, TransactionType type) {\n    lastTransaction = new Transaction(symbol,\
  \ abs(shares), type, clock.instant());\n    transactions.addFirst(lastTransaction);\n\
  \    purchases.put(symbol, sharesOf(symbol) + shares);\n  }\n\n  public Transaction\
  \ lastTransaction() {\n    return lastTransaction;\n  }\n\n  public List<Transaction>\
  \ transactions() {\n    return transactions;\n  }\n  // ...\n}\n```\n\n你不再需要 `lastTransaction`\
  \ 字段了，因为你可以从交易列表中提取最近的交易。你需要修改 `updateShares` 和 `lastTransaction`get 方法。确保在之后删除该字段。\n\
  \n`utj3-tdd/34/src/main/java/app/Portfolio.java`\n\n```java\nprivate void updateShares(String\
  \ symbol, int shares, TransactionType type) {\n  var transaction = new Transaction(symbol,\
  \ abs(shares), type, clock.instant());\n  transactions.addFirst(transaction);\n\
  \  purchases.put(symbol, sharesOf(symbol) + shares);\n}\n\npublic Transaction lastTransaction()\
  \ {\n  return transactions.peekFirst();\n}\n```\n\n此时你可能认为这种方案设计是有缺陷的。它使用了两个不同的数据结构来管理本可以用一个结构就表示的信息。如果你将交易列表视为“记录文档”，那么关于投资组合的所有查询都可以从中计算出来。在\
  \ `purchases` `HashMap` 中捕获的信息本质上是一种优化后的计算。\n\n双数据结构的实现是日后灾难的根源，尤其是作为解决方案时。\n\n\
  ## 测试驱动开发 vs. 测试后开发\n\nTDD 将你学到的关于单元测试的所有概念放入一个简单且有纪律的循环中：编写测试、让其通过、确保代码整洁，然后重复。采用\
  \ TDD 可能会改变你对设计的思考。\n\nTDD 周期非常短。如果没有伴随此示例的闲聊，每个“测试-代码-重构”循环可能只需要几分钟。每一步编写或更改的代码增量同样很小。\n\
  \n一旦你建立了 TDD 的短周期节奏，当你陷入死胡同时就会变得显而易见。设定一个大约十分钟的常规时间限制。如果你在过去的十分分钟内没有收到任何积极反馈（通过测试），请丢弃正在工作的内容并重试，采取更小的步骤。\n\
  \n是的，你没听错——丢掉昂贵的代码。将每个 TDD 循环视为一个限时实验，其测试就是假设。如果实验出现偏差，重新启动实验并缩小假设的范围（采取更小的步骤）可以帮助你确定问题出在哪里。\n\
  \n以下是我们在进行 TAD 时没有编写足够测试的简短原因：\n\n1. 我们没时间了，并且被要求继续进行。“我们只需要发布产品。”\n2. 因为通常很困难，我们有时会放弃，特别是当我们被要求继续进行时。\n\
  3. 我们认为我们的代码并不烂。“我刚写了这个，它看起来极了。”\n4. 我们避免它，因为单元测试没有编写生产代码那么精力。\n5. 有人告诉我们要这样做，这对某些人来说可能是另一个打击。\n\
  \n如果你认为 75% 和 100% 之间几乎没有区别，请重新阅读《覆盖率多少才足够？》。至少请记住，75% 的覆盖率意味着你系统中的四分之一代码仍处于风险之中。\n\
  \nTAD 可能比 TDD 更难。为了让代码形状适应测试，似乎比让测试去适应代码要简单得多。\n\n## 总结\n\n在本章中，你游览了 TDD 的实践，它将你学到的关于单元测试的所有概念放入一个简单且有纪律的循环中：编写测试、让其通过、确保代码整洁，然后重复。采用\
  \ TDD 可能会改变你对设计的思考。\n\n\n\n\n\n你上次学习了 `TDD`，这是一个你可以独立运用的概念。当你在团队环境中工作时，转到 `TDD`\
  \ 是将你的单元测试实践提升到更高、更具纪律性水平的有效方法。在本章中，你将学习在团队环境中进行单元测试的其他一些考虑因素。\n\n如果你和我们大多数人一样，你正与其他团队成员一起工作一个项目。你希望在单元测试方面与他们达成共识。在本章中，你将学习团队必须商成的工作协议，以避免在无休止的争论和代码反复浪费浪费时间。包括测试标准、代码/测试评审以及持续集成。\n\
  \n## 快速上手\n\n引入单元测试这样的新实践需要持续的警惕。即使你喜欢编写单元测试，并且善于覆盖你编写的新代码，你有时会在团队内部面临一场苦战。他们可能没有你那么警觉，而且他们产代码的速度可能远超你的测试能力。你还可能面临一个为了赶上截止日期而坚持要放弃所有安全措施（包括测试在内）的团队。\n\
  \n“单元测试不是免费的，”Joe 说道，“我们必须在两周内交付。我们落后太多了，现在只需要飞快写代码。”\n\nLucia 回答 Joe：“在冲刺阶段（crunch\
  \ mode）下放弃单元测试是最糟糕的时机。在短时间内挤入大量代码将导致一团糟。要确定一切是否仍然正常以及修复出现的缺陷需要更长的时间……而且缺陷会更多。无论如何，如果我们为了短期利益而放弃质量，将付出惨痛的代价。”\n\
  \n“没有测试的胡乱写代码只能让我们快那么一会——也许只有几天。我们不可避免地会遇到需要长时间调试的严重缺陷。也许最糟糕的是，我们会创建出一大块将永远让我们付出代价的遗留代码。抱歉，Joe，放弃单元测试是不值得的。”\n\
  \n无论你的开发能力有多强，都没有什么能让你在最后时刻的冲刺中毫发无损。一旦陷入了那种境地，你所做的就是谈判或过度加班。但如果你从第一天起坚持质量控制，这种情况就不会发生得那么频繁。\n\
  \n单元测试是这些质量控制的一部分。让我们看看如何确保它在你的团队中成为一种习惯。\n\n## 与团队达成共识\n\n单元测试的方法在不同开发者之间可能差异巨大。有些人坚持使用\
  \ `TDD`。另一些人不惜一切代价拒绝单元测试，只编写他们觉得是被迫写的测试。有些人倾向于将多个用例合并到一个测试方法中。有些人更青睐较慢的集成测试。有些人会不同意你从书中学到的其他建议。\n\
  \n你的团队必须达成共识，无论是关于单元测试标准，还是关于你最初如何评审代码。长期的争论或没有解决的反复反复都是对大家时间的浪费。你们永远不会同意所有事情，但你可以快速发现你们认同的部分，并随着时间的推移增加共识。\n\
  \n你的团队可以在团队章程（chartering）活动中建立初始工作协议。`Liftoff` LN17 是促进有效章程会议的指南。\n\n### 建立标准\n\n\
  你希望围绕单元测试制定一些标准。从最简单的开始。回答两个问题：\n\n* 哪些代码（以及测试）相关的元素正在浪费我们的时间？\n* 我们可以快速达成共识的简单标准是什么？\n\
  \n进行一个不到小时的讨论，产生一份简短的标准列表，或者，得到一个清晰体现这些标准的代码示例。随着时间的推移，确保标准保持相关性并被遵守。在违反标准时引用它们，在产生分歧时评审它们，并在需要时进行修订。\n\
  \n这里有一份简短的、不完整的单元测试实践标准列表：\n\n* 开发者在提交（check-in）之前应该运行哪些测试\n* 如何为测试类和测试方法命名\n* 是使用\
  \ `JUnit` 的断言还是像 `AssertJ` 这样的断言库\n* 是否使用 `AAA` 模式\n* 优先使用哪种 mock 工具\n* 是否禁止测试运行时的控制台输出（请这样做）\n\
  * 如何在单元测试套件中识别并抑制缓慢测试\n\n你的团队应该迅速采纳并遵守大多数大多数标准。某些标准需要持续的警惕，例如消除测试运行中的所有控制台输出。你可以通过自动化解决方案来确保人们遵守；否则，你可能会发现自己在不断骚扰同事。你还可能发现某些标准并不值得花精力。\n\
  \n### 通过事后评审提高质量\n\n为了确保每个人都遵守标准，你的团队必须通过某种形式的代码评审施加集体同伴压力。团队在代码和单元测试上的投入太贵了，不允许个人对代码库进行随心所欲的操作。\n\
  \n许多团队要求拉取请求（`PRs`）——这是一个与 `GitHub` 关联最密切的功能。开发者对一个认为已准备好到 `main` 分支的工作提交拉取请求。`GitHub`\
  \ 通知团队的其他成员，由他们对更改进行评审和评论。评审人员通过将请求合并（merge）到 `main` 分支来批准请求。\n\n`PR` 过程已成为许多组织的首选标准。虽然它看起来很高效，但\
  \ `PR` 过程是评审机制中效率最低的。这是因为它是最不灵活的——试图通过减少面对面的人类互动来简化评审。[30]\n\n你可以发起评审会议，让单元测试生成者向团队中的其他成员寻求反馈。这种事后评审可以从非正式的走查（walkthroughs）范围到相当正式的过程，如\
  \ `Fagan inspections`。[31]\n\n\n\n\n\n结果，事后审查（post facto reviews）发现的缺陷比我们预期的要少。审查人员可以发现许多表层缺陷和风格违规，但他们往往会错过更深层次的缺陷，而这些缺陷通常只有在你深陷于手头的挑战时才会考虑到。此类问题在事后修复往往更加困难，因为它们可能与现有解决方案深度交织在一起。\n\
  \n其次，如果存在严重问题，事后审查就太晚了。一旦代码构建完成并看起来已经就绪，团队通常面临着巨大的交付压力——来自同事、经理甚至他们自己的人的压力。他们不会准备好退后一步，去对那些据称已经可以运行的代码进行重大重构。结果是，团队承担了有问题的软件，这在未来将使他们付出更高的维护成本。\n\
  \n简而言之，事后审查太晚了，而且可能几乎不值得其投入的时间。换句话说，执行工作、审查工作、重构工作并再次审查，是一个低效的过程。\n\n### 通过结对编程进行主动审查\n\
  \n一个良好的评审流程应该让团队在任何人尝试实现之前，审查并拒绝糟糕的设计。在 20 世纪 90 年代，软件开发很大程度上是由“前期设计”（design-up-front）流程驱动的。团队通常会投入项目\
  \ 30% 或更多的时间产生推测性设计。在这些设计完成之前，开发工作不会开始。这些设计基于详尽细致的需求，被捕获为包含大量图表和模型的沉重文档。这在极少数情况下是有效的。\n\
  \n沉重的前期设计对我们大多数人来说是不可行的，因为它无法很好应对无处不在的“变化”。此外，无论前期投入了多少，推测性设计往往是不够的，甚至是完全错误的。\n\n\
  结对编程（pair programming）的意图在于提高质量。为了结对，两名程序员并肩工作（或远程面对面工作），共同开发出一个“两个头脑比一个头脑好”的解决方案。结对是一种主动审查的形式——参与者在编写代码的同时审查彼此的想法和代码，并在继续之前修复任何问题。结对伙伴互相帮助对方遵守单元测试等标准和实践。\n\
  \n然而，很少有实践在软件开发领域引起过如此大的争议。这种整天与其他开发者紧密合作的的想法让许多人想要逃之离席。即使实践得当，结对也会产生若干开销成本。一对人仍然可能产出一个团队其他成员认为有问题的解决方案。\n\
  \n但是，不要不加考虑地否定结对。做得好，即使是积极的反对者也能变成支持者，这可能是由于质量的提高。有些人发现其高度互动、协作的方面令人欣慰。PragPub 的文章《结对编程的好处》^([[32]](#f_0124.xhtml_FOOTNOTE-32))\
  \ 描述了其投资回报率（ROI）的一些潜力。另一篇文章《闪电结对编程》^([[33]](#f_0124.xhtml_FOOTNOTE-33)) 列出了成功结对的规则，并指了一些需要避免的陷阱。\n\
  \n交换伙伴（Pair swapping）可能价值。在任务被认为完成之前，一个新成员会替换初始结对中的一名开发者。这个第三方提供了一个没有深度参与创建当前解决方案的人的视角。他们可以帮助纠正原始伙伴未看到的清晰度或其他问题。但要意识到，在某种程度上，这个过程仍然回到了“工作-审查-重构”——新成员正在识别并帮助修复那些如果早点到达可能就不会存在的问题。\n\
  \n### 通过群编程进行主动审查\n\n也许答案是让整个团队积极审查与交付相关的所有内容——设计、测试、代码以及任何其他需求——正如该团队构建所有这些内容一样。这就是这项有着近\
  \ 15 年历史、被称为群编程（mob programming）或集体编程（ensemble programming）实践的理念。\n\n虽然它的名字可能暗示着混乱，但适当的群编程要求团队在同一个虚拟或物理空间以结构化的方式共同工作。这不是“把所有人扔进一个房间看看会发生什么”。\n\
  \n群编程时，一个人充当驱动员（driver），其工作是听取群中其他人——导航员（navigators）的要求并将他们的方向翻译成代码。在物理上，这意味着驱动员是唯一在键盘上打字的人；群的其他人在共享显示器上观察。\n\
  \n在短段时间——也许几分钟之后——驱动员会将控制权交给另一个群成员。拥有绝佳主意的驱动员必须放弃座位，引导下一位驱动员理解他们的思路。\n\n这两条简单的规则最大化了参与度，并最小化了主导地位和恐惧。如果没有结构，群组通常会退化。资深团队成员会飞向他们理想的解决方案，而团队其余的人在后座困惑且无助地看着。但通过短时间轮换和必须遵循指示的驱动员，任何人都很难主导。\n\
  \n驱动员的角色是一个短暂的经历，这可以使其不那么令人生畏，也因为他们并不负责知道做什么。优秀的驱动员会提高他们的听和翻译技能。他们可能开始时对某种语言一无所知，需要对其语法的详细指示（`type\
  \ public static void main, 然后是圆括号，然后是 String[]`）。起初很困难，但大多数驱动员很快就会提高，直到可以轻松地将高级指令（`写一个方法过滤客户列表，仅保留活跃客户`）翻译成代码。\n\
  \n群编程似乎比结对让更少的人逃之离席。这可能是因为结对要求持续的注意力，并强迫你与每位团队伙伴之间保持相当的亲密关系。有些伙伴永远不会合拍。在群组中，你不需要在整个开发过程中都处于“风暴中心”，这与结对工作时不同。\n\
  \n群编程会议可能非常有效。群编程消除了在子团队（无论是配对还是个人）之间分配工作的大部分成本。不仅可以消除评审会议（因为大家都在！），而且像站会、迭代计划和拉取请求之类的仪式消失了或大大简化了。由于大家都在现场，你们早发现问题，得出了大家都能接受的设计，统一了团队标准，拥有了所需的知识，并编写了所有的测试。\n\
  \n最重要的是（对我而言），群会议通常非常有趣，我经常觉得我们完成了更多工作。\n\n如果你选择群编程或结对编程，你仍然会产生个人工作产物。确保对这些工作使用事后审查流程。\n\
  \n\n\n\n\nCI 构建的测试验证了集成后的代码库运行符合预期。如果开发者推送了代码且任何 CI 测试失败，构建就会失败，团队将收到该问题的通知。因此，在\
  \ CI 中运行的单元测试建立了一个中心化的、权威的标准。\n\n| ![images/aside-icons/note.png](img/note.png)\
  \ | CI 测试失败意味着系统无法部署。在进行任何其他操作之前，请解决它们。 |\n| ![images/aside-icons/note.png](img/note.png)\
  \ | 像 `Git` 这样的工具可以配置为在本地单元测试失败时中止提交/推送尝试。 |\n\nCI 是实践持续部署（CD）的基础，在 CD 中，每次成功的构建都会触发到生产环境的部署。Amazon^([[35]](#f_0124.xhtml_FOOTNOTE-35))\
  \ 和 Netflix^([[36]](#f_0124.xhtml_FOOTNOTE-36)) 是每天使用 CD 向生产环境部署数次的公司。\n\n### 冲突与合并\n\
  \n如果两个或多个不同的开发者分别对同一代码库进行更改，他们的合并可能会破坏系统（尽管单个贡献在集成之前是有效的）。为了让 CI 正常工作，每个想要推送的开发者必须首先从中央仓库拉取最新代码。他们运行他们出色的单元测试套件以确保没有出现问题，然后推送这些现在成为系统最新版本的内容。如果他们没有出色的单元测试套件，他们必须先仔细检查合并后的代码。（推论：没有出色单元测试套件或其他综合测试套件的人通常没有在实践\
  \ CI。）\n\n一个创建了可靠测试套件的健康团队会频繁集成。一些实践 TDD（测试驱动开发）的团队会在每个 TDD 周期推送代码，换句话说，每隔几分钟就一次。一旦他们实现了新功能并清理了代码，就会集成这个新增量。CI\
  \ 的这种“持续”特性有助于其运行并取得成功。反馈更及时，且增量更小。在这样微小的增量中，发现并修复问题更容易也更快。\n\n相比之下，水平较低团队的开发者会推迟集成他们的更改，直到功能完成。他们通常在一天、几天、有时几周的时间内在代码分支上进行更改。随后必须集成的新代码量可能巨大，因此极有可能与现有代码发生冲突。\n\
  \n开发者可能花费数小时甚至几天时间来管理细致的手工合并过程，以集成一个长期分支。这种噩梦的正确技术术语是“合并地狱”（merge hell）。噩梦的持续时间通常随着分支的时长成比例增加。\n\
  \n更好的沟通和分工有助于减少代码冲突和合并地狱。但也要考虑结结编程（参见 [*Active Review via Mob Programming*]](#f_0122.xhtml_ref.mob.programming)）。\n\
  \n### 集成流程清单\n\n以下是你作为开发者实践持续集步骤总结：\n\n1. 从中央仓库拉取以更新本地代码库。\n2. 修改代码并在过程中运行单元测试。\n\
  3. 从仓库拉取以集成同事的任何新更改。\n4. 根据需要手动检查引入的更改。\n5. 运行测试以确保集成后的代码工作正常。\n6. 将你的更改推送到中央仓库。\n\
  \n如果任何测试失败，请勿进入下一步。\n\nCI 流程对昂贵的代码形成了一种健康的同伴压力。开发者会很快习惯在提交之前运行单元测试，以免因导致 CI 构建过程失败而浪费同事的时间。\n\
  \n| ![images/aside-icons/tip.png](img/tip.png) | CI 服务器是构建现代开发团队的最低配置。 |\n\n## 总结\n\
  \n在单元测试方面，你和你的团队必须达成共识。如果这对你的团队来说是全新的，需要时间来采纳并内化为一种有益的习惯。如果这是一项现有实践，你的团队做法可能需要改进。\n\
  \n在本章中，你从实现和流程两个角度学习了如何建立团队层面的单元测试标准。你还学习了有助于确保测试质量的活跃评审机制——特别是结结编程和结对编程。最后，你发现了\
  \ CI 在单元测试中扮演的关键角色。\n\n最后：时代正在快速变化。AI 已经进入了软件开发领域。与之前的尝试（有人还记得 Prolog 和 4GLs 吗？）不同，AI\
  \ 的影响无处不在，不仅在软件开发中，还在我们许多人的日常。AI 的改进正在加速，几乎不可能消失。\n\n是的，在 AI 时代，单元测试仍然非常相关。继续下去发现它是如何做的。\n\
  \n#### 脚脚\n\n[[30]](#f_0122.xhtml_FNPTR-30)\n[`medium.com/pragmatic-programmers/prs-shift-left-please-part-one-b0f8bb79ef2b`](https://medium.com/pragmatic-programmers/prs-shift-left-please-part-one-b0f8bb79ef2b)\n\
  [[31]](#f_0122.xhtml_FNPTR-31)\n[`en.wikipedia.org/wiki/Fagan_inspection`](http://en.wikipedia.org/wiki/Fagan_inspection)\n\
  [[32]](#f_0122.xhtml_FNPTR-32)\n[`langrsoft.com/ftp/pragpub-2011-07.pdf`](https://langrsoft.com/ftp/pragpub-2011-07.pdf)\n\
  \n\n\n\n\n我经常看到当 LLM（大语言模型）为现有代码库添加新功能时，往往会发生失败。在本章中，你将探索如何帮助你的 LLM 在应对这一挑战时表现更好。但如果任其自流，LLM\
  \ 在添加新增量内容时，越来越可能会破坏现有功能。\n\n| ![images/aside-icons/important.png](img/important.png)\
  \ | 不要信任任何 AI 生成的代码是正确的。 |\n\n尽管如此，我感到有些惊喜：大多数时候，LLM（包括 `ChatGPT`、`Meta.ai` 和 `Claude`）为我生成的代码是正确的。但我也见过它们生成了足够的错误代码，让我知道永远无法完全依赖它们。\n\
  \n正由于这些局限性，产生了一个关键需求：如果你打算使用 AI 工具生成代码，你就需要创建并运行测试。\n\n幸运的是，你已经读了这本书的其余部分（对吧？），并且知道如何做到这一点。更好的是，AI\
  \ 将通过编写测试代码来提高你的速度。\n\n对你的结对编程伙伴——无论是人工智能还是人类——保持信任，但假设你们都可能犯错。доверяй, но проверяй。（“信任，但要验证。”）\n\
  \n注意：在我写这里时，你也可以使用如 `GitHub Copilot`、`JetBrains AI Assistant` 和 `Duet` 等工具来帮助开发。这些工具建立在一个或多个\
  \ LLM 之上，提供的可以被称为 AI 辅助代码补全。我强烈建议将它们整合到你的日常代码开发过程中。然而，在本章中，你将专注于使用测试驱动的过程在类级别上生成代码——意图是最大化\
  \ AI 能够为你生成的（已验证的）代码量。\n\n## 使用 ChatGPT 探索简单示例\n\n通过提示词（prompting）与 LLM 交互是一种对话。当我下次与它对话时，这种对话可能会完全不同。因此，本章最好被读作关于我与\
  \ `ChatGPT` 在一个小示例上进行个人互动的故事。因此，与书中其他不同，本章以第一人称过去时态编写。\n\n我与 OpenAI 的聊天机器人 `ChatGPT`\
  \ 进行了对话，当时它基于 `GPT-4` LLM。我随后提到的 `ChatGPT` 指的就是这种配置。虽然可能存在其他经过训练以针对编程任务进行优化的模型（例如\
  \ `Code Llama`），但我在本章中转述的经验了一种对于几乎任何当前 LLM 都有效且随着时间推移而变得更好的方法。\n\n我负责制作一个活动签到列表。给定一个参与者列表，我需要编写代码对他们进行排序。参与者的名字以名开头，后面跟着零个或多个“中间名”，最后是姓或姓氏。一些示例如下：\n\
  \n| ​  | Jeffrey John Langr |\n| ​  | John Jacob Jingleheimer-Schmidt |\n| ​  |\
  \ John Yossarian |\n| ​  | Arthur Ignatius Conan Doyle |\n\n签到列表需要根据姓的字母顺序显示名字，而不是根据名。我必须“规范化”每个名字，然后转换为“姓,\
  \ 名 中间首字母.”的形式：\n\n| ​  | `Langr, Jeffrey J.` |\n| ​  | `Jingleheimer-Schmidt, John\
  \ J.` |\n| ​  | `Yossarian, John` |\n| ​  | `Doyle, Arthur I. C.` |\n\n噢，确实是 I.\
  \ C.：中间名被转换为首字母。这些示例中隐含的其他规则还包括一个显而易见的实：名字由空格分隔，并且在每个姓氏之后应该出现一个逗号。\n\n我专注于单个名字的规范化任务，推迟了名字列表排序这一琐碎任务。然而，我想先教我的\
  \ LLM 如何编写代码，以帮助我和 `ChatGPT` 更好地协作。\n\n## 建立 Java 标准\n\n默认情况下，`ChatGPT` 生成的代码是分步进式的，需要太多时间才能完全理解。我希望它能做得更好，因此我提供了一个描述我想要的代码种类的提示词：\n\
  \n你：\n\n我将要求你编写 Java 代码。请以 Jeff Langr 的身份编写所有代码。Jeff Langr (Jeff) 有一套特定的编码标准。以下是你针对\
  \ Java 语言编程标准的规则，在适当的情况下我将将其称为 `Jeff-Java`。\n\n1. 在声明局部变量且编译器允许时，使用 `var`。\n2. 在可能的情况下，优先使用流（streams）功能，并使用流函数（如\
  \ `map()` 和 `filter()`）实现迭代操作。\n3. 对于任何所有复杂的表达式——数学、复杂条件、谓词等——将代码提取到单独的函数中。对于链式流表达式中的\
  \ lambda 也是应该是。\n4. 一般而言，对于任何复杂性，创建非常短的、揭示意的函数。\n5. 在大多数情况下避免使用临时变量，除非有充分的理由使用它们（例如，在单个表达式中使用多次）。相反，将临时变量的初始化提取到与临时变量同名的单独函数中，然后内联该临时变量以将其移除。\n\
  \n`ChatGPT` 确认了我的请求：\n\nCHAT-GPT：\n\n明白了！啦啦啦……\n\n你可能会奇怪，我为什么何要费心告诉我的 LLM 去改进代码。如果\
  \ LLM 能生成我需要的代码，我就不必阅读它了。\n\n然而，回想前面提到的如 `ChatGPT` 等 LLM 的局限性。它们有时会出错……就像你我一样。你必须阅读并手动更新某些代码。即使这种需求可能随着时间减少，整理你的代码（通过创建小类）似乎会增加\
  \ LLM 生成代码正确的概率。\n\n## 为 ChatGPT 提供示例\n\n单元测试驱动系统仍然是人类的最佳选择。但对于 LLM，可能不是。\n\n我首先尝试让\
  \ `ChatGPT` 一次性处理规范化的所有需求。结果代码一团糟，而且不起作用。我采取了更小的一步，即首先给它一个包含核心用例的子集。帮助 `ChatGPT`\
  \ 专注于我认为合理的方案——通常情况下是这样。\n\n从 LLM 获得良好结果的最佳方法之一是在提示词中提供示例。在先用英语描述我想要的内容后，我为规范器遵循了这一建议：\n\
  \n你：\n\n编写一个名为规范化器的 Java Java 代码。给定一个人的名字，名字规范化器应该先返回姓，后面跟一个逗号，然后是名。\n\n如果有或多个中间名，返回每个名字的首字母。首字母是第一个字母加一个句号。\n\
  \n假设传递方法的名字永远为空或无效。\n\n示例：\n\n| input: Plato | output: Plato |\n| input: Leonard\
  \ Cohen | output: Cohen, Leonard |\n| input: Samuel Leroy Jackson | output: Jackson,\
  \ Samuel L. |\n| input: George Raymond Richard Martin | output: Martin, George R.\
  \ R. |\n| input: Emma Azalia Smith Hackley | output: Hackley, Emma A. S. |\n\n单元测试和示例是同类项——记住第\
  \ 10 章中的提示，*简化你的测试：\n\n| ![images/aside-icons/tip.png](img/tip.png) | 良好的测试提供了客户端如何与系统交互的示例。\
  \ |\n\n因此，告诉我的 LLM 将示例转换为测试：\n\n你：\n\n另外，为核心用例提供 JUnit 测试。\n\n我花了几秒钟时间审查 `ChatGPT`\
  \ 生成的测试，以确保它们与我的示例正确对齐。`ChatGPT` 做得不错，生成的测试使用了和我提供的示例相同的数据：\n\n```java\nimport org.junit.jupiter.api.Test;\n\
  ```\n\n\n\n\n\n```java\nimport org.junit.jupiter.api.Assertions.assertEquals;\n\n\
  public class NameNormalizerTest {\n\n    @Test\n    public void testSingleName()\
  \ {\n        assertEquals(\"Plato\",\n        NameNormalizer.normalizeName(\"Plato\"\
  ));\n    }\n\n    @Test\n    public void testFirstNameLastName() {\n        assertEquals(\"\
  Cohen, Leonard\",\n        NameNormalizer.normalizeName(\"Leonard Cohen\"));\n \
  \   }\n\n    @Test\n    public void testMultipleMiddleNames() {\n        assertEquals(\"\
  Jackson, Samuel L.\",\n        NameNormalizer.normalizeName(\"Samuel Leroy Jackson\"\
  ));\n        assertEquals(\"Martin, George R. R.\",\n        NameNormalizer.normalizeName(\"\
  George Raymond Richard Martin\"));\n    }\n\n    @Test\n    public void testLongName()\
  \ {\n        assertEquals(\"Hackley, Emma A. S.\",\n        NameNormalizer.normalizeName(\"\
  Emma Azalia Smith Hackley\"));\n    }\n}\n```\n\nChatGPT 在处理 `testMultipleMiddleNames`\
  \ 和 `testLongName` 测试时稍有些困惑。我后来让 ChatGPT 修复了这个问题（就像我也对每个测试用例多余的 `test` 前缀做了处理）。\n\
  \nChatGPT 在生成对应的归一化实现方面做得还可以（换句话说，并不完美）：\n\n[utj3-ai/01/src/main/java/util/NameNormalizer.java](http://media.pragprog.com/titles/utj3/code/utj3-ai/01/src/main/java/util/NameNormalizer.java)\n\
  \n```java\nimport java.util.Arrays;\nimport java.util.stream.Collectors;\n\npublic\
  \ class NameNormalizer {\n\n    public static String normalizeName(String name)\
  \ {\n        var nameParts = name.split(\" \");\n        if (nameParts.length ==\
  \ 1) {\n            return name;\n        }\n\n        var lastName = nameParts[nameParts.length\
  \ - 1];\n        var firstName = nameParts[0];\n        var middleNames =\n    \
  \    Arrays.copyOfRange(nameParts, 1, nameParts.length - 1);\n\n        return formatLastNameFirst(lastName,\
  \ firstName, middleNames);\n    }\n\n    private static String formatLastNameFirst(\n\
  \        String lastName, String firstName, String[] middleNames) {\n        var\
  \ middleInitials = Arrays.stream(middleNames)\n            .map(NameNormalizer::extractInitial)\n\
  \            .collect(Collectors.joining(\" \"));\n\n        return middleInitials.isEmpty()\
  \ ?\n        String.format(\"%s, %s\", lastName, firstName) :\n        String.format(\"\
  %s, %s %s\", lastName, firstName, middleInitials);\n    }\n\n    private static\
  \ String extractInitial(String name) {\n        return name.charAt(0) + \".\";\n\
  \    }\n}\n```\n\n## 告诉你的 LLM 改进表现\n\nLLM 的解决方案通过了测试，实际上其实并不糟，但还有一些小问题需要解决。首先，它没有包含包名，这迫使我只能复制解决方案的一部分，而不是全量复制并替换生成的代码，后者要快得多。（我正在想象不久的将来，与\
  \ IDE 的集成会好得多，事实上，我已经开始写这样的插件了。）\n\n是我告诉 LLM 添加包名并解决上述问题的提示词：\n\n你：\n代码应该存放在名为 `util`\
