  \n通过将你的代码与专家程序员的代码进行对比，提高你的编码技能，让你写出干净、简洁且直击要点的代码：别人读起来愉快并愿意复用的代码。通过简单易懂的示例将缺陷代码与改进后的方案进行对比，获取实用的建议以提升你的编码风格。发现实用的技巧和窍门，以及经验\
  \ `Java` 程序员需要了解的常见 Bug。从一名 `Java` 新手蜕变为一名技艺大师。\n\nSimon Harrer, Jörg Lenhard, Linus\
  \ Dietz\n\n(206 页) ISBN: 9781680502879 $40.95\n\n### 使用 Go 自动化你的家居\n\n![](http://pragmaticprogrammer.com/titles/gohome)\n\
  \n利用 `Go` 语言的力量控制你的家和你的数据。使用与高端企业计算环境相同的工具，构建出与许多昂贵的闭源商业替代方案相媲美的卓越且稳健的家居自动化解决方案。畅销\
  \ Pragmatic Bookshelf 作者 Ricardo Gerardi 和 Mike Riley 展示了你如何利用廉价的树莓派硬件以及优秀的开源 `Go`\
  \ 软件工具（如 `Prometheus` 和 `Grafana`）来创建你自己的个人数据中心。通过书中的逐步示例，构建实用的家居自动化项目，并将其作为你自己自定义项目的蓝图。\n\
  \nRicardo Gerardi and Mike Riley\n\n(160 页) ISBN: 9798888650509 $40.95\n\n### 小巧精悍的软件工具\n\
  \n![](http://pragmaticprogrammer.com/titles/bhcldev)\n\n命令行界面正在回归。这是因为开发者知道，操作系统所有的最佳功能都隐藏在一个旨在帮助普通人使用计算机的用户界面之后。但你并不是普通用户，而\
  \ `CLI` 是快速完成工作最有效的方式。将枯燥的任务变成快速任务：读写文件、管理复杂的目录层次结构、执行网络诊断、下载文件、与 API 协作，以及组合单个程序以创建你自己的工作流。放下鼠标，打开\
  \ `CLI`，掌控你的软件开发环境。\n\nBrian P. Hogan\n\n(326 页) ISBN: 9781680502961 $38.95\n\n\
  ### 七周攻克七种冷门语言\n\n![](http://pragmaticprogrammer.com/titles/dzseven)\n\n探索七种较老的计算机语言，发现将改变你编程思维的新颖且新颖的想法。这些语言在我们定型目前的\
  \ `C` 风格语法和面向对象偏好之前就已经发明了，因此语言设计者可以自由想象各种可能性。你会发现它们的见解发人深省，它们的思想将启发你尝试不同的（可能更高效的）编程方式。从一种每行都是潜在状态机事件的文本处理语言，到一种完全使用\
  \ Actor 模型（actors）完成的并发语言，你一定会从这七种语言中获得灵感并感到兴奋。\n\nDmitry Zinoviev\n\n(270 页) ISBN:\
  \ 978888650639 $55.95\n\n### 测试驱动的 React（第二版）\n\n![](http://pragmaticprogrammer.com/titles/treact2)\n\
  \n将你的 `React` 项目需求转化为测试，获得比任何时候都更快的反馈。在编码环境中直接结合测试、代码检查（linting）和类型检查的力量，无畏地迭代 `React`\
  \ 组件！\n\nTrevor Burnham\n\n(172 页) ISBN: 9798888650653 $45.95\n\n### 成为卓越工程主管\n\n\
  ![](http://pragmaticprogrammer.com/titles/jsenglb)\n\n当你进入高级工程领导角色时，你需要产生影响力，而且要快。这本书将揭示成为成功的工程总监、工程副总裁或\
  \ `CTO` 的秘密。通过实战且实用的方法，它将帮助你理解并培养所需的技能，从如何管理管理者、如何定义和执行战略、如何管理你自己和有限的时间，以及如何引导你的职业生涯走向目的地。\n\
