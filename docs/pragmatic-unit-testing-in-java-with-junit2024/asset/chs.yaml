  \ 提取概念：为匹配项计算分数\n\n现在你已经通过将其提取到新方法中隔离了 `anyMatches` 逻辑，你也可以对计算分数的代码进行相同的操作。然而，如果你将\
  \ `calculateScore` 的调用放在 `if (kill) return false` 之下，测试将会失败。（因为在任何未满足的必要标准导致方法中止之前，需要先计算分数。）\n\
