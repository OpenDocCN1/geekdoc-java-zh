  \ |\n\n\n\n\n你进行的每一次提取提取都会一点点地提高匹配逻辑的简洁性。为新方法使用揭示意图的名称也能增加匹配逻辑的清晰度。新方法还代表了将职责移动到它们所属位置的机会。`Profile`\
  \ 变得更简单了，而之前空如的 `Criterion` 则变得越来越有用。\n\n## 移除价值较小的临时变量\n\n临时变量（`temps`）有许多用途。它们可以缓存昂贵计算的结果，或者收集在方法体范围内发生变化的内容。`temp`\
  \ 还可以明确代码意图——即使它只使用一次也是一个有效的选择。\n\n在 `matches` 中，`answer` 局部变量并没有提供上述三个优点任何一个。你可以通过将它的所有出现处替换为\
  \ `answerMatching(criterion)` 表达式来内联这个毫无意义的变量。在 IntelliJ IDEA 中，按照以下步骤内联变量：\n\n\
  1. 点击它的名称。\n2. 打开上下文菜单（通过右键点击）。\n3. 从菜单中选择 `Refactor ▶ Inline Variable`。\n\n对该变量的所有引用都将被替换为赋值右侧的内容。赋值语句将消失：\n\
  \n`/utj3-refactor/07/src/main/java/iloveyouboss/Profile.java`\n\n```java\npublic\
  \ boolean matches(Criteria criteria) {\n    // ...\n    for (var criterion: criteria)\
  \ {\n        var match = criterion.isMatch(profileAnswerMatching(criterion));\n\
  \        // ...\n    }\n}\n```\n\n`match` 的真实意图可以被直接理解。换句话之：当准则与对应的配置 答案匹配时，则存在一个匹配。\n\
  \n### 通过自动化重构加速\n\n当然，你可以手动执行此操作或任何其他重构，通过剪切和粘贴小段代码直到达到相同的结果。但一旦你学到一个良好的 IDE 执行速度至少可以快十倍，那么不利用这种力量就没什么意义了。\n\
  \n更重要的是，你可以相信（至少在 Java 中是这样）自动化重构通常不会破坏代码。在手动重构的过程中，你出错的概率要大得多。Java 自动化重构是在各种意义上都已证明是可靠的代码转换。\n\
  \n你可以通过使用每个自动化重构的快捷键来进一步加速，而不是反复点击菜单和对话框。在整个开发日中，你会发现频繁使用少数几个核心自动化重构：引入变量/常量/字段/参数、提取方法、内联方法、内联变量、移动方法和更改签名。记住相应的快捷键不会花费长时间。你可以将大多数重构操作从\
  \ 10 秒或更多（点击 UI）或从几分钟（手动）缩短到大约三四秒。\n\n你真幸运：20 年前，大多数 Java 程序员以极不安全的方式手动移动代码。三十年前，自动化重构工具还不存在。今天，它们所赋予的力量和速度是无法估量的。你可以看着电脑完成脏力活，并知道你的代码仍然运行正常。\n\
  \n## 放大代码的核心意图\n\n让我们重新审视稍微改进过的 `matches` 方法：\n\n`/utj3-refactor/07/src/main/java/iloveyouboss/Profile.java`\n\
  \n```java\npublic boolean matches(Criteria criteria) {\n    score = 0;\n    var\
  \ kill = false;\n    var anyMatches = false;\n    for (var criterion: criteria)\
  \ {\n        var match = criterion.isMatch(profileAnswerMatching(criterion));\n\
  \        if (!match && criterion.weight() == REQUIRED) {\n            kill = true;\n\
  \        }\n        if (match) {\n            score += criterion.weight().value();\n\
  \        }\n        anyMatches |= match;\n    }\n    if (kill) {\n        return\
  \ false;\n    }\n    return anyMatches;\n}\n```\n\n仔细阅读可以揭示以下结果：\n\n- 如果任何准则匹配，则返回\
  \ true；如果都不匹配则返回 false。\n- 通过累加匹配准则的权重来计算得分。\n- 当任何要求的准则不匹配对应的配置答案时，返回 false。\n\n\
  让我们重构 `matches` 以直接强调这三个核心概念。\n\n### 提取概念：是否存在匹配？\n\n是否存在匹配的判断分散在整个方法中。它涉及到 `anyMatches`\
  \ 和 `matches` 变量：\n\n`/utj3-refactor/08/src/main/java/iloveyouboss/Profile.java`\n\
  \n```java\npublic boolean matches(Criteria criteria) {\n    score = 0;\n    var\
  \ kill = false;\n    var anyMatches = false;\n    for (var criterion: criteria)\
  \ {\n        var match = criterion.isMatch(profileAnswerMatching(criterion));\n\
  \        if (!match && criterion.weight() == REQUIRED) {\n            kill = true;\n\
  \        }\n        if (match) {\n            score += criterion.weight().value();\n\
  \        }\n        anyMatches |= match;\n    }\n    if (kill) {\n        return\
  \ false;\n    }\n    return anyMatches;\n}\n```\n\n你的目标：将所有与该判断相关的逻辑移动到它自己的方法中。步骤如下：\n\
  \n1. 将返回语句改为返回调用新方法 `anyMatches()` 的结果。\n2. 创建一个新方法 `anyMatches`，返回 `Boolean` 值。\n\
  3. 将相关逻辑复制（不要剪切）到新方法中。\n\n结果是：\n\n`/utj3-refactor/09/src/main/java/iloveyouboss/Profile.java`\n\
  \n```java\npublic boolean matches(Criteria criteria) {\n    score = 0;\n    var\
