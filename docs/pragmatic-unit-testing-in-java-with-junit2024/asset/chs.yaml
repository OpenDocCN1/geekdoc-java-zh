  \n## 测试异味：隐含含义\n\n每个测试都必须清晰回答的大问题：它为什么期望那个结果？开发者必须能够将任何断言与安排步骤联系起来。不清晰的关联迫使开发者在代码中寻找意义。\n\
  \n\n\n\n`returnsMatchesWithSurroundingContext` 测试在一个长字符串中搜索 \"practical joke\"，并期望找到一个匹配项。有耐心的读者可以确定\
  \ \"practical joke\" 出现的位置，然后发现它之前的十个字符和后面的十个字符代表了以下字符串：\n\n| ​  | \"or a vast practical\
  \ joke, though t\" |\n\n但让开发者去苦苦寻找理解含义是不礼貌的。通过选择更好的测试数据来让变得显式化。更改输入流以包含少量的文本。然后，修改内容使得周围的上下文信息不需要显式计数：\n\
