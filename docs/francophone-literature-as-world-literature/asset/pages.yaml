  md: '# Literatures as World Literature


    Can the literature of a specific country, author, or genre be used to approach
    the elusive concept of “world literature”? **Literatures as World Literature**
    takes a novel approach to world literature by analyzing specific constellations—according
    to language, nation, form, or them—of literary texts and authors in their world-liter
    dimensions. World literature is obviously so vast that any view of it cannot help
    be partial; the question then becomes to reduce the complex task of understanding
    and describing world literature. Most treatments of world literature so far have
    either been theoretical and thus abstract, or have made broad use of exemplary
    texts from a variety of languages and epochs. The majority of critical work, in
    the filling of what has been traced, lies ahead of us. **Literatures as World
    Literature** fills in the devilish details by allowing scholars to move outward
    from their own areas of specialization, fostering the polyphonic, multispectral
    nature of world literature.


