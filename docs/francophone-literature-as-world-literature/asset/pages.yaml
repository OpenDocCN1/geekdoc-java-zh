    that Trouillot''s use of narrative devices as multiple points of view and lengthy
    interiorologues highlights the complex relational dynamics of class in modern-day
    Port-au-Prince.


    By writing class differences into and through her narrative techniques, Trouillot
    puts pressure on a contentious social topic, revealing the depths of the cleavages
    and inciting us to ask questions about how these differences manifest in society.
    What does it mean to live by side yet never interact with people of vastly divergent
    status? How does one make sense of social inequalities from a philosophical perspective?
    In raising these questions, Trouillot gestures towards a broader issue, that of
    class disparity as a problem throughout the Global South.


    Setting during the early 2000s, Le Rond-point reflects the daily lives of Sorel,
    Titi, and Dominique, from different socioeconomic backgrounds. The inequalities
    between their disparate worlds are reflected in the narrative structure—the narrators
    alternate in each chapter, which has the effect of containing their stories, and
    thus their worlds, within a chapter. This material division of isolated chapters
    reflects how rigidly social mobility fails. Class hierarchies are viewed as fixed
    and easily maintained. When examined from the perspective of the protagonist''s
    reflections about class barriers, the individual chapters display insightful social
    comments specific to the main characters'' social positions: Sorel, a young from
    a poor background, an eleven-year-boy from a modest working-class milieu, is uneasy
    about his place in society; and Dominique, a woman from the elite class, is increasingly
    uncomfortable with what her life has become.


