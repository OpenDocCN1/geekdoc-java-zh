  md: '# Francophone Literature as World Literature


    So, if one version of négritude remains overinvested in postcolonial particularity,
    and thus reifying the cultural processes of racialization, a worldly négritude,
    keeps, strategically, the space of university empathy. Caliban might be ontologized
    (blackness = the colonized), and his racialization is also interpreted as incomplete,
    the condition for politizing and concretizing universality. World négritude pleads
    for this image of Caliban—a Caliban who ignores his insolent negligence. It takes
    this image of Caliban révolté to César’s most important message. At the same time,
    we recognize that remain faithful to this reading of négritude requires a certain
    بمعنى of César’s more conventional vision of nég as a return to African roots.
    In this respect, the Creols were on the right track, if we take seriously, as
    a rhetorical gesture, their statement, according to which “we can only make authentic
    sons of César’s and his thought by remaining wary of him, by deviating from the
    paths that he forged, precisely in order to respect the poet’s faithful message.”
    Creolizing Caliban—mixing strategies with those of Black Lives Matter—takes up
    the hermeneutic challenge of thinking freedom reality and globally, as opposed
    to a narcissistic obsession with black sovereignty, with self-determination as
    an end in itself, and of thinking relationality after negativity. This is the
    challenge, and the project, of Third World solidarity, of Black Lives Matter’s
    collaboration with Free Palestine, of the Standing Rock Sioux of the Dakota Access
    Pipeline, and so on. Creating Caliban and worldly négritude are one and the same.


