    respond to the realities of life in the megalopolises of the Global South.


    # 3. Monénemo as a World Author


    Perhaps no one is better attuned to the theme of global interconnectedness so
    central to the world literature approach than the exile. This has certainly been
    true of Monénemo, whose professional path as a writer is intimately bound with
    his personal and political trajectory. Born in 1947 in Porédaka, Guinea, and forced
    into exile in 1969 for his critique of the Sékou Touré réime, he lived in Senegal
    and Côte d’Ivoire before going to France in 1973. His subsequent life has taken
    him around the world, including a number of countries in the new world, notably
    Brazil and Cuba, which he has also written about in Pelourinho and Les cols cubains
    chantent à min, respectively. Although he identifies strongly as a Paul and a
    Guinean, he eschews the kind of ethnic or nationalist chauvinism that can lead
    to interethnic violence. He has, rather, a cosmopolitan outlook combined with
    an ongoing attachment to his homeland and his people, and a vision of the extent
    to which global forces penetrate the daily lives of individuals that recalls Glissant’s
    notions of relation and Tout-monde.'
