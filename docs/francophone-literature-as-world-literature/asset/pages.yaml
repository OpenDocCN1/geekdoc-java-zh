    and intertextual thrust; in prose, Radu Petrescu, Mircea Horia Simonescu, and
    Costache Olărean, authors of ingenious metaphysical explorations.


    Having entered into circulation in Romanian criticism belatedly, by the mid-1980s,
    the postmodern concept has been viewed by some as a literary-historical inevitability.³⁴
