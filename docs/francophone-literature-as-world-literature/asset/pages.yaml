    # # African Literature, World Literature, and Francophonie


    Bertrand Westphal


    There once was a tower in Babel. Afterwards, it was a real mess.


    —Raharimanana


    Each African country is a living Babel.¹


    —Nimrod


    If one considers literature on any scale other than that of the text alone, one
    wonders if we have been paying sufficient attention to the deep and multiple impact
    of globalization, a phenomenon that, in keeping as with a certain tradition of
    cultural exception, one prefers to call, in French, *mondialisation*. Skeptical
    about such a possibility, Achilles Mbembe observes in “L''Afrique qui vient”,
    an essay published in the impressive 2017 collection edited by Alain Mabankou
    *Penser et écrire l''Afrique aujourd''hui*, that “we have, then, shifted away
    from the human condition to the planetary condition.” The suggestion, accordingly,
    is that literature is now inscribed in the world, if by “world” we mean real,
    daily life, or in more theoretical terms, discourse’ “refer.” But literature is
    also inscribed in the world in another sense, the world perceived in its macroscopic
    dimension, as a globe. The latter evaries a playground for planetary stakeholders
    in a borderless economy or, conversely, the grievances following lost illusions
    for the planetary victims of an economy that creates barriers of water, brick,
    concrete, or barred wire at every crossroads. The planetary condition evoked by
    Mbembe defines, the Age of Diasporas, and to use more time language has inspired,
    for example, “Afro-diaspor creations.” Likewise, and from a more strictly literary
    perspective, we could also speak of the diaspor readership that emerged at this
    planetary moment. Furthermore, Mbembe’s statements prompt us to ask what exactly
    this refocusing of scholarship on the planet and its scale means for African literature
    in general and Francophone African literature in particular. What are the conditions
    under which this literature is produced, circulated, and interpreted? Which institutional
    and market factors shape its reception, and in what ways are these planetary relationships
    amenable'
