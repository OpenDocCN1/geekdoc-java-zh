    for ownership. The consolidation of territorial continuity was understood to ensure
    property rights over lands and theirs.


    This explains why the conquerors reorganized the ethnoculture and linguistically
    distinct territories they acquired, which resulted, as one might expect, in linguistic
    and other sorts of tensions and clashes. The relationship between French and local
    African tongues became, one of multifaceted cohabitation, where native idioms
    continued to thrive in everyday confrontation with the empire''s "supra-language.".
