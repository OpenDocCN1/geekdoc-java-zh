  md: '# Francophone African Publishing and the Misconceptions of World Literature


    Raphael Thierry


    In this essay, I wish to address some widespread misconceptions that surround
    the African book industry and thereby contribute to limiting the circulation of
    Africa''s literature around the world. These commonplaces, I suggest, protection,
    present African publishing as an endangered and subaltern species that requires
    protection through which the international book market rather than an equal-footing
    partner in this trade and, moreover, extension, in the world literature corpus.
    Such cliches persist even though literature that has long been categorized as
    "African" has consistently interrogated hegemonic and classificatory modes of
    conceptualizing "African literature" and, moreover, despite the salient rise of
    World Literature and of interest in new paradigms through which one might get
    a better grip on global cultural realities.^1 Although the Global North has been
    facoring the African publishing industry into its thinking for the last thirty
    years, it has been viewing Africa through the narrow lenses of ever-"emerging
    markets" fraught with difficulties and of "developing countries" caught in a state
    of constant technological, economic, and self-expansive or "stylistic" flux. One
    could attribute this outlook to widespread ignorance as well as a misguided approach
    to African markets, which are treated as just another piece in the global puzzle
    rather than an economy that must be analyzed, assessed, and supported according
    to its own morphology and tradition. The conversation around such issues also
    fails to take into account the industry''s actual output far too often. The critical-historical
    narrative that follows out to correct this situation.


    One illustration of this state of affairs was supplied by the 2017 Frankfurt Book
    Fair, when the world''s largest gathering of this sort hosted a roundtable on
    publishing. During this meeting, three Francophone publishers were asked about
    literacy rates and the challenge of accessing reading material in their countries.^2
    Such questions betray the problematic conservatism of the epistemological frameworks
    still dominant, which have been perpetuated through six decades of pseudoanalysis
    providing a picture of the African literary marketplace as still nascent and hampered
    by obstacles such as poor education of local audiences. The sheer absence of precise,
    contextual data on the realities of publishing in African countries has allowed
    this kind of talk to go unchallenged.^3'
