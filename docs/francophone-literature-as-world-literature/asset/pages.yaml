  md: '# Introduction: Reading Francophone Literature with the World


    ruled that its Article 11, which addressed freedom of speech and communication,
    contravened the Declaration of the Rights of Man and of the Citizen.¹⁰ Only two
    years later was an enforcement decree signed concerning how the law would be implemented.
    Officially, the new regulation concerned "the use of French language" as well
    as the idiom’s "enrichment." The legislature considered the latter indispensable
    when the proposal formally prohibited all recourse to a foreign language (with
    English the implicit target here) in government and public-sector communications,
    as well as in the workplace, advertising, consumer-goods manuals, and so forth.
    For instance, no one longer speak e-mail by courriel—a Québec contraction of "courrier
    électronique," the term, is it one may say, "Francophone."


    More importantly, the law’s opening article is relevant to the matter at hand.
    The article’s first two paragraphs are unsurpassed, the third quite unexpectedly
    references Francophone. "The French language is," we learn, "the privileged link
    among the States constituting the Francophone community."¹¹ Here, "community"
    does not necessarily mean what it did for Charles de Gaulle in the late 1950s.
    The term remains ambiguous, and it still appeared in the French Constitution at
    the Toubon Law was passed. This should have raised questions not only about the
    law of the bour or about the place of the national language in the law also outside
    the judicial context, namely, about Francophone and its literary dimension. However,
    neither Francophone nor the Francophone literary has been thoroughly examined
    from this legal perspective, even such an angle is revealing, for the extent to
    which the law and its use have been regulated by the French legislature is truly
    striking. In the Constitution, language matters have repeatedly been the object
    of amendments reflecting the preoccupations of the most, especially over the last
    decades. Taking all this into account, it is less surprising that Francophone
    makes for a major, politically sensitive issue, while as remarked earlier, no
    equivalent situation can be said for Angophone, Germanophone, or Sinophone.


    The unique legal narrative delineated here reflects, no doubt, France’s linguistic
    situation, one that had its implications on various scales. Within the country’s
    borders, the first and foremost consequence was that French became, by legislative
    force, the national language at the expense of all other tongues spoken in the
    Hexagon. This exclusive status is also more restrictive than that of the official
    languages of most France’s neighbors. Although they have established one or more
    official languages—sometimes as in Italy—these countries recognize the existence
    and use of regional idioms.¹² In France, the 1951 Deixonne Law, which preceded
    the French Republic, allowed schools to teach a number of languages described
