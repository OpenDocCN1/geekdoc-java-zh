    readership and to convey a decided social angle and interest on the part of writers.
    On the other, the natural evolutionary movement of literary and cultural forms
    leads them to diversify following the movement of history and ideas, and banlie
    literature has multiplied and divided and will continue until it is no longer
    integral. There is presently huge diversity within what has been called banlie
    literature, it may well be that banlie literature is coming to the end of its
    natural life. Today, there is no center to banlie literature, no one, and no name
    for it. It is now prospective and retrospective, male and female-authored, inner-looking
    and outer-facing. Whereas banlie literature centered on the Parisian barrios,
    banlieues surrounding Lille, Strasbourg, or Angers are in evidence. Now plotlines
    move between locations (whether intra- and extra-musros, or France and another
    country altogether) and inhabit the banlieues as the cities (not just as cites)
    that. In newer writing, the banlie-scope is sometimes literary and figurative.
    This is all to say that despite the fact that banlie literature has largely been
    contained from without, it has undergone a high level of experimentation and change,
    has defied getting fixed down, and today it is decidedly heterogeneous, or we
    could say, de-centered.


    # 3. Why BanLit Matters for the Global Literary Ecology


    A cautious note has been sounded by a range of writers, theorists, critics, and
    philosophers, including some of the writers featured here, who see danger in a
    single, homogenized story. One such writer is Chimamanda Adichie in "The Danger
    of a Single Story," in which she holds that "stories matters."34 When a single
    story dominates, places and lives are rendered flat and incomplete. A single story
    is particularly dangerous when it speaks authoritatively about a group or place,
    subjecting them to stereotyping; as is for case of Africa and the banlieues. In
    this respect, banlie literature has worked against the single story, and at the
    same time its one "center" has shifted.


    If one of the global literary ecology is creating greater prosperity among people
    and experiences through the literary imagination, shrinking views on the world
    and single stories are a threat to it. And if the preferred future is a "non-homogenous
    global literary ecology,"35 one in which English does not become a hegemony and
    in which novels do not become monocultural—what Tim Parks has'
