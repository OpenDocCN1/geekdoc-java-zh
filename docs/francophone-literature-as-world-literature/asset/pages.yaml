    both in India and in the Indian diaspora.


    The reception of such works in Indian diasporic sites around the world is worthy
    of analysis as these communities often have parallel networks in the countries
    where they live, broadening circulation in diversified circuits of interaction.
    These circuits make translations possible and also create platforms for critical
    reading. For instance, one can imagine an Indian poet Tamil in a French university
    and translating an English Sri Lankan poet''s work in French to Tamil, which has
    its readership not only among Tamils but also among Sri Lankan Tamils. Similarly,
    a Pakistani in France may translate an Indian writer''s prose from Urdu to French,
    or a Bengali may translate a Bangladeshi''s poetry from French into Bengali or
    vice versa. The Indian subcontinent provides multiple permutations and combinations
    within and outside its confines, which already create cultural spaces of readership
    distinct from the latter''s geographical origins.


    As mentioned earlier, writings from Pondicherry occupy a special place among populations
    of Indian descending in the French islands of the Caribbean or of the Indian Ocean.
    Since Indians left their shores to work as indentured labor for India is understandably
    strong. There is a community that devours the thriving sugarcane plantations in
    British and French colonies on these islands, the affinity with India strong.
    Their devotional literature from India accessible through original writing in
    French or through translation. Further, they constitute an audience that can partake
    of a “shared experience” through a collective memory kept alive by five generations.
    To date, the *Mahabharata* and the *Ramayana* continue to appeal to a great deal,
    be in Mauritius, Réunion, or the French Caribbean. But, at least in those French
    zones, Indian writing in French, too, has not lost its relevance.³⁴ As Smith notes,
    “On the border between the French world and the Indian Subcontinent, with unique
    perspectives, [Indian writing in French] could be poised for a global renaissance”⁴⁵
    if scholars, translators and critics can bring it to a a new generation of readers.”⁴⁶
    Smith could not be more right in his assessment of the kind of circulation that
    Indian writing in French could enjoy. To that effect, a proactive policy of translation
    in India not only into English but also into regional languages would help, as
    mapping Indian literature in French, through publication and critical study, before
    the last generation of writers from the erstwhile colony fades into oblivion.'
