    of how this kind of careful attention to class—one that considers the perspectives
    of characters from distinct parts of society and places them in social interactions—offers
    insight into social inequality. Nowhere is class division more evident in Le Rond-point
    than the use of three narrators to tell the story. Accordingly, I structure the
