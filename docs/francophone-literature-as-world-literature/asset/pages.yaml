    reads: "Alas! How long will it be to tell you that they should give their share
    of the city? That your blindness reflects their blindness." The poem''s message
    is clear: the rich and the poor are mutually dependent upon one another, and the
    rich should have an obligation to the poor.


    At the very least, the wealthy should understand that the lavish lives they live
    directly to the problem of social inequality. The intertextual reference to Hugo—no
