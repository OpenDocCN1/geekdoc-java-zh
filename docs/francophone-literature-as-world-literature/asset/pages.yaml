    Bi Kacou Parfait Diandué


    In an important sense, African literature written in Africa''s local languages
    reclaims a space of expression for idioms historically marginalized or even suppressed
    by French colonization. In West Africa, for example, French was imposed for a
    century as the lingua franca of research and knowledge transmission, as well as
    the exclusive idiom of colonial administration and education. Children who spoke
    their mother tongue were flogged or otherwise punished and forced to wear a distinctive
    “symbol”—a “reprobation collar—all day long.” In areas strict imperial control,
    it was similarly forbidden to speak one''s native tongue, a practice which forced
    the indigenous inhabitants to distance themselves from their first language. French
    was thwarted to out of obligation—not by choice but by coercion. We can see why
    local idioms were banned by colonial power when we look at history, which tells
    us, for instance, for the Abbeys, a population from southern Côte d''Ivoire, they
    planned their uprising against colonial brutality in messages sent to their comrades
    in their mother tongue, the colonizers neither spoke nor understood. Domestic
    servants, abused in the colonizers'' houses, organized themselves in the Abbey
    language and coordinated an attack against the railroad as well as the sabotage
    of numerous facilities. The French, in turn, saw the threat posed by local idioms
    and therefore targeted them for destruction, thereby preventing the transmission
    of the values, philosophy, and culture of existing, African tongues.


    The repressive policies of colonial administrators can also be attributed to the
    fact that colonization assimilated the conquered space to French. This desire
    to expand France''s territory accounted for the search for new markets to which
    to deliver a surplus of products manufactured by the metropolis. Let recall that
    it was the European industrial revolution that generated capitalists'' thirst
    for new outlets for trade and lands to dominate. Colonization was initially undertaken
    for commercial rather than cultural purposes, though the two have been intertwined.
    The spirit of mercantilism is, of course, bound up with acquisition, possession,
    and ownership. Furthermore, commerce justified colonial settlement and all kinds
    of violence. Even'
