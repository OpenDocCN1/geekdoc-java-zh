    where 90 percent of urban growth is now occurring, Prieto''s intervention attempts
    to show how has-found literature can contribute to this reconfiguration, that
    brings the localized centers of certain urban places into the larger problématique-monde
    of global modernity.


    In dialogue with Alexander Beecroft''s 2014 book An Ecology of World Literature,
    Laura Reeck''s chapter, ''Questions of Diversity in the Global Literary Ecology
    and banlie Literature,'' takes, next, a look at issues pertaining to the variety
    and multiplicity of idiom and literary expression in the French language. Her
    particular focus is the growing body of banlie literature. One question she asks
    whether the literary-cultural and linguistic innovations characterizing this corpus
    might strengthen or undermine the position of French as the only world idiom,
    according to Beecroft, to stand asalone ''super-central'' language in the global
    literary ecology. Reeck shows that, despite their substantial contributions, banlie
    writers still have to receive full recognition in the French literary system.
    She wonders, therefore, if constricting and restricting diversity within this
    system might not lead outside, to French being less sustainable over time as a
    core world language and to French-language literature becoming less present on
    the planet''s literary scene.


