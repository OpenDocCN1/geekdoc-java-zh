  md: '# Contributors


    **Christian Moraru** is Class of 1949 Distinguished Professor in the Humanities
    and Professor of English at University of North Carolina, Greensboro. He specializes
    in contemporary fiction, critical theory, and comparative and world literature
    with emphasis on international postmodernism and its post–Cold War developments
    and successors, as well as on the relations between globalization and new writing
    in Anglophone and Romance-language traditions. His literary Francophonie scholarship
    focused on writers of a range of backgrounds, from Michel Houellebecq, Frédéric
    Beigder, Sorj Dal Sije, and Maryse Conde to authors of East European, especially
    Romanian, provenance from Benjamin Fondane and E. M. Corian. His recent publications
    include monographs as *Cosmopolitanism: American Narrative, Late Globalization,
    and the New Cultural Imagery (2011)* and *Reading for the Planet: Toward a Geothermology
    (2015)*. He is the editor of *Postcommunism, Postmodernism, and the Global Imagination
    (2009)* and the coeditor of *The Planetary Turn: Relativity and Geoaesthetics
    in the Twenty-First Century (2015)*, Romanian Literature as World Literature (2018)*,
    and *The Bloomsbury Handbook of World Theory (forthcoming 2021).


    **Nicole Simek** is Cushing Ellis Professor of Philosophy and Literature and Professor
    of French and Interdisciplinary Studies at Whitman College. She specializes in
    French-Caribbean literature, with research interests in the intersection of literature
    and politics, trauma theory, postcolonial critique, and sociological approaches
    to literature. Her publications include monographs as *Hunger and Iron in the
    French Caribbean: Literature, Theory, and Public Life (2016)* and *Eating Well:
    Maryse Conde and the Ethics of Interpretation (2008)*, as well as the coedited
    volumes *Feasting on Words: Maryse Conde, Cannibalism, and the Caribbean Text
    (2006)* and an issue of Dalhousie French Studies on “Representations of Trauma
    in French and Francophone Literature” (2007).


    **Bertrand Westphal** is Professor of Comparative Literature at the University
    of Limoges, France, where he headed the team “Human Spaces and Cultural Interactions”
    (1999–2019). Founder of geacriticism, Westphal also specializes in world literature,
    postmodernism, and the relationships between literature and contemporary art,
    with particular focus on literary cartographies and artistic maps. His recent
    publications include monographs as *Le Axel de la Méditerranée. Une odyssée littéraire
    (2005), Geacriticism: Real and Fictional Spaces* (translated into English by Robert
    Tally [2011]; also translated into Italian and Portuguese), *A Plausible World*
    (translated by Amy Wells [2013]), with Spanish translation forthcoming, and *La
    cage des médiériens. Le roman et l’art contemporain face à la globalisation (2016);
    Mandarin translation forthcoming). He is the coeditor of seven books on geacriticism,
    literature, the aftermath of the 1990s Yugoslav Wars, and other subjects.'
