    # Queer Desire on the Move: Resistance to Homoglobalization in World Literature
    in French


    Jarrod Hayes


    In the late 1990s, several conferences and, then, to examine the implied relation
    were devoted to the relation between globalization and homosexuality, representing
    not just a global turn in LGBTQ studies but the ongoing queering of postcolonial
    theory.^1 In this chapter, I would like to consider a connection between the debates
    that these conferences elicited and the recent phenomenon within “Francophone”
    studies that has consisted in a rejection of the very term “Francophone”—with
    its implied ghettoization, according to the proponents of this rejection—in favor
    of a *littérature monde*. To do so, I will look at examples of writings by queer
    queer, and even the queer writing from Quebec, Africa, and the Caribbean to provide
    an overview of the intersection between World Literature in French, on the one
    hand, and sexuality studies, on the other; to explore the tension between the
    generalizing tendencies of Western homosexuality (if one could speak of such a
    thing in the singular) and local resistances to it in the form of culturally specific
    instances of same-sex desires and sexual behavior; and to examine queer Francophone
    studies and opening up multicultural approaches to queer French studies. I use
    the term “queer” because “lesian,” “gay,” and “homosexual” often do not pass outside
    of the Western contexts in which these terms appear appropriate. I will also rely
    on the expressions *men who have sex with men* and *women who have sex with women*
    (MSM and WSW), which scholars and activists have employed to avoid complicity
    with the globalizing pressures under consideration. My point here is not to provide
    an encyclopedic treatment of queerness and/or MSM/WSW in world literatures in
    French; rather, by highlighting a handful of texts from the most commonly acknowledged
    regional divisions of Francophone studies, I hope to offer both to questions of
    gender and sexuality in the teaching of French studies from a global perspective
    and to suggest modalities of teaching gender and sexuality studies from a global
    and therefore less Eurocentric perspective.'
