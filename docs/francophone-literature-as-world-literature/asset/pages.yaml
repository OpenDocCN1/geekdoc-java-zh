    One of Beecroft’s primary concerns is how conditions can be made favorable for
    “greater interaction without greater homogenization (279) in the global ecology
    of our shared literary future. To provincialize banlieue literature and to exclude
    its mention in discussions of “world-literature in French” is to thwart this.
    In an authentic global ecology, a “world-literature in French” should not be divided
    into unequal spheres or worlds. Instead, banlieue literature should be seen to
    match the French national ecosystem, which, in turn, matters to the global ecology.
    In fact, an argument could be made straightforward that banlieue literature matters
    to the global ecology. As place narratives provide the deep texture of content
    with great complexity, they are anything but flat. Over time, banlieue literature
    has challenged uniformity, whether through nonstandard literary language or by
    countering the single story that has been all too told on the banlieues. As it
    evolves, banlieue literature has become more invested in thinking big and imagining
    big: the “would-be, could-be” scenarios that have risen in the last few years
    extend well beyond the banlieue context in France and invoke a shared future.
    Finally, if there has been constant across banlieue literature, it has been the
    rejection of the monocultural and monocentric. In this, this literary corpus holds
    diversity itself at its core. For its one best possible future, the global literary
    ecology needs precisely this type of literature to be one dimension of the globalness
    of French-language literature.


