    As a part of the working poor, he is barely able to subsist on what he makes:
    "How to get by this minimum wage? You can barely survive on what you earn when
    your debts increase[. You owe the seller of fried food, and the girl who looks
    after her mother’s trade." Almost rhetorical in nature, the question is put to
    the reader and demands an answer. It is an ethical question. Can anyone survive
