    # 2. Maghreb


    While the Maghreb''s literatures may contain fewer examples of queer representation,
    queer Maghrebian studies is arguably as established as Queer Québec studies. My
    own Queer Nations was published in 2000. Other scholarly queer work in Maghrebian
    scholarship followed bit by bit as the field gained steam until the 2010s, which
    then became the decade of Maghrebian studies, with new work just as likely written
    in French or English. In 2013, Claudia Gronemann and Wilfried Pasquier published
    their collection *Sènes des genres au Maghreb: Masculinités, critique queer et
    espaces du féminin* (Scènes of Gender in the Maghreb: Masculinities, Queer Critique,
    and Masculine/Feminin Spaces). In 2013, Jean Zaganarian''s *Identités dans la
    littérature marocaine* (Queer Morocco: Sexualities, Gender, and (Trans)identities
    in Moroccan Literature)


    Out Finally, in 2017, the field seemed to explore two important book-length studies:
    Mehamed Amadeus Mack''s Sexagon: France, Muslims, and the Sexualization of National
    Culture and Denis M. Provencher''s *Queer Maghreb French: Language, Temporalities,
    Terrifications.*¹⁰


    These developments coincided with the arrival onto the literary scene of Francophone
    Maghrebian writers who openly claimed their same-sex desires and sexual histories,
    with Rachid O. in 1995 and Eyet-Chébék Djaziri in 1997, when Nina Bouraoui and
    Abdellah Taï followed in 2000. The Maghreb clearly did not have to wait for such
    writers to represent representations of queer desires. As I wrote in Queer Nations,
    “Rare is the writer who does not deal with male homosexualotic or same-sex behavior
    in at least one novel, and a prominent writer deals with these topics in many
    works.”¹¹


    If more recent scholarship has undoubtedly gravitated toward writers who may be
    more identifiable as something like lesbian or gay; I am still convinced that
    other writers are still offering representations of “queer” deeds and thoughts
    that we should not neglect. A recent event confirms this vision that Mohamed Leflah
    posthumously published 2011 novel, *Le dernier combat du Captain Nimat* (The Final
    Battle of Captain Nimat).


    Leflah tells the story of a retired air officer who has fallen in love with his
    nephew after erotic dream about him. A physical relationship ensues behind the
    back of Nimat’s life, and they end up living together Islam must flee because
