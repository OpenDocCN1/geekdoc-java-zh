  md: '# Preface and Acknowledgments


    “Are all literature literatures?” wonder the editors of a 2018 book published
    in the same series as ours.³ They also point out that the issue seldom comes up
    with respect to ‘presumably ‘major’ literatures as French or British.’² They imply,
    and we too recognize, that this question is still raised, *expressis verbis* or
    not, apropos of literary cultures perceived less central to a world-system whose
    accounts, at least, are in turn marked by some of the hierarchies and epistemological
    biases of the littérature universelle paradigm.


    In pushing back against this model, Francophone Literature as World Literature
    does not skirt the question either. But, in asking it, our collection''s chapters
    focus on Francophone writing from outside the Hexagon—like Luxembourg and from
    former French coloniesas well as inside metropolitan France, with both *Beur*
    literature and highly acclaimed authors such as Michel Huellebec as examples.
    Thus, our contributors trace the ways in which Francophone writers from all over
    the world lay the “worldness” of their roots and efforts. Uncovering the planetary
    inscription of literary works and cultural traditions of a francosphere encompassing
    Africa, Asia, Canada, the Caribbean, and Europe, without forgetting, the latter,
    France itself is in one of our book’s tasks. For, as it will become readily apparent,
    the recently arrived—make their cases for this world presence assidiously, they
    about established figures or the self-assigned exceptionalist position inside
    time and over again. Particularly in the wake of the *littérature-monde* debate,
    French literature traditionally understood can neither claim afford anymore, we
    believe, the self-assigned exceptionalist position inside the world-system of
    writing of French expression. The Flauberts, the Rimbauds, the Célines, the Duras,
    and their metropolitan peers and successors must occupy, instead, a more democratically
    configured place within this system and participate in similar relays and processes
    of worlding, planetary negotiations, and “planetizing” (“mondializing”) relevance
    as any other voices of literary Francophone no matter their locations and backgrounds
    are—hence our World Literature approach to the immensely riched and variegated
    Francophone corpus.


    Bringing together not only Francophone literature but also scholars of literary
