    to imitate voices and gestures, to slip among them, to become even invisible"
    (31). Throughout the novel, the language of invisibility is often deployed specifically
    in conversations about class division. The poor are acutely aware of their invisibility
    to those of higher class status as theirs is a subject position shaped by upper-class
    attitudes, as well as a survival strategy necessitated by the social dynamics.
