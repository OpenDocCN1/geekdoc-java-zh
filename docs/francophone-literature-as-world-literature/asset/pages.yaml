    and ethical—memory and antimemory, militant and antimilitant, political, anti-political,
    and poetic”⁶ For May Gallagher also, “politics,” which she describes as “the dominant
    mode of francophone postcolonial is a central feature in the writings of many
    Francophone writers addressing “the question of the interface between culture
    on the one hand and empire, globalisation, colonialism or imperialism on the other”:
    “This means that francophone thinking on ‘empire and culture now’ is often more
    mediated, more embedded, more dense, more oblique, and less easily translated
    or applied than that which is not articulated as, or in relation to, a poetics
    that is, writing in literary values of expression and form, including values of
    semantic richness, of infinite levels of meaning, of aesthetic resonance and ethical
    depth are”—⁷ Rather than having a purely ornamental function, Taubira’s poetic
    references can therefore be viewed as both an aesthetic and political strategy
    that points out its ‘dense’ and ‘oblique’ policy, the universal ethics and imperative
    of difference in contemporary France.


    My analysis of Taubira’s poetic and use of national literature references us-
    monde and world literature more generally can rethink notions of a shared humanity,
    a common ground, and a global world through the lenses of diversity and diversity.
    As Peng Cheah argues, postcolonial literature “attests to literature’s continuing
    permanence, not only as an expression of humanity’s ideals or sufferings, but
    as an active force for the emergence of new subjects in the world. In opposition
    to the qualitative appropriation of time that sustains contemporary global capitalism,”
    Cheah also notes of the works he discusses, “the novels I have considered propose
    revolutionary time and worldly ethics as alternative temporalities.”⁷⁹ Similarly,
    relocating literary works within the global frame of littérature-monde highlights
    both writers and critics’ aesthetic, ethical, and political commitment to the
    humanizing powers of writing, translating, and interpreting the many voices and
    strands of literary creation.


