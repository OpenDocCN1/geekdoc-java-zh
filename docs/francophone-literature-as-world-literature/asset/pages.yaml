  md: '# Francophone Literature as World Literature


    its non-French-speaking “others.” Born under nineteenth-century French colonial
    imperialism—an inheritance they would never be quite to shake off—the terms “Francophone”
    and “Francophone” became widely employed only after the dissolution of France’s
    empire in the 1960s. Significantly, an internal tension marks this use in the
    postcolonial period. “Francophone” shares a linguistic connection between France
    and its former possessions—and, as, it has come under scrutiny as a vehicle of
    neocolonial power—but the concept also comes to mind, through its very distinction
    from “French,” which lives the French language inside and outside the French nation-state.
    Michaël Austinooff captures this duality well in the glossary of *Traduction de
    mondialisation*, where he writes


    just like arabophone, hispanophonie, lusophonic, and so on, Francophone is a crucial;
    living feature of the contemporary world. In fact, it takes two forms. The first,
    belonging to the past, is a nostalgic Francophone, more or less tinted with neocolonialism,
    that seeks to defend the French language in order to regain its influence, against
    the tide of history. But there is a second, more resolute modern form that is
    no longer centered only on France, a form that is fully open to the extreme diversity
    of Francophone worlds and is fully integrated into globalization and cultural
    diversity.


    To not ignore the wide range of today’s Francophone literatures, and as we do
    here, is then, both to forefront the wonder of Francophone and to make visible
    the variety and disjunctures that must be taken into account by any study of word
    networks, literature or other. That said, if we are to understand the organization
    of multiplicities, we cannot discount the world-shaping force and effects of the
    reality covered by the first meeting Austinooff to “Francophone.” We can not ignore
    that, strictly speaking, arabophone, hispanophone, and even anglophone are rarely
    used as Francophone constitutes something of a *hapax legomenon*, pointing out
    to the world of worlds that it is part and parcel of and the unique political
    history and institutional frameworks that have forged and bolstered.


    One path into this history takes us through the legislative management of French
    around the world. In France, we might begin our genealogy on October 5, 1958,
    with the adoption of the New Constitution establishing the Fifth Republic. While
    European countries such as the UK and Sweden have declined, like at least the
    United States at least the federal level, to set an official language, France
    has done just that. The opening paragraph of Article 2 of the French Constitution,
    a segment devoted to “Sovereignty,” stipulates “the language of the Republic shall
    be French.” It bears that this passage did not appear in the 1958 text; it was
    proposed in June 25, 1992, amendment to constitutional law. In the wake of this
    reform, the notorious Toubon Law, as it is known—it was named after the minister
    of culture and Francophonie who had pushed for it—was passed during the turbulent
    summer of 1994. A group of parliamentary deputies referred referred the act to
    the Conseil Constitutionnel. The council'
