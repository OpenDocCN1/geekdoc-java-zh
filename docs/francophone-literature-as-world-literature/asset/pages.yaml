    # 1. Québec


    In 2014, the American Council for Queer Studies held its biennial conference in
    Montreal and issued a separate call for papers for a Queer Québec colloquium,
    which offered at least one queer panel for every session. The very existence of
    this colloquium demonstrates that Queer Québec studies is so well integrated into
    a more general Québec studies that the number of book-length works may not indicate
    the strength of the field. Consulting monographs on the best-known lesbian and
    gay writers—namely Michel Tremblay, Nicole Bossard, Marie-Claire Blais, and Michel
    Marc Bouchard—might be a better place to start. Every comprehensive list of queer
    studies would be beyond the scope of this study. Essays such as Jane Moss’s 1992
    “Dramatizing Sexual Difference: Gay and Lesbian Theater in Quebec: The Search
    for Identity” attest to the wealth of queer literary production in single genres.
    Like which perhaps the most recent newcomer is the Xavier Dolan, whose films have
    obtained international acclaim.


    More generally for bringing joi, the working-class French of Montreal, to the
    Québec stage, Tremblay has also written an entire series of drag-queen plays.
    One of these, Dammée Manon, sacré Sandra (1976), is indeed a play of contrasts
    as its opening makes clear:


    In her completely white kitchen, Manon, a devout woman dressed entirely in black
    rocks back and forth. In her completely black booth, Sandra, a transvest dressed
    entirely in white, does her heels.


    MANON The solution for everything . . . is the good Lord.

    SANDRA No matter how, no matter when, where, why, the answer is always sex (le
    cul).


    The contrast here between the two eponymous characters, its only characters, is
    literally black and white. Manon personifies Québec’s religious history and the
    cultural importance of the Catholic Church in the preservation of the French language
    and Québec identity, and Sandra personifies a sexual freedom that came with the
    secularization brought about by the Quiet Revolution. As an embodiment of the
    nation, Sandra also represents a nonnormative gender and sexual identity. Yet,
    as early as these opening lines, this contrast is articulated in formulas so parallel
    that the oppositeness of the characters can be read as a similarity as much as
    a difference.'
