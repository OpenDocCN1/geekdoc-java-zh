    # 1. Vișnic and the 1980s Generation


    Vișnic started out in Bucharest as one of the major poets of the so-called Generation
    of the 1980s (*generatia* ''80), the members who have brought postmodernism on
    the scene of Romanian literature since the late 1970s. After publishing three
    collections of poems, he won a 1985 Romanian Writers'' Union Prize for his poetry
    book *Intelept ora de cai* (The Wiseman at Daytime).² As with other colleagues
    with whom he found the Romanian postmodern movement, Vișnic had initially responded
    strongly to British and American writing. Before long, his distinctly ethical
    concerns steered him toward French literature. More reflective and self-reflective,
    more skeptical and abstract in his poetry than other representatives of the Generation,
    who chose to place stylistic and poetic virtuosity at the center of their endeavors,
    Vișnic naturally drawn to what one calls,


    As we see below, such affinities were not unexpected. The turn to postmodernism
    and to its US sources in 1980s Socialist Romania was, all the more because this
    postmodern sensibility arose in the country, as it did in other Central and Eastern
    European leaders during the same time, in the absence of the postindustrial and
    consumption-oriented type of society characteristic of the United States and Western
    Europe and whose “logic” postmodernism has been said to echo—Romanian critic Mircea
    Martins’ formula, “postmodernism without postmodernity.” The emergence of a postmodern
    order in Cold War Romania is not the exclusive result of external influences.
    Other “factors” to consider here are the widely felt crisis of the modernist aesthetic
    within the national literature, on one hand, and on the other, the growing impact
    of older writers whose style had at odds with the modernist mainstream and who,
    on this ground, would be regarded by the young Romanian postmodernists as their
    precursors: in poetry, Leonid Dimov, whose poetry is a feast of richly oneric
