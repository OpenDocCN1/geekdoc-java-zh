    # 2. Urban Apotheosis as Representational Crisis


    Monémbo’s text “bas-fonds” seems meant to invoke the long tradition of lower-depths
    writing in French literature, reminding us that urban poverty, social conflict,
    and underworld are not a Third-invention. In France, this tradition could be traced
    from the Middle Ages to the present day and includes such figures as François
    Ville, François Rabelais, and Restif de la Bretonne, as well as the great from
    Pierre MacOrlan called “le fantastique social,” exemplified by such fascination
    for what described by figures as Eugène Sue, Victor Hugo, Eugène Dalit, Louis-Ferdinand
    Céline, Raymond Queneau, Roman Gary, and so on, without forgetting genre fiction
    detective novel, action film, and the post-migration novel, which all thrive on
    lower-depths imagery.


    The group of African writers associated with this kind of literature can be said,
    in a sense, to belong to this “underground” tradition of city writing, which also
    extends across the globe.. But it will be more accurate to say that these writers
    represent more of an apotheosis of tradition, not only because the cultural and
    social specificities of the places in question differ from their European counterparts
    but also because of the sheer scale of the Africanopolis and the magnitude of
    the problems they must address. As cities have scaled up, the structural and resource
    constraints and potentialities have changed in nature, giving rise to kinds of
    urban dynamics that are not necessarily well captured by existing concepts and
    representational practices. This has in turn created a representational crisis
    that is felt not only in literature but also in fields like urban planning and
    architecture. Thus,,'
