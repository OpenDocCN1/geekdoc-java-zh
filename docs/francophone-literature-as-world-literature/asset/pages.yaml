    # 2. Titi, the Youth, and Class Division


    Read through the perspective of young Titi, Le Rond-point also exposes the impact
    of social inequality on the youth of the lower middle class. As someone from the
    working poor or precarious middle class, Titi goes to school, where he interacts
    with people of different social backgrounds. Rather than serving as an equalizer
    that grants access to mobility, school becomes a place where inequality is magnified.
    Interacting with children more privileged than Titi alerts him to what does not
    have, making him painfully aware of how inequality operates. The trope of invisibility
    becomes the main way through which readers understand and their relationship to
    social class. For Titi this invisibility manifests itself in two registers: as
    an awareness of how he is seen by others and as a learned behavior that becomes
