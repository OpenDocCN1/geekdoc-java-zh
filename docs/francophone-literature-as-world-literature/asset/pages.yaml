    reality, pirated copies are easier to download than official editions due to national
    publishing embargoes. According to the Organisation Internationale de la Francophonie
    (OIF), literacy in French continues to rise throughout the world, but it is nearly
    impossible to record readership in Africa and elsewhere, often with books being
