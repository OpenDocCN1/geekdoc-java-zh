    # 1. The View from Below


    This chapter approaches the question of Francophone literature as world literature
    from the bottom-up, by which I mean three distinct things. The first results from
    my approach to the broad domains under investigation. Rather than beginning at
    the top, with the general categories of World Literature and Francophonie in their
    institutional dimension—the bird’s-eye view—I work my way up towards this perspective,
    beginning with a single French-speaking author (Tierno Monénembo) and a set of
    thematic preoccupations (the city). The larger project on city writing from which
    this essay is drawn not start out with any particular concern for the field of
    world literature per se, yet the nature of the topic led me, gradually and somewhat
    grudgingly, to the realization that any meaningful contribution to a study of
    city writing in the Global South—Francophone, African, and transnational—networks
    of city writing on a planetary scale. What follows then is not a set of prescriptive
    recommendations on Francophone literature as world literature, but an attempt
    to take the threads that radiate from my Guinean starting point and follow where
    they lead, which is to say, across the African continent and the world.

    The second sense in which this chapter takes a bottom-up approach to world literature
    involves...


    The second sense in which this chapter takes a bottom-up approach to world literature
    involves a model of theoretical insight, that following Henri Lefebvre, I have
    called “transduction,” which is premised on the dialectical interplay between
    the bottom-up perspective of direct experience and empirical knowledge, on the
    one hand, and the top-down perspective of theoretical discourse, on the other.
    “Transduction,” according to Lefebvre, “assumes an incessant feed-back between
    the conceptual framework in operation and empirical observations. The theory or
    methodology, rather, transduction gives form to the spontaneous mental operations
    of the urbanist, the architect, the sociologist, the politician, the philosopher.”¹
    In this, the concept of transduction prefigures Lefebvre would later theorize
    in *La production de l''espace* as the dialectical trio of perceived space (which
    is bottom-up),'
