  md: '# Contributors


    Eric Prieto is Professor of French and Comparative Literature at the University
    of California, San Barbara. He is the author of Listening In: Music, Mind, and
    the Modernist Narrative (2002), Literature, Geography, and the Postmodern Poetics
    of Place (2012), as well as a number of articles in postcolonial studies, spatial
    studies, ecocrit studies, and music and literature. He is currently at work on
    a book on informal development in the developing world.


    Vijaya Rao is Professor at the Centre for French and Francophone Studies of Jawaharlal
    Nehru University in New Delhi. Her teaching and research focus on Québec literature,
    representations of India in French and Francophone literatures, and the literature
    of the Indian Ocean. Her major publications include Ecriture indienne expression
    française (2008) and the edited volume Reaching the Great Mughal: French Travel
    Writing on India of the 17th & 18th Centuries (2012). In 2008, she coedited a
    special issue for the journal Synergies-Inde on cross-reads and Francophone encounters
    between Quebec and India. In 2018, she was awarded the Médaille du 50e anniversaire
    du Ministère des relations internationales et de la Francophonie of the government
    of Quebec for her contribution to the development of Quebec literature.


    Laura Reeck is Professor of French and Chair of International Studies at Allegheny
    College, Pennsylvania. Her research includes postcolonial literary categories,
    the banlieue culture, the harksis in guerilla filmmaking, and the extreme contemporary.
    She is the author of Writerly Identities in Beur Fiction and Beyond (2021). She
    has recently contributed to A Practical Guide to French Harki Literature (2014),
    Souffles-Anfas (2015), and The Oxford Handbook of Arab Novelistic Traditions (2017).
    She is a coeditor of the 2018 annual volume for the Society for Francophone Postcolonial
    Studies, Post-Migratory Cultures in Postcolonial France.


    Raphaël Thierry is Postdoctoral Fellow and Lecturer at the University of Mannheim,
    Germany. Since 2008, his research and publications have focused on African publishing
    and literary developments in Africa, especially in the literatures of French-speaking
    African countries, as well as on world market trends. He received his PhD in 2013
    from the University of Lorraine, France, in a program developed in partnership
    with the University of Yaoundé 1, Cameroon. Appearing as in 2015, his dissertation,
    Le marché du livre africain et ses dynamiques littéraires. Le cas du Cameroon,
    on the position of African publishing industry in the global market trend. With
    Hans Zell, he has published an article titled “Book Donation Programmes for Africa:
    Time for a Reappell?” in a 2015 issue of African Research & Documentation: Journal
    of SCOLMA. He is currently working on a project on publishing in Francophone Africa.
    Thierry is also a researcher associated with “Les Afrique dans le monde” (LAM
    UMR 5115 CNRS/Sciences Po Bordeaux) and with the Centre de recherche d’Écritures
    (EA 3943, Université de Lorraine).'
