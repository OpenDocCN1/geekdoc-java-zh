    # # Worlding Nigritude, or Aimé

    ésaire’s Global Caliban


    Zahi Zalloua


    In his critical and inventive adaptation of William Shakespeare’s early modern
    play *The Tempest*, Aimé Césaire illustrates and enacts a non-essentialist, anti-racist
    aesthetic sensibility. As Césaire puts it, he aims to “demythify *The Tempest,*
    countering Prospero’s “totalitarian, fakeness, forgiveness, and hegemonic “will
    to power [volonté de puissance]” by telling the story of Caliban’s vantage point.”
    Through key alterations to the original literature, Césaire critically rewrites
    *The Tempest*, designating Caliban as a black slave and Ariel as a mulatto slave
    enslaving Eshu, a black-devil god into the plot. The significance of these changes
    has long been debated. If Eshu moves the play away from a strictly European origin,
    the specifications provided for Caliban and Ariel make explicit that the logic
    that governs the relation between Prospero and his subjects is first and foremost
    colonial logic, pitting the master against the slave. Does this mean, that Césaire’s
    *A Tempest* is a tension of postcolonial rewrite of Shakespeare’s *The Tempest*?
    Should we see it exclusively as an antagonistic postcolonial rewrite? In this
    paper, I propose to reread Césaire’s *A Tempest* as an act of doing. I draw from
    Feng Chiao, who, in his admirable *What Is A World,* reorients the discussion
    of world literature away from “the implications of world culture for the study
    of literature” and toward an exploration of “what literature can contribute to
    an understanding of the world and its possible role in remaking the world in contemporary
    globalization.” As an act of doing, Césaire’s *A Tempest* opens up, I argue, that
    differs from both Shakespeare’s Césaire’s racial colonial and our current global
    world, disclosing—as well as enticing us to invent—new meanings and alternate
    imaginings of subjectivity, resistance, and materiality. This world is not amenable
    to a fetishization of identity, where only the self’s organic or historically
    given affiliations matter, and where the self only cares about its own. Rather,
    Césaire’s envisioned opens powerfully, if unexpectedly, to a universalization
    of difference, to a vision of difference otherwise rooted.


