  md: '# Francophone Literature as World Literature


    situ, by this highly complex world structure and its issues.³ The chapters revisit
    key, aspects, and whereabouts of recent Francophone literatures so as canvas and
    problematize these literatures'' *worldness* at a time the latter is becoming
    geologically as well as theoretically impossible to ignore and respectively, systematically
    and appropriately world-minded critical reflection—hence the plea we enter, with
    some qualifications, in the final section of this introduction and across the
    volume on behalf of a World Literature approach to this Francophone corpus.³ For
    we contend, Glissant''s world-relating ontology bears only on writing and politics
    but also on making sense of the written word, political activism, and life generally
    in Francophone spaces—in brief, on critical interpretation. That is to say, the
    face of this ontology is a reading model. Indeed, we discern a critical and critically
    welcomed platform in Glissant''s *Poetics of Relation*, in his politics lately,
    and beyond in it of Francophone literatures. This program, which we deem foundational
    to a World Literature-informed revisiting of these literary bodies, demands dealing
    with them, and not solely with their *littérature-monde* rebellious extension,
    as part shaped by a world politics—by conversations, transactions, clashes, overlaps,
    and cross-pollinations with a spectrum of worldly really presences, influences,
    traditions, idioms, and so forth. Essentially on the same wavelength, we read
    post-Second World War literatures with the world-as-world. Not only do we cast
    aside “Francophone” category, as we explain at greater length later on, but also
    equate *littérature-monde* to it and read for the world in this entire literary
    domain as well as we do, conversely, for this body of work''s inscription into
    the world unfolding inside, across, and outside Francophone''s old and new embassies.


    Thus, we ask, basically which world literatures are part of? And, more broadly,
    which kind of world—are Francophone writers part of? And, versa, which world or
    worlds, networks of language, literature, race, ethnicity, gender, faith, culture,
    and locales does these authors'' work give voice to power? We these, stress throughout,
    bringing into play a plurality: not by a long shot—an egalitarian one, but fraught
    with asymmetries and injustices and surely to certain hubs of political-economic
    leverage and cultural prestige. At the same time, centers and margins alike, former
    French colonies, today''s multethnic and multiracial France, as well as the other
    sites encountered in this networked aggregate, all reveal themselves as crossroads
    in history. Together, they stage a mundana development of loosely organized yet
    mobiles differing from one another according to place, imperial past, postimperial
    developments, and so on.


    In line with the Bloomsbury'' series title, our book''s refers to Francophone
    Literature. But—and to make this absolutely clear—the singular form harbors and
    de facto meanings, and so “literature” should be read as “literatures.” We attempt
    to capture this astonishing diversity and richness not just in the plural of our
    standard designation of the phenomenon at hand, “Francophone literatures,” as
    we do later, also in the notion, upheld throughout the following fifteen chapters,
    that metropolitan French literature itself is taught and written on has'
