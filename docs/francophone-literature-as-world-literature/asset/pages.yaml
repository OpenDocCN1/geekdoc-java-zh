  md: '# Contributors


    293


    Emilia David is Associate Professor and Researcher in Romanian Language and Literature
    at the University of Pisa, Italy. In 2006, she completed her PhD in Italian Literature
    at the University of Turin, and in 2015 she received her PhD in Philology from
    a joint doctoral program of the Universities of Bucharest, Romania, and Italy.
    has written primarily on the European avant-garde. Her main book publications
    in Italian are Futurismo, dadaismo e avanguardia romena: contaminazioni fra culture
    europea (1909–1930) and Avangarde, nazionalismi e interventismo nei primi decenni
    del secolo (2nd., 2011), and she has translated into Romanian Filippo Tommaso
    Marinetti’s manifestos (Manifestele Futurismui [The Futurist Manifestos]). She
    is also the author of two monographs on contemporary Romanian literature: Poezie
    generaiei ’80: intertextuality și “performance” (The Poetry of the 1980s: Intertextuality
    and “Performance” [2016]) and Consecțele bilingvismului în teatralul Matei Vișnec
    (The Consequences of Bilingualism in Matei Vișnec’s Theater [2015]).


    B Kacou Diandue was Professor of General and Comparative Literature at the Félix
    Houphët-Boigny University in Abidjan, Côte d’Ivoire. He published numerous articles
    and several books, including Rupture et continuité (2004), Topolex I (2005), Une
    Géocritique d’Afrique: Mutations et stabilité de la spatialité et de la temporalité
    dans le cours africain (2009), Topolex II (2013), Réflexions géocrites sur l’œuvre
    d’Ahmadou Kououma (2013), and lebeau-narrateur (2017).


    Jacqueline Doutin is Associate Professor of French Studies at the University of
    Melbourne. She has written widely on contemporary French and Francophone literature
    and cultures, her publications ranging from a monograph in French in 2008 Nobel
    Laureate J. M. G. Le Clézio utopian visions, Le Chercheur d’ailleurs: L’Utopique
    de J. M. G. Le Clézio (2003), to a major article for French Studies on “World
    Literature in French, Littérature-monde, and the Translingual Turn” (2016). Her
    work on comparative utopianism is included in the 2012 Cambridge Companion to
    Utopian Literature, and her writing on world literatures in French has appeared
    in many journals and edited books including David Damascus’ 2014 Journal Studies
    in Theory. Recent editing projects include special-topic issues on dark travel
    (Postcolonial Studies), counterculture (M/C Journal), and time travel writing
    and the future of Francophone (Australian Journal of French Studies). She is currently
    working on a cultural history of wine in Bordeaux, Burgundy, and Champagne and
    is codifying a book on wine, terroir, and utopia with Peter Howland. Vincent Gélaires
    is Associate Professor of French at the University of British Columbia, Canada.
    He received his PhD in Romance Languages and Literatures from Harvard University
    in 2015. His doctoral dissertation “La représentation de l’espace dans le récit”
    surveys the fundamental strategies of spatial invention in novels and will be
    published in review form under the title récit architecte: cinq aspects de l’espace.'
