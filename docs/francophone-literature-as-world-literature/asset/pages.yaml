    that, we might, enhance the planetary appeal and mobility of these works as they
    tell the “world” to audiences themselves located in a world that extends far beyond
    nation-states.


    This second piece, Nicole Simek’s “Literature’s Purchase: Remarking Economic Relations
    in Crusoe’s Footsteps” argues that a 2012 retelling of Daniel Defoe’s Life and
    the Tempest Surprising Adventures by Martinican writer and anti-capitalist Patrick
    Chamoineau. In her analysis, Simek demonstrates that this Francophone rewriting
    of a novel so often taken to be an emblematic portrait of homo economicus constitutes,
    in reality, a more complex working operation. The critic concludes that the rewriting
    protocols in play offer here, through their own dynamic, an alternative mode of
    being-in-the-world, a way out of the dominant economic structures of contemporary
    life.


    In “Négritude, Aimé Césaire’s Global Caliban,” this segment takes up a key problem
    of the complex, literary and political intertextuality underlying the Martinican
    writer’s celebrated retelling of The Tempest. Aiming how we might negate the tensions
    between the play’s particular appeal and its universalizing dimension, Zalloua
    argues that Césaire engaging with the Shakespearean tutor both discloses and incites
    us to invent imaginings of subjectivity, language, and relationality distinct
    from marking Césaire’s colonial world as well as today racialized and racializing
    world. Remarkably, the critic spots all worlds operating critically, and geopolically
    and all—they project a négritude that throws bridges between diverse as those
