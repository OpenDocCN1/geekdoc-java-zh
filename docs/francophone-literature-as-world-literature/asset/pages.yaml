  md: 'Zahi Zalloua is Cushing Eells Professor of Philosophy and Literature and Professor
    of French and Interdisciplinary Studies at Whitman College and editor of The Comparat.
    He has published Montaigne the Ethics of Skepticism (2005), Reading Unruly: Interpretation
    and its Ethical Demands (2014), Continental Philosophy and the Palestinian Question:
    Beyond the Jew and the Greek (2017). He has also edited volumes and special journal
    issues on globalization, literary theory, ethical criticism, and trauma studies.
    His articles have appeared in symplok, Montaigne Studies, Intertexts, SubStance,
    L''Esprit Créateur, and Symposium, among other venues.'
