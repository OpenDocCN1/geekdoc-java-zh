    Having spent years in English pursuing his studies, he mastered English, French,
    German, Italian, Greek, and Latin. He was also well versed in Sanskrit and Bengali.
    It was his return to India, in the princely state of Baroda—where he taught English
    and French—that he relentlessly worked on classical and modern texts from both
    Western and Indian traditions. From 1910 onwards, in Pondicherry, Aurobindo turned
    to spiritual experience and initiated a movement of disciples who continued therein.
    It was also in Pondicherry that he met Maria Alfassa Richard (known as The Mother),
    a French national, who became his spiritual companion, gave structure and role
    to the ashram, and maintained the French language there.¹²


    Although Aurobindo read extensively in French and could write in several languages,
    he chose to do so in English. His reasons were both spiritual and political, as
    testified by his correspondence with his disciple Nirobaran.


    +   (1) The expression of spirituality in the English tongue is needed¹ and no
