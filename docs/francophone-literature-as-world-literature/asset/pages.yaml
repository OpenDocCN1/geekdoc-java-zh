    # 1. World Literature and littérature-monde


    During the last two decades, the study of world literature—born in nineteenth-century
    Europe and developed in Anglo-American academia with the goal of broadening the
    aesthetic conception of literature and the field of comparative literature beyond
    its Eurocentric focus—has been fueled by post colonialism and the new reflections
    prompted by globalization. As Carl Niekerk notes, “The notion that needs to be
    questioned is not just the global dimension of ‘world literature’ but also its
    literary aspect. It is a mistake to think that ‘literature’ exists in every culture
    or more less the same form. To some extent the term ‘literature’ is an “untranslatable.”


    The conversation between Gayatri Chakravorty Spivak and David Damros a dialogue
    to discussing “Comparative Literature/World Literature,” foregrounds some of the
    issues debated by scholars in this field. For Damros, what matters most is to
    offer more languages and language studies, more collaborative scholarship and
    teaching, and a “great deal of pluralism to resist a superficial promotion of
    diversity and the nationalistic tendencies underlying the discipline of comparative
    literature.” Spivak, on the other hand, stigmatizes Damros’s “populist” conception
    of world literature; for her, fostering a multicultural environment in a US classroom
    has very limited and limiting impact, as she contends, expanding the canon of
    traditional literature for the sake of linguistic and cultural relativism. What
    needs to be critically unearthed and examined, are the epistemological and ideological
    underpinnings of world literature as a discipline.


    The issues discussed by Damros and Spivak pointedly reflect those raised by literature
    scholars, the institutionalizing, assimilationist, and exclusive effects of a
    so-called literary canon; the rarely of a cultural center and (an) exotic peripheries
    produced by this canon; the ethnicity of texts written by nonwhite writers in
    contrast to the aestheticization of works by white, Western writers, who are held
    to superior standards; and the reinstated dichotomy between literature produced
    in the western hemisphere and world literature by writers from the southern hemisphere.
    Following scholars as Spivak and Pascale Casanova, who articulate the unique relationship
    between national literatures within an ethnocentric world republic of letters,
    After notes that “littérature-monde, like World Literature paradigms in general,
    reinforces national, regional, and ethnic literary alignments or projects a denationalized
    planetary scene that ignores the deep structures of national belonging and economic
    interests contouring the international industry.”'
