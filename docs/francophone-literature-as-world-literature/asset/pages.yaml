  md: '# Francophone Literature as World Literature


    While Mycéea, on the one hand, repeatedly figures the expressivity of the landscape
    as a form of textuality, on the other hand, she also imagines that her own language
    might achieve a renewed bonding beyond the rupture caused by slave history. She
    addresses the earth: "I named you Unpassable and All-fleeting," and "I write you
    in the music of every branch, grave or blue / With our words we illuminate and
    tremble," if her poetry embodies the ungraspable history and force of the landscape
    and somehow translates into her own writing the sonority and color of the trees.
    Throughout the text, references to the elements and to flora and fauna are associated
    with words, sounds, textures, and colors, though the history of the swiftifying
    domination of landscape and people is also embedded in the imagery, the poetic
    voice claims more affirmatively than elsewhere a form of communication between
    the ''I'' and the wider ''us,'' on one side, and on the other, the material features
    of the environment as they emerge from the trauma of the past.


    Both Césaire and Glissant seek to embrace the nonhuman world in their poetry at
    the same time as they give expression to a geographical environment damaged by
    history even as the force of this natural world transcends. Glissant''s aesthetic
    is more consistently focused on the locus of the Caribbean with its history of
    ecological devastation and seeks a more relational communication between the people,
    the sea, the soil, and vegetation, while Césaire is more concerned with the voice
    of the poet, immersed in the elements, reaching a geological time that far transcends
    a human history that is nevertheless nested into this extensive temporality. In
    both cases, "world" is a material presence in poetry, and the poets reflect extensively
    on the ways in which their poetic language might capture that of materiality—sounds,
    textures, forces, and movements—of the nonhuman world. At the same time, the nonhuman
    world here is never conceptualized as a purely autonomous realm that could be
    imagined in isolation from nature. Rather, history and geography, space and time
    mutually shape one another, and Céaire and Glissant are concerned with the dialogue
    between human and nonhuman expressiveness in relation to the history of the Middle
    Passage and the plantation system, as well as to geological movements. Their "poetry
    in the world" constitutes a kind of World Literature that it promises an aesthetics
    of the bonding between human and nonhuman world in the Caribbean and indeed, the
    cosmos. Their poetics are constructed of languages immersed and listening to the
    world, and both acknowledge the gaps in these languages and express a powerful
    aesthetics of resistance to the violence of capitalist world ecology.


