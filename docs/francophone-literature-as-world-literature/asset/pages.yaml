  md: 'Jarrod Hayes is Professor of French at Monash University, Australia. His research
    focuses on the intersection between postcolonial studies and queer theory. He
    is the author of Queer Nations: Marginal Sexualities in the Maghreb (2000) and
    Queer Roots for the Diaspora: Ghosts in the Family Tree (2016). Coedited Comparative
    Queer: Interrogating Times and Cultures (2010) with Margaret R. Higonnet and William
    J. He is currently working on a third book project, Reading across the Color Line:
    Racialization in the French Americas.


    Jane Hiddleston is Professor of Literature at University of Oxford and Official
    Fellow at Exeter College Oxford. She is the author of Reinventing Community: Identity
    and Difference in Late Twentieth-Century Philosophy and Literature in French (2005),
    Asia Djebar: Out of Algeria (2006), Understanding Postcolonialism and Postcoloniality:
    The Anxiety of Theory (2010), Decolonising the Intellectual: Politics, Culture,
    and Humanism at the End of the French Empire (2014), and most recently, Writing
    after Postcolonialism: Francophone North Literature in Transition (2017).


    Regine Michelle Jean-Charles is Associate Professor of Romance Languages and African
    and African Diaspora Studies at Boston College. She teaches classes and does research
    on feminism, Caribbean and African women writers, African film, and Haitian students.
    She is also the author of Conflict Bodies: The Politics of Rape Representation
    in the Francophone Imagination (2014). She has published numerous articles that
    appear in The Journal of Haitian Studies, American Quarterly, Callao, French Forum,
    Journal of Romance Studies, Research in African Literature, Small Axe. She has
    also contributed essays to edited volumes including most recently “A Border between
    Geographies of Grief: Border Crossings and Crossroads between Haiti and the Dominican
    Republic” (2018). She has received fellowships from the Ford Foundation, the Mell
    Mays Foundation, and the Woodrow Wilson Foundation. Her current book project is
    on feminist ethics in contemporary Haitian literature.


    Thérèse Migraine-George is Professor at the University of Cincinnati with a joint
    appointment in the Department of Romance Languages and Literatures and the Department
    of Women, Gender, and Sexuality Studies. Her main areas of interest and research
    are African and Francophone literature, French and Francophone women writers,
    African queer studies, and creative writing. She is the author of African Women
    and Representation: From Performance to Politics (2008), from Francophone to World
    Literature in French: Ethics, Poetics, and Politics (2013), a book of essays titled
    Més Etats-Unis: Portraits d’une Amérique que nous ne conna pas (2009), and two
    novels: Amour de travers (2010) and Envol (2014). She has also published various
    book chapters and peer-reviewed articles in journals such as Women in French Studies,
    Comparative Literature Studies, International Journal of Francophone Studies,
    Research in African Literatures, and GLQ: A Journal of Lesbian and Gay Studies.
    She is currently working on a book that focuses on the politics of difference
    in a transatlantic perspective.'
