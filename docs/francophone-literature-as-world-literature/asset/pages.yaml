    become, under the impact of the feedback loop generated by Francophone''s world
    literary apparatus, no more and no less than one of these Francophone literatures.

    In highlighting this plurality—one whose makeup is, to repeat, from genuinely
    pluralist and democratic—we do not agree to disregard the continuities among those
    literatures conjoined by the "Francophone" common denominator, to foreground,
    rather, a heterogeneous reality, also acknowledging that the all-embracing Francophone
    perspective itself has not always justice to such complexities.

    As writing in a certain language is as unifying and homogenizing repercussions
    has lumped together the remarkably ethnocultural worlds brought into being and
    into conversation by French across continents. That is why our introduction leads
    off with a brief and occasionally data-driven survey of what we dub Francophone''s
    language ecologies, a concept meant to drive home the linguistic facet of the
    point we make across Francophone literatures: the French-speaking world actually
    constitutes a world-system of "combined and unven" worlds in which French and
    its users exist alongside and in interface with other tongues and dialects those
    employing them within and across their own world-systems of language and culture.
    In this sense, the idea is "always already", and eminently, worldly, albeit in
    ways seldom equitable or widely beneficial. While buried are also the poem, poetry,
    and drama in it, an idea realised in the second segment of these considerations.
    We also show how multilingual and literary-cultural ecologies go in hand. In this
    situation, this world reality, is characteristic of literary Francophone and,
    more specifically, of the "littérature-monde en français”—in an approximate translation,
    "World Literature in French”—to whose controversial "manifesto" we turn thereafter.

    The discussion of Une une littérature-monde serves as into the case section four
    of this introduction makes for the world-as-world or the world qua as an epistemological
    model for grasping the monde and the mode de littérature-monde-monde and, subsequently,
    for a planetary, World Literature-oriented critical engagement with Francophone
