    # 4. Conclusion: Remaking the Idylle


    The authors, through vastly different means, follow some common threads in their
    invention of an apocalyptic novel adapted to the Québécois context. Both sustain
    a particular version of the idylle, as described by Daunais, in that they allow
    protagonists to live the end-of-days from the relative comfort of their bedrooms
    rather than the heroes embark on a perilous and potentially life-altering journey
    through the waselands. This stability, which constructs the spatial scope of the
    stories, allows the characters to draw on the structure of their lives, on family
    and community, and on their culture and their roots. It also elicits meandering
    reflections on literature and art, offering the two meaningful ways to retreat
    from the bleak reality. Thus, Matthias reconfigures his frozen landscapes with
    the help of epics and fables, Oscar delet clearly legible in Guay-Poliquin''s
