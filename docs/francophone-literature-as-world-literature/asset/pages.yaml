  md: '# Literature’s Purchase: Remaking World Economic Relations in Crusoe’s Footsteps


    Nicole Simek


    2012, Martinican writer, social worker, and anti-capitalist critic Patrick Chameoiseau
    published a retelling of Daniel Defoe’s *The Life and Strange Surprising Adventures
    of Robinson Crusoe*. L''Empreinte à Crusö, or “Crusoe’s Print,” is one of hundreds
    of Robinsonades and rewritings by Defoe’s 1719 novel, a text whose opening paragraph
    alone could provide all the material necessary for a year’s work, as Jacques Derrida
    says in his last seminar, *The Beast and the Sovereign*. Following so many early
    engagements with the tale, including Michel Tournier’s *Vendredi ou les Pacific*,
    Chameoise admits that he struggled to find a path into this rich material that
    would bring to life in new ways. Yet, by the fascination and “intense emotion”
    he had felt ever since reading the book as a book, he affirms “always known that,
    at some moment or another, [he] would create [his] own Robinson.” Moreover, in
    the challenge of the impasse that Robinson Crusoe lies what Chameoise has identified
    as his most important task today: to do with nothing, to confront the void or
    the static until it begins to open.


    How might literature come to serve as an antidote to a world impasse? What circumstances
    does the “Literary”—a term that takes on universal values in Chameoise’s recent
    work—come to have weight within particular, historically deigned struggles over
    the economic organization of life? The Robinson Crusoe, or the Robinson scenario,
    frequently reemerges in discourses about economics, credit, debt, and obligation,
    and Chameoise’s adaptation sizes in this aspect of Defoe’s material in order to
    elucidate what he describes as an “individuation disease” plunging global neoliberal
    culture in general and the French Caribbean. Yet beyond a better understanding
    of the world as it currently exists, what Chameoise seeks in rewriting *Robinson
    Crusoe* is to engage, through poetics, with “the unspeakable, the unthinkable,
    the impossible” dimensions of the Crusoe story in such a way as to forge new modes
    of relationality in the world. The novel thus seeks to re-world *Robinson Crusoe*,
    to harness the normative, world-making force of literature and participate in
    fostering a new “ecopolitical'
