    Intensely debated over the last twenty years, the concept of World Literature
    must be one of the most discussed and disputed paradigms in modern literary criticism.
    Pioneered by David Damrosch''s celebrated series of studies and anthologies, Goethe''s
    original Weltliteratur has been reinvigorated and transformed into a new epithet
    for comparative literature, foregrounding the cultural dialogue facilitated by
    the circulation of texts beyond their origins into new contexts of reception.¹
    The resulting resurgence of studies of World Literature has, on the one hand,
    triggered a sultry recognition of the importance of literary works outside the
    Euro-American canon, a productive attention to the effects of literary translation
    and circulation, and an enriching foregrounding of texts as potentially composite
    networks incorporating, as Ngũgĩ wa Thiongô describes, “different streams and
    influences from different parts of the globe.”— However, the universalizing sweep
    has provoked a good deal of criticism, as a number of critics have complained
    that the “world” of World Literature promises diversity but actually turns out
    to be constructed from the point of view of the European and American academy
    and produced by a neoliberalist publishing market tethered to the egalitarian
    works of globalisation. For the Warwick Research Collective, “world literature”
    is inevitably a product of the capitalist “world-system,” and the term''s attempted
