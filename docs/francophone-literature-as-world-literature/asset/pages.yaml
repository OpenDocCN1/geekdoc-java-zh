  md: '# # Introduction: Reading Francophone Literature with the World


    Christian Moraru, Nicole Simek, and Bertrand Westphal


    A comprehensive, all-embracing art, an art that joins together, a tissue-art,
    an art of links, a network-like art. An art that places thousands of points in
    relation to one another and explores the roads all these interconnected points
    entrust us to take.


    > —Grégoire Polet, “Atlas du monde”


    As far as poetry and politics go,” Martinican writer Édouard Glissant declares
    in a 2003 interview given to Philippe Arières and reprinted in the collective
    volume Pour une littérature-mundo co Michel Le Bris and Jean Rouaud, “I think
    have always listened to my instinct telling that the utmost object of poetry is
    the world: the world of becoming, the world that jostles us, the world that defies
    understanding, ... the world as place of meeting, of cultural impact, and of the
    human in all its forms.”¹ What ties the literary and the political together, Glissant
    goes on, “is this reference to the world. What he specifies, is not a “kind of
    abstract universal but a concrete and immediate likely-monde. However, this “world
    totality” is non-totalist,” and it is definitely non-totalitarian; in it, people,
    cultures, and history stand “in relation to one another,” worlded.² The French-Caribbean
    author further insists that being in relation and with the world is a prerequisite
    for creating aesthetically and, by the same tone, to recreating politically. Whether
    we talk about the making of poetic form or the remaking of a socioeconomic system,
    either as Glissant reminds us, by hegemonic versions of relation, either as him—as
    it is the editors of Francophone Literature as World Literature—predicated on
    an awareness of the world or as we see later on, of the world of planet and its
    problématique-monde or “planetary moments”: the world as a place of multiple and
    inevitable encounters, as an involved, simultaneously encouraging and troubling
    relation set consisting structurally and thematically of links, interchanges,
    and frictions among individuals, groups, politics, places and literary-cultural
    entities on scales ranging from the sub to the transnational, the regional to
    the planetary, the human to the nonhuman, and the animate to the inanimate.


    In focusing on Francophonie’s literary production as World Nonliterature, our
    book attends to works in a plethora of Francophone varieties worldwide by treating
    those texts as literary practices fundamentally engaged with and, at distance
    and in'
