    # 1. Out of the “Colonial Library”


    We did not have to wait until recent years to take a macroscopic approach to literary
    studies and their infinite variations.* It was just that we had to wait a little
    more in a country like France than elsewhere. In the 1960s, critics began to realize
    that literature should no longer be the prerogative of a small number of European
    and North American theoreticians. It was not acceptable to ever reserve the monopoly
    on literary analysis to a culture and generation whose education had been framed
    by the ethnic, gender, and sexual norms in places jealously protective of old-colonial
    past imbued with previzing mission. Consequently, in the human and social sciences,
    the situation started evolved. In France, this meant the ideas of Jean-Paul Sartre
    and Franz Fanon, many others, received significant response. Here and although,
    the 1970s were, for it at this juncture that a shift occurred, and, henceforth,
    the articulation of new approaches to literature and theories would take the cultural,
    historical, and political particularities of the subjectivity into account. At
    the beginning of these years, it was still conceivable, that Michel Foucault and
    Noam Chomsky could describe the meaning of history and human nature on the set
    of a Dutch TV program without considering the heterogeneity of planetary cultures.*
    At the end of the decade, the discussion was to take a different turn, as demonstrated
    by their growing militancy on various political fronts. Then, in 1978, Edward
    Said published *Orientalism*, which was translated two years later into French.
    Thus deinitely provoked a questioning of epistemological foundations on university
    campuses, especially in the United States. The novelty of Said’s intervention
    was—to state the obvious—great importance: it appeared that, at the head of the
    academy, there was not just a single point of view in matters of representation
    and its politics, but such angles were legend, finally, their ongoing multiplication
    widely accepted. At the same time, scholars realized that the ultra-dominant perspective
    was perfectly identifiable. It was the one that was subsumed under a catchphrase:
    Dead White Males. To have any chance at entering the international literary canon,
    you had better be white, male, and dead, that is to say, “sanctifiable.” In this
    context, the spring of 1988 500 Stanford University students marched through the
    campus, accompanied by Reverend Jesse Jackson. Their demand was more pluralism
    in syllabus development and especially in reading lists. The students’ warrior-like
    slogan spread beyond the walls of Stanford and even past California’s borders:
    “Hey ho, ho, Western culture’s got to go.” Wei'
