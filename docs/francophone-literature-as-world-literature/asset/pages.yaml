    The word “lit as” it is, as a goal of critical practice, of cross-cultural conversations.
    Even Goethe, when he initially came up with the term *Weltliteratur* in the nineteenth
    century, thought of it as a body of literary works—fixed or growing—and more as
    the process by which critics and general readers learn how to live consciously
    and intelligently in a pluralised cultural space, a space shaped by increased
    travel and cross-cultural contact through translations and criticism.³⁴⁰


