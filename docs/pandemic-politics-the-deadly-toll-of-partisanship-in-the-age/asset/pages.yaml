  md: '# 1

    America’s Preexisting Conditions


    Before patient zero—a thirty-five-year-old man in Snohomish County, Washington,
    who had recently traveled to Wuhan, China—fell ill with COVID-19 in mid-January
    2020 and long before the words “coronavirus” and “COVID” entered the collective
    lexicon, the United States was already poised for a difficult pandemic lexicon.
    Every country in the world faced the challenges of managing an unprecedented public
    health emergency, but almost no advanced democracy responded as inefficiently
    and ineffective as did the United States. Why? The rest of the book will talk
    about the politics of the pandemic and how political choices were made that incalculable
    consequences for Americans. In this chapter, we lay the groundwork for understanding
    the politics of the pandemic by focusing on the context in which these choices
    were made.


    This chapter,\,\ a series of institutional and political vulnerabilities that
    precede the onset of the pandemic. We describe these as preexisting conditions,
    structures and politics that were already weakening the policy-making environment
    on January 1, 2020. These preexisting conditions are deep partisan polarization;
    Donald Trump himself, relying on a charismatic personality and populist politics
    to make decisions that would preserve his popularity in an election year; (3)
    the crumbling and outdated U.S. health care system; and (4) systemic racial and
    economic inequality. These preexisting conditions primed the United States for
    a bad pandemic, particularly vulnerable to partisan politicization. On their own,
    each of these preexisting conditions would make mitigating a pandemic hard. Together,
    their interaction made the American COVID pandemic uniquely awful.


    Preexisting Condition #1: Partisan Polarization


    It is hard to overstate the influence of partisan polarization on U.S. politics,
    much less the COVID-19 pandemic. Polarization was the most endemic and'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'ultimately consequential preexisting condition for how the United States responded
    to the pandemic. Without polarization, an erratic president buoyed by charismatic
    political authority would be subject to greater discipline from within his own
    party, and bipartisan efforts to hold him accountable for his actions would have
    been easier to sustain. Polarization, on the other hand, actually shields politicians
    from facing the consequences of their choices.


    As explained in the introductory chapter, polarization creates a political environment
    in which the partisan center is abandoned in favor of more extreme partisan positions
    and the parties move further apart without the benefit of cross-cutting positions.
    In the U.S. context, partisan polarization at the level of party elites means
    that leaders are more focused on attacking their opponents and signaling their
    partisan loyalty than making good policy or looking for bipartisan solutions to
    common problems. This extends to the wider population as well, as Americans become
    increasingly polarized socially. Most worryingly, partisan polarization in the
    United States does not just reflect growing divides on policy matters but also
    captures the *moralization* of differences as “good” versus “evil.” Scholars describe
    this emotional valence as “affective polarization” whereby disagreement becomes
    destruct. Put succinctly, “Democrats and Republicans both say that the other party’s
    members are hypocritical, selfish, and closed-minded, and they are unwilling to
    socialize across party lines, or even to partner with opponents in a variety of
    other activities.”


    How did partisan polarization become a dominating feature of everyday political
    and social life? As a general observation, most Americans pay little attention
    to politics most of the time. When they have little information on an important
    topic, such as the economy, foreign policy, or a new health crisis, they draw
    on their social identities for cues how to respond, process information, and interpret
    events. This means that people''s sense of who they are, based on the social groups
    with which they identify, shapes what they think.


    Many kinds of social groups—from one''s gender to economic class to favorite sports
    team—convey a sense of belonging and identity in a social world. But in the United
    States today, partisanship is one of the strongest of these identities. It is
    a source of meaning and pride shortcut for identifying who is similar to you and
    who is unlike you. Partisan identity is'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'a heuristic that simplifies what would otherwise be complex and multilayered
    distinctions between people who share their policy outlooks on specific issues
    and those who do not.


    Thus, partisanship as a social identity does not merely guide individuals on political
    choices such as who to vote for and what policy positions to adopt but also, increasingly,
    on choices such as to like and treat with respect and dignity and who to dislike
    and treat with hostility. One of the most consistent findings in the social sciences
    is that people prefer their own social groups (ingroups) to members of groups
    they are not part of (outgroups) and will actively discriminate against outsiders,
    particularly when it comes to allocating resources. People will avoid interacting
    with members of an outgroup on a day-to-day basis. As a sign of just how powerful
    the political effects of such outgroup antipathy can be, scholars of political
    behavior have found that disliking supporters of the opposing party motivates
    voting choices more strongly than liking members of your own party: Democrats
    and Republicans are more motivated to vote based on their dislike for their partisan
    opponents than on their own party''s positions. Partisans view supporters of the
    other party as morally suspect. Opponents become enemies; disagreement becomes
    antagonism. Partisans view


    As Americans increasingly follow partisan cues to cultivate social networks of
    people similar to this, this process of “sorting” creates partisan “silos” in
    activities, hobbies, and news sources. Even economic decisions, such as what kind
    of car to purchase, can become correlated with partisanship. And this sorting
    has increased over time, accelerated by a media environment that provides partisan
