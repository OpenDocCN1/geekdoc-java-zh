    As this discussion makes clear, this is a very flexible way to think about what
    might divide Democrats, Republicans, and others, acknowledging that there are
    likely to be differences over the course of the pandemic, across states, and across
    individuals. That we still find partisan differences to be consistently visible
    is a testament to the utility of these complex statistical models for revealing
    the role of partisanship in health behavior.


    Our lasso regression approach also tells us that partisanship matters more than
    any other variable that we have measured. Loosely speaking, if partisanship “matters,”
    then this procedure should select partisan variables as good predictors of health
    behaviors; if partisanship is “more important” than other variables in predicting
    health behaviors, partisan variables ought to be selected more frequently than
    other variables. We implemented the lasso procedure forty-eight separate times,
    once per each of the six waves for each health behavior. The results are unambiguous.
    Partisanship is not only a very good predictor of nearly every health behavior
    (the exception is visiting a doctor, which our results above showed are not very
    closely tied to partisanship) but is also selected more frequently in total than
    any other variable that we have measured. We can conclude from this exercise that
    more than just being correlated with health behaviors, partisanship is actually
    the best predictor of health behaviors that we have in our data.'
