  md: '# 6


    # The Cost of a Pandemic


    COVID-19 AND THE AMERICAN ECONOMY


    The COVID-19 pandemic was more than just a shock to Americans'' everyday lives—their
    ability to see friends and family, send their children to school, and go to the
    movies or watch their favorite team play in person. It was also an unprecedented
    shock to their economic lives. Tens of millions of American workers found themselves
    working from home on a full- or part-time basis. Tens of millions of Americans
    found themselves suddenly unemployed. The Federal Reserve estimated that there
    were roughly two hundred thousand extra small businesses closures because of the
    pandemic in the first year alone. On June 1, 2021, Vice President Kamala Harris
    characterized this figure on MSNBC “one-third of our small businesses.” While
    the Federal Paycheck Protection Program provided billions of dollars in relief
    to some businesses to pay employees and fulfill contracts, others were not fortunate.
    California experienced the greatest hit, with forty thousand small businesses
    closed by September 2020. Many of these small business owners joined lockdown
    protests or rally behind the campaign to recall California governor Gavin Newsom
    in September 2021, frustrated with the untenable effects of shutdowns, claiming
    that “he’s broken the back of small-business owners and put many out of business
    for the rest of their lives.


    Simply put, COVID-19''s effects on the U.S. economy were sudden and devastating.
    Even those Americans who were fortunate enough to keep their jobs found thrust
    into the sharpest economic recession in modern American history. In this chapter
    we examine the economic consequences of the COVID-19 pandemic as well as the political
    debate around them. For President Donald Trump, who campaigned on his success
    as a businessman and promised to deliver a roaring economy and good jobs, the
    massive economic toll of the COVID-19 pandemic was nothing less than a frontal
    assault on his reelection campaign. By contrast,'
