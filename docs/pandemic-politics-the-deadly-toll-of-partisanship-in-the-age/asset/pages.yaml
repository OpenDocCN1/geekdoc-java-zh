  md: 'Among those policy items that feature partisan differences, what role do anti-immigrant
    attitudes play? Figure 7.10 differentiates between low-AIA and high-AIA respondents,
    as before.


    Among low-AIA respondents, we see strong partisan differences in support for quarantining
    Chinese in the United States and implementing entry restrictions on the U.S.-Mexican
    border (with diverging trajectories). But there are no such partisan differences
    in support for a domestic travel ban, and support was fairly divided. This suggests
    that low-AIA respondents did not yet have solid opinions about domestic travel
    bans. Had state and federal authorities so desired, they could muster mass support
    for or against interstate borders, imposing highway temperature checks, and otherwise
    limiting travel within the country.


    Among high-AIA respondents, by contrast, partisan differences were opposite what
    one might expect: high-AIA Democrats express greater support for quarantining
    Chinese in the United States, whereas high-AIA Republicans express greater support
    for entry restrictions at the U.S.-Mexican border than do Democrats but only marginally.
    High-AIA Democrats also supported domestic travel bans more than did high-AIA
    Republicans and independents/nonpartisans. While we have limited information about
    what might motivate this finding about high-AIA Democrats, it could be that these
    Democrats had a general appetite for a strong government response to managing
    COVID-19.


    # Conclusion


    COVID-19 transformed U.S. immigration policy at a time when immigration policy
    was more politicized than it had ever in recent history. The COVID-19 pandemic
    provided cover for Trump to enact some of the harshest restrictions in recent
    history. Federal emergency measures of early March 2020 were extended into the
    summer, with deleterious effects on both immigration numbers and government practices.
    And while immigration control was a broadly popular policy, the administration
    squandered an opportunity to unify and protect Americans. Restrictions were poorly
    implemented, politicized, and left unsupported by related policies that can make
    immigration control work to mitigate the spread of the pandemic. Trump’s policies
    were successful at lowering immigration, which was his main policy objective;
    were largely ineffective at doing anything else.'
