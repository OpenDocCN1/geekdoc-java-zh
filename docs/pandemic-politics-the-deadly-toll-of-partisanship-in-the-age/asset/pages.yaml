    # Conclusion


    The COVID-19 pandemic was an emotional time, perhaps the greatest underatement
    in the history of social science. In theory, few scenarios are more threatening
    for the public and for political leaders than an unknown pathogen capable of killing
    otherwise healthy people making its way around the globe with little respect for
    borders. The regular tools of policy making and keeping the public safe were inadequate
    against a crisis'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'that only was sickening Americans but also crashed entire industries such as
    travel, entertainment, and dining, leaving the whole economy upended.


    Unsurprisingly, there was a great deal of negative emotion about the pandemic—anger
    and disgust at the government''s poor performance and worry about getting sick
    and life being disrupted—and these negative feelings have been sustained over
    the course of many months. We have shown, though, these negative feelings about
    public health and the government response to the outset of the pandemic were stronger
    among Democrats than Republicans and stayed stronger over time. Democrats worried
    more than Republicans, and in particular they worried about getting sick. Republicans
    were hopeful, expressing less worry about becoming ill and fewer negative emotions
    about the early chaotic and ineffective government response to the pandemic.


    Most of the time, people respond to shock events such as a pandemic in a standard
    fashion. They assess whether there is something wrong, how relevant this threat
    or opportunity is to, how certain they are of the cause, and whether there is
    someone or something responsible for the threats. The emotions they feel, in turn,
    help to shape their responses to the event in terms of self-protecting behavior
    and whom they blame for the event. But in the COVID-19 pandemic, partisanship
    intervened in this process. Partisanship affected the emotional response and how
    people apportion credit and blame for the handling of the pandemic. Something
    as basic as our emotional response to the pandemic was essentially biased by partisan
    identity. Democrats and Republicans alike saw the same death rates and government
    response but blamed different actors for these outcomes and even felt differently
    about them. We showed in chapter 3 how partisanship shaped health behavior, and
    in what follows we will investigate the implications for public policy in response
    to the pandemic.


    For the millions of Americans who suffered hardship and loss during the COVID-19
