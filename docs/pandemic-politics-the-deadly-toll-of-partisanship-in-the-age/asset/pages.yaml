  md: '# Additional Details for Chapter 4


    In chapter 4, we showed there to be substantial differences in health behavior
    among Democrats, Republicans, and others. But periodically, we also encountered
    a question: are those differences the product of partisanship or something else—such
    as income, education, or race—that also happens to be related to partisanship?
    Take the example of income. If higher-income people are more likely to identify
    as Republicans and if higher-income people have different kinds of health behaviors
    than lower-income people, the fact that Democrats and Republicans differ be explained
    by income rather than partisanship.


    To address this question, we relied on a standard statistical technique known
    as multiple regression. Taking the running example of income and partisanship,
    the basic idea is this. First, look to see how much of a relationship there is
    between income and behavior. Then, accounting for that difference associated with
    income, see if there is any remaining difference between Democrats and Republicans.
    In the language of statistics, we change our focus from the correlation to partial
    correlation between partisanship and behavior, conditional on income. Variables
    such as income in this example are known as “confounding variables” or “confounders,”
    and when we account for what we write that we have “adjusted” or “controlled”
    for these confounders.


    Multiple regression does not allow us to answer all questions that we might want
    to ask our data. It is a statistical procedure, not a magic mirror; the aphorism
    that “correlation does not imply causation” applies equally to multiple regression
    analyses. However, multiple regression gives us powerful tools to isolate partisanship
    from other factors that explain our health behavior data. We will never conclude
    based on multiple regression analyses that partisanship causes anything—we cannot
    prove cause-and-effect using data such as this—but we will conclude that partisanship
    differences cannot be explained by a whole of other economic, demographic, or
    geographical factors.


    To check whether we1 differences by party are explained by something other than
    partisanship, look to figure A.1. To read it, look first to the points. Each is
    associated with a different health behavior (the titles of the subplots) and a
    party (which appears on the y-axis of the left-hand'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'side of each subplot). Arrayed across the bottom of each plot along its x-axis
    is a scale from 0 to 1. We can read the predicted proportion of respondents from
    each political party who report COVID-19 behavior by looking to the y-axis of
    each subplot for the party and to the x-axis to the predicted proportion. As part
    of this exercise, we can also calculate the uncertainty in our predictions, which
    we represent with the bars that go through each point. When these error bars overlap,
    we cannot conclude that respondents differ by partisanship. When they do not overlap,
    we are more confident that whatever partisan differences we uncover are not simply
    due to chance (hereafter we will use the term “confidence intervals”).


    In a similar fashion, we investigate the enduring partisan differences that we
    identified across the six survey waves using a multiple regression approach. In
    this case, we can follow our respondents’ employment status over the course of
    the pandemic as well as other measures of how Americans were interacting with
    the crisis—such as whether they were praying more frequently or looking at the
    news more frequently—that might also explain these partisan trends. We can also
    account for state-level policy differences as well as local-level COVID-19 caseloads
    and death tolls over time, each of which might explain the partisan differences
    that we have identified above. The results of our statistical analysis appear
    in figure A2.'
