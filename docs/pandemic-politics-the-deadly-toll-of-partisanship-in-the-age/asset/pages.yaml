    # The Partisan Politics of Election Administration


    The 2020 presidential election was especially contentious because partisans debated
    not only the substance of the candidates but also the infrastructure of the election
    itself, that is, how the election was going to be conducted. With in-person voting
    during a pandemic a serious public health risk in the minds of many Americans,
    state governments sought alternatives. Two options were of particular import:
    expanding the availability of alternatives to in-person voting such as voting
    by mail, and delaying the election itself. Although the latter option seems extreme,
    it was actually implemented in sixteen states during the early months of the pandemic,
    which coincided with the latter half of the presidential primary season.¹¹ New
    York governor Andrew Cuomo wanted to cancel his 2020 presidential primary altogether,
    arguing that the primary results were already settled and that in-person voting
    was too risky from a public health perspective.


    By delaying elections and implementing voting by mail are fraught political decisions.
    Efforts to delay presidential primaries were met with some opposition: a federal
    judge rejected Governor MikeWine’s plan to delay the March primary in Ohio, calling
    it “a terrible terrible.”¹² The timing of an election is sacrosanct in the United
    States, where officeholders have fixed terms and presidential elections occur
    regularly every years on the second Tuesday after the first Monday in November.
    (This is unlike parliamentary systems, where elections can be more unpredictable,
    called by the prime minister to strategically extend their term or provoke a vote
    of “no confidence” by a majority of the parliament.) So, it is noteworthy that
    both Republicans as DeWine and Democrats such as Cuomo sought to delay primaries
    out of concern for public health. No serious calls for delaying the presidential
    election were heard from Republican party elites or prominent news sources when
    it came to the November 2020 general election, although Trump himself did float
    the idea in July, with no success.¹³'
