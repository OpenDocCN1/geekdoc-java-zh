    These mass cancellations created de facto lockdowns throughout the United States,
    even in states that did not issue official stay-at-home orders. This was what
    Moun described in his Atlantic column “Cancel Everything,” which included “extreme
    social distancing” in the form of mass cancellation of events, from sports to
    universities to presidential campaigns.¹ “This administration is unlikely to do
    these things well or quickly,” he wrote. “Hence, the responsibility for social
    distancing now falls on decision makers at every level of society.


    Mounk’s argument reminds us that when we consider policy options in response to
    COVID-19, we have to include those that were outside of the government’s authority.
    How much did individuals support “canceling everything”? This idea shifts from
    thinking explicitly about what government should do to more general views about
    how society as a whole ought to respond to COVID-19. As Mounk indicates, this
    captures what individuals and businesses should do in the absence of government
    leadership.


