- pgno: 199
  md: 'Our survey data help us to make sense of the politics of immigration policy
    as a tool for managing the pandemic. More so than other issue areas that we have
    addressed in previous chapters, when it comes to immigration policy, we found
    that partisanship mattered in subtle ways that depended on respondents’ general
    orientation and predispositions toward immigrants. And although the immigration
    policy debate was highly racialized by the Trump administration’s anti-Chinese
    rhetoric, Americans’ views towards policies such as entry bans did not follow
    a simple racial logic. Rather, the survey evidence we amassed told us general
    concern about the pandemic in specific national contexts mattered at least much
    as racial positions. Notably, for non-Republicans who held strong proimmigrant
    targets of Trump’s ire, we detected a form of solidarity with Chinese as the underserved.
    We also saw how low-AIA Democrats may have worried that support for prohealth
    measures such as an immigration ban could be misinterpreted as support for Trump’s
    xenophobic policy agenda, which only deepened under the cover of the pandemic.
    And we saw high-AIA Democrats supporting restrictive immigration measures, such
    as domestic quarantining and closing the U.S.-Mexican border, suggesting where
    emergency times could find rallying points.


    Put another way, what we learned in sum is that emergency travel policies were
    made in the context of latent public attitudes that support control and prohibit
    nuance. But perhaps the real legacy of a continued focus on border control, coupled
    with racist elite commentary about the “Chinese virus,” may have been that it
    pivoted attention toward the border and away from mitigation efforts that may
    have slowed the spread of the virus in the United States, such as domestic travel
    restrictions, quarantining, and contact tracing.'
