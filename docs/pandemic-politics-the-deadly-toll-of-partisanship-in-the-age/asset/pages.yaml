    localized factors in an attempt to move away from the national context, partisanship
    defined both elite and mass responses to the pandemic early. Once set, the partisan
    course of the pandemic never deviated.


    We develop this argument over ten chapters. Our goal is to produce a definitive
    account of the politics of the COVID-19 pandemic in the United States, from how
    it became partisan to the consequences of that choice and from individual worries
    and policy attitudes to health-related behaviors such as wearing a mask and getting
    vaccinated. A comprehensive account necessarily begins before the pandemic reached
    American shores. Chapter 1 sets the stage by describing in detail what we have
    labeled “preexisting conditions,” which we foreshadowed in this introduction.
    They include a decaying and politicized health care environment, economic and
    racial inequality, Trump himself, and above all, partisan polarization. We think
    of these conditions as time zero, what epidemi would describe as the time before
    an outbreak threshold when a pathogen starts reproducing at high rates.¹ While
    these factors would make the U.S. outbreak bad, the choice to politicize the pandemic—attaching
