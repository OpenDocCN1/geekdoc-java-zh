  md: 'National Hockey League. On March 12, Broadway shut its doors. St Patrick’s
    Day parades nationwide were canceled. The Coachella Valley Music Festival was
    canceled. The 2020 Summer Olympics in Tokyo was canceled, the first time that
    an Olympics were canceled since World War II. Taylor Swift and Harry Styles canceled
