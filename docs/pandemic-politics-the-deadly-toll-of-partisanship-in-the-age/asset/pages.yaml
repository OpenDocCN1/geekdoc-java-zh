  md: 'In the context of a divided Congress, a divisive president, and an unprecedented
    pandemic, though, the partisan politics of granting more authority to the federal
    government should complicated. On the one hand, partisan consideration should
    predict Democrats would want to give a president of the opposing party as few
    powers as. On the other hand, Democrats wanted the government to do something
    in response to the pandemic and for the pandemic to be taken seriously. Republicans,
    for their part, might have preferred a more limited role for government, consistent
    with conservative principles in American politics. But at the same time, they
    might have preferred their president be the authority to respond to the pandemic
    on the belief that by acting quickly and decisively can the president bring the
    pandemic to an end. And given the general low-trust environment in which policies
    are made, even minimal government steps might be opposed. Our survey revealed
    that Democrats'' reluctance to grant Trump more powers was outweighed by their
    desire for the government to do something in response to the pandemic. Republicans,
    by contrast, generally preferred government inaction.


    To disentangle the partisan politics of COVID-19, we begin by looking at responses
    to a general question of lockdown enforcement. We asked individuals in June whether
    “authorities in my state should strictly enforce lockdown measures” or “not enforce
    lockdown measures,” with a sliding scale to indicate a respondent''s position
    between 1 (strictly enforce) and 9 (not enforce). This question not only measures
    support or opposition to lockdown measures but also explicitly forces respondents
    to gauge how involved their state government should be enforcing lockdown measures.
    Around the world, there was wide variation in how stay-at-home orders were designed
    and enforced. For instance, on the more restrictive end of the spectrum, for nearly
    two months beginning in March 2020 France required all residents to obtain permission
    for any travel outside of the home and were fined if individuals were found outside
    of their allowed perimeter.'
