    referring to civil servants as members of a “deep state” intent on harming his
    presidency.²⁶ Investigations from the House Select Subcommittee on the Coronavirus
    Crisis later revealed that not only federal agencies unprepared for a quick response
    to the pandemic due to their internal issues such as staffing and morale, but
    there was also political'
