    In 2020 at the outset of the pandemic, there was relatively strong support for
    “canceling everything” among all Americans. This aligns with an early consensus
    whereby, as the saying, “we’re all in this together.”²⁵ Schools went virtual in
    red states and blue states alike, and late-night TV shows started broadcasting
    from home.


    By April, however, there were the beginnings of sort of partisan divergence we
    have detected in many other aspects of the pandemic. For Democrats, support for
    canceling everything remained consistently high throughout the pandemic, persisting
    even while under the Biden administration. For Republicans, support for canceling
    everything dropped precipitously in April and June. The steep drop-off in support
    for canceling everything in mid-April happened just as protesters started to crop
    up across the country to “reopen the economy.” From Minnesota to Utah and California
    to Michigan, Trump lambasted Democratic governors for their strong measures to
    control the spread of the virus (“the cure can’t be worse than the problem itself”).
    And as one Utah citizen put it, “Quarantine is for sick people; you lock healthy
    people away.... But when you lock healthy people away, that’s tyranny.”²⁶ April
    12 was also the date that Trump, who liked the idea of packed churches on Easter
    Sunday, had previously announced as his target for a return to normal.


    The closeness of Democrats and Republicans in early March 2020 occurred during
    that window of opportunity that a unifying message might have kept these groups
    closer together. But the Trump White House was not so inclined. As Democratic
    presidential nominees Biden and Bernie Sanders moved their campaigns online, Trump
    continued to hold in-person rallies, some of which proved to be COVID-19 superspreader
    events.²⁷ Republican opposition to canceling or adapting events reflected Trump’s
    eagerness, shared by the Republican Party leadership, to project confidence and
    get the economy going again.'
