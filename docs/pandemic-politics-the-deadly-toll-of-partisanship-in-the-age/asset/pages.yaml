    # Conclusion


    The COVID-19 pandemic made an already tenuous democratic situation even precarious.
    America had been experiencing for years what political scientists termed “democratic
    backsliding,” accelerated by Trump’s personalistic ruling style and patrimonial
    practices and the failure of the Republican Party to uphold “institutional safeguards”
    that protect democracy from authoritarian power grabs. The pandemic made the United
    States even more vulnerable. National health emergencies require leadership and
    coordination, that is often manifest in a consolidation of power. Sometimes states
    pass national security laws so they can act fast, as the United States did with
    the Patriot Act after 91. But security laws can be used by authoritarian leaders
    for undemocratic ends, such as Brazil’s president Jair Bolsonaro’s violent crackdown
    on critics of COVID-19 response. Consolidating power in a crisis can be a precarious
    exercise for democracies, so keeping an eye on democratic norms is a vital exercise.


    What are we to make of partisanship and the 2020 election? On one hand, the implications
    are plain: Americans are sharply divided according to their partisan identity
    in ways that are increasingly associated with broad indictments of the condition
    of American democracy rather than simply their satisfaction with the government
    in office. It is one for'
