  md: '# Additional Details for Chapter 6


    Here, we describe in more detail the survey experiment whose results appear in
    figure 5.12. The idea behind a survey experiment is simple: we randomly assign
    respondents to several groups, then respondents are asked a question that differs
    across groups on one important detail. We then compare responses across groups
    of respondents to ascertain how much that detail matters. Randomization gives
    us a key advantage: we can assume that on average there is no difference among
    groups who got each treatment and the control group. Comparing responses across
    groups thereby allows us to estimate the effect of the treatment. If there are
    no differences in support for a policy across groups, despite the groups having
    asked about different levels of government (federal vs. state), we can be confident
    that the level of government does not matter.


    The results in figure 5.12 plot the predicted level of support for each policy,
    alongside 95 percent confidence intervals, based on specified level of government
    (“we,” “the federal government,” or “the state government”) and separated out
    by partisanship. When confidence intervals overlap, we conclude that there is
    no effect of the experiment—in other words, that the level of government does
    not affect support for the policy.'
