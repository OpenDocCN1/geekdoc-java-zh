  md: '# 8


    # The Burdens of Inequality


    RACE AND THE COVID-19 PANDEMIC


    In March 2020 Michigan was under a state of emergency because of the coronavirus
    pandemic, but the buses in Detroit were still running. Essential workers needed
    to get to work, people needed to shop for groceries or go to the doctor, and residents
    without a car had little choice but to take the bus. Detroit is a poor city: more
    than 50 percent of its residents live below the poverty line. The city has a legacy
    of residential segregation that has left predominantly Black neighborhoods with
    fewer resources and higher crime rates than predominantly white neighborhoods.
    Black residents are also more likely than white residents to live in dense neighborhoods
    with fewer hospitals and pharmacies and more likely to be public transit riders
    than white residents.


    One bus driver Jason Hargrove went to work in March 2020 despite the risks posed
    by the coronavirus. At the time, bus drivers were not provided with personal protective
    equipment, and passengers were not socially distanced or masked. On March 21,
    Mr. Hargrove posted a Facebook video criticizing a rider for coughing in the bus
    without covering her mouth, noting that she was putting everyone at risk. He pleaded
    with people in the public to take the virus seriously, saying “I violated. I violated
    for the folks that was on the bus when this happened”, he said, adding: “To those
    who are watching,—this is real.”— On April 3, the Centers for Disease Control
    and Prevention (CDC) started recommending the public consider wearing cloth masks
    in public. This recommendation came too late to help Mr. Hargrove, who died of
    COVID-19 on April 1, 2020.


    What happened to Mr. Hargrove is emblematic of what would happen time and again
