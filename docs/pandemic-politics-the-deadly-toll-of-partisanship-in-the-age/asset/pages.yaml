    As a preexisting condition to the pandemic, partisan polarization meant that Americans
    were predisposed to accept information from political leaders of their most favored
    political party even if that information was inaccurate and reject information
    from political leaders of their partisan opponents even if that information was
    accurate, designed to keep them safe, and on sound medical advice.


    In the U.S. political system, the political leader who commands the most attention
    is the president; presidents’ position of power mean that they are in the media
    spotlight, and unlike other political bodies, the president speaks with a single
    voice.24 The public generally takes cues on what issues to be concerned about
    the leaders of their own party25 and will use the president’s position to guide
    their own policy preferences.26 This means that if a Republican president announces
    a policy about some area where a Republican voter is uncertain or uninformed,
    Republicans may conclude that it must be a position that they support. A Democrat
    in the same position, by contrast, may conclude that it is a position they oppose.


    One implication of this way of thinking about politics is that people are more
    likely to accept messages from the political leaders and the president of their
