    # IS IT REALLY ABOUT PARTISANSHIP?


    As social scientists, one of the questions we must ask when looking at results
    like this is whether behavioral differences are really about politics. After all,
    Americans’ political affiliations and ideological orientations are as much a product
    of their social and economic circumstances as they are something inherent to their
    identities. Perhaps Democrats consume different kinds of news that gave them a
    different perspective on the seriousness of the pandemic, or perhaps Democrats
    tended to work in jobs that allow them to socially distance more effectively.
    If so, knowing that Democrats and Republicans are different does not tell us that
    they are different because of their political orientations or partisan affiliations.


    We also know that there were sharp geographical differences in how COVID-19 spread
    through the United States. Those areas hit first by blue states such as Washington
    and New York, not red states such as Alabama and Idaho. Moreover, the crisis unfolded
    first in urban areas that are especially left-leaning (Seattle and New York City)
    rather than in rural areas that vote Republican (such as the small towns between
    Syracuse and Ithaca in upstate New York). If Republican respondents tend to live
    in small towns or in the outer suburbs of large cities in red states such as Missouri
    or Texas or our Democrats tend to come from urban areas or from blue states, then
    partisan differences that we find might be about geography rather than partisan
    itself.


    In the language of the social sciences, factors such as income, education, and
    geography that might plausibly explain the differences in health among Democrats
    and Republicans are known as “confounds.” If we want to know whether partisan
    differences in health behaviors are really about partisanship rather than inadvertently
    reflecting things such as geography or income that happen to be related to partisanship,
    we need to adopt a strategy that accounts for, or controls, for those differences.'
