  md: 'No survey can cover everything, so we designed our survey with the objective
    of capturing how Americans were changing their health behaviors in both easy and
    difficult ways as well as their demographic profiles (e.g., race, ethnicity, income,
    gender, partisanship) shaped those responses. Based on this, we chose eight health
    behaviors in wave 1 of our survey that ranged from easy and low-cost behaviors
    (more handwashing and purchasing hand sanitizer, for instance) to costly and involved
    (visiting the doctor and self-quarantining). Notably, on wave 1 we did not ask
    about mask wearing because the CDC was unequivocal that only people who worked
    in health care or were caring for infected people needed to wear masks, and the
    surgeon general was actively discouraging the public from buying masks because
    there was a shortage of personal protective equipment for health care workers.


    Some behaviors were publicly observable (e.g., leaving home), while others were
    private (e.g., handwashing). We would not necessarily expect partisan or other
    demographic differences to appear for a behavior such as handwashing, which costs
    little and is normally done by oneself. If behaviors were meant not just to protect
    people from coronavirus but also to signal something to others about how seriously
    they took the virus, then behaviors such as mask wearing and social distancing,
    which were public gestures, would be clearer signs that health behaviors had a
    political meaning as well.'
