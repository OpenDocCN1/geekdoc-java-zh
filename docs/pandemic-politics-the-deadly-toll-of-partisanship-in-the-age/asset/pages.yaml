    # Race and Protest


    The pandemic spring of 2020 led into a summer of protests against racial injustice
    and police brutality following the killings of Black people by police in cities
    across the United States. On Memorial Day 2020 the United States was close to
    one hundred thousand deaths from coronavirus, cases were rising again, and many
    Americans were still working from home, going to school online, and social distancing.
    On that day, George Floyd was murdered.


    George Floyd was a forty-six-year-old Black man living in Minneapolis, Minnesota.
    On May 25, 2020, he was arrested on suspicion of having used a counterfeit $20
    bill to purchase a pack of cigarettes at a local grocery store. After restraining
    and handcuffing him and placing his face down in the street, police officer Derek
    Chauvin knelt on Floyd’s neck for nine minutes and twenty-nine seconds, surrounded
    by three other police officers and a crowd of onlookers who experienced horror
    and outrage as the event unfolded. Body weight onto the neck of Floyd, he repeatedly
    said that he could not breathe. Mr. Floyd suffocated and died.


    In the days following Floyd’s murder, protesters filled the streets of Minneapolis.
    They were confronted with force by the police, who used tear gas and rubber bullets,
    and later by the National Guard. The protests that started in Minneapolis in late
    May 2020 spread across the country, with more than 4,700 demonstrations in more
    than 2,500 locations. In wave of 3 of our survey, 115 out of 2,104 respondents
    reported participating in the George Floyd protests: only four were Republicans;
    the rest were mostly Democrats. These protests—in small towns, suburbs, and cities
    alike in the United States and around the globe—u2014 prompted by the killing
    of other unarmed Black people such as Ahmad Arbery in a subdivision near'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Brunswick, Georgia, and Breonna Taylor in her home in Louisville, Kentucky.
    The protests continued all summer, with an estimated 20 million Americans taking
    part, making this one of the largest protest movements in American history. Our
    115 George Floyd protestors included Americans of all races and incomes from thirty-four
    different states and the District of Columbia. To give a sense of the scale of
    these protests, 15 of our survey respondents reporting having participated in
    the much-discussed antilockdown/stay-at-home protests from the spring of 2020.


    We will address some of the political consequences of these protests in chapter
    9, where we discuss the implications of the pandemic on democracy. Here, we simply
    note that these protests were accelerated by the conditions of the COVID-19 pandemic
    that had so clearly revealed the racial inequalities in those who were sick and
    dying as well as heightened Americans’ sensitivity to both the structural foundations
    and political choices that created and sustained these inequalities. Millions
    of people who would otherwise be at work or socializing or traveling were more
    isolated and faced the brutal reality that America’s racial minorities were suffering.
    Police violence was not an uncommon occurrence, but it could be that a cross-section
    of Americans were paying attention because they were at home. Or, put another
    way, Americans were not preoccupied by the many small distractions that happen
    in our day-to-day lives.


    While we cannot conclude definitively that the COVID-19 pandemic created the conditions
    for the protests in the summer of 2020, it is clear that popular frustration was
    high enough to make such mobilization surprising. Millions of people joined Black
    Lives Matter protests in their communities, despite stay-at-home orders and fears
    of community congregation. Pictures of protests and mass gatherings were distinct
    from those of contemporaneous Trump rallies and antlockdown protests because the
    vast majority of participants were wearing masks. While public officials as CDC
    director Robert Redfield raised concerns that these protests might prove to be
    a “seeding event” for COVID, one paper found “no evidence that urban unrest ignited
    COVID-19 case growth during the more than three weeks following protest onset.”
    This, too, unlike Trump rallies, many of which were held indoors and without masks
    or social distancing, and proved to be superspreader events.'
