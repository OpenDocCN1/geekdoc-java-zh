    # Conclusion


    It is no surprise that the COVID-19 pandemic caused a major economic recession.
    Unemployment claims in early and mid-2020 were some of the highest ever on record,
    bringing American economic growth to a sudden halt after a decade of steady economic
    recovery under Presidents Obama and Trump. Like many past recessions, the effects
    on unemployment were particularly felt by Black and Latino/a Americans. Unlike
    most past recessions, the unemployment effects were also disproportionately felt
    by women compared to men. Accompaning the rise in unemployment was a stark rise
    in economic precarity, exposing the long-standing weaknesses of the American welfare
    state and the racialization of poverty and inequality in the United States.


    Digging deeply into our survey data also gives us important insights into the
    politics of the pandemic economy. Americans broadly supported an active response,
    including the measures in the CARES Act, but the partisan disagreement in Washington
    about how to respond to the crisis was mirrored by partisan differences in how
    Americans wanted to respond to the crisis. Taken together, our analysis in this
    chapter once again illustrates a key dynamic of the politics of COVID-19 in the
    United States:'
