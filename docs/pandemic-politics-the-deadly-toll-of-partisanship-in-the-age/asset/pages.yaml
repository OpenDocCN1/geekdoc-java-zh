- pgno: 95
  md: 'To do this, we use a common statistical technique known as multiple regression
    (for full details on our methods, see the appendix). This technique helps us determine
    whether an association such as the one we have uncovered between partisanship
    and health behaviors is actually explained by other factors that we know that
    Democrats have higher levels of education on average and that Republicans have
    higher incomes, and perhaps they live in different parts of the country and in
    different kinds of localities. Multiple regression adjusts for these other factors
    and shows us how Democrats and Republicans are comparable across all other dimensions
    (income, education, place of residence, etc.) respond. If we still see differences
    in behavior after accounting for those differences, we are much confident that
    it is partisanship that matters.


    The overall message from our multiple regression analysis is that the partisan
    differences we uncovered in figure 3.7 are not explained by any of the sociodemographic
    or geographic confounders that we have discussed previously. For example, when
    accounting for the effect of demographics such as income, education, and gender,
    Democrats were still about 10 percentage points more likely to avoid gatherings
    than Republicans and 20 percentage points more likely to seek information about
    COVID-19.


    We also asked this question a different way: “If we had to choose the factors
    that best predict COVID-19 health behavior, would partisanship be one of them?”
    Posting this question allowed us to use a statistical procedure known as the “lasso”
    method whereby we can sort through a hundred variables to select those that explain
    health behaviors. We detail the logic of this analysis in the appendix; the result
    was that partisanship was the best predictor of COVID-19 health behavior of all
    the factors that we measured.


    This is powerful evidence that despite the many ways Americans differ socially,
    economically, and geographically, politics matters. Especially when it comes to
    pro-social health behaviors such as physical distancing, in March there were meaningful
    partisan differences in health behaviors across Americans that we cannot neatly
    explain by other factors.


