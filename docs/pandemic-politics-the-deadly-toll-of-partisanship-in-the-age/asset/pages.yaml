    # Conclusion


    The COVID-19 pandemic both revealed and exacerbated the underlying racialized
    social and economic inequality in the United States. Communities of color in the
    United States have suffered worse health outcomes than whites, and so were many
    communities of color hit especially hard by COVID-19. Blacks, Latinos, and Native
    Americans were more likely to get COVID-19, suffer worse complications, and die
    at higher rates compared to whites even when taking into account underlying health
    conditions. Among Asian American communities, Pacific Islanders were more likely
    to die of COVID-19 than whites, while other Asian American groups faced similarly
    to whites. These unequal outcomes are the product of centuries-long health inequalities
    between white Americans and communities of color, sustained through structural
    and economic inequalities fueled anew by the COVID-19 pandemic.


    Racial inequality in health outcomes is not a product of partisanship itself,
    but as we have shown in this chapter, partisanship helps to explain how Americans
    interpret the racial politics of the COVID-19 pandemic. And of course, partisan
    politics has sustained the racialized inequalities in access to quality health
    care that explain the racial differences in health outcomes during the COVID-19
    pandemic. In these dynamics, we can see not only how race matters for American
    politics but also how American politics has shaped the racial consequences of
    a pandemic that affects all Americans.


    The racialized inequalities brought to light by the COVID-19 pandemic are only
    part of the story, long-simmering issues of police violence and anti-Black racism
    came to light during the summer of 2020. The pandemic also brought special hardship
    to the AAPI community in the United States because of unfounded fears. chapter
    9, we turn to consider how COVID-19 and racial justice interacted with the broader
    political environment and the 2020 presidential election.'
