  md: '# APPENDIX


    Here we provide further information on survey details as well as additional analyses
    for the interested reader.


    # Survey Details


    Our sample was collected by YouGov, a high-quality survey firm. YouGov recruits
    and maintains an online respondent pool using a procedure called active sampling,
    in which restrictions are put into place to ensure that only people contacted
    are allowed to participate, to form a pool of registered users. YouGov panels
    are populated by a host of recruitment strategies, including standard advertising
    and strategic partnerships with a broad range of websites. YouGov employs internal
    rules for determining eligibility and exclusion criteria, and researchers play
    no role in selecting the participants. Participants in YouGov panels are fairly
    compensated with points, which may be redeemed for rewards including cash and
    gift cards (e.g., Amazon, Best Buy, Target). Researchers play no role in assigning
    point value.


    This research was approved by the Institutional Review Board for Human Participant
    Research at Cornell University (Protocol 2003009479), the Institutional Review
    Board at the Office of Research Integrity and Protections at Syracuse University
    (Protocol 20-099), and the University of California, Irvine (through a procedure
    of self-emption with confirmation from the Office of Research, March 6, 2020).
    In obtaining a representative sample, the pool of participants was nationally
    diverse and random within the sampling frame. The research does not differentially
    benefit or harm vulnerable populations. Participants had to click “yes” to affirm
    informed consent and, if confirmed, were directed to the start of the survey.


    YouGov samples were matched to a sampling frame derived from the full 2016 American
    Community Survey one-year sample on age, gender, race, and education. Matched
    cases were weighted to the sampling frame using propensity scores, with a propensity
    function that includes age, gender,'
