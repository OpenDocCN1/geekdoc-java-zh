  md: '# Violence against Asian Americans


    At the same time that George Floyd’s murder focused global attention on Black
    lives in the United States, the COVID-19 pandemic was also revealing deep racism
    confronting Americans of Asian descent. The early links between the virus and
    China made by Trump, who tried repeatedly to brand COVID as the “China virus,”
    among other pejoratives, would negatively affect Asian American and Pacific Islander
    (AAPI)-owned businesses and the lives of those in the community. The earliest
    stages of the pandemic were characterized by stigmatization and prejudice toward
    people of perceived Asian ancestry in non-Asian countries. And the United States
    saw unprecedented levels of hate crimes and violence perpetrated against AAPIs,
    from attacks on elderly Asian women on the streets of New York City to a homicidal
    rampage against Asian American workers in Atlanta.


    Like other minority communities, many Asian American small businesses were negatively
    impacted by the shutdowns. But they also faced prejudice and fear sown by politicians
    about China and the virus. About half the Chinese restaurants in the United States
    closed in the spring of 2020, and Chinatowns across the country, once bustling
    immigrant communities, were left with fewer restaurants and family-owned businesses
    by the time the economy started backing up in late 2021. Forty-four percent of
    Asian American women of working age (sixteen and above) reported out of the workforce
    for more than six months, a result driven by their employment in the hard-hit
    leisure and travel industries as well as by their caregivers responsibilities.


    The Asian community also suffered from increased levels of bigotry and violence.
    Asian Americans are often portrayed as perpetual foreigners in the United States,
    commonly stereotyped as “yellow peril” in times of crisis. The “yellow peril”
    myth is the idea that Asians are invaders, culturally inferior to whites, and
    the source of disease. Such stereotypes were highly highlighted and repeated throughout
    Trump’s presidency and became especially explicit in the early months of the COVID-19
    pandemic, when negative views of Asian Americans were associated with COVID concerns
    as well as xenophobic behavior. As described in chapter 7, this is sadly familiar,
    as people of Asian descent'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'have long faced racist and xenophobic sentiments during pandemics in the United
    States and Canada.


    Pandemics, public health, and disease scares lead to not only stigmatization of
    those groups who are associated with the source of the disease but also violence
    against them. In a June 2020 report from the Pew Research Center, Asian Americans
    reported high levels of discrimination and fear. About four ten Asian Americans
    said that people had acted uncomfortable around them since the coronavirus outbreak,
    31 percent said that they had been the subject of slurs or jokes, and 26 percent
    expressed fear that someone would physically attack them because of their race.


    In the spring of 2020, federal law enforcement warned that the coronavirus would
    lead to an increase in hate crimes against Asian Americans based on the assumption
    that part of the public would associate COVID-19 with China and Asian Americans.
    This warning proved prescient. According to the New York Police Department, hate
    crimes against Asian Americans rose 1,900 percent in New York City in 2020 over
    the previous year. Stop API Hate, an advocacy group for the AAPI community, set
    up an online reporting system for members to report harassment. The system received
    more than 6,603 reports of hate incidents directed at AAPIs in the United States
    from March 2020 to March 2021, including verbal harassment, physical assaults,
    and spitting. Firsthand accounts of these incidents reveal that in many, the assaults
    were related to people’s fear and anger around the COVID-19 pandemic. One report
    from a sixty-seven-year-old man in San Francisco illuminates the negative effects
