  md: 'The summer of 2021 was meant to be the turning point, when all Americans could
    return to something close to normal. The Biden administration had set a goal to
    get 70 percent of eligible Americans vaccinated by July 4.§ The Centers for Disease
    Control and Prevention (CDC) was encouraging Americans to take off their masks
    if they were fully vaccinated.‡ Through collective efforts, Americans were promised
    a “summer of freedom,” when the nation would emerge “from one of the darkest years
    in our history into a summer of hope and joy.”


    But that’s not what happened. Fueled by the deadliest variant and more transmissible
    delta and with tens of millions of Americans still unvaccinated, the summer and
    fall of 2021 proved to be some of the deadliest months of the pandemic. Breakthrough
    cases of COVID-19 in fully vaccinated individuals were increasingly common as
    vaccines gradually and inevitably lost their effectiveness over time, but the
    risk of death for the unvaccinated was far higher. The CDC reported in September
    2021, the risk of dying from COVID-19 was fourteen times higher for unvaccinated
    Americans than for fully vaccinated Americans.


    What the Biden administration’s optimistic messaging missed was that partisan
    politics is very difficult to dissolve. All of structural conditions that made
    responding to the pandemic so difficult in the early days of 2020 still persisted
    in late 2021, only to be aggravated by the more contagious delta variant and continued
    vaccine skepticism among millions of Americans. The health care system was still
    overburdened, and the economic fallout from the pandemic had led to furloughs
    and forced retirements of health workers, further staffing hospitals. High rates
    of community transmission (primarily among the unvaccinated) drive high levels
    of hospital admissions, producing overcrowded emergency departments and long wait
    times—such as the wait that killed Daniel Wilkinson. Inequality across the United
    States remained high; if anything, the disproportionate harms suffered by communities
    of color deepened racial and wealth disparities.


    These factors do not fully explain the American predicament, however. The partisan
    conflict over the COVID-19 pandemic, which emerged in the early months of 2020
    before anyone could have imagined that eight hundred thousand Americans would
    die, never abated. Donald Trump left office, and the Republicans lost the Senate,
    but partisan politics remained at the core of the COVID-19 pandemic in the United
    States.'
