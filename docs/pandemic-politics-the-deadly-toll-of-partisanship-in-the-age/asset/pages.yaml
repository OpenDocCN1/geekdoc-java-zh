    to everyone who needed them was a very low bar. We now move from the question
    of government capacity to government authority: instead of asking what the federal
    government was doing (and whether that was sufficient or not), we asked what Americans
    thought the federal government should do? This taps into fundamental questions
    that have long divided American parties about how much authority to give to the
    federal government.'
