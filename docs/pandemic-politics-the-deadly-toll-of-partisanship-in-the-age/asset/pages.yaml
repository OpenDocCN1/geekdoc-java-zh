  img_proc: true
- pgno: 263
  md: 'interference in addition to pressure from the White House on issues of science
    and health.


    Scientific agencies such as the CDC are supposed to function independently from
    the partisan branches of government. Yet interviews with agency leaders and reviews
    of memos, emails, and documents have shown that political appointees tried to
    change or affect the CDC''s guidance and weekly scientific reports about the prevalence
    of COVID-19 and mitigation policies. Dr. Christine Casey, editor of the CDC''s
    Morbidity and Mortality Weekly Report, describes an email that she received from
    an adviser to the Department of Health and Human Services and a Trump political
    appoin that she interpreted as a request to stop a scientific report because it
    harmed the president. She was later instructed to delete the email. A fully functioning
    health bureaucracy that operated without pressure from the White House could not
    have avoided the pandemic altogether. But it could have led a more coordinated
    response from the beginning.


    As the nursery rhyme goes,"If we were horses, beggars would ride." As of December
    2021, the pandemic had taken more than eight thousand American lives. This is
    more than any other country in the world. The United States is the richest and
    most powerful country on Earth, with all the science and technology and best minds
    at our disposal. The U.S. government spent billions of dollars into research and
    development to fast-track a vaccine, and what did we do with it? You can fund
    the best science in the world, but if you can''t convince a critical mass of the
    community to wear a mask, to take a vaccine, or to endure many sacrifices for
    their fellow community members, then the best science will not defeat COVID-19.


    # Looking Ahead


    The death toll from COVID-19 has exceeded that of the average flu season twenty-six
    times over. COVID-19 has killed more Americans than singular events, the 1918
    influenza pandemic, the American Civil War, World War I, the Japanese attack on
    Pearl Harbor, World War II, and the 9/11 attacks. In fact, more Americans died
    from COVID-19 before Thanksgiving 2021 than on 9/11 and Pearl Harbor combined.
    In this book we have traced the many ways that the United States failed to respond
    to the COVID-19 pandemic, setting in partisan patterns that made the pandemic
    worse than it had to be. What does this failure portend for difficult issues such
    as climate change, natural disasters, or yet another'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'pandemic? Have we Americans proven that we cannot work together to solve crises?
    How does the country recover and move forward?


    We have documented so many points of deficiency—from the government’s response
    to citizen behavior—that it is easy to be pessimistic about America’s future.
    But there are important bright spots, aspects of the pandemic that speak to the
    resilience and fortitude of the American public. Hundreds of millions of Americans
    spent their lives, learning to worship and run religious services, teach and attend
    school, argue matters in court, treat patients, and more, all virtually. Hundreds
    of millions of Americans—a vast majority—were face masks in supermarkets, on buses,
    and in schools and places of work without incident. Through a partnership between
    the federal government and private industry, pharmaceutical companies developed
    and tested lifesaving COVID-19 vaccines and brought them together to help pass
    economic relief for the unemployed, renters’ relief, business loans, money for
    hospitals, and direct tax credits for families, among many other provisions to
    support Americans. Prompted by continued economic fallout from the pandemic and
    experiences with the long, slow climb back from the Great Recession of 2007–2009,
    the Biden administration passed a set of policies that broadened the reach of
    the federal government in ways not since seen since President Lyndon Johnson’s
    Great Society. With some of these policies—such as direct payments to families
    with young children, funding for broadband, expanding mass vaccination, and support
    for rural hospitals—are a direct response to the pandemic. They mark a fundamental
    shift in how the federal government interacts with the American public.


    Americans also accomplished a lot on their own without the federal government.
    Americans organized to support one another through mutual aid societies and working
    through civic organizations such as food banks. When the pandemic exposed the
    fissures in society such as racial inequality in health care and racialized police
    violence, millions took to the street in response. The Black Lives Matter marches
    in the summer of 2020 in the wake of George Floyd’s death were also the largest
    protest movement in American history. The pandemic also demonstrated the importance
    and salience of politics to Americans’ everyday lives; voter turnout in 2020 election
    was the highest since 1900.'
