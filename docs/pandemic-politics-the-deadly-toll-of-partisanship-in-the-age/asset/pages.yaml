  md: '# Introduction


    The floor of the Bank of Oklahoma Center in Tulsa was awash in red, white, and
    blue. Eager supporters of President Donald Trump were holding signs, wearing “Make
    America Great Again” hats, and sporting T-shirts with expressions ranging from
    “Guns, God, and Trump” to “Make Liberals Cry Again.” The attendees were young
    and old but mostly white. Parents brought their children. There were memorabilia
    for purchase. Everyone inside the arena had their cell phones at the ready, eager
    to capture moments of the man of the hour.


    Inside, it felt like a typical rally. Outside, however, the atmosphere was tense.
    It was less than a month since George Floyd had murdered by Minneapolis police
    officer Derek Chauvin, and protesters had mobilized the venue carrying signs that
    read “Dump the Trump,” “No Justice, No Peace,” and “Defund the Police.” Law enforcement
    was keeping a tight perimeter. Police branded shields and clubs, and members of
    the Oklahoma Highway Patrol and National Guard were armed and ready. On the street—in
    big yellow capital letters—was writtenBLACK LIVES MATTER.”


    But it was not just the presence of protesters that made the rally notable. What
    was truly exceptional was the turnout. It was June 20, 2020, and Trump was having
    his first in-person campaign rally in four months—in the middle of a global pandemic.


    In a typical election, it would be unheard of a president to take a four-month
    break from the campaign trail. This is particularly true for a candidate such
    as Trump who thrives on applause. But this wasn''t a typical year. The United
    States was in the middle of a global pandemic. The novel coronavirus SARS-CoV-2—commonly
    known as COVID-19—grew from an infection of zoonotic origin in Wuhan, China, in
    late 2019 into a public health emergency of global proportions. COVID-19 spreads
    through respiratory droplets produced when one breathes, coughs, sneezes, or speaks,
    and transmission is more likely when people are in close contact with one another,
    particularly when airflow is poor such as in indoor facilities. COVID-19 infections
    vary dramatically from person to person. Some carriers are asymptomatic; some
    experience fever, loss of smell and taste, and shortness of breath; and some end
    up hospitalized on respirators. And for millions, COVID-19 has proved fatal. The
    first death from'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'COVID-19 in the United States was recorded on February 29, 2020. By the time
    of the June 20 rally in Tulsa, that number had reached 115,000 Americans. And
    by December 2021, over 800,000 Americans had died of COVID-19–related illnesses.


    But you wouldn''t know the country was in the throes of a public health emergency
    by looking at pictures from June 20. Almost everyone in the arena was unmasked,
    and there was no social distancing. Public health officials and experts had warned
    the campaign against holding indoor rally, as COVID cases continued to climb in
    Oklahoma. But here were more than six Trump supporters, coming out to see their
    president.† It wasn''t a full house—the arena was only a third full—Trump was
    back on the road as if the pandemic was over. During his remarks, he even quipped
    that unlike him, his Democratic opponent, former vice president Joe Biden,remains
    silent in his basement.” Biden was like millions of Americans: still at home,
    still socially distancing, still working online, and still navigating the real
    uncertainty of life during a pandemic.


    Trump’s Tulsa rally was a spectacle designed to project strength and “business
    as usual,” routinely flouting public health recommendations and the commonsense
    precautions adopted by hundreds of millions of Americans during the pandemic.
    Biden eventually resumed campaigning only in socially distanced parking lots,
    while Trump kept up his in-person rallies, oftentimes held indoors. Republicans
    even tried to hold a traditional in-person national convention in Charlotte, North
    Carolina, but were forced to scale back to a hybrid format when the state government
    refused to allow the event to proceed at full capacity and without face masks.†


    Tulsa and over a dozen similar campaign events held after would come to be described
    as “superspreader” events. Eight Trump staffers tested positive for COVID after
    the rally, and Tulsa health officials noted the rally “likely contributed” to
    a surge in new COVID cases.³One study estimated the collateral effect of these
    Trump superspreader events: nearly 30,000 confirmed COVID-19 cases, likely leading
    to more than 700 deaths.‡ Trump himself became a vector. According to White House
    chief of staff Mark Meadows, Trump tested positive for COVID-19 on September 26,
    2020. He then kept up an active campaign schedule for almost a week, knowingly
    exposing more than 500 people—from fundraisers to staff to Gold Star families
    to Democratic candidate Biden in the presidential debate'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'in Cleveland, Ohio—before being hospitalized at Walter Reed National Medical
    Center on October 2. Trump received cutting-edge experimental treatment and walked
    out of the hospital three days later. Upon returning to the White House, he was
    photographed immediately removing his mask with a still-active case of COVID-19
    in the presence of White House staff. He tweeted “Don’t be afraid of Covid ...
    Don’t let it dominate your life ... feel better than I did 20 years ago!” The
    same could not be said for the more than 210,000 Americans who had died by that
    point.


    # Politicizing a Pandemic


    It is difficult to describe the devastation that the COVID-19 pandemic wrought
    in the United States. Rich and poor, red and blue states, Black and white, coastal
    and inland, metropolitan and rural—no corner of America was unaffected. The first
    known deaths occurred in mid-February in Santa Clara, California. In March 2020,
    more Americans died from COVID-19 than the number killed in the September 11 attacks.
    By the end of April, the death toll surpassed the number of U.S. military personnel
    who died during the Vietnam War. By December 2020, at around three thousand deaths
    per day, each day was 9/11. By June 2021 when just over half of Americans had
    received at least their first dose of a COVID-19 vaccine, the total number of
    deaths passed six hundred thousand. By December 2021, this grim figure passed
    eight hundred thousand. Even with a vaccine widely available, the United States
    was still seeing thousands of deaths per week during the last months of 2021—a
    figure that exceeds the death toll from the seasonal flu.


    The catastrophic death toll of the COVID-19 pandemic in the United States was
    not inevitable. The novel coronavirus strain—SARS-CoV-2, which came to be called
    COVID-19 (CO for corona, VI for virus, D for disease, and for the year in which
    it was identified)—proved in more ways than one. Biologically, it was a deadlier
    strain of the generic coronavirus. It was also in the scope and rate of spread.
    From the first identified case in Wuhan in December 2019, it spread globally in
    just weeks. Although deadliest diseases such as SARS and Ebola had outbreaks in
    the previous decades, the scale of the COVID-19 pandemic was unequal to any health
    crisis in recent memory.


    And COVID-19 was particularly novel as a public health emergency. Health is not
    an inherently polarizing issue—everyone wants to be healthy'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'and for their families to be safe. Diseases such as Alzheimer’s, opioid addiction,
    and cancer do not differentiate between Americans based on their sport allegiances,
    musical tastes, or partisan preferences. When polio was paralyzing and killing
    children in the United States, Americans across the political spectrum sent three
    million dimes to the White House and helped fund a polio vaccine. During a public
    health crisis such as a pandemic, we might expect our differences to fall away
    as people seek out about what is happening and to be safe. In the case of COVID-19,
    that did not happen.


    Moreover, as the scale of the crisis became clear, we might have expected that
    people would pull together to support government action to overcome it. Economic
    crises such as the Great Depression (1929-1933) and the Great Recession (2007–2009)
    created massive public demand for policies that expanded the scope and size of
    the federal government to protect citizens from the worst of the financial fallout.
    Terror attacks and military crises have historically increased presidential approval
    as feelings of solidarity and patriotism growth and criticism from opponents fall
    away. Nowhere was this rally-round-the-flag effect more apparent than after the
    9/11 attacks, when “United We Stand” banners hung in American homes and George
    W. Bush’s approval ratings climbed to over 90 percent. This coming together, in
    the case of COVID-19, did not happen either.


    The pandemic in the United States was always going to be bad. We can think of
    the United States as a medical patient with a set of preexisting conditions that
    made them susceptible to illness. One preexisting condition was a decaying health
    care system in which insurance interests played an outdated role in costs and
    coverage. A second preexisting condition was deep social, economic, and racial
    divisions that, combined with unequal access to health care, perpetuated structural
    inequality. The third preexisting condition was President Trump, obsessed with
    projecting strength to ensure his own relection, growing bureaucracies tasked
    with coordinating emergency responses, refusing to take responsibility for managing
    the crisis, and nurturing a cult of personality that revolved around his unchallenged
    authority.


    But nothing proved more consequential for deepening the COVID-19 crisis than the
    fatal comorbidity of partisan polarization. Polarization refers to a tendency
    of parties, movements, and individuals to locate themselves on the extremes of
    a political spectrum rather than in the center. It is the'
  merge: -1
  img_proc: true
- pgno: 14
  md: '“simultaneous presence of opposing or conflicting principles, tendencies, or
    points of view.”¹⁴ Democracy is inherently conflictual and competitive, but polarization
    distances people from one another, reducing the potential for consensus and, in
    its extreme form, civility. As political scientists Jennifer McCoy and Murat Somer
    wrote, “polarizing politics always carries the risk of taking on a life of its
    own, eviscerating cross-cutting ties and nonpartisan channels for compromise,
    and becoming pernicious.”¹⁵


    In short, polarization divides the “we” of “the people” into an “us” versus “them.”
    Individuals feel the center, where cross-group dialogue and compromise take place,
    and move out to the extremes. And in the United States, this centrifugal force
    is powered by partisanship. Two parties—Democrats and Republicans—divide the American
    electorate.


    In the United States today, partisanship is not the candidate you choose or the
    policies you support. Partisanship in America is a social identity. It is a status
    of opinions, experiences, and characteristics that define not just who you vote
    for¹⁶ but also, increasingly, who you are. Importantly, partisanship is a social
    identity because it is not just how you feel individually but also how you present
    yourself and relate to others, both those who hold the same identity as you (your
    copartisans) and those who do not (your partisan opponents).


    Of course, individuals hold many social identities, including gender, religion,
    class, education, and personality. But in the United States today, many of these
    identities are becoming aligned with partisanship.¹⁷ Historically, for example,
    observant Christians in the United States were core constituencies of both the
    Republican and Democratic parties. Today, evangelical Christians overwhelmingly
    vote for Republicans.¹⁸ Rural Americans have historically voted for both Republicans
    and Democrats, but today rural whites increasingly align with the Republican Party.¹⁹
    For these reasons, political scientist Lilliana Madison describes partisanship
    as a “meta-identity, with all the psychological and behavioral magnifications
    that implies.”²


    When partisanship is a social identity, it connects the identity of who is a Democrat
    or Republican to what Democrats or Republicans do and who they listen to. For
    instance, if Americans approached partisanship programmatically—that is, by examining
    the issues they cared about and seeing which party best espouses them—'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'partisan identity when parties changed their positions. But rather change or
    update their partisanship when parties change positions, strong partisans (that
    is, those who strongly identify with one party) change their positions to match
    the party with which they identify. There is no better evidence for this proposition
    than the norm-shattering experience of the 2016 presidential election. The Republican
    Party, long viewed as the party of American global capitalism, found itself by
    a politician who hailed against global trade and in favor of protectionism. The
    party changed, so did the preferences of many of its supporters. In other words,
    Americans remained loyal to their partisan identity rather than to their policy
    beliefs. This is what political scientist Julia Azari names the toxic combination
    of “weak parties and strong partisanship,” the willingness of party members to
    follow a president and party even when they move away from core principles.


    American politics has not always been characterized by extreme polarization. The
    country’s winner-take-all electoral system produces a twarty system in which both
    Republicans and Democrats must appeal to multiple social groups to form a viable
    electoral coalition. But whereas once were ideological differences within parties
    (e.g., conservative liberal Republicans), ideology now closely aligns with partisanship
    that liberals vote for Democrats and conservatives for Republicans. Even most
    independents lean toward one party or another and behave in ways that resemble
    partisans.


    Citizens are good at taking party cues because Americans have sorted into partisan
    social groups that bring their social identities in line with their partisan affiliations.
    Take again the example of rural whites have become a bedrock Republican constituency
    there who is also a rural white but who is not a Republican. In previous eras,
    Americans’ social worlds included both Democrats and Republicans even if they
    were all of the same economic or occupational background. These cross-cutting
    social ties were once a key factor in undermining partisan divisions in American
    society but are now less common and more tenuous. Whereas common social and economic
    bonds overrode partisan divisions, today Americans on the Left and the Right do
    not interact as much as they used to.


    The second implication of partisan sorting is more ominous. If partisanship is
    a “mega-identity” that increasingly aligns with other social'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'identities, then it follows that one can mobilize partisans without appealing
    to partisanship itself. A campaign that is relatively certain that rural whites
    share its partisan orientations is just as effective in mobilizing their votes
    by appealing to their rural or white identity as appealing to their views on agricultural
    policy. This also incentivizes politicians to use messages targeted at specific
    group identities rather than messages that appeal across groups.


    Therefore, in the same way that we often hear about red states and blue states,
    we can think of “red” and “blue” Americans. These aren''t just words that describe
    one’s politics; instead, they capture a way of life. For instance, during a colorful
    interview with Michael Anton, a former Trump national security official, and National
    Public Radio host Steve Inskeep, Anton identified himself as a “red person” who
    had formerly been a “blue person.” A blue person might listen to National Public
    Radio, drive a Subaru, watch independent films, support pro-choice politics, and
    live in a blue state. A red person might drive a truck, watch Fox News, attend
    an evangelical Christian church, and support Blue Lives Matter. And, as it turns
    out, red and blue Americans respond differently to a pandemic.


    Deep polarization created two pandemic realities in America: one where the pandemic
    was taken seriously and one where the pandemic was an inconvenience. For many
    Americans the pandemic meant wearing masks, avoiding contact with loved ones,
    canceling travel, and waiting for a safe vaccine or a proven treatment. For others
    the pandemic was overblown, mostly a problem for the old and infirm similar to
    the seasonal flu and certainly not a virus that would require major changes to
    how Americans lived. Many among this group were skeptical of science and vulnerable
    to misinformation about the virus and vaccines. The consequences have been tragic,
    as those who ignore public health guidance have become particularly vulnerable
    to falling victim to the coronavirus themselves, thus prolonging the pandemic.


    When it comes to a communicable virus that requires collective action, polarization
    undermines a government’s ability to respond effectively. At the highest levels
    of government, polarization made the federal response slower and less effective.
    Polarization determined which states would receive federal aid, on what terms
    would mitigate viral spread, and which children would attend school in person
    or online. It determined which experts to listen to and which citizens should
    trust.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'determined who wore masks and who did not. It fostered an environment of low
    trust in government and in each other. In total, partisan polarization produced
    a public response to the pandemic in which individuals assessed risks, formulated
    attitudes, and participated in certain health-related behaviors (or not) because
    of their party identification.


    But this was not inevitable. Yes, America faced structural and social preconditions
    that would make any pandemic hard. Yes, Americans were sharply divided by partisanship
    at the outset of the crisis. But polarization is not an inevitable barrier to
    collective action or to a coordinated, effective response to a pandemic. And and
    other forms of polarization are common around the world, and deeply divided countries
    such as the United Kingdom, South Korea, and Taiwan did not make partisanship
    the lens through which to see or experience the COVID-19 pandemic. Partial divisions
    are deeper and wider in the United States than in any other advanced democracy,
    but this did not make their manifestation in response to COVID-19—over issues
    ranging from perceptions of the government’s handling of the crisis to mask wearing
    and contact tracing—inevitable.


    The crucial factor that differentiates the United States from other high-income
    democracies is that the Trump administration chose to make the pandemic political.
    In the early days of COVID-19'
