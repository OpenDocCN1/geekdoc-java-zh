    # Conclusion


    We learned two major lessons about pandemic politics from the data that came in
    over the course of 2020. First, from the earliest days of the pandemic, there
    was a clear partisan difference in how Americans were responding to COVID-19.
    Democrats were more likely to adopt a whole host of behaviors in response to the
    crisis, from washing hands to social distancing, than were Republicans. Second,
    these partisan differences endured over the ensuing months. We cannot explain
    these partisan differences away with reference to other factors such as race,
    income, education, or anything else that we can measure.


    There is more to explore about the partisan differences we have uncovered. In
    chapter 4 we turn our attention to the emotional foundations of the pandemic,
    looking at Americans’ emotional responses—feelings of disgust, anger, and also
    hope—as well as whom Americans blamed for the pandemic in order to deliver more
    deeply into the partisan foundations of pandemic politics in the United States.'
