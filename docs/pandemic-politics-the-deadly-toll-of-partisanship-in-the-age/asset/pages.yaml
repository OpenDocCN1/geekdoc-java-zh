  md: 'Our findings show that self-interest does not always overwhelm partisanship
    in shaping health behaviors, emotions, or what types of policies people want in
    a crisis. People want to stay consistent with their identities and derive self-esteem
    from those identities, and bristle at being required to change their behavior
    even if doing so will help them avoid falling into a deadly virus. People will
    pursue surprising behaviors to be able to stay true to their party label, such
    as taking ivermectin instead of a vaccine. They will even construct fantastical
    beliefs, such as that the whole pandemic is not real or that it is a political
    conspiracy (i.e., a “pandemic”). This makes partisanship a really powerful tool,
    one that can smooth a stone or sharpen a dagger.


    But partisan identities are malleable, and partisan divisions can be overcome.
    We know, for example, that people who age into Medicare or get access to health
    insurance through the Affordable Care Act become supportive of these programs,
    among Republicans who were traditionally less supportive of government-run programs
    than their Democratic counterparts. People more at risk for effects of the disease
    are more likely to get vaccinated regardless of their partisanship: as of December
    2021, 99 percent of people aged sixty-five and above have at least one dose of
    a COVID vaccine. The challenge is to find ways to overcome partisan politics for
    the rest of us before it is too late.


    # Lessons Going Forward


    With this point in mind, we close this book by outlining a series of lessons that
    we hope Americans and their political leaders can learn from the COVID-19 pandemic.
    Politics made the pandemic worse than it had to be, but we must grapple with how
    our politics might serve Americans better and how we as engaged citizens can support
    one another for the common good.


    Most obviously, America’s preexisting conditions explain—in why the pandemic was
    so devastating in the United States. Partisanship divides Americans, and Trump
    was uniquely unqualified to manage this pandemic, but we draw our attention here
    to the social and economic inequalities that characterize the United States today.
    American health care is too unequal and our system of health care delivery is
    too wobbly and ineffective to be able to withstand a public health emergency such
    as COVID-19. Health care reform has been an ongoing political challenge since
    the 1930s, and'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'there are few issues that captivate Americans’ attention as have Medicare,
    the Affordable Care Act, and the out-of-pocket costs associated with health coverage.
    The COVID-19 pandemic confirms what many have long argued: that the United States
    needs a better, more inclusive, and more equitable health care system. The United
    States is too big, diverse, and too unequal to withstand a shock such as COVID-19
    without thorough reform to the way that health care is purchased, subsidized,
    and delivered.


    Beyond these preexisting conditions, however, one to draw from America’s COVID-19
    tragedy is the importance of public health communication in supporting the work
    of our public health authorities. As social scientists, we think it is essential
    to remember that public health—like science more generally—is a social phenomenon.
    Science does not speak for itself, and findings and recommendations are often
    messy, contested, and hard to communicate. And ordinary people—the three of us
    included—have their beliefs, biases, and values that affect how they receive the
    information provided to them. With these facts in mind, government panels on public
    health and climate science should include social scientists who can help other
    scientists understand the importance of identity in shaping changes in attitudes
    and behaviors. Vaccines are only effective if people are willing to have them
    put in their arms. When science needs to change minds and get people to act, social
    scientists can help craft messages that resonate with different groups. To the
    extent that partisanship is a social identity in the United States—one of our
    motivating premises in this book—it follows that public health communication strategies
    must take partisanship into account.


    Even with a better understanding of the social dimensions of public health communications,
    though, the United States suffers from low levels of trust in government and widespread
    skepticism of public authority, especially at the federal level. Low trust in
    institutions also begets low social trust, which is a huge impediment for collective
    problem solving. Low trust in government means that elected officials struggle
    to establish authority in hard times. Low trust in other means means that community-based
    solutions are not intuitively valuable, leading to default to more individualized
    responses instead. These are long-standing issues in American public life, but
    we nevertheless believe that American citizenship needs sturdier foundations.'
