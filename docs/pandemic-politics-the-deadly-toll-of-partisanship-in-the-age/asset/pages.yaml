    # ### Schools: Back in Session?


    Perhaps nothing was more destabilizing to American families than school-age children
    learning from home. The pandemic forced a “near-total shutdown” whereby almost
    every school switched to virtual learning in March 2020, with tens of millions
    of American children remaining online for some or all of the 2020–2021 school
    year. School closing and reopening policies were generally made by local school
    district and county officials, and experienced widely even within a single geographical
    area. In southern California, you could drive one hundred miles along Pacific
    Coast Highway, from Long Beach in Los Angeles County, where first graders attended
    school virtually, to Newport Beach in Orange County, with in-person first grade,
    to La Jolla in San Diego County, where first grade was virtual again. Or you could
    drive twenty miles from downtown Cleveland, where schools were virtual for the
    2020–2021 school year, to find hybrid and in-person models in neighboring counties.


    The politics of schooling laid bare of the more difficult trade-offs about the
    pandemic. The epidemiological data are clear that young people are far less likely
    to be seriously affected by COVID-19 than are adults. But young people live with
    adults, in many cases with grandparents or other'
