- pgno: 267
  md: 'This means investing in at least two separate dimensions of American citizenship.
    One is practical and immediate: we need positive campaigns touting the benefits
    of public health interventions as vaccines outside of times of crisis in order
    to build reservoirs of active support for public health measures that can protect
    us. These reservoirs of support should foster the development of prosocial norms
    that are less likely to be undermined by politicians, media figures, and celebrities
    with nonmainstream views. Most Americans had never thought to question the public
    health benefits of vaccination prior to the COVID-19 pandemic, not least because
    effective at eliminating disease that the vast majority of Americans never have
    to consider the consequences of diseases such as whooping cough and scarlet fever.
    But this very fact makes it easy for Americans to forget that vaccinations are
    a miracle of our modern world.³31 We need Americans to actively and positively
    associate public health achievements such as vaccination with civic obligation
    over the common good.


    The second investment in American citizenship is more difficult to achieve. One
    common argument about why (mostly small and homogenous) countries have avoided
    the worst of the pandemic is that these are societies that are characterized by
    high levels of political trust. For example, social scientists have held out Denmark
    as an example where public health communications are particularly effective owing
    to Danes'' trust in government and institutions.³32 Similar arguments have been
    made about countries such as South Korea and Taiwan. We acknowledge that trust
    in government and trust in fellow citizens makes pandemic management easier. But
    we cannot simply legislate trust. Social trust and trust in government are not
    policy choices that governments can switch on or off. Even a competently executed
    pandemic management strategy would founder in the United States. Building social
    trust takes time, but it is just as essential to achieving the common good as
    having a President who trusts his advisers and focuses on science rather than
    partisan division.³33


    One explanation for why Americans have such low trust in government is that the
    government has not earned the public''s trust in recent years. Viewed this way,
    we can see how in government might be fortified by reinforcing the importance
    of well-functioning, professional, and impartial federal and state institutions
    for making government work.³34 This is an area in which American politicians can
    act right now if they so desire. Congress'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'has the authority to implement legislative safeguards to preserve the independence
    of key federal agencies such as the CDC and the Food and Drug Administration as
    well as all other federal bureaucracies that are tasked with implementing the
    policies that Congress produces. Likewise, Congress can demand that all executive-appointed
    offices are staffed in an orderly and timely fashion with administrators who bring
    subject matter expertise to the job. Of course, America''s partisans disagree
    on the details of administrative appointments. But if there is one thing that
    the COVID-19 pandemic has taught us it is we need competent authorities making
    decisions, not politicians seeking to exploit the news cycle for political gain.


    Politics is the act of working collectively even when we disagree. We still have
    the capacity to do politics, to work together in times of crisis. But we must
    learn the right lessons from the COVID-19 pandemic. We cannot guarantee that partisan
    polarization and America''s other preexisting conditions will look any better
    when the next crisis arrives in the United States. But we can shore up the load-bearing
    walls that support our political institutions. If we buttress our institutions
    with social science, good citizenship and accountable and prepared institutions,
    and reflect soberly on the deadly price we paid for these lessons, perhaps the
    next crisis won''t produce such tragic outcomes. The pandemic is not yet over,
    but the lessons that we are still learning from COVID-19 should guide policy makers
    toward a better response to future crises.'
