  img_proc: true
- pgno: 240
  md: 'Democrats express their opposition to Trump during his time in office and Republicans
    their opposition to Biden after he had succeeded Trump. It is quite another for
    America''s partisans to hold such sharply divergent views about holding elections
    and granting powers to the president. if democracy is to be a viable system for
    managing the inevitable political conflicts in a country as large and heterogeneous
    as the United States, Americans must not externalize their partisan frustrations
    to the system itself. By the spring of 2021, though, one of the only areas of
    true bipartisan popular consensus was that American democracy is not healthy.


    Some of our findings in this chapter might be, at first glance, reassuring. Although
    it is generally worrisome that so many partisans favor granting greater power
    to the presidency in times of crisis, it is good that these positions change when
    the party occupying the presidency changes. Opposition parties are a check against
    government excess; this is one major benefit of democracy, that a loyal opposition
    exists to make sure that the party in power does not exceed its authority. And
    yet we see still additional cause for worry in the finding that partisan positions
    flip depending on the party in office. In our view, this finding reinforces our
    conclusions that partisanship explains not just voters'' policy preferences but
    also their views about democracy itself. This worrying conclusion, of course,
    also resonates with our findings throughout this book about how partisanship thoroughly
    pervaded the American experience with COVID-19.'
