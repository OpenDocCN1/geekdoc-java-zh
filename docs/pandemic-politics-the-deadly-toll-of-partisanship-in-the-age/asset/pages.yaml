  md: '# Conclusion


    In August 2021 Daniel Wilkinson, a forty-six-year-old U.S. Army veteran who served
    two tours of duty in Afghanistan, had abdominal pain so severe that his mother
    took him to a hospital in Belleville, Texas, an hour outside of Houston. An emergency
    room physician diagnosed him with gallstone pancreatitis, a serious condition
    but rarely fatal. Wilkinson needed a procedure to treat the pancreatitis and a
    bed in an intensive care unit. But owing to the steep rise of COVID-19 cases in
    the area, there were no beds available at the local hospital. Doctors called hospitals
    in Texas, Oklahoma, Arkansas, Kansas, and Colorado for seven hours and finally
    found him a spot at the Houston Veterans Administration hospital. By the time
    he made it to Houston his organs were failing, and doctors could not perform the
    routine surgery that would have saved his life. Daniel Wilkinson died from this
    treatable illness on August 21; he did not die from COVID-19, but instead of COVID-19.


