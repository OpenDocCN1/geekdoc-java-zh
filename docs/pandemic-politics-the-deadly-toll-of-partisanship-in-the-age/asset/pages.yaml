    Alive ” by the Bee Gees. Gloria Gaynor filmed herself “Will Survive” while washing
    her hands, and Neil Diamond rewarded “Sweet Caroline” to include the lyrics “washing
    hands.” People reacted to these directives by clearing supermarket shelves of
    soap and hand sanitizer with toilet paper, creating nationwide shortages.


    It is hard to state the magnitude and swiftness of the changes to American life
    in the first months of the pandemic. Businesses, movies, and sports arenas closed,
    neighbors and friends now harbored potentially deadly germs, and events such as
    weddings and funerals were suddenly dangerous vectors of disease. Millions started
    working from home, while millions of others lost their jobs. Within weeks, a little-known
    company called Zoom became the go-to replacement for in-person meetings, classes,
    and happy hours. Americans were wiping down their mail, packages, and groceries.
    Live television shows were suddenly broadcasting out of people’s living rooms
    instead of studios, with small children, normally in school, running through the
