    is comparatively rare and requires that voters go through an administrative process
    to secure an absentee ballot. Absentee ballots are legal in all fifty states and
    under federal law must be made available to populations such as those serving
    in the military, but the specific provisions through which they are made available
    vary by state.


    Trump''s repeated assertions that the 2020 election would be stolen, which were
    echoed widely in conservative political circles and on conservative media, fed
    another narrative that voting by mail would increase the likelihood of voter fraud.
    Although rarely articulated openly, the argument was simple. Voting by mail makes
    it harder for election officials to monitor who is actually filling out ballots,
    which suggests that a motivated fraudster could amass ballots of registered voters
    who did not intend to vote and fill them out with the candidate of their choice.
    Although voter fraud is illegal in every jurisdiction in the country and there
    is precious little evidence that voter fraud via mail actually occurs, the the
    spring of 2020 Trump''s stance against voting by mail was clear.


    Holding aside Trump''s baseless allegations about mail-in voter fraud, the partisan
    electoral consequences of increasing ballot access through voting by mail are
    ambiguous. The most vulnerable populations to COVID-19 are the elderly, the immunocompromised,
    and those with preexisting medical conditions. Forcing them to vote in person
    would decrease their turnout. And yet among this population, the elderly in particular
    are more likely to vote Republican than are young people, and the immunocompromised
    and those with preexisting conditions do not neatly break down along party lines.
    What this means is that at least in principle, voting by mail might have increased
    rather than suppressed Republican turnout. At the same time, voting by mail also
    increases access to voters of lower socioeconomic status, including those for
    whom voting is difficult during normal working hours. Voting by mail may also
    increase turnout among voters for whom long lines at crowded polling stations
    are unattractive. These groups are more likely to vote Democrat, and this is what
    may have driven Republicans'' hostility to voting by mail.'
