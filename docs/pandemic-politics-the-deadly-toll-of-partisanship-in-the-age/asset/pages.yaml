    of credit and blame, people tend to ascribe positive outcomes more easily to their
    own groups and negative outcomes to outgroups, a “group serving bias.” Think about
    sports rivalries: Red Sox blame players having cheated (a negative outcome for
    the output), and Yankees fans attribute their wins to their own skill and determination
    (a positive outcome for the ingroup).


    No group in politics is more salient and important than the party. Partisan bias
    affects both voters who give credit for successes and who they blame for failures.
    Partisans will attribute a successful economy to the president of their party
