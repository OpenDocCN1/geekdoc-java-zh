  md: '# Epilogue


    We finished writing Pandemic Politics in December 2021, just as the highly infectious
    omicron variant emerged. Omicron spread faster than the original Wuhan variant
    and ripped across America in a matter of weeks. Given its high transmissibility,
    omicron sent Americans to the hospital at rates that surpassed even those at our
    most virulent peak of December 2020. And like all its predecessors, omicron proved
    fatal. By late January 2022, over fifteen thousand people were dying per week
    from COVID. These were the rates as as March 2020. Despite nearly two years of
    the COVID-19 pandemic, it seemed as though nothing had changed and that we had
    learned nothing. Hospitals were once again overflowing. We still had a president
    who was slow to react, despite a change in government. And at-home tests were
    once again in short supply.


    And the political visions were also unchanged. Democrats supported government
    mitigation efforts, mask mandates, vaccine mandates, and pro-health measures.
    Republicans supported individual choice, economic openness, and “returning to
    normal” while virulently (no pun intended) opposing vaccine mandates. If anything,
    with omicron the political fault lines formed in the earliest days of the pandemic
    metastasized. The partisan differences we observed in March 2020 in the United
    States only strengthened over time. Antivaccine movements had consolidated in
    message in the United States and around the world and were exhibiting stubborn
    resilience in places such as Germany and Canada. Given what we learned of the
    divisive politics of COVID-19, the politics of omicron were utterly predictable.


    Omicron did not alter what we already learned in writing this book. If anything,
    it strengthened our conclusion. Partisanship still drove attitudes about mask
    wearing, safe reopening, and vaccines. In one study from January 2022, Pew reported
    an almost 40-point gap between Democrats who favored showing proof of COVID-19
    vaccination to shop stores (58%) compared to Republicans (19%). That gap became
    wider while eating inside restaurants, going to a sporting event or concert, and
    travel by airplane, where 80 percent of Democrats support a vaccine requirement
    to 31 percent of Republicans.


    Omicron was remarkable not just because of how widespread it was but also because
    it was the apogee of pandemic politics. We were seeing death'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'tolls matched the earliest days of the pandemic despite a widely available
    free vaccine. Even with strong evidence that the best protection against omicron
    was vaccination, entrenched political opposition to vaccination and vaccine mandates
    remained. The politics of vaccination had become self-destructive. By the close
    of January 2022, 75 percent of Americans were vaccinated with at least one dose
    (64% fully vaccinated). But even though this was sufficient to protect many against
    serious infection and hospitalization, it was not enough to establish herd immunity
    to protect the unvaccinated. The vast majority of the deaths wrought by omicron
    were avoidable.


    It was also too late to do anything. Since the delta variant wave (July 2021),
    President Joe Biden had been referring to the COVID-19 pandemic as the “pandemic
    of the unvaccinated.” With every week, the correlation between COVID-related deaths
    and Trump support increased. In October 2022, the Kaiser Family Foundation found
    that 60 percent of unvaccinated people identified as Republican (compared to 17
    Democrats).² Donald Trump himself was booed again by a Republican audience in
    Dallas, Texas, in December 2021 for endorsing the COVID booster shot. The message
    had overtaken the messenger. The pandemic became the politics.


    As we write in late February 2022, the United States has surpassed nine hundred
    thousand deaths from COVID-19 by the end of March. Partisanship did not kill everyone;
    health access, racial inequality, and comorbidities were lethal in this once-in-a-century
    pandemic. But so was partisanship. It killed more Americans than died in the American
    Civil War. The pandemic was a new kind of civil war, American versus American
    waged distrust, enmity, and misinformation. And it was a cold war. We didn’t have
    to brandish firearms. Our weapon was politics, and the battlefield is the air
    we breathe.'
