    suggesting that mail-in voting would lead to fraud and implying (along with a
    host of right-wing media figures) that widespread illegal voting by ineligible
    or unregistered voters would have the election to Democrats. Republican Party–led
    state governments in battleground states such as Pennsylvania, Michigan, and Georgia
    contributed to the uncertainty by passing regulations that restricted the counting
    absentee or mail-in ballots until election day or right before it. Both Republicans
    and Democrats preemptively set up legal teams in expectation of a tighter fight
    over the results. Unsurprisingly, election experts worried that a close election
    would lead to contested claims about the legitimacy of the results. As we know
    with the benefit of hindsight, such worries were all too prescient.


    In anticipation of such an outcome, in wave 5 of our survey—conducted just weeks
    before the general election itself—we implemented another survey experiment to
    probe how respondents would interpret the results of the presidential election.
    Specifically, we asked respondents “[Trump/Biden] wins the election, we will know
    American elections are rigged” and randomly assigned respondents to read either
    “Trump” or “Biden” as the victor. We present the results of two analyses in figure
    9.6, dividing respondents by their partisan affiliation (left panel) and by race
    (right panel). Note that these are prospective evaluations: respondents did not
    yet know the outcome of the election but were simply projecting forward to what
