    ## 3.2 远程单例会话 bean (Remote Singleton Session Bean)


    在前两个示例中，会话 bean 和客户端应用都是同一个企业应用的一部分。在本节中，我将展示一个作为单模块开发并独立部署到服务器的会话 bean 示例。接下来，示例将包含一个独立于上述
    bean 开发但使用该会话 bean 的通用 Web 应用。这意味着应用程序和 bean 可以托管在每个应用服务器上。


    实际的会话 bean 也应该写成 `singleton`（单例）——主要是为了演示如何实现。`单例会话 bean` 是每个应用程序服务器恰好有一个实例的会话
    bean。一个典型的应用是一个在整个生命周期内仅初始化一次数据的 bean，并且这些数据对整个应用可用。通常使用 `@PostConstruct` 注解的方法来初始化数据，在本例中，数据是硬编码的。


    按照之前示例的方法，我创建一个名为 `KingsEJB` 的企业应用，并在 `Server and Settings` 窗口中，我勾选了 `Create Web
    Module`（创建 Web 模块）：


    ![](img/3402.jpg)


    点击 `Finish` 后，NetBeans 创建企业应用，但只包含一个 EJB 模块。这次需要对 EJB 进行远程访问，并且必须定义接口。作为下一步，我创建了类库项目
    `KingsEJB`。


    现在必须编写企业 Java Bean，它必须有两个方法，都返回字符串数组。第一个方法必须返回统治该年份的丹麦国王（如果该年份是信仰变更年，可能有两个）。另一个方法原理相同，但必须有两个年份作为参数，方法必须返回在该期间内的所有国王名称。为了创建这个
    bean，我右键点击 `KingsEJB-ejb` 模块并选择 `Session Bean`。你将看到以下窗口，我在其中输入了类名 `KingsSession`
    和包名 `kingsejb.ejbs`。此外，我选择了它为 `Singleton`（单例）。最后，规定必须创建一个本地接口（Local）和一个远程接口（Remote）。勾选
    `Remote` 时，选择包含接口的类库，在本例中是 `KingsEJBRemote`。对于当前示例，不需要本地接口。


    在点击 `Finish` 之后，NetBeans 创建了所需的会话 bean 以及两个接口：


    ![](img/3417.jpg)


    接下来，应该添加两个方法。我右键点击 `KingsSession` 类的名称，选择 `Insert Code`（插入代码），并在此再次选择 `Add Business
    Method`（添加业务方法，见下方窗口）。第一个方法必须名为 `getKing`，返回字符串数组并有一个类型为 `int` 的单个参数。在底部点击了最后一个单选按钮，表示应使用两个接口。你应该注意
    NetBeans 提供了一个警告，提示该方法在两个接口中的名称相同。


    ![](img/3424.jpg)

