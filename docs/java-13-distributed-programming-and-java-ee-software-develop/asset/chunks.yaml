    # 5 Web services


    A web service is a component that can be hosted on a web server and provides services
    to clients, and web services can to some extent be perceived as an alternative
    to enterprise java beans. Web services are characterized by being easy to develop
    and are platform independent. The latter means that communication between a web
    service and clients occurs as XML and after a protocol called SOAP, and thus exclusively
    as text. Therefore, the use of web services is perceived as a secure technology,
    and the price is that encoding of messages such as XML may cost a little on performance.
    A web service and its services must be defined to clients with regard to parameters
    and return values, and it is done using an XML document called a `Web Service
    Definition Language` (WSDL) document. The biggest challenge in writing web services
    is to write this document, which is quite complex (difficult and comprehensive
    syntax), but here NetBeans helps as it generates it all, and you can actually
    write web services without knowing anything about WSDL.


