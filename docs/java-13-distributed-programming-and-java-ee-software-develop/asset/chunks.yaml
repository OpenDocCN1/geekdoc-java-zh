    ## 5.1 作为 Web 服务的 EJB


    如上所示，Web 服务无非是一个装饰了几个注解的普通 Java 类，并全部封装在 Web 应用程序中。也可以使用无会话豆（stateless session
    bean）作为 Web 服务。它允许从 Java 以外语言使用无状态 EJB，以及使用企业 Java Bean 的其他属性（如事务）。事实上，你可以通过两种方式实现：通过在
    EJB 中创建 Web 服务，或者将 EJB 嵌入为 Web 服务。


