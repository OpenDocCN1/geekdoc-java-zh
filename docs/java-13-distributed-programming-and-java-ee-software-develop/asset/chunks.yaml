    to work with any number of significant digits, but in the current implementation
    it is limited to 1000000, but in practice it far exceeds what can be used for
    something, primarily due to performance, but also because it is difficult to present
    such large numbers in the user interface.


    #### FunctionsLib


    I want to start with the *FunctionsLib* class library, which contains 6 classes:


    ![](image/Image3986.jpg)


    The first *BigException* is trivial and defines an exception type. The class *Functions*
    is the class with the algorithms, where the other four define mathematical constants:


    1.  *E* represents the constant with up to 1000000 decimals


    2.  *PI* represents the constant with up to 1000000 decimals


    3.  *Log10* represents the natural logaritm of 10 with up to 1000000 decimals


    4.  *Log10E* represents the 10-number logaritm of with up to 1000000 decimals


    These constants should be taken from somewhere, and they can be downloaded from,
    for example


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_216.jpg)


    Here you can not find the last one, but ![](image/Java_13__68.jpg) where is the
    natural logarithm. That is why ![](image/Java_13__69.jpg) and can therefore be
    determined by the third of the above constants. Below I have shown a method that
    I used to create strings for the first three constants based on the data I downloaded:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_217.jpg)


    The method is simple and its parameters indicate the name of the file containing
    the data (the file downloaded), while the other contains the result, there are
    1000 Java strings as lines of 1000 digits. The following method creates the digets
    for the number ![](image/Java_13__70.jpg):


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_2171.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_218.jpg)


    You should note that this method can not be performed before the class *Log10*
    is implemented. The parameter is the name of the file with the result, and with
    this file available, you can create the text lines to the last constant using
    the method *createConst()*.


    As an example, below is shown some of the code for the class *PI*:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_219.jpg)


    The class has only one method that returns *PI* as a *BigDecimal* with a certain
    number of decimal places. The three other classes to constants are in principle
    identical.


    Then there is the class *Functions*, where the code fills a lot and I do not want
    to display the code here. In principle, it is just about implementing the formulas
    from the design, but as mentioned, some of the formulas result in a poor performance
    when the argument is given asymptotic values. In order to achieve a reasonable
    result, it may therefore be necessary to treat special cases for certain values
    of x. Finally, most of the methods can raise an exception.


    The class has a method for each function, and as an example, I will show the code
    for the function *exp()*. According to the design, the value of the exponential
    function in an argument *x* can be determined from the formula:


    ![](image/Java_13__71.jpg)


    The formula is generally effective, as the factorial grows much faster than *x*
    elevated in a power. At least as long *x* is not too big (or goes against minus
    infinity). If that is the case, ![](image/Java_13__80.jpg) will at a time be greater
    than ![](image/Java_13__72.jpg), but it may take a long time, and therefore the
    fraction only converts slowly to 0\. To solve this problem, you can for large
    values of x use that


    ![](image/Java_13__73.jpg)


    where ![](image/Java_13__74.jpg) is the integer part of x, and ![](image/Java_13__75.jpg).
    Then is ![](image/Java_13__76.jpg). One can then take advantage of the above series
    of reasonably fast converging if ![](image/Java_13__77.jpg) and in the case where
    ![](image/Java_13__78.jpg) can be converted to an *int*, the class *BigDecimal*
    has a method that can calculate ![](image/Java_13__79.jpg). It probably limits
    the possibilities for the size of *x*, but if *x* has a size where *n* can not
    be represented by an *int*, the calculations actually do not give the meaning
    as it will result in an overflow (exponential function grows very fast). Similar
    considerations and rewrites can be made in the case where the argument is negative,
    and corresponding to these remarks, the function *exp()* can be implemented as
    follows:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_220.jpg)


    In short, the following happens. First, the value of *x* is tested. If the numerical
    is too large, an exception is raised because the calculation does not make sense.
    The following lines should take into account the above transformations of *x*
    in the case where the numerical value is greater than 1:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_2201.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_221.jpg)


    Here you should note the function *floor()*, which is another function in the
    class *Functions*. The next 13 lines implement the row development of *exp(x)*,
    which continues until one element in the row becomes negligible. The two next
    lines again must multiply the result with while the last statement rounds to the
    desired number of decimal places.


    I do not want to show the code for the other methods, but the class is defined
    as follows:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_2211.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_222.jpg)


    Initially, some constants are defined, which are often used in the implementation
    of the algorithms, while the variable *precision* indicates the number of significant
    digits. *mc* is an object of the type *MathContext*, which is used by the individual
