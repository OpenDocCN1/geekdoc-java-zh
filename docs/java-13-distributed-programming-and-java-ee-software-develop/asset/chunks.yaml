    在此练习中，你必须解决与上一个相同的练习，但区别在于国王应该从数据库加载。数据库 `padata` 有一个 `history` 表，包含了丹麦国王的信息。如果表不存在，你可以在
    Java 6 书中查看如何创建该表——书中的示例包含了创建和初始化表的脚本。解决该练习，可以按照以下步骤操作：


    1.  创建一个名为 `HistoryEJB` 的新企业应用项目，它应该只包含一个 EJB 模块。NetBeans 会创建 `HistoryEJB-ejb`
    模块。

    2.  创建一个 `Class Library` 项目，可以命名为 `HistoryEJBRemote`。此外，添加上一个练习中的 `King` 类。

    3.  在 `HistoryEJB-ejb` 中添加一个名为 `HistorySession` 的状态会话豆（stateful session bean），它应该有一个添加到
    `HistoryEJBRemote` 的远程接口。接口应与上一个练习相同（两个返回 `List<King>` 的方法）。实现必须有一个 `List<King>`
    类型的实例变量，并且必须在 `@PostConstruct` 方法中通过从数据库 `history` 表加载数据来初始化它。你可以像上一个示例一样地通过“从数据库创建实体类”来实现。

    4.  编译并部署 `HistoryEJB`。

    5.  创建一个客户端，基本上与练习 2 中的客户端相同。

    6.  测试应用程序并确保一切运行正常。


