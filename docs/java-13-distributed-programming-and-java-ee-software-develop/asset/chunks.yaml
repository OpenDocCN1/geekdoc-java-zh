    ## 3.1 有状态会话 bean (Stateful Session Bean)


    在本节中，我将展示一个 `stateful` 会话话 bean 的示例。实际上，它的开发方式与上述完全相同，但它会在各个方法调用之间保留实例变量的值。当无状态或有状态会话
    bean 托管在服务器上（部署）时，服务器会创建多个会话 bean 实例，这通常被称为 EJB 池。当客户端想要使用 EJB 实例时，Glassfish 服务器会从池中取出一个实例并交给客户端一个引用。此过程的目标显然是为了性能，因为创建一个
    EJB 实例需要较长时间。如果是有状态会话 bean，服务器会与客户端保持对话，因此会不断使用同一个实例。无状态会话 bean 则并非如此，每次方法调用都不能保证使用的是同一个实例。表面上看，使用有状态会话
    bean 有益的，但对于服务器来说维护状态是有开销的，因此只有在需要时才使用有状态会话 bean。


    当前的示例打开了以下窗口，其中索引输入了 200 并点击了 SHOW（显示）：


    ![](img/Image3394.jpg)


    斐波那契数众所周知：


