    Web 应用程序相同的功能（页面），你需要更多的操作，可以使用一个包含各个用户角色的数据库，然后在应用程序中测试哪些角色可用。在本节中，我将通过示例 `SecurityApp2`
    的副本来说明这一点，我将其命名为 `SecurityApp3`。


