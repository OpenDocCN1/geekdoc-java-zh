    to a format that Glassfish can use. This can again be done with *keytool*:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_189.jpg)


    The result is a file named *pasigned.cer*. The name is not important, but it is
    recommended that the name end with *.cer*. Glassfish has a file with the names
    of the *Certification Authorities* that it trusts (it already knows *Verisign*
    and *Thaute*), and these names are found in the file


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1891.jpg)


    In order for Glassfish to use my self-signed certificate, it must know me – and
    believe me as a *Certificate Authority* – and I can export the file *pasigned.cer*
    to Glassfish with keytool:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1892.jpg)


    Then I can use the certificate for authentication. I want to use a copy of the
    *SecurityApp1* project, which I have called *SecurityApp3*. The code should not
    be changed, but the *web.xml* and *glassfish-web.xml* configuration files should.
    Below is *web.xml* shown:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_190.jpg)


    This time, there is only one single security-constrant element, since all users
    with the role *student* must have access to the entire application and also defines
    that a secure Internet connection should be used. Additionally, you can not use
    authentication with a certificate without an SSL connection. Then there is the
    *login-config* element, which defines the use of a certificate this time.


    Which certificate to use is defined in *glassfish-web.xml*:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1901.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_191.jpg)


    Here the user role *student* must be mapped to the certificate. Here it is important
    that the *principal-name* element is written correctly. It is recommended to use
    *keytool*:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_192.jpg)


    and then copy from the *Issuer* line.


