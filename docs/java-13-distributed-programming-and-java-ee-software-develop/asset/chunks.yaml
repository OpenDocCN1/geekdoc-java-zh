    ## 3.1 A stateful session bean


    In this section I will show an example of a `stateful` session bean. In fact,
    it is developed precisely in the same way as above, but it retains the value of
    instance variables between the individual calls of methods. When a `stateless`
    or `stateful` session bean is hosted on the server (deployed), the server will
    create a number of instances of the session bean, which is commonly referred to
    as an EJB pool. When a client wants to use an instance of an EJB, the Glassfish
    server uses an instance from the pool and gives the client a reference. The goal
    of this process is of course performance, as it takes a relatively long time to
    create an instance of an EJB. Is it a stateful session bean, the server maintains
    a conversation with the client, so it constantly uses the same instance. This
    is not the case with a stateless session bean, and for every call of a method
    there is no guarantee that it is the same instance that is used. Immediately,
    it would seem beneficial to use stateful session beans, but for the server there
    is an overhead to maintain the state, and therefore should stateful session beans
    only be used if there is a need.


