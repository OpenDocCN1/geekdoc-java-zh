  trans: '

    使用企业级 Java Bean 的主要优势之一是 `EJB` 使用事务，这通常意味着方法执行的更改如果都正确执行，则将会生效；否则将执行相应的回滚，不做任何操作。如果发生异常，则属于后者情况。目前来说这没问题，但如果在事务正在进行时调用该方法，其工作原理就不那么显而易见了。该方法应该是当前事务的一部分，还是在为新的方法调用创建新事务时，必须挂起现有事务？由于这些问题，可以配置事务的工作方式。这是通过注解
    `@TransactionAttribute` 实现的：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_87.jpg)![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_88.jpg)


    其中 `TransactionAttribute` 的值表示事务的工作方式。有以下选项：


    1. `TransactionAttributeType.MANDATORY`：该方法只能作为现有事务的一部分执行。如果在事务之外调用该方法，将抛出 `TransactionRequiredException`
    异常。

    2. `TransactionAttributeType.NEVER`：如果从客户端调用该方法，则不创建事务。如果作为事务的一部分调用该方法，将抛出 `RemoteException`
    异常。

    3. `TransactionAttributeType.NOT_SUPPORTED`：如果作为现有事务的一部分调用方法，它将被挂起并在事务之外执行。如果在事务之外调用该方法，则不创建事务。

    4. `TransactionAttributeType.REQUIRED`：如果作为现有事务的一部分执行方法，该方法将作为该事务的一部分执行。如果在现有事务之外调用该方法，将创建一个新事务。

    5. `TransactionAttributeType.REQUIRES_NEW`：如果作为现有事务的一部分调用方法，它将被挂起并创建一个新事务。在方法完成后，之前的事务将恢复。如果在现有事务之外调用该方法，将创建一个新事务。

    6. `TransactionAttributeType.SUPPORTS`：如果作为现有事务的一部分执行方法，它将作为该事务的一部分执行。如果在事务之外调用该方法，则不会启动新事务。


    上面显示了如何对方法进行事务装饰，但你也可以对类进行装饰，这样装饰将关联到类的所有方法。


    ## 3.5 拦截


    在会话 Bean（session bean）中执行方法时，人们有时会对方法执行之前（被调用时）以及方法完成之后后的某个操作感兴趣。典型的原因是调试，例如，你可以向服务器的日志文件写入内容。作为一个示例，我将以下类添加到
    `AddressEJB-ejb` 项目中：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_89.jpg)


    这是一个常见的 Java 类，包含一个简单的方法，首先要注意的是，该方法用一个注解装饰了。该方法有一个 `InvocationContext` 参数，提供了更多服务。`getTarget()`
    方法返回执行方法的对象，而 `getMethod()` 返回一个代表 `interceptedObject` 对象中被执行方法的对象。最后，有一个 `proceed()`
    方法，它负责执行 `interceptedMethod()` 方法。在 `proceed()` 调用的两边都执行了 `System.out.println()`，这简单意味着在
    Glassfish 服务器的日志中写一行。结果是，如果方法执行了 `logMethodCall()`，日志文件中就会写入一行，随后执行该方法，然后再次写入日志文件。


    问题是类获取执行的方法并让它发生，这（当然）是通过注解实现的：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_90.jpg)


    也就是说，在创建地址之前向日志文件写入，并在数据库更新后再次写入。


    ## 3.6 定时器服务


    会话 Bean 有一种特殊的变实现了定时器。因此，你可以让实际的 Bean 在特定间隔执行操作，例如，你可以向日志文件写入内容。在这种情况下，我将编写一个每半秒确定下一个质数的会话
    Bean。我从一个名为 `PrimesEJB` 的 `Enterprise Application` 项目开始，包含一个 EJB Module 和 Web
    Application。对于 EJB Module，我添加了一个 EJB，但这次是一个 `Timer Session Bean`：


    ![](img/Image3473.jpg)


    你将得到下面的窗口，你应该你应该按照常理输入一个名称（这里是 `PrimesSession`）和一个包（`primesejb.ejbs`）。我还选择了它必须是
    `Singleton` 并且创建一个 `Local` 接口：


    ![](img/Image3481.jpg)


    最后，我设置了定时器跳动的时间间隔。在这种情况下，模式意味着定时器必须每半分钟跳动一次。点击 `Finish` 后，NetBeans 创建了以下类：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_92.jpg)


    以及一个定义的接口。可见，这是一个普通的会话 Bean，唯一的区别是了一个定时器方法，使用 `@Schedule` 注解定义了它是定时函数以及执行的频率。定义的接口如下：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_93.jpg)


    除了定时器外，还定义了三个方法。`PrimesSession` 类将实现：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_931.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_94.jpg)


    你应该注意到该类有三个实例变量，由于它是单例会话 Bean，在服务器 停止之前，这些变量将保留其值。也就是说，多次启动应用程序，会话 Bean 的状态将保留。该类最重要的部分当然是定时方法，它修改了
    `prime` 的值，代表下一个质数。定时方法还修改了 `index`。


    然后 EJB 模块完成了。我在 Web 应用中添加了一个命名的 Bean：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_941.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_95.jpg)


    这是一个非常简单的 Bean，没什么好注意，但你需要意识到它使用了我的会话 Bean。JSF 页面同样简单并在浏览器中打开，结果如下所示，其中链接用于更新用户界面：


    ![](img/Image3488.jpg)


    ## 3.7 单表 CRUD


    ![](img/Image3496.jpg)


    在数据库上下文中，CRUD 代表创建（Create）、读取（Read）、更新（Update）和删除（Delete）操作。在本节中，我将向你展示如何使用 EJB
    编写程序对单个数据库表执行这些操作。应用程序必须使用带有远程接口的 EJB。作为一个示例，我将使用来自 `padata` 数据库的 `zipcode` 表，应用程序应该打开如所示的窗口，其中输入的邮编
    78 已查询。按钮的含义应该是自而易见的，点击表格中的链接会将邮编插入顶部的两个字段中，可以在其中对其进行编辑。

    '
- fmt: '

    I have started creating an `EJB Module` project, which I have called `ZipcodesEJB`.
    Then I have created a usual `Class Library` project, which I have called `ZipcodesRemote`.
    For this project, I have added a class `ZipcodeRemote`, which should represent
    the objects to be transmitted between the web application and the session bean
    object (I have not shown `get` and `set` methods):


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_97.jpg)


    Then I have to the project `ZipcodesEJB` added a remote stateless session bean
    named `ZipcodesSession`, which adds a remote interfaces to the above class library:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_971.jpg)


    The biggest work is to implement the class `ZipcodesSession`. In the `zipcodes.models`
    package I have added an entity class `Zipcode` for the database table. This class
    is unchanged from the code generated by NetBeans. I would like to add a class
    for database operations, but a JPA controller class can not be directly used from
    an EJB, so I added my own (which is nothing but a modified and scaled-down version
    of the controller class created by NetBeans – see also the next example), which
    I have called `ZipcodeDAO`:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_98.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_99.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_100.jpg)


    The class is very similar to the DAO (`Data Access Object`) classes that NetBeans
    creates, but you should note how to create an `EntityManager` object and how to
    define transactions associated with `Create`, `Update` and `Delete`. Also note
    the last method, which is the search method. Here, JPQL is used instead of the
    Criteria API. It’s a matter of taste, if you do one or the other, but if you know
    SQL, it’s easiest to use JPQL.


    With these two classes in place, you can write the class `ZipcodesSession`, where
    the code is actually quite simple as all the work is delegated to the DAO class:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_101.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_102.jpg)


    Note that the methods contains conversions of objects of type `ZipcodeRemote`
    to and from objects of the entity type `Zipcode`. It is hardly necessary and the
    problem could be solved by defining the entity type in the class library (see
