    these are the types that will be used to build a SQL SELECT. Finally, note that
    the class also has a method that returns the number of rows in the database table.


    After the class has been added to the project, the *IndexController* class must
    be changed:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_29.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_30.jpg)


    Here, the most important are the first two statements, which define an *EntityManagerFactory*
    and a *UserTransaction*. In particular, note the two annotations that defines
    the two objects to be instantiated. You should also note that the two methods
    that returns all addresses and create an address now have been changed so that
    the entire logic regarding database operations has been moved to the controller
    class.


    If you look at the example, you should note that everything about SQL is gone
    and has been moved to code that is part of the JPA API. As a result, the code
    to be written is significantly reduced, and in particular, you should note that
    the *AddressJpaController* class is autogenerated by NetBeans.


    ## Exercise 1


