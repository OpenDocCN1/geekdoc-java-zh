    ## 7.3 Form authentication


    In the example above, it is the browser that has shown the login window and it
    is, in principle, excellent, but you can also write your own login form. There
    may be at least two reasons for it, including that you decide how the form should
    look, but it also allows you to implement a logout function. In the following
    example I will show how to do, but first I will change the program itself.


    In the introductory example, the project consists of three HTML pages, but in
    practice it will typically be JSF pages with backing beans, which requires a few
    changes. The *SecurityApp2* project is expanded with two new JSF pages compared
    to the previous project, and in addition, the three original pages have been changed
    to JSF pages:


    ![](image/Image3941.jpg)


    The three original pages *index.xhtml*, *enter.xhtml* and *start.xhtml* now have
    a backing bean. A managed bean with the name *LogoutBean.java* has also been added.
    The design of the first three pages has changed a bit, but in principle it works
    in the same way. The *error.xhtml* page is trivial and consists solely of a text
    and a link to *login.xhtml*, and the page is used if you enter a user that is
    not found or you have entered an illegal password. The most important thing about
    the example is the page *login.xhtm*:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_183.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_184.jpg)


    It is a JSF page, but no JSF elements are used, and in particular it is important
    that the *form* element is not a *h:form* element. Here you should note the *action*
    attribute, which refers to *j_security_check*, which specifies the code that the
    application server performs. For the same reasons, the two input fields must be
    named *j_username* and *j_password*.


    The last thing that must happen to use form authentication is the change of *web.xml*,
    where the *login-config* element is changed to the following:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1841.jpg)


    When you opens the application, you will see the window below, where you will
    enter the username and password. In this case, it is a very simple form, but you
    can of course modify *login.xhtml*, so you get a nicer design that fits the current
    application. Note that the address bar shows that a secure internet connection
    is being used.


    ![](image/Image3948.jpg)


    After entering your username and password, you will get to *index.xhtml*:


    ![](image/Image3956.jpg)


    The window looks a bit different, but it is important that there is a link to
    logout. As mentioned above, the page has a managed bean:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_185.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_186.jpg)


    The two action methods should do nothing but redirect to the two pages *start.xhtml*
    and *enter.xhtml* that happens when you click on one of the two buttons. When
    a JSF page performs an action, it happens with the POST method, and instead of
    performing a redirection, a forward is performed. Therefore, the user role is
    not validated (or it only happens when you leave a page again). To solve the problem
    (so the application works like the previous application), as described above,
    you must force a redirection.


    Clicking on the *Logout* link, is called a method *logout()* in a manged bean
    *LogoutBean.java*:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1861.jpg)


    The method determines a reference to the current session and invalidates it (all
    session objects are removed). Then the user is redirected to the login window.


