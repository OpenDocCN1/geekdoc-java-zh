    ## 6 REST Web 服务


    REST 代表 `Representational State Transfer`（表述状态转移），也称为 `RESTful` Web 服务。与其他 Web
    服务一样，它们被视为通过 URI 可用并标识的资源，其特点是易于开发并专门为前端设计。RESTful Web 服务通常非常灵活，客户端与服务之间的通信可以通过多种方式进行，但通常数据以
    XML 或 JSON 格式发送。Web 服务至少支持一种 HTTP 方法：


    1. `GET`，用于获取现有资源。

    2. `POST`，用于更新现有资源。

    3. `PUT`，用于创建新资源。

    4. `DELETE`，用于删除现有资源。


