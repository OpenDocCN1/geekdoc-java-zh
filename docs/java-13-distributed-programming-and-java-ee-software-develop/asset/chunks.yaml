    模块和一个 `Web Application`：


    ![](img/Image3331.jpg)


    当你点击 `Finish` 时，NetBeans 会创建一个 Enterprise Application，它关联了两个项目：


    ![](img/Image3339.jpg)


    其中第一个是名为 `CalcEJB-ejb` 的 `EJB Module` 项目，另一个是名为 `CalcEJB-war` 的 `Web Application`
    项目。注意，名称是 NetBeans 选择的，如果需要，当然可以更改。


    下一步，`CalcEJB-ejb` 项目应该有一个 `EJB`。要做到这一点，右键点击项目并选择 `Enterprise Javabeans`，然后选择 `Session
    Bean`：


    ![](img/Image3348.jpg)


    当你点击 `Next` 时，得到下面的窗口，你必须为你的 `EJB` 输入一个名称（这里为 `CalcSession`）以及包名（这里为 `calcejb.ejbs`）：


    ![](img/Image3359.jpg)


