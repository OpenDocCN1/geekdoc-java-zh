    ## 3.2 A remote Singleton session bean


    In the first two examples, both the session bean and the client application have
    been part of the same enterprise application. In this section I will show an example
    of a session bean developed as single module and deployed independently to the
    server. Next, the example will include a common web application that is developed
    independently of the above bean, but uses the session bean. This means that the
    application and the bean could be hosted on each application server.


    The actual session bean should also be written as a `singleton` – primarily to
    show how. A `singleton session bean` is a session bean, where there is exactly
    one instance per. application server. A typical application is a bean that must
    initialize some data exactly once, which should otherwise be available throughout
    the entire life of the application. Often, the data in question is initialized
    from a database, and you want to decorate a method with `@PostConstruct`, where
    data can be initialized. It is not currently used in the present case as data
    is hard-coded to make the current bean simple.


    In the same way as in the previous examples I start of creating an `Enterprise
    Application` project named `KingsEJB`, and when I get to the `Server and Settings`
    window, I have cleared the `Create Web Module`:


    ![](image/3402.jpg)


    When you click `Finish`, NetBeans creates an enterprise application, but only
    with an EJB module. This time there must be remote access to the EJB, and it must
    be defined with an interface. As a next step, I have therefore created a `Class
    Library` project `KingsEJB`.


    An enterprise java bean must now be written, and it must have two services, both
    returning an array of strings. The first must return the name of Danish kings
    who ruled the year (there may be two kings if the year is the year of change of
    faith) on the basis of a year. The other must work in the same way, but there
    must be two years as parameters, and the method must return the names of all kings
    that have ruled within that period. To create this bean, I have right-clicked
    the `KingsEJB-ejb` module and selected `Session Bean`. You will then get the following
    window where I have entered the name `KingsSession` as the package name `kingsejb.ejbs`.
    In addition, I have chosen it to be a `Singleton`. Finally, it has been stated
    that both a Local and a Remote Interface must be created. When checking `Remote`,
    select the class library that will contain the interface, and in this case it
    is `KingsEJBRemote`. For the current example, there is no need for a `Local` interface,
    and when I have chosen it, it is only to show that a session bean can have both
    a `Local` and a `Remote Interface`.


    ![](image/3409.jpg)


    After clicking `Finish`, NetBeans has created the desired session bean as well
    as both interfaces:


    ![](image/3417.jpg)


    Next, two methods should be added. I have right-clicked the name of the class
    `KingsSession` and selected `Insert Code` and here again selected `Add Business
    Method` (see the window below). The first method must be called `getKing`, and
    should return an array of strings and have a single parameter of the type `int`.
    At the bottom I clicked on the last radio button, which says that both interfaces
    should be used. You should note that NetBeans provides a warning that the method
    will get the same name in the two interfaces.


