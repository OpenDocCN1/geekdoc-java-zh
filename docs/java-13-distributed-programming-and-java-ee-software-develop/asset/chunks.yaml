    I will start by showing how to let the container (the Glassfish server) control
    users’ access to the individual pages. This is done solely with the configuration
    files, and without changing the application’s code, as well as by creating Glassfish
    users.


    Glassfish manages user and user rights using so-called `security realms`, which
    basically is a collection of users with associated security groups. A user can
    be linked to one or more groups, and these groups defines what actions the container
    will allow the user to perform. For example, an application may have regular users
    who can perform specific tasks and administrators who can perform all tasks.


    Glassfish has three realms from the start, but you can create your own. The three
    predefined realms are:


    1. `admin-realm`, used solely for the maintenance of users for the Glassfish administration
    web application and should not be used for users of other applications

