    类还拥有一个带有 `Author` 对象的集合 `authorCollection`，它代表了 `book` 和 `author` 之间的多对多关系。检查
    `Author` 类你会发现该类有一个对应的用于 `Book` 对象的集合 `bookCollection`，它是多对多关系的另一端。在检查类时，请注意装饰上述关系属性的注解。


    在添加实体类后，我想要通过选择 `JPA Controller Classes from Entity Classes` 来添加控制器类：


    ![](img/Image3286.jpg)


    对于所有添加到 `Selected Entity Classes` 的四个实体类都必须创建一个控制器，在点击 `Next` 并选择所需的包（这里是 `pabooks.models`）后点击
    `Finish`，这四个控制器类就会被创建：


    *   `AuthorJpaController`

    *   `BookJpaController`

    *   `CategoryJpaController`

    *   `PublisherJpaController`


    通常情况下，这些类是不被修改的，但可能需要扩展这些类以添加用于数据库查询的方法，在本例中，我通过一个新方法扩展了 `BookJpaController` 类。然而，这需要一些如何在
    JPA 中编写 SQL SELECT 语句的语法。


    ### Criteria API


    如果你看我目前为止编写数据库应用程序的方式，最全面的类型类型之一就是 SQL SELECT 语句——至少为了正确编写它们，JPA 也是如此。要编写和执行 SELECT
    语句，你必须使用 `Query` 对象，而 JPA 定义了一种类似于 SQL 的语言，称为 `JPQL`。该语言的语法与 SQL 基本上相同，在书中不会被显式对待。当很难正确编写
    SQL SELECT 语句时，是因为它仅仅是文本，因此语法无法通过编译器验证。JPQL 的问题也是一样的，为了帮助解决这个问题，定义了一个名为 `Criteria
    API` 的 API。事实上，使用此 API 编写 SELECT 语句并不更容易，但 SELECT 表达式的不同部分是使用 Java 类定义的，因此编译器可以验证表达式是否编写正确。在本书中，我将在大多数地方使用此
    `Criteria API`，以下是对其语法的简要介绍。


    该 API 用于定义条件查询，这本质上是一个对象图，你通过构建这样一个图来定义条件查询。这是通过类型为 `CriteriaBuilder` 的对象实现的，该对象可以创建构成条件查询的部分，由于它本质都是关于表示
    SELECT 语句的，这意味着对表、列以及从数据库中提取行的条件进行了面向对象的表示。例如，你可以通过如下形式的语句从 `EntityManager` 获取一个
    `CriteriaBuilder`：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_39.jpg)


    其中 `em` 是一个 `EntityManager`。这样的构建器有三个返回条件查询的方法：


    *   `CriteriaQuery<T> createQuery(Class<T>)`

    *   `CriteriaQuery<Tuple> createTupleQuery()`

    *   `CriteriaQuery<Object> createQuery()`


    区别在于查询返回什么种的对象。在拥有了创建查询的条件构建器后，任务是初始化这个查询，这正是 API 发挥用场的地方。


    我想从上述方法中的第一个开始，该方法创建一个查询，其中参数类型指示了查询结果预期的对象类型，原则上它可以是任何任意的对象类型。例如，下面显示了一个条件查询，它确定了库数据库中所有页码值为
    520 的书籍：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_391.jpg)


    注意如何创建一个 `CriteriaBuilder`（`em` 是一个 `EntityManager`）以及如何使用它来为 `Book` 对象创建条件查询。对于这个查询，为对象图创建了一个
    `root`，并定义查询对象必须从此根节点提取对象。`root` 随后对应于 SQL SELECT 语句中的 FROM 部分。接下来，通过 `select()`
    方法定义哪些属性是结果的一部分，这里是 `root`，意味着 `Book` 对象。因此，`select()` 函数指示了要包含哪些列。最后，定义了只在页码为
    520 时提取对象。

