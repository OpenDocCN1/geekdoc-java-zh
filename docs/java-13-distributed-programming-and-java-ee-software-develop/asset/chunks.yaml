    # 3 Enterprise Java Beans (企业级 Java Bean)


    Enterprise Java Beans 或 `EJB` 是运行在服务器上并封装业务逻辑的组件，在这里它们可以被 Web 应用程序和独立应用程序等程序使用。因此，你可以将
    `EJB` 认为是一个在应用程序服务器（如 `Glassfish`）上开发、测试和托管的组件，就像其他应用程序可以应用的那样。开发 `EJB` 并将其托管在应用程序服务器上并不简单，其架构也不易于审查，但
    NetBeans 提供了帮助，因为它有专门用于开发 `EJB`s 的项目。在本章中，我将部分演示如何使用 NetBeans 开发和使用 `EJB`s，并解释最重要的概念。


    使用 `EJB`s 的优势在于，除了为多个应用程序提供相同的服务外，应用程序服务器还处理各种状况如事务和安全问题，因此 `EJB` 组件可以简化企业级应用程序的开发。因此，`EJB`
    在现代应用程序（包括分布式应用程序）的开发中起着重要作用，但必须立即指出，由于 Web 服务的存在，它们不再扮演同样的角色。


    有三种变体：


    * `Stateless`（无状态）：在组件方法的多次调用之间不保留状态的组件。

    * `Stateful`（有状态）：与当前应用程序相比，在组件整个生命周期内维护状态的组件。

    * `Singleton`（单例）：相对于应用程序恰好存在一个版本的组件。


    话虽如此编写 `EJB` 模块并不容易，但问题不在于编写单独的 `EJB` 类（因为它们与编写其他类没有区别），问题出现在部署以及从客户端程序使用模块时，这更多与
    Glassfish 有关，而不是编写代码。因此，我将从简单的开始，创建一个 `Enterprise Application`（企业级应用程序）项目，它由单个
    `EJB` 模块以及使用该模块的 Web 应用程序组成。该 `EJB` 模块应由单个无状态会话 Bean（stateless session bean）组成，该
    Bean 为客户端（此处为 Web 应用程序）提供五个方法（服务）。


