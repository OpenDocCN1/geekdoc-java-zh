    # 3 Enterprise Java Beans


    Enterprise Java Beans or `EJB`s are components that live on a server and enclose
    business logic, and here they can be used by other applications such as web applications
    and standalone applications. You could thus think of an `EJB` as a component that
    is developed, tested and hosted on an application server (such as `Glassfish`),
    and as other applications may apply. It is not quite simple to develop `EJB`s
    and get them hosted on an application server, and the architecture is also not
    so easy to review, but NetBeans helps as it has projects specifically aimed for
    developing `EJB`s. In this chapter, I will partly demonstrate how to develop and
    use `EJB`s using NetBeans and explain the most important concepts.


    The advantage of using `EJB`s is that, in addition to providing the same services
    to multiple applications, the application server addresses a variety of conditions
    such as transactions and security issues, and `EJB` components can thus simplify
    the development of an enterprise application. `EJB`s therefore play an important
    role in the development of modern applications, including distributed applications,
    but it should be mentioned immediately that they are no longer playing the same
    role because of web services.


    There are three variants:


    * `Stateless`, which are components where the state is not preserved between several
    calls to the component’s methods.

    * `Stateful`, that are components where the state is maintained throughout the
    life of the component as compared to the current application.

    * `Singleton`, which is a component that exists in exactly one version relative
    to an application.


    Having said that it is not easy to write `EJB` modules, it is not so much to write
    the individual `EJB` classes, as that are no different from writing other classes,
    but the problems arise in connection with deployment and the use of the modules
    from client programs, and thus relates more to Glassfish than to writing the code.
    Therefore, I will start simple and create an `Enterprise Application` project,
    consisting of a single `EJB` module, as well as a web application that uses this
    module. The `EJB` module should consist of a single stateless session bean that
    provides five methods (services) available to clients that here are the web application.


    In the following I will describe the procedure. I start with a new project by
    selecting `Java EE and Enterprise Application`:


    ![](image/Image3324.jpg)


    After clicking `Next`, I will enter the project name in the next window where
    I have entered `CalcEJB`. After clicking `Next` again, I get the following window,
    which by default consists of a single `EJB` module and a `Web Application`:


    ![](image/Image3331.jpg)


    When you click Finish, NetBeans creates an Enterprise Application, which has attached
    two projects:


    ![](image/Image3339.jpg)


    where the first one is an `EJB Module` project named `CalcEJB-ejb`, while the
    other is a `Web Application` project called `CalcEJB-war`. Note that it is NetBeans
    who has chosen the names and they can of course be changed if desired.


    As a next step, the `CalcEJB-ejb` project should have an `EJB`. To do this, right-click
    on the project and select `Enterprise Javabeans` and then `Session Bean`:


    ![](image/Image3348.jpg)


    When you clicks `Next` you get the following window, where you must enter a name
    for your `EJB` (here `CalcSession`) and a name on a package (here `calcejb.ejbs`):


    ![](image/Image3359.jpg)


    In addition, choose a `Session Type` where `Stateless` has been selected. Finally,
    `Local` has been ticked. This means that an interface that defines the `EJB` is
    created. When here selected `Local`, it means that it is an `EJB` that can be
    used by a web applications hosted on the same application server (what will often
    be the case in practice) and, precisely, it means an application performed by
    the same JVM as the `EJB` module. After clicking `Finish`, NetBeans creates a
    class and interface:


    ![](image/Image3372.jpg)


    The interface is as follows:


    ![](image/Image3372.jpg)


    Next, methods for the `EJB` should be added. To do this, right-click on the class
    name and choose `Insert Code`, and in the follow-up menu, choose `Add Method`,
    after which you get the following window:


    ![](image/Image3379.jpg)


    , Net, adds adds method to to the the ```.. The of of the the tool is that it
    it updates the the, which which of course, can be done manually.. is the the interface
    that defines 5 methods:


    ![](image/Image3380.jpg)


    end below the finished class, which implements all of the interface’s methods:


    ![](image/Image3380.jpg)


    Now my session bean is complete, and then the client must be written. First, I
    have added a named bean `CalcBean` (to the package `calcejb.beans`). After I’ve
    added the class, I have right-clicked on the class name and selected `Insert Code`
    and here again `Call Enterprise Bean`, after which the result is:


    ![](image/Image3381.jpg)


    That is, a reference has been made to the `EJB` module, and the important thing
    here is that it is decorated with `@EJB`. This means that the relevant session
    bean can be used by the class’s methods. The finished name bean is as follows:


    ![](image/Image3382.jpg)!(image/Image3383.jpg)!(image/Image3384.jpg)


    and the code does not require further explanations. However, note how the class’s
    methods refer to the `calcSession` object, as it was any other object.


    I have then deleted the page `index.html` and created a JSF page with the same
    name (`index.xhtml` ) and I have entered the following code:


    ![](image/Image3385.jpg)


    Here’s nothing new to explain and you should notice that my named bean is used
    in the usual way.

