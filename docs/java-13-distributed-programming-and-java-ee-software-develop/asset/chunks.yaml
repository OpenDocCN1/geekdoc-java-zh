    ## 4.2 上下文 (Contexts)


    当通过注入或因为从 JSF 页面引用而需要托管豆（managed bean）时，CDI 将尝试在特定 bean 的作用域（scope）内寻找实例。如果成功，则使用该对象；否则将创建一个属于当前作用域的对象。通常，一个对象（托管
    bean）必须跨越多个页面“存在”，你不能使用 `RequestScoped`，因为它只关系当前页面。对象在每次页面请求时都会被创建。到目前为止（在这本书以及之前的两本书中），我通过将
    bean 定义为 `SessionScoped` 来解决这个问题。它行得通，但也是一种简单的解决方案，而且 `SessionScoped` bean 也有缺点。首先，这些
    bean 在整个会话期间存在，甚至在会话结束后一段时间内仍然存在。这意味着会话对象不必要地填充机器内存。然而，更大的问题是，由于 `SessionScoped`
    bean（以及所有的会话对象）的生命周期比需要的长，因此存在它们在逻辑上已不存在后仍被使用的风险。后者实际上会导致 Web 应用程序中的错误变得难以修正。


    有一个名为 `conversation`（对话）的上下文，bean 可以在多个页面上存在，但不会贯穿整个会话，它专门旨在解决会话上下文带来的挑战。代价是必须由程序员告诉容器何时何时、何时结束。我想通过
