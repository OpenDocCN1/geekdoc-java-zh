    ## 7.5 Programmer defined authentication


    In the above examples, it is the application server that has handled authentication,
    and in many cases it is also the way to do it, but the method is best to control
    the application’s authentication and thus whether a user has access to a particular
    application. On the other hand, if you want to ensure that all users do not have
    access to the same features (pages) in a web application, you need a bit more,
    and you can use a database that contains roles for the individual users and then
    in the application test which roles are available. In this section I will illustrate
    it with a copy of the example *SecurityApp2*, which I have called *SecurityApp4*.


    Basically, it is the same application with the same pages *index.xhtml*, *enter.xhtml*
    and *start.xhtml* (the last in the folder *admin*) and they have the same backing
    beans. However, another trivial page has been added named *list.xhtml* and its
    associated backing bean, to which there is a link from *index.xhtml*. The whole
    application is thus trivial so far, and the sole purpose is to show how to implement
    authentication, and in addition to how to make access to each page depending on
    what it is for a user that is logged in.


    Initially, I have created a database called *authentication* and with a single
    table *user*:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_193.jpg)


    The table has only two columns, where the first represents the name of a user
    and is the primary key, while the second column indicates user roles according
    to the same syntax as in Glassfish. As examples, 4 users are added to the table.


    In the project, I have deleted *LogoutBean* and instead added another named bean
    with the name *AuthenticationCtrl*, but before I look at it, I will show an EJB
    that contains the most important to login. It is still the application server
    that needs to authenticate and thus check the user’s username and password. Note
    that the above database table does not contain the user’s password, and it is
    thus the server who is responsible for storing the password encrypted.


    To write the EJB I have created an EJB Module project named *AuthenticationEJB*.
    Then here I created a class library project named *AuthenticationRemote* and added
    an entity class for the above table. This class has not been changed in relation
    to what NetBeans has generated and the content is not new and will not appear
    here. For *AuthenticationEJB*, I’ve added a reference to the above class library
    and added a stateless session bean named *AuthenticationBean* with a remote interface
    located in the class library. The interface is as follows:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_194.jpg)


    which defines two properties, one being the user’s password (*AuthenticationBean*
    must use it to perform authentication using Glassfish), and an object of the type
    *User*, which is the entity type from the class library. Finally, there is the
    method *login()*, which is the method of authentication. Below is the class *AuthenticationBean*:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_195.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_196.jpg)'
