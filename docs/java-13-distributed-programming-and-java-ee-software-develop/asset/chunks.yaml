- fmt: '

    One of the major advantages of using enterprise java beans is that an `EJB` uses
    transactions, which generally means that the changes a method are performed, if
    all are executed correctly, otherwise nothing is done corresponding to a rollback.
    The latter is the case if there is an exception. Immediately, it’s fine, but it’s
    not obvious how it works if a method is called while a transaction is in progress.
    Should the method be part of the current transaction, must the existing transaction
    be suspended while creating a new transaction for the new method call? Due to
    such questions, it is possible to configure how transactions should work. This
    happens with an annotation `@TransactionAttribute`:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_87.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_88.jpg)


    where the value with `TransactionAttribute` indicates how the transactions will
    work. There are the following options:


    1. `TransactionAttributeType.MANDATORY`: The method can only be performed as part
    of an existing transaction. If the method is called outside of a transaction,
    a `TransactionRequiredException` exception is raised.

    2. `TransactionAttributeType.NEVER`: If the method is called from a client, no
    transaction is created. If the method is called as part of a transaction, a `RemoteException`
    exception is raised.

    3. `TransactionAttributeType.NOT_SUPPORTED`: If the method is called as part of
    an existing transaction, it is suspended and the method is performed outside of
    the transaction. If the method is called outside of a transaction, no transaction
    is created.

    4. `TransactionAttributeType.REQUIRED`: If the method is performed as part of
    an existing transaction, the method will be executed as part of this transaction.
    If the method is called outside of an existing transaction, a new transaction
    will be created.

    5. `TransactionAttributeType.REQUIRES_NEW`: If the method is called as part of
    an existing transaction, it will be suspended and a new transaction will be created.
    After the method is completed, the previous transaction will be resumed. If the
    method is called outside of an existing transaction, a new transaction is created.

    6. `TransactionAttributeType.SUPPORTS`: If the method is performed as part of
    an existing transaction, it is performed as part of this transaction. If the method
    is called outside of a transaction, no new transaction is initiated.


    Above is shown how to decorate a method for transactions, but you can also decorate
    the class and the decoration will then relate to all class’s methods.


    ## 3.5 Interception


    When performing a method in a session bean, one may sometimes be interested in
    an action before the method is executed (when called) and immediately after the
    method has been completed. The typical reason is debugging, for example, you can
    write to the server’s log file. As an example, I have added the following class
    to the `AddressEJB-ejb` project:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_89.jpg)


    It’s quite common Java class with a simple method and the first thing to notice
    is that the method is decorated with an annotation. The method has an `InvocationContext`
    parameter that provides more services. The method `getTarget()` returns the object
    that has performed the method, while `getMethod()` returns an object representing
    the method in the `interceptedObject` object that has been performed. Finally,
    there is the method `proceed()` which performs the method `interceptedMethod()`.
    On both sides of the call to `proceed()`, a `System.out.println()` is executed,
    which simply means writing a line in the Glassfish server’s log. The result is
    that if a method performs `logMethodCall()`, a line is written in the log file,
    after which the method is executed and the log file is written again.


    The question is then how to get the method executed and it happens (of course)
    with an annotation:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_90.jpg)


    That is, writing in the log file before creating an address and again after the
    database is updated.


    ## 3.6 A timer service


    There is a special variant of a session bean that implements a timer. You can
    therefore have the actual bean to perform an operation at certain intervals, for
    example, you can write in the log file. In this case, I will write a session bean
    that determines the next prime every half second. I start with an `Enterprise
    Application` project named `PrimesEJB` with an EJB Module and a Web Application.
    For the EJB Module, I have added an EJB, but this time it’s a `Timer Session Bean`:


    ![](image/Image3473.jpg)


    You will then get the following window, where you should as usual must enter a
    name (here `PrimesSession`) and a package (`primesejb.ejbs`). I have also selected
    that it must be a `Singleton` and that a `Local` interface should be created:


    ![](image/Image3481.jpg)


    Finally, I have set the time interval for when the timer has to tick. In this
    case, the pattern means that the timer must tick every half-minute. After clicking
    `Finish`, NetBeans creates the following class:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_92.jpg)


    as well as a defining interface. As can be seen, it is a usual session bean with
    the only difference that a timer method has been created, with a `@Schedule` annotation
    defining that it is timer function and how often it should tick. The finished
    interface is:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_93.jpg)


    where in addition to the timer, three methods are defined. The class `PrimesSession`
    will implement the interface:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_931.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_94.jpg)


    You should note that the class has three instance variables, and since it is a
    singleton session bean, these variables will retain their values from the class
    `PrimesSession` is initialized for the first time until the Glassfish server is
    stopped. That is, starting the application multiple times, the state of the session
    bean will be preserved. The most important thing about the class is, of course,
    the timer method, which modifies the value of `prime` as it represents the next
    prime. The timer method also modifies the `index`.


    Then the EJB module is complete. I have added a named bean to the web application:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_941.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_95.jpg)


    It’s a very simple bean and there’s not much to notice, but you need to be aware
    that it uses my session bean. The JSF page is similarly simple and opens it in
    the browser, the result is as shown below, where the link is used to update the
    user interface:


    ![](image/Image3488.jpg)


    ## 3.7 CRUD with one table


    ![](image/Image3496.jpg)


    In database contexts, CRUD stands for *Create, Read, Update* and *Delete* operations,
    and in this section I will show you how to write a program that performs these
    operations on a single database table using an EJB. The application must use an
    EJB with a remote interface. As an example, I will use the table `zipcode` from
    the database `padata`, and the application should open a window as shown above,
    where 78 entered for zip code has been searched. The meaning of the buttons should
    be self explanatory and clicking on a link in the table will insert the zip code
    into the top two fields where they can be edited. In the following, I will explain
    how the program is written and thus the process.

    '
