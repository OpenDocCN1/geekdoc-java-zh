    Instead of making authentication using a username and password, you can use a
    certificate that you can purchase from a `Certificate Authority` (`Verisign` or
    `Thawte`) as mentioned above. This certificate must be installed by both Glassfish
    and the browser. For testing and development purposes, it is possible to create
    a self-signed certificate. This is done with a tool called `keytool`, which comes
    with `jdk`. On my machine, the `keytool` is placed in


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_187.jpg)


    but it depends, of course, on where Java is installed and what version. First,
    I’ll create a `keystore` with a key pair, which can be done with the following
    command, where the user through a simple dialog must enter values that can identify
    the user and his company (these are, among other things, those values that a Certificate
    Authority verifies):


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1871.jpg)


    For most information, it is not important (for a self-signed certificate) what
    you write, but for the arguments of the command, the name of your keystore must
    end with `.p12` and the `storepass` and the `keypass` should be the same. After
    the command has been completed, a keystore named `client_keystore.p12` has been
    created under your current directory. Your keystore must be imported into the
    browser, what you do (in Firefox), by choose `Settings` and `Advanced`, and here
    you must choose `Certificates` and again `Show Certificates`:


    ![](image/Image3963.jpg)


    In the following window you will get a list of the certificates that are installed
    in your browser and clicking on the `Import` button, you can browse to your keystore
    (the file `client_keystore.p12` ) and install it.


    The certificate must be exported to Glassfish, and first it must be converted
    to a format that Glassfish can use. This can again be done with `keytool`:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_189.jpg)


    The result is a file named `pasigned.cer`. The name is not important, but it is
    recommended that the name end with `.cer`. Glassfish has a file with the names
    of the `Certification Authorities` that it trusts (it already knows `Verisign`
    and `Thaute`), and these names are found in the file


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1891.jpg)


    In order for Glassfish to use my self-signed certificate, it must know me – and
    believe me as a `Certificate Authority` – and I can export the file `pasigned.cer`
    to Glassfish with `keytool`:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1892.jpg)


    Then I can use the certificate for authentication. I want to use a copy of the
    `SecurityApp1` project, which I have called `SecurityApp3`. The code should not
