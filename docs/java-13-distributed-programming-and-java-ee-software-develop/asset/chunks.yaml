    ## 7.2 容器管理的身份验证与授权


    我将首先演示如何让容器（Glassfish 服务器）控制用户对页面的访问。这完全通过配置文件完成，无需更改应用程序代码，并通过创建 Glassfish 用户来实现。


    Glassfish 使用所谓的“安全域”（security realms）来管理用户和权限，这基本上是一个关联了组的用户集合。用户可以关联到一个或多个组，这些组定义了容器允许用户执行的操作。例如，一个应用程序可能有执行特定任务的普通用户和执行所有任务的管理员。


    Glassfish 有时就有三个域，但你可以创建自己的。三个预定义的域是：


    1. `admin-realm`，专门用于 Glassfish 管理 Web 应用的用户，不应用于其他应用程序的用户。

    2. `certificate`，用于通过客户端进行用户身份验证。

    3. `file`，存储通用用户信息 image/3877.jpg


    点击 `file` 域将获得该域的属性，点击 `Manage Users` 按钮将获得用户概览。我创建了三个，将在后续应用：image/3884.jpg


    现在我将使用这些用户对上述应用程序的页面进行身份验证，当：


    1. 属于 `student` 组的用户仅能访问 `index.html`。

    2. 属于 `staf` 组的用户访问 `index.xhtml` 和 `enter.html`。

    3. 属于 `admin` 组的用户访问所有三个页面。


    我添加了以下 web.xml：


    '
- fmt: '

    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_175.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_176.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_177.jpg)


    User rights are defined as `security-constraint` elements, and in this case there
    are three. A `security-constraint` element defines which pages it concerns and
    what role the user should have. The first happens with an `url-pattern` element,
    while the other happens with a `role-name` element. Looking at the first `security-constraint`
    it applies to all pages where the name starts with `admin`, and thus all pages
    in the `admin` folder. Only users whose role is `admin` can access these pages.
    The next `security-constraint` element applies to all pages, but here it is a
    requirement that the user should have the role `staf`. Finally, there is the last
    `security-constraint` that applies to a concrete page (start page) and for users
    whose role is `student`.


    The last element is called `login-config` and is used to define how authentication
    should take place. There are basically three options:


    1. `BASIC`, where it is left to the browser to make authentication

    2. `FORM` where it is left for the program to perform authentication

    3. `CLIENT-CERT`, which requires a certificate


    Looking at the above role names, they refer only to the current application, but
    not to the specific user groups. There must therefore be a mapping of these names,
    which takes place in `glassfish web.xml`:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1771.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_178.jpg)


    In this case, the names are the same, but the meaning is of course that they do
    not have to be. The server will typically have relatively few groups, while the
    applications define roles independently of which user groups the server has defined.


    If you open the above in Firefox, it will display the following window:


    ![](image/Image3892.jpg)


    and what you can do with the program depends on which user you log in with.


    In this example, `BASIC` authentication is used, which means that the username
    and password are sent Base64 encoded to the server. It does not provide password
    protection. The same goes for `FORM` authentication, where the username and password
    are sent in clear text. Should you solve this problem and you should ensure that
    all data is sent encrypted between the client and server, then the solution is
    to use the HTTPS for secure internet protocol, and simply expand `web.xml`:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1781.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_179.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_180.jpg)


    Generally, a secure Internet connection requires a certificate that you purchase
    from a `Certificate Authority` (CA) such as `Verisign` or `Thawte`. Such a certificate
    costs something (about $500) and needs a renewal every year. It may be a bit unfortunate
    for development purposes and therefore Glassfish comes with a self-certificate
    and is pre-configured to support HTTPS at port 8181. Such a self-certificate can
    be made by everyone and is therefore not sure. If, after the above change of `web.xml`,
    you open the application, you get the following window (Firefox):


    ![](image/Image3899.jpg)


    If you click Advanced, you get the following option (which is a warning):


    ![](image/Image3907.jpg)


    If you click on the button, you’ll get another warning:


    ![](image/Image3916.jpg)


    and clicking on the last button means that you have accepted the unsecured certificate
    and the usual login window appears. If you close the browser and reopen the program,
    you will not get the above warnings, and the login window will open immediately.


    You should note that if you opens the program in the usual way by entering the
    address


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_181.jpg)


    it is the login window as shown below. That is, the address is automatically redirected
    to the HTTPS protocol and port 8181:


    ![](image/Rettelser_1.jpg)


