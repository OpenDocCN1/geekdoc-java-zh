    # 8 A final example


    As the final example, I will write a program that is a typical calculator, and
    thus a program that can simulate a mathematical calculator. Compared to previous
    examples (the book Java 3), there must be two important differences:


    1. The program must now be a web application.

    2. The machine (the calculator) must now support calculations with a random number
    of decimal places.


    Apart from that, the program should basically have the same functions as a typical
    (and relatively simple) mathematical calculator, where it is important that the
    program should support very large numbers.


    The aim of the program is to use some of the topics that have been addressed in
    this book, and especially Enterprise Java Beans. In addition, it is an example
    where there is focus on algorithms.


