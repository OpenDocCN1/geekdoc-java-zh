    ## Problem 2


    You must solve the same task as in problem 1, but with the difference that the
    program should be written in the same way as shown in the previous example, where
    the database operations are moved to an EJB, which maintains the database using
    JPA. You must thus write three projects:


    1.  *WorldRemote*, which is a remote interface


    2.  *WorldEJB*, which is a EJB Module projct


    3.  *WorldClient*, which is a web applicationen


    # 4 CDI


    CDI stands for *Context and Dependency Injection* and describes how the application
    server creates and remove objects, and especially what you can and should write
    in the code. For example, if you consider a JSF page with a backing bean, which
    is just a common Java class, then you do not need to do anything to create an
    object of the class and how long the object lives is determined by its scope with
    an annotation.


    A JavaBean is just a class that is written from a specific and simple pattern,
    and the programmer creates an object (a bean) using the *new* operator. After
    that, it is the garbage collector who is responsible for removing the object when
    there are no longer any references to it. In contrast, a managed bean is a bean,
    where it is the container in the form of the application server, which is responsible
    for creating an object and removing the object again when the program goes out
    of the the object’s scope. Such a bean is also called a CDI object. You can not
    create a managed bean with *new*. CDI objects are instead created using a technique
    called *injection*, which means that it is the container that takes care of it.
    When defining a bean with *injection*, the container will examine whether the
    bean is created and if not, it will instantiate a new object and perform injection
    on all beans to which the current bean depends and finally, a method decorated
    with *@PostConstruct* is performed. Then you can use the object’s methods. When
    the bean has to be removed, the container will first perform a method decorated
    with *@PreDestroy*, after which it is the container that remove the object. It
    can be illustrated by the following figure:


    ![](image/Image3575.jpg)


    CDI objects have a scope that is called *context*, and it can basically be


    *   request


    *   session


    *   application


    *   conversation


    As an example, below is shown a simple managed bean:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_117.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_118.jpg)


    That it’s a managed bean you can see from *@Named*, where you can see that NetBeans
    has assigned the name for the class written with lower case. An annotation is
    generally an interface, and in this case it is an interface with a single attribute
    *value* (whose default value is blank, meaning that the container selects the
    class name *person*). In addition, you can see that an object’s context is *session*,
    and *SessionScoped* is again an interface. The two interfaces *Named* and *SessionScoped*
    are thus information to the container, which tells how the container should maintain
    objects of the class *Person*.


    With the above named bean available you can write the following JSF page:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1181.jpg)


    The interesting thing is to open the page, the Glassfish server will inject a
    *Person* object with context *session*, without the programmer being – or can
    – doing something to create the object.


    In the previous examples I have often had to use a named bean from another named
    bean, which has been done by means of statements of the form


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_119.jpg)


    There’s nothing wrong with it, but it’s hard to write and impossible to remember.
    One can, however, facilitate the syntax by the use of CDI. Consider the following
    named bean, which represents a student with a name and a *subject* :


