    # Poul Klausen


    ## Java 13: 分布式编程与 Java EE


    软件开发


    Java 13: 分布式编程与 Java EE：软件开发


    第一版


    © 2018 Poul Klausen & [bookboon.com](http://bookboon.com)


    ISBN 978-87-403-2098-5


    由 Ove Thomsen, EA Dania 进行同行评审


    # 前言


    本书是软件开发系列书籍中的第十三本。编程语言是 `Java`，该语言及其语法和语义显然占据了大量内容，但这些书籍很大程度上也关注过程以及如何开发良好且健壮的应用程序。本书是
    `Java 11`内容的延续，但侧重于企业级应用的开发。这些程序使用托管在不同计算机并位于不同位置的组件或服务执行工作，并通过网络进行通信和协调工作。主要主题是
    `Java EE` 技术，如 `JPA`、`EJB` 和 Web Services。本书要求具备 Web 应用程序编程的知识，这与 `Java 11` 和
    `Java 12` 书中处理的内容类似。


    正如标题所示，这一系列书籍涉及软件开发，目标是教读者如何用 `Java` 开发应用程序。可以通过阅读相关主题的内容和学习完整的示例程序来学习，但最重要的是亲力实践，并从零开始编写自己的程序。因此，书籍的一个重要部分是练习和问题，读者需要在其中编写与书中处理内容相应的程序。该系列中的所有书籍都围绕同一个骨架构建，将由文本、示例、练习和问题组成，并且这些内容被放置在文中自然所在的位置。练习与问题的区别在于，练习很大程度上是针对文中阐述内容的重复，并且对需要做什么的描述相对准确。相比之下，问题的描述较为松散，规模通常也稍大一些，而且很少有明确的最佳解决方案。这些书籍是要从头到尾阅读的，但大量的代码示例（包括练习和问题）起着核心作用，读者详细地预测并研究许多示例代码，并解决练习和问题，或者只是研究推荐的解决方案是非常重要的。


    所有书籍都以一或两个较大的示例程序结束，这些程序主要关注于过程以及对程序是如何编写的解释。另一方面，代码仅在有限范围内出现——如果有的话——读者应该在测试程序时可能学习完成的程序代码。此外，除了展示比其他呈现示例更大的程序开发外，结论示例的目标还为了展示不同应用领域的程序示例。


    大多数书籍还以一个附录结束，处理一个书中未涉及的主题。它可能是关于软件安装的问题或计算机技术中的其他主题，这些主题不关于软件开发，但拥有介绍性知识是必要的。如果读者已经熟悉该主题，可以跳过当前附录。


    如前所述，编程语言是 `Java`，此外这些书籍还使用了以下产品：


    1. `NetBeans` 作为应用程序开发的 IDE

    2. `MySQL` 用于需要数据库服务器的场景（从 `Java 6` 书开始）

    3. `GlassFish` 作为 Web 服务器和应用服务器（从 `Java 11` 书开始）


    这些产品是免费且可免费安装的，甚至提到了某些产品的安装过程可以完全自动进行，而无需付出巨大的努力和挑战。此外，在网上有针对这三个产品的详细安装说明。这些产品适用于
    Windows 和 Linux，因此无论你使用 Linux 还是 Windows 都没有特殊影响。


    所有示例程序都是在运行 Linux 的机器上开发和测试的。事实上，这并没有起什么主要作用，因为无论平台是其中哪一个，`Java` 和其他产品的工作方式都是完全相同的。书中某些地方你会看到平台是
    Linux，这主要适用于涉及文件系统的命令。在其他情况下，对于读者来说，程序在 Linux 机器上开发并没有意义，它们也可以立即在 Windows 下运行，除非程序引用了文件系统，此时可能需要更改文件名。


    最后简要介绍一下这些书籍不是什么。它们不是“如何编写”的指南，或者说不是 `Java` 的参考手册，而是正如标题所言，是关于软件开发的书籍。我希望读者在阅读书籍并通过许多示例时，可以找到如何编写良好程序的灵感，也可以将其作为解决方案集，提供许多你作为软件开发者经常面对的具体日常编程问题的解决方案示例。


    # 1 引言


    在之前的两本书中，我一直开发 Web 应用程序，本书是其自然的延续，但侧重于分布式程序的开发。这些程序使用托管在不同计算机上的组件或服务执行工作，并通过网络进行通信和协调工作。核心思想是，这些组件很大程度上有自己的生命，彼此独立存在，并且通常不知道使用它们所提供的服务的客户端。事实上，要精确定义我们所理解的分布式程序并不容易，但通常我们将其理解为具有以下特征的程序：


    1. 有多个独立的计算单元（计算机），每个单元都有自己的本地内存

    2. 计算单元通过在网络上传递消息相互通信


    分布式程序（或系统）的目标可能是解决某个特定任务，用户会将这一系列计算单元感知为单一设备（或系统），但相反，它们可能是一个面向服务的系统，提供一系列用户可以使用并感知为共享资源的服务。分布式程序还具有并行性特征，即在多台计算机和多处位置上同时执行多个活动。


    你有时也可以将分布式编程看作面向对象编程的进一步发展。一个面向对象的程序由对象组成，每个对象的内部数据和逻辑对外部世界隐藏，仅通过对象以公共方法形式提供的服务已知。这些对象随后协同工作以解决要解决的任务。同样，你可以将分布式程序看作通过提供位于世界各地、独立运行的服务来解决任务的程序，如果允许，应用程序可以使用它们。


    除了展示如何在实践中开发分布式程序（或者更多与此相关的）之外，目标也是描述更具体的技术，如下所示：


    * `Java Persistence API`

    * `Java Enterprise Beans`

    * `Contexts and Dependency Injection`

    * `Java Web Services`

    * `RESTful web services`

    * `Java EE security`


    似乎，本书描述了许多 Java API，很大一部分内容与 `NetBeans` 和 `GlassFish` 直接相关。


    # 2 Java persistence API


    '
- fmt: "\nIn the previous books (from Java 6 onwards) and including Java 11 on web\
    \ applications, I have considered several examples that uses databases. It has\
    \ always included programming an object oriented encapsulation of the database\
    \ in the form of model classes for each of the database tables and one or more\
    \ classes that encapsulates the SQL statements that will manipulate the content\
    \ of the relational database. This has meant that for each example, many lines\
    \ have been required to write the Java code, and although it may be affordable,\
    \ as it is in principle the same thing that should happen every time, it can be\
    \ done easier (and better), as Java EE offers an API called `Java Persistence\
    \ API`, which has the exact task of offering an object-oriented interface to a\
    \ relational database. The aim of this chapter is to give an introduction to this\
    \ API, and the content largely characterizes “how to do”.\n\nI will start with\
    \ a copy of the project `ChangeAddress3` from the book Java 11, where I have called\
    \ the copy `ChangeAddress1`. If you open the application in the browser, you get\
    \ the following window, where you can to enter an address, and if you click on\
    \ the bottom link, you get another window that shows an overview of the addresses\
    \ that were entered.\n\n![](image/Image3104.jpg)\n\nWhen entering addresses, they\
    \ are stored in a list of `Person` objects. However, data is not stored persistently.\
    \ As I have shown in previous examples, it is relatively simple to create a database\
    \ with a table, and then save data in this table. In this example, I will show\
    \ you how to do it using JPA.\n\nIn this example, I want to use `JavaDB` as database\
    \ product. Primarily to show this database, since it is useful and easy to use\
    \ in many contexts where you need a simple database. It is a standard SQL database\
    \ server, supported by the Glassfish server, which does not require any special\
    \ installation, and the product is also supported by NetBeans.\n\nThe method is\
    \ basically defining an entity class for each database table, and I would like\
    \ to start by associating a class to the `model` package. It must be an `Entity\
    \ Class`:\n\n![](image/Image3111.jpg)\n\nand it should be called `Address`:\n\n\
    ![](image/Image3120.jpg)\n\nYou should note that the correct package name has\
    \ been selected (can be entered if it is not in the list) and that the `Create\
    \ Persistence Unit` has been ticked. A persistence unit is an XML configuration\
    \ file called `persistence.xml`, created by NetBeans. When you click `Next` in\
    \ the window above, you get a window to initialize this XML file. You can change\
    \ the name if you wish, and note that `Use Java Transaction APIs` have been ticked.\
    \ By default, `Create` has been selected, which means that the database must be\
    \ created if it is not already.\n\n![](image/Image3128.jpg)\n\nHowever, the most\
    \ important is the `Data Source` field, which is a reference to the current database.\
    \ Here you can choose an existing data source, or you can create a new one:\n\n\
    ![](image/Image3135.jpg)\n\nIf you click on `New Data Source`, you get a window\
    \ to create a data source:\n\n![](image/Image3143.jpg)\n\nwhere I have entered\
    \ the name `addresses`. A connection to the database must also be defined. Here\
    \ you can either choose an existing one or create a new one. In this case, you\
    \ must create a new one, and choose a driver where I have selected `Java DB (Network)`:\n\
    \n![](image/Image3152.jpg)\n\nWhen clicking `Next`, enter information about the\
    \ database:\n\n![](image/Image3159.jpg)\n\nThe database server – the Glassfish\
    \ server – runs on localhost and uses 1527 as port number. I have chosen that\
    \ the database should be called `addresses`. Java DB has a default user called\
    \ `APP`, and I have entered a password (1234). Then I click `Next` twice and finally\
    \ `Finish`, after which the data source has been created:\n\n![](image/Image3167.jpg)\n\
    \nWhen I click `OK`, the Entity class is created:\n\n![](image/Image3175.jpg)\n\
    \nand then I click `Finish`, NetBeans has created the following class (where I\
    \ have removed comments and modified `equals()` a bit):\n\n```\n![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_15.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_16.jpg)\n\
    ```\n\nThe result is a class with a single property `ID` of the type `Long`. You\
    \ should note that this property is decorated with two annotations, first indicating\
    \ that it is a primary key, while the other tells that the value should be assigned\
    \ by the database server as an auto number. Finally, you should note that the\
    \ class is also decorated with an annotation that tells that it is an entity class.\
    \ The class must then be expanded with the following properties:\n\n```\n![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_161.jpg)\n\
    ```\n\nwith associated get and set methods. Then I have deleted the model class\
    \ `Person`, and in `IndexController`, all references to `Person` must be changed\
    \ to `Address`, and the code in the `add()` method should be deleted. After that,\
    \ the program can be opened in the browser again.\n\nIn `IndexController`, you\
    \ must add some additional statements:\n\n```\n![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_17.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_18.jpg)\n\
    ```\n\nat below. The exact meaning of this notation is explained in chapter 4,\
    \ but as example, `em` has the type `EntityManager` that represents a database.\
    \ The last variable `utx` defines a transaction. These objects are used in the\
    \ methods `getPersons()` and `add()`. For example, `persist()` writes the object\
    \ `person` to the database. Before the application can be used, the database must\
    \ be created. It happens under `Services` by right-click `Java DB`:\n\n## 2.1\
    \ An improved address program\n\nIn this section, I want to show another version\
    \ of the above program that has been changed in two areas:\n\n1. The database\
