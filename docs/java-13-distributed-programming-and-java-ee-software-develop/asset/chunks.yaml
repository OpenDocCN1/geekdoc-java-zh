    该项目创建一个控制台应用程序，用于测试上述库。有两点需要测试：即函数是否返回了正确的值，以及性能。为此，项目包含许多测试类，作为一个示例，我将展示 `LogTest`
    类，它测试了 `log()` 和 `exp()` 函数——我在这里只展示了部分代码：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_2221.jpg)![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_223.jpg)![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_224.jpg)


    首先，注意该类继承了 `Test` 类。这是一个简单的类，其作用仅创建一个 `Functions` 对象并定义了一个可以读取机器时钟的方法。`LogTest`
    类有三个测试方法，所有方法都从构造函数调用。第一个方法测试函数 `log()` 和 `exp()` 函数是否返回正确的值，最后测试了这两个函数的组合，其结果应该与应用于函数的值相同。另外两个测试方法分别用于测试对数函数和指数函数的性能。在这种情况下，创建了具有
    1000 位的数字，函数 `test2()` 确定小数点前有 100 位随机数的对数。此操作执行了 100 次。同样，`test3()` 对小数点前有 3
    位随机数执行指数函数，该操作也执行了 100 次。在我的机器上运行，第一个测试耗时约 13 秒，而第二个测试仅耗了 2 秒。指数函数的结果是正常的，但对数的实现是薄弱环节，寻找该函数的更好实现可能是一个合适的任务。`atan()`
    也是如此，你也可以尝试寻找更好的算法。


    程序还有其他测试类来测试其他函数，这些类在原理上与 `LogTest` 工作方式相同。


    ### FunctionsRemote 项目


    该项目再次是一个类库，为 EJB 编写了一个远程接口。该库只有一个接口，定义了两个方法：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_225.jpg)


    ### FunctionsEJB 项目


    该项目是一个 EJB 模块项目，包含一个 EJB，即无状态会话 bean。项目由三个文件组成，中间的是 bean 类，另外两个是处理表达式的类：


    ![](img/Image3993.jpg)


    你应该注意，该项目应该引用 `FunctionsLib` 项目中的 jar 文件。


    在分析和设计方面，项目已扩展以支持额外的 9 个函数：


    * `random()`，一个随机生成器，返回 0 到 1 之间的随机数。该方法被重写带有一个参数，即小数点前的位数。

    * `sinh()`、`asinh()`、`cosh()`、`acosh()`、`tanh()`、`atanh()`、`coth()` 和 `acoth()`，即这
    8 个双曲函数。


    `Tokens` 类（一个包含许多类的文件）和 `Expression` 类可以从书籍《Java 3》中的 `Calc` 项目中复制。它们需要进行一些修改，例如，所有
    `double` 类型的变量、参数和返回值必须改为 `BigDecimal`。此外，必须为新函数定义新的 token 类，并应该删除 `VarToken`
    类。在 `Expression` 类中，变化非常细微，鼓励你调查一下发生了什么。然后是实现上述远程接口的 `FunctionSession` 类：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_226.jpg)![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_227.jpg)


    该类非常简单，因为所有工作都在上述两个类中——当然，还有 `FunctionsLib` 中的 `Functions` 类。然后，EJB 模块就准备就绪，可以部署到
    Glassfish 服务器上。


    ### BigCalc


    最后是 Web 应用程序。用户界面基本上与分析期间显示的相同，且只有一个扩展，因为通过 `STO` 按钮存储的值出现在页面下方的表格中。程序需要计算的表达式在底部字段中输入，而顶部显示计算结果。要将值存储在变量中（`STO`），你必须在
    `STO` 之后的字段中输入名称。名称必须以字母开头，后面最多跟 4 个字符（字母和数字）。不区分大小写，且名称不能是保留字（函数名）。存储的值是结果字段的值。如果你输入现有变量的名称并点击
    `RCL`，该值就会出现在结果字段中。例如，如果我想将 2 的平方根保存到变量 `X2` 中，我必须输入公式


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_228.jpg)


    并点击 `Calculate`，之后值会被添加到结果字段。要保存该值，你必须在 `STO` 之后输入名称 `X2` 并点击 `STO`。如果你现在想在公式中使用该变量，如下所示输入变量：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_2281.jpg)


    当我选择这种语法，由于变量值可能非常长且直接插入公式中，很容易导致无法阅读的表达式。


