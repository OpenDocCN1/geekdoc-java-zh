    ## 4.2 Contexts


    When a managed bean is needed either by injection or because it is referenced
    from a JSF page, CDI will try to find an instance in the scope of the particular
    bean. If successful, this object is used, but otherwise an object belonging to
    the current scope will be created. Often, one object (a managed bean) must “live”
    across multiple pages, and you can not use `RequestScoped` as it relates only
    to the current page. The object is created each time a page request is made. So
    far (both in this book and the two previous books) I have solved this problem
    by defining the beans as `SessionScoped`. It works, but is also the easy solution,
    and there is also a disadvantage to `SessionScoped` beans. Firstly, these beans
    live throughout the session and even for a period after the session is completed.
    This means that session objects fill unnecessarily in the machine’s memory. An
    even bigger problem, however, is that since `SessionScoped` beans (and, for that
    matter, all session objects) live longer than is needed for them, there is a risk
    that they will be used after the logically no longer exist. The latter is actually
    something that can make it very difficult to correct errors in a web application.


    There is a context called `conversation`, and where a bean can live over several
    pages, but not through an entire session, and which precisely aims to solve the
    challenges that the session context poses. The price is that it is the programmer
    who has to tell the container when a conversation starts and when it ends. I want
    to show how with the `ChangeAddress` example, where the difference should be that
    the form for entering the address is divided into three pages – without any reason,
    in addition to showing how `ConversationScoped` works. I start with a project
