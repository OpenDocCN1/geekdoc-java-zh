  raw: 'In the previous books (from Java 6 onwards) and including Java 11 on web applications,
    I have considered several examples that uses databases. It has always included
    programming an object oriented encapsulation of the database in the form of model
    classes for each of the database tables and one or more classes that encapsulates
    the SQL statements that will manipulate the content of the relational database.
    This has meant that for each example, many lines have been required to write the
    Java code, and although it may be affordable, as it is in principle the same thing
    that should happen every time, it can be done easier (and better) , as Java EE
    offers an API called *Java Persistence API*, which has the exact task of offering
    an object-oriented interface to a relational database. The aim of this chapter
    is to give an introduction to this API, and the content largely characterizes
    “how to do”.


    I will start with a copy of the project *ChangeAddress3* from the book Java 11,
    where I have called the copy *ChangeAddress1*. If you open the application in
    the browser, you get the following window, where you can to enter an address,
    and if you click on the bottom link, you get another window that shows an overview
    of the addresses that were entered.


    ![](image/Image3104.jpg)


    When entering addresses, they are stored in a list of *Person* objects. However,
    data is not stored persistently. As I have shown in previous examples, it is relatively
    simple to create a database with a table, and then save data in this table. In
    this example, I will show you how to do it using JPA.


    In this example, I want to use *JavaDB* as database product. Primarily to show
    this database, since it is useful and easy to use in many contexts where you need
    a simple database. It is a standard SQL database server, supported by the Glassfish
    server, which does not require any special installation, and the product is also
    supported by NetBeans.


    The method is basically defining an entity class for each database table, and
    I would like to start by associating a class to the *model* package. It must be
    an *Entity Class*:


    ![](image/Image3111.jpg)


    and it should be called *Address*:


    ![](image/Image3120.jpg)


    You should note that the correct package name has been selected (can be entered
    if it is not in the list) and that the *Create Persistence Unit* has been ticked.
    A persistence unit is an XML configuration file called *persistence.xml*, created
    by NetBeans. When you click *Next* in the window above, you get a window to initialize
    this XML file. You can change the name if you wish, and note that *Use Java Transaction
    APIs* have been ticked. By default, *Create* has been selected, which means that
    the database must be created if it is not already.


    ![](image/Image3128.jpg)


    However, the most important is the *Data Source* field, which is a reference to
    the current database. Here you can choose an existing data source, or you can
    create a new one:


    ![](image/Image3135.jpg)


    If you click on *New Data Source*, you get a window to create a data source:


    ![](image/Image3143.jpg)


    where I have entered the name *addresses*. A connection to the database must also
    be defined. Here you can either choose an existing one or create a new one. In
    this case, you must create a new one, and choose a driver where I have selected
    *Java DB (Network)*:


    ![](image/Image3152.jpg)


    When clicking Next, enter information about the database:


    ![](image/Image3159.jpg)


    The database server – the Glassfish server – runs on localhost and uses 1527 as
    port number. I have chosen that the database should be called *addresses*. Java
    DB has a default user called *APP*, and I have entered a password (1234). Then
    I click *Next* twice and finally *Finish*, after which the data source has been
    created:


    ![](image/Image3167.jpg)


    When I click *OK*, the Entity class is created:


    ![](image/Image3175.jpg)


    and then I click *Finish*, NetBeans has created the following class (where I have
    removed comments and modified *equals()* a bit):


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_15.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_16.jpg)


    The result is a class with a single property *ID* of the type *Long*. You should
    note that this property is decorated with two annotations, first indicating that
    it is a primary key, while the other tells that the value should be assigned by
    the database server as an auto number. Finally, you should note that the class
    is also decorated with an annotation that tells that it is an entity class. The
    class must then be expanded with the following properties:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_161.jpg)


    with associated get and set methods. Then I have deleted the model class *Person*,
    and in *IndexController*, all references to *Person* must be changed to *Address*,
    and the code in the *add()* method should be deleted. After that, the program
    can be opened in the browser again.


    In *IndexController*, you must add some additional statements:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_17.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_18.jpg)


    At the start of the class, three objects are defined each decorated with an annotation.
    The exact meaning of this notation is explained in chapter 4, but as example,
    the variable *em* has the type *EntityManager* and the preceding annotation means
    that, on the basis of the *Persistence Unit* for the project, JPA instantiates
    an object to the type *EntityManager* that is a JPA type, which represents a database
    table and offers services that can perform database operations. The last variable
    *utx* defines a transaction for a database operation. These objects are used in
    the methods *getPersons()* and *add()*. For example, if you look at the last one,
    it starts a transaction and then the method *persist()* writes the object *person*
    to the database. Before the application can be used, the database must be created.
    It happens under *Services* by right-click *Java DB*:


    ![](image/Image3182.jpg)


    and here you choose *Create Database*. With these changes, the program works the
    same as in the book Java 11, but now the addresses are stored in a database table.


    ## 2.1 An improved address program


    In this section, I want to show another version of the above program that has
    been changed in two areas:


    1.  The database is this time an existing MySQL database.


    2.  The database operations have been moved to a database controller.


    Before I get the task done, I have to create the database:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_19.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_20.jpg)


    and the result is a database with the same content as in the previous example.


    The starting point is a copy of the above program, called *ChangeAddress2*. First,
    I have deleted the following files:


    1.  The model class *Address*


    2.  The configuration file *glassfish-resources.xml*


    3.  The configuration file *persistence.xml*


    Then I have created the model class again (and with the same name), but this time
    as an *Entity Class from Database* (see below). When I click *Next*, I get the
    window below, where I have selected a *Data Source*. This happens in the same
    way as in the previous example, but this time, for database connection, a *MySQL
    driver* must be selected to specify the database (*addresses*), database user
    and password.


    Once done, the data source’s (as I have called *addresses*) tables are shown under
    *Available Tables*, and it should then be added to *Selected Tables*. Then click
    *Next* twice and accept all settings and finally click *Finish*. Then, the class
    *Address* is created again.


    ![](image/Image3192.jpg)![](image/Image3199.jpg)'
