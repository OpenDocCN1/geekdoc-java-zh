    用户权限定义为 `security-constraint` 元素，在这种情况下有三个。`security-constraint` 元素定义了它涉及的页面以及用户应该拥有的角色。第一个通过
    `url-pattern` 元素发生，而另一个通过 `role-name` 元素发生。观察第一个 `security-constraint`，它适用于所有名称以
    `admin` 开头的页面，因此适用于 `admin` 文件夹中的所有页面。只有角色为 `admin` 的用户才能访问这些页面。下一个 `security-constraint`
    元素适用于所有页面，但在这里要求用户必须拥有 `staf` 角色。最后是最后一个 `security-constraint`，它适用于特定的页面（起始页）以及角色为
    `student` 的用户。


    最后一个元素称为 `login-config`，用于定义如何进行身份验证。基本上有三种选项：


    1. `BASIC`：由浏览器进行身份验证。

    2. `FORM`：由程序执行身份验证。

    3. `CLIENT-CERT`：需要证书。


    观察上面的角色名称，它们仅指于当前应用程序，而不指于特定的用户组。因此，必须对这些名称进行映射，这种映射在 `glassfish web.xml` 中进行：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1771.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_178.jpg)


    在这种情况下，名称是相同的，但其含义显然不需要相同。服务器通常只有相对少的组，而应用程序则独立于服务器定义的任何用户组来定义角色。


    如果你在 Firefox 中打开上述内容，它将显示以下窗口：


    ![](img/Image3892.jpg)


    以及你可以用程序执行的操作取决于你用哪个用户登录。


    在这个示例中，使用了 `BASIC` 身份验证，这意味着用户名和密码是以 Base64 编码发送到服务器的。它没有提供密码保护。`FORM` 身份验证也是如此，用户名和密码以明文发送。如果你解决了这个问题，并确保所有数据在客户端和服务器之间以加密方式发送，那么解决方案是使用
    HTTPS（安全互联网协议），并简单地扩展 `web.xml`：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1781.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_179.jpg)[](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_180.jpg)


    通常，安全的 Internet 连接需要从 `Certificate Authority`（CA，如 `Verisign` 或 `Thawte`）购买证书。这种证书需要花费费用（大约
    500 美元）并且每年都需要更新。对于开发目的来说这可能有点不幸，因此 Glassfish 自带了一个自签名证书，并预配置为支持端口 8181 上的 HTTPS。这种自签名证书任何人都可以制作，因此不可靠。如果你在对上述
