    `List<String> reserved()`


    该方法返回 EJB 支持的所有函数名（保留字）。


    `evaluate()` 方法是一个极其复杂的方法，因为它的参数是以字符串形式输入的数学表达式，因此该方法必须同时对表达式进行扫描、解析和求值。然而，这与我之前在《Java
    3》书的最后一个示例中查看过的任务相同。因此，可以使用相同的算法/解决方案，因为主要的区别在于 Java 3 中的数据类型是 `double`，而在本例中是
    `BigDecimal`。


    然后该任务的解决方案将包含以下 NetBean 项目：


    1. `FunctionsLib`，这是一个类库项目，实现了各种数学函数。

    2. `FunctionsRemote`，这是一个类库项目，是 EJB 的远程接口。

    3. `FunctionsEJB`，这是一个 EJB 模块，包含一个单无状态会话豆。

    4. `BigCalc`，这是一个 Web 应用程序。


    此外，还有一个普通的 Java 项目 `BigFunctionsTest`，用于测试 `FunctionsLib`。


    ## 8.3 编程


    以下是关于编程如何实现、做了哪些重要决策以及与上述内容变化的描述。


    实数用 `BigDecimal` 表示，它提供了基础算术运算，当使用机器时，必须设置为处理特定数量的有效数字。任务说明规定机器应该能够处理任意数量的有效数字，但在当前的实现中，它被限制为
    1000000，但在实践中这远超过了实际需求，主要是由于性能考虑，同时也因为在用户界面中难以呈现如此巨大的数字。


    ### FunctionsLib


