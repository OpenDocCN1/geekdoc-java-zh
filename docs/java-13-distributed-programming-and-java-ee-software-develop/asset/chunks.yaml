    This project creates a console application and is used to test the above library.
    There are two things to be tested, namely, if the functions returns the correct
    values, and the performance. To this end, the project has a number of test classes,
    and as an example, I will show the class `LogTest`, which tests the functions
    `log()` and `exp()` – where I have only shown parts of the code:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_2221.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_223.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_224.jpg)


    First, note that the class inherits a class `Test`. It’s a simple class that does
    nothing but create a `Functions` object and defines a method that can read the
    machine clock. The class `LogTest` has three test methods, all of which are called
    from the constructor. The first method tests whether the functions `log()` and
    `exp()` returns the correct value, and finally the composition of the two functions
    is tested, where the result should be the same value as the functions are applied
    to. The other two test methods are used to test the performance of the logarithm
    function and exponential function, respectively. In this case, numbers with 1000
    digits are created and the function `test2()` determines the logarithm of a random
    number with 100 digits in front of the decimal point. This operation is performed
    100 times. Similarly, `test3()` performs the exponential function on a random
    number with 3 digits in front of the decimal point, and this operation is also
    performed 100 times. Done on my machine, the first test has taken approximate
    13 seconds while the second test has taken just 2 seconds. The result for the
    exponential function is fine, but the implementation of the logarithm is the weak
    link, and it may be a proper task to seek a better implementation of this function.
    The same goes for `atan()`, where you can also try to find a better algorithm.


    The program has other test classes for testing the other functions, and the classes
    work in principle in the same way as `LogTest`.


    ### The project FunctionsRemote


    This project is again a class library that defines a remote interface for the
    EJB to write. The library has only a single interface, which defines two methods:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_225.jpg)


    ### The project FunctionsEJB


    This project is an EJB module project and has a single EJB, which is a stateless
    session bean. The project consists of three files, with the middle being the bean
    class, while the other two are the classes for the treatment of an expression:


    ![](image/Image3993.jpg)


    You should note that the project should have a reference to the jar file from
    the `FunctionsLib` project.


    In relation to the analysis and the design, the project has been expanded to support
    an additional 9 functions:


    * `random()`, which is a random generator that returns a random number between
    0 and 1\. The method is overwritten with a parameter, that is the number of digits
    in front of the decimal point.

    * `sinh()`, `asinh()`, `cosh()`, `acosh()`, `tanh()`, `atanh()`, `coth()` and
    `acoth()`, which are the 8 hyperbolic functons.


    The classes `Tokens` (which is a file with many classes) and `Expression` can
    be copied from the `Calc` project in the book Java 3\. They need to be changed
    a bit, and, for example, all variables, parameters and return values of the type
    `double` must be changed to `BigDecimal`. In addition, new token classes must
    be defined for the new functions, and the `VarToken` class should be deleted.
    In the `Expression` class, there are only modest changes, and you are encouraged
    to investigate what has been changed. Then there is the `FunctionSession` class
    that implements the above remote interface:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_226.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_227.jpg)


    The class is trivial as all the work is in the above two – and of course, the
    `Functions` class in `FunctionsLib`. Then the EJB module is ready and can be deployed
    to the Glassfish server.


    ### BigCalc


    Finally, there is the web application. The user interface is essentially the same
    as shown during the analysis, and there is only one extension, since the values
    stored with the `STO` button appear in a table below the page. The expression
    that the program has to calculate is entered in the lower field, while the top
    shows the result of the calculation. To save values in variables (`STO`), you
    must enter a name in the field after `STO`. The name must start with a letter,
    followed by up to 4 characters, which are letters and numbers. There is no separation
    between upper and lowercase letters and the name must not be a reserved word (name
    of a function). The value stored is the value of the result field. If you enter
    the name of an existing variable and click `RCL`, the value appears in the result
    field. For example, if I want to save the square root of 2 in a variable `X2`,
    I have to enter the formula


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_228.jpg)


    and click `Calculate`, after which the value is added to the result field. To
    save the value, you must enter the name `X2` after `STO` and click `STO`. If you
    now want to apply the variable in a formula, enter the variable as follows:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_2281.jpg)


    When I have chosen this syntax, due to the fact that values of variables can be
    very long, and inserted directly into a formula, it can easily lead to an expression
    that is impossible to read.


    The application has only one page, which is quite simple, but it has a backing
    bean that uses my session bean. There is not much new, and I do not want to show
    the code here, but when you study the code, note that it is this bean that substitutes
    the value of variables before the expression is sent to my session bean.

