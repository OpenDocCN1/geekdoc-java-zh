  trans: '

    在之前的书籍（从 Java 6 开始）以及包含 Java 11 的 Web 应用程序中，我考虑过几个使用数据库的示例。这一直包括为每个数据库表编写模型类（model
    classes）以对数据库进行面向对象的封装，并编写一个或多个类来封装操作关系型数据库内容的 SQL 语句。这意味着对于每个示例，都需要编写许多 Java
    代码。虽然这在开销上是可以接受的（因为从原理上讲每次发生的情况都是样的），但可以通过更简单（更好）的方法来实现，因为 Java EE 提供了一个名为 `Java
    Persistence API`（Java 持久化 API）的 API，它的任务正是为关系型数据库提供面向对象的接口。本章的目的是介绍这一 API，内容大部分侧重于介绍“如何做”。


    我将从《Java 11》书中的项目 `ChangeAddress3` 开始，我将该副本命名为 `ChangeAddress1`。如果你在浏览器中打开该应用程序，你会看到下面的窗口，可以在其中输入地址；点击底部的链接，你会得到另一个窗口，显示已输入地址的概述。


    ![](img/Image3104.jpg)


    在输入地址时，它们被存储在 `Person` 对象的列表中。然而，数据并没有持久化地存储。正如我在之前的示例中所展示的，创建一个带有表的数据库并在该表中保存数据是相对简单的。在这个示例中，我将向你展示如何使用
    JPA 来实现这一点。


    在这个示例中，我想使用 `JavaDB` 作为数据库产品。主要是为了展示这个数据库，因为它在许多需要简单数据库的语境下非常有用且易于使用。它是一个标准的 SQL
    数据库服务器，由 Glassfish 服务器支持，不需要任何特殊安装，NetBeans 也支持该产品。


    这种方法基本上是为每个数据库表定义一个实体类（entity class），我想先将一个类与 `model` 包关联。它必须是一个 `Entity Class`（实体类）：


    ![](img/Image3111.jpg)


    并且它应该命名为 `Address`：


    ![](img/Image3120.jpg)


    你应该注意，已经选择了正确的包名（如果不在列表中，可以手动输入），并且勾选了 `Create Persistence Unit`（创建持久化单元）。持久单元是一个名为
    `persistence.xml` 的 XML 配置文件，由 NetBeans 创建。当你点击上方窗口中的 `Next` 时，会得到一个初始化此 XML 文件的窗口。如果你愿意，可以更改名称，并注意已勾选了
    `Use Java Transaction APIs`（使用 Java 事务 API）。默认选择了 `Create`（创建），这意味着如果数据库尚未创建则必须创建。


    ![](img/Image3128.jpg)


    然而，最重要的是 `Data Source`（数据源）字段，它是指向当前数据库的引用。在这里你可以选择现有的数据源，也可以创建一个新的：


    ![](img/Image3135.jpg)


    如果你点击 `New Data Source`（新建数据源），你会得到一个创建数据源的窗口：


    ![](img/Image3143.jpg)


    我在其中输入了名称 `addresses`。还必须定义到数据库的连接。在这里你可以选择现有的或创建一个新的。在这种情况下，你必须创建一个新的，并选择一个驱动程序，我选择了
    `Java DB (Network)`：


    ![](img/Image3152.jpg)


    点击 `Next` 后，输入有关数据库的信息：


    ![](img/Image3159.jpg)


    数据库服务器——Glassfish 服务器——运行在 localhost 上并使用 1527 作为端口号。我选择数据库名称为 `addresses`。Java
    DB 有一个默认名为 `APP` 的用户，我输入了密码（1234）。然后点击两次 `Next`，最后点击 `Finish`，之后数据源就创建了：


    ![](img/Image3167.jpg)


    当我点击 `OK` 时，实体类被创建：


    ![](img/Image3175.jpg)


    然后我点击 `Finish`，NetBeans 创建了以下类（我删除了注释并稍微修改了 `equals()` 方法）：


    ```

    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_15.jpg)![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_16.jpg)

    ```


    结果是一个具有类型为 `Long` 的单个属性 `ID` 的类。你应该注意，该属性被两个注解装饰，第一个指示它是主键，另一个告诉该值应由数据库服务器作为自动编号进行分配。最后，你应该注意该类还装饰了一个注解，说明它是一个实体类。该类随后必须扩展以下属性：


    ```

    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_161.jpg)

    ```


    并带有相关的 get 和 set 方法。然后我删除了模型类 `Person`，在 `IndexController` 中，所有对 `Person` 的引用必须改为
    `Address`，并且应该删除 `add()` 方法中的代码。之后，可以再次在浏览器中打开程序。


    在 `IndexController` 中，你必须添加一些语句：


    ```

    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_17.jpg)![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18.jpg)

    ```


    所示。这种表示法的精确含义将在第 4 章中解释，例如，`em` 的类型为 `EntityManager`，代表数据库。最后一个变量 `utx` 定义了一个事务。这些对象用于
    `getPersons()` 和 `add()` 方法。例如，`persist()` 将 `person` 对象写入数据库。在可以使用应用程序之前，必须创建数据库。它发生在
    `Services` 下，右键点击 `Java DB`：


    ## 2.1 改进的地址程序


    在本节中，我想展示上述程序的另一个版本，它在两个方面发生了变化：


    1. 数据库这次是一个现有的 MySQL 数据库。

    2. 数据库操作移动到了控制器中。


    在完成任务之前，我必须创建数据库：


    ```

    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_19.jpg)![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_20.jpg)

    ```


    结果与之前的示例内容相同。


    起点是上述程序的副本，命名为 `ChangeAddress2`。首先，我删除了以下文件：


    1. 模型类 `Address`

    2. 配置文件 `glassfish-resources.xml`

    3. 配置文件 `persistence.xml`


    然后我重新创建了模型类（使用相同的名称），但这次作为 `Entity Class from Database`（从数据库创建实体类）（所示）。当我点击 `Next`
    时，你会看到下面的窗口，我在其中选择了一个 `Data Source`。这里的操作方式与之前的示例相同，但这次对于数据库连接，必须选择 `MySQL driver`
    以指定数据库 (`addresses`)、数据库用户和密码。


    完成后，数据源（我将其命名为 `addresses`）的表显示在 `Available Tables` 下，然后应将其添加到 `Selected Tables`。然后点击两次
    `Next` 并接受所有设置，最后点击 `Finish`。然后，`Address` 类被再次创建。


    ```

    ![](img/Image3192.jpg)![](img/Image3199.jpg)

    ```

    '
- fmt: '

    There is a small problem, however, because the class’s `Address` property for
    email address is called `mail` instead of `email`, and therefore a few names must
    be changed in `IndexController`. Then the program can run again and the only difference
    is that the application now uses the MySQL database.


    You should examine the class `Address`, where many annotations have been added
    (all properties are decorated), but you can easily understand the meaning. You
    must note that all annotations are determined by NetBeans by retrieving information
    from the database. Also try to examine the glassfish resource `resources.xml`
    configuration file.


    I will make a single change. With an `EntityManager` object and a `UserTransaction`
    object, you can perform database operations without the need to write very much
    and without knowing SQL. Since it’s the same thing that’s going to happen every
    time, you can encapsulate these operations into a class that can be used no matter
    what database table it is. This happens by adding a database controller (here
    to `changeaddress.models`), which is a class of the type `JPA Controller Classes
    from Entity`:


    ![](image/Image3206.jpg)


    When you click Next, you must select the entity class for which the object should
    be controller for:


    ![](image/Image3214.jpg)


    In this case, there is only one option, and when added to `Selected Entity Classes`,
    you can create the controller class. The class is called `AddressJpaController`
    and it encapsulates what is necessary to maintain the database table as well as
    methods so that you can read the row with a particular primary key as well as
    a few methods to retrieve multiple rows. The code is shown below:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_24.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_25.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_26.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_27.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_28.jpg)


    The code fills, but the class is easy enough to understand and the most important
    thing is that everything about updates to the database is encapsulated in methods,
    including the necessary logic for rollback. In addition, the class defines some
    simple `find()` methods that can return an object with a specific `id` or list
    of objects that typically will be all objects. These `find()` methods uses a private
    `find()` method, and here you should note the `CriteriaQuery` and `Query` types
    as explained below, but based on the names (and the application) you can see that
    these are the types that will be used to build a SQL SELECT. Finally, note that
    the class also has a method that returns the number of rows in the database table.


    After the class has been added to the project, the `IndexController` class must
    be changed:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_29.jpg)![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_30.jpg)


    Here, the most important are the first two statements, which define an `EntityManagerFactory`
    and a `UserTransaction`. In particular, note the two annotations that defines
    the two objects to be instantiated. You should also note that the two methods
    that returns all addresses and create an address now have been changed so that
    the entire logic regarding database operations has been moved to the controller
    class.


    If you look at the example, you should note that everything about SQL is gone
    and has been moved to code that is part of the JPA API. As a result, the code
    to be written is significantly reduced, and in particular, you should note that
    the `AddressJpaController` class is autogenerated by NetBeans.


    ## Exercise 1


    In this exercise you must write a web application that opens and displays the
    content of the table `zipcode` in the database `padata` when the application has
    to use JPA. Start with a new web application project, which you can call `ZipcodePage`.
    You must then add an entity class as an `Entity Classes from Datebase`. You must
    define a `Data Source` for database `padata` and after you have done so, you should
    be able to view all tables in the database. Here you have to choose the table
    `zipcode`. When you get to the next window (see below), you must select a package
    and remove some checkmarks, but not the last checkmark. After you run the wizard,
    you’ve created an entity class named `Zipcode`, and when you examine the code,
    you should note that fewer named queries have been created this time. The reason
    is that the following window is not checked for `Generate Named Query Annotations
    for Persistent Fields`. Note that a `Named Query` is an example of a SELECT statement
    written as a variant of SQL called `JPQL`.


    ![](image/Image3221.jpg)![](image/Image3229.jpg)


    As a next step, you need to add a database controller, named `ZipcodeJpaController`,
    for your entity class like in the previous example.


    You must create a named bean for `index.xhtml` when the result must be the above
    window, which shows a table with the zip codes. The bottom entry fields should
    act as a filter:


    1. the content of the first field must match all zip codes starting with

    2. the content of the second field must match all city


    The `Clear` link should clear the two fields, while the `Update` link should update
    the table corresponding to the content. Loading the database table should only
    take place, when the program starts. You can do that in your bean to write a method
    `init()` and decorate it as shown below:


    ![](image/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_33.jpg)


    ## 2.2 Related tables


    Writing a web application like the above is because of JPA quite simple, but of
    course it is also a simple application because the database has one single table.
    In this section I will show an example where the database has more tables and
    where there are relationships between the individual tables, and here the benefits
    of JPA become even pronounced.


    As an example, I will use the Database Library from the book Java 7:


    ![](image/Image3236.jpg)


    I will only use the four entities `book`, `publisher`, `category` and `author`.
    Here you should note that there is a many-to-one relationship between `publisher`
    and `book` as well as `category` and `book`. In addition, there is a many-many
    relationship between `book` and `author`. The example is a web application called
    `PaBooks`, and it should generally be able to maintain the tables corresponding
    to the above four entities. It should be noted that the user interface is simple
    – simply to keep focus on database transactions and JPA. In the following, as
    in the first two examples of this chapter, I will primarily focus on how the program
    is made, and especially how to use a JPA to develop a database application.


    The start is a web application called `PaBooks`, and after the application has
    been created, I have selected `Entity Classes from Database`, and here I created
    a data source `booklibrary` that creates a connection to the `library` database
    and after doing that, you get an overview of the database tables:


    ![](image/Image3244.jpg)


    Here are the tables


    *   author

    *   book

    *   category

    *   publisher

    *   written


    added to `Selected Tables`:


    ![](image/Image3253.jpg)


    Note especially that the table `written` appears as bold, and it is because it
    is a relationship table between `book` and `author`. When you click `Next`, you
    get the following window:


    ![](image/Image3264.jpg)

