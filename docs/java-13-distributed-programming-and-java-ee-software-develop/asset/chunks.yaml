    # 4 CDI


    CDI 代表 `Context and Dependency Injection`（上下文和依赖注入），它描述了应用服务器如何创建和移除对象，特别是你在代码中可以以及应该写什么。例如，如果你考虑一个带有支持豆（backing
    bean）的 JSF 页面，它只是一个普通的 Java 类，你不需要执行任何操作来创建该类的对象，对象的生命周期由其注解定义的范围（scope）决定。


    JavaBean 只是按照特定且简单的模式编写的类，程序员使用 `new` 运算符创建对象（豆）。之后，当不再有该对象的引用时，由垃圾回收器负责移除该对象。相比之下，托管豆（managed
    bean）是一种豆，它由应用服务器形式的容器负责创建对象，并在程序超出对象作用范围时再次移除该对象。这种豆也称为 CDI 对象。你不能通过 `new` 创建托管豆。相反，CDI
    对象是使用一种名为“注入”（`injection`）的技术创建的，这意味着由容器来处理。当使用 `injection` 定义豆时，容器将检查该豆是否已创建，如果没有，它将实例化一个新的新对象，并对所有当前豆依赖的豆进行注入，最后执行被
    `@PostConstruct` 装饰的方法。然后你就可以使用对象的方法了。当豆必须被移除时，容器将先执行被 `@PreDestroy` 装饰的方法，然后由容器移除该对象。可以通过下面的图来说：


    ![](img/Image3575.jpg)


    CDI 对象有一个称为 `context`（上下文）的范围，它基本上可以是：


    * request（请求）

    * session（会话）

    * application（应用）

    * conversation（会话）


    例如，下面展示了一个简单的托管豆：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_117.jpg)![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_118.jpg)


    通过 `@Named` 可以看出它是一个托管豆，在其中你可以看到 NetBeans 为小写字母写的类分配了名称。注解通常是一个接口，在一种情况下，它是一个带有单个属性
    `value` 的接口（其默认值为空，意味着容器选择类名 `person`）。此外，你可以看到对象的上下文是 `session`，而 `SessionScoped`
    再次是一个接口。因此，`Named` 和 `SessionScoped` 这两个接口是容器的信息，告诉容器应该如何维护 `Person` 类的对象。


    有了上述命名豆后，你可以编写以下 JSF 页面：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_1181.jpg)


    有趣的是，打开页面时，Glassfish 服务器会注入一个上下文为 `session` 的 `Person` 对象，而程序员无需（也无法）执行任何操作来创建该对象。


    在之前的示例中，我经常需要从另一个豆使用命名豆，这是通过语句实现的：


    ![](img/Java_13_–_Distributed_programming_and_Java_EE_21-2-18_119.jpg)


