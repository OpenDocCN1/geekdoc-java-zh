  \n### 步骤 2：在 `Work with` 字段中粘贴 `http://download.eclipse.org/releases/mars`\n\n仅在你使用\
  \ Eclipse mars 版本时才使用上述链接，否则请根据你的 Eclipse 版本提供链接。例如，Eclipse Kepler 用户会在 Work with\
  \ 字段中输入此链接：`http://download.eclipse.org/releases/kepler`\n\n向下滚动直到看到“Web, XML, Java\
  \ EE and OSGI Enterprise Development”，然后展开它并添加：\n\n*   JST Server\n\n\n\n\n## 第\
  \ 4 ：调用 `service()` 方法\n\n每当 Web 服务器接收到对 `servlet` 的请求时，都会创建一个新线程来调用 `service()`\
  \ 方法。如果 servlet 是 `GenericServlet`，则请求由 `service()` 方法本身处理；如果 servlet 是 `HttpServlet`，则\
  \ `service()` 方法将接收请求并根据请求类型将其分发到正确的处理器方法。\n\n例如，如果是一个 Get 请求，`service()` 方法将通过调用带有请求参数的\
  \ `doGet()` 方法将请求分发到 `doGet()` 方法。同样，`Post`、`Head`、`Put` 等请求也会由 servlet 的 `service()`\
  \ 方法分发到相应的处理器 `doPost()`、`doHead()`、`doPut()` 等。\n\n#![](img/image00451.jpeg)\n\n\
  注意：与仅调用一次的 `init()` 和 `destroy()` 不同，`service()` 方法在 servlet 的生命周期内可以被多次调用。只要 servlet\
  \ 不被销毁，每个客户端请求都会调用 `service()` 方法。\n\n在生命周期中的所有 5 个步骤中，这是唯一一个执行多次的步骤。\n\n## 第 5\
  \ ：调用 `destroy()` 方法\n\n当 servlet 容器关闭（这通常发生在我们停止 Web 服务器时），它会卸载所有 servlet 并对每个初始化的\
  \ servlet 调用 `destroy()` 方法。\n\n注意：\n\n从此处返回：\n\nServlet 接口\n\n# Servlet 的工作\n\n\
  在我开始解释 servlet 如何工作之前，让我们先熟悉这三个术语。\n\n-   **Web 服务器 (Web Server)**：它可以处理由客户端发送的\
  \ HTTP 请求，并用 HTTP 响应响应请求。\n-   **Web 应用 (webapp)**：在本指南中我将其称为 `webapp`。基本上，项目就是你的\
  \ Web 应用，它是 servlet 的集合。\n-   **Web 容器 (Web Container)**：也称为 Servlet 容器和 Servlet\
  \ 引擎。它是 Web 服务器的一部分，与 Servlet 交互。它是管理 servlet 生命周期的 Web 服务器主要组件。\n\n# 你会发现本指南的某些已经在\
  \ servlet 生命周期指南中涵盖了，但本指南侧重于 servlet 应用（webapp）的工作原理，而不是生命周期的步骤。我强烈建议你阅读这里，以深入了解\
  \ servlet 实际上是如何工作的。\n\n## Servlet 如何工作？\n\n1) 当 Web 服务器（例如 Apache Tomcat）启动时，servlet\
  \ 容器会部署并加载所有 servlet。在此步骤中，servlet 容器会创建 `ServletContext` 对象。`ServletContext` 是一个接口，定义了\
  \ servlet 用于与 servlet 容器通信的一组方法。\n\n注意：每个 webapp 只有一个 `ServletContext`，所有 servlet\
  \ 共享它。`ServletContext` 有几个实用的方法，如 `addListener()`、`addFilter()` 等。目前我不会解释它们，因为我将在关于\
  \ `ServletContext` 的单独正文中介绍它们。\n\n2) 一旦 servlet 加载，servlet 容器就会创建 servlet 类的实例。对于每个实例化的\
  \ servlet，都会调用其 `init()` 方法。\n\n3) 客户端（用户浏览器）向特定端口的 Web 服务器发送 HTTP 请求。每当 Web 服务器接收到请求时，servlet\
  \ 容器就会创建 `HttpServletRequest` 和 HttpServletResponse` 对象。`HttpServletRequest` 对象提供了访问请求信息，`HttpServletResponse`\
  \ 对象允许我们在向客户端发送之前格式化并更改 http 响应。\n\nservlet 容器为每个客户端请求创建一个新线程并调用 `service()` 方法。`service()`\
  \ 方法根据请求类型将请求分发到正确的处理器方法。\n\n例如，如果服务器接收到 Get 请求，`service()` 方法将通过调用带有请求参数的 `doGet()`\
  \ 方法将请求分发到 `doGet()` 方法。同样，`Post`、`Head`、`Put` 等请求也会由 servlet 的 `service()` 方法分发到相应的处理器\
  \ `doPost()`、`doHead()`、`doPut()` 等。\n\n#![](img/image00452.jpeg)\n\n# 4) 当 servlet\
  \ 容器关闭时，它会卸载所有 servlet 并对每个初始化的 servlet 调用 `destroy()` 方法。\n\n 项目 web.xml 文件中的 welcome-file-list\
  \ 标签\n\n你是否曾在 `web.xml` 文件中见过 `<welcome-file-list>` 标签并好奇它是什么？在本文中我将解释这个标签是什么以及我们为什么要使用它。\n\
  \n`<welcome-file-list>` 标签用于指定当你在浏览器上加载项目时未指定文件名，服务器默认需要调用的文件。\n\n例如，你创建了一个名为“MyServletProject”的项目，并在项目里定义了几个\
  \ html 页面和 servlet 类。但在浏览器中，你提供的 URL 如下：\n\n`http://localhost:8080/MyServletProject`\n\
  \n通常我们会提供这样的完整路径：`http://localhost:8080/MyServletProject/index.html`。但如果你提供了上面的路径，Web\
  \ 服务器将会在你的项目 `web.xml` 文件中查找 `<welcome-file-list>` 标签。假设你的 `web.xml` 文件有以下内容：\n\n\
  ```xml\n<web-app>\n  ....\n  <welcome-file-list>\n    <welcome-file>myhome.htm</welcome-file>\n\
  \    <welcome-file>myindex.htm</welcome-file>\n    <welcome-file>mydefaultpage.htm</welcome-file>\n\
  \  </welcome-file-list>\n  ....\n</web-app>\n```\n\n根据 `web.xml` 文件中的内容，服务器会查找 `myhome.htm`，如果不存在则查找\
  \ `myindex.htm`，最后是查找 `mydefaultpage.htm`。\n\n注意：如果 `web.xml` 文件中没有定义 `<welcome-file-list>`\
  \ 标签，服务器将按照以下顺序查找：\n\n1) index.html\n2) index.htm\n3) index.jsp\n\n# web.xml 文件中的\
  \ load-on-startup 标签\n\n默认情况下，Servlet 在接收到请求之前不会加载。这可能会导致访问 servlet 延迟。为了避免访问延迟，你可以在\
  \ `web.xml` 文件中使用 `<load-on-startup>` 标签，强制 servlet 容器在服务器启动时立即加载 servlet（实例化并调用\
  \ `init()`）。\n\n### 如何使用 <load-on-startup>?\n\n这是一个示例 web.xml：\n\n```xml\n<web-app>\n\
  \  <servlet>\n    <servlet-name>MyServlet</servlet-name>\n    <servlet-class>com.Javabook.DemoServlet</servlet-class>\n\
  \    <load-on-startup>1</load-on-startup>\n  </servlet>\n</web-app>\n```\n\n如果我没有指定\
  \ `<load-on-startup>`，Web 容器在请求之前不会加载 servlet。由于我指定了值 `>=0`，它将在启动时加载。\n\n注意：值 `>=0`\
  \ 意味着 servlet 在 webapp 部署或服务器启动时加载；如果值为 `<0`，则 servlet 在容器想要的时候加载。\n\n### 如何使用 <load-on-startup>\
  \ 标签指定 servlet 的加载顺序？\n\n```xml\n<web-app>\n  …\n  <servlet>\n    <servlet-name>MyServlet1</servlet-name>\n\
  \    <servlet-class>com.Javabook.DemoServlet1</servlet-class>\n    <load-on-startup>5</load-on-startup>\n\
  \  </servlet>\n  <servlet>\n    <servlet-name>MyServlet2</servlet-name>\n    <servlet-class>com.Javabook.DemoServlet2</servlet-class>\n\
  \    <load-on-startup>0</load-on-startup>\n  </servlet>\n  <servlet>\n    <servlet-name>MyServlet3</servlet-name>\n\
  \    <servlet-class>com.Javabook.DemoServlet3</servlet-class>\n    <load-on-startup>-2</load-on-startup>\n\
  \  </servlet>\n  …\n</web-app>\n```\n\n在这个示例中，我们在 `web.xml` 中指定了三个 servlet，由于 servlet\
  \ 类 `DemoServlet1` 和 `DemoServlet2` 的 `load-on-startup` 值为 `>=0`，它们都会在服务器启动时被加载。然而，由于\
  \ `DemoServlet2` 的值较小，它将在 `DemoServlet1` 类之前被加载。\n\nservlet 类 `DemoServlet3` 因为具有负的\
  \ `load-on-startup` 值，不会在启动时加载。\n\n\n\n\n当客户端向 Web 服务器发送请求时，Servlet 容器会创建 `ServletRequest`\
  \ 和 `ServletResponse` 对象，并将它们作为参数传递给 servlet 的 `service()` 方法。请求对象提供了对请求信息的访问，例如请求数据的头部（header）和主体（body）。\n\
  \n首先我们将看一个示例，然后查看 `ServletRequest` 接口中可用的方法列表：\n\n### 示例 1：使用 `ServletRequest` 的\
  \ `getParameter()` 方法显示用户输入\n\n在这个示例中，我将演示 `getParameter()` 方法，它可以返回给定参数的值。\n\n\
  在这个 HTML 表单中，我们正在获取用户输入（姓名和年龄），并分别将它们存储在参数 `uname` 和 `uage` 中。\n\nindex.html\n```html\n\
  <form action=\"details\" method=\"get\">\nUser Name: <input type=\"text\" name=\"\
  uname\"><br>\nUser Age: <input type=\"text\" name=\"uage\"><br>\n <input type=\"\
  submit\" value=\"submit\">\n</form>\n```\n\nMyServletDemo.java\n在这个 servlet 类中，我们通过使用\
  \ `getParameter()` 方法获取参数值，该方法属于 `ServletRequest` 接口。在此示例中，我们将 `HttpServletRequest`\
  \ 作为 `doGet()` 方法的参数，`HttpServletRequest` 继承了 `ServletRequest` 接口，因此 `req` 对象可以使用\
  \ `getParameter()` 方法。\n\n获取这些值后，我们将把它们写到网页上。\n\n```java\nimport javax.servlet.http.*;\n\
  import javax.servlet.*;\nimport java.io.*;\n\npublic class MyServletDemo extends\
  \ HttpServlet {\n    public void doGet(HttpServletRequest req, HttpServletResponse\
  \ res)\n    throws ServletException, IOException {\n        res.setContentType(\"\
  text/html\");\n        PrintWriter pwriter=res.getWriter();\n        String name\
  \ = req.getParameter(\"uname\");\n        String age = req.getParameter(\"uage\"\
  );\n        pwriter.println(\"Name: \"+name);\n        pwriter.println(\"Age: \"\
  +age);\n        pwriter.close();\n    }\n}\n```\n\nWeb.xml\n这是你的部署描述文件，用于将 servlet\
  \ 映射到 URL。由于我们的表单的 action 是 details 页面，因此我们将 servlet 类映射到 details 页面。\n\n```xml\n\
  <web-app>\n    <display-name>JavaBookDemo</display-name>\n    <welcome-file-list>\n\
  \        <welcome-file>index.html</welcome-file>\n        <welcome-file>index.htm</welcome-file>\n\
  \        <welcome-file>index.jsp</welcome-file>\n        <welcome-file>default.html</welcome-file>\n\
  \        <welcome-file>default.htm</welcome-file>\n        <welcome-file>default.jsp</welcome-file>\n\
  \    </welcome-file-list>\n    <servlet>\n        <servlet-name>JavaBook</servlet-name>\n\
  \        <servlet-class>MyServletDemo</servlet-class>\n    </servlet>\n    <servlet-mapping>\n\
  \        <servlet-name>JavaBook</servlet-name>\n        <url-pattern>/details</url-pattern>\n\
  \    </servlet-mapping>\n</web-app>\n```\n\n输出：\n屏幕 1：\n# ![](img/image00453.jpeg)\n\
  \n# 点击 submit 后出现的屏幕 2：\n# ![](img/image00454.jpeg)\n\n### 示例 2：获取参数名称和值\n\n在这个示例中，我们将使用\
  \ `getParameterNames()` 和 `getParameter()` 方法来获取参数名称和值。\n\n`getParameterNames()`：返回一个包含\
  \ `String` 对象的 `Enumeration`，其中该请求中包含的参数名称。如果请求没有参数，该方法返回一个空 `Enumeration`。\n\n\
  `getParameter()`：如上所述，它返回给定参数的值。\n\nindex.html\n```html\n<form action=\"details\"\
  \ method=\"get\">\nUser Name: <input type=\"text\" name=\"uname\"><br>\nUser Age:\
  \ <input type=\"text\" name=\"uage\"><br>\n <input type=\"submit\" value=\"submit\"\
  >\n</form>\n```\n\nMyServletDemo.class\n```java\nimport java.io.IOException;\nimport\
  \ java.io.PrintWriter;\nimport java.util.Enumeration; \nimport javax.servlet.ServletException;\n\
  import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
  import javax.servlet.http.HttpServletResponse;\n\npublic class MyServletDemo extends\
  \ HttpServlet {     \n    public void doGet(HttpServletRequest req, HttpServletResponse\
  \ res)\n    throws ServletException, IOException {     \n        PrintWriter pwriter=res.getWriter();\
  \ \n        res.setContentType(\"text/html\");\n        Enumeration en=req.getParameterNames();\n\
  \        while(en.hasMoreElements()) {\n            Object obj=en.nextElement();\n\
  \            String param=(String)obj;\n            String pvalue=req.getParameter(param);\n\
  \            pwriter.print(\"Parameter Name: \"+param+ \" Parameter Value: \"+pvalue);\n\
  \        }\n        pwriter.close();  \n    }\n}\n```\n\nweb.xml\n```xml\n<web-app>\n\
  \    <servlet>\n        <servlet-name>JavaBook</servlet-name>\n        <servlet-class>MyServletDemo</servlet-class>\n\
  \    </servlet>\n    <servlet-mapping>\n        <servlet-name>JavaBook</servlet-name>\n\
  \        <url-pattern>/details</url-pattern>\n    </servlet-mapping>\n</web-app>\n\
  ```\n输出：\n# ![](img/image00455.jpeg)\n# Parameter Name: uname Parameter Value: Chand\n\
  # Parameter Name: uage Parameter Value: 30\n\n### 示例 3：获取头部信息\n\nindex.html\n```html\n\
  <h1>Request Demo</h1>\n<body><a href=\"headinfo\">Click Here</a></body>\n```\n\n\
  HeaderDetails.java\n```java\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\
  import java.util.Enumeration;\nimport javax.servlet.ServletException;\nimport javax.servlet.http.HttpServlet;\n\
  import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
  \npublic class HeaderDetails extends HttpServlet {\n    public void doGet(HttpServletRequest\
  \ req, HttpServletResponse res)\n    throws ServletException, IOException {\n  \
  \      res.setContentType(\"text/html\");\n        PrintWriter pwriter=res.getWriter();\n\
  \        pwriter.println(\"HTTP header:<br>\");\n        Enumeration en=req.getHeaderNames();\n\
  \        while (en.hasMoreElements()) {\n            String hName = (String)en.nextElement();\n\
  \            String hValue = req.getHeader(hName);\n            pwriter.println(\"\
  <b>\"+hName+\": </b>\"+hValue + \"<br>\");\n        }\n        pwriter.close();\n\
  \    }\n}\n```\n\nweb.xml\n```xml\n<web-app>\n    <welcome-file-list>\n        <welcome-file>index.html</welcome-file>\n\
  \        <welcome-file>index.htm</welcome-file>\n        <welcome-file>index.jsp</welcome-file>\n\
  \        <welcome-file>default.html</welcome-file>\n        <welcome-file>default.htm</welcome-file>\n\
  \        <welcome-file>default.jsp</welcome-file>\n    </welcome-file-list>\n  \
  \  <servlet>\n        <servlet-name>JavaBook</servlet-name>\n        <servlet-class>HeaderDetails</servlet-class>\n\
  \    </servlet>\n    <servlet-mapping>\n        <servlet-name>JavaBook</servlet-name>\n\
  \        <url-pattern>/headinfo</url-pattern>\n    </servlet-mapping>\n</web-app>\n\
  ```\n输出：\n# ![](img/image00456.jpeg)\n\n## `ServletRequest` 接口的方法\n\n`getParameter(String\
  \ name)`：返回给定参数的 `String` 值值，如果给定参数不存在则返回 null。\n\n`getParameterNames()`：返回一个包含请求中参数名称的\
  \ `String` 对象的 `Enumeration`。\n\n`getParameterValues(String name)`：返回包含该参数所有值的 `String`\
  \ 数组，如果参数没有任何值则返回 null。\n\n`getCharacterEncoding()`：返回请求主体中使用的字符编码名称。如果请求未指定字符编码，则该方法返回\
  \ null。\n\n`setCharacterEncoding(String env)`：覆盖请求主体中的字符编码。\n\n`getContentLength()`：返回请求内容的长度（字节）。\n\
  \n`getContentType()`：返回请求主体的 MIME 类型，如果类型未知则返回 null。\n\n# RequestDispatcher 方法\n\
  \n# Servlet 中的 RequestDispatcher 方法示例\n\n`RequestDispatcher` 接口定义了一个对象，它可以接收请求并将其分发到资源（如\
  \ servlet、JSP、HTML 文件）。该接口具有以下两个方法：\n\n`public void forward(ServletRequest request,\
  \ ServletResponse response)`：将请求从一个 servlet 转发到另一个资源（如 servlet、JSP、HTML 文件）。\n\n\
  `public void include(ServletRequest request, ServletResponse response)`：将资源（如 servlet、JSP、HTML\
  \ 文件）的内容包含在响应中。\n\n## forward() 与 include() 方法的区别\n\n\n\n\n为了理解这两种方法的区别，让我们来看一个例子：假设你有两个页面\
  \ `X` 和 `Y`。在页面 `X` 中，你有一个 `include` 标签，这意味着控制权将一直留在页面 `X` 直到遇到 `include` 标签，此之后控制权将转移到页面\
  \ `Y`。在页面 `Y` 处理结束时，控制权将返回到页面 `X`，从 `include` 标签之后的位置开始，并一直留在 `X` 直到结束。\n\n在这种情况下，发送给客户端的最终响应将由页面\
  \ `X` 发送。\n\n现在，我们使用 `forward` 取相同的例子。我们有相同的页面 `X` 和 `Y`。在页面 `X` 中，我们有 `forward`\
  \ 标签。在这种情况下，控制权将一直留在页面 `X` 直到遇到 `forward`，之后控制权将转移到页面 `Y`。这里的主要区别是控制权不会返回 `X`，而是一直留在页面\
  \ `Y` 直到结束。\n\n在这种情况下，发送给客户端的最终响应将由页面 `Y` 发送。\n\n## Example：\n\n在这个例子中，我将同时使用 `include`\
  \ 和 `forward` 两种方法。使用 `include` 方法，我将更改当前页的内容，当我准备好将控制权转移到下一个页面时，我将使用 `forward`\
  \ 方法。\n\n### index.html\n```html\n<form action=\"loginPage\" method=\"post\">\n\
  \  User Name:<input type=\"text\" name=\"uname\"/><br/>\n  Password:<input type=\"\
  password\" name=\"upass\"/><br/>\n  <input type=\"submit\" value=\"SUBMIT\"/>\n\
  </form>\n```\n\n### Validation.java\n```java\nimport java.io.*;\nimport java.io.*;\n\
  import javax.servlet.*;\nimport javax.servlet.http.*;\n\npublic class Validation\
  \ extends HttpServlet {\n    public void doPost(HttpServletRequest request, HttpServletResponse\
  \ response) throws ServletException, IOException {\n        response.setContentType(\"\
  text/html\");\n        PrintWriter pwriter = response.getWriter();\n        String\
  \ name=request.getParameter(\"uname\");\n        String pass=request.getParameter(\"\
  upass\");\n        if(name.equals(\"Chandru\") && pass.equals(\"Javabook\")) {\n\
  \            RequestDispatcher dis=request.getRequestDispatcher(\"welcome\");\n\
  \            dis.forward(request, response);\n        } else {\n            pwriter.print(\"\
  User name or password is incorrect!\");\n            RequestDispatcher dis=request.getRequestDispatcher(\"\
  index.html\");\n            dis.include(request, response);\n        }\n    }\n\
  }\n```\n\n### WelcomeUser.java\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
  import javax.servlet.http.*;\n\npublic class WelcomeUser extends HttpServlet {\n\
  \    public void doPost(HttpServletRequest request, HttpServletResponse response)\
  \ throws ServletException, IOException {\n        response.setContentType(\"text/html\"\
  );\n        PrintWriter pwriter = response.getWriter();\n        String name=request.getParameter(\"\
  uname\");\n        pwriter.print(\"Hello \"+name+\"!\");\n        pwriter.print(\"\
  \ Welcome to Javabook.com\");\n    }\n}\n```\n\n### web.xml\n```xml\n<web-app>\n\
  \  <display-name>JavaBookDemo</display-name>\n  <welcome-file-list>\n    <welcome-file>index.html</welcome-file>\n\
  \  </welcome-file-list>\n  <servlet>\n    <servlet-name>Login</servlet-name>\n \
  \   <servlet-class>Validation</servlet-class>\n  </servlet>\n  <servlet>\n    <servlet-name>Welcome</servlet-name>\n\
  \    <servlet-class>WelcomeUser</servlet-class>\n  </servlet>\n  <servlet-mapping>\n\
  \    <servlet-name>Login</servlet-name>\n    <url-pattern>/loginPage</url-pattern>\n\
  \  </servlet-mapping>\n  <servlet-mapping>\n    <servlet-name>Welcome</servlet-name>\n\
  \    <url-pattern>/welcome</url-pattern>\n  </servlet-mapping>\n  <welcome-file-list>\n\
  \    <welcome-file>index.html</welcome-file>\n  </welcome-file-list>\n</web-app>\n\
  ```\n\n\n\n\n<context-param>\n  <param-name>email_id</param-name>\n  <param-value>javabook@gmail.com</param-value>\n\
  </context-param>\n\n## ServletContext 完整示例：获取初始化参数\n\n在这个示例中，我们在 `web.xml` 文件中定义了两个上下文初始化参数（用户名和用户邮箱），并在\
  \ Servlet 中使用 `getInitParameter()` 方法获取这些值，该方法会返回指定参数的值。\n\n### DemoServlet.java\n\
  ```java\nimport java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
  public class DemoServlet extends HttpServlet {\n    public void doGet(HttpServletRequest\
  \ request, HttpServletResponse response)\n    throws ServletException, IOException\
  \ {\n        response.setContentType(\"text/html\");\n        PrintWriter pwriter=response.getWriter();\n\
  \        // 创建 Servlet 对象\n        ServletContext scontext=getServletContext();\n\
  \        // 获取初始化参数的值并打印\n        String userName=scontext.getInitParameter(\"uname\"\
  );\n        pwriter.println(\"User name is=\"+userName);\n        String userEmail=scontext.getInitParameter(\"\
  email\");\n        pwriter.println(\"Email Id is=\"+userEmail);\n        pwriter.close();\n\
  \    }\n}\n```\n\n### web.xml\n```xml\n<web-app>\n  <servlet>\n    <servlet-name>JavaBook</servlet-name>\n\
  \    <servlet-class>DemoServlet</servlet-class>\n  </servlet>\n  <context-param>\n\
  \    <param-name>uname</param-name>\n    <param-value>Chandruprasad</param-value>\n\
  \  </context-param>\n  <context-param>\n    <param-name>email</param-name>\n   \
  \ <param-value>javabook@gmail.com</param-value>\n  </context-param>\n  <servlet-mapping>\n\
  \    <servlet-name>JavaBook</servlet-name>\n    <url-pattern>/context</url-pattern>\n\
  \  </servlet-mapping>\n</web-app>\n```\n\n**输出：**\nUser name is:Chandruprasad Email\
  \ Is is:Javabook@gmail.com\n\n## ServletContext 接口方法\n\n以下是 `ServletContext` 接口常用方法列表。\n\
  \n- `public String getInitParameter(String param)`: 返回指定参数的值，如果参数不存在则返回 null。\n\
  - `public Enumeration getInitParameterNames()`: 返回上下文参数名称的枚举器。\n- `public void setAttribute(String\
  \ name,Object object)`: 为指定的属性名设置属性值。\n- `public Object getAttribute(String name)`:\
  \ 返回指定名称的属性值，如果不存在则返回 null。\n- `public String getServerInfo()`: 返回运行 servlet 的 servlet\
  \ 容器名称和版本。\n- `public String getContextPath()`: 返回 Web 应用程序的路径。\n\n## ServletResponse\
  \ 接口\n\nServlet 容器连接到 Web 服务器，Web 服务器在特定端口接收来自客户端的 HTTP 请求。当客户端向 Web 服务器发送请求时，Servlet\
  \ 容器会创建 `HttpServletRequest` 和 `HttpServletResponse` 对象，并将它们作为参数传递给 servlet 的 `service()`\
  \ 方法。\n\n响应对象允许您格式化并将响应发送回客户端。首先，我们将查看 `ServletResponse` 接口中常用方法，然后看一个示例。\n\n##\
  \ ServletResponse 接口方法\n\n1) `String getCharacterEncoding()`: 返回发送给客户端的响应体中所使用的\
  \ MIME 字符集名称。\n2) `String getContentType()`: 返回响应的内容类型。例如：text, html 等。\n3) `ServletOutputStream\
  \ getOutputStream()`: 返回一个适用于在响应中写入二进制数据的 `ServletOutputStream`。\n4) `java.io.PrintWriter\
  \ getWriter()`: 返回 `PrintWriter` 对象。\n5) `void setCharacterEncoding(java.lang.String\
  \ charset)`: 设置响应的 MIME 字符集（字符编码）。\n6) `void setContentLength(int len)`: 设置响应体的长度。\n\
  7) `void setContentType(java.lang.String type)`: 设置响应数据的类型。\n8) `void setBufferSize(int\
  \ size)`: 设置缓冲区大小。\n9) `int getBufferSize()`: 返回缓冲区大小。\n10) `void flushBuffer()`:\
  \ 强制将缓冲区中的任何内容写入客户端。\n11) `boolean isCommitted()`: 返回一个布尔值，表示响应是否提交。\n12) `void\
  \ reset()`: 清空缓冲区数据以及响应头信息和状态码。\n\n## 示例：\n\n在下面的示例中，我们使用了 `ServletResponse` 接口的\
  \ `setContentType()` 和 `getWriter()` 方法。\n\n### index.html\n```html\n<form action=\"\
  mydetails\" method=\"get\">\n  User name: <input type=\"text\" name=\"uname\">\n\
  \  <input type=\"submit\" value=\"login\">\n</form>\n```\n\n### MyServletDemo.java\n\
  ```java\nimport javax.servlet.http.*;\nimport javax.servlet.*;\nimport java.io.*;\n\
  public class MyServletDemo extends HttpServlet {\n    public void doGet(HttpServletRequest\
  \ req,HttpServletResponse res)\n    throws ServletException, IOException {\n   \
  \     res.setContentType(\"text/html\");\n        PrintWriter pwriter=res.getWriter();\n\
  \        String name=req.getParameter(\"uname\");\n        pwriter.println(\"User\
  \ Details Page:\");\n        pwriter.println(\"Hello \"+name);\n        pwriter.close();\n\
  \    }\n}\n```\n\n### web.xml\n```xml\n<web-app>\n  <servlet>\n    <servlet-name>DemoServlet</servlet-name>\n\
  \    <servlet-class>MyServletDemo</servlet-class>\n  </servlet>\n  <servlet-mapping>\n\
  \    <servlet-name>DemoServlet</servlet-name>\n    <url-pattern>/mydetails</url-pattern>\n\
  \  </servlet-mapping>\n</web-app>\n```\n\n**输出：**\nUser Details Page:Hello Chandruprasad\n\
  \n## HttpSession\n\n`HttpSession` 对象用于会话管理。它包含了整个应用程序范围内特定用户的信息。当用户首次进入网站（或应用程序）时，通过\
  \ `getSession()` 获取会话，系统会分配一个唯一的 ID 来标识用户。该 ID 可以存储在 Cookie 或请求中。\n\n会话将保持有效，直到超过\
  \ `web.xml` 中指定的超时时间。如果未指定，默认超时时间为 30 分钟，这意味着如果用户未访问应用程序，Servlet 容器将销毁会话。随后的请求将创建一个新的会话。\n\
  \n这就是创建 `HttpSession` 对象的方法：\n\n```java\nprotected void doGet(HttpServletRequest\
  \ req,HttpServletResponse res)\nthrows ServletException, IOException {\n    HttpSession\
  \ session = req.getSession();\n}\n```\n\n您可以使用 `setAttribute()` 方法将用户信息存储到会话中，并在需要时从会话中获取这些信息。这就是在会话中存储信息的方法。在这里，我们分别使用属性名\
  \ `uName`、`uemailId` 和 `uAge` 将用户名、邮箱和年龄存储到会话中。\n\n```java\nsession.setAttribute(\"\
  uName\", \"ChandruPrasad\");\nsession.setAttribute(\"uemailId\", \"myemailid@gmail.com\"\
  );\nsession.setAttribute(\"uAge\", \"30\");\n```\n\n第一个参数是属性名，第二个是属性值。例如上面的代码中 `uName`\
  \ 是属性名，`ChandruPrasad` 是属性值。\n\n要从会话获取值，我们使用 `HttpSession` 接口的 `getAttribute()`\
  \ 方法。在这里我们通过属性名获取属性值。\n\n```java\nString userName = (String) session.getAttribute(\"\
  uName\");\nString userEmailId = (String) session.getAttribute(\"uemailId\");\nString\
  \ userAge = (String) session.getAttribute(\"uAge\");\n```\n\n## HttpSession 方法\n\
  \n- `public void setAttribute(String name, Object value)`: 将对象与名称绑定并将键值对存储为 `HttpSession`\
  \ 对象的属性。如果属性已存在，则该方法将替换旧属性。\n- `public Object getAttribute(String name)`: 从会话对象返回参数中指定的\
  \ String 对象。如果未找到指定的属性，则 `getAttribute()` 方法将返回 `null`。\n\n\n\n\n\n`public Enumeration\
  \ getAttributeNames()`: 返回一个 `Enumeration`，其中包含所有作为属性绑定到会话（session）对象的对象的名称。\n\n\
  `public void removeAttribute(String name)`: 从会话中移除指定的属性。\n\n`setMaxInactiveInterval(int\
  \ interval)`: 设置会话空闲时间（以秒为单位）。该时间指定了自收到客户端请求以来，会话保持活跃的秒数。\n\n## 会话示例\n\n### index.html\n\
  ```html\n<form action=\"login\">\n  User Name:<input type=\"text\" name=\"userName\"\
  /><br/>\n  Password:<input type=\"password\" name=\"userPassword\"/><br/>\n  <input\
  \ type=\"submit\" value=\"submit\"/>\n</form>\n```\n\n### MyServlet1.java\n```java\n\
  import java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\npublic\
  \ class MyServlet1 extends HttpServlet {\n    public void doGet(HttpServletRequest\
  \ request, HttpServletResponse response) {\n        try {\n            response.setContentType(\"\
  text/html\");\n            PrintWriter pwriter = response.getWriter();\n       \
  \     String name = request.getParameter(\"userName\");\n            String password\
  \ = request.getParameter(\"userPassword\");\n            pwriter.print(\"Hello \"\
  +name);\n            pwriter.print(\"Your Password is: \"+password);\n         \
  \   HttpSession session=request.getSession();\n            session.setAttribute(\"\
  uname\",name);\n            session.setAttribute(\"upass\",password);\n        \
  \    pwriter.print(\"<a href='welcome'>view details</a>\");\n            pwriter.close();\n\
  \        } catch(Exception exp) {\n            System.out.println(exp);\n      \
  \  }\n    }\n}\n```\n\n### MyServlet2.java\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
  import javax.servlet.http.*;\npublic class MyServlet2 extends HttpServlet {\n  \
