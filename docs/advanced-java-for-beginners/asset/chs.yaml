- "# 初学者级 Java 入门指南\n\n\n\n![](img/cover00463.jpeg)\n\n\n## 关于\nJava Server Pages\
  \ (JSP) 是一种用于开发动态网页的服务器端技术。它主要用于实现应用程序的表现层（GUI 部分）。一个完整的 JSP 代码更像是一个包含少量 Java 代码的\
  \ HTML。JSP 是 `servlets` 的扩展，每个 JSP 页面在处理客户端请求之前，都会先由 `JSP container` 转换为 `servlets`。\n\
  \n这些教程是为初编写的，因此即使你没有这方面的先验知识，理解这些教程也不会遇到任何困难。\n\n我们书籍的目标是为所有学习者影响“高级 Java”的基础知识。所有的程序都通过示例进行了清晰的解释。\n\
  \n本书专为学习者准备的。\n\n最后更新：2018 年 2 月 1 日\n反馈：naviferoz@india.com\n\n\n## 目录\n- JSP 概览\
  \ 生命周期\n- 脚本段 (SCRIPTLETS)](#\n  4. 动作标签简介\n  5. Include 动作标签\n  6. 带参数的 Include\
  \ 动作\n  7. Forward 动作标签\n  8. `jsp:useBean`, `jsp:setProperty` 和 `jsp:getProperty`\
  \ 动作标签\n- 表达式 (EXPRESSIONS)](#\n  10. 声明标签\n- JSP 隐式对象 (JSP IMPLICIT OBJECTS)](#\n\
  \  20. 表达式语言 (EL)\n- 异常处理 (EXCEPTION HANDLING)](#\n  22. JSP 中的自定义标签\n  23. 如何访问自定义标签的体内容\n\
  - 指令 (DIRECTIVES)](#\n  29. JSON 教程\n- Servlet 教程 (SERVLET TUTORIALS) %>\n</BODY>\n\
  </HTML>\n```\n\n### 你的第一个 JSP\n让我们从简单的 JSP 开始学习 JSP。\n\n```html\n<%-- JSP 注释 --%>\n\
  <HTML>\n<HEAD>\n<TITLE>MESSAGE</TITLE>\n</HEAD>\n<BODY>\n<%out.print(\"Hello, Sample\
  \ JSP code\");%>\n</BODY>\n</HTML>\n```\n\n上面的 JSP 生成以下输出：\n`Hello, Sample JSP code.`\n\
  \n### 上述代码解释\n1) `<%–JSP Comment–%>` 行表示名为 `JSP Comment` 的 JSP 元素，在 JSP 页面上添加注释时可以使用此标签，我们将在随后的文章中详细讨论。\n\
  注意：JSP 注释必须以 `<%–` 开头并以 `%>` 结尾。\n\n2) `Head`、`Title` 和 `Body` 标签是 HTML 标签 – 它们是\
  \ HTML 标签，经常用于静态网页。它们包含的任何内容都会原样传递给客户端（Web 浏览器）。\n\n3) `<%out.print(\"Hello, Sample\
  \ JSP code\");%>` 是一个脚本段（scriptlet）。`out` 是一个用于向缓冲区打印内容的隐式对象。\n\n### Servlet vs\
  \ JSP\n它们之间的主要区别是 Servlet 添加 Java 代码，而 JSP 在 HTML 内部添加 Java。\n\n#### Servlet\n1.\
  \ Servlet 是支持 HTML 标签的 Java 程序。\n2. 通常用于开发企业应用程序的业务层（复杂代码）。\n3. 由 Java 开发者创建和维护。\n\
  \n#### JSP\n1. JSP 程序是支持 Java 语句的 HTML 代码。准确地说， JSP 在 HTML 中嵌入 Java。\n2. 用于开发企业应用程序的表现层\n\
  3. 经常被 Web 开发者使用。\n\n### JSP 的优点\nJSP 具有 Servlet 的所有优点，如：比 CGI 更高效；内置 Session 功能；它还继承了\
  \ Java 特性，如多线程、异常处理、数据库连接。\n\nJSP 实现了内容生成与内容展示的分离。这使其更加灵活。\n\n有了 JSP，Web 设计师现在可以展示所需的信息。Web\
  \ 应用程序程序员可以专注于如何处理/构建信息。\n\n# JSP 架构\n在开始开发 Web 应用程序之前，我们应该对架构有一个基本的了解。根据请求处理的位置（Servlet\
  \ 或 JSP），JSP 有两种架构。它们是 Model1 架构和 Model2 架构。\n\n1. Model1 架构：在这种模型中，JSP 扮演关键角色，负责处理客户端提出的请求。客户端（Web\
  \ 浏览器）发出请求，JSP 然后创建一个 Bean 对象，完成请求并将响应传递给 JSP。JSP 然后将响应返回给客户端。与 Model2 架构不同，这种模型的大部分处理由\
  \ JSP 本身完成。\n\n![](img/image00361.jpeg)\n\n2. Model2 架构：在这种模型中，Servlet 扮演主要角色并负责处理客户端（网页浏览器）请求。表现部分（GUI\
  \ 部分）将由 JSP 处理，并如如下所示通过 Bean 完成。Servlet 充当控制器并负责请求处理。如果 JSP 页面需要，它会创建 Bean 对象并调用相应的\
  \ JSP 页面。JSP 使用 Bean 对象处理表现部分。在这种模型中，JSP 不进行任何处理，Servlet 根据客户端提出的请求创建 Bean 对象并调用\
  \ JSP 程序。\n\n![](img/image00362.jpeg)\n\n\n\n\n\n# Java Server Pages (JSP) 生命周期\n\
  \nJSP 页面以 `.jsp` 扩展名保存，这让服务器知道这是一个 JSP 页面，并且需要经过 JSP 生命各个阶段。\n\n在我之前关于 JSP 介绍的博文中，我解释过\
  \ JSP 并不是直接被处理的，它们首先被转换为 `Servlets`，然后由服务器对相应的 servlet 处理。\n\n当客户端向 `Server` 发起请求时，它首先进入\
  \ `container`。然后 `container` 检查 servlet 类是否旧于 JSP 页面（以确保 JSP 文件已被修改）。如果是如此，则 `container`\
  \ 将再次进行翻译（将 JSP 转换为 `Servlet`），否则它将跳过翻译阶段（即：如果 JSP 网页未被修改，则不进行翻译以提高性能，因为此阶段非常耗时，且每次都重复此步骤在时间上是不可行的）。\n\
  \nJSP 页面的生命周期步骤如下：\n\n1) 翻译 (Translation)\n2) 编译 (Compilation)\n3) 加载 (Loading)\n\
  4) 实例化 (Instantiation)\n5) 初始化 (Initialization)\n6) 请求处理 (Request Processing)\n\
  7) 销毁 (Destruction)\n\n![](img/image00363.jpeg)\n\n## 让我们详细查看 JSP 的周期\n\n1) 如上所述，每当\
  \ `container` 接收到客户端请求时，只有当 servlet 类旧于 JSP 页时才会进行翻译，否则跳过此阶段（原因见上文解释）。\n\n2) 然后\
  \ `container` ——\n- 编译相应的 servlet 程序\n- 加载相应的 servlet 类\n- 实例化 servlet 类\n- 调用 `jspInit()`\
  \ 方法初始化 servlet 实例（只有当 servlet 文件实例未运行或其旧于 jsp 文件时，Jsp 容器才会执行此工作）。\n\n```java\n\
  public void jspInit()\n{\n    // 初始化 Servlet 实例的代码\n}\n```\n\n3) 然后创建一个新线程，该线程调用\
  \ `_jspService()` 方法，并将请求 (`HttpServletRequest`) 和响应 (`HttpServletRespnse`) 对象作为参数\
  \ - 所示。\n\n```java\nvoid _jspService( HttpServletRequest req, HttpServletResponse\
  \ res)\n{\n    // 代码写在这里\n}\n```\n\n4) 调用 `jspDestroy()` 方法销毁 servlet 类实例。代码如下所示\
  \ –\n\n```java\npublic void jspDestory()\n{\n    //  servlet 类实例的代码\n}\n```\n\n\
  ## SCRIPTTS\n\n### JSP Scriptlets (脚本段)\n\n我们可以使用 scriptlets 在 JSP 中编写 java 代码。JSP\
  \ 容器会将 scriptlets 内容移动到 `_jspService()` 方法中，该方法在处理请求期间对服务器可用。\n\nScriptlets 无非就是封装在\
  \ `<%` 和 `%>` 标签内的 java 代码。JSP 容器在从 JSP 生成 servlet 时，会将包含其中的语句移动到 `_jspService()`\
  \ 方法。将此代码拷贝到服务方法的原因是：对于每个客户端的请求都会调用 `_jspService()` 方法，因此其中的代码会为客户端的每个请求执行一次。\n\n\
  **Scriptlet 语法：**\n\n```java\n<% 可执行的 java 代码%>\n```\n\n### Scriptlet 的 JSP 到 Servlet\
  \ 转换 –\n\n正如我在之前的教程中所说，JSP 不直接执行，它首先被转换为 `Servlet`，然后像正常一样执行 `Servlet`。此外，我在第一段中解释过，在从\
  \ JSP 到 servlet 的翻译过程中，java 代码从 scriptlet 复制到 `_jspService()` 方法。让我们来看看它是如何发生的。\n\
  \n**示例 JSP 代码：**\n\n```html\n<H3>SampleJSP </H3>\n<% myMethod();%>\n```\n\n注意：scriptlet\
  \ 末尾的分的分号。\n\n**上述 JSP 代码对应的翻译后的 Servlet 代码：**\n\n```java\npublic void _jspService(HttpServletRequest\
  \ request, HttpServletResponse response)\nthrows ServletException, IOException {\n\
  \    response.setContentType(\"text/html\");\n    HttpSession session = request.getSession();\n\
  \    JspWriter out = response.getWriter();\n    out.println(\"<H2>Sample JSP</H2>\"\
  );\n    myMethod();\n}\n```\n\n**一个学习脚本元素的示例：**\n\n```java\n<%– 一个用于学习 JSP 脚本元素的\
  \ JSP 示例 –%>\n<%String string1 =\"JSP scriptlet\";%>\n<%!String string2 =\"\";%>\n\
  <html>\n<head>\n<title> JSP 页面: 欢迎 </title>\n</head>\n<body>\n<h1>\n<%– 这是一个表达式语句\
  \ –%>\nWelcome to <%=string1%>\n</h1>\n<%– scriptlet 示例 –%>\n<%if(localstring.equals(\"\
  JSP scriptlet\")){%>\nHi\n<%}\nelse {%>\nhello\n<%} %>\n<%– 也可以用这样做实现 –%>\n<%if(localstring.equals(\"\
  JSP scriptlet\"))\nout.println(\"Hi\"+string2);\nelse\nout.println(\"hello\");\n\
  %>\n</body>\n</html>\n```\n\n在上面的示例中，存在许多类型的 JSP 元素，例如表达式 (Expression)、JSP 注释、声明元素等。我们将在接下来的\
  \ JSP 教程中查看每一个，但目前你只需要关注 Scriptlets。以下是上述示例中使用的 scriptlets 语句：\n\n```java\n<%if(localstring.equals(\"\
  JSP scriptlet\"))\nout.println(\"Hi\"+string2);\nelse\nout.println(\"hello\");\n\
  %>\n```\n\n上面的代码是一个 JSP scriptlet（注意起始的 `<%` 和结束的 `%>` 标签）。如果你分析上面的代码段，你会发现标签内的代码是纯\
  \ java 代码，因此为了在 JSP 中执行 java 代码，我们使用 scriptlets。\n\n```java\n<%String string1 =\"\
  JSP scriptlet\";%>\n```\n\n每当 `container` 接收到客户端请求时，只有当 servlet 类旧于 JSP 页面时才会进行翻译，否则跳过此阶段（原因见上文解释）。\n\
  \n然后 `container` ——\n```java\nif (num > 5)\n{\n    out.println(\"hi\");\n}\nelse\n\
  {\n    out.println(\"num value should be less than 6\");\n}\n```\n\n```html\n<!\
  \ DOYPE HTML PUBLIC \"-//W3C//DTD HTML4.0//EN\">\n<html>\n<head>\n<TITLE> MY JSP\
  \ PAGE </TITLE>\n</head>\n<body>\n<% if (num > 5) { %>\n<H3> hi </H3>\n<%} else\
  \ {%>\n<h3> num value should be less than 6 </h3>\n<% } %>\n</body>\n</html>\n```\n\
  \n重要的点：由于内部代码是 java 代码，它必须以分号结束。现在注意所有语句 —— 你会发现 java 中都需要它并以分号结束。\n\n**注意：回到此处**\n\
  \n## DECLARATIONS (声明)\n\n### ACTION TAGS (动作标签)\n\n#### JSP Actions – Java Server\
  \ Pages\n\n**Directives (指令) 与 Actions (动作)**\n1. 指令在翻译阶段使用而动作在请求处理阶段使用。\n2. 与指令不同，动作在每次访问页面时都会重新求值。\n\
  3. 以下是 JSP 中使用的动作元素：\n\n**1. `<jsp:include>` 动作**\n就像 include 指令，此动作也用于将 JSP 文件插入另一个文件中。\n\
  \n`<jsp:include>` 与 include 指令：它们具有我在文章开头提到的相同区别（指令与动作）。在 `<jsp:include>` 中，文件是在请求处理期间包含的，而在\
  \ include 指令的情况下是在翻译阶段包含的。\n\n**语法：**\n\n```xml\n<jsp:include page=\"page URL\"\
  \ flush=\"Boolean Value\" />\n```\n这里 `page URL` 是：需要包含的页面位置 `flush` 值可以是 true 或\
  \ false（布尔值）。\n\n**示例：**\n\n```html\n<html>\n<head>\n<title>JSP include 动作标签演示</title>\n\
  </head>\n<body>\n<h3>JSP 页面: 包含演示</h3>\n<jsp:include page=\"sample.jsp\" flush=\"\
  false\" />\n</body>\n</html>\n```\n\n\n\n\n\n# 页面详情\n\nPage: 页面值为 `sample.jsp`，这意味着该页面需要被包含在当前文件中。提及的文件名表明\
  \ `sample.jsp` 位于同一目录下。\n\nFlush: 它的值为 `false`，意味着在包含到当前页面之前，资源缓冲区尚未刷新。\n\n# JSP\
  \ include 动作标签\n\nJSP include 动作标签 – JSP 教程\n\nInclude 标签用于将另一个资源包含到当前 JSP 页面中。被包含的资源可以是\
  \ HTML 静态页面、JSP 页面或 Servlet。我们还可以向要包含的资源传递参数及其值。在下面，我分享了两个 `<jsp:include>` 的示例，一个是在不传递任何参数的情况下包含页面，第二个示例是向被包含的页面传递几个参数。\n\
  \n### 语法\n\n1) 带有参数的包含。\n\n```jsp\n<jsp:include page=\"Relative_URL_Of_Page\">\n\
  \    <jsp:param ... />\n    <jsp:param ... />\n    <jsp:param ... />\n    ...\n\
  \    <jsp:param ... />\n</jsp:include>\n```\n\n2) 不共享参数的包含另一个资源。\n\n```jsp\n<jsp:include\
  \ page=\"Relative_URL_of_Page\" />\n```\n\n`Relative_URL_of_Page` 如果页面位于当前 JSP 页面所在的目录，则应为页面名。\n\
  \n## 示例 1: 不带参数的 <jsp:include>\n\n在此示例中，我们将使用不带参数的 `<jsp:include>` 动作标签。结果该页面将原样包含在当前\
  \ JSP 页面中：\n\n**index.jsp**\n```jsp\n<html>\n<head>\n    <title>JSP Include example</title>\n\
  </head>\n<body>\n    <b>index.jsp Page</b><br>\n    <jsp:include page=\"Page2.jsp\"\
  \ />\n</body>\n</html>\n```\n\n**Page2.jsp**\n```jsp\n<b>Page2.jsp</b><br>\n<i This\
  \ is the content of Page2.jsp page</i>\n```\n\n**输出：**\n`Page2.jsp` 的内容已追加到 `index.jsp`\
  \ 中。\n\n![](img/image00364.jpeg)\n\n## 示例 2: 使用 <jsp:param> 使用 <jsp:include>\n\n\
  **index.jsp**\n```jsp\n我在这里使用 `<jsp:include>` 动作标签配合 `<jsp:param>` 来向我们将要包含的页面传递参数。\n\
  <html>\n<head>\n    <title>JSP Include example with parameters</title>\n</head>\n\
  <body>\n    <h2>This is index.jsp Page</h2>\n    <jsp:include page=\"display.jsp\"\
  >\n        <jsp:param name=\"userid\" value=\"Chandru\" />\n        <jsp:param name=\"\
  password\" value=\"Chandru\" />\n        <jsp:param name=\"name\" value=\"Chandru\
  \ Babu\" />\n        <jsp:param name=\"age\" value=\"27\" />\n    </jsp:include>\n\
  </body>\n</html>\n```\n\n**display.jsp**\n```jsp\n<html>\n<head>\n    <title>Display\
  \ Page</title>\n</head>\n<body>\n    <h2>Hello this is a display.jsp Page</h2>\n\
  \    UserID: <%=request.getParameter(\"userid\") %><br>\n    Password is: <%=request.getParameter(\"\
  password\") %><br>\n    User Name: <%=request.getParameter(\"name\") %><br>\n  \
  \  Age: <%=request.getParameter(\"age\") %>\n</body>\n</html>\n```\n\n**输出：**\n\
  如你所示，`display.jsp` 的内容已包含在 `index.jsp` 中。此外，我们传递的参数在包含页面中正确显示。\n\n![](img/image00365.jpeg)\n\
  \n# 带有参数的 JSP include 动作示例\n\n为了传递参数，我们需要使用 `<jsp:param>` 动作标签。\n\n### 示例\n\n在此示例中，我们使用\
  \ `<jsp:include>` 动作标签将一个 JSP 页面 (`file.jsp`) 包含主 JSP 页面 (`index.jsp`)。为了从 index\
  \ 向 file 页传递参数，我们使用了 `<jsp:param>` 动作标签。我们传递了三个参数 `firstname`、`middlename` 和 `lastname`，对于每个参数，我们需要指定对应的参数名和参数值。同样的内容可以在包含的页面中使用表达式语言或表达式标签及隐式对象来提取。\n\
  \n**index.jsp**\n```jsp\n<html>\n<head>\n    <title>JSP include with parameters\
  \ example</title>\n</head>\n<body>\n    <jsp:include page=\"file.jsp\">\n      \
  \  <jsp:param name=\"firstname\" value=\"Chandru\" />\n        <jsp:param name=\"\
  middlename\" value=\"Pratap\" />\n        <jsp:param name=\"lastname\" value=\"\
  Prasad\" />\n    </jsp:include>\n</body>\n</html>\n```\n\n**file.jsp**\n```jsp\n\
  ${param.firstname}<br>\n${param.middlename}<br>\n${param.lastname}\n```\n\n**输出：**\n\
  ![](img/image00366.jpeg)\n\n如你所示，包含的页面显示了从主页面传递的参数值。为了在 `file.jsp` 页面上显示参数，我们使用了表达式语言\
  \ `${}`。不过你也可以使用以下使用了 JSP 表达式标签和 request 隐式对象的代码：\n\n```jsp\n<%= request.getParameter(\"\
  firstname\")%>\n<%= request.getParameter(\"middlename\")%>\n<%= request.getParameter(\"\
  lastname\")%>\n```\n\n# JSP forward 动作\n\n`<jsp:forward>` 用于将请求转发到另一个资源。\n\n###\
  \ 语法\n\n```jsp\n<jsp:forward page=\"URL\">\n    <jsp:param ... />\n    <jsp:param\
  \ ... />\n</jsp:forward>\n```\n\n### 示例\n\n**first.jsp**\n```jsp\n<html>\n<head>\n\
  \    <title>JSP forward action</title>\n</head>\n<body>\n    <h1>Demo forward</h1>\n\
  \    <jsp:forward page=\"second.jsp\" />\n</body>\n</html>\n```\n\n**second.jsp**\n\
  ```jsp\n<html>\n<head>\n    <title>Second Page</title>\n</head>\n<body>\n    <h1>This\
  \ is the second page</h1>\n</body>\n</html>\n```\n\n\n\n\n上述代码直接显示了 `display.jsp`\
  \ 页面，该页面显示了从 `index.jsp` 页面传递的参数。\n\n![](img/image00368.jpeg)\n\n## 3. `<jsp:param>`\
  \ Action\n\n此动作用于将参数传递给其他的 JSP 动作标签，例如 `JSP include` 和 `JSP forward` 标签。这样新的 JSP\
  \ 页面就可以 `request` 对象本身访问这些参数。\n\n### 语法\n\n```xml\n<jsp: param name=\"param_name_here\"\
  \ value=\"value_of_parameter_here\" />\n```\n\n现在考虑上述示例——\n\n**first.jsp**\n\n```html\n\
  <<html>\n<head>\n<title>Demo of JSP Param Action Tag</title>\n</head>\n<body>\n\
  <h3>JSP page: 带有跳转的参数演示</h3>\n<jsp:forward page=\"second.jsp\">\n    <jsp:param\
  \ name =\"date\" value=\"20-05-2012\" />\n    <jsp:param name =\"time\" value=\"\
  10:15AM\" />\n    <jsp:param name =\"data\" value=\"ABC\" />\n</jsp:forward>\n</body>\n\
  </html>\n```\n\n在上面的示例中，`first.jsp` 将三个参数（`data`、`time` 和 `data`）传递给 `second.jsp`，`second.jsp`\
  \ 可以使用下面的代码访问这些参数——\n\n```jsp\nDate:<%= request.getParameter(\"date\") %>\nTime:<%=\
  \ request.getParameter(\"time\") %>\nMy Data:<%= request.getParameter(\"data\")\
  \ %>\n```\n\n## 4. `<jsp:useBean>` Action\n\n当你想在 JSP 页面中使用 Beans 时，此动作非常有用，通过此标签你可以轻松地调用一个\
  \ bean。\n\n### 语法\n\n```xml\n<jsp: useBean id=\"unique_name_to_identify_bean\" class=\"\
  package_name.class_name\" />\n```\n\n### `<jsp:useBean>`, `<jsp:setProperty>` &\
  \ `<jsp:getProperty>` 示例：\n\n一旦使用上述语句实例化 Bean 类，你就必须使用 `jsp:setProperty` 和 `jsp:getProperty`\
  \ 动作来使用 bean 的参数。我们将看到这两者。\n\n### jsp:useBean, jsp:setProperty 和 jsp:getProperty\
  \ 动作标签\n\n在这里我们将看到如何通过 `jsp:useBean`、`jsp:setProperty` 和 `jsp:getProperty` 动作标签在\
  \ JSP 中使用 bean 类。\n\n**jsp:useBean 的语法：**\n\n```xml\n<jsp: useBean id=\"unique_name_to_identify_bean\"\
  \ class=\"package_name.class_name\" />\n```\n\n**jsp:setProperty 的语法：**\n\n```xml\n\
  <jsp:setProperty name=\"unique_name_to_identify_bean\" property=\"property_name\"\
  \ />\n```\n\n**jsp:getProperty 的语法：**\n\n```xml\n<jsp:getProperty name=\"unique_name_to_identify_bean\"\
  \ property=\"property_name\" />\n```\n\n### useBean, setProperty 和 getProperty 的完整示例：\n\
  \n1) 我们有一个 bean 类 `Details`，其中包含三个变量 `username`、`age` 和 `password`。为了在 JSP 中使用该\
  \ bean 类及其属性，我们在 `userdetails.jsp` 页面中按如下方式初始化该类：\n\n```xml\n<jsp:useBean id=\"\
  userinfo\" class=\"Javabook.com.Details\"></jsp:useBean>\n```\n\n我们使用了 `useBean`\
  \ 动作来初始化该类。我们的类位于 `Javabook.com` 包中，因此我们提供了全限定类名 `Javabook.com.Details`。\n\n2) 我们使用\
  \ `setProperty` 动作标签映射了 bean 类属性和 JSP 的属性。我们在 `property` 字段中给出了 `*`，以根据名称映射值，因为我们在\
  \ bean 类和 `index.jsp` JSP 页面中使用了相同的属性名。在 `name` 字段中，我们提供了在 `useBean` 标签中定义的唯一标识符。\n\
  \n```xml\n<jsp:setProperty property=\"*\" name=\"userinfo\"/>\n```\n\n3) 为了获取属性值，我们使用了\
  \ `getProperty` 动作标签。\n\n```xml\n<jsp:getProperty property=\"propertyname\" name=\"\
  userinfo\"/>\n```\n\n**Details.java**\n\n```java\npackage javabook.com;\n\npublic\
  \ class Details {\n    public Details() {\n    }\n    private String username;\n\
  \    private int age;\n    private String password;\n\n    public String getUsername()\
  \ {\n        return username;\n    }\n\n    public void setUsername(String username)\
  \ {\n        this.username = username;\n    }\n\n    public int getAge() {\n   \
  \     return age;\n    }\n\n    public void setAge(int age) {\n        this.age\
  \ = age;\n    }\n\n    public String getPassword() {\n        return password;\n\
  \    }\n\n    public void setPassword(String password) {\n        this.password\
  \ = password;\n    }\n}\n```\n\n**index.jsp**\n\n```html\n<html>\n<head><title>useBean,\
  \ getProperty and setProperty example</title></head>\n<form action=\"userdetails.jsp\"\
  \ method=\"post\">\nUser Name: <input type=\"text\" name=\"username\"><br>\nUser\
  \ Password: <input type=\"password\" name=\"password\"><br>\nUser Age: <input type=\"\
  text\" name=\"age\"><br>\n<input type=\"submit\" value=\"register\">\n</form>\n\
  </html>\n```\n\n**userdetails.jsp**\n\n```xml\n<jsp:useBean id=\"userinfo\" class=\"\
  javabook.com.Details\"></jsp:useBean>\n<jsp:setProperty property=\"*\" name=\"userinfo\"\
  />\n```\n\n你输入了以下详细信息：<br>\n\n```jsp\n<jsp:getProperty property=\"username\" name=\"\
  userinfo\"/><br>\n<jsp:getProperty property=\"password\" name=\"userinfo\"/><br>\n\
  <jsp:getProperty property=\"age\" name=\"userinfo\"/>\n```\n\n\n\n\n\n# 方法声明\n\n\
  ```html\n<title>方法声明</title>\n<body>\n <%!\n int sum(int num1, int num2, int num3){\n\
  \ return num1+num2+num3;\n }\n%>\n<%= \"Result is: \" + sum(10,40,50) %>\n</body>\n\
  ```\n\n输出：浏览器上显示所有三个整数的和。\nResult is: 100\n\n# JSP 隐式对象\n\n这些对象是由 JSP 容器在将 JSP 页面转换为\
  \ Servlet 时创建的。这些对象存在于方法内部，因此我们可以直接使用它们而无需进行声明。\n\n这些对象是 JSP 引擎在翻译阶段（将 JSP 转换为 Servlet\
  \ 时）创建的。它们在服务方法内部创建，因此我们可以直接在脚本段中使用它们，而无需初始化和声明。JSP 中总共有 9 个隐式对象可用。\n\n### 隐式对象及其对应的类\n\
  \n| 对象 | 类 |\n| :--- | :--- |\n| `Out` | `javax.servlet.jsp.JspWriter` |\n| `request`\
  \ | `javax.servlet.http.HttpServletRequest` |\n| `Response` | `javax.servlet.http.HttpServletResponse`\
  \ |\n| `Session` | `javax.servlet.http.HttpSession` |\n| `Application` | `javax.servlet.ServletContext`\
  \ |\n| `Exception` | `javax.servlet.jsp.JspException` |\n| `Page` | `java.lang.Object`\
  \ |\n| `pageContext` | `javax.servlet.jsp.PageContext` |\n| `Config` | `javax.servlet.ServletConfig`\
  \ |\n\n注意：从此处返回\n\n## JSP 中的表达式语言 (EL)\n\n# OUT 隐式对象\n\n带有示例的 JSP 中的 OUT 隐式对象\n\
  它是 `javax.servlet.jsp.JspWriter` 的实例。这允许我们访问 Servlet 输出流。需要发送到客户端（浏览器）的输出通过此对象进行传递。简单来说，`out`\
  \ 隐式对象用于向客户端写入内容。\n\n### OUT 隐式对象的方法\n\n1. `void print()`\n2. `void println()`\n\
  3. `void newLine()`\n4. `void clear()`\n5. `void clearBuffer()`\n6. `void flush()`\n\
  7. `boolean isAutoFlush()`\n8. `int getBufferSize()`\n9. `int getRemaining()`\n\n\
  让我们详细查看 `out` 的每个方法 –\n\n1. `Void print()`：此方法写入传递给它的值。例如，下面的语句将在输出屏幕（客户端浏览器）显示\
  \ `Out Implicit Object in jSP - JavaBook` 句子。\n```java\nout.print(\"Out Implicit\
  \ Object in jSP - JavaBook\");\n```\n\n2. `Void println()`：此方法与 `print()` 方法类似，`print`\
  \ 和 `println` 唯一的区别是 `println()` 方法在末尾添加了一个换行符。让我们通过示例来看它们的区别。\n\nPrint:\n```java\n\
  out.print(\"hi\");\nout.print(\" \");\nout.print(\"hello\");\n```\n浏览器上的输出：所有三个\
  \ `out.print` 语句的结果之间不会有换行。\n`hi hello`\n\nprintln:\n```java\nout.println(\"hi\"\
  );\nout.println(\"hello\");\n```\n浏览器上的输出：\nhi\nhello\n\n3. `Void newLine()`：此方法在输出中添加一个换行。示例\
  \ –\n```java\nout.print(\"This will write content without a new line\");\nout.newLine();\n\
  out.print(\"I’m just an another print statement\");\n```\n输出：\nThis will write content\
  \ without a new line\nI’m just an another print statement\n\n如你所知 `print` 语句不会添加换行。我们使用\
  \ `newLine()` 方法在两个 `out.print` 语句之间添加了换行。\n\n4. `Void clear()`：它清空输出缓冲区，甚至不让其缓冲区内容写入客户端。调用方式如下\
  \ –\n```java\nout.clear();\n```\n\n5. `Void clearBuffer()`：此方法与 `clear()` 方法类似。它们唯一的区别是，当对已经刷新的缓冲区调用\
  \ `out.clear()` 时它会抛出异常，但 `out.clearBuffer()` 则不会。\n\n6. `Void flush()`：此方法也像 `clear()`\
  \ 方法一样清空缓冲区，但它强制在刷新之前将内容写入输出流，这意味着缓冲区中的任何内容在清空缓冲区之前都会被到客户端屏幕。\n\n7. `Boolean isAutoFlush()`：它返回一个布尔值\
  \ true/false。它用于检查缓冲区是否自动刷新。\n\n8. `Int getBufferSize()`：此方法返回输出缓冲区的大小（字节为）。\n\n\
  9. `Int getRemaining()`：它返回在达到缓冲区溢出条件之前剩余的字节数。\n\n### OUT 隐式对象示例\n\n在这个示例中，我们使用\
  \ `OUT` 的 `print` 和 `println` 方法向客户端显示一些消息。\n\n**index.jsp**\n```html\n<HTML>\n\
  <HEAD>\n<TITLE> OUT 隐式对象示例 </TITLE>\n</HEAD>\n<BODY>\n<%\nout.print( \"print statement\
  \ \" );\nout.println( \"println\" );\nout.print(\"Another print statement\");\n\
  %>\n</BODY>\n</HTML>\n```\n输出：\nprintstatement println\nAnother print statement\n\
  \n# 带有示例的 JSP 中的 request 隐式对象\n\n### request 隐式对象的方法\n\n1. `GetParameter(String\
  \ name)` – 此方法用于获取参数值。例如，在登录页面获取 `user-id` 和密码，一旦重定向到 JSP 页面，通过它可以获取信息。\n```java\n\
  String Uid= request.getParameter(\"user-id\");\nString Pass= request.getParameter(\"\
  password\");\n```\n\n2. `ParameterNames()` – 它返回请求关联的所有参数名称的枚举。\n```java\nEnumeration\
  \ e= request.getParameterNames();\n```\n\n3. `ParameterValues(String name)` – 它返回参数值的数组。\n\
  ```java\nString[] passwords = request.getParameterValues(\"password\");\n```\n\n\
  4. `GetAttribute(String name)` – 获取属性值。\n```java\nrequest.getAttribute(\"admin\"\
  )\n```\n\n5. `GetAttributeNames()` – 用于获取会话中的属性。它返回会话中的属性名称。\n```java\nEnumerator\
  \ e = request.getAttributeNames();\n```\n\n6. `SetAttribute(String,Object)` – 将对象的值赋予属性。例如，有一个\
  \ `password` 和字符串 `str`，调用 `request.setAttribute(\"password\", str)` 将为属性赋值。\n\n\
  7. `RemoveAttribute(String)` – 使用此方法可以移除属性且无法再次使用。例如，如果在 JSP 页面执行 `request.removeAttribute(\"\
  userid\")`，则该属性将被移除，`request.getAttribute(\"userid\")` 将返回 NULL。\n\n8. `GetCookies()`\
  \ – 它返回从客户端接收的 cookie 对象数组。此方法主要在 JSP 中处理 cookie 时使用。\n\n9. `GetHeader(String name)`\
  \ – 此方法用于获取请求的头部信息。\n\n10. `HeaderNames()` – 返回所有头部名称。下面的代码段将显示与请求关联的所有头部。\n```java\n\
  Enumeration e = request.getHeaderNames();\nwhile (e.hasMoreElements()) {\n String\
  \ str = (String)e.nextElement();\n out.println(str);\n}\n```\n\n11. `RequestURI()`\
  \ – 此方法 (`request.getRequestURI()`) 返回当前 JSP 页面的 URL。\n\n12. `Method()` – 返回 HTTP\
  \ 请求方法。`request.getMethod()`。例如，GET 请求返回 GET，POST 请求返回 POST。\n\n13. `QueryString()`\
  \ – 用于获取与 JSP 页面关联的查询字符串。它是问号 (?) 之后的字符串。\n\n### request 隐式对象示例\n\n在下面的示例中，我们在 index.html\
  \ 页面接收用户输入，并使用 request 隐式对象在 userinfo.jsp 页面显示相同的信息。\n\n**index.html**\n```html\n\
  <html>\n<head>\n<title>输入用户名和密码</title>\n</head>\n<body>\n<form action=\"userinfo.jsp\"\
  >\n输入用户名：<input type=\"text\" name=\"uname\" /> <br><br>\n输入密码：<input type=\"text\"\
  \ name=\"pass\" /> <br><br>\n<input type=\"submit\" value=\"提交详情\"/>\n</form>\n\
  </body>\n</html>\n```\n\n**userinfo.jsp**\n```jsp\n<%@ page import = \" java.util.*\"\
  \ %>\n<html>\n<body>\n<%\nString username=request.getParameter(\"uname\");\n%>\n\
  </body>\n</html>\n```\n\n\n\n\n\n```java\nString password=request.getParameter(\"\
  pass\");\n\nout.print(\"Name: \"+username+\" Password: \"+password);\n\n%>\n\n</body>\n\
  \n</html\n```\n\n### 上述示例快照\n\n一旦运行了上面的 JSP 代码，它将显示出如下界面，包含 `username` 和 `password`\
  \ 两个文本字段。\n\n![](img/image00376.jpeg)\n\n这是 `userinfo.jsp` 页面的输出。在这里，我们获取了用户在登录页面输入的\
  \ `id` 和 `password`。\n\n![](img/image00377.jpeg)\n\n注意：\n\n从此处返回：\n\n带参数的 JSP include\
  \ action 示例\n\n### JSP 中的 Response 隐式对象\nJSP 中的 Response 隐式对象示例\n\n我们将讨论 JSP 中的\
  \ `response` 隐式对象。它是 `javax.servlet.http.HttpServletRequest` 的实例，主要用于修改在处理客户端请求后发送到浏览器的响应。\n\
  \n#### response 隐式对象的方法\n\n1) `void setContentType(String type)`\n2) `void sendRedirect(String\
  \ address)`\n3) `void addHeader(String name, String value)`\n4) `void setHeader(String\
  \ name, String value)`\n5) `boolean containsHeader(String name)`\n6) `void addCookie(Cookie\
  \ value)`\n7) `void sendError(int status_code, String message)`\n8) `boolean isCommitted()`\n\
  9) `void setStatus(int statuscode)`\n\n让我们详细查看每个方法 –\n\n1. `Void setContentType(String\
  \ type)` – 此方法通过设置 MIME 类型和字符编码来告诉浏览器响应数据的类型。此方法设置的信息有助于浏览器解释响应。示例为：\n\n```\nresponse.setContentType(\"\
  text/html\");\nresponse.setContentType(\"image/gif\");\nresponse.setContentType(\"\
  image/png\");\nresponse.setContentType(\"application/pdf\");\n```\n\n2. `Void sendRedirect(String\
  \ address)` – 它将控制权重定向到一个新的 JSP 页面。例如，当浏览器检测到以下语句时，它将从当前 JSP 页面重定向到 `javabook.com`。\n\
  \n```\nresponse.sendRedirect(\"http://javabook.com\");\n```\n\n3. `Void addHeader(String\
  \ name, String value)` – `addHeader` 方法向响应中添加一个头部，基本上它包含一个头部名称和它的值。例如：下面的语句将在响应中包含一个值为\
  \ `javaBook.com` 的名为“Site”头部。\n\n```\nresponse.addHeader(\"Site\", \"JavaBook.com\"\
  );\n```\n\n4. `Void setHeader(String name, String value)` – 它设置头部值。此方法用新值覆盖当前头部的值。假设我正在修改头部“Site”的值。下面的语句将把当前值\
  \ `javaBook.com` 修改为新值 `AA.com`。\n\n```\nresponse.setHeader(\"Site\", \"AA.com\"\
  );\n```\n\n5. `Boolean containsHeader(String name)` – 它返回一个布尔值 true/false。它基本上是检查响应中是否存在该头部。例如：在上面的\
  \ `addHeader` 方法的示例中，我们已向响应中添加了 `Site` 头部，因此下面的语句将返回 true。\n\n```\nresponse.containsHeader(\"\
  Site\");\n```\n\n6. `Void addCookie(Cookie cookie)` – 此方法向响应中添加一个 cookie。下面的语句将向响应中添加\
  \ 2 个 Cookie：`Author` 和 `Siteinfo`。\n\n```\nresponse.addCookie(Cookie Author);\n\
  response.addCookie(Cookie Siteinfo);\n```\n\n7. `Void sendError(int status_code,\
  \ String message)` – 它用于发送带有代码和错误消息的错误响应。例如：\n\n```\nresponse.sendError(404, \"\
  Page not found error\");\n```\n\n8. `Boolean isCommitted()` - 它检查 HTTP 响应是否已发送给客户端，如果是则返回\
  \ true，否则返回 false。\n\n```jsp\n<% if(response.isCommited())\n    {\n        <%--做一些事情\
  \ --%>\n    }else\n    {\n        <%--做其他事情 --%>\n    } %>\n```\n\n9. `Void setStatus(int\
  \ statuscode)` – 此方法用于将 HTTP 状态设置为给定的值。例如：下面的语句将将 HTTP 响应码设置为 404（页面未找到）。\n\n```\n\
  response.setStatus(404);\n```\n\n### Response 隐式对象示例\n\n在下面的示例中，我们从登录页面接收 `id` 和\
  \ `password`，然后将其与硬编码的正确 id/pass 进行匹配。如果凭据正确，登录页面将重定向到成功页面，否则将重定向到登录失败的 JSP 页面。\n\
  \n**index.html**\n```html\n<html>\n<head>\n<title>登录页面</title>\n</head>\n<body>\n\
  <form action=\"checkdetails.jsp\">\nUserId: <input type=\"text\" name=\"id\" />\
  \ <br><br>\nPassword: <input type=\"text\" name=\"pass\" /> <br><br>\n<input type=\"\
  submit\" value=\"Sign In!!\"/>\n</form>\n</body>\n</html>\n```\n\n此 JSP 页面根据硬编码的值验证输入的\
  \ id/pass。\n\n**checkdetails.jsp**\n```html\n<html>\n<head><title>检查凭据</title></head>\n\
  <body>\n<%\nString uid=request.getParameter(\"id\");\nString password=request.getParameter(\"\
  pass\");\nif(uid.equals(\"Chandru\") && password.equals(\"JavaBook\"))\n{\nresponse.sendRedirect(\"\
  success.jsp\");\n}\nelse\n{\nresponse.sendRedirect(\"failed.jsp\");\n}\n%>\n</body>\n\
  </html>\n```\n此 JSP 页面验证输入的 id/pass。\n\n**success.jsp**\n```html\n<html>\n<head><title>成功页面</title></head>\n\
  <body>\n<%\nString data=(String)session.getAttribute(\"uid\");\nout.println(\"Welcome\
  \ \"+data+\"!!\");\n%>\n</body>\n</html>\n```\n此 JSP 页面验证硬编码的值。\n\n**failed.jsp**\n\
  ```html\n<html>\n<head><title>登录失败</title></head>\n<body>\n<%\nString data2=(String)session.getAttribute(\"\
  uid\");\nout.println(\"Hi \"+data2+\". Id are wrong. Please try Again.\");\n%>\n\
  </body>\n</html>\n```\n输出：\n登录页面\n![](img/image0378.jpeg)\n\n成功页面：ID 和密码正确。\n![](img/image0379.jpeg)\n\
  \n带错误的 ID：\n![](img/image0380.jpeg)\n\n登录失败页面：ID 和密码错误。\n![](img/image0381.jpeg)\n\
  \n注意：\n\n返回此处：\n\n表达式\n\n### Session 隐式对象\nJSP 中的 Session 隐式对象示例\n\nSession 是 JSP\
  \ 中最常用的隐式对象。它的主要用途是在会话期间访问所有用户数据。\n\n#### session 隐式对象的方法\n\n1. `setAttribute(String,\
  \ object)` – 此方法通过分配一个唯一字符串将对象保存到会话。之后可以在会话期间从从中获取该对象。`setAttribute` 和 `getAttribute`\
  \ 是处理会话时常用的两个方法。\n2. `getAttribute(String name)` – 使用 `getAttribute` 方法从从中获取对象。例如：如果我们需要在每个\
  \ JSP 页面访问 userId，则应该将 userId 存储在会话。\n3. `removeAttribute(String name)` – 存储在会中的对象可以使用此方法移除。将唯一字符串传递给\
  \ `removeAttribute` 方法。\n4. `getAttributeNames()` – 它返回会中的所有对象。基本上，它产生对象的枚举。\n5.\
  \ `getCreationTime()` – 此方法返回会话创建时间，即会话启动（激活）的时间。\n6. `getId()` – Servlet 容器在创建会话时会分配一个唯一的字符串标识符。`getId`\
  \ 返回该唯一标识符。\n7. `isNew()` – 用于检查会话是否为新会话。它返回布尔值（true 或 false）。主要用于跟踪客户端端是否启用了 Cookie。如果禁用了\
  \ Cookie，`session.isNew()` 方法将始终返回 true。\n8. `invalidate()` – 它会杀死会话并打破会话与所有存储对象的关联。\n\
  9. `getMaxInactiveInterval()` – 返回会话的最大空闲间隔时间（以秒计）。\n10. `getLastAccessedTime()`\
  \ 通常用于获取会话的最后访问时间。\n\n\n\n\n\n下方的 HTML 页面将显示一个文本框和一个提交按钮。提交操作会将控制权转移到 `session.jsp`\
  \ 页面。\n\n### index.html\n```html\n<html>\n<head>\n<title>欢迎页：输入您的姓名</title>\n</head>\n\
  <body>\n<form action=\"session.jsp\">\n<input type=\"text\" name=\"inputname\">\n\
  <input type=\"submit\" value=\"点击这里!!\"><br/>\n</form>\n</body>\n</html>\n```\n\n\
  ``session.jsp` 页面会显示用户在 `index` 页面中输入的名称，并将该变量存储在 `session` 对象中，这样在会话失效之前，可以在任何页面上获取它。\n\
  \n### session.jsp\n```html\n<html>\n<head>\n<title>将输入值传递给会话变量</title>\n</head>\n\
  <body>\n<%\nString uname=request.getParameter(\"inputname\");\nout.print(\"Welcome\
  \ \"+ uname);\nsession.setAttribute(\"sessname\",uname);\n%>\n<a href=\"output.jsp\"\
  >点击此处查看输出页面 </a>\n</body>\n</html>\n```\n\n在这个页面中，我们从 session 对象中获取变量值并将其显示。\n\n\
  ### output.jsp\n```html\n<html>\n<head>\n<title>输出页面：从 session 中获取值</title>\n</head>\n\
  <body>\n<%\nString name=(String)session.getAttribute(\"sessname\");\nout.print(\"\
  Hello User: You have entered the name: \"+name);\n%>\n</body>\n</html>\n```\n\n\
  ### 输出屏幕：\n![](img/image00382.jpeg)\n![](img/image00383.jpeg)\n\n# Application 隐式对象\n\
  ## JSP 中的 Application 隐式对象示例\nApplication 隐式对象是 `javax.servlet.ServletContext` 的实例。它用于获取初始化参数以及在整个\
  \ JSP 中共享属性及其值，这意味着通过 `application` 隐式对象设置的任何属性对所有 JSP 页面都可用。\n\n### 方法：\n- `Object\
  \ getAttribute(String attributeName)`\n- `void setAttribute(String attributeName,\
  \ Object object)`\n- `void removeAttribute(String objectName)`\n- `Enumeration getAttributeNames()`\n\
  - `String getInitParameter(String paramname)`\n- `Enumeration getInitParameterNames()`\n\
  - `String getRealPath(String value)`\n- `void log(String message)`\n- `URL getResource(String\
  \ value)`\n- `InputStream getResourceAsStream(String path)`\n- `String getServerInfo()`\n\
  - `String getMajorVersion()`\n- `String getMinorVersion()`\n\n1. `Object getAttribute(String\
  \ attributeName)`: 它返回存储在给定属性名称中的对象。例如，下面的语句将返回存储在属性 `MyAttr` 中的对象。\n```java\nString\
  \ s = (String)application.getAttribute(\"MyAttr\");\n```\n2. `Void setAttribute(String\
  \ attributeName, Object object)`: 它设置属性的值，换句话说，它在应用上下文中存储一个属性及其值，该值可以在整个 JSP 应用程序中使用。示例——\n\
  ```java\napplication.setAttribute(\"MyAttribute\", \"This is the value of Attribute\"\
  );\n```\n上述语句将存储该属性及其值。如果在任何 JSP 页面中使用下面的语句，`s` 的值将会是什么？\n```java\nString s= (String)\
  \ application.getAttribute(\"MyAttribute\");\n```\n`s` 的值将是 “This is the value of\
  \ Attribute”，因为我们已经使用 `setAttribute` 方法设置了它。\n3. `Void removeAttribute(String objectName)`:\
  \ 此方法用于从应用程序中删除指定的属性。例如——它将从应用程序中删除属性 `MyAttr`。如果我们尝试使用 `getAttribute` 方法获取已删除属性的值，它将返回\
  \ Null。\n```java\napplication.removeAttribute(\"MyAttr\");\n```\n4. `Enumeration\
  \ getAttributeNames()`: 此方法返回存储在 application 隐式对象中的所有属性名称的枚举。\n```java\nEnumeration\
  \ e= application.getAttributeNames();\n```\n5. `String getInitParameter(String paramname)`:\
  \ 它返回给定名称的初始化参数值。示例——web.xml\n```xml\n<web-app>\n<context-param>\n<param-name>parameter1</param-name>\n\
  <param-value>ValueOf1</param-value>\n</context-param>\n</web-app>\n```\n```java\n\
  String s= application.getInitParameter(\"parameter1\");\n```\n`s` 的值将是 “ValueOf1”。\n\
  6. `Enumeration getInitParameterNames()`: 此方法返回所有初始化参数的枚举。\n7. `String getRealPath(String\
  \ value)`: 它将给定路径转换为绝对路径。\n```java\nString abspath = application.getRealPath(\"\
  /index\");\n```\n8. `void log(String message)`: 此方法将给定消息写入错误日志。\n```java\napplication.log(\"\
  This is error message\");\n```\n9. `String getServerInfo()`: 此方法返回 Web 服务器的名称和版本。\n\
  ```java\napplication.getServerInfo();\n```\n\n### Application 隐式对象示例\nJSP 中的 Application\
  \ 隐式对象示例\n使用 application 隐式对象使用 Application 隐式对象。在这个示例中，我们正在统计访问次数。\n\ncounter.jsp\n\
  ```jsp\n<%@ page import=\"java.io.*,java.util.*\" %>\n<html>\n<head>\n<title>Application\
  \ 隐式对象</title>\n</head>\n<body>\n<%\nInteger counter= (Integer)application.getAttribute(\"\
  Visits\");\nif( counter ==null || counter == 0 ){\ncounter = 1;\n}else{\ncounter\
  \ = counter+ 1;\n}\napplication.setAttribute(\"Visits\", counter);\n%>\n<h3>Total\
  \ number of hits this Page is: <%= counter %></h3>\n</body>\n</html>\n```\n输出截图：\n\
  第一次访问次数为 1。\n![](img/image00384.jpeg)\n刷新页面时的访问次数。\n![](img/image00385.jpeg)\n\n\
  # Exception 隐式对象\n## JSP 中的 Exception 隐式对象示例\n在本教程中，我们将讨论 JSP 的 exception 隐式对象。它是\
  \ `java.lang.Throwable` 的实例，经常用于异常处理。该对象仅错误页面可用，这意味着 JSP 页面必须设置 `isErrorPage` 为\
  \ true 才能使用该隐式对象。让我们通过下面的示例来理解——\n\n### Exception 隐式对象示例\nException 隐式对象示例。\n\n\
  index.html\n```html\n<html>\n<head>\n<title>输入两个整数进行除法</title>\n</head>\n<body>\n\
  <form action=\"division.jsp\">\n输入第一个整数:<input type=\"text\" name=\"firstnum\" />\n\
  输入第二个整数:<input type=\"text\" name=\"secondnum\" />\n<input type=\"submit\" value=\"\
  获取结果\"/>\n</form>\n</body>\n</html>\n```\n在这里我们指定 `exception.jsp` 为 `errorPage`，这意味着如果此\
  \ JSP 页面发生任何异常，控制权将立即转移到 `exception.jsp` JSP 页面。\n\ndivision.jsp\n```jsp\n<%@ page\
  \ errorPage=\"exception.jsp\" %>\n<%\nString num1=request.getParameter(\"firstnum\"\
  );\nString num2=request.getParameter(\"secondnum\");\nint v1= Integer.parseInt(num1);\n\
  int v2= Integer.parseInt(num2);\nint res= v1/v2;\nout.print(\"Output is: \"+ res);\n\
  %>\n```\n在下面的 JSP 页面中，我们将 `isErrorPage` 设置为 true，这是 Page 指令的一个属性，用于使页面具备处理异常的能力。由于此页面在\
  \ `division.jsp` 中被定义为异常页面，因此在发生异常的情况下该页面将被调用。在这里我们使用 `exception` 隐式对象向用户显示错误消息。\n\
  \nexception.jsp\n```jsp\n<%@ page isErrorPage=\"true\" %>\n<html>\n<body>\n<h2>发生错误:\
  \ <%= exception %></h2>\n</body>\n</html>\n```\n\n\n\n\n```jsp\n<%@ page isErrorPage=\"\
  true\" %>\n```\n\n发生此异常：`<%= exception %>`\n\n请修正输入数据。\n\n输出：\n\n带有两个整数输入字段的屏幕。\n\
  \n![](img/image00386.jpeg)\n\n当我们提供的第二个整数为零时，显示的算术异常消息。\n\n![](img/image00387.jpeg)\n\
  \n这是在构建 JSP 应用时常用的隐式对象之一。作为替代，你也可以通过 JSP 脚本段中的 try catch catch 在 JSP 中处理异常。\n\n\
  注意：\n\n从此处返回：\n\nJSP 指令\n\n# PageContext 隐式对象\n\n## 带有示例的 JSP PageContext 隐式对象\n\
  \n它是 `javax.servlet.jsp.PageContext` 的实例。使用此对象你可以在以下任何级别查找属性、获取、设置属性和删除属性：\n\n1.\
  \ JSP 页面 – 范围：`PAGE_CONTEXT`\n2. HTTP 请求 – 范围：`REQUEST_CONTEXT`\n3. HTTP Session\
  \ – 范围：`SESSION_CONTEXT`\n4. 应用程序级别 – 范围：`APPLICATION_CONTEXT`\n\n### pageContext\
  \ 隐式对象的方法\n\n1. `Object findAttribute (String AttributeName)`：此方法按照以下顺序在四个级别中搜索指定的属性：Page、Request、Session\
  \ 和 Application。如果在任何级别上都未找到属性，则返回 `NULL`。\n\n2. `Object getAttribute (String AttributeName,\
  \ int Scope)`：它在指定的范围内查找属性。此方法与 `findAttribute` 方法类似；唯一的区别是 `findAttribute` 按顺序查找所有四个级别，而\
  \ `getAttribute` 则在指定的范围内查找。例如 – 在下述语句中，`getAttribute` 方法将在 `Session` 范围（或 Session\
  \ 级别/层）中搜索属性“JavaBook”。如果找到该属性，它将将其赋值给对象 `obj`，否则它将返回 Null。\n\n```java\nObject obj\
  \ = pageContext.getAttribute(\"JavaBook\", PageContext.SESSION_CONTEXT);\n```\n\n\
  同样地，该方法也可以用于其他范围 –\n\n```java\nObject obj = pageContext.getAttribute(\"JavaBook\"\
  , PageContext.REQUEST_CONTEXT);\nObject obj = pageContext.getAttribute(\"JavaBook\"\
  , PageContext.PAGE_CONTEXT);\nObject obj = pageContext.getAttribute(\"JavaBook\"\
  , PageContext.APPLICATION_CONTEXT);\n```\n\n3. `Void removeAttribute(String AttributeName,\
  \ int Scope)`：此方法用于从给定的范围内删除属性。例如 – 下述 JSP 语句将从页面范围删除属性“MyAttr”。\n\n```java\npageContext.removeAttribute(\"\
  MyAttr\", PageContext.PAGE_CONTEXT);\n```\n\n4. `Void setAttribute(String AttributeName,\
  \ Object AttributeValue, int Scope)`：在给定的范围内写入属性。示例 – 下述语句将属性“mydata”及其值“This is\
  \ my data”存储在应用程序范围中。\n\n```java\npageContext.setAttribute(\"mydata\", \"This isis\
  \ my data\", PageContext.APPLICATION_CONTEXT);\n```\n\n同样，这将在 Request 范围内创建一个名为\
  \ `attr1` 的属性，值为“Attr1 value”。\n\n```java\npageContext.setAttribute(\"attr1\", \"\
  Attr1 value\", PageContext.REQUEST_CONTEXT);\n```\n\n## PageContext 隐式对象示例\n\n###\
  \ index.html\n在这里我们只是要求用户输入登录详情。\n\n```html\n<html\n<head>\n<title> 用户登录页面 – 输入详情</title>\n\
  </head>\n<body>\n<form action=\"validation.jsp\">\n输入用户 ID: <input type=\"text\"\
  \ name=\"uid\"><br>\n输入密码: <input type=\"text\" name=\"upass\"><br>\n<input type=\"\
  submit\" value=\"Login\">\n</form>\n</body>\n</html>\n```\n\n### validation.jsp\n\
  在此页面中，我们使用 `pageContext` 隐式对象通过 `session scope` 存储用户的凭据，这意味着只要用户的会话处于激活状态，我们就可以访问这些详情。我们也可以使用其他范围参数（如\
  \ page、application 和 request）存储属性。\n\n```html\n<html\n<head><title> 验证 JSP 页面</title></head>\n\
  <body>\n<%\nString id=request.getParameter(\"uid\");\nString pass=request.getParameter(\"\
  upass\");\nout.println(\"hello \"+id);\npageContext.setAttribute(\"UName\", id,\
  \ PageContext.SESSION_SCOPE);\npageContext.setAttribute(\"UPassword\", pass, PageContext.SESSION_SCOPE);\n\
  %>\n<a href=\"display.jsp\">点击此处查看你输入的内容 </a>\n</body>\n</html>\n```\n\n### display.jsp\n\
  在此 JSP 页面中，我们使用 `getAttribute` 方法获取存储的属性。这里需要注意的是，我们是用 session 范围存储属性的，因此我们必须指定范围为\
  \ session 以获取这些属性的值。\n\n```html\n<html\n<head>\n<title>显示用户详情</title>\n</head>\n\
  <body>\n<%\nString username= (String) pageContext.getAttribute(\"UName\", PageContext.SESSION_SCOPE);\n\
  String userpassword= (String) pageContext.getAttribute(\"UPassword\", PageContext.SESSION_SCOPE);\n\
  out.println(\"Hi \"+username);\nout.println(\"Your Password is: \"+userpassword);\n\
  %>\n</body>\n</html>\n```\n\n### 示例输出截图：\n登录页面，我们从用户那里接收用户 ID 和密码。\n![](img/image00388.jpeg)\n\
  \n带有详情的页面 –\n![](img/image00389.jpeg)\n\n通过 pageContext 传递的用户详情页面。\n![](img/image00390.jpeg)\n\
  \n# Config 隐式对象\n\n## 带有示例的 JSP Config 隐式对象\n它是 `javax.servlet.Config` 的实例。Config\
  \ 对象用于获取特定页面的信息。使用 application 对象可以获取初始化参数。\n\n### Config 隐式对象的方法\n1. `String getInitParameter(String\
  \ paramname)`：我们在 application 对象中讨论过的。\n2. `Enumeration getParameterNames()`：返回初始化参数的枚举。\n\
  3. `ServletContext getServletContext()`：此方法返回 Servlet 上下文。\n4. `String getServletName()`：返回在\
  \ `<servlet-name>` 中定义的名称。\n\n## Config 对象示例\n\n### web.xml\n假设下面是 `web.xml` 文件。我在其中定义\
  \ servlet 名称和映射。稍后我们将使用 `config` 隐式对象从这里获取一些详情。\n\n```xml\n<web-app>\n<servlet>\n\
  <servlet-name>JavaBookServlet</servlet-name>\n<jsp-file>index.jsp</jsp-file>\n</servlet>\n\
  <servlet-mapping>\n<servlet-name>JavaBookServlet</servlet-name>\n<url-pattern>/index</url-pattern>\n\
  </servlet-mapping>\n</web-app>\n```\n\n### index.jsp\n在此 JSP 页面中，我们调用 `config` 对象的\
  \ `getServletName()` 方法从 `web.xml` 文件获取 servlet 名称。\n\n```html\n<html\n<head><title>\
  \ Config 对象</title></head>\n<body>\n<%\nString sname=config.getServletName();\n\
  out.print(\"Servlet Name is: \"+sname);\n%>\n</body>\n</html>\n```\n\n### 输出：\n\
  这是上述 JSP 页面的输出屏幕。\n![](img/image00391.jpeg)\n\n# 表达式语言\n\n## JSP 中的表达式语言\n表达式语言\
  \ (EL) – 我们可以使用表达式语言轻松地访问变量、bean 组件和表达式的数据。必须阅读本教程了解 JSP Java。\n\n表达式语言 (EL) 在 JSP\
  \ 2.0 中引入的。它的主要目的是简化从 bean 属性和隐式对象访问数据。EL 也包含算术、关系和逻辑运算符。\n\n### EL 语法：\n`${expression}`\n\
  \n大括号内的内容将在运行时求值并发送到输出流。\n\n### 示例 1：表达式语言评估表达式\n在本例中，我们通过 EL 的帮助求值表达式。\n\n```html\n\
  <html>\n<head>\n<title>表达式语言示例 1</title>\n</head>\n<body>\n${1<2}\n${1+2+3}\n</body>\n\
  </html>\n```\n\n### 输出：\n![](img/image00392.jpeg)\n\n### 示例 2：使用表达式语言参数变量获取值\n在本例中，我们提示用户输入姓名和学号。在另一个\
  \ JSP 页面中，我们使用 EL 的参数变量获取输入的详情。\n\nindex.jsp\n\n```html\n<html>\n<head>\n```\n\n\
  \n\n\n# 表达式语言示例 2\n\n```html\n<head>\n  <title>表达式语言示例 2</title>\n</head>\n<body>\n\
  \  <form action=\"display.jsp\">\n    学生姓名: <input type=\"text\" name=\"stuname\"\
  \ /><br>\n    学生学号:<input type=\"text\" name=\"rollno\" /><br>\n    <input type=\"\
  submit\" value=\"提交详情!!\"/>\n  </form>\n</body>\n</html>\n```\n\n### display.jsp\n\
  \n```html\n<html>\n<head>\n  <title>显示页面</title>\n</head>\n<body>\n  学生姓名是 ${ param.stuname\
  \ } <br>\n  学生学号是 ${ param.rollno }\n</body>\n</html>\n```\n\n**输出：**\n![](img/image00393.jpeg)\n\
  ![](img/image00394.jpeg)\n\n## 示例 3: 从应用对象获取值。\n\n在这个示例中，我们使用 `application` 隐式对象设置了属性，并在显示页面上，我们使用表达式语言的\
  \ `applicationScope` 获取了这些属性。\n\n### index.jsp\n\n```html\n<html>\n<head>\n  <title>EL\
  \ 示例 3</title>\n</head>\n<body>\n<%\n  application.setAttribute(\"author\", \"Chandu\"\
  );\n  application.setAttribute(\"Site\", \"JavaBook.com\");\n%>\n  <a href=\"display.jsp\"\
  >点击</a>\n</body>\n</html>\n```\n\n### display.jsp\n\n```html\n<html>\n<head>\n \
  \ <title>显示页面</title>\n</head>\n<body>\n  ${applicationScope.author}<br>\n  ${applicationScope.Site}\n\
  </body>\n</html>\n```\n\n**输出：**\n![](img/image00395.jpeg)\n![](img/image00396.jpeg)\n\
  \n## EL 预定义变量：\n\n与 JSP 中的隐式对象类似，我们在 EL 中也有一些预定义的变量。在上面的示例中，我们使用了 `param` 和 `applicationScope`，它们也是这些变量的一部分。\n\
  \n*   **PageScope**: 帮助获取存储在 `Page` 作用域中的属性。\n*   **PageContext**: 等同于 JSP 的 `PageContext`\
  \ 对象。\n*   **SessionScope**: 从 `session` 对象设置的会话作用域获取属性。\n*   **RequestScope**:\
  \ 用于从请求作用域获取属性。即由 `request` 隐式对象设置的属性。\n*   **Param**: 类似于 `ServletRequest.getParameter`。参考示例\
  \ 2。\n*   **ApplicationScope**: 用于获取应用级别的属性。与示例 3 中的相同。\n*   **Header**: 帮助以字符串形式获取\
  \ HTTP 请求头。\n*   **HeaderValues**: 用于获取所有的 HTTP 请求头。\n*   **InitParam**: 链接到上下文的初始化参数。\n\
  *   **ParamValues**: 等同于 `ServletRequest.getParameterValues`。\n*   **Cookie**: 映射到\
  \ `Cookie` 对象。\n\n**注意：**\n回到此处：\n*   带参数的 JSP include action 示例\n*   JSTL\n\n###\
  \ 异常处理\n\n### 异常处理\n\nJSP 中的异常处理 – 一一个学习 JSP 异常处理的完整教程。我们分享了两种处理异常的方法。\n\n在学习 JSP\
  \ 异常处理之前，让我们先理解什么是异常，以及它与错误有什么区别。\n\n*   **异常 (Exception)**：这些无非中断正常执行流的异常状况。它们通常是因为用户输入了错误的数据。为了给用户提供有意义的信息，必须处理异常，以便用户能够理解问题并采取适当的行动。\n\
  *   **错误 (Error)**：这可能是代码问题或系统相关的问题。我们不应该处理错误，因为它们本该是被修复的。\n\n#### 处理异常的方法：\n\n\
  我们可以使用以下两种方法处理异常：\n1. 使用 `exception` 隐式对象进行异常处理\n2. 在脚本段（scriptlets）中使用 try-catch\
  \ 块进行异常处理\n\n### 使用 exception 隐式对象的异常处理\n\n在下面的示例中 – 我们使用 `Page` 指令的 `errorPage`\
  \ 属性指定了处理页面。如果主 JSP 页面发生任何异常，控制将转移到 `errorPage` 属性指定的页面。\n\n处理页面必须将 `isErrorPage`\
  \ 设置为 `true` 才能使用 `exception` 隐式对象。这就是为什么我们为 `errorpage.jsp` 设置了 `isErrorPage` 为\
  \ `true`。\n\n**index.jsp**\n```jsp\n<%@ page errorPage=\"errorpage.jsp\" %>\n<html>\n\
  <head>\n  <title>JSP 异常处理示例</title>\n</head>\n<body>\n<%\n  // 声明并初始化两个整数\n  int\
  \ num1 = 122;\n  int num2 = 0;\n  // 应该抛出算术异常 (Arithmetic Exception)\n  int div\
  \ = num1/num2;\n%>\n</body>\n</html>\n```\n\n**errorpage.jsp**\n```jsp\n<%@ page\
  \ isErrorPage=\"true\" %>\n<html>\n<head>\n  <title>在此处显示异常消息</title>\n</head>\n\
  <body>\n  <h2>errorpage.jsp</h2>\n  <i>在 index.jsp 页面发生了异常。请修复错误。以下是错误消息：</i>\n\
  \  <b><%= exception %></b>\n</body>\n</html>\n```\n\n**输出：**\n![](img/image0397.jpeg\
  \ (此处为示例输出))\n\n### 在脚本段（scriptlets）中使用 try-catch 块的异常处理\n\n在下面的示例中 – 我们使用 try-catch\
  \ 块处理了异常。我们在下面的示例中放置了 try-catch 块。\n\n**error.jsp**\n```jsp\n<html>\n<head>\n  <title>使用\
  \ catch 块处理异常</title>\n</head>\n<body>\n<%\n  try {\n    int arr[] = {1, 2, 3, 4,\
  \ 5};\n    int num = arr[6];\n  } catch (Exception exp) {\n    out.println(\"这里是异常:\
  \ \" + exp);\n  }\n%>\n</body>\n</html>\n```\n**输出：**\n![](img/image0398.jpeg)\n\
  \n# 自定义标签 (CUSTOM TAGS)\n\n用户定义的标签被称为自定义标签。在本教程中我们将学习如何创建它们。创建自定义标签需要三部分：\n1. **标签处理器类\
  \ (Tag handler class)**：在该类中我们指定标签的作用。\n2. **TLD 文件**：指定标签属性的标签描述符。\n3. **JSP 页面**：使用标签的\
  \ JSP 页面。\n\n### 标签处理器类\n\n标签处理器类应该实现 `Tag` 接口，也可以继承 `SimpleTagSupport`。\n\n**Details.java**\n\
  ```java\npackage javabook.com;\nimport javax.servlet.jsp.tagext.*;\nimport javax.servlet.jsp.*;\n\
  import java.io.*;\n\npublic class Details extends SimpleTagSupport {\n    public\
  \ void doTag() throws JspException, IOException {\n        JspWriter out = getJspContext().getOut();\n\
  \        out.println(\"这是我的标签\");\n    }\n}\n```\n\n### TLD 文件\n\n该文件应该位于：`项目名称/WebContent/WEB-INF/`，并且以\
  \ `.tld` 扩展。\n\n**注意：**\n- `<name>`：自定义标签名称。在示例中我们命名为 `MyMsg`。\n- `<tag-class>`：全类名。我们的标签处理器类\
  \ `Details.java` 在 `javabook.com` 包中，因此我们将其设为 `javabook.com.Details`。\n\n**message.tld**\n\
  ```xml\n<taglib>\n  <tlib-version>1.0</tlib-version>\n  <jsp-version>2.0</jsp-version>\n\
  \  <short-name>My Custom Tag</short-name>\n  <tag>\n    <name>MyMsg</name>\n   \
  \ <tag-class>javabook.com.Details</tag-class>\n    <body-content>empty</body-content>\n\
  \  </tag>\n</taglib>\n```\n\n### 在 JSP 中使用自定义标签\n\n上面我们创建了一个名为 `MyMsg` 的自定义标签。在这里我们将使用它。\n\
  \n**注意：** `taglib` 指令应在 `uri` 字段中包含 TLD 文件的路径。上面我们创建了 `message.tld` 文件，因此我们提供了该文件的路径。选择任何前缀并在\
  \ `taglib` 指令的 `prefix` 字段中指定它。在这里我们指定为 `myprefix`。\n\n\n\n\n自定义标签的调用方式如下：`<prefix:tagName/>`。我们的前缀是\
  \ `myprefix`，标签名为 `MyMsg`，因此在下面的 JSP 页面中我们将其为 `<myprefix:MyMsg/>`。\n\n```jsp\n<%@\
  \ taglib prefix=\"myprefix\" uri=\"WEB-INF/message.tld\"%>\n<html>\n<head>\n <title>JSP\
  \ 自定义标签示例</title>\n</head>\n<body>\n <myprefix:MyMsg/>\n</body>\n</html>\n```\n\
  输出：\n`This is my own custom tag`\n\n### 如何访问自定义标签的主体（Body）\n\n在本教程中，我们将学习如何访问自定义标签的主体。例如，如果我们的自定义标签是\
  \ `xyz`，那么我们将学习访问 `<prefix: xyz>` 和 `</prefix:xyz>` 之间的内容。\n\n```jsp\n<prefix: xyz>\n\
  Body of custom tag: This is what we will access in the below example\n</prefix:xyz>\n\
  ```\n\n## 示例：\n在这个示例中，自定义标签将向其正正体追加一个 `String` 并显示结果。\n\n标签处理器类：`Details.java`\n\
  \n```java\npackage javabook.com;\n\nimport javax.servlet.jsp.tagext.*;\nimport javax.servlet.jsp.*;\n\
  import java.io.*;\n\npublic class Details extends SimpleTagSupport {\n    //StringWriter\
  \ object\n    StringWriter sw = new StringWriter();\n\n    public void doTag() throws\
  \ JspException, IOException {\n        getJspBody().invoke(sw);\n        JspWriter\
  \ out = getJspContext().getOut();\n        out.println(sw.toString()+\"Appended\
  \ Custom Tag Message\");\n    }\n}\n```\n\nTLD 文件：`message.tld`\n记得将此文件放在 `WEB-INF`\
  \ 文件夹中。\n\n```xml\n<taglib>\n<tlib-version>1.0</tlib-version>\n<jsp-version>2.0</jsp-version>\n\
  <short-name>My Custom Tag: MyMsg</short-name>\n<tag>\n<name>MyMsg</name>\n<tag-class>javabook.com.Details</tag-class>\n\
  <body-content>scriptless</body-content>\n</tag>\n</taglib>\n```\n\nJSP 页面：`index.jsp`\n\
  \n```jsp\n<%@ taglib prefix=\"myprefix\" uri=\"WEB-INF/message.tld\"%>\n<html>\n\
  <head>\n <title>访问自定义标签主体的示例</title>\n</head>\n<body>\n <myprefix:MyMsg>\n Test\
  \ String\n </myprefix:MyMsg>\n</body>\n</html>\n```\n输出：\n`Test String Appended\
  \ Custom Tag Message`\n\n---\n\n# JSP 指令 (DIRECTIVES)\n\n## JSP 指令\nJSP 指令 – 页面和\
  \ TagLib\n指令控制整个 JSP 页面的处理。它为服务器提供了关于页面处理的指导方向。\n\n**指令的语法：**\n`<%@ directive name\
  \ [attribute name=“value” attribute name=“value” ........]%>`\n\nJSP 中有三种指令：\n1.\
  \ `Page 指令` (Page Directive)\n2. `Include 指令` (Include Directive)\n3. `TagLib 指令`\
  \ (TagLib Directive)\n\n### 1) Page 指令\n有几个属性与 `Page 指令` 一起使用，这些是：\n1. `import`\n\
  2. `session`\n3. `isErrorPage`\n4. `errorPage`\n5. `ContentType`\n6. `isThreadSafe`\n\
  7. `extends`\n8. `info`\n9. `language`\n10. `autofflush`\n11. `buffer`\n\n#### 1.\
  \ Import:\n此属性用于导入包。在编码时，你可能需要包含多个包，在这种情况下，此页面指令属性非常有用，因为它允许你在同一处列出多个包，并用逗号（`,`）隔开。或者，你也可以拥有多个\
  \ `page` 元素实例，每个实例对应不同的包。\n\n**import 属性的语法：**\n`<%@page import=\"value\"%>`\n此处\
  \ `value` 是包名。\n\n**import 示例：** 下面是一个关于如何如何使用 `page` 指令的 `import` 属性导入多个包的示例。\n\
  \n```jsp\n<%@page import=\"java.io.*%>\n<%@page import=\"java.lang.*%>\n<%-- 注释：或者下述语句：两者等同\
  \ --%>\n<%@page import=\"java.io.*, java.lang.*\"%>\n```\n\n#### 2. Session:\n通常在构建用户交互式\
  \ JSP 应用时，我们确保允许用户在会话（session）活动期间获取其个人数据。考虑登录银行账户的示例，我们可以在注销（或会话过期）之前访问你的所有数据。为了保持页面的会话，`session`\
  \ 属性应设为 `true`。\n\n此属性用于处理 JSP 页面的 HTTP 会话。它有两个取值：`true` 或 `false`。`session` 属性的默认值为\
  \ `true`，这意味着如果你没有提到此属性，服务器可能会认为该页面需要 HTTP 会话。\n\n**该属性的默认值：** `true`\n\n**语法：**\n\
  `<%@ page session=\"value\"%>`\n此处 `value` 是 `true` 或者是 `false`。\n\n**session 示例：**\n\
  ```jsp\n<%@ page session=\"true\"%>\n```\n上述代码将允许页面拥有 session 隐式对象。\n\n```jsp\n\
  <%@ page session=\"false\"%>\n```\n如果在 JSP 页面中指定了此代码，意味着该页面将无法使用 session 对象。因此，该页面无法维护会话。\n\
  \n#### 3. isErrorPage:\n此属性用于指定当前 JSP 页面是否可以作为错误页。如果 `isErrorPage` 为 `true`，则可以使用。\n\
  \n#### 4. errorPage:\n如上所述，它指定发生异常时的 JSP 页面 URL。\n\n**语法：**\n`<%@ page errorPage=\"\
  value\"%>`\n此处 `value` 是页面名。\n\n**errorPage 示例：**\n```jsp\n<%@ page errorPage=\"\
  ExceptionHandling.jsp\"%>\n```\n\n#### 5. ContentType:\n此属性用于设置 JSP 页面的内容类型。\n默认值：`text/html`\n\
  \n**语法：**\n`<%@ page contentType=\"value\"%>`\n此处 `value` 可以任意，如 `text/html`、`text/xml`。\n\
  \n**contentType 示例：**\n```jsp\n<%@ page contentType=\"text/html\"%>\n<%@ page contentType=\"\
  text/xml\"%>\n```\n\n#### 6. isThreadSafe:\n让我们通过示例来理解。假设你创建了一个 JSP 并将 `isThreadSafe`\
  \ 设置为 `true`，这意味着该 JSP 页面支持多线程（多个线程可以执行该页面）。另一方面，如果设置为 `false`，则 JSP 不允许多线程，这意味着只有一个线程将执行页面代码。\n\
  \n**isThreadSafe 属性的默认值：** `true`\n\n**语法：**\n`<%@ page isThreadSafe=\"value\"%>`\n\
  \n**isThreadSafe 示例：**\n```jsp\n<%@ page isThreadSafe=\"false\"%>\n```\n\n#### 7.\
  \ Buffer:\n此属性用于指定指定缓冲区大小。如果在编码期间将其指定为 `none`，则输出将由 `JspWriter` 直接写入 `Response`\
  \ 对象。而如果你指定了缓冲区大小，则输出首先写入缓冲区，然后供响应对象使用。\n\n**语法：**\n`<%@ page buffer=\"value\"%>`\n\
  `value` 的单位是 `kb` 或 `none`。\n\n**buffer 示例：**\n```jsp\n<%@ page buffer=\"none\"\
  %>\n<%@ page buffer=\"5kb\"%>\n```\n\n#### 8. Extends:\n类似于 `java`，此处此属性也用于扩展（继承）类。\n\
  \n**语法：**\n`<%@ page extends=\"value\"%>`\n`value` 是 `package_name.class_name`。\n\
  \n**extends 示例：**\n```jsp\n<%@ page extends=\"mypackage.SampleClass\"%>\n```\n\n\
  #### 9. Info:\n它为 JSP 页面提供描述。当我们调用 `getServletInfo()` 方法时，在 `info` 中指定的字符串将返回。\n\
  \n**语法：**\n`<%@ page info=\"value\"%>`\n此处 `value` 是消息或描述。\n\n\n\n\n\n<%@ page info=\"\
  此代码由 Chandru Prasad 提供\"%>\n\n## 10. language\n\n它指定了页面中使用的脚本语言（底层语言）。\n\n### language\
  \ 的语法：\n```jsp\n<%@ page language=\"value\"%>\n```\n`value` 在这里表示脚本语言。\n\n### language\
  \ 属性示例：\n```jsp\n<%@ page language=\"java\"%>\n```\n\n## 11. AutoFlush\n\n如果为 `true`，则意味着当缓冲区满时应该自动刷新。`false`\
  \ 则会在缓冲区溢出时抛出异常。\n\n**默认值：** `True`\n\n### autoFlush 的语法：\n```jsp\n<%@ page autoFlush=\"\
  value\"%>\n```\n`value` 可以是 `true` 或 `false`。\n\n### autoFlush 属性示例：\n缓冲区满时将自动刷新——\n\
  ```jsp\n<%@ page autoFlush=\"true\"%>\n```\n当缓冲区因溢出条件而满时将抛出异常\n```jsp\n<%@ page\
  \ autoFlush=\"true\"%>\n```\n\n## 12. isScriptingEnabled\n\n该属性已弃用且不再使用。\n\n## 13.\
  \ isELIgnored\n\n此属性指定表达式是否会被求值。\n\n**默认值：** `true`\n\n### isELIgnored 的语法：\n```jsp\n\
  <%@ page isELIgnored=\"value\"%>\n```\n`value` 可以是 `true` 或 `false`。\n\n### isELIgnored\
  \ 属性示例：\nJSP 页面中的任何表达式都不会被求值——\n```jsp\n<%@ page isELIgnored=\"false\"%>\n```\n\
  表达式将被求值（`true` 是默认值，因此无需指定）——\n```jsp\n<%@ page isELIgnored=\"true\"%>\n```\n\n\
  ## 2) 包含指令 (Include Directive)\n\n包含指令用于将一个 JSP 页面的内容复制到另一个页面。它就像将一个文件的代码包含到另一个文件中。\n\
  \n### 语法：\n```jsp\n<%@include file =\"value\"%>\n```\n这里的 `value` 是需要包含的 JSP 文件名。如果文件在相同目录下，只需指定文件名；否则，需要在\
  \ `value` 字段中注明完整的 URL（或路径 `path`）。\n\n**注意：** 它可以用于页面的任何地方。\n\n## 示例：\n```jsp\n\
  <%@include file=\"myJSP.jsp\"%>\n```\n你可以在你的 JSP 页面中使用上述代码来复制 `myJSP.jsp` 文件的内容。但在这种情况下，两个\
  \ JSP 文件必须位于相同的目录下。如果 `myJSP.jsp` 在不同的目录下，则需要在上述代码中指定完整路径，而不是是文件名。\n\n### 必读：[JSP\
  \ 中的包含指令详解](http://example.com) (占位链接)\n\n## JSP 中的包含指令详解\n\n包含指令用于在翻译阶段将外部文件合并到当前\
  \ JSP 页面（即 JSP 转换为相应的 Servlet 的阶段）。\n\n### 为什么我们需要使用包含指令？难道不能直接将文件内容添加到当前 JSP 中，而是使用指令吗？\n\
  \n我们可以复制外部文件的内容并粘贴到主 JSP 中，但这不是良好的做法。让我们通过一个例子来理解这一点——我有 100 个外部文件和 1 个主 JSP 文件。如果我只是将所有文件的内容复制到主\
  \ JSP 中，那么当任何外部文件发生变化时我都必须编辑它；相反，我们可以使用指令包含所有文件，并在需要时编辑特定的文件。\n\n此外，通过使用包含指令，你可以增强代码的可用性——假设某些代码或数据需要在你应用程序中所有的\
  \ JSP 页面中存在，那么你只需要将该代码/数据放在一个文件中并在所有的 JSP 页面中包含该文件。\n\n上述两个原因可以被认为是使用包含指令的优势。\n\n\
  ### 语法：\n这是 JSP 中包含指令的语法。\n```jsp\n<%@ include file=\"文件的 URL\" %>\n```\n我们必须指定相对\
  \ URL——\n如果文件位于当前 JSP 页面所在的文件夹中，我们可以直接提及文件名，否则需要指定指向文件的相对路径。\n\n### 包含指令示例\n\n**index.jsp**\n\
  ```jsp\n<html>\n<head>\n<title>主 JSP 页面</title>\n</head>\n<body>\n<%@ include file=\"\
  file1.jsp\" %>\n主 JSP Page：两个包含指令之间的内容。\n<%@ include file=\"file2.jsp\" %>\n</body>\n\
  </html>\n```\n\n**file1.jsp**\n```jsp\n<p  align=\"center\">\n这是我的 File1.jsp，我将使用包含指令将其包含在\
  \ index.jsp 中\n</p>\n```\n\n**file2.jsp**\n```jsp\n<p  align=\"center\">\n这是 File2.jsp\n\
  </p>\n```\n\n**输出：** 运行上述代码时的输出将如下。如你所见，我们通过包含指令在我们的主 JSP 页面中包含了 `file1` 和 `file2`\
  \ 的内容。\n\n![Include-Directive-example-output](img/image0039.jpeg)\n\n## 3) Taglib\
  \ 直接 (Taglib Directive)\n\n该指令基本上允许用户在 JSP 中使用自定义标签（Custom tags）。我们将在后面的 JSP 教程中详细讨论自定义标签。Taglib\
  \ 指令帮助你在 JSP 页面中声明自定义标签。\n\n### 语法：\n```jsp\n<%@taglib uri =\"taglibURI\" prefix=\"\
  tag prefix\"%>\n```\n其中 `URI` 是统一资源定位符，用于标识自定义标签的位置，`tag prefix` 是一个字符串，用于标识由 `uri`\
  \ 确定位置的自定义标签。\n\n### 语法：\n```jsp\n<%@taglib uri =\"taglibURI\" prefix=\"tag prefix\"\
  %>\n```\n其中 `URI` 是统一资源定位符，用于标识自定义标签的位置，`tag prefix` 是一个字符串，用于标识由 `uri` 确定位置的自定义标签。\n\
  \n## 示例：\n```jsp\n```\n### Taglib 示例：\n```jsp\n<%@taglib uri=\"http://sample.com/customlib\"\
  \ prefix=\"tagag\" %>\n<html>\n<body>\n<tagag:welcome/>\n</body>\n</html>\n```\n\
  如你所见，`uri` 是自定义标签的位置。**注意：** 在上述示例中，`tagag` 是自定义前缀。\n\n---\n\n## JSTL\n\n### JSTL\
  \ 核心标签库\n\nJSTL 代表 JSP 标准标签库（JSP Standard Tag Library），它是一组非常有用的标签。这些标签帮助你高效地编写\
  \ JSP。\n\n### JSTL 核心标签\n\n以下是 JSTL 标签。为了使用 JSTL 标签，必须存在以下行：\n```jsp\n<%@ taglib\
  \ prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n```\n\n### <c:out>\
  \ 标签\n\n`<c:out>` 是 JSTL 核心标签，用于在客户端显示内容。你可能会疑惑既然可以使用表达式语言（EL）显示变量和数据，为什么还需要 `<c:out>`？区别在于\
  \ `<c:out>` 标签会转义 XML 标记，而其他不会。\n\n### <c:out> 标签示例\n\n在此示例中，我们在浏览器上显示字符串，但我们使用了\
  \ HTML 标签并想查看结果。\n```jsp\n<%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ %>\n<html>\n<head>\n<title>c:out 示例</title>\n</head>\n<body>\n<c:out value='<b>这是一个\
  \ <c:out> 示例</b>' />\n</body>\n</html>\n```\n**输出：**\n<b>这是一个 <c:out> 示例</b>\n\n\
  ### <c:out> 的 escapeXml 属性\n\n假设我们将上述代码修改为如下所示——我在标签中添加了 `escapeXml` 属性并将其标记为 `false`。`escapeXml`\
  \ 属性的默认值为 `true`。由于我们将其标记为 `false`，它将不会转义 HTML/XML 标记，标记将生效。\n```jsp\n<c:out value='<b>这是一个\
  \ <c:out> 示例</b>' } escapeXml=\"false\"/>\n```\n**输出：**\n![](img/image400.jpeg)\n\
  \n### <c:out> 的 default 属性\n\n上面我们看到了 `<c:out>` 标签的 `escapeXml` 属性。该标签还有一个属性 `default`，用于当\
  \ `<c:out>` 标签值为 `null` 时显示回退或默认值。这里有一个示例，我们尝试使用标签打印字符串 `str` 的值，由于字符串 `str` 的值为\
  \ `null`，标签将打印设置在 `default` 属性中的值。\n```jsp\n<%! String str = null; %>\n<c:out value=\"\
  ${str}\" default=\"c:out 的默认值\"/>\n```\n![](img/image401.jpeg)\n\n### <c:set> 标签\n\
  \n`<c:set>` 标签常用于在指定的作用范围内设置变量值。它基本上评估表达式并将结果设置给变量。\n\n# JSTL <c:set> 核心标签\n\n`<c:set>`\
  \ 核心 JSTL 标签用于在指定的作用范围内为对象或变量赋值。让我们通过一个例子来理解这一点。\n\n\n\n\n\n在这里，我将一个字符串值赋值给应用程序范围内的一个变量名（这将允许我在应用程序中的任何\
  \ JSP 页面中访问我的变量）。在另一个页面（`display.jsp`）上，我使用 `<c:out>` 标签和 EL.(表达式语言) 在浏览器上打印了该值。\n\
  \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
  <html>\n<head>\n<title>Example of c:set tag</title>\n</head>\n<body>\n<c:set  var=\"\
  name\"  scope=\"application\"  value=\"Chandru Pratap Prasad\"/>\n<a  href=\"display.jsp\"\
  >Display</a>\n</body>\n</html>\n```\n\n### display.jsp\n\n```jsp\n<%@ taglib uri=\"\
  http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<c:out  value=\"${name}\"/>\n\
  ```\n\n### 输出:\n下面是上述示例输出的截图。\n\n![](img/image00402.jpeg)\n![](img/image00403.jpeg)\n\
  \n### `<c:set>` 标签属性\n\n1. **Value**: 它可以是一个硬编码的值或表达式。例如，下面是 `<c:set>` 标签允许的变体——\n\
  变量 `myvar` 的值将存储在对象 `name` 中。\n```jsp\n<c:set  var=\"name\"  scope=\"application\"\
  \  value=\"${myvar}\"/>\n```\n表达式的结果将存储在对象中。\n```jsp\n<c:set  var=\"sum\"  scope=\"\
  application\"  value=\"${1+3+6}\"/>\n```\n\n2. **Var**: 它保存变量/对象的名称。\n\n3. **Scope**:\
  \ 可以 `request`、`session`、`page` 和 `application`。在上面的示例中，我们指定了范围为 `application`，但它可以是上述四种中的任何一种。这完全取决于需求。\n\
  \n4. **`<c:remove>` 标签**: 用于从指定的范围或所有范围（page, request, session 和 application）中移除属性。默认从所有范围移除。\n\
  \n# JSTL `<c:remove>` 核心标签\n\n`<c:remove>` 标签用于从指定的范围或所有范围（page, request, session\
  \ 和 application）中移除属性。\n\n### 示例:\n在下面的示例中，我首先使用 `<c:set>` 标签设置两个变量，然后使用 `<c:remove>`\
  \ 标签移除了其中一个。正如你在输出截图所示——当我尝试显示两个变量时，对于第二个属性，页面没有获得值，并使用 `<c:out>` 标签的默认属性打印了默认值。\n\
  \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
  <html>\n<head>\n<title>Example of c:remove tag</title>\n</head>\n<body>\n<c:set\
  \  var=\"Site\"  scope=\"session\"  value=\"JavaBook.com\"/>\n<c:set  var=\"author\"\
  \  scope=\"session\"  value=\"Chandru\"/>\n<c:remove  var=\"author\"/>\n<a  href=\"\
  display.jsp\">check attributes</a>\n</body>\n</html>\n```\n\n### display.jsp\n\n\
  ```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<c:out\
  \  value=\"${Site}\"/><br>\n<c:out  value=\"${author}\"  default=\"Attribute has\
  \ no value\"/>\n```\n![](img/image00404.jpeg)\n![](img/image00405.jpeg)\n\n### `<c:remove>`\
  \ 标签的 Scope 属性\n\n上面我们代码如下：\n```jsp\n<c:remove  var=\"author\"/>\n```\n上述代码从所有范围（page,\
  \ session, application, request）移除属性。为了指定，我们必须在 `<c:remove>` 标签内部指定 `scope` 属性，就像我下面做的那样——下面的\
  \ JSTL 语句将从 session 范围移除变量 `var`。\n```jsp\n<c:remove  var=\"author\"  scope=\"session\"\
  />\n```\n\n5. **`<c:if>` 标签**: 这个 JSTL 核心标签用于测试条件。该标签还有两个可选属性 `var` 和 `scope`，`test`\
  \ 是强制性的。\n\n# JSTL `<c:if>` 核心标签\n\n`<c:if>` 是一个 JSTL 核心标签，用于测试条件。它类似于 Java 中的 `if`\
  \ 语句，评估一个条件并在结果为真时执行一个代码块。\n\n### 语法:\n这是 `<c:if>` 核心标签的基本语法。如果 `test=\"true\"`，则封装在\
  \ `<c:if>` 标签内的语句将被执行。为了使用此标签，我们通常使用表达式语言来评估关系表达式。我们使用 EL 是因为它在评估条件后会返回布尔值（true/false），而我们的\
  \ `test` 属性需要这个布尔值。\n\n```jsp\n<c:if  test=\"${condition}\">\n...\n..\n</c:if>\n\
  ```\n\n### `<c:if>` 标签示例\n在这个示例中，我们使用 `<c:set>` 标签定义了 `age` 变量，然后使用 `<c:if>` 标签检查投票资格。\n\
  \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
  <html>\n<head>\n<title>JSTL c:if Tag</title>\n</head>\n<body>\n<c:set  var=\"age\"\
  \  value=\"26\"/>\n<c:if  test=\"${age >= 18}\">\n<c:out value=\"You are eligible\
  \ for voting!\"/>\n</c:if>\n<c:if  test=\"${age < 18}\">\n<c:out value=\"You are\
  \ not eligible for voting!\"/>\n</c:if>\n</body>\n</html>\n```\n输出:\n![](img/image0046.jpeg)\
  \ （注：此处原文编号略有重复，已按逻辑翻译）\n\n### `<c:remove>` 的 Scope 属性\n上面我们代码如下：\n```jsp\n<c:remove\
  \  var=\"author\"/>\n```\n上述代码从所有范围（page, session, application, request）移除属性。为了指定，我们必须在\
  \ `<c:remove>` 标签内指定 `scope` 属性，就像我下面做的那样——下面的 JSTL 语句将从 session 范围移除变量。\n```jsp\n\
  <c:remove  var=\"author\"  scope=\"session\"/>\n```\n4. **`<c:if>` 标签**: 这个 JSTL\
  \ 核心标签用于测试条件。该标签还有两个可选属性 `var` 和 `scope`，`test` 是强制性的。\n\n5. **`<c:choose>` 标签**:\
  \ 这个 JSTL 核心标签用于测试多个条件。它类似于 Java 中的 `switch-else-if` 语句。\n\n# JSTL `<c:choose>`,\
  \ `<c:when>`, `<c:otherwise>` 核心标签\n`<c:choose>`, `<c:when>`, `<c:otherwise>` 一起使用，类似于\
  \ Java 中的 `switch-else-if`。\n\n### `<c:choose>`, `<c:when>`, `<c:otherwise>`\n在这里我们讨论\
  \ `<c:choose>` 类似于 `switch`，`<c:when>` 类似于 `case`，可以在 `<c:choose>` 中使用多次。`<c:otherwise>`\
  \ 类似于 `default`，当所有 `<c:when>` 语句为假时执行。\n\n语法：\n```xml\n<c:choose>\n  <c:when test=\"\
  ${condition1}\">\n    // 如果 condition1 为真，则执行某些操作\n  </c:when>\n  <c:when test=\"\
  ${condition2}\">\n    // 如果 condition2 为真，则执行某些操作\n  </c:when>\n  <c:otherwise>\n\
  \    // 如果所有条件都为假，则执行某些操作\n  </c:otherwise>\n</c:choose>\n```\n\n### 示例:\n在这个示例中，我们有三个数字，并使用这三个标签对它们进行比较。示例非常于理解。输出截图在示例代码之后。\n\
  \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
  <html>\n<head>\n<title>c:choose, c:when and c:otherwise Example</title>\n</head>\n\
  <body>\n<c:set  var=\"number1\"  value=\"222\"/>\n<c:set  var=\"number2\"  value=\"\
  12\"/>\n<c:set  var=\"number3\"  value=\"10\"/>\n\n<c:choose>\n  <c:when test=\"\
  ${number1 < number2}\">\n    <c:out value=\"number1 is less than number2\"/>\n \
  \ </c:when>\n  <c:when test=\"${number1 <= number3}\">\n    <c:out value=\"number1\
  \ is less than equal to number3\"/>\n  </c:when>\n  <c:otherwise>\n    <c:out value=\"\
  number1 is largest number!\"/>\n  </c:otherwise>\n</c:choose>\n</body>\n</html>\n\
  ```\n输出:\n![](img/image0046.jpeg)\n\n6. **`<c:when>` 标签**: 它类似于 Java 中的 `case` 语句。注意：参考第\
  \ 5 点完整示例。\n\n7. **`<c:otherwise>` 标签**: 它类似于 switch-case 语句中的 `default` 属性。注意：参考第\
  \ 5 点完整示例。\n\n8. **`<c:catch>` 标签**: 该标签用于异常处理。在本文中讨论了使用 `<c:catch>` 核心标签进行异常处理。\n\
  \n### 语法：\n```xml\n<c:catch var=\"variable_name\">\n// 可能会发生异常的语句集\n</c:catch>\n\
  ```\n\n\n\n\n\n## 变量处理\n`variable_name` 可以是用于存储异常信息的任何变量。如果在 `<c:catch>` 包围的语句中发生异常，则该变量将包含异常信息。让我们通过示例来理解这一点。\n\
  \n### 示例\n\n在这个示例中，我们特意通过将整数除以零来抛出算术异常，然后使用表达式语言 (EL) 打印 `errormsg` 变量（该变量包含异常信息）。\n\
  \n注意：如果 `<c:catch>` 语句块中没有发生异常，则变量（示例中为 `errormsg`）将具有 `null` 值。这就是为什么我们在打印变量值之前要检查\
  \ `errormsg!=null`。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<html>\n<head>\n<title>JSTL c:catch 核心标签示例</title>\n</head>\n\
  <body>\n<%!\nint num1=10;\nint num2=0; %>\n<c:catch var =\"errormsg\">\n<% int res\
  \ = num1/num2;\n out.println(res);%>\n</c:catch>\n<c:if test = \"${errormsg != null}\"\
  >\n <p>上述算术操作中发生了异常。请修复错误。\n 异常为：${errormsg}</p>\n</c:if>\n</body>\n</html>\n```\n\
  \n输出：\n![](img/image00409.jpeg)\n\n## JSTL <c:import> 核心标签\nJSTL `<c:import>` 标签用于从另一个文件/页面导入内容到当前\
  \ JSP 页面。属性有 `var`、`URL` 和 `scope`。\n\n### 语法\n```xml\n<c:import var=\"variable_name\"\
  \ url=\"relative_url\"/>\n```\n这里 `variable_name` 是存储从另一个 url 导入数据的变量。\n`relative_url`\
  \ 是需要导入的文件/页面地址。\n\n### <c:import> 属性\n- `url`: 它是强制性属性，必须指定。\n- `var`: 这是一个可选属性，如果未指定，则导入的数据将打印在当前页面上。例如，语句\
  \ `<c:import url=\"/file.jsp\" />` 将在客户端（浏览器）上打印 file.jsp 的数据。\n- `scope`: 也是可选的。如果我们使用\
  \ `var` 属性，则可以配合 `scope` 来指定存储在变量中的数据的作用域。\n\n### 示例\n这是一个包含某些数据的页面。我们将在 `index.jsp`\
  \ 页面导入此页面。\n\n**display.jsp**\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<c:out value=\"Chandru\"/>\n<c:out value=\"JavaBook.com\" />\n\
  <c:out value=\"This is just a String\" />\n```\n\n**index.jsp**\n在这里我们将数据从 `display.jsp`\
  \ 导入到变量 `mydata`，然后使用 `<c:out>` 标签在浏览器上显示它。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<html>\n<head>\n<title> JSTL c:import 标签示例</title>\n</head>\n\
  <body>\n<c:import var=\"mydata\" url=\"/display.jsp\"/>\n<c:out value=\"${mydata}\"\
  />\n</body>\n</html>\n```\n\n输出：\nChandru javabook.com This is just a string\n\n\
  ## JSTL <c:forEach> 和 <c:forTokens> 核心标签\nJSTL 中的 `<c:forEach>` 标签用于执行有限次数的相同语句\
  \ set。它类似于 `java` 中的 `for` 循环。这基本上用于我们需要按照指定的次数反复执行（执行）一组语句的场景。\n\n`<c:forTokens>`\
  \ 也用于迭代，但它只与分隔符一起工作，这意味着使用此标签我们可以根据分隔符将输入数据分成多个部分。\n\n### <c:forEach> 标签\n\n####\
  \ <c:forEach> 语法\n```xml\n<c:forEach var=\"counter_variable_name\" begin=\"intial_value\"\
  \ end=\"final_limit\">\n    // 语句块\n</c:forEach>\n```\n以下是 `<c:forEach>` 标签的三个主要属性：\n\
  - `begin`: 初始计数值。\n- `end`: 循环执行的最终限制。\n- `var`: 计数器变量名。\n\n### 示例\n在这个示例中，我们使用\
  \ `<c:forEach>` 标签在循环中打印变量 `counter` 的值。循环从值 1（在 `begin` 属性中指定）开始，到值 10（`end` 属性的值）。\n\
  \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
  <html>\n<head>\n<title>JSTL 中 c:forEach 标签示例</title>\n</head>\n<body>\n<c:forEach\
  \ var=\"counter\" begin=\"1\" end=\"10\">\n    <c:out value=\"${counter}\"/>\n</c:forEach>\n\
  </body>\n</html>\n```\n输出：\n![](img/image0041.jpeg)\n\n### <c:forTokens> 标签\n\n\
  #### <c:forTokens> 语法\n```xml\n<c:forTokens var=\"variable_name\" items=\"value\"\
  \ delim=\"delimiter\">\n```\n以下是 `<c:forTokens>` 标签的三个主要属性：\n- `items`: 要分割的集合。\n\
  - `delim`: 用于分割的分隔符。\n- `var`: 用于存储每个部分的变量名。\n\n### 示例\n在这个示例中，我们使用 `<c:forTokens>`\
  \ 将字符串分成多个部分。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
  c\" %>\n<html>\n<head>\n<title>JSTL 中 c:forTokens 标签示例</title>\n</head>\n<body>\n\
  <c:forTokens var=\"site\" items=\"www.javabook.com\" delim=\".\">\n    <c:out value=\"\
  ${site}\"/>\n</c:forTokens>\n</body>\n</html>\n```\n输出：\nwww\njavabook\ncom\n\n\
  ## JSTL <c:param> 核心标签\n`<c:param>` 标签用于向 URL 添加参数。它通常用在 `<c:url>` 内部。\n\n### 语法\n\
  ```xml\n<c:param name=\"parameter_name\" value=\"parameter_value\"/>\n```\n### 属性\n\
  - `name`: 参数名。\n- `value`: 参数值。\n\n### 示例\n在这个示例中我们使用 `<c:param>` 标签为 URL 添加参数。\n\
  \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
  <html>\n<head>\n<title>JSTL c:param 标签示例</title>\n</head>\n<body>\n<c:url value=\"\
  /mypage.jsp\" var=\"completeURL\">\n<c:param name=\"Id\" value=\"736\"/>\n<c:param\
  \ name=\"user\" value=\"chandru\"/>\n</c:url>\n${completeURL}\n</body>\n</html>\n\
  ```\n输出：\n/mypage.jsp?Id=736&user=chandru\n\n#### 示例 2: <c:redirect> 中的 <c:param>\
  \ 使用\n在这里在使用 `<c:param>` 带重定向传递参数，然后使用表达式语言的 `param` 变量在重定向页面上显示这些参数。\n\n```jsp\n\
  <%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n<head>\n\
  <title>c:param 示例 2</title>\n</head>\n<body>\n<c:redirect url=\"/display.jsp\">\n\
  <c:param name=\"UserId\" value=\"222\"/>\n<c:param name=\"UserName\" value=\"ChandruBabu\"\
  />\n</c:redirect>\n</body>\n</html>\n```\n**display.jsp**\n```jsp\nUSER ID IS: ${param.UserId}\n\
  USER NAME IS: ${param.UserName}\n```\n输出：\nUSER ID IS: 222\nUSER NAME IS:ChandruBabu\n\
  \n## JSTL <c:url> 核心标签\n`<c:url>` 标签用于 URL 格式化或 URL 编码。它将相对 URL 转换为上下文 URL。属性有 `var`、`context`\
  \ 和 `scope`。\n\n### 语法\n```xml\n<c:url value=\"/file1.jsp\"/>\n```\n`value` 属性是\
  \ `<c:url>` 标签的强制性属性。该标签还有三个可选属性，如下：\n\n\n\n\n\n*   `var`: 用于存储格式化后 URL 的变量名（生成的\
  \ URL）。\n*   `context`: 用于指定应用程序（或项目名称）。不明白吗？我们稍后将通过示例来解释。\n*   `scope`: `var` 属性存储的作用域。它可以是\
  \ `request`、`page`、`application` 或 `session`。\n\n让我们通过示例来理解此标签及其属性的使用：\n\n### 示例\
  \ 1：`<c:url>` 的 `value` 属性\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<html>\n<head>\n<title>JSTL c:url 标签示例</title>\n</head>\n<body>\n\
  <c:url  value=\"/file1.jsp\"/>\n</body>\n</html>\n```\n输出：上述代码生成了以下输出。\n`/JavaBook/file1.jsp`\n\
  \n注意：`JavaBook` 是我的基础书籍名称（换句话说就是 JSP 应用程序名称）。\n\n### 示例 2：`<c:url>` 标签的 `var` 属性\n\
  让我们像这样修改示例 1。我们在 `<c:url>` 中添加了一个变量 `myurl`。现在 `<c:url>` 的结果将存储在变量 `myurl` 中。\n\n\
  ```jsp\n<c:url  var=\"myurl\"  value=\"/file1.jsp\"/>\n${myurl}\n```\n输出：\n`/JavaBook/file1.jsp`\n\
  \n### 示例 3：`context` 属性\n默认情况下，此标签将当前应用程序作为上下文，但我们可以像下面的示例所示，在 `c url` 中显式地指定上下文——\n\
  \n注意：`context` 的值必须以 “/”开头，否则你将得到下面的异常消息——\n`HTTP Status 500 – javax.servlet.ServletException:\
  \ javax.servlet.jsp.JspTagException: 在 URL 标签中，当指定了“context”属性时，“context”和“url”属性的值都必须以“/”开头。\n\
  \n```jsp\n<c:url  var=\"myurl\"  value=\"/file1.jsp\"  context=\"/MyJSPProject\"\
  />\n${myurl}\n```\n输出：\n`/MyJSPProject/file1.jsp`\n\n### 示例 4：Scope 属性\n```jsp\n\
  <c:url var=\"myurl\" value=\"/file1.jsp\" context=\"/MyJSPProject\" scope=\"session\"\
  />\n${requestScope.myurl}\n```\n输出：输出屏幕将为空，因为我们将 `myurl` 存储在 `session` 作用域中，而我们正尝试从\
  \ `requestScope` 获取值后打印它。\n\n正确用法：这应该是代码编写方式。在这里我们将将其存储在 session 中并从 `sessionScope`\
  \ 中获取，这样它就能正常工作。\n\n```jsp\n<c:url  var=\"myurl\"  value=\"/file1.jsp\"  context=\"\
  /MyJSPProject\"  scope=\"session\"/>\n${sessionScope.myurl}\n```\n输出：\n`/MyJSPProject/file1.jsp`\n\
  \n14. `<c:redirect>` 标签：用于将当前页面重定向到另一个 URL，在此标签的 `url` 属性中提供相对地址，页面将重定向到该 url。\n\
  \n# JSTL `<c:redirect>` 核心标签\n\n`<c:redirect>` 用于将当前页面重定向到另一个 URL。\n\n### 语法：\n\
  ```jsp\n<c:redirect  url=\"http://www.anydomainhere.com/samplepage.jsp\"/>\n```\n\
  这就是 `<c:redirect>` 标签的样子。我们只需要在该标签的 `URL` 属性中提供相对地址，页面在获取后会自动重定向到该 URL。\n\n### 示例\n\
  在这里，我们根据变量 `myurl` 的值将页面重定向到不同的 url。如果值为 1，页面将重定向到 `http://javabook.com`，如果是 2，它将转到\
  \ `http://www.google.com`。\n\n```jsp\n<%@lib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<html>\n<head>\n<title>JSTL c:redirect 示例</title>\n</head>\n\
  <body>\n <c:set  var=\"myurl\"  value=\"2\"  scope=\"request\"/>\n <c:if test=\"\
  ${myurl==1}\">\n <c:redirect  url=\"http://javabook.com\"/>\n </c:if>\n <c:if test=\"\
  ${myurl==2}\">\n <c:redirect  url=\"http://www.google.com\"/>\n </c:if>\n</body>\n\
  </html>\n```\n输出：由于变量 `myurl` 的值为 2，页面被重定向到 `http://www.google.com`。\n\n## JSTL\
  \ 函数\n以下是常用 JSTL 函数的教程链接。在 JSP 页面中必须包含标签指令才能使用 JSTL 函数。\n\n```jsp\n<%@ taglib prefix=\"\
  fn\" uri=\"http://java.sun.com/jsp/jstl/functions\" %>\n```\n\n`fn:contains`: 此函数检查给定字符串是否作为子字符串出现在输入中。它执行的是大小敏感的检查。\n\
  \n## fn:contains() – JSTL 函数\n`fn:contains()` 检查给定字符串是否作为子字符串出现在输入中。它执行的是大小敏感的检查，意味着它在检查子字符串时会考虑大小写。\n\
  \n### 语法：\n`boolean contains(String input, String check)`\n该函数的返回类型为 `boolean`。当指定的字符串作为子字符串出现在输入时，该函数返回\
  \ `true`，否则返回 `false`。\n\n## 示例：\n`fn:contains()` 检查给定字符串是否作为子字符串出现在输入中。它执行的是大小敏感的检查，意味着它在检查子字符串时会考虑大小写。\n\
  \n### 语法：\n`boolean contains(String input, String check)`\n该函数的返回类型为 `boolean`。当指定的字符串作为子字符串出现在输入时，该函数返回\
  \ `true`，否则返回 `false`。\n\n## 示例：\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
  fn\" %>\n<html>\n<head>\n<title>fn:contains 示例</title>\n</head>\n<body>\n<c:set\
  \ var=\"oldPassword\" value=\"12\"/>\n<c:set var=\"newPassword\" value=\"1 password\"\
  />\n<c:if test=\"${fn:contains(newPassword, oldPassword)}\">\n<c:out value=\"Password\
  \ contains the string\"/>\n</c:if>\n</body>\n</html>\n```\n输出：\nPassword contains\
  \ the string\n\n2. `fn:containsIgnoreCase()`：此函数检查给定字符串是否不分大小写地作为子字符串出现在输入中。\n\n\
  ## fn:containsIgnoreCase() – JSTL 函数\n`fn:containsIgnoreCase()` 检查给定字符串是否不分大小写地作为子字符串出现在输入中。\n\
  \n### 语法：\n`boolean containsIgnoreCase(String input, String check)`\n该函数的返回类型为 `boolean`。当指定的字符串不分大小写地出现在输入中时，该函数返回\
  \ `true`，否则返回 `false`。\n\n## 示例：\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
  fn\" %>\n<html>\n<head>\n<title>fn:containsIgnoreCase 示例</title>\n</head>\n<body>\n\
  <c:set var=\"string1\" value=\"Hi This is CHANDRU from JavaBook.com\"/>\n<c:set\
  \ var=\"string2\" value=\"chandru\"/>\n<c:if test=\"${fn:containsIgnoreCase(string1,\
  \ string2)}\">\n<c:out value=\"Case Insensitive Check: String1 contains string2\"\
  />\n</c:if>\n</body>\n</html>\n```\n输出：\nCase Insensitive Check: String1 contains\
  \ string2\n\n3. `fn:indexOf()`：它用于查找字符串在提供的字符串中的起始位置。当输入中未找到字符串时，返回 -1。\n\n# fn:indexOf()\
  \ – JSTL 函数\n`fn:indexOf()` 函数用于查找字符串在提供的字符串中的起始位置（索引）。\n\n### 语法：\n`int indexOf(String,\
  \ String)`\n该函数的返回类型为 `int`。它返回第二个字符串（函数的第二个参数）在第一个字符串（函数的第一个参数）中的起始位置（或索引）。\n\n\
  注意点：\n*   当输入字符串中未找到字符串时，函数返回 -1。\n*   函数是大小敏感的。它将相同字母的大写和小写视为不同的。\n*   它返回第一次出现的索引，这意味着如果字符串在输入中出现多次，函数将返回第一次出现的索引。参考示例。\n\
  \n#### `fn:indexOf()` 函数示例\n在此示例中，我们使用 EL 查找几个字符串的索引并显示它们。\n\n```jsp\n<%@ taglib\
  \ uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\"\
  \ prefix=\"fn\" %>\n<html>\n<head>\n<title>JSTL fn:indexOf() 示例</title>\n</head>\n\
  <body>\n${fn:indexOf(\"My name is Chandru pratap\", \"chandru\")}\n</body>\n</html>\n\
  ```\n\n\n\n\n\n```\n${fn:indexOf(\"My name is Chandru pratap\", \"Chandru\")}\n\
  ${fn:indexOf(\"This is an example\", \"is\")}\n${fn:indexOf(\"JSTL function - indexOf\
  \ function\", \"function\")}\n```\nOutput:\n-1 11 2 5\n\n## 4. `fn:escapeXML()`\n\
  它用于 HTML/XML 字符转义，这意味着它将 html/xml 标签视为字符串。类似于 `<c:out>` 标签的 `escapeXml` 属性。\n\n\
  ### `fn:escapeXml()` – JSTL 函数\nfn:escapeXml() JSTL 函数用于 HTML/XML 字符转义，这意味着它将 html/xml\
  \ 标签视为字符串而非标记标签。\n\n### 语法\n```java\nString escapeXml(String input_string)\n```\n\
  在转义 html/xml 标记标签后将 `input_string` 转换为输出字符串。\n\n* 函数返回类型为 `String`\n* 参数：`input\
  \ String`\n\n#### `fn:escapeXml()` 示例\n这里有两个包含加粗（<b>`）和斜体（<i>`）HTML 标签的字符串。我们正在使用\
  \ `fn:escapeXml()` 函数对它们进行处理。\n\n```html\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
  fn\" %>\n<html>\n<head>\n<title>JSTL fn:escapeXml() 示例</title>\n</head>\n<body>\n\
  Message1: <b>Hi This is just a message</b>\n<br>Message2: <i>This is an example</i>\n\
  <br>Message1 and `fn:escapeXml()`: ${fn:escapeXml(\"<b>Hi This is just a message</b>\"\
  )}\n<br>Message2 and `fn:escapeXml()`: ${fn:escapeXml(\"<i>This is an example</i>\"\
  )}\n</body>\n</html>\n```\n输出:\n如你所见，当我们在输入字符串上使用该函数时，html 标签并没有生效，而是像原样一样被打印了出来，就像另一个普通字符串一样。\n\
  \n![](img/image00411.jpeg)\n\n## 5. `fn:join()` 和 `fn:split()` 函数\nJSTL 函数：`fn:join()`\
  \ 使用给定的分隔符连接字符串并返回输出字符串。`fn:split()` 将给定的字符串拆分为子字符串数组。\n\n# `fn:join()` 和 `fn:split()`\
  \ JSTL 函数\n\n### `fn:join()`\n它使用给定的分隔符连接字符串并返回输出字符串。\n\n### 语法\n```java\nString\
  \ fn:join(String arrayofstrings, String separator)\n```\n它将输入数组中的所有元素连提供的分隔符连接在一起。该函数的返回类型为\
  \ `String`，它返回连接后的输出字符串。\n\n#### 示例 – 使用 `fn:join()` 函数连接字符串\n在此示例中，我们有一个字符串数组，并正在使用分隔符（`'\
  \ & '`）将它们连接。\n\n```html\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
  c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\"\
  \ %>\n<html>\n<head>\n<title>JSTL fn:join() 示例</title>\n</head>\n<body>\n<%\nString\
  \ arr[]={\"Chandru\", \"Rahul\", \"Ajith\"};\nsession.setAttribute(\"names\", arr);\n\
  %>\n${fn:join(names, \" & \")}\n</body>\n</html>\n```\n输出:\n如你所见，三个名字都连接在一起了，中间有‘\
  \ &’。\nChandru & Rahul & Ajith\n\n### `fn:split()`\n它将给定的字符串拆分为子字符串数组。拆分过程考虑我们在调用函数时提供的分隔符字符串。也就是说，我们将字符串和分隔符作为参数传递给函数，它根据分隔符字符串拆分输入并返回数组。\n\
  \n### 语法\n```java\nString[] fn:split(String inputstring, String delimiterstring)\n\
  ```\n\n#### 示例 – 使用 `fn:split()` 函数连接字符串\n在此示例中，我们有一个中间包含几个空格字符的输入字符串。我们使用 `fn:split()`\
  \ 函数以空格作为分隔符拆分了字符串。该函数返回了子字符串数组。\n\n```html\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
  fn\" %>\n<html>\n<head>\n<title>JSTL fn:split() 示例</title>\n</head>\n<body>\n<c:set\
  \ var=\"msg\" value=\"This is an example of JSTL function\"/>\n<c:set var=\"arrayofmsg\"\
  \ value=\"${fn:split(msg,' ')}\"/>\n<c:forEach var=\"i\" begin=\"0\" end=\"6\">\n\
  arrayofmsg[${i}]: ${arrayofmsg[i]}<br>\n</c:forEach>\n</body>\n</html>\n```\n输出:\n\
  ![](img/image00412.jpeg)\n\n## 6. `fn:length()`\nJSTL 函数 `fn:length()` 用于计算字符串的长度或查找集合中元素的数量。它返回对象的长度。\n\
  \n# `fn:length()` – JSTL 函数\nJSTL 函数 `fn:length()` 用于计算字符串的长度或查找集合中元素的数量。\n\n###\
  \ 语法\n```java\nint length(Object)\n```\n该函数的返回类型为 `int`。它返回传入对象的长度。\n\n#### `fn:length()`\
  \ 示例\n我们正在计算不同字符串的长度。\n\n```html\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
  fn\" %>\n<html>\n<head>\n<title>JSTL fn:length() 示例</title>\n</head>\n<body>\n<c:set\
  \ var=\"string1\" value=\"This is an example of JSTL function\"/>\n<c:set var=\"\
  string2\" value=\"Hi\"/>\n<c:set var=\"string3\" value=\"\"/>\nLength of string1:\
  \ ${fn:length(string1)}<br>\nLength of string2: ${fn:length(string2)}<br>\nLength\
  \ of string3: ${fn:length(string3)}\n</body>\n</html>\n```\n输出:\n![](img/image00413.jpeg)\n\
  \n## 7. `fn:trim()`\nfn:trim() 是指定字符串的前。\n\n# `fn:trim()` – JSTL 函数\nfn:trim() 用于移除字符串首尾的空格。\n\
  \n### 语法\n```java\nString trim(String input)\n```\n该函数返回移除首尾空格后的字符串。\n\n#### `fn:trim()`\
  \ 示例\n在此示例中，我们有一个开头和结尾都有空格字符的字符串。我们正在使用 `fn:trim()` 函数去掉这些空格。\n\n```html\n<%@ taglib\
  \ uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\"\
  \ prefix=\"fn\" %>\n<html>\n<head>\n<title>JSTL fn:trim() 示例</title>\n</head>\n\
  <body>\n<c:set var=\"msg\" value=\"  This is an example of JSTL function  \"/>\n\
  Trimmed string: '${fn:trim(msg)}'\n</body>\n</html>\n```\n输出:\n![](img/image00414.jpeg)\n\
  \n## 8. `fn:endsWith()`\nfn:endsWith() 是字符串。\n\n# `fn:endsWith()` – JSTL 函数\nfn:endsWith()\
  \ 函数用于检查字符串的后缀。它检查给定的字符串是否以特定的字符串结尾。该验证是`大小敏感`的。\n\n### 语法\n```java\nboolean endsWith(input_string,\
  \ suffix_string)\n```\n它验证 `input_string` 是否以 `suffix_string` 结尾。如果测试成功，该函数返回 `true`，否则返回\
  \ `false`。\n\n#### `fn:endsWith()` 示例\n在此示例中，我们检查一个字符串是否以特定的后缀结尾。\n\n```html\n<%@\
  \ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<%@ taglib uri=\"\
  http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n<html>\n<head>\n<title>JSTL\
  \ fn:endsWith() 示例</title>\n</head>\n<body>\n<c:set var=\"msg\" value=\"This is\
  \ an example of JSTL function\"/>\nEnds with 'function': ${fn:endsWith(msg, 'function')}<br>\n\
  Ends with 'example': ${fn:endsWith(msg, 'example')}\n</body>\n</html>\n```\n输出:\n\
  ![](img/image00415.jpeg)\n\n\n\n在示例中，我们有一个输入字符串“JavaBook.com”以及其他 4 个字符串。我们正在验证输入字符串是否以给定的四个字符串结束。\n\
  \n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
  <%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n<html>\n\
  <head>\n<title>JSTL fn:endsWith() 示例</title>\n</head>\n<body>\n字符串以 \".com\" 结束:${fn:endsWith(\"\
  JavaBook.com\", \"com\")}\n<br>字符串以 \"book.com\" 结束:${fn:endsWith(\"JavaBook.com\"\
  , \"book.com\")}\n<br>字符串以 \"Book.com\" 结束:${fn:endsWith(\"JavaBook.com\", \"Book.com\"\
  )}\n<br>字符串以 \"Book.co\" 结束:${fn:endsWith(\"JavaBook.com\", \"Book.co\")}\n</body>\n\
  </html>\n```\n\n输出：\n\n![](img/image00416.jpeg)\n\n9. `fn:substring()`: 此 JSTL 函数用于从提供的字符串中获取子字符串。\n\
  \n# `fn:substring()`, `fn:substringAfter()` & `fn:substringBefore()` 函数\n\n在本教程中，我们将讨论\
  \ JSTL 的 `fn:substring()`、`fn:substringAfter()` 和 `fn:substringBefore()` 函数。这些函数都用于从给定的输入字符串中获取字符串的一部分。这三个函数获取输出的方法各不同。\n\
  \n### `fn:substring()`\n\n该函数根据给定的起始和结束位置，返回给定输入字符串的子字符串。\n\n### 语法：\n\n`String\
  \ fn:substring(String inputstring, int start, int end)`\n\n* 函数返回类型：`String`\n*\
  \ `inputstring`: 需要提取子字符串的字符串\n* `start`: 子字符串的起始位置\n* `end`: 子字符串的结束位置\n\n####\
  \ 示例 – `fn:substring()` 函数\n\n在此示例中，我们通过提供子字符串的起始和结束位置，从给定的字符串中提取子字符串。\n\n```xml\n\
  <%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<%@ taglib\
  \ uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n<html>\n<head>\n\
  <title>JSTL fn:substring() 示例</title>\n</head>\n<body>\n<c:set var=\"msg\" value=\"\
  This is an example of JSTL function\"/>\n${fn:substring(msg, 10, 26)}\n</body>\n\
  </html>\n```\n\n输出：\n\nexample of JSTL\n\n### `fn:substringAfter()`\n\n它返回给定字符串中位于提供的字符串值之后的部分。\n\
  \n### 语法\n\n`String fn:substringAfter(String input, String afterstring)`\n\n输入字符串中\
  \ `afterstring` 之后的所有内容都会由该函数返回。请参考下方的示例以更清楚地了解此主题。\n\n#### `fn:substringAfter()`\
  \ 示例\n\n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\"\
  \ %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n\
  <html>\n<head>\n<title>JSTL fn:substringAfter() 示例</title>\n</head>\n<body>\n<c:set\
  \ var=\"name\" value=\"Rahul Pratap Prasad\"/>\n${fn:substringAfter(name, \"Pr\"\
  )}\n</body>\n</html>\n```\n\n输出：\n\natap Prasad\n\n### `fn:substringBefore()`\n\n\
  它与 `fn:substringAfter` 函数正好相反。它返回原始字符串中位于指定字符串值之前的部分。\n\n### 语法：\n\n`String fn:substringBefore(String\
  \ input, String beforestring)`\n\n`input` 中 `beforestring` 之前的部分将作为该函数的输出。\n\n####\
  \ `fn:substringBefore()` 示例\n\n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
  fn\" %>\n<html>\n<head>\n<title>JSTL fn:substringBefore() 示例</title>\n</head>\n\
  <body>\n<c:set var=\"justastring\" value=\"Hi, How are you??\"/>\n${fn:substringBefore(justastring,\
  \ \"are\")}\n</body>\n</html>\n```\n\n输出：\n\nHi, How\n\n10. `fn:substringAfter()`:\
  \ 它用于获取输入字符串中指定字符串之前的子字符串。\n\n注意：请完整阅读示例 9。\n\n11. `fn:substringBefore()`: 它从输入中获取位于指定字符串后续的子字符串。\n\
  \n注意：请完整阅读示例 9。\n\n12. `fn:trim()`: JSTL 函数 `fn:trim()` 移除字符串开头和结尾的空格。\n\n# `fn:trim()`\
  \ 和 `fn:startsWith()` JSTL 函数\n\n在这篇文章中，我们将讨论两个对字符串操作的函数。这些函数是 `fn:trim()` 和 `fn:startsWith()`。`fn:trim()`\
  \ 函数移除字符串开头和结尾的空格，而 `fn:startsWith()` 检查指定字符串是否为给定字符串的前缀。\n\n#### JSTL `fn:trim()`\
  \ 函数\n\n它移除字符串开头和结尾的空格字符。\n\n它移除给定字符串开头结尾的空格。\n\n语法：\n\n`fn:trim(String input)`\n\
  \n该函数返回处理后的字符串。\n\n示例：\n\n我们有一个开头和结尾有空格的字符串。\n\n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
  fn\" %>\n<html>\n<head>\n<title>JSTL fn:trim() 示例</title>\n</head>\n<body>\n<c:set\
  \ var=\"msg\" value=\"  This is a string  \"/>\n${fn:trim(msg)}\n</body>\n</html>\n\
  ```\n\n输出：\n\nThis is a string\n\n#### `fn:startsWith()` 函数\n\n它会检查指定字符串是否为给定字符串的前缀。\n\
  \n语法：\n\n`boolean fn:startsWith(String input, String prefix)`\n\n该函数返回一个布尔值。如果字符串以前缀开头则返回\
  \ true，否则返回 false。\n\n示例：\n\n我们有一个字符串，并检查它是否以某个字符串开头。\n\n```xml\n<%@ taglib uri=\"\
  http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\"\
  \ prefix=\"fn\" %>\n<html>\n<head>\n<title>JSTL fn:startsWith() 示例</title>\n</head>\n\
  <body>\n<c:set var=\"msg\" value=\"Hello World\"/>\n字符串以 \"Hello\" 开头:${fn:startsWith(msg,\
  \ \"Hello\")}\n<br>字符串以 \"World\" 开头:${fn:startsWith(msg, \"World\")}\n</body>\n\
  </html>\n```\n\n输出：\n\ntrue\nfalse\n\n13. `fn:toUpperCase()`: 它与 `fn:toLowerCase()`\
  \ 函数相反。它将输入字符串转换为大写。\n\n# `fn:toUpperCase()` – JSTL 函数\n\n它与 `fn:toLowerCase()`\
  \ 函数相反。它将字符串转换为大写。输入字符串中的所有字符都被替换为相应的大写字母。需要更改的字符串作为函数的参数传递，函数返回转换后的字符串。我们可以在调用函数时传递变量或直接硬编码字符串。\n\
  \n### 语法：\n\n`String fn:toUpperCase(String input)`\n\n该函数在将输入字符串转换为大写后返回字符串。\n\n\
  #### `fn:toUpperCase()` 示例\n\n我们使用该函数将一些字符串转换为大写。\n\n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
  fn\" %>\n<html>\n<head>\n<title>fn:toUpperCase() 示例</title>\n</head>\n<body>\n<c:set\
  \ var=\"site\" value=\"JavaBook.com\"/>\n<c:set var=\"author\" value=\"Chandru\"\
  />\nHi This is ${fn:toUpperCase(author)} from ${fn:toUpperCase(site)}.\n</body>\n\
  </html>\n```\n\n输出：\n\nCHANDRU\nJAVABOOK.COM\n\n14. `fn:toLowerCase()`: 此函数用于将输入字符串转换为小写字符串。\n\
  \n# `fn:toLowerCase()` – JSTL 函数\n\n该函数将字符串转换为小写字符串。输入字符串中的任何大写字母都被替换为相应的小写字母。\n\
  \n### 语法：\n\n`String fn:toLowerCase(String input)`\n\n该函数在将输入字符串转换为小写后返回字符串。\n\n\
  #### `fn:toLowerCase()` 示例\n\n\n\n\n在本示例中，我们对两个字符串应用此函数——其中是一个字符串变量，另一个是作为参数传递给函数的硬编码字符串。如你在输出中所看到的，它已将变量值和硬编码字符串的值替换为小写。代码块之后提供了输出的截图。\n\
  \n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
  <%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n<html>\n\
  <head>\n<title>fn:toLowerCase() example</title>\n</head>\n<body>\n<c:set var=\"\
  message\" value=\"This is An Example of JSTL Function\"/>\n${fn:toLowerCase(message)}\n\
  ${fn:toLowerCase(\"HELLO\")}\n</body>\n</html>\n```\n\n输出:\nThis is an Example of\
  \ jstl function hello\n\n## 15. `fn:replace()`\n`fn:replace()` 函数在输入中搜索一个字符串，并将其替换为所提供的字符串。它执行的是大小写敏感的处理。\n\
  \n# `fn:replace()` – JSTL 函数\n\n它在输入中搜索一个字符串，并将其替换为所提供的字符串。以下是 `fn:replace()` 函数的基本语法。\n\
  \n### 语法\n`String fn:replace(String input, String search_for, String replace_with)`\n\
  \n包含三个字符串参数，返回值类型也是 `String`。它在 `input` 中搜索 `search_for` 字符串并将其替换为 `replace_with`\
  \ 字符串。如果未找到该字符串，则原样返回输入。\n\n**注意：** 它执行的是大小写敏感的处理。\n\n### 示例\n在本示例中，我们对两个输入字符串使用了\
  \ `fn:replace()` 函数。\n\n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
  fn\" %>\n<html>\n<head>\n<title>JSTL fn:replace() example</title>\n</head>\n<body>\n\
  <c:set var=\"author\" value=\"Chandru Babu\"/>\n<c:set var=\"randomstring\" value=\"\
  abc def abc ghi ABC\"/>\n${fn:replace(author, \"Chandru\", \"Rahul\")}\n${fn:replace(randomstring,\
  \ \"abc\", \"hello\")}\n</body>\n</html>\n```\n\n输出:\nRahul Babu hello def hello\
  \ ghi ABC\n\n观察输出你会发现 `randomstring` 变量中的 “ABC” 保持不变，而其他的 “abc” 子字符串被替换为了 “hello”。这是由于大小写敏感匹配导致的，在上面的示例中，我们替换的是小写的\
  \ “abc”。\n\n# JSON 教程\n### JSON 教程：10 分钟学习 JSON\n\nJSON 代表 JavaScript 对象表示法（JavaScript\
  \ Object Notation）。JSON 对象用于在服务器和客户端之间传输数据，XML 具有相同的目的。然而，JSON 对象相比 XML 具有许多优势，我们将在本教程中讨论这些优势，并介绍\
  \ JSON 的概念和它的用法。\n\n让我们来看这段 JSON 数据：它基本上由键值值对组成。\n\n```javascript\nvar chandru =\
  \ {\n \"firstName\" : \"Chandru\",\n \"lastName\" : \"babu\",\n \"age\" :\"28\"\n\
  };\n```\n\n#### JSON 的特性：\n* 它是轻量级的\n* 它是语言无关的\n* 易于读写\n* 基于文本的、人类可读的数据交换格式\n\n\
  ## 为什么使用 JSON？\n**标准结构：** 正如我们所看到的，JSON 对象具有标准的结构，这使得开发者编写和阅读代码的工作变得更容易，因为他们知道从\
  \ JSON 中期望什么。\n\n**轻量级：** 在使用 AJAX 时，快速且异步地加载数据而不请求页面刷新是至关重要的。由于 JSON 是轻量级的，因此更容易快速获取并加载所请求的数据。\n\
  \n**可扩展性：** JSON 是语言无关的，这意味着它可以与大多数现代编程语言良好协作。假设我们需要更改服务器端语言，在这种情况下，对我们来说更容易更改，因为\
  \ JSON 结构对于所有语言都是相同的。\n\n## JSON vs XML\n让我们看看当以文本格式存储 4 个学生的记录时，JSON 和 XML 看起来是什么样，以便以后需要时检索它们。\n\
  \n**JSON 样式：**\n```json\n{\"students\":[\n  {\"name\":\"John\", \"age\":\"23\",\
  \ \"city\":\"Agra\"},\n  {\"name\":\"Steve\", \"age\":\"28\", \"city\":\"Delhi\"\
  },\n  {\"name\":\"Peter\", \"age\":\"32\", \"city\":\"Chennai\"},\n  {\"name\":\"\
  Chandru\", \"age\":\"28\", \"city\":\"Bangalore\"}\n]}\n```\n\n**XML 样式：**\n```xml\n\
  <students>\n <student>\n <name>John</name> <age>23</age> <city>Agra</city>\n </student>\n\
  \ <student>\n <name>Steve</name> <age>28</age> <city>Delhi</city>\n </student>\n\
  \ <student>\n <name>Peter</name> <age>32</age> <city>Chennai</city>\n </student>\n\
  \ <student>\n <name>Chandru</name> <age>28</age> <city>Bangalore</city>\n </student>\n\
  </students>\n```\n如你清楚看到的，JSON 远要轻量得多。\n\n## JSON 数据结构以及如何读取它们：\n### 1. JSON 对象\n\
  在上面的示例中，我们将信息存储了一个对象：\n```javascript\nvar chandru = {\n \"name\" : \"Chandru\",\n\
  \ \"age\" : \"28\",\n \"website\" : \"Javabook\"\n};\n```\n要从对象中访问信息，我们这样做：\n```javascript\n\
  document.writln(\"The name is: \" + chandru.name);\ndocument.writln(\"his age is:\
  \ \" + chandru.age);\ndocument.writln(\"his website is: \"+ chandru.website);\n\
  ```\n\n### 2. 数组中的 JSON 对象\n假设我们想存储多个人的信息，我们可以有一个数组：\n```javascript\nvar students\
  \ = [{\n \"name\" : \"Steve\",\n \"age\" : \"29\",\n \"gender\" : \"male\"\n},\n\
  {\n \"name\" : \"Peter\",\n \"age\" : \"32\",\n \"gender\" : \"male\"\n},\n{\n \"\
  name\" : \"Sophie\",\n \"age\" : \"27\",\n \"gender\" : \"female\"\n}];\n```\n要访问数组，我们这样做：\n\
  ```javascript\ndocument.writeln(students[0].age); //输出应为 29\n```\n\n### 3. JSON\
  \ 对象的嵌套\n另一种实现上面相同功能的方法：\n```javascript\nvar students = {\n \"steve\" : {\n \"name\"\
  \ : \"Steve\",\n \"age\" : \"29\",\n \"gender\" : \"male\"\n },\n\"pete\" : {\n\
  \ \"name\" : \"Peter\",\n \"age\" : \"32\",\n \"gender\" : \"male\"\n },\n\"sop\"\
  \ : {\n \"name\" : \"Sophie\",\n \"age\" : \"27\",\n \"gender\" : \"female\"\n }\n\
  }\n```\n像这样访问上面的嵌套对象：\n```javascript\ndocument.writln(students.steve.age); //输出:\
  \ 29\ndocument.writeln(students.sop.gender); //输出: female\n```\n\n## JSON 与 JavaScript\n\
  JSON 被认为是 JavaScript 的子集但这并不意味着 JSON 不能与其他语言一起。事实上，它可以与 PHP、Perl、Python、Ruby、Java\
  \ 和 Ajax 等许多语言配合良好。\n\n为了演示如何结合 JavaScript 使用 JSON，这里有一个示例：\n如果你学过上面的教程，你就熟悉 JSON\
  \ 结构。JSON 文件类型为 .json\n\n如何从 json 文件读取数据并转换为 JavaScript 对象？\n有两种方法：\n\n1. 使用 `eval`\
  \ 函数，但由于安全原因不建议这样做（恶意数据可以从服务器发送到客户端，然后在客户端脚本的 `eval` 中产生有害影响）。\n2. 使用 `JSON.parse`：没有安全问题，而且比\
  \ `eval` 快。以下是使用方法：\n```javascript\nvar chandru = {\n\"name\" : \"Chandru\",\n\"\
  age\" : \"28\",\n\"website\" : \"Javabook\"\n};\n```\n我们使用 `JSON.parse` 将上面的 JSON\
  \ 对象转换为 JavaScript 对象：\n```javascript\nvar myJSObject = JSON.parse(chandru);\n```\n\
  \n# SERVLET 教程\n### Servlet 简介\nServlet 是运行在 Web 服务器 JVM 上的 Java 程序。它被用于开发动态 Web\
  \ 应用程序。\n\n\n\n\n\n在我们继续之前，让我们先了解什么是动态 Web 应用。Web 应用可以被描述为网页的集合（例如一个网站），当我们称其为“动态”时，简单意味着这些网页对于所有用户来说是不相同的，网页将根据客户端（用户浏览器）发出的请求在服务器端生成。\n\
  \n静态网页和动态网页的主要区别在于，静态页面顾如名义对所有用户都保持不变，而动态网页会根据客户端（用户浏览器）的请求发生变化。例如，考虑一个显示两个输入字段和一个添加按钮的\
  \ Web 应用，当你输入两个数字并点击添加时，它会显示另一个包含这两个数字相加结果的网页。这个 Web 应用在本质上是动态的，因为显示结果的第二个网页会根据用户的输入而改变，它对所有用户都不是静态的。\n\
  \n然而，你完全可以认为 Servlet 的功能可以通过 CGI（通用网关接口）完成，这确实如此，但问题在于——CGI 有若干局限性，如性能、可扩展性、复用性等，而\
  \ Servlet 并不具备这些问题。我不会详细讨论 CGI，但我会告诉你 Servlet 相比 CGI 好在哪里。\n\n## CGI 的局限性\n\n服务器必须为每个客户端请求创建一个新的\
  \ CGI 进程。例如，如果有 100 个用户访问该 Web 应用，服务器必须创建 100 个 CGI 进程来处理他们发出的请求。由于服务器资源有限，为每个新请求创建新进程并不是可行的方案，这给服务器造成了限制，导致服务器无法同时处理超过指定数量的用户。\n\
  \n## 为什么 Servlet 比 CGI 好\n\nCGI 程序在每次发出新请求时都由新进程处理。与 CGI 不同，Servlet 程序由独立的线程处理，这些线程可以更高效地并发运行。\n\
  \nCGI 程序可以用任何编程语言编写，这使得它在很大程度上依赖于平台，因为并不是所有的编程语言都是平台无关的。Servlet 仅使用 Java 作为编程语言，这使其具有平台无关性和可移植性。使用\
  \ Java 的另一个优点是，Servlet 可以利用 Java 的面向对象编程特性。\n\n### Servlet 如何工作\n\n正如我上面提到的，服务器的并发请求是由线程处理的，以下是该内容的图形化表示——\n\
  \n![](img/image00418.jpeg)\n\n## Servlet 的特性\n\n现在我们已经了解了什么是 Servlet 以及它的用途。让我们继续讨论它的主要特征。\n\
  \n1. **可移植性 (Portable)**：\n正如我上面提到的，Servlet 使用 Java 作为编程语言，由于 Java 是平台无关的，Servlet\
  \ 也是如此。例如，你可以在 Windows 操作系统上创建一个使用 GlassFish 作为 Web 服务器的 Servlet，稍然后在任何其他操作系统（如带有\
  \ Apache tomcat Web 服务器的 Unix、Linux）上运行它，这一特性使得 Servlet 具有可移植性，这也是 Servlet 相比于 CGI\
  \ 的主要优势。\n\n2. **高效且可扩展 (Efficient and scalable)**：\n一旦 Servlet 被部署并加载到 Web 服务器上，它就可以立即开始满足客户端的请求。Web\
  \ 服务器使用轻量级线程调用 Servlet，因此通过 Java 的多线程特性，Servlet 可以同时处理多个客户端请求。与服务器必须为每个客户端请求启动新进程的\
  \ CGI 相比，Servlet 真正是高效且可扩展的。\n\n3. **健壮性 (Robust)**：\n通过继承 Java 的高级特性（如垃圾回收、异常处理、Java\
  \ 安全管理器等），Servlet 较少出现内存管理问题和内存泄漏。这使得使用 Servlet 开发 Web 应用更加安全且更不容易出错。\n\n# Servlet\
  \ API\n\n你需要使用 Servlet API 来创建 Servlet。在使用 API 时，你必须记住两个包：包含支持通用 Servlet（协议无关 Servlet）的类的\
  \ `javax.servlet` 包，以及包含支持 HTTP Servlet 的类的 `javax.servlet.http` 包。你可能想知道通用 Servlet\
  \ 和 HTTP Servlet 是什么，我在本文稍后解释了它们。\n\n让我们来看看包的层级结构：\n\n`java.lang.Object`\n|_ 由 `javax.servlet.GenericServlet`\
  \ 扩展\n|_ 由 `javax.servlet.http.HttpServlet` 扩展\n\n每个 Servlet 都必须实现 `java.servlet.Servlet`\
  \ 接口，你可以通过扩展以下类之一来实现：`javax.servlet.GenericServlet` 或 `javax.servlet.http.HttpServlet`。第一个用于协议无关的\
  \ Servlet，第二个用于 HTTP Servlet。\n\n### Servlet 是如何工作的？\n\n![](img/image00419.jpeg)\n\
  \n## Generic Servlet (通用 Servlet)\n\n正如我上面提到的，如果你正在创建一个 Generic Servlet，那么你必须扩展\
  \ `javax.servlet.GenericServlet` 类。GenericServlet 类有一个抽象的 `service()` 方法。这意味着 GenericServlet\
  \ 的子类应该始终重写 `service()` 方法。\n\n`service()` 方法的签名：\n\n```java\npublic abstract void\
  \ service(ServletRequest request, ServletResponse response) throws ServletException,\
  \ java.io.IOException\n```\n\n`service()` 方法接受两个参数：`ServletRequest` 对象和 `ServletResponse`\
  \ 对象。请求对象告诉 Servlet 客户端发出的请求，而响应对象用于向客户端返回响应。\n\n![](img/image00420.jpeg)\n\n##\
  \ HTTP Servlet (HTTP Servlet)\n\n如果你正在创建 Http Servlet，你必须扩展 `javax.servlet.http.HttpServlet`\
  \ 类，这是一个抽象类。与 Generic Servlet 不同，HTTP Servlet 没有重写 `service()` 方法。相反，它重写了以下方法之一或多个。它必须重写列表中至少一个方法：\n\
  \n*   `doGet()` – 该方法由 servlet service 方法调用，用于处理来自客户端的 HTTP GET 请求。Get 方法用于从服务器获取信息。\n\
  *   `doPost()` – 用于向服务器提交信息。\n*   `doPut()` – 方法类似于 doPost，但与 doPost 向服务器发送信息不同，此方法向服务器发送文件，类似于\
  \ FTP 操作。\n*   `doDelete()` – 允许客户端从服务器删除文档、网页或信息。\n*   `init()` 和 `destroy()` –\
  \ 用于管理 Servlet 生命周期内保留资源。\n*   `getServletInfo()` – 返回有关 Servlet 的信息，如作者、版本和版权。\n\
  \n在 Http Servlet 中不需要重写 `service()` 方法，因为该方法会将 HTTP 请求分发到正确的方法处理器，例如，如果它接收到 HTTP\
  \ GET 请求，会将请求分发到 `doGet()` 方法。\n\n![](img/image00421.jpeg)\n\n### javax.servlet\
  \ 中的接口\n\n*   `Servlet`\n*   `ServletRequest`\n*   `ServletResponse`\n*   `ServletConfig`\n\
  *   `ServletContext`\n*   `SingleThreadModel`\n*   `RequestDispatcher`\n*   `ServletRequestListener`\n\
  *   `ServletRequestAttributeListener`\n*   `ServletContextListener`\n*   `ServletContextAttributeListener`\n\
  *   `Filter`\n*   `FilterConfig`\n*   `FilterChain`\n\n### javax.servlet 中的类\n\n\
  *   `GenericServlet`\n*   `ServletInputStream`\n*   `ServletOutputStream`\n*   `ServletException`\n\
  *   `ServletRequestWrapper`\n*   `ServletRequestEvent`\n*   `ServletResponseWrapper`\n\
  *   `ServletContextEvent`\n*   `ServletRequestAttributeEvent`\n*   `ServletContextAttributeEvent`\n\
  \n### javax.servlet.http 中的接口\n\n*   `HttpSession`\n*   `HttpServletRequest`\n*\
  \   `HttpServletResponse`\n*   `HttpSessionAttributeListener`\n*   `HttpSessionListener`\n\
  *   `HttpSessionBindingListener`\n*   `HttpSessionActivationListener`\n*   `HttpSessionContext`\n\
  \n### javax.servlet.http 中的类\n\n*   `HttpServlet`\n*   `Cookie`\n*   `HttpSessionEvent`\n\
  *   `HttpSessionBindingEvent`\n*   `HttpServletRequestWrapper`\n*   `HttpServletResponseWrapper`\n\
  *   `HttpUtils`\n\n\n\n\n\n# 结合示例详解 Servlet 接口\n\n在我上关于 Servlet API 的指南中，我已经解释了要创建任何\
  \ Servlet，你必须直接或间接地实现 `Servlet` 接口（间接实现意味着扩展实现了 `Servlet` 接口的类，这些类是 `GenericServlet`\
  \ 和 `HttpServlet`）。\n\n如果你正在创建一个依赖于协议的 servlet（例如 `http servlet`），那么你应该扩展 `HttpServlet`\
  \ 类；否则，对于协议无关的 `Servlet`，你扩展 `GenericServlet` 类。\n\n在本份指南中，我将不会详细解释 `GenericServlet`\
  \ 和 `HttpServlet`，因为我已经在单独的指南中涵盖了它们。\n\n编辑：这里是那些指南的链接：GenericServlet | HttpServlet。\n\
  \n简而言之，你有 3 种创建 servlet 的方式：\n\n1) 扩展 `HttpServlet` 类\n2) 扩展 `GenericServlet` 类\n\
  3) 实现 `Servlet` 接口\n\n注意：无论如何，你应该始终优先第一种创建 servlet 的方式，即通过扩展 `HttpServlet` 类。\n\n\
  ## Servlet 接口方法\n\n这里是 `Servlet` 接口可用方法列表。\n\n1) `Void destroy()`：此方法由 Servlet 容器在\
  \ servlet 生命周期。结束时调用。与在生命周期内被调用多次的 `service()` 方法不同，此方法在整个生命周期内由 Servlet 容器调用一次。一旦\
  \ `destroy()` 方法被调用，Servlet 容器就不会为该 servlet 调用 `service()` 方法。\n\n2) `Void init(ServletConfig\
  \ config)`：当 Servlet 容器启动时（发生在 Web 服务器启动时），它会加载所有 servlet 并实例化它们。在对每个实例化的 servlet\
  \ 调用 `init()` 方法后，该方法将初始化该 servlet。\n\n3) `Void service(ServletRequest req, ServletResponse\
  \ res)`：这是 servlet 生命周期期间唯一被调用多次的方法。此方法处理客户端请求，每当服务器接收到请求就会调用一次。\n\n4) `ServletConfig\
  \ getServletConfig()`：返回一个 `ServletConfig` 对象，该对象包含此 servlet 的初始化和启动参数。\n\n5) `Java.lang.String\
  \ getServletInfo()`：返回关于 servlet 信息，如作者、版本和版权。\n\n## 示例：\n\n在这个示例中，我们通过扩展 `Servlet`\
  \ 接口创建了一个 servlet 类。\n\n### index.html\n```html\n<a href=\"welcome\">点击这里调用 servlet</a>\n\
  ```\n\n### DemoServlet.java\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
  \npublic class DemoServlet implements Servlet {\n\n    ServletConfig config=null;\n\
  \n    public void init(ServletConfig config) {\n        this.config=config;\n  \
  \      System.out.println(\"Initialization complete\");\n    }\n\n    public void\
  \ service(ServletRequest req,ServletResponse res)\n            throws IOException,ServletExceptionException\
  \ {\n        res.setContentType(\"text/html\");\n        PrintWriter pwriter=res.getWriter();\n\
  \        pwriter.print(\"<html>\");\n        pwriter.print(\"<body>\");\n      \
  \  pwriter.print(\"<h1>Servlet Example Program</h1>\");\n        pwriter.print(\"\
  </body>\");\n        pwriter.print(\"</html>\");\n    }\n\n    public void destroy()\
  \ {\n        System.out.println(\"servlet life cycle finished\");\n    }\n\n   \
  \ public ServletConfig getServletConfig() {\n        return config;\n    }\n\n \
  \   public String getServletInfo() {\n        return \"A Demo program written by\
  \ Chandru\";\n    }\n}\n```\n\n### web.xml\n```xml\n<web-app>\n<servlet>\n    <servlet-name>Javabook</servlet-name>\n\
  \    <servlet-class>DemoServlet</servlet-class>\n</servlet>\n<servlet-mapping>\n\
  \    <servlet-name>Javabook</servlet-name>\n    <url-pattern>/welcome</url-pattern>\n\
  </servlet-mapping>\n</web-app>\n```\n\n## GenericServlet 类\n\n### 示例的 GenericServlet\
  \ 类\n\n在讨论 Servlet API 时，我简要提到了 Generic Servlet。在本文，我将详细讨论 Generic Servlet。\n\n\
  Generic servlet 是一种协议无关的 Servlet，它应该始终重写 `service()` 方法来处理客户端请求。`service()` 方法接受两个参数：`ServletRequest`\
  \ 对象和 `ServletResponse` 对象。请求对象告诉 servlet 客户端提出的请求，而响应对象则用于向客户端返回响应。\n\n### Generic\
  \ Servlet 如何工作？\n\n![](img/image00422.jpeg)\n\n### Generic Servlet 的层级结构\n`java.lang.Object`\n\
  |_ 扩展 `javax.servlet.GenericServlet`\n\n`GenericServlet` 是一个抽象类，它只有一个抽象方法，即 `service()`。这就是为什么当我们通过扩展\
  \ `GenericServlet` 类创建 Generic Servlet 时，我们必须重写 `service()` 方法。\n\n**使用 Generic\
  \ Servlet 的优点：**\n1. Generic Servlet 更更容易编写\n2. 具有简单的生命周期方法\n3. 编写 Generic Servlet\
  \ 只需要扩展 `javax.servlet.GenericServlet` 并重写 `service()` 方法（查看下例所示）。\n\n**使用 Generic\
  \ Servlet 的缺点：**\n使用 Generic Servlet 并不那么简单，因为在 Generic Servlet 中我们没有像在 Http Servlet\
  \ 中可以使用的那些 `doGet()`、`doPost()`、`doHead()` 等便利方法。 \n\n在 `HttpServlet` 中，我们需要为特定的请求重写特定的便利方法，例如，如果你需要获取信息，则重写\
  \ `doGet()`；如果你想向服务器发送信息，则重写 `doPost()`。然而，在 Generic Servlet 中，我们只为每个请求重写 `service()`\
  \ 方法。我始终建议使用 `HttpServlet` 而不是 `GenericServlet`。\n\n### GenericServlet 示例\n\n我在示例中使用\
  \ Eclipse。从 Eclipse 菜单创建“Dynamic Web Project”。\n\n注意：返回 Servlet Interface\n注意：如果你不熟悉\
  \ Eclipse，参考此指南：如何安装 Eclipse\n\n完成创建文件后，项目结构如下：\n![](img/image423)\n\n### index.html\n\
  我们创建一个点击网页链接时调用 servlet 的 html 文件。在 `WebContent` 文件夹中创建此文件。文件的路径应该是：`WebContent/index.html`\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Http\
  \ Servlet Demo</title>\n</head>\n<body>\n<a href=\"welcome\">Servlet</a>\n</body>\n\
  </html>\n```\n\n### ExampleGeneric.java\n现在，我们通过扩展 `GenericServlet` 类创建一个 Generic\
  \ Servlet。创建 GenericServlet 时，你应该始终重写 `service()` 方法。右键点击 `src` 文件夹并创建一个新类，文件名命名为\
  \ `ExampleGeneric`。文件路径应该是：`Java Resources/src/default package/ExampleGeneric.java`\n\
  \n```java\nimport java.io.*;\nimport javax.servlet.*;\n\npublic class ExampleGeneric\
  \ extends GenericServlet {\n\n    public void service(ServletRequest req,ServletResponse\
  \ res) throws IOException, ServletException {\n        res.setContentType(\"text/html\"\
  );\n        PrintWriter pwriter=res.getWriter();\n        pwriter.print(\"<html>\"\
  );\n        pwriter.print(\"<body>\");\n        pwriter.print(\"<h2>Generic Servlet\
  \ Example</h2>\");\n        pwriter.print(\"<p>Hello JavaBook Readers!</p>\");\n\
  \        pwriter.print(\"</body>\");\n        pwriter.print(\"</html>\");\n    }\n\
  }\n```\n\n### web.xml\n此文件位于路径 `WebContent/WEB-INF/web.xml`。在此文件中，我们将 Servlet 映射到特定的\
  \ URL。由于点击 `index.html` 页面上的链接会调用欢迎页面，因此我们将欢迎页面映射到我们创建的 Servlet 类。\n\n```xml\n<web-app>\n\
  <display-name>JavaBookServlet</display-name>\n<welcome-file-list>\n<welcome-file>index.html</welcome-file>\n\
  <welcome-file>index.htm</welcome-file>\n<welcome-file>index.jsp</welcome-file>\n\
  <welcome-file>default.html</welcome-file>\n</welcome-file-list>\n</web-app>\n```\n\
  \n\n\n\n```xml\n<web-app>\n  <welcome-file-list>\n    <welcome-file>default.htm</welcome-file>\n\
  \    <welcome-file>default.jsp</welcome-file>\n  </welcome-file-list>\n  <servlet>\n\
  \    <servlet-name>MyHttpServlet</servlet-name>\n    <servlet-class>ExampleHttpServlet</servlet-class>\n\
  \  </servlet>\n  <servlet-mapping>\n    <servlet-name>MyHttpServlet</servlet-name>\n\
  \    <url-pattern>/welcome</url-pattern>\n  </servlet-mapping>\n</web-app>\n```\n\
  \n运行项目：\n\n右键点击 `index.html`，在服务器上运行（run on server）。\n\n输出：\n\n![](img/image00424.jpeg)\n\
  \n# 点击第一个屏幕中的链接后的界面：\n\n# Generic Servlet 示例\n\n# Hello Javabook 的读者们\n\n## GenericServlet\
  \ 类的方法：\n\n这里是 `GenericServlet` 类所有方法的列表。\n\n1. `public void init()`: 这是一个方便的方法。可以重写此方法，这样就不需要调用\
  \ `super.init(config)`。\n2. `public void init(ServletConfig config)`: 由 Servlet\
  \ 容器调用，表示 servlet 正在进入服务状态，此方法用于初始化 servlet。\n3. `public String getInitParameter(String\
  \ name)`: 返回一个包含给定初始化参数值的字符串，如果该参数不存在则返回 null。\n4. `public Enumeration getInitParameterNames()`:\
  \ 返回 `web.xml` 文件中定义的所有参数名称，如果 `web.xml` 中没有任何参数，则返回 null。\n5. `public abstract\
  \ void service(ServletRequest request, ServletResponse response)`: 由 Servlet 容器调用，允许\
  \ servlet 响应客户端提出的请求。\n6. `public void destroy()`: 在 servlet 生命周期结束时由 servlet 容器调用一次，表示\
  \ servlet 正在被销毁。\n7. `public ServletConfig getServletConfig()`: 返回初始化此 servlet 的\
  \ `ServletConfig` 对象。\n8. `public String getServletInfo()`: 返回关于 servlet 的信息。\n\
  9. `public ServletContext getServletContext()`: 返回由 `init` 方法传递给此 servlet 的 `ServletContext`\
  \ 对象。\n10. `public String getServletName()`: 返回 servlet 实例的名称。\n11. `public void\
  \ log(String msg)`: 在 servlet 日志文件中写入给的消息。\n12. `public void log(String msg, Throwable\
  \ t)`: 在 servlet 日志文件中写入解释性消息，包括描述错误或异常的字符串。\n\n## 带有示例的 HttpServlet 类\n\n与 `Generic\
  \ Servlet` 不同，`HTTP Servlet` 没有重写 `service()` 方法。相反，它重写了 `doGet()` 方法或 doPost()`\
  \ 方法或两者。`doGet()` 方法用于从服务器获取信息，而 `doPost()` 方法用于向服务器发送信息。\n\n在 `Http Servlet` 中，没有需要重写\
  \ `service()` 方法，因为该方法会将 `Http Requests` 分发到正确的方法处理器，例如，如果它接收到 HTTP GET 请求，它会将请求分发给\
  \ `doGet()` 方法。\n\n## Http Servlet 如何工作？\n\n如如下图所示，客户端（用户浏览器）发出请求。这些请求可以是任何类型，例如——Get\
  \ 请求、Post 请求、Head 请求等。服务器将这些请求分发到 servlet 的 `service()` 方法，该方法将这些请求分发给正确的处理器，例如，如果它接收到\
  \ Get 请求，它将分发给 `doGet()` 方法。\n\n![](img/image00425.jpeg)\n\n## Http Servlet 的层次结构\n\
  \n`java.lang.Object`\n|_ 由 `javax.servlet.GenericServlet` 扩展\n|_ 由 `javax.servlet.http.HttpServlet`\
  \ 扩展\n\n我在 Generic Servlet 文章中讨论过，你应该始终使用 `HttpServlet` 而不是 `GenericServlet`。`HttpServlet`\
  \ 更容易操作，并且比 `GenericServlet` 有更多方法可以处理。\n\n## Http Servlet 示例\n\n我在此示例中使用 Eclipse\
  \ IDE。从 Eclipse 文件菜单中创建一个新的“Dynamic Web Project”（动态 Web 项目）。\n\n注意：我已解释了在 Eclipse\
  \ IDE 中创建 Servlet 的所有步骤，但如果你不熟悉 Eclipse 且系统中没有安装它，请参考此指南：如何安装 Eclipse、配置 Tomcat\
  \ 并使用 Eclipse 运行你的第一个 Servlet 应用程序。\n\n一旦你在 IDE 中创建了以下所有文件，项目结构（或说层次结构）将看起来如下所示：\n\
  \n![](img/image00426.jpeg)\n\n### index.html\n\n我们正在创建一个 html 文件，当我们点击网页上的链接时，它将调用\
  \ servlet。在 `WebContent` 文件夹中创建此文件。文件路径应该如下所示：`WebContent/index.html`\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Http Servlet\
  \ Demo</title>\n</head>\n<body>\n  <a href=\"welcome\">Click to call Servlet</a>\n\
  </body>\n</html>\n```\n\n### ExampleHttpServlet.java\n\n现在，我们正通过扩展 `HttpServlet`\
  \ 类来创建一个 `Http Servlet`。右键点击 `src` 文件夹并创建一个新类文件，文件名为 `ExampleHttpServlet`。文件路径应该如下所示：`Java\
  \ Resources/src/default package/ExampleHttpServlet.java`。\n\n```java\nimport java.io.*;\n\
  import javax.servlet.*;\nimport javax.servlet.http.*;\n\n// 通过扩展 HttpServlet 类创建\
  \ Http Servlet\n\npublic class ExampleHttpServlet extends HttpServlet {\n    private\
  \ String mymsg;\n\n    public void init() throws ServletException {\n        mymsg\
  \ = \"Http Servlet\";\n    }\n\n    public void doGet(HttpServletRequest request,\
  \ HttpServletResponse response) throws ServletException, IOException {\n       \
  \ // 设置网页的内容类型\n        response.setContentType(\"text/html\");\n        // 在网页上写入消息\n\
  \        PrintWriter out = response.getWriter();\n        out.println(\"<h1>\" +\
  \ mymsg + \"</h1>\");\n        out.println(\"<p>\" + \"Hello Friends!\" + \"</p>\"\
  );\n    }\n\n    public void destroy() {\n        // 如果你想在 servlet 生命周期结束时执行某些操作，请留空此处。\n\
  \    }\n}\n```\n\n### web.xml\n\n该文件位于 `WebContent/WEB-INF/web.xml`。在此文件中我们将 servlet\
  \ 映射到特定的 URL。我们在点击 index.html 上的链接时调用它。\n\n```xml\n<web-app>\n  <display-name>JavaBookServlet</display-name>\n\
  \  <welcome-file-list>\n    <welcome-file>index.html</welcome-file>\n    <welcome-file>index.htm</welcome-file>\n\
  \    <welcome-file>index.jsp</welcome-file>\n    <welcome-file>default.html</welcome-file>\n\
  \    <welcome-file>default.htm</welcome-file>\n    <welcome-file>default.jsp</welcome-file>\n\
  \  </welcome-file-list>\n  <servlet>\n    <servlet-name>MyHttpServlet</servlet-name>\n\
  \    <servlet-class>ExampleHttpServlet</servlet-class>\n  </servlet>\n  <servlet-mapping>\n\
  \    <servlet-name>MyHttpServlet</servlet-name>\n    <url-pattern>/welcome</url-pattern>\n\
  \  </servlet-mapping>\n</web-app>\n```\n\n## HttpServlet 类的方法：\n\n1. `protected\
  \ void doGet(HttpServletRequest req, HttpServletResponse resp)`: 此方法由 servlet service\
  \ 方法调用，处理来自客户端的 HTTP 请求。重写此方法时，读取请求数据，写入响应头，获取响应的 writer 或输出流对象，最后写入响应数据。\n2. `protected\
  \ long getLastModified(HttpServletRequest req)`: 返回一个长型整数，指定 `HttpServletRequest`\
  \ 对象最后修改的时间，自 GMT 1970 年 1 月 1 日午夜以来的毫秒数，如果时间未知则返回 -1。\n3. `protected void doHead(HttpServletRequest\
  \ req, HttpServletResponse resp)`: 此方法由 servlet service 方法调用，处理来自客户端的 HTTP HEAD\
  \ 请求。当客户端只想查看响应的头信息（例如 Content-Type 或 Content-Length）时，它会发送 HEAD 请求。\n\n\n\n\n\n\
  4. `protected void doPost(HttpServletRequest req, HttpServletResponse resp)`: 此方法由\
  \ servlet 服务方法调用，用于处理来自客户端的 POST 请求。HTTP POST 方法允许客户端一次向 Web 服务器发送无长度限制的数据，在向服务器提交信息时非常有用。与我们从服务器获取信息的\
  \ `doGet` 不同，此方法用于将信息从客户端传输到服务器。\n\n5. `protected void doPut(HttpServletRequest\
  \ req, HttpServletResponse resp)`: 此方法由 servlet 服务方法调用，用于处理来自客户端的 PUT 请求。此方法与 `doPost`\
  \ 方法类似，但与向服务器发送信息的 `doPost` 方法不同的是，此方法是将文件发送到服务器，这类似于从客户端到服务器的 FTP 操作。\n\n6. `protected\
  \ void doDelete(HttpServletRequest req, HttpServletResponse resp)`: 由 `service()`\
  \ 方法调用，处理来自客户端的 DELETE 请求，允许客户端从服务器删除文档、网页或信息。\n\n7. `protected void doOptions(HttpServletRequest\
  \ req, HttpServletResponse resp)`: 由服务方法调用，允许 servlet 处理 OPTIONS 请求。OPTIONS 请求确定服务器支持哪些\
  \ HTTP 方法并返回相应的头信息。\n\n8. `protected void doTrace(HttpServletRequest req, HttpServletResponse\
  \ resp)`: 此方法由 `service()` 方法调用以处理 TRACE 请求。用于调试。\n\n9. `protected void service(HttpServletRequest\
  \ req, HttpServletResponse resp)`: 无需重写此方法，此方法接收来自客户端的 HTTP 请求并将其转发到相应的 `doXXX`\
  \ 方法，如 `doGet()`、`doPost()`、`doHead()` 等。\n\n10. `public void service(ServletRequest\
  \ req, ServletResponse res)`: 将客户端请求转发到保护的 service 方法。此方法也无需重写。\n\n## 注意\n\n从此处返回\n\
  \nServlet 接口\n\n## 如何在 Eclipse IDE 中创建和运行 Servlet\n\n这是一份关于安装 Eclipse、配置 apache\
  \ tomcat 服务器以及运行你的第一个 hello world Servlet 应用程序的完整指南。\n\n## 注意\n\n从此处返回：\n\nGeneric\
  \ Servlet\n\nHttpServlet 类\n\n## 下载 Eclipse IDE\n\n### 在 Windows 上安装 Eclipse\n\n\
  访问此链接 `https://www.eclipse.org/downloads`。在“Get Eclipse Oxygen”下❯点击“Download Packages”❯下载“Eclipse\
  \ IDE for Java Developers”。你会在右侧看到两个选项（32 位和 64 位），如果你的系统是 32 位的点击 32 位，否则点击 64\
  \ 位。这将在系统上下载一个压缩文件。\n\n要安装 Eclipse，解压下载的文件并将解压后的文件夹复制到目标位置。\n\n### 在 Mac OS X 上安装\
  \ Eclipse\n\n访问此链接 `https://www.eclipse.org/downloads`。在“Get Eclipse Oxygen”下❯点击“Download\
  \ Packages”❯下载“Eclipse IDE for Java Developers”。点击 64 位即可下载一个 TAR 文件。\n\n下载完成后，双击\
  \ TAR 文件，它会将文件内容提取到文件夹。将该文件夹拖到“Applications”文件夹。\n\n要启动 Eclipse，点击 Eclipse 文件夹中的\
  \ Eclipse 图标。Mac 用户可以将其拖到 dock 栏区域，以便从桌面上快速启动 Eclipse；类似地，Windows 可以在桌面上创建 Eclipse\
  \ 的快捷方式。\n\n## 在 Eclipse 中安装和配置 Apache tomcat 服务器\n\n为了在 Eclipse IDE 中运行 Servlet，你需要在\
  \ Eclipse IDE 中配置 Apache tomcat 服务器。\n\n如果你还没有，请参考此教程：如何在 Eclipse IDE 中下载和配置 Apache\
  \ Tomcat 服务器\n\n注意：我上面提供的链接属于 JSP 教程，但对于 Servlet 步骤是相同的。\n\n## 在 Eclipse IDE 中创建\
  \ Servlet\n\n### 第 1 步：创建项目\n\n让我们在 Eclipse 中创建一个 Servlet 应用程序。打开 Eclipse，点击 File（文件）❯New（新建）❯点击\
  \ Dynamic Web Project（动态 Web 项目）。\n\n![](img/image00427.jpeg)\n\n如果你在 Eclipse 中没有看到\
  \ dynamic web project 选项，请参考此教程：如何解决 Eclipse 中缺少“Dynamic Web project”的问题](#part0000.xhtml_dynammic)\n\
  \n输入项目名称并点击 Next（下一步）。\n\n![输入项目名称](img/image00428.jpeg)\n\n勾选“Generate web.xml\
  \ deployment descriptor”复选框。\n\n![生成 web xml](img/image00429.jpeg)\n\n####初始项目结构：\n\
  \n项目创建后，层次结构（项目结构）将如下：\n\n![Eclipse 中的初始项目层次结构](img/image00430.jpeg)\n\n### 第 2\
  \ 步：创建 Servlet 类\n\n我们通过扩展 `HttpServlet` 类来创建 Http Servlet。右键点击 `src` 文件夹并创建一个新的类文件，文件名命名为\
  \ `MyServletDemo`。文件路径应如下：`Java Resources/src/default package/MyServletDemo.java`。\n\
  \n![新建 Servlet 类](img/image00431.jpeg)\n\n#### MyServletDemo.java\n\n```java\nimport\
  \ java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\n// 扩展 HttpServlet\
  \ 类创建 Http Servlet\npublic class MyServletDemo extends HttpServlet {\n    private\
  \ String mymsg;\n\n    public void init() throws ServletException {\n        mymsg\
  \ = \"Hello World!\";\n    }\n\n    public void doGet(HttpServletRequest request,\
  \ HttpServletResponse response)\n        throws ServletException, IOException {\n\
  \        // 设置网页的类型类型\n        response.setContentType(\"text/html\");\n       \
  \ // 将消息写入网页\n        PrintWriter out = response.getWriter();\n        out.println(\"\
  <h1>\" + mymsg + \"</h1>\");\n    }\n\n    public void destroy() {\n        /* 留空，当\
  \ Servlet 生命周期\n         * 结束时需要执行某些操作\n         */\n    }\n}\n```\n\n### 第 3 步：创建一个\
  \ html 页面来调用 servlet 类\n\n我们创建一个在网页上调用 servlet 的 html 文件。将此文件创建在 `WebContent` 文件夹中。文件的路径应该是：`WebContent/index.html`。\n\
  \n### index.html\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"\
  UTF-8\">\n    <title>JavaBook Demo</title>\n</head>\n<body>\n    <a href=\"welcome\"\
  >调用 Servlet</a>\n</body>\n</html>\n```\n\n#### 编辑 web.xml 文件\n\n此文件位于 `WebContent/WEB-INF/web.xml`。在此文件中我们将\
  \ Servlet 映射到特定 URL。由于我们在 index.html 页面点击链接进入欢迎页面，因此我们将欢迎页面映射到创建的 Servlet 类。\n\n\
  ```xml\n<web-app>\n    <display-name>JavaBookDemo</display-name>\n    <welcome-file-list>\n\
  \        <welcome-file>index.html</welcome-file>\n        <welcome-file>index.htm</welcome-file>\n\
  \        <welcome-file>index.jsp</welcome-file>\n        <welcome-file>default.html</welcome-file>\n\
  \        <welcome-file>default.htm</welcome-file>\n        <welcome-file>default.jsp</welcome-file>\n\
  \    </welcome-file-list>\n    <servlet>\n        <servlet-name>MyHttpServletDemo</servlet-name>\n\
  \        <servlet-class>MyServletDemo</servlet-class>\n    </servlet>\n    <servlet-mapping>\n\
  \        <servlet-name>MyHttpServletDemo</servlet-name>\n        <url-pattern>/welcome</url-pattern>\n\
  \    </servlet-mapping>\n</web-app>\n```\n\n#### 最终项目结构\n\n![](img/image00432.jpeg)\n\
