    age\" :\"28\"\n};\n```\n\n#### Features of JSON:\n* It is light-weight\n* It is\
    \ language independent\n* Easy to read and write\n* Text based, human readable\
    \ data exchange format\n\n## Why use JSON?\n**Standard Structure:** As we have\
    \ seen so far that JSON objects are having a standard structure that makes developers\
    \ job easy to read and write code, because they know what to expect from JSON.\n\
    \n**Light weight:** When working with AJAX, it is important to load the data quickly\
    \ and asynchronously without requesting the page re-load. Since JSON is light\
    \ weighted, it becomes easier to get and load the requested data quickly.\n\n\
    **Scalable:** JSON is language independent, which means it can work well with\
    \ most of the modern programming language. Let’s say if we need to change the\
    \ server side language, in that case it would be easier for us to go ahead with\
    \ that change as JSON structure is same for all the languages.\n\n## JSON vs.\
    \ XML\nLet see how JSON and XML look when we store the records of 4 students in\
    \ a text based format so that we can retrieve it later when required.\n\n**JSON\
    \ style:**\n```json\n{\"students\":[\n  {\"name\":\"John\", \"age\":\"23\", \"\
    city\":\"Agra\"},\n  {\"name\":\"Steve\", \"age\":\"28\", \"city\":\"Delhi\"},\n\
    \  {\"name\":\"Peter\", \"age\":\"32\", \"city\":\"Chennai\"},\n  {\"name\":\"\
    Chandru\", \"age\":\"28\", \"city\":\"Bangalore\"}\n]}\n```\n\n**XML style:**\n\
    ```xml\n<students>\n <student>\n <name>John</name> <age>23</age> <city>Agra</city>\n\
    \ </student>\n <student>\n <name>Steve</name> <age>28</age> <city>Delhi</city>\n\
    \ </student>\n <student>\n <name>Peter</name> <age>32</age> <city>Chennai</city>\n\
    \ </student>\n <student>\n <name>Chandru</name> <age>28</age> <city>Bangalore</city>\n\
    \ </student>\n</students>\n```\nAs you can clearly see JSON is much more light-weight.\n\
    \n## JSON data structures and how to read them:\n### 1. JSON objects\nIn the above\
    \ example we have stored the information an object:\n```javascript\nvar chandru\
    \ = {\n \"name\" : \"Chandru\",\n \"age\" : \"28\",\n \"website\" : \"Javabook\"\
    \n};\n```\nTo access the information out of object we do like this:\n```javascript\n\
    document.writln(\"The name is: \" + chandru.name);\ndocument.writln(\"his age\
    \ is: \" + chandru.age);\ndocument.writln(\"his website is: \"+ chandru.website);\n\
    ```\n\n### 2. JSON objects in array\nSuppose we want to store the information\
    \ of more than one person we can have array:\n```javascript\nvar students = [{\n\
    \ \"name\" : \"Steve\",\n \"age\" : \"29\",\n \"gender\" : \"male\"\n},\n{\n \"\
    name\" : \"Peter\",\n \"age\" : \"32\",\n \"gender\" : \"male\"\n},\n{\n \"name\"\
    \ : \"Sophie\",\n \"age\" : \"27\",\n \"gender\" : \"female\"\n}];\n```\nTo access\
    \ the array we do like this:\n```javascript\ndocument.writeln(students[0].age);\
    \ //output would be: 29\ndocument.writeln(students[2].name); //output: Sophie\n\
    ```\n\n### 3. Nesting of JSON objects\nAnother way of doing the same thing that\
    \ we have above:\n```javascript\nvar students = {\n \"steve\" : {\n \"name\" :\
    \ \"Steve\",\n \"age\" : \"29\",\n \"gender\" : \"male\"\n},\n\"pete\" : {\n \"\
    name\" : \"Peter\",\n \"age\" : \"32\",\n \"gender\" : \"male\"\n},\n\"sop\" :\
    \ {\n \"name\" : \"Sophie\",\n \"age\" : \"27\",\n \"gender\" : \"female\"\n}\n\
    }\n```\nDo like this to access the info from above nested objects:\n```javascript\n\
    document.writln(students.steve.age); //output: 29\ndocument.writeln(students.sop.gender);\
    \ //output: female\n```\n\n## JSON & JavaScript\nJSON is considered as a subset\
    \ of JavaScript but that does not mean that JSON cannot be used with other languages.\
    \ In fact it works well with PHP, Perl, Python, Ruby, Java, Ajax and many more.\n\
    \nTo demonstrate how JSON can be used along with JavaScript, here is an example:\n\
    If you have gone though the above tutorial, you are familiar with the JSON structures.\
    \ A JSON file type is .json\n\nHow to read data from json file and convert it\
    \ into a JavaScript object?\nWe have two ways to do this.\n\n1. Using `eval` function,\
    \ but this is not suggested due to security reasons (malicious data can be sent\
    \ from the server to the client and then `eval` in the client script with harmful\
    \ effects).\n2. Using `JSON.parse`: No security issues plus it is faster than\
    \ `eval`. Here is how to use it:\n```javascript\nvar chandru = {\n\"name\" : \"\
    Chandru\",\n\"age\" : \"28\",\n\"website\" : \"Javabook\"\n};\n```\nWe are converting\
    \ the above JSON object to javascript object using `JSON.parse`:\n```javascript\n\
    var myJSObject = JSON.parse(chandru);\n```\n\nHow to convert JavaScript object\
    \ to JSON text?\nBy using method `stringify`:\n```javascript\nvar jsonText= JSON.stringify(myJSObject);\n\
    ```\n\n# SERVLET TUTORIAL\n### Servlet Introduction\nServlet is a java program\
    \ that runs inside JVM on the web server. It is used for developing dynamic web\
    \ applications.\n"
