    Session Implicit Object in JSP with examples


    Session is most frequently used implicit object in JSP. The main usage of it to
    gain access to all the user’s data till the user session is active.


    Methods of session Implicit Object


    1.  setAttribute(String, object) –  This method is used to save an object in session
    by assigning a unique string to the object. Later, the object can be accessed
    from the session by using the same String till the session is active. setAttribute
    and getAttribute are the two most frequently used methods while dealing with session
    in JSP.


    2.  getAttribute(String name) – The object stored by setAttribute method is fetched
    from session using getAttribute method. For example if we need to access userid
    on every jsp page till the session is active then we should store the user-id
    in session using setAttribute method and can be accessed using getAttribute method
    whenever needed.


    3.  removeAttribute(String name) – The objects which are stored in session can
    be removed from session using this method. Pass the unique string identifier as
    removeAttribute’s method.


    4.  getAttributeNames – It returns all the objects stored in session. Basically,
    it results in an enumeration of objects.


    5.  getCreationTime – This method returns the session creation time, the time
    when session got initiated (became active).


    6.  getId – Servlet container assigns a unique string identifier to session while
    creation of it. getIdmethod returns that unique string identifier.


    7.  isNew() – Used to check whether the session is new. It returns Boolean value
    (true or false). Mostly used to track whether the cookies are enabled on client
    side. If cookies are disabled the session.isNew() method would always return true.


    8.  invalidate() – It kills a session and breaks the association of session with
    all the stored objects.


    9.  getMaxInactiveInterval – Returns session’s maximum inactivate time interval
    in seconds.


    10.  getLastAccessedTime – Generally used to know the last accessed time of a
    session.


