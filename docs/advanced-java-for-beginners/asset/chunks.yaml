    ## 10. language


    It specifies the scripting language( underlying language) being used in the page.


    ### Syntax of language:

    ```jsp

    <%@ page language="value"%>

    ```

    `value` is scripting language here.


    ### Example of language attribute:

    ```jsp

    <%@ page language="java"%>

    ```


    ## 11. AutoFlush


    If it is `true` it means the buffer should be flushed whenever it is full. `false`
    will throw an exception when buffer overflows.


    **Default value:** `True`


    ### Syntax of autoFlush:

    ```jsp

    <%@ page autoFlush="value"%>

    ```

    `value` can be `true` or `false`.


    ### Example of autoFlush attribute:

    Buffer will be flushed out when it is full –

    ```jsp

    <%@ page autoFlush="true"%>

    ```

    It will throw an exception when buffer is full due to overflow condition

    ```jsp

    <%@ page autoFlush="true"%>

    ```


    ## 12. isScriptingEnabled


    It has been dropped and not in use.


    ## 13. isELIgnored


    This attribute specify whether expressions will be evaluated or not.


    **Default value:** `true`


    ### Syntax of isELIgnored:

    ```jsp

    <%@ page isELIgnored="value"%>

    ```

    `value` can be `true` or `false`.


    ### Example of is ELIgnored attribute:

    Any expression present inside JSP page will not be evaluated –

    ```jsp

    <%@ page isELIgnored="false"%>

    ```

    Expression will be evaluated (`true` is a default value so no need to specify)-

    ```jsp

    <%@ page isELIgnored="true"%>

    ```


    ## 2) Include Directive


    Include directive is used to copy the content of one JSP page to another. It’s
    like including the code of one file into another.


    ### Syntax:

    ```jsp

    <%@include file ="value"%>

    ```

    Here `value` is the JSP file name which needs to be included. If the file is in
    the same directory then just specify the file name otherwise complete URL (or
    `path`) needs to be mentioned in the `value` field.


    **Note:** It can be used anywhere in the page.


    ### Example:

    ```jsp

    <%@include file="myJSP.jsp"%>

    ```

    You can use the above code in your JSP page to copy the content of `myJSP.jsp`
    file. However in this case both the JSP files must be in the same directory. If
    the `myJSP.jsp` is in the different directory then instead of just file name you
    would need to specify the complete path in above code.


    ### Must Read: [Include Directive in detail in JSP](http://example.com) (placeholder-link)


    ## Include Directive in detail in JSP


    Include directive is used for merging external files to the current JSP page during
    translation phase (The phase where JSP gets converted into the equivalent Servlet).


    ### Why we need to use the include directive? Can’t we simply add the file’s content
    in the current JSP instead of using the directive?


    We can copy the content of external file and paste it in the main JSP,however
    it would not be a good practice. Let’s understand this with the help of an example
    – I have 100 external files and 1 main JSP file. If I just copy the content of
    all files in the main JSP then I have to edit it whenever there is a change in
    any of the external file, instead we can include all files using directive and
    edit the particular file whenever needed.


    Also, by using include directive you can enhance the code re-usability – Suppose
    there is a certain code or data which needs to be there in all the JSP pages of
    your application then you can simply have that code/data in one file and include
    the file in all the JSP pages.


    The above two reasons can be considered as advantages of using include directive.


    ### Syntax:

    This is the syntax of include directive in JSP.

    ```jsp

    <%@ include file="URL of the file" %>

    ```

    We must need to specify relative URL –

    If file is in the same folder where the current JSP page resides then we can just
    mention the file name else the relative path to the file needs to be specified.


    ### Include Directive Example


    **index.jsp**

    ```jsp

    <html>

    <head>

    <title>Main JSP Page</title>

    </head>

    <body>

    <%@ include file="file1.jsp" %>

    Main JSP Page: Content between two include directives.

    <%@ include file="file2.jsp" %>

    </body>

    </html>

    ```


    **file1.jsp**

    ```jsp

    <p  align="center">

    This is my File1.jsp and I will include it in index.jsp using include directive

    </p>

    ```


    **file2.jsp**

    ```jsp

    <p  align="center">

    This is File2.jsp

    </p>

    ```


    **Output:** The output would look like this when you run the above code. As you
    can see we have included the content of `file1` and `file2` in out main JSP page
    with the help of include directive.


    ![Include-Directive-example-output](Images/image0039.jpeg)


    ## 3) Taglib Directive


    This directive basically allows user to use Custom tags in JSP. we shall discuss
    about Custom tags in detail in coming JSP tutorials. Taglib directive helps you
    to declare custom tags in JSP page.


    ### Syntax:

    ```jsp

    <%@taglib uri ="taglibURI" prefix="tag prefix"%>

    ```

    Where `URI` is uniform resource locator, which is used to identify the location
    of custom tag and `tag prefix` is a string which can identify the custom tag in
    the location identified by `uri`.


    ### Example of Targlib:

    ```jsp

    <%@ taglib uri="http://www.sample.com/mycustomlib" prefix="demotag" %>

    <html>

    <body>

    <demotag:welcome/>

    </body>

    </html>

    ```

    As you can see that `uri` is having the location of custom tag library and `prefix`
    is identifying the prefix of custom tag.


    **Note:** In above example – `<demotag: welcome>` has a prefix `demotag`.


    ---


    ## JSTL


    ### JSTL functions and Core Tags-JSTL (JSP Standard Tag Lib) Tutorial


    JSTL stands for JSP standard tag Library which is a collection of very useful
    core tags and functions. These tags and functions help you write JSP efficiently.


    ## JSTL Core Tags


    Below is the collection of JSTL tags. Each tutorial is explained with screenshots.
    The following line must be present in order to use JSTL tags.

    ```jsp

    <%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>

    ```


    ### 1. <c:out> tag


    `<c:out>` is a JSTL core tag, which is used for displaying content on client.
    You may be wondering that a variable’s value and data can be displayed using Expression
    language(EL) then why do we need `<c:out>`? The difference is that `<c:out>` tag
    escapes XML markup but others don’t.


    ### Tag <c:out> Example


    In this example we are displaying a string on the browser, however we are using
    html tags and we want to see what would be the result.

    ```jsp

    <%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <html>

    <head>

    <title>c:out Example</title>

    </head>

    <body>

    <c:out value=''<b>This is a <c:out> example </b>''/>

    </body>

    </html>

    ```

    **Output:**

    <b>This is a <c:out> example </b>


    ### EscapeXml attribute of <c:out>


    Let us say I modify the above code like this – I have just added `escapeXml` attribute
    in the tag and marked it `false`. By default the value of `escapeXml` attribute
    is `true`. Since we have marked it as `false` it would not escape HTML/XML tags
    and the tags will work.

    ```jsp

    <c:out value=''<b>This is a <c:out> example </b>''}'' escapeXml="false"/>

    ```

    **Output:**

    ![](Images/image0400.jpeg)


    ### Attribute "default" of <c:out>


    Above we have seen `escapeXml` attribute of the `<c:out>` tag. There is another
    attribute `default` for this tag, which is used to display the fallback or default
    value in case the value of the `<c:out>` tag is `null`. Here is the example where
    we are trying to print the value of string `str` using the tag and since the string
    `str` value is `null`, the tag is printing the value set in `default` attribute.

    ```jsp

    <%! String str = null; %>

    <c:out value="${str}" default="default value of c:out"/>

    ```

    ![](Images/image0401.jpeg)


    ### 2. <c:set> tag


    `<c:set>` tag is useful for setting up a variable value in a specified scope.
    It basically evaluates an expression and sets the result in given variable.


    # JSTL <c:set> Core Tag


    `<c:set>` core JSTL tag is used for assigning a value to an object or variable
    within a specified scope. Let’s understand this with an example.

