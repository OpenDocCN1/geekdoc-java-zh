    \nCUSTOM TAGS\n\nCustom Tags\n\n*   Custom tags in JSP\n\n*   How to access the\
    \ body of custom tags\n\nJSP Custom tags with example\n\nUser-defined tags are\
    \ known as custom tags. In this tutorial we will see how to create a custom tag\
    \ and use it in JSP.\n\nTo create a custom tag we need three thing:\n\n1) Tag\
    \ handler class: In this class we specify what our custom tag will do when it\
    \ is used in a JSP page.\n\n2) TLD file: Tag descriptor file where we will specify\
    \ our tag name, tag handler class and tag attributes.\n\n3) JSP page: A JSP page\
    \ where we will be using our custom tag.\n\nExample:\n\nIn the below example we\
    \ are creating a custom tag MyMsg which will display the message “This is my own\
    \ custom tag” when used in a JSP page.\n\nTag handler class:\n\nA tag handler\
    \ class should implement Tag/IterationTag/ BodyTag interface or it can also extend TagSupport/BodyTagSupport/SimpleTagSupport class.\
    \ All the classes that support custom tags are present inside javax.servlet.jsp.tagext.\
    \ In the below we are extending the class SimpleTagSupport.\n\nDetails.java\n\n\
    package javabook.com;\n\nimport javax.servlet.jsp.tagext.*;\n\nimport javax.servlet.jsp.*;\n\
    \nimport java.io.*;\n\npublic  class  Details  extends  SimpleTagSupport {\n\n\
    \ public  void doTag() throws  JspException, IOException {\n\n /*This is just\
    \ to display a message, when\n\n       * we will use our custom tag. This message\n\
    \n       * would be displayed\n\n       */\n\n JspWriter  out = getJspContext().getOut();\n\
    \n out.println(\"This is my own custom tag\");\n\n   }\n\n}\n\nTLD File\n\nThis\
    \ file should present at the location: Project Name/WebContent/WEB-INF/ and it\
    \ should have a .tld extension.\n\nNote:\n\n<name> tag:custom tag name. In this\
    \ example we have given it as MyMsg\n\n<tag-class> tag: Fully qualified class\
    \ name. Our tag handler class Details.java is in package javabook.com so we have\
    \ given the value as javabook.com.Details.\n\nmessage.tld\n\n<taglib>\n\n <tlib-version>1.0</tlib-version>\n\
    \n <jsp-version>2.0</jsp-version>\n\n <short-name>My Custom Tag</short-name>\n\
    \n <tag>\n\n <name>MyMsg</name>\n\n <tag-class>Javabook.com.Details</tag-class>\n\
    \n <body-content>empty</body-content>\n\n </tag>\n\n</taglib>\n\nUsing custom\
    \ tag in JSP:\n\nAbove we have created a custom tag named MyMsg. Here we will\
    \ be using it.\n\nNote: taglib directive should have the TLD file path in uri\
    \ field. Above we have created the message.tld file so we have given the path\
    \ of that file.\n\nChoose any prefix and specify it in taglib directive’s prefix\
    \ field. Here we have specified it as myprefix."
