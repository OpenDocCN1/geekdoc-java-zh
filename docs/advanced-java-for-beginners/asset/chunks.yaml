    \n### 上述示例快照\n\n一旦运行了上面的 JSP 代码，它将显示出如下界面，包含 `username` 和 `password` 两个文本字段。\n\
    \n![](img/image00376.jpeg)\n\n这是 `userinfo.jsp` 页面的输出。在这里，我们获取了用户在登录页面输入的 `id`\
    \ 和 `password`。\n\n![](img/image00377.jpeg)\n\n注意：\n\n从此处返回：\n\n带参数的 JSP include\
    \ action 示例\n\n### JSP 中的 Response 隐式对象\nJSP 中的 Response 隐式对象示例\n\n我们将讨论 JSP 中的\
    \ `response` 隐式对象。它是 `javax.servlet.http.HttpServletRequest` 的实例，主要用于修改在处理客户端请求后发送到浏览器的响应。\n\
    \n#### response 隐式对象的方法\n\n1) `void setContentType(String type)`\n2) `void sendRedirect(String\
    \ address)`\n3) `void addHeader(String name, String value)`\n4) `void setHeader(String\
    \ name, String value)`\n5) `boolean containsHeader(String name)`\n6) `void addCookie(Cookie\
    \ value)`\n7) `void sendError(int status_code, String message)`\n8) `boolean isCommitted()`\n\
    9) `void setStatus(int statuscode)`\n\n让我们详细查看每个方法 –\n\n1. `Void setContentType(String\
    \ type)` – 此方法通过设置 MIME 类型和字符编码来告诉浏览器响应数据的类型。此方法设置的信息有助于浏览器解释响应。示例为：\n\n```\n\
    response.setContentType(\"text/html\");\nresponse.setContentType(\"image/gif\"\
    );\nresponse.setContentType(\"image/png\");\nresponse.setContentType(\"application/pdf\"\
    );\n```\n\n2. `Void sendRedirect(String address)` – 它将控制权重定向到一个新的 JSP 页面。例如，当浏览器检测到以下语句时，它将从当前\
    \ JSP 页面重定向到 `javabook.com`。\n\n```\nresponse.sendRedirect(\"http://javabook.com\"\
    );\n```\n\n3. `Void addHeader(String name, String value)` – `addHeader` 方法向响应中添加一个头部，基本上它包含一个头部名称和它的值。例如：下面的语句将在响应中包含一个值为\
    \ `javaBook.com` 的名为“Site”头部。\n\n```\nresponse.addHeader(\"Site\", \"JavaBook.com\"\
    );\n```\n\n4. `Void setHeader(String name, String value)` – 它设置头部值。此方法用新值覆盖当前头部的值。假设我正在修改头部“Site”的值。下面的语句将把当前值\
    \ `javaBook.com` 修改为新值 `AA.com`。\n\n```\nresponse.setHeader(\"Site\", \"AA.com\"\
    );\n```\n\n5. `Boolean containsHeader(String name)` – 它返回一个布尔值 true/false。它基本上是检查响应中是否存在该头部。例如：在上面的\
    \ `addHeader` 方法的示例中，我们已向响应中添加了 `Site` 头部，因此下面的语句将返回 true。\n\n```\nresponse.containsHeader(\"\
    Site\");\n```\n\n6. `Void addCookie(Cookie cookie)` – 此方法向响应中添加一个 cookie。下面的语句将向响应中添加\
    \ 2 个 Cookie：`Author` 和 `Siteinfo`。\n\n```\nresponse.addCookie(Cookie Author);\n\
    response.addCookie(Cookie Siteinfo);\n```\n\n7. `Void sendError(int status_code,\
    \ String message)` – 它用于发送带有代码和错误消息的错误响应。例如：\n\n```\nresponse.sendError(404, \"\
    Page not found error\");\n```\n\n8. `Boolean isCommitted()` - 它检查 HTTP 响应是否已发送给客户端，如果是则返回\
    \ true，否则返回 false。\n\n```jsp\n<% if(response.isCommited())\n    {\n        <%--做一些事情\
    \ --%>\n    }else\n    {\n        <%--做其他事情 --%>\n    } %>\n```\n\n9. `Void setStatus(int\
    \ statuscode)` – 此方法用于将 HTTP 状态设置为给定的值。例如：下面的语句将将 HTTP 响应码设置为 404（页面未找到）。\n\n\
    ```\nresponse.setStatus(404);\n```\n\n### Response 隐式对象示例\n\n在下面的示例中，我们从登录页面接收\
    \ `id` 和 `password`，然后将其与硬编码的正确 id/pass 进行匹配。如果凭据正确，登录页面将重定向到成功页面，否则将重定向到登录失败的\
    \ JSP 页面。\n\n**index.html**\n```html\n<html>\n<head>\n<title>登录页面</title>\n</head>\n\
    <body>\n<form action=\"checkdetails.jsp\">\nUserId: <input type=\"text\" name=\"\
    id\" /> <br><br>\nPassword: <input type=\"text\" name=\"pass\" /> <br><br>\n<input\
    \ type=\"submit\" value=\"Sign In!!\"/>\n</form>\n</body>\n</html>\n```\n\n此 JSP\
    \ 页面根据硬编码的值验证输入的 id/pass。\n\n**checkdetails.jsp**\n```html\n<html>\n<head><title>检查凭据</title></head>\n\
    <body>\n<%\nString uid=request.getParameter(\"id\");\nString password=request.getParameter(\"\
    pass\");\nif(uid.equals(\"Chandru\") && password.equals(\"JavaBook\"))\n{\nresponse.sendRedirect(\"\
    success.jsp\");\n}\nelse\n{\nresponse.sendRedirect(\"failed.jsp\");\n}\n%>\n</body>\n\
    </html>\n```\n此 JSP 页面验证输入的 id/pass。\n\n**success.jsp**\n```html\n<html>\n<head><title>成功页面</title></head>\n\
    <body>\n<%\nString data=(String)session.getAttribute(\"uid\");\nout.println(\"\
    Welcome \"+data+\"!!\");\n%>\n</body>\n</html>\n```\n此 JSP 页面验证硬编码的值。\n\n**failed.jsp**\n\
    ```html\n<html>\n<head><title>登录失败</title></head>\n<body>\n<%\nString data2=(String)session.getAttribute(\"\
    uid\");\nout.println(\"Hi \"+data2+\". Id are wrong. Please try Again.\");\n%>\n\
    </body>\n</html>\n```\n输出：\n登录页面\n![](img/image0378.jpeg)\n\n成功页面：ID 和密码正确。\n\
    ![](img/image0379.jpeg)\n\n带错误的 ID：\n![](img/image0380.jpeg)\n\n登录失败页面：ID 和密码错误。\n\
    ![](img/image0381.jpeg)\n\n注意：\n\n返回此处：\n\n表达式\n\n### Session 隐式对象\nJSP 中的 Session\
    \ 隐式对象示例\n\nSession 是 JSP 中最常用的隐式对象。它的主要用途是在会话期间访问所有用户数据。\n\n#### session 隐式对象的方法\n\
    \n1. `setAttribute(String, object)` – 此方法通过分配一个唯一字符串将对象保存到会话。之后可以在会话期间从从中获取该对象。`setAttribute`\
    \ 和 `getAttribute` 是处理会话时常用的两个方法。\n2. `getAttribute(String name)` – 使用 `getAttribute`\
    \ 方法从从中获取对象。例如：如果我们需要在每个 JSP 页面访问 userId，则应该将 userId 存储在会话。\n3. `removeAttribute(String\
    \ name)` – 存储在会中的对象可以使用此方法移除。将唯一字符串传递给 `removeAttribute` 方法。\n4. `getAttributeNames()`\
    \ – 它返回会中的所有对象。基本上，它产生对象的枚举。\n5. `getCreationTime()` – 此方法返回会话创建时间，即会话启动（激活）的时间。\n\
    6. `getId()` – Servlet 容器在创建会话时会分配一个唯一的字符串标识符。`getId` 返回该唯一标识符。\n7. `isNew()`\
    \ – 用于检查会话是否为新会话。它返回布尔值（true 或 false）。主要用于跟踪客户端端是否启用了 Cookie。如果禁用了 Cookie，`session.isNew()`\
    \ 方法将始终返回 true。\n8. `invalidate()` – 它会杀死会话并打破会话与所有存储对象的关联。\n9. `getMaxInactiveInterval()`\
    \ – 返回会话的最大空闲间隔时间（以秒计）。\n10. `getLastAccessedTime()` 通常用于获取会话的最后访问时间。\n\n"
