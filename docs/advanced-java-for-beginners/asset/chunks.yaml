    \  </context-param>\n  <context-param>\n    <param-name>email</param-name>\n \
    \   <param-value>javabook@gmail.com</param-value>\n  </context-param>\n  <servlet-mapping>\n\
    \    <servlet-name>JavaBook</servlet-name>\n    <url-pattern>/context</url-pattern>\n\
    \  </servlet-mapping>\n</web-app>\n```\n\n**Output:**\nUser name is:Chandruprasad\
    \ Email Is is:Javabook@gmail.com\n\n## Methods of ServletContext interface\n\n\
    Here is the list of frequently used methods of `ServletContext` interface.\n\n\
    - `public String getInitParameter(String param)`: It returns the value of given\
    \ parameter or null if the parameter doesn’t exist.\n- `public Enumeration getInitParameterNames()`:\
    \ Returns an enumeration of context parameters names.\n- `public void setAttribute(String\
    \ name,Object object)`: Sets the attribute value for the given attribute name.\n\
    - `public Object getAttribute(String name)`: Returns the attribute value for the\
    \ given name or null if the doesn’t exist.\n- `public String getServerInfo()`:\
    \ eturns the name and version of the servlet container on which the servlet is\
    \ running.\n- `public String getContextPath()`: Returns the context path of the\
    \ web application.\n\n## ServletResponse Interface\n\nThe servlet container is\
    \ connected to the web server that receives Http Requests from client on a certain\
    \ port. When client sends a request to web server, the servlet container creates\
    \ `HttpServletRequest` and `HttpServletResponse` objects and passes them as an\
    \ argument to the servlet `service()` method.\n\nThe response object allows you\
    \ to format and send the response back to the client. First we will see the commonly\
    \ used methods in the `ServletResponse` interface and then we will see an example.\n\
    \n## Method of ServletResponse interface\n\n1) `String getCharacterEncoding()`:\
    \ It returns the name of the MIME charset used in body of the response sent to\
    \ the client.\n2) `String getContentType()`: It returns the response content type.\
    \ e.g. text, html etc.\n3) `ServletOutputStream getOutputStream()`: Returns a\
    \ `ServletOutputStream` suitable for writing binary data in the response.\n4)\
    \ `java.io.PrintWriter getWriter()`: Returns the `PrintWriter` object.\n5) `void\
    \ setCharacterEncoding(java.lang.String charset)`: Set the MIME charset (character\
    \ encoding) of the response.\n6) `void setContentLength(int len)`: It sets the\
    \ length of the response body.\n7) `void setContentType(java.lang.String type)`:\
    \ Sets the type of the response data.\n8) `void setBufferSize(int size)`: Sets\
    \ the buffer size.\n9) `int getBufferSize()`: Returns the buffer size.\n10) `void\
    \ flushBuffer()`: Forces any content in the buffer to be written to the client.\n\
    11) `boolean isCommitted()`: Returns a boolean indicating if the response has\
    \ been committed.\n12) `void reset()`: Clears the data of the buffer along with\
    \ the headers and status code.\n\n## Example:\n\nIn the below example, we have\
    \ used `setContentType()` and `getWriter()` methods of `ServletResponse` interface.\n\
    \n### index.html\n```html\n<form action=\"mydetails\" method=\"get\">\n  User\
    \ name: <input type=\"text\" name=\"uname\">\n  <input type=\"submit\" value=\"\
    login\">\n</form>\n```\n\n### MyServletDemo.java\n```java\nimport javax.servlet.http.*;\n\
    import javax.servlet.*;\nimport java.io.*;\npublic class MyServletDemo extends\
    \ HttpServlet {\n    public void doGet(HttpServletRequest req,HttpServletResponse\
    \ res)\n    throws ServletException, IOException {\n        res.setContentType(\"\
    text/html\");\n        PrintWriter pwriter=res.getWriter();\n        String name=req.getParameter(\"\
    uname\");\n        pwriter.println(\"User Details Page:\");\n        pwriter.println(\"\
    Hello \"+name);\n        pwriter.close();\n    }\n}\n```\n\n### web.xml\n```xml\n\
    <web-app>\n  <servlet>\n    <servlet-name>DemoServlet</servlet-name>\n    <servlet-class>MyServletDemo</servlet-class>\n\
    \  </servlet>\n  <servlet-mapping>\n    <servlet-name>DemoServlet</servlet-name>\n\
    \    <url-pattern>/mydetails</url-pattern>\n  </servlet-mapping>\n</web-app>\n\
    ```\n\n**Output:**\nUser Details Page:Hello Chandruprasad\n\n## HttpSession\n\n\
    The `HttpSession` object is used for session management. A session contains information\
    \ specific to a user across the whole application. When a user enters into website\
    \ (or online application) for the first time `HttpSession` is obtained via `getSession()`,\
    \ the user is given a unique ID to identify his session. This unique ID can be\
    \ stored into cookie or in a request.\n\nThe session stays alive until it has\
    \ not been used for more than the timeout value specified in deployment file(`web.xml`).\
    \ The default timeout is 30 minutes, this is used if you don’t specify the value\
    \ in tag. This means that when the user doesn’t visit web application time, the\
    \ session is destroyed by servlet container. The subsequent request will not be\
    \ served from this session, the servlet container will create a new session.\n\
    \nThis is how you create a `HttpSession` object.\n\n```java\nprotected void doGet(HttpServletRequest\
    \ req, HttpServletResponse res)\nthrows ServletException, IOException {\n    HttpSession\
    \ session = req.getSession();\n}\n```\n\nYou can store the user information into\
    \ the session by using `setAttribute()` method and later when needed this information\
    \ can be fetched from the session. This is how you store info in session. Here\
    \ we are storing username, emailid and userage in session with the attribute name\
    \ `uName`, `uemailId` and `uAge` respectively.\n\n```java\nsession.setAttribute(\"\
    uName\", \"ChandruPrasad\");\nsession.setAttribute(\"uemailId\", \"myemailid@gmail.com\"\
    );\nsession.setAttribute(\"uAge\", \"30\");\n```\n\nThis First parameter is the\
    \ attribute name and second is the attribute value. For e.g. `uName` is the attribute\
    \ name and `ChandruPrasad` is the attribute value in the code above.\n\nTO get\
    \ the value from session we use the `getAttribute()` method of `HttpSession` interface.\
    \ Here we are fetching the attribute values using attribute names.\n\n```java\n\
    String userName = (String) session.getAttribute(\"uName\");\nString userEmailId\
    \ = (String) session.getAttribute(\"uemailId\");\nString userAge = (String) session.getAttribute(\"\
    uAge\");\n```\n\n## Methods of HttpSession\n\n- `public void setAttribute(String\
    \ name, Object value)`: Binds the object with a name and stores the name/value\
    \ pair as an attribute of the `HttpSession` object. If an attribute already exists,\
    \ then this method replaces the existing attributes.\n- `public Object getAttribute(String\
    \ name)`: Returns the String object specified in the parameter, from the session\
    \ object. If no object is found for the specified attribute, then the `getAttribute()`\
    \ method returns `null`.\n"
