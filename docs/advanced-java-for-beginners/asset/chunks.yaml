    </context-param>\n\n## ServletContext complete example: To get the initialization\
    \ parameters\n\nIn this example we have two context initialization parameters\
    \ (user name and user email) in `web.xml` file and we are getting the value in\
    \ Servlet using `getInitParameter()` method that returns the value of given parameter.\n\
    \n### DemoServlet.java\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\npublic class DemoServlet extends HttpServlet {\n\
    \    public void doGet(HttpServletRequest request, HttpServletResponse response)\n\
