    \n```jsp\n<c:if  test=\"${condition}\">\n...\n..\n</c:if>\n```\n\n### Example\
    \ of `<c:if>` tag\nIn this example we have defined `age` variable using `<c:set>`\
    \ tag and then we are checking the eligibility of voting by using `<c:if>` tag.\n\
    \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <html>\n<head>\n<title>JSTL c:if Tag Example</title>\n</head>\n<body>\n<c:set\
    \  var=\"age\"  value=\"26\"/>\n<c:if  test=\"${age >= 18}\">\n<c:out value=\"\
    You are eligible for voting!\"/>\n</c:if>\n<c:if  test=\"${age < 18}\">\n<c:out\
    \ value=\"You are not eligible for voting!\"/>\n</c:if>\n</body>\n</html>\n```\n\
    Output:\n![](Images/image00406.jpeg)\n\n### Scope attribute of `<c:remove>`\n\
    Above we have coded like this:\n```jsp\n<c:remove  var=\"author\"/>\n```\nThis\
    \ above code removes an attribute from all the scopes (page, session, application,\
    \ request). In order to be specific we must need to specify the `scope` attribute\
    \ inside `<c:remove>` tag, like I did below – The below JSTL statement will remove\
    \ the variable `var` from session scope.\n```jsp\n<c:remove  var=\"author\"  scope=\"\
    session\"/>\n```\n\n4. **`<c:if>` tag**: This JSTL core tag is used for testing\
    \ conditions. There are two other optional attributes for this tag which are `var`\
    \ and `scope`, `test` is mandatory.\n\n5. **`<c:choose>` tag**: This JSTL core\
    \ tag is used for testing multiple conditions. It works like a `switch-else-if`\
    \ statement in Java.\n\n# JSTL `<c:choose>`, `<c:when>`, `<c:otherwise>` Core\
    \ Tags\n`<c:choose>`, `<c:when>`, `<c:otherwise>` are used together like `switch-else-if`\
    \ in Java.\n\n### `<c:choose>`, `<c:when>`, `<c:otherwise>`\nIn this we are discussing\
    \ `<c:choose>` acts like `switch`, `<c:when>` like case which can be used multiple\
    \ times inside `<c:choose>`. `<c:otherwise>` is similar to default which works\
    \ when all `<c:when>` statements are false.\n\nSyntax:\n```xml\n<c:choose>\n \
    \ <c:when test=\"${condition1}\">\n    //do something if condition1 is true\n\
    \  </c:when>\n  <c:when test=\"${condition2}\">\n    //do something if condition2\
    \ is true\n  </c:when>\n  <c:otherwise>\n    //do something if all conditions\
    \ are false\n  </c:otherwise>\n</c:choose>\n```\n\n### Example:\nIn this example\
    \ we have three numbers and we are comparing them using these three tags. Example\
    \ is pretty simple to understand. Screenshot of output is provided after the example’s\
    \ code.\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
    c\" %>\n<html>\n<head>\n<title>c:choose, c:when and c:otherwise Example</title>\n\
    </head>\n<body>\n<c:set  var=\"number1\"  value=\"222\"/>\n<c:set  var=\"number2\"\
