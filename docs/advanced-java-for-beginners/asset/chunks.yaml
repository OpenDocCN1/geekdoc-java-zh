  trans: "\n当客户端向 Web 服务器发送请求时，Servlet 容器会创建 `ServletRequest` 和 `ServletResponse`\
    \ 对象，并将它们作为参数传递给 servlet 的 `service()` 方法。请求对象提供了对请求信息的访问，例如请求数据的头部（header）和主体（body）。\n\
    \n首先我们将看一个示例，然后查看 `ServletRequest` 接口中可用的方法列表：\n\n### 示例 1：使用 `ServletRequest`\
    \ 的 `getParameter()` 方法显示用户输入\n\n在这个示例中，我将演示 `getParameter()` 方法，它可以返回给定参数的值。\n\
    \n在这个 HTML 表单中，我们正在获取用户输入（姓名和年龄），并分别将它们存储在参数 `uname` 和 `uage` 中。\n\nindex.html\n\
    ```html\n<form action=\"details\" method=\"get\">\nUser Name: <input type=\"text\"\
    \ name=\"uname\"><br>\nUser Age: <input type=\"text\" name=\"uage\"><br>\n <input\
    \ type=\"submit\" value=\"submit\">\n</form>\n```\n\nMyServletDemo.java\n在这个 servlet\
    \ 类中，我们通过使用 `getParameter()` 方法获取参数值，该方法属于 `ServletRequest` 接口。在此示例中，我们将 `HttpServletRequest`\
    \ 作为 `doGet()` 方法的参数，`HttpServletRequest` 继承了 `ServletRequest` 接口，因此 `req` 对象可以使用\
    \ `getParameter()` 方法。\n\n获取这些值后，我们将把它们写到网页上。\n\n```java\nimport javax.servlet.http.*;\n\
    import javax.servlet.*;\nimport java.io.*;\n\npublic class MyServletDemo extends\
    \ HttpServlet {\n    public void doGet(HttpServletRequest req, HttpServletResponse\
    \ res)\n    throws ServletException, IOException {\n        res.setContentType(\"\
    text/html\");\n        PrintWriter pwriter=res.getWriter();\n        String name\
    \ = req.getParameter(\"uname\");\n        String age = req.getParameter(\"uage\"\
    );\n        pwriter.println(\"Name: \"+name);\n        pwriter.println(\"Age:\
    \ \"+age);\n        pwriter.close();\n    }\n}\n```\n\nWeb.xml\n这是你的部署描述文件，用于将\
    \ servlet 映射到 URL。由于我们的表单的 action 是 details 页面，因此我们将 servlet 类映射到 details 页面。\n\
    \n```xml\n<web-app>\n    <display-name>JavaBookDemo</display-name>\n    <welcome-file-list>\n\
    \        <welcome-file>index.html</welcome-file>\n        <welcome-file>index.htm</welcome-file>\n\
    \        <welcome-file>index.jsp</welcome-file>\n        <welcome-file>default.html</welcome-file>\n\
    \        <welcome-file>default.htm</welcome-file>\n        <welcome-file>default.jsp</welcome-file>\n\
    \    </welcome-file-list>\n    <servlet>\n        <servlet-name>JavaBook</servlet-name>\n\
    \        <servlet-class>MyServletDemo</servlet-class>\n    </servlet>\n    <servlet-mapping>\n\
    \        <servlet-name>JavaBook</servlet-name>\n        <url-pattern>/details</url-pattern>\n\
    \    </servlet-mapping>\n</web-app>\n```\n\n输出：\n屏幕 1：\n# ![](img/image00453.jpeg)\n\
    \n# 点击 submit 后出现的屏幕 2：\n# ![](img/image00454.jpeg)\n\n### 示例 2：获取参数名称和值\n\n在这个示例中，我们将使用\
    \ `getParameterNames()` 和 `getParameter()` 方法来获取参数名称和值。\n\n`getParameterNames()`：返回一个包含\
    \ `String` 对象的 `Enumeration`，其中该请求中包含的参数名称。如果请求没有参数，该方法返回一个空 `Enumeration`。\n\n\
    `getParameter()`：如上所述，它返回给定参数的值。\n\nindex.html\n```html\n<form action=\"details\"\
    \ method=\"get\">\nUser Name: <input type=\"text\" name=\"uname\"><br>\nUser Age:\
    \ <input type=\"text\" name=\"uage\"><br>\n <input type=\"submit\" value=\"submit\"\
    >\n</form>\n```\n\nMyServletDemo.class\n```java\nimport java.io.IOException;\n\
    import java.io.PrintWriter;\nimport java.util.Enumeration; \nimport javax.servlet.ServletException;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\npublic class MyServletDemo extends\
    \ HttpServlet {     \n    public void doGet(HttpServletRequest req, HttpServletResponse\
    \ res)\n    throws ServletException, IOException {     \n        PrintWriter pwriter=res.getWriter();\
    \ \n        res.setContentType(\"text/html\");\n        Enumeration en=req.getParameterNames();\n\
    \        while(en.hasMoreElements()) {\n            Object obj=en.nextElement();\n\
    \            String param=(String)obj;\n            String pvalue=req.getParameter(param);\n\
    \            pwriter.print(\"Parameter Name: \"+param+ \" Parameter Value: \"\
    +pvalue);\n        }\n        pwriter.close();  \n    }\n}\n```\n\nweb.xml\n```xml\n\
    <web-app>\n    <servlet>\n        <servlet-name>JavaBook</servlet-name>\n    \
    \    <servlet-class>MyServletDemo</servlet-class>\n    </servlet>\n    <servlet-mapping>\n\
    \        <servlet-name>JavaBook</servlet-name>\n        <url-pattern>/details</url-pattern>\n\
    \    </servlet-mapping>\n</web-app>\n```\n输出：\n# ![](img/image00455.jpeg)\n# Parameter\
    \ Name: uname Parameter Value: Chand\n# Parameter Name: uage Parameter Value:\
    \ 30\n\n### 示例 3：获取头部信息\n\nindex.html\n```html\n<h1>Request Demo</h1>\n<body><a\
    \ href=\"headinfo\">Click Here</a></body>\n```\n\nHeaderDetails.java\n```java\n\
    import java.io.IOException;\nimport java.io.PrintWriter;\nimport java.util.Enumeration;\n\
    import javax.servlet.ServletException;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    \npublic class HeaderDetails extends HttpServlet {\n    public void doGet(HttpServletRequest\
    \ req, HttpServletResponse res)\n    throws ServletException, IOException {\n\
    \        res.setContentType(\"text/html\");\n        PrintWriter pwriter=res.getWriter();\n\
    \        pwriter.println(\"HTTP header:<br>\");\n        Enumeration en=req.getHeaderNames();\n\
    \        while (en.hasMoreElements()) {\n            String hName = (String)en.nextElement();\n\
    \            String hValue = req.getHeader(hName);\n            pwriter.println(\"\
    <b>\"+hName+\": </b>\"+hValue + \"<br>\");\n        }\n        pwriter.close();\n\
    \    }\n}\n```\n\nweb.xml\n```xml\n<web-app>\n    <welcome-file-list>\n      \
    \  <welcome-file>index.html</welcome-file>\n        <welcome-file>index.htm</welcome-file>\n\
    \        <welcome-file>index.jsp</welcome-file>\n        <welcome-file>default.html</welcome-file>\n\
    \        <welcome-file>default.htm</welcome-file>\n        <welcome-file>default.jsp</welcome-file>\n\
    \    </welcome-file-list>\n    <servlet>\n        <servlet-name>JavaBook</servlet-name>\n\
    \        <servlet-class>HeaderDetails</servlet-class>\n    </servlet>\n    <servlet-mapping>\n\
    \        <servlet-name>JavaBook</servlet-name>\n        <url-pattern>/headinfo</url-pattern>\n\
    \    </servlet-mapping>\n</web-app>\n```\n输出：\n# ![](img/image00456.jpeg)\n\n\
    ## `ServletRequest` 接口的方法\n\n`getParameter(String name)`：返回给定参数的 `String` 值值，如果给定参数不存在则返回\
    \ null。\n\n`getParameterNames()`：返回一个包含请求中参数名称的 `String` 对象的 `Enumeration`。\n\n\
    `getParameterValues(String name)`：返回包含该参数所有值的 `String` 数组，如果参数没有任何值则返回 null。\n\
    \n`getCharacterEncoding()`：返回请求主体中使用的字符编码名称。如果请求未指定字符编码，则该方法返回 null。\n\n`setCharacterEncoding(String\
    \ env)`：覆盖请求主体中的字符编码。\n\n`getContentLength()`：返回请求内容的长度（字节）。\n\n`getContentType()`：返回请求主体的\
    \ MIME 类型，如果类型未知则返回 null。\n\n# RequestDispatcher 方法\n\n# Servlet 中的 RequestDispatcher\
    \ 方法示例\n\n`RequestDispatcher` 接口定义了一个对象，它可以接收请求并将其分发到资源（如 servlet、JSP、HTML 文件）。该接口具有以下两个方法：\n\
    \n`public void forward(ServletRequest request, ServletResponse response)`：将请求从一个\
    \ servlet 转发到另一个资源（如 servlet、JSP、HTML 文件）。\n\n`public void include(ServletRequest\
    \ request, ServletResponse response)`：将资源（如 servlet、JSP、HTML 文件）的内容包含在响应中。\n\n\
    ## forward() 与 include() 方法的区别\n\n"
- fmt: "\nTo understand the difference between these two methods, let us take an example:\
    \ Suppose you have two pages `X` and `Y`. In page `X` you have an `include` tag,\
    \ this means that the control will be in the page `X` till it encounters `include`\
    \ tag, after that the control will be transferred to page `Y`. At the end of the\
    \ processing of page `Y`, the control will return back to the page `X` starting\
    \ just after the `include` tag and remain in `X` till the end.\n\nIn this case\
    \ the final response to the client will be send by page `X`.\n\nNow, we are taking\
    \ the same example with `forward`. We have same pages `X` and `Y`. In page `X`,\
    \ we have `forward` tag. In this case the control will be in page `X` till it\
    \ encounters `forward`, after this the control will be transferred to page `Y`.\
    \ The main difference here is that the control will not return back to `X`, it\
    \ will be in page `Y` till the end of it.\n\nIn this case the final response to\
    \ the client will be send by page `Y`.\n\n## Example:\n\nIn this example, I will\
    \ be using both the methods `include` and `forward`. Using `include` method, I\
    \ will be changing the content of current page and when I’m ready to transfer\
    \ the control to the next page, I will use `forward` method.\n\n### index.html\n\
    ```html\n<form action=\"loginPage\" method=\"post\">\n  User Name:<input type=\"\
    text\" name=\"uname\"/><br/>\n  Password:<input type=\"password\" name=\"upass\"\
    /><br/>\n  <input type=\"submit\" value=\"SUBMIT\"/>\n</form>\n```\n\n### Validation.java\n\
    ```java\nimport java.io.*;\nimport java.io.*;\nimport javax.servlet.*;\nimport\
    \ javax.servlet.http.*;\n\npublic class Validation extends HttpServlet {\n   \
    \ public void doPost(HttpServletRequest request, HttpServletResponse response)\
    \ throws ServletException, IOException {\n        response.setContentType(\"text/html\"\
    );\n        PrintWriter pwriter = response.getWriter();\n        String name=request.getParameter(\"\
    uname\");\n        String pass=request.getParameter(\"upass\");\n        if(name.equals(\"\
    Chandru\") && pass.equals(\"Javabook\")) {\n            RequestDispatcher dis=request.getRequestDispatcher(\"\
    welcome\");\n            dis.forward(request, response);\n        } else {\n \
    \           pwriter.print(\"User name or password is incorrect!\");\n        \
    \    RequestDispatcher dis=request.getRequestDispatcher(\"index.html\");\n   \
    \         dis.include(request, response);\n        }\n    }\n}\n```\n\n### WelcomeUser.java\n\
    ```java\nimport java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    \npublic class WelcomeUser extends HttpServlet {\n    public void doPost(HttpServletRequest\
    \ request, HttpServletResponse response) throws ServletException, IOException\
    \ {\n        response.setContentType(\"text/html\");\n        PrintWriter pwriter\
    \ = response.getWriter();\n        String name=request.getParameter(\"uname\"\
    );\n        pwriter.print(\"Hello \"+name+\"!\");\n        pwriter.print(\" Welcome\
    \ to Javabook.com\");\n    }\n}\n```\n\n### web.xml\n```xml\n<web-app>\n  <display-name>JavaBookDemo</display-name>\n\
    \  <welcome-file-list>\n    <welcome-file>index.html</welcome-file>\n  </welcome-file-list>\n\
    \  <servlet>\n    <servlet-name>Login</servlet-name>\n    <servlet-class>Validation</servlet-class>\n\
    \  </servlet>\n  <servlet>\n    <servlet-name>Welcome</servlet-name>\n    <servlet-class>WelcomeUser</servlet-class>\n\
    \  </servlet>\n  <servlet-mapping>\n    <servlet-name>Login</servlet-name>\n \
    \   <url-pattern>/loginPage</url-pattern>\n  </servlet-mapping>\n  <servlet-mapping>\n\
    \    <servlet-name>Welcome</servlet-name>\n    <url-pattern>/welcome</url-pattern>\n\
    \  </servlet-mapping>\n  <welcome-file-list>\n    <welcome-file>index.html</welcome-file>\n\
    \  </welcome-file-list>\n</web-app>\n```\n"
  raw: "To understand the difference between these two methods, let us take an example:\
    \ Suppose you have two pages X and Y. In page X you have an include tag, this\
    \ means that the control will be in the page X till it encounters include tag,\
    \ after that the control will be transferred to page Y. At the end of the processing\
    \ of page Y, the control will return back to the page X starting just after the\
    \ include tag and remain in X till the end.\n\nIn this case the final response\
    \ to the client will be send by page X.\n\nNow, we are taking the same example\
    \ with forward. We have same pages X and Y. In page X, we have forward tag. In\
    \ this case the control will be in page X till it encounters forward, after this\
    \ the control will be transferred to page Y. The main difference here is that\
    \ the control will not return back to X, it will be in page Y till the end of\
    \ it.\n\nIn this case the final response to the client will be send by page Y.\n\
    \n## Example:\n\nIn this example, I will be using both the methods include and\
    \ forward. Using include method, I will be changing the content of current page\
    \ and when I’m ready to transfer the control to the next page, I will use forward\
    \ method.\n\nindex.html\n\n<form  action=\"loginPage\"  method=\"post\">\n\n \
    \ User Name:<input  type=\"text\"  name=\"uname\"/><br/>\n\n  Password:<input\
    \  type=\"password\"  name=\"upass\"/><br/>\n\n <input  type=\"submit\"  value=\"\
    SUBMIT\"/>\n\n</form>\n\nValidation.java\n\nimport java.io.*;\n\nimport java.io.*;\n\
    \nimport javax.servlet.*;\n\nimport javax.servlet.http.*;\n\npublic  class  Validation\
    \  extends  HttpServlet\n\n{    \n\n public  void doPost(HttpServletRequest request,\n\
    \n HttpServletResponse response)\n\n throws  ServletException, IOException\n\n\
       {       \n\n       response.setContentType(\"text/html\");     \n\n PrintWriter\
    \ pwriter = response.getWriter();\n\n String name=request.getParameter(\"uname\"\
    );     \n\n String  pass=request.getParameter(\"upass\");               \n\n if(name.equals(\"\
    Chandru\") &&\n\n pass.equals(\"Javabook\"))\n\n       {         \n\n RequestDispatcher\
    \ dis=request.getRequestDispatcher(\"welcome\");         \n\n          dis.forward(request,\
    \ response);     \n\n       }     \n\n else\n\n       {     \n\n          pwriter.print(\"\
    User name or password is incorrect!\");         \n\n RequestDispatcher dis=request.getRequestDispatcher(\"\
    index.html\");         \n\n          dis.include(request, response);         \
    \                      \n\n       }     \n\n   }    \n\n}  \n\nWelcomeUser.java\n\
    \nimport java.io.*;\n\nimport javax.servlet.*;\n\nimport javax.servlet.http.*;\n\
    \npublic  class  WelcomeUser  extends  HttpServlet {\n\n public  void doPost(HttpServletRequest\
    \ request,\n\n HttpServletResponse response)\n\n throws  ServletException, IOException\n\
    \n {\n\n    response.setContentType(\"text/html\");\n\n PrintWriter pwriter =\
    \ response.getWriter();\n\n String name=request.getParameter(\"uname\");\n\n   \
    \ pwriter.print(\"Hello \"+name+\"!\");\n\n    pwriter.print(\" Welcome to Javabook.com\"\
    );\n\n }\n\n}\n\nweb.xml\n\n<web-app>\n\n <display-name>JavaBookDemo</display-name>\n\
    \n <welcome-file-list>\n\n <welcome-file>index.html</welcome-file>\n\n </welcome-file-list>\n\
    \n <servlet>\n\n <servlet-name>Login</servlet-name>\n\n <servlet-class>Validation</servlet-class>\n\
    \n </servlet>\n\n <servlet>\n\n <servlet-name>Welcome</servlet-name>\n\n <servlet-class>WelcomeUser</servlet-class>\n\
    \n </servlet>\n\n <servlet-mapping>\n\n <servlet-name>Login</servlet-name>\n\n\
     <url-pattern>/loginPage</url-pattern>\n\n </servlet-mapping>\n\n <servlet-mapping>\n\
    \n <servlet-name>Welcome</servlet-name>\n\n <url-pattern>/welcome</url-pattern>\n\
    \n </servlet-mapping>\n\n <welcome-file-list>\n\n <welcome-file>index.html</welcome-file>\n\
    \n </welcome-file-list>\n\n</web-app>\n\nOutput:\n\nEntering wrong credentials:\n\
    \n![](Images/image00458.jpeg)\n\nError screen:\n\n# ![](Images/image00459.jpeg)\n\
    \n# Welcome screen on entering correct user name and password:\n\n# Hello Chandru\
    \ Ị Welcome to javabook.com\n\nServletConfig Interface\n\n# ServletConfig Interface\
    \ with example\n\nServlet Container creates ServletConfig object for each Servlet\
    \ during initialization, to pass information to the Servlet. This object can be\
    \ used to get configuration information such as parameter name and values from\
    \ deployment descriptor file(web.xml).\n\n## Methods of ServletConfig interface\n\
    \npublic String getInitParameter(String name): Returns the value of given parameter\
    \ as String, or null if the given parameter doesn’t exist in web.xml.\n\npublic\
    \ Enumeration getInitParameterNames(): Returns an enumeration of all the parameter\
    \ names.\n\npublic String getServletName(): Returns the name of the servlet instance.\n\
    \npublic ServletContext getServletContext(): Returns an object of ServletContext.\n\
    \n## Example:\n\nIn this example, we will use two methods getInitParameter() and\
    \ getInitParameterNames() to get all the parameters from web.xml along with their\
    \ values.\n\nThe getInitParameterNames() method returns an enumeration of all\
    \ parameters names and by passing those names during the call of getInitParameter()\
    \ method, we can get the corresponding parameter value from web.xml.\n\nDemoServlet.java\n\
    \nimport java.io.*;\n\nimport javax.servlet.*;\n\nimport javax.servlet.http.*;\n\
    \nimport java.util.Enumeration;\n\npublic  class  DemoServlet  extends  HttpServlet\
    \ {\n\n protected  void doGet(HttpServletRequest request,\n\n HttpServletResponse\
    \ response)\n\n throws  ServletException, IOException\n\n   {\n\n      response.setContentType(\"\
    text/html;charset=UTF-8\");\n\n PrintWriter pwriter = response.getWriter();\n\n\
    \ ServletConfig sc=getServletConfig();\n\n Enumeration<String> e=sc.getInitParameterNames();\n\
    \n String str;\n\n while(e.hasMoreElements()) {\n\n        str=e.nextElement();\n\
    \n        pwriter.println(\"<br>Param Name: \"+str);\n\n        pwriter.println(\"\
    \ value: \"+sc.getInitParameter(str));\n\n      }\n\n   }\n\n}\n\nweb.xml\n\n\
    <web-app>\n\n <display-name>JavaBookDemo</display-name>\n\n <welcome-file-list>\n\
    \n <welcome-file>index.html</welcome-file>\n\n </welcome-file-list>\n\n <servlet>\n\
    \n <servlet-name>MyServlet</servlet-name>\n\n <servlet-class>DemoServlet</servlet-class>\n\
    \n <init-param>\n\n <param-name>MyName</param-name>\n\n <param-value>Chandru</param-value>\n\
    \n </init-param>\n\n <init-param>\n\n <param-name>MyWebsite</param-name>\n\n <param-value>Javabook.com</param-value>\n\
    \n </init-param>\n\n </servlet>\n\n <servlet-mapping>\n\n <servlet-name>MyServlet</servlet-name>\n\
    \n <url-pattern>/scdemo</url-pattern>\n\n </servlet-mapping>\n\n</web-app>\n\n\
    Output:\n\nParam name:My name value:chandru\n\nParam Name:My Website value:Javabook.com\n\
    \n# ServletContext Interface\n\nThe main difference between ServletConfig and\
    \ ServletContext is that unlike ServletConfig, the ServletContext is being created\
    \ once per web application, i.e. ServletContext object is common to all the servlets\
    \ in web application.\n\nThis is how we can create ServletContext object. In this\
    \ code we are creating object in init() method, however you can create the object\
    \ anywhere you like.\n\nServletContext sc;\n\npublic  void init(ServletConfig\
    \ scfg)\n\n{\n\n    sc=scfg.getServletContext();\n\n}\n\nOnce we have the ServletContext object,\
    \ we can set the attributes of the ServletContext object by using the setAttribute() method.\
    \ Since the ServletContext object is available to all the servlets of the Web\
    \ application, other servlets can retrieve the attribute from the ServletContext\
    \ object by using the getAttribute() method.\n\nContext Initialization Parameter\n\
    \nContext Initialization parameters are the parameter name and value pairs that\
    \ you can specify in the deployment descriptor file (the web.xml file). Here you\
    \ can specify the parameters that will be accessible to all the servlets in the\
    \ web application.\n\nWhen we deploy the Web application, the Servlet container\
    \ reads the initialization parameter from the web.xml file and initializes the\
    \ ServletContext object with it. We can use the getInitParameter()and getInitParameterNames() methods\
    \ of the ServletContext interface to get the parameter value and enumeration of\
    \ parameter names respectively.\n\nFor example, here I have specified the parameter\
    \ email_id with the value, since this is common to all the servlets, you can get\
    \ the parameter name and value in any servlet."
