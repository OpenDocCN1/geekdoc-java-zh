    \  var=\"site\">\n\n <c:out  value=\"${site}\"/>\n\n</c:forTokens>\n\n</body>\n\
    \n</html>\n\nOutput:\n\nwww\n\njavabook\n\ncom\n\n11. <c:forTokens> tag: It is\
    \ used for iteration but it only works with delimiter.\n\nNote:Read the same full\
    \ example from 10\n\n12.<c:param> tag:  This JSTL tag is mostly used with <c:url>\
    \ and <c:redirect> tags. It adds parameter and their values to the output of these\
    \ tags.\n\n# JSTL <c:param> Core Tag\n\n<c:param> JSTL tag is mostly used with\
    \ <c:url> and <c:redirect> tags. Basically it adds parameter and their values\
    \ to the output of these tags. In this tutorial we will see how the <c:param>\
    \ tag can be used with  <c:url> and <c: redirect> tags.\n\n#### Syntax:\n\n<c:param\
    \  name=\"parameter_name\"  value=\"parameter_value\"/>\n\n#### Attributes of\
    \ <c:param> tag\n\n*   name: To specify the name of the parameter.\n\n*   value:\
    \ To specify the value of the parameter.\n\n#### Example:\n\nIn this example we\
    \ are using <c:param> tag for adding parameters to the resultant URL.\n\n<%@ taglib\
    \ uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\n<html>\n\n<head>\n\
    \n<title>JSTL c:param Tag Example</title>\n\n</head>\n\n<body>\n\n<c:url  value=\"\
    /mypage.jsp\"  var=\"completeURL\">\n\n <c:param  name=\"Id\"  value=\"736\"/>\n\
    \n <c:param  name=\"user\"  value=\"chandru\"/>\n\n</c:url>\n\n${completeURL}\n\
    \n</body>\n\n</html>\n\nOutput:\n\n/Javabook/mypage.jsp?Id=736&user=chandru\n\n\
    Example 2: <c:param> use in <c:redirect> tag\n\nHere we are passing parameters\
    \ along with the redirect url using <c:param> tag and then we are displaying those\
    \ parameters on the redirected page using param variable of expression language.\n\
    \n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\n<html>\n\
    \n<head>\n\n<title>c:param Example2</title>\n\n</head>\n\n<body>\n\n<c:redirect\
    \  url=\"/display.jsp\"  >\n\n <c:param  name=\"UserId\"  value=\"222\"/>\n\n\
     <c:param  name=\"UserName\"  value=\"ChandruBabu\"/>\n\n</c:redirect>\n\n${completeURL}\n\
    \n</body>\n\n</html>\n\ndisplay.jsp\n\nUSER ID IS: ${param.UserId}\n\nUSER NAME\
    \ IS: ${param.UserName}\n\nOutput:\n\nUSER ID IS: 222 SUER NAME IS:ChandruBabu\n\
    \n13\\. <c:url> tag:  It is used for url formatting or url encoding. It converts\
    \ a relative url into a application context url. Optional attributes var, context\
    \ and scope.\n\n# JSTL <c:url> Core Tag\n\n<c:url> JSTL tag is used for url formatting\
    \ or you can say url encoding. This is mainly used when we need to open a JSP\
    \ page based on the user input or based on the value of a variable. It basically\
    \ converts a relative url into a application context’s url. It may sound confusing\
    \ now but follow the given examples in this tutorial and you will be able to grasp\
    \ it quite easy.\n\n#### Syntax:\n\nBasic syntax looks like this – The attribute\
    \ “value” is a required attribute for the <c:url> tag\n\n<c:url  value=\"/file1.jsp\"\
    \  />\n\nThere are three other optional attributes exist for this tag which are\
    \ as follows –"
