    \ used in exception handling. In this post we have discussed exception handling\
    \ using `<c:catch>` core tag.\n\n#### Syntax:\n```xml\n<c:catch var=\"variable_name\"\
    >\n//Set of statements in which exception can occur\n</c:catch>\n```\n"
