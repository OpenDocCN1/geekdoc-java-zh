  trans: "\n\n## 变量处理\n`variable_name` 可以是用于存储异常信息的任何变量。如果在 `<c:catch>` 包围的语句中发生异常，则该变量将包含异常信息。让我们通过示例来理解这一点。\n\
    \n### 示例\n\n在这个示例中，我们特意通过将整数除以零来抛出算术异常，然后使用表达式语言 (EL) 打印 `errormsg` 变量（该变量包含异常信息）。\n\
    \n注意：如果 `<c:catch>` 语句块中没有发生异常，则变量（示例中为 `errormsg`）将具有 `null` 值。这就是为什么我们在打印变量值之前要检查\
    \ `errormsg!=null`。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title>JSTL c:catch 核心标签示例</title>\n</head>\n\
    <body>\n<%!\nint num1=10;\nint num2=0; %>\n<c:catch var =\"errormsg\">\n<% int\
    \ res = num1/num2;\n out.println(res);%>\n</c:catch>\n<c:if test = \"${errormsg\
    \ != null}\">\n <p>上述算术操作中发生了异常。请修复错误。\n 异常为：${errormsg}</p>\n</c:if>\n</body>\n\
    </html>\n```\n\n输出：\n![](img/image00409.jpeg)\n\n## JSTL <c:import> 核心标签\nJSTL\
    \ `<c:import>` 标签用于从另一个文件/页面导入内容到当前 JSP 页面。属性有 `var`、`URL` 和 `scope`。\n\n### 语法\n\
    ```xml\n<c:import var=\"variable_name\" url=\"relative_url\"/>\n```\n这里 `variable_name`\
    \ 是存储从另一个 url 导入数据的变量。\n`relative_url` 是需要导入的文件/页面地址。\n\n### <c:import> 属性\n-\
    \ `url`: 它是强制性属性，必须指定。\n- `var`: 这是一个可选属性，如果未指定，则导入的数据将打印在当前页面上。例如，语句 `<c:import\
    \ url=\"/file.jsp\" />` 将在客户端（浏览器）上打印 file.jsp 的数据。\n- `scope`: 也是可选的。如果我们使用 `var`\
    \ 属性，则可以配合 `scope` 来指定存储在变量中的数据的作用域。\n\n### 示例\n这是一个包含某些数据的页面。我们将在 `index.jsp`\
    \ 页面导入此页面。\n\n**display.jsp**\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<c:out value=\"Chandru\"/>\n<c:out value=\"JavaBook.com\" />\n\
    <c:out value=\"This is just a String\" />\n```\n\n**index.jsp**\n在这里我们将数据从 `display.jsp`\
    \ 导入到变量 `mydata`，然后使用 `<c:out>` 标签在浏览器上显示它。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title> JSTL c:import 标签示例</title>\n</head>\n\
    <body>\n<c:import var=\"mydata\" url=\"/display.jsp\"/>\n<c:out value=\"${mydata}\"\
    />\n</body>\n</html>\n```\n\n输出：\nChandru javabook.com This is just a string\n\
    \n## JSTL <c:forEach> 和 <c:forTokens> 核心标签\nJSTL 中的 `<c:forEach>` 标签用于执行有限次数的相同语句\
    \ set。它类似于 `java` 中的 `for` 循环。这基本上用于我们需要按照指定的次数反复执行（执行）一组语句的场景。\n\n`<c:forTokens>`\
    \ 也用于迭代，但它只与分隔符一起工作，这意味着使用此标签我们可以根据分隔符将输入数据分成多个部分。\n\n### <c:forEach> 标签\n\n####\
    \ <c:forEach> 语法\n```xml\n<c:forEach var=\"counter_variable_name\" begin=\"intial_value\"\
    \ end=\"final_limit\">\n    // 语句块\n</c:forEach>\n```\n以下是 `<c:forEach>` 标签的三个主要属性：\n\
    - `begin`: 初始计数值。\n- `end`: 循环执行的最终限制。\n- `var`: 计数器变量名。\n\n### 示例\n在这个示例中，我们使用\
    \ `<c:forEach>` 标签在循环中打印变量 `counter` 的值。循环从值 1（在 `begin` 属性中指定）开始，到值 10（`end`\
    \ 属性的值）。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
    c\" %>\n<html>\n<head>\n<title>JSTL 中 c:forEach 标签示例</title>\n</head>\n<body>\n\
    <c:forEach var=\"counter\" begin=\"1\" end=\"10\">\n    <c:out value=\"${counter}\"\
    />\n</c:forEach>\n</body>\n</html>\n```\n输出：\n![](img/image0041.jpeg)\n\n### <c:forTokens>\
    \ 标签\n\n#### <c:forTokens> 语法\n```xml\n<c:forTokens var=\"variable_name\" items=\"\
    value\" delim=\"delimiter\">\n```\n以下是 `<c:forTokens>` 标签的三个主要属性：\n- `items`:\
    \ 要分割的集合。\n- `delim`: 用于分割的分隔符。\n- `var`: 用于存储每个部分的变量名。\n\n### 示例\n在这个示例中，我们使用\
    \ `<c:forTokens>` 将字符串分成多个部分。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title>JSTL 中 c:forTokens 标签示例</title>\n</head>\n\
    <body>\n<c:forTokens var=\"site\" items=\"www.javabook.com\" delim=\".\">\n  \
    \  <c:out value=\"${site}\"/>\n</c:forTokens>\n</body>\n</html>\n```\n输出：\nwww\n\
    javabook\ncom\n\n## JSTL <c:param> 核心标签\n`<c:param>` 标签用于向 URL 添加参数。它通常用在 `<c:url>`\
    \ 内部。\n\n### 语法\n```xml\n<c:param name=\"parameter_name\" value=\"parameter_value\"\
    />\n```\n### 属性\n- `name`: 参数名。\n- `value`: 参数值。\n\n### 示例\n在这个示例中我们使用 `<c:param>`\
    \ 标签为 URL 添加参数。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title>JSTL c:param 标签示例</title>\n</head>\n\
    <body>\n<c:url value=\"/mypage.jsp\" var=\"completeURL\">\n<c:param name=\"Id\"\
    \ value=\"736\"/>\n<c:param name=\"user\" value=\"chandru\"/>\n</c:url>\n${completeURL}\n\
    </body>\n</html>\n```\n输出：\n/mypage.jsp?Id=736&user=chandru\n\n#### 示例 2: <c:redirect>\
    \ 中的 <c:param> 使用\n在这里在使用 `<c:param>` 带重定向传递参数，然后使用表达式语言的 `param` 变量在重定向页面上显示这些参数。\n\
    \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <html>\n<head>\n<title>c:param 示例 2</title>\n</head>\n<body>\n<c:redirect url=\"\
    /display.jsp\">\n<c:param name=\"UserId\" value=\"222\"/>\n<c:param name=\"UserName\"\
    \ value=\"ChandruBabu\"/>\n</c:redirect>\n</body>\n</html>\n```\n**display.jsp**\n\
    ```jsp\nUSER ID IS: ${param.UserId}\nUSER NAME IS: ${param.UserName}\n```\n输出：\n\
    USER ID IS: 222\nUSER NAME IS:ChandruBabu\n\n## JSTL <c:url> 核心标签\n`<c:url>` 标签用于\
    \ URL 格式化或 URL 编码。它将相对 URL 转换为上下文 URL。属性有 `var`、`context` 和 `scope`。\n\n### 语法\n\
    ```xml\n<c:url value=\"/file1.jsp\"/>\n```\n`value` 属性是 `<c:url>` 标签的强制性属性。该标签还有三个可选属性，如下：\n\
    \n"
- fmt: "\n*   `var`: Variable name to store the formatted url (resultant url).\n*\
    \   `context`: Used for specifying the application (or project name). Don’t get\
    \ it? We will see this with the help of an example later.\n*   `scope`: The scope\
    \ in which the `var` attribute would be stored. It can be `request`, `page`, `application`\
    \ or `session`.\n\nLet us understand the use of this tag and attributes with the\
    \ help of an example –\n\n### Example 1: `value` attribute of `<c:url>`\n\n```jsp\n\
    <%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n\
    <head>\n<title>JSTL c:url Tag Example</title>\n</head>\n<body>\n<c:url  value=\"\
    /file1.jsp\"/>\n</body>\n</html>\n```\nOutput: The above code produced below output.\n\
    `/JavaBook/file1.jsp`\n\nNote: `JavaBook` is my basics book name (in other words\
    \ JSP application name).\n\n### Example 2: `var` attribute of `<c:url>` tag\n\
    Let’s modify the example 1 like this. We have added a variable `myurl` in `<c:url>`.\
    \ Now the result of `<c:url>` would be stored in variable `myurl`.\n\n```jsp\n\
    <c:url  var=\"myurl\"  value=\"/file1.jsp\"/>\n${myurl}\n```\nOutput:\n`/JavaBook/file1.jsp`\n\
    \n### Example 3: `context` attribute\nBy default this tag takes the current application\
    \ as the context, however we can explicitly specify the context in `c url` as\
    \ shown in the below example –\n\nNote: The value of the `context` should always\
    \ starts with “/” otherwise you will get the below exception message –\n`HTTP\
    \ Status 500 – javax.servlet.ServletException: javax.servlet.jsp.JspTagException:\
    \ In URL tags, when the “context” attribute is specified, values of both “context”\
    \ and “url” must start with “/”.\n\n```jsp\n<c:url  var=\"myurl\"  value=\"/file1.jsp\"\
    \  context=\"/MyJSPProject\"/>\n${myurl}\n```\nOutput:\n`/MyJSPProject/file1.jsp`\n\
    \n### Example 4: Scope attribute\n```jsp\n<c:url var=\"myurl\" value=\"/file1.jsp\"\
    \ context=\"/MyJSPProject\" scope=\"session\"/>\n${requestScope.myurl}\n```\n\
    Output: Output screen will be blank as we have stored the `myurl` in `session`\
    \ scope and we are trying to print the value after fetching from `requestScope`.\n\
    \nCorrect usage: This is how it should be coded. Here we have stored in session\
    \ and fetching from `sessionScope` so it would work fine.\n\n```jsp\n<c:url  var=\"\
    myurl\"  value=\"/file1.jsp\"  context=\"/MyJSPProject\"  scope=\"session\"/>\n\
    ${sessionScope.myurl}\n```\nOutput:\n`/MyJSPProject/file1.jsp`\n\n14. `<c:redirect>`\
    \ tag: It is used for redirecting the current page to another URL, provide the\
    \ relative address in the `url` attribute of this tag and the page will be redirected\
    \ to the url.\n\n# JSTL `<c:redirect>` Core Tag\n\n`<c:redirect>` is used for\
    \ redirecting the current page to another URL.\n\n#### Syntax:\n```jsp\n<c:redirect\
    \  url=\"http://www.anydomainhere.com/samplepage.jsp\"/>\n```\nThis is how the\
    \ `<c:redirect>` tag looks. We just need to provide relative address in `URL`\
    \ attribute of this tag and the page will automatically be redirected the URL\
    \ when it gets.\n\n#### Example\nHere we are redirecting the page to a different\
    \ url based on the value of variable `myurl`. If the value is 1 page will be redirected\
    \ to `http://javabook.com` and for 2 it will go to `http://www.google.com`.\n\n\
    ```jsp\n<%@lib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n\
    <head>\n<title>JSTL c:redirect Example</title>\n</head>\n<body>\n <c:set  var=\"\
    myurl\"  value=\"2\"  scope=\"request\"/>\n <c:if test=\"${myurl==1}\">\n <c:redirect\
    \  url=\"http://javabook.com\"/>\n</c:if>\n <c:if test=\"${myurl==2}\">\n <c:redirect\
    \  url=\"http://www.google.com\"/>\n</c:if>\n</body>\n</html>\n```\nOutput: Since\
    \ the value of variable `myurl` is 2 the page gets directed to `http://www.google.com`.\n\
    \n# JSTL Functions\nFollowing are the tutorial links for useful JSTL functions.\
    \ Tag directive should be included in JSP page in order to use JSTL functions.\n\
    \n```jsp\n<%@ taglib prefix=\"fn\" uri=\"http://java.sun.com/jsp/jstl/functions\"\
    \ %>\n```\n\n`fn:contains`: This function checks whether the given string is present\
    \ in the input as sub-string. It does a case sensitive check.\n\n## fn:contains()\
    \ – JSTL Function\n`fn:contains()` checks whether the given string is present\
    \ in the input as sub-string. It does a case sensitive check, which means it considers\
    \ the case while checking for the sub-string.\n\n#### Syntax:\n`boolean contains(String\
    \ input, String check)`\nThe return type of this function is `boolean`. It returns\
    \ `true` when `checkstring` is present in `inputstring` else it returns `false`.\
    \ It has two string arguments – first one has `input` and second argument has\
    \ the string which needs to be checked.\n\n#### Example of `fn:contains()`\nIn\
    \ this example we are checking whether `new password` contains `old password`\
    \ as a sub-string, if it does then we are displaying a message to the user.\n\n\
    ```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n<html>\n\
    <head>\n<title>fn:contains example</title>\n</head>\n<body>\n<c:set  var=\"oldPassword\"\
    \  value=\"HelloPass\"/>\n<c:set  var=\"newPassword\"  value=\"HelloPass\"  />\n\
    <c:if test=\"${fn:contains(newPassword, oldPassword)}\">\n<c:out  value=\"New\
    \ Password should not contain old password as substring\"/>\n</c:if>\n</body>\n\
    </html>\n```\nOutput:\nNew Password should not contain old password as substring\n\
    \n2. `fn:containsIgnoreCase()`: It does a case insensitive check to see whether\
    \ the provided string is a sub-string of input.\n\n## fn:containsIgnoreCase()\
    \ – JSTL Function\nIn this post we are going to see `fn:containsIgnoreCase()`\
    \ function which does a case insensitive check to see whether the provided string\
    \ is a sub-string of input or not.\n\n#### Syntax:\n`boolean containsIgnoreCase(String\
    \ input, String check)`\nThe return type of this function is `boolean`. Like `fn:contains()`\
    \ function it also receives two string arguments and it checks whether the second\
    \ string is present in the first string (first argument). It doesn’ consider consider\
    \ the case evaluation.\n\n#### Example of `fn:containsIgnoreCase()`\nIn this example\
    \ we are having two strings – `string1` & `string2`. We are checking whether `string2`\
    \ is present in `string1`. If the result is true then we are displaying a message.\n\
    \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n<html>\n\
    <head>\n<title>fn:containsIgnoreCase() example</title>\n</head>\n<body>\n<c:set\
    \  var=\"string1\"  value=\"Hi This is CHANDRU from JavaBook.com\"/>\n<c:set \
    \ var=\"string2\"  value=\"chandru\"  />\n<c:if test=\"${fn:containsIgnoreCase(string1,\
    \ string2)}\">\n<c:out  value=\"Case Insensitive Check: String1 contains string2\"\
    />\n</c:if>\n</body>\n</html>\n```\nOutput:\nCase Insensitive Check:String1 contains\
    \ string2\n\n3. `fn:indexOf()`: It is used for finding out the start position\
    \ of a string in the provided string. Function returns -1 when string is not found\
    \ in the input.\n\n# fn:indexOf() – JSTL Function\n`fn:indexOf()` function is\
    \ used for finding out the start position (index) of a string in the provided\
    \ string.\n\n#### Syntax:\n`int indexOf(String, String)`\nThe return type of this\
    \ function is `int`. It returns the starting position (or index) of the second\
    \ string (second argument of the function) in the first string (first argument\
    \ of the function).\n\nPoints to Note:\n*   The function returns -1 when the string\
    \ is not found in the input string.\n*   Function is case sensitive. It treats\
    \ uppercase and lowercase character of same alphabet as different.\n*   It returns\
    \ the index of first occurrence which means if the string is present in input\
    \ more than once than the function would return the index of first occurrence.\
    \ Refer example.\n\n#### Example of `fn:indexOf()` function\nIn this example we\
    \ are finding out the index of few strings and displaying them using EL.\n\n```jsp\n\
    <%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<%@ taglib\
    \ uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n<html>\n<head>\n\
    <title>JSTL fn:indexOf() example</title>\n</head>\n<body>\n${fn:indexOf(\"My name\
    \ is Chandru pratap\", \"chandru\")}\n</body>\n```\n"
