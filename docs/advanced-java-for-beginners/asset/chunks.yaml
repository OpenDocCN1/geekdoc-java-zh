- fmt: "\n# Servlet Interface explained with Example\n\nIn my last guide about Servlet\
    \ API, I have explained that to create any Servlet you must implement the `Servlet`\
    \ interface directly or indirectly (indirectly implementation means extending\
    \ those classes that implements `Servlet` interface, These classes are `GenericServlet`\
    \ and `HttpServlet`).\n\nIf you are creating protocol dependent servlet such as\
    \ `http servlet` then you should extend `HttpServlet` class else for protocol\
    \ independent `Servlet` you extend `GenericServlet` class. \n\nIn this guide I\
    \ am not going to explain `GenericServlet` and `HttpServlet` in detail as I have\
    \ covered them in the separate guide.\n\nEdit: Here are the links of those guides:\
    \ [GenericServlet](#part0000.xhtml_generic) | [HttpServlet](#part0000.xhtml_httpservlet).\n\
    \nIn short you have 3 ways to create a servlet:\n\n1) By extending `HttpServlet`\
    \ class\n2) By extending `GenericServlet` class\n3) By implementing `Servlet`\
    \ interface\n\nNote: However you should always prefer the first way of creating\
    \ servlet i.e. by extending `HttpServlet` class.\n\n## Servlet Interface methods\n\
    \nHere is the list of methods available in `Servlet` interface.\n\n1) `Void destroy()`:\
    \ This method is called by Servlet container at the end of [servlet life cycle.](#part0000.xhtml_servletlife)\
    \ Unlike `service()` method that gets called multiple times during life cycle,\
    \ this method is called only once by Servlet container during the complete life\
    \ cycle. Once `destroy()` method is called the servlet container does not call\
    \ the `service()` method for that servlet.\n\n2) `Void init(ServletConfig config)`:\
    \ When Servlet container starts up (that happens when the web server starts up)\
    \ it loads all the servlets and instantiates them. After this `init()` method\
    \ gets called for each instantiated servlet, this method initializes the servlet.\n\
    \n3) `Void service(ServletRequest req, ServletResponse res)`: This is the only\
    \ method that is called multiple times during servlet life cycle. this methods\
    \ serves the client request, it is called every time the server receives a request.\n\
    \n4) `ServletConfig getServletConfig()`: Returns a `ServletConfig` object, which\
    \ contains initialization and startup parameters for this servlet.\n\n5) `Java.lang.String\
    \ getServletInfo()`: Returns information about the servlet, such as author, version,\
    \ and copyright.\n\n## Example:\n\nIn this example we have created a servlet class\
    \ by extending `Servlet` interface.\n\n### index.html\n```html\n<a href=\"welcome\"\
    >Click here to call the servlet</a>\n```\n\n### DemoServlet.java\n```java\nimport\
    \ java.io.*;\nimport javax.servlet.*;\n\npublic class DemoServlet implements Servlet\
    \ {\n\n    ServletConfig config=null;\n\n    public void init(ServletConfig config)\
    \ {\n        this.config=config;\n        System.out.println(\"Initialization\
    \ complete\");\n    }\n\n    public void service(ServletRequest req,ServletResponse\
    \ res)\n            throws IOException,ServletExceptionException {\n        res.setContentType(\"\
    text/html\");\n        PrintWriter pwriter=res.getWriter();\n        pwriter.print(\"\
    <html>\");\n        pwriter.print(\"<body>\");\n        pwriter.print(\"<h1>Servlet\
    \ Example Program</h1>\");\n        pwriter.print(\"</body>\");\n        pwriter.print(\"\
    </html>\");\n    }\n\n    public void destroy() {\n        System.out.println(\"\
    servlet life cycle finished\");\n    }\n\n    public ServletConfig getServletConfig()\
    \ {\n        return config;\n    }\n\n    public String getServletInfo() {\n \
    \       return \"A Demo program written by Chandru\";\n    }\n}\n```\n\n### web.xml\n\
    ```xml\n<web-app>\n<servlet>\n    <servlet-name>Javabook</servlet-name>\n    <servlet-class>DemoServlet</servlet-class>\n\
    </servlet>\n<servlet-mapping>\n    <servlet-name>Javabook</servlet-name>\n   \
    \ <url-pattern>/welcome</url-pattern>\n</servlet-mapping>\n</web-app>\n```\n\n\
    ## GenericServlet Class\n\n### GenericServlet Class with example\n\nWhile discussing\
    \ Servlet API, I have discussed little bit about Generic Servlet. In this article,\
    \ I will discuss Generic Servlet in detail.\n\nA generic servlet is a protocol\
    \ independent Servlet that should always override the `service()` method to handle\
    \ the client request. The `service()` method accepts two arguments `ServletRequest`\
    \ object and `ServletResponse` object. The request object tells the servlet about\
    \ the request made by client while the response object is used to return a response\
    \ back to the client.\n\n### How Generic Servlet works?\n\n![](Images/image00422.jpeg)\n\
    \n### Hierarchy of Generic Servlet\n`java.lang.Object`\n|_extended by `javax.servlet.GenericServlet`\n\
    \n`GenericServlet` is an abstract class and it has only one abstract method, which\
    \ is `service()`. That’s why when we create Generic Servlet by extending `GenericServlet`\
    \ class, we must override `service()` method.\n\n**Pros of using Generic Servlet:**\n\
    1. Generic Servlet is easier to write\n2. Has simple lifecycle methods\n3. To\
    \ write Generic Servlet you just need to extend `javax.servlet.GenericServlet`\
    \ and override the `service()` method (check the example below).\n\n**Cons of\
    \ using Generic Servlet:**\nWorking with Generic Servlet is not that easy because\
    \ we don’t have convenience methods such as `doGet()`, `doPost()`, `doHead()`\
    \ etc in Generic Servlet that we can use in Http Servlet. \n\nIn `HttpServlet`\
    \ we need to override particular convenience method for particular request, for\
    \ example if you need to get information then override `doGet()`, if you want\
    \ to send information to server override `doPost()`. However in Generic Servlet\
    \ we only override `service()` method for each request. I would always recommend\
    \ to use `HttpServlet` instead of `GenericServlet`.\n\n### Example of GenericServlet\n\
    \nI am using Eclipse for this example. Create “Dynamic Web Project” from the Eclipse\
    \ menu.\n\nNote: Go back from [Servlet Interface](#part0000.xhtml_servlet)\nNote:\
    \ If you are unfamiliar with Eclipse then refer this guide: [How to Install Eclipse](#part0000.xhtml_creat)\n\
    \nProject structure would look like this once you are done creating following\
    \ files:\n![](Images/image0423.jpeg)\n\n### index.html\nWe are creating an html\
    \ file that would call the servlet once we click the link on web page. Create\
    \ this file in `WebContent` folder. The path of the file should look like: `WebContent/index.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Http\
    \ Servlet Demo</title>\n</head>\n<body>\n<a href=\"welcome\">Click to Servlet</a>\n\
    </body>\n</html>\n```\n\n### ExampleGeneric.java\nNow, we are creating a Generic\
    \ Servlet by extending `GenericServlet` class. When creating a `GenericServlet`\
    \ you should always override `service()` method. Right click on the `src` folder\
    \ and create a new class, name the file as `ExampleGeneric`. The file path should\
    \ look like: `Java Resources/src/default package/ExampleGeneric.java`\n\n```java\n\
    import java.io.*;\nimport javax.servlet.*;\n\npublic class ExampleGeneric extends\
    \ GenericServlet {\n\n    public void service(ServletRequest req,ServletResponse\
    \ res) throws IOException, ServletException {\n        res.setContentType(\"text/html\"\
    );\n        PrintWriter pwriter=res.getWriter();\n        pwriter.print(\"<html>\"\
    );\n        pwriter.print(\"<body>\");\n        pwriter.print(\"<h2>Generic Servlet\
    \ Example</h2>\");\n        pwriter.print(\"<p>Hello JavaBook Readers!</p>\");\n\
    \        pwriter.print(\"</body>\");\n        pwriter.print(\"</html>\");\n  \
    \  }\n}\n```\n\n### web.xml\nThis file can be found at this path `WebContent/WEB-INF/web.xml`.\
    \ In this file we will map the Servlet with the specific URL. Since we are calling\
    \ welcome page upon clicking the link on `index.html` page so we are mapping the\
    \ welcome page to the Servlet class we created above.\n\n```xml\n<web-app>\n<display-name>JavaBookServlet</display-name>\n\
    <welcome-file-list>\n<welcome-file>index.html</welcome-file>\n<welcome-file>index.htm</welcome-file>\n\
    <welcome-file>index.jsp</welcome-file>\n<welcome-file>default.html</welcome-file>\n\
    </welcome-file-list>\n</web-app>\n```\n"
  raw: "# Servlet Interface explained with Example\n\n# In my last guide about Servlet\
    \ API, I have explained that to create any Servlet you must implement the Servlet\
    \ interface directly or indirectly (indirectly implementation means extending\
    \ those classes that implements Servlet interface, These classes are GenericServlet\
    \ and HttpServlet).\n\n# If you are creating protocol dependent servlet such as\
    \ http servlet then you should extend HttpServlet class else for protocol independent\
    \ Servlet you extend GenericServlet class.\n\n# In this guide I am not going to\
    \ explain GenericServlet and HttpServlet in detail as I have covered them in the\
    \ separate guide.\n\n# Edit: Here are the links of those guides: [GenericServlet](#part0000.xhtml_generic)\
    \ | [HttpServlet](#part0000.xhtml_httpservlet).\n\n# In short you have 3 ways\
    \  to create a servlet:\n\n1) By extending HttpServlet class\n\n2) By extending\
    \ GenericServlet class\n\n3) By implementing Servlet interface\n\nNote:  However\
    \ you should always prefer the first way of creating servlet i.e. by extending\
    \ HttpServlet class.\n\n### Servlet Interface methods\n\nHere is the list of methods\
    \ available in Servlet interface.\n\n# 1) Void destroy(): This method is called\
    \ by Servlet container at the end of [servlet life cycle.](#part0000.xhtml_servletlife)\
    \  Unlike service() method that gets called multiple times during life cycle,\
    \ this method is called only once by Servlet container during the complete life\
    \ cycle. Once destroy() method is called the servlet container does not call the\
    \ service() method for that servlet.\n\n2) Void init(ServletConfig config): When\
    \ Servlet container starts up (that happens when the web server starts up) it\
    \ loads all the servlets and instantiates them. After this init() method gets\
    \ called for each instantiated servlet, this method initializes the servlet.\n\
    \n3) Void service(ServletRequest req, ServletResponse res): This is the only method\
    \ that is called multiple times during servlet life cycle. This methods serves\
    \ the client request, it is called every time the server receives a request.\n\
    \n4) ServletConfig getServletConfig(): Returns a ServletConfig object, which contains\
    \ initialization and startup parameters for this servlet.\n\n5) Java.lang.String\
    \ getServletInfo(): Returns information about the servlet, such as author, version,\
    \ and copyright.\n\n## Example:\n\nIn this example we have created a servlet class\
    \ by extending Servlet interface.\n\nindex.html\n\n<a  href=\"welcome\">Click\
    \ here to call the servlet</a>\n\nDemoServlet.java\n\nimport java.io.*;\n\nimport\
    \ javax.servlet.*;\n\npublic  class  DemoServlet  implements  Servlet{\n\n ServletConfig\
    \ config=null;\n\n public  void init(ServletConfig config){\n\n this.config=config;\n\
    \n System.out.println(\"Initialization complete\");\n\n   }\n\n public  void service(ServletRequest\
    \ req,ServletResponse res)\n\n throws  IOException,ServletException{\n\n      \
    \ res.setContentType(\"text/html\");\n\n PrintWriter pwriter=res.getWriter();\n\
    \n       pwriter.print(\"<html>\");\n\n       pwriter.print(\"<body>\");\n\n      \
    \ pwriter.print(\"<h1>Servlet Example Program</h1>\");\n\n       pwriter.print(\"\
    </body>\");\n\n       pwriter.print(\"</html>\");\n\n   }\n\n public  void destroy(){\n\
    \n System.out.println(\"servlet life cycle finished\");\n\n   }\n\n public  ServletConfig\
    \ getServletConfig(){\n\n return config;\n\n   }\n\n public  String getServletInfo(){\n\
    \n return  \"A Demo program written by Chandru\";\n\n   }\n\n}\n\nweb.xml\n\n\
    <web-app>\n\n<servlet>\n\n <servlet-name>Javabook</servlet-name>\n\n <servlet-class>DemoServlet</servlet-class>\n\
    \n</servlet>\n\n<servlet-mapping>\n\n <servlet-name>Javabook</servlet-name>\n\n\
    \ <url-pattern>/welcome</url-pattern>\n\n</servlet-mapping>\n\n</web-app>\n\n\
    # GenericServlet Class\n\n# GenericServlet Class with example\n\n# While discussing\
    \ Servlet API, I have discussed little bit about Generic Servlet. In this article,\
    \ I will discuss Generic Servlet in detail.\n\n# A generic servlet is a protocol\
    \ independent Servlet that should always override the service() method to handle\
    \ the client request. The service() method accepts two arguments ServletRequest\
    \ object and ServletResponse object. The request object tells the servlet about\
    \ the request made by client while the response object is used to return a response\
    \ back to the client.\n\n### How Generic Servlet works?\n\n# ![](Images/image00422.jpeg)\n\
    \n### Hierarchy of Generic Servlet\n\njava.lang.Object\n\n|_extended byjavax.servlet.GenericServlet\n\
    \nGenericServlet is an abstract class and it has only one abstract method, which\
    \ is service(). That’s why when we create Generic Servlet by extending GenericServlet\
    \ class, we must override service() method.\n\nPros of using Generic Servlet:\n\
    \n1\\. Generic Servlet is easier to write\n\n2\\. Has simple lifecycle methods\n\
    \n3\\. To write Generic Servlet you just need to extend javax.servlet.GenericServlet\
    \ and override the service() method (check the example below).\n\nCons of using\
    \ Generic Servlet:\n\nWorking with Generic Servlet is not that easy because we\
    \ don’t have convenience methods such as doGet(), doPost(), doHead() etc in Generic\
    \ Servlet that we can use in Http Servlet.\n\nIn Http Servlet we need to override\
    \ particular convenience method for particular request, for example if you need\
    \ to get information then override doGet(), if you want to send information to\
    \ server override doPost(). However in Generic Servlet we only override service()\
    \ method for each type of request which is cumbersome.\n\nI would always recommend\
    \ you to use HttpServlet instead of the GenericServlet. HttpServlet is easier\
    \ to work with, and has more methods to work with than GenericServlet.\n\n###\
    \ Example of GenericServlet\n\nI am using Eclipse IDE for this example. Create\
    \ New “Dynamic Web Project” from the Eclipse file menu.\n\nNote:\n\nGo back from\
    \ here\n\n[Servlet Interface](#part0000.xhtml_servletinter)\n\nNote:I have explained\
    \ all the steps for creating Servlet in Eclipse IDE, however if you are unfamiliar\
    \ with Eclipse and don’t have it installed on your system then refer this guide:\
    \ [How to Install Eclipse, configure tomcat and run your First Servlet Application\
    \ using Eclipse.](#part0000.xhtml_createndrun)\n\nProject structure (or you can\
    \ hierarchy) would look like this, once you are done creating all the following\
    \ files in IDE.\n\n# ![](Images/image00423.jpeg)\n\nindex.html\n\nWe are creating\
    \ an html file that would call the servlet once we click on the link on web page.\
    \ Create this file in WebContent folder. The path of the file should look like\
    \ this: WebContent/index.html\n\nindex<!DOCTYPE html>\n\n<html>\n\n<head>\n\n\
    <meta charset=\"UTF-8\">\n\n<title>Http  Servlet  Demo</title>\n\n</head>\n\n\
    <body>\n\n<a href=\"welcome\">Click to call Servlet</a>\n\n</body>\n\n</html>\n\
    \nExampleGeneric.java\n\nNow, we are creating a Generic Servlet by extending GenericServlet\
    \ class. When creating a GenericServlet you should always override service() method.\
    \ Right click on the src folder and create a new class file, name the file as\
    \ ExampleGeneric. The file path should look like this: Java Resouces/src/default\
    \ package/ExampleGeneric.java\n\nimport java.io.*;\n\nimport javax.servlet.*;\n\
    \npublic  class  ExampleGeneric  extends  GenericServlet{\n\n public  void service(ServletRequest\
    \ req,ServletResponse res)\n\nthrows  IOException,ServletException{\n\n   res.setContentType(\"\
    text/html\");\n\n PrintWriter pwriter=res.getWriter();\n\n   pwriter.print(\"\
    <html>\");\n\n   pwriter.print(\"<body>\");\n\n   pwriter.print(\"<h2>Generic\
    \ Servlet Example</h2>\");\n\n   pwriter.print(\"<p>Hello JavaBook Readers!</p>\"\
    );\n\n   pwriter.print(\"</body>\");\n\n   pwriter.print(\"</html>\");\n\n }\n\
    \n}\n\nweb.xml\n\nThis file can be found at this path WebContent/WEB-INF/web.xml.\
    \ In this file we will map the Servlet with the specific URL. Since we are calling\
    \ welcome page upon clicking the link on index.html page so we are mapping the\
    \ welcome page to the Servlet class we created above.\n\n<web-app>\n\n<display-name>JavaBookServlet</display-name>\n\
    \n<welcome-file-list>\n\n<welcome-file>index.html</welcome-file>\n\n<welcome-file>index.htm</welcome-file>\n\
    \n<welcome-file>index.jsp</welcome-file>\n\n<welcome-file>default.html</welcome-file>"
