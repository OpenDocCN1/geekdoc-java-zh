    \ statement in java which evaluates a condition and executes a block of code if\
    \ the result is true.\n\n### Syntax:\nThis is the basic syntax of `<c:if>` core\
    \ tag. The set of statements enclosed within `<c:if>` tag gets executed if `test=\"\
