    /file1.jsp\"  context=\"/MyJSPProject\"  scope=\"session\"/>\n\n${sessionScope.myurl}\n\
    \nOutput:\n\n/MyJSPProject/file1.jsp\n\n14.<c:redirect> tag: It is used for redirecting\
    \ the current page to another URL, provide the relative address in the URL attribute\
    \ of this tag and the page will be redirected to the url.\n\n# JSTL <c:redirect>\
    \ Core Tag\n\n<c:redirect> is used for redirecting the current page to another\
    \ URL.\n\n#### Syntax:\n\n<c:redirect  url=\"http://www.anydomainhere.com/samplepage.jsp\"\
    />\n\nThis is how the <c:redirect> tag looks like. We just need to provide the\
    \ relative address in the URL attribute of this tag and the page will automatically\
    \ be redirected the URL provided when it gets loaded.\n\n#### Example\n\nHere\
    \ we are redirecting the page to a different url based on the value of the variable\
    \ myurl. If the value is 1 page will be redirected to http://javabook.com and\
    \ for 2 it will go to http://www.google.com.\n\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n\n<html>\n\n<head>\n\n<title> JSTL c:redirect Tag Example</title>\n\
    \n</head>\n\n<body>\n\n <c:set  var=\"myurl\"  value=\"2\"  scope=\"request\"\
    />\n\n  <c:if test=\"${myurl<1}\">\n\n <c:redirect  url=\"http://javabook.com\"\
    />\n\n </c:if>\n\n <c:if  test=\"${myurl>1}\">\n\n <c:redirect  url=\"http://www.google.com\"\
    />\n\n </c:if>\n\n</body>\n\n</html>\n\nOutput: Since the value of the variable\
    \ myurl is 2 the page gets directed to the http://www.google.com.\n\nJSTL Functions\n\
    \nFollowing are the tutorial links for useful JSTL functions with examples. Following\
    \ Taglib directive should be included in the JSP page in order to use the JSTL\
    \ functions.\n\n<%@ taglib prefix=\"fn\" uri=\"http://java.sun.com/jsp/jstl/functions\"\
    \ %>\n\n1\\. fn:contains function: This function checks whether the given string\
    \ is present in the input as sub-string. It does a case sensitive check.\n\n#\
    \ fn:contains() – JSTL Function\n\nfn:contains() function checks whether the given\
    \ string is present in the input as sub-string. It does a case sensitive check,\
    \ which means it considers the case while checking for the sub-string.\n\n####\
    \ Syntax:\n\nboolean fn:contains(String inputstring, String checkstring)\n\nThe\
    \ return type of this function is boolean. It returns true when the checkstring is\
    \ present in inputstring else it returns false. It has two string arguments –\
    \ first one has input string and second argument has the string which needs to\
    \ be checked in input string.\n\n#### Example of fn:contains()\n\nIn this example\
    \ we are checking whether the new password contains old password as a sub-string,\
    \ if it does then we are displaying a message to the user.\n\n<%@ taglib uri=\"\
    http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\"\
    \ prefix=\"fn\" %>\n\n<html>\n\n<head>\n\n<title>fn:contains example</title>\n\
    \n</head>\n\n<body>\n\n<c:set  var=\"oldPassword\"  value=\"HelloPass\"/>\n\n\
    <c:set  var=\"newPassword\"  value=\"HelloPassNew\"  />\n\n<c:if  test=\"${fn:contains(newPassword,\
    \ oldPassword)}\">\n\n <c:out  value=\"New Password should not contain old password\
    \ as substring\"/>\n\n</c:if>\n\n</body>\n\n</html>\n\nOutput:\n\nNew Password\
    \ should not contain old password as substring\n\n2. fn:containsIgnoreCase():\
    \ It does a case insensitive check to see whether the provided string is a sub-string\
    \ of input.\n\n# fn:containsIgnoreCase() – JSTL Function\n\nIn this post we are\
    \ going to see fn:containsIgnoreCase() function which does a case insensitive\
    \ check to see whether the provided string is a sub-string of input or not.\n\n\
    #### Syntax:\n\nboolean fn:containsIgnoreCase(String input, String checkstring)\n\
    \nThe return type of this function is boolean. Like fn:contains() function it\
    \ also receives two string arguments and it checks whether the second string is\
    \ present in the first string(first argument). It doesn’t consider the case during\
    \ evaluation.\n\n#### Example of fn:containsIgnoreCase()\n\nIn this example we\
    \ are having two strings – string1 & string2\\. We are checking whether the string2\
    \ is present in string1\\. If the result is true then we are displaying a message.\n\
    \n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\n<%@\
    \ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n\n<html>\n\
    \n<head>\n\n<title>fn:containsIgnoreCase() example</title>\n\n</head>\n\n<body>\n\
    \n<c:set  var=\"string1\"  value=\"Hi This is CHANDRU from JavaBook.com\"/>\n\n\
    <c:set  var=\"string2\"  value=\"chandru\"  />\n\n<c:if  test=\"${fn:containsIgnoreCase(string1,\
    \ string2)}\">\n\n <c:out  value=\"Case Insensitive Check: String1 contains string2\"\
    />\n\n</c:if>\n\n</body>\n\n</html>\n\nOutput:\n\nCase Insensitive Check:String1\
    \ contains string2\n\n3. fn:indexOf():  It is used for finding out the start position\
    \ of a string in the provided string. Function returns -1 when string is not found\
    \ in the input.\n\n# fn:indexOf() – JSTL Function\n\nfn:indexOf() function is\
    \ used for finding out the start position (index) of a string in the provided\
    \ string.\n\n#### Syntax:\n\nint indexOf(String,  String )\n\nThe return type\
    \ of this function is int. It returns the starting position (or index) of the\
    \ second string (second argument of the function) in the first string (first argument\
    \ of the function).\n\nPoints to Note:\n\n*   The function returns -1 when the string\
    \ is not found in the input string.\n\n*   Function is case sensitive. It treats\
    \ uppercase and lowercase character of same alphabet as different.\n\n*   It returns\
    \ the index of first occurrence which means if the string is present in input\
    \ more than once than the function would return the index of first occurrence.\
    \ Refer example.\n\n#### Example of fn:indexOf() function\n\nIn this example we\
    \ are finding out the index of few strings and displaying them using EL\n\n<%@\
    \ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\n<%@ taglib\
    \ uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n\n<html>\n\n\
    <head>\n\n<title>JSTL fn:indexOf() example</title>\n\n</head>\n\n<body>\n\n${fn:indexOf(\"\
    My name is Chandru pratap\", \"chandru\")}"
