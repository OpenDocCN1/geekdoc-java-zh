    # Exception Implicit Object

    ## Exception Implicit Object in JSP with examples

    In this tutorial, we will discuss exception implicit object of JSP. It is an instance
    of `java.lang.Throwable` and the frequently used for exception handling. This
    object is only available for error pages, which means a JSP page should have `isErrorPage`
    to true in order to use exception implicit object. Let’s understand this with
    the help of below example –


    ### Exception implicit Object Example

    Exception implicit Object with example.


    index.html

    ```html

    <html>

    <head>

    <title>Enter two Integers for Division</title>

    </head>

    <body>

    <form action="division.jsp">

    Input First Integer:<input type="text" name="firstnum" />

    Input Second Integer:<input type="text" name="secondnum" />

    <input type="submit" value="Get Results"/>

    </form>

    </body>

    </html>

    ```

    Here we have specified `exception.jsp` as `errorPage` which means if any exception
    occurs in this JSP page, the control will immediately transferred to the `exception.jsp`
    JSP page.


    division.jsp

    ```jsp

    <%@ page errorPage="exception.jsp" %>

    <%

    String num1=request.getParameter("firstnum");

    String num2=request.getParameter("secondnum");

    int v1= Integer.parseInt(num1);

    int v2= Integer.parseInt(num2);

    int res= v1/v2;

    out.print("Output is: "+ res);

    %>

    ```

    In the below JSP page we have set `isErrorPage` to true which is also an attribute
    of Page directive, used for making a page eligible for exception handling. Since
    this page is defined as a exception page in `division.jsp`, in case of any exception
    condition this page will be invoked. Here we are displaying the error message
    to the user using `exception` implicit object.


    exception.jsp

    ```jsp

    <%@ page isErrorPage="true" %>

    <html>

    <body>

    <h2>Error occurred: <%= exception %></h2>

    </body>

    </html>

    ```

