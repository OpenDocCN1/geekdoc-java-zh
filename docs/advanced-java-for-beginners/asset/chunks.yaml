    ![](Images/image00386.jpeg)


    Arithmetic Exception message when we have provided the second integer as zero.


    ![](Images/image00387.jpeg)


    This is one of the most frequently used implicit object while building an application
    in JSP. As an alternative, you can also handle exceptions in JSP by using try
    catch catch within JSP scriptlet.


