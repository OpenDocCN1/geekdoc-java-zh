    # Config Implicit Object


    ## Config Implicit Object in JSP with examples

    It is an instance of `javax.servlet.Config`. Config object is used for getting
    information for a particular page. Using application object we can get application-wide
    parameters, however using Config we get initialization parameters of individual
    servlet mapping.


    ### Methods of Config Implicit Object

    1. `String getInitParameter(String paramname)`: Same what we discussed in application
    implicit object.

    2. `Enumeration getParameterNames()`: Returns enumeration of Initialization parameters.

    3. `ServletContext getServletContext()`: This method returns a reference to Servlet
    context.

    4. `String getServletName()`: It returns the name of servlet we define in `<servlet-name>`.


    ## Config Implicit Object Example


    ### web.xml

    Let’s say below is `web.xml` file. I’m just defining servlet name and servlet
    mapping in it. Later, I would fetch few details from this using `config` implicit
    object.


    ```xml

    <web-app>

    <servlet>

    <servlet-name>JavaBookServlet</servlet-name>

    <jsp-file>index.jsp</jsp-file>

    </servlet>

    <servlet-mapping>

    <servlet-name>JavaBookServlet</servlet-name>

    <url-pattern>/index</url-pattern>

    </servlet-mapping>

    </web-app>

    ```


    ### index.jsp

    In this JSP page we are calling `getServletName()` method of `config` object for
    fetching the servlet name from `web.xml` file.


    ```html

    <html>

    <head><title> Config Implicit Object</title></head>

    <body>

    <%

    String sname=config.getServletName();

    out.print("Servlet Name is: "+sname);

    %>

    </body>

    </html>

    ```


    ### Output:

    This is the output screen for the above JSP page.

    ![](Images/image00391.jpeg)


    # EXPRESSION LANGUAGE


    ## Expression language in JSP

    Expression language (EL) – We can easily access the data of variables, bean components
    and expressions using Expression language. Must read this tutorial for JSP Java.


    Expression language (EL) has been introduced in JSP 2.0. The main purpose of it
    to simplify the process of accessing data from bean properties and from implicit
    objects. EL includes arithmetic, relational and logical operators too.


    ### Syntax of EL:

    `${expression}`


    Whatever present inside braces gets evaluated at runtime and being sent to the
    output stream.


    ### Example 1: Expression langage evaluates the expressions

    In this example we are evaluating the expressions with the help of EL.


    ```html

    <html>

    <head>

    <title>Expression language example1</title>

    </head>

    <body>

    ${1<2}

    ${1+2+3}

    </body>

    </html>

    ```


