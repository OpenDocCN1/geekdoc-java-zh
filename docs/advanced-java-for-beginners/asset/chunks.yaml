    ${fn:toLowerCase(\"HELLO\")}\n</body>\n</html>\n```\n\nOutput:\nThis is an Example\
    \ of jstl function hello\n\n## 15. `fn:replace()`\n`fn:replace()` function search\
    \ for a string in the input and replace it with the provided string. It does case\
    \ sensitive processing.\n\n# `fn:replace()` – JSTL Function\n\nIt search for a\
    \ string in the input and replace it with the provided string. The following is\
    \ the basic syntax of `fn:replace()` function.\n\n### Syntax\n`String fn:replace(String\
    \ input, String search_for, String replace_with)`\n\nThree string arguments and\
    \ return type is also `String`. It searches the `search_for` string in `input`\
    \ and replaces it with `replace_with` string. If the string is not found it returns\
    \ the actual input as it is.\n\n**Note:** It does case sensitive processing.\n\
    \n### Example\nIn this example we are using `fn:replace()` function on two input\
    \ strings.\n\n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
    c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\"\
    \ %>\n<html>\n<head>\n<title>JSTL fn:replace() example</title>\n</head>\n<body>\n\
    <c:set var=\"author\" value=\"Chandru Babu\"/>\n<c:set var=\"randomstring\" value=\"\
    abc def abc ghi ABC\"/>\n${fn:replace(author, \"Chandru\", \"Rahul\")}\n${fn:replace(randomstring,\
    \ \"abc\", \"hello\")}\n</body>\n</html>\n```\n\nOutput:\nRahul Babu hello def\
    \ hello ghi ABC\n\nObserve the output you would find that the “ABC” in `randomstring`\
    \ variable remains as it is while the other “abc” substrings got replaced with\
    \ “hello”. It happened because of the case sensitive match, we are replacing lowercase\
    \ “abc” in the above example.\n\n# JSON TUTORIAL\n### JSON Tutorial: Learn JSON\
    \ in 10 Minutes\n\nJSON stands for JavaScript Object Notation. JSON objects are\
    \ used for transferring data between server and client, XML serves the same purpose.\
    \ However JSON objects have several advantages over XML and we are going to discuss\
    \ them in this tutorial along with JSON concepts and its usages.\n\nLet us have\
