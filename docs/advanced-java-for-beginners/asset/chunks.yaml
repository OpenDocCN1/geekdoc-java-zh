    # Exception 隐式对象

    ## JSP 中的 Exception 隐式对象示例

    在本教程中，我们将讨论 JSP 的 exception 隐式对象。它是 `java.lang.Throwable` 的实例，经常用于异常处理。该对象仅错误页面可用，这意味着
    JSP 页面必须设置 `isErrorPage` 为 true 才能使用该隐式对象。让我们通过下面的示例来理解——


    ### Exception 隐式对象示例

    Exception 隐式对象示例。


    index.html

    ```html

    <html>

    <head>

    <title>输入两个整数进行除法</title>

    </head>

    <body>

    <form action="division.jsp">

    输入第一个整数:<input type="text" name="firstnum" />

    输入第二个整数:<input type="text" name="secondnum" />

    <input type="submit" value="获取结果"/>

    </form>

    </body>

    </html>

    ```

    在这里我们指定 `exception.jsp` 为 `errorPage`，这意味着如果此 JSP 页面发生任何异常，控制权将立即转移到 `exception.jsp`
    JSP 页面。


    division.jsp

    ```jsp

    <%@ page errorPage="exception.jsp" %>

    <%

    String num1=request.getParameter("firstnum");

    String num2=request.getParameter("secondnum");

    int v1= Integer.parseInt(num1);

    int v2= Integer.parseInt(num2);

    int res= v1/v2;

    out.print("Output is: "+ res);

    %>

    ```

    在下面的 JSP 页面中，我们将 `isErrorPage` 设置为 true，这是 Page 指令的一个属性，用于使页面具备处理异常的能力。由于此页面在
    `division.jsp` 中被定义为异常页面，因此在发生异常的情况下该页面将被调用。在这里我们使用 `exception` 隐式对象向用户显示错误消息。


    exception.jsp

    ```jsp

    <%@ page isErrorPage="true" %>

    <html>

    <body>

    <h2>发生错误: <%= exception %></h2>

    </body>

    </html>

    ```

