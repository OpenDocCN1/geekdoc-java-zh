    \  20. 表达式语言 (EL)\n- 异常处理 (EXCEPTION HANDLING)](#\n  22. JSP 中的自定义标签\n  23. 如何访问自定义标签的体内容\n\
    - 指令 (DIRECTIVES)](#\n  29. JSON 教程\n- Servlet 教程 (SERVLET TUTORIALS) %>\n</BODY>\n\
    </HTML>\n```\n\n### 你的第一个 JSP\n让我们从简单的 JSP 开始学习 JSP。\n\n```html\n<%-- JSP 注释 --%>\n\
    <HTML>\n<HEAD>\n<TITLE>MESSAGE</TITLE>\n</HEAD>\n<BODY>\n<%out.print(\"Hello,\
    \ Sample JSP code\");%>\n</BODY>\n</HTML>\n```\n\n上面的 JSP 生成以下输出：\n`Hello, Sample\
    \ JSP code.`\n\n### 上述代码解释\n1) `<%–JSP Comment–%>` 行表示名为 `JSP Comment` 的 JSP 元素，在\
    \ JSP 页面上添加注释时可以使用此标签，我们将在随后的文章中详细讨论。\n注意：JSP 注释必须以 `<%–` 开头并以 `%>` 结尾。\n\n2)\
    \ `Head`、`Title` 和 `Body` 标签是 HTML 标签 – 它们是 HTML 标签，经常用于静态网页。它们包含的任何内容都会原样传递给客户端（Web\
    \ 浏览器）。\n\n3) `<%out.print(\"Hello, Sample JSP code\");%>` 是一个脚本段（scriptlet）。`out`\
    \ 是一个用于向缓冲区打印内容的隐式对象。\n\n### Servlet vs JSP\n它们之间的主要区别是 Servlet 添加 Java 代码，而 JSP\
    \ 在 HTML 内部添加 Java。\n\n#### Servlet\n1. Servlet 是支持 HTML 标签的 Java 程序。\n2. 通常用于开发企业应用程序的业务层（复杂代码）。\n\
    3. 由 Java 开发者创建和维护。\n\n#### JSP\n1. JSP 程序是支持 Java 语句的 HTML 代码。准确地说， JSP 在 HTML\
    \ 中嵌入 Java。\n2. 用于开发企业应用程序的表现层\n3. 经常被 Web 开发者使用。\n\n### JSP 的优点\nJSP 具有 Servlet\
    \ 的所有优点，如：比 CGI 更高效；内置 Session 功能；它还继承了 Java 特性，如多线程、异常处理、数据库连接。\n\nJSP 实现了内容生成与内容展示的分离。这使其更加灵活。\n\
    \n有了 JSP，Web 设计师现在可以展示所需的信息。Web 应用程序程序员可以专注于如何处理/构建信息。\n\n# JSP 架构\n在开始开发 Web\
    \ 应用程序之前，我们应该对架构有一个基本的了解。根据请求处理的位置（Servlet 或 JSP），JSP 有两种架构。它们是 Model1 架构和 Model2\
    \ 架构。\n\n1. Model1 架构：在这种模型中，JSP 扮演关键角色，负责处理客户端提出的请求。客户端（Web 浏览器）发出请求，JSP 然后创建一个\
    \ Bean 对象，完成请求并将响应传递给 JSP。JSP 然后将响应返回给客户端。与 Model2 架构不同，这种模型的大部分处理由 JSP 本身完成。\n\
    \n![](img/image00361.jpeg)\n\n2. Model2 架构：在这种模型中，Servlet 扮演主要角色并负责处理客户端（网页浏览器）请求。表现部分（GUI\
    \ 部分）将由 JSP 处理，并如如下所示通过 Bean 完成。Servlet 充当控制器并负责请求处理。如果 JSP 页面需要，它会创建 Bean 对象并调用相应的\
    \ JSP 页面。JSP 使用 Bean 对象处理表现部分。在这种模型中，JSP 不进行任何处理，Servlet 根据客户端提出的请求创建 Bean 对象并调用\
    \ JSP 程序。\n\n![](img/image00362.jpeg)\n\n"
- fmt: "\n# Java Server Pages (JSP) Life Cycle\n\nJSP pages are saved with `.jsp`\
    \ extension which lets the server know that this is a JSP page and needs to go\
    \ through JSP life cycle stages.\n\nIn my previous post about JSP introduction,\
    \ I explained that JSP is not processed as such, they first get converted into\
    \ `Servlets` and then the corresponding servlet gets processed by Server.\n\n\
    When client makes a request to `Server`, it first goes to `container`. Then `container`\
    \ checks whether the servlet class is older than jsp page (To ensure that the\
    \ JSP file got modified). If this is the case then `container` does the translation\
    \ again (converts JSP to `Servlet`) otherwise it skips the translation phase (i.e.\
    \ if JSP webpage is not modified then it doesn’t do the translation to improve\
    \ the performance as this phase takes time and to repeat this step every time\
    \ is not time feasible).\n\nThe steps in the life cycle of JSP page are:\n\n1)\
    \ Translation\n2) Compilation\n3) Loading\n4) Instantiation\n5) Initialization\n\
    6) Request Processing\n7) Destruction\n\n![](Images/image00363.jpeg)\n\n## Let\
    \ see the Life cycle of JSP in more detail\n\n1) As stated above whenever `container`\
    \ receives request from client, it does translation only when the servlet class\
    \ is older than JSP page otherwise it skips this phase (reason I explained above).\n\
    \n2) Then the `container` –\n- Compiles the corresponding servlet program\n- Loads\
    \ the corresponding servlet class\n- Instantiates the servlet class\n- Calls the\
    \ `jspInit()` method to initialize the servlet instance( Jsp container will do\
    \ this job only when the instance of servlet file is not running or if it is older\
    \ than the jsp file).\n\n```java\npublic void jspInit()\n{\n    //code to intialize\
    \ Servlet instances\n}\n```\n\n3) A new thread is then gets created, which invokes\
    \ the `_jspService()` method, with a request (`HttpServletRequest`) and response\
    \ (`HttpServletRespnse`) objects as parameters -shown below.\n\n```java\nvoid\
    \ _jspService( HttpServletRequest req, HttpServletResponse res)\n{\n    //code\
    \ goes here\n}\n```\n\n4) Invokes the `jspDestroy()` method to destroy the instance\
    \ of the servlet class. Code will look like below –\n\n```java\npublic void jspDestory()\n\
    {\n    //code to remove the instances of servlet class\n}\n```\n\n## SCRIPTTS\n\
    \n### JSP Scriptlets\n\nWe can use java code in JSP using scriptlets. The JSP\
    \ container moves the scriptlets content into the `_jspService()` method which\
    \ is available to the server during processing of the request.\n\nScriptlets are\
    \ nothing but java code enclosed within `<%` and `%>` tags. JSP container moves\
    \ the statements enclosed in it to `_jspService()` method while generating servlet\
    \ from JSP. The reason of copying this code to service method is: For each client’s\
    \ request the `_jspService()` method gets invoked, hence the code inside it executes\
    \ for every request made by client.\n\n**Syntax of Scriptlet:**\n\n```java\n<%\
    \ Executable java code%>\n```\n\n### JSP to Servlet transition for Scriptlet –\n\
    \nAs I stated in my previous tutorials that JSP does not get executed directly,\
    \ it first gets converted into a `Servlet` and then `Servlet` execution happens\
    \ as normal. Also, I explained in first para that while translation from JSP to\
    \ servlet, the java code is copied from scriptlet to `_jspService()` method. Let\
    \ us see how that happens.\n\n**Sample JSP code:**\n\n```html\n<H3>SampleJSP </H3>\n\
    <% myMethod();%>\n```\n\nNote: Semicolon at the end of scriptlet.\n\n**Corresponding\
    \ translated Servlet code for above JSP code:**\n\n```java\npublic void _jspService(HttpServletRequest\
    \ request, HttpServletResponse response)\nthrows ServletException, IOException\
    \ {\n    response.setContentType(\"text/html\");\n    HttpSession session = request.getSession();\n\
    \    JspWriter out = response.getWriter();\n    out.println(\"<H2>Sample JSP</H2>\"\
    );\n    myMethod();\n}\n```\n\n**An example to learn about the Scripting elements:**\n\
    \n```java\n<%– A jsp example to learn the JSP scripting elements–%>\n<%String\
    \ string1 =\"JSP scriptlet\";%>\n<%!String string2 =\"\";%>\n<html>\n<head>\n\
    <title> JSP page: Welcome </title>\n</head>\n<body>\n<h1>\n<%–This is an Expression\
    \ statement–%>\nWelcome to <%=string1%>\n</h1>\n<%–sciptlet example–%>\n<%if(localstring.equals(\"\
    JSP scriptlet\")){%>\nHi\n<%}\nelse {%>\nhello\n<%} %>\n<%–same thing can be done\
    \ in this way also–%>\n<%if(localstring.equals(\"JSP scriptlet\"))\nout.println(\"\
    Hi\"+string2);\nelse\nout.println(\"hello\");\n%>\n</body>\n</html>\n```\n\nIn\
    \ the above example there are many type of JSP elements present such as Expression,\
    \ JSP comment, Declaration element etc. We will see each one of them in upcoming\
    \ JSP tutorials but as of now you can only focus on Scriptlets. The below are\
    \ the scriptlets statements used in above example –\n\n```java\n<%if(localstring.equals(\"\
    JSP scriptlet\"))\nout.println(\"Hi\"+string2);\nelse\nout.println(\"hello\");\n\
    %>\n```\n\nThe above code is a JSP scriptlet (notice starting `<%` and ending\
    \ `%>` tags). If you analyze above piece of code then you would find that the\
    \ code inside tags is a pure java code so in order to execute java code in JSP\
    \ we use scriptlets.\n\n```java\n<%String string1 =\"JSP scriptlet\";%>\n```\n\
    \nWhenever the `container` receives request from client, it does translation only\
    \ when the servlet class is older than JSP page otherwise it skips this phase\
    \ (reason I explained above).\n\nThen the `container` –\n```java\nif (num > 5)\n\
    {\n    out.println(\"hi\");\n}\nelse\n{\n    out.println(\"num value should be\
    \ less than 6\");\n}\n```\n\n```html\n<! DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML4.0//EN\"\
    >\n<HTML>\n<HEAD>\n<TITLE> MY JSP PAGE </TITLE>\n</HEAD>\n<BODY>\n<% if (num >\
    \ 5) { %>\n<H3> hi </H3>\n<%} else {%>\n<h3> num value should be less than 6 </h3>\n\
    <% } %>\n</BODY>\n</HTML>\n```\n\nImportant Point to remember: Since the code\
    \ inside it is a java code it must end with a Semicolon. Now notice all statements\
    \ – you may find that all few where we give semicolon in java,needs it too and\
    \ ends with a semicolon.\n\n**NOTE:** GO BACK FROM HERE\n\n## DECLARATIONS\n\n\
    ### ACTION TAGS\n\n#### JSP Actions – Java Server Pages\n\n**Directives vs Actions**\n\
    1. Directives are used during translation phase while actions are used during\
    \ request processing phase.\n2. Unlike Directives Actions are re-evaluated each\
    \ time the page is accessed.\n3. The following are the action elements used in\
    \ JSP:\n\n**1. `<jsp:include>` Action**\nLike include page directive this action\
    \ is also used to insert a JSP file in another file.\n\n`<jsp:include>` vs include\
    \ directive: It has the same difference which I mentioned at the beginning of\
    \ the article (directive vs action). In `<jsp:include>` the file is being included\
    \ during request processing while in case of include directive it has been included\
    \ at translation phase.\n\n**Syntax:**\n```xml\n<jsp:include page=\"page URL\"\
    \ flush=\"Boolean Value\" />\n```\nHere `page URL` is: the location of the page\
    \ needs to be included & `flush` value can be either true or false (Boolean value).\n\
    \n**Example:**\n```html\n<html>\n<head>\n<title>Demo of JSP include Action Tag</title>\n\
    </head>\n<body>\n<h3>JSP page: Demo Include</h3>\n<jsp:include page=\"sample.jsp\"\
    \ flush=\"false\" />\n</body>\n</html>\n```\n"
  raw: 'Java Server Pages (JSP) Life Cycle


    JSP pages are saved with .jsp extension which lets the server know that this is
    a JSP page and needs to go through JSP life cycle stages.


    In my previous post about JSP introduction, I explained that JSP is not processed
    as such, they first get converted into Servelts and then the corresponding servlet
    gets processed by Server.


    When client makes a request to Server, it first goes to container. Then container
    checks whether the servlet class is older than jsp page (To ensure that the JSP
    file got modified). If this is the case then container does the translation again
    (converts JSP to Servlet) otherwise it skips the translation phase (i.e. if JSP
    webpage is not modified then it doesn’t do the translation to improve the performance
    as this phase takes time and to repeat this step every time is not time feasible).


    The steps in the life cycle of JSP page are:


    1) Translation


    2) Compilation


    3) Loading


    4) Instantiation


    5) Initialization


    6) Request Processing


    7) Destruction


    ![](Images/image00363.jpeg)


    Let see the Life cycle of JSP in more detail –


    1) As stated above whenever container receives request from client, it does translation
    only when the servlet class is older than JSP page otherwise it skips this phase
    (reason I explained above).


    2) Then the container –


    Compiles the corresponding servlet program


    Loads the corresponding servlet class


    Instantiates the servlet class


    Calls the jspInit() method to initialize the servlet instance( Jsp container will
    do this job only when the instance of servlet file is not running or if it is
    older than the jsp file).


    [code language=”java”]


    public void jspInit()


    {


    //code to intialize Servlet instances


    }[/code]


    3) A new thread is then gets created, which invokes the_jspService() method, with
    a request (HttpServletRequest) and response (HttpServletRespnse) objects as parameters
    -shown below.


    [code language=”java”]


    void _jspService( HttpServletRequest req, HttpServletResponse res)


    {


    //code goes here


    }[/code]


    4) Invokes the jspDestroy() method to destroy the instance of the servlet class.
    Code will look like below –


    [code language=”java”]


    public void jspDestory()


    {


    //code to remove the instances of servlet class


    }[/code]


    SCRIPTLETS


    JSP Scriptlets


    We can use java code in JSP using scriptlets. The JSP container moves the scriptlets
    content into the _jspService() method which is available to the server during
    processing of the request.


    Scriptlets are nothing but java code enclosed within <% and %> tags. JSP container
    moves the statements enclosed in it to _jspService() method while generating servlet
    from JSP. The reason of copying this code to service method is: For each client’s
    request the _jspService() method gets invoked, hence the code inside it executes
    for every request made by client.


    Syntax of Scriptlet:


    [code language=”java”]<% Executable java code%>[/code]


    JSP to Servlet transition for Scriptlet –


    As I stated in my previous tutorials that JSP does not get executed directly,
    it first gets converted into a Servlet and then Servlet execution happens as normal.
    Also, I explained in first para that while translation from JSP to servlet, the
    java code is copied from scriptlet to _jspService() method. Let us see how that
    happens.


    Sample JSP code:


    [codelanguage=”html”]


    <H3>SampleJSP </H3>


    <% myMethod();%>


    [/code]


    Note:  Semicolon at the end of scriptlet.


    Corresponding translated Servlet code for above JSP code:


    [code language=”java”]


    public void _jspService(HttpServletRequest request,


    HttpServletResponse response)


    throws ServletException, IOException {


    response.setContentType("text/html");


    HttpSession session = request.getSession();


    JspWriter out = response.getWriter();


    out.println("<H2>Sample JSP</H2>");


    myMethod();


    }[/code]


    An example to learn about the Scripting elements:


    [code language=”java”]


    <%– A jsp example to learn the JSP scripting elements–%>


    <%String string1 ="JSP scriptlet";%>


    <%!String string2 ="";%>


    <html>


    <head>


    <title> JSP page: Welcome </title>


    </head>


    <body>


    <h1>


    <%–This is an Expression statement–%>


    Welcome to <%=string1%>


    </h1>


    <%–sciptlet example–%>


    <%if(localstring.equals("JSP scriptlet")){%>


    Hi


    <%}


    else {%>


    hello


    <%} %>


    <%–same thing can be done in this way also–%>


    <%if(localstring.equals("JSP scriptlet"))


    out.println("Hi"+string2);


    else


    out.println("hello");


    %>


    </body>


    </html>[/code]


    In the above example there are many type of JSP elements present such as Expression,
    JSP comment, Declaration element etc. We will see each one of them in upcoming
    JSP tutorials but as of now you can only focus on Scriptlets. The below are the
    scriptlets statements used in above example –


    [code language=”java”]


    <%if(localstring.equals("JSP scriptlet"))


    out.println("Hi"+string2);


    else


    out.println("hello");


    %>[/code]


    The above code is a JSP scriptlet (notice starting <% and ending %> tags). If
    you analyze above piece of code then you would find that the code inside tags
    is a pure java code so in order to execute java code in JSP we use scriptlets.


     [code language=”java”]<%String string1 ="JSP scriptlet";%>[/code]


    Like above set of statements this statement is a java initialization code which
    is enclosed within tags.


    Apart from above two set of scriptlets there are many other scriptlet tags present
    in above example (notice if-else control flow logic). To use the if-else control
    flow statements of java, we have used scriptlet in above example. As this is the
    main advantage of using scriptlet so let us make it more clear with the help of
    an example – You must be aware how important are our If – else control statements.


    An example to show use of if -else using scriptlets


    Suppose there is a variable num and you want to display “hi” on your webpage if
    it is greater than 5 otherwise you wanna to display a message. Consider the below
    code for this scenario –


    If you wanna to write a code in java for above situation then it would look like
    this              


    [code language=”java”]


    if (num > 5)


    {


    out.println("hi");


    }


    else


    {


    out.println("num value should not be less than 6");


    }[/code]


    To write the similar code in JSP we need to use JSP scriptlets – Code would be
    like this –


    [code language=”html”]


    <! DOCTYPE HTML PUBLIC "-//W3C//DTD HTML4.0 translation //EN">


    <HTML>


    <HEAD>


    <TITLE> MY JSP PAGE </TITLE>


    </HEAD>


    <BODY>


    <% if (num > 5) { %>


    <H3> hi </H3>


    <%} else {%>


    <h3> num value should not be less than 6 </h3>


    <% } %>


    </BODY>


    </HTML>


    [/code]


    Important Point to remember:  Since the code inside it is a java code it must
    end with a Semicolon(;). Now notice all the statements – you may find that all
    few scriptlet where we give semicolon in java,needs it here too and ends with
    a semicolon.


    NOTE:


     GO BACK FROM HERE


    [Declarations](#part0000.xhtml_DECLARATION)


    ACTION TAGS


    JSP Actions – Java Server Pages


    Directives vs Actions


    1.  Directives are used during translation phase while actions are used during
    request processing phase.


    2.  Unlike Directives Actions are re-evaluated each time the page is accessed.


    3.  The following are the action elements used in JSP:


    1. <jsp:include> Action


    Like include page directive this action is also used to insert a JSP file in another
    file.


    <jsp:include> vs include directive:


    It has the same difference which I mentioned at the beginning of the article (directive
    vs action). In <jsp:include> the file is being included during request processing
    while in case of include directive it has been included at translation phase.


    Syntax:


    <jsp:include page="page URL"  flush="Boolean Value" />


    Here page URL is: the location of the page needs to be included & flush value
    can be either true or false (Boolean value).


    Example:


    <html>


    <head>


    <title>Demo of JSP include Action Tag</title>


    </head>


    <body>


    <h3>JSP page: Demo Include</h3>


    <jsp:include page="sample.jsp" flush="false" />


    </body>


    </html>'
