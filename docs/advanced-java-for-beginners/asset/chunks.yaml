    # `fn:toUpperCase()` – JSTL Function


    It is just opposite of `fn:toLowerCase()` function. It converts input string to
    a uppercase string. All the characters of input string gets replaced with corresponding
    uppercase characters. The string which needs to be changed is provided as an argument
    to the function and the converted string is returned by the function. We can pass
    the string as a variable or simply hard-coding during function call.


    #### Syntax:


    `String fn:toUpperCase(String input)`


    Return type: `String`; Argument: Single argument of String type.It returns the
    String after converting the input string to uppercase.


    #### Example of `fn:toUpperCase()`


    Here we are converting few strings to their uppercases using the function.


    ```xml

    <%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <%@ taglib uri="http://java.sun.com/jsp/jstl/functions" prefix="fn" %>

    <html>

    <head>

    <title>fn:toUpperCase() example</title>

    </head>

    <body>

    <c:set var="site" value="JavaBook.com"/>

    <c:set var="author" value="Chandru"/>

    Hi This is ${fn:toUpperCase(author)} from ${fn:toUpperCase(site)}.

    </body>

    </html>

    ```


    Output:


    CHANDRU

    JAVABOOK.COM


