    \ (Servlet OR JSP (java server pages)) there are two architectures for JSP. They\
    \ are – Model1 Architecture & Model2 Architecture\n\n1. Model1 Architecture: In\
    \ this Model, JSP plays a key role and it is responsible for of processing the\
    \ request made by client. Client (Web browser) make a request, JSP then creates\
    \ a bean object which then fulfil the request and pass the response to JSP. JSP\
    \ then sends the response back to client. Unlike Model2 architecture, in this\
    \ Model most of the processing is done by JSP itself.\n\n![](Images/image00361.jpeg)\n\
    \n2. Model2 Architecture: In this Model, Servlet plays a major role and it is\
    \ responsible for processing the client (web browser) request. Presentation part\
