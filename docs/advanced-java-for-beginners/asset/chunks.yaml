    ## JSTL


    ### JSTL 核心标签库


    JSTL 代表 JSP 标准标签库（JSP Standard Tag Library），它是一组非常有用的标签。这些标签帮助你高效地编写 JSP。


    ### JSTL 核心标签


    以下是 JSTL 标签。为了使用 JSTL 标签，必须存在以下行：

    ```jsp

    <%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>

    ```


    ### <c:out> 标签


    `<c:out>` 是 JSTL 核心标签，用于在客户端显示内容。你可能会疑惑既然可以使用表达式语言（EL）显示变量和数据，为什么还需要 `<c:out>`？区别在于
    `<c:out>` 标签会转义 XML 标记，而其他不会。


    ### <c:out> 标签示例


    在此示例中，我们在浏览器上显示字符串，但我们使用了 HTML 标签并想查看结果。

    ```jsp

    <%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>

    <html>

    <head>

    <title>c:out 示例</title>

    </head>

    <body>

    <c:out value=''<b>这是一个 <c:out> 示例</b>'' />

    </body>

    </html>

    ```

    **输出：**

    <b>这是一个 <c:out> 示例</b>


    ### <c:out> 的 escapeXml 属性


    假设我们将上述代码修改为如下所示——我在标签中添加了 `escapeXml` 属性并将其标记为 `false`。`escapeXml` 属性的默认值为 `true`。由于我们将其标记为
    `false`，它将不会转义 HTML/XML 标记，标记将生效。

    ```jsp

    <c:out value=''<b>这是一个 <c:out> 示例</b>'' } escapeXml="false"/>

    ```

    **输出：**

    ![](img/image400.jpeg)


    ### <c:out> 的 default 属性


    上面我们看到了 `<c:out>` 标签的 `escapeXml` 属性。该标签还有一个属性 `default`，用于当 `<c:out>` 标签值为 `null`
    时显示回退或默认值。这里有一个示例，我们尝试使用标签打印字符串 `str` 的值，由于字符串 `str` 的值为 `null`，标签将打印设置在 `default`
    属性中的值。

    ```jsp

    <%! String str = null; %>

    <c:out value="${str}" default="c:out 的默认值"/>

    ```

    ![](img/image401.jpeg)


    ### <c:set> 标签


    `<c:set>` 标签常用于在指定的作用范围内设置变量值。它基本上评估表达式并将结果设置给变量。


    # JSTL <c:set> 核心标签


    `<c:set>` 核心 JSTL 标签用于在指定的作用范围内为对象或变量赋值。让我们通过一个例子来理解这一点。


