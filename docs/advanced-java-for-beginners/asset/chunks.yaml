  trans: "\n\n# 表达式语言示例 2\n\n```html\n<head>\n  <title>表达式语言示例 2</title>\n</head>\n\
    <body>\n  <form action=\"display.jsp\">\n    学生姓名: <input type=\"text\" name=\"\
    stuname\" /><br>\n    学生学号:<input type=\"text\" name=\"rollno\" /><br>\n    <input\
    \ type=\"submit\" value=\"提交详情!!\"/>\n  </form>\n</body>\n</html>\n```\n\n###\
    \ display.jsp\n\n```html\n<html>\n<head>\n  <title>显示页面</title>\n</head>\n<body>\n\
    \  学生姓名是 ${ param.stuname } <br>\n  学生学号是 ${ param.rollno }\n</body>\n</html>\n\
    ```\n\n**输出：**\n![](img/image00393.jpeg)\n![](img/image00394.jpeg)\n\n## 示例 3:\
    \ 从应用对象获取值。\n\n在这个示例中，我们使用 `application` 隐式对象设置了属性，并在显示页面上，我们使用表达式语言的 `applicationScope`\
    \ 获取了这些属性。\n\n### index.jsp\n\n```html\n<html>\n<head>\n  <title>EL 示例 3</title>\n\
    </head>\n<body>\n<%\n  application.setAttribute(\"author\", \"Chandu\");\n  application.setAttribute(\"\
    Site\", \"JavaBook.com\");\n%>\n  <a href=\"display.jsp\">点击</a>\n</body>\n</html>\n\
    ```\n\n### display.jsp\n\n```html\n<html>\n<head>\n  <title>显示页面</title>\n</head>\n\
    <body>\n  ${applicationScope.author}<br>\n  ${applicationScope.Site}\n</body>\n\
    </html>\n```\n\n**输出：**\n![](img/image00395.jpeg)\n![](img/image00396.jpeg)\n\n\
    ## EL 预定义变量：\n\n与 JSP 中的隐式对象类似，我们在 EL 中也有一些预定义的变量。在上面的示例中，我们使用了 `param` 和 `applicationScope`，它们也是这些变量的一部分。\n\
    \n*   **PageScope**: 帮助获取存储在 `Page` 作用域中的属性。\n*   **PageContext**: 等同于 JSP 的 `PageContext`\
    \ 对象。\n*   **SessionScope**: 从 `session` 对象设置的会话作用域获取属性。\n*   **RequestScope**:\
    \ 用于从请求作用域获取属性。即由 `request` 隐式对象设置的属性。\n*   **Param**: 类似于 `ServletRequest.getParameter`。参考示例\
    \ 2。\n*   **ApplicationScope**: 用于获取应用级别的属性。与示例 3 中的相同。\n*   **Header**: 帮助以字符串形式获取\
    \ HTTP 请求头。\n*   **HeaderValues**: 用于获取所有的 HTTP 请求头。\n*   **InitParam**: 链接到上下文的初始化参数。\n\
    *   **ParamValues**: 等同于 `ServletRequest.getParameterValues`。\n*   **Cookie**:\
    \ 映射到 `Cookie` 对象。\n\n**注意：**\n回到此处：\n*   带参数的 JSP include action 示例\n*   JSTL\n\
    \n# 异常处理\n\n### 异常处理\n\nJSP 中的异常处理 – 一一个学习 JSP 异常处理的完整教程。我们分享了两种处理异常的方法。\n\n在学习\
    \ JSP 异常处理之前，让我们先理解什么是异常，以及它与错误有什么区别。\n\n*   **异常 (Exception)**：这些无非中断正常执行流的异常状况。它们通常是因为用户输入了错误的数据。为了给用户提供有意义的信息，必须处理异常，以便用户能够理解问题并采取适当的行动。\n\
    *   **错误 (Error)**：这可能是代码问题或系统相关的问题。我们不应该处理错误，因为它们本该是被修复的。\n\n#### 处理异常的方法：\n\n\
    我们可以使用以下两种方法处理异常：\n1. 使用 `exception` 隐式对象进行异常处理\n2. 在脚本段（scriptlets）中使用 try-catch\
    \ 块进行异常处理\n\n### 使用 exception 隐式对象的异常处理\n\n在下面的示例中 – 我们使用 `Page` 指令的 `errorPage`\
    \ 属性指定了处理页面。如果主 JSP 页面发生任何异常，控制将转移到 `errorPage` 属性指定的页面。\n\n处理页面必须将 `isErrorPage`\
    \ 设置为 `true` 才能使用 `exception` 隐式对象。这就是为什么我们为 `errorpage.jsp` 设置了 `isErrorPage`\
    \ 为 `true`。\n\n**index.jsp**\n```jsp\n<%@ page errorPage=\"errorpage.jsp\" %>\n\
    <html>\n<head>\n  <title>JSP 异常处理示例</title>\n</head>\n<body>\n<%\n  // 声明并初始化两个整数\n\
    \  int num1 = 122;\n  int num2 = 0;\n  // 应该抛出算术异常 (Arithmetic Exception)\n  int\
    \ div = num1/num2;\n%>\n</body>\n</html>\n```\n\n**errorpage.jsp**\n```jsp\n<%@\
    \ page isErrorPage=\"true\" %>\n<html>\n<head>\n  <title>在此处显示异常消息</title>\n</head>\n\
    <body>\n  <h2>errorpage.jsp</h2>\n  <i>在 index.jsp 页面发生了异常。请修复错误。以下是错误消息：</i>\n\
    \  <b><%= exception %></b>\n</body>\n</html>\n```\n\n**输出：**\n![](img/image0397.jpeg\
    \ (此处为示例输出))\n\n### 在脚本段（scriptlets）中使用 try-catch 块的异常处理\n\n在下面的示例中 – 我们使用 try-catch\
    \ 块处理了异常。我们在下面的示例中放置了 try-catch 块。\n\n**error.jsp**\n```jsp\n<html>\n<head>\n\
    \  <title>使用 catch 块处理异常</title>\n</head>\n<body>\n<%\n  try {\n    int arr[]\
    \ = {1, 2, 3, 4, 5};\n    int num = arr[6];\n  } catch (Exception exp) {\n   \
    \ out.println(\"这里是异常: \" + exp);\n  }\n%>\n</body>\n</html>\n```\n**输出：**\n![](img/image0398.jpeg)\n\
    \n# 自定义标签 (CUSTOM TAGS)\n\n用户定义的标签被称为自定义标签。在本教程中我们将学习如何创建它们。创建自定义标签需要三部分：\n1.\
    \ **标签处理器类 (Tag handler class)**：在该类中我们指定标签的作用。\n2. **TLD 文件**：指定标签属性的标签描述符。\n\
    3. **JSP 页面**：使用标签的 JSP 页面。\n\n### 标签处理器类\n\n标签处理器类应该实现 `Tag` 接口，也可以继承 `SimpleTagSupport`。\n\
    \n**Details.java**\n```java\npackage javabook.com;\nimport javax.servlet.jsp.tagext.*;\n\
    import javax.servlet.jsp.*;\nimport java.io.*;\n\npublic class Details extends\
    \ SimpleTagSupport {\n    public void doTag() throws JspException, IOException\
    \ {\n        JspWriter out = getJspContext().getOut();\n        out.println(\"\
    这是我的标签\");\n    }\n}\n```\n\n### TLD 文件\n\n该文件应该位于：`项目名称/WebContent/WEB-INF/`，并且以\
    \ `.tld` 扩展。\n\n**注意：**\n- `<name>`：自定义标签名称。在示例中我们命名为 `MyMsg`。\n- `<tag-class>`：全类名。我们的标签处理器类\
    \ `Details.java` 在 `javabook.com` 包中，因此我们将其设为 `javabook.com.Details`。\n\n**message.tld**\n\
    ```xml\n<taglib>\n  <tlib-version>1.0</tlib-version>\n  <jsp-version>2.0</jsp-version>\n\
    \  <short-name>My Custom Tag</short-name>\n  <tag>\n    <name>MyMsg</name>\n \
    \   <tag-class>javabook.com.Details</tag-class>\n    <body-content>empty</body-content>\n\
    \  </tag>\n</taglib>\n```\n\n### 在 JSP 中使用自定义标签\n\n上面我们创建了一个名为 `MyMsg` 的自定义标签。在这里我们将使用它。\n\
    \n**注意：** `taglib` 指令应在 `uri` 字段中包含 TLD 文件的路径。上面我们创建了 `message.tld` 文件，因此我们提供了该文件的路径。选择任何前缀并在\
    \ `taglib` 指令的 `prefix` 字段中指定它。在这里我们指定为 `myprefix`。\n\n"
- fmt: "\nCustom tag is called like this: `<prefix:tagName/>`. Our prefix is `myprefix`\
    \ and tag name is `MyMsg` so we have called it as `<myprefix:MyMsg/>` in the below\
    \ JSP page.\n\n```jsp\n<%@ taglib prefix=\"myprefix\" uri=\"WEB-INF/message.tld\"\
    %>\n<html>\n<head>\n <title>Custom Tags in JSP Example</title>\n</head>\n<body>\n\
    \ <myprefix:MyMsg/>\n</body>\n</html>\n```\nOutput:\n`This is my own custom tag`\n\
    \n### How to access body of Custom tags\n\nIn this tutorial we will see how to\
    \ access the body of custom tag. For e.g. If our custom tag is `xyz` then we would\
    \ learn to access the content between `<prefix: xyz>` and `</prefix:xyz>`.\n\n\
    ```jsp\n<prefix: xyz>\nBody of custom tag: This is what we will access in the\
    \ below example\n</prefix:xyz>\n```\n\n### Example:\nIn this example or custom\
    \ tag will append a `String` to its own body and will display the result.\n\n\
    Tag handler class: `Details.java`\n\n```java\npackage javabook.com;\n\nimport\
    \ javax.servlet.jsp.tagext.*;\nimport javax.servlet.jsp.*;\nimport java.io.*;\n\
    \npublic class Details extends SimpleTagSupport {\n    //StringWriter object\n\
    \    StringWriter sw = new StringWriter();\n\n    public void doTag() throws JspException,\
    \ IOException {\n        getJspBody().invoke(sw);\n        JspWriter out = getJspContext().getOut();\n\
    \        out.println(sw.toString()+\"Appended Custom Tag Message\");\n    }\n\
    }\n```\n\nTLDfile: `message.tld`\nRemember to have this file in `WEB-INF` folder.\n\
    \n```xml\n<taglib>\n<tlib-version>1.0</tlib-version>\n<jsp-version>2.0</jsp-version>\n\
    <short-name>My Custom Tag: MyMsg</short-name>\n<tag>\n<name>MyMsg</name>\n<tag-class>javabook.com.Details</tag-class>\n\
    <body-content>scriptless</body-content>\n</tag>\n</taglib>\n```\n\nJSP Page: `index.jsp`\n\
    \n```jsp\n<%@ taglib prefix=\"myprefix\" uri=\"WEB-INF/message.tld\"%>\n<html>\n\
    <head>\n <title>Accessing Custom Tag Body Example</title>\n</head>\n<body>\n <myprefix:MyMsg>\n\
    \ Test String\n </myprefix:MyMsg>\n</body>\n</html>\n```\nOutput:\n`Test String\
    \ Appended Custom Tag Message`\n\n---\n\n# JSP DIRECTIVES\n\n## JSP Directives\n\
    JSP Directives – Page and TagLib\nDirectives control the processing of an entire\
    \ JSP page. It gives directions to the server regarding processing of a page.\n\
    \n**Syntax of Directives:**\n`<%@ directive name [attribute name=“value” attribute\
    \ name=“value” ........]%>`\n\nThere are three types of Directives in JSP:\n1.\
    \ `Page Directive`\n2. `Include Directive`\n3. `TagLib Directive`\n\n### 1) Page\
    \ Directive\nThere are several attributes, which are used along with `Page Directives`\
    \ and these are –\n1. `import`\n2. `session`\n3. `isErrorPage`\n4. `errorPage`\n\
    5. `ContentType`\n6. `isThreadSafe`\n7. `extends`\n8. `info`\n9. `language`\n\
    10. `autoflush`\n11. `buffer`\n\n#### 1. Import:\nThis attribute is used to import\
    \ packages. While doing coding you may need to include more than one packages,\
    \ In such scenarios this page directive’s attribute is very useful as it allows\
    \ you to mention more than one packages at the same place separated by commas\
    \ (`,`). Alternatively you can have multiple instances of page element each one\
    \ with different package.\n\n**Syntax of import attribute –**\n`<%@page import=\"\
    value\"%>`\nHere `value` is package name.\n\n**Example of import-** The following\
    \ is an example of how to import more than one package using `import` attribute\
    \ of page directive.\n\n```jsp\n<%@page import=\"java.io.*%>\n<%@page import=\"\
    java.lang.*%>\n<%--Comment: OR Below Statement: Both are Same--%>\n<%@page import=\"\
    java.io.*, java.lang.*\"%>\n```\n\n#### 2. Session:\nGenerally while building\
    \ a user interactive JSP application, we make sure to give access to the user\
    \ to get hold of his/her personal data till the session is active. Consider an\
    \ example of logging in into your bank account, we can access all of your data\
    \ till we signout (or session expires). In order to maintain session for a page\
    \ the `session` attribute should be `true`.\n\nThis attribute is to handle HTTP\
    \ sessions for JSP pages. It can have two values: `true` or `false`. Default value\
    \ for `session` attribute is `true`, which means if you do not mention this attribute,\
    \ server may assume HTTP session is required for this page.\n\n**Default value\
    \ for this attribute:** `true`\n\n**Syntax:**\n`<%@ page session=\"value\"%>`\n\
    Here `value` is either `true` OR `false`.\n\n**Examples of session:**\n```jsp\n\
    <%@ page session=\"true\"%>\n```\nThe above code would allow a page to have session\
    \ implicit objects.\n\n```jsp\n<%@ page session=\"false\"%>\n```\nIf this code\
    \ is specified in a JSP page, it means session objects will not be available for\
    \ that page. Hence session cannot be maintained for that page.\n\n#### 3. isErrorPage:\n\
    This attribute is used to specify whether the current JSP page can be used as\
    \ an error page for another JSP page. If value of `isErrorPage` is `true`, it\
    \ can be used.\n\n#### 4. errorPage:\nAs stated above, it specifies the URL of\
    \ the JSP page when an exception occurs.\n\n**Syntax:**\n`<%@ page errorPage=\"\
    value\"%>`\nHere `value` is the page name.\n\n**Example of errorPage:**\n```jsp\n\
    <%@ page errorPage=\"ExceptionHandling.jsp\"%>\n```\n\n#### 5. ContentType:\n\
    This attribute is used to set the content type of JSP page.\nDefault value: `text/html`\n\
    \n**Syntax:**\n`<%@ page contentType=\"value\"%>`\nhere `value` can be anything\
    \ such as `text/html`, `text/xml`.\n\n**Example of contentType:**\n```jsp\n<%@\
    \ page contentType=\"text/html\"%>\n<%@ page contentType=\"text/xml\"%>\n```\n\
    \n#### 6. isThreadSafe:\nLet us understand this with an example. Suppose you have\
    \ created a JSP page and mentioned `isThreadSafe` as `true`, it means that the\
    \ JSP page supports multithreading (more than one thread can execute the JSP page).\
    \ On the other hand if it is set to `false` then JSP engine won’t allow multithreading\
    \ which means only single thread will execute the page code.\n\n**Default value\
    \ for `isThreadSafe` attribute:** `true`\n\n**Syntax:**\n`<%@ page isThreadSafe=\"\
    value\"%>`\n\n**Example of isThreadSafe:**\n```jsp\n<%@ page isThreadSafe=\"false\"\
    %>\n```\n\n#### 7. Buffer:\nThis attribute is used to specify the buffer size.\
    \ If you specify this to `none` during coding then the output would directly written\
    \ to `Response` object by `JspWriter`. And, if you specify a buffer size then\
    \ the output first written to buffer then it will be available for response object.\n\
    \n**Syntax:**\n`<%@ page buffer=\"value\"%>`\n`value` is size in `kb` or `none`.\n\
    \n**Example of buffer:**\n```jsp\n<%@ page buffer=\"none\"%>\n<%@ page buffer=\"\
    5kb\"%>\n```\n\n#### 8. Extends:\nLike `java`, here also this attribute is used\
    \ to extend (inherit) the class.\n\n**Syntax:**\n`<%@ page extends=\"value\"%>`\n\
    `value` is `package_name.class_name`.\n\n**Example of extends:**\n```jsp\n<%@\
    \ page extends=\"mypackage.SampleClass\"%>\n```\n\n#### 9. Info:\nIt provides\
    \ a description to a JSP page. The string specified in `info` will return when\
    \ we will call `getServletInfo()` method.\n\n**Syntax:**\n`<%@ page info=\"value\"\
    %>`\nHere `value` is Message or Description.\n"
