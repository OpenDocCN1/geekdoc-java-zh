    在我们继续之前，让我们先了解什么是动态 Web 应用。Web 应用可以被描述为网页的集合（例如一个网站），当我们称其为“动态”时，简单意味着这些网页对于所有用户来说是不相同的，网页将根据客户端（用户浏览器）发出的请求在服务器端生成。


    静态网页和动态网页的主要区别在于，静态页面顾如名义对所有用户都保持不变，而动态网页会根据客户端（用户浏览器）的请求发生变化。例如，考虑一个显示两个输入字段和一个添加按钮的
    Web 应用，当你输入两个数字并点击添加时，它会显示另一个包含这两个数字相加结果的网页。这个 Web 应用在本质上是动态的，因为显示结果的第二个网页会根据用户的输入而改变，它对所有用户都不是静态的。


    然而，你完全可以认为 Servlet 的功能可以通过 CGI（通用网关接口）完成，这确实如此，但问题在于——CGI 有若干局限性，如性能、可扩展性、复用性等，而
    Servlet 并不具备这些问题。我不会详细讨论 CGI，但我会告诉你 Servlet 相比 CGI 好在哪里。


    ## CGI 的局限性


    服务器必须为每个客户端请求创建一个新的 CGI 进程。例如，如果有 100 个用户访问该 Web 应用，服务器必须创建 100 个 CGI 进程来处理他们发出的请求。由于服务器资源有限，为每个新请求创建新进程并不是可行的方案，这给服务器造成了限制，导致服务器无法同时处理超过指定数量的用户。


    ## 为什么 Servlet 比 CGI 好


    CGI 程序在每次发出新请求时都由新进程处理。与 CGI 不同，Servlet 程序由独立的线程处理，这些线程可以更高效地并发运行。


    CGI 程序可以用任何编程语言编写，这使得它在很大程度上依赖于平台，因为并不是所有的编程语言都是平台无关的。Servlet 仅使用 Java 作为编程语言，这使其具有平台无关性和可移植性。使用
    Java 的另一个优点是，Servlet 可以利用 Java 的面向对象编程特性。


    ### Servlet 如何工作


    正如我上面提到的，服务器的并发请求是由线程处理的，以下是该内容的图形化表示——


    ![](img/image00418.jpeg)


    ## Servlet 的特性


    现在我们已经了解了什么是 Servlet 以及它的用途。让我们继续讨论它的主要特征。


    1. **可移植性 (Portable)**：

    正如我上面提到的，Servlet 使用 Java 作为编程语言，由于 Java 是平台无关的，Servlet 也是如此。例如，你可以在 Windows 操作系统上创建一个使用
    GlassFish 作为 Web 服务器的 Servlet，稍然后在任何其他操作系统（如带有 Apache tomcat Web 服务器的 Unix、Linux）上运行它，这一特性使得
    Servlet 具有可移植性，这也是 Servlet 相比于 CGI 的主要优势。


    2. **高效且可扩展 (Efficient and scalable)**：

    一旦 Servlet 被部署并加载到 Web 服务器上，它就可以立即开始满足客户端的请求。Web 服务器使用轻量级线程调用 Servlet，因此通过 Java
    的多线程特性，Servlet 可以同时处理多个客户端请求。与服务器必须为每个客户端请求启动新进程的 CGI 相比，Servlet 真正是高效且可扩展的。


    3. **健壮性 (Robust)**：

    通过继承 Java 的高级特性（如垃圾回收、异常处理、Java 安全管理器等），Servlet 较少出现内存管理问题和内存泄漏。这使得使用 Servlet
    开发 Web 应用更加安全且更不容易出错。


    # Servlet API


    你需要使用 Servlet API 来创建 Servlet。在使用 API 时，你必须记住两个包：包含支持通用 Servlet（协议无关 Servlet）的类的
    `javax.servlet` 包，以及包含支持 HTTP Servlet 的类的 `javax.servlet.http` 包。你可能想知道通用 Servlet
    和 HTTP Servlet 是什么，我在本文稍后解释了它们。


    让我们来看看包的层级结构：


    `java.lang.Object`

    |_ 由 `javax.servlet.GenericServlet` 扩展

    |_ 由 `javax.servlet.http.HttpServlet` 扩展


    每个 Servlet 都必须实现 `java.servlet.Servlet` 接口，你可以通过扩展以下类之一来实现：`javax.servlet.GenericServlet`
    或 `javax.servlet.http.HttpServlet`。第一个用于协议无关的 Servlet，第二个用于 HTTP Servlet。


    ### Servlet 是如何工作的？


    ![](img/image00419.jpeg)


    ## Generic Servlet (通用 Servlet)


    正如我上面提到的，如果你正在创建一个 Generic Servlet，那么你必须扩展 `javax.servlet.GenericServlet` 类。GenericServlet
    类有一个抽象的 `service()` 方法。这意味着 GenericServlet 的子类应该始终重写 `service()` 方法。


    `service()` 方法的签名：


    ```java

    public abstract void service(ServletRequest request, ServletResponse response)
    throws ServletException, java.io.IOException

    ```


    `service()` 方法接受两个参数：`ServletRequest` 对象和 `ServletResponse` 对象。请求对象告诉 Servlet
    客户端发出的请求，而响应对象用于向客户端返回响应。


    ![](img/image00420.jpeg)


    ## HTTP Servlet (HTTP Servlet)


    如果你正在创建 Http Servlet，你必须扩展 `javax.servlet.http.HttpServlet` 类，这是一个抽象类。与 Generic
    Servlet 不同，HTTP Servlet 没有重写 `service()` 方法。相反，它重写了以下方法之一或多个。它必须重写列表中至少一个方法：


    *   `doGet()` – 该方法由 servlet service 方法调用，用于处理来自客户端的 HTTP GET 请求。Get 方法用于从服务器获取信息。

    *   `doPost()` – 用于向服务器提交信息。

    *   `doPut()` – 方法类似于 doPost，但与 doPost 向服务器发送信息不同，此方法向服务器发送文件，类似于 FTP 操作。

    *   `doDelete()` – 允许客户端从服务器删除文档、网页或信息。

    *   `init()` 和 `destroy()` – 用于管理 Servlet 生命周期内保留资源。

    *   `getServletInfo()` – 返回有关 Servlet 的信息，如作者、版本和版权。


    在 Http Servlet 中不需要重写 `service()` 方法，因为该方法会将 HTTP 请求分发到正确的方法处理器，例如，如果它接收到 HTTP
    GET 请求，会将请求分发到 `doGet()` 方法。


    ![](img/image00421.jpeg)


    ### javax.servlet 中的接口


    *   `Servlet`

    *   `ServletRequest`

    *   `ServletResponse`

    *   `ServletConfig`

    *   `ServletContext`

    *   `SingleThreadModel`

    *   `RequestDispatcher`

    *   `ServletRequestListener`

    *   `ServletRequestAttributeListener`

    *   `ServletContextListener`

    *   `ServletContextAttributeListener`

    *   `Filter`

    *   `FilterConfig`

    *   `FilterChain`


    ### javax.servlet 中的类


    *   `GenericServlet`

    *   `ServletInputStream`

    *   `ServletOutputStream`

    *   `ServletException`

    *   `ServletRequestWrapper`

    *   `ServletRequestEvent`

    *   `ServletResponseWrapper`

    *   `ServletContextEvent`

    *   `ServletRequestAttributeEvent`

    *   `ServletContextAttributeEvent`


    ### javax.servlet.http 中的接口


    *   `HttpSession`

    *   `HttpServletRequest`

    *   `HttpServletResponse`

    *   `HttpSessionAttributeListener`

    *   `HttpSessionListener`

    *   `HttpSessionBindingListener`

    *   `HttpSessionActivationListener`

    *   `HttpSessionContext`


    ### javax.servlet.http 中的类


    *   `HttpServlet`

    *   `Cookie`

    *   `HttpSessionEvent`

    *   `HttpSessionBindingEvent`

    *   `HttpServletRequestWrapper`

    *   `HttpServletResponseWrapper`

    *   `HttpUtils`


