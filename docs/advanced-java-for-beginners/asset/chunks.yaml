    ## 4. `fn:escapeXML()`

    It is used for HTML/XML character escaping which means it treats html/xml tags
    as a string. Similar to the `escapeXml` attribute of `<c:out>` tag.


    ### `fn:escapeXml()` – JSTL Function

    `fn:escapeXml()` JSTL function is used for HTML/XML character escaping which means
    it treats html/xml tags as a string rather than markup tags.


    #### Syntax

    ```java

    String escapeXml(String input_string)

    ```

    Convert the `input_string` into the output string after escaping html/xml markup
    tags.


    * function return type is `String`

    * Argument: `input String`


    #### `fn:escapeXml()` Example

    Here we have two Strings which have html tags bold(`<b>`) and italic (`<i>`).
    We are processing them using `fn:escapeXml()` function.


    ```html

    <%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <%@ taglib uri="http://java.sun.com/jsp/jstl/functions" prefix="fn" %>

    <html>

    <head>

    <title>JSTL fn:escapeXml() example</title>

    </head>

    <body>

    Message1: <b>Hi This is just a message</b>

    <br>Message2: <i>This is an example</i>

    <br>Message1 and `fn:escapeXml()`: ${fn:escapeXml("<b>Hi This is just a message</b>")}

    <br>Message2 and `fn:escapeXml()`: ${fn:escapeXml("<i>This is an example</i>")}

    </body>

    </html>

    ```

    Output:

    As you can see when we used the function on input strings, the html tags didn’t
    work and get printed as it is, just like another normal string.


    ![](Images/Images/image00411.jpeg)


    ## 5. `fn:join()` and `fn:split()` functions

    JSTL functions: `fn:join()` concatenates the strings with a given separator and
    returns the output string. `fn:split()` splits a given string into an array of
    substrings.


    # `fn:join()` and `fn:split()` JSTL Functions


    ### `fn:join()`

    It concatenates the strings with a given separator and returns the output string.


    #### Syntax

    ```java

    String fn:join(String arrayofstrings, String separator)

    ```

    It concatenates all the elements of the input array along with the provided separator
    in between. The return type of this function is `String`, it returns the output
    string after concatenation.


    #### Example – Join strings using `fn:join()` function

    In this example we are having an array of strings and we are joining them using
    the separator (`'' & ''`).).


    ```html

    <%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <%@ taglib uri="http://java.sun.com/jsp/jstl/functions" prefix="fn" %>

    <html>

    <head>

    <title>JSTL fn:join() example</title>

    </head>

    <body>

    <%

    String arr[]={"Chandru", "Rahul", "Ajith"};

    session.setAttribute("names", arr);

    %>

    ${fn:join(names, " & ")}

    </body>

    </html>

    ```

    Output:

    As you can see all the three names got concatenated having ‘ &’ in between.

    Chandru & Rahul & Ajith


    ### `fn:split()`

    It splits a given string into an array of substrings. Splitting process considers
    the delimiter string which we provide during function call. I.e. we provide the
    string and delimiter as arguments to the function and it returns the array of
    strings after splitting the input based on the delimiter string.


    #### Syntax

    ```java

    String[] fn:split(String inputstring, String delimiterstring)

    ```


    #### Example – Join strings using `fn:split()` function

    In this example we are having a input string which has few space characters in
    between. We have split the string using space as delimiter using `fn:split()`
    function. The function returned the array of the sub-strings.


    ```html

    <%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <%@ taglib uri="http://java.sun.com/jsp/jstl/functions" prefix="fn" %>

    <html>

    <head>

    <title>JSTL fn:split() example</title>

    </head>

    <body>

    <c:set var="msg" value="This is an example of JSTL function"/>

    <c:set var="arrayofmsg" value="${fn:split(msg,'' '')}"/>

    <c:forEach var="i" begin="0" end="6">

    arrayofmsg[${i}]: ${arrayofmsg[i]}<br>

    </c:forEach>

    </body>

    </html>

    ```

    Output:

    ![](Images/Images/image00412.jpeg)


    ## 6. `fn:length()`

    The JSTL function `fn:length()` is used for computing the length of a string or
    to find out the number of elements in a collection. It returns the length of the
    object.


    # `fn:length()` – JSTL Function

    The JSTL function `fn:length()` is used for computing the length of a string or
    to find out the number of elements in a collection.


    #### Syntax

    ```java

    int length(Object)

    ```

    Return type of this function is `int`. It returns the length of the object provided
    as argument.


    #### Example of `fn:length()`

    Here we are computing the length of different strings.


    ```html

    <%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <%@ taglib uri="http://java.sun.com/jsp/jstl/functions" prefix="fn" %>

    <html>

    <head>

    <title>JSTL fn:length() example</title>

    </head>

    <body>

    <c:set var="string1" value="This is an example of JSTL function"/>

    <c:set var="string2" value="Hi"/>

    <c:set var="string3" value=""/>

    Length of string1: ${fn:length(string1)}<br>

    Length of string2: ${fn:length(string2)}<br>

    Length of string3: ${fn:length(string3)}

    </body>

    </html>

    ```

    Output:

    ![](Images/image00413.jpeg)


    ## 7. `fn:trim()`

    `fn:trim()` the specified string is a prefix of given string.


    # `fn:trim()` – JSTL Function

    `fn:trim()` removes spaces from start and end of the string. These functions are
    used to clean up input.


    #### Syntax

    ```java

    String trim(String input)

    ```

    The function returns the string after removing leading and trailing spaces.


    #### Example of `fn:trim()`

    In this example we have a string which has space characters at start and end and
    we are truncating those spaces.


    ```html

    <%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <%@ taglib uri="http://java.sun.com/jsp/jstl/functions" prefix="fn" %>

    <html>

    <head>

    <title>JSTL fn:trim() example</title>

    </head>

    <body>

    <c:set var="msg" value="  This is an example of JSTL function  "/>

    Trimmed string: ''${fn:trim(msg)}''

    </body>

    </html>

    ```

    Output:

    ![](Images/Images/image00414.jpeg)


    ## 8. `fn:endsWith()`

    `fn:endsWith()` JSTL function is used for checking the suffix of a string. It
    checks whether the given string ends with a particular string.


    # `fn:endsWith()` – JSTL Function

    `fn:endsWith()` function is used for checking the suffix of a string. It checks
    whether the given string ends with a particular string. The validation is `case
    sensitive`.


    #### Syntax

    ```java

