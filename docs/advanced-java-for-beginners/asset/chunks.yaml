    \n## Servlet 中的 Cookies\n### 带有示例的 Servlet Cookies\n在这里我们将讨论同样用于会话管理的 Cookies。让我们回顾一下上一次教程中的一些内容，以便将会话和\
    \ Cookie 联系起来。当用户首次访问应用程序时，Servlet 容器通过调用 `request.getSession()` 创建一个新的 `HttpSession`\
    \ 对象。会话会被分配一个唯一的 `Id`。Servlet 容器还会在 HTTP 响应头中设置一个 `Cookie`，以 Cookie 名称为键，并将唯一的会话\
    \ ID 作为值。\n\nCookie 存储在用户的浏览器中，客户端（用户浏览器）在 Cookie 有效的所有后续请求中会将此 Cookie 发回服务器。Servlet\
    \ 容器检查请求头中的 Cookie，从 Cookie 中获取会话信息，并使用服务器内存中关联的会话。\n\n会话的活跃时间由 `web.xml` 中指定的标签指定。如果\
    \ `web.xml` 中未设置该标签，则会话保持活跃 30 分钟。只要用户的浏览器运行，Cookie 就保持有效；一旦浏览器关闭，Cookie 关联会话信息就会被销。因此，当用户再次打开浏览器并向\
    \ Web 服务器发送请求时，将创建一个新的会话。\n\n## Cookie 的类型\n我们可以根据过期时间对 Cookie 进行分类：\n1. 会话型 (Session)\n\
    2. 持久型 (Persistent)\n\n#### 1) 会话 Cookie：\n会话 Cookie 没有过期时间。它存在于浏览器内存中。一旦浏览器关闭，该\
    \ Cookie 就会被删除。\n\n#### 2) 持久 Cookie：\n与会话 Cookie 不同，它们有过期时间，存储在用户的硬盘上，并根据过期时间删除。\n\
    \n## 如何向客户端发送 Cookies\n向客户端发送 Cookie 的步骤如下：\n1. 创建 `Cookie` 对象。\n2. 设置最大 `Age`。\n\
    3. 将 `Cookie` 放入 HTTP 响应头。\n\n#### 1) 创建 Cookie 对象：\n`Cookie c = new Cookie(\"\
    userName\");`\n\n#### 2) 设置最大 Age：\n使用 `setMaxAge()` 方法可以为特定 Cookie 设置最大年龄。\n\
    `c.setMaxAge(1800);`\n\n#### 3) 将 Cookie 放入 HTTP 响应头：\n我们可以通过 `response.addCookie()`\
    \ 方法将 Cookie 发送到浏览器。\n`response.addCookie(c);`\n\n#### 如何读取 Cookie：\n`Cookie[]\
    \ c=request.getCookies();` 获取 Cookie。\n```java\nfor(int i=0;i<c.length;i++){\n\
    \    System.out.println(c[i].getName() + \" \" + c[i].getValue());\n}\n```\n"
