    \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <c:out  value=\"${name}\"/>\n```\n\n### 输出:\n下面是上述示例输出的截图。\n\n![](img/image00402.jpeg)\n\
    ![](img/image00403.jpeg)\n\n### `<c:set>` 标签属性\n\n1. **Value**: 它可以是一个硬编码的值或表达式。例如，下面是\
    \ `<c:set>` 标签允许的变体——\n变量 `myvar` 的值将存储在对象 `name` 中。\n```jsp\n<c:set  var=\"name\"\
    \  scope=\"application\"  value=\"${myvar}\"/>\n```\n表达式的结果将存储在对象中。\n```jsp\n\
    <c:set  var=\"sum\"  scope=\"application\"  value=\"${1+3+6}\"/>\n```\n\n2. **Var**:\
    \ 它保存变量/对象的名称。\n\n3. **Scope**: 可以 `request`、`session`、`page` 和 `application`。在上面的示例中，我们指定了范围为\
    \ `application`，但它可以是上述四种中的任何一种。这完全取决于需求。\n\n4. **`<c:remove>` 标签**: 用于从指定的范围或所有范围（page,\
    \ request, session 和 application）中移除属性。默认从所有范围移除。\n\n# JSTL `<c:remove>` 核心标签\n\
    \n`<c:remove>` 标签用于从指定的范围或所有范围（page, request, session 和 application）中移除属性。\n\n\
    ### 示例:\n在下面的示例中，我首先使用 `<c:set>` 标签设置两个变量，然后使用 `<c:remove>` 标签移除了其中一个。正如你在输出截图所示——当我尝试显示两个变量时，对于第二个属性，页面没有获得值，并使用\
    \ `<c:out>` 标签的默认属性打印了默认值。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title>Example of c:remove tag</title>\n</head>\n\
    <body>\n<c:set  var=\"Site\"  scope=\"session\"  value=\"JavaBook.com\"/>\n<c:set\
    \  var=\"author\"  scope=\"session\"  value=\"Chandru\"/>\n<c:remove  var=\"author\"\
    />\n<a  href=\"display.jsp\">check attributes</a>\n</body>\n</html>\n```\n\n###\
    \ display.jsp\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<c:out  value=\"${Site}\"/><br>\n<c:out  value=\"${author}\"\
    \  default=\"Attribute has no value\"/>\n```\n![](img/image00404.jpeg)\n![](img/image00405.jpeg)\n\
    \n### `<c:remove>` 标签的 Scope 属性\n\n上面我们代码如下：\n```jsp\n<c:remove  var=\"author\"\
    />\n```\n上述代码从所有范围（page, session, application, request）移除属性。为了指定，我们必须在 `<c:remove>`\
    \ 标签内部指定 `scope` 属性，就像我下面做的那样——下面的 JSTL 语句将从 session 范围移除变量 `var`。\n```jsp\n<c:remove\
    \  var=\"author\"  scope=\"session\"/>\n```\n\n5. **`<c:if>` 标签**: 这个 JSTL 核心标签用于测试条件。该标签还有两个可选属性\
    \ `var` 和 `scope`，`test` 是强制性的。\n\n# JSTL `<c:if>` 核心标签\n\n`<c:if>` 是一个 JSTL 核心标签，用于测试条件。它类似于\
    \ Java 中的 `if` 语句，评估一个条件并在结果为真时执行一个代码块。\n\n### 语法:\n这是 `<c:if>` 核心标签的基本语法。如果 `test=\"\
    true\"`，则封装在 `<c:if>` 标签内的语句将被执行。为了使用此标签，我们通常使用表达式语言来评估关系表达式。我们使用 EL 是因为它在评估条件后会返回布尔值（true/false），而我们的\
    \ `test` 属性需要这个布尔值。\n\n```jsp\n<c:if  test=\"${condition}\">\n...\n..\n</c:if>\n\
    ```\n\n### `<c:if>` 标签示例\n在这个示例中，我们使用 `<c:set>` 标签定义了 `age` 变量，然后使用 `<c:if>` 标签检查投票资格。\n\
    \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <html>\n<head>\n<title>JSTL c:if Tag</title>\n</head>\n<body>\n<c:set  var=\"\
    age\"  value=\"26\"/>\n<c:if  test=\"${age >= 18}\">\n<c:out value=\"You are eligible\
    \ for voting!\"/>\n</c:if>\n<c:if  test=\"${age < 18}\">\n<c:out value=\"You are\
    \ not eligible for voting!\"/>\n</c:if>\n</body>\n</html>\n```\n输出:\n![](img/image0046.jpeg)\
    \ （注：此处原文编号略有重复，已按逻辑翻译）\n\n### `<c:remove>` 的 Scope 属性\n上面我们代码如下：\n```jsp\n<c:remove\
    \  var=\"author\"/>\n```\n上述代码从所有范围（page, session, application, request）移除属性。为了指定，我们必须在\
    \ `<c:remove>` 标签内指定 `scope` 属性，就像我下面做的那样——下面的 JSTL 语句将从 session 范围移除变量。\n```jsp\n\
    <c:remove  var=\"author\"  scope=\"session\"/>\n```\n4. **`<c:if>` 标签**: 这个 JSTL\
    \ 核心标签用于测试条件。该标签还有两个可选属性 `var` 和 `scope`，`test` 是强制性的。\n\n5. **`<c:choose>` 标签**:\
    \ 这个 JSTL 核心标签用于测试多个条件。它类似于 Java 中的 `switch-else-if` 语句。\n\n# JSTL `<c:choose>`,\
    \ `<c:when>`, `<c:otherwise>` 核心标签\n`<c:choose>`, `<c:when>`, `<c:otherwise>`\
    \ 一起使用，类似于 Java 中的 `switch-else-if`。\n\n### `<c:choose>`, `<c:when>`, `<c:otherwise>`\n\
    在这里我们讨论 `<c:choose>` 类似于 `switch`，`<c:when>` 类似于 `case`，可以在 `<c:choose>` 中使用多次。`<c:otherwise>`\
    \ 类似于 `default`，当所有 `<c:when>` 语句为假时执行。\n\n语法：\n```xml\n<c:choose>\n  <c:when\
    \ test=\"${condition1}\">\n    // 如果 condition1 为真，则执行某些操作\n  </c:when>\n  <c:when\
    \ test=\"${condition2}\">\n    // 如果 condition2 为真，则执行某些操作\n  </c:when>\n  <c:otherwise>\n\
    \    // 如果所有条件都为假，则执行某些操作\n  </c:otherwise>\n</c:choose>\n```\n\n### 示例:\n在这个示例中，我们有三个数字，并使用这三个标签对它们进行比较。示例非常于理解。输出截图在示例代码之后。\n\
    \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <html>\n<head>\n<title>c:choose, c:when and c:otherwise Example</title>\n</head>\n\
    <body>\n<c:set  var=\"number1\"  value=\"222\"/>\n<c:set  var=\"number2\"  value=\"\
    12\"/>\n<c:set  var=\"number3\"  value=\"10\"/>\n\n<c:choose>\n  <c:when test=\"\
    ${number1 < number2}\">\n    <c:out value=\"number1 is less than number2\"/>\n\
    \  </c:when>\n  <c:when test=\"${number1 <= number3}\">\n    <c:out value=\"number1\
    \ is less than equal to number3\"/>\n  </c:when>\n  <c:otherwise>\n    <c:out\
    \ value=\"number1 is largest number!\"/>\n  </c:otherwise>\n</c:choose>\n</body>\n\
    </html>\n```\n输出:\n![](img/image0046.jpeg)\n\n6. **`<c:when>` 标签**: 它类似于 Java\
    \ 中的 `case` 语句。注意：参考第 5 点完整示例。\n\n7. **`<c:otherwise>` 标签**: 它类似于 switch-case\
    \ 语句中的 `default` 属性。注意：参考第 5 点完整示例。\n\n8. **`<c:catch>` 标签**: 该标签用于异常处理。在本文中讨论了使用\
    \ `<c:catch>` 核心标签进行异常处理。\n\n#### 语法：\n```xml\n<c:catch var=\"variable_name\"\
    >\n// 可能会发生异常的语句集\n</c:catch>\n```\n\n"
- fmt: "\n## Variable Handling\n`variable_name` can be any variable in which exception\
    \ message would be stored. If there is an exception occurs in the statements enclosed\
    \ in `<c:catch>` then this variable contains the exception message. Let us understand\
    \ this with the help of an example.\n\n### Example\n\nIn this example we are intentionally\
    \ throwing arithmetic exception by dividing an integer with zero and then we are\
    \ printing the `errormsg` variable (which contains the exception message) using\
    \ `Expression language (EL)`.\n\nNote: If there is no exception in the block of\
    \ statements in `<c:catch>` then the variable (in example it’s `errormsg`) should\
    \ have null value. That’s the reason we are checking `errormsg!=null` before printing\
    \ the variable’s value.\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title>JSTL c:catch Core Tag Example</title>\n\
    </head>\n<body>\n<%!\nint num1=10;\nint num2=0; %>\n<c:catch var =\"errormsg\"\
    >\n<% int res = num1/num2;\n out.println(res);%>\n</c:catch>\n<c:if test = \"\
    ${errormsg != null}\">\n <p>There has been an exception raised in the above arithmetic\
    \ operation. Please fix the error.\n Exception is: ${errormsg}</p>\n</c:if>\n\
    </body>\n</html>\n```\n\nOutput:\n![](Images/image00409.jpeg)\n\n## JSTL <c:import>\
    \ Core Tag\nJSTL `<c:import>` tag is used for importing the content from another\
    \ file/page to the current JSP page. Attributes – `var`, `URL` and `scope`.\n\n\
    ### Syntax\n```xml\n<c:import var=\"variable_name\" url=\"relative_url\"/>\n```\n\
    Here `variable_name` is a variable which stores the data imported from another\
    \ url.\n`relative_url` is the address of the file/page which needs to be imported.\n\
    \n### Attributes of <c:import>\n- `url`: It’s mandatory attribute and needs to\
    \ be mentioned always.\n- `var`: It is an optional attribute if this is not specified\
    \ then the imported data will be printed on the current page. For e.g. the statement\
    \ `<c:import url=\"/file.jsp\" />` would print the data of file.jsp on the client\
    \ (browser).\n- `scope`: It is also optional. If we are using `var` attribute\
    \ then `scope` can be used along with it to specify the scope of the data stored\
    \ in the variable.\n\n### Example\nThis is a page which has some data. We will\
    \ import this page in `index.jsp` page.\n\n**display.jsp**\n```jsp\n<%@ taglib\
    \ uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<c:out value=\"Chandru\"\
    />\n<c:out value=\"JavaBook.com\" />\n<c:out value=\"This is just a String\" />\n\
    ```\n\n**index.jsp**\nHere we are importing the data from `display.jsp` into a\
    \ variable `mydata` and then we are displaying it on browser using `<c:out>` tag.\n\
    \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <html>\n<head>\n<title> JSTL c:import Tag Example</title>\n</head>\n<body>\n<c:import\
    \ var=\"mydata\" url=\"/display.jsp\"/>\n<c:out value=\"${mydata}\"/>\n</body>\n\
    </html>\n```\n\nOutput:\nChandru javabook.com This is just a string\n\n## JSTL\
    \ <c:forEach> and <c:forTokens> Core Tags\nThe `<c:forEach>` tag in JSTL is used\
    \ for executing the same set of statements for a finite number of times. It is\
    \ similar to the `for` loop in `java`. This is basically used when we need to\
    \ perform (execute) set of statements again and again for a specified number of\
    \ times.\n\nThe `<c:forTokens>` is also used for iteration but it only works with\
    \ delimiter which means using this tag we can break the input data into multiple\
    \ parts based on the delimiter.\n\n### <c:forEach> Tag\n\n#### Syntax of <c:forEach>\n\
    ```xml\n<c:forEach var=\"counter_variable_name\" begin=\"intial_value\" end=\"\
    final_limit\">\n    //Block of statements\n</c:forEach>\n```\nThe below are the\
    \ three main attributes of `<c:forEach>` tag:\n- `begin`: The initial counter\
    \ value.\n- `end`: The final limit till which the loop will execute.\n- `var`:\
    \ Counter variable name.\n\n#### Example\nIn this example we are printing value\
    \ of variable `counter` in loop using `<c:forEach>` tag. The loop is starting\
    \ from value 1 (mentioned in `begin` attribute) and ending at value 10 (value\
    \ of `end` attribute).\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title>Example c:forEach tag in JSTL</title>\n\
    </head>\n<body>\n<c:forEach var=\"counter\" begin=\"1\" end=\"10\">\n    <c:out\
    \ value=\"${counter}\"/>\n</c:forEach>\n</body>\n</html>\n```\nOutput:\n![](Images/image0041.jpeg)\n\
    \n### <c:forTokens> Tag\n\n#### Syntax of <c:forTokens>\n```xml\n<c:forTokens\
    \ var=\"variable_name\" items=\"value\" delim=\"delimiter\">\n```\nThe below are\
    \ the three main attributes of `<c:forTokens>` tag:\n- `items`: The collection\
    \ to be split.\n- `delim`: The delimiter used to split.\n- `var`: The variable\
    \ name to store each part.\n\n#### Example\nIn this example we are splitting the\
    \ string into multiple parts using `<c:forTokens>`.\n\n```jsp\n<%@ taglib uri=\"\
    http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n<head>\n<title>Example\
    \ c:forTokens tag in JSTL</title>\n</head>\n<body>\n<c:forTokens var=\"site\"\
    \ items=\"www.javabook.com\" delim=\".\">\n    <c:out value=\"${site}\"/>\n</c:forTokens>\n\
    </body>\n</html>\n```\nOutput:\nwww\njavabook\ncom\n\n## JSTL <c:param> Core Tag\n\
    The `<c:param>` tag is used for adding parameters to a URL. It is often used inside\
    \ `<c:url>`.\n\n### Syntax\n```xml\n<c:param name=\"parameter_name\" value=\"\
    parameter_value\"/>\n```\n### Attributes\n- `name`: To specify the name of the\
    \ parameter.\n- `value`: To specify the value of the parameter.\n\n### Example\n\
    In this example we are adding parameters to a URL using `<c:param>` tag.\n\n```jsp\n\
    <%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n\
    <head>\n<title>JSTL c:param Tag Example</title>\n</head>\n<body>\n<c:url value=\"\
    /mypage.jsp\" var=\"completeURL\">\n<c:param name=\"Id\" value=\"736\"/>\n<c:param\
    \ name=\"user\" value=\"chandru\"/>\n</c:url>\n${completeURL}\n</body>\n</html>\n\
    ```\nOutput:\n/mypage.jsp?Id=736&user=chandru\n\n#### Example 2: <c:param> use\
    \ in <c:redirect>\nHere we are passing parameters along with redirect using `<c:param>`\
    \ and then we are displaying those parameters on the redirected page using `param`\
    \ variable of expression language.\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title>c:param Example2</title>\n</head>\n\
    <body>\n<c:redirect url=\"/display.jsp\">\n<c:param name=\"UserId\" value=\"222\"\
    />\n<c:param name=\"UserName\" value=\"ChandruBabu\"/>\n</c:redirect>\n</body>\n\
    </html>\n```\n**display.jsp**\n```jsp\nUSER ID IS: ${param.UserId}\nUSER NAME\
    \ IS: ${param.UserName}\n```\nOutput:\nUSER ID IS: 222\nUSER NAME IS:ChandruBabu\n\
    \n## JSTL <c:url> Core Tag\n`<c:url>` tag is used for url formatting or url encoding.\
    \ It converts a relative url into a application context url. Attributes – `var`,\
    \ `context` and `scope`.\n\n### Syntax\n```xml\n<c:url value=\"/file1.jsp\"/>\n\
    ```\nThe `value` attribute is a required attribute for the `<c:url>` tag. There\
    \ are three other optional attributes exist for this tag which are as follows:\n"
