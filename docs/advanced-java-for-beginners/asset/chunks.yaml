  trans: "\n\n# Java Server Pages (JSP) 生命周期\n\nJSP 页面以 `.jsp` 扩展名保存，这让服务器知道这是一个 JSP\
    \ 页面，并且需要经过 JSP 生命各个阶段。\n\n在我之前关于 JSP 介绍的博文中，我解释过 JSP 并不是直接被处理的，它们首先被转换为 `Servlets`，然后由服务器对相应的\
    \ servlet 处理。\n\n当客户端向 `Server` 发起请求时，它首先进入 `container`。然后 `container` 检查 servlet\
    \ 类是否旧于 JSP 页面（以确保 JSP 文件已被修改）。如果是如此，则 `container` 将再次进行翻译（将 JSP 转换为 `Servlet`），否则它将跳过翻译阶段（即：如果\
    \ JSP 网页未被修改，则不进行翻译以提高性能，因为此阶段非常耗时，且每次都重复此步骤在时间上是不可行的）。\n\nJSP 页面的生命周期步骤如下：\n\n\
    1) 翻译 (Translation)\n2) 编译 (Compilation)\n3) 加载 (Loading)\n4) 实例化 (Instantiation)\n\
    5) 初始化 (Initialization)\n6) 请求处理 (Request Processing)\n7) 销毁 (Destruction)\n\n\
    ![](img/image00363.jpeg)\n\n## 让我们详细查看 JSP 的周期\n\n1) 如上所述，每当 `container` 接收到客户端请求时，只有当\
    \ servlet 类旧于 JSP 页时才会进行翻译，否则跳过此阶段（原因见上文解释）。\n\n2) 然后 `container` ——\n- 编译相应的\
    \ servlet 程序\n- 加载相应的 servlet 类\n- 实例化 servlet 类\n- 调用 `jspInit()` 方法初始化 servlet\
    \ 实例（只有当 servlet 文件实例未运行或其旧于 jsp 文件时，Jsp 容器才会执行此工作）。\n\n```java\npublic void jspInit()\n\
    {\n    // 初始化 Servlet 实例的代码\n}\n```\n\n3) 然后创建一个新线程，该线程调用 `_jspService()` 方法，并将请求\
    \ (`HttpServletRequest`) 和响应 (`HttpServletRespnse`) 对象作为参数 - 所示。\n\n```java\n\
    void _jspService( HttpServletRequest req, HttpServletResponse res)\n{\n    //\
    \ 代码写在这里\n}\n```\n\n4) 调用 `jspDestroy()` 方法销毁 servlet 类实例。代码如下所示 –\n\n```java\n\
    public void jspDestory()\n{\n    //  servlet 类实例的代码\n}\n```\n\n## SCRIPTTS\n\n\
    ### JSP Scriptlets (脚本段)\n\n我们可以使用 scriptlets 在 JSP 中编写 java 代码。JSP 容器会将 scriptlets\
    \ 内容移动到 `_jspService()` 方法中，该方法在处理请求期间对服务器可用。\n\nScriptlets 无非就是封装在 `<%` 和 `%>`\
    \ 标签内的 java 代码。JSP 容器在从 JSP 生成 servlet 时，会将包含其中的语句移动到 `_jspService()` 方法。将此代码拷贝到服务方法的原因是：对于每个客户端的请求都会调用\
    \ `_jspService()` 方法，因此其中的代码会为客户端的每个请求执行一次。\n\n**Scriptlet 语法：**\n\n```java\n\
    <% 可执行的 java 代码%>\n```\n\n### Scriptlet 的 JSP 到 Servlet 转换 –\n\n正如我在之前的教程中所说，JSP\
    \ 不直接执行，它首先被转换为 `Servlet`，然后像正常一样执行 `Servlet`。此外，我在第一段中解释过，在从 JSP 到 servlet 的翻译过程中，java\
    \ 代码从 scriptlet 复制到 `_jspService()` 方法。让我们来看看它是如何发生的。\n\n**示例 JSP 代码：**\n\n```html\n\
    <H3>SampleJSP </H3>\n<% myMethod();%>\n```\n\n注意：scriptlet 末尾的分的分号。\n\n**上述 JSP\
    \ 代码对应的翻译后的 Servlet 代码：**\n\n```java\npublic void _jspService(HttpServletRequest\
    \ request, HttpServletResponse response)\nthrows ServletException, IOException\
    \ {\n    response.setContentType(\"text/html\");\n    HttpSession session = request.getSession();\n\
    \    JspWriter out = response.getWriter();\n    out.println(\"<H2>Sample JSP</H2>\"\
    );\n    myMethod();\n}\n```\n\n**一个学习脚本元素的示例：**\n\n```java\n<%– 一个用于学习 JSP 脚本元素的\
    \ JSP 示例 –%>\n<%String string1 =\"JSP scriptlet\";%>\n<%!String string2 =\"\"\
    ;%>\n<html>\n<head>\n<title> JSP 页面: 欢迎 </title>\n</head>\n<body>\n<h1>\n<%– 这是一个表达式语句\
    \ –%>\nWelcome to <%=string1%>\n</h1>\n<%– scriptlet 示例 –%>\n<%if(localstring.equals(\"\
    JSP scriptlet\")){%>\nHi\n<%}\nelse {%>\nhello\n<%} %>\n<%– 也可以用这样做实现 –%>\n<%if(localstring.equals(\"\
    JSP scriptlet\"))\nout.println(\"Hi\"+string2);\nelse\nout.println(\"hello\");\n\
    %>\n</body>\n</html>\n```\n\n在上面的示例中，存在许多类型的 JSP 元素，例如表达式 (Expression)、JSP 注释、声明元素等。我们将在接下来的\
    \ JSP 教程中查看每一个，但目前你只需要关注 Scriptlets。以下是上述示例中使用的 scriptlets 语句：\n\n```java\n<%if(localstring.equals(\"\
    JSP scriptlet\"))\nout.println(\"Hi\"+string2);\nelse\nout.println(\"hello\");\n\
    %>\n```\n\n上面的代码是一个 JSP scriptlet（注意起始的 `<%` 和结束的 `%>` 标签）。如果你分析上面的代码段，你会发现标签内的代码是纯\
    \ java 代码，因此为了在 JSP 中执行 java 代码，我们使用 scriptlets。\n\n```java\n<%String string1\
    \ =\"JSP scriptlet\";%>\n```\n\n每当 `container` 接收到客户端请求时，只有当 servlet 类旧于 JSP 页面时才会进行翻译，否则跳过此阶段（原因见上文解释）。\n\
    \n然后 `container` ——\n```java\nif (num > 5)\n{\n    out.println(\"hi\");\n}\nelse\n\
    {\n    out.println(\"num value should be less than 6\");\n}\n```\n\n```html\n\
    <! DOYPE HTML PUBLIC \"-//W3C//DTD HTML4.0//EN\">\n<html>\n<head>\n<TITLE> MY\
    \ JSP PAGE </TITLE>\n</head>\n<body>\n<% if (num > 5) { %>\n<H3> hi </H3>\n<%}\
    \ else {%>\n<h3> num value should be less than 6 </h3>\n<% } %>\n</body>\n</html>\n\
    ```\n\n重要的点：由于内部代码是 java 代码，它必须以分号结束。现在注意所有语句 —— 你会发现 java 中都需要它并以分号结束。\n\n**注意：回到此处**\n\
    \n## DECLARATIONS (声明)\n\n### ACTION TAGS (动作标签)\n\n#### JSP Actions – Java Server\
    \ Pages\n\n**Directives (指令) 与 Actions (动作)**\n1. 指令在翻译阶段使用而动作在请求处理阶段使用。\n2. 与指令不同，动作在每次访问页面时都会重新求值。\n\
    3. 以下是 JSP 中使用的动作元素：\n\n**1. `<jsp:include>` 动作**\n就像 include 指令，此动作也用于将 JSP 文件插入另一个文件中。\n\
    \n`<jsp:include>` 与 include 指令：它们具有我在文章开头提到的相同区别（指令与动作）。在 `<jsp:include>` 中，文件是在请求处理期间包含的，而在\
    \ include 指令的情况下是在翻译阶段包含的。\n\n**语法：**\n\n```xml\n<jsp:include page=\"page URL\"\
    \ flush=\"Boolean Value\" />\n```\n这里 `page URL` 是：需要包含的页面位置 `flush` 值可以是 true\
    \ 或 false（布尔值）。\n\n**示例：**\n\n```html\n<html>\n<head>\n<title>JSP include 动作标签演示</title>\n\
    </head>\n<body>\n<h3>JSP 页面: 包含演示</h3>\n<jsp:include page=\"sample.jsp\" flush=\"\
    false\" />\n</body>\n</html>\n```\n\n"
- fmt: "\n# Page Details\n\nPage: Page value is `sample.jsp` which means this is the\
    \ page needs to be included in the current file. Just the file name mentioned\
    \ which shows that `sample.jsp` is in the same directory.\n\nFlush: Its value\
    \ is `false`, which means resource buffer has not been flushed out before including\
    \ to the current page.\n\n# JSP include action tag\n\nJSP include action tag –\
    \ JSP Tutorial\n\nInclude action tag is used for including another resource to\
    \ the current JSP page. The included resource can be a static page in HTML, JSP\
    \ page or Servlet. We can also pass parameters and their values to the resource\
    \ which we are including. Below I have shared two examples of `<jsp:include>`,\
    \ one which includes a page without passing any parameters and in second example\
    \ we are passing few parameters to the page which is being included.\n\n## Syntax\n\
    \n1) Include along with parameters.\n\n```jsp\n<jsp:include page=\"Relative_URL_Of_Page\"\
    >\n    <jsp:param ... />\n    <jsp:param ... />\n    <jsp:param ... />\n    ...\n\
    \    <jsp:param ... />\n</jsp:include>\n```\n\n2) Include of another resource\
    \ without sharing parameters.\n\n```jsp\n<jsp:include page=\"Relative_URL_of_Page\"\
    \ />\n```\n\n`Relative_URL_of_Page` would be the page name if the page resides\
    \ in the same directory where the current JSP resides.\n\n## Example 1: <jsp:include>\
    \ without parameters\n\nIn this example we will use `<jsp:include>` action tag\
    \ without parameters. As a result the page will be included in the current JSP\
    \ page as it is:\n\n**index.jsp**\n```jsp\n<html>\n<head>\n    <title>JSP Include\
    \ example</title>\n</head>\n<body>\n    <b>index.jsp Page</b><br>\n    <jsp:include\
    \ page=\"Page2.jsp\" />\n</body>\n</html>\n```\n\n**Page2.jsp**\n```jsp\n<b>Page2.jsp</b><br>\n\
    <i> This is the content of Page2.jsp page</i>\n```\n\n**Output:**\nContent of\
    \ `Page2.jsp` has been appended in the `index.jsp`.\n\n![](Images/image00364.jpeg)\n\
    \n## Example 2: Use of <jsp:include> along with <jsp:param>\n\n**index.jsp**\n\
    ```jsp\nI’m using `<jsp:include>` action here along with `<jsp:param>` for passing\
    \ parameters to the page which we are going to include.\n<html>\n<head>\n    <title>JSP\
    \ Include example with parameters</title>\n</head>\n<body>\n    <h2>This is index.jsp\
    \ Page</h2>\n    <jsp:include page=\"display.jsp\">\n        <jsp:param name=\"\
    userid\" value=\"Chandru\" />\n        <jsp:param name=\"password\" value=\"Chandru\"\
    \ />\n        <jsp:param name=\"name\" value=\"Chandru Babu\" />\n        <jsp:param\
    \ name=\"age\" value=\"27\" />\n    </jsp:include>\n</body>\n</html>\n```\n\n\
    **display.jsp**\n```jsp\n<html>\n<head>\n    <title>Display Page</title>\n</head>\n\
    <body>\n    <h2>Hello this is a display.jsp Page</h2>\n    UserID: <%=request.getParameter(\"\
    userid\") %><br>\n    Password is: <%=request.getParameter(\"password\") %><br>\n\
    \    User Name: <%=request.getParameter(\"name\") %><br>\n    Age: <%=request.getParameter(\"\
    age\") %>\n</body>\n</html>\n```\n\n**Output:**\nAs you can see that the content\
    \ of `display.jsp` has been included in `index.jsp`. Also, the parameters we have\
    \ passed are displaying correctly in the included page.\n\n![](Images/image00365.jpeg)\n\
    \n# JSP include action with parameter example\n\nIn order to pass the parameters\
    \ we need to use the `<jsp:param>` action tag.\n\n## Example\n\nIn this example\
    \ we are including a JSP page (`file.jsp`) to the main JSP page (`index.jsp`)\
    \ using `<jsp:include>` action tag. To pass the parameters from index to file\
    \ page we are using `<jsp:param>` action tag. We are passing three parameters\
    \ `firstname`, `middlename` and `lastname`, for each of these parameters we need\
    \ to specify the corresponding parameter name and parameter value. The same we\
    \ can extract at the included page using expression language or expression tag\
    \ & implicit object.\n\n**index.jsp**\n```jsp\n<html>\n<head>\n    <title>JSP\
    \ include with parameters example</title>\n</head>\n<body>\n    <jsp:include page=\"\
    file.jsp\">\n        <jsp:param name=\"firstname\" value=\"Chandru\" />\n    \
    \    <jsp:param name=\"middlename\" value=\"Pratap\" />\n        <jsp:param name=\"\
    lastname\" value=\"Prasad\" />\n    </jsp:include>\n</body>\n</html>\n```\n\n\
    **file.jsp**\n```jsp\n${param.firstname}<br>\n${param.middlename}<br>\n${param.lastname}\n\
    ```\n\n**Output:**\n![](Images/image00366.jpeg)\n\nAs you can see that the included\
    \ page displayed the parameters values passed from the main page. For displaying\
    \ the parameters on the `file.jsp` page, we have used the expression language\
    \ `${}`. However you can also use the following code which is using the JSP expression\
    \ tag and request implicit object.\n\n```jsp\n<%= request.getParameter(\"firstname\"\
    )%>\n<%= request.getParameter(\"middlename\")%>\n<%= request.getParameter(\"lastname\"\
    )%>\n```\n\n# JSP forward action\n\n`<jsp:forward>` is used for forwarding the\
    \ request to another resource.\n\n## Syntax\n\n```jsp\n<jsp:forward page=\"URL\"\
    >\n    <jsp:param ... />\n    <jsp:param ... />\n</jsp:forward>\n```\n\n## Example\n\
    \n**first.jsp**\n```jsp\n<html>\n<head>\n    <title>JSP forward action</title>\n\
    </head>\n<body>\n    <h1>Demo forward</h1>\n    <jsp:forward page=\"second.jsp\"\
    \ />\n</body>\n</html>\n```\n\n**second.jsp**\n```jsp\n<html>\n<head>\n    <title>Second\
    \ Page</title>\n</head>\n<body>\n    <h1>This is the second page</h1>\n</body>\n\
    </html>\n```\n"
  raw: "Page: Page value is sample.jsp which means this is the page needs to be included\
    \ in the current file. Just the file name mentioned which shows that the sample.jsp\
    \ is in the same directory.\n\nFlush:  Its value is false, which means resource\
    \ buffer has not been flushed out before including to the current page.\n\nJSP\
    \ include action tag\n\nJSP include action tag – JSP Tutorial\n\nInclude action\
    \ tag is used for including another resource to the current JSP page. The included\
    \ resource can be a static page in HTML, JSP page or Servlet. We can also pass\
    \ parameters and their values to the resource which we are including. Below I\
    \ have shared two examples of <jsp:include>, one which includes a page without\
    \ passing any parameters and in second example we are passing few parameters to\
    \ the page which is being included.\n\nSyntax:\n\n1) Include along with parameters.\n\
    \n<jsp:include  page=\"Relative_URL_Of_Page\">\n\n<jsp:param ... />\n\n<jsp:param\
    \ ... />\n\n<jsp:param ... />\n\n...\n\n<jsp:param ... />\n\n</jsp:include>\n\n\
    2) Include of another resource without sharing parameters.\n\n<jsp:include  page=\"\
    Relative_URL_of_Page\"  />\n\nRelative_URL_of_Page would be the page name if the\
    \ page resides in the same directory where the current JSP resides.\n\nExample\
    \ 1: <jsp:include> without parameters\n\nIn this example we will use <jsp:include>\
    \ action tag without parameters. As a result the page will be included in the\
    \ current JSP page as it is:\n\nindex.jsp\n\n<html>\n\n<head>\n\n<title>JSP Include\
    \ example</title>\n\n</head>\n\n<body>\n\n<b>index.jsp Page</b><br>\n\n<jsp:include\
    \  page=\"Page2.jsp\"  />\n\n</body>\n\n</html>\n\nPage2.jsp\n\n<b>Page2.jsp</b><br>\n\
    \n<i> This is the content of Page2.jsp page</i>\n\nOutput:\n\nContent of Page2.jsp\
    \ has been appended in the index.jsp.\n\n![](Images/image00364.jpeg)\n\nExample\
    \ 2: Use of <jsp:include> along with <jsp:param>\n\nindex.jsp\n\nI’m using <jsp:include>\
    \ action here along with <jsp:param> for passing parameters to the page which\
    \ we are going to include.\n\n<html>\n\n<head>\n\n<title>JSP Include example with\
    \ parameters</title>\n\n</head>\n\n<body>\n\n<h2>This is index.jsp Page</h2>\n\
    \n<jsp:include  page=\"display.jsp\">\n\n<jsp:param  name=\"userid\"  value=\"\
    Chandru\"  />\n\n<jsp:param  name=\"password\"  value=\"Chandru\"  />\n\n<jsp:param\
    \  name=\"name\"  value=\"Chandru Babu\"  />\n\n<jsp:param  name=\"age\"  value=\"\
    27\"  />\n\n</jsp:include>\n\n</body>\n\n</html>\n\ndisplay.jsp\n\n<html>\n\n\
    <head>\n\n<title>Display Page</title>\n\n</head>\n\n<body>\n\n<h2>Hello this is\
    \ a display.jsp Page</h2>\n\nUserID: <%=request.getParameter(\"userid\") %><br>\n\
    \nPassword is: <%=request.getParameter(\"password\") %><br>\n\nUser Name: <%=request.getParameter(\"\
    name\") %><br>\n\nAge: <%=request.getParameter(\"age\") %>\n\n</body>\n\n</html>\n\
    \nOutput:\n\nAs you can see that the content of display.jsp has been included\
    \ in index.jsp. Also, the parameters we have passed are displaying correctly in\
    \ the included page.\n\n![](Images/image00365.jpeg)\n\nJSP include action with\
    \ parameter example\n\nJSP include action with parameter example\n\nIn order to\
    \ pass the parameters we need to use the <jsp:param> action tag.\n\nExample\n\n\
    In this example we are including a JSP page (file.jsp) to the main JSP page (index.jsp)\
    \ using <jsp:include> action tag. To pass the parameters from index to file page\
    \ we are using <jsp:param> action tag. We are passing three parameters firstname,\
    \ middlename and lastname, for each of these parameters we need to specify the\
    \ corresponding parameter name and parameter value. The same we can extract at\
    \ the included page using expression language or expression tag & implicit object.\n\
    \nindex.jsp\n\n<html>\n\n<head>\n\n<title>JSP include with parameters example</title>\n\
    \n</head>\n\n<body>\n\n<jsp:include  page=\"file.jsp\"  >\n\n <jsp:param  name=\"\
    firstname\"  value=\"Chandru\"  />\n\n <jsp:param  name=\"middlename\"  value=\"\
    Pratap\"  />\n\n <jsp:param  name=\"lastname\"  value=\"Prasad\"  />\n\n</jsp:include>\n\
    \n</body>\n\n</html>\n\nfile.jsp\n\n${param.firstname}<br>\n\n${param.middlename}<br>\n\
    \n${param.lastname}\n\nOutput:\n\n![](Images/image00366.jpeg)\n\nAs you can see\
    \ that the included page displayed the parameters values passed from the main\
    \ page. For displaying the parameters on the file.jsp page, we have used the [expression\
    \ language (${}).](#part0000.xhtml_EXPLAN) However you can also use the following\
    \ code which is using the JSP [expression tag](#part0000.xhtml_EXPRESSIONTAG)\
    \ and [request implicit object.](#part0000.xhtml_REQIMPLICIT)\n\n<%= request.getParameter(\"\
    firstname\")%>\n\n<%= request.getParameter(\"middlename\")%>\n\n<%= request.getParameter(\"\
    lastname\")%>\n\n2. <jsp:forward> Action\n\n<jsp:forward> is used for redirecting\
    \ the request. When this action is encountered on a JSP page the control gets\
    \ transferred to the page mentioned in this action.\n\nSyntax:\n\n<jsp:forward\
    \ page=\"URL of the another static, JSP OR Servlet page\" />\n\nExample:\n\nfirst.jsp\n\
    \n<html>\n\n<head>\n\n<title>Demo of JSP Forward Action Tag</title>\n\n</head>\n\
    \n<body>\n\n<h3>JSP page: Demo forward</h3>\n\n<jsp:forward page=\"second.jsp\"\
    \ />\n\n</body>\n\n</html>\n\nNow when JSP engine would execute first.jsp (the\
    \ above code) then after action tag, the request would be transferred to another\
    \ JSP page (second.jsp).\n\nNote:  first.jsp and second.jsp should be in the same\
    \ directory otherwise you have to specify the complete path of second.jsp.\n\n\
    JSP forward action tag\n\nJSP forward action tag – JSP Tutorial\n\nJSP forward\
    \ action tag is used for forwarding a request to another resource (It can be a\
    \ JSP, static page such as html or Servlet). Request can be forwarded with or\
    \ without parameter. In this tutorial we will see examples of <jsp:forward> action\
    \ tag.\n\nSyntax:\n\n1)  Forwarding along with parameters.\n\n<jsp:forward  page=\"\
    display.jsp\">\n\n<jsp:param ... />\n\n<jsp:param ... />\n\n<jsp:param ... />\n\
    \n...\n\n<jsp:param ... />\n\n</jsp:forward>\n\n2) Forwarding without parameters.\n\
    \n<jsp:forward  page=\"Relative_URL_of_Page\"  />\n\nRelative_URL_of_Page: If\
    \ page is in the same directory where the main page resides then use page name\
    \ itself as I did in the below examples.\n\nJSP Forward Example 1 – without passing\
    \ parameters\n\nIn this example we are having two JSP pages – index.jsp and display.jsp.\
    \ We have used <jsp:forward> action tag in index.jsp for forwarding the request\
    \ to display.jsp. Here we are not passing any parameters while using the action\
    \ tag. In the next example we will pass the parameters as well to another resource.\n\
    \nindex.jsp\n\n<html>\n\n<head>\n\n<title>JSP forward action tag example</title>\n\
    \n</head>\n\n<body>\n\n<p  align=\"center\">My main JSP page</p>\n\n<jsp:forward\
    \  page=\"display.jsp\"  />\n\n</body>\n\n</html>\n\ndisplay.jsp\n\n<html>\n\n\
    <head>\n\n<title>Display Page</title>\n\n</head>\n\n<body>\n\nHello this is a\
    \ display.jsp Page\n\n</body>\n\n</html>\n\nOutput:\n\nBelow is the output of\
    \ above code. It is basically the content of display.jsp, which clearly shows\
    \ that index.jsp didn’t display as it forwarded the request to the display.jsp\
    \ page.\n\n![](Images/image00367.jpeg)\n\nJSP Forward Example 2 – with parameters\n\
    \nHere we are passing the parameters along with forward request. For passing parameters\
    \ we are using <jsp:param> action tag. In this example we are passing 4 parameters\
    \ along with forward and later we are displaying them on the forwarded page. In\
    \ order to fetch the parameters on display.jsp page we are using getParameter\
    \ method of request implicit object.\n\nindex.jsp\n\n<html>\n\n<head>\n\n<title>JSP\
    \ forward example with parameters</title>\n\n</head>\n\n<body>\n\n<jsp:forward\
    \  page=\"display.jsp\">\n\n<jsp:param  name=\"name\"  value=\"Chandru\"  />\n\
    \n<jsp:param  name=\"site\"  value=\"JavaBook.com\"  />\n\n<jsp:param  name=\"\
    tutorialname\"  value=\"jsp forward action\"  />\n\n<jsp:param  name=\"reqcamefrom\"\
    \  value=\"index.jsp\"  />\n\n</jsp:forward>\n\n</body>\n\n</html>\n\ndisplay.jsp\n\
    \n<html>\n\n<head>\n\n<title>Display Page</title>\n\n</head>\n\n<body>\n\n<h2>Hello\
    \ this is a display.jsp Page</h2>\n\nMy name is: <%=request.getParameter(\"name\"\
    ) %><br>\n\nWebsite: <%=request.getParameter(\"site\") %><br>\n\nTopic: <%=request.getParameter(\"\
    tutorialname\") %><br>\n\nForward Request came from the page: <%=request.getParameter(\"\
    reqcamefrom\") %>\n\n</body>\n\n</html>\n\nOutput:"
