    \n## Output:\nFirst Screen:\n![](Images/image00461.jpeg)\n\nAfter clicking Submit:\n\
    Hello Chandruprasad Your Password is:Javabookview details\n\nAfter clicking view\
    \ details:\nName:Chandruprasad Pass:Javabook\n\n## Cookies in Servlet\n### Cookies\
    \ in Servlet with example\nHere we will discuss Cookies which is also used for\
    \ session management. Let’s recall few things here from last tutorial so that\
    \ we can relate sessions and cookies. When a user visits web application first\
    \ time, the servlet container crates new `HttpSession` object by calling `request.getSession()`.\
    \ A unique `Id` is assigned to the session. The Servlet container also sets a\
    \ `Cookie` in the header of the HTTP response with cookie name and the unique\
    \ session ID as its value.\n\nThe cookie is stored in the user browser, the client\
    \ (user’s browser) sends this cookie back to the server for all the subsequent\
    \ requests until the cookie is valid. The Servlet container checks the request\
    \ header for cookies and get the session information from the cookie and use the\
    \ associated session from the server memory.\n\nThe session remains active for\
    \ the time specified in tag in `web.xml`. If tag in not set in `web.xml` then\
    \ the session remains active for 30 minutes. Cookie remains active as long as\
    \ the user’s browser is running, as soon as the browser is closed, the cookie\
    \ and associated session info is destroyed. So when the user opens the browser\
    \ again and sends request to web server, the new session is being created.\n\n\
    ## Types of Cookies\nWe can classify the cookie based on their expiry time:\n\
    1. Session\n2. Persistent\n\n#### 1) Session Cookies:\nSession cookies do not\
    \ have expiration time. It lives in the browser memory. As soon as the web browser\
    \ is closed this cookie gets destroyed.\n\n#### 2) Persistent Cookies:\nUnlike\
    \ Session cookies they have expiration time, they are stored in the user hard\
    \ drive and gets destroyed based on the expiry time.\n\n## How to send Cookies\
    \ to the Client\nHere are steps for sending cookie to the client:\n1. Create a\
    \ `Cookie` object.\n2. Set the maximum `Age`.\n3. Place the `Cookie` in HTTP response\
    \ header.\n\n#### 1) Create a Cookie object:\n`Cookie c = new Cookie(\"userName\"\
    );`\n\n#### 2) Set the maximum Age:\nUsing `setMaxAge()` method we can set the\
    \ maximum age for the particular cookie.\n`c.setMaxAge(1800);`\n\n#### 3) Place\
    \ the Cookie in HTTP response header:\nWe can send the cookie to browser through\
    \ `response.addCookie()` method.\n`response.addCookie(c);`\n\n#### How to read\
    \ cookies:\n`Cookie[] c=request.getCookies();` gives the cookie.\n```java\nfor(int\
    \ i=0;i<c.length;i++){\n    System.out.println(c[i].getName() + \" \" + c[i].getValue());\n\
    }\n```\n"
