    \n运行项目：\n\n右键点击 `index.html`，在服务器上运行（run on server）。\n\n输出：\n\n![](img/image00424.jpeg)\n\
    \n# 点击第一个屏幕中的链接后的界面：\n\n# Generic Servlet 示例\n\n# Hello Javabook 的读者们\n\n## GenericServlet\
    \ 类的方法：\n\n这里是 `GenericServlet` 类所有方法的列表。\n\n1. `public void init()`: 这是一个方便的方法。可以重写此方法，这样就不需要调用\
    \ `super.init(config)`。\n2. `public void init(ServletConfig config)`: 由 Servlet\
    \ 容器调用，表示 servlet 正在进入服务状态，此方法用于初始化 servlet。\n3. `public String getInitParameter(String\
    \ name)`: 返回一个包含给定初始化参数值的字符串，如果该参数不存在则返回 null。\n4. `public Enumeration getInitParameterNames()`:\
    \ 返回 `web.xml` 文件中定义的所有参数名称，如果 `web.xml` 中没有任何参数，则返回 null。\n5. `public abstract\
    \ void service(ServletRequest request, ServletResponse response)`: 由 Servlet 容器调用，允许\
    \ servlet 响应客户端提出的请求。\n6. `public void destroy()`: 在 servlet 生命周期结束时由 servlet\
    \ 容器调用一次，表示 servlet 正在被销毁。\n7. `public ServletConfig getServletConfig()`: 返回初始化此\
    \ servlet 的 `ServletConfig` 对象。\n8. `public String getServletInfo()`: 返回关于 servlet\
    \ 的信息。\n9. `public ServletContext getServletContext()`: 返回由 `init` 方法传递给此 servlet\
    \ 的 `ServletContext` 对象。\n10. `public String getServletName()`: 返回 servlet 实例的名称。\n\
    11. `public void log(String msg)`: 在 servlet 日志文件中写入给的消息。\n12. `public void log(String\
    \ msg, Throwable t)`: 在 servlet 日志文件中写入解释性消息，包括描述错误或异常的字符串。\n\n## 带有示例的 HttpServlet\
    \ 类\n\n与 `Generic Servlet` 不同，`HTTP Servlet` 没有重写 `service()` 方法。相反，它重写了 `doGet()`\
    \ 方法或 doPost()` 方法或两者。`doGet()` 方法用于从服务器获取信息，而 `doPost()` 方法用于向服务器发送信息。\n\n在 `Http\
    \ Servlet` 中，没有需要重写 `service()` 方法，因为该方法会将 `Http Requests` 分发到正确的方法处理器，例如，如果它接收到\
    \ HTTP GET 请求，它会将请求分发给 `doGet()` 方法。\n\n## Http Servlet 如何工作？\n\n如如下图所示，客户端（用户浏览器）发出请求。这些请求可以是任何类型，例如——Get\
    \ 请求、Post 请求、Head 请求等。服务器将这些请求分发到 servlet 的 `service()` 方法，该方法将这些请求分发给正确的处理器，例如，如果它接收到\
    \ Get 请求，它将分发给 `doGet()` 方法。\n\n![](img/image00425.jpeg)\n\n## Http Servlet 的层次结构\n\
    \n`java.lang.Object`\n|_ 由 `javax.servlet.GenericServlet` 扩展\n|_ 由 `javax.servlet.http.HttpServlet`\
    \ 扩展\n\n我在 Generic Servlet 文章中讨论过，你应该始终使用 `HttpServlet` 而不是 `GenericServlet`。`HttpServlet`\
    \ 更容易操作，并且比 `GenericServlet` 有更多方法可以处理。\n\n## Http Servlet 示例\n\n我在此示例中使用 Eclipse\
    \ IDE。从 Eclipse 文件菜单中创建一个新的“Dynamic Web Project”（动态 Web 项目）。\n\n注意：我已解释了在 Eclipse\
    \ IDE 中创建 Servlet 的所有步骤，但如果你不熟悉 Eclipse 且系统中没有安装它，请参考此指南：如何安装 Eclipse、配置 Tomcat\
    \ 并使用 Eclipse 运行你的第一个 Servlet 应用程序。\n\n一旦你在 IDE 中创建了以下所有文件，项目结构（或说层次结构）将看起来如下所示：\n\
    \n![](img/image00426.jpeg)\n\n### index.html\n\n我们正在创建一个 html 文件，当我们点击网页上的链接时，它将调用\
    \ servlet。在 `WebContent` 文件夹中创建此文件。文件路径应该如下所示：`WebContent/index.html`\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Http Servlet\
    \ Demo</title>\n</head>\n<body>\n  <a href=\"welcome\">Click to call Servlet</a>\n\
    </body>\n</html>\n```\n\n### ExampleHttpServlet.java\n\n现在，我们正通过扩展 `HttpServlet`\
    \ 类来创建一个 `Http Servlet`。右键点击 `src` 文件夹并创建一个新类文件，文件名为 `ExampleHttpServlet`。文件路径应该如下所示：`Java\
    \ Resources/src/default package/ExampleHttpServlet.java`。\n\n```java\nimport java.io.*;\n\
    import javax.servlet.*;\nimport javax.servlet.http.*;\n\n// 通过扩展 HttpServlet 类创建\
    \ Http Servlet\n\npublic class ExampleHttpServlet extends HttpServlet {\n    private\
    \ String mymsg;\n\n    public void init() throws ServletException {\n        mymsg\
    \ = \"Http Servlet\";\n    }\n\n    public void doGet(HttpServletRequest request,\
    \ HttpServletResponse response) throws ServletException, IOException {\n     \
    \   // 设置网页的内容类型\n        response.setContentType(\"text/html\");\n        //\
    \ 在网页上写入消息\n        PrintWriter out = response.getWriter();\n        out.println(\"\
    <h1>\" + mymsg + \"</h1>\");\n        out.println(\"<p>\" + \"Hello Friends!\"\
    \ + \"</p>\");\n    }\n\n    public void destroy() {\n        // 如果你想在 servlet\
    \ 生命周期结束时执行某些操作，请留空此处。\n    }\n}\n```\n\n### web.xml\n\n该文件位于 `WebContent/WEB-INF/web.xml`。在此文件中我们将\
    \ servlet 映射到特定的 URL。我们在点击 index.html 上的链接时调用它。\n\n```xml\n<web-app>\n  <display-name>JavaBookServlet</display-name>\n\
    \  <welcome-file-list>\n    <welcome-file>index.html</welcome-file>\n    <welcome-file>index.htm</welcome-file>\n\
    \    <welcome-file>index.jsp</welcome-file>\n    <welcome-file>default.html</welcome-file>\n\
    \    <welcome-file>default.htm</welcome-file>\n    <welcome-file>default.jsp</welcome-file>\n\
    \  </welcome-file-list>\n  <servlet>\n    <servlet-name>MyHttpServlet</servlet-name>\n\
    \    <servlet-class>ExampleHttpServlet</servlet-class>\n  </servlet>\n  <servlet-mapping>\n\
    \    <servlet-name>MyHttpServlet</servlet-name>\n    <url-pattern>/welcome</url-pattern>\n\
    \  </servlet-mapping>\n</web-app>\n```\n\n## HttpServlet 类的方法：\n\n1. `protected\
    \ void doGet(HttpServletRequest req, HttpServletResponse resp)`: 此方法由 servlet\
    \ service 方法调用，处理来自客户端的 HTTP 请求。重写此方法时，读取请求数据，写入响应头，获取响应的 writer 或输出流对象，最后写入响应数据。\n\
    2. `protected long getLastModified(HttpServletRequest req)`: 返回一个长型整数，指定 `HttpServletRequest`\
    \ 对象最后修改的时间，自 GMT 1970 年 1 月 1 日午夜以来的毫秒数，如果时间未知则返回 -1。\n3. `protected void doHead(HttpServletRequest\
    \ req, HttpServletResponse resp)`: 此方法由 servlet service 方法调用，处理来自客户端的 HTTP HEAD\
    \ 请求。当客户端只想查看响应的头信息（例如 Content-Type 或 Content-Length）时，它会发送 HEAD 请求。\n\n"
- fmt: "\n4. `protected void doPost(HttpServletRequest req, HttpServletResponse resp)`:\
    \ This method is called by servlet service method to handle the POST request from\
    \ client. The HTTP POST method allows the client to send data of unlimited length\
    \ to the Web server a single time and is useful when posting information to the\
    \ server. Unlike, `doGet` where we get information from the sever this method\
    \ is used when we are transferring information from client to the server.\n\n\
    5. `protected void doPut(HttpServletRequest req, HttpServletResponse resp)`: This\
    \ method is called by servlet service method to handle the PUT request from client.\
    \ This method is similar to `doPost` method but unlike `doPost` method where we\
    \ send information to the server, this method sends file to the server, this is\
    \ similar to the FTP operation from client to server.\n\n6. `protected void doDelete(HttpServletRequest\
    \ req, HttpServletResponse resp)`: Called by `service()` method to handle the\
    \ DELETE request from client that allows a client to delete a document, webpage\
    \ or information from the server.\n\n7. `protected void doOptions(HttpServletRequest\
    \ req, HttpServletResponse resp)`: Called by the service method to allow a servlet\
    \ to handle a OPTIONS request. The OPTIONS request determines which HTTP methods\
    \ the server supports and returns an appropriate header.\n\n8. `protected void\
    \ doTrace(HttpServletRequest req, HttpServletResponse resp)`: This method is called\
    \ by `service()` method for handling TRACE request. Used for debugging purposes.\n\
    \n9. `protected void service(HttpServletRequest req, HttpServletResponse resp)`:\
    \ There is no need to override this method, this method receives the HTTP request\
    \ from client and forwards them to the corresponding `doXXX` methods such as `doGet()`,\
    \ `doPost()`, `doHead()` etc.\n\n10. `public void service(ServletRequest req,\
    \ ServletResponse res)`: Forwards client request to the protected service method.\
    \ There’s no need to override this method as well.\n\n# Note\n\nGo back from here\n\
    \n[Servlet Interface](#part0000.xhtml_servletinter)\n\n# How to create and run\
    \ Servlet in Eclipse IDE\n\nThis is a complete guide for installing Eclipse, setting\
    \ up apache tomcat server and running your first hello world servlet application.\n\
    \n## Note\n\nGet back from here:\n\n[Generic Servlet](#part0000.xhtml_generic)\n\
    \n[HttpServlet class](#part0000.xhtml_http)\n\n## Download Eclipse IDE\n\n###\
    \ Install Eclipse on Windows\n\nGo to this link `https://www.eclipse.org/downloads`.\
    \ Under “Get Eclipse Oxygen”❯Click “Download Packages”❯ Download “Eclipse IDE\
    \ for Java Developers”. You would see two options on the right side (32 bit and\
    \ 64 bit), click on 32 bit if your system is 32 bit else click on 64 bit. This\
    \ will download a zipped file on your system.\n\nTo install Eclipse, unzip the\
    \ downloaded file and copy the unzipped folder to the desired location.\n\n###\
    \ Install Eclipse on Mac OS X\n\nGo to this link `https://www.eclipse.org/downloads`.\
    \ Under “Get Eclipse Oxygen”❯Click “Download Packages”❯ Download “Eclipse IDE\
    \ for Java Developers”. To download click on 64 bit and it would download a TAR\
    \ file.\n\nOnce download is finished double click on the TAR file, it would extract\
    \ the contents of the file to a folder. Drag the folder to “Applications” folder.\n\
    \nTo launch the Eclipse, click on Eclipse icon in the Eclipse folder. Mac users\
    \ can drag this to the dock area to quickly launch Eclipse from desktop, similarly\
    \ Windows can create a shortcut of Eclipse on desktop.\n\n## Installing and configuring\
    \ Apache tomcat server in Eclipse\n\nIn order to run Servlet in Eclipse IDE, you\
    \ need to have Apache tomcat Server configured in Eclipse IDE.\n\nIf you don’t\
    \ have it then refer this tutorial: [How to download and configure Apache Tomcat\
    \ Server in Eclipse IDE.](#part0000.xhtml_apacheconfigure)\n\nNote: The link I\
    \ have provided above belongs to JSP tutorials but the steps are same for Servlets\
    \ as well.\n\n## Creating Servlet in Eclipse IDE\n\n### Step 1: Create a Project\n\
    \nLets create a Servlet application in Eclipse. Open Eclipse and then click File❯New❯\
    \ Click Dynamic Web Project.\n\n![](Images/image00427.jpeg)\n\nIf you do not see\
    \ dynamic web project option in Eclipse then refer this tutorial: [: How to fix\
    \ “Dynamic Web project” missing in Eclipse issue](#part0000.xhtml_dynammic)\n\n\
    Give Project name and click Next.\n\n![Give project name](Images/image00428.jpeg)\n\
    \nTick the checkbox that says Generate web.xml deployment descriptor.\n\n![Generate\
    \ web xml](Images/image00429.jpeg)\n\n#### Initial Project structure:\n\nUpon\
    \ creation of project, the hierarchy (project structure) would look like this:\n\
    \n![Initial Project hierarchy in Eclipse](Images/image00430.jpeg)\n\n### Step\
    \ 2: Create a Servlet class\n\nWe are creating the Http Servlet by extending `HttpServlet`\
    \ class. Right click on the `src` folder and create a new class file, name the\
    \ file as `MyServletDemo`. The file path should look like this: `Java Resources/src/default\
    \ package/MyServletDemo.java`.\n\n![New Servlet Class](Images/image00431.jpeg)\n\
    \n#### MyServletDemo.java\n\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\n\n// Extend HttpServlet class to create Http Servlet\n\
    public class MyServletDemo extends HttpServlet {\n    private String mymsg;\n\n\
    \    public void init() throws ServletException {\n        mymsg = \"Hello World!\"\
    ;\n    }\n\n    public void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n        throws ServletException, IOException {\n        // Setting\
    \ up the content type of webpage\n        response.setContentType(\"text/html\"\
    );\n        // Writing message to the web page\n        PrintWriter out = response.getWriter();\n\
    \        out.println(\"<h1>\" + mymsg + \"</h1>\");\n    }\n\n    public void\
    \ destroy() {\n        /* leaving empty for now this can be\n         * used when\
    \ we want to do something at the end\n         * of Servlet life cycle\n     \
    \    */\n    }\n}\n```\n\n### Step 3: Create an html page to call the servlet\
    \ class on a webpage\n\nWe are creating an html file that would call the servlet\
    \ once we click on the link on web page. Create this file in `WebContent` folder.\
    \ The path of the file should look like this: `WebContent/index.html`.\n\n####\
    \ index.html\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"\
    UTF-8\">\n    <title>JavaBook Servlet Demo</title>\n</head>\n<body>\n    <a href=\"\
    welcome\">Click to call Servlet</a>\n</body>\n</html>\n```\n\n#### Edit web.xml\
    \ file\n\nThis file can be found at this path `WebContent/WEB-INF/web.xml`. In\
    \ this file we will map the Servlet with the specific URL. Since we are calling\
    \ welcome page upon clicking the link on index.html page so we are mapping the\
    \ welcome page to the Servlet class we created.\n\n```xml\n<web-app>\n    <display-name>JavaBookDemo</display-name>\n\
    \    <welcome-file-list>\n        <welcome-file>index.html</welcome-file>\n  \
    \      <welcome-file>index.htm</welcome-file>\n        <welcome-file>index.jsp</welcome-file>\n\
    \        <welcome-file>default.html</welcome-file>\n        <welcome-file>default.htm</welcome-file>\n\
    \        <welcome-file>default.jsp</welcome-file>\n    </welcome-file-list>\n\
    \    <servlet>\n        <servlet-name>MyHttpServletDemo</servlet-name>\n     \
    \   <servlet-class>MyServletDemo</servlet-class>\n    </servlet>\n    <servlet-mapping>\n\
    \        <servlet-name>MyHttpServletDemo</servlet-name>\n        <url-pattern>/welcome</url-pattern>\n\
    \    </servlet-mapping>\n</web-app>\n```\n\n#### Final Project Structure\n\n![](Images/image00432.jpeg)\n\
    \n#### Run the project:\n\nRight click on the `index.html`, run on server.\n\n\
    ![Run on Apache tomcat server](Images/image00433.jpeg)\n\nClick Add All to deploy\
    \ the Project on Server. Click Finish.\n\n![Add all projects](Images/image00434.jpeg)\n\
    \n#### Output:\n\n![](Images/image00435.jpeg)\n\nUpon clicking the link you would\
    \ get this screen:\n\n![](Images/image00436.jpeg)\n"
