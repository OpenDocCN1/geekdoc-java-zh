  trans: "\n\n# 页面详情\n\nPage: 页面值为 `sample.jsp`，这意味着该页面需要被包含在当前文件中。提及的文件名表明 `sample.jsp`\
    \ 位于同一目录下。\n\nFlush: 它的值为 `false`，意味着在包含到当前页面之前，资源缓冲区尚未刷新。\n\n# JSP include 动作标签\n\
    \nJSP include 动作标签 – JSP 教程\n\nInclude 标签用于将另一个资源包含到当前 JSP 页面中。被包含的资源可以是 HTML\
    \ 静态页面、JSP 页面或 Servlet。我们还可以向要包含的资源传递参数及其值。在下面，我分享了两个 `<jsp:include>` 的示例，一个是在不传递任何参数的情况下包含页面，第二个示例是向被包含的页面传递几个参数。\n\
    \n## 语法\n\n1) 带有参数的包含。\n\n```jsp\n<jsp:include page=\"Relative_URL_Of_Page\">\n\
    \    <jsp:param ... />\n    <jsp:param ... />\n    <jsp:param ... />\n    ...\n\
    \    <jsp:param ... />\n</jsp:include>\n```\n\n2) 不共享参数的包含另一个资源。\n\n```jsp\n<jsp:include\
    \ page=\"Relative_URL_of_Page\" />\n```\n\n`Relative_URL_of_Page` 如果页面位于当前 JSP\
    \ 页面所在的目录，则应为页面名。\n\n## 示例 1: 不带参数的 <jsp:include>\n\n在此示例中，我们将使用不带参数的 `<jsp:include>`\
    \ 动作标签。结果该页面将原样包含在当前 JSP 页面中：\n\n**index.jsp**\n```jsp\n<html>\n<head>\n    <title>JSP\
    \ Include example</title>\n</head>\n<body>\n    <b>index.jsp Page</b><br>\n  \
    \  <jsp:include page=\"Page2.jsp\" />\n</body>\n</html>\n```\n\n**Page2.jsp**\n\
    ```jsp\n<b>Page2.jsp</b><br>\n<i This is the content of Page2.jsp page</i>\n```\n\
    \n**输出：**\n`Page2.jsp` 的内容已追加到 `index.jsp` 中。\n\n![](img/image00364.jpeg)\n\n\
    ## 示例 2: 使用 <jsp:param> 使用 <jsp:include>\n\n**index.jsp**\n```jsp\n我在这里使用 `<jsp:include>`\
    \ 动作标签配合 `<jsp:param>` 来向我们将要包含的页面传递参数。\n<html>\n<head>\n    <title>JSP Include\
    \ example with parameters</title>\n</head>\n<body>\n    <h2>This is index.jsp\
    \ Page</h2>\n    <jsp:include page=\"display.jsp\">\n        <jsp:param name=\"\
    userid\" value=\"Chandru\" />\n        <jsp:param name=\"password\" value=\"Chandru\"\
    \ />\n        <jsp:param name=\"name\" value=\"Chandru Babu\" />\n        <jsp:param\
    \ name=\"age\" value=\"27\" />\n    </jsp:include>\n</body>\n</html>\n```\n\n\
    **display.jsp**\n```jsp\n<html>\n<head>\n    <title>Display Page</title>\n</head>\n\
    <body>\n    <h2>Hello this is a display.jsp Page</h2>\n    UserID: <%=request.getParameter(\"\
    userid\") %><br>\n    Password is: <%=request.getParameter(\"password\") %><br>\n\
    \    User Name: <%=request.getParameter(\"name\") %><br>\n    Age: <%=request.getParameter(\"\
    age\") %>\n</body>\n</html>\n```\n\n**输出：**\n如你所示，`display.jsp` 的内容已包含在 `index.jsp`\
    \ 中。此外，我们传递的参数在包含页面中正确显示。\n\n![](img/image00365.jpeg)\n\n# 带有参数的 JSP include 动作示例\n\
    \n为了传递参数，我们需要使用 `<jsp:param>` 动作标签。\n\n## 示例\n\n在此示例中，我们使用 `<jsp:include>` 动作标签将一个\
    \ JSP 页面 (`file.jsp`) 包含主 JSP 页面 (`index.jsp`)。为了从 index 向 file 页传递参数，我们使用了 `<jsp:param>`\
    \ 动作标签。我们传递了三个参数 `firstname`、`middlename` 和 `lastname`，对于每个参数，我们需要指定对应的参数名和参数值。同样的内容可以在包含的页面中使用表达式语言或表达式标签及隐式对象来提取。\n\
    \n**index.jsp**\n```jsp\n<html>\n<head>\n    <title>JSP include with parameters\
    \ example</title>\n</head>\n<body>\n    <jsp:include page=\"file.jsp\">\n    \
    \    <jsp:param name=\"firstname\" value=\"Chandru\" />\n        <jsp:param name=\"\
    middlename\" value=\"Pratap\" />\n        <jsp:param name=\"lastname\" value=\"\
    Prasad\" />\n    </jsp:include>\n</body>\n</html>\n```\n\n**file.jsp**\n```jsp\n\
    ${param.firstname}<br>\n${param.middlename}<br>\n${param.lastname}\n```\n\n**输出：**\n\
    ![](img/image00366.jpeg)\n\n如你所示，包含的页面显示了从主页面传递的参数值。为了在 `file.jsp` 页面上显示参数，我们使用了表达式语言\
    \ `${}`。不过你也可以使用以下使用了 JSP 表达式标签和 request 隐式对象的代码：\n\n```jsp\n<%= request.getParameter(\"\
    firstname\")%>\n<%= request.getParameter(\"middlename\")%>\n<%= request.getParameter(\"\
    lastname\")%>\n```\n\n# JSP forward 动作\n\n`<jsp:forward>` 用于将请求转发到另一个资源。\n\n##\
    \ 语法\n\n```jsp\n<jsp:forward page=\"URL\">\n    <jsp:param ... />\n    <jsp:param\
    \ ... />\n</jsp:forward>\n```\n\n## 示例\n\n**first.jsp**\n```jsp\n<html>\n<head>\n\
    \    <title>JSP forward action</title>\n</head>\n<body>\n    <h1>Demo forward</h1>\n\
    \    <jsp:forward page=\"second.jsp\" />\n</body>\n</html>\n```\n\n**second.jsp**\n\
    ```jsp\n<html>\n<head>\n    <title>Second Page</title>\n</head>\n<body>\n    <h1>This\
    \ is the second page</h1>\n</body>\n</html>\n```\n\n"
- fmt: "\nAbove code directly displayed `display.jsp` page, which is displaying the\
    \ parameters passed from `index.jsp` page.\n\n![](Images/image00368.jpeg)\n\n\
    ## 3. `<jsp:param>` Action\n\nThis action is useful for passing the parameters\
    \ to Other JSP action tags such as `JSP include` & `JSP forward` tag. This way\
    \ new JSP pages can have access to those parameters using `request` object itself.\n\
    \n### Syntax\n\n```xml\n<jsp: param name=\"param_name_here\" value=\"value_of_parameter_here\"\
    \ />\n```\n\nNow considers the same above example –\n\n**first.jsp**\n\n```html\n\
    <html>\n<head>\n<title>Demo of JSP Param Action Tag</title>\n</head>\n<body>\n\
    <h3>JSP page: Demo Param along with forward</h3>\n<jsp:forward page=\"second.jsp\"\
    >\n    <jsp:param name =\"date\" value=\"20-05-2012\" />\n    <jsp:param name\
    \ =\"time\" value=\"10:15AM\" />\n    <jsp:param name =\"data\" value=\"ABC\"\
    \ />\n</jsp:forward>\n</body>\n</html>\n```\n\nIn the above example `first.jsp`\
    \ is passing three parameters (`data`, `time` & `data`) to `second.jsp` and `second.jsp`\
    \ can access these parameters using the below code –\n\n```jsp\nDate:<%= request.getParameter(\"\
    date\") %>\nTime:<%= request.getParameter(\"time\") %>\nMy Data:<%= request.getParameter(\"\
    data\") %>\n```\n\n## 4. `<jsp:useBean>` Action\n\nThis action is useful when\
    \ you want to use Beans in a JSP page, through this tag you can easily invoke\
    \ a bean.\n\n### Syntax\n\n```xml\n<jsp: useBean id=\"unique_name_to_identify_bean\"\
    \ class=\"package_name.class_name\" />\n```\n\n### Example of `<jsp:useBean>`,\
    \ `<jsp:setProperty>` & `<jsp:getProperty>`:\n\nOnce Bean class is instantiated\
    \ using above statement, you have to use `jsp:setProperty` and `jsp:getProperty`\
    \ actions to use the bean’s parameters. we will see both.\n\n### jsp:useBean,\
    \ jsp:setProperty and jsp:getProperty Action Tags\n\nHere we will see how to use\
    \ a bean class in JSP with the help of `jsp:useBean`, `jsp:setProperty` and `jsp:getProperty`\
    \ action tags.\n\n**Syntax of jsp:useBean:**\n\n```xml\n<jsp: useBean id=\"unique_name_to_identify_bean\"\
    \ class=\"package_name.class_name\" />\n```\n\n**Syntax of jsp:setProperty:**\n\
    \n```xml\n<jsp:setProperty name=\"unique_name_to_identify_bean\" property=\"property_name\"\
    \ />\n```\n\n**Syntax of jsp:getProperty:**\n\n```xml\n<jsp:getProperty name=\"\
    unique_name_to_identify_bean\" property=\"property_name\" />\n```\n\n### A complete\
    \ example of useBean, setProperty and getProperty:\n\n1) We have a bean class\
    \ `Details` where we are having three variables `username`, `age` and `password`.\
    \ In order to use the bean class and it is properties in JSP we have initialized\
    \ the class like this in the `userdetails.jsp` page –\n\n```xml\n<jsp:useBean\
    \ id=\"userinfo\" class=\"Javabook.com.Details\"></jsp:useBean>\n```\n\nWe have\
    \ used `useBean` action to initialize the class. Our class is in `Javabook.com`\
    \ package so we have given a fully qualified name `Javabook.com.Details`.\n\n\
    2) We have mapped the properties of bean class and JSP using `setProperty` action\
    \ tag. We have given `*` in the `property` field to map the values based on their\
    \ names because we have used the same property name in bean class and `index.jsp`\
    \ JSP page. In the `name` field we have given the unique identifier which we have\
    \ defined in `useBean` tag.\n\n```xml\n<jsp:setProperty property=\"*\" name=\"\
    userinfo\"/>\n```\n\n3) To get the property values we have used `getProperty`\
    \ action tag.\n\n```xml\n<jsp:getProperty property=\"propertyname\" name=\"userinfo\"\
    />\n```\n\n**Details.java**\n\n```java\npackage javabook.com;\n\npublic class\
    \ Details {\n    public Details() {\n    }\n    private String username;\n   \
    \ private int age;\n    private String password;\n\n    public String getUsername()\
    \ {\n        return username;\n    }\n\n    public void setUsername(String username)\
    \ {\n        this.username = username;\n    }\n\n    public int getAge() {\n \
    \       return age;\n    }\n\n    public void setAge(int age) {\n        this.age\
    \ = age;\n    }\n\n    public String getPassword() {\n        return password;\n\
    \    }\n\n    public void setPassword(String password) {\n        this.password\
    \ = password;\n    }\n}\n```\n\n**index.jsp**\n\n```html\n<html>\n<head><title>useBean,\
    \ getProperty and setProperty example</title></head>\n<form action=\"userdetails.jsp\"\
    \ method=\"post\">\nUser Name: <input type=\"text\" name=\"username\"><br>\nUser\
    \ Password: <input type=\"password\" name=\"password\"><br>\nUser Age: <input\
    \ type=\"text\" name=\"age\"><br>\n<input type=\"submit\" value=\"register\">\n\
    </form>\n</html>\n```\n\n**userdetails.jsp**\n\n```xml\n<jsp:useBean id=\"userinfo\"\
    \ class=\"javabook.com.Details\"></jsp:useBean>\n<jsp:setProperty property=\"\
    *\" name=\"userinfo\"/>\n```\n\nYou have enterted below details:<br>\n\n```jsp\n\
    <jsp:getProperty property=\"username\" name=\"userinfo\"/><br>\n<jsp:getProperty\
    \ property=\"password\" name=\"userinfo\"/><br>\n<jsp:getProperty property=\"\
    age\" name=\"userinfo\"/>\n```\n"
  raw: "Above code directly displayed display.jsp page, which is displaying the parameters\
    \ passed from index.jsp page.\n\n![](Images/image00368.jpeg)\n\n3. <jsp:param>\
    \ Action\n\nThis action is useful for passing the parameters to Other JSP action\
    \ tags such as JSP include & JSP forward tag. This way new JSP pages can have\
    \ access to those parameters using request object itself.\n\nSyntax:\n\n<jsp:\
    \ param name=\"param_name_here\" value=\"value_of_parameter_here\" />\n\nNow considers\
    \ the same above example –\n\nfirst.jsp\n\n<html>\n\n<head>\n\n<title>Demo of\
    \ JSP Param Action Tag</title>\n\n</head>\n\n<body>\n\n<h3>JSP page: Demo Param\
    \ along with forward</h3>\n\n<jsp:forward page=\"second.jsp\">\n\n    <jsp:param\
    \ name =\"date\" value=\"20-05-2012\" />\n\n    <jsp:param name =\"time\" value=\"\
    10:15AM\" />\n\n    <jsp:param name =\"data\" value=\"ABC\" />\n\n</jsp:forward>\n\
    \n</body>\n\n</html>\n\nIn the above example first.jsp is passing three parameters\
    \ (data, time & data) to second.jsp and second.jsp can access these parameters\
    \ using the below code –\n\nDate:<%= request.getParameter(\"date\") %>\n\nTime:<%=\
    \ request.getParameter(\"time\") %>\n\nMy Data:<%= request.getParameter(\"data\"\
    ) %>\n\n4. <jsp:useBean> Action\n\nThis action is useful when you want to use\
    \ Beans in a JSP page, through this tag you can easily invoke a bean.\n\nSyntax:\n\
    \n<jsp: useBean id=\"unique_name_to_identify_bean\"  class=\"package_name.class_name\"\
    \ />\n\nExample of <jsp:useBean>, <jsp:setProperty> & <jsp:getProperty>:\n\nOnce\
    \ Bean class is instantiated using above statement, you have to use jsp:setProperty\
    \ and jsp:getProperty actions to use the bean’s parameters. we will see both.\n\
    \njsp:useBean, jsp:setProperty and jsp:getProperty Action Tags\n\njsp:useBean,\
    \ jsp:setProperty and jsp:getProperty Action Tags\n\nHere we will see how to use\
    \ a bean class in JSP with the help of jsp:useBean, jsp:setProperty and jsp:getProperty\
    \ action tags.\n\nSyntax of jsp:useBean:\n\n<jsp: useBean  id=\"unique_name_to_identify_bean\"\
    \n\nclass=\"package_name.class_name\"  />\n\nSyntax of jsp:setProperty:\n\n<jsp:setProperty\
    \  name=\"unique_name_to_identify_bean\"\n\nproperty=\"property_name\"  />\n\n\
    Syntax of jsp:getProperty:\n\n<jsp:getProperty  name=\"unique_name_to_identify_bean\"\
    \n\nproperty=\"property_name\"  />\n\nA complete example of useBean, setProperty\
    \ and getProperty:\n\n1) We have a bean class Details where we are having three\
    \ variables username, age and password. In order to use the bean class and it\
    \ is properties in JSP we have initialized the class like this in the userdetails.jsp\
    \ page –\n\n<jsp:useBean  id=\"userinfo\"  class=\"Javabook.com.Details\"></jsp:useBean>\n\
    \nWe have used useBean action to initialize the class. Our class is in Javabook.com\
    \ package so we have given a fully qualified name Javabook.com.Details.\n\n2)\
    \ We have mapped the properties of bean class and JSP using setProperty action\
    \ tag. We have given ‘*’ in the property field to map the values based on their\
    \ names because we have used the same property name in bean class and index.jsp\
    \ JSP page. In the name field we have given the unique identifier which we have\
    \ defined in useBean tag.\n\n<jsp:setProperty  property=\"*\"  name=\"userinfo\"\
    />\n\n3) To get the property values we have used getProperty action tag.\n\n<jsp:getProperty\
    \  property=\"propertyname\"  name=\"userinfo\"/>\n\nDetails.java\n\npackage javabook.com;\n\
    \npublic  class  Details {\n\npublic  Details() {\n\n    }\n\n private  String\
    \ username;\n\n private  int age;\n\n private  String password;\n\npublic  String\
    \ getUsername() {\n\nreturn username;\n\n}\n\npublic  void setUsername(String\
    \ username) {\n\nthis.username = username;\n\n}\n\npublic  int getAge() {\n\n\
    return age;\n\n}\n\npublic  void setAge(int age) {\n\nthis.age = age;\n\n}\n\n\
    public  String getPassword() {\n\nreturn password;\n\n}\n\npublic  void setPassword(String\
    \ password) {\n\nthis.password = password;\n\n}\n\n}\n\nindex.jsp\n\n<html>\n\n\
    <head><title>\n\nuseBean, getProperty and setProperty example\n\n</title></head>\n\
    \n<form  action=\"userdetails.jsp\"  method=\"post\">\n\nUser Name: <input  type=\"\
    text\"  name=\"username\"><br>\n\nUser Password: <input  type=\"password\"  name=\"\
    password\"><br>\n\nUser Age: <input  type=\"text\"  name=\"age\"><br>\n\n<input\
    \  type=\"submit\"  value=\"register\">\n\n</form>\n\n</html>\n\nuserdetails.jsp\n\
    \n<jsp:useBean  id=\"userinfo\"  class=\"javabook.com.Details\"></jsp:useBean>\n\
    \n<jsp:setProperty  property=\"*\"  name=\"userinfo\"/>\n\nYou have enterted below\
    \ details:<br>\n\n<jsp:getProperty  property=\"username\"  name=\"userinfo\"/><br>\n\
    \n<jsp:getProperty  property=\"password\"  name=\"userinfo\"/><br>\n\n<jsp:getProperty\
    \  property=\"age\"  name=\"userinfo\"  /><br>\n\nOutput:\n\n![](Images/image00369.jpeg)\n\
    \n![](Images/image00370.jpeg)\n\nNote:\n\nGo back from here:\n\n[Expression language\
    \ (EL) in JSP](#part0000.xhtml_EXPRESSIONLNG)\n\nEXPRESSION\n\nExpressions Tag\n\
    \nExpression tag – Mainly used for display the content on the browser by sending\
    \ back the result to the client through response object.\n\nJSP Expression Tag\
    \ – JSP Tutorial\n\nExpression Tag evaluate the expression placed in it, converts\
    \ the result into String and send the result back to the client through  [response\
    \ object.](#part0000.xhtml_RESPONSE)  Basically it writes the result to the client\
    \ (browser).\n\nSyntax:\n\n<%= expression %>\n\nJSP expression tag Examples\n\n\
    Example 1: Expression of values\n\nHere we are simply passing the expression of\
    \ values inside expression tag.\n\n<html>\n\n <head>\n\n <title>JSP expression\
    \ tag example1</title>\n\n </head>\n\n <body>\n\n<%= 2+4*5 %>\n\n </body>\n\n\
     </html>\n\nOutput:\n\n![expression-tag-example1](Images/image00371.jpeg)\n\n\
    Example 2: Expression of variables\n\nIn this example we have initialized few\
    \ variables and passed the expression of variables in the expression tag for result\
    \ evaluation.\n\n<html>\n\n<head>\n\n <title>JSP expression tag example2</title>\n\
    \n</head>\n\n<body>\n\n  <%\n\n int a=10;\n\n int b=20;\n\n int c=30;\n\n  %>\n\
    \n  <%= a+b+c %>\n\n</body>\n\n</html>\n\nOutput:\n\n![expression-tag-example2](Images/image00372.jpeg)\n\
    \nExample 3: String and implicit object output\n\nIn this example we are setting\
    \ up an attribute using [application implicit object](#part0000.xhtml_APPLICATION)\
    \ and then displaying that attribute and a simple string on another JSP page using\
    \ expression tag.\n\nindex.jsp\n\n<html>\n\n<head>\n\n<title> JSP expression tag\
    \ example3 </title>\n\n</head>\n\n<body>\n\n  <% application.setAttribute(\"MyName\"\
    , \"Chandru\"); %>\n\n <a  href=\"display.jsp\">Click here for display</a>\n\n\
    </body>\n\n</html>\n\ndisplay.jsp\n\n<html>\n\n<head>\n\n<title>Display Page</title>\n\
    \n</head>\n\n<body>\n\n <%=\"This is a String\" %><br>\n\n <%= application.getAttribute(\"\
    MyName\") %>\n\n</body>\n\n</html>\n\nOutput:\n\n![](Images/image00373.jpeg)\n\
    \n![](Images/image00374.jpeg)\n\nNOTE:\n\nGO BACK FROM HERE:\n\n[JSP include action\
    \ with parameter example](#part0000.xhtml_INCLUDEACTION)\n\n[Declarations](#part0000.xhtml_DECLARATION)\n\
    \nDECLARATIONS\n\nDeclarations\n\nDeclaration tag – Learn how to declare variables\
    \ and methods in JSP.\n\nJSP Declaration tag – JSP Tutorial\n\nDeclaration tag\
    \ is a block of java code for declaring class wide variables, methods and classes.\
    \ Whatever placed inside these tags gets initialized during JSP initialization\
    \ phase and has class scope. JSP container keeps this code outside of the service\
    \ method (_jspService()) to make them class level variables and methods.\n\nAs\
    \ we know that variables can be initialized using [scriptlet](#part0000.xhtml_SCRIPTLET)\
    \ too but those declaration being placed inside _jspService() method which doesn’t\
    \ make them class wide declarations. On the other side, declaration tag can be\
    \ used for defining class level variables, methods and classes.\n\nSyntax:\n\n\
    <%!  Declaration %>\n\nExample 1: Variables declaration\n\nIn this example we\
    \ have declared two variables inside declaration tag and displayed them on client\
    \ using [expression tag.](#part0000.xhtml_EXPRESSIONTAG)\n\n<html>\n\n<head>\n\
    \n <title>Declaration tag Example1</title>\n\n</head>\n\n<body>\n\n<%! String\
    \ name=\"Chandru\"; %>\n\n<%! int age=27; %>\n\n<%= \"Name is: \"+ name %><br>\n\
    \n<%= \"AGE: \"+ age %>\n\n</body>\n\n</html>\n\nOutput:\n\n![](Images/image00375.jpeg)\n\
    \nExample 2: Methods declaration\n\nIn this example we have declared a method\
    \ sum using JSP declaration tag.\n\n<html>\n\n<head>"
