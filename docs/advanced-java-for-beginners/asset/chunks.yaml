  trans: "\n\n# 方法声明\n\n```html\n<title>方法声明</title>\n<body>\n <%!\n int sum(int num1,\
    \ int num2, int num3){\n return num1+num2+num3;\n }\n%>\n<%= \"Result is: \" +\
    \ sum(10,40,50) %>\n</body>\n```\n\n输出：浏览器上显示所有三个整数的和。\nResult is: 100\n\n# JSP\
    \ 隐式对象\n\n这些对象是由 JSP 容器在将 JSP 页面转换为 Servlet 时创建的。这些对象存在于方法内部，因此我们可以直接使用它们而无需进行声明。\n\
    \n这些对象是 JSP 引擎在翻译阶段（将 JSP 转换为 Servlet 时）创建的。它们在服务方法内部创建，因此我们可以直接在脚本段中使用它们，而无需初始化和声明。JSP\
    \ 中总共有 9 个隐式对象可用。\n\n### 隐式对象及其对应的类\n\n| 对象 | 类 |\n| :--- | :--- |\n| `Out` |\
    \ `javax.servlet.jsp.JspWriter` |\n| `request` | `javax.servlet.http.HttpServletRequest`\
    \ |\n| `Response` | `javax.servlet.http.HttpServletResponse` |\n| `Session` |\
    \ `javax.servlet.http.HttpSession` |\n| `Application` | `javax.servlet.ServletContext`\
    \ |\n| `Exception` | `javax.servlet.jsp.JspException` |\n| `Page` | `java.lang.Object`\
    \ |\n| `pageContext` | `javax.servlet.jsp.PageContext` |\n| `Config` | `javax.servlet.ServletConfig`\
    \ |\n\n注意：从此处返回\n\n## JSP 中的表达式语言 (EL)\n\n# OUT 隐式对象\n\n带有示例的 JSP 中的 OUT 隐式对象\n\
    它是 `javax.servlet.jsp.JspWriter` 的实例。这允许我们访问 Servlet 输出流。需要发送到客户端（浏览器）的输出通过此对象进行传递。简单来说，`out`\
    \ 隐式对象用于向客户端写入内容。\n\n### OUT 隐式对象的方法\n\n1. `void print()`\n2. `void println()`\n\
    3. `void newLine()`\n4. `void clear()`\n5. `void clearBuffer()`\n6. `void flush()`\n\
    7. `boolean isAutoFlush()`\n8. `int getBufferSize()`\n9. `int getRemaining()`\n\
    \n让我们详细查看 `out` 的每个方法 –\n\n1. `Void print()`：此方法写入传递给它的值。例如，下面的语句将在输出屏幕（客户端浏览器）显示\
    \ `Out Implicit Object in jSP - JavaBook` 句子。\n```java\nout.print(\"Out Implicit\
    \ Object in jSP - JavaBook\");\n```\n\n2. `Void println()`：此方法与 `print()` 方法类似，`print`\
    \ 和 `println` 唯一的区别是 `println()` 方法在末尾添加了一个换行符。让我们通过示例来看它们的区别。\n\nPrint:\n```java\n\
    out.print(\"hi\");\nout.print(\" \");\nout.print(\"hello\");\n```\n浏览器上的输出：所有三个\
    \ `out.print` 语句的结果之间不会有换行。\n`hi hello`\n\nprintln:\n```java\nout.println(\"hi\"\
    );\nout.println(\"hello\");\n```\n浏览器上的输出：\nhi\nhello\n\n3. `Void newLine()`：此方法在输出中添加一个换行。示例\
    \ –\n```java\nout.print(\"This will write content without a new line\");\nout.newLine();\n\
    out.print(\"I’m just an another print statement\");\n```\n输出：\nThis will write\
    \ content without a new line\nI’m just an another print statement\n\n如你所知 `print`\
    \ 语句不会添加换行。我们使用 `newLine()` 方法在两个 `out.print` 语句之间添加了换行。\n\n4. `Void clear()`：它清空输出缓冲区，甚至不让其缓冲区内容写入客户端。调用方式如下\
    \ –\n```java\nout.clear();\n```\n\n5. `Void clearBuffer()`：此方法与 `clear()` 方法类似。它们唯一的区别是，当对已经刷新的缓冲区调用\
    \ `out.clear()` 时它会抛出异常，但 `out.clearBuffer()` 则不会。\n\n6. `Void flush()`：此方法也像\
    \ `clear()` 方法一样清空缓冲区，但它强制在刷新之前将内容写入输出流，这意味着缓冲区中的任何内容在清空缓冲区之前都会被到客户端屏幕。\n\n7.\
    \ `Boolean isAutoFlush()`：它返回一个布尔值 true/false。它用于检查缓冲区是否自动刷新。\n\n8. `Int getBufferSize()`：此方法返回输出缓冲区的大小（字节为）。\n\
    \n9. `Int getRemaining()`：它返回在达到缓冲区溢出条件之前剩余的字节数。\n\n### OUT 隐式对象示例\n\n在这个示例中，我们使用\
    \ `OUT` 的 `print` 和 `println` 方法向客户端显示一些消息。\n\n**index.jsp**\n```html\n<HTML>\n\
    <HEAD>\n<TITLE> OUT 隐式对象示例 </TITLE>\n</HEAD>\n<BODY>\n<%\nout.print( \"print statement\
    \ \" );\nout.println( \"println\" );\nout.print(\"Another print statement\");\n\
    %>\n</BODY>\n</HTML>\n```\n输出：\nprintstatement println\nAnother print statement\n\
    \n# 带有示例的 JSP 中的 request 隐式对象\n\n### request 隐式对象的方法\n\n1. `GetParameter(String\
    \ name)` – 此方法用于获取参数值。例如，在登录页面获取 `user-id` 和密码，一旦重定向到 JSP 页面，通过它可以获取信息。\n```java\n\
    String Uid= request.getParameter(\"user-id\");\nString Pass= request.getParameter(\"\
    password\");\n```\n\n2. `ParameterNames()` – 它返回请求关联的所有参数名称的枚举。\n```java\nEnumeration\
    \ e= request.getParameterNames();\n```\n\n3. `ParameterValues(String name)` –\
    \ 它返回参数值的数组。\n```java\nString[] passwords = request.getParameterValues(\"password\"\
    );\n```\n\n4. `GetAttribute(String name)` – 获取属性值。\n```java\nrequest.getAttribute(\"\
    admin\")\n```\n\n5. `GetAttributeNames()` – 用于获取会话中的属性。它返回会话中的属性名称。\n```java\n\
    Enumerator e = request.getAttributeNames();\n```\n\n6. `SetAttribute(String,Object)`\
    \ – 将对象的值赋予属性。例如，有一个 `password` 和字符串 `str`，调用 `request.setAttribute(\"password\"\
    , str)` 将为属性赋值。\n\n7. `RemoveAttribute(String)` – 使用此方法可以移除属性且无法再次使用。例如，如果在 JSP\
    \ 页面执行 `request.removeAttribute(\"userid\")`，则该属性将被移除，`request.getAttribute(\"\
    userid\")` 将返回 NULL。\n\n8. `GetCookies()` – 它返回从客户端接收的 cookie 对象数组。此方法主要在 JSP\
    \ 中处理 cookie 时使用。\n\n9. `GetHeader(String name)` – 此方法用于获取请求的头部信息。\n\n10. `HeaderNames()`\
    \ – 返回所有头部名称。下面的代码段将显示与请求关联的所有头部。\n```java\nEnumeration e = request.getHeaderNames();\n\
    while (e.hasMoreElements()) {\n String str = (String)e.nextElement();\n out.println(str);\n\
    }\n```\n\n11. `RequestURI()` – 此方法 (`request.getRequestURI()`) 返回当前 JSP 页面的 URL。\n\
    \n12. `Method()` – 返回 HTTP 请求方法。`request.getMethod()`。例如，GET 请求返回 GET，POST 请求返回\
    \ POST。\n\n13. `QueryString()` – 用于获取与 JSP 页面关联的查询字符串。它是问号 (?) 之后的字符串。\n\n###\
    \ request 隐式对象示例\n\n在下面的示例中，我们在 index.html 页面接收用户输入，并使用 request 隐式对象在 userinfo.jsp\
    \ 页面显示相同的信息。\n\n**index.html**\n```html\n<html>\n<head>\n<title>输入用户名和密码</title>\n\
    </head>\n<body>\n<form action=\"userinfo.jsp\">\n输入用户名：<input type=\"text\" name=\"\
    uname\" /> <br><br>\n输入密码：<input type=\"text\" name=\"pass\" /> <br><br>\n<input\
    \ type=\"submit\" value=\"提交详情\"/>\n</form>\n</body>\n</html>\n```\n\n**userinfo.jsp**\n\
    ```jsp\n<%@ page import = \" java.util.*\" %>\n<html>\n<body>\n<%\nString username=request.getParameter(\"\
    uname\");\n%>\n</body>\n</html>\n```\n\n"
- fmt: "\n```java\nString password=request.getParameter(\"pass\");\n\nout.print(\"\
    Name: \"+username+\" Password: \"+password);\n\n%>\n\n</body>\n\n</html>\n```\n\
    \n### Snapshots of above example\n\nOnce you run the above JSP code. It would\
    \ show you the below screen with two text fields of `username` and `password`.\n\
    \n![](Images/image00376.jpeg)\n\nThis is the output of `userinfo.jsp` page. Here\
    \ we have fetched the `id` and `password` which has been entered by the user in\
    \ login page.\n\n![](Images/image00377.jpeg)\n\nNOTE:\n\nGO BACK FROM HERE:\n\n\
    [JSP include action with parameter example](#part0000.xhtml_INCLUDEACTION)\n\n\
    ### Response Implicit Object in JSP\nResponse Implicit Object in JSP with examples\n\
    \nHere we are going to discuss about `response` implicit object in JSP. It is\
    \ an instance of `javax.servlet.http.HttpServletRequest` and mainly used for modifying\
    \ the response which is being sent to the browser after processing the client’s\
    \ request.\n\n#### Methods of response Implicit Object\n\n1) `void setContentType(String\
    \ type)`\n2) `void sendRedirect(String address)`\n3) `void addHeader(String name,\
    \ String value)`\n4) `void setHeader(String name, String value)`\n5) `boolean\
    \ containsHeader(String name)`\n6) `void addCookie(Cookie value)`\n7) `void sendError(int\
    \ status_code, String message)`\n8) `boolean isCommitted()`\n9) `void setStatus(int\
    \ statuscode)`\n\nLet us see each method in detail –\n\n1. `Void setContentType(String\
    \ type)` – This method tells browser, the type of response data by setting up\
    \ the MIME type and character encoding. The information sets by this method helps\
    \ browser to interpret the response. Example –\n\n```\nresponse.setContentType(\"\
    text/html\");\nresponse.setContentType(\"image/gif\");\nresponse.setContentType(\"\
    image/png\");\nresponse.setContentType(\"application/pdf\");\n```\n\n2. `Void\
    \ sendRedirect(String address)` – It redirects the control to a new JSP page.\
    \ For e.g. When the browser would detect the below statement, it would be redirected\
    \ to the `javabook.com` from the current JSP page.\n\n```\nresponse.sendRedirect(\"\
    http://javabook.com\");\n```\n\n3. `Void addHeader(String name, String value)`\
    \ – `addHeader` method adds a header to the response, basically it includes a\
    \ header name and it’s value. For example – The below statement will include a\
    \ header “Site” in the response with value `javaBook.com`.\n\n```\nresponse.addHeader(\"\
    Site\", \"JavaBook.com\");\n```\n\n4. `Void setHeader(String name, String value)`\
    \ – It sets the header value. This method overrides the current value of header\
    \ with the new value. Let’s say I’m modifying the value of Header “Site“. The\
    \ below statement would modify the current value `javaBook.com` to a new value\
    \ `AA.com`.\n\n```\nresponse.setHeader(\"Site\", \"AA.com\");\n```\n\n5. `Boolean\
    \ containsHeader(String name)` – It returns a Boolean value true/false. It basically\
    \ checks the whether the header is present in the response or not. For example\
    \ – Above, in the `addHeader` method example we have added a `Site` Header in\
    \ response so the below statement would return true.\n\n```\nresponse.containsHeader(\"\
    Site\");\n```\n\n6. `Void addCookie(Cookie cookie)` – This method adds a cookie\
    \ to the response. The below statements would add 2 Cookies `Author` and `Siteinfo`\
    \ to the response.\n\n```\nresponse.addCookie(Cookie Author);\nresponse.addCookie(Cookie\
    \ Siteinfo);\n```\n\n7. `Void sendError(int status_code, String message)` – It\
    \ is used to send error response with a code and an error message. For example\
    \ –\n\n```\nresponse.sendError(404, \"Page not found error\");\n```\n\n8. `Boolean\
    \ isCommitted()` - It checks whether the Http Response has been sent to the client,\
    \ if yes then it returns true else it gives false.\n\n```jsp\n<% if(response.isCommited())\n\
    \    {\n        <%--do something --%>\n    }else\n    {\n        <%--do something\
    \ else --%>\n    } %>\n```\n\n9. `Void setStatus(int statuscode)` – This method\
    \ is used to set the HTTP status to a given value. For e.g. the below statement\
    \ would set HTTP response code to 404 (Page not found).\n\n```\nresponse.setStatus(404);\n\
    ```\n\n### Response Implicit Object Example\n\nIn the below example we are receiving\
    \ `id` and `password` from login page and then we are matching them with hardcoded\
    \ correct id/pass. If the credentials are correct the sign-in page redirects to\
    \ success page else it redirects to sign-in fail JSP page.\n\n**index.html**\n\
    ```html\n<html>\n<head>\n<title>Login Page</title>\n</head>\n<body>\n<form action=\"\
    checkdetails.jsp\">\nUserId: <input type=\"text\" name=\"id\" /> <br><br>\nPassword:\
    \ <input type=\"text\" name=\"pass\" /> <br><br>\n<input type=\"submit\" value=\"\
    Sign In!!\"/>\n</form>\n</body>\n</html>\n```\n\nThis JSP page verifies the input\
    \ id/pass against hard-coded values.\n\n**checkdetails.jsp**\n```html\n<html>\n\
