    # Application Implicit Object

    ## Application Implicit Object in JSP with examples

    Application implicit object is an instance of `javax.servlet.ServletContext`.
    It is basically used for getting initialization parameters and for sharing the
    attributes & their values across the entire JSP application, which means any attribute
    set by `application` implicit object would be available to all the JSP pages.


    ### Methods:

    - `Object getAttribute(String attributeName)`

    - `void setAttribute(String attributeName, Object object)`

    - `void removeAttribute(String objectName)`

    - `Enumeration getAttributeNames()`

    - `String getInitParameter(String paramname)`

    - `Enumeration getInitParameterNames()`

    - `String getRealPath(String value)`

    - `void log(String message)`

    - `URL getResource(String value)`

    - `InputStream getResourceAsStream(String path)`

    - `String getServerInfo()`

    - `String getMajorVersion()`

    - `String getMinorVersion()`


    1. `Object getAttribute(String attributeName)`: It returns the object stored in
    a given attribute name. For example the below statement would return the object
    stored in attribute `MyAttr`.

    ```java

    String s = (String)application.getAttribute("MyAttr");

    ```

    2. `Void setAttribute(String attributeName, Object object)`: It sets the value
    of an attribute or in other words it stores an attribute and its value in application
    context, which is available to use across JSP application. Example –

    ```java

    application.setAttribute("MyAttribute", "This is the value of Attribute");

    ```

    The above statement would have stored the attribute and its value. What would
    be the value of `s` if we use the below statement in any of the JSP page?

    ```java

    String s= (String) application.getAttribute("MyAttribute");

    ```

    `s` value would be “This is the value of Attribute” since we have set it using
    `setAttribute` method.

    3. `Void removeAttribute(String objectName)`: This method is used for removing
    the given attribute from the application. For e.g. – It would remove the Attribute
    `MyAttr` from the application. If we try to get the value of a removed attribute
    using `getAttribute` method, it would return Null.

    ```java

    application.removeAttribute("MyAttr");

    ```

    4. `Enumeration getAttributeNames()`: This method returns the enumeration of all
    the attribute names stored in the application implicit object.

    ```java

    Enumeration e= application.getAttributeNames();

    ```

    5. `String getInitParameter(String paramname)`: It returns the value of Initialization
    parameter for a given name. Example – web.xml

    ```xml

    <web-app>

    <context-param>

    <param-name>parameter1</param-name>

    <param-value>ValueOf1</param-value>

    </context-param>

    </web-app>

    ```

    ```java

    String s= application.getInitParameter("parameter1");

    ```

    `s` value would be “ValueOf1”.

    6. `Enumeration getInitParameterNames()`: This method returns the enumeration
    of all the initialization parameters.

    7. `String getRealPath(String value)`: It converts a given path to an absolute
    path.

    ```java

    String abspath = application.getRealPath("/index");

    ```

    8. `void log(String message)`: This method writes the given message to the error
    log.

    ```java

    application.log("This is error message");

    ```

    9. `String getServerInfo()`: This method returns the name and version of the web
    server.

    ```java

    application.getServerInfo();

    ```


    ### Application Implicit Object Example

    Application Implicit Object in JSP with examples

    Application Implicit Object using application implicit object. In this example
    we are counting number of hits.


    counter.jsp

    ```jsp

    <%@ page import="java.io.*,java.util.*" %>

    <html>

    <head>

    <title>Application Implicit Object</title>

    </head>

    <body>

    <%

    Integer counter= (Integer)application.getAttribute("Visits");

    if( counter ==null || counter == 0 ){

    counter = 1;

    }else{

    counter = counter+ 1;

    }

    application.setAttribute("Visits", counter);

    %>

    <h3>Total number of hits this Page is: <%= counter%></h3>

    </body>

    </html>

    ```

