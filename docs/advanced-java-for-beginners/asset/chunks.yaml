  trans: "\n\n## 第 4 ：调用 `service()` 方法\n\n每当 Web 服务器接收到对 `servlet` 的请求时，都会创建一个新线程来调用\
    \ `service()` 方法。如果 servlet 是 `GenericServlet`，则请求由 `service()` 方法本身处理；如果 servlet\
    \ 是 `HttpServlet`，则 `service()` 方法将接收请求并根据请求类型将其分发到正确的处理器方法。\n\n例如，如果是一个 Get 请求，`service()`\
    \ 方法将通过调用带有请求参数的 `doGet()` 方法将请求分发到 `doGet()` 方法。同样，`Post`、`Head`、`Put` 等请求也会由\
    \ servlet 的 `service()` 方法分发到相应的处理器 `doPost()`、`doHead()`、`doPut()` 等。\n\n#![](img/image00451.jpeg)\n\
    \n注意：与仅调用一次的 `init()` 和 `destroy()` 不同，`service()` 方法在 servlet 的生命周期内可以被多次调用。只要\
    \ servlet 不被销毁，每个客户端请求都会调用 `service()` 方法。\n\n在生命周期中的所有 5 个步骤中，这是唯一一个执行多次的步骤。\n\
    \n## 第 5 ：调用 `destroy()` 方法\n\n当 servlet 容器关闭（这通常发生在我们停止 Web 服务器时），它会卸载所有 servlet\
    \ 并对每个初始化的 servlet 调用 `destroy()` 方法。\n\n注意：\n\n从此处返回：\n\nServlet 接口\n\n# Servlet\
    \ 的工作\n\n在我开始解释 servlet 如何工作之前，让我们先熟悉这三个术语。\n\n-   **Web 服务器 (Web Server)**：它可以处理由客户端发送的\
    \ HTTP 请求，并用 HTTP 响应响应请求。\n-   **Web 应用 (webapp)**：在本指南中我将其称为 `webapp`。基本上，项目就是你的\
    \ Web 应用，它是 servlet 的集合。\n-   **Web 容器 (Web Container)**：也称为 Servlet 容器和 Servlet\
    \ 引擎。它是 Web 服务器的一部分，与 Servlet 交互。它是管理 servlet 生命周期的 Web 服务器主要组件。\n\n# 你会发现本指南的某些已经在\
    \ servlet 生命周期指南中涵盖了，但本指南侧重于 servlet 应用（webapp）的工作原理，而不是生命周期的步骤。我强烈建议你阅读这里，以深入了解\
    \ servlet 实际上是如何工作的。\n\n## Servlet 如何工作？\n\n1) 当 Web 服务器（例如 Apache Tomcat）启动时，servlet\
    \ 容器会部署并加载所有 servlet。在此步骤中，servlet 容器会创建 `ServletContext` 对象。`ServletContext`\
    \ 是一个接口，定义了 servlet 用于与 servlet 容器通信的一组方法。\n\n注意：每个 webapp 只有一个 `ServletContext`，所有\
    \ servlet 共享它。`ServletContext` 有几个实用的方法，如 `addListener()`、`addFilter()` 等。目前我不会解释它们，因为我将在关于\
    \ `ServletContext` 的单独正文中介绍它们。\n\n2) 一旦 servlet 加载，servlet 容器就会创建 servlet 类的实例。对于每个实例化的\
    \ servlet，都会调用其 `init()` 方法。\n\n3) 客户端（用户浏览器）向特定端口的 Web 服务器发送 HTTP 请求。每当 Web 服务器接收到请求时，servlet\
    \ 容器就会创建 `HttpServletRequest` 和 HttpServletResponse` 对象。`HttpServletRequest` 对象提供了访问请求信息，`HttpServletResponse`\
    \ 对象允许我们在向客户端发送之前格式化并更改 http 响应。\n\nservlet 容器为每个客户端请求创建一个新线程并调用 `service()` 方法。`service()`\
    \ 方法根据请求类型将请求分发到正确的处理器方法。\n\n例如，如果服务器接收到 Get 请求，`service()` 方法将通过调用带有请求参数的 `doGet()`\
    \ 方法将请求分发到 `doGet()` 方法。同样，`Post`、`Head`、`Put` 等请求也会由 servlet 的 `service()` 方法分发到相应的处理器\
    \ `doPost()`、`doHead()`、`doPut()` 等。\n\n#![](img/image00452.jpeg)\n\n# 4) 当 servlet\
    \ 容器关闭时，它会卸载所有 servlet 并对每个初始化的 servlet 调用 `destroy()` 方法。\n\n 项目 web.xml 文件中的\
    \ welcome-file-list 标签\n\n你是否曾在 `web.xml` 文件中见过 `<welcome-file-list>` 标签并好奇它是什么？在本文中我将解释这个标签是什么以及我们为什么要使用它。\n\
    \n`<welcome-file-list>` 标签用于指定当你在浏览器上加载项目时未指定文件名，服务器默认需要调用的文件。\n\n例如，你创建了一个名为“MyServletProject”的项目，并在项目里定义了几个\
    \ html 页面和 servlet 类。但在浏览器中，你提供的 URL 如下：\n\n`http://localhost:8080/MyServletProject`\n\
    \n通常我们会提供这样的完整路径：`http://localhost:8080/MyServletProject/index.html`。但如果你提供了上面的路径，Web\
    \ 服务器将会在你的项目 `web.xml` 文件中查找 `<welcome-file-list>` 标签。假设你的 `web.xml` 文件有以下内容：\n\
    \n```xml\n<web-app>\n  ....\n  <welcome-file-list>\n    <welcome-file>myhome.htm</welcome-file>\n\
    \    <welcome-file>myindex.htm</welcome-file>\n    <welcome-file>mydefaultpage.htm</welcome-file>\n\
    \  </welcome-file-list>\n  ....\n</web-app>\n```\n\n根据 `web.xml` 文件中的内容，服务器会查找\
    \ `myhome.htm`，如果不存在则查找 `myindex.htm`，最后是查找 `mydefaultpage.htm`。\n\n注意：如果 `web.xml`\
    \ 文件中没有定义 `<welcome-file-list>` 标签，服务器将按照以下顺序查找：\n\n1) index.html\n2) index.htm\n\
    3) index.jsp\n\n# web.xml 文件中的 load-on-startup 标签\n\n默认情况下，Servlet 在接收到请求之前不会加载。这可能会导致访问\
    \ servlet 延迟。为了避免访问延迟，你可以在 `web.xml` 文件中使用 `<load-on-startup>` 标签，强制 servlet 容器在服务器启动时立即加载\
    \ servlet（实例化并调用 `init()`）。\n\n### 如何使用 <load-on-startup>?\n\n这是一个示例 web.xml：\n\
    \n```xml\n<web-app>\n  <servlet>\n    <servlet-name>MyServlet</servlet-name>\n\
    \    <servlet-class>com.Javabook.DemoServlet</servlet-class>\n    <load-on-startup>1</load-on-startup>\n\
    \  </servlet>\n</web-app>\n```\n\n如果我没有指定 `<load-on-startup>`，Web 容器在请求之前不会加载\
    \ servlet。由于我指定了值 `>=0`，它将在启动时加载。\n\n注意：值 `>=0` 意味着 servlet 在 webapp 部署或服务器启动时加载；如果值为\
    \ `<0`，则 servlet 在容器想要的时候加载。\n\n### 如何使用 <load-on-startup> 标签指定 servlet 的加载顺序？\n\
    \n```xml\n<web-app>\n  …\n  <servlet>\n    <servlet-name>MyServlet1</servlet-name>\n\
    \    <servlet-class>com.Javabook.DemoServlet1</servlet-class>\n    <load-on-startup>5</load-on-startup>\n\
    \  </servlet>\n  <servlet>\n    <servlet-name>MyServlet2</servlet-name>\n    <servlet-class>com.Javabook.DemoServlet2</servlet-class>\n\
    \    <load-on-startup>0</load-on-startup>\n  </servlet>\n  <servlet>\n    <servlet-name>MyServlet3</servlet-name>\n\
    \    <servlet-class>com.Javabook.DemoServlet3</servlet-class>\n    <load-on-startup>-2</load-on-startup>\n\
    \  </servlet>\n  …\n</web-app>\n```\n\n在这个示例中，我们在 `web.xml` 中指定了三个 servlet，由于\
    \ servlet 类 `DemoServlet1` 和 `DemoServlet2` 的 `load-on-startup` 值为 `>=0`，它们都会在服务器启动时被加载。然而，由于\
    \ `DemoServlet2` 的值较小，它将在 `DemoServlet1` 类之前被加载。\n\nservlet 类 `DemoServlet3` 因为具有负的\
    \ `load-on-startup` 值，不会在启动时加载。\n\n"
- fmt: "\nWhen a client sends a request to the web server, the servlet container creates\
    \ `ServletRequest` & `ServletResponse` objects and passes them as an argument\
    \ to the servlet’s `service()` method. The request object provides the access\
    \ to the request information such as header and body information of request data.\n\
    \nFirst we will see an example and then we will see the list of methods available\
    \ in the `ServletRequest` interface:\n\n### Example 1: `ServletRequest` `getParameter()`\
    \ method to display the user input\n\nIn this example I am demonstrating the use\
    \ of `getParameter()` method that returns the value of the given parameter.\n\n\
    In this html form, we are taking user input (name and age) and storing them in\
    \ the parameters `uname` and `uage` respectively.\n\nindex.html\n```html\n<form\
    \ action=\"details\" method=\"get\">\nUser Name: <input type=\"text\" name=\"\
    uname\"><br>\nUser Age: <input type=\"text\" name=\"uage\"><br>\n <input type=\"\
    submit\" value=\"submit\">\n</form>\n```\n\nMyServletDemo.java\nIn this servlet\
    \ class we are getting the value of the parameters by using `getParameter()` method,\
    \ this method belongs to the `ServletRequest` interface. In this example we have\
    \ `HttpServletRequest` as a parameter of `doGet()` method, `HttpServletRequest`\
    \ extends `ServletRequest` interface thats why the `getParameter()` method is\
    \ available to the `req` object.\n\nAfter getting the values, we are writing them\
    \ on the webpage.\n\n```java\nimport javax.servlet.http.*;\nimport javax.servlet.*;\n\
    import java.io.*;\n\npublic class MyServletDemo extends HttpServlet {\n    public\
    \ void doGet(HttpServletRequest req, HttpServletResponse res)\n    throws ServletException,\
    \ IOException {\n        res.setContentType(\"text/html\");\n        PrintWriter\
    \ pwriter=res.getWriter();\n        String name = req.getParameter(\"uname\");\n\
    \        String age = req.getParameter(\"uage\");\n        pwriter.println(\"\
    Name: \"+name);\n        pwriter.println(\"Age: \"+age);\n        pwriter.close();\n\
    \    }\n}\n```\n\nWeb.xml\nThis is your deployment descriptor file that maps the\
    \ servlet to the url. Since our form has details page as action, we mapped the\
    \ servlet class to the details page.\n\n```xml\n<web-app>\n    <display-name>JavaBookDemo</display-name>\n\
    \    <welcome-file-list>\n        <welcome-file>index.html</welcome-file>\n  \
    \      <welcome-file>index.htm</welcome-file>\n        <welcome-file>index.jsp</welcome-file>\n\
    \        <welcome-file>default.html</welcome-file>\n        <welcome-file>default.htm</welcome-file>\n\
    \        <welcome-file>default.jsp</welcome-file>\n    </welcome-file-list>\n\
    \    <servlet>\n        <servlet-name>JavaBook</servlet-name>\n        <servlet-class>MyServletDemo</servlet-class>\n\
    \    </servlet>\n    <servlet-mapping>\n        <servlet-name>JavaBook</servlet-name>\n\
    \        <url-pattern>/details</url-pattern>\n    </servlet-mapping>\n</web-app>\n\
    ```\n\nOutput:\nScreen 1:\n# ![](Images/image00453.jpeg)\n\n# Screen 2 that appears\
    \ upon clicking submit:\n# ![](Images/image00454.jpeg)\n\n### Example 2: Getting\
    \ parameter names and values\n\nIn this example, we will be using `getParameterNames()`\
    \ and `getParameter()` methods to get parameter names and values.\n\n`getParameterNames()`:\
    \ Returns an `Enumeration` of `String` objects containing the names of the parameters\
    \ contained in this request. If the request has no parameters, the method returns\
    \ an empty `Enumeration`.\n\n`getParameter()`: As mentioned above, this returns\
    \ the value of given parameter.\n\nindex.html\n```html\n<form action=\"details\"\
    \ method=\"get\">\nUser Name: <input type=\"text\" name=\"uname\"><br>\nUser Age:\
    \ <input type=\"text\" name=\"uage\"><br>\n <input type=\"submit\" value=\"submit\"\
    >\n</form>\n```\n\nMyServletDemo.class\n```java\nimport java.io.IOException;\n\
    import java.io.PrintWriter;\nimport java.util.Enumeration; \nimport javax.servlet.ServletException;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\npublic class MyServletDemo extends\
    \ HttpServlet {     \n    public void doGet(HttpServletRequest req, HttpServletResponse\
    \ res)\n    throws ServletException, IOException {     \n        PrintWriter pwriter=res.getWriter();\
    \ \n        res.setContentType(\"text/html\");\n        Enumeration en=req.getParameterNames();\n\
    \        while(en.hasMoreElements()) {\n            Object obj=en.nextElement();\n\
    \            String param=(String)obj;\n            String pvalue=req.getParameter(param);\n\
    \            pwriter.print(\"Parameter Name: \"+param+ \" Parameter Value: \"\
    +pvalue);\n        }\n        pwriter.close();  \n    }\n}\n```\n\nweb.xml\n```xml\n\
    <web-app>\n    <servlet>\n        <servlet-name>JavaBook</servlet-name>\n    \
    \    <servlet-class>MyServletDemo</servlet-class>\n    </servlet>\n    <servlet-mapping>\n\
    \        <servlet-name>JavaBook</servlet-name>\n        <url-pattern>/details</url-pattern>\n\
    \    </servlet-mapping>\n</web-app>\n```\nOutput:\n# ![](Images/image00455.jpeg)\n\
    # Parameter Name: uname Parameter Value: Chand\n# Parameter Name: uage Parameter\
    \ Value: 30\n\n### Example 3: Display Header information\n\nindex.html\n```html\n\
    <h1>Request Demo</h1>\n<body><a href=\"headinfo\">Click Here</a></body>\n```\n\
    \nHeaderDetails.java\n```java\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\
    import java.util.Enumeration;\nimport javax.servlet.ServletException;\nimport\
    \ javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\npublic class HeaderDetails extends\
    \ HttpServlet {\n    public void doGet(HttpServletRequest req, HttpServletResponse\
    \ res)\n    throws ServletException, IOException {\n        res.setContentType(\"\
    text/html\");\n        PrintWriter pwriter=res.getWriter();\n        pwriter.println(\"\
    HTTP header:<br>\");\n        Enumeration en=req.getHeaderNames();\n        while\
    \ (en.hasMoreElements()) {\n            String hName = (String)en.nextElement();\n\
    \            String hValue = req.getHeader(hName);\n            pwriter.println(\"\
    <b>\"+hName+\": </b>\"+hValue + \"<br>\");\n        }\n        pwriter.close();\n\
    \    }\n}\n```\n\nweb.xml\n```xml\n<web-app>\n    <welcome-file-list>\n      \
    \  <welcome-file>index.html</welcome-file>\n        <welcome-file>index.htm</welcome-file>\n\
    \        <welcome-file>index.jsp</welcome-file>\n        <welcome-file>default.html</welcome-file>\n\
    \        <welcome-file>default.htm</welcome-file>\n        <welcome-file>default.jsp</welcome-file>\n\
    \    </welcome-file-list>\n    <servlet>\n        <servlet-name>JavaBook</servlet-name>\n\
    \        <servlet-class>HeaderDetails</servlet-class>\n    </servlet>\n    <servlet-mapping>\n\
    \        <servlet-name>JavaBook</servlet-name>\n        <url-pattern>/headinfo</url-pattern>\n\
    \    </servlet-mapping>\n</web-app>\n```\nOutput:\n# ![](Images/image00456.jpeg)\n\
    # ![](Images/image00457.jpeg)\n\n## Methods of `ServletRequest` interface\n\n\
    `getParameter(String name)`: It returns the value of the given parameter as `String`\
    \ or null if the given parameter does not exist.\n\n`getParameterNames()`: It\
    \ returns an `Enumeration` of `String` objects containing the names of parameters\
    \ in the request.\n\n`getParameterValues(String name)`: It returns an array of\
    \ `Strings` containing the all values, the parameters has, returns null if parameter\
    \ doesn’t have any value.\n\n`getCharacterEncoding()`: Returns the name of the\
    \ character encoding used in the body of this request. This method returns null\
    \ if the request does not specify a character encoding.\n\n`setCharacterEncoding(String\
    \ env)`: Overrides the character encoding in the body of the request.\n\n`getContentLength()`:\
    \ Returns the length of the request content in bytes.\n\n`getContentType()`: Returns\
    \ the MIME type of the body of the request, or null if the type is not known.\n\
    \n# RequestDispatcher methods\n\n# RequestDispatcher methods with examples in\
    \ Servlet\n\nThe `RequestDispatcher` interface defines an object that receives\
    \ the request from client and dispatches it to the resource(such as servlet, JSP,\
    \ HTML file). This interface has following two methods:\n\n`public void forward(ServletRequest\
    \ request, ServletResponse response)`: It forwards the request from one servlet\
    \ to another resource (such as servlet, JSP, HTML file).\n\n`public void include(ServletRequest\
    \ request, ServletResponse response)`: It includes the content of the resource(such\
    \ as servlet, JSP, HTML file) in the response.\n\n## Difference between forward()\
    \ vs include() method\n"
