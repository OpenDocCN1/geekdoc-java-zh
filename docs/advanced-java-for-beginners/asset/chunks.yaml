  trans: "\n上述代码直接显示了 `display.jsp` 页面，该页面显示了从 `index.jsp` 页面传递的参数。\n\n![](img/image00368.jpeg)\n\
    \n## 3. `<jsp:param>` Action\n\n此动作用于将参数传递给其他的 JSP 动作标签，例如 `JSP include` 和 `JSP\
    \ forward` 标签。这样新的 JSP 页面就可以 `request` 对象本身访问这些参数。\n\n### 语法\n\n```xml\n<jsp:\
    \ param name=\"param_name_here\" value=\"value_of_parameter_here\" />\n```\n\n\
    现在考虑上述示例——\n\n**first.jsp**\n\n```html\n<<html>\n<head>\n<title>Demo of JSP Param\
    \ Action Tag</title>\n</head>\n<body>\n<h3>JSP page: 带有跳转的参数演示</h3>\n<jsp:forward\
    \ page=\"second.jsp\">\n    <jsp:param name =\"date\" value=\"20-05-2012\" />\n\
    \    <jsp:param name =\"time\" value=\"10:15AM\" />\n    <jsp:param name =\"data\"\
    \ value=\"ABC\" />\n</jsp:forward>\n</body>\n</html>\n```\n\n在上面的示例中，`first.jsp`\
    \ 将三个参数（`data`、`time` 和 `data`）传递给 `second.jsp`，`second.jsp` 可以使用下面的代码访问这些参数——\n\
    \n```jsp\nDate:<%= request.getParameter(\"date\") %>\nTime:<%= request.getParameter(\"\
    time\") %>\nMy Data:<%= request.getParameter(\"data\") %>\n```\n\n## 4. `<jsp:useBean>`\
    \ Action\n\n当你想在 JSP 页面中使用 Beans 时，此动作非常有用，通过此标签你可以轻松地调用一个 bean。\n\n### 语法\n\n\
    ```xml\n<jsp: useBean id=\"unique_name_to_identify_bean\" class=\"package_name.class_name\"\
    \ />\n```\n\n### `<jsp:useBean>`, `<jsp:setProperty>` & `<jsp:getProperty>` 示例：\n\
    \n一旦使用上述语句实例化 Bean 类，你就必须使用 `jsp:setProperty` 和 `jsp:getProperty` 动作来使用 bean 的参数。我们将看到这两者。\n\
    \n### jsp:useBean, jsp:setProperty 和 jsp:getProperty 动作标签\n\n在这里我们将看到如何通过 `jsp:useBean`、`jsp:setProperty`\
    \ 和 `jsp:getProperty` 动作标签在 JSP 中使用 bean 类。\n\n**jsp:useBean 的语法：**\n\n```xml\n\
    <jsp: useBean id=\"unique_name_to_identify_bean\" class=\"package_name.class_name\"\
    \ />\n```\n\n**jsp:setProperty 的语法：**\n\n```xml\n<jsp:setProperty name=\"unique_name_to_identify_bean\"\
    \ property=\"property_name\" />\n```\n\n**jsp:getProperty 的语法：**\n\n```xml\n<jsp:getProperty\
    \ name=\"unique_name_to_identify_bean\" property=\"property_name\" />\n```\n\n\
    ### useBean, setProperty 和 getProperty 的完整示例：\n\n1) 我们有一个 bean 类 `Details`，其中包含三个变量\
    \ `username`、`age` 和 `password`。为了在 JSP 中使用该 bean 类及其属性，我们在 `userdetails.jsp`\
    \ 页面中按如下方式初始化该类：\n\n```xml\n<jsp:useBean id=\"userinfo\" class=\"Javabook.com.Details\"\
    ></jsp:useBean>\n```\n\n我们使用了 `useBean` 动作来初始化该类。我们的类位于 `Javabook.com` 包中，因此我们提供了全限定类名\
    \ `Javabook.com.Details`。\n\n2) 我们使用 `setProperty` 动作标签映射了 bean 类属性和 JSP 的属性。我们在\
    \ `property` 字段中给出了 `*`，以根据名称映射值，因为我们在 bean 类和 `index.jsp` JSP 页面中使用了相同的属性名。在\
    \ `name` 字段中，我们提供了在 `useBean` 标签中定义的唯一标识符。\n\n```xml\n<jsp:setProperty property=\"\
    *\" name=\"userinfo\"/>\n```\n\n3) 为了获取属性值，我们使用了 `getProperty` 动作标签。\n\n```xml\n\
    <jsp:getProperty property=\"propertyname\" name=\"userinfo\"/>\n```\n\n**Details.java**\n\
    \n```java\npackage javabook.com;\n\npublic class Details {\n    public Details()\
    \ {\n    }\n    private String username;\n    private int age;\n    private String\
    \ password;\n\n    public String getUsername() {\n        return username;\n \
    \   }\n\n    public void setUsername(String username) {\n        this.username\
    \ = username;\n    }\n\n    public int getAge() {\n        return age;\n    }\n\
    \n    public void setAge(int age) {\n        this.age = age;\n    }\n\n    public\
    \ String getPassword() {\n        return password;\n    }\n\n    public void setPassword(String\
    \ password) {\n        this.password = password;\n    }\n}\n```\n\n**index.jsp**\n\
    \n```html\n<html>\n<head><title>useBean, getProperty and setProperty example</title></head>\n\
    <form action=\"userdetails.jsp\" method=\"post\">\nUser Name: <input type=\"text\"\
    \ name=\"username\"><br>\nUser Password: <input type=\"password\" name=\"password\"\
    ><br>\nUser Age: <input type=\"text\" name=\"age\"><br>\n<input type=\"submit\"\
    \ value=\"register\">\n</form>\n</html>\n```\n\n**userdetails.jsp**\n\n```xml\n\
    <jsp:useBean id=\"userinfo\" class=\"javabook.com.Details\"></jsp:useBean>\n<jsp:setProperty\
    \ property=\"*\" name=\"userinfo\"/>\n```\n\n你输入了以下详细信息：<br>\n\n```jsp\n<jsp:getProperty\
    \ property=\"username\" name=\"userinfo\"/><br>\n<jsp:getProperty property=\"\
    password\" name=\"userinfo\"/><br>\n<jsp:getProperty property=\"age\" name=\"\
    userinfo\"/>\n```\n\n"
- fmt: "\n# Methods Declaration\n\n```html\n<title>Methods Declaration</title>\n<body>\n\
    \ <%!\n int sum(int num1, int num2, int num3){\n return num1+num2+num3;\n }\n\
    %>\n<%= \"Result is: \" + sum(10,40,50) %>\n</body>\n```\n\nOutput: Sum of all\
    \ three integers gets displayed on the browser.\nResult is 100\n\n# JSP Implicit\
    \ Objects\n\nThese objects are created by JSP container while translating the\
    \ JSP page to Servlet. These objects are present inside service methods so we\
    \ can directly use them without declaration.\n\nThese objects are created by JSP\
    \ Engine during translation phase (while translating JSP to Servlet). They are\
    \ being created inside service method so we can directly use them within Scriptlet\
    \ without initializing and declaring them. There are total 9 implicit objects\
    \ available in JSP.\n\n### Implicit Objects and their corresponding classes\n\n\
    | Object | Class |\n| :--- | :--- |\n| `Out` | `javax.servlet.jsp.JspWriter` |\n\
    | `request` | `javax.servlet.http.HttpServletRequest` |\n| `Response` | `javax.servlet.http.HttpServletResponse`\
    \ |\n| `Session` | `javax.servlet.http.HttpSession` |\n| `Application` | `javax.servlet.ServletContext`\
    \ |\n| `Exception` | `javax.servlet.jsp.JspException` |\n| `Page` | `java.lang.Object`\
    \ |\n| `pageContext` | `javax.servlet.jsp.PageContext` |\n| `Config` | `javax.servlet.ServletConfig`\
    \ |\n\nNote: Get back from here\n\n## Expression language (EL) in JSP\n\n# OUT\
    \ Implicit Object\n\nOUT Implicit Object in JSP with examples\nIt’s an instance\
    \ of `javax.servlet.jsp.JspWriter`. This allows us to access Servlet output stream.\
    \ The output which needs to be sent to the client (browser) is passed through\
    \ this object. In simple words `out` implicit object is used to write content\
    \ to the client.\n\n### Methods of OUT Implicit Object\n\n1. `void print()`\n\
    2. `void println()`\n3. `void newLine()`\n4. `void clear()`\n5. `void clearBuffer()`\n\
    6. `void flush()`\n7. `boolean isAutoFlush()`\n8. `int getBufferSize()`\n9. `int\
    \ getRemaining()`\n\nLet us see each of the `out`’s method in detail –\n\n1. `Void\
    \ print()`: This method writes the value which has been passed to it. For e.g.\
    \ the below statement would display a sentence `Out Implicit Object in jSP - JavaBook`\
    \ to the output screen (client browser).\n```java\nout.print(\"Out Implicit Object\
    \ in jSP - JavaBook\");\n```\n\n2. `Void println()`: This method is similar to\
    \ the `print()` method, the only difference between `print` and `println` is that\
    \ the `println()` method adds a new line character at the end. Let’s have a look\
    \ at the difference with the help of an example.\n\nPrint:\n```java\nout.print(\"\
    hi\");\nout.print(\" \");\nout.print(\"hello\");\n```\nOutput on browser: There\
    \ will not be a new line between the outcomes of all 3 `out.print` statements.\n\
    `hi hello`\n\nprintln:\n```java\nout.println(\"hi\");\nout.println(\"hello\");\n\
    ```\nOutput on browser:\nhi\nhello\n\n3. `Void newLine()`: This method adds a\
    \ new line to the output. Example –\n```java\nout.print(\"This will write content\
    \ without a new line\");\nout.newLine();\nout.print(\"I’m just an another print\
    \ statement\");\n```\nOutput:\nThis will write content without a new line\nI’m\
    \ just an another print statement\n\nAs you know `print` statement does not add\
    \ a new line. We have added a new line between two `out.print` statements using\
    \ `newLine()` method.\n\n4. `Void clear()`: It clears the output buffer without\
    \ even letting it write the buffer content to the client. This is how it can be\
    \ called –\n```java\nout.clear();\n```\n\n5. `Void clearBuffer()`: This method\
    \ is similar to the `clear()` method. The only difference between them is that\
    \ when we invoke `out.clear()` on an already flushed buffer it throws an exception,\
    \ however `out.clearBuffer()` doesn’t.\n\n6. `Void flush()`: This method also\
    \ clears the buffer just like `clear()` method but it forces it to write the content\
    \ to the output before flushing it, which means whatever is there in buffer would\
    \ be written to the client screen before clearing the buffer.\n\n7. `Boolean isAutoFlush()`:\
    \ It returns a Boolean value true/false. It is used to check whether the buffer\
    \ is automatically flushed or not.\n\n8. `Int getBufferSize()`: This method returns\
    \ the size of output buffer in bytes.\n\n9. `Int getRemaining()`: It returns the\
    \ number of bytes remaining before hitting the buffer overflow condition.\n\n\
    ### OUT Implicit Object Example\n\nIn this example we are using `print` and `println`\
    \ methods of `OUT` for displaying few message to the client.\n\n**index.jsp**\n\
    ```html\n<HTML>\n<HEAD>\n<TITLE> OUT IMPLICIT OBJECT EXAMPLE </TITLE>\n</HEAD>\n\
    <BODY>\n<%\nout.print( \"print statement \" );\nout.println( \"println\" );\n\
    out.print(\"Another print statement\");\n%>\n</BODY>\n</HTML>\n```\nOutput:\n\
    printstatement println\nAnother print statement\n\n# Request Implicit Object in\
    \ JSP with examples\n\n### Methods of request Implicit Object\n\n1. `GetParameter(String\
    \ name)` – This method is used to get the value of a request’s parameter. For\
    \ example at login page user enters `user-id` and password and once the credentials\
    \ are verified the login page gets redirected to user information page, then using\
    \ `request.getParameter` we can get the value of `user-id` and `password` which\
    \ user has input at the login page.\n```java\nString Uid= request.getParameter(\"\
    user-id\");\nString Pass= request.getParameter(\"password\");\n```\n\n2. `GetParameterNames()`\
    \ – It returns enumeration of all the parameter names associated to the request.\n\
    ```java\nEnumeration e= request.getParameterNames();\n```\n\n3. `GetParameterValues(String\
    \ name)` – It returns the array of parameter values.\n```java\nString[] passwords\
    \ = request.getParameterValues(\"password\");\n```\n\n4. `GetAttribute(String\
    \ name)` – Used to get attribute value.\n```java\nrequest.getAttribute(\"admin\"\
    )\n```\n\n5. `GetAttributeNames()` – It is generally used to get attribute names\
    \ associated to the current session. It returns the attribute names present in\
    \ session.\n```java\nEnumerator e = request.getAttributeNames();\n```\n\n6. `SetAttribute(String,Object)`\
    \ – It assigns object’s value to the attribute. For example I have an attribute\
    \ `password` and a String `str` which has a value “admin” then calling `request.setAttribute(\"\
    password\", str)` would assign a value to attribute.\n\n7. `RemoveAttribute(String)`\
    \ – By using this method attribute can be removed and cannot be used further.\
    \ For e.g. If you have a statement `request.removeAttribute(\"userid\")` on a\
    \ JSP page then the userid attribute would be completely removed and `request.getAttribute(\"\
    userid\")` would return NULL.\n\n8. `GetCookies()` – It returns an array of cookie\
    \ objects received from the client. This method is mainly used when dealing with\
    \ cookies in JSP.\n\n9. `GetHeader(String name)` – This method is used to get\
    \ the header information of the request.\n\n10. `GetHeaderNames()` – Returns enumerator\
    \ of all header names. Below code snippet would display all the header names associated\
    \ with the request.\n```java\nEnumeration e = request.getHeaderNames();\nwhile\
    \ (e.hasMoreElements()) {\n String str = (String)e.nextElement();\n out.println(str);\n\
    }\n```\n\n11. `GetRequestURI()` – This method (`request.getRequestURI()`) returns\
    \ the URL of current JSP page.\n\n12. `GetMethod()` – It returns HTTP request\
    \ method. `request.getMethod()`. For example it will return GET for a Get request\
    \ and POST for a Post Request.\n\n13. `GetQueryString()` – Used for getting the\
    \ query string associated to the JSP page URL. It is the string associated to\
    \ the URL after question mark sign (?)\n\n### Request Implicit Object Example\n\
    \nIn the below example we are receiving the input from user in index.html page\
    \ and displaying the same information in userinfo.jsp page using request implicit\
    \ object.\n\n**index.html**\n```html\n<html>\n<head>\n<title>Enter UserName and\
    \ Password</title>\n</head>\n<body>\n<form action=\"userinfo.jsp\">\nEnter User\
    \ Name: <input type=\"text\" name=\"uname\" /> <br><br>\nEnter Password: <input\
    \ type=\"text\" name=\"pass\" /> <br><br>\n<input type=\"submit\" value=\"Submit\
    \ Details\"/>\n</form>\n</body>\n</html>\n```\n\n**userinfo.jsp**\n```jsp\n<%@\
    \ page import = \" java.util.*\" %>\n<html>\n<body>\n<%\nString username=request.getParameter(\"\
    uname\");\n%>\n</body>\n</html>\n```\n"
