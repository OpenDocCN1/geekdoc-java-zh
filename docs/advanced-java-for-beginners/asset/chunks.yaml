- fmt: "\n## Step 4: Invoke `service()` method\n\nEach time the web server receives\
    \ a request for `servlet`, it spawns a new thread that calls `service()` method.\
    \ If the servlet is `GenericServlet` then the request is served by the `service()`\
    \ method itself, if the servlet is `HttpServlet` then `service()` method receives\
    \ the request and dispatches it to the correct handler method based on the type\
    \ of request.\n\nFor example if its a Get Request the `service()` method would\
    \ dispatch the request to the `doGet()` method by calling the `doGet()` method\
    \ with request parameters. Similarly the requests like `Post`, `Head`, `Put` etc.\
    \ are dispatched to the corresponding handlers `doPost()`, `doHead()`, `doPut()`\
    \ etc. by `service()` method of servlet.\n\n#![](Images/image00451.jpeg)\n\nNote:\
    \ Unlike `init()` and `destroy()` that are called only once, the `service()` method\
    \ can be called any number of times during servlet life cycle. As long as servlet\
    \ is not destroyed, for each client request the `service()` method is invoked.\n\
    \nOut of all the 5 steps in life cycle, this is the only step that executes multiple\
    \ times.\n\n## Step 5: Invoke `destroy()` method\n\nWhen servlet container shuts\
    \ down(this usually happens when we stop the web server), it unloads all the servlets\
    \ and calls `destroy()` method for each initialized servlets.\n\nNote:\n\nGo back\
    \ from here:\n\n[Servlet Interface](#part0000.xhtml_servletinter)\n\n# Working\
    \ of Servlet\n\nBefore I start explaining how the servlet works, lets get familiar\
    \ with these three terms.\n\n- **Web Server**: it can handle HTTP Requests send\
    \ by clients and responds the request with an HTTP Response.\n- **Web Application(webapp)**:\
    \ I would refer this as `webapp` in this guide. Basically the project is your\
    \ web application, it is the collection of servlets.\n- **Web Container**: Also\
    \ known as Servlet Container and Servlet Engine. It is a part of Web Server that\
    \ interacts with Servlets. This is the main component of Web Server that manages\
    \ the life cycle of Servlets.\n\n# You will find that some part of this guide\
    \ is already covered in the servlet life cycle guide, however this guide focuses\
    \ on the working of a servlet application (webapp) rather than the steps of life\
    \ cycle. I would highly recommend you to read this to have in depth knowledge\
    \ of how the servlet actually works.\n\n## How Servlet Works?\n\n1) When the web\
    \ server (e.g. Apache Tomcat) starts up, the servlet container deploy and loads\
    \ all the servlets. During this step Servlet container creates `ServletContext`\
    \ object. `ServletContext` is an interface that defines the set of methods that\
    \ a servlet can use to communicate with the servlet container.\n\nNote: There\
    \ is only one `ServletContext` per webapp which is common to all the servlets.\
    \ `ServletContext` has several useful methods such as `addListener()`, `addFilter()`\
    \ etc. For now I am not explaining them as I will cover them in a separate text\
    \ about `ServletContext`.\n\n2) Once the servlet is loaded, the servlet container\
    \ creates the instance of servlet class. For each instantiated servlet, its `init()`\
    \ method is invoked.\n\n3) Client (user browser) sends an Http request to web\
    \ server on a certain port. Each time the web server receives a request, the servlet\
    \ container creates `HttpServletRequest` and `HttpServletResponse` objects. The\
    \ `HttpServletRequest` object provides the access to the request information and\
    \ the `HttpServletResponse` object allows us to format and change the http response\
    \ before sending it to the client.\n\nThe servlet container spawns a new thread\
    \ that calls `service()` method for each client request. The `service()` method\
    \ dispatches the request to the correct handler method based on the type of request.\n\
    \nFor example if server receives a Get Request the `service()` method would dispatch\
    \ the request to the `doGet()` method by calling the `doGet()` method with request\
    \ parameters. Similarly the requests like `Post`, `Head`, `Put` etc. are dispatched\
    \ to the corresponding handlers `doPost()`, `doHead()`, `doPut()` etc. by `service()`\
    \ method of servlet.\n\n#![](Images/image00452.jpeg)\n\n# 4) When servlet container\
    \ shuts down, it unloads all the servlets and calls `destroy()` method for each\
    \ initialized servlets.\n\n## Welcome-file-list tag in web.xml file of Project\n\
    \nHave you ever seen `<welcome-file-list>` tag in your `web.xml` file and wondering\
    \ what it is? In this text, I will explain what is this tag and why we use it.\n\
    \nThe tag `<welcome-file-list>` is used for specifying the files that needs to\
    \ be invoked by server by default, if you do not specify a file name while loading\
    \ the project on browser.\n\nFor e.g. You have created a project named “MyServletProject”\
    \ and you have few html pages and servlet classes defined in the project. However\
    \ in browser you have given the url like this:\n\n`http://localhost:8080/MyServletProject`\n\
    \nUsually we give the complete path like this: `http://localhost:8080/MyServletProject/index.html`.\
    \ However if you have given the path like above then the webserver will look for\
    \ the `<welcome-file-list>` tag in your project’s `web.xml` file. Let say you\
    \ have the following content in your `web.xml` file:\n\n```xml\n<web-app>\n  ....\n\
    \  <welcome-file-list>\n    <welcome-file>myhome.htm</welcome-file>\n    <welcome-file>myindex.htm</welcome-file>\n\
    \    <welcome-file>mydefaultpage.htm</welcome-file>\n  </welcome-file-list>\n\
    \  ....\n</web-app>\n```\n\nBased on the welcome file list, server would look\
    \ for the `myhome.htm` page if this doesn’t exist then the second welcome file\
    \ `myindex.html` and so on till it finds a valid welcome file.\n\nNote: If the\
    \ `<welcome-file-list>` tag is not defined in `web.xml` or the `<welcome-file-list>`\
    \ tags does not exist then the server would look for the following sequence:\n\
    \n1) index.html\n2) index.htm\n3) index.jsp\n\n# load-on-startup tag in web.xml\
    \ file\n\n## How to use load-on-startup\n\nBy default Servlet is not loaded until\
    \ servlet receives a request. This may cause a delay in accessing the servlet.\
    \ To avoid the delay in access time, you can use `<load-on-startup>` tag in your\
    \ `web.xml` file that allows you to force the servlet container to load (instantiated\
    \ and have `init()` called) the servlet as soon as the server starts.\n\n### How\
    \ to use <load-on-startup>?\n\nHere is a sample web.xml:\n\n```xml\n<web-app>\n\
    \  …\n  <servlet>\n    <servlet-name>MyServlet</servlet-name>\n    <servlet-class>com.Javabook.DemoServlet</servlet-class>\n\
    \    <load-on-startup>1</load-on-startup>\n  </servlet>\n  …\n</web-app>\n```\n\
    \nIf I did not specify the `<load-on-startup>`, the web container would not have\
    \ loaded the servlet until it receives a request. Since I have specified a value\
    \ `>=0`, this servlet would be loaded on startup.\n\nNote: value `>=0` means that\
    \ the servlet is loaded when the web-app is deployed or when the server starts,\
    \ if the value `<0` then servlet would be loaded whenever the container feels\
    \ like.\n\n### How specify the order of servlet loading using <load-on-startup>\
    \ tag?\n\n```xml\n<web-app>\n  …\n  <servlet>\n    <servlet-name>MyServlet1</servlet-name>\n\
    \    <servlet-class>com.Javabook.DemoServlet1</servlet-class>\n    <load-on-startup>5</load-on-startup>\n\
    \  </servlet>\n  <servlet>\n    <servlet-name>MyServlet2</servlet-name>\n    <servlet-class>com.Javabook.DemoServlet2</servlet-class>\n\
    \    <load-on-startup>0</load-on-startup>\n  </servlet>\n  <servlet>\n    <servlet-name>MyServlet3</servlet-name>\n\
    \    <servlet-class>com.Javabook.DemoServlet3</servlet-class>\n    <load-on-startup>-2</load-on-startup>\n\
    \  </servlet>\n  …\n</web-app>\n```\n\nIn this example we have three Servlets\
    \ specified in the `web.xml` file, since servlet classes `DemoServlet1` and `DemoServlet2`\
    \ has `load-on-startup` value `>=0`, they both will be loaded as soon as the server\
    \ starts. However servlet class `DemoServlet2` would be loaded before the `DemoServlet1`\
    \ class because it has lower `load-on-startup` value.\n\nServlet class `DemoServlet3`\
    \ would not be loaded on startup as it has negative `load-on-startup` value.\n\
    \n# ServletRequest Interface\n\n# ServletRequest Interface with example\n"
