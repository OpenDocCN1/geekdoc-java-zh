    </body>

    </html>

    ```


    Output:


    atap Prasad


    ### `fn:substringBefore()`


    It is just opposite of `fn:substringAfter` function. It returns the part of original
    string which lies before a specified string value.


    #### Syntax:


    `String fn:substringBefore(String input, String beforestring)`


    The part of `input` before the `beforestring` will be returned as the output of
    this function.


    #### Example of `fn:substringBefore()`


    ```xml

    <%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

