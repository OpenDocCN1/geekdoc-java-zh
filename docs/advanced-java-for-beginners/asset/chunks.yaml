  trans: "\n自定义标签的调用方式如下：`<prefix:tagName/>`。我们的前缀是 `myprefix`，标签名为 `MyMsg`，因此在下面的\
    \ JSP 页面中我们将其为 `<myprefix:MyMsg/>`。\n\n```jsp\n<%@ taglib prefix=\"myprefix\"\
    \ uri=\"WEB-INF/message.tld\"%>\n<html>\n<head>\n <title>JSP 自定义标签示例</title>\n\
    </head>\n<body>\n <myprefix:MyMsg/>\n</body>\n</html>\n```\n输出：\n`This is my own\
    \ custom tag`\n\n### 如何访问自定义标签的主体（Body）\n\n在本教程中，我们将学习如何访问自定义标签的主体。例如，如果我们的自定义标签是\
    \ `xyz`，那么我们将学习访问 `<prefix: xyz>` 和 `</prefix:xyz>` 之间的内容。\n\n```jsp\n<prefix:\
    \ xyz>\nBody of custom tag: This is what we will access in the below example\n\
    </prefix:xyz>\n```\n\n### 示例：\n在这个示例中，自定义标签将向其正正体追加一个 `String` 并显示结果。\n\n标签处理器类：`Details.java`\n\
    \n```java\npackage javabook.com;\n\nimport javax.servlet.jsp.tagext.*;\nimport\
    \ javax.servlet.jsp.*;\nimport java.io.*;\n\npublic class Details extends SimpleTagSupport\
    \ {\n    //StringWriter object\n    StringWriter sw = new StringWriter();\n\n\
    \    public void doTag() throws JspException, IOException {\n        getJspBody().invoke(sw);\n\
    \        JspWriter out = getJspContext().getOut();\n        out.println(sw.toString()+\"\
    Appended Custom Tag Message\");\n    }\n}\n```\n\nTLD 文件：`message.tld`\n记得将此文件放在\
    \ `WEB-INF` 文件夹中。\n\n```xml\n<taglib>\n<tlib-version>1.0</tlib-version>\n<jsp-version>2.0</jsp-version>\n\
    <short-name>My Custom Tag: MyMsg</short-name>\n<tag>\n<name>MyMsg</name>\n<tag-class>javabook.com.Details</tag-class>\n\
    <body-content>scriptless</body-content>\n</tag>\n</taglib>\n```\n\nJSP 页面：`index.jsp`\n\
    \n```jsp\n<%@ taglib prefix=\"myprefix\" uri=\"WEB-INF/message.tld\"%>\n<html>\n\
    <head>\n <title>访问自定义标签主体的示例</title>\n</head>\n<body>\n <myprefix:MyMsg>\n Test\
    \ String\n </myprefix:MyMsg>\n</body>\n</html>\n```\n输出：\n`Test String Appended\
    \ Custom Tag Message`\n\n---\n\n# JSP 指令 (DIRECTIVES)\n\n## JSP 指令\nJSP 指令 – 页面和\
    \ TagLib\n指令控制整个 JSP 页面的处理。它为服务器提供了关于页面处理的指导方向。\n\n**指令的语法：**\n`<%@ directive\
    \ name [attribute name=“value” attribute name=“value” ........]%>`\n\nJSP 中有三种指令：\n\
    1. `Page 指令` (Page Directive)\n2. `Include 指令` (Include Directive)\n3. `TagLib\
    \ 指令` (TagLib Directive)\n\n### 1) Page 指令\n有几个属性与 `Page 指令` 一起使用，这些是：\n1. `import`\n\
    2. `session`\n3. `isErrorPage`\n4. `errorPage`\n5. `ContentType`\n6. `isThreadSafe`\n\
    7. `extends`\n8. `info`\n9. `language`\n10. `autofflush`\n11. `buffer`\n\n####\
    \ 1. Import:\n此属性用于导入包。在编码时，你可能需要包含多个包，在这种情况下，此页面指令属性非常有用，因为它允许你在同一处列出多个包，并用逗号（`,`）隔开。或者，你也可以拥有多个\
    \ `page` 元素实例，每个实例对应不同的包。\n\n**import 属性的语法：**\n`<%@page import=\"value\"%>`\n\
    此处 `value` 是包名。\n\n**import 示例：** 下面是一个关于如何如何使用 `page` 指令的 `import` 属性导入多个包的示例。\n\
    \n```jsp\n<%@page import=\"java.io.*%>\n<%@page import=\"java.lang.*%>\n<%-- 注释：或者下述语句：两者等同\
    \ --%>\n<%@page import=\"java.io.*, java.lang.*\"%>\n```\n\n#### 2. Session:\n\
    通常在构建用户交互式 JSP 应用时，我们确保允许用户在会话（session）活动期间获取其个人数据。考虑登录银行账户的示例，我们可以在注销（或会话过期）之前访问你的所有数据。为了保持页面的会话，`session`\
    \ 属性应设为 `true`。\n\n此属性用于处理 JSP 页面的 HTTP 会话。它有两个取值：`true` 或 `false`。`session` 属性的默认值为\
    \ `true`，这意味着如果你没有提到此属性，服务器可能会认为该页面需要 HTTP 会话。\n\n**该属性的默认值：** `true`\n\n**语法：**\n\
    `<%@ page session=\"value\"%>`\n此处 `value` 是 `true` 或者是 `false`。\n\n**session\
    \ 示例：**\n```jsp\n<%@ page session=\"true\"%>\n```\n上述代码将允许页面拥有 session 隐式对象。\n\
    \n```jsp\n<%@ page session=\"false\"%>\n```\n如果在 JSP 页面中指定了此代码，意味着该页面将无法使用 session\
    \ 对象。因此，该页面无法维护会话。\n\n#### 3. isErrorPage:\n此属性用于指定当前 JSP 页面是否可以作为错误页。如果 `isErrorPage`\
    \ 为 `true`，则可以使用。\n\n#### 4. errorPage:\n如上所述，它指定发生异常时的 JSP 页面 URL。\n\n**语法：**\n\
    `<%@ page errorPage=\"value\"%>`\n此处 `value` 是页面名。\n\n**errorPage 示例：**\n```jsp\n\
    <%@ page errorPage=\"ExceptionHandling.jsp\"%>\n```\n\n#### 5. ContentType:\n\
    此属性用于设置 JSP 页面的内容类型。\n默认值：`text/html`\n\n**语法：**\n`<%@ page contentType=\"value\"\
    %>`\n此处 `value` 可以任意，如 `text/html`、`text/xml`。\n\n**contentType 示例：**\n```jsp\n\
    <%@ page contentType=\"text/html\"%>\n<%@ page contentType=\"text/xml\"%>\n```\n\
    \n#### 6. isThreadSafe:\n让我们通过示例来理解。假设你创建了一个 JSP 并将 `isThreadSafe` 设置为 `true`，这意味着该\
    \ JSP 页面支持多线程（多个线程可以执行该页面）。另一方面，如果设置为 `false`，则 JSP 不允许多线程，这意味着只有一个线程将执行页面代码。\n\
    \n**isThreadSafe 属性的默认值：** `true`\n\n**语法：**\n`<%@ page isThreadSafe=\"value\"\
    %>`\n\n**isThreadSafe 示例：**\n```jsp\n<%@ page isThreadSafe=\"false\"%>\n```\n\n\
    #### 7. Buffer:\n此属性用于指定指定缓冲区大小。如果在编码期间将其指定为 `none`，则输出将由 `JspWriter` 直接写入 `Response`\
    \ 对象。而如果你指定了缓冲区大小，则输出首先写入缓冲区，然后供响应对象使用。\n\n**语法：**\n`<%@ page buffer=\"value\"\
    %>`\n`value` 的单位是 `kb` 或 `none`。\n\n**buffer 示例：**\n```jsp\n<%@ page buffer=\"\
    none\"%>\n<%@ page buffer=\"5kb\"%>\n```\n\n#### 8. Extends:\n类似于 `java`，此处此属性也用于扩展（继承）类。\n\
    \n**语法：**\n`<%@ page extends=\"value\"%>`\n`value` 是 `package_name.class_name`。\n\
    \n**extends 示例：**\n```jsp\n<%@ page extends=\"mypackage.SampleClass\"%>\n```\n\
    \n#### 9. Info:\n它为 JSP 页面提供描述。当我们调用 `getServletInfo()` 方法时，在 `info` 中指定的字符串将返回。\n\
    \n**语法：**\n`<%@ page info=\"value\"%>`\n此处 `value` 是消息或描述。\n\n"
