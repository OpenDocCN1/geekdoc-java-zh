    <%@ page info="此代码由 Chandru Prasad 提供"%>


    ## 10. language


    它指定了页面中使用的脚本语言（底层语言）。


    ### language 的语法：

    ```jsp

    <%@ page language="value"%>

    ```

    `value` 在这里表示脚本语言。


    ### language 属性示例：

    ```jsp

    <%@ page language="java"%>

    ```


    ## 11. AutoFlush


    如果为 `true`，则意味着当缓冲区满时应该自动刷新。`false` 则会在缓冲区溢出时抛出异常。


    **默认值：** `True`


    ### autoFlush 的语法：

    ```jsp

    <%@ page autoFlush="value"%>

    ```

    `value` 可以是 `true` 或 `false`。


    ### autoFlush 属性示例：

    缓冲区满时将自动刷新——

    ```jsp

    <%@ page autoFlush="true"%>

    ```

    当缓冲区因溢出条件而满时将抛出异常

    ```jsp

    <%@ page autoFlush="true"%>

    ```


    ## 12. isScriptingEnabled


    该属性已弃用且不再使用。


    ## 13. isELIgnored


    此属性指定表达式是否会被求值。


    **默认值：** `true`


    ### isELIgnored 的语法：

    ```jsp

    <%@ page isELIgnored="value"%>

    ```

    `value` 可以是 `true` 或 `false`。


    ### isELIgnored 属性示例：

    JSP 页面中的任何表达式都不会被求值——

    ```jsp

    <%@ page isELIgnored="false"%>

    ```

    表达式将被求值（`true` 是默认值，因此无需指定）——

    ```jsp

    <%@ page isELIgnored="true"%>

    ```


    ## 2) 包含指令 (Include Directive)


    包含指令用于将一个 JSP 页面的内容复制到另一个页面。它就像将一个文件的代码包含到另一个文件中。


    ### 语法：

    ```jsp

    <%@include file ="value"%>

    ```

    这里的 `value` 是需要包含的 JSP 文件名。如果文件在相同目录下，只需指定文件名；否则，需要在 `value` 字段中注明完整的 URL（或路径
    `path`）。


    **注意：** 它可以用于页面的任何地方。


    ### 示例：

    ```jsp

    <%@include file="myJSP.jsp"%>

    ```

    你可以在你的 JSP 页面中使用上述代码来复制 `myJSP.jsp` 文件的内容。但在这种情况下，两个 JSP 文件必须位于相同的目录下。如果 `myJSP.jsp`
    在不同的目录下，则需要在上述代码中指定完整路径，而不是是文件名。


    ### 必读：[JSP 中的包含指令详解](http://example.com) (占位链接)


    ## JSP 中的包含指令详解


    包含指令用于在翻译阶段将外部文件合并到当前 JSP 页面（即 JSP 转换为相应的 Servlet 的阶段）。


    ### 为什么我们需要使用包含指令？难道不能直接将文件内容添加到当前 JSP 中，而是使用指令吗？


    我们可以复制外部文件的内容并粘贴到主 JSP 中，但这不是良好的做法。让我们通过一个例子来理解这一点——我有 100 个外部文件和 1 个主 JSP 文件。如果我只是将所有文件的内容复制到主
    JSP 中，那么当任何外部文件发生变化时我都必须编辑它；相反，我们可以使用指令包含所有文件，并在需要时编辑特定的文件。


    此外，通过使用包含指令，你可以增强代码的可用性——假设某些代码或数据需要在你应用程序中所有的 JSP 页面中存在，那么你只需要将该代码/数据放在一个文件中并在所有的
    JSP 页面中包含该文件。


    上述两个原因可以被认为是使用包含指令的优势。


    ### 语法：

    这是 JSP 中包含指令的语法。

    ```jsp

    <%@ include file="文件的 URL" %>

    ```

    我们必须指定相对 URL——

    如果文件位于当前 JSP 页面所在的文件夹中，我们可以直接提及文件名，否则需要指定指向文件的相对路径。


    ### 包含指令示例


    **index.jsp**

    ```jsp

    <html>

    <head>

    <title>主 JSP 页面</title>

    </head>

    <body>

    <%@ include file="file1.jsp" %>

    主 JSP Page：两个包含指令之间的内容。

    <%@ include file="file2.jsp" %>

    </body>

    </html>

    ```


    **file1.jsp**

    ```jsp

    <p  align="center">

    这是我的 File1.jsp，我将使用包含指令将其包含在 index.jsp 中

    </p>

    ```


    **file2.jsp**

    ```jsp

    <p  align="center">

    这是 File2.jsp

    </p>

    ```


    **输出：** 运行上述代码时的输出将如下。如你所见，我们通过包含指令在我们的主 JSP 页面中包含了 `file1` 和 `file2` 的内容。


    ![Include-Directive-example-output](img/image0039.jpeg)


    ## 3) Taglib 直接 (Taglib Directive)


    该指令基本上允许用户在 JSP 中使用自定义标签（Custom tags）。我们将在后面的 JSP 教程中详细讨论自定义标签。Taglib 指令帮助你在 JSP
    页面中声明自定义标签。


    ### 语法：

    ```jsp

    <%@taglib uri ="taglibURI" prefix="tag prefix"%>

    ```

    其中 `URI` 是统一资源定位符，用于标识自定义标签的位置，`tag prefix` 是一个字符串，用于标识由 `uri` 确定位置的自定义标签。


    ### 语法：

    ```jsp

    <%@taglib uri ="taglibURI" prefix="tag prefix"%>

    ```

    其中 `URI` 是统一资源定位符，用于标识自定义标签的位置，`tag prefix` 是一个字符串，用于标识由 `uri` 确定位置的自定义标签。


    ### 示例：

    ```jsp

    ```

    ### Taglib 示例：

    ```jsp

    <%@taglib uri="http://sample.com/customlib" prefix="tagag" %>

    <html>

    <body>

    <tagag:welcome/>

    </body>

    </html>

    ```

    如你所见，`uri` 是自定义标签的位置。**注意：** 在上述示例中，`tagag` 是自定义前缀。


