    \ It maps to `Cookie` object.\n\n**Note:**\nGO BACK HERE:\n*   [JSP include action\
    \ with parameter example](#part0000.xhtml_INCLUDEACTION)\n*   [JSTL](#part0000.xhtml_JSTL)\n\
    \n# EXCEPTION HANDLING\n\n### Exception handling\n\nException handling in JSP\
    \ – A complete tutorial to learn exception handling in the JSP. We have shared\
    \ two methods to handle exceptions.\n\nBefore going through exception handling\
    \ in JSP, let us understand what is exception and how it is different from errors.\n\
    \n*   **Exception**: These are nothing but the abnormal conditions which interrupts\
    \ the normal flow of execution. Mostly they occur because of the wrong data entered\
    \ by user. It is must to handle exceptions in order to give meaningful message\
    \ to the user so that user would be able to understand the issue and take appropriate\
    \ action.\n*   **Error**: It can be an issue with the code or a system related\
    \ issue. We should not handle errors as they are meant to be fixed.\n\n#### Methods\
    \ of handling exceptions:\n\nWe can handle exceptions using the below two methods:\n\
    1. Exception handling using `exception` implicit object\n2. Exception handling\
    \ using try-catch blocks within scriptlets\n\n### Exception handling using exception\
    \ implicit object\n\nIn the below example – we have specified the exception handling\
    \ page using `errorPage` attribute of `Page` directive. If any exception occurs\
    \ in the main JSP page the control will be transferred to the page mentioned in\
    \ `errorPage` attribute.\n\nThe handler page should have `isErrorPage` set to\
    \ `true` in order to use `exception` implicit object. That is the reason we have\
    \ set the isErrorPage` true for `errorpage.jsp`.\n\n**index.jsp**\n```jsp\n<%@\
    \ page errorPage=\"errorpage.jsp\" %>\n<html>\n<head>\n  <title>JSP exception\
    \ handling example</title>\n</head>\n<body>\n<%\n  //Declared and initialized\
    \ two integers\n  int num1 = 122;\n  int num2 = 0;\n  //It should throw Arithmetic\
    \ Exception\n  int div = num1/num2;\n%>\n</body>\n</html>\n```\n\n**errorpage.jsp**\n\
    ```jsp\n<%@ page isErrorPage=\"true\" %>\n<html>\n<head>\n  <title>Display the\
    \ Exception Message here</title>\n</head>\n<body>\n  <h2>errorpage.jsp</h2>\n\
    \  <i>An exception has occurred in the index.jsp Page. Please fix the errors.\
    \ Below is the error message:</i>\n  <b><%= exception %></</b>\n</body>\n</html>\n\
    ```\n\n**Output:**\n![](Images/image00397.jpeg)\n\n### Exception handling using\
    \ try catch blocks within scriptlets\n\nWe have handled the exception using try-catch\
    \ blocks in the below example. Since try-catch blocks in the below example are\
    \ placed inside a scriptlet.\n\n**error.jsp**\n```jsp\n<html>\n<head>\n  <title>Exception\
    \ handling using catch blocks</title>\n</head>\n<body>\n<%\n  try {\n    int arr[]\
    \ = {1, 2, 3, 4, 5};\n    int num = arr[6];\n    out.println(num);\n  } catch\
    \ (Exception exp) {\n    out.println(\"There is something: \" + exp);\n  }\n%>\n\
    </body>\n</html>\n```\n**Output:**\n![](Images/image00398.jpeg)\n\n# CUSTOM TAGS\n\
    \nUser-defined tags are known as custom tags. In this tutorial we will see how\
    \ to create them. To create a custom tag we need three things:\n1. **Tag handler\
    \ class**: In this class we specify what the tag will do.\n2. **TLD file**: Tag\
    \ descriptor file where we specify the tag name and attributes.\n3. **JSP page**:\
    \ JSP page where we will use the tag.\n\n### Tag handler class\n\nA tag handler\
    \ class should implement `Tag` interface or it can also extend `SimpleTagSupport`.\
    \ \n\n**Details.java**\n```java\npackage javabook.com;\nimport javax.servlet.jsp.tagext.*;\n\
    import javax.servlet.jsp.*;\nimport java.io.*;\n\npublic class Details extends\
    \ SimpleTagSupport {\n    public void doTag() throws JspException, IOException\
    \ {\n        JspWriter out = getJspContext().getOut();\n        out.println(\"\
    This is my own tag\");\n    }\n}\n```\n\n### TLD File\n\nThis file should present\
    \ at the location: `Project Name/WebContent/WEB-INF/` and it should have a `.tld`\
    \ extension.\n\n**Note:**\n- `<name>`: custom tag name. In this example we have\
    \ given it as `MyMsg`.\n- `<tag-class>`: Fully qualified class name. Our tag handler\
    \ class `Details.java` is in package `javabook.com` so we have given the value\
    \ as `javabook.com.Details`.\n\n**message.tld**\n```xml\n<taglib>\n  <tlib-version>1.0</tlib-version>\n\
    \  <jsp-version>2.0</jsp-version>\n  <short-name>My Custom Tag</short-name>\n\
    \  <tag>\n    <name>MyMsg</name>\n    <tag-class>javabook.com.Details</tag-class>\n\
    \    <body-content>empty</body-content>\n  </tag>\n</taglib>\n```\n\n### Using\
    \ custom tag in JSP\n\nAbove we have created a custom tag named `MyMsg`. Here\
    \ we will be using it.\n\n**Note:** The `taglib` directive should have the TLD\
    \ file path in `uri` field. Above we have created the `message.tld` file so we\
    \ have given the path of that file. Choose any prefix and specify it in `taglib`\
    \ directive’s `prefix` field. Here we have specified it as `myprefix`.\n"
