  trans: "\n\n# 结合示例详解 Servlet 接口\n\n在我上关于 Servlet API 的指南中，我已经解释了要创建任何 Servlet，你必须直接或间接地实现\
    \ `Servlet` 接口（间接实现意味着扩展实现了 `Servlet` 接口的类，这些类是 `GenericServlet` 和 `HttpServlet`）。\n\
    \n如果你正在创建一个依赖于协议的 servlet（例如 `http servlet`），那么你应该扩展 `HttpServlet` 类；否则，对于协议无关的\
    \ `Servlet`，你扩展 `GenericServlet` 类。\n\n在本份指南中，我将不会详细解释 `GenericServlet` 和 `HttpServlet`，因为我已经在单独的指南中涵盖了它们。\n\
    \n编辑：这里是那些指南的链接：GenericServlet | HttpServlet。\n\n简而言之，你有 3 种创建 servlet 的方式：\n\n\
    1) 扩展 `HttpServlet` 类\n2) 扩展 `GenericServlet` 类\n3) 实现 `Servlet` 接口\n\n注意：无论如何，你应该始终优先第一种创建\
    \ servlet 的方式，即通过扩展 `HttpServlet` 类。\n\n## Servlet 接口方法\n\n这里是 `Servlet` 接口可用方法列表。\n\
    \n1) `Void destroy()`：此方法由 Servlet 容器在 servlet 生命周期。结束时调用。与在生命周期内被调用多次的 `service()`\
    \ 方法不同，此方法在整个生命周期内由 Servlet 容器调用一次。一旦 `destroy()` 方法被调用，Servlet 容器就不会为该 servlet\
    \ 调用 `service()` 方法。\n\n2) `Void init(ServletConfig config)`：当 Servlet 容器启动时（发生在\
    \ Web 服务器启动时），它会加载所有 servlet 并实例化它们。在对每个实例化的 servlet 调用 `init()` 方法后，该方法将初始化该\
    \ servlet。\n\n3) `Void service(ServletRequest req, ServletResponse res)`：这是 servlet\
    \ 生命周期期间唯一被调用多次的方法。此方法处理客户端请求，每当服务器接收到请求就会调用一次。\n\n4) `ServletConfig getServletConfig()`：返回一个\
    \ `ServletConfig` 对象，该对象包含此 servlet 的初始化和启动参数。\n\n5) `Java.lang.String getServletInfo()`：返回关于\
    \ servlet 信息，如作者、版本和版权。\n\n## 示例：\n\n在这个示例中，我们通过扩展 `Servlet` 接口创建了一个 servlet 类。\n\
    \n### index.html\n```html\n<a href=\"welcome\">点击这里调用 servlet</a>\n```\n\n###\
    \ DemoServlet.java\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\npublic\
    \ class DemoServlet implements Servlet {\n\n    ServletConfig config=null;\n\n\
    \    public void init(ServletConfig config) {\n        this.config=config;\n \
    \       System.out.println(\"Initialization complete\");\n    }\n\n    public\
    \ void service(ServletRequest req,ServletResponse res)\n            throws IOException,ServletExceptionException\
    \ {\n        res.setContentType(\"text/html\");\n        PrintWriter pwriter=res.getWriter();\n\
    \        pwriter.print(\"<html>\");\n        pwriter.print(\"<body>\");\n    \
    \    pwriter.print(\"<h1>Servlet Example Program</h1>\");\n        pwriter.print(\"\
    </body>\");\n        pwriter.print(\"</html>\");\n    }\n\n    public void destroy()\
    \ {\n        System.out.println(\"servlet life cycle finished\");\n    }\n\n \
    \   public ServletConfig getServletConfig() {\n        return config;\n    }\n\
    \n    public String getServletInfo() {\n        return \"A Demo program written\
    \ by Chandru\";\n    }\n}\n```\n\n### web.xml\n```xml\n<web-app>\n<servlet>\n\
    \    <servlet-name>Javabook</servlet-name>\n    <servlet-class>DemoServlet</servlet-class>\n\
    </servlet>\n<servlet-mapping>\n    <servlet-name>Javabook</servlet-name>\n   \
    \ <url-pattern>/welcome</url-pattern>\n</servlet-mapping>\n</web-app>\n```\n\n\
    ## GenericServlet 类\n\n### 示例的 GenericServlet 类\n\n在讨论 Servlet API 时，我简要提到了 Generic\
    \ Servlet。在本文，我将详细讨论 Generic Servlet。\n\nGeneric servlet 是一种协议无关的 Servlet，它应该始终重写\
    \ `service()` 方法来处理客户端请求。`service()` 方法接受两个参数：`ServletRequest` 对象和 `ServletResponse`\
    \ 对象。请求对象告诉 servlet 客户端提出的请求，而响应对象则用于向客户端返回响应。\n\n### Generic Servlet 如何工作？\n\n\
    ![](img/image00422.jpeg)\n\n### Generic Servlet 的层级结构\n`java.lang.Object`\n|_\
    \ 扩展 `javax.servlet.GenericServlet`\n\n`GenericServlet` 是一个抽象类，它只有一个抽象方法，即 `service()`。这就是为什么当我们通过扩展\
    \ `GenericServlet` 类创建 Generic Servlet 时，我们必须重写 `service()` 方法。\n\n**使用 Generic\
    \ Servlet 的优点：**\n1. Generic Servlet 更更容易编写\n2. 具有简单的生命周期方法\n3. 编写 Generic Servlet\
    \ 只需要扩展 `javax.servlet.GenericServlet` 并重写 `service()` 方法（查看下例所示）。\n\n**使用 Generic\
    \ Servlet 的缺点：**\n使用 Generic Servlet 并不那么简单，因为在 Generic Servlet 中我们没有像在 Http Servlet\
    \ 中可以使用的那些 `doGet()`、`doPost()`、`doHead()` 等便利方法。 \n\n在 `HttpServlet` 中，我们需要为特定的请求重写特定的便利方法，例如，如果你需要获取信息，则重写\
    \ `doGet()`；如果你想向服务器发送信息，则重写 `doPost()`。然而，在 Generic Servlet 中，我们只为每个请求重写 `service()`\
    \ 方法。我始终建议使用 `HttpServlet` 而不是 `GenericServlet`。\n\n### GenericServlet 示例\n\n\
    我在示例中使用 Eclipse。从 Eclipse 菜单创建“Dynamic Web Project”。\n\n注意：返回 Servlet Interface\n\
    注意：如果你不熟悉 Eclipse，参考此指南：如何安装 Eclipse\n\n完成创建文件后，项目结构如下：\n![](img/image423)\n\n\
    ### index.html\n我们创建一个点击网页链接时调用 servlet 的 html 文件。在 `WebContent` 文件夹中创建此文件。文件的路径应该是：`WebContent/index.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Http\
    \ Servlet Demo</title>\n</head>\n<body>\n<a href=\"welcome\">Servlet</a>\n</body>\n\
    </html>\n```\n\n### ExampleGeneric.java\n现在，我们通过扩展 `GenericServlet` 类创建一个 Generic\
    \ Servlet。创建 GenericServlet 时，你应该始终重写 `service()` 方法。右键点击 `src` 文件夹并创建一个新类，文件名命名为\
    \ `ExampleGeneric`。文件路径应该是：`Java Resources/src/default package/ExampleGeneric.java`\n\
    \n```java\nimport java.io.*;\nimport javax.servlet.*;\n\npublic class ExampleGeneric\
    \ extends GenericServlet {\n\n    public void service(ServletRequest req,ServletResponse\
    \ res) throws IOException, ServletException {\n        res.setContentType(\"text/html\"\
    );\n        PrintWriter pwriter=res.getWriter();\n        pwriter.print(\"<html>\"\
    );\n        pwriter.print(\"<body>\");\n        pwriter.print(\"<h2>Generic Servlet\
    \ Example</h2>\");\n        pwriter.print(\"<p>Hello JavaBook Readers!</p>\");\n\
    \        pwriter.print(\"</body>\");\n        pwriter.print(\"</html>\");\n  \
    \  }\n}\n```\n\n### web.xml\n此文件位于路径 `WebContent/WEB-INF/web.xml`。在此文件中，我们将 Servlet\
    \ 映射到特定的 URL。由于点击 `index.html` 页面上的链接会调用欢迎页面，因此我们将欢迎页面映射到我们创建的 Servlet 类。\n\n\
    ```xml\n<web-app>\n<display-name>JavaBookServlet</display-name>\n<welcome-file-list>\n\
    <welcome-file>index.html</welcome-file>\n<welcome-file>index.htm</welcome-file>\n\
    <welcome-file>index.jsp</welcome-file>\n<welcome-file>default.html</welcome-file>\n\
    </welcome-file-list>\n</web-app>\n```\n"
