    Before we proceed further let us understand what is dynamic web application? A
    web application can be described as collection of web pages (e.g. a website) and
    when we call it dynamic, it simply means that the web pages are not same for all
    the users, web pages would be generated on server side based on the request made
    by client(user’s browser).


    The main difference between static and dynamic web page is that static page as
    name suggests remains same for all users however a dynamic web page changes based
    on the request from client (user’s browser). For example, consider a web application
    that shows you two input fields & an add button and when you enter two numbers
    and click add, it shows you another web page that has the result of addition of
    two numbers, this web application is dynamic in nature as the second web page
    that shows you the result changes based on the user input, it is not static for
    all users.


    However you can very well say that what a servlet does can be done by CGI (Common
    Gateway Interface), well its true but here is the thing – CGI has several limitations
    such as performance, scalability, reusability etc. that a servlet does not have.
    I am not going to discuss CGI in detail but I am going to tell you, how a servlet
    is better than CGI.


    ## Limitations of CGI


    Server has to create a new CGI process for every client request. For example,
    If 100 users are accessing the web application, then the server has to create
    100 CGI processes to handle the request made by them. Since a server has limited
    resources, creating new process every time for a new request is not a viable option,
    this imposed the limitation on server, due to that the server cannot handle more
    than a specified number of users at the same time.


    ## How Servlet is better than CGI


    CGI programs are handled by a new process every time a new request has been made.
    Unlike CGI, the servlet programs are handled by separate threads that can run
    concurrently more efficiently.


    CGI program can be written in any programming language that makes it mostly platform
    dependent as not all programming languages are platform independent. Servlet only
    uses Java as programming language that makes it platform independent and portable.
    Another benefit of using java is that the servlet can take advantage of the object
    oriented programming features of java.


    ### How Servlet Works


    As I mentioned above that concurrent requests to the server are handled by threads,
    here is the graphical representation of the same –


    ![](Images/image00418.jpeg)


    ## Features of Servlet


    Now that we have understood what is a servlet and for what purpose it is being
    used. Let’s proceed further and discuss its main features.


    1. **Portable**:

    As I mentioned above that Servlet uses Java as a programming language, Since java
    is platform independent, the same holds true for servlets. For example, you can
    create a servlet on Windows operating system that users GlassFish as web server
    and later run it on any other operating system like Unix, Linux with Apache tomcat
    web server, this feature makes servlet portable and this is the main advantage
    servlet has over CGI.


    2. **Efficient and scalable**:

    Once a servlet is deployed and loaded on a web server, it can instantly start
    fulfilling request of clients. The web server invokes servlet using a lightweight
    thread so multiple client requests can be fulling by servlet at the same time
    using the multithreading feature of Java. Compared to CGI where the server has
    to initiate a new process for every client request, the servlet is truly efficient
    and scalable.


    3. **Robust**:

    By inheriting the top features of Java (such as Garbage collection, Exception
    handling, Java Security Manager etc.) the servlet is less prone to memory management
    issues and memory leaks. This makes development of web application in servlets
    secure and less error prone.


    # Servlet API


    You need to use Servlet API to create servlets. There are two packages that you
    must remember while using API, the `javax.servlet` package that contains the classes
    to support generic servlet (protocol-independent servlet) and the `javax.servlet.http`
    package that contains classes to support http servlet. You may be wondering what
    is generic and http servlet, I have explained them later in this post.


    Let us see the hierarchy of packages:


    `java.lang.Object`

    |_extended by `javax.servlet.GenericServlet`

    |_extended by `javax.servlet.http.HttpServlet`


    Every Servlet must implement the `java.servlet.Servlet` interface, you can do
    it by extending one of the following two classes: `javax.servlet.GenericServlet`
    or `javax.servlet.http.HttpServlet`. The first one is for protocol independent
    Servlet and the second one for http Servlet.


    ### How servlet works?


    ![](Images/image00419.jpeg)


    ## Generic Servlet


    As I mentioned above, if you are creating a Generic Servlet then you must extend
    `javax.servlet.GenericServlet` class. GenericServlet class has an abstract `service()`
    method. Which means the subclass of GenericServlet should always override the
    `service()` method.


    Signature of `service()` method:


    ```java

    public abstract void service(ServletRequest request, ServletResponse response)
    throws ServletException, java.io.IOException

    ```


    The `service()` method accepts two arguments `ServletRequest` object and `ServletResponse`
    object. The request object tells the servlet about the request made by client
    while the response object is used to return a response back to the client.


    ![](Images/image00420.jpeg)


    ## HTTP Servlet


    If you creating Http Servlet you must extend `javax.servlet.http.HttpServlet`
    class, which is an abstract class. Unlike Generic Servlet, the HTTP Servlet doesn’t
    override the `service()` method. Instead it overrides one or more of the following
    methods. It must override at least one method from the list below:


    *   `doGet()` – This method is called by servlet service method to handle the
    HTTP GET request from client. The Get method is used for getting information from
    the server.

    *   `doPost()` – Used for posting information to the server.

    *   `doPut()` – This method is similar to doPost method but unlike doPost method
    where we send information to the server, this method sends file to the server,
    this is similar to the FTP operation from client to server.

    *   `doDelete()` – allows a client to delete a document, webpage or information
    from the server.

    *   `init()` and `destroy()` – Used for managing resources that are held for the
    life of the servlet.

    *   `getServletInfo()` – Returns information about the servlet, such as author,
    version, and copyright.


    In Http Servlet there is no need to override the `service()` method as this method
    dispatches the Http Requests to the correct method handler, for example if it
    receives HTTP GET Request it dispatches the request to the `doGet()` method.


    ![](Images/image00421.jpeg)


    ### Interfaces in javax.servlet


    *   `Servlet`

    *   `ServletRequest`

    *   `ServletResponse`

    *   `ServletConfig`

    *   `ServletContext`

    *   `SingleThreadModel`

    *   `RequestDispatcher`

    *   `ServletRequestListener`

    *   `ServletRequestAttributeListener`

    *   `ServletContextListener`

    *   `ServletContextAttributeListener`

    *   `Filter`

    *   `FilterConfig`

    *   `FilterChain`


    ### Classes in javax.servlet


    *   `GenericServlet`

    *   `ServletInputStream`

    *   `ServletOutputStream`

    *   `ServletException`

    *   `ServletRequestWrapper`

    *   `ServletRequestEvent`

    *   `ServletResponseWrapper`

    *   `ServletContextEvent`

    *   `ServletRequestAttributeEvent`

    *   `ServletContextAttributeEvent`

    *   `UnavailableException`


    ### Interfaces in javax.servlet.http


    *   `HttpSession`

    *   `HttpServletRequest`

    *   `HttpServletResponse`

    *   `HttpSessionAttributeListener`

    *   `HttpSessionListener`

    *   `HttpSessionBindingListener`

    *   `HttpSessionActivationListener`

    *   `HttpSessionContext`


    ### Classes in javax.servlet.http


    *   `HttpServlet`

    *   `Cookie`

    *   `HttpSessionEvent`

    *   `HttpSessionBindingEvent`

    *   `HttpServletRequestWrapper`

    *   `HttpServletResponseWrapper`

    *   `HttpUtils`

    '
