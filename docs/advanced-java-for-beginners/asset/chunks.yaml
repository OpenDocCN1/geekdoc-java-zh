  trans: "\n\n4. `protected void doPost(HttpServletRequest req, HttpServletResponse\
    \ resp)`: 此方法由 servlet 服务方法调用，用于处理来自客户端的 POST 请求。HTTP POST 方法允许客户端一次向 Web 服务器发送无长度限制的数据，在向服务器提交信息时非常有用。与我们从服务器获取信息的\
    \ `doGet` 不同，此方法用于将信息从客户端传输到服务器。\n\n5. `protected void doPut(HttpServletRequest\
    \ req, HttpServletResponse resp)`: 此方法由 servlet 服务方法调用，用于处理来自客户端的 PUT 请求。此方法与\
    \ `doPost` 方法类似，但与向服务器发送信息的 `doPost` 方法不同的是，此方法是将文件发送到服务器，这类似于从客户端到服务器的 FTP 操作。\n\
    \n6. `protected void doDelete(HttpServletRequest req, HttpServletResponse resp)`:\
    \ 由 `service()` 方法调用，处理来自客户端的 DELETE 请求，允许客户端从服务器删除文档、网页或信息。\n\n7. `protected\
    \ void doOptions(HttpServletRequest req, HttpServletResponse resp)`: 由服务方法调用，允许\
    \ servlet 处理 OPTIONS 请求。OPTIONS 请求确定服务器支持哪些 HTTP 方法并返回相应的头信息。\n\n8. `protected\
    \ void doTrace(HttpServletRequest req, HttpServletResponse resp)`: 此方法由 `service()`\
    \ 方法调用以处理 TRACE 请求。用于调试。\n\n9. `protected void service(HttpServletRequest req,\
    \ HttpServletResponse resp)`: 无需重写此方法，此方法接收来自客户端的 HTTP 请求并将其转发到相应的 `doXXX` 方法，如\
    \ `doGet()`、`doPost()`、`doHead()` 等。\n\n10. `public void service(ServletRequest\
    \ req, ServletResponse res)`: 将客户端请求转发到保护的 service 方法。此方法也无需重写。\n\n# 注意\n\n从此处返回\n\
    \nServlet 接口\n\n# 如何在 Eclipse IDE 中创建和运行 Servlet\n\n这是一份关于安装 Eclipse、配置 apache\
    \ tomcat 服务器以及运行你的第一个 hello world Servlet 应用程序的完整指南。\n\n## 注意\n\n从此处返回：\n\nGeneric\
    \ Servlet\n\nHttpServlet 类\n\n## 下载 Eclipse IDE\n\n### 在 Windows 上安装 Eclipse\n\
    \n访问此链接 `https://www.eclipse.org/downloads`。在“Get Eclipse Oxygen”下❯点击“Download\
    \ Packages”❯下载“Eclipse IDE for Java Developers”。你会在右侧看到两个选项（32 位和 64 位），如果你的系统是\
    \ 32 位的点击 32 位，否则点击 64 位。这将在系统上下载一个压缩文件。\n\n要安装 Eclipse，解压下载的文件并将解压后的文件夹复制到目标位置。\n\
    \n### 在 Mac OS X 上安装 Eclipse\n\n访问此链接 `https://www.eclipse.org/downloads`。在“Get\
    \ Eclipse Oxygen”下❯点击“Download Packages”❯下载“Eclipse IDE for Java Developers”。点击\
    \ 64 位即可下载一个 TAR 文件。\n\n下载完成后，双击 TAR 文件，它会将文件内容提取到文件夹。将该文件夹拖到“Applications”文件夹。\n\
    \n要启动 Eclipse，点击 Eclipse 文件夹中的 Eclipse 图标。Mac 用户可以将其拖到 dock 栏区域，以便从桌面上快速启动 Eclipse；类似地，Windows\
    \ 可以在桌面上创建 Eclipse 的快捷方式。\n\n## 在 Eclipse 中安装和配置 Apache tomcat 服务器\n\n为了在 Eclipse\
    \ IDE 中运行 Servlet，你需要在 Eclipse IDE 中配置 Apache tomcat 服务器。\n\n如果你还没有，请参考此教程：如何在\
    \ Eclipse IDE 中下载和配置 Apache Tomcat 服务器\n\n注意：我上面提供的链接属于 JSP 教程，但对于 Servlet 步骤是相同的。\n\
    \n## 在 Eclipse IDE 中创建 Servlet\n\n### 第 1 步：创建项目\n\n让我们在 Eclipse 中创建一个 Servlet\
    \ 应用程序。打开 Eclipse，点击 File（文件）❯New（新建）❯点击 Dynamic Web Project（动态 Web 项目）。\n\n![](img/image00427.jpeg)\n\
    \n如果你在 Eclipse 中没有看到 dynamic web project 选项，请参考此教程：如何解决 Eclipse 中缺少“Dynamic Web\
    \ project”的问题](#part0000.xhtml_dynammic)\n\n输入项目名称并点击 Next（下一步）。\n\n![输入项目名称](img/image00428.jpeg)\n\
    \n勾选“Generate web.xml deployment descriptor”复选框。\n\n![生成 web xml](img/image00429.jpeg)\n\
    \n####初始项目结构：\n\n项目创建后，层次结构（项目结构）将如下：\n\n![Eclipse 中的初始项目层次结构](img/image00430.jpeg)\n\
    \n### 第 2 步：创建 Servlet 类\n\n我们通过扩展 `HttpServlet` 类来创建 Http Servlet。右键点击 `src`\
    \ 文件夹并创建一个新的类文件，文件名命名为 `MyServletDemo`。文件路径应如下：`Java Resources/src/default package/MyServletDemo.java`。\n\
    \n![新建 Servlet 类](img/image00431.jpeg)\n\n#### MyServletDemo.java\n\n```java\n\
    import java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\n//\
    \ 扩展 HttpServlet 类创建 Http Servlet\npublic class MyServletDemo extends HttpServlet\
    \ {\n    private String mymsg;\n\n    public void init() throws ServletException\
    \ {\n        mymsg = \"Hello World!\";\n    }\n\n    public void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n        throws ServletException, IOException\
    \ {\n        // 设置网页的类型类型\n        response.setContentType(\"text/html\");\n \
    \       // 将消息写入网页\n        PrintWriter out = response.getWriter();\n        out.println(\"\
    <h1>\" + mymsg + \"</h1>\");\n    }\n\n    public void destroy() {\n        /*\
    \ 留空，当 Servlet 生命周期\n         * 结束时需要执行某些操作\n         */\n    }\n}\n```\n\n###\
    \ 第 3 步：创建一个 html 页面来调用 servlet 类\n\n我们创建一个在网页上调用 servlet 的 html 文件。将此文件创建在 `WebContent`\
    \ 文件夹中。文件的路径应该是：`WebContent/index.html`。\n\n#### index.html\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <meta charset=\"UTF-8\">\n    <title>JavaBook Demo</title>\n\
    </head>\n<body>\n    <a href=\"welcome\">调用 Servlet</a>\n</body>\n</html>\n```\n\
    \n#### 编辑 web.xml 文件\n\n此文件位于 `WebContent/WEB-INF/web.xml`。在此文件中我们将 Servlet 映射到特定\
    \ URL。由于我们在 index.html 页面点击链接进入欢迎页面，因此我们将欢迎页面映射到创建的 Servlet 类。\n\n```xml\n<web-app>\n\
    \    <display-name>JavaBookDemo</display-name>\n    <welcome-file-list>\n    \
    \    <welcome-file>index.html</welcome-file>\n        <welcome-file>index.htm</welcome-file>\n\
    \        <welcome-file>index.jsp</welcome-file>\n        <welcome-file>default.html</welcome-file>\n\
    \        <welcome-file>default.htm</welcome-file>\n        <welcome-file>default.jsp</welcome-file>\n\
