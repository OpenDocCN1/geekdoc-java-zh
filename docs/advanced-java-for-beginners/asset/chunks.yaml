  trans: "\n在本示例中，我们对两个字符串应用此函数——其中是一个字符串变量，另一个是作为参数传递给函数的硬编码字符串。如你在输出中所看到的，它已将变量值和硬编码字符串的值替换为小写。代码块之后提供了输出的截图。\n\
    \n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n<html>\n\
    <head>\n<title>fn:toLowerCase() example</title>\n</head>\n<body>\n<c:set var=\"\
    message\" value=\"This is An Example of JSTL Function\"/>\n${fn:toLowerCase(message)}\n\
    ${fn:toLowerCase(\"HELLO\")}\n</body>\n</html>\n```\n\n输出:\nThis is an Example\
    \ of jstl function hello\n\n## 15. `fn:replace()`\n`fn:replace()` 函数在输入中搜索一个字符串，并将其替换为所提供的字符串。它执行的是大小写敏感的处理。\n\
    \n# `fn:replace()` – JSTL 函数\n\n它在输入中搜索一个字符串，并将其替换为所提供的字符串。以下是 `fn:replace()`\
    \ 函数的基本语法。\n\n### 语法\n`String fn:replace(String input, String search_for, String\
    \ replace_with)`\n\n包含三个字符串参数，返回值类型也是 `String`。它在 `input` 中搜索 `search_for` 字符串并将其替换为\
    \ `replace_with` 字符串。如果未找到该字符串，则原样返回输入。\n\n**注意：** 它执行的是大小写敏感的处理。\n\n### 示例\n\
    在本示例中，我们对两个输入字符串使用了 `fn:replace()` 函数。\n\n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\" prefix=\"\
    fn\" %>\n<html>\n<head>\n<title>JSTL fn:replace() example</title>\n</head>\n<body>\n\
    <c:set var=\"author\" value=\"Chandru Babu\"/>\n<c:set var=\"randomstring\" value=\"\
    abc def abc ghi ABC\"/>\n${fn:replace(author, \"Chandru\", \"Rahul\")}\n${fn:replace(randomstring,\
    \ \"abc\", \"hello\")}\n</body>\n</html>\n```\n\n输出:\nRahul Babu hello def hello\
    \ ghi ABC\n\n观察输出你会发现 `randomstring` 变量中的 “ABC” 保持不变，而其他的 “abc” 子字符串被替换为了 “hello”。这是由于大小写敏感匹配导致的，在上面的示例中，我们替换的是小写的\
    \ “abc”。\n\n# JSON 教程\n### JSON 教程：10 分钟学习 JSON\n\nJSON 代表 JavaScript 对象表示法（JavaScript\
    \ Object Notation）。JSON 对象用于在服务器和客户端之间传输数据，XML 具有相同的目的。然而，JSON 对象相比 XML 具有许多优势，我们将在本教程中讨论这些优势，并介绍\
    \ JSON 的概念和它的用法。\n\n让我们来看这段 JSON 数据：它基本上由键值值对组成。\n\n```javascript\nvar chandru\
    \ = {\n \"firstName\" : \"Chandru\",\n \"lastName\" : \"babu\",\n \"age\" :\"\
    28\"\n};\n```\n\n#### JSON 的特性：\n* 它是轻量级的\n* 它是语言无关的\n* 易于读写\n* 基于文本的、人类可读的数据交换格式\n\
    \n## 为什么使用 JSON？\n**标准结构：** 正如我们所看到的，JSON 对象具有标准的结构，这使得开发者编写和阅读代码的工作变得更容易，因为他们知道从\
    \ JSON 中期望什么。\n\n**轻量级：** 在使用 AJAX 时，快速且异步地加载数据而不请求页面刷新是至关重要的。由于 JSON 是轻量级的，因此更容易快速获取并加载所请求的数据。\n\
    \n**可扩展性：** JSON 是语言无关的，这意味着它可以与大多数现代编程语言良好协作。假设我们需要更改服务器端语言，在这种情况下，对我们来说更容易更改，因为\
    \ JSON 结构对于所有语言都是相同的。\n\n## JSON vs XML\n让我们看看当以文本格式存储 4 个学生的记录时，JSON 和 XML 看起来是什么样，以便以后需要时检索它们。\n\
    \n**JSON 样式：**\n```json\n{\"students\":[\n  {\"name\":\"John\", \"age\":\"23\"\
    , \"city\":\"Agra\"},\n  {\"name\":\"Steve\", \"age\":\"28\", \"city\":\"Delhi\"\
    },\n  {\"name\":\"Peter\", \"age\":\"32\", \"city\":\"Chennai\"},\n  {\"name\"\
    :\"Chandru\", \"age\":\"28\", \"city\":\"Bangalore\"}\n]}\n```\n\n**XML 样式：**\n\
    ```xml\n<students>\n <student>\n <name>John</name> <age>23</age> <city>Agra</city>\n\
    \ </student>\n <student>\n <name>Steve</name> <age>28</age> <city>Delhi</city>\n\
    \ </student>\n <student>\n <name>Peter</name> <age>32</age> <city>Chennai</city>\n\
    \ </student>\n <student>\n <name>Chandru</name> <age>28</age> <city>Bangalore</city>\n\
    \ </student>\n</students>\n```\n如你清楚看到的，JSON 远要轻量得多。\n\n## JSON 数据结构以及如何读取它们：\n\
    ### 1. JSON 对象\n在上面的示例中，我们将信息存储了一个对象：\n```javascript\nvar chandru = {\n \"name\"\
    \ : \"Chandru\",\n \"age\" : \"28\",\n \"website\" : \"Javabook\"\n};\n```\n要从对象中访问信息，我们这样做：\n\
    ```javascript\ndocument.writln(\"The name is: \" + chandru.name);\ndocument.writln(\"\
    his age is: \" + chandru.age);\ndocument.writln(\"his website is: \"+ chandru.website);\n\
    ```\n\n### 2. 数组中的 JSON 对象\n假设我们想存储多个人的信息，我们可以有一个数组：\n```javascript\nvar students\
    \ = [{\n \"name\" : \"Steve\",\n \"age\" : \"29\",\n \"gender\" : \"male\"\n},\n\
    {\n \"name\" : \"Peter\",\n \"age\" : \"32\",\n \"gender\" : \"male\"\n},\n{\n\
    \ \"name\" : \"Sophie\",\n \"age\" : \"27\",\n \"gender\" : \"female\"\n}];\n\
    ```\n要访问数组，我们这样做：\n```javascript\ndocument.writeln(students[0].age); //输出应为 29\n\
    ```\n\n### 3. JSON 对象的嵌套\n另一种实现上面相同功能的方法：\n```javascript\nvar students = {\n \"\
    steve\" : {\n \"name\" : \"Steve\",\n \"age\" : \"29\",\n \"gender\" : \"male\"\
    \n },\n\"pete\" : {\n \"name\" : \"Peter\",\n \"age\" : \"32\",\n \"gender\" :\
    \ \"male\"\n },\n\"sop\" : {\n \"name\" : \"Sophie\",\n \"age\" : \"27\",\n \"\
    gender\" : \"female\"\n }\n}\n```\n像这样访问上面的嵌套对象：\n```javascript\ndocument.writln(students.steve.age);\
    \ //输出: 29\ndocument.writeln(students.sop.gender); //输出: female\n```\n\n## JSON\
    \ 与 JavaScript\nJSON 被认为是 JavaScript 的子集但这并不意味着 JSON 不能与其他语言一起。事实上，它可以与 PHP、Perl、Python、Ruby、Java\
    \ 和 Ajax 等许多语言配合良好。\n\n为了演示如何结合 JavaScript 使用 JSON，这里有一个示例：\n如果你学过上面的教程，你就熟悉 JSON\
    \ 结构。JSON 文件类型为 .json\n\n如何从 json 文件读取数据并转换为 JavaScript 对象？\n有两种方法：\n\n1. 使用 `eval`\
    \ 函数，但由于安全原因不建议这样做（恶意数据可以从服务器发送到客户端，然后在客户端脚本的 `eval` 中产生有害影响）。\n2. 使用 `JSON.parse`：没有安全问题，而且比\
    \ `eval` 快。以下是使用方法：\n```javascript\nvar chandru = {\n\"name\" : \"Chandru\",\n\
    \"age\" : \"28\",\n\"website\" : \"Javabook\"\n};\n```\n我们使用 `JSON.parse` 将上面的\
    \ JSON 对象转换为 JavaScript 对象：\n```javascript\nvar myJSObject = JSON.parse(chandru);\n\
    ```\n\n# SERVLET 教程\n### Servlet 简介\nServlet 是运行在 Web 服务器 JVM 上的 Java 程序。它被用于开发动态\
    \ Web 应用程序。\n\n"
