    \    <url-pattern>/welcome</url-pattern>\n  </servlet-mapping>\n</web-app>\n```\n\
    \nRun the project:\n\nRight click on the `index.html`, run on server.\n\nOutput:\n\
    \n![](Images/image00424.jpeg)\n\n# Screen after you click the link in first screen:\n\
    \n# Generic Servlet Example\n\n# Hello Javabook Readers\n\n## Methods of GenericServlet\
    \ class:\n\nHere is the list of all the methods of `GenericServlet` class.\n\n\
    1. `public void init()`: it is a convenient method. This method can be overridden\
    \ so that there’s no need to call `super.init(config)`.\n2. `public void init(ServletConfig\
    \ config)`: Called by the servlet container to indicate that the servlet is being\
    \ placed into service, this method is used for initializing the servlet.\n3. `public\
    \ String getInitParameter(String name)`: Returns a String containing the value\
    \ of the given initialization parameter, or null if the parameter does not exist.\n\
    4. `public Enumeration getInitParameterNames()`: Returns the names of all parameters\
    \ defined in the `web.xml` file or null if `web.xml` doesn’t have any parameter.\n\
    5. `public abstract void service(ServletRequest request, ServletResponse response)`:\
    \ Called by the Servlet container to allow servlet to respond to the requests\
    \ made by client.\n6. `public void destroy()`: It is called by servlet container\
    \ once at the end of servlet life cycle to indicate that servlet is being destroyed.\n\
    7. `public ServletConfig getServletConfig()`: Return the `ServletConfig` object\
    \ that initialized this servlet.\n8. `public String getServletInfo()`: Returns\
    \ information about servlet.\n9. `public ServletContext getServletContext()`:\
    \ Return `ServletContext` object, passed to this servlet by the `init` method.\n\
    10. `public String getServletName()`: Returns the name of the servlet instance.\n\
    11. `public void log(String msg)`: Writes the given message in the servlet log\
    \ file.\n12. `public void log(String msg, Throwable t)`: Writes the explanatory\
    \ message in the servlet log file including a String that describes the error\
    \ or exception.\n\n## HttpServlet class with example\n\nUnlike `Generic Servlet`,\
    \ the `HTTP Servlet` doesn’t override the `service()` method. Instead it overrides\
    \ the `doGet()` method or `doPost()` method or both. The `doGet()` method is used\
    \ for getting the information from server while the `doPost()` method is used\
    \ for sending information to the server.\n\nIn `Http Servlet` there is no need\
    \ to override the `service()` method because this method dispatches the `Http\
    \ Requests` to the correct method handler, for example if it receives HTTP GET\
    \ Request it dispatches the request to the `doGet()` method.\n\n## How Http Servlet\
    \ works?\n\nAs you can see in the diagram below that client (user’s browser) make\
    \ requests. These requests can be of any type, for example – Get Request, Post\
    \ Request, Head Request etc. Server dispatches these requests to the servlet’s\
    \ `service()` method, this method dispatches these requests to the correct handler\
    \ for example if it receives Get requests it dispatches it to the `doGet()` method.\n\
    \n![](Images/image00425.jpeg)\n\n## Hierarchy of Http Servlet\n\n`java.lang.Object`\n\
    |_extended by `javax.servlet.GenericServlet`\n|_extended by `javax.servlet.http.HttpServlet`\n\
    \nI have already discussed in the Generic Servlet article that you should always\
    \ use `HttpServlet` instead of the `GenericServlet`. `HttpServlet` is easier to\
    \ work with, and has more methods to work with than `GenericServlet`.\n\n## Http\
    \ Servlet example\n\nI am using Eclipse IDE for this example. Create New “Dynamic\
    \ Web Project” from the Eclipse file menu.\n\nNote:I have explained all the steps\
    \ for creating Servlet in Eclipse IDE, however if you are unfamiliar with Eclipse\
    \ and don’t have it installed on your system then refer to this guide: [How to\
    \ Install Eclipse, configure tomcat and run your First Servlet Application using\
    \ Eclipse.](#part0000.xhtml_createndrun)\n\nProject structure (or you can hierarchy)\
    \ would look like this, once you are done creating all the following files in\
    \ IDE.\n\n![](Images/image00426.jpeg)\n\n### index.html\n\nWe are creating an\
    \ html file that would call the servlet once we click on the link on web page.\
    \ Create this file in `WebContent` folder. The path of the file should look like\
    \ this: `WebContent/index.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"UTF-8\">\n  <title>Http Servlet Demo</title>\n</head>\n<body>\n\
    \  <a href=\"welcome\">Click to call Servlet</a>\n</body>\n</html>\n```\n\n###\
    \ ExampleHttpServlet.java\n\nNow, we are creating a `Http Servlet` by extending\
    \ `HttpServlet` class. Right click on the `src` folder and create a new class\
    \ file, name the file as `ExampleHttpServlet`. The file path should look like\
    \ this: `Java Resources/src/default package/ExampleHttpServlet.java`.\n\n```java\n\
    import java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\n//\
    \ Creating Http Servlet by Extending HttpServlet class\n\npublic class ExampleHttpServlet\
    \ extends HttpServlet {\n    private String mymsg;\n\n    public void init() throws\
    \ ServletException {\n        mymsg = \"Http Servlet Demo\";\n    }\n\n    public\
    \ void doGet(HttpServletRequest request, HttpServletResponse response) throws\
    \ ServletException, IOException {\n        // Setting up the content type of web\
    \ page\n        response.setContentType(\"text/html\");\n        // Writing the\
    \ message on the web page\n        PrintWriter out = response.getWriter();\n \
    \       out.println(\"<h1>\" + mymsg + \"</h1>\");\n        out.println(\"<p>\"\
    \ + \"Hello Friends!\" + \"</p>\");\n    }\n\n    public void destroy() {\n  \
    \      // Leaving empty. Use this if you want to perform something at the end\
    \ of Servlet life.\n    }\n}\n```\n\n### web.xml\n\nThis file can be found at\
    \ `WebContent/WEB-INF/web.xml`. In this file we will map the Servlet with the\
    \ specific URL. Since we are calling welcome page upon clicking the link on index.html.\n\
    \n```xml\n<web-app>\n  <display-name>JavaBookServlet</display-name>\n  <welcome-file-list>\n\
    \    <welcome-file>index.html</welcome-file>\n    <welcome-file>index.htm</welcome-file>\n\
    \    <welcome-file>index.jsp</welcome-file>\n    <welcome-file>default.html</welcome-file>\n\
    \    <welcome-file>default.htm</welcome-file>\n    <welcome-file>default.jsp</welcome-file>\n\
    \  </welcome-file-list>\n  <servlet>\n    <servlet-name>MyHttpServlet</servlet-name>\n\
    \    <servlet-class>ExampleHttpServlet</servlet-class>\n  </servlet>\n  <servlet-mapping>\n\
    \    <servlet-name>MyHttpServlet</servlet-name>\n    <url-pattern>/welcome</url-pattern>\n\
    \  </servlet-mapping>\n</web-app>\n```\n\n## Methods of HttpServlet class:\n\n\
    1. `protected void doGet(HttpServletRequest req, HttpServletResponse resp)`: This\
    \ method is called by servlet service method to handle the HTTP GET request from\
    \ client. When overriding this method, read the request data, write the response\
    \ headers, get the response’s writer or output stream object, and finally, write\
    \ the response data.\n2. `protected long getLastModified(HttpServletRequest req)`:\
    \ Returns a long integer specifying the time the `HttpServletRequest` object was\
    \ last modified, in milliseconds since midnight, January 1, 1970 GMT, or -1 if\
    \ the time is not known.\n3. `protected void doHead(HttpServletRequest req, HttpServletResponse\
    \ resp)`: This method is called by servlet service method to handle the HTTP HEAD\
    \ request from client. The client sends a HEAD request when it wants to see only\
    \ the headers of a response, such as Content-Type or Content-Length.\n"
