    <a  href=\"display.jsp\">check attributes</a>\n</body>\n</html>\n```\n\n### display.jsp\n\
    \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\
    <c:out  value=\"${Site}\"/><br>\n<c:out  value=\"${author}\"  default=\"Attribute\
