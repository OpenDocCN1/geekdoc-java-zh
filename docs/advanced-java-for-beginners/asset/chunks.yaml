    JSP IMPLICIT OBJECTS\n\nJSP Implicit Objects\n\nJSP Implicit Objects\n\nThese\
    \ objects are created by JSP container while translating the JSP page to Servlet.\
    \ These objects are present inside service methods so we can directly use them\
    \ without declaration.\n\nJSP Implicit Objects\n\nThese objects are created by\
    \ JSP Engine during translation phase (while translating JSP to Servlet). They\
    \ are being created inside service method so we can directly use them within Scriptlet\
    \ without initializing and declaring them. There are total 9 implicit objects\
    \ available in JSP.\n\nImplicit Objects and their corresponding classes:\n\n|\
    \ Out | javax.servlet.jsp.JspWriter |\n\n| request | javax.servlet.http.HttpServletRequest\
    \ |\n\n| Response | javax.servlet.http.HttpServletResponse |\n\n| Session | javax.servlet.http.HttpSession\
    \ |\n\n| Application | javax.servlet.ServletContext |\n\n| Exception | javax.servlet.jsp.JspException\
    \ |\n\n| Page | java.lang.Object |\n\n| pageContext | javax.servlet.jsp.PageContext\
    \ |\n\n| Config | javax.servlet.ServletConfig |\n\nNote:\n\nGet back from here\n\
    \n[Expression language (EL) in JSP](#part0000.xhtml_EXPRESSIONLNG)\n\nOUT Implicit\
    \ Object\n\nOUT Implicit Object in JSP with examples\n\nIt’s an instance of javax.servlet.jsp.JspWriter.\
    \ This allows us to access Servlet output stream. The output which needs to be\
    \ sent to the client (browser) is passed through this object. In simple words\
    \ out implicit object is used to write content to the client.\n\nMethods of OUT\
    \ Implicit Object\n\n1) void print()\n\n2) void println()\n\n3) void newLine()\n\
    \n4) void clear()\n\n5) void clearBuffer()\n\n6) void flush()\n\n7) boolean isAutoFlush()\n\
    \n8) int getBufferSize()\n\n9) int getRemaining()\n\nLet us see each of the out’s\
    \ method in detail –\n\n1.Void print():  This method writes the value which has\
    \ been passed to it. For e.g. the below statement would display a sentence Out\
    \ Implicit Object in jSP – JavaBook to the output screen (client browser).\n\n\
    \ out.print(“Out  Implicit  Object  in jSP - JavaBook”);\n\n2.Void println():\
    \  This method is similar to the print() method, the only difference between print\
    \ and println is that the println() method adds a new line character at the end.\
    \ Let’s have a look at the difference with the help of an example.\n\nPrint:\n\
    \nout.print(“hi”);\n\n out.print(\" \");\n\n out.print(“hello”);\n\nOutput on\
    \ browser:  There will not be a new line between the outcomes of all 3 out.print\
    \ statements.\n\nhi hello\n\nprintln:\n\nout.println(“hi”);\n\n out.println(“hello”);\n\
    \nOutput on browser:\n\nhi\n\nhello\n\n3.Void newLine():  This method adds a new\
    \ line to the output. Example –\n\nout.print(“This will write content without\
    \ a new line”);\n\n out.newLine();\n\n out.print(“I’m just an another print statement”);\n\
    \nOutput:\n\nThis will write content without a new line\n\nI’m just an another\
    \ print statement\n\nAs you know print statement does not add a new line. We have\
    \ added a new line between two out.print statements using newLine() method.\n\n\
    4.Void clear(): It clears the output buffer without even letting it write the\
    \ buffer content to the client. This is how it can be called –\n\nout.clear();\n\
    \n5.Void clearBuffer(): This method is similar to the clear() method. The only\
    \ difference between them is that when we invoke out.clear() on an already flushed\
    \ buffer it throws an exception, however out.clearBuffer() doesn’t.\n\n6.Void\
    \ flush() : This method also clears the buffer just like clear() method but it\
    \ forces it to write the content to the output before flushing it, which means\
    \ whatever is there in buffer would be written to the client screen before clearing\
    \ the buffer.\n\n7.Boolean is AutoFlush() : It returns a Boolean value true/false.\
    \ It is used to check whether the buffer is automatically flushed or not.\n\n\
    8.Int getBufferSize():  This method returns the size of output buffer in bytes.\n\
    \n9.Int getRemaining():  It returns the number of bytes remaining before hitting\
    \ the buffer overflow condition.\n\nOUT Implicit Object Example\n\nIn this example\
    \ we are using print and println methods of OUT for displaying few message to\
    \ the client.\n\nindex.jsp\n\n<HTML>\n\n<HEAD>\n\n<TITLE> OUT IMPLICIT OBJECT\
    \ EXAMPLE </TITLE>\n\n</HEAD>\n\n<BODY>\n\n<%\n\nout.print( \"print statement\
    \ \" );\n\nout.println( \"println\" );\n\nout.print(\"Another print statement\"\
    );\n\n%>\n\n</BODY>\n\n</HTML>\n\nOutput:\n\nprintstatement println\n\nAnother\
    \ print statement\n\nRequest Implicit Object in JSP with examples\n\nMethods of\
    \ request Implicit Object\n\n1. GetParameter(String name)  – This method is used\
    \ to get the value of a request’s parameter. For example at login page user enters\
    \ user-id and password and once the credentials are verified the login page gets\
    \ redirected to user information page, then using request.getParameter we can\
    \ get the value of user-id and password which user has input at the login page.\n\
    \nString  Uid= request.getParameter(\"user-id\");\n\n String  Pass= request.getParameter(\"\
    password\");\n\n2. GetParameterNames()  – It returns enumeration of all the parameter\
    \ names associated to the request.\n\nEnumeration e= request.getParameterNames();\n\
    \n3. GetParameterValues(String name)  – It returns the array of parameter values.\n\
    \nString[] allpasswords = request.getParameterValues(\"password\");\n\n4.GetAttribute(Stringname)\
    \ – Used to get the attribute value.  request.getAttribute(“admin”) would give\
    \ you the value of attribute admin.\n\n5. GetAttributeNames()  – It is generally\
    \ used to get the attribute names associated to the current session. It returns\
    \ the enumeration of attribute names present in session.\n\nEnumerator e = request.getAttributeNames();\n\
    \n6. SetAttribute(String,Object)  – It assigns an object’s value to the attribute.\
    \ For example I have an attribute password and a String object str which has a\
    \ value “admin” then calling request.setAttribute(“password”, str) would assign\
    \ a value admin to the attribute password.\n\n7. RemoveAttribute(String)  – By\
    \ using this method a attribute can be removed and cannot be used further. For\
    \ e.g. If you have a statement request.removeAttribute(“userid”) on a JSP page\
    \ then the userid attribute would be completely removed and request.getAttribute(“userid”)\
    \ would return NULL if used after the removeAttribute method.\n\n8\\. GetCookies()\
    \ – It returns an array of cookie objects received from the client. This method\
    \ is mainly used when dealing with cookies in JSP.\n\n9\\. GetHeader(String name)\
    \ – This method is used to get the header information of the request.\n\n10.GetHeaderNames()\
    \ – Returns enumerator of all header names. Below code snippet would display all\
    \ the header names associated with the request.\n\nEnumeration e = request.getHeaderNames();\n\
    \n while (enumeration.hasMoreElements()) {\n\n String str = (String)e.nextElement();\n\
    \n out.println(str);\n\n             }\n\n11.GetRequestURI() – This method (request.getRequestURI())\
    \ returns the URL of current JSP page.\n\n12.GetMethod() – It returns HTTP request\
    \ method. request.getMethod(). For example it will return GET for a Get request\
    \ and POST for a Post Request.\n\n13.GetQueryString() – Used for getting the query\
    \ string associated to the JSP page URL. It is the string associated to the URL\
    \ after question mark sign (?).\n\nRequest Implicit Object Example\n\nIn the below\
    \ example we are receiving the input from user in index.html page and displaying\
    \ the same information in userinfo.jsp page using request implicit object.\n\n\
    index.html\n\n<html>\n\n<head>\n\n<title>Enter UserName and Password</title>\n\
    \n</head>\n\n<body>\n\n<form  action=\"userinfo.jsp\">\n\nEnter User Name: <input\
    \  type=\"text\"  name=\"uname\"  />  <br><br>\n\nEnter Password: <input  type=\"\
    text\"  name=\"pass\"  />  <br><br>\n\n<input  type=\"submit\"  value=\"Submit\
    \ Details\"/>\n\n</form>\n\n</body>\n\n</html>\n\nuserinfo.jsp\n\n<%@ page import\
    \ = \" java.util.* \" %>\n\n<html>\n\n<body>\n\n<%\n\nString username=request.getParameter(\"\
    uname\");"
