  md: 'There are, of course, many other emerging Native voices that deserve equal
    attention. Winners of recent First Books Awards from the Native Writers Circle
    of the Americas include, for prose, Kimberley (2005), distinctolo (Back to the
    Blanket 2004), Mia Heavern (Tundra Berries 2005), Judy R. Smith (Yellow Bird 2006)
    and Frederick White (Welcome to the City of Rainbows 2006). Winners of the poetry
    awards includes Christina M. Castro (Silence on the Rez 2004), Kathy Ruiz (Stirring
    up the Water 2004), Kim Shack (Smuggling Cherokee 2005) and Rebecca Hatcher Travis
    (Picked Apart the Bones 2006). In addition, many influential writers have necessarily,
    but very regrettably, been excluded, and the interested reader is therefore recommended
    to look at the writings of Diane Glance, Joy Harjo, Linda Hogan, LeAnne Howe,
    Thomas King, Carter Revard, Wendy Rose, Greg Sarris and Ofelia Zepeda, to name
    a few.


    Such a proliferation of Native writers and texts suggests an increased burgeoning
    of contemporary Native literature, with the continued availability of established
    markets drawing upon entrenched Euro-American fascinations with, and conceptualisations
    of, Native cultures. Additionally, recent writers — such as Erdrich, Alexie and
    Treave — created new readers and markets through the popular appeal of their literary
    strategies. Nonetheless, clear gender distinctions seem to be emerging in recent
    Native writings with regard to both literary strategies or topics and Euro-American
    markets. While recent writers by Native women have successfully tapped into the
    markets established by Third World feminism, ecofeminism and women writers of
    colour more generally, Native men have been forced to rely upon the appeal of
    genres and topics conventionally defined as ''male'' by the dominant discourse.
    While the erasure of a wider notion of Native men''s politics could have been
    highly detrimental, recent writings by Native men have, nonetheless, very successfully
    engaged with popular horror, thrillers and notions of ecocriticism. This form
    of cultural translation has ensured not only a Native male presence in mainstream
    American literature, but also an awareness and discussion of important social,
    cultural and political issues that are of concern to Native men.


    Most significantly, the titles of Native texts give ample evidence of Native writers''
    continued foci upon issues originally raised to the public attention more than
    two centuries ago by Indian writers such as Samson Occom and William Apes. In
    this sense, contemporary Native literature offers ongoing resistance to continued
    colonialism in order to'
  merge: -1
