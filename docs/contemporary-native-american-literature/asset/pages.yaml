  md: '# CHAPTER 4

    Writing Women: Louise Erdrich,

    Anna Lee Walters and

    Luci Tapahonso, 1980–2000


    The successes of the first wave of writers of the Native American Renaissance:
    Momaday, Welch and Silko all clearly ''wrote back'' to Euro-American literary
    traditions through their engagement with specific literary styles and concerns,
    even when they subverted these through their privileging of Native cultural practices
    and worldviews. Moreover, the fact that all three were also recognised by literary
    awards and prizes, not least of which Momaday''s Pulitzer, ensured that their
    writings became even more influential through a rapid incorporation into the American
    canon. The influence of Silko, in particular, is crucial to a whole range of subsequent
    Native women writers: Silko not only set a positive example as a highly successful
    female author but, while she discussed the alienation of the individual, she also
    carefully foregrounded the role of community in cultural re-integration. This
    emphasis upon the communal, often as an expansion of the family, is central to
    the development of Native women''s writing from the 1980s, which began to focus
    much more fully on the complex realities of Native women''s lives. This new generation
    of Native women writers were therefore, in every way, writing women.


    These Native women thus presented a focus on often elided aspects of Native culture,
    engaging with the emerging concerns of feminism to respond to the ways in which
    the traditional roles of Native women had been eroded by colonialism, and by contact
    with the institutionalised sexism of Euro-American culture. These analyses also
    responded to developments within feminism, such as the emergence of ''Third World''
    feminism to address the implicit (sometimes explicit) racist assumptions of a
    seemingly ''colour blind'' feminist movement. Such colour blindness allowed claims,
    for example, that all women were linked by shared experiences of oppression. Identified
    as the assumptions'
