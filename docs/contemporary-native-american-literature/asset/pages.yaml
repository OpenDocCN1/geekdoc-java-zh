    extends the (can)n''on'' in more ways than one.


    Alexie''s fighting spirit is perhaps the product of his own quite specific personal
    experience. Born in 1966 with hydrocephalus, he was not expected to survive childhood,
    and in spite of surgery at six months old, his best prognosis was severe mental
    impairment. However, Alexie successfully battled the severe seizures from which
    he continued to suffer throughout his childhood, and his less active early life
    was compensated by his avid reading habits, which meant that he began to achieve
    exceptionally well in his education. Recognising the limits of education at the
    local reservation school that most of his family attended in Spokane, Washington
    State, Alexie relocated to a nearby Euro-American high school in Wellbeing. Alexie
    later graduated with honours and went on to attend both Goranza and Washington
    State universities. It was at Washington State that Alexie began attending poetry
    workshops, and shortly after graduation won two poetry fellowships, including
    the National Endowment for the Arts fellowship in 1992. Alexie has since proved
    a prolific writer, winning a range of literary awards, including the 1996 American
    Book Award, the 1999 Sundance Film Festival Audience Award (for his screenplay
    Smoke Signals) and, most recently, the 2005 Pushcart Prize for poetry. Significantly,
    Alexie proved his mainstream appeal in 1999, when he was named by The New Yorker
    as one of the top twenty American writers of the twenty-first century.


