  md: '# EXTENDING THE CANON


    responsibility: in this context, McAdams clearly enters into dialogue with recent
    ecofeminist discussions on human–nature relatedness and concepts of responsibility.
    This is most evident in the poem ‘The Thousand-Year War’, where we are asked to
    [i]agine how, when the weather changed/we shrugged/ and went about our leisure’,
    only to find a ‘world pared down to Winter’.74 McAdams’ parting question is highly
    pertinent: [w]ill we ever speak of it?”75


    With an emphasis upon vocalising Native experiences and concerns is evident within
    the writing of Karen Wood (Monacan), it is notable that her writing focuses on
    women’s political issues. Born c. 1960, Wood has long an activist for Monacan
    tribal councils, campaigning for Native women’s rights and environmental issues,
    and against domestic violence. More recently, Wood has acted actively as a member
    of the Tribal Council, and through her work to ensure the repatriation of Native
    human remains and sacred codices to the Macon. Wood was awarded the First Book
    Award from the Native Writers Circle of the Americas in 2001 for her poetry collection
    Markers on Earth. Opening with a ceremonial-style poem to the ‘Directions’, Markers
    on Earth traces the ways in which Native stories and histories are deeply embedded
    within specific landscapes. The poem Site of a Massacre, where the soil holds
    past atrocities: the thuds of/children collapsing/limp shattered dolls’,76 Demonstrating
    the lingering grief is palpably, Wood’s question to the reader is highly pertinent:
    [j]an you say see/ only a field or hear/nothing but the breeze[].77 This painful
    legacy is also evident in ‘In Memory of Shame’, where the guilt felt by the colonised
    is both for a failure to resist and for concomitant emotions: complexity. The
    poem balances deeply contradictory emotions: ‘because it was our fault and because
    we did nothing wrong’ and equally ‘because we were children or women or not/white
    or just not enough’.78 Above all, like other Native writers, Wood emphasises the
    deep connections between Monacan culture and ancestral landscape, where ‘my bones
    turn with knowing’ that ‘our songs [are] buried under dry riverbeds’ and that
    ‘the true circle of voices of my relative[s]’ call to us over this ground’.79
    Most importantly, these ‘voices of mothers and fathers … us to hear the earth/singing’,80
    reiterating the calls within recent Native women’s writing for a recognition of
    the profound nature and ramifications of relationships and relatedness of all
    forms.'
