  md: '# INTRODUCTION


    (1890); the prevalence of persistent and damaging forms of racism, both social
    and institutional (analysed in Native fiction as early as 1854); and the damaging
    cultural effects of a range of federal Indian policies that have attempted to
    redefine the very structure and identity of Native communities and individuals.
    Central to many Native writings is a recognition that the federal/Euro-American
    assimilation process requires the complete eradication of Native cultures, and
    the relationship between Native writers/texts and Euro-American audiences is,
    therefore, highly complex.


    However, an ongoing Euro-American attraction to and interest in Indian writings
    and cultures provides a wide audience for a range of Native political and literary
    strategies. In this context, many Native writings can be interpreted as part of
    a long tradition of negotiation and mediation between cultures, and as interventions
    into established and implicitly racist Euro-American discourses that employ the
    conventions of Manifest Destiny to identify traditional Native cultures as redundant
    in a ‘modern’ world. This book analyses these negotiations and media, especially
    the acts of ‘translation’ that make Native worlds both visible and accessible
    to the Native-reader. A repeated feature of the cultural translation is the representation
    of the profound effects of the historic Euro-American–Indian relationship: the
    cultural dis-location articulated by writers as diverse as Samson Occocc (1772),
    John Rollins Ridge (1814), D’Arcy Mcringle (1936), and N. Scott Momaday (1968).
    Indeed, the ultimate form of cultural dis-location, the precarious socio-cultural
    status represented by ‘mixed blood’, remains so politically significant that it
    persists in Native fiction from Mourning Dove’s Cove the Half-Blood (1927) to
    Leslie Marm Silko’s Ceremony (1977) and Sherman Alexie’s Indian (1996).


    Fundamental to the cultural translations of Native literature is a range of significant
    literary strategies and tropes that emphas the importance of Indian cultural ideas
