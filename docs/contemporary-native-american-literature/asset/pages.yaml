    # Active and Activist Humour: Simon Ortiz (b. 1941)


    Born in 1941 in Albuquerque, New Mexico, Simon Ortiz was raised in the Acoma village
    of McCarty’s (Deetseyamah) within an Acoma-speaking family and close-knit community.
    The BIA reservation day school, Ortiz was first exposed to the English language
    in which, much like other poets as Momaday and Tapahono, he developed a deep interest
    and was encouraged to write because he ‘associated reading [and writing] with
    oral stories.’⁷ Ortiz’s academic achievements ensured that his subsequent education
    at St Catherine’s Indian Boarding School and Grants High School was successful
    and, after working in the uranium mining industry, his career was interrupted
    by a brief period of military service, before he returned to the universities
    of New Mexico and Iowa to study creative writing. Ortiz’s powerful and prolific
    works have ensured his critical acclaim as both a poet and as a fictional writer,
    and he has received a range of awards, including the National Endowment for Arts
    Discovery Award (1996), the Pushcart Prize for Poetry (1981) and the Lifetime
    Achievement Award from the Native Writers Circle of the Americas (1993). Ortiz
    has taught at the universities of New Mexico, Toronto and San Diego State, and
    at the Institute of American Indians editor for the Pueblo of Acoma Press and
    as lieutenant governor of the Pueblo of Acoma. He continues to travel both nationally
    and internationally for lectures tou poetry readings.


    Much like Silko, Ortiz defines himself through his Acoma heritage and culture,
    which are ‘the basis of who I was and how I came into.’⁸ Most importantly, the
    oral storytelling tradition is the medium through which heritage and culture ‘were
    expressed.’⁹ Thus Ortiz learnt the lessons of Acoma culture, identity and history
    through story, which became ‘vitally important’ to how he ‘tied into the communal
    body of my people.’¹⁰ In this context, Ortiz repeatedly identifies himself within
    the Acoma oral tradition, primarily as a storyteller. Acoma stories are significantly,
    implicitly and often explicitly political:


    I had heard the oral history of the Spanish coming, the taking of land by them
    and later by the Mericano, the Treaty of Guadalupe Hidalgo'
