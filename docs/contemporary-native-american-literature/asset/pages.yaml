  md: '# CONTEMPORARY NATIVE AMERICAN LITERATURE


    Miranda''s own experience, the majority of Americans, both Native and non-Native,
    assume ''all those Indians died''.67 For Miranda, to reiterate the survival of
    Californian Indians means that ''the air becomes electric'' [w]le dismantle the
    facade of conquest within which [f]ur demise is legally and officially planned
    [and] executed''.68 Miranda''s volume thus demonstrates an emphatic presence,
    through poems as ''The Territory of Love'', which reconsiders the poetry of Americans
    in terms of desire: ''the secret passage to cities of gold'' populated by ''natives/sauntering
    and'' and ''voices of longing'' that reflect ''your fierce desire toenter this
    land''.69 Significantly, the Territory of Love engages directly with the kind
    of debates on relations and related-evident in Erdrich''s Love Medicine. In this
    context, the Territory of Love ''does not take kindly to being/colonized''.70
    Through repeated reiterations of Native poetry in poems such as ''Without History'',
    ''Indian Cartography'' and ''After Colonization,'' Miranda produces valuable dialogues,
    as she aptly comments, ''testify to a miracle: Here we are, here we are''.71


    This emphasis on Native presence is equally evident in the work of Janet McAdams.
    From mixed Creek, Scottish and Irish ancestry, McAdams was born in Alabama, and
    gained an MFA in creative writing from the University of Alabama and a PhD in
    comparative literature from Emory College. McAdams has taught at the universities
    of Alabama and Oklahoma, and currently teaches at Kenyon College, Ohio, where
    she is the Robert H. Hubbard Professor of poetry. McAdams'' work has been well
    received, and she was awarded the 1999 First Book Award from the Native Writers
    Circle of the Americas for her poetry collection The Island of Lost Luggage, for
    she also won the 2001 American Book Award. With such as ''The Thousand-Year War''
    and ''A Map of the Twentieth Century,'' The Island of Lost Luggage makes clear
    connections between various forms of imperial aggression as McAdams charts ''the
    disappeared, the lost children, the Earthhearts/of modern life'' ''bad luck''
    ''it is to die in the cold/wars of certain nations''.72 Blending personally poetry
    with deeply political commentary, McAdams'' verse ''lick[s] the salt from the
    long wound of history''.73 The scope of the subject matter is vast, ranging from
    an engagement with destructive-forms of modern warfare to a consideration of the
    ways in which contemporary societies engage with and dominate the natural world.
    Throughout, our individual and collective complicity with war, violence and environmental
    disaster is exposed in our refusal to take'
