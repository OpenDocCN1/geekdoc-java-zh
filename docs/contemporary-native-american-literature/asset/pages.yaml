    even after we filled it back in''.¹ Tracing the mystery of Little''s death, Treuer''s
    first novel ensures that the re-creation of Little''s story is also the re-creation
    of the history of Poverty and its inhabitants, thus presenting a detailed and
    terse picture of Indian life across three generations. Treuer''s second novel,
