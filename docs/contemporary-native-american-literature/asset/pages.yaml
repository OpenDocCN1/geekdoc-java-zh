  md: '# EXTENDING THE CANON


    161


    assert a powerful and political Native voice and agency. Like the post-colonial
    critic Gayatri Spivak, Native writers have always demanded not just to speak but
    ''to be listened to seriously'' without ''benevolent imperialism'': Spivak''s
    subsequent question, which she leaves unanswered, ''[w]ho will listen?⁸¹ . In
    its creation of an active reader, Vizenor has suggested that Native writing produces
    a critical strategy of ''active listening'' on the part of its readers; de Ramirez
    likewise has argued for a ''conversive'' approach to Native writing that, in illusions
    to both conversion and conversation, exposes the role of active dialogue and exchange
    within Native textual strategies. One potential answer to Spivak''s question,[w]ho
    will listen?,, is thus the active, and politically activist, reader of Native
    literature. It is, therefore, through Native writers'' abilities in cultural translation,
    and through the direct engagement of readers with the readers of Native texts,
    the relationship between Native writers and their readers becomes one of active
    exchange. In this context, both Native writers and their readers can, according
    to David Moore, attain the power to ''effect a different reality.''⁸²


