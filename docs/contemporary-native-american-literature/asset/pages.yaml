  md: '# Tricksters and Critics: Simon Ortiz,

    Louis Owens and Gerald Vizeron,

    1980—2000


    The publishing successes of writers such as Momaday and Welch clearly continue
    to influence a range of subsequent publications by both established and emerging
    American men. Like the Native women of the previous chapter, these writers engage
    with the complexities of identity within Native cultures that have been deeply
    affected by Euro-American attempts at assimilation. This lengthy Euro-American
    drive for assimilation has eroded or eliminated many traditionally ''male'' cultural
    pursuits, and so affected the social status and, most problematically, the actual
    social position or ''location'' of many Native men. Euro-American attempts to
    eradicate traditional male cultural practices were deemed an impediment to ''progress''
    and ''civilisation'' included the wholesale slaughter of the buffalo as a means
    by which to subdue the Plains tribes by starvation, and a general opposition to
    hunting practices, because they encouraged the reservation groups to migrate,
    was resolved by the imposition of the reservation system. Euro-America''s subsequent
    emphasis upon land cultivation as part of its programme to civilise American Indians
    worsened matters as, for many tribal cultures, farming and agriculture were identified
    as female pursuits and seen as distinctly feminine, indeed feminine, activities.
    The enforced Indian education system contributed to this decline in social status
    for Native men, who were officially defined as ''masculine'' only when they ''civilised
    and appeared ''white'', with any adherence or desire to adhere to Native cultures
    identified as ''effeminate''. This effective emasculation of Native men''s culture
    played a crucial and, for assimilation purposes, necessary role both in controlling
    Native tribal groups, and in breaking tribal spirit.


    At the start of the twentieth century, there were few opportunities for

    Native men to reclaim their social status or even a remnant of their former'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# 102 CONTEMPORARY NATIVE AMERICAN LITERATURE


    warrior societies, and this provides some explanation for the attraction of popular
    ''entertainment'' shows such as Buffalo Bill''s Wild West, and the demographically
    disproportionate numbers of Native men who continue to enlist and serve in the
    US military forces. The loss of a comprehensive socio-cultural structure resulted
    in a deep sense of cultural and social dis-location for many Native men, evident
    in the behaviour of the male protagonists of texts from Mathews'' Sundown in the
    Blood. Native men had been stripped not of their social status, but by their ability
    to provide for their familial and tribal groups, as is evident in Erdrich''s descriptions
    of gender relations in Love Medicine.


    A clear distinction can be made with the writings of Native women is the lack
    of any comparable Native movements: while Native women writers have gained a readership
    and a voice within developments in the feminist movement, Native writers have
    had no politically focused attention. Indeed, the effective breaking of Red Power
    and of the American Indian Movement, headed by high-profile Native men such as
    Denis Banks, Clyde Bellecourt, Russell Means and John Trudel, after the 1973 Wound
    Knee siege, plus the subsequent high-profile trials of Bob Robideau, Darele Butler
    and Leonard Peltier, impacted negatively upon the development of further political
    movements for Native men. While Native women were able to tap into mainstream
    developments that acknowledged diverse female experiences based directly upon
    race and ethnicity, there were no corresponding acknowledgments outside tribal
    communities of Native men or their experiences. In this sense, patriarchy remains
    firmly in place, masculinity remains problematically defined as white, and Native
    cultures continue to be excluded.


    As a result, Native male writers have experimented with a range of literary forms
    and distinctions that draw directly upon Native cultures yet make references to
    and intersections with Euro-American literature and culture. While the writers
    analysed in this chapter—Simon Ortiz (Acoma Pueblo), Louis Owens (Choctawa-Cherokee)
    and Gerald Vizenor—had published or were publishing alongside Momaday and Welch
    during the 1970s and 80s, their subsequent work (between 1980 and 2000) is nonetheless
    significant for its development of humour and a pointed form of cultural criticism.
    Indeed, Owens and Vizenor also both worked within mainstream Euro-American education
    as academics, producing critical works on Euro-American and Native American literature
    and culture.'
