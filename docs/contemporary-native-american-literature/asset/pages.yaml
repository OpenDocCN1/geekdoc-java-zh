    people never learn that you can''t run away''.¹²³ In spite of this emphasis upon
    facing facts, it is significant that the Indian Agent is equally representative
    of Euro-America''s refusal to accept the damaging effects of its demands for Indian
    cultural assimilation. In this context, McNickle makes it emphatically clear that
    Archilde – and all of his problems – is, quite literally, ''our child''.


    From the earliest century of the eighteenth century, Native American writing changed
    greatly in terms of form, eventually resulting in the early twentieth century,
    in the emergence of the ''American novel'' which clearly emerged with widespread
    literary developments and concerns. However, regardless of form, it is notable
    that all of these early texts expressed three clear objectives: a re-assertion
    (and cultural translation) of important Native cultural values; an exposure of
    ongoing EuroAmerican racism and its legacy in federal–Indian relations and policies;
    and an emphasis upon Indian rights. As a result, the emergence of highly focused
    and prominent Civil Rights movements in the 1950s and 60s heralded a further proliferation,
    and a new generation, of Native writers and writings.


