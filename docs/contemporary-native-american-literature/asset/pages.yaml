  md: '# The British Association for American Studies (BAAS)


    The British Association for American Studies was founded in 1955 to promote the
    study of the United States of America. It welcomes applications for membership
    from anyone interested in the history, society, government and politics, economics,
    geography, literature, creative arts, culture and thought of the USA.


    The Association publishes a newsletter twice yearly, holds an annual national
    conference, supports regional branches and provides other membership services,
    including preferential subscription rates to the Journal of American Studies.


    Membership enquiries may be addressed to the BAAS Secretary. For contact details
    visit our website: www.baas.ac.uk.'
