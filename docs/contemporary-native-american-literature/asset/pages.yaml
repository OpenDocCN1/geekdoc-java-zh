    Like Welch, the success of Erdrich''s writing lines in her focus focus upon what
    she knows: the world of the mixed-blood Ojibe. As with Silko, Erdrich''s first
    focus was poetry, resulting in the publication of three volumes, Imagination (1981),
    Jacklight (1984) and Baptism of Desire (1989), all of which emphasised her Ojibe
    heritage through a Native culture, myths and stories, and on the length and troubled
    history of federal—Indian relations and the assimilative intentions of Euro-American
    culture. In spite of this early focus, Erdrich was not to publish a volume of
    poetry until 2004, when Original Fire appeared. Nonetheless, Erdrich''s essentially
    poetic style is equally evident in her works of fiction which produce visual imagery.
    Significantly, the majority of Erdrich''s fiction, from her separation from Dorris
    before his death in 1997, was the result of an intensive collaborative process,
    and as a result of her early novels dedicated to her husband. The publication
    of the 1984 novel Love Medicine, which won the National Critics Circle Award,
    ensured Erdrich''s popular appeal and her critical acclaim. Her success is notable
    for being not only national but also internationally: unusually for a Native writer,
    Erdrich''s works are easily available below in the UK through a British imprint.
