  md: '# CHAPTER I


    # Introduction


    This book provides an introduction to contemporary Native American literature,
    focusing throughout on the complex and problematic socio-political status of contemporary
    Native Americans as colonised peoples within a colonial state. Contemporary Native
    American literature emerges directly from this imperial relationship, and from
    the engagement of Native peoples with the legacy of the federal–Indian relationship
    within a country that is, paradoxically, both colonial and postcolonial. Native
    writing also emerges from dual literary traditions: from the interactions of individual
    writers both with the Euro-American literary heritage and with traditional Native
    forms of literature, including oral storytelling.


    The complexities of the topic are immediately apparent in the terminology used:
    the term ''Native American'' refers to any indigenous community or individual
    of the Americas, and is the subject of dissent among many Native peoples. Similarly,
    ''American Indian'' is also a disputed term, and the reason for dissent derives
    from the fact that these terms are not only of identification, but also of ''classification'',
    complete with the numerous problematic ''scientific'' connotations of the term.
    In this sense, they are colonial names imposed upon Native peoples, often eliding
    Native languages and expressions. This book negotiates this terminological minefield
    by employing the common tactic of using terms ''Native American'', ''American
    Indian'' and ''indigenous'' interchangeably. I fully recognise that this approach
    tends to homogenise highly diverse cultural groups within a single generic term,
    and I have tried to compensate for this by referring to and discussing the tribal
    affiliations of each writer and the variation of worldviews that are expressed.


    Given the complex politics, individual writers and their works are fully situated
    within a detailed socio-cultural context including Indian–white relations, popular
    Euro-American perceptions and contemporary'
