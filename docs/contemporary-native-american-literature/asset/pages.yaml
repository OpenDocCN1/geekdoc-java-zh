    # Early Native Writings: the ‘Christian Indians’ of Connecticut, 1772–1836


    Given the emphatically Christian context of American settlement, it is both inevitable
    and ironic that the first Native text in English (1772) be a Christian sermon.
    Its author, the Mohegan Samson Occom (1723-92), converted to Christianity at the
    age of sixteen or seventeen, during the religious revival (the ‘Great Awakening’)
    that swept Connecticut in the 1730s and subsequently attended a private Christian
    school run by the evangelical preacher Eleazar Wheelock. Becoming an ordained
    minister in 1759, Occom recruited further Indian students for Wheelock, and undertook
    a two-year fundraising tour of England in the mid-1760s, where he testified unsuccessfully
    on behalf of the Mohegan in a land claims case in London. Wheelock’s failure to
    support the case, and his decision to use the monies raised in England ensured
    that Dartmouth College rather than the Indian Charity School for which it was
    collected, Occom’s disillusionment with Euro-American culture. In 1774, Occom
    negotiated a tract of land – Brentwood in central New York for a community of
    Christian Indians, where he remained as a teacher and spiritual leader until his
    death in 1792.


