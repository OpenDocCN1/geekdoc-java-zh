    # Un-settling Hi/Stories: Leslie Marmon Silko (b. 1948)


    This sudden burgeoning of Native writing also influenced the Laguna writer Leslie
    Marmon Silko. Born in 1948 in Albuquerque, New Mexico, of mixed Mexican, Native
    American and Euro-American ancestry, Silko was educated primarily at off-reservation
    Euro-American schools before graduating from the University of New Mexico in 1969,
    the year she published her first story, ''The Man to Send Rain Clouds''. Silko
    subsequently enrolled in Law School, influenced by the lawsuit undertaken by the
    Pueblo of Laguna against the State of New Mexico. However, when the Laguna case
    was disappointingly resolved, with compensation for land losses awarded at nineteenth-century
    land values, Silko rejected a career due to her realisation that ''injustice is
    built into the Anglo-American legal system''.¹¹ In 1971 Silko turned to writing
    in order portray storytelling traditions, and understandings that stories are
    told well can actively change the world. Silko has subsequently taught at the
    Navajo Community College, and at the universities of Arizona and New Mexico, and
    been awarded numerous prestigious awards, including the Native Writers Circle
    of the Americas lifetime achievement award (1994), a MacArthur Foundation ''genius''
    Award (1981) and the Pushcart Prize for poetry (1977). Named as a ''Living Cultural
    Treasure'' by the New Mexico Humanities Council, Silko has in recent years relocated
    to Mexico as part of her ongoing resistance against the politics and policies
    of the US government.'
