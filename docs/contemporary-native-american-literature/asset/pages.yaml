    # Recent Writing by Native Women


    By comparison, Native women have very successfully entered into a dialogue with
    range of external markets, especially the wide feminist debates that ensure a
    buoyant market for discussions of ethnicity, gender and sexuality. As a result,
    recent writings by Native women are marked by their emphatic political discussions,
    and their assertions not only of Indian presence but of Native agency. In this
    context, significant recent voice is Deborah Miranda, whose work is marked by
    her analysis of mixed blood, born c. 1961 in Los Angeles, Miranda''s cultural
