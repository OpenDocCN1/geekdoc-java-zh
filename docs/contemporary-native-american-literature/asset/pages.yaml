    # Ghost Singer (1988)


    Walters'' 1988 novel Ghost Singer is, ostensibly, a very simple tale of museums,
    ghosts and hauntings: the principal action is set in the Smithsonian Museum of
    Natural History in the 1960s, with additional episodes that span back into the
    1830s and forward into the mid-1970s to indicate the ways in which the events
    of the past continue to influence the present. The text is significant for a number
    of reasons: for the ways in which Native worldviews are presented and discussed;
    for the ways in which the text demonstrates an innate Euro-American sense of cultural
    superiority; and the intrinsic disrespect for other cultures that is evident within
    imperial concepts of museums and collecting. Most importantly, Walters'' text
    makes a clear political intervention into the increasing debate, emerging in the
    late 1980s, surrounding the collection and display of Native American artifacts
    and human remains. A key criticism of the 1978 American Indian Religious Freedom
    Act has been its failure to adequately protect Native sacred sites, and growing
    concerns over the sheer number of Native remains and body parts either displayed
    or held by American museums: for instance, in 1986 the number of remains held
    was estimated to be 15,500.⁴ This factor, coupled with growing and increasingly
    well-published Native protesters and wider Euro-American awareness of the emotive
    issue, resulted in the 1990 Native American Graves Protection and Repatriation
    Act (NAGPRA).⁵ NAGPRA attempted to address the concerns being expressed by Native
    peoples: that Native remains (and by implication contemporary Native peoples)
    continued to be scientifically identified as ''natural history''; that scientific
    freedom was being valued over the rights and dignity of human beings; that Native
    cultural beliefs continued to be disregarded by Euro-American institutions; and,
    most problematically, that there are inherently imperial notions of ''ownership''
    linked to both collecting and collections.'
