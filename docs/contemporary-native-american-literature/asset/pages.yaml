    poverty, the physical abuse he suffered at home, plus his experiences as an indentured
    servant, had a direct impact on his interest in Christianity, and his subsequent
    role as a Methodist minister and missionary. In spite of a very patchy education,
    Apes published the first known Native American autobiography in 1829, plus four
    other influential texts that presented eloquent arguments in support of Indian
    self-governance. Most significantly, Apes'' writings called for equal rights,
