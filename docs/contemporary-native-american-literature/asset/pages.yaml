    # Fight Back: For the Sake of the People, For the Sake of the Land (1980)


    This active and activist political philosophy is evident in the title of Ortiz''s
    1980s multi-genre work, which openly calls his readers to action in the face of
    the increasingly environmentally damaging neo-colonial policies of contemporary
    multinational energy companies. With Silko''s concept of witchcraft in Ceremony,
    this includes the uranium industry and atomic nuclear testing on or near Native
    lands. Ortiz''s call to action clearly contests Euro-American attempts to separate
    land (nature) and people (culture) by exposing the connections between the extreme
    environmental damage caused in the American southwest and its direct human consequences.
    As readers, this fight is for both people and land, whose interests and welfare
    are interlinked and inseparable. In this, Fight Back engages with a wide range
    of Native worldviews, as Keith Bass mentions, recognise ''the landscape in which
    people could be to dwell in them''.^18 Ortiz explores this concept of relatedness,
    and the causality of relationships; exposing the connections between historical
    forms of oppression, as the poor Spanish–American relationship that precipitated
    the 1680 Pueblo Revolt, and the neo-colonial attitudes of contemporary corporate
    enterprise that continue to oppose Pueblo peoples.


    This idea of relatedness is enormously significant, since the 1680 Revolt reacted
    not only to exploitative and inhuman Spanish rule, but also to the unsuccessful
    Acoma rebellion of 1559. Disastrously unsuccessful, this rebellion resulted in
    the decisive defeat of the Pueblo and the introduction of punitive retaliatory
    measures: all children under the age of twelve were removed from their families;
    all men over the age of twenty were sentenced to lose one foot and hand.^19 As
    a result, the Pueblos were able in an unprecedented manner to an against the colonisers,
    resulting in the successful expulsion of Spanish forces from the region for twelve
    years.^20 It is with this legacy that Ortiz engages, connecting the exploitative
    practices of Euro-American corporate industry with seventeentheenth-century colonial
    abuses, as the ''theft of land and resources, slave labor, religious persecution,
    and unjust tribute demands''^21 is repeated in federally guaranteed corporate
    leases, destructive mining processes, low wages and poor industrial safety, the
    illegal destruction of Native sacred sites, and federally-fixed low percentage
    ''benefits'' that protect the enormous profits of the corporate energy interests.
    The second section'
