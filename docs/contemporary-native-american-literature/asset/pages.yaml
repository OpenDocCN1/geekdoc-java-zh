  md: '# CHAPTER 6


    # Extending the Canon:

    Recent Native Writing


    New Blood: Current Developments in Native Literature

    More recently, new and emerging Native writers have begun building upon the successes
    of writers such as Momaday, Silko, Erdrich and Vizenor to produce a range of writings
    that continue to engage with Native cultures, histories and politics, and with
    the literary heritages evident within oral traditions. As with previous Native
    writers, gender concerns and gender roles continue to be a focus. These writings,
    like their authors, are highly diverse and range from engage-ments with the Euro-American
    horror or thriller genre to consider-ations what it means to be an ‘urban Indian’,
    and from analyses of the ongoing connections between the old world and the new
    through the many faces of colonialism to attempts to re-locate the dis-located.
    A clear and ongoing focus for many Native writers is the complex relation-ship
    between Native cultures and the land, and the impact this has upon concepts of
    Native identity. While many writers publish with independent presses, others have
    taken advantage of the range of Native literature series developed by American
    university presses to showcase the continuing developments of the ‘Native literature
    renaissance-sance.’


    Significantly, some recent writers such as Sherman Alexie and David Treuer are
    producing powerful discussions of contempemporary Native political realities that
    are nonetheless aimed at, and well received by, popular Euro-American market.
    Given the sheer numbers of emerging Native writers, the following discussion is
    necessarily restricted, but the writers who are discussed are those who have been
    recognised by literary awards, or who have produced highly unusual texts, or who
    have gained popular acclaim and a wide and diverse audience. Due to his popularity,
    his high profile and his increasing diversification into other media, the Spokane–Coeur-d’Alene
    Sherman Alexie has proved to be as popular as Erdrich (possibly more popular),
    with'
