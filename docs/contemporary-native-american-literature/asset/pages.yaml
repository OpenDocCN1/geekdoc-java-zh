  md: '# CHAPTER 3

    Seminal Writers: N. Scott Momaday,

    James Welch and Leslie Marmon

    Silko


    The ''Renaissance'' of Native American Literature: 1968–77

    The development of a highly politicised African American Civil Rights movement
    from the 1950s heralded the emergence of equally active demands for Native American
    civil rights and posed the first real challenge to entrenched Euro-American racism.
    Movements such as ''Red Power'' and political groups as the American Indian Movement
    (AIM) raised the profile of Native Americans within the United States and acted
    to promote wider Indian activism. Both Red Power and AIM were given impetus by
    developments within federal Indian policy, which from the philanthropic Indian
    Reorganization Act (1934), had seen a return to disastrous policies that caused
    further socio-cultural chaos and suffering. For instance, Indian calls for tribal
    self-government or sovereignty to its colonised peoples could be ''terminated''
    and through which the federal government''s responsibility to its Indians could,
    with the removals of the nineteenth century, be ''relocated''. In what was effectively
    a cost-cutting exercise, between 1953 and 1968 many relationships between tribal
    peoples and the government were severed, with devastating economic results: tribal
    communities had been made dependent upon welfare, and had no independent economic
    resources or means to develop them. Significantly, this legislation-Indian-relations
    that were protected by treaty and American law. The situation was compounded in
    1956 with the Indian Relocation Act, when individuals were paid to relocate to
    urban areas. Little if any support was given to these new ''Urban Indians'', and
    no monies were available to allow a return home if desired. The result was a widespread
    depopulation of traditional tribal communities, which directly affected Indian
    culture and cultural activities.'
