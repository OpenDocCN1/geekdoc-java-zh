    an equally powerful appeal to mainstream Euro-American readers. As a result, this
    chapter will focus initially on Alexie and a case study of his novel Indian Killer
    (1996), before giving an overview of a further range of important recent works
    and authors.


    # The Indian Enfant Terrible: Sherman Alexie (b. 1966)


    One of the most exciting and prolific Native writers to emerge in recent years
    has been Sherman Alexie (Spokane-Coeur d''Alene), who has produced an astounding
    ten volumes of poetry, three collections of short stories, two novels and three
    screenplays since 1991, while also venturing into film direction. Alexie has exhibited
    not only a well-developed sense of his market and readership, but a desire and
    ability to move the realm of literature to diversify into a range of other significant
    and far-reaching media such as music and film. In this context, Alexie''s work
    is significant for his conscious attempts to reach wider audiences, and its simultaneous
    highly political presentation of the bleak realities of contemporary Native American
    life. Crucially, what Alexie is most known to demonstrate to this wider audience
    is that these realities are the direct legacy of Euro-American settlement, and
    of subsequent federal-Indian relationships and policies. Alexie''s work and perhaps
    especially his approach is not without criticism, from other Native writers and
    critics. Alexie''s own tendency at times towards racial essentialism, especially
    in his critiques of the approaches of mixed-blood Native writers such as Momaday,
    Owens, Silko and Vizenor, his problematic reproduction (and so reinforcement)
    of long-standing Indian stereotypes, and his deliberate use of a ''trickster''
    status has ensured a controversial reputation as the self-styled enfant terrible
    of contemporary Native literature.


    Alexie''s forceful public persona and his often aggressive forms of expression
    that he frequently indulges in when Arnold Krupat identifies as ''smart-bad-boy
    craacks''. Ironically, his confrontational attitude is exactly what Alexie''s
    high visibility as a Native writer is frequently criticised as both ''angry''
    and ''funny''.² In this context, his writings can be directly linked with the
    kind of gendered trickster discourse developed by Ortiz, Owens and Vizenor. Significantly,
    Alexie''s combination of anger and humour exposes his very well-developed understanding
    both of Euro-American popular culture and of the media, and his enthusiastic engagement
    with contemporary popular culture has been one reason for his success.'
