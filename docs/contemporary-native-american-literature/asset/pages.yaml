    # International Successes: Louise Erlich (b. 1954)


    A member of the Turtle Mountain Chippewa, Louise Erlich is one of the most popular,
    prolific and internationally successful contemporary Native American writers.
    Born in Little Fills, Minnesota in 1954 to a German-American father and Ojibwe-French
    mother, the significance of this mixed-blood status can be traced in the majority
    of Erlich''s writing. Primarily analysing her Indian heritage (her grandfather
    was a Tribal Chairman), in more detail, Erlich''s works have in recent years explored
    her German ancestry in the publication The Master Butcher''s Singing Club (2003).
    Raised in North Dakota, both Erlich''s parents taught the BAI Indian school at
    Wapeton and encouraged her to pursue a university education. Erlich joined Dartmouth
    College in 1972, the year that Dartmouth admitted women, to the Native American
    Studies programme. Encouraged by her parents and influenced by the Ojibwe storytelling
    tradition embraced by her wider family, Erlich wrote throughout her university
    career, during which she won literary prizes for both poetry and fiction. At Dartmouth,
    Erlich also met her future husband and literary collaborator Michael Dorris (then
    Director of the Native Studies programme), with whom Erlich would later publish
    the collaborative novel Crown of Columbus (1991) tracing the legacy of five years
    of New World colonialism upon contemporary Native American societies. Having gained
    a master''s degree in creative writing from Johns Hopkins University, Erlich'
