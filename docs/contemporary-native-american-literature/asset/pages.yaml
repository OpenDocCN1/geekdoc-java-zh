    The Emergence and Development of Native American Literature


    A Fascination with All Things ''Indian''


    With the arrival of early European settlers in the New World, there developed
    a fascination throughout Europe with all things ''native''. This was demonstrated
    both through the consumption of Indian culture as entertainment through ''travel
    narratives'' that described Indian social practices; and through concerted efforts
    to Christianise indigenous communities through missionary activity and the creation
    of an Indian education system. Thus, very early in America''s settlement, copious
    publications emerged that were aimed at an increasingly curious European audience,
    and discussed Native American cultures often in contrast or comparison to European
    ''civilisation'', either as popular entertainment or as an experiment in religion
    and/or education.


    Some of the earliest settlers illustrate the often simultaneous attraction and
    dread with which the Europeans viewed America''s indigenous peoples.'' Thomas
    Harriet''s ''A Brief and True Report of the New Found Land of Virginia (1688)''
    is in effect an ethnography of the Native population, describing their lifestyle
    and customs. Badly clothed, badly armed, and of limited intellectual and physical
    development, Harriet concludes that ''in respect of us [the English], they are
    a people.'' As Governor of Plymouth Colony, William Bradford describes the dangers
    offered by the ''stout and warlike settlers.'' Such descriptions catered for a
    growing European market for New World ''travelogues'', and Bradford assages any
    fears of potential settlers by reporting that the Pequot were subsequently ''[fryed]
    in the fire'' of English victory.


    The popularity of this type of narrative, with its sense of titration for far-removed
    European readers, is perhaps most evident within Mary Rowlandson''s narrative
    of her captivity (1682), which became a ''bestseller'' in seventeenth-century
    Europe. Rowlandson''s tales of her emphasised the physical, spiritual and sexual
