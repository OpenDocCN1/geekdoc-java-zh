    problems, such as racism, violence and land theft (for example, John Rollin Ridge''s
    1854 novel The Life and Adventures of Joaquin Marieta): the increasingly precarious
    social status of the ''mixed blood'' (discussed in Mourning Dove''s 1927 novel
    Cegew, among many others); or the alienating experiences of Native children forcibly
    removed from their families to attend ''Indian schools'' such as Carlisle (for
    example, Luther Standing Bear''s reminiscences in Land of the Spotted Eagle (1933)).
    Native writers also often responded directly to specific and sometimes traumatic
    national or local events (the Wounded Knee Massacre of 1890 is the final focus
    of S. Alice Callahan''s 1891 novel Removed from Wynema); to the ramifications
    of implementing federal policies such as the 1887 Dawes Allotment Act (discussed
    by John Joseph Mathews in his 1934 novel Sundown); or to the ongoing power wielded
    by the Christian church and American legal system over reservation communities
    (evident in D''Arcy McKickle''s 1936 novel The Surrounded.)


