    can be used to challenge and subvert stereotypes and preconceptions. While humour
    seems an unexpected medium through which to analyse some of the critical issues
    at stake, it is, perhaps due to this very distinction, nonetheless a highly effective
    means through which to discuss the kinds of ''grave concerns'' evident in the
    works of Ortiz, Owens and Vizenor.’ Additionally, as Owens himself claims, the
    ''role of humour'' have been ''crucial'' to the ''long survival of Native American
    peoples.’ In this sense, trickster discourse engages directly with established
    Euro-American and European satirical traditions, to critique damaging Euro-American
    assumptions and a key feature of satire – to give expression to Native men’ anger.
    This discourse has been identified by Vizenor as a ''trickster hermeneutics,''
    the development of deeply satirical form of interpretation that, the tribal trickster,
    is essentially unpredictable, disruptive, revolutionary and highly active in its
    exposure and censure of damaging practices. In this context, the trickster simultaneously
    represents both educator (the lessons that must be taught) and education (the
    learning that must be undertaken).


    Humour is a deeply significant way in which powerful truths can be unexpectedly
    presented, especially to a wary or resistant audience; and Chris Laonde contends
    that, in this context, trickster discourse is an ''economy that both free[s] us
    and compel[s] us to re-examine the world.’ This notion of compulsion with its
    yet paradoxical limits to freedom is thus a highly pertinent concept: by employing
    a traditional sacred figure common to a range of Native cultures, Native male
    writers'' expose the intrinsically sacred basis not only of knowledge(especially
    self-knowledge) but of life itself. In Native traditions, the trickster''s actions
    are the basis of preventative stories due to his tendency to ''sexually active,
