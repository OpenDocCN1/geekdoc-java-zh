  md: '# SEMINAL WRITERS: MOMADAY, WELCH AND SILKO


    In direct response to these events, and to almost five hundred years of dispossession
    and oppression, a new era of Indian political activism developed, accompanied
    by a more public discussion of Native American culture and identity.¹ Public political
    protests by AIM included the occupation of Alcatraz (1969–71), which demanded
    the return of tribal lands no longer used as guaranteed by treaty; the occupation
    of the BIA office in Washington (1972) as part of the ''Trail of Broken Treats'';
    and a siege at the Wounded Knee site on the Pine Ridge reservation in 1973, following
    the suspicious deaths of more than sixty traditional tribal members and a reclamation
    of the site by the Oglala, AIM activists were involved in a gun battle with the
    FBI that resulted in three deaths.


    Media coverage of such events raised popular American awareness of contemporary
    Native American communities, and many of the Indian writers finding publication
    – whose sudden increase was identified by Kenneth Lincoln as a Native literary
    ‘Renaissance’—expressed a common ‘sense of dispossession’, a ‘shared struggle
    for cultural survival and rebirth’³ in the face of Euro-American racism and active
    attempts to eradicate Native cultures through a wide range of federal policies.
    The works of these Indian writers provided pertinent commentary on the realities
    of contemporary Native life in the US: a crucially important non-fiction Indian
    text of 1969 was Vine Deloria Jr’s *Custer Died For Your Sins: An Indian Manifesto*
    which, as its title suggests, presented a Native view of the federal–Indian relationship.
    Significantly, fictional texts also celebrated and promoted Native values and
    world-views, developing innovative literary styles and structures to portray and
    incorporate traditional oral storytelling devices, by which the colonial language
    could demonstrate the colonised experience. Thus, as Louis Owens noted, Native
    literature enabled an ‘oppressed and marginalized minority [¹⁰] continually subvert[t]
    the authority of dominant discourse’⁴ Indian writers of this period, such as N.
    Scott Momaday (Kiowa), James Welch (Blackfoot/Gros Ventre) and Leslie Marmon Silko
    (Laguna Pueblo), therefore build upon the more politicised work of authors such
    as Mathews and McNickle to engage in conscious and deliberate acts of cultural
    mediation and translation.'
