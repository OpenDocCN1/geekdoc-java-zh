    # Resistance Writings: James Welch (1940–2003)


    The influence of Momaday''s work can be detected in a range of subsequent Native
    writers, including the work of James Welch. Welch was born in 1940, in Browning,
    Montana, as a Blackfoot father and Gros Ventre mother, both of whom were also
    of Euro-American ancestry. Schooled on the Blackfoot and Gros Ventre reservations,
    Welch went on to study creative writing at the University of Montana, and subsequently
    taught at Cornell and the University of Washington. While his social awareness
    can be detected in his service for the Parole Board of Montana Prisons System,
    his commitment to his Indian heritage is evident in his work as a Director at
    the Newberry Library D''Arcy McNickle Center. The cultural and literary value
    of Welch''s writing was recognised in 1997 with a Lifetime Achievement Award from
    the Native Writers Circle. In 2003, Welch died at the age of 62 while battling
    against cancer.


    Welch''s engagement with traditional Native lives and his analysis of the impact
    of Euro-American culture is evident throughout his writings. In particular, the
    political realities of contemporary Native life can be traced through works that
    ground the federal-Indian relationship within specific historical eras and events.
    Above all, Welch''s writings are powerful because they do not shrink from demonstrating
    the truth of Euro-American colonisation that often devastated Indian cultures
    and senses of community and which, through assimil policies, alienated a whole
    generation of Indian children. In this sense, Welch''s writings can be interpreted
    as resistance or protest literature, giving expression to this cultural alienation.
