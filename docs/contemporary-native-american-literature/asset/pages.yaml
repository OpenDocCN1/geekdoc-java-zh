    # New Directions in Native Writing


    Alexie''s profound popular success builds upon that of Erdrich, and both have
    been highly influential in encouraging further Indian writers to publish. While
    Alexie and Erdrich''s success has ensured the continuance of dedicated Indian
    literature series with university presses due to a wider popularity of Native
    writing, it has also been responsible for attracting the attention and interest
    of mainstream publishers interested in the demands of the popular market. Recent
    Native writers have thereby presented with a range of choices regarding where
    to publish which, in turn, influenced the kinds of literary strategies that are
    adopted. My subsequent discussion provides a brief overview of these choices,
    examining one mainstream popular approach, before turning to the gender interests,
    approaches and strategies evident in a range of Native writers.


    One of the most significant writers to emerge in recent times, certainly in terms
    of gaining a popular audience and widespread critical attention (Ojibwe). Born
    in 1971, Treuer was raised on the Leech Lake Reservation in northern Minnesota,
    and is the son of a Holocaust survivor and a tribal judge. Graduating from Princeton
    in anthropology and creative writing, Treuer currently teaches English at the
    University of Minnesota and is active in work to maintain the Ojibwe language.
    Treuer has published two novels, with a third novel (*The Translation of Dr Appelles*)
    plus ''users manual'' for Native American fiction published in 2006, and his work
    has won a range of prizes including, in 1996, the Minnesota Book award and the
    Pushcart Prize. Treuer''s work is significant in part for his work distribution:
    like Erdrich and Alexie, Treuer has published with a mainstream publisher and
    so attracts a wide Euro-American audience. However, Treuer''s work is equally
    important for the complex socio-cultural and political issues that he discusses.
    For instance, his first novel, *Little (1995)*, opens in a small reservation community
