  md: '# 20.


    # What to do if you want to stop eating UPF


    If you personally want to stop eating UPF, then you could try what Xand and I
    did: go on an 80 per UPF diet for a few days. You don’t need to do the full four
    weeks. Go and seek it out. Grapple with it. You''ll find yourself in front of
    a cottage pie or a lasagna which is on the cusp of the NOVA 4 definition, with
    maybe just a little spice extract or some dextrose and you''ll try to figure out
    – is this UPF? And you''ll understand what Maria Laura da Costa Louzada meant
    about fantasy foods. You''ll bite into some cheap chocolate or tangy crisps and
    you''ll find Fernanda Rauber in your ear: ‘It’s not food. It’s an industrially
    produced edible substance.’


    If you recognise in yourself that you might have an addictive relationship, you
    can go online and search for the Yale Food Addiction Scale test. If you think
    you are addicted, get some help if you can – whether from a friend or a relative
    or your doctor.


    You may want to take an approach that you will eat some UPF but will steer clear
    of the problem products. You may recognise vulnerable moments and foods, so that
    eating a UPF sandwich for lunch with a friend is not going to prompt a binge,
    whereas eating crisps at home while hungry may be more likely to.


    You may find it much easier to be abstinent. Xand and I find this the best approach.
    Our relationship with it was an addiction, and for us abstinence is the only solution.
    Xand quit UPF and shed around 20kg in a few months. He is entirely abstinent.
    No exceptions, ever.


    And remember that UPF is just a substance through which other problems are realised.
    There are often reasons why we eat it. These are often the same reasons why so
    many of us struggle with addiction to other'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'substances. You may have to fix some of those other problems before you can
    tackle UPF. You may know what they are. Again, get some help.


    If you stop eating UPF, then you''ll need to eat something, and it will cost you
    in time and money. There are plenty of cookbooks for those on a budget, but there
    are two authors I particularly recommend: Allegra McEvedy and Jack Monroe. Their
    recipes are cheap, and delicious. Cooking meals will be a hassle, but one that
    connects you to a long chain of time-hassled humans who survived long enough to
    make it.


    You may not lose loads of weight. I said at the beginning that this was not a
    weight-loss book. Barry Smith, after we had worked together on the podcast that
    preceded this book (Addicted to Food), quit UPF. His students started calling
    Barry, a reflection of how broken our food system is simply eating normal food
    makes you some sort of weird diet freak. Anyway, he felt that having left UPF
    before he could eat much cheese, butter and real bread as he liked. But men of
    mine and Barry''s age have been able to put on weight since long before the invention
    of maltodextrin. He quickly found out that he did need to moderate his cheese
    intake.


    We are ultra-processed people not just because of the food we eat. Many of the
    other products we buy are engineered to drive excess consumption; our phones and
    apps, our clothes, our social media, our games and television. Sometimes these
    can feel like they take much more than they give. The requirement for growth and
    the harm it does to our bodies and our planet is so much part of the fabric of
    our world that it''s nearly invisible. You may find that abstinence from some
    of these other products is helpful too.


    Finally, make sure that, like Xand, you own what you want to do. And, whatever
    happens, don''t beat yourself up, but get in touch and let me know how it goes.'
