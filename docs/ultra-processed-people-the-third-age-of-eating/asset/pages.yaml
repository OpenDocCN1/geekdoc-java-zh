  md: '# 11.


    # UPF is pre-chewed


    Anthony Fadet may not have been the first person to consider what he calls the
    food ‘matrix’, the physical structure of food, but he may have thought about more
    deeply than anyone else alive. He’s serious, with thick, greying hair. I guess
    he’s about my age. He’s a scientist in the Human Nutrition Unit at Université
    Clermont Auvergne in France. Everything he says seems profound and important,
    partly because he uses a lot of long words, and partly because he comes with a
    French movie-star accent: ‘We eat food, not nutrients. So, from a philosophical
    point of view, the best thing is to combine holism and reductionism, I am an empiricist
    and an inductivist.


    I had a feeling I was also an empirical inductivist but not entirely sure and
    resolved to check later. I was calling him to ask about how ultraprocessing affects
    the physical structure of food and how this in turn affects our bodies. The principle
    of the matrix is pretty straightforward: that food is not merely the sum of its
    constituent parts. Anthony explained that the purpose of the digestive system
    is to destroy the food matrix. He used apples as an example. The fibre that gives
    an apple crunch and solidity up just 2.5 per of the apple’s weight. The other
    97.5 per cent is juice. The way the fibre is arranged around the cells and the
    fluid – that’s the matrix.


    With this mind, a small group of scientists back in 1977 fed people in three different
    forms: apple juice without any of the pulp (fibre free), raw apple smoothie and
    whole chunks of apple. They made the participants eat everything at the same speed
    and then measured fullness (satiety), blood sugar and insulin in response to the
    three different apple preparations.'
