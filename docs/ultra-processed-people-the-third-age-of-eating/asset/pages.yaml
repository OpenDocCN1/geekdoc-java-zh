    # Sure, ‘ultra-processed food’ sounds bad, but is it really a problem?


    The second weekend of my diet went near a camping trip with my brother Xand and
    my two brothers-in-law, Chid (Richard) and Ryan. We drove west from London toward
    Wales, stopping at Leigh Delamere services, a festival of UPF. I bought Cool Original
    Doritos, two cans of Red Bull and packets of Skittles and Haribo Supermix for
    the rest of the journey.


    We slept in a beautiful spot near a waterfall in the Brecon Beacons National Park,
    spoiled only by my waking dreams about food and my body. I imagined my blood had
    thick and sticky, as if it had become too concentrated from the salt and sugar.
    I woke up early, feeling sad and unwell.


    I diluted myself with some water and cheered up breakfast looking at the ridge
    of mountains. We had Kellogg''s Crunchy Nut Clusters (with wholegrain and no artificial
    colours or flavours and a promotion for adults to go free at Aldioland) and Alpen
    Original Recipe ‘naturally wholesome muesli’


    Ryan, an internationally renowned psychology professor from Australia, was astounded
    to see I was eating Alpen on my UPF diet: ‘What’s wrong with Alpen? It’s natural
    and wholesome.’ I told him that it technically qualified as UPF because it has
    milk powder in it, an ingredient that isn’t typically used in home cooking.


    He looked genuinely baffled. ‘But the mountains on the pack look pristine!’ I
    responded that it was still UPF. Chid and Xand agreed. ‘Well, it tastes good,’
    he insisted. If the packaging can persuade Ryan, it can persuade anyone.'
