    in the most deprived regions of the UK have almost double the prevalence of obesity
    than in the least deprived. Could the real significance of UPF consumption be
    that it''s a proxy for poverty?


    Or could it be that, unhealthy behaviours tend to go in hand, higher UPF consumption
    is a marker of an overall unhealthy diet or lifestyle? That is, might people who
