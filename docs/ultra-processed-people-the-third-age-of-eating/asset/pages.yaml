    It was a clear approach. Policies like taxing or banning formula have been very
    harmful. Infant formula is UPF, but it is unique among UPFs in the sense that
    it is an essential food (although some other types of UPF can become essential
    in contexts where they are the only affordable and available source of calories).
    People have a right to use it, and should have the freedom to use it. This means
    formula must be cheap, high quality and widely available. People also have a right
    to accurate information about the benefits and hazards of different ways of feeding
    a child, which includes a right not to be exposed to misleading claims.


    Nestlé rehabilitated their reputation to the extent that George Clooney felt could
