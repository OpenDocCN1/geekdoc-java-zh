    # ... or about willpower


    Just as we think we can consciously modify energy expenditure by doing more exercise,
    there is a nearly universal idea that you can consciously override the internal
    system that regulates food intake using willpower. It''s pervasive, and it''s
    linked to a lot of stigma. For some reason, in medicine at least, this idea is
    very specific to weight gain. You never hear it about people with other diet-related
    disease like cancer or cardiovascular disease.


    Linked to the idea that weight gain can be reversed by the exertion of will is
    another discomforting idea – that there be two categories of people with obesity,
    those who have a biological or genetic condition, and who are therefore not to
    blame, and those who have simply made bad choices. This idea is routinely promoted
    in the press.[fn64] let''s inspect it.


    Obesity is somewhat hereditary. Almost everyone with obesity will have genes that
    drive it. There are two broad kinds of genetic obesity. There are rare defects
    in single genes, which lead to cases in which weight gain is essentially unavoidable
    no matter the environment.[fn65] But the vast majority of people with obesity
    have many minor genetic differences compared with people with lower BMI. Most
    of these differences are in genes that work in the brain and that affect eating
    behaviour.


    Giles Yes told that genes affect eating behaviour, including the speed at which
    people eat and the foods they choose. The work to discover this was done at UCL
    by Jane Wardle and Clare Llewelly, who show that genetic variation affects eating
