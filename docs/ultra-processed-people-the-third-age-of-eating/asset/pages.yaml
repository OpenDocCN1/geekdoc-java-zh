    The fact that Kevin proved himself despite these factors makes his findings all
    the most robust. The impact of the experiment can''t be overstated. The study,
    although small, was so well conducted that it provided tantalising evidence that
    Monteiro''s theory may indeed explain the rise in obesity across populations.
    Hall''s work gave a scientific heft to the NOVA classification system, and many
    scientists started to see it as a legitimate way of defining the category of food
    associated with obesity. It seemed like it might have the power to resolve the
    contradictory observations that had dogged nutrition research for so long: the
    confusion over fat and sugar, the failure of diet products to help with weight
    loss, the relentless increase in obesity around the globe. Hall''s findings catalysed
    a massive new research effort and have been cited by hundreds of other scientific
    papers and dozens of policy documents.


    Clinical studies like Hall''s cost millions of dollars and can only be conducted
    in a few specialist centres around the world. But ''real world'' epidemiological
    evidence to support Hall''s experiment has continued to stack up. Since 2010,
    more and more has accrued suggesting that UPF is probably the primary cause of
    not only the rapid rise in obesity, but potentially of all sorts of other health
    problems as well. What was once a trickle of evidence has become a deluge since
    Hall''s study was published in 2019.


    I was still on day when Rachel Batterham decided to bring someone into her research
