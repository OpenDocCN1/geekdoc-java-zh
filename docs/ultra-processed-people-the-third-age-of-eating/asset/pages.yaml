  md: 'This technique was invented in the fifties. Participants drink water in which
    the hydrogen and oxygen atoms have been ‘labelled’ – the nuclei of the atoms have
    extra neutrons in them, which means that the atoms can be traced. You may have
    heard of ‘heavy water’ – this is that. The body gets rid of the oxygen and the
    hydrogen at different rates according to calorific expenditure fn62 It’s not perfect,
    but it’s very consistent from one year to the next and it’s widely agreed to be
    the best way of measuring how much energy people are expending.


    These doubly labelled water data showed people burning 2,500 calories per day,
    exactly as expected. We simply cannot gaining weight as a nation if we’re eating
    fewer than 2,000 calories per day but burning more than 2,500. It breaks rules
    of physics that everyone agrees on.


    What the doubly labelled water study showed is that people in surveys were underestimating
    their calorie consumption by more than 30 per. US studies bach comparison of the
    US Health and Nutrition Examination Survey’s doubly labelled water data with the
    actual survey data showed consistent under-reporting of how many people eat and
    over-reporting of how much they move.26


    Snowdon’s argument might have been valid if people had been consistent over time
    underestimating what they eat. If we always underestimated our calorie intake,
    then it might still be the case that inactivity could the main problem leading
    to weight gain. But the doubly labelled water experiments showed that we’re actually
    underestimating how much we eat to a much greater extent than we did a few decades
    ago.


    There are several explanations for this under-reporting, and they’re all well
    evident. First, studies show that people living with obesity misreport on questionnaires,
    and then, if they lose weight, they stop misreporting and admit to their previous
    inaccurate responses.27 It doesn’t take too much empathy to imagine why residents
    living with obesity might provide underestimates when answering food questionnaires.
    People regularly under-report things they find shameful.


    Second, studies have shown that to lose weight increases under-reporting, and
    there has been a huge increase of diet-awareness, dieting and the desire to lose
    weight since the 1990s. We know, for'
