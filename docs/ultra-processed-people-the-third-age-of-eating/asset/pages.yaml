    # # What we could ask governments to do


    Carlos Monteiro told me a story about his time at medical school in the mid-1970s.
    His wife was also a medical student, and they went together to classes on infant
    feeding. The information perhaps seemed more memorable to them than it did to
    me when I had similar classes twenty years later. Monteiro even remembered the
    name of the lecturer. ‘He was called Oswaldo Balarin.’


    As with Carlos’s wife, there were several other students and young doctors in
    the department who were pregnant, and every month they were sent a package of
    supplies: diapers and formula milk. When his daughter was born, they breastfed
    her briefly but then switched to the formula they’d been given. Monteiro told
    me this was normal: ‘Even in the remote valleys where I was studying malnutrition
    the women would register for formula from feeding centres.


    A few years later he went to New York to study. He met a British couple Derrick
    and Patrice Jeffiffe who were studying infant malnutrition. In a series of papers,
    they had meticulously documented aggressive marketing practices by the infant
    formula industry in low-income settings, with a particular focus on Nestle. Sales
    representatives with no certification or training were dressed up as ‘mothercraft
    nurses’. They advised impressionable mothers about the benefits of formula and
    promoted it in such a way that has been linked to thousands of avoidable deaths.


    Nestlé and some other formula companies were causing a quadruple jeopardy.'
