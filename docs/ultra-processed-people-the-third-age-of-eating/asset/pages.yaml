  md: '# About the Author


    Chris van Tulleken is an infectious diseases doctor at the Hospital for Tropical
    Diseases in London. He trained at Oxford and has a PhD in molecular virology from
    University College London where he is an Associate Professor. His research focuses
    on how corporations affect human health especially in the context of child nutrition
    and he works with UNICEF and The World Health Organisation on this area. As one
    of the BBC’s leading broadcasters for children and adults his work has won two
    BAFTAs. He lives in London with his wife and two children.


    On Twitter and Instagram @DoctorChrisVT'
