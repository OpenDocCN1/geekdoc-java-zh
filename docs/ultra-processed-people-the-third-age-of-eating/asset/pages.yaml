    fn48 Before you even start to eat, your stomach secretes a hormone called ghrelin
    the ‘hunger hormone’ – which flows in the blood to a part of the brain called
    the hypothalamus and tells it to start eating. Ghrelin stimulates the ‘wanting’
    neurons, the dopamine ones in the limbic system. As the food makes its way into
    your intestine, still more hormones released. There’s cholecystokinin, which sends
    a nerve signal to the unconscious centres of the brain at the top of the spinal
    cord, which in turn passes the message to the hypothalamus, making you feel physically
    full. Then there’s peptide YY and glucagon-like peptide 1, which flow in the blood
    to the hypothalamus and reduce the joy of eating, and a whole of other catchily
    named hormones and neurotransmitters that act in concert to determine food intake.
    And that’s before we get to the hormones secreted when you fast or starve.


