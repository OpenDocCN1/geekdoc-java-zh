    # The three ages of eating


    I find it helpful to think of eating as something that has happened in three

    dinct but overlapping ages, all of which are still going on today.


    In the first age of eating, living organisms began to eat stuff that has

    never been alive, like rocks and metal. This process has continued since

    the dawn of time to the present day. During the second age of eating,

    living organisms started to eat other living organisms, perhaps after some

    processing. This has been going on for hundreds of millions of years (and

