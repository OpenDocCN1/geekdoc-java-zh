  md: 'What they found that both the juice and the puree caused blood sugar and insulin
    levels to spike higher than the whole apple, before falling to a lower level than
    they had been in the first place. As a result of the sugar crash, all the participants
    still felt hungry. The whole apple, meanwhile, made blood sugar rise slowly, before
    it returned to the baseline level – no crash, and the fullness from the whole
    apples lasted hours. It seems our bodies have evolved to manage the sugar load
    from an apple precisely, but fruit juice is a relatively new invention.fn79


    Apple juice, which is typically around 15 per cent sugar, behaves like any sort
    dry. But does the apple puree, even though it contains all the constituents of
    the apple, including the fibre, and was made moments before consumption. Fibre
    is important, and by the matrix, the structure of the apple, is key.


    Take Coco Pops. They’re branded as being crunchy, and a few do crunch – at least
    for a while. But each mouthful is predominantly a slick of wetarchy globs. The
    Coco Pops and milk form a textured liquid. It’s softness is one of the characteristics
    that Kevin Hall identified as a near universal quality of UPF.fn80 The softness
    is down to the method of construction – instantly modified plant components and
    mechanically recovered meats are pulverised, ground, and extruded until the fibrous
    tissues of sinew, tendon, cellulose and lignin are destroyed. What remains then
    can be reassembled into dinosaurs or letters of the alphabet or the hyperbolic
    paraboloids of Pringle snacks.


    The marketing primes us to register an initial crunch of batter, the pop of a
    puffed rice crisp, the snap of a fried potato chip, but these yield to the slightest
    bite. The foods are cleverly textured – a jelly filling with a dry sponge, or
    chunks of real vegetables in soup – to disguise the fact that, within seconds,
    we’re eating mash.


    A McDonald’s hamburger (or one from Burger King or any other UPF supplier) is
    another perfect example of the illusion. The first bite rewards you with a sequence
    of textural experiences: the sweet bun has a dry crust over a creamy, spongy matrix,
    the burger is rubbery and as salty as seawater, the gherkins and onions provide
    a crunch, the mustard tickles your triginal nerve and the acidity in the ketchup
    sets off the experience. “Spongy’, ‘rubbery’, ‘crunchy’ – but really it’s all
    just as soft as down. As a result, I can inhale a burger in well under a minute.
