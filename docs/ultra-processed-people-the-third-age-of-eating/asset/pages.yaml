  md: 'money is called ultra-processed food, or UPF. These foods have been put through
    an evolutionary selection process over many decades, whereby the products that
    are purchased and eaten in the greatest quantities are the ones that survive in
    the market. To achieve this, they have evolved to subvert the systems in the body
    that regulate weight and many other functions.fn2


    UPF now makes up as much as 60 per cent of the average diet in the UK and the
    USA.5,6,2 Many children, including my own, get most of their calories from these
    substances. UPF is our food culture, the stuff from which we construct our bodies.
    If you are reading this in Australia, Canada, the UK or the USA, this is your
    national diet.


    UPF has a long, formal scientific definition, but it can be boiled down to this:
    if it''s wrapped in plastic and has at least one ingredient that you wouldn''t
    easily find in a standard home kitchen, it''s UPF. Much of it will be familiar
    to you as ‘junk food’, but there''s plenty of organic, free-range, ‘ethical’ UPF
    too, which might be as healthy, environmentally friendly or useful for weight
    loss (it''s another rule of thumb almost every food that comes with a health claim
    is a UPF).


    When we think about food processing, most of us think about the physical things
    done to food – like frying, extruding, macerating, mechanically recovering and
    so on. But ultra-processing also includes other, more indirect processes – deceptive
    marketing, bogus court cases, secret logging, fraudulent research – all of which
    are vital for corporations to extract money.


    The formal UPF definition was first drawn up by a Brazilian team in 2010, but
    since then has emerged a vast of data in support of the hypothesis that UPF damages
    the human body and increases rates of cancer, metabolic disease and mental illness,
    that it damages human societies by displacing food cultures and driving inequality,
    poverty and early death. The food system necessary for its production, and of
    which it is the necessary product, is the leading cause of declining biodiversity
    and the second largest contributor to global emissions. UPF is thus causing a
    synergistic pandemic of climate change, malnutrition and obesity. This last effect
    is the most studied, and the hardest to talk about, because discussions of food
    and weight, however well intentioned, make a lot of people feel very bad.fn3'
