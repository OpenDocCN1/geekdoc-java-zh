  md: 'the industry they seek to regulate. The relationship cannot be one of partnership.


    Aside from getting industry out of the room, there are a few specific policies
    that are worth considering.


    Chile has some of the highest obesity rates in the world, with three-quarters
    of adults living with overweight or obesity. Officials have been particularly
    alarmed by childhood obesity rates that are among the world’s highest, with over
    half of six-year-old children overweight or obese.


    In 2016, Chile implemented a set of policies that put marketing restrictions and
    mandatory black octagonal labels on foods and drinks high in energy, sugar and
    saturated fat. These foods were also banned in schools and heavily taxed.46


    These policies banned treats from Kinder Surprise eggs and removed cartoon animals,
    including Tony the Tiger and Cheetos’ Chester Cheetah, from packaging. PepsiCo,
    the maker of Cheetos, and Kellogg’s, producer of Frosted Flakes (known in the
    UK as Frosties), have gone to court, arguing that the regulations infringe on
    their intellectual property, but at the time of writing Tony and Chester are not
    on the packs.fn141


    It was a masterclass in the technical side of policy making, developed in consultation
    with the public and then tested and trialled. All the participants in lay groups
    wanted clear labelling.


    The labelling has had a huge impact, with decreases in food purchases and, perhaps
    most significantly, research showing that the regulation made children ask their
    parents not to buy the products.48


    This chimes with my own experience of kids – they’re smart. Sure, they’re vulnerable
    to marketing, but they’re not easily motivated by the moment. They care about
    their own health and the health of their parents.


    Whether these policies shift the dial on obesity, or even stand up to continued
    industry pressure, isn’t yet clear, they offer a template for approaching the
    problem. When people are able to make good choices, they do.


    When it comes to specifics, personally, I don’t think the aim of policy is for
    people to eat less UPF. That’s not the business of politicians. I don’t want to
    tell what to do to any more than Xand did.


    I sincerely don’t have a moral opinion about eating UPF. None of my friends believe
    this, but it’s true. I don’t care how you feed yourself or'
