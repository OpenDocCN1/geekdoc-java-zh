  md: 'We have fairly good tests for whether molecules cause cancer, birth defects
    and immediate toxicity, but more subtle long-term harms were – and still are –
    much harder to assess. Whether an additive causes issues that are detectable only
    after years of exposure – depression, increased suicidality in teens, weight gain
    in young adulthood, reduced fertility, inflammatory disease or metabolic disease
    like type 2 diabetes – is difficult to discern.


    In the 1950s, Congress recognised the possible connections between these diseases
    and food additives, and the challenge of proving them. In particular, they directed
    the FDA to consider the ‘cumulative effect’ of these chemicals. ‘Cumulative’ is
    an important word.


    Let’s take thyroid function as an example. We know that low doses of lots of chemicals
    that are added to food or that end up in food from pesticides or packaging can
    damage the thyroid. Polybrominated-diphenyl-ethers, perchlorate, organophosphate
    pesticides, per- and polyfluoroalkyl substances (PFAS), bisphenol A, nitrates
    and ortho-phthalates all disrupt various aspects of the thyroid hormone. A low
    dose of any one of them may be harmless, but what about when they are present
    in small doses in foods that are consumed for prolonged periods?


    These concerns led to the 1958 Food Additives Amendment, which looked like it
    would empower the FDA to regulate the hell out of food additives and require extensive
    testing to ensure they were safe. It sought to protect those who might be vulnerable.
    That’s all of us who eat or have food in the USA, especially children who are
    uniquely susceptible to toxic substances in their diet – partly because they are
    still developing, partly because they are likely to have longer exposures than
    adults who are first exposed when halfway through life, and partly because they
    eat and drink more as a proportion of their size compared with adults.


    But – and this is an important ‘but’ – the amendment allowed an exception to the
    term ‘food additive’. Some substances were to be considered ‘generally recognized
    as safe’, or GRAS, a designation that was intended to allow manufacturers of common
    ingredients, such as vinegar and table salt, to bypass the FDA’s lengthy safety-review
    process when their products were added to processed foods.'
