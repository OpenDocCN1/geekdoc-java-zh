    is why it causes ill health. Another critique is that, since people who eat UPF
    less minimally processed food like fruit, vegetables, cereals, beans, legumes
    and seafood, the association between high UPF intake and poor health could be
    because UPF is displacing food from the diet. Perhaps if people ate UPF with lots
    of lentils and broccoli the effects would disappear? Or perhaps the UPF could
    be reformulated, with less sugar and fat and vitamins and minerals added?


    There''s also the argument that because UPF is, on the whole, cheap, it could
    be that people who eat it in large quantities are more likely to have lower incomes
