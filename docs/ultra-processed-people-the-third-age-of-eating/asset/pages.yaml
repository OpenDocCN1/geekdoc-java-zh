    a fancy machine like a linear collider. But other times a dog walker finds a dead
    goose in a park and it''s the first data point in a bird flu pandemic.


    Of course, in reality, the arbitrary astrological proposition would be supported
    by none of the data and the model would collapse. The researchers would need to
    go and look for another cause, like a food system that compels people to eat lots
    of industrially produced food, or being a Sagittarius. The power of good science
    is that it can handle a bad, wrong or arbitrary hypothesis. That,, is, is the
    defining characteristic of science.


    Real-life science often starts with something arbitrary. Sticking things in boxes.
    Grouping things together. Naming them. We have to draw a line somewhere and describe
    the object of interest. In the physical sciences, the boundaries are often clearer.
    In physics, particles are grouped and described how they behave in gravitational
    or electromagnetic fields. In chemistry, elements are ordered in the periodic
    table according their subatomic composition and chemical behaviour. The systems
    are objective and discrete.


    Sometimes, in the biosciences, we also have well defined categories. HIV is now,
    a binary diagnosis: you have it or you don''t. But many of the most pressing are
    fuzzier. Obesity in adults is defined, arbitrarily, as having a BMI of 30 or above.
    It wouldn''t matter if the threshold was 29 or 31 instead There''s no sudden change
    in health that happens at 30 – the risks are gradually increasing. Almost all
    biological measurements – blood pressure, hemoglobin, lung capacity – fall along
    a continuum. At some point we draw a line, somewhat arbitrarily, and say the one
    side of the line have high blood pressure or anaemia or obesity and those on the
    other side don''t.


    That was Monteiro''s team''s genius: they drew a line. Or perhaps their genius
    was to decide that a line could be drawn at all – that is harmful food and that
    can be defined. And while the exact place to draw the line is arbitrary, the idea
    that there are dietary patterns that cause disease and others that don''t is not
    arbitrary. That comes from a huge volume of carefully collected and analysed data.
    And it''s also not arbitrary to propose that food produced for profit might be
    designed, deliberately or inadvertently, to make us consume it to excess.'
