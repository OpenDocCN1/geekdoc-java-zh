    \ CCP（共同职责原则）完美适用的原因。\n\n然而，通用的微服务文献建议使用领域驱动设计（DDD）中的“边界上下文”（Bounded Context）概念来确定每个微服务的粒度。边界上下文被设计为一种解决方案，用于理解并一个企业级应用程序划分为组织中每个领域内不同职责的子领域。边界上下文和\
    \ CCP 都会产生垂直分层，促进我们在上一节中描述的目标实现。本书的意图并不是深入 DDD 或边界上下文，对于这些内容，我们推荐 Eric Evans 的著作。此外，关于微服务的书籍也探讨了这一话题，与\
    \ Newman 的书内容相同。\n\n同样，《软件架构基础》一提出了三个元素来帮助将应用程序拆分为微服务：\n\n- **目的 (Purpose)**：理想情况下，每个微服务应该在功能上是内聚的，代表整个应用程序贡献一个重大的行为。\n\
    \n- **事务 (Transactions)**：边界上下文是业务工作流，通常在事务中需要协作的实体显示出良好的服务边界。因为事务在分布式架构中会导致问题，架构师可以设计系统来避免它们，从而产生更好的设计。\n\
    \n- **编排 (Choreography)**：如果架构师构建了一系列提供极佳领域隔离但需要大量通信才能运行的服务，架构师可能考虑将这些服务重新封装成一个较大的服务，以避免通信开销。\n\
    \n“微服务”一词似乎暗示了每个应用程序应该只做最少的工作。标准是基于子领域的，也许某些子领域并不较小。因此，前节中解释的内容是重要的。在每个微服务中，有必要拥有模块或层的稳固架构，而不是在单体应用中使用条条代码（spaghetti\
    \ code）。在架构中是正确的，如果应用程序的规模相对较小，翻译条条代码会更简单。\n\n当你指的是小型或中等规模的软件时，实际上意味着在每次迭代中进行更改是可能的。如果将应用程序划分为微服务，每个微服务缺乏稳固结构，应用程序的复杂性将比单体应用中的条条代码增长得多。因此，迟早这种方式会获胜。\n\
    \n因为客户端与微服务之间的通信仅以定义的形式进行（并在每次提交时验证），有些书籍专门提到微服务相对于单体架构的主要优势，即开发者可以直接进入数据库，无需通过中间层。正如我们在之前的章节中看到的，你可能注意到这一点。使用\
    \ Java 或 ArchUnit 等工具验证架构，可以确保访问是定义的。因此，使用这种架构的原因，正如我们所提到的，是可扩展性、性能和可用性。当我们谈论可扩展性时，它是双重目的：一方面，应用程序可以支持更大的需求而不需要过多精力；另一方面，通过消除单体应用的瓶颈来获得开发速度。\n\
    \n## 实现\n\n因此让我们看看如何将一个应用转换为微服务架构。我们在上一节中实现的垂直分层模块架构是向微服务架构迈的**第一步**。我们将这些项目作为基础，将每个模块转换为微服务。\n\
    \n我们将拥有三个微服务：**UserProfile、Competitions 和 Notifications**。第一件事将向 UserProfile 和\
    \ Competitions 模块引入 Web 包以通过 *https* 暴露服务。然后我们将引入发布/订阅机制来执行微服务之间的通信。看下面的图 4.7：\n\
    \n![img/9a234376112e1c1314852446ae6a2fd_101_0.png]\n\n图 4.7：模块/层的微服务\n\n看图 4.7。每个微服务使用六形架构实现。Competitions\
    \ 和 UserProfile 拥有通过 https 暴露服务的 web 包。而 Notifications 是一个独立的应用程序。让我们记住，需求之一是在注册时通过电子邮件通知监听者。为了允许微服务相互通信，我们引入了发布/订阅机制。最后发送电子邮件给监听者的是\
    \ Notifications 服务，但为了做到，它需要监听者的邮箱地址、标题和正文。知道有人在比赛的是 Competitions，为了让其他微服务知道注册已完成，它发布“inscription-added”事件。监听者的邮箱地址是\
    \ UserProfile 服务。为了与需要的人共享信息，每当添加一个新的监听者，就会发布“new-listener”事件（如果我们增加了修改监听者邮箱的可能性，应该发布新事件）。Competitions\
    \ 订阅“new-listener”事件及其关系数据模型。同样，在比赛中进行新注册的操作会生成“inscription-added”事件，它包含了注册监听者的数据邮箱地址、标题和正文。最后，Notifications\
    \ 服务订阅“inscription-added”事件，每当事件到达时，向监听者发送电子邮件。\n\n让我们继续展示每个微服务的源码，以主要了解它们如何暴露服务以及如何发布和订阅事件。让我们从\
    \ User 服务开始。\n\n### UserProfile - 添加新监听者\n\n```\nPOST https://[host]/listener\n\
    {\n  \"personId\": \"string\",\n  \"name\": \"string\",\n  \"lastName\": \"string\"\
    ,\n  \"email\": \"string\",\n  \"phone\": \"string\",\n  \"user\": \"string\"\
    ,\n  \"pwd\": \"string\"\n}\n```\n\n```\nSuccessful response:\n{\n  \"result\"\
    : \"success\"\n}\n```\n\n```\nError response:\n{\n  \"result\": \"error\",\n \
    \ \"message\": \"string\"\n}\n```\n\n### UserProfile - 根据 ID 获取监听者\n\n```\nGET\
    \ https://[host]/listener/[id]\nSuccessful response:\n{\n  \"result\": \"success\"\
    ,\n  \"email\": \"string\",\n  \"personId\": \"string\",\n  \"lastName\": \"string\"\
    ,\n  \"name\": \"string\"\n}\n```\n\n```\nError response:\n{\n  \"result\": \"\
    error\",\n  \"message\": \"string\"\n}\n```\n\n### UserProfile - 身份验证\n\n```\n\
    POST https://[host]/authenticate\n{\n  \"user\": \"string\",\n  \"pwd\": \"string\"\
    \n}\n```\n\n```\nSuccessful response:\n{\n  \"result\": \"success\",\n  \"token\"\
    : \"string\"\n}\n```\n\n```\nError response:\n{\n  \"result\": \"error\",\n  \"\
    message\": \"error message\"\n}\n```\n\nUserProfile 暴露三个服务：一个将监听者添加到数据库中并最终发布“new-listener”事件；另一个通过其标识符获取监听者；最后一个是验证监听者的服务。\n\
    \n我们所有作为微服务实现的应用程序都有一个 main.Main 类，用于实例化、注入依赖并启动 https 服务。让我们看看 UserProfile 微服务是如何解决它的：\n\
    \n"
