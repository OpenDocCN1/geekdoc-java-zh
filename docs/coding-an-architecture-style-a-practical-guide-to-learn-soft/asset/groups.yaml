  - "[PAGE 31]\n\n# Modules, Layers and their Architecture Styles\n\nthe definitions\
    \ and rules present in the problem domain that we are modeling. It also decides\
    \ services from the persistence layer to invoke. Finally, the persistence layer\
    \ contains source code that deals with the interfaces and drivers from the storage\
    \ services.\n\nThe layered architecture style can be closed, that is, each layer\
    \ can only access the layer immediately below, or it can be open for example the\
    \ user interface layer is allowed to access the persistence layer.\n\nEach architecture\
    \ style imposes certain rules on us. We generally get relaxed about checking these\
    \ rules and end with an application with spaghetti code. For this reason it is\
    \ important to have a verification mechanism for the defined architecture rules,\
    \ as those presented in the previous section.\n\nIn the next section we are going\
    \ to go by step building an application in such a way that allows us to understand\
    \ how this architecture is implemented.\n\n# Implementation\n\nTo show how the\
    \ layered architecture is implemented we are going to use an existing small application\
    \ without any architecture rule. During this learning experience we are going\
    \ to refactor it towards a layered structure.\n\nThis application that we will\
    \ call \"RadioA\" is used as part of the operation of a radio show. The radio\
    \ show launches competitions with a certain frequency. The competitions are promoted\
    \ during the radio show where conditions and the rules are indicated. Listeners\
    \ must send an email to request the registration to the competitions and an employee\
    \ of the radio uses the \"RadioA\" application to register them.\n\nTo persist\
    \ the inscriptions to competitions we have defined the following relational schema:\n\
