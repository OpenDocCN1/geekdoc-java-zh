    The Microservices architecture style, like the previous style, has similarities
    with modular architecture, as the criteria used to split an application is the
    same. The difference is that we are talking about applications, not modules, and
    the communication between them is in the form of inter-process. So far from my
    description there is no difference with the distributed monolith. So What do Microservices
    have special? How does it differ from Monolith?


    It proposes to remove temporal coupling. This style creates that Microservices
    should be autonomous. Microservices must be developed, tested and deployed isolated
    from the rest of the system. As we have said, in the monolith none of these can
    be.


    How can this be achieved?


    We have to change the way Microservices communicates. The temporal coupling is
    generated by the synchronous communication. And to that, as we do in software
    design, we have to put another element between the two.


    We can do this by using publish/subscribe mechanisms for their communication,
    which is an asynchronous talk between them. Its main characteristic is that neither
    of the communication has knowledge of the other. The one consumes messages subscribes
    to a category of messages (or specific topics) and the one who produces messages,
    has no knowledge of who may be interested in them. This mechanism removes the
    temporal coupling between Microservices. Any form of coupling between Microservices
    must be removed from the system, and with that we are eliminating any possibility
    of code reuse between Microservices. In other, in this style of architecture,
    independence between teams is favored over code reuse. Sam Newman in his book
    Building Microservices⁵ states:


    > "The evils of too much coupling between microservices are far worse than the
    problems caused by code duplication"


