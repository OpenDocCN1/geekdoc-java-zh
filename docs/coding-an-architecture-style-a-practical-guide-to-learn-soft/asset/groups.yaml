    solid modular architecture does not require the help of mechanisms like the one
    that Java9 gives us. It can be implemented simply with packages or namespaces
    as long as clear rules are defined regarding the dependencies between them, criteria
    for grouping classes in them, and most importantly, where these rules are validated
    in every commit.


