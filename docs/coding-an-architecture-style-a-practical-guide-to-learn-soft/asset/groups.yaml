    Web 单页前端通过 API 网关*与 https 服务进行通信。


    正如图 4.1 所示，我们这种作为单个制品部署的具有模块化架构的 RadioA 应用就是我们所谓的“模块化单体”（Modular Monolith）。“模块化单体”这一术语由
    SimonBrown¹推广，他是我们在第 2 章中描述的 C4 模型作者。该术语主要用于将具有良好架构（模块化）的应用程序与充满条条代码的单体应用区分开来。


    所有模块都部署在单个容器（在本例中为 Web 服务器）中，正如我们提到的，它们之间的通信是以进程内（in-process）的形式进行的。让我们继续研究分布式架构并对其进行比较。


    > *https://microservices.io/patterns/apigateway.html


    ## 分布式架构


    这可能是近年来最热门的话题之一，不仅是因为微服务和 NoSQL 数据库的兴起，因为每个组织的不同系统之间总是存在某种集成。我们消耗来自内部和外部系统的 API，这导致我们必须处理分布式系统的复杂性。在本节中，我们将开始解释在分布式系统中遇到的困难，最后通过通过结构化实现
    RadioA 来解释微服务架构。


    ## 分布式的理由


    在分布式架构中，系统被划分为多个较小的应用程序，每个应用程序都部署在自己的容器中，运行在自己的进程中，并通过网络发送消息的方式进行相互通信，如图 4.2 所示。


    ![](img/9a234376112e1c13148524462ae6a2fd_90_0.png)


    图 4.2：分布式架构 - 通信


    正如你在图 4.1 中注意到的，在浏览器或移动应用与后端应用程序（服务器端）之间，我们已经通过网络在分布式应用程序之间进行了通信。但现在更深了，我们拆分并分布了后端（由
    API RadioA 框表示），这让一切变得更加复杂。


    那么，如果它让一切变得更加复杂，我们为什么要对系统分布式呢？


    正如我们所提到的，架构中的一切都是权衡。虽然分布式系统在方面增加了复杂性，但另一方面它会给我们带来收益。在这种情况下，通过分布，我们提升了**性能、可扩展性和可用性**。并不总是可以通过升级服务器硬件来提高**性能**，而且在某些情况下，升级成本是难以负担的。通过分布式系统，性能可以得到提高，因为负载分布在了两个或多个廉价服务器上。如果我们构建的系统成功了，客户端数量将会增长，迫使我们处理更多的请求和数据量。通过将负载和数据量分布在不同的计算机上，允许我们扩展到单体架构中无法实现的水平。提高我们系统**可用性**的唯一方法是将其复制到多台计算机上，这样如果其中一个故障，另一个就可以替换它。为了做到这一点，我们需要对系统进行分布。我们将在接下来的章节中涵盖这些质量属性。


    上述优势伴随着一系列我们在单体架构中不会发现的困难和局限性。理解它们是什么对于做出正确的决策来处理它们至关重要。


    ## 部分故障


    当应用程序运行在单机上时，它的行为是可预测的。如果运行它的硬件正常，应用程序就能工作；如果硬件由于任何原因故障，整个应用程序将停止工作。也就是说，单机上的应用程序要么工作，要么不工作，其之间没有其他状态（排除应用程序本身可能存在的
    bug）。


    当我们设计一个应用程序运行在多台机器上并通过网络通信时，情况就完全不同。分布式应用程序由多个可能故障的元素组成。网络及其所有复杂性、运行应用程序的机器都是系统的一部分。分布式系统中的任何这些元素（计算机、路由器、交换机等网络设备）都可能故障，而系统的其他元素可能仍在运行。这被称为**部分故障**（partial
    failures）⁴⁵。


    问题在于，这些部分故障可能会以不可预测的方式发生在系统的任何元素中，并在每种情况下表现不同。部分故障是我们在分布式架构中面临的主要困难。当然，这些故障可能非常罕见。如果确实发生了，我们将能够处理它们，在设计应用程序时考虑到这一点。


    通常，初学者分布式系统实现的人会忽略这些困难。正因如此，20世纪90年代工作在 Sun Microsystems 的一个团队发布了一组缺乏经验的开发者在实现分布式系统时会犯的错误。这些被称为分布式计算的**谬误***fallacies），有助于更好地理解由部分故障引起的困难。


    谬误列举如下：


    - 1. 网络是可靠的。

    - 2. 延迟为零。


    > *⁴⁵https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing


    - 3. 带宽是无限的。

    - 4. 网络是安全的。

    - 5. 拓扑结构不变。

    - 6. 有一个管理员。

    - 7. 传输成本为零。

    - 8. 网络是同质的。


    从这些谬误中，我们更感兴趣的是为什么网络不可靠。网络不保证数据包将到达目的地，甚至不能保证它实际上到达。《数据密集型应用》书中清楚地描述了当 A 通过网络向
    B 发消息时可能发生的情况：


    - 1. 请求可能丢失（也许有人拔掉了网线）。

    - 2. 请求可能在队列中等待并稍后交付（也许接收端过载了）。

    - 3. 远程节点可能故障（也许它崩溃或关机了）。

    - 4. 远程节点可能临时停止响应（也许它正在进行垃圾回收），但它将再次开始响应。见 4.4。

    - 5. 远程节点可能处理了你的请求，但响应在网络中丢失了（也许网络交换机配置错误）。见 4.3。

    - 6. 远程节点可能处理了你的请求，但响应被延迟并稍后交付（也许网络或你自己的机器过载了）。


    处理此问题的常用方法是使用超时。也就是说，在一段时间后，假设未收到响应。然而，这并不能远程机器是否收到了消息。在图 4.3 中，应用程序 A 向 B 发消息，B
    接收并处理了它。但响应在网络中丢失了，没有到达 A。一段时间后（根据配置的超时），A 终止了通信。图 4.4 中发生了类似的情况，消息到达了 B，但由于某些原因处理它花费很长时间，超过了
    A 配置的超时。


    在前一种情况下，A 终止通信并视为失败，忽略了最终传来的答案。在两种情况下，A 都会以错误终止，无法区分是网络中的响应丢失（图 4.3）还是处理延迟（图 4.4）。


