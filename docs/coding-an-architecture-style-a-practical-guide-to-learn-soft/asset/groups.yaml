    # Software Architecture Fundamentals


    to be installed. The C4 model has deployment diagrams that are proposed as alternative
    diagrams, and is based on the UML deployment notation.


    To further simplify the different structures that we will use in the book, we
    can say that we have:


    +   - Structures that map to abstractions written in source code (Modules/Layers).

    - Structures that map to software elements at runtime (Containers).

    - Structures that map to physical hardware (or virtual machines) (Deployment).


    In three chapters and we will focus primarily on understanding and implementing
    structures that belong to modules/layers and container abstractions. In the chapter
    five and six we will delve into availability and scalability presenting examples
    with the deployment structure.


    # Software Architecture Styles


    > “Just as good programmers recognized useful data structures in the late 1960s,
    good software system designers now recognize useful system organizations”¹¹⁸.


    There is an ever-expanding set of software architecture. By style we mean ways
    of organizing or structuring a software system. As examples of architecture styles
    we can mention: Layered, Hexagonal, Service Oriented, Event driven, Microservices,
    among others. It is not the intention of this book to list and describe every
    existing style of architecture, but to implement some ones.


    # Design vs Architecture


    What do different authors say about the difference between design and architecture?

    Grady Booch said: “All architecture is design but not all design is architecture.
    Architecture represents the significant design decisions that shape the system,
    which significant is measured by the cost of change”. Several authors call this
    phrase in different books about software architecture¹⁹ ²⁰¹.


    Based on Booch''s definition, Simon Brown in his book²² the following items as
    significant decisions with high cost to change:


    +   **The Shape of the system**: Web, client - server, monolith, distributed,
    etc.

    **The structure of the software system**: Modular, layers, etc.

    **The choice of technology**: Programming language, deployment platform, etc.

    **The choice of frameworks**: MVC framework, ORM Framework, etc.'
  - '[PAGE 21]


    On the other hand, the book Just Enough Software Architecture23, George Fairbanks
    suggests that who come closest to achieving a clear differentiation between architecture
    and design are Mary Shawn and David Garlan (whom we have cited earlier in this
    book) with the following definition:


    As the size and complexity of software systems increase, the design and specification
    of overall software system become more significant than the issue of algorithms
    and data structures of computation. Structural issues include the organization
    of a system as a composition of components; global control structures; the protocols
    for communication, synchronization and data access; the assignment of functionality
    to design elements; the composition of design elements; physical distribution;
    scaling and performance; dimensions of evaluation; and selection among design
    alternatives. This is the software architecture level of design.


    Finally, in the books Clean Architecture24 and Fundamentals of Software Architecture25
    it is pointed out that architecture corresponds to high-level decisions that are
    at a distance from lowerlevel design decisions: the software we are building.
    In fact both should be understood as complementary parts of the same team: the
    separation, they say, the development team and the architecture team not to work
    together, and communicate only once at the beginning of the project. So they suggest
    it is not possible to speak about design architecture, but both must be built
    in hand.


    I cannot agree with that statement, the simple idea that architects lock themselves
    in meetings with the business and neglect their technical skills and their frequent
    communication with development teams is a terrible decision26.


    All of these explanations ground out, but there is still missing something to
    really see the difference. I''m particularly interested to visualize that line
    that differentiates design from architecture, from the technical point of view.
    In my proposal27,28, if we are talking about software elements and their relationships,
    where these elements map to syntactical constructions in the programming language
    we are using, then we are talking about design. And every decision is a design
    decision. Whereas any composed of software elements at a higher level of abstraction
    source code, is architecture. And every decision in that area is an architectural
    decision. In this way, general, the structures of modules or layers, and the communication
    between them in the form of inprocess require design decisions. The container
    and deployment structures and their communication in the form of inter-process
    require architectural decisions. This proposal establishes a clear line between
    design and architecture.


