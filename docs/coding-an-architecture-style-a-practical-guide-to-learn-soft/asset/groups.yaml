    As you can see, the RadioCompetition class has all the application code (github/radioa-no-structure*),
    mixing concerns of UI, business logic and data access in the same class. If this
    app were always this size, this wouldn''t be so bad. But with some success on
    the radio show, the app will grow.


    As a learning exercise we are going to structuring this application in layers.
    The layers and their relationships that we implement are illustrated in figure
    3.5.


