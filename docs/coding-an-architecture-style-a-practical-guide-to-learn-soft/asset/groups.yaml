    # 5. Availability


    ## Introduction


    You have probably heard that a certain system has High Availability or its availability
    is five 9s (99.999%). But what does this mean? What is availability? Can it be
    calculated? Let''s start by answering these questions.


    If a system upon receiving a request according to what was specified and implemented,
    then it is available. Since the causes that could occur to prevent a system from
    being available are not possible to know in advance, the availability of a system
    is defined as the probability that the system is in operation at a given time.
    From this it follows the reason for the notation of the nines to specify the availability
    of a system. If I say that a system has 99.9% availability, what I am really saying
    is that in a year it will be 8.76 hours unavailable. How do I get to that result?
    99.9 / 100 = 0.999. Multiplying 365 * 0.999 = 364,635, I get the number of days
    in the year that the system will be available. In other words, it will not be
    365 - 364,635 = 0.365 days in the year. If we do 0.365 * 24 we get 8.76 hours
    a year not available. Performing these calculations, according to the number of
    nines, we are able to know the total unavailable time of a system, as shown in
    the following table:


    | Availability | 9s | Downtime |

    | :--- | :--- | :--- |

    | 90% | one | 36.5 days/year |

    | 99% | two | 3.65 days/year |

    | 99.9% | three | 8.76 hours/year |

    | 99.99% | four | 52 minutes/year |

    | 99.999% | five | 5 minutes/year |

    | 99.9999% | six | 31 seconds/year |


    High availability has those systems that have an availability of five nines or
    more. Now it remains for us to understand how we calculate the availability of
    an element of the system to later able to calculate the availability of the whole
    system.


    ## Calculating the Availability


    The availability of an element of a system is calculated using its average time
    between two failures (MTBF) and its average time to repair it after a failure
    (MTTR), using the following formula: availability = MTBF / (MTBF+MTTR)


    From this formula we can see that the higher the MTBF, the more availability we
    will have. In same way, the faster we can get out of a failure, the better availability
    we will have. MTBF and MTTR are represented in hours.


    How do I know what the MTBF is for an element in a system?


    For **hardware elements** the MTBF can be obtained from the manufacturer and the
    MTTR from our support and infrastructure team or from the provider whom we have
    contracted the service. Hardware failures usually require the component to be
    replaced. There are several factors that go into understanding the MTTR in hardware.
    Replacing a damaged network card or other network element is not the same as replacing
    a damaged disk. In the latter case, it will depend, for example, on whether we
    have data replicas ready to be used or we have to restore a backup. In addition,
    the moment in which it happens also influences, if it is within normal working
    hours or if it is on a weekend. It will depend on how we are organized for such
    events. To give an example, the MTTR value in KLM$^{60}$ is 4 hours.


    Hardware failures are usually described by the bathtub curve. That is, at the
    beginning of the life of a hardware element the chances of failure are usually
    high, then during the normal life cycle the probability of failure is very low,
    and at the end of its useful life the probability of failure is high due to degradation
    of their characteristics. As illustrated in figure 5.1.


    ![](img/9a234376112e1c13148524462ae6a2fd_123_0.png)


    Figure 5.1: Bath Tub


    The MTBF calculation for software elements has multiple factors. Like its complexity,
    size (KLOC), experience of the development teams and time spent on testing, to
    mention only the most important ones. To perform this calculation, it is necessary
    to observe the behavior of the application during a given period of time, measuring
    its failures. Which is not easy especially in applications with some success since
    it has a high frequency of changes. The MTTR is generally the time it takes to
    restart the application, which is generally low. Cisco⁷7$, for example, assumes
    10,000 hours of MTBF for products with recent changes or new functionality, and
    30,000 hours of MTBF for stable products. And in both cases it assumes an MTTR
    of 0.1 hours (6 minutes to restart).


    Being able to obtain the availability of each element of a system, we can calculate
    its total availability. Suppose the deployment diagram in figure 5.2.


    ![](img/9a234376112e1c13148524462ae6a2fd_124_0.png)


