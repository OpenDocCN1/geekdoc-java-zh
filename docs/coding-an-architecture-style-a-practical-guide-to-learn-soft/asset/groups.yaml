    # Software Architecture: Fundamentals


    the responsibility for a certain module, layer or subsystem. This view is equivalent
    to the one presented in the figure 2.3.


    The **physical** view refers mainly to showing how the software elements are assigned
    to hardware elements.


    Finally the fifth view, **Scenarios** is dedicated to show how specific use cases
    are executed by the different software elements.


    # Structures and Views (SEI)


    In one of the Software Architecture "bibles", the book Software Architecture in
    Practice¹⁸, from the Software Engineering Institute (SEI), the authors define
    view, differentiating it from **structure**, in the following way:


    A view is a representation of a structure.


    According to them, architectural structures are divided into three major categories:


    - **Module Structure**: Refers to how the functionality of a system is divided
    into abstractions (modules, packages, layers, classes, etc.). To design structures
    of this type, we must first understand what syntactical constructions exist in
    the programming language that we are using to represent this kind of structure.
    In small systems the classes and their relationships could be the software elements
    to represent this structure, but in larger systems we need software elements of
    a higher level of abstraction than a class, function or procedure. For example
    in PHP the namespaces, in Java we group classes using some criteria (we will talk
    about this later) and expose interfaces in order to hide implementation details.
    This type of structure can be documented using the logical and development view
    of the Kruchten model.


    - **Components and connectors**: components are the software elements at runtime
    and connectors are ways to connect, how they communicate. Examples of components
    could be services, data repositories, applications, anything that can be started
    and stopped. Examples of connectors are sockets, https (REST), shared databases,
    etc. A component can map one to a single module, or it can map to multiple modules
    from the previous category. To be clear, let''s distinguish between the two terms:
    components are software elements at runtime, deployed in a process separated from
    each other whose communication is in the form of inter-process communication (IPC).
    While modules are software elements that communicate via their interfaces within
    all the same process communicating in the form of in-process communication. This
    type of structure can be represented using the process view of Kruchten model.


    - **Allocation structures**: Refers to decisions of how software elements will
    relate to hardware elements and also deployment. For example, on physical or virtual
    machine each component runs, or which development team is responsible for each
    component. It is also important to represent the environment we are talking about.
    For which directory does the system store files in the testing environment and
    the production environment. This type of structure can be documented using Kruchten''s
    physical view to represent components assigned to hardware, and Kruchten''s development
    view to represent components assigned to development teams.


    # UML Diagrams


    UML provides different diagrams to visualize the architecture of a software system.
    Each diagram offers its notation, not covered in this book, but can be found in
    Martin Fowler''s UML Distilled book¹⁵.


    Related to the different structures we were studying, for the module structures
    we have the diagram of classes and the diagram of packages of UML. The packages,
    as mentioned above, correspond to namespaces that we find in languages such as
    PHP or .NET. The UML also proposes the component diagram to represent components
    and connectors structures. In addition, in initial versions of UML t components
    were the elements to be deployed on hardware. Later it was modified incorporating
    the elements that they call artifacts (example WAR, JARs, DLLs, PHARs, etc) which
    are the ones that are finally deployed (allocated) to hardware. Finally, UML offers
    the deployment diagram that can be used for allocation structures.


    # C4 Model


    Simon Brown created the C4* to visualize software architectures. Its name is given
    by the acronym of the different abstractions of the structures that it allows
    to diagram: Context, Container, Component and Code. Of course, it has many similarities
    with the other proposals, however, it is presented with examples on traditional
    information systems unlike the SEI bibliography that is exemplified based on its
    experience in military systems (motor control, embedded systems and real time)¹⁶,
    which makes it more complex to understand for those who do not know this domain
    and its characteristics.


    On the other hand, unlike the other proposals, C4 is presented in levels of abstraction.
    Starting at the highest level, we find the software system, represented by the
    Context diagram and where each subsequent level of abstraction corresponds to
    one step further in the previous level.


    In the order of abstraction, from the most abstract to the most concrete one,
    the four types are described:


    - **Context**: This diagram represents the software system and the relationships
    with external systems. External systems are those for which we are not responsible
    for their maintenance. We also include in this diagram the different types of
    users who use the software system.


    - **Containers**: By doing "zoom +" in the box that represents the software system,
    we find the containers. With it refers to applications (web, mobile, single-page,
    shell scripts, etc.) and data repositories, schemas and databases. It is essentially
    a software element that executes code or stores data. This structure has similarities
    with the components and connectors structure of the SEI proposal.


    > *https://c4model.com/


    - **Components**: By "zoom+" in any of the containers we get to the next level
    of abstraction, the components. This term designates a set of functionalities
    encapsulated and exposed through a well-defined interface. Here it is necessary
    to find in the programming language that we are using the syntactical construction,
    the abstraction, that we will use as a component. It can be classes, in small
    systems, or the packages, namespace or modules (Java+) in the case of more complex
    systems. On the other hand, there is a big difference in the terminology used
    that unfortunately confuses. Components in the C4 model is a software element
    that maps to a syntactic construction or abstraction defined in the source code,
    while for the SEI proposal and in general in all software architecture bibliography,
    the components represent software elements at runtime.


    - **Code**: Finally, doing "zoom+" on any of the components we would have its
    implementation modeled, for example, with a class diagram. The author advises
    not to diagram this level unless it is really necessary.


    Lets look at figure 2.5, where we illustrate the first three levels of abstraction
    of the C4 model.


    ![](img/9a234376112e1c13148524462ae6a2fd_18_0.png)


    Figure 2.5: C4 Model


    # Software Architecture Fundamentals


    In 2.5 we see three different diagrams belonging to the first three levels of
    abstraction of the C4 model. Three different views of the system. Starting at
    level 1, with the context diagram. You can see the "Web Bank System" and its dependencies
    with external systems, in this case mainframe. At level 2, we go in more detail
    on the "Web Bank System", we have the container diagram. There we see a Single-Page
    application running in browser, which consumes services from API Application (SpringMVC)
    whose execution environment is Tomcat. The latter consumes services from the external
    system (mainframe) and accesses PostgreSQL database. The third and last level
    shows the component diagram of the API Application. Note that "zoom +" is performed
    on particular container. The box that represents Security is a package or namespace,
    whose public interface is consumed by the Signup Controller. In the Clean Architecture
    written by Simon Brown he explains his proposal about splitting classes by component.


    Finally, there are several interesting tools that we use to generate the diagrams
    from C4 model. We mention some of these tools: Archimate, C4Builder, Structurizr,
    and PlantUML.


    # Conclusion


    There are different proposals with notations to structure and visualize software
    architectures. However, it is possible to find a common criteria among them, which
    are what we will use in this book. The objective of this book is regardless of
    the terminology used, we can recognise the different structures to define the
    architecture of a system and how to represent it using diagrams.


    The structures that we will use in this book are:


    **Modules/Layers**: We refer to software elements that map to one with defined
    abstractions syntactic constructions such as classes, packages, namespaces or
    modules in the programming language we are using.


    It is very important to understand that these diagrams must reflect the reality
    of the system. This tends to deviate when there is an application built without
    architecture rules, which without exception leads to spaghetti code. When we show
    to the structures "architecture" of the system, we draw boxes showing a structure
    that doesn''t map to our reality in source code.


    **Containers**: Applications or data stores at runtime, defined by the C4 model
    (not to be confused with Docker). Typically, containers run within an environment
    (web server, virtual machine, etc.) in their own process and communication with
    other containers is in the form of inter-process communication (IPC). While typically
    the communication between modules or layers is in the form of in-process communication.


    **Deployment**: Here we identify the physical, virtual and container machines
    (now, Docker), where the software elements (which we have identified in the previous
    architecture level) are going.

