    ## Monolithic and Distributed Architecture


    ![](img/9a234376112e1c13148524462ae6a2fd_94_0.png)


    Figure 4.4: Too much time processing


    In the scenarios illustrated in figure 4.3 and 4.4 the application A will try
    to send the message again, due to the reception was not confirmed. This situation
    is described as **exactly-once semantics**. Here it is important to understand
    what effects produce on the system that a message might be sent more than once.
    Perhaps the message is simple to send an email and if it is sent twice with the
    same content is not important. Or perhaps the message is to make a debit from
    a bank account with which we need to be sure that it will not happen more than
    once.


    Understanding the consequences of **partial failures** allows us to design applications
    knowing that the same message might sent more than once. One way to deal with
    this is to make services **idempotent**, if they are executed more than once with
    the same inputs, they do not produce any other effect than the one produced the
    first time. The other way to handle it is as **deduplication**, where each message
    is a unique identifier. With each forwarding of the same message the same identifier,
    the receiver could check if the message was already received to discard it if
    that was the case.


    In a **synchronous** communication model, like the one illustrated in the previous
    figures, application A, after sending the message, waits for a response. It only
    continues the execution if it receives a response from application B or the configured
    timeout elapsed.


    If we wanted to prevent application A from waiting for a response from application
    B, we should perform the communication asynchronously. For example, the message
    might be persisted in a queue where then another process will take care of it
    and send it to application B. Here we also need to deal with timeouts and the
    problems caused by the possibility of sending the same message more than once,
    but the advantage is that application A could continue executing and attending
    other requests.


    ## Transactions


    In centralized systems, thanks to the transaction concept implemented by relational
    databases (and some NoSQL) we have the property atomicity guaranteed. In other
    words, if there are two operations to be carried out, both will executed or neither
    will do in the event that one of them fails. Databases that implement this free
    application developers from having to deal with this, which implies simpler software
    systems. In distributed systems, guaranteeing atomicity is somewhat complex. We
    call distributed transactions, when we involve two or more computers in operations
    that must be executed atomically. We could say that in distributed architectures
    we have two variants where we need to guarantee atomicity, one more complex than
    the other.


    The first occurs when we need certain information stored in a database to be replicated
    to other databases. Relational databases have built-in mechanisms to carry out
    this type of work (master/slave replication) or in case we are talking about databases
    with different data models because they belong to different applications, we could
    use publish/subscribe mechanisms to de replications. In general, data replication
    is done asynchronously, so as not to delay the end users while the information
    is copied. This produces what is called eventual consistency. That is, at some
    point the databases will be consistent.


    The second variant, and more complex, occurs when we need to update different
    information that resides in different databases atomically. For example, suppose
    a Web application that takes hotel rooms reservations. To confirm the reservation,
    first we must validate the customer''s credit card is valid, then generate the
    invoice and send it by email. These three actions occur in different applications
    and must be performed atomically. To achieve this is a technique called Sagas.
    Basically, the saga consists of a sequence of transactions T₁, T₂, ..., Tₙ, where
    each transaction T₁ is associated to a compensating transaction C₁ which is executed
    in case a rollback is required. Figure 4.5 illustrates this concept.


    ![](img/9a234376112e1c13148524462ae6a2fd_96_0.png)


    Figure 4.5: Sagas


    The 4.5 shows on each successful Tx, T transaction, a message is sent to the next
    application involved in the saga. If any of these transactions T, the compensating
    transactions are started in order to undo what was done up to the point of failure.
    In general, messages involved in the transactions (Tx, or Cx) are implemented
    asynchronously via a publish/subscribe mechanism.


    There are other mechanisms⁵⁶ to perform distributed transactions, however, sagas
    is the mechanism recommended for Microservices architectures.


    ## Distributed Monolith


    Before going to Microservices, it is important to understand the architecture
    style known as Distributed Monolith. This style suggests splitting an application
    in multiple simpler applications where each one runs in its own process, they
    communicate with each other in the form of inter-process (IPC) and synchronously.


    Suppose we take the RadioA application with modular architecture and we convert
    each of the modules into a simple Web application that exposes https services.
    That is, each service exposes and can be invoked by method calls we now expose
    them via https using Javelin\*. We also need the Notifications module to expose
