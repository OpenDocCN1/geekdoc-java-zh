    # 软件架构风格


    > “正如优秀的程序员在 20 世纪 60 年代识别出有用的数据结构一样，优秀的软件系统设计者现在识别出有用的系统组织”¹¹⁸。


    软件架构风格在不断扩展。我们所说的风格是指组织或结构化软件系统的方法。作为架构风格的示例，我们可以提到：分层、六角形、面向服务、事件驱动、微服务等。本书的意图并不是列举和描述每种现有的架构风格，而是实现其中一些。


    # 设计 vs 架构


    不同作者对设计与架构之间的区别是如何看待的？

    Grady Booch 说：“所有的架构都是设计，但并非所有的设计都是架构。架构代表了塑造系统的重大设计决策，其重要性通过更改成本来衡量。” 多位作者在关于软件架构的不同书中都提到了这句话¹⁹
    ²⁰¹。


    根据 Booch 的定义，Simon Brown 在他的书中²² 列出了以下项作为具有高更改成本的重大决策：


    - **系统的形状**：Web、客户端-服务器、单体、分布式式等。

    - **软件系统的结构**：模块化、分层等。

    - **技术栈的选择**：编程语言、部署平台等。

    - **框架的选择**：MVC 框架、ORM 框架等。


    另一方面，在《恰到好的软件架构》（Just Enough Software Architecture）²³ 中，George Fairbanks 认为最接近实现架构与设计之间清晰区分的是
    Mary Shawn 和 David Garlan（我们在书中之前已引用过他们），他们的定义如下：


    随着软件系统规模和复杂性的增加，整个软件系统的设计和规范变得比计算算法和数据结构问题更为重要。结构性问题包括系统作为组件组合的组织；全局控制结构；通信、同步和数据访问的协议；功能向设计元素的分配；设计元素的组合；物理分布；扩展和性能；评估维度；以及在设计备方案中进行选择。这就是软件架构层级的设计。


    最后，在《整洁架构》（Clean Architecture）²⁴ 和《软件架构基础》（Fundamentals of Software Architecture）²⁵
    中指出，架构对应于距离低级设计决策较的高级决策：即我们正在构建的软件。事实上，两者都应该被理解为同一个团队的互补部分：他们说，开发团队和架构团队不应该分离开工作，只在项目开始时进行一次通信。因此他们认为无法谈论“设计架构”，但两者必须携手构建。


    我不赞同那个观点，简单认为架构师们把自己关在与业务人员的会议中，忽视他们的技术技能以及与开发团队的频繁沟通，这是一个极其糟糕的决定²⁶。


    所有这些解释都有据可查，但仍然缺少某些东西来真正看到区别。我特别感兴趣的是从技术角度可视化那条区分设计与架构的界限。在我的建议²⁷²⁸ 中，如果我们讨论的是软件元素及其关系，而这些元素映射到我们正在使用的编程语言中的语法结构，那么我们讨论的就是设计。每一个决策都是设计决策。而任何由更高抽象层级（源代码）的软件元素构成的部分都是架构。该领域的每一个决策都是架构决策。通过这种方式，通常情况下，模块或层的结构以及它们之间以进程内形式进行的通信需要设计决策。容器结构、部署结构以及它们以进程间形式进行的通信则需要架构决策。这一建议在设计和架构之间建立了一条清晰的界限。


