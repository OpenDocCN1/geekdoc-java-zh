    # 结构与视图 (SEI)


    在软件架构的“圣经”之一——由软件工程研究所（SEI）编写的《软件架构实践》（Software Architecture in Practice）中，作者定义了“视图”（view），并按照以下方式将其与**结构**（structure）区分来：


    视图是结构的表示。


    根据他们的观点，架构结构分为三大类：


    -   **模块结构**（Module Structure）：指的是系统功能如何划分为抽象（模块、包、层、类等）。要设计这种类型的结构，我们必须首先理解我们正在使用的用于表示这种结构的编程语言中存在哪些语法构造。在小型系统中，类及其关系可以作为表示这种结构的软件元素，但在较大的系统中，我们需要比类、函数或过程更高抽象层次的软件元素。例如，在
    PHP 中是命名空间，在 Java 中我们通过某些标准对类进行分组（我们稍后会讨论）并暴露接口以隐藏实现细节。这种结构可以使用 Kruchten 模型的逻辑视图和开发视图进行记录。


    -   **组件与连接器**（Components and connectors）：组件是运行时的软件元素，连接器是连接它们以及通信的方式。组件的示例可以是服务、数据存储、应用程序、任何可以启动和停止的实体。连接器的示例是
    sockets、https (REST)、共享数据库等。一个组件可以映射到单个模块，也可以映射到前一类中的多个模块。为了清晰起见，让我们区分这两个术语：组件是运行时的软件元素，部署在相互独立的进程中，其通信形式为进程间通信（IPC）。而模块是在同一个进程内通过其接口通信的软件元素，其通信形式为进程内通信（in-process
    communication）。这种结构可以使用 Kruchten 模型的过程视图来表示。


    -   **分配结构**（Allocation structures）：指的是软件元素如何与硬件元素关联以及部署的决策。例如，每个组件运行在哪个物理机或虚拟机上，或者由哪个开发团队负责每个组件。表示我们所论述的环境也很重要。系统在测试环境和生产环境中将文件存储在哪个目录。这种结构可以使用
    Kruchten 的物理视图来表示分配给硬件的组件，使用 Kruchten 的开发视图来表示分配给开发团队的组件。


    # UML 图


    UML 提供了不同的图表来实现软件系统架构的可视化。每种图表都有其符号法（本书未涵盖，可以在 Martin Fowler 的《UML 简明》（UML Distilled）一书中找到）。


    与我们学习的不同结构相关，对于模块结构，我们有 UML 的类图（class diagram）和包图（package diagram）。如上述，包对应于 PHP
    或 .NET 等语言中的命名空间。UML 还提出了组件图（component diagram）来表示组件和连接器结构。此外，在 UML 的早期版本中，组件是要部署在硬件上的元素。后来它进行了修改，引入了他们称为“构制品”（artifacts）的元素（例如
    WAR、JARs、DLLs、PHAR 等），这些才是最终部署（分配）到硬件上的元素。最后，UML 提供了部署图（deployment diagram），可以用于分配结构。


    # C4 模型


    Simon Brown 创建了 C4 模型来实现软件架构的可视化。它的名称源于其允许绘制的结构不同抽象的缩写：上下文（Context）、容器（Container）、组件（Component）和代码（Code）。当然，它与其他方案有许多相似之处，但它是通过传统信息系统的示例呈现的，不像
    SEI 的文献是基于其在军事系统（电机控制、嵌入式系统和实时系统）方面的经验进行说明，这使得对于不了解该领域及其特性的人来说，理解起来更加复杂。


    另一方面，与其他方案不同，C4 是按抽象层级呈现的。从最高层开始，我们找到软件系统，由上下文图（Context diagram）表示，随后的每个抽象层级对应于前一个层级的进一步一步。


    按照抽象顺序，从最抽象到最具体，四种类型描述如下：


    -   **上下文**（Context）：此图表示软件系统以及与外部系统的关系。外部系统是指我们不负责维护的系统。我们还在此图中包含了使用软件系统的不同类型用户。


    -   **容器**（Containers）：通过对代表软件系统的框进行“放大+”，我们找到了容器。在这里它指的是应用程序（Web、移动端、单页、shell
    脚本等）以及数据存储、模式和数据库。它本质上是一个执行代码或存储数据的软件元素。这种结构与 SEI 方案中的组件与连接器结构有相似之处。


    > *https://c4model.com/*


    -   **组件**（Components）：通过对任何容器进行“放大+”，我们达到了下一个抽象层级——组件。这个术语指代被封装并通过定义接口暴露的一组功能。在我们正在使用的编程语言中，它们是类、包或命名空间。在
    C4 模型中，我们看到它们在表示架构中的表示。在 SEI 方案中，由于使用的术语不同，可能会产生混淆，组件是运行时的软件元素。


    -   **代码**（Code）：最后，对任何组件进行“放大+”，我们得到了实现，使用类图（class diagram）。作者建议除非非常有必要，否则不要对这种层级进行制图。


    # 软件架构基础


    在 2.5 中，我们看到了属于 C4 模型的三个抽象层级。


    ![](img/9a234376112e131485246_18_0.png)


    图 2.5：C4 模型


    # 软件架构基础


    在 2.5 中，我们看到了属于 C4 模型的三个抽象层级。这是系统的不同视图。从第 1 层开始，是上下文图（context diagram）。你可以看到“软件系统”以及与外部系统的依赖，在此例中是主机机。在第
    2 层，我们更详细地查看“软件系统”，我们有容器图（container diagram）。我们看到运行在浏览器中的单页应用程序，它调用 API 应用程序（SpringMVC）的服务，其运行环境是
    Tomcat。后者调用外部系统（主机机）的服务并访问 PostgreSQL 数据库。第 3 层也是最后的一层，显示了 API 应用程序的组件图（component
    diagram）。注意，是对特定的容器（container）进行了“放大+”。代表安全（Security）的框是一个包或命名空间，其公共接口被注册控制器（Signup
    Controller）调用。在 Simon Brown 编写的《整洁架构》中，他解释了关于划分类的建议。


    最后，有一些有趣的工具用于从 C4 模型生成图表。我们提到了其中一些工具：Archimate、C4Builder、Structurizr 和 PlantML。


