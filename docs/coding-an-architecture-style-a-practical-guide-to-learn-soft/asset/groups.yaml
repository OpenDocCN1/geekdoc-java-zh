- md: "\n# Hexagonal Architecture\n\n## Definitions and Style\n\nIn 2005 Alistair\
    \ Cockburn published the architecture style called Hexagonal Architecture*, also\
    \ known as Ports and Adapters. The intention of this style as defined by its author\
    \ says:\n\n\"Allow an application to equally driven by users, programs, automated\
    \ test or batch scripts, and be developed and tested in isolation from its eventual\
    \ run-time devices and databases\".\n\nIt is important to note that this style\
    \ has special emphasis on the rule of separating the application (business logic)\
    \ from any external element as user interfaces, scripts, email services, external\
    \ applications, messaging systems, databases, etc.\n\nTo achieve this separation\
    \ (coupling) the application communicates only through interfaces - called ports\
    \ with external infrastructure elements. We have two flavors of ports, those who\
    \ drive the application (primary ports) and those who the application drives (secondary\
    \ ports). So, we have external elements as scripts, user interfaces, automated\
    \ tests, etc., who drive the application, on the other hand, the application communicating\
    \ via the ports with external elements such as databases, external systems, etc.\
    \ by invoking secondary ports. In both cases, for each external element there\
    \ will be one or more adapters that will be responsible for the mapping between\
    \ the outside world and the application (inside) world.\n\nFigure 3.7 shows the\
    \ typical diagram of the hexagonal architecture:\n\n> *https://alistair.cockburn.us/hexagonal-architecture/\n\
    \n## Modules, Layers and their Architecture Styles\n\n![](img/9a234376112e1c13148524462ae6a2fd_56_0.png)\n\
    \nFigure 3.7: Hexagonal Architecture\n\nAs can be, within the hexagon are the\
    \ classes that implement the business logic, which in this style is just called\
    \ *application*. The port interfaces inside the hexagon, called *ports*, are the\
    \ input connection to the application (primary ports) and the output connection\
    \ to external elements (secondary ports). For inputs, the application exposes\
    \ a set of APIs via connection interfaces (ports) that are consumed from the outside.\
    \ For output, the application exposes SPI (Service Provider Interface) interfaces\
    \ (ports), and the outside who drives the application, and the external elements\
    \ implement them by the service invoked (driven) by the application.\n\nThe adapters\
    \ belong to the outside of the application and are coupled to technical aspects\
    \ (frameworks, drivers, external services, etc.). We could have several different\
    \ adapters for the same port.\n\nThis architecture style forces us to put our\
    \ efforts on functional requirements from the very beginning. Go further implementing\
    \ business logic, to later decide which frameworks and external services to use.\
    \ It also allows us to fully test the application with unit tests, without mocking\
    \ frameworks, simple classes in our tests will implement the ports to allow us\
    \ to exercise the different cases.\n\nIn 2012 Robert C. Martin published a blog\
    \ post that made the term Clean Architecture known*, promoting these architectural\
    \ styles that prioritize applications free of frameworks, database drivers, UI\
    \ technologies and that allow to be tested isolated from any technical aspect.\n\
    \n## Implementation\n\nIf we look at the layered structure that we defined for\
    \ the \"RadioA\" application (figures 3.5 or 3.6), in the previous section, we\
    \ can see that the business logic, which is located in the radio.model package,\n\
    \n> *https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html\n\
    \nneeds the persistence layer, its interfaces from the radio.persistence.api package\
    \ in order to work (even compiled if we are using a compiled language). Similarly,\
    \ it is not possible to test the business layer without including the interfaces\
    \ from the persistence layer.\n\nTherefore, if we want to refactor RadioA's layered\
    \ architecture and turn it into a hexagonal architecture we must invert the dependency\
    \ that exists between radio.model and radio.persistence. Instead of having the\
    \ radio.model package depending on the radio.persistence package, we should make\
    \ the radio.persistence package depend on the radio.model package. To do that,\
    \ we make the following changes:\n\n- 1. We create the package radio.model.ports\
    \ and move there the interfaces of the packages radio.model.api and radio.persistence.api.\
    \ Then we remove these .api packages.\n- 2. We remove the interface radio.persistence.Competition,\
    \ since we will use model.ports.RadioCompetition.\n- 3. We rename the packages\
    \ radio.ui and radio.persistence to radio.adapters.ui and radio.adapters.persistence.\n\
    - 4. We modify the class radio.persistence.JdbcbeCompetitionRepository to return\
    \ an instance of radio.model.ports.RadioCompetition.\n\nWith these changes, we\
    \ transform the layered architecture illustrated in figure 3.6 into an hexagonal\
    \ architecture shown in figure 3.8:\n\n![](img/9a234376112e1c13148524462ae6a2fd_58_0.png)\n\
    \nFigure 3.8: RadioA, Hexagonal Architecture\n\nNote that the direction of the\
    \ dependencies goes from outside the hexagon towards the **radio.model.ports**\
    \ package inside the hexagon.\n\nLet then write a test to validate the rules by\
    \ the hexagonal architecture:\n\n### Testing the Hexagonal Architecture\n\n```\n\
    public class TestArchitecture {\n    private static final String ROOT_PACKAGE\
    \ = \"radio\";\n    private static final String PKG_MODEL = \"radio.model\";\n\
    \    private static final String PKG_PORTS = \"radio.model.ports\";\n    private\
    \ static final String PKG_ADAPTER = \"radio.adapter..\";\n\n    @Test\n    public\
    \ void testLayers() {\n        layeredArchitecture()\n            .layer(\"Adapter\"\
    ).definedBy(PKG_ADAPTER)\n            .layer(\"Ports\").definedBy(PKG_PORTS)\n\
    \            13 .layer(\"BusinessLogic\").definedBy(PKG_MODEL)\n            14\
    \ .whereLayer(\"Adapter\").mayNotAccessedByAnyLayer()\n            15 .whereLayer(\"\
    BusinessLogic\").onlyBeAccessedByLayers(\"Ports\")\n            16 .check(new\
    \ ClassImporter().importPackages(ROOT_PACKAGE));\n        17 }\n```\n\n```\n19\
    \ @Test\n20 public void modelShouldOnlyDependOnPortsOrJdk()\n21 JavaClasses jc\
    \ = new ClassImporter().importPackages(ROOT_PACKAGE)\n23 ArchRule r1 = classes().that().resideInPackage(PKG_MODEL).should(\n\
    24 .onlyDependOnClassesThat()\n25 .resideInPackage(PKG_MODEL, PKG_PORTS, \"java.\"\
    );\n26 r1.check(jc);\n27 }\n```\n\n```\n29 @Test\n30 public void portsShouldOnlyDependOnPortsOrJdk()\n\
    31 JavaClasses jc = new ClassImporter().importPackages(ROOT_PACKAGE)\n33 ArchRule\
    \ r1 = classes().that().resideInPackage(PKG_PORTS).should(\n34 .onlyDependOnClassesThat()\n\
    35 .resideInPackage(PKG_PORTS, \"java.\");\n36 r1.check(jc);\n37 }\n```\n\n```\n\
    39 @Test\n40 public void adaptersShouldOnlyDependOnPorts()\n41 JavaClasses jc\
    \ = new ClassImporter().importPackages(ROOT_PACKAGE)\n43 ArchRule r1 = classes().that().resideInPackage(PKG_ADAPTER).should(\n\
    44 .onlyDependOnClassesThat()\n45 .resideInPackage(PKG_ADAPTER, PKG_PORTS, \"\
    java.\", \"javax.\");\n46 r1.check(jc);\n47 }\n```\n\n```\n49 @Test\n50 public\
    \ void adaptersShouldNotDependOnEachOther()\n51 JavaClasses jc = new ClassImporter().importPackages(ROOT_PACKAGE)\n\
    53 SliceRule rule = SlicesRuleDefinition.slices\n54 .matching(PKG_ADAPTER + \"\
    +**\")\n55 .should().notDependOnEachOther();\n56 rule.check(jc);\n57 }\n```\n\n\
    As an example, I will also add an Ant script to verify (again) the architecture\
    \ rules. The Ant script compiles and generates the artifacts verifying the rules\
    \ imposed by the hexagonal architecture.\n\n### Verifying the Hexagonal Architecture\
    \ Rules with Ant\n\n```\n<!-- compiling application only -->\n<target name=\"\
    compile-ports\">\n  <mkdir dir=\"physical-build/ports\" />\n  <javac sourcepath=\"\
    \" srcdir=\"src/main/java\"\n    destdir=\"physical-build/ports\"\n    excludes=\"\
    radio/model/*.java\"\n    includes=\"radio/model/*.java\">\n</target>\n\n<target\
    \ name=\"jar-ports\" depends=\"compile-ports\">\n  <mkdir dir=\"physical-build/jar-ports\"\
    />\n  <jar destfile=\"physical-build/jar-ports/ports.jar\"\n    basedir=\"physical-build/ports\"\
    >\n</target>\n\n<target name=\"compile-application\" depends=\"jar-ports\">\n\
    \  <mkdir dir=\"physical-build/classes-application\" />\n  <javac sourcepath=\"\
    \" srcdir=\"src/main/java\"\n    classpath=\"physical-build/jar-ports/ports.jar\"\
    \n    destdir=\"physical-build/classes-application\"\n    excludes=\"radio/model/*.java\"\
    \ includes=\"radio/model/*.java\">\n</target>\n\n<target name=\"jar-application\"\
    \ depends=\"compile-application\">\n  <mkdir dir=\"physical-build/jar-application\"\
    />\n  <jar destfile=\"physical-build/jar-application/application.jar\"\n    basedir=\"\
    physical-build/classes-application\">\n</target>\n```\n"
  mdcn: "\n\n# 六边形架构\n\n## 定义与风格\n\n2005年，Alistair Cockburn 发表了一种名为*六边形架构*（Hexagonal\
    \ Architecture）的架构风格，也称为“端口与适配器”（Ports and Adapters）。其作者对该风格的定义如下：\n\n“允许应用程序能够被用户、程序、自动化测试或批量脚本驱动，并能够与其最终的运行时设备和数据库隔离进行开发和测试”。\n\
    \n需要注意的是，这种风格特别强调了将应用程序（业务逻辑）与任何外部元素（如用户界面、脚本、电子邮件服务、外部应用程序、消息系统、数据库等）分离的规则。\n\
    \n为了实现这种分离（解耦），应用程序仅通过接口（称为“端口”）与外部基础设施元素进行通信。我们有两种类型的端口：驱动应用程序的端口（主端口，primary\
    \ ports）和应用程序驱动的端口（次要端口，secondary ports）。因此，我们有脚本、用户界面、自动化测试等外部元素来驱动应用程序；另一方面，应用程序通过调用次要端口与数据库、外部系统等外部元素通信。在这两种情况下，对于每个外部元素，将有一个或多个适配器负责外部世界与应用程序（内部）世界之间的映射。\n\
    \n图 3.7 显示了六边形架构的典型图：\n\n> *https://alistair.cockburn.us/hexagonal-architecture/*\n\
    \n## 模块、层及其架构风格\n\n![](img/9a234376112e1c13148524462ae6a2fd_56_0.png)\n\n图 3.7：六边形架构\n\
    \n如所示，六边形内部是实现业务逻辑的类，在这一风格中被称为*应用程序*（application）。六边形内部的接口称为*端口*（ports），它们是到应用程序的输入连接（主端口）和到外部元素的输出连接（次要端口）。对于输入，应用程序通过连接接口（端口）暴露一组供外部消耗的\
    \ API。对于输出，应用程序暴露 SPI（服务提供者接口）接口（端口），而驱动应用程序的外部以及外部元素则通过应用程序调用（驱动）的服务来实现这些接口。\n\
    \n适配器属于应用程序的外部，并与技术方面（框架、驱动程序、外部服务等）耦合。我们可以为同一个端口准备多个不同的适配器。\n\n这种架构风格迫使我们从一开始就专注于功能性需求。进一步实现业务逻辑，稍后再决定使用哪些框架和外部服务。它还允许我们使用单元测试对应用程序进行完全测试，而无需\
    \ Mock 框架，测试中的简单类将实现端口，以便我们执行不同的用。\n\n2012年，Robert C. Martin 发表了一篇博客文章，使*整洁架构*（Clean\
    \ Architecture）这一术语广为人知，推广了这些优先考虑不受框架、数据库驱动程序、UI 技术限制，并允许独立于任何技术方面进行进行测试的应用程序架构风格。\n\
    \n## 实现\n\n如果我们观察上一节中为“RadioA”应用程序定义的分层结构（图 3.5 或 3.6），可以看到位于 `radio.model` 包中的业务逻辑：\n\
    \n> *https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html*\n\
    \n需要持久化层及其来自 `radio.persistence.api` 包的接口才能工作（即使我们使用的是编译型语言，编译时也需要它们）。同样，如果不包含持久化层的接口，就不可能对业务层进行测试。\n\
    \n因此，如果我们想重构 RadioA 的分层架构并转换为六边形架构，我们必须反转 `radio.model` 和 `radio.persistence`\
    \ 之间的依赖关系。与其让 `radio.model` 包依赖 `radio.persistence` 包，我们应该让 `radio.persistence`\
    \ 包依赖 `radio.model` 包。为了实现这一点，我们进行了以下更改：\n\n- 1. 我们创建 `radio.model.ports` 包，并将\
    \ `radio.model.api` 和 `radio.persistence.api` 包的接口移动到那里。然后删除这些 `.api` 包。\n- 2.\
    \ 我们删除接口 `radio.persistence.Competition`，因为我们将使用 `model.ports.RadioCompetition`。\n\
