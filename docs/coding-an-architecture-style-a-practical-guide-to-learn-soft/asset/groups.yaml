    \n图 3.2：物理分离\n\n图 3.2 显示了每个包现在都转换为了应用程序，这意味着每个包现在都有了自己的源代码项目文件夹及其依赖关系。如图所示，B 的包\
    \ API 和 C 的 API（通常只包含接口）不依赖于任何其他包或第三方库。这些项目中的每一个都会生成一个制品（Java 中的 jars、.NET 中的\
    \ assemblies、Ruby 中的 gems 等），它将成为需要它的其他模块（应用程序）的依赖的一部分。\n\n在同一图中，我们还可以看到针对每个剩余包的三个应用程序：A、B\
    \ 和 C。每个应用程序都有自己的第三方依赖，并且它们也包含由 B API 和 C API 生成的制品作为其依赖的一部分。最后，所有制品都一起部署在同一个环境中以启动应用程序。\n\
    \n## 模块、层及其架构风格\n\n使用这种构建应用程序的方法允许我们仅拥有图 3.1 中实线箭头定义的依赖关系。注意，模块 A 不可能引用属于模块 B\
    \ 的类。然而，缺点是我们增加了开发环境、构建脚本和部署的复杂性。\n\n如果我们想保持逻辑设计——一个使用命名空间或包结构化的单一源代码文件夹——另一个选项是添加一种方法来验证包与包之间的所有引用都是有效的。而且这种验证必须在每次提交时执行。\n\
    \n我们如何做到这一点？\n\n一个可能的选项（但仅适用于编译型语言，例如 Java 或 .NET）是根据需要编译每个包（仅带有它们有效的依赖关系），就像它们是真正的项目一样。如果它们可以通过编译，则意味着我们的依赖关系是有效的。\n\
    \n假设图 3.1 所示的逻辑设计，让我们下面下面如何使用 Apache Ant 脚本进行验证。\n\nAnt 脚本，隔离编译包\n\n```\n<target\
    \ name=\"compile-api-of-c\">\n  <mkdir dir=\"build/classes-api-of-c\" />\n  <javac\
    \ sourcepath=\"\" srcdir=\"src\" destdir=\"build/classes-api-of-c\"\n       includes=\"\
    api of c/*.java\" />\n</target>\n\n<target name=\"jar-api-of-c\" depends=\"compile-api-of-c\"\
    >\n  <mkdir dir=\"build/jar-api-of-c\" />\n  <jar destfile=\"build/jar-api-of-c/api-of-c.jar\"\
    \n       basedir=\"build/classes-api-of-c\" />\n</jar>\n\n<target name=\"compile-c\"\
    \ depends=\"jar-api-of-c\">\n  <path id=\"lib.path.ref\">\n    <fileset dir=\"\
    jars-third-party\" includes=\"physical-artifact-z.jar\"/>\n    <fileset dir=\"\
    build/jar-api-of-c\" includes=\"*.jar\"/>\n  </path>\n  <mkdir dir=\"build/classes-c\"\
    \ />\n  <javac sourcepath=\"\" classpathref=\"lib.path.ref\"\n       srcdir=\"\
    src/main/java\" destdir=\"build/classes-c\"\n       includes=\"c/*.java\" excludes=\"\
    api of c/*.java\" />\n</target>\n```\n\n> *https://ant.apache.org/*\n\n## 模块、层及其架构风格\n\
    \nAnt 脚本由 target XML 标签定义了三个任务。在第一个任务 `compile-apofc` 中，我们只编译属于包“api of c”的类，在\
    \ javac 标签的 includes 属性中指定了这一点（注意，有必要指定 sourcepath 以让 javac 知道只编译 includes 属性中指定的类）。任务\
    \ `jar-api-of-c` 生成制品。任务 `compile-c` 依赖于 `jar-api-of-c`，并编译 C 包，排除了 `api of c/*.java`。\n\
    \n## 模块、层及其架构风格\n\n另一种方法是使用 ArchUnit 这种工具来验证依赖。让我们看看如何用 ArchUnit 验证：\n\n## 使用\
    \ ArchUnit 验证依赖\n\n```java\n@Test\npublic void apiOfcOnlyDependOnJdk() {\n   \
    \ JavaClasses jc = new ClassImporter().importPackages(\"api of c\");\n    classes().that(\n\
    \        .resideInAnyPackage(\"api of c\")\n    ).should().onlyDependOnClasses(\n\
    \        .resideInAnyPackage(\"java..\")\n    );\n}\n```\n\n```java\n@Test\npublic\
    \ void packageOnlyDependOnApiOf() {\n    JavaClasses jc = new ClassImporter().importPackages(\"\
    c\");\n    classes().that(\n        .resideInAnyPackage(\"c\")\n    ).should().onlyDependOnClasses(\n\
    \        .resideInAnyPackage(\"api of c\", \"java..\")\n    );\n}\n```\n\nArchUnit\
    \ 拥有非常简单的语法和流式 API，如你所示。第一个测试用例验证了 API 包的类仅依赖于 JDK，第二个测试用例验证了 C 包的类仅依赖于 API 包和\
    \ JDK。\n\n*https://www.archunit.org/*\n\n## 模块、层及其架构风格\n\n在本书中，我们大部分使用 ArchUnit\
    \ 来验证依赖关系和架构规则。强制架构规则是避免面条代码的唯一方法。此外，如果未来需要，我们能够轻松地从逻辑设计移动到物理设计。\n\n## 水平与垂直分区\n\
    \n现在我们知道可以使用命名空间、包、模块（Java 9）甚至应用程序来按模块或层结构化应用程序。让我们继续学习模块和层之间的区别，然后实现它们不同的风格。\n\
    \n## 为什么要拆分应用程序？\n\n当我们谈论将应用程序拆分为模块或层时，是为了给应用程序提供结构。以这种结构使得我们可以改进可修改性质量属性，这意味着对我们所做更改的影响具有清晰度。\n\
    \n"
