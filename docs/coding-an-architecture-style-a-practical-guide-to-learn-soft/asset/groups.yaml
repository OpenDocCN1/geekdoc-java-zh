    ## 2. 软件架构：基础


    在本章中，我们将介绍软件架构的基础概念。我们从这些定义开始，这些定义将为我们后续理解后续章节提供理论支持。我们将定义软件架构、它如何在图表中表示以便分析，以及它与软件设计的区别。我们将研究不同的抽象层，通过这些层级来表示同一个应用程序的不同视图，并分析不同作者的建议。


    ## 什么是软件架构？


    如果你读过超过一本关于软件架构的书或文章，你就会知道软件架构并没有单一的定义。然而，在许多定义中，有些重要的词汇是通用的。我认为最重要的词是**结构**（structure）。让我们回顾一个简单且清晰的软件架构定义，它将指导本书书的其余内容。


    软件架构定义并确定了软件产品或系统的构建方式。这种结构由软件元素、它们的属性以及它们之间的关系组成。我们将任何软件部分称为软件元素，其范围可以涵盖函数、过程、类、模块、层以及应用程序、数据仓库、执行环境（Web
    服务器、容器等）、API 网关、队列系统等。


    如你所见，有一个长长的软件元素列表用于构建系统。目前，我们只需要理解这些元素是我们用来表达系统架构的，即表达它的结构。我们以后详细讨论它的用途。


    那么，为什么理解和可视化系统的结构很重要呢？主要是为了能够理解软件系统具有什么样的架构特征，或者我们想赋予软件系统什么样的特征。在任何系统的设计中，都有功能性需求，规定了系统必须提供的功能，但架构师（以及开发者）在设计系统时必须考虑某些因素。这些因素被称为质量属性¹⁰（quality
    attributes）。提到这些属性：


    -   可监控性（Monitorability）：系统是否提供了验证其状态的选项？执行该操作有多简单？

    -   可扩展性（Scalability）：系统如何响应需求的增加？

    -   可用性（Availability）：如果系统的任何软件元素故障，终端用户还能从系统获得响应吗？

    -   可维护性（Maintainability）：从一个数据库供应商迁移到另一个供应商有多简单？当我需要进行更改时，是否清楚这些更改将产生什么影响？


