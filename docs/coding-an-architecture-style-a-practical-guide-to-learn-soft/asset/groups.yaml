    为了计算系统的可用性，我们首先必须理解涉及的每个元素的可用性。需要说明的是，元素数量比部署图中显示的多得多。例如，在服务器中，我们有主板、处理器、网卡和存储设备，仅列举几个。我们还有网络设备（交换机、路由器等），允许我们将应用程序连接到数据库。所有这些元素都必须被考虑。


