    Figure 3.5: RadioA Layered Architecture


    The *ui, business,* and *persistence* layer are represented by **radio.ui**, **radio.model**
    and **radio persistence** packages respectively. As the business and persistence
    layers expose services, we add two sub-packages of them called **radio.model.api**
    and **radio.persistence.api** that will contain their public interfaces. As the
    figure 3.5 shows, the *ui* layer depends on the public interfaces located in the
    *radio.model.api* package, but not on their implementation (*radio.model*). And
    the same occurs with the dependency from the business layer to the persistence
    layer.


    So let''s to map this structure to the source code. First we generate the five
    packages mentioned and also a **main** package where we move the current **Main**
    class.


