    # Modules, Layers and their Architecture Styles


    The Ant script compiles the ports package and generates a jar with its classes.
    This jar is then used as the only dependency on all the other packages. A jar
    is also generated for each of the other packages. This is illustrated in Figure
    3.9.


    ![](img/9a234376112e1c13148524462ae6a2fd_62_0.png)


    Figure 3.9: Separated Compilation with Ant


    As you can see, each package needs the ports.jar to compile as required by the
    hexagonal architecture. Executing these validations on every commit keeps us aligned
    with the rules of hexagonal style which give us clarity about what changes will
    impact.


    The source code of this implementation can be found in github/radioa-hexagonal*.


    # Inverted Layered Architecture


    Having understood the ideas of the hexagonal architecture let''s look at another
    variant. We are going to implement RadioA by modeling the requirements in objects.
    How Fowler calls the rich domain model³⁴ ³⁵ (not anatomic)³⁶ And to persist the
    object model we are going to use a Data Mapper³⁷ solution like JPA (Java Persistence
    API), which allows us to enjoy the benefits of transparent persistence³⁸ ³⁹.


    So, let''s briefly review the requirements we had:


    +   1. Registrations in competitions are only valid between valid inscription
    dates.

    2. New: Those participants who register on the first day of registration will
    receive ten points, which can be exchanged later for different gifts.


    > *https://github.com/enriquemolinari/radioa-hexagonal

