    # Modules, Layers and their Architecture Styles


    In this book we will mostly use ArchUnit²⁹ to verify dependencies and architecture
    rules. Enforcing architecture rules is the only way to avoid spaghetti code. Addition,
    if in the future we needed, we will be able to move from a logical design to a
    physical one without much effort.


    # Java Module System


    The Java language in its version 9 has released a module system. By providing
    the syntactical construction you can create modules that are basically a group
    of packages. Each module must have a descriptor module-info.java used to define
    which packages are public and which private accessible to other modules. Furthermore,
    each module must indicate in its descriptor which public packages it requires
    from other modules. Another improvement it offers that all the dependencies of
    a module exist only within its modulepath, without interfering with the dependencies
    of other modules, contrary to what happens with packages and the classpath, where
    all the packages of the same application share the same dependencies (with the
    impossibility of using different versions of the same dependency for different
    packages).


    The rules we define in the descriptors of the modules are verified at compile
    time and at run time. If we structure the application of figure 3.1 using the
    module keyword of packages, we would have guaranteed compliance with the architecture
    rules without the need to use other tools. In addition, the Java module system
    also checks for invalid dependencies created using reflection*, none of the mechanisms
    shown before.


    It is not the intention of this book to explain in detail the benefits of Java9
    and its proposed module system, if you want more detail you can read the excellent
    book by Sander Mak³⁰. However, we will use it in depth towards the end of the
    chapter to implement a module architecture.


    # Horizontal vs Vertical Partitions


    Now we know that we have namespaces, packages, modules (Java9) or even applications
    to structure an application in modules or layers. Let''s continue with studying
    the differences between modules and layers and then we implement their different
    styles.


    # Why Do We Split an Application?


    When we talk about splitting an application into modules or layers, is with the
    goal of giving structure to an application. An structure in such a way that we
    can improve the modifiability quality attribute, which means to have clarity of
    the changes we make impact.


    > *https://www.oracle.com/technical-resources/articles/java/javareflection.html'
