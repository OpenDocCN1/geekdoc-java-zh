    实现分片的另一种方法是*哈分区 (hash partitioning)*。通过对特定属性应用哈希函数，可以确定它属于哪个分片。这种形式不需要存储任何映射，因为计算是在每次请求/操作时动态执行的。


    重要的一点是，每个读或写查询必须包含用于标识将请求发送到哪个分片的属性。本课程限制了可以进行的查询类型。然而，由于数据分布在多个分片上，负载也随之分布了。


    使用分片扩展关系型数据库是一项*极其复杂的任务*，因为数据分区和请求分布的所有复杂性都转移到了应用程序中。NoSQL 数据库带有所谓的**自动分片 (Auto-Sharding)**
    功能。也就是说，它们负责数据的分区、分布和复制，因此开发团队不再需要担心这些问题。


    具有自动分片、高可用性和 SQL 支持的分布式关系型数据库$^{69,70}$已经开始出现。在所有这些数据库中，显然都适用 CAP 和 PACELC 定理，因此理解这些定理对于了解每种情况下预期的结果至关重要。


    # Notes


    - 68 D. Abadi, "Consistency Tradeoffs in Modern Distributed Database System Design:
    CAP is Only Part of the Story," Computer, 2012.

    - 69 Yugabyte.

    - 70 MySQL Cluster.


