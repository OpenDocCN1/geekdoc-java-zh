    # 3. Modules, Layers and their Architecture Styles


    In this chapter we will talk about the structures and styles of architecture that
    belong to the **modules/layers** structures as described in chapter 2.


    # Namespaces, Packages, Layers and Modules


    In chapter 2 we said that the elements that correspond to the **modules/layers**
    structures should map to syntact constructions defined in the programming language
    that we are using. In small applications we use classes to structure an application.
    But as the complexity and the size of the code grows, we need others **syntact
    constructions** to architect an application in order to allow us to see where
    the changes will impact. It is not the same to make modifications in an application
    where we have 200 classes in a package (or several but without any definition
    of dependencies between them), to have 200 classes divided into some packages
    with a solid definition of dependencies between them.


    To group classes into modules, programming languages generally provide us with
    what they call **namespaces** (C#, PHP, etc) or **packages** (Java). Using packages
    we can group classes according to certain criteria and define architecture rules
    that govern the relationships between them. The relationships refer to dependencies
    that certain classes have with other classes located in other packages, which
    in turn causes the dependency between packages to exist.


    # Logical vs Physical Separation


    When we define modules or layers and their relationships using namespaces or packages,
    we say that there is a **logical separation** between them. That is, its limits
    are defined by syntactical elements, but physically all the classes regardless
    of namespace they belong, are located in the same physical place. This means that
    we are able to reference from any class to any other class in any package. It
    also means that classes from a third-party library that is only used by a specific
    package (specific module or layer) might also be accessible to classes from any
    other package (module or layer).


    On the other hand, when we define modules or layers and their relationships using
    applications that communicate with each other in the form of inter-process (for
    example through https messages) we are imposing a **physical separation** between
    them. Physical separation **ensures** compliance with basic architecture rules.
    To mention a few, modules or layers with physical separation will only be able
    to communicate between them through their public interface. In addition, the dependencies'
