    在图 4.3 和 4.4 所示的场景中，由于没有确认接收，应用程序 A 将尝试重新发送消息。这种情况被称为**精确一次语义**（exactly-once semantics）。在这里，理解消息可能被发送多次会对系统产生什么影响非常重要。也许发送电子邮件的消息是简单的，如果发送两次相同的内容并不要紧。或者消息可能是从银行账户中扣款，我们需要确保这种操作不会发生多次。


    理解**部分故障**（partial failures）的后果让我们在设计应用程序时考虑到同一消息可能会被多次发送。处理这种问题的方法之一是使服务具有**幂等性**（idempotent），如果它们使用相同的输入执行多次，它们产生的效果与第一次执行产生的效果没有其他区别。另一种处理方法是**去重**（deduplication），即每条消息都有一个唯一标识符。每当转发具有相同标识符的消息时，接收方可以检查消息是否已经接收过，如果是则将其丢弃。


    在**同步**（synchronous）通信模型中（如之前的几幅图所示），应用程序 A 在发送消息后会等待响应。只有在收到来自应用程序 B 的响应或配置的超时时间到达后，才会继续执行。


    如果我们想防止应用程序 A 等待应用程序 B 的响应，我们应该进行异步通信。例如，消息可以持久化在队列中，然后由另一个进程处理并将其发送到应用程序 B。在这里我们需要处理超时问题以及可能多次发送同一条消息引起的问题，但优势是应用程序
    A 可以继续执行并处理其他请求。


    ## 事务


    在中心化系统中，得益于关系型数据库（以及某些 NoSQL）实现的事务概念，我们拥有了原子性保证。换句话说，如果有两个操作要执行，在其中一个失败的情况下，两个都会执行，或者都不执行。实现此点的数据库让应用程序开发人员无需处理这些问题，这这意味着软件系统更加简单。在分布式系统中，保证原子性是相当复杂的。当我们涉及两或多台计算机执行必须原子化执行的操作时，我们称之为分布式事务。我们可以说，在分布式架构中我们有两种需要保证原子性的变体，其中一种比另一种复杂。


    第一种出现在我们需要将存储在数据库中的某些信息复制到其他数据库时。关系型数据库具有内置机制来执行此类工作（主/从复制），或者如果我们讨论的是具有不同数据模型的数据库（因为它们属于不同的应用程序），我们可以使用发布/订阅机制进行去复制。通常情况下，数据复制是异步进行的，以避免在复制信息时延迟终端用户。这产生了所谓的**最终一致性**（eventual
    consistency）。也就是说，数据库会在某个点保持一致。


    第二种变体也是更复杂的一种，出现在我们需要原子化地更新位于不同数据库的不同信息时。例如，假设有一个接收酒店预订的 Web 应用程序。为了确认预订，我们必须首先验证信用卡是否有效，然后生成发票并通过电子邮件发送。这三个动作发生在不同的应用程序中，并且必须原子化地执行。实现这一点的技术称为
    Sagas。基本上，saga 由一系列事务 $T_1, T_2, \dots, T_n$ 组成，每个事务 $T_1$ 与一个补偿事务 $C_1$ 关联，在需要回滚时执行该补偿事务。图
    4.5 Illust了这个概念。


    ![](img/9a234376112e1c13148524462ae6a2fd_96_0.png)


    图 4.5：Sagas


    图 4.5 显示，在每个成功的事务 $T$ 上，消息会被发送到参与该 saga 的下一个应用程序。如果这些事务 $T$ 中的任何一个失败，就会顺序启动补偿事务以撤销到故障点为止所执行的操作。通常情况下，涉及事务的消息（Tx
    或 Cx）通过发布/订阅机制异步实现。


    虽然还有其他机制⁵⁶可以执行分布式事务，但 saga 是微服务架构推荐的机制。


    ## 分布式单体


    在进入微服务之前，理解被称为**分布式单体**（Distributed Monolith）的架构风格非常重要。这种风格建议将一个应用程序分成多个更简单的应用程序，每个应用程序运行在自己的进程中，它们以进程间通信（IPC）的形式同步地相互通信。


    假设我们取具有模块化架构的 RadioA 应用程序，并将每个模块转换为暴露 https 服务的简单 Web 应用程序。也就是说，每个服务都暴露并可以通过方法调用，而我们现在通过
    Javalin\* 使用 https 暴露它们。我们还需要 Notifications 模块也通过 https 暴露通知服务。然后，这些模块中的每个都部署在自己的容器中，通过
    https 同步调用相互通信。让我们来看看 de具有分布式单体架构的 RadioA 容器图：


    > *https://javalin.io/*


    ![](img/9a234376112e1c13148524462ae6a2fd_97_0.png)


    图 4.6：分布式单体


    图 4.5 显示，在每个成功的事务 $T$ 上，消息会被发送到参与该 saga 的下一个应用程序。如果这些事务 $T$ 中的任何一个失败，就会顺序启动补偿事务以撤销到故障点为止所执行的操作。通常情况下，涉及事务的消息（Tx
    或 Cx）通过发布/订阅机制异步实现。


    虽然还有其他机制⁵⁶可以执行分布式事务，但 saga 是微服务架构推荐的机制。


    ## 微服务


    定义 定义与风格


    微服务架构风格像之前的风格一样，与模块化架构相似，因为拆分应用程序的标准是相同的。区别在于我们讨论的是应用程序而不是模块，它们之间的通信是进程间的形式。到目前为止，我的描述与分布式单体没有区别。那么微服务有什么特别之处？它与单体有什么不同？


    它提议消除时间耦合。这种风格认为微服务应该是独立的。微服务必须在与系统隔离的情况下开发、测试和部署。正如我们所说，在单体中无法做到。


    如何实现这一点？


    我们必须改变微服务通信的方式。时间耦合是由同步通信产生的。对此，正如我们在软件设计中所采取的那样，我们需要在它们之间放置另一个元素。


    我们可以通过使用发布/订阅机制来实现，这是它们之间的一种异步对话。其主要特征是通信双方都不了解对方。接收消息的人订阅消息类别（或特定主题），产生消息的人不知道谁对此感兴趣。这种机制消除了微服务之间的时间耦合。任何微服务之间的耦合形式必须从系统中移除，因此我们消除了微服务之间任何代码重用的可能性。其他，在这种架构风格中，团队的独立性优于代码重用。Sam
    Newman 在他的书《微服务⁵中提到：


    > “微服务之间过度耦合的恶果远大于代码重复带来的问题”


    我们如何将应用程序拆分为微服务？


    这是最复杂的部分，但猜猜呢？我们已经在模块化架构风格中讨论过这一点，因为拆分模块的标准与用于拆分微服务的标准是相同的。事实上，正如我们看到的，拥有模块化架构让我们在确实需要时可以迁移到微服务而不会遇到太大麻烦。


    '
