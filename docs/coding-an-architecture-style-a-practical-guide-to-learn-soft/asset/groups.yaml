    MTTR is low, the availability does not decrease as much.


    ## Other Issues Affecting Availability


    There are others factors that affect the availability of a system. One is the
    environment, for instance, power outages, fires, earthquakes and other similar.
    To have a low MTTR in these cases, it is required to replicate the entire data
    center in a remote location. The other factor that affects availability more frequently
    are human errors. When we carry out any type of software upgrade, reconfigure
    servers or network equipment, or deploy new versions of applications, there is
    a risk of making mistakes. Automating manual tasks helps to decrease human errors.
    Perform the actions in low environments before doing it in production too.


    Finally, to be prepared for a possible failure during deploying new application
    releases to production, it is extremely important to design the systems in such
    a way that it is possible to go back to the previous version in a simple way.
    If every time we deploy a new version of the system in production it is possible
    to go back to the previous version, then the MTTR will always be low in these
    cases.


    > *https://en.wikipedia.org/wiki/Failover


    NOTES


    Although this is not always possible, making this effort saves some headaches.
    To keep backward compatibility with previous and new versions of a system we should
    iterate the database schema adding new tables, columns, etc, but not removing
    or changing existing ones for instance. If database changes for a new version
    of an application are backward compatible, we should deploy them in production
    before the new version of the application. Then, when moving the new version of
    the application to production, if we find problems, we can go back to the previous
    version in a simple way. Once the new version of the application has been in production
    for some weeks, only then we could apply scripts to delete unused tables or columns
    or add additional restrictions (not-nulls for example) to the database.


    ## Availability in Microservices


    Microservice architecture, given their asynchronous nature, could have increased
    availability depending on how the business sees it. That is, suppose we deploy
    the RadioA application with Microservice architecture as we saw in the previous
    chapter, without any replicated element. And suppose the Notifications Microservice
    crash. Since the mobile and web application are still available to the end user,
    it can be considered that the system is still available (if the business considers
    that a delay in sending emails does not count as a complete failure of the system).
    With this we could say that the total availability of the system will be the Notifications
    service


