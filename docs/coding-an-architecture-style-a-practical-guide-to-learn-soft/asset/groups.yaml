    # # Scaling Databases


    Scaling databases is complex mainly because we have to distribute the data on
    more than one computer, which leads us to have to deal with the complexities of
    distributed systems mentioned before. Relational databases and their foundational
    properties, such as ACID transactions, were designed to operate on a single centralized
    computer in a moment where there was no thought requiring capacity for the demand
    imposed by "planet-size" applications. Companies like Google and Amazon have had
    to design their own databases, essentially, to be able to scale and respond to
    their demand on a global scale. Thus the first NoSQL databases were born.


    So, we could say that relational databases were designed to guarantee consistency
    and atomicity, among other things. They provide us with simple mechanisms to use
    so that as developers don''t have to deal with it. However, they do not provide
    us with simple mechanisms to have high availability or to scale. On the other
    hand, NoSQL databases do give us the ability to have high'
  - '[PAGE 135]


    availability and scale without too much effort, they were designed for this. But,
    they do it at the cost of consistency.


    Let''s start then by analyzing essential issues of distributed databases and then
    continue looking at different options that allow us to scale the databases.


    # CAP and PACEL Theorems


    We said that we could achieve high availability and scalability by distributing
    the data. We also said that to achieve we have to sacrifice consistency. The CAP
    (and PACEL) theorem explains why this happens. The CAP Theorem suggests that in
    a **network outage** we have to decide between offering consistency or availability
    (but not both). CAP represent the following properties: Consistency: Each read
    will receive the value of the most recent write operation.


    Availability: Every request gets a (non-error) response regardless of the individual
    state of a node.


    Partition Tolerance: The system does not fail, regardless of whether messages
    are dropped or delayed between nodes caused by network outage.


    As shown in 6.3, suppose two databases, A and B, connected by a network where
    both have a record $X=50$ stored. At some point, the network fails and the connection
    between the databases are interrupted. Imagine then in this state, a write request
    arrives at database A, in order to assign 100 to X and a write request arrives
    to database B for the X value. This is where the system has two options: perform
    both requests in A and B, returning an old value of X, which provides availability
    but not **consistency** or return an error providing consistency by the new value
    of X cannot go from A to B, losing **availability**.


    ![](img/9a234376112e1c13148524462ae6a2fd_135_0.png)


    Figure 6.3: CAP Theorem


    Thus, distributed databases are usually classified as **CP** or **AP**, depending
    on which property guarantee in the event of a network failure.'
  - '[PAGE 136]


    It is important to understand that the choice between being a CP or an AP is relevant
    only when there is a network outage, which does not happen frequently. As long
    as the system is operating normally, both properties (Consistency Availability)
    could be guaranteed. Because of this, there is an extension to the CAP theorem
    called PACELC, which says the following:


    +   1. Where there are network outages (P), we have to decide if we want to provide
    availability (A) or provide consistency (C).

    2. But when the system is running normally (Else), one has to choose between low
    Latency and Consistency.


    That is, normal (in the absence of network partitions) write operations can be
    delayed until the changes are replicated throughout the system, having higher
    latency but guaranteeing consistency (EC). Or have minimal latency at the cost
    of not being consistent (EL).


    In this way, distributed databases can be cataloged in the following ways:


    AP/EL: Availability (A) over consistency if there are network partitions (P) and
    low latency in normal situations (EL).

    AP/EC: Availability (A) over consistency if there are network partitions (P) and
    consistency, delaying writes in normal situations (EC).

    CP/EL: Consistency (C) over availability if there are network partitions (P) and
    low latency in normal situations (EL). This configuration probably is not used
    really.

    CP/EC: Consistency (C) over availability if there are network partitions (P) and
    consistency, delaying writes in normal situations (EC).


    # Scaling Reads


    In general, applications receive a greater number of read operations than writes.
    So, if we detect that the bottleneck is in the database (rather than the application),
    the easiest way to scale a database is scaling read operations.


    The vast majority of databases have replication mechanisms built-in. Which would
    allow us to use a database to handle only write operations and others to handle
    read operations. In this way we distribute the load in several database servers.
    This is illustrated in Figure 6.4.'
  - '[PAGE 137]


    ![](img/9a234376112e1c13148524462ae6a2fd_137_0.png)'
  - '[PAGE 138]


    As can be seen in figure 6.4, there are two application servers that send all
    the write operations to the node-b, which is the master database. The master database
    replicates to read-only replicas (node-b1 and node-b3). This database configuration
    is called master/slave.


    If the replication from master to slaves is synchronous we would have a distributed
    configuration of EC, and if it is asynchronous (like the configuration in figure
    6.4) it would be EL. On the other hand, for the application to send all the read
    operations to the slave databases (node-b1 and node-b3), it''s necessary to have
    some load balancing mechanism (node-lb2) as shown in figure 6.4.


    Supposing that our master database is relational, other replication mechanisms
    like Change Data Capture* we could scale the read operations also replicating
    to NoSQL databases (in memory or disk). This requires some extra effort (as replication
    mechanisms offered by relational works only for databases with identical models)
    but it might be necessary if we require some features only available in NoSQL
    databases.


    Note that with this configuration read operations can scale without limit, adding
    new read replicas as needed. We release the master database from some load caused
    by read operations and we are able to distribute that load into multiple replicas.


    If we detect that our bottleneck is in the master database (because we have a
    high number of current write operations), we have to look at a different option:
    There is a replication configuration called master/master, where all nodes receive
    and write operations and all replicate towards all. But this configuration does
    not work to scale writes, since they all receive the same amount of requests,
    there isn''t load distribution. Although they do work to improve availability.
    The only way to scale write operations is by using Sharding.


    # Sharding: Scaling Writes


    The only way to scale write operations is to do a horizontal partitioning of the
    data. In this way some sets of records are in a database server and other sets
    of records are in another database server. This is called Sharding.


    Figure 6.5 shows one of the existing ways to implement Sharding is called range
    partitioning. You can see three databases storing information about people according
    to the value of the attribute id. Each of these databases is called a shard. The
    application needs to store the mapping between the range and the database that
    contains the people in that range, so that it can identify which shard to access
    with each operation to read or modify information from people.


    > *https://en.wikipedia.org/wiki/Change_data_capture'
