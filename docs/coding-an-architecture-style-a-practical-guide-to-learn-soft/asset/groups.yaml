    Figure 4.6: Distributed Monolith


    If we look at figure 4.6 we can see the two front-containers, the single-page
    application and the mobile application, have not changed with respect to figure
    4.1. Then we see the three modules converted into Web applications: **API Notifications**,
    **API Competitions** and **API UserProfile**. All of them exposing https services.
    Note the difference with figure 4.1, where API **RadioA** was the only monolithic
    deployment unit and we have three. The arrows between the different containers
    in this case are all synchronous communications. **Competitions** consume a service
    from the **Notifications** application to send an email after an inscription is
    done. And **Notifications** consumes a service from **UserProfile** to retrieve
    the email from the listener to send the notification.


    This architecture style is considered an anti-pattern because it has all the disadvantages
    of distributed systems present and also **temporal coupling**. In order, to be
    able to register a listener in a competition, I not only need to have the Competitions
    available but also the **Notifications** application (and in this turn the **UserProfile**).
    If any of them were not available, it would not be possible to register a listener
    in a competition. Thus, it has the cons of the modular monolith, which is the
    temporal coupling between modules, and the cons of the distributed systems which
    are dealing with partial failures. An advantage, not minor, over the modular monolith
    architecture is that it allowing different technologies for each application,
    at the entire stack. So you might have coded the UserProfile application in Ruby
    with a NoSQL Database and the Competitions application in PHP with MySQL.'
