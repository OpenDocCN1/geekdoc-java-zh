    ## Monolithic and Distributed Architecture


    ![](img/9a234376112e1c13148524462ae6a2fd_89_0.png)


    Figure 4.1: Modular Monolith


    The API RadioA (Javelin Web) box refers to the RadioA application (whose modular
    architecture is illustrated in figure 3.14) at run-time, deployed in a single
    artifact. The diagram also shows the databases and the message queue containers
    that each module requires as explained in the previous chapter. In addition, you
    can see containers, the mobile front-end and the Web single-page front-end, communicating
    with the https services through an API Gateway*.


    As illustrated by the figure 4.1, our RadioA application with modular architecture
    deployed as a single artifact is what is known as Modular Monolith. The term Modular
    Monolith was popularized by SimonBrown¹ the author of the C4 model that we described
    in chapter 2. This term is mainly thought of with the idea of differentiating
    an application with good architecture (modular), from a monolithic application
    with spaghetti code.


    All the modules are deployed in a single container (web server in this case) and
    the communication between them is in the form of in-process, as we have mentioned.
    Let us then go on to study distributed architectures and make a comparison between
    the two.


    > *https://microservices.io/patterns/apigateway.html


    ## Distributed Architectures


    This is perhaps one of the hottest topics in recent years, not only due to the
    rise of Microservices and NoSQL databases, but also due to every organization
    there is always some kind of integration between different systems. We consume
    APIs from internal and external systems, which leads us to deal with the complexities
    of distributed systems. In this section we will begin by explaining the difficulties
    we encounter in distributed-systems, to finally explain the Microservice architecture
    by implementing RadioA with structure.


    ## Reasons to Distribute


    In distributed architectures, a system is divided into multiple smaller applications
    where each one is deployed in its own container, runs in its own process and communicates
    with each other by sending messages through the network as shown in the figure
    4.2.


    ![](img/9a234376112e1c13148524462ae6a2fd_90_0.png)


    Figure 4.2: Distributed Architecture - Communication


    As you may have noticed in figure 4.1, between the browser, or a mobile application
    and the backend application (server side) we already have communications through
    the network between distributed applications. But here we go deeper, we split
    and distribute the back-end (represented by the API RadioA box), which complicates
    everything more.


    So, if it complicates everything even more, why do we distribute a system?


    As we mentioned, everything in architecture is a trade-off. While distributing
    a system complicates things on one side it will give us benefits on other sides.
    In this case, by distributing we improve the **performance, scalability and availability.**
    It is not always possible to upgrade a server''s hardware to improve **performance**,
    and at some point well, the cost of upgrading it prohibitive. By distributing
    a system, performance can be improved since the load is distributed over two or
    more commodity servers. If the system we build is successful, the number of clients
    will grow, forcing us to handle more requests and more volume of data. By distributing
    the load and volume of data on different computers, allows us to scale to levels
    impossible in monolithic architectures. The only way to improve the **availability**
    of our system is by replicating it on multiple computers so that if one fails,
    another can replace it. To do that we need to distribute the system. We will cover
    these quality attributes in the following chapters.


    The mentioned advantages come with a set of difficulties and limitations that
    we do not find in monolithic architectures. It is important to understand what
    they are in order to make the right decisions to handle them.


    ## Partial Failures


    When an application is running on a single machine, its behavior is predictable.
    If the hardware it runs on, the application will work. If the hardware fail, for
    any reason, the entire application will stop working. That is, an application
    on a single machine works or does not work, but there is nothing in between (removing
    from the equation possible bugs that the application could have).


    When we design an application to run on multiple machines communicating over a
    network, the situation is very different. Distributed applications are made up
    of several elements that could fail. The network, along all its complexity, the
    machines where the application runs are part of the system. Any of these elements
    (computers, network devices such as routers, switches, etc.) that are part of
    a distributed system might fail while other elements of the system might be working.
    This is known as **partial failures**⁴⁵.


    The problem is that these partial failures can occur in any of the elements of
    the system in an unpredictable way and behave differently in each case. Partial
    failures are the main difficulty we face in distributed architectures. Of course,
    these failures could be very rare. If they do occur we will have able to handle
    them, designing the applications with this in mind.


    In general, these difficulties are ignored by those who are new to the implementation
    of distributed systems. Because of this, a team working at Sun Microsystems in
    the 1990s published a set of fallacies made by inexperienced developers when implementing
    distributed systems. These are known as the **fallacies*** of distributed computing
    and are intended to help better understand the difficulties caused by partial
    failures.


    The fallacies are listed below:


    - 1. The network is reliable.

    - 2. Latency is zero.


    > *⁴⁵https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing


    - 3. Bandwidth is infinite.

    - 4. The network is secure.

    - 5. Topology does not change.

    - 6. There is one administrator.

    - 7. Transport cost is zero.

    - 8. The network is homogeneous.


    From these fallacies, we are more interested in understanding why the network
    is not reliable. Networks do not guarantee that a packet will reach its destination
    and cannot even guarantee that it actually reaches its destination. The book Designing
    Data-Intensive Applications³ is very clear describing the possible situations
    that could happen when application A sends a message to application B over the
    network:


    - 1. The request might have been lost (perhaps someone unplugged a network cable).

    - 2. Your request might be waiting in a queue and will be delivered later (perhaps
    the network or the recipient is overloaded).

    - 3. The remote node may have failed (perhaps it crashed or it was powered down).

    - 4. The remote node may have temporarily stopped responding (perhaps it is experiencing
    a garbage collection pause), but it will start responding again. See 4.4.

    - 5. The remote node may have processed your request, but the response has been
    lost on the network (perhaps a network switch has been misconfigured). See 4.3.

    - 6. The remote node may have processed your request, but the response has been
    delayed and will be delivered later (perhaps the network or your own machine is
    overloaded).


    The usual way to deal with this issue is by using timeouts. That is, after a certain
    time it is assumed that no response will be received. However, this does not guarantee
    that the remote machine has received the message or not. In Figure 4.3, application
    A sends a message to application B, which receives the message and processes it.
    But the response is lost in the network, it does not reach application A. After
    a certain time (according to the configured timeout), application A terminates
    the communication in Figure 4.4 something similar happens, the message reaches
    application B, but for some reason it takes a long time to process it, exceeding
    the timeout configured in application A. With which, in the previous case, application
    A terminates the communication as failed, ignoring the answer that eventually
    comes. In both cases, application A terminates with an error, without being able
    to differentiate between the loss of the response in the network (figure 4.3)
    or the delay in processing (figure 4.4).

