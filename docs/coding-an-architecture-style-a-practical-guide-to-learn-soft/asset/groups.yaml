    # Hexagonal Architecture


    # Definitions and Style


    In 2005 Alistair Cockburn published the architecture style called Hexagonal Architecture*,
    also known as Ports and Adapters. The intention of this style as defined by its
    author says:


    "Allow an application to equally driven by users, programs, automated test or
    batch scripts, and be developed and tested in isolation from its eventual run-time
    devices and databases".


    It is important to note that this style has special emphasis on the rule of separating
    the application (business logic) from any external element as user interfaces,
    scripts, email services, external applications, messaging systems, databases,
    etc.


    To achieve this separation (coupling) the application communicates only through
    interfaces - called ports with external infrastructure elements. We have two flavors
    of ports, those who drive the application (primary ports) and those who the application
    drives (secondary ports). So, we have external elements as scripts, user interfaces,
    automated tests, etc., who drive the application, on the other hand, the application
    communicating via the ports with external elements such as databases, external
    systems, etc by by invoking secondary ports. In both cases, for each external
    element there will be one or more adapters that will be responsible for the mapping
    between the outside world and the application (inside) world.


    Figure 3.7 shows the typical diagram of the hexagonal architecture:


    > *https://alistair.cockburn.us/hexagonal-architecture/'
  - '[PAGE 56]


    # Modules, Layers and their Architecture Styles


    ![](img/9a234376112e1c13148524462ae6a2fd_56_0.png)


    Figure 3.7: Hexagonal Architecture


    As can be, within the hexagon are the classes that implement the business logic,
    which in this style is just called *application*. The aPort interfaces inside
    the hexagon, called *ports*, are the input connection to the application (primary
    ports) and the output connection to external elements (secondary ports). For inputs,
    the application exposes a set of APIs via connection interfaces (ports) that are
    consumed from the outside. For output, the application exposes SPI (Service Provider
    Interface) interfaces (ports), and the outside who drives the application, and
    the external elements implement them by the service invoked (driven) by the application.


    The adapters belong to the outside of the application and are are coupled to technical
    aspects (frameworks, drivers, external services, etc). We could have several different
    adapters for the same port.


    This architecture style forces us to put our efforts on functional requirements
    from the very beginning. Go further implementing business logic, to later decide
    which frameworks and external services to use. It also allows us to fully test
    the application with unit tests, without mocking frameworks, simple classes in
    our tests will implement the ports to allow us to exercise the different cases.


    In 2012 Robert C. Martin published a blog post that made the term Clean Architecture
    known*, promoting these architectural styles that prioritize applications free
    of frameworks, database drivers, UI technologies and that allow to be tested isolated
    from any technical aspect.


    # # Implementation


    If we look at the layered structure that we defined for the "RadioA" application
    (figures 3.5 or 3.6), in the previous section, we can see that the business logic,
    which is located in the radio.model package,


    > *https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html'
