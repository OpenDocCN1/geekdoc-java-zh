    \n> *https://ant.apache.org/*\n\n## Modules, Layers and their Architecture Styles\n\
    \nThe Ant script has three tasks defined by the target XML tag. In the first one\
    \ compile-apofc, we compile only the classes belonging to the package \"api of\
    \ c\", specifying this in the includes attribute of the javac tag (note that it\
    \ is necessary to specify the sourcepath to let javac know that only compile classes\
    \ inside the ones specified by the includes attribute). The task named jar-api-of-c\
    \ generates the jar artifact including it the compiled classes (.class files)\
    \ done the previous task.\n\nFinally, the compile-c task compiles only package\
    \ C (note again the includes attribute of the javac task on line 23) including\
