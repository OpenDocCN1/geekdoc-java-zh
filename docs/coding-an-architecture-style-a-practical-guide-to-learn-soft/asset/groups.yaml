    ![](img/9a234376112e1c13148524462ae6a2fd_13_0.png)


    Figure 2.3: MVC Architecture


    This is an architecture diagram where the software elements represent namespaces
    (namespaces*) that class groups intended to attend to a common goal. The namespaces
    are equivalent to packages in the Java language. The relationships between them
    represent their dependencies, that is, app\controller depends on app\model and
    app\view, and the latter has no dependencies. Classes within app\controller use
    classes from app\models to invoke business logic. With the response they obtain
    to app\view classes, in change transforming inputs into HTML.


    It is important to note that this diagram implies architecture rules. For example,
    from app\view it is not allowed to use classes from app\controller or app\model.
    The main objective of these rules is to enhance the maintainability, to make clear
    where the changes we make impact. For example, it allows me to understand that
    if we wanted to modify some class of the app\view package I should check where
    it impacts the app\controller package but it would not necessary to verify the
    app\model package.


    So far we have a diagram that represents the structure of the application at runtime
    (Figure 2.2) and another diagram that represents its package structure with its
    dependencies (Figure 2.3). The latter is associated with architecture decisions
    that we assume as a development team.


    Is there more than one diagram that represents the architecture of a system?


    Yes, we have different views¹² of the architecture of the same system, with each
    view represents a different abstraction of our system that allows us to visualize
    and reason about different characteristics. In turn, the different views are used
