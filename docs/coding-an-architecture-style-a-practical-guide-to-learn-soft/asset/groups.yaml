    # Some Comments about the Implementation


    Let''s review some important decisions regarding the implementation we have done:


    **Duplicated Code:** You may have noticed that there is duplicated code between
    the Microservices. As mentioned earlier, sharing reusable modules between Microservices
    creates coupling between them, and one of the main architectural rules of this
    style is precisely independent. On the other hand, this style makes sense where
    there is a significant staff of developers divided into teams, each responsible
    for a Microservice, and where reuse occurs mainly within each team and between
    teams.


    **Publish/Subscribe Mechanism:** We have used Redis Pub/Sub* as an implementation
    of the publish-/subscribe mechanism. It is really very simple to use, extremely
    fast, and for certain requirements it could be sufficient. However, it is not
    the right implementation for Microservices where messages cannot be lost. For
    example, if a Microservice is not listening when messages are published, it should
    be able to consume those messages already sent. This is known as reconnecting
    to publish/subscribe mechanism *durability*. Let''s look at some essential features
    to keep in mind when selecting a publish/subscribe technology:


    > *https://redis.io/topics/pubsub'
  - '[PAGE 117]


    # Monolithic and Distributed Architecture


    +   1. Durability: Do we want messages to remain available from being consumed
    until they actually consumed by all subscribers?


    +   2. Persistence: Do we want messages persist so they survive a crash?


    +   3. Failure on the Consumer: If for some reason the consumer receives the message,
    but crashes before performing an action with it, we should be able to mark message
    as not done somewhere.


    +   4. Message Order: Do we want to preserve the order of the messages for consumption?


    **Security:** The UserProfile authentication service generates a UUID* after authentication
    succeeds. It would be better to generate a JWT*, as it is more secure. Every request,
    before reaching the Microservices, goes through an API Gateway which checks if
    the token is valid. If it is, it forwards the request to the Microservice. The
    container diagram in figure 4.8 shows that it is the API Gateway who receives
    the requests from clients to forward to the corresponding Microservice.


    **Coupling between Microservices:** The only coupling between Microservices is
    the structure of the messages. Here it is necessary for the teams to agree on
    its definition and be backwards compatible when making changes.


    **Operations:** One of the most complexities generated by this style of architecture
    is to have the management that be carried out in production. Effectively monitoring
    an application with Microservices architecture is not a simple task. Even more
    complex if we have a different technology stack in each Microservice. To alleviate
    this, Microservices need to share libraries or services, for logging, which entries
    end up in a centralized and easy-to-review repository. In general, these guidelines
    are defined by the operations team.


    **Database Changes and Event Publication Atomically:** Both Microservices **UserProfile**
    and **Competitions** requires to do changes in their database and publish an event
    and must be done atomically. For example, in the **UserProfile** Microservice
    after we do the creation of a new listener (as an event in the database) we have
    to do the publication of the “new-listener” event and must be atomically. The
    same happens in the **Competitions** Microservice after we register a listener
    in a competitions we have to publish the “inscription-added” event. As we mentioned
    earlier, one possibility is to implement the outbox pattern. Another option, could
    be the tools like Debezium‡, monitor the transaction of databases and publish
    events for each *insert, update or delete* in an atomic way.


    # Modular Architecture vs Microservices


    Although it seems Microservices are the only option to spaghetti code, as we have
    seen in this book, this is **not the case**. What is necessary to avoid spaghetti
    code to define a solid architecture with clear rules, validated in some way (in
    compilation or with automated tests) on every commit.


    *https://en.wikipedia.org/wiki/Universally_unique_identifier

    ‡https://jwt.io/

    ‡https://debezium.io/'
