    ## III Quality Attributes


    In the previous two chapters we talked almost completely about Maintainability
    attribute. We structure the application using different criteria and style with
    the main goal of reducing the complexity of the software product. Different structures
    and styles of architecture also favor other quality attributes, not just maintainability.
    For example, Microservices favor, in addition to modability, availability. When
    one Microservice is down, the rest of the application continues working.


    How do we define quality attributes?


    In the Software Architecture in Practice⁶ quality attribute is defined as a measurable
    and testable property of the system that is to indicate how the system satisfies
    the needs of its stakeholders.


    Quality attributes are also called non-functional requirements. In the recent
    book Fundamentals of Software Architecture⁶³, the authors incorporate a third
    way of calling them: architecture characteristics.


    In this book I refer to them as quality attributes because that is how you will
    find it in most of the software architecture literature. In any case, all the
    authors agree that these refer to requirements not related to the problem domain,
    but to technical needs of equal or greater importance. Many times we re-design
    a system because the performance is bad, or because the availability is not enough
    or we need to improve the scalability while maintaining the functionality in the
    same. This demonstrates the importance of quality attributes for the development
    of a system.


    In the definition of quality attributes cited above, it is mentioned that each
    attribute must be measurable and testable. It is not to say that a system is "modifiable".
    Every system supports certain changes better than others, and in the same way
    it happens with other attributes. For example, a system can better support the
    failure of a particular container but not the others. This requires an extensive
    specification of quality attribute requirements, as can be found in the book Software
    Architecture in Practice⁶⁵.


    We have already discussed modifiability in detail in the previous chapters. In
    this part of the book we focus on detailing the attributes availability and scalability.

