    # [0..100]


    shard 0


    # [101..200]


    shard 1


    # [201..300]


    shard 2


    | id | name | ... |

    |---|---|---|

    | 5 | Angus | ... |

    | 8 | Malcom | ... |


    | id | name | ... |

    |---|---|---|

    | 102 | Ricardo | ... |

    | 120 | German | ... |


    | id | name | ... |

    |---|---|---|

    | 211 | Bruce | ... |

    | 234 | Dave | ... |


    Figure 6.5: Sharding


    Another way to implement Sharding is *hash partitioning*. By applying a hash function
    to a specific attribute, it determines which shard it belongs to. This form does
    not require storing any mapping, as the calculation is performed dynamically with
    each request/operation.


    It is important to understand that every read or write query must contain the
    attribute used to identify which shard to send the request to. This course limits
    what types of queries can be made. However, as data is distributed across several
    shards, the load is distributed too.


    Scaling a relational database with Sharding is an *extremely complex task*, as
    all the complexity of partitioning the data and distributing requests goes into
    the application. NoSQL databases come with what is called **Auto-Sharding**. That
    is, they are in charge of partitioning, distributing and replicating the data
    so that the development team does not have to worry about this.


    Distributed relational databases$^{69,70}$ with Auto-Sharding, high availability
    and SQL, have started to emerge. In all of them, of course, the CAP and PACELC
    theorem applies, so it is important to understand them in order to know what to
    expect in each case.


    # Notes


    - 68 D. Abadi, "Consistency Tradeoffs in Modern Distributed Database System Design:
    CAP is Only Part of the Story," Computer, 2012.

    - 69 Yugabyte.

    - 70 MySQL Cluster.

