    # 模块 vs 层


    我们使用相同的抽象和相同的语法结构来定义应用程序中的模块或层。这些就是上一节中提到的：命名空间（namespaces）、包（packages）、模块（Java
    9 及其他语言）以及应用程序。


    要定义的最重要的方面之一是首先确定我们是要进行**水平划分**还是**垂直划分**。通常情况下，当我们谈论“层”时，指的是对应用程序进行水平划分。也就是说，将一个应用程序按照技术维度进行划分，这些维度通常与用户界面、业务逻辑和数据访问有关。另一方面，划分应用程序是根据功能维度进行划分，对此我们称之为“模块”而不是“层”。一个模块中包含某些功能的类，而另一个模块中包含实现并解决其他功能的某些类。如果一个开发团队之外的人查看一个垂直分层应用程序的模块结构，他们可以识别出系统的主要功能（而且你的架构也会像鲍叔
    Bob† 所描述的那样“叫出”其目的）；而在一个水平分层的应用程序中，他们可能无法这样做。也许他们会注意到某些技术方面是由处理此类技术的开发团队解决的（例如，前端开发者与后端开发者）。


    让我们来看看允许我们水平和垂直划分应用程序的不同结构和风格。


    # 定义与风格


    分层架构风格可能是使用最广泛、同时最易理解和应用的风格。它也是最老的风格之一。两本非常好的书籍《企业应用架构模式》31 和《软件架构基础》32 尽管相隔近
    20 年，但它们以类似的方式描述了分层架构风格。


    这表明将应用程序的软件元素结构化为水平层，每一层都对应某个特定的技术维度，例如用户界面、业务逻辑和持久化。在用户界面层中，我们可以找到某些向用户展示信息的元素（Windows、HTML
    等），处理用户与设备（如鼠标、键盘或触摸屏）之间的交互。我们还在这一层中包含了允许我们暴露 HTTP 服务的软件元素（例如：REST）。虽然这种架构风格的不同层之间的通信通常是进程内的形式，但我们可以将这些层部署在不同的机器53
    上，并以进程间通信的形式进行通信。业务逻辑层我们必须其中结合验证、计算以及所有允许我们验证


    > *也称为。

    †https://blog.cleancoder.com/uncle-bob/2011/09/30/Screaming-Architecture.html


    我们正在建模的问题领域中存在的定义和规则。它还决定了从持久化层调用的服务。最后，持久化层包含了处理存储服务的接口和驱动程序的源代码。


    分层架构风格可以是封闭的，即每层只能访问紧邻下方的层；也可以是开放的，例如用户用户层访问持久化层。


    每种架构风格都会对我们施加某些规则。我们通常在检查这些规则时很松懈，最终导致一个充满“面条式代码”的应用程序。因此，为定义的架构规则（如上一节中所示的规则）建立一种验证机制至关重要。


    在下一节中，我们将逐步构建一个应用程序，以便我们能够理解这种架构是如何实现的。


    # 实现


    为了展示分层架构是如何实现的，我们将使用一个没有任何任何架构规则的现有小型应用程序。在这个学习过程中，我们将其重构为分层结构。


    这个被称为“RadioA”的应用程序用于广播电节目的操作部分。该广播电节目以特定的频率启动比赛。比赛在广播电节目期间进行推广，并标明条件和规则。听众必须发送电子邮件申请参加比赛，广播电员工使用“RadioA”应用程序为他们进行注册。


    为了持久化比赛的报名，我们定义了以下关系模式：


