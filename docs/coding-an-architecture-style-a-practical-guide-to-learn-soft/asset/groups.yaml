    ## 模块、层及其架构风格


    我读过的第一本软件设计书籍之一，也是最好的书籍之一，是 Robert C. Martin 在 2002 年出版的《敏捷软件开发$^{42}$》。除了介绍 SOLID
    设计原则（或我们在本书中定义的命名空间或模块）外，这些相同的原则后来由同一位作者在《整洁架构$^{43}$》中重新发布，不同之处在于他没有称它们为模块，而是称它们为组件，可能是为了与
    Simon Brown 的 C4 模型术语保持一致，Simon Brown 在书中（整洁架构）中撰写了一章。


    Robert C. Martin（Bob 大叔）提出了以下原则来确定如何将类分组到模块中：


    -   **重用-发布原则 (REP)：** 重用的粒度就是发布的粒度。这意味着为了特定目的而放在包、命名空间或模块中的某组可重用类也必须一起发布并进行版本控制。


    -   **公共封闭原则 (CCP)：** 包中的类应该针对相同的更改而共同封闭。影响一个包的更改会影响该包中的所有类，而不会影响其他包。这是包的单一职责。它与垂直分层的想法密切相关，即层级的垂直分区或水平分区；当有新需求时，必须修改所有位于同一层中的类。而在具有垂直分区的应用程序中，通常新需求会在同一个模块内（同一个分区内）产生更改。


    -   **公共重用原则 (CRP)：** 包、命名空间或模块中的类被一起重用。如果你使用了其中一个类，你就重用了了它们所有的类。所有被重用的类都必须在同一个包、命名空间或模块中。如果一个模块中将功能上不是为了相同目的而进行重用的类分在一起是错误的。因为特别需要某个额外功能的客户端将被迫依赖于所有其他功能。相反，我们应该为每个功能生成额外的模块，每个模块中的类在为了相同目的时被同时被重用。这在
    JDK 中就发生过。在 Java 之前，我们有一个单一的 `rt.jar` 模块，包含了实现任何 Java 应用程序的所有内容。如果你制作一个简单的 "Hello
    World" 应用，我们必须包含整个 `rt.jar`。在版本 9 中，JDK 根据此标准 (CRP) 进行了模块化和分区。现在开发者可以包含他们真正需要的模块。


    从上述内容可以很清楚，这些原则之间存在张力，主要是 CCP 和 CRP 之间。没有一种万能的解决方案。这正是我们做出决策并根据特定情况选择最合适标准的地方。CCP
    倾向于生成比 CRP 更少的模块，代码更多且不可重用。更改通常影响单个模块。CRP 倾向于生成更多、更小、更可重用的模块。同样，这取决于我们正在构建的软件类型和目的，以及要使用的标准。


