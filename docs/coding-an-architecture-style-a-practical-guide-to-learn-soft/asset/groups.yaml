    Continuing with the advantages:


    **Direction of dependencies**: I continue to have dependencies from the outside
    (infrastructure elements) to the inside (application). For this reason the architecture
    rule test continues to pass. Which allows to test my application (**radio.model**)
    completely isolated as Cockburn describes in his hexagonal architecture.


    **Transparent persistence**: I have the possibility to use the benefits of transparent
    persistence, lazy deleting, others, etc.


    It would be possible to use JPA or similar frameworks in the hexagonal style but
    we would have to have all the persistent classes inside the persistence layer,
    and an object model (non-persistent) inside the hexagon. However, I lose the transparent
    persistence that JPA offers me. This is where we must make a decision and be consistent
    in its implementation.


    Complete source code of this implementation can be found in github/inverted-layered.


    # Modular Architecture


    # Definitions and Style


    Splitting an application into modules is a complex design and architecture job
    that has been studied since the beginning of our profession. What criteria is
    to divide an application into modules? In 1971 David Parnas one of the most recognized
    works on this subject: On the criteria to be used in decomposing systems into
    modules⁴⁰ He mentions that the *effectiveness* of modularizing depends on the
    criteria we take to divide an application into modules. This, we will see a greater
    or lesser extent advantages in reducing complexity and improving maintainability.


    And what criteria should we use? It depends on what kind of application we are
    building. It is very different to build a library to be reused in several applications
    than to build an enterprise application¹¹. For example, building an enterprise
    application, designing modules that benefit overall system comprehension, reduce
    complexity, and also allow to assign work to development teams is more important
    than having high reusability.


    > *http://db.apache.org/jdo/

    †http://www.ooq.org/

    ‡http://www.querydsl.com/

    ¹¹https://github.com/enriquemolinari/inverted-layered'
- md: '## Modules, Layers and their Architecture Styles


    One of the first books I read on software design, and also one of the best, is
    Robert C. Martin''s book, Agile Software Development$^{42}$, published in 2002.
    In addition to presenting the SOLID design principles (or namespace or modules
    as we have defined in this book), these same principles are later re-released
    in the Clean Architecture$^{43}$ by the same author, with the caveat that instead
    of calling them, he calls them components, perhaps, to align with the terminology
    of the C4 model by Simon Brown, who wrote a chapter in the book.


    Robert C. Martin (Uncle Bob) proposes the following principles to determine how
    to group classes into modules:


    - **Reuse-Release Principle (REP):** The granule of reuse is the granule of release.
    Which means that a set of reusable classes in a package, namespace or module for
    a specific purpose must also be released and versioned together.


    - **Common Closure Principle (CCP):** The classes in a package should be closed
    together for the same kind of changes. A change that affects a package affects
    all the classes in that package and no other package. This is the single responsibility
    for packages. It is closely related to the idea of vertical partition, the partition
    in layers or horizontal; when there are new requirements, one has to modify classes
    that are all in the layers. While in an application with vertical partition, in
    general, the new requirements generate changes within the same module (within
    the same partition).


    - **Common Reuse Principle (CRP):** The classes in a package, namespace or module
    are reused together. If you use one of the classes you reuse them all. All the
    classes that are reused must be in the same package, namespace or module. It is
    a mistake to have a single module that groups classes with functionalities that
    are not reused for the same purpose. Because clients who require one of additional
    features in particular, are forced to depend on all the others as well. Instead,
    we should generate additional modules each with the classes being reused at the
    same time for the same purpose. This happened with the JDK. Before Java, we had
    a single rt.jar module where there was everything necessary to implement any application
    in Java. If you made a simple "Hello World" app, we had to include the full rt.jar.
    In version 9, the JDK was modularized and partitioned according to this criteria
    (CRP). Now it is possible for developers to include those modules that they really
    need.


    From the above, it is clear that there is a tension between these principles,
    mainly between CCP and CRP. There is no one-size-fits-all solution. This is where
    we make our decisions and select the most appropriate criteria according to our
    particular situation. CCP tends to generate fewer modules than CRP, with more
    code and not reusable. The changes generally impact a single module. CRP tends
    to generate more, small, reusable modules. Again, it depends on what type and
    purpose of the software we are building, the criteria to use.


    If we want to favor the CRP principle when structuring an application, we will
    probably end up designing a layered, modular application like the one shown in
    Figure 3.12.


    ![](img/9a234376112e1c13148524462ae6a2fd_75_0.png)


    Figure 3.12: CRP Modules


    If we intend to keep the complexity low of an enterprise application that we estimate
    is large and going to grow rapidly, we must think about modules created according
    to the CCP principle. Figure 3.13 shows a typical layered diagram partitioned
    into vertical modules, with CCP criteria.


    ![](img/9a234376112e1c13148524462ae6a2fd_76_0.png)


    Figure 3.13: CCP Modules, Vertical Partitions


    Using the CCP criteria we must identify the candidate functionalities to be implemented
    in different modules. Note that each vertical partition includes the persistence
    mechanism as well. Whether we use a relational model, or other data models, for
    example NoSQL, the modules must encapsulate their persistence mechanism. This
    means that the data and the decisions we make according to how to structure it
    are private to the module.


    We might also design applications that have modules created under both principles.
    We could, of course, structure applications in vertical modules, but at the same
    time, and with the aim of not duplicating code between them, write small reusable
    modules (CRP) that are used by the verticals.


    ## Implementation


    With new requirements and given the current success of the radio show, we decided
    to implement a modular architecture with vertical partition (CCP criteria).


    So let''s review the requirements we have and show the new ones:


    - Listeners can only register in a competition that has their registration open.

    - Those participants who register on the first day of registration will receive
    ten points, then can be exchanged for gifts.

    - **New**: Provide a way for listeners to authenticate and register themselves
    in a competition.


    **New**: Every time a listener registers in a competition the system must send
    them an email with the confirmation of their registration.


    Given the existing and new requirements we identify three modules. The **Competitions**
    module who will be responsible for managing competitions and registrations (including
    the points that the listener wins if they register on the first day of registration),
    the **UserProfile** module responsible for having the information of the listeners
    of the radio show and for providing an authentication service (among others).
    And finally the **Notifications** module responsible for sending emails when a
    listener registers in a competition.


    We can implement the modules using a single source code repository (in a single
    project), where we define different source folders, for each module or we can
    use a source code repository for each module (multiple projects). This discussion,
    which has advantages and disadvantages for both cases, is known as mono-repo and
    multi-repo. We will use a source code repository for each module.


    On the other hand, regardless of whether we choose mono-repo or multi-repo, we
    could use packages or namespaces to group classes that expose the module''s API
    and others packages or namespaces to use ArchUnit (or an Ant script) to validate
    that the dependencies between modules are exclusively through the public packages.
    But since we are using Java11, we are going to take advantage of the features
