    \ C\" archived in the api-of-c artifact. The latter is defined by the Path XML\
    \ element on line 16 and is included in the javac with the classpathref XML attribute.\
    \ By applying the same ideas to the rest of the packages we can achieve the verification\
    \ needed.\n\nAnother way to verify dependencies is by using a tool ArchUnit. Let's\
    \ see the next test cases:\n\n## Verifying Dependencies with ArchUnit\n\n```\n\
    @Test\npublic void packageApiOfcOnlyDependOnItOrJdk() {\n    JavaClasses jc =\
    \ new ClassImporter().importPackages(\"apiofc\", \"c\");\n    classes().that(\n\
    \        .resideInAnyPackage(\"apiofc\")\n    ).should(\n        onlyDependOnClassesThat(\n\
    \            .resideInAnyPackage(\"apiofc\", \"java..\")\n    ).check(jc);\n}\n\
    ```\n\n```\n@Test\npublic void packageOnlyDependOnApiOfCOrJdk() {\n    JavaClasses\
    \ jc = new ClassImporter().importPackages(\"apiofc\", \"c\");\n    classes().that(\n\
    \        .resideInAnyPackage(\"c\")\n    ).should(\n        onlyDependOnClassesThat(\n\
    \            .resideInAnyPackage(\"c\", \"apiofc\", \"java..\")\n    ).check(jc);\n\
    }\n```\n\nArchUnit has a very simple syntax and fluent API as you can see. The\
    \ first test case verifies that the classes in the API of C package depend only\
    \ on the JDK, and the second test case verifies that the classes in the C package\
    \ depend only on the API of C classes and on the JDK.\n\n*https://www.archunit.org/*\n\
    \n## Modules, Layers and their Architecture Styles\n\nIn this book we will mostly\
    \ use ArchUnit²⁹ to verify dependencies and architecture rules. Enforcing architecture\
    \ rules is the only way to avoid spaghetti code. Addition, if in the future we\
    \ needed, we will be able to move from a logical design to a physical one without\
    \ much effort.\n\n## Java Module System\n\nThe Java language in its version 9\
    \ has released a module system. By providing the syntactical construction you\
    \ can create modules that are basically a group of packages. Each module must\
    \ have a descriptor module-info.java used to define which packages are public\
    \ and which private accessible to other modules. Furthermore, each module must\
    \ indicate in its descriptor which packages it requires from other modules. Another\
    \ improvement it offers that all the dependencies of a module exist only within\
    \ its modulepath, without interfering with the dependencies of other modules,\
    \ contrary to what happens with packages and the classpath, where all the packages\
    \ of the same application share the same dependencies.\n\nThe rules we define\
    \ in the descriptors of the modules are verified at compile time and at run time.\
    \ If we structure the application of figure 3.1 using the module keyword of packages,\
    \ we would have guaranteed compliance with the architecture rules without the\
    \ need to use other tools.\n\nIt is not the intention of this book to explain\
    \ in detail the benefits of Java9 and its proposed module system, if you want\
    \ more detail you can read the excellent book by Sander Mak³⁰ However, we will\
    \ use it in depth towards the end of the chapter.\n\n## Horizontal vs Vertical\
    \ Partitions\n\nNow we know that we have namespaces, packages, modules (Java9)\
    \ or even applications to structure an application in modules or layers. Let's\
    \ continue with studying the differences between modules and layers and then we\
    \ implement their different styles.\n\n## Why Do We Split an Application?\n\n\
    When we talk about splitting an application into modules or layers, is with the\
    \ goal of giving structure to an application. An structure in such a way that\
    \ we can improve the modifiability quality attribute, which means to have clarity\
    \ of the changes we make impact.\n"
