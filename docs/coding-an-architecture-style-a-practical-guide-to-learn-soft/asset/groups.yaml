    \ to help enforce architecture rules.\n\nLet's see what options we have to be\
    \ able to enforce certain architecture rules and still have an application where\
    \ their modules communicate using just method calls (in-process communication).\n\
    \nThe first option would be to split with the logical separation into five different\
