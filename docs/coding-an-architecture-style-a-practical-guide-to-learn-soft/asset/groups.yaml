    # Modules vs Layers


    We use the same abstractions, the same syntactical constructions to define modules
    or layers within an application. These are the ones mentioned in the previous
    section, namespaces, packages, modules (Java9 and other languages) and also applications.


    One of the most important aspects to define is first whether we are going to make
    a horizontal or vertical partition. In general, when we talk about layers, we
    mean a horizontal partition of an application. That is, to divide an application
    to technical aspects, which are usually related to the user interface, business
    logic and data access. On the other hand, splitting an application divides it
    according to functional aspects, and for this we say modules and not layers. Classes
    that contain certain functionality in one module and certain classes that implement
    and solve other functionality grouped in another module. If someone outside the
    development team looked the module structure of a vertically partitioned application,
    they could identify the main functionalities of the system (and also your architecture
    will scream) their purpose as described by Uncle Bob† Whereas if it does in an
    application with horizontal partition it could not do. Perhaps they might notice
    that certain technical aspects are resolved by the development teams that handle
    such technology (front-end vs back-end developers as an example).


    Let''s see then the different structures and styles that allow us to split an
    application horizontally and vertically.


    # Definitions and Style


    The layered architecture style is probably the most widely used style, simplest
    to understand and apply at the same time. It is one of the oldest styles too.
    Two very good books, Patterns of Enterprise Application Architecture31 and Fundamentals
    of Software Architecture32, almost 20 years apart from each other, describe the
    layered architecture style in a similar way.


    This suggests structuring the software elements of an application as horizontal
    layers, where each layer is decorated to a certain technical aspect, such as the
    user interface, business logic and persistence. Within the user interface layer
    we can find certain elements for presenting information to users (Windows, HTML,
    etc.), handling the interaction between the user and devices such as the mouse,
    keyboards or touch screens. We also include in this layer software elements that
    allow us to expose HTTP services (Ex: REST). Whereas the communication between
    the different layers of this style of architecture is usually in the form of in-process,
    we could deploy the layers in different machines53 and make their communication
    in the form of inter-process. The business logic layer where we must incorporate
    validations, calculations and all those algorithms that allow us to verify


    > *Also called.

    †https://blog.cleancoder.com/uncle-bob/2011/09/30/Screaming-Architecture.html


    # Modules, Layers and their Architecture Styles


    the definitions and rules present in the problem domain that we are modeling.
    It also decides services from the persistence layer to invoke. Finally, the persistence
    layer contains source code that deals with the interfaces and drivers from the
    storage services.


    The layered architecture style can be closed, that is, each layer can only access
    the layer immediately below, or it can be open for example the user interface
    layer is allowed to access the persistence layer.


    Each architecture style imposes certain rules on us. We generally get relaxed
    about checking these rules and end with an application with spaghetti code. For
    this reason it is important to have a verification mechanism for the defined architecture
    rules, as those presented in the previous section.


    In the next section we are going to go by step building an application in such
    a way that allows us to understand how this architecture is implemented.


