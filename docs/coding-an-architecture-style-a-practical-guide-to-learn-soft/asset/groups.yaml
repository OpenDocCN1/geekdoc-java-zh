    # 引言


    ## 1. 引言


    1986年，弗雷德里克·布鲁克斯（Frederick Brooks）写了《没有银弹》，他在书中解释了不存在某种完美的解决方案（即“银弹”）来解决诸如复杂性这类软件开发中的本质困难。他将软件项目描述为狼人，因为它们刚开始看起来很熟悉，但最终会变得非常可怕。正如他所描述的，对于狼人你有银弹，但遗憾的是，软件项目并不存在解决方案。然而，他提到**伟大的设计师**是极有希望的解决方案之一。他说：“最好的设计师能产生更快速、更小、更整洁且投入精力更少的结构。”在
    във论文出版34年今天，对于软件开发者来说，构建**简单**的软件结构仍然是一个难以实现的目标。


    多年来，不同的术语相继流行，反映了软件开发者随着新需求的不断增加，对更新和维护代码的繁琐工作所产生的沮败。1997年，“大泥球”（Big Ball of Mud）这一说法变得流行，更早的时候，“意大利面代码”（spaghetti-code）一词也被使用。它指的是那些没有清晰结构定义、所有元素相互连接、且没有顺序或清晰规则的软件系统。这显然使得修改这些系统变得极其困难。


    1999年，出现了一个定义了这些见解的概念：软件熵³。这意味着软件系统在经过几年的维护和增加新需求后，变得非常难以修改。根据一般规律，当熵影响到软件系统时，就是那些沮丧的程序员开始考虑其他工作机会的时候了，因为在其中进行更改如此复杂，需要加班、占用工作时间之外并忽略日常生活的其他方面。另一方面，在预算允许的情况下，人们决定并行使用“最佳实践”或现代技术重新实现同一系统，从而开始向（几乎总是）不可避免的熵进行新的迭代。


    时光流逝，新名词层出不穷，但问题和复杂性依然如故。如何构建一个软件系统，使其允许我们在多年后对其进行修改而不会产生巨大的复杂性？


    在本书中，将介绍旨在回答这一问题的不同实践、概念和实现。


    我相信，对于每一个软件程序员、设计师或架构师来说，生产一个不会随时间推移而变得复杂的软件系统是一个高度诉求的（几乎无法实现的）目标。书中的大部分内容专门致力于防止软件熵战胜我们。


    ## 另一本关于软件架构的书？


    1994年，大卫·加兰（David Garlan）和玛丽·肖（Mary Shaw）¹写了一份关于软件架构作为一种新兴学科的重要性的技术报告。他们说：


    > 随着软件系统规模和复杂性的增加，设计问题已经超越了计算的算法和数据结构：设计和规范整个系统正成为一种新类型的问题。


    从那份技术报告到现在，已经出版了数十本关于软件架构的书。然而，其中大多数书籍都缺乏代码示例和实现。在这些书中，通常可以找到分层架构风格的解释并配有精美的图表，但没有提到如何在源代码中表示这些层，即它们是如何实现的。在我看来，这不是一个微不足道的遗漏。我认为有必要清晰地表达和说明可用于定义层及其边界的一系列语法构造。今天，属于相同范式的主流编程语言拥有一套非常相似的语法构造，我们可以利用它们使用任何语言来解释这些概念，并且它们可以以类似的方式应用于其他语言。


    ## 我将学到什么？


    当加兰教授和肖教授谈论设计和规范软件系统总体结构的困难时，他们提到了通信、同步和数据访问的协议。功能向设计元素的分配、物理分布、设计元素的组合、扩展性和性能。这是设计的下一个层次：软件架构。


    与该定义一致，下面的图片展示了同一个应用程序的四张图，旨在视觉化设计的下一个层级——架构：


    ## 引言


    ![](img/9a234376112e1c13148524462ae6a2fd_8_0.png)


    图 1.1：代码、设计与架构


    第一层是清晰的，软件使用具有特定语法和语义的编程语言编写，并处于特定的范式中。下一层抽象观察到了面向对象的设计，通过类设计表示出来。在这里再次没有产生疑问，我们谈论的是设计。第三层抽象开始出现一些问题：这是架构，还是设计？这个应用程序图到底代表了什么？我们是否有一种语法构造来将业务逻辑框和数据访问框映射到源代码中？目前我们说它代表了应用程序的分层结构，类根据它们是否与业务逻辑或数据访问相关被分组在每一层中。此外，业务逻辑依赖于数据访问层的某些类，而不是反之。在第四张也是最后一张图中，可以观察到比比上一个更高层次的抽象。在这种情况下，Calc
    应用代表运行时的应用程序，Database 代表运行时的持久化存储。箭头表示它们之间的进程间通信。


    本书致力于理解、描述和实现图 1.1 所示的最后两个抽象层级的软件结构。


    此外，在书中我们将回答这些问题：


    - 什么是软件？软件在哪里结束，架构在哪里开始？如何绘制系统的架构？如何用整洁架构概念设计系统？什么是层？模块又如何？物理和逻辑分离是什么？我真的在实现分层架构吗？如何验证架构规则已达成？单体架构是糟糕的做法吗？如何构建模块化架构？如何构建微服务架构？什么是高可用性？单点故障？如何扩展应用程序以支持增长的需求？


    本书并不包含对所有不同架构风格和模式的详细讨论。它致力于用 Java 研究我认为在企业应用中最常用的风格。另一方面，一旦理解了所介绍的概念，读者将能够毫不不便地处理书中未包含的其他风格。


    ## 这本书是给谁的


    这本书是写给软件开发者的。如果你也经历过维护具有意大利面代码的复杂程序的糟糕体验，并且每四周就要发布新功能，那么你将很好地理解良好架构的重要性。


    如果你具有开发者创建良好的面向对象设计的经验（基于《设计模式⁵》、《重构⁷》、《测试驱动开发⁸等书籍中的技巧），但对如何构建应用程序、识别不同结构、绘制应用程序结构产生疑问，或者突然发现自己处于架构师的位置，还需要可用性、性能、扩展性等方面问题，那么这本书就适合你。


    ## 注释


    - 1 《没有银弹：软件工程中的本质与偶然》，Frederick P. Brooks. 1986。

    - 2 《大泥球》，Brian Foote 和 Joseph Yoder，第四届模式语言会议，伊利诺伊州蒙蒂塞尔，1997。

    - 3 《敏捷程序员：从行者到大师》，Andrew Hunt, David Thomas。1999。

    - 4 《软件架构导论》，David Garlan, Mary Shaw。CMU 软件工程学院技术报告。1994。

    - 5 《设计模式：可复用面向对象软件元素》。1994。

    - 6 《整洁代码：敏捷软件之道手册》，Robert C. Martin.2008。

    - 7 《重构：改进现有代码的设计》，Martin Fowler.1999。

    - 8 《测试驱动开发：实例教程》，Kent Beck.2002。


