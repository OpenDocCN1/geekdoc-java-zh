    \n![](img/9a234376112e1c13148524462ae6a2fd_26_1.png)\n\n![](img/9a234376112e1c13148524462ae6a2fd_26_2.png)\n\
    \nFigure 3.2: Physical Separation\n\nFigure 3.2 shows each package now converted\
    \ in an application which means that each package now has its own source code\
    \ project folder with their dependencies. The packages API of B and API of C (typically\
    \ containing only interfaces), as shown in the figure do not depend on any other\
    \ package or third party libraries. Each of these projects generates an artifact\
    \ (jars in Java, assemblies in .NET, gems in Ruby, etc.), which will be part of\
    \ the dependencies of the other modules (applications) that require it.\n\nIn\
    \ the same figure we can see three more applications, for each remaining package:\
    \ A, B and C. Each one with its third-party dependencies and where they also include\
    \ the artifact generated by the API of B and API of C as part of their dependencies.\
    \ Finally, all the artifacts are deployed together, within the same environment\
    \ to start the application.\n\n## Modules, Layers and their Architecture Styles\n\
    \nUsing this way of building the application allow us to have only dependencies\
    \ as defined by figure 3.1 with solid arrows. Note that there is no possibility,\
    \ for module A to reference a class that belongs to module B. However, as a drawback\
    \ we are complicating the development environment, the build script and deployment.\n\
    \nThe other option, if we want to maintain the logical design - a single source\
    \ code folder structured using namespaces or packages - we should add a way to\
    \ verify that all the references between packages are valid. And this verification\
    \ must execute on every commit.\n\nHow can we do this?\n\nOne possible option\
