    # II 基础与实现


    # 3. 模块、层及其架构风格


    在本章中，我们将讨论第2章中属于模块/层的结构和架构风格。


    # 命名空间、包、层与模块


    在第2章中我们提到对应模块/层的元素应该映射到我们正在使用的编程语言中的语法结构。在小型应用程序中，我们使用类来构建应用程序。但随着代码复杂性和规模的增长，我们需要其他的语法结构来构建应用程序，以便看到更改的影响。


    为了将类分组到模块中，编程语言通常为我们提供所谓的**命名空间**（C#、PHP等）或**包**（Java）。通过包，我们可以根据某些标准对类进行分组，并定义规范它们之间关系的架构规则。关系指的是某些类对位于其他包中的类的依赖，这反过来导致包之间依赖的存在。


    # 逻辑分离与物理分离


    当我们使用命名空间或包来定义模块或层及其关系时，我们说它们之间存在逻辑分离。也就是说，其界限是由语法元素定义的，但在物理上，无论属于哪个命名空间，所有的类都位于同一个物理位置。这意味着我们可以从任何类引用任何其他包中的任何类。这也意味着仅供特定包（特定模块或层）使用的第三方库类可能也可以被其他包的类访问。


