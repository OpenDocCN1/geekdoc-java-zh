    # Monolithic and Distributed Architecture


    perform the communication asynchronously. For example, the message might be persisted
    in a queue where then another process will take care of it and send it to application
    B. Here we also need to deal with timeouts and the problems caused by the possibility
    of sending the same message more than once, but the advantage is that application
    A could continue executing and attending other requests.


    # Transactions


    In centralized systems, thanks to the transaction concept implemented by relational
    databases (and some NoSQL) we have the property atomicity guaranteed. In other
    words, if there are two operations to be carried out, both will executed or neither
    will do in the event that one of them fails. Databases that implement this free
    application developers from having to deal with this, which implies simpler software
    systems. In distributed systems, guaranteeing atomicity is somewhat complex. We
    call distributed transactions, when we involve two or more computers in operations
    that must be executed atomically. We could say that in distributed architectures
    we have two variants where we need to guarantee atomicity, one more complex than
    the other.


    The first occurs when we need certain information stored in a database to be replicated
    to other databases. Relational databases have built-in mechanisms to carry out
    this type of work (master/slave replication) or in case we are talking about databases
    with different data models because they belong to different applications, we could
    use publish/subscribe mechanisms to de replications. In general, data replication
    is done asynchronously, so as not to delay the end users while the information
    is copied. This produces what is called eventual consistency. That is, at some
    point the databases will be consistent.


    The second variant, and more complex, occurs when we need to update different
    information that resides in different databases atomically. For example, suppose
    a Web application that takes hotel rooms reservations. To confirm the reservation,
    first we must validate the customer''s credit card is valid, then generate the
    invoice and send it by email. These three actions occur in different applications
    and must be performed atomically. To achieve this is a technique called Sagas.
    Basically, the saga consists of a sequence of transactions T₁, T₂, ..., Tₙ, where
    each transaction T₁ is associated to a compensating transaction C₁ which is executed
    in case a rollback is required. Figure 4.5 illustrates this concept.'
