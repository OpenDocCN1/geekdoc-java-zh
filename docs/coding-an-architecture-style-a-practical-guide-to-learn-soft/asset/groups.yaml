    # Other Issues Affecting Availability


    There are others factors that affect the availability of a system. One is the
    environment, for instance, power outages, fires, earthquakes and other similar.
    To have a low MTTR in these cases, it is required to replicate the entire data
    center in a remote location. The other factor that affects availability more frequently
    are human errors. When we carry out any type of software upgrade, reconfigure
    servers or network equipment, or deploy new versions of applications, there is
    a risk of making mistakes. Automating manual tasks helps to decrease human errors.
    Perform the actions in low environments before doing it in production too.


    Finally, to be prepared for a possible failure during deploying new application
    releases to production, it is extremely important to design the systems in such
    a way that it is possible to go back to the previous version in a simple way.
    If every time we deploy a new version of the system in production it is possible
    to go back to the previous version, then the MTTR will always be low in these
