    # 5. 可用性


    ## 引言


    你可能听过某个系统具有高可用性，或者其可用性为“五九”（99.999%）。但这意味着什么呢？可用性是什么？它可以被计算吗？让我们从回答这些问题开始。


    如果一个系统在接收到请求后按照规范执行，那么它就是可用的。由于可能导致系统不可用的原因无法预知，因此系统的可用性定义为系统在给定时间内处于运行状态的概率。由此得出了用“9”的个数来指定系统可用性的原因。如果我说一个系统的可用性为
    99.9%，我实际上表达的是，在一年中它会有 8.76 小时的不可用时间。我是如何得到这个结果的？99.9 / 100 = 0.999。通过 365 * 0.999
    = 364,635，我得到了系统一年可用的天数。换句话说，一年中不可用的时间为 365 - 364,635 = 0.365 天。如果我们用 0.365 *
    24，就得到每年 8.76 小时的不可用。根据“9”的个数进行这些计算，我们可以知道系统的总不可用时间，如下表所示：


    | 可用性 | 9 | 停机时间 |

    | :--- | :--- | :--- |

    | 90% | 一 | 36.5 天/年 |

    | 99% | 二 | 3.65 天/年 |

    | 99.9% | 三 | 8.76 小时/年 |

    | 99.99% | 四 | 52 分钟/年 |

    | 99.999% | 五 | 5 分钟/年 |

    | 99.9999% | 六 | 31 秒/年 |


    高可用系统是指可用性达到“五九”或更高的系统。现在，我们需要理解如何计算系统中某个元素的可用性，以便稍后能够计算整个系统的可用性。


    ## 计算可用性


    系统元素的可用性是通过使用其两次故障之间的平均工作时间（MTBF）和故障后的平均修复时间（MTTR）来计算的，公式如下：可用性 = MTBF / (MTBF+MTTR)


    从这个公式我们可以看到，MTBF 越高，可用性就越高。同样，我们处理故障的速度越快，可用性就越高。MTBF 和 MTTR 的单位是小时。


    我如何知道系统中某个元素的 MTBF 是多少？


    对于**硬件元素**，MTBF 可以从制造商处获得，MTTR 可以从我们的支持与基础设施团队或我们签订合同的服务商处获得。硬件故障通常需要更换组件。理解硬件的
    MTTR 涉及多个因素。更换损坏的网卡或其他网络元素与更换损坏的磁盘是不同的。在后者情况下，它取决于我们是否已经准备好了可用的数据副本，或者我们必须恢复备份。此外，发生的时间时刻也会影响结果，是在正常工作时间内还是在周末。这取决于我们如何组织此类事件的处理。例如，KLM$^{60}$
    中的 MTTR 值为 4 小时。


    硬件故障通常用浴缸曲线描述。也就是说，在硬件元素的寿命初期，故障概率通常很高；在正常生命周期内，故障概率非常低；而在其使用寿命结束时，由于特性退化，故障概率会很高。如图
    5.1 所示。


    ![](img/9a234376112e1c13148524462ae6a2fd_123_0.png)


    图 5.1: 浴缸曲线


    软件元素的 MTBF 计算涉及多个因素，如其复杂性、规模（KLOC）、开发团队的经验以及花费在测试上的时间（列举最重要的几个）。要进行此计算，必须观察应用程序在特定时间内的行为，并测量其故障。这对于某些成功的应用程序并不容易，因为它们的变更频率很高。MTTR
    通常是重启应用程序所需的时间，通常这个时间很短。例如，Cisco⁷7$，对于近期有更改或新功能的产品的假设其 MTBF 为 10,000 小时，对于稳定产品
    MTBF 为 30,000 小时。在这两种情况下，它们都假设 MTTR 为 0.1 小时（重启需 6 分钟）。


    获取系统每个元素的可用性后，我们可以计算其总可用性。假设图 5.2 中的部署图所示：


