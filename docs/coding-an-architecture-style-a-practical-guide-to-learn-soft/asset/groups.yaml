    # 可扩展性


    如果会话在服务器上创建，但下一个请求被发送到另一个服务器，系统将认为用户尚未身份验证，从而将其重新定向到登录界面。这通过配置具有粘性会话（sticky session）或会话亲和性（session
    affinity）机制负载均衡器来解决。该机制将每个会话标识注册在创建它的服务器上，以便将用户重定向到创建会话的服务器。


    扩展 Web 应用的另一种避免引入亲和性机制的方法是将会话存储从应用服务器移出。大多数 NoSQL 数据库（主要是开源的）使得这成为当今的解决方案。分类键/值*、内存型且高可用（部署在集群中）的数据库部署图显示了两个应用服务器使用一个
    Redis† 来存储会话数据。


    > *https://en.wikipedia.org/wiki/Key–value_database

    †https://redis.io/


    ![](img/9a234376112e1c13148524462ae6a2fd_133_0.png)


    图 6.1: 有状态 Web 应用的扩展 - 部署图


    图 6.2 显示了无状态 Web 应用部署。


    ![](img/9a234376112e1c13148524462ae6a2fd_134_0.png)


    图 6.2: 无状态 Web 应用的扩展 - 部署图


    在两种情况下，扩展的方法都是简单的，只需添加更多的应用服务器，在有状态部署的情况下添加更多的 Redis 实例即可。


    # 数据库扩展


    数据库扩展之所以复杂，主要是因为我们必须将数据分布在多台计算机上，这导致我们必须处理之前提到的分布式系统的复杂性。关系型数据库及其基础属性（如 ACID 事务）设计为在单台集中式计算机上运行，那个时代还没有考虑过需要满足“行星级”应用所带来的需求的容量。Google
    和 Amazon 这样的公司不得不设计自己的数据库，本质是为了能够在全球范围内扩展并响应它们的需求。因此，第一批 NoSQL 数据库诞生了。


    因此，我们可以说，关系型数据库的设计是为了保证一致性和原子性等。它们为我们提供了简单的机制来使用，让开发者无需处理这些问题。然而，它们没有为我们提供实现高可用或扩展的简单机制。另一方面，NoSQL
    数据库确实赋予了我们不费太大精力就能实现高可用扩展的能力，它们是为此而设计的。但它们是以牺牲一致性为代价的。


    让我们先从分析分布式数据库的核心问题开始，然后继续查看允许扩展数据库的各种选项。


    # CAP 和 PACEL 定理


    我们提到过可以通过分布数据来实现高可用性和可扩展性。我们还提到过，为了实现这一点必须牺牲一致性。CAP（以及 PACEL）定理解释了为什么会发生这种情况。CAP
    定理表明，在**网络中断**时，我们必须在提供一致性或可用性之间做出选择（但不可兼得）。CAP 代表以下属性：


    - 一致性（Consistency）：每次读取都将接收到最近写入操作的值。

    - 可用性（Availability）：无论单个节点的状态如何，每个请求都能得到（非错误的）响应。

    - 分区容错性（Partition Tolerance）：无论由于网络中断导致节点之间的消息丢弃或延迟，系统都不会崩溃。


    如图 6.3 所示，假设两个数据库 A 和 B 通过网络连接，它们都存有一条记录 $X=50$。在某个时刻，网络发生故障，数据库之间的连接被中断。想象在这种状态下，一个写入请求到达数据库
    A 以为 X 赋值 100，另一个写入请求到达数据库 B 以获取 X 值。此时系统有两个选择：在 A 和 B 中都执行这两个请求，返回 X 的旧值，这提供了可用性但没有提供**一致性**；或者返回错误以提供一致性，因为新的
    X 值无法从 A 传递到 B，从而失去了**可用性**。


    ![](img/9a234376112e1c13148524462ae6a2fd_135_0.png)


    图 6.3: CAP 定理


    因此，分布式数据库通常被分类为 **CP** 或 **AP**，取决于在网络故障发生时保证哪种属性。


    重要的是，在 CP 或 AP 之间进行选择仅在发生网络中断时才有意义，而这种情况并不发生。只要系统正常运行，这两个属性（一致性和可用性）都可以得到保证。因此，CAP
    定理有一个扩展称为 PACELC，它的内容如下：


    1. 当发生网络中断（P）时，我们必须决定是提供可用性（A）还是提供一致性（C）。

    2. 但当系统正常运行（Else）时，必须在低延迟（Latency）和一致性（Consistency）之间进行选择。


    也就是说，在正常（无网络分区）情况下，写操作可以被延迟直到更改同步到整个系统，这具有较高的延迟但保证了一致性（EC）。或者以不一致性为代价获得最小延迟（EL）。


    通过这种方式，分布式数据库可以按以下方式分类：


    - AP/EL：在网络分区（P）时优先考虑可用性（A），在正常情况下优先考虑低延迟（EL）。

    - AP/EC：在网络分区（P）时优先考虑可用性（A），在正常情况下优先考虑一致性（EC），并延迟写入。

    - CP/EL：在网络分区（P）时优先考虑一致性（C），在正常情况下优先考虑低延迟（EL）。这种配置可能并不真的被使用。

    - CP/EC：在网络分区（P）时优先考虑一致性（C），在正常情况下优先考虑一致性（EC），并延迟写入。


    # 扩展读取


    通常情况下，应用程序接收到的读取操作多于写操作。因此，如果我们检测到瓶颈在数据库（而不是应用程序），扩展数据库最简单的方法就是扩展读取操作。


    大多数数据库都内置了复制机制。这允许我们使用一个数据库仅处理写操作，而使用其他数据库处理读操作。这样，我们将负载分布到多个数据库服务器上。这在图 6.4 中所示。


    ![](img/9a234376112e1c13148524462ae6a2fd_137_0.png)


    如图 6.4 所示，有两个应用服务器将所有写操作发送到节点 node-b，即主数据库。主数据库将复制到只读副本（node-b1 和 node-b3）。这种数据库配置被称为主从模式（master/slave）。


    如果从主到从的复制是同步的，我们拥有 EC 的分布式配置；如果是异步的（如图 6.4 所示），则是 EL。另一方面，为了让应用程序将所有读取操作发送到从数据库（node-b1
    和 node-b3），需要某种负载均衡机制（node-lb2），如图 6.4 所示。


    假设我们的主数据库是关系型的，通过其他复制机制如数据捕获*，我们可以通过复制到 NoSQL 数据库（内存或磁盘）来扩展读取操作。这需要一些额外工作（因为关系型提供的复制机制仅适用于相同的模型），但如果我们需要只有
    NoSQL 数据库才有的功能，这是必要的。


    注意，在这种配置下，读取操作可以无限扩展，根据需要添加新的读取副本即可。我们将主数据库从读取操作引起的负载中释放出来，并将该负载分布到多个副本中。


    如果我们检测到瓶颈在主数据库上（因为有大量的当前写操作），我们必须查看不同的选项：存在一种主主模式（master/master）的复制配置，所有节点都接收写操作并相互复制。但这种配置无法扩展写操作，因为它们接收的请求数量相同，不存在负载均衡。尽管它们确实可以提高可用性。扩展写操作唯一的方法是使用分片（Sharding）。


    # 分片：扩展写入


    扩展写操作唯一的方法是对数据进行水平分区。这样某些记录集位于一个数据库服务器，其他记录集位于另一个数据库服务器。这被称为分片（Sharding）。


    图 6.5 显示了实现分片的现有方法之一称为范围分区（range partitioning）。你可以看到三个数据库根据属性 id 的值存储人员信息。这些数据库中的每一个被称为一个分片。应用程序需要存储范围与包含该范围内人员数据库之间的映射，以便在每次读取或修改信息的操作时识别要访问哪个分片。


    > *https://en.wikipedia.org/wiki/Change_data_capture


    '
