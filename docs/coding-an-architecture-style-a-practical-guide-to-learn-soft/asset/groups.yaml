    ## 2. Software Architecture: Fundamentals


    In this chapter we cover fundamental concepts of software architecture. We begin
    with those definitions that will allow us to provide theoretical support to later
    understand the following chapters. We will define software architecture, how it
    is represented in a diagram for analysis, and how it differs from software design.
    We will study the different levels of abstraction with which we represent different
    views of the same application, analyzing the proposals of different authors.


    ## What is Software Architecture?


    If you have read more than one book or article on software architecture you will
    know that there is not a single definition of software architecture. However,
    some important words of each definition are common to the many ones. I consider
    most important is structure. Let''s review a simple and clean definition of software
    architecture that will guide the rest of this book.


    Software Architecture defines and establishes how a software product or system
    is structured. The structure comprises software elements, their properties and
    the relationships between them. We call software element to any piece of software
    that could range from a function, procedure, class, module, layer and applications,
    data repositories, execution environments (web servers, containers, etc.), API
    gateways, queue systems, etc.


    As you can see, there is a long list of software elements that are used to structure
    a system. For the moment, let''s understand that these elements are what we use
    to express the architecture of a system, that is, to express its structure. We
    will later discuss its use in detail.


    So, why is it important to understand and visualize the structure of a system?
    Mainly to be able to understand what architectural characteristics a software
    system has or what characteristics we want to give a software system. In the design
    of any system there are functional requirements that specify the functionalities
    that the system must provide, but architects (and developers as well) must bear
    in mind factors when designing a system. These factors are presented as quality
    attributes¹⁰. To mention of these:


    - Monitorability: Does the system offer options to verify its status? How simple
    is it to do it?

    - Scalability: How can the system respond to an increase in the demand?

    - Availability: If any software element of the system fails, is the end user still
    getting responses from the system?

    - Maintainability: How simple is it to migrate from one database vendor to another?
    When I need to make a change, is it clear that those changes are going to impact?


    ## Software Architecture: Fundamentals


    Quality attributes are also known as non-functional requirements or architecture
    characteristics¹¹¹. Throughout part II of this book we will study software structures
    whose objective is to promote maintainability. In part III we will study other
    quality attributes like scalability and availability.


    ## Visualizing Software Architecture


    We describe the software architecture of a system by drawing its elements and
    the relationships between them. We draw the software elements, for example, as
    rectangles and relationships with arrows. What do these rectangles represent?
    Running applications? classes? modules? And the arrows? compile dependencies?
    runtime dependencies? Let''s look at the next architecture diagram.


    ![](img/9a234376112e1c13148524462ae6a2fd_11_0.png)


    Figura 2.1: Architecture: Runtime Elements


    I have said, in the previous chapter, that in this diagram Calc Application element
    represents the application at runtime and the Persistence element represents the
    persistent storage unit at runtime as well. Here we mention a very important point
    of the diagram. It is a diagram that represents a software system at runtime.
    But what kind of application is it? Is it web, desktop, mobile? Is the persistent
    storage a relational database? Let''s improve the diagram a bit more.


    ![](img/9a234376112e1c13148524462ae6a2fd_12_0.png)


    Figura 2.2: Architecture: Runtime Elements


    Now, we can see that it is a Web application running on an Apache Web Server.
    Use PDO to communicate with an instance of PostgreSQL through the port 6548. This
    is a diagram representing the architecture of an application at runtime. With
    this diagram we could analyze certain quality attributes that we will see in detail
    later. In principle it shows us to verify the health of the system we must monitor
    an Apache service and a PostgreSQL service. An important source of information
    for the operations team.


    Now you might wonder, where is the MVC structure represented in that diagram?
    The answer is that it is not. To represent that, we need another diagram, like
    the one shown below.


