    # Modules, Layers and their Architecture Styles


    notifications*, github/radioa-userprofile† and github/radio-main‡.


    We will start with the UserProfile module:


    # UserProfile Module Descriptors


    ```

    module radioa userProfile {

    exports userProfile model.api;

    provides model.api.RadioListeners with persistence.RadioListenersProvider;

    provides model.api.UserAuth with persistence.UserAuthProvider;

    // requires

    requires java.sql;

    }

    ```


    In the UserProfile descriptor we can see that this module exports all the public
    interfaces of the model.api sub-package (if you package protected interfaces they
    won''t be exported). model.api is a sub-package that only contains interfaces
    (ports of the hexagonal architecture). This means that whoever depends on this
    module will be able to access the classes (if only these interfaces) defined.
    On the other hand, the implementation of model.api.RadioListeners and model.api.UserAuth
    interfaces are provided through the RadioListenersProvider and UserAuthProvider
    factories, which the statement provides (lines 3 and 4). One of the benefits offered
    by the Java+ module system is that it allows clients of modules to consume services
    exposed by modules just referencing the public interfaces (without depending on
    implementation classes). This can be done by using the ServiceLoader class (later
    we will show how it is used). Finally, we have the necessary dependencies for
    this module, defined by the requires statement, in this case java.sql among others,
    to be able to use a relational database as a persistence mechanism.


    Let''s go on to the services this module offers and its data model.


