  md: '# # 4. Monolithic and Distributed Architecture


    In this chapter we will look at monolithic and distributed structures and their
    styles.


    # ## Monolithic Architectures


    # ## Definitions


    First I would like to clarify that a monolithic architecture does not mean spaghetti
    code. With the growth of Microservice architecture it seems (and also helped by
    some authors) that monolithic architectures are now an anti-pattern or a bad practice.
    The only bad practice in all of this is spaghetti code. Every architectural decision
    has advantages and disadvantages. "Everything in software architecture is a trade-off"


    We call monolithic architecture (a term that takes prominence with the arrival
    of Microservices) to an application that is deployed in a single deploy unit,
    running in a single process where its elements communicate in the form of in-process.
    While in distributed architectures the application is deployed with several deploy
    units, each one running in its own process and they communicate with each other
    in the form of inter-process (IPC).


