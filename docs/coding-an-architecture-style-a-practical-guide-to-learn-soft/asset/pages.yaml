    In 2.5 we see three different diagrams belonging to the first three levels of
    abstraction of the C4 model. Three different views of the system. Starting at
    level 1, with the context diagram. You can see the "Web Bank System" and its dependencies
    with external systems, in this case mainframe. At level 2, we go in more detail
    on the "Web Bank System", we have the container diagram. There we see a Single-Page
    application running in a browser, which consumes services from an API Application
    (SpringMVC) whose execution environment is a Tomcat instance. The latter consumes
    services from the external system (the mainframe) and accesses a PostgreSQL database.
    The third and last level of the figure shows the component diagram of the API
    Application container. Note that the "zoom +" is performed on particular container.
    The box that represents the Security component is a package or namespace, whose
    public interface is consumed by the Signup Controller component. In the Clean
    Architecture written by Simon Brown he explains his proposal about splitting classes
    by component.


    Finally, there are several interesting tools that we use to generate the diagrams
    from the C4 model. We mention some of these tools, Archimate, C4Builder, Structurizr,
    and PlantUML.


    # Conclusion


    There are different proposals with notations to structure and visualize software
    architectures. However, it is possible to find a common criteria among them, which
    are what we will use in this book. The objective of this book is regardless of
    the terminology used, we can recognise the different structures to define the
    architecture of a system and how to represent it using diagrams.


    The structures that we will use in this book are:


    **Modules/Layers:** We refer to software elements that map to one with defined
    abstractions syntactic constructions such as classes, packages, namespaces or
    modules in the programming language we are using.


    It is very important to understand that these diagrams must reflect the reality
    of the system. This tends to deviate when there is an application built without
    architecture rules defined, which without exception leads to spaghetti code. When
    we show to the structures "architecture" of the system, we draw boxes showing
    a structure that doesn''t map to our reality in source code.


    **Containers:** Applications or data stores at runtime, defined by the C4 model
    (not to be confused with Docker). Typically, containers run within an environment
    (web server, virtual machine, etc.) in their own process and communication with
    other containers is in the form of inter-process communication (IPC). While typically
    the communication between modules or layers is in the form of in-process


    **Deployment:** Here we identify the physical, virtual and / container machines
    (now, Docker), where the software elements (which we have identified in the previous
    architecture level) are going


