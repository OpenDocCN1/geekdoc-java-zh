    Figure 4.4: Too much time processing


    In the scenarios illustrated in figure 4.3 and 4.4 the application A will try
    to send the message again, due to the reception was not confirmed. This situation
    is described as **exactly-once semantics**. Here it is important to understand
    what effects produce on the system that a message might be sent more than once.
    Perhaps the message is simple to send an email and if it is sent twice with the
    same content is not important. Or perhaps the message is to make a debit from
    a bank account with which we need to be sure that it will not happen more than
    once.


    Understanding the consequences of **partial failures** allows us to design applications
    knowing that the same message might sent more than once. One way to deal with
    this is to make services **idempotent**, if they are executed more than once with
    the same inputs, they do not produce any other effect than the one produced the
    first time. The other way to handle it is as **deduplication**, where each message
    is a unique identifier. With each forwarding of the same message the same identifier,
    the receiver could check if the message was already received to discard it if
    that was the case.


    In a **synchronous** communication model, like the one illustrated in the previous
    figures, application A, after sending the message, waits for a response. It only
    continues the execution if it receives a response from application B or the configured
    timeout elapsed.


    If we wanted to prevent application A from waiting for a response from application
    B, we should'
