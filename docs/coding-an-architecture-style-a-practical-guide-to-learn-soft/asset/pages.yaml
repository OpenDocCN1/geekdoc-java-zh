  md: '# Modules, Layers and their Architecture Styles


    One of the first books I read on software design, and also one of the best, is
    Robert C. Martin''s book, Agile Software Development$^{42}$, published in 2002.
    In addition to presenting the SOLID design principles, or namespace or modules
    as we have defined in this book). These same principles are later re-released
    in the Clean Architecture$^{43}$ by the same author, with the caveat that instead
    of calling them, he calls them components, perhaps, to align with the terminology
    of the C4 model by Simon Brown, who wrote a chapter in the book.


    Robert C. Martin (Uncle Bob) proposes the following principles to determine how
    to group classes into modules:


    +   **Reuse-Release Principle (REP):** The granule of reuse is the granule of
    release. Which means that a set of reusable classes in a package, namespace or
    module for a specific purpose must also be released and versioned together.


    +   **Common Closure Principle (CCP):** The classes in a package should be closed
    together the same kind of changes. A change that affects a package affects all
    the classes in that package and no other package. This is the single responsibility
    for packages. It is closely related to the idea of vertical partition, the partition
    in layers or horizontal, when there are new requirements, one has to modify classes
    that are all in the layers. While in an application with vertical partition, in
    general, the new requirements generate changes within the same module (within
    the same partition).


    +   **Common Reuse Principle (CRP):** The classes in a package, namespace or module
    are reused together. If you use one of the classes you reuse them. All the classes
    that are reused must be in the same package, namespace or module. It is mistake
    to have a single module that groups classes with functionalities that are not
    reused for the same purpose. Because clients who require one of additional features
    in particular, are forced to depend on all the others as well. Instead, we should
    generate additional modules each with the classes being reused at the same time
    for the same purpose. This happened with the JDK. Before Java, we had a single
    rt.jar module where there was everything necessary to implement any application
    in Java. If you made a simple "Hello World" app, we had to include the full rt.jar.
    In version 9, the JDK was modularized and partitioned according to this criteria
    (CRP). Now it is possible for developers to include those modules that they really
    need


    From the above, it is clear that there is a tension between these principles,
    mainly between CCP and CRP. There is no one-size-fits-all solution. This is where
    we make our decisions and select the most appropriate criteria according to our
    particular situation. CCP tends to generate fewer modules than CRP, with more
    code and not reusable. The changes generally impact a single module. CRP tends
    to generate more, small, reusable modules. Again, it depends on what type and
    purpose of the software we are building, the criteria to use.


    If we want to favor the CRP principle when structuring an application, we will
    probably end up designing a layered, modular application like the one shown in
    Figure 3.12.'
