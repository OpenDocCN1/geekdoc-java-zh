  md: '# Another Book about Software Architecture?


    In 1994 David Garlan and Mary Shaw¹ wrote a technical report on the importance
    of software architecture as an emerging discipline. They said:


    > As the size and complexity of software systems increases, the design problem
    goes beyond the algorithms and data structures of the computation: designing and
    specifying the overall system emerges as a new kind of problem.


    Since that technical report to today dozens of books on software architecture
    have been published. However, most of them lack code examples and implementation.
    It is usual to find in these books the explanation of the layered architecture
    style with a beautiful diagram, but no mention is made of how to represent the
    layers in source code, that is, how they are implemented. From my point of view,
    this is not a minor omission. I think it is necessary to clearly express and exemplify
    the set of syntactical constructions that can be used to define a layer and its
    limits. Today, mainstream programming languages that belong to the same paradigm
    have a very similar set of syntactical constructions that we can use, with which
    it is possible to explain these concepts using any language and it will be applicable
    in an analogous way to any other.


    # What Will I Learn?


    When Professor Garlan and Professor Shaw talk about the difficulties of designing
    and specifying the general structure of a software system, they mention protocols
    for communication, synchronization, and data access. Assignment of functionality
    to design elements, physical distribution, composition of design elements, scaling
    and performance. This is the next level of design: the software architecture.


    In line with this definition, the following image shows four diagrams of the same
    application with the intention of visualizing that next level of design, the architecture:'
