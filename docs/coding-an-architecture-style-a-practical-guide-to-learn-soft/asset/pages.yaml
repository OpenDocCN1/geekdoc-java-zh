    Note that the Competitions module is responsible for the competitions and inscriptions,
    but the data of the listeners is kept in the UserProfile module. It also publishes
    the model.Notification interface (SPI), so that the Notifications module can implement
    and provide the service.


    Remember that one of the new requirements is when a listener is registered in
    a competition an email must be sent with the confirmation. The logic for registration
    is implemented in the Competitions module, but we decided to put the implementation
    for emails in another module. In the future we could have other events where notifications
    of some kind are made from any other module. And it might also be possible that
    technical decisions about how to implement the notification will change.


    At some point we had decide whether Notifications should depend on Competitions
    or Competitions on Notifications. And as you saw we have decided to make the Notification
    module dependent on the Competition module. Whenever possible it is better to
    separate the abstractions from the implementations, that is, place the abstraction
    in the client which in this case is the Competitions module and implement it in
    other module for us is the Notifications module. This gives us maximum flexibility,
    because it allows us to easily change the implementation of how a notification
    is sent without modifying or redeploying the Competitions module. On the other
    hand, the Competitions module implements a key part of the application, while
    Notifications has to do with a technical aspect of how the notification will be
    done. It is the same criteria used in the hexagonal architecture where technical
    details depend on business abstractions.


    Whenever we can, the abstractions should go in the client, who uses the service,
    while their implementation should go in another module, package or namespace.
    These abstractions are what we call SPI (service provider interface). This is
    also mentioned in Kirk Knoerschn’s book about modular architecture⁷, as a pattern
    called "Separate Abstractions".


