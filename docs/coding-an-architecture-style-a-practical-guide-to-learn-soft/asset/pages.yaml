    Figure 3.13: CCP Modules, Vertical Partitions


    Using the CCP criteria we must identify the candidate functionalities to be implemented
    in different modules. Note that each vertical partition includes the persistence
    mechanism as well. Whether we use a relational model, or other data models, for
    example NoSQL, the modules must encapsulate their persistence mechanism. This
    means that the data and the decisions we make according to how to structure it
    are private to the module.


    We might also design applications that have modules created under both principles.
    We could, of course, structure applications in vertical modules, but at the same
    time, and with the aim of not duplicating code between them, write small reusable
    modules (CRP) that are used by the verticals.


    # # Implementation


    With new requirements and given the current success of the radio show, we decided
    to implement a modular architecture with vertical partition (CCP criteria).


    So let''s review the requirements we and show the new ones:


    +   - Listeners can only register in a competition that has their registration
    open.

    - Those participants who register on the first day of registration will receive
    ten points, then can can be exchanged for gifts.

    - New: Provide a way for listeners to authenticate and register themselves in
    a competition.'
