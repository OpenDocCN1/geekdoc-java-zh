    # # 4+1 View Model


    One of the first proposals was published in 1995 by Philippe Kruchten, with his
    model called 4+1¹¹. The model presents four different views, plus one called Scenarios
    that illustrate the system. Each view allows to analyze different issues of the
    system and each one is intended for different stakeholders. The following figure
    illustrates the different views as expressed by Kruchten''s work.


    ![](img/9a234376112e1c13148524462ae6a2fd_14_0.png)


    Figure 2.4: 4+1 View Model


    In the figure 2.4, we can see that there is a logical view which is intended for
    end users. The diagrams in this view focus on presenting the functionalities offered
    by the system using, for example, class diagrams or entity-relationship diagrams.
    It is important to note that only those important classes exist in the diagram
    or in case of very large systems, it could be necessary to generate abstractions
    that group classes into categories.


    Then we can see the process view. By process they referring to the software elements
    at runtime, which can be stopped or started. This view is equivalent to the one
    presented in the figure 2.1.


    The development view raises diagrams of layers, modules and subsystems in a way
    that allows us to direct functional requirements to specific modules, layers or
    subsystems. At the same time, we have different development teams, it helps us
    in planning the software project, assigning each'
