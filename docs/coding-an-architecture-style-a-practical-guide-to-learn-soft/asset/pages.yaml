  md: '# Introduction


    ![](img/9a234376112e1c13148524462ae6a2fd_8_0.png)


    Figure 1.1: Code, Design and Architecture


    The first level is clear, software is written using programming languages with
    specific syntax and semantics, within a specific paradigm. The next level of abstraction,
    an object-oriented design is observed, expressed in a class design. Here again,
    no doubt arises, we are talking about design. The third level of abstraction is
    where some questions begin to appear: is this architecture, or is it design? What
    exactly does this application diagram represent? Can we have a syntactic construction
    to map the Business Logic and Data Access boxes into source code? For now we say
    that it represents the layered structure of the application, where classes are
    grouped in each layer according to whether they are related to business logic
    or data access. Where in addition, the business logic depend on some classes of
    the data access layer, and not the other way. In the fourth and last diagram it
    is possible to observe a higher level of abstraction than the previous one. In
    this case, Calc application represents the application at runtime and Database
    represents the persistent storage at runtime. The arrow indicates an inter-process
    communication between them.


    This book is dedicated to understand, describe, and implement software structures
    that belong to the last two levels of abstraction illustrated in figure 1.1.


    In addition, in this book we will answer these questions:


    What is software? Where does end and architecture begin? How to draw the architecture
    of a system? How to design a system with clean architecture concepts? What are
    layers? What about modules? What is physical and logical separation? Am I really
    implementing a layered architecture? How can I verify that the architecture rules
    are accomplished? Are monolithic architectures a bad practice? How can I build
    a modular architecture? How can I build a Microservice architecture? What is high
    availability? Single point of failure? How do you scale an application to better
    support growing demand?


    This book does not include detailed discussions of all the different styles and
    patterns of architecture'
