    # Who Is This Book For?


    This is a book for software developers. If you also have gone through the bad
    experience of maintaining a complex application with spaghetti code and in which
    turn required releases with new features every four weeks, then you will well
    understand the importance of having a solid architecture.


    If you have experience as a developer creating good object-oriented designs, based
    on tips found in books like Design Patterns⁵, Refactoring⁷, Test Driven Design⁸
    but you have doubts about how to structure an application, how to recognize different
    structures, how to diagram the structure of an application or suddenly find yourself
    in the position of architect where you also become responsible for availability,
    performance, scalability, among others questions, then this book is for you.


