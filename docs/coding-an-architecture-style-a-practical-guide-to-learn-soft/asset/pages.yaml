  md: '# Scalability


    session is created on a server but the next request is sent to another server,
    the system will think that the user is not authenticated yet sending him to the
    login screen again. This is solved by configuring a load balancer with the mechanism
    called sticky session or session affinity. This mechanism registers each session
    identifier with the server where it is created, in order to redirect users to
    the servers where they created the session.


    Another way to scale web applications, and avoid introducing affinity mechanisms,
