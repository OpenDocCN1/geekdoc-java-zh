  md: '# # 6. Scalability


    Scalability is the ability of a system to handle a greater demand without decreasing
    performance. There are two ways to scale: vertical or horizontal. We scale vertically
    (or also known as scale-up) when we improve the hardware where the application
    runs, that is, we increase the processing capacity, incorporate faster disks and
    increase the memory. We scale horizontally (or scale-out) by adding more computers
    with similar processing capacity, distributing the load among them.


    Scaling horizontally is the only way to handle the demand for the so-called "planet-size"
    applications (Amazon, Google, Netflix, etc.). But also, for a large number of
    organizations, scaling-out might be the only possible way due to the costs of
    upgrading hardware.


    In general, when the performance of an application decreases we can always find
    a bottleneck. By doing performance and capacity tests, using tools like JMeter,
    we would be able to find where the bottleneck is in an application. It is important
    to determine the bottleneck and verify that the performance problem is not caused
    by a bug in the application or some inefficient algorithm or database query. If
    we conclude we need more resources then determine whether we need them at the
    application level or in the database. In general, the bottlenecks are usually
    in databases and unfortunately scaling a database is more complex than scaling
    an application as we will see.


    # # Scaling Web Applications


    Before adding resources we must verify that the bottleneck in an application is
    not due to the container where it is running. That is, we must check that the
    web container cannot be configured to allow a greater number of concurrent requests,
    for example. Perhaps, with a simple configuration change, we do not need to add
    resources in the system, which increases the cost and time of implementation and
    maintenance.


    We build Web applications that could belong to one of the following categories:
    stateless or stateful. Stateless Web applications respond to a request using only
    the information that comes in, without the need to remember any previous request.
    While stateful applications need to store certain information from a previous
    request in order to continue processing new requests. In general, this information
    is stored in what are called session variables, which by default and depending
    on the container used, are saved in memory or on the local disk of the application.
    These session variables are generated when the user is authenticated in the system
    and are destroyed when logging out.


    Assuming that the application is stateful, when scaling by adding new application
    servers, it would be necessary to track in which of the servers the session for
    each user was created. Because if the


    > *https://jmeter.apache.org/'
  merge: -1
  pgno: 131
