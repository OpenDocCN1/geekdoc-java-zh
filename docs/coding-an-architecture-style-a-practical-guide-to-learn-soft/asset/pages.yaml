    # UML Diagrams


    UML provides different diagrams to visualize the architecture of a software system.
    Each diagram

    offers its notation, not covered in this book, but can be found in Martin Fowler''s
    UML Distilled

    book¹⁵.


    Related to the different structures we were studying, for the module structures
    we have the diagram

    of classes and the diagram of packages of UML. The packages, as mentioned above,
    correspond to

    namespaces that we find in languages such as PHP or .NET. The UML also proposes
    the component

    diagram to represent components and connectors structures. In addition, in initial
    versions of UML

    t components were the elements to be deployed on hardware. Later it was modified

    incorporating the elements that they call artifacts (example WAR, JARs, DLLs,
    PHARs, etc)

    which are the ones that are finally deployed (allocated) to hardware. Finally,
    UML offers the

    deployment diagram that can be used for allocation structures.


    # C4 Model


    Simon Brown created the C4* to visualize software architectures. Its name is given
    by the

    acronym of the different abstractions of the structures that it allows to diagram:
    Context, Con-

    tainer, Component and Code. Of course, it has many similarities with the other
    proposals, however,

    it is presented with examples on traditional information systems unlike the SEI
    bibliography that

    is exemplified based on its experience in military systems (motor control, embedded
    systems and real

    time)¹⁶, which makes it more complex to understand for those who do not know this
    domain and\its characteristics.


    On the other hand, unlike the other proposals, C4 is presented in levels of abstraction.
    Starting at

    t highest level, we find the software system, represented by the Context diagram
    and where each

    subsequent level of abstraction corresponds to one step further in the previous
    level.


    In the order of abstraction, from the most abstract to the most concrete one,
    the four types

    are described:


    Context: This diagram represents the software system and the relationships with
    external systems.

    External systems are those for which we are not responsible for their maintenance.
    We also include

    in this diagram the different types of users who use the software system.


    Containers: By doing "zoom +" in the box that represents the software system,
    we find the

    containers. With it refers to applications (web, mobile, single-page, shell scripts,

    etc.) and data repositories, schemas and databases. It is essentially a software
    element that executes

    code or stores data. This structure has similarities with the components and connectors
    structure

    of the SEI proposal.


    > *https://c4model.com/'
