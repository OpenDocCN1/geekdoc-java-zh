  md: '# Microservices


    # Definitions and Style


    The Microservices architecture style, like the previous style, has similarities
    with modular architecture, in terms of the criteria used to split an application
    into simpler applications or Microservices. The difference is that we are talking
    about applications, not modules, and the communication between them is in the
    form of inter-process. So far from my description there is no difference with
    the distributed monolith style. So What do Microservices Architecture have special?
    How does it differ from Monolith?


    It proposes to remove the temporal coupling between applications, Microservices.
    This style creates that Microservices should be autonomous. Microservices must
    be developed, tested and deployed isolated from the rest of the Microservices
    that form the whole system. As we have said, in the Distributed Monolith none
    of these can be.


    How can this be achieved? Can I remove the temporal coupling?


    We have to change the way Microservices communicates. The temporal coupling is
    generated by the synchronous communication. And to that, as we do in software
    design, we have to put another element between the two.


    We can do this by using a publish/subscribe mechanisms for their communication,
    which is an asynchronous talk between them. Its main characteristic is that neither
    of the communication has knowledge of the other. The one consumes messages subscribes
    to a category of messages (or specific topics) and the one who produces messages,
    has no knowledge of who may be interested in them. This mechanism removes the
    temporal coupling between the Microservices.


    Any form of coupling between Microservices must be removed from the system, and
    with that we are eliminating any possibility of code reuse between Microservices.
    The style by definition clearly expresses that there should be no dependencies
    between development teams responsible for Microservices, and since code reuse
    generates dependencies between them, it is not something that is promoted. In
    other, in this style of architecture, independence between teams is favored over
    code reuse. Sam Newman in his book Building Microservices⁵ states:


    > "The evils of too much coupling between microservices are far worse than the
    problems caused by code duplication"


    How do we split an application into Microservices?


    It is the most complex part, but what guess? We have already discussed this in
    the modular architecture style as the criteria for splitting an application into
    modules is the same used to split an application into Microservices. Indeed, as
    we see, having a modular architecture gives us the possibility, if it''s really
    needed, to move to Microservices without much trouble.


    So, the criteria is the one mentioned in the previous chapter, using the CCP (Common
    Closure Principle). Everything that changes for the same reason and at the same
    time when there is a new


    *https://en.wikipedia.org/wiki/Publish%E2%80%93subscribe_pattern'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Monolithic and Distributed Architecture


    requirement, must be in the same Microservice. The goal is very clear, we need
    that most of the requirements fall on a single team and therefore on a single
    Microservice. The need to involve multiple teams to implement a requirement the
    faster we will. This is why the CCP principle applies perfectly.


    However, the general Microservices literature recommends using the concept Bounded
    Context, that belongs to the Domain Design⁵⁸, to determine the granularity of
    each Microservice. Bounded Context is designed as a solution to understand and
    divide an enterprise application into sub-domains across the different responsibilities
    within each domain of an organization. Both bounded context and CCP generate vertical
    partitions, promoting the goal that we described in the previous paragraph. It
    is not the intention of this book to get into DDD or bounded context, for which
    we recommend the book by Eric Evans⁵⁹. Also, books on Microservices deal with
    this topic, which is the same as Newman''s book⁶⁰


    In the same direction, the book Fundamentals of Software Architecture⁶¹ proposes
    three elements to help split an application in Microservices:


    Purpose: Ideally, each Microservice should be functionally cohesive, contributing
    one significant behavior on behalf of the overall application.


    Transactions: Bounded contexts are business workflows, and often the entities
    that need to cooperate in a transaction show a good service boundary. Because
    transactions cause issues in distributed architectures, architects can design
    their system to avoid them, they generate better designs.


    Choreography: If an architect builds a set of services that offer excellent domain
    isolation require extensive communication to function, the architect may consider
    bundling these services back into a larger service to avoid the communication
    overhead.


    The term micro-service seems to reveal that each application should do the bare
    minimum. The criteria is by sub-domain, and perhaps certain sub-domains are not
    small. For this reason, what is explained in the previous chapters is so important.
    It is necessary to have a solid architecture of modules or layers, within each
    Microservice. Instead of spaghetti code in a monolithic application, we have spaghetti
    code in multiple distributed architectures. It is true that if the size of each
    application is relatively small, it is simpler to translate the spaghetti code.


    When you refer to small or medium size in software, you are really saying that
    it is possible to understand where the changes are made in each iteration will.
    If I have an application divided into Microservices, where each Microservice lacks
    a solid structure, the complexity of each application would grow much slower than
    if I have a monolithic application with spaghetti code. So sooner or later effort
    will win if we don''t have a solid architecture with clear definitions (and validated
    at every commit).


    Because the communication between the client and a Microservice is only in the
    form of process, some books dedicated exclusively to Microservices mention this
    as a main advantage over monolithic architectures, saying that in the latter,
    a started developer could go from the client to the database, without going through
    an intermediate layer or an API. With what we have seen in the previous chapters,
    you might have noticed that this is far from being the case. Using the'
