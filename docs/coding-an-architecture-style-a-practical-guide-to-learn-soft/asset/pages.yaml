  md: '# Modules, Layers and their Architecture Styles


    needs the persistence layer, its interfaces from the radio.persistence.api package
    in order to work (even compiled if we are using a compiled language). Similarly,
    it is not possible to test the business layer without including the interfaces
    from the persistence layer.


    Therefore, if we want to refactor RadioA''s layered architecture and turn it into
    a hexagonal architecture we must invert the dependency that exists between radio.model
    and radio.persistence. Instead of having the radio.model package depending on
    the radio.persistence package, we should make the radio.persistence package depend
    on the radio.model package. To do that, we make the following changes:


    +   1. We create the package radio.model.ports and move there the interfaces of
    the packages radio.model.api and radio.persistence.api. Then we remove these .api
    packages.

    2. We remove the interface radio.persistence.Competition, since we will use model.ports.RadioCompetition.

    3. We rename the packages radio.ui and radio.persistence to radio.adapters.ui
    and radio.adapters.persistence.

    4. We modify the class radio.persistence.JdbcbeCompetitionRepository to return
    an instance of radio.model.ports.RadioCompetition.


    With these changes, we transform the layered architecture illustrated in figure
    3.6 into an hexagonal architecture shown in figure 3.8:'
