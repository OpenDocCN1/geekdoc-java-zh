    \ of the DataMapperORM, as transparent persistence, lazy loading, etc. Let us\
    \ remember that these advantages to work requires what some DataMappers/ORMs like\
    \ Hibernate persistence context†. For this need an abstract mechanism (interface)\
    \ that allows me to define the limits where I am going using my persistent objects.\
    \ We then define the following two interfaces within the **radio.model.api** package:\n\
    \n# SPI Interfaces\n\n```\npackage radio.model.api;\n\npublic interface UnitOfWork\
    \ {\n    <R> R tx(Function<Competitions, R> codeInTx);\n}\n\npublic interface\
    \ Competitions {\n    Optional<Competition> competitionBy(int id);\n    List<Competition>\
    \ competitionsForInscription();\n}\n\npublic interface Competitions {\nOptional<Competition>\
    \ competitionBy(int id);\nList<Competition> competitionsForInscription();\n}\n\
    ```\n\nradio.model.api.UnitOfWork.tx allows us to pass by parameter (codeInTx)\
    \ code blocks that manipulate persistent objects, within a persistence context.\
    \ We can do this with lambda expressions that implement java.util.Function. The\
    \ **radio.model.api.Competitions** is the SPI that allows us to get competitions\
    \ in two different ways from the persistent repository.\n\nSo now let's see how\
    \ we implement the **radio.model.api.RadioProgram** interface, to provide services\
