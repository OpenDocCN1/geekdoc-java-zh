  md: 'NOTES


    It is very clear that if we cannot create a layered, hexagonal and/or modular
    architecture and we go to Microservices, each Microservice will end up in spaghetti
    code. If, on the other hand, I have an application with vertical modules, such
    as the one we built in the previous chapter, going to Microservices is much simpler
    than if we want to go to Microservices starting from a monolithic application
    with spaghetti code.


    I consider that the development of an application with a modular architecture
    with well-defined rules is better than starting directly with Microservices. This
    is recommended by Fowler in his article Monolith First.


    It is also possible to have asynchronous communication between modules of a monolithic
    application. The fact of having a modular monolith does not prevent each from
    communicating via a publish/subscribe mechanism. We have already mentioned, a
    solid modular architecture does not require the help of mechanisms like the one
    that Java9 gives us. It can be implemented simply with packages or namespaces
    as long as clear rules are defined regarding the dependencies between them, criteria
    for grouping classes in them, and most importantly, where these rules are validated
    in every commit.


