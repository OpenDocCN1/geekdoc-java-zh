    # Structures and Views (SEI)


    In one of the Software Architecture "bibles", the book Software Architecture in
    Practice¹⁸, from the Software Engineering Institute (SEI), the authors define
    view, differentiating it from **structure**, in the following way:


    A view is a representation of a structure.


    According to them, architectural structures are divided into three major categories:


    **Module Structure**: Refers to how the functionality of a system is divided into
    abstractions (modules, packages, layers, classes, etc.). To design structures
    of this type, we must first understand what syntactical constructions exist in
    the programming language that we are using to represent this kind of structure.
    In small systems the classes and their relationships could be the software elements
    to represent this structure, but in larger systems we need software elements of
    a higher level of abstraction than a class, function or procedure. For example
    in PHP the namespaces, in Java we group classes using some criteria (we will talk
    about this later) and expose interfaces in order to hide implementation details.
    This type of structure can be documented using the logical and development view
    of the Kruchten model.


    **Components and connectors**: components are the software elements at runtime
    and connectors are ways to connect, how they communicate. Examples of components
    could be services, data repositories, applications, anything that can be started
    and stopped. Examples of connectors are sockets, https (REST), shared databases,
    etc. A component can map one to a single module, or it can map to multiple modules
    from the previous category. To be clear, let''s distinguish between the two terms:
    components are software elements at runtime, deployed in a process separated from
    each other whose communication is in the form of inter-process communication (IPC).
    While modules are software elements that communicate via their interfaces within
    all the same process communicating in the form of in-process communication. This
    type of structure can be represented using the process view of Kruchten model.


    **Allocation structures**: Refers to decisions of how software elements will relate
    to hardware elements and also deployment. For example, on physical or virtual
    machine each component runs, or which development team is responsible for each
    component. It is also important to represent the environment we are talking about.
    For which directory does the system store files in the testing environment and
    the production environment. This type of structure can'
