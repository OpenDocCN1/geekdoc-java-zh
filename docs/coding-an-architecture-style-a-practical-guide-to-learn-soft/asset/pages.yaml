    The Microservices Competitions and UserProfile have a web package which exposes
    their services via https. Whereas Notifications is a standalone application. Let
    us remember that one of the requirements was to notify the listener via email
    when they register in a competition. To allow Microservices to communicate with
    each other, we incorporate a publish/subscribe mechanism. Finally who sends the
    email to the listener is the Notifications Microservice, but for that, it needs
    to know when to do it requires the listener email address, a title and text body.
    The Microservice that knows when someone registers in a competition is Competitions
    and to let other Microservices know that an inscription has been done, it publishes
    the "inscription-added" event. But for the email address of listener is the UserProfile
    Microservice. To share information with whoever needs it, every time a new listener
    is added, the "new-listener" event is published (if we add the possibility to
    modify its email to the listener, a new event should be published). Competitions
    subscribes to the "new-listener" event and its relational data model. In a similar
    way, the action of making a new registration in a competition generates the "inscription-added"
    event, which includes as the event''s data email address of the listener who registered,
    a title and the text body. Finally, the Notifications Microservice subscribes
    to the "inscription-added"'
