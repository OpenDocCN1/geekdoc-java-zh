  md: '# Monolithic and Distributed Architecture


    Java9+ modules or even validating the architecture with tools like ArchUnit, one
    can ensure that the accesses are always as defined. Thus, this is not a reason
    to use this style of architecture. The reasons, as we''ve mentioned, are scalability,
    performance, and availability. When we talk about scalability it is with a dual
    purpose. On one hand, the characteristic that applications can support a greater
    demand without too much effort. And on the other hand, the ability to have development
    speed by eliminating the bottleneck that is generated with a single monolithic
    application in organizations with hundreds of developers.


    # Implementation


    So let''s see how we transform the RadioA application with modular architecture
    into a Microservices architecture. The vertical module partitioning that we have
    implemented in the previous chapter to show modular architecture is the **first
    step** towards a Microservices architecture. We are going to take these projects
    as a basis to transform each module into a Microservice.


    We will have three Microservices: **UserProfile, Competitions and Notifications**.
    The first thing we will do is incorporate a Web package to the UserProfile and
    Competitions modules in order to expose their services via *https*. And then we
    will incorporate a publish-subscribe messaging mechanism to perform the communication
    between Microservices. Let''s look at figure 4.7 below:'
