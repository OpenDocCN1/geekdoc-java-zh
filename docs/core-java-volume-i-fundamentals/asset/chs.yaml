  \ 2D 图形和图像处理的讨论。在下一章中，你将学习如何让程序对用户输入做出响应。\n\n# 第 8 章 事件处理\n\n本章\n- 事件处理基础\n- 动作\n\
  - 鼠标事件\n- AWT 事件层次结构\n\n事件处理对于带有图形用户界面的程序至关重要。为了实现用户界面，你必须掌握 Java 处理事件的方式。本章解释了\
  \ Java AWT 事件模型的工作原理。你将看到如何从用户界面组件和输入设备捕获事件。我们还将展示如何处理*动作*actions，它们代表了处理动作事件的一种结构化方法。\n\
  \n### 8.1. 事件处理基础\n\n任何支持 GUI 的操作系统都会持续监控按键输入或鼠标点击等事件。操作系统会将这些事件报告给正在运行的程序。每个程序然后决定对这些事件做出什么反应（如果要做的话）。在\
  \ Visual Basic 等语言中，事件与代码之间的对应是显而易见的。人们为每个感兴趣的特定事件编写代码，并将其放在通常被称为*事件过程*event procedure\
  \ 方法中。例如，一个名为“HelpButton”的 Visual Basic 按钮将关联一个 `HelpButton_Click` 事件过程。每当点击该按钮时，过程中的代码就会执行。每个\
  \ Visual Basic GUI 组件响应一组固定的事件，并且无法更改它所响应的事件。\n\n另一方面，如果你使用原生 C 语言进行事件驱动编程，你需要编写代码来持续检查事件队列，以获取操作系统正在报告的内容；这通常通过将你的代码封装在一个带有巨大\
  \ switch 语句的循环中来实现。这种技术显然相当笨拙，而且编写起来要困难得多。它的优势在于，你可以响应的事件不像像 Basic 那种语言那样有限。\n\n\
  Java 编程环境在功能和相应的复杂性方面介于 Visual Basic 和原生 C 之间。在 AWT 已知的事件范围内，你完全控制事件如何从*事件源*event\
  \ sources（如按钮或滚动条）传输到*事件监听器*event listeners。你可以指定*任何*对象作为事件监听器——实践中，你选择一个可以方便执行预期响应的对象。这种*事件委托模型*event\
  \ delegation model 比 Visual Basic 提供了更大的灵活性，因为后者的监听器是预先定义的。\n\n\n\n监听器对象将使用事件对象（event\
  \ object）中的信息来确定对事件的反应。\n\n图 8.1 显示了事件处理类与接口之间的关系。\n\n![Image](img/image01061.jpeg)\n\
  \n图 8.1. 事件源与监听器的关系\n\n这里有一个指定监听器的示例：\n\n```java\nActionListener listener = . .\
  \ .;\nJButton button = new JButton(\"Ok\");\nbutton.addActionListener(listener);\n\
  ```\n\n现在，每当按钮发生“动作事件”（action event）时，`listener` 对象就会被通知。对于按钮，正如你预期的，动作事件就是按钮点击。\n\
  \n要实现 `ActionListener` 接口，监听器类必须有一个名为 `actionPerformed` 的方法，该方法接收一个 `ActionEvent`\
  \ 对象作为参数。\n\n```java\nclass MyListener implements ActionListener\n{\n   . . .\n\
  \   public void actionPerformed(ActionEvent event)\n   {\n      //按钮点击的反应放在这里\n\
  \      . . .\n   }\n}\n```\n\n每当用户点击按钮时，`JButton` 对象就会创建一个 `ActionEvent` 对象并调用 `listener.actionPerformed(event)`，传递该事件对象。像按钮这样的事件源可以有多个监听器。在这种情况下，每当用户点击按钮时，按钮会调用所有监听器的\
  \ `actionPerformed` 方法。\n\n图 8.2 显示了事件源、事件监听器和事件对象之间的交互。\n\n![Image](img/image01062.jpeg)\n\
  \n图 8.2. 事件通知\n\n### 8.1.1. 示例：处理按钮点击\n\n为了熟悉事件委托模型（event delegation model），让我们梳理一下响应按钮点击这一简单示例所需的所有细节。在这个示例中，我们将展示一个包含三个按钮的面板（panel）。三个监听器对象被作为动作监听器添加到这些按钮上。\n\
  \n在这种场景下，每当用户点击面板上的任何按钮时，相关的监听器对象都会接收到一个指示按钮点击的 `ActionEvent`。在我们的示例程序中，监听器对象将改变面板的背景颜色。\n\
  \n在向你展示监听按钮点击的程序之前，我们首先需要解释如何创建按钮以及如何将它们添加到面板中。（关于 GUI 元素的更多信息，请参见第 9 章。）\n\n要创建一个按钮，请在按钮构造函数中指定一个标签字符串、一个图标或两者都有。这里有两个示例：\n\
  \n点击此处查看代码图片\n\n```java\nJButton yellowButton = new JButton(\"Yellow\");\nJButton\
  \ blueButton = new JButton(new ImageIcon(\"blue-ball.gif\"));\n```\n\n调用 `add` 方法将按钮添加到面板中：\n\
  \n点击此处查看代码图片\n\n```java\nJButton yellowButton = new JButton(\"Yellow\");\nJButton\
  \ blueButton = new JButton(\"Blue\");\nJButton redButton = new JButton(\"Red\");\n\
  buttonPanel.add(yellowButton);\nbuttonPanel.add(blueButton);\nbuttonPanel.add(redButton);\n\
  ```\n\n图 8.3 显示了结果。\n\n![Image](img/image01063.jpeg)\n\n图 8.3. 一个填充了按钮的面板\n\n接下来，我们需要添加监听这些按钮的代码。这需要实现\
  \ `ActionListener` 接口的类，正如我们刚刚提到的，它包含一个方法：`actionPerformed`，其签名如下：\n\n```java\n\
  public void actionPerformed(ActionEvent event)\n```\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n我们在按钮示例中使用的 `ActionListener` 接口并不局限于按钮点击。它被用于许多独立的情况：\n\n- 当双击从列表框（list\
  \ box）中选择某项时\n- 当选择一个菜单项时\n- 当在文本框中点击回车键时\n- 当 `Timer` 组件经过了一定的时间后\n\n你将在本章和下一章中看到更多细节。\n\
  \n使用 `ActionListener` 接口的方法在所有情况下都是相同的：`actionPerformed` 方法（它是 `ActionListener`\
  \ 中唯一的方法）接受一个 `ActionEvent` 类型的对象作为参数。这个事件对象为你提供了有关所发生事件的信息。\n\n当按钮被点击时，我们希望面板的背景颜色变为某种特定的颜色。我们在监听器类中存储所需的颜色。\n\
  \n点击此处查看代码图片\n\n```java\nclass ColorAction implements ActionListener\n{\n   private\
  \ Color backgroundColor;\n   public ColorAction(Color c)\n   {\n      backgroundColor\
  \ = c;\n   }\n   public void actionPerformed(ActionEvent event)\n   {\n      //\
  \ 设置面板背景颜色\n      . . .\n   }\n}\n```\n\n然后我们为每个颜色构造一个对象，并将这些对象设置为按钮的监听器。\n\n点击此处查看代码图片\n\
  \n```java\nColorAction yellowAction = new ColorAction(Color.YELLOW);\nColorAction\
  \ blueAction = new ColorAction(Color.BLUE);\nColorAction redAction = new ColorAction(Color.RED);\n\
  yellowButton.addActionListener(yellowAction);\nblueButton.addActionListener(blueAction);\n\
  redButton.addActionListener(redAction);\n```\n\n例如，如果用户点击标记为“Yellow”的按钮，`yellowAction`\
  \ 对象的 `actionPerformed` 方法就会被调用。它的 `backgroundColor` 实例字段被设置为 `Color.YELLOW`，现在它可以继续设置面板的背景颜色了。\n\
  \n还剩下一个问题。`ColorAction` 对象无法访问 `buttonPanel` 变量。你可以通过两种方法解决这个问题。你可以将面板存储在 `ColorAction`\
  \ 对象中并在 `ColorAction` 构造函数中设置它。或者更方便地，你可以将 `ColorAction` 为 `ButtonFrame` 的内部类（inner\
  \ class）。它的方法就可以自动访问面板。（关于内部类的更多信息，请参见第 6 章。）\n\n我们采用后一种方法。以下是将 `ColorAction` 放在\
  \ `ButtonFrame` 内部的方法：\n\n点击此处查看代码图片\n\n```java\nclass ButtonFrame\n{\n   private\
  \ buttonPanel;\n   . . .\n   private class ColorAction implements ActionListener\n\
  \   {\n      private Color backgroundColor;\n      . . .\n      public void actionPerformed(ActionEvent\
  \ event)\n      {\n         buttonPanel.setBackground(backgroundColor);\n      }\n\
  \   }\n}\n```\n\n仔细观察 `actionPerformed` 方法。`ColorAction` 类没有 `buttonPanel` 字段。但外部类\
  \ `ButtonFrame` 有。这种情况非常常见。事件监听器对象需要执行某些影响其他对象的操作。你可以将监听器放在应该修改状态的类内部。\n\n列表 8.1\
  \ 包含了完整的框架类。每当你点击其中一个按钮时，相应的动作监听器就会改变面板的背景颜色。\n\n\n\n\n```java\nJButton blueButton\
  \ = new JButton(\"Blue\");\nJButton redButton = new JButton(\"Red\");\n\nbuttonPanel\
  \ = new JPanel();\n\n// 将按钮添加到面板\nbuttonPanel.add(yellowButton);\nbuttonPanel.add(blueButton);\n\
  buttonPanel.add(redButton);\n\n// 将面板添加到框架\nadd(buttonPanel);\n\n// 创建按钮动作\nColorAction\
  \ yellowAction = new ColorAction(Color.YELLOW);\nColorAction blueAction = new ColorAction(Color.BLUE);\n\
  ColorAction redAction = new ColorAction(Color.RED);\n\n// 将动作与按钮关联\nyellowButton.addActionListener(yellowAction);\n\
  blueButton.addActionListener(blueAction);\nredButton.addActionListener(redAction);\n\
  }\n\n/**\n * 设置面板背景颜色的动作监听器。\n */\nprivate class ColorAction implements ActionListener\
  \ {\n    private Color backgroundColor;\n\n    public ColorAction(Color c) {\n \
  \       backgroundColor = c;\n    }\n\n    public void actionPerformed(ActionEvent\
  \ event) {\n        buttonPanel.setBackground(backgroundColor);\n    }\n}\n```\n\
  \n#### 8.1.2. 熟悉内部类\n\n有些人人不喜欢内部类，因为他们觉得类和对象的激增会让程序变慢。让我们来看这一说法。你不需要为每个用户界面组件创建一个新类。在我们的示例中，三个按钮共享同一个监听器类。当然，每个按钮都有一个独立的监听器对象。但这些对象并不大，它们每个只包含一个颜色值和一个面板的引用。而传统的解决方案（使用\
  \ `if`/`else` 语句）也引用了动作监听器存储的相同颜色对象——只是作为局部变量，而不是实例字段。\n\n这是一个关于匿名内部类如何实际简化代码的良好示例。如果你查看代码列表\
  \ 8.1 的代码，你会注意到每个按钮都需要相同的处理方式：\n\n1. 使用标签字符串构造按钮。\n2. 将按钮添加到面板。\n3. 使用相应的颜色构造动作监听器。\n\
  4. 添加该动作监听器。\n\n让我们实现一个辅助方法来简化这些任务：\n\n点击此处查看代码图像\n\n```java\npublic void makeButton(String\
  \ name, Color backgroundColor) {\n    JButton button = new JButton(name);\n    buttonPanel.add(button);\n\
  \    ColorAction action = new ColorAction(backgroundColor);\n    button.addActionListener(action);\n\
  }\n```\n\n然后我们只需调用：\n\n`makeButton(\"yellow\", Color.YELLOW);`\n`makeButton(\"blue\"\
  , Color.BLUE);`\n`makeButton(\"red\", Color.RED);`\n\n现在你可以进行进一步的简化。注意，`ColorAction`\
  \ 类只需要一次：在 `makeButton` 方法中。因此，你可以将其变成匿名类：\n\n点击此处查看代码图像\n\n```java\npublic void\
  \ makeButton(String name, final Color backgroundColor) {\n    JButton button = new\
  \ JButton(name);\n    buttonPanel.add(button);\n    button.addActionListener(new\
  \ ActionListener() {\n        public void actionPerformed(ActionEvent event) {\n\
  \            buttonPanel.setBackground(backgroundColor);\n        }\n    });\n}\n\
  ```\n\n动作监听器的代码变得简单了许多。`actionPerformed` 方法只需引用了参数 `backgroundColor`。（与在内部类中访问的局部变量一样，该参数需要声明为\
  \ `final`。）不需要显式的构造函数。正如你在第 6 章 中看到的，内部类机制会自动生成一个构造函数，存储在某个方法中使用所有的 `final` 变量。\n\
  \n![Image](img/image0949.jpeg) 提示 匿名类看起来可能很困惑。但如果你训练自己去忽略这些常规化的代码，像这样，你就能学会解读它们：\n\
  \n点击此处查看代码图像\n\n```java\nbutton.addActionListener(new ActionListener() {\n    public\
  \ void actionPerformed(ActionEvent event) {\n        buttonPanel.setBackground(backgroundColor);\n\
  \    }\n});\n```\n\n在这里，按钮动作设置了背景颜色。只要事件处理器只包含几条语句，我们认为这是非常可读的，特别是当你不担心内部类的机制时。\n\
  \n![Image](img/image0948.jpeg) 注意 你完全自由地指定实现 `ActionListener` 接口的类的任何对象作为按钮监听器。我们倾向于使用专门为执行所需按钮动作创建的新类对象。然而，某些程序员对内部类并不熟悉，并选择了不同的策略。他们让事件源的容器实现\
  \ `ActionListener` 接口。然后，容器将自己设置为监听器，如下：`yellowButton.addActionListener(this);`\n\
  `blueButton.addActionListener(this);`\n`redButton.addActionListener(this);`\n\n\
  现在，三个按钮不再拥有独立的监听器。它们共享同一个监听器对象——即按钮框架。因此，`actionPerformed` 方法必须找出是哪个按钮被点击了。\n\n\
  点击此处查看代码图像\n\n```java\nclass ButtonFrame extends JFrame implements ActionListener\
  \ {\n    ...\n    public void actionPerformed(ActionEvent event) {\n        Object\
  \ source = event.getSource();\n        if (source == yellowButton) ...\n       \
  \ else if (source == blueButton) ...\n        else if (source == redButton ) ...\n\
  \        else ...\n    }\n}\n```\n\n你可以看到，这变得非常混乱，我们不建议这样做。\n\n`java.util.EventObject`\
  \ 1.1\n* `Object getSource()` 返回发生事件对象的引用。\n\n`java.awt.event.ActionEvent` 1.1\n\
  * `String getActionCommand()` 返回与此动作事件关联的命令字符串。如果动作事件源自按钮，则命令字符串等于按钮标签，除非使用 `setActionCommand`\
  \ 方法更改了它。\n\n#### 8.1.3. 创建包含单个方法调用的监听器\n\n你可以在不编写内部类的情况下指定简单的事件监听器。例如，假设你有一个标记为“Load”的按钮，其事件处理器包含一个单一方法调用：`frame.loadData();`\n\
  \n当然，你可以使用匿名内部类：\n\n点击此处查看代码图像\n\n```java\nloadButton.addActionListener(new ActionListener()\
  \ {\n    public void actionPerformed(ActionEvent event) {\n        frame.loadData();\n\
  \    }\n});\n```\n\n但 `EventHandler` 类可以自动创建这样的监听器，调用方法为 `EventHandler.create(ActionListener.class,\
  \ frame, \"loadData\")`。当然，你仍然需要安装该处理器：\n\n点击此处查看代码图像\n\n`loadButton.addActionListener(EventHandler.create(ActionListener.class,\
  \ frame, \"loadData\"));`\n\n如果监听器调用了一个带有单个参数的方法，且该参数可以从事件参数获取，你可以使用 `create` 方法的另一种形式。例如，调用\
  \ `EventHandler.create(ActionListener.class, frame, \"loadData\", \"source.text\"\
  )` 等于：\n\n点击此处查看代码图像\n\n```java\nnew ActionListener() {\n    public void actionPerformed(ActionEvent\
  \ event) {\n        frame.loadData(((JTextField) event.getSource()).getText());\n\
  \    }\n}\n```\n\n属性名 `source` 和 `text` 变成了方法调用 `getSource` 和 `getText`。\n\n![Image](img/image0950.jpeg)\
  \ 警告\n\n\n\n\n\n调用 `EventHandler.create` 的第二个参数必须属于一个 `public` 公有类。否则，反射机制将无法定位并调用目标方法。\n\
  \n`java.beans.EventHandler` **1.4**\n\n- `static Object create(Class listenerInterface,\
  \ Object target, String action)`\n- `static Object create(Class listenerInterface,\
  \ Object target, String action, String eventProperty)`\n- `static Object create(Class\
  \ listenerInterface, Object target, String action, String eventProperty, String\
  \ listenerMethod)`\n\n构造一个实现给定接口的代理类对象。可以通过命名的方法或接口的所有方法在目标对象上执行给定的动作。\n\n动作（action）可以是方法名，也可以是对象的属性。如果是属性，则会执行其设置方法（setter\
  \ method）。例如，动作 `\"text\"` 会被转换为对 `setText` 方法的调用。\n\n事件属性由一个或多个用点分隔的属性名组成。第一个属性从监听器方法的参数中读取，第二个属性从生成的对象中读取，依此类推。最终结果将成为动作的参数。例如，属性\
  \ `\"source.text\"` 被转换为对 `getSource` 和 `getText` 方法的调用。\n\n### 8.1.4 示例：更改外观（Look-and-Feel）\n\
  \n默认情况下，Swing 程序使用 Metal 外观。更改为另一种外观有两种方法。第一种是在你的 Java 安装目录的 `jre/lib` 子目录下提供一个\
  \ `swing.properties` 文件。在该文件中，将属性 `swing.defaultlaf` 设置为你想要的外观的类名。例如：\n\n```\nswing.defaultlaf=com.sun.java.swing.plaf.motif.MotifLookAndFeel\n\
  ```\n\n请注意，Metal 外观位于 `javax.swing` 包中。其他外观的包位于 `com.sun.java` 包中，并且不需要在每个 Java\
  \ 实现中都存在。目前，由于版权原因，Windows 和 Macintosh 外观包仅在 Windows 和 Macintosh 版本的 Java 运行环境中随分附带。\n\
  \n![Image](img/image00949.jpeg) 提示\n\n在属性文件中，以 `#` 字符开头的行会被忽略，因此你可以在 `swing.properties`\
  \ 文件中提供多个外观选择，并通过移动 `#` 符号的位置来选择其中一个：\n\n点击此处查看代码图片\n\n```\n#swing.defaultlaf=javax.swing.plaf.metal.MetalLookAndFeel\n\
  \nswing.defaultlaf=com.sun.java.swing.plaf.motif.MotifLookAndFeel\n\n#swing.defaultlaf=com.sun.java.swing.plaf.windows.WindowsLookAndFeel\n\
  ```\n\n你必须重启程序才能通过这种方式切换外观。Swing 程序在启动时只读取一次 `swing.properties` 文件。\n\n第二种方法是动态更改外观。调用静态方法\
  \ `UIManager.setLookAndFeel` 并传入你想要的外观类名。然后调用静态方法 `SwingUtilities.updateComponentTreeUI`\
  \ 来刷新整个组件 set。你只需要向该方法提供一个组件；它将找到所有其他组件。当无法找到请求的外观或在加载时出现错误时，`UIManager.setLookAndFeel`\
  \ 方法可能会抛出多个异常。一如既往，我们要求你忽略异常处理代码，并等到第 11 章获取详细解释。\n\n以下是一个示例，展示了你如何在程序中切换到 Motif\
  \ 外观：\n\n点击此处查看代码图片\n\n```java\nString plaf = \"com.sun.java.swing.plaf.motif.MotifLookAndFeel\"\
  ;\n\ntry\n{\n    UIManager.setLookAndFeel(plaf);\n    SwingUtilities.updateComponentTreeUI(panel);\n\
  }\ncatch(Exception e) { e.printStackTrace(); }\n```\n\n要列出所有已安装的外观实现，请调用\n\n```java\n\
  UIManager.LookAndFeelInfo[] infos = UIManager.getInstalledLookAndFeels();\n```\n\
  \n然后你可以按照以下方式获取每个外观的名字和类名：\n\n```java\nString name = infos[i].getName();\nString\
  \ className = infos[i].getClassName();\n```\n\n列表 8.2 是一个演示如何切换外观的完整程序（请参见图 8.4）。该程序与列表\
  \ 8.1 类似。遵循前一节的建议，我们使用辅助方法 `makeButton` 和匿名内部类来指定按钮动作——即切换外观。\n\n![Image](img/image01064.jpeg)\n\
  \n图 8.4 切换外观\n\n列表 8.2. plaf/PlafFrame.java\n\n点击此处查看代码图片\n\n```java\npackage plaf;\n\
  \nimport java.awt.event.*;\nimport javax.swing.*;\n\n/**\n * 一个带有用于切换外观按钮的框架\n */\n\
  public class PlafFrame extends JFrame\n{\n    private JPanel buttonPanel;\n\n  \
  \  public PlafFrame()\n    {\n        buttonPanel = new JPanel();\n        UIManager.LookAndFeelInfo[]\
  \ infos = UIManager.getInstalledLookAndFeels();\n        for (UIManager.LookAndFeelInfo\
  \ info : infos)\n            makeButton(info.getName(), info.getClassName());\n\
  \        add(buttonPanel);\n        pack();\n    }\n\n    /**\n     * 创建切换外观的按钮\n\
  \     * @param name 按钮的名字\n     * @param plafName 外观类名\n     */\n    void makeButton(String\
  \ name, String plafName)\n    {\n        // 添加按钮到面板\n        JButton button = new\
  \ JButton(name);\n        buttonPanel.add(button);\n        // 设置按钮动作\n        button.addActionListener(new\
  \ ActionListener()\n        {\n            public void actionPerformed(ActionEvent\
  \ event)\n            {\n                // 按钮动作：切换到外观\n                try\n  \
  \              {\n                    UIManager.setLookAndFeel(plafName);\n    \
  \                SwingUtilities.updateComponentTreeUI(PlafFrame.this);\n       \
  \             pack();\n                }\n                catch (Exception e)\n\
  \                {\n                    e.printStackTrace();\n                }\n\
  \            }\n        });\n    }\n}\n```\n\n该程序有一个细节：内部监听器的 `actionPerformed`\
  \ 方法需要将外部类 `PlafFrame` 的引用传递给 `updateComponentTreeUI` 方法。回顾第 6 章，外部对象的 `this` 指针必须加上类名前缀：\n\
  \n```java\nSwingUtilities.updateComponentTreeUI(PlafFrame.this);\n```\n\n`javax.swing.UIManager`\
  \ **1.2**\n\n- `static UIManager.LookAndFeelInfo[] getInstalledLookAndFeels()` 获取描述已安装外观实现的对象数组。\n\
  - `static void setLookAndFeel(String className)` 使用给定的类名（如 `javax.swing.plaf.metal.MetalLookAndFeel`）设置当前外观。\n\
  \n`javax.swing.UIManager.LookAndFeelInfo` **1.2**\n\n- `String getName()` 返回外观的显示名称。\n\
  - `String getClassName()` 返回外观实现类的名称。\n\n### 8.1.5 Adapter 类\n\n并不是所有的事件都像点击按钮那样容易处理。在正式程序中，你希望监控用户尝试关闭主框架的情况，因为你不希望用户丢失未保存的工作。当用户关闭框架时，你想弹出一个对话框，并在用户同意后退出程序。\n\
  \n当用户尝试关闭窗口时，`JFrame` 对象是 `WindowEvent` 的源。如果你想捕获该事件，必须有一个适当的监听器并将其添加到框架的窗口监听列表中。\n\
  \n```java\nWindowListener listener = . . .;\nframe.addWindowListener(listener);\n\
  ```\n\n\n\n窗口监听器必须是一个实现了 `WindowListener` 接口的类对象。`WindowListener` 接口中实际上有七个方法。框架（frame）调用这些方法作为对窗口可能发生的七种不同事件的响应。这些名称自言易懂，除了在\
  \ Windows 下，“iconified”（图标化）通常被称为“minimized”（最小化）。以下是完整的 `WindowListener` 接口：\n\n\
  ```java\npublic interface WindowListener\n{\n   void windowOpened(WindowEvent e);\n\
  \   void windowClosing(WindowEvent e);\n   void windowClosed(WindowEvent e);\n \
  \  void windowIconified(WindowEvent e);\n   void windowDeiconified(WindowEvent e);\n\
  \   void windowActivated(WindowEvent e);\n   void windowDeactivated(WindowEvent\
  \ e);\n}\n```\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n要确定窗口是否已最大化，请安装 `WindowStateListener`。详情请参见第\
  \ 402 页的 API 注释。\n\n***\n\n正如 Java 一一如所示，任何实现接口的类必须实现其所有方法；在这种情况下，这意味着要实现*七* 个方法。记住，我们只感兴趣这七个方法中的一个，即\
  \ `windowClosing` 方法。\n\n当然，我们可以定义一个实现接口的类，在 `windowClosing` 方法中添加对 `System.exit(0)`\
  \ 的调用，并为其他六方法编写空函数：\n\n点击此处查看代码图片\n\n```java\nclass Terminator implements WindowListener\n\
  {\n   public void windowClosing(WindowEvent e)\n   {\n      if (user agrees)\n \
  \        System.exit(0);\n   }\n   public void windowOpened(WindowEvent e) {}\n\
  \   public void windowClosed(WindowEvent e) {}\n   public void windowIconified(WindowEvent\
  \ e) {}\n   public void windowDeiconified(WindowEvent e) {}\n   public void windowActivated(WindowEvent\
  \ e) {}\n   public void windowDeactivated(WindowEvent e) {}\n}\n```\n\n为六个无所作用的方法编写代码是没人喜欢的枯燥重复性工作。为了简化这项任务，每个具有多个方法的\
  \ AWT 监听器接口都带有一个相应的*适配器*（adapter）类，该类实现了接口中的所有方法但对它们不执行任何操作。例如，`WindowAdapter` 类拥有七个空方法。这意味着适配器类自动满足了\
  \ Java 对实现关联监听器接口的实现要求。你可以扩展适配器类来指定对接口中某些（但不是所有）事件类型的预期响应。（对于像 `ActionListener`\
  \ 这样只有一个方法的接口，不需要适配器类。）\n\n让我们利用这个窗口适配器。我们可以扩展 `WindowAdapter` 类，继承其中的六个空方法，并重写\
  \ `windowClosing` 方法：\n\n```java\nclass Terminator extends WindowAdapter\n{\n  \
  \ public void windowClosing(WindowEvent e)\n   {\n      if (user agrees)\n     \
  \    System.exit(0);\n   }\n}\n```\n\n现在你可以将一个 `Terminator` 类型的对象注册为事件监听器了：\n\n\
  ```java\nWindowListener listener = new Terminator();\nframe.addWindowListener(listener);\n\
  ```\n\n每当框架生成窗口事件时，它都会通过调用七个方法之一将事件传递给 `listener` 对象（参见图 8.5）。这些方法中有六个是不起作用的；`windowClosing`\
  \ 方法调用 `System.exit(0)`，终止应用程序。\n\n![Image](img/image0106.jpeg)\n\n图 8.5. 窗口监听器\n\
  \n***\n\n![Image](img/image0095.jpeg) 注意\n\n如果你在扩展适配器类时拼错了方法名称，编译器将无法捕获该错误。例如，在\
  \ `WindowAdapter` 类中定义 `windowClosing` 方法，它不会执行任何操作。让我们让我们这个窗口适配器。我们可以扩展 `WindowAdapter`\
  \ 类，继承六个空方法，并重写 `windowClosing` 方法：\n\n```java\nclass Terminator extends WindowAdapter\n\
  {\n   public void windowClosing(WindowEvent e)\n   {\n      if (user agrees)\n \
  \        System.exit(0);\n   }\n}\n```\n\n现在你可以将一个 `Terminator` 类型的对象注册为事件监听器：\n\
  \n```java\nWindowListener listener = new Terminator();\nframe.addWindowListener(listener);\n\
  ```\n\n每当框架生成窗口事件时，它都会通过调用七个方法之一将事件传递给 `listener` 对象（参见图 8.5）。这些方法中有六个是不起作用的；`windowClosing`\
  \ 方法调用 `System.exit(0)`，终止应用程序。\n\n### 8.2 Actions（动作）\n\n通常会有多种方式激活同一个命令。用户可以通过菜单、快捷键或工具栏上的按钮选择某个功能。这在\
  \ AWT 事件模型中很容易实现：将所有事件链接到同一个监听器。例如，假设 `blueAction` 是一个动作监听器，其 `actionPerformed`\
  \ 方法更改背景颜色。你可以将同一个对象作为监听器附加到多个事件源：\n\n- 标记为“Blue”的工具栏按钮\n- 标记为“Blue”的菜单项\n- 快捷键\
  \ Ctrl+B\n\n颜色更改现在统一处理，无论是由点击按钮、选择菜单还是按键引起的。\n\nSwing 包提供了一个非常有用的机制来封装命令并将其附加到多个事件源：`Action`\
  \ 接口。一个*动作*是一个封装了以下内容的对象：\n\n- 命令描述（作为文本字符串和可选图标）；\n- 执行命令所需的参数（例如我们示例中的请求颜色）。\n\
  \n`Action` 接口具有以下方法：\n\n```java\nvoid actionPerformed(ActionEvent event)\nvoid setEnabled(boolean\
  \ b)\nboolean isEnabled()\nvoid putValue(String key, Object value)\nObject getValue(String\
  \ key)\nvoid addPropertyChangeListener(PropertyChangeListener listener)\nvoid removePropertyChangeListener(PropertyChangeListener\
  \ listener)\n```\n\n\n\n\n第一种方法是 `ActionListener` 接口熟悉的方法：实际上，`Action` 接口扩展了 `ActionListener`\
  \ 接口。因此，每当需要 `ActionListener` 对象时，你都可以使用 `Action` 对象。\n\n接下来两个方法允许你启用或禁用动作（action），并检查动作当前是否处于启用状态。当动作被绑定到菜单或工具栏上且该动作被禁用时，相应的备选项将显示为灰色。\n\
  \n`putValue` 和 `getValue` 方法允许你在 `Action` 对象中存储和检索任意的键/值对。两个重要的预定义字符串，即 `Action.NAME`\
  \ 和 `Action.SMALL_ICON`，将动作名称和图标存储到 `Action` 对象中：\n\n点击此处查看代码图片\n\n```\naction.putValue(Action.NAME,\
  \ \"Blue\");\n\naction.putValue(Action._ICON, new ImageIcon(\"blue-ball.gif\"));\n\
  ```\n\n表 8.1 显示了所有预定义的动作表名称。\n\n表 8.1 预定义动作表名称\n\n![Image](img/image01066.jpeg)\n\
  \n如果动作对象被添加到菜单或工具栏中，名称和图标会自动检索并显示在菜单项或工具栏按钮中。`SHORT_DESCRIPTION` 值将变为工具提示（tooltip）。\n\
  \n`Action` 接口的最后两个方法允许其他对象（特别是触发该动作的菜单或工具栏）在动作属性发生变化时接收通知。例如，如果一个菜单作为动作对象的属性变化监听器，并且动作对象随后被禁用，则菜单会被调用并将动作名称设为灰色。属性变化监听器（Property\
  \ change listeners）是一种通用结构，是“JavaBeans”组件模型的一部分。你可以在第二卷中找到更多关于 bean 及其属性的知识。\n\n\
  注意 `Action` 是一个接口，而不是类。任何实现此接口的类必须实现我们刚刚讨论的七个方法。幸运的是，一位热心的人提供了一个 `AbstractAction`\
  \ 类，它实现了除 `actionPerformed` 之外的所有方法。该类负责存储所有的键/值对并管理属性变化监听器。你只需要扩展 `AbstractAction`\
  \ 并提供一个 `actionPerformed` 方法即可。\n\n让我们构建一个可以执行颜色更改命令的动作对象。我们存储命令的名称、图标和所需的颜色。我们将颜色存储在\
  \ `AbstractAction` 类提供的键/值对表中。这里是 `ColorAction` 类的代码。构造函数设置了键/值对，而 `actionPerformed`\
  \ 方法执行颜色更改动作。\n\n点击此处查看代码图片\n\n```java\npublic class ColorAction extends AbstractAction\n\
  \n{\n    public ColorAction(String name, Icon icon, Color c)\n    {\n        putValue(Action.NAME,\
  \ name);\n        putValue(Action.SMALL_ICON, icon);\n        putValue(\"color\"\
  , c);\n        putValue(Action.SHORT_DESCRIPTION, \"Set panel color to \" + name.toLowerCase());\n\
  \    }\n    public void actionPerformed(ActionEvent event)\n    {\n        Color\
  \ c = (Color) getValue(\"color\");\n        buttonPanel.setBackground(c);\n    }\n\
  }\n```\n\n我们的测试程序创建了该类的三个对象，例如：\n\n`Action blueAction = new ColorAction(\"Blue\"\
  , new ImageIcon(\"blue-ball.gif\"), Color.BLUE);`\n\n接下来，将此动作与按钮关联。这很容易，因为我们可以使用接收\
  \ `Action` 对象的 `JButton` 构造函数。\n\n```java\nJButton blueButton = new JButton(blueAction);\n\
  ```\n\n该构造函数从动作中读取名称和图标，将短描述设置为工具提示，并将动作设置为监听器。你可以在图 8.6 中看到图标和工具提示。\n\n![Image](img/image01067.jpeg)\n\
  \n图 8.6 按钮显示了来自动作对象的图标。\n\n正如我们在下一章中演示的，将相同的动作添加到菜单中同样简单。\n\n最后，我们想将动作对象关联到按键（keystrokes）上，这样当用户输入键盘命令时就会执行动作。要将动作与按键关联，你首先需要生成\
  \ `KeyStroke` 类的对象。这是一个封装了键描述的便利类。要生成 `KeyStroke` 对象，你不需要调用构造函数，而是使用 `KeyStroke`\
  \ 类的静态方法 `getKeyStroke`。\n\n```java\nKeyStroke ctrlBKey = KeyStroke.getKeyStroke(\"\
  ctrl B\");\n```\n\n为了理解下一步，你需要理解键盘焦点（keyboard focus）的概念。用户界面可以有许多按钮、菜单、滚动条和其他组件。当你按下一个键时，它会被发送到具有焦点的组件。该组件通常（但并非总是）在视觉上被区分开。例如，在\
  \ Java 视图外观中，具有焦点的按钮周围有一个细细的矩形框。\n\n如果一个按键出现在多个 `WHEN_IN_FUSED_WINDOW` 映射中，那么这个过程就是脆弱的。Swing\
  \ 设计者想出了方便的解决方案。表 8.2 给出了以下顺序：\n\n1. 检查焦点组件的 `WHEN_FOCUSED` 映射。如果按键存在，则执行相应的动作。\n\
  2. 从具有焦点的组件开始，检查其父级的 `WHEN_ANCESTOR_OF_FUSED_WINDOW` 映射。一旦找到映射，执行相应的动作。\n3. 查看窗口中所有可见且启用的组件，它们在\
  \ `WHEN_IN_WINDOW` 映射中注册了该按键。给这些组件（按注册顺序）执行动作的机会。一旦执行了第一个可用动作，停止处理。\n\n要从组件获取输入映射，使用\
  \ `getInputMap` 方法。这是一个示例：\n\n`InputMap imap = panel.getInputMap(JComponent.WHEN_FOCUSED);`\n\
  \n这意味着当当前组件具有键盘焦点时会查询此映射。在我们的情况下，这不是我们想要的映射。具有输入焦点的是按钮而不是面板。其他两种映射选择都适用于插入颜色更改按键。我们在示例中使用\
  \ `WHEN_ANCESTOR_OF_FOCUSED_WINDOW`。\n\n`InputMap` 不直接将 `KeyStroke` 对象映射到 `Action`\
  \ 对象。相反，它映射到任意对象，而由 `ActionMap` 类实现的第二个映射将对象映射到动作。这使得来自不同输入映射的按键共享相同的动作变得更容易。\n\n\
  因此，每个组件都有三个输入映射和一个动作映射。为了将它们连接起来，你需要为动作命名。这里是你可以将键绑定到动作的方法：\n\n```java\nimap.put(KeyStroke.getKeyStroke(\"\
  ctrl Y\"), \"panel.yellow\");\n\nActionMap amap = panel.getActionMap();\n\namap.put(\"\
  panel.yellow\", yellowAction);\n```\n\n通常使用字符串 `\"none\"` 作为无操作动作。这使得禁用一个按键变得简单：\n\
  \n`imap.put(KeyStroke.getKeyStroke(\"ctrl C\"), \"none\");`\n\n\n\n\n\nJDK 文档建议使用动作名称（action\
  \ name）作为动作的键。我们认为这并不是好主意。动作名称显示在按钮和菜单项上；因此，它可能会随 UI 设计师的心意改变，并被翻译成多种语言。这些不稳定的字符串不适合作为查找键（lookup\
  \ keys），因此建议你设计与显示名称独立的动作名称。\n\n***\n\n总结一下，为了响应按钮、菜单项或按键并执行相同的动作，你需要执行以下操作：\n\n\
  1.  实现一个继承自 `AbstractAction` 类的类。你可以使用同一个类处理多个相关的动作。\n2.  构造动作类的对象。\n3.  从动作对象构造一个按钮或菜单项。构造函数将从动作对象中读取标签文本和图标。\n\
  4.  对于可以通过按键触发的动作，你必须执行额外的步骤。首先，找到窗口的顶层组件，例如包含所有其他组件的面板。\n5.  然后，获取顶层组件的 `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`\
  \ 输入映射（input map）。为所需的按键创建一个 `KeyStroke` 对象。创建一个动作键对象（例如描述你的动作的字符串）。将键对（按键，动作键）添加到输入映射中。\n\
  6.  最后，获取顶层组件的动作映射（action map）。将键对（动作键，动作对象）添加到映射中。\n\nListing 8.3 显示了将按钮和按键映射到动作对象的程序完整代码。尝试一下——点击按钮或按下\
  \ Ctrl+Y、Ctrl+B 或 Ctrl+R 改变面板颜色。\n\n`action/ActionFrame.java`\n\n点击此处查看代码图像\n\n\
  ***\n\n```java\npackage action;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个带有面板的框架，演示了颜色改变动作。\n */\npublic class ActionFrame\
  \ extends JFrame\n{\n    private JPanel buttonPanel;\n    private static final int\
  \ DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\n \
  \   public ActionFrame()\n    {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  \n        buttonPanel = new JPanel();\n\n        // 定义动作\n        Action yellowAction\
  \ = new ColorAction(\"Yellow\", new ImageIcon(\"yellow-ball.gif\"), Color.YELLOW);\n\
  \        Action blueAction = new ColorAction(\"Blue\", new ImageIcon(\"blue-ball.gif\"\
  ), Color.BLUE);\n        Action redAction = new ColorAction(\"Red\", new ImageIcon(\"\
  red-ball.gif\"), Color.RED);\n\n        // 为这些动作添加按钮\n        buttonPanel.add(new\
  \ JButton(yellowAction));\n        buttonPanel.add(new JButton(blueAction));\n \
  \       buttonPanel.add(new JButton(redAction));\n\n        // 将面板添加到框架\n      \
  \  add(buttonPanel);\n\n        // 将 Y, B 和 R 键与名称关联\n        InputMap imap = buttonPanel.getInputMap(JComponent.WHEN_ANCESTOR_OF_FOCUSED_COMPONENT);\n\
  \        imap.put(KeyStroke.getKeyStroke(\"ctrl Y\"), \"panel.yellow\");\n     \
  \   imap.put(KeyStroke.getKeyStroke(\"ctrl B\"), \"panel.blue\");\n        imap.put(KeyStroke.getKeyStroke(\"\
  ctrl R\"), \"panel.red\");\n\n        // 将名称与动作关联\n        ActionMap amap = buttonPanel.getActionMap();\n\
  \        amap.put(\"panel.yellow\", yellowAction);\n        amap.put(\"panel.blue\"\
  , blueAction);\n        amap.put(\"panel.red\", redAction);\n    }\n\n    public\
  \ class ColorAction extends AbstractAction\n    {\n        /**\n         * 构造一个颜色动作。\n\
  \         * @param name 显示在按钮上的名称\n         * @param icon 显示在按钮上的图标\n         *\
  \ @param c 背景颜色\n         */\n        public ColorAction(String name, Icon icon,\
  \ Color c)\n        {\n            putValue(Action.NAME, name);\n            putValue(Action.SMALL_ICON,\
  \ icon);\n            putValue(Action.SHORT_DESCRIPTION, \"Set panel to \" + name.toLowerCase());\n\
  \            putValue(\"color\", c);\n        }\n\n        public void actionPerformed(ActionEvent\
  \ event)\n        {\n            Color c = (Color) getValue(\"color\");\n      \
  \      buttonPanel.setBackground(c);\n        }\n    }\n}\n```\n\n***\n\n`javax.swing.Action`\n\
  - `boolean isEnabled()`\n- `void setEnabled(boolean b)` 获取或设置此动作的 `enabled` 属性。\n\
  - `void putValue(String key, Object value)` 在动作对象内部放置一个键/值对。\n![Image](img/image01069.jpeg)\n\
  - `Object getValue(String key)` 返回存储的键/值对的值。\n\n***\n\n`javax.swing.KeyStroke`\n\
  - `static KeyStroke getKeyStroke(String description)` 从人类可读的描述（一组由空格分隔的字符串）构造按键。描述以零或多个修饰符\
  \ `shift control meta alt altGraph` 开始，并以字符串 `typed` 结束，随后跟上一个单字符字符串（例如 `\"typed\
  \ a\"`）或可选的事件指定符（`pressed` 或 `released`，`pressed` 为默认值），然后是键码。\n\n***\n\n`javax.swing.JComponent`\n\
  - `ActionMap getActionMap()` 返回将动作键（任意对象）与 `Action` 对象关联的映射。\n- `InputMap getInputMap(int\
  \ flag)` 获取将按键映射到动作键的映射。\n![Image](img/image1070.jpeg)\n\n***\n\n### 8.3 鼠标事件\n\n\
  如果你只想让用户点击按钮或菜单，不需要显式处理鼠标事件。这些鼠标操作由用户界面中的各种组件处理。然而，如果你想让用户用鼠标绘图，你需要捕捉鼠标移动、点击和拖拽事件。\n\
  \n在本节中，我们将展示一个简单的图形编辑器程序，允许用户在画布上放置、移动和删除矩形（参见图 8.7）。\n\n![Image](img/image1071.jpeg)\n\
  \n8.7 测试程序\n\n当用户点击鼠标按钮时，会调用三个监听方法：按下时的 `mousePressed`、释放时的 `mouseReleased` 以及最后是\
  \ `mouseClicked`。如果你只感兴趣点击，可以忽略前两个方法。通过使用 `MouseEvent` 参数的 `getX` 和 `getY` 方法，你可以获取鼠标指针在点击点击时的\
  \ x 和 y 坐标。要区分单击、双击和三击，请使用 `getClickCount` 方法。\n\n某些用户界面设计师向用户施加鼠标点击和键盘修饰符组合，例如\
  \ Ctrl + Shift + 点击。我们认为这种做法是错误的，但如果你不同意，你会发现检查鼠标按钮和键盘修饰符是一团糟。\n\n使用位掩码测试设置了哪些修饰符。在原始\
  \ API 中，两个按钮掩码等于两个键盘修饰符掩码，即\n\n`BUTTON2_MASK == ALT_MASK`\n\n`BUTTON3_MASK == META_MASK`\n\
  \n这样做是为了让单键鼠标可以通过按住修饰键模拟其他鼠标按钮。然而，从 Java SE 1.4 开始，建议使用不同的方法。现在有了掩码：\n\n`BUTTON1_DOWN_MASK`\n\
  \n`BUTTON2_DOWN_MASK`\n\n`BUTTON3_DOWN_MASK`\n\n`SHIFT_DOWN_MASK`\n\n`CTRL_DOWN_MASK`\n\
  \n`ALT_DOWN_MASK`\n\n`ALT_GRAPH_DOWN_MASK`\n\n`META_DOWN_MASK`\n\n`getModifiersEx`\
  \ 方法能够准确报告鼠标事件的鼠标按钮和键盘修饰符。\n\n\n\n\n\n注意 `BUTTON3_DOWN_MASK` 在 Windows 下用于测试右键（非主键）鼠标。例如，你可以使用下面的代码来检测右键是否被按下：\n\
  \n点击此处查看代码图片\n\n```java\nif ((event.getModifiersEx() & InputEvent.BUTTON3_DOWN_MASK)\
  \ != 0)\n    . . . // 右键点击代码\n```\n\n在我们的示例程序中，我们同时提供了 `mousePressed` 和 `mouseClicked`\
  \ 方法。当你点击一个不在任何已绘制正方形内部的像素点时，会添加一个新的正方形。我们将此功能实现在 `mousePressed` 方法中，这样用户就能获得即时反馈，而无需等待鼠标按钮释放。当用户在现有正方形内双击时，该正方形会被擦除。我们将此功能实现在\
  \ `mouseClicked` 方法中，因为我们需要获取点击计数次数。\n\n点击此处查看代码图片\n\n```java\npublic void mousePressed(MouseEvent\
  \ event)\n{\n    current = find(event.getPoint());\n    if (current == null) //\
  \ 不在正方形内部\n        add(event.getPoint());\n}\n\npublic void mouseClicked(MouseEvent\
  \ event)\n{\n    current = find(event.getPoint());\n    if (current != null && event.getClickCount()\
  \ >= 2)\n        remove(current);\n}\n```\n\n当鼠标在窗口移动时，窗口会接收到大量的鼠标移动事件。注意 `MouseListener`\
  \ 和 `MouseMotionListener` 是独立的接口。这样做是为了效率——用户移动鼠标时会产生大量的事件，而只关心点击的监听器就不会被这些移动骚扰。\n\
  \n我们的测试应用程序捕获鼠标移动事件，当鼠标位于正方形上方时将光标变为不同的形状（准星）。这是通过 `Cursor` 类的 `getPredefinedCursor`\
  \ 方法实现的。表 8.3 列出了此方法使用的常量，以及在 Windows 下的光标样式。\n\n表 8.3 示例光标\n\n![图片](img/image0107.jpeg)\n\
  \n以下是示例程序中 `MouseMotionListener` 的 `mouseMoved` 方法：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ void mouseMoved(MouseEvent event)\n{\n    if (find(event.getPoint()) == null)\n\
  \        setCursor(Cursor.getDefaultCursor());\n    else\n        setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  }\n```\n\n***\n\n![图片](img/image00948.jpeg) 你还可以通过 `Toolkit` 类中的 `createCustomCursor`\
  \ 方法定义自定义的光标类型：\n\n点击此处查看代码图片\n\n```java\nToolkit tk = Toolkit.getDefaultToolkit();\n\
  Image img = tk.getImage(\"dynamite.gif\");\nCursor dynamiteCursor = tk.createCustomCursor(img,\
  \ new Point(10, 10), \"dynamite stick\");\n```\n\n`createCustomCursor` 的第一个参数指向光标图像。第二个参数是光标的“热点”偏移量。第三个参数是描述光标的字符串。这个字符串可以用于辅助功能。例如，屏幕阅读器可以为视障人士或没有盯着屏幕的用户读取光标描述。\n\
  \n***\n\n如果用户在鼠标移动时按下鼠标按钮，产生的 `mouseDragged` 调用而不是 `mouseMoved`。我们的测试应用程序允许用户拖动光标下的正方形。我们简单地更新当前拖动的矩形使其位于鼠标位置居中。然后重绘画布以显示新的鼠标位置。\n\
  \n点击此处查看代码图片\n\n```java\npublic void mouseDragged(MouseEvent event)\n{\n    if (current\
  \ != null)\n    {\n        int x = event.getX();\n        int y = event.getY();\n\
  \        current.setFrame(x - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n\
  \        repaint();\n    }\n}\n```\n\n***\n\n![图片](img/image00948.jpeg) 注意只要鼠标留在组件内部，`mouseMoved`\
  \ 方法就会被调用。然而，当鼠标被拖到组件外部时，`mouseDragged` 方法仍持续被调用。\n\n***\n\n还有两个鼠标事件方法：`mouseEntered`\
  \ 和 `mouseExited`。这些方法在鼠标进入或离开组件时被调用。\n\n最后，我们解释如何监听鼠标事件。鼠标点击通过 `mouseClicked` 程序报告，它是\
  \ `MouseListener` 接口的一部分。许多应用程序只对点击感兴趣，由于鼠标移动事件发生频繁，移动和拖拽事件定义在独立的接口 `MouseMotionListener`\
  \ 中。\n\n我们的程序对这两种鼠标事件感兴趣。我们定义了两个内部类：`MouseHandler` 和 `MouseMotionHandler`。`MouseHandler`\
  \ 类扩展了 `MouseAdapter` 类，因为它只定义了五个 `MouseListener` 方法中的两个。`MouseMotionHandler` 实现\
  \ `MouseMotionListener` 并定义了该接口的所有方法。列表 8.4 是程序代码。\n\n代码列表 8.4. mouse/MouseFrame.java\n\
  \n点击此处查看代码图片\n\n```java\npackage mouse;\n\nimport javax.swing.*;\n\n/**\n * 一个包含测试操作面板的框架\n\
  \ */\npublic class MouseFrame extends JFrame\n{\n    public MouseFrame()\n    {\n\
  \        add(new MouseComponent());\n        pack();\n    }\n}\n```\n\n代码列表 8.5.\
  \ mouse/MouseComponent.java 点击此处查看代码图片\n\n```java\npackage mouse;\n\nimport java.awt.*;\n\
  import java.awt.event.*;\nimport java.awt.geom.*;\nimport java.util.*;\nimport java.swing.*;\n\
  \n/**\n * 一个具有添加和删除鼠标操作的组件\n */\npublic class MouseComponent extends JComponent\n\
  {\n    private static int SIDELENGTH = 10;\n    private ArrayList<Rectangle2D> squares;\n\
  \    private Rectangle2D current;\n\n    public MouseComponent()\n    {\n      \
  \  squares = new ArrayList<>();\n        current = null;\n        addMouseListener(new\
  \ MouseHandler());\n        addMouseMotionListener(new MouseMotionHandler());\n\
  \    }\n\n    public void paintComponent(Graphics g)\n    {\n        Graphics2D\
  \ g2 = (Graphics2D) g;\n        // 绘制所有正方形\n        for (Rectangle2D r : squares)\n\
  \            g2.draw(r);\n    }\n\n    /**\n     * 查找包含点的正方形。\n     * @param p 一个点\n\
  \     * @return 包含 p 的第一个正方形\n     */\n    public Rectangle2D find(Point2D p)\n\
  \    {\n        for (Rectangle2D r : squares)\n        {\n            if (r.contains(p))\
  \ return r;\n        }\n        return null;\n    }\n\n    /**\n     * 向集合中添加正方形。\n\
  \     * @param p 正方形的中心\n     */\n    public void add(Point2D p)\n    {\n      \
  \  double x = p.getX();\n        double y = p.getY();\n\n        current = new Rectangle2D.Double(x\
  \ - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n        squares.add(current);\n\
  \        repaint();\n    }\n\n    /**\n     * 从集合中移除正方形。\n     * @param s 要移除的正方形\n\
  \     */\n    public void remove(Rectangle2D s)\n    {\n        if (s == null) return;\n\
  \        if (s == current) current = null;\n        squares.remove(s);\n       \
  \ repaint();\n    }\n\n    // 包含鼠标光标的正方形\n    private class MouseHandler extends\
  \ MouseAdapter\n    {\n        public void mousePressed(MouseEvent event)\n    \
  \    {\n            // 如果光标不在正方形内部，则添加新正方形\n            current = find(event.getPoint());\n\
  \        }\n    }\n\n    private class MouseMotionHandler implements MouseMotionListener\n\
  \    {\n        public void mouseMoved(MouseEvent event)\n        {\n          \
  \  if (find(event.getPoint()) == null)\n                setCursor(Cursor.getDefaultCursor());\n\
  \            else\n                setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```java\nif (current == null) add(event.getPoint());\n\
  }\n\npublic void mouseClicked(MouseEvent event)\n{\n    // 如果双击，则移除当前矩形\n    current\
  \ = find(event.getPoint());\n    if (current != null && event.getClickCount() >=\
  \ 2) remove(current);\n}\n\nprivate class MouseMotionHandler implements MouseMotionListener\n\
  {\n    public void mouseMoved(MouseEvent event)\n    {\n        // 如果在矩形内部，将鼠标指针设置为十字形\n\
  \        if (find(event.getPoint()) == null) setCursor(Cursor.getDefaultCursor());\n\
  \        else setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  \    }\n\n    public void mouseDragged(MouseEvent event)\n    {\n        if (current\
  \ != null)\n        {\n            int x = event.getX();\n            int y = event.getY();\n\
  \n            // 拖动当前矩形使其中心位于 (x, y)\n            current.setFrame(x - SIDELENGTH\
  \ / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n            repaint();\n  \
  \      }\n    }\n}\n```\n\n### java.awt.event.MouseEvent 1.1 \n\n- `int getX()`\n\
  - `int getY()`\n- `Point getPoint()`\n返回事件发生点的 `x`（水平）和 `y`（垂直）坐标，该坐标从事件源组件的左上角开始测量。\n\
  \n- `int getClickCount()`\n返回与此事件相关的连续鼠标点击次数。（构成“连续”的时间间隔取决于系统。）\n\n### java.awt.event.InputEvent\
  \ 1.1 \n\n- `int getModifiersEx()` 1.4\n返回用于此事件的扩展修饰符或“按下”状态修饰符。使用以下掩码值来测试返回值：\n\
  `BUTTON1_DOWN_MASK`\n`BUTTON2_DOWN_MASK`\n`BUTTON3_DOWN_MASK`\n`SHIFT_DOWN_MASK`\n\
  `CTRL_DOWN_MASK`\n`ALT_DOWN_MASK`\n`ALT_GRAPH_DOWN_MASK`\n`META_DOWN_MASK`\n- `static\
  \ String getModifiersExText(int modifiers)` 1.4\n返回一个如 `\"Shift+Button1\"` 的字符串，描述给定标志\
  \ set 中的扩展修饰符或“按下”修饰符。\n\n### java.awt.Toolkit 1.0 \n\n- `public Cursor createCustomCursor(Image\
  \ image, Point hotSpot, String name)` 1.2\n创建一个自定义光标对象。\n\n![Image](img/image01073.jpeg)\n\
  \n### java.awt.Component 1.0 \n\n- `public void setCursor(Cursor cursor)` 1.1\n\
  将光标图像设置为指定的光标。\n\n### 8.4. AWT 事件层级结构\n\n在让您了解了事件处理的基本工作原理后，我们通过概述 AWT 事件处理架构来结束本章。\n\
  \n正如我们之前简要提到的，Java 中的事件处理是面向对象的，所有事件都派生继承自 `java.util` 包中的 `EventObject` 类。（这个公共父类不叫\
  \ `Event`，因为那是旧事件模型中事件类的名称。虽然旧模型现在已经废弃了，但它的类仍然是 Java 库的一部分。）\n\n`EventObject` 类有一个子类\
  \ `AWTEvent`，它是所有 AWT 事件类的父类。图 8.8 显示了 AWT 事件的继承图。\n\n![Image](img/image01074.jpeg)\n\
  \n图 8.8. AWT 事件类的继承图\n\n某些 Swing 组件会生成更多类型事件的事件对象；这些对象直接继承自 `EventObject`，而不是 `AWTEvent`。\n\
  \n事件对象封装了事件源向其监听器通信的事件信息。当需要时，你可以分析传递给监听器对象的事件对象，就像我们在按钮示例中使用 `getSource` 和 `getActionCommand`\
  \ 方法所做的那样。\n\n一些 AWT 事件类对于 Java 程序员来说没有实际用处。例如，AWT 会将 `PaintEvent` 对象插入事件队列，但这些对象不会被传递给监听器。Java\
  \ 程序员不会监听绘图事件；相反，他们通过重写 `paintComponent` 方法来控制重绘。AWT 还生成许多只有系统程序员才需要的事件，用于为意文字语言提供输入系统、自动化测试机器人等。我们不讨论这些特殊的事件类型。\n\
  \n#### 8.4.1. 语义事件与底层事件\n\nAWT 在*低层*事件和*语义*事件之间做了非常有用的区分。语义事件是表达用户正在做什么的事件，例如“点击那个按钮”；`ActionEvent`\
  \ 就是一个语义事件。底层事件是使这种操作成为可能的事件。在点击按钮的情况下，这是一个鼠标按下、一系列鼠标移动和一次鼠标释放（但只有当鼠标释放在按钮区域内时才如此）。或者它可能是一个按键，如果用户使用\
  \ Tab 键选择按钮然后用空格键激活它，就会发生这种情况。同样，调整滚动条是一个语义事件，但拖动鼠标是一个底层事件。\n\n以下是 `java.awt.event`\
  \ 包中通常用的语义事件类：\n\n- `ActionEvent`（用于按钮点击、菜单选择、选择列表项，或在文本字段中输入回车键）\n- `AdjustmentEvent`（用户调整了滚动条）\n\
  - `ItemEvent`（用户对复选框进行了选择）\n\n五个常用的底层事件类是：\n\n- `KeyEvent`（按键按下或释放）\n- `MouseEvent`（鼠标按钮按下、释放、移动或拖动）\n\
  - `MouseWheelEvent`（鼠标轮旋转）\n- `FocusEvent`（组件获得或失去焦点）\n- `WindowEvent`（窗口状态改变）\n\
  \n以下接口监听这些事件：\n\n点击此处查看\n\n- `ActionListener`\n- `AdjustmentListener`\n- `FocusListener`\n\
  - `ItemListener`\n- `KeyListener`\n- `MouseListener`\n- `MouseMotionListener`\n\
  - `MouseWheelListener`\n- `WindowEvent`\n\n若干 AWT 监听器（那些具有多个方法的）都有一个对应的适配类，该类实现了所有方法但不执行任何操作。（其他接口只有一个方法，因此没有必要提供适配类。）这里是常用的适配类：\n\
  \n- `FocusAdapter`\n- `KeyAdapter`\n- `MouseAdapter`\n- `MouseMotionAdapter`\n-\
  \ `MouseWheelAdapter`\n- `WindowAdapter`\n\n表 8.4 显示了最重要的 AWT 监听接口、事件和事件源。\n\n表\
  \ 8.4 总结\n\n![Image](img/image01075.jpeg)![Image](img/image01076.jpeg)\n\n`javax.swing.event`\
  \ 包包含了某些特定于 Swing 的事件。我们将在下一章介绍其中一部分。\n\n到此，对 AWT 事件处理的讨论结束。下一章将展示如何组合常用的 Swing\
  \ 组件，并详细介绍它们生成的事件。\n\n## 第 9 章 使用 Swing 构建用户界面\n\n* * *\n\n在本章中\n\n- Swing 与模型-视图-控制器设计模式\n\
  - 布局管理引言\n- 文本输入\n- 选择组件\n- 菜单\n- 复杂的布局管理\n- 对话框\n\n* * *\n\n上一章主要是为了向你展示如何使用 Java\
  \ 的事件模型。在此过程中，你迈出了学习构建图形用户界面的第一步。本章将向你展示构建功能更全 GUI 所需的最重要工具。\n\n\n\n\n\n我们将首先介绍\
  \ `Swing` 的架构基础。了解“底层”到底运行了什么，对于理解如何有效地使用一些高级的组件至关重要。接着，我们将向你展示如何使用 `Swing` 中最常用的用户界面组件，如文本字段、单选按钮和菜单。然后，你将学习如何利用\
  \ Java 巧妙的布局管理器功能将这些组件排列在窗口中，无论特定用户界面的外观（look-and-feel）如何。最后，你将看到如何在 `Swing` 中实现对话框。\n\
  \n本章涵盖了基础的 `Swing` 组件，如文本组件、按钮和滑块。这些是你最频繁需要使用的本质用户界面组件。我们将在第二卷中介绍高级的 `Swing` 组件。\n\
  \n## 9.1 Swing 与模型-视图-控制器设计模式\n\n正如所言，我们本章将从描述 `Swing` 组件的架构开始。我们首先讨论设计模式的概念，然后查看对\
  \ `Swing` 框架设计产生巨大影响的“模型-视图-控制器”模式。\n\n### 9.1.1 设计模式\n\n在解决问题时，你通常不会从第一原理导出解决方案。相反，你可能会受到过去经验的引导，或者可能会向其他专家寻求关于什么对他们有效的建议。设计模式是以结构化方式呈现这些专业知识的方法。\n\
  \n近年来，软件工程师开始汇集此类模式的目录。该领域的先驱深受建筑师克里斯托弗·历山大（Christopher Alexander）建筑设计模式的启发。在他的著作《建筑的艺术》（*The\
  \ Timeless Way of Building*, Oxford University Press, 1979）中，Alexander 提供了一份设计公共和私人居住空间的模式目录。这是一个典型的例子：\n\
  \n**窗边之地**\n\n每个人都喜欢窗边、凸窗以及带有低窗台并配有舒适靠椅的大窗户……一个没有这种地方的房间很少能让你感到舒适或完全的放松……\n\n如果房间里没有可以作为“地方”的窗户，房间里的人会在两种力量之间挣扎：(1)\
  \ 他想坐下来感到舒适，而(2) 他被光线吸引。\n\n显然，如果舒适的地方——即房间里你最想坐的地方——远离窗户，那么没有办法克服这种冲突……\n\n因此：在每天你待得久的每个房间里，至少让一扇窗户变成一个“窗边之地”。(图\
  \ 9.1)\n\n![Image](img/image01077.jpeg)\n\n图 9.1 窗边之地\n\nAlexander 目录中的每个模式以及软件模式目录中的模式，都遵循特定的格式。模式首先描述一个上下文（context），即产生设计问题的情况。然后，解释该问题，通常表现为一组冲突的力量。最后，解决方案展示了一个平衡这些力量的配置。\n\
  \n在“窗边之地”模式中，上下文是你白天度过的的任何长时间的房间。冲突的力量是你想坐下来感到舒适，以及你被光线所吸引。解决方案是创建一个“窗边之地”。\n\n\
  在将在下一节中描述的“模型-视图-控制器”模式中，上下文是一个呈现信息并接收用户输入的用户界面系统。这里存在几种力量：可能对相同数据有多种视觉表示形式，它们需要同时更新。视觉表示可能会改变，例如为了适应不同的外观标准。交互机制可能会改变，例如为了支持语音命令。解决方案是将职责分配到三个相互作用的独立组件：模型（model）、视图（view）和控制器（controller）。\n\
  \n模型-视图-控制器模式并不是 `AWT` 和 `Swing` 设计中唯一的模式。这里是几个额外的例子：\n\n- 容器和组件是“组合”（composite）模式的示例。\n\
  - 滚动面板是一个“装饰器”（decorator）。\n- 布局管理器遵循“策略”（strategy）模式。\n\n设计模式的一个重要方面是，它们成为了文化的一部分。全世界的程序员在谈论模型-视图-控制器模式或装饰器模式时都能理解你的意思。因此，模式成为了讨论设计问题的高效方式。\n\
  \n你可以在模式运动的奠基书中找到许多实用软件模式的正式描述，即 Erich Gamma 等人编写的《设计模式：可重用对象软件的基础》（*Design Patterns—Elements\
  \ of Reusable Object-Oriented Software*, Addison-Wesley, 1995）。我们还非常推荐 Frank Buschmann\
  \ 等人的优秀著作《模式系统》（*A System of Patterns*, John Wiley & Sons, 1996），我们认为这本书不那么深奥，但更易于理解。\n\
  \n### 9.1.2 模型-视图-控制器模式\n\n让我们停顿一下，思考构成用户界面组件（如按钮、复选框、文本字段或复杂的树形控件）的各个部分。每个组件都有三个特征：\n\
  \n- 它的内容，例如按钮的状态（按下或未按下），或文本字段中的文本\n- 它的视觉外观（颜色、大小等）\n- 它的行为（对事件的反应）\n\n即使是按钮这样看似简单的组件，在这些特征之间也表现出中等复杂的交互。显然，按钮的外观取决于外观标准。Metal\
  \ 按钮看起来与 Windows 按钮或 Motif 按钮不同。此外，外观取决于按钮状态；当按钮被按下时，它需要重绘以显示出不同。状态取决于按钮接收到的事件。当用户按下按钮内部时，按钮处于按下状态。\n\
  \n当然，当你在程序中使用按钮时，你仅仅将其视为一个按钮；你不会过多地考虑内部工作原理和特征。毕竟，那是实现按钮的程序员的工作。然而，实现按钮和其他所有用户界面组件的程序员更有动力去深入思考它们，以确保无论什么外观标准有效都能良好工作。\n\
  \n为了实现这一点，Swing 设计者转向了一个广知的设计模式：模型-视图-控制器模式。这种模式与其他许多设计模式一样，追溯到我们在第 5 章中提到的面向对象设计原则之一：不要让一个对象承担过多责任。不要让一个按钮类完成一切。相反，将组件的外观与一个对象关联，并将内容存储另一个对象中。模型-视图-控制器（MVC）设计模式教你如何实现这一目标。实现三个独立的类：\n\
  \n- 模型，存储内容\n- 视图，显示内容\n- 控制器，处理用户输入\n\n该模式精确规定了这三个对象如何相互作用。模型存储内容且没有用户界面。对于按钮来说，内容非常简单——只需一组小标记，告知按钮当前是按下还是弹起、激活还是未激活等。对于文本字段，内容更有趣。它是一个持有当前文本的字符串对象。这与内容的视图并不等同——如果内容大于文本字段，用户只能看到显示的部分文本（参见图\
  \ 9.2）。\n\n![Image](img/image01078.jpeg)\n\n图 9.2 文本字段的模型和视图\n\n\n\n\n模型必须实现更改内容的方法以及发现内容是什么的方法。例如，文本模型具有在当前文本中添加或删除字符的方法，以及将当前文本作为字符串返回的方法。再次，请记住，模型是完全非视觉的。视图（view）的工作是绘制存储在模型中的数据。\n\
  \n![Image](img/image00948.jpeg) 备注\n\n“模型（model）”一词用得或许并不恰当，因为我们经常把模型看作抽象概念的表示。汽车和飞机的设计师建立模型来模拟真实的汽车和飞机。但当你考虑模型-视图-控制器（model-view-controller，MVC）模式时，这种类比实际上会误导你。在这一设计模式中，模型存储完整的内容，而视图则提供内容的（完整或不完整）的视觉表示。一个更好的类比可能是为艺术家摆姿的模特。观察模特并创建视图是艺术家的工作。根据艺术家的不同，该视图可能是一幅正式肖像、一幅印象派绘画，或是一幅显示肢体呈奇异扭状的立体主义画作。\n\
  \n模型-视图-控制器模式的优势之一是一个模型可以有多个视图，每个视图显示完整内容的不同部分或方面。例如，一个 HTML 编辑器可以同时提供相同内容的两个视图：所见即所得（WYSIWYG）视图和一个“原始标签”视图（参见图\
  \ 9.3）。当通过一个视图的控制器更新模型时，它会通知两个关联的视图变化。当视图收到通知时，它们会自动刷新。当然，对于像按钮这样简单的用户界面组件，你不会有同一个模型的多个视图。\n\
  \n![Image](img/image01079.jpeg)\n\n图 9.3. 同一个模型的两个独立视图\n\n控制器（controller）处理用户输入事件，如鼠标点击和击键。它然后决定是否将这些事件翻译为模型或视图的变化。例如，如果用户在文本框中按下字符键，控制器会调用模型的“插入字符”命令。模型随后告诉视图更新自身。视图永远不知道文本为什么发生变化。但如果用户按下光标键，控制器可能会告诉视图滚动。滚动视图对底层文本没有影响，因此模型永远不知道该事件的发生。\n\
  \n图 9.4 显示了模型、视图和控制器对象之间的交互。\n\n![Image](img/image01080.jpeg)\n\n图 9.4. 模型、视图和控制器对象之间的交互\n\
  \n作为一名使用 Swing 组件的程序员，你通常不需要考虑模型-视图-控制器架构。每个用户界面组件都有一个包装类（如 `JButton` 或 `JTextField`），它存储了模型。\n\
  [/content]\n模型必须实现更改内容的方法以及发现内容是什么的方法。例如，文本模型具有在当前文本中添加或删除字符的方法，以及将当前文本作为字符串返回的方法。再次，请记住，模型是完全非视觉的。视图（view）的工作是绘制存储在模型中的数据。\n\
