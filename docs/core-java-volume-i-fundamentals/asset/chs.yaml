  \      int i;\n      for (i = 0; i < ACCOUNTS; i++)\n      {\n         TransferRunnable\
  \ r = new TransferRunnable(b, i, INITIAL_BALANCE);\n         Thread t = new Thread(r);\n\
  \         t.start();\n      }\n   }\n}\n```\n\nListing 14.6. unsynch/Bank.java\n\
  \n\n\n\n\n```java\n/**\n * A bank with a number of bank accounts.\n * @version 1.30\
  \ 2004-08-01\n * @author Cay Horstmann\n */\npublic class Bank\n{\n    private final\
