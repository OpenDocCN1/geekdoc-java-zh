  You can retire in \" + year + \" years.\");\n    }\n}\n```\n\n#### 3.8.4 确定性循环\n\
  \n`for` 循环是一种支持由计数器或每次迭代更新的变量控制迭代的通用结构。如图 3.12 所示，以下循环在屏幕上打印 1 到 10。\n\n```java\n\
  for (int i = 1; i <= 10; i++)\n    System.out.println(i);\n```\n\n![Image](img/image00988.jpeg)\n\
  \n### 图 3.12. for 语句的流程图\n\n`for` 语句的第一个槽通常持有计数器初始化。第二个槽给出一个在每次新循环之前测试的条件，第三个槽指定了如何更新计数器。\n\
  \n尽管 Java 像 C++ 一样在 `for` 循环的各个槽中使用任何表达式，但良好的良好成规则是，这三个槽应该只初始化、测试和更新同一个计数器变量。忽略这一规则可以编写出非常晦涩的循环。\n\
  \n即使在良好的范围内，也有许多可能性。例如，你可以拥有倒计数的循环：\n\n点击此处查看代码图片\n\n```java\nfor (int i = 10; i\
  \ > 0; i--)\n    System.out.println(\"Counting down . . . \" + i);\nSystem.out.println(\"\
  Blastoff!\");\n```\n\n***\n\n### 注意\n\n在循环中测试浮点数的相等性时要小心。像下面这样的 `for` 循环\n\n`for\
  \ (double x = 0; x != 10; x += 0.1) . . .`\n\n\n\n\n可能永远不会结束。由于舍入误差，最终值可能无法精确达到。在这个示例中，`x`\
  \ 从 `9.99999999999998` 跳变到 `10.09999999999998`，因为 `0.1` 没有精确的二进制表示。\n\n当你在 `for`\
  \ 语句的第一槽中声明变量时，该变量的作用范围将一直延伸到 `for` 循环体的结束。\n\n```java\nfor (int i = 1; i <= 10;\
  \ i++)\n{\n    . . .\n}\n// i 在这里不再定义\n```\n\n特别地，如果你在 `for` 语句内部定义了一个变量，则无法在循环外部使用它的值。因此，如果你想在\
  \ `for` 循环外部使用计数器的最终值，请务必在循环头之外声明它！\n\n```java\nint i;\nfor (i = 1; i <= 10; i++)\n\
  {\n    . . .\n}\n// i 在这里仍然定义\n```\n\n另一方面，你可以在不同的 `for` 循环中定义同名的变量：\n\n```java\n\
  for (int i = 1; i <= 10; i++)\n{\n    . . .\n}\n. . .\nfor (int i = 11; i <= 20;\
  \ i++) // 定义另一个名为 i 的变量是允许的\n{\n    . . .\n}\n```\n\n`for` 循环仅仅是 `while` 循环的一种方便快捷方式。例如，\n\
  \n```java\nfor (int i = 10; i > 0; i--)\n    System.out.println(\"Counting down\
  \ . . . \" + i);\n```\n\n可以重写为：\n\n```java\nint i = 10;\nwhile (i > 0)\n{\n    System.out.println(\"\
  Counting down . . . \" + i);\n    i--;\n}\n```\n\n`Listing 3.5` 展示了一个 `for` 循环的典型示例。该程序计算中彩票的概率。例如，如果你必须从\
  \ 1 到 50 个数字中选出 6 个来中奖，那么就有 `(50 × 49 × 48 × 47 × 46 × 45)/(1 × 2 × 3 × 4 × 5 ×\
  \ 6)` 种可能的结果，因此你的机会是 15,890,700 分分之一。祝你好运！\n\n`Listing 3.5. LotteryOdds/LotteryOdds.java`\n\
  \n```java\nimport java.util.*;\n/**\n * 此程序演示了 for 循环。\n * @version 1.20 2004-02-10\n\
  \ * @author Cay Horstmann\n */\npublic class LotteryOdds\n{\n    public static void\
  \ main(String[] args)\n    {\n        Scanner in = new Scanner(System.in);\n\n \
  \       System.out.print(\"How many numbers do you need to draw? \");\n        int\
  \ k = in.nextInt();\n\n        System.out.print(\"What is the highest number you\
  \ can draw? \");\n        int n = in.nextInt();\n        /*\n         * 计算二项系数 n*(n-1)*(n-2)*...*(n-k+1)/(1*2*3*...*k)\n\
  \         */\n        int lotteryOdds = 1;\n        for (int i = 1; i <= k; i++)\n\
  \            lotteryOdds = lotteryOdds * (n - i + 1) / i;\n\n        System.out.println(\"\
  Your odds are 1 in \" + lotteryOdds + \". Good luck!\");\n    }\n}\n```\n\n通常情况下，如果你从\
  \ `n` 个数中选出 `k` 个，会有若干种结果。接下来的 `for` 循环计算了这个值：\n\n```java\nint lotteryOdds = 1;\n\
  for (int i = 1; i <= k; i++)\n    lotteryOdds = lotteryOdds * (n - i + 1) / i;\n\
  ```\n\n请参见 `Section 3.10.1, “for each Loop”` 了解关于 Java 5.0 添加到 Java 语言中的“广义 for\
  \ 循环”（也称为“for each”循环）的描述。\n\n### 3.8.5 多重选择——switch 语句\n\n当你需要处理带有多个备选项的选择时，`if/else`\
  \ 结构会变得繁琐。Java 有 `switch` 语句，它与 C 和 C++ 中的 `switch` 语句完全相同，包括所有的缺点。例如，如果你像 `Figure\
  \ 3.13` 那样设置了一个包含四个备选项的菜单，你可以可以使用这样的代码：\n\n```java\nScanner in = new Scanner(System.in);\n\
  System.out.print(\"Select an option (1, 2, 3, 4) \");\nint choice = in.nextInt();\n\
  switch (choice)\n{\n    case 1:\n        . . .\n        break;\n    case 2:\n  \
  \      . . .\n        break;\n    case 3:\n        . . .\n        break;\n    case\
  \ 4:\n        . . .\n        break;\n    default:\n        // 输入无效\n        . .\
  \ .\n        break;\n}\n```\n\n`Figure 3.13. switch 语句流程图` 执行从与选择值匹配的 `case` 标签开始，并持续到下一个\
  \ `break` 或 `switch` 结束。如果没有任何 `case` 标签匹配，则执行 `default` 子句。**注意**：如果你忘记在每个分支末尾添加\
  \ `break`，执行将会穿透到下一个分支。\n\n\n\n\n```java\nyears++;\n}\n```\n\n但注意，测试 `balance <\
  \ goal` 在此版本中重复了两次。为了避免这种重复测试，一些程序员倾向于使用 `break` 语句。\n\n与 C++ 不同，Java 也提供了 `break`\
  \ 语句，允许你跳出多层嵌套循环。偶尔在深层嵌套的循环内部会发生奇怪的情况。在这种情况下，你可能想要完全跳出所有嵌套循环。仅仅通过在各种循环测试中添加额外的条件来实现该功能是不方便的。\n\
  \n这里有一个展示 `break` 语句工作的示例。注意，标签（label）必须位于你想要跳出的最外层循环之前，并且必须跟着一个冒号。\n\n点击此处查看代码图片\n\
  \n```java\nScanner in = new Scanner(System.in);\n\nint n;\n\nread_data:\n\nwhile\
  \ (... ) // 此循环语句带有标签标记\n{\n    ...\n    for (...) // 此内部循环没有标记\n    {\n       \
  \ System.out.print(\"Enter a number >= 0: \");\n        n = in.nextInt();\n    \
  \    if (n < 0) // 永远不应该发生——无法继续\n            break read_data;\n            // 跳出\
  \ read_data 循环\n        ...\n    }\n}\n\n// 此语句在执行标签 break 之后立即执行\nif (n < 0) //\
  \ 检查异常情况\n{\n    // 处理异常情况\n}\nelse\n{\n    // 执行正常处理\n}\n```\n\n如果输入无效，带标签 break\
  \ 将跳到带标签块的末尾。与任何使用 `break` 语句一样，你随后需要测试循环是正常退出的，还是由于 `break` 退出的。\n\n![Image](img/image00948.jpeg)\
  \ 备注\n\n有趣的是，你可以将标签应用到任何语句，甚至是一个 `if` 语句或块语句，如下所示：\n\n```java\nlabel:\n\n{\n   \
  \ ...\n    if (condition) break label; // 退出块\n    ...\n}\n// 当 break 语句执行时跳转到这里\n\
  ```\n\n因此，如果你渴望使用 `goto`，并且你可以在想要跳转的地方之前放置一个结束块，那么你就可以使用 `break` 语句！自然地，我们不建议这种方法。但请注意，你只能*跳出*块，永远不能*跳入*块。\n\
  \n最后，还有一个 `continue` 语句，它和 `break` 语句一样，会打破常规控制流。`continue` 语句将控制转移到最内层嵌套循环的头部。这里是一个示例：\n\
  \n```java\nScanner in = new Scanner(System.in);\n\nwhile (sum < goal)\n{\n    System.out.print(\"\
  Enter a number: \");\n    n = in.nextInt();\n    if (n < 0) continue;\n    sum +=\
  \ n; // 如果 n < 0 则不执行\n}\n```\n\n如果 `n < 0`，则 `continue` 语句立即跳转到循环头部，跳过当前迭代的剩余部分。\n\
  \n如果 `continue` 语句用于 `for` 循环中，它将跳转到 `for` 循环的“更新”部分。例如：\n\n点击此处查看代码图片\n\n```java\n\
  for (count = 1; count <= 100; count++)\n{\n    System.out.print(\"Enter a number,\
  \ -1 to quit: \");\n    n = in.nextInt();\n    if (n < 0) continue;\n    sum +=\
  \ n; // 如果 n < 0 则不执行\n}\n```\n\n如果 `n < 0`，则 `continue` 语句跳转到 `count++` 语句。\n\n\
  还有一种带标签的 `continue` 语句，它跳转到带有匹配标签的循环头部。\n\n![Image](img/image00949.jpeg) 提示\n\n\
  许多程序员发现 `break` 和 `continue` 语句令人困惑。这些语句完全是可选的——你始终可以在不使用它们的情况下表达相同的逻辑。在书中，我们从不使用\
  \ `break` 或 `continue`。\n\n### 3.9. 大数\n\n如果基本整数和浮点数类型的精度不足，你可以转向 `java.math` 包中的两个实用类：`BigInteger`\
