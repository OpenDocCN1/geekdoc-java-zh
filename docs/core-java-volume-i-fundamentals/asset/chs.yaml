  \ centerY = rect.getCenterY();\n        double radius = 150;\n\n        Ellipse2D\
  \ circle = new Ellipse2D.Double();\n        circle.setFrameFromCenter(centerX, centerY,\
  \ centerX + radius, centerY + radius);\n        g2.draw(circle);\n    }\n\n    public\
  \ Dimension getPreferredSize() { return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT);\
