  176             openItem.setEnabled(true);\n177         }\n178     };\n```\n\n`javax.swing.SwingWorker<T,\
  \ V>`\n\n- `abstract T doInBackground()` 是要覆盖的方法，用于执行后台任务并返回工作结果。\n- `void process(List<V>\
  \ data)` 是要覆盖的方法，用于在事件分派线程处理中间数据。\n- `void publish(V... data)` 将中间进度数据到事件分派线程。在\
  \ `doInBackground` 中调用此方法。\n- `void execute()` 调度此工作线程在工作线程上执行。\n- `SwingWorker.getState()`\
  \ 获取此工作线程的状态，取 `PENDING`、`STARTED` 或 `DONE` 之一。\n\n### 1.1.3 单线程规则\n\n每个 Java 都从一个\
  \ `main` 方法开始，该方法在 `main` 线程中运行。在 Swing 程序中，`main` 线程是短命的。它调度在事件分派线程中构建用户界面，然后退出。用户界面构建完成后，事件分派线程会处理事件通知，例如调用\
  \ `actionPerformed` 或 `paintComponent`。其他线程（例如将事件发布到事件队列的线程）在后台运行，但这些线程对应用程序是不可见的。\n\
  \n在章的前面部分，我们介绍了单线程规则：“不要在事件分派线程以外的任何线程中接触 Swing 组件。”在本节中，我们将进一步研究该规则。线程规则有几个例外：\n\
  \n- 你可以在任何线程中安全地添加和删除事件监听器。当然，监听器方法将在事件分派线程中调用。\n- 少数 Swing 方法是线程安全的。它们在 API 文档中特别标记了“此方法是线程安全的，尽管大多数\
  \ Swing 方法不是”。在这些线程安全方法中最有用的是：\n  - `JTextComponent.setText`\n  - `JTextArea.insert`\n\
  \  - `JTextArea.append`\n  - `JTextArea.replaceRange`\n  - `JComponent.repaint`\n\
  \  - `JComponent.revalidate`\n\n注意：我们在书中多次使用了 `repaint` 方法，但 `revalidate` 方法较少用。它的目的是在内容更改后强制组件进行布局。传统的\
  \ AWT 有一个 `validate` 方法来强制组件进行布局。对于 Swing 组件，你应该直接调用 `revalidate`。（然而，要强制对 `JFrame`\
  \ 进行布局，你仍然需要调用 `validate`——`JFrame` 是一个 `Component` 但不是 `JComponent`。）\n\n从历史角度看，单线程规则更为宽松。任何线程都允许构造组件、设置它们的属性并将它们添加到容器中，只要这些组件中没有一个已经实例化（realized）。如果一个组件可以接收绘制或验证事件，则它被视为实例化。在组件上调用了\
  \ `setVisible(true)` 或 `pack()` 方法之后，或者在组件被添加到容器之后，就会出现这种情况。那个版本的单线程规则非常方便。它允许你在\
  \ `main` 方法中创建 GUI，然后在顶层框架（frame）上调用 `setVisible(true)`。不需要在事件分派线程上费力地调度 `Runnable`。\n\
  \n遗憾的是，某些组件实现者没有注意原始单线程规则的细微差别。他们在事件分派线程上启动活动，而从未考虑过组件是否已实例化。例如，如果你对 `JTextComponent`\
  \ 调用 `setSelectionStart` 或 `setSelectionEnd`，会在事件分派线程中调度一个光标移动，即使该组件是不可见的。本完全可以检测并修复这些问题，但\
  \ Swing 设计者采取了偷懒之径。他们规定，从事件分派线程以外的任何线程访问组件永远是不安全的。因此，你需要在我们在所有示例程序中看到的通过 `EventQueue.invokeLater`\
  \ 调用，在事件分派线程中构建用户界面。\n\n当然，有很多程序并不小心，并按照旧版本的单线程规则运行，在 `main` 线程上初始化用户界面。这些程序面临着微小的风险，即某些用户界面的初始化可能会导致事件分派线程上的操作与\
  \ `main` 线程上的操作冲突。正如我们在第 7 章提到的，你不想成为那少数遇到麻烦并浪费时间调试间性线程 bug 的倒霉蛋之一。因此，你应该遵循严格的单线程规则。\n\
