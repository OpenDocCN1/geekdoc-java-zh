  \ host)`: 为 `host` 容器中的组件布局构建一个 `GroupLayout`。（注意，你仍然需要对 `host` 对象调用 `setLayout`。）\n\
  - `void setHorizontalGroup(GroupLayout.Group g)`: 设置控制水平布局的组。\n- `void setVerticalGroup(GroupLayout.Group\
  \ g)`: 设置控制垂直布局的组。\n- `void linkSize(Component... components)` / `void linkSize(int\
  \ axis, Component... component)`: 强制给定组件具有相同的大小，或在指定的轴上具有相同的大小（`SwingConstants.HORIZONTAL`\
  \ 或 `SwingConstants.VERTICAL` 之一）。\n- `GroupLayout.SequentialGroup createSequentialGroup()`:\
  \ 创建一个顺序布局子组件的组。\n- `GroupLayout.ParallelGroup createParallelGroup(GroupLayout.Alignment\
  \ align)` / `createParallelGroup(GroupLayout.Alignment align, boolean resizable)`:\
  \ 创建一个并行布局子组件的组。\n- `boolean getHonorsVisibility()` / `void setHonorsVisibility(boolean\
  \ b)`: 获取或设置 `honorsVisibility` 属性。当为 `true`（默认值）时，不可见组件不会布局。当为 `false` 时，它们将像可见一样进行布局。这在临时隐藏某些组件且不希望布局发生变化时非常有用。\n\
  - `boolean getAutoCreateGaps()` / `void setAutoCreateGaps(boolean b)` / `boolean\
  \ getAutoContainerGaps()` / `void setAutoContainerGaps(boolean b)`: 获取并设置 `autoCreateGaps`\
  \ 和 `autoContainerGaps` 属性。当为 `true` 时，会在组件之间或容器边界处自动添加间隙。默认值为 `false`。当你手动生成 `GroupLayout`\
  \ 时，值为 `true` 很有用。\n\n### `javax.swing.GroupLayout.Group`\n\n- `void addComponent(Component\
  \ c)` / `void addComponent(Component c, int minimumSize, int preferredSize, int\
  \ maximumSize)`: 将组件添加到此组中。大小参数可以是实际（非负）值，也可以是特殊常量 `GroupLayout.DEFAULT_SIZE` 或\
  \ `GroupLayout.PREFERRED_SIZE`。当使用 `DEFAULT_SIZE` 时，会调用组件的 `getMinimumSize()`、`getPreferredSize()`\
  \ 或 `getMaximumSize()`。当使用 `PREFERRED_SIZE` 时，会调用组件的 `getPreferredSize()` 方法。\n\
  - `void addGap(int size)` / `void addGap(int minimumSize, int preferredSize, int\
  \ maximumSize)`: 添加一个给定的固定或灵活大小的间隙。\n- `void addGroup(GroupLayout.Group g)`: 将给定的组添加到此组。\n\
  \n### `javax.swing.GroupLayout.ParallelGroup`\n\n- `void addComponent(Component\
  \ c, GroupLayout.Alignment align)` / `void addComponent(Component c, GroupLayout.Alignment\
  \ align, int minimumSize, int preferredSize, int maximumSize)`: 将组件添加到此组中。\n- `void\
  \ addGroup(GroupLayout.Group g, GroupLayout.Alignment align)`: 使用给定的对齐方式（`BASELINE`、`LEADING`、`TRAILING`\
  \ 或 `CENTER` 之一）将组件或组添加到此组。\n\n### `javax.swing.GroupLayout.SequentialGroup`\n\n\
  - `void addContainerGap()` / `void addContainerGap(int preferredSize, int maximumSize)`:\
  \ 添加分离组件与容器边缘的间隙。\n- `void addPreferredGap(LayoutStyle.ComponentPlacement type)`:\
  \ 添加分离组件的间隙。类型为 `LayoutStyle.ComponentPlacement.RELATED` 或 `LayoutStyle.ComponentPlacement.UNRELATED`。\n\
  \n#### 9.6.3 不使用布局管理器\n\n有时，你可能不想去麻烦布局管理器，只想将组件放置在固定位置（有时称为绝对定位）。对于平台无关的应用程序来说，这不是一个好主意，但在快速原型设计中使用它是没有问题的。\n\
  \n以下是在固定位置放置组件的操作方法：\n\n1. 将布局管理器设置为 `null`。\n2. 将你想要的组件添加到容器中。\n3. 指定你想要的位置和大小：\n\
  \n```java\nframe.setLayout(null);\nJButton ok = new JButton(\"OK\");\nframe.add(ok);\n\
  ok.setBounds(10, 10, 30, 15);\n```\n\n#### `java.awt.Component`\n\n- `void setBounds(int\
  \ x, int y, int width, int height)`: 移动并调整组件的大小。\n\n#### 9.6.4 自定义布局管理器\n\n你可以设计自己的\
  \ `LayoutManager` 类，以特殊的方式管理组件。作为一个有趣的示例，让我们容器中的所有组件排列成一个圆（参见图 9.34）。\n\n你自定义的布局管理器必须实现\
  \ `LayoutManager` 接口。你需要重写以下五个方法：\n\n```java\nvoid addLayoutComponent(String s,\
  \ Component c);\nvoid removeLayoutComponent(Component c);\nDimension preferredLayoutSize(Container\
  \ parent);\nDimension minimumLayoutSize(Container parent);\n```\n\n\n\n\n\n```java\n\
  void layoutContainer(Container parent);\n```\n\n前两个方法在组件被添加或移除时调用。如果你不需要保留关于组件的任何额外信息，可以让它们什么都不做。接下来的两个方法计算组件的最小布局和首选布局所需的空间。这些值通常是相同的数值。第五个方法执行实际工作，并对所有组件调用\
  \ `setBounds`。\n\n***\n\n![Image](img/image00948.jpeg) 备注\n\nAWT 有第二个接口，称为 `LayoutManager2`，它需要实现十个方法，而不是五个。`LayoutManager2`\
  \ 接口的主要作用是允许用户使用带约束的 `add` 方法。例如，`BorderLayout` 和 `GridBagLayout` 都实现了 `LayoutManager2`\
  \ 接口。\n\n***\n\n列表 9.13 显示了 `CircleLayout` 管理器的代码，遗憾的是，它将组件沿父容器内部的圆周进行布局。示例程序的框架类位于列表\
  \ 9.14。\n\n列表 9.13. `circleLayout/CircleLayout.java`\n\n点击此处查看代码图像\n\n***\n\n```java\n\
  package circleLayout;\n\nimport java.awt.*;\n\n/**\n * 一种沿圆周布局组件的布局管理器。\n */\npublic\
  \ class CircleLayout implements LayoutManager\n{\n    private int minWidth = 0;\n\
  \    private int minHeight = 0;\n    private int preferredWidth = 0;\n    private\
  \ int preferredHeight = 0;\n    private boolean sizesSet = false;\n    private int\
  \ maxComponentWidth = 0;\n    private int maxComponentHeight = 0;\n\n    public\
  \ void addLayoutComponent(String name, Component comp)\n    {\n    }\n    public\
  \ void removeLayoutComponent(Component comp)\n    {\n    }\n\n    public void setSizes(Container\
  \ parent)\n    {\n        if (sizesSet) return;\n        int n = parent.getComponentCount();\n\
  \n        preferredWidth = 0;\n        preferredHeight = 0;\n        minWidth =\
  \ 0;\n        minHeight = 0;\n        maxComponentWidth = 0;\n        maxComponentHeight\
  \ = 0;\n\n        // 计算组件的最大宽度和高度\n        // 并将首选尺寸设置为所有组件尺寸之和。\n\n        for\
  \ (int i = 0; i < n; i++)\n        {\n            Component c = parent.getComponent(i);\n\
  \            if (c.isVisible())\n            {\n                Dimension d = c.getPreferredSize();\n\
  \                maxComponentWidth = Math.max(maxComponentWidth, d.width);\n   \
  \             maxComponentHeight = Math.max(maxComponentHeight, d.height);\n   \
  \             preferredWidth += d.width;\n                preferredHeight += d.height;\n\
  \            }\n        }\n        minWidth = preferredWidth / 2;\n        minHeight\
  \ = preferredHeight / 2;\n        sizesSet = true;\n    }\n\n    public Dimension\
  \ preferredLayoutSize(Container parent)\n    {\n        setSizes(parent);\n    \
  \    Insets insets = parent.getInsets();\n        int width = preferredWidth + insets.left;\n\
  \        int height = preferredHeight + insets.bottom;\n        return new Dimension(width,\
  \ height);\n    }\n    public Dimension minimumLayoutSize(Container parent)\n  \
  \  {\n        setSizes(parent);\n        Insets insets = parent.getInsets();\n \
  \       int width = minWidth + insets.left;\n        int height = minHeight + insets.bottom;\n\
  \        return new Dimension(width, height);\n    }\n\n    public void layoutContainer(Container\
  \ parent)\n    {\n        setSizes(parent);\n        // 计算圆的中心\n        Insets insets\
  \ = parent.getInsets();\n        int containerWidth = parent.getSize().width - insets.left;\n\
  \        int containerHeight = parent.getSize().height - insets.bottom;\n      \
  \  int xcenter = insets.left + containerWidth / 2;\n        int ycenter = insets.top\
  \ + containerHeight / 2;\n        // 计算圆的半径\n        int xradius = (containerWidth\
  \ - maxComponentWidth) / 2;\n        int yradius = (containerHeight - maxComponentHeight)\
  \ / 2;\n        int radius = Math.min(xradius, yradius);\n        // 沿圆周布局组件\n \
  \       int n = parent.getComponentCount();\n        for (int i = 0; i < n; i++)\n\
  \        {\n            Component c = parent.getComponent(i);\n            if (c.isVisible())\n\
  \            {\n                double angle = 2 * Math.PI / n;\n              \
  \  // 组件的中心点\n                int x = xcenter + (int) (Math.cos(angle) * radius);\n\
  \                int y = ycenter + (int) (Math.sin(angle) * radius);\n         \
  \       // 移动组件使其中心点位于 (x, y)\n                // 且尺寸为首选尺寸\n                Dimension\
  \ d = c.getPreferredSize();\n                c.setBounds(x - d.width / 2, y - d.height\
  \ / 2, d.width, d.height);\n            }\n        }\n    }\n}\n```\n\n***\n\n列表\
  \ 9.14. `circleLayout/CircleLayoutFrame.java`\n\n点击此处查看代码图像\n\n***\n\n```java\n\
  package circleLayout;\n\nimport javax.swing.*;\n\n/**\n * 一个沿圆周显示按钮的框架。\n */\npublic\
  \ class CircleLayoutFrame extends JFrame\n{\n    public CircleLayoutFrame()\n  \
  \  {\n        setLayout(new CircleLayout());\n        add(new JButton(\"Yellow\"\
  ));\n        add(new JButton(\"Blue\"));\n        add(new JButton(\"Red\"));\n \
  \       add(new JButton(\"Green\"));\n        add(new JButton(\"Orange\"));\n  \
  \      add(new JButton(\"Fuchsia\"));\n        add(new JButton(\"Indigo\"));\n \
  \       pack();\n    }\n}\n```\n\n***\n\n***\n\njava.awt.LayoutManager **0**\n\n\
  - `void addLayoutComponent(String name, Component comp)`:将组件添加到布局中。\n\n![Image](img/image037.jpeg)\n\
  \n- `void removeLayoutComponent(Component comp)`:从布局中移除组件。\n\n- `Dimension preferredLayoutSize(Container\
  \ cont)`:返回容器的首选尺寸。\n\n- `Dimension minimumLayoutSize(Container cont)`:返回容器的最小尺寸。\n\
  \n- `void layoutContainer(Container cont)`:对容器中的组件进行布局。\n\n***\n\n***\n\n#### 9.6.5.\
  \ 遍历顺序\n\n当你向窗口中添加许多组件时，你需要考虑*遍历顺序*。当窗口首次显示时，遍历顺序中的第一个组件拥有焦点。用户每按下 Tab 键，下一个组件就会获得焦点。（记住，拥有焦点的组件可以使用键盘进行操作。例如可以使用空格键“点击”按钮。）你可能不在意使用\
  \ Tab 键遍历一组控件，但有很多用户在意。其中包括讨厌鼠标的人以及无法使用鼠标的人。因此，你需要了解 Swing 如何处理遍历顺序。\n\n遍历顺序非常简单：首先从左到右，然后从上到下。例如，在字体对话框示例中，组件按以下顺序遍历（参见图\
  \ 9.35）：\n\n字体组合框\n\n示例文本区域（按 Ctrl+Tab 移动到下一个字段；Tab 字符被视为文本输入）\n\n尺寸组合框\n\n粗体复选框\n\
  \n斜体复选框\n\n图 9.35\\. 几何遍历顺序\n\n\n\n\n如果你的容器包含其他容器，情况就会变得更加复杂。当焦点交给另一个容器时，它会自动位于该容器中左上角的组件，然后遍历该容器中的所有其他组件。最后，焦点将交给该容器之后的组件。\n\
  \n你可以利用这一点，将相关元素分组在另一个容器（如面板 panel）中。\n\n* * *\n\n![Image](img/image00948.jpeg)\
  \ 注意：调用\n\n```\ncomponent.setFocusable(false);\n```\n\n用此将某个组件从焦点遍历中移除。这对于不接受键盘输入的绘图组件非常有用。\n\
  \n* * *\n\n### 9.7 对话框\n\n到目前为止，我们所有的用户界面组件都出现在应用程序创建的框架窗口（frame window）内部。如果你编写在浏览器浏览器运行的\
  \ applet，这是最常见的情况。但如果你编写的是应用程序，通常希望弹出独立的对话框来向用户提供信息，或从用户那里获取信息。\n\n与大多数大多数窗口系统一样，AWT\
  \ 区分了模态（modal）和非模态（modeless）对话框。模态对话框在用户处理它之前，不允许用户与应用程序的其余窗口进行交互。在继续执行之前需要用户信息时，请使用模态对话框。例如，当用户想要读取文件时，会弹出一个模态文件对话框。用户必须在程序开始读取操作之前指定文件名。只有当用户关闭模态对话框后，应用程序才能继续。\n\
  \n非模态对话框允许用户在对话框和应用程序的其余部分输入信息。非模态对话框的一个示例是工具栏。工具栏可以根据需要保持原，用户可以根据需要与应用程序窗口和工具栏进行交互。\n\
  \n我们将从最简单的对话框开始本节——仅带有单个消息的模态对话框。Swing 有一个方便的 `JOptionPane` 类，可以让你无需编写任何特殊的对话框代码即可弹出一个简单的对话框。接下来，你将看到如何通过实现自己的对话窗口来编写更复杂的对话框。最后，你将看到如何将数据从应用程序传输到对话框并反之。\n\
  \n我们将通过查看两个标准对话框来结束本节：文件对话框和颜色对话框。文件对话框是复杂的，你绝对需要熟悉 Swing 的 `JFileChooser` 来为此——编写自己的将是一个真正的挑战。当你想要用户选择颜色时，`JColorChooser`\
  \ 对话框非常有用。\n\n### 9.7.1 选项对话框\n\nSwing 有了一套现成的简单对话框，足以向用户询问单条信息。`JOptionPane` 有四个静态方法来显示这些简单对话框：\n\
  \n![Image](img/image01144.jpeg)\n\n图 9.36 显示了一个典型的对话框。如你所示，对话框具有以下组件：\n\n• 一个图标\n\
  • 一条消息\n• 一个或多个选项按钮\n\n![Image](img/image01145.jpeg)\n\n图 9.36 选项对话框\n\n输入对话框有一个额外的用于用户输入的组件。这可以是一个用户可以在其中输入任意字符串的文本字段，也可以是一个用户从中选择一个项目的组合框框（combo\
  \ box）。\n\n这些对话框的准确布局以及标准消息类型的图标选择，取决于可插的外观（pluggable look-and-feel）。\n\n左侧的图标取决于五种消息类型之一：\n\
  \n- `ERROR_MESSAGE`\n- `INFORMATION_MESSAGE`\n- `WARNING_MESSAGE`\n- `QUESTION_MESSAGE`\n\
  - `PLAIN_MESSAGE`\n\n`PLAIN_MESSAGE` 类型没有图标。每种对话框类型也有一个方法让你提供自己的图标。\n\n对于每种对话框类型，你都可以指定一条消息。此消息可以是字符串、图标、用户界面组件或任何其他对象。消息对象的显示方式如下：\n\
  \n![Image](img/image01146.jpeg)\n\n你可以通过运行第 526 页的列表 9.15 中的程序来查看这些选项。\n\n当然，提供消息字符串是最常见的情况。提供一个\
  \ `Component` 为你提供了极大的灵活性，因为你可以让 `paintComponent` 方法绘制任何你想要。\n\n底部的按钮取决于对话框类型和选项类型。当调用\
  \ `showMessageDialog` 和 `showInputDialog` 时，你只会得到一组标准的按钮（分别是 OK 和 OK/取消）。调用 `showConfirmDialog`\
  \ 时，你可以从四种选项类型中选择：\n\n- `DEFAULT_OPTION`\n- `YES_NO_OPTION`\n- `YES_NO_CANCEL_OPTION`\n\
  - `OK_CANCEL_OPTION`\n\n使用 `showOptionDialog` 允许指定任意一组选项。你提供一个对象数组作为选项。每个数组元素的渲染方式如下：\n\
  \n![Image](img/image01147.jpeg)\n\n这些函数的返回值如下：\n\n![Image](img/image01148.jpeg)\n\
  \n`showConfirmDialog` 和 `showOptionDialog` 返回整数以指示用户选择了哪个按钮。对于选项对话框，这仅仅是所选选项的索引，或者如果用户关闭对话框而不是选择选项，则返回值为\
  \ `CLOSED_OPTION`。对于确认对话框，返回值可以是以下之一：\n\n- `OK_OPTION`\n- `CANCEL_OPTION`\n- `YES_OPTION`\n\
  - `NO_OPTION`\n\n这听起来是一组令人复杂的集合，但实际上如此。遵循这些步骤：\n\n1. 选择对话框类型。\n2. 选择图标。\n3. 选择消息。\n\
  4. 选择选项类型。\n5. 选择选项。\n6. 选择输入。\n7. 定位对应的方法。\n\n例如，假设你想显示图 9.36 中的对话框。`OK_CANCEL_OPTION`\
  \ 是选项类型。这是你将进行的调用：\n\n```\nint selection = JOptionPane.showConfirmDialog(parent,\
  \ \"Message\", \"Title\", JOptionPane.OK_CANCEL_OPTION, JOptionPane.QUESTION_MESSAGE);\n\
  if (selection == JOptionPane.OK_OPTION)\n```\n\n消息字符串可以包含换行符 (`\\n`)。这样的字符串将显示多行。\n\
  \n* * *\n\n在列表 9.15 中显示的程序框架类显示了六个按钮面板（参见图 9.37）。列表 9.16 显示了面板的类。当你点击“显示”按钮时，将显示选定的对话框。\n\
