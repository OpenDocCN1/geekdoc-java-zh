  - `double getMaxY()`\n返回包围矩形的中心、最小或最大 `x` 或 `y` 值。\n- `double getWidth()`\n- `double\
  \ getHeight()`\n返回包矩形的宽度或高度。\n- `double getX()`\n- `double getY()`\n返回包矩形左上角的 `x`\
  \ 或 `y` 坐标。\n\n### `java.awt.geom.Rectangle2D.Double`\n- `Rectangle2D.Double(double\
  \ x, double y, double w, double h)`\n根据给定的左上角、宽度和高度构造一个矩形。\n\n### `java.awt.geom.Rectangle2D.Float`\n\
  - `Rectangle2D.Float(float x, float y, float w, float h)`\n根据给定的左上角、宽度和高度构造一个矩形。\n\
  \n### `java.awt.geom.Ellipse2D.Double`\n- `Ellipse2D.Double(double x, double y,\
  \ double w, double h)`\n构造一个椭圆，其包围矩形具有给定的左上角、宽度和高度。\n\n### `java.awt.geom.Point2D.Double`\n\
  - `Point2D.Double(double x, double y)`\n根据给定的坐标构造一个点。\n\n### `java.awt.geom.Line2D.Double`\n\
  - `Line2D.Double(Point2D start, Point2D end)`\n- `Line2D.Double(double startX, double\
  \ startY, double endX, double endY)`\n根据给定的起点和终点构造一条线。\n\n### 7.6 使用颜色\n`Graphics2D`\
  \ 类的 `setPaint` 方法允许你选择一种颜色，用于图形上下文中中的所有绘图操作。例如：\n```java\ng2.setPaint(Color.RED);\n\
  g2.drawString(\"Warning!\", 100, 100);\n```\n你可以用颜色填充封闭形状（如矩形或椭圆）的内部。只需调用 `fill`\
  \ 而不是 `draw` 即可：\n```java\nRectangle2D rect = new Rectangle2D.Double(0, 0, 10, 20);\n\
  g2.fill(rect);\n```\n`fill` 方法在右侧和底部少画一个像素。例如，如果你绘制同一个矩形，这些像素将不会被绘制。\n\n使用 `Color`\
  \ 类定义颜色。`java.awt.Color` 类为以下标准颜色预定义的常量：`BLACK`、`BLUE`、`CYAN`、`DARK_GRAY`、`GRAY`、`GREEN`、`LIGHT_GRAY`、`MAGENTA`、`ORANGE`、`PINK`、`RED`、`WHITE`、`YELLOW`。\n\
  \n在 Java SE 1.4 之前，颜色名称是小写的，例如 `Color.red`。这很奇怪，因为标准的编码规范是大写常量。现在你可以写大写或为了兼容的小写。\n\
  \n你可以通过红、绿、蓝分量创建 `Color` 对象来指定自定义颜色。使用 0–255（即一个字节）的刻度作为红色、蓝色和绿色的程度，如下调用 `Color`\
  \ 构造函数：\n```java\nColor(int redness, int greenness, int blueness)\n```\n这是一个设置自定义颜色的示例：\n\
  ```java\ng2.setPaint(new Color(0, 128, 128)); // 一种暗蓝绿色\ng2.drawString(\"Welcome!\"\
  , 75, 125);\n```\n除了实色外，你还可以选择更复杂的“画笔”设置，例如变化的色调或图像。详情请参见第二卷中的高级 AWT 章节。如果你使用 `Graphics`\
  \ 对象而不是 `Graphics2D` 对象，则需要使用 `setColor` 方法设置颜色。\n\n要设置背景颜色，请使用 `JComponent` 的父类\
  \ `Component` 类的 `setBackground` 方法。\n```java\nMyComponent p = new MyComponent();\n\
  p.setBackground(Color.PINK);\n```\n还有一个 `setForeground` 方法。它指定用于组件绘制的默认颜色。\n\n**提示**：`Color`\
  \ 类的 `brighter()` 和 `darker()` 方法正如其所示，会产生当前颜色的更亮或更暗的版本。使用 `brighter` 方法也是突出显示项目的好方法。实际上，`brighter()`\
  \ 只是稍微亮一点。要让某种颜色真正脱颖而出，可以应用三次：`c.brighter().brighter().brighter()`。\n\nJava 在其 `SystemColor`\
  \ 类中提供了更多颜色的预定义名称。该类中的常量封装了用户系统中各种元素使用的颜色。例如，\n```java\np.setBackground(SystemColor.window)\n\
  ```\n将组件的背景颜色设置为用户桌面上所有窗口都使用的默认颜色。（每当窗口重绘时，背景就会被填充。）当你想要绘制用户界面元素并使颜色与用户桌面上已有的颜色匹配时，使用\
  \ `SystemColor` 类中的颜色特别特别有用。表 7.1 列出了系统颜色名称及其含义。\n\n#### 表 7.1. 系统颜色\n![Image](img/image01045.jpeg)![Image](img/image01046.jpeg)\n\
  \n#### `java.awt.Color`\n- `Color(int r, int g, int b)`\n创建一个颜色对象。\n![Image](img/image01047.jpeg)\n\
  \n#### `java.awt.Graphics`\n- `Color getColor()`\n- `void setColor(Color c)`\n获取或设置当前颜色。所有后续图形操作将使用新颜色。\n\
  ![Image](img/image01048.jpeg)\n\n#### `java.awt.Graphics2D`\n- `Paint getPaint()`\n\
  - `void setPaint(Paint p)`\n\n\n\n\n\n获取或设置此图形上下文的画 paint 属性。`Color` 类实现了 `Paint`\
  \ 接口。因此，你可以使用此方法将画笔属性设置为纯色。\n\n- `void fill(Shape s)`\n\n用当前画笔填充形状。\n\n`java.awt.Component`\
  \ 1.0\n\n- `Color getBackground()`\n- `void setBackground(Color c)`\n\n获取或设置背景颜色。\n\
  \n![Image](img/image01049.jpeg)\n\n- `Color getForeground()`\n- `void setForeground(Color\
  \ c)`\n\n获取或设置前景色颜色。\n\n![Image](img/image01050.jpeg)\n\n### 7.7. 为文本使用特殊字体\n\n\
  本章开头的“Not a Hello, World”程序使用默认字体显示字符串。通常，你希望用不同的字体显示文本。你可以通过`font face name`（字体面名称）来指定字体。字体面名称由`font\
  \ family name`（字体族名称，例如“Helvetica”）以及一个可选的后缀（如“Bold”）组成。例如，字体面“Helvetica”和“Helvetica\
  \ Bold”都被认为属于“Helvetica”字体族。\n\n要查查找特定计算机上可用的字体，请调用 `GraphicsEnvironment` 类的 `getAvailableFontFamilyNames`\
  \ 方法。该方法返回一个包含所有可用字体名称的字符串数组。要获取描述用户系统图形环境的 `GraphicsEnvironment` 类实例，请使用静态方法 `getLocalGraphicsEnvironment`。以下程序将打印你系统上所有字体的名称：\n\
  \n```java\nimport java.awt.*;\n\npublic class ListFonts\n{\n   public static void\
  \ main(String[] args)\n   {\n      String[] fontNames = GraphicsEnvironment\n  \
  \        .getLocalGraphicsEnvironment()\n          .getAvailableFontFamilyNames();\n\
  \      for (String fontName : fontNames)\n          System.out.println(fontName);\n\
  \   }\n}\n```\n\n在某个系统中，列表开始如下：\n\nAbadi MT Condensed Light\nArial\nArial Black\n\
  Arial Narrow\nArioso\nBaskerville\nBinner Gothic\n. . .\n后面还有大约七十种字体。\n\n字体面名称可以注册商标，在某些管辖区的字体设计可以受版权保护。因此，字体的发行通常涉及向字体铸造厂支付版税。当然，就像有廉价的名牌香水仿品一样，品牌字体也有仿品。例如，随\
  \ Windows 发布的的 Helvetica 仿品被称为 Arial。\n\n为了建立一个共同基准，AWT 定义了五个逻辑字体名称：\n\n- SansSerif\n\
  - Serif\n- Monospaced\n- Dialog\n- DialogInput\n\n这些名称始终映射到客户端机器上实际存在的字体。例如，在 Windows\
  \ 系统上，`SansSerif` 映射到 Arial。\n\n此外，Oracle JDK 始终包含名为“Lucida Sans”、“Lucida Bright”和“Lucida\
  \ Sans Typewriter”的字体族。\n\n要使用某种字体绘制字符，你必须先创建一个 `Font` 类的对象。指定字体面名称、字体样式和字号大小。这里有一个构造\
  \ `Font` 对象的示例：\n\n```java\nFont sansbold14 = new Font(\"SansSerif\", Font.BOLD,\
  \ 14);\n```\n\n第三个参数是磅值（points）。磅在排版中通常用于指示字体大小。每英寸有 72 磅。\n\n你可以在 `Font` 构造函数中使用逻辑字体名称代替字体面名称。通过将\
  \ `Font` 构造函数的第二个参数设置为以下值之一来指定样式（普通、粗体、斜体或斜粗）：\n\n- `Font.PLAIN`\n- `Font.BOLD`\n\
  - `Font.ITALIC`\n- `Font.BOLD + Font.ITALIC`\n\n![Image](img/image00948.jpeg) 注意\n\
  \n从逻辑到物理字体名称的映射定义在 Java 安装目录下 `jre/lib` 子目录下的 `fontconfig.properties` 文件中。有关此文件的信息，请参阅\
  \ [`docs.oracle.com/javase/7/docs/notes/guides/intl/fontconfig.html`](http://docs.oracle.com/javase/7/doc/notes/guides/intl/fontconfig.html)。\n\
  \n你可以读取 TrueType、OpenType 或 PostScript Type 1 格式的字体文件。你需要一个字体输入流——通常来自文件或 URL。（有关流的更多信息，请参见第二卷第一章。）然后，调用静态方法\
  \ `Font.createFont`：\n\n```java\nURL url = new URL(\"http://www.fonts.com/Wingbats.ttf\"\
  );\nInputStream in = url.openStream();\nFont f1 = Font.createFont(Font.TRUETYPE_FONT,\
  \ in);\n```\n\n字体是普通的，字号为 1 磅。使用 `deriveFont` 方法获取所需大小的字体：\n\n```java\nFont f =\
  \ f1.deriveFont(12.0f);\n```\n\n![Image](img/image00950.jpeg)\n\n\n\n\n如果你需要知道基线下降（descent）或行距（leading），可以使用\
  \ `Font` 类的 `getLineMetrics` 方法。该方法返回一个 `LineMetrics` 类的对象，该对象拥有获取基线下降和行距的方法：\n\n\
  点击此处查看代码图像\n\n```java\nLineMetrics metrics = f.getLineMetrics(message, context);\n\
  float descent = metrics.getDescent();\nfloat leading = metrics.getLeading();\n```\n\
  \n接下来的代码使用了所有这些信息将字符串在其所在的组件中居中显示：\n\n点击此处查看代码图像\n\n```java\nFontRenderContext context\
  \ = g2.getFontRenderContext();\nRectangle2D bounds = f.getStringBounds(message,\
  \ context);\n// (x,y) =get 的左上角\ndouble x = (getWidth() - bounds.getWidth()) / 2;\n\
  double y = (getHeight() - bounds.getHeight()) / 2;\n// 将上升高度加到 y 以到达基线\ndouble ascent\
  \ = -bounds.getY();\ndouble baseY = y + ascent;\ng2.drawString(message, (int) x,\
  \ (int) baseY);\n```\n\n为了理解居中的原理，请考虑 `getWidth()` 返回的是组件的宽度。该宽度中的一部分（即 `bounds.getWidth()`）被消息字符串占据。剩余部分应该在两侧均匀分布。因此，每侧的空白区域是差值的一。同样的原理也适用于高度。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注释\n\n当你需要在 `paintComponent` 方法之外计算布局尺寸时，无法从\
  \ `Graphics2D` 对象中获取字体渲染上下文。相反，请调用 `JComponent` 类的 `getFontMetrics` 方法，然后调用 `getFontRenderContext`。\n\
  \n```java\nFontRenderContext context = getFontMetrics(f).getFontRenderContext();\n\
  ```\n\n***\n\n为了证明定位是准确的，示例程序还绘制了基线和边界矩形。图 7.14 显示了屏幕显示；列表 7.5 是程序列表。\n\n![Image](img/image01052.jpeg)\n\
  \n图 7.14. 绘制基线和字符串边界\n\n列表 7.5. font/FontTest.java\n\n点击此处查看代码图像\n\n***\n\n```java\n\
  package font;\n\nimport java.awt.*;\nimport java.awt.font.*;\nimport java.awt.geom.*;\n\
  import javax.swing.*;\n\n/**\n * @version 1.33 2007-04-14\n * @author Cay Horstmann\n\
  \ */\npublic class FontTest\n{\n    public static void main(String[] args)\n   \
  \ {\n        EventQueue.invokeLater(new Runnable()\n          {\n            public\
  \ void run()\n            {\n                JFrame frame = new FontFrame();\n \
  \               frame.setTitle(\"FontTest\");\n                frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \                frame.setVisible(true);\n            }\n          });\n    }\n\
  }\n/**\n * 一个带有文本消息组件的框架\n */\nclass FontFrame extends JFrame\n{\n    public FontFrame()\n\
  \    {\n        add(new FontComponent());\n        pack();\n    }\n}\n\n/**\n *\
  \ 一个在框中显示居中消息的组件。\n */\nclass FontComponent extends JComponent\n{\n    private static\
  \ final int DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT =\
  \ 200;\n\n    public void paintComponent(Graphics g)\n    {\n        Graphics2D\
  \ g2 = (Graphics2D) g;\n\n        String message = \"Hello, World!\";\n\n      \
  \  Font f = new Font(\"Serif\", Font.BOLD, 36);\n        g2.setFont(f);\n\n    \
  \    // 测量消息的大小\n        FontRenderContext context = g2.getFontRenderContext();\n\
  \        Rectangle2D bounds = f.getStringBounds(message, context);\n\n        //\
