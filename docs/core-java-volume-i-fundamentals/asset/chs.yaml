  \n***\n\n### 3.6.9. 构建字符串\n\n有时你需要从较短的字符串构建字符串，例如按键或文件中的单词。使用字符串拼接将是低效的，因为每次拼接字符串时都会创建一个\
  \ `String` 对象。使用 `StringBuilder` 类可以避免这种情况。首先，创建一个空字符串（我们在第 4 章中讨论构造函数和 `new` 运算符）：\n\
  \n```java\nStringBuilder builder = new StringBuilder();\n```\n\n每当你需要添加另一个部分时，调用\
  \ `append` 方法。\n\n```java\nbuilder.append(ch); // 添加单个字符\nbuilder.append(str); //\
  \ 添加字符串\n```\n\n当你完成字符串构建时，调用 `toString` 方法。你会得到一个包含 builder 内容的 `String` 对象\n\n\
  ```java\nString completedString = builder.toString();\n```\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n`StringBuilder` 类引入于 JDK 5.0。它的前身 `StringBuffer` 效率稍低，但允许多线程添加或删除字符。如果所有的编辑都在单线程中进行（通常如此），你应该使用\
  \ `StringBuilder`。这两个类的 API 是相同的。\n\n***\n\n以下 API 说明包含了 `StringBuilder` 类最重要的方法。\n\
  \n***\n\njava.lang.StringBuilder 5.0\n\n- `StringBuilder()`创建一个空的字符串构建器。\n\n- `int\
  \ length()`返回构建器或缓冲区的代码单元数量。\n\n- `StringBuilder append(String str)`添加字符串并返回 `this`。\n\
  \n- `StringBuilder append(char c)`添加代码单元并返回 `this`。\n\n- `StringBuilder appendCodePoint(int\
  \ cp)`添加代码点，将其转换为一个或两个代码单元并返回 `this`。\n\n- `void setCharAt(int i, char c)`将第 `i`\
  \ 个代码单元设置为 `c`。\n\n- `StringBuilder insert(int offset, String str)`在位置 `offset`\
  \ 处插入字符串并返回 `this`。\n\n- `StringBuilder insert(int offset, char c)`在位置 `offset`\
  \ 处插入代码单元并返回 `this`。\n\n- `StringBuilder delete(int startIndex, int endIndex)`删除偏移量从\
  \ `startIndex` 到 `endIndex - 1`的代码单元并返回 `this`。\n\n- `String toString()`返回一个与构建器或缓冲区内容相同的字符串。\n\
  \n***\n\n### 3.7. 输入输出\n\n为了让示例程序更有趣，我们希望接受输入并正确格式化程序输出。当然，现代程序使用 GUI 来收集用户输入。然而，编写这样的界面需要我们目前尚不具备工具工具技术。由于首要任务是更熟悉\
  \ Java 编程语言，我们现在先用简单的控制台进行输入和输出。GUI 编程将在第 7 章到第 9 章中介绍。\n\n#### 3.7.1. 读取输入\n\n\n\
  \n你已经看到，通过调用 `System.out.println` 很容易地向“标准输出流”（即控制台窗口）打印输出。从“标准输入流” `System.in`\
  \ 读取内容就没有那么简单了。要读取控制台输入，你首先要构造连接到 `System.in` 的 `Scanner`：\n\n```java\nScanner in\
  \ = new Scanner(System.in);\n```\n\n（我们将在第 4 章中详细讨论构造函数和 `new` 运算符。）\n\n现在你可以使用\
  \ `Scanner` 类的各种方法来读取输入了。例如，`nextLine` 方法读取一行输入。\n\n```java\nSystem.out.print(\"\
  What is your name? \");\nString name = in.nextLine();\n```\n\n在这里，我们使用 `nextLine`\
  \ 方法是因为输入可能包含空格。要读取单个单词（由空白字符分隔），请调用\n\n```java\nString firstName = in.next();\n\
  ```\n\n要读取一个整数，使用 `nextInt` 方法。\n\n```java\nSystem.out.print(\"How old are you?\
  \ \");\nint age = in.nextInt();\n```\n\n同样，`nextDouble` 方法读取下一个浮点数。\n\n显示列表 3.2\
  \ 中的程序询问用户的姓名和年龄，然后打印如下消息：\n\n```\nHello, Cay. Next year, you'll be 52\n```\n\n\
  最后，注意程序开头的这一行：\n\n```java\nimport java.util.*;\n```\n\n`Scanner` 类定义在 `java.util`\
  \ 包中。每当你使用未在基础 `java.lang` 包中定义的类时，都需要使用 `import` 指令。我们将在第 4 章中详细地介绍包和 `import`\
  \ 指令。\n\n***\n\n![Image](img/image0094.jpeg) 事项\n\n`Scanner` 类不适合从控制台读取密码，因为输入对任何人都是可见的。Java\
  \ SE 6 引入了 `Console` 类专门用于此目的。要读取密码，请使用以下代码：\n\n点击此处查看代码图像\n\n```java\nConsole cons\
  \ = System.console();\nString username = cons.readLine(\"User name: \");\nchar[]\
  \ passwd = cons.readPassword(\"Password: \");\n```\n\n出于安全考虑，密码以字符数组而非字符串的形式返回。完成密码处理后，你应该立即用填充值覆盖数组元素。（数组处理将在本章稍后的部分讨论。）\n\
  \n使用 `Console` 对象进行输入处理不如使用 `Scanner` 那么方便。你一次只能读取一行输入。没有用于读取单个单词或数字的方法。\n\n***\n\
  \nListing 3.2. InputTest/InputTest.java\n\n点击此处查看代码图像\n\n***\n\n```java\n 1  import\
  \ java.util.*;\n 2\n 3  /**\n 4    * 此程序演示了控制台输入。\n 5    * @version 1.10 2004-02-10\n\
  \ 6    * @author Cay Horstmann\n 7    */\n 8  public class InputTest\n 9  {\n10\
  \      public static void main(String[] args)\n11      {\n12          Scanner in\
  \ = new Scanner(System.in);\n13\n14          // 获取第一个输入\n15          System.out.print(\"\
  What is your name? \");\n16          String name = in.nextLine();\n17\n18      \
  \    // 获取第二个输入\n19          System.out.print(\"How old are you? \");\n20      \
  \    int age = in.nextInt();\n21\n22          // 在控制台显示输出\n23          System.out.println(\"\
  Hello, \" + name + \". Next year, you'll be \" + (age + 1));\n24      }\n25  }\n\
  ```\n\n***\n\n***\n\n### `java.util.Scanner` **5.0**\n\n- `Scanner(InputStream in)`\
  \ 从给定的输入流构造一个 `Scanner` 对象。\n- `String nextLine()` 读取下一行输入。\n- `String next()` 读取下一个输入单词（由空白字符分隔）。\n\
  - `int nextInt()` 和 `double nextDouble()` 读取并转换表示整数或浮点数的下一个字符序列。\n- `boolean hasNext()`\
  \ 测试输入中是否还有另一个单词。\n- `boolean hasNextInt()` 和 `boolean hasNextDouble()` 测试下一个字符序列是否表示整数或浮点数。\n\
  \n***\n\n***\n\n### `java.lang.System` **1.0**\n\n- `static Console console()` **6**\
  \ 如果可以通过控制台窗口与用户交互，则返回一个 `Console` 对象用于交互，否则返回 `null`。对于任何在控制台窗口中启动的程序，都可以使用 `Console`\
  \ 对象。否则，其可用性取决于系统。\n\n***\n\n***\n\n### `java.io.Console` **6**\n\n- `static char[]\
  \ readPassword(String prompt, Object... args)`\n- `static String readLine(String\
  \ prompt, Object... args)` 显示提示符并读取用户输入，直到输入行结束。`args` 参数可提供格式化参数，如下一节所述。\n\n***\n\
  \n#### 3.7.2 输出格式化\n\n你可以使用 `System.out.print(x)` 语句向控制台打印数字 `x`。该命令将打印具有该类型最大非零数字位数的\
  \ `x`。例如，\n\n```java\ndouble x = 10000.0 / 3.0;\nSystem.out.print(x);\n```\n\n打印\n\
  \n3333.3333333333335\n\n如果你想显示例如美元和分，这就会是一个问题。\n\n在 Java 的早期版本中，格式化数字有点棘手。幸运的是，Java\
  \ SE 5.0 带回了 C 库中经典的 `printf` 方法。例如，调用\n\n```java\nSystem.out.printf(\"%8.2f\",\
  \ x);\n```\n\n打印具有 8 个字符*字段宽度*和 2 个字符*精度*的 `x`。也就是说，打印输出包含一个前导空格和七个字符\n\n```\n3333.33\n\
  ```\n\n你可以提供多个参数给 `printf`。例如：\n\n```java\nSystem.out.printf(\"Hello, %s. Next year,\
  \ you'll be %d\", name, age);\n```\n\n每个以 `%` 字符开头的格式说明符都会替换为相应的参数。*转换字符*指示要格式化的值的类型：`f`\
  \ 是浮点数，`s` 是字符串，`d` 是十进制整数。此外，你可以指定*标志*来控制格式化输出的外观。[表 3.5] 显示了所有转换符。例如，逗号标志会添加千分位分隔符。那就是，\n\
  \n```java\nSystem.out.printf(\"%,.2f\", 1000.0 / 3.0);\n```\n\n表 3.6 显示了所有标志。\n\n\
  表 3.6. printf 的标志\n\n![Image](img/image0979.jpeg)\n\n打印\n\n```\n3,333.33\n```\n\n\
  可以使用多个标志，例如 `\"%(f\"` 将负数括在括号内。\n\n***\n\n![Image](img/image0948.jpeg) 事项\n\n你可以使用\
  \ `s` 转换格式任意对象。如果任意对象实现了 `Formattable` 接口，则调用对象的 `formatTo` 方法。否则，将调用 `toString`\
  \ 方法将对象转换为字符串。我们将在第 5 章中讨论 `toString` 方法，并在第 6 章中讨论接口。\n\n***\n\n你可以使用静态 `String.format`\
  \ 方法创建格式化字符串而不打印它：\n\n```java\nString message = String.format(\"Hello, %s. Next\
  \ year, you'll be %d\", name, age);\n```\n\n虽然我们直到第 4 章才详细描述 `Date` 类型，但为了完整性，我们确实简要讨论了\
  \ `printf` 方法的日期时间格式化选项。使用双字母格式，以 `t` 开头并以表 3.7 中的字母结尾；例如，\n\n```java\nSystem.out.printf(\"\
  %tc\", new Date());\n```\n\n表 3.7. 日期和时间转换字符\n\n![Image](img/image0980.jpeg)![Image](img/image0981.jpeg)\n\
  \n打印当前日期和时间的格式如下\n\n```\nMon Feb 09 18:05:19 PST 2004\n```\n\n正如你从表 3.7 中看到的，某些格式只产生给定日期的部分——例如仅限天或仅限月份。如果你必须多次提供日期来格式化每个部分，那将有点傻。因此，格式字符串可以指示要格式化的参数的*索引*。索引必须紧跟在\
  \ `%` 之后，并以 `$` 终止。例如，\n\n\n\n\n\n```java\nSystem.out.printf(\"%1$s %2$tB %2$te,\
  \ %2$tY\", \"Due date:\", new Date());\n```\n\n输出如下：\n\nDue date: February 9, 2004\n\
  \n或者，你可以使用 `<` 标志。它表示再次使用与前一个格式说明中相同的参数。也就是说，该语句\n\n```java\nSystem.out.printf(\"\
  %s %tB %<te, %<tY\", \"Due date:\", new Date());\n```\n\n产生的输出与前述语句相同。\n\n***\n\n\
  ![Image](img/image0095.jpeg) 注意事项\n\n参数索引值从 1 开始，而不是从 0：`%1$...` 格式化第一个参数。这避免了与\
  \ `0` 标志的混淆。\n\n***\n\n你现在已经看到了 `printf` 方法的所有特性。图 3.6 显示了格式占位符的语法图。\n\n![Image](img/image00982.jpeg)\n\
  \n图 3.6 格式占位符语法\n\n***\n\n![Image](img/image00948.jpeg) 注意事项\n\n许多格式规则是`特定区域的`。例如，在德国，分组分隔符是点而不是逗号，周一的格式化为\
  \ Montag。你将在第二卷第 5 章中看到如何控制应用程序的国际行为。\n\n***\n\n### 3.7.3. 文件输入与输出\n\n要从文件读取，按所示构造\
  \ `Scanner` 对象：\n\n```java\nScanner in = new Scanner(Paths.get(\"myfile.txt\"));\n\
