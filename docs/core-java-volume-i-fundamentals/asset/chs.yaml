  38                          Font.PLAIN,\n39                          DEFAULT_SIZE));\n\
  40                  }\n41              });\n42\n43          JPanel comboPanel =\
  \ new JPanel();\n44          comboPanel.add(faceCombo);\n45          add(comboPanel,\
  \ BorderLayout.SOUTH);\n46          pack();\n47      }\n48  }\n```\n\n#### 9.4.5\
  \ 滑块\n\n组合框允许用户从一组离散的值中进行选择。滑块提供了连续的值——例如，100 之间的任何数字。\n\n构建滑块最常见的方法如下：\n\n```\n\
  JSlider slider = new JSlider(min, max, initialValue);\n```\n\n如果你省略了最小、最大值初始值，它们将分别初始化为\
  \ `0`、`100` 和 `50`。\n\n或者如果你想让滑块垂直显示，使用以下构造函数：\n\n```\nJSlider slider = new JSlider(SwingConstants.VERTICAL,\
  \ min, initialValue);\n```\n\n这些构造函数创建了一个普通的滑块，例如图 9.18 中的顶部滑块。你现在将看到如何为滑块添加装饰。\n\
  \n![Image](img/image0104.jpeg)\n\n图 9.18. 滑块\n\n当用户滑动滑块条时，滑块的 `value` 在最小值和最大值之间移动。当值变化时，`ChangeEvent`\
  \ 会发送给所有更改监听器。要通知更改，调用 `addChangeListener` 方法并安装实现 `ChangeListener` 接口的对象。该接口有一个方法\
  \ `stateChanged`。在该方法中，你应该获取滑块的值：\n\n```\npublic void stateChanged(ChangeEvent event)\n\
  {\n   JSlider slider = (JSlider) event.getSource();\n   int value = slider.getValue();\n\
  }\n```\n\n你可以通过显示*刻度（ticks）*来装饰滑块。例如，在示例程序中，第二个滑块使用了以下设置：\n\n```\nslider.setMajorTickSpacing(20);\n\
  \nslider.setMinorTickSpacing(5);\n```\n\n滑块每 20 个单位有一个大刻度标记，每 5 个单位有一个小刻度标记。单位指的是滑块的值，而不是像素。\n\
  \n这些指令仅设置了刻度的单位。要让刻度真正出现，请调用\n\n```\nslider.setPaintTicks(true);\n```\n\n主刻度和小刻度是独立的。例如，你可以设置每\
  \ 20 个单位一个主刻度标记，每 7 个单位一个小刻度标记，但这将给你一个非常混乱的刻度。\n\n你可以强制滑块*吸附刻度（snap to ticks）*。当用户在捕捉模式下完成拖动滑块时，它会立即移动到最近的刻度。你通过调用激活此模式：\n\
  \n```\nslider.setSnapToTicks(true);\n```\n\n\n\n“对齐刻度”（snap to ticks）行为的效果并没有你想象的那么好。在滑块真正对齐之前，更改监听器仍然报告与刻度不对应的滑块值。如果你点击滑块旁边——这种操作通常会让滑块沿点击方向稍微移动——开启了“对齐刻度”的滑块不会移动到下一个刻度。\n\
  \n***\n\n你可以通过调用以下方法为主刻度显示*刻度标签（tick mark labels）：\n\n```java\nslider.setPaintLabels(true);\n\
  ```\n\n例如，对于一个范围从 0 到 100 主刻度间距为 20 的滑块，刻度标签分别为 0、20、40、60、80 和 100。\n\n你还可以提供其他的刻度标签，例如字符串或图标（参见图\
  \ 9.18）。这个过程稍微有点复杂。你需要填充一个键类型为 `Integer`、值类型为 `Component` 的哈希表。然后调用 `setLabelTable`\
  \ 方法。组件会被放置在刻度下方。通常使用 `JLabel` 对象。以下是如何将刻度标记为 A、B、C、D、E 和 F 的方法：\n\n点击此处查看代码图片\n\
  \n```java\nHashtable<Integer, Component> labelTable = new Hashtable<Integer, Component>();\n\
  labelTable.put(0, new JLabel(\"A\"));\nlabelTable.put(20, new JLabel(\"B\"));\n\
  // ...\nlabelTable.put(100, new JLabel(\"F\"));\nslider.setLabelTable(labelTable);\n\
  ```\n\n关于哈希表的更多信息请参见第 13 章。代码列表 9.7 也展示了一个使用图标作为刻度标签的滑块。\n\n***\n\n![Image](img/image00949.jpeg)\
  \ 提示\n\n如果刻度或标签没有显示，请双检是否调用了 `setPaintTicks(true)` 和 `setPaintLabels(true)`。\n\n\
  ***\n\n图 9.18 中的第四个滑块没有轨道。要隐藏滑块移动的“轨道”，请调用 `slider.setPaintTrack(false)`。第五个滑块通过调用\
  \ `slider.setInverted(true)` 反转了其方向。\n\n该示例通过一组滑块展示了所有这些效果。每个滑块都有一个更改监听器，将当前滑块值放入框架底部的文本框中。代码列表\
  \ 9.7 `SliderFrame.java` 点击此处查看图片\n\n```java\npackage slider;\n\nimport java.awt.*;\n\
  import java.util.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\n\n/**\n\
  \ * 一个包含许多滑块和用于显示值的文本框的框架。\n */\npublic class SliderFrame extends JFrame {\n   \
  \ private JPanel sliderPanel;\n    private JTextField textField;\n    private ChangeListener\
  \ listener;\n\n    public SliderFrame() {\n        sliderPanel = new JPanel();\n\
  \        sliderPanel.setLayout(new GridBagLayout());\n\n        // 所有滑块的公共监听器\n\
  \        listener = new ChangeListener() {\n            public void stateChanged(ChangeEvent\
  \ event) {\n                // 当滑块改变时更新文本\n                JSlider source = (JSlider)\
  \ event.getSource();\n                textField.setText(\"\" + source.getValue());\n\
  \            }\n        };\n\n        // 添加一个普通滑块\n        JSlider slider = new\
  \ JSlider();\n        addSlider(slider, \"Plain\");\n\n        // 添加一个带有主刻度和刻度的滑块\n\
  \        slider = new JSlider();\n        slider.setPaintTicks(true);\n        slider.setMajorTickSpacing(20);\n\
  \        slider.setMinorTickSpacing(5);\n        addSlider(slider, \"Ticks\");\n\
  \n        // 添加一个可以对齐刻度的滑块\n        slider = new JSlider();\n        slider.setPaintTicks(true);\n\
  \        slider.setSnapToTicks(true);\n        slider.setMajorTickSpacing(20);\n\
  \        slider.setMinorTickSpacing(5);\n        addSlider(slider, \"Snap to ticks\"\
  );\n\n        // 添加一个没有轨道的滑块\n        slider = new JSlider();\n        slider.setPaintTicks(true);\n\
  \        slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n\
  \        slider.setPaintTrack(false);\n        addSlider(slider, \"No track\");\n\
  \n        // 添加一个反向滑块\n        slider = new JSlider();\n        slider.setPaintTicks(true);\n\
  \        slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n\
  \        slider.setInverted(true);\n        addSlider(slider, \"Inverted\");\n\n\
  \        // 添加一个带有数字标签的滑块\n        slider = new JSlider();\n        slider.setPaintTicks(true);\n\
  \        slider.setPaintLabels(true);\n        slider.setMajorTickSpacing(20);\n\
  \        slider.setMinorTickSpacing(5);\n        addSlider(slider, \"Labels\");\n\
  \n        // 添加一个带有字母标签的滑块\n        slider = new JSlider();\n        slider.setPaintLabels(true);\n\
  \        slider.setPaintTicks(true);\n        slider.setMajorTickSpacing(20);\n\
  \        slider.setMinorTickSpacing(5);\n\n        Dictionary<Integer, Component>\
  \ labelTable = new Hashtable<>();\n        labelTable.put(0, new JLabel(\"A\"));\n\
  \        labelTable.put(20, new JLabel(\"B\"));\n        labelTable.put(40, new\
  \ JLabel(\"C\"));\n        labelTable.put(60, new JLabel(\"D\"));\n        labelTable.put(80,\
  \ new JLabel(\"E\"));\n        labelTable.put(100, new JLabel(\"F\"));\n\n     \
  \   slider.setLabelTable(labelTable);\n        addSlider(slider, \"Custom labels\"\
  );\n\n        // 添加一个带有图标标签的滑块\n        slider = new JSlider();\n        slider.setPaintTicks(true);\n\
  \        slider.setPaintLabels(true);\n        slider.setSnapToTicks(true);\n  \
  \      slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(20);\n\
  \n        labelTable = new Hashtable<Integer, Component>();\n\n        // 添加卡片图像\n\
  \        labelTable.put(0, new JLabel(new ImageIcon(\"nine.gif\")));\n        labelTable.put(20,\
  \ new JLabel(new ImageIcon(\"ten.gif\")));\n        labelTable.put(40, new JLabel(new\
  \ ImageIcon(\"jack.gif\")));\n        labelTable.put(60, new JLabel(new ImageIcon(\"\
  queen.gif\")));\n        labelTable.put(80, new JLabel(new ImageIcon(\"king.gif\"\
  )));\n        labelTable.put(100, new JLabel(new ImageIcon(\"ace.gif\")));\n\n \
  \       slider.setLabelTable(labelTable);\n        addSlider(slider, \"Icon labels\"\
  );\n\n        // 添加显示滑块值的文本框\n        textField = new JTextField();\n        add(sliderPanel,\
  \ BorderLayout.CENTER);\n        add(textField, BorderLayout.SOUTH);\n        pack();\n\
  \    }\n\n    /**\n     * 将滑块添加到滑块面板并绑定监听器\n     * @param s 滑块\n     * @param description\
  \ 滑块描述\n     */\n    public void addSlider(JSlider s, String description) {\n  \
  \      s.addChangeListener(listener);\n        JPanel panel = new JPanel();\n  \
  \      panel.add(s);\n        panel.add(new JLabel(description));\n        panel.setAlignmentX(Component.LEFT_ALIGNMENT);\n\
  \        GridBagConstraints gbc = new GridBagConstraints();\n        gbc.gridy =\
  \ sliderPanel.getComponentCount();\n        gbc.anchor = GridBagConstraints.WEST;\n\
  \        sliderPanel.add(panel, gbc);\n    }\n}\n```\n\n\n\n\n- `void setLabelTable(Dictionary\
  \ table)`\n设置用于刻度标签的组件。表中的每个键值对的格式为 `new Integer`(value)/component。\n\n- `void setSnapToTicks(boolean\
  \ b)`\n如果 `b` 为 `true`，则滑块在每次调整后都会将吸附到最邻的刻度上。\n\n- `void setPaintTrack(boolean b)`\n\
  如果 `b` 为 `true`，则显示一个滑块运行的轨道。\n\n***\n\n## 9.5. 菜单 (Menus)\n\n在本章的开始部分，我们介绍了你可能想要放入窗口的常用组件，例如各种种的按钮、文本字段和组合框。Swing\
  \ 还支持另一种类型的用户界面元素——在 GUI 应用程序中常见的下拉菜单。\n\n窗口顶部的*菜单栏*包含下拉菜单的名称。点击名称会打开一个包含*菜单项*和*子菜单*的菜单。当用户点击某个菜单项时，所有菜单都将关闭，并会向程序发送一条消息。图\
  \ 9.19 显示了一个带有子菜单的典型菜单。\n\n![Image](img/image01106.jpeg)\n\n图 9.19. 带有子菜单的菜单\n\n\
  ### 9.5.1. 菜单的构建\n\n构建菜单非常简单。首先，创建一个菜单栏：\n\n```\nJMenuBar menuBar = new JMenuBar();\n\
  ```\n\n菜单栏只是一个可以随心添加到任何地方的组件。通常，你希望它出现在框架的顶部。你可以使用 `setJMenuBar` 方法将其添加到那里：\n\n\
  ```\nframe.setJMenuBar(menuBar);\n```\n\n对于每个菜单，你创建一个菜单对象：\n\n```\nJMenu editMenu\
  \ = new JMenu(\"Edit\");\n```\n\n将顶层菜单添加到菜单栏中：\n\n```\nmenuBar.add(editMenu);\n\
  ```\n\n向菜单对象中添加菜单项、分隔符和子菜单：\n\n点击此处查看代码图片\n\n```\nJMenuItem pasteItem = new JMenuItem(\"\
  Paste\");\n\neditMenu.add(pasteItem);\n\neditMenu.addSeparator();\n\nJMenu optionsMenu\
  \ = . . .; // 一个子菜单\n\neditMenu.add(optionsMenu);\n```\n\n你可以在下方图 9.19 中的 Paste\
  \ 和 Read-only 菜单项看到分隔符。\n\n当用户选择菜单时，会触发一个动作事件。你需要为每个菜单项安装一个动作监听器：\n\n```\nActionListener\
  \ listener = . . .;\n\npasteItem.addActionListener(listener);\n```\n\n`JMenu.add(String\
  \ s)` 方法方便地将菜单项添加到菜单的末尾。例如：\n\n```\neditMenu.add(\"Paste\");\n```\n\n`add` 方法返回创建的菜单项，因此你可以捕获它并添加监听器，如下所示：\n\
  \n点击此处查看代码图片\n\n```\nJMenuItem pasteItem = editMenu.add(\"Paste\");\n\npasteItem.addActionListener(listener);\n\
  ```\n\n经常发生，菜单项会触发命令，而这些命令也可以通过工具栏按钮等其他用户界面元素激活。在第 8 章中，你看到了如何通过 `Action` 对象指定命令。你定义一个实现\
  \ `Action` 接口的类（通常通过扩展 `AbstractAction` 类），在 `AbstractAction` 对象的构造函数中指定菜单项标签，并重写\
  \ `actionPerformed` 方法以持有菜单处理器。例如：\n\n点击此处查看代码图片\n\n```\nAction exitAction = new\
  \ AbstractAction(\"Exit\") // 菜单项在这里\n{\n    public void actionPerformed(ActionEvent\
  \ event)\n    {\n        action code goes here\n        System.exit(0);\n    }\n\
  };\n```\n\n然后你可以将该动作添加到菜单中：\n\n```\nJMenuItem exitItem = fileMenu.add(exitAction);\n\
  ```\n\n该命令使用动作名称向菜单添加一个菜单项。动作对象成为其监听器。这仅仅是下面的代码简写：\n\n```\nJMenuItem exitItem =\
  \ new JMenuItem(exitAction);\n\nfileMenu.add(exitItem);\n```\n\n- `javax.swing.JMenu`\n\
  - `JMenu(String label)` 使用给定标签构造菜单。\n- `JMenuItem add(JMenuItem item)` 添加一个菜单项（或菜单）。\n\
  - `JMenuItem add(String label)` 向此菜单添加带有给定标签的菜单项并返回该项。\n- `JMenuItem add(Action\
  \ a)` 向此菜单添加带有给定动作的菜单项并返回该项。\n- `void addSeparator()` 向菜单中添加一条分隔符线。\n- `JMenuItem\
  \ insert(JMenuItem menu, int index)` 在特定索引处向菜单添加一个新的菜单项（或子菜单）。\n- `JMenuItem insert(Action\
  \ a, int index)` 在特定索引处向菜单添加带有给定动作的新菜单项。\n- `void insertSeparator(int index)` 在菜单中添加分隔符。\n\
  \n![Image](img/image0107.jpeg)\n\n- `void remove(int index)`\n- `void remove(JMenuItem\
  \ item)` 从菜单中移除特定项。\n\n- `javax.swing.JMenuItem`\n- `JMenuItem(String label)` 使用给定标签构造菜单项。\n\
  - `JMenuItem(Action a)` 使用给定动作构造菜单项。\n\n- `javax.swing.AbstractButton`\n- `void\
  \ setAction(Action a)` 设置此按钮的动作。\n\n- `javax.swing.JFrame`\n- `void setJMenuBar(JMenuBar)`\
  \ 为框架设置菜单栏。\n\n### 9.5.2. 菜单项中的图标\n\n菜单项与按钮非常相似。事实上，`JMenuItem` 类继承自 `AbstractButton`。就像按钮一样，菜单可以只有文本标签、只有图标，或者两者都有。你可以通过\
  \ `JMenuItem(String, Icon)` 或 `JMenuItem(Icon)` 构造函数指定图标，也可以通过 `JMenuItem` 类继承的\
  \ `setIcon` 方法设置图标。例如：\n\n```\nJMenuItem cutItem = new JMenuItem(\"Cut\", ImageIcon(\"\
  cut.gif\"));\n```\n\n在图 9.19（473 页），你可以看到菜单项旁有图标。默认情况下，菜单项文本位于图标右侧。如果你希望文本位于左侧，调用\
  \ `JMenuItem` 类继承的 `setHorizontalTextPosition` 方法。例如，调用\n\n```\ncutItem.setHorizontalTextPosition(SwingConstants.LEFT);\n\
  ```\n\n你也可以为动作添加图标：\n\n```\ncutAction.putValue(Action.SMALL_ICON, new ImageIcon(\"\
  cut.gif\"));\n```\n\n每当你从动作构造菜单项时，`Action.NAME` 值变为菜单项文本，`Action.SMALL_ICON` 值变为图标。\n\
  \n或者，你可以在 `AbstractAction` 构造函数中设置图标：\n\n点击此处查看代码图片\n\n```\ncutAction = new AbstractAction(\"\
  Cut\", new ImageIcon(\"cut.gif\"))\n{\n    public void actionPerformed(ActionEvent\
  \ event)\n    {\n        action code goes here\n    }\n};\n```\n\n- `javax.swing.JMenuItem`\n\
  - `JMenuItem(String label, Icon icon)` 使用给定标签和图标构造菜单项。\n\n- `javax.swing.AbstractButton`\n\
  - `void setHorizontalTextPosition(int pos)` 设置文本相对于图标的水平位置。\n\n![Image](img/image0108.jpeg)\n\
  \n- `javax.swing.AbstractAction`\n- `AbstractAction(String name, Icon smallIcon)`\
  \ 使用给定的名称和图标构造抽象动作。\n\n### 9.5.3. 复选框和单选框菜单项\n\n*复选框*和*单选框*菜单项在名称旁边显示一个复选框或单选框（见\
  \ 473 页 part0014.xhtml_ch09fig19)[图 9.19）。当用户选择菜单项时，该项会自动在选中和未选中状态之间切换。\n\n除了按钮装饰外，像处理其他菜单项一样处理这些项。例如，这里是创建一个复选框菜单项的方法：\n\
  \n点击此处查看代码图片\n\n```\nJCheckBoxMenuItem readonlyItem = new JCheckBoxMenuItem(\"Read-only\"\
  );\n\noptionsMenu.add(readonlyItem);\n```\n\n\n\n\n\n- 点击此处查看代码图片\n\n```java\nButtonGroup\
  \ group = new ButtonGroup();\n\nJRadioButtonMenuItem insertItem = new JRadioButtonMenuItem(\"\
  Insert\");\n\ninsertItem.setSelected(true);\n\nJRadioButtonMenuItem overtypeItem\
  \ = new JRadioButtonMenuItem(\"Overtype\");\n\ngroup.add(insertItem);\ngroup.add(overtypeItem);\n\
  \noptionsMenu.add(insertItem);\noptionsMenu.add(overtypeItem);\n```\n\n对于这些菜单项，你并不一定希望在用户选择项目时收到通知。相反，你可以简单地使用\
  \ `isSelected` 方法来测试菜单项的当前状态。（当然，这意味着你应该在实例字段中存储该菜单项的引用）。使用 `setSelected` 方法来设置状态。\n\
  \n***\n\n### javax.swing.JCheckBoxMenuItem 1.2\n\n- `JCheckBoxMenuItem(String label)`\n\
  构造带有给定标签的复选框菜单项。\n\n- `JCheckBoxMenuItem(String label, boolean state)`\n构造带有给定标签和给定初始状态（`true`\
  \ 为选中）的复选框菜单项。\n\n***\n\n### javax.swing.JRadioButtonMenuItem 1.2\n\n- `JRadioButtonMenuItem(String\
  \ label)`\n构造带有给定标签的单选按钮菜单项。\n\n- `JRadioButtonMenuItem(String label, boolean state)`\n\
  构造带有给定标签和给定初始状态（`true` 为选中）的单选按钮菜单项。\n\n***\n\n### javax.swing.AbstractButton 1.2\n\
  \n- `boolean isSelected()`\n- `void setSelected(boolean state)`\n获取或设置此项目的选中状态（`true`\
  \ 为选中）。\n\n***\n\n#### 9.5.4 弹出菜单\n\n*弹出菜单*（popup menu）是一种不附着在菜单栏上而是悬浮在某处的菜单（请参见\
  \ 图 9.20）。\n\n![Image](img/image0110.jpeg)\n\n图 9.20 弹出菜单\n\n创建弹出菜单的方法与创建普通菜单相同，只是弹出菜单没有标题。\n\
  \n```java\nJPopupMenu popup = new JPopupMenu();\n```\n\n然后，像往常一样添加菜单项：\n\n```java\n\
  JMenuItem item = new JMenuItem(\"Cut\");\nitem.addActionListener(listener);\npopup.add(item);\n\
  ```\n\n与始终显示在框架顶部的普通菜单栏不同，你必须使用 `show` 方法显式地显示弹出菜单。使用父组件的坐标系指定父组件和弹出菜单的位置。例如：\n\n\
  ```java\npopup.show(panel, x, y);\n```\n\n通常你希望在用户点击特定的鼠标按钮时弹出菜单——这就是所谓的*弹出触发器*（pop-up\
  \ trigger）。在 Windows 和 Linux 中，弹出触发器是非主（通常是右）鼠标按钮。若要在用户点击组件时使用弹出触发器弹出菜单，只需调用方法：\n\
  \n```java\ncomponent.setComponentPopupMenu(popup);\n```\n\n极少数情况下，你可能会将一个组件放在另一个带有弹出菜单的组件内部。子组件可以通过调用来继承父组件的弹出菜单：\n\
  \n```java\nchild.setInheritsPopupMenu(true);\n```\n\n***\n\n### javax.swing.JPopupMenu\
  \ 1.2\n\n- `void show(Component c, int x, int y)`\n显示弹出菜单。\n\n![Image](img/image01110.jpeg)\n\
  \n- `boolean isPopupTrigger(MouseEvent event)` 1.3\n如果鼠标事件是弹出菜单触发器，则返回 `true`。\n\
  \n***\n\n### java.awt.event.MouseEvent 1.1\n\n- `boolean isPopupTrigger()`\n如果此鼠标事件是弹出菜单触发器，则返回\
  \ `true`。\n\n***\n\n### javax.swing.JComponent 1.2\n\n- `JPopupMenu getComponentPopupMenu()`\
  \ 5.0\n- `void setComponentPopupMenu(JPopupMenu popup)` 5.0\n获取或设置此组件的弹出菜单。\n\n\
  - `boolean getInheritsPopupMenu()` 5.0\n- `void setInheritsPopupMenu(boolean b)`\
  \ 5.0\n获取或设置 `inheritsPopupMenu` 属性。如果该属性被设置且此组件的弹出菜单为 `null`，它将使用父组件的弹出菜单。\n\n\
  ***\n\n#### 9.5.5 键盘助键和加速器\n\n对于经验用户来说，通过*键盘助键*（keyboard mnemonics）选择菜单项是非常方便的。你可以通过在菜单项构造函数中指定一个助键字母来为菜单项创建一个键盘助键：\n\
  \n```java\nJMenuItem aboutItem = new JMenuItem(\"About\", 'A');\n```\n\n键盘助键会自动显示在菜单中，助键字母带有下划线（请参见\
  \ 图 9.21）。例如，在在上一个示例定义的项中，标签将显示为“About”，并带有带下划线的字母“A”。当菜单显示时，用户只需按下 A 键，菜单项就会被选中。（如果助键字母不是菜单字符串的一部分，输入它仍然可以选中该项，但助键不会显示在菜单中。自然地，这种不可见的助键用处存疑。）\n\
  \n![Image](img/image0111.jpeg)\n\n图 9.21 键盘助键\n\n有时，你并不一定希望在用户选择项目时收到通知。相反，你可以简单地使用\
  \ `isSelected` 方法来测试菜单项的当前状态。（当然，这意味着你应该在实例字段中存储该菜单项的引用）。使用 `setSelected` 方法来设置状态。\n\
  \n（注：原文中存在大量重复段落，已按要求仅保留核心内容并翻译。）\n\n***\n\n### 加速器\n\n*加速器*（Accelerators）是键盘快捷键，让你无需打开菜单即可选择菜单项。相比之下，键盘助键需要先打开菜单。\n\
  \n要为菜单项附加加速器，请使用 `setAccelerator` 方法。`setAccelerator` 方法接收 `KeyStroke` 类型的对象。例如，以下调用将\
  \ Ctrl+O 加速器附加到 `openItem`：\n\n```java\nopenItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl O\"));\n```\n\n输入加速组合会自动选择菜单选项并触发动作事件，就像用户手动选择了菜单一样。\n\n\n\n\n设置按钮文本中要下划线的字符索引。如果你不希望第一个出现的助记符字符被设置下划线，请使用此方法。\n\
  \n## 9.5.6. 启用和禁用菜单项\n\n有时，特定的菜单项应该只在某些上下文中被选中。例如，当文档以只读模式打开时，“保存”菜单项就是没有意义的。当然，我们可以使用\
  \ `JMenu.remove` 方法从菜单中移除该项，但用户会对内容不断变化的菜单感到有些惊讶。相反，更好的做法是禁用那些会导致临时不恰当命令的菜单项。被禁用的菜单项将以灰色显示，且无法选择（参见图\
  \ 9.23）。\n\n![Image](img/image0111.jpeg)\n\n图 9.23 禁用的菜单项\n\n要启用或禁用菜单项，请使用 `setEnabled`\
  \ 方法：\n\n```java\nsaveItem.setEnabled(false);\n```\n\n启用和禁用菜单项有两种策略。每当情况发生时，你可以在相关的菜单项或操作上调用\
  \ `setEnabled`。例如，一旦文档被设置为只读模式，你就可以找到“保存”和“另存为”菜单项并禁用它们。或者，你可以在显示菜单之前禁用这些项。要做到这一点，你必须为“菜单被选中”事件注册一个监听器。`javax.swing.event`\
  \ 程序包定义了一个 `MenuListener` 接口，它包含三个方法：\n\n```java\nvoid menuSelected(MenuEvent event)\n\
  void menuDeselected(MenuEvent event)\nvoid menuCanceled(MenuEvent event)\n```\n\n\
  `menuSelected` 方法在菜单显示*之前*被调用。因此，它可以用于禁用或启用菜单项。以下代码显示了每当选中“只读”复选框菜单项时，如何禁用“保存”和“另存为”操作：\n\
  \n点击此处查看代码图片\n\n```java\npublic void menuSelected(MenuEvent event)\n{\n    saveAction.setEnabled(!readonlyItem.isSelected());\n\
  \    saveAction.setEnabled(!readonlyItem.isSelected());\n}\n```\n\n![Image](img/image00950.jpeg)\
  \ 注意\n\n在显示菜单之前禁用菜单项是一个聪明的主意，但对于也带有加速键的菜单项它无效。因为当按下加速键时菜单永远不会打开，因此该操作永远不会被禁用，仍然可以通过加速键触发。\n\
  \n### javax.swing.JMenuItem 1.2\n\n* `void setEnabled(boolean b)`\n  启用或禁用菜单项。\n\
  \n### javax.swing.event.MenuListener 1.2\n\n* `void menuSelected(MenuEvent e)`\n\
  \  在菜单被选中后、打开前被调用。\n* `void menuDeselected(MenuEvent e)`\n  在菜单被取消选中后、关闭后被被调用。\n\
  * `void menuCanceled(MenuEvent e)`\n  在菜单被取消时被调用，例如用户点击了菜单外部。\n\nListing 9.8 是一个生成一组菜单的示例程序。它展示了你在本节中看到的所有功能：嵌套菜单、禁用的菜单项、复选框和单选按钮菜单项、弹出菜单以及键盘助记符和加速键。\n\
