  \ 提供了一个 `JFileChooser` 类，允许你显示一个与原生应用程序使用的类似的对话框。`JFileChooser` 对话框是模态的。与其调用 `setVisible(true)`，不如调用\
  \ `showOpenDialog` 来显示打开文件的对话框，或调用 `showSaveDialog` 来显示保存文件的对话框。接受文件的按钮将标记为“打开”或“保存”。你也可以通过\
  \ `showDialog` 方法提供自己的按钮。图 9.40 显示了文件选择器对话框的示例。\n\n以下是弹出文件对话框并恢复用户从中选择内容的步骤：\n\n\
  1. **创建一个 `JFileChooser` 对象。** 与 `JDialog` 类的构造函数不同，你不需要提供父组件。这允许你在多个帧之间复用一个文件选择器对话框。例如：`JFileChooser\
  \ chooser = new JFileChooser();`\n\n**提示：** 复用文件选择器对象是一个好主意，因为 `JFileChooser` 构造函数可能会慢，特别是在用户有许多映射网络驱动器的\
  \ Windows 上。\n\n2. **通过调用 `setCurrentDirectory` 方法设置目录。** 例如，为了使用当前工作目录 `chooser.setCurrentDirectory(new\
  \ File(\".\"));`，你需要提供一个 `File` 对象。`File` 对象在第 12 章 中有详细介绍。你只需要知道构造函数 `File(String\
  \ filename)` 将文件名或目录名转换为 `File` 对象。\n\n3. **如果你有一个期望用户选择默认文件名，通过 `setSelectedFile`\
  \ 方法提供它：** `chooser.setSelectedFile(new File(filename));`。\n\n4. **要允许用户在对话框中选择多个文件，调用\
  \ `setMultiSelectionEnabled` 方法。** 这当然是完全可选的，而且并不常见。\n\n\n\n\n\n## 5. 如果你想限制对话框中显示的文件为特定类型（例如，所有扩展名为\
  \ `.gif` 的文件），你需要设置一个*文件过滤器*（file filter）。我们将在本节后续部分讨论文件过滤器。\n\n## 6. 默认情况下，用户使用文件选择器只能选择文件。如果你想让用户选择目录，请使用\
  \ `setFileSelectionMode` 方法。调用时传入 `JFileChooser.FILES_ONLY`（默认值）、`JFileChooser.DIRECTORIES_ONLY`\
  \ 或 `JFileChooser.FILES_AND_DIRECTORIES` 之一。\n\n## 7. 通过调用 `showOpenDialog` 或 `showSaveDialog`\
  \ 方法来显示对话框。在这些调用中，你必须提供父组件：\n\n```\nint result = chooser.showOpenDialog(parent);\n\
  ```\n\n或者\n\n```\nint result = chooser.showSaveDialog(parent);\n```\n\n这些调用之间的唯一区别在于“确认按钮”的标签——即用户点击以完成文件选择的按钮。你也可以调用\
  \ `showDialog` 方法并为确认按钮传递显式的文本：\n\n```\nint result = chooser.showDialog(parent,\
  \ \"Select\");\n```\n\n这些调用只有在用户确认、取消或关闭了文件对话框后才会返回。返回值为 `JFileChooser.APPROVE_OPTION`、`JFileChooser.CANCEL_OPTION`\
  \ 或 `JFileChooser.ERROR_OPTION`。\n\n## 8. 使用 `getSelectedFile()` 或 `getSelectedFiles()`\
  \ 方法获取选中的文件或多个文件。这些方法返回单个 `File` 对象或一个 `File` 对象数组。如果你只需要文件对象的名称，请调用它的 `getPath`\
  \ 方法。例如：\n\n```\nString filename = chooser.getSelectedFile().getPath();\n```\n\n\
  在大多数情况下，这些步骤都是简单的。使用文件对话框的主要困难在于指定用户应从中选择的文件子集。例如，假设用户应该选择一个 GIF 图像文件。那么，文件选择器应该只显示扩展名为\
  \ `.gif` 的文件。它还应该给用户提供某种反馈，说明显示的文件属于特定类别，例如“GIF Images”。但情况可能会更复杂。如果用户应该选择 JPEG\
  \ 图像文件，扩展可以是 `.jpg` 或 `.jpeg`。文件选择器的设计者没有通过编码来处理这些复杂性，而是提供了一种更优雅的机制：为了限制显示的文件，提供一个扩展\
  \ `javax.swing.filechooser.FileFilter` 抽象类的对象。文件选择器会将每个文件传递给文件过滤器，并只显示过滤器接受的文件。\n\
  \n在编写本文时，提供了两个这样的子类：接受所有文件的默认过滤器，以及一个接受所有给定扩展名文件的过滤器。然而，编写即时文件过滤器是很容易的。你只需要实现 `FileFilter`\
  \ 超类的两个抽象方法即可：\n\n```\npublic boolean accept(File f);\n\npublic String getDescription();\n\
  ```\n\n第一个方法测试一个文件是否应该被接受。第二个方法返回一个可以在文件选择器对话框中显示的文件类型描述。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n`java.io` 包中一个不相关的 `FileFilter` 接口只有一个方法，`boolean accept(File f)`。它被用于 `File`\
  \ 类的 `listFiles` 方法中，以列出目录中的文件。我们不知道 Swing 的设计者为什么没有扩展这个接口——也许 Java 类库现在已经变得如此复杂，以至于是\
  \ Sun 的程序员也不再熟悉所有的标准类和接口了。\n\n如果你同时导入了 `java.io` 和 `javax.swing.filechooser` 包，将需要解决这两个同名类型之间的名称冲突。最简单的办法是导入\
  \ `javax.swing.filechooser.FileFilter`，而不是 `javax.swing.filechooser.*`。\n\n***\n\
  \n一旦你有了文件过滤器对象，使用 `JFileChooser` 类的 `setFileFilter` 方法将其安装到文件选择器对象中：\n\n```\nchooser.setFileFilter(new\
  \ FileNameExtensionFilter(\"Image files\", \"gif\", \"jpg\"));\n```\n\n你可以通过调用以下方法为文件选择器安装多个过滤器：\n\
  \n```\nchooser.addChoosableFileFilter(filter1);\n\nchooser.addChoosableFileFilter(filter2);\n\
  ```\n\n. . .\n\n用户从文件对话框底部的组合框中选择过滤器。默认情况下，“All files”过滤器始终出现在组合框中。这是一个好主意——以防你的程序的用户需要选择具有非标准扩展的文件。然而，如果你想抑制“All\
  \ files”过滤器，请调用\n\n``````\nchooser.setAcceptAllFileFilterUsed(false)\n```\n\n***\n\
  \n![Image](img/image00950.jpeg) 警告\n\n如果你复用同一个文件选择器来加载和保存不同类型的文件，请调用\n\n```\nchooser.resetChoosableFilters()\n\
  ```\n\n在添加新过滤器之前清除任何旧的过滤器。\n\n***\n\n最后，你可以通过为文件选择器提供每种文件的图标和描述来定制文件对话框。通过提供一个扩展\
  \ `javax.swing.filechooser` 包中 `FileView` 类的对象来实现——这是一种高级技术。通常情况下，如果你想为文件类型显示不同的图标，你需要扩展\
  \ `FileView` 类并实现五个方法：\n\n```\nIcon getIcon(File f);\n\nString getName(File f);\n\
  \nString getDescription(File f);\n\nString getTypeDescription(File f);\n\nBoolean\
  \ isTraversable(File f);\n```\n\n使用 `setFileView` 方法将文件视图安装到文件选择器。文件选择器会对想要显示的每个文件调用你的方法。如果你的图标、名称或描述返回了\
  \ `null`，文件选择器将咨询默认的文件视图。`isTraversable` 方法返回一个 `Boolean` 对象，而不是 `boolean` 值！这听起来很奇怪，但实际上非常方便——它允许你在三个选项之间选择：`Boolean.TRUE`、`Boolean.FALSE`\
  \ 以及不感兴趣（`null`）。文件选择器调用该方法来决定当用户点击它时是否打开目录。也就是说，如果你对默认的文件视图感兴趣，只需返回 `null` 即可。\n\
  \n示例程序包含了一个简单的文件视图类。该类在文件匹配过滤器时显示一个特定的图标。\n\n```\nclass FileIconView extends FileView\n\
  {\n  public FileIconView(FileFilter aFilter, Icon anIcon)\n  {\n    filter = aFilter;\n\
  \    icon = anIcon;\n  }\n\n  public Icon getIcon(File f)\n  {\n    if (!f.isDirectory()\
  \ && filter.accept(f))\n      return icon;\n    else return null;\n  }\n\n  private\
  \ FileFilter filter;\n  private Icon icon;\n}\n```\n\n通过 `setFileView` 方法将此文件视图安装到你的文件选择器：\n\
  \n```\nchooser.setFileView(new FileIconView(filter,\nnew ImageIcon(\"palette.gif\"\
  )));\n```\n\n文件选择器将在所有通过 `filter` 的文件旁边显示调板图标，并使用默认文件视图显示所有其他文件。自然，我们使用了我们在文件选择器设置的同一个过滤器。\n\
  \n***\n\n![Image](img/image00949.jpeg) 提示\n\n在 JDK 的 `demo/jfc/FileChooserDemo`\
  \ 目录下，你可以找到一个更有用的 `ExampleFileView` 类。该类允许你为扩展名关联图标和描述。\n\n\n\n\n\n配件可以是任何 `Swing`\
  \ 组件。在我们的案例中，我们扩展了 `JLabel` 类并将其图标设置为图形图像的缩放副本：\n\n点击此处查看代码图片\n\n```java\nclass\
  \ ImagePreviewer extends JLabel\n{\n    public ImagePreviewer(JFileChooser chooser)\n\
  \    {\n        setPreferredSize(new Dimension(100, 100));\n        setBorder(BorderFactory.createEtchedBorder());\n\
  \    }\n    public void loadImage(File f)\n    {\n        ImageIcon icon = new ImageIcon(f.getPath());\n\
  \        if(icon.getIconWidth() > getWidth())\n            icon = new ImageIcon(icon.getImage().getScaledInstance(\n\
  \                getWidth(), -1, Image.SCALE_DEFAULT));\n        setIcon(icon);\n\
  \        repaint();\n    }\n}\n```\n\n这里只有一个挑战。我们希望在用户选择不同的文件时更新预览图像。文件选择器使用“JavaBeans”机制，每当它的任何一个属性发生变化时通知感兴趣的监听器。选中的文件是一个属性，你可以通过安装一个\
  \ `PropertyChangeListener` 来监控它。我们将在第二卷第 8 章中详细讨论这种机制。这里是捕获通知所需的代码：\n\n点击此处查看代码图片\n\
