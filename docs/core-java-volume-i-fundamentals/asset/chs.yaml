  \ 调试技巧\n\n假设你写好了程序并通过捕获和正确处理异常使其健壮。然后你运行它，结果报错。现在怎么办？（如果你从未遇到这个问题，可以跳过本章剩余部分。）\n\
  \n当然，最好有一个方便且强大的调试器。调试器作为 Eclipse 和 NetBeans 等开发环境的一部分，我们在本章后面讨论调试器。在本节中，我们在启动调试器之前提供一些可能很有用的技巧。\n\
  \n**1.** 你可以使用下面的代码打印或记录变量的值：\n\n```java\nSystem.out.println(\"x=\" + x);\n```\n\
  \n或\n\n```java\nLogger.getGlobal().info(\"x=\" + x);\n```\n\n如果`x`是数字，会被转换为字符串。如果`x`是一个对象，Java\
  \ 会调用其`toString`方法。要获取隐式参数对象的状态，打印`this`对象。\n\n```java\nLogger.getGlobal().info(\"\
  this=\" + this);\n```\n\n**2.** 一个看似用的技巧是在每个类中放置一个独立的`main`方法。在方法内部，你可以放置一个单元测试存根，让你能够孤立地测试类。\n\
  \n```java\npublic class MyClass\n{\n    方法和字段\n    ...\n    public static void main(String[]\
  \ args)\n    {\n        测试代码\n    }\n}\n```\n\n创建几个对象，调用所有方法，并检查每个方法是否运行正常。你可以保留这些`main`方法，并单独对每个文件启动\
  \ Java 虚拟机来运行测试。当你运行 applet 时，这些`main`方法都不会被调用。当你运行应用程序时，Java 虚拟机只调用启动类的`main`方法。\n\
  \n**3.** 如果你喜欢上面的技巧，应该查看[`junit.org`](http://junit.org)上的 JUnit。JUnit 是一个非常流行的单元测试框架，可以方便组织测试用例集。每当你修改类时运行测试，每当发现错误时就添加另一个测试用例。\n\
  \n\n\n\n### 4. `logging proxy`（日志代理）是一个子类对象，它会拦截方法调用、对其进行记录，然后调用父类。例如，如果你在 `Random`\
  \ 类的 `nextDouble` 方法上遇到问题，可以创建一个匿名子类的实例来作为代理对象：\n\n点击此处查看代码图像\n\n```java\nRandom\
  \ generator = new Random()\n{\n    public double nextDouble()\n    {\n        double\
  \ result = super.nextDouble();\n        Logger.getGlobal().info(\"nextDouble: \"\
  \ + result);\n        return result;\n    }\n};\n```\n\n每当 `nextDouble` 方法被调用时，就会生成一条日志消息。要找出是谁调用了该方法，可以生成一个堆栈跟踪（stack\
  \ trace）。\n\n### 5. 你可以通过 `Throwable` 类中的 `printStackTrace` 方法从任何异常对象获取堆栈跟踪。以下代码捕获任何异常，打印异常对象和堆栈跟踪，并重新抛出异常，使其能够找到预期的处理器。\n\
  \n```java\ntry\n{\n    . . .\n}\ncatch (Throwable t)\n{\n    t.printStackTrace();\n\
  \    throw t;\n}\n```\n\n你甚至不需要捕获异常即可生成堆栈跟踪。只需在代码的任何地方插入 `Thread.dumpStack()` 语句即可获取堆栈跟踪。\n\
  \n### 6. 通常情况下，堆栈跟踪显示在 `System.err.` 上。如果你想记录或显示堆栈跟踪，可以通过以下方法将其捕获到字符串中：\n\n点击此处查看代码图像\n\
  \n```java\nByteArrayOutputStream out = new ByteArrayOutputStream();\nnew Throwable().printStackTrace(out);\n\
  String description = out.toString();\n```\n\n### 7. 将程序错误捕获到文件中通常很有用。然而，错误发送到 `System.err`\
  \ 而不是 `System.out`。因此，你不能简单地通过运行来捕获：\n\n```bash\njava MyProgram > errors.txt\n```\n\
  \n相反，应这样捕获错误流：\n\n```bash\njava MyProgram 2> errors.txt\n```\n\n若要在同一个文件中捕获 `System.err`\
  \ 和 `System.out`，请使用：\n\n```bash\njava MyProgram >& errors.txt\n```\n\n这在 `bash`\
  \ 和 Windows shell 中均有效。\n\n### 8. 让未捕获异常的堆栈跟踪显示在 `System.err` 中并不是理想的。如果用户恰好看到这些消息，会让他们感到困惑，而且当你需要诊断时，它们并不可。更好的方法是将它们记录到文件中。你可以使用静态方法\
  \ `Thread.setDefaultUncaughtExceptionHandler` 来更改未捕获异常的处理器：\n\n点击此处查看代码图像\n\n```java\n\
  Thread.setDefaultUncaughtExceptionHandler(\n    new Thread.UncaughtExceptionHandler()\n\
  \    {\n        public void uncaughtException(Thread t, Throwable e)\n        {\n\
  \            // 在日志文件中保存信息\n        };\n    }\n);\n```\n\n### 9. 要监控类加载，请使用 `-verbose`\
  \ 标志启动 Java 虚拟机。你将得到如下的输出：\n\n点击此处查看代码图像\n\n```text\n[Opened /usr/local/jdk5.0/jre/lib/rt.jar]\n\
  [Opened /usr/local/jdk5.0/jre/lib/jsse.jar]\n[Opened /usr/local/jdk5.0/jre/lib/jce.jar]\n\
  [Opened /usr/local/jdk5.0/jre/lib/charsets.jar]\n[Loaded java.lang.Object from shared\
  \ objects file]\n[Loaded java.io.Serializable from shared objects file]\n[Loaded\
  \ java.lang.Comparable from shared objects file]\n[Loaded java.lang.CharSequence\
  \ from shared objects file]\n[Loaded java.lang.String from shared objects file]\n\
  [Loaded java.lang.reflect.GenericDeclaration from shared objects file]\n[Loaded\
  \ java.lang.reflect.Type from shared objects file]\n[Loaded java.lang.reflect.AnnotatedElement\
  \ from shared objects file]\n[Loaded java.lang.Class from shared objects file]\n\
  [Loaded java.lang.Cloneable from shared objects file]\n. . .\n```\n\n这偶尔对于诊断类类路径问题很有帮助。\n\
  \n### 10. `-Xlint` 选项告诉编译器识别常见的代码问题。例如，如果你使用命令编译：\n\n```bash\njavac -Xlint:fallthrough\n\
  ```\n\n编译器将报告 `switch` 语句中缺少 `break` 语句。（“lint”一词最初描述一种用于定位 C 程序中潜在问题的工具，但现在泛指适用于任何可疑但非法的结构。）\n\
  \n### 11. Java VM 支持对 Java 应用进行监控和管理，允许在虚拟机中安装代理（agents）以跟踪内存消耗、线程使用等。这一功能对于大型且长时间运行的\
  \ Java 程序（如应用服务器）特别重要。作为这些能力的演示，JDK 自带了一个名为 `jconsole` 的图形化工具，它可以显示虚拟机性能的统计数据（参见图\
  \ 1.3）。运行虚拟机的操作系统 ID。在 UNIX/Linux 中，运行 `ps` 工具；在 Windows 中，使用任务管理器。然后启动 `jconsole`\
  \ 程序。`jconsole` 程序提供了有关你运行程序的丰富信息。更多信息请参阅 [www.oracle.com/technetwork/articles/jconsole-15641](http://www.oracle.com/technetwork/articles/jconsole-15641)。\n\
  \n### 12. 你可以使用 `jmap` 工具获取堆转储，它可以显示堆中的每个对象。使用以下命令：\n\n```bash\njmap -dump:format=b,file=dump```\n\
  \n指向 `localhost:7000` 你的应用程序。\n\n### 13. 如果你带有 `-prof` 标志启动 Java 虚拟机，它将运行一个基础剖析器，跟踪代码中执行频繁的方法。分析信息将发送到\
  \ `System.out`。输出会告诉你哪些方法被编译 `X` 选项在所有 JDK 版本中可能可用。运行 `java -X` 以获取非标准选项列表。\n\n\
  ### 11.7 GUI 程序排错技巧\n\n在本节中，我们将提供一些针对 GUI 编程的额外技巧。然后，我们将展示如何使用 AWT 机器人进行 GUI 测试。\n\
  \n**1.** 如果你曾观察一个 Swing 窗口并好奇设计师是如何让所有组件整齐排列的，你可以对内容进行监控。按下 `Ctrl+Shift+F1` 获取组件层级的输出：\n\
  \n点击此处查看代码图像\n\n```text\nFontDialog[frame0,0,0,300x200,layout=java.awt.BorderLayout...]\n\
