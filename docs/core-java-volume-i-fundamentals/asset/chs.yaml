  \n许多编程语言（特别是 C++ 和 Pascal）有两种参数传递机制：按值传递和按引用传递。一些程序员（不幸的是，甚至还有一些书的作者）声称 Java 对对象使用引用传递。这是错误的。由于这是一个非常普遍的误解，有必要详细检查一个反例。\n\
  \n让我们尝试写一个交换两个员工对象位置的方法：\n\n点击此处查看代码图像\n\n```java\npublic static void swap(Employee\
  \ x, Employee y) // 不起作用\n{\n    Employee temp = x;\n    x = y;\n    y = temp;\n\
  }\n```\n\n如果 Java 编程语言对对象使用引用传递，那么这个方法将会生效：\n\n点击此处查看代码图像\n\n```java\nEmployee a\
  \ = new Employee(\"Alice\", . . .);\nEmployee b = new Employee(\"Bob\", . . .);\n\
  swap(a, b);\n// 现在 a 指向 Bob，b 指向 Alice 吗？\n```\n\n然而，该方法并没有改变存储在变量 `a` 和 `b` 中的对象引用。`swap`\
  \ 方法的参数 `x` 和 `y` 用这些引用的*副本*初始化的。该方法随后交换这些副本。\n\n```java\n// x 指向 Alice，y 指向 Bob\n\
  Employee temp = x;\nx = y;\ny = temp;\n// 现在 x 指向 Bob，y 指向 Alice\n```\n\n但最终，这是徒用功。当方法结束时，参数变量\
  \ `x` 和 `y` 被丢弃了。原始变量 `a` 和 `b` 仍然指向与方法调用之前相同的对象（参见图 4.8）。\n\n![Image](img/image01014.jpeg)\n\
  \n图 4.8。交换对象参数没有持久性影响。\n\n这说明 Java 编程语言对对象并不使用引用传递。相反，对象引用是通过按值传递的。\n\n以下是关于在 Java\
  \ 方法参数中可以做和不能做的总结：\n\n* 方法不能修改基本类型参数（即数字或 `boolean` 数值）。\n* 方法可以改变对象参数的*状态*。\n*\
  \ 方法不能让对象参数引用一个新的对象。\n\n位于代码列表 4.4 中的程序演示了这些事实。程序首先尝试将一个数字参数的值设为三倍，但没有成功：\n\nTesting\
  \ tripleValue:\nBefore: percent=10.0\n方法结束: x=30.0\nAfter: percent=10.0\n\n然后它成功地将一个员工的薪水增加了三倍：\n\
  \nTesting tripleSalary:\nBefore: salary=50000.0\n方法结束: salary=150000.0\nAfter: salary=150000.0\n\
  \n方法执行后，`harry` 所引用对象的状态发生了变化。这是可能的，因为方法通过对象引用的副本修改了状态。\n\n最后，该程序演示了 `swap` 方法的失败：\n\
  \nTesting swap:\nBefore: a=Alice\nBefore: b=Bob\n方法结束: x=Bob\n方法结束: y=Alice\nAfter:\
  \ a=Alice\nAfter: b=Bob\n\n如你所见，参数变量 `x` 和 `y` 被交换了，但变量 `a` 和 `b` 没有受到影响。\n\nListing\
  \ 4.4. ParamTest/ParamTest.java\n\n点击此处查看代码图像\n\n```java\n1  /**\n2    * 此程序演示了\
  \ Java 中的参数传递。\n3    * @version 1.00 2000-01-27\n4    * @author Cay Horstmann\n\
  5    */\n6  public class ParamTest\n7  {\n8      public static void main(String[]\
  \ args)\n9      {\n10         /*\n11           * 测试 1: 方法不能修改数值参数\n12          \
  \ */\n13         System.out.println(\"Testing tripleValue:\");\n14         double\
  \ percent = 10;\n15         System.out.println(\"Before: percent=\" + percent);\n\
  16         tripleValue(percent);\n17         System.out.println(\"After: percent=\"\
  \ + percent);\n18\n19         /*\n20           * 测试 2: 方法改变对象参数的状态\n21         \
  \  */\n22         System.out.println(\"\\n tripleSalary:\");\n23         Employee\
  \ harry = new Employee(\"Harry\", 5000);\n24         System.out.println(\"Before:\
  \ salary=\" + harry.getSalary());\n25         tripleSalary(harry);\n26         System.out.println(\"\
  After: salary=\" + harry.getSalary());\n27\n28         /*\n29           * 测试 3:\
  \ 方法不能将对象附加到对象参数\n30           */\n31         System.out.println(\"\\n swap:\");\n\
  32         Employee a = new Employee(\"Alice\", 70000);\n33         Employee b =\
  \ new Employee(\"Bob\", 60000);\n34         System.out.println(\"Before: a=\" +\
  \ a.getName());\n35         System.out.println(\"Before: b=\" + b.getName());\n\
  36         swap(a, b);\n37         System.out.println(\"After: a=\" + a.getName());\n\
  38         System.out.println(\"After: b=\" + b.getName());\n39     }\n40\n41  \
  \   public static void tripleValue(double x) // 不起作用\n42     {\n43         x = 3\
  \ * x;\n44         System.out.println(\"End of method: x=\" + x);\n45     }\n46\n\
  47     public static void tripleSalary(Employee x) // 起作用\n48     {\n49        \
  \ x.raiseSalary(200);\n50         System.out.println(\"End of method: salary=\"\
  \ + x.getSalary());\n51     }\n52\n53     public static void swap(Employee x, Employee\
  \ y)\n54     {\n55         Employee temp = x;\n56         x = y;\n57         y =\
  \ temp;\n58         System.out.println(\"End of method: x=\" + x.getName());\n59\
  \         System.out.println(\"End of method: y=\" + y.getName());\n60     }\n61\
  \ }\n62 class Employee // 化的 Employee 类\n63 {\n64     private String name;\n65 \
