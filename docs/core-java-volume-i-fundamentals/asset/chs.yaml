  \n正如我们已经讨论过的，队列（queue）允许你高效地在尾部添加元素并从头部移除元素。双端队列（`deque`）允许你在头部和尾部高效地添加或移除元素。不支持在中间添加元素。Java\
  \ SE 6 引入了 `Deque` 接口。它由 `ArrayDeque` 和 `LinkedList` 类实现，这两个类都提供了大小随需要增长的双端队列。在第\
  \ 14 章中，你将看到边界队列和双端队列。\n\n***\n\n### java.util.Queue<E> 5.0\n\n• `boolean add(E\
  \ element)`\n\n• `boolean offer(E element)`\n将给定元素添加到此双端队列的尾部，只要队列未满就返回 `true`。如果队列已，第一个方法将抛出\
  \ `IllegalStateException`，而第二个方法返回 `false`。\n\n• `E remove()`\n\n• `E poll()`\n\
  移除并返回此队列头部的元素，只要队列为空。如果队列为空，第一个方法将抛出 `NoSuchElementException`，而第二个方法返回 `null`。\n\
  \n• `E element()`\n\n• `E peek()`\n返回此队列头部的元素但不移除它，只要队列为空。如果队列为空，第一个方法将抛出 `NoSuchElementException`，而第二个方法返回\
  \ `null`。\n\n***\n\n***\n\n### java.util.Deque<E> 6\n\n• `void addFirst(E element)`\n\
