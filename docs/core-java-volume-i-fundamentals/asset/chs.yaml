  \ int DEFAULT_WIDTH = 400;\n    private static final int DEFAULT_HEIGHT = 400;\n\
  \n    public void paintComponent(Graphics g)\n    {\n        Graphics2D g2 = (Graphics2D)\
  \ g;\n        // 画一个矩形\n        double leftX = 100;\n        double topY = 100;\n\
