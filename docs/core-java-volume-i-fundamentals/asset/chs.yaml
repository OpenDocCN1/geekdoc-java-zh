  \ **1.0**\n\n- `notifyAll()` 唤醒调用了 `wait` 的所有线程。此方法只能在同步方法或块中调用。如果当前线程没有该对象的锁，将抛出\
  \ `IllegalMonitorStateException`。\n- `notify()` 随机唤醒一个调用了 `wait` 的线程。此方法只能在同步方法或块中调用。如果当前线程没有该对象的锁，将抛出\
  \ `IllegalMonitorStateException`。\n- `wait()` 使线程等待直到被通知。此方法只能在同步方法或块中调用。如果当前线程没有该对象的锁，将抛出\
  \ `IllegalMonitorStateException`。\n- `wait(long millis)`\n- `wait(long millis, int\
  \ nanos)` 使线程等待直到被通知或通过指定的时间。这些方法只能在同步方法中调用。如果当前线程没有该对象的锁，将抛出 `IllegalMonitorStateException`。\n\
  \n![Image](img/image1231.jpeg)\n\n***\n\n#### 14.5.6. 同步块\n\n正如我们刚刚讨论的，每个 Java 对象都有锁。线程可以通过调用同步方法来获取锁。获取锁的第二种机制：进入*同步块*。当线程进入如下形式的块点击此处查看代码图片\n\
  \n```java\nsynchronized (obj) // 这是同步块的语法\n{\n   临界区\n}\n```\n\n它就会获取 `obj` 的锁。\n\
  \n你有时会发现“临时”锁，例如：\n\n点击此处查看代码图片\n\n```java\npublic class Bank\n{\n   private double[]\
  \ accounts;\n   private Object lock = new Object();\n   . . .\n   public void transfer(int\
  \ from, int to, int amount)\n   {\n      synchronized (lock) // 一个临时锁\n      {\n\
  \         accounts[from] -= amount;\n         accounts[to] += amount;\n      }\n\
  \      System.out.println(. . .);\n   }\n}\n```\n\n在这里，创建 `lock` 对象仅是为了使用每个 Java\
  \ 对象所拥有的锁。\n\n\n\n\n\n有时候，程序员会使用对象的锁来实现额外的原子操作——这种做法被称为 `client-side locking`（客户端锁锁）。例如，考虑\
  \ `Vector` 类，它是一个所有方法都同步的列表。现在，假设我们将银行余额存储在 `Vector<Double>` 中。以下是 `transfer` 方法的一个朴素实现：\n\
  \n点击此处查看代码图像\n\n```java\npublic void transfer(Vector<Double> accounts, int from,\
  \ int to, int amount) // ERROR\n{\n    accounts.set(from, accounts.get(from) - amount);\n\
  \    accounts.set(to, accounts.get(to) + amount);\n    System.out.println(. . .);\n\
  }\n```\n\n`Vector` 类的 `get` 和 `set` 方法是同步的，但这对我们没有帮助。线程在 `transfer` 方法中完成第一次 `get`\
  \ 调用后，完全可能被抢占。此时，另一个线程可能会在同一个位置存储一个不同的值。然而，我们可以劫持这个锁：\n\n点击此处查看代码图像\n\n```java\n\
  public void transfer(Vector<Double> accounts, int from, int to, int amount)\n{\n\
  \    synchronized (accounts)\n    {\n        accounts.set(from, accounts.get(from)\
  \ - amount);\n        accounts.set(to, accounts.get(to) + amount);\n    }\n    System.out.println(.\
  \ . .);\n}\n```\n\n这种方法虽然有效，但它完全依赖于 `Vector` 类对其所有修改方法（mutator methods）都使用内在锁。然而，这真的是事实吗？`Vector`\
  \ 类的文档并没有这样的承诺。你必须仔细研究源码，并希望未来的版本不会引入不同步的修改方法。正如你看到的，客户端锁非常脆弱，通常不建议使用。\n\n### 14.5.7\
  \ 监器概念 (Monitor Concept)\n\n锁和条件是线程同步的强大工具，但它们并不面向对象。多年来，研究人员一直在寻找方法，使多线程安全，而不强制程序员考虑显式锁。最成功的解决方案之一是\
  \ Per Brinch Hansen 和 Tony Hoare 在 20 世纪 70 年代提出的 `monitor` 概念。在 Java 术语中，监器具有以下属性：\n\
  \n- 监器是一个只有一个私有字段的类。\n- 该类的每个对象都有关联的锁。\n- 所有方法都由该锁锁定。也就是说，如果客户端调用 `obj.method()`，那么\
  \ `obj` 的锁会在方法调用开始时自动获取，并在方法返回时释放。由于所有字段都是私有的，这种安排确保了当一个线程在操作字段时，另一个线程无法访问这些字段。\n\
  - 锁可以关联任意数量的条件（conditions）。\n\n早期版本的监器只有一个条件，且语法相当优雅。你可以直接调用 `await accounts[from]\
  \ >= amount`，而无需使用显式的条件变量。然而，研究表明，无加区分地反复测试条件是低效的。这个问题通过显式条件变量得到了解决，每个条件变量管理一组独立的线程。\n\
  \nJava 设计者粗略地借鉴了监器概念。Java 中的**每个对象**都有一个内在锁和一个内在条件。如果一个方法用 `synchronized` 关键字声明，它就表现得像监器方法。通过调用\
  \ `wait`/`notifyAll`/`notify` 来访问条件变量。\n\n然而，Java 对象与监器在三个重要的方面不同，这损害了线程安全：\n\n\
  - 字段并不要求是 `private` 的。\n- 方法并不要求是 `synchronized`。\n- 内在锁对客户端可见。\n\n这种对安全性的不尊重让 Per\
  \ Brinch Hansen 感到愤怒。在对 Java 多线程原语的严厉评论中，他写道：“令我惊讶的是，在监器和并发 Pascal 发明四分之一后，Java\
  \ 这种不安全的并行性竟然被编程界严肃对待。它毫无价值。”[Java’s Insecure Parallelism, *ACM SIGPLAN Notices*\
  \ 34:38–45, April 1999.]\n\n### 14.5.8 挥变字段 (Volatile Fields)\n\n有时，仅仅为了读取或写入一两个实例字段就付出同步的代价似乎太太大了。毕竟，能出什么错呢？遗憾的是，在现代处理器和编译器面前，充满了错误空间。\n\
  \n- 拥有多个处理器的计算机可以将内存值临时存储在寄存器或本地内存缓存中。因此，在不同处理器上的线程可能会看到同一个内存位置的不同值！\n- 编译器可以重新排序指令以获得最大吞吐量。编译器不会选择改变代码含义的排序，但它们假设只有当代码中存在显式指令时，内存值才会改变。然而，内存值可能会被另一个线程改变！\n\
  \n如果你使用锁来保护可以被多个线程访问的代码，就不会有这些问题。编译器被要求尊重锁，在必要时刷新本地缓存并不要不当地地重排指令。详细细节在 JSR 133 开发的\
  \ Java 内存模型和线程规范中说明（参见 [`www.jcp.org/en/jsr/detail?id=133`](http://www.jcp.org/en/jsr/detail?id=133)）。\n\
  \n\n\n\n只要你不执行除赋值以外的操作，就可以将共享变量声明为 `volatile`。\n\n`java.util.concurrent.atomic`\
  \ 包中有很多类，它们使用高效的机器级指令来保证其他操作的原子性，而无需使用锁。例如，`AtomicInteger` 类具有 `incrementAndGet()`\
  \ 和 `decrementAndGet()` 方法，可以原子地增加或减少一个整数。你可以安全地将 `AtomicInteger` 作为共享计数器，而无需同步。\n\
  \n还有 `AtomicBoolean`、`AtomicLong` 和 `AtomicReference`，以及布尔值、整数、长型值和引用的原子数组。这些类应该由编写并发工具的系统程序员来处理，而不是应用程序程序员。\n\
  \n### 14.5.11 死锁\n\n锁和条件（conditions）无法解决多线程中可能出现的所有问题。考虑以下情况：\n\n账户 1：$200\n账户 2：$300\n\
  线程 1：从账户 1 转账 $300 到账户 2\n线程 2：从账户 2 转账 $400 到账户 1\n\n如 `Figure 14.6` 所示，线程 1 和\
  \ 2 显然都被阻塞了。它们都无法继续，因为账户 1 和账户 2 的余额不足。\n\n可能所有线程都发生了阻塞，因为每个线程都在等待更多的钱。这种情况被称为死锁。在我们的程序中，死锁不会发生，原因很简单：每个转账金额最多为\
  \ $100。由于有 10 个账户，总金额为 $1000，任何时候至少有一个账户必须至少 $100。因此，从该账户取出资金的线程可以继续执行。\n\n但如果你修改线程的\
  \ `run()` 方法以移除 `max` 限制，死锁会很快发生。尝试一下。将 `NACCOUNTS` 设置为 `10`。为每个可运行对象构造一个带有 `INITIAL_BALANCE`\
  \ 值并运行程序。程序将运行一段时间，然后挂起。\n\n当程序挂起时，输入 `Ctrl+.`。你会得到一个列出所有线程的线程转储（thread dump）。每个线程都有堆栈跟踪，告诉它当前阻塞在哪里。或者，按照第\
  \ 11 节所述运行 `jconsole` 并查看 Threads 面板（见 `Figure 14.7`）。\n\n### 创建死锁的另一种方法是让第 `i`\
  \ 个线程负责将钱放入第 `i` 个账户，而不是从第 `i` 个账户中取出钱。在这种情况下，所有线程可能会聚集在一个账户上，每个线程都试图移除超过其金额的钱。尝试一下。在\
  \ `SynchTest` 程序中，进入 `TransferRunnable` 类的 `run()` 方法。在调用 `transfer()` 时，翻转 `fromAccount`\
  \ 和 `toAccount`。运行程序，看它是如何立即死锁的。\n\n这是另一个容易发生死锁的情况：在 `SynchTest` 程序中将 `signalAll()`\
  \ 方法改为 `signal()`。你会发现程序最终会挂起（再次，最好将 `NACCOUNTS` 设置为 `10` 以更快地观察效果）。与通知所有等待资金增加线程的\
  \ `signalAll()` 不同，`signal()` 方法只释放一个线程。如果该线程无法继续，所有线程都可能被阻塞。考虑以下正在形成死锁的示例场景：\n\n\
  账户 1：$1990\n所有其他账户：每个 $990\n线程 1：从账户 1 转账 $995 到账户 2\n所有其他线程：从它们的账户转账 $995 到另一个账户\n\
  \n显然，除了线程 1 外的所有线程都被阻塞了，因为它们的账户资金不足。线程 1 继续。之后，我们如下的情况：\n\n账户 1：$995\n账户 2：$1985\n\
  所有其他账户：每个 $990\n\n然后，线程 1 调用了 `signal()`。`signal()` 方法随机选择一个线程来解除阻塞。假设它选择了线程 3。该线程被唤醒，发现它的账户中钱不足，再次调用了\
  \ `await()`。但线程 1 仍在运行。产生了一个新的随机事务，例如：\n\n线程 1：从账户 1 转账 $997 到账户 2\n\n现在，线程 1 也调用了\
  \ `await`，所有线程都被阻塞了。系统已经死锁。这里的罪魁祸首是对 `signal()` 的调用。它只释放了一个线程，而且它可能没有选择对进展至关重要的线程（在我们的场景中，线程\
  \ 2 必须继续以从账户 2 取钱）。\n\n遗憾的是，Java 编程语言中没有任何避免或打破这些死锁的方法。你必须设计你的程序以确保死锁情况不会发生。\n\n\
  ### 14.5.12 线程局部变量\n\n在前面的节中，我们讨论了线程间共享变量的风险。有时，你可以通过 `ThreadLocal` 辅助类为每个线程提供自己的实例来避免共享。例如，`SimpleDateFormat`\
  \ 类不是线程安全的。假设我们有一个静态变量：\n\n```java\npublic static final SimpleDateFormat dateFormat\
  \ = new SimpleDateFormat(\"yyyy-MM-dd\");\n```\n\n如果两个线程执行类似下面的的操作：\n\n```java\n\
  String dateStamp = dateFormat.format(new Date());\n```\n\n那么结果可能是错误的，因为 `dateFormat`\
  \ 使用的内部数据结构可能会被并发访问所损坏。你可以使用同步，这是开销很大的；或者你可以在需要时构造一个本地 `SimpleDateFormat` 对象。要为每个线程构造一个实例，使用以下代码：\n\
  \n```java\npublic static final ThreadLocal<SimpleDateFormat> dateFormat = new ThreadLocal<SimpleDateFormat>()\
  \ {\n    protected SimpleDateFormat initialValue() {\n        return new SimpleDateFormat(\"\
  yyyy-MM-dd\");\n    }\n};\n```\n\n要访问实际格式器，调用 `dateFormat.get()`。在给定的线程中第一次调用 `get`\
  \ 时，会调用 `initialValue()`。从那时，`get()` 返回属于该线程的实例。\n\n类似的问题是多线程生成随机数。`java.util.Random`\
  \ 类是线程安全的，但如果多个线程需要共享生成器，它仍然效率低下。你可以使用 `ThreadLocal` 为每个线程提供单独的生成器，但 Java 7 为提供了一个便利类。只需调用如：\n\
  \n```java\nint random = ThreadLocalRandom.current().nextInt(upperBound);\n```\n\n\
  `ThreadLocalRandom.current()` 返回一个当前线程唯一的 `Random` 类实例。\n\n#### 14.5.13 锁测试与超时\n\
  \n当线程调用 `lock()` 方法获取由另一个线程拥有的锁时，会无限阻塞。你可以更谨慎地获取锁。`tryLock()` 方法尝试获取锁，如果成功则返回 `true`。否则，它会立即返回\
  \ `false`，线程可以去执行其他事情。\n\n```java\nif (myLock.tryLock()) {\n    // 现在线程拥有了锁\n  \
  \  try {\n        // ...\n    } finally {\n        myLock.unlock();\n    }\n} else\
  \ {\n    // 执行其他事情\n}\n```\n\n\n\n你可以带有超时参数调用 `tryLock`，如下：\n\n```java\nif (myLock.tryLock(100,\
  \ TimeUnit.MILLISECONDS)) . . .\n```\n\n`TimeUnit` 是一个枚举，其包含 `SECONDS`、`MILLISECONDS`、`MICROSECONDS`\
  \ 和 `NANOSECONDS` 等值。\n\n`lock` 方法不能被中断。如果线程在等待获取锁时被中断，该被中断的线程将继续阻塞，直到锁可用为止。如果发生了死锁，`lock`\
  \ 方法将永远无法终止。\n\n然而，如果你带有超时时间调用 `tryLock`，当线程在等待期间被中断时，会抛出 `InterruptedException`。这显然是一个非常有用的特性，因为它允许程序打破死锁。\n\
  \n你还可以调用 `lockInterruptibly` 方法。它的意义与无限超时的 `tryLock` 相同。\n\n当你等待条件（condition）时，也可以提供一个超时时间：\n\
  \n```java\nmyCondition.await(100, TimeUnit.MILLISECONDS))\n```\n\n如果另一个线程通过调用 `signalAll`\
  \ 或 `signal` 激活了该线程，或者超时时间到，或者线程被中断，`await` 方法就会返回。\n\n如果等待的线程被中断，`await` 方法会抛出\
  \ `InterruptedException`。在（可能不太可能的）你宁愿继续等待的情况下，请使用 `awaitUninterruptibly` 方法。\n\n\
  ***\n\n### java.util.concurrent.locks.Lock 5.0\n\n- `boolean tryLock()`\n尝试获取锁而不阻塞；如果成功则返回\
  \ `true`。即使该锁具有公平锁策略且其他线程在等待，只要锁是可用的，该方法也会获取该锁。\n\n- `boolean tryLock(long time,\
  \ TimeUnit unit)`\n尝试获取锁，阻塞时间不超过给定时间；如果成功则返回 `true`。\n\n- `void lockInterruptibly()`\n\
  获取锁，无限阻塞。如果线程被中断，则抛出 `InterruptedException`。\n\n***\n\n### java.util.concurrent.locks.Condition\
  \ 5.0\n\n- `boolean await(long time, TimeUnit unit)`\n进入该条件的等待集，阻塞直到该线程从等待集中被移除或过了给定时间。如果方法是因为时间到而返回的，则返回\
  \ `false`，否则返回 `true`。\n\n- `void awaitUninterruptibly()`\n进入该条件的等待集，阻塞直到该线程从等待集中被移除。如果线程被中断，此方法不会抛出\
  \ `InterruptedException`。\n\n***\n\n#### 14.5.14 读写锁\n\n`java.util.concurrent.locks`\
  \ 包定义了两个锁类：我们已经讨论过的 `ReentrantLock` 和 `ReentrantReadWriteLock`。当有很多线程从数据结构中读取数据而修改它的线程较少时，后者非常有用。在这种情况下，允许读者共享访问是有意义的。当然，写者仍然具有独占访问权限。\n\
  \n以下是使用读写锁所需的步骤：\n\n**1.** 构建一个 `ReentrantReadWriteLock` 对象：\n\n```java\nprivate\
  \ ReentrantReadWriteLock rwl = new ReentrantReadWriteLock();\n```\n\n**2.** 提取读锁和写锁：\n\
  \n```java\nprivate Lock readLock = rwl.readLock();\nprivate Lock writeLock = rwl.writeLock();\n\
  ```\n\n**3.** 在所有访问器中使用读锁：\n\n```java\npublic double getTotalBalance()\n{\n    readLock.lock();\n\
  \    try { . . . }\n    finally { readLock.unlock(); }\n}\n```\n\n**4.** 在所有变异器中使用写锁：\n\
  \n```java\npublic void transfer(. . .)\n{\n    writeLock.lock();\n    try { . .\
  \ . }\n    finally { writeLock.unlock(); }\n}\n```\n\n***\n\n### java.util.concurrent.locks.ReentrantReadWriteLock\
  \ 5.0\n\n- `Lock readLock()`\n获取一个可以被多个读者获取的读锁，排除所有的写者。\n\n- `Lock writeLock()`\n\
  获取一个写锁，它排除所有其他读者和写者。\n\n***\n\n#### 14.5.15 为什么 stop 和 suspend 方法被废弃了\n\nJava 的初始版本定义了一个\
  \ `stop` 方法，它简单地终止线程；以及一个 `suspend` 方法，它会阻塞线程直到另一个线程调用 `resume`。`stop` 和 `suspend`\
  \ 方法有一个共同点：：它们都试图在不经过该线程配合的情况下控制给定线程的行为。\n\n这两个方法都已被废弃。`stop` 方法从本质上是不安全的，并且经验表明\
  \ `suspend` 方法经常导致死锁。在本节中，你将看到为什么这些方法是有问题的，以及你可以采取什么措施来避免问题。\n\n让我们先来看看 `stop` 方法。该方法终止所有挂起的方法，包括\
  \ `run` 方法。当线程被停止时，它会立即放弃它已锁定的所有对象的锁。这可能导致对象处于不一致状态。例如，假设一个 `TransferRunnable` 在从一个账户移动资金到另一个账户的中途被停止，在取款之后、存款之前。现在银行对象被损坏了。由于锁已被释放，其他未停止的线程可以观察到这种损坏。\n\
  \n当一个线程想要停止另一个线程时，它无法知道 `stop` 方法 何时是安全的，何时会导致对象损坏。因此，该方法被废弃了。当你想要停止一个线程时，应该中断它。被中断的线程可以在安全时再停止。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n某些作者声称 `stop` 方法被废弃是因为它可能导致对象被永久锁定。然而，这种主张并不成立。被停止的线程会退出它调过的所有同步方法——技术上讲，是通过抛出\
  \ `ThreadDeath` 异常来实现的。因此，线程会释放内在锁。\n\n***\n\n接下来，让我们看看 `suspend` 方法有什么问题。与 `stop`\
  \ 不同，`suspend` 不会损坏对象。但是，如果你挂起了拥有锁的线程，那么在线程恢复之前锁是不可用的。如果调用 `suspend` 的线程尝试获取同一个锁，程序就会死锁：这种情况在图形用户界面中经常发生。假设我们有一个银行的图形模拟。一个标记为“暂停”的按钮挂起传输线程，标记为“恢复”的按钮恢复它们。\n\
  \n点击此处查看代码\n\n```java\npauseButton.addActionListener(new\n    ActionListener()\n\
  \    {\n        public void actionPerformed(ActionEvent event)\n        {\n    \
  \        for (int i = 0; i < threads.length; i++)\n                threads[i].suspend();\
  \ // 不要这样做\n        }\n    });\n```\n\n```java\nresumeButton.addActionListener(.\
  \ . .); // 对所有线程调用 resume\n```\n\n假设 `paintComponent` 方法绘制每个账户的图表，调用 `getBalances`\
  \ 方法获取余额数组。正如你将在 14.11 节看到的，“Threads and Swing](#part0020_split_001.xhtml_ch14lev1sec1),”第\
  \ [909] 页，按钮操作和重绘都发生在同一个线程中，即事件分发线程。考虑以下场景：\n\n**1.** 一个传输线程获取了银行对象的锁。\n**2.** 用户点击了“暂停”按钮。\n\
  **3.** 所有传输线程都被挂起；其中一个线程仍然持有银行对象的锁。\n**4.** 出于某些原因，账户图表需要重绘。\n**5.** `paintComponent`\
  \ 方法调用 `getBalances` 方法。\n**6.** 该方法尝试获取银行对象的锁。\n\n现在程序冻结了。\n\n事件分发线程无法继续执行，因为锁被一个被挂起的线程拥有。因此，用户无法点击“恢复”按钮，线程也永远不会恢复。\n\
  \n\n\n如果你想安全地挂起一个线程，可以引入变量 `suspendRequested` 并在你的 `run` 方法的安全位置对其进行测试——即在一个你的线程不会锁定其他线程所需的对象的地方。当你的线程发现\
  \ `suspendRequested` 变量被设置时，它应该一直等待，直到它再次可用。\n\n以下代码框架实现了该设计：\n\n点击此处查看代码图片\n\n\
  ```java\nprivate volatile boolean suspendRequested = false;\n\nprivate Lock suspendLock\
  \ = new ReentrantLock();\n\nprivate Condition suspendCondition = suspendLock.newCondition();\n\
  \npublic void run()\n{\n    while (. . .)\n    {\n        . . .\n        if (suspendRequested)\n\
  \        {\n            suspendLock.lock();\n            try { while (suspendRequested)\
  \ suspendCondition.await(); }\n            finally { suspendLock.unlock(); }\n \
  \       }\n    }\n}\n\npublic void requestSuspend() { suspendRequested = true; }\n\
  \npublic void requestResume()\n{\n    suspendRequested = false;\n    suspendLock.lock();\n\
  \    try { suspendCondition.signalAll(); }\n    finally { suspendLock.unlock();\
  \ }\n}\n```\n\n## 14.6. 阻塞队列\n\n你现在已经看到了构成 Java 并发编程基础的低级构建模块。然而，对于实际编程，你希望尽可能避免低级构造结构。使用由并发专家实现的高层结构要简单得多，也安全得多。\n\
  \n许多线程问题可以通过使用一个或多个队列来优雅且安全地表述。生产者线程将项插入队列，消费者线程从中检索它们。队列允许你安全地将数据从一个线程传递给另一个线程。例如，考虑我们的银行转账程序。与其直接访问银行对象，转账线程会将转账指令对象插入队列。另一个线程从队列中移除指令并执行转账。只有该线程可以访问银行对象的内部。不需要任何同步机制。（当然，线程安全队列类的实现者必须担心锁和条件，但那是他们的问题，不是你的。）\n\
  \n*阻塞队列*（blocking queue）当你尝试向当前满的队列添加元素，或从空的队列中移除元素时，会导致线程发生阻塞。阻塞队列是协调多个线程工作的有用工具。工作线程可以定期将中间结果存入阻塞队列。其他工作线程移除中间结果并对其进行进一步修改。队列会自动平衡工作负载。如果第一组线程运行得比第二组慢，第二组线程会在等待结果时阻塞。如果第一组线程运行得更快，队列将一直填满，直到第二组赶上。表\
  \ 14.1 显示了阻塞队列的方法。\n\n### 表 14.1. 阻塞队列方法\n\n![Image](img/image0123.jpeg)\n\n阻塞队列方法分为三类，区别在于它们在队列满或为空时执行的操作。如果你将队列作为线程管理工具，请使用\
  \ `put` 和 `take` 方法。`add`、`remove` 和 `element` 操作在尝试向满队列添加或获取空队列头部时会抛出异常。当然，在多线程程序中，队列可能在任何时候变满或变空，因此你可能倾向于使用\
  \ `offer`、`poll` 和 `peek` 方法。如果这些方法无法执行任务，它们只需返回一个失败指示，而不是抛出异常。\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n`poll` 和 `peek` 方法返回 `null` 以表示失败。因此，向这些队列中插入 `null` 值是非法的。\n\n还有带有超时的 `offer`\
  \ 和 `poll` 方法变体。例如，调用：\n\n```java\nboolean success = q.offer(x, 100, TimeUnit.MILLISECONDS);\n\
  ```\n\n尝试在 100 毫秒内向队列尾插入一个元素。如果成功，返回 `true`；否则在超时后返回 `false`。同样，调用：\n\n```java\n\
  Object head = q.poll(100, TimeUnit.MILLISECONDS)\n```\n\n尝试在 100 毫秒内移除队列头部。如果成功，返回头部；否则在超时后返回\
  \ `null`。\n\n`put` 方法在队列满时阻塞，`take` 方法在队列空时阻塞。这些是不带超时设置的 `offer` 和 `poll` 的等效方法。\n\
  \n`java.util.concurrent` 包提供了阻塞队列的若干种变体。默认情况下，`LinkedBlockingQueue` 的容量没有上限，但可以可选地指定最大容量。`LinkedBlockingDeque`\
  \ 是双端版本的。`ArrayBlockingQueue` 使用给定的容量和一个可选的强制参数构造。如果指定了公平性，等待最长的线程将获得优先处理。一如既往，公平性是一个巨大的代价，你应该只在问题明确要求时才使用它。\n\
  \n`PriorityBlockingQueue` 是优先级队列，而不是先进先出队列。元素按优先级顺序移除。队列具有无界容量，但如果队列为空，检索将阻塞。关于优先级队列的更多信息，请参见第\
  \ 13 章。\n\n`DelayQueue` 包含实现了 `Delayed` 接口的对象：\n\n```java\ninterface Delayed implements\
  \ Comparable<Delayed>\n{\n    long getDelay(TimeUnit unit);\n}\n```\n\n`getDelay`\
  \ 方法返回剩余延迟。负值表示延迟已过期。元素只有延迟后才能从 `DelayQueue` 中移除。你还需要实现 `compareTo` 方法。`DelayQueue`\
  \ 使用该方法对项进行排序。\n\nJava SE 7 增加了 `TransferQueue` 接口，允许生产者等待消费者准备好接收项。当生产者调用\n\n```java\n\
  q.transfer(item);\n```\n\n该调用将阻塞，直到另一个线程移除它。`LinkedTransferQueue` 类实现了此接口。\n\n\n\
  \n\n```java\nString keyword = in.nextLine();\n\nfinal int FILE_QUEUE_SIZE = 10;\n\
  \nfinal int SEARCH_THREADS = 100;\n\nBlockingQueue<File> queue = new ArrayBlockingQueue<>(FILE_QUEUE_SIZE);\n\
  \nFileEnumerationTask enumerator = new FileEnumerationTask(queue, new File(directory));\n\
  new Thread(enumerator).start();\nfor (int i = 1; i <= SEARCH_THREADS; i++)\n   \
  \ new Thread(new SearchTask(queue, keyword)).start();\n}\n}\n\n/**\n * 此任务列举目录及其子目录下的所有文件。\n\
  \ */\nclass FileEnumerationTask implements Runnable\n{\n    public static File DUMMY\
  \ = new File(\"\");\n    private BlockingQueue<File> queue;\n    private File startingDirectory;\n\
  \n    /**\n     * 构建一个 FileEnumerationTask。\n     * @param queue 用于存放枚举出的文件的阻塞队列\n\
  \     * @param startingDirectory 开始列举的目录\n     */\n    public FileEnumerationTask(BlockingQueue<File>\
  \ queue, File startingDirectory)\n    {\n        this.queue = queue;\n        this.startingDirectory\
  \ = startingDirectory;\n    }\n\n    public void run()\n    {\n        try\n   \
  \     {\n            enumerate(startingDirectory);\n            queue.put(DUMMY);\n\
  \        }\n        catch (InterruptedException e)\n        {\n        }\n    }\n\
  \n    /**\n     * 递归地列举给定目录及其子目录下的所有文件。\n     * @param directory 开始列举的目录\n     */\n\
  \    public void enumerate(File directory) throws InterruptedException\n    {\n\
  \        File[] files = directory.listFiles();\n        for (File file : files)\n\
  \        {\n            if (file.isDirectory()) enumerate(file);\n            else\
  \ queue.put(file);\n        }\n    }\n}\n\n/**\n * 此任务在文件中搜索给定的关键词。\n */\nclass\
  \ SearchTask implements Runnable\n{\n    private BlockingQueue<File> queue;\n  \
  \  private String keyword;\n\n    /**\n     * 构建一个 SearchTask。\n     * @param queue\
  \ 从从中获取元素的队列\n     * @param keyword 要查找的关键词\n     */\n    public SearchTask(BlockingQueue<File>\
  \ queue, String keyword)\n    {\n        this.queue = queue;\n        this.keyword\
  \ = keyword;\n    }\n\n    public void run()\n    {\n        try\n        {\n  \
  \          boolean done = false;\n            while (!done)\n            {\n   \
  \             File file = queue.take();\n                if (file == FileEnumerationTask.DUMMY)\n\
  \                {\n                    queue.put(file);\n                    done\
  \ = true;\n                }\n                else search(file);\n            }\n\
  \        }\n        catch (IOException e)\n        {\n            e.printStackTrace();\n\
  \        }\n        catch (InterruptedException e)\n        {\n        }\n    }\n\
  \n    /**\n     * 在文件中搜索给定的关键词并打印所有匹配的行。\n     * @param file 要搜索的文件\n     */\n \
  \   public void search(File file) throws IOException\n    {\n        try (Scanner\
  \ in = new Scanner(file))\n        {\n            int lineNumber = 0;\n        \
  \    while (in.hasNextLine())\n            {\n                lineNumber++;\n  \
  \              String line = in.nextLine();\n                if (line.contains(keyword))\n\
  \                    System.out.printf(\"%s:%d:%s%n\", file.getPath(), lineNumber,\
  \ line);\n            }\n        }\n    }\n}\n```\n\n\n\n\n这些集合使用了复杂的算法，通过允许对数据结构的不同部分并发访问，最大限度地减少竞争。\n\
  \n与大多数集合不同，这些类的 `size` 方法并不一定以常数时间操作。确定其中一个集合的当前大小通常需要遍历。\n\n这些集合返回*弱一致性*（weakly\
  \ consistent）的迭代器。这意味着迭代器可能反映也可能反映在它们构造之后发生的所有修改，但它们不会返回两次值，也不会抛出 `ConcurrentModificationException`。\n\
  \n***\n\n![Image](img/image00948.jpeg) 备注\n\n相比之下，`java.util` 包中集合的迭代器在迭代器构造后集合被修改时，会抛出\
  \ `ConcurrentModificationException`。\n\n***\n\n并发哈希映射可以高效地支持大量的读者和固定数量的写入者。默认情况下，假设最多有\
  \ 16 个*同时*（simultaneous）写入线程。可以有很多写入线程，但如果有超过 16 个线程同时写入，其他线程将被临时阻塞。你可以在构造函数中指定一个更高的数值，但可能不需要这样做。\n\
  \n`ConcurrentHashMap` 和 `ConcurrentSkipListMap` 类具有用于原子插入和删除关联的有用方法。`putIfAbsent`\
  \ 方法在之前没有关联的情况下，原子性地添加新关联。这对于被多个线程访问的缓存非常有用，可以确保只有一个线程向缓存中添加项。\n\n```\ncache.putIfAbsent(key,\
  \ value);\n```\n\n相反的操作是 `remove`（它也许应该命名为 `removeIfPresent`）。调用\n\n```\ncache.remove(key,\
  \ value)\n```\n\n如果键和值存在于映射中，则原子性地移除该键和值。最后，\n\n```\ncache.replace(key, oldValue,\
  \ newValue)\n```\n\n如果旧值与给键关联，则原子性地将旧值替换为新值。\n\n***\n\n### java.util.concurrent.ConcurrentLinkedQueue<E>\
  \ **5.0**\n\n- `ConcurrentLinkedQueue<E>()` 构造一个无界的、非阻塞队列，可以被多个线程安全地访问。\n\n***\n\
  \n***\n\n### java.util.concurrent.ConcurrentSkipListSet<E> **6**\n\n- `ConcurrentSkipListSet<E>()`\n\
  - `ConcurrentSkipListSet<E>(Comparator<? super E> comp)` 构造一个可以被多个线程安全访问的排序集合。第一个构造函数要求元素实现\
  \ `Comparable` 接口。\n\n***\n\n***\n\n### java.util.concurrent.ConcurrentHashMap<K,\
  \ V> **5.0**\n### java.util.concurrent.ConcurrentSkipListMap<K, V> **6**\n\n- `ConcurrentHashMap<K,\
  \ V>()`\n- `ConcurrentHashMap<K, V>(int initialCapacity)`\n- `ConcurrentHashMap<K,\
  \ V>(int initialCapacity, float loadFactor, int concurrencyLevel)` 构造一个可以被多个线程安全访问的哈希映射。\n\
  \n![Image](img/image01236.jpeg)\n\n- `ConcurrentSkipListMap<K, V>()`\n- `ConcurrentSkipListSet<K,\
  \ V>(Comparator<? super K> comp)` 构造一个可以被多个线程安全访问的排序映射。第一个构造函数要求键实现 `Comparable`\
  \ 接口。\n\n- `V putIfAbsent(K key, V value)` 如果键尚未存在于映射中，则将给值与给定键关联并返回 `null`。否则返回与键关联的现有值。\n\
  \n- `boolean remove(K key, V value)` 如果给定键当前与此值关联，则移除给定键和值并返回 `true`。否则返回 `false`。\n\
  \n- `boolean replace(K key, V oldValue, V newValue)` 如果给定键当前与 `oldValue` 关联，则将其与\
  \ `newValue` 关联。否则，返回 `false`。\n\n***\n\n#### 14.7.2 写复制数组 (Copy on Write Arrays)\n\
  \n`CopyOnWriteArrayList` 和 `CopyOnWriteArraySet` 是线程安全的集合，所有修改者都会复制底层数组。如果遍历集合的线程远多于修改它的线程，这种安排非常有用。当你构造一个迭代器时，它包含指向当前数组的引用。如果数组之后被修改，迭代器仍然持有旧数组，但集合的数组已被替换。结果是，旧迭代器具有一致的（但可能过时的）视图，无需任何同步开销即可访问。\n\
  \n#### 14.7.3 旧的线程安全集合\n\n自 Java 最初发布以来，`Vector` 和 `Hashtable` 类提供了动态数组和哈希表的线程安全实现。这些类现在被认为是过时的，已被\
  \ `ArrayList` 和 `HashMap` 类取代。这些类不是线程安全的。相反，集合库提供了不同的机制。任何集合类都可以通过*同步封装*（synchronization\
  \ wrapper）变为线程安全：\n\n点击此处查看代码图像\n\n```\nList<E> synchArrayList = Collections.synchronizedList(new\
  \ ArrayList<E>());\nMap<K, V> synchHashMap = Collections.synchronizedMap(new HashMap<K,\
  \ V>());\n```\n\n生成的集合的方法受锁保护，提供了线程安全的访问。\n\n你应该确保没有线程通过原始的未同步方法访问数据结构。确保此点的最简单方法是不保存原始对象的任何引用。只需构造一个集合并立即将其传递给封装器。生成的集合的方法受锁保护，提供了线程安全的访问。\n\
  \n*(注：由于原始文本中存在大量重复段落，译文已根据要求进行了去重并完成翻译。)*\n\n\n\n\n```java\npublic interface Future<V>\n\
  {\n    V get() throws . . .;\n    V get(long timeout, TimeUnit unit) throws . .\
  \ .;\n    void cancel(boolean mayInterrupt);\n    boolean isCancelled();\n    boolean\
  \ isDone();\n}\n```\n\n调用第一个 `get` 方法会阻塞，直到计算完成。如果调用在计算完成之前超时，则第二个方法将抛出 `TimeoutException`。如果运行计算的线程被中断，这两个方法都会抛出\
  \ `InterruptedException`。如果计算已经完成，`get` 将立即返回。\n\n`isDone` 方法在计算仍在进行时返回 `false`，在计算已完成时返回\
  \ `true`。\n\n你可以使用 `cancel` 方法取消计算。如果计算尚未启动，它将被取消且永远不会启动。如果计算正在进行中，则当 `mayInterrupt`\
  \ 参数为 `true` 时，它会被中断。\n\n`FutureTask` 包装器是一个方便的机制，可以将一个 `Callable` 同时转换为 `Future`\
  \ 和 `Runnable`——它实现了这两个接口。例如：\n\n```java\nCallable<Integer> myComputation = . .\
  \ .;\nFutureTask<Integer> task = new FutureTask<Integer>(myComputation);\nThread\
  \ t = new Thread(task); // it's a Runnable\nt.start();\n. . .\nInteger result =\
  \ task.get(); // it's a Future\n```\n\nListing 14.11 中的程序应用这些概念。该程序与之前查找包含特定关键词文件的示例相似。然而，现在我们只需计算匹配文件的数量。因此，我们有一个返回整数值的长时间运行任务——这是一个\
  \ `Callable<Integer>` 的示例。\n\n```java\nclass MatchCounter implements Callable<Integer>\n\
  {\n    public MatchCounter(File directory, String keyword) { . . . }\n    public\
  \ Integer call() { . . . } // 返回匹配文件的数量\n}\n```\n\n然后，我们从 `MatchCounter` 构建一个 `FutureTask`\
  \ 对象并使用它启动一个线程。\n\n```java\nFutureTask<Integer> task = new FutureTask<Integer>(counter);\n\
  Thread t = new Thread(task);\nt.start();\n```\n\n最后，我们打印结果。\n\n```java\nSystem.out.println(task.get()\
  \ + \" matching files.\");\n```\n\n当然，`get` 的调用会阻塞直到结果实际上可用。\n\n在 `call` 方法内部，我们递归地使用相同的机制。对于每个子目录，我们产生一个新的\
  \ `MatchCounter` 并为它启动一个线程。我们还将 `FutureTask` 对象存储在一个 `ArrayList<Future<Integer>>`\
  \ 中。在最后，我们将所有结果相加：\n\n```java\nfor (Future<Integer> result : results)\n    count\
  \ += result.get();\n```\n\n每次调用 `get` 都会阻塞直到结果可用。当然，线程是并行运行的，因此结果很有可能在同一时间全部可用。\n\
  \nListing 14.11. `future/FutureTest.java`\n\n```java\npackage future;\n\nimport\
  \ java.io.*;\nimport java.util.*;\nimport java.util.concurrent.*;\n\n/**\n * @version\
  \ 1.01 2012-01-26\n * @author Cay Horstmann\n */\npublic class FutureTest\n{\n \
  \   public static void main(String[] args)\n    {\n        Scanner in = new Scanner(System.in);\n\
  \        System.out.print(\"Enter base directory (e.g. /usr/local/jdk5.0/src): \"\
  );\n        String directory = in.nextLine();\n        System.out.print(\"Enter\
  \ keyword (e.g. volatile): \");\n        String keyword = in.nextLine();\n\n   \
  \     MatchCounter counter = new MatchCounter(new File(directory), keyword);\n \
  \       FutureTask<Integer> task = new FutureTask<>(counter);\n        Thread t\
  \ = new Thread(task);\n        t.start();\n        try {\n            System.out.println(task.get()\
  \ + \" matching files.\");\n        } catch (ExecutionException e) {\n         \
  \   e.printStackTrace();\n        } catch (InterruptedException e) {\n        }\n\
  \    }\n\n    /**\n     * 统计一个目录及其子目录中包含给定关键词的文件。\n     */\n    class MatchCounter\
  \ implements Callable<Integer>\n    {\n        private File directory;\n       \
  \ private String keyword;\n        private int count;\n\n        /**\n         *\
  \ 构建一个 MatchCounter。\n         * @param directory 开始搜索的目录\n         * @param keyword\
  \ 要查找的关键词\n         */\n        public MatchCounter(File directory, String keyword)\n\
  \        {\n            this.directory = directory;\n            this.keyword =\
  \ keyword;\n        }\n\n        public Integer call()\n        {\n            count\
  \ = 0;\n            try {\n                File[] files = directory.listFiles();\n\
  \                List<Future<Integer>> results = new ArrayList<>();\n\n        \
  \        for (File file : files)\n                    if (file.isDirectory()) {\n\
  \                        MatchCounter counter = new MatchCounter(file, keyword);\n\
  \                        FutureTask<Integer> task = new FutureTask<>(counter);\n\
  \                        results.add(task);\n                        Thread t =\
  \ new Thread(task);\n                        t.start();\n                    }\n\
  \                    else {\n                        if (search(file)) count++;\n\
  \                    }\n\n                for (Future<Integer> result : results)\
  \ {\n                    try {\n                        count += result.get();\n\
  \                    } catch (ExecutionException e) {\n                        e.printStackTrace();\n\
  \                    }\n                }\n            } catch (InterruptedException\
  \ e) {\n            }\n            return count;\n        }\n\n        /**\n   \
  \      * 在文件中搜索给定关键词。\n         * @param file 要搜索的文件\n         * @return 如果文件包含关键词则返回\
  \ true\n         */\n        public boolean search(File file)\n        {\n     \
  \       try {\n                try (Scanner in = new Scanner(file)) {\n        \
  \            boolean found = false;\n                    while (!found && in.hasNextLine())\
  \ {\n                        String line = in.nextLine();\n                    \
