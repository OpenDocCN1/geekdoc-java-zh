  \n\n\n### 2. 构造类的对象：\n\n```java\nRunnable r = new MyRunnable();\n```\n\n### 3. 从\
  \ `Runnable` 构造一个 `Thread` 对象：\n\n```java\nThread t = new Thread(r);\n```\n\n###\
  \ 4. 启动线程：\n\n```java\nt.start();\n```\n\n为了让我们的跳球程序在独立的线程中运行，我们只需要实现类 `BallRunnable`并将动画代码放在\
  \ `run` 方法中：\n\n点击此处查看代码图片\n\n```java\nclass BallRunnable implements Runnable\n\
  {\n    . . .\n    public void run()\n    {\n        try\n        {\n           \
  \ for (int i = 1; i <= STEPS; i++)\n            {\n                ball.move(component.getBounds());\n\
  \                component.repaint();\n                Thread.sleep(DELAY);\n  \
  \          }\n        }\n        catch (InterruptedException exception)\n      \
  \  {\n        }\n    }\n    . . .\n}\n```\n\n同样，我们需要捕获 `sleep` 方法可能抛出的 `InterruptedException`。我们将在下一节中讨论此异常。通常，中断被用于请求终止线程。因此，当发生\
  \ `InterruptedException` 时，我们的 `run` 方法就会退出。\n\n每当点击 Start 按钮时，`addBall` 方法都会启动一个新的线程（参见图\
  \ 14.2）：\n\n```java\nBall b = new Ball();\npanel.add(b);\nRunnable r = new BallRunnable(b,\
  \ panel);\nThread t = new Thread(r);\nt.start();\n```\n\n![Image](img/image01226.jpeg)\n\
  图 14.2 运行多个线程\n\n就是这些！你现在知道如何并行运行任务了。本章的剩余部分将介绍如何控制线程之间的交互。\n\n完整代码在 Listing 14.4\
  \ 所示。\n\n***\n\n![Image](img/image00948.jpeg) Note\n\n你也可以通过创建 `Thread` 类的子类来定义线程，如下：\n\
  \n```java\nclass MyThread extends Thread\n{\n    public void run()\n    {\n    \
  \    task code\n    }\n}\n```\n\n然后你构造该子类的对象并调用它的 `start` 方法。然而，不再建议使用这种方法。你应该将要并行运行的*任务*与运行任务的*机制*解耦。如果你有很多任务，为每个任务创建一个单独的线程开销太大了。相反，你可以使用线程池——参见第\
  \ 14.9 节，“Executors`”，位于第 895 页。\n\n***\n\n***\n\n![Image](img/image00950.jpeg)\
  \ Caution\n\n*不要*调用 `Thread` 类或 `Runnable` 对象的 `run` 方法。直接调用 `run` 方法仅仅是在*相同*的线程中执行任务——不会启动新线程。相反，请调用\
  \ `Thread.start` 方法。它将创建一个执行 `run` 方法的新线程。\n\n***\n\nListing 14.4. bounceThread/BounceThread.java\n\
  \n点击此处查看代码图片\n\n***\n\n```java\n1  package bounceThread;\n2\n3  import java.awt.*;\n\
  4  import java.awt.event.*;\n5  import javax.swing.*;\n6\n7  /**\n8    * 显示跳动的球。\n\
  9    * @version 1.33 2007-05-17\n10   * @author Horstmann\n11  */\n12  public class\
  \ BounceThread\n13  {\n14    public static void main(String[] args)\n15      EventQueue.invokeLater(new\
  \ Runnable()\n16      {\n17        public void run()\n18      {\n19          JFrame\
  \ frame = new BounceFrame();\n20          frame.setTitle(\"BounceThread\");\n21\
  \          frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n22          frame.setVisible(true);\n\
  23        }\n24      });\n25    }\n26  }\n27\n28  /**\n29    * 使球跳动的 runnable。\n\
  30    */\n31  class BallRunnable implements Runnable\n32  {\n33    private Ball\
  \ ball;\n34    private Component component;\n35    public static final int STEPS\
  \ = 1000;\n36    public static final int DELAY = 5;\n37\n38    /**\n39      * 构造\
  \ runnable。\n40      * @param aBall 要跳动的球\n41      * @param aComponent 跳动的组件\n42\
  \      */\n43    public BallRunnable(Ball aBall, Component aComponent)\n44     \
  \ {\n45      ball = aBall;\n46      component = aComponent;\n47      }\n48    public\
  \ void run()\n49      {\n50        try\n51          for (int i = 1; i <= STEPS;\
  \ i++) // 注意：原文此处处逻辑有误（缺少++），但保留原文\n52          {\n53            ball.move(component.getBounds());\n\
  54            component.repaint();\n55            Thread.sleep(DELAY);\n56     \
  \     }\n57        }\n58        catch (InterruptedException e)\n59        {\n60\
  \      }\n61  }\n62\n63  /**\n64    * 带有面板和按钮的框架。\n65    */\n66  class BounceFrame\
  \ extends JFrame\n67  {\n68    private BallComponent comp;\n69\n70    /**\n71  \
  \    * 构造带有 Start 和 Close\n72      * 按钮的框架\n73      */\n74    public BounceFrame()\n\
  75      {\n76      comp = new BallComponent();\n77      add(comp, BorderLayout.CENTER);\n\
  78      JPanel buttonPanel = new JPanel();\n79      addButton(buttonPanel, \"Start\"\
  , new ActionListener()\n80      {\n81        public void actionPerformed(ActionEvent\
  \ event)\n82        {\n83          addBall();\n84        }\n85      });\n86    \
  \  addButton(buttonPanel, \"Close\", new ActionListener()\n87      {\n88       \
  \ public void actionPerformed(ActionEvent event)\n89        {\n90          System.exit(0);\n\
  91        }\n92      });\n93      add(buttonPanel, BorderLayout.SOUTH);\n94    \
  \  pack();\n95      }\n96\n99    /**\n100     * 向容器中添加按钮。\n101     * @param c 容器\n\
  102     * @param title 按钮标题\n103     * @param listener 按钮的动作监听器\n104     */\n105\
  \    public void addButton(Container c, String title, ActionListener listener)\n\
  106      {\n107      JButton button = new JButton(title);\n108      c.add(button);\n\
  109      button.addActionListener(listener);\n110      }\n111\n112     /**\n113\
  \      * 在画布上添加一个跳球并启动线程让它跳动\n114     */\n115     public void addBall()\n116   \
  \    {\n117        Ball b = new Ball();\n118        comp.add(b);\n119        Runnable\
  \ r = new BallRunnable(b, comp);\n120        Thread t = new Thread(r);\n121    \
  \    t.start();\n122      }\n123 }\n```\n\n***\n\n***\n\n`java.lang.Thread`\n- `Thread(Runnable\
  \ target)` 构造一个新的线程，该线程调用指定目标的 `run()` 方法。\n- `void start()` 启动此线程，导致 `run()` 方法被调用。此方法会立即返回。新线程并发运行。\n\
  - `void run()` 调用关联的 `Runnable` 的 `run` 方法。\n\n***\n\n***\n\n`java.lang.Runnable`\n\
  - `void run()` 必须被重写并为你想要执行的任务提供指令。\n\n***\n\n### 14.2. 中断线程\n\n线程在它的 `run` 方法返回时终止——通过执行\
  \ `return` 语句、在执行完方法体中的最后一个语句后，或者当发生了方法内未捕获的异常时。在 Java 的初始版本中，还有一个 `stop` 方法，另一个线程可以它来终止线程。然而，该方法现在已过用。我们将在第\
  \ 14.5.15 节讨论原因，“为什么 `stop` 和 `suspend` 方法已过用](part0020_split_001.xhtml_ch14lev2sec23)”，位于第\
  \ 875 页。\n\n有一种方法可以*强制*终止线程。然而，`interrupt` 方法可以用于请求终止线程。\n\n当对线程调用 `interrupt` 方法时，该线程的*中断状态*会被设置。这是一个存在于每个线程中的布尔标志。每个线程都应该经常检查自己是否被中断。\n\
  \n\n\n\n\n要确定是否设置了中断状态，首先调用静态方法 `Thread.currentThread` 获取当前线程，然后调用 `isInterrupted`\
  \ 方法：\n\n点击此处查看代码图片\n\n```\nwhile (!Thread.currentThread().isInterrupted() && more\
  \ work to do)\n{\n    do more work\n}\n```\n\n然而，如果一个线程处于阻塞状态，它就无法检查中断状态。这就是 `InterruptedException`\
  \ 派上用场的地方。当在一个正处于如 `sleep` 或 `wait` 等调用上阻塞的线程上调用 `interrupt` 方法时，该阻塞调用将通过一个 `InterruptedException`\
  \ 终止。（某些阻塞的 I/O 调用是无法被中断的；您应该考虑可中断的替代方案。详情请参阅第二卷的第 1 章和第 3 章。）\n\n语言本身并没有规定被中断的线程必须终止。中断线程仅仅是引起它的注意。被中断的线程可以决定如何对中断做出反应。某些线程非常重要，它们应该处理异常并继续执行。但通常情况下，线程会简单地将中断解释为终止请求。此类线程的\
  \ `run` 方法形式如下：\n\n点击此处查看代码图片\n\n```\npublic void run()\n{\n    try\n    {\n   \
  \     . . .\n        while (!Thread.currentThread().isInterrupted() && more work\
  \ to do)\n        {\n            do more work\n        }\n    }\n    catch(InterruptedException\
  \ e)\n    {\n        // 线程在 sleep 或 wait 期间被中断\n    }\n    finally\n    {\n    \
  \    // 如果需要进行清理\n    }\n    // 退出 run 方法将终止线程\n}\n```\n\n如果您在每次工作迭代后都调用 `sleep`\
  \ 方法（或其他可中断的方法），那么 `isInterrupted` 检查既不是必要的也没有用的。如果您在中断状态被设置时调用 `sleep` 方法，它将不会睡眠。相反，它会清除状态\
  \ (!) 并抛出一个 `InterruptedException`。因此，如果您的循环调用了 `sleep`，请不要检查中断状态。相反，请这样捕获 `InterruptedException`：\n\
  \n点击此处查看代码图片\n\n```java\npublic void run()\n{\n    try\n    {\n        . . .\n \
  \       while (more work to do)\n        {\n            do more work\n         \
  \   Thread.sleep(delay);\n        }\n    }\n    catch(InterruptedException e)\n\
  \    {\n        // 线程在 sleep 期间被中断\n    }\n    finally\n    {\n        // 如果需要进行清理\n\
  \    }\n    // 退出 run 方法将终止线程\n}\n```\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\
  \n有两个非常相似的方法：`interrupted` 和 `isInterrupted`。`interrupted` 方法是一个静态方法，用于检查*当前*线程是否被中断。此外，调用\
  \ `interrupted` 方法会*清除*线程的中断状态。另一方面，`isInterrupted` 方法是一个实例方法，可以用它来检查任何线程是否被中断。调用它不会改变中断状态。\n\
  \n***\n\n您会在许多发布代码中看到 `InterruptedException` 在低层被静默处理，如下所示：\n\n点击此处查看代码图片\n\n```\n\
  void mySubTask()\n{\n    . . .\n    try { sleep(delay); }\n    catch (InterruptedException\
  \ e) {} // 不要忽略！\n    . . .\n}\n```\n\n不要这样做！如果您无法在 `catch` 子句中想出任何好的处理方法，您仍然有两个合理的选择：\n\
  \n- 在 `catch` 子句中，调用 `Thread.currentThread().interrupt()` 来设置中断状态。然后调用者就可以测试它。\n\
  \n点击此处查看代码图片\n\n```\nvoid mySubTask()\n{\n    . . .\n    try { sleep(delay); }\n\
  \    catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n  \
  \  . . .\n}\n```\n\n- 或者，更好的方法是使用 `throws InterruptedException` 标记您的方法并丢弃 `try`\
  \ 块。这样调用者（或最终的 `run` 方法）就可以捕获它。\n\n```java\nvoid mySubTask() throws InterruptedException\n\
  {\n    . . .\n    sleep(delay);\n    . . .\n}\n```\n\n***\n\njava.lang.Thread **1.0**\n\
  \n- `void interrupt()`:\n向线程发送中断请求。线程的中断状态被设置为 `true`。如果线程当前正被 `sleep` 调用所阻塞，则会抛出\
  \ `InterruptedException`。\n\n- `static boolean interrupted()`:\n测试*当前*线程（即正在执行此指令的线程）是否被中断。注意，这是一个静态方法。该调用具有副作用——它会将当前线程的中断状态重置为\
  \ `false`。\n\n- `boolean isInterrupted()`:\n测试一个线程是否被中断。调用它不会改变中断状态。\n\n- `static\
  \ Thread currentThread()`:\n返回表示当前执行线程的 `Thread` 对象。\n\n***\n\n### 14.3 线程状态\n\n\
  线程可以处于六种状态之一：\n\n- 新 (New)\n- 可运行 (Runnable)\n- 阻塞 (Blocked)\n- 等待 (Waiting)\n-\
  \ 定时等待 (Timed waiting)\n- 终止 (Terminated)\n\n这些状态将在后面的节中解释。\n\n要确定线程的当前状态，只需调用 `getState`\
  \ 方法。\n\n#### 14.3.1 新线程\n\n当您使用 `new` 操作符创建一个线程时（例如 `new Thread(r)`），该线程尚未运行。这意味着它处于*新*状态。当线程处于新状态时，程序尚未开始执行。在线程运行之前需要进行一些工作。\n\
  \n#### 14.3.2 可运行线程\n\n一旦您调用 `start` 方法，线程就处于*可运行*状态。可运行线程可能并未实际运行。这取决于操作系统给予它时间。（尽管\
  \ Java 规范并没有将其作为一个独立的状态。）\n\n一旦线程运行，它并不一定一直运行。事实上，让运行线程偶尔暂停以便其他线程有机会运行是必要的。调度取决于操作系统提供的服务。抢占式系统为每个可运行线程分配时间片。当该时间片用尽时，操作系统会抢占该线程，并给另一个线程提供机会（见图\
  \ 14.4](#part0020_split_000.xhtml_ch14fig04），第 850 页）。在选择下一个线程时，操作系统会考虑线程*优先级*——参见第\
  \ 14.4.1 节](#part0020_split_000.xhtml_ch14levsec6)“线程优先级”，第 840 页获取更多信息。\n\n所有现代桌面和服务器操作系统都使用抢占式调度。然而，手机等小型设备可能使用协作式调度。在这样的设备上，线程只有在调用\
  \ `yield` 方法或被阻塞、等待时才会失去控制。\n\n始终记住，可运行线程在任何时刻可能运行也可能不运行。（这就是为什么该状态被称为“可运行”而不是“正在运行”。）\n\
  \n#### 14.3.3 阻塞和等待线程\n\n当线程处于阻塞或等待状态时，它是暂时不活跃的。它不执行任何代码并消耗极少的资源。激活它取决于线程调度器。\n\n\
  \n\n\n\n-   当线程尝试获取当前被另一个线程持有的（但不是 `java.util.concurrent` 库中的 `Lock`）内部对象锁时，它将变为\
  \ `blocked`（阻塞）。我们在第 14.5.3 节中讨论了 `java.util.concurrent` 锁、第 850 页的“Lock 对象”，以及在第\
  \ 14.5.5 节中讨论了内部对象锁、第 859 页的“`synchronized` 关键字”。当所有其他线程都释放了锁并且线程调度器允许该线程持有锁时，该线程将变为未阻塞。\n\
  \n-   当线程等待另一个线程通知调度器某个条件时，它进入 `waiting`（等待）状态。我们在第 14.5.4 节中讨论了条件、第 854 页的“Condition\
  \ 对象”。这是通过调用 `Object.wait` 或 `Thread.join` 方法，或者通过等待 `java.util.concurrent` 库中的\
  \ `Lock` 或 `Condition` 来实现。。在实践中，阻塞状态和等待状态之间的区别并不显著。\n\n-   有几个方法带有超时参数。调用这些方法会导致线程进入\
  \ `timed waiting`（超时等待）状态。该状态一直持续，直到超时过期或收到适当的通知。带有超时的方法包括 `Thread.sleep` 以及 `Object.wait`、`Thread.join`、`Lock.tryLock`\
  \ 和 `Condition.await` 的超时版本。\n\n[图 14.3 显示了线程可能处于的状态以及从一个状态到另一个状态的可能转换。当线程被阻塞或等待时（当然，也当它终止时），另一个线程将被调度运行。当线程被重新激活（例如，因为其超时过期或成功获取了锁），调度器会检查它的优先级是否高于当前运行的线程。如果是，它将抢占当前线程之一，并选择一个新线程进行运行。\n\
  \n![Image](img/image01227.jpeg)\n\n图 14.3. 线程状态\n\n### 14.3.4. 终止线程 (Terminated\
  \ Threads)\n\n线程终止的原因有两个：\n\n-   由于 `run` 方法正常退出，它导致了自然死亡。\n-   由于一个未捕获的异常终止了 `run`\
  \ 方法，导致了意外死亡。\n\n特别是，你可以通过调用它的 `stop` 方法来杀死线程。该方法会抛出一个 `ThreadDeath` 错误对象并杀死线程。然而，`stop`\
  \ 方法已被废用，你不应该在自己的代码中调用它。\n\n```\njava.lang.Thread 1.0\n\n• `void join()`\n等待指定的线程终止。\n\
  \n• `void join(long millis)`\n等待指定的线程死亡或等待指定的毫秒数通过。\n\n• `Thread.State getState()`\n\
  获取此线程的状态；`NEW`、`RUNNABLE`、`BLOCKED`、`WAITING`、`TIMED_WAITING` 或 `TERMINATED` 之一。\n\
  \n• `void stop()`\n停止线程。此方法已被废用。\n\n• `void suspend()`\n挂起此线程的执行。此方法已被废用。\n\n• `void\
  \ resume()`\n恢复此线程。此方法仅在调用 `suspend()` 之后才有效。此方法已被废用。\n```\n\n### 14.4. 线程属性 (Thread\
  \ Properties)\n\n在接下来的章节中，我们将讨论线程的各种杂属性：线程优先级、守护线程、线程组以及用于未捕获异常的处理器。\n\n#### 14.4.1.\
  \ 线程优先级 (Thread Priorities)\n\n在 Java 编程语言中，每个线程都有一个 `priority`（优先级）。默认情况下，线程会继承构造它的线程的优先级。你可以使用\
  \ `setPriority` 方法增加或降低任何线程的优先级。你可以将优先级设置为 `MIN_PRIORITY`（在 `Thread` 类中定义为 `1`）和\
  \ `MAX_PRIORITY`（定义为 `10`）之间的任何值。`NORM_PRIORITY` 定义为 `5`。\n\n每当线程调度器有机会选择新线程时，它都倾向于选择优先级更高的线程。然而，线程优先级是**高度依赖系统的**的。当虚拟机依赖宿主平台的线程实现时，Java\
  \ 线程优先级会被映射到宿主平台的优先级级别，而该平台可能有更多或更少的线程优先级级别。\n\n例如，Windows 有七个优先级级别。某些 Java 优先级将映射到相同的操作系统级别。在\
  \ Linux 的 Oracle JVM 中，线程优先级被完全忽略了——所有线程都具有相同的优先级。\n\n初学者有时会过度使用线程优先级。调整优先级的理由其实很少。。\n\
  \n![Image](img/image0950.jpeg) 警告\n\n如果你使用优先级，请注意一个常见的学者错误：不要让程序的正确运行依赖于优先级。\n\n\
  ```\njava.lang.Thread 1.0\n\n• `void setPriority(int newPriority)`\n设置此线程的优先级。优先级必须在\
  \ `MIN_PRIORITY` 和 `MAX_PRIORITY` 之间。\n\n• `static int MIN_PRIORITY`\nThread 可以具有的最小优先级。最小优先级为\
  \ `1`。\n\n• `static int NORM_PRIORITY`\nThread 的默认优先级。优先级为 `5`。\n\n• `static int\
  \ MAX_PRIORITY`\nThread 可以具有的最大优先级。最大优先级为 `10`。\n\n• `static void yield()`\n让当前执行的线程让出。如果有优先级高于此线程的可运行线程，它们将被调度。注意这是一个静态方法。\n\
  ```\n\n#### 14.4.2. 守护线程 (Daemon Threads)\n\n你可以通过调用 `t.setDaemon(true);` 将线程转换为**守护线程**。\n\
  \n这种线程并没有魔性。守护线程除了服务其他线程外没有其他角色。例如向其他线程发送定期“滴答”的线程或清理缓存条目的线程。当只剩下守护线程时，虚拟机将退出。如果剩余线程都是守护线程，程序就没有必要继续运行了。\n\
  \n守护线程有时会被不想考虑关闭操作的初学者误用。然而，这可能是危险的。守护线程不应访问持久化资源（如文件或数据库），因为它可能在任何时间终止，即使在操作中间。\n\
  \n```\njava.lang.Thread 1.0\n\n• `void setDaemon(boolean isDaemon)`\n标记此线程为守护线程或用户线程。此方法必须在线程启动之前调用。\n\
  ```\n\n#### 14.4.3. 未捕获异常的处理器 (Handlers for Uncaught Exceptions)\n\n线程的 `run` 方法不能抛任何检查异常，但它可以被未运行时异常终止。在这种情况下，线程会死亡。\n\
  \n然而，没有 `catch` 子句可以让异常进行传播。相反，在线程死亡之前，异常将传递给一个未捕获异常的处理器。\n\n处理器必须属于一个实现了 `Thread.UncaughtExceptionHandler`\
  \ 接口的类。该接口有一个方法，\n\n```\nvoid uncaughtException(Thread t, Throwable e)\n```\n\n\
  你可以使用 `setUncaughtExceptionHandler` 方法为任何线程安装处理器。你还可以通过 `Thread` 类的静态方法 `setDefaultUncaughtExceptionHandler`\
  \ 为所有线程安装默认处理器。替换处理器可能会使用日志 API 将未捕获异常的报告发送到日志文件中。\n\n\n\n\n\n如果你没有安装默认处理器，则默认处理器为\
  \ `null`。然而，如果你没有为单个线程安装处理器，则该处理器将是该线程的 `ThreadGroup` 对象。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注释\n\n线程组是一个可以被共同管理的线程集合。默认情况下，你创建的所有线程都属于同一个线程组，但也可以建立其他的分组。由于现在有了更好的特性来操作线程集合，我们建议你不要在程序中使用线程组。\n\
  \n***\n\n`ThreadGroup` 类实现了 `Thread.UncaughtExceptionHandler` 接口。它的 `uncaughtException`\
  \ 方法会执行以下操作：\n\n1.  如果该线程组有父线程组，则调用父级线程组的 `uncaughtException` 方法。\n2.  否则，如果 `Thread.getDefaultUncaughtExceptionHandler`\
  \ 方法返回一个非-`null` 处理器，则调用它。\n3.  否则，如果该 `Throwable` 是 `DeathDeath` 的实例，则什么都不会发生。\n\
  4.  否则，线程的名称和 `Throwable` 的堆栈跟踪将打印在 `System.err` 上。\n\n这就是你在程序中无疑见过很多次的堆栈跟踪。\n\n\
  ***\n\n`java.lang.Thread` **1.0**\n\n- `static void setDefaultUncaughtExceptionHandler(Thread.UncaughtExceptionHandler\
  \ handler)` **5.0**\n- `static Thread.UncaughtExceptionHandler getDefaultUncaughtExceptionHandler()`\
  \ **5.0** 设置或获取未捕获异常的默认处理器。\n- `void setUncaughtExceptionHandler(Thread.UncaughtExceptionHandler\
  \ handler)` **5.0**\n- `Thread.UncaughtExceptionHandler getUncaughtExceptionHandler()`\
  \ **5.0** 设置或获取未捕获异常的处理器。如果没有安装处理器，则线程组对象即为处理器。\n\n***\n\n`java.lang.Thread.UncaughtExceptionHandler`\
  \ **5.0**\n\n- `void uncaughtException(Thread t, Throwable e)` 定义为在线程因未捕获异常终止时记录自定义报告。\n\
  \n![Image](img/image01228.jpeg)\n\n***\n\n`java.lang.ThreadGroup` **1.0**\n\n- `void\
  \ uncaughtException(Thread t, Throwable e)` 如果存在父线程组，则调用父线程组的此方法；如果存在默认处理器，则调用 `Thread`\
  \ 类的默认处理器；否则将堆栈跟踪打印到标准错误流。（然而，如果 `e` 是 `ThreadDeath` 对象，则会抑制堆栈跟踪。`ThreadDeath` 对象是由已弃的\
  \ `stop` 方法生成的。）\n\n### 14.5. 同步\n\n在大多数实际的多线程应用程序中，两个或多个线程需要共享访问数据。如果两个线程访问同一个对象，并且每个都调用修改对象状态的方法，会发生什么？正如你想象的，线程可能会互相干扰。取决于数据访问的顺序，可能会导致对象损坏。这种情况通常被称为*竞态条件*。\n\
  \n#### 14.5.1. 竞态条件的示例\n\n为了避免多个线程对共享数据造成损坏，你必须学习如何*同步访问*。在本节中，你将看到如果不使用同步会发生什么。在下一节中，你将看到如何对数据访问进行同步。\n\
  \n在接下来的测试程序中，我们模拟了一个拥有多个账户的银行。我们随机生成在这些账户之间移动资金的交易。每个账户有一个线程。每笔交易从该线程服务的账户移动随机金额的资金到另一个随机账户。\n\
  \n模拟代码非常直观。我们有一个带有 `transfer` 方法的 `Bank` 类。该方法从一个账户转移某些资金到另一个账户。（我们尚不担心账户余额为负的情况）。这里是\
  \ `Bank` 类 `transfer` 方法的代码。\n\n点击此处查看代码图像\n\n```java\npublic void transfer(int\
  \ from, int to, double amount)\n\n   // 注意：从多个线程中调用时是不安全的\n{\n   System.out.print(Thread.currentThread());\n\
  \   accounts[from] -= amount;\n   System.out.printf(\" %10.2f from %d to %d\", amount,\
  \ from, to);\n   accounts[to] += amount;\n   System.out.printf(\" Total Balance:\
  \ %10.2f%n\", getTotalBalance());\n}\n```\n\n这里是 `TransferRunnable` 类的代码。它的 `run`\
  \ 方法不断从一个固定的银行账户中取出资金。在每次迭代中，`run` 方法选取一个随机目标账户和随机金额，调用银行对象上的 `transfer` 方法，然后睡眠。\n\
  \n点击此处查看代码图像\n\n```java\nclass TransferRunnable implements Runnable\n{\n   . . .\n\
  \   public void run()\n   {\n      try\n      {\n         int toAccount = (int)\
  \ (bank.size() * Math.random());\n         double amount = maxAmount * Math.random();\n\
  \         bank.transfer(fromAccount, toAccount, amount);\n         Thread.sleep((int)\
  \ (DELAY * Math.random()));\n      }\n      catch(InterruptedException e) {}\n \
  \  }\n}\n```\n\n当此模拟运行时，我们不知道任何时候某个银行账户中有多少钱。但我们知道所有账户的资金总额应该保持不变。\n\n由于我们只是将资金从一个账户移动到另一个账户，所有账户的资金总额应该保持不变。在每笔交易结束后，`transfer`\
  \ 方法重新计算总和并打印。\n\n这个程序不会结束。只需按 Ctrl+C 杀死程序。这是一个典型的输出：\n\n点击此处查看代码图像\n\n. . .\n588.48\
  \ from 11 to 4\n976.1 from 12 to 22\n521.5 from 14 to 22\n359.89 from 13 to 81\n\
  . . .\n401.7 from 36 to 4\n691.46 from 35 to 7\n78.64 from 37 to 3\n197.1 from 34\
  \ to 69\n85.96 from 36\n\n正如所示，出了问题。在几次交易后，余额保持在 100,000，这是 100 个账户每个 1,000 的正确总和。但一段时间后，余额发生了变化。当你运行这个程序时，错误可能会很快发生，也可能需要很长时间余额才会损坏。这种情况并不令人放心，你不会想把辛苦挣的钱存进这家银行。\n\
  \nListing 14.5. unsynch/UnsynchTest\n\n点击此处查看代码图像\n\n```java\npackage unsynch;\n\
