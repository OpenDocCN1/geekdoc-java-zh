  \ drawString(String str, float x, float y)` 使用当前字体和颜色绘制字符串。\n\n![Image](img/image0106.jpeg)\n\
  \n***\n\n### javax.swing.JComponent 1.2\n\n- `FontMetrics getFontMetrics(Font f)`\
