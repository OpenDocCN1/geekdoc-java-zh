  \n- `boolean drawImage(Image img, int x, int y, ImageObserver)` 绘制未缩放的图像。注意：此调用可能在图像绘制之前返回。\n\
  ![Image](img/image0158.jpeg)\n- `boolean drawImage(Image img, int x, int y, int\
