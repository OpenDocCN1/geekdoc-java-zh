  21                      frame.setVisible(true);\n22                  }\n23     \
  \         });\n24      }\n25  }\n\n```\n\n* * *\n\n### 9.6. 复杂的布局管理\n\n到目前，我们已经成功通过使用边界布局（border\
  \ layout）、流布局（flow layout）和网格布局（grid layout）管理了示例应用程序的用户界面。对于更复杂的任务，这些是不够的。在本节中，我们将详细讨论高级布局管理。\n\
  \nWindows 程序员可能很好奇，为什么 Java 对布局管理器如此大费章。毕竟，在 Windows 中，布局管理并不是什么大问题；你只需要使用对话框编辑器将组件拖放到对话框的表面上，然后使用编辑器工具对齐组件、使它们等间距、使其居中等。如果你正在处理一个大项目，你可能根本不需要担心组件布局——熟练的用户界面设计师会为你做完一切。\n\
  \n这种方法的问题是，如果组件的大小发生变化，生成的布局必须手动更新。组件的大小为什么要变化呢？有两种常见情况。第一，用户可能会为按钮标签和其他对话框文本选择更大的字体。如果你在\
  \ Windows 中亲自尝试一下，你会发现许多应用程序处理这种情况得非常糟糕。按钮不会增大，较大的字体只是被挤在原来的空间里。当应用程序中的字符串被翻译成外语时，也会发生同样的问题。例如，“Cancel”的德语单词是“Abbrechen”。如果按钮的设计仅有容纳“Cancel”字符串的空间，那么德语版本看起来就会坏掉。\n\
  \n为什么 Windows 按钮不为了适应标签而自动增大呢？因为用户界面设计师没有给出它们向哪个方向生长的指令。在拖放和排列之后，对话框编辑器仅仅记得每个组件的像素位置和大小。它并不记得*为什么*要以这种方式排列组件。\n\
  \nJava 布局管理器是组件布局的一种更好方法。使用布局管理器，布局包含了关于组件之间关系的指令。这在原始 AWT（使用原生用户界面元素）中尤为重要。按钮或列表框在\
  \ Motif、Windows 和 Macintosh 中的尺寸可能差异很大，应用程序或插件无法预先知道将在哪个平台上显示其用户界面。在某种程度上，这种程度的差异随着\
  \ Swing 消失了。如果你的应用程序强制使用特定的外观（如 Metal），它在所有平台上看起来都是一样的。但是，如果你让应用程序的用户选择他们喜爱的外观，那么你再次需要依赖布局管理器的灵活性来排列组件。\n\
  \n\n\n\n\n自 Java 1.0 起，AWT 就包含了 `grid bag layout`（网格布局），它按行和列布局组件。行和列的大小是灵活的，组件可以跨越多行多列。这种布局管理器非常灵活，但也非常复杂。仅仅是“grid\
  \ bag layout”这几个字，就让许多 Java 程序员感到恐惧。\n\n在尝试设计一种能让程序员从 grid bag layout 的暴政中解放出来的布局管理器未果后，Swing\
  \ 设计师们提出了 `box layout`（箱体布局）。根据 `BoxLayout` 类的 JDK 文档：“嵌套多个具有不同水平和垂直[sic]组合的面板，可以产生与\
  \ `GridBagLayout` 类似的效果，而不会具有后者的复杂性。”然而，由于每个框都是独立布局的，你无法使用箱体布局同时在水平和垂直方向上排列相邻组件。\n\
  \nJava SE 1.4 出现了另一种设计 grid bag layout 替代方案的尝试——`spring layout`（弹簧布局）。你使用虚拟的弹簧来连接容器中的组件。随着容器的大小调整，弹簧会拉伸或收缩，从而调整组件的位置。这听起来既费琐又困惑，事实也确实。spring\
  \ layout 很快就被遗忘了。\n\n2005 年，NetBeans 团队发明了 Matisse 技术，它将布局工具和布局管理器结合在一起。用户界面设计师使用该工具将组件拖入容器中，并指示哪些组件应该对齐。该工具将设计者的意图转换为\
  \ `group layout manager`（分组布局管理器）的指令。这比手动编写布局管理代码要方便得多。分组布局管理器现在是 Java SE 的一部分。即使你不使用\
  \ NetBeans 作为 IDE，我们也认为你应该考虑使用它的 GUI 生成器工具。你可以在 NetBeans 中设计 GUI，并将生成的代码粘贴到你选择的\
  \ IDE 中。\n\n在接下来的章节中，我们将介绍 grid bag layout，因为它是常用的，而且仍然是旧版本 Java 生成布局代码最简单的机制。我们将为你展示一种策略，在常见情况下让\
  \ grid bag layout 变得不再痛苦。\n\n接下来，我们将介绍 Matisse 工具和分组布局管理器。你可能想知道分组布局管理器是如何工作的，以便在你视觉化地定位组件时，可以检查\
  \ Matisse 是否记录了正确的指令。\n\n最后，我们将展示如何完全跳过布局管理并手动放置组件，以及如何编写自己的布局管理器。\n\n## 9.6.1.\
  \ The Grid Bag Layout\n\ngrid bag layout 是所有布局管理器的母体。你可以将 grid bag layout 视为一种没有限制的网格布局。在\
  \ grid bag layout 中，行和列可以有任意的大小。你可以合并相邻单元格以为更大的组件留出空间。（许多文字处理器以及 HTML 都为表格提供了类似的功能：你可以从网格开始，然后根据需要合并相邻单元格。）组件不需要填充整个单元格区域，你可以指定它们在单元格内的对齐方式。\n\
  \n考虑图 9.29 中的字体选择器。它由以下组件组成：\n\n• 用于指定字体和大小的两个组合框\n• 这两个组合框的标签\n• 用于勾选粗体和斜体的两个复选框\n\
  • 用于示例字符串的文本区域\n\n![Image](img/image0112.jpeg)\n\n图 9.29. 字体选择器\n\n现在，将容器划分为单元格网，如图\
  \ 9.30 所示。（行和列的大小不需要相等。）每个复选框跨越两列，文本区域跨越四行。\n\n![Image](img/image01121.jpeg)\n\n\
  图 9.30. 设计中使用的对话框网格\n\n要向 grid bag 描述布局，请使用以下步骤：\n\n**1.** 创建一个 `GridBagLayout`\
  \ 类型的对象。你不需要告诉它底层网格有多少行多少列。相反，布局管理器将尝试根据你之后提供的信息来推断。\n\n**2.** 将此 `GridBagLayout`\
  \ 对象设置为该组件的布局管理器。\n\n**3.** 对于每个组件，创建一个 `GridBagConstraints` 类型的对象。设置 `GridBagConstraints`\
  \ 对象的字段值，以指定组件在 grid bag 内的布局方式。\n\n**4.** 最后，通过调用 `add(component, constraints);`\
  \ 带有约束条件添加每个组件。\n\n这里是所需的代码示例。（我们将在随后的章节中详细详细介绍各种约束条件——如果你不知道某些约束条件的作用，不要担心。）\n\n\
  点击此处查看代码图像\n\n```java\nGridBagLayout layout = new GridBagLayout();\npanel.setLayout(layout);\n\
  GridBagConstraints constraints = new GridBagConstraints();\nconstraints.weightx\
  \ = 100;\nconstraints.weighty = 100;\nconstraints.gridx = 0;\nconstraints.gridy\
  \ = 2;\nconstraints.gridwidth = 2;\nconstraints.gridheight = 1;\npanel.add(component,\
  \ constraints);\n```\n\n技巧在于知道如何设置 `GridBagConstraints` 对象的状态。我们将在随后的章节中讨论使用该对象。\n\
  \n### 9.6.1.1. The gridx, gridy, gridwidth, and gridheight Parameters\n\n`gridx`、`gridy`、`gridwidth`\
  \ 和 `gridheight` 约束定义了组件在网格中的位置。`gridx` 和 `gridy` 值指定了组件左上角的列和行位置。`gridwidth` 和\
  \ `gridheight` 决定了组件占据的列和行。网格坐标从 0 开始。特别地，`gridx = 0` 和 `gridy = 0` 表示左上角。我们示例中的文本区域\
  \ `gridx = 2`，`gridy = 0`，因为它位于第 0 行的第 2 列。它 `gridwidth = 1` 且 `gridheight = 4`，因为它跨了一列四行。\n\
  \n### 9.6.1.2. Weight Fields\n\n你始终需要为 grid bag 布局中的区域设置权重字段（`weightx` 和 `weighty`）。如果你将权重设置为\
  \ 0，该区域在该方向上既不会增长也不会缩小到初始大小。在第 494 页的[图 9.29] 的 grid bag 布局中，我们将标签的 `weightx` 字段设置为\
  \ 0。这允许标签在调整窗口大时保持宽度不变。另一方面，如果你将所有区域的权重设置为 0，容器将聚集在分配区域的中心，而不是拉伸以填充它。\n\n从概念上讲，权重参数的问题在于权重是行和列的属性，而不是单个单元格的属性。但你需要为单元格指定它们，因为\
  \ grid bag 并没有暴露行和列。行和列的权重是作为每行或每列中单元格权重的最大值计算的。因此，如果你想让某一行或某一列保持固定大小，需要将其中所有组件的权重设置为\
  \ 0。\n\n注意，权重并没有给出列的相对大小。它们告诉我们当容器超过其首选尺寸时，应该分配给每个区域的剩余空间百分比。这并不直观。我们建议将所有权重设置为\
  \ 100。然后运行程序并查看布局效果。调整对话框以查看行和列如何调整。如果你发现某一行或某一列不应该增长，请将其中所有组件的权重设置为 0。你可以尝试其他的权重值，但通常不值得精力。\n\
  \n### 9.6.1.3. The fill and anchor Parameters\n\n如果你不希望组件拉伸并填充整个区域，请设置 `fill` 约束。该参数有四种可能的情况：有效值为\
  \ `GridBagConstraints.NONE`、`GridBagConstraints.HORIZONTAL`、`GridBagConstraints.VERTICAL`\
  \ 和 `GridBagConstraints.BOTH`。\n\n\n\n\n如果组件没有填充整个区域，你可以通过设置 `anchor` 字段来指定希望组件位于区域的哪个位置。有效值为\
  \ `GridBagConstraints.CENTER`（默认值）、`GridBagConstraints.NORTH`、`GridBagConstraints.NORTHEAST`、`GridBagConstraints.EAST`\
  \ 等。\n\n### 9.6.1.4. 内边距 (Padding)\n\n你可以通过设置 `GridBagConstraints` 的 `insets` 字段在组件周围留出额外的空白。将\
  \ `Insets` 对象的 `left`、`top`、`right` 和 `bottom` 值设置为你希望在组件周围保留的空间量。这被称为外部内边距。\n\n\
  `ipadx` 和 `ipady` 值设置内部内边距。这些值会加上组件的最小宽度和高度。这确保了组件不会缩小到最小尺寸。\n\n### 9.6.1.5. 指定\
  \ gridx, gridy, gridwidth 和 gridheight 的替代方法\n\nAWT 文档建议不要将 `gridx` 和 `gridy` 值设置为绝对位置，而是将它们设置为常量\
  \ `GridBagConstraints.RELATIVE`。然后按照标准顺序（第一行从左到右，然后移动到下一行，依此类推）将组件添加到网格布局中。通过提供相应的\
  \ `gridheight` 和 `gridwidth` 字段来指定跨 span。如果组件延伸到最后一行或最后一列，不需要指定具体的数字，可以使用常量 `GridBagConstraints.REMAINDER`。这告诉布局管理器该组件是该行的最后一个。\n\
  \n这种方案似乎可行，但向布局管理器隐藏实际位置信息并希望它重新发现听起来非常愚蠢。但在实践中，遵循以下配方可以让网格布局变得非常简单：\n\n1. **在纸上勾勒出组件布局。**\n\
  2. **找到网格，使得小型组件位于每个单元格中，较大的组件跨越多个单元格。**\n3. **为网格的行和列标记 0, 1, 2, 3... 你现在可以读出 `gridx`、`gridy`、`gridwidth`\
  \ 和 `gridheight` 值。**\n4. **对于每个组件，问自己是否需要水平或垂直填充单元格。如果不需要，希望如何对齐？这决定了 `fill` 和\
  \ `anchor` 参数。**\n5. **将所有权重设置为 `100`。然而，如果你希望某一行或某列保持默认大小，将属于该行或列的所有组件的 `weightx`\
  \ 或 `weighty` 设置为 `0`。**\n6. **编写代码。仔细检查你的 `GridBagConstraints` 设置。错误的约束会破坏整个布局。**\n\
  7. **编译、运行并享受。**\n\n某些 GUI 生成器甚至具有可视化指定约束的工具——参见 NetBeans 中的配置对话框 图 9.31]。\n\n![Image](img/image012.jpeg)\n\
  \n图 9.31. 在 NetBeans 中指定网格约束\n\n### 9.6.1.6. 用于简化网格约束的辅助类\n\n网格布局最枯燥的部分是编写约束代码。大多数程序员为此编写了辅助函数或小型辅助类。我们在字体对话框示例的完整代码之后这样一个类。该类具有以下特征：\n\
  \n* 它的名字很短：`GBC` 而不是 `GridBagConstraints`。\n* 它继承自 `GridBagConstraints`，因此可以使用像\
  \ `GBC.EAST` 这样更短的常量名。\n* 在添加组件时使用 `GBC` 对象，例如：\n\n```\nadd(component, new GBC(1,\
  \ 2));\n```\n* 有两个构造函数可以设置常用参数：`gridx` 和 `gridy`，或者 `gridx`、`gridy`、`gridwidth`\
  \ 和 `gridheight`。\n```\nadd(component, new GBC(1, 2, 1, 4));\n```\n* 对于 `x`/`y`\
  \ 对的字段提供了方便的 setter：\n```\nadd(component, new GBC(1, 2).setWeight(100, 100));\n\
  ```\n* setter 方法返回 `this`，因此你可以进行链式调用：\n```\nadd(component, new GBC(1, 2).setAnchor(GBC.EAST).setWeight(100,\
  \ 100));\n```\n* `setInsets` 方法为你构造 `Insets` 对象。要获得一个像素的内边距，只需调用：\n```\nadd(component,\
  \ new GBC(1, 2).setAnchor(GBC.EAST).setInsets(1));\n```\n\n代码 9.10 显示了字体对话框示例的帧类。GBC\
  \ 辅助类在 代码 9.12 中。以下是将组件添加到网格的代码：\n\n点击此处查看图像\n\n```\nadd(faceLabel, new GBC(0, 0).setAnchor(GBC.EAST));\n\
  \nadd(face, new GBC(1, 0).setFill(GBC.HORIZONTAL).setWeight(100, 0).setInsets(1));\n\
  \nadd(sizeLabel, new GBC(0, 1).setAnchor(GBC.EAST));\n\nadd(size, new GBC(1, 1).setFill(GBC.HORIZONTAL).setWeight(100,\
  \ 0).setInsets(1));\n\nadd(bold, new GBC(0, 2, 2, 1).setAnchor(GBC.CENTER).setWeight(100,\
  \ 100));\n\nadd(italic, new GBC(0, 3, 2, 1).setAnchor(GBC.CENTER).setWeight(100,\
  \ 100));\n\nadd(sample, new GBC(2, 0, 1, 4).setFill(GBC.BOTH).setWeight(100, 100));\n\
  ```\n\n一旦你理解了网格约束，这种代码就非常易读且易调试。\n\n![Image](img/image948.jpeg) 注意：教程 `http://docs.oracle.com/javase/Swing/gridbag.html`\
  \ 建议复用同一个 `GridBagConstraints` 对象。我们发现这种代码难以读且容易出错。例如，它是真的想要按钮拉伸，还是程序员忘记了关闭 `fill`\
  \ 约束？\n\n\n\n\n```java\nadd(size, new GBC(1, 1).setFill(GBC.HORIZONTAL).setWeight(100,\
  \ 0).setInsets(1));\nadd(bold, new GBC(0, 2, 2, 1).setAnchor(GBC.CENTER).setWeight(100,\
  \ 100));\nadd(italic, new GBC(0, 3, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\n\
  add(sample, new GBC(2, 0, 1, 4).setFill(GBC.BOTH).setWeight(100, 100));\npack();\n\
  updateSample();\n}\n\npublic void updateSample() {\n    String fontFace = (String)\
  \ face.getSelectedItem();\n    int fontStyle = (bold.isSelected() ? Font.BOLD :\
  \ 0) + (italic.isSelected() ? Font.ITALIC : 0);\n    int fontSize = size.getItemAt(size.getSelectedIndex());\n\
  \    Font font = new Font(fontFace, fontStyle, fontSize);\n    sample.setFont(font);\n\
  \    sample.repaint();\n}\n```\n\n### Listing 9.11. `gridbag/GBC.java`\n\n点击此处查看代码图像\n\
  \n```java\npackage gridbag;\n\nimport java.awt.*;\n\n/**\n * 此类简化了 GridBagConstraints\
  \ 类的使用。\n * @version 1.01 2004-05-06\n * @author Cay Horstmann\n */\npublic class\
  \ GBC extends GridBagConstraints {\n    /**\n     * 构建一个给定 gridx 和 gridy 位置的 GBC，并将所有其他\
  \ grid\n     * bag 约束值设置为默认值。\n     * @param gridx gridx 位置\n     * @param gridy\
  \ the gridy 位置\n     */\n    public GBC(int gridx, int gridy) {\n        this.gridx\
  \ = gridx;\n        this.gridy = gridy;\n    }\n\n    /**\n     * 构建一个给定 gridx,\
  \ gridy, gridwidth, gridheight 的 GBC，并将所有\n     * 其他 grid bag 约束值设置为默认值。\n     *\
  \ @param gridx the gridx 位置\n     * @param gridy the gridy 位置\n     * @param gridwidth\
  \ x 方向的单元格跨度\n     * @param gridheight y 方向的单元格跨度\n     */\n    public GBC(int gridx,\
  \ int gridy, int gridwidth, int gridheight) {\n        this.gridx = gridx;\n   \
  \     this.gridy = gridy;\n        this.gridwidth = gridwidth;\n        this.gridheight\
  \ = gridheight;\n    }\n\n    /**\n     * 设置锚点。\n     * @param anchor 锚点值\n    \
  \ * @return 此对象以便进行进一步修改\n     */\n    public GBC setAnchor(int anchor) {\n    \
  \    this.anchor = anchor;\n        return this;\n    }\n\n    /**\n     * 设置填充方向。\n\
  \     * @param fill 填充方向\n     * @return 此对象以便进行进一步修改\n     */\n    public GBC setFill(int\
  \ fill) {\n        this.fill = fill;\n        return this;\n    }\n\n    /**\n \
  \    * 设置单元格权重。\n     * @param weightx x 方向的单元格权重\n     * @param weighty y 方向的单元格权重\n\
  \     * @return 此对象以便进行进一步修改\n     */\n    public GBC setWeight(double weightx,\
  \ double weighty) {\n        this.weightx = weightx;\n        this.weighty = weighty;\n\
  \        return this;\n    }\n\n    /**\n     * 设置此单元格的内边距。\n     * @param distance\
  \ 所有方向上使用的间距\n     * @return 此对象以便进行进一步修改\n     */\n    public GBC setInsets(int\
  \ distance) {\n        this.insets = new Insets(distance, distance, distance);\n\
  \        return this;\n    }\n\n    /**\n     * 设置此单元格的内边距。\n     * @param top 顶部的间距\n\
  \     * @param left 左侧的间距\n     * @param bottom 部的间距\n     * @param right 右侧的间距\n\
  \     * @return 此对象以便进行进一步修改\n     */\n    public GBC setInsets(int top, int left,\
  \ int bottom, int right) {\n        this.insets = new Insets(top, left, bottom,\
  \ right);\n        return this;\n    }\n\n    /**\n     * 设置内部间距。\n     * @param\
  \ ipadx x 方向的内部间距\n     * @param ipady y 方向的内部间距\n     * @return 此对象以便进行进一步修改\n\
  \     */\n    public GBC Ipad(int ipadx, int ipady) {\n        this.ipadx = ipadx;\n\
  \        this.ipady = ipady;\n        return this;\n    }\n}\n```\n\n### `java.awt.GridBagConstraints`\n\
  \n- `int gridx, gridy`: 指定单元格的起始列和行。默认值为 `0`。\n- `int gridwidth, gridheight`: 指定单元格的列和行跨度。默认值为\
  \ `1`。\n- `double weightx, weighty`: 指定单元格增长的能力。默认值为 `0`。\n- `int anchor`: 指定组件在单元格内的对齐方式。你可以选择绝对位置\
  \ `CENTER`，或其方向无关的对应项：\n  ![Image](img/image0123.jpeg)\n  如果你的应用程序可能是从右向左或从上到下的，请使用后者：\n\
  \  ![Image](img/image0124.jpeg)\n- `int fill`: 指定组件在单元格内的填充行为：`NONE`、`HORIZONTAL`\
  \ 或 `VERTICAL`。默认值为 `NONE`。\n- `int ipadx, ipady`: 指定组件周围的内部边距。\n- `Insets insets`:\
  \ 指定组件周围的外部边距。\n- `GridBagConstraints(int gridx, int gridy, int gridwidth, int gridheight,\
  \ double weightx, double weighty, int anchor, int fill, Insets insets, int ipadx,\
  \ int ipady)` 构建一个所有字段已指定的 GridBagConstraints。这应该仅由自动生成器使用。\n\n#### Group Layout\n\
  \n在讨论 GroupLayout 类的 API 之前，让我们快速查看 Matisse 构建器。我们不会提供完整的教程——请参见 `www.netbeans.org/articles/matisse`。\n\
  \n这里是图 9.13](#part014.xhtml_449) 的布局流：创建一个新项目并添加 `JFrame` 表单。拖动标签直到出现将其容器隔的指南线：\n\
  ![Image](img/image0125.jpeg)\n在第一个标签下方放置另一个标签：\n![Image](img/image0126.jpeg)\n拖动文本字段，使其基线与第一个标签的基线对齐。再次注意指南线：\n\
  ![Image](img/image0127.jpeg)\n最后，将密码字段与上面的标签和文本对齐：\n![Image](img/image0128.jpeg)\n\
  \nMatisse 将这些操作转换为以下代码：\n\n点击此处查看代码图像\n\n```java\nlayout.setHorizontalGroup(\n \
  \   layout.createParallelGroup(GroupLayout.LEADING)\n    .addGroup(layout.createSequentialGroup()\n\
  \        .addContainerGap()\n        .addGroup(layout.createParallelGroup(GroupLayout.LEADING)\n\
  \            .addGroup(layout.createSequentialGroup()\n                .addComponent(jLabel1)\n\
  \                .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n    \
  \            .addComponent(jTextField1))\n            .addGroup(layout.createSequentialGroup()\n\
  \                .addComponent(jLabel2)\n                .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n\
  \                .addComponent(jPasswordField1)))\n    .addContainerGap(222, Short.MAX_VALUE)));\n\
  \nlayout.setVerticalGroup(\n    layout.createParallelGroup(GroupLayout.LEADING)\n\
  \    .addGroup(layout.createSequentialGroup()\n```\n\n\n\n\n\n这看起来有点吓人，但幸运的是你不需要编写这些代码。然而，对布局操作有一个基本的理解是有帮助的，这样你就能发现错误。我们将分析代码的基本结构。本节末尾的\
  \ API 注释将详细解释每个类和方法。\n\n### 使用 GroupLayout 组织组件\n\n组件通过将它们放入类型为 `GroupLayout.SequentialGroup`\
  \ 或 `GroupLayout.ParallelGroup` 的对象来组织。这些类是 `GroupLayout.Group` 的子类。组（Groups）可以包含组件、间隙和嵌套组。组类的各种\
  \ `add` 方法返回该组对象，因此方法调用可以像这样进行链式调用：\n\n```java\ngroup.addComponent(...).addPreferredGap(...).addComponent(...);\n\
  ```\n\n从示例代码中可以看到，组布局（group layout）将水平布局和垂直布局计算分离开来。为了使水平计算的可视化，请想象组件被扁平化，使其高度为零，如下所示：\n\
  \n![Image](img/image01129.jpeg)\n\n有两组并行的组件，对应于（略微简化）的代码：\n\n点击此处查看代码图像\n\n```java\n\
  .addContainerGap()\n  .addGroup(layout.createParallelGroup()\n    .addGroup(layout.createSequentialGroup()\n\
  \      .addComponent(jLabel1)\n      .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n\
  \      .addComponent(jTextField1))\n    .addGroup(layout.createSequentialGroup()\n\
  \      .addComponent(jLabel2)\n      .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n\
  \      .addComponent(jPasswordField1)))\n```\n\n但等等，这不对。如果标签的长度不同，文本字段和密码字段将无法对齐。我们必须告诉\
  \ Matisse 我们希望这些字段对齐。选择这两个字段，右键点击，并在菜单中选择 `Align -> Left to Column`（对齐 -> 左对齐）。同时也对齐标签（参见图\
  \ 9.32）。\n\n![Image](img/image01130.jpeg)\n\n图 9.32. 在 Matisse 中对齐标签和文本字段\n\n这极大地改变了布局代码：\n\
  \n点击此处查看代码图像\n\n```java\n.addGroup(layout.createSequentialGroup()\n  .addContainerGap()\n\
  \  .addGroup(layout.createParallelGroup(GroupLayout.Alignment.LEADING)\n    .addComponent(jLabel1,\
  \ GroupLayout.Alignment.TRAILING)\n    .addComponent(jLabel2, GroupLayout.Alignment.TRAILING))\n\
  \  .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n  .addGroup(layout.createParallelGroup(GroupLayout.Alignment.LEADING)\n\
  \    .addComponent(jTextField1)\n    .addComponent(jPasswordField1))\n```\n\n现在，标签和字段分别被放置在一个并行组中。第一个组的对齐方式为\
  \ `TRAILING`（当文本方向为从左到右时，意味着右对齐）：\n\n![Image](img/image01131.jpeg)\n\nMatisse 能够将设计者的指令翻译成嵌套组，这看起来像魔法——但正如阿瑟·C·克拉克所说，任何足够先进的`technology`\
  \ 与魔法无异。\n\n### 垂直计算\n\n为了完整起见，让我们来看垂直计算。现在你应该认为组件没有宽度。我们有一个顺序组，其中包含两个并行组，并用间隙分隔：\n\
  \n![Image](img/image01132.jpeg)\n\n对应的代码是：\n\n点击此处查看代码图像\n\n```java\nlayout.createSequentialGroup()\n\
  \  .addContainerGap()\n  .addGroup(layout.createParallelGroup(GroupLayout.Alignment.BASELINE)\n\
  \    .addComponent(jLabel1)\n    .addComponent(jTextField1))\n  .addPreferredGap(LayoutStyle.ComponentPlacement.RELATED)\n\
  \  .addGroup(layout.createParallelGroup(GroupLayout.Alignment.BASELINE)\n    .addComponent(jLabel2)\n\
  \    .addComponent(jPasswordField1))\n```\n\n从代码中可以看出，组件是根据它们的基线对齐的（基线基线是组件文本对齐的行）。你可以强制一组组件具有相同的大小。例如，我们可能想要确保文本字段和密码字段的宽度匹配。在\
  \ Matisse 中，选择两者，右键点击，并在菜单中选择 `Same Size -> Same Width`（相同大小 -> 相同宽度）（参见图 9.33）。\n\
  \n![Image](img/image01133.jpeg)\n\n图 9.33. 强制两个组件具有相同的宽度\n\nMatisse 在布局代码中添加了以下语句：\n\
  \n```java\nlayout.linkSize(SwingConstants.HORIZONTAL, new Component[]{jPasswordField1,\
  \ jTextField1});\n```\n\n`Listing 9.12`](part0014.xhtml_ch09ex12) 显示了如何使用 `GroupLayout`\
  \ 而不是 `GridBagLayout` 来布局上一节中的字体选择器。代码看起来可能并没有 `Listing 9.10` (p.500.xhtml_ch09)\
  \ 那么简单，但我们不需要手写它。\n\n#### Listing 9.12/FontFrame.java\n\n点击此处查看代码图像\n\n\n\n\n\n\
