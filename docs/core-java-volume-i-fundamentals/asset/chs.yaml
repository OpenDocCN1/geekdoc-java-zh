  \   public static java.lang.Double valueOf(java.lang.String);\n   public static\
  \ boolean isNaN(double);\n   public boolean isNaN();\n   public static boolean isInfinite(double);\n\
  \   public boolean isInfinite();\n   public byte byteValue();\n   public short shortValue();\n\
  \   public int intValue();\n   public long longValue();\n   public float floatValue();\n\
  \   public double doubleValue();\n   public static double parseDouble(java.String);\n\
  \   public static long doubleToLongBits(double);\n   public static double longToDoubleBits(long);\n\
  \   public static int doubleToInt(double);\n   public static final double POSITIVE_INFINITY;\n\
  \   public static final double NEGATIVE_INFINITY;\n   public static final double\
  \ NaN;\n   public static final double MAX_VALUE;\n   public static final double\
  \ MIN_VALUE;\n   public static final Class TYPE;\n   private double value;\n   private\
  \ static long serialVersionUID;\n}\n```\n\n列表 5.13. reflection/ReflectionTest.java\n\
  \n\n\n\n\n```java\nString modifiers = Modifier.toString(c.getModifiers());\nif (modifiers.length()\
  \ > 0) System.out.print(modifiers + \" \");\nSystem.out.print(name + \"(\");\n//\
  \ 输出参数类型\nClass[] paramTypes = c.getParameterTypes();\nfor (int j = 0; j < paramTypes.length;\
  \ j++)\n{\n    if (j > 0) System.out.print(\", \");\n    System.out.print(paramTypes[j].getName());\n\
  }\nSystem.out.println(\");\");\n```\n\n/**\n * 打印类所有的方法\n * @param cl 一个类对象\n */\n\
  public static void printMethods(Class cl)\n{\n    Method[] methods = cl.getDeclaredMethods();\n\
  \    for (Method m : methods)\n    {\n        Class retType = m.getReturnType();\n\
  \        String name = m.getName();\n\n        System.out.print(\"  \");\n     \
  \   // 打印修饰符、返回值和方法名\n        String modifiers = Modifier.toString(m.getModifiers());\n\
  \        if (modifiers.length() > 0) System.out.print(modifiers + \" \");\n    \
  \    System.out.print(retType.getName() + \" \" + name + \"(\");\n\n        // 输出参数类型\n\
  \        Class[] paramTypes = m.getParameterTypes();\n        for (int j = 0; j\
  \ < paramTypes.length; j++)\n        {\n            if (j > 0) System.out.print(\"\
  , \");\n            System.out.print(paramTypes[j].getName());\n        }\n    \
  \    System.out.println(\");\");\n    }\n}\n\n/**\n * 打印类所有的字段\n * @param cl 一个类对象\n\
  \ */\npublic static void printFields(Class cl)\n{\n    Field[] fields = cl.getDeclaredFields();\n\
  \    for (Field f : fields)\n    {\n        Class type = f.getType();\n        String\
  \ name = f.getName();\n        System.out.print(\"  \");\n        String modifiers\
  \ = Modifier.toString(f.getModifiers());\n        if (modifiers.length() > 0) System.out.print(modifiers\
  \ + \" \");\n        System.out.println(type.getName() + \" \" + name + \";\");\n\
  \    }\n}\n```\n\n这个程序的非凡之处在于，它可以分析 Java 解释器可以加载的任何类，而不仅仅是程序编译时就可用的类。我们将在下一章中使用这个程序来窥探\
  \ Java 编译器生成的内部类的内部结构。\n\n### java.lang.Class\n- `Field[] getFields()`\n- `Field[]\
  \ getDeclaredFields()`: `getFields` 返回一个包含该类或其父类公共字段的 `Field` 对象的数组；`getDeclaredFields`\
  \ 返回包含该类所有字段的 `Field` 对象的数组。如果没有此类字段，或者 `Class` 对象表示的是基本数据类型或数组类型，则返回长度为 0 的数组。\n\
  - `Method[] getMethods()`\n- `Method[] getDeclaredMethods()`: 返回一个包含 `Method` 对象的数组：`getMethods`\
  \ 返回公共方法并包括继承的方法；`getDeclaredMethods` 返回该类或接口的所有方法，但不包括继承的方法。\n- `Constructor[]\
  \ getConstructors()`\n- `Constructor[] getDeclaredConstructors()`: 返回一个包含 `Constructor`\
  \ 对象的数组，为您提供由该 `Class` 对象表示的类的所有公共构造方法（针对 `getConstructors`）或所有构造方法（针对 `getDeclaredConstructors`）。\n\
  \n### java.lang.reflect.Field\n### java.lang.reflect.Method\n### java.lang.reflect.Constructor\n\
  - `Class getDeclaringClass()`: 返回定义此构造方法、方法或字段的类的 `Class` 对象。\n- `Class[] getExceptionTypes()`\
  \ (在 `Constructor` 和 `Method` 类中): 返回一个表示该方法抛出的异常类型的 `Class` 对象数组。\n- `int getModifiers()`:\
  \ 返回描述此构造方法、方法或字段修饰符的整数。使用 `Modifier` 类的方法来分析返回值。\n- `String getName()`: 返回构造方法、方法或字段的名称。\n\
  - `Class[] getParameterTypes()` (在 `Constructor` 和 `Method` 类中): 返回表示参数类型的 `Class`\
  \ 对象数组。\n- `Class getReturnType()` (在 `Method` 类中): 返回返回类型的 `Class` 对象。\n\n### java.lang.reflect.Modifier\n\
  - `static String toString(int modifiers)`: 返回与 `modifiers` 中设置的位对应的修饰符字符串。\n- `static\
  \ boolean isAbstract(int modifiers)`\n- `static boolean isFinal(int modifiers)`\n\
  - `static boolean isInterface(int modifiers)`\n- `static boolean isNative(int modifiers)`\n\
  - `static boolean isPrivate(int modifiers)`\n- `static boolean isProtected(int modifiers)`\n\
  - `static boolean isPublic(int modifiers)`\n- `static boolean isStatic(int modifiers)`\n\
  - `static boolean isStrict(int modifiers)`\n- `static boolean isSynchronized(int\
  \ modifiers)`\n- `static boolean isVolatile(int modifiers)`: 测试 `modifiers` 值中对应方法名修饰符的位。\n\
  \n#### 5.7.4 使用反射运行时分析对象\n\n在前面的节中，我们看到了如何获取任何对象的数据字段的*名称*和*类型*：\n- 获取相应的 `Class`\
  \ 对象。\n- 在 `Class` 对象上调用 `getDeclaredFields()`。\n\n在本节中，我们将更进一步，实际上查看字段的*内容*。当然，查看在编写程序时已知的特定字段的内容是很容易的。但反射允许我们查看编译时未知的字段。\n\
  \n实现这种检查的关键方法是 `Field` 类中的 `get` 方法。如果 `f` 是 `Field` 类型的对象（例如从 `getDeclaredFields`\
  \ 获得的），并且 `obj` 是 `f` 所属字段类的对象，那么 `f.get(obj)` 返回该字段当前值的对象。\n\n```java\nEmployee\
  \ harry = new Employee(\"Harry Hacker\", 35000, 10, 1, 1989);\nClass cl = harry.getClass();\n\
  Field f = cl.getDeclaredField(\"name\");\nObject v = f.get(harry);\n```\n\n\n\n\n\
  `get` 方法还有另一个问题我们需要处理。`name` 字段是 `String` 类型，因此将该值作为 `Object` 返回并没有问题。但假设我们想查看 `salary`\
  \ 字段。它是一个 `double` 类型，在 Java 中，数字类型不是对象。为了处理这个问题，你可以使用 `Field` 类的 `getDouble` 方法，或者调用\
  \ `get` 方法，反射机制会自动将字段值包装成适当的包装类——在这种情况下，为 `Double`。\n\n当然，你也可以设置你所获取的值。调用 `f.set(obj,\
  \ value)` 会将对象 `obj` 中由 `f` 表示的字段设置为新值。\n\n代码列表 5.14 展示了如何编写一个适用于*任何*类的泛型 `toString`\
  \ 方法。它使用 `getDeclaredFields` 获取所有数据字段。然后使用 `setAccessible` 便利方法使所有字段都变得可访问。对于每个字段，它都会获取其名称和值。代码列表\
  \ 5.14 通过递归调用 `toString` 将每个值转换为字符串。\n\n```java\nclass ObjectAnalyzer\n{\n  public\
  \ String toString(Object obj)\n  {\n      Class cl = obj.getClass();\n      . .\
  \ .\n      String r = cl.getName();\n      // 检查此类及其所有父类的字段\n      do\n      {\n\
  \          r += \"[\";\n          Field[] fields = cl.getDeclaredFields();\n   \
  \       AccessibleObject.setAccessible(fields, true);\n          // 获取所有字段的名称和值\n\
  \          for (Field f : fields)\n          {\n              if (!Modifier.isStatic(f.getModifiers()))\n\
  \              {\n                if (!r.endsWith(\"[\")) r += \",\";\n        \
  \        r += f.getName() + \"=\";\n                try\n                {\n   \
  \               Object val = f.get(obj);\n                  r += toString(val);\n\
  \                }\n                catch (Exception e) { e.printStackTrace(); }\n\
  \              }\n          }\n          r += \"]\";\n          cl = cl.getSuperclass();\n\
  \      }\n      while (cl != null);\n      return r;\n  }\n  . . .\n}\n```\n\n```代码列表\
  \ 5.14` 中的完整代码需要处理一些复杂性。引用循环可能会导致无限递归。因此，`ObjectAnalyzer` (代码列表 5.15) 会记录已经访问过的对象。此外，要查看数组内部，你需要不同的方法。你将在下一节中学习细节。\n\
  \n你可以使用这个 `toString` 方法来查看任何对象的内部。例如，调用：\n```java\nArrayList<Integer> squares =\
  \ new ArrayList<>();\nfor (int i = 1; i <= 5; i++) squares.add(i * i);\nSystem.out.println(new\
  \ ObjectAnalyzer().toString(squares));\n```\n将输出：\n`java.util.ArrayList[element=class\
  \ java.lang.Object[][java.lang.Integer[value=1],java.lang.Integer[value=4],java.lang.Integer[value=9],java.lang.Integer[value=16],java.lang.Integer[value=25],null,null,null],size=5,count=5]`\n\
  \n你可以使用这个泛型 `toString` 方法来实现你类中的 `toString` 方法，如下所示：\n```java\npublic String toString()\n\
  {\n  return new ObjectAnalyzer().toString(this);\n}\n```\n这是一个提供 `toString` 方法的省力方法，你可能会发现自己在自己的程序中很有用。\n\
  \n代码列表 5.14. objectAnalyzer/ObjectTest.java\n\n```java\npackage objectAnalyzer;\n\
  \nimport java.util.ArrayList;\n\n/**\n * 此程序使用反射来监视对象。\n * @version 1.2 2012-01-26\n\
  \ * @author Cay Horstmann\n */\npublic class ObjectTest\n{\n  public static void\
  \ main(String[] args)\n  {\n    ArrayList<Integer> squares = new ArrayList<>();\n\
  \    for (int i = 1; i <= 5; i++) squares.add(i * i);\n    System.out.println(new\
  \ ObjectAnalyzer().toString(squares));\n  }\n}\n```\n\n代码列表 5.15. objectAnalyzer/ObjectAnalyzer.java\n\
  \n```java\npackage objectAnalyzer;\n\nimport java.lang.reflect.AccessibleObject;\n\
  import java.lang.reflect.Array;\nimport java.lang.reflect.Field;\nimport java.lang.reflect.Modifier;\n\
  import java.util.ArrayList;\n\npublic class ObjectAnalyzer\n{\n  private ArrayList<Object>\
  \ visited = new ArrayList<>();\n\n  /**\n   * 将对象转换为列出所有字段的字符串表示。\n   * @param obj\
  \ 一个对象\n   * @return 包含对象类名以及所有字段名和值的字符串\n   */\n  public String toString(Object\
  \ obj)\n  {\n      if (obj == null) return \"null\";\n      if (visited.contains(obj))\
  \ return \"...\";\n      visited.add(obj);\n      Class cl = obj.getClass();\n \
  \     if (cl == String.class) return (String) obj;\n      if (cl.isArray())\n  \
  \    {\n          String r = cl.getComponentType() + \"[]{\";\n          for (int\
  \ i = 0; i < Array.getLength(obj); i++)\n          {\n              if (i > 0) r\
  \ += \",\";\n              Object val = Array.get(obj, i);\n              if (cl.getComponentType().isPrimitive())\
  \ r += val;\n              else r += toString(val);\n          }\n          return\
  \ r + \"}\";\n      }\n      String r = cl.getName();\n      // 检查此类及其所有父类的字段\n\
  \      do\n      {\n          r += \"[\";\n          Field[] fields = cl.getDeclaredFields();\n\
  \          AccessibleObject.setAccessible(fields, true);\n          // 获取所有字段的名称和值\n\
  \          for (Field f : fields)\n          {\n              if (!Modifier.isStatic(f.getModifiers()))\n\
  \              {\n                if (!r.endsWith(\"[\")) r += \",\";\n        \
  \        r += f.getName() + \"=\";\n                try\n                {\n   \
  \               Class t = f.getType();\n                  Object val = f.get(obj);\n\
  \                  if (t.isPrimitive()) r += val;\n                  else r += toString(val);\n\
  \                }\n                catch (Exception e)\n                {\n   \
  \                 e.printStackTrace();\n                }\n              }\n   \
  \       }\n          r += \"]\";\n          cl = cl.getSuperclass();\n      }\n\
  \      while (cl != null);\n      return r;\n  }\n}\n```\n\n\n\n\n`java.lang.reflect`\
  \ 包中的 `Array` 类允许你动态创建数组。这被用于，例如在 `Arrays` 类中 `copyOf` 方法的实现。回想一下如何使用该方法来扩展一个已经满的数组。\n\
  \n```java\nEmployee[] a = new Employee[100];\n\n. . .\n\n// array is full\n\na =\
  \ Arrays.copyOf(a, 2 * a.length);\n```\n\n如何编写这样一个泛型方法呢？`Employee[]` 数组可以转换为 `Object[]`\
  \ 数组，这很有帮助。这听起来很有前景。这是第一次尝试：\n\n点击此处查看代码图片\n\n```java\npublic static Object[] badCopyOf(Object[]\
  \ a, int newLength) // not useful\n{\n    Object[] newArray = new Object[newLength];\n\
  \    System.arraycopy(a, 0, newArray, 0, Math.min(a.length, newLength));\n    return\
  \ newArray;\n}\n```\n\n然而，在实际*使用*返回的数组时存在一个问题。此代码返回的数组类型是*对象*数组（`Object[]`），因为我们使用以下行代码创建了数组：\n\
  \n```java\nnew Object[newLength]\n```\n\n对象数组*不能*被强制转换为员工数组（`Employee[]`）。虚拟机会在运行时产生\
  \ `ClassCastException`。关键点在于，正如我们之前提到的，Java 数组会记住其条目的类型——即创建它的它的 `new` 表达式中所使用的元素类型。将\
  \ `Employee[]` 临时强制转换为 `Object[]` 数组然后将其转换回来是合法的，但一个从诞生起就是 `Object[]` 数组的数组永远无法被强制转换为\
  \ `Employee[]` 数组。要编写这种泛型数组代码，我们需要能够创建一个与原始数组*相同*类型的新数组。为了这一点，我们需要 `java.lang.reflect`\
  \ 包中 `Array` 类的方法。关键是 `Array` 类中用于构造新数组的静态方法 `newInstance`。你必须将条目的类型和所需的长度作为参数传递给该方法。\n\
  \n```java\nObject newArray = Array.newInstance(componentType, newLength);\n```\n\
  \n为了实际执行这一操作，我们需要获取新数组的长度和组件类型。\n\n我们通过调用 `Array.getLength(a)` 获取长度。`Array` 类的静态方法\
  \ `getLength` 返回数组的长度。要获取新数组的组件类型：\n\n1. 首先，获取 `a` 的类对象。\n2. 确认它确实是一个数组。\n3. 使用\
  \ `Class` 类的 `getComponentType` 方法（该方法仅为代表数组的类对象定义）来找到数组的类型。\n\n为什么 `getLength`\
  \ 是 `Array` 的方法，而 `getComponentType` 是 `Class` 的方法呢？我们不知道——反射方法的分布有时看起来有点是随意的（ad\
  \ hoc）。\n\n以下是代码：\n\n点击此处查看代码图片\n\n```java\npublic static Object goodCopyOf(Object\
  \ a, int newLength)\n{\n    Class cl = a.getClass();\n    if (!cl.isArray()) return\
  \ null;\n    Class componentType = cl.getComponentType();\n    int length = Array.getLength(a);\n\
  \    Object newArray = Array.newInstance(componentType, newLength);\n    System.arraycopy(a,\
  \ 0, newArray, 0, Math.min(length, newLength));\n    return newArray;\n}\n```\n\n\
  注意，这个 `copyOf` 方法可以扩展任何类型的数组，而不只是对象数组。\n\n```java\nint[] a = { 1, 2, 3 };\na = (int[])\
  \ goodCopyOf(a, 10);\n```\n\n为了实现这一点，`copyOf` 的参数被声明为 `Object`，而不是 `Object[]`。`int[]`\
  \ 可以强制转换为 `Object`，但 Listing 5.16 展示了两种方法的用法。`copyOf` 的返回值会抛出异常。\n\n***\n\n####\
  \ 5.7.6. 调用任意方法\n\n在 C 和 C++ 中，你可以通过函数指针执行任意函数。从表面上看， Java 并没有方法指针——即将方法的位置传递给另一个方法，以便第二个方法稍后调用它。事实上，Java\
  \ 的设计者曾说过方法指针是危险且容易出错的，而 Java *接口*（在下一节讨论）是一种更优的解决方案。然而，反射允许你调用任意方法。\n\n***\n\n\
  ![Image](img/image0948.jpeg) 注意\n\n在微软为其 Java 变体（J++ 和 C#）添加的非标准语言扩展中，还有另一种方法指针类型，称为*委托*（delegate），它与在本节中讨论的\
  \ `Method` 类不同。然而，内部类（我们将在下一节介绍）比委托是更有有用的结构。\n\n\n\n\n请记住，你可以通过 `Field` 类的 `get`\
  \ 方法来检查对象的字段。同样，`Method` 类也有一个 `invoke` 方法，允许你调用封装在当前 `Method` 对象中的方法。`invoke` 方法的签名如下：\n\
  \n```\nObject invoke(Object obj, Object... args)\n```\n\n第一个参数是隐式参数，剩余的对象提供了显式参数。\n\
  \n对于静态方法，第一个参数会被忽略——你可以将其设置为 `null`。\n\n例如，如果 `m1` 代表 `Employee` 类的 `getName` 方法，下面的代码展示了你如何调用它：\n\
  \n```java\nString n = (String) m1.invoke(harry);\n```\n\n如果返回类型是基本类型，`invoke` 方法将改为返回对应的包装类型。例如，假设\
  \ `m2` 代表 `Employee` 类的 `getSalary` 方法。那么，返回的对象实际上是一个 `Double`，你必须对其进行相应的强制类型转换。利用自动拆箱将其转换为\
  \ `double`：\n\n```java\ndouble s = (Double) m2.invoke(harry);\n```\n\n如何获取 `Method`\
  \ 对象呢？当然，你可以调用 `getDeclaredMethods` 并遍历返回的 `Method` 对象数组，直到找到你想要的方法。或者，你可以调用 `Class`\
  \ 类的 `getMethod` 方法。这类似于 `getField` 方法，后者接收一个带有字段名的字符串并返回一个 `Field` 对象。然而，可能存在多个同名方法，因此你需要小心获取获取正确的一个。出于这个原因，你还必须提供所需方法的参数类型。`getMethod`\
  \ 的签名如下：\n\n```\nMethod getMethod(String name, Class... parameterTypes)\n```\n\n\
  例如，这里展示了如何获取 `Employee` 类中 `getName` 和 `raiseSalary` 方法的指针：\n\n```java\nMethod m1\
  \ = Employee.class.getMethod(\"getName\");\nMethod m2 = Employee.class.getMethod(\"\
  raiseSalary\", double.class);\n```\n\n现在你已经了解了使用 `Method` 对象的规则，让我们让它们运转起来。Listing\
  \ 5.17 是一个程序，用于打印数学函数（如 `Math.sqrt` 或 `Math.sin`）的值表格。输出结果如下所示：\n\n```\npublic static\
  \ native double java.lang.Math.sqrt(double)\n      1.0000 |      1.0000\n      2.0000\
  \ |      1.4142\n      3.0000 |      1.7321\n      4.0000 |      2.0000\n      5.0000\
  \ |      2.2361\n      6.0000 |      2.4495\n      7.0000 |      2.6458\n      8.0000\
  \ |      2.8284\n      9.0000 |      3.0000\n     10.0000 |      3.1623\n```\n\n\
  打印表格的代码显然独立于实际列出的的函数。\n\n```java\ndouble dx = (to - from) / (n - 1);\nfor (double\
  \ x = from; x <= to; x += dx)\n{\n   double y = (Double) f.invoke(null, x);\n  \
  \ System.out.printf(\"%10.4f | %10.4f%n\", x, y);\n}\n```\n\n在这里，`f` 是 `Method`\
  \ 类型的对象。`invoke` 的第一个参数是 `null`，因为我们正在调用一个静态方法。\n\n为了为 `Math.sqrt` 函数制作表格，我们将 `f`\
  \ 设置为：\n\n```java\nMath.class.getMethod(\"sqrt\", double.class)\n```\n\n这就是 `Math`\
  \ 类中名为 `sqrt` 且带有一个 `double` 类型参数的方法。Listing 5.17 显示了通用表格器的完整代码以及几次运行。\n\nListing\
  \ 5.17 methods/MethodTest.java\n```java\npackage methods;\n\nimport java.lang.reflect.*;\n\
  \n/**\n * 此程序展示了如何通过反射调用方法。\n * @version 1.2 05-04\n * @author Cay Horst\n */\n\
  public class MethodTest\n{\n    public static void main(String[] args) throws Exception\n\
  \    {\n        // 获取 square 和 sqrt 的方法指针\n        Method square = MethodTest.class.getMethod(\"\
  square\", double.class);\n        Method sqrt = Math.class.getMethod(\"sqrt\", double.class);\n\
  \n        // 打印 x 和 y 值的表格\n        printTable(1, 10, 10, square);\n        printTable(1,\
  \ 10, 10, sqrt);\n    }\n\n    /**\n     * 返回数字的平方\n     * @param x 一个数字\n     *\
  \ @return x 的平方\n     */\n    public static double square(double x)\n    {\n   \
  \     return x * x;\n    }\n\n    /**\n     * 为某个方法打印包含 x 和 y 值的表格\n     * @param\
  \ from x 值的下界\n     * @param to x 值的上界\n     * @param n 表格的行数\n     * @param f 具有\
  \ double 参数和返回值的方法\n     */\n    public static void printTable(double from, double\
  \ to, int n, Method f)\n    {\n        // 输出方法作为表头\n        System.out.println(f);\n\
  \n        double dx = (to - from) / (n - 1);\n\n        for (double x = from; x\
  \ <= to; x += dx)\n        {\n            try\n            {\n                double\
  \ y = (Double) f.invoke(null, x);\n                System.out.printf(\"%10.4f |\
  \ %10.4f%n\", x, y);\n            }\n            catch (Exception e)\n         \
  \   {\n                e.printStackTrace();\n            }\n        }\n    }\n}\n\
  ```\n\n\n\n然而，`protected` 方法可以用于指示那些尚未准备好通用、且应该在子类中重新定义的方法。\n\n### 3. 使用继承来建模“是”（is–a）关系。\n\
  \n继承是一种实用的代码节省工具，但有时人们会过度使用。例如，假设我们需要一个 `Contractor`（承包工）类。承包工有姓名和入职日期，但他们没有工资。相反，他们按小时付费，而且停留的时间不足以获得加薪。人们往往容易从\
  \ `Employee`（员工）派生子类 `Contractor` 并添加一个 `hourlyWage`（时薪）字段。\n\n```\nclass Contractor\
  \ extends Employee\n{\n   private double hourlyWage;\n   . . .\n}\n```\n\n但这并不是一个好主意，因为现在每个承包工对象都拥有工资和时薪字段。当你实现打印工资单或税表的方法时，这会给你带来无尽的麻烦。你最终编写的代码将比最初不使用继承时要多得多。\n\
  \n承包工与员工的关系没有通过“是”的测试。承包工不是员工的特殊情况。\n\n### 4. 除非所有继承的方法都有意义，否则不要使用继承。\n\n假设我们想写一个\
  \ `Holiday`（假日）类。显然，每个假日都是一天，而天可以表示为 `GregorianCalendar`（格列历）类的实例，因此我们可以继承。\n\n\
  ```\nclass Holiday extends GregorianCalendar { . . . }\n```\n\n遗憾的是，节日的集合在继承的操作下并不是*封闭*的。`GregorianCalendar`\
  \ 的公共方法之一是 `add`。而 `add` 可以将假日变成非节假日：\n\n```\nHoliday christmas;\nchristmas.add(Calendar.DAY_OF_MONTH,\
  \ 12);\n```\n\n因此，在这个例子中使用继承是不恰的。\n\n### 5. 在重写方法时，不要改变预期的行为。\n\n替换原则不仅适用于语法，更重要的是还适用于行为。当你重写一个方法时，不应该不合理理由地改变它的行为。编译器无法为你提供帮助——它无法检查你的重新定义是否有意义。例如，你可以通过重新定义\
  \ `add` 来“修复” `Holiday` 类中 `add` 方法的问题，可能只是让它什么都不做，或者抛出一个异常，或者跳转到下一个假日。\n\n然而，这种修复违反了替换原则。以下的语句序列：\n\
  \n```\nint d1 = x.get(Calendar.DAY_OF_MONTH);\nx.add(Calendar.DAY_OF_MONTH, 1);\n\
  int d2 = x.get(Calendar.DAY_OF_MONTH);\nSystem.out.println(d2 - d1);\n```\n\n无论\
  \ `x` 是 `GregorianCalendar` 类型还是 `Holiday` 类型，都应该具有*预期行为*。\n\n当然，问题正出于此。合理和不合理的人对于什么是预期行为进行长时间争论。例如，某些作者认为替换原则要求\
  \ `Manager.equals` 应该忽略 `bonus`（奖金）字段，因为 `Employee.equals` 忽略了它。如果这些讨论在真空中发生，是毫无意义的。最终，重要的是当你在子类中重写方法时，不要绕过原始设计的意图。\n\
  \n### 6. 使用多态，而不是类型信息。\n\n每当你发现形式如下的代码时：\n\n```\nif (x is of type 1)\n   action1;\n\
  else if (x is of type 2)\n   action2;\n```\n\n请考虑多态。\n\n`action[1]` 和 `action[2]`\
  \ 代表一个共同的概念吗？如果是，将该概念变为这两个类型的共同父类或接口的方法。那么，你只需要调用\n\n```\nx.action();\n```\n\n并让多态中固有的动态分发机制去启动正确的动作。\n\
  \n使用多态方法或接口实现的代码比使用多个类型检查的代码要易于维护和扩展。\n\n### 7. 不要过度使用反射。\n\n反射机制允许你通过运行时检测字段和方法来编写具有惊人通用性的程序。这种能力对于系统级编程非常有用，但在应用程序中通常是不合适的。反射是脆弱的——通过它，编译器无法帮助你发现编程错误。任何错误都会在运行时发现并导致异常。\n\
  \n你现在已经看到了 Java 如何支持面向对象编程的基础知识：类、继承和多态。在下一章中，我们将处理两个对于有效使用 Java 至关重要的高级主题：接口和内部类。\n\
  \n# 第 6 章 接口与内部类\n\n* * *\n\n本章内容\n- 接口\n- 对象克隆\n- 接口与回调\n- 内部类\n- 代理\n* * *\n\n\
  你现在已经看到了 Java 中面向对象编程的所有基本工具。本章向你展示了几个常用的高级技术。尽管它们的特性不那么明显，但你仍然需要掌握它们来完善你的 Java\
  \ 工具箱。\n\n第一种技术称为*接口*，它是一种描述类应该*做什么*的方法，而不指指定它们应该*如何*做。一个类可以*实现*一个或多个接口。然后，每当需要符合接口时，你就可以使用这些实现类的对象。在涵盖接口之后，我们将讨论对象的克隆（有时称为深拷贝）。对象的克隆是一个与原始具有相同状态的新对象。特别是，你可以修改克隆对象而不影响原始对象。\n\
  \n接下来，我们转向*内部类*的机制。内部类在技术上有些复杂——它们被定义在其他类内部，并且其方法可以访问外部类的字段。当你设计一组协作的类时，内部类非常有用。特别是，内部类允许你编写简洁、看起来专业的代码来处理\
  \ GUI 事件。\n\n本章以对*代理*的讨论结束，代理是实现任意接口的对象。代理是一种非常特殊的构造，，用于构建系统级工具。第一次阅读时，你可以安全地跳过该部分。\n\
  \n### 6.1. 接口\n\n在 Java 语言中，接口不是一个类，而是对想要符合接口的类的一系列*要求*。\n\n通常，某些服务的提供者会声明：“如果你的类符合特定的接口，那么我就执行该服务。”让我们来看一个具体的例子。`Arrays`\
  \ 类的 `sort` 方法承诺对对象数组排序，但有一个条件：对象必须属于实现了 `Comparable` 接口的类。\n\n以下是 `Comparable`\
  \ 接口的样子：\n\n```\npublic interface Comparable\n{\n   int compareTo(Object other);\n\
  }\n```\n\n这意味着任何实现 `Comparable` 接口的类都被要求有一个 `compareTo` 方法，并且该方法必须接受一个 `Object`\
  \ 参数并返回一个整数。\n\n* * *\n\n注意：从 Java 5.0 开始，`Comparable` 接口被增强为泛型。\n\n```\npublic\
  \ interface Comparable<T>\n{\n   int compareTo(T other); // 参数类型为 T\n}\n```\n\n\
  例如，实现 `Comparable<Employee>` 的类必须提供方法\n\n`int compareTo(Employee other)`\n\n你仍然可以使用没有类型参数的“原始”\
  \ `Comparable` 类型，但你必须手动将 `compareTo` 方法的参数强制转换为所需的类型。\n\n* * *\n\n接口的所有方法都自动是 `public`\
  \ 的。因此，在接口中声明方法时，没有必要提供 `public` 关键字。\n\n当然，还有一个接口无法说明的额外要求：当调用 `x.compareTo(y)`\
  \ 时，`compareTo` 方法必须实际上能够*比较*这两个对象，并返回关于 `x` 或 `y` 较大的指示。该方法应该在 `x` 小于 `y` 时返回负数，在它们相等时返回零，否则返回正数。\n\
  \n\n\n这个特定的接口只有一个方法。有些接口有多个方法。正如你稍后看到的，接口还可以定义常量。然而，更重要的是接口*不能*提供的内容。接口永远不会有实例字段，方法也绝不会在接口中实现。提供实例字段和方法实现是实现接口的类的职责。你可以将接口认为类似于一个没有实例字段的抽象类。然而，这两个概念之间存在一些差异——我们稍后会详细讨论它们。\n\
  \n现在，假设我们想使用 `Arrays` 类的 `sort` 方法对 `Employee` 对象的数组进行排序。那么 `Employee` 类必须 `implement`（实现）`Comparable`\
  \ 接口。\n\n要让一个类实现接口，你需要执行两个步骤：\n\n1.  声明你的类意图要实现给定的接口。\n2.  为接口中的所有方法提供定义。\n\n要声明一个类实现一个接口，请使用\
  \ `implements` 关键字：\n\n```java\nclass Employee implements Comparable\n```\n\n当然，现在\
  \ `Employee` 类需要提供 `compareTo` 方法。让我们假设想按薪资比较员工。以下是 `compareTo` 方法的实现：\n\n```java\n\
  public int compareTo(Object otherObject)\n{\n    Employee other = (Employee) otherObject;\n\
  \    return Double.compare(salary, other.salary);\n}\n```\n\n在这里，我们使用了静态方法 `Double.compare`，如果第一个参数小于第二个参数，它返回负数；如果它们相等，返回\
  \ `0`；否则返回正值。\n\n***\n\n![Image](img/image0095.jpeg) 注意\n\n在接口声明中，`compareTo` 方法没有声明为\
  \ `public`，因为*接口*中的所有方法自动都是公共的。然而，在实现接口时，你必须将方法声明为 `public`。否则，编译器会假设该方法具有包级可见性——这是\
  \ `class` 的默认权限。编译器随后会抱怨你正尝试提供更弱的访问权限。\n\n***\n\n从 Java SE 5.0 开始，我们可以做得更好。我们将改为实现\
  \ `Comparable<Employee>` 接口类型。\n\n```java\nclass Employee implements Comparable<Employee>\n\
  {\n    public int compareTo(Employee other)\n    {\n        return Double.compare(salary,\
  \ other.salary);\n    }\n    . .\n}\n```\n\n注意，那个难看的 `Object` 参数强制转换消失了。\n\n***\n\
  \n![Image](img/image00949.jpeg) 提示\n\n`Comparable` 接口的 `compareTo` 方法返回一个整数。如果对象不相等，返回什么负值或正值并不紧要。这种灵活性在比较整数字段时非常有用。例如，假设每个员工都有一个唯一的整数\
  \ `id`，你想按员工 ID 号进行排序。那么你可以简单地返回 `id - other.id`。如果第一个 ID 小于另一个，该值将是一个负值；如果 ID 相同，则为\
  \ `0`；否则为某个正值。然而，有一个限制：整数的范围必须足够小，使得减法不会溢出。如果你知道 ID 不是负数，或者它们的绝对值最多为 `(Integer.MAX_VALUE\
  \ - 1) / 2`，那么就是安全的。\n\n当然，减法技巧不适用于浮点数。如果薪资接近但并不相同，差值 `salary - other.salary` 可能会舍入为\
  \ `0`。`Double.compare(x, y)` 调用仅在 `x < y` 时返回 `-1`，在 `x > y` 时返回 `1`。\n\n***\n\n\
  现在你看到了一个类为了利用排序服务必须做什么——它必须实现一个 `compareTo` 方法。这是完全合理的。`sort` 方法需要某种方式来比较对象。但为什么\
  \ `Employee` 类不能在不实现 `Comparable` 接口的情况下提供 `compareTo` 方法呢？\n\n接口的存在是因为 Java 编程语言是*强类型*的。在进行方法调用时，编译器需要能够检查该方法是否存在。在\
  \ `sort` 方法的某处会有这样的语句：\n\n```java\nif (a[i].compareTo(a[j]) > 0)\n{\n    // rearrange\
  \ a[i] and a[j]\n    . .\n}\n```\n\n编译器必须知道 `a[i]` 确实有一个 `compareTo` 方法。如果 `a` 是\
  \ `Comparable` 对象的数组，那么该方法的存在是有保证的，因为每个实现 `Comparable` 接口的类必须提供该方法。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n你可能认为 `Arrays` 类中的 `sort` 方法定义为接收 `Comparable[]` 数组，这样如果有人用一个元素类型没有实现 `Comparable`\
  \ 接口的数组调用 `sort`，编译器就会报错。遗憾的是，事实并非如此。相反，`sort` 方法接收一个 `Object[]` 数组并使用笨拙的转换：\n\n\
  ```java\n// 标准库中的方法\nif (((Comparable) a[i]).compareTo(a[j]) > 0)\n{\n    // rearrange\
  \ a[i] and a[j]\n    . .\n}\n```\n\n如果 `a[i]` 不属于实现 `Comparable` 接口的类，虚拟机将抛出异常。\n\
  \n`6.1` 展示了对 `Employee` 类实例数组进行排序的完整代码（见 `6.2`）。\n\n### 列表 6.1 interfaces/EmployeeTest.java\n\
  \n```java\npackage interfaces;\n\nimport java.util.*;\n\n/**\n * 此程序演示了 Comparable\
  \ 接口的使用。\n * @version 1.3 2004-02-27\n * @author Caymann\n */\npublic class EmployeeTest\n\
  {\n    public static void main(String[] args)\n    {\n        Employee[] staff =\
  \ new Employee[3];\n        staff[0] = new Employee(\"Harry Hacker\", 35000);\n\
  \        staff[1] = new Employee(\"Carl Cracker\", 75000);\n        staff[2] = new\
  \ Employee(\"Tony Tester\", 38000);\n\n        Arrays.sort(staff);\n\n        //\
  \ 打印所有的 Employee 对象\n        for (Employee e : staff)\n            System.out.println(\"\
  name=\" + e.getName() + \",salary=\" + e.getSalary());\n    }\n}\n```\n\n### 列表\
  \ 6.2 interfaces/Employee.java\n\n```java\npackage interfaces;\n\npublic class Employee\
  \ implements Comparable<Employee>\n{\n    private String name;\n    private double\
  \ salary;\n\n    public Employee(String n, double s)\n    {\n        name = n;\n\
  \        salary = s;\n    }\n\n    public String getName()\n    {\n        return\
  \ name;\n    }\n\n    public double getSalary()\n    {\n        return salary;\n\
  \    }\n\n    public void raiseSalary(double byPercent)\n    {\n        double raise\
  \ = salary * byPercent / 100;\n        salary += raise;\n    }\n\n    /**\n    \
  \ * 按薪资比较员工\n     * @param other 另一个 Employee 对象\n     * @return 如果此员工的薪资低于 otherObject，则返回负数；如果薪资相同则返回\
  \ 0；否则返回正值\n     */\n    public int compareTo(Employee other)\n    {\n        return\
  \ Double.compare(salary, other.salary);\n    }\n}\n```\n\n\n\n使用经过调优 `mergesort`\
  \ 算法对数组 `a` 中的元素进行排序。数组中的所有元素必须属于实现了 `Comparable` 接口的类，并且它们必须相互可比较。\n\n`java.lang.Integer`\
  \ 7\n\n• `static int compare(int x, int y)`\n\n如果 `x < y`，返回负整数；如果 `x` 和 `y` 相，返回零；否则返回正整数。\n\
  \n`java.lang.Double` 7\n\n• `static int compare(double x, double y)`\n\n如果 `x <\
  \ y`，返回负整数；如果 `x` 和 `y` 相，返回零；否则返回正整数。\n\n![Image](img/image00948.jpeg) 注意\n\n根据语言标准：“实现者必须确保对于所有的\
  \ `x` 和 `y`，`sgn(x.compareTo(y)) = -sgn(y.compareTo(x))`。（这意味着如果 `y.compareTo(x)`\
  \ 抛出异常，则 `x.compareTo(y)` 也必须抛出异常。）在这里，`sgn` 是数字的符号：如果 `n` 为负，则 `sgn(n)` 为 -1；如果\
  \ `n` 等于 0，则 `sgn(n)` 为 0；如果 `n` 为正，则 `sgn(n)` 为 1。通俗来说，如果你翻转 `compareTo` 的参数，结果的符号（但不一定是实际值）也必须翻转。\n\
  \n与 `equals` 方法一样，当涉及到继承时会出现问题。\n\n由于 `Manager` 继承自 `Employee`，它实现的是 `Comparable<Employee>`\
  \ 而不是 `Comparable<Manager>`。如果 `Manager` 选择重写 `compareTo`，它必须准备好比较经理和员工。它不能简单地将员工强制转换为经理：\n\
  \n```\nclass Manager extends Employee\n{\n    public int compareTo(Employee other)\n\
  \    {\n      Manager otherManager = (Manager) other; // 不能\n      . . .\n    }\n\
  \    . . .\n}\n```\n\n这违反了“反对称性”规则。如果 `x` 是 `Employee` 且 `y` 是 `Manager`，那么调用 `x.compareTo(y)`\
  \ 不会抛出异常——它只是作为员工身份比较 `x` 和 `y`。但反过来，`y.compareTo(x)` 则会抛出 `ClassCastException`。\n\
  \n这与我们在第五章中讨论过的 `equals` 方法的情况相同，补救措施也是一样的。有两种不同的场景。\n\n如果子类有不同的比较概念，那么你应该禁止对属于不同类的对象进行比较。每个\
  \ `compareTo` 方法应该开始进行测试：\n\n```java\nif (getClass() != other.getClass()) throw\
  \ new ClassCastException();\n```\n\n如果存在一种比较子类对象的通用算法，只需在父类中提供单一的 `compareTo` 方法并将其声明为\
  \ `final` 即可。\n\n例如，假设你希望经理无论薪水如何都高于普通员工。其他子类如 `Executive` 和 `Secretary` 呢？如果你需要建立一个等级，可以在\
  \ `Employee` 类中提供一个如 `rank` 的方法。让每个子类重写 `rank`，并实现一个考虑到 `rank` 值的 `compareTo` 方法。\n\
  \n#### 6.1.1 接口的属性\n\n接口不是类。特别是你永远无法使用 `new` 运算符来实例化接口：\n\n```java\nx = new Comparable(.\
  \ . .); // 错误\n```\n\n然而，尽管你不能构造接口对象，你仍然可以声明接口变量。\n\n```java\nComparable x; // 可以\n\
  ```\n\n接口变量必须引用实现该接口的类的对象：\n\n```java\nx = new Employee(. . .); // 只要 Employee 实现了\
  \ Comparable 即可\n```\n\n接下来，就像你使用 `instanceof` 来检查对象是否属于特定类一样，你也可以使用 `instanceof`\
  \ 来检查对象是否实现了某个接口：\n\n```java\nif (anObject instanceof Comparable) { . . . }\n```\n\
  \n就像你可以构建类的层次结构一样，你也可以扩展接口。这允许存在多个接口链，从更高程度的通用性到更高程度的专门化。例如，假设你有一个名为 `Moveable`\
  \ 的接口。\n\n```java\npublic interface Moveable\n{\n    void move(double x, double\
  \ y);\n}\n```\n\n那么，你可以想象有一个名为 `Powered` 的接口扩展了它：\n\n```java\npublic interface Powered\
  \ extends Moveable\n{\n    double milesPerGallon();\n}\n```\n\n虽然你不能在接口中放置实例字段或静态方法，但你可以在它们中提供常量。例如：\n\
  \n```java\npublic interface Powered extends Moveable\n{\n    double milesPerGallon();\n\
  \    double SPEED_LIMIT = 95; // 一个 public static final 常量\n}\n```\n\n就像接口中的方法自动是\
  \ `public` 一样，字段始终是 `public static final`。\n\n![Image](img/image00948.jpeg) 注意\n\
  \n将接口方法标记为 `public`、字段标记为 `public static final` 是合法的。一些程序员这样做是因为习惯或为了更清晰。然而，Java\
  \ 语言规范建议不要提供冗余关键字，我们也遵循了这一建议。\n\n有些接口只定义常量而不定义方法。例如，标准库包含一个接口 `SwingConstants`，它定义了\
  \ `NORTH`、`SOUTH`、`HORIZONTAL` 等常量。任何选择实现 `SwingConstants` 接口的类都会继承这些常量。它的方法可以直接引用\
  \ `NORTH`，而不是更繁琐的 `SwingConstants.NORTH`。然而，这种对接口的使用相当退化，我们不建议这样做。\n\n虽然每个类只能有一个父类，但类可以实现*多个*接口。这赋予了你定义类行为的最大灵活性。例如，Java\
  \ 语言内置了一个重要的接口，称为 `Cloneable`。（我们将在下一节详细讨论此接口。）如果你的类实现了 `Cloneable`，`Object` 类中的\
  \ `clone` 方法将创建你类的精确拷贝。因此，假设你想具有复制性和可比较性。你只需实现这两个接口即可。\n\n```java\nclass Employee\
  \ implements Cloneable, Comparable\n```\n\n使用逗号分隔你想提供的接口。\n\n#### 6.1.2 接口与抽象类\n\
  \n如果你阅读了第五章中关于抽象类的章节，你可能会奇怪 Java 语言的设计者为什么要引入接口的概念。为什么 `Comparable` 不能简单地是一个抽象类呢：\n\
  \n```java\nabstract class Comparable // 为什么不能\n{\n    public abstract int compareTo(Object\
  \ other);\n}\n```\n\n那么 `Employee` 类只需扩展这个抽象类并提供 `compareTo` 方法：\n\n```java\nclass\
  \ Employee extends Comparable // 为什么不能\n{\n    public int compareTo(Object other)\
  \ { . . . }\n}\n```\n\n遗憾的是，使用抽象基类来表达通用属性有一个主要问题。类只能扩展一个类。假设 `Employee` 类已经扩展了另一个类，比如\
  \ `Person`。那么它就不能扩展第二个类了。\n\n```java\nclass Employee extends Person, Comparable\
  \ // 错误\n```\n\n但每个类可以实现任意多个接口：\n\n```java\nclass Employee extends Person implements\
  \ Comparable // 可以\n```\n\n其他编程语言，特别是 C++，允许一个类拥有多个父类。这种特性被称为*多重继承*。Java 的设计者选择不支持多重继承，因为它会让语言变得非常复杂（如\
  \ C++）或者效率较低（如 Eiffel）。\n\n相反，接口在获得多重继承的大部分处处的同时，规避了复杂性和低效。\n\n![Image](img/image00951.jpeg)\
  \ C++ 注意\n\n\n\n\n\nC++ 支持多重继承以及随之而来的所有复杂性，例如虚基类、支配规则和横向指针转换。很少有 C++ 程序员使用多重继承，有些人认为永远不应该使用它。其他程序员建议仅将“混入”（mix-in）风格的继承中使用重继承。在混入风格中，主基类描述父对象，而额外的基类（所谓的混入类）可以提供辅助特性。这种风格类似于具有单个基类和若干额外接口的\
  \ Java 类。然而，在 C++ 中，混入类可以添加默认行为，而 Java 接口则不能。\n\n## 6.2. 对象克隆\n\n当你对一个变量进行复制时，原始变量和拷贝都是指向同一个对象的引用（参见图\
  \ 6.1）。这意味着对其中一个变量的修改也会影响另一个变量。\n\n点击此处查看代码图片\n\n```java\nEmployee original = new\
  \ Employee(\"John Public\", 50000);\n\nEmployee copy = original;\n\ncopy.raiseSalary(10);\
  \ // 哦——也改变了原始对象\n```\n\n![Image](img/image0103.jpeg)\n\n图 6.1. 复制与克隆\n\n如果你希望 `copy`\
  \ 是一个新对象，其初始状态与 `original` 相同，但状态可以随时间推移产生差异，请使用 `clone` 方法。\n\n点击此处查看代码图片\n\n```java\n\
  Employee copy = original.clone();\n\ncopy.raiseSalary(10); // OK--original 未改变\n\
  ```\n\n但并非那么简单。`clone` 方法是 `Object` 的一个 `protected`（保护）方法，这意味着你的代码不能直接调用它。只有 `Employee`\
  \ 类可以克隆 `Employee` 对象。这种限制是有原因的。考虑 `Object` 类是如何实现 `clone` 的：它对对象本身一无所知，因此只能进行逐字段的复制。如果对象中的所有数据字段都是数字或其他基本类型，那么复制字段就足够。但如果对象包含对子对象的引用，那么复制字段只会给你另一个指向相同子对象的引用，因此原始对象和克隆对象仍然共享某些信息。\n\
  \n为了视觉化这一现象，让我们考虑在第 4 章中引入的 `Employee` 类。图 6.2 显示了当使用 `Object` 类的 `clone` 方法克隆此类\
  \ `Employee` 对象时发生了什么。如你所见，默认的克隆操作是“浅”的——它不会克隆被其他对象引用的对象。\n\n![Image](img/image01031.jpeg)\n\
  \n图 6.2. 浅拷贝\n\n浅拷贝是否重要？这取决于情况。如果原始对象和浅克隆之间共享的子对象是*不可变的*immutable），那么这种共享就是安全的。如果子对象属于一个不可变类（如\
  \ `String`），这种情况确实会发生。或者，子对象在对象的整个生命周期内始终保持不变，没有修改器触碰它，也没有方法返回它的引用。\n\n然而，子对象通常是可变的，你必须重新定义\
  \ `clone` 方法以实现“深拷贝”（deep copy），同时也克隆子对象。在我们的示例中，`hireDay` 字段是一个 `Date` 类型，它是可变的。\n\
  \n对于每个类，你都需要决定：\n\n1. 默认的 `clone` 方法是否足够；\n2. 能否通过调用可变子对象的 `clone` 方法来修复默认的 `clone`\
  \ 方法；以及\n3. 是否应该尝试 `clone`。\n\n第三种选项实际上是默认选项。要选择第一种或第二种选项，该类必须：\n\n1. 实现 `Cloneable`\
  \ 接口；并且\n2. 使用 `public`（公有）访问修饰符重定义 `clone` 方法。\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n`clone` 方法在 `Object` 类中被声明为 `protected`，因此你的代码不能直接调用 `anObject.clone()`。但\
  \ `protected` 方法不是可以在任何子类中访问吗？而且每个类不都是 `Object` 的子类吗？幸运的是，保护访问的规则要微妙得多（参见第 5 章）。子类只能调用受保护的\
  \ `clone` 方法来克隆*自己的*对象。你必须将 `clone` 重新定义为 `public`，以便允许任何方法来克隆对象。\n\n在这种情况下，`Cloneable`\
  \ 接口的出现与接口的通常用法没有关系。特别是，它*并没有*指定 `clone` 方法——该方法是从 `Object` 类继承的。该接口仅充当一个标记，表示类设计者理解克隆过程。对象对克隆非常偏执，以至于如果一个对象请求克隆但没有实现该接口，它们就会抛出一个检查异常（checked\
  \ exception）。\n\n![Image](img/image00948.jpeg) 注意\n\n### 标记接口与标记接口\n\n`Cloneable`\
  \ 接口是 Java 提供的少数“标记接口”（tagging interfaces）之一。（有些程序员称之为“标记接口”marker interfaces）。记得像如\
  \ `Comparable` 之类的接口的通常用途是确保类实现特定的方法集。标记接口没有方法；其唯一目的是允许 `instanceof` 的使用。\n\n即使默认（浅拷贝）`clone`\
  \ 实现已经足够，你仍然需要实现 `Cloneable` 接口，将 `clone` 重新定义为 `public` 并调用 `super.clone()`。这里有一个示例：\n\
  \n点击此处查看代码图片\n\n```java\nclass Employee implements Cloneable\n{\n    // . .\n  \
  \  public Employee clone() throws CloneSupportedException\n    {\n        // 访问级别改为\
  \ public\n        return (Employee) super.clone();\n    }\n}\n```\n\n你刚刚看到的 `clone`\
  \ 方法没有为 `Object` 添加任何功能。它只是让方法变为公共。为了实现深拷贝，你需要更加努力并克隆可变字段。这里有一个创建深拷贝的 `clone` 方法示例：\n\
  \n点击此处查看代码图片\n\n```java\nclass Employee implements Cloneable\n{\n    // . .\n  \
  \  public Employee clone() throws CloneSupportedException\n    {\n        // 调用\
  \ Object.clone()\n        Employee cloned = (Employee) super.clone();\n        //\
  \ 克隆可变字段\n        cloned.hireDay = (Date) hireDay.clone();\n        return cloned;\n\
  \    }\n}\n```\n\n`Object` 类的 `clone` 方法威胁要抛出 `CloneNotSupportedException`——每当在未实现\
  \ `Cloneable` 接口的对象上调用 `clone` 时。当然，`Employee` 和 `Date` 类实现了 `Cloneable` 接口，因此不会抛出异常。然而，编译器并不知道。因此，声明了异常：\n\
  \n`public Employee clone() throws CloneSupportedException`\n\n捕获异常是否会更好？\n\n点击此处查看代码图片\n\
  \n```java\npublic Employee clone()\n{\n    try\n    {\n        return (Employee)\
  \ super.clone();\n    }\n    catch (CloneNotSupportedException e) { return null;\
  \ }\n    // 这不会发生，因为我们实现了 Cloneable\n}\n```\n\n这对于 `final` 类是合适的。否则，保留 `throws`\
  \ 规格符是一个好主意。这给了子类一个在无法支持克隆时抛出 `CloneNotSupportedException` 的选择。\n\n\n\n\n你必须小心子类的克隆。例如，一旦你为\
  \ `Employee` 类定义了 `clone` 方法，任何人都可以用它来克隆 `Manager` 对象。`Employee` 的 `clone` 方法能胜任吗？这取决于\
  \ `Manager` 类的字段。在我们的案例中，没有这个问题，因为 `bonus` 字段是原始类型。但 `Manager` 可能获取了某些需要深拷贝或不可克隆的字段。无法保证子类的实现者已经修复了\
  \ `clone` 方法以执行正确的操作。正因如此，`clone` 方法在 `Object` 类中被声明为 `protected`。但如果你希望你类的用户能够调用\
  \ `clone`，你就不再拥有这种“待遇”了。\n\n你是否应该在自己的类中实现 `clone` 呢？如果你的客户端需要进行深拷贝，那么你可能应该这样做。有些作者认为，你应该完全避免使用\
  \ `clone`，而是实现另一个方法来实现相同的目的。我们同意 `clone` 确实相当笨拙，但如果你将责任转移到另一个方法，你仍然会遇到相同的问题。无论如何，克隆并没有你想象的那么常见。标准库中只有不到\
  \ 5% 的类实现了 `clone`。\n\nListing 6.3 中的程序克隆了 `Employee` 类的实例（Listing 6.4），然后调用了两个修改器方法。`raiseSalary`\
  \ 方法改变了 `salary` 字段的值，而 `setHireDay` 方法改变了 `hireDay` 字段的状态。这两个变动都不会影响原始对象，因为 `clone`\
  \ 被定义为执行深拷贝。\n\nListing 6.3. clone/CloneTest.java\n\n点击此处查看代码图像\n\n```java\npackage\
  \ clone;\n\n/**\n * 此程序演示了克隆\n * @version 1.10 2002-07-01\n * @author Cay Horstmann\n\
  \ */\npublic class CloneTest\n{\n    public static void main(String[] args)\n  \
  \  {\n        try\n        {\n            Employee original = new Employee(\"John\
  \ Q. Public\", 50000);\n            original.setHireDay(2000, 1, 1);\n         \
  \   Employee copy = original.clone();\n            copy.raiseSalary(10);\n     \
  \       copy.setHireDay(2002, 12, 31);\n            System.out.println(\"original=\"\
  \ + original);\n            System.out.println(\"copy=\" + copy);\n        }\n \
  \       catch (CloneNotSupportedException e)\n        {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\nListing 6.4. clone/Employee.java\n点击此处查看代码图像\n\n```java\n\
  package clone;\n\nimport java.util.Date;\nimport java.util.GregorianCalendar;\n\
  public class Employee implements Cloneable\n{\n    private String name;\n    private\
  \ double salary;\n    private Date hireDay;\n\n    public Employee(String n, double\
  \ s)\n    {\n        name = n;\n        salary = s;\n        hireDay = new Date();\n\
  \    }\n\n    public Employee clone() throws CloneSupportedException\n    {\n  \
  \      // call Object.clone()\n        Employee cloned = (Employee) super.clone();\n\
  \        // clone 可变字段\n        cloned.hireDay = (Date) hireDay.clone();\n     \
  \   return cloned;\n    }\n\n    /**\n     * 将入职日期设置为指定的日期。\n     * @param year\
  \ 入职日的年份\n     * @param month 入职日的月份\n     * @param day 入职日的日期\n     */\n    public\
  \ void setHireDay(int year, int month, int day)\n    {\n        Date newHireDay\
  \ = new GregorianCalendar(year, month - 1, day).getTime();\n        // 实例变动的示例\n\
  \        hireDay.setTime(newHireDay.getTime());\n    }\n\n    public void raiseSalary(double\
  \ byPercent)\n    {\n        double raise = salary * byPercent / 100;\n        salary\
  \ += raise;\n    }\n\n    public String toString()\n    {\n        return \"Employee[name=\"\
  \ + name + \",salary=\" + salary + \",hireDay=\" + hireDay + \"]\";\n    }\n}\n\
  ```\n\n所有数组类型都有一个 `public` 的 `clone` 方法，而不是 `protected`。你可以使用它来创建一个包含所有元素拷贝的新数组。例如：\n\
  \n```java\nint[] luckyNumbers = { 2, 3, 5, 7, 11, 13 };\nint[] cloned = luckyNumbers.clone();\n\
  cloned[5] = 12; // 不改变 luckyNumbers[5]\n```\n\n第二卷第 1 章展示了克隆对象的另一种机制，即使用 Java 的对象序列化功能。该机制实现简单且安全，但效率不高。\n\
  \n### 6.3 接口与回调\n\n编程中的一种常见模式是*回调*（callback）模式。在这种模式中，你希望在当特定事件发生时指定应该执行的操作。例如，你可能希望在点击按钮或选择菜单项时执行某个操作。然而，由于你还没有看到过如何实现用户界面，我们将考虑一个类似但更简单的情况。\n\
  \n`javax.swing` 包包含一个 `Timer` 类，如果你希望在每个时间间隔结束时收到通知，它是非常有用的。例如，如果程序的某个部分有一个时钟，你可以请求每秒通知一次以更新时钟界面。\n\
  \n当你构造定时器时，设置时间间隔并告诉它在每当时间间隔到期时应该做什么。\n\n如何告诉定时器它应该做什么？在许多编程语言中，你提供一个要调用的函数名称。然而，Java\
  \ 标准库采用了面向对象的方法。你传递某个类的对象。定时器随后调用该对象的方法。传递对象比传递函数更灵活，因为对象可以携带额外信息。\n\n当然，定时器需要知道调用哪个方法。定时器要求指定一个实现了\
  \ `java.awt.event` 包中 `ActionListener` 接口的对象。该接口如下：\n\n```java\npublic interface\
  \ ActionListener\n{\n    void actionPerformed(ActionEvent event);\n}\n```\n\n当时间间隔过期时，定时器调用\
  \ `actionPerformed` 方法。\n\n正如你在第五章看到的，Java 确实有函数指针的等物，即 `Method` 对象。但是它们难以使用、速度慢，且无法在编译时进行类型安全检查。每当你在\
  \ C++ 中使用函数指针时，在 Java 中应该考虑使用接口。\n\n假设你想每 10 秒打印一次消息“时间到了，现在是 . . ”，并听到蜂鸣。你需要定义一个实现\
  \ `ActionListener` 接口的类。然后将你想要执行的任何语句放在 `actionPerformed` 方法中。\n\n```java\nclass\
  \ TimePrinter implements ActionListener\n{\n    public void actionPerformed(ActionEvent\
  \ event)\n    {\n        Date now = new Date();\n        System.out.println(\"At\
  \ the tone, the time is \" + now);\n        Toolkit.getDefaultToolkit().beep();\n\
  \    }\n}\n```\n\n注意 `actionPerformed` 方法的 `ActionEvent` 参数。该参数提供了事件的信息，例如产生事件的源对象——更多信息请参见第\
  \ 8 章。然而，事件的详细信息并不重要，你可以安全地忽略该参数。\n\n接下来，构造该类的对象并将其传递给 `Timer` 构造函数。\n\n\n\n\n```java\n\
  ActionListener listener = new TimePrinter();\n\nTimer t = new Timer(10000, listener);\n\
  ```\n\n`Timer` 构造函数的第一个参数是两次通知之间必须经过的时间间隔，单位为毫秒。我们希望每 10 秒被通知一次。第二个参数是监听器对象。\n\n\
  最后，你启动了计时器。\n\n```java\nt.start();\n```\n\n每隔 10 秒，会显示如下消息：\n\nAt the tone, the\
  \ time is Thu Apr 13 23:29:08 PDT 2000\n\n随后会听到“哔”的一。\n\nListing 6.5 让计时器及其动作监听器工作。计时器启动后，程序会弹出一个消息对话框，并等待用户点击\
  \ Ok 按钮停止。在程序等待用户期间，当前时间会每隔 10 秒显示一次。\n\n运行程序时请保持耐心。“Quit program?”对话框会立即出现，但第一条计时器消息要在\
  \ 10 秒后才会显示。\n\n注意，程序除了通过名称导入了 `javax.swing.Timer` 类外，还导入了 `javax.swing.*` 和 `java.util.*`。这消除了\
  \ `javax.swing.Timer` 与 `java.util.Timer` 之间的歧，后者是一个用于调度后台任务的无关类。\n\nListing 6.5.\
  \ timer/TimerTest.java\n\n点击此处查看代码图像\n\n```java\n1  package timer;\n2  /**\n3  \
  \  @version 1.00 2000-04-13\n4    @author Cay Horstmann\n5    */\n6\n7  import java.awt.*;\n\
  8  import java.awt.event.*;\n9  import java.util.*;\n10 import javax.swing.*;\n\
  11 import javax.swing.Timer;\n12 // 为了解决与 java.util.Timer 的冲突\n13\n14 public class\
  \ TimerTest\n15  {\n16      public static void main(String[] args)\n17      {\n\
  18          ActionListener listener = new TimePrinter();\n19\n20          // 构建一个每\
  \ 10 秒调用一次监听器的计时器\n22          Timer t = new Timer(10000, listener);\n23       \
  \   t.start();\n24\n25          JOptionPane.showMessageDialog(null, \"Quit program?\"\
  );\n26          System.exit(0);\n27      }\n28  }\n29\n30 class TimePrinter implements\
  \ ActionListener\n31  {\n32      public void actionPerformed(ActionEvent event)\n\
  33      {\n34          Date now = new Date();\n35          System.out.println(\"\
  At the tone, the time is \" + now);\n36          Toolkit.getDefaultToolkit().beep();\n\
  37      }\n38  }\n```\n\n### javax.swing.JOptionPane **1.2**\n\n- `static void showMessageDialog(Component\
  \ parent, Object message)` 显示一个带有消息提示和“确定（Ok）”按钮的对对话框。该对话框居于 `parent` 组件正上方。如果 `parent`\
  \ 为 `null`，则对话框居于屏幕中心。\n\n### javax.swing.Timer **1.2**\n\n- `Timer(int interval,\
  \ ActionListener listener)` 构建一个计时器，每当经过 `interval` 毫秒时，它就会通知 `listener`。\n- `void\
  \ start()` 启动计时器。一旦启动，计时器就会调用其监听器的 `actionPerformed` 方法。\n- `void stop()` 停止计时器。一旦停止，计时器不再调用其监听器的\
  \ `actionPerformed` 方法。\n\n### java.awt.Toolkit **1.0**\n\n- `static Toolkit getDefaultToolkit()`\
  \ 获取默认工具包。工具包包含有关 GUI 环境的信息。\n- `void beep()` 发出“哔”声。\n\n### 6.4 内部类\n\n*内部类*（inner\
  \ class）是定义在另一个类内部的类。为什么要这样做呢？有三个原因：\n\n- 内部类方法可以访问其定义所在作用域内的数据——包括那些本应是私有的（private）的数据。\n\
  - 内部类可以对同一包中的其他类隐藏起来。\n- 当你希望在不编写大量代码的情况下定义回调函数时，*匿名*（anonymous）内部类非常方便。\n\n我们将把这个复杂的话题拆分成几个步骤：\n\
  \n1. 从第 307 页 开始，你将看到一个访问其外层类实例字段简单内部类。\n2. 在第 311 页，我们涵盖了内部类的特殊语法。\n3. 从第 312 页开始，我们将探究内部类的内部，看看它们是如何被转换成普通类的。胆胃较弱的读者可能想跳过该部分。\n\
  4. 从第 315 页开始，我们讨论了*局部内部类*（local inner classes），它可以访问闭包作用域的局部变量。\n5. 从第 318 页开始，我们引入了*匿名内部类*（anonymous\
  \ inner classes），并展示了它们如何被用于实现回调。\n6. 最后，从第 322 页开始，你将看到如何将*静态内部类*（static inner\
  \ classes）用于辅助类。\n\n![Image](img/image0951.jpeg) C++ 有*嵌套类*（nested classes）。嵌套类包含在外层类的作用域内。这里有一个典型的例子：一个链表定义了一个用于持有链接的类，以及一个用于定义迭代器的类。\n\
  \n点击此处查看代码图像\n\n```cpp\nclass LinkedList\n{\npublic:\n    class Iterator // 一个嵌套类\n\
  \    {\n        public:\n            void insert(int x);\n            int erase();\n\
  \            ...\n    };\n    ...\nprivate:\n    class Link // 一个嵌套类\n    {\n  \
  \      public:\n            Link* next;\n            int data;\n    };\n    ...\n\
  };\n```\n\n嵌套是*类*（classes）之间而非*对象*（objects）之间的关系。`LinkedList` 对象*并不*拥有 `Iterator`\
  \ 或 `Link` 类型的子对象。有两个好处：*命名控制*和*访问控制*。`Iterator` 的名称嵌套在 `LinkedList` 类内部，因此在外部被称为\
  \ `LinkedList::Iterator`，并且不会与另一个名为 `Iterator` 的类冲突。在 Java 中，这种优势没有那么重要，因为 Java*包*（packages）提供了这种支持。\n\
  \n\n\n\n\n```java\nDate now = new Date();\n\nSystem.out.println(\"At the tone, the\
  \ time is \" + now);\n\nif (beep) Toolkit.getDefaultToolkit().beep();\n}\n}\n```\n\
  \n发生了一些令人惊讶的事情。`TimePrinter` 类没有名为 `beep` 的实例字段或变量。相反，`beep` 指的是创建该 `TimePrinter`\
  \ 的 `TalkingClock` 对象的字段。这是非常创新的做法。传统上，方法可以引用调用方法的对象的数据字段。而内部类方法既可以访问自己的数据字段，也可以访问创建它的外部对象的数据字段。\n\
  \n为了实现这一功能，内部类对象总是获得指向创建它的对象的隐式引用。（参见图 6.3）。）\n\n![Image](img/image01032.jpeg)\n\
  \n图 6.3. 内部类对象拥有对外部类对象的引用\n\n该引用在内部类的定义中是不可见的。然而，为了阐明这一概念，我们将对外部对象的引用命名为 `outer`。那么，`actionPerformed`\
  \ 方法等同于以下代码：\n\n点击查看代码图像\n\n```java\npublic void actionPerformed(ActionEvent event)\n\
  {\n    Date now = new Date();\n    System.out.println(\"At the tone, the time is\
  \ \" + now);\n    if (outer.beep) Toolkit.getDefaultToolkit().beep();\n}\n```\n\n\
  外部类引用是在构造函数中设置的。编译器会修改所有内部类的构造函数，添加一个外部类引用的参数。`TimePrinter` 类没有定义构造函数；因此，编译器会合成一个无参数构造函数，生成如下代码：\n\
  \n点击查看代码图像\n\n```java\npublic TimePrinter(TalkingClock clock) // 自动生成的代码\n{\n  \
  \  outer = clock;\n}\n```\n\n再次注意，`outer` 并不是 Java 关键字。我们只是用它来说明内部类涉及的机制。\n\n在 `start`\
  \ 方法中构造 `TimePrinter` 对象时，编译器会将当前计时钟的 `this` 引用传递给构造函数：\n\n```java\nActionListener\
  \ listener = new TimePrinter(this); // 自动添加参数\n```\n\n列表 6.6 显示了测试内部类的完整程序。再次查看一下访问控制。如果\
  \ `TimePrinter` 类是一个普通类，它将需要通过 `TalkingClock` 类的公共方法来访问 `beep` 标志位。使用内部类是一种改进。没有需要提供仅对另一个类感兴趣的访问器。\n\
  \n***\n\n![Image](img/image00948.jpeg) 备注\n\n我们可以将 `TimePrinter` 类声明为 `private`。这样，只有\
  \ `TalkingClock` 方法能够构造 `TimePrinter` 对象。只有内部类可以是私有的。普通类总是具有包级或公有的可见性。\n\n***\n\n\
  列表 6.6. `innerClass/InnerClassTest.java`\n\n点击查看代码图像\n\n***\n\n```java\npackage\
  \ innerClass;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.util.*;\n\
  import javax.swing.*;\nimport javax.swing.Timer;\n\n/**\n * 此程序演示了内部类的用法。\n * @version\
  \ 1.10 2004-02-27\n * @author Cay Horstmann\n */\npublic class InnerClassTest\n\
  {\n    public static void main(String[] args)\n    {\n        TalkingClock clock\
  \ = new TalkingClock(1000, true);\n        clock.start();\n\n        // 保持程序运行直到用户选择“确定”\n\
  \        JOptionPane.showMessageDialog(null, \"Quit program?\");\n        System.exit(0);\n\
  \    }\n}\n\n/**\n * 按固定间隔打印时间的闹钟。\n */\nclass TalkingClock\n{\n    private int\
  \ interval;\n    private boolean beep;\n\n    /**\n     * 构造一个闹钟\n     * @param\
  \ interval 消息之间的间隔（毫秒）\n     * @param beep 如果闹钟应该鸣响则设为 true\n     */\n    public\
  \ TalkingClock(int interval, boolean beep)\n    {\n        this.interval = interval;\n\
  \        this.beep = beep;\n    }\n\n    /**\n     * 启动闹钟。\n     */\n    public\
  \ void start()\n    {\n        ActionListener listener = new TimePrinter(this);\
  \ // 自动添加参数\n        Timer t = new Timer(interval, listener);\n        t.start();\n\
  \    }\n}\n\nclass TimePrinter implements ActionListener\n{\n    private TalkingClock\
  \ outer;\n\n    public TimePrinter(TalkingClock clock)\n    {\n        outer = clock;\n\
  \    }\n\n    public void actionPerformed(ActionEvent event)\n    {\n        Date\
  \ now = new Date();\n        System.out.println(\"At the tone, the time is \" +\
  \ now);\n        if (outer.beep) Toolkit.getDefaultToolkit().beep();\n    }\n}\n\
  ```\n\n\n\n\n\n`java reflection.ReflectionTest innerClass.TalkingClock$TimePrinter`\n\
  \n或\n\n`javap -private innerClass.TalkingClock$TimePrinter`\n\n***\n\n你将得到以下输出：\n\
  \n点击此处查看代码图片\n\n```java\npublic class TalkingClock$TimePrinter\n{\n   public TalkingClock$TimePrinter(TalkingClock);\n\
  \   public void actionPerformed(java.awt.event.ActionEvent);\n   final TalkingClock\
  \ this$0;\n}\n```\n\n你可以清楚地看到，编译器为指向外部类的引用生成了一个额外的实例字段 `this$0`。（`this$0` 的名称是编译器自动合成的——你不能在代码中引用它。）你还可以看到构造函数中的\
  \ `TalkingClock` 参数。\n\n如果编译器能够自动完成这种转换，你难道不能简单地手动编写相同的机制吗？让我们试一试。我们将 `TimePrinter`\
  \ 变成一个普通类，放在 `TalkingClock` 类的外部。在构造 `TimePrinter` 对象时，我们将创建它的对象的 `this` 引用传递给它。\n\
  \n点击此处查看代码图片\n\n```java\nclass TalkingClock\n{\n   . . .\n   public void start()\n\
  \   {\n      ActionListener listener = new TimePrinter(this);\n      Timer t = new\
  \ Timer(interval, listener);\n      t.start();\n   }\n}\n\nclass TimePrinter implements\
  \ ActionListener\n{\n   private TalkingClock outer;\n   . . .\n   public TimePrinter(TalkingClock\
  \ clock)\n   {\n      outer = clock;\n   }\n}\n```\n\n现在让我们来看 `actionPerformed`\
  \ 方法。它需要访问 `outer.beep`。\n\n```java\nif (outer.beep) . . . // 错误\n```\n\n在这里我们遇到了问题。内部类可以访问外部类的私有数据，但我们的外部\
  \ `TimePrinter` 类却不能。\n\n因此，内部类确实比普通类更强大，因为它们拥有更多的访问权限。\n\n你可能很好奇，如果内部类被转换成了带有奇怪的普通类，它们是如何获得这些额外访问权限的——虚拟机对它们一无所知。为了解开这个谜团，让我们再次使用\
  \ `ReflectionTest` 程序来监视 `TalkingClock` 类：\n\n点击此处查看代码图片\n\n```java\nclass TalkingClock\n\
  {\n   private int interval;\n   private boolean beep;\n   public TalkingClock(int,\
  \ boolean);\n   static boolean access$0(TalkingClock);\n   public void start();\n\
  }\n```\n\n注意编译器为外部类添加的静态方法 `access$0`。它返回作为参数传递的对象的 `beep` 字段。（方法名可能会略有不同，例如 `access$000`，取决于你的编译器。）\n\
  \n内部类的方法调用了该方法。`TimePrinter` 类 `actionPerformed` 方法中的语句\n\n```java\nif (beep)\n\
  ```\n\n实际上执行了以下调用：\n\n```java\nif (access$0(outer));\n```\n\n这是一种安全风险吗？你可以肯定的。对于其他人来说，调用\
  \ `access$0` 方法来读取私有的 `beep` 字段是很容易的事。当然，`access$0` 并不是 Java 方法的合法名称。然而，熟悉类文件结构的黑客可以轻松生成带有虚拟机指令的类文件来调用该方法，例如通过使用十六进制编辑器。由于这些秘密访问方法具有包可见性（package\
  \ visibility），攻击代码需要放置在与被攻击类相同的包中。\n\n总结一下，如果内部类访问了私有数据字段，那么有可能通过添加到外部类所在包中的其他类来访问该数据字段，但这样做需要技术和决心。程序员无法无意中获得访问权限，必须有意识地构建或修改类文件以达到该目的。\n\
  \n***\n\n![图像](img/image00948.jpeg) 注意\n\n合成的构造函数和方法可能会变得非常复杂。（如果你感到反感，请跳过此注释）。假设我们将\
  \ `TimePrinter` 变成一个私有内部类。虚拟机并没有私有类，因此编译器产生了最好的替代方案：一个具有私有构造函数的包可见类。\n\n```java\n\
  private TalkingClock$TimePrinter(TalkingClock);\n```\n\n当然，没有人可以调用那个构造函数，所以有第二个包可见的构造函数\n\
  \n```java\nTalkingClock$TimePrinter(TalkingClock, TalkingClock$1);\n```\n\n它会调用第一个。\n\
  \n编译器将 `TalkingClock` 类 `start` 方法中的构造函数调用翻译为\n\n```java\nnew TalkingClock$TimePrinter(this,\
  \ null)\n```\n\n***\n\n### 6.4.4. 局部内部类\n\n如果你仔细观察 `TalkingClock` 示例的代码，你会发现你只需要一次类型\
  \ `TimePrinter` 的名称：在你创建它的对象时。在这样的情况下，你可以*局部地*定义该类。\n\n点击此处查看代码图片\n\n```java\npublic\
  \ void start()\n{\n   class TimePrinter implements ActionListener\n   {\n      public\
  \ void actionPerformed(ActionEvent event)\n      {\n         Date now = new Date();\n\
  \         System.out.println(\"At the tone is \" + now);\n         if (beep) Toolkit.getDefaultToolkit().beep();\n\
  \      }\n   }\n   ActionListener listener = new TimePrinter(this);\n   Timer t\
  \ = new Timer(interval, listener);\n   t.start();\n}\n```\n\n局部类受限于它们定义的块。\n\n###\
  \ 6.4.5. 从外部方法访问 final\n\n内部类还有一个优势：它们可以访问外部的字段。然而，那些局部变量必须是 `final`。这里有一个典型的示例：我们将\
  \ `interval` 和 `beep` 参数移动到 `start` 方法。\n\n点击此处查看代码图片\n\n```java\npublic void start(final\
  \ int interval, final boolean beep)\n{\n   class TimePrinter implements ActionListener\n\
  \   {\n      public void actionPerformed(ActionEvent event)\n      {\n         Date\
  \ now = new Date();\n         System.out.println(\"At the tone is \" + now);\n \
  \        if (beep) Toolkit.getDefaultToolkit().beep();\n      }\n   }\n   ActionListener\
  \ listener = new TimePrinter(this);\n   Timer t = new Timer(interval, listener);\n\
  \   t.start();\n}\n```\n\n注意 `TalkingClock` 类不再需要存储 `beep` 实例字段。它只是引用 `start` 方法的\
  \ `beep` 参数变量。\n\n也许这并不意外。语句\n\n```java\nif (beep) . . .\n```\n\n毕竟最终是在 `start`\
  \ 方法内部，所以它为什么不应该访问 `beep` 变量的值呢？为了看到这里存在微妙的问题，让我们更仔细地考虑控制流：\n\n1. 调用 `start` 方法。\n\
  2. 通过调用内部类 `TimePrinter` 的构造函数初始化对象 `listener`。\n3. 将 `listener` 引用传递给 `Timer` 构造函数，启动定时器，`start`\
  \ 方法退出。此时，`start` 方法的 `beep` 参数不存在。\n4. 一秒后，`actionPerformed` 方法执行 `if (beep) .\
  \ . .`\n\n为了让 `actionPerformed` 方法的代码运行，`TimePrinter` 类必须在 `beep` 参数值消失之前，将 `beep`\
  \ 字段复制为 `start` 方法的局部变量。这正是发生的情况。在我们示例中，编译器为局部内部类合成了名称 `TalkingClock$1TimePrinter`。如果你再次使用\
  \ `ReflectionTest` 程序监视 `TalkingClock$1TimePrinter` 类，你将得到以下输出：\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```java\nclass TalkingClock$1TimePrinter\n{\n    TalkingClock$1TimePrinter(TalkingClock,\
  \ boolean);\n    public void actionPerformed(java.awt.event.ActionEvent);\n    final\
  \ boolean val$beep;\n    final TalkingClock this$0;\n}\n```\n\n注意构造函数中的 `boolean`\
  \ 参数和 `val$beep` 实例变量。当创建一个一个对象时，值 `beep` 会被传递给构造函数并存储在 `val$beep` 字段中。编译器会检测对局部变量的访问，并为每个局部变量创建匹配的实例字段，并将局部变量拷贝到构造函数中，这样实例字段就可以被初始化。\n\
  \n从程序员的角度来看，局部变量的访问是非常舒适的。它通过减少你需要显式编写的实例字段，使得你的内部类变得更加简单。\n\n正如我们已经提到的，局部类的方法只能引用声明为\
  \ `final` 的局部变量。出于这个原因，在我们的示例中，`beep` 参数被声明为 `final`。被声明为 `final` 的局部变量在初始化后不能被修改。因此，可以保证局部变量和在局部类内部创建的拷贝始终具有相同的值。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n你已经见过 `final` 用于常量，例如：\n\n```java\n\
  public static final double SPEED_LIMIT = 55;\n```\n\n`final` 关键字可以应用于局部变量、实例变量和静态变量。在所有情况下，它的含义都是相同的：你可以在创建后对其赋值一次。之后，你就不能更改它的值——它是最终的。\n\
  \n然而，在定义 `final` 变量时不需要初始化它。例如，`final` 参数变量 `beep` 在其创建后调用 `start` 方法时初始化一次。（如果该方法被调用多次，每次调用都有自己新创建的\
  \ `beep` 参数。）你在 `TalkingClock$1TimePrinter` 内部类中看到的 `val$beep` 实例变量在内部类构造中设置一次。在定义时未初始化的\
  \ `final` 变量通常被称为*空 final*（*blank final*）变量。\n\n***\n\n`final` 限制有些不方便。例如，假设你想更新封闭作用域中的计数器。在这里，我们想统计排序过程中\
  \ `compareTo` 方法被调用的次数：\n\n点击此处查看代码图像\n\n```java\nint counter = 0;\nDate[] dates\
  \ = new Date[100];\nfor (int i = 0; i < dates.length; i++)\n    dates[i] = new Date()\n\
  \        {\n            public int compareTo(Date other)\n            {\n      \
  \          counter++; // 错误\n                return super.compareTo(other);\n  \
  \          }\n        };\nArrays.sort(dates);\nSystem.out.println(counter + \" comparisons.\"\
  );\n```\n\n你不能将 `counter` 声明为 `final`，因为你显然更新它。你不能用 `Integer` 替换它，因为 `Integer` 对象是不可变的。解决办法是使用一个长度为\
  \ 1 的数组：\n\n点击此处查看代码图像\n\n```java\nfinal int[] counter = new int[1];\nfor (int i\
  \ = 0; i < dates.length; i++)\n    dates[i] = new Date()\n        {\n          \
  \  public int compareTo(Date other)\n            {\n                counter[0]++;\n\
  \                return super.compareTo(other);\n            }\n        };\n```\n\
  \n（数组变量仍然被声明为 `final`，但这仅仅意味着你不能让它引用不同的数组。你可以自由地修改数组元素。）\n\n当内部类首次被发明时，原型编译器会自动对在内部类中被修改的所有局部变量进行这种转换。然而，一些程序员担心编译器会在他们背后擅自生成堆堆对象，因此转而采用了\
  \ `final` 限制。Java 语言的未来版本可能会修正这一决定。\n\n#### 6.4.6 匿名内部类\n\n在使用局部类时，你通常可以更进一步。如果你只想为该类创建一个单一对象，你就不需要给这个类起名。这样的类被称为匿名内部类。\n\
  \n点击此处查看代码图像\n\n```java\npublic void start(int interval, boolean beep)\n{\n    ActionListener\
  \ listener = new ActionListener()\n    {\n        public void actionPerformed(ActionEvent\
  \ event)\n        {\n            Date now = new Date();\n            System.out.println(\"\
  At the tone, the time is \" + now);\n            if (beep) Toolkit.getDefaultToolkit().beep();\n\
  \        }\n    };\n    Timer t = new Timer(interval, listener);\n    t.start();\n\
  }\n```\n\n这种语法非常晦涩。它的意思是：创建一个实现 `ActionListener` 接口的类的类的对象，其中所需的方法 `actionPerformed`\
  \ 是 `{ }` 内部的那个。通常，语法如下：\n\n点击此处查看代码图像\n\n```java\nnew SuperType(construction parameters)\n\
  {\n    内部方法和数据\n}\n```\n\n在这里，`SuperType` 可以是一个接口，例如 `ActionListener`；那么内部类就实现该接口。`SuperType`\
  \ 也可以是一个类；那么内部类就扩展该类。\n\n匿名内部类不能有构造函数，因为构造函数的名称必须与类名相同，而类没有名称。相反，构造参数被传递给父类构造函数。特别是，每当内部类实现接口时，它不能有任何构造参数。尽管如此，你必须提供一组括号，如：\n\
  \n```java\nnew InterfaceType()\n{\n    方法和数据\n}\n```\n\n你必须仔细观察一个类的新对象的构造与一个扩展该类的匿名内部类的构造之间的区别。\n\
  \n点击此处查看代码图像\n\n```java\nPerson queen = new Person(\"Mary\"); // 一个 Person 对象\n\
  Person count = new Person(\"Dracula\") { }; // 类的类的对象\n```\n\n如果构造参数列表的右括号后面跟着大括号，那么正在定义一个匿名内部类。\n\
  \n匿名内部类是一个好主意还是编写晦涩代码的好方法？可能两者兼有。当内部类的代码很短，只有几行简单代码时，匿名内部类可以节省输入时间——但正是这种节省时间的功能带你走向“Java\
  \ 混淆竞赛”的滑坡。\n\n列表 6.7 包含了带有匿名内部类的时钟程序的完整源代码。如果你将此程序与 列表 6.6 进行比较，你会发现在这种情况下，使用匿名内部类的方案要短得多，而且如果经过练习，也更容易理解。\n\
  \n列表 6.7 `anonymousInnerClass/AnonymousInnerClassTest.java`\n\n点击此处查看代码图像\n\n***\n\
  \n```java\npackage anonymousInnerClass;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.util.*;\nimport javax.swing.*;\nimport javax.swing.Timer;\n\n/**\n *\
  \ 此程序演示了匿名内部类。\n * @version 1.10 2004-02-27\n * @author Cay Horstmann\n */\npublic\
  \ class AnonymousInnerClassTest\n{\n    public static void main(String[] args)\n\
  \    {\n        TalkingClock clock = new TalkingClock();\n        clock.start(1000,\
  \ true);\n\n        // 保持程序运行直到用户选择“确定”\n        JOptionPane.showMessageDialog(null,\
  \ \"退出程序？\");\n        System.exit(0);\n    }\n}\n\n/**\n * 一个定期间隔打印时间的时钟。\n */\n\
  ```\n\n\n\n\n\n```java\nclass TalkingClock {\n    /**\n     * 启动时钟。\n     * @param\
  \ interval 消息之间的间隔（毫秒）\n     * @param beep 如果闹钟应该响则为 true\n     */\n    public void\
  \ start(int interval, final boolean beep) {\n        ActionListener listener = new\
  \ ActionListener() {\n            public void actionPerformed(ActionEvent event)\
  \ {\n                Date now = new Date();\n                System.out.println(\"\
  At the tone, the time is \" + now);\n                if (beep) Toolkit.getDefaultToolkit().beep();\n\
  \            }\n        };\n        Timer t = new Timer(interval, listener);\n \
  \       t.start();\n    }\n}\n```\n\n![Image](img/image00948.jpeg) 注意\n\n这种被称为`双括号初始化`（double\
  \ brace initialization）的技巧利用了内部类语法。假设你想构造一个列表并将其传递给方法：\n\n点击此处查看代码图片\n\n```java\n\
  ArrayList<String> friends = new ArrayList<>();\nfriends.add(\"Harry\");\nfriends.add(\"\
  Tony\");\ninvite(friends);\n```\n\n如果你不再需要这个列表，将其匿名化会很好。但这样做如何添加元素呢？方法如下：\n\n`invite(new\
  \ ArrayList<String>() {{ add(\"Harry\"); add(\"Tony\"); }})`\n\n注意双层括号。外层括号使 `ArrayList`\
  \ 的匿名子类。内层括号是一个对象构造块（参见第 4 章）。\n\n![Image](img/image00950.jpeg) 警告\n\n创建一个几乎与其父类相似但又不完全相同的匿名子类通常很方便。但你需要小心处理\
  \ `equals` 方法。在第 5 章中，我们建议你的 `equals` 方法使用测试：\n\n```java\nif (getClass() != other.getClass())\
  \ return false;\n```\n\n匿名子类将通过此测试。\n\n![Image](img/image00949.jpeg) 提示\n\n当你生成日志或调试信息时，通常想包含当前类的名称，例如：\n\
  \n```java\nSystem.err.println(\"Something awful happened in \" + getClass());\n\
  ```\n\n但这在静态方法中会失败。毕竟，对 `getClass` 的调用会执行 `this.getClass()`，而静态方法没有 `this`。请使用以下表达式：\n\
  \n```java\nnew Object(){}.getClass().getEnclosingClass() // 获取静态方法的类\n```\n\n在这里，`new\
  \ Object(){}` 创建了一个 `Object` 匿名子类的匿名对象，而 `getEnclosingClass` 获取其包围类——即包含该静态方法的类。\n\
  \n#### 6.4.7 静态内部类\n\n偶尔，你可能只想使用内部类将一个类隐藏在另一个类内部——但你不需要内部类持有外部类对象的引用。你可以通过将内部类声明为\
  \ `static` 来抑制该引用的生成。\n\n这是一个你想这样做的典型示例。考虑计算数组中最小值和最大值的任务。当然，你可以写一个方法计算最小值，另一个方法计算最大值。当你调用这两个方法时，数组会被遍历两次。只遍历一次数组并同时计算最小值和最大值会更有效。\n\
  \n```java\ndouble min = Double.MAX_VALUE;\ndouble max = Double.MIN_VALUE;\nfor (double\
  \ v : values) {\n    if (min > v) min = v;\n    if (max < v) max = v;\n}\n```\n\n\
  然而，该方法必须返回两个数字。我们可以通过定义一个持有两个值的 `Pair` 类来实现：点击此处查看代码图片\n\n```java\nclass Pair {\n\
  \    private double first;\n    private double second;\n    Pair(double f, double\
  \ s) {\n        first = f;\n        second = s;\n    }\n    public double getFirst()\
  \ { return first; }\n    public double getSecond() { return second; }\n}\n```\n\n\
  `minmax` 方法就可以返回一个 `Pair` 对象。点击此处查看代码图片\n\n```java\nclass ArrayAlg {\n    public\
  \ static Pair minmax(double[] values) {\n        // ...\n        return new Pair(min,\
  \ max);\n    }\n}\n```\n\n调用者使用 `getFirst` 和 `getSecond` 方法获取答案：点击此处查看代码图片\n\n```java\n\
  Pair p = ArrayAlg.minmax(d);\nSystem.out.println(\"min = \" + p.getFirst());\nSystem.out.println(\"\
  max = \" + p.getSecond());\n```\n\n当然，`Pair` 这个名字极其常见，在大型项目中，可能其他程序员也有同样的想法——创建了一个包含字符串字符串对的\
  \ `Pair` 类。我们可以通过将 `Pair` 变为 `ArrayAlg` 内部的公共内部类来解决这个潜在的冲突。这样，该类对外公开为 `ArrayAlg.Pair`：\n\
  \n```java\nArrayAlg.Pair p = ArrayAlg.minmax(d);\n```\n\n然而，与我们在之前的示例中使用的内部类不同，我们不希望在\
  \ `Pair` 对象内部持有任何其他对象的引用。该引用可以通过将内部类声明为 `static` 来抑制：\n\n```java\nclass ArrayAlg\
  \ {\n    public static class Pair {\n        // ...\n    }\n    // ...\n}\n```\n\
  \n当然，只有内部类可以被声明为 `static`。静态内部类与其他内部类完全相同，只是静态内部类的对象不持有生成它的外部类的引用。在我们的示例中，我们必须使用静态内部类，因为内部类对象是在静态方法内部构造的：\n\
  \n```java\npublic static Pair minmax(double[] d) {\n    // ...\n    return new Pair(min,\
  \ max);\n}\n```\n\n如果 `Pair` 类没有声明为 `static`，编译器将报错，没有可用的 `ArrayAlg` 类型隐式对象来初始化内部类对象。\n\
  \n![Image](img/image00948.jpeg) 注意\n\n当内部类不需要访问外部类对象时，请使用静态内部类。一些程序员使用“嵌套类”（nested\
  \ class）一词来描述静态内部类。\n\n![Image](img/image00948.jpeg) 注意\n\n在接口内部声明的内部类自动是 `static`\
  \ 且 `public` 的。\n\nListing 6.8 包含了 `ArrayAlg` 类和嵌套 `Pair` 类的完整源代码。\n\nListing 6.8.\
  \ staticInnerClass/StaticInnerClassTest.java 点击此处查看代码图片\n\n```java\npackage staticInnerClass;\n\
  \n/**\n * 此程序演示了静态内部类的用法。\n * @version 1.01 2004-02-27\n * @author Cay Horstmann\n\
  \ */\npublic class StaticInnerClassTest {\n    public static void main(String[]\
  \ args) {\n        double[] d = new double[20];\n        for (int i = 0; i < d.length;\
  \ i++)\n            d[i] = 100 * Math.random();\n        ArrayAlg.Pair p = ArrayAlg.minmax(d);\n\
  \        System.out.println(\"min = \" + p.getFirst());\n        System.out.println(\"\
  max = \" + p.getSecond());\n    }\n}\n\nclass ArrayAlg {\n    /**\n     * 一对浮点数\n\
  \     */\n    static class Pair {\n        private double first;\n        private\
  \ double second;\n        /**\n         * 从浮点数构造一个对\n         * @param f 第一个数字\n\
  \         * @param s 第二个数字\n         */\n        Pair(double f, double s) {\n  \
  \          first = f;\n            second = s;\n        }\n        /**\n       \
  \  * 返回对中的第一个数字\n         * @return 第一个数字\n         */\n        public double getFirst()\
  \ {\n            return first;\n        }\n\n        /**\n         * 返回对中的第二个数字\n\
  \         * @return 第二个数字\n         */\n        public double getSecond() {\n  \
  \          return second;\n        }\n    }\n}\n```\n\n\n\n\n\n```java\n/**\n *\
  \ Computes both the minimum and the maximum of an array\n * @param values an array\
  \ of floating-point numbers\n * @return a pair whose first element is the minimum\
  \ and whose second element\n * is the maximum\n */\npublic static Pair minmax(double[]\
  \ values)\n{\n    double min = Double.MAX_VALUE;\n    double max = Double.MIN_VALUE;\n\
  \    for (double v : values)\n    {\n        if (min > v) min = v;\n        if (max\
  \ < v) max = v;\n    }\n    return new Pair(min, max);\n}\n```\n\n### 6.5. 代理 (Proxies)\n\
  \n在本章的最后一节中，我们将讨论 `proxies`。你可以使用代理在运行时创建实现给定一组接口的新类。只有当你会在编译时尚不知道需要实现哪些接口时，代理才是必不可少的。对于对于应用程序程序员来说，这并不是一种常见的情况，如果你对这种“高级魔法”不感兴趣，可以随意跳过这一节。然而，对于某些系统编程应用，代理提供的灵活性可能非常重要。\n\
  \n假设你想构造一个实现了一个或多个接口的类对象，而这些接口的具体性质你可能在编译时不知道。这是一个困难的问题。要构造一个实际类，你可以直接使用 `newInstance`\
  \ 方法或使用反射来查找构造函数。但你无法实例化接口。你需要在运行中的程序中定义一个新类。\n\n为了解决这个问题，某些程序会生成代码，将其放入文件中，调用编译器，然后加载生成的类文件。自然地，这种方法很慢，而且还需要将编译器与程序一起部署。`proxy`\
  \ 机制是一个更好的解决方案。代理类可以在运行时创建全新的类。此类代理类实现了你指定的接口。特别地，代理类具有以下方法：\n\n- 指定的接口要求的所有方法；以及\n\
  - `Object` 类中定义的所有方法（`toString`、`equals` 等）。\n\n然而，你不能在运行时为这些方法定义新代码。相反，你必须提供一个\
  \ `invocation handler`（调用处理器）。调用处理器是任何实现了 `InvocationHandler` 接口的类的实例。该接口有一个方法：\n\
  \n```\nObject invoke(Object proxy, Method method, Object[] args)\n```\n\n每当在代理对象上调用方法时，调用处理器的\
  \ `invoke` 方法会被调用，并传入原始调用的 `Method` 对象和参数。随后调用处理器必须找出如何处理该调用。\n\n要创建一个代理对象，请使用 `Proxy`\
  \ 类的 `newProxyInstance` 方法。该方法有三个参数：\n\n- `class loader`（类加载器）。作为 Java 安全模型的一部分，不同的类加载器可以用于系统类、从互联网下载的类等。我们将在第二卷的第\
  \ 9 章讨论类加载器。现在，我们指定 `null` 来使用默认类加载器。\n- 一个 `Class` 对象的数组，每个接口对应一个对象。\n- 一个调用处理器。\n\
  \n还剩下两个问题。我们如何定义处理器？我们对生成的代理对象可以做什么？当然，这些答案取决于我们想要通过代理机制解决的问题。代理可以用于许多目的，例如：\n\n\
  - 将方法调用路由到远程服务器\n- 将用户界面事件与运行程序中的动作关联\n- 为了调试目的跟踪方法调用\n\n在我们的示例程序中，我们使用代理和调用处理器来跟踪方法调用。我们定义了一个\
  \ `TraceHandler` 包装类，它存储了一个被包装的对象。它的 `invoke` 方法简单地打印要调用的方法名称和参数，然后使用被包装的对象作为隐式参数调用该方法。\n\
  \n点击此处查看代码图像\n\n```java\nclass TraceHandler implements InvocationHandler\n{\n  \
  \  private Object target;\n\n    public TraceHandler(Object t)\n    {\n        target\
  \ = t;\n    }\n\n    public Object invoke(Object proxy, Method m, Object[] args)\n\
  \        throws Throwable\n    {\n        // ... 跟踪调用的逻辑 ...\n        return m.invoke(target,\
  \ args);\n    }\n}\n```\n\n\n\n\n\n```java\n// fill elements with proxies for the\
  \ integers 1 ... 1000\nfor (int i = 0; i < elements.length; i++)\n{\n    Integer\
  \ value = i + 1;\n    InvocationHandler handler = new TraceHandler(value);\n   \
  \ Object proxy = Proxy.newProxyInstance(null, new Class[] { Comparable.class },\
  \ handler);\n    elements[i] = proxy;\n}\n\n// construct a random integer\nInteger\
  \ key = new Random().nextInt(elements.length) + 1;\n\n// search for the key\nint\
  \ result = Arrays.binarySearch(elements, key);\n\n// print match if found\nif (result\
  \ >= 0) System.out.println(elements[result]);\n```\n\n```java/**\n * An invocation\
  \ handler that prints out the method name and parameters, then\n * invokes the original\
  \ method\n */\nclass TraceHandler implements InvocationHandler\n{\n    private Object\
  \ target;\n\n    /**\n     * Constructs a TraceHandler\n     * @param t the implicit\
  \ parameter of the method call\n     */\n    public TraceHandler(Object t)\n   \
  \ {\n        target = t;\n    }\n\n    public Object invoke(Object proxy, Method\
  \ m, Object[] args) throws Throwable\n    {\n        // print implicit argument\n\
  \        System.out.print(target);\n        // print method name\n        System.out.print(\"\
  .\" + m.getName() + \"(\");\n\n        // print explicit arguments\n        if (args\
  \ != null)\n        {\n            for (int i = 0; i < args.length; i++)\n     \
  \       {\n                System.out.print(args[i]);\n                if (i < args.length\
  \ - 1) System.out.print(\", \");\n            }\n        }\n        System.out.println(\"\
  )\");\n\n        // invoke actual method\n        return m.invoke(target, args);\n\
  \    }\n}\n```\n\n#### 6.5.1 代理类的属性\n\n现在你已经看到了了代理类的实际运行，让我们回顾一下它们的一些属性。请记住，代理类是在运行程序中动态创建的。然而，一旦创建完成，它们就像虚拟机中的任何其他类一样是普通的类。\n\
  \n所有的代理类都继承自 `Proxy` 类。代理类只有一个实例字段——调用处理器（invocation handler），它定义在 `Proxy` 超类中。例如，当我们在示例\
  \ 6.9 的程序中代理 `Comparable` 对象时，`TraceHandler` 包装了实际对象。\n\n所有的代理类都重写了 `Object` 类的\
  \ `toString`、`equals` 和 `hashCode` 方法。与所有的代理方法一样，这些方法简单地调用处理器上的 `invoke` 方法。`Object`\
  \ 类的其他方法（如 `clone` 和 `getClass`）没有重新定义。\n\n代理类的名称是没有定义的。Oracle 虚拟机中的 `Proxy` 类生成的类名以\
  \ `$Proxy` 开头。对于特定的类加载器和接口集合，只有一个代理类。也就是说，如果你使用相同的类加载器和接口数组调用两次 `newProxyInstance`，你将得到两个属于同一种类的对象。你也可以通过\
  \ `getProxyClass` 方法获取该类：\n\n`proxyClass = Proxy.getProxyClass(null, interfaces);`\n\
  \n代理类始终是 `public` 且 `final` 的。如果代理类实现的所有接口都是 `public` 的，则该代理类不属于任何特定的包。否则，所有非 `public`\
  \ 接口必须属于同一个包，且代理类也将属于该包。你可以通过调用 `Proxy` 类的 `isProxyClass` 方法来测试特定的 `Class` 对象是否代表代理类。\n\
  \n`java.lang.reflect.InvocationHandler`\n`Object invoke(Object proxy, Method method,\
  \ Object[] args)` 定义此方法，包含每当在代理对象上调用方法时你想要执行的操作。\n\n`java.lang.reflect.Proxy`\n\
  - `static Class getProxyClass(ClassLoader loader, Class[] interfaces)` 返回实现给定接口的代理类。\n\
  - `static Object newProxyInstance(ClassLoader loader, Class[] interfaces, InvocationHandler\
  \ handler)` 构建一个实现给定接口的代理类的新实例。所有方法都会调用给定处理器的 `invoke` 方法。\n- `static boolean isProxyClass(Class\
  \ c)` 如果 `c` 是代理类，则返回 `true`。\n\n关于 Java 语言基础的最后一章节到此结束。接口和内部类是你会经常遇到的概念。然而，正如我们已经提到的，代理是一种高级技术，主要对工具构建者感兴趣，而不是应用程序程序员。你现在准备好开始学习图形和用户界面了，从第\
  \ 7 章开始。\n\n# 第 7 章 图形编程\n\n本章内容\n- 介绍 Swing\n- 创建帧（Frame）\n- 帧的位置\n- 在组件中显示信息\n\
  - 处理 2D 形状\n- 使用颜色\n-为文本使用特殊字体\n- 显示图像\n\n到目前，你只见过如何编写从键盘获取输入、对其进行处理并在控制台屏幕上显示结果的程序。这并不是大多数用户现在想要的。现代程序不是这样工作的，网页也是如此。本章将带你开启编写使用图形用户界面（GUI）的\
  \ Java 程序的道路。特别是，你将学习如何编写在屏幕上调整窗口大小和定位的程序、在窗口中使用多种字体显示文本、显示图像等。这使你获得了一套有用且有价值的技能储备，你将在后续章节编写有趣的程序时将其大显身手。\n\
  \n接下来的两章将向你展示如何处理事件（例如击键和鼠标点击），以及如何向你的应用程序添加界面元素（如菜单和按钮）。当你完成这三章时，你将掌握编写图形化应用程序的精要。对于更复杂的图形编程技术，我们建议参阅第二卷。\n\
  \n另一方面，如果你打算仅使用 Java 进行服务端编程，并且对编写 GUI 编程感兴趣，可以安全地跳过这些章节。\n\n### 7.1 引入 Swing\n\n\
  当 Java 1.0 时，它包含了一个类库，Sun 称为抽象窗口工具包（AWT），用于基本的 GUI 编程。基本的 AWT 库通过将其创建和行为委托给每个目标平台（Windows、Solaris、Macintosh\
  \ 等）上的原生 GUI 工具包来处理用户界面元素。例如，如果你使用原始 AWT 在 Java 窗口上放置一个文本框，底层的“对等”（peer）文本框实际上负责处理文本输入。生成的程序理论上可以运行在这些任何一个平台上，并具有目标平台的“外观和感受”——这就是\
  \ Sun 的注册标语：“一次编写，随处运行。”\n\n\n\n\n\n基于对等（peer-based）的方法对于简单的应用程序效果良好，但很快就会发现，编写一个依赖于原生用户界面元素的高质量可移植图形库是极其困难的。像菜单、滚动条和文本字段等用户界面元素在不同平台上的行为可能存在细微差异。因此，通过这种方法很难为用户提供一致且可预测的体验。此外，某些图形环境（如\
  \ `X11/Motif`）拥有的用户界面组件并不像 Windows 或 Macintosh 那样丰富。这反过来进一步限制了基于“最小公约数”方法的可移植库。结果是使用\
  \ `AWT` 构建的 GUI 应用程序看起来并不像原生 Windows 或 Macintosh 应用程序那样漂亮，也不具备这些平台用户所预期的功能。更令人沮丧的是，不同平台上的\
  \ `AWT` 用户界面库存在`不同`的缺陷。开发者们抱怨说，他们必须在每个平台上测试自己的应用程序——这种做法被嘲讽地称为“一次编写，处处调试”。\n\n1996\
  \ 年，Netscape 创建了一个名为 `IFC`（互联网基础类）的 GUI 库，它采用了一种完全不同的方法。按钮、菜单等用户界面元素被`绘制`在空白窗口上。底层窗口系统所需的功能只是提供显示窗口和在窗口上进行绘制的方法。因此，Netscape\
  \ 的 `IFC` 组件无论程序运行在哪个平台上，其外观和行为都是一致的。Sun 与 Netscape 合作完善了这种方法，创建了一个代号为“Swing”的用户界面库。`Swing`\
  \ 作为 `Java 1.1` 的扩展可用，并成为 `Java SE 1.2` 标准库的一部分。\n\n正如杜克·艾灵斯顿（Duke Ellington）所说，“如果没有律动（Swing），一切毫无意义，”`Swing`\
  \ 现在是这种非对等 GUI 工具包的官方名称。`Swing` 是 `Java Foundation Classes`（`JFC`）的一部分。整个 `JFC`\
  \ 非常庞大，包含的内容远多于 `Swing` GUI 工具包；除了 `Swing` 组件外，它还拥有可访问性 API、2D API 和拖放 API。\n\n\
  ***\n\n![Image](img/image00948.jpeg) 注意\n\n`Swing` 并不是 `AWT` 的完全替代品——它是构建在 `AWT`\
  \ 架构之上的。`Swing` 只是为你提供了更强大的用户界面组件。每当你编写 `Swing` 程序时，你都会使用 `AWT` 的基础——特别是事件处理。从现在起，当我们说“Swing”时是指那些“绘制”的用户界面类，而当我们说“AWT”时是指窗口工具包的底层机制，例如事件处理。\n\
  \n***\n\n当然，基于 `Swing` 的用户界面元素在用户屏幕上的出现速度会比 `AWT` 使用的对等组件慢一些。根据我们的经验，在任何相当现代的机器上，速度差异都不应该是问题。另一方面，选择\
  \ `Swing` 的理由是压倒性的：\n\n* `Swing` 拥有一套丰富且方便的用户界面元素。\n* `Swing` 对底层平台的依赖很少；因此较少出现平台特定的缺陷。\n\
  * `Swing` 跨平台提供了一致的用户体验。\n\n尽管如此，第三个优点也是一个潜在的缺点：如果用户界面元素在所有平台上的看起来都一样，那么它们与原生控件就会`不同`，因此用户对它们不再那么熟悉。\n\
  \n`Swing` 以非常优雅的方式解决了这个问题。编写 `Swing` 程序的程序员可以为程序指定特定的“外观与感觉（look-and-feel）”。例如，图\
  \ 7.1 和 7.2 显示了同一个程序在 Windows 和 GTK 外观与感觉下的运行。\n\n![Image](img/image01033.jpeg)\n\
  \n图 7.1. `Swing` 的 Windows 外观与感觉\n\n![Image](img/image01034.jpeg)\n\n图 7.2. `Swing`\
  \ 的 GTK 外观与感觉\n\n此外，Sun 开发了一种名为“Metal”的平台无关外观与感觉，直到营销人员将其重命名为“Java 外观”。然而，大多数程序员继续使用“Metal”术语，我们在书中也会这样做。\n\
  \n一些人批评 Metal 过于呆板，因此外观在 `Java SE 5.0` 发布时得到了焕新（参见图 7.3）。现在 Metal 外观支持多个主题——颜色和字体的细微变化。默认主题被称为“Ocean（海洋）”。\n\
  \n![Image](img/image01035.jpeg)\n\n图 7.3. Metal 外观与感觉的 Ocean 主题\n\n在 `Java SE 6`\
  \ 中，Sun 改进了对 Windows 和 GTK 原生外观与感觉的支持。`Swing`应用程序现在可以获取配色方案自定义并忠实地渲染那些时尚的动态按钮和滚动条。\n\
  \n`Java 7` 提供了一种新的外观与感觉，称为 `Nimbus`（图 7.4），但它默认可用。`Nimbus` 使用矢量图而非位图，因此独立于屏幕分辨率。\n\
  \n![Image](img/image01036.jpeg)\n\n图 7.4. Nimbus 外观与感觉\n\n某些用户希望他们的 `Java` 程序使用平台的原生外观与感觉，另一些人喜欢\
  \ Metal 或第三方外观与感觉。正如你在第 8 章中看到的，让用户使用他们喜爱的外观与感觉非常简单。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n虽然我们在书中没有空间教你如何做，但 Java 程序员可以扩展现有的外观与感觉，甚至设计一个完全全新的。这是一个繁琐的过程，涉及到每个 `Swing`\
  \ 组件是如何绘制的。一些开发者确实这样做了，特别是在将 Java 移植到亭亭终端或手持设备等非传统平台时。访问 [www.javootoo.com](http://www.javootoo.com)\
  \ 查看有趣的外观与感觉实现集合。\n\n`Java SE 5.0` 引入了一种名为 `Synth` 的外观与感觉，使这个过程变得更容易。在 `Synth` 中，你可以通过提供图像文件和\
  \ XML 描述符定义新的外观与感觉，而无需任何编程。\n\n***\n\n***\n\n![Image](img/image00949.jpeg) 提示\n\n\
  Napkin 外观与感觉 ([`napkinlaf.sourceforge.net`](http://napkinlaf.sourceforge.net)) 为所有用户界面元素提供了手绘的外。当你向客户展示原型时这非常有用，可以传达出一个明确的信息：你正在给他们提供一个完成的产品。\n\
  \n***\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n如今 Java 用户界面编程大部分在 `Swing` 中完成，但有一个显著例外。Eclipse\
  \ 集成开发环境使用一种名为 `SWT` 的图形工具包，它类似于 `AWT`，并映射到各种平台上的原生组件。你可以在 [www.eclipse.org/articles](http://www.eclipse.org/articles)\
  \ 找到描述 `SWT` 的文章。\n\nOracle 正在开发一种名为 `JavaFX` 的替代技术，它可能在将来取代 `Swing`。我们在书中不讨论 `JavaFX`。更多信息请参见\
  \ [www.oracle.com/technetwork/java/javafx/overview](http://www.oracle.com/technetwork/java/javafx/overview)。\n\
  \n***\n\n如果你用 Visual Basic 或 C# 编写过 Microsoft Windows 应用程序，你就知道这些产品提供的图形布局工具和资源编辑器有多易用。这些工具允许你设计应用程序的视觉外观，然后它们为你生成大部分（通常是全部）GUI\
  \ 代码。Java 编程也有 GUI 构建器可用，但我们认为为了有效使用这些工具，你应该知道如何手动构建用户界面。本章剩余部分将为你介绍显示窗口和绘制其内容的基础知识。\n\
  \n### 7.2. 创建框架 (Frame)\n\n\n\n\nJava 中的顶层窗口（即不包含包含在另一个窗口内的窗口）被称为 `frame`。AWT 库有一个名为\
  \ `Frame` 的类用于表示这种顶层窗口。该类的 Swing 版本被称为 `JFrame`，并继承了 `Frame` 类。`JFrame` 是少数几个不是在画布上绘制的\
  \ Swing 组件之一。因此，窗口装饰（如按钮、标题栏、图标等）是由用户的窗口系统绘制的，而不是由 Swing 绘制的。\n\n* *\n\n![Image](img/image00950.jpeg)\
  \ 注意\n\n大多数 Swing 组件类都以“J”开头：`JButton`、`JFrame` 等。虽然也有诸如 `Button` 和 `Frame` 的类，但它们是\
  \ AWT 组件。如果你不小心漏掉了“J”，你的程序可能仍然编译并运行，但 Swing 和 AWT 组件的混合会导致视觉和行为上的不一致。\n\n* *\n\n\
  在本节中，我们将介绍操作 Swing `JFrame` 时最常用的方法。代码列表 7.1 列出了一个简单的程序，它在屏幕上显示一个空框架，如图 7.5 所示。\n\
  \n![Image](img/image01037.jpeg)\n\n图 7.5. 最简单的可见框架\n\n让我们逐行分析这个程序。\n\nSwing 类位于\
  \ `javax.swing` 包中。包名 `javx` 表示这是一个 Java 扩展包，而不是核心包。由于历史原因，Swing 被认为是一个扩展。然而，从 1.2\
  \ 版本以来，每个 Java SE 实现版本中都包含了它。\n\n代码列表 7.1. simpleframe/SimpleFrameTest.java\n\n\
  点击此处查看代码图片\n\n* *\n\n```java\npackage simpleFrame;\n\nimport java.awt.*;\nimport\
  \ javax.swing.*;\n\n/**\n * @version 1.32 2007-06-12\n * @author Cay Horstmann\n\
  \ */\npublic class SimpleFrameTest\n{\n    public static void main(String[] args)\n\
  \    {\n        EventQueue.invokeLater(new Runnable()\n            {\n         \
  \       public void run()\n                {\n                    SimpleFrame frame\
  \ = new SimpleFrame();\n                    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \                    frame.setVisible(true);\n                }\n            });\n\
  \    }\n}\n\nclass SimpleFrame extends JFrame\n{\n    private static final int DEFAULT_WIDTH\
  \ = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\n    public SimpleFrame()\n\
  \    {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n    }\n}\n```\n\n* *\n\n\
  默认情况下，框架的大小为几乎毫无意义的 0 × 0 像素。我们定义了一个子类 `SimpleFrame`，其构造函数将大小设置为 300 × 200 像素。这是\
  \ `SimpleFrame` 和 `JFrame` 唯一的区别。\n\n在 `SimpleFrameTest` 类的 `main` 方法中，我们构造了一个 `SimpleFrame`\
  \ 对象并使其可见。\n\n在每个 Swing 程序中我们需要解决两个技术问题。\n\n首先，所有的 Swing 组件必须在*事件分发线程*（event dispatch\
  \ thread）中配置，该线程是传递鼠标点击和键盘输入等事件的控制线程。以下代码使用了：\n\n```java\nEventQueue.invokeLater(new\
  \ Runnable()\n    {\n        public void run()\n        {\n            SimpleFrame\
  \ frame = new SimpleFrame();\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n        }\n    });\n```\n\n\n\n\n本节的 API 注释给出了我们认为的赋予框架正确外观和感觉的最重要方法。其中一些方法定义在\
  \ `JFrame` 类中，另一些方法则来自 `JFrame` 的各种超类。在某些情况下，你可能需要搜索 API 文档以查看是否存在某些特殊用途的方法。遗憾的是，对于继承的方法，这样做起来会有点繁琐。例如，`toFront`\
  \ 方法适用于 `JFrame` 类型的对象，但由于它简单地继承自 `Window` 类，因此 `JFrame` 的文档并没有对其进行解释。如果你认为应该有一个方法来执行某项操作，但在你正在处理的类文档中没有提到，请尝试查看该类超类方法的\
  \ API 文档。每个 API 页面的顶部都有指向超类的超链接，继承的方法列在新方法和重写方法的方法摘要下方。\n\n***\n\n正如 API 注释所示，`Component`\
  \ 类（所有 GUI 对象的祖先）和 `Window` 类（`Frame` 类的超类）是你需要查找调整框架大小和改变形状的方法的地方。例如，`Component`\
  \ 类中的 `setLocation` 方法是重新定位组件的一种方法。如果你调用\n\n```\nsetLocation(x, y)\n```\n\n左上角将位于向右\
  \ `x` 像素、向下 `y` 像素处，其中 (0, 0) 是屏幕的左上角。同样，`Component` 中的 `setBounds` 方法允许你一步完成调整组件的大小和重新定位（特别是\
  \ `JFrame`），如下：\n\n```\nsetBounds(x, y, width, height)\n```\n\n或者，你可以将窗口放置的控制交给窗口系统。如果你在显示窗口之前调用\n\
  \n```\nsetLocationByPlatform(true);\n```\n\n窗口系统将选择位置（但不选择大小），通常是相对于上一个窗口有略微偏移。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n对于框架而言，`setLocation` 和 `setBounds`\
  \ 的坐标是相对于整个屏幕的。正如你将在第 9 章中看到的那样，对于容器内的其他组件，测量值是相对于容器的。\n\n***\n\n### 7.3.1. 框架属性\n\
  \n组件类的许多方法以 getter/setter 对的形式出现，例如 `Frame` 类的以下方法：\n\n```\npublic String getTitle()\n\
  public void setTitle(String title)\n```\n\n这样的 getter/setter 对被称为一个*属性*。一个属性有一个名称和一个类型。名称通过将\
  \ `get` 或 `set` 之后的第一个字母改为小写来获得。例如，`Frame` 类有一个名称为 `title` 类型为 `String` 的属性。\n\n\
  从概念上说，`title` 是框架的属性属性。当我们设置该属性时，我们期望标题在用户的屏幕上发生变化。当我们获取该属性时，我们期望获得我们所设置的值。\n\n\
  我们不知道（也不在乎）`Frame` 类是如何实现这个属性的。也许它简单地使用它的对等框架（peer frame）来存储标题。也许它有一个实例字段\n\n```java\n\
  private String title; // 属性不需要这个\n```\n\n如果该类确实有一个匹配的实例字段，我们不知道（也不在乎）getter 和 setter\
  \ 方法是如何实现的。它们可能只是读取和写入实例字段。它们可能执行更多操作，例如在每次标题更改时通知窗口系统。\n\n`get`/set` 约定有一个例外：对于\
  \ `boolean` 类型的属性，getter 以 `is` 开头。例如，以下两个方法定义了 `locationByPlatform` 属性：\n\n点击此处查看代码图像\n\
  \n```\npublic boolean isLocationByPlatform()\npublic void setLocationByPlatform(boolean\
  \ b)\n```\n\n我们将在第二卷的第 8 章更详细地查看属性。\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\
  \n许多编程语言，特别是 Visual Basic 和 C# 对属性有内置支持。Java 的未来版本也可能为属性添加语言结构。\n\n***\n\n### 7.3.2.\
  \ 确定合适的框架尺寸\n\n记住：如果你不显式地设置框架大小，所有框架将默认为 0 比 0 像素。为了保持我们的示例程序简单，我们将框架调整为我们认为在大多数显示器上可以接受的大小。然而，在专业应用程序中，你应该检查用户屏幕的分辨率并编写相应的代码：在笔记本电脑屏幕上看起来良好的窗口，在高分辨率屏幕上看起来会像一个邮票。\n\
  \n要确定屏幕大小，请使用以下步骤。调用 `Toolkit` 类的静态方法 `getDefaultToolkit` 来获取 `Toolkit` 对象。（`Toolkit`\
  \ 类是各种与原生窗口系统接口的方法的汇集地。）然后调用 `getScreenSize` 方法，该方法将屏幕大小作为 `Dimension` 对象返回。`Dimension`\
  \ 对象同时在公共的 (!) 实例变量 `width` 和 `height` 中存储宽度和高度。以下是代码：\n\n点击此处查看代码图像\n\n```\nToolkit\
  \ kit = Toolkit.getDefaultToolkit();\nDimension screenSize = kit.getScreenSize();\n\
  int screenWidth = screenSize.width;\nint screenHeight = screenSize.height;\n```\n\
  \n我们使用这些值的 50% 作为框架尺寸，并告诉窗口系统放置框架的位置：\n\n点击此处查看代码图像\n\n```\nsetSize(screenWidth\
  \ / 2, screenHeight / 2);\nsetLocationByPlatform(true);\n```\n\n我们还提供了一个图标。`ImageIcon`\
  \ 类对于加载图像非常方便。以下是使用它的方法：\n\n点击此处查看代码图像\n\n```\nImage img = new ImageIcon(\"icon.gif\"\
  ).getImage();\nsetIconImage(img);\n```\n\n根据你的操作系统，你可以在各个地方看到图标。例如，在 Windows 中，图标显示在窗口的左上角，当你按下\
  \ Alt+Tab 时，可以在活动任务列表中看到它。\n\n列表 7.2 是完整程序。当你运行程序时，请注意“图标”。这里是处理框架的几点提示：\n\n- 如果你的框架只包含按钮和文本框，只需调用\
  \ `pack` 来设置框架大小。框架将是包含所有组件的最小尺寸。\n- 将主框架设置为最大化是很常见的。从 Java SE 4 开始，你可以通过调用 `setExtended(Frame.BOTH)`\
  \ 来使框架最大化。\n- 在启动应用程序时，记住用户设置的位置和大小也是一个好主意。你将在第 10 章中看到如何使用 `Preferences` 来实现此目的。\n\
  \n\n\n\n```java\n38 // set frame width, height and let platform pick screen location\n\
  40 setSize(screenWidth / 2, screenHeight / 2);\n41 setLocationByPlatform(true);\n\
  43 // set frame icon\n45 Image img = new ImageIcon(\"icon.gif\").getImage();\n46\
  \ setIconImage(img);\n47 }\n48 }\n```\n\n* *\n\n- 如果你编写了一个利用多个显示器的应用程序，请使用 `GraphicsEnvironment`\
  \ 和 `GraphicsDevice` 类来查找显示器的尺寸。\n- `GraphicsDevice` 类还允许你可以在全屏模式下运行你的应用程序。\n\n\
  ### java.awt.Component 1.0\n\n- `boolean isVisible()`\n- `void setVisible(boolean\
  \ b)`\n获取或设置 `visible` 属性。组件初始是可见的，但 `JFrame` 等顶层组件除外。\n- `void setSize(int width,\
  \ int height)` 1.1\n将组件调整为指定的宽度和高度。\n- `void setLocation(int x, int y)` 1.1\n将组件移动到新位置。如果组件不是顶层组件，则\
  \ `x` 和 `y` 坐标使用容器的坐标；如果组件是顶层组件（例如 `JFrame`），则使用屏幕的坐标。\n- `void setBounds(int x,\
  \ int y, int width, int height)` 1.1\n移动并调整此组件。\n- `Dimension getSize()` 1.1\n-\
  \ `void setSize(Dimension d)` 1.1\n获取或设置此组件的 `size` 属性。\n\n### java.awt.Window 1.0\n\
  \n- `void toFront()`\n将此窗口显示任何其他窗口之上。\n- `void toBack()`\n将此窗口移动到桌面窗口栈的最后，并相应重新排列所有其他可见窗口。\n\
  - `boolean isLocationByPlatform()` 5.0\n- `void setLocationByPlatform(boolean b)`\
  \ 5.0\n获取或设置 `locationByPlatform` 属性。当在窗口显示之前设置该属性时，平台会选择合适的位置。\n\n### java.awt.Frame\
  \ 1.0\n\n- `boolean isResizable()`\n- `void setResizable(boolean b)`\n获取或设置 `resizable`\
  \ 属性。当设置该属性时，用户可以调整框架的大小。\n- `String getTitle()`\n- `void setTitle(String s)`\n\
  获取或设置 `title` 属性，该属性决定框架标题栏中的文本。\n- `Image getIconImage()`\n- `void setIconImage(Image\
  \ image)`\n获取或设置 `iconImage` 属性，该属性决定框架的图标。窗口系统可能会将图标作为框架装饰的一部分或在其他位置显示。\n- `boolean\
  \ isUndecorated()` 1.4\n- `void setUndecorated(boolean b)` 1.4\n获取或设置 `undecorated`\
  \ 属性。当设置该属性时，框架将在不带标题栏或关闭按钮等装饰的情况下显示。此方法必须在框架显示之前调用。\n- `int getExtendedState()`\
  \ 1.4\n- `void setExtendedState(int state)` 1.4\n获取或设置扩展窗口状态。该状态为以下之一：\n- `Frame.NORMAL`\n\
  - `Frame.ICONIFIED`\n- `Frame.MAXIMIZED_HORIZ`\n- `Frame.MAXIMIZED_VERT`\n- `Frame.MAXIMIZED_BOTH`\n\
  \n### java.awt.Toolkit 1.0\n\n- `static Toolkit getDefaultToolkit()`\n返回默认工具包。\n\
  - `Dimension getScreenSize()`\n获取用户的屏幕尺寸。\n\n### javax.swing.ImageIcon 1.2\n\n-\
  \ `ImageIcon(String filename)`\n构造一个图像存储在文件中的图标。\n- `Image getImage()`\n获取此图标的图像。\n\
  \n### 7.4. 在组件中显示信息\n\n在本节中，我们将向你展示如何在框架内部显示信息。例如，我们不再像第 3 章 中那样在控制台窗口中以文本模式显示“Not\
  \ a Hello, World program”，而是在框架中显示消息，如图 7.7 所示。\n\n![Image](img/image01039.jpeg)\n\
  \n图 7.7. 显示信息的框架\n\n你可以直接将消息字符串绘制到框架上，但这不被认为良好的编程实践。在 Java 中，框架实际上被设计为作为组件的容器，例如菜单栏和其他用户界面元素。你通常在添加到框架的另一个组件上进行绘制。\n\
  \n`JFrame` 的结构出奇地复杂。查看图 7.8。\n\n\n\n\n在我们的案例中，我们想在原始窗口中绘制 `\"Not a Hello, World\
  \ Program\"` 字符串，位置大约位于宽度的四分之一处和高度的一半处。虽然我们还不知道如何测量字符串的大小，但我们将从坐标 (75, 100) 处开始绘制字符串。这意味着字符串中的第一个字符将从向右\
  \ 75 像素、向下 100 像素的位置开始。（实际上，向下 100 像素的是文本的基线——有关如何测量文本的更多信息请参见第 372 页。）因此，我们的 `paintComponent`\
  \ 方法如下：\n\n```java\nclass NotHelloWorldComponent extends JComponent\n{\n    public\
  \ static final int MESSAGE_X = 75;\n    public static final int MESSAGE_Y = 100;\n\
  \    public void paintComponent(Graphics g)\n    {\n        g.drawString(\"Not a\
  \ Hello, World program\", MESSAGE_X, MESSAGE_Y);\n    }\n    . . .\n}\n```\n\n最后，组件应该告诉用户它希望有多大。重写\
  \ `getPreferredSize` 方法并返回一个 `Dimension` 类对象，其中包含首选的宽度高度：\n\n```java\nclass NotHelloWorldComponent\
  \ extends JComponent\n{\n    private static final int DEFAULT_WIDTH = 300;\n   \
  \ private static final int DEFAULT_HEIGHT = 200;\n    . . .\n    public Dimension\
  \ getPreferredSize() { return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT); }\n\
  }\n```\n\n当你用一个或多个组件填充一个框架时，如果你只是想使用它们的首选尺寸，请调用 `pack` 方法而不是 `setSize` 方法：\n\n```java\n\
  class NotHelloWorldFrame extends JFrame\n{\n    public NotHelloWorldFrame()\n  \
  \  {\n        add(new NotHelloWorldComponent());\n        pack();\n    }\n}\n```\n\
  \nListing 7.3 显示了完整的代码。\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n与其扩展 `JComponent`，某些程序员更倾向于扩展\
  \ `JPanel` 类。`JPanel` 旨在作为一个可以包含其他组件的容器，但在其上进行绘制也是可能的。只有一个区别：面板是不透明的，这意味着它负责绘制其边界内的所有像素。实现这一点的简单方法是使用背景色绘制面板，通过在每个面板子类的\
  \ `paintComponent` 方法中调用 `super.paintComponent` 来：\n\n```java\nclass NotHelloWorldPanel\
  \ extends JPanel\n{\n    public void paintComponent(Graphics g)\n    {\n       \
  \ super.paintComponent(g);\n        // 绘图代码\n    }\n}\n```\n\n***\n\nListing 7.3.notHelloWorld/NotHelloWorld.java\n\
  \n```java\n1  package notHelloWorld;\n2\n3  import javax.swing.*;\n4  import java.awt.*;\n\
  5\n6  /**\n7   * @version 1.32 2007-06-12\n8   * @author Cay Horstmann\n9   */\n\
  10 public class NotHelloWorld\n11 {\n12     public static void main(String[] args)\n\
  13     {\n14         EventQueue.invokeLater(new Runnable()\n15             {\n16\
  \                 public void run()\n17                 {\n18                  \
  \   JFrame frame = new NotHelloWorldFrame();\n19                     frame.setTitle(\"\
  NotHelloWorld\");\n20                     frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  21                     frame.setVisible(true);\n22                 }\n23       \
  \      });\n24     }\n25 }\n26 /**\n27  * 一个包含消息面板的框架\n28  */\n29 class NotHelloWorldFrame\
  \ extends JFrame\n30 {\n31     public NotHelloWorldFrame()\n32     {\n33       \
  \  add(new NotHelloWorldComponent());\n34         pack();\n35     }\n36 }\n37\n\
  38 /**\n39  * 一个显示消息的组件。\n40  */\n41 class NotHelloWorldComponent extends JComponent\n\
  42 {\n43     public static final int MESSAGE_X = 75;\n44     public static final\
  \ int MESSAGE_Y = 100;\n45\n46     private static final int DEFAULT_WIDTH = 300;\n\
  47     private static final int DEFAULT_HEIGHT = 200;\n48\n49     public void paintComponent(Graphics\
  \ g)\n50     {\n51         g.drawString(\"Not a Hello, World program\", MESSAGE_X,\
  \ MESSAGE_Y);\n52     }\n53\n54     public Dimension getPreferredSize() { return\
  \ new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT); }\n55 }\n```\n\n***\n\n`javax.swing.JFrame`\n\
  - `getContentPane()` 返回此 `JFrame` 的内容面板对象。\n- `add(Component c)` 将给定的组件添加到此框架的内容面板并返回该组件。（在\
  \ Java SE 5.0 之前，此方法会抛出异常。）\n\n`java.awt.Component`\n- `void repaint()` 导致组件“尽快”进行重绘。\n\
  - `Dimension getPreferredSize()` 是用于重写的方法，以返回此组件的首选尺寸。\n\n`javax.swing.JComponent`\n\
  - `void paintComponent(Graphics g)` 是用于重写的方法，以描述你的组件如何被绘制。\n\n`java.awt.Window`\n\
  - `void pack()` 调整窗口以适应组件的首选尺寸。\n\n***\n\n### 7.5 使用 2D 形状\n\n从 Java 1.0 开始，`Graphics`\
  \ 类提供了绘制线条、矩形和椭圆的方法。但那些绘制操作非常有限，例如，你无法改变粗细。Java SE 1.2 引入了 Java 2D 库，它实现了一套强大的图形操作。有关高级功能，请参见\
  \ Volume II 的第 7 章。\n\n要在 2D 中绘制，你需要一个 `Graphics2D` 类对象。该类是 `Graphics` 类的子类。自从 Java\
  \ 2 开始，如 `paintComponent` 等方法会自动接收 `Graphics2D` 对象：\n\n```java\npublic void paintComponent(Graphics\
  \ g)\n{\n    Graphics2D g2 = (Graphics2D) g;\n    . . .\n}\n```\n\nJava 2D 库以对象的方式组织形状。特别是，有表示线条、矩形和椭圆的类：\n\
  `Line2D`\n`Rectangle2D`\n`Ellipse2D`\n\n这些类都实现了 `Shape` 接口。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\nJava 2D 库支持更复杂的形状——特别是弧、二次和三次曲线以及通用路径。请参见 Volume II 的第 7 章获取更多信息。\n\n***\n\
  \n要绘制形状，你首先创建一个实现 `Shape` 接口的类对象，然后调用 `Graphics2D` 类的 `draw` 方法。例如：\n\n```java\n\
  Rectangle2D rect = . .;\ng2.draw(rect);\n```\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n在 Java 2D 库出现之前，程序员使用 `Graphics` 类的方法（如 `drawRectangle`）来绘制形状。表面上，旧式的方法调用看起来简单一点。但是，通过使用\
  \ Java 2D 库，你保留了选择——你以后可以使用 Java 2D 库提供的许多工具来增强绘画。\n\n***\n\n使用 2D 形状类引入了一些复杂性。与\
  \ 1.0 使用整数像素坐标的方法不同，Java2D 形状使用浮点坐标。在很多情况下，这非常方便，因为它允许你以对你有意义的坐标（如毫米或英寸）来指定形状，然后将其转换为像素。Java\
  \ 2D 库在其许多内部浮点计算中使用单精度 `float` 数量。单精度就足够了——毕竟，几何计算的最终目的是在屏幕或打印机上设置像素。只要舍入误差保持在一个像素内，视觉结果就不会受到影响。此外，`float`\
  \ 计算在某些平台上更快，且 `float` 值所需的存储空间是 `double` 值的一半。\n\n\n\n然而，操作 `float` 值有时对程序员来说并不方便，因为\
  \ Java 坚决要求在将 `double` 值转换为 `float` 值时进行强制类型转换。例如，考虑以下语句：\n\n```\nfloat f = 1.2;\
  \ // Error\n```\n\n该语句无法编译，因为常量 `1.2` 的类型是 `double`，而编译器担心会丢失精度。解决办法是在浮点常量后添加一个\
  \ `F` 后缀：\n\n```java\nfloat f = 1.2F; // Ok\n```\n\n现在考虑这条语句：\n\n```java\nRectangle2D\
  \ r = . . .\nfloat f = r.getWidth(); // Error\n```\n\n该语句同样无法编译，原因相同。`getWidth`\
  \ 方法返回一个 `double` 类型。这次的解决办法是提供强制类型转换：\n\n```java\nfloat f = (float) r.getWidth();\
  \ // Ok\n```\n\n这些后缀和强制类型转换有点麻烦，因此 2D 库的设计者决定为每个形状类提供两个版本：一个使用 `float` 坐标以供节省内存的程序员，另一个使用\
  \ `double` 坐标以供懒人使用。（在本书中，我们属于后一派，并且尽可能使用 `double` 坐标。）\n\n库的设计者选择了一种奇特且最初令人困惑的方法来封装这些选择。考虑\
  \ `Rectangle2D` 类。这是一个抽象类，有两个具体的子类，这两个子类也是静态内部类：\n\n```\nRectangle2D.Float\nRectangle2D.Double\n\
  ```\n\n图 7.9 显示了继承关系。\n\n![Image](img/image01041.jpeg)\n\n图 7.9 2D 矩形类\n\n最好忽略这两个具体类是静态内部类的事实——这只是为了避免使用如\
  \ `FloatRectangle2D` 和 `DoubleRectangle2D` 之类的名称。（有关静态内部类的更多信息，请参见第 6 章。）\n\n当你构造一个\
  \ `Rectangle2D.Float` 对象时，你提供的坐标是 `float` 数字。对于 `Rectangle2D.Double` 对象，你提供的坐标是\
  \ `double` 数字。\n\n点击此处查看代码图像\n\n```java\nRectangle2D.Float floatRect = new Rectangle2D.Float(10.0F,\
  \ 25.0F, 22.5F, 20.0F);\nRectangle2D.Double doubleRect = new Rectangle2D.Double(10.0,\
  \ 25.0, 22.5, 20.0);\n```\n\n实际上，由于 `Rectangle2D.Float` 和 `Rectangle2D.Double` 都自自自\
  \ `Rectangle2D` 类，且子类中的方法只是重写了父类 `Rectangle2D` 中的方法，因此记住精确的形状类型并没有好处。你可以直接使用 `Rectangle2D`\
  \ 变量来持有矩形引用。\n\n点击此处查看代码图像\n\n```java\nRectangle2D floatRect = new Rectangle2D.Float(10.0F,\
  \ 25.0F, 22.5F, 20.0F);\nRectangle2D doubleRect = new Rectangle2D.Double(10.0, 25.0,\
  \ 22.5, 20.0);\n```\n\n也就是说，你只有在构造形状对象时才需要使用那些讨厌的内部类。\n\n构造参数表示了矩形的左上角、宽度和高度。\n\n\
  ***\n\n![Image](img/image00948.jpeg) 注意\n\n实际上，`Rectangle2D.Float` 类有一个没有从 `Rectangle2D`\
  \ 继承的额外方法，即 `setRect(float x, float y, float h, float w)`。如果你将 `Rectangle2D.Float`\
  \ 引用存储在 `Rectangle2D` 变量中，就会丢失该方法。但并不是什么大损失——`Rectangle2D` 类有一个带有 `double` 参数的 `setRect`\
  \ 方法。\n\n***\n\n`Rectangle2D` 方法使用 `double` 参数和返回值。例如，`getWidth` 方法返回一个 `double`\
  \ 值，即使宽度在 `Rectangle2D.Float` 对象中是以 `float` 形式存储的。\n\n***\n\n![Image](img/image00949.jpeg)\
  \ 提示\n\n直接使用 `Double` 形状类可以完全避免处理 `float` 值。然而，如果你正在构造数千个形状对象，请考虑使用 `Float` 类来节省内存。\n\
  \n***\n\n我们刚刚对 `Rectangle2D` 类的讨论适用于其他形状类。此外，还有一个 `Point2D` 类，其子类为 `Point2D.Float`\
  \ 和 `Point2D.Double`。以下是创建点对象的方法：\n\n```java\nPoint2D p = new Point2D.Double(10,\
  \ 20);\n```\n\n***\n\n![Image](img/image00949.jpeg) 提示\n\n`Point2D` 类非常有用——使用 `Point2D`\
  \ 对象比使用独立的 *x* 和 *y* 值更面向对象。许多构造函数和方法都接受 `Point2D` 参数。我们建议尽可能使用 `Point2D` 对象——它们通常会让几何计算更易理解。\n\
  \n***\n\n`Rectangle2D` 和 `Ellipse2D` 类都继承自共同的父类 `RectangularShape`。诚然，椭圆不是矩形，但它们有一个外接矩形（参见图\
  \ 7.10）。\n\n![Image](img/image1042.jpeg)\n\n图 7.10 椭圆的外接矩形\n\n`RectangularShape`\
  \ 类定义了 20 多个这些形状通用的方法，其中包含 `getWidth`、`getHeight`、`getCenterX` 和 `getCenterY` 等实用方法（但遗憾的是，在写作时，还没有返回\
  \ `Point2D` 对象的 `getCenter` 方法）。\n\n最后，来自 Java 1.0 的几个旧类被整合到了形状类层次结构中。`Rectangle`\
  \ 和 `Point` 类存储带有整数坐标的矩形和点，继承了 `Rectangle2D` 和 `Point2D` 类。\n\n图 7.11 显示了继承关系。\n\
  \n![Image](img/image0143.jpeg)\n\n图 7.11 形状类之间的关系\n\n\n\n\n\n```java\n/**\n * @version\
