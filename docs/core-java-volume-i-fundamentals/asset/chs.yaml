  \    public double getTotalBalance()\n    {\n        double sum = 0;\n        for\
  \ (double a : accounts)\n            sum += a;\n        return sum;\n    }\n\n \
  \   /**\n     * Gets the number of accounts in the bank.\n     * @return the number\
  \ of accounts\n     */\n    public int size()\n    {\n        return accounts.length;\n\
  \    }\n}\n```\n\nListing 14.7. unsynch/TransferRunnable.java\n点击此处查看代码图片\n\n***\n\
  \n```java\npackage unsynch;\n\n/**\n * A runnable that transfers money from an account\
  \ to other accounts in a bank.\n * @version 1.30 2004-08-01\n * @author Cay Horstmann\n\
  \ */\npublic class TransferRunnable implements Runnable\n{\n    private Bank bank;\n\
  \    private int fromAccount;\n    private double maxAmount;\n    private int DELAY\
  \ = 10;\n\n    /**\n     * Constructs a runnable.\n     * @param b the bank between\
  \ whose money is transferred\n     * @param from the account to transfer from\n\
  \     * @param max the maximum amount of money in each transfer\n     */\n    public\
  \ TransferRunnable(Bank b, int from, double max)\n    {\n        bank = b;\n   \
  \     fromAccount = from;\n        maxAmount = max;\n    }\n\n    public void run()\n\
  \    {\n        try\n        {\n            while (true)\n            {\n      \
  \          int toAccount = (int) (bank.size() * Math.random());\n              \
  \  double amount = maxAmount * Math.random();\n                bank.transfer(fromAccount,\
  \ toAccount, amount);\n                Thread.sleep((int) (DELAY * Math.random()));\n\
  \            }\n        }\n        catch (InterruptedException e)\n        {\n \
  \       }\n    }\n}\n```\n\n***\n\n#### 14.5.2 竞态条件详解\n\n在上一节中，我们运行了一个程序，其中几个线程更新了银行账户余额。过了一段时间，错误出现了，某些资金变得丢失或凭空产生。当两个线程同时尝试更新一个账户时，就会发生这个问题。假设两个线程同时执行指令\
  \ `accounts[to] += amount;`。\n\n问题在于这些并不是*原子性*操作。该指令的处理可能如下：\n\n1. 将 `accounts[to]`\
  \ 加载到寄存器。\n2. 加上 `amount`。\n3. 将结果移回 `accounts[to]`。\n\n现在，假设第一个线程执行了步骤 1 和 2，然后被抢占。假设第二个线程醒来并更新了\
  \ `account` 数组中的同一条目。然后，第一个线程醒来并完成了它的步骤 3。\n\n这一操作消除了另一个线程的修改。结果是，总数不再正确。（参见图 14.4。）\n\
  \n![图像](img/image01229.jpeg)\n\n图 14.4 两个线程的并发访问\n\n我们的测试程序检测到了这种损坏。（当然，如果线程在执行测试时被中断，会有微小的误报概率！）\n\
  \n***\n\n#### 注意\n\n你实际上可以查看我们类中执行每个语句的虚拟机字节码。运行命令 `javap -c -v Bank` 来反编译 `Bank.class`\
  \ 文件。例如，`accounts[to] += amount;` 这一行被翻译为以下字节码：\n\n```\naload_0\ngetfield #2; //Field\
  \ accounts:D\niload_2\ndup2\ndaload\ndload\ndadd\ndastore\n```\n\n这些代码的意思并不重要。重点在于增加是由几条指令组成的，线程可以在任何指令处被中断。\n\
  \n***\n\n是什么交错打印语句增加了观察到该问题的概率？\n\n#### 14.5.3 锁对象\n\n有两种机制可以保护代码块免受并发访问。Java 语言提供了\
  \ `synchronized` 关键字来实现此目的，Java SE 5.0 引入了 `ReentrantLock` 类。`synchronized` 关键字自动提供锁以及“条件”（condition），这使得它对于大多数需要显式锁的情况来说既强大又方便。然而，我们认为在孤立查看锁和条件之后，`synchronized`\
  \ 关键字会更容易理解。`java.util.concurrent` 框架为这些基础机制提供了单独的类，我们在这里以及[第 14.5.4 节条件对象（854 页）中解释。在理解了这些构建块后，我们将在第\
  \ 14.5.5 节 synchronized 关键字（859 页）中介绍 `synchronized` 关键字。\n\n使用 `ReentrantLock`\
  \ 保护代码块的基本框架如下：\n\n点击此处查看代码图片\n\n```\nmyLock.lock(); // 一个 ReentrantLock 对象\ntry\n\
  {\n    关键区域\n}\nfinally\n{\n    myLock.unlock(); // 确保即使发生异常也会释放锁\n}\n```\n\n这种结构保证了同一时间只有一个线程可以进入关键区域。一旦一个线程锁定了锁对象，其他线程就无法通过\
  \ `lock` 语句。当其他线程调用 `lock` 时，它们会被停用，直到第一个线程释放锁对象。\n\n***\n\n![图像](img/image00950.jpeg)\
  \ 注意\n\n\n\n\n将 `unlock` 操作封装在 `finally` 句中是至关重要的。如果临界区中的代码抛出异常，必须释放锁。否则，其他线程将永远阻塞。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n当你使用锁时，你无法使用 try-with-resources 语句。首先，`unlock`\
  \ 方法并不名为 `close`。但即使它被重命名，try-with-resources 语句也无法工作。它的头部期望声明一个新变量。但当你使用锁时，你希望继续使用在线程间共享的同一个变量。\n\
  \n***\n\n让我们使用一个锁来保护 `Bank` 类的 `transfer` 方法。\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ Bank\n{\n   private Lock bankLock = new ReentrantLock(); // ReentrantLock implements\
  \ the Lock interface\n\n   . . .\n\n   public void transfer(int from, int to, int\
  \ amount)\n   {\n      bankLock.lock();\n      try\n      {\n         System.out.print(Thread.currentThread());\n\
  \         accounts[from] -= amount;\n         System.out.printf(\" %10.2f from %d\
  \ to %d\", amount, from, to);\n         accounts[to] += amount;\n         System.out.printf(\"\
  \ Total Balance: %10.2f%n\", getTotalBalance());\n      }\n      finally\n     \
  \ {\n         bankLock.unlock();\n      }\n   }\n}\n```\n\n假设一个线程调用了 `transfer`，在完成之前被抢占。假设第二个线程也调用了\
  \ `transfer`。第二个线程无法获取锁，并在调用 `lock` 方法时被阻塞。它被激活，必须等待第一个线程执行完 `transfer` 方法。当第一个线程释放锁时，第二个线程就可以继续执行（参见图\
  \ 14.5）。\n\n![Image](img/image01230.jpeg)\n\n图 14.5. 未同步线程与同步线程的比较\n\n尝试一下。在 `transfer`\
  \ 方法中添加锁代码并重新运行程序。你可以一直运行，银行余额也不会被损坏。\n\n注意，每个 `Bank` 对象都有它们自己的 `ReentrantLock`\
  \ 对象。如果两个线程尝试访问同一个 `Bank` 对象，锁的作用是将访问序列化。然而，如果两个线程访问不同的 `Bank` 对象，每个线程都会获取不同的锁，且两个线程都不会阻塞。这是符合逻辑的，因为线程在操作不同的\
  \ `Bank` 实例时，它们无法相互干扰。\n\n这种锁被称为*重入的*（reentrant），因为线程可以重复获取它已经拥有的锁。锁具有一个*持有计数*（hold\
  \ count），用于跟踪对 `lock` 方法的嵌套调用。线程必须对每次调用 `lock` 调用一次 `unlock`，以释放锁。由于这一特性，受锁保护的代码可以调用另一个使用相同锁的方法。\n\
  \n例如，`transfer` 方法调用了 `getTotalBalance` 方法，该方法也锁定了 `bankLock` 对象，此时该持有计数为 `2`。当\
  \ `getTotalBalance` 方法退出时，持有计数回到 `1`。当 `transfer` 方法退出时，持有计数为 `0`，线程释放锁。\n\n通常情况下，你可能希望保护更新或检查共享对象的代码块，这样你就可以确保这些操作在另一个线程使用同一对象之前已经执行完毕。\n\
  \n***\n\n![Image](img/image00950.jpeg) 注意\n\n务必确保临界区中的代码不会因抛出异常而被跳过。如果在区域结束之前抛出异常，`finally`\
  \ 子句将释放锁，但对象可能处于受损状态。\n\n***\n\n### java.util.concurrent.locks.Lock **5.0**\n\n\
  - `void lock()` 获取此锁；如果锁当前由另一个线程拥有，则阻塞。\n- `void unlock()` 释放此锁。\n\n***\n\n### java.util.concurrent.locks.ReentrantLock\
  \ **5.0**\n\n- `ReentrantLock()` 构造一个重入锁，可用于保护临界区。\n- `ReentrantLock(boolean fair)`\
  \ 根据给定策略构造一个锁。\n\n***\n\n#### 14.5.4 条件对象 (Condition Objects)\n\n通常，线程进入临界区后才发现它无法继续执行。我们等待直到条件满足。这就是条件对象（condition\
  \ objects）的用场。\n\n一个锁对象可以有一个或多个关联的条件对象。你通过 `newCondition` 方法获取条件对象。习惯上是为每个条件对象命名一个名称，唤起它所代表的条件。例如，在这里我们设置了一个条件对象来表示“资金充足”条件。\n\
  \n点击此处查看代码图片\n\n```java\nclass Bank\n{\n   private Condition sufficientFunds;\n\n\
  \   . . .\n\n   public Bank()\n   {\n      . . .\n      sufficientFunds = bankLock.newCondition();\n\
  \   }\n}\n```\n\n如果 `transfer` 方法发现资金不足，它会调用：\n\n`sufficientFunds.await();`\n\n\
  当前线程现在被去激活并放弃锁。这让另一个线程进入，我们希望它能增加账户余额。\n\n等待获取锁的线程与调用了 `await` 的线程之间存在本质区别。一旦线程调用了\
  \ `await` 方法，它就会进入该条件的*等待集*（wait set）。当锁可用时，线程*不会*变为可运行状态。相反，它会保持未激活状态，直到另一个线程在同一个条件上调用了\
  \ `signalAll` 方法。\n\n\n\n\n\n当另一个线程转移了资金后，它应该调用\n\n`sufficientFunds.signalAll();`\n\
  \n此调用会重新激活所有等待该条件的线程。当这些线程从等待集中被移除时，它们再次变为可运行状态，调度器最终会再次激活它们。此时，它们将尝试重新进入该对象。一旦锁可用，其中一个线程将获取锁*并从它停止的地方继续执行*，并从\
  \ `await` 调用处返回。\n\n此时，线程应该再次测试该条件。这无法保证该条件现在已经满足——`signalAll` 方法只是向等待的线程发出信号，说明条件在此时*可能*已经满足，值得再次检查该条件。\n\
  \n* *\n\n![Image](img/image00948.jpeg) 注意\n\n通常情况下，对 `await` 的调用应该位于如下形式的循环内部：\n\
  \n```java\nwhile (!(ok to proceed)) {\n    condition.await();\n}\n```\n\n* *\n\n\
  *某些*其他线程调用 `signalAll` 方法是至关重要的。当一个线程调用 `await` 时，它无法重新激活自己。它只能寄希望于其他线程。如果没有其中任何一个线程去重新激活等待的线程，它将永远不会再次运行。这可能导致不快的*死锁*情况。如果所有其他线程都被阻塞，而最后一个活跃的线程调用\
  \ `await` 且没有解除其中任何一个线程，它也会被阻塞。此时没有线程可以解除阻塞其他线程，程序就会挂起。\n\n你应该何时调用 `signalAll`？经验法是，每当对象的状态发生可能对等待线程有利的变化时，就调用\
  \ `signalAll`。例如，每当账户余额变化时，等待线程都应该获得另一个检查余额的机会。在我们的示例中，当我们完成资金转移后调用 `signalAll`。\n\
  \n点击此处查看代码图像\n\n```java\npublic void transfer(int from, int to, int amount) {\n\
  \    bankLock.lock();\n    try {\n        while (accounts[from] < amount)\n    \
  \        sufficientFunds.await();\n        // 转移资金\n        // . .\n        sufficientFunds.signalAll();\n\
  \    } finally {\n        bankLock.unlock();\n    }\n}\n```\n\n注意，对 `signalAll`\
  \ 的调用不会立即激活等待线程。它只是解除了等待线程的阻塞，以便它们在当前线程退出同步方法后可以竞争进入对象。\n\n另一种方法 `signal` 只会从等待集中随机解除一个线程。这比解除所有线程的阻塞效率更高，但存在危险。\n\
  \n如果被随机选中的线程发现自己仍然无法继续，它将再次被阻塞。如果没有其他线程再次调用 `signal`，系统就会死锁。\n\n* *\n\n![Image](img/image00950.jpeg)\
  \ 警告\n\n线程只有在拥有该条件的锁时，才能对该条件调用 `await`、`signalAll` 或 `signal`。\n\n* *\n\n如果你运行列表\
  \ 14.8 中的示例程序，你会发现没有发生错误。总余额永远保持在 100,000 美元。没有任何账户的余额曾为负数。（再次，按 Ctrl+C 终止程序。）你可能还会注意到程序运行稍慢——这是你为同步机制中涉及的额外账目工作付出的代价。\n\
  \n在实践中，正确使用条件可能非常有挑战性。在开始实现自己的条件对象之前，你应该考虑使用第 14.10 节中描述的“同步器”构造结构之一，位于第 [905]](#part0020_split_001.xhtml_ch14lev1sec10)\
  \ 页。\n\n列表 14.8. synch/Bank.java\n\n点击此处查看代码图像\n\n* *\n\n```java\npackage synch;\n\
  \nimport java.util.concurrent.locks.*;\n\n/**\n * 一个拥有多个银行账户的银行，使用锁来序列化访问。\n * @version\
  \ 1.30 2004-08-01\n * @author Cay Horstmann\n */\npublic class Bank {\n    private\
  \ double[] accounts;\n    private Lock bankLock;\n    private Condition sufficientFunds;\n\
  \n    /**\n     * 构造银行。\n     * @param n 账户的数量\n     * @param initialBalance 每个账户的初始余额\n\
  \     */\n    public Bank(int n, double initialBalance) {\n        accounts = new\
  \ double[n];\n        for (int i = 0; i < accounts.length; i++)\n            accounts[i]\
  \ = initialBalance;\n        bankLock = new ReentrantLock();\n        sufficientFunds\
  \ = bankLock.newCondition();\n    }\n\n    /**\n     * 将资金从一个账户转移到另一个账户。\n     *\
  \ @param from 要转移的账户\n     * @param to 要转的账户\n     * @param amount 要转移的金额\n    \
  \ */\n    public void transfer(int from, int to, double amount) throws InterruptedException\
  \ {\n        bankLock.lock();\n        try {\n            while (accounts[from]\
  \ < amount)\n                sufficientFunds.await();\n            System.out.print(Thread.currentThread());\n\
  \            accounts[from] -= amount;\n            System.out.printf(\" %10.2f\
  \ from %d to %d\", amount, from, to);\n            accounts[to] += amount;\n   \
  \         System.out.printf(\" Total Balance: %10.2f%n\", getTotalBalance());\n\
  \            sufficientFunds.signalAll();\n        } finally {\n            bankLock.unlock();\n\
  \        }\n    }\n\n    /**\n     * 获取所有账户余额的总和。\n     * @return 总余额\n     */\n\
