  点击此处查看代码图片\n\n```java\npackage bounce;\n\nimport java.awt.geom.*;\n\n/**\n * 在矩形边缘移动并反弹的球类\n\
  \ * @version 1.33 2007-05-17\n * @author Cay Horstmann\n */\npublic class Ball\n\
  {\n    private static final int XSIZE = 15;\n    private static final int YSIZE\
  \ = 15;\n    private double x = 0;\n    private double y = 0;\n    private double\
  \ dx = 1;\n    private double dy = 1;\n\n    /**\n     * 将球移动到下一个位置，如果撞击边缘之一则反转方向\n\
  \     */\n    public void move(Rectangle2D bounds)\n    {\n        x += dx;\n  \
  \      y += dy;\n        if (x < bounds.getMinX())\n        {\n            x = bounds.getMinX();\n\
  \            dx = -dx;\n        }\n        if (x + XSIZE >= bounds.getMaxX())\n\
  \        {\n            x = bounds.getMaxX() - XSIZE;\n            dx = -dx;\n \
  \       }\n        if (y < bounds.getMinY())\n        {\n            y = bounds.getMinY();\n\
  \            dy = -dy;\n        }\n        if (y + YSIZE >= bounds.getMaxY())\n\
  \        {\n            y = bounds.getMaxY() - YSIZE;\n            dy = -dy;\n \
  \       }\n    }\n\n    /**\n     * 获取球在当前位置的形状\n     */\n    public Ellipse2D getShape()\n\
  \    {\n        return new EllipseD.Double(x, y, XSIZE, YSIZE);\n    }\n}\n```\n\
  \n### 列表 14.3. `bounce/BallComponent.java`\n\n点击此处查看代码图片\n\n```java\npackage bounce;\n\
  \nimport java.awt.*;\nimport java.util.*;\nimport javax.swing.*;\n\n/**\n * 绘制球的组件。\n\
  \ * @version 1.34 2012-01-26\n * @author Cay Horstmann\n */\npublic class BallComponent\
  \ extends JPanel\n{\n    private static final int DEFAULT_WIDTH = 450;\n    private\
  \ static final int DEFAULT_HEIGHT = 350;\n\n    private java.util.List<Ball> balls\
  \ = new ArrayList<>();\n\n    /**\n     * 向组件添加球。\n     * @param b 要添加的球\n     */\n\
  \    public void add(Ball b)\n    {\n        balls.add(b);\n    }\n\n    public\
  \ void paintComponent(Graphics g)\n    {\n        super.paintComponent(g); // 清除背景\n\
  \        Graphics2D g2 = (Graphics2D) g;\n        for (Ball b : balls)\n       \
