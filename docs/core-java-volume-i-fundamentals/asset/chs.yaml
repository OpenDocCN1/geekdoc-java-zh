  \n        // 绘制消息\n        g2.drawString(message, (int) x, (int) baseY);\n\n   \
  \     g2.setPaint(Color.LIGHT_GRAY);\n\n        // 绘制基线\n        g2.draw(new Line2D.Double(x,\
  \ baseY, x + bounds.getWidth(), baseY));\n        // 绘制包矩形\n        Rectangle2D\
  \ rect = new Rectangle2D.Double(x, y, bounds.getWidth(), bounds.getHeight());\n\
