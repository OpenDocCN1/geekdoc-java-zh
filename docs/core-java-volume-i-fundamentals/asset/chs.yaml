  \ GregorianCalendar(1915, Calendar.DECEMBER, 10));\n        pq.add(new GregorianCalendar(1903,\
  \ Calendar.DECEMBER, 3));\n        pq.add(new GregorianCalendar(1910, Calendar.JUNE,\
  \ 22));\n\n        System.out.println(\"遍历元素...\");\n        for (GregorianCalendar\
  \ date : pq) {\n            System.out.println(date.get(Calendar.YEAR));\n     \
  \   }\n\n        System.out.println(\"移除元素...\");\n        while (!pq.isEmpty())\
  \ {\n            System.out.println(pq.remove().get(Calendar.YEAR));\n        }\n\
  \    }\n}\n```\n\n\n\n以下是如何设置一个用于存储员工的 map：\n\n点击此处查看代码图像\n\n```java\nMap<String,\
  \ Employee> staff = new HashMap<>(); // HashMap 实现 Map\n\nEmployee harry = new Employee(\"\
  Harry Hacker\");\n\nstaff.put(\"987-98-9996\", harry);\n```\n\n. . .\n\n每当你向 map\
  \ 中添加对象时，都必须提供一个键（key）。在我们的案例中，键是一个字符串，对应的值（value）是一个 `Employee` 对象。\n\n要检索对象，你必须使用（因此要记住）键。\n\
  \n```java\nString s = \"987-98-9996\";\ne = staff.get(s); // 获取 harry\n```\n\n如果\
  \ map 中没有存储指定特定键的信息，`get` 将返回 `null`。\n\n键必须是唯一的。你不能用相同的键存储两个值。如果你使用相同的键调用两次 `put`\
  \ 方法，第二个值将替换掉第一个值。事实上，`put` 会返回之前与该键参数关联的旧值。\n\n`remove` 方法会从 map 中删除具有给定键的元素。`size`\
  \ 方法返回 map 中条目的数量。\n\n集合框架（collections framework）并不将 map 本身视为集合。（其他数据结构框架将 map 视为键值对的集合，或视为由键索引的值集合。）然而，你可以获取\
  \ map 的视图（views）——实现了 `Collection` 接口或其子接口的对象。\n\n有三种视图：键的集合（keySet）、值的集合（values，它不是集合）以及键值对的集合（entrySet）。键和键值对形成了一个集合，因为\
  \ map 中一个键只能有一个副本。以下方法：\n\n```java\nSet<K> keySet()\nCollection<K> values()\nSet<Map.Entry<K,\
  \ V>> entrySet()\n```\n\n返回了这三种视图。（entry 集合中的元素是静态内部类 `Map.Entry` 的对象。）\n\n注意，`keySet`\
  \ 不是 `HashSet` 或 `TreeSet`，而是实现 `Set` 接口的某个类的对象。`Set` 接口扩展了 `Collection` 接口。因此，你可以像使用任何集合一样使用\
  \ `keySet`。\n\n例如，你可以枚举 map 的所有键：\n\n```java\nSet<String> keys = map.keySet();\n\
  for (String key : keys)\n{\n   // 对 key 进行某些操作\n}\n```\n\n***\n\n![图像](img/image00949.jpeg)\
  \ Tips\n\n如果你想同时查看键和值，可以通过枚举条目（entries）来避免值的查找。使用以下代码骨架：\n\n点击此处查看代码图像\n\n```java\n\
  for (Map.Entry<String, Employee> entry : staff.entrySet())\n{\n   String key = entry.getKey();\n\
  \   Employee value = entry.getValue();\n   // 对 key, value 进行某些操作\n}\n```\n\n如果你调用迭代器的\
  \ `remove` 方法，你实际上会从 map 中删除该键及其关联的值。然而，你不能向键的集合视图中添加元素。在不同时添加值的情况下，添加键是没有意义的。如果你尝试调用\
  \ `add` 方法，它会抛出 `UnsupportedOperationException`。entry 集合视图也有同样的的限制，尽管在概念上添加一个新的键值对是有意义的。\n\
  \n***\n\n列表 13.6 展示了 map 的工作原理。我们首先向 map 中添加键值对。然后，我们从 map 中删除一个键，这也会删除其关联的值。接下来，我们更改与某个键关联的值，并调用\
  \ `get` 方法查找一个值。最后，我们遍历 entry 集合。\n\n列表 13.6 map/MapTest.java\n\n点击此处查看代码图像\n\n\
  ***\n\n```java\n1  package map;\n2\n3  import java.util.*;\n4\n5  /**\n6    * 此程序演示了键类型为\
  \ String、值类型为 Employee 的 map 的用法。\n7    * @version 1.11 2012-01-26\n8    * @author\
