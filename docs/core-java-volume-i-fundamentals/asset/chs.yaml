  \                catch (MalformedURLException e)\n                {\n          \
  \          e.printStackTrace();\n                }\n            }\n        };\n\
  \    }\n}\n```\n\n# 第 3 章. Java 中的基础编程结构\n\n本章\n* 一个简单的 Java 程序\n* 注释\n* 数据类型\n\
  * 变量\n* 运算符\n* 字符串\n* 输入与输出\n* 控制流\n* 大数\n* 数组\n\n在此，我们假设你已经成功安装了 JDK 并能够运行我们在第\
  \ 2 章中展示的示例。现在是时候开始编程了。\n\n### 3.1.简单的 Java 程序\n\n让我们仔细观察一个最简单的 Java 程序示例——一个仅仅向控制台打印信息的程序：\n\
  \n点击此处查看代码图像\n\n```java\npublic class FirstSample\n{\n    public static void main(String[]\
  \ args)\n    {\n        System.out.println(\"We will not use 'Hello, World!'\");\n\
  \    }\n}\n```\n\n花时间熟悉这个示例的框架，这些部分将在所有应用程序中出现。首先，Java 对大小写敏感。如果你在大小写上犯了任何错误（例如用\
  \ `Main` 代替 `main`），程序将无法运行。\n\n现在让我们逐行查看这段源码。`public` 关键字被称为*修饰符*；这些修饰符控制程序其他部分对此代码的访问权限。我们将在第\
  \ 5 章](#part0010.xhtml_ch05)中对修饰符进行更多讨论。`class` 关键字提醒你 Java 程序中的一切都存在于类之中。虽然我们将在下一章对类花费更多时间，但目前请将类视为一个定义应用程序行为的程序逻辑容器。\n\
  \n紧随 `class` 关键字之后的是类名。Java 类名的命名规则非常宽松。名称必须以字母开头，之后可以是字母和数字的任意组合。长度本质上没有限制。你不能使用\
  \ Java 保留字（例如 `public` 或 `class`）作为类名。（请参见附录中的保留字列表。）\n\n\n\n\n\n# Java 基础\n\n标准的命名规范（我们在\
  \ `FirstSample` 名称中遵循了这一规范）是类名是以大写字母开头的名词。如果一个名称由多个单词组成，请每个单词的首字母都大写。（这种在单词中间使用大写字母写法有时被称为“驼峰命名法”（camel\
  \ case），或者自指地称为“CamelCase”。）\n\n你需要将源代码的文件名与公共类的名称相同，并加上扩展名 `.java`。因此，你必须将此代码存储在名为\
  \ `FirstSample.java` 的文件中。（再次，大小写是重要的——不要使用 `firstsample.java`。）\n\n如果你正确命名了文件且源代码中没有拼写错误，那么当你编译这段源代码时，就会得到一个包含该类字节码的文件。Java\
  \ 编译器会自动将字节码文件命名为 `FirstSample.class`，并将其存储在源文件相同的目录下。最后，通过以下命令启动程序：\n\n```\njava\
  \ FirstSample\n```\n\n（记住省略 `.class` 扩展名。）当程序执行时，它仅仅会在控制台上显示字符串 `We will not use\
  \ 'Hello, World!'`。\n\n当你使用\n\n```\njava ClassName\n```\n\n来运行编译后的程序时，Java 虚拟机始终会从你指定的类中\
  \ `main` 方法的代码开始执行。（“方法”一词是 Java 的专业术语，对应函数。）因此，为了让你的代码执行，你的类源文件中*必须*有一个 `main`\
  \ 方法。当然，你可以在类中添加你自己的方法，并在 `main` 方法中调用它们。（我们将在下一章介绍如何编写自己的方法。）\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 备注\n\n根据 Java 语言规范，`main` 方法必须被声明为 `public`。（Java 语言规范是描述 Java 语言的官方文档。你可以从 [`docs.oracle.com/javase/specs`](http://docs.oracle.com/javase/specs)\
  \ 查看或下载它。）\n\n然而，多个版本的 Java 启动器在 `main` 方法不是 `public` 的情况下也愿意执行 Java 程序。一名程序员提交了一个错误报告。要查看它，请访问\
  \ [`bugs.sun.com/bugdatabase/index.jsp`](http://bugs.sun.com/bugdatabase/index.jsp)\
  \ 并输入错误识别码 `4252539`。该错误被标记为“关闭，不会修复”。一位 Sun 工程师添加了解释，说明 Java 虚拟机规范（位于 [`docs.oracle.com/javase/specs/jvms/se7/html`](http://docs.oracle.com/javase/specs/jvms/se7/html)）并没有强制\
  \ `main` 必须是 `public`，并且“修复它会导致潜在的麻烦”。幸运的是，理性最终取得了胜利。Java SE 1.4 及更高版本的 Java 启动器强制要求\
  \ `main` 方法必须是 `public`。\n\n这个故事有几个有趣的方面。一方面，让质量保证工程师（他们通常工作过度，且并不总是 Java 细微之处的专家）对错误报告做出令人怀疑的决策是令人沮丧的。另一方面，Sun\
  \ 在 Java 开源很久以前就让错误报告及其解决方案可供任何人审查，这是非常了不起的。“错误大游行”对程序员来说是一个非常实用的资源。你甚至可以为你喜欢的错误投票。票数较多的错误在下一个\
  \ JDK 版本中被修复的概率更高。\n\n***\n\n注意源代码中的大括号 `{ }`。在 Java 中，像 C/C++ 一样，大括号划定了程序中的部分（通常称为*块*）。在\
  \ Java 中，任何方法的代码都必须以左大括号 `{` 开始，并以右大括号 `}` 结束。\n\n大括号的风格引发了大量的无用争议。我们遵循一种让匹配的大括号对齐的风格。由于空格对\
  \ Java 编译器是无关的，你可以使用任何喜欢的的大括号风格。当我们讨论各种类型的循环时，我们会对大括号的使用进行更多说明。\n\n目前，不要担心 `static\
  \ void` 关键字——只需将它们看作是让 Java 程序编译所需要的内容的一部分。到第 4 章结束时，你将完全理解这个咒语。目前需要记住点是，每个 Java\
  \ 应用都必须有一个以下方式声明的 `main` 方法：\n\n```java\npublic class ClassName\n{\n   public static\
  \ void main(String[] args)\n   {\n      program statements\n   }\n}\n```\n\n***\n\
  \n![Image](img/image00951.jpeg) C++ 备注\n\n作为一名 C++ 程序员，你知道什么是类。Java 类与 C++ 类相似，但有几个可能会误导你的区别。例如，在\
  \ Java 中，*所有*函数都是某个类的方法。（标准术语将它们称为方法，而不是成员函数。）因此，在 Java 中，你必须为 `main` 方法准备一个外壳类。你可能也熟悉\
  \ C++ 中*静态成员函数*的概念。这些是定义在类内部但不操作对象的成员函数。Java 中的 `main` 方法始终是静态的。最后，与 C/C++ 一样，`void`\
  \ 关键字表示该方法不返回任何值。与 C/C++ 不同，`main` 方法不会向操作系统返回“退出代码”。\n\n***\n\n接下来，请注意这段片段：\n\n\
  点击此处查看代码\n\n```java\n{\n   System.out.println(\"We will not use 'Hello, World!');\n\
  }\n```\n\n大括号标记了*方法体*的开始和结束。这个方法只有一个语句。和大多数语言一样，每条语句都必须以分号结束。特别是，换行符并不标记语句的结束，因此语句可以跨越多个行。`main`\
  \ 方法体包含一个输出单行文本的语句。在这里，我们正在使用 `System.out` 对象并调用它的 `println` 方法。注意用于调用方法的点符号。Java\
  \ 使用通用语法：\n\n`object.method(parameters)`\n\n在这种情况下，我们正在调用 `println` 方法并向它传递一个字符串参数。该方法在控制台上显示该字符串参数。然后它结束输出行，因此每次调用\
  \ `println` 都会在新的一行显示其输出。Java 中的方法像任何语言中的函数一样，可以使用零、一个或多个*参数*（一些程序员将其称为*形参*）。即使方法不接受参数，你也必须使用空括号。例如，没有参数的\
  \ `println` 方法变体只是打印一个空行。你通过以下调用执行它：\n\n```java\nSystem.out.println();\n```\n\n\
  ***\n\n![Image](img/image00948.jpeg) 备注\n\n`System.out` 还有一个 `print` 方法，它不会向输出添加换行符。例如，`System.out.print(\"\
  Hello\")` 会打印 `Hello` 而不换行。下一个输出将紧接在字母 `o` 之后。\n\n***\n\n### 3.2 注释\n\nJava 中的注释与大多数编程语言一样，不会出现在可执行程序中。因此，你可以根据需要添加尽可能多的注释，而不用担心代码膨胀。Java\
  \ 有三种标记注释的方法。最常见的形式是 `//`。你用它来编写从 `//` 到行尾的注释。\n\n```java\nSystem.out.println(\"\
  We will not use 'Hello, World!'\"); // 这样太可爱了吗？\n```\n\n当需要较长的注释时，你可以为每行标记 `//`，或者使用\
  \ `/*` 和 `*/` 注释定界符来划分一段较长的注释。\n\n\n\n\n最后，第三种注释可用于自动生成文档。这种注释用 `/**` 开始，用 `*/`\
  \ 结束。你可以在列表 3.1 中看到此类注释。关于此类注释以及自动文档文档的更多信息，请参阅第 4 章。\n\n列表 3.1. `FirstSample/FirstSample.java`\n\
  \n点击此处查看代码图像\n\n***\n\n```\n1  /**\n2    * This is the first sample program in Core\
  \ Java Chapter 3\n3    * @version 1.01 1997-03-22\n4    * @author Gary Cornell\n\
  5    */\n6  public class FirstSample\n7  {\n8      public static void main(String[]\
  \ args)\n9      {\n10         System.out.println(\"We will not use 'Hello, World!'\"\
  );\n11     }\n12 }\n```\n\n***\n\n![Image](img/image00950.jpeg) 注意\n\n`/* */` 注释在\
  \ Java 中不能嵌套。也就是说，你无法仅仅通过将代码放在 `/*` 和 `*/` 之间来禁用，因为你想要禁用的代码本身可能包含 `*/` 分隔符。\n\n\
  ***\n\n### 3.3. 数据类型\n\nJava 是一种*强类型语言*。这意味着每个变量必须有一个定义的类型。Java 中八种*基本类型*。其中四种是整数类型；两种是浮点数类型；一种是字符类型\
  \ `char`，用于 Unicode 编码方案中的代码单元（参见第 3.3.3 节中的“`char` 类型”，位于第 49 页）；以及还有一种是用于布尔值的\
  \ `boolean` 类型。\n\n***\n\n![Image](img/image00948.jpeg) 笔记\n\nJava 有一个任意精度算术包。然而，所谓的“大数”是\
  \ Java *对象*，而不是一种新的 Java 类型。你将在本章稍后的部分看到如何使用它们。\n\n***\n\n### 3.3.1. 整数类型\n\n整数类型用于没有小数部分的数字。允许负值。Java\
  \ 提供了表 3.1 所示的四种整数类型。\n\n表 3.1. Java 整数类型\n\n![Image](img/image00967.jpeg)\n\n在大多数情况下，`int`\
  \ 类型是最实用的。如果你想表示地球上的人口数量，你将需要借助 `long`。`byte` 和 `short` 类型主要用于特殊应用程序，例如低级文件处理，或在存储空间紧张的情况下用于大型数组。\n\
  \n在 Java 中，整数类型的范围不取决于你运行 Java 代码的机器。这减轻了想要将软件从一个平台移动到另一个平台（甚至是同一平台的不同操作系统之间）的程序员的巨大烦恼。相比之下，C\
  \ 和 C++ 程序为每个处理器使用最高效的整数类型。结果，在 32 位处理器上运行良好的 C 程序可能在 16 位系统上出现整数溢出。由于 Java 程序必须在所有机器上具有相同的运行，因此各种类型的范围是固定的。\n\
  \n长整数有一个后缀 `L`（例如，`4000000000L`）。十六进制数有一个前缀 `0x`（例如，`0xCAFE`）。八进制数有一个前缀 `0`。例如，`010`\
  \ 是 8。自然地，这可能会引起混淆，因此我们建议不要使用八进制常量。从 Java 7 开始，你可以使用前缀 `0b` 写二进制数字。例如，`0b1001` 是\
  \ 9。同样从 Java 7 开始，你可以在数字字面量中添加下划线，例如 `1_000_000`（或 `0b1111_0100_0010_0100_0000`）来表示百万。下划线仅供人类视觉识别。Java\
  \ 编译器会简单地删除它们。\n\n***\n\n![Image](img/image00951.jpeg) C++ 笔记\n\n在 C 和 C++ 中，`int`\
  \ 和 `long` 等类型的大小取决于目标平台。在像 8086 的 16 位处理器上，整数是 2 字节，但在 Pentium 或 SPARC 等 32 位处理器上，它们是\
  \ 4 字节。同样，`long` 值也是 4 字节。由于 Java 程序必须在所有机器上具有相同的运行，因此各种类型的范围是固定的。浮点值是 32 位和 64\
  \ 位。这些浮点值不是*无符号*的。\n\n***\n\n#### 3.3.2. 浮点类型\n\n浮点类型表示带有小数部分的数字。这些类型在表 3.2 所示。\n\
  \n表 3.2. 浮点类型\n\n![Image](img/image00968.jpeg) 在大多数情况下，`float` 类型是最实用的。如果你想表示地球上的人口数量，你将需要借助\
  \ `double`。`byte` 和 `short` 类型主要用于特殊应用程序，例如低级文件处理，或在存储空间紧张时用于大型数组。\n\n在 Java 中，浮点类型的范围不取决于你运行\
  \ Java 代码的机器。这减轻了想要将软件从一个平台移动到另一个平台（甚至是同一平台的不同操作系统之间）的程序员的巨大烦恼。相比之下，C 和 C++ 程序为每个处理器使用最高效的整数类型。结果，在\
  \ 32 位处理器上运行良好的 C 程序可能在 16 位系统上出现整数溢出。由于 Java 程序必须在所有机器上具有相同的运行，因此各种类型的范围是固定的。\n\
  \n浮点数有一个后缀 `f`（例如，`3.14f`）。十六进制数有一个前缀 `0x`（例如，`0x1.0p-2`）。八进制数有一个前缀 `0`。例如，`012`\
  \ 是 10。自然地，这可能会引起混淆，因此我们建议不要使用八进制常量。\n\n从 Java 7 开始，你可以使用前缀 `0b` 写二进制数字。例如，`0b1.001`\
  \ 是 9。同样从 Java 7 开始，你可以在数字字面量中添加下划线，例如 `1_000_000`（或 `0b1111_0100_0010_0100_0000`）来表示百万。下划线仅供人类视觉识别。Java\
  \ 编译器会简单地删除它们。\n\n***\n\n![Image](img/image00948.jpeg) 笔记\n\nJava 有一个任意精度算术包。然而，所谓的“大数”是\
  \ Java *对象*，而不是一种新的 Java 类型。你将在本章稍后的部分看到如何使用它们。\n\n***\n\n#### 3.3.3. char 类型\n\n\
  `char` 类型用于描述单个字符。最常见的是这些是字符常量。例如，`'A'` 是值为 65 的字符常量。它与包含单个字符的字符串 `\"A\"` 是不同的。Unicode\
  \ 代码单元可以以十六进制值表示，范围从 `\\u0000` 到 `\\uFFFF`。例如，`\\u2122` 是商标符号（™），`\\u03C0` 是希腊字母\
  \ pi（π）。\n\n\n\n\n除了指示 Unicode 代码单元编码的 `\\u` 转义序列外，还有几种用于特殊字符的转义序列，如表 3.3 所示。你可以在带引号的字符常量和字符串中使用这些转义序列，例如\
  \ `'\\u2122'` 或 `\"Hello\\n\"`。`\\u` 转义序列（但其他转义序列除外）甚至可以用带引号的字符常量和字符串之外。例如\n\n```\n\
  public static void main(String\\u005B\\u005D args)\n```\n\n表 3.3 特殊字符的转义序列\n\n![Image](img/image00969.jpeg)\n\
  \n是完全合法的`\\u005B` 和 `\\u005D` 是 `[` 和 `]` 的编码。\n\n为了完全理解 `char` 类型，你必须了解 Unicode\
  \ 编码方案。Unicode 的发明是为了克服传统字符编码方案的局限性。在 Unicode 之前，有许多不同的标准：美国的 `ASCII`、用于西欧语言的 `ISO\
  \ 8859-1`、俄语的 `KOI-8`、中文的 `GB18030` 和 `BIG-5` 等。这导致了两个问题：特定的代码值在不同的编码方案中对应不同的字母。此外，字符集较大的语言的编码是变长的：某些常用字符被编码为单字节，而另一些需要两个或更多字节。\n\
  \nUnicode 的设计是为了解决这些问题。当 20 世纪 80 年统一工作开始时，固定的 2 字节代码对于编码世界上所有语言使用的所有字符已经足够了，并且还有未来扩展的空间——当时大家都是这么想的。1991\
  \ 年，Unicode 1.0 发布，使用了可用 65,536 个代码值中略于一半的。Java 从一开始就被设计为使用 16 位 Unicode 字符，这对于使用\
  \ 8 位字符的其他编程语言来说是一项重大进步。\n\n遗憾，随着时间的推移，不可避免的事情发生了。Unicode 字符超过了 65,536 个，这主要是由于增加了大量用于中、日、韩的表字。现在，16\
  \ 位的 `char` 类型不足以描述所有的 Unicode 字符。\n\n我们需要一些术语来解释 Java（从 Java SE 5.0 开始）是如何解决这个问题的。*代码点*（code\
  \ point）是指与编码方案中的字符相关的代码值。在 Unicode 标准中，代码点以十六进制形式表示，并以 `U+` 为前缀，例如拉丁字母 A 的代码点为\
  \ `U+0041`。Unicode 的代码点被分在 17 个*代码平面*（code planes）中。第一个代码平面称为*基本多语言平面*（basic multilingual\
  \ plane），由代码点从 `U+0000` 到 `U+FFFF` 的“经典”Unicode 字符组成。另外的 16 个平面（代码点从 `U+10000` 到\
  \ `U+10FFFF`）包含了*补充字符*（supplementary characters）。\n\nUTF-16 编码用变长代码表示表示所有的 Unicode\
  \ 代码点。基本多语言平面中的字符表示为 16 位值，称为*代码单元*（code units）。补充字符被编码为两个连续的代码单元对。这种编码对中的每个值都落在基本多语言平面\
  \ 2048 个未使用值的范围之内，称为*代理区*（surrogates area）（第一个代码单元为 `U+D800` 到 `U+DBFF`，第二个代码单元为\
  \ `U+DC00` 到 `U+DFFF`）。这非常聪明，因为你可以立即判断一个代码单元编码的是单个字符，还是补充字符的第一或第二部分。例如，八元数集的数学符号\
  \ ![Image](img/image00970.jpeg) ([`math.ucr.edu/home/baez/octonions`](http://math.ucr.edu/home/baez/octonions))\
  \ 代码点为 `U+1D546`，由两个代码单元 `U+D835` 和 `U+DD46` 编码。（有关[编码算法的描述](http://en.wikipedia.org/wiki/UTF-16)](http://en.wikipedia.org/wiki/UTF-16%20for%20a%20description%20of%20the%20encoding%20algorithm.)）\n\
  \n在 Java 中，`char` 类型描述 UTF-16 编码中的*代码单元*。\n\n我们强烈建议除非实际上在操作 UTF-16 代码单元，否则不要在程序中使用\
  \ `char` 类型。你几乎总是应该将字符串（我们将在第 3.6 节中讨论，“字符串”，见第 64 页）视为抽象数据类型。\n\n### 3.3.4 boolean\
  \ 类型\n\n`boolean` 类型有两个值：`false` 和 `true`。它用于逻辑逻辑。你不能在整数和 `boolean` 值之间进行转换。\n\n\
  ![Image](img/image00951.jpeg) C++ 注意\n\n在 C++ 中，数字甚至指针都可以代替 `boolean` 值。\n\n###\
  \ 3.4 变量\n\n在 Java 中，每个变量都有类型。你通过先放置类型后放置名称来声明变量。这里有一些例子：\n\n```\ndouble salary;\n\
  int vacationDays;\nlong earthPopulation;\nboolean done;\n```\n\n注意每个声明末尾有分号。变量名必须以字母开头，并且是字母或数字的序列。注意，“字母”和“数字”术语在\
  \ Java 中要宽得多。字母定义为 `'A'–'Z'`、`'a'–'z'`、`'_'`、`'$'` 以及任何表示字母的 Unicode 字符。例如，德国用户可以使用变音\
  \ `ä`；希腊使用者可以使用 `π`。同样，数字是 `'0'–'9'` 以及任何表示数字的 Unicode 字符。符号 `'+'` 或 `'©'` 不能用于变量名，空格也不行。名称中的所有字符都是重要的，大小同样重要。变量名的长度本质上是没有限制的。\n\
  \n![Image](img/image0049.jpeg) 提示\n\n如果你真的好奇哪些 Unicode 字符对 Java 来说是“字母”，可以使用 `Character`\
  \ 类中的 `isIdentifierStart` 和 `isIdentifierPart` 方法进行检查。尽管 `$` 是有效的 Java 字母，但你不应该在自己的代码中使用它。它旨在用于\
  \ 编译器和其他工具生成的名称。\n\n你还不能将 Java 关键字用变量名。（参见附录中的关键字列表。）\n\n你可以在一行内有多个声明：\n\n```\n\
  int i, j;\n```\n\n然而，我们不建议这种风格。如果你单独声明每个变量，你的程序会更易读。\n\n#### 3.4.1 初始化变量\n\n在声明变量后，你必须通过赋值语句显式地初始化它——永远不能使用未初始化变量的值。例如，Java\
  \ 编译器会将以下语句序列标记为错误：\n\n```\nint vacationDays;\n```\n\n\n\n\n```java\nSystem.out.println(vacationDays);\
  \ // ERROR--变量未初始化\n```\n\n你通过在左侧使用变量名、等号（`=`），然后在右侧使用带有适当值的 Java 表达式来为之前声明的变量赋值。\n\
  \n```java\nint vacationDays;\n```\n\n```java\nvacationDays = 12;\n```\n\n你可以在同一行声明并初始化变量。例如：\n\
  \n```java\nint vacationDays = 12;\n```\n\n最后，在 Java 中，你可以在代码的任何地方放置声明。例如，以下是 Java\
  \ 中有效的代码：\n\n点击此处查看代码\n\n```java\ndouble salary = 65000.0;\n\nSystem.out.println(salary);\n\
  \nint vacationDays = 12; // 在此处声明变量是允许\n```\n\n在 Java 中，将变量声明在尽可能靠近第一次使用的地方被认为是良好的风格。\n\
  \n***\n\n![Image](img/image00951.jpeg) C++ 注意\n\nC 和 C++ 区分变量的 `declaration`（声明）和\
  \ `definition`（定义）。例如，\n\n```java\nint i = 10;\n```\n\n是一个定义，而\n\n```java\nextern\
  \ int i;\n```\n\n是一个声明。在 Java 中，声明并不独立于定义。\n\n***\n\n### 3.4.2. 常量\n\n在 Java 中，你使用关键字\
  \ `final` 来表示常量。例如：\n\n点击此处查看代码\n\n```java\npublic class Constants\n{\n    public\
  \ static void main(String[] args)\n    {\n      final double CM_PER_INCH = 2.54;\n\
  \      double paperWidth = 8.5;\n      double paperHeight = 11;\n      System.out.println(\"\
  Paper size in centimeters: \"\n          + paperWidth * CM_PER_INCH + \" by \" +\
  \ paperHeight * CM_PER_INCH);\n    }\n}\n```\n\n关键字 `final` 表示你只能对该变量赋值一次，然后它的值就固定了。习惯上使用全大写字母命名常量。\n\
  \n在 Java 中，更常见的做法创建一个常量，以便在单个类内的多个方法中可用。这些通常被称为 *类常量*。使用关键字 `static final` 来建立一个类常量。这里是一个使用类常量的示例：\n\
  \n点击此处查看代码\n\n```java\npublic class Constants2\n{\n    public static final double\
  \ CM_PER_INCH = 2.54;\n    public static void main(String[] args)\n    {\n     \
  \ double paperWidth = 8.5;\n      double paperHeight = 11;\n      System.out.println(\"\
  Paper size in centimeters: \"\n          + paperWidth * CM_PER_INCH + \" by \" +\
  \ paperHeight * CM_PER_INCH);\n    }\n}\n```\n\n注意，类常量的定义出现在 `main` 方法*之外*。因此，该常量也可以同类的其他方法中使用。此外，如果常量像我们的示例中那样被声明为\
  \ `public`，其他类的方法也可以使用它——在我们的示例中，通过 `Constants2.CM_PER_INCH` 使用。\n\n***\n\n![Image](img/image00951.jpeg)\
  \ C++ 注意\n\n`const` 是 Java 的保留关键字，但它目前没有用于任何地方。你必须使用 `final` 来表示常量。\n\n***\n\n###\
  \ 3.5. 运算符\n\nJava 中使用常用的算术运算符 `+`、`-`、`*`、`/` 用于加、减、乘、除。如果两个参数都是整数，`/` 运算符表示整数除，否则表示浮点除法。整数余数（有时称为\
  \ *modulus*）由 `%` 表示。例如，`15 / 2` 是 `7`，`15 % 2` 是 `1`，而 `15.0 / 2` 是 `7.5`。\n\n\
  注意，整数除以 0 会抛出异常，而浮点除以 0 会产生无限或 NaN 结果。\n\n在赋值中使用二元算术运算符有一个方便的快捷方法。例如，\n\n```java\n\
  x += 4;\n```\n\n等同于\n\n```java\nx = x + 4;\n```\n\n（通常情况下，将运算符放在 `=` 号左侧，例如 `*=`\
  \ 或 `%=`。）\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\nJava 编程语言的目标之一是可移植性。无论由哪个虚拟机执行，计算都应该产生相同的结果。对于浮点数的算术计算...[为了简洁已省略文本，但遵循相同的逻辑]\n\
  \n### 3.5.1. 增和递减运算符\n\n程序员当然知道，变量最常用的操作之一是加或减 1。Java 遵循 C 和 C++ 的脚步，同时具有增和递减运算符：`n++`\
  \ 给 `n` 的当前值加 1，而 `n--` 将其减 1。例如，以下代码\n\n```java\nint n = 12;\nn++;\n```\n\n将 `n`\
  \ 变为 `13`。由于这些运算符会改变变量的值，它们不能应用于数字。例如，`4++` 不是一个合法的语句。\n\n这些运算符实际上有两种形式；你刚刚看到的是操作数后面的后缀形式。还有一种前缀形式，`++n`。两者都会将变量的值改变\
  \ 1。它们之间的区别只在它们位于表达式内部时出现。前缀形式先执行加法；后缀形式求变量的老值。\n\n```java\nint m = 7;\nint n =\
  \ 7;\nint a = 2 * ++m; // 现在 a 是 16，m 是 8\nint b = 2 * n++; // 现在 b 是 14，n 是 8\n\
  ```\n\n我们建议不要在表达式中使用 `++`，因为这通常会导致代码混淆和讨厌的 bug。\n\n### 3.5.2. 关系和布尔运算符\n\nJava 拥有完整的关系运算符。要测试相等性，使用双等号\
  \ `==`。例如，以下的值\n\n```java\n3 == 7\n```\n\n是 `false`。\n\n使用 `!=` 表示不相等。例如，以下的值\n\n\
  ```java\n3 != 7\n```\n\n是 `true`。\n\n\n\n\n最后，你还有常用的 `<`（小于）、`>`（大于）、`<=`（小于等于）和\
  \ `>=`（大于等于）运算符。\n\nJava 遵循 C++ 的习惯，使用 `&&` 作为逻辑“与”运算符，使用 `||` 作为逻辑“或”运算符。正如你从 `!=`\
  \ 运算符中很容易记住的那样，感叹号 `!` 是逻辑非反运算符。`&&` 和 `||` 运算符以“短路”方式求值：如果第一个参数已经确定了值，则不再对第二个参数求值。如果你用\
  \ `&&` 运算符结合两个表达式：\n\n```\nexpression[1] && expression[2]\n```\n\n并且第一个表达式的真值已确定为\
  \ `false`，那么结果就不可能为 `true`。因此，第二个表达式的值**不会**被计算。这种行为可以被用来避免错误。例如，在表达式\n\n```\nx\
  \ != 0 && 1 / x > x + y // 避免除以零\n```\n\n如果 `x` 等于零，则第二部分永远不会被执行。因此，如果 `x` 为零，则不会计算\
  \ `1 / x`，也就不会发生除以零错误。\n\n同样，如果第一个表达式为 `true`，则 `expression[1]` `||` `expression[2]`\
  \ 的值自动为 `true`，而无需评估第二个表达式。\n\n最后，Java 支持偶尔有用的三元运算符 `?:`。该表达式\n\n```\ncondition\
  \ ? expression[1] : expression[2]\n```\n\n如果条件为 `true`，则该表达式求值为第一个表达式；否则，求值为第二个表达式。例如：\n\
  \n```\nx < y ? x : y\n```\n\n给出 `x` 和 `y` 之间的较小值。\n\n### 3.5.3. 位运算符\n\n在处理任何整数类型时，你都拥有的可以直接操作组成整数的二进制位的运算符。这意味着你可以使用掩码技术来获取数字中的单个位。位运算符是：\n\
  \n`&`（“与”） `|`（“或”） `^`（“异或”） `~`（“非/反”）\n\n这些运算符作用于位模式。例如，如果 `n` 是一个整数变量，那么：\n\n\
  ```\nint fourthBitFromRight = (n & 0b1000) / 0b1000;\n```\n\n如果 `n` 的二进制表示从右侧起第四位是\
  \ `1`，则给你 `1`，否则为 `0`。使用 `&` 配合适当的 2 的幂可以让你屏蔽除单个位以外的所有位。\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n当应用于 `boolean` 值时，`&` 和 `|` 运算符产生一个 `boolean` 值。这些运算符与 `&&` 和 `||` 运算符类似，但\
  \ `&` 和 `|` 运算符不是以“短路”方式求值的。也就是说，在计算结果之前，两个参数都会求值。\n\n还有 `>>` 和 `<<` 运算符，可以将位模式向右或向左移动。当你构建位模式来进行位掩码时，这些运算符非常方便：\n\
  \n```\nint fourthBitFromRight = (n & (1 << 3)) >> 3;\n```\n\n最后，`>>>` 运算符会将高位填充为零，而\
  \ `>>` 会将符号位扩展到高位。没有 `<<<` 运算符。\n\n![Image](img/image00950.jpeg) 注意\n\n移位运算符的右侧参数将对\
  \ 32 取模（除非左侧是 `long`，在这种情况下右侧对 64 取模）。例如，`1 << 35` 的值等于 `1 << 3` 或 `8`。\n\n![Image](img/image00951.jpeg)\
  \ C++ 注意\n\n在 C/C++ 中，无法保证 `>>` 执行的是算术移位（扩展符号位）还是逻辑移位（填充零）。实现者可以自由选择任何更高效的方法。这意味着\
  \ C/C++ 的 `>>` 运算符实际上只针对非负数定义。Java 消除了这种歧义。\n\n### 3.5.4. 数学函数和常量\n\n`Math` 类包含了你根据所做的编程类型偶尔可能需要的各种数学函数。\n\
  \n要取一个数的平方根，请使用 `sqrt` 方法：\n\n```\ndouble x = 4;\ndouble y = Math.sqrt(x);\nSystem.out.println(y);\
  \ // 打印 2.0\n```\n\n![Image](img/image00948.jpeg) 注意\n\n`println` 方法和 `sqrt` 方法之间存在细微区别。`println`\
  \ 方法作用于 `System` 类定义的对象 `System.out`。但 `Math` 类中的 `sqrt` 方法不作用于任何对象。这种方法被称为 `static`（静态）方法。你可以在第\
  \ 4 章中学习更多关于静态方法的知识。\n\nJava 语言没有用于计算幂的运算符：你必须使用 `Math` 类中的 `pow` 方法。语句\n\n```\n\
  double y = Math.pow(x, a);\n```\n\n将 `y` 设置为 `x` 的 `a` 次方（`x`^(`a`))）。`pow` 方法的参数类型均为\
  \ `double`，其结果也是 `double` 类型。\n\n`Math` 类提供了常用的三角函数：\n\n`Math.sin`\n`Math.cos`\n\
  `Math.tan`\n`Math.atan`\n`Math.atan2`\n\n以及指数函数的逆、自然对数：\n\n`Math.exp`\n`Math.log`\n\
  `Math.log10`\n\n以及数学常量 π 和 `e`：\n\n`Math.PI`\n`Math.E`\n\n![Image](img/image00949.jpeg)\
  \ 提示\n\n通过在文件顶部添加以下行，可以避免为数学方法和常量使用 `Math` 前缀：\n\n```java\nimport static java.lang.Math.*;\n\
  ```\n\n例如：\n\n```java\nSystem.out.println(\"The square root of \\u3C0 is \" + sqrt(PI));\n\
  ```\n\n我们在第 4 章讨论静态导入。\n\n![Image](img/image00948.jpeg) 注意\n\n`Math` 类使用计算机浮点单元以获得快速性能。如果需要完全预测的结果，请使用\
  \ `StrictMath` 类。\n\n### 3.5.5. 数值类型转换\n\n经常需要将一种数值类型转换为另一种类型。图 3.1 显示了这些转换。\n\n\
  ![Image](img/image00971.jpeg) 图 3.1: 数值类型之间的转换\n\n图 3.1 中的实线箭头表示无信息的转换。虚线箭头表示可能会丢失精度的转换。例如，像\
  \ `123456789` 这样的整数超过了 `float` 的表示范围。当整数转换为 `float` 时，结果的大小正确，但丢失了精度。\n\n```\nint\
  \ n = 123456789;\nfloat f = n; // f 为 1.2345679E8\n```\n\n当两个值与二进制运算符结合时（例如 `n +\
  \ f`，其中 `n` 是整数 `f` 是浮点数），在执行之前，两个操作数都会转换为公共类型。\n\n- 如果其中一个操作是 `double`，另一个将转换为\
  \ `double`。\n- 否则，如果其中一个操作是 `float`，另一个将转换为 `float`。\n- 否则，如果其中一个操作是 `long`，另一个将转换为\
  \ `long`。\n- 否则，两个操作数都将转换为 `int`。\n\n\n\n现在，变量 `nx` 的值为 `9`，因为将浮点数强制转换为整数会丢弃小数部分。\n\
  \n如果你想将浮点数四舍五入到整数整数（这在大多数情况下更有用的操作），请使用 `Math.round` 方法：\n\n```\ndouble x = 9.997;\n\
  int nx = (int) Math.round(x);\n```\n\n现在，变量 `nx` 的值为 `10`。在调用 `round` 时，你仍然需要使用强制转换\
  \ `(int)`。这是因为 `round` 方法的返回值是一个 `long`，而 `long` 只能通过显式强制转换才能赋值给 `int`，因为存在信息丢失的可能性。\n\
  \n![Image](img/image0095.jpeg) 注意事项\n\n如果你尝试将一种类型的数字强制转换为超出目标类型范围的另一种类型，结果将是一个具有不同数值的截断数字。例如，`(byte)\
  \ 300` 实际上是 `44`。\n\n![Image](img/image00951.jpeg) C++ 注意\n\n你不能在 `boolean` 值与任何数值类型之间进行强制转换。这种约定防止了常见的错误。在极少数需要将\
  \ `boolean` 值转换为数字的情况下，你可以使用条件表达式，例如 `b ? 1 : 0`。\n\n### 3.5.7. 括号和运算符层级\n\n下一页的表\
  \ 3.4 显示了运算符的优先级。如果不使用括号，操作将按照所示的层级顺序执行。同一层级的运算符从左到右处理，但表所示的右结合运算符除外。例如，`&&` 的优先级高于\
  \ `||`，因此表达式：\n\n```\na && b || c\n```\n\n表 3.4. 运算符优先级\n\n![Image](img/image00972.jpeg)\n\
  \n意味着\n\n```\n(a && b) || c\n```\n\n由于 `+=` 从右到左结合的，表达式：\n\n```\na += b += c\n```\n\
  \n意味着\n\n```\na += (b += c)\n```\n\n也就是说，`b += c` 的值（即 `b` 相加后的值）被加到 `a` 上。\n\n\
  ![Image](img/image00951.jpeg) C++ 注意\n\n与 C 或 C++ 不同，Java 没有逗号运算符。然而，你可以在 `for`\
  \ 语句的第一个和第三个槽位中使用逗号分隔的表达式列表。\n\n### 3.5.8. 枚举类型\n\n有时，变量应该只持一组受限的值。例如，你可能销售四种尺寸的衣服或披萨：小号、中号、大号和特大号。当然，你可以将这些尺寸编码为整数\
  \ `1`、`2`、`3`、`4` 或字符 `S`、`M`、`L` 和 `X`。但那是一个容易出错的设置。变量持有错误值（如 `0` 或 `m`）太容易了。每当出现这种情况时，你都可以定义自己的枚举类型。枚举类型具有有限数量的命名值。例如：\n\
  \n```\nenum Size { SMALL, MEDIUM, LARGE, EXTRA_LARGE };\n```\n\n现在你可以声明这种类型的变量：\n\
  \n```\nSize s = Size.MEDIUM;\n```\n\n类型 `Size` 的变量只能持有类型声明中列出的值之一，或者表示变量未设置任何值的特殊值\
  \ `null`。\n\n我们将在第 5 章中更详细地讨论枚举类型。\n\n### 3.6. 字符串\n\n从概念上说，Java 字符串是 Unicode 字符序列。例如，字符串\
  \ `\"Java\\u2122\"` 由五个 Unicode 字符 J、a、v、a 和 ™ 组成。Java 没有内置的字符串类型。相反，标准 Java 库包含一个预定义的类，自然地被称为\
  \ `String`。每个带引号的字符串都是 `String` 类的实例：\n\n```\nString e = \"\"; // 一个空字符串\nString\
  \ greeting = \"Hello\";\n```\n\n#### 3.6.1. 子字符串\n\n你可以使用 `String` 类的 `substring`\
  \ 方法从较大的字符串中提取子字符串。例如，\n\n```\nString greeting = \"Hello\";\nString s = greeting.substring(0,\
  \ 3);\n```\n\n创建了一个由字符 `\"Hel\"` 组成的字符串。\n\n`substring` 的第二个参数是你不想复制的起始。在我们案例中，我们想要复制位置\
  \ 0、1 和 2（从位置 0 到位置 2 包含）。按照 `substring` 的计数方式，这意味着从位置 0（包含）到位置 3（不包含）。\n\n`substring`\
  \ 工作方式有一个优势：计算子字符串的长度很容易。字符串 `s.substring(a, b)` 的长度始终是 `b - a`。例如，子字符串 `\"Hel\"\
  ` 的长度为 3 - 0 = 3。\n\n#### 3.6.2. 拼接\n\nJava 与大多数编程语言一样，允许你使用 `+` 来连接（拼接）两个字符串。\n\
  \n```\nString expletive = \"Expletive\";\nString PG13 = \"deleted\";\nString message\
  \ = expletive + PG13;\n```\n\n之前的代码将变量 `message` 设置为字符串 `\"Expletivedeleted\"`。前面的代码将变量\
  \ `message` 设置为字符串 `\"Expletivedeleted\"`。由于 `+` 运算符连接了字符串，这正如你预期的那样。例如：\n\n```java\n\
  int age = 13;\nString rating = \"PG\" + age;\n```\n\n将 `rating` 设置为 `\"PG13\"`。这种这种在输出语句中非常常见。例如：\n\
  \n```java\nSystem.out.println(\"The answer is \" + answer);\n```\n\n这正如你预期的那样，并打印出\
  \ `The answer is 42`。由于 `+=` 从右到左结合的，例如：\n\n```java\nString s = \"Hello\";\ns +=\
  \ \" World\";\n```\n\n将 `s` 设置为 `\"Hello World\"`。由于 `+=` 从右到左结合的，例如：\n\n```java\n\
  String s = \"Hello\";\ns += \" World\";\n```\n\n将 `s` 设置为 `\"Hello World\"`。由于 `+=`\
  \ 从右到左结合的，例如：\n\n```\nString s = \"Hello\";\ns += \" World\";\n```\n\n将 `s` 设置为\
  \ `\"Hello World\"`。由于 `+=` 从右到左结合的，例如：\n\n\n\n当你将 `greeting` 替换为另一个字符串时，Java 代码大致执行以下操作：\n\
  \n```java\nchar* temp = malloc(6);\nstrncpy(temp, greeting, 3);\nstrncpy(temp +\
  \ 3, \"p!\", 3);\ngreeting = temp;\n```\n\n当然，现在 `greeting` 指向字符串 `\"Help!\"`。即使是最经验丰富的\
  \ C 程序员也承认，Java 的语法比一串的 `strncpy` 调用要愉快得多。但如果我们再次对 `greeting` 进行另一次赋值呢？\n\n```java\n\
  greeting = \"Howdy\";\n```\n\n我们难道没有产生内存泄漏吗？毕竟，原始字符串分配在堆上。幸运的是，Java 具有自动垃圾回收机制。如果一个内存块不再被需要，它最终会被回收。\n\
  \n如果你是一名 C++ 程序员并使用 ANSI C++ 定义的 `string` 类，那么你对 Java 的 `String` 类型会感到熟悉得多。C++ `string`\
  \ 对象也会执行内存的自动分配和释放。内存管理是通过构造函数、赋值运算符和析构函数显式执行的。然而，C++ 字符串是可变的——你可以修改字符串中的单个字符。\n\
  \n***\n\n### 3.6.4. 字符串相等性测试\n\n要测试两个字符串是否相等，请使用 `equals` 方法。表达式\n\n`s.equals(t)`\n\
  \n如果字符串 `s` 和 `t` 相等，返回 `true`，否则返回 `false`。注意，`s` 和 `t` 可以是字符串变量也可以是字符串常量。例如，表达式\n\
  \n`\"Hello\".equals(greeting)`\n\n完全合法的。要测试两个字符串除字母大小写区别外是否相同，请使用 `equalsIgnoreCase`\
  \ 方法。\n\n`\"Hello\".equalsIgnoreCase(\"hello\")`\n\n不要使用 `==` 运算符来测试两个字符串是否相等！它只确定字符串是否存储在相同的位置。当然，如果字符串在相同的位置，它们必须是相等的。但完全可以在不同的地方存储多个相同字符串的副本。\n\
  \n点击此处查看代码图像\n\n```java\nString greeting = \"Hello\"; //将 greeting 初始化为字符串\n\nif\
  \ (greeting == \"Hello\") . . .\n    // 可能为真\n\nif (greeting.substring(0, 3) ==\
  \ \"Hel\") . . .\n    // 可能为假\n```\n\n如果虚拟机总是安排让相同的字符串共享，那么你就可以使用 `==` 运算符来测试相等性。但只有字符串常量会被共享，而不是通过\
  \ `+` 或 `substring` 等操作结果得到的字符串。因此，永远不要使用 `==` 来比较字符串，否则你的程序可能会出现最糟糕的 bug——一种似乎随机发生的间歇性\
  \ bug。\n\n***\n\n![Image](img/image00951.jpeg) C++ 注意\n\n如果你习惯了 C++ 的 `string` 类，必须特别小心相等性测试。C++\
  \ `string` 类重载了 `==` 运算符来测试字符串内容的相等性。遗憾的是，Java 特意让字符串具有与数值类型相同的“外观和感觉”，但又让字符串在相等性测试中表现得像指针。语言设计者本可以为字符串重新定义\
  \ `==`，就像他们对 `+` 做了特殊安排一样。唉，每种语言都有自己的不一致之处。\n\nC 程序员从不使用 `==` 比较字符串，而是使用 `strcmp`。Java\
  \ 的 `compareTo` 方法是 `strcmp` 的完全对应物。你可以使用\n\n```java\nif (greeting.compareTo(\"\
  Hello\") == 0) . . .\n```\n\n但似乎使用 `equals` 更加清晰。\n\n***\n\n### 3.6.5. 空字符串和 null\
  \ 字符串\n\n空字符串 `\"\"` 是长度为 `0` 的字符串。你可以通过调用以下代码来测试字符串是否为空\n\n```java\nif (str.length()\
  \ == 0)\n```\n\n或\n\n```java\nif (str.equals(\"\"))\n```\n\n空字符串是一个 Java 对象，它持有字符串长度（即\
  \ `0`）和空内容。然而，`String` 变量还可以持有一个特殊值，即 `null`，表示当前没有对象与该变量关联。（关于 null 的更多信息请参见第 4\
  \ 章）。要测试字符串是否为 `null`，使用条件：\n\n```java\nif (str == null)\n```\n\n有时，你需要测试字符串既不是\
  \ `null` 也为空。这时使用条件：\n\n```java\nif (str != null && str.length() != 0)\n```\n\n\
  你需要先测试 `str` 是否为 `null`。正如你将在第 4 章中看到的，在 `null` 值上调用方法是错误的。\n\n### 3.6.6. 代码点和代码单元\n\
  \nJava 字符串实现为 `char` 值的序列。正如我们在第 3.3.3 节中讨论的，第 49 页的`char 类型”，`char` 数据类型是用于表示 UTF-16\
  \ 编码中 Unicode 代码点的代码单元。最常用的 Unicode 字符可以用单个代码单元表示。补充字符需要一对代码单元。\n\n`length` 方法产生给定字符串在\
  \ UTF-16 编码下所需的代码单元数量。（注：原文此处存在大量重复内容，已过滤）。\n\n\n\n\n返回指定位置处的代码单元。除非你对低级代码单元感兴趣，否则你可能不想调用此方法。\n\
  \n- `int codePointAt(int index)` **5.0**\n\n返回起始或结束于指定位置的代码点。\n\n- `int offsetByCodePoints(int\
  \ startIndex, int cpCount)` **5.0**\n\n返回距离 `startIndex` 处的代码点偏移 `cpCount` 个代码点的索引。\n\
  \n- `int compareTo(String other)`\n\n如果字符串在字典序上于 `other`，则返回负值；如果字符串在字典序上晚于 `other`，则返回正值；如果两个字符串相等，则返回\
  \ `0`。\n\n- `boolean endsWith(String suffix)`\n\n如果字符串以 `suffix` 结尾，则返回 `true`。\n\
  \n- `boolean equals(Object other)`\n\n如果字符串等于 `other`，则返回 `true`。\n\n- `boolean\
  \ equalsIgnoreCase(String other)`\n\n如果字符串等于 `other`（不区分大小写），则返回 `true`。\n\n- `int\
  \ indexOf(String str)`\n- `int indexOf(String str, int fromIndex)`\n- `int indexOf(int\
  \ cp)`\n- `int indexOf(int cp, int fromIndex)`\n\n返回从索引 `0` 或 `fromIndex` 开始的第一个等于字符串\
  \ `str` 或代码点 `cp` 的子串起始位置；如果 `str` 不在此字符串中出现，则返回 `-1`。\n\n- `int lastIndexOf(String\
  \ str)`\n- `int lastIndexOf(String str, int fromIndex)`\n- `int lastindexOf(int\
  \ cp)`\n- `int lastindexOf(int cp, int fromIndex)`\n\n返回从字符串末尾或 `fromIndex` 开始的最后一个等于字符串\
  \ `str` 或代码点 `cp` 的子串起始位置。\n\n- `int length()`\n\n返回字符串的长度。\n\n- `int codePointCount(int\
  \ startIndex, int endIndex)` **5.0**\n\n返回 `startIndex` 到 `endIndex - 1` 之间的代码点数量。未配对的代理项被视为代码点。\n\
  \n- `String replace(CharSequence oldString, CharSequence newString)`\n\n返回一个新字符串，该字符串是通过将字符串中所有匹配\
  \ `oldString` 的子串替换为 `newString` 得到的。你可以为 `CharSequence` 参数提供 `String` 或 `StringBuilder`\
  \ 对象。\n\n- `boolean startsWith(String prefix)`\n\n如果字符串以 `prefix` 开头，则返回 `true`。\n\
  \n- `String substring(int beginIndex)`\n- `String substring(int beginIndex, int\
  \ endIndex)`\n\n返回一个新字符串，它由从 `beginIndex` 到字符串末尾或 `endIndex - 1` 的所有代码单元组成。\n\n\
  - `String toLowerCase()`\n\n返回一个新字符串，包含原始字符串中的所有字符，并将大写字母转换为小写字母。\n\n- `String toUpperCase()`\n\
  \n返回一个新字符串，包含原始字符串中的所有字符，并将小写字母转换为大写字母。\n\n- `String trim()`\n\n返回一个新字符串，通过消除原始字符串中所有的前导和尾空白得到。\n\
  \n***\n\n### 3.6.8. 阅读在线 API 文档\n\n正如你所看到的，`String` 类有许多方法。此外，标准库中还有数千个类，并且有更多的方法。要记住所有有用的类和方法显然是不可能的。因此，熟悉在线\
  \ API 文档至关重要，它可以让你查询标准库中的所有类和方法。API 文档是 JDK 的一部分。它是 HTML 格式。将你的浏览器指向 JDK 安装目录下的\
  \ `docs/api/index.html` 子目录（图 3.2）。\n\n![Image](img/image0097.jpeg)\n\n图 3.2. API\
  \ 文档的三个面板\n\n屏幕被分为三个帧。左上角的小帧显示所有可用的包。下方是一个较大的帧列出了所有类。点击任何类名，该类的 API 文档就会在右侧的大帧中显示（参见图\
  \ 3.3）。例如，为了获取更多关于 `String` 类方法的信息，滚动第二个帧直到看到 `String` 链接，然后点击它。\n\n![Image](img/image00975.jpeg)\n\
  \n图 3.3. String 类的描述\n\n然后滚动右侧的帧直到到达所有方法的摘要，方法按字母顺序排序（参见图 3.4）。点击任何方法名以查看该方法的详细描述（参见图\
  \ 3.5）。例如，如果你点击 `compareToIgnoreCase` 链接，你将获得 `compareToIgnoreCase` 方法的描述。\n\n![Image](img/image00976.jpeg)\n\
  \n图 3.4. String 类的方法摘要\n\n![Image](img/image00977.jpeg)\n\n图 3.5. String 方法的详细描述\n\
