  \ `synchronized`。\n\n内建对象锁有一个关联的条件。`wait` 方法将线程添加到等待集（，而 `notifyAll`/`notify` 方法会唤醒等待的线程。换句话说，调用\
  \ `wait` 或 `notifyAll` 等同于：\n\n```java\nintrinsicCondition.await();\nintrinsicCondition.signalAll();\n\
  ```\n\n***\n\n![Image](img/image00948.jpeg) **注意**\n\n`wait`、`notifyAll` 和 `notify`\
  \ 方法是 `Object` 类的 `final` 方法。`Condition` 方法必须命名为 `await`、`signalAll` 和 `signal`，以避免与这些方法发生冲突。\n\
  \n***\n\n例如，你可以像这样在 Java 中实现 `Bank` 类：\n\n点击此处查看代码图片\n\n```java\nclass Bank\n{\n\
  \   private double[] accounts;\n   public synchronized void transfer(int from, int\
  \ to, amount) throws InterruptedException\n   {\n      while (accounts[from] < amount)\n\
  \         wait(); // 在内建对象锁的单一条件上等待\n      accounts[from] -= amount;\n      accounts[to]\
  \ += amount;\n      notifyAll(); // 通知所有等待该条件的线程\n   }\n   public synchronized double\
  \ getTotalBalance() { . . . }\n}\n```\n\n如你所示，使用 `synchronized` 关键字产生的代码简洁得多。当然，要理解这段代码，你必须知道每个对象都有一个内建锁，并且该锁有一个内建条件。锁管理尝试进入\
  \ `synchronized` 方法的线程，条件管理调用了 `wait` 的线程。\n\n***\n\n![Image](img/image00949.jpeg)\
  \ **提示**\n\n同步方法相对简单。然而，初学者往往在条件（conditions）上感到困难。在运行 `wait/notifyAll` 之前，你应该考虑使用第\
  \ 14.10 节 中描述的“同步器”构造之一，位于第 905 页。\n\n***\n\n将静态方法声明为 `synchronized` 也是合法的。如果调用了这样的方法，它将获取关联类对象的内建锁。例如，如果\
  \ `Bank` 类有一个静态同步方法，那么当调用它时，`Bank.class` 对象的锁会被锁定。结果是，没有其他线程可以调用该类的此或其他任何同步静态方法。\n\
  \n内建锁和条件有一些局限性。其中包括：\n\n- 你无法中断一个尝试获取锁的线程。\n- 在尝试获取锁时无法指定超时时间。\n- 每个锁只有一个条件可能会效率低下。\n\
  \n在你的代码中应该使用什么——`Lock` 和 `Condition` 对象还是同步方法？这里是我们的建议：\n\n- 最好既不使用 `Lock`/`Condition`\
  \ 也不使用 `synchronized` 关键字。在许多情况下，你可以使用 `java.util.concurrent` 包中的某种机制，它们会为你完成所有的锁定工作。例如，在第\
  \ 14.6 节的“阻塞队列”中，位于第 877 页，你将看到如何使用阻塞队列来同步处理共同任务的线程。\n- 如果 `synchronized` 关键字适用于你的情况，请务必使用它。你写的代码会更少，出错的空间也更小。列表\
  \ 14.9 展示了用同步方法实现的银行示例。\n- 如果你确实需要这些构造带提供的额外功能，请使用 `Lock`/`Condition`。\n\nListing\
