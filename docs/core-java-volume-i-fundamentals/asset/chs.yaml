  \            return found;\n                }\n            } catch (IOException\
  \ e) {\n                return false;\n            }\n        }\n    }\n}\n```\n\
  \n`java.util.concurrent.Callable<V>` **5.0**\n- `V call()` 执行一个返回结果的任务。\n\n`java.util.concurrent.Future<V>`\
  \ **5.0**\n- `V get()`\n- `V get(long time, TimeUnit unit)` 获取结果，直到结果可用或给定时间结束。\n\
  - `boolean cancel(boolean mayInterrupt)` 尝试取消任务的执行。如果任务已经启动且 `mayInterrupt` 参数为\
  \ `true`，则任务会被中断。如果取消成功则返回 `true`。\n- `boolean isCancelled()` 如果任务在完成前被取消，则返回 `true`。\n\
  - `boolean isDone()` 如果任务通过正常完成、取消或异常已完成，则返回 `true`。\n\n\n\n\n构建新线程是非常昂销的，因为涉及到与操作系统的交互。如果你的程序创建了大量短生命周线程，则应该使用\
  \ `thread pool`（线程池）。线程池包含若干个准备就绪的空闲线程。你将一个 `Runnable` 交付给池池，其中一个线程会调用 `run` 方法。当\
  \ `run` 方法退出时，该线程不会死亡，而是留下来处理下一个请求。\n\n使用线程池的另一个原因是限制并发线程的数量。创建海量线程会极大地降低性能，甚至导致虚拟机崩溃。如果你有一个会创建大量线程的算法，你应该使用“固定（fixed）”线程池，以限制并发线程的总数。\n\
  \n`Executors` 类有许多静态工厂方法用于构建线程池；摘要请参阅表 14.2。\n\n### 表 14.2. Executors 工厂方法\n\n![Image](img/image01237.jpeg)\n\
  \n### 14.9.1. 线程池\n\n让我们来看表 14.2 中的前三个方法（我们将在 Section 14.9.2 中的“调度执行”，位于第 900 页讨论剩余的方法）。`newCachedThreadPool`\
  \ 方法构建一个立即执行每个任务的线程池，它在可用时使用现有的空闲线程，否则创建一个新线程。`newFixedThreadPool` 方法构建一个固定大小的线程池。如果提交的任务多于空闲线程，未处理的任务将存放在队列中。它们将在其他任务完成后被执行。`newSingleThreadExecutor`\
  \ 是一个大小为 1 的退化线程池，由单个线程按顺序执行提交的任务。这三个方法都返回 `ThreadPoolExecutor` 类的对象，该类实现了 `ExecutorService`\
  \ 接口。\n\n你可以通过以下方法之一向 `ExecutorService` 提交 `Runnable` 或 `Callable`：\n\n```java\n\
  Future<?> submit(Runnable task)\nFuture<T> submit(Runnable task, T result)\nFuture<T>\
  \ submit(Callable<T> task)\n```\n\n线程池将在其方便时尽早运行提交的任务。当你调用 `submit` 时，你会得到一个 `Future`\
  \ 对象，可以用它来查询任务的状态。\n\n第一个 `submit` 方法返回一个看起来很奇异的 `Future<?>`。你可以使用此类对象调用 `isDone`、`cancel`\
  \ 或 `isCancelled`，但 `get` 方法在完成后仅简单地返回 `null`。\n\n第二个版本的 `submit` 同样提交一个 `Runnable`，`Future`\
  \ 的 `get` 方法在完成后会返回给定的 `result` 对象。\n\n第三个版本提交一个 `Callable`，返回的 `Future` 在结果就绪时会获取计算结果。\n\
  \n当你完成线程池的使用后，调用 `shutdown`。该方法启动线程池的关闭序列。已关闭的执行器不再接受新任务。当所有任务完成后，线程池中的线程就会死亡。或者，你可以调用\
  \ `shutdownNow`。线程线程池会取消所有尚未开始的任务，并尝试中断正在运行的线程。\n\n这里总结了使用线程池的操作步骤：\n\n1. 调用 `Executors`\
  \ 类的静态方法 `newCachedThreadPool` 或 `newFixedThreadPool`。\n2. 调用 `submit` 提交 `Runnable`\
  \ 或 `Callable` 对象。\n3. 如果你想能够取消任务或者如果你提交了 `Callable` 对象，请保留返回的 `Future` 对象。\n4.\
  \ 当你不再需要提交任何任务时，调用 `shutdown`。\n\n例如，上一个示例程序产生了大量短生命周期线程，每个目录一个。Listing 14.12 中的程序则使用了线程池来启动任务。\n\
  \n#### 列表 14.12. threadPool/ThreadPoolTest.java\n\n点击此处查看代码图像\n\n```java\npackage\
  \ threadPool;\n\nimport java.io.*;\nimport java.util.*;\nimport java.util.concurrent.*;\n\
  \n/**\n * @version 1.01 2012-01-26\n * @author Cay Horstmann\n */\npublic class\
  \ ThreadPoolTest\n{\n    public static void main(String[] args) throws Exception\n\
  \    {\n        Scanner in = new Scanner(System.in);\n        System.out.print(\"\
  Enter base directory (e.g. /usr/local/jdk5.0/src \");\n        String directory\
  \ = in.nextLine();\n        System.out.print(\"Enter keyword (e.g. volatile): \"\
  );\n        String keyword = in.nextLine();\n\n        ExecutorService pool = Executors.newCachedThreadPool();\n\
  \n        MatchCounter counter = new MatchCounter(new File(directory), keyword,\
  \ pool);\n        Future<Integer> result = pool.submit(counter);\n\n        try\
  \ {\n            System.out.println(result.get() + \" matching files.\");\n    \
  \    } catch (ExecutionException e) {\n            e.printStackTrace();\n      \
  \  } catch (InterruptedException e) {\n        }\n\n        pool.shutdown();\n\n\
  \        int largestPoolSize = ((ThreadPoolExecutor) pool).getLargestPoolSize();\n\
  \        System.out.println(\"largest pool size=\" + largestPoolSize);\n    }\n\
  }\n\n/**\n * 该任务统计目录及其子目录中包含指定关键字的文件。\n */\nclass MatchCounter implements Callable<Integer>\n\
  {\n    private File directory;\n    private String keyword;\n    private ExecutorService\
  \ pool;\n    private int count;\n\n    /**\n     * 构建 MatchCounter。\n     * @param\
  \ directory 开始搜索的目录\n     * @param keyword 要查找的关键字\n     * @param pool 用于提交子任务的线程池\n\
  \     */\n    public MatchCounter(File directory, String keyword, ExecutorService\
  \ pool)\n    {\n        this.directory = directory;\n        this.keyword = keyword;\n\
  \        this.pool = pool;\n    }\n\n    public Integer call()\n    {\n        count\
  \ = 0;\n        try {\n            File[] files = directory.listFiles();\n     \
  \       List<Future<Integer>> results = new ArrayList<>();\n\n            for (File\
  \ file : files) {\n                if (file.isDirectory()) {\n                 \
  \   MatchCounter counter = new MatchCounter(file, keyword, pool);\n            \
  \        Future<Integer> result = pool.submit(counter);\n                    results.add(result);\n\
  \                } else {\n                    if (search(file)) count++;\n    \
  \            }\n            }\n\n            for (Future<Integer> result : results)\
  \ {\n                try {\n                    count += result.get();\n       \
  \         } catch (ExecutionException e) {\n                    e.printStackTrace();\n\
  \                }\n            }\n        } catch (InterruptedException e) {\n\
  \        }\n        return count;\n    }\n\n    /**\n     * 在文件中搜索指定的关键字。\n    \
  \ * @param file 要搜索的文件\n     * @return 如果文件中包含该关键字，则返回 true\n     */\n    public\
  \ boolean search(File file)\n    {\n        try {\n            try (Scanner in =\
  \ new Scanner(file)) {\n                boolean found = false;\n               \
  \ while (!found && in.hasNextLine()) {\n                    String line = in.nextLine();\n\
  \                    if (line.contains(keyword)) found = true;\n               \
  \ }\n                return found;\n            }\n        } catch (IOException\
  \ e) {\n            return false;\n        }\n    }\n}\n```\n\n\n\n\n出于信息提示目的，此程序会在执行期间打印出最大的池大小。此信息无法通过\
  \ `ExecutorService` 接口获取。因此，我们必须将池对象强制转换为 `ThreadPoolExecutor` 类。\n\n### java.util.concurrent.Executors\
  \ 5.0\n\n- `ExecutorService newCachedThreadPool()`\n返回一个缓存线程池，该线程池根据需要创建线程，并终止空闲超过\
  \ 60 秒的线程。\n- `ExecutorService newFixedThreadPool(int threads)`\n返回一个使用给定数量线程执行任务的池。\n\
  - `ExecutorService newSingleThreadExecutor()`\n返回一个在单线程中按顺序执行任务的执行器。\n\n### java.util.concurrent.ExecutorService\
  \ 5.0\n\n- `Future<T> submit(Callable<T> task)`\n- `Future<T> submit(Runnable task,\
  \ T result)`\n- `Future<?> submit(Runnable task)`\n提交给任务进行执行。\n\n- `void shutdown()`\n\
  关闭服务，完成已提交的任务，但不再接受新的提交。\n\n### java.util.concurrent.ThreadPoolExecutor 5.0\n\n\
  - `int getLargestPoolSize()`\n返回此执行器生存周期内线程池的最大大小。\n\n#### 14.9.2. 调度执行\n\n`ScheduledExecutorService`\
  \ 接口拥有用于调度或重复执行任务的方法。它是 `java.util.Timer` 的泛化，允许线程池。`Executors` 类的 `newScheduledThreadPool`\
  \ 和 `newSingleThreadScheduledExecutor` 方法返回实现 `ScheduledExecutorService` 接口的对象。\n\
  \n你可以调度一个 `Runnable` 或 `Callable` 在初始延迟后运行一次。你也可以调度一个 `Runnable` 定期运行。详情请参阅 API\
  \ 说明。\n\n### java.util.concurrent.Executors 5.0\n\n- `ScheduledExecutorService newScheduledThreadPool(int\
  \ threads)`\n返回一个使用给定数量线程调度任务的池。\n- `ScheduledExecutorService newSingleThreadScheduledExecutor()`\n\
  返回一个在单线程中调度任务的执行器。\n\n### java.util.concurrent.ScheduledExecutorService 5.0\n\n\
  - `ScheduledFuture<V> schedule(Callable<V> task, long time, TimeUnit unit)`\n- `ScheduledFuture<?>\
  \ schedule(Runnable task, long time, TimeUnit unit)`\n在给定时间通过后调度给定的任务。\n\n- `ScheduledFuture<?>\
  \ scheduleAtFixedRate(Runnable task, long initialDelay, long period, TimeUnit unit)`\n\
  调度给定的任务在初始延迟后，每隔 `period` 单位定期运行一次。\n- `ScheduledFuture<?> scheduleWithFixedDelay(Runnable\
  \ task, long initialDelay, long delay, TimeUnit unit)`\n调度给定的任务在初始延迟后定期运行，在一次调用完成和下一次调用开始之间有\
  \ `delay` 单位。\n\n#### 14.9.3. 控制任务组\n\n你已经见过了如何使用执行器服务作为线程池来提高任务执行的效率。有时，使用执行器是为了更具战术性的考虑，仅仅是为了控制一组相关任务。例如，你可以使用\
  \ `shutdownNow` 方法取消执行器中的所有任务。\n\n`invokeAny` 方法提交 `Callable` 对象集合中的所有对象，并返回已完成任务的结果。你不知道是哪一个任务——推测，它是完成得最快的那个。在搜索问题中使用此方法，即你愿意接受任何解决方案。例如，假设你需要对一个大整数进行因式分解——这是破解\
  \ RSA 密文所需的计算。你可以提交多个任务，每个任务都尝试对不同范围内的数字进行因式分解。只要其中一个任务得出了答案，你的计算就可以停止。\n\n`invokeAll`\
  \ 方法提交 `Callable` 对象集合中的所有对象，阻塞直到所有任务都完成，并返回一个 `Future` 对象的列表，代表所有任务的解决方案。你可以在计算结果可用时处理它们，如下所示：\n\
  \n```\nList<Callable<T>> tasks = . . .;\nList<Future<T>> results = executor.invokeAll(tasks);\n\
  \nfor (Future<T> result : results)\n    processFurther(result.get());\n```\n\n这种方法的缺点是，如果第一个任务恰好花费了很长时间，你可能会进行无谓的等待。按照结果提供的顺序获取结果更有意义。这可以通过\
  \ `ExecutorCompletionService` 来安排。\n\n从通常方式获取一个执行器。然后构造一个 `ExecutorCompletionService`。将任务提交到完成服务中。该服务管理一个\
  \ `Future` 对象的阻塞队列，当提交的任务的结果变得可用时将其包含其中。因此，对于上述计算，更高效的组织方式如下：\n\n```\nExecutorCompletionService\
  \ service = new ExecutorCompletionService(executor);\n\nfor (Callable<T> task :\
  \ tasks) service.submit(task);\n\nfor (int i = 0; i < tasks.size(); i++)\n    processFurther(service.take().get());\n\
  ```\n\n### java.util.concurrent.ExecutorService 5.0\n\n- `T invokeAny(Collection<T>\
  \ tasks)`\n- `T invokeAny(Collection<T> tasks, long timeout, TimeUnit unit)`\n执行给定的任务并返回其中一个的结果。如果发生超时，第二个方法将抛出\
  \ `TimeoutException`。\n\n- `List<Future<T>> invokeAll(Collection<T> tasks)`\n- `List<Future<T>>\
  \ invokeAll(Collection<T> tasks, long timeout, TimeUnit unit)`\n执行给定的任务并返回所有任务的结果。如果发生超时，第二个方法将抛出\
  \ `TimeoutException`。\n\n### java.util.concurrent.ExecutorCompletionService 5.0\n\
  \n- `ExecutorCompletionService(Executor e)`\n构造一个收集执行器结果的完成服务。\n- `Future<T> submit(Callable<T>\
  \ task)`\n- `Future<T> submit(Runnable task, T result)`\n将任务提交到底层执行器。\n\n- `Future<T>\
  \ take()`\n移除下一个完成的结果，如果没有可用可用，则阻塞。\n- `Future<T> poll()`\n- `Future<T> poll(long\
  \ time, TimeUnit unit)`\n移除下一个完成的结果，如果没有可用结果则返回 `null`。第二个方法等待给定的时间。\n\n#### 14.9.4.\
  \ Fork-Join 框架\n\nFork-join 框架某些应用程序使用大量处于空闲状态的线程。例如每个连接使用一个线程的 Web 服务器。其他应用程序每个内核使用一个线程，以执行计算密集型任务，例如图像或视频处理。在\
  \ Java 7 中出现的 fork-join 框架是为后者设计的。假设你有一个可以自然分解为子任务的任务，如下：\n\n```\nif (problemSize\
  \ < threshold)\n    直接解决问题\nelse\n{\n    将问题分解为子问题\n    递归解决每个子问题\n    合并结果\n}\n\
  ```\n\n一个例子是图像处理。为了增强图像，你可以转换上半和下半部分。如果你有足够的空闲处理器，这些操作就可以并行运行。（你需要在分割两个部分的带上做一些额外工作，但那是技术细节。）\n\
  \n在这里，我们将讨论一个更简单的示例。假设我们要统计数组中有多少元素符合特定属性。我们将数组一分为两半，计算每部分的计数，并将它们相加。\n\n为了将递归计算放在框架可以使用格式中，请提供一个扩展\
  \ `RecursiveTask<T>` 的类（如果计算产生类型 `T` 的结果）或 `RecursiveAction`（如果不产生结果）。重写 `compute`\
  \ 方法以生成并调用子任务，并合并它们的结果。\n\n\n\n\n\n点击此处查看代码图片\n\n```java\nclass Counter extends\
  \ RecursiveTask<Integer>\n{\n    . . .\n    protected Integer compute()\n    {\n\
  \        if (to - from < THRESHOLD)\n        {\n          直接解决问题\n        }\n  \
  \      else\n        {\n          int mid = (from + to) / 2;\n          Counter\
  \ first = new Counter(values, from, mid, filter);\n          Counter second = new\
  \ Counter(values, mid, to, filter);\n          invokeAll(first, second);\n     \
  \     return first.join() + second.join();\n        }\n    }\n}\n```\n\n在这里，`invokeAll`\
  \ 方法接收若干任务并阻塞，直到所有任务都完成。`join` 方法产生结果。在这里，我们对每个子任务应用了 `join` 并返回和。\n\n***\n\n![图片](img/image00948.jpeg)\
  \ 注意\n\n这里还有一个 `get` 方法用于获取当前结果，但它不那么吸引人，因为它可能会抛出检查异常，而我们不允许在 `compute` 方法中抛出这些异常。\n\
  \n***\n\n列表 14.13 显示了完整的示例。\n\n在后台，fork-join 框架使用了一种有效的启发式算法来在可用线程之间平衡负载，称为“工作窃取”（work\
  \ stealing）。每个工作线程都有一个用于任务的 `deque`（双端队列）。工作线程将子任务推到自己 de 队列的头部。（只有一个线程访问头部，因此不需要锁定。）当一个工作线程空空闲时，它会从另一个队列的尾部“窃取”一个任务。由于较大的子任务位于尾部，这种窃取非常罕见。\n\
  \n列表 14.13. forkJoin/forkJoinTest.java\n\n点击此处查看代码图片\n\n***\n\n```java\n1  package\
  \ forkJoin;\n2\n3  import java.util.concurrent.*;\n4\n5  /**\n6   * 此程序演示了 fork-join\
  \ 框架。\n7   * @version 1.00 2012-05-20\n8   * @author Cay Horstmann\n9   */\n10 public\
  \ class ForkJoinTest\n11 {\n12     public static void main(String[] args)\n13  \
  \   {\n14          final int SIZE = 10000000;\n15          double[] numbers = new\
  \ double[SIZE];\n16          for (int i = 0; i < SIZE; i++) numbers[i] = Math.random();\n\
  17          Counter counter = new Counter(numbers, 0, numbers.length,\n18      \
  \    new Filter()\n19          {\n20              public boolean accept(double x)\
  \ { return x > 0.5; }\n21          });\n22          ForkJoinPool pool = new ForkJoinPool();\n\
  23          pool.invoke(counter);\n24          System.out.println(counter.join());\n\
  25     }\n26 }\n27 interface Filter\n28 {\n29     boolean accept(double t);\n30\
  \ }\n31\n32 class Counter extends RecursiveTask<Integer>\n33 {\n34     public static\
  \ final int THRESHOLD = 100;\n35     private double[] values;\n36     private int\
  \ from;\n37     private int to;\n38     private Filter filter;\n39\n40     public\
  \ Counter(double[] values, int from, int to, Filter filter)\n41     {\n42      \
  \   this.values = values;\n43         this.from = from;\n44         this.to = to;\n\
  45         this.filter = filter;\n46     }\n47     protected Integer compute()\n\
  48     {\n49         if (to - from < THRESHOLD)\n50         {\n51             int\
  \ count = 0;\n52             for (int i = from; i < to; i++) {\n53             \
  \    if (filter.accept(values[i])) {\n54                     count++;\n55      \
  \           }\n56             }\n57             return count;\n58         }\n59\
  \         else\n60         {\n61             int mid = (from + to) / 2;\n62    \
  \         Counter first = new Counter(values, from, mid, filter);\n63          \
  \   Counter second = new Counter(values, mid, to, filter);\n64             invokeAll(first,\
  \ second);\n65             return first.join() + second.join();\n66         }\n\
  67     }\n68 }\n```\n\n\n\n\n`Phaser` 类增加了更多的灵活性，允许你在不同阶段之间更改参与线程的数量。\n\n#### 14.10.4.\
  \ 交换器 (Exchangers)\n\n当两个线程处理同一个数据缓冲区的两个实例时，使用 `Exchanger`。通常，一个线程填充缓冲区，另一个线程消耗其内容。当两者完成后，它们会交换缓冲区。\n\
  \n#### 14.10.5. 同步队列 (Synchronous Queues)\n\n同步队列是一种将生产者和消费者线程配对的机制。当线程在 `SynchronousQueue`\
  \ 上调用 `put` 时，它会阻塞，直到另一个线程调用 `take`，反之亦然。与 `Exchanger` 的情况不同，数据只单向传输，即从生产者到消费者。尽管\
  \ `SynchronousQueue` 类实现了 `BlockingQueue` 接口，但它在概念上并不是队列。它不包含任何元素——其 `size` 方法始终返回\
  \ `0`。\n\n### 14.11. 线程与 Swing\n\n正如在本章引言中提到的，在程序中使用线程的原因之一是为了让程序更具响应性。当程序需要执行某些耗时的操作时，你应该启动另一个工作线程，而不是阻塞用户界面。\n\
  \n然而，你必须小心在工作线程中做的事情，因为可能令你感到惊讶的是，Swing 并不是线程安全的。如果你尝试从多个线程操作用户界面元素，你的用户界面可能会变得损坏。\n\
  \n要查看这个问题，请运行接下来的测试程序，详见 列表 14.14。当你点击 \"Bad\"（坏）按钮时，会启动一个新线程，其 `run` 方法会折磨一个组合框，随机添加和删除值。\n\
  \n点击此处查看代码图像\n\n```java\npublic void run() {\n    try {\n        while (true) {\n\
  \            int i = Math.abs(generator.nextInt());\n            if (i % 2 == 0)\n\
  \                combo.insertItemAt(new Integer(i), 0);\n            else if (combo.getItemCount()\
  \ > 0)\n                combo.removeItemAt(i % combo.getItemCount());\n        \
  \    sleep(1);\n        }\n    } catch (InterruptedException e) {}\n}\n```\n\n尝试一下。点击\
  \ \"Bad\" 按钮。点击组合框几次几次。移动滚动条。移动窗口。再次点击 \"Bad\" 按钮。继续点击组合框。最终，你应该会看到一个异常报告（图 14.8）。\n\
  \n![Image](img/image01239.jpeg)\n\n图 14.8. 控制台中的异常报告\n\n发生了什么？当一个元素被插入到组合框时，组合框会触发一个事件来更新显示。然后，显示代码开始运行，读取组合框的当前大小并准备显示值。但工作线程会继续运行——偶尔会导致组合框中值的数量减少。这时，显示代码会认为模型中的值比实际的更多，请求不存在的值，并触发\
  \ `ArrayIndexOutOfBounds`（数组越界）异常。\n\n如果程序员能够在显示组合框时锁定该对象，这种情况本是可以避免的。然而，Swing 的设计者决定不花费精力让\
  \ Swing 线程安全，原因有两个。首先，同步需要时间，没有人想进一步让 Swing 变慢。更重要的是，Swing 团队检查了其他团队在使用线程安全用户工具包时的经验。他们的发现结果并不令人鼓舞。使用线程安全工具包的程序员往往对同步需求感到困惑，并经常创建容易死锁的程序。\n\
  \n#### 14.11.1. 运行耗时任务\n\n当你结合 Swing 使用线程时，必须遵循两个简单的规则：\n\n1. 如果一个操作耗时很长，请在单独的工作线程中执行，绝不要在事件分派线程中执行。\n\
  2. 不要碰事件分派线程以外的任何线程中的 Swing 组件。\n\n第一个规则很容易理解。如果你在事件分派线程中执行长时间操作，应用程序看起来就像“死”了一样，因为它无法响应任何事件。特别是，事件分派线程永远不要进行输入/输出调用（这些可能会阻塞），并且永远不应该调用\
  \ `sleep`。（如果你需要等待特定的时间，请使用定时器事件。）\n\n第二条规则通常被称为 Swing 编程的单线程规则。我们在第 923 页进一步讨论它。这两条规则似乎是冲突的。假设你启动一个单独线程来运行耗时任务。你通常希望在线程工作时更新用户界面以指示进度。当任务完成时，你想要再次更新\
  \ GUI。但你不能从你的线程中操作 Swing。例如，如果你想更新进度条或标签，你不能简单地从你的线程设置它的值。\n\n为了解决这个问题，你可以在任何线程中使用两个实用方法向事件队列添加任意操作。例如，假设你想在线程中定期更新标签以指示进度。你不能从你的线程调用\
  \ `label.setText`。相反，请使用 `EventQueue` 类的 `invokeLater` 和 `invokeAndWait` 方法，让该调用在事件分派线程中执行。以下是操作方法：将\
  \ Swing 代码放入实现 `Runnable` 接口的类的 `run` 方法中。更新标签：\n\n```java\ninvokeLater(new Runnable()\
  \ {\n    public void run() {\n        label.setText(percentage + \"% complete\"\
  );\n    }\n});\n```\n\n`invokeLater` 方法在事件发布到事件队列后立即返回。`run` 方法是异步执行。`invokeAndWait`\
  \ 方法则会等待 `run` 方法实际执行完毕。对于更新进度标签，`invokeLater` 方法更合适。这两个方法都在事件分派线程中执行 `run` 方法。没有创建新线程。列表\
  \ 14.4 演示了如何使用 `invokeLater` 方法安全地修改组合框的内容。\n\n\n\n\n\n```java\nfinal JComboBox<Integer>\
  \ combo = new JComboBox<>();\n\ncombo.insertItemAt(Integer.MAX_VALUE, 0);\ncombo.setPrototypeDisplayValue(combo.getItemAt(0));\n\
  combo.setSelectedIndex(0);\n\nJPanel panel = new JPanel();\n\nJButton goodButton\
  \ = new JButton(\"Good\");\ngoodButton.addActionListener(new ActionListener()\n\
  {\n    public void actionPerformed(ActionEvent event)\n    {\n        new Thread(new\
  \ GoodWorkerRunnable(combo)).start();\n    }\n});\npanel.add(goodButton);\nJButton\
  \ badButton = new JButton(\"Bad\");\nbadButton.addActionListener(new ActionListener()\n\
  {\n    public void actionPerformed(ActionEvent event)\n    {\n        new Thread(new\
  \ BadWorkerRunnable(combo)).start();\n    }\n});\npanel.add(badButton);\n\npanel.add(combo);\n\
  add(panel);\npack();\n}\n}\n```\n\n/**\n * 此 runnable 通过随机添加和删除数字来修改组合框。这可能会导致\n\
  *错误，因为组合框的方法不是同步的，且工作线程和\n* 事件分发线程（EDT）都会访问该组合框。\n */\nclass BadWorkerRunnable implements\
  \ Runnable\n{\n    private JComboBox<Integer> combo;\n    private Random generator;\n\
  \n    public BadWorkerRunnable(JComboBox<Integer> aCombo)\n    {\n        combo\
  \ = aCombo;\n        generator = new Random();\n    }\n\n    public void run()\n\
  \    {\n        try\n        {\n            while (true)\n            {\n      \
  \          int i = Math.abs(generator.nextInt());\n                if (i % 2 ==\
  \ 0) combo.insertItemAt(i, 0);\n                else if (combo.getItemCount() >\
  \ 0) combo.removeItemAt(i % combo.getItemCount());\n                Thread.sleep(1);\n\
  \            }\n        }\n        catch (InterruptedException e)\n        {\n \
  \       }\n    }\n}\n\n/**\n * 此 runnable 通过随机添加和删除数字来修改组合框。为了\n * 确保组合框不被损坏，编辑操作被转发给\n\
  \ 事件线程。\n */\nclass GoodWorkerRunnable implements Runnable {\n    private JComboBox<Integer>\
  \ combo;\n    private Random generator;\n\n    public GoodWorkerRunnable(JComboBox<Integer>\
  \ aCombo)\n    {\n        combo = aCombo;\n        generator = new Random();\n \
  \   }\n\n    public void run()\n    {\n        try\n        {\n            while\
  \ (true)\n            {\n                EventQueue.invokeLater(new Runnable()\n\
  \                {\n                    public void run()\n                    {\n\
  \                        int i = Math.abs(generator.nextInt());\n              \
  \          if (i % 2 == 0) combo.insertItemAt(i, 0);\n                        else\
  \ if (combo.getItemCount() > 0) combo.removeItemAt(i % combo.getItemCount());\n\
  \                    }\n                });\n                Thread.sleep(1);\n\
  \            }\n        }\n        catch (InterruptedException e)\n        {\n \
  \       }\n    }\n}\n```\n\n\n\n\n\n在 `doInBackground` 方法中，我们逐行读取文件。在处理每一行之后，我们调用\
  \ `publish` 来发布行号和当前行的文本。\n\n点击此处查看代码图片\n\n```java\n@Override public StringBuilder\
  \ doInBackground() throws IOException, InterruptedException {\n    int lineNumber\
  \ = 0;\n    Scanner in = new Scanner(new FileInputStream(file));\n    while (in.hasNextLine())\
  \ {\n        String line = in.nextLine();\n        lineNumber++;\n        text.append(line);\n\
  \        text.append(\"\\n\");\n        ProgressData data = new ProgressData();\n\
  \        data.number = lineNumber;\n        data.line = line;\n        publish(data);\n\
  \        Thread.sleep(1); // to test cancellation; no need to do this in your programs\n\
  \    }\n    return text;\n}\n```\n\n我们在每行之后都会让休眠一毫秒，这样你就可以测试取消功能而不会感到压力，但你并不希望通过休眠来减慢自己程序的运行。如果你注释掉这一行，你会发现《基督山水仇》加载得非常快，只有几次批处理的用户界面更新。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n你可以通过从工作线程更新文本区域来让此程序运行得非常流畅，但对于大多数\
  \ Swing 组件来说是不可能的。我们向你展示一种通用方法，即所有组件更新都在事件分发线程（event dispatch thread）中完成。\n\n***\n\
  \n在 `process` 方法中，我们忽略除了最后一行之外的所有行号，并合并所有行以便对文本区域进行单更新。\n\n点击此处查看代码图片\n\n```java\n\
  @Override public void process(List<ProgressData> data) {\n    if (isCancelled())\
  \ return;\n    StringBuilder b = new StringBuilder();\n    statusLine.setText(\"\
  \" + data.get(data.size() - 1).number);\n    for (ProgressData d : data) { b.append(d.line);\
  \ b.append(\"\\n\"); }\n    textArea.append(b.toString());\n}\n```\n\n在 `done` 方法中，文本区域将更新为完整文本，并禁用“取消”菜单项。注意工作线程是在“打开”菜单项的事件监听器中启动的。这种简单的技术允许你在执行耗时任务的同时，保持用户界面的响应性。\n\
  \n### 列表 14.15. swingWorker/SwingWorkerTest.java\n\n点击此处查看代码图片\n\n```java\npackage\
