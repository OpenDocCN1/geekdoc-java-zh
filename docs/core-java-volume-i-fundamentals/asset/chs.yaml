  \n***\n\n## 9.7.2. 创建对话框\n\n在上一节中，你已经学习了如何使用 `JOptionPane` 类来显示简单的对话框。在本节中，你将看到如何手动创建一个这样的对话框。\n\
  \n图 9.38 显示了一个典型的模态对话框——当用户点击“关于（About）”按钮时显示的程序信息框。\n\n![Image](img/image01154.jpeg)\n\
  \n图 9.38. 一个“关于”对话框\n\n要实现一个对话框，你需要扩展 `JDialog` 类。这与为应用程序的主窗口扩展 `JFrame` 的过程本质上相同。具体来说：\n\
  \n1. 在你的对话框的构造函数中，调用父类 `JDialog` 的构造函数。\n2. 添加对话框的用户界面组件。\n3. 添加事件处理器。\n4. 设置对话框的大小。\n\
  \n当你调用父类构造函数时，你需要提供*所有者框架*（*owner frame*）、对话框标题以及*模态*（*modality*）。\n\n所有者框架控制对话框的显示位置。你可以提供\
  \ `null` 作为所有者；这样，对话框将由隐藏的框架拥有。\n\n模态指定了在对话框显示期间你的应用程序中哪些其他窗口会被阻塞。非模态对话框（modeless\
  \ dialog）阻塞其他窗口。模态对话框（modal dialog）阻塞应用程序的所有其他窗口（对话框的子窗口除外）。对于用户始终可以的工具箱，你会使用非模态对话框。相反，如果你强制用户在继续之前提供必需的信息，则会使用模态对话框。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n从 Java SE 6 开始，有两个额外的模态类型。文档模态对话框阻塞属于同一个“文档”的所有窗口，或者更准确地说，阻塞与对话框具有相同无父根窗口的所有窗口。这解决了帮助系统的一个问题。在旧版本中，当模态对话框弹出时，用户无法与帮助窗口交互。工具箱模态对话框（toolkit-modal\
  \ dialog）阻塞来自同一个“工具箱”的所有窗口。工具箱是一个启动多个应用程序的 Java 程序，例如浏览器中的 applet 引擎。有关这些高级问题的更多信息，请参见\
  \ [www.oracle.com/technetwork/articles/javase/modality-137604.html](http://www.oracle.com/technetwork/articles/javase/modality-137604.html)。\n\
  \n***\n\n以下是对话框的代码：\n\n点击此处查看代码图像\n\n```java\npublic AboutDialog extends JDialog\n\
  {\n// ... (代码内容保持不变)\n}\n```\n\n\n\n\n// About 项显示 About 对话框。\n\n```java\nJMenuItem\
  \ aboutItem = new JMenuItem(\"About\");\naboutItem.addActionListener(new ActionListener()\n\
  \    {\n        public void actionPerformed(ActionEvent event)\n        {\n    \
  \        if (dialog == null) // 第一次\n            dialog = new AboutDialog(DialogFrame.this);\n\
  \            dialog.setVisible(true); // 弹出对话框\n        }\n    });\nfileMenu.add(aboutItem);\n\
  \n// Exit 项退出程序。\n\nJMenuItem exitItem = new JMenuItem(\"Exit\");\nexitItem.addActionListener(new\
  \ ActionListener()\n    {\n        public void actionPerformed(ActionEvent event)\n\
  \        {\n            System.exit(0);\n        }\n    });\nfileMenu.add(exitItem);\n\
  ```\n\n### 列表 9.18. dialog/AboutDialog.java\n\n点击此处查看代码图像\n\n```java\npackage dialog;\n\
  \nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\n/**\n *\
  \ 一个示例模态对话框，显示消息并等待用户点击 Ok 按钮。\n */\npublic class AboutDialog extends JDialog\n\
  {\n    public AboutDialog(JFrame owner)\n    {\n        super(owner, \"About DialogTest\"\
  , true);\n\n        // 添加居中显示的 HTML 标签\n        add(\n            new JLabel(\n\
  \                \"<html><h1><i>Core Java</i></h1><hr>By Horstmann and Gary</html>\"\
  ),\n            BorderLayout.CENTER);\n\n        // Ok 按钮关闭对话框\n        JButton\
  \ ok = new JButton(\"Ok\");\n        ok.addActionListener(new ActionListener()\n\
  \            {\n                public void actionPerformed(ActionEvent event)\n\
  \                {\n                    setVisible(false);\n                }\n\
  \            });\n        // 将 Ok 按钮添加到南部边界\n        JPanel panel = new JPanel();\n\
  \        panel.add(ok);\n        add(panel, BorderLayout.SOUTH);\n\n        pack();\n\
  \    }\n}\n```\n\n### javax.swing.JDialog\n\n`public JDialog(Frame parent, String\
  \ title, boolean modal)` 构建一个对话框。在显式显示之前，该对话框是不可见的。\n\n![Image](img/image0155.jpeg)\n\
  \n### 9.7.3 数据交换\n\n弹出对话框最常见的原因是从用户处获取信息。你已经看到过创建一个对话框是多么简单：给它提供初始数据并调用 `setVisible(true)`\
  \ 即可在屏幕上显示对话框。现在，让我们来看看如何在对话框内外进行数据传输。\n\n考虑图 9.39 中的对话框，可以用于获取用户名和密码以连接某些在线服务。\n\
  \n![Image](img/image0156.jpeg)\n\n图 9.39. 密码对话框\n\n你的对话框应该提供设置默认数据的方法。例如，示例程序中的\
  \ `PasswordChooser` 类有一个方法 `setUser`，可以将默认值置入字段中：\n\n```java\npublic void setUser(User\
  \ u)\n{\n    username.setText(u.getName());\n}\n```\n\n一旦你设置了默认值（如果需要），通过调用 `setVisible(true)`\
  \ 显示对话框。此时对话框已显示。随后，用户填写信息并点击 OK 或取消按钮。这两个按钮的事件处理器都会调用 `setVisible(false)`，这将终止对\
  \ `setVisible(true)` 的调用。或者，用户也可以关闭对话框。如果你没有为对话框安装窗口监听器，则适用默认的窗口关闭机制：对话框变为不可见，这同样终止了对\
  \ `setVisible(true)` 的调用。\n\n关键问题是，`setVisible(true)` 的调用会阻塞直到用户关闭了对话框。这使得实现模态对话框变得简单。\n\
  \n你想知道用户是接受还是取消了对话框。我们的示例代码在显示对话框之前将 `ok` 标记设为 `false`。只有 OK 按钮的事件处理器会将 `ok` 标记设为\
  \ `true`。在这种情况下，你可以从对话框获取用户输入。\n\n![Image](img/image00948.jpeg)\n\n注意：从非模态（modeless）对话框向外传输数据并不简单。当显示非模态对话框时，`setVisible(true)`\
  \ 的调用不会阻塞，程序会在对话框显示期间继续运行。如果用户在非模态对话框上选择了项目然后点击 OK，对话框需要向程序中的某些监听器发送事件。\n\n示例程序包含了另一个有用的改进。当你构建\
  \ `JDialog` 对象时，你需要指定所有者帧（owner frame）。然而，通常你想用不同的所有者帧显示同一个对话框。最好在你准备显示对话框时选择所有者帧，而不是在构造\
  \ `PasswordChooser` 对象时。\n\n技巧是让 `PasswordChooser` 扩展 `JPanel` 而不是 `JDialog`。在 `showDialog`\
  \ 方法中动态构建 `JDialog` 对象：\n\n```java\npublic boolean showDialog(Frame owner, String\
  \ title)\n{\n    ok = false;\n    if (dialog == null || dialog.getOwner() != owner)\n\
  \    {\n        dialog = new JDialog(owner, true);\n        dialog.add(this);\n\
  \        dialog.pack();\n    }\n    dialog.setTitle(title);\n    dialog.setVisible(true);\n\
  \    return ok;\n}\n```\n\n注意 `owner` 等于 `null` 是安全的。你可以做得更好。有时所有者帧不可用。从任何组件计算它都是很容易的，如下所示：\n\
  \n```java\nFrame owner;\nif (parent instanceof Frame)\n    owner = (Frame) parent;\n\
  else\n    owner = (Frame) SwingUtilities.getAncestorOf(Frame.class, parent);\n```\n\
  \n我们在 `JOptionPane` 类中使用了这种增强。许多对话框有一个默认按钮，如果用户按下 Enter 键（在特定的外观方案下），该按钮会被选中。在对话框的根面板中设置默认按钮：\n\
