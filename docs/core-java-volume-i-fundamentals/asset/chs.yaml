  \ Cliff Berg, Joshua Bloch, David Brown, Corky Cartwright, Frank Cohen (PushToTest),\
  \ Chris Crane (devXsolution), Dr. Nicholas J. De Lillo (曼哈顿学院), Rakesh Dhoopar (Oracle),\
  \ David Geary (Clarity Training), Jim Gish (Oracle), Brian Goetz (Oracle), Angela\
  \ Gordon, Dan Gordon (Electric Cloud), Rob Gordon, John Gray (哈特福大学), Cameron Gregory\
  \ (olabs.com), Marty Hall (coreservlets.com, Inc.), Vincent Hardy (Adobe Systems),\
  \ Dan Harkey (圣何何州立大学), William Higgins (IBM), Vladimir Ivanovic (PointBase), Jerry\
  \ Jackson (CA Technologies), Tim Kimmet (Walmart), Chris Laffra, Charlie Lai (Apple),\
  \ Angelika Langer, Doug Langston, Hang Lau (麦吉尔大学), Mark Lawrence, Doug Lea (SUNY\
  \ Oswego), Gregory Longshore, Bob Lynch (Lynch Associates), Philip Milne (顾问), Mark\
  \ Morrissey (俄勒冈研究生学院), Mahesh Neelakanta (佛罗里达大西洋大学), Hao Pham, Paul Philion, Blake\
  \ Ragsdell, Stuart Reges (亚利桑那大学), Rich (Interactive Data Corporation), Peter Sanders\
  \ (法国尼斯 ESSI 大学), Dr. Paul Sanghera (Sun Systems), Paul van der Linden (摩托罗拉), Burt\
  \ Walsh (Oracle), John Zavgren (Oracle).\n\n\n\n但是，正如我们在第一版中所说的，Java 从来不仅仅是一门语言。世界上有很多编程语言，但很少有语言能引起巨大的轰动。Java\
  \ 是一个完整的平台，拥有包含大量可重用代码的海量库，以及一个提供安全性、跨操作系统可移植性和自动垃圾回收等服务的执行环境。\n\n作为一名程序员，你会希望拥有一种拥有良好语法和易于理解的语义的语言（即不是\
  \ `C++`）。Java 正符合这一要求，其他几十种优秀的语言也是如此。某些语言虽然提供了可移植性、垃圾回收等功能，但它们没有太多的库，如果你需要精细的图形、网络或数据库访问，就迫使你自己实现。然而，Java\
  \ 拥有一切——一种优秀的语言、高质量的执行环境以及庞大的库。这种组合使得 Java 对许多程序员来说都是一个不可抗拒的提议。\n\n## 1.2. Java“白皮书”热词\n\
  \nJava 的作者们编写了一份具有影响力的《白皮书》，解释了他们的设计目标和成就。他们还发布了一份较短的总结，按照以下 11 个热词进行组织：\n\n1. 简单\
  \ (Simple)\n2. 面对象 (Object-Oriented)\n3. 擅长网络 (Network-Savvy)\n4. 健壮 (Robust)\n\
  5. 安全 (Secure)\n6. 架构中立 (Architecture-Neutral)\n7. 可移植 (Portable)\n8. 解释型 (Interpreted)\n\
  9. 高性能 (High-Performance)\n10. 多线程 (Multithreaded)\n11. 动态 (Dynamic)\n\n在本节中，我们将：\n\
  \n• 结合白皮书的摘，总结 Java 设计者对每个热词的看法；\n• 根据我们对当前版本 Java 的经验，告诉您我们对每个热词的看法。\n\n***\n\n\
  ![Image](img/image00948.jpeg) Note\n\n在我们写这本书时，白皮书可以在 [www.oracle.com/technetwork/java/langenv-140151.html](http://www.oracle.com/technetwork/java/langenv-140151.html)\
  \ 找到。包含 11 个热词的总结可以在 [`labs.oracle.com/features/tenyears/volcd/papers/7Gosling.pdf`](http://labs.oracle.com/features/tenyears/volcd/papers/7Gosling.pdf)\
  \ 找到。\n\n***\n\n### 1.2.1. 简单\n\n*我们想要构建一个易于编程、无需深奥培训且能利用今日标准实践的系统。因此，尽管我们发现 `C++`\
  \ 并不合适，但我们将 Java 设计得尽可能接近 `C++`，以使系统更易于理解。Java 略了 `C++` 中许多很少使用、难以理解且令人困惑的特性，根据我们的经验，这些特性带来的麻烦多于收益。*\n\
  \nJava 的语法确实是 `C++` 语法的精简版本。不需要头文件、指针算术（甚至不需要指针语法）、结构体、联合体、运算符重载、虚基类等。（请参见文中穿插的\
  \ `C++` 注释以了解更多关于 Java 和 `C++` 之间的差异。）然而，设计者并没有尝试修复 `C++` 的所有笨拙特性。例如，Java 中 `switch`\
  \ 语句的语法保持不变。如果你熟悉 `C++`，你会发现过渡到 Java 语法非常容易。\n\n如果你习惯了视觉编程环境（如 Visual Basic），你不会认为\
  \ Java 是简单的。它有很多奇怪的语法（尽管并不花费长时间就能掌握）。更重要的是，你必须在 Java 中编写更多的代码。Visual Basic 的美之处在于它的视觉化设计环境几乎自动地为应用程序提供了大量基础设施。而在\
  \ Java 中，等等的功能必须手动编写，通常需要相当多的代码。不过，也有第三方开发环境提供了“拖拽式”的程序开发模式。\n\n*“简单”的另一个方面是“短小”。Java\
  \ 的目标之一是能够构建出可以在小型机器上独立运行的软件。基础解释器和类支持的大小约为 40K；基础标准库和线程支持（本质上是一个自包含的微内核）又增加了 175K。*\n\
  \n这在当时是一项伟大的成就。当然，该库从以来已经增长到了巨大的规模。现在有一个单独的 Java 微型版（Micro Edition），其库较小，适用于嵌入式设备。\n\
  \n### 1.2.2. 面对象\n\n*简单来说，面向对象的设计是一种编程技术，它关注数据（=对象）以及指向该对象的接口。用木工来类比，“面向对象”的木工会主要关注他正在做的椅子，其次才关注制作椅子的工具；而“非面向对象”的木工则首先考虑他的工具。Java\
  \ 的面向对象设施本质上与 `C++` 一。*\n\n面向对象在过去的四十年中证明了它的价值，无法想象现代编程语言不会使用它。事实上，Java 的面向对象特性可以与\
  \ `C++` 相比。Java 和 `C++` 之间的主要区别在于多继承（Java 用更简单的接口概念取代了它），以及 Java 的元类模型（我们在第 5 章中讨论）。\n\
  \n***\n\n![Image](img/image00948.jpeg) Note\n\n如果你没有面向对象编程语言的经验，你将希望仔细阅读第 4 章到第\
  \ 6 章。这些章节将解释了什么是面向对象编程，以及为什么它比 C 或 Basic 等传统的过程化语言更有用。\n\n***\n\n### 1.2.3. 擅长网络\n\
  \n*Java 拥有一系列处理 TCP/IP 协议（如 HTTP 和 FTP）的广泛例程。Java 程序可以像访问文件系统一样轻松访问对象。*\n\n我们发现\
  \ Java 的网络功能既强大又易用。任何尝试用其他语言进行互联网编程的人都会叹于 Java 如何让打开套接连接等困难任务变得简单。（我们在第二卷中介绍网络。）远程调用机制实现了分布式对象之间的通信（同样在第二卷中介绍）。\n\
  \n### 1.2.4. 健壮\n\n*Java 旨在用于编写在各种方面必须可靠的程序。Java 非常强调早期检查可能的问题、后期动态（运行时）检查，以及消除易错的情况。……Java\
  \ 与 C/C++ 之间最大的区别在于，Java 有一种指针模型消除了覆盖内存和损坏数据的可能性。*\n\n这一特性也非常有用。Java 编译器可以检测许多在其他语言中只会在运行时出现的问题。至于第二点，任何曾花费数小时追踪指针\
  \ Bug 导致的内存损坏的人都会对 Java 的这一特性感到非常高兴。\n\n如果你来自像 Visual Basic 这样不显式使用指针的语言，你可能会奇怪这为什么很重要。C\
  \ 程序员就没有那么幸运了。他们需要指针来访问字符串、数组、对象甚至文件。在 Visual Basic 中，你不需要为这些实体使用指针，也不需要为它们的内存分配担心。另一方面，许多数据结构在无指针的语言中很难实现。Java\
  \ 让你兼得其长：对于字符串和数组等日常结构你不需要指针；如果你需要（例如链表），你拥有指针的力量。而且你永远拥有完全的安全，因为你永远不会访问错误的指针或发生内存分配错误。\n\
  \n### 1.2.5. 安全\n\n*Java 用于网络化/分布式环境。为了这一点，安全性被了了关注。Java 能够构建无病毒、防篡改的系统。*\n\n\n\n\
  在*Core Java*第一版中，我们曾说过：“嗯，人们应该‘永远不要说不再’，”而事实证明我们是正确的。在第一版 Java 开发工具包（JDK）发布后不久，普林顿大学的一组安全专家在\
  \ Java 1.0 的安全功能中发现了细微的漏洞。Sun Microsystems 公司一直鼓励对 Java 安全性的研究，并公开了虚拟机和安全库的规范与实现。他们迅速修复了所有已知的安全漏洞。无论如何，想要绕过\
  \ Java 的安全机制极其困难。到目前为止发现的漏洞都非常具有技术性，而且数量较少。\n\n从一开始，Java 的设计目标就是为了让某些类型的攻击变得不可能，其中包括：\n\
  \n• 运行栈溢出——蠕虫和病毒的常见攻击手段\n• 破坏自身进程空间之外的内存\n• 在未授权的情况下读取或写入文件\n\n随着时间的推移，Java 增加了许多安全功能。从\
  \ 1.1 版本开始，Java 就引入了数字签名类的概念（参见第二卷）。通过签名的类，你可以确定它是谁编写的。如果你信任该类的作者，就可以允许该类在你的机器上拥有更高的权限。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n微软一种基于其 ActiveX 技术的竞争性代码交付机制仅依赖数字签名来保证安全。显然这并不足够——正如任何微软产品的用户都能证实的那样，来自知名供应商的程序确实会崩溃并造成损害。Java\
  \ 拥有比 ActiveX 强得的安全模型，因为它在程序运行时对其进行控制，阻止其肆虐作非。\n\n***\n\n### 1.2.6 架构无关 (Architecture-Neutral)\n\
  \n*Java 解释器可以在任何移植了它的机器上执行字节码。由于链接是一个增量且轻量级的过程，开发过程可以更加快速。*\n\n增量链接具有优势，但其对开发过程的收益被夸大了。早期的\
  \ Java 开发工具实际上非常慢。今天，字节码通过即时编译器翻译成机器码。\n\nJava 编译器通过生成一种架构无关的对象文件格式，这种格式在任何机器上都是可执行的，并且在运行时（fly）翻译成机器码。\n\
  \n*Java 解释器可以在任何移植了它的机器上执行字节码。由于链接是一个增量且轻量级的过程，开发过程可以更加快速。*\n\n这并不是一个新主意。四十年前，维特（Wirth）的\
  \ Pascal 就采用了这种技术。\n\n*Java 解释器可以在任何移植了它的机器上执行字节码。由于链接是一个增量且轻量级的过程，开发过程可以更加快速。*\n\
  \n因此，解释字节码的运行速度要慢得多。今天，字节码由即时编译器翻译成机器码。\n\nJava 虚拟机在运行时监控执行频繁的字节码。事实上，Java 虚拟机通过运行时将执行频繁的字节码翻译成机器码。\n\
  \n### 1.2.7 可移植性 (Portable)\n\n*与 C/C++ 不同，Java 的某些特性是平台无关的。*\n\nJava 的某些类型是平台无关的，它们在运行时可以被翻译成机器码。\n\
  \n*与 C/C++ 不同，Java 的某些特性是平台无关的。*\n\nJava 的某些类型是平台无关的，在运行时可以被翻译成机器码。这使得移植问题变得不再困难。\n\
  \n*与 C/C++ 不同，Java 的某些特性是平台无关的。*\n\nJava 的某些类型是平台无关的，它们在运行时可以被翻译成机器码。这使得移植问题变得不再困难。\n\
  \n*与 C/C++ 不同，Java 的某些特性是平台无关的。*\n\nJava 的某些类型是平台无关的，它们在运行时可以被翻译成机器码。这使得移植问题变得不再困难。\n\
  \n### 1.2.8 解释执行 (Interpreted)\n\n*Java 解释器可以在任何移植了它的机器上执行字节码。由于链接是一个增量且轻量级的过程，开发过程可以更加快速。*\n\
  \n增量链接具有优势，但其对开发过程的收益被夸大了。早期的 Java 开发工具实际上非常慢。今天，字节码通过即时编译器翻译成机器码。\n\n### 1.2.9\
  \ 高性能 (High-Performance)\n\n*虽然解释执行字节码的性能通常足够，但在某些情况下需要更高的性能。字节码可以在运行时（fly）翻译为特定\
  \ CPU 的机器码。*\n\nJava 早期，许多用户不同意“性能足够”的说法。然而，今天，即时编译器已经非常优秀，可以与传统编译器竞争，在某些情况下甚至优于它们，因为它们拥有更多的信息。例如，即时编译器可以监控哪些代码被执行频繁，并对这些代码进行优化。一种更高级的优化是消除函数调用（内联）。即时编译器知道加载了哪些类。当根据当前加载的类集合，某个函数不会被重写时，它就可以进行内联，并在需要时可以撤销这种优化。\n\
  \n### 1.2.10 多线程 (Multithreaded)\n\n*多线程的益处是更好的交互响应能力和实时行为。*\n\n如果你曾在其他语言中尝试过多线程，你将会对\
  \ Java 中多线程的简单性感到惊喜。如果基础操作系统支持，Java 线程可以利用多处理器系统。缺点是，主要平台的线程实现差异巨大，Java 在这方面并未做到平台无关。调用多线程的代码在不同机器上是相同的；Java\
  \ 将线程的实现交给底层操作系统或线程库。然而，多线程的易用性是 Java 如此吸引人的原因之一。\n\n### 1.2.11 动态性 (Dynamic)\n\n\
  *在许多方面，Java 比 C 或 C++ 是一种更动态的语言。它的设计是为了适应不断变化。库可以自由地添加新方法和实例变量，而对其客户端产生任何影响。在 Java\
  \ 中，获取运行时类型信息是简单的。*\n\n\n\n\n在需要向运行中的程序中添加代码的情况下，这是一个非常重要的特性。一个典型的例子是从互联网下载代码并在浏览器中运行。在\
  \ Java 1.0 中，获取运行时类型信息可谓绝非易事，但当前版本的 Java 让程序员对对象的结构和行为都有了完全透彻的洞察。这对于那些在运行时分析对象的系统极其有用，例如\
  \ `Java` GUI 生成器、智能调试器、可插拔组件和对象数据库。\n\n![Image](img/image00948.jpeg) 备记\n\n在 Java\
  \ 取得初步成功后不久，微软发布了一款名为 `J++` 的产品，其编程语言和虚拟机与 Java 几乎相同。此时，微软已不再支持 `J++`，而是引入了另一种名为\
  \ `C#` 的语言，该语言与 Java 也有许多相似之处，但运行在不同的虚拟机上。甚至还有一种 `J#`，用于将 `J++` 应用程序迁移到 `C#` 使用的虚拟机上。我们本书中将不介绍\
  \ `J++`、`C#` 或 `J#`。\n\n## 1.3 Java Applets 与互联网\n\n这里的想法非常简单：用户从互联网下载 Java 字节码并在自己的机器上运行。在网页上运行的\
  \ Java 程序被称为 `applets`（Java 小程序）。要使用 applet，你只需要一个支持 Java 的网络浏览器，它会为你执行字节码。你不需要安装任何软件。由于\
  \ `Oracle` 授权了 Java 源代码并坚持语言和标准库不发生任何更改，因此一个 Java applet 应该运行在任何宣称支持 Java 的浏览器上。每当你访问包含该\
  \ applet 的网页时，都能获得该程序的最新版本。最重要的是，得益虚拟机的安全性，你永远不需要担心来自恶意代码的攻击。\n\n将 applet 插入网页的操作与嵌入图像非常相似。applet\
  \ 成为页面的一部分，文本会环绕 applet 占据的空间流动。关键点在于，这张图像是“活的”。它能对用户命令做出反应，改变自己的外观，并在展示 applet\
  \ 的计算机与提供服务的计算机之间交换数据。\n\n图 1.1 展示了一个执行复杂计算的动态网页的良好示例。`Jmol` applet 显示了分子结构。通过鼠标，你可以旋转和缩放每个分子，以更好地理解其结构。这种直接操作在静态网页上是无法实现的，但\
  \ applets 使其成为可能。（你可以在 [`jmol.sourceforge.net`](http://jmol.sourceforge.net) 找到这个\
  \ applet。）\n\n![Image](img/image00952.jpeg)\n\n图 1.1. Jmol applet\n\n当 applets 首次出现时，引发了巨大的兴奋。许多人认为，applet\
  \ 的吸引力是 Java 获得惊人人气的原因。然而，最初的兴奋很快转变为挫败。不同版本的 `Netscape` 和 `Internet Explorer` 运行不同版本的\
  \ Java，其中某些版本已经严重过时。这种糟糕的局面使得开发利用最新版本 Java 特性的 applet 变得越来越困难。今天，当浏览器中需要动态效果时，大多数网页简单地使用\
  \ `JavaScript` 或 `Flash`。而 Java 已成为开发生成网页并执行后端逻辑的服务器端应用程序最流行的语言。\n\n## 1.4 Java\
  \ 简史\n\n本节简述了 Java 的演变历史。它基于各种出版来源（最重要的是 1995 年 7 月份 `SunWorld` 在线杂志对 Java 创造者的采访）。\n\
  \nJava 的历史可以追溯到 1991 年，当时一组由 Patrick Naughton 和 James Gosling（一位 `Sun Fellow`，也是全能的计算机天才）领导的\
  \ Sun 工程师，想要设计一种小型计算机语言，可用于电缆电视机盒等消费级设备。由于这些设备没有大量的功率或内存，这种语言必须很小并且能生成非常紧凑的代码。此外，由于不同的制造商可能会选择不同的中央处理器（CPU），该语言不绑定到任何单一架构至关重要。该项目的代号为“Green”（绿色）。\n\
  \n对小巧、紧凑且平台中立代码的需求导致团队恢复了某些 Pascal 实现版在 PC 早期尝试过的模型。Pascal 的发明者 Niklaus Wirth 曾创了一种可移植语言的设计，该语言为一种假设机器生成中间代码。（这类机器通常被称为\
  \ `virtual` 虚拟——因此有了 Java 虚拟机，即 `JVM`。）这种中间代码随后可以在任何具有正确解释器的机器上使用。Green 项目的工程师也使用了虚拟机，这解决了他们的主要问题。\n\
  \n然而，Sun 的人们来自 UNIX 背景，因此他们基于 `C++` 而不是 Pascal 开发语言。特别是，他们将语言设计为面向对象而非面向过程。但正如 Gosling\
  \ 在采访中所说，“从始终，这种语言是一种工具，而不是目的。” Gosling 决定将他的语言命名为“Oak”（橡树）（可能是因为他喜欢 Sun 公司窗外外那棵橡树的样子）。Sun\
  \ 的人们后来意识到 `Oak` 是一个现有计算机语言的名字，于是他们将名称改为 `Java`。事实证明这是一个极具见地的选择。\n\n1992 年，Green\
  \ 项目交付了它的第一个产品，名为“7”。它是一个极其智能的遥控器。（它在一个 6 英寸 x 4 英寸 x 4 英寸的盒子里拥有 `SPARCstation`\
  \ 的性能。）遗憾的是，没有人感兴趣生产它，Sun 内部不得不寻找其他方式来营销这项技术。然而，消费电子公司都不感兴趣。随后该小组竞标了一个设计按需电缆盒的项目。他们没有获得该合同。（有趣的是，获得合同的公司是由创立\
  \ Netscape 的人领导的。）\n\nGreen 项目（当时更名为 `First Person, Inc.`）在 1993 年全年和 1994 年上半年里都在寻找购买其技术的人。没有人找到。（该小组的创始人之一，也是最终负责大部分营销工作的\
  \ Patrick Naughton 声称，在试图销售该技术时他积累了 30 万英里的飞行里程。）First Person 在 1994 年解散。\n\n当 Sun\
  \ 内部发生这一切时，互联网的万维网部分正在越来越大。万维网的关键在于浏览器将超文本页面转换为显示。1994 年，大多数人使用 Mosaic，这是一种 1993\
  \ 年来自伊利诺伊大学超级计算中心的非商业网络浏览器。（Mosaic 部分由 Marc Andreessen 作为一名学生通过勤工项目编写，当时时薪 6.85\
  \ 美元。他随后作为 Netscape 的联合创始人之一和技术官名利双收。）\n\n在 `SunWorld` 的采访中，Gosling 提到在 1994 年年中，语言开发者们意识到“我们可以做一个非常酷的浏览器。它是客户端/服务器主流领域极少数需要我们所做的那些奇特功能的东西之一：架构中立、实时、可靠、安全——这些问题在工作站世界并不特别重要。所以我们造了一个浏览器。”\n\
  \n实际的浏览器由 Patrick Naughton 和 Jonathan Payne 构建，并演变为 HotJava 浏览器。HotJava 浏览器是用 Java\
  \ 编写的，旨在展示 Java 的强大。但构建者们也考虑了现在称为 applets 的功能，因此他们让浏览器具备执行网页内代码的能力。这项“技术证明”在 1995\
  \ 年 5 月 23 日的 SunWorld ’95 上展示，并引发了持续至今的 Java 热潮。\n\n\n\n\nSun 在 1996 年初发布了第一个版本的\
  \ Java。人们很快意识到，`Java 1.0` 无法满足严肃的应用开发需求。确实，你可以使用 `Java 1.0` 制作一个在画布上随机移动文字的文本小程序（applet），但在\
  \ `Java 1.0` 中你甚至无法进行打印。坦率地说，`Java 1.0` 还没有准备好。它的继任版本 `1.1` 填补了最明显的缺陷，极大地改进了反射能力，并为\
  \ GUI 编程添加了新的事件模型。尽管如此，它的功能仍然相当有限。\n\n1998 年 JavaOne 大会的最重大消息是即将发布的 `Java 1.2`，它将早期的玩具化\
  \ GUI 和图形工具包替换为复杂的、可扩展的版本，并且比其之前的版本更接近“一次编写，随处运行”（Write Once, Run Anywhere™）的承诺。在\
  \ 1998 年 12 月发布仅三天（！）），Sun 的营销部门将其名称更改为更有吸引力的 `Java 2 Standard Edition Software\
  \ Development Kit Versions 1.2`。\n\n除了标准版（Standard Edition）之外，还引入了两个版本：用于手机等嵌入式设备的微型（Micro\
  \ Edition），以及用于服务器端处理的企业版（Enterprise Edition）。本书侧重于标准版。\n\n标准版的 `1.3` 和 `1.4` 版本是对初始\
  \ `Java 2` 版本的增量改进，具有不断增长的标准库、更高的性能，当然，还修复了许多漏洞（bug）。在此期间，关于 Java 小程序和客户端应用的大部分最初热度消退，但\
  \ Java 变成了服务器端应用的首选平台。\n\n`5.0` 版本是自 `1.1` 版本以来首次以重大方式更新 Java 语言的版本（该版本最初编号为 `1.5`，但版本号在\
  \ 2004 年 JavaOne 大会上跳到了 `5.0`）。经过多年的研究，泛型（generic types，大致等同于 `C++` 模板）被添加了——挑战是在不改变虚拟机的情况下添加这一功能。其他几个实用的语言特性也受到了\
  \ `C#` 的启发：“for each”循环、自动装箱和元数据。\n\n第 `6` 版本（不带 `.0` 后缀）于 2006 年底发布。同样，没有语言变化，但有了额外的性能改进和库增强。\n\
  \n随着数据中心日益依赖商品化硬件而非专用服务器，Sun Microsystems 陷入了困境，并于 2009 年被 `Oracle` 收。Java 的开发停滞了很久。2011\
  \ 年，`Oracle` 发布了带有简单增强的新版本 `Java 7`，并决定将更有野心的改进推迟到 `Java 8`，后者预计于 2013 年发布。\n\n\
  表 1.1 显示了 Java 语言和库的演变。如你所见，应用程序接口（`API`）的大小已经巨大增长。\n\n表 1.1 Java 语言的演变\n\n![Image](img/image00953.jpeg)\n\
  \n## 1.5 Java 的常见误解\n\n我们通过列举关于 Java 的常见误解及其注释来结束本章。\n\n*Java 是 HTML 的扩展。*\n\nJava\
  \ 是一种编程语言；`HTML` 是一种描述网页结构的方法。它们之间没有任何共同点，除了有 `HTML` 扩展允许在网页上放置 Java 小程序。\n\n*我使用\
  \ XML，所以我我不需要 Java。*\n\nJava 是一种编程语言；`XML` 是一种描述数据的方法。你可以用任何编程语言处理 `XML` 数据，但 Java\
  \ `API` 包含了对 `XML` 处理卓越的支持。此外，许多重要的第三方 `XML` 工具都是用 Java 实现的。更多信息请参阅第二卷。\n\n*Java\
  \ 是一门容易学习的编程语言。*\n\n没有任何像 Java 这样强大的编程语言是容易上手的。你始终必须区分编写玩具程序有多容易，以及从事严肃工作有多困难。此外，请注意，书中只有四个章节讨论了\
  \ Java 语言。两卷书中剩下的章节都展示了如何使用 Java `libraries` 来让这种语言工作起来。Java `libraries` 包含了成千上万个类和接口以及数万个函数。幸运的是，你不需要了解其中的每一个，但为了用\
  \ Java 编写任何现实的任务，你确实需要掌握惊人多的内容。\n\n*Java 将成为适用于所有平台的通用编程语言。*\n\n这在理论上是可能的，而且似乎是除了微软之外的每个厂商都希望发生的事情。然而，许多在桌面端已经运行良好的应用程序在其他设备或浏览器内部运行得可能并不好。此外，这些应用程序在编写时已经利用了处理器的速度和原生用户界面库，并且已经被移植到了所有重要的平台。这类应用程序包括文字处理器、照片编辑器和网络浏览器。它们通常用\
  \ `C` 或 `C++` 编写，我们认为用 Java 重写它们对最终用户没有好处。\n\n*Java 只是另一种编程语言。*\n\nJava 是一门很好的编程语言；大多数程序员比起\
  \ `C`、`C++` 或 `C#` 更喜欢它。但曾出现数百种优秀的编程语言从未获得过普及，而具有明显缺陷的语言（如 `C++` 和 `Visual Basic`）却取得了巨大的成功。\n\
  \n为什么？编程语言的成功更多取决于其周围支持系统的实用性，而不是语法的优雅程度。对于你需要实现的功能，是否有有用、方便且标准的库？是否有工具供应商构建出优秀的编程和调试环境？语言和工具集是否与计算基础设施的其他部分集成？Java\
  \ 之所以成功是因为它的类库让你能够轻松地完成以前很难的事情，例如网络编程和多线程。\n\n*既然有了 C#，Java 就过时了。*\n\n`C#` 从 Java\
  \ 中吸收了很多好主意，例如简洁的编程语言、虚拟机和垃圾收集。但由于某些原因，`C#` 也留下了一些问题，特别是安全性和平台独立性。如果你受限于 Windows，`C#`\
  \ 很有意义。但从招聘广告来看，Java 仍然是大多数开发者的首选语言。\n\n*Java 是专有的，应该避免使用。*\n\n当 Java 最初创建时，Sun\
  \ 向分销商和最终用户提供了免费许可。尽管 Sun 对 Java 拥有最终控制权，但他们让许多其他公司参与了语言修订和新库的设计。虚拟机和库的源代码一直免费提供，但仅供检查，而不供修改和分发。Java\
  \ 是“封闭的，但处事友善”。\n\n这种情况在 2007 年发生了剧变，当时 Sun 宣布未来的 Java 版本将根据通用公共许可证（`GPL`）发布，这是\
  \ Linux 使用的相同的开源许可证。`Oracle` 承诺保持 Java 开源。唯一的斑点是专利。每个人都获得了在 `GPL` 许可使用和修改 Java 的专利许可，但仅限于桌面和服务器平台。如果你想在嵌入式系统中使用\
  \ Java，你需要不同的许可并可能需要支付特许费。然而，这些专利将在未来十年内过期，到那时 Java 将完全免费。\n\n*Java 是被解释执行的，所以对于严肃应用来说太慢了。*\n\
  \n在 Java 早期，这种语言是解释执行的。现在，除了手机等“微型”平台外，Java 虚拟机使用即时编译器。你的代码“热点”部分在 Java 中的运行速度与在\
  \ `C++` 中一样，在某些情况下甚至更快。\n\n\n\n\nJava 相比 C++ 确实有一些额外的开销。虚拟机的启动时间较慢，而且 Java GUI 也比它们的原生对应程序慢，因为它们是以平台无关的方式进行绘制的。\n\
  \n多年来，人们一直在抱怨 Java 运行速度慢。然而，今天的计算机比这些抱怨开始时的计算机要快得多。如今，一个运行缓慢的 Java 程序，效果仍然比几年前那些快得惊人的\
  \ C++ 程序要好得多。在目前这个节点，这些抱怨听起来像是在“吃醋的葡萄”，有些反对者反而开始抱怨 Java 用户界面难看，而不是运行慢。\n\n*所有的 Java\
  \ 程序都运行在网页内部。*\n\n所有的 Java `applets` 都运行在 浏览器内部。这就是 applet 的定义——一种运行在浏览器内部的 Java\
  \ 程序。但大多数 Java 程序都是运行在 Web 浏览器之外的独立应用程序。事实上，许多 Java 程序运行在 Web 服务器上，并生成网页代码。\n\n\
  *Java 程序是一个重大的安全风险。*\n\n在 Java 早期，曾出现过一些广为人知的关于 Java 安全系统故障的报告。大多数故障发生在特定浏览器对 Java\
  \ 的实现中。研究人员将其视为一种挑战，试图寻找 Java 盔甲上的破绽，并挑战 applet 安全模型的强大和复杂性。他们发现的技术性故障都已得到迅速修正，据我们所知，没有任何实际系统曾被攻破。为了客观评价这一点，请考虑\
  \ Windows 可执行文件和 Word 宏中数以百万计的病毒攻击，它们造成了真正的困扰，但对被攻击平台弱点的批评却少得惊人。此外，Internet Explorer\
  \ 中的 ActiveX 机制也是一个滥用的温床，但绕过它的方法是如此平直而易见，以至于很少研究人员花精力公布他们的发现。\n\n一些系统管理员甚至在公司浏览器中禁用了\
  \ Java，同时继续允许用户下载可执行文件和 Word 文档，而后者的风险大得多。即使在发布 15 年后，Java 也比任何其他常用的执行平台都要安全得多。\n\
  \n*JavaScript 是 Java 的简化版本。*\n\nJavaScript 是一种可以在网页内使用的脚本语言，它由 Netscape 发明，最初称为\
  \ `LiveScript`。JavaScript 的语法让人联想起 Java，但除此之外，两者之间没有关系（当然，名称除外）。JavaScript 的子集被标准化为\
  \ `ECMA-262`。JavaScript 与浏览器的集成程度比 Java applets 更紧密。特别是，JavaScript 程序可以修改正在显示的文档，而\
  \ applet 只能控制有限区域的显示效果。\n\n*通过 Java，我可以用一台 500 美元的“互联网设备”来取代我的电脑。*\n\n当 Java 刚发布时，有些人大注豪言这种情况会发生。公司生产了\
  \ Java 驱动的网络计算机的原型，但用户还没有准备好放弃强大且便捷的桌面电脑，转而使用没有本地存储的有限机器。我们发现，Java 驱动的网络计算机是实现“零管理倡议”以降低企业计算机拥有成本的一种可行选择，但即使是这样大规模地发生。这一代平板电脑并没有使用\
  \ Java。\n\n# 第 2 章 Java 编程环境\n\n* *\n\n## 本章内容\n\n• 安装 Java 开发包\n• 选择开发环境\n• 使用命令行工具\n\
  • 使用集成开发环境\n• 运行图形化应用\n• 构建和运行 Applets\n\n* *\n\n在本章中，你将学习如何安装 Java 开发包（`JDK`）以及如何编译和运行各种程序：控制台程序、图形化应用和\
  \ applet。你可以在 shell 窗口中输入命令来运行 `JDK` 工具。然而，许多程序员更喜欢集成开发环境带来的便利。我们将向你展示如何使用免费的开发环境来编译和运行\
  \ Java 程序。虽然集成开发环境更容易学习，但对于小型程序来说，它们可能消耗资源且使用繁琐。一旦你掌握了本章中的技术并选择了你的开发工具，就可以准备进入第\
  \ 3 章了，在那里你将开始探索 Java 编程语言。\n\n## 2.1. 安装 Java 开发包\n\nOracle 提供了最新完整的 Java 开发包（`JDK`），适用于\
  \ Linux、Mac OS X、Solaris 和 Windows。其他平台也存在处于不同开发状态的版本，但那些版本是由相应平台的供应商授权并分发的。\n\n\
  ### 2.1.1. 下载 JDK\n\n要下载 Java 开发包，请访问网站 [www.oracle.com/technetwork/java/javase/downloads](http://www.oracle.com/technetwork/java/javase/downloads)，并在获取你所需的软件之前，准备好解读大量的专业术语。总结信息请参阅表\
  \ 2.1。\n\n表 2.1 Java 术语\n\n![Image](img/image00954.jpeg)\n\n你已经看到过 Java 开发包的缩写 `JDK`。稍微有点让人困惑的是，该工具包的\
  \ 1.2 到 1.4 版本被称为 Java `SDK`（软件开发包）。你仍会偶尔看到对旧术语的引用。还有 Java 运行时环境（`JRE`），它包含虚拟机但不包含编译器。作为开发者，你需要的不是它。接下来，你会随处看到\
  \ `Java SE` 术语。它是标准版，相对于 Java `EE`（企业版）和 Java `ME`（微型版）。\n\n你偶尔会遇到 `Java 2` 这个术语，这是\
  \ Sun 的营销人员在 1998 年提出的，当时他们认为版本号的增加无法传达巨大的进展。然而，由于他们在发布后才有了这一见解，决定保留 `1.2` 作为开发包的版本号。随后的版本被命名为\
  \ `1.3`、`1.4` 和 `5.0`。然而，平台被更名为 `Java 2`。因此，我们有了 Java 2 标准版软件开发包 5.0，即 `J2SE SDK\
  \ 5.0`。\n\n对于工程师来说，这一切有点困惑，但这就是为什么我们从未将其引入营销。幸运的是，在 2006 年，理性回归了。无用的 `Java 2` 名称被弃用，Java\
  \ 标准版的当前版本变为 `Java SE 6`。你仍会偶尔看到 `1.5` 和 `1.6` 的引用——这些只是版本 `5.0` 和 `6` 的同义词。\n\n\
  最后，当 Oracle 进行微版本更改以修复紧急问题时，它将这种更改称为更新。例如，Java SE 7 开发包的第一个更新正式称为 `JDK 7u1`，内部版本号为\
  \ `1.7.0_01`。更新不需要安装在之前的版本之上——它包含了整个 `JDK` 的最新版本。\n\n有时，Oracle 会提供包含 Java 开发包和集成开发环境的包。该集成环境在不同阶段曾命名为\
  \ `Forte`、`Sun ONE Studio`、`Sun Java Studio` 和 `Netbeans`。我们不知道当你访问下载网站时，那些热情的营销人员会如何称呼它。我们建议你现在避开所有的安装包，只安装\
  \ Java 开发包。如果你以后决定使用 Oracle 的集成开发环境，只需从 [`netbeans.org`](http://netbeans.org) 下载即可。\n\
  \n* *\n\n![Image](img/image00948.jpeg) 注意\n\n\n\n\n\n安装程序会提供一个默认安装目录，其中包含 JDK 版本号，例如\
  \ `jdk1.7.0`。这听起来有点麻烦，但我们已经非常习惯这个版本号了——它让为测试安装新的 JDK 版本变得更加容易。\n\n在 Windows 环境下，我们强烈建议不要接受路径名中带有空格的默认位置，例如\
  \ `c:\\Program Files\\jdk1.7.0`。请直接去掉路径名中的 `Program Files` 部分。\n\n在本书中，我们将安装目录称为\
  \ `jdk`。例如，当我们提到 `jdk/bin` 目录时，指的是名称类似于 `/usr/local/jdk1.7.0/bin` 或 `c:\\jdk1.7.0\\\
  bin` 的目录。\n\n### 2.1.2. 设置可执行路径\n\n在完成 JDK 安装后，你还需要执行一个额外的步骤：将 `jdk/bin` 目录添加到可执行路径中——这是操作系统为查找可执行文件而遍历的目录列表。此步骤的操作方法也因操作系统而异。\n\
  \n- 在 UNIX（包括 Linux、Mac OS X 和 Solaris）中，编辑可执行路径的方法取决于你使用的 shell。如果你使用 Bourne Again\
  \ shell（Linux 的默认 shell），请在 `~/.bashrc` 或 `~/.bash_profile` 文件的末尾添加如下行：\n\n```\n\
  export PATH=jdk/bin:$PATH\n```\n\n- 在 Windows 下，以管理员身份登录。启动控制面板，切换到经典视图，并选择系统图标。在\
  \ Windows XP 中，你会直接进入系统属性对话框。在 Vista 和 Windows 7 中，你需要选择“高级系统设置”（参见图 2.1）。在系统属性对话框中，点击“高级”选项卡，然后点击“环境变量”按钮。滚动系统变量窗口直到找到名为\
  \ `Path` 的变量。点击“编辑”按钮（参见图 2.2）。将 `jdk\\bin` 目录添加到路径开头，使用分号分隔新条目，如下：\n\n```\njdk\\\
  bin;other stuff\n```\n\n![Image](img/image00955.jpeg)\n\n图 2.1 在 Windows Vista 中启动系统属性对话框\n\
  \n![Image](img/image00956.jpeg)\n\n图 2.2 在 Windows Vista 中设置 Path 环境变量\n\n请注意将 `jdk`\
  \ 替换为 Java 安装的实际路径，例如 `c:\\jdk1.7.0_02`。如果你忽略了我们去掉 `Program Files` 目录的建议，请用双引号括整个路径：`\"\
  c:\\Program Files\\jdk1.7.0_02\\bin\";other stuff`。\n\n保存你的设置。启动的任何新控制台窗口将具有正确的路径。\n\
  \n以下是测试操作是否正确的方法：启动一个 shell 窗口。输入行\n\n```\njavac -version\n```\n\n并按下回车键。你应该得到类似下面的显示：\n\
  \n```\njavac 1.7.0_02\n```\n\n如果你收到的是“javac: command not found”或“指定的名称不是内部或外部命令、可运行程序或批文件”之类的消息，则你需要返回并双检你的安装。\n\
  \n![Image](img/image00948.jpeg) 注意\n\n在 Windows 中，请按照这些说明打开 shell 窗口。如果你使用 Windows\
  \ XP，从开始菜单选择“运行”选项并输入 `cmd`。在 Vista 和 Windows 7 中，只需在开始菜单的搜索框中输入 `cmd`。按回车，shell\
  \ 窗口就会出现。\n\n如果你从未见过这种窗口，我们建议你学习一个教授命令行基础的教程，例如 [www.horstmann.com/bigj/help/windows/tutorial.html](http://www.horstmann.com/bigj/help/windows/tutorial.html)。\n\
  \n### 2.1.3. 安装库源码和文档\n\n库源码以压缩文件 `src.zip` 的形式随 JDK 提供，你必须解压该文件获取源码。我们强烈建议这样做。只需执行以下操作：\n\
  \n1. 确保 JDK 已安装且 `jdk/bin` 目录在可执行路径中。\n2. 打开一个 shell 窗口。\n3. 进入 `jdk` 目录（例如 `cd\
  \ /usr/local/jdk1.7.0` 或 `cd c:\\jdk1.7.0`）。\n4. 创建一个子目录 `src`：\n\n```\nmkdir src\n\
  cd src\n```\n5. 执行命令\n\n```\njar xvf ../src.zip\n```\n\n（在 Windows 上使用 `jar xvf\
  \ ..\\src.zip`）。\n\n![Image](img/image00949.jpeg) 提示\n\n`src.zip` 文件包含所有公共库的源码。要获取更多源码（针对编译器、虚拟机、原生方法和私有辅助类），请访问\
  \ [`jdk7.java.net`](http://jdk7.java.net)。\n\n文档包含在一个与 JDK 独立的压缩文件中。你可以从 [www.oracle.com/technetwork/java/javase/downloads](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ 下载文档。\n\n### 2.1.4. 安装 Core Java 示例\n\n文档包含在一个与 JDK 独立的压缩文件中。你可以从 [www.oracle.com/technetwork/java/javase/downloads](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ 下载文档。\n\n### 2.1.5. 目录导航\n\n在探索 Java 的过程中，你有时会想要查看源码内部。当然，你将需要大量使用库文档。图 2.3 展示了\
  \ JDK 目录树。\n\n\n\n\n然而，在你掌握了编译和运行 Java 程序的基本步骤后，你将可能想要使用专业的开发环境。在过去的十年里，这些环境已经变得非常强大且方便，以至于如果不使用它们，手动工作就变得毫无意义。两个优秀的选择是免费提供的\
  \ Eclipse 和 NetBeans 程序。在本章中，我们将向你展示如何开始使用 Eclipse，因为它仍然比 NetBeans 稍微流畅一点，尽管 NetBeans\
  \ 正在快速追赶。当然，如果你更喜欢其他开发环境，完全可以在配合此书中使用。\n\n在过去，我们建议对简单程序使用如 Emacs、JEdit 或 TextPad\
  \ 等文本编辑器。我们现在不再提供这种建议，因为集成开发环境（IDE）现在已经如此快速且方便了。\n\n总之，我们认为你应该学会如何使用基本的 JDK 工具，然后你应该熟悉使用集成开发环境。\n\
  \n### 2.3. 使用命令行工具\n\n让我们从最困难的方法开始：从命令行编译并启动 Java 程序。\n\n**1.** 打开 shell 窗口。\n\n\
  **2.** 进入 `/CoreJavaBook/v1ch02/Welcome` 目录。（`CoreJavaBook` 目录是你安装书籍示例源代码的目录，具体请参见第\
  \ 2.1.4 节 节“安装 Core Java 程序示例”，第 23 页。）\n\n**3.** 输入以下命令：\n\n```\njavac Welcome.java\n\
  java Welcome\n```\n\n你应该能在 shell 窗口中看到如图 2.4 所示的输出。\n\n![Image](img/image00958.jpeg)\n\
  \n图 2.4 编译并运行 Welcome.java。\n\n恭喜你！你刚刚编译并运行了你的第一个 Java 程序。\n\n发生了什么？`javac` 程序是\
  \ Java 编译器。它将 `Welcome.java` 文件编译成 `Welcome.class` 文件。`java` 程序启动 Java 虚拟机。它执行编译器放在类文件中的字节码。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n如果你收到了关于以下行的错误消息：\n\n```\nfor (String\
  \ g : greeting)\n```\n\n那么你可能使用的是非常旧版本的 Java 编译器。在这种情况下，你需要按照如下重写循环：\n\n```java\n\
  for (int i = 0; i < greeting.length; i++)\n    System.out.println(greeting[i]);\n\
  ```\n\n***\n\n`Welcome` 程序非常简单。它只是向控制台打印了一条条消息。你可能喜欢查看该程序的内部结构，如列表 2.1 所示（我们将在下一章中解释它的工作原理）。\n\
  \n列表 2.1 Welcome/Welcome.java\n\n点击此处查看代码图像\n\n***\n\n```java\n 1 /**\n 2    * 此程序显示来自作者的问候。\n\
  \ 3    * @version 1.20 2004-02-28\n 4    * @author Cay Horstmann\n 5    */\n 6 \
  \ public class Welcome\n 7  {\n 8      public static void main(String[] args)\n\
  \ 9      {\n10         String[] greeting = new String[3];\n11         greeting[0]\
  \ = \"Welcome to Core Java\";\n12         greeting[1] = \"by Cay Horstmann\";\n\
  13         greeting[2] = \"and Gary Cornell\";\n14\n15         for (String g : greeting)\n\
  16             System.out.println(g);\n17     }\n18  }\n```\n\n***\n\n#### 2.3.1.\
  \ 故障排除提示\n\n在视觉化开发环境时代，许多程序员并不熟悉在 shell 窗口中运行程序。可能会出现任何问题，导致令人沮丧的结果。\n\n请注意以下几点：\n\
  \n*   如果你是手动输入程序，请确保正确输入了大写字母和小写字母。特别是类名是 `Welcome`，而不是 `welcome` 或 `WELCOME`。\n\
  *   编译器需要文件名（`Welcome.java`）。当你运行程序时，你指定类名（`Welcome`），而不需要带 `.java` 或 `.class` 扩展名。\n\
  *   如果你收到如“Bad command or file name”或 `javac: command not found` 之类的消息，请回去双检查你的安装情况。\n\
  \n### 2.4. 使用集成开发环境\n\n在本节中，我们将向你展示如何使用 Eclipse 编译程序，这是一个从 [`eclipse.org`](http://eclipse.org)\
  \ 免费提供的集成开发环境。Eclipse 用 Java 编写，但由于它使用了非标准的窗口库，它的移植性不如 Java。尽管如此，它存在 Linux、Mac OS、Solaris\
  \ 和 Windows 版本。\n\n还有其他流行的 IDE，但目前 Eclipse 是最常用的。以下是入门步骤：\n\n**1.** 启动 Eclipse 后，从菜单中选择\
  \ File（文件）-> New Project（新建项目）。\n\n**2.** 在向导对话框中选择“Java Project”（参见图 2.5）。这些截图是用\
  \ Eclipse 3.2 的。如果你的 Eclipse 版本看起来略有不同，请不要担心。\n\n![Image](img/image00959.jpeg)\n\
  \n图 2.5 Eclipse 中的 New Project 对话\n\n**3.** 点击 Next（下一步）按钮。提供项目名称 `Welcome`，并输入包含\
  \ `Welcome.java` 的目录的完整路径（参见图 2.6）。\n\n![Image](img/image00960.jpeg)\n\n图 2.6 配置\
  \ Eclipse 项目\n\n**4.** 确保勾选“Create project from existing source”（从现有源代码创建项目）选项。\n\
  \n**5.** 点击 Finish（完成）按钮。项目现在已创建。\n\n**6.** 点击左侧面板中项目窗口旁的三角形以打开它，然后点击“Default package”（默认包）旁的三角形。双击\
  \ `Welcome.java`。你现在应该看到一个显示程序代码的窗口（参见图 2.7）。\n\n![Image](img/image00961.jpeg)\n\
  \n图 2.7 使用 Eclipse 编辑源文件\n\n\n\n\n7. 使用鼠标右键点击左侧窗格中的项目名称（Welcome）。选择 `Run -> Run\
  \ As -> Java Application`。窗口底部会出现一个输出窗口。程序的输出将显示在输出窗口中（参见图 2.8）。\n\n![Image](img/image00962.jpeg)\n\
  \n图 2.8. 在 Eclipse 中运行程序\n\n### 2.4.1 定位编译错误\n\n推测，这个程序并没有拼写错误或 Bug。（毕竟它毕竟只有几行代码。）为了讨论起见，让我们假设你的代码偶尔包含拼写错误（可能甚至是一个语法错误）。尝试一下——例如，通过如下方式更改\
  \ `String` 的大小写来破坏你的文件：\n\n```java\nString[] greeting = new string[3];\n```\n\n\
  现在，尝试再次运行程序。你将得到一个错误消息，提示有一个未知的 `string` 类型（参见图 2.9）。只需点击错误消息。光标将移动到编辑窗口中对应的行，你可以在那里纠正错误。这种行为允许你快速修复错误。\n\
  \n![Image](img/image00963.jpeg)\n\n图 2.9. Eclipse 中的错误消息\n\n***\n\n![Image](img/image00949.jpeg)\
  \ 提示\n\n通常，Eclipse 错误报告会伴随着一个灯泡图标。点击灯泡可以获取建议的修复列表。\n\n***\n\n这些指令应该让你体验到集成环境中工作的感受。我们在第\
  \ 11 章中讨论 Eclipse 调试器。\n\n### 2.5 运行图形应用程序\n\n`Welcome` 程序并不有趣。接下来，我们将演示一个图形应用程序。这个程序是一个简单的图像文件查看器，只需加载并显示图像。再次，让我们先从命令行编译并运行它。\n\
  \n1. 打开 shell 窗口。\n2. 进入目录 `CoreJavaBook/v1ch02/ImageViewer`。\n3. 输入以下内容：\n\n```bash\n\
  javac ImageViewer.java\njava ImageViewer\n```\n\n弹出一个新的程序窗口，显示我们的 `ImageViewer`\
  \ 应用程序（参见图 2.10）。\n\n![Image](img/image00964.jpeg)\n\n图 2.10. 运行 ImageViewer 应用程序\n\
  \n现在，选择 `File -> Open` 并寻找一个要打开的图像文件。（我们在同一目录下提供了几个示例文件。）要关闭程序，请点击标题栏中的 `Close`\
  \ 框，或从菜单中选择 `File -> Exit`。\n\n快速查看源码。该程序比第一个程序要长得多，但如果你考虑到用 C 或 C++ 编写类似的应用程序需要多少代码，它就不太复杂了。当然，在\
  \ Visual Basic 中，编写（或者确切地说，拖放）这样一个程序是很容易的。JDK 没有视觉化界面生成器，因此你需要为每一切都编写代码，如代码列表 2.2\
  \ 所示。你将在第 7 章到第 9 章中学习如何编写这样的图形程序。\n\nListing 2.2. ImageViewer/ImageViewer.java\n\
  \n点击此处查看代码图像\n\n***\n\n```java\n1  import java.awt.EventQueue;\n2  import java.awt.event.*;\n\
  3  import java.io.*;\n4  import javax.swing.*;\n5\n6  /**\n7    * 一个查看图像的程序。\n8\
  \    * @version 1.22 2007-05-21\n9    * @author Cay Horstmann\n10   */\n11  public\
  \ class ImageViewer\n12  {\n13      public static void main(String[] args)\n14 \
  \     {\n15          EventQueue.invokeLater(new Runnable()\n16              {\n\
  17                  public void run()\n18              {\n19                  JFrame\
  \ frame = new ImageViewerFrame();\n20                  frame.setTitle(\"ImageViewer\"\
  );\n21                  frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  22                  frame.setVisible(true);\n23              });\n24      }\n25\
  \  }\n26\n27  /**\n28  * 一个带有显示图像标签的帧。\n29  */\n30  class ImageViewerFrame extends\
  \ JFrame\n31  private JLabel label;\n32  private JFileChooser chooser;\n33  private\
  \ static int DEFAULT_WIDTH = 300;\n34  private static int DEFAULT_HEIGHT = 400;\n\
  35  public ImageViewerFrame()\n36  {\n37    setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  38\n    // 使用 label 显示图像\n39    label = new JLabel();\n40    add(label);\n41\n \
  \   // 设置文件选择器\n42    chooser = new JFileChooser();\n43    chooser.setCurrentDirectory(new\
  \ File(\".\"));\n44\n    // 设置菜单栏\n45    MenuBar menuBar = new MenuBar();\n46  \
  \  setMenuBar(menuBar);\n47\n    JMenu menu = new JMenu(\"File\");\n48    menuBar.add(menu);\n\
  49\n    JMenuItem openItem = new JMenuItem(\"Open\");\n50    menu.add(openItem);\n\
  51    openItem.addActionListener(new ActionListener()\n52      {\n53        public\
  \ void actionPerformed(ActionEvent event)\n54          {\n55            // 显示文件对话框\n\
  56            int result = chooser.showOpenDialog(null);\n57\n            // 如果选择了文件，将其设为\
  \ label 的图标\n58            if (result == JFileChooser.APPROVE_OPTION)\n59      \
  \      {\n60              String name = chooser.getSelectedFile().getPath();\n61\
  \              label.setIcon(new ImageIcon(name));\n62            }\n63        \
  \  }\n64      });\n65\n66    JMenuItem exitItem = new JMenuItem(\"Exit\");\n67 \
  \   menu.add(exitItem);\n68    exitItem.addActionListener(new ActionListener()\n\
  69      {\n70          public void actionPerformed(ActionEvent event)\n71      \
  \    {\n72              System.exit(0);\n73          }\n74      });\n75  }\n```\n\
  \n### 2.6 构建和运行应用程序 (Applet)\n\n书中介绍的前两个程序都是应用程序——像任何原生程序一样。另一方面，正如我们在上一章中提到的，Java\
  \ 的早期热度来自于它运行 applet 的能力。我们向你展示如何从命令行构建并运行 applet。然后我们将 applet 加载到带的查看器中。最后，我们在浏览器中显示它。\n\
  \n首先，打开 shell 窗口进入 `CoreJavaBook/v1ch02/ImageViewer`，然后输入以下：\n\n```bash\njavac ImageViewer.java\n\
  appletviewer ImageViewer.html\n```\n\n图 2.11 显示了你在 applet 查看器中看到的内容。\n\n![Image](img/image00965.jpeg)\n\
  \n图 2.11. 查看器中显示的 ImageViewer\n\n第一个命令是现在熟悉的调用编译器的命令。它将 `ImageViewer.java` 源编译为字节码文件\
  \ `ImageViewer.class`。然而，这次你没有运行 `java` 程序，而是调用 `appletviewer`。该程序是 JDK 自带的一个特殊工具，用于快速测试\
  \ applet。你需要给它一个 HTML 文件，而不是 Java 类名。\n\n`ImageViewer.html` 文件的内容如代码列表 2.3 所示：\n\
  \n```html\n1<html>\n2  <head>\n3    <title>WelcomeApplet</title>\n4  </head>\n5\
  \  <body>\n6    <hr/>\n7    <p>\n8      这个 applet 来自书籍\n9      <a href=\"http://www.horstmann.com/corejava.html\"\
  >Core Java</a>\n10     由 <em>Cay Horstmann</em> 和 <em>Gary Cornell</em> 著。\n11 \
  \  </p>\n12   <applet code=\"WelcomeApplet.class\" width=\"400\" height=\"200\"\
  ></applet>\n13 </body>\n14</html>\n```\n\n\n\n\n\n```html\n<param name=\"greeting\"\
  \ value =\"Welcome to Core Java!\"/>\n</applet>\n<hr/>\n<p><a href=\"WelcomeApplet.java\"\
  >源代码。</a></p>\n</body>\n</html>\n```\n\n当然，applet 是设计用于在浏览器中查看的。遗憾的是，许多浏览器默认没有启用\
  \ Java 支持。页面 [`java.com/en/download/help/enable_browser.xml`](http://java.com/en/download/help/enable_browser.xml)\
  \ 显示了如何为最常见的浏览器配置 Java。一旦你配置好了浏览器，你就可以尝试在浏览器中加载该 applet。\n\n1. 启动你的浏览器。\n2. 选择 `File`\
  \ -> `Open File`（或等效操作）。\n3. 进入 `CoreJavaBook/v1ch02/WelcomeApplet` 目录。你应该会在文件对话框中看到\
  \ `WelcomeApplet.html` 文件。加载该文件。\n4. 你的浏览器现在加载了 applet，包括周围的文本。它看起来类似于图 2.12。\n\n\
  ![Image](img/image00966.jpeg)\n\n图 2.12. 在浏览器中运行 WelcomeApplet applet\n\n你可以看到这个应用程序实际上是活跃的，并愿意与互联网交互。点击\
  \ Cay Horstmann 按钮。applet 会引导浏览器显示 Cay 的网页。点击 Gary Cornell 按钮。applet 会引导浏览器弹出一个窗口，其中已经填写了\
  \ Gary 的电子邮件地址。\n\n请注意，这两个按钮在 applet 查看器（applet viewer）中都不起作用。applet 查看器没有发送邮件或显示网页的能力，因此它会忽略你的请求。applet\
  \ 查看器适用于孤立地测试 applet，但你需要将 applet 放入浏览器中，以观察它们是如何与浏览器以及互联网交互的。\n\n![Image](img/image00949.jpeg)\
  \ 提示\n\n你也可以在开发环境内部运行 applet。在 Eclipse 中，使用 `Run` -> `Run as` -> `Java Applet` 菜单选项。\n\
  \n最后，applet 的代码显示在列表 2.4 中。此时，只需对其扫视一眼即可。我们将在第 10 章中回来讨论编写 applet。\n\n在本章中，你学习了编译和运行\
  \ Java 程序的机制。你现在准备好进入第 3 章了。\n\n列表 2.4. WelcomeApplet/WelcomeApplet.java\n\n点击此处查看代码图像\n\
