  \ NetBeans 调试器）也有非常相似的命令。\n\n本章介绍了异常处理，并为测试和调试提供了一些实用的提示。接下来的两章将涵盖泛型编程及其最重要的应用：Java\
  \ 集合框架。\n\n# 第 12 章 泛型编程\n\n***\n\n## 本章\n\n- 为什么需要泛型编程？\n- 定义简单的泛型类\n- 泛型方法\n-\
  \ 类型变量的边界\n- 泛型代码与虚拟机\n- 限制与局限性\n- 泛型类型的继承规则\n- 通配符类型\n- 反射与泛型\n\n***\n\n泛型类构成了\
  \ Java 语言自 1.0 版本发布以来最重要的变化。在 Java SE 5.0 中引入泛型是 1999 年制定的首批 Java 规范请求（JSR）之一 `JSR\
  \ 14` 的结果。专家小组花费了大约五的时间编写规范和测试实现。\n\n泛型类是非常理想的，因为它们让你编写的代码比充斥着 `Object` 变量和强制转换更更、更易读。泛型对于集合类特别有用，例如无处不在的\
  \ `ArrayList`。\n\n泛型类——至少在表面上与 C++ 中的模板（templates）相似。在 C++ 和 Java 中一样，模板最初被引入语言是为了支持强类型集合。然而，多年来，人们发现了许多其他用途。阅读本章后，你可能会在程序中发现\
  \ Java 泛型的新用途。\n\n### 12.1 为什么需要泛型编程？\n\n*泛型编程*意味着编写可以重用于许多不同类型对象的代码。例如，你不想编写单独的类来收集\
  \ `String` 和 `File` 对象。而且你也不必这样做——单个 `ArrayList` 类就可以收集任何类的对象。这就是泛型编程的一个示例。\n\n\
  在泛型类加入 Java 之前，泛型编程是通过*继承*实现的。`ArrayList` 类简单地维护了一个 `Object` 引用数组：\n\n点击此处查看代码图像\n\
  \n```java\npublic class ArrayList // 泛型类之前\n{\n   private Object[] elementData;\n\
  \   . . .\n   public Object get(int i) { . . . }\n   public void add(Object o) {\
  \ . . . }\n}\n```\n\n这种方法有两个问题。每当你检索值时，都需要进行强制转换：\n\n```java\nArrayList files =\
  \ new ArrayList();\n. . .\nString filename = (String) files.get(0);\n```\n\n此外，没有错误检查。你可以添加任何类的值：\n\
  \n```java\nfiles.add(new File(\". . .\"));\n```\n\n此调用可以编译并运行而不会报错。在其他地方，将 `get`\
  \ 的结果强制转换为 `String` 将导致错误。\n\n泛型提供了一个更好的解决方案：*类型参数*。`ArrayList` 类现在有一个类型参数来指示元素类型：\n\
  \n```java\nArrayList<String> files = new ArrayList<String>();\n```\n\n这让你的代码更易读。你可以立即看出这个特定的列表包含\
  \ `String` 对象。\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n正如我们已经提到的，在 Java SE\
  \ 7 及更高版本中，你可以在构造函数中省略泛型类型：\n\n```java\nArrayList<String> files = new ArrayList<>();\n\
  ```\n\n省略的类型是从变量的类型中推断出来的。\n\n***\n\n编译器可以很好地利用类型信息。调用 `get` 时不需要强制转换：\n\n```java\n\
  String filename = files.get(0);\n```\n\n编译器还知道返回类型是 `String` 而不是 `Object`。现在编译器可以检查你没有插入错误类型的对象。例如，语句\n\
  \n```java\nfiles.add(new File(\". . .\")); // ArrayList<String> 只能添加 String\n```\n\
  \n将无法通过编译。编译错误比运行时的类异常要好得多。\n\n这就是类型参数的魅力所在：它们让你的程序更易读、更安全。\n\n#### 12.1.1 谁想成为泛型程序员？\n\
  \n使用像 `ArrayList` 这样的泛型类很容易。大多数 Java 程序员会直接使用如 `ArrayList<String>` 等类型，就像它们被内置在语言中一样，就如\
  \ `String[]` 数组。（当然，列表比数组更好，因为它们可以自动扩展。）\n\n然而，实现泛型类并没有那么容易。使用你代码的程序员会想要为你的类型参数接入各种类。他们期望一切在没有严苛限制和困惑错误信息的情况下运行。因此，作为泛型程序员，你的工作是预测你的类的所有潜在未来用途。\n\
  \n这会变得多困难？这里有一个标准类库设计者必须解决的典型问题。`ArrayList` 类有一个 `addAll` 方法用于添加另一个集合的所有元素。程序员可能想要将一个\
  \ `ArrayList<Manager>` 的所有元素添加到 `ArrayList<Employee>` 中。但当然，反过来操作是不合法的。如何允许一种调用而禁止另一种？Java\
  \ 语言设计师发明了一种天才的新概念——通配符类型，来解决这个问题。通配符类型相当抽象，但它们允许库构建者使方法尽可能灵活。\n\n\n\n\n应用程序程序员可能不会编写大量的泛型代码。JDK\
  \ 开发者已经承担了繁重的工作，并为所有的集合类提供了类型参数。根据经验法则，只有那些传统上涉及大量从非常通用类型（如 `Object` 或 `Comparable`\
  \ 接口）转换的代码才能从类型参数中获益。\n\n在本章中，我们将向你展示实现自己的泛型代码所需的所有知识。然而，我们预计大多数读者主要将这些知识来帮助排除故障，并满足对参数化集合类内部原理的好奇。\n\
  \n## 12.2. 定义一个简单的泛型类\n\n`泛型类`是一个有一个或多个类型变量的类。在本章中，我们将使用一个简单的 `Pair` 类作为示例。这个类允许我们专注于泛型，而不被数据存储细节分分散。以下是泛型\
  \ `Pair` 类的代码：\n\n点击此处查看代码图像\n\n```java\npublic class Pair<T>\n{\n   private T first;\n\
  \   private T second;\n   public Pair() { first = null; second = null; }\n   public\
  \ Pair(T first, T second) { this.first = first; this.second = second; }\n   public\
  \ T getFirst() { return first; }\n   public T getSecond() { return second; }\n \
  \  public void setFirst(T newValue) { first = newValue; }\n   public void setSecond(T\
  \ newValue) { second = newValue; }\n}\n```\n\n`Pair` 类在类名后引入了用角括号 `< >` 包的类型变量 `T`。泛型类可以有多个类型变量。例如，我们可以为第一个和第二个字段使用不同的类型来定义\
  \ `Pair` 类：\n\n```java\npublic class Pair<T, U> { . . . }\n```\n\n类型变量贯穿整个类定义，用于指定方法的返回类型以及字段和局部变量的类型。例如：\n\
  \n```java\nprivate T first; // 使用类型变量\n```\n\n***\n\n![Image](img/image0094.jpeg)\
  \ 注意\n\n使用大写字母作为类型变量并保持其简短是常见的做法。Java 库使用变量 `E` 作为集合的元素类型，使用 `K` 和 `V` 作为表格的键和值类型，并使用\
  \ `T`（必要时使用相邻字母 `U` 和 `S`）表示“任何类型”。\n\n***\n\n你通过为类型变量替换具体类型来`实例化` 泛型，例如：\n\n```java\n\
  Pair<String>\n```\n\n你可以将结果认为是一个具有以下构造函数的普通类：\n\n```java\nPair<String>()\nPair<String>(String,\
  \ String)\n```\n\n以及方法\n\n```\nString getFirst()\nString getSecond()\nvoid setFirst(String)\n\
  void setSecond(String)\n```\n\n换句话说，泛型类充当了普通类的工厂。\n\nListing 12.1 中的程序让 `Pair` 类运行了起来。静态方法\
  \ `minmax` 遍历数组并同时计算最大最小值。它使用一个 `Pair` 对象返回这两个结果。记住 `compareTo` 方法比较两个字符串，如果字符串相同则返回\
  \ `0`，如果第一个字符串在字典序上于第二个字符串，则返回负整数，否则返回正整数。\n\n***\n\n![Image](img/image00951.jpeg)\
  \ C++ 注意\n\n表面上看，Java 中的泛型类与 C++ 中的模板类相似。唯一的明显区别是 Java 没有特殊的 `template` 关键字。然而，正如你在本章中所看到的，这两种机制之间存在显著差异。\n\
  \n***\n\nListing 12.1. pair1/PairTest1.java\n\n点击此处查看代码图像\n\n***\n\n```java\n1 \
  \ package pair1;\n\n2\n\n3  /**\n4   * @version 1.01 2012-01-26\n5   * @author Cay\
  \ Horstmann\n6   */\n7  public class PairTest1\n8  {\n9      public static void\
  \ main(String[] args)\n10     {\n11          String[] words = { \"Mary\", \"had\"\
  , \"a\", \"little\", \"lamb\" };\n12          Pair<String> mm = ArrayAlg.minmax(words);\n\
  13          System.out.println(\"min = \" + mm.getFirst());\n14          System.out.println(\"\
  max = \" + mm.getSecond());\n15     }\n16  }\n\n17\n\n18 class ArrayAlg\n19  {\n\
  20      /**\n21       * 获取字符串数组的最小值和最大值。\n22       * @param a 一个字符串数组\n23      \
  \ * @return 一个包含最小和最大值的对，如果 a 为空或为空则返回 null\n24       */\n25      public static\
  \ Pair<String> minmax(String[] a)\n26      {\n27          if (a == null || a.length\
  \ == 0) return null;\n28          String min = a[0];\n29          String max = a[0];\n\
  30          for (int i = 1; i < a.length; i++)\n31          {\n32              if\
  \ (min.compareTo(a[i]) > 0) min = a[i];\n33              if (max.compareTo(a[i])\
  \ < 0) max = a[i];\n34          }\n35          return new Pair<>(min, max);\n36\
  \      }\n37  }\n```\n\n***\n\n## 12.3. 泛型方法\n\n在前面的节中，你已经学习了如何定义泛型类。你也可以定义带有类型参数的单个方法。\n\
  \n\n\n\n```java\n{\n    public static <T> T min(T[] a) // 几乎正确\n    {\n      if\
  \ (a == null || a.length == 0) return null;\n      T smallest = a[0];\n      for\
  \ (int i = 1; i < a.length; i++)\n          if (smallest.compareTo(a[i]) > 0) smallest\
  \ = a[i];\n      return smallest;\n    }\n}\n```\n\n但有一个问题。观察 `min` 方法的代码内部。变量 `smallest`\
  \ 的类型为 `T`，这意味着它可以是任意类的对象。我们如何知道 `T` 所属的类是否具有 `compareTo` 方法呢？\n\n解决方案是将 `T` 限制为实现了\
  \ `Comparable` 接口的类——这是一个包含单个方法 `compareTo` 的标准接口。你可以通过为类型变量 `T` 提供一个 `bound`（界界）来实现这一点：\n\
  \n```java\npublic static <T extends Comparable> T min(T[] a) . . .\n```\n\n实际上，`Comparable`\
  \ 接口本身是一个泛型类型。目前，我们将忽略这种复杂性以及编译器生成的警告。第 12.8 节 第 [723] 页的“通配符类型”讨论了如何在使用 `Comparable`\
  \ 接口时正确使用类型参数。\n\n现在，泛型 `min` 方法只能通过实现 `Comparable` 接口的类的数组调用，例如 `String`、`Date`\
  \ 等。使用 `Rectangle` 数组调用 `min` 将导致编译时错误，因为 `Rectangle` 类没有实现 `Comparable`。\n\n***\n\
  \n![Image](img/image00951.jpeg) C++ 注意\n\n在 C++ 中，你不能限制模板参数的类型。如果程序员用不适当的类型实例化模板，会在模板代码内部报告一个（通常是晦涩的）错误信息。\n\
  \n***\n\n你可能会奇怪，为什么在这种情况下使用 `extends` 关键字而不是 `implements` 关键字——毕竟，`Comparable` 是一个接口。这种表示法\n\
  \n`<T extends BoundingType>`\n\n表示 `T` 应该是界限类型的 `subtype`（子类型）。`T` 和界限类型可以是类也可以是接口。选择\
  \ `extends` 关键字是因为它是对子类型概念的合理近似，而且 Java 的设计者不想向语言中添加新的关键字（如 `sub`）。\n\n一个类型变量或通配符可以有多个界限。例如：\n\
  \n`T extends Comparable & Serializable`\n\n界限类型用 ampersands (`&`) 分隔，因为逗号用于分隔类型变量。\n\
  \n与 Java 继承一样，你可以拥有任意数量的接口超类型，但界限中最多只能有一个是类。如果你有一个类作为界限，它必须是界限列表中的第一个。\n\n在下一个示例程序（列表\
  \ 12.2\n\n***\n\n```java\n1  package pair2;\n2\n3  import java.util.*;\n4\n5  /**\n\
  6    * @version 1.01 2012-01-26\n7    * @author Cay Horstmann\n8    */\n9  public\
  \ class PairTest2\n10  {\n11      public static void main(String[] args)\n12   \
  \   {\n13          GregorianCalendar[] birthdays =\n14              {\n15      \
  \        new GregorianCalendar(1906, Calendar.DECEMBER, 9), // G. Hopper\n16   \
  \           new GregorianCalendar(1815, Calendar.DECEMBER, 10), // A. Lovelace\n\
  17              new GregorianCalendar(1903, Calendar.DECEMBER, 3), // J. von Neumann\n\
  18              new GregorianCalendar(1910, Calendar.JUNE, 22), // K. Zuse\n19 \
  \             };\n20          Pair<GregorianCalendar> mm = ArrayAlg.minmax(birthdays);\n\
  21          System.out.println(\"min = \" + mm.getFirst().getTime());\n22      \
  \    System.out.println(\"max = \" + mm.getSecond().getTime());\n23      }\n24 \
  \ }\n25\n26  class ArrayAlg\n27  {\n28      /**\n29          获取 T 类型对象数组的最小值和最大值。\n\
  30          @param a 一个 T 类型的对象数组\n31          @return 一个包含最小和最大值的对，如果 a 为\n32 \
  \         null 或空则返回 null\n33      */\n34      public static <T extends Comparable>\
  \ Pair<T> minmax(T[] a)\n35      {\n36          if (a == null || a.length == 0)\
  \ return null;\n37          T min = a[0];\n38          T max = a[0];\n39       \
  \   for (int i = 1; i < a.length; i++)\n40              if (min.compareTo(a[i])\
  \ > 0) min = a[i];\n41              if (max.compareTo(a[i]) < 0) max = a[i];\n42\
  \          }\n43          return new Pair<>(min, max);\n44      }\n45  }\n```\n\n\
  ***\n\n### 12.5. 泛型代码与虚拟机\n\n虚拟机没有泛型类型的对象——所有对象都是普通类。早期的泛型实现甚至可以将使用泛型的程序编译为在虚拟机上运行的类文件。这被弃用了。目前，我们将忽略这种复杂性以及编译器生成的警告。第\
  \ 12.8 节 “通配符类型”讨论了如何在使用 `Comparable` 接口时正确使用类型参数。\n\n现在，泛型 `min` 方法只能通过实现 `Comparable`\
  \ 接口的类的数组调用，例如 `String`、`Date` 等。使用 `Rectangle` 数组调用 `min` 将导致编译时错误，因为 `Rectangle`\
  \ 类没有实现 `Comparable`。\n\n***\n\n![Image](img/image00951.jpeg) 注意\n\n在 C++ 中，你不能限制模板参数的类型。如果程序员用不适当的类型实例化模板，会在模板代码内部报告一个（通常是晦涩的）错误信息。\n\
  \n***\n\n你可能会奇怪，为什么在这种情况下使用 `extends` 关键字而不是 `implements` 关键字——毕竟，`Comparable` 是一个接口。这种表示法\n\
  \n`<T extends BoundingType>`\n\n表示 `T` 应该是界限类型的 `subtype`（子类型）。`T` 和界限类型可以是类也可以是接口。选择\
  \ `extends` 关键字是因为它是对子类型概念的合理近似，而且 Java 的设计者不想向语言中添加新的关键字（如 `sub`）。\n\n一个类型变量或通配符可以有多个界限。例如：\n\
  \n`T extends Comparable & Serializable`\n\n界限类型用 ampersands (&) 分隔，因为逗号用于分隔类型变量。\n\
  \n与 Java 继承一样，你可以拥有任意数量的接口超类型，但界限中最多只能有一个是类。如果你有一个类作为界限，它必须是界限列表中的第一个。\n\n在下一个示例程序（列表\
  \ 12.2\n\n***\n\n#### 12.5.1. 翻译泛型表达式\n\n当你编写对泛型方法的调用时，当返回类型被擦除时，编译器会插入转换。例如，考虑以下语句：\n\
  \n```java\nPair<Employee> buddies = . . .\n```\n\n`Pair<T>` 的原始类型如下：\n\n点击此处查看代码图像\n\
  \n```java\npublic class Pair\n{\n    private Object first;\n    private Object second;\n\
  \n    public Pair(Object first, Object second)\n    {\n        first = first;\n\
  \        second = second;\n    }\n\n    public Object getFirst() { return first;\
  \ }\n    public Object getSecond() { return second; }\n    public void setFirst(Object\
  \ first) { first = first; }\n    public void setSecond(Object second) { second =\
  \ second; }\n}\n```\n\n每当你定义一个泛型类型，就会提供一个对应的原始类型（raw type）。原始类型的名称就是泛型类型的名称，去掉了类型参数。例如，`Pair<T>`\
  \ 的原始类型如下：\n\n点击此处查看代码图像\n\n```java\npublic class Pair\n{\n    private Object first;\n\
  \    private Object second;\n\n    public Pair(Object first, Object second)\n  \
  \  {\n        first = first;\n        second = second;\n    }\n\n    public Object\
  \ getFirst() { return first; }\n    public Object getSecond() { return second; }\n\
  \    public void setFirst(Object first) { first = first; }\n    public void setSecond(Object\
  \ second) { second = second; }\n}\n```\n\n现在，泛型 `min` 方法只能通过实现 `Comparable` 接口的类的数组调用，例如\
  \ `String`、`Date` 等。使用 `Rectangle` 数组调用 `min` 将导致编译时错误，因为 `Rectangle` 类没有实现 `Comparable`。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n你可能会奇怪如果切换界限会发生什么：`Interval<Serializable\
  \ & Comparable>`。在这种情况下，原始类型将 `T` 替换为 `Serializable`，并在必要时插入到 `Comparable` 的转换。为了效率，你应该将标记接口（即没有方法的接口）放在界限列表的末尾。\n\
  \n***\n\n一个类型变量或通配符可以有多个界限。例如：\n\n`T extends Comparable & Serializable`\n\n界限类型用\
  \ ampersands (&) 分隔，因为逗号用于分隔类型变量。\n\n与 Java 继承一样，你可以拥有任意数量的接口超类型，但界限中最多只能有一个是类。如果你有一个类作为界限，它必须是界限列表中的第一个。\n\
  \n原始类型将类型变量替换为第一个界限，如果没有提供界限则替换为 `Object`。例如，`Pair<T>` 的原始类型如下：\n\n点击此处查看代码图像\n\n\
  ```java\npublic class Pair\n{\n    private Object first;\n    private Object second;\n\
  \n    public Pair(Object first, Object second)\n    {\n        first = first;\n\
  \        second = second;\n    }\n\n    public Object getFirst() { return first;\
  \ }\n    public Object getSecond() { return second; }\n    public void setFirst(Object\
  \ first) { first = first; }\n    public void setSecond(Object second) { second =\
  \ second; }\n}\n```\n\n\n\n\n\n```java\nEmployee buddy = buddies.getFirst();\n```\n\
  \n`getFirst` 的擦除导致返回类型变为 `Object`。编译器会自动插入到 `Employee` 的强制转换。也就是说，编译器将方法调用翻译为两条虚拟机指令：\n\
  \n- 对原始方法 `Pair.getFirst` 的调用\n- 将返回的 `Object` 强制转换为 `Employee` 类型\n\n当您访问泛型字段时，也会插入强制转换。假设\
  \ `Pair` 类的 `first` 和 `second` 字段是公共的（这可能不是良好的编程风格，但在 Java 中是合法的）。那么表达式\n\n```java\n\
  Employee buddy = buddies.first;\n```\n\n在生成的生成的字节码中也插入了强制转换。\n\n#### 12.5.2. 泛型方法的翻译\n\
  \n类型擦除也发生在泛型方法中。程序员通常将泛型方法\n\n```java\npublic static <T extends Comparable> T min(T[]\
  \ a)\n```\n\n视为一组方法，但在擦除后，只剩下一个方法：\n\n```java\npublic static Comparable min(Comparable[]\
  \ a)\n```\n\n注意，类型参数 `T` 已经被擦除，只留下了它的边界类型 `Comparable`。\n\n方法的擦除带来了一些复杂性。考虑这个例子：\n\
  \n```java\nclass DateInterval extends Pair<Date>\n{\n   public void setSecond(Date\
  \ second)\n   {\n      if (second.compareTo(getFirst()) >= 0)\n          super.setSecond(second);\n\
  \   }\n   . . .\n}\n```\n\n日期间隔是一个 `Date` 对象的对，我们希望重写方法以确保第二个值永远不会小于第一个值。该类被擦除为\n\
  \n```java\nclass DateInterval extends Pair // 擦除后\n{\n   public void setSecond(Date\
  \ second) { . . . }\n   . . .\n}\n```\n\n可能会的是，还有一个从 `Pair` 继承的 `setSecond` 方法，即\n\
  \n```java\npublic void setSecond(Object second)\n```\n\n这显然是一个不同的方法，因为它的参数类型不同——`Object`\
  \ 而不是 `Date`。但它*不应该是*不同的。考虑以下顺序语句：\n\n```java\nDateInterval interval = new DateInterval(.\
  \ . .);\nPair<Date> pair = interval; // OK--赋值给父类\npair.setSecond(aDate);\n```\n\
  \n我们的预期是 `setSecond` 的调用是多态的，并调用适当的方法。由于 `pair` 指向一个 `DateInterval` 对象，那应该是 `DateInterval.setSecond`。问题是类型擦除干扰了多态。为了解决这个问题，编译器在\
  \ `DateInterval` 类中生成了一个*桥接方法*：\n\n```java\npublic void setSecond(Object second)\
  \ { setSecond((Date) second); }\n```\n\n为了理解为什么这有效，让我们仔细跟踪语句的执行\n\n```java\npair.setSecond(aDate)\n\
  ```\n\n变量 `pair` 的声明类型为 `Pair<Date>`，而该类型只有一个名为 `setSecond` 的方法，即 `setSecond(Object)`。虚拟机在\
  \ `pair` 指向的对象上调用该方法。该对象是 `DateInterval` 类型。因此，调用了 `DateInterval.setSecond(Object)`。该方法就是合成的桥接方法。它调用了\
  \ `DateInterval.setSecond(Date)`，这正是我们需要的。\n\n桥接方法可能会变得更加奇怪。假设 `DateInterval` 方法也重写了\
  \ `getSecond` 方法：\n\n```java\nclass DateInterval extends Pair<Date>\n{\n   public\
  \ Date getSecond() { return (Date) super.getSecond().clone(); }\n   . . .\n}\n```\n\
  \n在 `DateInterval` 类中，有两个 `getSecond` 方法：\n\n```java\nDate getSecond() // 定义在 DateInterval\
  \ 中\nObject getSecond() // 重写 Pair 中定义的方法以调用第一个方法\n```\n\n你不能写这样的 Java 代码；拥有两个相同参数类型的方法是非合法的——在这里没有参数。然而，在虚拟机中，参数类型*和返回类型*决定了一个方法。因此，编译器可以为两个仅返回类型上不同的方法生成字节码，虚拟机将正确处理这种情况。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n桥接方法不仅限于泛型类型。我们在第 5 章 中已经提到，在重写另一个方法时，指定更严格的返回类型是合法的。例如：\n\
  \n```java\npublic class Employee implements Cloneable\n{\n   public Employee clone()\
  \ throws CloneNotSupportedException { ... }\n}\n```\n\n`Object.clone` 和 `Employee.clone`\
  \ 方法认为具有*协变返回类型*。\n\n实际上，`Employee` 类有*两个* `clone` 方法：\n\n```java\nEmployee clone()\
  \ // 上文定义\nObject clone() // 合成方法\n```\n\n***\n\n总结，你需要记住泛型翻译的这些事实：\n\n- 虚拟机中没有泛型。\n\
  - 类型参数被其边界替换。\n- 合成桥接方法以保留多态性。\n- 在需要时插入强制转换以保留类型安全。\n\n#### 12.5.3. 调用旧代码\n\n在设计泛型时，一个主要目标是允许泛型与旧代码之间的互操作性。让我们来看一个具体的例子。要设置\
  \ `JSlider` 的标签，你使用方法\n\n```java\nvoid setLabelTable(Dictionary table)\n```\n\n\
  这里，`Dictionary` 是原始类型，因为 `JSlider` 在泛型存在之前实现的。然而，当您填充字典时，应该使用泛型。\n\n```java\nDictionary<Integer,\
  \ Component> labelTable = new Hashtable<>();\nlabelTable.put(0, new JLabel(\"nine.gif\"\
  )));\nlabelTable.put(20, new JLabel(\"ten.gif\")));\n. . .\n```\n\n当将 `Dictionary<Integer,\
  \ Component>` 对象传递给 `setLabelTable` 时，编译器会发出警告。\n\n```java\nslider.setLabelTable(labelTable);\
  \ // 警告\n```\n\n毕竟，编译器无法保证 `setLabelTable` 对这个 `Dictionary` 对象做什么。该方法可能会替换替换所有的字符串。这破坏了键为\
  \ `Integer` 的保证，未来的操作可能会导致强制转换异常。\n\n对于这种警告，你没什么做的，除了思考并询问 `JSlider` 可能会对这个 `Dictionary`\
  \ 对象做什么。在我们的情况下，很清楚 `JSlider` 只读取信息，所以我们可以忽略这个警告。\n\n现在考虑相反的情况，从旧类获取原始类型对象。你可以将其赋值给使用泛型的变量，但当然你会得到一个警告。例如——检查并确保标签表包含\
  \ `Integer` 和 `Component` 对象。当然，永远没有绝对的保证。恶意代码可能在 slider 中安装了不同的 `Dictionary`。但再次，这种情况并不比泛型出现之前糟糕。在最坏的情况下，程序会抛出异常。\n\
  \n在思考完该警告后，你可以使用*注解*让它消失。你可以注解一个局部变量：\n\n```java\n@SuppressWarnings(\"unchecked\"\
  )\nDictionary<Integer, Components> labelTable = slider.getLabelTable(); // 无警告\n\
  ```\n\n或者你可以注解整个方法，如下：\n\n```java\n@SuppressWarnings(\"unchecked\")\npublic void\
  \ configureSlider() { . . . }\n```\n\n此注解关闭了方法内部所有代码的检查。\n\n\n\n\n在接下来的章节中，我们将讨论在使用\
  \ Java 泛型时需要考虑的若干项限制。这些限制中的大部分都是类型擦除（type erasure）的结果。\n\n### 12.6.1. 类型参数不能用基本类型实例化\n\
  \n你不能用基本类型代替类型参数。因此，没有 `Pair<double>`，只有 `Pair<Double>`。原因的当然是类型擦除。擦除后，`Pair` 类拥有类型为\
  \ `Object` 的字段，而你无法使用它们来存储 `double` 值。\n\n这确实是一个困扰，但它与 Java 语言中基本类型的独立地位是一致的。这并不是致命缺陷——只有八种基本类型，且当包装类不能作为合适的替代品时，你始终可以使用单独类和方法来处理它们。\n\
  \n### 12.6.2. 运行时类型查询仅适用于原始类型\n\n虚拟机中的对象始终具有特定的非泛型类型。因此，所有的类型查询只产生原始类型。例如：\n\n```java\n\
  if (a instanceof Pair<String>) // 错误\n```\n\n这只能测试 `a` 是否为任意类型的 `Pair`。对于测试也是如此：\n\
  \n```java\nif (a instanceof Pair<T>) // 错误\n```\n\n或者强制类型转换：\n\n```java\nPair<String>\
  \ p = (Pair<String>) a; // 警告--只能测试 a 是一个 Pair\n```\n\n为了提醒你注意风险，当你尝试查询对象是否属于某个泛型类型时，你将得到编译器错误（使用\
  \ `instanceof` 时）或警告（使用强制转换时）。\n\n同样的道理，`getClass` 方法始终返回原始类型。例如：\n\n点击此处查看代码图片\n\
  \n```java\nPair<String> stringPair = . . .;\n\nPair<Employee> employeePair = . .\
  \ .;\n\nif (stringPair.getClass() == employeePair.getClass()) //它们是相等的\n```\n\n\
  比较的结果为 `true`，因为两次对 `getClass` 的调用都返回 `Pair.class`。\n\n### 12.6.3. 你不能创建参数化类型的数组\n\
  \n你不能实例化参数化类型的数组，例如：\n\n```java\nPair<String>[] table = new Pair<String>[10]; //\
  \ 错误\n```\n\n这有什么问题？擦除后，`table` 的类型是 `Pair[]`。你可以将其转换为 `Object[]`：\n\n```java\n\
  Object[] objarray = table;\n```\n\n数组会记住其组件类型，并在你尝试存储错误类型的元素时抛出 `ArrayStoreException`：\n\
  \n```java\nobjarray[0] = \"Hello\"; // 错误--组件类型是 Pair\n```\n\n但擦除使得这种机制对泛型类型失效。赋值语句：\n\
  \n```java\nobjarray[0] = new Pair<Employee>();\n```\n\n将通过数组存储检查，但仍然会导致类型错误。由于这个原因，参数化类型的数组是被禁止的。\n\
  \n注意，只有创建这些数组是被禁止的。你可以声明一个类型为 `Pair<String>[]` 的变量。但不能用 `new Pair<String>[10]` 来初始化它。\n\
  \n![图片](img/image00948.jpeg) 注意\n\n你可以声明通配符类型的数组然后对它们进行强制转换：\n\n```java\nPair<String>[]\
  \ table = (Pair<String>[]) new Pair<?>[10];\n```\n\n结果是不安全的。如果你在 `table[0]` 中存储一个\
  \ `Pair<Employee>`，然后对 `table[0].getFirst()` 调用 `String` 方法，你将得到 `ClassCastException`。\n\
  \n![图片](img/image00949.jpeg) 提示\n\n如果你需要收集参数化类型对象，只需使用 `ArrayList`：`ArrayList<Pair<String>>`\
  \ 是安全且有效的。\n\n### 12.6.4. 可变参数警告\n\n在前面的节中，你看到 Java 不支持泛型类型的数组。在本节中，我们将讨论一个相关问题：将泛型实例传递给具有可变参数的方法。\n\
  \n考虑这个带有可变参数的简单方法：\n\n点击此处查看代码图片\n\n```java\npublic static <T> void addAll(Collection<T>\
  \ coll, T... ts)\n{\n   for (t : ts) coll.add(t);\n}\n```\n\n记得参数 `ts` 实际上是一个持有所有提供参数的数组。\n\
  \n现在考虑这个调用：\n\n```java\nCollection<Pair<String>> table = ...;\n\nPair<String> pair1\
  \ = ...;\n\nPair<String> pair2 = ...;\n\naddAll(table, pair1, pair2);\n```\n\n为了调用此方法，Java\
  \ 虚拟机必须创建一个 `Pair<String>` 数组，这是违反规则的。然而，规则针对这种情况已经放宽了，你只会得到一个警告，而不是错误。\n\n你可以通过两种方式之一抑制警告。你可以在包含调用\
  \ `addAll` 的方法上添加注解 `@SuppressWarnings(\"unchecked\")`。或者，从 Java SE 7 开始，你可以对 `addAll`\
  \ 方法本身使用注解 `@SafeVarargs`：\n\n点击此处查看代码图片\n\n```java\n@SafeVarargs\npublic static\
  \ <T> void addAll(Collection<T> coll, T... ts)\n```\n\n现在可以用泛型类型调用此方法了。你可以将此注解用于任何仅读取参数数组元素的方法，这被认为是最常见的用用例。\n\
  \n![图片](img/image00948.jpeg) 注意\n\n你可以使用 `@SafeVarargs` 注解来规避创建泛型数组的限制，使用此方法：\n\n\
  ```java\n@SafeVarargs static <E> E[] array(E... array) { return array; }\n```\n\n\
  现在你可以调用：\n\n```java\nPair<String>[] table = array(pair1, pair2);\n```\n\n这看起来很方便，但存在隐藏的危险。代码：\n\
  \n```java\nObject[] objarray = table;\n\nobjarray[0] = new Pair<Employe>();\n```\n\
  \n将运行而不抛出 `ArrayStoreException`（因为数组存储只检查擦除后的类型），你在处理 `table[0]` 时会在其他地方得到异常。\n\n\
  ### 12.6.5. 你不能实例化类型变量\n\n你不能在像 `new T(...)`、`new T[...]` 或 `T.class` 的表达式中使用类型变量。例如，以下\
  \ `Pair<T>` 是不合法的：\n\n```java\npublic Pair() { // new T(); }\n```\n\n类型擦除会将 `T`\
  \ 变为 `Object`，而你不想调用 `new Object()`。\n\n作为变通方法，可以通过反射构造泛型对象，通过调用 `Class.newInstance`\
  \ 方法。\n\n的是，细节有点复杂。你不能调用：\n\n```java\nfirst = T.class.newInstance(); // 错误\n```\n\
  \n你必须设计 API 传入一个 `Class` 对象，如下：\n\n点击此处查看代码图片\n\n```java\npublic static <T> Pair<T>\
  \ makePair(Class<T> cl)\n{\n   try { return new Pair<>(cl.newInstance(), cl.newInstance())\
  \ }\n   catch (Exception ex) { return null; }\n}\n```\n\n此方法可以这样调用：\n\n```java\n\
  Pair<String> p = Pair.makePair(String.class);\n```\n\n注意 `Class` 类本身是泛型的。例如，`String.class`\
  \ 是 `Class<String>` 的实例（事实上是唯一的实例）。因此，`makePair` 方法可以推断出它正在创建的类型。\n\n你不能构造泛型数组：\n\
  \n```java\npublic static <T extends Comparable> T[] minmax(T[] a) { T[] mm = new\
  \ T[2]; . . } // 错误\n```\n\n类型擦除会导致此方法始终构造一个 `Comparable[2]`。\n\n如果数组仅作为类的私有字段使用，你可以将其声明为\
  \ `Object[]` 并在检索元素时使用强制转换。例如，`ArrayList` 类可以实现如下：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ class ArrayList<E>\n{\n   private Object[] elements;\n   . . .\n   @SuppressWarnings(\"\
  unchecked\") public E get(int n) { return (E) elements[n]; }\n   public void set(int\
  \ n, E e) { elements[n] = e; } // 不需要强制转换\n}\n```\n\n实际实现并不那么简洁：\n\n点击此处查看代码图片\n\
  \n```java\npublic class ArrayList<E>\n{\n   private E[] elements;\n   . . .\n  \
  \ public ArrayList() { elements = (E[]) new Object[10]; }\n}\n```\n\n在这里，强制转换 `E[]`\
  \ 是完全的谎言，但类型擦除使其无法被检测。\n\n这种技术对于我们的 `minmax` 方法不起，因为我们返回的是一个 `T[]` 数组，如果我们对其类型撒谎言，将会导致运行时错误。假设我们实现了：\n\
  \n点击此处查看代码图片\n\n\n\n\n```java\npublic static <T extends Comparable> T[] minmax(T...\
  \ a)\n{\n    Object[] mm = new Object[2];\n    . . .\n    return (T[]) mm; // 编译时带有警告\n\
  }\n```\n该调用\n\n```java\nString[] ss = minmax(\"Tom\", \"Dick\", \"Harry\");\n```\n\
  \n可以编译通过且没有任何警告。当方法返回时，如果将 `Object[]` 引用强制转换为 `Comparable[]`，会发生 `ClassCastException`。\n\
  \n在这种情况下，你可以使用反射并调用 `Array.newInstance`：\n\n点击此处查看代码图片\n\n```java\npublic static\
  \ <T extends Comparable> T[] minmax(T... a)\n{\n    T[] mm = (T[]) Array.newInstance(a.getClass().getComponentType(),\
  \ 2);\n    . . .\n}\n```\n\n`ArrayList` 类的 `toArray` 方法就没有那么幸运了。它需要产生 `T[]` 数组，但它并没有组件类型。因此，有两种变体：\n\
  \n```java\nObject[] toArray()\nT[] toArray(T[] result)\n```\n\n第二个方法接收一个数组参数。如果数组足够大，则使用它。否则，将使用\
  \ `result` 的组件类型创建一个足够大小的新数组。\n\n### 12.6.6 类型变量在泛型类的静态上下文中是非法的\n\n你不能在静态字段或方法中引用类型变量。例如，下面这个巧妙的想法是不可行的：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Singleton<T>\n{\n    private static T singleInstance;\
  \ // 错误\n    public static T getSingleInstance() // 错误\n    {\n        if (singleInstance\
  \ == null) 创建 T 的新实例\n        return singleInstance;\n    }\n}\n```\n\n如果可以这样做，那么程序就可以声明一个\
  \ `Singleton<Random>` 来共享随机数生成器，并声明一个 `Singleton<JFileChooser>` 来共享文件选择对话框。但这是行不通的。类型擦除后，只有一个\
  \ `Singleton` 类，并且只有一个 `singleInstance` 字段。出于这个原因，带有类型变量的静态字段和方法被简单禁止。\n\n### 12.6.7\
  \ 你不能抛出或捕获泛型类的实例\n\n你既不能抛出也不能捕获泛型类的对象。事实上，泛型类扩展 `Throwable` 也是不法的。例如，下面的定义无法编译：\n\
  \n```java\npublic class Problem<T> extends Exception { /* . . . } // 错误--不能扩展 Throwable\n\
  ```\n\n你不能在 `catch` 子句中使用类型变量。例如，下面的方法将无法编译：\n\n点击此处查看代码图片\n\n```java\npublic static\
  \ <T extends Throwable> void doWork(Class<T> t)\n{\n    try\n    {\n        执行工作\n\
  \    }\n    catch (T e) // 错误--不能捕获类型变量\n    {\n        Logger.global.info(...)\n\
  \    }\n}\n```\n\n然而，在异常规格中使用类型变量是允许的。下面的方法是合法的：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ static <T extends Throwable> void doWork(T t) throws T // OK\n{\n    try\n   \
  \ {\n        执行工作\n    }\n    catch (Throwable realCause)\n    {\n        t.initCause(realCause);\n\
  \        throw t;\n    }\n}\n```\n\n#### 12.6.7.1 你可以击败检查异常检查\n\nJava 异常处理的一个基本原则是，你必须为所有检查异常（checked\
  \ exceptions）提供处理器。你可以使用泛型来击败这一方案。关键在于这个方法：\n\n点击此处查看代码图片\n\n```java\n@SuppressWarnings(\"\
  unchecked\")\npublic static <T extends Throwable> void throwAs(Throwable e) throws\
  \ T\n{\n    throw (T) e;\n}\n```\n\n假设这个方法包含类 `Block` 中。当你调用\n\n`Block.<RuntimeException>throwAs(t);`\n\
  \n那么编译器将认为 `t` 变成了未检查异常（unchecked exception）。下面的代码将所有异常转换为编译器认为是未检查的异常：\n\n```java\n\
  try\n{\n    执行工作\n}\ncatch (Throwable t)\n{\n    Block.<RuntimeException>throwAs(t);\n\
  }\n```\n\n让我们将其封装在一个抽象类中。用户将重写 `body` 方法以提供特定的操作。当调用 `toThread` 时，你得到了一个 `Thread`\
  \ 对象。`Thread` 类的 `run` 方法不介意异常。\n\n点击此处查看代码图片\n\n```java\nabstract class Block\n\
  {\n    abstract void body();\n    public Thread toThread()\n    {\n        return\
  \ new Thread()\n        {\n            public void run()\n            {\n      \
  \          try\n                {\n                    body();\n               \
  \ }\n                catch (Throwable t)\n                {\n                  \
  \  Block.<RuntimeException>throwAs(t);\n                }\n            }\n     \
  \   };\n    }\n    @SuppressWarnings(\"unchecked\")\n    public static <T extends\
  \ Throwable> void throwAs(Throwable e) throws T\n    {\n        throw (T) e;\n \
  \   }\n}\n```\n\n假设这个方法包含类 `Block` 中。当你调用\n\n`Block.<RuntimeException>throwAs(t);`\n\
  \n那么编译器将认为 `t` 变成了未检查异常。下面的代码将所有异常转换为编译器认为是未检查的异常：\n\n```java\ntry\n{\n    执行工作\n\
  }\ncatch (Throwable t)\n{\n    Block.<RuntimeException>throwAs(t);\n}\n```\n\n让我们将其封装在一个抽象类中。用户将重写\
  \ `body` 方法以提供特定的操作。当调用 `toThread` 时，你得到了一个 `Thread` 对象。`Thread` 类的 `run` 方法不介意异常。\n\
  \n点击此处查看代码图片\n\n```java\nabstract class Block\n{\n    abstract void body();\n  \
  \  public Thread toThread()\n    {\n        return new Thread()\n        {\n   \
  \         public void run()\n            {\n                try\n              \
  \  {\n                    body();\n                }\n                catch (Throwable\
  \ t)\n                {\n                    Block.<RuntimeException>throwAs(t);\n\
  \                }\n            }\n        };\n    }\n    @SuppressWarnings(\"unchecked\"\
  )\n    public static <T extends Throwable> void throwAs(Throwable e) throws T\n\
  \    {\n        throw (T) e;\n    }\n}\n```\n（抱歉，由于生成逻辑出现了重复，上述内容是根据您提供的文本进行的完整翻译性对齐）\n\
  \n### 12.6.8 注意擦除后的冲突\n\n当泛型类型擦除时，产生冲突的情况是非法的。这里有一个例子。假设我们在 `Pair` 类中添加 `equals`\
  \ 方法，如下：\n\n点击此处查看代码图片\n\n```java\nclass Pair<T>\n{\n    public boolean equals(T\
  \ value) { return first.equals(value) && second.equals(value); }\n    . . .\n}\n\
  ```\n\n考虑 `Pair<String>`。概念上它有两个 `equals` 方法：\n\n`boolean equals(String)` // 定义在\
  \ `Pair<T>` 中\n`boolean equals(Object)` // 继承自 `Object`\n\n但直觉误导了我们。`boolean equals(T)`\
  \ 的擦除是\n\n`boolean equals(Object)`\n\n这与 `Object.equals` 方法冲突了。\n\n解决办法当然是重命名冲突的方法。泛型规范引用了另一个规则：“为了支持擦除转换，我们实施了限制：类或类型变量不能同时是同一接口的不同实例的子类型。”例如，下面的代码是非法的：\n\
  \n点击此处查看代码图片\n\n```java\nclass Calendar implements Comparable<Calendar> { . . .\
  \ }\nclass GregorianCalendar extends Calendar implements Comparable<GregorianCalendar>\n\
  { . . } // 错误\n```\n\n`GregorianCalendar` 将同时实现 `Comparable<Calendar>` 和 `Comparable<GregorianCalendar>`，它们是同一接口的不同实例化。\n\
  \n这种限制与类型擦除有什么关系并不明显。毕竟，非泛型版本\n\n点击此处查看代码图片\n\n```java\nclass Calendar implements\
  \ Comparable { . . . }\nclass GregorianCalendar extends Calendar implements Comparable\
  \ { . . . }\n```\n\n是合法的。原因要微妙得多。这将与合成的桥接方法冲突。实现 `Comparable<X>` 的类会获得一个桥接方法\n\n\
  `public int compareTo(Object other) { return compareTo((X) other); }`\n\n你不能为不同的类型\
  \ `X` 拥有这样的方法。\n\n\n\n\n\n### 12.7. 泛型的继承规则\n\n当你处理泛型类工作时，需要学习一些关于继承和子类型的规则。让我们从一个许多程序员认为不符合直觉的情况开始。考虑一个类及其子类，例如\
  \ `Employee` 和 `Manager`。`Pair<Manager>` 是 `Pair<Employee>` 的子类吗？可能让你惊讶的是，答案是“否”。例如，以下代码将无法编译：\n\
  \n点击此处查看代码图片\n\n```\nManager[] topHonchos = . . .;\nPair<Employee> result = ArrayAlg.minmax(topHonchos);\
  \ // 错误\n```\n\n`minmax` 方法返回的是 `Pair<Manager>`，而不是 `Pair<Employee>`，且将其中一个赋值给另一个是非法的。\n\
  \n通常情况下，`Pair<S>` 和 `Pair<T>` 之间没有关系，无论 `S` 和 `T` 如何关联（参见图 12.1）。\n\n![Image](img/image01204.jpeg)\n\
  图 12.1. pair 类之间没有继承关系\n\n这似乎是一个严酷的限制，但为了类型安全是必要的。假设我们允许将 `Pair<Manager>` 转换为 `Pair<Employee>`。考虑这段代码：\n\
  \n点击此处查看代码图片\n\n```\nPair<Manager> managerBuddies = new Pair<>(ceo, cfo);\nPair<Employee>\
  \ employeeBuddies = managerBuddies; // 假设允许\nemployeeBuddies.setFirst(someEmployee);\n\
  ```\n\n显然，最后语句是合法的。但 `employeeBuddies` 和 `managerBuddies` 指向*同一个对象*。我们现在成功将 CFO\
  \ 与一个员工配对，这对于 `Pair<Manager>` 来说是不可能的。\n\n![Image](img/image0094.jpeg) 注意\n\n你刚刚看到了泛型类型和数组之间的重要区别。你可以将\
  \ `Manager[]` 数组赋值给类型为 `Employee[]` 的变量：\n\n点击此处查看代码图片\n\n```\nManager[] managerBuddies\
  \ = { ceo, cfo };\nEmployee[] employeeBuddies = managerBuddies; // OK\n```\n\n然而，数组带有特殊的保护。如果你尝试将一个员工存入\
  \ `employeeBuddies[0]`，虚拟机会抛出 `ArrayStoreException`。\n\n始终可以将泛型类型转换为原始类型（raw type）。例如，`Pair<Employee>`\
  \ 是原始类型 `Pair` 的子类型。这种转换对于与旧代码交互是必要的。你可以转换为原始类型并导致类型错误吗？考虑这个示例：\n\n点击此处查看代码图片\n\n\
  ```\nPair<Manager> managerBuddies = new Pair<>(ceo, cfo);\nPair rawBuddies = managerBuddies;\
  \ // OK\nrawBuddies.setFirst(someEmployee); // 仅警告\n```\n\n这听起来很可怕。但请记住，你并没有比旧版本的\
  \ Java 更糟。虚拟机的安全性并没有受到威胁。当通过 `getFirst` 获取外部对象并赋值给 `Manager` 变量时，会抛出 `ClassCastException`，就像以前一样。你只是失去了泛型通常提供的额外安全性。\n\
  \n最后，泛型类可以扩展或实现其他泛型类。在这方面，它们与普通类没有区别。例如 `ArrayList<T>` 实现接口 `List<T>`。这意味着 `ArrayList<Manager>`\
  \ 可以转换为 `List<Manager>`。然而，正如你所看到的，`ArrayList<Manager>` 不是 `List<Employee>`。图 12.2\
  \ 显示了这些关系。\n\n![Image](img/image01205.jpeg)\n图 12.2. 泛型列表之间的子类型关系\n\n### 12.8. 通配符类型\n\
  \n类型系统的研究人员早就发现僵化的泛型系统很难用。Java 设计者发明了一种巧妙（尽管安全的）“逃生口”：通配符类型。例如，通配符类型 `Pair<? extends\
  \ Employee>` 表示类型参数为 `Employee` 子类的任何泛型 `Pair`，例如 `Pair<Manager>`，而不是 `Pair<String>`。\n\
  \n假设你想写一个打印员工对的方法，如下：\n\n点击此处查看代码图片\n\n```java\npublic static void printBuddies(Pair<Employee>\
  \ p)\n{\n   Employee first = p.getFirst();\n   Employee second = p.getSecond();\n\
  \   System.out.println(first.getName() + \" and \" + second.getName() + \" are buddies.\"\
  );\n}\n```\n\n正如你在上一节所看到的，无法向该方法传递 `Pair<Manager>`，这相当局限。但解决方案很简单——使用通配符类型：\n\n\
  ```java\npublic static void printBuddies(Pair<? extends Employee> p)\n```\n\n`Pair<Manager>`\
  \ 类型是 `Pair<? extends Employee>` 的子类型（参见图 12.3）。\n\n![Image](img/image01206.jpeg)\n\
  图 12.3. 通配符的子类型关系\n\n我们可以通过 `Pair<? extends Employee>` 引用使用通配符来破坏 `Pair<Manager>`\
  \ 吗？\n\n点击此处查看代码图片\n\n```\nPair<Manager> managerBuddies = new Pair<>(ceo, cfo);\n\
  Pair<? extends Employee> wildcardBuddies = managerBuddies; // OK\nwildcardBuddies.setFirst(someEmployee);\
  \ // 编译错误\n```\n\n不可能破坏。对 `setFirst` 的调用是类型错误。要了解为什么，让我们仔细观察类型 `Pair<? extends Employee>`。它的方法如下：\n\
  \n```java\n? extends Employee getFirst()\nvoid setFirst(? extends Employee)\n```\n\
  \n这使得调用 `setFirst` 变得不可能。编译器只知道它需要 `Employee` 的子类型，但不知道是哪一个。此外，如果你调用 `getFirst`，对返回对象的类型没有保证。你只能将其赋值给\
  \ `Employee`。这是边界通配符背的核心思想。我们现在有了区分访问器方法（accessor methods）和变器方法（mutator methods）的方法。\n\
  \n#### 12.8.1. 通配符的父类边界\n\n通配符边界类似于类型变量，但它们多了一个功能——你可以指定父类边界，例如 `? super Manager`。\n\
  \n你为什么要这样做？带有父类边界的通配符提供的行为与第 12.8 节描述的通配符相反。你可以为方法提供参数，但无法返回值。例如，`Pair<? super Manager>`\
  \ 拥有方法：\n\n```java\nvoid setFirst(? super Manager)\n? super Manager getFirst()\n\
  ```\n\n编译器不知道 `setFirst` 方法的具体类型，因此不能用 `Employee` 或 `Object` 类型的对象调用它，只能用 `Manager`\
  \ 类型或其子类（如 `Executive`）。\n\n这是一个典型的示例。我们有一个经理数组，想将奖金最低和最高的经理放入一个 `Pair` 对象中。什么样的\
  \ `Pair`？\n\n`Pair<Employee>` 应该是可以的，或者说 `Pair<Object>` 也（参见图 12.4）。以下方法将接受任何合适的\
  \ `Pair`：\n\n点击此处查看代码图片\n\n```java\npublic static void minmaxBonus(Manager[] a,\
  \ Pair<? super Manager> result)\n{\n   if (a == null || a.length == 0) return;\n\
  \   Manager min = a[0];\n   Manager max = a[0];\n   for (int i = 1; i < a.length;\
  \ i++)\n   {\n      if (min.getBonus() > a[i].getBonus()) min = a[i];\n      if\
  \ (max.getBonus() < a[i].getBonus()) max = a[i];\n   }\n   result.setFirst(min);\n\
  \   result.setSecond(max);\n}\n```\n\n\n\n\n\n![Image](img/image01207.jpeg)\n\n\
  ## 图 12.4. 带有上类型边界的通配符\n\n直观上来说，带有上类型界（supertype bounds）的通配符允许你向泛型对象写入数据，而带有子类型界（subtype\
  \ bounds）的通配符允许你从泛型对象读取数据。\n\n这里是上类型界的另一种用法。`Comparable` 接口本身是一个泛型类型。它的声明如下：\n\n\
  ```java\npublic interface Comparable<T> \n{\n    public int compareTo(T other);\n\
  }\n```\n\n在这里，类型变量表示 `other` 参数的类型。例如，`String` 类实现了 `Comparable<String>`，其 `compareTo`\
  \ 方法声明为：\n\n```java\npublic int compareTo(String other)\n```\n\n这很棒——显式参数具有正确的类型。在接口泛型之前，`other`\
  \ 是一个 `Object`，在方法的实现中需要进行类型转换。\n\n既然 `Comparable` 现在已经一个泛型类型，也许我们应该对 `ArrayAlg`\
  \ 类的 `min` 方法做得更好？我们可以将其声明为：\n\n```java\npublic static <T extends Comparable<T>>\
  \ T min(T[] a)\n```\n\n这看起来比仅仅使用 `T extends Comparable` 更详尽，并且对许多类都有效。例如，如果你计算一个\
  \ `String` 数组的最小值，那么 `T` 就是类型 `String`，而 `String` 是 `Comparable<String>` 的子类型。但我们在处理\
  \ `GregorianCalendar` 对象数组时会遇到一个问题。事实上，`GregorianCalendar` 是 `Calendar` 的子类，而 `Calendar`\
  \ 实现了 `Comparable<Calendar>`。因此，`GregorianCalendar` 实现了 `Comparable<Calendar>` 而不是\
  \ `Comparable<GregorianCalendar>`。\n\n在这种情况下，上类型派上了用场：\n\n```java\npublic static\
  \ <T extends Comparable<? super T>> T min(T[] a) . . .\n```\n\n现在 `compareTo` 方法的形式变为：\n\
  \n```java\nint compareTo(? super T)\n```\n\n它可能声明为接收一个类型为 `T` 的对象，或者（例如当 `T` 为 `GregorianCalendar`\
  \ 时）`T` 的上类型。无论如何，将类型为 `T` 的对象传递给 `compareTo` 方法是安全的。\n\n对于初学者来说，像 `<T extends Comparable<?\
  \ super T>>` 这样的声明看起来很令人畏畏。这很遗憾，因为这个声明的意图是通过消除对调用参数的不必要限制来帮助应用程序程序员的。对泛型不感兴趣的应用程序程序员可能会很快学会忽略这些声明，并理所当然地认为库程序员会做正确的事情。如果你是一个库程序员，你就需要习惯通配符，否则你的用户会诅咒你，并在他们的代码中随机抛出类型转换，直到编译通过为止。\n\
  \n### 12.8.2. 无边界通配符\n\n你甚至可以使用没有任何边界的通配符——例如，`Pair<?>`。从表面上看，它看起来和原始类型 `Pair` 相同。实际上，这些类型非常不同。类型\
  \ `Pair<?>` 拥有如下方法：\n\n```java\n? getFirst()\nvoid setFirst(?)\n```\n\n`getFirst`\
  \ 的返回值只能赋值给 `Object`。`setFirst` 方法永远无法被调用，即使传入 `Object` 行。这就是 `Pair<?>` 和 `Pair`\
  \ 之间的本质区别：你可以用任何 `Object` 调用原始 `Pair` 类的 `setFirst` 方法。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n你可以调用 `setFirst(null)`。\n\n***\n\n你为什么要需要这样一个软弱的类型呢？它对于非常简单的操作有用。例如，下面的方法测试配对是否包含\
  \ `null` 引用。它永远不需要实际类型。\n\n```java\npublic static boolean hasNulls(Pair<?> p)\n\
  {\n    return p.getFirst() == null || p.getSecond() == null;\n}\n```\n\n你可以通过将 `hasNulls`\
  \ 转换为泛型方法来避免使用通配符类型：\n\n```java\npublic static <T> boolean hasNulls(Pair<T> p)\n\
  ```\n\n然而，通配符类型的版本似乎更易读。\n\n### 12.8.3. 通配符捕获 (Wildcard Capture)\n\n让我们写一个交换配对元素的方法：\n\
  \n```java\npublic static void swap(Pair<?> p)\n```\n\n通配符不是类型变量，所以我们不能编写使用 `?` 作为类型的代码。换句话说，以下代码是非法的：\n\
  \n```java\n? t = p.getFirst(); // 错误\np.setFirst(p.getSecond());\np.setSecond(t);\n\
  ```\n\n这是一个问题，因为我们在交换时需要临时持有第一个元素。幸运的是，这个问题有一个有趣的解决方案。我们可以写一个这样的辅助方法 `swapHelper`：\n\
  \n```java\npublic static <T> void swapHelper(Pair<T> p)\n{\n    T t = p.getFirst();\n\
  \    p.setFirst(p.getSecond());\n    p.setSecond(t);\n}\n```\n\n注意 `swapHelper`\
  \ 是一个泛型方法，而 `swap` 不是——它有一个类型为 `Pair<?>` 的固定参数。\n\n现在我们可以从 `swap` 中调用 `swapHelper`：\n\
  \n```java\npublic static void swap(Pair<?> p) { swapHelper(p); }\n```\n\n在这种情况下，`swapHelper`\
  \ 方法的参数 `T` 捕获了通配符。未知通配符代表什么类型，但它是一个确定的类型，当 `T` 表示该类型时，`<T> swapHelper` 的定义就完全合理。\n\
  \n当然，在这种情况下，我们并没有被强制使用通配符。我们可以直接实现 `<T> void swap(Pair<T> p)` 为一个泛型方法。然而，考虑这个例子，通配符在计算过程中自然地出现：\n\
  \n```java\npublic static void maxBonus(Manager[] a, Pair<? super Manager> result)\n\
  {\n    minBonus(a, result);\n    Alg.swap(result);\n}\n```\n\n在这里，通配符捕获机制是无法避免的。通配符捕获只在非常有限的情况下是法的。编译器必须能够保证通配符代表单一、确定的类型。例如，`ArrayList<Pair<T>>`\
  \ 中的 `T` 永远无法捕获 `ArrayList<Pair<?>>` 中的通配符。该列表可能包含两个 `Pair<?>`，每个 `?` 都有不同的类型。\n\
  \n列表 12.3 中的测试程序收集了我们在前面的节中讨论的各种方法，因此你可以在上下看到它们。\n\n#### 列表 12.3. pair/PairTest3.java\n\
