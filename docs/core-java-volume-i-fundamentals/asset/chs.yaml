  **由于您提供的待翻译文本后半部分存在严重的重复，我已根据“不要重复输出原文”的要求，为您提供了去重后的完整翻译：**\n\n[content]\n模型必须实现更改内容的方法以及发现内容是什么的方法。例如，文本模型具有在当前文本中添加或删除字符的方法，以及将当前文本作为字符串返回的方法。再次，请记住，模型是完全非视觉的。视图（view）的工作是绘制存储在模型中的数据。\n\
  \n![Image](img/image00948.jpeg) 备注\n\n“模型（model）”一词用得或许并不恰当，因为我们经常把模型看作抽象概念的表示。汽车和飞机的设计师建立模型来模拟真实的汽车和飞机。但当你考虑模型-视图-控制器（model-view-controller）模式时，这种类比实际上会误导你。在这一设计模式中，模型存储完整的内容，而视图则提供内容的（完整或不完整）的视觉表示。一个更好的类比可能是为艺术家摆姿的模特。观察模特并创建视图是艺术家的工作。根据艺术家的不同，该视图可能是一幅正式肖像、一幅印象派绘画，或是一幅显示肢体呈奇异扭状的立体主义画作。\n\
  \n模型-视图-控制器模式的优势之一是一个模型可以有多个视图，每个视图显示完整内容的不同部分或方面。例如，一个 HTML 编辑器可以同时提供相同内容的两个视图：所见即所得（WYSIWYG）视图和一个“原始标签”视图（参见图\
  \ 9.3）。当通过一个视图的控制器更新模型时，它会通知两个关联的视图变化。当视图收到通知时，它们会自动刷新。当然，对于像按钮这样简单的用户界面组件，你不会有同一个模型的多个视图。\n\
  \n![Image](img/image01079.jpeg)\n\n图 9.3. 同一个模型的两个独立视图\n\n控制器（controller）处理用户输入事件，如鼠标点击和击键。它然后决定是否将这些事件翻译为模型或视图的变化。例如，如果用户在文本框中按下字符键，控制器会调用模型的“插入字符”命令。模型随后告诉视图更新自身。视图永远不知道文本为什么发生变化。但如果用户按下光标键，控制器可能会告诉视图滚动。滚动视图对底层文本没有影响，因此模型永远不知道该事件的发生。\n\
  \n图 9.4 显示了模型、视图和控制器对象之间的交互。\n\n![Image](img/image01080.jpeg)\n\n图 9.4. 模型、视图和控制器对象之间的交互\n\
  \n作为一名使用 Swing 组件的程序员，你通常不需要考虑模型-视图-控制器架构。每个用户界面组件都有一个包装类（如 `JButton` 或 `JTextField`），它存储了模型。\n\
  \n### 9.1.3 模型-视图-控制器\n作为一名使用 Swing 组件的程序员，你通常不需要考虑模型-视图-控制器架构。每个用户界面组件都有一个包装类（如\
  \ `JButton` 或 `JTextField`），它存储了模型。\n\n### 9.1.4 ButtonModel 和 DefaultModel\n对于大多数组件，模型是一个以\
  \ `Model` 结尾的接口；在这种情况下，该接口被称为 `ButtonModel`。实现该接口的类定义了按钮的状态。事实上，Swing 库包含一个类，叫做\
  \ `DefaultModel`。\n\n你可以通过查看表 9.1 来了解模型所维护的数据类型。\n\n表 9.1. ButtonModel 的属性\n\n![Image](img/image1081.jpeg)\n\
  \n每个 `JButton` 对象存储一个你可以获取的模型：\n\n```\nJButton button = new JButton(\"Blue\");\n\
  ButtonModel model = button.getModel();\n```\n\n在实践中，你不会关心按钮的状态，你只对绘制它的视图感兴趣。所有重要信息（如按钮是否启用）都可以从\
  \ `JButton` 类中获得。当你想要查询内容（例如，文本框中的位置），包装类会询问模型。然而，包装类会将请求传递给视图。在某些情况下，模型对于用户界面是可交互的（正如我们之前指出的，你不需要直接操作它）。\n\
  \n### 9.2 布局管理简介\n\n\n\n在我们开始讨论单个 Swing 组件（如文本字段和单选按钮）之前，我们简要介绍如何在框架（frame）中安排这些组件。与\
  \ Visual Basic 不同，JDK 没有表单设计器。你需要编写代码来定位（布局）用户界面组件到你希望它们所在的位置。\n\n当然，如果你有一个支持 Java\
  \ 的开发环境，它可能有一个布局工具，可以自动完成这些部分或全部任务。尽管如此，确切了解“底层”发生了什么是非常重要的，因为即使是这些工具中最好的，通常也需要手动微调。\n\
  \n让我们从回顾第 8 章 中的程序开始，该程序使用按钮来更改框架的背景颜色（参见图 9.5）。\n\n![Image](img/image01082.jpeg)\n\
  \n图 9.5. 带有三个按钮的面板\n\n按钮包含在一个 `JPanel` 对象中，并由`流布局管理器`（flow layout manager）管理，它是面板的默认布局管理器。图\
  \ 9.6 显示了向面板添加更多按钮时发生的情况。如你所见，当没有空间时，会开始新的一行。\n\n![Image](img/image01083.jpeg)\n\
  \n图 9.6. 由流布局管理的带有六个按钮的面板\n\n此外，即使用户调整框架的大小，按钮也始终保持在面板的居中（参见图 9.7）。\n\n![Image](img/image01084.jpeg)\n\
  \n图 9.7. 更改面板大小会自动重新排列按钮。\n\n通常情况下，`components`（组件）被放置在`containers`（容器）内部，`layout\
  \ manager`（布局管理器）决定容器中组件的位置和大小。\n\n按钮、文本字段和其他用户界面元素继承自 `Component` 类。组件可以放置在面板等容器中。容器本身也可以被放在其他容器中，因此\
  \ `Container` 类继承自 `Component`。图 9.8 显示了 `Component` 的继承层次结构。\n\n![Image](img/image01085.jpeg)\n\
  \n图 9.8. `Component` 类的继承层次结构\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n遗憾的是，继承层次结构在两个方面有点不完美。首先，顶层窗口（如\
  \ `JFrame`）是 `Container` 的子类，因此也是 `Component` 的子类，但它们不能被放在其他容器内部。此外，`JComponent`\
  \ 是 `Container` 的子类而不是 `Component`。因此，你可以向 `JButton` 添加其他组件（但这些组件不会显示）。\n\n***\n\
  \n每个容器都有一个默认的布局管理器，但你总是设置自己的。例如，语句\n\n```\npanel.setLayout(new GridLayout(4, 4));\n\
  ```\n\n使用 `GridLayout` 类来布局面板中的组件。当你向容器添加组件时，容器的 `add` 方法会将组件和任何放置方向传递给布局管理器。\n\n\
  ***\n\n`java.awt.Container` **1.0**\n\n- `void setLayout(LayoutManager m)` 设置此容器的布局管理器。\n\
  - `Component add(Component c)`\n- `Component add(Component c, Object constraints)`\
  \ **1.1** 将组件添加到此容器中并返回组件引用。\n\n![Image](img/image01086.jpeg)\n\n***\n\n***\n\n\
  `java.awt.FlowLayout` **1.0**\n\n- `FlowLayout()`\n- `FlowLayout(int align)`\n-\
  \ `FlowLayout(int align, int hgap, int vgap)` 构建一个新的 `FlowLayout`。\n\n![Image](img/image01087.jpeg)\n\
  \n***\n\n#### 9.2.1 边界布局 (Border Layout)\n\n`border layout manager`（边界布局管理器）是每个\
  \ `JFrame` 内容面板（content pane）的默认布局管理器。与完全控制每个组件位置的流布局管理器不同，边界布局让你选择放置每个组件的位置。你可以选择将组件放在内容面板的中心、北、南、东或西（参见图\
  \ 9.9）。\n\n![Image](img/image01088.jpeg)\n\n图 9.9. 边界布局\n\n例如：\n\n```\nframe.add(component,\
  \ BorderLayout.SOUTH);\n```\n\n边缘组件首先布局，剩余的可用空间由中心部分占据。当容器调整大同时，边缘组件的尺寸保持不变，但中心组件会改变大小。通过指定\
  \ `BorderLayout` 常量 `CENTER`、`NORTH`、`SOUTH`、`EAST` 或 `WEST` 来添加组件。并不是所有位置都需要被占据。如果你不提供任何值，则假设为\
  \ `CENTER`。\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n`BorderLayout` 常量被定义为字符串。例如，`BorderLayout.SOUTH`\
  \ 被定义为字符串 `\"South\"`。许多程序员倾向于直接使用字符串，因为它们更短；例如，`frame.add(component, \"South\"\
  )`。然而，如果你不小心拼错了字符串，编译器是无法检测到的。\n\n***\n\n与流布局不同，边界布局会扩展组件的大小以填充可用空间。当你添加另一个按钮时，就会出现问题：\n\
  \n```\nframe.add(component, BorderLayout.SOUTH);\n```\n\n边界布局会增长以填充整个南部区域。图 9.10\
  \ 显示了使用上述代码时发生的情况。\n\n![Image](img/image0189.jpeg)\n\n图 9.10. 由边界布局管理的单个按钮\n\n要解决这个问题，请使用额外的面板。例如，查看图\
  \ 9.11。屏幕底部的三个按钮包含在一个面板中。\n\n![Image](img/image0190.jpeg)\n\n图 9.11. 南区域的面板\n\n\
  要实现这种配置，首先创建一个 `JPanel` 对象，然后将单个按钮添加到面板中。面板的默认布局管理器是 `FlowLayout`，这对于这种情况是一个很好的选择。使用之前过的\
  \ `add` 方法将单个按钮添加到面板。这意味着按钮在面板内居中，而不会填充面板区域。最后，将面板添加到框架的内容面板。\n\n```\nJPanel panel\
  \ = new JPanel();\npanel.add(yellowButton);\npanel.add(blueButton);\npanel.add(redButton);\n\
  frame.add(panel, BorderLayout.SOUTH);\n```\n\n边界布局扩展面板以填充整个南部区域。\n\n***\n\n`java.awt.BorderLayout`\
  \ **1.0**\n\n- `BorderLayout()`\n- `BorderLayout(int hgap, int vgap)` 构建一个新的 `BorderLayout`。\n\
  \n![Image](img/image0191.jpeg)\n\n***\n\n#### 9.2.2 网格布局 (Grid Layout)\n\n网格布局像电子表格一样按行列排列所有组件。所有组件的大小相同。图\
  \ 9.12 中的计算器程序使用网格布局安排计算器按钮。当你调整窗口大同时，按钮会增大缩小，但所有按钮的大小都是相同的。\n\n![Image](img/image0192.jpeg)\n\
  \n图 9.12. 计算器\n\n在网格对象的构造函数中，你指定需要多少行列。\n\n```\npanel.setLayout(new GridLayout(4,\
  \ 4));\n```\n\n从第一行的第一个元素开始添加，然后是第一行的第二个元素，依此类推。\n\n```java\npanel.add(new JButton(\"\
  1\"));\npanel.add(new JButton(\"2\"));\n```\n\n列表 9.1 显示了计算器程序的面板类。这是一个普通的计算器，而不是\
  \ Java 教程中异常流行的“逆波兰式”变。在该程序中，我们在组件添加到框架后调用了 `pack` 方法。该方法使用所有组件的首选尺寸来计算框架的宽度和高度。\n\
  \n\n\n当然，很少有应用程序的布局像计算器界面那样固定。在实践中，较小的网格（通常只有一行或一列）可以用于组织窗口的局部区域。例如，如果你想有一行大小完全相同的按钮，可以将按钮放置在一个由单行网格布局控制的面板中。\n\
  \n### 列表 9.1. `calculator/CalculatorPanel.java`\n\n点击此处查看代码图片\n\n```java\npackage\
  \ calculator;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\
  \n/**\n * 带有包含计算器按钮和结果显示器的面板。\n */\npublic class CalculatorPanel extends JPanel\n\
  {\n    private JButton display;\n    private JPanel panel;\n    private double result;\n\
  \    private String lastCommand;\n    private boolean start;\n\n    public CalculatorPanel()\n\
  \    {\n        setLayout(new BorderLayout());\n        result = 0;\n        lastCommand\
  \ = \"=\";\n        start = true;\n        // 添加显示器\n        display = new JButton(\"\
  0\");\n        display.setEnabled(false);\n        add(display, BorderLayout.NORTH);\n\
  \n        ActionListener insert = new InsertAction();\n        ActionListener command\
  \ = new CommandAction();\n\n        // 在 4x4 网格中添加按钮\n        panel = new JPanel();\n\
  \        panel.setLayout(new GridLayout(4, 4));\n\n        addButton(\"7\", insert);\n\
  \        addButton(\"8\", insert);\n        addButton(\"9\", insert);\n        addButton(\"\
  /\", command);\n\n        addButton(\"4\", insert);\n        addButton(\"5\", insert);\n\
  \        addButton(\"6\", insert);\n        addButton(\"*\", command);\n\n     \
  \   addButton(\"1\", insert);\n        addButton(\"2\", insert);\n        addButton(\"\
  3\", insert);\n        addButton(\"-\", command);\n\n        addButton(\"0\", insert);\n\
  \        addButton(\".\", insert);\n        addButton(\"=\", command);\n       \
  \ addButton(\"+\", command);\n\n        add(panel, BorderLayout.CENTER);\n    }\n\
  \n    /**\n     * 将按钮添加到中心面板中。\n     * @param label 按钮标签\n     * @param listener\
  \ 按钮监听器\n     */\n    private void addButton(String label, ActionListener listener)\n\
  \    {\n        JButton button = new JButton(label);\n        button.addActionListener(listener);\n\
  \        panel.add(button);\n    }\n\n    /**\n     * 此动作将按钮字符串插入到显示器的末尾。\n    \
  \ */\n    private class InsertAction implements ActionListener\n    {\n        public\
  \ void actionPerformed(ActionEvent event)\n        {\n            String input =\
  \ event.getActionCommand();\n            if (start)\n            {\n           \
  \     display.setText(\"\");\n                start = false;\n            }\n  \
  \          display.setText(display.getText() + input);\n        }\n    }\n\n   \
  \ /**\n     * 此动作执行按钮操作表示的命令。\n     */\n    private class CommandAction implements\
  \ ActionListener\n    {\n        public void actionPerformed(ActionEvent event)\n\
  \        {\n            String command = event.getActionCommand();\n\n         \
  \   if (start)\n            {\n                if (command.equals(\"-\"))\n    \
  \            {\n                    display.setText(command);\n                \
  \    start = false;\n                }\n                else lastCommand = command;\n\
  \            }\n            else\n            {\n                calculate(Double.parseDouble(display.getText()));\n\
  \                lastCommand = command;\n                start = true;\n       \
  \     }\n        }\n    }\n\n    /**\n     * 执行待定的计算。\n     * @param x 与先前的结果累加的值。\n\
  \     */\n    public void calculate(double x)\n    {\n        if (lastCommand.equals(\"\
  +\")) result += x;\n        else if (lastCommand.equals(\"-\")) result -= x;\n \
  \       else if (lastCommand.equals(\"*\")) result *= x;\n        else if (lastCommand.equals(\"\
  /\")) result /= x;\n        else if (lastCommand.equals(\"=\")) result = x;\n  \
  \      display.setText(\"\" + result);\n    }\n}\n```\n\n***\n\n### 9.3. 文本输入\n\n\
  我们终于准备好引入 `JTextField` 和 `JTextArea` 了。`JTextField` 只接受一行；`JTextArea` 可以接受多行。这些类都继承自抽象类\
  \ `JTextComponent`。\n\n`javax.swing.text.JTextComponent`\n\n- `String getText()`\n\
  - `void setText(String text)`\n获取或设置此组件的文本。\n- `boolean isEditable()`\n- `void setEditable(boolean\
  \ b)`\n获取或设置 `editable` 属性，该属性决定用户是否可以编辑内容。\n\n#### 9.3.1. 文本字段\n\n向窗口添加文本字段的常用方法是将其添加到面板或其他容器中——就像添加按钮一样：\n\
  \n点击此处查看代码图片\n\n```java\nJPanel panel = new JPanel();\nJTextField textField = new\
  \ JTextField(\"Default input\", 20);\npanel.add(textField);\n```\n\n这段代码添加了一个文本字段，并通过在其中放置字符串\
  \ `\"Default input\"` 来对其进行初始化。该构造函数的第二个参数设置宽度。在这种情况下，宽度为 20 列。遗憾的是，“列”是一个相当精确的测量单位。一列是你用于文本的字体中一个字符的预期宽度。其思路是，如果你预计输入少于或等于\
  \ *n* 个字符，你就应该指定 *n* 为列宽。在实践中，这种测量效果并不理想，你应该在最大长度上增加 1 或 2 以保险起见。此外，请记住，列数只是给 AWT\
  \ 的一个关于*首选*尺寸的提示。如果布局管理器需要扩大或缩小文本字段，它可以调整其尺寸。在 `JTextField` 构造函数中设置列宽并不是用户可以输入的字符数的上限。用户仍然可以输入更长的字符串，但当文本超过字段长度时，输入会滚动。\n\
  \n如果你需要在运行时重置列数，可以使用 `setColumns` 方法来实现。\n\n`GridLayout(int rows, int columns)`\n\
  `GridLayout(int rows, int columns, int hgap, int vgap)`\n\n**提示：** 使用 `setColumns`\
  \ 方法更改文本框的大小后，调用周围容器的 `revalidate` 方法。\n\n```java\ntextField.setColumns(10);\npanel.revalidate();\n\
  ```\n\n\n\n\n`revalidate` 方法属于 `JComponent` 类。它不会立即调整组件的大小，而仅仅将其标记为需要调整大小。当多个组件都请求调整大时，这种方法可以避免重复计算。然而，如果你想重新计算\
  \ `JFrame` 内部的所有组件，你必须调用 `validate` 方法——因为 `JFrame` 并没有继承 `JComponent`。\n\n通常情况下，用户会在文本字段中添加文本（或编辑现有文本）。很多时候，这些文本字段开始时是空白的。要创建一个空白的文本字段，只需在\
  \ `JTextField` 构造函数中省略字符串参数即可：\n\n```\nJTextField textField = new JTextField(20);\n\
  ```\n\n你可以使用上一节中提到的 `JTextComponent` 父类的 `setText` 方法随时更改文本字段的内容。例如：\n\n```\ntextField.setText(\"\
  Hello!\");\n```\n\n而且，正如前一节所提到的，你可以通过调用 `getText` 方法来获取用户输入了什么。该方法返回用户输入的精确文本。为了去除文本字段数据中任何多余的开头和结尾空格，可以对\
  \ `getText` 的返回值应用 `trim` 方法：\n\n```\nString text = textField.getText().trim();\n\
  ```\n\n要更改用户文本显示的字体，请使用 `setFont` 方法。\n\n### javax.swing.JTextField 1.2\n\n- `JTextField(int\
  \ cols)`：构造一个具有指定列数的空 `JTextField`。\n- `JTextField(String text, int cols)`：构造一个具有初始字符串和指定列数的新的\
  \ `JTextField`。\n- `int getColumns()`\n- `void setColumns(int cols)`：获取或设置此文本字段应使用的的列数。\n\
  \n### javax.swing.JComponent 1.2\n\n- `void revalidate()`：重新计算组件的位置和大小。\n- `void\
  \ setFont(Font f)`：设置此组件的字体。\n\n### java.awt.Component 1.0\n\n- `void validate()`：重新计算组件的位置和大小。如果该组件是一个容器，则其组件的位置和大小也会重新计算。\n\
  - `Font getFont()`：获取此组件的字体。\n\n### 9.3.2 标签与组件标记\n\n标签（Labels）是持有文本的组件。它们没有装饰（例如，没有边界）。它们也不会对用户输入做出反应。你可以使用标签来标识组件。例如，与按钮不同，文本字段没有标签来标识它们。要给一个本身不带标识符的组件标记：\n\
  \n1. 使用正确的文本构造一个 `JLabel` 组件。\n2. 将其放置在离要标识的组件足够近的位置，以便用户能看到该标签标识的是正确的组件。\n\n`JLabel`\
  \ 的构造函数允许你指定初始文本或图标，并可选地指定内容的对齐方式。你使用源自 `SwingConstants` 接口的常量来指定对齐方式。该接口定义了许多有用常量，如\
  \ `LEFT`、`RIGHT`、`CENTER`、`NORTH`、`EAST` 等。`JLabel` 类是实现此接口的 Swing 类之一。因此，你可以通过以下方式指定右对齐的标签：\n\
  \n```\nJLabel label = new JLabel(\"User name: \", SwingConstants.RIGHT);\n```\n\n\
  或者\n\n```\nJLabel label = new JLabel(\"User name: \", JLabel.RIGHT);\n```\n\n`setText`\
  \ 和 `setIcon` 方法允许你在运行时设置标签的文本和图标。\n\n![Image](img/image00949.jpeg) 提示\n\n你可以在按钮、标签和菜单项中使用纯文本和\
  \ HTML 文本。我们不建议在按钮中使用 HTML——它会干扰视觉效果（look-and-feel）。但在标签中使用 HTML 可以非常有效。只需将标签字符串用\
  \ `<html>...</html>` 包起来如下：\n\n```\nlabel = new JLabel(\"<html><b>Required</b> entry:</html>\"\
  );\n```\n\n注意，第一个带有 HTML 标签的组件可能需要一些时间显示，因为必须加载复杂的 HTML 渲染代码。\n\n标签可以像其他组件一样放置在容器内部。这意味着你可以使用之前见过的技术将标签放置在需要的地方。\n\
  \n### javax.swing.JLabel 1.2\n\n- `JLabel(String text)`\n- `JLabel(Icon icon)`\n\
  - `JLabel(String text, int align)`\n- `JLabel(String text, Icon icon, int align)`：构造一个标签。\n\
  \n![Image](img/image01094.jpeg)\n\n- `String getText()`\n- `void setText(String\
  \ text)`：获取或设置此标签的文本。\n- `Icon getIcon()`\n- `void setIcon(Icon icon)`：获取或设置此标签的图标。\n\
  \n### 9.3.3 密码字段\n\n密码字段是文本字段的一种特殊类型。为了防止好奇的旁观者看到密码，用户输入的字符实际上不会被显示。相反，每个输入的字符由一个回显字符（echo\
  \ character）表示，通常是星号（`*`）。Swing 提供了一个实现此类文本字段的 `JPasswordField` 类。\n\n密码字段是模型-视图-控制器架构模式力量的另一个例子。密码字段使用与普通文本字段相同的模型来存储数据，但它的视图已被更改，将所有字符显示为回显字符。\n\
  \n### javax.swing.JPasswordField 1.2\n\n- `JPasswordField(String text, int cols)`：构造一个新的密码字段。\n\
  - `void setEchoChar(char echo)`：设置此密码字段的回显字符。值 `0` 可重置回显字符。\n- `char[] getPassword()`：返回密码字段中包含的内容。\n\
  \n### 9.3.4 文本区域\n\n有时，你需要收集多行的用户输入。如前提到的，你可以使用 `JTextArea` 组件来实现。当你将文本区域组件放在程序中时，用户可以输入任意行，使用回车键将它们隔开。每行以\
  \ `'\\n'` 结束。\n\n![Image](img/image1095.jpeg) 图 9.13 文本组件\n\n在 `JTextArea` 的构造函数中，指定文本区域的行数和列数。例如：\n\
  \n```\ntextArea = new JTextArea(8, 40); // 8 行 40 列\n```\n\n其中 `columns` 参数的作用与之前相同为了安全起见，你仍然需要添加几列。同样地，用户不受行数和列数的限制；当用户输入过多时，文本会自动滚动。你也可以使用\
  \ `setColumns` 方法更改列数，使用 `setRows` 方法更改行数。这些数字仅指示建议尺寸——布局管理器仍然可以扩展或缩小文本区域。\n\n如果文本多于文本区域可以显示的范围，剩余文本将被裁剪。你可以通过开启换行来避免长行被裁剪：\n\
  \n```\ntextArea.setLineWrap(true); // 长行换行\n```\n\n这种换行仅是视觉效果；文档中的文本不会改变——不会在文本中自动插入\
  \ `'\\n'` 字符。\n\n### 9.3.5 滚动面板\n\n在 Swing 中，文本区域没有滚动条。如果你需要滚动条，必须将文本区域放置在滚动面板中。\n\
  \n```\ntextArea = new JTextArea(8, 40);\nJScrollPane scrollPane = new JScrollPane(textArea);\n\
  ```\n\n现在滚动面板管理文本区域的视图。当文本多于文本区域可以显示的范围时，滚动条会自动出现；当删除文本且剩余文本能够适应区域时，滚动条会再次消失。滚动是由滚动面板内部处理的——你的程序不需要处理滚动事件。\n\
  \n\n\n\n\n这是一个适用于任何组件的通用机制，而不只是文本区域。要为组件添加滚动条，请将其放在滚动面板（scroll pane）中。\n\nListing\
  \ 9.2 展示了各种文本组件。该程序显示了一个文本字段、一个密码字段以及一个带有滚动条的文本区域。文本字段和密码字段都有标签。点击“插入（Insert）”可以将字段内容插入到文本区域中。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n`JTextArea` 组件仅显示纯文本，不带特殊字体或格式。要显示格式化文本（如\
  \ HTML），你可以使用第二卷中讨论的 `JEditorPane` 类。\n\n***\n\nListing 9.2. text/TextComponentFrame.java\n\
  \n点击此处查看代码图片\n\n***\n\n```java\npackage text;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个带有示例文本组件的框架。\n */\npublic class TextComponentFrame\
  \ extends JFrame\n{\n    public static final int TEXTAREA_ROWS = 8;\n    public\
  \ static final int TEXTAREA_COLUMNS = 20;\n\n    public TextComponentFrame()\n \
  \   {\n        final JTextField textField = new JTextField();\n        final JPasswordField\
  \ passwordField = new JPasswordField();\n\n        JPanel northPanel = new JPanel();\n\
  \        northPanel.setLayout(new GridLayout(2, 2));\n        northPanel.add(new\
  \ JLabel(\"User name: \", SwingConstants.RIGHT));\n        northPanel.add(textField);\n\
  \        northPanel.add(new JLabel(\"Password: \", SwingConstants.RIGHT));\n   \
  \     northPanel.add(passwordField);\n\n        add(northPanel, BorderLayout.NORTH);\n\
  \n        final JTextArea textArea = new JTextArea(TEXTAREA_ROWS, TEXTAREA_COLUMNS);\n\
  \        JScrollPane scrollPane = new JScrollPane(textArea);\n\n        add(scrollPane,\
  \ BorderLayout.CENTER);\n\n        // add button to append text into the text area\n\
  \        JPanel southPanel = new JPanel();\n\n        JButton insertButton = new\
  \ JButton(\"Insert\");\n        southPanel.add(insertButton);\n        insertButton.addActionListener(new\
  \ ActionListener()\n        {\n            public void actionPerformed(ActionEvent\
  \ event)\n            {\n                textArea.append(\"User name: \" + textField.getText()\
  \ + \" Password: \"\n                        + new String(passwordField.getPassword())\
  \ + \"\\n\");\n            }\n        });\n\n        add(southPanel, BorderLayout.SOUTH);\n\
  \        pack();\n    }\n}\n```\n\n***\n\njavax.swing.JTextArea\n- `JTextArea()`\n\
  - `JTextArea(int rows, int cols)`\n- `JTextArea(String text, int rows, int cols)`\
  \ 构建一个新的文本区域。\n- `void setColumns(int cols)` 告诉文本区域应使用的建议列数。\n- `void setRows(int\
  \ rows)` 告诉文本区域应使用的建议行数。\n- `void append(String newText)` 将给定文本添加到文本区域的末尾。\n- `void\
  \ setLineWrap(boolean wrap)` 开启或关闭换行。\n- `void setWrapStyle(boolean word)` 如果 `word`\
  \ 为 `true`，则长会在单词边界处换行。如果为 `false`，则长行将在不考虑单词的情况下断开。\n- `void setTabSize(int c)`\
  \ 设置每 `c` 列一个制表位。注意，制表符不会转换为空格，而是导致与下一个制表位对齐。\n\n***\n\njavax.swing.JScrollPane\n\
  - `JScrollPane(Component c)` 创建一个显示指定组件内容的滚动面板。当组件大于视图时，将提供滚动条。\n\n### 9.4 选择组件\n\
  \n你现在已经知道如何收集文本输入，但在许多情况下，你倾向于给用户提供一组有限的选择，而不是让他们在文本组件中输入数据。使用一组按钮或项目列表可以告诉用户他们有哪些选择（这同时也节省了你处理错误的麻烦）。在本节中，你将学习如何编写复选框、单选按钮、选择列表和滑块。\n\
  \n#### 9.4.1 复选框\n\n如果你想收集“是”或“否”输入，请使用复选框组件。复选框自动带有标识它们的标签。用户可以通过点击内部来勾选框，通过再次点击内部来取消勾选。当焦点位于复选框时，按下空格键也可以切换勾选状态。\n\
  \n图 9.14 显示了一个带有两个复选框的简单程序，一个用于开启或关闭字体的*斜体*属性，另一个用于**字体**。注意第二个复选框具有焦点，如标签周围的矩形所示。用户每当点击其中一个复选框时，屏幕都会刷新并使用新的字体属性。\n\
  \n![Image](img/image0196.jpeg)\n\n图 9.14. 复选框\n\n复选框旁边需要一个标签来标识它们的用途。在构造函数提供标签文本：\n\
  `bold = new JCheckBox(\"Bold\");`\n使用 `setSelected` 方法开启或关闭复选框。例如：\n`bold.setSelected(true);`\n\
  `isSelected` 方法检索每个复选框的当前状态。未勾选为 `false`，已勾选为 `true`。\n当用户点击复选框时，会触发一个动作事件。像往一样，你为复选框附加一个动作监听器。在我们的程序中，两个复选框共享同一个动作监听器。\n\
  `ActionListener listener = ...`\n`bold.addActionListener(listener);`\n`italic.addActionListener(listener);`\n\
  `actionPerformed` 方法查询 `bold` 和 `italic` 复选框的状态，并将面板的字体设置为普通、加粗、斜体或同时加粗和斜体。\n\n\
  点击此处查看代码图片\n```java\npublic void actionPerformed(ActionEvent event)\n{\n    int\
  \ mode = 0;\n    if (bold.isSelected()) mode += Font.BOLD;\n    if (italic.isSelected())\
  \ mode += Font.ITALIC;\n    label.setFont(new Font(\"Serif\", mode, FONTSIZE));\n\
  }\n```\n\nListing 9.3 是复选框示例的完整程序列表。\n\nListing 9.3. checkBox/CheckBoxTest.java\n\
  \n点击此处查看代码图片\n\n```java\npackage checkBox;\n\nimport java.awt.*;\nimport javax.swing.*;\n\
  \n/**\n * @version 1.33 2007-06-12\n * @author Cay Horstmann\n */\npublic class\
  \ CheckBoxTest\n{\n    public static void main(String[] args)\n    {\n        EventQueue.invokeLater(new\
  \ Runnable()\n        {\n            public void run()\n            {\n        \
  \        JFrame frame = new CheckBoxFrame();\n                frame.setTitle(\"\
  CheckBoxTest\");\n                frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \                frame.setVisible(true);\n            }\n        });\n    }\n}\n\
  ```\n\n***\n\n***\n\njavax.swing.JCheckBox\n- `JCheckBox(String label)`\n- `JCheckBox(String\
  \ label, Icon icon)` 构建一个初始未选中的复选框。\n- `JCheckBox(String label, boolean state)`\
  \ 构建带有给定标签和初始状态的复选框。\n- `boolean isSelected()`\n- `void setSelected(boolean state)`\
  \ 获取或设置复选框的选中状态。\n\n***\n\n#### 9.4.2. 单选按钮\n\n\n\n\n\n在之前的示例中，用户可以勾选两个复选框中的一个、两个或一个都不选。在许多情况下，我们希望用户只在几个选框中选择其中一个。当另一个选框被选中时，之前的选框会自动取消选中。这样一组选框通常被称为\
  \ `radio button group`（单选按钮组），因为它们的作用就像收音机上的电台选择按钮。当你按下一个按钮时，之前被按下的按钮就会弹出。图 9.15\
  \ 显示了一个典型的示例。我们允许用户从小、中、大、特等选项中选择字体大小——但当然，我们只允许同时选择一种大小。\n\n![Image](img/image01097.jpeg)\n\
  \n图 9.15. 单选按钮组\n\n在 Swing 中实现单选按钮组非常简单。你为每组按钮构造 `ButtonGroup` 类型的对象。然后，将 `JRadioButton`\
  \ 类型的对象添加到按钮组中。按钮组对象负责在点击新按钮时关闭之前设置的按钮。\n\n```java\nButtonGroup group = new ButtonGroup();\n\
  \nJRadioButton smallButton = new JRadioButton(\"Small\", false);\n\ngroup.add(smallButton);\n\
  \nJRadioButton mediumButton = new JRadioButton(\"Medium\", true);\n\ngroup.add(mediumButton);\n\
  \n// ...\n```\n\n构造函数的第二个参数对于初始应选中的按钮为 `true`，对于所有其他按钮为 `false`。请注意，按钮组只控制按钮的行为；如果你是为了布局目的而对按钮分组，还需要将它们添加到诸如\
  \ `JPanel` 之容器中。\n\n如果你再次查看图 9.14 和 9.15，你会注意到单选按钮的外观与复选框不同。复选框是正方形的，选中时包含一个勾选标记。单选按钮是圆形的，选中时包含一个圆点。\n\
  \n单选按钮的事件通知机制与其他任何按钮都相同。当用户勾选单选按钮时，该按钮会产生一个动作事件。在我们的示例程序中，我们定义了一个监听器，将字体大小设置为特定值：\n\
  \n```java\nActionListener listener = new ActionListener()\n{\n    public void actionPerformed(ActionEvent\
  \ event)\n    {\n        // size refers to the final parameter of the addRadioButton\
  \ method\n        label.setFont(new Font(\"Serif\", Font.PLAIN, size));\n    }\n\
  };\n```\n\n将此监听器设置与复选框示例进行比较。每个单选按钮都有一个不同的监听器对象。每个监听器对象确切知道做什么——将字体大小设置为特定值。对于复选框，我们使用了不同的方法：两个复选框使用同一个动作监听器，该监听器调用一个方法查看两个复选框当前的状态。\n\
  \n在这里可以使用相同的方法吗？我们可以有一个单一的监听器如下计算大小：\n\n点击此处查看代码图像\n```java\nif (smallButton.isSelected())\
  \ size = 8;\nelse if (mediumButton.isSelected()) size = 12;\n// ...\n```\n然而，我们更倾向于使用动作监听器对象，因为它们将大小值与按钮结合得更紧密。\n\
  \n![Image](img/image0948.jpeg)\n\n如果你有一组单选按钮，你就知道其中只有一个是被选中的。如果能够快速查找到是哪一个，而不需要查询组中的所有按钮，那就太好了。`ButtonGroup`\
  \ 对象控制所有按钮，因此如果这个对象可以提供被选中按钮的引用将非常方便。事实上，`ButtonGroup` 类有一个 `getSelection` 方法，但该方法并不返回被选中的单选按钮。相反，它返回的是按钮的\
  \ `ButtonModel` 引用。遗憾的是，没有任何 `ButtonModel` 方法是有用的。`ButtonModel` 接口继承了 `ItemGroup`\
  \ 接口的 `getSelectedObjects` 方法，该方法毫无用处地返回 `null`。`getActionCommand` 方法看起来很有前景，因为单选按钮的“动作命令”是它的标签。但其模型的动作命令是\
  \ `null`。只有当你通过 `setActionCommand` 方法显式设置所有单选按钮的动作命令时，模型的动作命令值会被设置。这时你就可以通过 `buttonGroup.getSelection().getActionCommand()`\
  \ 获取当前选中按钮的动作命令。\n\n代码列表 9.4 是字体选择的完整程序，它让了一组单选按钮工作起来。\n\nListing 9.4.Frame.java\n\
  \n点击此处查看代码图像\n```java\npackage radioButton;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个带有示例文本标签和用于选择字体大小的单选按钮的框架。\n */\npublic class\
  \ RadioButtonFrame extends JFrame\n{\n    private JPanel buttonPanel;\n    private\
  \ ButtonGroup group;\n    private JLabel label;\n    private static final int DEFAULT_SIZE\
  \ = 36;\n\n    public RadioButtonFrame()\n    {\n        // 添加示例文本标签\n        label\
  \ = new JLabel(\"The brown fox jumps over the lazy dog.\");\n        label.setFont(new\
  \ Font(\"Serif\", Font.PLAIN, DEFAULT_SIZE));\n        add(label, BorderLayout.CENTER);\n\
  \        // 添加单选按钮\n        buttonPanel = new JPanel();\n        group = new ButtonGroup();\n\
  \n        addRadioButton(\"Small\", 8);\n        addRadioButton(\"Medium\", 12);\n\
  \        addRadioButton(\"Large\", 18);\n        addRadioButton(\"Extra large\"\
  , 36);\n\n        add(buttonPanel, BorderLayout.SOUTH);\n        pack();\n    }\n\
  \n    /**\n     * 添加一个设置示例字体大小的单选按钮。\n     * @param name 显示在按钮上的字符串\n     * @param\
  \ size 该按钮设置的字体大小\n     */\n    public void addRadioButton(String name, final int\
  \ size)\n    {\n        boolean selected = size == DEFAULT_SIZE;\n        JRadioButton\
  \ button = new JRadioButton(name, selected);\n        group.add(button);\n     \
  \   buttonPanel.add(button);\n\n        // 此监听器设置字体大小\n        ActionListener listener\
  \ = new ActionListener()\n        {\n            public void actionPerformed(ActionEvent\
  \ event)\n            {\n                // size refers to the final parameter of\
  \ the addRadioButton method\n                label.setFont(new Font(\"Serif\", Font.PLAIN,\
  \ size));\n            }\n        };\n\n        button.addActionListener(listener);\n\
  \    }\n}\n```\n\n\n\n\n如果你在窗口中有多个组单选按钮，你可能希望在视觉上指示哪些按钮是一组的。Swing 为此提供了一系列实用的边框（border）。你可以对任何扩展\
  \ `JComponent` 的组件应用边框。最常见的用法是在面板周围放置一个边框，并在面板中填充其他用户界面元素，例如单选按钮。\n\n你可以从多种边框中选择，但对所有它们都需要遵循相同的步骤。\n\
  \n### 1. 调用 `BorderFactory` 的静态方法来创建边框。你可以从以下样式中选择（参见图 9.16）：\n\n- 凹斜槽（Lowered bevel）\n\
  - 凸斜槽（Raised bevel）\n- 刻蚀（Etched）\n- 线条（Line）\n- 哑光（Matte）\n- 空白（Empty，仅在组件周围留出一些空间）\n\
  \n![Image](img/image0109.jpeg)\n\n图 9.16. 测试边框类型\n\n### 2. 如果需要，可以通过将边框传递给 `BorderFactory.createTitledBorder`\
  \ 为你的边框添加标题。\n\n### 3. 如果你想做得彻底，可以调用 `BorderFactory.createCompoundBorder` 组合多个边框。\n\
  \n### 4. 通过调用 `JComponent` 类的 `setBorder` 方法将生成的边框添加到你的组件中。\n\n例如，这里是是如何向面板添加带有标题的刻蚀边框的：\n\
  \n点击此处查看代码图像\n\n```\nBorder etched = BorderFactory.createEtchedBorder();\nBorder\
  \ titled = BorderFactory.createTitledBorder(etched, \"A Title\");\npanel.setBorder(titled);\n\
  ```\n\n在代码列表 9.5 中运行程序，以了解各种边框的样子。\n\n不同的边框具有设置边框宽度和颜色的不同选项；详情请参见 API 注释。真正的边框爱好者会发现，还有一个\
  \ `SoftBevelBorder` 类用于具有软化边角的斜槽边框，并且 `LineBorder` 也可以具有圆角。你只能通过使用这些类的构造函数来构造这些边框——它们没有对应的\
  \ `BorderFactory` 方法。\n\n代码列表 9.5. border/BorderFrame.java\n\n点击此处查看代码图像\n\n```java\n\
  package border;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\
  import javax.swing.border.*;\n\n/**\n * 一个带有单选按钮的框架，用于选择边框样式。\n */\npublic class\
  \ BorderFrame extends JFrame\n{\n    private JPanel demoPanel;\n    private JPanel\
  \ buttonPanel;\n    private ButtonGroup group;\n\n    public BorderFrame()\n   \
  \ {\n        demoPanel = new JPanel();\n        buttonPanel = new JPanel();\n  \
  \      group = new ButtonGroup();\n\n        addRadioButton(\"Lowered bevel\", BorderFactory.createLoweredBevelBorder());\n\
  \        addRadioButton(\"Raised bevel\", BorderFactory.createRaisedBevelBorder());\n\
  \        addRadioButton(\"Etched\", BorderFactory.createEtchedBorder());\n     \
  \   addRadioButton(\"Line\", BorderFactory.createLineBorder(Color.BLUE));\n    \
  \    addRadioButton(\"Matte\", BorderFactory.createMatteBorder(10, 10, 10, 10, Color.BLUE));\n\
  \        addRadioButton(\"Empty\", BorderFactory.createEmptyBorder());\n\n     \
  \   Border etched = BorderFactory.createEtchedBorder();\n        Border titled =\
  \ BorderFactory.createTitledBorder(etched, \"Border types\");\n        buttonPanel.setBorder(titled);\n\
  \n        setLayout(new GridLayout(2, 1));\n        add(buttonPanel);\n        add(demoPanel);\n\
  \        pack();\n    }\n\n    public void addRadioButton(String buttonName, Border\
  \ b)\n    {\n        JRadioButton button = new JRadioButton(buttonName);\n     \
  \   button.addActionListener(new ActionListener()\n        {\n            public\
  \ void actionPerformed(ActionEvent event)\n            {\n                demoPanel.setBorder(b);\n\
  \            }\n        });\n        group.add(button);\n        buttonPanel.add(button);\n\
  \    }\n}\n```\n\n### API 详情\n\n**javax.swing.BorderFactory`\n- `static Border LineBorder(Color\
  \ color)`\n- `static Border LineBorder(Color color, int thickness)` 创建一个简单的线条边框。\n\
  - `static Border MatteBorder(int top, int left, int bottom, int right, Color color)`\n\
  - `static Border MatteBorder(int top, int left, int bottom, int right, Icon tileIcon)`\
  \ 创建一个填充了颜色或重复图标的厚边框。\n- `static Border EmptyBorder()`\n- `static Border EmptyBorder(int\
  \ top, int left, int bottom, int right)` 创建一个空边框。\n- `static Border EtchedBorder()`\n\
  - `static Border EtchedBorder(Color highlight, Color shadow)`\n- `static Border\
  \ EtchedBorder(int type)`\n- `static Border EtchedBorder(int type, Color highlight,\
  \ Color shadow)` 创建一个具有 3D 效果的线条边框。\n- `static Border BevelBorder(int type)`\n-\
  \ `static Border BevelBorder(int type, Color highlight, Color shadow)`\n- `static\
  \ Border LoweredBevelBorder()`\n- `static Border RaisedBevelBorder()` 创建一个具有凹或凸表面效果的边框。\n\
  - `static TitledBorder createTitledBorder(String title)`\n- `static TitledBorder\
  \ createTitledBorder(Border border)`\n- `static TitledBorder createTitledBorder(Border\
  \ border, String title)`\n- `static TitledBorder createTitledBorder(Border border,\
  \ String title, int justification, int position)`\n- `static TitledBorder createTitledBorder(Border\
  \ border, String title, int justification, position, Font font)`\n- `static TitledBorder\
  \ createTitledBorder(Border border, String title, int justification, position, Font\
  \ font, Color color)` 创建具有指定属性的标题边框。\n- `static CompoundBorder createCompoundBorder(Border\
  \ outsideBorder, Border insideBorder)` 将两个边框组合为一个新边框。\n\n**javax.swing.border.SoftBevelBorder`**\n\
  - `SoftBevelBorder(int type)`\n- `SoftBevelBorder(int type, Color highlight, Color\
  \ shadow)` 创建具有软化边角的斜槽边框。\n\n**javax.swing.border.LineBorder`**\n- `public LineBorder(Color\
  \ color, int thickness, boolean roundedCorners)` 使用给定的颜色和厚度创建一个线条边框。如果 `roundedCorners`\
  \ 为 `true`，则边框具有圆角。\n\n**javax.swing.JComponent`**\n- `void setBorder(Border border)`\
  \ 设置此组件的边框。\n\n#### 9.4.4. 组合框 (Combo Boxes)\n\n如果你有很多备备选项，单选按钮不是很好的选择，因为它们占用了太多屏幕空间。相反，你可以使用组合框。当用户点击此组件时，会出现一个选项列表，用户可以选择其中一个（参见图\
  \ 9.17）。\n\n![Image](img/image1103.jpeg)\n\n图 9.17. 组合框\n\n如果下拉列表框被设置为可编辑（editable），你就可以像编辑文本字段一样编辑当前选择。正因如此，该组件被称为`组合框`——它结合了文本字段的灵活性和预定义的选项。`JComboBox`\
  \ 类提供了组合框组件。\n\n从 Java SE 7 开始，`JComboBox` 类是一个泛型类。例如，`JComboBox<String>` 持 `String`\
  \ 类型的对象，而 `JComboBox<Integer>` 持整数。\n\n调用 `setEditable` 方法使组合框变为可编辑。注意，编辑只会影响选中的项目。它不会以任何方式更改选项列表。\n\
  \n\n\n\n你可以通过调用 `getSelectedItem` 方法获取当前选中项，如果组合框是可编辑的，该项可能已经被修改过。然而，对于可编辑的组合框，该项可以是任何类型，取决于接收用户编辑并将结果转换为对象的编辑器。（关于编辑器的讨论，请参阅第二卷第\
  \ 6 章。）如果你的组合框不可编辑的那么最好是调用\n\n```\ncombo.getItemAt(combo.getSelectedIndex())\n```\n\
  \n这将为你提供具有正确类型的选中项。\n\n在示例程序中，用户可以从样式列表（`Serif`、`SansSerif`、`Monospaced` 等）中选择字体样式。用户也可以输入另一种字体。\n\
  \n使用 `addItem` 方法添加选项。在我们的程序中，`addItem` 只在构造函数中调用，但你可以随时调用它。\n\n点击此处查看代码图像\n\n```\n\
  JComboBox<String> faceCombo = new JComboBox<>();\n\nfaceCombo.addItem(\"Serif\"\
  );\n\nfaceCombo.addItem(\"SansSerif\");\n\n. . .\n```\n\n此方法将字符串添加到列表的末尾。你可以使用 `insertItemAt`\
  \ 方法在列表的任何位置添加新项：\n\n```\nfaceCombo.insertItemAt(\"Monospaced\", 0); // 添加到开头\n\
  ```\n\n你可以添加任何类型的项——组合框会调用每个项的 `toString` 方法来显示它。\n\n如果你需要在运行时删除项，请使用 `removeItem`\
  \ 或 `removeItemAt` 方法，取决于你提供的是要删除的项目还是它的位置。\n\n点击此处查看代码图像\n\n```\nfaceCombo.removeItem(\"\
  Monospaced\");\n\nfaceCombo.removeItemAt(0); // 移除第一个项\n```\n\n`removeAllItems`\
  \ 方法一次性移除所有项。\n\n***\n\n![Image](img/image00949.jpeg) 提示\n\n如果你需要向组合框添加大量项，`addItem`\
  \ 方法的性能会很差。相反，构造一个 `DefaultComboBoxModel`，通过调用 `addElement` 填充它，然后调用 `JComboBox`\
  \ 类的 `setModel` 方法。\n\n***\n\n当用户从组合框中选择一个项时，组合框会产生一个动作事件。要确定选择了哪个项，可以在事件参数上调用 `getSource`\
  \ 以获取发送事件的组合框的引用。然后调用 `getSelectedItem` 方法检索当前选中的项。你需要将返回的值强制转换为适当的类型，通常是 `String`。\n\
  \n点击此处查看代码图像\n\n```\npublic void actionPerformed(ActionEvent event)\n{\n   label.setFont(new\
  \ Font(\n      faceCombo.getItemAt(faceCombo.setSelectedIndex()),\n      Font.PLAIN,\n\
  \      DEFAULT_SIZE));\n}\n```\n\nListing 9.6 显示了完整的程序。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n如果你想显示一个永久显示的列表而不是下拉列表，请使用 `JList` 组件。我们在第二卷的第 6 章中涵盖了 `JList`。\n\n***\n\
  \nListing 9.6. `comboBox/ComboBoxFrame.java`\n\n点击此处查看代码图像\n\n***\n\n```java\n1\
  \   package comboBox;\n2\n3   import java.awt.*;\n4   import java.awt.event.*;\n\
  5   import javax.swing.*;\n6\n7   /**\n8    * 一个带有示例文本标签和用于选择字面的组合框的框架。\n9    */\n\
  10  public class ComboBoxFrame extends JFrame\n11  {\n12      private JComboBox<String>\
  \ faceCombo;\n13      private JLabel label;\n14      private static final int DEFAULT_SIZE\
  \ = 24;\n15\n16      public ComboBoxFrame()\n17      {\n18          // 添加示例文本标签\n\
  19          label = new JLabel(\"The quick brown fox jumps over the lazy dog.\"\
  );\n20          label.setFont(new Font(\"Serif\", Font.PLAIN, DEFAULT_SIZE));\n\
  21          add(label, BorderLayout.CENTER);\n22\n23          // 创建组合框并添加字体名称\n\
  24          faceCombo = new JComboBox<>();\n25          faceCombo.addItem(\"Serif\"\
  );\n26          faceCombo.addItem(\"SansSerif\");\n27          faceCombo.addItem(\"\
  Monospaced\");\n28          faceCombo.addItem(\"Dialog\");\n29          faceCombo.addItem(\"\
  DialogInput\");\n30\n31          // 组合框监听器将标签字体更改为选中的字体\n32          faceCombo.addActionListener(new\
  \ ActionListener()\n33              {\n34                  public void actionPerformed(ActionEvent\
  \ event)\n35                  {\n36                      label.setFont(new Font(\n\
