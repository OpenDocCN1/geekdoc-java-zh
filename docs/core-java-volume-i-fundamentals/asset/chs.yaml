  现在你可以使用我们已经描述过的任何 `Scanner` 方法从文件中读取内容。\n\n要写入文件，请构造 `PrintWriter` 对象。在构造函数中，只需提供文件名即可：\n\
  \n```java\nPrintWriter out = new PrintWriter(\"myfile.txt\");\n```\n\n如果文件不存在，则会创建。你可以像打印到\
  \ `System.out` 时一样使用 `print`、`println` 和 `printf` 命令。\n\n***\n\n![Image](img/image00950.jpeg)\
  \ 注意事项\n\n你可以使用字符串参数构造 `Scanner`，但扫描器会将该字符串视为数据而非文件名。例如，如果你调用\n\n```java\nScanner\
  \ in = new Scanner(\"myfile.txt\"); // 错误\n```\n\n那么扫描器将看到十个字符数据：`'m'`、`'y'`、`'f'`\
  \ 等。这可能不是这种情况下的预期。\n\n***\n\n***\n\n![Image](img/image00948.jpeg) 注意事项\n\n当你指定相对文件名时，例如\
  \ `\"\"myfile.txt\"`、`\"mydirectory/myfile.txt\"` 或 `\"\"../myfile.txt\"`，文件是相对于启动\
  \ Java 虚拟机的目录的。如果你从命令行 shell 执行程序，通过执行\n\n```bash\njava MyProg\n```\n\n那么起始目录就是命令行\
  \ shell 的当前目录。然而，如果你使用集成开发环境（IDE），则起始目录由 IDE 控制。你可以通过此调用找到目录位置：\n\n```java\nString\
  \ dir = System.getProperty(\"user.dir\");\n```\n\n如果在查找文件时遇到困难，请考虑使用绝对路径名称，例如 `\"\
  c:\\\\mydirectory\\\\myfile.txt\"` 或 `\"/home/me/mydirectory/myfile.txt\"`。\n\n\
  ***\n\n正如你所看到的，访问文件就像使用 `System.in` 和 `System.out` 一样简单。但有一个陷阱：如果你使用一个不存在的文件构造 `Scanner`，或使用一个无法创建的文件名构造\
  \ `PrintWriter`，就会发生异常。Java 编译器认为这些异常比“除以零”异常更严重，例如。在第 11 章中，你将学习处理异常的各种方法。现在，你只需告诉编译器你已经意识到可能发生“输入/输出”异常。你通过在给\
  \ `main` 方法上标记 `throws` 子句来实现，如下所示：\n\n点击此处查看代码图片\n\n```java\npublic static void\
