  \ String getDescription()\n18   {\n19      return \"a student majoring in \" + major;\n\
  20    }\n21 }\n```\n\n* *\n\n#### 5.1.7. 保护访问\n\n如你所知，Java 类中的字段最好标记为`private`，而方法通常标记为`public`。任何标记为`private`的特征对其他类可见。对于子类也是如此：子类无法访问父类的私有字段。\n\
  \n然而，有时你希望将方法限制为子类，或者较少地允许子类访问父类字段。在这种情况下，我们将类特征声明为`protected`。例如，如果父类 `Employee`\
  \ 将 `hireDay` 字段声明为 `protected`，那么 `Manager` 方法就可以直接访问。\n\n但是 `Manager` 类只能访问 `Manager`\
  \ 对象的 `hireDay` 字段，而不是其他 `Employee` 对象。在实践中，请谨慎使用保护字段。假设你的类被其他程序员使用，而你在设计时使用了保护字段。在不知情的情况下，其他程序员继承你的类并开始访问这些保护字段。在这种情况下，你无法在不影响其他程序员的情况下更改类的实现。这违背了鼓励数据封装的\
  \ OOP 精神。\n\n保护方法更有意义。一个类可以将难以使用的方法声明为 `protected`，这表示子类（它们通常很熟悉祖先）可以被信任正确地使用该方法，而其他类则不能。\n\
  \n此类方法的很好的例子是 `Object` 类的 `clone` 方法——请参阅第 6 章了解更多详情。\n\n***\n\n事实上，Java 中的保护特征对所有子类可见，同时也对同一包中的所有其他类可见。这与\
  \ C++ 中保护的含义略有不同，使得 Java 中的 `protected` 概念比 C++ 更不安全。\n\n***\n\n以下是 Java 中控制可见性的种访问修饰符总结：\n\
  \n**1.** 仅对类可见（`private`）。\n\n**2.** 全球可见（`public`）。\n\n**3.** 对包和所有子类可见（`protected`）。\n\
  \n**4.** 对包可见——（不幸的）默认值。不需要修饰符。\n\n### 5.2. Object：宇宙父类\n\n\n\n\n\n`Object` 类是终极祖先——Java\
  \ 中的所有类都继承自 `Object`。然而，你永远不需要写出\n\n```java\nclass Employee extends Object\n```\n\
  \n如果没有显式地指定父类，则终极父类 `Object` 会被认为是理所当然的。由于 Java 中的每个类都继承 `Object`，因此熟悉 `Object`\
  \ 类提供的服务是非常重要的。我们将在本章介绍基础方法；对于未涵盖的内容，请参阅后面的章节或查看在线文档。（`Object` 的某些方法只有在处理线程时才会出现——有关线程的更多信息请参见第\
  \ 14 章。）\n\n你可以使用 `Object` 变量来引用任何类型的对象：\n\n```java\nObject obj = new Employee(\"\
  Harry Hacker\", 35000);\n```\n\n当然，`Object` 类型的变量只有作为任意值的通用容器时才有用。要对该值进行任何特定操作，你需要对原始类型有所了解，并应用类型转换：\n\
  \n```java\nEmployee e = (Employee) obj;\n```\n\n在 Java 中，只有基本类型（数字、字符和 `boolean`\
  \ 值）不是对象。\n\n所有的数组类型，无论是对象数组还是基本类型数组，都是继承自 `Object` 类的类型。\n\n```java\nEmployee[]\
  \ staff = new Employee[10];\nobj = staff; // OK\nobj = new int[10]; // OK\n```\n\
  \n***\n\n![Image](img/image00951.jpeg) C++ 注意\n\n在 C++ 中，没有宇宙根类。然而，每个指针都可以转换为 `void*`\
  \ 指针。\n\n***\n\n### 5.2.1 equals 方法\n\n`Object` 类中的 `equals` 方法测试一个对象是否被认为与另一个相等。`Object`\
  \ 类中实现的 `equals` 方法判断两个对象引用是否相同。这是一个非常合理的默认值——如果两个对象是相同的，它们理应当是相等的。对于许多类来说，不需要其他操作。例如，比较两个\
  \ `PrintStream` 对象的相等性并没有意义。但是，你通常希望实现基于状态的相等性测试，当两个对象具有相同状态时，它们被认为是相等的。\n\n例如，让我们认为如果两个员工具有相同的姓名、薪和入职日期，那么他们就是相等的。（在实际的员工数据库中，比较\
  \ ID 可能会更合理。我们使用这个示例来演示实现 `equals` 方法的机制。）\n\n点击此处代码图像\n\n```java\nclass Employee\n\
  {\n    . .\n    public boolean equals(Object otherObject)\n    {\n        // 快速测试对象是否相同\n\
  \        if (this == otherObject) return true;\n        // 如果显式参数为 null，必须返回 false\n\
  \        if (otherObject == null) return false;\n        // 如果类不匹配，则它们不相等\n    \
  \    if (getClass() != otherObject.getClass())\n            return false;\n    \
  \    // 现在我们知道 otherObject 是一个非空的 Employee\n        Employee other = (Employee)\
  \ otherObject;\n        // 测试字段是否具有相同的值\n        return name.equals(other.name)\n\
  \            && salary == other.salary\n            && hireDay.equals(other.hireDay);\n\
  \    }\n}\n```\n\n`getClass` 方法返回对象的类——我们将在本章稍后讨论这个方法。在我们的测试中，两个对象只有在属于同一个类时才是相等的。\n\
  \n***\n\n![Image](img/image00949.jpeg) 提示\n\n为了防止 `name` 或 `hireDay` 为 `null` 的可能，请使用\
  \ `Objects.equals` 方法。调用 `Objects.equals(a, b)` 在两个参数均为 `null` 时返回 `true`，如果仅一个为\
  \ `null` 则返回 `false`，否则调用 `a.equals(b)`。使用该方法，`Employee.equals` 方法的最后语句变为：\n\n```java\n\
  return Objects.equals(name, other.name)\n    && salary == other.salary\n    && Objects.equals(hireDay,\
  \ other.hireDay);\n```\n\n***\n\n当你为子类定义 `equals` 方法时，先调用父类调用 `equals`。如果该测试没有通过，那么这些对象就不相等。如果父类字段相等，那么你就可以比较子类的实例字段了。\n\
  \n点击此处代码图像\n\n```java\nclass Manager extends Employee\n{\n    . .\n    public boolean\
  \ equals(Object otherObject)\n    {\n        if (!super.equals(otherObject)) return\
  \ false;\n        // super.equals 检查了此和 otherObject 是否属于同一个类\n        Manager other\
  \ = (Manager) otherObject;\n        return bonus == other.bonus;\n    }\n}\n```\n\
  \n### 5.2.2 相等测试与继承\n\n如果隐式和显式参数不属于同一个类，`equals` 方法应该如何表现？这直一直是存在争议的领域。在上一个示例中，如果类不匹配，`equals`\
  \ 方法返回 `false`。但许多程序员转而使用 `instanceof` 测试：\n\n```java\nif (!(otherObject instanceof\
  \ Employee)) return false;\n```\n\n这留下了 `otherObject` 可能属于子类的可能性。然而，这种方法可能会让你遇到麻烦。以下是原因。Java\
  \ 语言规范要求 `equals` 方法具有以下属性：\n\n1. **自反射性**：对于任何非空引用 `x`，`x.equals(x)` 应返回 `true`。\n\
  2. **对称性**：对于任何引用 `x` 和 `y`，当且仅当 `y.equals(x)` 返回 `true` 时，`x.equals(y)` 返回 `true`。\n\
  3. **传递性**：对于任何引用 `x`、`y` 和 `z`，如果 `x.equals(y)` 返回 `true` 且 `y.equals(z)` 返回 `true`，则\
  \ `x.equals(z)` 应返回 `true`。\n4. **一致性**：如果 `x` 和 `y` 所引的对象没有改变，则重复调用 `x.equals(y)`\
  \ 返回相同的值。\n5. **非空性**：对于任何非空引用 `x`，`x.equals(null)` 应返回 `false`。\n\n这些规则是非常合理的。在数据结构中定位元素时，你不想思考调用\
  \ `x.equals(y)` 还是 `y.equals(x)`。\n\n然而，当参数属于不同的类时，对称规则会有微妙的影响。考虑调用 `e.equals(m)`，其中\
  \ `e` 是 `Employee` 对象，而 `m` 是 `Manager` 对象，它们恰好具有相同的姓名、薪水和入职日期。如果 `Employee.equals`\
  \ 使用 `instanceof` 测试，则调用返回 `true`。但这意味着反向调用 `m.equals(e)` 也需要返回 `true`——对称规则不允许它返回\
  \ `false` 或抛出异常。\n\n这让 `Manager` 类陷入了困境。它的 `equals` 方法必须准备好与任何 `Employee` 进行比较，而不考虑特有的信息！突然之间，`instanceof`\
  \ 测试看起来没那么有吸引力了。\n\n有些作者认为 `getClass` 测试是错误的，因为它违反了替换原则。一个经常被引用的例子是 `AbstractSet`\
  \ 类中的 `equals` 方法，它测试两个集合是否具有相同的元素。`AbstractSet` 类有两个子类 `TreeSet` 和 `HashSet`，它们使用不同的算法来定位元素。你真的希望能够比较任何集合，无论它们是如何实现的。\n\
  \n然而，集合的例子相当特殊。将 `AbstractSet.equals` 声明为 `final` 将是有意义的，因为不应该重新定义集合相等的语义。（该方法实际上并不是\
  \ `final`。这允许子类实现更高效的相等测试算法。）\n\n在我们看来，存在两种不同的场景：\n\n• 如果子类可以有自己的相等性定义，那么对称性迫使你使用\
  \ `getClass` 测试。\n\n• 如果相等性定义在父类中是固定的，那么你可以使用 `instanceof` 测试，并允许不同子类的对象彼此相等。\n\n\
  \n\n在员工和经理的示例中，我们认为当两个对象具有匹配的字段时它们是相等的。如果我们有两个 `Manager` 对象的姓名、薪水和入职日期相同，但奖金不同，我们希望它们被视为不同的。因此，我们使用了\
  \ `getClass` 测试。\n\n但假设我们使用员工 ID 进行等性测试。这种等性概念对于所有子类都是合理的。那么我们就可以使用 `instanceof`\
  \ 测试，并且我们应该将 `Employee.equals` 声明为 `final`。\n\n* * *\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n标准 Java 库包含了 150 多种 `equals` 方法的实现，这些实现混杂了：使用 `instanceof`、调用 `getClass`、捕获\
  \ `ClassCastException` 或者什么都不做。查看 `java.sql.Timestamp` 类的 API 文档，实现者在其中有些尴尬地指出，他们让自己陷入了困境。`Timestamp`\
  \ 类继承自 `java.util.Date`，后者的 `equals` 方法使用了 `instanceof` 测试，而无法重写 `equals` 以使其同时满足对称性和准确性。\n\
  \n* * *\n\n这里是编写完美的 `equals` 方法的配方：\n\n**1.** 将显式参数命名为 `otherObject`——稍后，你将其将其转换为另一个名为\
  \ `other` 的变量。\n\n**2.** 测试 `this` 是否恰好与 `otherObject` 相同：\n\n```\nif (this == otherObject)\
  \ return true;\n```\n\n这条语句仅仅是一种优化。在实践中，这是一种常见情况。检查标识性比比较字段要便宜得多。\n\n**3.** 测试 `otherObject`\
  \ 是否为 `null`，如果是则返回 `false`。这个测试是必须的。\n\n```\nif (otherObject == null) return false;\n\
  ```\n\n**4.** 比较 `this` 和 `otherObject` 的类。如果 `equals` 的语义在子类中发生变化，使用 `getClass`\
  \ 测试：\n\n```\nif (getClass() != otherObject.getClass()) return false;\n```\n\n如果所有子类都保持相同的语义，你可以使用\
  \ `instanceof` 测试：\n\n```\n\n (!(otherObject instanceof ClassName)) return false;\n\
  ```\n\n**5.** 将 `otherObject` 转换为你的类类型的变量：\n\n```\nClassName other = (ClassName)\
  \ otherObject\n```\n\n**6.** 现在根据你的等性定义来比较字段。对于原始类型字段使用 `==`，对于对象字段使用 `Objects.equals`。如果所有字段匹配则返回\
  \ `true`，否则返回 `false`。\n\n```\nreturn field1 == other.field1\n    && Objects.equals(field2,\
  \ other.field2)\n    && . . .;\n```\n\n如果你在子类中重定义了 `equals`，请包含对 `super.equals(other)`\
  \ 的调用。\n\n* * *\n\n![Image](img/image00949.jpeg) 提示\n\n如果你有数组类型的字段，可以使用静态方法 `Arrays.equals`\
  \ 来检查对应的数组元素是否相等。\n\n* * *\n\n* * *\n\n![Image](img/image00950.jpeg) 注意\n\n这是实现\
  \ `equals` 方法时的一个常见错误。你能发现问题所在吗？\n\n点击此处查看代码图片\n\n```java\npublic class Employee\n\
  \n{\n    public boolean equals(Employee other)\n    {\n      return Objects.equals(name,\
  \ other.name)\n          && salary == other.salary\n          && Objects.equals(hireDay,\
  \ other.hireDay);\n    }\n    . . .\n}\n```\n\n此方法将显式参数类型声明为 `Employee`。结果，它没有重写\
  \ `Object` 类的 `equals` 方法，而是定义了一个完全无关的方法。\n\n你可以通过对意图重写父类方法的标记标记 `@Override` 来防止此类错误：\n\
  \n```java\n@Override public boolean equals(Object other)\n```\n\n如果你犯了错误并正在定义一个新方法，编译器会报告错误。例如，假设你在\
  \ `Employee` 类中添加了以下声明：\n\n```java\n@Override public boolean equals(Employee other)\n\
  ```\n\n将会报告错误，因为此方法没有重写来自 `Object` 父类的任何方法。\n\n* * *\n\n* * *\n\njava.util.Arrays\
  \ **1.2**\n\n• `static boolean equals(type[] a, type[] b)` **5.0**\n\n如果数组长度相等且对应位置的元素相等，则返回\
  \ `true`。数组的组件类型可以是 `Object`、`int`、`long`、`short`、`char`、`byte`、`boolean`、`float`\
  \ 或 `double`。\n\n* * *\n\n* * *\n\njava.util.Objects **7**\n\n• `static boolean\
  \ equals(Object a, Object b)`\n\n如果 `a` 和 `b` 都为 `null`则返回 `true`；如果只有一个为 `null`则返回\
  \ `false`；否则返回 `a.equals(b)`。\n\n* * *\n\n#### 5.2.3. hashCode 方法\n\n哈希码是从对象派生的整数。哈希码应该是随机的——如果\
  \ `x` 和 `y` 是两个不同的对象，那么有很大概率 `x.hashCode()` 和 `y.hashCode()` 是不同的。\n\n\n\n\n返回此对象的哈希值。哈希值可以是任何整数，正数或负数。相等的对象需要返回相同的哈希值。\n\
  \n### java.lang.Objects 7\n\n* `static int hash(Object... objects)`\n返回一个由所有提供的对象的哈希值组合成的哈希值。\n\
  \n* `static int hashCode(Object a)`\n如果 `a` 为 `null`则返回 `0`，否则返回 `a.hashCode()`。\n\
  \n### java.util.Arrays 1.2\n\n* `static int hashCode(type[] a)` 5.0\n计算数组 `a` 的哈希值，其组件类型可以是\
  \ `Object`、`int`、`long`、`short`、`char`、`byte`、`boolean`、`float` 或 `double`。\n\n\
  ### 5.2.4 toString 方法\n\n`Object` 中的另一个重要方法是 `toString`，它返回表示该对象值的字符串。这是一个典型的示例。`Point`\
  \ 类的 `toString` 方法返回如下所示字符串：\n\n```\njava.awt.Point[x=10,y=20]\n```\n\n大多数（但并非所有）`toString`\
  \ 方法都遵循这种格式：类名，后面跟着方括号括内的字段值。以下是 `Employee` 类的 `toString` 方法的实现：\n\n```java\npublic\
  \ String toString()\n{\n   return \"Employee[name=\" + name\n      + \",salary=\"\
  \ + salary\n      + \",hireDay=\" + hireDay\n      + \"]\";\n}\n```\n\n实际上，你可以做得更好。与其在\
  \ `toString` 方法中硬编码类名，不如调用 `getClass().getName()` 来获取一个包含类名的字符串。\n\n```java\npublic\
  \ String toString()\n{\n   return getClass().getName()\n      + \"[name=\" + name\n\
  \      + \",salary=\" + salary\n      + \",hireDay=\" + hireDay\n      + \"]\";\n\
  }\n```\n\n此类 `toString` 方法对子类也同样有效。\n\n当然，子类的程序员应该定义其 get 自己的 `toString` 方法并添加子类的字段。如果父类使用了\
  \ `getClass().getName()`，那么子类可以简单地调用 `super.toString()`。例如，这里是 `Manager` 类的 `toString`\
  \ 方法：\n\n```java\nclass Manager extends Employee\n{\n   . . .\n   public String\
  \ toString()\n   {\n      return super.toString()\n         + \"[bonus=\" + bonus\n\
  \         + \"]\";\n   }\n}\n```\n\n现在，`Manager` 对象被打印为 `Manager[name=...,salary=...,hireDay=...][bonus=...]`。\n\
  \n`toString` 方法无处不在是因为一个重要的原因：每当使用 `+` 运算符将对象与字符串拼接时，Java 编译器会自动调用 `toString` 方法来获取对象的字符串表示。例如：\n\
  \n```java\nPoint p = new Point(10, 20);\nString message = \"The current position\
  \ is \" + p;\n// 自动调用 p.toString()\n```\n\n提示：与其编写 `x.toString()`，你也可以写 `\"\" +\
  \ x`。该语句将空字符串与 `x` 的字符串表示拼接，这正等同于 `x.toString()`。与 `toString` 不同，即使 `x` 是基本类型，该语句也同样有效。\n\
  \n如果 `x` 是任何对象且你调用\n`System.out.println(x);`\n那么 `println` 方法简单地调用 `x.toString()`\
  \ 并打印生成的字符串。\n\n`Object` 类定义了 `toString` 方法来打印类名和对象的哈希值。例如，调用\n`System.out.println(System.out)`\n\
  产生的输出看起来如下所示：\n\n```\njava.io.PrintStream@2f6684\n```\n\n原因是 `PrintStream` 类的实现者没有费力重写\
  \ `toString` 方法。\n\n注意：令人恼的是，数组从 `Object` 继承了 `toString` 方法，额外的问题是数组类型是以一种过时的格式打印的。例如，\n\
  \n```java\nint[] luckyNumbers = { 2, 3, 5, 7, 11, 13 };\nString s = \"\" + luckyNumbers;\n\
  ```\n\n产生字符串 `\"[I@1a46e30\"`（前缀 `[I` 表示整数数组）。解决办法是调用静态的 `Arrays.toString` 方法。代码\n\
  ```java\nString s = Arrays.toString(luckyNumbers);\n```\n产生字符串 `\"[2, 3, 5, 7, 11,\
  \ 13]\"`。要正确打印多维数组（即数组的数组），请使用 `Arrays.deepToString`。\n\n`toString` 方法是日志记录的一个很好的工具。标准库中的许多类定义了\
  \ `toString` 方法，以便你可以获取有关对象状态有用信息。这在记录如下消息时特别有用：\n`System.out.println(\"Current\
  \ position = \" + position);`\n正如我们在第 1 章中解释的，更好的解决方案是使用 `Logger` 类的对象并调用 `Logger.global.info(\"\
  Current position = \" + position);`。\n\n提示：我们强烈建议为你编写的每个类添加一个 `toString` 方法。你以及使用你类的其他程序员都会感谢这种日志支持。\n\
