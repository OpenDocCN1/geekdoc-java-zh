  显示一个对话框，其中确认按钮标记为“打开”、“保存”或字符串 `approveButtonText`。返回 `APPROVE_OPTION`、`CANCEL_OPTION`（如果用户选择了取消或关闭了对话框）或\
  \ `ERROR_OPTION`（如果发生错误）。\n\n-   `File getSelectedFile()`\n-   `File[] getSelectedFiles()`\n\
  \n获取用户选择的文件或文件（如果用户未选择任何文件，则返回 `null`）。\n\n-   `void setFileFilter(FileFilter filter)`\n\
  \n设置文件对话框的文件掩码。所有 `filter.accept` 返回 `true` 的文件都将将被显示。同时，将该过滤器添加到可选过滤器的列表中。\n\n\
  -   `void addChoosableFileFilter(FileFilter filter)`\n\n将文件过滤器添加到可选过滤器的列表中。\n\n\
  -   `void setAcceptAllFileFilterUsed(boolean b)`\n\n在过滤器组合框中包含或抑制“所有文件”过滤器。\n\n\
  -   `void resetChoosableFileFilters()`\n\n清除可选过滤器的列表。除非被显式抑制，否则只保留“所有文件”过滤器。\n\n\
  -   `void setFileView(FileView view)`\n\n设置文件视图，以提供关于文件选择器显示的文件的信息。\n\n-   `void\
  \ setAccessory(JComponent component)`\n\n设置一个辅助组件。\n\n***\n\n### javax.swing.filechooser.FileFilter\
  \ **1.2**\n\n-   `boolean accept(File f)`\n\n如果文件选择器应该显示此文件，则返回 `true`。\n\n-   `String\
  \ getDescription()`\n\n返回此文件过滤器的描述，例如 `\"Image files (*.gif,*.jpeg)\"`。\n\n***\n\
  \n### javax.swing.filechooser.FileNameExtensionFilter **6**\n\n-   `FileNameExtensionFilter(String\
  \ description, String ... extensions)`\n\n构造一个具有给定描述的文件过滤器，它接受所有目录以及所有名称以点后接给定的扩展名字符串结尾的文件。\n\
  \n***\n\n### javax.swing.filechooser.FileView **1.2**\n\n-   `String getName(File\
  \ f)`\n\n返回文件 `f` 的名称，或返回 `null`。通常情况下，此方法简单返回 `f.getName()`。\n\n-   `String getDescription(File\
  \ f)`\n\n返回文件 `f` 的人类可读描述，或返回 `null`。例如，如果 `f` 是 HTML 文档，此方法可能会返回它的标题。\n\n-   `String\
  \ getTypeDescription(File f)`\n\n返回文件 `f` 类型的人类可读描述，或返回 `null`。例如，如果 `f` 是 HTML\
  \ 文档，此方法可能会返回字符串 `\"Hypertext document\"`。\n\n-   `Icon getIcon(File f)`\n\n返回文件\
  \ `f` 的图标，或返回 `null`。例如，如果 `f` 是 JPEG 文件，此方法可能会返回缩略图图标。\n\n-   `Boolean isTraversable(File\
  \ f)`\n\n如果 `f` 是用户可以打开的目录，则返回 `Boolean.TRUE`。如果目录在概念上是一个复合文档，此方法可能会返回 `Boolean.FALSE`。与所有\
  \ `FileView` 方法一样，此方法可以返回 `null`，表示文件选择器应该咨询默认视图。\n\n***\n\n#### 9.7.5 颜色选择器\n\n\
  正如你在前一节中所示的，高质量的文件选择器是一个复杂的用户界面组件，你绝对不想自己去实现它。许多用户界面工具包提供了其他常用的对话框：用于选择日期/时间、货币值、字体、颜色等。这样做的好处是双倍的：程序员可以直接使用高质量的实现，而不是从头开发一套，而用户可以在这些组件中获得一致的体验。\n\
  \n到此时，Swing 仅提供了一个额外的选择器，即 `JColorChooser`（参见图 9.42 到 9.44）。使用它让用户选择颜色值。与 `JFileChooser`\
  \ 类一样，颜色选择器是一个组件而不是对话框，但它包含了方便的方法来创建包含颜色选择器组件的对话框。\n\n![Image](img/image01159.jpeg)\n\
  图 9.42. 颜色选择器的色块面板\n\n![Image](img/image01160.jpeg)\n图 9.43. 颜色选择器的 HSB 面板\n\n![Image](img/image01161.jpeg)\n\
  图 9.44. 颜色选择器的 RGB 面板\n\n以下是如何显示带有颜色选择器的模态对话框：\n\n```java\nColor selectedColor =\
  \ JColorChooser.showDialog(parent,title, initialColor);\n```\n\n或者，你可以显示一个非模态颜色选择器对话框。提供以下内容：\n\
  \n- 一个父组件\n- 对话框标题\n- 选择模态或非模态对话框的标记\n- 颜色选择器\n- 用于创建包含颜色选择器组件的对话框的方便方法\n\n（注：由于输入文本中存在大量重复的段落，译文已根据“不要重复输出原文”的原则对逻辑部分进行了清理和翻译）。\n\
  \n\n\n\n```java\n/**\n * 此监听器弹出一个模态颜色选择器\n */\nprivate class ModalListener implements\
  \ ActionListener\n{\n    public void actionPerformed(ActionEvent event)\n    {\n\
  \        Color defaultColor = getBackground();\n        Color selected = JColorChooser.showDialog(ColorChooserPanel.this,\
  \ \"Set background\",\n            defaultColor);\n        if (selected != null)\
  \ setBackground(selected);\n    }\n}\n```\n\n/**\n * 此监听器弹出一个非模态颜色选择器。当用户点击 OK 按钮时，面板颜色会改变。\n\
  \ */\nprivate class ModelessListener implements ActionListener\n{\n    private JDialog\
  \ dialog;\n    private JColorChooser chooser;\n\n    public ModelessListener()\n\
  \    {\n        chooser = new JColorChooser();\n        dialog = JColorChooser.createDialog(ColorChooserPanel.this,\
  \ \"Background Color\",\n            false /* 非模态 */, chooser,\n            new\
  \ ActionListener() // OK 按钮监听器\n                {\n                    public void\
  \ actionPerformed(ActionEvent event)\n                    {\n                  \
  \      setBackground(chooser.getColor());\n                    }\n             \
  \   }, null /* 无取消 按钮监听器 */);\n    }\n\n    public void actionPerformed(ActionEvent\
  \ event)\n    {\n        chooser.setColor(getBackground());\n        dialog.setVisible(true);\n\
  \    }\n}\n```\n\n/**\n * 此监听器弹出一个非模态颜色选择器。当用户选择新颜色时，\n * 面板颜色会立即改变。\n */\nprivate\
  \ class ImmediateListener implements ActionListener\n{\n    private JDialog dialog;\n\
  \    private JColorChooser chooser;\n\n    public ImmediateListener()\n    {\n \
  \       chooser = new JColorChooser();\n        chooser.getSelectionModel().addChangeListener(new\
  \ ChangeListener()\n            {\n                public void stateChanged(ChangeEvent\
  \ event)\n                {\n                    setBackground(chooser.getColor());\n\
  \                }\n            });\n        dialog = new JDialog((Frame) null,\
  \ false /* 非模态 */);\n        dialog.add(chooser);\n        dialog.pack();\n    }\n\
  \n    public void actionPerformed(ActionEvent event)\n    {\n        chooser.setColor(getBackground());\n\
  \        dialog.setVisible(true);\n    }\n}\n```\n\n`javax.swing.JColorChooser`\
  \ 1.2\n\n- `JColorChooser()` 构建一个初始颜色为白色的颜色选择器。\n- `Color getColor()` / `void setColor(Color\
  \ c)` 获取并设置此颜色选择器的当前颜色。\n- `static Color showDialog(Component parent, String title,\
  \ Color initialColor)` 显示一个包含颜色选择器的模态对话框。\n![Image](img/image0162.jpeg)\n- `static\
  \ JDialog createDialog(Component parent, String title, boolean modal, JColorChooser\
  \ chooser, ActionListener okListener, ActionListener cancelListener)` 创建一个包含颜色选择器的对话框。\n\
  ![Image](img/image0163.jpeg)\n\n我们对用户界面组件的讨论到此结束。第 7 到第 9 章的内容向你展示了如何在 Swing 中实现简单的\
  \ GUI。请参阅第二卷以获取更高级的 Swing 组件和复杂的图形技术。\n\n## 第 10 节 部署应用程序和 Applet\n\n本章包含：\n- JAR\
  \ 文件\n- Java Web Start\n- Applets\n- 应用程序偏好的存储\n\n此时，你应该已经熟练掌握了 Java 编程语言的大部分功能，并且对\
  \ Java 基础编程有了相当深入的介绍。现在你已经准备好为用户创建应用程序了，你会想要如何将它们打包以便部署到用户的计算机上。传统的部署选择——这在 Java\
  \ 出生的最初几年中引发了难以置信的狂热——是使用 `applets`。Applet 是一种特殊的 Java 程序，支持 Java 的浏览器可以从 Internet\
  \ 下载并运行它。人们曾希望用户可以从安装软件的烦恼中解放出来，并且从任何连接 Internet 的支持 Java 的计算机或设备访问他们的软件。\n\n由于许多原因，applets\
  \ 从未完全达到这些预期。因此，我们将从打包应用程序的说明开始本章。然后我们转向 `Java Web Start` 机制——一种基于 Internet 的应用程序交付的替代方法。最后，我们将介绍\
  \ applets，并展示在什么情况下仍然想要使用它们。\n\n### 1. JAR 文件\n\n当你打包应用程序时，你希望给用户提供单个文件。Java 归档（JAR）文件正是为此目的而设计的。JAR\
  \ 文件可以包含类文件和其他类型。此外，JAR 文件是使用熟悉的 ZIP 格式进行压缩的。\n\n![Image](img/image0049.jpeg)\n\n\
  ZIP 格式的替代方案是“pack200”方案，它专门针对更高效地压缩类文件进行了调整。\n\n使用 `jar` 工具来制作 JAR 文件。（在默认 JDK 安装中，它位于\
  \ `/bin` 目录。）创建新 JAR 文件最常用的命令使用以下语法：\n\n`jar cvf JARFileName File1 File2`\n\n例如：\n\
  `jar cvf CalculatorClasses.jar *.class icon.gif`\n\n通常情况下，`jar` 命令具有以下格式：\n\n`jar\
  \ options File1 File2 . . .`\n\n表 10.1 列出了 `jar` 程序的所有选项。它们与 UNIX `tar` 命令的选项相似的。\n\
  \n**表 10.1 `jar` 程序选项**\n\n你可以将应用程序、程序组件（有时称为“beans”）和代码库打包成 JAR 文件。例如，JDK 的运行时库就包含在一个大文件\
  \ `rt.jar` 中。\n\n#### 1.1 清单文件 (Manifest)\n\n除了类文件、图像和其他资源外，每个 JAR 文件还包含一个*manifest*（清单），用于描述归档的特殊特性。\n\
  \n清单文件名为 `MANIFEST.MF`，位于 JAR 文件中特殊的 `META-INF` 子目录。。最合法的清单非常枯燥——只有\n\n`Manifest-Version:\
  \ 1.0`\n\n复杂的清单可以有更多的条目。清单条目分成部分。清单中的第一个部分被称为*主部分*。它适用于整个 JAR 文件。随后的条目可以指定命名实体（如单个文件、包或\
  \ URL）的属性。这些条目必须以 `Name` 条目开始。部分与部分用空行分隔。例如：\n\n`Manifest-Version: 1.0`\n*描述此归档的行*\n\
  \n`Name: Woozle.class`\n*描述此文件的行*\n\n`Name: com/mycompany/mypkg/`\n*描述此包的行*\n\n\
  要编辑清单，将你想添加到清单的行放置在一个文本文件中。然后运行：\n\n`jar cfm JARFileName ManifestFileName . . .`\n\
  \n\n\n\n\n```bash\njar cfm MyArchive.jar manifest.mf com/mycompany/mypkg/*.class\n\
  ```\n\n要更新现有 JAR 文件的清单（manifest），请将添加的内容放入文本文件中，并使用如下命令：\n\n```bash\njar ufm MyArchive.jar\
  \ manifest-additions.mf\n```\n\n***\n\n![Image](img/image00948.jpeg) 释\n\n关于 JAR\
  \ 和清单文件格式的更多信息，请参 [`docs.oracle.com/javase/7/docs/notes/guides/jar`](http://docs.oracle.com/javase/7/docs/notes/guides/jar)。\n\
  \n***\n\n### 10.1.2. 可执行的 JAR 文件\n\n你可以使用 `jar` 命令的 `e` 选项来指定程序的入口——即你通常在调用 `java`\
  \ 程序启动器时所指定的类：\n\n```bash\njar cvfe MyProgram.jar com.mycompany.mypkg.MainAppClass\
  \ files to add\n```\n\n或者，你也可以在清单中指定程序的类类，包括如下形式的语句：\n\n`Main-Class: com.mycompany.mypkg.MainAppClass`\n\
  \n不要为主类名添加 `.class` 扩展名。\n\n***\n\n![Image](img/image00950.jpeg) 警告\n\n清单的最后一行必须以换行符结束。否则，清单将无法被正确读取。产生仅包含\
  \ `Main-Class` 行而没有行终止符的文本文件是一个常见错误。\n\n***\n\n使用上述哪种方法，用户都可以简单地如下启动程序：\n\n```bash\n\
  java -jar MyProgram.jar\n```\n\n取决于操作系统的配置，用户甚至可以通过双击 JAR 文件图标来启动应用程序。\n\n- 在 Windows\
  \ 上，Java 运行时安装程序为 `.jar` 扩展名创建文件关联，使用 `javaw -jar` 命令启动该文件。（与 `java` 命令不同，`javaw`\
  \ 命令不会打开命令行窗口。）\n- 在 Solaris 上，操作系统识别 JAR 文件的“魔数”，并使用 `java -jar` 命令启动它。\n- 在 Mac\
  \ OS X 上，操作系统识别 `.jar` 文件扩展名，并在你双击 JAR 文件时执行该 Java 程序。\n\n然而，JAR 文件中的 Java 程序的体验与原生应用程序不同。在\
  \ Windows 上，你可以使用第三方封装器工具将 JAR 文件转换为 Windows 可执行文件。封装器是一个具有熟悉的 `.exe` 扩展名的 Windows\
  \ 程序，它用于定位并启动 Java 虚拟机 (JVM)，或者在未找到 JVM 时告知用户如何操作。有很多商业和开源产品，例如 JSmooth ([`jsmooth.sourceforge.net`](http://jsmooth.source-forge.net))\
  \ 和 Launch4J ([`launch4j.sourceforge.net`](http://launch4j.sourceforge.net))。开源安装程序生成器\
  \ IzPack ([`izpack.org`](http://izpack.org)) 也包含一个原生启动器。关于此主题的更多信息，请参见 [www.javalobby.org/articles/java2exe](http://www.javalobby.org/articles/java2exe)。\n\
  \n在 Macintosh 上，情况稍微简单一些。作为 Xcode 一的 Jar Bundler 工具可以让你将 JAR 文件转换为一个标准的 Mac 应用程序。\n\
  \n### 10.1.3. 资源\n\n在 applet 和应用程序中使用的类通常具有关联的数据文件，例如：\n\n- 图像和声音文件；\n- 带有消息字符串和按钮标签的文本文件；或\n\
  - 带有二进制数据的文件，例如用于描述地图布局的文件。\n\n在 Java 中，这种关联文件被称为资源（resource）。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 释\n\n在 Windows 中，“资源”一词具有更专门的含义。Windows 资源也包括图像、按钮标签等，但它们是附接到可执行文件中并并通过标准的编程接口访问的。相比之下，Java\
  \ 资源被存储为独立的文件，而不是类文件的一部分。访问和解释资源数据由每个程序自行决定。\n\n***\n\n例如，考虑一个名为 `AboutPanel` 的类，它显示一条如图\
  \ 10.1 所示的消息。\n\n![Image](img/image01165.jpeg)\n\n图 10.1. 从 JAR 文件显示资源\n\n当然，面板中的书名和版权年份将在书的下一版本中更改。为了方便跟踪这一变化，我们将文本放在一个文件中，而不是将其硬编码为字符串。\n\
  \n但是，你应该将像 `about.txt` 这样的文件放在哪里呢？当然，如果将其简单放在 JAR 文件内部的其余程序文件一起将是很方便的。\n\n类加载器知道如何搜索类文件，直到在类路径、归档文件或网络服务器上找到它们。资源机制为非类文件提供了同样的便利性。以下是必要的步骤：\n\
  \n**1.** 获取拥有该资源的类的的 `Class` 对象——例如，`AboutPanel.class`。\n\n**2.** 如果资源是图像或音频文件，调用\
  \ `getResource(filename)` 获取 URL 格式的资源位置。然后使用 `getImage` 或 `getAudioClip` 方法读取它。\n\
  **3.** 对于图像或音频文件以外的资源，使用 `getResourceAsStream`。\n\n\n\n\n\n```java\nimport javax.swing.*;\n\
  \n/**\n * @version 1.4 2007-04-30\n * @author Cay Horstmann\n */\npublic class ResourceTest\n\
  {\n    public static void main(String[] args)\n    {\n        EventQueue.invokeLater(new\
  \ Runnable()\n        {\n            public void run()\n            {\n        \
  \        JFrame frame = new ResourceTestFrame();\n                frame.setTitle(\"\
  ResourceTest\");\n                frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \                frame.setVisible(true);\n            }\n        });\n    }\n}\n\
  \n/**\n * A frame that loads image and text resources.\n */\nclass ResourceTestFrame\
  \ extends JFrame\n{\n    private static final int DEFAULT_WIDTH = 300;\n    private\
  \ static final int DEFAULT_HEIGHT = 300;\n\n    public ResourceTestFrame()\n   \
  \ {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n        URL aboutURL = getClass().getResource(\"\
  about.gif\");\n        Image img = new ImageIcon(aboutURL).getImage();\n       \
  \ setIconImage(img);\n\n        JTextArea textArea = new JTextArea();\n        InputStream\
  \ stream = getClass().getResourceAsStream(\"about.txt\");\n        Scanner in =\
  \ new Scanner(stream);\n        while (in.hasNext())\n            textArea.append(in.nextLine()\
  \ + \"\\n\");\n        add(textArea);\n    }\n}\n```\n\n`java.lang.Class` 1.0\n\n\
  - `URL getResource(String name)` 1.1\n- `InputStream getResourceAsStream(String\
  \ name)` 1.1\n\n在与类相同的位置查找资源，并返回一个可以用于加载资源的 URL 或输入流。如果未找到资源，则返回 `null`，因此不会对 I/O\
  \ 错误抛出异常。\n\n### 10.1.4. 密封（Sealing）\n\n我们在第 4 章 中提到过，你可以密封 Java 语言包，以确保没有后续类可以将其添加到其中。如果你在代码中使用了包可见（package-visible）的类、方法和字段，你可能希望密封该包。如果不进行密封，其他类可以将自己放在同一个包中，从而获得对其包可见特征的访问权限。\n\
  \n例如，如果你密封了包 `com.mycompany.util`，那么密封存档之外的任何类都无法通过以下语句定义：\n\n```\npackage com.mycompany.util;\n\
  ```\n\n要实现这一点，请将包中的所有类放入一个 JAR 文件中。默认情况下，JAR 文件中的包是不密封的。你可以通过在清单（manifest）的主部分添加\
  \ `Sealed: true` 行来更改此全局默认。对于每个单独的包，你可以通过向 JAR 文件添加另一个部分来指定是否要密封该包，如下：\n\n```\n\
  Name: com/mycompany/util/\nSealed: true\nName: com/mycompany/misc/\nSealed: false\n\
  ```\n\n要密封一个包，请创建一个带有清单的文本文件。然后按照通常的方式运行 `jar` 命令：\n```\njar cvfm MyArchive.jar\
  \ manifest.mf\n```\n\n### 10.2. Java Web Start\n\nJava Web Start 是一种通过互联网交付应用程序的技术。Java\
  \ Web Start 应用程序具有以下特点：\n\n- 它们通常通过浏览器交付。一旦下载了 Web Start 应用程序，就可以不使用浏览器的情况下启动。\n\
  - 它们并不存在于浏览器窗口内。应用程序显示在自己的框架中，位于浏览器之外。\n- 它们不使用浏览器的 Java 实现。每当浏览器加载 Web Start 描述符时，它只需启动一个外部应用程序。这与启动\
  \ Acrobat 或 RealAudio 等其他辅助应用程序使用的机制相同。\n- 数字签名的应用程序可以在本地机器上获得任意权限。未签名的应用程序运行在“沙箱”中，禁止执行危险的操作。\n\
  \n为了准备通过 Java Web Start 交付应用程序，请将其封装在一个或多个 JAR 文件中。然后，以 Java 网络协议（JNLP）格式准备描述符文件。将这些文件放在\
  \ Web 服务器上。你还需要确保你的 Web 服务器对扩展名为 `.jnlp` 的文件报告 `application/x-java-jnlp-file` MIME\
  \ 类型。浏览器使用 MIME 类型来决定启动哪个辅助程序。\n\n要尝试 Java Web Start，请从 [`jakarta.apache.org/tomcat`](http://jakarta.apache.org/tomcat)\
  \ 安装 Tomcat。Tomcat 是 servlet 和 JSP 页面的容器，但它也提供网页服务。它预配置为为 JNLP 文件提供正确的 MIME 类型。\n\
  \n让我们尝试使用 Java Web Start 交付第 9 章中的计算器应用程序。遵循以下步骤：\n\n1. 编译程序。\n```\njavac -classpath\
  \ .:/path/to/javaws.jar webstart/*.java\n```\n2. 使用命令生成 JAR 文件：\n```\njar cvfe Calculator.jar\
  \ webstart/*.class\n```\n3. 准备包含以下内容的启动文件 `Calculator.jnlp`：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<jnlp spec=\"1.0+\" codebase=\"http://localhost:8080/calculator/\"\
  \ href=\"Calculator.jnlp\">\n  <information>\n    <title>Calculator Demo Application</title>\n\
  \    <vendor>Cay S. Horstmann</vendor>\n    <description>A Calculator</description>\n\
  \    <offline-allowed/>\n  </information>\n  <resources>\n    <java version=\"1.6.0\"\
  />\n    <jar href=\"Calculator.jar\"/>\n  </resources>\n  <application-desc/>\n\
  </jnlp>\n```\n（注意，版本号必须是 `1.6.0`，而不是 `6.0`。启动文件的格式非常直观。要需完整的规范，请参阅 [www.oracle.com/technetwork/java/javase/javawebstart/index.html](http://www.oracle.com/technetwork/java/javase/javawebstart/index.html）。）\n\
  \n4. 如果你使用 Tomcat，创建一个目录 `tomcat/webapps/calculator`，其中 `tomcat` 是你 Tomcat 安装的基础目录。创建一个子目录\
  \ `tomcat/webapps/calculator/WEB-INF`，并在 `WEB-INF` 子目录内放置以下最小的 `web.xml` 文件：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<web-app version=\"2.5\" xmlns=\"\
  http://java.sun.com/xml/ns/j2ee\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n  xsi:schemaLocation=\"http://java.sun.com/xml/ns/j2ee\n    http://java.sun.com/xml/ns/j2ee/web-app_2_5.xsd\"\
  >\n</web-app>\n```\n\n5. 将 JAR 文件和启动文件放在 Web 服务器上，使 URL 与 JNLP 文件中的 `codebase` 条目匹配。如果你使用\
  \ Tomcat，请将它们放入 `tomcat/webapps/calculator` 目录。\n6. 确保你的浏览器已配置 Java Web Start，检查\
  \ `application/x-java-jnlp-file` MIME 类型是否关联到 `javaws` 应用程序。如果你安装了 JDK，该配置将自动完成。\n\
  7. 启动 Tomcat。\n8. 将浏览器指向 JNLP 文件。例如，如果你使用 Tomcat，访问 `http://localhost:8080/calculator/Calculator.jnlp`。\n\
  9. 你应该看到 Java Web Start 的启动窗口（见图 10.2](#part0016_xhtml_ch10fig02)）。\n10. 很快计算器就会出现，并带有边界标记其为\
  \ Java 应用程序（见图 10.3](#part0016_xhtml_ch10fig03)）。\n11. 当再次访问 JNLP 文件时，应用程序将从缓存中检索。你可以通过\
  \ Java 插件面板查看缓存内容（见图 10.4](#part0016_xhtml_ch10fig04)。在 Windows 上，在 Windows 控制面板内查找\
  \ Java 插件控制。在 Linux 下，运行 `jdk/jre/bin/ControlPanel`。\n\n\n\n\n\n![Image](img/image00949.jpeg)\
  \ 提示\n\n如果你在测试 JNLP 配置时不想运行 Web 服务器，可以通过运行以下命令临时覆盖启动文件中的 `codebase` URL：\n\n```\n\
  javaws -codebase file://programDirectory JNLPfile\n```\n\n例如，在 UNIX 中，你可以直接在包含 JNLP\
  \ 文件的目录下执行此命令：\n\n```\njavaws -codebase file://`pwd` Calculator.jnlp\n```\n\n***\n\
  \n当然，你不会希望用户在每次再次运行你的应用程序时都去启动缓存查看器。你可以让安装程序提供安装桌面和菜单快捷方式的功能。将这些行添加到 JNLP 文件中：\n\
  \n```xml\n<shortcut>\n    <desktop/>\n    <menu submenu=\"Accessories\"/>\n</shortcut>\n\
  ```\n\n当用户第一次下载应用程序时，会显示“桌面集成警告”（参见图 10.5）。\n\n![Image](img/image01169.jpeg)\n\n\
  图 10.5. 桌面集成警告\n\n你还应该为菜单快捷方式和启动屏幕提供图标。Oracle 建议提供 32 × 32 和 64 × 64 的图标。将图标文件放置在\
  \ Web 服务器上，与 JNLP 和 JAR 文件放在一起。将这些行添加到 JNLP 文件的 `information` 部分：\n\n点击此处查看代码图像\n\
  \n```xml\n<icon href=\"calc_icon32.png\" width=\"32\" height=\"32\" />\n<icon href=\"\
  calc_icon64.png\" width=\"64\" height=\"64\" />\n```\n\n注意，这些图标与应用程序图标无关。如果你想让应用程序拥有图标，你需要在\
  \ JAR 文件中添加单独的图标图像，并在帧类上调用 `setIconImage` 方法。（示例请参见列表 10.1。）\n\n#### 10.2.1 沙箱机制\n\
  \n每当代码从远程站点加载并在本地执行时，安全性就变得至关重要。点击单个链接即可启动 Java Web Start 应用程序。访问网页会自动启动该页面上的所有\
  \ applet。如果点击链接或访问网页就能在用户的计算机上安装任意代码，犯罪分子就能轻松地窃取机密信息、访问财务数据或接管用户的机器发送垃圾邮件。\n\n为了确保\
  \ Java 技术不被用于恶意目的，Java 拥有一套复杂的安全模型，我们将在第二卷中详细讨论。`security manager`（安全管理器）会检查对所有系统资源的访问情况。默认情况下，它只允许那些无害的操作。要允许额外的操作，代码必须经过数字签名，并且用户必须批准该签名证书。\n\
  \n远程代码在所有平台上*可以*做什么？显示图像、播放声音、获取用户的按键输入和鼠标点击，并将用户输入发送回代码加载的主机，这些都是安全的。这些功能对于展示事实和数据或获取用户输入以订单已经足够了。受限制的执行环境通常被称为“沙箱”。在沙箱中运行的代码无法更改用户的系统或对其进行监视。\n\
  \n特别是，沙箱中的程序具有以下限制：\n\n- 它们*永远无法*运行任何本地可执行程序。\n- 它们不能从本地计算机的文件系统读取或写入内容。\n- 它们无法获取有关本地计算机的任何信息，除了使用的\
  \ Java 版本和一些无害的操作系统细节外。特别是，沙箱中的代码无法获取用户的姓名、电子邮件地址等。\n- 远程加载的程序需要用户同意才能与下载它们的服务器以外的任何主机进行通信；该服务器被称为*源主机*（originating\
  \ host）。这条规则通常被称为“远程代码只能向家汇报”。该规则保护用户免受可能尝试监视内网资源的代码的影响。\n- 所有弹出窗口都带有警告消息。此消息是一项安全功能，确保用户不会将窗口误认为是本地应用程序。人们担心，毫无防备的用户可能会访问网页，被骗运行远程代码，然后输入密码或信用卡号，这些信息可能会被发送回\
  \ Web 服务器。在 JDK 的早期版本中，该消息看起来非常不详详：“不可信任的 Java Applet 窗口”。随后的每个版本都稍微淡化了警告：“未经验证的\
  \ Java Applet 窗口”，然后是“警告：Java Applet 窗口”。现在它只是一个微小的警告三角形，只有最敏锐的用户才会注意到。\n\n### 10.2.2\
  \ 签名代码\n\n沙箱限制对于许多情况来说过于严格了。例如，在公司内部网中，你完全可以想象 Web Start 应用程序或 applet 想要访问本地文件。可以非常详细地控制授予特定应用程序的权限；我们将在第二卷的第\
  \ 9 章中讨论这些。当然，应用程序可以简单地请求拥有桌面应用程序的所有权限，许多 Java Web Start 应用程序正是这样做。这是通过向 JNLP 文件添加以下标签实现的：\n\
  \n```xml\n<security>\n    <all-permissions/>\n</security>\n```\n\n要在沙箱外运行，Java Web\
  \ Start 应用程序的 JAR 文件必须经过*数字签名*。签过名的 JAR 文件带有一个证书，指示了签名者的身份。加密技术确保了此类证书不会被伪造，并且任何篡改它的尝试都会被发现。\n\
  \n例如，假设你收到了由 yWorks 制作并进行数字签名的应用程序，该程序使用 Thawte 发的证书（参见图 10.6）。当你收到该应用程序时，你将确认以下内容：\n\
  \n- 代码与签名时的状态完全一致；没有第三方篡改过它。\n- 签名确实来自 yWorks。\n- 证书确实是由 Thawte 颁发的（Java Web Start\
  \ 知道如何检查证书。）\n\n![Image](img/image1170.jpeg)\n\n图 10.6. 安全证书\n\n遗憾的是，这就是你所知道的全部。你并不知道代码本身是安全的。事实上，如果你点击“更多信息”链接，会被告知该应用程序将在没有\
  \ Java 正常提供的限制的情况下运行。你是否应该安装并运行该应用程序？这真的取决于你对 yWorks 的信任程度。\n\n从受支持的供应商处获取证书每年需要数百美元。许多开发者简单地生成自己的证书并用于代码签名。当然，Java\
  \ Web Start 并没有办法检查这些证书的准确性。当你收到这样的应用程序时，你只知道：\n\n- 代码与签名时的状态完全一致；没有其他方篡改过。\n- 有人对代码进行了签名，但\
  \ Java Web Start 无法验证那是谁。\n\n这是毫无意义的；任何人都可以篡改代码然后签名，并声称是作者。尽管如此，Java Web Start 仍然乐意向你展示证书以供你批准（参见图\
  \ 10.7）。从理论上讲，可以通过其他方式验证证书，但很少有用户具备那样的技术知识。\n\n![Image](img/image0171.jpeg)\n\n\
  图 10.7. 不安全的证书\n\n当然，每天都有很多人从互联网下载并运行应用程序。如果你发现用户信任你的应用程序和你的 Web 基础设施，尽管使用自签名证书。（详情请参见[`docs.oracle.com/javase/6/docs/technotes/guides/javaws/developersguide/development.html`](http://docs.oracle.com/javase/6/docs/technotes/guides/javaws/developersguide/development.html)。）如果不是，请给用户带来安全保障，并留在沙箱内。通过\
  \ JNLP API（我们将在下一节中讨论），你仍然允许你的程序在用户批准的情况下选择性地访问资源。\n\n\n\n\nJNLP API 允许未签名的应用程序在沙箱中运行，同时以安全的方式访问本地资源。例如，提供了用于加载和保存文件的服务。应用程序无法查看文件系统，也无法指定文件名。相反，会弹出一个文件对话框，由用户来选择文件。但在文件对话框弹出之前，用户会收到警告并必须同意后继续（参见\
  \ 图 10.8）。此外，API 实际上并没有赋予程序访问 `File` 对象的权限。特别是，应用程序没有方法找到文件位置。因此，程序员被提供了实现“打开文件”和“保存文件”操作的工具，但尽可能多的系统信息对不可信任的应用程序是隐藏的。\n\
  \n![Image](img/image0117.jpeg)\n\n图 10.8. Java Web Start 安全公告\n\n该 API 提供以下服务：\n\
  \n* 加载和保存文件\n* 访问剪贴板\n* 打印\n* 下载文件\n* 在默认浏览器中显示文档\n* 存储和检索持久化配置信息\n* 确保应用程序只有一个实例在执行\n\
  \n***\n\n要访问服务，请使用 `ServiceManager`，如下：\n\n```java\nFileSaveService service = (FileSaveService)\
  \ ServiceManager.lookup(\"javax.jnlp.FileSaveService\");\n```\n\n如果服务可用，此调用将抛出 `UnavailableServiceException`。\n\
  \n***\n\n![Image](img/image0094.jpeg) 注意\n\n如果你想编译使用 JNLP API 的程序，必须在类路径中包含 `javaws.jar`\
  \ 文件。该文件位于 JDK 的 `jre/lib` 子目录下。\n\n***\n\n我们现在讨论最有有用的 JNLP 服务。要保存文件，请为文件对话框提供初始路径名和文件扩展名的建议、要保存的数据以及一个建议的文件名。例如：\n\
  \n```java\nservice.saveFileDialog(\".\", new String[] { \"txt\" }, data, \"calc.txt\"\
  );\n```\n\n数据必须通过 `InputStream` 传递。这安排起来可能有些棘手。第 586 页第 Listing 10.2 中的程序使用了以下策略：\n\
  \n1. 它创建了一个 `ByteArrayOutputStream` 来保存要保存的字节。\n2. 它创建了一个 `PrintStream`，将其数据发送到\
  \ `ByteArrayOutputStream`。\n3. 它将要保存的信息打印到 `PrintStream`。\n4. 它创建了一个 `ByteArrayInputStream`\
  \ 来读取保存的字节。\n5. 它将该流传递给 `saveFileDialog` 方法。\n\n你将在第二卷第 1 章学习更多关于流的知识。现在，你可以忽略示例程序中的细节。\n\
  \n要从文件中读取数据，请使用 `FileOpenService`。它的 `openFileDialog` 接收文件对话框的初始路径名和文件扩展名的建议，并返回一个\
  \ `FileContents` 对象。然后你可以调用 `getInputStream` 和 `getOutputStream` 方法来读写文件数据。如果用户没有选择文件，`openFileDialog`\
  \ 方法将返回 `null`。\n\n点击此处查看代码图像\n\n```java\nFileOpenService service = (FileOpenService)\
  \ ServiceManager.lookup(\"javax.jnlp.FileOpenService\");\n\nFileContents contents\
  \ = service.openFileDialog(\".\", new String[] { \"txt\" });\n\nif (contents !=\
  \ null)\n{\n    InputStream in = contents.getInputStream();\n    . . .\n}\n```\n\
  \n注意，你的应用程序并文件的名称或位置。相反，如果你想打开特定文件，请使用 `ExtendedService`：\n\n点击此处查看代码图像\n\n```java\n\
  ExtendedService service = (ExtendedService) ServiceManager.lookup(\"javax.jnlp.ExtendedService\"\
  );\nFileContents contents = service.openFile(new File(\"c:\\\\autoexec.bat\"));\n\
  \nif (contents != null)\n{\n    OutputStream out = contents.getOutputStream();\n\
  \    // . .\n}\n```\n\n你程序的用户必须同意访问文件（参见 图 10.9）。\n\n![Image](img/image01173.jpeg)\n\
  \n图 10.9. 文件访问警告\n\n要在默认浏览器中显示文档，请使用 `BasicService` 接口。注意，某些系统可能没有默认浏览器。\n\n点击此处查看代码图像\n\
  \n```java\nBasicService service = (BasicService) ServiceManager.lookup(\"javax.jnlp.BasicService\"\
  );\nif (service.isWebBrowserSupported())\n    service.showDocument(url);\nelse .\
  \ . .\n```\n\n基础的 `PersistenceService` 允许应用程序存储少量的配置信息，并在应用程序再次运行时检索它。该机制类似于 HTTP\
  \ Cookie。持久化存储使用 URL 作为键。这些 URL 不必指向真实的网络资源。该服务仅将它们作为一种方便的分层次命名方案。对于任何给定的 URL 键，应用程序都可以存储任意的二进制数据。（存储可能会限制数据块的大小。）\n\
  \n为了让应用程序相互隔离，每个应用程序只能使用以其代码库开头的 URL Key（在 JNLP 文件中指定）。例如，如果应用程序从 `http://myserver.com/apps`\
  \ 下载，它只能使用格式如 `http://myserver.com/apps/subkey1/subkey2/...` 的键。尝试访问其他键将失败。\n\n\
  应用程序可以调用 `BasicService` 的 `getCodeBase` 方法来查找其代码库。\n\n使用 `PersistenceService` 的\
  \ `create` 方法创建一个新键。\n\n```java\nURL url = new URL(codeBase, \"mykey\");\nservice.create(url,\
  \ maxSize);\n```\n\n要访问与特定键关联的信息，请调用 `get` 方法。该方法返回一个 `FileContents` 对象，通过它你可以读写键数据。例如：\n\
  \n点击此处查看代码图像\n\n```java\nFileContents contents = service.get(url);\nInputStream\
  \ in = contents.getInputStream();\nOutputStream out = contents.getOutputStream();\n\
  ```\n\n\n\n\n```java\nJMenuItem saveItem = fileMenu.add(\"Save\");\n\nsaveItem.addActionListener(EventHandler.create(ActionListener.class,\
  \ this, \"save\"));\n\npack();\n}\n```\n\n/**\n * 从持久化存储中获取标题，如果没有先前的条目，则询问用户标题。\n\
  \ */\npublic void setTitle()\n{\n    try\n    {\n        String title = null;\n\n\
  \        BasicService basic = (BasicService) ServiceManager.lookup(\"javax.jnlp.BasicService\"\
  );\n        URL codeBase = basic.getCodeBase();\n\n        PersistenceService service\
  \ = (PersistenceService) ServiceManager\n            .lookup(\"javax.jnlp.PersistenceService\"\
  );\n        URL key = new URL(codeBase, \"title\");\n\n        try\n        {\n\
  \            FileContents contents = service.get(key);\n            InputStream\
  \ in = contents.getInputStream();\n            BufferedReader reader = new BufferedReader(new\
  \ InputStreamReader(in));\n            title = reader.readLine();\n        }\n \
  \       catch (FileNotFoundException e)\n        {\n            title = JOptionPane.showInputDialog(\"\
  Please supply a frame title:\");\n            if (title == null) return;\n\n   \
  \         service.create(key, 100);\n            FileContents contents = service.get(key);\n\
  \            OutputStream out = contents.getOutputStream(true);\n            PrintStream\
  \ printOut = new PrintStream(out);\n            printOut.print(title);\n       \
  \ }\n        setTitle(title);\n    }\n    catch (UnavailableServiceException e)\n\
  \    {\n        JOptionPane.showMessageDialog(this, e);\n    }\n    catch (MalformedURLException\
  \ e)\n    {\n        JOptionPane.showMessageDialog(this, e);\n    }\n    catch (IOException\
  \ e)\n    {\n        JOptionPane.showMessageDialog(this, e);\n    }\n}\n\n/**\n\
  \ * 打开一个历史文件并更新显示。\n */\npublic void open()\n{\n    try\n    {\n        FileOpenService\
  \ service = (FileOpenService) ServiceManager\n            .lookup(\"javax.jnlp.FileOpenService\"\
  );\n        FileContents contents = service.openFileDialog(\".\", new String[] {\
  \ \"txt\" });\n\n        JOptionPane.showMessageDialog(this, contents.getName());\n\
  \        if (contents != null)\n        {\n            InputStream in = contents.getInputStream();\n\
  \            BufferedReader reader = new BufferedReader(new InputStreamReader(in));\n\
  \            String line;\n            while ((line = reader.readLine()) != null)\n\
  \            {\n                panel.append(line);\n                panel.append(\"\
  \\n\");\n            }\n        }\n    }\n    catch (UnavailableServiceException\
  \ e)\n    {\n        JOptionPane.showMessageDialog(this, e);\n    }\n    catch (IOException\
  \ e)\n    {\n        JOptionPane.showMessageDialog(this, e);\n    }\n}\n\n/**\n\
  \ * 将计算器历史保存到文件。\n */\npublic void save()\n{\n    try\n    {\n        ByteArrayOutputStream\
  \ out = new ByteArrayOutputStream();\n        PrintStream printOut = new PrintStream(out);\n\
  \        printOut.print(panel.getText());\n        InputStream data = new ByteArrayInputStream(out.toByteArray());\n\
  \        FileSaveService service = (FileSaveService) ServiceManager\n          \
  \  .lookup(\"javax.jnlp.FileSaveService\");\n        service.saveFileDialog(\".\"\
  , new String[] { \"txt\" }, data, \"calc.txt\");\n    }\n    catch (UnavailableServiceException\
  \ e)\n    {\n        JOptionPane.showMessageDialog(this, e);\n    }\n    catch (IOException\
  \ e)\n    {\n        JOptionPane.showMessageDialog(this, e);\n    }\n}\n```\n\n\
  ### `javax.jnlp.ServiceManager`\n* `static String[] getServiceNames()` 返回所有可用服务的名称。\n\
  * `static Object lookup(String name)` 返回具有给定名称的服务。\n\n### `javax.jnlp.BasicService`\n\
  * `URL getCodeBase()` 返回此应用程序的代码基底。\n* `boolean isWebBrowserSupported()` 如果 Web\
  \ Start 环境可以启动网络浏览器，则返回 `true`。\n* `boolean showDocument(URL url)` 尝试在浏览器中显示指定的\
  \ `URL`。如果请求成功，返回 `true`。\n\n### `javax.jnlp.FileContents`\n* `InputStream getInputStream()`\
  \ 返回一个读取文件内容的输入流。\n* `OutputStream getOutputStream(boolean overwrite)` 返回一个用于写入文件的输出流。如果\
  \ `overwrite` 为 `true`，则文件的现有内容将被覆盖。\n* `String getName()` 返回文件名（但不包含完整目录路径）。\n\
  * `boolean canRead()`\n* `boolean canWrite()` 如果底层文件可读或可写，则返回 `true`。\n\n### `javax.jnlp.FileOpenService`\n\
  * `FileContents openFileDialog(String pathHint, String[] extensions)`\n* `FileContents[]\
  \ openMultiFileDialog(String pathHint, String[] extensions)` 显示用户警告和文件选择器。返回用户选择的文件或多个文件的描述符，如果用户没有选择文件，则返回\
  \ `null`。\n\n### `javax.jnlp.FileSaveService`\n* `FileContents saveFileDialog(String\
  \ pathHint, String[] extensions, InputStream data, String nameHint)`\n* `FileContents\
  \ saveAsFileDialog(String pathHint, String[] extensions, FileContents data)` 显示用户警告和文件选择器。写入数据并返回用户选择的文件或多个文件的描述符，如果用户没有选择文件，则返回\
  \ `null`。\n\n### `javax.jnlp.PersistenceService`\n* `long create(URL key, long maxsize)`\
  \ 为指定的键创建持久化存储条目。返回持久化存储允许的大小。\n* `void delete(URL key)` 删除给定的键。\n* `String[] getNames(URL\
  \ url)` 返回所有以给定 `URL` 开头的相对键名。\n* `FileContents get(URL key)` 获取一个描述符，通过它可以修改与键关联的数据。如果不存在键，将抛出\
  \ `FileNotFoundException`。\n\n### 10.3 Applets\n\nApplet 是包含在 HTML 页面中的 Java 程序。HTML\
  \ 页面必须告诉浏览器加载哪些 applet 以及将它们放置在页面的什么位置。正如预期的那样，使用 applet 的标签必须告诉浏览器从哪里获取类文件，以及 applet\
  \ 在网页上的布局方式（大小、位置等）。浏览器随后从互联网（或用户机器上的目录）检索类文件并自动运行 applet。\n\n\n\n\n\n### 10.3.1.\
  \ 一个简单的 Applet\n\n为了遵循传统，让我们写一个作为 applet 的 `NotHelloWorld` 程序。applet 简单来说就是一个扩展了\
  \ `java.applet.Applet` 类的 Java 类。在本书中，我们将使用 Swing 来实现 applet。我们所有的 applet 都将扩展 `JApplet`\
  \ 类，它是 Swing applet 的父类。正如你在图 10.11 所示，`JApplet` 是普通 `Applet` 类的直接子类。\n\n![Image](img/image01175.jpeg)\n\
  \n图 10.11. Applet 继承图\n\n![Image](img/image00948.jpeg) 注意\n\n如果你的 applet 包含 Swing\
  \ 组件，你必须扩展 `JApplet` 类。在普通的 `Applet` 内部的 Swing 组件无法正确绘制。\n\nListing 10.3 显示了“Not\
  \ Hello World”的 applet 版本代码。\n\n注意这与第 7 章中的对应程序有多相似。然而，由于 applet 运行在网页内部，因此不需要指定退出\
  \ applet 的方法。\n\nListing 10.3. applet/NotHelloWorld.java\n\n点击此处查看代码图像\n\n```java\n\
  1  package applet;\n2\n3  import java.awt.*;\n4  import javax.swing.*;\n5\n6  /**\n\
  7   * @version 1.23 2012-05-14\n8   * @author Cay Horstmann\n9   */\n10 public class\
  \ NotHelloWorld extends JApplet\n11 {\n12     public void init()\n13     {\n14 \
  \        EventQueue.invokeLater(new Runnable()\n15             {\n16           \
  \      public void run()\n17                 {\n18                     JLabel label\
  \ = new JLabel(\"Not a Hello, World applet\", SwingConstants.CENTER);\n19      \
  \               add(label);\n20                 }\n21             });\n22     }\n\
  23 }\n```\n\n要执行 applet，请执行两个步骤：\n\n1. **将你的 Java 源文件编译为类文件。**\n2. **创建一个 HTML 文件，告诉浏览器首先加载哪个类文件以及如何调整\
  \ applet 的尺寸。**\n\n以下是文件的内容：\n\n点击此处查看代码图像\n\n```html\n<applet code=\"applet/NotHelloWorld.class\"\
  \ width=\"300\" height=\"300\">\n</applet>\n```\n\n在浏览器中查看 applet 之前，在 JDK 部分的 `applet\
  \ viewer` 程序中测试它是一个好主意。要在我们的示例中使用 `applet viewer`，请在命令行中输入\n\n`appletviewer NotHelloWorldApplet.html`\n\
  \n`applet viewer` 程序的命令行参数是 HTML 文件的名称，而不是类文件。图 10.12 显示了 applet viewer 显示此 applet。\n\
  \n![Image](img/image01176.jpeg)\n\n图 10.12. 在 applet viewer 中查看 applet\n\n![Image](img/image00949.jpeg)\
  \ 提示\n\n你也可以从集成环境内部运行 applet。在 Eclipse 中，从菜单选择 Run -> Run as -> Java Applet。\n\n\
  `applet viewer` 适用于第一阶段的测试，但在某些时刻你需要在浏览器中运行 applet，以便以用户看到的方式看到它们。特别是，`applet viewer`\
  \ 程序只向你显示 applet，而不显示周围的 HTML 文本。如果你的 HTML 文件包含多个 `applet` 标签，`applet viewer` 会弹出多个窗口。\n\
  \n要正确查看 applet，只需将 HTML 文件加载到浏览器中（参见图 10.13）。如果 applet 没有显示，你需要安装 Java 插件。\n\n![Image](img/image01177.jpeg)\n\
  \n图 10.13. 在浏览器中查看 applet\n\n![Image](img/image00949.jpeg) 提示\n\n如果你对 applet 进行了修改并重新编译，你需要重启浏览器以便加载新的类文件。仅仅刷新\
  \ HTML 页面不会加载新代码。这在调试 applet 时很困恼。你可以通过 `Java 控制台` 避免痛苦的浏览器重启。启动控制台并发出 `x` 命令，这会清除类加载器缓存。然后你就可以重新加载\
  \ HTML 页面使用新的 applet 代码。在 Windows 下，在 Windows 控制面板中打开 Java 插件控制。在 Linux 下，运行 `jcontrol`\
  \ 并请求显示 Java 控制台。每当加载 applet 时，控制台就会弹出。\n\n### 10.3.1.1. 将应用程序转换为 applet\n\n将图形化\
  \ Java 应用程序转换为 applet 是很容易的。创建一个嵌入网页的 applet 转换非常简单。以下是具体步骤：\n\n1.  带有 applet 的\
  \ HTML 页面。\n2.  提供 `JApplet` 的子类。\n3.  在 applet 中放置初始化代码。\n4.  让 applet 能够显示。\n\
  5.  在 applet 标签中设置尺寸。\n6.  applet 无法关闭。\n7.  你可以使用 HTML 标签标题。\n8.  调用 `setVisible(true)`。`java.applet.Applet`\
  \ **1.0**\n\n- `void init()` 在 applet 首次加载时调用。在此处放置初始化代码。\n- `void start()` 在用户每次访问包含此\
  \ applet 的网页时调用。激活线程。\n- `void stop()` 在用户离开包含此 applet 的网页时调用。停用线程。\n- `void destroy()`\
  \ 在用户退出浏览器时调用。\n- `void resize(int width, int height)` 请求 applet 调整大小。如果这个方法能在网页上运行将是极好的，但它会干扰浏览器的页面布局机制。\n\
  \n### 10.3.2. applet HTML 标签及其属性\n\n在最基本的形式下，一个 `applet` 标签如下：\n\n```html\n<applet\
  \ code=\"applet/NotHelloWorld.class\" width=\"300\" height=\"100\">\n```\n\n正如你所见，`code`\
  \ 属性给出类文件名并包含 `.class` 扩展名；`width` 和 `height` 属性调整存放 applet 的窗口尺寸。这两个单位都是像素。你还需要一个匹配的\
  \ `</applet>` 标签来标记 applet HTML 标记的结束。<applet>` 和 `</applet>` 标签之间的文本仅在浏览器无法显示 applet\
  \ 时显示。`code`、`width` 和 `height` 属性是必须的。如果缺少任何一个，浏览器都无法加载你的 applet。\n\n所有这些信息通常嵌入在\
  \ HTML 页面中，至少可能如下：\n\n[#part0035_split_014.xhtml_p596pro01a)\n\n```html\n<html>\n\
  \  <head>\n    <title>NotHelloWorldApplet</title>\n  </head>\n  <body>\n    <p>下一行文本在\
  \ Java 的辅助显示：</p>\n    <applet code=\"applet/NotHelloWorld.class\" width=\"100\"\
  \ height=\"100\">\n      如果你的浏览器可以显示 Java，你在这里将看到一个 applet。\n    </applet>\n  </body>\n\
  </html>\n```\n\n你可以在 `applet` 标签内使用以下属性：\n\n- `width`, `height`\n\n\n\n\n\n这些属性是必须的，用于指定\
  \ applet 的宽度和高度，单位为像素。在 applet 访问器中，这是 applet 的初始大小。你可以调整 applet 访问器创建的任何窗口的大小。在浏览器中，你无法调整\
  \ applet 的大小。你需要仔细推测你的 applet 需要多少空间才能在所有用户面前良好地显示。\n\n*   `align`\n\n此属性指定 applet\
  \ 的对齐方式。该属性值与 HTML `img` 标签的 `align` 属性相同。\n\n*   `vspace`, `hspace`\n\n这些可选属性指定了\
  \ applet 上方和下方（`vspace`）以及 applet 左右（`hspace`）的像素数。\n\n*   `code`\n\n此属性提供 applet\
  \ 类文件的。该名称相对于 `codebase`（见下文）或者或者在未指定 `codebase` 的情况下相对于当前页面。\n\n路径名必须与 applet 类的包匹配。例如，如果\
  \ applet 类在 `com.mycompany` 包中，则属性为 `code=\"com/mycompany/MyApplet.class\"`。也允许另一种形式\
  \ `code=\"com.mycompany.MyApplet.class\"`。但你不能在此处使用绝对路径。如果你的类文件位于其他地方，请使用 `codebase`\
  \ 属性。\n\n`code` 属性仅指定包含 applet 类的类的名称。当然，你的 applet 可能包含其他类文件。一旦浏览类器加载了包含 applet\
  \ 的类，它就会意识到需要更多的类文件并加载它们。\n\n必须提供 `code` 或 `object` 属性（见下文）。\n\n*   `codebase`\n\
  \n此可选属性是用于定位类文件的 URL。你可以使用绝对 URL，即使是指向不同服务器的。但最常见的是指向子目录的相对 URL。例如，如果文件布局如下：\n\n\
  ![Image](img/image01178.jpeg)\n\n那么你在 `MyPage.html` 中使用以下标签：\n\n```\n<applet code=\"\
  MyApplet.class\" codebase=\"myApplets\" width=\"100\" height=\"150\">\n```\n\n*\
  \   `archive`\n\n此可选属性列出了包含 applet 类和其他资源的 JAR 文件或多个文件。这些文件在 applet 加载之前会从 Web 服务器获取。这种技术显著加快了加载过程，因为加载一个包含许多较小文件的\
  \ JAR 文件只需要一次 HTTP 请求。JAR 文件之间用逗号分隔。例如：\n\n点击此处查看代码图像\n\n```\n<applet code=\"MyApplet.class\"\
  \n   archive=\"MyClasses.jar,corejava/CoreJavaClasses.jar\"\n   width=\"100\" height=\"\
  150\">\n```\n\n*   `object`\n\n此标签允许你指定包含序列化 applet 对象的文件的名称。（当你把对象的所有实例字段写入文件时，对象就会被序列化。我们在第二卷的第\
  \ 1 章中讨论了序列化。）为了显示 applet，对象将从文件中反序列化以恢复到其之前的状态。当你使用此属性时，`init` 方法不会被调用，但 applet\
  \ 的 `start` 方法会被调用。在序列化 applet 对象之前，你应该调用它的 `stop` 方法。此功能对于实现一个持久的浏览器非常有用，这种浏览器会自动重新加载其\
  \ applet，并使其返回到浏览器关闭时所的状态。这是一个特殊功能，网页设计人员通常不会遇到。\n\n每个 `applet` 标签中必须存在 `code` 或\
  \ `object`。例如：\n\n```\n<applet object=\"MyApplet.ser\" width=\"100\" height=\"150\"\
  >\n```\n\n*   `name`\n\n脚本编写者会想要给 applet 提供一个 `name` 属性，以便在编写时可以使用它引用该 applet。Netscape\
  \ 和 Internet Explorer 都允许通过 JavaScript 调用页面上 applet 的方法。\n\n要从 JavaScript 访问 applet，你必须先给它一个名称。\n\
  \n点击此处查看代码图像\n\n```\n<applet code=\"MyApplet.class\" width=\"100\" height=\"150\"\
  \ name=\"mine\">\n</applet>\n```\n\n你随后可以通过 `document.applets.appletname` 引用该对象。例如：\n\
  \n```\nvar myApplet = document.applets.mine;\n```\n\n通过 Netscape 和 Internet Explorer\
  \ 提供的 Java 与 JavaScript 之间集成的魔法，你可以调用 applet 方法：\n\n```\nmyApplet.init();\n```\n\
  \n当你想让同一页面上的两个 applet 直接相互通信时，`name` 属性也是必重要的。为每个当前的 applet 实例指定名称，并将此字符串传递给 `AppletContext`\
  \ 接口的 `getApplet` 方法。我们将在本章后面讨论这种被称为 applet 间通信的机制。\n\n*   *\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n在 [www.javaworld.com/javatips/jw-javatip80.html](http://www.javaworld.com/javatips/jw-javatip80.html)\
  \ 中，Francis Lu 使用 JavaScript 到 Java 的通信来解决了一个老老的问题：如何调整 applet 的大小使其在所有用户面前良好地显示。\n\
  \n*   *\n\n`alt`\n\nJava 在浏览器中可能被禁用。这是通过 `alt` 属性实现的。\n\n点击此处查看代码图像\n\n```\n<applet\
  \ code=\"MyApplet.class\" width=\"100\" height=\"150\"\n   alt=\"如果浏览器不支持 Java\"\
  >\n```\n\n如果浏览器无法处理 applet，它将忽略 `<applet>` 标签之间的文本。例如：\n\n点击此处查看代码图像\n\n```\n<applet\
  \ code=\"MyApplet.class\" width=\"100\" height=\"150\"\n   alt=\"如果可以显示 Java\">\n\
  ```\n\n#### 10.3.3 object 标签\n\n`object` 标签是 HTML 4.0 的一部分，W3 联盟建议人们使用它代替 `applet`\
  \ 标签。各种定位属性如 `align` 和 `height` 的作用与 `applet` 相同。对于 Java applet，`object` 标签的关键属性是\
  \ `classid`。该属性指定了对象的位置。当然，`object` 标签可以加载不同对象，例如 Java applet、ActiveX 组件或 Java 插件本身。在\
  \ `codetype` 属性中，你可以指定对象的性质。例如，Java applet 的代码类型为 `application/java`。这是一个 `object`\
  \ 标签：\n\n```\n<object\n   codetype=\"application/java\"\n   classid=\"java:MyApplet.class\"\
  \n   width=\"100\" height=\"150\">\n```\n\n注意 `classid` 属性后面可以跟着 `codebase` 属性，其作用与\
  \ `applet` 标签相同。\n\n#### 10.3.4 使用参数向 applet 传递信息\n\n就像应用程序可以使用命令行信息一样，applet 使用嵌入\
  \ HTML 文件中的参数。这是通过名为 `param` 的 HTML 标签以及你定义的属性实现的。例如，假设你想让网页决定 applet 中使用的字体样式。你可以使用以下\
  \ HTML 标签：\n\n点击此处查看代码图像\n\n```\n<applet code=\"FontParamApplet.class\" width=\"\
  200\" height=\"200\">\n   <param name=\"font\" value=\"Helvetica\"/>\n</applet>\n\
  ```\n\n随后你可以使用 `Applet` 类的 `getParameter` 方法来获取参数值：\n\n点击此处查看代码图像\n\n```\npublic\
  \ class FontParamApplet extends JApplet\n{\n    public void init()\n    {\n    \
  \    String fontName = getParameter(\"font\");\n        ...\n    }\n    ...\n}\n\
  ```\n\n\n\n\n你只能在 applet 的 `init` 方法中调用 `getParameter` 方法，而不能在其构造函数中调用。当 applet\
  \ 构造函数执行时，参数尚未准备好。由于大多数复杂的 applet 布局是由参数决定的，我们建议不要为 applet 提供构造函数。只需将所有初始化代码放置在\
  \ `init` 方法中。\n\n参数始终以字符串形式返回。如果需要的是数值类型，你必须将字符串转换为该数值类型。你可以通过标准方法（使用适当的方法，例如 `Integer`\
  \ 类的 `parseInt`）来实现此操作。\n\n例如，如果我们想为字体添加一个 `size` 参数，HTML 代码可能如下：\n\n点击此处查看代码图像\n\
  \n```html\n<applet code=\"FontParamApplet.class\" width=\"200\" height=\"200\">\n\
  \    <param name=\"font\" value=\"Helvetica\"/>\n    <param name=\"size\" value=\"\
  24\"/>\n</applet>\n```\n\n以下源代码显示了如何读取整数参数：\n\n点击此处查看代码图像\n\n```java\npublic class\
  \ FontParamApplet extends JApplet\n{\n    public void init()\n    {\n        String\
  \ fontName = getParameter(\"font\");\n        int fontSize = Integer.parseInt(getParameter(\"\
  size\"));\n        // ...\n    }\n}\n```\n\n![Image](img/image00948.jpeg) 注意\n\n\
  在匹配 `param` 标签中的 `name` 属性值与 `getParameter` 方法的参数值时，使用的是不区分大小写的比较。\n\n除了确保代码中的参数匹配外，你还应该检查是否遗掉了\
  \ `size` 参数。你可以通过一个简单的 `null` 检查来做到这一点。例如：\n\n点击此处查看代码图像\n\n```java\nint fontsize;\n\
  String sizeString = getParameter(\"size\");\nif (sizeString == null) fontSize =\
  \ 12;\nelse fontSize = Integer.parseInt(sizeString);\n```\n\n这是一个广泛使用参数的实用 applet。该\
  \ applet 绘制了一个柱状图，如图图 10.14 所示。\n\n![Image](img/image01179.jpeg)\n\n图 10.14. 图表\
  \ applet\n\n该 applet 从 HTML 文件的 `param` 值中获取标签和柱体的高度。以下是图 10.14HTML 文件的内容：\n\n点击此处查看代码图像\n\
  \n```html\n<applet code=\"Chart.class\" width=\"400\" height=\"300\">\n    <param\
  \ name=\"title\" value=\"Diameters of the Planets\"/>\n    <param name=\"values\"\
  \ value=\"9\"/>\n    <param name=\"name.1\" value=\"Mercury\"/>\n    <param name=\"\
  name.2\" value=\"Venus\"/>\n    <param name=\"name.3\" value=\"Earth\"/>\n    <param\
  \ name=\"name.4\" value=\"Mars\"/>\n    <param name=\"name.5\" value=\"Jupiter\"\
  />\n    <param name=\"name.6\" value=\"Saturn\"/>\n    <param name=\"name.7\" value=\"\
  Uranus\"/>\n    <param name=\"name.8\" value=\"Neptune\"/>\n    <param name=\"name.9\"\
  \ value=\"Pluto\"/>\n    <param name=\"value.1\" value=\"3100\"/>\n    <param name=\"\
  value.2\" value=\"7500\"/>\n    <param name=\"value.3\" value=\"8000\"/>\n    <param\
  \ name=\"value.4\" value=\"4200\"/>\n    <param name=\"value.5\" value=\"88000\"\
  />\n    <param name=\"value.6\" value=\"71000\"/>\n    <param name=\"value.7\" value=\"\
  32000\"/>\n    <param name=\"value.8\" value=\"30600\"/>\n    <param name=\"value.9\"\
  \ value=\"1430\"/>\n</applet>\n```\n\n你可以在 applet 中设置字符串数组和数字数组，但使用参数机制有两个优势。你可以在你的网页上放置多个相同\
  \ applet 的副本，显示不同的图表：只需在页面上放置两个带有不同参数组的 `applet` 标签即可。而且你可以更改想要绘制图表的数据。诚然，行星的直径在一段时间内将保持不变，假设你的网页包含一个每周数据图表。由于它是纯文本，更新网页非常容易。而每周编辑并重新编译\
  \ Java 文件要琐碎得多。事实上，有一些 JavaBeans 组件（beans）可以画出比我们 applet 中更高级的图表。如果你购买了一个，可以将其拖入网页中并向其提供参数，而无需知道\
  \ applet 是如何渲染图表的。代码列表 10.4 是我们 applet 的源代码。注意，`init` 方法读取了...\n\n\n\n\n```java\n\
  double x1 = i * barWidth + 1;\ndouble y1 = top;\ndouble height = values[i] * scale;\n\
  if (values[i] >= 0) y1 += (maxValue - values[i]) * scale;\nelse\n{\n    y1 += maxValue\
  \ * scale;\n    height = -height;\n}\n\n// fill the bar and draw the bar outline\n\
  Rectangle2D rect = new Rectangle2D.Double(x1, y1, barWidth - 2, height);\ng2.setPaint(Color.RED);\n\
  g2.fill(rect);\ng2.setPaint(Color.BLACK);\ng2.draw(rect);\n// draw the centered\
  \ label below the bar\nRectangle2D labelBounds = labelFont.getStringBounds(names[i],\
  \ context);\n\ndouble labelWidth = labelBounds.getWidth();\nx = x1 + (barWidth -\
  \ labelWidth) / 2;\ng2.drawString(names[i], (float) x, (float) y);\n```\n\n`java.applet.Applet`\
  \ 1.0\n\n- `public String getParameter(String name)`：获取在加载 applet 的网页中用 `param`\
  \ 标签定义的参数值。字符串 `name` 是区分大小写的。\n- `public String getAppletInfo()`：许多 applet 作者会重写此方法，以返回一个包含当前\
  \ applet 作者、版本和版权信息的字符串。\n- `public String[][] getParameterInfo()`：这是一个你可以重写的方法，用以返回该\
  \ applet 支持的 `param` 标签选项的数组。每行包含三个条目：参数的名称、类型和描述。以下是一个示例：\n\n点击此处查看代码图片\n\n\"fps\"\
  , \"1–10\", \"每秒帧数\"\n\"repeat\", \"boolean\", \"是否循环图像？\"\n\"images\", \"url\"\
  , \"包含图片的目录\"\n\n#### 10.3.5. 访问图像和音频文件\n\nApplet 可以同时处理图像和音频。在我们编写这些内容时，图像必须是 GIF、PNG\
  \ 或 JPEG 格式，音频文件必须是 AU、AIFF、WAV 或 MIDI 格式。支持动态 GIF，并会显示动画。\n\n使用相对 URL 指定图像和音频文件的位置。基础\
  \ URL 通常通过调用 `getDocumentBase` 或 `getCodeBase` 方法获取。前者获取包含该 applet 的 HTML 页面的 URL，后者获取\
  \ applet 代码库目录的 URL。\n\n![图像](img/image00948.jpeg) 笔记\n\n在 Java SE 的旧版本中，对这些方法存在相当大的困惑——参见\
  \ Java 错误游览会上的 bug `#4456393` ([`bugs.sun.com/bugdatabase/index.jsp`](http://bugs.sun.com/bugdatabase/index.jsp))。\n\
  \n将基础 URL 和文件位置传递给 `getImage` 或 `getAudioClip` 方法。例如：\n\n点击此处查看代码图片\n\n`Image cat\
  \ = getImage(getCodeBase(), \"images/cat.gif\");`\n`AudioClip meow = getAudioClip(getCodeBase(),\
  \ \"audio/meow.au\");`\n你已经在第 7 章中了解了如何显示图像。要播放音频片段，只需调用其 `play` 方法。你也可以在不先加载片段的情况下调用\
  \ `Applet` 类的 `play` 方法 `play(getCodeBase(), \"audio/meow.au\");`。\n\n`java.applet.Applet`\
  \ 1.0\n\n- `URL getDocumentBase()`：获取包含此 applet 的网页的 URL。\n- `URL getCodeBase()`：获取加载此\
  \ applet 的代码库目录的 URL。即 `codebase` 属性引用的目录的绝对 URL，或者在未指定 `codebase` 时的 HTML 文件所在目录。\n\
  - `void play(URL url)` / `void play(URL url, String name)`：第一种形式播放由 URL 指定的音频文件。第二种形式使用字符串提供相对于第一个参数\
  \ URL 的相对路径。如果找不到音频片段，则什么都不会发生。\n- `AudioClip getAudioClip(URL url)` / `AudioClip\
  \ getAudioClip(URL url, String name)`：第一种形式从指定的 URL 获取音频片段。第二种形式使用字符串提供相对于第一个参数\
  \ URL 的相对路径。如果找不到音频片段，方法将返回 `null`。\n- `Image getImage(URL url)` / `Image getImage(URL\
  \ url, String name)`：返回封装了 URL 指定图像的图像对象。如果图像不存在，则立即返回 `null`。否则，将启动单独线程来加载图像。\n\
  \n#### 10.3.6. Applet Context\n\nApplet 运行在浏览器或 applet 查看器内部。applet 可以请求浏览器为它执行某些操作——例如，获取音频片段、在状态栏中显示短消息或显示不同的网页。环境浏览器可以执行这些请求，也可以忽略它们。例如，如果运行在\
  \ applet 查看器内部的 applet 请求查看器显示网页，则什么都不会发生。\n\n为了与浏览器通信，applet 调用 `getAppletContext`\
  \ 方法。该方法返回一个实现 `AppletContext` 接口的对象。你可以将 `AppletContext` 接口的具体实现类为 applet 与环境浏览器之间的通信路径。除了\
  \ `getAudioClip` 和 `getImage` 之外`AppletContext` 接口还包含几个实用的方法，我们将在接下来的章节中讨论。\n\n\
  ##### 10.3.6.1. Applet 间的通信\n\n网页可以包含多个 applet。如果一个网页包含多个来自相同 `codebase` 的 applet，它们可以相互通信。自然地，这是一种你并不经常需要的高级技术。\n\
  \n如果你为 HTML 文件中的每个 applet 都提供了 `name` 属性，你可以使用 `AppletContext` 接口的 `getApplet` 方法来获取\
  \ applet 的引用。例如，如果你的 HTML 文件包含标签 `<applet code=\"Chart.class\" width=\"100\" height=\"\
  100\" name=\"Chart1\">`，那么调用 `Applet chart1 = getAppletContext().getApplet(\"Chart1\"\
  );` 就会得到该 applet 的引用。你可以用这个引用做什么？只要你为 `Chart` 类提供一个接收数据并重绘图表的方法，就可以通过强制转换调用它 `((Chart)\
  \ chart1).setData(3, \"Earth\", 9000);`\n\n你还可以列出网页上的所有 applet，无论它们是否具有名称属性。`getApplets`\
  \ 方法返回一个 `enumeration object`（我们将在第 13 章学习枚举对象）。以下是一个打印当前页面所有 applet 类名的循环：\n\n\
  点击此处查看代码图片\n\n```java\nEnumeration<Applet> e = getAppletContext().getApplets();\n\
  while (e.hasMoreElements())\n{\n    Applet a = e.nextElement();\n    System.out.println(a.getClass().getName());\n\
  }\n```\n\napplet 无法与其他网页上的 applet 通信。\n\n##### 10.3.6.2. 在浏览器中显示项目\n\n你可以访问环境浏览器的两个区域：状态栏和网页显示区域。两者都使用\
  \ `AppletContext` 接口的方法。\n\n你可以使用 `showStatus` 消息在浏览器底部的状态栏中显示字符串。例如：`showStatus(\"\
  Loading data . . . please wait\");`。\n\n![图像](img/image00949.jpeg) 提示 根据经验，`showStatus`\
  \ 的用途有限。浏览器也在使用状态栏，而且通常它会用 `Applet running.` 这样的杂信息覆盖你宝贵的消息。将状态栏用于诸如 `Loading data\
  \ . . . please wait,` 之类的提示消息，但不要用于用户无法错过的信息。\n\n你可以通过 `showDocument` 方法告诉浏览器显示不同的网页。有几种实现方法。最简单的方法是调用只有一个参数的\
  \ `showDocument`，该参数就是你想显示的 URL。\n\n点击此处查看代码图片\n\n```java\nURL u = new URL(\"http://horstmann.com/index.html\"\
  );\ngetAppletContext().showDocument(u);\n```\n\n\n\n\n\n此调的问题在于它会在当前页面的同一个窗口中打开新网页，从而替换掉你的\
  \ applet。要返回 applet，用户必须点击浏览器的后退按钮。\n\n你可以通过在调用 `showDocument` 时提供第二个参数来告诉浏览器在另一个窗口中显示文档（请参见表\
  \ 10.2）。如果你提供特殊字符串 `\"_blank\"`，浏览器将会在新窗口打开文档，而不是替换当前文档。更重要的是，如果你利用 HTML 中的框架功能，可以将一个浏览器窗口拆分为多个帧，每个帧都有一个名称。你可以将\
  \ applet 放入一个帧中，并让它在其他帧中显示。我们将在下一节展示如何操作的示例。\n\n## 表 10.2. showDocument 方法\n\n![Image](img/image01180.jpeg)\n\
  \n![Image](img/image00948.jpeg) 注意\n\napplet 查看器不显示网页。`showDocument` 方法在 applet\
  \ 查看器中会被忽略。\n\n### java.applet.Applet 1.2\n\n- `public AppletContext getAppletContext()`\n\
  为你提供 applet 浏览器环境的句柄。在大多数浏览器中，你可以使用此信息来控制运行 applet 的浏览器。\n- `void showStatus(String\
  \ msg)`\n在浏览器的状态栏显示指定的字符串。\n\n### java.applet.AppletContext 1.0\n\n- `Enumeration<Applet>\
  \ getApplets()`\n返回相同上下文（即同一网页）中所有 applet 的枚举（参见第 13 章）。\n- `Applet getApplet(String\
  \ name)`\n返回当前上下文中具有给定名称的 applet；如果不存在，则返回 `null`。搜索范围仅限于当前网页。\n- `void showDocument(URL\
  \ url)`\n- `void showDocument(URL url, String target)`\n在浏览器的帧中显示新网页。在第一种形式中，新页面会替换当前页面。第二种形式使用\
  \ `target` 参数来标识目标帧（参见第 609 页的表 10.2）。\n\n## 10.4. 应用程序偏好的存储\n\n应用程序的用户通常期望他们的偏好和自定义设置被保存，并在程序再次启动时恢复。首先，我们将介绍\
  \ Java 传统上采用简单方法——将配置信息存储在属性文件中。然后我们转向提供更健壮解决方案的 preferences API。\n\n### 10.4.1.\
  \ 属性映射 (Property Maps)\n\n*属性映射*是一种存储键/值对的数据结构。属性映射通常用于存储配置信息。属性映射具有三个特定特性：\n\n\
  - 键和值都是字符串。\n- 集合可以很容易地保存到文件并从文件中加载。\n- 有用于默认值的辅助表。\n\n实现属性映射的 Java 类是 `Properties`。\n\
  \n属性映射在指定程序配置选项时非常有用。例如：\n\n```java\nProperties settings = new Properties();\nsettings.put(\"\
  width\", \"200\");\nsettings.put(\"title\", \"Hello, World!\");\n```\n\n使用 `store`\
  \ 方法将此属性列表保存到文件中。在这里，我们将属性映射保存到 `program.properties` 文件中。第二个参数是包含在文件中的注释。\n\n点击此处查看代码图片\n\
  \n```java\nFileOutputStream out = new FileOutputStream(\"program.properties\");\n\
  settings.store(out, \"Program Properties\");\n```\n\n示例集合给出以下输出：\n\n```text\n#Program\
  \ Properties\n#Mon Apr 30 07:22:52  2007\nwidth=200\ntitle=Hello, World!\n```\n\n\
  从文件中加载属性，请使用：\n\n点击此处查看代码图片\n\n```java\nFileInputStream in = new FileInputStream(\"\
  program.properties\");\nsettings.load(in);\n```\n\n将程序属性存储在用户主目录的子目录下是一种习惯。目录名称通常以点开头——在\
  \ UNIX 系统上，这种惯例表示对用户隐藏的系统目录。我们的示例程序遵循这一惯例。要查找用户主目录，你可以调用 `System.getProperties`\
  \ 方法，该方法恰好也使用 `Properties` 对象来描述系统信息。主目录的键是 `\"user.home\"`。还有一个读取单个键的便捷方法：\n\n\
  ```java\nString userDir = System.getProperty(\"user.home\");\n```\n\n为我们的程序属性提供默认值是一个好主意，以防用户手动编辑文件。`Properties`\
  \ 类有两种提供默认值机制机制。首先，每当你查找字符串的值时，都可以指定一个在键不存在时自动使用的默认值。\n\n```java\nString title =\
  \ settings.getProperty(\"title\", \"Default title\");\n```\n\n如果属性映射中有 `\"title\"\
  ` 属性，则 `title` 被设置为该值。否则，`title` 将被设置为 `\"Default title\"`。\n\n\n\n\n\n```java\n\
  if (!propertiesDir.exists()) propertiesDir.mkdir();\n\npropertiesFile = new File(propertiesDir,\
  \ \"program.properties\");\n\nProperties defaultSettings = new Properties();\ndefaultSettings.put(\"\
  left\", \"0\");\ndefaultSettings.put(\"top\", \"0\");\ndefaultSettings.put(\"width\"\
  , \"\" + DEFAULT_WIDTH);\ndefaultSettings.put(\"height\", \"\" + DEFAULT_HEIGHT);\n\
  defaultSettings.put(\"title\", \"\");\n\nsettings = new Properties(defaultSettings);\n\
  \nif (propertiesFile.exists()) try {\n    FileInputStream in = new FileInputStream(propertiesFile);\n\
  \    settings.load(in);\n}\ncatch (IOException ex) {\n    ex.printStackTrace();\n\
  }\n\nint left = Integer.parseInt(settings.getProperty(\"left\"));\nint top = Integer.parseInt(settings.getProperty(\"\
  top\"));\nint width = Integer.parseInt(settings.getProperty(\"width\"));\nint height\
  \ = Integer.parseInt(settings.getProperty(\"height\"));\nsetBounds(left, top, width,\
  \ height);\n\n// if no title given, ask user\n\nString title = settings.getProperty(\"\
  title\");\nif (title.equals(\"\")) title = JOptionPane.showInputDialog(\"Please\
  \ supply a frame title:\");\nif (title == null) title = \"\";\nsetTitle(title);\n\
  \naddWindowListener(new WindowAdapter() {\n    public void windowClosing(WindowEvent\
  \ event) {\n        settings.put(\"left\", \"\" + getX());\n        settings.put(\"\
  top\", \"\" + getY());\n        settings.put(\"width\", \"\" + getWidth());\n  \
  \      settings.put(\"height\", \"\" + getHeight());\n        settings.put(\"title\"\
  , getTitle());\n        try {\n            FileOutputStream out = new FileOutputStream(propertiesFile);\n\
  \            settings.store(out, \"Program Properties\");\n        }\n        catch\
  \ (IOException ex) {\n            ex.printStackTrace();\n            System.exit(0);\n\
  \        }\n    }\n});\n```\n\n### `java.util.Properties`\n\n- `Properties()` 创建一个空的属性映射。\n\
  - `Properties(Properties defaults)` 创建一个具有一组默认值的空属性映射。\n- `String getProperty(String\
  \ key)` 获取属性映射。返回与该键关联的字符串，或者如果该键不存在则返回与默认表关联的字符串，如果键也不存在则返回 `null`。\n- `String\
  \ getProperty(String key, String defaultValue)` 如果未找到键，则获取带有默认值的属性。返回与该键关联的字符串，如果键不存在则返回默认字符串。\n\
  - `void load(InputStream in) throws IOException` 从输入流加载属性映射。\n- `void store(OutputStream\
  \ out, String header)` 将属性映射保存到输出流。\n\n### `java.lang.System`\n\n- `Properties getProperties()`\
  \ 获取所有系统属性。应用程序必须具有获取所有属性的权限，否则将抛出安全异常。\n- `String getProperty(String key)` 根据指定的键名获取系统属性。应用程序必须具有获取该属性的权限，否则将抛出安全异常。以下属性始终可以被获取：`java.version`,\
  \ `java.vendor`, `java.vendor.url`, `class.version`, `os.name`, `os.version`, `os.arch`,\
  \ `file.separator`, `path.separator`, `line.separator`, `java.specification.version`,\
  \ `vm.specification.version`, `vm.specification.vendor`, `vm.specification.name`,\
  \ `vm.version`, `vm.vendor`, `vm.name`。\n\n注意：你可以在 Java 运行时目录下的 `security/java.policy`\
  \ 文件中找到可以自由访问的系统属性名称。\n\n#### 10.4.2 Preferences API\n\n如你所见，`Properties` 类使得加载和保存配置信息变得简单。然而，使用属性文件有以下缺点：\n\
  \n- 某些操作系统没有主目录的概念，这使得很难为配置文件找到一个统一的位置。\n- 配置文件的命名没有标准约定，当用户安装多个 Java 应用程序时，增加了名称冲突的概率。\n\
  \n某些操作系统拥有一个配置信息的中央存储库。最为人知的例子是 Microsoft Windows 中的注册表。`Preferences` 类以平台无关的方式提供了这样一个中央存储库。在\
  \ Windows 中，`Preferences` 类使用注册表进行存储；而在 Linux 上，信息存储在本地文件系统中。当然，存储库的实现对于使用 `Preferences`\
  \ 类的程序员是透明的。\n\n`Preferences` 存储库具有树形结构，拥有如 `/com/mycompany/myapp` 的节点路径名称。与包名一样，只要程序员以反向域名开头路径，就可以避免名称冲突。事实上，该\
  \ API 的设计者建议配置节点路径与你程序中的包名匹配。\n\n存储库中的每个节点都有一个独立的键值对表，你可以用它存储数字、字符串或字节数组。它没有提供存储可序列化对象的机制。API\
  \ 设计者认为序列化格式对于长期存储来说太脆弱了。当然，如果你不同意，可以将序列化对象保存在字节数组中。\n\n为了增加额外的灵活性，存在多个并行的树。每个程序用户拥有一个树；还有一个名为“系统树”的树，适用于所有用户通用的设置。`Preferences`\
  \ 类使用操作系统的“当前用户”概念来访问相应的用户树。\n\n要访问树中的节点，从用户或系统根开始：\n\n```java\nPreferences root\
  \ = Preferences.userRoot();\n```\n或\n```java\nPreferences root = Preferences.systemRoot();\n\
  ```\n\n然后访问节点。你可以直接提供节点路径名称：\n\n```java\nPreferences node = root.node(\"/com/mycompany/myapp\"\
  );\n```\n\n一个方便的快捷方法可以获取与类名相同的节点。只需获取该类的对象并调用：\n\n```java\nPreferences node = Preferences.userNodeForPackage(obj.getClass());\n\
  ```\n或\n```java\nPreferences node = Preferences.systemNodeForPackage(obj.getClass());\n\
  ```\n\n通常，`obj` 将是 `this` 引用。\n\n一旦获取了节点，可以使用以下方法访问键/值表：\n\n- `String get(String\
  \ key, String defval)`\n- `int getInt(String key, int defval)`\n- `long getLong(String\
  \ key, long defval)`\n- `float getFloat(String key, float defval)`\n- `double getDouble(String\
  \ key, double defval)`\n- `boolean getBoolean(String key, boolean defval)`\n- `byte[]\
  \ getByteArray(String key, byte[] defval)`\n\n注意，在读取信息时必须指定默认值，以防存储库数据不可。需要默认值的原因有很多：用户从未设置过偏好；某些资源受限平台可能没有存储库；移动设备可能会临时断存储库。\n\
  \n相反，你可以使用 `put` 方法将数据写入存储库，例如：\n\n- `put(String key, String value)`\n- `putInt(String\
  \ key, int value)`\n\n等等。\n\n你可以使用以下方法列出节点中存储的所有键：\n\n```java\nString[] keys()\n\
  ```\n\n目前没有方法可以找到特定键值的类型。\n\n\n\n\n\n中央存储库（如 `Windows registry`）传统上存在两个问题：\n\n*\
  \ 它们会变成一个“垃圾场”，充满了过时信息。\n* 配置数据与存储库交织在一起，使得将偏好迁移到新平台变得困难。\n\n`Preferences` 类为第二个问题提供了解决方案。你可以通过调用以下方法导出子树（或较少见的单个节点）的偏好：\n\
  \n```java\nvoid exportSubtree(OutputStream out)\n\nvoid exportNode(OutputStream\
  \ out)\n```\n\n数据以 XML 格式保存。你可以通过调用以下方法将其导入到另一个存储库：\n\n```java\nvoid importPreferences(InputStream\
  \ in)\n```\n\n这是一个示例文件：\n\n点击此处查看代码图像\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE preferences SYSTEM \"http://java.sun.com/dtd/preferences.dtd\"\
  >\n<preferences EXTERNAL_XML_VERSION=\"1.0\">\n  <root type=\"user\">\n    <map/>\n\
  \    <node name=\"com\">\n      <map/>\n      <node name=\"horstmann\">\n      \
  \  <map/>\n        <node name=\"corejava\">\n          <map>\n            <entry\
  \ key=\"left\" value=\"11\"/>\n            <entry key=\"top\" value=\"9\"/>\n  \
  \          <entry key=\"width\" value=\"453\"/>\n            <entry key=\"height\"\
  \ value=\"365\"/>\n            <entry key=\"title\" value=\"Hello, World!\"/>\n\
  \          </map>\n        </node>\n      </node>\n    </node>\n  </root>\n</preferences>\n\
  ```\n\n如果你的程序使用了偏好设置，你应该给用户导出和导入它们的机会，这样他们就可以轻松地将设置从一台电脑迁移到另一台电脑。Listing 10.6 中的程序演示了这种技术。程序仅保存了主窗口的位置、大小和标题。尝试调整窗口大小，然后退出并重启应用程序。窗口将与你退出时完全一样。\n\
