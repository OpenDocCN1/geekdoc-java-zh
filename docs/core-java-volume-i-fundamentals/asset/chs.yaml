  \ 9.24）。\n\n![Image](img/image01115.jpeg)\n\n图 9.24. 工具栏\n\n工具栏的特殊之处在于你可以将它们移动到其他地方。你可以将工具栏拖动到框架的四个边界之一（参见图\
  \ 9.25）。当你松开鼠标按键时，工具栏会放置在新位置（参见图 9.26）。\n\n![Image](img/image01116.jpeg)\n\n图 9.25.\
  \ 拖动工具栏\n\n![Image](img/image01117.jpeg)\n\n图 9.26. 工具栏已被拖动到另一个边界\n\n* * *\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n如果工具栏位于具有边界布局（border layout）的容器，或任何其他支持 `North`、`East`、`South` 和 `West`\
  \ 约束的布局管理器，工具栏拖动功能即可生效。\n\n* * *\n\n工具栏甚至可以完全从框架中分离。分离的工具包含包含在自己的框架中（参见图 9.27）。当你关闭包含分离工具栏的框架时，工具栏会回到原始框架。\n\
  \n![Image](img/image01118.jpeg)\n\n图 9.27. 分离工具栏\n\n工具栏的编程非常简单。向工具栏中添加组件：\n\n```java\n\
  JToolBar bar = new JToolBar();\nbar.add(blueButton);\n```\n\n`JToolBar` 类还有一个添加\
  \ `Action` 对象的方法。只需像这样向工具栏填充 `Action` 对象即可：\n\n```java\nbar.add(blueAction);\n```\n\
  \n动作的小图标将显示在工具栏中。\n\n你可以使用分隔符来区分按钮组：\n\n```java\nbar.addSeparator();\n```\n\n例如，图\
  \ 9.24 中的工具栏在第三个和第四个按钮之间有一个一个分隔符。\n\n然后，将工具栏添加到框架中：\n\n```java\nadd(bar, BorderLayout.NORTH);\n\
  ```\n\n你还可以为工具栏指定标题，当工具栏未停靠时显示：\n\n```java\nbar = new JToolBar(titleString);\n```\n\
  \n默认情况下，工具栏初始是水平的。要让工具栏从垂直开始，请使用\n\n```java\nbar = new JToolBar(SwingConstants.VERTICAL)\n\
  ```\n\n或者\n\n```java\nbar = new JToolBar(titleString, SwingConstants.VERTICAL)\n\
  ```\n\n按钮是工具栏内部最常见的组件。但对可以添加到工具栏的组件没有限制。例如，你可以向工具栏添加一个组合框。\n\n### 9.5.8. 提示（Tooltips）\n\
  \n工具栏的一个缺点是用户经常对工具栏中微小图标的含义感到困惑。为了解决这个问题，用户界面设计师发明了提示。当光标悬留在按钮上有一会儿时，提示就会激活。提示文本显示在颜色的矩形内。当用户移动鼠标时，提示就会消失。（参见图\
  \ 9.28）。\n\n![Image](img/image01119.jpeg)\n\n图 9.28. 提示\n\n在 Swing 中，你只需调用 `setToolTipText`\
  \ 方法即可为任何 `JComponent` 添加提示：\n\n```java\nexitButton.setToolTipText(\"Exit\");\n\
  ```\n\n或者，如果你使用 `Action` 对象，则将提示与 `SHORT_DESCRIPTION` 键关联：\n\n```java\nexitAction.putValue(Action.SHORT_DESCRIPTION,\
  \ \"Exit\");\n```\n\nListing 9.9 显示了如何将相同的 `Action` 对象添加到菜单和工具栏中。注意，动作名称在菜单中显示为菜单项名称，而短描述在工具栏中显示为提示。\n\
