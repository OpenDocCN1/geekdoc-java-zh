  ## 前言\n\n### 致读者\n\n在 1995 年底，Java 编程语言席卷互联网并迅速成名。Java 技术的承诺是它将成为一种*通用胶水*，将用户与信息连接，无论信息来自何处——Web\
  \ 服务器、数据库、信息提供者或任何可以想象的来源。事实上，Java 处于实现这一承诺的独特地位。它是一项工程设计极其可靠的语言，获得了除微软之外的所有主要厂商的认可。其内置的安全和保护特性让程序员和\
  \ Java 程序的用户都感到安心。\n\n自 1995 年以来，Java 开发工具包（JDK）已发布了八个主要版本。在过去的 17 年里，应用程序编程接口（API）从约\
  \ 200 多个类增长到 3000 多个类。你手中的这本书是 *Core Java*^™ 第九版的第一卷。每一版都紧密跟随 Java 开发工具包的发布，每次我们都会重写书籍以利用最新的\
  \ Java 特性。本版已根据 Java 标准版 (SE) 7 的特性进行了更新。\n\n\n\n\n\n与本书的之前的版本一样，我们的目标仍然是那些希望将 Java\
  \ 应用于实际项目的严肃程序员。我们认为你（我们的读者）是一位在 Java 的编程语言方面具有坚实背景的程序员，并且假设你不喜欢充斥着玩具级示例（例如烤面包机、动物园动物或“紧张的文本”）的书。你不会在我们的书中发现任何这类内容。我们的目标是让你完全理解\
  \ Java 语言和库，而不是给你一种已经理解的错觉。\n\n在书中，你将看到大量的示例代码，展示了我们讨论的几乎每一个语言和库特性。我们刻意保持示例程序的简单，以便聚焦于核心要点，但在大多数情况下，它们并不是虚假的，也没有偷工减径。它们应该成为你编写代码的良好起点。\n\
  \n我们假设你愿意、甚至渴望学习 Java 为你提供的所有高级特性。例如，我们为你详细介绍了：\n\n*   面向对象编程\n*   反射与代理\n*   接口与内部/内部类\n\
  *   事件监听器模型\n*   使用 Swing UI 工具包进行图形用户界面设计\n*   异常处理\n*   泛型编程\n*   集合框架\n*   并发\n\
  \n随着 Java 类库的爆炸式增长，用一卷书涵盖严肃程序员需要知道的所有 Java 特性已不再可能。因此，我们决定将书分为两卷。你手手中的第一卷集中在 Java\
  \ 语言的基础概念以及用户界面编程的入门知识上。第二卷，`Core Java^™, Volume II—Advanced Features`（即将出版，ISBN:\
  \ 978-0-13-708160-8）将进一步深入介绍企业级特性和高级用户界面编程。它包含了对以下内容的详细讨论：\n\n*   文件与流\n*   分布式对象\n\
  *   数据库\n*   高级 GUI 组件\n*   本地方法\n*   XML 处理\n*   网络编程\n*   高级图形\n*   国际化\n*   JavaBeans\n\
  *   注解\n\n在编写书籍时，错误和不准确之处是不可避免的。我们非常希望获知这些错误。但当然，我们更希望每个错误只被告知一次。我们在 `http://horstmann.com/corejava`\
  \ 网页上列了一份常见问题、错误修复和变通方案列表。在勘误页（errata page）的末尾策略性地放置了一个表单，你可以用它来报告错误并提出改进建议。如果我们没有回答每一个问题或没有立即回复你，请不要失望。我们会阅读每一封邮件，并感谢你的投入，以使我们书的未来版本更加清晰、信息更丰富。\n\
  \n### 本书导读\n\n第 1 章 概述了 Java 与其他编程语言区别开来的能力。我们解释了语言设计者想要实现的目标以及它们在多大程度上取得了成功。然后，我们简述了\
  \ Java 如何诞生以及如何演变的历史。\n\n第 2 章 我们将教你如何下载和安装 JDK 以及本书的程序示例。然后，我们将指导你如何使用原生 JDK、支持\
  \ Java 的文本编辑器和 Java IDE 来编译并运行三个典型的 Java 程序——一个控制台应用程序、一个图形应用程序和一个 applet。\n\n第\
  \ 3 章 开始对 Java 语言的讨论。在本章中，我们涵盖了基础知识：变量、循环和简单函数。如果你是 C 或 C++ 程序员，这部分会非常顺手，因为这些语言特性的语法与\
  \ C 语言基本相同。如果你来自非 C 背景（如 Visual Basic），你将需要仔细阅读这一章。\n\n面向对象编程（OOP）现在是编程实践的主流，而 Java\
  \ 是一种面向对象的编程语言。第 4 章 引入了封装，这是面向对象的两个基本基石之首，以及 Java 实现它的语言机制——即类和方法。除了 Java 语言的规则，我们还提供了关于良好的\
  \ OOP 设计的建议。最后，我们涵盖了神奇的 `javadoc` 工具，它可以将你的代码注释格式化为一组超链接网页。如果你熟悉 C++，可以快速浏览此章内容。来自非面向对象背景的程序员应该预料到在深入学习\
  \ Java 之前花一些时间掌握 OOP 概念。\n\n类和封装只是 OOP 故事的一部分，第 5 章 引入了另一部分——继承。继承允许你获取一个现有的类并根据需求对其进行修改。这是\
  \ Java 编程的一项基本技术。Java 的继承机制与 C++ 非常相似。再次，C++ 程序员可以专注于语言之间的差异。\n\n第 6 章 展示了你如何使用\
  \ Java 的接口概念。接口让你能够超越 第 5 章 中的简单继承模型。掌握接口让你能够充分利用 Java 完全面向对象的编程方法的威力。我们还涵盖了 Java\
  \ 的一个有用技术特性：内部类。内部类有助于让你的代码更整洁、简洁。\n\n第 7 章 我们开始正式的应用编程。每个 Java 程序员都应该了解一点 GUI 编程，而这一卷包含了基础知识。我们展示了如何创建窗口、如何在窗口上绘图、如何用几何形状绘图、如何格式化多种字体以及如何显示图像。\n\
  \n第 8 章 详细讨论了 AWT（抽象窗口工具包）事件模型。你将看到如何编写响应事件（如鼠标点击或按键）的代码。在此过程中，你将看到如何处理按钮和面板等基础\
  \ GUI 元素。\n\n第 9 章 详细讨论了 Swing GUI 工具包。Swing 工具包允许你构建跨平台的图形用户界面。你将学习各种类型的按钮、文本组件、边界、滑动条、列表框、菜单和对话框。然而，一些高级组件将在第二卷中讨论。\n\
  \n第 10 章 展示了如何部署你的程序，无论是应用程序还是 applet。我们描述了如何将程序封装在 JAR 文件中，以及如何通过 Java Web Start\
  \ 和 applet 机制通过 Internet 应用程序。最后，我们解释了 Java 程序部署后如何存储和检索配置信息。\n\n第 11 章 异常——Java\
  \ 处理良好程序可能故障这一事实的健壮机制。异常提供了一种高效的方法，将正常处理代码与错误处理分离。当然，即使在处理了所有异常情况并强化程序后，它仍然可能按照预期工作。在本章的后半部分，我们提供了大量的实用调试技巧。最后，我们将指导你完成一次示例调试。\n\
  \n第 12 章 概述了泛型编程——Java SE 5.0 的重大进步。泛型编程让你的程序更易读、更安全。我们展示了如何使用强类型并移除丑陋且安全的强制转换，以及如何处理为了与旧版本\
  \ Java 兼容而产生的复杂性。\n\n\n\n\n第 13 章的主题是 Java 平台的集合框架。每当你想要收集多个对象并在稍后检索它们时，你应该使用最适合你情况的集合，而不是简单地将元素丢进数组。本章将向你如何利用预先构建好的标准集合。\n\
  \n第 14 章 以讨论多线程来结束本书，多线程使你能够编写以并行执行的任务。（线程是程序内部的控制流。）我们将向你如何设置线程以及如何处理线程同步。多线程在\
  \ Java SE 5.0 中发生了巨大变化，我们将为你介绍所有新机制的细节。\n\n附录列出了 Java 语言的保留字。\n\n### 约定\n\n正如许多计算机书籍一样，我们使用\
