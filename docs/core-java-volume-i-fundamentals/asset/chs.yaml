  \n\n\n\n`WeakHashMap` 类的设计是为了解决一个有趣的问题：当一个值的键（key）不再被程序的任何地方使用时，会发生什么？假设指向键的最后一个引用已经消失。那么，就没有办法再引用该值对象了。但是由于程序中没有部分持有该键，该键/值对无法从\
  \ map 中移除。为什么垃圾回收器不能移除它？移除未使用的对象不正是垃圾回收器的工作吗？\n\n遗憾的是，这并非那么简单。垃圾回收器追踪的是*活跃*对象。只要\
  \ map 对象是活跃的，其中的*所有*桶（buckets）都是活跃且不会被回收的。因此，程序应该注意从长寿命 map 中移除未使用的值。或者，你可以使用 `WeakHashMap`。这种数据结构与垃圾回收器协作，当键的唯一引用是哈希表项中的引用时，移除键/值对。\n\
  \n以下是该机制的内部原理。`WeakHashMap` 使用*弱引用*（weak references）来持有键。`WeakReference` 对象持有另一个对象的引用——在我们的案例中是哈希表键。这种类型的对象会被垃圾回收器特殊对待。通常情况下，如果垃圾回收器发现某个特定对象没有引用指向它，它会直接回收该对象。然而，如果对象*仅*通过\
  \ `WeakReference` 可访问，垃圾回收器仍然回收该对象，但会将指向该对象的弱引用放入队列中。`WeakHashMap` 的操作会定期检查该队列中是否有新到达的弱引用。弱引用进入队列意味着该键已不再被任何人使用并已被收集。随后，`WeakHashMap`\
  \ 就会移除相关的项。\n\n### 13.2.9.2. 链接哈希集合和映射（Linked Hash Sets and Maps）\n\nJava SE 1.4\
  \ 增加了 `LinkedHashSet` 和 `LinkedHashMap` 类，它们能够记住你插入项的顺序。这样，你就可以避免哈希表中项看似随机的顺序。当项（entries）插入到表中时，它们会被连接到一个双向链表中（请参见图\
  \ 13.9）。\n\n![Image](img/image0122.jpeg)\n\n图 13.9. 链接哈希表\n\n例如，考虑来自 Listing 13.6\
  \ 的以下 map 插入：\n\n点击此处查看代码图像\n\n```java\nMap staff = new LinkedHashMap();\nstaff.put(\"\
  144-25-5464\", new Employee(\"Amy Lee\"));\nstaff.put(\"567-24-2546\", new Employee(\"\
  Harry Hacker\"));\nstaff.put(\"157-62-7935\", new Employee(\"Gary Cooper\"));\n\
  staff.put(\"456-62-5527\", new Employee(\"Francesca Cruz\"));\n```\n\n然后，`staff.keySet().iterator()`\
  \ 按照以下顺序枚举键：\n\n144-25-5464\n567-24-2546\n157-62-7935\n456-62-5527\n\n而 `staff.values().iterator()`\
  \ 按照以下顺序枚举值：\n\nAmy Lee\nHarry Hacker\nGary Cooper\nFrancesca Cruz\n\n链接哈希 map 也可以使用*访问顺序*（access\
  \ order）而非插入顺序来遍历 map 项。每当你调用 `get` 或 `put` 时，受影响的项会从其当前位置移除并放置在项链表的*末尾*。（仅项链表中的位置受影响，而不影响哈希表桶。项始终留在与键的哈希码对应的桶中。）要构造这样的哈希\
  \ map，请调用\n\n```java\nLinkedHashMap<K, V>(initialCapacity, loadFactor, true)\n```\n\
  \n访问顺序对于实现缓存的“最近最少使用”（least recently used）策略非常有用。你可能希望将频繁访问的项留在内存中，而从数据库读取较少访问的对象。当在表中未找到某项且表已经相当满时，你可以获取该表的迭代器并移除它枚举的前几个元素。那些项就是最近最少使用的项。\n\
  \n你甚至可以自动化该过程。创建一个 `LinkedHashMap` 的子类并重写方法：\n\n```java\nprotected boolean removeEldestEntry(Map.Entry<K,\
  \ V> eldest)\n```\n\n这样，每当你的方法返回 `true` 时，添加新项就会导致 `eldest` 项被移除。例如，以下缓存保持在最多 100\
  \ 个元素的大小：\n\n点击此处查看代码图像\n\n```java\nMap<K, V> cache = new\n    LinkedHashMap<>(128,\
  \ 0.75F, true)\n    {\n      protected boolean removeEldestEntry(Map.Entry<K, V>\
  \ eldest)\n      {\n          return size() > 100;\n      }\n    };\n```\n\n或者，你可以考虑由\
  \ `eldest` 项来做决定。\n\n\n\n\n如果你希望移除 `eldest` 条目，则应重写该方法返回 `true`。`eldest` 参数是正被考虑移除的条目。该方法在条目添加到\
  \ map 之后调用。默认实现返回 `false`——默认情况下不会移除旧元素。但是，你可以重新定义此方法以选择性返回 `true`——例如，如果最老的条目符合特定条件或\
  \ map 超过了特定大小。\n\n### java.util.EnumSet<E extends Enum<E>> ****5.0**\n\n* `static\
  \ <E extends Enum<E>> EnumSet<E> allOf(Class<E> enumType)` 返回一个包含给定枚举类型所有值的集合。\n\
  * `static <E extends Enum<E>> EnumSet<E> noneOf(Class<E> enumType)` 返回一个空集合，能够持有给定枚举类型的值。\n\
  * `static <E extends Enum<E>> EnumSet<E> range(E from, E to)` 返回一个包含 `from` 和 `to`\
  \ 之间所有值（包含边界）的集合。\n* `static <E extends Enum<E>> EnumSet<E> of(E value)`\n* `static\
  \ <E extends Enum<E>> EnumSet<E> of(E value, E... values)` 返回一个包含给定值的集合。\n\n###\
  \ java.util.EnumMap<K extends Enum<K>, V> **5.0**\n\n* `EnumMap(Class<K> keyType)`\
  \ 构建一个空 map，其键具有给定类型。\n\n### java.util.IdentityHashMap<K, V> **1.4**\n\n* `IdentityHashMap()`\n\
  * `IdentityHashMap(int expectedMaxSize)` 构建一个空标识哈希 map，其容量为超过 1.5 × `expectedMaxSize`\
  \ 的最小 2 的幂。（`expectedMaxSize` 的默认值为 `21`。）\n\n### java.lang.System **1.0**\n\n*\
  \ `static int identityHashCode(Object obj)` **1.1** 返回与 `Object.hashCode` 计算相同的哈希码（来自对象的内存地址），即使\
  \ `obj` 所属的类重新定义了 `hashCode` 方法。\n\n### 13.3. 集合框架 (Collections Framework)\n\n*框架*（framework）是一组构成构建高级功能基础的类。框架包含了具有有用功能、策略和机制的超类。框架的用户通过创建子类来扩展功能，而无需重新发明基础机制。例如，Swing\
  \ 是一个用户界面的框架。\n\nJava 集合库为集合类提供了一个框架。它为集合实现者定义了许多接口和抽象类（参见图 13.10），并规定了某些机制，例如迭代协议。你可以直接使用集合类，而不需要了解太多关于框架的知识——我们在前面的章节中就是这么做的。然而，如果你想实现适用于多种集合类型的通用算法，或者如果你想添加新的集合类型，那么理解这个框架是有帮助的。\n\
  \n![Image](img/image01221.jpeg)\n\n图 13.10. 集合框架的接口\n\n集合有两个基本的接口：`Collection` 和\
  \ `Map`。你通过一个方法将元素插入到集合中：\n\n``````\nboolean add(E element)\n```\n\n然而，map 存储的是键/值对，你使用\
  \ `put` 方法来插入它们：\n\n``````\nV put(K key, V value)\n```\n\n要从集合中读取元素，可以使用迭代器访问它们。然而，你可以通过\
  \ `get` 方法从 map 中读取值：\n\n``````\nV get(K key)\n```\n\n`List` 是一个*有序集合*（ordered collection）。元素被添加到容器中的特定位置。对象可以通过两种方式放置在它的位置上：通过整数索引和通过列表迭代器。`List`\
  \ 接口定义了随机访问的方法：\n\n``````\nvoid add(int index, E element)\nE get(int index)\nvoid\
  \ remove(int index)\n```\n\n如前所述，无论这些随机访问方法对于特定实现是否高效，`List` 接口都提供了这些随机访问方法。为了避免执行代价昂的随机访问操作，Java\
  \ SE 1.4 引入了一个标记接口 `RandomAccess`。该接口没有方法，但你可以用它测试特定集合是否支持高效的随机访问：\n\n```java\n\
  if (c instanceof RandomAccess)\n{\n   use random access algorithm\n}\nelse\n{\n\
  \   use sequential access algorithm\n}\n```\n\n`ArrayList` 和 `Vector` 类实现了 `RandomAccess`\
  \ 接口。\n\n![Image](img/image00948.jpeg) 注意\n\n从理论角度来说，拥有一个扩展 `List` 接口并声明随机访问方法的独立\
  \ `Array` 接口是有意义的。如果有独立的 `Array` 接口，那么需要随机访问的算法将使用 `Array` 参数，你就不会意外地将其应用到随机访问缓慢的集合上。然而，集合框架的设计者选择不定义独立的接口，因为他们希望保持库中接口数量尽可能少。此外，他们不想对程序员采取家长式的态度。你可以自由地将链表传递给使用随机访问的算法——你只需要意识到性能成本即可。\n\
  \n`ListIterator` 接口定义了一个在元素之前添加元素的方法：\n\n``````\nvoid add(E element)\n```\n\n要获取并移除特定位置的元素，只需使用\
  \ `Iterator` 的 `next` 和 `remove` 方法。\n\n`Set` 接口与 `Collection` 接口相同，但方法的行为定义得很紧密。集合的\
  \ `add` 方法应该拒绝重复。集合的 `equals` 方法定义为两个集合具有相同元素即相等，无论顺序如何。集合的 `hashCode` 方法定义为具有相同元素产生相同的哈希码。\n\
  \n如果方法签名相同，为什么要单独设立接口呢？概念上，并不是所有集合都是集合。设立 `Set` 接口允许程序员编写只接受集合的方法。\n\n`SortedSet`\
  \ 和 `SortedMap` 接口暴露了用于排序的比较器，并定义了获取集合子视图的方法。我们在下一节讨论这些视图。\n\n最后，Java SE 6 引入了 `NavigableSet`\
  \ 和 `NavigableMap` 接口，包含了用于排序集合和 map 的额外方法。（理想情况下，这些方法应该直接包含在 `SortedSet` 和 `SortedMap`\
  \ 接口中。）`TreeSet` 和 `TreeMap` 类实现了这些接口。\n\n现在，让我们从接口转向实现它们的类。我们已经讨论过集合接口有许多可以从基础方法简单实现的方法。抽象类提供了许多常规操作的实现：\n\
  \nAbstractCollection\nAbstractList\nAbstractSequentialList\nAbstractSet\nAbstractQueue\n\
  AbstractMap\n\n如果你实现自己的集合类，你可能想要扩展这些抽象类之一，以便获取常规操作的实现。\n\nJava 库提供了具体的类：\n\nLinkedList\n\
  ArrayList\nArrayDeque\nHashSet\nTreeSet\nPriorityQueue\nHashMap\nTreeMap\n\n图 13.11\
  \ 显示了这些类之间的关系。\n\n![Image](img/image01222.jpeg)\n\n图 13.11. 集合框架中的类\n\n最后，一些“遗留”容器类自\
  \ Java 第一版以来就已经存在，在集合框架之前：\n\nVector\nStack\nHashtable\nProperties\n\n它们已经集成到集合框架中——参见图\
  \ 13.12。我们将在本章后面的部分讨论这些类。\n\n![Image](img/image01223.jpeg)\n\n图 13.12. 集合框架中的遗留类\n\
  \n\n\n如果你查看图 13.10 和 13.11，你可能会认为为了实现少量的具体集合类而使用大量的接口和抽象类是大材小用。然而，这些图表并没有说明全部。通过使用*视图（views）*，你可以获得实现\
  \ `Collection` 或 `Map` 接口的其他对象。你已经在 map 类的 `keySet` 方法中见过其中一个例子。乍看之下，该方法似乎创建了一个新集合，填充了\
  \ map 的所有键并返回了它。然而，事实并非如此。相反，`keySet` 方法返回一个实现了 `Set` 接口的类对象，该类的方法会操作原始 map。这样的集合被称为*视图*。\n\
  \n视图技术在集合框架中有许多实用的应用。我们将在接下来的章节中讨论这些应用。\n\n### 13.3.1.1 轻量级集合包装器\n\n`Arrays` 类的静态方法\
  \ `asList` 返回一个围绕普通 Java 数组的 `List` 包装器。该方法允许你将数组传递给期望接收列表或集合参数的方法。例如：\n\n```java\n\
  Card[] cardDeck = new Card[52];\n\n...\n\nList<Card> cardList = Arrays.asList(cardDeck);\n\
  ```\n\n返回的对象*不是*一个 `ArrayList`。它是一个视图对象，具有 `get` 和 `set` 方法，用于访问底层数组。所有会改变数组大小的方法（如关联迭代器的\
  \ `add` 和 `remove` 方法）都会抛出 `UnsupportedOperationException`。\n\n从 Java SE 5.0 开始，`asList`\
  \ 方法被声明为具有可变参数。你不仅传递数组，还可以传递单个元素。例如：\n\n```java\nList<String> names = Arrays.asList(\"\
  Amy\", \"Bob\", \"Carl\");\n```\n\n方法调用\n\n```\nCollections.nCopies(n, anObject)\n\
  ```\n\n返回一个实现 `List` 接口的不可变对象，并产生具有 `n` 个元素的幻象，每个元素都显示为 `anObject`。\n\n例如，以下调用创建了一个包含\
  \ 100 个字符串的 `List`，且都设置为 `\"DEFAULT\"`：\n\n```java\nList<String> settings = Collections.nCopies(100,\
  \ \"DEFAULT\");\n```\n\n存储开销非常小——对象只存储一次。这是视图技术的一种别巧的应用。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n`Collections` 类包含许多实用方法，其参数或返回值是集合。不要将其与 `Collection` 接口混淆。\n\n***\n\n方法调用\n\
  \n```\nCollections.singleton(anObject)\n```\n\n返回一个实现 `Set` 接口的视图对象（与 `nCopies`\
  \ 不同，后者产生的是 `List`）。返回的对象实现了一个不可变的单元素集合，且没有数据结构的开销。`singletonList` 和 `singletonMap`\
  \ 方法的行为也类似此。\n\n### 13.3.1.2 子范围\n\n你可以为许多集合创建子范围视图。例如，假设你有一个列表 `staff`，并想要提取第 10\
  \ 到 19 个元素。使用 `subList` 方法获取列表子范围的视图：\n\n```java\nList group2 = staff.subList(10,\
  \ 20);\n```\n\n第一个索引是包含的，第二个索引是不包含的——这与 `String` 类中 `substring` 操作的参数一样。\n\n你可以对子范围应用任何操作，这些操作会自动反映到整个列表中。例如，你可以删除整个子范围：\n\
  \n```java\ngroup2.clear(); // staff 缩减\n```\n\n元素会自动从 `staff` 列表中清除，`group2` 变为空。\n\
  \n对于排序集合和 map，你使用排序顺序而不是元素位置来形成子范围。`SortedSet` 接口声明了三个方法：\n\n```java\nSortedSet<E>\
  \ subSet(E from, E to)\nSortedSet<E> headSet(E to)\nSortedSet<E> tailSet(E from)\n\
  ```\n\n这些方法返回所有大于或等于 `from` 且严格小于 `to` 的元素的子集。对于排序 map，类似的方法\n\n```java\nSortedMap<K,\
  \ V> subMap(K from, K to)\nSortedMap<K, V> headMap(K to)\nSortedMap<K, V> tailMap(K\
  \ from)\n```\n\n返回 map 的视图，其中包含所有*键（keys）*落在指定范围的条目。\n\nJava SE 6 引入的 `NavigableSet`\
  \ 接口对这些子范围操作提供了更多的控制。你可以指定边界是否包含内：\n\n点击此处查看代码图片\n\n```java\nNavigableSet<E> subSet(E\
  \ from, boolean fromInclusive, E to, boolean toInclusive)\nNavigableSet<E> headSet(E\
  \ to, boolean toInclusive)\nNavigableSet<E> tailSet(E from, boolean fromInclusive)\n\
  ```\n\n### 13.3.1.3 不可修改视图\n\n`Collections` 类具有可以产生集合的*不可修改视图*的方法。这些视图为现有集合添加了运行时检查。如果检测到修改集合的尝试，将抛出异常且集合保持不变。\n\
  \n通过以下六种方法获取不可修改视图：\n\n- `Collections.unmodifiableCollection`\n- `Collections.unmodifiableList`\n\
  - `Collections.unmodifiableSet`\n- `Collections.unmodifiableSortedSet`\n- `Collections.unmodifiableMap`\n\
  - `Collections.unmodifiableMap`\n\n每个方法都作用于接口。例如，假设你想让代码查看但不触碰集合的内容。你可以这样做：\n\n\
  ```java\nList<String> staff = new LinkedList<>();\n...\nCollections.unmodifiableList(staff);\n\
  ```\n\n`unmodifiableList` 返回一个实现 `List` 的对象。它的访问器方法从 `staff` 获取值。但修改方法（如 `add`）被重写为抛出\
  \ `UnsupportedOperationException`，而不是转发给底层集合。\n\n不可修改视图并没有让集合本身不可变。你仍然可以通过原始引用 `staff`\
  \ 修改集合。并且可以对集合调用修改方法。\n\n视图包装的是*接口*而不是实际集合，因此你只能访问接口中定义的方法。例如，`LinkedList` 类具有 `addFirst`\
  \ 和 `addLast` 等便利方法，它们并不是 `List` 接口的一部分。这些方法无法通过不可修改视图访问。\n\n***\n\n![Image](img/image0950.jpeg)\
  \ 注意\n\n`unmodifiableCollection` 方法（以及本节后面过的 `synchronizedCollection` 和 `checkedCollection`\
  \ 方法）返回的集合其 `equals` 方法*没有*调用底层集合的 `equals` 方法。相反，它继承了 `Object` 类的 `equals` 方法，仅测试对象是否相同。如果你将集合或列表转换为简单的集合，你将无法测试内容的相等性。视图以这种方式运行，是因为在层次结构的这一层，相等性测试并没有定义。视图对待\
  \ `hashCode` 方法的方式也是如此。\n\n然而，`unmodifiableSet` 和 `unmodifiableList` 方法使用了底层集合的\
  \ `equals` 和 `hashCode` 方法。\n\n### 13.3.1.4 同步视图\n\n如果你从多个线程访问集合，你需要确保集合不会被意外损坏。例如，如果一个线程尝试向哈希表中添加元素，而另一个线程正在重哈元素，结果将是灾难性的。\n\
  \n库设计者没有实现线程集合类，而是使用视图机制使普通集合线程安全。例如，`Collections` 类中的静态 `synchronizedMap` 方法可以将任何\
  \ map 转换为具有同步访问方法的 `Map`：\n\n```java\nMap<String, Employee> map = Collections.synchronizedMap(new\
  \ HashMap<String, Employee>());\n```\n\n\n\n\n你现在可以从多个线程访问 `map` 对象了。`get` 和 `put`\
  \ 等方法是序列化的——在另一个线程调用另一个方法之前，每个方法的调用都必须完全完成。我们将在第 14 章中更详细地讨论数据结构的同步访问问题。\n\n###\
  \ 13.3.1.5. 检查型视图 (Checked Views)\n\nJava SE 5.0 增加了一组“检查”（checked）视图，旨在为泛型中可能出现的问题提供调试支持。如第\
  \ 12 章所解释的，实际上可以向泛型集合中混入错误类型的元素。例如：\n\n点击此处查看代码图像\n\n```\nArrayList<String> strings\
  \ = new ArrayList<>();\nArrayList rawList = strings; // 仅获取警告而不是错误，为了兼容旧代码\nrawList.add(new\
  \ Date()); // 现在 strings 包含一个 Date 对象！\n```\n\n错误的 `add` 命令在运行时不会被检测到。相反，当代码的其他部分调用\
  \ `get` 并将结果强制转换为 `String` 时，会发生类类型转换异常。\n\n检查型视图可以检测出这个问题。按照如下方式定义一个安全的列表：\n\n\
  ```\nList<String> safeStrings = Collections.checkedList(strings, String.class);\n\
  ```\n\n该视图的 `add` 方法会检查插入的对象是否属于指定的类，如果不属于，则立即抛出 `ClassCastException`。此处的优点是错误会在正确的位置报告：\n\
  \n点击此处查看代码图像\n\n```\nArrayList rawList = safeStrings;\nrawList.add(new Date());\
  \ // 检查列表抛出 ClassCastException\n```\n\n![Image](img/image00950.jpeg) 注意\n\n检查型视图受限于虚拟机可以执行的运行时检查。例如，如果你有一个\
  \ `ArrayList<Pair<String>>`，你无法防止它被插入 `Pair<Date>`，因为虚拟机只有一个“原始” `Pair` 类。\n\n###\
  \ 13.3.1.6. 关于可选操作的说明\n\n视图通常具有某些限制——它可能是只读的，可能无法更改大小，或者可能支持删除但不支持插入（如 map 的键视图所示）。如果你尝试不适当的操作，限制性视图会抛出\
  \ `UnsupportedOperationException`。\n\n在集合和迭代器接口的 API 文档中，许多方法被描述为“可选操作（optional\
  \ operations）”。这似乎与接口的概念相冲突。归结底，接口的作用难道不是列出类*必须*实现的方法吗？诚然，从理论角度来看，这种安排是不令人满意的。更好的解决方案可能是为只读视图和无法更改集合大小的视图设计独立的接口。然而，这将使接口数量增加三倍，而该库的设计者认为这是不可接受的。\n\
  \n你是否应该将“可选”方法的这种技巧扩展到你自己的设计中？我们认为不应该。尽管集合被频繁使用，但实现它们的编码风格在其他问题领域并不典型。集合类库的设计者必须解决一组特别严苛的冲突需求。用户希望库既易于学习、方便使用、完全泛型、防愚蠢（idiot-proof），同时又像手写算法一样高效。显然，不可能同时实现所有目标，甚至无法接近。但在你自己的编程问题中，你很少遇到如此极端的约束条件。你应该能够找到不依赖于“可选”接口操作这种极端措施的解决方案。\n\
  \n#### java.util.Collections 1.2\n\n- `static <E> Collection unmodifiableCollection(Collection<E>\
  \ c)`\n- `static <E> List unmodifiableList(List<E> c)`\n- `static <E> Set unmodifiableSet(Set<E>\
  \ c)`\n- `static <E> SortedSet unmodifiableSortedSet(SortedSet<E> c)`\n- `static\
  \ <K, V> Map unmodifiableMap(Map<K, V> c)`\n- `static <K, V> SortedMap unmodifiableSortedMap(SortedMap<K,\
  \ V> c)`\n构建集合的视图；该视图的变器方法抛出 `UnsupportedOperationException`。\n\n- `static <E> Collection<E>\
  \ synchronizedCollection(Collection<E> c)`\n- `static <E> List synchronizedList(List<E>\
  \ c)`\n- `static <E> Set synchronizedSet(Set<E> c)`\n- `static <E> SortedSet synchronizedSortedSet(SortedSet<E>\
  \ c)`\n- `static <K, V> Map<K, V> synchronizedMap(Map<K, V> c)`\n- `static <K, V>\
  \ SortedMap<K, V> synchronizedSortedMap(SortedMap<K, V> c)`\n构建集合的视图；该视图的方法是同步的。\n\
  \n- `static <E> Collection checkedCollection(Collection<E> c, Class<E> elementType)`\n\
  - `static <E> List checkedList(List<E> c, Class<E> elementType)`\n- `static <E>\
  \ Set checkedSet(Set<E> c, Class<E> elementType)`\n- `static <E> SortedSet checkedSortedSet(SortedSet<E>\
  \ c, Class<E> elementType)`\n- `static <K, V> Map<K, V> checkedMap(Map<K, V> c,\
  \ Class<E> elementType)`\n- `static <K, V> SortedMap checkedSortedMap(SortedMap<K,\
  \ V> c, Class<E> elementType)`\n构建集合的视图；该视图在插入错误类型时会抛出 `ClassCastException`。\n\n\
  - `static <E> List<E> nCopies(int n, E value)`\n- `static <E> Set<E> singleton(E\
  \ value)`\n构建包含 `n` 个相同元素的列表或单个元素的集合。\n\n#### java.util.Arrays 1.2\n\n- `static\
  \ <E> List<E> asList(E... array)`\n返回数组的列表视图；该视图可修改但不可调整大小。\n\n#### java.util.List\
  \ 1.2\n\n- `List<E> subList(int fromIndex, int toIndex)`\n返回范围内的列表视图。\n\n#### java.util.SortedSet\
  \ 1.2\n\n- `SortedSet<E> subSet(E firstIncluded, E lastExcluded)`\n- `SortedSet<E>\
  \ headSet(E toExcluded)`\n- `SortedSet<E> tailSet(E fromIncluded)`\n返回范围内的元素视图。\n\
  \n#### java.util.NavigableSet 6\n\n- `NavigableSet<E> subSet(E from, boolean fromIncluded,\
  \ E to, boolean toIncluded)`\n- `NavigableSet<E> headSet(E to, boolean toIncluded)`\n\
  - `NavigableSet<E> tailSet(E from, boolean fromIncluded)`\n返回范围内的元素视图。`boolean`\
  \ 标志决定边界是否包含内。\n\n#### java.util.SortedMap 1.2\n\n- `SortedMap<K, V> subMap(K fromIncluded,\
  \ K toExcluded)`\n- `SortedMap<K, V> headMap(K toExcluded)`\n- `SortedMap<K, V>\
  \ tailMap(K fromIncluded)`\n返回键在范围内的映射视图。\n\n#### java.util.NavigableMap 6\n\n-\
  \ `NavigableMap<K, V> subMap(K from, boolean fromIncluded, K to, boolean toIncluded)`\n\
  - `NavigableMap<K, V> headMap(K to, boolean toIncluded)`\n- `NavigableMap<K, V>\
  \ tailMap(K from, boolean fromIncluded)`\n返回键在范围内的映射视图。`boolean` 标志决定边界是否包含内。\n\n\
  ### 13.3.2. 批量操作 (Bulk Operations)\n\n到为止，我们的大多数示例都是使用迭代器逐个遍历集合。然而，你通常可以通过使用库中的*批量操作*来避免迭代。\n\
  \n假设你想找到两个集合的*交集*——两个集合共同拥有的元素。首先，创建一个结果结果集合。\n\n```\nSet<String> result = new HashSet<>(a);\n\
  ```\n\n在这里，我们利用了每个集合都有一个参数为另一个集合的构造函数的特性。\n\n现在，使用 `retainAll` 方法：\n\n```\nresult.retainAll(b);\n\
  ```\n\n保留在 `b` 中出现的元素。你无需编写循环就形成了交集。\n\n\n\n\n你可以将这一想法进一步，并对 `view`（视图）应用批量操作。例如，假设你有一个将员工\
  \ ID 映射到员工对象的 map，并且你有一组所有要终止雇的员工 ID 集合。\n\n```java\nMap<String, Employee> staffMap\
  \ = . . .;\nSet<String> terminatedIDs = . . .;\n```\n\n只需形成键集并移除所有被终止员工的 ID 即可。\n\
  \n```java\nstaffMap.keySet().removeAll(terminatedIDs);\n```\n\n由于键集是 map 的视图，键以及关联的员工名称会自动从\
  \ map 中移除。\n\n通过使用子范围视图（subrange view），你可以将批量操作限制在子列表和子集上。例如，假设你想将列表的前十个元素添加到另一个容器中。创建一个子列表来选出前十个：\n\
  \n```java\nrelocated.addAll(staff.subList(0, 10));\n```\n\n子范围也可以是变异操作的目标。\n\n```java\n\
  staff.subList(0, 10).clear();\n```\n\n### 13.3.3. 集合与数组之间的转换\n\nJava 平台 API 的大部分部分是在集合框架（collections\
  \ framework）创建之前设计的。因此，你可能需要在传统的数组和更现代的集合之间进行转换。\n\n如果你有一个需要转换为集合的数组，`Arrays.asList`\
  \ 包装器可以实现此用。例如：\n\n```java\nString[] values = . . .;\nHashSet<String> staff = new\
  \ HashSet<>(Arrays.asList(values));\n```\n\n从集合中获取数组稍微复杂一点。当然，你可以使用 `toArray` 方法：\n\
  \n```java\nObject[] values = staff.toArray();\n```\n\n但结果是一个 `Object` 数组。即使你知道集合包含特定类型的对象，你不能直接进行强制转换：\n\
  \n```java\nString[] values = (String[]) staff.toArray(); // 错误！\n```\n\n`toArray`\
  \ 方法返回的数组是作为 `Object[]` 数组创建的，你无法更改它的类型。相反，使用 `toArray` 方法的变体，并为其传入一个长度为 `0` 的所需类型数组。返回的数组将创建为相同的数组类型：\n\
  \n```java\nString[] values = staff.toArray(new String[0]);\n```\n\n如果你愿意，可以构造一个具有正确大小的数组：\n\
  \n```java\nstaff.toArray(new String[staff.size()]);\n```\n\n在这种情况下，不会创建新数组。\n\n\
  ![Image](img/image00948.jpeg) 注意\n\n你可能可能会奇怪，为什么不能简单向 `toArray` 方法传递一个 `Class` 对象（例如\
  \ `String.class`）。然而，这个方法兼具“双重职责”：既可以填充现有的数组（前提是长度足够），也可以创建一个新数组。\n\n### 13.4. 算法\n\
  \n泛型集合接口具有巨大的优势——你只需要实现一次你的算法。例如，考虑一个计算集合中最大元素的简单算法。传统上，程序员会用循环来实现此类算法。以下是你可以找到数组中最大元素的方法。\n\
  \n点击查看代码图片\n\n```java\nif (a.length == 0) throw new NoSuchElementException();\n\
  T largest = a[0];\nfor (int i = 1; i < a.length; i++)\n    if (largest.compareTo(a[i])\
  \ < 0)\n        largest = a[i];\n```\n\n当然，要找到列表（array list）的最大值，你写的代码会稍微不同。\n\n\
  点击查看代码图片\n\n```java\nif (v.size() == 0) throw new NoSuchElementException();\nT largest\
  \ = v.get(0);\nfor (int i = 1; i < v.size(); i++)\n    if (largest.compareTo(v.get(i))\
  \ < 0)\n        largest = v.get(i);\n```\n\n那么链表（linked list）呢？在链表中你无法高效的随机访问，但你可以使用迭代器（iterator）。\n\
  \n点击查看代码图片\n\n```java\nif (l.isEmpty()) throw new NoSuchElementException();\nIterator<T>\
  \ iter = l.iterator();\nT largest = iter.next();\nwhile (iter.hasNext())\n{\n  \
  \  T next = iter.next();\n    if (largest.compareTo(next) < 0)\n        largest\
  \ = next;\n}\n```\n\n这些循环编写起来很冗燥，而且稍微容易出错。是否存在差一错误（off-by-one error）？循环对于空容器是否工作正常？对于只包含一个元素的容器是否正常？你不想每次都测试和调试这些代码，但你也不想实现一整堆方法，例如这些：\n\
  \n点击查看代码图片\n\n```java\nstatic <T extends Comparable> T max(T[] a)\nstatic <T extends\
  \ Comparable> T max(ArrayList<T> v)\nstatic <T extends Comparable> T max(LinkedList<T>\
  \ l)\n```\n\n现在，你可以用一个方法计算链表、列表或数组的最大值。这正是集合接口的用处。正如你所看到的，通过遍历元素，就不需要随机访问。这是一个强大的概念。事实上，C++\
  \ 标准库拥有数十算法，但它包含了基础：排序、二分查找和一些工具算法。\n\n#### 13.4.1 排序与洗牌\n\n计算机老兵有时会回忆起他们如何使用打片卡，并手动编写排序算法。如今，排序算法是大多数编程语言的标准库的一部分，Java\
  \ 编程语言也不例外。\n\n`Collections` 类中的 `sort` 方法对实现了 `List` 接口的集合。\n\n```java\nList<String>\
  \ staff = new LinkedList<>();\nCollections.sort(staff);\n```\n\n该方法假设列表元素实现了 `Comparable`\
  \ 接口。如果你想以其他方式排序列表，可以传递一个 `Comparator` 对象作为第二个参数。（我们在 13.2.5 中讨论过比较器，“对象比较,”位于第\
  \ 768 页。）以下是如何对 item 列表进行排序：\n\n点击查看代码图片\n\n```java\nComparator<Item> itemComparator\
  \ = new Comparator<Item>()\n{\n    public int compare(Item a, Item b)\n    {\n \
  \       return a.partNumber - b.partNumber;\n    }\n};\nCollections.sort(items,\
  \ itemComparator);\n```\n\n如果你想以*倒序*排序列表，请使用静态便利方法 `Collections.reverseOrder()`。它返回一个返回\
  \ `b.compareTo(a)` 的比较器。例如：\n\n```java\nCollections.sort(staff, Collections.reverseOrder())\n\
  ```\n\n这将根据元素类型 `compareTo` 方法提供的排序对列表 `staff` 中的元素进行反序排序。同样，\n\n```java\nCollections.sort(items,\
  \ Collections.reverseOrder(itemComparator))\n```\n\n这反转了 `itemComparator` 的排序。\n\
  \n\n\n\n你可能会好奇 `sort` 方法是如何对列表排序的。通常，当你在算法书中查看排序算法时，它是针对数组呈现的，并使用随机元素访问。然而，在列表中进行随机访问可能是低效的。实际上，你可以通过使用归并排序的形式来高效地对列表进行排序（例如\
  \ Robert Sedgewick 的 *Algorithms in C++* [Addison-Wesley, 1998, pp. 366–369]）。但是，Java\
  \ 编程语言中的实现并没有这样做。它只是将所有元素转到一个数组中，使用另一种变种归并排序对数组进行排序，然后将排序后的序列复制回列表。\n\nCollections\
  \ 库使用的归并排序算法比 `QuickSort`（通用排序算法的传统选择）稍微慢一点。但它有一个主要优势：它是*稳定*（stable）的，也就是说，它不会交换相等元素的顺序。你为什么要关心相等元素的顺序呢？这里有一个常见的场景：假设你有一个已经按姓名排序的员工列表。现在你按薪水进行排序。工资相等的员工会发生什么？使用稳定排序，按姓名排序的顺序会被保留。换句话说，结果是一个先按薪水排序、后按姓名排序的列表。\n\
  \nCollections 不需要实现其所有的“可选”方法，因此所有接收集合参数的方法都必须描述何时将集合传递给算法是安全的。例如，你显然不能将 `unmodifiableList`\
  \ 列表传递给 `sort` 算法。你*可以*传递什么类型的列表？根据文档，列表必须是可修改的，但不需要可扩展。\n\n术语定义如下：\n\n- 如果列表支持\
  \ `set` 方法，则该列表是*可修改的*（modifiable）。\n- 如果列表支持 `add` 和 `remove` 操作，则该列表是*可调整大小的*（resizable）。\n\
  \n`Collections` 类有一个算法 `shuffle`，它的作用与排序相反——它随机打乱列表中元素的顺序。例如：\n\n```\nArrayList<Card>\
  \ cards = . . .;\nCollections.shuffle(cards);\n```\n\n如果你提供的列表没有实现 `RandomAccess`\
  \ 接口，`shuffle` 方法会将元素元素复制到数组中，打乱数组，然后将打乱后的元素复制回列表。\n\n代码列表 13.7 中的程序使用包含 1 到 49\
  \ 数字的 `Integer` 对象填充了一个数组列表。然后它随机打乱列表，并从打乱列表中选取前 6 个值。最后，它对选定的值进行排序并打印它们。\n\n列表\
  \ 13.7. shuffle/ShuffleTest.java\n\n点击此处查看代码图像\n\n* * *\n\n```java\npackage shuffle;\n\
  \nimport java.util.*;\n\n/**\n * 此程序演示了随机洗牌和排序算法。\n * @version 1.11 2012-01-26\n\
  \ * @author Cay Horstmann\n */\npublic class ShuffleTest\n{\n    public static void\
  \ main(String[] args)\n    {\n        List<Integer> numbers = new ArrayList<>();\n\
  \        for (int i = 1; i <= 49; i++)\n            numbers.add(i);\n        Collections.shuffle(numbers);\n\
  \        List<Integer> winningCombination = numbers.subList(0, 6);\n        Collections.sort(winningCombination);\n\
  \        System.out.println(winningCombination);\n    }\n}\n```\n\n* * *\n\njava.util.Collections\
  \ **1.2**\n\n- `static <T extends Comparable<? super T>> void sort(List<T> elements)`\n\
  - `static <T> void sort(List<T> elements, Comparator<? super T> c)`\n使用稳定排序算法对列表中的元素进行排序。该算法保证运行在\
  \ O(*n* log *n*) 时间内，其中 *n* 是列表的长度。\n\n- `static void shuffle(List<?> elements)`\n\
  - `static void shuffle(List<?> elements, Random r)`\n随机打乱列表中的元素。该算法运行在 O(*n a*(*n*))\
  \ 时间内，其中 *n* 是列表的长度，*a*(*n*) 是访问元素的平均时间。\n\n- `static <T> Comparator<T> reverseOrder()`\n\
  返回一个比较器，该比较器根据 `Comparable` 接口的 `compareTo` 方法提供的顺序的反序对元素进行排序。\n\n- `static <T>\
  \ Comparator<T> reverseOrder(Comparator c)`\n返回一个比较器，该比较器根据给定的顺序反序对元素进行排序。\n\n*\
  \ * *\n\n#### 13.4.2. 二分查找\n\n为了有价值，二分查找需要随机访问。如果你必须逐个遍历链表的一半来寻找中间元素，你就失去了二分查找的所有优势。因此，如果你给它链表，`binarySearch`\
  \ 算法将退回到线性搜索。\n\n* * *\n\n![Image](img/image0948.jpeg) 注意\n\nJava SE 1.3 没有为具有高效随机访问能力的有序集合提供单独接口，因此\
  \ `binarySearch` 方法使用了一种非常原始的方法——检查列表是否扩展了 `AbstractSequentialList` 类。这在 Java SE\
  \ 1.4 中得到了修复。现在 `binarySearch` 方法检查列表参数是否实现了 `RandomAccess` 接口。如果是，该方法执行二分查找；否则，它使用线性搜索。\n\
  \n* * *\n\njava.util.Collections **1.2**\n\n- `static <T extends Comparable<? super\
  \ T>> int binarySearch(List<T> elements, T key)`\n- `static <T> int binarySearch(List<T>\
  \ elements, T key, Comparator<? super T> c)`\n在排序列表中查找键，如果元素类型实现了 `RandomAccess`\
  \ 接口，则使用线性搜索，在所有其他情况下使用二分查找。这些方法返回键在列表中的索引，或者如果键不在列表中，则返回负值 `i`。在这种情况下，键应该插入到索引\
  \ `-i - 1` 处以保持列表排序。\n\n* * *\n\n#### 13.4.3. 简单算法\n\n\n\n`Collections` 类包含了几个简单但实用的算法。其中就本节开头的示例——找到集合中的最大值。其他算法还包括将元素从一个列表复制到另一个列表、用常量值填充容器以及反转列表。为什么要在标准库中提供这些简单的算法呢？无疑大多数程序员都能轻易地用简单的循环来实现它们。我们之所以喜欢这些算法，是因为它们让*阅读*代码的程序员过得更轻松。当你阅读一个由别人实现的循环时，你必须去破解原始程序员的意图。当你看到像\
  \ `Collections.max` 这样的方法调用时，你一眼就能代码的功能。\n\n接下来的 API 注释描述了 `Collections` 类中的简单算法。\n\
  \n***\n\n### `java.util.Collections` **1.2**\n\n- `static <T extends Comparable<?\
  \ super T>> T min(Collection<T> elements)`\n- `static <T extends Comparable<? super\
  \ T>> T max(Collection<T> elements)`\n- `static <T> min(Collection<T> elements,\
  \ Comparator<? super T> c)`\n- `static <T> max(Collection<T> elements, Comparator<?\
  \ super T> c)`\n返回集合中最小或最大的元素。（参数边界为了清晰起见进行了简化。）\n\n- `static <T> void copy(List<?\
  \ super T> to, List<T> from)`\n将所有元素从源列表复制到目标列表的相同位置。目标列表的长度至少要与源列表。\n\n- `static\
  \ <T> void fill(List<?T> l, T value)`\n将列表的所有位置设置为相同的值。\n\n- `static <T> boolean\
  \ addAll(Collection<? super T> c, T... values)` **5.0**\n将所有值添加到给定的集合中，如果集合因此发生变化，则返回\
  \ `true`。\n\n- `static <T> boolean replaceAll(List<T> l, T oldValue, T newValue)`\
  \ **1.4**\n将所有等于 `oldValue` 的元素替换为 `newValue`。\n\n- `static int indexOfSubList(List<?>\
  \ l, List<?> s)` **1.4**\n- `static int lastIndexOfSubList(List<?> l, List<?> s)`\
  \ **1.4**\n返回 `l` 中等于 `s` 的第一个或最后一个子列表的索引，如果 `l` 中没有子列表等于 `s`，则返回 `-1`。例如，如果 `l`\
  \ 是 `[s, t, a, r]` 且 `s` 是 `[t, a, r]`，则两个方法都返回索引 `1`。\n\n- `static void swap(List<?>\
  \ l, int i, int j)` **1.4**\n交换给定偏移处的元素。\n\n- `static void reverse(List<?> l)`\n\
  反转列表中的元素顺序。例如，反转列表 `[t, a, r]` 得到列表 `[r, a, t]`。该方法在 O(*n*) 时间内运行，其中 *n* 是列表的长度。\n\
  \n- `static void rotate(List<?> l, int d)` **1.4**\n旋转列表中的元素，将索引为 `i` 的项移动到位置 `(i\
  \ + d) % l.size()`。例如，将列表 `[t, a, r]` 旋转 2 位将得到列表 `[a, r, t]`。该方法在 O(*n*) 时间内运行，其中\
  \ *n* 是列表的长度。\n\n- `static int frequency(Collection<?> c, Object o)` **5.0**\n返回\
  \ `c` 中等于 `o` 的元素计数。\n\n- `boolean disjoint(Collection<?> c1, Collection<?> c2)`\
  \ **5.0**\n如果集合没有共同元素，则返回 `true`。\n\n***\n\n#### 13.4.4 编写你自己的算法\n\n如果你编写了自己的算法（或者，实际上是任何以集合作为参数的方法），你应该尽可能与*接口*工作，而不是具体的实现。例如，假设你想用一组菜单项填充\
  \ `JMenu`。在传统上，这样的方法可能像像这样实现的：\n\n```java\nvoid fillMenu(JMenu menu, ArrayList<JMenuItem>\
  \ items) {\n  for (JMenuItem item : items) {\n    menu.add(item);\n  }\n}\n```\n\
  \n然而，你现在限制了调用者——调用者必须在 `ArrayList` 中提供选择项。接受一个更通用的集合要好得多。你应该问自己：能够胜任这项工作的最通用接口是什么？在这种情况下，你只需要访问所有元素，这是\
  \ `Collection` 接口的能力。以下是你如何重写 `fillMenu` 方法以接受任何种类的集合：\n\n```java\nvoid fillMenu(JMenu\
  \ menu, Collection<JMenuItem> items) {\n  for (JMenuItem item : items) {\n    menu.add(item);\n\
  \  }\n}\n```\n\n现在，任何人都可以使用 `ArrayList` 或 `LinkedList` 调用此方法，甚至可以使用用 `Arrays.asList`\
  \ 包装的数组调用。\n\n***\n\n![Image](img/image00948.jpeg) 注意如果使用集合接口作为方法参数是一个这么好的主意，为什么\
  \ Java 库不经常这样做呢？例如，`JComboBox` 类有两个构造函数：\n\n```java\nJComboBox(Object[] items)\n\
  JComboBox(Vector<?> items)\n```\n\n原因仅仅是时机问题。Swing 库是在集合库之前创建的。\n\n***\n\n如果你编写一个*返回*集合的方法，你可能也想返回一个接口而不是类，因为你就可以更改实现。例如，让我们写一个返回接口的\
  \ `getAllItems` 方法，它返回 `menu` 的所有项。\n\n```java\nList<JMenuItem> getAllItems(JMenu\
  \ menu) {\n  List<JMenuItem> items = new ArrayList<>();\n  for (int i = 0; i < menu.getItemCount();\
  \ i++) {\n    items.add(menu.getItem(i));\n  }\n  return items;\n}\n```\n\n稍后，你决定不想*复制*项，而是提供一个视图。你可以通过返回\
  \ `AbstractList` 的匿名子类来实现：\n\n```java\nList<JMenuItem> getAllItems(final JMenu menu)\
  \ {\n  return new AbstractList<>() {\n    public JMenuItem get(int i) {\n      return\
  \ menu.getItem(i);\n    }\n    public int size() {\n      return menu.getItemCount();\n\
  \    }\n  };\n}\n```\n\n当然，这是一种高级技术。如果你采用了它，请仔细说明支持哪些可选操作。在这种情况下，你必须告知调用者返回的对象是不可变的。\n\
  \n### 13.5 遗留集合\n\n在本节中，我们将讨论自 Java 语言开始就存在的集合类：`Hashtable` 类及其有用的子类 `Properties`、`Vector`\
  \ 的子类 `Stack` 以及 `BitSet` 类。\n\n#### 13.5.1 Hashtable 类\n\n经典的 `Hashtable` 类与 `HashMap`\
  \ 相同的服务，并具有基本相同的接口。就像 `Vector` 类的方法一样，`Hashtable` 的方法是同步的。如果你不需要同步或与遗留代码兼容，你应该使用\
  \ `HashMap`。\n\n***\n\n![Image](img/image00948.jpeg) 注意类的名称是 `Hashtable`，`t` 是小写的。在\
  \ Windows 下，如果你使用 `HashTable` 会得到奇怪的错误信息，因为 Windows 文件系统不区分大小写而 Java 编译器区分。\n\n\
  ***\n\n#### 13.5.2 枚\n\n遗留集合使用 `Enumeration` 接口遍历元素序列。`Enumeration` 接口有两个方法：`hasMoreElements`\
  \ 和 `nextElement`。这些与 `Iterator` 接口的 `hasNext` 和 `next` 方法完全对应。\n\n例如，`Hashtable`\
  \ 的 `elements` 方法产生一个枚举表中值的对象：\n\n```java\nEnumeration<Employee> e = staff.elements();\n\
  while (e.hasMoreElements()) {\n  Employee e = e.nextElement();\n  // ...\n}\n```\n\
  \n你偶尔会遇到需要枚举参数的遗留方法。静态方法 `Collections.enumeration` 产生一个枚举集合中元素的枚举对象。例如：\n\n\n\n\n\
  \n`List<InputStream> streams = . ..*;\n\n`SequenceInputStream in = new SequenceInputStream(Collections.enumeration(streams));`\n\
  \n// SequenceInputStream 构造函数期望一个枚举对象\n\n***\n\n![Image](img/image00948.jpeg) 备注\n\
  \n在 C++ 中，将迭代器作为参数是非常常见的。幸运的是，在 Java 平台上，很少有程序员使用这种惯用法。传递集合（collection）比传递迭代器要明得多。集合对象更有用。接收方在需要时可以从集合中获取迭代器，而且他们可以使用所有的集合方法。然而，你会在一些遗留代码中发现枚举（enumeration），因为在\
  \ Java SE 1.2 集合框架出现之前，它们是泛型集合的唯一可用机制。\n\n***\n\n### java.util.Enumeration<E> 1.0\n\
  \n• `boolean hasMoreElements()`\n如果有更多待检查的元素，则返回 `true`。\n\n• `E nextElement()`\n\
  返回下一个待检查的元素。如果 `hasMoreElements()` 返回 `false`，则不要调用此方法。\n\n***\n\n### java.util.Hashtable<K,\
  \ V> 1.0\n\n• `Enumeration<K> keys()`\n返回一个遍历哈希表键（keys）的枚举对象。\n\n• `Enumeration<V>\
  \ elements()`\n返回一个遍历哈希表元素（elements）的枚举对象。\n\n***\n\n### java.util.Vector<E> 1.0\n\
  \n• `Enumeration<E> elements()`\n返回一个遍历 vector 元素的枚举对象。\n\n***\n\n### 13.5.3. 属性映射\
  \ (Property Maps)\n\n`property map` 是一种非常特殊的映射结构。它有三个特点：\n\n• 键和值都是字符串。\n• 表格可以保存到文件并从文件中加载。\n\
  • 使用一个用于默认值的二级表。\n\n实现属性映射的 Java 平台类被称为 `Properties`。\n\n属性映射通常用于指定程序的配置选项——参见第\
  \ 10 章。\n\n***\n\n### java.util.Properties 1.0\n\n• `Properties()`\n创建一个空的属性映射。\n\
  \n• `Properties(Properties defaults)`\n创建一个带一组默认值的空属性映射。\n\n• `String getProperty(String\
  \ key)`\n获取属性关联；返回与键关联的字符串，如果映射中不存在该键，则返回默认表中该键的字符串。\n\n• `String getProperty(String\
  \ key, String defaultValue)`\n如果未找到键，则获取带有默认值的属性；返回与键关联的字符串，如果映射中不存在该键则返回默认字符串。\n\
  \n• `void load(InputStream in)`\n从 `InputStream` 加载属性映射。\n\n• `void store(OutputStream\
  \ out, String commentString)`\n将属性映射存储到 `OutputStream`。\n\n***\n\n### 13.5.4. 栈\
  \ (Stacks)\n\n从 1.0 版本开始，标准库就有一个 `Stack` 类，它拥有熟悉的 `push` 和 `pop` 方法。然而，`Stack` 类继承了\
  \ `Vector` 类，这从理论角度来看并不令人满意——你可以应用诸如非栈操作的操作（如 `insert` 和 `remove`）在任何位置插入和删除值，而不仅仅是在栈顶。\n\
  \n***\n\n### java.util.Stack<E> 1.0\n\n• `E push(E item)`\n将 `item` 推入栈中并返回 `item`。\n\
  \n• `E pop()`\n弹出并返回栈顶元素。如果栈为空，则不要调用此方法。\n\n• `E peek()`\n返回栈顶元素但不弹出它。如果栈为空，则不要调用此方法。\n\
  \n***\n\n### 13.5.5. 位集 (Bit Sets)\n\nJava 平台的 `BitSet` 类存储一个位序列。（它并不是数学意义上的*set*[集合]——位*vector*\
  \ 向量或位*array* 数组是更合适的术语。）如果你需要高效地存储位序列（例如标志位），请使用位集。位集将位打包到字节中，因此使用位集比使用包含 `Boolean`\
  \ 对象的 `ArrayList` 效率高得多。\n\n`BitSet` 类为你提供了一个方便的接口，用于读取、设置和重置单个位。使用该接口可以避免在在 `int`\
  \ 或 `long` 变量中存储位时所需的掩码和其他位位位操作。\n\n例如，对于一个名为 `bucketOfBits` 的 `BitSet`，\n\n```\n\
  bucketOfBits.get(i)\n```\n如果第 `i` 位开启，则返回 `true`，否则返回 `false`。同样，\n\n```\nbucketOfBits.set(i)\n\
  ```\n将第 `i` 位开启。最后，\n\n```\nbucketOfBits.clear(i)\n```\n将第 `i` 位关闭。\n\n***\n\n![Image](img/image00951.jpeg)\
  \ C++ 备注\n\nC++ 的 `bitset` 模板与 Java 平台的 `BitSet` 相同的功能。\n\n***\n\n### java.util.BitSet\
  \ 1.0\n\n• `BitSet(int initialCapacity)`\n构造一个位集。\n\n• `int length()`\n返回位集的“逻辑长度”：`1`\
  \ 加上最高设置位的索引。\n\n• `boolean get(int bit)`\n获取一个位。\n\n• `void set(int bit)`\n设置一个位。\n\
  \n• `void clear(int bit)`\n清除一个位。\n\n• `void and(BitSet set)`\n将此位集与另一个位集进行逻辑与（AND）运算。\n\
  \n• `void or(BitSet set)`\n将此位集与另一个位集进行逻辑或（OR）运算。\n\n• `void xor(BitSet set)`\n\
  将此位集与另一个位集进行逻辑异或（XOR）运算。\n\n• `void andNot(BitSet set)`\n清除此位集中所有在另一个位集中已设置的位。\n\
  \n#### 13.5.5.1. “埃拉托尼筛法”基准测试\n\n作为位集的示例，我们想向你展示一种寻找质数的“埃拉托尼筛法”算法实现。（质数是一个像 2、3\
  \ 或 5 这样只能被自身和 1 整除的，而埃拉托尼筛法是最早发现的枚举这些基本构建单元的方法之一。）这对于寻找质数并不是一个很好的算法，但由于某种原因，它变成了一个流行的基准测试（它也不是好的基准测试，因为它主要测试位操作。）\n\
  \n好吧，我们提供一个实现。这个程序计算 2 到 2,000,000 之间的所有质数。\n\n\n\n\n```cpp\n#include <ctime>\n\
  using namespace std;\n\nint main()\n{\n    const int N = 2000000;\n    clock_t cstart\
  \ = clock();\n\n    bitset<N + 1> b;\n    int count = 0;\n    int i;\n    for (i\
  \ = 2; i <= N; i++)\n        b.set(i);\n    i = 2;\n    while (i * i <= N)\n   \
  \ {\n        if (b.test(i))\n        {\n            count++;\n            int k\
  \ = 2 * i;\n            while (k <= N)\n            {\n                b.reset(k);\n\
  \                k += i;\n            }\n        }\n        i++;\n    }\n    while\
  \ (i <= N)\n    {\n        if (b.test(i))\n            count++;\n        i++;\n\
  \    }\n\n    clock_t cend = clock();\n    double millis = 1000.0 * (cend - cstart)\
  \ / CLOCKS_PER_SEC;\n\n    cout << count << \" primes\\n\" << millis << \" milliseconds\\\
  n\";\n\n    return 0;\n}\n```\n\n![Image](img/image00948.jpeg) Note\n\n尽管筛法并不是一个很好的基准测试，但我们还是忍不住对该算法的两种实现进行了计时。以下是在一台运行\
  \ Ubuntu 10.04 的 2.4-GHz 双核、4 GB 内存 ThinkPad 上的计时结果。\n\n* C++ (`g++` `4.6.3`): 160\
  \ 毫秒\n* Java (`Java SE 7`): 84 毫秒\n\n我们已经在八版 *Core Java* 中运行过此测试，在最近四个版本中，Java 轻松胜过\
  \ C++。公平地说，如果提高 C++ 编译器的优化级别，它将以 20 毫秒的时间击败 Java。只有当程序运行足够长以触发 Hotspot 即时编译器（JIT\
  \ compiler）时，Java 才能与之匹配。\n\n* *\n\n到这里我们就完成了对 Java 集合框架的介绍。正如你所看到的，Java 库提供了多种集合类来满足你的编程需求。在本书的最后一章中，我们将涵盖并发编程这一重要主题。\n\
  \n## 第 14 章 多线程\n\n在本章中：\n\n* 什么是线程？\n* 中断线程\n* 线程状态\n* 线程属性\n* 同步\n* 阻塞队列\n* 线程安全的集合\n\
  * Callable 和 Future\n* 执行器 (Executors\n* 同步器 (Synchronizers\n* 线程与 Swing\n\n* *\
  \ *\n\n你可能对*多任务*（multitasking）很熟悉——即操作系统运行多个进程的能力。多线程通过在单个进程内运行多个线程来扩展这一概念。\n\n\
  ### *进程*与*线程*之间的区别\n\n那么，*进程*和*线程*之间的区别是什么？进程是程序的执行实例。线程是进程中的执行单元。一个进程可以拥有多个线程，这些线程共享相同的内存空间。这使得线程之间的通信变得简单得多，但也意味着一个线程可能会导致整个进程崩溃。\n\
  \n### 14.1. 什么是线程？\n\n让我们先看一个没有使用线程的程序。一旦你点击“开始”按钮，程序会在屏幕左角弹出一个球，球开始弹跳。开始按钮的处理器调用\
  \ `addBall` 方法。该方法包含一个运行 1000 次移动的循环。每次调用 `move` 都会让球移动一小段，在碰撞墙壁时调整方向，并重绘面板。\n\n\
  ![Image](img/image1224.jpeg)\n图 14.1. 使用线程制作球的动画\n\n如果你仔细查看本节末尾的代码，你会注意到内部调用了 `comp.paint(comp.getGraphics())`——在通常情况下，你会调用\
  \ `repaint` 并让 AWT 负责获取图形上下文并进行绘图。但如果你在这个程序中尝试调用 `comp.repaint()`，你会发现面板只有在 `addBall`\
  \ 方法返回后才会被重绘。\n\n```java\nBall ball = new Ball();\npanel.add(ball);\n\nfor (int\
  \ i = 1; i <= STEPS; i++)\n{\n    ball.move(panel.getBounds());\n    panel.paint(panel.getGraphics());\n\
  \    Thread.sleep(DELAY);\n}\n```\n\n调用 `Thread.sleep` 并不会创建新——`sleep` 是 `Thread`\
  \ 类的一个静态方法，用于让当前线程临时停止指定的毫秒数。`sleep` 方法可能会抛出 `InterruptedException`。我们稍后会讨论这个异常及其适当的处理方法。目前，如果发生此异常，我们直接终止弹跳。\n\
  \n如果你运行该程序，球弹跳得很漂亮，但它完全接管了应用程序。如果你在球完成 1000 次移动之前就厌倦了并点击了“关闭”按钮，球仍然会继续弹跳。在球停止弹跳之前，你无法与程序进行交互。\n\
  \n\n\n\n显然，这个程序的行为相当糟糕。当你要求程序执行耗时时间的任务时，你并不希望你正在使用的程序以这种方式运行。毕竟，当你通过网络连接读取数据时，被困在某个你*真的*想要中断的任务中是非常常见的现象。例如，假设你正在下载一张大图片，在看到其中一部分后，你决定不再需要也不想看剩余部分了；你肯定希望能够点击“停止”或“返回”按钮来中断加载过程。在下一节中，我们将向你展示如何通过在单独的`thread`线程中运行代码的关键部分，来让用户保持控制权。\n\
  \n代码列表 14.1 到 14.3 显示了该程序的代码。\n\n### 列表 14.1. `bounce/Bounce.java`\n\n点击此处查看代码图片\n\
  \n```java\npackage bounce;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
  \ javax.swing.*;\n\n/**\n * 显示一个动画跳动的球。\n * @version 1.33 2007-05-17\n * @author\
