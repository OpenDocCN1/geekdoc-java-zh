  \ key, String value)`\n- `void putInt(String key, int value)`\n- `void putLong(String\
  \ key, long value)`\n- `void putFloat(String key, float value)`\n- `void putDouble(String\
  \ key, double value)`\n- `void putBoolean(String key, boolean value)`\n- `void putByteArray(String\
  \ key, byte[] value)`\n\n在此节点中存储一个键/值对。\n\n- `void exportSubtree(OutputStream out)`\n\
  \n将此节点及其所有子节点的偏好写入指定的流中。\n\n- `void exportNode(OutputStream out)`\n\n将此节点（但不包括其子节点）的偏好写入指定的流中。\n\
  \n- `void importPreferences(InputStream in)`\n\n导入指定流中包含的偏好。\n\n***\n\n关于 Java 软件部署的讨论到此结束。在下一章，你将学习如何使用异常，在运行时出现问题时告诉程序应该做什么。我们还将为你提供测试和调试的技巧与技术，以确保你的程序在运行时不会出现太多问题。\n\
  \n# 第 11 章 异常、断言、日志与调试\n\n***\n\n## 本章\n\n- 处理错误\n- 捕获异常\n- 使用异常的技巧\n- 使用断言\n- 日志记录\n\
  - 调试技巧\n- GUI 程序排故障的技巧\n- 使用调试器\n\n***\n\n在一个完美的世界里，用户永远不会以错误的格式输入数据，他们选择打开的文件始终存在，代码也永远没有\
  \ bug。到目前为止，我们展示代码的方式大多就像我们生活在这样一个完美世界中。现在是时候转向 Java 编程语言中处理糟糕数据和错误代码等真实世界的机制了。\n\
  \n遇到错误是不令人愉快的。如果用户因为编程错误或某些外部情况丢失了他在程序运行期间的所有工作，那么该用户可能会永远离开你的程序。至少，你必须：\n\n- 通知用户错误；\n\
  - 保存所有工作；并且\n- 允许用户优雅地退出程序。\n\n对于异常情况（例如可能导致程序崩溃的错误输入数据），Java 使用了一种错误捕获机制，自然而然地被称为`异常处理`。Java\
  \ 中的异常处理与 C++ 或 Delphi 类似。本章的第一部分将介绍 Java 异常。\n\n在测试期间，你需要运行许多检查以确保你的程序执行正确。但这些检查在测试完成后可能是耗时且没必要的。你可以直接移除这些检查，并在需要额外测试时再把它们加回来——但那是很麻烦的。本章的第二部分将向你展示如何使用断言来选择性地激活检查。\n\
  \n当你的程序执行错误时，你并不总是能与用户通信或终止。相反，你可能想记录问题以备日后分析。本章的第三部分将讨论标准的 Java 日志框架。\n\n最后，我们将为你提供一些技巧，教你如何从运行中的\
  \ Java 应用程序获取有用信息，以及如何使用 IDE 调试器。\n\n### 11.1. 处理错误\n\n假设 Java 程序在运行时发生了错误。该错误可能是由包含错误信息的文件、不稳定的网络连接，或者（我们不想提）使用无效的数组索引，或尝试使用尚未赋值给对象的引用引起的。用户期望程序在发生错误时表现得明智。如果某个操作因为错误而无法完成，程序应该：\n\
  \n- 回到安全状态并允许用户执行其他命令；\n- 允许用户保存所有工作并优雅地退出程序。\n\n这可能并不容易，因为检测（甚至导致）错误条件的代码通常与可以将数据回滚到安全状态的代码，或可以保存用户工作并愉快退出的代码相隔遥。异常处理的任务是将控制权从错误发生的地方转移到可以处理这种情况的错误处理程序。为了处理程序中的异常情况，你必须考虑到可能发生的错误和问题。你需要考虑哪些问题？\n\
  \n- **用户输入错误。** 除了不可避免的拼写错误外，有些用户喜欢自辟蹊径，而不是遵循指示。例如，假设用户请求连接到一个语法上错误的 URL。你的代码应该检查语法，但假设它没有检查。那么网络层将会报错。\n\
  - **设备错误。** 硬件并不总是按照你想要的方式工作。打印机可能关闭了。网页可能暂时不可用。设备经常会在任务中间失败。\n- **物理限制。** 磁盘可能会满；你可能会内存内存。\n\
  - **代码错误。** 方法可能执行不正确。例如计算无效的数组索引、在哈希表中查找不存在的条目或从空栈弹出都是代码错误的示例。\n\n对错误的传统反应是返回一个错误代码，由调用方法进行分析。例如，从文件读取信息的方法通常返回一个\
  \ `-1` 文件结束标记，而不是标准字符。这是处理许多异常情况的有效方法。另一种表示错误状况的常见返回值是 `null`。\n\n不幸的是，并不总是能够返回错误代码。可能没有明显的方法来区分有效数据无效。返回整数的方法不能简单的返回\
  \ `-1` 来表示错误；`-1` 可能是一个完全有效的结果。\n\n相反，正如我们在 5 中提到的，Java 为无法以正常方式完成任务每个方法提供了另一种退出路径。在这种情况下，方法不返回值。相反，它抛出一个封装了错误信息的对象。注意，方法立即退出；不会返回其正常（或任何）值。此外，执行不会在调用方法的代码处继续；而是异常处理机制开始寻找可以处理这种特定错误条件的`异常处理器*。\n\
  \n异常有自己的语法，并属于一个特殊的层次结构。我们将先介绍语法，然后提供一些有效使用此语言特性的提示。\n\n#### 11.1.1. 异常的分类\n\n在\
  \ Java 编程语言中，异常对象总是派自 `Throwable` 类的实例。正如你很快看到的，如果 Java 内的类不能满足需求，你可以创建自己的异常类。\n\
  \n图 11.1 是 Java 异常层次结构的简化示意图。\n\n![Image](img/image01186.jpeg)\n\n图 11.1. Java 异常层次结构\n\
  \n注意所有异常都派自 `Throwable`，但层次结构立即分为两个分支：`Error` 和 `Exception`。\n\n\n\n\n\n`Error`\
  \ 层次结构描述了 Java 运行系统内部的内部错误和资源耗尽的情况。你不应该抛出此类类型的对象。如果发生此类内部错误，除了通知用户并尝试优雅地终止程序外，你无能为力。这些情况非常罕见。\n\
  \n在进行 Java 编程时，你关注的是 `Exception` 层次结构。`Exception` 层次结构也分为两个分支：派自 `RuntimeException`\
  \ 的异常和不派自它的异常。通用规则是：`RuntimeException` 的发生是因为你犯了编程错误。任何其他异常的发生是因为某些坏事（例如 I/O 错误）发生在了你原本运行良好的程序上。\n\
  \n继承自 `RuntimeException` 的异常包括此类问题：\n\n* 错误的类型转换\n* 数组越界访问\n* 空指针解引用\n\n不继承自 `RuntimeException`\
  \ 的异常包括：\n\n* 尝试读取文件末尾之后\n* 尝试打开不存在的文件\n* 尝试为一个不表示已存在类的字符串查找 `Class` 对象\n\n“如果是\
  \ `RuntimeException`，那就是你的错”这个规则相当有效。你可以通过通过检查数组索引是否在数组边界范围内避免那个 `ArrayIndexOutOfBoundsException`。如果你在使用变量之前检查了它是否为\
  \ `null`，那么 `NullPointerException` 就不会发生。\n\n那么不存在的文件呢？你难道不能先检查文件是否存在，然后再打开它吗？嗯，文件可能在你检查其存在性后立即被删除了。因此，“存在性”的概念取决于环境，而不仅仅取决于你的代码。\n\
  \nJava 语言规范将任何派自 `Error` 类或 `RuntimeException` 类的异常称为*未检查*（unchecked）异常。所有其他异常都被称为*已检查*（checked）异常。这是我们也采用的有用术语。编译器会检查你是否为所有已检查异常提供了异常处理器。\n\
  \n* * *\n\n![Image](img/image00948.jpeg) 注意\n\n`RuntimeException` 这个名字有点让人困惑。当然，我们正在讨论的所有错误都发生在运行时。\n\
  \n* * *\n\n* * *\n\n![Image](img/image00951.jpeg) C++ 注意\n\n如果你熟悉标准 C++ 库中（局限得多的）异常层次结构，你在这里可能会感到非常困惑。C++\
  \ 有两个基础异常类：`runtime_error` 和 `logic_error`。`logic_error` 类等于 Java 的 `RuntimeException`，也表示程序中的逻辑错误。`runtime_error`\
  \ 类是由不可预测问题引起的异常的基类。它等于 Java 中那些不是 `RuntimeException` 类型的异常。\n\n* * *\n\n#### 11.1.2\
  \ 声明已检查异常\n\n当 Java 方法遇到它无法处理的情况时，它可以抛出异常。这个想法很简单：方法不仅会告诉 Java 编译器它能返回什么值，*它还会告诉编译器可能会出现什么问题。*例如，尝试从文件读取的代码知道文件可能不存在或可能为空。因此，尝试处理文件中信息的代码需要通知编译器它可能会抛出某种\
  \ `IOException`。\n\n你宣告你的方法可以抛出异常的地方是方法的头部；头部会更改以反映方法可以抛出的已检查异常。例如，这里是标准库中 `FileInputStream`\
  \ 类的一个构造函数的声明。（有关流的更多信息，请参见第 12 章\n\n```java\npublic FileInputStream(String name)\
  \ throws FileNotFoundException\n```\n\n该声明表示此构造函数根据 `String` 参数产生一个 `FileInputStream`\
  \ 对象，但它*也*可能以特殊方式出错——通过抛出一个 `FileNotFoundException`。如果发生了这种不幸的情况，构造函数的调用将不会初始化一个新的\
  \ `FileInputStream` 对象，而是抛出一个 `FileNotFoundException` 类的对象。如果发生了这种情况，运行系统将开始寻找知道如何处理\
  \ `FileNotFoundException` 对象的异常处理器。\n\n当你编写自己的方法时，你不需要宣告你的方法实际上可能抛出的每一个可能的待抛出对象。要理解在何时（以及需要什么）你必须在所写方法的\
  \ `throws` 子句中进行声明，请记住在以下四种情况的任何一种情况下都会抛出异常：\n\n* 你调用了一个抛出已检查异常的方法——例如，`FileInputStream`\
  \ 构造函数。\n* 你检测到一个错误并使用 `throw` 语句抛出已检查异常（我们将在下一节中介绍 `throw` 语句）。\n* 你犯了编程错误，例如 `a[-1]\
  \ = 0` 导致了未检查的异常（在这种情况下，是 `ArrayIndexOutOfBoundsException`）。\n* 虚拟机或运行时库中发生了内部错误。\n\
  \n如果发生了前两种情况之一，你必须告诉使用你方法的程序员关于异常的可能性。为什么？任何抛出异常的方法都是一个潜在的死亡陷阱。如果没有处理器捕获该异常，当前的执行线程将终止。\n\
  \n与属于提供的类中的 Java 方法一样，你在方法头部通过*异常规格*来声明你的方法可能抛出异常。\n\n点击此处查看代码图像\n\n```java\nclass\
  \ MyAnimation\n{\n    . . .\n    public Image loadImage(String s) throws IOException\n\
  \    {\n      . . .\n    }\n}\n```\n\n如果一个方法可能抛出多个已检查异常，你必须在头部中列出所有异常类。用逗号分隔它们，如下例：\n\
  \n点击此处查看代码图像\n\n```java\nclass MyAnimation\n{\n    . . .\n    public Image loadImage(String\
  \ s) throws FileNotFoundException, EOFException\n    {\n      . . .\n    }\n}\n\
  ```\n\n然而，你不需要宣告内部错误——即派自 `Error` 的异常。任何代码都可能抛出这些异常，而且它们完全不受你的控制。\n\n同样，你不应该宣告派自\
  \ `RuntimeException` 的未检查异常。\n\n点击此处查看代码图像\n\n```java\nclass MyAnimation\n{\n  \
  \  . . .\n    void drawImage(int i) throws ArrayIndexOutOfBoundsException // 坏风格\n\
  \    {\n      . . .\n    }\n}\n```\n\n这些运行时错误完全在你的范围内。如果你如此担心数组索引错误，你应该花时间修复它们，而不是宣告它们可能发生的可能性。\n\
  \n总结，方法必须声明它可能抛出的所有*已检查*异常。未检查异常要么是你无法控制的（`Error`），要么是由你不应该允许的情况导致的（`RuntimeException`）。如果你的方法未能忠实声明所有已检查异常，编译器将发出错误信息。\n\
  \n当然，正如你已经在许多示例中看到的，除了声明异常外，你也可以捕获它。这样异常就不会抛出方法，因此不需要 `throws` 规格。你将在本章的晚些部分看到如何决定捕获异常还是让其他人来捕获。\n\
  \n* * *\n\n![Image](img/image00950.jpeg) 警告\n\n\n\n\n\n如果你重写了父类中的方法，那么子类方法声明的检查异常（checked\
  \ exceptions）不能比父类方法的声明异常更通用。（在子类方法中抛出更具体的异常或不抛出任何异常都是可以的。）特别是，如果父类方法完全没有抛出任何检查异常，子类方法也不能有。例如，如果你重写了\
  \ `JComponent.paintComponent`，那么你的 `paintComponent` 方法就不能抛出任何检查异常，因为父类方法没有抛出任何异常。\n\
  \n***\n\n当类中的方法声明它抛出一个是特定类实例的异常时，那么它可能会抛出该类或其任何子类的类的异常。例如，`FileInputStream` 构造函数可能声明它抛出一个\
  \ `IOException`。在这种情况下，你将不知道它是哪种 `IOException`；它可能是一个普通的 `IOException`，也可能是各种子类中的一个对象，例如\
  \ `FileNotFoundException`。\n\n***\n\n![Image](img/image0095.jpeg) C++ Note\n\n`throws`\
  \ 标识符与 C++ 中的 `throw` 标识符相同，但有一个重要的区别。在 C++ 中，`throw` 标识符是在运行时强制的，而不是在编译时。也就是说，C++\
  \ 编译器不关注异常规范。但如果在一个不在 `throw` 列表的函数中抛出了异常，就会调用 `unexpected` 函数，并且默认情况下程序将终止。\n\n\
  此外，在 C++ 中，如果没有给出 `throw` 规范，函数可以抛出任何异常。在 Java 中，没有 `throws` 标识符的方法可能抛出任何检查异常。\n\
  \n***\n\n#### 11.1.3 如何抛出异常\n\n现在，假设你的代码中发生了某些糟糕的事情。你有一个方法 `readData`，它正在读取一个文件，该文件的头承诺了\n\
  \nContent-length: 1024\n\n但你在读取 733 个字符后就遇到了文件末尾。你可能认为这种情况非常异常，以至于你想抛出一个异常。\n\n\
  你需要决定抛出什么类型的异常。某种类型的 `IOException` 会是一个不错的选择。查阅 Java API 文档，你发现了一个 `EOFException`，其描述为“信号在输入过程中意外到达\
  \ EOF”。完美。以下是抛出它的方式：\n\n```\nthrow new EOFException();\n```\n\n或者，如果你愿意，\n\n```java\n\
  EOFException e = new EOFException();\nthrow e;\n```\n\n以下是这一切是如何结合的：\n\n```java\n\
  String readData(Scanner in) throws EOFException\n{\n    . . .\n    while (. . .)\n\
  \    {\n        if (!in.hasNext()) // 遇到 EOF\n        {\n            if (n < len)\n\
  \                throw new EOFException();\n        }\n        . . .\n    }\n  return\
  \ s;\n}\n```\n\n`EOFException` 有一个接受字符串参数的第二个构造函数。你可以通过更详细地描述异常情况来充分利用它。\n\n点击此处查看代码图像\n\
  \n```java\nString gripe = \"Content-length: \" + len + \", Received: \" + n;\nthrow\
  \ new EOFException(gripe);\n```\n\n如你所见，如果现有的异常类之一适用于你，抛出异常是非常简单。在这种情况下：\n\n1. 找到一个合适的异常类。\n\
  2. 创建该类的对象。\n3. 抛出它。\n\n一旦方法抛出异常，它就不会返回到调用者处。这意味着你不需要担心编写一个默认返回值或错误代码。\n\n***\n\n\
  ![Image](img/image0095.jpeg) C++ Note\n\n抛出异常在 C++ 和 Java 中是相同的，但有一个微小的区别。在 Java\
  \ 中，你只能抛出 `Throwable` 子类的类的对象。在 C++ 中，你可以抛出任何类型的值。\n\n***\n\n#### 11.1.4 创建异常类\n\
  \n你的代码可能会遇到一个任何标准异常类都无法充分描述的问题。在这种情况下，创建你自己的异常类是非常简单的。只需继承自 `Exception` 或 `Exception`\
  \ 的子类（如 `IOException`）。按照惯例，应提供一个默认构造函数和一个包含详细消息的构造函数。（`Throwable` 父类的 `toString`\
  \ 方法返回一个包含该详细消息的字符串，这对于调试非常有帮助。）\n\n点击此处查看代码图像\n\n```java\nclass FileFormatException\
  \ extends IOException\n{\n    public FileFormatException() {}\n    public FileFormatException(String\
  \ gripe)\n    {\n        super(gripe);\n    }\n}\n```\n\n现在你准备好抛出你自己的异常类型了。\n\n\
  点击此处查看代码图像\n\n```java\nString readData(BufferedReader in) throws FileFormatException\n\
  {\n    . . .\n    while (. . .)\n    {\n        if (ch == -1) // 遇到 EOF\n      \
  \  {\n            if (n < len)\n                throw new FileFormatException();\n\
  \        }\n        . . .\n    }\n  return s;\n}\n```\n\n***\n\njava.lang.Throwable\
  \ **1.0**\n\n- `Throwable()` 构造一个新的没有详细消息的 `Throwable` 对象。\n- `Throwable(String\
  \ message)` 构建构造带有指定详细消息的 `Throwable` 对象。按照惯例，所有派生的异常类都支持默认构造函数和带有详细消息的构造函数。\n-\
  \ `String getMessage()` 获取 `Throwable` 对象的详细消息。\n\n***\n\n### 11.2 捕异常\n\n你现在知道如何抛出异常了。这很简单：你抛出它，然后忘记它。当然，有些代码必须捕获该异常。捕获异常需要更多的计划。\n\
  \n如果发生的异常没有在任何地方被捕获，程序将终止并在控制台上打印消息，给出异常类型和堆栈跟踪。GUI 程序（包括 applet 和应用程序）会捕获异常、打印堆栈跟踪消息，然后返回用户界面处理循环。（当你调试\
  \ GUI 程序时，最好让控制台留在屏幕上而不要最小化。）\n\n要捕获异常，请设置一个 `try/catch` 块。`try` 块的最简单形式如下：\n\n\
  ```java\ntry\n{\n    代码\n    更多代码\n    更多代码\n}\ncatch (ExceptionType e)\n{\n   \
  \ 针对该类型的处理程序\n}\n```\n\n如果 `try` 块内部的任何代码抛出了 `catch` 子句中指定的类的异常，那么：\n\n1. 程序将跳过\
  \ `try` 块中剩余的代码。\n2. 程序将执行 `catch` 子句内部的处理程序。\n\n如果 `try` 块内部没有代码抛出异常，则程序将跳过 `catch`\
  \ 子句。\n\n如果方法中的任何代码抛出了与 `catch` 子句中命名的类型不同的异常，该方法将立即退出。（希望它的某个调用者已经提供了一个 `catch`\
  \ 子句。）\n\n为了展示这一工作，这里有一段读取数据的相当典型的代码：\n\n点击此处查看代码图像\n\n```java\npublic void read(String\
  \ filename)\n{\n    try\n    {\n        InputStream in = new FileInputStream(filename);\n\
  \        int b;\n        while ((b = in.read()) != -1)\n        {\n            处理输入\n\
  \        }\n    }\n    catch (IOException exception)\n    {\n        exception.printStackTrace();\n\
  \    }\n}\n```\n\n注意 `try` 子句中的大部分代码是直观的：它读取并处理字节直到遇到文件末尾。通过查看 Java API 可以看出，`read`\
  \ 方法可能会出一个 `IOException`。在这种情况下，我们跳出整个 `while` 循环，进入 `catch` 子句并生成堆栈跟踪。对于玩具程序来说，这似乎是处理异常的合理方法。你还有其他选择吗？\n\
  \n通常，最好的选择是什么都不做，简单地将异常传递给调用者。如果 `read` 方法中发生了错误，让调用 `read` 方法的调用者去担心吧！如果我们采取这种方法，那么我们必须宣布该方法可能会抛出\
  \ `IOException`。\n\n点击此处查看代码图像\n\n\n\n\n\n```java\npublic void read(String filename)\
  \ throws IOException\n{\n    InputStream in = new FileInputStream(filename);\n \
  \   int b;\n    while ((b = in.read()) != -1)\n    {\n        process input\n  \
  \  }\n}\n```\n\n请记住，编译器会强制执行 `throws` 规格。如果你调用了一个抛出受检异常（checked exception）的方法，你必须处理它，要么将其传递下去。\n\
  \n这两者中哪种更好？作为一个一般原则，你应该捕获那些你知道如何处理的异常，并传播那些你不知道如何处理的异常。\n\n当你传播一个异常时，必须添加一个 `throws`\
  \ 规格，以提醒调用者可能会抛出异常。\n\n查看 Java API 文档以了解哪些方法抛出了哪些异常。然后决定你是应该处理它们，还是将它们添加到 `throws`\
  \ 列表中。选择后者并不可不可耻。将异常直接交给一个胜任的处理器，总比将其扼杀（squelch）要好。\n\n请记住，正如我们之前提到的，这条规则有一个例外。如果你正在编写的方法重写了父类方法，而该父类方法没有抛出任何异常（例如\
  \ `JComponent` 中的 `paintComponent`），那么你 `必须` 捕获方法代码中的每个受检异常。你不允许为子类方法添加比父类方法更多的\
  \ `throws` 规格。\n\n***\n\n![Image](img/image00951.jpeg) C++ 注意\n\n在 Java 和 C++ 中，捕获异常几乎相同。严格来说，以下代码等价于：\n\
  \n```java\ncatch (Exception e) // Java\n```\n\n```cpp\ncatch (Exception& e) // C++\n\
  ```\n\nJava 中没有 C++ `catch (...)` 的等价物。这在 Java 中不需要，因为所有异常都派自一个公共父类。\n\n***\n\n\
  #### 11.2.1 捕获多个异常\n\n你可以在 `try` 块中捕获多种异常类型，并区别地处理每种类型。如下例，为每个类型使用单独的 `catch` 子句：\n\
  \n```java\ntry\n{\n    code that might throw exceptions\n}\ncatch (FileNotFoundException\
  \ e)\n{\n    emergency action for missing files\n}\ncatch (UnknownHostException\
  \ e)\n{\n    emergency action for unknown hosts\n}\ncatch (IOException e)\n{\n \
  \   emergency action for all other I/O problems\n}\n```\n\n异常对象可能包含有关异常性质的信息。要获取更多关于对象的信息，尝试使用\
  \ `e.getMessage()` 获取详细的错误信息（如果有），或使用 `e.getClass().getName()` 获取异常对象的实际类型。\n\n\
  从 Java SE7 开始，你可以在同一个 `catch` 子句中捕获多种异常类型。例如，假设处理缺失文件和未知主机的操作是相同的。那么你可以合并 `catch`\
  \ 子句：\n\n```java\ntry\n{\n    code that might throw exceptions\n}\ncatch (FileNotFoundException\
  \ | UnknownHostException e)\n{\n    emergency action for missing files and unknown\
  \ hosts\n}\ncatch (IOException e)\n{\n    emergency action for all other I/O problems\n\
  }\n```\n\n此特性只有在捕获互不为子类关系的异常类型时才需要。\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\
  \n当你捕获多个异常时，异常变量是隐式的 `final`。例如，你不能在子句体中为 `e` 赋值不同的值\n\n```java\ncatch (FileNotFoundException\
  \ | UnknownHostException e) { ... }\n```\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n捕获多个异常不仅让你的代码看起来更简单，而且更高效。生成的字节码包含一个共享 `catch` 子句的单一块。\n\n***\n\n#### 11.2.2\
  \ 重新抛出和异常链\n\n你可以在 `catch` 子句中抛出异常。通常，当你想要更改异常类型时会这样做。如果你构建了一个其他程序员使用的子系统，使用一个指示子系统失败的异常类型是有意义的。这种异常类型的一个示例是\
  \ `ServletException`。执行 servlet 的代码可能不想知道发生了什么问题，但它确实想知道是 servlet 出了错。\n\n以下是如何捕获异常并重新抛出异常：\n\
  \n```java\ntry\n{\n    access the database\n}\ncatch (SQLException e)\n{\n    throw\
  \ new ServletException(\"database error: \" + e.getMessage());\n}\n```\n\n在这里，`ServletException`\
  \ 是使用异常的文本消息构造的。\n\n然而，将原始异常设置为新异常的“原因”（cause）是一个更好的想法：\n\n```java\ntry\n{\n   \
  \ access the database\n}\ncatch (SQLException e)\n{\n    Throwable se = new ServletException(\"\
  database error\");\n    se.initCause(e);\n    throw se;\n}\n```\n\n***\n\n![Image](img/image0949.jpeg)\
  \ 提示\n\n当发生受检异常时，包装技术也有用。你可以捕获受检异常并封装成运行时异常。\n\n***\n\n有时，你只是想记录异常并在进行任何更改的情况下重新抛出它：\n\
  \n```java\ntry\n{\n    access the database\n}\ncatch (Exception e)\n{\n    logger.log(level,\
  \ message, e);\n    throw e;\n}\n```\n\n在 Java 7 之前，这种方法存在问题。假设代码位于方法 `public void\
  \ updateRecord() throws SQLException` 内部\n\nJava 编译器查看 `catch` 块中的 `throw` 语句，查看\
  \ `e` 的类型，并抱怨该方法可能会抛出 `Exception`，而不只是 `SQLException`。这现在得到了改进。编译器现在跟踪 `e` 源自 `try`\
  \ 块。只要该块中的受检异常只有 `SQLException`，并且 `e` 在 `catch` 块中没有被更改，声明封装的方法为 `throws SQLException`\
  \ 就是有效的。\n\n#### 11.2.3 finally 子句\n\n当代码抛出异常时，它会停止方法中的后续代码并退出方法。如果方法获取了只有该方法才知道局部资源，且该资源必须被清理，就会有问题。一种解决方案是捕获并重新抛所有异常。但这种解决方案很繁琐，因为你需要在两个地方（正常代码和异常代码）清理资源。\n\
  \nJava 有更好的解决方案：`finally` 子句。在这里我们如何在 Java 中关闭文件。如果你进行任何数据库编程，你需要使用相同的技术关闭数据库连接。正如你在第二卷第四章所示，即使发生异常，关闭所有数据库连接也非常。\n\
  \n`finally` 子句中的代码无论是否捕获了异常都会执行。在下面的示例中，程序将在任何情况下释放图形上下文：\n\n```java\nInputStream\
  \ in = new FileInputStream(...);\n\ntry\n{\n    // 1\n    code that might throw\
  \ exceptions\n    // 2\n}\ncatch (IOException e)\n{\n    // 3\n    show error message\n\
  \    // 4\n}\nfinally\n{\n    // 5\n    in.close();\n}\n// 6\n```\n\n让我们看看程序执行 `finally`\
  \ 子句的三种可能。\n\n**1.** 代码没有抛出异常。在这种情况下，程序首先执行 `try` 块中的所有代码。然后执行 `finally` 子句中的代码。之后，从\
  \ `finally` 子句后的第一个语句继续执行。换句话说，执行通过了点 1、2、5 和 6。\n\n\n\n\n\n## 2. 代码抛出了在 `catch`\
  \ 子句中捕获的异常——在我们的案例中，是一个 `IOException`。对于这种情况，程序会执行 `try` 块中的所有代码，直到抛出异常的点为止。`try`\
  \ 块中剩余的代码将被跳过。然后，程序执行匹配的 `catch` 子句中的代码，最后执行 `finally` 子句中的代码。\n\n如果 `catch` 子句没有抛出异常，程序将执行\
  \ `finally` 子句之后的第一行。在这种情况下，执行流经过了点 1、3、4、5 和 6。\n\n如果 `catch` 子句抛出了异常，则该异常将抛回给该方法的调用者，且执行流仅经过了点\
  \ 1、3 和 5。\n\n## 3. 代码抛出了一个未被任何 `catch` 子句捕获的异常。在这里，程序执行 `try` 块中的所有代码，直到抛出异常为止。`try`\
  \ 块中剩余的代码将被跳过。然后，执行 `finally` 子句中的代码，异常异常被抛回给该方法的调用者。执行流仅经过了点 1 和 5。\n\n你可以在没有 `catch`\
  \ 子句的情况下使用 `finally` 子句。例如，考虑以下 `try` 语句：\n\n```java\nInputStream in = ...;\n\n\
  try {\n   code that might throw exceptions\n}\nfinally {\n   in.close();\n}\n```\n\
  \n无论 `try` 块中是否遇到异常，`finally` 子句中的 `in.close()` 语句都会执行。当然，如果遇到异常，它会被重新抛出并必须在另一个\
  \ `catch` 子句中捕获。\n\n事实上，正如下面的提示所解释的，我们认为每需要关闭资源时，这样使用 `finally` 子句是一个非常好的主意。\n\n\
  ![Image](img/image00949.jpeg) Tips\n\n我们强烈建议你*解耦* `try/catch` 和 `try/finally` 块。这会让你的代码远不困惑。例如：\n\
  \n```java\nInputStream in = ...;\n\ntry {\n    try {\n        code that might throw\
  \ exceptions\n    }\n    finally {\n        in.close();\n    }\n}\ncatch (IOException\
  \ e) {\n    show error message\n}\n```\n\n内部 `try` 块有一个单一的职责：确保输入流被关闭。外部 `try` 块有一个单一的职责：确保错误被报告。这种解决方案不仅更，而且更具功能性：`finally`\
  \ 子句中的错误也会被报告。\n\n![Image](img/image00950.jpeg) Caution\n\n当 `finally` 子句包含 `return`\
  \ 语句时，可能会产生意想不到的结果。假设你通过 `return` 语句离开 `try` 块的中间。在方法返回之前，`finally` 块会被执行。如果 `finally`\
  \ 块也包含 `return` 语句，那么它将掩盖原始的返回值。考虑这个刻意的示例：\n\n```java\npublic static int f(int n)\
  \ {\n    try {\n        int r = n * n;\n        return r;\n    }\n    finally {\n\
  \        if (n == 2) return 0;\n    }\n}\n```\n\n如果你调用 `f(2)`，`try` 块计算 `r = 4`\
  \ 并执行 `return` 语句。然而，`finally` 子句在方法实际返回之前被执行，导致方法返回 `0`，忽略了原始的返回值 `4`。\n\n有时 `finally`\
  \ 子句会给你带来麻烦——特别是当清理方法也可以抛出异常时。假设你想确保在流处理代码遇到异常时关闭一个流（stream）。\n\n```java\nInputStream\
  \ in = ...;\n\ntry {\n   code that might throw exceptions\n}\nfinally {\n   in.close();\n\
  }\n```\n\n现在假设 `try` 块中的代码抛出了除对代码调用者感兴趣的 `IOException` 以外的异常。`finally` 块执行，并调用了\
  \ `close` 方法。该方法本身可以抛出 `IOException`！当它发生时，原始异常就会丢失，取而抛出的是 `close` 方法的异常。\n\n这是一个问题，因为第一个异常可能更有价值。如果你想做正确并重新抛出原始异常，代码将变得异常繁琐。这里是设置的一种方法：\n\
  \n```java\nInputStream in = ...;\nException ex = null;\n\ntry {\n    try {\n   \
  \     code that might throw exceptions\n    }\n    catch (Exception e) {\n     \
  \   ex = e;\n    }\n}\nfinally {\n    try {\n        in.close();\n    }\n}\nif (ex\
  \ != null) {\n    throw ex;\n}\n```\n\n#### 11.2.4. Try-with-Resources 语句\n\nJava\
  \ 7 提供了一种关闭资源的实用快捷方式，正如你接下来将看到的。try-with-resources 语句实现了 `AutoCloseable` 接口，该接口只有一个\
  \ `close` 方法。\n\n在最简单的变体中，try-with-resources 的形式如下：\n\n```java\ntry (Resource res\
  \ = ...) {\n    work with res\n}\n```\n\n当块正常退出或发生异常时，`res.close()` 会被自动调用。\n\n\
  你可以指定多个资源。例如：\n\n```java\ntry (Scanner in = new Scanner(new FileInputStream(\"input.txt\"\
  ));\n     PrintWriter out = new PrintWriter(\"output.txt\")) {\n    while (in.hasNext())\
  \ {\n        out.println(in.next());\n    }\n}\n```\n\n无论块如何退出，`in` 和 `out` 被关闭。如果你是手动编写这些代码，你需要嵌套的\
  \ `try`/`finally` 语句。\n\n正如你在上一节中看到的，当 `try` 块抛出异常且 `close` 方法也抛出异常时，就会出现困难。try-with-resources\
  \ 语句优雅地处理了这种情况。原始异常被重新抛出，任何由 `close` 方法抛出的异常都被视为“被抑制的”（suppressed）。它们会被自动捕获并通过 `addSuppressed`\
  \ 方法添加到原始异常中。如果你对它们感兴趣，可以调用 `getSuppressed` 方法，它会返回一个被抑制表达式的数组。\n\n#### 11.2.5.\
  \ 分析堆栈跟踪元素\n\n*堆栈跟踪*（stack trace）是程序执行某一点时所有待处理方法调用的列表。你几乎见过堆栈跟踪列表——每当 Java 程序因未捕获的异常终止时，就会显示这些列表。\n\
  \n你可以通过调用 `Throwable` 类的 `printStackTrace` 方法来访问堆栈跟踪的文本描述。\n\n```java\nThrowable\
  \ t = new Throwable();\nByteArrayOutputStream out = new ByteArrayOutputStream();\n\
  t.printStackTrace(out);\nString description = out.toString();\n```\n\n更灵活的方法是使用\
  \ `getStackTrace` 方法，它返回一个 `StackTraceElement` 对象数组，你可以在程序中对其进行分析。\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```java\nThrowable t = new Throwable();\n\nStackTraceElement[] frames = t.getStackTrace();\n\
  \nfor (StackTraceElement frame : frames)\n    analyze frame\n```\n\n`StackTraceElement`\
  \ 类拥有可以获取执行代码行的文件名、行号，以及类名和方法名的方法。`toString()` 方法返回包含所有这些信息的格式化字符串。\n\n静态方法 `Thread.getAllStackTraces`\
  \ 产生所有线程的堆栈跟踪。以下是使用该方法的方法：\n\n点击此处查看代码图像\n\n```java\nMap<Thread, StackTraceElement[]>\
  \ map = Thread.getAllStackTraces();\n\nfor (Thread t : map.keySet())\n{\n    StackTraceElement[]\
  \ frames = map.get(t);\n    analyze frames\n}\n```\n\n关于 `Map` 接口和线程的更多信息，请参阅第 13\
  \ 章和第 14 章。\n\n列表 11.1 打印递归阶乘函数的堆栈跟踪。例如，如果你计算 `factorial(3)`，输出如下：\n\n点击此处查看代码图像\n\
  \n```\nfactorial(3):\nStackTraceTest.factorial(StackTraceTest.java:18)\nStackTraceTest.main(StackTraceTest.java:34)\n\
  factorial(2):\nStackTraceTest.factorial(StackTraceTest.java:18)\nStackTraceTest.factorial(StackTraceTest.java:24)\n\
  StackTraceTest.main(StackTraceTest.java:34)\nfactorial(1):\nStackTraceTest.factorial(StackTraceTest.java:18)\n\
  StackTraceTest.factorial(StackTraceTest.java:24)\nStackTraceTest.factorial(StackTraceTest.java:24)\n\
  StackTraceTest.main(StackTraceTest.java:34)\nreturn 1\nreturn 2\nreturn 6\n```\n\
  \n列表 11.1. `stackTrace/StackTraceTest.java`\n\n点击此处查看代码图像\n\n* * *\n\n```java\n\
  1  package stackTrace;\n2\n3  import java.util.*;\n4\n5  /**\n6    * 一个显示递归方法调用跟踪功能的程序。\n\
  7    * @version 1.01 2004-05-10\n8    * @author Cay Horstmann\n9    */\n10 public\
  \ class StackTraceTest\n11 {\n12     /**\n13       * 计算数字阶乘\n14       * @param n\
  \ 一个非负整数\n15       * @return n! = 1 * 2 * . . . * n\n16       */\n17     public\
  \ static int factorial(int n)\n18     {\n19          System.out.println(\"factorial(\"\
  \ + n + \"):\");\n20          Throwable t = new Throwable();\n21          StackTraceElement[]\
  \ frames = t.getStackTrace();\n22          for (StackTraceElement f : frames)\n\
  23              System.out.println(f);\n24          int r;\n25          if (n <=\
  \ 1) r = 1;\n26          else r = n * factorial(n - 1);\n27          System.out.println(\"\
  return \" + r);\n28          return r;\n29     }\n30     public static void main(String[]\
  \ args)\n31     {\n32          Scanner in = new Scanner(System.in);\n33        \
  \  System.out.print(\"Enter n: \");\n34          int n = in.nextInt();\n35     \
  \     factorial(n);\n36     }\n37 }\n```\n\n* * *\n\n* *\n\n`java.lang.Throwable`\
  \ **1.0**\n\n- `Throwable(Throwable cause)` **1.4**\n- `Throwable(String message,\
  \ Throwable cause)` **1.4** 使用给定的原因创建一个 `Throwable`。\n- `Throwable initCause(Throwable\
  \ cause)` **1.4** 设置此对象的原因，如果此对象已经有了原因则抛出异常。返回 `this`。\n- `Throwable getCause()`\
  \ **1.4** 获取被设置为此对象原因的异常对象，如果没有设置原因则返回 `null`。\n- `StackTraceElement[] getStackTrace()`\
  \ **1.4** 获取此对象构造时的调用堆栈跟踪。\n- `void addSuppressed(Throwable t)` **7** 向此对象添加一个“被抑制”的异常。\n\
  - `Throwable[] getSuppressed()` **7** 获取所有“被抑制”的异常。通常，这些发生在 try-with-resources 语句中。\n\
  \n* *\n\n* *\n\n### 11.3 使用异常的技巧\n\n关于异常的使用存在某种争议。一些程序员认为检查异常（checked exceptions）是一种麻烦，而另一些人似乎觉得抛得还不够。我们认为异常有其用处。\n\
  \n**1.** *异常不应该用来替代测试。*\n\n作为一个例子，我们写了一些代码，尝试 10,000,000 次从空栈中弹出元素（pop）。实际上，我们先检查栈是否为空。\n\
  \n```java\nif (!s.empty()) s.pop();\n```\n\n在我们的机器上，调用 `isEmpty` 的版本花费了 646 毫秒。而捕捉异常的版本花费了\
  \ 2139 毫秒。教训是：仅对异常情况使用异常。\n\n**2.** *不要微管理异常。*\n\n许多程序员将每个语句都封装在独立的 `try` 块中。\n\n\
  ```java\nPrintStream out;\nStack s;\nfor (i = 0; i < 100; i++)\n{\n    try\n   \
  \ {\n        n = s.pop();\n    }\n    catch (EmptyStackException e)\n    {\n   \
  \     // 栈为空\n    }\n    try\n    {\n        out.writeInt(n);\n    }\n    catch\
  \ (IOException e)\n    {\n        // 写入文件出错\n    }\n}\n```\n\n这种方法会让代码变得膨胀。思考你想让代码完成的任务。在这里，我们要从栈中弹出\
  \ 100 个数字并将它们保存到文件中（管为什么——这只是一个玩具示例）。如果出现问题，我们无能为。如果栈为空，它不会被占用。如果文件包含错误，错误不会自动消失。因此，将*整个任务*封装在一个\
  \ `try` 块中是有意义的。如果任何操作失败，你就可以放弃任务。\n\n```java\ntry\n{\n    for (i = 0; i < 100;\
  \ i++)\n    {\n        n = s.pop();\n        out.writeInt(n);\n    }\n}\ncatch (IOException\
  \ e)\n{\n    // 写入文件出错\n}\ncatch (EmptyStackException e)\n{\n    // 栈为空\n}\n```\n\
  \n这段代码看起来要整洁得多。它实现了异常处理的一个承诺：将正常处理与错误处理*分开*。\n\n**3.** *善用异常的层次结构。*\n\n不要只抛出一个 `RuntimeException`。找一个合适的子类，或者创建一个你自己的。\n\
  \n不要只捕获 `Throwable`。这会让你的代码难以阅读和维护。\n\n\n\n\n尊重受检异常（checked exceptions）和未受检异常（unchecked\
  \ exceptions）之间的区别。受检异常本质上是负担的——不要为逻辑错误抛出它们。（例如，反射库就犯了这个错误。调用者往往需要捕获他们知道永远不会发生的异常。）\n\
  \n不要犹豫将一个异常转换为另一个更合适的异常。例如，当你从文件中解析整数时，捕获 `NumberFormatException` 并将其转换为 `IOException`\
  \ 的子类或 `MySubsystemException`。\n\n### 4. 不要压制异常。\n\n在 Java 中，人们有极大的诱惑去静音异常。如果你正在编写一个方法，该方法调用了一个可能每百年才抛出一次异常的方法，编译器会抱怨，因为你没有在方法的\
  \ `throws` 列表中声明该异常。你又不想把它放入 `throws` 列表中，因为那样编译器就会抱怨调用你方法的所有方法。所以你直接把它压制了：\n\n\
  ```java\npublic Image loadImage(String s)\n{\n    try\n    {\n        code that\
  \ threatens to throw checked exceptions\n    }\n    catch (Exception e)\n    {}\
  \ // 就这样了\n}\n```\n\n现在你的代码可以顺利通过编译了。它会运行良好，除非发生异常。那时，异常将被无声地忽略。如果你认为异常是有重要的，你就应该努力正确地处理它们。\n\
  \n### 5. 当你检测到错误时，“严厉的爱”比纵纵容更有效。\n\n有些程序员担心在检测到错误时抛出异常。当使用无效参数调用一个方法时，返回一个占位值是否比抛出异常更好？例如，当栈为空时，`Stack.pop`\
  \ 应该返回 `null` 还是抛出一个异常呢？我们认为，在失败发生点抛出 `EmptyStackException` 比在稍后的时间发生 `NullPointerException`\
  \ 要好。\n\n### 6. 传播异常并不是可耻之举。\n\n许多程序员感到被迫要捕获所有抛出的异常。如果他们调用一个会抛出异常的方法（例如 `FileInputStream`\
  \ 构造函数或 `readLine` 方法），他们会本能地捕获可能生成的异常。通常，传播异常实际上比捕获它更好：\n\n```java\npublic void\
  \ readStuff(String filename) throws IOException // 不是可耻的行为！\n{\n    InputStream\
  \ in = new FileInputStream(filename);\n    . . .\n}\n```\n\n高层方法通常能够更好地通知用户错误或放弃未执行的命令。\n\
  \n**注意：** 规则 5 和 6 可以总结为“早抛出，晚捕获”。\n\n### 11.4. 使用断言（Assertions）\n\n断言是防御性编程中常用的惯用法。假设你确定某个属性被满足了，并且在代码中依赖该属性。例如，你可能正在计算：\n\
  \n```java\ndouble y = Math.sqrt(x);\n```\n\n你确定 `x` 不是负数。也许它是另一个不会产生负结果的计算结果，或者它是一个要求调用者仅提供正输入的方法的参数。尽管如此，你仍然希望双重检查，而不是让混淆的“非数字”浮点值爬入你的计算中。当然，你可以抛出一个异常：\n\
  \n```java\nif (x < 0) throw new IllegalArgumentException(\"x < 0\");\n```\n\n但这段代码在测试完成后仍然停留在程序中。如果你有许多此类检查，程序的运行速度可能会比应该的慢得多。\n\
  \n断言机制允许你在测试期间插入检查，并在生产代码中自动移除它们。\n\nJava 语言有一个关键字 `assert`。它有两种形式：\n\n```java\n\
  assert condition;\n```\n\n和\n\n```java\nassert condition : expression;\n```\n\n\
  这两个语句都会评估 `condition`，如果结果为 `false`，则抛出 `AssertionError`。在第二个语句中，`expression` 被传递给\
  \ `AssertionError` 对象的构造函数并转换为消息字符串。\n\n**注意：** `expression` 部分的唯一目的是生成消息字符串。`AssertionError`\
  \ 对象并不存储实际的表达式值，因此你稍后无法查询它。正如 JDK 文档用一种家长式的魅力描述的那样，这样做“会鼓励程序员尝试从断言失败中恢复，这违背了该功能的初”。\n\
  \n要断言 `x` 非负数，你可以直接使用语句：\n\n```java\nassert x >= 0;\n```\n\n或者你可以将 `x` 的实际值传递给 `AssertionError`\
  \ 对象，以便稍后显示出来。\n\n```java\nassert x >= 0 : x;\n```\n\n**C++ 注意：** C 语言的 `assert`\
  \ 宏会将断言条件转换为一个字符串，并在断言失败时打印该字符串。例如，如果 `assert(x >= 0)` 失败，它会打印 `\"x >= 0\"` 是失败的条件。在\
  \ Java 中，条件不会自动包含错误错误报告。如果你想看到它，必须作为字符串传递给 `AssertionError` 对象：`assert x >= 0 :\
  \ \"x >= 0\"`。\n\n#### 11.4.1. 断言的启用与禁用\n\n默认情况下，断言是禁用的。通过带有 `-enableassertions`\
  \ 或 `-ea` 参数运行程序启用它们：\n\n```bash\njava -enableassertions MyApp\n```\n\n注意，你不需要重新编译程序即可启用或禁用断言。启用或禁用断言是*类加载器*的功能。当禁用断言时，类加载器会剥离断言代码，以免影响执行速度。\n\
  \n你可以在特定的类或整个包中开启断言。例如：\n\n```bash\njava -ea:MyClass -ea:com.mycompany.mylib MyApp\n\
  ```\n\n此命令开启 `MyClass` 类以及 `com.mycompany.mylib` 包及其子包中所有类的断言。`-ea` 开启默认包中的断言。\n\
  \n你也可以使用 `-disableassertions` 或 `-da` 选项在某些类和包中禁用断言：\n\n```bash\njava -ea:... -da:MyClass\
  \ MyApp\n```\n\n某些类不是由类加载器加载的，而是直接由虚拟机加载的。你可以使用这些开关在这些类中选择性地启用或禁用断言。然而，启用全局的 `-ea`\
  \ 和 `-da` 开关不适用于“系统类”。使用 `-enableassertions/-esa` 开关启用系统类中的断言。\n\n还可以通过程序控制类加载器的断言状态。请参本节末尾的\
  \ API 注释。\n\n#### 11.4.2. 使用断言进行参数检查\n\nJava 语言提供了三种机制来处理系统故障：\n\n- 抛出异常\n- 日志\n\
  - 使用断言\n\n何时应该选择断言？请记住这些点：\n\n- 断言失败旨在表示致命的、不可恢复的错误。\n- 断言检查仅在开发和测试期间开启。（这有时被开玩笑地描述为“在靠近岸边时穿上救生衣，一旦进入大洋就把它扔掉”。）\n\
  \n因此，你不应该使用断言来向程序的其他部分发出可恢复条件，或向程序用户通信问题。断言应该只用于在测试期间定位内部程序错误。\n\n让我们来看常见的场景——方法参数检查。你是否应该使用断言来检查非法索引值或\
  \ `null` 引用？要回答这个问题，你必须查看方法的文档。假设你实现了一个排序方法。\n\n```java\n/**\n * 将指定数组的范围按数字升序排序。\n\
  \ */\n```\n\n\n\n\n要排序的范围从 `fromIndex`（包含）到 `toIndex`（不包含）。\n\n@param `a` 要排序的数组。\n\
  @param `fromIndex` 要排序的第一个元素的索引（包含）。\n@param `toIndex` 要排序的最后一个元素的索引（不包含）。\n@throws\
  \ `IllegalArgumentException` 如果 `fromIndex > toIndex` 则抛出异常。\n@throws `ArrayIndexOutOfBoundsException`\
  \ 如果 `fromIndex < 0` 或 `toIndex > a.length` 则抛出异常。\n\n*/\n\n```\nstatic void sort(int[]\
  \ a, int fromIndex, int toIndex)\n```\n\n文档说明指出，如果索引值错误，方法将抛出异常。该行为是方法与其调用者之间约定的一部分。如果你实现了该方法，就必须遵守该约定并抛出指示的异常。使用断言（assertions）是不恰当的。\n\
  \n你是否应该断言 `a` 不为 `null`？这也不恰当。方法文档对于 `a` 为 `null` 时的行为没有规定。调用者有权假设在这种情况下方法将成功返回，而不会抛出断言错误。\n\
  \n然而，假设方法的约定略有不同：\n\n@param `a` 要排序的数组（不能为 null）。\n\n现在，该方法的调用者已经收到通知：使用 `null`\
  \ 数组调用该方法是非合法的。那么方法可以从断言开始：\n\n```\nassert a != null;\n```\n\n计算机科学家将这种约定称为 `precondition`（前提条件）。原始方法对其参数没有前提条件——它承诺在所有情况下都有一个定义定义的行为。修改后的方法有一个前提条件：即\
  \ `a` 不为 `null`。如果调用者未能满足前提条件，那么规则失效，方法可以执行任何操作。事实上，由于有了断言，该方法在被非法调用时其行为是相当不可预测的。它有时抛出断言错误，有时抛出空指针异常，这取决于其类加载器的配置。\n\
  \n### 11.4.3. 使用断言记录假设\n\n许多程序员使用注释来记录他们的底层假设。考虑这个来自 [Oracle 官方文档](http://docs.oracle.com/javase/6/docs/technotes/guides/language/assert.html)\
  \ 的示例：\n\n```\nif (i % 3 == 0)\n    . . .\nelse if (i % 3 == 1)\n    . . .\nelse\
  \ // (i % 3 == 2)\n    . . .\n```\n\n在这种情况下，使用断言反而更有意义。\n\n```\nif (i % 3 == 0)\n\
  \    . . .\nelse if (i % 3 == 1)\n    . . .\nelse\n{\n    assert i % 3 == 2;\n \
  \   . . .\n}\n```\n\n当然，如果能更彻底地思考这个问题会更有意义。`i % 3` 的可能取值有哪些？如果 `i` 是正数，余数必须是 `0`、`1`\
  \ 或 `2`。如果 `i` 是负数，那么余数可以是 `-1` 或 `-2`。因此，真正的假设是 `i` 不是负数。一个更好的断言是：\n\n```\nassert\
  \ i >= 0;\n```\n\n在 `if` 语句之前。\n\n无论如何，这个示例展示了如何良好使用断言作为程序员的自检。正如你所见，断言是测试和调试的战术工具。相比之下，日志（logging）是程序整个生命周期的战略工具。我们将在下一节研究日志。\n\
  \n***\n\n`java.lang.ClassLoader` **1.0**\n\n• `void setDefaultAssertionStatus(boolean\
  \ b)` **1.4**\n启用或禁用由此类加载器加载的、没有显式类或包断言状态的所有类的断言。\n\n• `void setClassAssertionStatus(String\
  \ className, boolean b)` **1.4**\n启用或禁用给定类及其内部类的断言。\n\n• `void setPackageAssertionStatus(String\
  \ packageName, boolean b)` **1.4**\n启用或禁用给定包及其子包中所有所有类的断言。\n\n• `void clearAssertionStatus()`\
  \ **1.4**\n移除所有显式的类和包断言状态设置，并禁用由此类加载器加载的所有类的断言。\n\n***\n\n### 11.5. 日志记录\n\n每一位\
  \ Java 程序员都熟悉这样一种过程：在有问题的代码中插入 `System.out.println` 调用，以了解程序的行为。当然，一旦你找到了问题的原因，你就会移除打印语句，只在下一个问题出现时再把它们放回来。日志\
  \ API 设计旨在解决这个问题。以下是该 API 的主要优势：\n\n• 它可以抑制所有日志记录或仅抑制低于某个级别的记录，并且同样容易重新开启它们。\n•\
  \ 被抑制的日志是非常廉价的，因此在应用程序中保留日志代码的代价极小。\n• 日志记录可以定向到不同的处理器——例如显示在控制台上、写入文件等。\n• 日志记录器（loggers）和处理器（handlers）都可以过滤记录。过滤器可以使用过滤器实现者提供的任何标准来丢弃无趣的日志条目。\n\
  • 日志记录可以用不同的方式进行格式化——例如显示在控制台上、写入文件等。\n（注：原文此处存在大量重复的行，翻译已按要求保留格式并处理内容）\n\n\n\n\n\
  默认日志记录会显示包含日志调用的类和方法名，这是通过调用栈推断出来的。然而，如果虚拟机对执行进行了优化，可能无法获取准确调用信息。你可以使用 `logp` 方法来提供调用类和方法的精确位置。该方法的签名如下：\n\
  \n```java\nvoid logp(Level l, String className, String methodName, String message)\n\
  ```\n\n有一些用于追踪执行流的便利方法：\n\n点击此处查看代码\n\n```java\nvoid entering(String className,\
  \ String methodName)\nvoid entering(String className, String methodName, Object\
  \ param)\nvoid entering(String className, String methodName, Object[] params)\n\
  void exiting(String className, String methodName)\nvoid exiting(String className,\
  \ String methodName, Object result)\n```\n\n例如：\n\n点击此处查看代码\n\n```java\nint read(String\
  \ file, String pattern)\n{\n    logger.entering(\"com.mycompany.mylib.Reader\",\
  \ \"read\",\n        new Object[] { file, pattern });\n    . . .\n    logger.exiting(\"\
  com.mycompany.mylib.Reader\", \"read\", count);\n    return count;\n}\n```\n\n这些调用会生成级别为\
  \ `FINER` 的日志记录，并以字符串 `ENTRY` 和 `RETURN`开头。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n在未来的某个时刻，带有 `Object[]` 参数的日志方法将被重写以支持变长参数列表（varargs）。那时，你将能够诸如 `logger.entering(\"\
  com.mycompany.mylib.Reader\", \"read\", file, pattern)` 的调用。\n\n***\n\n日志的一个常见用途是记录意外异常。有两个便利方法可以在日志记录中包含异常的描述。\n\
  \n点击此处查看代码\n\n```java\nvoid throwing(String className, String methodName, Throwable\
  \ t)\nvoid log(Level l, String message, Throwable t)\n```\n\n典型的用法如下：\n\n点击此处查看代码\n\
  \n```java\nif (. . .)\n{\n    IOException exception = new IOException(\". . .\"\
  );\n    logger.throwing(\"com.mycompany.mylib.Reader\", \"read\", exception);\n\
  \    throw exception;\n}\n```\n\n以及\n\n点击此处查看代码\n\n```java\ntry\n{\n    . . .\n\
  }\ncatch (IOException e)\n{\n    Logger.getLogger(\"com.mycompany.myapp\").log(Level.WARNING,\
  \ \"Reading image\", e);\n}\n```\n\n`throwing` 调用会记录一条级别为 `FINER` 的记录，其消息以 `THROW`\
  \ 开头。\n\n### 11.5.3 更改 LogManager 配置\n\n你可以通过编辑配置文件来更改日志系统的各种属性。默认配置文件位于：\n\n`jre/lib/logging.properties`\n\
  \n要使用另一个文件，请在启动应用程序时将 `java.util.logging.config.file` 属性设置为文件位置：\n\n```bash\njava\
  \ -Djava.util.logging.config.file=configFile MainClass\n```\n\n***\n\n![Image](img/image00950.jpeg)\
  \ 警告\n\n日志管理器在 VM 启动期间初始化，在 `main` 方法执行之前。如果在 `main` 中调用了 `System.setProperty(\"\
  java.util.logging.config.file\", file)`，请同时调用 `LogManager.readConfiguration()` 来重新初始化日志管理器。\n\
  \n***\n\n要更改默认日志级别，请编辑配置文件并修改行：\n\n`.level=INFO`\n\n你可以通过添加此类行来为自己的日志器指定日志级别：\n\n\
  `com.mycompany.myapp.level=FINE`\n\n即在日志器名称后附加 `.level` 后缀。\n\n正如你将在在本节后面看到的，日志器实际上并没有将消息发送到控制台——那是处理器（handlers）的工作。处理器也有级别。为了在控制台上看到\
  \ `FINE` 消息，你还需要设置：\n\n`java.util.logging.ConsoleHandler.level=FINE`\n\n***\n\n\
  ![Image](img/image00950.jpeg) 警告\n\n日志管理器配置中的设置*不是*系统属性。使用 `-Dcom.mycompany.myapp.level=FINE`\
  \ 启动程序对日志器没有任何影响。\n\n***\n\n***\n\n![Image](img/image00950.jpeg) 警告\n\n至少到 Java\
  \ SE 7，`LogManager` 类的 API 文档声称你可以通过 Preferences API 设置 `java.util.logging.config.class`\
  \ 和 `java.util.logging.config.file` 属性。这是错误的——请参见 Java  数据库中的 bug 4691587（[`bugs.sun.com/bugdatabase`](http://bugs.sun.com/bugdatabase)）。\n\
  \n***\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n属性文件由 `LogManager` 类处理。通过设置\
  \ `java.util.logging.config.class` 属性，可以指定不同的日志管理器。更多信息请参阅 `java.util.logging.config.file`。还可以使用\
  \ `LogManager` 在运行中的程序中更改日志级别。\n\n***\n\n### 11.5.4 本地化\n\n你可能希望对日志消息进行本地化，以便国际用户能够阅读。应用程序的国际化是第\
  \ 5 章的主题。简而言之，在本地化日志消息时需要注意以下几点。资源包由一组针对各种区域（如美国或德国）的映射组成。例如，一个资源包可以将字符串 `\"readingFile\"\
  ` 映射为英语的 `\"Reading file\"` 或德语的 `\"Achtung! Datei wird gelesen\"`。\n\n一个程序可能包含多个资源包，例如，一个用于菜单，另一个用于日志消息。每个资源包都有一个名称（例如\
  \ `com.mycompany.logmessages`）。要向资源包添加映射，你为为每个区域提供一个文件。英语消息映射位于 `com/mycompany/logmessages_en.properties`\
  \ 文件中，德语消息映射位于 `com/mycompany/logmessages_de.properties` 文件中（`en` 和 `de` 是语言代码）。你将这些文件与应用程序的类文件放在一起，这样\
  \ `ResourceBundle` 类就会自动定位它们。这些文件是纯文本文件，由如下条目组成：\n\n```text\nreadingFile=Achtung!\
  \ Datei wird gelesen\nrenamingFile=Datei wird umbenannt\n```\n\n在请求日志器时，你可以指定资源包：\n\
  \n```java\nLogger logger = Logger.getLogger(loggerName, \"com.mycompany.logmessages\"\
  );\n```\n\n然后为日志消息指定资源包键，而不是实际的消息字符串。\n\n```java\nlogger.info(\"readingFile\");\n\
  ```\n\n你通常需要将参数包含在本地化消息中。消息可能包含占位符：`{0}`、`{1}` 等。例如，要在日志消息包含文件名，可以这样包含占位符：\n\n```text\n\
  Reading file {0}.\nAchtung! Datei {0} wird eingelesen.\n```\n\n然后，要将值传递给占位符，调用以下方法之一：\n\
  \n点击此处查看代码\n\n```java\nlogger.log(Level.INFO, \"readingFile\", fileName);\nlogger.log(Level.INFO,\
  \ \"renamingFile\", new Object[] { oldName, newName });\n```\n\n### 11.5.5 处理器\n\
  \n默认情况下，日志器将记录发送到 `ConsoleHandler`，该处理器将其打印到 `System.err` 流。具体来说，日志器将记录发送给父处理器，而最终祖先（名称为\
  \ `\"\"`）拥有一个 `ConsoleHandler`。\n\n和日志器一样，处理器也有日志级别。为了记录被记录，其日志级别必须高于日志器和处理器的阈值。日志管理器配置文件设置了默认控制台处理器的日志级别为\n\
  \n`java.util.logging.ConsoleHandler.level=INFO`\n\n\n\n\n要记录级别为 `FINE` 的记录，请更改配置中的默认日志器级别和处理器（handler）级别。或者，你也可以完全跳过配置文件并安装你自己的处理器。\n\
  \n点击此处查看代码图像\n\n```\nLogger logger = Logger.getLogger(\"com.mycompany.myapp\");\n\
  logger.setLevel(Level.FINE);\nlogger.setUseParentHandlers(false);\nHandler handler\
  \ = new ConsoleHandler();\nhandler.setLevel(Level.FINE);\nlogger.addHandler(handler);\n\
  ```\n\n默认情况下，日志器会将记录同时发送到自身的处理器和父级的处理器。我们的日志器是根日志器（primordial logger，名称为 `\"\"`）的子，它会将所有级别为\
  \ `INFO` 及以上的记录发送到控制台。然而，我们不想重复看到这些记录，因此我们将 `useParentHandlers` 属性设置为 `false`。\n\
  \n要将日志记录发送到其他地方，请添加另一个处理器。日志 API 为此目的提供了两个实用的处理器：`FileHandler` 和 `SocketHandler`。`SocketHandler`\
  \ 将记录发送到指定的主机和端口。更有趣的是 `FileHandler`，它将记录收集在文件中。\n\n你可以简单将记录发送到默认的文件处理器，如下所示：\n\n\
  ```\nFileHandler handler = new FileHandler();\nlogger.addHandler(handler);\n```\n\
  \n记录被发送到用户家目录下的 `java.n.log` 文件，其中 `n` 是一个使文件唯一的数字。如果用户系统没有用户家目录的概念（例如，在 Windows\
  \ 95/98/Me 中），则文件将存储在 `C:\\Windows` 等默认位置。默认情况下，记录以 XML 格式格式化。一个典型的日志记录形式如下\n\n\
  点击此处查看代码图像\n\n```xml\n<record>\n  <date>2002-02-04T07:45:15</date>\n  <millis>1012837515710</millis>\n\
  \  <sequence>1</sequence>\n  <logger>com.mycompany.myapp</logger>\n  <level>INFO</level>\n\
  \  <class>com.mycompany.mylib.Reader</class>\n  <method>read</method>\n  <thread>10</thread>\n\
  \  <message>Reading file corejava.gif</message>\n</record>\n```\n\n你可以通过在日志管理器配置中设置各种参数来修改文件处理器的默认行为（见表\
  \ 11.1），或使用另一个构造函数（见本节末尾的 API 说明）。\n\n#### 表 11.1. 文件处理器配置参数\n\n![Image](img/image01187.jpeg)\n\
  \n你可能不想使用默认的日志文件名。因此，你应该使用另一种模式，例如 `%h/myapp.log.`。（关于模式变量的解释，请参阅表 11.2。）\n\n####\
  \ 表 11.2. 日志文件模式变量\n\n![Image](img/image01188.jpeg)\n\n如果多个应用程序（或同一应用程序的多个副本）使用同一个日志文件，你应该开启\
  \ `append` 标志。或者，在文件名模式中使用 `%u`，以便每个应用程序都创建一个唯一的日志副本。\n\n开启文件轮转（file rotation）也是一个好主意。日志文件按轮顺序保留，例如\
  \ `myapp.log.0`、`myapp.log.1`、`myapp.log.2` 等。每当文件超过大小限制时，最旧的日志会被删除，其他文件被重命名，并创建一个生成号为\
  \ `0` 的新文件。\n\n***\n\n![Image](img/image00949.jpeg) **提示**：许多程序员将日志作为技术支持人员的辅助。如果程序在现场运行异常，用户可以发回日志文件进行检查。在这种情况下，你应该开启\
  \ `append` 标志、使用轮转日志，或两者兼顾。\n\n***\n\n你还可以通过扩展 `Handler` 或 `StreamHandler` 类来定义自己的处理器。我们在本节末尾的示例程序中定义了这样一个处理器。该处理器在窗口中显示记录（见图\
  \ 11.2）。\n\n![Image](img/image01189.jpeg)\n\n**图 11.2. 在窗口中显示记录的日志处理器**\n\n该处理器扩展了\
  \ `StreamHandler` 类并安装了一个流，其 `write` 方法将流输出显示在文本区域。\n\n点击此处查看代码图像\n\n```java\nclass\
  \ WindowHandler extends StreamHandler\n{\n   public WindowHandler()\n   {\n    \
  \  . . .\n      final JTextArea output = new JTextArea();\n      setOutputStream(new\
  \ ...\n   }\n   public void publish(LogRecord record)\n   {\n      super.publish(record);\n\
  \   }\n   protected void write(byte[] b, int off, int len)\n   {\n      output.append(new\
  \ String(b, off, len));\n   }\n   protected String format(LogRecord record)\n  \
  \ {\n      return formatMessage(record);\n   }\n   protected String formatMessage(LogRecord\
  \ record)\n   {\n      return record.getMessage();\n   }\n}\n```\n\n#### 11.5.6.\
  \ 过滤器\n\n默认情况下，记录根据级别进行过滤。每个日志器和处理器都可以有一个可选过滤器进行额外过滤。要定义过滤器，请实现 `Filter` 接口并定义方法\n\
  \n```java\nboolean isLoggable(LogRecord record)\n```\n\n对于应该包含的记录返回 `true`。例如，一个特定的过滤器可能对\
  \ `entering` 和 `exiting` 方法感兴趣。要将过滤器安装到日志器或处理器，只需调用 `setFilter` 方法。注意你最多有一个。\n\n\
  #### 11.5.7. 格式化器\n\n`ConsoleHandler` 和 `FileHandler` 类以文本和 XML 输出记录。然而，你也可以自定义格式。你需要扩展\
  \ `Formatter` 类并重写方法\n\n```java\nString format(LogRecord record)\n```\n\n以你喜欢的方式格式化记录中的信息并返回结果字符串。在你的\
  \ `format` 方法中，你可能需要调用\n\n```java\nString formatMessage(LogRecord record)\n```\n\
  \n该方法格式化记录的消息部分，替换参数并应用本地化。许多格式（如 XML）需要头部和尾部。为了实现这一点，重写方法\n\n```java\nString getHead(Handler\
  \ h)\nString getTail(Handler h)\n```\n\n最后，调用 `setFormatter` 方法将格式化器安装到处理器中。\n\n\
  #### 11.5.8. 配方\n\n日志的选项很多，很容易忘记基础知识。下面的配方总结了最常用的操作。\n\n**1.** 对于简单的应用程序，选择一个日志器。给日志器命名为与主包相同的名称，例如\
  \ `com.mycompany.myprog`。你始终可以通过调用获取日志器：\n\n```java\nLogger logger = Logger.getLogger(\"\
  com.mycompany.myprog\");\n```\n\n为了方便，你可能想在类中添加静态字段\n\n```java\nprivate static final\
  \ Logger logger = Logger.getLogger(\"com.mycompany.myprog\");\n```\n\n**2.** 默认日志配置将\
  \ `INFO` 以上的消息输出到控制台。用户可以覆盖默认配置，但正如你看到的，这个过程有点复杂。因此，在你的应用程序中安装更合理的默认设置是一个好主意。\n\n\
  以下代码确保所有消息都记录到应用程序特定的文件中。将此代码放在应用程序的 `main` 方法中。\n\n点击此处查看代码图像\n\n```java\nif (System.getProperty(\"\
  java.util.logging.config.class\") == null\n    && System.getProperty(\"java.util.logging.config.file\"\
  ) == null)\n{\n  try\n  {\n    Logger.getLogger(\"\").setLevel(Level.ALL);\n  }\n\
  }\n```\n\n\n\n```java\n        final int LOG_ROTATION_COUNT = 10;\n\n        Handler\
  \ handler = new FileHandler(\"%h/myapp.log\", 0, LOG_ROTATION_COUNT);\n\n      \
  \  Logger.getLogger(\"\").addHandler(handler);\n\n    }\n\n    catch (IOException\
  \ e)\n    {\n        logger.log(Level.SEVERE, \"Can't create log file handler\"\
  , e);\n    }\n}\n```\n\n### 3. 现在你已经准备好尽情地记录日志了。请记住，所有级别为 `INFO`、`WARNING` 和 `SEVERE`\
  \ 的消息都会显示在控制台上。因此，请将这些级别留给对程序用户有意义的消息。`FINE` 级别是记录面向程序员的日志消息的良好选择。\n\n每当你想要调用 `System.out.println`\
  \ 的时候，请改而发布一条日志消息：\n\n```java\nlogger.fine(\"File open dialog canceled\");\n```\n\
  \n记录意外的异常也是一个好主意。例如：\n\n```java\ntry\n{\n   . . .\n}\ncatch (SomeException e)\n\
  {\n   logger.log(Level.FINE, \"explanation\", e);\n}\n```\n\nListing 11.2 在增加了一个新技巧之后应用了此配方：日志消息也会显示在日志窗口中。\n\
  \nListing 11.2. `logging/LoggingImageViewer.java`\n\n点击此处查看代码图片\n\n```java\npackage\
  \ logging;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.io.*;\n\
  import java.util.logging.*;\nimport javax.swing.*;\n\n/**\n * 修改后的图像查看器程序，用于记录各种事件。\n\
  \ * @version 1.02 2007-05-31\n * @author Cay Horstmann\n */\npublic class LoggingImageViewer\n\
  {\n    public static void main(String[] args)\n    {\n        if (System.getProperty(\"\
  java.util.logging.config.class\") == null\n                && System.getProperty(\"\
  java.util.logging.config.file\") == null)\n        {\n            try\n        \
  \    {\n                Logger.getLogger(\"com.horstmann.corejava\").setLevel(Level.ALL);\n\
  \                final int LOG_ROTATION_COUNT = 10;\n                Handler handler\
  \ = new FileHandler(\"%h/LoggingImageViewer.log\", 0, LOG_ROTATION_COUNT);\n   \
  \             Logger.getLogger(\"com.horstmann.corejava\").addHandler(handler);\n\
  \            }\n            catch (IOException e)\n            {\n             \
  \   Logger.getLogger(\"com.horstmann.corejava\").log(Level.SEVERE,\n           \
  \         \"Can't create log file handler\", e);\n            }\n        }\n   \
  \     EventQueue.invokeLater(new Runnable()\n        {\n            public void\
  \ run()\n            {\n                Handler windowHandler = new WindowHandler();\n\
  \                windowHandler.setLevel(Level.ALL);\n                Logger.getLogger(\"\
  com.horstmann.corejava\").addHandler(windowHandler);\n\n                JFrame frame\
  \ = new ImageViewerFrame();\n                frame.setTitle(\"ImageViewer\");\n\
  \                frame.CloseOperation(JFrame.EXIT_ON_CLOSE);\n\n               \
  \ Logger.getLogger(\"com.horstmann.corejava\").fine(\"Showing frame\");\n      \
  \          frame.setVisible(true);\n            }\n        });\n    }\n}\n\n/**\n\
  \ * 显示图像的框架。\n */\nclass ImageViewerFrame extends JFrame\n{\n    private static\
  \ final int DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT =\
  \ 400;\n\n    private JLabel label;\n    private static Logger logger = Logger.getLogger(\"\
  com.horstmann.corejava\");\n\n    public ImageViewerFrame()\n    {\n        logger.entering(\"\
  ImageViewerFrame\", \"<init>\");\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  \n        // 设置菜单栏\n        JMenuBar menuBar = new JMenuBar();\n        setJMenuBar(menuBar);\n\
  \n        JMenu menu = new JMenu(\"File\");\n        menuBar.add(menu);\n\n    \
  \    JMenuItem openItem = new JMenuItem(\"Open\");\n        menu.add(openItem);\n\
  \        openItem.addActionListener(new FileOpenListener());\n        JMenuItem\
  \ exitItem = new JMenuItem(\"Exit\");\n        menu.add(exitItem);\n        exitItem.addActionListener(new\
  \ ActionListener()\n        {\n            public void actionPerformed(ActionEvent\
  \ event)\n            {\n                logger.fine(\"Exiting.\");\n          \
