  优先级队列在元素按任意顺序插入后按排序顺序检索元素。也就是说，每当你调用 `remove` 方法时，你都会获得当前优先级队列中最小的元素。然而，优先级队列并没有对其所有元素进行排序。如果你对元素进行遍历，它们并不一定是有序的。优先级队列使用了一种优雅且高效的数据结构，称为\
  \ `heap`（堆）。堆是一种自组织的二叉树，其中 `add` 和 `remove` 操作会导致最小元素向根节点汇聚，而不需要浪费时间在排序所有元素上。\n\n\
  就像 `TreeSet` 一样，优先级队列可以包含实现了 `Comparable` 接口的类元素，或者你在构造函数中提供的 `Comparator` 对象。\n\
  \n优先级队列的一个典型用途是任务调度。每个任务都有一个优先级。\n\n优先级队列使用了一种优雅且高效的数据结构，称为 `heap`（堆）。堆是一种自组织的二叉树，其中\
  \ `add` 和 `remove` 操作会导致最小元素向根节点汇聚，而不需要浪费时间在排序所有元素上。\n\n就像 `TreeSet` 一样，优先级队列可以包含实现了\
  \ `Comparable` 接口的类元素，或者你在构造函数中提供的 `Comparator` 对象。\n\n优先级队列的一个典型用途是任务调度。每个任务都有一个优先级。\n\
  \n***\n\n### java.util.PriorityQueue<E> 5.0\n\n• `PriorityQueue()`\n\n• `PriorityQueue(int\
  \ initialCapacity)`\n构造初始容量为 16 或给定的初始容量的无界双端队列。\n\n• `PriorityQueue(Comparator<?\
  \ super E> c)`\n构造一个树集合，并使用指定的比较器对其元素进行排序。\n\n***\n\n```java\npackage priorityQueue;\n\
  \nimport java.util.*;\n\n/**\n * 此程序演示了优先级队列的使用。\n * @version 1.0\n * @author Caymann\n\
