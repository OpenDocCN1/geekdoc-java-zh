  \ 为你提供了一个非常丰富且精密的工具集，用于编写动态操作 Java 代码的程序。这一特性在 `JavaBeans`（Java 的组件架构，被广泛使用，有关 JavaBeans\
  \ 的更多信息请参见第二卷）。通过反射，Java 可以支持诸如 Visual Basic 用户所习惯的工具。特别是当在设计时或运行时添加新类时，快速应用开发工具可以动态查询这些类的能力。\n\
  \n能够分析类能力的程序被称为 `reflective`（反射的）。反射机制非常强大。如后续章节所示，你可以使用它来：\n\n- 在运行时分析类的能力；\n-\
  \ 在运行时检查对象——例如，编写一个适用于`all` 类的单个 `toString` 方法；\n- 实现泛型数组处理代码；以及\n- 利用在 C++ 等语言中像函数指针一样工作的\
  \ `Method` 对象。\n\n反射是一种强大且复杂的机制；但然而，它主要对工具构建者感兴趣，而不是应用程序程序员。如果你对编写应用程序感兴趣，而不是为其他\
  \ Java 程序员编写工具，那么你可以安全地跳过本章的剩余部分，以后再回来。\n\n### 5.7.1 Class 类\n\n当你的程序运行时，Java 运行时系统始终对所有对象维护所谓的\
  \ `runtime type identification`（运行时类型识别）。这些信息跟踪了每个对象所属的类。虚拟机使用运行时类型信息来选择执行正确的方法。\n\
  \n然而，你也可以通过操作一个特殊的 Java 类来访问这些信息。持有这些信息的类由于名称有点令人困惑，被称为 `Class`。`Object` 类中的 `getClass()`\
  \ 方法返回 `Class` 类型的实例。\n\n```java\nEmployee e;\n// ...\nClass cl = e.getClass();\n\
  ```\n\n就像 `Employee` 对象描述特定员工的属性一样，`Class` 对象描述特定类的属性。`Class` 类最常用的方法可能是是 `getName`。它返回类的名称。例如，该语句\n\
  \n```java\nSystem.out.println(e.getClass().getName() + \" \" + e.getName());\n```\n\
  \n会打印出\n\n`Employee Harry Hacker`\n如果 `e` 是一个员工，或者\n\n`Manager Harry Hacker`\n如果\
  \ `e` 是一个经理。\n\n如果类在包中，则包名是类名的一部分：\n\n```java\nDate d = new Date();\nClass cl =\
  \ d.getClass();\nString name = cl.getName(); // name 被设置为 \"java.util.Date\"\n```\n\
  \n你可以使用静态方法 `forName` 来获取与类名对应的 `Class` 对象。\n\n```java\nString className = \"java.util.Date\"\
  ;\nClass cl = Class.forName(className);\n```\n\n如果类名存储在运行时变化的字符串中，请使用此方法。如果 `className`\
  \ 是类或接口的名称，则该方法有效。否则，`forName` 方法会抛出一个 `checked exception`（受检异常）。请参见第 261 页的 Section\
  \ 5.7.2 “异常处理原理”，了解在使用此方法时如何提供 `exception handler`（异常处理器）。\n\n![Image](img/image00949.jpeg)\
  \ Tip\n启动时，包含 `main` 方法的类会被加载。它加载其所需的所有类。每个被加载的类又又加载它们所需的类，依此类推。对于大型应用程序，这可能需要很长时间，让用户感到沮丧。你可以通过以下技巧给程序用户提供一种启动更快的错觉。确保包含\
  \ `main` 方法的类没有显式引用其他类。在类类中显示一个启动屏幕。然后通过调用 `Class.forName` 手动强制加载其他类。\n\n获取 `Class`\
  \ 类型对象的第三种方法是一种方便的简写形式。如果 `T` 是任何 Java 类型，那么 `T.class` 就是匹配的类对象。例如：\n\n```java\n\
  Class cl1 = Date.class; // 如果导入了 java.util.*;\nClass cl2 = int.class;\nClass cl3\
  \ = Double[].class;\n```\n\n注意，`Class` 对象实际上描述的是一个 `type`（类型），该类型可能是类，也可能不是。例如，`int`\
  \ 不是类，但 `int.class` 仍然是一个 `Class` 类型的对象。\n\n![Image](img/image00948.jpeg) Note\n\
  从 Java SE 5.0 开始，`Class` 类是泛化的。例如，`Employee.class` 的类型是 `Class<Employee>`。我们不纠结于这个问题，因为它会使一个已经抽象的概念变得更加复杂。对于大多数实际用途，你可以忽略类型参数并使用原始\
  \ `Class` 类型工作。有关此问题的更多信息，请参见 Chapter 13。\n\n![Image](img/image00950.jpeg) Caution\n\
  出于历史原因，`getName` 方法对数组类型返回了一些有些奇怪的名字：\n\n- `Double[].class.getName()` 返回 `\"[Ljava.lang.Double;\"\
  `\n- `int[].class.getName()` 返回 `\"I\"`\n\n虚拟机为每个类型管理一个唯一的 `Class` 对象。因此，你可以使用 `==`\
  \ 来比较类对象。例如：\n\n```java\nif (e.getClass() == Employee.class)\n```\n\n另一个有用方法的例子是允许你创建类的实例。这个方法名而易彰地被称为\
  \ `newInstance()`。例如：\n\n```java\ne.getClass().newInstance();\n```\n\n会创建一个相同类型的新实例。`newInstance`\
  \ 方法调用无参数构造函数来初始化创建的对象。`forName` 和 `newInstance` 的结合允许你从存储在字符串中的名称创建对象。\n\n```java\n\
  String s = \"java.util.Date\";\nObject m = Class.forName(s).newInstance();\n```\n\
  \n![Image Note 如果你需要为通过这种方式创建类的构造提供参数，不能使用上述语句。相反，你必须使用 `Constructor` 类中的 `newInstance`\
  \ 方法。![Image](img/image00951.jpeg) C++ Note\n`newInstance` 方法对应于 C++ 中的 *virtual\
  \ constructor*（虚构造函数） idiom。然而，C++ 中的虚构造函数并不是语言特性，而是一种需要专门库支持的 idiom。`Class` 类类似于\
  \ C++ 中的 `type_info` 类，而 `getClass` 方法等同于 `typeid` 运算符。不过，Java 的 `Class` 比 `type_info`\
  \ 通用得多。C++ `type_info` 只能显示类型名称的字符串，无法创建该类型的新对象。\n\n### 5.7.2 A Primer on Catching\
  \ Exceptions\n\n我们将在 Chapter 11 中完整介绍异常处理，在此期间，你偶尔会遇到可能抛出异常的方法。\n\n当运行时发生错误时，程序可以“抛出异常”。抛出异常比终止程序更灵活，因为你可以提供一个\
  \ *handler*（处理器）来“捕获”异常并处理它。\n\n如果你不提供处理器，程序仍然会终止并在控制台打印消息，给出异常的类型。\n\n异常有两种：*unchecked*\
  \ exceptions（未检异常）和 *checked* exceptions（受检异常）。对于受检异常，编译器会检查你是否提供了处理器。然而，许多常见异常（如访问\
  \ `null` 引用）是未检的。编译器不会检查你是否为这些错误提供了处理器——毕竟，你应该把精力花在避免这些错误上，而不是为它们编写处理器。\n\n\n\n\n\
  但并不是所有的错误都是可以避免的。尽管你尽了全力，如果仍然发生了异常，编译器就会要求你提供一个处理器。`Class.forName` 方法就是一个抛出受检异常（checked\
  \ exception）的方法示例。在第 11 章中，你将看到几种异常处理策略。现在，我们仅为你展示最简单的处理器实现。\n\n将一个或多个可能抛出受检异常的语句放在\
  \ `try` 块中。然后在 `catch` 子句中提供处理器代码。\n\n```java\ntry\n{\n   可能抛出异常的语句\n}\ncatch (Exception\
  \ e)\n{\n   操作\n}\n```\n\n这里有一个示例：\n\n点击此处查看代码图片\n\n```java\ntry\n{\n   String name\
  \ = . . .; // 获取类名\n   Class cl = Class.forName(name); // 可能抛出异常\n   对 cl 进行某些操作\n\
  }\ncatch (Exception e)\n{\n   e.printStackTrace();\n}\n```\n\n如果类名不存在，`try` 块中的剩余代码将被跳过，程序将进入\
  \ `catch` 子句。（在这里，我们通过 `Throwable` 类的 `printStackTrace` 方法来打印堆栈跟踪。`Throwable` 是\
  \ `Exception` 类的父类。）如果 `try` 块中的没有任何一个方法抛出异常，则 `catch` 子句中的处理器代码将执行跳过。\n\n你只需要为受检异常提供异常处理器。找出哪些方法抛出受检异常是非常的——每当你调用一个可能抛出受检异常的方法且没有提供处理器时，编译器就会报错。\n\
  \n***\n\n### `java.lang.Class` 1.0\n\n- `static Class forName(String className)`\n\
  返回代表名为 `className` 的类的 `Class` 对象。\n- `Object newInstance()`\n返回该类的新实例。\n\n***\n\
  \n***\n\n### `java.lang.reflect.Constructor` 1.1\n\n- `Object newInstance(Object[]\
  \ args)`\n构造该构造函数声明的类的新实例。\n\n![Image](img/image01029.jpeg)\n\n***\n\n***\n\n###\
  \ `java.lang.Throwable` 1.0\n\n- `void printStackTrace()`\n将 `Throwable` 对象和堆栈跟踪打印到标准错误流。\n\
  \n***\n\n#### 5.7.3. 使用反射分析类的能力\n\n这里是反射机制中最重要部分的简要概述，它让你能够检查类的结构。\n\n`java.lang.reflect`\
  \ 包中的 `Field`、`Method` 和 `Constructor` 这三个类分别描述类的字段、方法和构造函数。这三个类都有一个名为 `getName`\
  \ 的方法，该方法返回条项的名称。`Field` 类有一个 `getType` 方法，它返回一个对象（同样是 `Class` 类型），用于描述字段类型。`Method`\
  \ 和 `Constructor` 类有方法可以报告参数类型，而 `Method` 类还报告返回类型。这三个类都有一个名为 `getModifiers` 的方法，该方法返回一个整数，其中有不同的位被开启或关闭，用于描述所使用的的修饰符，如\
  \ `public` 和 `static`。然后你可以使用 `java.lang.reflect` 包中 `Modifier` 类的静态方法来分析 `getModifiers`\
  \ 返回的整数。使用 `Modifier` 类中的如 `isPublic`、`isPrivate` 或 `isFinal` 等方法来判断方法或构造函数是 `public`、`private`\
  \ 还是 `final`。你所做的只需让 `Modifier` 类相应的方法处理 `getModifiers` 返回的整数即可。你也可以使用 `Modifier.toString`\
  \ 方法来打印修饰符。\n\n`Class` 类的 `getFields`、`getMethods` 和 `getConstructors` 方法返回该类支持的*公共*字段、方法和构造函数的数组。这包括父类中的公共成员。`Class`\
  \ 类的 `getDeclaredFields`、`getDeclaredMethods` 和 `getDeclaredConstructors` 方法返回由类中声明的所有字段、方法和构造函数组成的数组。这包括私有的、包级和保护成员，但不包括父类的成员。\n\
  \n列表 5.13 向你展示如何打印关于类的所有信息。程序会提示你输入类名，并写出所有方法和构造函数的签名，以及类中所有实例字段的名称。例如，如果你输入\n\n\
  `java.lang.Double`\n\n程序将打印\n\n点击此处查看代码图片\n\n```java\npublic class java.lang.Double\
