  \   return p.getFirst() == null || p.getSecond() == null;\n    }\n\n    public static\
  \ void swap(Pair<?> p) { swapHelper(p); }\n\n    public static <T> void swapHelper(Pair<T>\
  \ p)\n    {\n        T t = p.getFirst();\n        p.setFirst(p.getSecond());\n \
  \       p.setSecond(t);\n    }\n}\n```\n\n### 12.9 反射与泛型\n\n`Class` 类现在是泛型类。例如，`String.class`\
  \ 实际上是 `Class<String>` 类的一个对象（事实上是它的唯一对象）。\n\n类型参数非常有用，因为它允许 `Class<T>` 的方法在其返回类型上更加具体。以下\
  \ `Class<T>` 的方法利用了类型参数：\n\n- `T newInstance()`\n- `T cast(Object obj)`\n- `T[]\
  \ getEnumConstants()`\n- `Class<? super T> getSuperclass()`\n- `Constructor<T> getConstructor(Class...\
  \ parameterTypes)`\n- `Constructor<T> getDeclaredConstructor(Class... parameterTypes)`\n\
  \n`newInstance` 方法返回一个从无参数构造函数获取的类实例。它的返回类型现在可以声明为 `T`，即由 `Class<T>` 描述的类相同的类型。这节省了一次强制转换。\n\
  \n`cast` 方法返回给定的对象，如果它的类型确实是 `T` 的子类型，则现在被声明为类型 `T`。否则，它会抛出 `BadCastException`。\n\
  \n如果该类不是 `enum`（枚举）类或不是已知类型为 `T` 的枚举值数组，则 `getEnumConstants` 方法返回 `null`。\n\n最后，`getConstructor`\
  \ 和 `getDeclaredConstructor` 方法返回一个 `Constructor<T>` 对象。`Constructor` 类也被制为了泛型，以便其\
  \ `newInstance` 方法具有正确的返回类型。\n\n`java.lang.Class<T>`\n\n- `T newInstance()`：返回一个用无参数构造函数构建的新实例。\n\
  - `T cast(Object obj)`：如果 `obj` 为 `null` 或可以转换为类型 `T`，则返回 `obj`；否则抛出 `BadCastException`。\n\
  - `T[] getEnumConstants()`：如果 `T` 是枚举类型，返回所有值的数组；否则返回 `null`。\n- `Class<? super\
  \ T> getSuperclass()`：返回此类的超类；如果 `T` 不是类或 `Object` 类，则返回 `null`。\n- `Constructor<T>\
  \ getConstructor(Class... parameterTypes)` 和 `Constructor<T> getDeclaredConstructor(Class...\
  \ parameterTypes)`：获取公共构造函数或具有给定参数类型的构造函数。\n\n`java.lang.reflect.Constructor<T>`\n\
  \n- `T newInstance(Object... parameters)`：返回一个用给定参数构建的新实例。\n\n### 12.9.1 使用 Class<T>\
  \ 参数进行类型匹配\n\n在泛型方法中匹配 `Class<T>` 参数的类型变量有时是有用的。这里有一个经典的示例：\n\n```java\npublic static\
  \ <T> Pair<T> makePair(Class<T> c) throws InstantiationException, IllegalAccessException\n\
  {\n    return new Pair<>(c.newInstance(), c.newInstance());\n}\n```\n\n如果你调用 `makePair(Employee.class)`，那么\
  \ `Employee.class` 是类型为 `Class<Employee>` 的对象。`makePair` 方法的类型参数 `T` 匹配 `Employee`，编译器可以推断出该方法返回\
  \ `Pair<Employee>`。\n\n### 12.9.2 虚拟机中的泛型类型信息\n\nJava 泛型的显著特征之一是在虚拟机中擦除泛型。可能会惊讶的是，擦除后的类仍然保留了一些泛型起源的记忆。例如，原始\
  \ `Pair` 类知道它源自泛型类 `Pair<T>`，尽管一个 `Pair` 类型的对象无法判断它是被构建为 `Pair<String>` 还是 `Pair<Employee>`。\n\
  \n同样，考虑方法 `public static min(Comparable[] a)`，它是以下泛型方法的擦除形式：\n```java\npublic static\
  \ <T extends Comparable<? super T>> T min(T[] a)\n```\n你可以使用反射 API 来确定：\n- 该泛型方法有一个类型参数\
  \ `T`；\n- 该类型参数有一个其本身是泛型类型的子类边界；\n- 该边界有一个通配符参数；\n- 通配符参数有一个上类型；\n- 该泛型方法有一个泛型数组参数。\n\
  \n换句话说，你可以重构关于声明的泛型类和方法的所有信息。然而，你将不知道类型参数对于特定对象或方法调用是如何解析的。类文件中包含的用于泛型反射的类型信息与旧版本的虚拟机是不兼容的。\n\
  \n为了表示泛型声明，请使用 `java.lang.reflect` 包中的 `Type` 接口。该接口包含以下：\n- `Class` 类，描述具体类型\n\
  - `TypeVariable` 接口，描述类型变量（如 `T extends Comparable<? super T>`）\n- `WildcardType`\
  \ 接口，描述通配符（如 `? super T`）\n- `ParameterizedType` 接口，描述泛型类或接口（如 `Comparable<? super\
  \ T>`）\n- `GenericArrayType` 接口，描述泛型数组（如 `T[]`）\n\n图 2.5 显示了继承层次结构。注意最后四个子类型是接口——虚拟机实例化实现这些接口的适当类。列表\
  \ 12.4 使用反射 API 打印它对给定类所发现的内容。如果你用 `Pair` 类运行它，将得到此报告：\n```text\nclass Pair<T> extends\
  \ java.lang.Object\n    public T getFirst()\n    public T getSecond()\n    public\
  \ void setFirst(T)\n    public void setSecond(T)\n```\n如果你在 `PairTest` 目录下用 `ArrayAlg`\
  \ 运行它，报告将显示以下方法：\n```text\npublic static <T extends java.lang.Comparable> Pair<T>\
  \ minmax(T[])\n```\n本节末尾的 API 说明了示例程序中使用的方法。\n\nListing 12.4 genericReflection/GenericReflectionTest.java\n\
  \n```java\npackage genericReflection;\n\nimport java.lang.reflect.*;\nimport java.util.*;\n\
  \n/**\n * @version 1.10 2007-05-15\n * @author Cay Horstmann\n */\npublic class\
  \ GenericReflectionTest\n{\n    public static void main(String[] args)\n    {\n\
  \        // 从命令行参数或用户输入读取类名\n        String name;\n        if (args.length > 0)\
  \ name = args[0];\n        else\n        {\n            Scanner in = new Scanner(System.in);\n\
  \            System.out.println(\"Enter class name (e.g. java.util.Collections):\
  \ \");\n            name = in.next();\n        }\n\n        try\n        {\n   \
  \         // 打印类和公共方法的泛型信息\n            Class<?> cl = Class.forName(name);\n   \
  \         printClass(cl);\n            for (Method m : cl.getDeclaredMethods())\n\
  \            {\n                printMethod(m);\n            }\n        }\n    \
  \    catch (ClassNotFoundException e)\n        {\n            e.printStackTrace();\n\
  \        }\n    }\n\n    public static void printClass(Class<?> cl)\n    {\n   \
  \     System.out.print(cl);\n        printTypes(cl.getTypeParameters(), \"<\", \"\
  , \", \">\", true);\n        Type sc = cl.getGenericSuperclass();\n        if (sc\
  \ != null)\n        {\n            System.out.print(\" extends \");\n          \
  \  printType(sc, false);\n        }\n    }\n}\n```\n\n\n\n\n\n```java\nprintTypes(cl.getGenericInterfaces(),\
  \ \" implements \", \", \", \"\", false);\n\nSystem.out.println();\n}\n\npublic\
  \ static void printMethod(Method m)\n{\n    String name = m.getName();\n    System.out.print(Modifier.toString(m.getModifiers()));\n\
  \    System.out.print(\" \");\n    printTypes(m.getTypeParameters(), \"<\", \",\
  \ \", \"> \", true);\n\n    printType(m.getGenericReturnType(), false);\n    System.out.print(\"\
  \ \");\n    System.out.print(name);\n    System.out.print(\"(\");\n    printTypes(m.getGenericParameterTypes(),\
  \ \"\", \", \", \"\", false);\n    System.out.println(\")\");\n}\n\npublic static\
  \ void printTypes(Type[] types, String pre, String sep, String suf,\n    boolean\
  \ isDefinition)\n{\n    if (pre.equals(\" extends \") && Arrays.equals(types, new\
  \ Type[] { Object.class })) return;\n    if (types.length > 0) System.out.print(pre);\n\
  \    for (int i = 0; i < types.length; i++)\n    {\n        if (i > 0) System.out.print(sep);\n\
  \        printType(types[i], isDefinition);\n    }\n    if (types.length > 0) System.out.print(suf);\n\
  }\n\npublic static void printType(Type type, boolean isDefinition)\n{\n    if (type\
  \ instanceof Class)\n    {\n        Class<?> t = (Class<?>) type;\n        System.out.print(t.getName());\n\
  \    }\n    else if (type instanceof TypeVariable)\n    {\n        TypeVariable<?>\
  \ t = (TypeVariable<?>) type;\n        System.out.print(t.getName());\n        if\
  \ (isDefinition)\n            printTypes(t.getBounds(), \" extends \", \" & \",\
  \ \"\", false);\n    }\n    else if (type instanceof WildcardType)\n    {\n    \
  \    WildcardType t = (WildcardType) type;\n        System.out.print(\"?\");\n \
  \       printTypes(t.getUpperBounds(), \" extends \", \" & \", \"\", false);\n \
  \       printTypes(t.getLowerBounds(), \" super \", \" & \", \"\", false);\n   \
  \ }\n    else if (type instanceof ParameterizedType)\n    {\n        ParameterizedType\
  \ t = (ParameterizedType) type;\n        Type owner = t.getOwnerType();\n      \
  \  if (owner != null)\n        {\n            printType(owner, false);\n       \
  \     System.out.print(\".\");\n        }\n        printType(t.getRawType(), false);\n\
  \        printTypes(t.getActualTypeArguments(), \"<\", \", \", \">\", false);\n\
  \    }\n    else if (type instanceof GenericArrayType)\n    {\n        GenericArrayType\
  \ t = (GenericArrayType) type;\n        System.out.print(\"\");\n        printType(t.getGenericComponentType(),\
  \ isDefinition);\n        System.out.print(\"[]\");\n    }\n}\n```\n\n#### `java.lang.Class<T>`\
  \ \n- `TypeVariable[] getTypeParameters()` 5.0: 如果此类型被声明为泛型类型，则获取泛型类型变量，否则返回长度为\
  \ `0` 的数组。\n- `Type getGenericSuperclass()` 5.0: 获取为该类型声明的超类的泛型类型；如果该类型是 `Object`\
  \ 或不是类类型，则返回 `null`。\n- `Type[] getGenericInterfaces()` 5.0: 按声明顺序获取为该类型声明的接口的泛型类型；如果该类型没有实现，则返回长度为\
  \ `0` 的数组。\n\n#### `java.lang.reflect.Method` 1.1\n- `TypeVariable[] getTypeParameters()`\
  \ 5.0: 如果此方法被声明为泛型方法，则获取泛型类型变量，否则返回长度为 `0` 的数组。\n- `Type getGenericReturnType()`\
  \ 5.0: 获取声明此方法的泛型返回类型。\n- `Type[] getGenericParameterTypes()` 5.0: 获取声明此方法的泛型参数类型。如果该方法没有参数，则返回长度为\
  \ `0` 的数组。\n\n#### `java.lang.reflect.TypeVariable` 5.0\n- `String getName()`: 获取此类型变量的名字。\n\
  - `Type[] getBounds()`: 获取此类型变量的子类边界；如果该变量是无界的，则返回长度为 `0` 的数组。\n\n#### `java.lang.reflect.WildcardType`\
  \ 5.0\n- `Type[] getUpperBounds()`: 获取此类型变量的子类 (`extends`) 边界；如果变量没有子类边界，则返回长度为\
  \ `0` 的数组。\n- `Type[] getLowerBounds()`: 获取此类型变量的父类 (`super`) 边界；如果变量没有父类边界，则返回长度为\
  \ `0` 的数组。\n\n#### `java.lang.reflect.ParameterizedType` 5.0\n- `Type getRawType()`:\
  \ 获取此泛化类型的原始类型。\n- `Type[] getActualTypeArguments()`: 获取声明此泛化类型时使用的类型参数。\n- `Type\
  \ getOwnerType()`: 如果这是一个内部类型，则获取外部类类型；如果是顶层类型，则返回 `null`。\n\n#### `java.lang.reflect.GenericArrayType`\
  \ 5.0\n- `Type getGenericComponentType()`: 获取声明此数组的泛型组件类型。\n\n\n\n\n\n随着 `Java SE\
  \ 1.2` 的出现，设计者们认为是时候推出一套完整的数据结构了。他们面临着许多相互冲突的设计挑战。他们希望库是小巧且易学习的。他们不希望像 `C++` 的标准模板库（或\
  \ `STL`）那样具有复杂性，但又希望获得 `STL` 开创的“泛型算法”的益处。他们还希望旧的类能够适应新的框架。正如所有集合库的设计者一样，他们必须做出一些艰难的选择，并在这个过程中产生了一系列独特无二的设计决策。在本节中，我们将探索\
  \ Java 集合框架的基本设计，向你展示如何使用它，并解释一些更具争议的功能背后的原理。\n\n## 13.1.1 分离集合接口与实现\n\n与现代数据结构库的做法一样，Java\
  \ 集合库将`interfaces`（接口）和`implementations`（实现）分开。让我们通过熟悉的数据结构——队列（queue）来观察这种分离。\n\
  \n`queue interface`规定了你可以在队列的末尾添加元素，从头部移除元素，并确定队列中有多少个元素。当你需要收集对象并按“先进先出”的方式检索它们时，就会使用队列（参见图\
  \ 13.1）。\n\n![Image](img/image01209.jpeg)\n\n图 13.1 队列\n\n`queue interface` 的最小形式可能如下：\n\
  \n```java\ninterface Queue<E> // 标准库接口的简化形式\n\n{\n   void add(E element);\n   E\
  \ remove();\n   int size();\n}\n```\n\n该接口没有告诉你任何关于队列如何实现的信息。在队列的两种常见实现中，一个使用“环形数组”，另一个使用链表（参见图\
  \ 13.2）。\n\n![Image](img/image01210.jpeg)\n\n图 13.2 队列的实现\n\n每个实现都可以由实现 `Queue`\
  \ 接口的类来表示。\n\n```java\nclass CircularArrayQueue<E> implements Queue<E> // 不是实际的库类\n\
  \n{\n   CircularArrayQueue(int capacity) { . . . }\n   public void add(E element)\
  \ { . . . }\n   public E remove() { . . . }\n   public int size() { . . . }\n  \
  \ private E[] elements;\n   private int head;\n   private int tail;\n}\n\nclass\
  \ LinkedListQueue<E> implements Queue<E> // 不是实际的库类\n\n{\n   LinkedListQueue() {\
  \ . . . }\n   public void add(E element) { . . . }\n   public E remove() { . . .\
  \ }\n   public int size() { . . . }\n   private Link head;\n   private Link tail;\n\
  }\n```\n\n* * *\n\n![Image](img/image00948.jpeg) 注意\nJava 库中实际上并没有命名为 `CircularArrayQueue`\
  \ 和 `LinkedListQueue` 的类。我们使用这些类作为示例，来解释集合接口与实现之间的概念区别。如果你需要环形数组队列，请使用 `ArrayDeque`\
  \ 类。对于链表队列，直接使用 `LinkedList` 类即可——它实现了 `Queue` 接口。\n\n* * *\n\n当你在程序中使用队列时，一旦集合构建完成，你就不需要知道实际使用的是哪种实现。因此，在构建集合对象时*仅*使用具体类是有意义的。使用*接口类型*来持有集合引用。\n\
  \n```java\nQueue<Customer> expressLane = new CircularArrayQueue<>(100);\n\nexpressLane.add(new\
  \ Customer(\"Harry\"));\n```\n\n通过这种方法，如果你改变了主意，可以轻松切换到不同的实现。你只需要修改程序中的一处代码——即构造函数的调用处。如果你最终决定\
  \ `LinkedListQueue` 是更好的选择，那么你的代码将变为：\n\n```java\nQueue<Customer> expressLane =\
  \ new LinkedListQueue<>();\n\nexpressLane.add(new Customer(\"Harry\"));\n```\n\n\
  为什么选择一种实现而不是另一种？接口对实现的效率没有做任何说明。环形数组比链表稍微高效一些，因此通常是首选的。然而，像往常一样，这是有代价的。\n\n环形数组是一个*有界*（bounded）集合——它具有有限的容量。如果你对程序将收集的对象数量没有上限，那么最终使用链表实现可能更好。\n\
  \n当你学习 API 文档时，你会发现...\n\n## 13.1.2 集合与迭代器\n\nJava 中集合的基础接口是 `Collection`。该接口有两个方法：\n\
  \n```java\ninterface Collection<E>\n{\n   boolean add(E element);\n   Iterator<E>\
  \ iterator();\n}\n```\n\n除了这两个方法外，还有其他方法；我们稍后会讨论。`add` 方法向集合添加一个元素。如果添加元素改变了集合，则返回\
  \ `true`；如果集合未变，则返回 `false`。例如，如果你尝试向集合中添加一个已经存在的对象。\n\n### 13.1.2.1 迭代器\n\n`Iterator`\
  \ 接口有三个方法：\n\n```java\ninterface Iterator<E>\n{\n   E next();\n   boolean hasNext();\n\
  \   void remove();\n}\n```\n\n通过通过反复调用 `next` 方法，你可以逐一访问集合中的元素。然而，如果你到达集合的末尾，`next`\
  \ 方法会抛出 `ElementException`。因此，在调用 `next` 之前需要调用 `hasNext` 方法。该方法在迭代器还有元素待访问时返回 `true`。如果你想检查集合的所有元素，可以请求迭代器并在\
  \ `hasNext` 返回 `true` 时不断调用 `next` 方法。例如：\n\n```java\nCollection<String> c = . .\
  \ .;\n\nIterator<String> iter = c.iterator();\n\nwhile (iter.hasNext())\n{\n   String\
  \ element = iter.next();\n   do something with element\n}\n```\n\n从 Java 5.0 开始，这种循环有一个优雅的快捷方式。你可以使用“for\
  \ each”循环更简洁地编写它：\n\n```java\nfor (String element : c)\n{\n   do something with\
  \ element\n}\n```\n\n编译器简单地将“for each”循环翻译为带有迭代器的循环。\n\n“for each”循环适用于任何实现 `Iterable`\
  \ 接口的对象，该接口只有一个方法：\n\n```java\ninterface Iterable<E>\n{\n   Iterator<E> iterator();\n\
  }\n```\n\n`Collection` 接口继承了 `Iterable` 接口。因此，你可以对标准库中的任何集合使用“for each”循环。\n\n元素的访问顺序取决于集合类型。如果你遍历\
  \ `ArrayList`，迭代器从索引 `0` 开始，每次步增索引。然而，如果你访问 `HashSet` 中的元素，你得到的顺序基本上是随机的。你可以确保在迭代过程中会遇到集合的所有元素，但你不能对它们的顺序做任何假设。这通常不是问题，因为顺序对于计算总和或计算匹配项等计算并不重要。\n\
  \n\n\n\n\n老牌程序员会注意到，`Iterator` 接口的 `next` 和 `hasNext` 方法与 `Enumeration` 接口的 `nextElement`\
  \ 和 `hasMoreElements` 方法的作用相同。Java 集合库的设计者本可以选择使用 `Enumeration` 接口，但他们不喜欢那些冗长的方法名，继而引入了一个方法名更短的新接口。\n\
  \n***\n\nJava 集合库中的迭代器与其他库中的迭代器之间存在着重要的概念性区别。在传统的集合库中（如 C++ 的标准模板库 STL）中，迭代器是模仿数组索引建模的。给定这样一个迭代器，你可以查找存储在该位置的元素，就就像当你有一个数组索引\
  \ `i` 时可以查找数组元素 `a[i]` 一样。在不进行查找的情况下，你可以将迭代器移动到下一个位置。这与通过调用 `i++` 递增数组索引是相同的操作，而不需要执行查找。然而，Java\
  \ 迭代器的工作方式并非如此。查找和位置变化是紧密耦合的。查找元素的唯一方法是调用 `next`，而该查找会移动位置。\n\n相反，请将 Java 迭代器想象为位于*元素之间*。当你调用\
  \ `next` 时，迭代器会*跳过*下一个元素，并返回它刚刚经过的元素的引用（参见图 13.3）。\n\n![Image](img/image01211.jpeg)\n\
  \n图 13.3 推进迭代器\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n另一个有用的比喻。你可以将 `Iterator.next`\
  \ 相当于 `InputStream.read`。从流中读取一个字节会自动“消耗”该字节。下一次调用 `read` 会消耗并返回输入中的下一个字节。同样，重复调用\
  \ `next` 可以让你读取集合中的所有元素。\n\n***\n\n### 13.1.2.2. 移除元素\n\n`Iterator` 接口的 `remove`\
  \ 方法移除上一次调用 `next` 返回的元素。在很多情况下，这是合理的——你需要在看到元素元素之前才能判断它是否是应该被移除的那个。但如果你想移除特定位置的元素，仍然需要跳过该元素。例如，这里是移除字符串集合中第一个元素的方法：\n\
  \n```java\nIterator<String> it = c.iterator();\n\nit.next(); // 跳过第一个元素\n\nit.remove();\
  \ // 现在移除它\n```\n\n更重要的是，`next` 方法和 `remove` 方法的调用之间存在依赖关系。如果在没有调用 `next` 的情况下调用\
  \ `remove` 是非法的。如果你尝试这样做，将抛出 `IllegalStateException`。\n\n如果你想移除两个相邻的元素，不能简单地调用：\n\
  \n```java\nit.remove();\n\nit.remove(); // 错误！\n```\n\n相反，你必须先调用 `next` 来跳过要移除的元素。\n\
  \n```java\nit.remove();\n\nit.next();\n\nit.remove(); // OK\n```\n\n### 13.1.2.3.\
  \ 泛型实用方法\n\n`Collection` 和 `Iterator` 接口是泛型的，这意味着你可以编写操作任何类型集合的实用方法。例如，这里有一个测试任意集合是否包含给定元素的泛型方法：\n\
  \n```java\npublic static <E> boolean contains(Collection<E> c, Object obj)\n{\n\
  \    for (E element : c)\n      if (element.equals(obj))\n          return true;\n\
  \    return false;\n}\n```\n\nJava 库的设计者决定，其中一些实用方法非常有用，因此库应该提供它们。这样一来，库用户就不需要重复造轮子了。`contains`\
  \ 方法就是其中一个方法。\n\n事实上，`Collection` 接口声明了相当实用的方法，所有实现类必须提供这些方法。其中包括：\n\n```java\n\
  int size()\n\nboolean isEmpty()\nboolean contains(Object obj)\nboolean containsAll(Collection<?>\
  \ c)\nboolean equals(Object other)\nboolean addAll(Collection<? extends E> from)\n\
  boolean remove(Object obj)\nboolean removeAll(Collection<?> c)\nvoid clear()\nboolean\
  \ retainAll(Collection<?> c)\nObject[] toArray()\n<T> T[] toArray(T[] arrayToFill)\n\
  ```\n\n这些方法中的许多是自言自明的；你将在本节末尾的 API 说明中找到完整的文档。\n\n当然，如果每个实现 `Collection` 接口的类都必须提供这么多常规方法，将很困扰。为了方便实现者，库提供了一个\
  \ `AbstractCollection` 类，它将基础方法 `size` 和 `iterator` 设为抽象，但根据这些方法实现了了常规方法。例如：\n\n\
  ```java\npublic abstract class AbstractCollection<E>\n    implements Collection<E>\n\
  {\n    . . .\n    public abstract Iterator<E> iterator();\n\n    public boolean\
  \ contains(Object obj)\n    {\n        for (E element : this)\n            if (element.equals(obj))\n\
  \                return true;\n        return false;\n    }\n\n    public boolean\
  \ containsAll(Collection<?> c)\n    {\n        for (Object o : c)\n            if\
  \ (!contains(o))\n                return false;\n        return true;\n    }\n\n\
  \    public boolean equals(Object other)\n    {\n        if (this == other) return\
  \ true;\n        if (!(other instanceof Collection)) return false;\n        // ...\
  \ (后续代码省略以保持逻辑一致)\n    }\n} \n```\n\n具体类现在可以扩展 `AbstractCollection`。由具体类来提供 `iterator`，但\
  \ `contains` 已经处理好了。如果子类有更高效实现 `contains` 的方法，可以这样做。\n\n***\n\njava.util.Collection<E>\
  \ **1.2**\n\n- `Iterator<E> iterator()` 返回一个用于访问集合元素的迭代器。\n- `int size()` 返回集合中存储的元素数量。\n\
  - `boolean isEmpty()` 如果集合不包含元素则返回 `true`。\n- `boolean contains(Object obj)` 如果集合包含等于\
  \ `obj` 的对象则返回 `true`。\n- `boolean containsAll(Collection<?> c)` 如果集合包含另一个集合中的所有元素则返回\
  \ `true`。\n- `boolean add(Object element)` 将元素添加到集合中。如果集合因此调用发生变化，返回 `true`。\n-\
  \ `boolean addAll(Collection<? extends E> c)` 将另一个集合的所有元素添加到集合中。如果集合因此调用发生变化，返回\
  \ `true`。\n- `boolean remove(Object obj)` 从集合中移除等于 `obj` 的对象。如果删除了匹配的对象，则返回 `true`。\n\
  - `boolean removeAll(Collection<?> c)` 从集合中移除另一个集合中的所有元素。如果集合因此调用发生变化，返回 `true`。\n\
  - `void clear()` 移除集合中的所有元素。\n- `boolean retainAll(Collection<?> c)` 移除集合中不等于另一个集合中任何元素的元素。如果集合因此调用发生变化，返回\
  \ `true`。\n- `Object[] toArray()` 返回包含集合中元素的数组。\n- `<T> T[] toArray(T[] arrayToFill)`\
  \ 返回集合中元素的数组。如果 `arrayToFill` 长度足够，则用集合的元素填充它。如果有空间，则会追加一个 `null` 元素。\n\n\n\n\n\
  移除上一次访问的对象。此方法必须紧跟在元素访问之后调用。如果集合自上一次元素访问以来被修改过，则此方法将抛出 `IllegalStateException`。\n\
  \n***\n\n## 13.2. 具体集合\n\n在详细介绍所有接口之前，我们认为首先讨论 Java 库提供的具体数据结构将会有帮助。一旦我们彻底描述了你可能想要使用的类，我们将回到抽象层量上，并查看集合框架是如何组织这些类的。表\
  \ 13.1 展示了 Java 库中的集合，并简要描述了每个集合类的用途。（为了简单起见，我们省略了将在第 14 章中讨论的线程安全集合。）表 13.1 中的所有类都实现了\
  \ `Collection` 接口，但以 `Map` 结尾命名的类除外。这些类实现的是 `Map` 接口。我们将在第 13.2.8 节第 777 页的“[Maps]”中讨论\
  \ `Map` 接口。\n\n表 13.1. Java 库中的具体集合\n\n![Image](img/image01212.jpeg)\n\n### 13.2.1.\
  \ 链表\n\n在本书的许多示例中，我们已经使用了数组及其动态亲戚 `ArrayList` 类。然而，数组和数组列表有一个巨大的缺点。从数组中间删除元素是非常昂贵的的，因为被删除元素之后的所有数组元素都必须向数组开头移动（参见图\
  \ 13.4）。在中间插入元素的情况也是如此。\n\n![Image](img/image01213.jpeg)\n\n图 13.4. 从数组中删除元素\n\n\
  另一个著名的数据结构——*链表*（*linked list*）解决了这个问题。数组在连续的内存位置中存储对象引用，而链表将每个对象存储在独立的*链接*（*link*）中。每个链接还存储指向序列中下一个链接的引用。在\
  \ Java 编程语言中，所有的链表实际上都是*双向的*（*doubly linked*）；也就是说，每个链接也存储指向其前驱的引用（参见图 13.5）。\n\n\
  ![Image](img/image01214.jpeg)\n\n图 13.5. 双向链表\n\n从链表的中间删除元素是一个廉的操作——只需要更新被删除元素周围的链接（参见图\
  \ 13.6）。\n\n![Image](img/image01215.jpeg)\n\n图 13.6. 从链表中删除元素\n\n也许你曾经上过数据结构课程，学习过如何实现链表。你可能对链表中删除或添加元素时处理复杂的链接有糟糕的回忆。如果是这样，你会惊喜地发现，Java\
  \ 集合库提供了一个供你使用的 `LinkedList` 类。\n\n下面的代码示例添加了三个元素，然后删除了第二个：\n\n点击此处查看代码图像\n\n```\n\
  List<String> staff = new LinkedList<>(); // LinkedList 实现 List\n\nstaff.add(\"Amy\"\
  );\n\nstaff.add(\"Bob\");\n\nstaff.add(\"Carl\");\n\nIterator iter = staff.iterator();\n\
  \nString first = iter.next(); // 访问第一个元素\n\nString second = iter.next(); // 访问第二个元素\n\
  \niter.remove(); // 删除上一次访问的元素\n```\n\n然而，链表和通用集合之间存在一个重要的区别。链表是一个*有序集合*（*ordered\
  \ collection*），其中对象的位置至关重要。`LinkedList.add` 方法将对象添加到列表末尾。但你通常想在列表中间的某个地方添加对象。这种依赖位置的\
  \ `add` 方法是迭代器（iterator）的职责，因为迭代器描述了集合中的位置。使用迭代器添加元素仅对于具有自然顺序的集合才有意义。例如，我们在下一节中讨论的*集合*（*set*）数据类型对元素元素不施加任何顺序。\n\
  \n因此，`Iterator` 接口中没有 `add` 方法。相反，集合库提供了一个子接口 `ListIterator`，它包含一个 `add` 方法：\n\n\
  ```\ninterface ListIterator<E> extends Iterator<E>\n{\n   void add(E element);\n\
  \   . . .\n}\n```\n\n与 `Collection.add` 不同，此方法不返回 `boolean`——假设 `add` 操作总是会修改列表。\n\
  \n此外，`ListIterator` 接口有两个方法可以用于反向遍历列表。\n\n```\nE previous()\n\nboolean hasPrevious()\n\
  ```\n\n与 `next` 方法一样，`previous` 方法返回它跳过的对象。\n\n`LinkedList` 类的 `listIterator` 方法返回一个实现\
  \ `ListIterator` 接口的迭代器对象。\n\n```\nListIterator<String> iter = staff.listIterator();\n\
  ```\n\n`add` 方法在迭代器位置*之前*添加新元素。例如，以下代码在链表的第二个元素之前添加 `\"Juliet\"`（参见图 13.7）：\n\n\
  点击此处查看代码图像\n\n```\nList<String> staff = new LinkedList<>();\n\nstaff.add(\"Amy\"\
  );\n\nstaff.add(\"Bob\");\n\nstaff.add(\"Carl\");\n\nListIterator<String> iter =\
  \ staff.listIterator();\n\niter.next(); // 跳过第一个元素\n\niter.add(\"Juliet\");\n```\n\
  \n![Image](img/image01216.jpeg)\n\n图 13.7. 向链表添加元素\n\n如果你多次调用 `add` 方法，元素将按照你提供的顺序添加。它们依次添加到当前迭代器位置之前。\n\
  \n当你使用从 `listIterator` 方法新指向列表开头的迭代器执行 `add` 操作时，新添加的元素成为列表的头部。当迭代器通过列表最后一个元素时（即当\
  \ `hasNext` 返回 `false` 时），添加的元素成为列表的尾部。如果链表有 n 个元素，就有 n+1 个添加新元素的位置。这些位置对应迭代器的 n+1\
  \ 个可能位置。例如，如果链表包含三个元素 A、B 和 C，则有四个插入位置（用 `|` 标记）：\n\n|ABC\n\nA|BC\n\nAB|C\n\nABC|\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n小心处理“光标”类比。`remove` 操作并不完全像退格键。在调用\
  \ `next` 之后，`remove` 方法确实删除了迭代器左侧的元素，就像退格键一样。然而，如果你刚刚调用了 `previous`，右侧的元素将被删除。而且你不能连续调用两次\
  \ `remove`。\n\n与仅取决于迭代器位置的 `add` 方法不同，`remove` 方法取决于迭代状态。\n\n***\n\n最后，`set` 方法用新元素替换由\
  \ `next` 或 `previous` 返回的上一个元素。例如，以下代码用新值替换列表的第一个元素：\n\n点击此处查看代码图像\n\n```\nListIterator<String>\
  \ iter = list.listIterator();\n\nString oldValue = iter.next(); // 返回第一个元素\n\niter.set(newValue);\
  \ // 将第一个元素设置为 newValue\n```\n\n\n\n\n正如你想象的那样，如果一个迭代器在遍历集合时，另一个迭代器正在修改它，可能会出现混乱的情况。例如，假设一个迭代器指向被另一个迭代器刚刚删除的元素之前。此时，该迭代器已失效，不应继续使用。链表迭代器被设计用于检测此类修改。如果迭代器发现其集合被另一个迭代器或集合本身的方法修改了，它将抛出一个\
  \ `ConcurrentModificationException`（并发修改异常）。例如，考虑以下代码：\n\n点击此处查看代码图片\n\n```java\n\
  List<String> list = . . .;\nListIterator<String> iter1 = list.listIterator();\n\
  ListIterator<String> iter2 = list.listIterator();\niter1.next();\niter1.remove();\n\
  iter2.next(); // 抛出 ConcurrentModificationException\n```\n\n对 `iter2.next()` 的调用抛出了\
  \ `ConcurrentModificationException`，因为 `iter2` 检测到列表被从外部修改了。\n\n为了避免并发修改异常，请遵循这一简单规则：你可以根据需要向集合附加尽可能多的迭代器，前提是它们都只作为读取器。或者，你可以附加一个既能读又能写的单个迭代器。\n\
  \n并发修改检测是以一种简单的方式实现的。集合会记录变异操作（如添加和删除元素）的数量。每个迭代器都会单独记录由*它*负责的变异操作次数。在每个迭代器方法的开始处，迭代器只需检查其自身的变异计数是否与集合的计数相等。如果不相等，它就会抛出\
  \ `ConcurrentModificationException`。\n\n***\n\n![Image](img/image00948.jpeg) 备注：\n\
  \n然而，并发修改检测中存在一个奇特的异常。链表只跟踪对列表的*结构性*修改，例如添加和删除链接。`set` 方法*不被视为*结构性修改。你可以向链表附加多个迭代器，所有迭代器都可以调用\
  \ `set` 来更改现有链接的属性。这种能力对于我们在本章稍后讨论的 `Collections` 类中的许多算法来说是必不可少的。\n\n***\n\n现在，你已经了解了\
  \ `LinkedList` 类的基本方法。使用 `ListIterator` 可以双向遍历链表的元素，并添加和删除元素。\n\n正如你在上一节中看到的，许多其他操作链表的有用方法都在\
  \ `Collection` 接口中声明。这些方法大部分在 `LinkedList` 类的父类 `AbstractCollection` 中实现。例如，`toString`\
  \ 方法会调用所有元素的 `toString` 方法并生成一个格式为 `[A, B, C]` 的长字符串。这对于调试非常有用。使用 `contains` 方法检查元素是否存在于链表中。例如，如果链表已经包含与字符串\
  \ `\"Harry\"` 相等的字符串，则 `staff.contains(\"Harry\")` 的调用将返回 `true`。\n\n该库还提供了一些从理论角度来看有些可疑的方法。链表不支持快速的随机访问。如果你想查看链表的第\
  \ *n* 个元素，你必须从头开始，并先跳过前 *n* – 1 个元素。没有捷径可。由于由于原因，程序员通常在需要通过整数索引访问元素的情况下不会使用链表。\n\
  \n尽管如此，`LinkedList` 类提供了一个 `get` 方法，允许你访问特定元素：\n\n```java\nLinkedList<String> list\
  \ = . . .;\nString obj = list.get(n);\n```\n\n当然，这个方法并不高效。如果你发现自己在使用它，那么你可能为你的问题使用了错误的数据结构。\n\
  \n你*永远不要*使用这种幻觉般的随机访问方法来遍历链表。以下代码：\n\n```java\nfor (int i = 0; i < list.size();\
  \ i++)\n    do something with list.get(i);\n```\n\n其效率低得惊人。每当你查找另一个元素时，搜索都会从列表的开始重新开始。`LinkedList`\
  \ 对象并没有缓存位置信息的尝试。\n\n***\n\n![Image](img/image00948.jpeg) 备注：`get` 方法有一个轻微的优化：如果索引至少为\
  \ `size() / 2`，则元素的搜索将从列表末尾开始。\n\n***\n\n列表迭代器接口还有一个方法可以告诉你当前位置的索引。事实上，由于由于 Java\
  \ 迭代器在概念上指向元素之间，因此它有两个这样的方法：`nextIndex` 方法返回下一次调用 `next` 将返回元素的整数索引；`previousIndex`\
  \ 方法返回下一次调用 `previous` 将返回元素的索引。当然，它仅仅比 `nextIndex` 小 1。这些方法是高效的——迭代器维护着其当前位置的计数。最后，如果你有一个整数索引\
  \ `n`，那么 `list.listIterator(n)` 返回一个指向索引 `n` 元素之前的迭代器。也就是说，调用 `next` 产生与 `list.get(n);`\
  \ 相同的元素，而获取该迭代器是低效的。\n\n如果你只有一个只有少数元素的链表，你不必过度担心 `get` 和 `set` 方法的成本。但既然如此，为什么要使用链表呢？使用链表的唯一理由是为了最小化列表中间插入和删除的成本。如果你只有几个元素，可以直接使用\
  \ `ArrayList`。我们建议你直接使用 `ArrayList`。如果你想随机访问集合，使用 `ArrayList` 而不是链表。\n\n程序 13.1\
  \ 让链表发挥作用。它创建了两个列表，合并了它们，然后从第二个列表中删除第二个元素，最后测试了 `removeAll` 方法。我们建议你跟踪程序的流程并特别注意迭代器。你可能会发现绘制迭代器位置图很有帮助，例如\
  \ ACE | BFG | CE | BFG | AB | DFG。\n\n注意 `System.out.println(a)` 的调用通过调用 `AbstractCollection`\
  \ 中的 `toString` 方法打印链表 `a` 中的所有元素。\n\n\n\n\n\n# `java.util.List<E>` 1.2\n\n- `ListIterator<E>\
  \ listIterator()` 返回一个用于遍历列表元素的列表迭代器。\n- `ListIterator<E> listIterator(int index)`\
  \ 返回一个用于遍历列表元素的列表迭代器，其首次调用 `next` 时将返回具有指定索引的元素。\n- `void add(int i, E element)`\
  \ 在指定位置添加一个元素。\n- `void addAll(int i, Collection<? extends E> elements)` 将集合中的所有元素添加到指定位置。\n\
  - `E remove(int i)` 移除并返回指定位置的元素。\n- `E get(int i)` 获取指定位置的元素。\n- `E set(int i,\
  \ E element)` 用新元素替换指定位置的元素，并返回旧元素。\n- `int indexOf(Object element)` 返回与指定元素相等的第一次出现的位置；如果未找到匹配元素，则返回\
  \ `-1`。\n- `int lastIndexOf(Object element)` 返回与指定元素相等的最后一次出现的位置；如果未找到匹配元素，则返回 `-1`。\n\
  \n# `java.util.ListIterator<E>` 1.2\n\n- `void add(E newElement)` 在当前位置之前添加元素。\n\
  - `void set(E newElement)` 用新元素替换上次通过 `next` 或 `previous` 访问的元素。如果自上次调用 `next` 或\
  \ `previous` 之后列表结构发生了修改，则抛出 `IllegalStateException`。\n- `boolean hasPrevious()`\
  \ 如果反向遍历列表时还有另一个元素可以访问，则返回 `true`。\n- `E previous()` 返回上一个对象。如果已到达列表开头，则抛出 `NoSuchElementException`。\n\
  - `int nextIndex()` 返回下次调用 `next` 将返回元素的索引。\n- `int previousIndex()` 返回下次调用 `previous`\
  \ 将返回元素的索引。\n\n# `java.util.LinkedList<E>` 1.2\n\n- `LinkedList()` 构造一个空链表。\n- `LinkedList(Collection<?\
  \ extends E> elements)` 一个链表并添加集合中的所有元素。\n- `void addFirst(E element)`\n- `void\
  \ addLast(E element)` 在列表的开头或结尾添加元素。\n- `E getFirst()`\n- `E getLast()` 返回列表开头或结尾的元素。\n\
  - `E removeFirst()`\n- `E removeLast()` 移除并返回列表开头或结尾的元素。\n\n## 13.2.2. 数组 (Array\
  \ Lists)\n\n在前面的节中，你看到了 `List` 接口以及实现它的 `LinkedList` 类。`List` 接口描述了一个有序集合，其中元素的位置非常重要。遍历元素有两种协议：通过迭代器以及通过\
  \ `get` 和 `set` 方法进行随机访问。后者对于链表并不合适，但对于数组来说，`get` 和 `set` 显然非常有意义。集合库提供了实现 `List`\
  \ 接口的熟悉的 `ArrayList` 类。`ArrayList` 封装了一个动态重新分配的对象数组。\n\n![Image](img/image00948.jpeg)\
  \ 备注\n\n如果你是一位资深 Java 程序员，可能在需要动态数组时都使用过 `Vector` 类。为什么要使用 `ArrayList` 而不是 `Vector`\
  \ 呢？原因很简单：`Vector` 类的所有方法都是**同步的**（`synchronized`）。从两个线程访问 `Vector` 对象是安全的。但如果你只从单个线程访问（这是常见得多的情况），你的代码会在同步上浪费大量时间。相比之下，`ArrayList`\
  \ 的方法不是同步的。我们建议在不需要同步的情况下，使用 `ArrayList` 而不是 `Vector`。\n\n## 13.2.3. 哈希集 (Hash Sets)\n\
  \n链表和数组允许你指定排列元素的顺序。然而，如果你正在寻找某个特定元素但不记得它的位置，你就需要遍历所有元素直到找到匹配项为止。如果集合包含很多元素，这可能会非常耗时。如果你不在乎元素的顺序，某些数据结构可以让你更快地找到元素。缺点是，这些数据结构让你对元素出现的顺序无法无法控制。这些数据结构按照其自身目的的顺序来组织元素。\n\
  \n快速查找对象的常用数据结构是**哈希表**（`hash table`）。哈希表为每个对象计算一个整数，称为**哈希码**（`hash code`）。哈希码以某种方式从对象的实例字段派生，最好是使得具有不同数据的对象产生不同的代码。表\
  \ 13.2 列出了几个 `String` 类 `hashCode` 方法产生的哈希码示例。\n\n表 13.2 由 hashCode 方法产生的哈希码\n\n\
  ![Image](img/image0121.jpeg)\n\n如果你定义了自己的类，你就有责任实现自己的 `hashCode` 方法——更多信息请参阅 第 5\
  \ 章。你的实现需要与 `equals` 方法兼容：如果 `a.equals(b)`，那么 `a` 和 `b` 必须具有相同的哈希码。\n\n现在重要的是，哈希码可以快速计算，且该计算仅依赖于需要哈希的对象的状态。\n\
  \n在 Java 中，哈希表实现为链表的数组。每个列表被称为**桶**（`bucket`）（参见图 13.8）。找到对象在表中的位置，计算其哈码并对桶数取模。结果就是桶的索引。例如，如果一个对象的哈码为\
  \ `76268` 且有 `128` 个桶，那么它被放在桶 `108` 中（因为 `76268 % 128` 等于 `108`）。\n\n如果你运气好，该桶是空的，那么只需将元素插入该桶。当然，有时你会遇到一个已经填充的桶。这被称为**哈冲突**（`hash\
  \ collision`）。然后与该桶中的所有对象进行比较以判断它是否已存在。如果哈希码随机分布且桶的数量足够，只需要几次比较。\n\n![Image](img/image128.jpeg)\n\
  \n图 13.8. 哈希表\n\n如果你想进一步控制哈希表的性能，可以指定初始桶数。桶数用于收集具有相同哈希值的对象。如果哈希表中插入了过多元素，冲突就会增加，检索性能下降。\n\
  \n如果你知道大约会有多少元素位于表中，可以设置桶数。通常，你应该将其设置为预期元素数量的 75% 到 150% 之间。某些研究人员认为将桶数设置为质数是一个好主意，可以防止键聚集。然而，证据并不充分。标准库使用\
  \ 2 的幂作为桶数，默认值为 `16`。（你提供的任何大小值都会自动舍整到下一个 2 的幂。）\n\n当然，你并不总是知道需要存储多少元素，或者你的初始猜测可能太低。如果哈希表变得太满，就需要**重哈希**（`rehashed`）。为了重哈希表，会创建一个更多桶的新表，将所有元素插入新表，并丢弃原始表。**负载因子**（`load\
  \ factor`）决定了哈希表何时进行重哈希。\n\n\n\n\n\n哈希表可以实现多种重要的数据结构。其中最简单的是 `set` 类型。集合是一个不包含重复元素的集合。集合的\
  \ `add` 方法会首先尝试查找要添加的对象，只有当该对象尚不存在时才将其添加。\n\nJava 集合库提供了一个 `HashSet` 类，它基于哈希表实现了集合。你使用\
  \ `add` 方法添加元素。`contains` 方法被重写了，以便进行快速查找以检查某个元素是否已存在于集合中。它只检查一个桶中的元素，而不是集合中的所有元素。\n\
  \n哈希集合的迭代器会依次访问所有的桶。由于哈希处理将元素分散在表中，因此它们被访问的顺序似乎是随机的。如果你不在乎集合中元素的顺序，就可以使用 `HashSet`。\n\
  \n本节末尾的示例程序（Listing 13.2）从 `System.in` 读取单词，将其添加到集合中，并最后打印集合中的所有单词。例如，你可以通过命令行壳启动程序，并提供*爱丽丝仙游*的文本（你可以从\
  \ [www.gutenberg.org](http://www.gutenberg.org) 获取）：\n\n```bash\njava SetTest <\
  \ alice30.txt\n```\n\n程序从输入中读取所有单词并将它们添加到哈希集合中。然后遍历集合中的唯一单词，最后打印出计数。（*爱丽丝仙游*共有 5,909\
  \ 个唯一单词，包括开头的版权声明。）这些单词以随机顺序出现。\n\n***\n\n![Image](img/image0095.jpeg) 警告\n\n在修改集合元素时要小心。如果元素的哈希值发生变化，该元素将不再处于数据结构中的正确位置。\n\
  \n***\n\nListing 13.2. set/SetTest.java\n\n点击此此处查看代码图片\n\n***\n\n```java\npackage\
  \ set;\n\nimport java.util.*;\n\n/**\n * 此程序使用集合打印 System.in 中的所有唯一单词。\n * @version\
  \ 1.11 2012-01-26\n * @author Cay Horstmann\n */\npublic class SetTest\n{\n    public\
  \ static void main(String[] args)\n    {\n        Set<String> words = new HashSet<>();\
  \ // HashSet implements Set\n        long totalTime = 0;\n\n        Scanner in =\
  \ new Scanner(System.in);\n        while (in.hasNext())\n        {\n           \
  \ String word = in.next();\n            long callTime = System.currentTimeMillis();\n\
  \            words.add(word);\n            callTime = System.currentTimeMillis()\
  \ - callTime;\n            totalTime += callTime;\n        }\n\n        Iterator<String>\
  \ iter = words.iterator();\n        for (int i = 1; i <= 20 && iter.hasNext(); i++)\n\
  \            System.out.println(iter.next());\n        System.out.println(\". .\
  \ .\");\n        System.out.println(words.size() + \" distinct words. \" + totalTime\
  \ + \" milliseconds.\");\n    }\n}\n```\n\n***\n\n***\n\n`java.util.HashSet<E>`\
  \ 1.2\n\n- `HashSet()` 构建一个空的哈希集合。\n- `HashSet(Collection<? extends E> elements)`\
  \ 构建一个哈希集合并添加集合中的所有元素。\n- `HashSet(int initialCapacity)` 构建一个空的哈希集合。\n- `HashSet(int\
  \ initialCapacity, float loadFactor)` 构建一个具有指定容量和负载因子的（`0.0` 到 `1.0` 之间的数字）的空哈希集合。\n\
  \n***\n\n***\n\n`Object` 比较\n\n`TreeSet` 如何知道你想要对元素进行排序？默认情况下，树假设你的元素实现了 `Comparable`\
  \ 接口。该接口定义了一个方法：\n\n```java\npublic interface Comparable<T> {\n    int compareTo(T\
  \ other);\n}\n```\n\n如果 `a` 和 `b` 相等，调用 `a.compareTo(b)` 必须返回 `0`；如果 `a` 在排序顺序上于\
  \ `b` 之前，则返回负整数；如果 `a` 在 `b` 之后，则返回正整数。确切的值并不重要，重要的是它的符号（> 0, 0 或 < 0）。多个 Java 平台类实现了\
  \ `Comparable` 接口。一个例子是 `String` 类。它的 `compareTo` 方法按字典顺序（有时称为*字典序*）比较字符串。\n\n如果你插入自己的对象，必须通过实现\
  \ `Comparable` 接口来自己定义排序顺序。`Object` 类中没有 `compareTo` 的默认实现。例如，这里是如何通过零件号对 `Item`\
  \ 对象进行排序：\n\n```java\nclass Item implements Comparable<Item> {\n    public int compareTo(Item\
  \ other) {\n        return partNumber - other.partNumber;\n    }\n    // ...\n}\n\
  ```\n\n如果你比较两个正整数（例如我们示例中的零件号），你可以简单地返回它们的差——如果第一个项目应该在第二个项目之前，则差为负数；如果数字相同，则为零；否则为正数。这个技巧只适用于范围足够小的整数。如果\
  \ `x` 是很大的正整数而 `y` 是一个很大的负整数，差值可能会溢出。\n\n`TreeSet` 类与 `HashSet` 类似，但有一个改进：它会自动对你插入的元素进行排序。当你遍历它时，值将按排序顺序呈现。例如，如果树包含\
  \ $n$ 个元素，添加一个新元素大约需要 $\\log n$ 次比较。因此，将元素添加到树中比添加到 `HashSet` 中稍微慢一些。\n\n\n\n\n\
  然而，使用 `Comparable` 接口来定义排序顺序有明显的局限性。一个给定的类只能实现该接口一次。但如果你需要在在一个集合中按零件号对一组项目排序，而在另一个集合中按描述排序，该怎么办？此外，如果你需要对一个创建者没有实现\
  \ `Comparable` 接口的类对象进行排序，该怎么办？\n\n在这些情况下，你可以通过向 `TreeSet` 构造函数传递 `Comparator` 对象来告诉\
  \ `tree set` 使用不同的比较方法。`Comparator` 接口声明了一个带有两个显式参数的 `compare` 方法：\n\n```java\n\
  public interface Comparator<T>\n{\n   int compare(T a, T b);\n}\n```\n\n与 `compareTo`\
  \ 方法一样，`compare` 方法在 `a` 在 `b` 之前返回负整数，如果它们相同则返回零，否则返回正整数。\n\n要根据描述对项目排序，只需定义实现\
  \ `Comparator` 接口的类即可：\n\n```java\nclass ItemComparator implements Comparator<Item>\n\
  {\n    public int compare(Item a, Item b)\n    {\n        String descrA = a.getDescription();\n\
  \        String descrB = b.getDescription();\n        return descrA.compareTo(descrB);\n\
  \    }\n}\n```\n\n然后你将此类的对象传递给 `tree set` 构造函数：\n\n点击此处查看代码图片\n\n```java\nItemComparator\
  \ comp = new ItemComparator();\nSortedSet<Item> sortByDescription = new TreeSet<>(comp);\n\
  ```\n\n如果你使用比较器构建一个树，它会在每次需要比较两个元素时使用该对象。\n\n请注意，这个项目比较器没有数据。它只是比较方法的持有者。这种对象有时被称为*函数对象（function\
  \ object*）*。\n\n函数对象通常“随地”定义，即作为匿名内部类的实例：\n\n点击此处查看代码图片\n\n```java\nSortedSet<Item>\
  \ sortByDescription = new TreeSet<>(new\n    Comparator<Item>()\n    {\n       \
  \ public int compare(Item a, Item b)\n        {\n            String descrA = a.getDescription();\n\
  \            String descrB = b.getDescription();\n            return descrA.compareTo(descrB);\n\
  \        }\n    });\n```\n\n* * *\n\n![Image](img/image00948.jpeg) 注意\n\n实际上，`Comparator<T>`\
  \ 接口声明了两个方法：`compare` 和 `equals`。当然，*每类*类都有一个 `equals` 方法；因此，在接口声明中添加该方法似乎意义不大。API\
  \ 文档解释说，你不需要重写 `equals` 方法，但在某些情况下这样做可能会提高性能。例如，如果使用 `TreeSet` 类的 `addAll` 方法从另一个也使用相同比较器的集合中添加元素，它可能会运行得更高效。\n\
  \n* * *\n\n如果你回看 表 13.3，你可能会想你是否应该始终使用 `tree set` 而不是 `hash set`。毕竟，添加元素似乎并没有花费太多的长时间，而且元素是自动排序的。答案取决于你正在收集的数据。如果你不需要数据排序，就没有理由为排序开销付出代价。更重要的是，对于某些数据，构出一个排序顺序比哈希函数困难得多。哈希函数只需要对对象进行相当好的打乱即可，而比较函数必须以完全精确的度区分对象。\n\
  \n为了使这种区别更具体，考虑收集一组矩形的任务。如果你使用 `TreeSet`，你需要提供一个 `Comparator<Rectangle>`。你如何比较两个矩形？按面积吗？这行不通。你可能有两个坐标不同但面积相同的矩形。树的排序顺序必须是*全序（total\
  \ ordering*）*。任何两个元素都必须是可以比较的，并且只有当元素相等时比较结果才为零。矩形有这样的排序顺序（其坐标的字典序），但计算起来既自然又繁琐。相比之下，`Rectangle`\
  \ 类已经定义了哈希函数。它只需对坐标进行哈希处理。\n\n* * *\n\n![Image](img/image00948.jpeg) 注意\n\n从 Java\
  \ SE 6 开始，`TreeSet` 类实现了 `NavigableSet` 接口。该接口增加了几个定位元素和反向遍历的便利方法。详情请参阅 API 注释。\n\
  \n* * *\n\nListing 13.3 中的程序构建了两个 `Item` 对象的树集。第一个按零件号排序，这是 `Item` 对象的默认排序顺序。第二个集合按描述排序，使用了自定义的比较器。\n\
  \nListing 13.3. `treeSet/TreeSet.java` 点击此处查看代码图片\n\n```java\npackage treeSet;\n\
  \n/**\n * @version 1.12 2012-01-26\n * @author Caymann\n */\nimport java.util.*;\n\
  \n/**\n * 程序通过比较描述对项目集进行排序。\n */\npublic class TreeSetTest\n{\n    public static\
  \ void main(String[] args)\n    {\n        SortedSet<Item> parts = new TreeSet<>();\n\
