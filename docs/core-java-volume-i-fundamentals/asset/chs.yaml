  \n\n\n返回类型不是方法签名的一部分。这意味着，你不能拥有两个名称和参数类型相同但返回类型不同的方法。\n\n### 4.6.2. 字段的默认初始化\n\n\
  如果你没有在构造函数中显式设置字段，它将自动被设置为默认值：数字为 `0`，`boolean` 值为 `false`，对象引用为 `null`。有些人认为依赖默认值是一种糟糕的编程习惯。诚然，如果字段是在这种不可见的情况下被初始化的，确实会让别人更难理解你的代码。\n\
  \n![Image](img/image00948.jpeg) <span style=\"color: red;\">注意</span>\n\n这是字段与局部变量之间的一个重要区别。你必须始终在方法中显式初始化局部变量。但在类中，如果你没有初始化字段，它会被自动初始化为默认值（`0`、`false`\
  \ 或 `null`）。\n\n例如，考虑 `Employee` 类。假设你没有在构造函数中指定如何初始化某些字段。默认情况下，`salary` 字段将初始化为\
  \ `0`，`name` 和 `hireDay` 字段将初始化为 `null`。\n\n然而，这并不是一个好主意。如果任何人调用 `getName` 或 `getHireDay`\
  \ 方法，他们将得到一个他们可能需要的 `null` 引用：\n\n```java\nDate h = harry.getHireDay();\n\ncalendar.setTime(h);\
  \ // 如果 h 为 null 则抛出异常\n```\n\n### 4.6.3. 无参数构造函数\n\n许多类都包含一个无参数的构造函数，它用于创建一个状态被设置为适当默认值的对象。例如，这里是\
  \ `Employee` 类的一个无参数构造函数：\n\n```java\npublic Employee()\n{\n   name = \"\";\n  \
  \ salary = 0;\n   hireDay = new Date();\n}\n```\n\n如果你写了一个完全没有任何构造函数的类，编译器会为你提供一个无参数构造函数。这个构造函数会将*所有*实例字段设置为它们的默认值。因此，实例字段中包含的所有数值数据都将是\
  \ `0`，所有的 `boolean` 值都将 `false`，所有的对象变量都将被设置为 `null`。\n\n如果一个类提供了至少一个构造函数但不提供无参数构造函数，那么在不提供参数的情况下构造对象是非合法的。例如，我们最初的\
  \ Listing 4.2 中的 `Employee` 类提供了一个单一构造函数：\n\n```java\nEmployee(String name, double\
  \ salary, int y, int m, int d)\n```\n\n对于该类，构造默认员工是不合法的。也就是说，调用\n\n```java\ne =\
  \ new Employee();\n```\n\n将会是一个错误。\n\n![Image](img/image00950.jpeg) <span style=\"\
  color: red;\">注意</span>请记住，*只有*当你的类没有其他构造函数时，你才能获得一个免费的无参数构造函数。如果你为自己的类至少写了一个构造函数，并且希望类的用户能够通过调用\n\
  \n`new ClassName()`\n\n来创建实例，那么你必须提供一个无参数构造函数。当然，如果你对所有字段的默认值满意，你只需要提供：\n\n```java\n\
  public ClassName()\n{\n}\n```\n\n### 4.6.4. 显式字段初始化\n\n通过重载类中的构造器方法，你可以构建许多方法来设置类实例字段的初始状态。确保无论调用哪个构造函数，每个实例字段都被设置为有意义的值，始终是一个好主意。\n\
  \n你可以简单地为类定义中的任何字段赋值。例如：\n\n```java\nclass Employee\n{\n   private String name =\
  \ \"\";\n   . ...\n}\n```\n\n此赋值操作是在构造函数执行之前完成的。如果一个类的所有构造函数都需要将某个特定的实例字段设置为相同的值，那么这种语法就特别有用。\n\
  \n初始化值不必是一个常量值。这里有一个使用方法调用初始化字段的示例。考虑一个 `Employee` 类，其中每个员工都有一个 `id` 字段。你可以这样初始化它：\n\
  \n```java\nclass Employee\n{\n   private static int nextId;\n   private int id =\
  \ assignId();\n   . ...\n   private static int assignId()\n   {\n      int r = nextId;\n\
  \      nextId++;\n      return r;\n   }\n   . ...\n}\n```\n\n![Image](img/image00951.jpeg)\
  \ <span style=\"color: red;\">C++ 注意</span>\n\n在 C++ 中，你不能直接初始化类的实例字段。所有字段必须在构造函数中设置。然而，C++\
  \ 有一种特殊的初始化列表语法，例如\n\n```cpp\nEmployee::Employee(String n, double s, int y, int\
  \ m, int d) // C++\n:  name(n),\n   salary(s),\n   hireDay(y, m, d)\n{\n}\n```\n\
  \nC++ 使用这种特殊语法来调用字段构造函数。在 Java 中，没有这种需要，因为对象没有子对象，只有指向其他对象的指针。\n\n### 4.6.5. 参数名\n\
  \n当你编写非常简单的构造函数（你会写很多这种）时，构思参数名称可能会有些令人沮丧。\n\n我们通常选择使用单字母参数名：\n\n```java\npublic\
  \ Employee(String n, double s)\n{\n   name = n;\n   salary = s;\n}\n```\n\n然而，缺点是你需要阅读代码才能知道\
  \ `n` 和 `s` 参数的含义。\n\n有些程序员会在每个参数前加上前缀：\n\n```java\npublic Employee(String aName,\
  \ double aSalary)\n{\n   name = aName;\n   salary = aSalary;\n}\n```\n\n这种方式很整洁。读者可以立即看出参数的含义。\n\
  \n另一种常用的技巧是利用参数变量会*隐藏*同名实例字段的特性。例如，如果你调用参数 `salary`，那么 `salary` 指的是参数而不是实例字段。你仍然可以通过\
  \ `this.salary` 访问实例字段。这里有一个例子：\n\n```java\npublic Employee(String name, double\
  \ salary)\n{\n   this.name = name;\n   this.salary = salary;\n}\n```\n\n### 4.6.6.\
  \ 调用另一个构造函数\n\n`this` 关键字指的是方法的隐含参数。然而，这个关键字还有第二个含义。\n\n如果*构造函数的第一个语句*的形式为 `this(...)`，那么该构造函数会调用类的另一个构造函数。这里有一个典型的示例：\n\
  \n```java\npublic Employee(double s)\n{\n   // 调用 Employee(String, double)\n   this(\"\
  Employee #\" + nextId, s);\n   nextId++;\n}\n```\n\n当你调用 `new Employee(60000)` 时，`Employee(double)`\
  \ 构造函数会调用 `Employee(String, double)` 构造函数。\n\n这样使用 `this` 关键字非常有用——你只需要编写一次公共构造代码。Java\
  \ 中的 `this` 引用等同于 C++ 中的 `this` 指针。然而，在 C++ 中一个构造函数无法调用另一个。如果你想在 C++ 中提取公共初始化代码，必须编写一个单独的方法。\n\
  \n### 4.6.7. 初始化块\n\n你已经见过两种初始化数据字段的方法：\n\n• 在构造函数中设置值\n• 在声明中赋值\n\n在 Java 中，还有第三种机制，称为*初始化块*。类声明可以包含任意的代码块。这些块在每当类的对象被构造时都会执行。例如：\n\
  \n```java\nclass Employee\n{\n   private static int nextId;\n   private int id;\n\
  \   private String name;\n   private double salary;\n   // 对象初始化块\n   {\n      id\
  \ = nextId;\n      nextId++;\n   }\n}\n```\n\n\n\n\n```java\n    public Employee(String\
  \ n, double s)\n    {\n        name = n;\n        salary = s;\n    }\n\n    public\
  \ Employee()\n    {\n        name = \"\";\n        salary = 0;\n    }\n\n    . .\
  \ .\n}\n```在此示例中，`id` 字段在对象初始化块中初始化，无论使用哪种构造函数来构建对象。初始化块首先运行，然后执行构造函数的体。\n\n这种机制并非绝对必要，也不常见。通常将初始化代码放在构造函数内部会更直接。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n在初始化块中设置字段是合法的，即使这些字段在类中稍后才定义。然而，为了避免循环定义，读取稍后才初始化的字段是不合法的。具体规则在《Java\
  \ 语言规范》第 8.3.2.3 节中有详细说明（[`docs.oracle.com/javase/specs`](http://docs.oracle.com/javase/specs)）。这些规则足以让编译器实现者感到困惑——Java\
  \ 的早期版本在实现这些规则时存在细微的错误。因此，我们建议你始终将初始化块放在字段定义之后。\n\n***\n\n初始化数据字段的方法有很多种，为构造过程提供所有可能的路径可能会非常困惑。以下是调用构造函数时详细发生的情况：\n\
  \n1. 所有数据字段都被初始化为它们的默认值（`0`、`false` 或 `null`）。\n2. 所有的字段初始化器和初始化块都按照它们在类声明中出现的顺序进行执行。\n\
  3. 如果构造函数的第一行调用了另一个构造函数，则执行第二个构造函数的体。\n4. 执行构造函数的体。\n\n当然，组织你的初始化代码始终是一个好主意，这样另一个程序员就可以轻松理解它，而无需成为语言法专家。例如，如果一个类的构造函数依赖于数据字段声明的顺序，那将是非常奇怪且容易出错的。\n\
  \n要初始化静态字段，可以提供一个初始值或使用静态初始化块。你已经看到了了第一种机制：\n\n```java\nprivate static int nextId\
  \ = 1;\n```\n\n如果你的类的静态字段需要复杂的初始化代码，请使用静态初始化块。\n\n将代码放在块中并使用关键字 `static` 标记它。这是一个示例。我们希望员工\
  \ ID 数字从一个小于 10,000 的随机整数开始。\n\n```java\n// static 初始化块\nstatic\n{\n    Random generator\
  \ = new Random();\n    nextId = generator.nextInt(10000);\n}\n```\n\n静态初始化发生在类首次加载时。与实例字段一样，除非你显式地设置为另一个值，否则静态字段为\
  \ `0`、`false` 或 `null`。所有的静态字段初始化器和静态初始化块都按照它们在类声明中出现的顺序执行。\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意 这里有一个让你同事们惊叹的 Java 冷知识：在 JDK 6 之前，你可以用 Java 写一个“Hello, World”程序，而无需编写 `main`\
  \ 方法。\n\n```java\npublic class Hello\n{\n    static\n{\n        System.out.println(\"\
  Hello, World\");\n    }\n}\n```当你用 `java Hello` 调用类时，类被加载，静态初始化块打印“Hello, World”，然后你才会收到一个关于\
  \ `main` 未定义的错误信息。你可以在静态块的末尾调用 `System.exit(0)` 来避免这个瑕疵。\n\n***\n\n`Listing 4.5`\
  \ 显示了我们在本节讨论的许多特性：\n- 重载构造函数\n- 使用 `this(...)` 调用另一个构造函数\n- 无参数构造函数\n- 对象初始化\n-\
  \ 静态初始化\n- 实例字段初始化\n- `java.util.Random`\n- `Random()` 构造一个新的随机生成器。\n- `nextInt(int\
  \ n)` 返回 0 到 `n`–1 之间的随机数。\n\nListing 4.5 ConstructorTest/ConstructorTest.java\n\
  \n***\n\n```java\nimport java.util.*;\n/**\n* 程序演示了对象构造。\n* @version 1.0 2004-02-19\n\
  * @author Cay Horstmann\n */\npublic class ConstructorTest\n{\n    public static\
  \ void main(String[] args)\n    {\n        // 在 staff 数组中填充三个 Employee 对象\n    \
  \    Employee[] staff = new Employee[3];\n\n        staff[0] = new Employee(\"Harry\"\
  , 40000);\n        staff[1] = new Employee(60000);\n        staff[2] = new Employee();\n\
  \n        // 打印所有 Employee 对象的信息\n        for (Employee e : staff)\n           \
  \ System.out.println(\"name=\" + e.getName() + \",id=\" + e.getId() + \",salary=\"\
  \ + e.getSalary());\n    }\n}\nclass Employee\n{\n    private static int nextId;\n\
  \n    private int id;\n    private String name = \"\"; // 实例字段初始化\n    private double\
  \ salary;\n\n    // 静态初始化块\n    static\n    {\n        Random generator = new Random();\n\
  \        // 将 nextId 设置为 0 到 9999 之间的随机数\n        nextId = generator.nextInt(10000);\n\
  \    }\n\n    // 对象初始化块\n    {\n        id = nextId;\n        nextId++;\n    }\n\
  \n    // 重载构造函数\n    public Employee(String n, double s)\n    {\n        name =\
  \ n;\n        salary = s;\n    }\n\n    public Employee()\n    {\n        name =\
  \ \"\";\n        salary = 0;\n    }\n\n    public String getName()\n    {\n    \
  \    return name;\n    }\n\n    public double getSalary()\n    {\n        return\
  \ salary;\n    }\n\n    public int getId()\n    {\n        return id;\n    }\n}\n\
  ```\n\n***\n\n#### 4.6.8 对象销毁与 finalize 方法\n\n某些面向对象的编程语言（特别是 C++）对于对象不再使用时可能需要的任何清理代码，都有显式的析构器方法。析构函数中最常见的活动是回收为对象留出的内存。由于\
  \ Java 具有自动垃圾回收机制，因此不需要手动回收内存，所以 Java 不支持析构函数。\n\n当然，某些对象使用了内存以外的资源，例如文件或使用系统资源的另一个对象的句柄。在这种情况下，当资源不再被需要时对其进行回收和循环利用是非常关重要的。\n\
  \n你可以向任何类添加一个 `finalize` 方法。`finalize` 方法会在垃圾回收器扫描该对象之前调用。在实践中，*不要依赖于* `finalize`\
  \ *方法*来回收任何短缺的资源——你无法知道该方法何时会被被调用。\n\n方法调用 `System.runFinalizersOnExit(true)` 保证在\
  \ Java 关闭之前会调用 finalizer 方法。然而，该方法本质上是不安全的并且已被废弃。另一种方案是使用 `Runtime.addShutdownHook`\
  \ 方法添加“停机钩子”——详情请参 API 文档。\n\n\n\n\n如果你在使用完资源后需要立即关闭它，你需要手动管理它。提供一个 `close` 方法来执行必要的清理工作，并在完成对象操作后调用它。在第\
  \ 11.2.4 节中的“Try-with-Resources 语句”（位于第 644 页），中将将看到如何确保该方法被自动调用。\n\n## 4.7. 包\n\
  \nJava 允许你将类分组在一个名为 `package`（包）的集合中。包对于组织你的工作以及将你的工作与其他提供的代码库分开非常方便。\n\n标准 Java\
  \ 库分布在许多包中，包括 `java.lang`、`java.util`、`java.net` 等。标准 Java 包是分层包的示例。就像你在硬盘上拥有嵌套的子目录一样，你可以通过嵌套层级来组织包。所有的标准\
  \ Java 包都在 `java` 和 `javax` 包的层次结构中。\n\n使用包的主要目的是为了保证类名的唯一性。假设两个程序员想出了一个好主意，提供一个\
  \ `Employee` 类。只要他们都将自己的类放在不同的包中，就不会发生冲突。事实上，为了绝对保证包名的唯一性，可以使用反向书写的 Internet 域名名（已知是唯一的）。然后你就可以为不同的项目使用子包。例如，`horstmann.com`\
  \ 是其中一位作者注册的域名。反向书写后，它变成了 `com.horstmann` 包。该包可以进一步细分为如 `com.horstmann.corejava`\
  \ 等子包。\n\n从编译器的角度来看，嵌套包之间没有任何关系。例如，`java.util` 和 `java.util.jar` 包之间互不相涉。每个包都是自己独立的类集合。\n\
  \n### 4.7.1. 类导入\n\n一个类可以使用其所在包中的所有类，以及其他包中的所有 `public` 类。\n\n你可以通过两种方式访问另一个包中的公共类。第一种是简单地在*每个*类名之前加上完整的包名。例如：\n\
  \n```\njava.util.Date today = new java.util.Date();\n```\n\n这显然很繁琐。更简单、更常见的方法是使用\
  \ `import` 语句。`import` 语句的作用是提供一个引用包中类的简写形式。一旦你使用了 `import`，就不再需要为类提供全名了。\n\n你可以导入一个特定的类或整个包。你将\
  \ `import` 语句置于源文件的顶部（但在任何 `package` 语句之后）。例如，你可以使用以下语句导入 `java.util` 包中的所有类：\n\n\
  ```java\nimport java.util.*;\n```\n\n然后你就可以使用\n\n```java\nDate today = new Date();\n\
  ```\n\n而无需包前缀。你也可以导入包中的某个特定类：\n\n```java\nimport java.util.Date;\n```\n\n`java.util.*`\
  \ 语法不那么繁琐。它对代码大小没有负面影响。然而，如果你显式地导入类，代码的阅读者确切知道你使用了哪些类。\n\n***\n\n![Image](img/image00949.jpeg)\
  \ 提示\n\n在 Eclipse 中，你可以选择菜单选项 Source -> Organize Imports（源 -> 组织导入）。如 `import java.util.*;`\
  \ 之类的包语句会自动展开为一系列特定的导入列表，如：\n\n```java\nimport java.util.ArrayList;\nimport java.util.Date;\n\
  ```\n\n这是一个非常方便的功能。\n\n***\n\n然而，请注意，你只能使用 `*` 符号导入单个包。你不能使用 `import java.*` 或 `import\
  \ java.*.*` 来导入所有以 `java` 为前缀的包。\n\n大多数，你只需要导入需要的包，而不需要太担心它们。只有在发生名称冲突时你才需要注意包。例如，`java.util`\
  \ 和 `java.sql` 包都包含一个 `Date` 类。假设你写了一个导入了这两个包的程序。\n\n```java\nimport java.util.*;\n\
  import java.sql.*;\n```\n\n如果你现在使用 `Date` 类，就会得到一个编译错误：\n\n```\nDate today; // 错误--java.util.Date\
  \ 还是 java.sql.Date?\n```\n\n编译器无法确定你想要哪一个 `Date` 类。你可以通过添加特定的 `import` 语句来解决这个问题：\n\
  \n```java\nimport java.util.*;\nimport java.sql.*;\nimport java.util.Date;\n```\n\
  \n如果你真的需要两个 `Date` 类怎么办？那么你需要在每个类名上使用完整的包名。\n\n点击此处查看代码图像\n\n```java\njava.util.Date\
  \ deadline = new java.util.Date();\njava.sql.Date today = new java.sql.Date(...);\n\
  ```\n\n在包中定位类是*编译器*的活动。类文件中的字节码始终使用完整的包名来引用其他类。\n\n***\n\n![Image](img/image00951.jpeg)\
  \ C++ 注意事项\n\nC++ 程序员有时会将 `import` 与 `#include` 混淆。两者没有任何共同点。在 C++ 中，你必须使用 `#include`\
  \ 来包含声明。因为 C++ 编译器不会查找正在编译的文件之外的内容。\n\n在 Java 中，除非你告诉它去哪里查找，否则它会查找正在编译的文件之外的内容。\n\
  \n### 4.7.2. 静态导入\n\n`import` 的一种形式允许导入静态方法和字段，而不仅仅是类。\n\n例如，如果你在源文件顶部添加\n\n```java\n\
  import static java.lang.System.*;\n```\n\n那么你就可以无需类前缀使用 `System` 类的静态方法和字段：\n\n\
  ```java\nout.println(\"Goodbye, World!\"); // 即 System.out\nexit(0); // 即 System.exit\n\
  ```\n\n你也可以导入特定的方法或字段：\n\n```java\nimport static java.lang.out;\n```\n\n在实践中，很难想象许多程序员想要缩写\
  \ `System.out` 或 `System.exit`。结果代码看起来没那么清晰。另一方面，\n\n```java\nsqrt(pow(x, 2) + pow(y,\
  \ 2))\n```\n\n比\n\n```java\nMath.sqrt(Math.pow(x, 2) + Math.pow(y, 2))\n```\n清晰得多。\n\
  \n### 4.7.3. 将类添加到包\n\n要将类放入包中，你必须在源文件的顶部放置包名，位于定义包内类的代码之前。例如，列表 4.7 中的 `Employee.java`\
  \ 文件如下所示：\n\n```java\npackage com.horstmann.corejava;\n\npublic class Employee\n\
  {\n    ...\n}\n```\n\n如果你不在源文件中放入 `package` 语句，那么该源文件中的类就属于默认包。默认包没有包名。到为止，我们所有的示例类都在默认包中。\n\
  \n将源文件放在与完整包名匹配的子目录。例如，`com.horstmann.corejava` 包中的所有源文件应该放在 `com/horstmann/corejava`（Windows\
  \ 上为 `com\\horstmann\\corejava`）目录下。编译器会将类文件放在相同的目录结构中。\n\n\n\n位于 Listing 4.6 和\
  \ 4.7 中的程序分布在两个包中：`PackageTest` 类属于默认包，而 `Employee` 类属于 `com.horstmann.corejava`\
  \ 包。因此，`Employee.java` 文件必须位于子目录 `com/horstmann/corejava` 中。换句话说，目录结构如下：\n\n![Image](img/image0101.jpeg)\n\
  \n要编译此程序，只需切换到基础目录并运行命令：\n\n```bash\njavac PackageTest.java\n```\n\n编译器会自动找到文件 `com/horstmann/corejava/Employee.java`\
  \ 并对其进行编译。\n\n让我们来看一个更实际的例子，在这个例子中，我们没有使用默认包，而是将类分布在几个包中（`com.horstmann.corejava`\
  \ 和 `com.mycompany`）。\n\n![Image](img/image01016.jpeg)\n\n在这种情况下，你仍然必须从*基**编译和运行类，即包含\
  \ `com` 目录的目录：\n\n```bash\njavac com/mycompany/PayrollApp.java\njava com.mycompany.PayrollApp\n\
  ```\n\nListing 4.6. PackageTest/PackageTest.java\n\n点击此处查看代码图片\n\n***\n\n```java\n\
  import com.horstmann.corejava.*;\n\n// Employee 类定义在那个包中\n\nimport static java.lang.System.*;\n\
  /**\n * 此程序演示了包的使用。\n * @version 1.11 2004-02-19\n * @author Cay Horstmann\n */\n\
  public class PackageTest\n{\n    public static void main(String[] args)\n    {\n\
  \        // 因为有 import 语句，我们在这里不需要使用 com.horstmann.corejava.Employee\n        Employee\
  \ harry = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n\n        harry.raiseSalary(5);\n\
  \n        // 因为有静态导入语句，我们在这里不需要使用 System.out\n        out.println(\"name=\" + harry.getName()\
  \ + \",salary=\" + harry.getSalary());\n    }\n}\n```\n\n***\n\nListing 4.7. PackageTest/com/horstmann/corejava/Employee.java\n\
  \n点击此处查看代码图片\n\n***\n\n```java\npackage com.horstmann.corejava;\n// 此文件中的类是该包的一部分\n\
  \nimport java.util.*;\n// import 语句位于 package 语句之后\n\n/**\n * @version 1.10 1999-12-18\n\
  \ * @author Cay Horstmann\n */\npublic class Employee\n{\n    private String name;\n\
  \    private double salary;\n    private Date hireDay;\n\n    public Employee(String\
  \ n, double s, int year, int month, int day)\n    {\n        name = n;\n       \
  \ salary = s;\n        GregorianCalendar calendar = new GregorianCalendar(year,\
  \ month - 1, day);\n        // GregorianCalendar 使用 0 表示 1 月\n        hireDay =\
  \ calendar.getTime();\n    }\n\n    public String getName()\n    {\n        return\
  \ name;\n    }\n\n    public double getSalary()\n    {\n        return salary;\n\
  \    }\n\n    public Date getHireDay()\n    {\n        return hireDay;\n    }\n\n\
  \    public void raiseSalary(double byPercent)\n    {\n        double raise = salary\
  \ * byPercent / 100;\n        salary += raise;\n    }\n}\n```\n\n***\n\n再次注意，编译器操作的是*文件*（带有文件分隔符和扩展名\
  \ `.java`），而 Java 解释器加载的是*类*（使用点分隔符）。\n\n![Image](img/image0049.jpeg) 提示：从下一章开始，我们将在源代码中使用包。这样，你就可以为每个章节创建一个\
  \ IDE 项目，而不是为每个小节。\n\n***\n\n![Image](img/image0050.jpeg) 注意：编译器在编译时*不会*检查目录结构。例如，假设你有一个起始如下内容的源文件：\n\
  \n```java\npackage com.mycompany;\n```\n\n即使该文件没有包含在子目录 `com/mycompany` 中，你也可以编译该文件。如果源文件不依赖于其他包，它将无错误地编译。然而，生成的程序将无法运行。当你尝试运行时，*虚拟机*将无法找到生成的类。\n\
  \n***\n\n#### 4.7.4. 包作用域\n\n你已经遇到过访问修饰符 `public` 和 `private`。标记为 `public` 的特性可以被任何类使用。`private`\
  \ 特性只能由定义它的类使用。如果你既没有指定 `public` 没有 `private`，该特性（即类、方法或变量）可以被同一个*包*中的所有方法访问。\n\n\
  考虑第 146 页上 Listing 4.2 中的程序。`Employee` 类没有被定义为公共类。因此，只有同包中的其他类可以访问它。\n\n\n\n\n类文件也可以存储在\
  \ JAR（Java 归档）文件中。JAR 文件以压缩格式包含多个类文件和子目录，既能节省空间又能提高性能。当你在程序中使用第三方库时，通常会获得一个或多个需要包含的\
  \ JAR 文件。JDK 也提供了许多 JAR 文件，例如包含成千上万个库类的 `jre/lib/rt.jar` 文件。你将在第 10 章中看到如何创建你自己的\
  \ JAR 文件。\n\n![Image-tip](img/image00949.jpeg) 提示\n\nJAR 文件使用 ZIP 格式来组织文件和子目录。你可以使用任何\
  \ ZIP 工具来查看 `rt.jar` 和其他 JAR 文件的内部内容。\n\n要在程序之间共享类，你需要执行以下操作：\n\n1.  将你的类文件放在一个目录中，例如\
  \ `/home/user/classdir`。注意，该目录是包树的*基准*目录。如果你添加了类 `com.horstmann.corejava.Employee`，那么\
  \ `Employee.class` 文件必须位于子目录 `/home/user/classdir/com/horstmann/corejava` 中。\n2.\
  \  将任何 JAR 文件放在一个目录中，例如 `/home/user/archives`。\n3.  设置*类路径*（class path）。类路径是所有包含类文件的位置集合。\n\
  \n在 UNIX 中，类路径上的元素用冒号分隔：\n\n```\n/home/user/classdir:.:/home/user/archives/archive.jar\n\
  ```\n\n在 Windows 中，它们用分号分隔：\n\n```\nc:\\classdir;.;c:\\archives\\archive.jar\n```\n\
  \n在两种情况下，点 `.` 都表示当前目录。\n\n此类路径包含：\n\n*   基准目录 `/home/user/classdir` 或 `c:\\classdir`；\n\
  *   当前目录（`.`）以及\n*   JAR 文件 `/home/user/archives/archive.jar` 或 `c:\\archives\\\
  archive.jar`。\n\n从 Java SE 6 开始，你可以为 JAR 文件目录指定通配符，如下：\n\n```\n/home/user/classdir:.:/home/user/archives/'*'\n\
  ```\n\n或者\n\n```\nc:\\classdir;.;c:\\archives\\*\n```\n\n在 UNIX 中，`*` 必须经过转义以防止\
  \ shell 扩展。\n\n`archives` 目录下的所有 JAR 文件（但不包括 `.class` 文件）都包含在此类路径中。\n\n运行时库文件（`rt.jar`\
  \ 以及 `jre/lib` 和 `jre/lib/ext` 目录下的其他 JAR 文件）始终会被搜索；不要将它们显式包含在类路径中。\n\n![Image-caution](img/image00950.jpeg)\
  \ 注意\n\n`javac` 编译器始终会在当前目录查找文件，但 `java` 虚拟机启动器只有在“`.”目录位于类路径上时才会查找当前目录。如果你没有设置类路径，这不是问题——默认类路径由“`.”目录组成。但如果你设置了类路径却忘记包含“`.”目录，你的程序将无错误编译，但无法运行。\n\
  \n类路径列出了所有作为查找类*起点*的目录和归档文件。让我们考虑我们的示例类路径：\n\n```\n/home/user/classdir:.:/home/user/archives/archive.jar\n\
  ```\n\n假设虚拟机正在查找 `com.horstmann.corejava.Employee` 类的类文件。它首先查找存储 `jre/lib` 和 `jre/lib/ext`\
  \ 目录归档文件中的系统类文件。它在那里没有找到类文件，因此转向类路径。接着它查找以下文件：\n\n*   `/home/user/classdir/com/horstmann/corejava/Employee.class`\n\
  *   从当前目录开始的 `com/horstmann/corejava/Employee.class`\n*   `/home/user/archives/archive.jar`\
  \ 内部 `com/horstmann/corejava/Employee.class`\n\n编译器定位文件比虚拟机困难。如果你在没有指定包的情况下引用了一个类，编译器首先需要找到包含该类的包。它查询所有\
  \ `import` 指令作为类的可能的来源。例如，假设源文件包含以下指令：\n\n```java\nimport java.util.*;\nimport com.horstmann.corejava.*;\n\
  ```\n\n并且源代码引用了类 `Employee`。编译器随后尝试寻找 `java.lang.Employee`（因为 `java.lang` 包始终默认导入）、`java.util.Employee`、`com.horstmann.corejava.Employee`\
  \ 以及当前包中的 `Employee`。它在类路径的所有位置中搜索*每一个*这些类。如果找到多个类，则为编译时错误。（类必须是唯一的，因此 `import`\
  \ 语句的顺序并不重要。）\n\n编译器更进了一步。它查看*源文件*以检查源文件是否比类文件新。如果是，源文件将自动重新编译。记住，你只能从其他包导入公共类（public\
  \ classes）。一个源文件只能包含一个公共类，且文件名与公共类名必须匹配。因此，编译器可以轻松地定位公共类的源文件。然而，你可以从当前包导入非公共类。这些类可能定义在不同名称的源文件中。如果你从当前包导入一个类，编译器会搜索*所有*位置来确定类。\n\
  \n#### 4.8.1 设置类路径\n\n最佳方法是用 `-classpath`（或 `-cp`）选项指定类路径：\n\n```\njava -classpath\
  \ /home/user/classdir:.:/home/user/archives/archive.jar\n```\n\n或者\n\n```\njava\
  \ -classpath c:\\classdir;.;c:\\archives\\archive.jar\n```\n\n整个命令必须写在一行。\n\n使用\
  \ `-classpath` 选项是设置类路径的首选方法。另一种方法是环境变量 `CLASSPATH`。具体取决于你的 shell。在 Bourne Again\
  \ shell (bash) 中，使用命令：\n\n```bash\nexport CLSPATH=/home/user/classdir:.:/home/user/archives/archive.jar\n\
  ```\n\n在 C shell 中，使用命令：\n\n```bash\nsetenv CLSPATH /home/user/classdir:.:/home/user/archives/archive.jar\n\
  ```\n\n在 Windows shell 中，使用：\n\n```bash\nset CLSPATH=c:\\classdir;.;c:\\archives\\\
  archive.jar\n```\n\n类路径一直有效到 shell 退出。\n\n## 4.9 文档注释\n\nJDK 包含一个名为 `javadoc` 的有用工具，它可以从源文件生成\
  \ HTML 文档。事实上，我们在第三章](#part0008.xhtml_ch03)中描述的在线 API 文档仅仅是对标准 Java 库源代码运行 `javadoc`\
  \ 的结果。\n\n\n\n\n\n如果你在源代码中添加以特殊分隔符 `/**` 开头的注释，你也可以轻松地生成外观专业的文档。这是一个非常好的方法，因为它让你能够将代码和文档保持在一个地方。如果你将文档放在单独的文件中，那么正如你可能知道的，代码和注释会随着时间的推移而产生脱节。当文档注释与源代码在同一个文件中时，更新两者并重新运行\
  \ `javadoc` 就是一件容易的事。\n\n### 4.9.1. 注释插入\n\n`javadoc` 工具会提取以下项目的信息：\n\n- 包 (Packages)\n\
  - 公有类和接口 (Public classes and interfaces)\n- 公有和保护字段 (Public and protected fields)\n\
  - 公有和保护构造函数及方法\n\n保护特性在第 5 章中引入，接口在第 6 章中。\n\n你可以（并且应该）为这些特性每一个提供注释。每个注释都放置在其所描述的特性*上方*。注释以\
  \ `/**` 开始，以 `*/` 结束。\n\n每个 `/** . . . */` 文档注释包含*自由格式文本*，随后后是*标签*。标签以 `@` 开头，例如\
  \ `@author` 或 `@param`。\n\n自由格式文本的*第一句*应该是一个*摘要语句*。`javadoc` 工具会自动生成提取这些句子的摘要页面。\n\
  \n在自由格式文本中，你可以使用 HTML 修饰符，例如 `<em>...</em>` 用于强调，`<code>...</code>` 用于等宽“打字机”字体，`<strong>...</strong>`\
  \ 用于强强调，甚至可以使用 `<img ...>` 来包含图像。然而，你应该避免使用标题 `<h1>` 或规则 `<hr>`，因为它们可能会干扰文档的格式。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n如果你的注释中包含指向其他文件的链接（例如，图表或用户界面组件图），请将这些文件放在包含源文件的目录的子目录中，命名为\
  \ `doc-files`。`javadoc` 工具会将 `doc-files` 目录及其内容从源目录复制到文档目录。你需要在链接中使用 `doc-files`\
  \ 目录，例如 `<img src=\"doc-files/uml.png\" alt=\"UML 图\"/>`。\n\n***\n\n### 4.9.2. 类注释\n\
  \n类注释必须放置在任何 `import` 语句*之后*，直接位于 `class` 定义之前。\n\n这是一个类注释的示例：\n\n点击此处查看代码图像\n\n\
  ```java\n/**\n * 一个 <code>Card</code> 对象代表一张扑牌，例如\n * \"红桃皇后\"。一张牌有一个花色（方片、红心、\n\
  \ * 黑桃或梅花）和一个值（1 = A, 2 . . . 10, 11 = J,\n * 12 = Q, 13 = K）。\n */\npublic class\
  \ Card\n{\n   . . .\n}\n```\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n不需要在每行前面添加\
  \ `*`。例如，以下注释同样有效：\n\n点击此处查看代码图像\n\n```java\n/**\n *   一个 <code>Card</code> 对象代表一张扑牌，例如\n\
  \ *   如 \"红桃皇后\"。一张牌有一个花色（方片、红心、\n *   黑桃或梅花）和一个值（1 = A, 2 . . . 10, 11 = J,\n *\
  \   12 = Q, 13 = K）。\n*/\n```\n\n然而，大多数 IDE 会自动提供星号，并在换行发生变化时重新排列它们。\n\n***\n\n\
  ### 4.9.3. 方法注释\n\n每个方法注释必须紧接在其所描述的方法之前。除了通用标签外，你还可以使用以下标签：\n\n- `@param` *变量描述*：此标签为当前方法的“参数”部分添加一个条目。描述可以跨多行并可以使用\
  \ HTML 标签。一个方法的所有 `@param` 标签必须保持在一起在一起。\n- `@return` *描述*：此标签为当前方法添加一个“返回”部分。描述可以跨多行并可以使用\
  \ HTML 标签。\n- `@throws` *类描述*：此标签添加一条说明，说明此方法可能会抛出异常。异常是第 11 章的主题。\n\n这是一个方法注释的示例：\n\
  \n点击此处查看代码图像\n\n```java\n/**\n * 增加员工的工资。\n * @param byPercent 加薪的百分比（例如 10 意味着\
  \ 10%）\n * @return 加薪的金额\n */\npublic double raiseSalary(double byPercent)\n{\n\
  \   double raise = salary * byPercent / 100;\n   salary += raise;\n   return;\n\
  }\n```\n\n### 4.9.4. 字段注释\n\n你只需要记录静态常量。例如：\n\n```java\n/**\n * 红桃\n */\npublic\
  \ static final HEARTS = 1;\n```\n\n### 4.9.5. 通用注释\n\n以下标签可用于所有注释：\n\n- `@author`\
  \ *名称*：此标签创建一个“作者”条目。你可以有多个 `@author` 标签，每个作者一个。\n- `@version` *文本*：此标签创建一个“版本”条目。`text`\
  \ 可以是该版本的任何描述。\n- `@since` *文本*：此标签创建一个“自”条目。`text` 可以是引入此内容的版本的任何描述。\n- `@deprecated`\
  \ *文本*：此标签添加注释，说明该类、方法或变量不应再使用。`text` 应该建议一个替代方案。\n- `@see` *引用*：此标签在“另参见”部分添加一个超链接。它可以同时用于类和方法。\n\
  \n### 4.9.6. 包注释和概述注释\n\n你将类、方法和变量注释直接放在 Java 源文件中，并用 `/** . . . */` 文档注释分隔。然而，为了生成*包*注释，你需要在每个包目录下添加一个单独的文件。你有两个选择：\n\
  \n1. 提供一个名为 `package.html` 的 HTML 文件。`<body>...</body>` 标签之间的所有文本都将被提取。\n\n\n\n\n\
  \n## 2. 提供一个名为 `package-info.java` 的 Java 文件。该文件必须包含一个初始 Javadoc 注释，用 `/**` 和 `*/`\
  \ 分隔，随后跟一个 `package` 语句。它不应包含任何其他代码或注释。\n\n你还可以为所有源文件提供一个概览注释。将其放在名为 `overview.html`\
  \ 的文件中，该文件位于包含所有源文件的父目录下。<body>...</body>` 标签之间的所有文本会被提取。当用户从导航栏选择“Overview”（概览）时，就会显示此注释。\n\
  \n### 4.9.7. 注释提取\n\n在这里，`docDirectory` 是你希望 HTML 文件存放的目录名称。按照以下步骤操作：\n\n1.  **切换到包含**你需要文档的源文件的目录。如果你有需要文档的嵌套包，例如\
  \ `com.horstmann.corejava`，你必须在包含子目录 `com` 的目录中运行。（如果你提供了 `overview.html` 文件，则该目录就是包含它的目录。）\n\
  \n2.  **运行命令**\n\n```\njavadoc -d docDirectory nameOfPackage\n```\n\n针对单个包运行。或者，运行\n\
  \n```\njavadoc -d docDirectory nameOfPackage[1] nameOfPackage[2]...\n```\n\n来文档多个包。如果你的文件在默认包中，请改运行\n\
  \n```\njavadoc -d docDirectory *.java\n```\n\n如果你省略了 `-d` `docDirectory` 选项，HTML\
  \ 文件将提取到当前目录。这可能会导致目录变得混乱，我们不建议这样做。\n\n`javadoc` 程序可以通过许多命令行选项进行精调。例如，你可以使用 `-author`\
  \ 和 `-version` 选项在文档中包含 `@author` 和 `@version` 标签。（默认情况下，它们会被省略。）另一个有用的选项是 `-link`，用于包含指向标准类的超链接。例如，如果你使用命令\n\
  \n```\njavadoc -link http://docs.oracle.com/javase/7/docs/api *.java\n```\n\n所有标准库类都将自动链接到\
  \ Oracle 网站上的文档。\n\n如果你使用 `-linksource` 选项，每个源文件将转换为 HTML（没有颜色代码，但有行号），并且每个类名和方法名将变成指向源码的超链接。\n\
  \n有关其他选项，请参阅 `javadoc` 程序的在线文档：[`docs.oracle.com/javase/1.5.0/docs/guide/javadoc`](http://docs.oracle.com/javase/1.5.0/docs/guide/javadoc)。\n\
  \n***\n\n![Image](img/image00948.jpeg) 注意\n\n如果你需要进一步的自定义——例如，生成 HTML 以外格式的文档——你可以提供自己的\
  \ `doclet` 以生成你所需的任何形式的输出。显然，这是一种特殊需求；关于 doclet 的详细信息，请参阅在线文档 [`docs.oracle.com/javase/1.5.0/docs/guide/javadoc/doclet/overview.html`](http://docs.oracle.com/javase/1.5.0/docs/guide/javadoc/doclet/overview.html)。\n\
  \n***\n\n### 4.10. 类设计提示\n\n在不试图面面面或啰嗦的情况下，我们想用一些提示结束本章，这些提示将让你的类在良好的 OOP 圈中更易接受。\n\
  \n1.  **始终保持数据私有化。**\n    这是首要任务；执行任何其他操作都会违反封装性。你可能偶尔需要编写访问器（accessor）或修改器（mutator）方法，但保持实例字段私有仍然更好。痛苦的经验表明，数据的表示可能会\
  \ way，但数据用法的变化频率低得多。当数据保持私有时，其表示的变化不会影响类的使用者，而且更容易检测错误。\n\n2.  **始终初始化数据。**\n  \
  \  Java 不会为你初始化局部变量，但它会初始化对象的实例字段。不要依赖默认值，要显式地初始化所有变量，可以通过提供默认值或在所有构造函数中设置默认值。\n\
  \n3.  **不要在类中使用过多的基本类型。**\n    这种思想是用其他类来替换对基本类型的多次相关使用。这使得你的类更容易被理解和修改。例如，替换 `Customer`\
  \ 类中的以下实例字段：\n\n```\nprivate String street;\nprivate String city;\nprivate String\
  \ state;\nprivate int zip;\n```\n\n替换为一个名为 `Address` 的新类。这样，你就可以轻松地处理地址的变化，例如处理国际地址的需求。\n\
  \n4.  **并不是所有字段都需要单独的字段访问器和修改器。**\n    你可能需要获取和设置员工的薪水。一旦对象构造完成，你肯定不需要更改入职日期。而且，通常对象具有某些你不希望其他人获取或设置的实例字段，例如\
  \ `Address` 类中状态缩写字的数组。\n\n6.  **拆分职责过多的类。**\n    这个提示无疑是模糊的：“太多”显然取决于观察者的眼光。然而，如果有一种明显的方法可以将一个复杂的类拆分为两个在概念上更简单的类，请抓住这个机会。（另一方面，不要做得过头；十个类、每个类只有一个方法，通常是过之嫌举了。）\n\
  \n    这里有一个坏设计的示例：\n\n点击此处查看代码图片\n\n```\npublic class CardDeck // 坏设计\n{\n   private\
  \ Card[] cards;\n   public CardDeck() { ... }\n   public void shuffle() { ... }\n\
  \   public Card getTop() { ... }\n   public void draw() { ... }\n}\n```\n\n这个类实际上实现了两个不同的概念：牌组（带有\
  \ `shuffle` 和 `draw` 方法）以及单张牌（带有检查值和花色的方法）。有必要引入一个代表单张牌的 `Card` 类。\n\n```\npublic\
  \ class Card\n{\n   private int value;\n   private int suit;\n   public Card(int\
  \ aValue, int aSuit) { ... }\n   public int getValue() { ... }\n   public int getSuit()\
  \ { ... }\n}\n```\n\n7.  **让你的类和方法的名称反映它们的职责。**\n    就像变量应该具有反映其代表内容的意义名称一样，类也是如此。（标准库确实包含一些可疑的例子，例如\
  \ `Date` 类。）一个良好的规范是类名应该是名词（`Order`），或者由形容词修饰的名词（`RushOrder`）或动名词（“-ing” 单词，如 `BillingAddress`）。对于方法，遵循标准规范，访问器方法以小写\
  \ `get (getSalary)` 开始，修改器方法使用小写 `set (setSalary)`。\n\n在本章中，我们涵盖了对象和类的基础，使 Java\
  \ 成为一种“基于对象的语言”。为了成为真正的面向对象，编程语言还必须支持继承和多态。Java 对这些特性的支持是下一章的主题。\n\n\n\n\n第 4 章向你介绍了类和对象。在本章中，你将学习`inheritance`继承，这是面向对象编程的另一个核心概念。继承的核心思想是你可以创建构建在现有类之上的新类。当你继承一个现有类时，你可以重用（或继承）它的方法，并可以添加新的方法和字段以使你的新类适应新的情况。这种技术在\
  \ Java 编程中至关重要。\n\n本章还涵盖了`reflection`反射，即在运行程序中查找更多类及其属性的能力。反射是一项强大的功能，但不可否认非常复杂。由于反射对工具开发者比对应用程序员更感兴趣，你可以在第一次阅读时略过该章节的这部分，以后再回来。\n\
  \n### 5.1. 类、超类和子类\n\n让我们回到上一节中讨论的 `Employee` 类。假设（不幸的是）你供职的一家公司对经理的待遇与普通员工不同。当然，经理在许多方面与员工是一样的。员工和经理都领取薪水。然而，员工被要求完成分配的任务以换工资，而经理如果真的实现了他们应该做的工作，就能获得`bonuses`（奖金）。这种情况正是需要继承的地方。为什么呢？因为你需要定义一个新类\
  \ `Manager` 并添加功能。但你可以保留一些已经在 `Employee` 类中编写好的内容，并且原始类的*所有*字段都可以被保留。从更抽象地说，`Manager`\
  \ 和 `Employee` 之间存在着明显的“是...”（is–a）关系。每个经理*都是*员工：这种“是...”的关系是继承的标志。\n\n以下是如何定义继承自\
  \ `Employee` 类的 `Manager` 类。使用 Java 关键字 `extends` 来表示继承。\n\n```java\nclass Manager\
  \ extends Employee\n{\n   added methods and fields\n}\n```\n\n* *\n\n![Image](img/image00951.jpeg)\
  \ C++ 笔记\n\n继承在 Java 和 C++ 中是相似的。Java 使用 `extends` 关键字而不是 `:` 符号。Java 中的所有继承都是公共继承；没有类似于\
  \ C++ 中私有继承和保护继承的功能。\n\n* *\n\n关键字 `extends` 表示你正在创建一个派生自现有类的新类。现有类被称为 `superclass`（超类）、`base\
  \ class`（基类）或 `parent class`（父类）。新类被称为 `subclass`（子类）、`derived class`（派生类）或 `child\
  \ class`（子类）。这两个词是 Java 程序员最常用的术语，尽管有些程序员更倾向于父子类的类比，这与“继承”主题契合得很好。\n\n`Employee`\
  \ 类是一个超类，但并不是因为它优于它的子类或包含更多功能。*事实上，事实恰恰相反：*子类比其超类拥有*更多*的功能。例如，正如我们在查看 `Manager`\
  \ 类剩余代码时将看到的，`Manager` 类封装了更多数据，并拥有比其超类 `Employee` 更的功能。\n\n* *\n\n![Image](img/image00948.jpeg)\
  \ 笔记\n\n前缀 `super` 和 `sub` 来自理论计算机科学和数学中使用的集合语言。所有员工的集合包含了所有经理的集合，这被称为经理集合的 `superset`（超集）。换句话说，所有经理的集合是所有员工集合的\
  \ `subset`（子集）。\n\n* *\n\n我们的 `Manager` 类有一个新字段来存储奖金，并有一个新方法来设置它：\n\n```java\nclass\
  \ Manager extends Employee\n{\n   private double bonus;\n   . . .\n\n   public void\
  \ setBonus(double b)\n   {\n      bonus = b;\n   }\n}\n```\n\n这些方法和字段并没有特殊之处。如果你有一个\
  \ `Manager` 对象，可以直接调用 `setBonus` 方法。\n\n```java\nManager boss = . . .;\nboss.setBonus(5000);\n\
  ```\n\n当然如果你有一个 `Employee` 对象，无法调用 `setBonus` 方法——它没有在 `Employee` 类定义的方法中。\n\n然而，你*可以*对\
  \ `Manager` 对象使用 `getName` 和 `getHireDay` 等方法。尽管这些方法没有在 `Manager` 类中显式定义，但它们自动继承自超类\
  \ `Employee`。\n\n同样，字段 `name`、`salary` 和 `hireDay` 也取自超类。每个 `Manager` 对象都有四个字段：`name`、`salary`、`hireDay`\
  \ 和 `bonus`。\n\n在通过扩展超类来定义子类时，你只需要指示子类和超类之间的*差异*。在设计类时，将最通用的方法放在超类中，将更专门的方法放在子类中。通过将其移动到超类来提取公共功能在面向对象编程中非常常见。\n\
  \n然而，某些超类方法并不适用于 `Manager` 子类。特别是 `getSalary` 方法应该返回基本工资和奖金的总和。你需要提供一个新的方法来*覆盖*（override）超类方法：\n\
  \n```java\nclass Manager extends Employee\n{\n   . . .\n   public double getSalary()\n\
  \   {\n      . . .\n      . . .\n   }\n}\n```\n\n\n\n最后，让我们提供一个构造函数。\n\n点击此处查看代码图片\n\
  \n```java\npublic Manager(String n, double s, int year, int month, int day)\n{\n\
  \   super(n, s, year, month, day);\n   bonus = 0;\n}\n```\n\n在这里，关键字 `super` 具有不同的含义。指令\
  \ `super(n, s, year, month, day);` 是“调用 `Employee` 父类的构造函数，并将 `n`、`s`、`year`、`month`\
  \ 和 `day` 作为参数”的简写。\n\n由于 `Manager` 构造函数无法访问 `Employee` 类的私有字段，它必须通过构造函数来初始化它们。构造函数通过特殊的\
  \ `super` 语法被调用。使用 `super` 的调用必须是子类构造中的第一条语句。\n\n如果子类构造函数没有显式调用父类构造函数，则调用父类的无参数构造函数。如果父类没有无参数构造函数，且子类构造函数没有显式调用另一个父类构造函数，Java\
  \ 编译器将报告错误。\n\n* * *\n\n![Image](img/image00948.jpeg) 注意\n\n回想 `this` 关键字有两个含义：指向隐式参数的引用，以及调用同一类的另一个构造函数。同样，`super`\
  \ 关键字也有两个含义：调用父类方法和调用父类构造函数。当用于调用构造函数时，`this` 和 `super` 关键字紧密相关。构造函数的调用只能作为另一个构造函数的第一条语句出现。构造函数参数要么传递给同一类的另一个构造函数（`this`），要么传递给父类的构造函数（`super`）。\n\
  \n* * *\n\n* *\n\n![Image](img/image00951.jpeg) C++ 注意\n\n在 C++ 构造函数中，你不调用 `super`，而是使用初始化列表语法来构造父类。`Manager`\
  \ 构造函数在 C++ 中看起来如下：\n\n点击此处查看代码图片\n\n```cpp\nManager::Manager(String n, double s,\
  \ int year, int month, int day) // C++\n: Employee(n, s, year, month, day)\n{\n\
  \   bonus = 0;\n}\n```\n\n* * *\n\n为 `Manager` 对象重定义了 `getSalary` 方法后，经理的工资将自动加上奖金。\n\
  \n这里是该功能实际运行的示例。我们创建一个新经理并设置经理的奖金：\n\n点击此处查看代码图片\n\n```java\nManager boss = new\
  \ Manager(\"Carl Cracker\", 80000, 1987, 12, 15);\nboss.setBonus(5000);\n```\n\n\
  我们创建一个包含三个员工的数组：\n\n```java\nEmployee[] staff = new Employee[3];\n```\n\n我们用经理和员工的混合体填充数组：\n\
  \n点击此处查看代码图片\n\n```java\nstaff[0] = boss;\nstaff[1] = new Employee(\"Harry Hacker\"\
  , 50000, 1989, 10, 1);\nstaff[2] = new Employee(\"Tony Tester\", 40000, 1990, 3,\
  \ 15);\n```\n\n我们打印每个人的工资：\n\n点击此处查看代码图片\n\n```java\nfor (Employee e : staff)\n\
  \   System.out.println(e.getName() + \" \" + e.getSalary());\n```\n\n此循环打印出以下数据：\n\
  Carl Cracker 85000.0\nHarry Hacker 50000.0\nTommy Tester 40000.0\n\n现在 `staff[1]`\
  \ 和 `staff[2]` 分别打印它们的基本工资，因为它们是 `Employee` 对象。然而，`staff[0]` 是一个 `Manager` 对象，其\
  \ `getSalary` 方法将奖金加上了基本工资。\n\n非常奇的是调用，e.getSalary()` 选择了正确的 `getSalary` 方法。请注意\
  \ `e` 的声明类型是 `Employee`，但 `e` 所引用对象的实际类型可以是 `Employee` 或 `Manager`。\n\n当 `e` 指向一个\
  \ `Employee` 对象时，调用 `e.getSalary()` 调用 `Employee` 类的 `getSalary` 方法。然而，当 `e` 指向一个\
  \ `Manager` 对象时，调用的是 `Manager` 类的 `getSalary` 方法。虚拟机知道 `e` 所引用对象的实际类型，因此可以调用正确的方法。\n\
  \n对象变量（例如变量 `e`）可以引用多个实际类型，这被称为多态。运行时自动选择合适的方法被称为动态绑定。我们将在本章中更详细讨论这两个主题。\n\n* *\
  \ *\n\n![Image](img/image00951.jpeg) C++ 注意\n\n在 Java 中，你不需要将方法声明为虚。动态绑定是默认的。如果你不希望某个方法是虚的，可以将其标记为\
  \ `final`。（我们稍后在本章中讨论 `final` 关键字）。某个方法是虚的，`Employee` 和 `Manager` 类的工资有所不同。该程序展示了继承。`Listing\
  \ 5.1` 包含了 `5.2` 之后讨论的 `Employee` 和 `Manager` 类。`Listing 5.3` 包含了...\n\n\n\n继承并不止于派生一层的类。例如，我们可以有一个扩展\
  \ `Manager` 的 `Executive` 类。所有扩展共同父类的类集合被称为`继承层次结构`（inheritance hierarchy），如图 5.1\n\
  \n图 5.1. 员工继承层次\n\n从一个远远的祖先类通常有多条下降链。你可以创建扩展 `Employee` 的子类 `Programmer` 或 `Secretary`，它们与\
  \ `Manager` 类（或它们彼此之间）没有任何关系。这个过程可以根据需要一直持续。\n\n***\n\n![Image](img/image00951.jpeg)\
  \ C++ 事项\n\nJava 不支持多重继承。（有关恢复多重继承的大部分功能的方法，请参阅第 6.1 节 第 286 页的“接口”。）\n\n### 5.1.2.\
  \ 多态\n\n一个简单的规则可以帮助判断继承是否是你数据的正确设计。“是一个”规则（is–a rule）规定，子类的每一个对象都是其类类的对象。例如，每一位经理都是员工。因此，让\
  \ `Manager` 类成为 `Employee` 类的子类是有意义的。自然，反则不成立——并不是每个员工都是经理。\n\n表述“是一个”规则的另一种方法是`替换原则`（substitution\
  \ principle）。该原则规定，当程序期望一个父类对象时，你可以使用子类对象。\n\n例如，你可以将子类对象赋值给父类变量。\n\n点击此处查看代码图像\n\
  \n```\nEmployee e;\n\ne = new Employee(. . .);  // 期望 Employee 对象\n\ne = new Manager(.\
  \ . .); // OK，Manager 也可以使用\n```\n\n在 Java 编程语言中，对象变量是`多态的`（polymorphic）。类型为 `Employee`\
  \ 的变量可以指向 `Employee` 类型的对象，也可以指向 `Employee` 类任何子类的对象（如 `Manager`、`Executive`、`Secretary`\
  \ 等）。\n\n我们在代码清单 5.1 中利用了这一原则：\n\n```\nManager boss = new Manager(. . .);\n\nEmployee[]\
  \ staff = new Employee[3];\n\nstaff[0] = boss;\n```\n\n在这种情况下，变量 `staff[0]` 和 `boss`\
  \ 指向同一个对象。然而，编译器认为 `staff[0]` 仅仅是一个 `Employee` 对象。\n\n这意味着你可以调用\n\n```\nboss.setBonus(5000);\
  \ // OK\n```\n\n但你不能调用\n\n```\nstaff[0].setBonus(5000); // 错误\n```\n\n`staff[0]`\
  \ 的声明类型是 `Employee`，而 `setBonus` 方法并不是 `Employee` 类的方法。\n\n然而，你不能将父类引用赋值给子类变量。例如，进行如下赋值是不合法的：\n\
  \n```\nManager m = staff[i]; // 错误\n```\n\n原因很清楚：并不是所有员工都是经理。如果这次赋值成功且 `m` 指向一个不是经理的\
  \ `Employee` 对象，那么将来就可能调用 `m.setBonus(...)`，并导致运行时错误。\n\n***\n\n![Image](img/image00950.jpeg)\
  \ 注意\n\n在 Java 中，子类引用数组可以在不需要强制转换的情况下转换为父类引用数组。例如，考虑这个经理数组：\n\n```\nManager[] managers\
  \ = new Manager[10];\n```\n\n将此数组转换为 `Employee[]` 数组是合法的：\n\n```\nEmployee[] staff\
  \ = managers; // OK\n```\n\n诚然，为什么不呢，你可能会想。毕竟，如果 `managers[i]` 是一个 `Manager`，它也是一个\
  \ `Employee`。但实际上，发生了一些令人惊讶的事情。记住 `managers` 和 `staff` 是同一个数组的引用。现在考虑语句\n\n```\n\
  staff[0] = new Employee(\"Harry Hacker\", ...);\n```\n\n编译器会乐于允许这次赋值。但 `staff[0]`\
  \ 和 `managers[0]` 是同一个引用，所以看起来我们成功地将一个普通的员工溜带进了管理层。那将糟糕——调用 `managers[0].setBonus(1000)`\
  \ 将尝试访问一个不存在的实例字段，并损坏相邻的内存。\n\n为了确保不会发生此类损坏，所有数组都会记住创建它们时的元素类型，并监控只将兼容的引用存储到其中。例如，创建为\
  \ `new Manager[10]` 的数组会记得它是一个经理数组。尝试存储 `Employee` 引用将导致 `ArrayStoreException`。\n\
  \n***\n\n### 5.1.3. 动态绑定\n\n理解当方法调用应用于对象时会发生什么是重要的。以下是详细信息：\n\n**1.** 编译器查看对象的声明类型和方法名。假设我们调用\
  \ `x.f(param)`，且隐式参数 `x` 被声明为类 `C` 的对象。假设实际类型是 `D`，它是 `C` 的一个子类。如果类 `D` 定义了方法 `f(String)`，则调用该方法。如果定义，则在\
  \ `D` 的父类中查找方法 `f(String)`，以此此类推。（`C` 的私有方法不可访问。）\n\n现在编译器知道了所有可能调用的候选方法。\n\n**2.**\
  \ 接下来，编译器确定提供的参数的类型。如果在所有方法 `f` 中，有一个唯一方法的参数类型匹配得最完美，则选择该方法。这个过程被称为`重载解析`（overloading\
  \ resolution）。\n\n例如，在调用 `x.f(\"Hello\")` 时，编译器选择了 `f(String)` 而不是 `f(int)`。由于类型转换（从\
  \ int 到 double，Manager 到 Employee 等），情况可能会变得复杂。如果编译器找不到任何方法，或者有多个方法都匹配，编译器将报告错误。\n\
  \n现在编译器知道了需要调用的方法名称和参数类型。\n\n***\n\n![Image](img/image00948.jpeg) 事项\n\n请记住，方法的名称和参数列表被称为`签名`（signature）。例如，`f(int)`\
  \ 和 `f(String)` 是两个名称相同但签名不同的方法。如果你在子类中定义了一个与父类方法具有相同签名的方法，你就重写（override）了该方法。\n\
  \n返回类型不是签名的一部分。然而，当你重写一个方法时，你需要保持返回类型兼容。子类可以将返回类型更改为原始类型的子类型。例如，假设 `Employee` 类有一个方法\n\
  \n```\npublic Employee getBuddy() { ... }\n```\n\n经理永远不会希望有一个低级员工作为伙伴。为了反映这一事实，`Manager`\
  \ 子类可以这样重写该方法：\n\n```\npublic Manager getBuddy() { ... } // 修改返回类型允许的\n```\n\n我们说这两个\
  \ `getBuddy` 方法具有`协变`（covariant）返回类型。\n\n***\n\n**3.** 如果方法是 `private`、`static`、`final`\
  \ 或构造函数，那么编译器确切知道要调用哪个方法。（`final` 修饰符将在下一节解释）。这被称为`静态绑定`（static binding）。否则，要调用的方法取决于隐式参数的实际类型，必须在运行时使用动态绑定。在我们的示例中，编译器将生成一条使用动态绑定调用\
  \ `f(String)` 的指令。\n\n**4.** 当程序运行并在动态绑定调用方法时，虚拟机必须调用适用于 `x` 所指向对象的*实际*类型的方法版本。假设实际类型是\
  \ `D`，它是 `C` 的一个子类。如果类 `D` 定义了方法 `f(String)`，则调用该方法。如果定义，则在 `D` 的父类中查找方法 `f(String)`，以此此类推。\n\
  \n\n\n\n每次调用方法时都执行这种搜索将非常耗时。因此，虚拟机为每个类预计算一个*方法表*（method table），其中列出了所有方法签名和要调用的实际方法。\n\
  \n当方法被实际调用时，虚拟机只需进行表查找。在我们的示例中，虚拟机查询类 `D` 的方法表，并查找为 `f(String)` 要调用的方法。该方法可能是 `D.f(String)`\
  \ 或 `X.f(String)`，其中 `X` 是 `D` 的某个父类。这种场景有一个例外：如果调用是 `super.f(param)`，则编译器会查询隐式参数父类的方法表。\n\
  \n让我们详细查看 Listing 5.1 中调用 `e.getSalary()` 的这一过程。`e` 的声明类型是 `Employee`。`Employee`\
  \ 类有一个方法，名为 `getSalary`，且没有方法参数。因此，在这种情况下，我们不需要担心重载解析问题。\n\n`getSalary` 方法不是 `private`、`static`\
  \ 或 `final` 的，因此它是动态绑定的。虚拟机为 `Employee` 和 `Manager` 类生成方法表。`Employee` 表显示所有方法都定义在\
  \ `Employee` 类本身中：\n\n点击此处查看代码\n\nEmployee:\n\n```\n    getName() -> Employee.getName()\n\
  \    getSalary() -> Employee.getSalary()\n    getHireDay() -> Employee.getHireDay()\n\
  \    raiseSalary(double) -> Employee.raiseSalary(double)\n```\n\n实际上，这并不是全部情况——正如你在本章稍后将看到的，`Employee`\
  \ 类有一个父类 `Object`，它从那里继承了许多方法。我们暂时忽略 `Object` 方法。\n\n`Manager` 方法表略有不同。它继承了三个方法，重定义了一个方法，并增加了一个方法。\n\
  \n点击此处查看代码\n\nManager:\n\n```\n    getName() -> Employee.getName()\n    getSalary()\
  \ -> Manager.getSalary()\n    getHireDay() -> Employee.getHireDay()\n    raiseSalary(double)\
  \ -> Employee.raiseSalary(double)\n    setBonus(double) -> Manager.setBonus(double)\n\
  ```\n\n在运行时，调用 `e.getSalary()` 的解析如下：\n\n1. 首先，虚拟机获取 `e` 的实际类型的方法表。这可能是 `Employee`、`Manager`\
  \ 或 `Employee` 的另一个子类的表。\n2. 接着，虚拟机查找 `getSalary()` 签名的定义类。现在它知道要调用哪个方法了。\n3. 最后，虚拟机调用该方法。\n\
  \n动态绑定有一个非常重要的属性：它让程序具有*可扩展性*，而无需修改现有代码。\n\n#### 5.1.4 防止继承：Final 类和方法\n\n有时，你想防止他人创建类的子类。不能被扩展的类被称为\
  \ `final`。如果你想防止这一点，可以使用 `final` 修饰符，例如：\n\n```java\nfinal class Employee { ...\
  \ }\n```\n\n同样，如果你想防止一个方法被重写，可以将其声明为 `final`：\n\n```java\npublic final int getSalary()\
  \ { ... }\n```\n\n将方法或类设为 `final` 的唯一正当理由是：确保其语义无法被更改。事实上，如果一个类是 `final` 的，没有人可以扩展它。\n\
  \n在 Java 早期，一些程序员使用 `final` 关键字是为了避免动态绑定的开销。如果一个方法没有被重写且很短，那么编译器就可以优化掉调用——这个过程被称为*内联*（inlining）。例如，内联调用\
  \ `e.getName()` 会将其替换为字段访问 `e.name`。然而，如果 `getName` 在另一个类中可以被重写，那么编译器无法对其内联，因为它不知道重写代码可能会做什么。\n\
  \n幸运的是，虚拟机中的即时编译器（JIT compiler）比传统编译器做得更好。它清楚哪些类扩展了给类，并可以检查是否有任何类重写了给方法。如果一个方法很短、频繁被调用且实际上没有被重写，JIT\
  \ 编译器就可以进行内联。如果虚拟机加载了另一个重写了内联方法的子类怎么办？优化器必须撤销内联。这很慢，但很少发生。\n\n#### 5.1.5 转换\n\n\
  回想第 3 章，强制从一种类型转换为另一种类型的过程被称为强制转换（casting）。Java 语言对强制转换有特殊的表示法。例如：\n\n```java\n\
  double x = 3.405;\nint nx = (int) x;\n```\n\n正如你有时需要将浮点数转换为整数一样，你可能也需要将对象引用从一个类转换为另一个类。要实际对对象引用进行转换，请使用与转换数值表达式相似的语法。将目标类名放在括号中，并将其放置在你想要转换的对象引用之前。例如：\n\
  \n```java\nManager boss = (Manager) staff[0];\n```\n\n\n\n你想要进行强制类型转换的原因只有一个——为了在对象的实际类型被临时遗忘后，能够充分利用它的所有功能。例如，在\
  \ `ManagerTest` 类中，`staff` 数组必须是 `Employee` 对象的数组，因为其中的某些元素是普通员工。我们需要将数组中的管理元素强制转换回\
  \ `Manager`，以便访问它的任何新变量。（注意，在第一节的示例代码中，我们特意避免了强制转换。我们在将其存入数组之前，先用一个 `Manager` 对象初始化了\
  \ `boss` 变量。我们需要正确的类型来设置经理的奖金。）\n\n如你所知，在 Java 中，每个对象变量都有一个类型。类型描述了变量所引用的对象的种类以及它能做什么。例如，`staff[i]`\
  \ 指向一个 `Employee` 对象（因此它也可以指向一个 `Manager` 对象）。\n\n编译器会检查你在向变量中存储值时是否承诺得过高。如果你将子类引用赋值给父类变量，你承诺的较少，编译器会直接允许你这样做。但如果你将父类引用赋值给子类变量，你承诺的更多。这时，你必须使用强制转换，以便你的承诺可以在运行时被检查。\n\
  \n如果你尝试向下继承链向下强制转换，并且对对象包含的内容“撒谎”，会发生什么？\n\n```\nManager boss = (Manager) staff[1];\
  \ // 错误\n```\n\n当程序运行时，Java 运行时系统会注意到违背的承诺并产生 `ClassCastException`。如果你不捕获该异常，程序将会终止。因此，在尝试强制转换之前确定其是否会成功是一种良好的编程习惯。只需使用\
  \ `instanceof` 运算符即可。例如：\n\n```\nif (staff[1] instanceof Manager)\n{\n    boss =\
  \ (Manager) staff[1];\n    . . .\n}\n```\n\n最后，如果转换没有机会，编译器将不允许你进行强制转换。例如，强制转换\n\
  \n```\nDate c = (Date) staff[1];\n```\n\n是一个编译错误，因为 `Date` 不是 `Employee` 的子类。\n\n\
  总结：\n\n- 你只能在继承层次结构内进行强制转换。\n- 在从父类向子类强制转换之前，使用 `instanceof` 进行检查。\n\n* * *\n\n\
  ![Image](img/image00948.jpeg) 注意\n\n如果 `x` 为 `null`，则测试 `x instanceof C` 不产生异常。它仅返回\
  \ `false`。这是符合逻辑的：`null` 不指向任何对象，因此它显然没有指向类型为 `C` 的对象。\n\n* * *\n\n实际上，通过强制转换来转换对象的类型通常不是一个好主意。在我们的示例中，对于大多数用途，你不需要将\
  \ `Employee` 对象转换为 `Manager` 对象。`getSalary` 方法在这两个类的对象上都能正常工作。使多态起的动态绑定会自动定位正确的方法。\n\
  \n进行强制转换的唯一理由是使用经理特有的方法，例如 `setBonus`。如果由于某种原因发现自己想在 `Employee` 对象上调用 `setBonus`，请问自己这是否表明父类存在设计缺陷。重新设计父类并添加\
  \ `setBonus` 方法可能是有意义的。记住，只需要一个未被捕获的 `ClassCastException` 就会终止你的程序。通常情况下，最好尽量减少强制转换和\
  \ `instanceof` 运算符的使用。\n\n* *\n\n![Image](img/image00951.jpeg) C++ 注意\n\nJava 使用了\
  \ C 在“旧时代”的转换语法，但它的工作方式类似于 C++ 中安全的 `dynamic_cast` 操作。例如，\n\n```\nManager boss =\
  \ (Manager) staff[1]; // Java\n```\n\n等同于\n\n```cpp\nManager* boss = dynamic_cast<Manager*>(staff[1]);\
  \ // C++\n```\n\n但有一个重要的区别。如果转换失败，它不会产生空对象，而是抛出一个异常。从这个意义上说，它类似于 C++ 中的引用转换。这非常麻烦。在\
  \ C++ 中，你可以在一次操作中完成类型测试和类型转换。\n\n点击此处查看代码\n\n```\nManager* boss = dynamic_cast<Manager*>(staff[1]);\
  \ // C++\n\nif (boss != NULL) . . .\n```\n\n在 Java 中，你需要结合使用 `instanceof` 运算符和强制转换。\n\
  \n```\nif (staff[1] instanceof Manager)\n{\n    Manager boss = (Manager) staff[1];\n\
  \    . . .\n}\n```\n\n* * *\n\n#### 5.1.6. 抽象类\n\n随着你向上移动继承层次结构，类变得越来越通用，可能越来越抽象。在某个时刻，祖先类变得如此通用，以至于你倾向于将其视为其他类的基础，而不是你想要使用的具有特定实例的类。例如，考虑我们\
  \ `Employee` 类层次结构的扩展。员工是人，学生也是。让我们扩展类层次结构以包含 `Person` 和 `Student` 类。图 5.2 显示了这些类之间的继承关系。\n\
  \n![Image](img/image01019.jpeg)\n\n图 5.2. Person 及其子类的继承图\n\n为什么要费力达到如此水平的？有些属性是合理的，例如姓名。员工和学生都有名字，引入一个父类让我们提取出在继承层次结构中的。现在添加另一个方法，其目的是返回简短的描述。但如果你使用\
  \ `abstract` 关键字，那么你必须将子类也标记为抽象。例如，我们将定义一个 `Student` 类，继承 `Person` 类并实现 `getDescription`\
  \ 方法。`Student` 类的所有的方法都不是抽象的，因此它不需要被声明为抽象类。\n\n类甚至可以被声明为 `abstract`，即使它没有抽象方法。\n\
  \n除了抽象方法，抽象类还可以有字段和具体方法。例如，`Person` 类存储姓名并有一个返回它的具体方法\n\n```\nabstract class Person\n\
  {\n    private String name;\n    public Person(String n)\n    {\n        name =\
  \ n;\n    }\n    public abstract String getDescription();\n    public String getName()\n\
  \    {\n        return name;\n    }\n}\n```\n\n* * *\n\n![Image](img/image0049.jpeg)\
  \ 提示\n\n有些程序员并没有意识到抽象类可以有具体方法。你应该始终将公共字段和方法（无论是否抽象）移动到父类。\n\n* * *\n\n抽象方法是子类中实现方法的占位符。当你扩展一个抽象类时，有两种选择。你可以留下部分或所有的抽象方法未定义；那么你必须将子类也标记为抽象。或者你可以定义所有的，这样子类就不再是抽象。\n\
  \n例如，我们将定义一个 `Student` 类，继承 `Person` 类并实现 `getDescription` 方法。`Student` 类的所有的方法都不是抽象的，因此它不需要被声明为抽象类。\n\
  \n抽象类不能被实例化。也就是说，如果一个类被声明为 `abstract`，则无法创建该类的对象。例如，表达式\n\n```java\nnew Person(\"\
  Vince Vu\")\n```\n\n是一个错误。但是，你可以创建具体子类的对象。\n\n注意，你仍然创建抽象类的*对象变量*，但这样的变量必须指向一个非抽象子类的对象。例如：\n\
  \n```java\nPerson p = new Student(\"Vince Vu\", \"Economics\");\n```\n\n这里 `p` 是抽象类型\
  \ `Person` 的变量，它指向非抽象子类 `Student` 的实例。\n\n\n\n\n![Image](img/image00951.jpeg) C++\
  \ 笔记\n\n在 C++ 中，抽象方法被称为`pure virtual function`（纯虚函数），并带有尾随的 `= 0`标记，例如：\n\n```cpp\n\
  class Person // C++\n{\npublic:\n   virtual string getDescription() = 0;\n   . .\
  \ .\n};\n```\n\n如果一个 C++ 类至少有一个纯虚函数，那么它就是抽象类。在 C++ 中，没有特殊的关键字来表示抽象类。\n\n* *\n\n\
  让我们定义一个继承自抽象类 `Person` 的具体子类 `Student`：\n\n```java\nclass Student extends Person\n\
  {\n   private String major;\n   public Student(String n, String m)\n   {\n     \
  \ super(n);\n      major = m;\n    }\n   public String getDescription()\n   {\n\
  \      return \"a student majoring in \" + major;\n    }\n}\n```\n\n`Student` 类定义了\
  \ `getDescription` 方法。因此，`Student` 类中的所有方法都是具体的，该类不再是抽象类。\n\nListing 5.4 所示程序定义了抽象父类\
  \ `Person`（Listing 5.5）以及两个具体子类 `Employee`（Listing 5.6）和 `Student`（Listing 5.7）。我们用员工和学生对象填充\
  \ `Person` 引用数组：\n\n```java\nPerson[] people = new Person[2];\npeople[0] = new Employee(.\
  \ . .);\npeople[1] = new Student(. . .);\n```\n\n然后，我们打印这些对象的名称和描述：\n\n```java\n\
  for (Person p : people)\n   System.out.println(p.getName() + \", \" + p.getDescription());\n\
  ```\n\n有些人对以下调用感到困惑：\n\n```java\np.getDescription()\n```\n\n这不是对一个未定义方法的调用吗？请记住，变量\
  \ `p` 永远不会引用 `Person` 对象，因为无法构造抽象类 `Person` 的对象。变量 `p` 始终引用如 `Employee` 或 `Student`\
  \ 等具体子类的对象。对于这些对象，定义了 `getDescription` 方法。\n\n你是否可以完全从 `Person` 父类中省略该抽象方法，仅在 `Employee`\
  \ 和 `Student` 子类中定义 `getDescription` 方法呢？如果你这样做，你将无法在变量 `p` 上调用 `getDescription`\
  \ 方法。编译器确保你只调用在类中声明的方法。\n\n代码列表 5.4. abstractClasses/PersonTest.java\n点击此处查看代码图片\n\
