  \ 有一种封装在 `Class` 类中的类的运行时表示。\n- `equals(Object otherObject)`: 比较两个对象的相等性；如果对象指向内存的同一区域，则返回\
  \ `true`，否则返回 `false`。你应该在自己的类中重写此方法。\n- `toString()`: 返回表示此对象值的字符串。你应该在自己的类中重写此方法。\n\
  - `getName()`: 返回该类的名称。\n- `getSuperclass()`: 以 `Class` 对象的形式返回类的超类。\n\n### 5.3\
  \ 泛型数组列表\n在许多编程语言中——特别是 C++——你必须固定所有数组的大小。程序员们讨厌这一点，因为这迫使他们做出不妥的权衡。一个部门会有多少员工？肯定不超过\
  \ 100 人吧？如果有一个拥有 150 名员工的巨型部门呢？难道我们要为每个部门浪费 90 个条目吗？在 Java 中，情况要好得多。你可以在运行时设置数组的大小。\n\
  \n```java\nint actualSize = ...;\nEmployee[] staff = new Employee[actualSize];\n\
  ```\n\n当然，这段代码并没有完全解决在运行时动态修改数组的问题。一旦你设置了数组大小，就无法轻易更改它。相反，在 Java 中你可以通过使用另一个名为 `ArrayList`\
  \ 的类来处理这种常见情况。`ArrayList` 类类似于数组，但当你添加和删除元素时，它会自动调整其容量，而不需要任何额外的代码。\n\n`ArrayList`\
  \ 是一个带有类型参数的泛型类。要指定数组列表所含元素的类型，你只需附加一个封装在尖括号中的类名，例如 `ArrayList<Employee>`。你将在第 13\
  \ 章中看到如何定义自己的泛型类，但在使用 `ArrayList` 类型时，你不需要了解任何这些技术细节。在这里，我们声明并构造了一个持有 `Employee`\
  \ 对象的数组列表：\n\n```java\nArrayList<Employee> staff = new ArrayList<Employee>();\n\
  ```\n\n类型参数 `Employee` 在两边都使用显得有点繁琐。从 Java 7 开始，你可以省略右侧的类型参数：\n\n```java\nArrayList<Employee>\
  \ staff = new ArrayList<>();\n```\n\n这被称为“菱形”语法，因为空括号 `<>` 看起来像菱形。将菱形语法与 `new` 操作符使用。编译器会检查新值发生的情况。如果它被赋值给变量、传递给方法或从方法返回，编译器就会检查泛型并将该类型放入\
  \ `<>` 中。在我们的示例中，`new ArrayList<>()` 被赋值给类型为 `ArrayList<Employee>` 的变量。因此，泛型类型是\
  \ `Employee`。\n\n> 在 Java SE 5.0 之前，没有泛型类。相反，有一个单一的 `ArrayList` 类，这是一个“通用”集合，持有\
  \ `Object` 类型的元素。你仍然可以在不带 `<>` 后缀的情况下使用 `ArrayList`；它被视为“原始”类型，类型参数被擦除。\n\n> 在旧版本的\
  \ Java 中，程序员使用 `Vector` 类来实现动态数组。然而，`ArrayList` 类更高效，不再有任何理由使用 `Vector` 类了。\n\n\
  使用 `add` 方法向数组列表添加新元素。例如，这里是向数组列表填充员工对象的方法：\n\n点击此处查看图片\n\n```java\nstaff.add(new\
  \ Employee(\"Harry Hacker\"));\nstaff.add(new Employee(\"Tony Tester\"));\n```\n\
  \n数组列表管理一个对象引用的数组。最终，该数组会耗尽空间。这就是数组列表的魔力所在：如果你调用 `add` 且数组已满，数组列表会自动创建一个更大的数组并将所有对象从小数组复制到大数组。\n\
  \n如果你已经知道或很好地估计要存储多少个元素，可以在填充数组列表之前调用 `ensureCapacity` 方法：\n\n```java\nstaff.ensureCapacity(100);\n\
  ```\n\n该调用分配了一个包含 100 个对象的数组。那么，前 100 次 `add` 调用将不会涉及昂贵的重新分配。你也可以向 `ArrayList` 构造函数传递初始容量：\n\
  \n```java\nArrayList<Employee> staff = new ArrayList<>(100);\n```\n\n注意：使用 `new\
  \ ArrayList<>(100)` 分配数组列表与使用 `new Employee[100]` 分配数组是不相同的。数组列表的容量和数组的大小之间存在重要的区别。如果你分配了一个\
  \ 100 个条目的数组，那么该数组就有 100 个空位备用。容量为 100 个元素的数组列表具有持有 100 个元素的*潜力*（实际上可以更多，但是以额外重新分配为代价），但在刚开始，即使在初始构造之后，数组列表也完全不持有元素。\n\
  \n`size` 方法返回数组列表中的实际元素数量。例如，\n\n```java\nstaff.size()\n```\n\n返回 `staff` 数组列表中当前的元素数量。这等于数组\
  \ `a` 的 `a.length`。\n\n\n\n\n一旦修剪了数组列表（array list）的大小，添加新元素将再次移动数据块，这会消耗时间。只有当你确定不会再向该数组列表添加更多元素时，才应该使用\
  \ `trimToSize`。\n\n![Image](img/image00951.jpeg) C++ 注意\n\n`ArrayList` 类类似于 C++\
  \ 的 `vector` 模板。`ArrayList` 和 `vector` 都是泛型类型。但 C++ 的 `vector` 模板重载了 `[]` 运算符以便方便访问元素。Java\
  \ 不支持运算符重载，因此必须使用显式方法调用。此外，C++ 的 `vector` 是按值复制的。如果 `a` 和 `b` 是两个 `vector`，那么赋值\
  \ `a = b` 会使 `a` 变成一个与 `b` 长度相同的新 `vector`，并将所有元素从 `b` 复制到 `a`。在 Java 中，相同的赋值将使\
  \ `a` 和 `b` 指向同一个数组列表。\n\n### java.util.ArrayList<T> 1.2\n\n- `ArrayList<T>()` :\
  \ 构建一个空的数组列表。\n- `ArrayList<T>(int initialCapacity)` : 构建一个指定容量的空数组列表。\n\n![Image](img/image0102.jpeg)\n\
  \n- `boolean add(T obj)` : 在数组列表末尾添加一个元素。始终返回 `true`。\n\n![Image](img/image01023.jpeg)\n\
  \n- `int size()` : 返回数组列表中当前存储的元素数量。（当然，这永远不会大于数组列表的容量。）\n- `void ensureCapacity(int\
  \ capacity)` : 确保数组列表有容量存储指定数量的元素，而无需重新分配其内部存储数组。\n\n![Image](img/image01024.jpeg)\n\
  \n- `void trimToSize()` : 将数组列表的存储容量缩小到其当前大小。\n\n#### 5.3.1 访问数组列表元素\n\n遗憾的是，没有免费的午餐。数组列表提供的自动增长便利性需要更复杂的语法来访问元素。这是由于\
  \ `ArrayList` 类并不是 Java 编程语言的一部分；它只是由他人编写并提供在标准库中的工具类。\n\n与其使用愉快的 `[]` 语法来访问或更改数组元素，不如你使用\
  \ `get` 和 `set` 方法。\n\n例如，要设置第 `i` 个元素，你使用\n\n```java\nstaff.set(i, harry);\n```\n\
  \n这等同于\n\n```java\na[i] = harry;\n```\n\n对于数组 `a`。（。（和数组一样，索引值从零开始。）\n\n![Image](img/image00950.jpeg)\
  \ 注意\n\n在数组列表的 `size` 大于 `i` 之前，不要调用 `list.set(i, x)`。例如，以下代码是错误的：\n\n```java\n\
  ArrayList<Employee> list = new ArrayList<>(100); // 容量 100，大小 0\nlist.set(0, x);\
  \ // 还没有元素 0\n```\n\n使用 `add` 方法而不是 `set` 来填充数组，并仅使用 `set` 来替换之前添加的元素。\n\n要获取数组列表元素，使用\n\
  \n```java\nEmployee e = staff.get(i);\n```\n\n这等同于\n\n```java\nEmployee e = a[i];\n\
  ```\n\n![Image](img/image00948.jpeg) 注意\n\n当没有泛型类时，原始（raw）`ArrayList` 类的 `get` 方法只能返回一个\
  \ `Object`。因此，`get` 的调用者必须将返回值强制转换为所需的类型：\n\n```java\nEmployee e = (Employee) staff.get(i);\n\
  ```\n\n原始 `ArrayList` 也有点危险。它的 `add` 和 `set` 方法接受任何类型的对象。调用\n\n```java\nstaff.set(i,\
  \ new Date());\n```\n\n在甚至没有任何警告的情况下就能通过编译，只有当你检索对象并尝试对其进行强制转换时，才会遇到麻烦。如果你使用 `ArrayList<Employee>`，编译器将检测到这个错误。\n\
  \n你有时可以通过以下技巧兼得两者的之长——灵活的增长和方便的元素访问。首先，创建一个数组列表并添加所有元素：\n\n```java\nArrayList<X>\
  \ list = new ArrayList<>();\nwhile (. . .) {\n    x = . . .;\n    list.add(x);\n\
  }\n```\n\n完成后后，使用 `toArray` 方法将元素复制到数组中：\n\n```java\nX[] a = new X[list.size()];\n\
  list.toArray(a);\n```\n\n有时，你需要在数组列表的中间添加元素。使用带有索引参数的 `add` 方法：\n\n```java\nint\
  \ n = staff.size() / 2;\nstaff.add(n, e);\n```\n\n位置 `n` 及以上的元素将向上移动，以为新条目留出空间。如果插入后数组列表的新大小超过了容量，数组列表将重新分配其存储数组。\n\
  \n同样，你可以从数组列表的中间删除一个元素：\n\n```java\nEmployee e = staff.remove(n);\n```\n\n位于其上方的元素将向下复制，数组的大小减一。插入和删除元素的效率并不高。对于小型数组列表，可能不需要担心。但如果你存储了许多元素并频繁在中间插入和删除，请考虑使用链表。\n\
  \n\n\n`staff` 对象被简单地传递给 `update` 方法。\n\n***\n\n![Image](img/image00950.jpeg) 注意\n\
  \n即使你没有收到编译器的错误或警告，此调用也不是完全安全的。`update` 方法可能会向数组列表中添加不是 `Employee` 类型的元素。当检索这些元素时，会抛出异常。这听起来很吓，但如果你仔细考虑，这种行为实际上与\
  \ Java 引入泛型之前的行为并无异。虚拟机的完整性永远不会受到威胁。在这种情况下，你并没有丢失安全性，但你无法从编译时检查中获益。\n\n***\n\n相反，当你将一个原始\
  \ `ArrayList` 赋值给带类型的 `ArrayList` 时，你会得到一个警告。\n\n```java\nArrayList<Employee> result\
  \ = employeeDB.find(query); // 产生警告\n```\n\n***\n\n![Image](img/image00948.jpeg)\
  \ 注意\n\n要查看警告文本，请使用选项 `-Xlint:unchecked` 进行编译。\n\n***\n\n使用类型转换并不能消除警告。\n\n点击此处查看代码图像\n\
  \n```java\nArrayList<Employee> result = (ArrayList<Employee>) employeeDB.find(query);\n\
  \   // 产生另一个警告\n```\n\n相反，你会得到一个不同的警告，它告诉你该转换是误导性的。\n\n这是 Java 泛型类型一个相当遗憾的局限性导致的后果。为了兼容性，编译器在检查未违反类型规则后，会将所有带类型的数组列表转换为原始的\
  \ `ArrayList` 对象。在运行的程序中，所有的数组列表都是相同的——虚拟机中没有类型参数。因此，`(ArrayList)` 和 `(ArrayList<Employee>)`\
  \ 执行的是完全相同的运行时检查。\n\n对于这种情况，你无能为力。当你与旧留代码交互时，请研究编译器的警告，并让自己确这些警告并不严重。\n\n一旦你满意了，可以使用\
  \ `@SuppressWarnings(\"unchecked\")` 注解来标记接收转换的变量，如下所示：\n\n点击此处查看代码图像\n\n```java\n\
  @SuppressWarnings(\"unchecked\") ArrayList<Employee> result =\n   (ArrayList<Employee>)\
  \ employeeDB.find(query); // 产生另一个警告\n```\n\n### 5.4 包装类与自动装箱\n\n有时，你需要将基本数据类型（如\
  \ `int`）转换为对象。所有基本类型都有对应的类。例如，`Integer` 类对应于基本类型 `int`。这些类通常被称为包装类。包装类的名称非常直接：`Integer`、`Long`、`Float`、`Double`、`Short`、`Byte`、`Character`、`Void`\
  \ 和 `Boolean。（前六个自公共父类 `Number`）。包装类是不可变的——在构造函数之后，你无法更改被包装的值。它们也是 `final` 的，所以你不能派它们的子类。\n\
  \n假设我们需要一个整数数组列表。遗憾的是，括号内的类型参数不能是基本类型。无法形成 `ArrayList<int>`。在这里，`Integer` 包装类派上了用场。声明一个\
  \ `Integer` 对象的数组列表是可以的。\n\n```java\nArrayList<Integer> list = new ArrayList<>();\n\
  ```\n\n***\n\n![Image](img/image00950.jpeg) 注意\n\n`ArrayList<Integer>` 的效率远低于 `int[]`\
  \ 数组，因为每个值都被单独包装在一个对象内部。只有当程序员的便利性比效率更重要时，你才希望对小型集合使用这种结构。\n\n***\n\nJava SE 5.0\
  \ 的另一个创新使得添加和获取数组元素变得简单。调用\n\n```java\nlist.add(3);\n```\n\n会被转换为\n\n```java\nlist.add(Integer.valueOf(3));\n\
  ```\n\n这种转换被称为自动装箱（autoboxing）。\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n你可能认为自动拆箱会更一致，但“装箱（boxing）”这个比喻是自\
  \ C# 的。\n\n***\n\n相反，当你将一个 `Integer` 对象赋值给 `int` 值时，它会被自动拆箱。也就是说，编译器会将\n\n```java\n\
  int n = list.get(i);\n```\n\n转换为\n\n```java\nint n = list.get(i).intValue();\n```\n\
  \n自动装箱和自动拆箱在算术表达式中同样有效。例如，你可以对包装引用应用递增运算符：\n\n```java\nInteger n = 3;\nn++;\n```\n\
  \n编译器会自动插入指令来拆箱对象、增加产生的值，并将其重新装箱。\n\n在大多数情况下，你会有那种基本类型及其包装类是同一实物的错觉。它们只在一个点上存在显著差异：标识性（identity）。如你所知，`==`\
  \ 运算符应用于包装对象时，仅测试这些对象是否具有相同的内存位置。因此，下面的比较可能会失败：\n\n```java\nInteger a = 1000;\n\
  Integer b = 1000;\nif (a == b) . . .\n```\n\n然而，Java 的实现如果选择，可以将经常出现的值包装成完全相同的对象，因此比较可能会成功。这种歧义性不是你想要的。补救办法是在比较包装对象时调用\
  \ `equals` 方法。\n\n***\n\n![Image](img/image00948.jpeg) 注意\n\n自动装箱规范要求 `boolean`、`byte`、`char`\
  \ ≤ 127、`short` 和 `int` 在 -128 到 127 之间被包装成固定对象。例如，如果 `a` 和 `b` 初始化为 100，那么比较将会成功。\n\
  \n***\n\n最后，让我们强调装箱和拆箱是编译器的便利，而不是虚拟机的功能。编译器在生成字节码时会插入必要的调用。\n\n你经常看到数字包装类的另一个原因。Java\
  \ 的设计者发现包装类是放置某些方法的方便位置，例如字符串转换为数字。\n\n要将字符串转换为整数，使用以下语句：\n\n```java\nint x = Integer.parseInt(s);\n\
  ```\n\nAPI 说明了 `Integer` 类的一些重要方法。其他类也实现了相应的方法。\n\n***\n\n![Image](img/image00950.jpeg)\
  \ 注意\n\n有些人认为包装类可以用于实现修改参数的方法。然而这不对。回想第 4 章，无法编写一个增加参数的 Java 方法，因为方法的参数总是按值传递的。\n\
  \n点击此处查看代码图像\n\n```java\npublic static void triple(int x) // 不可行\n{\n   x = 3 *\
  \ x; // 修改了局部变量\n}\n```\n\n我们可以通过使用 `Integer` 代替 `int` 来克服这个问题吗？\n\n点击此处查看代码图像\n\
  \n```java\npublic static void triple(Integer x) // 不可行\n{\n   . . .\n}\n```\n\n\
  问题是 `Integer` 对象是不可变的：包装器内部的信息无法更改。你不能使用这些包装类来创建修改参数的方法。\n\n如果你确实想写一个修改参数的方法，可以使用\
  \ `org.omg.CORBA` 包中定义的某种持有者类型：`IntHolder`、`BooleanHolder` 等。每个持有者类型都有一个公共字段 `value`，你可以通过它访问存储的值。\n\
  \n```java\npublic static void triple(IntHolder x)\n{\n   x.value = 3 * x.value;\n\
  }\n```\n\n\n\n返回包含字符串 `s` 中所有数字的整数。该字符串必须表示一个 10 进制整数（第一种方法）或由 `radix` 参数指定的基数（第二种方法）。\n\
  \n- `static Integer valueOf(String s)`\n- `static Integer valueOf(String s, int\
  \ radix)`\n\n返回一个新的 `Integer` 对象，其初始化为包含字符串 `s` 中所有数字的整数。该字符串必须表示一个 10 进制整数（第一种方法）或由\
  \ `radix` 参数指定的基数（第二种方法）。\n\n* * * *\n\njava.text.NumberFormat 1.1\n\n- `Number\
  \ parse(String s)`\n\n返回数值，假设指定的 `String` 表示一个数字。\n\n* * *\n\n### 5.5. 数量可变参数的方法\n\
  \n在 Java SE 5.0 之前，每个 Java 方法都有固定数量的参数。然而，现在可以提供可以使用变长参数进行调用的方法。（这些方法有时被称为“变长参数”（varargs）方法。）\n\
  \n你已经见过这样一个方法了：`printf`。例如，以下调用\n\n```\nSystem.out.printf(\"%d\", n);\n```\n\n和\n\
  \n```\nSystem.out.printf(\"%d %s\", n, \"widgets\");\n```\n\n都调用了同一个方法，尽管其中一个调用有两个参数，而另一个有三个。\n\
  \n`printf` 方法的定义如下：\n\n点击此处查看代码\n\n```java\npublic class PrintStream\n{\n   public\
  \ PrintStream printf(String fmt, Object... args) { return format(fmt, args); }\n\
  }\n```\n\n在这里，省略号 `...` 是 Java 代码的一部分。它表示该方法可以接收任意数量的对象（除了 `fmt` 参数外）。\n\n`printf`\
  \ 方法实际上接收两个参数：格式化字符串和一个持有所有其他参数的 `Object[]` 数组。（如果调用者提供整数或其他基本类型值，自动装箱（autoboxing）会将它们转换为对象。）它现在面临着一项艰巨的任务：扫描\
  \ `fmt` 字符串并将第 `i` 个格式说明符与值 `args[i]` 匹配。\n\n换句话说，对于 `printf` 的实现者来说，`Object...`\
  \ 参数类型与 `Object[]` 完全相同。\n\n编译器需要转换每个对 `printf` 的调用，将参数封装成数组并在必要时进行自动装箱：\n\n```\n\
  System.out.printf(\"%d %s\", new Object[] { new Integer(n), \"widgets\" } );\n```\n\
  \n你可以定义自己的带有变长参数的方法，并且可以为参数指定任何类型，即使是基本类型。这里有一个简单的示例：一个计算变数量数值最大值的函数。\n\n点击此处查看代码\n\
  \n```java\npublic static double max(double... values)\n{\n   double largest = Double.MIN_VALUE;\n\
  \   for (double v : values) if (v > largest) largest = v;\n   return largest;\n\
  }\n```\n\n只需这样调用该函数：\n\n```\ndouble m = max(3.1, 40.4, -5);\n```\n\n编译器将一个 `new\
  \ double[] { 3.1, 40.4, -5 }` 传递给 `max` 函数。\n\n* * *\n\n![Image](img/image00948.jpeg)\
  \ Note\n\n将数组作为变长参数方法的最后一个参数是合法的。例如：\n\n```\nSystem.out.printf(\"%d %s\", new Object[]\
  \ { new Integer(1), \"widgets\" } );\n```\n\n因此，你可以将最后一个参数为数组的现有函数重新定义为变长参数方法，而不会破坏任何现有代码。例如，`MessageFormat.format`\
  \ 在 Java SE 5.0 中以此方式得到了增强。如果你愿意，甚至可以将 `main` 方法声明为：\n\n```java\npublic static void\
  \ main(String... args)\n```\n\n* * *\n\n### 5.6. 枚举类\n\n你已经在第 3 章 中看到了如何定义枚举类型。这里有一个典型的示例：\n\
  \n```java\npublic enum Size { SMALL, MEDIUM, LARGE, EXTRA_LARGE };\n```\n\n由此声明定义的类型实际上是一个类。该类恰好四个实例——无法构造新对象。\n\
  \n因此，你永远不需要对枚举类型的值使用 `equals`。只需使用 `==` 来比较它们即可。\n\n如果你喜欢，可以为枚举类型添加构造函数、方法和字段。当然，构造函数只在枚举常量构造时被调用。这里有一个示例。\n\
  \n点击此处查看代码\n\n```java\npublic enum Size\n{\n   SMALL(\"S\"), MEDIUM(\"M\"), LARGE(\"\
  L\"), EXTRA_LARGE(\"XL\");\n   private String abbreviation;\n   private Size(String\
  \ abbreviation) { this.abbreviation = abbreviation; }\n   public String getAbbreviation()\
  \ { return abbreviation; }\n}\n```\n\n所有枚举类型都是 `Enum` 类的子类。它们继承了该类的许多方法。最有用的是 `toString`，它返回枚举常量的名称。例如，`Size.SMALL.toString()`\
  \ 返回 `\"SMALL\"`。\n\n`toString` 的反过来是 `valueOf` 方法。例如，`Size.valueOf(Size.class,\
  \ \"SMALL\")` 返回 `SMALL`。\n\n每个枚举类型都有 `values` 方法，返回所有元素的数组。例如，`Size.values()` 返回\
  \ `SMALL`、`MEDIUM`、`LARGE` 和 `EXTRA_LARGE`。\n\n* * *\n\n![Image](img/image00948.jpeg)\
  \ Note\n\n将数组作为变长参数方法的最后一个参数是合法的。例如：`Enum` 类有一个我们忽略的类型参数。例如，`Size` 实际上扩展了 `Enum<Size>`。\n\
  \n* * *\n\njava.lang.Enum 5.0\n- `static valueOf(Class enumClass, String name)`\
  \ 返回指定名称的枚举常量。\n- `toString()` 返回枚举常量的名称。\n- `ordinal()` 返回常量在 `enum` 声明中的位置，从零计数。\n\
