  \n### 图 3.8. if/else 语句的流程图\n\n例如：\n\n```java\nif (yourSales >= target)\n{\n   \
  \ performance = \"Satisfactory\";\n    bonus = 100 + 0.01 * (yourSales - target);\n\
  }\nelse\n{\n    performance = \"Unsatisfactory\";\n    bonus = 0;\n}\n```\n\n`else`\
  \ 部分总是可选的。一个 `else` 会与最近的 `if` 组合在一起。因此，在语句\n\n`if (x <= 0) if (x == 0) sign = 0;\
  \ else sign = -1;`\n\n中，`else` 属于第二个 `if`。当然，使用大括号来明确代码是一个好主意：\n\n```java\nif (x\
  \ <= 0) { if (x == 0) sign = 0; else sign = -1; }\n```\n\n重复的 `if . . . else if\
  \ . . .` 备选方案很常见（参见图 3.9）。例如：\n\n```java\nif (yourSales >= 2 * target)\n{\n    performance\
  \ = \"Excellent\";\n    bonus = 1000;\n}\nelse if (yourSales >= 1.5 * target)\n\
  {\n    performance = \"Fine\";\n    bonus = 500;\n}\nelse if (yourSales >= target)\n\
  {\n    performance = \"Satisfactory\";\n    bonus = 100;\n}\nelse\n{\n    System.out.println(\"\
  You're fired\");\n}\n```\n\n![Image](img/image00985.jpeg)\n\n### 图 3.9. if/else\
  \ if（多分支）的流程图\n\n#### 3.8.3 循环\n\n`while` 循环在条件为 `true` 时执行语句（该语句可能是一个块语句）。其通用形式为\n\
  \n`while (condition) statement`\n\n如果条件在开始时为 `false`，则 `while` 循环将永远不会执行（参见图 3.10）。\n\
  \n![Image](img/image00986.jpeg)\n\n### 图 3.10. while 语句的流程图\n\n代码列表 3.3 中的程序确定了为你辛苦赚来的退休金储蓄特定金额需要多长时间，假设你每年存款相同金额，且这些资金按指定的利率收益。\n\
  \n在示例中，我们在循环体中增加计数器并更新当前积累的金额，直到总额超过目标金额。\n\n点击此处查看代码图片\n\n```java\nwhile (balance\
  \ < goal)\n{\n    balance += payment;\n    double interest = balance * interestRate\
  \ / 100;\n    balance += interest;\n    years++;\n}\nSystem.out.println(years +\
  \ \" years.\");\n```\n\n（不要依赖此程序来规划你的退休生活。我们忽略了一些细节，如通货膨胀和你的预期寿命。）\n\n`while` 循环在顶部进行测试。因此，块中的代码可能永远不会执行。如果你想确保块至少执行一次，将需要将测试移动到底部，使用\
  \ `do/while` 循环。它的语法如下：\n\n`do statement while (condition);`\n\n该循环执行语句（通常是一个块），然后才测试条件。如果条件为\
  \ `true`，它将重复语句并重新测试条件，以此此类推。代码列表 3.4 中的代码计算你退休账户的新余额，然后询问你是否准备好退休：\n\n点击此处查看代码图片\n\
  \n```java\ndo\n{\n    balance += payment;\n    double interest = balance * interestRate\
  \ / 100;\n    balance += interest;\n    year++;\n    // 打印当前余额\n    . . .\n    //\
  \ 询问是否准备好退休并获取输入\n    . . .\n}\nwhile (input.equals(\"N\"));\n```\n\n只要用户回答 `\"\
  N\"`，循环就会重复（参见图 3.11）。该程序是一个至少需要进入一次的循环良好示例，因为用户在决定余额是否足够退休之前，需要看到余额。\n\n![Image](img/image00987.jpeg)\n\
  \n### 图 3.11. do/while 语句的流程图\n\n#### 列表 3.3. Retirement/Retirement.java\n\n点击此处查看代码图片\n\
