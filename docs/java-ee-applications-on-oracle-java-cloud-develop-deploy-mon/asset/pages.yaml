    Let's look at a simple example where you use Ajax to refresh the time upon a click\
    \ and avoid a page reload. To do this, create a new JSF named jaxtime.xhtml, as\
    \ shown in Listing 6-12.\n\n# Listing 6-12: Ajax Time\n\n```\n<?xml version='1.0'\
    \ encoding='UTF-8' ?>\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Transitional//EN\"\
