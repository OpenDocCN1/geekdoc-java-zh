  md: '# 10 Java EE Applications on Oracle Java Cloud


    NOTE

    Oracle Java Cloud Service is not certified for any particular version of Java
    EE, but supports a mix of Java EE 5 and Java EE 6 technologies that Oracle determined
    as appropriate for enterprise customers.


    Refer to Appendix B for a list of implementations compatible with Java EE 5, 6,
    and 7.


    # Profiles


    Until Java EE 5, you had no choice to go with a full-blown Java EE application
    server, which had support for all the technologies that have made it to Java EE
    over a decade or so. However, the Java community saw that although most Java EE
    applications were using only a subset of the technologies, they still had to lug
    the baggage of all Java EE technologies.


    So in Java 6, the idea of profiles was introduced. Profiles enabled the creation
    of smaller Java EE subsets based on requirement. Although it was expected that
    many profiles would emerge, considering the support and maintenance implications,
    Java EE 6 and Java EE 7 have only one profile, the Web Profile. So with Java EE
    6 and Java EE 7, you can choose the full Java EE server or the slimmer Java EE
    Web Profile Server.


    # Web Profile


    The Web Profile specification lists only 15 technologies as required components.
    This naturally leads to a slimmer application server that packs more than enough
    punch for most web applications. The Web Profile excludes several technologies
    from the full Java EE specification. However, with Enterprise Java Beans (EJBs),
    the Web Profile introduces a trimmeddown called EJB Lite. Download size is not
    a definite indicator of the difference between versions. However, it is worth
    noting that the full Java EE (English, Windows) version of GlassFish 3.1.2.2 is
    53MB, whereas the Web Profile (English, Windows) version is merely 33MB.


    Refer to Appendix A for for list of Web Profile technologies in Java EE 6 and
    7.'
