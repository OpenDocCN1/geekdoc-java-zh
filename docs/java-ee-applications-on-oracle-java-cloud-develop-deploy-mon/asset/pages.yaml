    # WebLogic-Specific Servlet Capabilities on OJC


    The Oracle Java Cloud supports several WebLogic-specific APIs, one of which is
    the web.servlet.annotation.* package. This package provides the WLFilter, WLInitParam,
    and the WLServlet annotation, which can enable you to use annotations to provide
    metadata within the Servlet class, eliminating the need to declare the servlets
    in the web.xml descriptor we looked at earlier.

    The support for WebLogic APIs is useful and something to be aware of if you are
    looking to move existing WebLogic applications to the cloud. However, I would
    not recommend using these WebLogic-specific APIs for new applications. These annotations
    are not part of the Java EE specification, so not only would they lock your application
    into WebLogic, but similar annotations offering the same features have been introduced
    in the newer versions of Java EE and the Servlet API.


    Supported public WebLogic Server 10.3.6 APIs are listed here:


    +   - weblogic.logging.*

    - weblogic.jsp.*

    - weblogic.cache.*

    - weblogic.application.*

    - weblogic.i18n.*

    - weblogic.i18ntools.*

    - weblogic.jndi.*

    - weblogic.jws.*

    - weblogic.servlet.*

    - weblogic.transaction.*'
