  md: '# Chapter 8: Web Services 187


    and is a standard format used to describe a web service. It states the name of
    the service, the operation, parameters, the data structures, and the output. The
    WSDL definition is useful to web service clients to know how to access a web service
    and what operations it performs. WSDL is often pronounced as wizdul.


    Click the link, and you will get a WSDL file. The WSDL is not included here because
    it would take multiple pages, and most of the XML tags are self-explanatory anyway.
