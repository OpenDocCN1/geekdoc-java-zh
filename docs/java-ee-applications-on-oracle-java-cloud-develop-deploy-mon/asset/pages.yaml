  md: '# About the Author


    Harshad Oak is the founder of IndicThreads and Rightrix Solutions.

    IndicThreads.com is an online developer magazine and hosts some of the most reputable
    technology conferences in India on topics such as Java, cloud computing, software
    quality, and mobile software. Before starting his own venture, Harshad was part
    of i-flex Solutions and Cognizant Technology Solutions.


    In addition to this work, he has authored Oracle JDeveloper10g: Empowering JEE
    Development and Pro Jakarta Commons, and co-authored JEE 1.4 Bible. Harshad has
    spoken at conferences in India, the United States, Sri Lanka, Thailand, and China.
    He has been working to build active Java communities in India and has organized
    as well as spoken at many user group meetings. Additionally, Harshad teaches Java
    to Master''s candidates in Computer Science at Symbiosis University, India. He
    has been recognized as an Oracle ACE Director and a Java Champion for his contributions
    to the technology and the community.


    Harshad writes about technology on IndicThreads.com and its social streams. He
    writes about social and other matters at HarshadOak.com and on twitter @HarshadOak.
    He can be reached at harshad@rightrix.com.


    # About the Technical Editors


    Markus Eisele is a software architect, developer, and consultant. He works daily
    with customers and projects dealing with Enterprise-level Java and infrastructures,
    including the Java platform and various web-related technologies on a variety
    of platforms using products from different vendors. An expert in Java EE, Markus
    is an Oracle ACE Director, a Java Champion, and a member of the Java EE 7 expert
    group, and a frequent speaker at industry conferences. Follow him on Twitter (@myfear)
    or read his blog (http://blog.eisele.net).


    Arun Gupta is Director of Developer Advocacy at Red Hat and focuses on JBoss middleware.
    He was a founding member of the Java EE team at Sun Microsystems. Arun led a cross-functional
    team to drive the global launch of the Java EE 7 platform. After authorizing approximately
    1,400 blogs at blogs.oracle.com/arungupta on different Java technologies, he continues
    to promote Red Hat technologies and products at blog.arungupta.com. Arun has extensive
    speaking experience in 35+ countries on myriad topics.'
