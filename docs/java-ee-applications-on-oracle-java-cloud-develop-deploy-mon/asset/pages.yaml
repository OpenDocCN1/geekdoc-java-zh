  md: '# 156 Java EE Applications on Oracle Cloud


    NOTE

    EJB 3.1 introduced a no-interface view option, by which all the public methods
    of the session bean are exposed to local clients. In the case of no-interface,
    you need not provide a local interface and state which methods you wish to expose.
    Although no-interface does simplify things, system architects often prefer having
    the interfaces in place. The no-interface option is part of EJB 3.1 and therefore
    is not currently available in OSC.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_179_0.png)


    The reasons for using an interface with session beans are no different from why
    you would use an interface with Java classes. A key consideration is that you
    can change the session bean without affecting the client code. The types of business
    interfaces are the local interface and the remote interface. A session bean can
    have both a local and a remote interface.


    Remote access is required when you want the bean to be accessed by remote clients
    that are not running in the same application server. However, remote calls involve
    significant overhead over the marshaling and unmarshalling of data over the wire,
    network latency, and the actual transportation over the network.


    Local access is a good choice when you have tightly coupled functionality for
    which it would make sense to have the beans running on the same application server.
    Remote access is used when you are looking to build a system that could have bits
    of functionality divided over multiple servers, machines, or even locations.


    For many years, EJB only had a remote access option, so each call to an EJB would
    have to be a remote call. It now seems rather strange that EJB 2.0, EJB did not
    have a local access option. These days, local access seems to be the more prevalent
    use.


    There isn''t much difference in the actual code of the local and remote interfaces.
    Local interfaces are marked with the annotation @Local, whereas remote interfaces
    are marked by the @Remote annotation.


    As mentioned earlier, OIC only supports local EJB invocations, so the client code
    invoking an EJB application''s interface must be either within the same deployment
    archive as the EJB implementation code itself or within a deployment archive that
    is deployed to the same Java Cloud Service instance. Let''s create an application
    with a session bean and delve further into its working.'
