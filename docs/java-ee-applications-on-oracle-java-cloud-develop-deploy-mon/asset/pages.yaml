  md: '# Java EE Applications on Oracle Java Cloud


    Now that we have a fair idea of what Java EE and the Oracle Cloud (OJC) have to
    offer, let''s dive in and start building our first Java EE application. We will
    first select an IDE, and then set up and deploy a basic application to the OJC.


    # Development IDE


    You can build a Java EE application with as little as a text editor, but it is
    much easier if you choose an IDE. The NetBeans, Eclipse, and JDeveloper IDEs make
    this even easier because of the natural integration OJC offers with these three
    Oracle-supported tools. The use of an IDE here will make it easier for you to
    quickly and easily replicate what''s being shown in the book. Before beginning
    our first application, select and set up the IDE of your choice. For the purposes
    of this book, we''ll build and deploy using the NetBeans IDE, but any IDE you''ve
    chosen to use fine.


    # Why NetBeans?


    NetBeans was chosen as the primary IDE for this book because of its solid reputation,
    ease of use, and OJC integration. NetBeans is free and Java EE ready "out of the
    box."


    NetBeans is available with dual licenses—Common Development and Distribution License
    (CDDL) and GNU General Public License (GPL) v2 with Classpath Exception. You can
    check the licensing FAQ at http://wiki.netbeans.org/NetBeansUserFAQ#License_and_Legal_Questions
    for details. However, here are the primary takeaways:


    +   - You can use it for commercial work.

    - There are no license costs.

    - You do not need to open source you your code.


    NetBeans is also great for the beginner.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Chapter 3: Build and Deploy with NetBeans 51


    > NOTE

    Although we are choosing a specific IDE, here, NetBeans in this book, we will
    always build applications adhering to the Java EE specification and not write
    any IDE-specific code.


    # Building with Java EE Technologies


    Let''s now start building an application with NetBeans and deploy it on OJC. To
    begin with, let''s focus on building an application and not worry about the micro-level
    details of each Java EE technology. We will spend future chapters going into more
    detail on Java EE technologies. For now, it''s important to have a view of the
    whole picture.


    > TIP

    The projects in this book have been written to provide hands-on-training. It is
    important that you try out firsthand and build your applications alongside the
    book chapters to gain the full value of these lessons.


    NetBeans can be installed on all operating systems that support Java. Therefore,
    we will install and run the same on Windows, Linux, and Mac OS systems. We have
    looked at installing the NetBeans IDE in Chapter 2.

    Note that installing the full version does not mean that all features will be
    activated right away and start up resources. NetBeans has a neat Feature On Demand
    capability that will enable a technology only when you actually use it.

    Therefore, you are likely to get the activation screen when you first start using
    different technologies in NetBeans.


    # First NetBeans Project


    Once you have NetBeans running, select File | New Project. On this screen, select
    Java Web | Web Application. Name the project Ch3WebApplication1. You do not need
    to change anything else on this screen. However, do note the text in the Project
    Location field, so as to be aware of where exactly the project files are being
    stored on your machine. Click Next.'
