  md: '# 128 Java EE Applications on Oracle Java Cloud


    In the previous chapter, we looked at JavaServer Pages (JSP), which continues
    to be a popular technology for building web applications, but suffers from some
    major drawbacks of being rather unstructured, prone to chaotic coding, and difficult
    to maintain. In this chapter we will look at JavaServer Faces (JSF), which is
    the preferred web technology for Java EE applications today. It offers a neat
    and feature-rich way of building-side web applications. The key capabilities of
    JSF are the UI component model, event handling, validation framework, structured
    page navigation, and internationalization.


    # From JSP to Struts to JSF


    With JSP, we think of a web page as a collection of scripts, tags, and HTML; however,
    with JSF we think of a web page as a set of components placed on a page. We tweak
    and customize the working of each component. The components, in most cases, are
    tied to backend Java code that further enhances their capability.


    JSF is a framework for building web applications, so it goes beyond just a page
    view and looks at how an entire application should be designed and managed. It
    provides a definite structure and development paradigm for building a web application.
    So whereas JSP is a view technology, JSF is much more than that.


    Until JSP 2.0, JSP was the view technology for JSF. JSF 2.0 and later use Facelets
    as the primary view technology; however, JSF continues to be supported and used.


    Having said that, the origins of JSF lie not in the limitations of JSP, but also
    in a popular web framework from the early 2000s named Struts. Although Struts
    is still around (http://struts.apache.org/), it is no longer popular.


    Struts proved an open-source framework for building web applications based on
    the Model-View-Controller (MVC) design paradigm. MVC is a design pattern where
    the Model represents the business logic, the page, and the Controller the application
    navigation. Struts was tailor-made for HTTP applications and provided rich capabilities
    for common web functionality such as response handling and form submissions. The
    decoupling of the Controller and the View brought in great value for web applications,
    which at the time were getting too large and complex to manage using just JSPs.'
