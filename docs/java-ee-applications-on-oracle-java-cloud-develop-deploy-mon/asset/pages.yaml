    # JSP Comments


    Comments are used throughout programming as a best practice to communicate your
    ideas or as an approach to addressing a particular issue within the code. In JSP,
    you have three choices for how you want to use comments—JSP Comment, Java Comment,
    and HTML Comment (see Listing 5-6).


    **Listing 5-6:** JSP Comments


    ```

    <-- JSP Comment -->

    <% //Java Comment %>

    <!-- HTML Comment ---->

    ```


    The difference between these three is that the JSP Comment appears only in the
    JSP and not even in the translated Servlet code. The Java Comment


