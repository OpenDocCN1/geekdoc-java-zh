  md: "# Chapter 9: Persistence Using the Oracle Database Cloud Service 219\n\nTo\
    \ use the persistence provider to create a table called DEVICE maps to the objects\
    \ of our Device entity class. By default, the persistence provider will name the\
    \ columns the same as the property names in the entity class. However, we can\
    \ use the @Column annotation to provide different column names.\n\n# Add Entity\
    \ from a Servlet\n\nLet's look at how we can programmatically add a new device\
    \ to the table from a Servlet. For first, that add a new Servlet named DeviceServlet\
    \ in the package servlets for Ch9JPA1 project. To work with entities, we use the\
    \ EntityManager API. Using the EntityManager, we can create and remove entity\
    \ instances as well as find and query them, as required.\nTo the EntityManager,\
    \ right-click in the Servlet code and select Insert Code | Use EntityManager.\
    \ A “persist” method will also be added to the class. Although the EntityManager\
    \ is what we use to work with our entities, the UserTransaction is required because\
    \ there is no built-in transaction support in Servlets. Therefore, we have to\
    \ programmatically start and stop the transaction as shown in the persist method.\
    \ Transaction support is here because without the transaction “begin” and “commit”,\
    \ the persist method of EntityManager will throw java.persistence.TransactionRequiredException.\n\
    \nAdding a new device to the table using our Device entity is as simple as creating\
    \ a new instance of Device and calling the persist method in the Servlet, as shown\
    \ in Listing 9-3. We also need to add import entities.Device; statement for the\
    \ Servlet class to compile.\n\n+   Listing 9-3: DeviceServlet\n\n```\n@PersistenceContext\
    \ (unitName = \"Ch9JPA1PU\")\nprivate EntityManager em;\n@Resource\nprivate javax.transaction.UserTransaction\
    \ utx;\n\nprotected void processRequest(HttpServletRequest request, HttpServletResponse\
    \ response)\n    throws ServletException, IOException {\n    response.setContentType(\"\
    text/html;charset=UTF-8\");\n    PrintWriter out = response.getWriter();\n   \
    \ try {\n        persist(new Device(\"Android\", 100));));\n```"
