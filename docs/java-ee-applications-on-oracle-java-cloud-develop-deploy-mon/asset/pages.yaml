  md: '# Chapter 5: JavaServer Pages, JSTL, and Expression Language 111


    appears in the JSP and the Servlet code, whereas HTML Comment is the only that
    will make it to the response (usually HTML) and can be viewed if the user selects
    View Source in the web browser.


    None of the styles of comments will affect the output of the JSP page, understanding
    where the comments appear is vital for you to be able to use the right kind of
    comment at the right place. The comment is meant only for JSP developers, you
    should use the <%-- JSP Comment --%> style of commenting. The <!-- HTML Comment
    --%> style should be used only if you want to comment in the HTML response. Although
    it''s true that the <!-- HTML Comment --%> comments are visible only if someone
    checks the source in the browser, you would still be moving a lot of unnecessary
    code


    The <% Java Comment %> type is the one that Java developers are comfortable with
    and without ending up. However, it has no real benefit over the JSP Comment, including
    the comment in the translated Servlet usually does not serve much purpose. In
    most cases, JSP Comment will be the one.


    In this section, we looked at the working of the JSP, the basic syntax, and use
    of directives, scriptlets, expressions, and comments. Let''s now look at how you
    use tags to make your JSPs fast to build and easy to maintain.


    #  Tags and Expressions


    We have so far seen how you can use scripting in a JSP to add dynamic content
    to HTML. However, the problem with JSP scripting wasn''t JSPs as such, but in
    the way it was being used by web developers. Developers created large and complex
    JSPs using procedural code and a ton of functionality packed into them. So within
    time, the page became difficult to manage and interpret for anyone but the original
    developer. Also, the idea of JSP was to separate HTML and Java, but that wasn''t
    being achieved because most JSPs ended up having Java all over the place.


    To tackle this, custom tags (and later the JSP Standard Tag Library, or JSTL)
    and expressions were introduced. Custom tags provide a way to build your own outright.
    JSTL, as the name suggests, is a standard set of tags with commonly required functionality.
    The expression language provides a way to achieve complex functionality without
    the need to write Java code.


    JSTL combined with expression language can ensure that your JSP pages are feature-rich
    and yet clean and easy to understand and maintain.'
