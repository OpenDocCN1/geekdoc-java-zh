    \ a SQL-like query language that lets you write portable queries without worrying\
    \ about the underlying data store. You can perform SELECT, UPDATE, or DELETE queries,\
    \ similar to SQL. You can declare JPQL queries using annotations in the Entity\
    \ class, or you can use the createQuery method"
