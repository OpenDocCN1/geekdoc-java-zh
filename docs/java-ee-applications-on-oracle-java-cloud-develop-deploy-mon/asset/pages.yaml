  md: '# Chapter 3: Build and Deploy with NetBeans 61


    is especially important when building an application. If you are building a Java
    EE application, for the application server to do its magic, you need to follow
    the standards, part of which is placing your files in a certain place and packaging
    your application in a certain way.


    # Directories


    Figure 3-5 showed the directory structure for our application, whereas Figure
    3-6 shows the key files and directories in a Java EE application. Note that this
    is not an exhaustive list. Only the most important files and directories are highlighted
    here.


    As shown in Figure 3-6, the WEB-INF directory is at the root of the application,
    with your HTML, XHTML, JSP, and other files. However, whereas these files are
    publicly available, WEB-INF is a private directory, and the server will ensure
    that the contents of that directory cannot be accessed directly. So you are also
    allowed to access an HTML file placed at the root with a URL, such as example/page.html,
    you cannot use example.com/WEB-INF/apage.html if you were to place that same HTML
    file within the WEB-INF directory.


    Within the WEB-INF directory is the web.xml file, which is the web deployment
    descriptor that holds all the configuration information for the web application.


    > NOTE

    OJC runs a mix of Java EE 5 and 6 technologies. Whereas web.xml is optional in
    EE 6, this file is mandatory with EE 5 and,, therefore, is always required while
    deploying applications to OJC.


