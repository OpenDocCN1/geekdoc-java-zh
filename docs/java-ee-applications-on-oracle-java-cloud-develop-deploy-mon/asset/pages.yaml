    # JSP Internals


    A JSP is text document—in most cases, an HTML file—that has some JSP-specific
    tags and at times some Java code in it. The recommended file extension is .jsp.
    A JSP file can be either in XML format, such that it can be parsed and used by
    any XML parser, or in a standard syntax, which is less verbose but is not well-formed
    XML.

    JSP in XML form never quite caught on developers; writing a JSP with standard
    syntax was just simple. Unless there’s a need to parse the JSP using APIs for
    XML, most developers tend to use the standard syntax. We will be using the standard
    syntax for the code in this chapter; however, we will look at the corresponding
    XML tags as well.


    # JSP Lifecycle


    The key to understanding a JSP is in understanding Servlets, because when one
    runs a JSP, what actually runs is a Servlet. When the server receives the first
    request for the JSP, it translates the JSP into a Servlet class, followed by compiling
    that class. After that, on every request, the server runs the Servlet'
