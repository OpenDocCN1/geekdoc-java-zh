  md: '# Developing a SOAP Web Service


    The first wave of web services was built around the SOAP standard, which uses
    XML extensively for defining the web service as well as for the actual communication.
    Except for the actual logic code, which we will write in Java, the rest of the
    web service is XML. Therefore, the web service operations are defined in an XML-based
    Web Services Definition Language (WSDL) file. The communication between the web
    service and the web service client will be in XML, as per the SOAP standard.


    Let''s build two web applications—one SOAP web service application and one web
    service client application—and then analyze the code to better understand how
    they work. We begin by creating a new web application by selecting File | Java
    Web | Web Application. Name the application SoapWebService, and ensure that the
    server is selected Oracle Cloud Remote. Now, right-click the project and select
    New | Services | Web Service. Click Next. Your should now get a screen like the
    one shown in Figure 8-1. Name the web service DateTime and the package ws. Click
    Finish.


