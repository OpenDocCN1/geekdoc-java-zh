  md: '# Java EE Applications on Oracle Java Cloud


    Web services are the chosen mode for communication over disparate technologies.
    The W3C group on Web Services Architecture defines a web service as a software
    system designed to support interoperable machine-to-machine interaction over a
    network. Because a web service is software that meant to have all-encompassing
    reach, it relies on the HTTP protocol, a standard supported across technologies
    and locations. Web services also rely on XML, which again is a technology that
    is supported across technologies. Although the underlying idea of communication
    across platforms is the same, two types of web services are in:


    +   - Web services that rely on XML messages as per the Simple Object Access Protocol
    (SOAP) standard


    +   - Web services that use Representational State Transfer (RESTful) and leverage
    the HTTP GET, POST, PUT, and others for communication


    We will look at developing and deploying both types of web services on OJC.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_203_0.png)


    > NOTE OJC supports a mix of Java EE 5 and Java EE 6 technologies. Even with web
    services, OJC supports Java API for XML-based Web Services (JAX-WS)–based SOAP-XML
    web services from Java EE 5, as well as Java API for RESTful Web Services (JAX-RS)
    from Java EE 6. OJC supports JAX-WS version 2.1 and JAX-RS version 1.1. OJC does
    not support Java API for XML-based RPC (JAX-RPC)–based web services. JAX-WS was
    the successor to JAX-RPC, so OJC recommends converting JAX-RPC web services to
    JAX-WS. OJC supports JAX-WS and JAX-RS annotations as well as Jersey 1.9 annotations,
    Jersey being the reference implementation of JAX-RS. Let''s begin by building
    web services with SOAP and JAX-WS.


    In Chapter 7, we discussed that because OJC restricts remote access to your bean,
    you can use web services as an alternative. Because web services rely on basic
    HTTP, you can expose functionality in your EJB beyond the boundaries of OJC. You
    could have remote clients calling your bean with SOAP-based or RESTful web services.'
  merge: -1
  pgno: 203
