  md: '# Java EE Applications on Oracle Java Cloud


    This chapter provides the specifics of Oracle''s Cloud offering. We will review
    Oracle SaaS, IaaS, and PaaS, then dive into the specifics of pricing and features
    and restrictions of Oracle Java Cloud (OJC). We will also look at how you create
    users and roles as to manage your Oracle Cloud. This chapter will also show how
