    # JSF Managed Beans


    JSF managed beans are Plain Old Java Objects (POJOs) that are managed

    by JSF. All that it takes to make a Java class managed bean is to add the

    annotation @ManagedBean to the code or the appropriate XML configuration.

    The managed bean is usually used to process HTML form values and

    is the place where you add Java code you want to bind to UI components.'
