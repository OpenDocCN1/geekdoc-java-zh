  md: '# Introduction


    Java EE and the cloud are arguably the two most important technologies today when
    it comes to building software for enterprises. In this book, you will understand
    what makes both these technologies tick and how you can leverage them to build
    and deploy applications on one of the key players in the Java Cloud space: the
    Oracle Java Cloud Service. You will not only learn build with Java EE, but also
    to look at the nuances and the characteristics of the Oracle Java Cloud.


    With this book you will get a holistic understanding of Java EE and cloud computing
    and their role in modern software development.


    +   - Understand how you can go about building and deploying applications using
    Java EE technologies such as Servlets, JSP, EJB, and JPA, with an awareness of
    the cloud platform, its merits, and its limitations.


    +   - Use the Oracle Java Cloud along with the Oracle Database Cloud to fulfill
    the persistence requirement of your application.


    +   - See how you need to adapt your software development process for the constraints
    of the cloud as well as the mixed environment offered by the Oracle Java Cloud.


    +   - Learn how to utilize the NetBeans IDE to streamline your cloud development.


    **Chapter 1: Java EE and Cloud Computing** In this chapter, you will get a sound
    understanding of Java EE and cloud computing, their origins, and their current
    standing. You will see the benefits and drawbacks of choosing Java EE'
  merge: -1
  pgno: 20
- img_proc: true
