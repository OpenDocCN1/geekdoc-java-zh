  md: '# Java EE Compatible


    The implementation of the Java EE specification is considered compatible only
    if it clears the compatibility tests for Java EE that are part of the Java Compatibility
    Test Suite (CTS).


    All JSRs need to provide the following:


    +   - The specification

    - The reference implementation of the specification

    - The Technology Portability Kit (TCK)


    The fact that all certified Java EE servers will run your Java EE application
    is one of the key features of Java EE. It brings portability to the platform and
    drastically reduces vendor lock-in, both vital features for large enterprises.
    Portability here means the option of migrating to a different application server
    or a different vendor if required.


    However, for a customer to be assured of this portability, all the application
    servers that claim to be Java EE compatible need to have passed a definite set
    of compatibility tests. Therefore, Oracle supplies a comprehensive Java EE Compatibility
    Test Suite (CTS) to Java EE licensees. Only if a server passes the tests in the
    CTS is it certified as Java EE compatible. This certification for a certain version
    is a guarantee to the end customer that a server supports Java EE as mandated
    by the specification by which it has been certified.


    # NOTE


    All Java EE-compatible application servers (that is, application servers that
    fulfill the Java EE licensing and compatibility testing procedure) are listed
    on the "Java EE Compatibility" page on the Oracle Technology Network (OTN) website
    at http://j.mp/JavaEE-Compatibility.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_32_0.png)


    I would like to reiterate that although the various Java EE server vendors are
    free to innovate on the actual implementation, as long as it does not interfere
    with the specified behavior.'
