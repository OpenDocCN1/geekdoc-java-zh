    # Session Management


    One of the most common capabilities in a web application tracking the user across
    multiple pages and providing a login functionality so as to provide user-specific
    pages and content. Unfortunately, the HTTP protocol has no capability to recall
    state, so it is up to the web application to save and manage state and be able
    to figure out that it is the same user accessing multiple pages. Considering that
    this is a commonly required feature for a web application, most development platforms
    provide session management capability out of the box. HttpSession in Java EE provides
    the session management capability required.


    # HttpSession


    The server creates an implementation of the HttpSession interface, which helps
    us track a user across multiple pages and also store information about the user.
    As seen in Listing 4-1 and Listing 4-2, you get the HttpSession object by calling
    the getSession method of the HttpServletRequest, which will return the session
    for that request. If there is no session, it will create a new session.


    In the previous example, we looked at how you can use the session to add and retrieve
    attributes. But how is it that the server knows it is the same session and the
    same user coming back? The answer lies in something called the session ID, which
    is a unique identifier that gets passed and forth between the client and the server.


    The default mode to achieve this is by using cookies. So when you accessed the
    SetAttributes Servlet, a cookie with a unique identifier was set on your browser.
    Next, when you accessed GetAttributes Servlet, the server figured that you were
    the same user because the request had the unique identifier in the browser cookie
    had when you accessed SetAttributes. It figured that this was part of the session,
    the session attribute value was made available to the GetAttributes Servlet. Open
    up your browser''s privacy setting, and you will find a cookie with the URL for
    OJC and a cookie name of JSESSIONID. Note that for the browser, this JSESSIONID
    cookie is no different from other cookies. The JSESSIONID is simply a text value
    that''s the unique identifier (session ID).


    The only requisite for session management by the application server is that the
    unique identifier (session ID) keeps being sent back. Very rarely are'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Java EE Applications on Oracle Java Cloud


    cookies disabled on browsers, but if they are, you now have to find a way to send
    the unique identifier in each request. Your choices are as follows:


    +   - Encode the URL using the response.encodeURL method. The encodeURL method
    adds the session ID in the URL when it finds cookies have been disabled. Therefore,
    if not via a cookie, the ID continues to be sent back to the server as a request
    parameter.


    +   - Pass the session ID as a hidden form field. This way, when a user submits
    a form, the session ID is also sent to the server as a hidden form field.


    As long the session ID is going back and forth, you will be able to leverage the
    capabilities of HttpSession. Note that attributes are taking up memory on your
    server—especially with the HttpServletContext attributes, which stay in memory
    for a long time—you need to use attributes with caution.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_103_0.png)


    > TIP.

    Modern web development frameworks default to using cookies, but have a fallback
    option of using encodeURL or hidden form fields in case cookies are disabled.
    Cookies being disabled is not as much a concern if you are using a framework as
    compared to custom-building your application.


