    # Templates


    Most web applications tend to follow a consistent look and feel across the site.
    For example, there''s usually a constant header and footer and at times even a
    sidebar present on all pages. The Facelets in JSF provide templating capability
    that enables you to use a page as the template for other pages in the application.


    To add a new template to our project, right-click the project and select New |
    Other | JavaScript Faces | Facelets Template. Select the layout with a header
    and a left sidebar, as shown in Figure 6-10. NetBeans will not create the newTemplate.xml
    file, but will also create a resources directory with a couple of .css files.


    The code generated by NetBeans includes the CSS using standard HTML tags. However,
    because "resources" under the root of your application is a special directory
    for JSF, where it expects all your web resources files as CSS, images, and JavaScript
    to be stored, we can use the tag &lt;h:outputStylesheet&gt; to refer to the CSS
    and the tag &lt;h:outputScript&gt; to refer to any JavaScript. We can even create
    subdirectories within the resources directory for various themes for our application,
    and create subdirectories for versions of a theme. Our modified code for the template
    is shown in Listing 6-14.'
