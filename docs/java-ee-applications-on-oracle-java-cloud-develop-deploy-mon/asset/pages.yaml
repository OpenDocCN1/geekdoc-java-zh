  md: '# Chapter 4: Servlets, Filters, and Listeners 67


    # Servlet Interface


    A Servlet is an implementation of the javax.servlet.Servlet interface. The Servlet
    interface defines lifecycle methods to initialize a Servlet, process requests,
    and destroy a Servlet. However, the usual way to use the Servlet interface is
    not directly implementing the interface, but by subclassing an abstract implementation
    of the Servlet interface.


    It could be javax.servlet.GenericServlet or javax.servlet.HttpServlet, which extends
    GenericServlet. Both GenericServlet and HttpServlet are abstract classes that
    simplify writing Servlets because they provide a basic framework for your Servlet,
    as well provide implementations of the Servlet lifecycle methods. Because these
    are abstract classes, the Servlet developer needs to extend and override at least
    one method.


    Therefore, instead of having to write your class as


    ```

    public class YourServlet implements Servlet

    ```


    and then be forced to implement all the methods in the interface, you have the
    simpler option of either


    ```

    public class YourServlet extends HttpServlet

    ```


    or


    ```

    public class YourServlet extends GenericServlet

    ```


    # HttpServlet


    Whereas GenericServlet is protocol independent, HttpServlet is meant specifically
    for use over the HTTP and HTTPS protocols and is the one that commonly used.


    If you are building a web application, you would be talking over HTTP and have
    to use HttpServlet, which provides methods for the various HTTP request methods.
    So, there''s a doGet method to handle GET requests, a doPost method to handle
    POST requests, and so on. The other methods in HttpServlet meant specifically
    to handle the various HTTP methods are不断, doGet, doHead, doOptions, doPut, and
    doTrace.'
