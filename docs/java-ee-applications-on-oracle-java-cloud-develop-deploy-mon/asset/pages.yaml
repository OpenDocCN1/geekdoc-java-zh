    Let''s now a closer look at HttpServletRequest and HttpServletResponse, the two
    objects bringing in most of the power and functionality in a Servlet, followed
    by a look at the role of the configuration .xml files.


    # HttpServletRequest


    Your Servlet can know everything there is to know about the request via an object
    of HttpServletRequest. Note that HttpServletRequest is an interface. The Servlet
    container contains an implementation of HttpServletRequest with loads of information
    about the request and passes it to the Servlet. Through the HttpServletRequest
    methods, we can retrieve information such as the request path, host, port, request
    protocol, request parameters, cookies, request URI, and more. Some of these methods
    are inherited from its super interface HttpServletRequest.


    # HttpServletResponse


    You can work with the response you are sending from your Servlet using an object
    of HttpServletResponse. Again, HttpServletResponse is an interface, and it is
    the Servlet container that creates an implementation of HttpServletResponse. In
    the code, you have already seen how you can use the HttpServletResponse to set
    the content type and generate a PrintWriter to generate the output. You can also
    use HttpServletResponse to redirect, a cookie, add headers, encode the URL, and
    more. Methods such as set and setCharacterEncoding, which are not specific to
    HTTP, are inherited from its super interface HttpServletResponse. HttpServletResponse
    adds HTTP-specific functionality methods such as addCookie, encodeURL, and others.


