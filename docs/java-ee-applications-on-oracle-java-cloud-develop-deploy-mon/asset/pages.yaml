  md: '# Technologies and Services Supported


    The Java Cloud Service supports the deployment of the following types of applications:


    +   - Web Application Archive (WAR) and Enterprise Archive (EAR) deployments.

    - Web applications: Applications using Servlet 2.5, JavaServer Pages (JSP) 2.1,
    and JavaServer Faces (JSF) release 1.2 and release 2.0.

    - Web Services: Applications using Java API for XML Web Services (JAX-WS) 2.1-based
    web services. Applications providing REST-based APIs through Java API for RESTful
    Web Services (JAX-RS) 1.1 and Jersey 1.9 annotations supported.

    - Enterprise Java Beans (EJB) containers: Applications using EJB 2.1 and EJB 3.0
    specifications. Only local EJB invocations are supported. EJB 2.x Entity Beans
    are not supported.

    - JDBC services: Applications using Java Persistence API (JPA) 2.0 specifications
    and JPA persistence.xml elements with EclipseLink 2.1.3–specific extensions.

    - Direct use of Java Database Connectivity (JDBC) 4.0 APIs.

    - Use of Oracle Database 11g–compatible SQL statements.

    - Java Platform Standard Edition (SE) 1.6 APIs: Applications can use the set of
    SE 1.6 public APIs as they pass the Java Cloud Service whitelist tool and their
    use is in line with Java EE best practices.

    - ADF 11.1.1.6 applications.


