  md: '# Cloud Computing


    There has been immense buzz around cloud computing over the past few years. As
    seen in Figure 1-2, a Google Trends search for “cloud computing” reveals that
    cloud computing first gained popularity in 2009 and was at its peak in 2010/2011.
    By 2012/2013, we see the trend maturing past products, action, and adoption.


    It’s fair to say that most software developers have at least taken a cursory look
    at cloud computing. However, the number of actual cloud users is still small,
    so let’s quickly review the fundamental ideas underlying cloud computing.


    # Going Around in Circles


    Someone building software in the 1980s and then checking back today might be amused
    to see the fuss about cloud computing. To him, the cloud was always the most obvious
    way to go; he would have heard of as time-sharing, client/server architecture,
    or thin clients. Even ideas as hosted services, utility computing, and grid computing
    from a few years back were closely aligned with what we now know as cloud computing.
    In each case, you have minimal data and processing on the device at the user’s
    end and


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_34_0.png)


    FIGURE 1-2. Cloud computing on Google Trends'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Java EE Applications on Oracle Java Cloud


    most of the heavy lifting being done on remote hardware that is far more powerful
    and capable. The computing power and data were supplied to the user''s device
    on demand.


    So what''s different with cloud computing? The primary difference is the Universal
    Internet. Whereas in the past, networks were limited to a campus or an area, each
    of us can access information from any corner of the globe. Hosting my data or
    my application server on remote corner of the planet and relying on Internet connectivity
    for access was previously impossible; not so with cloud computing.


    Cloud computing is also possible today because data centers are highly scalable
    and because of virtualization. Virtualization, as the name suggests, is primarily
    about creating virtual machines (VMs) that don''t run on the actual hardware but
    instead run on top of the operating system that''s actually talking to the hardware.
    A single hardware box that has a Linux operating system can have many VMs running
    on it—some Windows, some running other flavors of Linux, and more. Each of these
    VMs could be used by one or many different users.


    # What Is Cloud Computing?


    Cloud computing, in layman terms, stands for renting computing power and data
    storage capability as per your requirements at a certain point in time. You could
    be renting hardware, foundation software platforms running on that hardware, or
    full-fledged software applications.


    As core business needs and developer roles evolve, business owners want to avoid
    expensive hardware, software developers want to avoid worrying about setting up
    and maintaining a platform, and users want to avoid building software all together;
    they just want to use it. By business owners, developers, and users would all
    much rent what they need and then customize it, instead of setting up and managing
    the infrastructure.


    These benefits have led to different types of cloud computing, where, in each
    type, you rent a different set of software or hardware. The most prominent types
    of cloud computing are IaaS, PaaS, and SaaS.


    # IaaS


    Infrastructure as a Service (IaaS), also at times referred to as “Hardware as
    a Service,” got the ball rolling for cloud computing. Around 2009, when we first
    started hearing the term “cloud computing,” most of the talk was'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Chapter 1: Java EE and Cloud Computing 13


    about IaaS and, to a large extent, fueled by Amazon successfully renting out capacity
    via its Elastic Compute Cloud (EC2) service. EC2 lets you rent virtual computers
    on which you can install, deploy, and run software.

    With IaaS, the vendor provides just the hardware, and the user is responsible
    for setting up the software platforms as required. Although this provides great
    flexibility to the user, it also necessitates that IaaS user has the expertise
    on board to set up and manage the rented hardware.


    # PaaS


    Although just renting hardware might suffice at times, developers often don''t
    just want the hardware, but also the basic software platform, installed and running.
    This brings great value to software teams because they now need to focus on building
    their software application and don''t have to worry about the hardware or even
    the basic software platform setup. Enter Platform as a Service (PaaS).


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_36_0.png)


    > NOTE

    Usually, software developers and network administrators are distinct teams. Having
    to worry about the hardware setup and management means that developers are well
    placed to run the show on their own.


    If a software team was looking to build a Java, .NET, or PHP application, wouldn''t
    it be much easier if they got the hardware along with the operating system, as
    well as the Java/PHP/.NET software platform preinstalled and set up? How about
    having an application server running, optimized, and highly scalable?

    Whereas the first wave of cloud computing was around IaaS, the next was around
    PaaS. PaaS, however, is much trickier space than IaaS, primarily because the PaaS
    vendor provides for the hundreds of ways in which software gets built. Many PaaS
    vendors, in an attempt to streamline and secure the software being built on their
    service, have defined strict dos and don''t as well as the capabilities that they
    can and not support. Having such a policy in place can be both a feature and a
    limitation. It is a feature because you can be sure that other users with whom
    you are sharing the platform are not free to do whatever they want and jeopardize
    your setup. However, it''s also a major limitation you have to build your application
    as per the rules set by the PaaS provider.'
  merge: -1
