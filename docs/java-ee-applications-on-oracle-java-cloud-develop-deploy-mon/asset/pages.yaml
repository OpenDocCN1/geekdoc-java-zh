  md: '# 194 Java EE Applications on Oracle Java Cloud


    from another platform using another technology. Similarly, our web service client
    can utilize a web service developed in another technology by referring to the
    WSDL and communicating using SOAP XML messages.


    # RESTful Web Services

    Using JAX-RS API


    RESTful web services are often referred to as “lightweight” web services because,
    unlike SOAP, which requires a lot of XML going back and forth, REST is a much
    simpler and more straightforward way of developing web services. As compared to
    SOAP web services, there''s hardly any overhead with REST. Also, consuming RESTful
    web services is as simple as accessing a URL. The primary limitation of REST involves
    support for the web security standards that have evolved over the past decade.


    The OJC support for RESTful web services uses the JAX-RS API. Jersey is the reference
    implementation of JAX-RS and is the implementation used on the OJC.


    The key to REST way of building applications is to access data and functionality
    of resources with standard HTTP methods using unique identifiers, which in case,
    are URLs. Therefore, if you want to get the data for employee number 22, you could
    do something as simple as firing an HTTP request to the URL in the form <WebApplicationPath>/resources/employee/22/.
    In response, you could get information about employee number 22 in a format as
    HTML, XML, Text, JSON, or PDF, among others. Using RESTful web services is the
    preferred method lately because calling a URL seems much simpler and more intuitive
    than exchanging XML-based SOAP messages.


    The usual CRUD (Create-Read-Update-Delete) is covered by the HTTP methods PUT,
    GET, POST, and DELETE. Annotations convey which method will handle HTTP method
    and also the path for that method.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_217_0.png)


    > NOTE

    A simple example of a RESTful web service is the Google REST API. Enter http://ajax.googleapis.com/ajax/services/search?web=1.0&Oracle%20Java%20Cloud
    in your browser, and you get the response in the JSON format. In the URL, change
    web to news, video, or images to use the different Google search services.'
  merge: -1
