  md: '# 204 Java EE Applications on Oracle Java Cloud


    We have so far looked at various Java EE technologies, such as JSP, JSF, and EJB;
    however, the key missing element is the ability to persist data. Most applications
    need the capability to store and retrieve data from a persistent store, so Java
    and Java EE provide a set of standards and tools for persistence. In this chapter,
    we look at Java Persistence and the capabilities of the Oracle Cloud.


    # Persistence on the Oracle Cloud


    When most people think of Oracle, they think of the Oracle Database. So naturally,
    a major focus area of the Oracle Cloud is around the Oracle Database Cloud. Oracle
    Java Cloud uses the Oracle Database Cloud to provide the persistence capabilities
    required for Java EE applications. Oracle Java Cloud currently does not support
    any database other than the Oracle Database Cloud, which is based on Oracle Database
    11g Release 2, Enterprise Edition.


    That you can use the Oracle Database is certainly something to consider while
    adopting OCI; however, many enterprises already use Oracle Database extensively
    and are comfortable with committing to the Oracle Database even on the cloud.


    # Oracle Database Cloud Service


    Oracle Database Cloud Service is not an Oracle Database installation on a remote
    server that you can tweak endlessly. It is very much a PaaS offering, where you
    get a database instance to use with restrictions and abstractions. The benefit
    is that you do not have to bother about installing, configuring, patching, or
    managing the database.


    The Oracle Database Cloud Service runs on Oracle Exadata hardware and benefits
    from the Exadata features and optimizations. It uses schema isolation for multitenancy,
    and all data is encrypted while being stored on disk.


    You cannot just connect to a Database Cloud Service with SQL*Net or add it as
    a connection in any remote tool or IDE. Even to upload data for Oracle Database
    Cloud, you need to send the data loads to a Secure FTP server, where they are
    scanned for viruses before the data in the files is laed into the Database Cloud
    Service.'
  merge: -1
