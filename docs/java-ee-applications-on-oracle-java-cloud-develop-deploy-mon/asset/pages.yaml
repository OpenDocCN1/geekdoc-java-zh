    The term “Software as a Service (SaaS)” has actually been around longer than the
    term “cloud computing”. I recall discussing SaaS in 2006, when cloud computing
    was unheard of. The meaning still stays pretty much the same, just that it is
    now thought of as a type of cloud computing.

    If your business is using an online third-party service for accounting, email,
    invoicing, online campaigns, and email marketing, it is utilizing SaaS. SaaS is
    where you do not bother renting the hardware or even the software platform on
    which to build your application. You directly rent the actual software application
    you need. You pay on your expected usage, or in some cases, you pay as you go.
    SaaS is especially popular with startups because it significantly reduces their
    startup and running cost, while still giving the fledgling business all the flexibility
    it requires.


    As shown in Figure 1-3, a SaaS offering builds over the capabilities of a PaaS,
    which in turn runs over the IaaS. For this book, we will mostly be working with
    PaaS.


    # Why Cloud Computing?


    The top reasons for the interest and adoption of cloud computing are


    +   **Technology** Setting up and maintaining your own hardware and software can
    be an extremely expensive and tedious affair. Most would rather have someone else
    do it.'
