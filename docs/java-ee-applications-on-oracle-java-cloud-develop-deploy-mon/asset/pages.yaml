  md: '# Chapter 1: Java EE and Cloud Computing


    implementation for Java EE is the GlassFish Server Open Source Edition, which
    is available for download at www.glassfish.org.


    Because the Java EE reference implementation is developed alongside the specification,
    it not only shows that the specification can be implemented, but also makes the
    implementation available as soon as the final specification is released. So although
    GlassFish 3 was the production version for Java EE 6, GlassFish 4 was developed
    while the Java EE 7 specification was being finalized. The day Java EE 7 released,
    GlassFish 4, the reference implementation, was readily available for developers
    to try out Java EE.


    Once the final specification is released, most vendors release their own implementations
    of the latest version of Java EE. Because these implementations have historically
    taken up to a year or two, developers looking to try out the latest technologies
    opt for GlassFish. GlassFish has grown rapidly over the past few years and is
    today a popular application server that is used in many production applications.


    We will now take a closer look at how the Java Community Process (JCP) works,
    how a specification is finalized, and what it takes for a server to get certified
    for a Java EE specification. This process is one of the key factors that makes
    Java EE stand out from competing technologies (both open source and commercial).


    # API and Technology Specification


    Java EE isn''t one big block of code or a single technology, but a collection
    of technologies brought together under the banner of Java EE. Java EE is commonly
    thought of as an end-to-end technology platform that contains numerous features
    and the software providing those features. In reality, Java EE is simply a set
    of specifications about things that need to be done and how they need to be done.
    Although Java EE is all about building software, the Java EE specification, as
    such, does not include any code. The specification only provides rules, instructions,
    and guidelines on which the code is to be written.


    You can think of Java EE specifications as a set of PDF files available for download
    on the Java Community Process (JCP) website (http://jcp.org).


    Having said that, the specification is released along with a reference implementation
    (RI) and the Technology Compatibility Kit (TCK). The RI is a code implementation
    that proves the specification can actually be implemented. The TCK consists of
    tests to check the implementation.'
