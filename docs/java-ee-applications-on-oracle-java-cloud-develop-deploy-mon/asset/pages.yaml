    # JSTL Libraries


    JSR 52 for JSTL states the following: “The original expert group that designed
    the JavaServer 1.0 and JavaServer Pages 1.1 specifications wanted to include a
    list of standard tags as part of those specifications. Unfortunately, time pressures
    and the dangers of standardizing on not fully understood functionality forced
    the removal of any a few very basic tags from these specifications.


    So by the time JSTL was introduced, JSPs packed with Java code had become the
    norm. Tag libraries were being developed—some open source, some proprietary—but
    there was no standardization happening. So if you were to use a tag, you were
    forced to also ship the tag library JAR file along with your application.


    It was by this time quite obvious as to the kind of things that developers were
    looking to achieve in their JSP pages. Therefore, the expert group for JSR 52
    came up with commonly used functionality that warranted having a standard tag.'
