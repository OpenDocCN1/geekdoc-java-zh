    # Maven and Ant


    Maven (http://maven.apache.org/) and Ant (http://ant.apache.org/) are widely used
    for their project management and build capabilities. Whereas Ant is the old and
    trusted workhorse build tool, Maven is the relatively newer tool that boasts impressive
    project management capabilities in addition to its build capabilities.


    OJC offers rich integration with both tools via the Cloud SDK. The Maven plugin-javacl.jar
    and the Ant plugin ant-javacl.jar can be found in the lib directory of the SDK.
    With the Maven plugin, commands for the Java Cloud are exposed as Maven goals.
    Also, there is an Ant task available in the Ant plugin for most of the command-line
    commands.


    If the command is "install", the Maven goal is com.oracle.cloud:javacl:install,
    whereas the Ant task is <javacl:install/>.


    The Maven and Ant plugins make it possible for you to integrate your project with
    the Oracle Java Cloud merely by making a few changes to the Maven or Ant configuration.


    # Users and Roles


    Every Oracle Cloud Service belongs to an Identity Domain that controls the user
    authentication and authorization for that service. You can share the same identity
    store among multiple Oracle Cloud Services by placing them in the same Identity
    Domain.


    Click the Users link on the top right of the page, as seen in Figure 2-3 and you
    will get a screen as shown in Figure 2-15, listing the names, user names, and
    email for the users in the system. You can use the search box well as the Show
    and Sort By drop downs to fetch particular users or type of users.'
