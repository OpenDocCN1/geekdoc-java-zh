  md: '# Appendix A: Java EE Technologies and JSRs 239


    CDI, which was introduced in Java EE 6, has become an even more integral part
    of Java EE 7. Considering the widespread use of JSON for data exchange, Java EE
    7 introduced the Java API for JSON Processing, which can be used to parse and
    generate JSON. Java EE 7 also introduced APIs for Batch Applications and Concurrency
    Utilities. It includes updated versions of the JMS and the JAX-RS APIs.


