    format: https://<CloudServiceName--<identityDomain>.java.<DataCenter>.oraclecloudapps.com/Ch8SoapWebService/WebService=1.


    Note that the WSDL will begin with the line "Published by JAX-WS RI at jax-ws.java.net.
    RI’s version is Oracle JAX-WS 2.1.5," which tells us that these files are generated
    by JAX-WS 2.1 running on WebLogic server or OJC.


