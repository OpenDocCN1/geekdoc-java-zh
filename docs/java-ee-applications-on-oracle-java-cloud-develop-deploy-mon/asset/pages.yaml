  md: '# Chapter 6: JavaServer Faces 129


    Java EE has always excelled at adopting good ideas. The Structs, Craig McClanahan,
    was also the co-specification lead for JSF 1.0. Therefore, JSF''s backend code
    and the navigation-handling capability are pretty similar to those of Structs.
    The Facets Ui component of JSF has adopted ideas from frameworks such as Apache
    Tapestry and Tiles. Earlier, Tiles was part of Structs, but is now a separate
    project known as Apache Tiles.


    # JSF on the Oracle Java Cloud


    As mentioned in previous chapters, OJC supports a mix of Java EE 5 and Java 6
    technologies, so in the case of JSF, OJC supports JSF release 1.2 as well as release
    2.0, which was introduced in Java EE 6. The support for JSF 2.0 is important because
    the preferred view technology for JSF today, was only introduced in JSF 2.0. “View
    technology” here essentially means the code that generates the web page view.
    Having said, JSF continues to be supported with the latest JSF versions, but Facets
    is the recommended view technology. If you are building a new application, it''s
    best to avoid JSF and use Facets instead.


    Another important change with JSF 2.0 was the support for annotations. Until JSF
    1.x, all the configuration was in a configuration file named facets-config.xml;
    however, with version 2.0 you can use annotations. We could not use annotations
    in Chapter 4 on Servlets the Servlet version supported on OJC does not support
    annotations. However, because OJC supports JSF 2.0, which supports annotations,
    we can use annotations in this chapter.


    # TIP


    An annotation is metadata that has no direct effect on the operation of the code
    but is used for configuration or to provide additional information to the compiler
    or other development/deployment tools.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_152_0.png)


    # Facets


    Facets are part of the JSF specification. It provides a page declaration language
    and templating capability, and is suited for building component-based pages. Facets
    bring in performance improvement along with the option for developers to easily
    plug in new components as required.'
  merge: -1
