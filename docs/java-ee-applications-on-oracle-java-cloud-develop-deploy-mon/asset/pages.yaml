    # Rollback and Exception Handling


    The previous example shows a scenario where everything works well, but if something
    goes wrong and you get an exception. Here, we can categorize exceptions into system
    exceptions and application exceptions. Application exceptions are specific to
    your application (for example, insufficient funds in account or inadequate user
    rights). These exceptions denote a business problem in the application and not
    a system issue. In these cases, the transaction is not rolled back by default.
    Therefore, in cases where we need an application exception to trigger a rollback,
    we need to use an annotation, as shown in Listing 7-12. Here, we state rollback
    = true to convey that the transaction was rolled back when the exception is thrown.


    > Listing 7-12: ApplicationException Rollback


    ```

    @ApplicationException (rollback = true)

    public class InsufficientFunds extends Exception {

    }

    ```


    System exceptions include java.lang.RuntimeException, java.rmi.RemoteException,
    and their subclasses. The transaction will get rolled back in the case of any
    system exception. For example, NullPointerException is'
  merge: -1
  pgno: 199
- img_proc: true
  md: "of the most common exceptions encountered. Because NullPointerException is\
    \ a RuntimeException, the transaction will get rolled back. You can tell the container\
    \ to not roll back the transaction, even in the case of a run-time exception,\
    \ by using the ApplicationException annotation and setting the rollback value\
    \ to false, as shown in Listing 7-13.\n\n# Listing 7-13: Do Not Roll Back RuntimeException\n\
    \n```\n@ApplicationException(rollback = false)\npublic class CreateException extends\
    \ RuntimeException {\n    //...\n}\n```\n\n# Summary\n\nIn this chapter, we looked\
    \ at building enterprise applications that include multiple EJBs and web applications,\
    \ all packed together into one application. We saw the rich functionality offered\
    \ by stateless and stateful session beans and how container-managed transactions\
    \ are a great asset to have while building any application that relies on transactions.\
    \ EJBs are critical for enterprise application development, and with the greatly\
    \ simplified EJB development over the past few years, EJBs are certainly something\
    \ to look at while building your enterprise applications for the cloud. The rich\
    \ EJB support is also a major plus for OIC because not all cloud vendors offer\
    \ the same level of support for EJB."
