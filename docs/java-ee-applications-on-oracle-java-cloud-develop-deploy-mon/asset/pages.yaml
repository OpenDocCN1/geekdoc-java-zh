- img_proc: true
  md: '# Chapter 6: JavaServer Faces 135


    The managed bean at times even includes the actual business logic of the application;
    however, moving the business logic code to a dedicated business logic class or
    an EJB is considered to be a better practice.


    > TIP


    The term managed bean was once used exclusively for JSF managed beans. However,
    with newer specifications such as Contexts and Dependency Injection (CDI), the
    term lately tends to be used for any Java class that is being managed by the server,
    and is no longer a JSF-specific usage. You can read more about CDI managed beans
    at http://docs.oracle.com/javaee/6/tutorial/doc/gfzi.html. CDI is not supported
    on OJC, so any managed bean usage in this chapter refers to JSF managed beans.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_158_0.png)


    So let''s add a managed bean to our application with a single String property,
    yourname. We will then bind this property in the bean to a text box in the UI
    .xtml file.


    To add a managed bean, right-click the project in the Projects window and then
    select New | Other | JavaServer Faces | JSF Managed Bean. You will get the screen
    shown in Figure 6-4. The class is WelcomeBean, and the package managedbeans.


    You should now have WelcomeBean.java up in your editor window. You can manually
    add the code for the you property or use the NetBeans wizard. To add using NetBeans,
    right-click within the class body in the code editor and select Insert Code |
    Add Property. Name the property username and set the type as String. You can have
    NetBeans generate Javadoc comments by checking the Generate Javadoc box. Uncheck
    the box to keep the code brief. You should now have the code shown in Listing
    6-3.


    +   Listing 6-3: WelcomeBean


    ```

    package managedbeans;

    import javax.faces.bean.ManagedBean;

    import javax.faces.bean.RequestScoped;

    ```


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_158_1.png)'
