    # IDE Integration


    Most Java developers today use some integrated development environment (IDE) for
    development. Some of the popular Java IDEs are NetBeans, Eclipse, Developer, and
    IntelliJ IDEA. Although you can choose from a number of available Java development
    tools, we will use Oracle''s officially supported tools for demonstration in this
    book: NetBeans, Oracle JDeveloper, and OEPE. Oracle currently offers Oracle Java
    Cloud integration for NetBeans, JDeveloper, and Eclipse:


    +   * **NetBeans IDE** NetBeans has been around for over a decade and was the
    flagship Java development tool of Sun Microsystems (later acquired by Oracle).
    NetBeans continues to thrive under Oracle and is usually the first to support
    new technologies in Java SE and Java EE. NetBeans'' vast feature set and ready
    to use out of the box state, in my opinion, make it a great choice for beginners
    as well as advanced developers.


    +   * **Oracle JDeveloper** JDeveloper was Oracle''s Java IDE prior to the Sun
    acquisition. In recent years, JDeveloper has moved into a niche as the chosen
    Java IDE for Oracle developers. It is no longer as popular in pure Java circles,
    but is the primary Java tool for Oracle application developers. JDeveloper may
    rarely be a leading topic at a Java-centered conference, but is always present
    at an Oracle conference.


    +   * **Oracle Enterprise Pack for Eclipse (OEPE)** Eclipse has remarkable traction
    in all kinds of programming, not just Java. Today, numerous companies are shipping
    products and development tools built on Eclipse. Naturally, there are thousands
    of developers who are'
