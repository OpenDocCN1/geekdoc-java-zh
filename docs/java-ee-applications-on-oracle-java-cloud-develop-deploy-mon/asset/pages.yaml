  md: '# 62 Java EE Applications on Oracle Java Cloud


    The classes directory is where your Java classes should be placed. Create a directory
    structure within the classes directory based on your Java package names. The class
    file for com.example.User.java will be at /WEB-INF/classes/com/example/User.class.


    The lib directory is where any libraries (your own or third party) should be placed.
    The libraries are JAR files that the application server will load to make available
    to the application. Now that we have looked at the directory structure for a web
    application, let''s move on how to deploy your Java EE application is packaged.


    # Packaging the Application


    If you have a local Java EE application server running on your machine, you usually
    have the option of just copying your application to a certain directory, and the
    server will deploy the application. However, cloud providers such as OIC, you
    are expected to package your application in the standard Java EE format and upload
    the packaged file to the server.


    # We Are at WAR


    Throughout the earlier logs, you may have noticed references to the Ch3WebApplication1.war
    file. The Java EE web application you created has been packaged into that file
    by NetBeans. In all probability, you would have encountered Java Archives (JAR)
    files earlier with Java development, but if the JAR file contains a web application,
    you should name the file as awar file. Here, WAR stands for “web archive,” and
    it is essentially a JAR file with the file extension set to .war, so to convey
    that it is a web application. All Java EE-compatible application servers (either
    local or on the cloud) will have an option to deploy a WAR file. There’s another
    kind of JAR file, known as Enterprise Archive (EAR) file, that we will encounter
    later in the book.


    > TIP: JAR, WAR, and EAR are all built with the ZIP file format. Therefore, you
    can open, compress, and extract these files using any ZIP software you have already
    installed.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_85_0.png)'
