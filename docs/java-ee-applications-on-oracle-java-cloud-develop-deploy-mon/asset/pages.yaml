    # Implicit Objects


    Scriptlets and expressions are powerful and useful because code in the script
    ends up in the _jspService method and has access to not only the HttpServletRequest
    and HttpServletResponse objects, but also to the other objects such as Session
    and ServletContext that you will find at the top of the _jspService method. These
    are known as JSP implicit objects instead of the developer having to go to the
    trouble of creating them, the JSP in translated Servlet code creates and makes
    them available to the developer for use.


