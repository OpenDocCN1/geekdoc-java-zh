  md: '# Java EE Applications on Oracle Java Cloud


    EE compatibility is discussed in detail in Chapter 1. Basically, a Java EE implementation
    (application server) is considered Java EE compatible only if it passes the tests
    in the Java EE Compatibility Test Suite (CTS). Do note that the CTS is meant to
    be used by Java EE licensees looking to build Java EE–compatible application servers
    and not by Java application developers.


    The Oracle Cloud Cloud Service runs Oracle WebLogic Application Server, so you
    won''t need to evaluate and pick from all available servers. However, for understanding
    Java EE, it''s important to be aware of the other application servers and the
    different versions of Java EE supported by each server. This list is also useful
    to compare the various cloud vendors, because, as discussed in Chapter 1, most
    vendors support one or more of the servers. The Java EE 7 implementations list
    is likely to grow as more vendors support the latest Java EE version.


