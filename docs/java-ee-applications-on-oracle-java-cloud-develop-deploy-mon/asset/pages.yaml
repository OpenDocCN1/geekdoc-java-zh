    for possible future demand.


    #  Concerns About Cloud Computing


    The primary concerns with cloud computing are


    +   - **Security** Most surveys show security as businesses'' primary concern
    with cloud computing. Many businesses are uncomfortable putting sensitive data
    on shared cloud environments.


    +   - **Availability** If the Amazon Cloud goes down, it takes with it a horde
    of websites and services. An Amazon outage in October 2012 took down popular websites
    such as Reddit, Foursquare, and Pinterest.


    +   - **Connectivity issues** Although Internet connectivity has greatly improved
    over the past few years, it is still unreliable in most developing countries.


    +   - **Lock-in and dependence on vendor** A few large cloud vendors hold a bulk
    of the cloud market share, and as yet there is little standardization on cloud
    services, so you can easily get locked into a vendor.


    +   - **Rigid** Using a cloud service significantly limits the flexibility you
    if you were to run your own hardware and software. Most cloud vendors define fairly
    strict rules of operation to which users must adhere. You even need to build your
    applications with these limitations in mind.


    +   - **Legal** The cloud comes with its own set of legal implications based on
    locations and jurisdictions. This is a major factor, especially for large enterprises
    with sensitive data.'
