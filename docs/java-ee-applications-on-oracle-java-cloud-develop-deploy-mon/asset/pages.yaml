  md: '# 66 Java EE Applications on Oracle Java Cloud


    n the previous chapter, we created a basic web application using NetBeans and
    discussed the structure and packaging of a Java EE application. In this chapter,
    we''ll look at Servlets, a Java EE technology that be integral to Java EE application
    building from day one. We''ll also look at the key files for Servlet-based Java
    EE applications, sharing data, session management, filters, and listeners. Finally,
    we''ll deploy applications using these features onto the Oracle Java Cloud (OJC).


    # Servlets


    Servlets have been around since the late 1990s and, amazingly enough, continue
    to be a key foundation technology today. In a sense, the Java EE began with Servlets.
    Java Servlet Development Kit was a precursor to Java 2 Platform, Enterprise Edition
    (JEE) that was introduced in 1999 (http://oracle.com.edgesuite.net/timeline/java/).
    Servlets were launched at a time when Java itself was pretty new and Java applets
    were still cool and widely used.


    Servlets back then were leveraging the power of Java to help developers extend
    the functionality of a web server. I distinctly remember that, while I was preparing
    for campus placements during my master''s degree, the standard answer for "What
    is a Servlet" was "It is an applet that runs on the server." No one quite knew
    what that meant, but Servlets was still a buzzing technology, and this answer
    helped many of us land good jobs.


    Servlets today are anything but "applets on the server." Applets themselves have
    faded out over the years. The basic structure and code for Servlets have not changed
    much over the years. However, Servlets today are a foundation technology that
    most other Java EE technologies utilize or build over. The Oracle Java Cloud (OJC)
    supports the Servlets 2.5 specification.


    In previous chapters, we have talked about application servers, where the server
    receives a request for a resource and sends back a response in reply. What if
    you wanted this request/response process to do more and to have the smart to perform
    action X if some condition Y was fulfilled? Enter Servlets, which give you the
    ability to generate dynamic content while leveraging the many Java libraries and
    features.'
