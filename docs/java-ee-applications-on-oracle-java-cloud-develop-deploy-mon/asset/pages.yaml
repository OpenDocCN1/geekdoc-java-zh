  md: '# Summary


    In this chapter, we built and deployed JSF applications on OJC. The fact that
    OJC supports JSF 2.0 from Java EE 6 gives us access to a wide range of features
    as well as ease of use using annotations. We used several JSF Faclets components,
    validated inputs, bound UI components to a managed bean, and managed application
    navigation in a declarative way. We then used a template to create a consistent
    look and styling for our application. As you will have noticed, running our JSF
    application on OJC did not limit the scope or capability of our JSF application
    in any way. In the next chapter, we will venture into Enterprise JavaBeans (EJBs)
    and use them with JSF.'
