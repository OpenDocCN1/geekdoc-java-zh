    \    }\n}\n```\n\nNote this method is similar to the persist method in Listing\
    \ 9-3. As with adding a new entity, while updating the entity, we need a transaction\
    \ for the EntityManager not to throw an exception when we call its persist method.\n\
    \nIn the line Device foundDevice = em.find(Device.class, 2L), we state that the\
    \ class is Device.class and the primary key is 2. Note that we state it as \"\
