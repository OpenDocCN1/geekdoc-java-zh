  md: '# Java EE Applications on Oracle Java Cloud


    # Java Community Process (JCP) and Java EE


    Java EE, like all Java technologies, is driven by the JCP. Rather than having
    one organization make all the decisions, the JCP process involves the developer
    community and industry in the development of Java specifications. An Expert Group,
    consisting of members of various companies (such as Oracle, Red Hat, IBM, and
    SAP) and independent Java EE experts, is elected to manage each iteration of the
    Java specification. This Expert Group is charged with inviting suggestions from
    other developers and drafting the specification for a Java Specification Request
    (JSR). Each version of the specification has a corresponding JSR to which you
    can refer for complete information about the specification.


    For example, JSR 316 is the umbrella JSR for Java EE 6; it lists a highlevel view
    of Java EE 6 and documents that comprise the specification. JSR 342 covers Java
    EE 7, whereas JSR 244 covers Java EE 5. All Java EE 5, 6, and 7 technologies and
    JSRs are listed in Appendix A for reference.


    The executive committee is responsible for approving the final specification.
    The vendor companies usually compete on the actual implementation of that specification.


    If you download JSR 316 or 342, all you get a PDF file. How a company implements
    the specifications of that PDF makes all the difference in the marketplace. As
    long as the developer develops per all the Java EE-compatible implementations.


    So if EE is just a PDF file, where is the code? Where is the implementation? You
    will remember from the previous section that the application actually implements
    the specification. So the application server is where the implementation code
    is. The server vendors are responsible for writing the code to implement the specification.


    NOTE


    Although there are specific JSRs for the various Java EE versions, please note
    that one JSR does not provide the specifications for all Java EE technologies.
    The Java EE JSR refers to other JSRs for details on the various technologies in
    Java EE. Do check out the JCP FAQ at https://jcp.org/en/introduction/faq for more
    about the journey of the JSR from proposal stage to the final release.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_31_0.png)'
  merge: -1
