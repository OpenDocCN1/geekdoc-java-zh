  md: '# 70 Java EE Applications on Oracle Cloud


    It is a good practice to not tie your class name with the Servlet name and the
    URL patterns. The URL patterns are representative of the application flow and
    functionality, whereas the class and Servlet names depend on how you organize
    your code.


    You have the option of declaring multiple Servlet names, all of which point to
    the same class. Therefore, you can have one class with multiple Servlet names
    declared, where each Servlet name can have multiple URL patterns.


    Now change the Servlet Name to HelloServletName and the URL Pattern(s) field to
    /HelloUrl,/MyServlet, as shown in Figure 4-2, so as make the difference in the
    names and their usual usage. Note that we have two URL patterns for the Servlet,
    telling the server to run our Servlet whenever it gets a request with the URL
    pattern /HelloUrl or /MyServlet. Multiple URL patterns are useful because you
    often want to access the same Servlet functionality through different flows in
    your application.


    You can use the asterisk (*) wildcard in the URL pattern so as to map a wide range
    of URL patterns to a Servlet. Thus, you can have the URL pattern *.abc, which
    will mean that all requests in the form <anything>.abc will be directed to the
    Servlet. Or you can have the URL pattern /abc/<anything> to the Servlet.


