  md: '# Chapter 7: Enterprise JavaBeans (Session Beans) 169


    The code to create and use a stateful session bean is the same as for a stateless
    bean, except for the @Stateful annotation. However, the difference is in the working
    of the bean. For example, if you were to use a stateful bean for a shopping cart,
    you could have the bean injected into a Servlet, as shown in Listing 7-7, and
    if you keep adding items to a collection instance variable, the state will be
    maintained and you will keep getting the same object each time. If you were to
    use a stateless bean, you could very well get a different instance of the bean
    for all method calls. To continue using our shopping cart analogy, it would be
    as though each time you wanted to add something to your cart, you could found
    that the earlier contents of your cart had been lost or you found unexpected items
    in your cart that you never added.


    # Listing 7-7: Stateful Session Bean


    ```

    shopBean.add("phone");

    shopBean.add("laptop");

    shopBean.add("tv");

    ```


    In example, we used a web application and a single EJB, but in real-world applications
    with EJB, you would have many EJB modules in the enterprise application, with
    the EJBs generally being used from various segments of the web application.


    # Lifecycle of a Session Bean


    All EJBs are managed by the EJB container; however, it is important to know the
    lifecycle of any EJB, the stages it goes through, and the things you can and cannot
    do at stage.

    The lifecycle of a stateless session bean is fairly simply:


    +   1. The bean is created by the container. Any dependencies are injected by
    the container. Any PostConstruct callbacks are made. The bean is now ready.

    2. Before the bean instance is destroyed, the container makes any PreDestroy callbacks.
    The bean instance is removed and is later garbage-collected.


    The PostConstruct callback is useful if you wish to perform any actions before
    the bean starts to client requests. The PreDestroy callback is useful if you wish
    to perform any cleanup actions before the bean is destroyed.'
