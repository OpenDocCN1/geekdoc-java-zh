  md: '# Chapter 4: Servlets, Filters, and Listeners 83


    Unless there''s a pressing need for it, you would not want to use vendor-specific
    code in your Java EE application. We have discussed the reasons in Chapter 1.


    Let''s now look at filters and listeners, whose capabilities are often required
    for well-rounded Java EE applications. Filters and listeners can be used within
    all the Java EE web applications we build in the book, regardless of whether or
    not we use Servlets.


    # Filters


    When you think of the word “filter,” you tend to think of passing something (say,
    water) through a filter, removing the impurities and getting pure filtered water.
    However, a filter in Java EE is capable of doing much more with the request and
    the response. It can a) filter things out from the request, b) edit/add to the
    request or simply log the contents of the request, c) filter the response, or
    d) edit/add to the response or simply log the contents of the response. Therefore,
    a filter is more of a request pre-processor and a response post-processor.


    Filters are usually used when multiple servlets and other Java EE web components
    require some functionality, such as authentication, logging, and encryption. It
    makes sense to have one or more filters working together in a chain delivering
    the expected functionality for the Java Servlets or other Java EE components.


    Let''s add a simple filter to the Ch4Servlet we created earlier in this chapter.
    Right-click Ch4Servlet and select Next | Other. On this screen, select the Web
    category and the Filter type. Click Next. On the next screen, specify the filter
    name as Configure Filter Deployment screen, as shown in Figure 4-8. Note the package
    mapping here that the LogFilter applies to /*. As URL patterns discussed earlier
    in the chapter, * here is a wildcard, so /* means the filter will apply to all
    requests. Click Next.


    Click Next, and you will get a screen where you can set configuration values at
    filter initialization. We do not need to set these here, so finish. NetBeans will
    now generate LogFilter.xml file for the project would also now have the addition
    shown in Listing 4-5.'
