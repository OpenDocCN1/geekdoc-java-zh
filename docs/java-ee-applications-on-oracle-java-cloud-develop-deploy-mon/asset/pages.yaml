  md: '# 108 Java EE Applications on Oracle Java Cloud


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_131_0.png)


    FIGURE 5-4. Declaration and scriptlet count


    Again, run the index.jsp file and you will get a screen like the one shown in
    Figure 5-4, where the count is 0 for the declaration and the scriptlet.


    The curious part is where you refresh the page in the browser. You will find that
    the count for the declaration keeps rising while the count for the scriptlet stays
    zero throughout, despite the scriptlet in Listing 5-5 explicitly incrementing
    both count variables.


    The answer to this mystery again lies in the Servlet code. You will find that
    all the code in the scriptlets has been translated into corresponding Java code
    in the _jspService method. Whereas the count variable in the JSP declaration became
    an instance variable, the count variable in the scriptlet is a local variable
    in the _jspService method. Every time you refresh your page, the same Servlet
    instance is being accessed, so the value keeps incremented. However, in the case
    of the local variable count, the int count = 0 line is part of the _jspService
    method and will get executed for each request. The local variable count keeps
    getting reset to zero.


    # JSP Expressions


    JSP expressions are in the format


    ```

    <%= An Expression %>

    ```


    and provide a shortcut to print values in the output. Therefore, the line <%out.print(count);%>
    in Listing 5-5 could be replaced with <%= count %>'
