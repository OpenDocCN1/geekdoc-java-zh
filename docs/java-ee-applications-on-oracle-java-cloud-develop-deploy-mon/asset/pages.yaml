    # Java Platform, Enterprise Edition 5 (Java EE 5) JSR 244


    J2EE 1.4 was the version prior to Java EE. Although J2EE 1.4 was popular, it also
    got a lot of vlak for being complex and difficult to use. So based on the feedback
    from developers, Java EE 5 was a major effort for simplification across all enterprise
    Java technologies. The “Z” in the version name was dropped, and the version jumped
    from J2EE 1.4 to Java EE 5.


    Java EE 5 introduced annotations, to look down on XML configuration, and make
    Java EE 5 introduced dependency injection, which reduced the need to look up and
    create resources and led to more concise, easy-to-understand code.


    The Java Persistence API (JPA) was another important addition to Java EE 5. JPA
    standardized object relational mapping for managing relational data using Plain
    Old Java Objects (POJOs).


