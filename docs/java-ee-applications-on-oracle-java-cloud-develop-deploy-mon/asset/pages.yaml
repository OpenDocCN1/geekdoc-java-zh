  md: '# 152 Java EE Applications on Oracle Java Cloud


    We have looked at using various Java EE technologies to handle the HTTP and the
    web part of the application. However, arguably, the most critical component of
    any software is the functioning of the actual business logic. In this chapter,
    we look at Enterprise JavaBeans, a technology whose primary aim is running business
    logic efficiently, accurately, and securely.


    Enterprise JavaBeans (EJB) was perhaps the technology that truly marked the arrival
    of Java EE (or JEE as it was known back then) to the software development world.
    There was tremendous buzz around EJB at the dawn of the twenty-first century.
    EJB was expected to deliver almost magical results and, as such, it was the most
    prized skill on the job market. Although it did deliver on some of its promise,
    it was also extremely complex and tedious for developers to work with. Hardly
    any developer could confidently say they understood EJB inside out. Fortunately,
    EJB has been greatly simplified over the years.


    # Containers


    EJBs run in a specialized part of the application server known as the EJB container.
    Whereas the examples in the previous chapters used the web container part of the
    application server, in this chapter, we use the EJB container part of the application
    server, and then the web and EJB containers working together.


    Many of the commonly used application servers such as WebLogic, GlassFish, WebSphere,
    Geronimo, and Jboss include both an EJB container and a web container. There are,
    however, application servers that do not include an EJB container, so you''ll
    want to be mindful of this when choosing a server.


    If an application server is listed in the Java EE Full Platform Compatible section
    on the Java EE Compatibility page, found at


    www.oracle.com/technetwork/java/javaee/overview/compatibility-jsp-136984.html


    it will have both an EJB container and a web container. If a server is not listed
    on the Java EE Compatibility page, refer to the server documentation for EJB support.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# EJB in OJC


    The Oracle Java Cloud runs WebLogic server, and WebLogic includes an EJB container
    and a web container. However, before start building EJBs for OJC, we need to be
    aware of the exact specifications supported and what you can and cannot do with
    EJBs in OJC.


    OJC supports the EJB 2.1 and EJB 3.0 specifications. The focus of EJB 3.0 is on
    simplifying EJBs for developers, with the key feature being the introduction of
    annotations as an option for XML deployment descriptor files. EJB 3.0 was a significant
    improvement over 2.1 and will be the version we use in this chapter.


    Until EJB 3.0, persistence using Entity Beans was an integral part of EJBs. However,
    with EJB 3.0, persistence was moved out to Java Persistence API (JPA). (We will
    look further at JPA in Chapter 9 on persistence.) Although OJC supports EJB 2.1,
    do not that EJB 2.1 Entity Beans, which deal with persistence, are not supported.
    For OJC, we use JPA.


    OJC only supports local EJB invocations and not remote invocations. As such, you
    can invoke EJB only from within the same deployment or within a deployment archive
    that is deployed to the same Java Cloud Service instance. This is an important
    point to remember while using OJC for EJBs. If, you find the need at all to call
    a remote EJB, you would have to look at alternatives such web services. This could
    also be a challenge if you are looking to migrate existing EJB-based applications
    that use remote EJBs.


    There are two types of beans—session beans and message-driven beans. OJC does
    not support any Java Message Service (JMS) services, to utilize message—driven
    beans, we need to use the Oracle Messaging Cloud along OJC. OJC will otherwise
    mark any application with JMS dependencies as a whitelist.


    > TIP

    Appendix C contains a detailed list of all technologies supported and not supported
    on OJC.


    # Why EJB?


    EJBs in 3.x and later are pretty much Plain Old Java Objects (POJOs) with a few
    annotations that tell the EJB container to provide EJB-specific services and capabilities.
    However, one of the first questions to arise is why use EJB at all and not just
    use simple Java classes?'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Java EE Applications on Oracle Java Cloud


    The reason to use EJB lies entirely in the capabilities of the EJB container.
    Your code as such is nothing different, complex, or more capable. It the container
    that is supposed to weave in its magic and provide additional capabilities that
    are of value to an enterprise application. Those additional capabilities are


    +   - Scalability EJBs are a good option if you expect an application to have
    to scale to thousands of users. EJBs include pooling and other features for optimum
    management of available resources.


    +   - Distributed environment EJBs are built to run over a distributed environment.
    Their transition to the cloud is seamless, and they perform just as well in a
    distributed environment.


    +   - State management Session beans include a stateful option you can utilize
    to manage state in your application. If you wish to hold data over multiple invocations
    or share data for a user, this is possible using session beans.


    +   - Transaction management Transaction management is of great importance in
    enterprise applications. Instead of coding the transaction management, it is much
    more efficient to use EJBs’ annotation-based transaction management to ensure
    your transaction works as expected with the least amount of frustration.


    +   - Reusable services EJBs containing business logic are great for use across
    multiple applications and for sharing as web services. Code and functionality
    reuse is possible with EJBs.


    # Session Beans


    Session beans are business logic classes. A real-world application might have
    tens of session beans, each dealing with a subset of the application’s business
    logic and functionality. EJB 3.0 includes two types of session beans: stateless
    and stateful.


    > NOTE A third, the singleton bean, has been introduced in EJB 3.1 (not yet supported
    on OJC). As the word singleton suggests, this kind of session bean gets instantiated
    once per application and only that one instance exists throughout the lifecycle
    of the application.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_177_0.png)'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Chapter 7: Enterprise JavaBeans (Session Beans) 155


    # Stateless


    A stateless session bean is one that retains any specific information only for
    the duration of an invocation. Once the method call is done, none of the client-specific
    state is retained.


    This means you cannot rely on instance variables to store and retrieve information.
    Even repeated calls to a bean using the same reference might get you a new object
    each time. This stateless session beans rely on object pooling so as to achieve
    optimum performance, and on each invocation, you could well get a different object
    from the pool. How this object pool is managed is by the EJB container, but most
    application servers will let you the parameters a bit. However, with OJC being
    a PaaS environment, you do not get fine-grained access to pooling configuration
    for the server.


    However, the pooled-stateless approach leads to optimum utilization of memory
    and significant performance gains. So the rule of thumb is unless there''s a strong
    case to recall data/state across invocations, you use stateless beans.


    # Stateful


    Aful session bean will maintain state information for the duration of the client-bean
    session. Stateful beans are used in cases where maintaining state is required
    for the bean and client interaction to be executed, or when you wish to hold some
    client information across multiple method invocations—the classic example is the
    shopping cart, where a shopper keeps adding and removing objects from the same
    cart.


    Whereas you cannot rely on instance variables in the case of stateless beans,
    you can use instance variables with stateful beans, because the same instance
    will be used each time as long the session is active.


    We will look at the stages in the life of a session bean in the section “Lifecycle
    of a Session Bean.”


    # Interfaces: Local or Remote


    Client code can access a session bean using the business interface provided. The
    business interface for a session bean is like any other Java interface. You only
    need to add the requisite annotations to mark the interface as a business interface
    for your session bean.'
