  md: '# 126 Java EE Applications on Oracle Java Cloud


    In these examples, we have looked at commonly encountered scenarios—how you can
    produce dynamic content in a JSP using JSTL and expression language (EL) and without
    writing any Java code. The key to using JSTL and EL well is to be aware of all
    the tags we have covered, to understand the range of expressions possible, and
    to use them as and appropriate.


    Going through all the tags would not be appropriate here, but do note that the
    format is pretty much the same in all cases—most tags have multiple attributes
    to provide for various possibilities, and these attributes in many cases accept
    expressions to make the tags even more capable.


    # Summary


    JSP has been around for a long time and yet continues to be a good, quick option
    for building Java EE applications. Using JSP, along with JSTL and EL, enables
    you to build rich applications while still having clean code. JSP skills are easily
    available, and JSP continues to be an important part of even the latest versions
    of Java EE. OIC runs your JSP files as well as there are no JSP-specific restrictions
    on your development.


    Do not discount JSP and take up the more complex frameworks only because JSP is
    no longer fashionable. If you don''t find the tags you need in the libraries we''ve
    discussed here, explore some of the many open-source tag libraries available for
    niche requirements.


    In the next chapter, we will look at JavaServer Faces (JSF), which is a feature-rich
    web framework and the framework of choice for most new Java EE web applications.'
