  md: "# Java EE Applications on Oracle Java Cloud\n\nAll you need to use a callback\
    \ is to mark a method with the annotation @PostConstruct or @PreDestroy. As shown\
    \ in Listing 7-8, you can choose any method name, but the method signature must\
    \ return a void and take no arguments. The reason for this is that the method\
    \ is being called by the EJBContainer on the occurrence of a lifecycle event,\
    \ so there isn't a possibility of the user passing a parameter or getting a return\
    \ value.\n\n# Listing 7-8: Callback Methods\n\n```\n@PostConstruct\npublic void\
    \ initialize() {\n  // Code to initialize resources\n}\n```\n\n```\n@PreDestroy\n\
    public void release() {\n  // Code to release resources\n}\n```\n\nStateless session\
    \ beans also utilize a pooling capability, where all instances of the stateless\
    \ beans are equivalent and the container can pick objects from the pool and return\
    \ them back to the pool as required. The lifecycle of a stateful session bean\
    \ involves a couple more steps:\n\n+   1. The bean is created by the container.\
    \ Any dependencies are injected by the container. Any PostConstruct callbacks\
    \ are made. The bean is now ready.\n\n+   2. Based on the usage of a bean and\
    \ the available resources, the EJB container may at times decide to passivate\
    \ a bean by moving it from memory to secondary storage. Before passivating, the\
    \ EJB container will make any PrePassivate callbacks.\n\n+   3. If a client calls\
    \ a method on a passivated bean, the EJB container will activate the bean. On\
    \ activation, the container will make any @PostActivate callbacks. The bean is\
    \ now ready.\n\n+   4. Before the bean instance is destroyed, the container makes\
    \ any PreDestroy callbacks. The bean instance is removed and is later garbage-collected."
