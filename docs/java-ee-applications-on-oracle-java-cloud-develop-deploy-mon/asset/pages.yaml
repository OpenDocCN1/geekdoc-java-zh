  md: '# Unsupported Features and APIs


    Oracle Java Cloud does not support the features and APIs listed here. In most
    cases, the reason for this is a) constraints due to a common-shared environment,
    b) Oracle’s Cloud products strategy, or c) security concerns.


    +   - Any API deprecated in WebLogic Server release 10.3.6 or lower.

    - Any API deprecated in ADF release 11.1.1 or lower.

    - Direct JAR deployment.

    - WebLogic Server shared libraries, deployments, and references, except for references
    to libraries predefined in Java Cloud Service, as described in “Understanding
    On-Premise and Java Cloud Service Portability.”

    - Java EE Connector Architecture (JCA) Container—RAR deployments.

    - Java Message Service (JMS) services. Any application that has JMS dependencies,
    including the use of WebLogic Server application-scoped JMS modules.

    - JAX-RPC based web services.

    - Applications exposing or invoking asynchronous web services.

    - Use of-*-* other than WS-Security (through OWSM policies).

    - Remote invocations with a transport protocol other than HTTPS (including plain-text
    HTTP).

    - Coherence applications managed or used through WebLogic ActiveCache.

    - Direct use of any JRF API components other than ADF. For example, the direct
    use of Oracle Platform Security Services (OPSS) and ODL APIs.

    - Direct use of Oracle JDBC Driver APIs.

    - Use of SQL statements to specify a database instance other than Oracle Database
    11g (11.2).

    - JavaMail API specification.

    - Direct modification of the Java command-line parameters, including for the specification
    of system properties.'
