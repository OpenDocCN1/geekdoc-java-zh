    # JSP Declaration


    JSP declarations are used to declare variables and methods in a JSP, which you
    could utilize in the rest of the page. Let''s first add a declaration and see
    where it ends up in the translated Servlet code (see Listing 5-4).


    > Listing 5-4: JSP Declaration


    ```

    <! int count = 0;%

    <%!

    String welcomeMsg(String name) {

    return "Welcome " + name;

    }

    %>

    ```


    Because no output is being generated by this block of code, where you place the
    code in the JSP is immaterial. Now, again, right-click and choose Compile File
    and have a look at the generated Servlet code. You will find that count is an
    instance variable and welcomeMsg is a new method in the Servlet. This is where
    any variable and methods you add to a JSP up.


    # JSP Scriptlets


    lets are Java code fragments embedded in the JSP page. Scriptlets are arguably
    the most used and abused feature of JSP. If used judiciously, scriptlets can save
    a lot of time and effort, but if used too much, it can end up being a nightmare
    for anyone except the person who wrote the code. Java code snippets over the JSP
    make debugging and maintaining the JSP a tough task.


    Let''s add the scriptlet in Listing 5-5 to index.js. Note that you will need to
    add this within the HTML body tags for the output to be displayed in the browser.
    Also note that we already declared a count variable in the declaration, so we
    are adding a second count variable in a scriptlet here.


    > Listing 5-5: JSP Scriptlet


    ```

    <% int count = 0;%

    <h1>Count In Declaration <%= out.print(this.count); %></h1>

    <h1>Count In Scriptlet <%= out.print(count); %></h1>

    <% this.count++; %>

    ```'
