  md: '# 36 Java EE Applications on Oracle Java Cloud


    most comfortable with the Eclipse IDE. Oracle Enterprise Pack for Eclipse is the
    Eclipse-based Oracle development tool that these developers wanted.


    Which IDE is the best? Developers are passionate about their IDE, and each has
    its merits. In fairness to these leading IDE options, we''ll show Java Cloud integration
    in each one. The integration is quite similar on all IDEs, so none of the three
    enjoy any edge in regard to the Java Cloud, and you can choose to whichever you
    find best for your needs. Before the IDE integrations, you first need to get the
    Oracle Java Cloud Service SDK.


    # Oracle Java Cloud Service SDK


    Download the Oracle Java Cloud Service SDK, which is freely available for download
    on the Oracle Technology Network website. Note that the SDK can be used independently
    of any IDE.


    The SDK contains the following tools:


    +   - A command-line interface for interacting with your Oracle Java Cloud Service
    instances.


    +   - A whitelist tool for checking your application''s cloud deployment readiness.


    +   - Ant tasks and Maven plugins for interacting with your Oracle Java Cloud
    Service instances.


    +   - There''s no installation process for the SDK; you simply need to download
    and unzip the file onto your machine.


    # NetBeans


    Download and install the NetBeans IDE from www.netbeans.org. Ensure that you either
    download the Java EE Bundle or the All Bundle. install the Oracle Cloud Plugin
    for NetBeans. Start NetBeans, then choose Tools | Plugins. In the Plugin Manager,
    select the Available Plugins tab and search for “Oracle Cloud”. You should select
    an Oracle Cloud plugin with the category marked as “Java EE.” Select the plugin
    and install it.


    Now choose Tools | Cloud Providers, followed by clicking the Add Cloud button.
    Select Oracle Cloud on the next screen, and you will see a screen like the one
    shown in Figure 2-8. Enter your credentials and provide the path to the Oracle
    Cloud SDK you extracted earlier. You will now see “Oracle Remote” listed in Cloud
    Resources, as shown in Figure 2-9. Click Finish.'
