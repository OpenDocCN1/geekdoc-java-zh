  md: '# Java EE Applications on Oracle Cloud


    Filters cannot be directly run by the user, but are meant to get invoked automatically
    whenever the filter mapping applies. Therefore, in our case, we won''t try to
    run LogFilter but rather run Hello.java. When we send a request to the Servlet
    that we created earlier with Hello.java, the following should happen:


    +   1. The request will get pre-processed by LogFilter.

    2. It will then be processed by the Hello.java Servlet, which will generate a
    response.

    3. The Servlet response will again go through the filter, where it can be processed
    again.


    The output after the filter''s post-processing is what will be sent back to the
    client.

    The following log output, generated by LogFilter, shows the results of these three
    steps:


    ```

    Request Protocol: HTTP/1.1

    Request Received At:<Date Time>

    Response Sent In : 2 milliseconds

    ```


    Because viewing the logs is something useful throughout the application, and not
    just in Servlets or filters, we will see how and when you can view logs on OJC
    in “View Java Logs,” later in the chapter. You can quickly jump over that section
    and return when you''re done.


    In this example, we looked at a single filter; however, you can very well create
    a series/chain of filters. The filters are executed in the order in which they
    are declared in the web.xml file.


    # Listeners


    Java EE provides the capability for you to track key events in your application
    using event listeners. The methods in these listeners are called by the server
    whenever the corresponding lifecycle event occurs.


    When you add a listener to your application, you need to a) write a class that
    implements the appropriate listener interface and b) declare the listener in the
    web deployment listener. Listeners are generally used in cases where you want
    to execute some actions or load some data/configuration on application'
