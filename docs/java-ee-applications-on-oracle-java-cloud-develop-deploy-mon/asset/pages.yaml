  md: '# Foreword


    The move to the cloud has become a seemingly overwhelming direction in which companies
    and technologists are finding themselves driven in the ongoing effort to achieve
    better economies of scale and a faster pace of business innovation in using enterprise
    technology.


    This has been clearly illustrated by the rapid rise and adoption of Software as
    a Service and Infrastructure as a Service, but has been unusually light or limited
    for the application software infrastructure—enterprise-scale databases and enterprise-scale
    middleware—itself. This has not been for the lack of trying, but it simply represents
    a really hard problem that is only now being solved.


    The emergence of Oracle Java Cloud Service and its capabilities are a major step
    forward in this journey to enterprise-class cloud infrastructure. It represents
    part of a major strategic investment from Oracle to bring to market the industry’s
    first Platform as a Service offering that combines enterprise-class middleware,
    Oracle WebLogic Server, and an enterprise-class database, Oracle Database, into
    a highly productive, simple, easy-to-use application development and deployment
    environment that is proven for large-scale, mission-critical application deployments.


    Given my role in the development and project management of Oracle WebLogic Server,
    Oracle Coherence, and Oracle Java Cloud Services, and given the opportunity by
    Harshad Oak, the author of this book, I wanted to share my perspective of how
    this investment is proceeding, in hopes that it frames how you read and understand
    this book.


    It starts forward the “middle” of all infrastructures—the application server.
    In that space, Oracle offers Oracle WebLogic Server, our server for building custom
    and bespoke Java EE applications and for hosting third-party Java applications.
    It is complemented by Oracle Coherence, our in-memory grid for scaling out infrastructures
    within and across data centers.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# xiv Java EE Applications on Oracle Java Cloud


    Over the last five to six years, my team has made a huge investment to continue
    the technical journey of evolving Oracle WebLogic Server and Oracle Coherence
    to operate in large-scale environments of hundreds to, in many cases, thousands
    of servers. We have focused on hard problems such as scalability, reliability,
    availability, and performance, complemented by large-scale administrative and
    management investments.


    The cloud has brought a new set of unique challenges to solve: management through
    robust interfaces (solved by JAX-RS APIs available for managing WebLogic Server),
    elastic scalability (solved by dynamic clusters in WebLogic Server and Coherence),
    self-service provisioning (now available in the Oracle Java Cloud Service!), advances
    in security concerns (addressed by ongoing investment in security features in
    WebLogic Server and lockdown guides to deploying it securely), and, more recently,
    a focus on solving multitenency issues in connection with Oracle Database 12c
    and its recent support for multitenency.


    But is not enough to evolve the infrastructure of WebLogic Server to be more enterprise
    and cloud ready. Oracle went to the next step and made WebLogic Server and Oracle
    Database available in the Oracle Cloud at http://oracle.com. The family of Java
    services built around Oracle WebLogic Server is called Oracle Java Cloud Services
    and for the Database, the Oracle Database Services.


    At the time of this book''s publication, Oracle has one Java Cloud Service – SaaS
    Extension. This is the first in middleware that Oracle has made available and
    is focused on enabling customers to build and deploy applications rather than
    having to understand how to manage and operate Oracle WebLogic Server.


    SaaS Extension is a remarkably easy Java service and is the focus of this book.
    It is sometimes simply Java Cloud Service and, more recently, I have heard people
    colloquially refer to it as JCS-SX. On its release several years ago, it broke
    new ground by offering a true enterprise-class version of WebLogic Server that
    was uniquely integrated out-of-the-box with the Oracle Database.


    “SaaS Extension” refers to a characteristic of that service, which is the ability
    to extend the Oracle SaaS applications that are offered in Oracle Cloud, as well
    as for pure custom development of Java applications. All lifecycle activities—patching,
    backup, and restore—are taken care by Oracle in Oracle Datacenters, and your focus
    as a developer or application'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'manager is primarily to deploy and run your application. Simple! And Harshad
    will show you how.


    Coming in calendar 2014, Java Cloud Service – SaaS Extension will be added to
    several other Java Services that are geared even more toward custom application
    development to put far more control in the hands of the operators of the underlying
    Oracle WebLogic Server and Oracle Coherence. These new offerings are formally
    named Java Cloud Service – Virtual Image and Java Cloud Service (with no additional
    suffix).


    These services together are referred to as Oracle Cloud Services and, as noted
    earlier, for the basis of moving all Oracle Fusion Middleware into the Oracle
    Cloud. This is a massive investment by Oracle, with many other services coming
    focused in areas such as messaging, document management, developer productivity,
    business process management, and much, much it is one of the most exciting times
    in middleware for Oracle for the last 10 years.


    In summary, I would like to say it is my distinct pleasure to write this foreword
    to Harshad Oak’s book on Oracle Java Cloud Services with a focus on Oracle Java
    Cloud Service – SaaS Extension. Harshad has been a long-time expert driving the
    understanding of key Oracle technologies and how customers can achieve the most
    success using them.


    Oracle has mobilized to drive its entire software portfolio into the cloud, and
    getting the foundational middleware and database into the cloud was the first
    step to enable the rapid rollout of new innovative cloud services on that foundation.
    Harshad was one of the first people who understood this service was more than
    just a trial balloon for Oracle.


    I hope you enjoy this book as much as I do. In the mid-to-late ’90s when everything
    seemed new with the start of the Internet, we technologists are once again in
    a very exciting time of change as world-class enterprise software for running
    real transactional workloads has finally arrived in the cloud. Enjoy!


    ~ Mike Lehmann


    Vice President Product Management


    Oracle WebLogic Server, Oracle Coherence, and Oracle Java Cloud Services'
