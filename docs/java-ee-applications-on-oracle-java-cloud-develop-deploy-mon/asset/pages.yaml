    Although this is a bare-bones .xhtml file, it still has enough in it for us to
    discuss the foundation of a Facelets-based .xhtml file.


    XHTML is HTML that is also XML. Therefore, all the hacks and shortcuts you can
    get away with an HTML file will not work in XHTML. XHTML brings in the following
    conditions: doctype must be; all elements must be nested, closed, and in lowercase;
    the document must have one root element; all attributes must be in lowercase;
    attributes must be quoted; and more.

    Apart from leading to nice, readable code, the other important benefit is that
    XHTML can be parsed using an XML parser, which is an important capability if you
    want to use and modify the file.


    > TIP

    One of the most common HTML tag issues involves the <br> tag. For it to be valid,
    well-formed XML, the tag has to be <br /> and not <br>.'
