  md: "# Transaction Management\n\nTransaction management is the assurance that either\
    \ the entire transaction with all the intermediate steps will execute or nothing\
    \ will get executed. Imagine that you are transferring money from one bank account\
    \ to another account. This involves two steps:\n\n+   1. Withdraw money from one\
    \ account.\n2. Deposit money to another account.\n\n want either the entire transaction\
    \ to get executed or nothing at all. In other words, you never want a scenario\
    \ where money is withdrawn from one account, but it never gets deposited into\
    \ the other account.\nAlthough you can manually write the code for transaction\
    \ management, container-managed transactions using annotations are just so much\
    \ easier and cleaner to maintain. You annotate methods that are party to a transaction,\
    \ and the EJB container will do the rest.\nLet lets add a session bean to our\
    \ enterprise application. This bean will transfer money in a transaction-safe\
    \ manner. We could add this bean to the existing EJB module, but let's create\
    \ a new EJB Module project as to highlight how an enterprise application can have\
