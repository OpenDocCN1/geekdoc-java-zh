    You will find that the lines shown in Listing 7-4 are added to this Servlet.


    # Listing 7-4: Dependency Injection of a Session Bean Instance


    ```

    @EJB private authenticateSessionBeanLocal authenticateSessionBean;

    ```


    The @EJB annotation here is a manifestation of dependency injection, a concept
    that has rapidly grown in popularity and in a fairly short period of time.


    # Inject the Session Bean into the Servlet


    Dependency injection in the context of Java EE is when a component provided its
    dependencies by the container. Therefore, the annotation tells the container what
    kind of object to inject, and the container does all the hard work to create the
    instance and inject it into the component.


    Those new to dependency injection are usually flummoxed when they see methods
    calling an object without being any object initialization code in place. The reason
    why this works and does not throw a NullPointerException, like many would expect,
    is that the relevant object has been injected by the container and therefore isn''t.


    The advent of dependency injection was wonderful for Java EE because it led to
    smarter servers that no longer had to be obvious information, but could figure
    out and get mundane tasks done based on simple annotations in the code.


    In our Servlet, the @EJB annotation is a request for an injection of the EJB instance
    into the Servlet. There''s no code in the Servlet to look up or actually instantiate
    the EJB; the annotation is merely a request to the container to do the required
    task. The @EJB annotation can provide additional information via parameters such
    as beanInterface, beanName, description, mappedName, and name.


    Once the EJB is injected into the Servlet, we can use it in the processRequest
    method, as shown in Listing 7-5.


    # Listing 7-5: Access Injected Session Bean in the Servlet


    ```

    @EJB private authenticateSessionBeanLocal authenticateSessionBean;

    protected void processRequest(HttpServletRequest request, HttpServletResponse
    response) throws ServletException, IOException {

    ```'
