    # Servlet Class


    Now that we have deployed the Servlet to the OJC, let''s discuss the actual Servlet
    code and its capabilities. Our Servlet class extends the HttpServlet and overrides
    the methods doGet and doPost. You will find that NetBeans has added a method,
    processRequest, that is being called from both doGet and doPost. Note that processRequest
    is not something dictated by the Java EE standard; NetBeans introduces this method
    so to avoid duplicating code in doGet and doPost.


    If you look at the code in the processRequest, you will find that most of it is
    generating static HTML through out.println method calls. out.println calls are
    made on a PrintWriter object and generate the HTML for the entire page.


    We also set the content type (via setContentType) for the response by specifying
    the Multipurpose Mail Extensions (MIME) type of the content. The default is text/plain,
    but because we want an HTML web page, we set it to text/html. Other commonly used
    types are text/image/jpeg, and application/pdf. A web search could easily get
    you a list of additional MIME types. We have also set the character encoding to
    UTF-8 in the same method call. You could also achieved this via a separate call
    to setCharacterEncoding.


    The content type and the character encoding are vital information for the recipient
    of the Servlet response (which in most cases is a web browser) to process/display
    the Servlet response correctly.


    The only dynamic in this Servlet is the call to request .getContextPath(). This
    method returns the content path for our application. You will find the context
    path stated in the weblogic.xml configuration file. You can edit the value in
    the .xml file and run your application with a different'
