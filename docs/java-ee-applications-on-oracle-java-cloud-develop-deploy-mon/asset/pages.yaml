  md: '# Java EE Applications on Oracle Java Cloud


    This book looks at Java Enterprise Edition (Java EE) and cloud computing and how
    you can best get them working for you on the Oracle Java Cloud Service. In each
    chapter, we review the various aspects of Java EE and walk through how to get
