  md: '# Chapter 5: JavaServer Pages, JSTL, and Expression Language 115


    JSTL has multiple tag libraries, each with a unique URI and consisting of many
    different tags:


    +   - Core http://java.sun.com/jsp/jstl/core


    +   - XML http://java.sun.com/jsp/jstl/xml


    +   - Formatting http://java.sun.com/jsp/jstl/fmt


    +   - SQL http://java.sun.com/jsp/jstl/sql


    +   - Functions http://java.sun.com/jsp/jstl/functions


    # Taglib Directive


    Before we use any of the tag libraries, we need to use a taglib directive to state
    which libraries we are using and their prefix. The prefix and the URI are important
    so as to avoid any conflict between tags with the same name but in different libraries.


    The taglib directives for the JSTL tag libraries are shown in Listing 5-8.


    # Listing 5-8: JSTL Tag Directives


    ```

    <@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>

    <%@ taglib prefix="sql" uri="http://java.sun.com/jsp/jstl/sql" %>

    <%@ taglib prefix="x" uri="http://java.sun.com/jsp/jstl/xml" %>

    <%@ taglib prefix="fn" uri="http://java.sun.com/jsp/jstl/functions" %>

    <%@ taglib prefix="fmt" uri="http://java.sun.com/jsp/jstl/fmt" %>

    ```


    > TIP

    Note that the prefixes are used by convention, but you can change the prefix used.
    Also, the URI is only used here as a unique identifier for the library. It does
    not suggest that page has to communicate with that URI and retrieve anything.


    # Core Tag Library


    The core tag library consists of the tags you would need to use most often. It
    provides functionality for setting variables, running a loop, and producing output
    when a logical condition is fulfilled.'
