  md: '# Java Cloud


    A simplistic explanation of the Oracle Java Cloud is that it''s Oracle''s WebLogic
    Server integrated with the Oracle Database. So developing and deploying on the
    Java Cloud is akin to developing and deploying on WebLogic and using an Oracle
    Database for persistence. However, the latest versions of WebLogic support all
    Java EE 6 features, the Java Cloud supports a mix of Java EE 5, Java EE 6, and
    Oracle WebLogic capabilities. For a detailed list of technologies supported by
    Java Cloud, refer to Appendix B.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_51_0.png)


    > Oracle has recently introduced "Oracle WebLogic as a Service," which is still
    in preview mode. Although both the Java Cloud Service and WebLogic run the WebLogic
    Server, the primary differentiating factor of "Oracle WebLogic as a Service" is
    that it offers full administrative and operational control.


    Although Java Cloud supports a mixture of features and capabilities, it is important
    to note that the Java Cloud supports almost all of the most used Java EE technologies.
    Although it might not support the latest versions of each, there is support for
    Servlets, JavaServer Pages (JSP), JavaServer Faces (JSF), Enterprise JavaBeans
    (EJB), Java Persistence API (JPA), Java API for Restful Web Services (JAX-RS),
    and Java API for XML Web Services (JAX-WS), as well as popular technologies such
    as ADF.


    Another thing to note is that the Java Cloud supports Java SE 6 APIs. Refer to
    Appendix C for a detailed list of technologies that would trigger a whitelist
    violation and stop your application from being deployed.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_51_1.png)


    > A whitelist is a list of those technologies and APIs that fulfill the technical
    and security requirements of a software/service and have been approved to run
    on it.


    # Pricing


    Now that you understand the history and position of Oracle Java Cloud, what does
    it take to get started? Oracle offers three broad editions of cloud subscription;
    you pick your edition and pay a flat monthly rental.'
