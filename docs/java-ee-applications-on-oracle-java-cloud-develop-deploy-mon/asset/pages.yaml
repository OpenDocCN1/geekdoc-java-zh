  md: '# Chapter 9: Persistence Using the Oracle Database Cloud Service 213


    Struts was so popular that it had become the de facto standard for Java web frameworks;
    similarly for object/relational mapping, there was Hibernate.


    Hibernate offered Java developers the option to developing with Java, while the
    framework took care of mapping the Java objects to the corresponding database
    tables. Java developers loved it and flocked to Hibernate by the thousands. Even
    though object/relational mapping wasn''t a new idea, Hibernate clicked just time
    as Java developers found it a much easier and better alternative to writing Java
    Database Connectivity (JDBC) code and firing SQL queries along with all the exception
    handling required. Also, working with Java objects seems like the more intuitive
    thing to do for Java developers.


    Java, due to its emphasis on collaboration and standardization, is great at adopting
    a good idea and building a standard around it. So JPA became the specification
    for managing data between Java objects and relational databases.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_236_0.png)


    > NOTE

    JPA is not a "EE-only" specification, but it works for Java EE and Java SE. Java
    developers need to write their Java class and annotations as per the JPA specification.
    They need not bother with the actual mapping to the database because the JPA implementation
    will take care of it on their behalf.


    # Persistence Providers


    With all JPA specifications, JPA states how you need to write your classes and
    how the persistence is to be managed. However, JPA does not include any actual
    implementation. Therefore, it is up to persistence providers to build the JPA
    implementations. As always, the beauty of a specification with multiple implementations
    is that if you code per the specification, you can switch your JPA implementation
    if required. OpenJPA, Hibernate, and EclipseLink are some of the popular implementations
    of JPA.


    # Entity


    Entities are Plain Old Java Objects (POJOs) that represent tables in the database.
    So to add a new row, you create a new instance of the entity class and persist
    it. Similarly, to a row, you can get the appropriate row as'
