  md: '# Java EE Applications on Oracle Java Cloud


    In the previous chapter, we built applications using Servlets, filters, and listeners
    noticed and deployed them on the Oracle Java Cloud Service. You likely noticed
    that building applications using Servlets can be tedious and involves a lot of
    Java coding, even when what is generated is static HTML. To address this issue,
    JavaServer Pages (JSP) emerged. JSP lets you embed snippets of Java code into
    your HTML. The functionality is similar to Servlets, but JSP drastically reduced
    the amount of Java code that has to be written, leading to more streamlined, efficient
    coding and increased developer productivity. Although JSPs can be used to generate
    any text-based format, it is most commonly used for HTML.


    # The Origin of JSP


    Like Servlets, JSP has been around from the early days of enterprise Java. Version
    1.0 was released in 1999, and JSP (version 2.3) is very much a part of Java EE
    7. JSP also continues to be used in all kinds of applications, including those
    deployed on cloud.


    When JavaServer Faces (JSF) was introduced as a framework for building component-based
    user interfaces, JSF continued to be the view technology for JSF. Only with JSF
    2.0 was JSP deprecated as a view technology for JSF and replaced by Facelets.
    “View technology” here refers to that part of the JSF framework that is responsible
    for generating the view for an application. We will take a closer look at JSF
    in the next chapter. So the point to note is that JSP is very much around. It
    has not been deprecated as a whole, but as the view technology for JSF 2.0 and
    above.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_121_0.png)


    > TIP Deprecation is meant to indicate to developers that a technology is still
    available but the creators suggest that you avoid using it. This is usually because
    that technology might be removed/ replaced in a future version.


    JSP enhancements have been sluggish over the past few years. However, JSP is very
    much an integral part of almost all Java EE applications built over'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Chapter 5: JavaServer Pages, JSTL, and Expression Language 99


    the past decade and continues to be widely used even today, despite most books
    and blogs recommending JSF over JSP. This is not only because JSP is easy to use
    for rapid development, but also because JSP skills are easy to find. Also, many
    developers used to building with JSP find that it serve them very well and are
    not keen on switching.


    What''s more, JSP, with its simple request-response model, is a good enough backward
    for applications and even JavaScript clients that only require that basic functionality.
    The newer JSP comes with more complex lifecycle management by the web container,
    which can seem like overkill in some cases.


    Due to backward compatibility, even the latest JSP versions support usage syntax
    from the early days of JSP. In many cases, this means there are multiple ways
    to do the same thing. In this chapter, we will mostly look at the newer and more
    elegant ways, using tag libraries and expression language.


    # JSP on the Oracle Java Cloud


    The Oracle Java Cloud currently supports JSP version 2.1, which is the version
    included in Java EE 5. JSP version 2.1 was a significant release because it introduced
    a unified expression language for JSP and JSC. OJC does not impose any JSP-specific
    restrictions or limitations. A widget marked Servlets and JSPs on the Java Cloud
    Services Control page, shown in Figure 5-1, shows the number of active sessions,
    the average requesting time for Servlets and JSPs in the past five minutes, and
    the number of requests per minute in the past five minutes.


    ![](img/8e9e661e2b8c46ac1bac14738014a15d_122_0.png)


    > TIP

    All “per minute” statistics shown on the Java Cloud Service Control are “per minute”
    in the last five minutes.


    Although the values in Figure 5-1 are for your entire Java Cloud instance, you
    can see values for a particular application in the Applications table and also
    on the Java Cloud Control page for that application. Although we will look at
    what custom tags are later in the chapter, this is a good place to note that OJC
    also supports custom WebLogic Server–specific tags in weblogic.jsp.'
