  md: '# 130 Java EE Applications on Oracle Cloud


    Facelets'' component-based model has also given vendors the option to ship component
    libraries that can be easily plugged in any application. There are many such free,
    open-source, and commercial component libraries available. The creators of those
    libraries usually just ship a .jar file with bunch of components built as per
    the Facelets and JSF norms.


    The component-based model of Facelets has also led to the creation of tools that
    can easily add and edit components. Facelets provides tag libraries in addition
    to the JSTL we discussed in the previous chapter.


    From the look of it, Facelets vary from JSPs to the use of XHTML and the different
    tags and components used. However, Facelets also support expression language capabilities
    beyond JSP. So in the previous chapter, we only looked at expressions that are
    evaluated immediately using the $ syntax. However, with JSF and Facelets, we can
    also leverage the deferred evaluation capability using the #{ syntax so that expressions
    are evaluated only at an appropriate point in the lifecycle of a component.


    Let''s now build a JSF application and try to understand JSF with reference to
    our sample application.


    Select Java Web | Web Application to create a new project in NetBeans. Name the
    project Ch6JSF1. Along similar lines to projects in previous chapters, use the
    Oracle Cloud remote. In the next step, in Figure 6-1, select JavaFaces in the
    first of frameworks. You now need to set the server library for your JSF application.
    Because we will be running the application on OJC, our library options are limited
    to JSF 2.0 and JSF 1.2, which are listed in the Server Library drop-down. Select
    JSF 2.0.


    Next, click the Configuration tab. As shown in Figure 6-2, the Servlet URL pattern
    is set to /faces/*. This means that all requests received by your application
    match the URL pattern /faces/* will be handled by the JSF framework. Here, * is
    the wildcard character, which implies that you can have Servlets and JSPS like
    the ones in the previous chapter running alongside JSF. If the request URL does
    not match /faces/*, the JSF framework will not get involved and your Servlet/JSP
    can run independently.


    Next, we need to select the preferred language. The choices are Facelets and JSP.
    In case you only see the JSP option (no Facelets), check whether you have selected
    JSF 2.0 in the Server Library drop-down, as shown in Figure 6-1. Select Facelets.


    Next, select the Components tab. You will see the screen shown in Figure 6-3.
    Listed are popular JSF suites (PrimeFaces, ICEFaces, and RichFaces) that bring
    in their own set of rich components. Although JSF itself has many'
