  md: '# Custom Tags


    With custom tags, you can create new tags that have the meaning and functionality
    as you desire. For example, using a <p> tag in HTML leads to a new paragraph being
    created because the browser knows that''s intended where it sees a <p> tag in
    the HTML.


    Similarly, with custom tags, you can use a tag named a2z in your JSP, and then
    tell the server it is to print the alphabet from A to Z where it sees that tag.


    Creating your own custom tags is possible, and many did attempt so in the early
    days of custom tags. However, with JSTL and many other third-party libraries available,
    most developers now prefer to use tried-and-tested tags from these libraries instead
    of creating your own. In most cases, it is best to stick to JSTL.


    Although we will not get into the specifics of building a new custom tag from
    scratch, do note that building a new tag involves the following steps:


    +   1. Writing the code for the functionality that the tag is supposed to provide,
    also known as the tag handler.


    +   2. Writing the description for what tags are supposed to achieve, also known
    as the tag library descriptor (TLD).


    +   3. Packaging the tags into a JAR file, which is the tag library.


    +   4. To use a tag in a JSP, you need a taglib directive to convey which tag
    and prefix you wish to use. You will see this in action in examples later in the
    chapter.


    OJC supports custom WebLogic Server-specific tags at weblogic.jsp*. These tags
    have been around before BEA was acquired by Oracle. As mentioned in the previous
    chapter, as much as possible, you do not want to use server-specific tags and
    limit the portability of your application. However, the tag support will be useful
    for those looking to move a WebLogic deployment to the cloud.


    Before we get into the specifics of JSTL and expressions, Listing 5-7 shows a
    simple example to whet your appetite.'
