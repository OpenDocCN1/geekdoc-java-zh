    # Find and Update Entity


    All entities can be found/retrieved using the class name and the primary key.
    Updating an entity is as simple as updating the value in the entity object and
    persisting the updated object. We will later look at using queries for bulk updates,
    but where you need to update a single entity, the value in the object is the easiest
    to go about it.'
