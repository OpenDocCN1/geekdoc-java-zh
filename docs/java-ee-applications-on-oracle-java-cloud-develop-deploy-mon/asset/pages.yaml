    be ready to start development in the next chapter.


    # Oracle''s Cloud Foray


    In the early days of the "cloud computing," when the hype was just starting, Oracle
    founder Larry Ellison famously said, "[The Cloud] is databases and operating systems
    and memory microprocessors and the Internet" and "all the Cloud, is computers
    in a network.


    Ellison sure a point. SaaS (Software as a Service) had been around for years,
    and the cloud as such was nothing new in the technology sense. What was perhaps
    new the software development paradigm spun around the idea of cheap, pay-per-use
    hardware and software. Another remarkable aspect of the cloud was the stickiness
    of the term "cloud." For reasons no one is pers of, the term "cloud" worked. So
    soon we had marketing groups from every other company leveraging the term "cloud"
    to sell their wares. Whereas "grid" and "virtualization" had their brief moments
    in the limelight, "cloud" made it big in quick time. Even the mainstream media
    was talking about the cloud in no time.


    Since 2011 we have seen a big cloud push from Oracle. The Oracle Cloud was announced
    at Oracle OpenWorld 2011, and we have since seen a vast range of cloud solutions
    being announced and delivered by Oracle. In 2013, Oracle went a step further and
    announced Oracle CloudWorld events across many cities worldwide.


    # Oracle Cloud Constituents


    Oracle defines its cloud as a "broad set of industry-standards based, integrated
    services that provide customers with subscription-based access to Oracle Platform
    Services, Application Services, and Social Services, all'
