  md: '# Java EE Applications on Oracle Cloud


    # Trial Signup


    You don''t have to invest another 400 USD to try out the Oracle Java Cloud with
    this book. Oracle offers a free 30-day trial of the Java Cloud, which will serve
    very well for this book. Click the Try It button on the Java Cloud page at https://cloud.oracle.com/
    to initiate the trial signup process. With one WebLogic Server instance, 1.5GB
    RAM Heap, adequate file storage 5GB of data transfer, unlimited users and applications,
    along with one schema (Oracle Database 11g Release 2), 1GB of storage, and 6GB
    data transfer, you get a pretty rich trial setup for your Java Cloud.


    If you already have an Oracle account, you''ll need to sign in. Otherwise, you
    will need to sign up for an Oracle account. You will need to fill out a few forms,
    and then your request will be put in "pending" until it is fulfilled. Note that
    trial approvals are not immediate and are based on availability and the number
    of requests being served at that moment.


    Once your setup is complete, Oracle will send an email to the account on file
    with your trial approval and login credentials for the trial setup.


    The email will provide service details for the Java Cloud Service, Database Cloud
    Service, Administration URL, and Identity Domain Details. You are provided temporary
    passwords that you are expected to reset on login.


    # My Services


    “My Services” page is like a dashboard for your Oracle Java Cloud. You can either
    bookmark the “MyServices Administration URL," which will be in the form https://myservices.<datacenter>.cloud.oracle.com/mycloud/?p=my_services
    in the approval email, or head over to https://cloud.oracle.com/., log in with
    your Oracle Single Sign On ID, and access My Services. In both cases, you will
    see a screen that includes the box shown in Figure 2-3. Note that the URL for
    the My Services page changes based on the data center associated with it.


    Click the link for the Java service and you will get an overview page shown in
    Figure 2-4, showing the current service status as well as information about start
    date, end date, sftp, and more. In the left panel you will find sections titled
    Overview, Administration, Metrics, and Associations.


