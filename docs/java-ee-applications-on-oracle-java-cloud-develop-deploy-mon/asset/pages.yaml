  md: '# Java EE Applications on Oracle Java Cloud


    # Private, Public, and Hybrid Clouds


    Although the cloud is usually thought of as a public, shared setup, a setup might
    not work in cases where there are serious security implications or where the applications
    would not work in a shared environment.


    In such cases, you can opt for private clouds, which work on pretty much the same
    lines as public clouds, but with exclusive access for a particular organization,
    with the consumers being the various business units within the organization. Private
    clouds are usually run in an internal data center or “premises.” However, that
    need not always be the case. A hybrid cloud is one that uses a mix of public and
    private clouds.


    An important aspect of the cloud that often gets ignored is the cloud''s great
    ability to provide a level playing field for software development companies and
    developers.


    # Cloud as a Leveler


    Today, we see that by using various cloud services, small companies can build
    and run enterprise-grade Java EE software that is as fast, secure, and reliable
    as any application built by the mega software companies. Similarly, the expertise
    of a single developer or someone working in a three-member company is pretty much
    the same as a developer in a mega corporation and working in a team of hundreds.
    This is an important reason for developers to look at adopting the cloud. The
    cloud has drastically leveled the playing field for software companies and developers.


