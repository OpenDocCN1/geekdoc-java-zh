  md: '# Chapter 5: JavaServer Pages, JSTL, and Expression Language 105


    In the Servlet code, note the instance variables created and where the HTML code
    ends up. This class is very much a Servlet, but it extends org.apache.jasper.runtime.HttpJsBase
    in this case, which in turn extends HttpServlet we discussed in the previous chapter.
    All the things we discussed in the previous chapter for Servlets work exactly
    the same way for a JSP; you just need to be aware and understand where your JSP
    code is appearing in the Servlet.


    You can open this code file in NetBeans (or any code editor); we will keep back
    to it to see how the changes we make to the JSP are reflected in the Servlet.


    Let’s now look at the JSP elements that provide dynamic content generation and
    the ability to write Java code as required.


    # JSP Directives


    Directives provide information to the JSP engine, affecting the translated Servlet
    code. The three types of directives are page, include, and taglib.


    # Page Directive


    The page directive provides information about the page. The first line in Listing
