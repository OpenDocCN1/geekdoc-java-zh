    # Java Editions


    Java has been around for a long time. Considering the pace at which technologies
    tend to get outdated, Java''s 18-year journey has been most remarkable and highlights
    the capabilities and the staying power of the technology.


    Java 1.0 was released in 1995, and back then, Java had no such as an enterprise
    edition. Only in 1999 was the idea of Java editions (Java SE and Java EE) introduced.
    Fast-forward to today, and we have three editions of Java:


    +   - Java Standard Edition (Java SE) Most Java ግን tend to think of Java SE as
    Java. However, Java SE as such is a software development platform that provides
    the Java language, the Java Virtual Machine (JVM), and development and deployment
    tools for building Java applications.


    +   - Java Enterprise Edition (Java EE) Java EE is what we encounter in this book.
    It was first introduced in 1999 as J2EE (or Java 2 Platform, Enterprise Edition).
    J2EE''s mission was to enable enterprises to build highly available, secure, reliable,
    scalable, multier, distributed applications. Each subsequent version sought to
    enhance these capabilities. The Enterprise Edition continued to be known as J2EE
    until J2EE 1.4, released in 2003. However, the naming convention changed in 2006,
    so what would have been J2EE 1.5 became Java EE 5. Java EE 6 was released in December
    2009, and Java EE 7 was in June 2013.


    +   - Java Micro Edition (Java ME) Java ME was the edition created to address
    the need for a slimmer version of Java that would work on the hardware constraints
    of devices such as mobile phones.'
