    +   - Synchronized blocks : Allows fine-grained control over synchronization.


    +   - Static synchronization : Applies to static methods.


    Inter-thread Communication (Cooperation) : Facilitates communication between threads.


    Examples include wait(), notify(), and notifyAll().'
