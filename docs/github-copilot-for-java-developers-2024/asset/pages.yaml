    \ is called with the argument x, and the result is returned.\n\nNow here's an\
    \ example of a higher-order function that returns a function:\n\n```\npublic class\
    \ HigherOrderExample {\n    public static void main (String [] args ) {\n    \
    \    Function<Integer, Function<Integer, Integer>> makePower = x -> (int) Math.pow(y,\
    \ x);\n        Function<Integer, Integer> square = makePower.apply( 2);\n    \
    \    int result = square.apply( 3);\n        System.out.println( result ); //Output:\
    \ 9\n    }\n}\n```\n\nIn this example, makePower is a higher-order function that\
    \ takes an integer x and returns a Function<Integer, Integer>. The returned function\
    \ is a lambda expression that takes an integer y and raises it to the power of\
    \ x using Math.pow.\n\nIn the main method, we call makePower.apply(2), which returns\
    \ a function that squares its argument (raises it to the power of 2). We store\
    \ this function in the square variable and then call square.apply(3) to get the\
    \ result 9."
