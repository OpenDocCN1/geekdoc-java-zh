- img_proc: true
  md: "Local Variables : Variables declared within a method, constructor, or block\
    \ are called local variables. They are accessible only within the block in which\
    \ they are declared.\n\n```\npublic void exampleMethod() {\n    int localVar =\
    \ 10; // localVar is a local variable\n}\n```\n\nInstance Variables (Non-Static\
    \ Fields): These variables are declared within a class but outside any method,\
    \ constructor, or block. They are instantiated when an object of the class is\
    \ created and exist as long as the object exists. Each object of the class has\
    \ its own copy of instance variables.\n\n```\npublic class ExampleClass {\n  \
    \  int instanceVar; // instanceVar is an instance variable\n}\n```\n\nClass Variables\
    \ (Static Fields): These are declared with the static keyword within a class but\
    \ outside any method, constructor, or block. They are shared among all instances\
    \ of the class and exist for the entire duration of the program's execution.\n\
    \n```\npublic class ExampleClass {\n    static int classVar; // classVar is a\
    \ class variable\n}\n```\n\nVariables in Java are strongly typed, which means\
    \ you must declare the type of data a a variable can hold. Additionally, Java\
    \ follows static typing, where the type of a variable is checked at compile time,\
    \ and dynamic binding, where the method to be invoked is decided at runtime based\
    \ on the object's type."
