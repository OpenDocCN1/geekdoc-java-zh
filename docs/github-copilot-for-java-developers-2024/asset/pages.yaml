  md: '# What is collection ?


    In computer programming, a collection is a grouping of data items that have some
    shared significance to the problem being solved and need to be operated upon together
    in some controlled fashion.


    e.g item collection, number collection, product collection etc


    # Types of collection


    +   - Sequential collections - The elements of a sequential collection are stored
    in a linear order. Examples of sequential collections include arrays, linked lists,
    and queues.


    +   - Associative collections - The elements of an associative collection are
    stored in a key-value format. Examples of associative collections include maps
    and hash tables.


    In Java, a collection is a group of individual objects represented as a single
    unit. The Java Collections Framework (java.util package) provides several classes
    and interfaces that implement different types of collections for storing and manipulating
    groups of objects.'
