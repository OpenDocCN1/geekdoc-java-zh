  md: '# java.util package


    Sequential collections


    Associative collections


    ![](img/986f008b1ca82036b11be9731c82f474_37_0.png)


    The Java Collections Framework consists of the following main components:


    Interfaces:


    +   - Collection (root interface): Represents a group of objects as a single unit.

    - List: Represents an ordered collection of elements that allows duplicates.

    - Set: Represents an unordered collection of unique elements.

    - Queue: Represents a collection designed for holding elements prior to processing.

    - Map (not a true collection): Represents a mapping between keys and values.


    Implementations:


    +   - ArrayList: An implementation of the List interface that uses a resizable-array
    data structure.'
