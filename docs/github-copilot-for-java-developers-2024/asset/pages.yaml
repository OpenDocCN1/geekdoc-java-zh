    # Streams in Java


    In Java, a Stream is a sequence of elements from a source that supports data operation
    methods that can be pipelined to obtain the desired result. Streams were introduced
    in Java 8 as part of the java.util.stream package. They are designed to make data
    operations more declarative and functional in nature.


    Key features of Streams in Java:


    Pipelining : Streams support pipelining, which means that multiple operations
    can be chained together in a single expression. This makes the code readable and
    concise.


    Laziness : Intermediate operations on a Stream are lazy, meaning they are not
    executed until a terminal operation is invoked. This allows for optimization and
    efficient use of memory.


    Immutable : Streams are immutable, meaning that once created, they cannot be modified.
    Any operation on a Stream produces a new Stream instance.


    Parallelization : Streams can be executed in parallel, which can significantly
    improve performance on modern multi-core systems.


    Reusability : Streams are consumed once they are used. If you need to perform
    the same operation multiple times, you need to create a new Stream instance.'
