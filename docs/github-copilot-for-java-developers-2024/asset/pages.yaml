  md: '# Types of thread pools


    01 Fixed thread pool

    A fixed thread pool has a fixed number of threads that are created on demand.
    The fixed thread pool is a good choice for applications that have a predictable
    workload


    02 Cached thread pool

    A cached thread pool creates new threads as needed and removes them when not needed.
    The cached thread pool is a good choice for applications that have varying workloads


    03 Scheduled thread pool\AS scheduled thread pool executes tasks at a specified
    delay. It is a good choice for applications that need to execute tasks on a regular
    basis


    Classes that can be used to create and manage thread pool


    +   * Executors: This class provides static methods for creating common types
    of thread pools.

    * ThreadPoolExecutor: This class provides a flexible way to create and manage
    thread pools.


    a. SingleThreadExecutor :


    Creates a thread pool with a single thread.

    Executes tasks sequentially (one after another).

    Syntax:


    ```

    ExecutorService executor = Executors.newSingleThreadExecutor();

    ```


    b. FixedThreadPool (n) :


    Maintains a fixed number of threads (specified by n).

    Tasks are executed concurrently by these threads.'
