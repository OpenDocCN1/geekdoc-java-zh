    \ a result or side-effect from a Stream. Examples includeEach(), collect(), reduce(),\
    \ count(), any-Match(), etc.\n\n**Short-circuiting Operations** : These are terminal\
    \ operations that allow computations on infinite streams to complete in finite\
    \ time. Examples-include findFirst(), findAny(), limit(), etc.\n\n```\nimport\
    \ java.util.Arrays;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\
