  md: 'Thread pools and executors are part of the java.util.concurrent package and
    provide a powerful and flexible way to manage and execute tasks concurrently.
    They help you create, schedule, and manage threads efficiently, reducing the overhead
    associated with creating and managing individual threads.


    # **Thread Pool:** A thread pool is a collection of worker threads that are pre-created
    and ready to execute tasks. Instead of creating a new thread for each task, you
    can submit tasks to the thread pool, and one of the available worker threads will
    be assigned to execute the task. When the task is completed, the worker thread
    goes back into the pool and becomes available for executing another task.


    Thread pools are useful because:They reduce the overhead of creating and tearing
    down threads for short-lived tasks.They provide a means of bounding the number
    of threads created, preventing resource exhaustion.They can help manage thread
    lifecycles more efficiently


    # Fixed Thread Pool example


    The fixed thread pool is created using Executors.newFixedThreadPool(n) where n
    is the number of threads you want in the pool.'
