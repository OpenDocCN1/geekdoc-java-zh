- img_proc: true
  md: 'LinkedList: An implementation of the List and Queue interfaces that uses a
    doubly-linked list data structure.


    HashSet: An implementation of the Set interface that uses a hash table for storage.


    TreeSet: An implementation of the Set interface that uses a tree for storage (sorted
    by elements).


    HashMap: An implementation of the Map interface that uses a hash table for storage.


    TreeMap: An implementation of the Map interface that uses a tree for storage (sorted
    by keys).


