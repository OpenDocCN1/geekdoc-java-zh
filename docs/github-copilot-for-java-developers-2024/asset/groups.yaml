    # Overview:


    Functional Programming is a programming paradigm that emphasizes treating computations
    as evaluating mathematical functions.


    In mathematics, a function relates an input set to an output set, and its output
    depends solely on its input. FP allows us to compose functions to create new ones,
    promoting code modularity and expressiveness.


    # Lambda Calculus:


    In the 1930s, mathematician Alonzo Church developed lambda calculus , a formal
    system for expressing computations based on function abstraction.


    Lambda calculus significantly influenced the theory of programming languages and
    functional programming.


    Functional programming languages often implement lambda calculus concepts.


    # Categorization of Programming Paradigms:


    Programming paradigms can be broadly categorized into:


    Imperative : Programs as sequences of statements that change state.


    Declarative : Expresses logic without specifying control flow.


    FP is a subset of declarative programming.


    # Categorization of Programming Languages:


    Based on functional programming support:


    Pure Functional Languages (e.g., Haskell): Allow only pure functional programs.


    Functional Languages (e.g., Scala, Clojure): Support functional programming alongside
    other paradigms.'
