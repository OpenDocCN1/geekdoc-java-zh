    \n# Multithreading in Java\n\n### What is Multithreading?\n\nMultithreading is\
    \ a Java feature that allows concurrent execution of two or more parts of a program.\
    \ Each part of the program is called a thread.\n\nThreads are lightweight processes\
    \ within a single process.\nThe goal is to maximize CPU utilization by running\
    \ multiple threads simultaneously.\n\n## Creating Threads:\n\nThreads can be created\
    \ using two mechanisms:\n\n- Extending the Thread class:\n    - We create a class\
    \ that extends java.lang.Thread.\n    - Override the run() method in this class.\n\
    \    - A thread begins its life inside the run() method.\n    - Create an object\
    \ of our new class and call start() to begin thread execution.\n\nExample:\n\n\
    ```java\nclass MultithreadingDemo extends Thread {\n    public void run() {\n\
    \        System.out.println(\"Thread \" + Thread.currentThread().getId() + \"\
    \ is running\");\n    }\n}\n\npublic class Multithreaded {\n    public static\
    \ void main(String[] args) {\n        int n = 8;\n        for (int i = 0; i <\
    \ n; i++) {\n            MultithreadingDemo object = new MultithreadingDemo();\n\
    \            object.start();\n        }\n    }\n}\n```\n\n## Implementing the\
    \ Runnable interface :\n\n- Create a new class that implements java.lang.Runnable.\n\
    - Override the run() method in this class.\n- Instantiate a Thread object and\
    \ call start() on it.\n\nExample:\n\n```java\nclass MultithreadingDemo implements\
    \ Runnable {\n    public void run() {\n        System.out.println(\"Thread \"\
    \ + Thread.currentThread().getId() + \" is running\");\n    }\n}\n\npublic class\
    \ Multithread {\n    public static void main(String[] args) {\n        int n =\
    \ 8;\n        for (int i = 0; i < n; i++) {\n            Thread object = new Thread(new\
    \ MultithreadingDemo());\n            object.start();\n        }\n    }\n}\n```\n\
    \n## Thread Class vs. Runnable Interface:\n\nExtending Thread:\n- Cannot extend\
    \ any other class due to Java's lack of multiple inheritance.\n- Provides inbuilt\
    \ methods like yield(), interrupt(), etc.\n\nImplementing Runnable:\n- Allows\
    \ extending other base classes.\n- Provides a shared object that can be used by\
    \ multiple threads.\n\n## Advantages of Multithreading:\n\n- Concurrency: Multiple\
    \ threads execute concurrently.\n- Memory Efficiency: Threads share memory, saving\
    \ memory space.\n- Faster Context Switching: Switching between threads is faster\
    \ than processes.\n\nRemember, multithreading is essential for efficient utilization\
    \ of system resources and responsive applications!\n\nExamples using GitHub Copilot\n\
    \n### Creating Thread using extending thread class using asking GitHub Copilot\
    \ in chat\n\n![](img/986f008b1ca82036b11be9731c82f474_84_0.png)\n\nThen in the\
    \ next screenshot you use start method to start the thread\n\n![](img/986f008b1ca82036b11be9731c82f474_85_0.png)\n\
    \nLet's ask the follow up question as highlighted below\n\nAnd the answer by Github\
    \ Copilot is as below\n\nIn Java, you cannot directly pass parameters to the run\
    \ method of a Thread because it's a method defined in the Thread class without\
    \ any parameters. However, you can pass parameters to the Thread by passing them\
    \ to the constructor of your class that extends Thread and then using those parameters\
    \ in your run method. Here's how you can do it:\n\nFirst, modify your MyThread\
    \ class to include a constructor that accepts the parameters you want to pass.\
    \ Store these parameters as instance variables, and then use them in your run\
    \ method.\n\n```java\npackage org.example.multithreading;\n\nclass MyThread extends\
    \ Thread {\n    private int param;\n\n    public MyThread(int param) {\n     \
    \   this.param = param;\n    }\n\n    @Override\n    public void run() {\n   \
    \     for (int i = 0; i < this.param; i++) {\n            System.out.println(Thread.currentThread().getId()\
    \ + \" Value: \" + i);\n        }\n    }\n}\n```\n\nHow can I handle exceptions\
    \ in the `run` method of the `Thread` class?\n\nThen, when you create a new instance\
    \ of MyThread, pass the parameter to the constructor.\n\n```java\npackage org.example.multithreading;\n\
    \npublic class ThreadExampleUsingThreadClass {\n    public static void main(String[]\
    \ args) {\n        MyThread t1 = new MyThread(5);\n        t1.start();\n\n   \
    \     MyThread t2 = new MyThread(7);\n        t2.start();\n    }\n}\n```\n\nIn\
    \ this example, 5 and 7 are the parameters passed to the MyThread instances t1\
    \ and t2 respectively. These values are then used in the run method of each thread.\n\
    \n- Using T1 Reference\n- How can I handle exceptions in the `run` method of the\
    \ `Thread` class?\n"
