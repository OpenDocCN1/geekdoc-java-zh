    \ 实现了 `NavigableSet` 接口，该接口扩展了 `SortedSet` 接口。此扩展提供了额外的方法，用于根据顺序从集合中导航和检索元素。\n\
    \n**自定义比较器**：在创建 TreeSet 时，你可以提供一个自定义的 `Comparator` 来定义元素的排序顺序。如果没有提供 `Comparator`，元素必须实现\
    \ `Comparable` 接口以定义它们的自然顺序。\n\n总而言之，TreeSet 结合了排序、唯一性和高效性能的优点，使其成为 Java 中管理元素集合的价值工具！\n\
