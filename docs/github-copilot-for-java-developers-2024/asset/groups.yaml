  mdcn: "\n\n# TreeMap\n\n在 Java 中，TreeMap 是 Map 接口的一种实现，是 Java 集合框架的一部分。它是一个排序映射，根据键（key）的升序存储其键值对。TreeMap\
    \ 中的键必须实现 `Comparable` 接口，或者在创建时提供自定义的 `Comparator`。\n\n关于 TreeMap 的关键点有：\n\n\
    ### 排序键：\nTreeMap 根据键的自然顺序或自定义的 `Comparator` 以排序顺序存储其键值对。\n\n当你遍历 map 中的条目（entries）时，它们将按照键的排序顺序被检索。\n\
    \n### 键值对：\n与其他的 Map 实现一样，TreeMap 以键值对的形式存储数据。map 中的每个键都关联着一个值，并使用键来访问其对应的值。\n\
    \n### 唯一键：\n在 TreeMap 中，键必须是唯一的。如果你尝试插入一个重复的键，它将替换与现有键关联的值。\n\n### 空键和空值：\nTreeMap\
    \ 不允许 null 键，但它可以有多个 null 空值。如果你尝试添加 null 键，它将抛出 `NullPointerException`。\n\n###\
    \ 非同步：\n默认情况下，TreeMap 不是线程安全的。在多线程环境中，请考虑对它的访问进行同步，或者使用如 `ConcurrentSkipListMap`\
    \ 等线程安全的替代方案。\n\n### 性能：\nTreeMap 为 `get()`、`put()` 和 `remove()` 等基本操作提供了对数时间复杂度\
    \ (O(log n))。然而，如果你需要按排序遍历条目，它提供了常数级性能。\n\n### 实现 NavigableMap 接口：\nTreeMap 实现了\
    \ `NavigableMap` 接口，该接口扩展了 `SortedMap` 接口。它提供了额外的方法，用于根据顺序从 map 中导航和检索条目。\n\n\
    ### Comparator：\n你可以在创建 TreeMap 时提供一个自定义的 `Comparator` 来定义键的排序顺序。如果没有提供 `Comparator`，则键必须实现\
    \ `Comparable` 接口。\n\n### TreeMap\n- java.util 包\n- 实现了 `NavigableMap` 接口，并是 SortedMap\
    \ 层次结构的一部分\n- 以排序的方式表示键值对集合\n- 每个键都关联一个对应的值\n- 使用红黑树数据结构存储其条目\n\n# 遍历 LinkedHashMap\n\
    \n### 创建 LinkedHashMap：\n```java\nTreeMap<String, Integer> scoreMap = new TreeMap<>();\n\
    ```\n\n### 添加键值对\n```java\nscoreMap.put('Alice', 90);\nscoreMap.put('Bob', 87);\n\
    scoreMap.put('Charlie', 80);\n```\n\n### 按键访问值：\n```java\nint score = scoreMap.get('Alice');\
    \ // 90\n```\n\n### 键值对：\n```java\nscoreMap.remove('Bob');\n```\n\n### TreeMap\
    \ 方法：\nTreeMap 提供了与其他类相似的方法，用于处理和操作 map。此外，它还提供了获取第一个键和最后一个键的方法，以及查找键大于或等于给定键的条目（ceilingEntry）等更多方法。\n\
    \n```java\nfor (String name : scoreMap.keySet()) {\n    int score = scoreMap.get(name);\n\
    \    System.out.println(name + \": \" + score);\n}\n```\n\n让我们来看一个使用 GitHub Copilot\
    \ 的示例。按照下方截图所示提问，如果你没问题，点击插入代码按钮，你的代码就准备就绪了\n\n```java\nimport java.util.TreeMap;\n\
