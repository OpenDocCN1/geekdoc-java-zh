    \n# Java 中的多线程\n\n### 什么是多线程？\n\n多线程是 Java 的一项特性，允许程序的两个或多个部分并发执行。程序的每个部分都被称为一个线程。\n\
    \n线程是单个进程内的轻量级进程。\n目标是通过同时运行多个线程来最大化 CPU 利用率。\n\n## 创建线程：\n\n可以使用两种机制创建线程：\n\n\
