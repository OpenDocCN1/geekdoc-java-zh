    \ 接口）或根据创建时提供的自定义 `Comparator` 进行排列。\n\n**唯一元素**：与其他 `Set` 实现一样，TreeSet 确保不允许重复元素。如果你尝试添加一个已经存在于集合中的元素，它将被忽略。\n\
