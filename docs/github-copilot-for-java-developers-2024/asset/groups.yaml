    \n- **Static Method Reference**: Syntax: ClassName::staticMethodName Example:\
    \ Integer::parseInt (equivalent to x -> Integer.parseInt(x))\n- **Instance Method\
    \ Reference on a Particular Object**: Syntax: objectReference::instanceMethodName\
    \ Example: str::length (for a String str, equivalent to x -> x.length())\n- **Instance\
    \ Method Reference on an Object of a Particular Type**: Syntax: ClassName::instanceMethodName\
    \ Example: String::length (equivalent to x -> x.length())\n- **Constructor Reference**:\
    \ Syntax: ClassName::new Example: Array::new (equivalent to () -> new ArrayList<>())\n\
    \n```java\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\
