    \ of Throwable except RuntimeException and Error.\nChecked at compile-time.\n\
    Examples: IOException, SQLException.\n\n### Unchecked Exceptions:\nSubclasses\
    \ of RuntimeException.\nNot checked at compile-time; detected at runtime.\nExamples:\
    \ ArithmeticException, NullPointerException.\n\n### Exception Handling Keywords:\n\
    - try...catch block: Used to catch exceptions and handle them.\n- finally block:\
    \ Executes regardless of whether an exception occurs or not.\n- throw keyword:\
    \ Explicitly throws an exception.\n- throws keyword: Declares that a method may\
