  - '[PAGE 62]


    # Key points about HashMap :


    # Key-Value Pairs :


    HashMap stores data in the form of key-value pairs.


    Each key in the map is associated with a value, and keys are used to access their
    corresponding values.


    # Unique Keys :


    In a HashMap, the keys must be unique.


    If you try to insert a duplicate key, it will replace the value associated with
    the existing key.


    # Null Keys and Values :


    HashMap allows at most one null key, but it can have multiple null values.


    If you try to add a second null key, it will replace the value associated with
    the existing null key.


    # Unordered Collection :


    HashMap does not maintain any specific order of its elements.


    The elements are stored based on their hash codes, and the iteration order is
    not guaranteed to be the same across different iterations.


    # Non-Synchronized :


    By default, HashMap is not thread-safe.


    In a multi-threaded environment, consider synchronizing access to it or using
    a thread-safe alternative like ConcurrentHashMap.


    # Performance :


    HashMap provides constant-time performance (O(1)) for basic operations like get(),
    put(), and remove() in the average case.


    This assumes a good hash function and proper load factor management.'
