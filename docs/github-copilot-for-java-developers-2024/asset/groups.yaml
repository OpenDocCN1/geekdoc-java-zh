    \ run() {\n        t.printTable(5);\n    }\n}\n```\n\n```java\nclass MyThread2\
    \ extends Thread {\n    Table t;\n    MyThread2(Table t) {\n        this.t = t;\n\
    \    }\n    public void run() {\n        t.printTable(100);\n    }\n}\n```\n\n\
    ```java\npublic class TestSynchronization1 {\n    public static void main(String[]\
