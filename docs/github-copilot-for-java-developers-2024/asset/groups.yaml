    \n**定义：**\n\n函数式接口是一个精确包含**一个未实现方法**的接口。\n它也可以包含任意数量的**默认方法**（带有实现的方法）和**静态方法**。\n\
    \n![](img/986f008b1ca82036b11be9731c82f474_115_0.png)\n\n单个抽象方法是函数式接口的核心特征。\n\n\
