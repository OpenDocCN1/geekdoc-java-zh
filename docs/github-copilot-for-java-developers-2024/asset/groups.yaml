    \nThe single abstract method is the core feature of a functional interface.\n\n\
    ## Purpose :\n\nFunctional interfaces are designed to facilitate the use of lambda\
    \ expressions and method references.\n\nThey allow you to represent a piece of\
    \ code (a function) as an instance of an interface.\n\n## Lambda Expressions and\
    \ Functional Interfaces :\n\nStarting from Java 8, you can use lambda expressions\
