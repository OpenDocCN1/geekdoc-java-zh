    In a TreeMap , the keys must be unique . If you try to insert a duplicate key,
    it will replace the value associated with the existing key.


    # Null Keys and Values :


    TreeMap does not allow null keys , but it can have multiple null values . If you
    try to add a null key, it will throw a NullPointerException .


    # Non-Synchronized :


    By default, TreeMap is not thread-safe . In a multi-threaded environment, consider
    synchronizing access to it or using a thread-safe alternative like ConcurrentSkipListMap
    .


    # Performance :


    TreeMap provides logarithmic time complexity (O(log n)) for basic operations like
    get(), put() , and remove() . However, if you need to iterate over the entries
    in sorted order, it provides constant-time performance .'
