    ## 用于 Java 的 GitHub Copilot 和 Spring Boot 基础\n\n![](img/986f008b1ca82036b11be9731c82f474_91_0.png)\n\
    \n## Java 中的同步\n\n**Java 中的同步（Synchronization in Java）** 是多线程环境中管理共享资源并发访问的关键概念。\n\
    让我们探索它的含义：\n\n### 同步的目的：\n\n同步的目标是确保一次只有一个线程可以访问共享资源（如变量、对象或方法）。\n\n通过防止多个线程同时修改相同的数据，同步有助于避免数据损坏并确保结果的一致性。\n\
    \n## 同步的类型：\n\n在 Java 中，主要有两种类型的同步：\n\n- 进程同步：处理跨不同进程的同步。\n- 线程同步：侧重于单个进程内部的同步（线程之间）。\n\
    \n## 线程同步：\n\n在线程同步中，我们有两个主要概念：\n\n- 互斥（Mutual Exclusion）：确保线程在共享数据时互不干扰。\n\n\
    通过以下方式实现：\n\n- 同步方法（Synchronized methods）：锁定共享资源的对象。\n- 同步块（Synchronized blocks）：允许对同步进行细粒控制。\n\
    - 静态同步：适用于静态方法。\n\n线程间通信（协作）：促进线程之间的通信。\n\n示例包括 wait(), notify(), 和 notifyAll()。\n\
    \n## Java 中锁（Lock）的概念：\n\n同步围绕着一个名为锁（lock）或监视器（monitor）的内部实体展开。Java 中的每个对象都有关联的锁。\n\
    \n线程在访问其字段之前必须获取对象的锁，并在之后释放——\n\nJava 5 引入了 java.util.concurrent.locks 包，并带有各种锁实现。\n\
    \n没有同步的示例：\n\n考虑以下没有同步的示例：\n\n```java\nclass Table {\n    void printTable(int\
    \ n) {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(n\
    \ * i);\n            try {\n                Thread.sleep(400);\n            }\
    \ catch (Exception e) {\n                System.out.println(e);\n            }\n\
    \        }\n    }\n}\n\nclass MyThread1 extends Thread {\n    Table t;\n\n   \
    \ MyThread1(Table t) {\n        this.t = t;\n    }\n    public void run() {\n\
    \        t.printTable(5);\n    }\n}\n```\n\n```java\nclass MyThread2 extends Thread\
    \ {\n    Table t;\n    MyThread2(Table t) {\n        this.t = t;\n    }\n    public\
    \ void run() {\n        t.printTable(100);\n    }\n}\n```\n\n```java\npublic class\
    \ TestSynchronization1 {\n    public static void main(String[] args) {\n     \
    \   Table obj = new Table();\n        MyThread1 t1 = new MyThread1(obj);\n   \
    \     MyThread2 t2 = new MyThread2(obj);\n        t1.start();\n        t2.start();\n\
    \    }\n}\n```\n\n```\n输出（由于缺少同步导致不一致）：\n5\n100\n10\n200\n15\n300\n20\n400\n25\n\
    500\n```\n\n## Java 同步方法：\n\n当你将一个方法声明为 `synchronized` 时，它就了一个同步方法。\n\n线程在调用同步方法时会自动获取对象的锁。\n\
    \n当线程完成其任务时，释放锁。\n\n## 示例：\n\n```java\nclass Table {\n    synchronized void printTable(int\
    \ n) {\n        // 同步方法\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(n\
    \ * i);\n            try {\n                Thread.sleep(400);\n            }\
    \ catch (Exception e) {\n                System.out.println(e);\n            }\n\
    \        }\n    }\n}\n```\n\n记住，同步确保了线程安全并防止了多线程应用中的数据不一致。\n\n练习：尝试使用 GitHub copilot\
