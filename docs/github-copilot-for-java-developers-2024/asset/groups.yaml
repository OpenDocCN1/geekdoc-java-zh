    \        System.out.println(\"Enter second number: \");\n        int num2 = scanner.nextInt();\n\
    \        try {\n            int result = num1 / num2;\n            System.out.println(\"\
    Result: \" + result);\n        } catch (ArithmeticException e) {\n           \
    \ System.out.println(\"不能除以零\");\n        } catch (InputMismatchException e) {\n\
    \            System.out.println(\"无效无效\");\n        }\n    }\n}\n```\n\n使用 GitHub\
