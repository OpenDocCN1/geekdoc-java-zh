    \                System.out.println(\"thread2: \" + counter.get());\n        \
    \    }\n        });\n\n        thread1.start();\n        thread2.start();\n  \
    \  }\n}\n```\n\n## Executor Framework in Java\n\nCertainly! Let's dive into the\
    \ Java Executor Framework, a powerful tool for managing concurrent tasks efficiently:\n\
    \n### What is the Java Executor Framework?\n\n**The Java Executor Framework**\
    \ is part of the java.util.concurrent package.\n\nIt provides a way to manage\
    \ and execute tasks concurrently without creating new threads every time.\n\n\
    By using thread pools, it reuses existing threads, improving performance and resource\
    \ utilization.\n\n## Why Use Executor Framework?\n\nWith the increasing number\
    \ of processor cores, multithreading is essential for achieving higher throughput.\n\
    \nThe Executor Framework simplifies thread management and allows developers to\
    \ focus on business logic.\n\n## Types of Executors:\n\nLet's explore some common\
    \ types of executors:\n\n### Types of thread pools\n\n- Fixed thread pool: A fixed\
    \ thread pool has a fixed number of threads that are created on demand. The fixed\
    \ thread pool is a good choice for applications that have predictable workload.\n\
    - Cached thread pool: A cached thread pool creates threads as needed and removes\
    \ them when not needed. The cached thread pool is a good choice for applications\
    \ that have varying workloads.\n- Scheduled thread pool: Scheduled thread pool\
    \ executes tasks at a specified delay. It is a good choice for applications that\
    \ need to execute tasks on regular basis.\n\n### Classes that can be used to create\
    \ thread pool\n\n- Executors: This class provides static methods for creating\
    \ common types of thread pools.\n- ThreadPoolExecutor: This class provides a flexible\
    \ way to create and manage thread pools.\n\n#### SingleThreadExecutor:\nCreates\
    \ a thread pool with a single thread. Executes tasks sequentially (one after another).\n\
    Syntax:\n```java\nExecutorService executor = Executors.newSingleThreadExecutor();\n\
    ```\n\n#### FixedThreadPool (n):\nMaintains a fixed number of threads (specified\
    \ by n). Tasks are executed concurrently by these threads. Excess tasks are stored\
    \ in a queue.\nSyntax:\n```java\nExecutorService fixedThreadPool = Executors.newFixedThreadPool(2);\n\
    ```\n\n#### CachedThreadPool\nCreates threads as needed and reuses existing ones.\
    \ If no thread is available, a new one is created. Uses a SynchronousQueue.\n\
    Syntax:\n```java\nExecutorService executorService = Executors.newCachedThreadPool();\n\
    ```\n\n#### ScheduledExecutor\nUsed for tasks that run at regular intervals or\
    \ with delays. Based on the ScheduledExecutorService interface. Two scheduling\
    \ methods:\n- scheduleAtFixedRate: Executes tasks with a fixed interval.\n- scheduleWithFixedDelay:\
    \ Starts the delay countdown after the current task completes.\nSyntax:\n```java\n\
    ScheduledExecutorService scheduledExecService = Executors.newScheduledThreadPool(1);\n\
    ```\n\n## Example Usage\n\nSuppose we have a task class MyTask:\n\n```java\nclass\
    \ MyTask implements Runnable {\n    public void run() {\n        // Task logic\
    \ here\n        System.out.println(\"Task executed by thread \" + Thread.currentThread().getId());\n\
    \    }\n}\n```\n"
