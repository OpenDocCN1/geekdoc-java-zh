    \ main(String[] args) {\n        // create an integer variable and assign a value\n\
    \        int number = 5;\n    }\n}\n```\n\nAnother example is to get the size\
    \ of variable in memory in terms of byte\n\nJust after the variable declaration\
    \ put a comment // bytes , then you will get information about byte size of the\
    \ variable as per below example\n\n```java\npublic class Main {\n    public static\
    \ void main(String[] args) {\n        // create an integer variable a and assign\
    \ a value\n        int a = 5; // bytes = 4, range = -2,147,483,648 to 2,147,483,647\n\
    \n        // create a double variable and assign a value\n        double b = 5.5;\
