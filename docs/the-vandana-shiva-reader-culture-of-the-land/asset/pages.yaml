- img_proc: true
  md: 'The creation boundary does to knowledge what the production boundary does to
    work: it excludes the creative contributions of women as well as third world peasants
    and tribespeople and views them as being engaged in unthinking, repetitive biological
    processes. The separation of production from reproduction and the characterization
    of the former as economic and the latter as biological are some of the underlying
    assumptions that are treated as natural even though they have been socially and
    politically constructed.


    This patriarchal shift in the creation boundary is misplaced for many reasons.
    First, the assumption that male activity is true creation because it takes place
    ex nihilo is ecologically false. No technological artifact or industrial commodity
    is formed out of nothing; no industrial process takes place where nothing was
    before. Nature and its creativity as well as people’s social labor are consumed
    at every level of industrial production as raw material or energy. The biotech
    seed that is treated as a creation to be protected by patents could not exist
    without the farmer’s seed. The assumption that only industrial production is truly
    creative because it produces from nothing hides the ecological destruction that
    goes with it. The patriarchal creation boundary allows ecological destruction
    to be perceived as creation, and ecological regeneration as underlying the breakdown
    of ecological cycles and the crisis of sustainability. To sustain life means,
    above all, to regenerate life; but according to the patriarchal view, to regenerate
    is not to create, it is merely to repeat.


    Such a definition of creativity is also false because it fails to see that women’s
    subsistence producers’ work go into childaring and cultivation, both of which
    conserve regenerative capacity.


    The assumption of creation as the reduction of novelty is also false; regeneration
    is not merely repetition. It involves diversity, while engineering produces uniformity.
    Regeneration, in fact, how diversity is produced and renewed. While no industrial
    process takes place out of nothing, the creation myth of patriarchy is particularly
    unfounded in the case of biotechnologies, where life-forms are the raw material
    for industrial production.'
