  md: 'The polycultures of ecological agricultural systems have evolved because more
    output can be harvested from a given area planted with diverse crops than from
    an equivalent area consisting of separate patches of monocultures. For example,
    in plantings of sorghum and pigeon pea mixtures, one hectare will produce the
    same yields as 0.94 hectares of sorghum monoculture and 0.68 hectares of pigeon
    pea monoculture. Thus one hectare of polyculture produces what 1.62 hectares of
    monoculture can produce. This is called the land-equivalent ratio (LER).


    Increased land-use efficiency and higher LER have been reported for polycultures
    of millet/groundnut (1.26); maize/bean (1.38); millet/sorghum (1.53); maize/pigeon
    pea (1.85); maize/cocoyan/sweet potato (2.08); cassava/maize/groundnut (>2.51).
    The monocultures of the Green Revolution actually reduced the food yields per
    acre achieved through mixtures of diverse crops. This shows the fallacy of the
    argument often made that chemically intensive agriculture and genetic engineering
    will save biodiversity by releasing land from food production. In fact, since
    monocultures require more land, biodiversity is destroyed twice over—once on the
    farm, and then on the additional acreage required to produce the outputs a monoculture
    has displaced. Further, since chemicals kill diverse species, chemical agriculture
    can hardly be promoted as conserving biodiversity.


    Not only is the productivity measure distorted by ignoring resource inputs and
    focusing only on labor, but it is also distorted by looking only a single and
    partial output rather than the total output. A myth promoted by the one-dimensional
    monoculture paradigm is that biodiversity reduces yields and productivity, monocultures
    increase yields and productivity. However, since yields and productivity are theoretically
    constructed terms, they change according to the context. “Yield” usually refers
    to production per unit area of a single crop. Planting one crop in the entire
    field as a monoculture will increase its yield. Planting multiple crops in a mixture
    will have low yields of individual crops but will have high total output of food.


