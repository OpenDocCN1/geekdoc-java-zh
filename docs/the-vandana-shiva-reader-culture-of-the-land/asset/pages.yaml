    Herbicide tolerant, or Roundup Ready, crops were supposed to control weeds, and
    Bt crops were intended to control pests. Instead of controlling weeds and pests,
    GE crops have led to the emergence of superweeds and superspecies. In the United
    States, Roundup Ready crops have produced weeds resistant to Roundup. Approximately
    15 million acres are now overtaken by superweeds, and in an attempt to kill these
    weeds, farmers have paid $12 per acre by Monsanto to spray more lethal herbicides
    such as Agent Orange, which was used during the Vietnam War.


    In India, Bt cotton, under the trade name Bollard, was supposed to control the
    bollworm pest. Today, the bollworm has become resistant to Bt cotton, and now
    Monsanto is selling Bollard II, with two additional toxic genes in it. New pests
    have emerged, and farmers are using more pesticides. Studies carried by Navanya
    and the Research Foundation for Science, Technology and Ecology have shown that
    pesticide use in Vidarbha in Maharashtra has increased threefold after the introduction
    of Bt cotton.


