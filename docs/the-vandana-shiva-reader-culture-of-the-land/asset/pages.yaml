  md: '# 1


    # # The Gendered Politics of Food


    Let them come and see men and women and children who know how to live, whose joy
    of life has not yet been killed by those who claimed to teach other nations how
    to live.


    > —Chinua Achebe


    The Age of Enlightenment, and the theory of progress to which it gave rise, was
    centered on the sacredness of two categories: modern scientific knowledge and
    economic development. Somewhere along the way, the unbridled pursuit of progress,
    guided by science and development, began to destroy life without any assessment
    of how much of the diversity of life on this planet is disappearing—and how fast.
    The act of living, celebrating and conserving life in all its diversity—in people
    and in nature—seems to have been sacrificed to progress, and the sanctity of life
    has been substituted by the sanctity of science and development.


    Throughout the world, a new questioning is growing, rooted in the experience of
    those for whom the spread of what was called “enlightenment” has been the spread
    of darkness, the extinction of life and life-enhancing processes. A new awareness
    is growing that is is questioning the sanctity of science and development and
    revealing that these are not universal categories of progress but the special
    projects of modern Western patriarchy. I have been involved with women’s struggles
    for survival in India over the last decade. My work is informed by both the'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'suffering and the insights of those who struggle to sustain and conserve life,
    and whose struggles question the meaning of a progress, a science, a development
    that destroys life and threatens survival.


    The death of nature is central to this threat to survival. The earth is rapidly
    dying; its forests are dying, its soils are dying, its waters are dying, its air
    is dying. Tropical forests, the creators of the world’s climate, the cradle of
    the world’s vegetational wealth, are being bulldozed, burned, ruined, or submerged.
    In 1950, just over 100 million hectares of forests had been cleared—by1975, this
    figure had more than doubled. During 1975, at least 120 million hectares of tropical
    forests were destroyed in South and Southeast Asia alone; by the end of the century,
    another 270 million could be. Central America and Amazonia, cattle ranching for
    beef production is claiming at least 2.5 million hectares of forests each year;
    in India 1.3 million hectares of forests are lost every year to commercial plantation
    crops, river valley projects, mining projects, and so on. Each year, 12 million
    hectares of forests are being eliminated from the face of the earth. At current
    rates of destruction, by the year 2050 all tropical forests will have disappeared,
    and with tropical forests will disappear the diversity of life they support.


    Up to 50 percent of all living things—at least 5 million species—are estimated
    to live in tropical forests. A typical four-square-mile patch of rainforest contains
    up to 1,500 species of flowering plants, 750 species of trees, 125 of mammals,
    400 of birds, 160 of reptiles, 50 of amphibians, and 150 of butterflies. The unparalleled
    diversity of species within tropical forests means relatively few individuals
    of each; any forest clearance disrupts their life cycles and threatens them with
    rapid extinction. Current estimates suggest that we are losing one species of
    life a day from the 5–10 million believed to exist. If present trends continue,
    we can expect an annual rate of loss as high as 50,000 species by the year 2000.
    In India alone, there exist 7,000 species of plant life not found elsewhere in
    the world; the destruction of the country’s natural forests implies the disappearance
    of this rich diversity of animal and plant life.


    Forests are the matrix of rivers and water sources, and their destruction in tropical
    regions amounts to the desiccation and desertification of land. Every year 12
    million hectares of land deteriorate into deserts and are'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'unable to support vegetation or produce food. Sometimes land is laid waste
    through desertification, at other times through ill-conceived land use, which
    destroys the fertility of fragile tropical soils. Desertification in the Sahel
    in Africa has already killed millions of people and animals. Globally, 456 million
    people today are starving or malnourished because of the desertification of croplands.
    Most agricultural lands cropped intensively with Green Revolution techniques are
    either waterlogged or desiccicated deserts. Nearly 7 million hectares of land
    in India under irrigation have already gone out of production due to severe salinity,
    and an additional 6 million hectares have been seriously affected by waterlogging.
    Green Revolution agriculture has decreased genetic diversity and increased the
    vulnerability of crops to failure by lowering resistance to drought and pests.


    With the destruction of forests, water, and land, we are losing our lifesupport
    systems. This destruction is taking place in the name of “development” and progress,
    but there must be something seriously wrong with a concept of progress that threatens
    survival itself. The violence to nature, which seems intrinsic to the dominant
    development model, is also associated with violence to women who depend on nature
    for drawing sustenance for themselves, their families, their societies. This violence
    against nature and women is built into the very mode of perceiving both forms
    the basis of the current development paradigm. My work is an attempt to articulate
    how rural Indian women, who are still embedded in nature, experience and perceive
    ecological destruction and its causes, and how they have conceived and initiated
    processes to arrest the destruction of nature and begin its regeneration. From
    the diverse and specific grounds of the experience of ecological destruction arise
    common identification of its causes in the developmental process and the view
    of nature with which it is legitimized. I focus on science and development as
    patriarchal projects, not as a denial of other sources of patriarchy, such as
    religion, but because they are thought to be class, culture, and gender neutral.


    Seen from the experiences of third world women, the modes of thinking and action
    that pass for science and development are not universal and humanly inclusive,
    as they are made out to be; modern science and development are projects of male,
    Western origin, both historically and'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'ideologically. They are the latest and most brutal expression of a patriarchal
    ideology that is threatening to annihilate nature and the entire human species.
    The rise of a patriarchal science of nature took place in Europe during the same
    period as the closely related industrial revolution, which laid the foundations
    of a patriarchal mode of economic development in industrial capitalism. Contemporary
    science and development conserve the ideological roots and biases of the scientific
    and industrial revolutions even as they unfold into new areas of activity and
    new domains of subjugation.


    The scientific revolution in Europe transformed nature from *terra materia* into
    a machine and a source of raw material; with this transformation it removed all
    ethical and cognitive constraints against its violation and exploitation. The
    industrial revolution converted economics from the prudent management of resources
    for sustenance and basic needs’ satisfaction into a process of commodity production
    for profit maximization. Industrialism created a limitless appetite for resource
    exploitation, modern science provided the ethical and cognitive license to make
    such exploitation possible, acceptable—and desirable. The new relationship of
    man’s dominance and mastery over nature was thus also associated with new patterns
    of domination and mastery over women, and their exclusion from participation *as
    partners* in both science and development.


    Contemporary development activity in the third world superimposes the scientific
    and economic paradigms created by Western, gender-based ideology on communities
    in other cultures. Ecological destruction and the marginalization of women, we
    know now, have been the inevitable results of most development programs and projects
    based on such paradigms; they violate the integrity of one and destroy the productivity
    of the other. Women, as victims of the violence of patriarchal forms of development,
    have risen against them to protect nature and preserve their survival and sustenance.
    Indian women have been in the forefront of ecological struggles to conserve forests,
    land, and water. They have challenged the Western concept of nature as an object
    of exploitation and have protected it as Prakriti, the living force that supports
    life. They have challenged the Western concept of economics as production of profits
    and capital accumulation with their own concept of economics as production of'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'sustenance and needs satisfaction. A science that does not respect nature’s
    needs and a development that does not respect people’s needs inevitably threaten
    survival. In their fight to survive the onslaughts of both, women have begun a
    struggle that challenges the most fundamental categories of Western patriarchy—its
    concepts of nature and women and of science and development. Their ecological
    struggle in India is aimed simultaneously liberating nature from ceaseless exploitation
    and themselves from limitless marginalization. They are creating a feminist ideology
    that transcends gender, and a political practice that is humanly inclusive; they
    are challenging patriarchal’s ideological claim to universalism—not with another
    universalizing tendency but with diversity; and they are challenging the dominant
    concept of power as violence with the alternative concept of nonviolence as power.


    The everyday struggles of women for the protection of nature take place in the
    cognitive and ethical context of the categories of the ancient Indian worldview
    in which nature is Prakriti, a living and creative process, the feminine principle
