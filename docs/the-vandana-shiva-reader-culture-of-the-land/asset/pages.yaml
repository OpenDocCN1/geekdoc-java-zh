  md: '# 11


    # Food and Water


    Food and water are our most basic needs. Without water, food production is not
    possible. That is why drought and water scarcity translate into a decline of food
    production and an increase in hunger. Traditionally, food cultures evolved in
    response to the water possibilities surrounding them. Water-prudent crops emerged
    in water-scarce regions, and water-demanding ones evolved in water-rich regions.


    In the wet territories of Asia, rice cultures evolved and paddy field irrigation
    dominated. In the arid and semiarid tracts across the world, wheat, barley, corn,
    sorghum, and millet emerged as staples. In high-altitude regions, pseudo-cereals
    such as buckwheat provided nutrition. In the Ethiopian highlands, teff become
    the staple of choice. In deserts, pastoral cultivation was the basis of the food
    economy. Yet these diverse crops and agricultural styles are overlooked as food
    monoculture becomes the preferred method of production at the national, international,
    and corporate levels.


    The water-use efficiency of crops is influenced by their genetic variation. Maize,
    sorghum, and millet convert water into biological matter most efficiently. Millet
    not only requires water than rice, but it is also drought resistant, withstanding
    up to 75 percent soil moisture depletion. The roots of pulses and legumes allow
    efficient soil moisture utilization.


    Since the Green Revolution, crops that produce higher nutrition per unit of water
    used have been called inferior and have been displaced by water-intensive crops.
    Water productivity has been ignored, the focus shifting to'
