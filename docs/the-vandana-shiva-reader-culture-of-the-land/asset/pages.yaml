  md: '# Growing Seed Scarcity


    Globalization and privatization of the seed sector have eroded the seed supply
    of farmers and the public sector. Although the entry of private seed companies
    is justified on grounds of increasing farmers’ options and choices, by making
    farmers look down on their own varieties as inferior and by eroding the capacity
    of the public sector, globalization has in effect created a seed famine.


