    # Privatization and the Spread of Monocultures


    No native variety of cotton is found in Warangal—all varieties of cottonseeds
    used in Warangal are hybrid seeds sold by private companies providing high-yielding
    varieties. It takes at least six to seven years of trials and verifications under
    the supervision of government authorities for any company to launch certified
    seeds. However, to avoid such delays in the introduction of seeds to the market,
    seed companies sell them as “truthful” seeds: sold on the basis of farmers having
    confidence in the company’s claims about them. There is no regulation to prevent
    the sale of “truthful” seeds.


    In the 1970s cotton cultivation in Warangal was dependent upon the varieties developed
    by the public sector supply. During that time the most popular variety was Hybrid-4,
    a short staple cotton variety. Besides Hybrid-4 (H-4), the other varieties used
    during the 1970s and 1980s were MCU-5 (developed by Coimbatore Research Station);
    L. K. varieties (which were resistant to white fly and jassids); Varalakshmi (developed
    by Cotton Research Station, Nandyal); and JHY-1 (an HV developed by Jawahar Nehru
    Krishna Vidhyhalaya, MP), among others. All these varieties were government varieties
    that were cultivated in the Telangana region.


    However, in the 1980s a handful of private companies participated in cotton research
    and evolved a number of hybrid cotton varieties. These included Maharashtra Hybrid
    Seeds Companies, Jalna (Mahhyco); Mahindra Seeds Company, Jalna; and Nath Seeds
    Company, Aurangabad. These companies captured the entire market for cottonseed
    production and distribution.


    The most popular variety of cotton in Warangal, based on yields during 1995–1997,
    was RCH-2, a long-duration “truthful” hybrid variety produced by Rasi Seeds Company
    and marketed by J. K. Company, Secundabad.'
