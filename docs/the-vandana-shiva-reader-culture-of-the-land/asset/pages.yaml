  md: '# 13


    # The GMO Emperor Has No Clothes

    Genetic Engineering Is a Failed Technology


    # Technologies Are Tools


    Technologies are tools. They are ways of doing, or making things. They are means
    of transforming what nature has given into food, clothing, shelter, means of mobility,
    means of communication. The word technology is derived from two Greek words: *techne*,
    which means tools, methods, means, and *logos*, which refers to thought or expression.
    As a tool, a technology is as good as the human ends it serves. It is not an end
    in itself. Yet technology has been elevated to a human end in our times.


    Tools, methods, and means are assessed and evaluated on the basis of the ends
    they mean to serve. They are assessed for their impact on nature, on society.
    Tools are compared with other alternative means available to do the job. And on
    the basis of an assessment, a choice is made to ensure there is no ecological
    or social harm, and that there is a positive contribution to human well-being.
    Until twenty years ago, before globalization and corporate rule, national governments
    and the UN had offices of technology assessment. The deregulation of corporate
    activity went in in hand the dismantling of technology assessment. When we stop
    perceiving technology as a means, mediating between nature and human needs, and
    falsely elevate it to an end, we falsely give it the status of a religion. The
    seeds of the Green Revolution, bred for responding to chemical fertilizers, were
    called “miracle seeds,” and Norman Borlaug called the twelve people he sent across
    the world to spread'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'chemicals through the introduction of the new seeds his “wheat apostles.\”
    This is the discourse of religion, not of science and technology.


    When the Green Revolution was introduced into India in 1965–1966, no assessment
    was made about the impact of chemical fertilizer on soil organisms, soil structure,
    the water-holding capacity of the soils. No assessment was made to compare the
    yields of Green Revolution varieties and mixed-farming systems. When we started
    to conserve native seeds through the Navdanya movement in 1987, we found many
    of the indigenous varieties outperformed the Green Revolution varieties in grain
    yield, and outperformed them in total biomass yield, which is what really counts
    since the grain is eaten by humans, but straw is food for the soil organisms and
    for farm animals. And our work on mixtures and biodiverse systems of farming shows
    that as a system, indigenous biodiversity produces more food and nutrition per
    acre. If we had a scientific approach to making choices about the technologies
    we use to produce our food, agroecology would win hands down. But the Green Revolution
    is promoted blindly as a religion, not on the basis of science.


    Genetic engineering is the latest tool being imposed on India and the world as
    the new miracle. There are only three groups of GMO applications—Bt crops that
    are supposed to control pests, herbicide-resistant crops that are supposed to
    control weeds, and future promises of biofort in the form of golden rice for addressing
    vitamin A deficiency and GMO bananas for removing iron deficiency.


    When we assess genetic engineering as a tool aiming to achieve the objectives
    of reducing pests and weeds or increasing the availability of vitamin A and iron,
    it is clearly failing the test. GMOs have created supersects and superweeds instead
    of reducing pests and weeds. Golden rice is 7,000 percent less efficient in providing
    vitamin A and GMO bananas than alternatives in our rich but rapidly disappearing
    biodiversity. GMOs continue to be promoted as a religion in spite of all the evidence
    that they are failing to do the job they are claimed to be designed for.


    As in all religious fundamentalisms, there is intolerance of alternatives—alternative
    paradigms, alternative approaches to food production, and independent science.
    And we are witnessing the viciousness with which the industry attacks anyone who
    provides an alternative. The new seed legislation'
