    # Can Life Be Made? Can Life Be Owned?


    # Redefining Biodiversity


    In 1971, General Electric and one of its employees, Anand Mohan Chakravarty, applied
    for a U.S. patent on a genetically engineered pseudomonas bacteria. Taking plasmids
    from three kinds of bacteria, Chakravarty transplanted them into a fourth. As
    he explained, “I simply shuffled genes, changing bacteria that already existed.”
    Chakravarty was granted his patent on the grounds that the microorganism was not
    a product of nature but by his invention and, therefore, patentable. As Andrew
    Kimbrell, a leading U.S. lawyer, recounts, “In coming to its precedent-shattering
    decision, the court seemed unaware that the inventor himself had characterized
    his ‘creation’ of the microbe as simply ‘shifting’ genes, not creating life.”


    On slippery grounds, the first patent on life was granted, and in spite of the
    exclusion of plants and animals from patenting under U.S. law, the United States
    has rushed to grant patents on all kinds of life-forms.


    Currently, well over 190 genetically engineered animals, including fish, mice,
    and pigs, are figuratively standing in line to be patented by a variety of researchers
    and corporations. According to Kimbrell: “The Supreme Court’s Chakravarty decision
    has been extended to be continued, up the chain of life. The patenting of microbes
    has led inexorably to the patenting of plants, and then animals.”'
