    We have been reduced to buyers of their nonsustainable products rather than creators
    of sustainable, cooperative partnerships—both within human society and with other
    species and the earth as a whole.


    The biodiversity economy is the sustainable alternative to the fossil fuel economy.
    The shift from fossil fuel-driven to biodiversity-supported systems reduces greenhouse
    gas emissions by emitting less and absorbing more CO₂. Above all, because the
    impacts of atmospheric pollution will continue even if we do reduce emissions,
    we need to create biodiverse ecosystems and economies because only they offer
    the potential to adapt to an unpredictable climate. And only biodiversity systems
    provide alternatives that everyone can afford. We need to return to the renewable
    carbon cycle of biodiversity. We need to create a carbon democracy so that all
    beings have their share of useful carbon, and no one is burdened by carrying an
    unjust share of climate impacts due to carbon pollution.


