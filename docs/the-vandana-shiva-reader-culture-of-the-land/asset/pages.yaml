  md: '# Table 5.6. Comparison of local and dominant knowledge systems


    | Local system | Dominant system |

    |---|---|


    Forestry and agriculture integrated.


    Forestry separate from agriculture.


    Integrated systems have multidimensional outputs. Forests produce wood, food,
    fodder, water, etc. Agriculture produces diversity of food crops.


    Each separate system made one-dimensional. Forests produce only commercial wood.
    Agriculture produces only commercial crops with industrial inputs.


    Productivity in local system is a multidimensional measure that has a conservation
    aspect.


    Productivity is a one-dimensional measure that is unrelated to conservation.


    Increasing productivity involves increasing the multidimensional outputs and strengthening
    the integration.


    Increasing productivity involves increasing one-dimensional output by breaking
    up integrations and displacing diverse outputs.


    Productivity based on conservation of diversity.


    Productivity based on creation of monocultures and destruction of diversity.


    Sustainable system.


    Nonsustainable system.


