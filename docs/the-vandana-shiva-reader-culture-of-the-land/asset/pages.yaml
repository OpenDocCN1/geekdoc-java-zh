  md: '# 9


    # Seeds of Suicide


    # The Ecological and Human Costs of the

    Globalization of Agriculture


    This study takes stock of the impact of a decade of trade liberalization on

    the lives and livelihood of farmers. Across India farmers are taking the

    desperate step of ending their lives because of new pressures building up on

    them as a result of globalization and the corporate takeover of seed supply,

    leading to the spread of capital-intensive agriculture and the propagation of

    onsustainable agriculture practices. The lure of huge profits linked with

    clever advertising strategies evolved by the seed and chemical industries

    and easy credit for the costly inputs is forcing farmers into a

    chemical tremill and a debt trap. The reality of globalization is different

    from the corporate propaganda and from the promises of trade liberalization

    and agriculture offered by the World Bank, the WTO, and experts and

    economists sitting in our various ministries. The impacts of trade

    liberalization and globalization have been felt in each and every of

    India, with the states of Andhra Pradesh, Karnataka, Maharashtra, and

    Punjab bearing the maximum burden in terms of the high social and

    ecological costs. Farmers are paying for globalization by being forced to

    sacrifice their lives and livelihoods. In what follows we present scenarios

    from these states to the status of farmers'' suicides; since December 1997,

    when such suicides first reached epidemic proportions, the Research

    Foundation for Science, Technology, and Ecology has been monitoring

    these incidents and analyzing their causes.'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'The epidemic of farmers'' suicide is a barometer of the stress Indian agriculture
    and Indian farmers have been put under by the globalization of agriculture. Growing
    indebtedness and increasing crop failure are the main reasons farmers have committed
    suicide across the length and breath of rural India. These are also the inevitable
    outcomes of the corporate model of industrial agriculture being introduced in
    India through globalization. Agriculture driven by multinational corporations
    is capital intensive and creates heavy debt for the purchase of costly inputs
    such as seeds and agrochemicals. It is also ecologically vulnerable since it is
    based on monocultures of introduced varieties and on unsustainable practices of
    chemically intensive farming.


    The high social and ecological costs of the globalization of unsustainable agriculture
    are not restricted to the cotton-growing areas of the states under consideration
    here; they have been experienced in all regions where commercially grown and chemically
    farmed crops are raised. While the benefits of globalization go to the seed and
    chemical corporations through expanding markets, the cost and risks are exclusively
    borne by the small farmers and landless peasants.


    The two most significant ways through which the risks of crop failures have been
    increased by globalization are the introduction of ecologically vulnerable hybrid
    seeds and the increased dependence on agrochemical input such as pesticides, necessary
    with pest-prone hybrids.


    The privatization of the seed sector under trade liberalization has led to a shift
    in cropping patterns from polyculture to monoculture and a shift from open-pollinated
    varieties to hybrids. In the district of Warangal in Andhra Pradesh, this shift
    has been very rapid, converting Warangal from a mixed-farming system based on
    millets, pulses, and oilseeds to a monoculture of hybrid cotton.


    The problem of pests is a problem created by the erosion of diversity in crops
    and cropping patterns and the introduction of commercial hybrid seeds. The most
    sustainable solution for pest control is rejuvenating biodiversity in agriculture.
    Nonsustainable pest control strategies offer chemical or genetic fixes while reducing
    diversity, which is the biggest insurance against pest damage.'
