    Von Werhof has pointed out, from the dominant standpoint, nature is everything
    that be available free or as cheaply as possible. This includes the products of
    social labor. The labor of women and third world farmers is said to be nonlabor,
    biology, a natural resource; their products are thus akin to natural deposits.³31


    # The Production and Creation Boundaries


    The transformation of value into disvalue, labor into nonlabor, knowledge into
    nonknowledge, is achieved by two very powerful constructs: the production boundary
    and the creation boundary.


    The production boundary is a political construct that excludes regenerative, renewable
    production cycles from the domain of production. National accounting systems,
    which are used for calculating growth through the gross national product, are
    based on the assumption that if producers consume what they produce, they do not,
    in fact, produce at all because they fall outside of the production boundary.³²
    All women who produce for their families, children, and nature are thus treated
    as nonproductive, as economically inactive. Discussions at the United Nations
    Conference on Environment and Development on issues of biodiversity have also
    referred to production for one’s own consumption as a market failure.³³ Self-sufficiency
    in the economic domain is, therefore, seen as economic deficiency when economies
    are confined to the marketplace. The devaluation of women’s work, and of work
    done in subsistence economies in the third world, is the natural outcome of a
    production boundary constructed by capitalist patriarchy.'
  merge: -1
