    # Genetic Engineering and the Rise of the Reductionist Paradigm of Biology


    Reductionism in biology is multifaceted. At the species level, this reductionism
    puts value on only one species—humans—and generates an'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'instrumental value for all others. It therefore displaces and pushes to extinction
    all species that have no or low instrumental value to humans. Monocultures of
    species and biodiversity erosion are the inevitable consequences of reductionist
    thought in biology, especially when applied to forestry, agriculture, and fisheries.
    We call this firstorder reductionism.


    Reductionist biology is increasingly characterized by a second-order reductionism—genetic
    reductionism—the reduction of all behavior of biological organisms, including
    humans, to genes. Second-order reductionism amplifies the ecological risks of
    first-order reductionism, while introducing new issues, like the patenting of
    life-forms.


    Reductionist biology is also an expression of cultural reductionism, since it
    devalues many forms of knowledge and ethical systems. This includes all non-Western
    systems of agriculture and medicine as well as all disciplines in Western biology
    that do not lend themselves to genetic and molecular reductionism, but are necessary
    for dealing sustainably with the living world.


    Reductionism was promoted by August Weismann, who nearly a century ago postulated
    the complete separation of the reproductive cells—the germ line—from the functional
    body, or soma. According to Weismann, reproductive cells are already set apart
    in the early embryo and continue their segregated existence into maturity, when
    they contribute to the formation of the next generation. This supported the idea
    that acquired traits with no direct feedback from the environment are nonheritable.
    The mostly nonexistent “Weismann barrier” is still the paradigm used to discuss
    biodiversity conservation as “germ plasm” conservation. The germ plasm, Weismann
    had earlier contended, was divorced from the outside world. Evolutionary changes
    toward greater fitness—meaning greater capacity to reproduce—were the result of
    fortuitous mistakes that happened to prosper in the competition of life.⁸


    Weismann’s classic experiment a century ago was taken as proof of the nonheritability
    of acquired characteristics. He cut the tails off twenty-two generations of mice
    and found that the next generation was still born with normal tails. The sacrifice
    of hundreds of mouse tails only proved that this type of mutilation was not inherited.⁹'
