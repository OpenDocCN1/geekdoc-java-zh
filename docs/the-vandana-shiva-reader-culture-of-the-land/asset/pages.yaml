  md: '# CULTURE OF THE LAND: A SERIES IN THE NEW AGRARIANISM


    This series is devoted to the exploration and articulation of a new agrarianism
    that considers the health of habitats and human communities together. It demonstrates
    how agrarian insights and responsibilities can be worked out in diverse fields
    of learning and living: history, science, art, politics, economics, literature,
    philosophy, religion, urban planning, education, and public policy. Agrarianism
    is a comprehensive worldview that appreciates the intimate and practical connections
    that exist between humans and the earth. It stands as our most promising alternative
    to the unsustainable and destructive ways of current global, industrial, and consumer
    culture.


    SERIES EDITOR


    Norman Wzirba, Duke University, North Carolina


    ADVISORY BOARD


    +   Wendell Berry, Port Royal, Kentucky

