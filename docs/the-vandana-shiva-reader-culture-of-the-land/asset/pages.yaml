  md: '# Introduction


    # From Quanta to the Seed


    # An Unpredictable Journey


    Physics was my passion and my chosen profession. In school I received the Science
    Talent Scholarship, which gave me the opportunity to train in India''s leading
    scientific institutions. I trained to be a nuclear physicist when the Baba Atomic
    Research Centre, but moved to theoretical physics when my sister Mira, a medical
    doctor, made me aware of nuclear hazards. I realized then that most science is
    partial. I wanted to practice a holistic science and was drawn to quantum theory
    for its nonreductionist, nonmechanist paradigm.


    Before leaving for Canada to visit my PhD in the foundations of quantum theory,
    I wanted to visit my favorite places in the Himalaya where I had grown up. But
    the forests and streams had disappeared: the rich oak forests, which absorb the
    monsoon rains to release the water slowly as streams, had been cut down in the
    insane rains to build dams and roads, and to grow apples.


    In looking for a way to deal with this personally experienced loss, I become a
    volunteer for the Chipko Movement—the movement to embrace trees to prevent their
    being cut. Every vacation from 1974 to 1981 found me back in the Himalayan village
    of Tehri Garhwal and often in the ashram of Bimla and Sunderlal Bahuguna, Gandhians
    who played a leading role in'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'supporting the women who had spontaneously started the movement. By 1981 the
    government was forced to recognize the wisdom of Chipko—the primary products of
    the forest are soil, water, and pure air, not timber, resin, and revenues. Logging
    was banned in the Himalaya above one thousand meters.


    Though I had grown up in the forests of the Himalaya, it was the Chipko Movement
    that awakened my ecological consciousness and made me deeply aware of the relationship
    between ecological destruction and the creation of poverty. I often say that I
    have learned my ecology in “Chipko University,” with ordinary peasant women as
    my teachers. “Staying Alive" was born of those teachings. One of the slogans that
    emerged from Chipko was that forestry should shift from commercial forestry to
    social forestry—in the service of nature and society.


    I returned to India after receiving my PhD because I wanted to give back to my
    society and understand it better. It would have been easy to get a tenure-track
    position in a North American university, but I chose the more difficult and challenging
    path of trying to combine scientific research with social and ecological responsibility.


    In 1980, while I was at the Indian Institute of Management (IIM) in Bangalore,
    we witnessed the conversion of farmlands around the city into monocultures of
    eucalyptus plantations. To trying to understand what was driving this, we found
    the World Bank was financing eucalyptus plantations for the pulp industry, calling
    it “social forestry." Ecological Audit of Eucalyptus, a study I and my colleagues
    at IIM conducted, had a huge impact. It traveled to Thailand, Portugal, and Brazil
    and was used to challenge the idea that commercial plantations are forests. I
    realized that humanity had cultivated a “monoculture of the mind,” which created
    a blindness to diversity and its potentials, a blindness that blocked out the
    high productivity of biodiverse systems in forests, in agriculture, in the ocean.


    It was becoming increasingly evident that scientific expertise worked more in
    the service of capital and forces abetting the destruction of nature. I wanted
    to work in the service of people and nature. In 1981, I took the decision to leave
    academics and start an independent institute to support grassroots ecology movements.
    My mother gave me her cowshed, and the'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Research Foundation for Science, Technology, and Ecology was born. We shut
    down mines in Doon Valley; we assessed the impacts of dams and power plants in
    Narmada, Suverna Rekha, Tehri, and Singrauli.


    Mr. S. M. Mohamed Idris, the founder of the Consumers Association of Penang and
    Third World Network, Malaysia, saw the study and invited me to a forest conference
    in Penang. Out of that meeting came the World Rainforest Movement, the network
    of forest defenders worldwide.


    In 1984, a number of tragic events took place in India. In June, the Golden Temple
    was attacked because it was harboring extremists. In October, Indira Gandhi was
    assassinated. And in December, a terrible industrial disaster took place in Bhopal
    when Union Carbine’s pesticide leaked a toxic gas. Thirty thousand people died
    in the terrorism in Punjab, and thirty thousand people have died in the “industrial
    terrorism” of Bhopal. This is equivalent to twelve 9/11s. I was forced to sit
    up and ask why agriculture had become like war. Why did the “Green Revolution,”
    received the Nobel Peace Prize, breed extremism and terrorism in Punjab? This
    question leading to my books The Violence of the Green Revolution and Monultures
    of the Mind. Blindness to diversity and self-organization in nature created a
    basic problem in the mechanistic, Cartesian industrial paradigm. And this blindness
    led to false claims that industrial monocultures in forestry, farming, fisheries,
    and animal husbandry produced more food and were necessary to alleviate hunger
    and poverty. On the contrary, monocultures produce less and use more inputs, destroying
    the environment and impoverishing people.


    In 1987, the Dag Hammarjord Foundation organized a meeting on biotechnology in
    Geneva called Laws of Life. I was invited by my book on the Green Revolution.
    At the conference, the biotech industry laid its plans—to patent life; to genetically
    engineer seeds, crops, and life; and to get freedom to trade through the GATT
    negotiations, which finally led to the WTO. This led to my focus on intellectual
    property rights, free trade, globalization—and to a life dedicated to saving seeds
    and promoting organic farming as an alternative to a world dictated and controlled
    by corporations.


    Having dedicated my life to the defense of the intrinsic worth of all species,
    the idea of life-forms, seeds, and biodiversity being reduced to'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'corporate inventions and hence corporate property abhorrent to me. Further,
    if seeds become “intellectual property,” saving and sharing seeds become intellectual
    property theft. Our highest duty, to save seeds, becomes a criminal act. The legalizing
    of the criminal act of owning and monopolizing life through patents on seeds and
    plants was morally and ethically unacceptable to me. So I started Navdanya, a
    movement that promotes biodiversity conservation and seed saving sharing among
    farmers. Navdanya has created more than twenty community “seed banks” through
    which seeds are saved and freely exchanged among our three thousand members.


    Our saving of heritage seeds, we have brought back “forgotten foods” like jhangora
    (barnyard millet), ragi (finger millet), marsha (amaranth), naurangi dal, and
    gahat dal. Not only are these crops more nutritious than the globally traded commodities,
    but they are more resource prudent, requiring only two hundred to three hundred
    millimeters of rain compared to the twenty-five to three hundred millimeters needed
    for chemical rice farming. Millets could increase food production four hundred
    fold using the same amount of limited water. These forgotten foods are the seeds
    of the future.


    The seed, for the farmer, is not merely the source of future plants/food; it is
    the storage place of culture, of history. Seed is the first link in the food chain.
    Seed is the ultimate symbol of food security.


    Free exchange of seed among farmers has been the basis of maintaining biodiversity
    as well as food security. This exchange is based on cooperation and reciprocity.
    A farmer who wants to exchange seed generally gives an equal quantity of seed
    from his field in return for the seed he gets.


    Free exchange among farmers goes beyond mere exchange of seeds; it involves the
    exchange of ideas and knowledge, of culture and heritage. It is an accumulation
    of tradition, of knowledge of how to work the seed. Farmers gather knowledge about
    the seeds they want to grow in future by watching them actually grow in other
    farmers'' fields. This knowledge is based on the cultural, religious, and gastronomic
    values the community accords to the seed and the plant it produces as as qualities
    of drought, disease, and pest resistance, longevity, and other aspects.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'In saving seeds and biodiversity, we are protecting cultural diversity. Navdanya
    means “nine seeds.” It also means “new gift.” We bring to our farmers the new
    gift of life in the face of the extinction of species and the elimination of small
    farmers.


    Our conservation of heritage rice basmati varieties has led to the protection
    of the original, authentic slaves as part of the Slow Food Presidium. We have
    saved more than three thousand rice varieties, including over thirty aromatic
    ones. The saline-resistant seeds we saved helped Orissa farmers recover from the
    super cyclone that killed thirty thousand people in 1999. The saline-resistant
    seeds were also distributed by Navdanya for rehabilitation after the tsunami.
    We are now creating “Seeds of Hope” seeds banks to deal with climate change. Heritage
    seeds that can tolerate droughts, floods, and cyclones will be collected, multiplied,
    and distributed. Farmers’ breeding is far ahead of scientific breeding and genetic
    engineering in providing food-resistant, drought-resistant, saline-resistant varieties.
    In the context of farmers’ heritage, genetic engineering is in fact a laggard
    technology.


    Not only are corporate, industrial breeding strategies incapable of dealing with
    climate change, but genetically engineered seeds are also killing farmers. In
    India, according to a debate in Parliament, more than one hundred thousand farmers
    have committed suicide of debt caused by the high cost of unreliable seeds sold
    by corporations. There are no suicides where farmers use heritage seeds and their
    own traditional varieties. Suicides are concentrated in areas that have become
    dependent on commercial seeds and are most intense where genetically engineered
    Bt cotton has been sold. These are seeds of seeds and seeds of slavery.


    My inspiration for saving seeds from Gandhi’s spinning wheel, through which he
    fought the British Empire nonviolently. Another inspiration from Gandhi is the
    salt satagraha, through which Gandhi refused to cooperate with salt laws that
    made salt a monopoly of the British. He walked to the sea, picked up salt, and
    said, “Salt making is our birthright.” We have undertaken the “seed satagraha”—a
    commitment to refuse to cooperate with patent laws and seed laws that prevent
    farmers from saving and exchanging seed. Seed freedom is our birthright. Without
    seed freedom there is no food freedom.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'In May 2006, we in Navdanya undertook a “seed pilgrimage” (Bija Yatra) to stop
    farmers’ suicides and create an agriculture of hope using heritage seeds and farmers’
    agroecological knowledge. The Bija Yatra was launched on May 10 to mark 150 years
    of our struggle for freedom. We are building a movement to stop the genocide of
    our farmers and reclaim our sovereignty and food sovereignty. The yatra started
    from Gandhi’s ashram in Sevagram, District Wardha, Maharashtra, and concluded
    on May 26 in Bangalore. The yatra covered Amravati, Nagpur in Yavatmal, The Vidarbha
    region of Maharashtra, Adilabad, Warrangal, Karimnagar, Hyderabad in Andhra Pradesh
    and Gulbarga, Raichur, Hosepet, Chitradurg, and Bangalore in Karnataka. These
    are the regions where farmers have become locked into dependence on corporate
    seed supplies for growing crops integrated into world markets, which is leading
    to a collapse in farm prices due to $400 billion subsidies in rich countries.


    Throughout the yatra of freedom and seeds of life were distributed. We will boycott
    Monsanto’s Bt cotton and poisonous agrochemicals that are killing farmers and
    the environment. India is not free if its farmers are enslaved and indebted. We
    will not rest till our villages are GMO free, patent free, debt free, and suicide
    free.


    Privatization of the earth’s resources—of water, of biodiversity—is the ultimate
    social and ecological violation of the earth’s rights and human rights. The earth
    gives us gifts to be shared, to be conserved, to be used sustainably, the very
    idea of owning life through patents and owning and selling water through concessions
    and commodification is a symptom of the deep regression of the human species.
    Over the years resisting the enclosures of the commons and advocating for their
    recovery, Water Wars, Stolen Harvest, have defined my thoughts and actions in
    my books Biopiracy, Water Wars, Stolen Not Oil.


    This is why I fought against the biopiracy patents on neem, basmati, and wheat.
    That is why I fought against the commodification of the Ganga and the privatization
    of Delhi’s water supply, a story we have told in our reports Ganga: Common Heritage
    or Commodity? and Water Democracy vs. Privatisation in Delhi. Defending our fundamental
    freedoms has become fighting “free trade” to protect our seed freedom (bija swaraj),
    food freedom (anna swaraj), water freedom (jal swaraj), land freedom (bhu'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'swaraj), and forest freedom. We have reinvented democracy as earth democracy,
    the democracy of all life and the democracy of everyday life (see my book Earth
    Democracy).


    Most of the essays in this reader published by the University Press of Kentucky
    are extracted from the many books I have written over the years. The connecting
    thread is food and agriculture, a theme that has become a passion as deep as my
    passion for quantum theory. What quantum theory has taught us about the false
    assumptions of the mechanistic worldview I did my doctoral thesis on nonseparability
    and nonlocality in quantum theory. also holds true for a mechanistic view of farming
    as industrial agriculture. Nonseparability and interconnectedness are even more
    true of the living world of seed and soil, plants and animals. Quantum theory
    teaches us that there are no fixed entities and fixed quantities in the world.
    The world in constant, dynamic interaction is a world of unfolding potential.
    There are no “essentially high-yielding varieties” and “low-yielding varieties.”
    There are highresponse varieties bred for chemical inputs, and there are farmers’
    varieties, which can give us high nutrients at low cost. The Navdanya report Health
    per Acre shows that native seeds and biodiverse agroecological systems produce
    more food and nutrition per acre than chemical monocultures.


    The future of farming is based on love and care for the living soil, the living
    seed, and living food, all of which protect the well-being of the planet and its
    people.'
