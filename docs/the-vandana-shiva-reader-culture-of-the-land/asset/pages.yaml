  md: 'When an organism or a system is mechanically manipulated to improve a one-dimensional
    function, including the increase in one-dimensional productivity, either the organism’s
    immunity decreases and it becomes vulnerable to disease and attack by other organisms,
    or the organism becomes dominant in an ecosystem and displaces other species,
    pushing them into extinction. Ecological problems arise from applying the engineering
    paradigm to life. This paradigm is deepened through genetic engineering, which
    will have major ecological and ethical implications.


    # # Ethical Implications of Genetic Engineering


    When organisms are treated as they are machines, an ethical shift takes place—life
    is seen as having instrumental rather than intrinsic value. The manipulation of
    animals for industrial ends has already had major ethical, ecological, and health
    implications. The reductionism, machine view of animals removes all barriers of
    ethical concern for how animals are treated to maximize production. Within the
    industrial livestock production sector, the mechanistic view predominates. For
    example, a manager of the meat industry states: “The breeding sow should be thought
    of, and treated as, a valuable piece of machinery, whose function is to pump out
    baby pigs like a sausage machine.\”20


    Treating pigs as machines, however, have a major impact on their behavior and
    health. In animal factories, pigs have to fight their tails, teeth, and testicles
    cut off because they fight with each other and resort to what the industry calls
    “cannibalism.”ing percent of the piglets in factory farms are choked to death
    by their mother. Two to five percent are born with congenital defects, such as
    played legs, no anus, or inverted mammary glands. They are prone to diseases such
    as “banana disease” (so named because stricken pigs arch their backs into a banana
    shape) or porcine stress syndrome. These stresses and diseases are bound to increase
    with genetic engineering. Already, the pig with the human growth hormone has a
    body weight that is more than its legs can carry.'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'The issues of health and animal welfare are intrinsically related to the ecological
    impact of the new technologies on the capacity of self-regulation and healing.
    The issue of intrinsic worth is intimately related to the issue of self-organization,
    which is also, in turn, related to healing.


    In the making of the organism, the multiplying cells seem to be instructed as
    to their respective destinies, and they become permanently differentiated to compose
    organs. But the instructions or pattern for making the whole structure remain
    somehow latent. When a part is injured, some cells become undifferentiated in
    order to make new, specialized tissues.21


    Thus, there is a self-directed capacity for restoration. The faculty of repair
    is, in turn, related to resilience. When organisms are treated as machines, and
    manipulated without recognition of their ability to self-organize, their capacity
    to heal and repair breaks down, and they need increasing inputs and controls to
    be maintained.


    # Ecological and Socioeconomic Implications of Genetic Engineering


    Genetic engineering has epistemological and ethical implications not merely for
    the material conditions of our life, our health, and our environment. Health implications
    are built into the very techniques of genetic engineering.


    Genetic engineering moves genes across species using "vectors”—usually a mosaic
    recombination of natural genetic parasites from different sources, including viruses
    causing cancers and other diseases in animals and plants that are tagged with
    one or more antibiotic-resistant“market” genes. Evidence accumulating over the
    past few years confirms the fear that these vectors constitute major sources of
    genetic pollution with drastic ecological and public health consequences. Vector-mediated
    horizontal gene transfer and recombination are found to be involved in generating
    new pandemic strains of bacterial pathogens.22


    Genetic engineering also has major ecological impacts, even though the biotechnology
    industry and regulatory agencies keep claiming that there have been no adverse
    consequences from the over five hundred field'
  merge: -1
