  md: 'The proposition that information only goes from genes to the body was reinforced
    by molecular biology and the discovery in the 1950s of the role of nucleic acid,
    placing Mendelian genetics on a solid material basis. Molecular biology showed
    a means of transfer of information from genes to proteins, which gave no indication—until
    recently—of any transfer in the opposite direction. The inference that there could
    be none became what Francis Crick called the central dogma of molecular biology:
    “Once ‘information’ has passed into proteins, it cannot get out again.”10


    Isolating the gene as a “master molecule” is part of biological determinism. The
    “central dogma” that genes as DNA make proteins is another aspect of this determinism.
    This dogma is preserved even though it is known that genes “make” nothing. As
    Richard Lewontin states in *The Doctrine of DNA:


    DNA is a dead molecule, among the most non-reactive, chemically inert molecules
    in the world. It has no power to reproduce itself. Rather, it is produced out
    of elementary materials by a complex cellular machinery of proteins. While it
    is often said that DNA proteins (enzymes) produce DNA.


    When we refer to genes as self-replicating, we endow them with a mysterious autonomous
    power that seems to place them above the more ordinary materials of the body.
    Yet if anything in the world can be said to be self-replicating, it is not the
    gene, but the entire organism as a complex system.11


    Genetic engineering is taking us into a second-order reductionism not because
    organisms are perceived in isolation of their environment, but because genes are
    perceived in isolation of the organism as a whole. The doctrine of molecular biology
    is modeled on classical mechanics. The central dogma is the ultimate in reductionist
    thought.


    At the very same time Max Planck, Niels Bohr, Albert Einstein, Erwin Schrodinger,
    and their brilliant colleagues were revising the Newtonian view of the physical
    universe, biology was becoming more reductionist.12 Reductionism in biology was
    not an accident but a carefully planned paradigm. As Lily E. Kay records in *The
    Molecular Vision of Life,'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'the Rockefeller Foundation served as a principal patron of molecular biology
    from the 1930s to the 1950s. The term molecular biology was coined in 1938 by
    Warren Weaver, the director of the Rockefeller Foundation’s Natural Science Division.
    The term was intended to capture the essence of the foundation’s program—its emphasis
    on the ultimate minuteness of biological entities. The cognitive and structural
    reconfigurations of biology into a reductionist paradigm were greatly facilitated
    through the economically powerful Rockefeller Foundation. During the years 1932–1959,
    the foundation poured about $25 million into molecular biology programs in the
    United States, more than one-fourth of the foundation’s total spending for the
    biological sciences outside of medicine (including, from the early 1940s on, enormous
    sums for agriculture).13 The force of the foundation’s funding set the trends
    in molecular biology. During the dozen years following 1953 (theucidation of the
    structure of DNA), Nobel Prizes were awarded to scholars for research into the
    molecular biology of the gene, and all but one had been fully or partially sponsored
    by the Rockefeller Foundation under Weaver’s guidance.14


    The motivation behind the enormous investment in the new agenda was to develop
    the human sciences as a comprehensive explanatory and applied framework of social
    control grounded in the natural, medical, and social sciences. Conceived during
    the late 1920s, the new agenda was articulated in terms of the contemporary technocratic
    discourse of human engineering, aiming toward restructuring human relations in
    congruence with the social framework of industrial capitalism. Within that agenda,
    the new biology (originally named “psychobiology”) was erected on the bedrock
    of the physical sciences in order to rigorously explain and eventually control
    the fundamental mechanisms governing human behavior, placing a particularly emphasis
    on heredity. Hierarchy and inequality were thus “naturalized.” As Lewintin states
    in The Doctrine of DNA: “The naturalistic explanation is to say that not only
    do we differ in our innate capacities but that these innate capacities are transmitted
    from generation to generation biologically. That is to say, they are in our genes.
    The original social and economic notion of inheritance has been turned into biological
    inheritance.”15'
