    To produce more food and nutrition, we need to design production systems that
    are biodiversity intensive and ecologically intensive. Biodiversity-intensive
    systems produce more food, nutrition, and health per acre than industrial chemical
    monocultures. By saving on costs of external inputs, they create more wealth per
    acre for farmers. When measured in terms of contribution to nutrition, health,
    and rural incomes, industrial systems have very low productivity. Not only is
    the measure of productivity of industrial agriculture partial because all inputs,
    including resource and energy inputs, are not taken into account, but it is also
    partial because not outputs are taken into account. Only the production of monoculture
    commodities is counted.


    Green Revolution systems have high “yield” but low output. And it is output that
    feeds the soil and people, not the yield of globally traded commodities that are
    used for biofuel or animal feed. Ecological agriculture is based on mixed and
    rotational cropping, and the production of a diversity of crops. Navdanya’s work
    on biodiverse farming has shown that the more biodiversity on the farm, the higher
    the output.¹


    Perhaps one of the most fallacious claims propagated by Green Revolution proponents
    is the assertion that HYVs have reduced the acreage necessary to grow these crops,
    therefore preserving hectares of biodiversity. Perpetuating this myth, Dennis
    Avery, a promoter of chemical farming, has recently written, “Is the Green Movement
    finally to face the global need to till triple crops and drop their dedication
    to land selfish organic farming? The planet’s biodiversity is at stake.” India’s
    experience tells us that instead of land being released for conservation, by destroying
