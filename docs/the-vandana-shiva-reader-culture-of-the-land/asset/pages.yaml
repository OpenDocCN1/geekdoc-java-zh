  md: 'Baron Justin von Liebig, a German chemist, carried out research in the latter
    part of the nineteenth century on the elements and chemicals required by plants
    for growth. He determined that the principal ingredients for soil fertility were
    nitrogen (N), phosphorus (P), and potassium (K). This is how the N-P-K mentality
    was born.


    In 1909, Fritz Haber invented ammonium sulfate, a nitrogen fertilizer made using
    coal or natural gas to heat nitrogen and hydrogen. The manufacture of synthetic
    fertilizers is highly intensive. One kilogram of nitrogen fertilizer requires
    the equivalent of two liters of diesel. One kilogram of phosphate fertilizer requires
    half a liter of diesel. Energy consumed during fertilizer manufacture was equivalent
    to 191 billion liters of diesel in 2000 and is projected to reach 277 billion
    liters in 2030.¹¹⁹


    Plants, however, need more than N-P-K. And when only N-P-K is applied as synthetic
    fertilizers, soils and plants, and consequently humans, develop deficiencies of
    trace elements and micronutrients. A pioneer of organic agriculture, Sir Albert
    Howard, explained: “A teeming with healthy life in the shape of abundant microflora
    and microfauna, will bear healthy plants, and these, when consumed by animals
    and man, will confer health on animals and man. But an infertile soil, that is,
    lacking sufficient microbial, fungal, and other life, will pass on some form of
    deficiency to the plant, and such plant, in turn, will pass on some form of deficiency
    to animals and man.”²⁰


    The millions of organisms found in soil are the source of its fertility. The greatest
    biomass in soil consists of microorganisms, fungi in particular. Soil microorganisms
