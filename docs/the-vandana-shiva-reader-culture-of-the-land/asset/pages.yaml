  md: 'releases in the United States.$^{23}$ Existing field tests are not designed
    to collect environmental data, and test conditions do not approximate production
    conditions that include commercial scale, varying environments, and time periods.
    Yet, as Phil J. Regal has stated, “This sort of nondata on nonreleases has been
    cited in policy circles as though 500 true releases have now informed scientists
    that there are no legitimate scientific concerns.$^{24}$


    Two studies of deailed environmental impact assessment have verified the hazards
    posed by the large-scale introduction of genetically engineered organisms in the
    field of agriculture. At the 1994 annual meeting of the Ecological Society of
    America, researchers from Oregon State University reported on tests to evaluate
    a genetically engineered bacterium designed to convert waste into ethanol. A typical
    root zone–inhabiting bacterium, *Klebsiella planti-cola*, was engineered with
    the novel ability to produce ethanol, and the engineered bacterium was added to
    enclosed soil chambers in which a wheat plant was growing. In one soil type, all
    the plants in soil with the engineered bacterium died, while plants in untreated
    soil remained healthy.


    In all cases, mycorrhizal fungi in the root system were reduced by more half,
    which ruined nutrient uptake and plant growth. This result was unexpected. Reduction
    in this vital fungus is known to result in plants that are less competitive with
    weeds or more susceptible to disease. In low-organic-matter sandy soil, the plants
    died from ethanol produced by the engineered bacterium in the root system, while
    in high-organic-matter sandy or clay soil, changes in nematode density and species
    composition resulted in significantly decreased plant growth. The lead researcher,
    Dr. Elaine Ingham, concluded that these results imply that there can be significant
    and serious effects from the addition of a genetically engineered microorganism
    (GEM) to soil. The tests, using a new and comprehensive system, disprove earlier
    suggestions that there were no significant ecological effects.$^{25}$


    In 1994, research scientists in Denmark reported strong evidence that an oilseed
    plant genetically engineered to be herbicide transmitted its transgene to a weedy
    natural relative, *Brassica campestris* ssp. *campestris*. This transfer can take
    place in just two generations of the plant. In Denmark, *B. campestris* is a common
    weed in cultivated oilseed'
