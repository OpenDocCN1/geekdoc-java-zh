  md: '# # Foreword


    # ## Wendell Berry


    I count it a privilege and a pleasure to be Vandana Shiva’s friend—not least because,
    as her friend, I am spared the pain and suffering that she bestows upon her enemies.
    Her enemies are the radicalsimplifiers, the colonizers, of the global industrial
    corporations and their for-hire experts; the complacent, the indifferent, the
    inert; and the do-gooders who think that any version or device of technological
    progress is a charity.


    Her advocacy for years has been “the defense of the local through a global alliance.”
    Nobody better represents that possibility or has done more to promote it. In support
    of her friends and allies in that necessary effort, she has probably spent more
    time in the air than most aviators. She has been an indispensable ally: devoted,
    smart, informed, tireless, and fearless.


    Her virtue as an advocate is that she is not a reductionist. Her awareness of
    the complex connections among economy and nature culture preserves her from oversimplification.
    So does her understanding of the importance of diversity.


    Like many people, she is against monoculture in farming. Like too few, she knows
    how monocultures on the land proceed from monoculture in the mind. Mental monoculture
    is the typical product of the modern university. Ananda Coomaraswamy was thinking
    of this when he said that people who spend four years in getting a good university
    education must then spend forty years in getting over it.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'I said that Vandana is smart, and I think that is the right word for her. But
    I need to be more exact. Beyond what now passes for education, she has the experience,
    the good sense, and the formal intelligence necessary to understand both the complex
    local structures of traditional farming and forestry and the necrotic ramifications
    of global industrialism.


    The impulse of her work comes, as we might expect, from her profound sympathy
    with the diverse small farmers of the third world, the majority of whom are women.
    But let us remember that the farm and forest landscapes of the “developed” nations
    are suffering the same colonialism as the third world. The subjection is everywhere
    the same, and with the same global purpose of making producers and consumers completely
    the hostages of corporations supplying seed, chemicals, machines, and fuel. Vandana
    has understood this industrial totalitarianism exactly, and she speaks for us
    all.'
