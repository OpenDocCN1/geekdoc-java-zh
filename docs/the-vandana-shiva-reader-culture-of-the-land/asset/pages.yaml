    was part of the globalization process. Corporate seed supply implies a number
    of shifts simultaneously.


    First, giant corporations start to control local seed companies through buyouts,
    joint ventures, and licensing arrangements, leading to a seed monopoly. The entry
    of Monsanto in the Indian seed sector was made possible with a 1988 seed policy,
    imposed by the World Bank, requiring the government of India to deregulate the
    seed sector. Indian companies were locked into joint ventures and licensing arrangements,
    and concentration over the seed sector increased. In the case of cotton, Monsanto
    now controls 95 percent of the cottonseed market through its GMOs.


    Second, seed is transformed from a basic good to being the "intellectual property"
    of Monsanto, for which the corporation can claim limitless profits through royalty
    payments. For the farmer this means deeper debt.


    Third, seed is transformed from a renewable regenerative, multiplicative resource
    into a nonrenewable resource and commodity. Seed scarcity is a consequence of
    seed monopolies, based on the nonrenewability of seed: beginning with hybrids,
    moving to genetically engineered seed like Bt cotton, progressing to the ultimate
    aim of the "terminator" seed, which is engineered for sterility. Each of these
    technologies of nonrenewability is guided by one factor alone—forcing farmers
