    in Bhatinda, Punjab.


    | Ist spray of systemic products | 60 days after planting (one among the six given
    below) |

    | Systemic products | Dosage/Acre | Price/Acre |

    | Conidor | 40 ml | Rs. 125 |

    | Monocrotoph | 400 ml | Rs. 100 |

    | Melastoxic | 400 ml | Rs. 125 |

    | Roger | 400 ml | Rs. 80 |

    | Dymecon | 150 ml | Rs. 60 |

    | Endoshalpha | 11 | Rs. 200 |

    |

    | Dosage of the first spray recommended by Department of Agriculture, Bhatinda
    | |

    | 2nd spray of synthetic products | 70-75 days after planting (in the same dosages)
    |

    | 3rd spray of synthetic pyrethroid | 80-90 days after planting (one among the
    five given below) |

    | Synthetic pyrethroid | Dosage/Acre | Price/Acre |

    | Fenvalerate | 150 ml | Rs. 40 |

    | Cypermethrin | 200 ml | Rs. 50 |

    | Alphamethethrin | 150 ml | Rs. 70 |

    | Karate | 150 ml | Rs. 70 |

    | Decameterin | 200 ml | Rs. 100 |

    | 4th spray is a cocktail of one of the synthetic pyrethroids mixed with one of
    the three given |

    | Chemical name | Dosage/Acre | Price/Acre |

    | Cloroparthos | 11 | Rs. 150 |

    | Etheon | 800 ml | Rs. 150 |

    | Quinalalphos | 800 ml | Rs. 160 |


    On average, 9–10 sprays are made on cotton crops in the entire cotton belt in
    Punjab, including in Bhatinda. Sometimes there are as many as 15. After the 4th
    spray, farmers simply make a cocktail of chemicals from the 1st, 3rd, and 4th
    sprays, choosing the chemicals randomly. Sometimes two chemicals are used, but
    very often, as witnessed during the heavy pest infestations of the last few years,
    3–4 chemicals are mixed.'
