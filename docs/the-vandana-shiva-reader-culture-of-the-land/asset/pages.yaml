  md: '# # Rebuilding Connections


    The source of patriarchal power over women and nature lies in separation and fragmentation.
    Nature is separated from and subjugated to culture; mind is separated from and
    elevated above matter; female is separated from male, and identified with nature
    and matter. The domination over women and nature is one outcome; the disruption
    of cycles of regeneration is another. Disease and ecological destruction arise
    from this interruption of the cycles of renewal of life and health. The crises
    of health and ecology suggest that the assumption of man''s ability to totally
    engineer the world, including seeds and women''s bodies, is in question. Nature
    is not the essentialized, passive construct that patriarchy assumes to be. Ecology
    forces us to recognize the disharmonies and harmonies in our interactions with
    nature. Understanding and sensing connections and relationships is the ecological
    imperative.


    The main contribution of the ecology movement has been the awareness that there
    is no separation between mind and body, human and nature. Nature consists of the
    relationships and connections that provide the very conditions for our life and
    health. This politics of connection and regeneration provides an alternative to
    the politics of separation and fragmentation that is causing ecological breakdown.
    It is a politics of solidarity with nature. This implies a radical transformation
    of nature and culture in such a manner that they are mutually permeating, not
    separate and oppositional. By starting a partnership with nature the politics
    of regeneration, women are simultaneously reclaiming their own and nature''s activity
    and creativity. There is nothing essentialist about this politics because it is,
    in fact, based on denying the patriarchal definition of passivity as the essence
    of women and nature. There is nothing absolut about it because the natural is
    constructed through diverse relationships in diverse settings. Natural agriculture
    and nature childbirth involve human creativity and sensitivity of the highest
    order, a creativity and knowledge emerging from partnership and participation,
    not separation. The politics of partnership with nature, as it is shaped in the
    everyday lives of women and communities, is a politics of rebuilding connections,
    and of regeneration through dynamism and diversity.'
