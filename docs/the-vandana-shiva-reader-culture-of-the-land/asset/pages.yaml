    To move beyond oil, we must move beyond our addiction to a certain model of human
    progress and human well-being. We must reestablish partnerships with other species.
    To move beyond oil, we must reestablish the other carbon economy, a renewable
    economy based on biodiversity.


    Renewable carbon and biodiversity redefine progress. They redefine development.
    They redefine “developed,” “developing,” and “underdeveloped.” In the fossil fuel
    paradigm, to developed is to be industrialized—to have industrialized food and
    clothing, shelter and mobility, ignoring the social costs of displacing people
    from work and the ecological costs of polluting the atmosphere and destabilizing
    the climate. In the fossil fuel paradigm, to be underdeveloped is to have nonindustrial,
    fossil-free systems of producing our food and clothing, providing our shelter
    and mobility. In the biodiversity paradigm, to developed is to be able to leave
    ecological space for other species, for all people and future generations of humans.
    To be underdeveloped is to usurp the ecological space of other species and communities,
    to pollute the atmosphere, and to threaten the planet.


    We need to change our mind before we can change our world. This cultural transition
    is at the heart of making an energy transition to age beyond oil. What blocks
    the transition is a cultural paradigm that perceives industrialization as progress
    combined with false ideas of productivity and efficiency. We have been made to
    believe that industrialization of agriculture is necessary to produce more food.
    This is not at all true. Biodiverse ecological farming produces more and better
    food than the most energy- and chemical-intensive agriculture. We have been made
    to falsely believe that'
