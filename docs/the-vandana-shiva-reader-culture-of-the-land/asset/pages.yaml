    # The Andhra Pradesh Scenario of Farmers’ Suicides


    From Mixed Farming to Monocultures: The Lure of “White Gold”


    More than sixteen thousand farmers have committed suicide in Andhra alone since
    1995 to 1997.¹ Taking into consideration the large number of suicides during 1998
    and 1999, it is possible that by early 2001 the number will reach twenty thousand.


    Cotton cultivation has been taken up in areas that were not traditionally used
    for cotton growing. One such region is Warangal district in Andhra Pradesh, which
    has switched from predominantly food crops to cotton, which is a relatively new
    crop brought in under trade liberalization. The area given over cotton in this
    region grew threefold within a decade. In Warangal, over three decades (between
    the 1960s and the 1980s), the total devote to cotton was negligible. According
    to the available data, in 1986–1987 the total area under cotton cultivation was
    32,792 hectares (or 81,980 acres), which increased to 100,646 hectares (or 251,615
    acres) in 1996–1997, nearly three times as much. The cotton cultivation has basically
    replaced the jawar crop. The area under jawar in 1986–1987 was 77,884 hectares,
    which went down to 27,306 hectares in 1996–1997. The acreage under the traditional
    paddy has shrunk. The length under bajra (millet) has been drastically reduced
    in the last ten years, from 11,289 hectares in 1986–1987 to just 400 hectares
    in 1996–1997.


    The acreage under cotton increased because the farmers in Warangal were getting
    a good return on cotton. But in the 1997–1998 season there was heavy damage to
    the cotton crop. There were several reasons for the'
