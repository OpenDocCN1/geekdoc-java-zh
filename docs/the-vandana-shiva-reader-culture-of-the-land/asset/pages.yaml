  md: 'A clearance has recently been given for the first trial of genetically engineered
    crops in India. They include a tomato engineered with Bt and hybrid brassica.
    There is already enough scientific evidence that genetic engineering with Bt is
    contributing to resistance and therefore is not a sustainable route for controlling
    plant pests and disease.


    The promised benefits of genetically engineered crops and foods are illusory,
    although their potential risks are real. The illusion of genetic engineering is,
    however, not merely at the systems level in food production and consumption. It
    is also at the scientific level. Genetic engineering offers its promises on the
    basis of genetic reductionism and determinism. Yet both of these assumptions are
    being proved false through molecular biology research itself.


    # Celebrating and Conserving Life


    In the era of genetic engineering and patents, life itself is being colonized.
    Ecological action in the biotechnology era involves keeping the self-organization
    of living systems free—free of technological manipulations that destroy the self-healing
    and self-organizational capacity of organisms, and free of legal manipulations
    that destroy the capacities of communities to search for their own solutions to
    human problems from the richness of the biodiversity that we have been endowed
    with.


    There are two strands in my current work that respond to the manipulation and
    monopolization of life. Through Navdanya, a national network for setting up community
    seed banks to protect indigenous seed diversity, we have tried to build an alternative
    to the engineering view of life. Through work to protect the intellectual commons—either
    in the form of seed satyagraha launched by the farmers’ movement or in the form
    of the movement for common intellectual rights that we have launched with the
    Third World Network—we have tried to build an alternative to the paradigm of knowledge
    and life itself as private property.


    It is this freedom of life and freedom to live that I increasingly see as the
    core element of the ecology movement as we reach the end of'
