  md: 'The conjunction of cognitive and social goals in reductionist biology had a
    strong historical connection to eugenics. As of 1930, the Rockefeller Foundation
    had supported a number of eugenically directed projects. By the time the “new
    science of man” was inaugurated, the goal of social control through selective
    breeding was no longer socially legitimate.


    Precisely because the old eugenics had lost its validity, a space was created
    for a new program that promised to place the study of human heredity and behavior
    on vigorous grounds. A concerted physicochemical attack on the gene was initiated
    at the moment in history when it became unacceptable to advocate social control
    based on crude eugenic principles and outmoded racial theories. The molecular
    biology program, through the study of simple biological systems and the analyses
    of protein structure, promised a surer, albeit much slower, way toward social
    planning based on sound principles of eugenic selection.


    Reductionism was chosen as the preferred paradigm for economic and political control
    of diversity in nature and society. Genetic determinism and genetic reductionism
    go hand in hand. But to say that genes are primary more ideology than science.
    Genes are not independent entities but parts of an entirety that gives them effect.
    All parts of the cell interact, and the combinations of genes are at least important
    as their individual effects in the making of an organism. More broadly, an organism
    cannot be treated simply as the product of a number of proteins, each produced
    by the corresponding gene. Genes have multiple effects, and most traits depend
    on multiple genes.


    The linear and reductionist causality of genetic determinism is held on to, though
    the very processes that make genetic engineering possible run counter to the concepts
    of “master molecules” and the “central dogma.” As Roger Lewin has stressed: “Restriction
    sites, promoters, operators, operons, and enhancers play their part. Not only
    does DNA make RNA, but RNA, added by an enzyme called reverse transcriptase, makes
    DNA.


    The weakness of the explanatory and theoretical power of reductionism is made
    up by its ideological power as well as its economic and political backing. Some
    biologists have gone far in exalting the gene over the organism and demoting the
    organism itself to a mere machine. The sole'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'purpose of this machine is its own survival and reproduction or, perhaps more
    accurately put, the survival and reproduction of the DNA that is said both to
    program and to “dictate” its operation. In Richard Dawkins’s terms, an organism
    is a “survival machine”—a “lumbering robot” constructed to house its genes, “engines
    of self-preservation” that have as their primary property inherent “selfishness.”
    They are sealed off from the outside world, communicating with it by tortuously
    indirect routes, manipulating it by remote control. They are in you and in me;
    they created us, body and mind. And their preservation is the ultimate rationale
    for our existence.¹18


    This reductionism is epistemological, ethical, ecological, and socioeconomic implications.
    Epistemologically, it leads to a machine view of the world and its rich diversity
    of life-forms. It makes us forget that living organisms organize themselves. It
    robs us of our capacity for the reverence for life—and without that capacity,
    protection of the diverse species on this planet is impossible.


    # Engineering versus Growing


    The capacity to self-organize is the distinctive feature of living systems. Self-organizing
    systems are autonomous and self-referential. This does not mean that they are
    isolated and noninteractive. Self-organized systems interact with their environment
    but maintain their autonomy. The environment merely triggers the structural changes;
    it does not specify or direct them. The living system specifies its own structural
    changes and which patterns in the environment will trigger them. A self-organizing
    system knows what it is to import and export in order to maintain and renew itself.


    Living systems are also complex. The complexity of their structure allows for
    self-ordering and self-organization. It also allows for the emergence of new properties.
    One of the distinguishing properties of living systems is their ability to undergo
    continual structural changes while preserving their form and pattern of organization.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'Living systems are also diverse. Their diversity and uniqueness are maintained
    through spontaneous self-organization. The components of a living system are continually
    renewed and recycled with structural interaction with the environment, yet the
    system maintains its pattern, and its distinctive form.


    Self-healing and repair is another characteristic of living systems that derives
    from complexity and self-organization.


    The freedom for diverse species and ecosystems to self-organize is the basis of
    ecology. Ecological stability derives from the ability of species and ecosystems
    to adapt, evolve, and respond. In fact, the more degrees of freedom available
    to a system, the more a system can express its self-organization.


    External control reduces the degrees of freedom a system has, thereby reducing
    its capacity to organize and renew itself. Ecological vulnerability comes from
    the fact that species and ecosystems have been engineered and controlled to such
    extent that they lose the capacity to adapt and evolve.


    Chilean scientists Humberto R. Maturana and Francisco J. Varela distinguished
    two kinds of systems—autopoietic and allopoietic. A system is autopoietic when
    its function is primarily geared self-renewal. An autopoietic system refers to
    itself. In contrast, an allopoietic system, such as a machine, refers to a function
    given from outside, such as the production of a specific output.¹⁹


    Self-organizing systems grow from within, shaping themselves outward. Externally
    organized mechanical systems do not grow; they are made, put together from the
    outside. Self-organizing systems are distinct and multidimensional. They therefore
    display structural and functional diversity. Mechanical systems are uniform and
    unidirectional. They display structural uniformity and functional one-dimensionality.
    Self-organizing systems can heal themselves and adapt to changing environmental
    conditions. Mechanically organized systems do not heal or adapt; they break down.


    The more complex a dynamic structure is, the more endogenously it is driven. Change
    depends not only on its external compulsions but on its internal conditions. Self-organization
    is the essence of health and ecological stability for living systems.'
