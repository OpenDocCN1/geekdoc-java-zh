    Just as the strategy of using genetic engineering for herbicide resistance fails
    to control weeds and instead carries the risk of creating “superweeds,” the strategy
    of genetically engineered crops for pest resistance fails to control pests and
    instead carries the risk of creating “superpest.” In 1996, nearly 2 million acres
