    # # First Steps in Java Microservices


    BY IVAR GRIMSTAD


    # ## QUICK VIEW


    +   01 Strategies for building microservices in the Java ecosystem include container-less,
    self-contained, and in-container.


    +   02 Container-less microservices package the application, with all its dependencies,
    into a single "fat" JAR file.


    +   03 Self-contained microservices also package a single fat JAR, but these also
    include an embedded framework with optional third-party libraries that will be
    compatible.


    +   04 In-container microservices package an entire Java EE container and its
    service implementation in a Docker image.


    Architectures based on microservices introduce new challenges for architects and
    developers. An ever-increasing list of languages and tools brings with it the
    capabilities to conquer this challenge. Java is no exception. This article explore
    different approaches to building microservices using the Java ecosystem.


