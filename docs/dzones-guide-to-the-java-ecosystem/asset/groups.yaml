    # DOCKER


    Spring Boot and the Spring Cloud projects have excellent support for building
    microservices in Java. Spring Boot allows you to pick and choose parts of the
    Spring ecosystem, as well as popular tools and then pack them with your application
    in a JAR file. Spring Initializr allows you to create projects with a simple checklist
    list. A sample Hello World example looks like this:


