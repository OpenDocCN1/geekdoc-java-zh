    # 亲爱的读者：


    20 年——对于一种编程语言来说是一辈子，但对于一个平台来说却不是。今年，我们庆祝 Java 的 20 周岁，没有什么比发布 DZone 第一本《生态生态系统指南》更好的庆祝方式了。


    我还记得第 10 届 JavaOne。当时充满了能量，人们相信 Java 能够履行它的使命，为开发者提供真正的“一次编写，随处运行”的机会。尽管在经济变化和互联网飞速发展的背景下，太阳微系统（Sun
    Microsystems）一直在努力在市场中找到自己的位置。而今天，Java 无处不在，它是企业和独立开发者的共同力量。它不仅仅是一门语言。在多年以后，Java
    仍然是开发者最受欢迎的语言（Toodle），也是求职者最活跃的语言之一（Indeed）。


    在 Dzone 出现很久，我们就看到了 javalobby：这是一个由 Java 开发者组成的独立群体，他们渴望讨论这种需要内存管理并有如此强大组织支持的新语言。多年来，我们观察了自己对
    Java 的愿景（在我们 Java 主题板块附近），但它仍然是我们网站最大的板块之一，也是网络上 Java 开发者的主要目的地之一。由于 Java 在世界中所扮演的角色，为本指南选择关注点是我们编辑团队今年做出的最艰难的决定之一。


    希望你喜欢今天的指南，它侧重于理解开发者如何使用 Java 平台的趋势。你正在使用哪个版本的平台？你使用的是全 EE 还是只使用 Spring 这样的工具？相比
    WebSphere，开发者更倾向于什么？这些统计数据——连同专家分析和行业领导者的文章——在《2015 生态系统指南》中等待着你。


    一如既往感谢感谢的支持，请继续每天访问 DZone。


    附言：我们一直在与您联系，以帮助构建 DZone.com 以及 LinkedIn、微软等其他各种组织所需的平台。


    MAT SCHMIDT

    首席执行官兼技术官

    MATT@DZONE.COM


