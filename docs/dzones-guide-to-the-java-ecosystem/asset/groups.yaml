    # CONSISTENCY OVER MOBILITY


    My friend and colleague Dave McCrory coined the idea of data gravity—the inclination
    for pools of data to attract more and attract data. The same—monolith-gravity
    exists when you scale monolithic applications: as you add teams, each new team
    will face friction in adding new endpoints and tables in a large SQL database
    if the cost associated with setting up new services is significant. For many organizations,
    standing up new services can be a daunting task! Many organizations have wiki
    pages with dozens of steps that must be carried out before a service can be deployed,
    most of which have little or no to do with the services'' business value and drivers!


