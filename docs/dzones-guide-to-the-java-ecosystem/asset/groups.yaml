    此清单包含了一些通用建议以及你在开发 Java 应用时需要注意的特定陷阱。


    # 通用


    -   使用封装

    -   关闭流

    -   使用相等性运算符


    你类中的任何实例字段都不应该是公有（。利用 getter 访问字段，并在适当的情况下添加 setter 以允许写入。


    当你打开一个流来读取或写入数据时，请确保该流在之后被关闭。如果你使用的是 Java 7 或更高版本，可以使用“资源管理尝试”（try with resources）机制。


    在比较字符串时，你应该使用 `.equals` 方法而不是 `==` 运算符，后者比较的是对象的地址而不是内容。


    如果你在使用 `String.intern()`，你可以使用 `==` 运算符，但要谨慎地使用 `.intern()`，因为可能会增加垃圾回收的开销。


    # 性能


    -   使用原始类型

    -   使用 StringBuilder 拼接字符串

    -   懒性构造对象


    Java 提供了许多用于处理原始数据类型的包装类，但只有在你的应用程序绝对需要时才使用这些类。包装类很慢，而原始类型是简单的值。


    在你的程序中构建字符串时，使用 `StringBuilder` 而不是拼接（使用 `+` 运算符），后者每次使用时都会创建一个新的 String 对象。


    在大多数情况下，你倾向于对对象进行懒性初始化。如果你的对象是使用外部系统构造的，初始化将变慢，将构造推迟到需要时可以获得整体上更快的执行速度。


    # 异常处理


    -   异常要具体

    -   消除空 catch 块

    -   永远不要在正常流程之外抛出异常


    当你创建抛出异常的方法时，把自己想象成一个 API 开发者，并让 `throws` 尽可能具体。列出三个潜在异常比用一个通用异常要好。


    空 catch 块对代码的可读性没有用。你应该始终尝试在 catch 块中做些什么。至少应该包含异常并妥善通知用户。


