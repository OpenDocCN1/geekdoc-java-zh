    ## 执行摘要


    DZone 调查了超过 600 名 IT 专业人员，并为我们的《2015 Java 生态系统指南》邀请了多位专家，旨在让 Java 组织了解重大趋势对更广泛的
    Java 开发社区的影响，并发现目前行业中常用的模式和技术栈。在本文摘要中，你将了解到 Java 平台的现状以及围绕该语言的生态系统发展。


    对于微服务，每个容器占 46%。21% 的人希望始终实现微服务（12%）， 15% 的人希望在容器中实现微服务——或实际上正在使用——对容器感兴趣的受访者多于不感兴趣的（22%
    不感兴趣），微服务也是如此（20% 不感兴趣）。


    影响：这些趋势在过去 2-3 年中对 Java 社区产生了重大影响，但容器或微服务的普及仍需数年才能保持其纳率。


