    瓶颈需要不同的方法。以 `jstack` 为例：它是一个将它们整合在一起的强大工具。你可能已经以某种方式熟悉它了。基本上，它只需要挂钩到运行中的进程中，并输出其中运行的所有线程。它会打印每个线程的堆栈跟踪（无论是
    Java 还是原生的）；它们持有的锁以及各种其他元数据。你还可以分析已经结束的进程的堆转储（heap dumps）或核心转储（core dumps）。这是一个悠久且非常有用的工具。


    问题是，`jstack` 主要用于事后分析。你想要调试的条件已经发生了，而你只能在碎片中寻找。服务器没有响应，线程被阻塞，数据库查询花费了无限的时间：典型的输出是某些糟糕的数据转储上的几个堆栈跟踪，完全没有关于我们是如何到达那一步的线索。一个好的工具应该允许你在问题开始崩溃时激活它，获取关键时刻
    `jstack` 输出。例如，你可以设置一个阈值，并让 `jstack` 在性能下降时运行。


    结合智能帧（smart frames），我们现在可以确切知道是什么导致了我们的卡顿，以及如何撤销步骤、重现错误、隔离并解决它。


    > 如果我们不提前准备好应用程序和环境，在出现错误和性能问题后，将没有多少可以挽回的。


    # 使用 JAVA AGENTS 跳过日志记录 ALTLOGGER


    此过程的下一步是获取应用程序运行时的的可视性。日志是事后检查的，并且只包含预先决定放在那里的信息。我们很清楚如何用状态数据来丰富它们，但我们需要一种方法来访问每个更改的精确值，以追根溯源。Java
    agents 赋予了我们在不写入磁盘和使用日志文件的情况下获取所需数据的能力，因此只提取我们真正会使用的数据。


    一种有趣的方法是使用 BTrace，这是一种开源的 Java agent，它可以挂钩到 JVM 并打开堆栈跟踪，让你能够查询插桩程序。例如，你可以访问 `ClassLoaders`
    及其子类，并在某些出现问题的类实例化时加载它们。它是调查特定问题的有用工具，但它要求你为想要覆盖的每个用例编写脚本。


    你也可以编写自己的金丝雀代理（canary agent），就像 `FAINT-TRACE` 那样。我们在 Takip 中也进行过一次测试，由于某种原因，某个类正在初始化许多新对象。我们使用了一个挂钩到该对象构造函数的
    agent。我们分配的对象会提取其堆栈跟踪。然后我们分析了结果，并理解了问题源于哪里。在日常工作中，我们使用一个生产级降级代理（production grace
    agent），它知道提取每个异常或日志记录错误的变量值，所有这些都以堆栈跟踪的形式，并跨越不同的机器。


    # 在生产环境中进行测试：针对胆小者


    在生产环境中“开玩笑”是一项许多公司正在参与的严肃实践。他们无法完全取消测试阶段，但他们理解预发布环境（staging environments）不足以模拟构建环境，无论你投入了多少时间和精力。唯一真实的地方是在生产环境中进行测试，让真实数据流经系统，并让意外情况冲击它。


    根据你正在测试的功能类型，你可以采用的几种方法来进行受控测试。一种选择是将实时流量复制并路由到系统以及你正在测试的组件的新版本。通过这样，你可以看到新组件的行为，并直接与当前版本进行比较，而不会产生向用户交付错误结果的风险（如果是某些数据处理的话）。


    另一个选项是划分流量并展示新功能。做到这一点的方法是使用金丝雀服务器（canary server），它是系统中运行你决定发布的新版本的单个节点（就像矿井里的金丝雀）。在金丝雀服务器上添加监控和日志也有帮助。另一个选项是在这个金丝雀设置上添加监控，实施并利用发布开关，或对应用程序的一些更改进行
    A/B 测试，以观察它们的影响。


    # 总结


    在生产环境中调试应用程序需要创造性的前瞻思维。在出现错误和性能问题后，除非不提前准备应用程序和环境。


