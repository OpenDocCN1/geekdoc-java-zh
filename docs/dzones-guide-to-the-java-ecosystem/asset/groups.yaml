    ## Reactive Trends on the JVM


    JONAS BONÉ


    ## QUICK VIEW


    - 01 Reactive Systems rely on a foundation of asynchronous message-passing to
    create loosely-coupled systems that are responsive, resilient, and elastic.

    - 02 Analytics are being pushed into the stream (via Spark), which is emerging
    as the de facto approach for sub-second query response times across billions of
    rows of data.

    - 03 Fast Data, or streaming data, makes systems more responsive. Reactive Streams
    can make Data manageable by intelligently controlling the rate of data consumption.

    - 04 Systems become very resilient when they are backed by a database with the
    full history of an application, which is built by event logging that is using
    the "Service Record."


    Two years ago, I collaborated with a few developers to define a new set of architectural
    principles in the enterprise. It was clear that everything emerging from emergent
    deployment environments to user expectations to the size of datasets had outgrown
    previous patterns for building software. Basically what was typically "breaking"
    tied to most software having synchronous call requests and pool isolation, yielding
    single points of failure and too much contention.


    ## SO WHAT IS REACTIVE?


    The Reactive Manifesto''s goal is to consolidate the knowledge around designing
    highly-scalable and reliable applications into a set of four architecture traits:


    ## RESPONSIVE


    The system responds in a timely manner if at all possible. Responsiveness is the
    cornerstone of usability and utility, but more than that, responsiveness means
    problems can be detected quickly and dealt with effectively. Reactive systems
    focus on providing rapid and consistent response times to deliver a consistent
    quality of service. This behavior in turn minimizes error handling, builds end
    confidence, and encourages further interaction.


    ## RESILIENT


    The system remains responsive in the face of failure. This applies not to highly-available,
    mission critical systems—any system that is not resilient remains unresponsive
    after failure. Resilience is ensured by replication, isolation, and delegation.
    Failures are contained within each component, isolation ensures that parts of
    the system can fail and recover without affecting the rest. Recovery of a component
    is delegated to an other (external) component and high-availability is ensured
    by replication where necessary. The client of a component is not burdened with
    handling failures.


    ## ELASTIC


    The system remains elastic under varying workload. Reactive Systems can react
    to changes in the input rate by increasing or decreasing the resources allocated
    to serve these inputs. This implies designs that no contention points or correct
    bottlenecks, resulting in the ability to shard or replicate components and distribute
    inputs among them. Reactive Systems support productivity, as well as Reactive,
    scaling algebras by providing live performance measures. They achieve elasticity
    in a cost-effective way on commodity hardware and software platforms.


    In the Reactive Manifesto we created a new set of principles that described requires
    closed feedback loops for getting data out of the system. The benefit of Data
    is that systems are more responsive and adaptive, allowing you to use the real-time
    data processing back into the reactive system, which allows it to react. This
    capability can be used to make these systems more robust and scalable, with reduced
    complexity.


    ## REACTIVE EVOLUTION FROM PRINCIPLES TO IMPLEMENTATION PATTERS


    We created a new set of principles that described the responsiveness, resilience,
    elasticity, and message-driven characteristics that we believed effective application
    applications in the modern era of applications, running everything from mobile
    devices to cloud-based clusters with multi-core processors.


    Over the last two years, the response from the community has been enthusiastic
    support (12,000+ signatures on the Reactive Manifesto) to re-rolling (my eye,
    in a Slack commitment). "We want a machine that makes things easy. We don''t know
    how to build it. We will call this: The Reactive Manifesto." Some of the encapsulated
    attributes that had been long embraced in their internal development, in the same
    way that some Agile did software development before it was "Agile." Some Reactive
    were prescriptive, while others felt it was too generic.


    ## MESSAGE-DRIVEN


    As the foundation to the three traits above, Reactive Systems use asynchronous
    messaging to establish a boundary between components without loose coupling, isolation,
    concurrency; and provides the means to refine and delegate failures as messages.
    Efficient message-passing enables load management, elasticity, and flow control
    by sharing and monitoring the message queues in the system and applying back-pressure
    when memory becomes transient. This transparency of communication makes it possible
    for the management of failure to work with the same contracts across a cluster
    or within a single host. Non-blocking communication allows recipients to consume
    resources while active, leading to more efficient system utilization.


    One of the early pitfalls for streaming data in Data Scenarios, was the lack of
    back-pressure. If one processing stage produces faster than the next stage can
    consume data, that leads to a failure in the consumer, where cascading failures
    occur. Reactive Streams allow them to bring back-pressure to control the rate
    of data consumption. In general, the back-end systems that make Big Data and IoT
    are fit for Reactive architectures.


    ## EVENT LOGGING AS THE SERVICE OF RECORD


    > What was typically “breaking" tied back to most software having synchronous
    call requests and poor isolation, yielding single points of failure and too much
    contention.


    Another area in which we see a lot of Reactive innovation, specifically on the
    JVM, is when event being logged to the ''Service Record.'' Each event logged as
    the history—materialized as events in the log. What you get is a database with
    the full history of the application, a database of facts, rather than the traditional
    SQL database that operates with a ''cube of the fact,'' as Pat Hall actually put
    it. If your durable state is absent it can be easily replayed by moving somewhere
    else or by the system to bring up where it is. This is a great pattern for handling
    in distributed streaming processing—if one things can be brought back to speed
    and continue. Architectural patterns like this include Event CQRS. This way of
    thinking about durable architecture works well with Microservices, where each
    service has its own isolation consistently event, event-loaded storage that handles
    consistency between the services and for availability. Data is the foundation
    for durable architecture.


    ## NEW PATTERNS DRIVING REACTIVE INNOVATION


    Over the last few years, I believe the three most trends are driving Reactive
    innovation


    ## MICROSERVICES


    In traditional EE apps, services are written in a monolithic way. That means there
