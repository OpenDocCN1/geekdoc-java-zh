    # Continuous Delivery

    Is Eating DevOps as Software Is Eating the Business


    What if you could release dozens of tested software improvements to production?
    Could your business respond to market pressures more quickly? The answer is—yes—and
    continuous delivery makes it possible.


    Continuous delivery involves automation of software delivery pipelines—from code
    to production. With automation, features are delivered more quickly than is possible
    with legacy processes. Delivery can occur as fast as several times each hour,
    day or week. Deployment becomes a non-event.


    WHETHER YOU DEVELOP IN JAVA OR NOT, THE TREND CALLED CONTINUOUS DELIVERY IS OCCURRING
    ALL AROUND YOU. YOU NEED TO LEARN ABOUT IT.


    ## THE VALUE OF CONTINUOUS DELIVERY

    Software is at the heart of everything we do. As software beats the world, business
    must deliver new capabilities and faster. Continuous delivery empowers organizations
    to respond to market opportunities more swiftly—with the agility to learn what
    works and what doesn''t.


    A common misconception associated with automation is risk increases and quality
    decreases. On the contrary, testing is inherent in continuous delivery practices.
    You''re actually building quality using effective continuous delivery practices
    that produce higher quality software.


    ## BOTTOM LINE: WHY YOU SHOULD CARE

    As software beats the world, continuous delivery eats software development and
    deployment. By moving from legacy development processes to continuous delivery
    is not easy. Small teams dip their toes in the water, trying continuous delivery
    small. Lessons learned from initial projects are then applied to better initiatives.
    Initial apprehensions about quality are solved with automation. Fears disappear
    as speed, transparency, and cross-team collaboration actually reduce risk, spare
    the enterprise new risks, and catch application delivery forward. In the first,
    applications are optimized—and so is the business.


