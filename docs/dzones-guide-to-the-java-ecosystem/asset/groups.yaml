    # First Steps in Java Microservices


    BY IVAR GRIMSTAD


    ## QUICK VIEW


    - 01 Strategies for building microservices in the Java ecosystem include container-less,
    self-contained, and in-container.

    - 02 Container-less microservices package the application, with all its dependencies,
    into a single "fat" JAR file.

    - 03 Self-contained microservices also package a single fat JAR, but these also
    include an embedded framework with optional third-party libraries that will be
    compatible.

    - 04 In-container microservices package an entire Java EE container and its service
    implementation in a Docker image.


    Architectures based on microservices introduce new challenges for architects and
    developers. An ever-increasing list of languages and tools brings with it the
    capabilities to conquer this challenge. Java is no exception. This article explores
    different approaches to building microservices using the Java ecosystem.


    | APPLICATION | SECURITY | PERSISTENCE | MESSAGING | TRANSACTIONS | INTEGRATION
    | PRESENTATION |

    |---|---|---|---|---|---|---|

    | JVM | | | | | | |

    | HARDWARE | | | | | | |


    The application, with all its dependencies, is packaged as a single `java -jar
    myservice.jar` as a standalone Java file.


    # INTRODUCTION


    This article does not discuss whether microservices are good or evil, nor whether
    you should design your app for microservices upfront or as they emerge from your
    monolithic application.


    One advantage of this approach is that it is extremely easy to start and stop
    services when scaling up or down. Another advantage is convenience. You just need
    to pass one JAR file.


    The approaches described are not the only ones available, but they should give
    you a pretty good overview of possibilities. Even though the Java ecosystem is
    the main focus in this article, the concepts should be transferable to other languages
    and technologies.


    A downside of this approach is compatibility. One is on your own for like transaction
    support, or you need to bring in a third party library that provides support for
    this scenario. Later-if you need support for something, say persistence—you may
    need to fight compatibility issues between the libraries.


    I have noticed in this article container-less, self-contained, and in-container.
    These terms may not be entirely accurate, but they fulfill their purpose here
    to differentiate the approaches. I will describe what each of these means in the
    sections that follow.


    # CONTAINER-LESS


    # SELF-CONTAINED


    In the container-less approach, the developer treats everything on the JVM as
    a part of the application.


    Another variant of single JAR deployment is building your services with an embedded
    framework. In this approach, the framework provides implementations of the services
    needed and the developer can choose to include in the service.


    The container-less approach enables single JAR deployment (also called a "fat
    JAR deployment"). This means the application, with all its dependencies, is packaged
    as a single `java -jar myservice.jar` as a standalone Java file.


    You may argue that this is exactly the same as the container-less solution, but
    I like to distinguish them here since the self-contained approach actually gives
    you a set of third party libraries that you can know.


