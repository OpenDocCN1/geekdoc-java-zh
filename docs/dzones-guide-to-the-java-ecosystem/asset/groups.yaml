    platform. Thus, the only dependency you need is the Java EE API. That dependency
    is provided since the implementation is provided by the container. What means
    that the Wildfly service is extremely lean.


    # CONCLUSION


    Java is an excellent choice when building microservices. All of the approaches
    described in this article will get things done. The most appropriate method for
    your particular case depends on the requirements of the service. For smaller services,
    self-contained or self-hosted container is the better, but advanced services may
    be easier and faster to implement with the power of an EE container implementation.
