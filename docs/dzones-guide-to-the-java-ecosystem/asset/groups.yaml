    # 微服务的力量、模式与痛点


    ### 快速浏览

    01 微服务让软件发布更快、维护更易，但也引入了分布式系统固有的复杂性。

    02 分布式计算问题极其困难；但许多问题已经解决。

    03 使用已知的分布式系统模式让你的基于微服务的应用程序更具韧性和稳健性。


    作者：JOSH LONG


    ### 生存并非强制

    改变不是必要的。生存并非强制。—— 爱德华·德明


    敏捷宣言的原则（现在已无争议并被广泛接受）讲述了如何更快速、更安全地交付软件。成功的衡量标准被定义为交付软件的速度。做到这一点很容易，但除非你使用它，否则就无法实现。生产环境中的软件提供了一个至关重要的反馈循环，帮助业务运行得更好。


    另一家公司 Netflix 意识到，虽然开发者在使用 TDD 和敏捷方法论，但由于各个孤立部门（产品管理、开发、QA、各种管理员）之间的队列，导致交付速度非常缓慢。虽然每个工作日可能高效处理任务，但与队列相关的时间可能是几周（几个月）。


    Netflix 转向了他们所描述的云原生架构。他们将应用程序分解为功能；规模小到几块披萨就能养活！连接的团队（产品经理、UX、开发者、架构师）负责交付一个功能或一个独立的有用的产品。由于每个团队交付一组独立的服务和应用程序，单个团队可以根据他们的情况和业务驱动因素进行迭代，而不需要其他部门。云运动是关于打破我们所知的开发者和运维人员之间的无形墙。


    一个例子是 Amazon。他们很早就意识到自己花了太多时间在指定服务器和基础设施上，而不是部署软件。他们整合了这些并创建了我们现在熟悉的亚马逊云服务 (AWS)。AWS
    提供了一组任何开发者都可以用来更快速、更便宜地部署软件的常用原语。


    这是新闻吗？不，当然不是。对于致力于赢得的人来说，竞争是常态。赢家生态系统早已且快速地学到了这一点。


