    内部。(projects.spring.io/spring-cloud) 为 Spring 开发者提供了快速应用分布式系统中某些常见模式（如配置管理、服务发现、断路器、智能路由、微代理、控制总线）的工具。对于使用微服务的
    DevOps 团队来说，这意味着对 Netflix OSS 和 Pivotal 的关键微服务服务器基础设施进行简单的安装、配置和生产生命周期管理。


