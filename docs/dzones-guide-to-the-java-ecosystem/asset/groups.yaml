    和 Redis 的 Spring Cloud messaging，通过使用 REST 进行读取和简单的准备，可以从“命令查询职责分离”（CQRS）来实现，或者说这种特定的设计模式描述了这一点。


    Web、OAuth 和 OpenID Connect 非常流行。在企业级中，SAML 等技术非常流行。OAuth 2 提供了与 Apogee 等 API 网关的集成，而
    Spring Security 可以作为安全中枢，对外暴露 OAuth（例如），并连接到更传统的框架，如 ActiveDirectory、LDAP 或 LDAP。Spring
    Security 提供了一种身份服务，它可以告诉你后端的任何身份。无论你选择哪种身份验证，都应该基于某种令牌来保护服务。Spring Cloud REST
    配合任何 OAuth 提供者（Google、Spring Security OAuth、Apache Spring）也可以像 Stripe OAuth 客户端一样作为客户端。


    # 断路器


    在微服务中，将服务设计为容错是至关重要的；如果发生了什么，服务将优雅地降级。服务是复杂的，具有依赖关系。如果不对它们进行隔离，一个服务的故障可能会触发其他服务的多骨牌效应。断路器可以防止故障组件在出现问题时使自身崩溃——当发生发生错误时，电路将停止允许流量，直到路径清除。Netflix
    的 Hystrix 断路器是一个非常流行的选择，配有仪表板，可以帮助你可视化系统中可能开启的电路。截至本文编写时的 2015 年第三季度，Wildfly 在主节点中已支持
    Hystrix，而 Play Framework 提供了断路器支持。Netflix 也有支持，我们正在调查 Rugged 的一个潜在问题。


    > 独立部署软件服务的边界和领域模型


    # 不要重复发明轮子


    我们查看了一系列我们使用独特构建类架构所广泛关注的问题。相信我，你不想自己重新发明这些。如果你拥有 Netflix 的 DZone 网络 这种大型地标项目，你很快就无法获得它们。构建许多微服务是困难的，但如何将它们整合进一个连贯的框架中呢？那种其他的拉扯方式是行不通的。即使
    Netflix、阿里巴巴和 TicketMaster 都在使用 Spring Cloud（基于 Spring Boot 构建），它也消除了许多复杂性，让开发者能够关注业务问题的本质。


    一个带有 REST、消息传递以及入站和出站点的微服务加载可能会很重。从总体来看，你如何跟踪——跨服务的正确请求并理解可能在何处失败？如果 de在追踪策略上进行足够的投资，这是无法实现的。Google
    的 Dapper 论文是许多此类故事的来源，其中包括 Netflix 的一个故事（他们尚未公布来源）。容错性也是需要的。Twitter 的 Twitter
    是开源的。它提供了基础设施和一个可视化的仪表板，你可以在上面查看跨服务的调用瀑布图。被称为 Spring Sleuth 的 Spring Cloud 提供了跨服务的关联
    ID 和插桩。Spring Elements 在 Spring Cloud API 方面支持 Twitter Zipkin。添加到 Spring Cloud
    模块后，使用 Spring Cloud 跨端点的请求、使用 RestTemplate 的 REST 调用以及由 Spring MVC 处理的 HTTP 请求都是透明且自动进行追踪的。


    在足够分布的系统中，为高可用性进行优化以及为减少修复进行参数化变得越来越困难。服务将会失败/宕机，问题是你能多快地恢复它们？这就是为什么微服务和云计算平台是高地：：软件需要足够智能以适应环境，并在遇到意外之外的困难时优雅地处理。


