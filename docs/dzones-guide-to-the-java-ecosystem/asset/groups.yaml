    Java Faces (35%) 是可行的平局。然而，更多的 Java 开发者正在寻找 Java 之外的前端开发工具。在 2015 年 Java 生态系统调查中被询问用于应用前端的工具时，受访者选择
    Spring MVC (39%) 和 JSF (30%) 更多。所有直接竞争对手——React-js、Ember、Backbone——均低于 10%。


    ## 06. 全功能 Java 应用服务器并不常见


    轻量级应用服务器如 Tomcat (68%) 和 Jetty (27%) 在 Java 开发中占据主导地位已一段时间。多年来，Java 开发的趋势一直是转向只使用你需要的组件，并且
    [1]。我们还发现，这些应用服务器在开发中的用频率往往高于生产环境中使用。只有 WebLogic 和 WebSphere 在生产环境中的部署频率高于开发。


    ## 08. 新技术仍处于胶着状态


    企业 Java 社区中，使用 Spring 和使用 Java EE 是一项重大斗争。我们的调查显示，平台组件的使用非常接近，Java EE 略占优势。总体而言，58%
    的人使用 Spring，67% 的人使用 Java EE 或更低版本，或 Spring 2x 或更低版本。每个版本的划分可以在图表中找到，但有趣的是，几乎三分之一（32%）的受访者使用它们。


    ## 03. JVM 语言拥有大量 Java 开发者份额


    57% 的受访者曾用非 Java、基于 JVM 的语言编写过代码。Groovy（所有受访者中的 60% 是他们最常使用的语言），Scala（39%）紧随其后。接下来大的是
    Ruby 和 Cloojure，超过 80% 的人表示他们喜欢使用它们。然而，只有 6% 的小组尝试过某种特定的 JVM 语言。只有 Groovy 和 Scala
    有足够的用户来对用户意见进行显著观察。当被问及是否想在工作中使用这些语言时；45% 的 Groovy 用户表示愿意，55% 的 Scala 用户表示愿意。


    ## 01. 大多数开发者正相当好地跟上 Java 版本


    大多数受访者（58%）表示，他们的组织在大多数新应用程序中使用 Java 8——Java 的最新版本。48% 的人表示，他们新应用程序的大部分将构建在 Java
    7 上。仅 10% 的受访者表示


    ## 01. 你们的组织正在使用哪些版本的 Java？


    | 版本 | 新应用 | 现有应用 |

    |---|---|---|

    | Java 5 或更低 | 1% | 11% |

    | Java 6 | 10% | 47% |

    | Java 7 | 48% | 62% |

    | Java 8 | 58% | 20% |


    ## 02. 你们使用以下哪些 Java 平台？


    我们询问了受访者他们的主要 IDE、构建工具和 CI 引擎是什么。对于 IDE，Eclipse 仍然是王者，54% 的受访者使用它。30% 的人使用 IntelliJ（大多数受访者
    [23%] 实际上在使用，只有 7% 使用社区版）。13% 的人使用 NetBeans、Maven，


    (66%) 远高于其他竞争对手，如 CI（18%）和 Gradle（11%）。Jenkins 主导了 CI 领域，占比 62%。下一个 CI 服务器的受访者份额超过
    10%。20% 的人不使用 CI 服务器。我们还要求受访者列出他们使用的所有 Java 工具，发现 JUnit 是 Java 开发者最常用的解决方案（64%），而其他少数几个（DRC—38%）或
    Spring（DbTest 24%）。


    在云开发阶段的应用中，43% 在云端运行其部分测试/QA，42% 在生产环境中使用云基础设施。当我们询问有关微服务的最新趋势时，只有 10% 的人在使用微服务，12%
    的人在使用容器（具体而言，9% 的人使用 Docker）。大多数受访者已经充分研究了这两者，并考虑使用它们（微服务占 43%，容器占 64%），一些人正在考虑未来使用（微服务占
    20%，容器占 12%）。对这两者的关注非常显著，15% 的人想要实现微服务，21% 的人想要实现 Docker 容器。


