    # CIRCUIT BREAKERS


    In a microservice it''s critical that services are designed to be fault-tolerant;
    if something happens, the services will gracefully degrade. Services are complex,
    having dependencies. One failure in service can trigger a domino effect across
    others if we isn''t isolate them. A circuit breaker prevents a failing component
    from overwhelming itself—when something goes wrong—the circuit will stop allow
    traffic until the path is cleared. Netflix''s Hystrix circuit-breaker is a very
    popular option, complete with dashboards which helps you visualize potentially
    open circuits in a system. Wildflam, as of this writing in Q3 2015, has support
    for Hystrix in master, and the Play Framework provides support for circuits. Netflix
    also has support, and we''re investigating a potential issue with Rugged.


