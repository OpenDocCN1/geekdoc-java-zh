    # Dear Reader,


    20 years—a lifetime for a programming language, never a whole platform. This year,
    we celebrate Java''s 20th birthday, and what better way to celebrate than release
    DZone''s First Guide to the Ecosystem.


    I can remember the 10th JavaOne. There was energy and a belief that Java would
    fulfill its mission to give developers a true chance to "Write Once, Run Anywhere."
    While all this Sun Micros struggled to find a place in the market amid a changing
    economy and a rapidly evolving Internet. Today, Java is everywhere, and it is
    the workforce of enterprises and independent developers alike. It is open more
    than just a language. And after all this time, Java remains the most popular language
    for developers (Toodle) and one of the most active for job hunters (Indeed).


    Long before Dzone, we saw javalobby: an independent group of Java developers eager
    to talk about this new language that required memory management and the backing
    of such powerful organizations. We observed our vision of java over the years
    (near our Java topic), but it remains one of the largest sections of our site
    and one of the primary destinations for Java developers on the web. Because of
    Java''s role in the world choosing the focus for this guide was one of the hardest
    decisions our editorial team had to make this year.


    This guide, which you''re hopefully enjoying today, focuses on trying to understand
    the trends about how developers are using the Java platform. What version of the
    platform are you using? Are you using full EE or just using tools like Spring?
    What do developers prefer over WebSphere? Statistics these—along with expert analysis
    and articles from industry leaders—await you in the 2015 Guide to the Ecosystem.


    Thanks, as always, for your support, and please continue to visit DZone daily.


    P.S. We are always getting in touch with you to help build the platform that DZone.com
    and communities like LinkedIn, Microsoft, and a variety of other organizations
    need.


    MAT SCHMIDT

    PRESIDENT AND CTO

    MATT@DZONE.COM


