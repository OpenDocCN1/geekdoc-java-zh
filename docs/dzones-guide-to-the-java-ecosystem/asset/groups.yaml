    最近的变革通过 Java 8 的参与带我们进入 Java 生态系统，它能够实现更快的并行计算、更好的并发处理以及诸如 Lambda 表达式等新功能——这是开发者工具箱中强有工具。开源带来了巨大的创新、更多的库以及正在开发的机遇。


    一位开发者对 Java 缺乏领导力和精通原则表示担忧，这导致了在平台基础方面出现了许多相互冲突的方法。虽然听起来可能很矛盾，但 Java 最大的障碍是它的成功。IT
    社区的成员对只存在几年的事物有天然的偏见。Java 已经存在了 20 年，不再是唯一的领先平台。由于开源社区构建的额外元素，它正变得更加安全、可扩展和灵活。


    Java 中已经有这么多内容可供 Java 社区使用；你可以通过在已构建并证明有效的基础上进行构建来提高开发速度。Java 生态系统的担忧围绕着 Oracle
    与 Java 之间无处不在的紧张。如果 Oracle 不同于 Java，会导致许多人寻找其他解决方案，导致 Java 停滞。当这些技术将用户聚集并开始协作改进
    Java 时，Java 将受益匪浅。


    理解软件及其架构。精通轻量级和观察者等标准设计模式。掌握并行并了解如何与线程交互。


    更具体的担忧是 Java 语言的表达能力，这可能导致编写和阅读代码花费更长时间，并且面对不断变化的需求时显得僵化。Java 类似于 DLL 地狱，而 .NET
    在多年前就解决了这个问题。该问题的各种解决方案一直被排除在外。Project Ignite 本可以解决这个问题；但目前尚未找到决定性的解决方案。


    成为一个耐心、有同理心并跟上生态系统演变的团队成员。


    Oracle 在 2009 年收购 Sun 后对 Java 的怀疑随着用户使用开源 Java 社区并提供免费访问而逐渐消失。有些人甚至认为 Java 正在通过
    Oracle 进行专业运营。


    Java 生态系统的未来在于物联网、移动端和企业开发。Java 是构建云分布式应用程序的最佳解决方案，并它可以帮助管理这些不断变化的环境。此外，随着性能、隐私和安全在物联网和大数据中变得越来越重要，更多企业将发现这些是构建
    Java 的基本元素。


    我们询问受访者认为 Java 开发者具有什么价值，正如 Java 生态系统中的其他人一样——存在一个多样化的群体：


    '
