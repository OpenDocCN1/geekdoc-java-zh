    # Java 微服务的第一步


    作者：IVAR GRIMSTAD


    ## 快速概览


    - 01 在 Java 生态系统中构建微服务的策略包括无容器化、自包含和容器内。

    - 02 无容器化微服务将应用程序及其所有依赖项封装进单个“胖”JAR 文件中。

    - 03 自包含微服务也封装单个胖 JAR，但它们还包含一个嵌入框架，以及可选的兼容第三方库。

    - 04 容器内微服务将整个 Java EE 容器及其服务实现封装在 Docker 镜像中。


    基于微服务的架构为架构师和开发者带来了新的挑战。不断增加的语言和工具列表带来了克服这一挑战的能力。Java 也不例外。本文探讨了使用 Java 生态系统构建微服务的不同方法。


    | 应用 | 安全 | 持久化 | 消息传递 | 事务 | 集成 | 呈现 |

    |---|---|---|---|---|---|---|

    | JVM | | | | | | |

    | 硬件 | | | | | | |


    应用程序及其所有依赖项被封装成单个 `java -jar myservice.jar`，作为一个独立的 Java 文件存在。


    # 引言


    本文并不讨论微服务是好是坏，也不讨论你应该从一开始就为微服务设计应用，还是让它们从你的单体应用中逐渐产生。


    这种方法的优点之一是在扩展或缩减时，启动和停止服务极其容易。另一个优点是方便。你只需要传递一个 JAR 文件。


    所描述的方法不是唯一可用的方法，但它们应该给你提供一个可能性的很好的概述。尽管 Java 生态系统是本文的重点，但这些概念应该可以适用于其他语言和技术。


    这种方法的缺点是兼容性。在像事务支持等方面你需要自力更生，或者你需要引入提供此类场景支持的第三方库。之后——如果你需要某些功能的支持，例如持久化——你可能需要处理库之间的兼容性问题。


    我在文中提到了无容器化、自包含和容器内。这些术语可能并不完全准确，但它们在这里起到了区分这些方法的作用。我将在接下来的章节中描述每种方法的含义。


    # 无容器化


    # 自包含


    在无容器化方法中，开发者将 JVM 上的一切视为应用程序的一部分。


    单 JAR 部署的另一种变体是使用嵌入框架构建你的服务。在这种方法中，框架提供了所需的服务实现，开发者可以选择包含在服务中的内容。


    无容器化方法实现了单 JAR 部署（也称为“胖 JAR 部署”）。这意味着应用程序及其所有依赖项被封装成单个 `java -jar myservice.jar`，作为一个独立的
    Java 文件。


    你可能会认为这与无容器化解决方案完全相同，但我在此处喜欢区分它们，因为自包含方法实际上为你提供了一组你可以了解的第三方库。


