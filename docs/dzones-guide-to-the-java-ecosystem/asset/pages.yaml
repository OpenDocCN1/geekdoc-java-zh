    the constant flow of new languages, libraries, frameworks, platforms and programming
    models is a real problem. While there''s nothing wrong with trying to stay up-to-date,
    low demands on work without lack of productivity, cycles spent on immature tools,
    half-life and the cost of making bad bets.


    This problem has risen since the dawn of computers, but it''s getting worse. Always
    cause the pause for "full stack" developers who must "do more with less", the
    rising number of open source projects, the proliferation of new technologies of
    hardware and the pressure to introduce the new in order to stay ahead of the competition.


    How can you keep up? Perhaps the best way is to take it slowly: integrate the
    features of new technologies as you need them. In my experience, the need to use
    a technology


