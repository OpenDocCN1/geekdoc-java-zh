  md: '# Key Research Findings


    More than 600 professionals responded to DZone''s 2015 Java Ecosystem Survey.
    Here are the demographics for this study:


    +   - Developers (42%) and Development Leads (25%) were the most common roles.

    - 63% of respondents come from large organizations (100 or more employees) and
    37% from small organizations (under 100).

    - The majority of respondents are headquartered in Europe (44%) or the US (32%).

    - Over half of respondents (61%) have over 10 years of experience as IT professionals.

    - We surveyed developers who use Java in their organization. Other large ecosystems
    for these include C# (31%), C/C++ (29%), Universal Script (28%), PHP (26%), Python
    (26), and Groovy (23%).


    the use of Java 6 or lower for any new apps, and a minuscule 1% of new apps used
    Java 5 or lower. As far as existing apps concerned, Java 8 has not caught up to
    Java 7; most organizations (62%) still have apps built on Java 7, and almost half
    (47%) still have apps on Java 6. respondents said that many developers are eager
    to move forward with Java as it evolves, they are hesitant to retrofit applications
    already built on a previous platform (18% of users have not moved to Java 8 and
    have no plans to using Java 8 in the next 6 months, for neither new or existing
    apps.


    02. JAVA EE AND SPRING US IS ALMOST EQUAL

    One of the significant fights in the Enterprise Java community is using Spring
    and those use Java EE. Our survey shows that the use of components of the platform
    is pretty close, with Java EE having a slight edge. Overall, 58% use Spring and
    67% use Java EE or lower, or Spring 2x or lower. The breakdown of each version
    can be found in the charts, but what''s interesting is that almost one-third (32%)
    of respondents use.


    03. JVM LANGUAGES HAVE A STRONG SHARE OF JAVA DEVELOPERS

    57% of respondents have written code in a non-Java, JVM-based language. Groovy
    (60% of all respondents is the language they have most used, with Scala (39%)
    also close behind. The next largest were Ruby and Cloojure, which over 80% said
    they enjoyed using. However 6% of the groups who had tried a specific JVM language.
    Only Groovy and Scala had enough users to make significant observation over user
    opinions. When they asked if they would like to use these languages at their job;
    45% of Groovy users said they would, and 55% of Scala users said they would.


    01. MOST DEVELOPERS ARE KEEPING UP FAIRLY WITH JAVA VERSIONS

    A majority of respondents (58%) said their organization was using Java 8—the latest
    version of Java—in least most of their new applications. 48% said of new of their
    applications would be built on Java 7. Only 10% of respondents indicated


