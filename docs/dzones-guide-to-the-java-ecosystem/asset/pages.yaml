  md: '# glossary


    JAVA COMPATIBILITY KIT (JCK) A bundle of tools, resources, and a test suite used
    to certify a java platform implementation.


    JAVA VIRTUAL MACHINE (JVM) The runtime engine of the java platform takes programs
    written in Java and compiles them to bytecode. The JVM provides a way for developers
    to write code that is platform independent.


    JAVA DATABASE CONNECTIVITY (JDBC) A Java standard that provides a call-level API
    that can access SQL-based databases.


    APPLET A program written in java for the web, usually embedded in an HTML page.


    JAVA DEVELOPMENT KIT (JDK) The complete set of binaries that includes the JRE
    for developing, debugging, and monitoring applications.


    LAMBDA EXPRESSION In Java 8: an anonymous method for replacing a class with lightweight,
    more readable code. Making functional programming in java much easier.


    BEAN Also known as JavaBeans, these are objects that conform to some simple operations
    with property naming and data encapsulation.


    JAVA ENTERPRISE EDITION (EE) An API and runtime for developing and running enterprise
    software, including web services and large scale networks.


    ENTERPRISE JAVABEANS (JB) A key annotation-based Java API that provides components
    to POJOs.


    JAVA MESSAGING SERVICE (JMS) A Java API and messaging standard that facilitates
    middleware-oriented functionality between components based on Java EE.


    MICROSERVICES A system or application consisting of small, lightweight services
    that perform a single function according to your domain''s bounded contexts. These
    are independently deployable and loosely coupled.


    GARBAGE COLLECTION An automatic memory management system used by the JVM to free
    space occupied by unused objects


    OBJECT-RELATIONAL MAPPING (ORM) An object-oriented programming technique for converting
    data between incompatible types. An ORM lets developers work with relational databases
    without writing language code for the database.


    INTEGRATED ENVIRONMENT (IDE) An application that provides a code editor, debugger,
    compiler, and many other features that make developers more productive and less
    to create errors when building software.


    JAVA EDITION (ME) A solution for java apps that run on mobile devices and devices
    in the Internet, including micro-controllers, sensors, set-top boxes, and printers.


    OPENJDK The official open-source java implementation.


    JAVA API FOR RESTFUL SERVICES (JAX-RS) A Java API that uses annotations to map
    help resources classes (POJOs) to SOAP-based web services.


    JAVA NAMING AND INTERFACE (NDI) A set of APIs that help manage object and data
    discovery and lookup for java software clients.


    PLAIN OBJECT (POJO) A term used to explain that a given java object is not a special
    object but just one defined by the EJB framework. A simple object that does not
    implement a framework interface or extend a framework class. Java beans are annotated
    POJOs.


    JAVA ARCHIVE (JAR) A package that formats multiple Java class files with embedded
    metadata in order to distribute and libraries on the java platform.


    JAVA PERSISTENCE API (JPA) A standard specification for the management of relational
    data in terms of object-relation mapping.


    JAVA RUNTIME ENVIRONMENT (JRE) A set of binaries that allows you to execute java
    programs on your machine.


    Servlet A java program that runs within a web server and provides the capabilities
    of a server.


    JAVA ARCHITECTURE FOR XML BINDING (JAXB) A Java API for marshalling and unmarshalling
    objects into and out of XML


    JAVA SERVER PAGES (JSP) A tool in the java platform that allows developers to
    develop and build HTML, XML, and other documents. JSPs are translated into servlets
    at runtime.


    STREAM API A new Java 8 API for declaratively, parallelatively processing data
    on Collections. Massively SQL-like data query and manipulation.


    JAVA CARD Provides a secure environment for applications that run on smart cards
    and other limited-memory devices.


    JAVA REQUEST SERVICE (JSR) Writing specifications proposing and final specifications
    for features of the java platform.


    TECHNOLOGY COMPUTATION KIT (TCK) A set of suites that are built and submitted
    in order to certify a JSR for compliance.


    JAVA COMMUNITY PROCESS (JCP) A process by which java community members propose,
    discuss, and finalize features to improve and expand the java platform.


    JAVA STANDARD EDITION (SE) The most common platform used for development and deployment
    of java environments for desktop and server.'
