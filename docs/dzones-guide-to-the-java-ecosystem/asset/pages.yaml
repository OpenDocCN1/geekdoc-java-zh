  md: '# JAVA BEST PRACTICES


    This checklist includes a mix of general advice and specific pitfalls that you
    need to look out for when developing Java applications.


    # GENERAL


    +   - USE ENCAPSULATION


    +   - CLOSE STREAMS


    +   - USE EQUALITY OPERATORS


    None of the instance fields in your class should be public. Utilize getters to
    access to the fields, and when appropriate, add setters to allow writing.


    Any time you open a stream to read or write data, ensure that that stream afterwards
    afterwards. If you''re using Java 7 or later, you can use the "try with resources"
    mechanism.


    When comparing strings you should use the .equals method rather than the == operator,
    which compares the addresses of objects rather than the contents.


    If you''re using String.intern() you can use the == operator, but only use .intern()
    spangingly since it can increase overhead garbage collection.


    # PERFORMANCE


    +   - USE PRIMITIVE TYPES


    +   - CONCATENATE STRINGBUILDER


    +   - CONSTRUCT OBJECT LAZILY


    Java has a number of wrapper classes available for dealing with primitives, but
    use these only if they are absolutely necessary for your application. Wrapper
    classes are slow, while primitive types are simple values.


    When building a string in your program, use StringBuilder rather than concatenation
    (with the + operator), which would create a new String object each time it is
    used.


    Almost all the time, you prefer lazy initialization of your objects. If your object
    is constructed with an external system, initialization will be slowed, delaying
    construction until it is required to result in faster execution overall.


    # EXCEPTION HANDLING


    +   - BE SPECIFIC WITH EXCEPTIONS


    +   - ELIMINATE EMPTY CATCH BLOCKS


    +   - NEVER THROW EXCEPT FOR NORMAL FLOW


    As you create methods that throw exceptions, think of yourself as an API developer,
    and make the throws as specific as possible. It''s better to list three potential
    exceptions rather than having one generic exception.


    Empty catch blocks are useless for the readability of your code. You should always
    attempt to do something in your catch blocks. The very least this should include
    the exception and properly inform the user.


    +   - "TRY WITH RESOURCES"


    In-catch blocks that include work with I/O resources, use the "try with resources"
    to ensure that all resources are closed when the block has completed. If you are
    using a version of Java SE 7, then use the finally block to clean up resources.


    You should never rely on exceptions to catch such as an array of bounds, when
    you are using defensive programming in your code to check if the index is within
    the size of the array. Exception checks run slower than the checks you do within
    your own code.


    WRITTEN BY James Suggue is the CIO at Carma, and is also a Leader at Drone since
    2008. This list was compiled from James'' experiences with Java over a 14 year
    career, both using Java and reading countless books and articles on the language.
    He recommends that every Java developer should read Effective Java by Joshua.


