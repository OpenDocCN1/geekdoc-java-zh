    This is where Docker comes in. By packaging the EE Container and the service implementation
    inside a Docker image, you can achieve more or the same result as you would with
    a single JAR deployment. The difference is that now is contained in a Docker image
    and not a JAR file.


    # Dockerfile


    ```

    FROM jboss/wildfly:9.0.1.Final

    ADD myservice /opt/jboss/wildfly/standalone/

    deployments

    ```


    The service is started by running the Docker image in container.


    ```

    $ docker run -it -p 8080:8080 organization/myservice

    ```


