  md: '# Why Java 8?


    01

    In cases, Java 8 will improve application performance without any specific work
    or tuning.


    02

    Lambda expressions, the Streams API, and new methods on existing classes are some
    of the key productivity improvements.


    03

    Java 8''s Optional type gives developers significant flexibility when dealing
    with null values, reducing the likelihood of NullPointerException


    BY TRISHA GEE


    Java 8 came out last year—and Java 7 is now end of life—making Java 8 the only
    Oracle-supported option until Java 9 comes at the end of next year. However, since
    organizations value stability over trendiness, many of us are still working with
    Java 7, or even 6.


    Streams API or lambda syntax or even change your existing code to get speed improvements
    in your application.


    Garbage Collector Improvements: Often "Performance" is synonymous with "Garbage
    Collection," and it is certainly that poor garbage collection will impact your
    application performance. Java 8 has substantial changes to GC that improve performance
    and simplify tuning. The well-known of these is the removal of PermGen and the
    introduction of Metaspace.


    Let''s look at some features of Java 8, and provide some arguments to persuade
    your organization to upgrade.


    Fork/Join Improvements: The fork/join framework was new in Java 7, and was the
    latest effort to simplify concurrent programming using the JVM. A lot of work
    went into improving it for Java 8. Fork/join is now the framework that''s used
    under the covers for parallel operations in Streams API (on this later).


    # IT FASTER


    Here''s a point that may please your business, or the operations: you''ll probably
    find Java 8 runs your application faster. Generally speaking, applications that
    have moved to Java 8 see some sort of improvement without any specific work or
    tuning. This might not apply to an application that has been highly tuned to a
    specific JVM, but there are many reasons why Java 8 performs better:


    In addition, there are changes in Java 8 to support concurrency, and Oracle has
    summarized some of the performance improvements in JDK 8.


    # FEWER LINES OF CODE


    Java is regularly accused of heavy use on boilerplate. Java 8 addresses some sorts
    of these by embracing a more functional style for the new APIs, focusing on what
    you want to achieve and how to do.


    Performance Improvements in Common Data Structures:

    Benchmarks of the ever-popular HashMap show that performance in Java 8 is better.
    These sorts of improvements are compelling—you don''t need to learn the


