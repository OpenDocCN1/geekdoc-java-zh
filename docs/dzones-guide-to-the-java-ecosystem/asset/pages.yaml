    can have a very bright future—Oracle and Google can resolve their differences.


    Google is important because of Android. IBM is committed to leading development
    and standards while serving on the governing board for OpenDK. Pro-source-organizations
    like Paypal/Spring, Apache, Typesafe, and Red Hat are all contributing to innovation
