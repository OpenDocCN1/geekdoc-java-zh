    \ simplify our code.\n\n# EASY TO PARALLELIZE\n\nWe speak about out-of-the-box\
    \ performance, and in addition to those earlier mentioned features, Java 8 can\
    \ easily use more of CPU cores by replacing the method with parallelStream, the\
    \ JVM will split the operation into separate jobs and use fork/join to run them\
    \ on multiple cores. However, parallelism is not a magic that makes everything.\
    \ Operating in parallel always requires more work—splitting operations and combining\
    \ results—and will not therefore take\n\nless time. But this option is very interesting\
    \ for areas that are suitable for parallelization.\n\n# MINIMIZE NULL POINTER\n\
    \nAnother feature of Java 8 is the Optional type. This type is a way of explicitly\
    \ stating 'I might have a value, or I might be null.' Which means an API can now\
    \ be returning values that might be null, which will always be non-null, minimizing\
    \ the cost of running into a NullPointerException.\n\nWhat's about Optional is\
    \ the way you tell it with fools. For example, if you're looking for a book in\
    \ a list, the new findFirst() method returns an Optional which tells us it's not\
    \ guaranteed to find a value. If you find one, then you can decide whether it\
    \ is null. If you want to throw a Exception, you can use orElse:\n\n```\npublic\
    \ Book findByTitle(List<Book> books,\n    String title) {\n    Optional<Book>\
    \ book = books.stream()\n        .filter(book -> book.getTitle())\n        .findFirst();\n\
    \    return book.orElseThrow(() -> new\n        BookNotFoundException(\"ID did\
    \ not find book with\n        \"title: \" + title + \"));\n}\n```\n\nor you could\
    \ return another book:\n\n```\nreturn book.orElseGet(() -> \n    getRecommendedAlternativeBook(title));\n\
    ```\n\nOr we could return an Optional so that callers of the method can make their\
    \ own decision on what to do if the book is not found.\n\n# IN SUMMARY\n\nJava\
    \ 8 was a big release, with syntax changes, new methods and types, and under-cover\
    \ changes that will help your application even if you don't use the new language\
    \ features. Java 7 is no longer supported by Oracle, so organizations are better\
    \ to migrate to Java 8. The good news is that Java 8 has many benefits for your\
    \ business, your existing application, and for developers to improving their productivity."
