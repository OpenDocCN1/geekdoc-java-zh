  md: '# # Executive Summary


    DZone surveyed more than 600 IT professionals and produced several experts for
    our 2015 Guide to the Java Ecosystem to give Java organizations insight into the
    effects of major trends on the larger Java development community and to discover
    common patterns and technology stacks currently in use across the industry. In
    this summary you will learn about the current state of the Java platform and the
    ecosystem of turning around the language.


    for microservices, 46% per container. 21% want to implement microservices (12%)
    always and 15% want to implement microservices in containers—or actually using—there
    are more respondents interested in containers than those that aren''t (22% not
    interested) and the same for microservices (20% not interested).


    Implications: These trends have made a significant impact in the Java community
    over the last 2-3 years, but it will still take several years for containers or
    microservices to maintain adoption in many of the organizations where they could
    be beneficial. Many of the most successful web projects previously (Google, Netflix,
    Twitter, etc.) have implemented containers and microservices appropriately. These
    companies are driving trends by sharing some of their implementations.


    Recommendations: Developers, architects, and executives need to start researching
    the potential benefits of containers and microservices before to them to their
    applications. Some may decide that they are not mature or enough for their systems,
    but more robust research must be done before a decision can be made. Several technologies
    have already moved to support microservices—such as Spring, Wildswarm, and Akka.
    Docker has a dominant position in the container space. A good place to start is
    reading "Docker and Kubernetes in the Java Ecosystem" by Paul Baker on Docker.
    For building microservices you should read Ivan Girard''s guide, "Building Microservices
    With Java."


    # RESEARCH TAKEWAYS


    +   01 DEVELOPERS ARE MOVING TO NEW VERSIONS OF JAVA MORE QUICKLY


    Data: 53% of respondents say their new apps will use Java 8 in the next six months
    and 55% are going to start converting existing apps to Java 8 in that time frame.
    62% of respondents say apps are in Java 7 and 20% already have apps in Java 8.


    Implications: A large majority of Java organizations are moving to the latest
    version of Java for new applications. This shows a bit forward momentum in the
    Java community that has been in years. Large swaths of Java organizations have
    legacy codebase due to their organization''s age and the constant pressure of
    the language, which has left some of them behind. There will be a large number
    of organizations where there isn''t enough risk or resources to motivate them
    to upgrade their legacy code, but it''s likely to see significant numbers of Java
    companies moving their apps to the newest version.


    Recommendations: The fact that Oracle has declared Java SE 7 end-of-life is a
    significant contributor to this trends towards faster. To maintain a high level
    of security and take advantage of new features that other programming languages
    have for a long time, to move to the latest version is always the best option
    if you can afford it. Try it with "Java 8" to see the positive impact Java 8 has
    on your applications. Some key things expecting toward Java 8 are functional programming
    features and performance improvements.


    +   02 INTEREST IN CONTAINERS & MICROSERVICES IS GROWING IN THE JAVA WORLD


    Data: While nearly half of respondents haven''t responded about containers or
    microservices on comment with (43%


    # 03 JAVA IS ONE OF THE MOST POPULAR PROGRAMMING LANGUAGES


    Data: There are several indexes in tech which uses various metrics to measure
    programming language popularity, including TIOBE, Rank, and IEEE. Java is ranked
    #1 or #2 in all of these indexes. No other has rankings that are as consistently
    as Java across all these indices. On the TIOBE index, one of the most recognized
    languages, Java has the number one language for the last 14 years, and it''s currently
    number one by a significant margin. 83% of respondents in our ecosystem survey
    say they are concerned about the future of Java.


    Recommendations: Java has reached a point where its popularity far further. More
    developers are using, open-source utilizing around it, and there is more maturity
    and reliability around the platform and its ecosystem of tools. As a result, more
    organizations and developers choose to build apps in Java.


    Recommendations: While many think Java would decline after the announcement of
    Acquisition of Sun Micros in 2009, it will take a few years to establish itself.
    With the release of Java 8, Java is finally catching up with the expectations
    that it had its ability to be written better than ever before. Before people are
    even thinking about the future of Java, and it''s being used in many of the well-respected
    tech companies. Its popularity in the software industry is expected to continue
    and even grow due to its advantages in data analysis and embedded systems, which
    will likely make Java a significant programming language in the Era of Internet
    Things.


