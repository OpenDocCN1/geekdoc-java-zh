  md: 'bottlenecks require a different approach. Take jstack, for instance: a powerful
    tool that stitches together them. You are probably already familiar with it in
    some way. Basically, just hook into a running process and output all the threads
    that are running in it. It will print each thread''s stack trace; either Java
    or native; locks they are holding; and all sorts of other metadata. You can also
    analyze heap dumps or core dumps of processes that already ended. It''s a long-standing
    and very useful tool.


    The problem is that jstack is mostly used in respect. The condition you''re looking
    to debug has already happened, and you''re left searching through the debris.
    The server is not responding, the thread is blocking, database queries are taking
    forever: a typical output would be a few stack traces on some nasty data dump,
    with no clue of how we got there. A nice tool would allow you to get the jstack
    output where it matters to activate it when things start tumbling down. For example,
    you can set a certain threshold and get jstack to run at the moment it drops.


    Combined with smart frames, we can now know exactly which caused us to get stuck,
    and how to retract our steps, reproduce the error, isolate it, and solve it.


    > Unless we prepare our applications and environment in advance, there will not
    be much to recover after getting errors and performance issues.


    # USING JAVA AGENTS TO SKIP LOGGING ALTLOGGER


    The next step in this process is gaining visibility into your application runtime.
    Logs are inspected in respect and include only the information that you''ve decided
    to put there in advance. We well know how to enrich them with state data, but
    we also need a way to access the exact values that each changed to get down to
    the root cause. Java agents give us the ability to get the data we need without
    writing to disk and using log files, so we can extract only the data we''ll actually
    be using.


    One interesting approach is using BTrace, an open-source Java agent that hooks
    into a JVM and opens a stack trace that lets you query your instrumentation. For
    instance, you can get access to ClassLoaders and their subclasses, and load them
    when some troubled class is instantiated. It is a useful tool for investigating
    specific issues and requires you to write scripts for each case you want to cover.


    You could also write your own canary agent, just like the FAINT-TRACE. We also
    had a test in Takip where a certain class was initializing many of new objects
    for some reason. We used an agent that hooks to the constructor of that object.
    The object we allocated would extract its stack trace. We then analyzed the results
    and understood where the problem was coming from. Our day-to-day we''re using
    a production grace agent that knows to extract the variable values that each exception
    or logged error, all as the stack trace, and across different machines.


    # TESTING IN PRODUCTION: FOR THE FAINT-HEARTED


    Joking in production is a serious practice that many companies are taking part
    in. They can''t cancel the testing phase completely, but they understand that
    staging environments are not enough to mimic build environments, no matter how
    time and effort you put into them. The only real place is testing taking place
    in production, with real data flowing through the system and unexpected cases
    being thrown at it.


    There are several approaches you can adopt for performing controlled testing,
    depending on what kind of functionality you''re testing. One option is duplicating
    and routing live traffic through both the system and through the new version of
    the component you''re testing. This way you can see how the new component behaves
    and compare directly to the current version without risking the delivery of wrong
    results back to the user for, if it''s some data crunching.


    Another option is segmenting the traffic and revealing new features. One way to
    do this is to use a canary server, which is a single node in your system with
    the new version you''ve decided to roll out (just like a canary in a coal mine).
    It is also helpful to add monitoring and logging to the canary server. Another
    option is to add monitoring on this canary setup, implementing and making use
    of rollout rollout switches, or A/B testing some changes in your application to
    see how they impact performance.


    # FINAL THOUGHTS


    Debugging applications in production requires a creative and forward-thinking
    mindset. Unless we prepare our applications and environments in advance, there
    will not be much to recover after getting errors and performance issues.


