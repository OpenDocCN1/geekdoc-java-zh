    JONAS BONÉ


    # QUICK VIEW


    +   01 Reactive Systems rely on a foundation of asynchronous message-passing to
    create loosely-coupled systems that are responsive, resilient, and elastic.


    +   02 Analytics are being pushed into the stream (via Spark), which is emerging
    as the de facto approach for sub-second query response times across billions of
