  md: "```\npublic List<Author>\ngeallAuthorsAlphabetically(List<Book> books) {\n\
    \    return books.stream()\n        .map(book -> book.getAuthor())\n        .distinct()\n\
    \        .sorted((o1, o2) -> \n            o1.getSurname().compareTo(o2.getSurname()))\n\
    \        .collect(Collectors.toList());\n}\n```\n\nNot only is this fewer lines\
    \ of code, it's arguably more descriptive—a developer coming to this code can\
    \ easily read and understand that (1) it's getting authors from the books, (2)\
    \ it's only interested in unique authors, and (3) the list that is returned by\
    \ author surname. Combine the Streams API with other features—method references\
