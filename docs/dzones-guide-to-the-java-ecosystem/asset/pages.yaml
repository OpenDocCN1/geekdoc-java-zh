    # 05. JSF AND SPRING MVC NECK-AND-NEC IN JAVA FRAMEWORKS RACE


    The Java framework battle is much closer than the previously mentioned competitions.
    In August 2015, 52% respondents used Spring, 39% respondents showed MVC (94.2%)
    and Java Faces (35%) as a viable tie. However, more Java developers are looking
    for front-end development tools outside of the Java. When asked in the 2015 Java
    Ecosystem Survey about the tools they use for application front-end, respondents
    chose more than Spring MVC (39%) and JSF (30%). All of direct competitors—React-js,
    Ember, Backbone—were under 10%.


    # 06. FULL JAVA APP SERVERS ARE NOT COMMON


    Lightweight application servers like Tomcat (68%) and Jetty (27%) have been dominant
    in Java development for some time. For several years, the trend in Java development
    has been moving towards use of only the components that you need, and [1]. We
    also found that most of these app servers are used in development more often than
    they are used in production. Only WebLogic and WebSphere were deployed in production
    more often than development.


    # 08. NEW SERVER TECHNOLOGIES ARE STILL BLEEDING-EDGE AND RACE


    We asked respondents about the server technologies they use, and while were still
    using Java EE or Spring framework, we found some groups using the new server technologies
    in the Java space. 11% say they are using a serverless with Spring Boot and Dropwizard.
    However, Spring Boot and Dropwizard are used for more than just countless deployment,
    so it''s not an indicator of the tools'' overall performance. 9% say they are
    using Skalla and Akka, and 2% are using Vert.x.


