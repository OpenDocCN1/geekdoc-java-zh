    Eureka, making it discoverable by other consumers. Eureka is a part of the Spring
    Cloud bundle and is an extremely easy-to-use and configure service discovery tool.


    Java EE does not have this functionality out of the box, but there are several
    open-source solutions available. One solution is Snoop, which functions in a similar
    way to Eureka. The only thing needed is to make a Java EE application available
    for lookup by the @EnableSnoop annotation shown in this example:


    A Java EE container for Spring is Wildfly. It enables you to pick and choose parts
    of the EE specification you need and deploy your application in a JAR file. The
    Hello World example looks like this:


    > > SNIPPET: bit.ly/3kZ2PP1


    While it seems like a lot of overhead to require an entire EE container to be
    able to deploy a microservice, keep in mind that some developers argue that the
    ''micro'' in microservices does not necessarily mean the service is small or simple.


    # WILDFY SWARM


    The advantage of the self-contained approach is that it is a little less complex
    than the deliverable JAR file but a bit bigger since it fits in the required containers
    of the actual service. One disadvantage of this configuration is that you have
