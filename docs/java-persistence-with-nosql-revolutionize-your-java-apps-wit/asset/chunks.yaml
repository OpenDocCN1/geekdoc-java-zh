    Cluster typically consists of multiple nodes, each running an instance of ArangoDB.
    These nodes work together to provide a distributed and fault-tolerant database
    system. There are two primary node types in an ArangoDB Cluster:  Coordinator
    These nodes handle client requests, query coordination, and overall cluster management.
    Coordinator nodes serve as the entry points for client applications and manage
    data distribution and queries across the cluster. DBServer DBServer nodes are
    responsible for storing and managing data. They keep data collections and process
    read and write operations on those collections. Each DBServer node manages a portion
    of the data in the cluster, as shown in Figure ![](image-fvig40f9.png) Figure
    cluster  ArangoDB employs a sharding mechanism to distribute data across the DBServer
    nodes. Data is divided into shards, and each shard is stored on a separate DBServer
    node. This distribution of data helps distribute the workload and ensures horizontal
    scalability. To ensure high availability and data redundancy, ArangoDB supports
    replication. Data is replicated across multiple DBServer nodes, providing fault
    tolerance. If one node fails, another node can take over, minimizing downtime. ArangoDB
    uses a consensus algorithm (typically Raft or a similar protocol) for coordination
    among coordinator nodes and ensuring data consistency. This consensus mechanism
    helps in electing leaders and synchronizing operations across the cluster. Coordinator
    nodes handle incoming client requests and distribute queries to the appropriate
    DBServer nodes. Load balancing ensures that each node’s resources are utilized
    efficiently, preventing bottlenecks and overloading of specific nodes. ArangoDB
    Cluster has built-in mechanisms for automatic failover. If a coordinator node
    or DBServer node becomes unavailable due to hardware failure or other issues,
    the cluster can automatically promote a replica to take its place, ensuring data
    availability. Proper configuration and monitoring are critical in ArangoDB Cluster
    deployments. Administrators can configure replication factors, sharding strategies,
    and other settings to meet specific performance and redundancy requirements. Comprehensive
    monitoring tools are available to track the health and performance of cluster
    nodes. ArangoDB allows you to configure the level of consistency you need for
