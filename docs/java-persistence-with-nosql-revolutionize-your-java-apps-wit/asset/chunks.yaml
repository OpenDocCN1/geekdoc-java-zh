    result: https://github.com/ultimate-engineer/java-persistence-nosql-book/tree/main/chapter-09 Integrating
    CDI with NoSQL In this session, we explore the compelling reasons behind integrating
    CDI with NoSQL databases and how to effectively utilize CDI to manage various
    aspects of NoSQL connections within the application. By understanding the synergy
    between CDI and NoSQL, developers can ensure efficient resource management, avoid
    connection leaks, and create guaranteed objects within the application scope. The
    integration of CDI with NoSQL databases brings forth a multitude of advantages.
    CDI, as a robust dependency injection framework, offers a structured and modular
    approach to application development. It promotes loose coupling, which is crucial
    when dealing with diverse NoSQL data sources and facilitates the creation of reusable
    and maintainable components. Managing connections, sessions, and resources becomes
    paramount when dealing with NoSQL databases, such as MongoDB or Cassandra. CDI’s
    ability to manage bean lifecycles and handle dependencies seamlessly aligns with
    the challenges posed by NoSQL databases, ensuring efficient and resource-friendly
    connections and safeguarding against connection leaks. Central to effective integration
    is using manager beans or instance classes that encapsulate NoSQL connections.
    These manager beans act as intermediaries, controlling the lifecycle of NoSQL
    connections and ensuring proper management and disposal. By utilizing CDI’s scope
    annotations, such as or custom-defined scopes, developers can guarantee that each
    NoSQL connection is created, used, and closed appropriately, avoiding potential
    resource exhaustion. Moreover, CDI offers a practical solution for creating guaranteed
    objects within the application scope. Objects that need to persist across multiple
    requests, such as session information, can be effectively managed using CDI. This
    ensures that the state is retained across user interactions, providing a seamless
    and consistent experience:  Producer Utilize CDI’s producer methods to centralize
    the creation and management of NoSQL connections. This promotes consistency and
    enables easy reconfiguration of data sources. Scoped Apply appropriate scope annotations
    to manager beans or instances handling NoSQL connections. This ensures proper
    lifecycle management, preventing connection leaks and unnecessary resource consumption. Interceptors
    for error Employ CDI interceptors to handle errors and exceptions arising from
    NoSQL interactions uniformly. This maintains code quality and simplifies error
    reporting. CDI Leverage CDI events to communicate changes in NoSQL data across
    components. This approach minimizes tight coupling and fosters a more reactive
    architecture. Integrating CDI with NoSQL databases represents a pivotal advancement
    in modern application architecture. By harnessing CDI’s capabilities to manage
    NoSQL connections, resources, and object lifecycles, developers can address critical
    challenges in an elegant and efficient manner. The seamless alignment between
    CDI’s dependency injection principles and the intricacies of NoSQL interaction
    offers a pathway to building Java applications that are not only scalable and
    resilient but also maintainable and adaptable. As we move forward, the subsequent
    session will delve deeper into the intricacies of CDI, exploring its core concepts,
    annotations, and how it transforms the landscape of Java development, thus providing
    a foundation for leveraging its potential with NoSQL databases. Demystifying CDI In
    this session, we embark on a journey to demystify the core principles of CDI,
    a cornerstone technology significantly enhancing Java application development.
    We will delve into the fundamental concepts of beans and scopes, unraveling their
    significance in creating modular, maintainable, and scalable applications. At
    the heart of CDI lies the concept of a bean, which can be considered a managed
    component within the CDI container. Beans encapsulate business logic, state, and
    behavior, and CDI ensures that they are instantiated, managed, and injected seamlessly
    into the application. CDI beans can be either regular Java classes or interfaces,
    with special annotations providing metadata that guides the container’s behavior. A
    key attribute of CDI beans is their scope, a specification of their lifecycle
    and the extent to which they are accessible within the application. CDI offers
    a range of built-in scope annotations, each tailored to different use cases:  Beans
    with this scope live throughout the entire application lifecycle. They are created
    upon application startup and destroyed when the application shuts down. Ideal
    for managing resources shared across the application. Beans maintain their state
    throughout a user’s session. They are created when a session begins and destroyed
    when the session ends. This is suitable for maintaining user-specific data during
    their interaction with the application. Beans live only within the scope of an
    HTTP request. They are created when a request arrives and are destroyed when the
    request processing ends. Perfect for encapsulating data tied to a specific HTTP
    request. The default scope creates a new instance of the bean every time it is
    injected. This scope is ideal for components with short lifecycles and limited
    states. Beans with this scope share single instances across the application. They
    are created on demand and exist until the application terminates. The choice of
    scope plays a pivotal role in crafting a well-structured and efficient application
    architecture. CDI’s scope annotations facilitate modularity by ensuring that beans
    interact within defined boundaries, reducing unintended coupling. Additionally,
    they streamline the management of stateful components, ensuring that data persists
    only as long as needed. To visually represent the diverse bean scopes in CDI,
    we present a diagram illustrating the lifecycle and boundaries of beans within
    the context of an application, a session, and a request. This diagram aims to
    elucidate the temporal and usage distinctions among and @RequestScoped beans,
    shedding light on how each scope contributes to Java applications’ modularity,
    state management, and resource efficiency. Let us explore this visual aid to understand
    how bean scopes shape the behavior of CDI-managed components in various scenarios.
    Refer to the following figure: ![](image-0zybjixe.png) Figure 9.1: CDI scope illustration In
    CDI, a comprehensive set of resources, empowers developers to create flexible,
    modular, and well-structured applications. When intelligently integrated with
    a NoSQL database application, these resources can enhance code quality, promote
    scalability, and ensure efficient resource management. Let us explore how each
    of these CDI resources can be effectively utilized in conjunction with a NoSQL
    database application:  Injection Injection is at the core of CDI, allowing dependencies
    to be automatically injected into managed beans. In a NoSQL database application,
    injection can seamlessly integrate NoSQL connections, data access components,
    or even NoSQL-specific libraries into CDI-managed beans. This ensures that the
    necessary resources are readily available to components without explicit instantiation,
    reducing boilerplate code and promoting cleaner, more readable codebases. Qualifier Qualifiers
    provide a way to differentiate between instances of the same type. In a NoSQL
    context, qualifiers can be utilized to differentiate between different NoSQL database
    implementations, allowing the application to switch between different NoSQL data
    sources based on specific criteria. This facilitates easy testing, development,
    and maintenance by abstracting the specific NoSQL technology from the application
    logic. Produces and disposes The @Produces and @Disposes annotations allow developers
    to control the creation and disposal of managed bean instances explicitly. When
    applied to NoSQL connections or resources, these annotations enable precise management
    of the lifecycle of NoSQL-related objects. This is particularly valuable in avoiding
    resource leaks, managing connection pooling, and ensuring optimal resource utilization
    when interacting with NoSQL databases. Event CDI events offer a mechanism for
    communication between loosely coupled components. In a NoSQL database, events
    can notify various application parts about changes in the NoSQL data. For instance,
    an event can be fired when new data is added to the NoSQL database, and interested
    components can listen to these events to update their state or trigger additional
    actions. Decorator Decorators in CDI allow developers to extend or modify the
    behavior of beans without altering their original code. In a NoSQL context, decorators
    can add cross-cutting concerns such as logging, caching, or auditing to the interactions
    with the NoSQL database. This promotes the separation of concerns and cleaner
    code by encapsulating these concerns in separate decorator classes. Interceptor Interceptors
    provide a way to intercept and modify method invocations on managed beans. In
    a NoSQL application, interceptors can be applied to methods that interact with
    the NoSQL database, allowing developers to consistently implement cross-cutting
    concerns like security checks, data validation, or performance monitoring across
    the application. Navigating the landscape of CDI resources can be a transformative
