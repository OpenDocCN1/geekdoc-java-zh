    ## 关于作者

    Otávio Santana 是一位资深软件架构师和工程师，对云和 Java 技术充满热情。在多语言持久化和高性能应用领域，Otávio 对 Java 及其开源社区做出了巨大贡献。作为
    Java Champion 和 Oracle ACE 成员，Otávio 在塑造 Java 8 平台及其目标方面发挥了关键作用。Otávio 还是多个开源项目的活跃提交者和领导。他的专业知识涵盖金融、社交媒体和电子商务等领域，他在这些领域应用了先进的技术来交付可扩展且高效的软件。他精通多种语言，包括葡萄牙语、英语、意大利语和法语。通过《Java
    Persistence with NoSQL》一书，Otávio Santana 分了他丰富的知识和经验，帮助读者掌握 NoSQL 数据库的世界并掌握多语言持久化的艺术。


    ## 关于评审员

    Aaron Ploetz 自 1997 年以来一直是一名专业的软件开发者，拥有领导初创公司和 DevOps 团队的成功经验。他曾被任命为 Apache Cassandra
    MVP，并在多次会议上发表演讲。Aaron 经常解答 StackOverflow 上的问题，并编写过本书。他在威斯康星大学怀特沃分获得计算机系统管理学士学位，在雷吉斯大学获得软件工程硕士学位。在不编写或编码代码时，Aaron
    喜欢钓鱼和玩游戏。


    ## 致谢

    我想由衷感谢我的妻子 Poliana Santana，她在整个旅程中给予了我不懈的支持和鼓励。感谢 Java 社区的无私贡献和协作精神。你们对技术的激情每天激励着我。最后，感谢我的家人，你们的支持对我来说意味着一切。


    ## 前言

    掌握 NoSQL 数据库的重要性在不断演变的 Java 架构中不言而喻。《Java Persistence with NoSQL》是导航 `Jakarta
    EE` 和 MicroProfile 中复杂的 NoSQL 数据库世界的全面指南，旨在帮助高级工程师、架构师和 Java 开发者设计并实现优化性能、扩展性和灵活性的高级数据存储解决方案。我们的旅程将带我们探索
    NoSQL 数据库，包括 `MongoDB`、`Cassandra`、`Neo4J`、`Redis` 等，并学习如何利用这些数据库的独特功能。在书中，我们将深入研究
    `Jakarta` 规范，确保你跟上不断发展的 Java 生态系统。在本书结束时，你将获得最佳实践、真实案例和实操练习的见解，使你能够自信地应对复杂的企业级挑战，确保安全性、高可用性和容错性。我很兴能你一起开启这段旅程，解锁多语言持久化的潜力，并彻底改变你构建和管理
    Java 应用的方式。


    ## 第 1 章：NoSQL 数据库简介

    本章介绍了 NoSQL 数据库，解释了它们的基本概念、特征以及相对于传统 `SQL` 数据库的优势。探索了各种 NoSQL 数据库，如键值、宽列、文档、图谱和时间序列数据库，为理解它们在现代企业
    Java 架构中的作用奠定了基础。


    ## 第 2 章：NoSQL 数据库：对比分析

    在第一章的基础上，本章对不同的 NoSQL 数据库进行了全面的对比分析。深入探讨了建模考虑因素、扩展性权衡和数据库复制策略。读者将学习如何在 Java 应用中使用
    NoSQL 数据库。


    ## 第 3 章：生产环境中运行 NoSQL：最佳实践与考虑

    本章关注在生产环境中部署和管理 NoSQL 数据库。讨论了数据库管理工具、备份与灾难恢复以及云服务。本章提供了确保 NoSQL 部署稳定性和扩展性的实用指导。


    ## 第 4 章：通过框架简化 Java 应用集成

    探索集成 Java 应用的框架，本章涵盖了企业 Java 应用的分层、非结构化架构和数据库设计模式等主题。帮助读者理解框架如何减少样板代码并提高 Java
    开发效率。


    ## 第 5 章：Java 持久化模式

    本章深入研究 Java 持久化模式，包括 `Repository`（存储库）、`Unit of Work`（工作单元）和 `Data Access Object`（DAO，数据访问对象）。解释了这些模式如何为高效数据访问提供抽象和模块化，重点关注
    `Hibernate` 等对象关系映射（ORM）框架。


    ## 第 6 章：Java 架构与持久层

    本章探索 Java 架构与持久层之间的相互作用，涵盖了单体和微服务架构、事件驱动设计以及各种架构风格。还讨论了 NoSQL 数据库在数据管理中的作用。


    ## 第 7 章：Jakarta EE 和 MicroProfile 简介

    介绍 Jakarta EE 和 MicroProfile，强调它们在构建企业级应用中的意义。涵盖了 `Jakarta EE` 领域、规范以及 `MicroProfile`
    如何补充 `Jakarta EE`。


    ## 第 8 章：使用 Bean Validation 的高级验证技术

    本章关注使用 `Bean Validation` 在 Java 应用中强制数据约束。解释了自定义约束、验证组、跨字段验证，并提供了维护数据完整性的实用示例。


    ## 第 9 章：通过 CDI 增强面向对象编程

    探索上下文和依赖注入（CDI），本章增强了读者的面向对象编程（OOP）技能。涵盖了依赖注入及其形式、事件处理和拦截。


    ## 第 10 章：使用 JAX-RS 实现 Rest

    本章探索了使用 `JAX-RS` 实现 RESTful Web 服务。涵盖了核心功能、资源定义、HTTP 请求和响应处理、内容协商以及 RESTful API
    的安全性。


    ## 第 11 章：Jakarta EE NoSQL 与数据简介

    介绍 Jakarta EE 和 NoSQL，本章探索了 NoSQL 数据库的基础知识、优势和组件。帮助读者理解如何在 Jakarta EE 环境下使用 NoSQL
    数据库。


    ## 第 12 章：Redis 集成

    本章将内存数据存储 `Redis` 集成到 Java 中。涵盖了功能、客户端库以及使用 `Redis` 进行缓存和数据管理的最佳实践。


    ## 第 13 章：Cassandra 集成

    探索 Cassandra，本章讨论了 Cassandra 的列族模型、Java 驱动以及数据建模和一致性级别等高级主题。帮助读者利用扩展性和容错性。


    ## 第 14 章：MongoDB 集成

    本章涵盖了流行的文档型 NoSQL 数据库 `MongoDB` 与 Java 应用的无缝集成。包括 MongoDB 的数据模型、Java 驱动、数据建模和查询优化。


    ## 第 15 章：Neo4J 集成

    探索图数据库 Neo4J，本章讨论了它的基本概念、Java 驱动和高级建模。帮助读者利用 Neo4J 处理复杂的关系。


    ## 第 16 章：ArangoDB 和 Couchbase 集成

    本章探索了多模型 NoSQL 数据库 ArangoDB 和多模型数据库 `Couchbase` 与 Java 应用的集成。涵盖了其功能、Java 驱动、数据建模和使用实践。


    ## 第 17 章：最后考虑

    最后一章回顾了书中涵盖的关键概念和技术。它强调了多语言持久化的重要性，讨论了 Jakarta EE 和 MicroProfile 的角色，并对数据迁移、备份、数据治理和安全性提供了见解。


