    nodes running a Couchbase server instance. These nodes can be distributed across
    different physical machines or virtual instances. Nodes within a Couchbase cluster
    serve different roles:  Data nodes (Data Data nodes store data and perform operations.
    They manage data storage, indexing, and query processing. Index nodes (Index Index
    nodes manage the secondary indexing of data for efficient query processing. They
    create and maintain indexes to accelerate queries. Query nodes (Query Query nodes
    are responsible for processing N1QL queries, Couchbase’s SQL-like query language.
    They optimize and execute queries against the data stored in data nodes. Search
    nodes (Full-text search Search nodes handle full-text search operations and enable
    the integration of full-text search capabilities into your applications. Analytics
    nodes (Analytics Analytics nodes execute analytical queries on the data stored
    in data nodes, allowing for complex data analysis without affecting operational
    workloads. Eventing nodes (Eventing Eventing nodes enable the creation of event-driven
    functions and trigger actions based on changes in the data. The following figure
