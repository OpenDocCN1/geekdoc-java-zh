  mdcn: "\n微软提供了许多选择，其中最好的是 Visual Studio。该程序可用于处理 .NET 框架的所有方面。这无疑是一个非常先进的程序，并提供多个版本。完整的\
    \ Visual Studio 价格相当昂贵，即使对于爱好者来说可能也太高级了。\n\n在 .NET 框架发布时，微软推出了该产品的 Express 版本。这些版本是为业余程序员以及刚开始学习\
    \ .NET 框架的人准备的。Express 版本仅支持一种编程语言。它们可能没有 Visual Studio 最先进的特性，但它们是免费的。对于学习你选择的语言（在本例中是\
    \ C#）来说，这些版本也非常容易使用。\n\n市场上还有其他第三方编辑器可用。然而，对于本书，我们将使用 Visual C# Express 来编写代码。你必须记住，无论你使用哪种编辑器，代码都是保持相同的。\n\
    \n## 第 2 章\n\n## Hello World：编写你的第一个 C# 程序\n\n如果你在学习 C# 之前已经学习或接触过任何编程语言，你将对“Hello,\
    \ world!”感到熟悉。这是一个演示编程语言实际运行的经典示例。这正是你在本章中将学习的内容。\n\n这个编程示例将说明编程语言的基础。你将遇到几个函数和类，在以后编写更高级的代码时肯定会用到它们。\n\
    \n## 开始新项目\n\n要启动一个新的 C# 项目，你应该首先打开 Visual C# Express。在“文件”（File）菜单中，选择“新建项目”（New\
    \ Project）选项。项目对话框将打开，你应该从中选择“控制台应用程序”（Console application）。这是你在运行 Windows 的系统中可以找到的最基本的应用程序类型。点击“确定”（Ok）选项，让\
    \ Visual C# Express 为你创建新项目。\n\n你还会注意到创建一个名为 `Program.cs` 的文件。这将是你编写代码的应用程序文件。你会发现该文件已经有几行代码，如下所示。\n\
    \n```c\nusing System;\nusing System.Collections.Generic;\nusing System.Text;\n\
    namespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n        }\n    }\n}\n```\n\n这些代码肯定可以运行，但结果无无物。如果你愿意，可以按下\
    \ F5 键来运行应用程序。这将导致 Visual C# Express 编译并执行你的代码。执行时，将启动一个黑窗口，然后它会再次关闭。这仅仅是因为应用程序没有其他要执行的功能了。\n\
    \n为了让这个程序实际执行某些操作，你需要插入几行代码。你应该在最后一组 `{}` 内部输入以下两行。\n\n```csharp\nConsole.WriteLine(\"\
    Hello, world!\");\n```\n\n```csharp\nConsole.ReadLine();\n```\n\n输入这些行后，你的整个程序应该看起来如下。\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Text;\n\
    namespace ConsoleApplication1\n{\nclass Program\n{\nstatic void Main(string[]\
    \ args)\n{\nConsole.WriteLine(\"Hello, world!\");\nConsole.ReadLine();\n}\n}\n\
    }\n```\n\n为了运行此程序，你应该再次按下 F5。如果没有错误，你会注意到黑窗口保持开启而不是关闭。在窗口中，你会注意到显示了消息“Hello, world!”。当然，这是你输入到应用程序中的短语。\n\
    \nC# 之被认为是一种非常用户友好的编程语言是有原因的。原因在于，即使你以前从未用它编写过程序，也很理解其中的大部分代码。你会在刚刚编写的程序中很容易地发现这一点。\n\
    \n## 理解“Hello, world!”程序\n\n上一个应用程序只是一个如何在 C# 中编写程序的示例。当然，你需要理解它实际上是如何运行的，以及代码实际上意味着什么。这就是你在本节中将学习的内容。\n\
    \n为了理解这个程序，先考虑 `{` 和 `}`。毕竟，它们在程序中重复了。它们被称为大括号（curly braces）。在 C# 中，这些大括号表示代码逻辑区域的开始和结束。你会注意到，这些大括号经常用于\
    \ Java 和 C++ 等其他许多编程语言。如示例所示，它们的主要功能是将属于它的几行代码组合在一起。\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Text;\n```\n\n如果你正在使用 Visual C#\
    \ Express，你会发现 `using` 术语被亮为蓝色。这实际上是一个关键字，它的功能是导入命名空间（namespace）。类的集合被称为命名空间。类（Classes）的工作是自动为你提供某些功能。\n\
    \n当你使用像 Visual C# Express 这样高级的 IDE 时，关键字 `using` 最终会替你创建部分简单易见的代码。在这个示例中，它被用于为你创建一个类。它还导入了必要的或预期的使用的命名空间。\n\
    \n在这个示例中，三个命名空间被导入到程序中。每个命名空间都包含一些实用的类。`Console` 类在该程序中使用，它属于 `System` 命名空间。\n\
    \n你还会注意到应用程序拥有它自己的命名空间，如下所示。\n\n## “Namespace”ConsoleApplication1\n\n这现在是应用程序的主命名空间。默认情况下，任何新创建的类都将成为它的一部分。可以修改这一点并在另一个命名空间下创建其他类。如果你想这样做，你需要借助\
    \ `using` 语句将此命名空间导入到你的应用程序中。\n\n下一步，必须定义类。C# 是一种面向对象的语言。因此，所有实际执行操作的代码行都必须放在类内部。对于此示例，类被命名为\
    \ `Program`，如下所示。\n\n## “Class” Program\n\n在同一个应用程序中增加类的数量是可能的。然而，对于这个程序来说没有必要。类可以包含许多方法、属性和变量。不过，这些将在以后讨论。在这个程序中，只有一个方法，声明如下。\n\
    \n## “Static void Main” (string[] args)\n\n这一行的第一个单词是 `static`，它是一个关键字。它指示程序在不实例化类的情况下即可访问该方法。`void`\
    \ 关键字告诉程序应该返回什么，在本例中什么都不返回。\n\n`Main` 单词只是给这个方法的名称。在这种情况下，它充当所谓的应用程序入口点（entry-point）。换句话说，这将是程序中将执行的第一部分代码。\n"
