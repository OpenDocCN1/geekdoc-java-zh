    \ and classes are set to being privately visible.\n\n- **Internal**: These items\
    \ can only be accessed from inside the same project.\n\n- **Protected**: Items\
    \ designated as protected can be accessed only from inside the same class or from\
    \ a class that inherits from that class.\n\n- **Protected internal**: This visibility\
    \ is similar to internal visibility but with a major difference. Classes that\
    \ inherit from the class of the protected internal item can access that item even\
    \ if the inherited classes are present in another project.\n\nYou should now be\
