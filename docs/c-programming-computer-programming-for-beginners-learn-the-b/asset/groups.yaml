    \n即使你对计算机编程只有一点的了解，你也应该听过过调试（debugging）。这是所有类型软件和应用程序编程中至关重要的过程。你看，程序中可能存在错误。这些错误可能仅仅是拼写错误或不错误的语句。它们统称为\
