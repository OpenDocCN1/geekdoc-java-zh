    using System.Text;\n```\n\nIf you are using Visual C# Express, you will notice\
    \ that the term ‘using’ has been highlighted in blue. This is actually a keyword,\
    \ and its function is to import a namespace. A collection of classes is known\
    \ as the namespace. It is the job of Classes to provide you with certain functionalities\
    \ automatically.\n\nWhen you are working on an advanced IDE such as Visual C#\
    \ Express, the keyword, 'using' will end up creating parts of the trivial code\
    \ in your stead. In this example, it was used for creating a class for you. It\
    \ also imported the namespaces that are necessary or expected to be used.\n\n\
    In this example, three namespaces have been imported into the program. Each of\
    \ these namespaces contains some useful classes. The Console class has been used\
    \ in this program, and it belongs to the System namespace.\n\nYou will also notice\
    \ that the application gets its very own namespace as shown below.\n\n## ‘Namespace’\
    \ ConsoleApplication1\n\nThis is now the primary namespace for this application.\
    \ By default, any new classes created will become a part of it. It is possible\
    \ to modify this and create other classes under another namespace. If you want\
    \ to do so, you need to import this namespace into your application with the help\
    \ of the ‘using’ statement.\n\nFor the next step, the class has to be defined.\
    \ C# is an object oriented language. As a result, all lines of code which actually\
