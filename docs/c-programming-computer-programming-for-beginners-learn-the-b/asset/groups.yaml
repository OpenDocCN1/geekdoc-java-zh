    \ are mentioned below. Of course, not all of them are going to be useful for you\
    \ at this stage, but you are certain to come across them as your advance in C#.\n\
    \n- **Public**: An item defined as the public can be reached from all places this\
    \ is the least restrictive of all the types of visibilities. By default, items\
    \ like Interfaces and Enums have public visibility.\n\n- **Private**: This visibility\
    \ is the most restrictive of all the types of visibilities. The private items\
