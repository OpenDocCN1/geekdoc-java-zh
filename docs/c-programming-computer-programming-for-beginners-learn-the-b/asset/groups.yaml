    \ system which will terminate the program and an error will show. The infinite\
    \ loop can also be stopped due to the occurrence of some other event. For example,\
    \ the program can be made to terminate automatically after a specific duration\
    \ of time.\n\nIn C#, you will come across four different kinds of loops. As such,\
    \ you need to be familiar with them.\n\n## The while Loop\n\nThe simplest of the\
    \ four loops in C# is the while loop. In this type of loop, a sequence of instructions\
