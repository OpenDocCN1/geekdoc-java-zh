- md: "\nWith this, you will have successfully completed writing your very first program.\
    \ You will have also learned a few functions and terms that you are going to need\
    \ while writing C# programs.\n\n# Chapter 3\n\n## Understanding Data Types and\
    \ Variables\n\nWhenever you are using a programming language, you are certain\
    \ to come across data types. As C# is a strongly typed programming language, it\
    \ is necessary for you to tell the compiler which data types you are going to\
    \ use every time you want to declare a variable. Of course, variables are critical\
    \ to any programming language.\n\n## Introduction to Data Types\n\nIn C#, data\
    \ types can be broadly classified into three types. They are discussed as follows.\n\
    \n- **Value Type**: These data types can be directly assigned a value, and they\
    \ are derived from the System.ValueType class. As such, they contain the data\
    \ directly. Some examples of value types are char, Int, and Bool.\n- **Reference\
    \ Type**: These data types do not have the actual data kept in a variable. Instead,\
    \ they have a reference to the variables. That means that they actually refer\
    \ to a specific memory location. It is possible to use multiple variables to refer\
    \ to a specific memory location. In this case, one variable changes the data present\
    \ in the memory location, the other variables will automatically reflect the change.\
    \ Some examples of reference types include string, dynamic, and object.\n- **Pointer\
    \ Types**: These data types actually store the memory address of some other type.\
    \ If you are familiar with C++ or C, you will understand that the pointer types\
    \ in C# will have the same capabilities as that of the pointer types in those\
    \ programming languages.\n\n## The Common Data Types\n\nThere are a wide variety\
    \ of data types used in C#. Of course, some of them will be used more often than\
    \ other when you start programming in earnest. As a result, it will benefit you\
    \ greatly if you start learning about the most widely used data types. Here are\
    \ some of them to help you get started.\n\n**Bool**: This is one of simplest data\
    \ types available as it represents Boolean value. As such, it can have only two\
    \ values, either true or false. It is important to understand this type, especially\
    \ when using logical operators such as the ‘if’ statement. By default, its value\
    \ is false.\n\n**Byte**: This data type represents an 8-bit integer that is unsigned.\
    \ It has a range of 0 to 255 when it comes to storing numbers. By default, the\
    \ value of this data type is 0.\n\n**Int**: This is actually short for the integer\
    \ which is a data type used for storing numbers that do not have decimals like\
    \ the byte data type. However, unlike byte, Int has a range of -2,147,483,648\
    \ to 2,147,483,647. If you are working with numbers, you are more likely than\
    \ not to end up using this data type.\n\n**Char**: This data type represents 16-bit\
    \ Unicode character, and it is used for storing only one character.\n\n**String**:\
    \ This can be said to be an upgraded version of the char data type as it can be\
    \ used for storing text. That is, it can store multiple chars instead of a single\
    \ one. In C#, this data type is immutable. In other words, after the creation\
    \ of a string, they are never changed. If you use methods which can change a string,\
    \ a new string is actually returned. The original one is not changed.\n\n### An\
    \ Introduction to Variables\n\nVariables are crucial to programming. In any programming\
    \ language, a variable is actually a storage location which has been associated\
    \ name (referred to as an identifier) and it contains some quantity of information\
    \ which may be unknown or known. This information is referred to as the value.\
    \ The identifier is used for referencing the stored value. During runtime, the\
    \ identifier can be linked to a value, but this value may change as the program\
    \ is being executed.\n\nIn C#, variables are declared in the following syntax:\
    \ `<datatype> <name>;`\n\nHowever, it is possible to assign a value to the variable\
    \ at the same time that you are making it visible. In such cases, you need to\
    \ use the following syntax in order to do so: `<visibility> <datatype> <name>\
    \ = <value>;`\n\nHere is an example application that demonstrates the use of variables.\n\
    \n```c\nusing System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            string\
    \ firstName = \"John\";\n            string lastName = \"Doe\";\n            Console.WriteLine(\"\
    Name: \" + firstName + \" \" + lastName);\n            Console.WriteLine(\"Please\
    \ enter a new first name :\");\n        }\n    }\n}\n```\n\n```csharp\nfirstName\
    \ = Console.ReadLine();\n\nConsole.WriteLine(\"New name: \" + firstName + \" \"\
    \ + lastName);\nConsole.ReadLine();\n\n}\n}\n```\n\nYou will already recognize\
    \ a few commands and statements from the earlier chapter. As such, let’s concentrate\
    \ on the variables.\n\nIn the program, two variables are declared first, and they\
    \ have defined string type variables. A value is also assigned to the variables\
    \ immediately in the same statement. Therefore, the two variables have been named\
    \ as “firstName” and “lastName” and they contain the values, “John” and “Doe”\
    \ respectively.\n\nIn the next statement, some text is sent as output to the console.\
    \ For the output, the two variables have been used. In this case, the + characters\
    \ have been used to bring together the various parts of the output text.\n\nIn\
    \ the next section of the code, the user is requested to enter a new name. The\
    \ input from the user is then recognized and read from the console by means of\
    \ the ReadLine() method. The input is then assigned as the value of the variable,\
    \ “firstName”.\n\nThe next statement displays the value of the “firstName” variable\
    \ to the user to denote that it has changed. This is one of the most common ways\
    \ to change the value of any variable during runtime.\n\nNow, you know the basics\
    \ of data types and variables. You have also learned how to declare variables\
