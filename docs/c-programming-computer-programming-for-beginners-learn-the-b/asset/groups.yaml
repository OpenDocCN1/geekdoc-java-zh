    Object is being created, length = {0}\", len);\n            length = len;\n  \
    \      }\n        public void setLength(double len )\n        {\n            length\
    \ = len;\n        }\n        public double getLength()\n        {\n          \
    \  return length;\n        }\n        static void Main(string[] args)\n      \
    \  {\n            Line line = new Line(10.0);\n            Console.WriteLine(\"\
    Length of line : {0}\", line.getLength());\n            // set line length\n \
    \           line.setLength(6.0);\n            Console.WriteLine(\"Length of line\
    \ : {0}\", line.getLength());\n            Console.ReadKey();\n        }\n   \
    \ }\n}\n```\n\nThe result produced on executing the code shown above is given\
    \ as follows.\n\nObject is being created; length = 10\nLength of line : 10\nLength\
    \ of line : 6\n\n### Destructors in C#\n\nLike constructors, a destructor is also\
    \ a special member function of a class. However, it gets executed only when one\
    \ of the objects of the class goes outside of its designated scope. The name of\
    \ the destructor is the exact same as that of its class, but it will have a prefixed\
    \ tilde (~) with it. A destructor is incapable of returning a value or taking\
    \ any parameters. Destructors can be rather beneficial as they can release memory\
    \ resources before the program is exited. It is not possible for destructors to\
    \ be inherited.\n\nThe following example demonstrates the use of destructors.\n\
