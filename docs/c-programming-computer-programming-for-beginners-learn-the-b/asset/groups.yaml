    # 引言


    首先，感谢您购买本书《编程：初学者计算机编程：学习 C# 基础》。C# 是微软在其 .NET 计划下开发的。


    C#（读音为 C Sharp）是一种编程语言。它是一种多范式编程语言，支持多种编程范式，例如面向对象的范式。因此，在为当前任务选择编程风格时，你可以享受巨大的灵活性。此外，C#
    被认为是对于想要进入计算机编程巨大世界迈出第一步的初学者来说的一种简单语言。


    学习 C# 将为你开启大量机会。从 C# 开始，你可以回退一步学习令人惊叹的 C 语言，然后是 C++。对 C# 的知识还让你能够通过 .NET 平台掌握
    Web 开发所需的技能。此外，如果你计划以后为微软生态系统开发产品，这种语言也会很有帮助。


    你是否感到这些内容让你无从从心？对于初学者来说，这可能需要很多时间吸收。然而，你不必过度担心。这本书将帮助你获得成为 C# 程序员所需的基础知识。你将学习一些酷炫的新术语，甚至是一些程序。你将遇到这种语言中一些术语和函数。简而言之，你将得到充分的准备，以便开始高级课程并成为一名顶尖程序员。


    让我们开始学习 C# 吧！


    # 第一章

    ## C# 简介


    当微软最初开发 .NET 框架时，程序员必须在 Simple Managed C（一种托管代码编译器系统）的帮助下编写类库。然而，使用 C 存在一些问题。因此，C#
    被开发成为一种新语言以克服这些问题。


    C# 专门设计得既简单又现代。它是一种面向对象且通用的编程语言。如果你已经熟悉编程，你将很容易识别出 C# 借用了许多其他编程语言的一系列关键概念，其中最著名的是
    Java。


    ### .NET 框架的重要性


    从理论上说，C# 能够被编译为机器码。尽管如此，在现实生活中，这种语言几乎总是与 .NET 框架一起使用的。由于这个原因，你需要确保在运行用 C# 编写程序的计算机上安装了
    .NET 框架。


    .NET 框架兼容大量的编程语言。然而，与该框架最密相关的是 C#。在某些圈子里，它甚至被称为“.NET 语言”。


    ## 开始 C# 编程需要什么？


    在开始编写 C# 程序之前，有一些事情需要你先处理。确保你的计算机上安装了以下程序：


    - .NET 框架软件开发包（SDK）

    - 编辑器


    就这些了。你开始 C# 编程只需要这两样。有许多编辑器可用。你甚至可以使用记事本或 DOS 编辑器，稍后会介绍。尽管如此，如果你安装了以下可选程序之一，对你的学习曲线会有好处：


    - Visual C# .NET

    - Visual C++ 6.0（在 Microsoft Visual Studio 6.0 包中）


    你的第一步应该是并在计算机上安装 .NET SDK。你可以从微软官方网站下载该程序。你还将获得一份完整的文档。安装此套件后，你将能够编译并执行你的 C# 源码。这是通过套件中内置的命令行编译器以及运行时即时编译器（JIT）实现的。如果你以前接触过
    Java，你可以识别出它们类似于 Java 开发工具包（JDK）中提供的 Java 编译器和 Java 解释器。


    ## 关于编辑器


    编辑器是用于编写源码的程序。C# 在这方面是多功能的，因为它可以使用几乎任何文本编辑器编写。即使是 Windows 自带的记事本也是一个选择。对于编译，你可以轻松使用
    .NET 框架中的 csc.exe 命令行编译器。


