    \n# Chapter 10 An Insight to Structures and Enums\n\nNow that you have learned\
    \ about arrays and strings, it is time to take a look at structures and enums.\
    \ They play vital roles in a variety of programs. Therefore, let's find out more\
    \ about them.\n\n## What is a Structure?\n\nA structure in C# is a value type\
    \ datatype. With it, it becomes possible for a single variable to hold related\
    \ data of different datatypes. To create a structure, you have to use the struct\
    \ keyword. Structures are typically used for representing a record.\n\nLet us\
    \ take library books as our example in understanding structures better. In a library,\
    \ you will have to keep track of the books. Now, there are various attributes\
    \ you may want to consider while tracking each book such as the title, the author,\
    \ and the subject among others. We will be using this example in the programs\
    \ in the following sections.\n\n## Defining Structures\n\nAs mentioned earlier,\
    \ the struct statement has to be used for the defining structure. This statement\
    \ can define a new datatype that has more than one member.\n\nLet us take that\
    \ example about the books and define a Book structure based on it. The following\
    \ is how it will look like.\n\n```csharp\nstruct Books\n{\n    public string title;\n\
    \n    public string author;\n\n    public string subject;\n\n    public int book_id;\n\
    };\n```\n\nThe example given below shows you how the structure is being used.\n\
    \n```csharp\nusing System;\n\nstruct Books\n{\n    public string title;\n    public\
    \ string author;\n\n    public string subject;\n\n    public int book_id;\n};\n\
    \npublic class testStructure\n{\n    public static void Main(string[] args)\n\
    \    {\n        Books Book1; /* Declare Book1 of type Book */\n        Books Book2;\
    \ /* Declare Book2 of type Book */\n        /* book 1 specification */\n     \
    \   Book1.title = \"C# Programming\";\n        Book1.author = \"John Smith\";\n\
    \        Book1.subject = \"C# Programming Tutorial\";\n        Book1.book_id =\
    \ 123456;\n\n        /* book 2 specification */\n        Book2.title = \"Java\
