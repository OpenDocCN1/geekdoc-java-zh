    \ Chapter 11 Becoming Familiar with the Concept of Inheritance\n\nAs mentioned\
    \ in the previous chapter, one of the most important aspects of any object oriented\
    \ programming language is classes. In the same way, inheritance is a key concept\
    \ in object oriented programming.\n\nAs C# is such a language, you will have to\
    \ utilize inheritance sooner than later. In fact, the entirety of the .NET framework\
    \ has been built upon the concept of inheritance. It is responsible for the expression\
    \ that everything is an object.\n\nInheritance, in simple terms, enables you to\
    \ create classes that can inherit specific attributes from their parent classes.\
    \ In C#, even a simple number can be an instance of a class that inherits from\
    \ the parent class, System.Object.\n\nInheritance can be a bit advanced for some\
    \ beginners. However, it is better to become familiar with it sooner than later\
    \ because of the roles it plays in C# programming. Here is an example that illustrates\
    \ the use of inheritance.\n\n```csharp\npublic class Animal\n{\n    public void\
    \ Greet()\n    {\n        Console.WriteLine(\"Hello! I'm some kind of animal.\"\
    );\n    }\n}\npublic class Cat: Animal\n{\n}\n```\n\nAs you can see, an Animal\
    \ class has been defined first along with a simple method that sends out a greeting\
    \ to the user. This is followed up by defining a Cat class. We now use a colon\
    \ to inform C# that the Cat class is going to be inheriting from the Animal class.\
    \ Now, it is possible to start using these classes\n\n```csharp\nAnimal animal\
    \ = new Animal();\nanimal.Greet();\n```\n\n```csharp\nDog dog = new Dog();\n\n\
    dog.Greet();\n```\n\nOn running the example given above, you will find that the\
    \ Greet() method is executed even though it has not been defined for the Cat class.\
    \ This is because the method has been inherited by the Cat class from the Animal\
    \ class.\n\nOf course, the greeting given in the above examples are rather vague.\
    \ It is possible to customize the greeting so that it contains the name of the\
    \ animal. This is shown in the next example.\n\n```csharp\npublic class Animal\n\
    {\n    public virtual void Greet()\n{\n        Console.WriteLine(\"Hello! I'm\
    \ some kind of animal.\");\n    }\n}\n```\n\n```csharp\npublic class Cat: Animal\n\
    {\n    public override void Greet()\n```\n\n```csharp\n{\n    Console.WriteLine(\"\
    Hello! I'm a cat.\");\n}\n}\n```\n\nAs you can notice, there are a few changes\
    \ to the code in the above examples. A method has been added on the Cat Class\
    \ and, on the Animal class, the virtual keyword has been added to the method.\
    \ Additionally, there is the presence of the override keyword on the Cat class.\n\
    \nIn C#, it is not possible to override an item of any class unless it has been\
    \ marked as virtual. It is certainly possible to keep accessing the inherited\
    \ method even after it has been overridden with the help of the base keyword.\
    \ This is shown in the example below.\n\n```csharp\npublic override void Greet()\n\
    {\n    base.Greet();\n    Console.WriteLine(\"Yes! I am - a cat!\");\n}\n```\n\
    \nHowever, methods are not the only thing that can be inherited. In fact, nearly\
    \ all members of a class will be inherited. This includes properties and fields.\
    \ All you need to ensure the proper result is to utilize the proper visibility,\
    \ as explained in the earlier chapter.\n\nAnother thing you need to remember is\
    \ that inheritance need not take place from one class to another. It is possible\
    \ to have an entire hierarchy of classes that inherit from one another. Keeping\
    \ in tune with the earlier examples, it is possible to create a Kitten class that\
    \ inherits from the Cat class and that, in turn, will be inheriting from the Animal\
    \ class.\n\nHowever, there is one thing that you cannot perform in C#, and that\
    \ is multiple inheritances. In other words, you cannot make a class inherit from\
    \ multiple classes simultaneously. C# does not support this feature.\n\n## Understanding\
    \ the Concept of Base Class and Derived Class\n\nIt is possible for a class to\
    \ be derived from more than a single class. As a result, it is possible to inherit\
    \ the functions and data from multiple base classes.\n\nGiven below is the syntax\
    \ used to create derived classes in C#.\n\n```csharp\n<access-specifier> class\
    \ <base_class>\n{\n...\n}\nclass <derived_class> :<base_class>\n{\n...\n}\n```\n\
