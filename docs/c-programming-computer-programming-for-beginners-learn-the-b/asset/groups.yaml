    \ The most common and simplest form of these arrays is the 2-dimensional array.\n\
    \n## Jagged Arrays\n\nThese arrays can be simply said to be arrays of arrays.\n\
    \n## The Array Class\n\nThis class is defined in the System namespace. This is\
    \ the base class for all the arrays. As such, it provides a number of methods\
    \ and properties to help you while working with arrays.\n\n## Passing an Array\
    \ to a Function\n\nIt is possible to pass a function to the array. This can be\
    \ done by specifying the name of the array but without the index.\n\n## Param\
    \ Arrays\n\nThey are used for passing an unknown number of parameters to a given\
    \ function.\n\nThis concludes the section on arrays. Now, we will be taking a\
    \ look at strings.\n\n## Introducing Strings\n\nIn C#, strings can be used as\
    \ an array of characters. Be that as it may, the common procedure is using the\
    \ string keyword for declaring a storing variable. You must remember that the\
    \ string keyword is simply an alias for the class System.String.\n\n## Creation\
    \ of a String Object\n\nA string object can be created by any one of the following\
    \ procedures.\n\n- By getting a string literal assigned to a String variable\n\
    - With the use of a String class constructor\n- Via the retrieval of property\
    \ or by calling a method which can return a string.\n- Through the use of the\
    \ string concatenation operator, +\n- By means of a call to a formatting method\
    \ that can convert an object or value into the corresponding string representation.\n\
    \nThe following example illustrates the creation of a string object.\n\n```c\n\
    using System;\n\nnamespace StringApplication\n{\n    class Program\n    {\n  \
    \      static void Main(string[] args)\n        {\n//from string literal and string\
    \ concatenation\nstring fname, lname;\nfname = \"John\";\nlname = \"Smith\";\n\
    string fullname = fname + lname;\nConsole.WriteLine(\"Full Name: {0}\", fullname);\n\
    //by using string constructor\nchar[] letters = { 'H', 'e', 'l', 'o' };\nstring\
    \ greetings = new string(letters);\nConsole.WriteLine(\"Greetings: {0}\", greetings);\n\
    //methods returning string\nstring[] srayay = { \"Hello\", \"From\", \"The\",\
    \ \"Earth\" };\nstring message = String.Join(\" \", srayay);\nConsole.WriteLine(\"\
    Message: {0}\", message);\n//formatting method to convert a value\nDateTime waiting\
    \ = new DateTime(2016, 10, 17, 58, 1);\nstring chat = String.Format(\"Message\
    \ sent at {0:t} on {0:D}\", waiting);\nConsole.WriteLine(\"Message: {0}\", chat);\n\
    }\n}\n}\n```\n\nAfter compiling and executing the code shown above, the following\
    \ result is produced.\n\nFull Name: Rowan Atkinson\n\nGreetings: Hello\n\nMessage:\
    \ Hello From The Earth\nMessage: Message sent at 5:58 PM on Wednesday, October\
    \ 10, 2016\n\n## String Class Properties\n\nThe String class possesses two properties.\
    \ They are mentioned as follows.\n\n- Chars: This gets the Char object at the\
    \ position specified in the given String object.\n- Length: This will get the\
    \ total number of characters in the given String object.\n\n## Methods Present\
    \ In the String Class\n\nThere are several methods available in the String class.\
    \ These methods can be helpful when you are working with string objects. Here\
    \ are some of the methods that are commonly used.\n\n### public static int Compare(string\
    \ strA, string strB)\n\nThis will compare the two given string objects. An integer\
    \ will be returned that indicates the relative position of the objects in the\
    \ sort order.\n\n### public static int Compare(string strA, string strB, bool\
    \ ignoreCase )\n\nThis will compare the two given string objects and will also\
    \ return an integer indicating the relative position of the objects in the sort\
    \ order. Be that as it may, it will be ignoring case when the Boolean parameter\
    \ is true.\n\n### public static string Concat(string stro, string str1)\n\nThis\
    \ will concatenate two string objects. It is possible to increase the number of\
    \ string objects being concatenated.\n\n### public bool Contains(string value)\n\
    \nIt will return a value that indicates whether the given String object is present\
    \ in the given string.\n\n```csharp\npublic static string Copy(string str)\n```\n\
    \nThis will create a new String object that has the same value as the given string.\n\
    \n```csharp\npublic bool EndsWith(string value)\n```\n\nThis will determine if\
    \ the end of the given string object is a match with the given string.\n\n```csharp\n\
    public static bool Equals(string a, string b)\n```\n\nThis will determine if the\
    \ two given String objects have the exact same value.\n\n```csharp\npublic int\
    \ IndexOf(char value)\n```\n\nThis will return the index of the given Unicode\
    \ character in the string. The zero-based index will be provided of the first\
    \ occurrence of the character.\n\n```csharp\npublic static string Format(string\
    \ format, Object argo)\n```\n\nThis will replace one or multiple format items\
    \ in the given string. They will be replaced with the string representation of\
    \ the given object.\n\n```csharp\npublic string Insert(int startIndex, string\
    \ value)\n```\n\nThis will return a new string that has a given string inserted\
    \ at a specific index position in the given string object.\n\n```csharp\npublic\
    \ static bool IsNullOrEmpty(string value)\n```\n\nThis indicates if the given\
    \ string is a null string or an empty string.\n\n```csharp\npublic static string\
    \ Join(string separator, params string[] value)\n```\n\nThis will concatenate\
    \ all the elements of the string array by using the given separator between each\
    \ of the elements in it.\n\n```csharp\npublic static string Join(string separator,\
    \ string[] value, int startIndex, int count)\n```\n\nThis will concatenate the\
    \ stated elements of the string by using the given separator between each of the\
    \ elements.\n\n```csharp\npublic int LastIndexOf(char value)\n```\n\nThis returns\
    \ the index position of the given Unicode character inside the current string\
    \ object. The zero-based index position will be used, and only the last occurrence\
    \ will be mentioned.\n\n```csharp\npublic string Remove(int startIndex)\n```\n\
    \nThis will remove all characters present in the current instance starting from\
    \ the specified position. It will continue through till the last position. Finally,\
    \ the string will be returned.\n\nThere is a wide range of other methods and constructors\
    \ for the String class. The MSDN library contains the complete list. Now, let\
    \ us take a look at a few examples that demonstrate how some of the methods given\
    \ above can be used.\n\nThe example below illustrates how strings can be compared.\n\
    \n```csharp\nusing System;\nnamespace StringApplication\n{\n    class StringProg\n\
    \    {\n        static void Main(string[] args)\n        {\n            string\
    \ str1 = \"This is test\";\n            string str2 = \"This is text\";\n    \
    \        if (String.Compare(str1, str2) == 0)\n            {\n               \
    \ Console.WriteLine(str1 + \" and \" + str2 + \" are equal.\");\n            }\n\
    \            else\n            {\n                Console.WriteLine(str1 + \"\
    \ and \" + str2 + \" are not equal.\");\n            }\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\nOn executing the code shown above, the following\
    \ result will be produced.\n\nThis is a test, and This is text are not equal.\n\
    \nThe example shown below demonstrates a string that contains another string.\n\
    \n```csharp\nusing System;\n\nnamespace StringApplication\n{\n  class StringProg\n\
    \  {\n    static void Main(string[] args)\n    {\n        string str = \"This\
    \ is test\";\n        if (str.Contains(\"test\"))\n        {\n            Console.WriteLine(\"\
    The sequence 'test' was found.\");\n        }\n        Console.ReadKey();\n  \
    \  }\n}\n}\n```\n\nThe following result is produced on executing the code shown\
    \ above.\n\nThe sequence 'test' was found.\n\nThe example is given as follows\
    \ how you can get a substring using System;\n\n```csharp\nnamespace StringApplication\n\
    {\n    class StringProg\n    {\n        static void Main(string[] args)\n    \
    \    {\n            string str = \"Last night I dreamt of San Pedro\";\n     \
    \       Console.WriteLine(str);\n            string substr = str.Substring(23);\n\
    \            Console.WriteLine(substr);\n        }\n    }\n}\n```\n"
  mdcn: "\n\n## 多维数组\n\nC# 支持多维数组。这些数组最常见且最简单的形式是二维数组。\n\n## 锯齿数组 (Jagged Arrays)\n\
    \n这些数组简单来说就是数组的数组。\n\n## Array 类\n\n该类定义在 `System` 命名空间中。它是所有数组的基类。因此，它提供了许多方法和属性，在您处理数组时提供帮助。\n\
    \n## 将数组传递给函数\n\n可以将数组传递给函数。这可以通过指定数组的名称但不带索引来完成。\n\n## 参数数组 (Param Arrays)\n\n\
    它们用于向给定的函数传递未知数量的参数。\n\n关于数组的章节到此。现在，我们将查看字符串。\n\n## 字符串简介\n\n在 C# 中，字符串可以作为字符数组使用。尽管如此，通常的做法是使用\
    \ `string` 关键字来声明存储变量。你必须记住，`string` 关键字仅仅是类 `System.String` 的一个别名。\n\n## 字符串对象的创建\n\
    \n可以通过以下任何一种过程创建字符串对象。\n\n- 通过将字符串字面量赋值给 `String` 变量\n- 使用 `String` 类构造函数\n- 通过检索属性或调用可以返回字符串的方法\n\
    - 通过使用字符串连接运算符 `+`\n- 通过调用格式化方法，该方法可以将对象或值转换为相应的字符串表示\n\n下面的示例说明了字符串对象的创建。\n\n\
    ```csharp\nusing System;\n\nnamespace StringApplication\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n//来自字符串字面量和字符串拼接\n\
    string fname, lname;\nfname = \"John\";\nlname = \"Smith\";\nstring fullname =\
    \ fname + lname;\nConsole.WriteLine(\"Full Name: {0}\", fullname);\n//使用字符串构造函数\n\
    char[] letters = { 'H', 'e', 'l', 'o' };\nstring greetings = new string(letters);\n\
    Console.WriteLine(\"Greetings: {0}\", greetings);\n//返回字符串的方法\nstring[] srayay\
    \ = { \"Hello\", \"From\", \"The\", \"Earth\" };\nstring message = String.Join(\"\
    \ \", srayay);\nConsole.WriteLine(\"Message: {0}\", message);\n//用于转换值的格式化方法\n\
    DateTime waiting = new DateTime(2016, 10, 17, 58, 1);\nstring chat = String.Format(\"\
    Message sent at {0:t} on {0:D}\", waiting);\nConsole.WriteLine(\"Message: {0}\"\
    , chat);\n}\n}\n}\n```\n\n编译并执行上述代码后，将产生以下结果。\n\nFull Name: Rowan Atkinson\n\n\
    Greetings: Hello\n\nMessage: Hello From The Earth\nMessage: Message sent at 5:58\
    \ PM on Wednesday, October 10, 2016\n\n## String 类属性\n\n`String` 类拥有两个属性。它们如下：\n\
    \n- Chars: 获取给定字符串对象中指定位置的 `Char` 对象。\n- Length: 获取给定字符串对象中的字符总数。\n\n## String\
    \ 类中存在的方法\n\n`String` 类提供了许多可用方法。当您处理字符串对象时，这些方法会非常有帮助。以下是一些常用方法。\n\n### public\
    \ static int Compare(string strA, string strB)\n\n这将会比较两个给定的字符串对象。返回一个整数，表示对象在排序顺序中的相对位置。\n\
    \n### public static int Compare(string strA, string strB, bool ignoreCase )\n\n\
    这将会比较两个给定的字符串对象，并返回一个表示对象在排序顺序中相对位置的整数。尽管如此，当布尔参数为 `true` 时，它将忽略大小写。\n\n### public\
    \ static string Concat(string stro, string str1)\n\n这将会拼接两个字符串对象。\n\n### public\
    \ bool Contains(string value)\n\n这将会检查字符串对象是否包含指定的字符串。\n\n### public bool EndsWith(string\
    \ value)\n\n这将会检查字符串是否以指定的字符串结尾。\n\n### public static bool Equals(string a, string\
    \ b)\n\n这将会判断两个字符串是否相等。\n\n### public int IndexOf(char value)\n\n这将会返回指定字符在字符串中的索引。\n\
    \n### public static string Format(string format, Object arggo)\n\n这将会根据格式格式化对象。\n\
    \n### public string Insert(int startIndex, string value)\n\n这将会从指定位置插入字符串。\n\n\
    ### public static bool IsNullOrEmpty(string value)\n\n这将会指示字符串是否为空或为空。\n\n###\
    \ public static string Join(string separator, string[] value)\n\n这将会使用指定的分隔符连接字符串数组。\n\
    \n### public static string Join(string separator, string[] value)\n\n这将会连接字符串数组。\n\
    \n### public int LastIndexOf(char value)\n\n这将会返回指定字符在字符串中的最后一次索引。\n\n### public\
    \ string Remove(int startIndex)\n\n这将会从指定索引开始删除字符。\n\n### public string Replace(int\
    \ startIndex, string value)\n\n这将会在指定位置替换字符串。\n\n"
