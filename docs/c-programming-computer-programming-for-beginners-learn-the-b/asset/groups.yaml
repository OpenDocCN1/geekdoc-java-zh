    # Chapter 14


    # Learning the Basics of Debugging


    Even if you have but a slight idea about computer programming, you should have
    heard about debugging. This is a vital process for all kinds of software and application
    programming. You see, there can be errors present in a program. These errors can
    be as simple as a typing mistake or an incorrect statement. They are all termed
    as bugs, and they can prevent your program from executing correctly. Therefore
    these bugs need to be removed, and that is achieved through debugging.


    When you are writing simple applications of a few lines such as the examples shown
    in this book, it is quite easy for you to recognize the errors. You can simply
    execute the program and find out the bugs. However, with time, you will surely
    start writing more complex codes that are around hundreds of lines long and filled
    with complicated statements. Due to the high level of complexity involved, it
    becomes very difficult to determine the bugs.'
  - '[PAGE 179]


    In these situations, debugging becomes an extremely useful tool. As a result,
    you must take your time to understand this tool to become a better programmer.
    Without it, it is nearly impossible to correct the bugs you can find in the complex
    code.


    # Understanding Print Debugging


    The most common type of debugging used is known as print debugging. Although it
    is the most basic kind of debugging, it is often used by advanced programmers
    due to its effectiveness in certain situations.


    In print debugging, the application is made to print a number or text. This allows
    you to find out which sections of the code have been executed and what are contained
    in the variables. In C#, the Console.Write() method can be used for printing a
    status message or for displaying the contents of a specific variable on the console.


    For a few situations, this will be enough. On the other hand, you will have much
    better tools to use when you are using a good IDE such as Visual Studio or even
    the Express versions. The good thing is that they are quite easy to use once know
    the basic principles.


    # Introduction to the Breakpoint


    The breakpoint is the first thing that you need to learn about debugging. As the
    name suggests, a breakpoint marks a specific point in the code where its execution
    will be taking a break. The'
  - '[PAGE 180]


    application will not be rendered useless. Instead, the breakpoint simply pause
    the execution of the application.


    If you are using Visual Studio or even the Express version, it is quite easy to
    implement breakpoints. In those IDEs, you will notice that there is a gray area
    located on the left hand side of the code. This is known as the gutter, and a
    left click on this area will cause a red circle to appear. This will be the breakpoint,
    and the debugger will stop the execution of the application at this point.


    These are just the basics of debugging. As you advance as a C# programmer, you
    will automatically come to know about the various other kinds of debugging tools
    and methods apart from the most complicated aspects of debugging.'
  - '[PAGE 181]


