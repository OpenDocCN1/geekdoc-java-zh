    # Understanding Print Debugging\n\nThe most common type of debugging used is known\
    \ as print debugging. Although it is the most basic kind of debugging, it is often\
    \ used by advanced programmers due to its effectiveness in certain situations.\n\
    \nIn print debugging, the application is made to print a number or text. This\
    \ allows you to find out which sections of the code have been executed and what\
    \ are contained in the variables. In C#, the Console.Write() method can be used\
    \ for printing a status message or for displaying the contents of a specific variable\
    \ on the console.\n\nFor a few situations, this will be enough. On the other hand,\
    \ you will have much better tools to use when you are using a good IDE such as\
    \ Visual Studio or even the Express versions. The good thing is that they are\
    \ quite easy to use once know the basic principles.\n\n# Introduction to the Breakpoint\n\
    \nThe breakpoint is the first thing that you need to learn about debugging. As\
    \ the name suggests, a breakpoint marks a specific point in the code where its\
    \ execution will be taking a break. The application will not be rendered useless.\
