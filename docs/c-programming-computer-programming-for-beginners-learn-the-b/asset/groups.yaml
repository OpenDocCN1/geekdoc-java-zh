    \ 1\n\n周五: 5\n\n## 第11 章 熟悉继承概念\n\n如上一节提到的，任何面向对象编程语言最重要的方面之一就是类。同样，继承也是面向对象编程中的一个核心概念。\n\
    \n由于 C# 正是这样一种语言，你迟早要用到继承。事实上，整个 .NET 框架都是在继承的概念之上构建的。它负责实现“万物皆对象”这一理念。\n\n简单来说，继承允许你创建可以从父类继承特定属性的类。在\
    \ C# 中，即使是一个简单的数字也可以是继承自父类 `System.Object` 的类的实例。\n\n对于某些初学者来说，继承可能有点深。然而，考虑到它在\
    \ C# 编程中所扮演的角色，尽早熟悉它会越好。这里是一个说明继承用法的示例。\n\n```csharp\npublic class Animal\n{\n\
    \    public void Greet()\n    {\n        Console.WriteLine(\"Hello! I'm some kind\
    \ of animal.\");\n    }\n}\npublic class Cat: Animal\n{\n}\n```\n\n如你所示，首先定义了一个\
    \ `Animal` 类，并包含一个向用户发送问候的简单方法。接着定义了一个 `Cat` 类。我们现在使用冒号 `:` 告诉 C# `Cat` 类将继承自\
    \ `Animal` 类。现在可以开始使用这些类了。\n\n```csharp\nAnimal animal = new Animal();\nanimal.Greet();\n\
    ```\n\n```csharp\nDog dog = new Dog();\n\ndog.Greet();\n```\n\n运行上述示例，你会发现尽管 `Cat`\
    \ 类中没有定义 `Greet()` 方法，它仍然被执行了。这是因为该方法已经由 `Cat` 类从 `Animal` 类继承了。\n\n当然，上述示例中的问候相当模糊。可以自定义问候内容，使其包含动物的名字。这在下一个示例所示。\n\
    \n```csharp\npublic class Animal\n{\n    public virtual void Greet()\n{\n    \
    \    Console.WriteLine(\"Hello! I'm some kind of animal.\");\n    }\n}\n```\n\n\
    ```csharp\npublic class Cat: Animal\n{\n    public override void Greet()\n```\n\
    \n```csharp\n{\n    Console.WriteLine(\"Hello! I'm a cat.\");\n}\n}\n```\n\n如你所观察，上述示例的代码有几处变化。`Cat`\
    \ 类中添加了一个方法，而在 `Animal` 类的方法上添加了 `virtual` 关键字。此外，在 `Cat` 类中存在 `override` 关键字。\n\
    \n在 C# 中，除非某个类成员被标记为 `virtual`，否则无法对其进行重写。通过 `base` 关键字的帮助，即使在方法被重写后，仍然可以访问继承的方法。如下例所示。\n\
    \n```csharp\npublic override void Greet()\n{\n    base.Greet();\n    Console.WriteLine(\"\
    Yes! I am - a cat!\");\n}\n```\n\n然而，方法并不是唯一可以继承的内容。事实上，类的几乎所有成员都会被继承。这包括属性和字段。你只需要按照前一节解释的，利用正确的可见性来确保正确的结果。\n\
    \n你需要记住的另一点是继承不必发生在两个类之间。可以存在一个相互继承的类层级结构。延续之前的示例，可以创建一个继承自 `Cat` 类的 `Kitten`\
    \ 类，而 `Cat` 类 又会继承自 `Animal` 类。\n\n然而，C# 中有一点是无法实现的，那就是多重继承。换句话说，你不能让一个类同时继承多个类。C#\
