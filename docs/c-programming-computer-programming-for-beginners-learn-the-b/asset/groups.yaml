    # # Chapter 9

    Working with Arrays and Strings


    As you are working with C#, it is certain that you will come across arrays and
    strings. In fact, you have already used arrays while learning about the for each
    loop. For strings, they have been used in various examples in the book. It is
    now time to get to know these two a bit better.


    # ## Getting to Know Arrays


    An array will store a sequential collection of different elements. The collection
    will have a fixed size, and all the elements will be of the same type. They are
    used for storing a collection of data. However, a better way of defining them
    would be to say that they are a collection of variables kept at contiguous memory
    locations.


    Array saves us the trouble of declaring multiple individual variables. Instead,
    we just need to declare a single array variable and then place the values required
    for them. Therefore, we do not have to create a list of variables such as a0,
    a1, a2 and so on.'
