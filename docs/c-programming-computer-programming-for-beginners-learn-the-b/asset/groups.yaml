    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            int number = 0;\n            while (number < 10)\n          \
    \  {\n                Console.WriteLine(number);\n                number = number\
    \ + 1;\n            }\n            Console.ReadLine();\n        }\n    }\n}\n\
    ```\n\nWhen you run this code, you will find that the program lists a sequence\
    \ of numbers in the console starting at 0 and ending at 10.\n\nOf course, the\
    \ variable number is first defined as 0. Every time the loop is executed, the\
    \ variable is incremented by 1. You can see this happening in this statement:\n\
    \nnumber = number + 1\n\nAs a result, the program keeps displaying the numbers\
    \ till it reaches nine which is the last thing to be displayed. You may be wondering\
    \ why nine is being displayed when you have mentioned 10 in the code.\n\nThe condition\
    \ will only be true when the number is less than 10. Once the number becomes 10,\
    \ the condition becomes false. After all, ten is not less than 10. As you can\
    \ see, the condition of the while loop is checked before the program enters the\
    \ loop sequence. Once the number turns 10, the condition becomes false, and the\
    \ while loop sequence is not executed.\n\n## The do Loop\n\nThe do loop shares\
    \ certain similarities with the while loop with one major difference. The while\
    \ loop checks the condition before the loop sequence is executed. On the other\
    \ hand, the do loop will check the condition after the loop has been executed.\
    \ This means the loop sequence will always be executed at least one time before\
    \ exiting. This is not possible with the while loop. Take a look at the following\
    \ example.\n\n```\nusing System;\n\nnamespace ConsoleApplication1\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \   int number = 0;\n          do\n          {\n            Console.WriteLine\
    \ (number);\n            number = number + 1;\n          } while (number < 10);\n\
    \          Console.ReadLine();\n        }\n    }\n}\n```\n\nOn running this program,\
    \ you will see the numbers being displayed from 0 to 9. Once the number becomes\
    \ 10 or more than 10, the program will exit the loop sequence. As you can see,\
    \ the do loop functions in a similar manner to the while loop but checks the condition\
    \ after the execution of a sequence.\n\n## The for Loop\n\nThe for loop is different\
