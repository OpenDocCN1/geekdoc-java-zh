    \nVolume of Box1: 210\n\nVolume of Box2: 1560\n\n## C# 中的静态成员（Static Members）\n\
    \n类成员可以通过 `static` 关键字定义为静态。将类的特定成员声明为静态，无论创建了多少个对象，该静态成员都只有一个副本。换句话说，`static`\
    \ 关键字表示类只有一个实例。静态变量通常用于定义常量。这是因为可以在不实例化的情况下调用类来检索它们的值。静态变量初始化可以在类定义之外进行。同时，静态变量也可以在类内部初始化。\n\
