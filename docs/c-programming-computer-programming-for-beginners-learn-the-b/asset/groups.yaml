    \ will have come across these two terms. Well, they are not difficult to grasp.\
    \ Here, we will be taking a look at each of them in turn.\n\n### Constructors\
    \ in C#\n\nA class constructor can be said to be a special member function of\
    \ the class. This will be executed whenever new objects are created by that class.\
    \ A constructor will have the exact same name as its class. There are no return\
    \ types for a constructor.\n\nThe following example demonstrates constructors.\n\
    \n```csharp\nusing System;\n\nnamespace LineApplication\n{\n    class Line\n{\n\
    \        private double length; // Length of line\n        public Line()\n   \
    \     {\n            Console.WriteLine(\"Object is being created\");\n       \
    \ }\n        public void setLength( double len )\n        {\n            length\
    \ = len;\n        }\n        public double getLength()\n        {\n          \
    \  return length;\n        }\n        static void Main(string[] args)\n      \
    \  {\n            Line line = new Line();\n            // set line length\n  \
    \          line.setLength(6.0);\n            Console.WriteLine(\"Length of line\
    \ : {0}\", line.getLength());\n            Console.ReadKey();\n        }\n   \
    \ }\n}\n```\n\nOn executing, the code above, the following result is produced.\n\
    \nObject is being created\nLength of line : 6\n\n### Parameterized Constructors\n\
    \nBy default, a constructor will not have any parameters. Be that as it may, you\
    \ can add parameters to your constructor. These constructors are known as parameterized\
    \ constructors. With the help of this technique, you can assign an initial value\
    \ to a specific object during its creation. The following example will show you\
    \ how.\n\n```csharp\nusing System;\n\nnamespace LineApplication\n{\n    class\
    \ Line\n    {\n        private double length; // Length of a line\n        public\
