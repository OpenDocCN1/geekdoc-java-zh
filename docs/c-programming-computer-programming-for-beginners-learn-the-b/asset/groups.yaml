    \ job!”消息。\n\n在该程序中必须注意的另一个重要点是缺少用于定义条件代码块的 `{}` 字符。在 C# 中，如果一个块只包含一行代码，那么不需要\
    \ `{}` 字符。在编写自己的代码时请记住这一点。\n\n## switch 语句的基础\n\n在编程语言中，`switch` 语句类似于选择控制机制。它通常用于通过多路分支让变量的值修改程序执行的控制流。将\
    \ `switch` 语句想象成一组 `if` 语句。\n\n`switch` 语句将列出多种可能性，每种可能性都有自己的操作。如果没有其他任何可能性被返回为\
    \ `true`，还会执行一个默认（default）操作。就像 `if` 语句配有 `else` 语句一样，`switch` 语句也有形式 `case` 语句的伴侣。然而，与\
    \ `if else` 语句不同，多个 `case` 语句必须与单个 `switch` 语句一起使用。\n\n查看以下代码块以更好地理解 `switch`\
    \ 语句。下面的示例包含了 switch 语句最简单的实现之一。\n\n```csharp\nInt number = 1;\n\nswitch (number)\n\
    {\n    case 0:\n        Console.WriteLine(\"The number is zero!\");\n        break;\n\
    \    case 1:\n        Console.WriteLine(\"The number is one!\");\n        break;\n\
    }\n```\n\n如你所示，必须检查的标识符放置在 `switch` 关键字之后。随后是一系列 `case` 语句。这些语句将标识符与特定值进行比较。\n\
    \n你可能已经注意到每个 `case` 中都添加了 `break` 语句。这是由于编程语言的要求。在 C# 中，块在结束之前必须离开。如果正在编写一个函数，可以使用\
    \ `return` 语句代替 `break` 语句。\n\n给定的示例使用了整数。然而，`switch` 语句可以使用任何简单的数据类型。此外，可以为多个\
    \ `case` 语句指定相同的操作。\n\n## 理解 switch 语句的使用\n\n当然，理解 `switch case` 语句如何使用的最好方法是通过示例。下面的示例将说明如何将\
    \ `switch` 语句应用于 `case` 语句。它还强调了 `switch` 语句默认操作能力。\n\n```csharp\nConsole.WriteLine(\"\
    Is C# easy ? (yes/no/maybe)\");\n\nstring input = Console.ReadLine();\n\nswitch\
    \ (input.ToLower())\n{\n    case \"yes\":\n    case \"maybe\":\n        Console.WriteLine(\"\
    Awesome!\");\n        break;\n    case \"no\":\n    Console.WriteLine (\"Let's\
    \ try harder!\");\n        break;\ndefault:\n    Console.WriteLine (\"I'm sorry,\
    \ I don't understand that!\");\n    break;\n}\n```\n\n如应用程序所示，用户被问到一个问题，然后根据提供的选项提供答案。有三个选项：yes、no\
    \ 和 maybe。用户必须选择一个选项并输入。应用程序随后读取用户输入，该输入进入 `switch` 语句。\n\n`switch (input.ToLower()\
    \ )` 语句用于将输入转换为小写，以简化应用程序并对用户更友好。毕竟，用户将不再被要求以小写提供输入。\n\n`switch case` 语句的执行过程如下：如果输入是“yes”或“maybe”，用户将看到“Awesome!”消息。如果输入是“no”，将向用户显示“Let’s\
