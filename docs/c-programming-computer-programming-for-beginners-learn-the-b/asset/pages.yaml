    # Getting a Grip on Constants and Literals


    Constants are a reference to fixed values which cannot be changed in any way by
    the program while it is being executed. Another term for these fixed values is
    literals. It is possible to use any basic data type as a constant. Examples include
    character constants, floating constants, integer constants and string literals.
    Enumeration constants also exist.


    The fact is constants will be treated in the same manner as that of regular variables
    with a major difference. That is, the values'
