  \n现在已经在布局中添加了工具栏，我们就可以使用它了。我们创建一个接口，允许我们：\n\n*   更改标题\n*   指定是否显示返回导航操作\n*   滚动时动画工具栏\n\
  *   为所有 Activity 分配相同的菜单以及操作的事件\n\n所以让我们定义 `ToolbarManager`：\n\n```\n1 interface\
  \ ToolbarManager {\n2     val toolbar: Toolbar\n3     ...\n4 }\n```\n\nui/activities/ToolbarManager.kt\n\
  \n\n\n\n\n```kotlin\n1 var toolbarTitle: String\n2     get() = toolbar.title.toString()\n\
  3     set(value) {\n4         toolbar.title = value\n5     }\n```\n\n`ui/activities/ToolbarManager.kt`\n\
  \n由于该属性直接使用了 `toolbar`，因此不需要保存额外的状态。\n\n我们现在正在创建一个新函数，通过加载菜单并设置监听器来初始化工具栏：\n\n```kotlin\n\
  \ 1 fun initToolbar() {\n 2     toolbar.inflateMenu(R.menu.menu_main)\n 3     toolbar.setOnMenuItemClickListener\
  \ {\n 4         when (it.itemId) {\n 5             R.id.action_settings -> App.instance.toast(\"\
  Settings\")\n 6             else -> App.instance.toast(\"Unknown option\")\n 7 \
  \        }\n 8         true\n 9     }\n10 }\n```\n\n`ui/activities/ToolbarManager.kt`\n\
  \n我们还可以添加一个函数来启用工具栏中的导航图标，设置箭头图标以及在点击图标时触发的监听器：\n\n```kotlin\n1 fun enableHomeAsUp(up:\
  \ () -> Unit) {\n2     toolbar.navigationIcon = createUpDrawable()\n3     toolbar.setNavigationOnClickListener\
  \ { up() }\n4 }\n5 \n6 private fun createUpDrawable() = \n7      DrawerArrowDrawable(toolbar.ctx).apply\
  \ { progress = 1f }\n```\n\n`ui/activities/ToolbarManager.kt`\n\n该函数接收监听器，使用最终状态下的\
  \ [DrawerArrowDrawable](https://developer.android.com/reference/android/support/v7/graphics/drawable/DrawerArrowDrawable.html)（箭头已经显示时）创建向上\
  \ drawable，并将监听器分配给 `toolbar`。\n\n最后，接口提供了一个函数允许工具栏绑定到滚动视图，并根据滚动的方向对工具栏进行动画。当我们向下滚动时，工具栏会被隐藏，向上滚动时会再次显示：\n\
  \n```kotlin\n1 fun attachToScroll(recyclerView: RecyclerView) {\n2     recyclerView.addOnScrollListener(object\
  \ : RecyclerView.OnScrollListener() {\n3         override fun onScrolled(recyclerView:\
  \ RecyclerView?, dx: Int, dy: Int) {\n4             if (dy > 0) toolbar.slideExit()\
  \ else toolbar.slideEnter()\n5         }\n6     })\n7 }\n```\n\n`ui/activities/ToolbarManager.kt`\n\
  \n让我们创建几个扩展函数来让视图进入和移出屏幕动画。它们会检查是否之前执行过动画。这样可以防止视图在每次滚动变化时都执行动画：\n\n```kotlin\n\
  1 fun View.slideExit() {\n2     if (translationY == 0f) animate().translationY(-height.toFloat())\n\
  3 }\n4 \n5 fun View.slideEnter() {\n6     if (translationY < 0f) animate().translationY(0f)\n\
  7 }\n```\n\n`extensions/ViewExtensions.kt`\n\n实现工具栏管理器后，该是在 `MainActivity` 中使用它了，它现在必须实现该接口：\n\
  \n```kotlin\n1 class MainActivity : AppCompatActivity(), ToolbarManager {\n2   \
  \  ...\n3 }\n```\n\n`ui/activities/MainActivity.kt`\n\n我们首先指定 `toolbar` 属性。我们可以实现一个懒性查找（lazy\
  \ find），以便在使用它时 `toolbar` 已经加载完成：\n\n```kotlin\n1 override val toolbar by lazy {\
  \ find<Toolbar>(R.id.toolbar) }\n```\n\n`ui/activities/MainActivity.kt`\n\n`MainActivity`\
  \ 将初始化工具栏、绑定到 `RecyclerView` 滚动视图并修改工具栏标题：\n\n```kotlin\n 1 override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n 2     super.onCreate(savedInstanceState)\n 3     setContentView(R.layout.activity_main)\n\
  \ 4     initToolbar()\n 5 \n 6     forecastList.layoutManager = LinearLayoutManager(this)\n\
  \ 7     attachToScroll(forecastList)\n 8 \n 9     doAsync {\n10         val result\
  \ = RequestForecastCommand(94043).execute()\n11         uiThread {\n12         \
  \    val adapter = ForecastListAdapter(result) {\n13                 startActivity<DetailActivity>(DetailActivity.ID\
  \ to it.id,\n14                         DetailActivity.CITY_NAME to result.city)\n\
  15             }\n16             forecastList.adapter = adapter\n17            \
  \ toolbarTitle = \"${result.city} (${result.country})\"\n18         }\n19     }\n\
  20 }\n```\n\n`ui/activities/MainActivity.kt`\n\n`DetailActivity` 也需要一些布局修改：\n\n\
  ```xml\n 1 <LinearLayout\n 2     xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n 3     xmlns:tools=\"http://schemas.android.com/tools\"\n 4     android:layout_width=\"\
  match_parent\"\n 5     android:layout_height=\"match_parent\"\n 6     android:orientation=\"\
  vertical\">\n 7 \n 8     <include layout=\"@layout/toolbar\"/>\n 9 \n10     <LinearLayout\n\
  \ 11         android:layout_width=\"match_parent\"\n 12         android:layout_height=\"\
  wrap_content\"\n 13         android:orientation=\"horizontal\"\n 14         android:gravity=\"\
  center_vertical\"\n 15         android:paddingTop=\"@dimen/activity_vertical_margin\"\
  \n 16         android:paddingLeft=\"@dimen/activity_horizontal_margin\"\n 17   \
  \      android:paddingRight=\"@dimen/activity_horizontal_margin\"\n 18         tools:ignore=\"\
  UseCompoundLayout\">\n19 \n20     </LinearLayout>\n21 </LinearLayout>\n```\n\n`ui/activities/MainActivity.kt`\n\
  \n`DetailActivity` 也需要一些布局修改：\n\n\n\n\n现在每个扩展了 `Context` 的类都可以作为我们类的类型。其他类型是不被允许的。\n\
  \n当然，函数中也允许使用类型。我们可以很容易地构建泛型函数：\n\n```\n1 fun <T> typedFunction(item: T): List<T>\
  \ {\n2     ...\n3 }\n```\n\n### 25.2 变变 (Variance)\n\n这真的是最难理解的部分之一。在 Java 中，使用泛型类型时存在一个问题。逻辑上说，`List<String>`\
  \ 应该能够强制转换为 `List<Object>`，因为它的限制更少。但看这个例子：\n\n```\n1 List<String> strList = new\
  \ ArrayList<>();\n2 List<Object> objList = strList;\n3 objList.add(5);\n4 String\
  \ str = objList.get(0);\n```\n\n如果 Java 编译器允许我们这样做，我们就可以向 `Object` 列表添加一个 `Integer`，这会在某个时刻导致程序崩溃。这就是为什么语言中引入了通配符（wildcards）。通配符在限制这一问题的同时增加了灵活性。\n\
  \n如果我们添加 `? extends Object`，我们就是在使用**协变 (covariance)**，这意味着我们可以处理任何使用比 `Object`\
  \ 限制更大的类型的对象，但我们只能安全地执行 `get` 操作。如果我们想将一个 `String` 集合拷贝到 `Object` 集合中，应该是允许的，对吧？\n\
  \n那么，如果我们有：\n\n```\n1 List<String> strList = ...;\n2 List<Object> objList = ...;\n\
  3 objList.addAll(strList);\n```\n\n这是可能的，因为 `Collection` 接口中 `addAll()` 的定义类似于：\n\
  \n```\n1 List<String> \n2 interface Collection<E> ... {\n3   void addAll(Collection<?\
  \ extends E> items);\n4 }\n```\n\n否则，如果没有通配符，我们将不允许使用此方法配合 `String` 列表。相反的情况自然会失败。我们不能使用\
  \ `addAll()` 将一个 `Object` 列表添加到 `String` 列表中。由于我们只是从在该方法中使用的集合中获取项，因此它是协变的完美范例。\n\
  \n另一方面，我们可以找到**逆变 (contravariance)**，它只是完全相反的情况。接上 `Collection` 的例子，如果我们想向作为参数传递的\
  \ `Collection` 中添加项，我们可以将具有更严格类型的对象添加到更通用的集合中。例如，我们可以将 `String` 添加到 `Object` 列表中：\n\
  \n```\n1 void copyStrings(Collection<? super String> to, Collection<String> from)\
  \ {\n2     to.addAll(from);\n3 }\n```\n\n我们向 `String` 添加到另一个集合的唯一限制是：该集合接受 `String`\
  \ 或其父类的 `Object` 类型。\n\n但通配符有一些局限性。通配符定义了**使用处变性 (use-site variance)**，这意味着我们需要在使用它们的地方声明它们。这意味着每当我们声明一个更通用的变量时都要添加样板代码。\n\
  \n让我们来看一个例子。使用与之前类似的的一个类：\n\n```\n1 public class TypedClass<T> {\n2     public T\
  \ doSomething(){\n3         ...\n4     }\n5 }\n```\n\n这段代码将无法编译：\n\n```\n1 TypedClass<String>\
  \ t1 = new TypedClass<>();\n2 TypedClass<Object> t2 = t1;\n```\n\n尽管这实际上没有意义，因为我们仍然可以调用该类的所有方法，且什么都不会破坏。我们需要指定该类型可以有一个更灵活的定义。\n\
  \n```\n1 TypedClass<String> t1 = new TypedClass<>();\n2 TypedClass<? extends String>\
  \ t2 = t1;\n```\n\n在这种情况下，通配符的使用使得事情更难理解，并增加了一些额外的样板代码。\n\n另一方面，Kotlin 通过使用**声明处变性\
  \ (declaration-site variance)** 更自然地处理这个问题。在 Kotlin 中，我们在定义类或接口时指定我们可以处理限制较少的情况，然后就可以到处随随地使用它。\n\
  \n所以让我们看看它是什么样的。Kotlin 没有使用长通配符，而是使用 `out` 表示协变，使用 `in` 表示逆变。在这种情况下，由于我们的类产生的对象保存到限制较少的变量中，我们正在使用协变。我们可以直接在类声明中定义它：\n\
  \n```\n1 class TypedClass<out T>() {\n2     fun doSomething(): T {\n3         ...\n\
  4     }\n5 }\n```\n\n这就是我们需要的全部。现在，Java 中无法编译的相同示例在 Kotlin 中是完全可能的：\n\n```\n1 val\
  \ t1 = TypedClass<String>()\n2 val t2: TypedClass<Any> = t1\n```\n\n如果你已经熟悉这些概念，我确定你可以在\
  \ Kotlin 中毫无费力地使用 `in` 和 `out`。否则，这需要一些练习和对这些概念的良好理解。\n\n### 25.3 泛型示例\n\n在理论之后，让我们转向一些会让我们的生活更简单的实用函数。与其重复发明轮子，我使用了包含在\
  \ Kotlin 标准库中的三个函数。这些函数让我们仅通过一个泛型实现就能完成惊不起的事情。它们可能会启发你创建自己的函数。\n\n#### let\n\n`let`\
  \ 是一个可以被任何对象调用的简单函数。它接收一个以对象作为参数的函数，并返回该函数的值。它对于处理可空对象非常方便。这里是它的定义：\n\n```\ninline\
  \ inline <T, R> T.let(f: (T) -> R): R = f(this)\n```\n\n它使用了两个泛型类型：`T` 和 `R`。第一个类型是调用对象，第二个是结果。我们如何使用它呢？你可能记得，当我们从源获取数据时，结果可能是\
  \ null：\n\n```\n1 if (forecast != null) dataMapper.convertDayDomain(forecast) else\
  \ null\n```\n\n这可以被改进。我们不应该那那样处理可空类型。我们可以通过使用 `let` 来避免它：\n\n```\n1 forecast?.let\
  \ { dataMapper.convertDayDomain(it) }\n```\n\n#### with\n\n我们在书中多次提到这个函数。`with`\
  \ 接收一个对象和一个行为得像扩展函数的 lambda 表达式。\n\n```\ninline inline <T, R> with(receiver: T,\
  \ f: T.() -> R): R\n```\n\n泛型在这里的工作原理相同：`T` 代表接收者类型，`R` 代表结果。如你所见，lambda 被定义为扩展函数：`f:\
  \ T.() -> R`。这就是为什么我们随后可以调用 `receiver.f()`。\n\n我们在整个应用程序中有几个例子：\n\n```\n1 fun convertFromDomain(forecast:\
  \ ForecastList) = with(forecast) {\n    val daily = dailyForecast.map { convertDayDomain(id,\
  \ it) }\n    CityForecast(id, city, country, daily)\n}\n```\n\n#### apply\n\n它看起来与\
  \ `with` 函数非常相似，但想法有所不同。`apply` 可用于避免创建构建器，因为调用函数的对象可以按照它需要的方式进行初始化，而 `apply` 函数返回同一个对象：\n\
  \n```\ninline inline <T> T.apply(f: T.() -> Unit): T { f(); return this }\n```\n\
  \n我们在这里只需要一个泛型类型，因为调用函数的对象也是被返回的值。一个很简单的例子将是：\n\n```\n1 val textView = TextView(context).apply\
  \ {\n    text = \"Hello\"\n    hint = \"Hint\"\n    textColor = android.R.color.white\n\
  }\n```\n\n它创建了一个 `TextView`，修改了一些属性，并将其赋值给变量。一切都在简单、易读且紧凑的语法中。让我们在当前代码中使用它。在 `ToolbarManager`\
  \ 中，我们之前是这样创建导航绘制内容的：\n\n```\n1 private fun createUpDrawable() = with(DrawerArrowDrawable(toolbar.ctx))\
  \ {\n    progress = 1f\n    this\n}\n```\n\n使用 `with` 并返回 `this` 显然是可以通过 `apply`\
  \ 更容易地完成的：\n\n\n\n\n\n```kotlin\n1 private fun createUpDrawable() = DrawerArrowDrawable(toolbar.ctx).apply\
  \ { \n2     progress = 1f \n3 }\n```\n\n`ui/activities/ToolbarManager.kt`\n\n你可以在\
  \ [Android 开发者 Kotlin 仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-25)\
  \ 中查看更多针对 Kotlin 的细微改进。\n\n## 26 设置界面\n\n到为止，我们一直使用默认城市来实现应用，但现在是时候添加选择另一个城市的功能了。应用需要一个设置部分，用户可以在那里更改城市。\n\
  \n我们将继续使用邮政编码来识别城市。一个真实的应用可能需要更多信息，因为单凭邮政编码无法识别全球范围内的城市。但我们至少显示一个使用我们在设置中定义的邮政编码的城市。这是一个解释处理偏好不同方法的好机会。\n\
  \n### 26.1 创建设置 Activity\n\n当在工具栏的溢出菜单中选择设置时，将打开一个新的 Activity。因此，我们首先需要一个新的 `SettingsActivity`：\n\
  \n```kotlin\n 1 class SettingsActivity : AppCompatActivity() {\n 2 \n 3     override\
  \ fun onCreate(savedInstanceState: Bundle?) {\n 4         super.onCreate(savedInstanceState)\n\
  \ 5         setContentView(R.layout.activity_settings)\n 6         setSupportActionBar(toolbar)\n\
  \ 7         supportActionBar?.setDisplayHomeAsUpEnabled(true)\n 8     }\n 9 \n10\
  \     override fun onOptionsItemSelected(item: MenuItem) = when (item.itemId) {\n\
  \ 11         android.R.id.home -> { \n 12             onBackPressed() \n 13    \
  \         true \n 14         }\n 15         else -> false\n 16     }\n 17 }\n```\n\
  \n`ui/activities/SettingsActivity.kt`\n\n当用户退出屏幕 Activity 时我们将保存偏好，因此我们将相同的方式处理\
  \ `Up` 操作，将操作重定向到 `onBackPressed`。现在，让我们创建 XML 布局。一个简单的 `EditText` 就足够处理该偏好了：\n\n\
  ```xml\n 1 <FrameLayout\n 2     xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n 3     android:layout_width=\"match_parent\"\n 4     android:layout_height=\"\
  match_parent\">\n 5 \n 6     <include layout=\"@layout/toolbar\"/>\n 7 \n 8    \
  \ <LinearLayout\n 9         android:orientation=\"vertical\"\n10         android:layout_width=\"\
  match_parent\"\n 11         android:layout_height=\"match_parent\"\n 12        \
  \ android:layout_marginTop=\"?attr/actionBarSize\"\n 13         android:padding=\"\
  @dimen/spacing_xlarge\">\n 14 \n 15         <TextView\n 16             android:layout_width=\"\
  wrap_content\"\n 17             android:layout_height=\"wrap_content\"\n 18    \
  \         android:text=\"@string/city_zipcode\"/>\n 19 \n 20         <EditText\n\
  \ 21             android:id=\"@+id/cityCode\"\n 23             android:layout_width=\"\
  match_parent\"\n 23             android:layout_height=\"wrap_content\"\n 24    \
  \         android:hint=\"@string/city_zipcode\"\n 25             android:inputType=\"\
  number\"/>\n 26 \n 27     </LinearLayout>\n 28 \n 29 </FrameLayout>\n```\n\n`layout/activity_settings.xml`\n\
  \n然后在 `AndroidManifest.xml` 中声明该 Activity：\n\n```xml\n1 <activity\n2     android:name=\"\
  .ui.activities.SettingsActivity\"\n3     android:label=\"@string/settings\"/>\n\
  ```\n\n`AndroidManifest.xml`\n\n### 26.2 访问共享偏好\n\n你可能知道 Android [Shared Preferences](https://developer.android.com/training/basics/data-storage/shared-preferences.html)\
  \ 是什么。它们由一组键值对组成，可以使用 Android 框架轻松地保存和恢复。这些偏好与 SDK 的某些部分集成，使某些任务更容易。此外，从 Android\
  \ 6.0 (Marshmallow) 开始，共享偏好会自动保存到云端，因此当用户在新设备上恢复应用时，这些偏好也会自动恢复。\n\n得益于属性委托（property\
  \ delegation），我们可以巧妙地处理偏好。我们可以创建一个委托器，在调用 `get` 时查询偏好，并在调用 `set` 时保存它。\n\n由于我们要保存的是\
  \ `Long` 类型的邮政编码，让我们为 `Long` 属性创建一个委托器。在 `DelegatesExtensions.kt` 中，实现一个新的 `LongPreference`\
  \ 类：\n\n```kotlin\n 1 class LongPreference(\n 2         private val context: Context,\
  \ \n 3         private val name: String, val default: Long) {\n 4 \n 5     private\
  \ val prefs by lazy {\n 6         context.getSharedPreferences(\"default\", Context.MODE_PRIVATE)\n\
  \ 7     }\n 8 \n 9     operator fun getValue(thisRef: Any?, property: KProperty<*>):\
  \ Long =\n10         prefs.getLong(name, default)\n 11 \n12     operator fun setValue(thisRef:\
  \ Any?, property: KProperty<*>, value: Long) {\n 13         prefs.edit().putLong(name,\
  \ value).apply()\n 14     }\n 15 }\n```\n\n`extensions/DelegatesExtensions.kt`\n\
  \n首先，我们创建一个懒加载访问。然后在 `DelegatesExt` 对象中定义委托，以便在需要时更容易访问：\n\n```kotlin\n1 object\
  \ DelegatesExt {\n2     ....\n3     fun longPreference(context: Context, name: String,\
  \ default: Long) =\n4         LongPreference(context, name, default)\n5 }\n```\n\
  \n`DelegatesExtensions.kt`\n\n在 `SettingsActivity` 中，我们现在可以定义属性来处理偏好。我还创建了用于属性名称和默认值的常量，这样它们可以在应用的其他部分使用。\n\
  \n```kotlin\n1 companion object {\n2     const val ZIP_CODE = \"zipCode\"\n3   \
  \  const val DEFAULT_ZIP = 94043L\n4 }\n5 \n6 private var zipCode: Long \n7    \
  \     by DelegatesExt.longPreference(this, ZIP_CODE, DEFAULT_ZIP)\n```\n\n`ui/activities/SettingsActivity.kt`\n\
  \n现在很容易处理这个偏好。在 `onCreate` 中，我们获取属性的值并赋值给 `EditText`：\n\n```kotlin\n1 override fun\
  \ onCreate(savedInstanceState: Bundle?) {\n2     ...\n3     cityCode.setText(zipCode.toString())\n\
  4 }\n```\n\n`ui/activities/SettingsActivity.kt`\n\n我们不能使用生成的属性 `text`，因为 `EditText`\
  \ 在 `getText()` 中返回 `Editable`，所以属性默认是该值。如果我们尝试赋值一个 `String`，编译器会报错。使用 `setText()`\
  \ 就足够了。\n\n现在我们有了实现 `onBackPressed` 需要的所有内容。在这里，保存属性的新值：\n\n```kotlin\n1 override\
  \ fun onBackPressed() {\n2     super.onBackPressed()\n3     zipCode = cityCode.text.toString().toLong()\n\
  4 }\n```\n\n`ui/activities/SettingsActivity.kt`\n\n`MainActivity` 需要一些小更改。首先，它也需要一个\
  \ `zipCode` 属性。\n\n```kotlin\n1 private val zipCode: Long by DelegatesExt.longPreference(this,\
  \ \n         SettingsActivity.ZIP_CODE, SettingsActivity.DEFAULT_ZIP)\n```\n\n`ui/activities/MainActivity.kt`\n\
  \n此外，我将加载预报移动到 `onResume`，这样每次恢复 Activity 时都会刷新数据，以防邮政编码已更改。当然，有更高效的方法，例如在再次请求预报之前检查邮政编码是否变化。但我想保持示例简单，而且本地数据库已经保存了请求的信息，所以这个解决方案并不糟糕：\n\
  \n\n\n\n\n```\n 1 override fun onResume() {\n 2     super.onResume()\n 3     loadForecast()\n\
  \ 4 }\n 5 \n 6 private fun loadForecast() = doAsync {\n 7     val result = RequestForecastCommand(zipCode).execute()\n\
  \ 8     uiThread {\n 9         val adapter = ForecastListAdapter(result) {\n10 \
  \            startActivity<DetailActivity>(DetailActivity.ID to it.id,\n11     \
  \                DetailActivity.CITY_NAME to result.city)\n12         }\n13    \
  \     forecastList.adapter = adapter\n14         toolbarTitle = \"${result.city}\
  \ (${result.country})\"\n15     }\n16 }\n```\n\n`ui/activities/MainActivity.kt`\n\
  \n`RequestForecastCommand` 现在使用的是 `zipCode` 属性而不是之前的固定值。\n\n我们还需要做最后一件事：当用户点击溢出操作时，启动设置活动。在\
  \ `ToolbarManager` 中，`initToolbar` 函数需要一个小小的改：\n\n```kotlin\n1 when (it.itemId)\
  \ {\n2     R.id.action_settings -> toolbar.ctx.startActivity<SettingsActivity>()\n\
  3     else -> App.instance.toast(\"Unknown option\")\n4 }\n```\n\n`ui/activities/ToolbarManager.kt`\n\
  \n### 26.3 通用偏好代理\n\n既然我们已经是泛型专家了，为什么不扩展 `LongPreference` 使其适用于任何 Shared Preferences\
  \ 支持的类型呢？让我们创建一个新的 `Preference` 代理：\n\n```kotlin\n 1 class Preference<T>(private\
  \ val context: Context, private val name: String, \n 2     private val default:\
  \ T) {\n 3 \n 4     private val prefs by lazy { \n 5         context.getSharedPreferences(\"\
  default\", Context.MODE_PRIVATE) \n 6     }\n 7 \n 8     operator fun getValue(thisRef:\
  \ Any?, property: KProperty<*>): T =\n 9         findPreference(name, default)\n\
  10 \n11     operator fun setValue(thisRef: Any?, property: KProperty<*>, value:\
  \ T) {\n12         putPreference(name, value)\n13     }\n14     ...\n15   }\n```\n\
  \n`extensions/DelegatesExtensions.kt`\n\n这个偏好与我们之前的非常相似。我们只是将 `Long` 替换为泛型类型 `T`，并调用了几个执行繁琐工作的函数。这些函数非常简单，尽管有些重复。它们检查类型并使用偏好设置中的特定方法。例如，`findPreference`\
  \ 函数如下：\n\n```kotlin\n 1 private fun findPreference(name: String, default: T): T\
  \ = with(prefs) {\n 2     val res: Any = when (default) {\n 3         is Long ->\
  \ getLong(name, default)\n 4         is String -> getString(name, default)\n 5 \
  \        is Int -> getInt(name, default)\n 6         is Boolean -> getBoolean(name,\
  \ default)\n 7         is Float -> getFloat(name, default)\n 8         else -> throw\
  \ IllegalArgumentException(\n 9             \"This type can't be saved into Preferences\"\
  )\n10     }\n 11 \n12     res as T\n13 }\n```\n\n`extensions/DelegatesExtensions.kt`\n\
  \n`putPreference` 函数也相同，但使用了偏好编辑器并在最后通过调用 `apply()` 来保存 `when` 的结果：\n\n```kotlin\n\
  \ 1 private fun putPreference(name: String, value: T) = with(prefs.edit()) {\n 2\
  \     when (value) {\n 3         is Long -> putLong(name, value)\n 4         is\
  \ String -> putString(name, value)\n 5         is Int -> putInt(name, value)\n 6\
  \         is Boolean -> putBoolean(name, value)\n 7         is Float -> putFloat(name,\
  \ value)\n 8         else -> throw IllegalArgumentException(\"This type can be saved\
  \ into Preferenc\\\n 9 es\")\n10     }.apply()\n11 }\n```\n\n`extensions/DelegatesExtensions.kt`\n\
  \n现在更新 `DelegatesExt` 对象你就完成了：\n\n```kotlin\n1 object DelegatesExt {\n2     ...\n\
  3      fun <T> preference(context: Context, name: String, default: T) \n4      \
  \    = Preference(context, name, default)\n5 }\n```\n\n`extensions/DelegatesExtensions.kt`\n\
  \n在本章节之后，用户现在可以访问设置屏幕并修改邮编。这样，当他们返回主屏幕时，预报将用新信息自动刷新。检查[仓库中剩余的细微调整](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-26)。\n\
  \n## 27 初次接触协程\n\n协程是 Kotlin 1.1 中引入的最重要特性。它们之所以很棒，是因为它们非常强大，而且社区仍在探索如何充分利用它们的特性。\n\
  \n简单来说，协程是一种以顺序方式编写异步代码的方法。与其在回调函数中挣扎，你可以一个接一个地编写代码。其中某些代码可以挂起执行并等待结果可用。\n\n如果你曾是\
  \ C# 开发者，`async/await` 是最接近的概念。然而，Kotlin 中的协程更强大，因为它们不是某个想法的具体实现，而是一项语言特性，开发者可以用不同的方式实现它解决特定问题。\n\
  \n你可以编写自己的解决方案，或者使用 Kotlin 团队和其他独立开发者构建的多个选项之一。\n\n你需要理解，协程是 Kotlin 1.1 中的一个实验性特性。Kotlin\
  \ 团队将此类别用于他们想要尽早发布但在未来可能会更改的功能。在协程的情况下，他们计划支持当前的 API，但你可能希望迁移到新定义。正如我们稍后看到的，你需要手动开启此功能。否则，当你使用它时，IDE\
  \ 会显示警告。\n\n但也意味着，你应该将本章作为你可以所做事情的示例，而不是准则。事情在未来几个月内可能会变化。\n\n### 27.1 理解协程的工作原理\n\
  \n我在这里的目标是让你掌握一些基本概念并使用现有的库之一，而不是构建你自己的实现。但我认为了解内部原理是很重要的，这样你才不会盲目地使用提供的内容。\n\n\
  协程基于“挂起函数”（`suspending functions`）的概念：这种函数在被调用时可以停止执行，并在完成后台任务后继续运行。\n\n挂起函数用保留关键字\
  \ `suspend` 标记，并且只能在其他挂起函数或协程内部调用。\n\n因此，你不能在任何地方调用挂起函数。需要一个周围函数来构建协程并提供所需的上下文。类似于这样：\n\
  \n```kotlin\n1 fun <T> async(block: suspend () -> T)\n```\n\n我不会解释如何实现上面的函数。这是一个复杂的过程，超出了本书的范围，而且对于大多数情况，已经有为你实现的解决方案了。如果你对构建自己的感兴趣，可以阅读[coroutines\
  \ Github](https://github.com/Kotlin/kotlin-coroutines/blob/master/kotlin-coroutines-informal.md)\
  \ 中编写的规范。你需要知道的是，函数可以有任何你想给它的的名字，并且它至少有一个挂起块作为参数。\n\n然后你可以实现一个挂起函数并在该块内部调用它：\n\n\
  ```kotlin\n1 suspend fun mySuspendingFun(x: Int) : Result {\n2     ...\n3 }\n4 \n\
  5 async { \n6     val res = mySuspendingFun(20)\n7     print(res)\n8 }\n```\n\n\
  那么协程是线程吗？不完全是。它们的工作原理相似，但要轻量高效得多。你可以在几个线程上运行数百万个协程，这开启了无限可能。\n\n你有三种方法可以使用协程特性：\n\
  \n- 原始实现：这意味着构建你自己的使用协程的方法。这非常复杂，通常完全不需要。\n- 低级实现：Kotlin 提供了一组可以在 [kotlinx.coroutines](https://github.com/Kotlin/kotlinx-coroutines)\
  \ 仓库中找到的库，它解决了一些最困难的部分，并为不同的场景提供了特定的实现。例如，[针对 Android 的](https://github.com/Kotlin/kotlinx-coroutines/tree/master/ui/kotlinx-coroutines-android)。\n\
  \n\n\n\n\n-   更高级的实现：如果你希望有一个能够提供你立即开始使用协程所需的所有内容的解决方案，那里有几个库可以为你完成所有繁琐的工作，而且这个列表还在不断增长。我将坚持使用\
  \ Anko，它提供了一个在 Android 上运行良好的解决方案，而且你已经对这个库非常熟悉了。\n\n### 27.2 使用 Anko 协程\n\n从 0.10\
  \ 版本开始，`Anko` 提供了几种在 Android 中使用协程的方法。\n\n第一种与我们在上面的示例中看到的非常相似，也与其他库的做法相似。\n\n首先，你需要创建一个\
  \ `async` 块，让挂起函数（suspension functions）可以在可以在其中运行：\n\n```\n1 async(UI) {\n2    \
  \ ...\n3 }\n```\n\n`UI` 参数是 `async` 块的执行上下文。\n\n然后，你可以创建在后台线程中执行并将结果返回给 UI 线程的块。这些块是使用\
  \ `bg` 函数定义的：\n\n```\n1 async(UI) {\n2     val r1: Deferred<Result> = bg { fetchResult1()\
  \ }\n3     val r2: Deferred<Result> = bg { fetchResult2() }\n4     updateUI(r1.await(),\
  \ r2.await())\n5 }\n```\n\n`bg` 返回一个 `Deferred` 对象，当调用函数 `await()` 时，它会挂起协程，直到返回结果。我们将在下面的示例中看到这个选项。\n\
  \n如你所知，由于 Kotlin 编译器可以推断变量的类型，这可以更简单：\n\n```\n1 async(UI) {\n2     val r1 = bg {\
  \ fetchResult1() }\n3     val r2 = bg { fetchResult2() }\n4     updateUI(r1.await(),\
  \ r2.await())\n5 }\n```\n\n第二种替代方案是利用特定子库提供的与监听器的集成，取决于你打算使用哪种监听器。例如，在 `anko-sdk15-coroutines`\
  \ 上，存在一个 `onClick` 监听器，其 lambda 确实是一个协程。因此你可以立即在监听器块内开始使用挂起函数：\n\n```\n1 textView.onClick\
  \ {\n2     val r1 = bg { fetchResult1() }\n3     val r2 = bg { fetchResult2() }\n\
  4     updateUI(r1.await(), r2.await())\n5 }\n```\n\n如你所见，结果与之前的非常相似。你只是节省了一些代码。\n\
  \n要使用它，你需要根据想要使用的监听器添加其中一些依赖项：\n\n```\n1 compile \"org.jetbrains.anko:anko-sdk15-coroutines:$anko_version\"\
  \n2 compile \"org.jetbrains.anko:anko-appcompat-v7-coroutines:$anko_version\"\n\
  3 compile \"org.jetbrains.anko:anko-design-coroutines:$anko_version\"\n```\n\n###\
  \ 27.3 在我们的示例中使用协程\n\n我们目前的示例没有多少复杂的请求，在这种情况下，使用协程代替 `doAsync` 的价值并不大，但我想向你展示如何配置你的项目以开始使用它们。这非常直观。\n\
  \n首先，在 `build.gradle` 中添加依赖：\n\n```\n1 compile \"org.jetbrains.anko:anko-coroutines:$anko_version\"\
  \n```\napp/build.gradle\n\n接下来，如果你还记得，我告诉过你你需要开启该功能。否则，它会显示警告。要做到这一点，只需在模块的 `build.gradle`\
  \ 中添加：\n\n```\n1 kotlin {\n2     experimental {\n3         coroutines \"enable\"\
  \n4     }\n5 }\n```\napp/build.gradle\n\n现在你准备好开始使用协程了。让我们先去详情页。\n\n你可以更改这段代码：\n\
  \n```\n1 doAsync {\n2     val result = RequestResultCommand(intent.getLongExtra(ID,\
  \ -1)).execute()\n3     uiThread { bindForecast(result) }\n4 }\n```\n\n改为：\n\n```\n\
  1 async(UI) {\n2     val result = bg { RequestResultCommand(intent.getLongExtra(ID,\
  \ -1)).execute() }\n3     bindForecast(result.await())\n4 }\n```\nDetailActivity\n\
  \n请求在后台请求得益于 `bg` 函数，它返回一个 `Deferred` 对象。结果在 `bindForecast` 调用时被等待，直到它就绪。\n\n这里有一个问题：协程会在\
  \ Activity 被销毁时挂起。别担心，因为 Anko 有解决方案。你可以对 Activity 创建弱引用并使用它：\n\n```\n1 val ref =\
  \ asReference()\n2 val id = intent.getLongExtra(ID, -1)\n3\n4 async(UI) {\n5   \
  \  val result = bg { RequestResultCommand(id).execute() }\n6     ref().bindForecast(result.await())\n\
  7 }\n```\n\n但如果协程多次与 Activity 交互，这可能会变得复杂。在 `MainActivity` 中，例如，这种解决方案变得更加复杂：\n\n\
  ```\n1 private fun loadForecast() {\n2 \n     val ref = asReference()\n4     val\
  \ id = intent.getLongExtra(ID, -1)\n5 \n6     async(UI) {\n7         val result\
  \ = bg { RequestResultCommand(id).execute() }\n8         ref().bindForecast(result.await())\n\
  9     }\n10 }\n```\nMainActivity.kt \n\n## 28 测试你的 App\n\n旅程即将结束。你通过这本书学习了大部分 Kotlin\
  \ 特性，但你可能好奇是否可以使用 Kotlin 测试你的 Android 应用。答案是：当然！\n\n在 Android 中，我们有两种不同的测试：单元测试和仪表测试（instrumentation\
  \ tests）。本书并不是教你如何编写测试；那里有专门的书籍。我本章的目标是解释如何准备你的环境以编写一些测试，并向你展示 Kotlin 运行得良好。\n\n\
  ### 28.1 单元测试\n\n我不会陷入关于单元测试含义的讨论。那里有很多定义，略有不同。一个通的想法可以是单元测试是验证单个代码单元的测试。至于“单元”包含什么留给读者。为了简单起见，我将单元测试定义为不需要设备运行的测试。IDE\
  \ 可以运行测试并显示哪些测试成功了，哪些失败了。\n\n单元测试通常使用 `JUnit` 库完成。所以让我们在 `build.gradle` 中添加依赖。由于此依赖项仅在运行测试时使用，我们可以使用\
  \ `testImplementation` 代替 `implementation`。这样该库就不会包含在常规编译中，从而减小 APK 的 own：\n\n```\n\
  1 dependencies {\n2     ...\n3     testImplementation \"junit:junit:4.12\"\n4 }\n\
  ```\napp/build.gradle\n\n\n\n\n现在同步 Gradle 以将库包含在你的项目中。在旧版本的 Android Studio 中，你可能需要选择想要运行的哪种测试。进入“Build\
  \ Variants”（构建变体）标签（它可能在 IDE 的左侧），并点击“Test Artifact”下拉菜单。你应该在那里选择“Unit Tests”（单元测试）。新版本的\
  \ Android Studio 可以同时启用这两种测试，因此此步不是必须的。\n\n你需要做的另一件事是创建一个新文件夹。在 `src` 下，你可能已经有了\
  \ `androidTest` 和 `main`。再创建一个名为 `test` 的文件夹，并在下方创建一个 `java` 文件夹。现在，你应该有一个呈绿色的 `src/test/java`\
  \ 文件夹。这是一个很好的迹象，表明 IDE 已检测到我们正处于“单元测试”模式，并且该文件夹包含测试文件。\n\n让我们写一个简单的测试来检查一切是否运行正常。使用正确的包名创建一个名为\
  \ `SimpleTest` 的 Kotlin 类（在我的案例中是 `com.antonioleiva.weatherapp`，但你需要使用你应用的主包）。一旦创建了新文件，编写这个简单的测试：\n\
  \n```\n1 import org.junit.Test\n2 import kotlin.test.assertTrue\n3 \n4 class SimpleTest\
  \ {\n5     @Test\n6     fun `unit testing works`() {\n7         assertTrue(true)\n\
  8     }\n9 }\n```\n\n`test/SimpleTest.kt`\n\n使用 `@Test` 注解将该函数标识为测试。请确保使用 `org.junit.Test`。然后添加一个简单的断言。它只检查\
  \ `true` 是否为 `true`，这应该会成功。\n\n你看到我是如何写函数名的了吗？如果你使用反引号（backquotes），可以为测试提供一个可读的名称。当测试在\
  \ Android Studio 中运行时，摘要中显示的文本会易读得多。\n\n你会发现这些名称显示错误。这是因为这种格式不适用于 Android 代码，因此也不适用于仪表测试（instrumentation\
  \ tests）。但你可以在单元测试中毫无可以使用它们，所以你可以针对测试禁用检查并安全地使用。\n\n要执行测试，右键点击你在 `test` 下创建的新的 `java`\
  \ 文件夹，并选择“Run All Tests”（运行所有测试）。编译完成后，它将运行测试，你会看到显示结果的摘要。你应该注意到你的测试通过了。\n\n现在是时候创建一些真实的测试了。所有涉及\
  \ Android 框架的内容可能都需要仪表测试（instrumentation test）或一些额外的库，如 [Robolectric](http://robolectric.org/)。正如此，在这些示例中，我测试的是不使用框架任何内容的内容。例如，我将测试从\
  \ `Long` 创建日期 `String` 的扩展函数。\n\n创建一个名为 `ExtensionTests` 的新文件，并添加这些测试：\n\n```\n\
  \ 1 class ExtensionsTest {\n 2     @Test\n 3     fun `\"longToDateString\" returns\
  \ valid value`() {\n 4         assertEquals(\"Oct 19, 2015\", 1445275635000L.toDateString())\n\
  \ 5     }\n 6 \n 7     @Test\n 8     fun `\"longToDateString\" with full format\
  \ returns valid value`() {\n 9         assertEquals(\"Monday, October 19, 2015\"\
  , \n10             1445275635000L.toDateString(DateFormat.FULL))\n11     }\n12 }\n\
  ```\n\n`test/ExtensionsTest.kt`\n\n这些测试检查 `Long` 实例是否被正确转换为 `String`。第一个测试了默认行为（使用\
  \ `DateFormat.MEDIUM`），而第二个指定了不同的格式。运行测试并看它们是否全部通过。我还建议你修改一些内容看看它是如何崩溃的。\n\n如果你习惯于在\
  \ Java 中测试应用，你会发现这里没有太大区别。我涵盖了一个简单的示例，但从这里你可以创建更复杂的测试来验证应用的其他部分。例如，我们可以为 `ForecastProvider`\
  \ 写一些测试。我们可以使用 `Mockito` 库来模拟（mock）其他类，并能够独立地测试 provider：\n\n```\n1 buildscript\
  \ {\n2     ...\n3     ext.mockito_version = '2.16.0'\n4 }\n```\n\n`build.gradle`\n\
  \n```\n1 dependencies {\n2     ...\n3     testImplementation \"junit:junit:4.12\"\
  \n4     testImplementation \"org.mockito:mockito-core:$mockito_version\"\n5 }\n\
  ```\n\n`app/build.gradle`\n\n现在创建一个 `ForecastProviderTest`。我们将测试一个带有返回内容的 `DataSource`\
  \ 的 `ForecastProvider` 是否会获得一个非空结果。所以首先，我们需要模拟一个 `ForecastDataSource`：\n\n```\n\
  1 val ds = mock(ForecastDataSource::class.java)\n2 `when`(ds.requestDayForecast(0)).then\
  \ {\n3     Forecast(0, 0, \"desc\", 20, 0, \"url\")\n4 }\n```\n\n`test/domain/datasource/ForecastProviderTest.kt`\n\
  \n如你所见，`when` 函数需要使用反引号，因为 `when` 是 Kotlin 中的保留字。所以如果我们发现某些使用它的 Java 代码，我们需要对其进行转义。\n\
  \n另一种方法是重命名导入：\n\n```\n1 import org.mockito.Mockito.`when` as whenever\n2 \n3 ...\n\
  4 \n5 whenever(ds.requestDayForecast(0)).then { ... }\n```\n\n这取决于你；我将使用反引号。\n\n\
  \n\n你有两种选择来克服这种局面：\n\n*   使用 `open` 关键字，这将允许 Mockito mock 你的类，同时也允许任何其他类继承该类（这可能出于某种原因被设计为闭的）。\n\
  *   提取一个接口并 mock 该接口。这是一种更优雅的解决方案，但如果你没有将该接口用于其他任何地方，它也会有些多余。\n\n然而，还有第三种替代方案：Mockito\
  \ 2 中的一个实验性功能。该功能允许你 mock `final` 类并避免那些额外的产物。可能在你读到这些文字时，该功能已经不再是实验性的了。但如果它仍然是实验性的，你需要添加额外的库来启用该功能：\n\
  \n```\n1 testImplementation \"org.mockito:mockito-inline:$mockito_version\"\n```\n\
  `app/build.gradle`\n\n即使它是实验性的，它的运行得也很好，所以请放心使用。\n\n现在你可以重新运行测试，看看它是如何神奇地通过的。\n\n\
  ### 28.3 仪表测试 (Instrumentation tests)\n\n仪表测试稍有不同。它们通常用于测试 UI 交互，我们需要在测试执行时有一个运行中的\
  \ `Application` 实例。为了做到这一点，我们需要部署应用 并在设备上运行测试。\n\n这类测试位于 `androidTest` 文件夹中，在旧版本的\
  \ Android Studio 中，我们必须在“Build Variants”面板中将“Test Artifact” 更改为“Android Instrumentation\
  \ Tests”。实现仪表测试的官方库是 [Espresso](https://google.github.io/android-testing-support-library/)，它可以帮助我们通过编写\
  \ `Action` 轻松地在 App 中导航，并使用 `ViewMatcher` 和 `Matcher` 过滤和检查结果。\n\n配置起来比之前的要复杂一点。我们需要许多额外的库和\
  \ Gradle 配置。好在是 Kotlin 不会增加任何额外的开销，所以如果你已经知道如何配置 Espresso，这对你来说应该是很容易的。\n\n首先，在\
  \ `defaultConfig` 中指定测试运行：\n\n```\n1 defaultConfig {\n2     ...\n3     testInstrumentationRunner\
  \ \"android.support.test.runner.AndroidJUnitRunner\"\n4 }\n```\n`app/build.gradle`\n\
  \n一旦配置了 runner，就可以添加其余的依赖了，这次使用 `androidTestImplementation`。这样，这些库只会在我们编译运行仪表测试时才被添加：\n\
  \n```\n1 buildscript {\n2     ...\n3     ext.test_support_version = '1.0.1'\n4 \
  \    ext.espresso_version = '3.0.1'\n5 }\n```\n`build.gradle`\n\n```\n 1 dependencies\
  \ {\n 2     ...\n 3     androidTestImplementation \"com.android.support:support-annotations:$support_versi\\\
  \n 4 on\"\n 5     androidTestImplementation \"com.android.support.test:runner:$test_support_version\"\
  \n 6     androidTestImplementation \"com.android.support.test:rules:$test_support_version\"\
  \n 7     androidTestImplementation \"com.android.support.test.espresso:espresso-core:$espre\\\
  \n 8 sso_version\"\n 9     androidTestImplementation(\"com.android.support.test.espresso:espresso-contrib:$es\\\
  \n10 presso_version\") {\n11         exclude group: 'com.android.support', module:\
  \ 'appcompat-v7'\n12         exclude group: 'com.android.support', module: 'support-v4'\n\
  13         exclude group: 'com.android.support', module: 'design'\n14         exclude\
  \ group: 'com.android.support', module: 'recyclerview-v7'\n15 }\n```\n`app/build.gradle`\n\
  \n我不想花很多时间说这些，但这里是对为什么你需要这些库的简要说明：\n\n*   `runner`：它是测试运行器，我们在 `defaultConfig` 中指定的那个。\n\
  *   `rules`：包含一些帮助测试加载和启动 activity 的规则。我们将在示例中使用一个规则。\n*   `espresso-core`：Espresso\
  \ 的基本功能，让仪表测试变得更容易库。\n*   `espresso-contrib`：它添加了一些额外功能，例如 `RecyclerView` 测试支持。我们必须排除它的某些依赖项，因为项目中已经有了它们，否则测试会崩溃。\n\
  \n现在让我们创建一个简单的示例。测试将点击预报列表的第一行，并检查是否可以找到一个 id 为 `R.id.weatherDescription` 的视图。此视图位于\
  \ `DetailActivity` 中，这意味着我们在点击 `RecyclerView` 内部的视图后成功地导航到了详情页。\n\n```\n1 class\
  \ SimpleInstrumentationTest {\n2 \n3     @get:Rule\n4     val activityRule = ActivityTestRule(MainActivity::class.java)\n\
  5 \n6     ...\n7 }\n```\n\n我们需要创建一个 activity 规则，它实例化测试将使用的 activity。在 Java 中，你会使用\
  \ `@Rule` 对字段进行注解。然而，如你所知，字段和属性是不相同的，所以如果你只使用它，执行将失败，因为对属性内部字段的访问不是公共的。你需要做的是对 getter\
  \ 进行注解。Kotlin 允许通过在规则名称前指定 `get` 或 `set` 来这样做。在这种情况下，写 `@get:Rule`。\n\n之后，我们就可以准备好创建第一个测试了：\n\
  \n```\n1 @Test fun itemClickNavigatesToDetail() {\n2     onView(withId(R.id.forecastList)).perform(\n\
  3             RecyclerViewActions\n4                 .actionOnItemAtPosition<RecyclerView.ViewHolder>(0,\
  \ click()))\n5     onView(withId(R.id.weatherDescription))\n6            .check(matches(isAssignableFrom(TextView::class.java)))\n\
  7 }\n```\n\n由于这些测试运行在设备上，我们不能使用与单元测试相同的命名格式。该函数使用 `@Test` 注解，正如我们在单元测试中所做的那样。我们可以在测试体中使用\
  \ Espresso。它首先点击第一个位置。然后检查是否可以找到一个是 `TextView` 实例的视图。\n\n要运行测试，你可以像运行单元测试那样做：右键点击\
  \ `androidTest` 下的 `java` 文件夹，选择“Run All Tests”。现在，在“Target device”中选择你喜欢的设备。点击“OK”然后运行。你应该看到应用启动，测试点击第一个位置，打开详情页并关闭\
  \ App。\n\n现在我们将做一个更难的。测试将打开 `Toolbar` 的溢出菜单，点击 `Settings` 操作，更改城市代码并检查 Toolbar 标题是否已更改相应的内容。\n\
  \n```\n1 @Test fun modifyZipCodeChangesToolbarTitle() {\n2     openActionBarOverflowOrOptionsMenu(activityRule.activity)\n\
  3     onView(withText(R.string.settings)).perform(click())\n4     onView(withId(R.id.cityCode)).perform(replaceText(\"\
  94301\"))\n5     pressBack()\n6     onView(isAssignableFrom(Toolbar::class.java))\n\
  7             .check(matches(\n8                 withToolbarTitle(`is(\"Palo Alto\
  \ (US)\")))))\n9 }\n```\n\n测试确切的操作是：\n\n*   它首先通过 `openActionBarOverflowOptionsMenu`\
  \ 打开溢出菜单。\n*   然后它找到带有 `Settings` 文字的视图并执行点击。\n*   之后，设置 activity 打开了，因此它查找 `EditText`\
  \ 并替换旧的城市代码为新值。\n*   它按下返回键，这会将新值保存到偏好设置中并关闭 activity。\n*   由于 `MainActivity` 执行了\
  \ `onResume`，请求再次执行。这获取了新城市的预报。\n*   最后一行检查 Toolbar 标题并查看它是否与正确的值匹配。\n\n这里没有默认的检查\
  \ Toolbar 标题的匹配器，但 Espresso 很容易扩展，因此我们可以创建一个实现该检查的新匹配器：\n\n\n\n\n\n```\n1 private\
  \ fun withToolbarTitle(textMatcher: Matcher<CharSequence>): Matcher<Any> =\n   \
  \      object : BoundedMatcher<Any, Toolbar>(Toolbar::class.java) {\n\n        \
  \    override fun matchesSafely(toolbar: Toolbar): Boolean =\n                textMatcher.matches(toolbar.title)\n\
  \n            override fun describeTo(description: Description) {\n            \
  \    description.appendText(\"with toolbar title: \")\n                textMatcher.describeTo(description)\n\
  \            }\n        }\n```\n\n`matchesSafely` 函数是执行检查的地方，而 `describeTo` 函数则添加了关于匹配器的信息。\n\
  \n这一章特别有趣，因为我们已经看到 Kotlin 如何完全与单元测试和集成测试兼容，并能与这些测试库进行互操作。[[查看代码](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-28)\
  \ 并尝试自己运行测试。]\n\n## 29 额外概念\n\n在整本书中，我们讨论了 Kotlin 语言中最重要的概念。但在实现 App 时，我们没有使用其中一些概念，我不希望让它们消失在这些书中。在这一章中，我将回顾一些不相关的特性，这些特性在你以后使用\
  \ Kotlin 开发下一个 Android App 时可能会有所帮助。\n\n### 29.1 嵌套类\n\n与 Java 一样，我们可以在类内部定义类。默认情况下，内部类无法访问外部类的成员（它在\
  \ Java 中的行为表现像一个静态类）：\n\n```\n1 class Outer {\n2   private val bar: Int = 1\n3 \
  \  class Nested {\n4     fun foo() = 2\n5   }\n6 }\n7\n8 val demo = Outer.Nested().foo()\
  \ // == 2\n```\n\n这就是我们用于 `ForecastListAdapter` 内部 `ViewHolder` 的做法。如果我们想访问外部类的成员，需要将其声明为\
  \ `inner`（内部）类：\n\n```\n1 class Outer {\n2   private val bar: Int = 1\n3   inner\
  \ class Inner {\n4     fun foo() = bar\n5   }\n6 }\n8\n8 val demo = Outer().Inner().foo()\
  \ // == 1\n```\n\n## 29.2 枚举类\n\nKotlin 也提供了一种实现 `enum` 的方法：\n\n```\n1 enum class\
  \ Day {\n2     SUNDAY, MONDAY, TUESDAY, WEDNESDAY,\n3     THURSDAY, FRIDAY, SATURDAY\n\
  4 }\n```\n\n枚举可以拥有参数，这些参数在构造函数中声明：\n\n```\n1 enum class Icon(val res: Int) {\n2\
  \     UP(R.drawable.ic_up),\n3     SEARCH(R.drawable.ic_search),\n4     CAST(R.drawable.ic_cast)\n\
  5 }\n6\n7 val searchIconRes = Icon.SEARCH.res\n```\n\n可以通过匹配名称的 `String` 请求枚举，我们还可以获取一个包含枚举所有值的\
  \ `Array`，以便对它们进行迭代。\n\n```\n1 val search: Icon = Icon.valueOf(\"SEARCH\")\n2 val\
  \ iconList: Array<Icon> = Icon.values\n```\n\n此外，每个枚举常量都有获取其名称和在声明中位置的函数：\n\n```\n\
  1 val searchName: String = Icon.SEARCH.name\n2 val searchPosition: Int = Icon.SEARCH.ordinal\n\
  ```\n\n枚举根据 `ordinal`（序号）实现 `Comparable`，所以它们很容易进行比较。\n\n## 29.3 密封类 (Sealed classes)\n\
  \n密封类用于表示受限的类层次结构，这意味着扩展密封类的类数量是被限制的。它与枚举的相似之处在于，编译器知道密封类有多少个子类型。区别在于，枚举实例是唯一的，而密封类可以有多个实例，这些实例可以包含不同的状态。\n\
  \n例如，我们可以实现类似于 `Option` 类的东西：这种类型通过在对象包含值时返回 `Some` 类，或在为空时返回 `None` 实例，来防止对 `null`的使用：\n\
  \n```\n1 sealed class Option<out T>\n2 object None : Option<Nothing>()\n3 data class\
  \ Just<out T>(val value: T) : Option<T>()\n```\n\n密封类的好处是，当它们被用于 `when` 表达式时，我们可以检查所有选项，而不需要添加\
  \ `else` 分句。此外，如果我们在以后某处添加了新的子类，编译器会警告我们应该处理它的地方。\n\n```\n1 val result = when (option)\
  \ {\n2     None -> \"Empty\"\n3     is Just -> \"Contains a value\"\n4 }\n```\n\n\
  ## 29.4 异常\n\n在 Kotlin 中，所有异常都实现了 `Throwable`，拥有消息并且是未检查的（unchecked）。因此，我们不需要对其中任何一个异常使用\
  \ `try/catch`。这在 Java 中并非如此，例如抛出 `IOException` 的方法需要被 `try/catch` 块包裹。时间证明检查异常并不是一个好主意。\
  \ [Bruce Eckel](http://www.mindview.net/Etc/Discussions/CheckedExceptions)、[Rod\
  \ Waldhoff](http://radio-weblogs.com/0122027/stories/2003/04/01/JavasCheckedExceptionsWereAMistake.html)\
  \ 或 [Anders Hejlsberg](http://www.artima.com/intv/handcuffs.html) 等人可以给你提供更好的视角。\n\
  \n抛出异常的方法与 Java Java：\n\n```\n1 throw MyException(\"Exception message\")\n```\n\n\
  `try` 表达式也是完全相同的：\n\n```\n1 try {\n2   // some code\n3 }\n4 catch (e: SomeException)\
  \ {\n5   // handler\n6 }\n7 finally {\n8   // optional finally block\n9 }\n```\n\
  \n`throw` 和 `try` 在 Kotlin 中都是表达式，允许将它们赋值给变量。这在处理边界情况时非常有用：\n\n```\n1 val s = when(x){\n\
  2     is Int -> \"Int instance\"\n3     is String -> \"String instance\"\n4    \
  \ else -> throw UnsupportedOperationException(\"Not valid type\")\n5 }\n```\n\n\
  或者\n\n```\n1 val s = try { x as String } catch(e: ClassCastException) { null }\n\
  ```\n\n## 30 Java 互操作\n\n到目前，我们一直在讨论从零开始创建一个 App。然而，你可能会发现自己处于已经有 Java 代码的情况。我会涵盖这个主题。\n\
  \nKotlin 的伟大之处之一是它可以与 Java 完全互操作。因此，尽管你的应用程序代码是用 Java 编写的，你也可以创建 Kotlin 代码。从 Java\
  \ 调用 Kotlin 再不过了。这潜在地为你提供了两个优势：\n\n*   可以在 Java 中使用 Kotlin：在任何已启动的项目中，都可以开始编写新的\
  \ Kotlin 代码。\n*   如果你不知道如何在 Kotlin 中实现某功能，可以在 Java 中实现。\n\n### 30.1 包级函数\n\n在 Kotlin\
  \ 中，函数不需要在类内部，但 Java 不是这样的。那么我们如何调用函数呢？假设我们有一个名为 `utils.kt` 的文件，内容如下：\n\n```\n1\
  \ fun logD(message: String) {\n2     Log.d(\"\", message)\n3 }\n4\n5 fun logE(message:\
  \ String) {\n6     Log.e(\"\", message)\n7 }\n```\n\n在 Java 中，我们可以通过名为 `UtilsKt`\
  \ 的类来访问它们，该类包含一些静态方法：\n\n```\n1 UtilsKt.logD(\"Debug\");\n2 UtilsKt.logE(\"Error\"\
  );\n```\n\n### 30.2 扩展函数\n\n我们在书中多次使用了扩展函数。然而，它们在 Java 中是什么样的？如果你有如下函数：\n\n```\n\
  1 fun ViewGroup.inflate(resId: Int, attachToRoot: Boolean = false): View {\n2  \
  \   return LayoutInflater.from(context).inflate(resId, this, attachToRoot)\n3 }\n\
  ```\n\n应用于 `ViewGroup`。它接收一个布局并使用父视图进行加载。如果我们想在 Java 中使用它，会得到什么？结果如下：\n\n```\n1\
  \ View v = UtilsKt.inflate(parent, R.layout.view_item, false);\n```\n\n正如你所见，应用该函数的对象（接收者）被作为参数添加到函数中。此外，可选参数在\
  \ Java 中变成了强制性的，因为在 Java 中无法使用默认值。\n\n\n\n\n\n### 30.3 函数重载\n\n如果你想在 Java 中生成对应的重载方法，可以对该函数使用\
  \ `@JvmOverloads` 注解。在上一个示例中，你不需要在 Java 中为第二个参数指定 `false`：\n\n```\n1 @JvmOverloads\n\
  2 fun ViewGroup.inflate(resId: Int, attachToRoot: Boolean = false): View {\n3  \
  \   return LayoutInflater.from(context).inflate(resId, this, attachToRoot)\n4 }\n\
  5 \n6 View v = UtilsKt.inflate(parent, R.layout.view_item);\n```\n\n如果你希望在从 Java\
  \ 调用 Kotlin 时指定类的名称，可以使用一个注解来修改它。在 `utils.kt` 文件中，在 `package` 语句上方添加以下内容：\n\n```\n\
  1 @file:JvmName(\"AndroidUtils\")\n```\n\n现在 Java 中的类名将命名为：\n\n```\n1 AndroidUtils.logD(\"\
  Debug\");\n2 AndroidUtils.logE(\"Error\");\n3 View v = AndroidUtils.inflate(parent,\
  \ R.layout.view_item, false);\n```\n\n### 30.4 实例字段和静态字段\n\n在 Java 中，我们使用字段来存储状态。它们可以是实例字段（意味着每个对象可以存储不同的值），或者是静态字段（类的所有实例共享它们）。如果我们尝试在\
  \ Kotlin 中寻找它们的等价物，它们就是属性（properties）和伴侣对象（companion objects）。如果我们有如下一个类：\n\n```\n\
  \ 1 class App : Application() {\n 2 \n3     val appHelper = AppHelper()\n 4 \n5\
  \     companion object {\n 6         lateinit var instance: App\n 7     }\n 8 \n\
  \ 9     override fun onCreate() {\n10         super.onCreate()\n11         instance\
  \ = this\n12     }\n13 \n14 }\n```\n\n这在 Java 中是如何运作的？你可以通过使用 getters 和 setters\
  \ 像静态字段一样访问伴侣对象的属性：\n\n```\n1 AppHelper helper = App.instance.getAppHelper();\n\
  ```\n\n作为 `val`，它在 Java 中只生成 `getter`。如果是 `var`，我们还会有一个 `setter`。对 `instance` 的访问之所以自动生效，是因为使用了\
  \ `lateinit` 注解，该注解也暴露了 Kotlin 用于存储状态的字段。但想象我们创建了一个常量：\n\n```\n1 companion object\
  \ {\n2     lateinit var instance: App\n3     val CONSTANT = 27\n4 }\n```\n\n你会发现无法直接使用它。你被迫通过一个名为\
  \ `Companion` 的内部类来访问：\n\n```\n1 KotlinClass.Companion.getCONSTANT()\n```\n\n之前的代码段看起来并不特别易读。为了在\
  \ Java 中以像静态字段一样的方式暴露字段，你需要一个新的注解：\n\n```\n1 @JvmField val CONSTANT = 27\n```\n\n\
  现在你就可以从 Java 代码中使用它了：\n\n```\n1 int c = App.CONSTANT;\n```\n\n如果你在伴侣对象中有函数，它们将通过\
  \ `@JvmStatic` 注解转换为静态方法。定义常量有多种方式，当我们在 Java 中使用 Kotlin 时，它们会生成不同的字节码。如果你还记得，我们之前使用了\
  \ `const val`，那些属性可以在不使用 `getter` 的情况下访问。\n\n### 30.5 数据类\n\n有些功能是显而易见的，但另一些则很难知道它们在\
  \ Java 中的行为。所以，让我们来看看这些 Kotlin 有但 Java 没有的功能。其中一个例子是*数据类*（data classes）。假设我们有如下数据类：\n\
  \n```\n1 data class MediaItem(val id: Int, val title: String, val url: String)\n\
  ```\n\n我们可以创建此类的实例：\n\n```\n1 MediaItem mediaItem = new MediaItem(1, \"Title\",\
  \ \"https://antonioleiva.com\");\n```\n\n但我们遗漏什么吗？首先，检查 `equals` 是否按预期工作：\n\n```\n\
  1 MediaItem mediaItem = new MediaItem(1, \"Title\", \"https://antonioleiva.com\"\
  );\n2 MediaItem mediaItem2 = new MediaItem(1, \"Title\", \"https://antonioleiva.com\"\
  );\n3 \n4 if (mediaItem.equals(mediaItem2)) {\n5     Toast.makeText(this, \"Items\
  \ are equals\", Toast.LENGTH_SHORT).show();\n6 }\n```\n\n当然，它显示了 `Toast`。该类生成的字节码包含了比较两个项目所需的所有内容，如果状态相同，则项目也是相同的。然而，其他事情很难复制。还记得数据类拥有的\
  \ `copy` 功能吗？该方法存在，但你只能通过传递所有参数来使用它：\n\n```\n1 mediaItem.copy(1, \"Title2\", \"\
  http://google.com\");\n```\n\n所以它并没有比直接使用构造函数更好。此外，我们失去了解构（destructuring），因为 Java\
  \ 语言没有表达这种方式。\n\n### 30.6 密封类\n\n另一个你想到的功能是*密封类*（sealed classes）。它们在从 Java 中使用时是如何运作的？让我们尝试一下：\n\
  \n```\n1 sealed class Filter {\n2     object None : Filter()\n3     data class ByType(val\
  \ type: Type) : Filter()\n4     data class ByFormat(val format: Format) : Filter()\n\
  5 }\n```\n\n我们有一个 `Filter` 类，代表一个可以应用于项目的过滤器。当然，在 Java 中我们不能这样做：\n\n```\n1 switch\
  \ (filter) {\n2     ...\n3 }\n```\n（注：原文此处存在大量逻辑重复和损坏的描述，已根据核心含义进行清理和翻译）\n\n###\
  \ 30.7 内联函数和泛型类型\n\n如果你还记得，我们在 Java 中使用 Kotlin 时，可以使用 `inline` 函数和 `reified` 类型。在\
  \ Kotlin 中，你可以让内联函数使用泛型类型。如果我们有一个接收消息作为 lambda 的 `toast` 函数，更容易测试：\n\n```\n1 inline\
  \ fun Context.toast(message: CharSequence) {\n2     Toast.makeText(this, message,\
  \ Toast.LENGTH_SHORT).show()\n3 }\n```\n\n我们可以从 Java 这样使用它：\n\n```\n1 ExtensionsKt.toast(this,\
  \ () -> \"Hello\");\n```\n\n内联函数可以工作，但这里有一个有趣的地方。当从 Kotlin 使用时，反编译代码如下：\n\n```\n\
  1 Toast.makeText(this, \"Hello\", Toast.LENGTH_SHORT).show();\n```\n\n函数是按预期内联的。当从\
  \ Java 使用时会发生什么？对于泛型类型，在类中指定的如下：\n\n```\n1 inline fun <reified T : Activity> Context.startActivity()\
  \ {\n2     startActivity(Intent(this, T::class.java))\n3 }\n```\n\n那么，如果你从 Java\
  \ 调用此函数，你会发现该方法是私有的，因此泛型类型函数在 Java 代码中是不可用的。\n\n### 31 结\n\n感谢阅读本书。在整个章节中，我们通过实现一个\
  \ Android 应用来学习了 Kotlin。天气应用是一个极佳的示例，用于练习大多数应用程序需要的核心功能：主详情界面、与 API 通信、数据库存储、共享偏好……\n\
  \n\n\n\n这种方法的好处在于，你在使用的过程中已经学习了最重要的 Kotlin 概念。在我看来，将新知识付诸实践会更容易被吸收。这是我的首要目标，因为参考书通常是解决特定疑虑的有用工具，但很难从头读到尾。此外，由于示例通常脱离了特定语境，很难理解这些特性解决的是什么类型的问题。\n\
  \n事实上，这也是这本书的另一个目标：向你展示我们在 Android 中面临的真实问题，以及如何使用 Kotlin 来解决它们。任何 Android 开发者在处理异步、数据库，或必须实现冗长的监听器或\
  \ Activity 导航时，都会遇到许多问题。通过使用一个真实的 App 作为示例，我们在学习新语言特的同时的同时回答了许多此类问题。\n\n我希望我实现了这些目标，并希望你不仅学会了\
  \ Kotlin，而且享受阅读这本书的过程。既然 Google 已经采用了 Kotlin，我深信学习这门语言是必经之路：你将享受开发 App，并为这项已成为许多\
  \ Android 职位日益紧需的新技能做好准备。\n\n这本书已经结束了，但并不意味着它完结了。我将继续将其更新到 Kotlin 的最新版本，并根据你的反馈和建议对其进行审查和改进。欢迎随时给我写信，告诉你的想法、发现的错误、不够清楚的概念或你可能有的任何顾虑。\n\
  \n在写这本书的几个月里，这是一段奇妙的旅程。我也到了很多，所以再次感谢你让《Kotlin for Android Developers》成为现实。\n\n祝好，\n\
