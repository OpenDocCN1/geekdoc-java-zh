  @+id/minTemperature\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:textAppearance=\"@style/Caption\"\n        tools:text=\"\
  15\"/>\n\n</LinearLayout>\n```\n\n`layout/item_forecast.xml`\n\n领域模型和数据映射器必须生成完整的图标\
  \ URL，以便我们可以加载它：\n\n```kotlin\ndata class Forecast(val date: String, val description:\
  \ String, \n                    val high: Int, val low: Int, val iconUrl: String)\n\
  ```\n\n`model/DomainClasses.kt`\n\n在 `ForecastDataMapper` 中：\n\n```kotlin\nprivate\
  \ fun convertForecastItemToDomain(forecast: Forecast): ModelForecast {\n    return\
  \ ModelForecast(convertDate(forecast.dt), \n            forecast.weather[0].description,\
  \ forecast.temp.max.toInt(), \n            forecast.temp.min.toInt(), generateIconUrl(forecast.weather[0].icon))\n\
  }\n\nprivate fun generateIconUrl(iconCode: String): String \n        = \"http://openweathermap.org/img/w/$iconCode.png\"\
  \n```\n\n`domain/mappers/ForecastDataMapper.kt`\n\n\n\n\n\n我们从第一个请求中获得的 `icon` 代码用于构建图标图像的完整\
  \ URL。加载图像最简单的方法是使用图像加载库。[Picasso](http://square.github.io/picasso/) 是一个极佳的选择。你必须将其添加到\
  \ `build.gradle` 依赖项中：\n\n```\n1 compile \"com.squareup.picasso:picasso:2.5.2\"\n\
  ```\n\n`app/build.gradle`\n\n适配器也需要进行重构。一个点击监听器是必要的，让我们让我们定义它：\n\n```\n1 interface\
  \ OnItemClickListener {\n2      operator fun invoke(forecast: Forecast)\n3 }\n```\n\
  \n`ui/adapters/ForecastListAdapter.kt`\n\n如果你还记得上节课的内容，调用它时可以省略 `invoke` 方法。所以让我们用它作为一种简化方式。监听器可以通过两种方式被调用：\n\
  \n```\n1 itemClick.invoke(forecast)\n2 itemClick(forecast)\n```\n\n`ViewHolder`\
  \ 现在将负责将预报绑定到新视图：\n\n```\n 1 class ViewHolder(view: View, private val itemClick:\
  \ OnItemClickListener)\n 2     : RecyclerView.ViewHolder(view) {\n 3 \n 4     private\
  \ val iconView = view.find<ImageView>(R.id.icon)\n 5     private val dateView =\
  \ view.find<TextView>(R.id.date)\n 6     private val descriptionView = \n 7    \
  \         view.find<TextView>(R.id.description)\n 8     private val maxTemperatureView\
  \ = \n 9             view.find<TextView>(R.id.maxTemperature)\n10     private val\
  \ minTemperatureView = \n 11             view.find<TextView>(R.id.minTemperature)\n\
  \ 12 \n 13     fun bindForecast(forecast: Forecast) {\n 14         with(forecast)\
  \ {\n 15             Picasso.with(itemView.ctx).load(iconUrl).into(iconView)\n 16\
  \             dateView.text = date\n 17             descriptionView.text = description\n\
  \ 18             maxTemperatureView.text = \"$high\"\n 19             minTemperatureView.text\
  \ = \"$low\"\n 20             itemView.setOnClickListener { itemClick(this) }\n\
  \ 22         }\n 22     }\n 23 }\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\n\
  适配器的构造函数现在接收 `itemClick`。创建和绑定的方法变得更了：\n\n```\n 1 public class ForecastListAdapter(private\
  \ val weekForecast: ForecastList, \n 2         private val itemClick: ForecastListAdapter.OnItemClickListener)\
  \ :\n 3         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 4 \n\
  \ 5     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): \n 6\
  \             ViewHolder {\n 7         val view = LayoutInflater.from(parent.ctx)\n\
  \ 8             .inflate(R.layout.item_forecast, parent, false) \n 9 \n10      \
  \   return ViewHolder(view, itemClick)\n 11     }\n 12 \n 13     override fun onBindViewHolder(holder:\
  \ ViewHolder, position: Int) {\n 14         holder.bindForecast(weekForecast[position])\n\
  \ 15     }\n 16     ...\n 17 }\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\n\
  如果你使用这段代码，`parent.ctx` 将无法编译。Anko 提供了许多扩展函数使 Android 编码更简单。例如，它包含了用于 activity 和\
  \ fragment 的 `ctx` 属性等，可以返回 context，但它缺少视图的相同属性。因此，我们将在 `ui.utils` 内部创建一个名为 `ViewExtensions.kt`\
  \ 的新文件，并添加此扩展属性：\n\n```\n1 val View.ctx: Context\n2     get() = context\n```\n\n\
  从现在起，任何视图都可以使用它。这完全没有必要，因为你可以使用 `context` 合成属性，但我认为如果我们计划在其他类中使用 `ctx`，这样可以提供一些一致性。此外，这是如何使用扩展属性的另一个示例。\n\
  \n最后，`MainActivity` 调用 `setAdapter` 的结果如下：\n\n```\n1 forecastList.adapter = ForecastListAdapter(result,\n\
  2         object : ForecastListAdapter.OnItemClickListener{\n3             override\
  \ fun invoke(forecast: Forecast) {\n4                 toast(forecast.date)\n5  \
  \           }\n6         })\n```\n\n`ui/activities/MainActivity.kt`\n\n如你所见，为了实现匿名类，我们实际上创建了一个实现我们所创建接口的\
  \ `object`。这是因为我们没有利用函数式编程的力量，但你将在下一章中学习如何将此代码转换为更整洁的内容。\n\n尝试来自[仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-12)\
  \ 的新更改。\n\n## 13 Lambda（ 表达式）\n\nLambda 表达式是定义匿名函数的简单方法。Lambda 非常有用，因为它们防止了我们要在抽象类或接口中编写函数规范，然后编写类的实现。\n\
  \n在 Kotlin 中，lambda 是一等公民，这意味着函数表现得像类型一样：它可以被作为参数传递给另一个函数，可以由函数返回，可以保存到变量或属性中等。\n\
  \n### 13.1 简化 setOnClickListener()\n\n让我们通过 Android 中的一个典型示例来看它是如何工作的：来自 `View`\
  \ 的点击监听器方法。如果我们想在 Java 中实现点击监听器行为，首先需要编写 `OnClickListener` 接口：\n\n```java\n1 interface\
  \ OnClickListener {\n2     void onClick(View v);\n3 }\n```\n\n然后编写一个实现该接口的匿名类：\n\
  \n```java\n1 view.setOnClickListener(new OnClickListener() {\n2     @Override\n\
  3     public void onClick(View v) {\n4         Toast.makeText(v.getContext(), \"\
  Click\", Toast.LENGTH_SHORT).show();\n5     }\n6 });\n```\n\n这是代码转换为 Kotlin（使用来自\
  \ Anko 的 `toast` 函数）：\n\n```kotlin\n1 view.setOnClickListener(object : OnClickListener\
  \ {\n2     override fun onClick(v: View) {\n3         toast(\"Click\")\n4     }\n\
  5 })\n```\n\n幸运的是，Kotlin 对此有一些优化，lambda 可以替代任何接收单个函数的接口。如果我们这样定义 `setOnClickListener()`：\n\
  \n```kotlin\n1 fun setOnClickListener(listener: (View) -> Unit)\n```\n\n要定义 lambda\
  \ 表达式，在箭头左侧（括号内）指定函数参数，在右侧指定类型。在这种情况下，我们得到 `View` 并返回 `Unit`（无）。所以根据此，我们可以简化之前的代码：\n\
  \n```kotlin\n1 view.setOnClickListener({ view -> toast(\"Click\")})\n```\n\n很棒的区别！在定义函数时，我们必须使用大括号并在左侧指定参数值，在右侧指定函数体。如果参数没有被使用，我们甚至可以去掉左部分：\n\
  \n```kotlin\n1 view.setOnClickListener({ toast(\"Click\") })\n```\n\n如果函数的最后一个参数也是函数，我们可以将其从括号中移出：\n\
  \n```kotlin\n1 view.setOnClickListener() { toast(\"Click\") }\n```\n\n最后，如果函数是唯一的参数，我们可以去掉括号：\n\
  \n```kotlin\n1 view.setOnClickListener { toast(\"Click\") }\n```\n\n比原始 Java 代码小了五倍以上，并且更容易理解在做什么。\n\
  \n### 13.2 ForecastListAdapter 的点击监听器\n\n在上一节中，我故意用困难的方法编写点击监听器是为了为开发这一个提供良好的背景。但现在是时候付诸所学了。我们正在从\
  \ `ForecastListAdapter` 中移除监听器接口并改用 lambda：\n\n```kotlin\n1 public class ForecastListAdapter(private\
  \ val weekForecast: ForecastList, \n                                  private val\
  \ itemClick: (Forecast) -> Unit)\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\n\
  该函数将接收一个预报并不返回。相同的更改也可以对 `ViewHolder` 进行：\n\n```kotlin\n1 class ViewHolder(view:\
  \ View, private val itemClick: (Forecast) -> Unit)\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\
  \n其余代码保持不变。只是对 `MainActivity` 的最后更改：\n\n```kotlin\n1 val adapter = ForecastListAdapter(result)\
  \ { forecast -> toast(forecast.date) }\n```\n\n`ui/activities/MainActivity.kt`\n\
  \n\n\n\n我们可以进一步简化最后一行。在只有一个参数的 lambda 中，我们可以利用 `it` 引用，这避免了我们显式地定义函数的左部分。因此我们可以这样做：\n\
  \n```kotlin\n1 val adapter = ForecastListAdapter(result) { toast(it.date) }\n```\n\
  \n### 13.3 扩展语言\n\n得益于这些转换，我们可以创建自己的构建器和代码块。我们已经在使用一些像 `with` 这样有趣的函数。虽然标准库中包含的稍微复杂一点，但更简单的实现如下：\n\
  \n```kotlin\n1 inline fun <T> with(t: T, body: T.() -> Unit) { t.body() }\n```\n\
  \n该函数接收一个类型为 `T` 的对象和一个行为类似于扩展函数的 lambda。实现过程接收该对象并允许执行该函数。由于函数的第二个参数是另一个函数，它可以提取到括号之外，因此我们可以创建一个代码块，在其中我们可以直接使用\
  \ `this` 以及该对象的公共属性和方法：\n\n```kotlin\n1 with(forecast) {\n2     Picasso.with(itemView.ctx).load(iconUrl).into(iconView)\n\
  3     dateView.text = date\n4     descriptionView.text = description\n5     maxTemperatureView.text\
  \ = \"$high\"\n6     minTemperatureView.text = \"$low\"\n7     itemView.setOnClickListener\
  \ { itemClick(this) }\n8 }\n```\n\n另一个例子：我们可以创建仅在版本为 Lollipop 或更高版本时才运行的代码块：\n\n\
  ```kotlin\n1 inline fun supportsLollipop(code: () -> Unit) {\n2     if (Build.VERSION.SDK_INT\
  \ >= Build.VERSION_CODES.LOLLIPOP) {\n3         code()\n4     }\n5 }\n```\n\n函数体会检查版本，并在满足要求时执行代码。现在我们可以这样做：\n\
  \n```kotlin\n1 supportsLollipop {\n2     window.setStatusBarColor(Color.BLACK)\n\
  3 }\n```\n\n例如，Anko 也是基于这个思想来实现 Android 布局 DSL 的。你也可以查看 Kotlin 参考中的一个示例，它展示了如何从代码中[生成\
  \ HTML](http://kotlinlang.org/docs/reference/type-safe-builders.html) 的 DSL。\n\n\
  本章的更改可以在[对应的分支中](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-13)找到。\n\
  \n## 14 可见性修饰符\n\nKotlin 中修饰符的使用与 Java 有不同。这种语言的默认修饰符是 `public`，这节省了大量的时间字符。这里是详细解释：可见性修饰符在\
  \ Kotlin 中是如何工作的？\n\n### 14.1 修饰符\n\n#### private\n\n`private` 修饰符是我们可以使用的最严格限制。它表示在文件中可见。因此，如果我们将一个类声明为\
  \ `private`，则无法在定义它的文件之外使用它。\n\n另一方面，如果在类内部使用 `private`，则访问被限制在该类内部。即使是扩展它的类也无法使用它。\n\
  \n因此，声明为 `private` 的第一级类、对象、接口……（称为包成员）仅在声明它们所在的文件内部可见，而定义在类或接口内部的所有内容仅对该类或该接口可见。\n\
  \n#### protected\n\n此修饰符仅适用于类或接口的成员。包成员不能是 `protected`。在成员内部，它的工作方式与 Java 相同：它可以被成员本身以及扩展它的成员使用（例如类及其子类）。\n\
  \n#### internal\n\n如果一个内部成员是包成员，则它在整个模块内可见。如果它是另一个作用域的成员，则取决于该作用域的可见性。例如，如果我们写了一个私有类，对\
  \ `internal` 函数的访问将限于该类的可见性。\n\n我们可以从同一模块中的任何其他类使用 `internal` 类，但不能从另一个模块使用。\n\n\
  #### public\n\n正如你所猜的，这是限制最少的修饰符。它是默认修饰符，声明为 `public` 的成员在任何地方可见，仅受其作用域限制。定义在私有类中的公共成员在类可见的作用域之外不可见。\n\
  \n### 14.2 构造函数\n\n默认情况下，所有构造函数都是 `public` 的，这意味着可以在类可见的任何作用域中使用它们。如果我们想限制构造函数的可见性，可以使用这种特定语法对其应用修饰符：\n\
  \n```kotlin\n1 class C private constructor(a: Int) { ... }\n```\n\n### 14.3 复习我们的代码\n\
  \n我们已经使用了默认的 `public` 修饰符，最新版本的 Kotlin 插件也会检测参数何时可以是私有的。例如，在 `RequestForecastCommand`\
  \ 中，我们将 `zipCode` 属性设为了私有。\n\n```kotlin\n1 class RequestForecastCommand(private\
  \ val zipCode: String)\n```\n\n此外，在 Kotlin 中，如果编译器可以推断，我们就不需要指定函数的返回类型。这是一个如何获取返回类型的示例：\n\
  \n```kotlin\n1 data class(...) {\n2     operator fun get(position: Int)\n3 }\n```\n\
  \n## 15 Kotlin Extensions\n\n**Kotlin Extensions** 是 Kotlin 团队开发的另一个插件，用于使 Android\
  \ 开发更加简单。插件会自动创建属性，可以直接访问 XML 中的所有视图。它不需要添加库。\n\n它在底层是如何工作的？这些属性委托给请求视图的函数以及一个防止每次使用属性时都执行\
  \ `findViewById` 的缓存函数。请注意，这种缓存机制在接收者为 Activity 或 Fragment 时有效。\n\n### 15.1 如何使用\
  \ Kotlin Extensions\n\n让我们看看有多简单。虽然该插件是常规的一部分（不需要安装新插件），但如果你想使用它，需要在 Android 模块中添加一个额外的\
  \ `apply`：\n\n```gradle\n1 apply plugin: 'com.android.application'\n2 apply plugin:\
  \ 'kotlin-android'\n3 apply plugin: 'kotlin-android-extensions'\n```\napp/build.gradle\n\
  \n如果你记得的话，我们在书的开头已经这样做。\n\n#### 从 XML 恢复视图\n\n从现在起，恢复视图就像直接在活动中使用你在 XML 中定义的视图 ID\
  \ 一样简单。假设你有一个像这样的 XML：\n\n```xml\n 1 <FrameLayout\n2     xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n3     android:layout_width=\"match_parent\"\n4     android:layout_height=\"match_parent\"\
  \n5 \n6     <TextView\n7         android:id=\"@+id/welcomeMessage\"\n8         android:layout_width=\"\
  wrap_content\"\n9         android:layout_height=\"wrap_content\"\n10         android:layout_gravity=\"\
  center\"\n11         android:text=\"Hello World!\"/>\n12 \n13 </FrameLayout>\n```\n\
  \n如你所见，`TextView` 拥有 `welcomeMessage` ID。在 `MainActivity` 中，你现在可以写：\n\n```kotlin\n\
  1 override fun onCreate(savedInstanceState: Bundle?) {\n2     super.onCreate(savedInstanceState)\n\
  3     setContentView(R.layout.activity_main)\n4 \n5     welcomeMessage.text = \"\
  Hello Kotlin!\"\n6 }\n```\n\n\n\n\n\n要使用它，你需要一个特殊的 `import`（就是我在下面写的这一个），但 IDE 可以为你写好\
  \ import：\n\n```\n1 import kotlinx.android.synthetic.main.activity_main.*\n```\n\
  \n新的 Android Studio Activity 模板现在通过使用 `include` 标签包含了嵌套布局。重要的一点是，你必须为你使用的每个 XML\
  \ 添加对应的合成导入（synthetic import）：\n\n```\n1 import kotlinx.android.synthetic.main.activity_main.*\n\
  2 import kotlinx.android.synthetic.main.content_main.*\n```\n\n正如我上面提到的，生成的代码包含一个视图缓存（view\
  \ cache）。因此，如果你再次请求该视图，就不需要再次调用 `findViewById`。让我们来看看它在后台执行了什么。\n\n### Kotlin Android\
  \ 扩展背后的魔法\n\n当你开始学习 Kotlin 时，理解在使用新特性时生成的字节码是有帮助的。这种做法有助于你理解所做决策背后的隐藏成本。\n\n在 `Tools\
  \ –> Kotlin` 下有一个操作叫做 `Show Kotlin Bytecode`（显示 Kotlin 字节码）。点击这里，你可以看到打开的类文件编译时生成的字节码。\n\
  \n字节码对大多数人类来说没有帮助，但这里还有另一个选项：`Decompile`（反编译）。\n\n此部分显示了 Kotlin 生成的字节码的 Java 表示。这样，你就可以将\
  \ Java 等效代码与编写的 Kotlin 代码进行对比。\n\n我将将其此于上一个示例 Activity，看看 Kotlin Android 扩展生成的代码。\n\
  \n有趣的部分是这一个：\n\n```\n 1 ...\n 2 public View _$_findCachedViewById(int var1) {\n\
  \ 3    if(this._$_findViewCache == null) {\n 4       this._$_findViewCache = new\
  \ HashMap();\n 5    }\n 6 \n 7    View var2 = (View)this._$_findViewCache.get(Integer.valueOf(var1));\n\
  \ 8    if(var2 == null) {\n 9       var2 = this.findViewById(var1);\n10       this._$_findViewCache.put(Integer.valueOf(var1),\
  \ var2);\n11    }\n12 \n13    return var2;\n14 }\n15 \n16 public void _$_clearFindViewByIdCache()\
  \ {\n17    if(this._$_findViewCache != null) {\n 18       this._$_findViewCache.clear();\n\
  19    }\n20 \n21 }\n```\n\n这就是我们讨论过的视图缓存。当请求一个视图时，它会尝试在缓存中查找。如果那里没有，它会使用 `findViewById`\
  \ 并将其添加到缓存中。确实非常简单。\n\n此外，它还添加了一个清除缓存的函数：`clearFindViewByIdCache()`。你可以在重建视图时使用它，因为旧视图已经不再有效了。那么这一行：\n\
  \n```\n1 welcomeMessage.text = \"Hello Kotlin!\"\n```\n\n被转换为：\n\n```\n1 ((TextView)this._$_findCachedViewById(id.welcomeMessage))\n\
  2     .setText((CharSequence)\"Hello Kotlin!\");\n```\n\n所以属性并不是真实的，插件并没有为每个视图生成属性。它在编译期间替换代码以访问视图缓存，将其转换为正确的类型并调用方法。\n\
  \n### Fragment 中的 Kotlin Android Extensions\n\nFragment 也可以使用这个插件。Fragment 的问题在于，视图可以在\
  \ Fragment 实例存活的同时重建。那时会发生什么？这意味着缓存中的视图将不再有效。\n\n让我们看看使用 Fragment 时生成的代码。我正在创建这个简单的\
  \ Fragment，它使用了我上面写的同一个 XML：\n\n```\n 1 class Fragment : Fragment() {\n 2 \n 3 \
  \    override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?,\
  \ \n 4             savedInstanceState: Bundle?): View? {\n 5         return inflater.inflate(R.layout.fragment,\
  \ container, false)\n 6     }\n 7 \n 8     override fun onViewCreated(view: View?,\
  \ savedInstanceState: Bundle?) {\n 9         super.onViewCreated(view, savedInstanceState)\n\
  10         welcomeMessage.text = \"Hello Kotlin!\"\n11     }\n12 }\n```\n\n在 `onViewCreated`\
  \ 中，我更改了 `TextView` 的文本。生成的字节码呢？一切与 Activity 中一样，只有这个细微的区别：\n\n```\n1 // $FF: synthetic\
  \ method\n2 public void onDestroyView() {\n3    super.onDestroyView();\n4    this._$_clearFindViewByIdCache();\n\
  5 }\n```\n\n当视图销毁时，该方法会调用 `clearFindViewByIdCache`，所以在这里是安全的。\n\n### 自定义 View 中的\
  \ Kotlin Android extensions\n\n在自定义 View 上的工作方式非常相似。假设我们有这样一个视图：\n\n```\n 1 <merge\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n 2             \
  \  android:orientation=\"vertical\"\n 3               android:layout_width=\"match_parent\"\
  \n 4               android:layout_height=\"match_parent\">\n 5 \n 6     <ImageView\n\
  \ 7         android:id=\"@+id/itemImage\"\n 8         android:layout_width=\"match_parent\"\
  \n 9         android:layout_height=\"200dp\"/>\n10 \n 11     <TextView\n 12    \
  \     android:id=\"@+id/itemTitle\"\n 13         android:layout_width=\"match_parent\"\
  \n14         android:layout_height=\"wrap_content\"/>\n15 \n16 </merge>\n```\n\n\
  ```\n1 class CustomView @JvmOver constructor(2         context: Context, attrs:\
  \ AttributeSet? = null,\n3 defStyleAttr: Int = 0\n4 ) : LinearLayout(context, attrs,\
  \ defStyleAttr) {\n 5 \n6     init {\n 7         LayoutInflater.from(context).inflate(R.layout.custom,\
  \ this, true)\n 8         itemTitle.text = \"Hello Kotlin!\"\n9     }\n10 }\n```\n\
  \n### 从另一个视图恢复视图\n\nKotlin Extensions 提供的另一种方案是从另一个视图使用属性。我正在使用一个与上一节非常相似的布局。假设它在适配器中加载。你也可以通过使用此插件直接访问子视图：\n\
  \n```\n1 val itemView = ...\n2 itemView.itemImage.setImageResource(R.drawable.image)\n\
  3 itemView.itemTitle.text = \"My Text\"\n```\n\n插件还会帮助你填充 `import`。检查这一个不同：\n\n\
  ```\n1 import kotlinx.android.synthetic.main.view_item.view.*\n```\n\n关于这一点你需要了解几点：\n\
  \n*   在编译时，你可以从任何其他视图引用任何视图。这意味着你可能会引用一个并不是它的直接子元素的视图。当然，在运行时尝试恢复不存在的视图时会崩溃。\n*\
  \   在这种情况下，视图是不被缓存的，这与 `Activities` 和 `Fragments` 不同。\n\n\n\n\n\n此 `experimental`\
  \ 标志意味着该 API 尚未完善，因此它在未来可能会发生。\n\n### 在 ViewHolder（或任何自定义类）上的缓存\n\n你现在可以以简单的方式在任何类上构建缓存。唯一的要求是你的类必须实现\
  \ `LayoutContainer` 接口。该接口提供了插件用于查找子视图的视图。假设我们有一个 `ViewHolder`，它持有一个具有如之前示例中所示布局的视图。所需的代码如下：\n\
  \n```\n1 class ViewHolder(override val containerView: View) \n2         : RecyclerView.ViewHolder(containerView),\
  \ LayoutContainer {\n3 \n4     fun bind(title: String) {\n5         itemTitle.text\
  \ = \"Hello Kotlin!\"\n6     }\n7 }\n```\n\n`containerView` 是我们从 `LayoutContainer`\
  \ 接口中重写的那个，这也就是你需要的全部。从现在起，你可以直接访问视图，不再需要在前面前加上 `itemView` 来获取对子视图的访问权限。\n\n再次强调，如果你检查代码生成的内容，你会发现它正在从缓存中获取视图：\n\
  \n```\n1 ((TextView)this._$_findCachedViewById(id.itemTitle))\n2     .setText((CharSequence)\"\
  Hello Kotlin!\");\n```\n\n我在这里一个 `ViewHolder` 上使用了它，但你可以看到它是足够通用的，可以用于任何类。\n\n###\
  \ 使用 Kotlin Android Extensions 实现 Parcelable\n\n有了新的 `@Parcelize` 注解，你可以轻松地实现 `Parcelable`。只需编写注解，插件就会完成所有繁琐的工作：\n\
  \n```\n1 @Parcelize\n2 class Model(val title: String, val amount: Int) : Parcelable\n\
  ```\n\n然后，正如你所知道的，你可以将对象添加到 intent 中：\n\n```\n1 val intent = Intent(this, DetailActivity::class.java)\n\
  2 intent.putExtra(DetailActivity.EXTRA, model)\n3 startActivity(intent)\n```\n\n\
  并在需要该对象的地方从 intent 中恢复它（在本例中，即在目标 activity 中）：\n\n```\n1 val model: Model = intent.getParcelableExtra(EXTRA)\n\
  ```\n\n### 自定义缓存构建\n\n此实验性 set 包含的最后一个新功能是一个名为 `@ContainerOptions` 的新注解。它允许你自定义缓存的构建方式，甚至防止某个类创建缓存。\n\
  \n默认情况下，如我们之前所见，它使用 `Hashmap`。这种行为可以更改为使用 Android 框架的 `SparseArray`，这在某些情况下可能更高效。最后，如果由于某种原因你想禁用某个特定类的缓存，你也有该选项。\n\
  \n这里是更改缓存实现的一个示例：\n\n```\n1 @ContainerOptions(CacheImplementation.SPARSE_ARRAY)\n\
  2 class MainActivity : AppCompatActivity() {\n3     ...\n4 }\n```\n\n目前，现有选项如下：\n\
  \n```\n1 public enum class CacheImplementation {\n2     SPARSE_ARRAY,\n3     HASH_MAP,\n\
  4     NO_CACHE;\n5 \n6     ...\n7 }\n```\n\n现在你已经了 Kotlin Android Extensions 插件提供的所有功能。现在，让我们在代码中使用其中一些功能吧。\n\
  \n### 15.3 重构我们的代码\n\n为了开始使用 Kotlin Android Extensions，我们对示例应用进行的修改非常简单。\n\n让我们从\
