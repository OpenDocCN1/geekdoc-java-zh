- "# Android 开发者的 Kotlin 入门指南：在开发 Android 应用的同时轻松学习 Kotlin\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n## I. 关于这本书\n\n嘿！非常感谢你对这本书的关注，看到你决定成为 Android Kotlin 专家，我感到非常兴奋。\n\n\
  自从我 2015 年年中开始编写《Android 开发者 Kotlin Go》以来，发生了很多事情。那时，Kotlin 仍然处于早期访问版本。然而，我感受到了这种语言巨大的力量，因此决定在书中解释我所学到的一切。\n\
  \n从那时起，这种语言不断成长，直到 Google 宣布他们开始支持 Kotlin 作为开发 Android 应用的官方语言。\n\n这些是令人震惊的消息。但更惊讶的是，Google\
  \ 和 JetBrains 都向想要学习这种语言的 Android 开发者推荐了这本书。\n\n如你所知，这是一本精益出版物。这本书的成长和进展感谢读者的评论。因此，我只能感谢你帮助我将这个梦想变为现实。\n\
  \n### 《Android 开发者 Kotlin Go》关于什么\n\n在本书中，我将使用 Kotlin 作为主要语言，从零开始创建一个 Android 应用。其核心思想是通过示例来学习语言，而不是遵循普通的参考书结构。我会停下来解释\
  \ Kotlin 中最有用的概念和主意，并将它们与 `Java 6` 进行比较。这样，你就能看到差异在哪里，以及语言的哪些部分可以帮助你加速工作。\n\n这本书并不是作为语言参考书，而是\
  \ Android 开发者学习 Kotlin 并能够继续进行自己项目的工具。示例旨在解决我们作为应用开发人员在日常生活中面临的最常见问题，方法是利用 Kotlin\
  \ 的表达能力以及其他令人兴奋的工具和库。然而，本文涵盖了 Kotlin 的大部分功能，因此在阅读结束时，你将对该语言有深入的了解。\n\n内容非常实用，所以我建议你在电脑前跟随示例和代码，并尝试它建议的所有内容。不过，你可以先读一遍以获得大致概念，然后投入实践。\n\
  \n尽管这本书现在已经完成，但我会定期对其进行回顾，以保持与新的 Kotlin 版本同步。因此，欢迎随时写信告诉我对对这本书的看法，或者哪些地方可以改进。我希望这本书成为\
  \ Android 开发者的完美工具，因此欢迎任何帮助和建议。\n\n如果你正在阅读纸质版并希望接收最新的更新，请随时通过 `contact@antonioleiva.com`\
  \ 向我发送邮件并附上购买证明，我将给你数字版的访问权限。这样，你将持续收到更新。如果你是从任何书店（Kindle, Kobo…）购买的并想获取 PDF 版本，也这样做。\n\
  \n感谢你加入这个令人兴奋的项目！\n\n## II. 这本书适合你吗？\n\n这本书旨在为对学习 Kotlin 语言感兴趣的 Android 开发者提供帮助。\n\
  \n如果你处于以下情况，这本书就适合你：\n\n*   你具有一些 Android 开发、Android SDK 以及 Java 语言的基础知识。\n*   你想通过遵循示例来学习如何使用\
  \ Kotlin 开发 Android 应用。\n*   你需要一份指南，关于如何使用更简洁、表达力的语言来解决 Android 开发者每天面临的许多共同挑战。\n\
  \n另一方面，这本书可能不适合你。以下是你在书中找不到的话题：\n\n*   这些页面的内容并不是 Kotlin 圣经。我会解释所有基础知识，当复杂想法出现时也会进行解释。所以你可能是通过示例学习，而不是通过方法。\n\
  *   我不会解释如何开发 Android 应用。你不需要对平台有深入理解，但至少需要一些基础知识，如 Android Studio、`Gradle` 和 `Java`\
  \ 编程。\n*   这本书不是函数式编程指南。当然，`Java 6` 完全不是函数式的。\n\n## III. 关于作者\n\nAntonio Leiva 是一位\
  \ Android 工程师，花费时间学习获取 Android 的新方法并撰写文章。他在 [antonioleiva.com](http://antonioleiva.com)\
  \ 编写博客，专注于帮助 Android 开发者学习 Kotlin。\n\n他还举办密集工作坊，参与者会将书中的内容付诸实践。在 10 小时内，人们可以从无知到能够创建自己的应用。\n\
  \nAntonio 起初担任 CRM 技术的顾问，但一段时间后，在寻找真正的热情时发现了 Android 平台。在获得一些经验后，他在一家移动公司开启了新的冒险，在那里他为知名公司领导了多个项目。\n\
  \n他目前在 [Plex](http://plex.tv)  Android 工程师，他在 Android 应用的设计和 UX 上也起着至关重要的作用。\n\n\
  你可以在 Twitter 上的 [@lime_cl](https://twitter.com/lime_cl) 或 Google+ 上的 +AntonioLeivaGordillo\
  \ 找到 Antonio。\n\n## 1 引言\n\n在 Google I/O 2017 上，Android 团队宣布 Kotlin 将成为开发 Android\
  \ 应用的官方语言。\n\n这意味着，虽然仍然可以使用 `Java` 开发 Android 应用，但从现在起 Kotlin 得到了完全支持，Google 正在确保新的\
  \ Android 特性、框架、IDE 以及他们所有的库都能与新语言无缝衔接。\n\n在书中，我将向你展示如何做，因此我希望我帮助你理解 Kotlin 让你领先一步并让你的代码变得更好的各种方式。\n\
  \n\n\n\n然而，在深入研究语言的特性之前，让我先简单介绍一下背景。\n\n### 1.1 什么是 Kotlin？\n\nKotlin 是 [JetBrains](https://www.jetbrains.com/)\
  \ 开发的一种语言，该公司以构建 IntelliJ IDEA（一款功能强大的 Java 开发 IDE）而闻名。官方 Android IDE Android Studio\
  \ 也基于 IntelliJ。它最初被设计在 Java 虚拟机上运行。\n\nJetBrains 设计 Kotlin 时考虑了 Java 开发者，并以 IntelliJ\
  \ 作为其主要的开发 IDE。这两个因素是让 Android 开发者快速采用该语言的突破点：\n\n* `Kotlin 对 Java 开发者来说非常直观且易于学习`。语言的大部分与我们已经熟悉的非常相似，差异可以很快掌握。\n\
  \n* `我们免费拥有与日常使用的 IDE 的全方位集成`。Android Studio 可以理解、编译和运行 Kotlin 代码。此外，对这种语言的支持来自开发\
  \ IDE 的公司，因此我们 Android 开发者是一等公民。\n\n然而，这仅与语言如何与我们的工具集成。与 Java 6 相比，这种语言的优势何？\n\n\
  * `它更具表现力`：这是它的主要特点之一。你可以用更少的代码实现更多的功能。\n\n* `它更安全`：Kotlin 是空安全的，这意味着我们在编译时就能处理可能的空情况，以防止运行时异常。我们需要显式地指定一个对象可以为空，然后在使用它之前检查其空值。你可以节省大量调试空指针异常和修复空值错误的时间。\n\
  \n* `它是函数式的`：Kotlin 从根本上是一种面向对象的语言，而不是纯函数式语言。但是，像许多其他现代语言一样，它使用了函数式编程的许多概念（如 lambda\
  \ 表达式）来更自然地解决问题。另一个很棒特性是它处理集合的方式。\n\n* `它利用扩展函数`：这意味着即使我们无法访问，也可以为任何类扩展新功能。\n\n\
  * `它是高度的互操作性`：你可以继续使用大多数用 Java 编写的库和代码，因为两种语言之间的互操作性非常好。甚至可以创建混合项目，让 Kotlin 和 Java\
  \ 文件共存。\n\n然而，这只是冰山一角：- 自 Kotlin 1.1 版本起，[Kotlin JS](https://kotlinlang.org/docs/reference/js-overview.html)\
  \ 的最终版本已经发布。这个新变体允许你使用 Kotlin 开发 Web 应用。- 自 Kotlin 1.2 版本起，你还可以创建[多平台项目](https://kotlinlang.org/docs/reference/whatsnew12.html#multiplatform-projects-experimental)。通过它，你可以在\
  \ JVM 和 Javascript 之间共享代码。- 作为一项实验性特性，JetBrains 团队还发布了 [Kotlin/Native](https://kotlinlang.org/docs/reference/native-overview.html)，该项目终于让\
  \ Kotlin 脱离了 JVM。在未来，我们将能够使用 Kotlin 编写大部分代码来实现服务器、Web 以及 Android 和 iOS 应用。此外，你今天就可以尝试它。-\
  \ Gradle 正在添加支持使用 Kotlin Script（Kotlin 的简化版本）来编写 Gradle 文件，而不是 Groovy。该项目正快速接近其\
  \ 1.0 发布。\n\n所以你可以看到，Kotlin 的未来非常有前景。学习 Kotlin 可能会成为许多其他平台的参考语言，而且在所有平台之间共享代码无疑是一个重大的卖点。\n\
  \n### 1.2 我们通过 Kotlin 得到了什么？\n\n在不深入探究 Kotlin 语言的情况下（我们将在整本书中学习关于它的一切），这些是我们在 Java\
  \ 中缺失的一些有趣特性：\n\n#### 表现力\n\n使用 Kotlin，要避免样板代码变得简单得多，因为语言默认涵盖了最常见的模式。例如，在 Java 中，如果我们想创建一个数据类，我们需要编写（或至少生成）以下代码：\n\
  \n```java\n 1 public class Artist {\n 2     private long id;\n 3     private String\
  \ name;\n 4     private String url;\n 5     private String mbid;\n 6  \n 7     public\
  \ long getId() {\n 8         return id;\n 9     }\n10  \n 11     public void setId(long\
  \ id) {\n 12         this.id = id;\n 13     }\n 14  \n 15     public String getName()\
  \ {\n 16         return name;\n 17     }\n 18  \n 19     public void setName(String\
  \ name) {\n 20         this.name = name;\n 21     }\n 22  \n 23     public String\
  \ getUrl() {\n 24         return url;\n 25     }\n 26  \n 27     public void setUrl(String\
  \ url) {\n 28         this.url = url;\n 29     }\n 30  \n 31     public String getMbid()\
  \ {\n 32         return mbid;\n 33     }\n 34  \n 35     public void setMbid(String\
  \ mbid) {\n 36         this.mbid = mbid;\n 37     }\n 38  \n 39     @Override public\
  \ String toString() {\n 40         return \"Artist{\" +\n 41                 \"\
  id=\" + id +\n 42                 \", name='\" + name + '\\'' +\n 43           \
  \      \", url='\" + url + '\\'' +\n 44                 \", mbid='\" + mbid + '\\\
  '' +\n 45                 '}';\n 46     }\n 47 }\n```\n\n使用 Kotlin，你只需要利用数据类：\n\n\
  ```kotlin\n1 data class Artist(\n2     var id: Long,\n3     var name: String,\n\
  4     var url: String,\n5     var mbid: String)\n```\n\n这个数据类会自动生成所有字段和属性访问器，以及一些实用的方法，如\
  \ `toString()`。\n\n#### 空安全\n\n当我们使用 Java 时，我们大量的代码都是防御性的。我们需要在使用某个东西之前检查一次它是否为空，以防止意外错误。Kotlin\
  \ 像许多其他现代语言一样是空安全的，因为类型通过安全调用操作符（写作 `?`）显式地定义了对象是否可以为空。\n\n我们可以像这样操作：\n\n```kotlin\n\
  1 // 这无法编译。Artist 不可以为空\n2 var notNullArtist: Artist = null\n3  \n4 // Artist 可以为空\n\
  5 var artist: Artist? = null\n6  \n7 // 将无法编译，artist 可能为空\n8 artist.print()\n9 \
  \ \n10 // 仅在 artist != null 时打印\n11 artist?.print()\n12  \n13 // 智能转换。如果我们之前检查过空值，那么\
  \ \n14 // 就不需要使用安全调用操作符了\n15 if (artist != null) {\n16     artist.print()\n17 }\n\
  18  \n19 // 仅在在我们确定它不为空时使用它。否则将抛出异常。\n20 artist!!.print()\n21  \n22 // 使用 Elvis\
  \ 操作符在对象为空时提供备选方案。\n23 val name = artist?.name ?: \"empty\"\n```\n\n#### 扩展函数\n\n\
  多亏了扩展函数，你可以为任何类添加新函数。它是我们项目中常见的工具类更整洁的替代方案。例如，你可以为 fragment 添加一个新方法来显示 toast：\n\n\
  ```kotlin\n1 fun Fragment.toast(message: CharSequence, duration: Int = Toast.LENGTH_SHORT)\
  \ {\n2     Toast.makeText(getActivity(), message, duration).show()\n3 }\n```\n\n\
  然后像这样使用它：\n\n```kotlin\n1 fragment.toast(\"Hello world!\")\n```\n\n#### 函数式支持 (Lambdas)\n\
  \n如果我们不需要每次在实现点击监听器时声明一个匿名类，而是只需定义我们想做的事情会怎样？我们确实可以这样做。这（以及许多其他有趣的事情）正是得益于 lambda\
  \ 得到的：\n\n```kotlin\n1 view.setOnClickListener { toast(\"Hello world!\") }\n```\n\
  \n这些特性只是 Kotlin 能够功能的一小部分。现在你已经知道了这种语言的许多优秀特性，你可能会决定这不适合你。如果你继续下去，我们将在下一章立即开始编写代码。\n\
  \n## 2 准备工作\n\n\n\n\n既然你已经了解了一些可以用 Kotlin 实现的简单示例，我相信你想尽快开始付诸实践。别担心；前几个章节将帮助你配置开发环境，让你立即开始编写代码。\n\
  \n### 2.1 Android Studio\n\n你需要的第一件事是安装 Android Studio。如你所知，Android Studio 是 Android\
  \ 的官方 IDE，它于 2013 年作为预览版推出，并于 2014 年正式发布。\n\nAndroid Studio 是 [IntelliJ IDEA](https://www.jetbrains.com/idea)\
  \ 的插件实现的，后者是由 [Jetbrains](https://www.jetbrains.com) 创建的 Java IDE，而这家公司也是 Kotlin\
  \ 的背后主使。所以，正如你看到的，一切都是紧密相连的。\n\nAndroid Studio 的采用是 Android 开发者的一大进步。首先，我们告别了充满\
  \ Bug 的 Eclipse，转而使用了一套专为 Java 开发者设计的工具，这让我们能够与该语言进行深度交互。我们可以享受许多出色的功能，例如快速且令人惊讶的智能代码补全，以及强大的分析和重构工具等。\n\
  \n其次，[Gradle](https://gradle.org/) 成为了 Android 的官方构建系统，这意味着在版本控制、构建和部署方面出现了一系列全新的可能性。两个最令人兴奋的功能是构建类型（build\
  \ types）和变体（flavors），它们让你在使用相同代码库的同时，以一种简单的方式创建无限版本的应用（甚至是不同的应用）。\n\n如果你仍在使用 Eclipse，我恐怕如果你想跟进这本书，就必须切换到\
  \ Android Studio。Kotlin 团队正在为 Eclipse 创建插件，但它可能远落后于 Android Studio 插件，而且集成可能可能没那么顺畅。一旦你开始使用它，你就会发现自己错过了什么。\n\
  \n我没有涵盖 Android Studio 或 Gradle 的使用方法，因为这不是本书的重点。但如果你是第一次使用这些工具，我相信你仍然能够跟上内容，在此期间学习基础知识。\n\
  \n如果你还没有安装，请从[官方页面下载 Android Studio](https://developer.android.com/sdk/index.html)。\n\
  \n### 2.2 安装 Kotlin 插件\n\n自 IntelliJ 15 发布以来，Kotlin 插件已捆绑在 IDE 中。对于 Android Studio，这取决于你使用的版本。\n\
  \n如果你拥有的是 Android Studio 3.0 或更高版本，你已经拥有了所需的一切。如果你的 Android Studio 是 2.3 或更低，你需要手动安装\
  \ Kotlin 插件。\n\n因此，进入 `Android Studio Preferences` 内部插件（plugins）部分，安装 Kotlin 插件。如果找不到，请使用搜索工具。\n\
  \n现在，我们的环境已经准备好理解该语言、编译并执行它，就像我们使用 Java 一样无缝。\n\n## 3 创建新项目\n\n现在是时候开始创建我们的 App\
  \ 了。我特意想让解释保持简单，因为 Android Studio 的向导程序（wizard）会经常变化，这些步骤很快就会过时。\n\n我们的应用由一个简单的天气应用组成，类似于\
  \ [Udacity 上的 Google 初学者课程](https://www.udacity.com/course/android-development-for-beginners--ud837)中使用的那一个。我们将关注不同的点，但该应用的核心思想是相同的，因为它包含了许多你在普通应用中会发现的内容。如果你是刚开始\
  \ Android 开发，我向你推荐这门课程。\n\n### 3.1 在 Android Studio 中创建新项目\n\n同样，根据你所使用的 Android\
  \ Studio 版本，会有细小的差别。\n\n对于 Android Studio 3，步骤非常直观。之前的版本需要多做一点工作，但也远不复杂。即使你已经在使用新版本的\
  \ Android Studio，我也建议你查看一下整个过程，因为如果你想在 Java 项目上开始使用 Kotlin，这就是你需要的操作。\n\n首先，打开 Android\
  \ Studio 并选择 `Create New Project`（创建新项目）。第一步是为你的应用确定名称；你可以使用你喜欢的名称：例如 `WeatherApp`。然后向导程序会询问公司域名（Company\
  \ Domain）。由于你并不发布该应用，这个字段也不太重要，但如果你拥有域名，可以使用它。此外，选择你想要保存项目的位置。\n\n在 Android Studio\
  \ 3 中，在此处，你会发现一个启用 Kotlin 支持的复选框。如果是你的情况，请勾选它。\n\n下一步，向导程序询问最小 API 版本。我为示例应用选择了\
  \ API 15，但 Kotlin 对最小 API 没有任何限制。目前请跳过 `Phone and Tablet` 之外的任何平台。\n\n最后，我们被要求选择一个活动模板。选择\
  \ `Empty Activity`（空活动）。此模板生成的代码很少，便于我们添加新逻辑。\n\n保留下一个屏幕中活动或布局（布局））的名称。如果需要，我们稍后会更改它们。按下\
  \ `Finish`（完成）并让 Android Studio 完成工作。\n\n使用 Android Studio 3，你就完成了，跳到第 3.4 点。接两个步骤仅在你必须手动安装插件时才需要。\n\
  \n### 3.2 将 MainActivity 转换为 Kotlin 代码\n\nKotlin 插件包含的一个有趣功能是可以将 Java 代码转换为 Kotlin\
  \ 代码。作为一个自动化过程，它并不完美，但在你开始习惯 Kotlin 语言的前几天里，它可能会有很大帮助。\n\n因此，我们在 `MainActivity.java`\
  \ 类中使用此功能。打开文件并选择 `Code -> Convert Java File to Kotlin File`（代码 -> 将 Java 文件转换为\
  \ Kotlin 文件）。查看一下差异，以便你开始熟悉这种语言。\n\n你也可以将任何 Java 代码复制到 Kotlin 文件中，插件也会进行转换。\n\n\
  ### 3.3 在项目中配置 Kotlin\n\nKotlin 插件还包含一个工具，可以为我们配置 Gradle 文件。\n\n进入 `Tools -> Project\
  \ -> Configure Kotlin`。选择最新的 Kotlin 版本，并点击 OK。\n\n检查更改。应该如下所示：\n\n```\nbuildscript\
  \ {\n     ext.kotlin_version = '1.2.31'\n     repositories {\n         jcenter()\n\
  \     }\n     dependencies {\n         classpath 'com.android.tools.build:gradle:3.1.0'\n\
  \         classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version\"\
  \n     }\n}\n\nallprojects {\n    repositories {\n        jcenter()\n    }\n}\n\
  ```\nbuild.gradle\n\n你可以看到，它创建一个保存 Kotlin 版本的变量。我们在许多地方都需要该版本号，例如在 Kotlin 插件的新依赖中。\n\
  \n它在模块 `build.gradle` 中再次有用，该配置也添加了 Kotlin 标准库的依赖。现在去检查一下：\n\n```\napply plugin:\
  \ 'com.android.application'\napply plugin: 'kotlin-android'\n\nandroid {\n    ...\n\
  }\n\ndependencies {\n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version\"\
  \n}\n```\napp/build.gradle\n\n### 3.4 引入其他有用配置\n\n我们将使用一些其他额外的库，所以趁此将它们添加到 `build.gradle`\
  \ 中。\n\n一个重要的库是 Anko，它利用 Kotlin 的力量来简化 Android 中的某些任务。我们稍会使用更多 Anko 模块，但目前只需添加 `anko-common`\
  \ 即可。该库被拆分为几个较小的库，以便我们只在项目中包含需要的部分。\n\n\n\n\n\n```\nbuildscript {\n    ext.support_version\
  \ = '27.1.0'\n    ext.kotlin_version = '1.2.31'\n    ext.anko_version = '0.10.4'\n\
  \    repositories {\n        jcenter()\n    }\n    dependencies {\n        classpath\
  \ 'com.android.tools.build:gradle:3.1.0'\n        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version\"\
  \n    }\n}\n\nallprojects {\n    repositories {\n        jcenter()\n        google()\n\
  \    }\n}\n```\n\n`build.gradle`\n\n如果你正在使用 `Android Studio 2.3`，你还需要如上所示添加 Google\
  \ 仓库。`Android Studio 3` 会自动为你完成这一操作。\n\n接下来，我们在模块文件中添加 `Anko` 库依赖，更新 `AppCompat`\
  \ 以使用我们的变量，并应用 `Kotlin Android Extensions` 插件：\n\n```\napply plugin: 'com.android.application'\n\
  apply plugin: 'kotlin-android'\napply plugin: 'kotlin-android-extensions'\n\nandroid\
  \ {\n    ...\n}\n\ndependencies {\n    implementation \"com.android.support:appcompat-v7:$support_version\"\
  \n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version\"\n  \
  \  implementation \"org.jetbrains.anko:anko-common:$anko_version\"\n}\n```\n\n`app/build.gradle`\n\
  \n通过这些更改，我们应该已经准备好开始了。\n\n### 3.5 测试一切是否正常工作\n\n我们将添加一些代码来检查 `Kotlin Android Extensions`\
  \ 是否功能完整。我暂时还不对其进行详细解释，但我想确保它对你来说是可以工作的。\n\n首先，进入 `activity_main.xml` 并为 `TextView`\
  \ 设置一个 id：\n\n```\n<TextView\n    android:id=\"@+id/message\"\n    android:text=\"\
  @string/hello_world\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"/>\n```\n\n`activity_main.xml`\n\n在 `onCreate` 中，尝试为 `TextView` 编写你之前选择的\
  \ id（在本例中为 `message`）：\n\n```\noverride fun onCreate(savedInstanceState: Bundle?)\
  \ {\n    super.onCreate(savedInstanceState)\n    setContentView(R.layout.activity_main)\n\
  \    message.text = \"Hello Kotlin!\"\n}\n```\n\n`MainActivity.kt`\n\n你看到魔法了吗？你不需要查找它或使用第三方库即可访问该视图。`Kotlin\
  \ Android Extensions` 是包含在主 Kotlin 插件中的一个插件，这正是它的主要目的。请耐心等待，很快就会向你展示如何正确使用它。\n\n\
  你还会看到活动中自动添加了一个合成导入（synthetic import），但我们还没有介绍这部分：\n\n```\nimport kotlinx.android.synthetic.main.activity_main.*\n\
  ```\n\n`MainActivity.kt`\n\n得益于 Kotlin 与 Java 的互操作性，我们可以将 Java 库的 setter 和 getter\
  \ 方法作为 Kotlin 中的属性使用。我们稍后也会讨论属性，但请注意我们可以免费地使用 `message.text` 而不是 `message.setText`。编译器使用真实的\
  \ Java 方法，因此在使用时没有性能开销。\n\n现在运行应用并检查一切是否运行正常。检查消息的 `TextView` 是否显示了新内容。如果你有任何疑问或想修改某些代码，请查看\
  \ [Kotlin for Android Developers 仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-3)。当新内容涉及代码修改时，我为每个章节创建了一个分支，因此请务必查看以检查所有更改。\n\
  \n接下来的章节将涵盖你在转换后的 `MainActivity` 中看到的一些新内容。一旦你理解了 Java 和 Kotlin 之间的细微差异，你就可以自己编写新代码而不会有任何困扰。\n\
  \n## 4 类和函数\n\nKotlin 中的类遵循直观的结构。然而，在我们继续之前，你可能想了解它与 Java 的的一些细微差异。你可以使用 [try.kotlinlang.org](http://try.kotlinlang.org/)\
  \ 来测试此以及其他一些简单示例，而不需要真实的项目。\n\n你还可以使用 Kotlin 插件附带的 REPL。你可以在 `Tools -> Kotlin ->\
  \ Kotlin REPL` 中找到它。\n\n### 4.1 如何声明一个类\n\n如果你想声明一个类，只需要使用 `class` 关键字：\n\n```\n\
  class MainActivity {\n    \n}\n```\n\n类有一个唯一的默认构造函数。我们将看到可以为某些特殊情况创建额外的构造函数，但请记住，大多数情况只需要一个构造函数。参数写在名称之后。如果类是空的，则不需要大括号：\n\
  \n```\nclass Person(name: String, surname: String) \n```\n\n那么构造函数的体在哪里？你可以声明一个\
  \ `init` 块：\n\n```\nclass Person(name: String, surname: String) {\n    init {\n\
  \        ...\n    }\n}\n```\n\n### 4.2 类继承\n\n默认情况下，类总是继承自 `Any`（类似于 Java 的 `Object`），但我们可以扩展任何其他类。\n\
  \n```\nclass Animal {\n    open fun makeSound() {\n        println(\"Animal sound\"\
  )\n    }\n}\n\nclass Dog : Animal() {\n    override fun makeSound() {\n        println(\"\
  Bark\")\n    }\n}\n```\n\n### 4.3 函数\n\nKotlin 中的函数使用 `fun` 关键字声明：\n\n```kotlin\n\
  fun sum(a: Int, b: Int): Int {\n    return a + b\n}\n```\n\n`Unit` 类似于 Java 中的 `void`，用于不返回值的函数：\n\
  \n```kotlin\nfun greet(): Unit {\n    println(\"Hello, World!\")\n}\n```\n\n你也可以对简单函数使用表达式语法：\n\
  \n```kotlin\nfun multiply(a: Int, b: Int) = a * b\n```\n\n### 4.4 构造函数和参数\n\nKotlin\
  \ 中的参数与 Java 有不同。你可以直接在主构造函数中定义属性：\n\n```kotlin\nclass User(val name: String, var\
  \ age: Int)\n```\n\n参数的一个方便之处是我们可以通过指定**默认值**让它们变得可选：\n\n```kotlin\nfun toast(message:\
  \ String, length: Int = Toast.LENGTH_SHORT) {\n    Toast.makeText(this, message,\
  \ length).show()\n}\n```\n\n这允许你以不同的方式调用函数：\n\n```\ntoast(\"Hello\")\ntoast(\"Hello\"\
  , Toast.LENGTH_LONG)\n```\n\n还有另一种选择，因为你可以使用**命名参数**，这意味着可以在值之前编写参数名称来指定你想要的哪一个：\n\
  \n```\ntoast(message = \"Hello\", length = Toast.LENGTH_SHORT)\n```\n\n## 5 编写你的第一个类\n\
  \n我们已经有了 `MainActivity.kt` 类。此活动将渲染未来七天的每日预报列表，因此布局需要一些更改。\n\n### 5.1 创建布局\n\n\n\
  \n\n渲染预报列表的主视图将是一个 `RecyclerView`，因此需要一个新的依赖项。修改 `build.gradle` 文件：\n\n```\n1 dependencies\
  \ {\n2     compile fileTree(dir: 'libs', include: ['*.jar'])\n3     compile \"com.android.support:appcompat-v7:$support_version\"\
  \n4     compile \"com.android.support:recyclerview-v7:$support_version\"\n5    \
  \ ...\n6 }\n```\n\n`app/build.gradle`\n\n现在，在 `activity_main.xml` 中：\n\n```\n 1\
  \ <FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\n 2\
  \              android:layout_width=\"match_parent\"\n 3              android:layout_height=\"\
  match_parent\">\n 4 \n5     <android.support.v7.widget.RecyclerView\n 6        \
  \ android:id=\"@+id/forecast_list\"\n 7         android:layout_width=\"match_parent\"\
  \n 8         android:layout_height=\"match_parent\"/>\n 9 \n10 </FrameLayout>\n\
  ```\n\n`activity_main.xml`\n\n在 `MainActivity.kt` 中，删除我们为了测试一切运行正常而添加的那行代码（现在它会显示错误）。目前我们将继续使用传统的\
  \ `findViewById()`：\n\n```\n1 val forecastList = findViewById(R.id.forecast_list)\
  \ as RecyclerView\n2 forecastList.layoutManager = LinearLayoutManager(this)\n```\n\
  \n`MainActivity.kt`\n\n如你所见，我们定义了变量并将其强制转换为 `RecyclerView`。这与 Java 有些不同；我们将在下一章中回顾这些差异。还指定了\
  \ `LayoutManager`，使用了属性命名而不是 setter 方法。对于这种布局，一个列表就足够了，所以让我们使用 `LinearLayoutManager`吧。\n\
  \n### 5.2 回收适配器 (Recycler Adapter)\n\n我们需要为回收器创建一个适配器。我前段时间[在我的博客上讨论过 `RecyclerView`](http://antonioleiva.com/recyclerview/)，如果你不熟悉它，这可能对你有帮助。\n\
  \n目前用于 `RecyclerView` 适配器的视图将只是 `TextView`，以及我们手动创建的简单文本列表。添加名为 `ForecastListAdapter.kt`\
  \ 的新 Kotlin 文件，并包含以下代码：\n\n```\n 1 class ForecastListAdapter(val items: List<String>)\
  \ : \n 2         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 3 \n\
  \ 4     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): \n 5\
  \             ViewHolder {\n 6         return ViewHolder(TextView(parent.context))\n\
  \ 7     }\n 8 \n 9     override fun onBindViewHolder(holder: ViewHolder, position:\
  \ Int) {\n10         holder.textView.text = items[position]\n11     }\n12 \n13 \
  \    override fun getItemCount(): Int = items.size\n14 \n15     class ViewHolder(val\
  \ textView: TextView) : RecyclerView.ViewHolder(textView)\n16 }\n```\n\n`ForecastListAdapter.kt`\n\
  \n同样，我们可以像属性一样访问上下文和文本。你可以照这样做（使用 getter 和 setter），但你会收到编译警告。如果你喜欢继续使用 Java 方法，可以禁用此检查。然而，一旦你习惯了属性，你就永远不会回头了。\n\
  \n如果你检查之前的代码，可能会发现有几处警告。第一个是建议将 `items` 参数设置为私有，因为它只在类内部使用。\n\n```\n1 class ForecastListAdapter(private\
  \ val items: List<String>)\n```\n\n另一个是建议使用表达式体来编写单行函数。在这里也遵循这些建议：\n\n```\n1 override\
  \ fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =\n2         ViewHolder(TextView(parent.context))\n\
  ```\n\n因此，完整的代码如下：\n\n```\n 1 class ForecastListAdapter(private val items: List<String>)\
  \ \n 2     : RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 3 \n 4 \
  \    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =\n 5   \
  \          ViewHolder(TextView(parent.context))\n 6 \n 7     override fun onBindViewHolder(holder:\
  \ ViewHolder, position: Int) {\n 8         holder.textView.text = items[position]\n\
  \ 9     }\n10 \n11     override fun getItemCount(): Int = items.size\n12 \n13  \
  \   class ViewHolder(val textView: TextView) : RecyclerView.ViewHolder(textView)\n\
  14 }\n```\n\n`ForecastListAdapter.kt`\n\n回到 `MainActivity`，让我们创建字符串列表然后创建一个适配器的实例：\n\
  \n```\n 1 private val items = listOf(\n 2     \"Mon 6/23 - Sunny - 31/17\",\n 3\
  \     \"Tue 6/24 - Foggy - 21/8\",\n 4     \"Wed 6/25 - Cloudy - 22/17\",\n 5  \
  \   \"Thurs 6/26 - Rainy - 18/11\",\n 6     \"Fri 6/27 - Foggy - 21/10\",\n 7  \
  \   \"Sat 6/28 - TRAPPED IN WEATHERSTATION - 23/18\",\n 8     \"Sun 6/29 - Sunny\
  \ - 20/7\"\n 9 )\n10 \n11 override fun onCreate(savedInstanceState: Bundle?) {\n\
  12     val forecastList = findViewById(R.id.forecast_list) as RecyclerView\n13 \
  \    forecastList.layoutManager = LinearLayoutManager(this)\n14     forecastList.adapter\
  \ = ForecastListAdapter(items)\n15 }\n```\n\n`MainActivity.kt`\n\n### 6. 变量与属性\n\
  \n### Kotlin 中，**一切都是对象**。它与 Java 有一些不同：\n\n### 6.1 基本类型\n\n数值类型之间没有自动转换。例如，从 `Int`\
  \ 到 `Double`：\n\n```\nval i = 7\nval d = i.toDouble()\n```\n\n*   字符 (`Char`）不能直接作为数字使用。但是，我们可以将其转换为：\n\
  \n```\nval c = 'c'\nval i = c.toInt()\n```\n\n*   位运算 略有不同。在 Android 中，我们使用标志位 `and`\
  \ 和 `or` 作为示例：\n\n```\n// Java\nint bitwiseOr = FLAG1 | FLAG2;\nint bitwiseAnd =\
  \ FLAG1 & FLAG2;\n```\n\n```\n// Kotlin\nval bitwiseOr = FLAG1 or FLAG2\nval bitwiseAnd\
  \ = FLAG1 and FLAG2\n```\n\n*   字面量可以提供其类型信息。这不是强制的，但 Kotlin 的常见做法是省略变量类型，让它从字面量推断：\n\
  \n```\nval i = 12 // 一个 Int\nval iHex = 0x0f // 来自十六进制字面量的 Int\nval l = 3L // 一个\
  \ Long\nval d = 3.5 // 一个 Double\nval f = 3.5F // 一个 Float\n```\n\n*   `String`\
  \ 可以像数组一样被访问并进行遍历：\n\n```\nval s = \"Example\"\nval c = s[2] // 这是字符 'a'\n\n// 遍历字符串\n\
  val s = \"Example\"\nfor (c in s) {\n    print(c)\n}\n```\n\n### 6.2 不可变性\n\n在 Kotlin\
  \ 中，变量可以很容易地定义为可变的 (`var`) 或不可变的 (`val`)。这种想法与 Java 变量中使用 `final` 非常相似。\n\n不可变对象是在实例化后状态无法更改的对象。如果你需要修改后的版本，你需要创建一个新对象。不可变性使得软件更加健壮且可预测。在\
  \ Java 中，绝大多数对象都是可变的，这意味着访问该对象的任何部分都可以修改它，从而影响应用程序的其他部分。\n\n不可变对象从定义上就是线程安全的。因为值是常量，所有线程始终获取相同的对象。\n\
  \n\n\n因此，如果我们想利用不可变性，我们在 Kotlin 中思考代码的方式会发生一些微变化。核心概念是：尽可能多使用 `val`。在某些情况下（特别是在\
  \ Android 中，某些类的构造函数是由系统调用的），不可变性变得很难实现，但大多数情况下它是可以实现的。\n\n之前提到的另一点是，我们通常可以避免指定对象类型，编译器会从值中推断，这使得代码更整洁，修改也更快。我们在上面的章节中已经有了一些示例。\n\
  \n```\n1 val s = \"Example\" // 一个 String\n2 val i = 23 // 一个 Int\n3 val actionBar\
  \ = supportActionBar // Activity 上下文中的一个 ActionBar\n```\n\n然而，如果我们想使用更通用的类型，则需要指定类型：\n\
  \n```\n1 val a: Any = 23\n2 val c: Context = activity\n```\n\n### 6.3 属性 (Properties)\n\
  \n属性等于 Java 中的字段（fields），但要强大得多。属性实现了字段加上 getter（get 器）和 setter（赋值）。让我们来看一个示例来对比差异。以下代码段显示了\
  \ Java 中安全访问和修改字段所需的代码：\n\n```\n 1 public class Person {\n 2 \n3     private String\
  \ name;\n 4 \n 5     public String getName() {\n 6         return name;\n 7    \
  \ }\n 8 \n 9     public void setName(String name) {\n10         this.name = name;\n\
  11     }\n12 }\n13 \n14 ...\n15 \n16 Person person = new Person();\n17 person.setName(\"\
  name\");\n18 String name = person.getName();\n```\n\n在 Kotlin 中，你只需要一个属性就能实现相同的行为：\n\
  \n```\n 1 class Person {\n 2     \n 3     var name: String = \"\"\n 4         \n\
  \ 5 }\n 6 \n 7 ...\n 8  9 val person = Person()\n10 person.name = \"name\"\n11 val\
  \ name = person.name\n```\n\n如果没有指定，属性将使用默认的 getter 和 setter。当然，可以它可以运行所需的任何自定义行为，而无需更改现有代码：\n\
  \n```\n1 class Person {\n2 \n3     var name: String = \"\"\n4         get() = field.toUpperCase()\n\
  5         set(value) {\n6             field = \"Name: $value\"\n7         }\n8 \n\
  9 }\n```\n\n如果属性在自定义 getter 或 setter 中需要访问其值（如本例所示），则需要创建一个后台字段（backing field）。可以使用保留字\
  \ `field` 来访问它，当编译器发现需要它时，它会自动创建。请注意，如果我们直接使用属性，我们将使用 setter 和 getter，而不是进行直接赋值。你只能在属性的访问器内部使用后台字段。\n\
  \n正如在之前的某些章节中提到的，当处理用 Java 编写的代码时，Kotlin 允许在 Java 定义了 getter 以及可选的 setter 的地方使用属性语法。编译器只需链接到原始的\
  \ getter 和 setter，因此在使用这些映射属性时没有性能开销。\n\n## 7 Anko 和扩展函数 (Extension Functions)\n\
  \nKotlin 团队开发了一些很棒的工具来让 Android 开发变得更容易。在本章中，我将向你介绍它们以及你如何开始使用它们。\n\n### 7.1 什么是\
  \ Anko？\n\n[Anko](https://github.com/JetBrains/anko) 是由 JetBrains 开发的一个健壮的库。它的主要目的是通过使用代码而不是\
  \ XML 来生成 UI 布局。这个功能非常有趣；如果有机会，请尝试一下，但我不会在这个项目中使用它。对我来说（可能由于多年编写用户界面的经验）使用 XML 更加舒服，但你可能会有不同的想法。\n\
  \n然而，这并不是我们从这个库中可以获得的唯一功能。Anko 包含了许多有用的函数和属性，可以避免大量的样板代码。本书中涵盖了几个示例，但你很快就会看到这个库解决了哪种的问题。\n\
  \n由于 Anko 是一个专门为 Android 编写的库，理解它在背后做了什么是一个很好的练习。你可以随时使用 `ctrl + click`（Windows\
  \ 或 Linux）或 `cmd + click`（Mac） 导航到 Anko 的源码。Anko 的实现是学习如何充分利用 Kotlin 语言有用方法的极佳示例。\n\
  \n### 7.2 开始使用 Anko\n\n在继续之前，让我们使用 Anko 来改进几点。正如你将看到的，每当你使用 Anko 的任何东西时，它都会在文件中包含一个带有该属性或函数名称的导入。Anko\
  \ 使用扩展函数为 Android 框架添加新功能，并且导入会链接到它们。我们将在正下方看到扩展函数是什么以及如何编写它。\n\n在 `MainActivity::onCreate`\
  \ 中，可以使用 Anko 扩展函数代替 `findViewById` 来查找 `RecyclerView`。自 API 26 以来，这不再是必要的，因为 `findViewById`\
  \ 现在是泛型的，但它仍然可以作为一个示例：\n\n```\n1 val forecastList: RecyclerView = find(R.id.forecast_list)\
  \ \n```\nactivities/MainActivity.kt\n\n看看导入部分，你会发现 `find` 函数被添加到了那里：\n\n```\n1 import\
  \ org.jetbrains.anko.find\n```\n\n这些是我们目前能从库库使用的所有内容，但 Anko 可以帮助我们简化，包括 Intent 的实例化、Activity\
  \ 之间的导航、Fragment 的创建、数据库访问或警框的构建。我们将在实现应用时看到。\n\n### 7.3 扩展函数\n\n正如在之前的章节中提到的，当处理\
  \ Java 编写的代码时，Kotlin 允许在 Java 定义了 getter 以及可选 setter 的地方使用属性语法。编译器只需链接到原始的 getter\
  \ 和 setter，因此在使用这些映射属性时没有性能惩罚。扩展函数是为类添加新行为的函数，即使我们无法访问其源代码。在 Java 中，我们通常在包含静态方法的工具类中实现它们。在\
  \ Kotlin 中使用扩展函数的优势是我们不需要将对象作为参数传递。扩展函数就像是类的一部分，我们可以通过 `this` 来实现它。\n\n例如，我们可以创建一个\
  \ `toast` 函数，它可以被任何 `Context` 以及继承自 `Context` 的类型（如 Activity 或 Service）使用：\n\n```\n\
  1 fun Context.toast(message: CharSequence, duration: Int = Toast.LENGTH_SHORT) {\n\
  2     Toast.makeText(this, message, duration).show()\n3 }\n```\n\n现在你可以在 activity\
  \ 中使用这个扩展，例如：\n\n```\n1 toast(\"Hello world!\")\n2 toast(\"Hello world!\", Toast.LENGTH_LONG)\n\
  ```\n\n当然，Anko 已经包含了自己的自己的扩展函数，与这个非常相似。库提供了针对 `CharSequence` 和资源的函数，以及针对短长 toast\
  \ 的不同名称：\n\n```\n1 toast(\"Hello world!\")\n2 longToast(R.string.hello_world)\n\
  ```\n\n扩展也可以是属性。因此你可以以非常的方式创建扩展属性。得益于下面的代码，你可以为 `ViewGroup` 添加一个额外的属性来获取其子视图列表：\n\
  \n```\n1 val ViewGroup.childViews: List<View>\n2     get() = (0 until childCount).map\
  \ { getChildAt(it) }\n```\n\n先不要太关注实现，因为我们仍然需要涵盖这里的一些概念。扩展函数并没有修改原始类。你可能会发现在使用它的文件中添加了静态导入。你可以在任何地方声明扩展函数，因此常见的做法是创建包含一组相关函数的文件。扩展函数是许多\
  \ Anko 功能背后的魔法。从现在起，你也可以创建自己的魔法了。\n\n本章没有太大变化；[你可以在这里找到源码](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-7)。\n\
  \n\n\n\n我们目前的占位符文本是了解我们想要目标的绝佳起点，但现在是时候请求真实数据了，这将用于填充 `RecyclerView`。我们将利用 [OpenWeatherMap](http://openweathermap.org/)\
  \ API 来获取数据，并使用一些普通类处理请求。由于 Kotlin 互操作非常强大，你可以使用任何需要的库，例如 [Retrofit](https://github.com/square/retrofit)\
  \ 来进行服务器请求。然而，由于我们只是执行一个简单的 API 请求，无需添加另一个第三方库就可以更轻松地实现目标。\n\n此外，正如你所看到的，Kotlin\
  \ 提供了了一些扩展函数，让请求变得简单得多。首先，我们将创建一个新的 `Request` 类：\n\n```\n1 class Request(private\
  \ val url: String) {\n2 \n3     fun run() {\n4         val forecastJsonStr = URL(url).readText()\n\
  5         Log.d(javaClass.simpleName, forecastJsonStr)\n6     }\n7 \n8 }\n```\n\n\
  `data/Request.kt`\n\n构造函数接收一个 URL。然后 `run` 函数读取结果并将 JSON 输出到 Logcat 中。\n\n使用 `readText`（Kotlin\
  \ 标准库中的一个扩展函数）时实现非常直观。这种方法不建议用于大型响应，但在我们的情况下已经足够了。\n\n如果你将此代码与 Java 中需要的代码进行比较，你会发现通过使用标准库我们节省了大量的开销。为了获得相同的结果，需要\
  \ `HttpURLConnection`、`BufferedReader` 以及对结果进行迭代，此外还需要管理连接和读取器的状态。显然，这就是该函数在后台执行的工作，但我们免费获得了。\n\
  \n为了能够执行请求，App 必须使用 Internet 权限。因此，必须将其添加到 `AndroidManifest.xml` 中：\n\n```\n1 <uses-permission\
  \ android:name=\"android.permission.INTERNET\" />\n```\n\n`AndroidManifest.xml`\n\
  \n## 8.2 在主线程之外执行请求\n\n正如你所知的，主线程不允许 HTTP 请求，否则 App 将抛出异常。这种限制防止了阻塞 UI 线程，这是一种坏做法。Android\
  \ 的标准解决方案是使用 `AsyncTask`。然而，这些类非常糟糕，而且很难在没有副作用的情况下实现。如果不小心使用 `AsyncTask` 是危险的，因为当到达\
  \ `postExecute` 时，系统可能已经销了 activity，导致任务崩溃。\n\nAnko 提供了一个非常简单的 DSL 来处理异步操作，符合大多数基本需求。它提供了一个\
  \ `doAsync` 函数，在另一个线程中执行其代码，并可以选择调用 `uiThread` 返回主线程。在辅助线程中执行请求就像这样：\n\n```\n1 val\
  \ url = \"http://api.openweathermap.org/data/2.5/forecast/daily?\" +\n         \
  \        \"APPID=15646a06818f61f7b8d7823ca833e1ce&zip=94043&mode=json&units=met\\\
  \n3 ric&cnt=7\"\n4 \n5 doAsync() {\n6     Request(url).run()\n7     uiThread { longToast(\"\
  Request performed\") }\n8 }\n```\n\n`activities/MainActivity.kt`\n\n你可以从[课程的仓库分支](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-8)\
  \ 获取本课程所需的 url。\n\n`uiThread` 的美妙之处在于它根据调用者对象有不同的实现。当 `Activity` 使用它时，如果 `activity.isFinishing()`\
  \ 返回 `true`，则 `uiThread` 代码将不会执行，如果 activity 不再有效，它也不会崩溃。\n\n你也可以使用自己的执行器：\n\n```\n\
  1 val executor = Executors.newScheduledThreadPool(4)\n2 doAsync(executor) {\n3 \
  \    // Some task\n4 }\n```\n\n`doAsync` 返回一个 Java `Future`，以防你想处理 future。如果你需要它返回一个带有结果的\
  \ `Future`，可以使用 `doAsyncResult`。\n\n它比 `AsyncTask` 简单且易读。目前，我只是向请求发送了一个静态 URL，以测试我们是否能正确接收内容。\n\
  \n## 9 数据类\n\n数据类是一种功能强大的类，通常提供 getter 和 setter。定义数据类非常简单，连同字段也是：\n\n```kotlin\n\
  1 data class Forecast(val date: Date, val temperature: Float, val details: String)\n\
  ```\n\n### 9.1 额外函数\n\n除了数据类，我们还免费获得了一些新函数：\n\n*   `equals()`：它比较两个对象。\n*   `hashCode()`：我们获得一个哈希码。\n\
  *   `copy()`：你可以复制一个对象并修改一个或多个属性。\n\n### 9.2 复制数据类\n\n如果我们像在某些章节中讨论的那样使用不可变性，则需要一个新的实例。例如，如果我们需要更改温度，只需这样做：\n\
  \n```kotlin\n1 val f1 = Forecast(27.5f, \"Shiny day\")\n2 val f2 = f1.copy(temperature\
  \ = 30f)\n```\n\n通过这样，我们复制了第一个预测并仅修改了温度。\n\n### 9.3 将对象映射到变量\n\n这个过程被称为解构（destructuring），由将对象内部每个属性映射到一个变量组成。这就是为什么会自动创建\
  \ `componentX` 函数。使用之前的 `Forecast` 类的示例：\n\n```kotlin\n1 val f1 = Forecast(Date(),\
  \ 27.5f, \"Shiny day\")\n2 val (date, temperature, details) = f1\n```\n\n这种多声明被编译为以下代码：\n\
  \n```kotlin\n1 val date = f1.component1()\n2 val temperature = f1.component2()\n\
  3 val details = f1.component3()\n```\n\n该功能背后的逻辑非常强大，可以在许多情况下帮助简化代码。例如，`Map` 类实现了一些扩展函数，允许在迭代中恢复其键和值：\n\
  \n```\n1 for ((key, value) in map) {\n2     Log.d(\"map\", \"key:$key, value:$value\"\
  )\n3 }\n```\n\n## 10 解析数据\n\n现在我们已经知道如何创建数据类，已经准备好开始解析数据了。在 `data` 包中，创建一个名为 `ResponseClasses.kt`\
  \ 的新文件。如果你在浏览器中打开我们在第 8 章中使用的 URL，就可以看到 JSON 文件的结构。它由一个包含城市和预测列表的对象组成。城市包含 ID、名称、坐标以及它所属的国家。每个预测都带有一组良好的信息，如日期、不同的温度以及一个包含描述和用于图标的\
  \ ID 的天气对象。\n\n### 10.1 将 JSON 转换为数据类\n\n在我们目前的 UI 中，我们不会使用所有这些数据。然而，我们将所有内容都解析为类，以防将来有用。这些是我们需要的数据类：\n\
  \n\n\n\n\n```kotlin\ndata class ForecastResult(val city: City, val list: List<Forecast>)\n\
  data class City(val id: Long, val name: String, val coord: Coordinates,\n      \
  \          val country: String, val population: Int)\ndata class Coordinates(val\
  \ lon: Float, val lat: Float)\ndata class Forecast(val dt: Long, val temp: Temperature,\
  \ val pressure: Float,\n                    val humidity: Int, val weather: List<Weather>,\n\
  \                    val speed: Float, val deg: Int, val clouds: Int,\n        \
  \            val rain: Float)\ndata class Temperature(val day: Float, val min: Float,\
  \ val max: Float,\n                       val night: Float, val eve: Float, val\
  \ morn: Float)\ndata class Weather(val id: Long, val main: String, val description:\
  \ String,\n                   icon: String)\n```\n`data/ResponseClasses.kt`\n\n\
  由于我们使用 [Gson](https://github.com/google/gson) 来将 JSON 解析到我们的类中，属性名称必须与 JSON 中的名称一致，或者指定一个序列化名称。大多数软件架构中解释的一种良好实践是为应用的不同层使用不同的模型，以便将它们解耦。因此，我倾向于简化这些类的声明，因为会在它们用于应用的其他部分之前对其进行转换。此类中使用的属性名称与\
  \ JSON 响应中的名称相同。\n\n现在，`Request` 类需要一些修改以返回解析后的结果。它只接收城市的 `zipcode` 而不是完整的 URL，这样更具可读性。目前，静态\
  \ URL 定义在 `companion object` 中。\n\n检查结果生成的代码：\n\n```kotlin\nclass ForecastRequest(private\
  \ val zipCode: String) {\n    companion object {\n        private const val APP_ID\
  \ = \"15646a06818f61f7b8d7823ca833e1ce\"\n        private const val URL = \"http://api.openweathermap.org/data/2.5/\"\
  \ +\n                \"forecast/daily?mode=json&units=metric&cnt=7\"\n        private\
  \ const val COMPLETE_URL = \"$URL&APPID=$APP_ID&zip=\"\n    }\n\n    fun execute():\
  \ ForecastResult {\n        val forecastJsonStr = URL(COMPLETE_URL + zipCode).readText()\n\
  \        return Gson().fromJson(forecastJsonStr, ForecastResult::class.java)\n \
  \   }\n}\n```\n`data/ForecastRequest.kt`\n\n记得你需要将 Gson 库添加到 `build.gradle` 依赖中：\n\
  \n```gradle\ncompile \"com.google.code.gson:gson:2.8.1\"\n```\n`app/build.gradle`\n\
  \n### 10.2 构建领域模型层\n\n现在，让我们创建一个代表 `domain` 层的新包。它包含了一些负责执行应用用例的 `Command`。\n\n\
  首先，需要定义 `Command`。在下面的示例中有一个泛型声明。我们将在后续章节中讨论这个主题。\n\n```kotlin\npublic interface\
  \ Command<out T> {\n    fun execute(): T\n}\n```\n`domain/commands/Command.kt`\n\
  \n这些命令执行一个操作并返回其泛型类型中指定的类对象。记住 Kotlin 中的每个函数都会返回一个值。默认情况下，如果没有指定，它将返回 `Unit` 类的对象。因此，如果我们想让\
  \ `Command` 返回任何内容，可以指定 `Unit` 为其类型。\n\nKotlin 中的接口比 Java（Java 8 之前）更强大，因为它们可以包含代码。然而，目前我们不需要该功能。\n\
  \n第一个命令需要向 API 请求天气预报并将其转换为领域类。这是领域类的定义：\n\n```kotlin\ndata class ForecastList(val\
  \ city: String, val country: String, \n                        val dailyForecast:List<Forecast>)\n\
  \ndata class Forecast(val date: String, val description: String, val high: Int,\
  \ \n                    val low: Int)\n```\n`domain/model/DomainClasses.kt`\n\n\
  当我们以后添加更多功能时，这些类可能需要重新进行审查。目前，它们保留的数据已经足够。\n\n类必须从数据层映射到领域模型，因此接下来的任务将是创建一个 `DataMapper`：\n\
  \n```kotlin\nclass ForecastDataMapper {\n    fun convertFromDataModel(forecast:\
  \ ForecastResult): ForecastList =\n        ForecastList(forecast.city.name, forecast.city.country,\
  \ \n            convertForecastListToDomain(forecast.list))\n\n    private fun convertForecastListToDomain(list:\
  \ List<Forecast>)\n            : List<ModelForecast> {\n        return list.mapIndexed\
  \ { i, forecast ->\n            val dt = Calendar.getInstance().timeInMillis + \n\
  \                TimeUnit.DAYS.toMillis(i.toLong())\n            convertForecastItemToDomain(forecast.copy(dt\
  \ = dt)) \n        }\n    }\n\n    private fun convertForecastItemToDomain(forecast:\
  \ Forecast): ModelForecast {\n        // 实现细节\n    }\n\n    private fun convertDate(date:\
  \ Long): String {\n        val df = DateFormat.getDateInstance(DateFormat.MEDIUM,\
  \ Locale.getDefault())\n        return df.format(date)\n    }\n}\n```\n`domain/mappers/ForecastDataMapper.kt`\n\
  \n### 10.3 在 UI 中绘制数据\n\n`MainActivity` 代码发生了一点变化，因为现在我们有真实数据来填充适配器。异步调用需要重写：\n\n\
  ```kotlin\ndoAsync() {\n    val result = RequestForecastCommand(\"94043\").execute()\n\
  \    uiThread {\n        forecastList.adapter = ForecastListAdapter(result)\n  \
  \  }\n}\n```\n`ui/activities/MainActivity.kt`\n\n适配器也需要一些修改：\n\n```kotlin\nclass\
  \ ForecastListAdapter(private val weekForecast: ForecastList) : \n        RecyclerView.Adapter<ForecastListAdapter.ViewHolder>()\
  \ {\n\n    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder\
  \ {\n        return ViewHolder(TextView(parent.getContext()))\n    }\n\n    override\
  \ fun onBindViewHolder(holder: ViewHolder, position: Int) {\n        with(weekForecast.dailyForecast[position])\
  \ {\n            holder.textView.text = \"$date - $description - $high/$low\"\n\
  \        }\n    }\n\n    override fun getItemCount(): Int = weekForecast.dailyForecast.size\n\
  \n    class ViewHolder(val textView: TextView) : RecyclerView.ViewHolder(textView)\n\
  }\n```\n\n\n\n\n\n`ui/adapters/ForecastListAdapter.kt`\n\n本章包含一些新代码，欢迎随时在[仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-10)中查看。\n\
  \n## 11 运算符重载\n\nKotlin 允许我们在任何类中使用一组固定数量的符号运算符。这些符号映射到特定的函数，而该函数提供了运算符所使用的逻辑。通过重载这些运算符，可以提高你代码的可读性和简洁性。\n\
  \n若要通知编译器你想要重载某个运算符，必须使用 `operator` 饰符对函数进行标记。\n\n### 11.1 运算符列表\n\n在这里，你可以看到一组表格，其中包含一个运算符及其对应的函数。必须实现一个同名的函数，才能在特定类中启用该运算符的使用。\n\
  \n#### 一元操作\n\n| `+a` | `a.unaryPlus()` |\n| :--- | :--- |\n| `-a` | `a.unaryMinus()`\
  \ |\n| `!a` | `a.not()` |\n| `a++` | `a.inc()` |\n| `a–` | `a.dec()` |\n\n#### 二元操作\n\
  \n| `a + b` | `a.plus(b)` |\n| :--- | :--- |\n| `a - b` | `a.minus(b)` |\n| `a *\
  \ b` | `a.times(b)` |\n| `a / b` | `a.div(b)` |\n| `a % b` | `a.mod(b)` |\n| `a..b`\
  \ | `a.rangeTo(b)` |\n| `a in b` | `b.contains(a)` |\n| `a !in b` | `!b.contains(a)`\
  \ |\n| `a += b` | `a.plusAssign(b)` |\n| `a -= b` | `a.minusAssign(b)` |\n| `a *=\
  \ b` | `a.timesAssign(b)` |\n| `a /= b` | `a.divAssign(b)` |\n| `a %= b` | `a.modAssign(b)`\
  \ |\n\n#### 数组类操作\n\n| `a[i]` | `a.get(i)` |\n| :--- | :--- |\n| `a[i, j]` | `a.get(i,\
  \ j)` |\n| `a[i_1, …, i_n]` | `a.get(i_1, …, i_n)` |\n| `a[i] = b` | `a.set(i, b)`\
  \ |\n| `a[i, j] = b` | `a.set(i, j, b)` |\n| `a[i_1, …, i_n] = b` | `a.set(i_1,\
  \ …, i_n, b)` |\n\n#### 等于操作\n\n| `a == b` | `a?.equals(b) ?: b === null` |\n| :---\
  \ | :--- |\n| `a != b` | `!(a?.equals(b) ?: b === null)` |\n\n`equals` 操作稍有不同，因为它们使用了更复杂的转换来执行正确的等性检查，并且它们期望精确的函数规范，而不仅仅是特定的名称。函数必须按照如下方式实现：\n\
  \n```\n1 operator fun equals(other: Any?): Boolean\n```\n\n运算符 `===` 和 `!==` 执行身份检查（它们在\
  \ Java 中分别对应 `==` 和 `!=`）且不能重载。\n\n#### 函数调用\n\n| `a(i)` | `a.invoke(i)` |\n| :---\
  \ | :--- |\n| `a(i, j)` | `a.invoke(i, j)` |\n| `a(i_1, …, i_n)` | `a.invoke(i_1,\
  \ …, i_n)` |\n\n### 11.2 示例\n\n正如你所想象的，Kotlin 列表在标准库中实现了数组类操作，因此我们可以像访问 Java 数组一样访问列表项。但功能不止于此：在可变列表中，你还可以使用相同的运算符为某个位置赋值：\n\
  \n```\n1 val x = myList[2]\n2 myList[2] = 4\n```\n\n如果你还记得的话，我们有一个名为 `ForecastList`\
  \ 的数据类，它由一个包含一些额外信息的列表组成。直接访问它的项，而不是请求其内部列表来获取项，将会很有趣。顺便提一下，我还将实现一个 `size` 属性，这会进一步简化当前的适配器：\n\
  \n```\n1 data class ForecastList(val city: String, val country: String, \n2    \
  \ private val dailyForecast: List<Forecast>) {\n3     \n4     val size: Int\n5 \
  \    get() = dailyForecast.size\n6 \n7     operator fun get(position: Int): Forecast\
  \ = dailyForecast[position]\n8 }\n```\n\n`domain/model/DomainClasses.kt`\n\n这让我们的\
  \ `onBindViewHolder` 变得简单了一些：\n\n```\n1 override fun onBindViewHolder(holder: ViewHolder,\
  \ position: Int) {\n2     with(weekForecast[position]) {\n3         holder.textView.text\
  \ = \"$date - $description - $high/$low\"\n4     }\n5 }\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\
  \n以及 `getItemCount()` 函数：\n\n```\n1 override fun getItemCount(): Int = weekForecast.size\n\
  ```\n\n`ui/adapters/ForecastListAdapter.kt`\n\n### 11.3 扩展函数\n\n除了类类，我们还可以为第三方库的类提供扩展操作。例如，我们可以像访问列表一样访问\
  \ `ViewGroup`：\n\n```kotlin\n1 operator fun ViewGroup.get(position: Int): View\n\
  ```\n\n现在通过位置获取 `ViewGroup` 视图变得非常简单：\n\n## 12 制作布局\n\n布局需要一些工作才能准备就。首先是创建一个显示图标、日期、最高和最低温度的布局。对于\
  \ `forecast`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\n\
