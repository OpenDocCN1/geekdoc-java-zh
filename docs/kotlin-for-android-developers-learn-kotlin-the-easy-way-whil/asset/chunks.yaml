    ![](images/title_page.png)


    ![Kotlin for Android Developers](images/title_page.png)


    # Kotlin for Android Developers


    ### Learn Kotlin the easy way while developing an Android App


    #### Antonio Leiva


    This book is for sale at [http://leanpub.com/kotlin-for-android-developers](http://leanpub.com/kotlin-for-android-developers)


    This version was published on 2018-04-05.


    ![publisher''s logo](images/leanpub-logo.png)


    This is a [Leanpub](http://leanpub.com) book. Leanpub empowers authors and publishers
    with the Lean Publishing process. [Lean Publishing](http://leanpub.com/manifesto)
    is the act of publishing an in-progress ebook using lightweight tools and many
    iterations to get reader feedback, pivot until you have the right book and build
    traction once you do.


    © 2015 - 2018 Antonio Leiva


    This book is dedicated to all the loyal readers of [antonioleiva.com](http://antonioleiva.com),
    who made me believe that writing about Android development was a powerful tool
    to help others learn about it. I felt that this book was a necessary step forward.


    Special mention goes to [Luis Herrero](https://twitter.com/luishj), who designed
    the excellent cover of this book, and to [Gautier Mechling](http://twitter.com/Nilhcem)
    for helping me so much by reviewing this book. It is thanks to him that these
    pages are not full of typos and mistakes.


    And, of course, this is specially dedicated to you. With your support and your
    help, this book is growing and becoming a reference. So any suggestions to improve
    the quality of this book will be welcomed. Feel free to write anytime to [contact@antonioleiva.com](mailto:contact@antonioleiva.com).


    ## Table of Contents


    ## Guide


    1. [BeginReading](#chap00.xhtml)


    ## I. About this book


    Hey! Thanks so much for your interest in this book, I am thrilled that you decided
    to become a Kotlin for Android expert.


    Many things have happened since I started writing “Kotlin for Android Developers”
    in mid-2015. At that point, Kotlin was still in an early access edition. However,
    I felt so much power in the language, that I decided to explain everything that
    I was learning in a book.


    Since then, the language has kept growing to the point that Google announced that
    they would start supporting Kotlin as an official language to develop Android
    apps.


    These were amazing news. But it was even more amazing that both Google and JetBrains
    suggested this book to Android developers who want to learn the language.


    As you may know, this is a lean publication. This book grew and progressed thanks
    to the readers’ comments. So I can only thank you for helping me bring this dream
    to life.


    ### What is “Kotlin for Android Developers” about


    Throughout this book, I create an Android app from the ground up using Kotlin
    as the primary language. The idea is to learn the language by example, instead
    of following a regular reference book structure. I will be stopping to explain
    the most useful concepts and ideas about Kotlin, comparing them to `Java 6`. This
    way, you can see what the differences are and which parts of the language can
    help you speed up your work.


    This book is not meant to be a language reference, but a tool for Android developers
    to learn Kotlin and be able to continue with their projects by themselves. The
    examples are meant to overcome the most recurring problems we have to face in
    our daily lives as app developers, by making use of Kotlin’s expressiveness and
    some other exciting tools and libraries. However, this text covers most of the
    features of Kotlin, so by the end of the reading, you will have an in-depth knowledge
    of the language.


    The content is very practical, so I recommend that you follow the examples and
    the code in front of a computer and try everything it suggests. You could, however,
    take one first read to get a broad idea and then dive into practice.


    Even though this book now finished, I will review it from time to time to keep
    it up to date with new Kotlin versions. So feel free to write and tell me what
    you think about the book, or what could be improved. I want this book to be the
    perfect tool for Android developers, and as such, help and ideas will be welcomed.


    If you are reading a printed copy and want to receive the latest updates, please
    feel free to email me at `contact@antonioleiva.com` with a proof of purchase,
    and I will give you access to the digital copy. That way, you will keep receiving
    the updates. Do the same if you got it from any bookstores (Kindle, Kobo…) and
    you want to get access to the PDF version.


    Thanks for becoming part of this exciting project!


    ## II. Is this book for you?


    This book is written to be useful to Android developers who are interested in
    learning the Kotlin language.


    This book is for you if you are in some of the following situations:


    *   You have some basic knowledge of Android Development and the Android SDK,
    as well as the Java language.

    *   You want to learn how to develop Android apps using Kotlin by following an
    example.

    *   You need a guide on how to solve many of the common challenges Android developers
    face every day, by using a cleaner and more expressive language.


    On the other hand, this book may not be for you. These are the topics that you
    will not find:


    *   The content of these pages is not a Kotlin Bible. I shall explain all basics,
    and even complicated ideas when they come out. So you may learn by example and
    not the way.

    *   I will not explain how to develop an Android app. You do not need a deep understanding
    of the platform, but at least some basics, such as Android Studio, `Gradle`, and
    `Java` programming.

    *   The book is not a guide to functional programming. Of course, `Java 6` is
    not functional at all.


    ## III. About the author


    Antonio Leiva is an Android Engineer who spends time learning about new ways to
    get the most of Android and then writes about it. He writes a blog at [antonioleiva.com](http://antonioleiva.com),
    focused on helping Android developers learn Kotlin.


    He also leads intensive workshops, where the attendants put all the content from
    this book into practice. In 10 hours, people steps from no knowledge to being
    able to create their apps from scratch.


    Antonio started as a consultant in CRM technologies, but after some time, looking
    for his real passion, he discovered the Android platform. After getting some experience,
    he started a new adventure at a mobile company, where he led several projects
    for well-known companies.


    He currently works as an Android Engineer at [Plex](http://plex.tv), where he
    also plays an essential role in the design and UX of the Android applications.


    You can find Antonio on Twitter as [@lime_cl](https://twitter.com/lime_cl) or
    Google+ as `+AntonioLeivaGordillo`.


    ## 1 Introduction


    Things are changing for good for Android Developers. In Google I/O 2017, the Android
    team announced that Kotlin was becoming an official language to develop Android
    apps.


    This means that, while it is still possible to develop Android apps using `Java`,
    from now on Kotlin is fully supported, and Google is making sure that every new
    Android feature, the framework, the IDE and all their libraries work seamlessly
    with the new language.


    Google listened to the community, who was asking for years that Kotlin became
    a first-party language. So you can now take advantage of all the features of a
    modern language while developing for Android.


    Throughout this book, I will show you how, so I hope that I can help you understand
    the various ways that Kotlin can take you one step ahead and make your code much
    better.

    '
