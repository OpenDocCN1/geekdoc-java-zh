    \n### 26.3 Generic preference delegate\n\nNow that we are generics experts, why\
    \ not extending `LongPreference` to be used with any type that Shared Preferences\
    \ support? Let’s create a new `Preference` delegate:\n\n```kotlin\n 1 class Preference<T>(private\
    \ val context: Context, private val name: String, \n 2     private val default:\
    \ T) {\n 3 \n 4     private val prefs by lazy { \n 5         context.getSharedPreferences(\"\
    default\", Context.MODE_PRIVATE) \n 6     }\n 7 \n 8     operator fun getValue(thisRef:\
    \ Any?, property: KProperty<*>): T =\n 9         findPreference(name, default)\n\
    10 \n11     operator fun setValue(thisRef: Any?, property: KProperty<*>, value:\
    \ T) {\n12         putPreference(name, value)\n13     }\n14     ...\n15   }\n\
    ```\n\n`extensions/DelegatesExtensions.kt`\n\nThis preference is very similar\
    \ to what we had before. We just substituted the `Long` references with a generic\
    \ type `T`, and called to a couple of functions that do the hard work. These functions\
    \ are very simple, though a bit repetitive. They check the type and use the specific\
    \ method from preferences. For instance, the `findPreference` function looks like\
    \ this:\n\n```kotlin\n 1 private fun findPreference(name: String, default: T):\
    \ T = with(prefs) {\n 2     val res: Any = when (default) {\n 3         is Long\
    \ -> getLong(name, default)\n 4         is String -> getString(name, default)\n\
    \ 5         is Int -> getInt(name, default)\n 6         is Boolean -> getBoolean(name,\
    \ default)\n 7         is Float -> getFloat(name, default)\n 8         else ->\
    \ throw IllegalArgumentException(\n 9             \"This type can't be saved into\
    \ Preferences\")\n10     }\n 11 \n12     res as T\n13 }\n```\n\n`extensions/DelegatesExtensions.kt`\n\
    \nAnd basically the same for `putPreference` function, but using the preferences\
    \ editor and saving the result of `when` at the end, by calling `apply()`:\n\n\
    ```kotlin\n 1 private fun putPreference(name: String, value: T) = with(prefs.edit())\
    \ {\n 2     when (value) {\n 3         is Long -> putLong(name, value)\n 4   \
    \      is String -> putString(name, value)\n 5         is Int -> putInt(name,\
    \ value)\n 6         is Boolean -> putBoolean(name, value)\n 7         is Float\
    \ -> putFloat(name, value)\n 8         else -> throw IllegalArgumentException(\"\
    This type can be saved into Preferenc\\\n 9 es\")\n10     }.apply()\n11 }\n```\n\
    \n`extensions/DelegatesExtensions.kt`\n\nNow update `DelegatesExt` object and\
    \ you are done:\n\n```kotlin\n1 object DelegatesExt {\n2     ...\n3      fun <T>\
    \ preference(context: Context, name: String, default: T) \n4          = Preference(context,\
    \ name, default)\n5 }\n```\n\n`extensions/DelegatesExtensions.kt`\n\nAfter this\
    \ chapter, the user can now access the settings screen and modify the zip code.\
    \ That way, when they return to the main screen, the forecast is automatically\
    \ refreshed with the new information. Check the rest of small tweaks [in the repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-26).\n\
    \n## 27 A first walk into coroutines\n\nCoroutines were the most significant introduction\
    \ to Kotlin 1.1. They are great because of how powerful they are, and the community\
    \ is still finding out how to take the most out of them.\n\nTo put it simply,\
    \ coroutines are a way to write asynchronous code sequentially. Instead of messing\
    \ around with callbacks, you can write your lines of code one after the other.\
    \ Some of them can suspend the execution and wait until the result is available.\n\
    \nIf you were a former C# developer, async/await is the closest concept. However,\
    \ coroutines in Kotlin are more powerful, because instead of being a specific\
    \ implementation of the idea, they are a language feature that developers can\
    \ implement in different ways to solve specific problems.\n\nYou can write your\
    \ solution, or use one of the several options that the Kotlin team and other independent\
    \ developers have built.\n\nYou need to understand that coroutines are an experimental\
    \ feature in Kotlin 1.1. The Kotlin team uses this category for features that\
    \ they want to release early but might change in the future. In the case of coroutines,\
    \ they plan to support the current API, but you might want to migrate to the new\
    \ definition. As we will see later, you need to opt in for this feature. Otherwise,\
    \ the IDE shows a warning when you use it.\n\nBut this also means that you should\
    \ take this chapter as an example of what you can do, not a rule of thumb. Things\
    \ may change in the next few months.\n\n### 27.1 Understanding how coroutines\
    \ work\n\nMy goal here is that you can get some basic concepts and use one of\
    \ the existing libraries, not to build your implementations. But I think it is\
    \ important to understand some of the internals so that you do not blindly use\
    \ what you are given.\n\nCoroutines are based on the idea of `suspending functions`:\
    \ functions that can stop the execution when they are called and make it continue\
    \ once it has finished running their background task.\n\nSuspending functions\
    \ are marked with the reserved word `suspend`, and can only be called inside other\
    \ suspending functions or a coroutine.\n\nThus, you cannot call a suspending function\
    \ everywhere. There needs to be a surrounding function that builds the coroutine\
    \ and provides the required context. Something like this:\n\n```kotlin\n1 fun\
    \ <T> async(block: suspend () -> T)\n```\n\nI am not explaining how to implement\
    \ the above function. It is a complicated process that is out of the scope of\
    \ this book, and for most cases, there are solutions already implemented for you.\
    \ If you are interested in building your own, you can read the specification written\
    \ in [coroutines Github](https://github.com/Kotlin/kotlin-coroutines/blob/master/kotlin-coroutines-informal.md).\
    \ What you need to know is that the function can have whatever name you want to\
    \ give it and that it has at least a suspending block as a parameter.\n\nThen\
    \ you could implement a suspending function and call it inside that block:\n\n\
    ```kotlin\n1 suspend fun mySuspendingFun(x: Int) : Result {\n2     ...\n3 }\n\
    4 \n5 async { \n6     val res = mySuspendingFun(20)\n7     print(res)\n8 }\n```\n\
    \nAre coroutines threads then? Not exactly. They work similarly, but are much\
    \ more lightweight and efficient. You can have millions of coroutines running\
    \ on a few threads, which opens a world of possibilities.\n\nThere are three ways\
    \ you can make use of the coroutines feature:\n\n- Raw implementation: it means\
    \ building your way to use coroutines. This is quite complex and usually not required\
    \ at all.\n- Low-level implementations: Kotlin provides a set of libraries that\
    \ you can find in [kotlinx.coroutines](https://github.com/Kotlin/kotlinx-coroutines)\
    \ repository, which solves some of the hardest parts and provides a specific implementation\
    \ for different scenarios. There is [one for Android](https://github.com/Kotlin/kotlinx-coroutines/tree/master/ui/kotlinx-coroutines-android),\
    \ for instance.\n"
