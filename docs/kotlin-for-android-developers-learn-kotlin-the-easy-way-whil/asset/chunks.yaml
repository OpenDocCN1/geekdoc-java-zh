- fmt: "\nWhat is the magic behind reified functions? As you may know, when we create\
    \ a generic method in `Java`, there is no way to get the class from the generic\
    \ type. A popular workaround is to pass the class as a parameter. In Kotlin, an\
    \ inline function can be reified, which means we can get and use the class of\
    \ the generic type inside the function. In this case, we can create the intent\
    \ inside the function, by calling `T::class.javaClass`. A simpler version of what\
    \ Anko does would be the next (I am only using `String` extras in this example):\n\
    \n```\n1 public inline fun <reified T: Activity> Context.startActivity(\n2   \
    \      vararg params: Pair<String, String>) {\n3     \n4     val intent = Intent(this,\
    \ T::class.java)\n5     params.forEach { intent.putExtra(it.first, it.second)\
    \ }\n6     startActivity(intent)\n7 }\n```\n\nThe real implementation is a bit\
    \ more complicated because it uses a long and a boring `when` expression to add\
    \ the extras depending on the type, but it does not add much useful knowledge\
    \ to the concept.\n\nReified functions are, once more, a syntactic sugar that\
    \ simplifies the code and improves its comprehension. In this case, it creates\
    \ an intent by getting the `javaClass` from the generic type, iterates over `params`\
    \ and adds them to the intent, and starts the activity using the intent. The reified\
    \ type is limited to be an `Activity` descendant.\n\nThe rest of little details\
    \ are covered [in the repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-23).\
    \ We now have a simple (but complete) master-detail App implemented in Kotlin\
    \ without using a single line of `Java`.\n\n# 24 Interfaces and Delegation\n\n\
    ### 24.1 Interfaces\n\nInterfaces in Kotlin are more powerful than in `Java 7`.\
    \ If you have worked with `Java 8`, similarities are much closer there. In Kotlin,\
    \ we can use interfaces the same way as in `Java`. Imagine we have some animals,\
    \ and some of them can fly. This is the interface we could have for flying animals:\n\
    \n```\n1 interface FlyingAnimal {\n2     fun fly()\n3 }\n```\n\nBoth birds and\
    \ bats can fly by moving their wings. So let’s create a couple of classes for\
    \ them:\n\n```\n1 class Bird : FlyingAnimal {\n2     val wings: Wings = Wings()\n\
    3     override fun fly() = wings.move()\n4 }\n5 \n6 class Bat : FlyingAnimal {\n\
    7     val wings: Wings = Wings()\n8     override fun fly() = wings.move()\n9 }\n\
    ```\n\nWhen a couple of classes extend from an interface, it is very typical they\
    \ both share the same implementation. However, `Java 7` interfaces can only define\
    \ the behavior, but not implement it.\n\nKotlin interfaces, on the other hand,\
    \ can implement functions. The only difference from a class is that they are stateless,\
    \ so the properties that need a backing field need to be overridden by the class.\
    \ The class is in charge of saving the state of interface properties.\n\nWe can\
    \ make the interface implement the `fly` function:\n\n```\n1 interface FlyingAnimal\
    \ {\n2     val wings: Wings\n3     fun fly() = wings.move()\n4 }\n```\n\nAs mentioned,\
    \ classes need to override the property:\n\n```\n1 class Bird : FlyingAnimal {\n\
    2     override val wings: Wings = Wings()\n3 }\n4 \n5 class Bat : FlyingAnimal\
    \ {\n6     override val wings: Wings = Wings()\n7 }\n```\n\nAnd now both birds\
    \ and bats can fly:\n\n```\n1 val bird = Bird()\n2 val bat = Bat()\n3 \n4 bird.fly()\n\
    5 bat.fly()\n```\n\n### 24.2 Delegation\n\nThe [delegation](https://en.wikipedia.org/wiki/Delegation_pattern)\
    \ is a handy pattern that can be used to extract responsibilities from a class.\
    \ The delegation pattern is supported natively by Kotlin, so it prevents the need\
    \ of calling the delegate. The delegator just needs to specify which instance\
    \ implements the interface.\n\nIn our previous example, we can specify how the\
    \ animal flies through the constructor, instead of implementing it. For instance,\
    \ a flying animal that uses wings to fly can be implemented this way:\n\n```\n\
    1 interface CanFly {\n2     fun fly()\n3 }\n4 \n5 class Bird(f: CanFly) : CanFly\
    \ by f\n```\n\nWe can indicate that a bird can fly by using the interface, but\
    \ the way the bird uses to fly is defined by a delegate that comes through the\
    \ constructor, so we can have different birds with different flying methods. The\
    \ way an animal with wings flies is defined in another class:\n\n```\n1 class\
    \ AnimalWithWings : CanFly {\n2     val wings: Wings = Wings()\n3     override\
    \ fun fly() = wings.move()\n4 }\n```\n\nAn animal with wings moves its wings to\
    \ be able to fly. So now we can create a bird that flies using wings:\n\n```\n\
    1 val birdWithWings = Bird(AnimalWithWings())\n2 birdWithWings.fly()\n```\n\n\
    But now wings can be used with other animals that are not birds. If we assume\
    \ that bats always use wings, we could instantiate the object directly where we\
    \ specify the delegation:\n\n```\n1 class Bat : CanFly by AnimalWithWings()\n\
    2 ...\n3 val bat = Bat()\n4 bat.fly()\n```\n\n### 24.3 Implementing an example\
    \ in our App\n\nInterfaces can be used to extract common code from classes which\
    \ have some similar behavior. For instance, we can create an interface that deals\
    \ with the toolbar of the app. Both `MainActivity` and `DetailActivity` share\
    \ similar code that deals with the toolbar.\n\nBut first, some changes need to\
    \ be done to start using a toolbar instead of the `ActionBar`. The first thing\
    \ will be extending a `NoActionBar` theme:\n\n```\n1 <style name=\"AppTheme\"\
    \ parent=\"Theme.AppCompat.Light.NoActionBar\">\n2     <item name=\"colorPrimary\"\
    >#ff2121</item>\n3     <item name=\"colorPrimaryDark\">@android:color/black</item>\n\
    4 </style>\n```\n\nvalues/styles.xml\n\nWe are using a light theme. Next, let’s\
    \ create a toolbar layout that we can include in other layouts:\n\n```\n1 <android.support.v7.Toolbar\n\
    2     xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n3     xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n4     android:id=\"@+id/toolbar\"\
    \n5     android:layout_width=\"match_parent\"\n6     android:layout_height=\"\
    ?attr/actionBarSize\"\n7     android:background=\"?attr/colorPrimary\"\n8    \
    \ android:theme=\"@style/ThemeOverlay.Dark.ActionBar\"\n9     app:popupTheme=\"\
    @style/ThemeOverlay.AppCompat.Light\"/>\n```\n\nlayout/toolbar.xml\n\nThe toolbar\
    \ specifies its background, a dark theme for itself and a light theme for the\
    \ popups it generates (the overflow menu for instance). We get then the same theme\
    \ we already had: a light theme with dark ActionBar.\n\nNext step will be modifying\
    \ the `MainActivity` layout to include the toolbar:\n\n```\n1 <FrameLayout\n2\
    \     xmlns:android=\"http://schemas.android.com/apk/res/android\"\n3     android:layout_width=\"\
    match_parent\"\n4     android:layout_height=\"match_parent\">\n5 \n6     <android.support.v7.RecyclerView\n\
    7         android:id=\"@+id/forecastList\"\n8         android:layout_width=\"\
    match_parent\"\n9         android:layout_height=\"match_parent\"\n10         android:clipToPadding=\"\
    false\"\n11         android:paddingTop=\"?attr/actionBarSize\"/>\n12 \n13    \
    \ <include layout=\"@layout/toolbar\"/>\n14 \n15 </FrameLayout>\n```\n\nlayout/activity_main.xml\n\
    \nNow that we have added the toolbar to the layout, we can start using it. We\
    \ are creating an interface that will let us:\n\n*   Change the title\n*   Specify\
    \ whether it shows the up navigation action or not\n*   Animate the toolbar when\
    \ scrolling\n*   Assign the same menu to all activities and an event for the actions\n\
    \nSo let’s define the `ToolbarManager`:\n\n```\n1 interface ToolbarManager {\n\
    2     val toolbar: Toolbar\n3     ...\n4 }\n```\n\nui/activities/ToolbarManager.kt\n\
    \nIt needs a toolbar property. Interfaces are stateless, so the property can be\
    \ defined, but no value can be assigned. Classes that implement it require overriding\
    \ the property.\n\nOn the other hand, we can implement stateless properties without\
    \ the need of being overridden. That is, properties that can work without using\
    \ a backing field. An example would be a property which deals with the toolbar\
    \ title:\n"
