  raw: "```\n 1 private fun withToolbarTitle(textMatcher: Matcher<CharSequence>):\
    \ Matcher<Any> =\n 2         object : BoundedMatcher<Any, Toolbar>(Toolbar::class.java)\
    \ {\n 3 \n 4             override fun matchesSafely(toolbar: Toolbar): Boolean\
    \ =\n 5                 textMatcher.matches(toolbar.title)\n 6 \n 7          \
    \   override fun describeTo(description: Description) {\n 8                 description.appendText(\"\
    with toolbar title: \")\n 9                 textMatcher.describeTo(description)\n\
    10             }\n11         }\n```\n\nThe `matchesSafely` function is the place\
    \ where the check happens, while the `describeTo` function adds some information\
    \ about the matcher.\n\nThis chapter has been especially interesting because we\
    \ have seen how Kotlin is entirely compatible with both unit and integration tests\
    \ and can interoperate with the testing libraries. [Take a look at the code](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-28)\
    \ and run the tests by yourself.\n\n## 29 Extra concepts\n\nThroughout this book,\
    \ we have talked about the most important concepts of the Kotlin language. But\
    \ we did not use some of them when implementing the app, and I would not want\
    \ to let them out of these pages. In this chapter, I will review some unrelated\
    \ features that you could be helpful for you when you develop your next Android\
    \ app using Kotlin.\n\n### 29.1 Nested classes\n\nAs in Java, we can define classes\
    \ inside other classes. By default, an inner class will not be able to access\
    \ the members of the outer class (it would behave as a static class in Java):\n\
    \n```\n1 class Outer {\n2   private val bar: Int = 1\n3   class Nested {\n4  \
    \   fun foo() = 2\n5   }\n6 }\n7 \n8 val demo = Outer.Nested().foo() // == 2\n\
    ```\n\nThis is what we used for instance for the `ViewHolder` inside the `ForecastListAdapter`.\
    \ If we want to access to the members of the outer class, we need to declare it\
    \ as an **`inner`** class:\n\n```\n1 class Outer {\n2   private val bar: Int =\
    \ 1\n3   inner class Inner {\n4     fun foo() = bar\n5   }\n6 }\n7 \n8 val demo\
    \ = Outer().Inner().foo() // == 1\n```\n\n### 29.2 Enum classes\n\nKotlin also\
    \ provides a way to implement **`enum`**:\n\n```\n1 enum class Day {\n2     SUNDAY,\
    \ MONDAY, TUESDAY, WEDNESDAY,\n3     THURSDAY, FRIDAY, SATURDAY\n4 }\n```\n\n\
    Enums can have parameters, which are declared in the constructor:\n\n```\n1 enum\
    \ class Icon(val res: Int) {\n2     UP(R.drawable.ic_up),\n3     SEARCH(R.drawable.ic_search),\n\
    4     CAST(R.drawable.ic_cast)\n5 }\n6 \n7 val searchIconRes = Icon.SEARCH.res\n\
    ```\n\nEnums can be requested by the `String` that matches the name, and we can\
    \ also get an `Array` that includes all the values of an Enum, so that we can\
    \ iterate over them.\n\n```\n1 val search: Icon = Icon.valueOf(\"SEARCH\")\n2\
    \ val iconList: Array<Icon> = Icon.values\n```\n\nBesides, each Enum constant\
    \ has functions to obtain its name and the position in the declaration:\n\n```\n\
    1 val searchName: String = Icon.SEARCH.name\n2 val searchPosition: Int = Icon.SEARCH.ordinal\n\
    ```\n\nEnums implement `Comparable` based on the ordinal, so it is easy to compare\
    \ them.\n\n### 29.3 Sealed classes\n\nSealed classes are used to represent restricted\
    \ class hierarchies, which means that the number of classes that extend a sealed\
    \ class is restricted. It is similar to an Enum in the sense that the compiler\
    \ is aware of the number of subtypes a sealed class has. The difference is that\
    \ enum instances are unique, while sealed classes can have multiple instances\
    \ which can contain different states.\n\nWe could implement, for instance, something\
    \ similar to the `Option` class: a type that prevents the use of `null` by returning\
    \ a `Some` class when the object contains a value or the `None` instance when\
    \ it is empty:\n\n```\n1 sealed class Option<out T>\n2 object None : Option<Nothing>()\n\
    3 data class Just<out T>(val value: T) : Option<T>()\n```\n\nThe good thing about\
    \ sealed classes is that when they are used in a `when` expression, we can check\
    \ all the options and will not need to add the `else` clause. Also, if at some\
    \ point we add a new subclass, the compiler will warn us about the places where\
    \ we should be dealing with it.\n\n```\n1 val result = when (option) {\n2    \
    \ None -> \"Empty\"\n3     is Just -> \"Contains a value\"\n4 }\n```\n\n### 29.4\
    \ Exceptions\n\nIn Kotlin, all exceptions implement `Throwable`, have a message\
    \ and are unchecked. Consequently, we are not required to use `try/catch` on any\
    \ of them. That is not the case in Java, where methods that throw `IOException`,\
    \ for instance, need to be surrounded by a `try/catch` block. Time has shown that\
    \ checked exceptions were not a good idea. People like [Bruce Eckel](http://www.mindview.net/Etc/Discussions/CheckedExceptions),\
    \ [Rod Waldhoff](http://radio-weblogs.com/0122027/stories/2003/04/01/JavasCheckedExceptionsWereAMistake.html)\
    \ or [Anders Hejlsberg](http://www.artima.com/intv/handcuffs.html) can give you\
    \ a better perspective on it.\n\nThe way to throw an exception is very similar\
    \ to Java:\n\n```\n1 throw MyException(\"Exception message\")\n```\n\nAnd `try`\
    \ expression is identical too:\n\n```\n1 try {\n2   // some code\n3 }\n4 catch\
    \ (e: SomeException) {\n5   // handler\n6 }\n7 finally {\n8   // optional finally\
    \ block\n9 }\n```\n\nBoth `throw` and `try` are expressions in Kotlin, which allows\
    \ to assign them to a variable. This is useful when dealing with edge cases:\n\
    \n```\n1 val s = when(x){\n2     is Int -> \"Int instance\"\n3     is String ->\
    \ \"String instance\"\n4     else -> throw UnsupportedOperationException(\"Not\
    \ valid type\")\n5 }\n```\n\nor\n\n```\n1 val s = try { x as String } catch(e:\
    \ ClassCastException) { null }\n```\n\n## 30 Java interoperability\n\nSo far,\
    \ we have been talking about creating an app from scratch. However, you probably\
    \ find yourself in a situation where you already have an App written in Java with\
    \ thousands of lines of code, and you cannot convert all your code. I will cover\
    \ this topic here.\n\nOne of the great wonders of Kotlin is that it is entirely\
    \ interoperable with Java. Therefore, although all your application code is written\
    \ Java, you can create a class in Kotlin and use it from Java without any issues.\
    \ Calling Kotlin from Java code cannot be easier. This potentially gives you two\
    \ advantages:\n\n*   You can use Kotlin in a Java project: In any project, you\
    \ have already started, you can decide to start writing new code in Kotlin. You\
    \ can then call it from Java code.\n\n*   If you do not know how to do something\
    \ in Kotlin, you can write that part in Java. You may be wondering if there is\
    \ a case where Kotlin is not enough to do something on Android. In theory, everything\
    \ can be done, but the fact is that it does not matter. If you cannot do it in\
    \ Kotlin, then implement that part in Java.\n\nLet’s see how this compatibility\
    \ works, and how Kotlin code looks when used from Java.\n\n### 30.1 Package-level\
    \ functions\n\nIn Kotlin, functions do not need to be inside a class, but this\
    \ is not the case in Java. How can we call a function then? Imagine that we have\
    \ a file called `utils.kt` that looks like this:\n\n```\n1 fun logD(message: String)\
    \ {\n2     Log.d(\"\", message)\n3 }\n4 \n5 fun logE(message: String) {\n6   \
    \  Log.e(\"\", message)\n7 }\n```\n\nIn Java we can access them through a class\
    \ that will be called `UtilsKt`, with some static methods:\n\n```\n1 UtilsKt.logD(\"\
    Debug\");\n2 UtilsKt.logE(\"Error\");\n```\n\n### 30.2 Extension functions\n\n\
    We have been using extension functions a lot throughout this book. However, how\
    \ do they look in Java? If you have the following function:\n\n```\n1 fun ViewGroup.inflate(resId:\
    \ Int, attachToRoot: Boolean = false): View {\n2     return LayoutInflater.from(context).inflate(resId,\
    \ this, attachToRoot)\n3 }\n```\n\nThis is applied to a `ViewGroup`. It receives\
    \ a layout and inflates it using the parent view. What would we get if we want\
    \ to use it in Java? This is the result:\n\n```\n1 View v = UtilsKt.inflate(parent,\
    \ R.layout.view_item, false);\n```\n\nAs you can see, the object that applies\
    \ this function (the receiver) is added as an argument to the function. Besides,\
    \ the optional argument becomes mandatory, because in Java we cannot use default\
    \ values."
