  trans: "\n现在同步 Gradle 以将库包含在你的项目中。在旧版本的 Android Studio 中，你可能需要选择想要运行的哪种测试。进入“Build\
    \ Variants”（构建变体）标签（它可能在 IDE 的左侧），并点击“Test Artifact”下拉菜单。你应该在那里选择“Unit Tests”（单元测试）。新版本的\
    \ Android Studio 可以同时启用这两种测试，因此此步不是必须的。\n\n你需要做的另一件事是创建一个新文件夹。在 `src` 下，你可能已经有了\
    \ `androidTest` 和 `main`。再创建一个名为 `test` 的文件夹，并在下方创建一个 `java` 文件夹。现在，你应该有一个呈绿色的\
    \ `src/test/java` 文件夹。这是一个很好的迹象，表明 IDE 已检测到我们正处于“单元测试”模式，并且该文件夹包含测试文件。\n\n让我们写一个简单的测试来检查一切是否运行正常。使用正确的包名创建一个名为\
    \ `SimpleTest` 的 Kotlin 类（在我的案例中是 `com.antonioleiva.weatherapp`，但你需要使用你应用的主包）。一旦创建了新文件，编写这个简单的测试：\n\
    \n```\n1 import org.junit.Test\n2 import kotlin.test.assertTrue\n3 \n4 class SimpleTest\
    \ {\n5     @Test\n6     fun `unit testing works`() {\n7         assertTrue(true)\n\
    8     }\n9 }\n```\n\n`test/SimpleTest.kt`\n\n使用 `@Test` 注解将该函数标识为测试。请确保使用 `org.junit.Test`。然后添加一个简单的断言。它只检查\
    \ `true` 是否为 `true`，这应该会成功。\n\n你看到我是如何写函数名的了吗？如果你使用反引号（backquotes），可以为测试提供一个可读的名称。当测试在\
    \ Android Studio 中运行时，摘要中显示的文本会易读得多。\n\n你会发现这些名称显示错误。这是因为这种格式不适用于 Android 代码，因此也不适用于仪表测试（instrumentation\
    \ tests）。但你可以在单元测试中毫无可以使用它们，所以你可以针对测试禁用检查并安全地使用。\n\n要执行测试，右键点击你在 `test` 下创建的新的\
    \ `java` 文件夹，并选择“Run All Tests”（运行所有测试）。编译完成后，它将运行测试，你会看到显示结果的摘要。你应该注意到你的测试通过了。\n\
    \n现在是时候创建一些真实的测试了。所有涉及 Android 框架的内容可能都需要仪表测试（instrumentation test）或一些额外的库，如 [Robolectric](http://robolectric.org/)。正如此，在这些示例中，我测试的是不使用框架任何内容的内容。例如，我将测试从\
    \ `Long` 创建日期 `String` 的扩展函数。\n\n创建一个名为 `ExtensionTests` 的新文件，并添加这些测试：\n\n```\n\
    \ 1 class ExtensionsTest {\n 2     @Test\n 3     fun `\"longToDateString\" returns\
    \ valid value`() {\n 4         assertEquals(\"Oct 19, 2015\", 1445275635000L.toDateString())\n\
    \ 5     }\n 6 \n 7     @Test\n 8     fun `\"longToDateString\" with full format\
    \ returns valid value`() {\n 9         assertEquals(\"Monday, October 19, 2015\"\
    , \n10             1445275635000L.toDateString(DateFormat.FULL))\n11     }\n12\
    \ }\n```\n\n`test/ExtensionsTest.kt`\n\n这些测试检查 `Long` 实例是否被正确转换为 `String`。第一个测试了默认行为（使用\
    \ `DateFormat.MEDIUM`），而第二个指定了不同的格式。运行测试并看它们是否全部通过。我还建议你修改一些内容看看它是如何崩溃的。\n\n如果你习惯于在\
    \ Java 中测试应用，你会发现这里没有太大区别。我涵盖了一个简单的示例，但从这里你可以创建更复杂的测试来验证应用的其他部分。例如，我们可以为 `ForecastProvider`\
    \ 写一些测试。我们可以使用 `Mockito` 库来模拟（mock）其他类，并能够独立地测试 provider：\n\n```\n1 buildscript\
    \ {\n2     ...\n3     ext.mockito_version = '2.16.0'\n4 }\n```\n\n`build.gradle`\n\
    \n```\n1 dependencies {\n2     ...\n3     testImplementation \"junit:junit:4.12\"\
    \n4     testImplementation \"org.mockito:mockito-core:$mockito_version\"\n5 }\n\
    ```\n\n`app/build.gradle`\n\n现在创建一个 `ForecastProviderTest`。我们将测试一个带有返回内容的 `DataSource`\
    \ 的 `ForecastProvider` 是否会获得一个非空结果。所以首先，我们需要模拟一个 `ForecastDataSource`：\n\n```\n\
    1 val ds = mock(ForecastDataSource::class.java)\n2 `when`(ds.requestDayForecast(0)).then\
    \ {\n3     Forecast(0, 0, \"desc\", 20, 0, \"url\")\n4 }\n```\n\n`test/domain/datasource/ForecastProviderTest.kt`\n\
    \n如你所见，`when` 函数需要使用反引号，因为 `when` 是 Kotlin 中的保留字。所以如果我们发现某些使用它的 Java 代码，我们需要对其进行转义。\n\
    \n另一种方法是重命名导入：\n\n```\n1 import org.mockito.Mockito.`when` as whenever\n2 \n3\
    \ ...\n4 \n5 whenever(ds.requestDayForecast(0)).then { ... }\n```\n\n这取决于你；我将使用反引号。\n"
- fmt: "\nYou have two options to overcome this situation:\n\n* Use the `open` reserved\
    \ word, which would allow Mockito to mock your class, but also any other class\
    \ to extend this one (which was probably closed for a reason).\n* Extract an interface,\
    \ and mock the interface. This one is a cleaner solution, but also slightly redundant\
    \ if you are not using that interface for anything else.\n\nThere is, however,\
    \ a third alternative: an experimental feature in Mockito 2. This feature allows\
    \ you to mock final classes and avoid those extra artifacts. It might be that\
    \ by the time you read these lines, the feature is not experimental anymore. But\
    \ if it still is, you need to add an extra library to opt in for the feature:\n\
    \n```\n1 testImplementation \"org.mockito:mockito-inline:$mockito_version\"\n\
    ```\n`app/build.gradle`\n\nEven if it is experimental, it works pretty well, so\
    \ feel safe to use it.\n\nNow you can rerun your test, and see how it magically\
    \ passes.\n\n### 28.3 Instrumentation tests\n\nInstrumentation tests are a bit\
    \ different. They are typically used to test UI interactions, where we need an\
    \ `Application` instance to be running by the time the tests are executed. To\
    \ do this, we need to deploy the app and run the tests on a device.\n\nThis type\
    \ of tests reside in the `androidTest` folder, and we must change ‘Test Artifact’\
    \ to ‘Android Instrumentation Tests’ in ‘Build Variants’ panel on old Android\
    \ Studio versions. The official library to implement instrumentation tests is\
    \ [Espresso](https://google.github.io/android-testing-support-library/), which\
    \ helps us easily navigate through our App by writing `Action`s, and filter and\
    \ check results using `ViewMatcher`s and `Matcher`s.\n\nThe configuration is a\
    \ bit harder than the previous one. We need a bunch of extra libraries and Gradle\
    \ configuration. The good thing is that Kotlin does not add any extra overhead,\
    \ so if you already know how to configure Espresso, it should be easy for you.\n\
    \nFirst, specify the test runner in `defaultConfig`:\n\n```\n1 defaultConfig {\n\
    2     ...\n3     testInstrumentationRunner \"android.support.test.runner.AndroidJUnitRunner\"\
    \n4 }\n```\n`app/build.gradle`\n\nOnce you have configured the runner, it is time\
    \ to add the rest of the dependencies, this time using `androidTestImplementation`.\
    \ That way, these libraries are only added when we compile to run the instrumentation\
    \ tests:\n\n```\n1 buildscript {\n2     ...\n3     ext.test_support_version =\
    \ '1.0.1'\n4     ext.espresso_version = '3.0.1'\n5 }\n```\n`build.gradle`\n\n\
    ```\n 1 dependencies {\n 2     ...\n 3     androidTestImplementation \"com.android.support:support-annotations:$support_versi\\\
    \n 4 on\"\n 5     androidTestImplementation \"com.android.support.test:runner:$test_support_version\"\
    \n 6     androidTestImplementation \"com.android.support.test:rules:$test_support_version\"\
    \n 7     androidTestImplementation \"com.android.support.test.espresso:espresso-core:$espre\\\
    \n 8 sso_version\"\n 9     androidTestImplementation(\"com.android.support.test.espresso:espresso-contrib:$es\\\
    \n10 presso_version\") {\n11         exclude group: 'com.android.support', module:\
    \ 'appcompat-v7'\n12         exclude group: 'com.android.support', module: 'support-v4'\n\
    13         exclude group: 'com.android.support', module: 'design'\n14        \
    \ exclude group: 'com.android.support', module: 'recyclerview-v7'\n15 }\n```\n\
    `app/build.gradle`\n\nI do not want to spend much time talking about this, but\
    \ here it is a brief explanation of why you need these libraries:\n\n* `runner`:\
    \ It is the test runner, the one we specified in `defaultConfig`.\n* `rules`:\
    \ Includes some rules that help tests inflate and launch the activities. We will\
    \ use a rule in our examples.\n* `espresso-core`: the basic features of Espresso,\
    \ the library that makes instrument tests easier.\n* `espresso-contrib`: it adds\
    \ some extra features, such as `RecyclerView` testing support. We have to exclude\
    \ some of its dependencies, because we already have them in the project, and tests\
    \ crash otherwise.\n\nLet’s now create a simple example. The test will click on\
    \ the first row of the forecast list, and check that it can find a view with the\
    \ id `R.id.weatherDescription`. This view is in the `DetailActivity`, which implies\
    \ that we successfully navigated to the detail after clicking on a view inside\
    \ the `RecyclerView`.\n\n```\n1 class SimpleInstrumentationTest {\n2 \n3     @get:Rule\n\
    4     val activityRule = ActivityTestRule(MainActivity::class.java)\n5 \n6   \
    \  ...\n7 }\n```\n\nWe need to create an activity rule, which instantiates the\
    \ activity that the test will use. In Java, you would annotate the field using\
    \ `@Rule`. However, as you know, fields and properties are not the same, so if\
    \ you use just that, the execution will fail because the access to the field inside\
    \ the property is not public. What you need to do is to annotate the getter. Kotlin\
    \ allows doing that by specifying `get` or `set` before the name of the rule.\
    \ In this case, write `@get:Rule`.\n\nAfter that, we are ready to create our first\
    \ test:\n\n```\n1 @Test fun itemClickNavigatesToDetail() {\n2     onView(withId(R.id.forecastList)).perform(\n\
    3             RecyclerViewActions\n4                 .actionOnItemAtPosition<RecyclerView.ViewHolder>(0,\
    \ click()))\n5     onView(withId(R.id.weatherDescription))\n6            .check(matches(isAssignableFrom(TextView::class.java)))\n\
    7 }\n```\n\nAs these tests run on a device, we cannot use the same naming format\
    \ we used for unit tests. The function is annotated with `@Test`, the same way\
    \ we did with unit tests. We can start using Espresso in the body of the test.\
    \ It first performs a click over the first position. Then, it checks that it can\
    \ find a view with specific id it is an instance of `TextView`.\n\nTo run the\
    \ test, you can do the same you did for unit tests: right click on the `java`\
    \ folder below `androidTest`, and choose ‘Run All Tests’. Now, in ‘Target device’,\
    \ choose the target you prefer. Click ‘OK’ and then run. You should see how the\
