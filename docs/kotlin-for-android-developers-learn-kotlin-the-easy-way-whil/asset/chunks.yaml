  trans: "\n\n具化函数（reified functions）背后的魔法是什么？如你所知，当我们在 `Java` 中创建一个泛型方法时，无法从泛型类型获取类。一种通用的替代方法是将类作为参数传递。在\
    \ Kotlin 中，内联函数（inline function）可以被具化，这意味着可以在函数内部获取并使用泛型类型的类。在这种情况下，我们可以通过调用 `T::class.javaClass`\
    \ 在函数内部创建 intent。Anko 所做功能的简单版本如下（在此示例中我仅使用了 `String` 额外参数）：\n\n```\n1 public\
    \ inline fun <reified T: Activity> Context.startActivity(\n2         vararg params:\
    \ Pair<String, String>) {\n3     \n4     val intent = Intent(this, T::class.java)\n\
    5     params.forEach { intent.putExtra(it.first, it.second) }\n6     startActivity(intent)\n\
    7 }\n```\n\n真正的实现要复杂一些，因为它使用了一个冗长且无聊的 `when` 表达式根据类型添加额外参数，但这对该概念并没有增加多少实用的知识。\n\
    \n具化函数再次是一种简化代码并提高可读性的语法糖。在这种情况下，它通过从泛型类型获取 `javaClass` 来创建一个 intent，遍历 `params`\
    \ 并将其添加到 intent 中，然后使用该 intent 启动 Activity。具化类型被限制为 `Activity` 的子类。\n\n其余细节可以在[代码仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-23)\
    \ 中找到。我们现在使用 Kotlin 实现了一个简单（但完整）主详情界面 App，而没有使用任何一行 `Java` 代码。\n\n# 24 接口与委托\n\
    \n### 24.1 接口\n\nKotlin 中的接口比 `Java 7` 更加强大。如果你工作过 `Java 8`，那么它们的相似性会非常接近。在 Kotlin\
    \ 中，我们可以像在 `Java` 中一样使用接口。假设我们有一些动物，其中一些会飞。这是我们可以为会飞的动物设计的接口：\n\n```\n1 interface\
    \ FlyingAnimal {\n2     fun fly()\n3 }\n```\n\n鸟类和蝙蝠都可以通过扇动翅膀飞行。所以，让我们为它们创建几个类：\n\
    \n```\n1 class Bird : FlyingAnimal {\n2     val wings: Wings = Wings()\n3    \
    \ override fun fly() = wings.move()\n4 }\n5 \n6 class Bat : FlyingAnimal {\n7\
    \     val wings: Wings = Wings()\n8     override fun fly() = wings.move()\n9 }\n\
    ```\n\n当多个类扩展一个接口时，它们都共享相同的实现是非常典型的。然而，`Java 7` 接口只能定义行为，而不能实现它。\n\n另一方面，Kotlin\
    \ 接口可以实现函数。与类的唯一区别在于它们是无状态的，因此需要支持字段（backing field）的属性需要由类来重写。类负责保存接口属性的状态。\n\n\
    我们可以让接口实现 `fly` 函数：\n\n```\n1 interface FlyingAnimal {\n2     val wings: Wings\n\
    3     fun fly() = wings.move()\n4 }\n```\n\n如前提到的，类需要重写该属性：\n\n```\n1 class Bird\
    \ : FlyingAnimal {\n2     override val wings: Wings = Wings()\n3 }\n4 \n5 class\
    \ Bat : FlyingAnimal {\n6     override val wings: Wings = Wings()\n7 }\n```\n\n\
    现在，鸟类和蝙蝠都会飞了：\n\n```\n1 val bird = Bird()\n2 val bat = Bat()\n3 \n4 bird.fly()\n\
    5 bat.fly()\n```\n\n### 24.2 委托\n\n[委托](https://en.wikipedia.org/wiki/Delegation_pattern)\
    \ 是一种实用的模式，可以用于从类中提取职责。Kotlin 原生支持委托模式，因此它避免了手动调用委托对象的需要。委托者只需要指定哪个实例实现了该接口即可。\n\
    \n在我们之前的示例中，我们可以通过构造函数指定动物如何飞翔，而不是直接实现它。例如，一个使用翅膀飞行的动物可以这样实现：\n\n```\n1 interface\
    \ CanFly {\n2     fun fly()\n3 }\n4 \n5 class Bird(f: CanFly) : CanFly by f\n\
    ```\n\n我们可以通过使用接口来指示鸟会飞，但鸟飞行的方式是通过构造函数传入的委托定义的，因此我们可以拥有具有不同飞行方法的不同鸟。带翅膀的动物飞行方式在另一个类中定义：\n\
    \n```\n1 class AnimalWithWings : CanFly {\n2     val wings: Wings = Wings()\n\
    3     override fun fly() = wings.move()\n4 }\n```\n\n带翅膀的动物通过移动翅膀来飞行。因此，现在我们可以创建一个使用翅膀飞行的鸟：\n\
    \n```\n1 val birdWithWings = Bird(AnimalWithWings())\n2 birdWithWings.fly()\n\
    ```\n\n但现在翅膀也可以用于其他非鸟类动物。如果我们假设蝙蝠总是使用翅膀，我们可以在指定委托的地方直接实例化：\n\n```\n1 class Bat\
    \ : CanFly by AnimalWithWings()\n2 ...\n3 val bat = Bat()\n4 bat.fly()\n```\n\n\
    ### 24.3 在我们的 App 中实现一个示例\n\n接口可以从具有相似行为的类中提取公共代码。例如，我们可以创建一个处理 App 工具栏的接口。`MainActivity`\
    \ 和 `DetailActivity` 共享处理工具栏的相似代码。\n\n但，需要进行一些更改以使用工具栏而不是 `ActionBar`。第一件事是扩展\
    \ `NoActionBar` 主题：\n\n```\n1 <style name=\"AppTheme\" parent=\"Theme.AppCompat.Light.NoActionBar\"\
    >\n2     <item name=\"colorPrimary\">#ff2121</item>\n3     <item name=\"colorPrimaryDark\"\
    >@android:color/black</item>\n4 </style>\n```\n\nvalues/styles.xml\n\n我们使用的是浅色主题。接下来，创建一个可以在其他布局中包含的工具栏布局：\n\
    \n```\n1 <android.support.v7.Toolbar\n2     xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
    \n3     xmlns:android=\"http://schemas.android.com/apk/res/android\"\n4     android:id=\"\
    @+id/toolbar\"\n5     android:layout_width=\"match_parent\"\n6     android:layout_height=\"\
    ?attr/actionBarSize\"\n7     android:background=\"?attr/colorPrimary\"\n8    \
    \ android:theme=\"@style/ThemeOverlay.Dark.ActionBar\"\n9     app:popupTheme=\"\
    @style/ThemeOverlay.AppCompat.Light\"/>\n```\n\nlayout/toolbar.xml\n\n工具栏指定了背景、它生成的弹出主题（例如溢出菜单）。然后我们得到了之前拥有的相同主题：带\
    \ ActionBar 的浅色主题。\n\n下一步将修改 `MainActivity` 布局以包含工具栏：\n\n```\n1 <FrameLayout\n\
    2     xmlns:android=\"http://schemas.android.com/apk/res/android\"\n3     android:layout_width=\"\
    match_parent\"\n4     android:layout_height=\"match_parent\">\n5 \n6     <android.support.v7.RecyclerView\n\
    7         android:id=\"@+id/forecastList\"\n8         android:layout_width=\"\
    match_parent\"\n9         android:layout_height=\"match_parent\"\n10        android:clipToPadding=\"\
    false\"\n11        android:paddingTop=\"?attr/actionBarSize\"/>\n12 \n13     <include\
    \ layout=\"@layout/toolbar\"/>\n14 \n15 </FrameLayout>\n```\n\nlayout/activity_main.xml\n\
    \n现在已经在布局中添加了工具栏，我们就可以使用它了。我们创建一个接口，允许我们：\n\n*   更改标题\n*   指定是否显示返回导航操作\n*   滚动时动画工具栏\n\
    *   为所有 Activity 分配相同的菜单以及操作的事件\n\n所以让我们定义 `ToolbarManager`：\n\n```\n1 interface\
    \ ToolbarManager {\n2     val toolbar: Toolbar\n3     ...\n4 }\n```\n\nui/activities/ToolbarManager.kt\n\
    \n"
