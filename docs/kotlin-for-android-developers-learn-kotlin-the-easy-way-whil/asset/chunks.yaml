    \ when required:\n\n```\n1 object DelegatesExt {\n2     ....\n3     fun longPreference(context:\
    \ Context, name: String, default: Long) = \n4         LongPreference(context,\
    \ name, default)\n5 }\n```\n\nextensions/DelegatesExtensions.kt\n\nIn `SettingsActivity`,\
    \ we can now define a property to deal with the zip code preference. I am also\
    \ creating a couple of constants which keep the name and the default value of\
    \ the property. That way they can be used in other sections of the App.\n\n```\n\
    1 companion object {\n2     const val ZIP_CODE = \"zipCode\"\n3     const val\
    \ DEFAULT_ZIP = 94043L\n4 }\n5 \n6 private var zipCode: Long \n7         by DelegatesExt.longPreference(this,\
    \ ZIP_CODE, DEFAULT_ZIP)\n```\n\nui/activities/SettingsActivity.kt\n\nNow it is\
    \ easy to work with this preference. In `onCreate`, we get the value of the property\
    \ and assign it to the `EditText`:\n\n```\n1 override fun onCreate(savedInstanceState:\
    \ Bundle?) {\n2     ...\n3     cityCode.setText(zipCode.toString())\n4 }\n```\n\
    \nui/activities/SettingsActivity.kt\n\nWe cannot use the self-generated property\
    \ `text` because `EditText` returns an `Editable` in `getText`, so the property\
    \ defaults to that value. If we try to assign a `String`, the compiler will complain.\
    \ Using `setText()` will be enough.\n\nNow we have everything we need to implement\
    \ `onBackPressed`. Here, the new value of the property is saved:\n\n```\n1 override\
    \ fun onBackPressed() {\n2     super.onBackPressed()\n3     zipCode = cityCode.text.toString().toLong()\n\
    4 }\n```\n\nui/activities/SettingsActivity.kt\n\nThe `MainActivity` requires some\
    \ little changes. First, it also needs a `zipCode` property.\n\n```\n1 private\
    \ val zipCode: Long by DelegatesExt.longPreference(this, \n2         SettingsActivity.ZIP_CODE,\
    \ SettingsActivity.DEFAULT_ZIP)\n```\n\nui/activities/MainActivity.kt\n\nMoreover,\
    \ I am moving the forecast load to `onResume` so that every time the activity\
    \ is resumed, it refreshes the data, just in case the zip code changed. Of course,\
    \ there are more efficient ways to do this, by checking whether the zip code changed\
    \ before requesting the forecast again, for instance. But I want to keep this\
    \ example simple, and the local database already keeps the requested info, so\
    \ this solution is not that bad:"
