  trans: "\n\n```\n<TextView\n    android:id=\"@+id/dateText\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:textAppearance=\"\
    @style/TextAppearance.AppCompat.Medium\"\n    tools:text=\"May 14, 2015\"/>\n\n\
    <TextView\n    android:id=\"@+id/descriptionText\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:textAppearance=\"\
    @style/TextAppearance.AppCompat.Caption\"\n    tools:text=\"Light Rain\"/>\n```\n\
    \n`layout/item_forecast.xml`\n\n我们的应用现在使用 Kotlin Android Extensions 来查找视图。运行它并检查一切运行是否符合预期。\n\
    \nKotlin Android Extensions 插件帮助我们减少了一些样板代码，并尽可能减少访问视图所需的代码。在[仓库中](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-15)查看最新更改。\n\
    \n# 16 应用单例与委托属性\n\n我们很快就要实现一个数据库，如果想保持代码简单并让应用处于独立的层级中（而不是将所有内容都添加到 activity\
    \ 中），我们需要更方便地访问应用上下文（application context）。\n\n## 16.1 应用单例\n\n最简单的方法是像在 Java 中那样创建一个单例：\n\
    \n```\nclass App : Application() {\n\n    companion object {\n        private\
    \ var instance: Application? = null\n        fun instance() = instance!!\n   \
    \ }\n\n    override fun onCreate() {\n        super.onCreate()\n        instance\
    \ = this\n    }\n}\n```\n\n`ui/App.kt`\n\n记住你需要将此 `App` 类添加到 `AndroidManifest.xml`\
    \ 中以便作为应用实例使用：\n\n```xml\n<application\n    android:allowBackup=\"true\"\n   \
    \ android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
    \n    android:theme=\"@style/AppTheme\"\n    android:name=\".ui.App\">\n    ...\n\
    </application>\n```\n`AndroidManifest.xml`\n\nAndroid 的问题在于我们对许多类的构造函数没有控制权。例如，我们无法初始化非空属性，因为它的值必须在构造函数中声明。因此，我们需要一个可空变量，以及一个返回非空值的函数。我们知道始终有一个\
    \ `App` 实例，并且第一个执行的代码是应用的 `onCreate`，所以我们可以假设 `instance()` 函数始终可以返回非空的 `App` 实例，这是安全的。\n\
    \n然而，这个解决方案看起来很奇怪。我们需要定义一个属性（已经有了 getter 和 setter），然后用一个函数来返回该属性。我们有其他方法来获得类似的结果吗？有的，我们可以将属性的值委托给另一个类。\n\
    \n## 16.2 委托属性\n\n在属性中，我们可能需要某些有趣的复用行为，例如懒加载值（lazy values）或可观察属性（observable properties）。与其重复声明相同的代码，Kotlin\
    \ 提供了一种方法将属性所需的代码委托给另一个类。这些成员被称为委托属性（delegated properties）。\n\n当我们从属性中使用 `get`\
    \ 或 `set` 时，委托器会调用其对应的 `getValue` 和 `setValue`，这些方法可以决定是否、何时以及如何设置或返回值。\n\n属性委托的结构如下：\n\
    \n```\nclass Delegate<T> {\n    operator fun getValue(thisRef: Any?, property:\
    \ KProperty<*>): T {\n        return ...\n    }\n\n    operator fun setValue(thisRef:\
    \ Any?, property: KProperty<*>, value: T) {\n        ...\n    }\n}\n```\n\n`T`\
    \ 是委托行为的属性的类型。`getValue` 函数接收类引用和属性的元数据。`setValue` 函数还接收赋值的值。如果属性是不可变的（`val`），则只需要\
    \ `getValue` 函数。\n\n下面的代码片段是属性委托如何赋值的示例：\n\n```kotlin\nclass Example {\n  var\
    \ p: String by Delegate()\n}\n```\n\n它使用保留字 `by` 来指定委托。\n\n## 16.3 标准委托\n\n你可以在\
    \ Kotlin 标准库中找到一组委托。这些是委托可能实用的常见情况，但我们也可以创建自己的。\n\n### Lazy (懒加载)\n\n它接收一个 lambda\
    \ 表达式，该表达式在第一次调用 `getValue` 后运行，因此属性的初始化被延迟到那个时刻。后续调用将返回相同的值。这种委托对于那些不总是被使用或在某些部分准备好之前无法声明的项非常有用。我们可以节省内存，并直到属性需要时才跳过初始化。\n\
    \n```kotlin\nclass App : Application() {\n    val database: SQLiteOpenHelper by\
    \ lazy {\n        MyDatabaseHelper(applicationContext)\n    }\n\n    override\
    \ fun onCreate() {\n        super.onCreate()\n        val db = database.writableDatabase\n\
    \    }\n}\n```\n\n在这个示例中，数据库在 `onCreate` 中第一次被调用时才会初始化。在那个时刻，我们确定应用上下文存在并准备好使用。`lazy`\
    \ 操作是线程安全的。\n\n如果你不担心多线程并想获得额外的性能，可以使用 `lazy(LazyThreadSafetyMode.NONE) { ...\
    \ }`。\n\n### Observable (可观察)\n\n这种委托帮助我们检测需要观察的任何属性的变化。每当调用 `set` 函数时，它都会执行声明的\
    \ lambda 表达式。因此，在分配新值后，我们会接收委托属性、旧值和新值。\n\n```kotlin\nclass ViewModel(val db:\
    \ MyDatabase) {\n\n    var myProperty by Delegates.observable(\"\") {\n      \
    \  _, _, new ->\n        db.saveChanges(this, new)\n    }\n\n}\n```\n\n这个示例展示了一个感知\
    \ `myProperty` 变化的 `ViewModel` 类，每次赋值时都会保存更改。\n\n### Vetoable (否决)\n\n这种委托与 `observable`\
    \ 类似，区别在于它在赋值之前执行，并让你决定是否必须保存。它可以用于保存值之前检查某些条件。\n\n```kotlin\nvar positiveNumber\
    \ = Delegates.vetoable(0) {\n    _, _, new ->\n    new >= 0\n}\n```\n\n前者只在新值为正数时允许保存。在\
    \ lambda 内部，最后一行代表返回值。你不能使用 `return` 单词，因为它无法编译。\n\n### lateinit (延迟初始化)\n\n有时我们需要其他东西来初始化属性，但我们缺乏必要的状态，或者在这一点甚至无法获取它。这种情况在\
    \ Android 中经常发生，例如在活动、碎片、服务或广播接收器中。然而，非抽象属性在构造函数执行之前需要一个值。我们不能等到想给属性赋值时才赋值。我们至少有两个选择。\n\
    \n第一种选择是使用可空类型并在获得真实值之前将其设置为 null。使用这种方案，我们需要在代码的处处检查属性是否为空。如果我们确定在第一次使用属性时它不会为空，这可能会让我们编写一些不必要的代码。\n\
    \n第二种替代方案是 `lateinit`，它可以标识属性应该是非空值，但我们推迟了赋值。如果在赋值之前请求该值，它将抛出一个标识所访问属性的异常。\n\n\
    `late` 不完全是委托，而是属性修饰符，这就是为什么它必须写属性之前。\n\n这个修饰符在 App 单例示例中很有用：\n\n```kotlin\nclass\
    \ App : Application() {\n\n    companion object {\n        lateinit var instance:\
    \ App\n    }\n\n    override fun onCreate() {\n        super.onCreate()\n    \
    \    instance = this\n    }\n}\n```\n\n"
- fmt: "\n`lateinit` is also indispensable when working with a dependency injector\
    \ such as `Dagger`, and very useful for tests too.\n\n## Values from a map\n\n\
    Another way to delegate the values of a property is to get them from a map, using\
    \ the name of the property as the key of the map. This delegate lets create an\
    \ instance of an object from a dynamic map. If we are using immutable properties,\
    \ the map can be immutable too. For mutable properties, the class requires a `MutableMap`\
    \ as constructor parameter instead.\n\nImagine a configuration class we load from\
    \ a JSON, and assign those keys and values to a map. We could create an instance\
    \ of a class by passing this map to the constructor:\n\n```\n1 class Configuration(map:\
    \ Map<String, Any?>) {\n2     val width: Int by map\n3     val height: Int by\
    \ map\n4     val dp: Int by map\n5     val deviceName: String by map\n6 }\n```\n\
    \nAs a reference, here it is how we could create the map that this class would\
    \ require:\n\n```\n1 val conf = Configuration(mapOf(\n2         \"width\" to 1080,\n\
    3         \"height\" to 720,\n4         \"dp\" to 240,\n5         \"deviceName\"\
    \ to \"mydevice\"\n6 ))\n```\n\n## 16.4 How to create a custom delegate\n\nLet’s\
    \ say we want, for instance, to create a non-nullable delegate that can be only\
    \ assigned once. The second time it is assigned, it will throw an exception.\n\
    \nTo define a delegate class, you only need to write a couple of operator functions:\
    \ `getValue` and `setValue`. They have a very specific set of arguments that look\
    \ like this:\n\n```\n 1 class NotNullSingleValueVar<T> {\n 2 \n 3     operator\
    \ fun getValue(thisRef: Any?, property: KProperty<*>): T {\n 4         return\
    \ ...\n 5     }\n 6 \n 7     operator fun setValue(thisRef: Any?, property: KProperty<*>,\
    \ value: T) {\n 8         ...\n 9     }\n10 }\n```\n\n`ui/utils/DelegatesExt.kt`\n\
    \nThis delegate can work with any non-nullable type. It receives a reference of\
    \ an object of any type, and use `T` as the type of the getter and the setter.\
    \ Now we need to implement the methods:\n\n- The getter returns a value if it\
    \ is assigned; otherwise, it throws an exception.\n- The setter assigns the value\
    \ if it is still null; otherwise, it throws an exception.\n\n```\n 1 class NotNullSingleValueVar<T>\
    \ {\n 2 \n 3     private var value: T? = null\n 4 \n 5     operator fun getValue(thisRef:\
    \ Any?, property: KProperty<*>): T =\n 6         value ?: throw IllegalStateException(\"\
    ${property.name} \" +\n 7                 \"not initialized\")\n 8     }\n 9 \n\
    10     operator fun setValue(thisRef: Any?, property: KProperty<*>, value: T)\
    \ {\n11         this.value = if (this.value == null) value\n12         else throw\
    \ IllegalStateException(\"${property.name} already initialized\")\n13     }\n\
    14 }\n```\n\n`ui/utils/DelegatesExt.kt`\n\nNow let’s create an object with a function\
    \ that provides your new delegate:\n\n```\n1 object DelegatesExt {\n2     fun\
    \ <T> notNullSingleValue() = NotNullSingleValueVar<T>()\n3 }\n```\n\n`ui/utils/DelegatesExt.kt`\n\
    \nThis last part is not necessary, but it can help you aggregate all the delegates\
    \ you implement.\n\n## 16.5 Reimplementing the App Singleton\n\nDelegates can\
    \ help us in this situation. We know that our singleton is not going to be null,\
    \ but we cannot use the constructor to assign the property. So we can make use\
    \ of a `lateinit` delegate:\n\n```\n 1 class App : Application() {\n 2 \n 3  \
    \   companion object {\n 4         lateinit var instance: App\n 5     }\n 6 \n\
    \ 7     override fun onCreate() {\n 8         super.onCreate()\n 9         instance\
    \ = this\n10     }\n11 }\n```\n\n`ui/App.kt`\n\nThe problem with this solution\
    \ is that we could change the value of this instance from anywhere in the app\
    \ because a `var` property is required if we want to use `lateinit`. That is easy\
    \ to solve by using a private `set`:\n\n```\n1 companion object {\n2     lateinit\
    \ var instance: App\n3         private set\n4 }\n```\n\nNow, the value of the\
    \ instance can only be modified inside the `App` class.\n\nBut we will make use\
    \ of our custom delegate instead:\n\n```\n1 companion object {\n2     var instance:\
    \ App by DelegatesExt.notNullSingleValue()\n3 }\n```\n\n`ui/App.kt`\n\nThough,\
    \ in this case, `lateinit` is probably the simplest option, I wanted to show you\
    \ how to create a custom property delegate and use it in your code.\n\nTake a\
    \ look at the specific [branch of this chapter](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-16)\
    \ if you have any doubts.\n\n## 17 Creating an SQLiteOpenHelper\n\nAs you may\
    \ know, Android uses `SQLite` as a database management system. `SQLite` is a database\
    \ embedded into the app, and it is lightweight. That is why it is the good option\
    \ for mobile apps.\n\nHowever, the API to work with databases in Android is somewhat\
    \ raw. You will see you need to write many SQL sentences and map your objects\
    \ into `ContentValue`s or from `Cursor`s. Thankfully, by using a mix of Kotlin\
    \ and Anko, we are simplifying this task a lot.\n\nOf course, there are many libraries\
    \ to work with databases in Android, and all of them work in Kotlin thanks to\
    \ its interoperability. However, it is possible you can avoid using complicated\
    \ frameworks if the database is simple, as we are going to see in a minute.\n\n\
    ## 17.1 ManagedSqliteOpenHelper\n\nAnko provides a powerful `SqliteOpenHelper`\
    \ which simplifies things a lot. When we use a regular `SqliteOpenHelper`, we\
    \ need to call `getReadableDatabase()` or `getWritableDatabase()`, and then we\
    \ can perform our queries over the object we get. After that, we should not forget\
    \ to call `close()`. With a `ManagedSqliteOpenHelper` we just do:\n\n```\n1 forecastDbHelper.use\
    \ {\n2 ...\n3 }\n```\n\nInside the lambda, we can use `SqliteDatabase` functions\
    \ directly. How does it work? Take a look at the implementation of Anko functions;\
    \ you can learn a good deal of Kotlin from them:\n\n```\n1 public fun <T> use(f:\
    \ SQLiteDatabase.() -> T): T {\n2     try {\n3         return openDatabase().f()\n\
    4     } finally {\n5         closeDatabase()\n6     }\n7 }\n```\n\nFirst, `use`\
    \ receives a function and uses it as an extension function for `SQLiteDatabase`.\
    \ Thanks to extensions, we can use `this` inside the braces, and this is referring\
    \ to the `SQLiteDatabase` object. This extension function can return a value,\
    \ so we could do something like:\n\n```\n1 val result = forecastDbHelper.use {\n\
    2     valiedObject\n3 }\n```\n\nKeep in mind that, inside a function, the last\
    \ line represents the returned value. `T` does not have any restrictions, we can\
    \ return any value. Even `Unit` if we do not want to return anything.\n\nBy using\
    \ `try-finally`, the `use` function makes sure the database is closed no matter\
    \ the extended function succeeds or crashes.\n\nBesides, we have a lot of other\
    \ handy extension functions over `SQLiteDatabase` that we will use later. For\
    \ now, let’s define the database tables and implement the `SqliteOpenHelper`.\n\
    \n## 17.2 Tables definition\n\nLet’s create a couple of objects that represent\
    \ our tables. These objects will be helpful to avoid misspelling table or column\
    \ names and repetition. We need two tables: one that saves the info of the city,\
    \ and the other one the forecast for individual days. This second table has a\
    \ foreign key to the first one.\n\n`CityForecastTable` first provides the name\
    \ of the table and then the set of columns it needs: an `id` (which is the zip\
    \ code of the city), the name of the city and the country.\n\n```\n1 object CityForecastTable\
    \ {\n2     const val NAME = \"CityForecast\"\n3     const val ID = \"_id\"\n4\
    \     const val CITY = \"city\"\n5     const val COUNTRY = \"country\"\n6 }\n\
    ```\n\n`data/db/Tables.kt`\n\n`DayForecast` has some more info, so it requires\
    \ the set of columns you can see below. The last column, `cityId`, keeps the id\
    \ of the `CityForecast` where this forecast belongs.\n\n```\n1 object DayForecastTable\
    \ {\n2     const val NAME = \"DayForecast\"\n3     const val ID = \"_id\"\n4 \
    \    const val DATE = \"date\"\n5     const val DESCRIPTION = \"description\"\n\
    6     const val HIGH = \"high\"\n7     const val LOW = \"low\"\n8     const val\
    \ ICON_URL = \"iconUrl\"\n9     const val CITY_ID = \"cityId\"\n10 }\n```\n\n\
    `data/db/Tables.kt`\n"
