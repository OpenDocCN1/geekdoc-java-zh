    \ classes. This is the definition of the domain classes:\n\n```\n1 data class\
    \ ForecastList(val city: String, val country: String, \n2                    \
    \     val dailyForecast:List<Forecast>)\n3 \n4 data class Forecast(val date: String,\
    \ val description: String, val high: Int, \n5                     val low: Int)\n\
    ```\n\ndomain/model/DomainClasses.kt\n\nThese classes will probably need to be\
    \ reviewed in the future when we add more features. For now, the data they keep\
    \ is enough.\n\nClasses must be mapped from the data to the domain model, so the\
    \ next task will be to create a `DataMapper`:\n\n```\n 1 class ForecastDataMapper\
    \ {\n 2 \n 3     fun convertFromDataModel(forecast: ForecastResult): ForecastList\
    \ =\n 4         ForecastList(forecast.city.name, forecast.city.country, \n 5 \
    \            convertForecastListToDomain(forecast.list))\n 6 \n 7     private\
    \ fun convertForecastListToDomain(list: List<Forecast>)\n 8             : List<ModelForecast>\
    \ {\n 9         return list.mapIndexed { i, forecast ->\n10             val dt\
    \ = Calendar.getInstance().timeInMillis + \n11                 TimeUnit.DAYS.toMillis(i.toLong())\n\
    12             convertForecastItemToDomain(forecast.copy(dt = dt)) \n13      \
    \   }\n14     }\n15 \n16     private fun convertForecastItemToDomain(forecast:\
    \ Forecast): ModelForecast {\n17         return ModelForecast(convertDate(forecast.dt),\
    \ \n18                 forecast.weather[0].description, forecast.temp.max.toInt(),\
    \ \n19                 forecast.temp.min.toInt())\n20     }\n21 \n22     private\
    \ fun convertDate(date: Long): String {\n23         val df = DateFormat.getDateInstance(DateFormat.MEDIUM,\
    \ Locale.getDefault())\n24         return df.format(date)\n25     }\n26 }\n```\n\
    \ndomain/mappers/ForecastDataMapper.kt\n\nAs we are using two classes with the\
    \ same name, give a specific name to one of them so that we can avoid writing\
    \ the complete package:\n\n```\n1 import com.antonioleiva.weatherapp.domain.model.Forecast\
    \ as ModelForecast\n```\n\nAnother interesting point about this code is the way\
    \ to convert the forecast list from the data to the domain model:\n\n```\n1 return\
    \ list.mapIndexed { i, forecast -> ... }\n```\n\nWe can loop over the collection\
    \ that easily and return a new list with the converted items. Kotlin provides\
    \ a good set of functional operations over lists, which apply an operation for\
    \ all the items in a list and transform them in any way. Collection operations\
    \ are one of the most powerful features in Kotlin for developers used to Java\
    \ 7\\. We shall take a look at all the different transformations very soon. It\
    \ is important to know they exist because it makes it easier to find places where\
    \ these functions can save much time and boilerplate.\n\nYou may have noticed\
    \ too that I am not using the date, but generating a new one. That is because\
    \ the request returns a date that is difficult to convert correctly to current\
    \ date while not having issues with timezone. As we know that the first day we\
    \ receive is today, we can iterate and build the proper dates this way.\n\nAnd\
    \ now, everything is ready to write the command:\n\n```\n1 class RequestForecastCommand(private\
    \ val zipCode: String) :\n2         Command<ForecastList> {\n3     override fun\
    \ execute(): ForecastList {\n4         val forecastRequest = ForecastRequest(zipCode)\n\
    5         return ForecastDataMapper().convertFromDataModel(\n6               \
    \  forecastRequest.execute())\n7     }\n8 }\n```\n\ndomain/commands/RequestForecastCommand.kt\n\
    \n### 10.3 Drawing the data in the UI\n\n`MainActivity` code changes a little,\
    \ because now we have real data to fill the adapter. The asynchronous call needs\
    \ to be rewritten:\n\n```\n1 doAsync() {\n2     val result = RequestForecastCommand(\"\
    94043\").execute()\n3     uiThread {\n4         forecastList.adapter = ForecastListAdapter(result)\n\
    5     }\n6 }\n```\n\nui/activities/MainActivity.kt\n\nThe adapter requires some\
    \ modifications too:\n\n```\n 1 class ForecastListAdapter(private  val weekForecast:\
    \ ForecastList) : \n 2         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>()\
    \ {\n 3 \n 4     override fun onCreateViewHolder(parent: ViewGroup, viewType:\
    \ Int): \n 5             ViewHolder? {\n 6         return ViewHolder(TextView(parent.getContext()))\n\
    \ 7     }\n 8 \n 9     override fun onBindViewHolder(holder: ViewHolder, \n10\
    \             position: Int) {\n11         with(weekForecast.dailyForecast[position])\
    \ {\n12             holder.textView.text = \"$date - $description - $high/$low\"\
    \n13         }\n14     }\n15 \n16     override fun getItemCount(): Int = weekForecast.dailyForecast.size\n\
    17 \n18     class ViewHolder(val textView: TextView) : RecyclerView.ViewHolder(textView)\n\
    19 }\n```"
