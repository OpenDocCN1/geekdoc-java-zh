    \ threads then? Not exactly. They work similarly, but are much more lightweight\
    \ and efficient. You can have millions of coroutines running on a few threads,\
    \ which opens a world of possibilities.\n\nThere are three ways you can make use\
    \ of the coroutines feature:\n\n*   Raw implementation: it means building your\
    \ way to use coroutines. This is quite complex and usually not required at all.\n\
