  trans: "\n\n好的，之前的解释对于 Kotlin 代码来说运行得非常完美。但对于通用的 Java 库，特别是 Android SDK 又是怎样的？在\
    \ Java 中，根据定义，每个对象都可以为 `null`。因此，我们必须处理许多在现实生活中永远不会为 `null` 但可能为空的变量。这意味着我们的代码可能会出现成百个\
    \ `!!` 运算符，这完全不是一个好主意。\n\n当你处理 Android SDK 时，可能会发现当使用 Java 方法时，某些参数被标记为单叹号 `!`。例如，在\
    \ Java 中获取 `Object` 的方法在 Kotlin 中被表示为 `Any!`。这个特殊的运算符表示，由开发者来决定该变量是否应该为 `null`。\n\
    \n幸运的是，最新版本的 Android 框架和支持库开始使用 `@Nullable` 和 `@NonNull` 注解来标识可以为 `null` 的参数或可以返回\
    \ `null` 的函数，Kotlin 编译器可以检测到这一点并选择将其翻译成 Kotlin 语言。\n\n尽管如此，如果我们正在为一个 `Activity`\
    \ 重写 `onCreate`，我们需要将 `savedInstanceState` 标记为可空：\n\n```\n1 override fun onCreate(savedInstanceState:\
    \ Bundle?) {\n2 }\n```\n\n否则，它将显示错误。我们无法使用这种实现：\n\n```\n1 override fun onCreate(savedInstanceState:\
    \ Bundle) {\n2 }\n```\n\n这太棒了，因为活动可以接收一个 `null` bundle，而我们免费获得了正确的实现。然而，SDK 的某些部分仍然缺少注解。所以，当你产生疑问时，你只需要使用可空对象并处理可能的\
    \ `null`。记住，如果你使用 `!!`，是因为你确定该对象不为 `null`，所以你可以直接将其声明为非空。\n\n## 21 创建用于数据访问的业务逻辑\n\
    \n在实现了对服务器的访问以及与数据库交互的方法后，是时候将这些内容整合在一起了。逻辑步骤如下：\n\n1. 从数据库请求所需数据\n2. 检查对应周次是否有数据\n\
    3. 如果找到了所需数据，则将其返回，以便 UI 进行渲染\n4. 否则，它向服务器请求数据\n5. 将结果保存到数据库中并返回，以便 UI 进行渲染\n\n\
    我们的命令不应该处理所有这些逻辑。数据源是一个实现细节，很可能需要逻辑修改，因此添加一些额外的代码将命令从数据访问中抽象出来似乎是一个好主意。在我们的实现中，它将遍历源列表，直到找到适当的结果。\n\
    \n让我们从指定任何想要被我们的提供者（provider）使用的数据源实现的接口开始：\n\n```\n1 interface ForecastDataSource\
    \ {\n2     fun requestForecastByZipCode(zipCode: Long, date: Long): ForecastList?\n\
    3 }\n```\n\n提供者需要一个接收邮政编码和日期的函数，它应该返回从那天开始的每周预报。\n\n```\n1 class ForecastProvider(private\
    \ val sources: List<ForecastDataSource> =\n2         ForecastProvider.SOURCES)\
    \ {\n3 \n4     companion object {\n5         const val DAY_IN_MILLIS = 1000 *\
    \ 60 * 60 * 24\n6         val SOURCES = listOf(ForecastDb(), ForecastServer())\n\
    7     }\n8 ...\n9 }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\n预报提供者接收源列表，这再次可以通过构造函数指定（例如为了测试目的），但我将其设置为在伴对象中定义的\
    \ `SOURCES` 列表。它将使用一个数据库源和一个服务器源。顺序至关重要，因为它会遍历这些源，当任何一个源返回有效结果时搜索将停止。逻辑顺序是先在本地（数据库）搜索，然后通过\
    \ API 搜索。\n\n所以主方法看起来如下：\n\n```\n1 fun requestByZipCode(zipCode: Long, days: Int):\
    \ ForecastList\n2             = sources.firstResult { requestSource(it, days,\
    \ zipCode) }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\n它获取第一个非 `null`\
    \ 的结果。在搜索第 18 章解释的函数操作符列表时，我没有找到一个完全符合我要求的。因此，由于我们可以访问 Kotlin 源码，我直接复制了 `first`\
    \ 函数并对其进行了修改以符合预期：\n\n```\n1 inline fun <T, R : Any> Iterable<T>.firstResult(predicate:\
    \ (T) -> R?): R {\n2     for (element in this) {\n3         val result = predicate(element)\n\
    4         if (result != null) return result\n5     }\n6     throw NoSuchElementException(\"\
    No element matching predicate was found.\")\n7 }\n```\n\n`extensions/CollectionsExtensions.kt`\n\
    \n该函数接收一个谓词（predicate），该谓词接收一个类型为 `T` 的对象并返回一个类型为 `R?` 的值。泛型指定了谓词可以返回 `null`，但我们的\
    \ `firstResult` 函数不能。这就是它返回类型为 `R` 值的原因。\n\n它是如何工作的？它遍历 `Iterable` 集合中的元素执行谓词。当谓词的结果为空时，返回该结果。\n\
    \n如果我们想包含所有源都返回 `null` 的情况，我们可以派自 `firstOrNull` 函数。区别在于最后一行返回 `null` 而不是抛出异常。但我这段代码中没有处理这些细节。\n\
    \n在我们的示例中 `T = ForecastDataSource`，`R = ForecastList`。但记住 `ForecastDataSource`\
    \ 中指定的函数返回 `ForecastList?`，这等于 `R?`，所以一切都是匹配的。`requestSource` 让之前的函数更具可读性：\n\n\
    ```\n1 fun requestSource(source: ForecastDataSource, days: Int,\n2         zipCode:\
    \ Long): ForecastList? {\n3     val res = source.requestForecastByZipCode(zipCode,\
    \ todayTimeSpan())\n4     return if (res != null && res.size >= days) res else\
    \ null\n5 }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\n执行请求并仅在结果不为 `null`\
    \ 且天数匹配时返回。否则，源没有最新的数据返回。\n\n`todayTimeSpan()` 计算当天的毫秒数，消除“时间”偏移，只保留日期。某些源（在我们案例中是数据库）可能需要它。除非我们指定，否则它在服务器那里会被忽略。\n\
    \n```\n1 private fun todayTimeSpan() = System.currentTimeMillis() /\n2     DAY_IN_MILLIS\
    \ * DAY_IN_MILLIS\n```\n\n`domain/datasource/ForecastProvider.kt`\n\n该类的完整代码如下：\n\
    \n```\n1 class ForecastProvider(private val sources: List<ForecastDataSource>\
    \ =\n2         ForecastProvider.SOURCES) {\n3 \n4     companion object {\n5  \
    \       const val DAY_IN_MILLIS = 1000 * 60 * 60 * 24\n6         val SOURCES =\
    \ listOf(ForecastDb(), ForecastServer())\n7     }\n8 \n9     fun requestByZipCode(zipCode:\
    \ Long, days: Int): ForecastList\n10             = sources.firstResult { requestSource(it,\
    \ days, zipCode) }\n11 \n12     private fun requestSource(source: ForecastDataSource,\
    \ days: Int,\n13             zipCode: Long): ForecastList? {\n14         val res\
    \ = source.requestForecastByZipCode(zipCode, todayTimeSpan())\n15         return\
    \ if (res != null && res.size >= days) res else null\n16     }\n17 \n18     private\
    \ fun todayTimeSpan() = System.currentTimeMillis() /\n19             DAY_IN_MILLIS\
    \ * DAY_IN_MILLIS\n20 }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\n我们已经定义了\
    \ `ForecastDb`。它现在需要实现 `ForecastDataSource`。\n\n"
