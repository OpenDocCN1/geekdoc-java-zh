  trans: "\n`SqliteOpenHelper` 只是一个工具，是面向对象世界和 SQL 世界之间的桥梁。我们在一个新的类中使用它，来请求已保存到数据库中的数据，并保存新数据。该类的定义使用了\
    \ `ForecastDbHelper` 和 `DataMapper`，后者负责将数据库类转换为领域模型。我仍然使用默认值作为一种简便依赖注入方式：\n\n\
    ```\n1 class ForecastDb(\n2     private val forecastDbHelper: ForecastDbHelper\
    \ = ForecastDbHelper.instance,\n3     private val dataMapper: DbDataMapper = DbDataMapper())\
    \ {\n4          ...\n5 }\n```\n\n`data/db/ForecastDb.kt`\n\n这两个函数都会调用 `use()`，也就是我们在上一章节中见过的函数。Lambda\
    \ 表达式返回的值将作为我们函数的结果。因此，让我们定义一个根据邮政编码和日期请求预报的函数：\n\n```\n1 fun requestForecastByZipCode(zipCode:\
    \ Long, date: Long) = forecastDbHelper.use {\n2     ....\n3 }\n```\n\n`data/db/ForecastDb.kt`\n\
    \n这里没什么好解释的：我们将 `use` 函数的结果作为我们函数的结果返回。\n\n### 请求预报\n\n需要完成的请求是每日预报，因为我们需要该列表来创建城市对象。Anko\
    \ 提供了一个简单的请求构建器，让我们利用起来吧：\n\n```\n1 val dailyRequest = \"${DayForecastTable.CITY_ID}\
    \ = ? \" + \n2     \"AND ${DayForecastTable.DATE} >= ?\"\n3     \n4 val dailyForecast\
    \ = select(DayForecastTable.NAME)\n5         .whereSimple(dailyRequest, zipCode.toString(),\
    \ date.toString())\n6         .parseList { DayForecast(HashMap(it)) }\n```\n\n\
    `data/db/ForecastDb.kt`\n\n第一行 `dailyRequest` 是查询的 `where` 部分。这是 `whereSimple`\
    \ 函数需要的第一个参数，与我们通常使用该 helper 时的操作非常相似。还有一个简单称为 `where` 的函数，它接收一些标签和值并进行匹配。我不认为它非常有用，因为我觉得它增加了更多的样板代码，尽管它具有将值解析为我们所需的\
    \ `String` 的优点。下面的片段展示了使用它时看起来是什么样的：\n\n```\n1 val dailyRequest = \"${DayForecastTable.CITY_ID}\
    \ = {id}\" + \n2 \"AND ${DayForecastTable.DATE} >= {date}\"\n3 \n4 val dailyForecast\
    \ = select(DayForecastTable.NAME)\n5         .where(dailyRequest, \"id\" to zipCode,\
    \ \"date\" to date)\n6         .parseList { DayForecast(HashMap(it)) }\n```\n\n\
    `data/db/ForecastDb.kt`\n\n你可以选择你偏好的方式。`select` 函数非常简单，它只是请求表名。`parse` 方法是魔法发生的地方。在这种情况下，我们使用函数\
    \ `parseList`，它假设我们正在请求一个项目列表。它使用 `RowParser` 或 `MapRowParser` 将游标（cursor）转换为对象列表。两者的区别在于\
    \ `RowParser` 依赖于列的顺序，而 `MapRowParser` 使用列名作为 map 的键。\n\n这两个重载方法之间存在冲突，因此我们无法直接使用那种避免了显式创建对象的简化方法。这种冲突可以通过实现一个扩展函数来解决。我正在创建一个接收\
    \ lambda 并返回 `MapRowParser` 的函数。解析器将使用该 lambda 来创建对象：\n\n```\n1 fun <T : Any>\
    \ SelectQueryBuilder.parseList(\n2     parser: (Map<String, Any?>) -> T): List<T>\
    \ =\n3         parseList(object : MapRowParser<T> {\n4             override fun\
    \ parseRow(columns: Map<String, Any?>): T = parser(columns)\n5         })\n```\n\
    \n`extensions/DatabaseExtensions.kt`\n\n如果你还没有完全理解它，可以在我们深入研究泛型后再回来。上一个函数有助于将\
    \ `parseList` 请求简化为：\n\n```\n1 parseList { DayForecast(HashMap(it)) }\n```\n\n\
    解析器接收到的不可变 map 通过使用 `HashMap` 相应的构造函数转换为可变 map（我们在数据库模型中需要它是可变的）。这个 `HashMap`\
    \ 被 `ForecastDb` 的构造函数使用。\n\n因此，为了理解幕后发生了什么，请求返回一个 `Cursor`。`parseList` 遍历它并从\
    \ `Cursor` 中获取行直到到达最后一行。对于每一行，它创建一个以列为键的 map，并将值分配给相应的键。然后将该 map 返回给解析器。\n\n如果请求没有结果，`parseList`\
    \ 返回一个空列表。\n\n下标将以类似的方式请求城市：\n\n```\n1 val city = select(CityForecastTable.NAME)\n\
    2         .whereSimple(\"${CityForecastTable.ID} = ?\", zipCode.toString())\n\
    3         .parseOpt { CityForecast(HashMap(it), dailyForecast) }\n```\n\n`data/db/ForecastDb.kt`\n\
    \n这里的区别是：我们改用 `parseOpt`。此函数返回一个可空对象。结果可能是 `null` 或单个对象，取决于请求是否在数据库中找到内容。另一个名为\
    \ `parseSingle` 的函数本质上与它相同，但返回的是一个非可空对象。所以，如果它没有找到行，它会抛出异常。在我们的情况下，由于城市可能不存在，所以我们使用\
    \ `parseOpt`。\n\n```\n1 fun <T : Any> SelectQueryBuilder.parseOpt(\n2     parser:\
    \ (Map<String, Any?>) -> T): T? =\n3         parseOpt(object : MapRowParser<T>\
    \ {\n4             override fun parseRow(columns: Map<String, Any?>): T = parser(columns)\n\
    5         })\n```\n\n`extensions/DatabaseExtensions.kt`\n\n最后，如果返回的城市不空，我们将将其转换为领域对象并返回。否则，我们直接返回\
    \ `null`。\n\n```\n1 if (city != null) dataMapper.convertToDomain(city) else null\n\
    ```\n\n`data/db/ForecastDb.kt`\n\n`DataMapper` 函数非常简单：\n\n```\n1 fun convertToDomain(forecast:\
    \ CityForecast) = with(forecast) {\n2     val daily = daily.map { convertDayDomain(it)\
    \ }\n3     ForecastList(_id, city)\n4 }\n5\n6 private fun convertDayDomain(dayForecast:\
    \ DayForecast) = with(dayForecast) {\n7     Forecast(date, description, high,\
    \ low, iconUrl)\n8 }\n```\n\n`data/db/DataMapper.kt`\n\n所以完整的函数是这样的：\n\n```\n\
    1 fun requestForecastByZipCode(zipCode: Long, date: Long) = forecastDbHelper.use\
    \ {\n2 \n3     val dailyRequest = \"${DayForecastTable.CITY_ID} = ? \" + \n4 \
    \        \"AND ${DayForecastTable.DATE} >= ?\"\n5     val dailyForecast = select(DayForecastTable.NAME)\n\
    6             .whereSimple(dailyRequest, zipCode.toString(), date.toString())\n\
    7             .parseList { DayForecast(HashMap(it)) }\n8 \n9     val city = select(CityForecastTable.NAME)\n\
    10             .whereSimple(\"${CityForecastTable.ID} = ?\", zipCode.toString())\n\
    11             .parseOpt { CityForecast(HashMap(it), dailyForecast) }\n12 \n13\
    \     if (city != null) dataMapper.convertToDomain(city) else null\n14 }\n```\n\
    \n`data/db/ForecastDb.kt`\n\n这里没有展示 Anko 的另一个有趣功能：你可以使用 `classParser()` 而不是我们使用的\
    \ `MapRowParser`，它通过反射根据列名填充类。我更喜欢另一种方法，因为我们不需要反射并且对转换有更多的控制，但它在以后可能对你有用。\n\n\
    ### 保存预报\n\n`saveForecast` 函数清除数据库中的数据以便我们保存新数据，将领域预报模型转换为数据库模型，并插入每个每日预报和城市预报。结构与之前的类似：它返回数据库\
    \ helper 中 `use` 函数的值。在这种情况下，我们不需要结果，所以它将返回 `Unit`。\n\n```\n1 fun saveForecast(forecast:\
    \ ForecastList) = forecastDbHelper.use {\n2     ...\n3 }\n```\n\n`data/db/ForecastDb.kt`\n"
- fmt: "\nFirst, we clear both tables. Anko does not provide any beautiful way to\
    \ do it, so we are creating an extension function for `SQLiteDatabase` that executes\
    \ the proper SQL query for us:\n\n```\n1 fun SQLiteDatabase.clear(tableName: String)\
    \ {\n2     execSQL(\"delete from $tableName\")\n3 }\n```\n\n`extensions/DatabaseExtensions.kt`\n\
    \nThe function is applied to both tables:\n\n```\n1 clear(CityForecastTable.NAME)\n\
    2 clear(DayForecastTable.NAME)\n```\n\n`data/db/ForecastDb.kt`\n\nNow it is time\
    \ to convert the data, and use the result to execute the `insert` queries. The\
    \ `with` function may help us:\n\n```\n1 with(dataMapper.convertFromDomain(forecast))\
    \ {\n2      ...\n3 }\n```\n\n`data/db/ForecastDb.kt`\n\nThe conversion from the\
    \ domain model is straightforward too:\n\n```\n1 fun convertFromDomain(forecast:\
    \ ForecastList) = with(forecast) {\n2     val daily = dailyForecast.map { convertDayFromDomain(id,\
    \ it) }\n3     CityForecast(id, city, country, daily)\n4 }\n5 \n6 private fun\
    \ convertDayFromDomain(cityId: Long, forecast: Forecast) = \n7     with(forecast)\
    \ {\n8         DayForecast(date, description, high, low, iconUrl, cityId)\n9 }\n\
    ```\n\n`data/db/DbDataMapper.kt`\n\nInside the block, we can use `dailyForecast`\
    \ and `map` without the need of referring to a variable, just like if we were\
    \ inside the class. We are using another Anko function for the insertion, which\
    \ asks for a table name and a `vararg` of `Pair<String, Any>`. The function will\
    \ convert the `vararg` to the `ContentValues` object the Android SDK needs. So\
    \ our task consists of transforming the `map` into a `vararg` array. We are creating\
    \ another extension function for `Map` to do that:\n\n```\n1 fun <K, V : Any>\
    \ MutableMap<K, V?>.toVarargArray(): \n2     Array<out Pair<K, V>> =  map({ Pair(it.key,\
    \ it.value!!) }).toTypedArray()\n```\n\n`extensions/CollectionExtensions.kt`\n\
    \nIt works over a `Map` with nullable values (this was a condition from the map\
    \ delegate) and converts it to an `Array` with non-nullable values (`select` function\
    \ requisite) of pairs. Another complex one you do not need to understand yet.\
    \ I will be covering nullity soon.\n\nSo, with this new function we can do:\n\n\
    ```\n1 insert(CityForecastTable.NAME, *map.toVarargArray())\n```\n\n`data/db/ForecastDb.kt`\n\
    \nIt inserts a new row in the `CityForecast` table. The `*` used before the result\
    \ of `toVarargArray` indicates that the array is decomposed to a `vararg` parameter.\
    \ This is done automatically in Java, but we need to make it explicit in Kotlin.\n\
    \nAnd the same for each daily forecast:\n\n```\n1 dailyForecast.forEach { insert(DayForecastTable.NAME,\
    \ *it.map.toVarargArray()) }\n```\n\n`data/db/ForecastDb.kt`\n\nSo, with the use\
    \ of maps, we have been able to convert classes to database registers and vice-versa\
    \ in an effortless way. Once we have these extension functions ready, we can use\
    \ them for other projects, so it is a well-paid effort.\n\nThe complete code of\
    \ this function:\n\n```\n 1 fun saveForecast(forecast: ForecastList) = forecastDbHelper.use\
    \ {\n 2 \n 3     clear(CityForecastTable.NAME)\n 4     clear(DayForecastTable.NAME)\n\
    \ 5 \n 6     with(dataMapper.convertFromDomain(forecast)) {\n 7         insert(CityForecastTable.NAME,\
    \ *map.toVarargArray())\n 8         dailyForecast forEach { \n 9             insert(DayForecastTable.NAME,\
    \ *it.map.toVarargArray()) \n10         }\n11     }\n12 }\n```\n\n`data/db/ForecastDb.kt`\n\
    \nMuch new code was involved in this chapter, so you can take a look at the [repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-19)\
    \ to review it.\n\n# Null Null safety in Kotlin\n\nNull-safety is one of the most\
    \ exciting features in Kotlin when you come from Java 7. However, as you have\
    \ seen during this book, it is so implicit in the language we hardly had to worry\
    \ about it until the previous chapter.\n\nBeing `null` considered the [billion-dollar\
    \ mistake by its creator](https://en.wikipedia.org/wiki/Tony_Hoare), it is true\
    \ that we sometimes need to define whether a variable contains a value or not.\
    \ In Java, though annotations and IDEs are helping a lot these days, we can still\
    \ do something like:\n\n```\n1 Forecast forecast = null;\n2 forecast.toString();\n\
    ```\n\nThis code compiles correctly (you may get a warning from the IDE), and\
    \ when it runs, it naturally throws a `NullPointerException`. This is unsafe,\
    \ and even if you think that you could be able to have everything under control,\
    \ as the code grows you will start losing track of the things that could be null.\
    \ So we end up with lots of `NullPointerException`s or lots of nullity checks\
    \ (probably a mix of both).\n\n## 20.1 How Null types work\n\nMost modern languages\
    \ solve this issue in some way. Kotlin, the same as other similar languages such\
