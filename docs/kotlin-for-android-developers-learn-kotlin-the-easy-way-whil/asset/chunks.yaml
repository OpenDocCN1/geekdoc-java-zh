  trans: "\n\n`ui/adapters/ForecastListAdapter.kt`\n\n本章包含一些新代码，欢迎随时在[仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-10)中查看。\n\
    \n# 11 运算符重载\n\nKotlin 允许我们在任何类中使用一组固定数量的符号运算符。这些符号映射到特定的函数，而该函数提供了运算符所使用的逻辑。通过重载这些运算符，可以提高你代码的可读性和简洁性。\n\
    \n若要通知编译器你想要重载某个运算符，必须使用 `operator` 饰符对函数进行标记。\n\n## 11.1 运算符列表\n\n在这里，你可以看到一组表格，其中包含一个运算符及其对应的函数。必须实现一个同名的函数，才能在特定类中启用该运算符的使用。\n\
    \n#### 一元操作\n\n| `+a` | `a.unaryPlus()` |\n| :--- | :--- |\n| `-a` | `a.unaryMinus()`\
    \ |\n| `!a` | `a.not()` |\n| `a++` | `a.inc()` |\n| `a–` | `a.dec()` |\n\n####\
    \ 二元操作\n\n| `a + b` | `a.plus(b)` |\n| :--- | :--- |\n| `a - b` | `a.minus(b)`\
    \ |\n| `a * b` | `a.times(b)` |\n| `a / b` | `a.div(b)` |\n| `a % b` | `a.mod(b)`\
    \ |\n| `a..b` | `a.rangeTo(b)` |\n| `a in b` | `b.contains(a)` |\n| `a !in b`\
    \ | `!b.contains(a)` |\n| `a += b` | `a.plusAssign(b)` |\n| `a -= b` | `a.minusAssign(b)`\
    \ |\n| `a *= b` | `a.timesAssign(b)` |\n| `a /= b` | `a.divAssign(b)` |\n| `a\
    \ %= b` | `a.modAssign(b)` |\n\n#### 数组类操作\n\n| `a[i]` | `a.get(i)` |\n| :---\
    \ | :--- |\n| `a[i, j]` | `a.get(i, j)` |\n| `a[i_1, …, i_n]` | `a.get(i_1, …,\
    \ i_n)` |\n| `a[i] = b` | `a.set(i, b)` |\n| `a[i, j] = b` | `a.set(i, j, b)`\
    \ |\n| `a[i_1, …, i_n] = b` | `a.set(i_1, …, i_n, b)` |\n\n#### 等于操作\n\n| `a ==\
    \ b` | `a?.equals(b) ?: b === null` |\n| :--- | :--- |\n| `a != b` | `!(a?.equals(b)\
    \ ?: b === null)` |\n\n`equals` 操作稍有不同，因为它们使用了更复杂的转换来执行正确的等性检查，并且它们期望精确的函数规范，而不仅仅是特定的名称。函数必须按照如下方式实现：\n\
    \n```\n1 operator fun equals(other: Any?): Boolean\n```\n\n运算符 `===` 和 `!==` 执行身份检查（它们在\
    \ Java 中分别对应 `==` 和 `!=`）且不能重载。\n\n#### 函数调用\n\n| `a(i)` | `a.invoke(i)` |\n|\
    \ :--- | :--- |\n| `a(i, j)` | `a.invoke(i, j)` |\n| `a(i_1, …, i_n)` | `a.invoke(i_1,\
    \ …, i_n)` |\n\n## 11.2 示例\n\n正如你所想象的，Kotlin 列表在标准库中实现了数组类操作，因此我们可以像访问 Java 数组一样访问列表项。但功能不止于此：在可变列表中，你还可以使用相同的运算符为某个位置赋值：\n\
    \n```\n1 val x = myList[2]\n2 myList[2] = 4\n```\n\n如果你还记得的话，我们有一个名为 `ForecastList`\
    \ 的数据类，它由一个包含一些额外信息的列表组成。直接访问它的项，而不是请求其内部列表来获取项，将会很有趣。顺便提一下，我还将实现一个 `size` 属性，这会进一步简化当前的适配器：\n\
    \n```\n1 data class ForecastList(val city: String, val country: String, \n2  \
    \   private val dailyForecast: List<Forecast>) {\n3     \n4     val size: Int\n\
    5     get() = dailyForecast.size\n6 \n7     operator fun get(position: Int): Forecast\
    \ = dailyForecast[position]\n8 }\n```\n\n`domain/model/DomainClasses.kt`\n\n这让我们的\
    \ `onBindViewHolder` 变得简单了一些：\n\n```\n1 override fun onBindViewHolder(holder:\
    \ ViewHolder, position: Int) {\n2     with(weekForecast[position]) {\n3      \
    \   holder.textView.text = \"$date - $description - $high/$low\"\n4     }\n5 }\n\
    ```\n\n`ui/adapters/ForecastListAdapter.kt`\n\n以及 `getItemCount()` 函数：\n\n```\n\
    1 override fun getItemCount(): Int = weekForecast.size\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\
    \n## 11.3 扩展函数\n\n除了类类，我们还可以为第三方库的类提供扩展操作。例如，我们可以像访问列表一样访问 `ViewGroup`：\n\n```kotlin\n\
    1 operator fun ViewGroup.get(position: Int): View\n```\n\n现在通过位置获取 `ViewGroup`\
    \ 视图变得非常简单：\n\n## 12 制作布局\n\n布局需要一些工作才能准备就。首先是创建一个显示图标、日期、最高和最低温度的布局。对于 `forecast`：\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\n    xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
    \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:gravity=\"center_vertical\"\n    android:orientation=\"horizontal\"\
    >\n\n    <ImageView\n        android:id=\"@+id/icon\"\n        android:layout_width=\"\
    48dp\"\n        android:layout_height=\"48dp\"\n        tools:src=\"@mipmap/launcher\"\
    />\n\n    <LinearLayout\n        android:layout_width=\"0dp\"\n        android:layout_height=\"\
    wrap_content\"\n        android:layout_weight=\"1\"\n        android:gravity=\"\
    center_horizontal\"\n        android:orientation=\"vertical\">\n\n        <TextView\n\
    \            android:id=\"@+id/date\"\n            android:layout_width=\"match_parent\"\
    \n            android:layout_height=\"wrap_content\"\n            android:textAppearance=\"\
    @style/Medium\"\n            tools:text=\"May 14, 2015\"/>\n\n        <TextView\n\
    \            android:id=\"@+id/description\"\n            android:layout_width=\"\
    match_parent\"\n            android:layout_height=\"wrap_content\"\n         \
    \   android:textAppearance=\"@style/Caption\"\n            tools:text=\"Light\
    \ Rain\"/>\n    </LinearLayout>\n\n    <TextView\n        android:id=\"@+id/maxTemperature\"\
    \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
    wrap_content\"\n        android:textAppearance=\"@style/Medium\"\n        tools:text=\"\
    30\"/>\n\n    <TextView\n        android:id=\"@+id/minTemperature\"\n        android:layout_width=\"\
    wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:textAppearance=\"\
    @style/Caption\"\n        tools:text=\"15\"/>\n\n</LinearLayout>\n```\n\n`layout/item_forecast.xml`\n\
    \n领域模型和数据映射器必须生成完整的图标 URL，以便我们可以加载它：\n\n```kotlin\ndata class Forecast(val date:\
    \ String, val description: String, \n                    val high: Int, val low:\
    \ Int, val iconUrl: String)\n```\n\n`model/DomainClasses.kt`\n\n在 `ForecastDataMapper`\
    \ 中：\n\n```kotlin\nprivate fun convertForecastItemToDomain(forecast: Forecast):\
    \ ModelForecast {\n    return ModelForecast(convertDate(forecast.dt), \n     \
    \       forecast.weather[0].description, forecast.temp.max.toInt(), \n       \
    \     forecast.temp.min.toInt(), generateIconUrl(forecast.weather[0].icon))\n\
    }\n\nprivate fun generateIconUrl(iconCode: String): String \n        = \"http://openweathermap.org/img/w/$iconCode.png\"\
    \n```\n\n`domain/mappers/ForecastDataMapper.kt`\n\n"
- fmt: "\nThe `icon` code we got from the first request is used to compose the complete\
    \ URL for the icon image. The simplest way to load an image is by making use of\
    \ an image loader library. [Picasso](http://square.github.io/picasso/) is an excellent\
    \ option. You must add it to `build.gradle` dependencies:\n\n```\n1 compile \"\
    com.squareup.picasso:picasso:2.5.2\"\n```\n\n`app/build.gradle`\n\nThe adapter\
    \ needs a big rework too. A click listener will be necessary, so let’s define\
    \ it:\n\n```\n1 interface OnItemClickListener {\n2      operator fun invoke(forecast:\
    \ Forecast)\n3 }\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\nIf you remember\
    \ from the last lesson, you can omit the `invoke` method when calling it. So let’s\
    \ use it as a way of simplification. The listener can be called in two ways:\n\
    \n```\n1 itemClick.invoke(forecast)\n2 itemClick(forecast)\n```\n\nThe `ViewHolder`\
    \ will now be responsible of binding the forecast to the new view:\n\n```\n 1\
    \ class ViewHolder(view: View, private val itemClick: OnItemClickListener)\n 2\
    \     : RecyclerView.ViewHolder(view) {\n 3 \n 4     private val iconView = view.find<ImageView>(R.id.icon)\n\
    \ 5     private val dateView = view.find<TextView>(R.id.date)\n 6     private\
    \ val descriptionView = \n 7             view.find<TextView>(R.id.description)\n\
    \ 8     private val maxTemperatureView = \n 9             view.find<TextView>(R.id.maxTemperature)\n\
    10     private val minTemperatureView = \n11             view.find<TextView>(R.id.minTemperature)\n\
    12 \n13     fun bindForecast(forecast: Forecast) {\n14         with(forecast)\
    \ {\n15             Picasso.with(itemView.ctx).load(iconUrl).into(iconView)\n\
    16             dateView.text = date\n17             descriptionView.text = description\n\
    18             maxTemperatureView.text = \"$high\"\n19             minTemperatureView.text\
    \ = \"$low\"\n20             itemView.setOnClickListener { itemClick(this) }\n\
    21         }\n22     }\n23 }\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\n\
    The constructor of the adapter now receives the `itemClick`. The methods for creation\
    \ and binding are simpler:\n\n```\n 1 public class ForecastListAdapter(private\
    \ val weekForecast: ForecastList, \n 2         private val itemClick: ForecastListAdapter.OnItemClickListener)\
    \ :\n 3         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 4 \n\
    \ 5     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): \n\
    \ 6             ViewHolder {\n 7         val view = LayoutInflater.from(parent.ctx)\n\
    \ 8             .inflate(R.layout.item_forecast, parent, false) \n 9 \n10    \
    \     return ViewHolder(view, itemClick)\n11     }\n 12 \n13     override fun\
    \ onBindViewHolder(holder: ViewHolder, position: Int) {\n14         holder.bindForecast(weekForecast[position])\n\
    15     }\n16     ...\n17 }\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\nIf\
    \ you use this code, `parent.ctx` will not compile. Anko provides many extension\
    \ functions to make Android coding simpler. It, for instance, includes a `ctx`\
    \ property for activities and fragments, among others, which returns the context,\
    \ but it lacks the same property for views. So we are going to create a new file\
    \ called `ViewExtensions.kt` inside `ui.utils`, and add this extension property:\n\
    \n```\n1 val View.ctx: Context\n2     get() = context\n```\n\nFrom now on, any\
    \ view can make use of it. It is not necessary at all, because you can use `context`\
    \ synthetic property, but I think it gives some consistency if we are planning\
    \ to use `ctx` in the other classes. Besides, it is another example of how to\
    \ use extension properties.\n\nFinally, the `MainActivity` call to `setAdapter`\
    \ results into this:\n\n```\n1 forecastList.adapter = ForecastListAdapter(result,\n\
    2         object : ForecastListAdapter.OnItemClickListener{\n3             override\
    \ fun invoke(forecast: Forecast) {\n4                 toast(forecast.date)\n5\
    \             }\n6         })\n```\n\n`ui/activities/MainActivity.kt`\n\nAs you\
    \ can see, to implement an anonymous class we, in fact, create an `object` that\
    \ implements the interface we created. That is because we are not making use of\
    \ the power of functional programming, but you will learn how to convert this\
    \ code into something cleaner in the next chapter.\n\nTry the new changes [from\
    \ the repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-12).\n\
    \n## 13 Lambdas\n\nA lambda expression is a simple way to define an anonymous\
    \ function. Lambdas are very useful because they prevent us from having to write\
    \ the specification of the function in an abstract class or interface, and then\
    \ the implementation of the class.\n\nIn Kotlin, lambdas are first class citizens,\
    \ which means that a function behaves as a type: it can be passed as an argument\
    \ to another function, can be returned by a function, saved into a variable or\
    \ a property, etc.\n\n### 13.1 Simplifying setOnClickListener()\n\nLet’s see how\
    \ this works using a typical example in Android: the click listener method from\
    \ a `View`. If we want to implement a click listener behavior in Java, we first\
    \ need to write the `OnClickListener` interface:\n\n```\n1 public interface OnClickListener\
    \ {\n2     void onClick(View v);\n3 }\n```\n\nAnd then we write an anonymous class\
    \ that implements this interface:\n\n```\n1 view.setOnClickListener(new OnClickListener()\
    \ {\n2     @Override\n3     public void onClick(View v) {\n4         Toast.makeText(v.getContext(),\
    \ \"Click\", Toast.LENGTH_SHORT).show();\n5     }\n6 });\n```\n\nThis would be\
    \ the transformation of the code into Kotlin (using `toast` function from Anko):\n\
    \n```\n1 view.setOnClickListener(object : OnClickListener {\n2     override fun\
    \ onClick(v: View) {\n3         toast(\"Click\")\n4     }\n5 })\n```\n\nLuckily,\
    \ Kotlin allows some optimizations over Java libraries, and lambdas can substitute\
    \ any function that receives an interface with a single function. It works as\
    \ if we had defined `setOnclickListener()` like this:\n\n```\n1 fun setOnClickListener(listener:\
    \ (View) -> Unit)\n```\n\nTo define a lambda expression, specify the function\
    \ input arguments to the left of the arrow (surrounded by parentheses), and the\
    \ return type to the right. In this case, we get a `View` and return `Unit` (nothing).\
    \ So with this in mind, we can simplify the previous code:\n\n```\n1 view.setOnClickListener({\
    \ view -> toast(\"Click\")})\n```\n\nNice difference! While defining a function,\
    \ we must use braces and specify the argument values to the left and the body\
    \ of the function to the right. We can even get rid of the left part if the input\
    \ values are not used:\n\n```\n1 view.setOnClickListener({ toast(\"Click\") })\n\
    ```\n\nIf the last argument of a function is also a function, we can move it out\
    \ of the parentheses:\n\n```\n1 view.setOnClickListener() { toast(\"Click\") }\n\
    ```\n\nAnd, finally, if the function is the only parameter, we can get rid of\
    \ the parentheses:\n\n```\n1 view.setOnClickListener { toast(\"Click\") }\n```\n\
    \nMore than five times smaller than the original code in Java, and much easier\
    \ to understand what is doing.\n\n### 13.2 Click listener for ForecastListAdapter\n\
    \nIn the previous chapter, I wrote the click listener the hard way on purpose\
    \ to have a good context to develop this one. But now it is time to put what you\
    \ learnt into practice. We are removing the listener interface from the `ForecastListAdapter`\
    \ and using a lambda instead:\n\n```\n1 public class ForecastListAdapter(private\
    \ val weekForecast: ForecastList,\n2                                  private\
    \ val itemClick: (Forecast) -> Unit)\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\
    \nThe function will receive a forecast and return nothing. The same change can\
    \ be done to the `ViewHolder`:\n\n```\n1 class ViewHolder(view: View, private\
    \ val itemClick: (Forecast) -> Unit)\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\
    \nThe rest of the code remains unmodified. Just a last change to `MainActivity`:\n\
    \n```\n1 val adapter = ForecastListAdapter(result) { forecast -> toast(forecast.date)\
    \ }\n```\n\n`ui/activities/MainActivity.kt`\n"
