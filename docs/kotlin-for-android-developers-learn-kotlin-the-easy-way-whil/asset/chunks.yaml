    \ to read and maintain.\n\nBye bye, callback hell. Check new changes in [chapter-27](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-27)\
    \ branch.\n\n## 28 Testing your App\n\nWe are reaching the end of this trip. You\
    \ already learned most Kotlin features throughout this book, but you are probably\
    \ wondering if you can test your Android Apps using Kotlin exclusively. The answer\
    \ is: of course!\n\nIn Android, we have a couple of different tests: unit and\
    \ instrumentation tests. This book is not meant to teach you how to write tests;\
    \ there are entire books dedicated to that matter. My goal in this chapter is\
    \ to explain how to prepare your environment to be able to write some tests and\
    \ show you that Kotlin also works fine for testing.\n\n### 28.1 Unit testing\n\
    \nI will not get into discussions about what unit testing means. There are many\
    \ definitions out there with some slight differences. A general idea could be\
    \ that unit tests are the tests that validate an individual unit of source code.\
    \ What a ‘unit’ involves is left to the reader. For the sake of simplicity, I\
    \ am defining a unit test as a test that does not need a device to run. The IDE\
    \ can run the tests and show a result that identifies which tests succeeded and\
    \ which ones failed.\n\nUnit testing is usually done using the `JUnit` library.\
    \ So let’s add the dependency to the `build.gradle`. As this dependency is only\
    \ used when running tests, we can use `testImplementation` instead of `implementation`.\
    \ This way, the library is left out for regular compilations, reducing the size\
    \ of the APK:\n\n```\n1 dependencies {\n2     ...\n3     testImplementation \"\
    junit:junit:4.12\"\n4 }\n```\n\napp/build.gradle"
