  raw: "Now sync Gradle to get the library included in your project. In old versions\
    \ of Android Studio, you may need to choose which kind of tests you want to run.\
    \ Go to the ‘Build Variants’ tab (you probably have it on the left side of the\
    \ IDE) and click on ‘Test Artifact’ dropdown. You should choose ‘Unit Tests’ there.\
    \ New Android Studio versions can have both kinds of tests enabled at the same\
    \ time, so this step is not required.\n\nAnother thing you need to do is create\
    \ a new folder. Below `src`, you already probably have `androidTest` and `main`.\
    \ Create another one called `test`, and a folder called `java` below. So now you\
    \ should have a `src/test/java` folder colored in green. This is a good indication\
    \ that the IDE detected that we are in ‘Unit Test’ mode and that this folder contains\
    \ test files.\n\nLet’s write a simple test to check everything works properly.\
    \ Create a new Kotlin class called `SimpleTest` using the proper package (*com.antonioleiva.weatherapp*\
    \ in my case, but you need to use the main package of your app). Once you have\
    \ created the new file, write this simple test:\n\n```\n1 import org.junit.Test\n\
    2 import kotlin.test.assertTrue\n3 \n4 class SimpleTest {\n5     @Test\n6    \
    \ fun `unit testing works`() {\n7         assertTrue(true)\n8     }\n9 }\n```\n\
    \ntest/SimpleTest.kt\n\nUse the `@Test` annotation to identify the function as\
    \ a test. Be sure to use `org.unit.Test`. Then add a simple assertion. It only\
    \ checks that `true` is `true`, which should succeed.\n\nDid you see how I wrote\
    \ the name of the function? If you use backquotes, you can provide a readable\
    \ name for your tests. When tests run in Android Studio, the summary shows texts\
    \ that are much easier to read.\n\nYou will see that these names show an error.\
    \ It is because this format is not available for Android code, so it is not available\
    \ for instrumentation tests. But you can use them without issues in unit tests,\
    \ so you can disable the inspection just for tests and use it safely.\n\nTo execute\
    \ the tests, right click on the new `java` folder you created below `test`, and\
    \ choose ‘Run All Tests’. When the compilation finishes, it will run the test,\
    \ and you will see a summary showing the result. You should notice that your test\
    \ passed.\n\nNow it is time to create some real tests. Everything that deals with\
    \ the Android framework probably needs an instrumentation test or some extra libraries\
    \ such as [Robolectric](http://robolectric.org/). Because of that, in these examples,\
    \ I am testing things that do not use anything from the framework. For instance,\
    \ I will test the extension function that creates a date `String` from a `Long`.\n\
    \nCreate a new file called `ExtensionTests`, and add this tests:\n\n```\n 1 class\
    \ ExtensionsTest {\n 2     @Test\n 3     fun `\"longToDateString\" returns valid\
    \ value`() {\n 4         assertEquals(\"Oct 19, 2015\", 1445275635000L.toDateString())\n\
    \ 5     }\n 6 \n 7     @Test\n 8     fun `\"longToDateString\" with full format\
    \ returns valid value`() {\n 9         assertEquals(\"Monday, October 19, 2015\"\
    , \n10             1445275635000L.toDateString(DateFormat.FULL))\n11     }\n12\
    \ }\n```\n\ntest/ExtensionsTest.kt\n\nThese tests check that a `Long` instance\
    \ is properly converted to a `String`. The first one tests the default behavior\
    \ (which uses `DateFormat.MEDIUM`), while the second one specifies a different\
    \ format. Run the tests and see that all of them pass. I also recommend you to\
    \ change something and see how it crashes.\n\nIf you are used to testing your\
    \ apps in Java, you will see there is not much difference here. I have covered\
    \ a simple example, but from here you can create more complex tests to validate\
    \ other parts of the app. For instance, we could write some tests for `ForecastProvider`.\
    \ We can use `Mockito` library to mock some other classes and be able to test\
    \ the provider independently:\n\n```\n1 buildscript {\n2     ...\n3     ext.mockito_version\
    \ = '2.16.0'\n4 }\n```\n\nbuild.gradle\n\n```\n1 dependencies {\n2     ...\n3\
    \     testImplementation \"junit:junit:4.12\"\n4     testImplementation \"org.mockito:mockito-core:$mockito_version\"\
    \n5 }\n```\n\napp/build.gradle\n\nNow create a `ForecastProviderTest`. We are\
    \ going to test that a `ForecastProvider` with a `DataSource` that returns something\
    \ will get a result that is not null. So first we need to mock a `ForecastDataSource`:\n\
    \n```\n1 val ds = mock(ForecastDataSource::class.java)\n2 `when`(ds.requestDayForecast(0)).then\
    \ {\n3     Forecast(0, 0, \"desc\", 20, 0, \"url\")\n4 }\n```\n\ntest/domain/datasource/ForecastProviderTest.kt\n\
    \nAs you see, we need backquotes for `when` function, because `when` is a reserved\
    \ word in Kotlin. So we need to escape it if we find some Java code that uses\
    \ it.\n\nAn alternative would be to rename the import:\n\n```\n1 import org.mockito.Mockito.`when`\
    \ as whenever\n2 \n3 ...\n4 \n5 whenever(ds.requestDayForecast(0)).then { ...\
    \ }\n```\n\nIt is up to you; I will use the backquotes in this case.\n\nNow we\
    \ create a provider with this data source, and check that the result of the call\
    \ to that method is not null:\n\n```\n1 val provider = ForecastProvider(listOf(ds))\n\
    2 assertNotNull(provider.requestForecast(0))\n```\n\nThis is the complete test\
    \ function:\n\n```\n1 @Test fun  `data source returns a value`() {\n2     val\
    \ ds = mock(ForecastDataSource::class.java)\n3     `when`(ds.requestDayForecast(0)).then\
    \ {\n4         Forecast(0, 0, \"desc\", 20, 0, \"url\")\n5     }\n6 \n7     val\
    \ provider = ForecastProvider(listOf(ds))\n8     assertNotNull(provider.requestForecast(0))\n\
    9 }\n```\n\ntest/domain/datasource/ForecastProviderTest.kt\n\nIf you run this,\
    \ you will see that it crashes. Thanks to this test, we are detecting we have\
    \ something wrong in our code. The test is failing because `ForecastProvider`\
    \ is initializing `SOURCES` inside its companion object before it is used. We\
    \ can add some sources to the `ForecastProvider` through the constructor, and\
    \ this static list would never be used, so it should be lazy loaded:\n\n```\n\
    1 companion object {\n2     val DAY_IN_MILLIS = 1000 * 60 * 60 * 24\n3     val\
    \ SOURCES by lazy { listOf(ForecastDb(), ForecastServer()) }\n4 }\n```\n\ndomain/datasource/ForecastProvider.kt\n\
    \nIf you now run again, you will see it is now passing all the tests.\n\nWe can\
    \ also test, for instance, that when a source returns null, it will iterate over\
    \ the next source to get a result:\n\n```\n 1 @Test fun `empty database returns\
    \ server value`() {\n 2     val db = mock(ForecastDataSource::class.java)\n 3\
    \ \n 4     val server = mock(ForecastDataSource::class.java)\n 5     `when`(server.requestForecastByZipCode(\n\
    \ 6             any(Long::class.java), any(Long::class.java)))\n 7           \
    \  .then {\n 8                 ForecastList(0, \"city\", \"country\", listOf())\n\
    \ 9             }\n10 \n11     val provider = ForecastProvider(listOf(db, server))\n\
    12 \n13     assertNotNull(provider.requestByZipCode(0, 0))\n14 }\n```\n\ntest/domain/datasource/ForecastProviderTest.kt\n\
    \nAs you see, the simple dependency inversion we solved by using default values\
    \ for arguments is enough to let us implement some simple unit tests. There are\
    \ many more things we could test about this provider, but this example is enough\
    \ to show that we can use the basic unit testing tools.\n\n### 28.2 Mocking closed\
    \ classes\n\nIn Kotlin, everything is closed by default, so you may find yourself\
    \ in trouble when you want to mock a class. Mockito cannot mock closed (final)\
    \ classes.\n\nSo imagine we want to test `RequestDayForecastCommand`, and check\
    \ that when its `execute()` method is called, the provider is also called. We\
    \ could do this:\n\n```\n 1 class RequestDayForecastCommandTest {\n 2 \n 3   \
    \  @Test\n 4     fun `provider is called when command is executed`() {\n 5   \
    \      val forecastProvider = mock(ForecastProvider::class.java)\n 6         val\
    \ command = RequestDayForecastCommand(2, forecastProvider)\n 7 \n 8         command.execute()\n\
    \ 9 \n10         verify(forecastProvider).requestForecast(2)\n11     }\n12 }\n\
    ```\n\ntest/domain/commands/RequestDayForecastCommandTest.kt\n\nIf you run this\
    \ test, you will find that it fails:\n\n```\n1 Mockito cannot mock/spy because\
    \ :\n2  - final class \n```"
