    \ property. We have at least a couple of options.\n\nThe first one is to use a\
    \ nullable type and set it to null until we have the real value. With this solution,\
    \ we then need to check everywhere throughout the code whether the property is\
    \ null or not. If we are sure that the property will not be null the first time\
    \ we use it, this may make us write some unnecessary code.\n\nThe second alternative\
    \ is **`lateinit`**, which can be used to identify that the property should have\
    \ a non-nullable value, but we are delaying the assignment. If the value is requested\
    \ before it is assigned, it will throw an exception that identifies the accessed\
    \ property.\n\n**`lateinit`** is not exactly a delegate, but a property modifier,\
    \ and that is why it must be written before the property.\n\nThis modifier is\
    \ helpful in the App singleton example:\n\n```\n 1 class App : Application() {\n\
    \ 2 \n 3     companion object {\n 4         lateinit var instance: App\n 5   \
    \  }\n 6 \n 7     override fun onCreate() {\n 8         super.onCreate()\n 9 \
    \        instance = this\n10     }\n11 }\n```"
