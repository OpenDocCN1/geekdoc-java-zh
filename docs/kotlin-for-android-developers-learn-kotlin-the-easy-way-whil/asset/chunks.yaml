  trans: "\n\n我们从第一个请求中获得的 `icon` 代码用于构建图标图像的完整 URL。加载图像最简单的方法是使用图像加载库。[Picasso](http://square.github.io/picasso/)\
    \ 是一个极佳的选择。你必须将其添加到 `build.gradle` 依赖项中：\n\n```\n1 compile \"com.squareup.picasso:picasso:2.5.2\"\
    \n```\n\n`app/build.gradle`\n\n适配器也需要进行重构。一个点击监听器是必要的，让我们让我们定义它：\n\n```\n1 interface\
    \ OnItemClickListener {\n2      operator fun invoke(forecast: Forecast)\n3 }\n\
    ```\n\n`ui/adapters/ForecastListAdapter.kt`\n\n如果你还记得上节课的内容，调用它时可以省略 `invoke`\
    \ 方法。所以让我们用它作为一种简化方式。监听器可以通过两种方式被调用：\n\n```\n1 itemClick.invoke(forecast)\n2 itemClick(forecast)\n\
    ```\n\n`ViewHolder` 现在将负责将预报绑定到新视图：\n\n```\n 1 class ViewHolder(view: View, private\
    \ val itemClick: OnItemClickListener)\n 2     : RecyclerView.ViewHolder(view)\
    \ {\n 3 \n 4     private val iconView = view.find<ImageView>(R.id.icon)\n 5  \
    \   private val dateView = view.find<TextView>(R.id.date)\n 6     private val\
    \ descriptionView = \n 7             view.find<TextView>(R.id.description)\n 8\
    \     private val maxTemperatureView = \n 9             view.find<TextView>(R.id.maxTemperature)\n\
    10     private val minTemperatureView = \n 11             view.find<TextView>(R.id.minTemperature)\n\
    \ 12 \n 13     fun bindForecast(forecast: Forecast) {\n 14         with(forecast)\
    \ {\n 15             Picasso.with(itemView.ctx).load(iconUrl).into(iconView)\n\
    \ 16             dateView.text = date\n 17             descriptionView.text =\
    \ description\n 18             maxTemperatureView.text = \"$high\"\n 19      \
    \       minTemperatureView.text = \"$low\"\n 20             itemView.setOnClickListener\
    \ { itemClick(this) }\n 22         }\n 22     }\n 23 }\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\
    \n适配器的构造函数现在接收 `itemClick`。创建和绑定的方法变得更了：\n\n```\n 1 public class ForecastListAdapter(private\
    \ val weekForecast: ForecastList, \n 2         private val itemClick: ForecastListAdapter.OnItemClickListener)\
    \ :\n 3         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 4 \n\
    \ 5     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): \n\
    \ 6             ViewHolder {\n 7         val view = LayoutInflater.from(parent.ctx)\n\
    \ 8             .inflate(R.layout.item_forecast, parent, false) \n 9 \n10    \
    \     return ViewHolder(view, itemClick)\n 11     }\n 12 \n 13     override fun\
    \ onBindViewHolder(holder: ViewHolder, position: Int) {\n 14         holder.bindForecast(weekForecast[position])\n\
    \ 15     }\n 16     ...\n 17 }\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\n\
    如果你使用这段代码，`parent.ctx` 将无法编译。Anko 提供了许多扩展函数使 Android 编码更简单。例如，它包含了用于 activity\
    \ 和 fragment 的 `ctx` 属性等，可以返回 context，但它缺少视图的相同属性。因此，我们将在 `ui.utils` 内部创建一个名为\
    \ `ViewExtensions.kt` 的新文件，并添加此扩展属性：\n\n```\n1 val View.ctx: Context\n2     get()\
    \ = context\n```\n\n从现在起，任何视图都可以使用它。这完全没有必要，因为你可以使用 `context` 合成属性，但我认为如果我们计划在其他类中使用\
    \ `ctx`，这样可以提供一些一致性。此外，这是如何使用扩展属性的另一个示例。\n\n最后，`MainActivity` 调用 `setAdapter`\
    \ 的结果如下：\n\n```\n1 forecastList.adapter = ForecastListAdapter(result,\n2     \
    \    object : ForecastListAdapter.OnItemClickListener{\n3             override\
    \ fun invoke(forecast: Forecast) {\n4                 toast(forecast.date)\n5\
    \             }\n6         })\n```\n\n`ui/activities/MainActivity.kt`\n\n如你所见，为了实现匿名类，我们实际上创建了一个实现我们所创建接口的\
    \ `object`。这是因为我们没有利用函数式编程的力量，但你将在下一章中学习如何将此代码转换为更整洁的内容。\n\n尝试来自[仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-12)\
    \ 的新更改。\n\n## 13 Lambda（ 表达式）\n\nLambda 表达式是定义匿名函数的简单方法。Lambda 非常有用，因为它们防止了我们要在抽象类或接口中编写函数规范，然后编写类的实现。\n\
    \n在 Kotlin 中，lambda 是一等公民，这意味着函数表现得像类型一样：它可以被作为参数传递给另一个函数，可以由函数返回，可以保存到变量或属性中等。\n\
    \n### 13.1 简化 setOnClickListener()\n\n让我们通过 Android 中的一个典型示例来看它是如何工作的：来自 `View`\
    \ 的点击监听器方法。如果我们想在 Java 中实现点击监听器行为，首先需要编写 `OnClickListener` 接口：\n\n```java\n1 interface\
    \ OnClickListener {\n2     void onClick(View v);\n3 }\n```\n\n然后编写一个实现该接口的匿名类：\n\
    \n```java\n1 view.setOnClickListener(new OnClickListener() {\n2     @Override\n\
    3     public void onClick(View v) {\n4         Toast.makeText(v.getContext(),\
    \ \"Click\", Toast.LENGTH_SHORT).show();\n5     }\n6 });\n```\n\n这是代码转换为 Kotlin（使用来自\
    \ Anko 的 `toast` 函数）：\n\n```kotlin\n1 view.setOnClickListener(object : OnClickListener\
    \ {\n2     override fun onClick(v: View) {\n3         toast(\"Click\")\n4    \
    \ }\n5 })\n```\n\n幸运的是，Kotlin 对此有一些优化，lambda 可以替代任何接收单个函数的接口。如果我们这样定义 `setOnClickListener()`：\n\
    \n```kotlin\n1 fun setOnClickListener(listener: (View) -> Unit)\n```\n\n要定义 lambda\
    \ 表达式，在箭头左侧（括号内）指定函数参数，在右侧指定类型。在这种情况下，我们得到 `View` 并返回 `Unit`（无）。所以根据此，我们可以简化之前的代码：\n\
    \n```kotlin\n1 view.setOnClickListener({ view -> toast(\"Click\")})\n```\n\n很棒的区别！在定义函数时，我们必须使用大括号并在左侧指定参数值，在右侧指定函数体。如果参数没有被使用，我们甚至可以去掉左部分：\n\
    \n```kotlin\n1 view.setOnClickListener({ toast(\"Click\") })\n```\n\n如果函数的最后一个参数也是函数，我们可以将其从括号中移出：\n\
    \n```kotlin\n1 view.setOnClickListener() { toast(\"Click\") }\n```\n\n最后，如果函数是唯一的参数，我们可以去掉括号：\n\
    \n```kotlin\n1 view.setOnClickListener { toast(\"Click\") }\n```\n\n比原始 Java 代码小了五倍以上，并且更容易理解在做什么。\n\
    \n### 13.2 ForecastListAdapter 的点击监听器\n\n在上一节中，我故意用困难的方法编写点击监听器是为了为开发这一个提供良好的背景。但现在是时候付诸所学了。我们正在从\
    \ `ForecastListAdapter` 中移除监听器接口并改用 lambda：\n\n```kotlin\n1 public class ForecastListAdapter(private\
    \ val weekForecast: ForecastList, \n                                  private\
    \ val itemClick: (Forecast) -> Unit)\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\
    \n该函数将接收一个预报并不返回。相同的更改也可以对 `ViewHolder` 进行：\n\n```kotlin\n1 class ViewHolder(view:\
    \ View, private val itemClick: (Forecast) -> Unit)\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\
    \n其余代码保持不变。只是对 `MainActivity` 的最后更改：\n\n```kotlin\n1 val adapter = ForecastListAdapter(result)\
    \ { forecast -> toast(forecast.date) }\n```\n\n`ui/activities/MainActivity.kt`\n"
- fmt: "\nWe can simplify the last line even more. In lambdas with only one argument,\
    \ we can make use of the `it` reference, which prevents us from defining the left\
    \ part of the function specifically. So we can do:\n\n```kotlin\n1 val adapter\
    \ = ForecastListAdapter(result) { toast(it.date) }\n```\n\n### 13.3 Extending\
    \ the language\n\nThanks to these transformations, we can create our builders\
    \ and code blocks. We have already been using some interesting functions such\
    \ as `with`. Though the one included in the standard library is a little more\
    \ complex, a simpler implementation would be:\n\n```kotlin\n1 inline fun <T> with(t:\
    \ T, body: T.() -> Unit) { t.body() }\n```\n\nThis function gets an object of\
    \ type `T` and a lambda that behaves as an extension function. The implementation\
    \ takes the object and lets it execute the function. As the second parameter of\
    \ the function is another function, it can be brought out of the parentheses,\
    \ so we can create a block of code where we can use `this` and the public properties\
    \ and functions of the object directly:\n\n```kotlin\n1 with(forecast) {\n2  \
    \   Picasso.with(itemView.ctx).load(iconUrl).into(iconView)\n3     dateView.text\
    \ = date\n4     descriptionView.text = description\n5     maxTemperatureView.text\
    \ = \"$high\"\n6     minTemperatureView.text = \"$low\"\n7     itemView.setOnClickListener\
    \ { itemClick(this) }\n8 }\n```\n\nAnother example: we could create blocks of\
    \ code that only run if the version is Lollipop or newer:\n\n```kotlin\n1 inline\
    \ fun supportsLollipop(code: () -> Unit) {\n2     if (Build.VERSION.SDK_INT >=\
    \ Build.VERSION_CODES.LOLLIPOP) {\n3         code()\n4     }\n5 }\n```\n\nThe\
    \ body of the function checks the version and executes the code if it meets the\
    \ requirements. Now we could do:\n\n```kotlin\n1 supportsLollipop {\n2     window.setStatusBarColor(Color.BLACK)\n\
    3 }\n```\n\nFor instance, Anko is also based on this idea to implement the DSL\
    \ for Android layouts. You can also check an example from Kotlin reference, a\
    \ showcase of a [DSL to generate HTML](http://kotlinlang.org/docs/reference/type-safe-builders.html)\
    \ from code.\n\nThe changes from this chapter are [in its corresponding branch](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-13).\n\
    \n## 14 Visibility Modifiers\n\nModifiers are a bit different in Kotlin from how\
    \ we use them in Java. The default modifier in this language is `public`, which\
    \ saves a lot of time and characters. Here it is the long explanation: how do\
    \ visibility modifiers work in Kotlin?\n\n### 14.1 Modifiers\n\n#### private\n\
    \nThe `private` modifier is the most restrictive we can use. It indicates it is\
    \ visible in its file. So if we declare a class as `private`, we are not able\
    \ to use it outside the file where it was defined.\n\nOn the other hand, if we\
    \ use `private` inside a class, the access is restricted to that class. Even classes\
    \ that extend it cannot use it.\n\nSo first level classes, objects, interfaces…\
    \ (known as package members) declared as `private` are only visible inside the\
    \ file where they are declared, while everything defined inside a class or interface\
    \ is only visible by that class or interface.\n\n#### protected\n\nThis modifier\
    \ only applies to members of a class or an interface. A package member cannot\
    \ be `protected`. Inside a member, it works the same way as in Java: it can be\
    \ used by the member itself and the members that extend it (for instance, a class\
    \ and its subclasses).\n\n#### internal\n\nAn internal member is visible inside\
    \ the whole module if it is a package member. If it is a member of another scope,\
    \ it depends on the visibility of the scope. For instance, if we write a private\
    \ class, the access to an `internal` function is limited to the visibility of\
    \ the class.\n\nWe can use internal classes from any other class in the same module,\
    \ but not from another module.\n\n#### public\n\nAs you may guess, this is the\
    \ less restrictive modifier. It is the default modifier, and a member declared\
    \ as `public` is visible anywhere, only restricted by its scope. A public member\
    \ defined in a private class will not be visible outside the scope where the class\
    \ is visible.\n\n### 14.2 Constructors\n\nBy default, all constructors are `public`,\
    \ which means they can be used from any scope where their class is visible. If\
    \ we want to restrict the visibility of a constructor, we can apply modifiers\
    \ to it with this specific syntax:\n\n```kotlin\n1 class C private constructor(a:\
    \ Int) { ... }\n```\n\n### 14.3 Reviewing our code\n\nWe already made use of the\
    \ `public` default modifier, and latest versions of the Kotlin plugin also detect\
    \ when an argument can be private. For instance, in `RequestForecastCommand`,\
    \ we made the `zipCode` property private.\n\n```kotlin\n1 class RequestForecastCommand(private\
    \ val zipCode: String)\n```\n\nBesides, in Kotlin we do not need to specify the\
    \ return type of a function if the compiler can infer it. An example of how we\
    \ can get returning types:\n\n```kotlin\n1 data class(...) {\n2     operator fun\
    \ get(position: Int)\n3 }\n```\n\n## 15 Kotlin Extensions\n\n**Kotlin Extensions**\
    \ is another plugin that the Kotlin team has developed to make Android development\
    \ simpler. The plugin automatically creates properties that give direct access\
    \ to all the views in the XML. It does not require adding libraries.\n\nHow does\
    \ it work under the hood? These properties delegate to functions that request\
    \ the view, and a caching function that prevents from doing `findViewById` every\
    \ time a property is used. Be aware that this caching mechanism only works if\
    \ the receiver is an Activity or a Fragment.\n\n### 15.1 How to use Kotlin Extensions\n\
    \nLet’s see how easy it is. Though the plugin is part of the regular one (it does\
    \ not require to install a new one), if you want to use it you have to add an\
    \ extra `apply` in the Android module:\n\n```gradle\n1 apply plugin: 'com.android.application'\n\
    2 apply plugin: 'kotlin-android'\n3 apply plugin: 'kotlin-android-extensions'\n\
    ```\napp/build.gradle\n\nIf you remember, we already did that at the beginning\
    \ of the book.\n\n#### Recovering views from the XML\n\nFrom this moment, recovering\
    \ a view is as easy as using the view id you defined in the XML directly into\
    \ your activity. Imagine you have an XML like this one:\n\n```xml\n 1 <FrameLayout\n\
    \ 2     xmlns:android=\"http://schemas.android.com/apk/res/android\"\n 3     android:layout_width=\"\
    match_parent\"\n 4     android:layout_height=\"match_parent\">\n 5 \n 6     <TextView\n\
    \ 7         android:id=\"@+id/welcomeMessage\"\n 8         android:layout_width=\"\
    wrap_content\"\n 9         android:layout_height=\"wrap_content\"\n110       \
    \  android:layout_gravity=\"center\"\n 11         android:text=\"Hello World!\"\
    />\n 12 \n 13 </FrameLayout>\n```\n\nAs you can see, the `TextView` has `welcomeMessage`\
    \ id. In the `MainActivity` you now could write:\n\n```kotlin\n1 override fun\
    \ onCreate(savedInstanceState: Bundle?) {\n2     super.onCreate(savedInstanceState)\n\
    3     setContentView(R.layout.activity_main)\n4 \n5     welcomeMessage.text =\
    \ \"Hello Kotlin!\"\n6 }\n```\n"
