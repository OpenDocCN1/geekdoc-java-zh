  trans: "\n然而，在深入研究语言的特性之前，让我先简单介绍一下背景。\n\n### 1.1 什么是 Kotlin？\n\nKotlin 是 [JetBrains](https://www.jetbrains.com/)\
    \ 开发的一种语言，该公司以构建 IntelliJ IDEA（一款功能强大的 Java 开发 IDE）而闻名。官方 Android IDE Android\
    \ Studio 也基于 IntelliJ。它最初被设计在 Java 虚拟机上运行。\n\nJetBrains 设计 Kotlin 时考虑了 Java 开发者，并以\
    \ IntelliJ 作为其主要的开发 IDE。这两个因素是让 Android 开发者快速采用该语言的突破点：\n\n* `Kotlin 对 Java 开发者来说非常直观且易于学习`。语言的大部分与我们已经熟悉的非常相似，差异可以很快掌握。\n\
    \n* `我们免费拥有与日常使用的 IDE 的全方位集成`。Android Studio 可以理解、编译和运行 Kotlin 代码。此外，对这种语言的支持来自开发\
    \ IDE 的公司，因此我们 Android 开发者是一等公民。\n\n然而，这仅与语言如何与我们的工具集成。与 Java 6 相比，这种语言的优势何？\n\
    \n* `它更具表现力`：这是它的主要特点之一。你可以用更少的代码实现更多的功能。\n\n* `它更安全`：Kotlin 是空安全的，这意味着我们在编译时就能处理可能的空情况，以防止运行时异常。我们需要显式地指定一个对象可以为空，然后在使用它之前检查其空值。你可以节省大量调试空指针异常和修复空值错误的时间。\n\
    \n* `它是函数式的`：Kotlin 从根本上是一种面向对象的语言，而不是纯函数式语言。但是，像许多其他现代语言一样，它使用了函数式编程的许多概念（如 lambda\
    \ 表达式）来更自然地解决问题。另一个很棒特性是它处理集合的方式。\n\n* `它利用扩展函数`：这意味着即使我们无法访问，也可以为任何类扩展新功能。\n\n\
    * `它是高度的互操作性`：你可以继续使用大多数用 Java 编写的库和代码，因为两种语言之间的互操作性非常好。甚至可以创建混合项目，让 Kotlin 和\
    \ Java 文件共存。\n\n然而，这只是冰山一角：- 自 Kotlin 1.1 版本起，[Kotlin JS](https://kotlinlang.org/docs/reference/js-overview.html)\
    \ 的最终版本已经发布。这个新变体允许你使用 Kotlin 开发 Web 应用。- 自 Kotlin 1.2 版本起，你还可以创建[多平台项目](https://kotlinlang.org/docs/reference/whatsnew12.html#multiplatform-projects-experimental)。通过它，你可以在\
    \ JVM 和 Javascript 之间共享代码。- 作为一项实验性特性，JetBrains 团队还发布了 [Kotlin/Native](https://kotlinlang.org/docs/reference/native-overview.html)，该项目终于让\
    \ Kotlin 脱离了 JVM。在未来，我们将能够使用 Kotlin 编写大部分代码来实现服务器、Web 以及 Android 和 iOS 应用。此外，你今天就可以尝试它。-\
    \ Gradle 正在添加支持使用 Kotlin Script（Kotlin 的简化版本）来编写 Gradle 文件，而不是 Groovy。该项目正快速接近其\
    \ 1.0 发布。\n\n所以你可以看到，Kotlin 的未来非常有前景。学习 Kotlin 可能会成为许多其他平台的参考语言，而且在所有平台之间共享代码无疑是一个重大的卖点。\n\
    \n### 1.2 我们通过 Kotlin 得到了什么？\n\n在不深入探究 Kotlin 语言的情况下（我们将在整本书中学习关于它的一切），这些是我们在\
    \ Java 中缺失的一些有趣特性：\n\n#### 表现力\n\n使用 Kotlin，要避免样板代码变得简单得多，因为语言默认涵盖了最常见的模式。例如，在\
    \ Java 中，如果我们想创建一个数据类，我们需要编写（或至少生成）以下代码：\n\n```java\n 1 public class Artist {\n\
    \ 2     private long id;\n 3     private String name;\n 4     private String url;\n\
    \ 5     private String mbid;\n 6  \n 7     public long getId() {\n 8         return\
    \ id;\n 9     }\n10  \n 11     public void setId(long id) {\n 12         this.id\
    \ = id;\n 13     }\n 14  \n 15     public String getName() {\n 16         return\
    \ name;\n 17     }\n 18  \n 19     public void setName(String name) {\n 20   \
    \      this.name = name;\n 21     }\n 22  \n 23     public String getUrl() {\n\
    \ 24         return url;\n 25     }\n 26  \n 27     public void setUrl(String\
    \ url) {\n 28         this.url = url;\n 29     }\n 30  \n 31     public String\
    \ getMbid() {\n 32         return mbid;\n 33     }\n 34  \n 35     public void\
    \ setMbid(String mbid) {\n 36         this.mbid = mbid;\n 37     }\n 38  \n 39\
    \     @Override public String toString() {\n 40         return \"Artist{\" +\n\
    \ 41                 \"id=\" + id +\n 42                 \", name='\" + name +\
    \ '\\'' +\n 43                 \", url='\" + url + '\\'' +\n 44              \
    \   \", mbid='\" + mbid + '\\'' +\n 45                 '}';\n 46     }\n 47 }\n\
    ```\n\n使用 Kotlin，你只需要利用数据类：\n\n```kotlin\n1 data class Artist(\n2     var id:\
    \ Long,\n3     var name: String,\n4     var url: String,\n5     var mbid: String)\n\
    ```\n\n这个数据类会自动生成所有字段和属性访问器，以及一些实用的方法，如 `toString()`。\n\n#### 空安全\n\n当我们使用 Java\
    \ 时，我们大量的代码都是防御性的。我们需要在使用某个东西之前检查一次它是否为空，以防止意外错误。Kotlin 像许多其他现代语言一样是空安全的，因为类型通过安全调用操作符（写作\
    \ `?`）显式地定义了对象是否可以为空。\n\n我们可以像这样操作：\n\n```kotlin\n1 // 这无法编译。Artist 不可以为空\n2 var\
    \ notNullArtist: Artist = null\n3  \n4 // Artist 可以为空\n5 var artist: Artist? =\
    \ null\n6  \n7 // 将无法编译，artist 可能为空\n8 artist.print()\n9  \n10 // 仅在 artist !=\
    \ null 时打印\n11 artist?.print()\n12  \n13 // 智能转换。如果我们之前检查过空值，那么 \n14 // 就不需要使用安全调用操作符了\n\
    15 if (artist != null) {\n16     artist.print()\n17 }\n18  \n19 // 仅在在我们确定它不为空时使用它。否则将抛出异常。\n\
    20 artist!!.print()\n21  \n22 // 使用 Elvis 操作符在对象为空时提供备选方案。\n23 val name = artist?.name\
    \ ?: \"empty\"\n```\n\n#### 扩展函数\n\n多亏了扩展函数，你可以为任何类添加新函数。它是我们项目中常见的工具类更整洁的替代方案。例如，你可以为\
    \ fragment 添加一个新方法来显示 toast：\n\n```kotlin\n1 fun Fragment.toast(message: CharSequence,\
    \ duration: Int = Toast.LENGTH_SHORT) {\n2     Toast.makeText(getActivity(), message,\
    \ duration).show()\n3 }\n```\n\n然后像这样使用它：\n\n```kotlin\n1 fragment.toast(\"Hello\
    \ world!\")\n```\n\n#### 函数式支持 (Lambdas)\n\n如果我们不需要每次在实现点击监听器时声明一个匿名类，而是只需定义我们想做的事情会怎样？我们确实可以这样做。这（以及许多其他有趣的事情）正是得益于\
    \ lambda 得到的：\n\n```kotlin\n1 view.setOnClickListener { toast(\"Hello world!\"\
    ) }\n```\n\n这些特性只是 Kotlin 能够功能的一小部分。现在你已经知道了这种语言的许多优秀特性，你可能会决定这不适合你。如果你继续下去，我们将在下一章立即开始编写代码。\n\
    \n## 2 准备工作\n"
- fmt: "\nNow that you know some little examples of what you may do with Kotlin, I\
    \ am sure you want to start to put it into practice as soon as possible. Don’t\
    \ worry; these first chapters will help you configure your development environment\
    \ so that you can start writing some code immediately.\n\n## 2.1 Android Studio\n\
    \nThe first thing you need is to install Android Studio. As you may know, Android\
    \ Studio is the official Android IDE, which was presented to the public in 2013\
    \ as a preview and finally released in 2014.\n\nAndroid Studio is implemented\
    \ as a plugin for [IntelliJ IDEA](https://www.jetbrains.com/idea), a Java IDE\
    \ created by [Jetbrains](https://www.jetbrains.com), the company which is also\
    \ behind Kotlin. So, as you can see, everything is tightly connected.\n\nThe adoption\
    \ of Android Studio was a significant step forward for Android developers. First,\
    \ because we left the buggy Eclipse behind and moved to a set of tools specially\
    \ designed for Java developers, which gives us a whole interaction with the language.\
    \ We enjoy fantastic features such as fast and impressively smart code completion,\
    \ and powerful analyzing and refactoring tools among others.\n\nAnd second, [Gradle](https://gradle.org/)\
    \ became the official build system for Android, which means a whole bunch of new\
    \ possibilities relating to versioning, building, and deployment. Two of the most\
    \ exciting functions are build types and flavors, which let you create infinite\
    \ versions of the app (or even different apps) in a straightforward way while\
    \ using the same code base.\n\nIf you are still using Eclipse, I am afraid you\
    \ need to switch to Android Studio if you want to follow this book. The Kotlin\
    \ team is creating a plugin for Eclipse, but it may be far behind the one for\
    \ Android Studio, and the integration is probably less smooth. You will also discover\
    \ what you are missing as soon you start using it.\n\nI am not covering the use\
    \ of Android Studio or Gradle because this is not the focus of the book. But if\
    \ this is the first time you use these tools, I am sure that you will be able\
    \ to follow the content and learn the basics in the meanwhile.\n\nDownload [Android\
    \ Studio from the official page](https://developer.android.com/sdk/index.html)\
    \ if you do not have it already.\n\n## 2.2 Install Kotlin plugin\n\nSince IntelliJ\
    \ 15 was released, the Kotlin plugin is bundled with the IDE. For Android Studio,\
    \ it depends on the version you are using.\n\nIf you have Android Studio 3.0 or\
    \ above, you already have everything you need. If your Android Studio is 2.3 or\
    \ below, you need to install the Kotlin plugin manually.\n\nSo go to the plugins\
    \ section inside `Android Studio Preferences`, and install the Kotlin plugin.\
    \ Use the search tool if you cannot find it.\n\nNow our environment is ready to\
    \ understand the language, compile it and execute it just as seamlessly as if\
    \ we were using Java.\n\n## 3 Creating a new project\n\nSo now it is time to start\
    \ creating our App. I want to keep the explanation simple on purpose, because\
    \ Android Studio wizard changes from time to time and these lines can become deprecated\
    \ pretty soon.\n\nOur app consists of a simple weather app, such as the one used\
    \ in [Google’s Beginners Course from Udacity](https://www.udacity.com/course/android-development-for-beginners--ud837).\
    \ We will be paying attention to different things, but the idea of the app is\
    \ the same because it includes many of the things you find in a regular app. If\
    \ you are starting with Android development, I recommend you this course.\n\n\
    ### 3.1 Create a new project in Android Studio\n\nAgain, there is a small difference\
    \ depending on the Android Studio version you are using.\n\nFor Android Studio\
    \ 3, the steps are pretty straightforward. Previous versions require a little\
    \ more work, but it is far from complicated too. Even if you are already using\
    \ new versions of Android Studio, I recommend you to take a look to the whole\
    \ process, because it is what you would need to do if you want to start using\
    \ Kotlin on a Java project.\n\nFirst of all, open Android Studio and choose `Create\
    \ New Project`. The first step is to decide a name for your app; you can use the\
    \ name you want: `WeatherApp` for instance. Then the wizard asks for a Company\
    \ Domain. As you are not releasing the app, this field is not very important either,\
    \ but if you own a domain, you can use that one. Also, choose the location where\
    \ you want to save the project.\n\nIn Android Studio 3, at this point, you find\
    \ a checkbox that enables Kotlin support. So select it if that is your case.\n\
    \nFor the next step, the wizard asks for the minimum API version. I selected API\
    \ 15 for the sample app, but Kotlin does not have any restrictions regarding the\
    \ minimum API. Skip any other platform different to `Phone and Tablet` for now.\n\
    \nFinally, we are required to choose an activity template. Select `Empty Activity`.\
    \ This template generates little code, and it is easier for us to add new logic.\n\
    \nKeep the name of the activities or layouts in the next screen. We will change\
    \ them later if we need to. Press `Finish` and let Android Studio do its work.\n\
    \nWith Android Studio 3 you are done, skip to point 3.4. The next two steps are\
    \ only required if you had to install the plugin manually.\n\n### 3.2 Convert\
    \ MainActivity to Kotlin code\n\nAn interesting feature that the Kotlin plugin\
    \ includes is the ability to convert from Java to Kotlin code. As an automated\
    \ process, it is not perfect, but it may help a lot during your first days until\
    \ you start getting used to the Kotlin language.\n\nSo we are using this in our\
    \ `MainActivity.java` class. Open the file and select `Code -> Convert Java File\
    \ to Kotlin File`. Take a look at the differences, so that you start becoming\
    \ familiar with the language.\n\nYou can also copy any Java code into a Kotlin\
    \ file, and the plugin also converts it.\n\n### 3.3 Configure Kotlin in project\n\
    \nThe Kotlin plugin also includes a tool that configures the Gradle files for\
    \ us.\n\nJust go to `Tools -> Project -> Configure Kotlin`. Choose the latest\
    \ Kotlin version, and press OK.\n\nReview the changes. There should be something\
    \ like this:\n\n```\nbuildscript {\n     ext.kotlin_version = '1.2.31'\n     repositories\
    \ {\n         jcenter()\n     }\n     dependencies {\n         classpath 'com.android.tools.build:gradle:3.1.0'\n\
    \         classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version\"\
    \n     }\n}\n\nallprojects {\n    repositories {\n        jcenter()\n    }\n}\n\
    ```\nbuild.gradle\n\nAs you can see, it is creating a variable that saves the\
    \ Kotlin version. We need that version number in several places, for instance\
    \ in the new dependency to the Kotlin plugin.\n\nIt will be useful again in the\
    \ module `build.gradle`, where the configuration has also added a dependency to\
    \ the Kotlin standard library. Go check it now:\n\n```\napply plugin: 'com.android.application'\n\
    apply plugin: 'kotlin-android'\n\nandroid {\n    ...\n}\n\ndependencies {\n  \
    \  implementation \"org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version\"\n}\n\
    ```\napp/build.gradle\n\n### 3.4 Include some other useful configuration\n\nThere\
    \ are some other extra libraries that we will be using, so take the chance to\
    \ add them to the `build.gradle`.\n\nAn important one is Anko, a library that\
    \ uses the power of Kotlin to simplify some tasks in Android. We will use more\
    \ modules of Anko later on, but for now, it is enough to add `anko-common`. This\
    \ library is split into several smaller ones so that we include in the project\
    \ only the parts we require.\n"
  raw: "Now that you know some little examples of what you may do with Kotlin, I am\
    \ sure you want to start to put it into practice as soon as possible. Don’t worry;\
    \ these first chapters will help you configure your development environment so\
    \ that you can start writing some code immediately.\n\n### 2.1 Android Studio\n\
    \nThe first thing you need is to install Android Studio. As you may know, Android\
    \ Studio is the official Android IDE, which was presented to the public in 2013\
    \ as a preview and finally released in 2014.\n\nAndroid Studio is implemented\
    \ as a plugin for [IntelliJ IDEA](https://www.jetbrains.com/idea), a Java IDE\
    \ created by [Jetbrains](https://www.jetbrains.com), the company which is also\
    \ behind Kotlin. So, as you can see, everything is tightly connected.\n\nThe adoption\
    \ of Android Studio was a significant step forward for Android developers. First,\
    \ because we left the buggy Eclipse behind and moved to a set of tools specially\
    \ designed for Java developers, which gives us a whole interaction with the language.\
    \ We enjoy fantastic features such as fast and impressively smart code completion,\
    \ and powerful analyzing and refactoring tools among others.\n\nAnd second, [Gradle](https://gradle.org/)\
    \ became the official build system for Android, which means a whole bunch of new\
    \ possibilities relating to versioning, building, and deployment. Two of the most\
    \ exciting functions are build types and flavors, which let you create infinite\
    \ versions of the app (or even different apps) in a straightforward way while\
    \ using the same code base.\n\nIf you are still using Eclipse, I am afraid you\
    \ need to switch to Android Studio if you want to follow this book. The Kotlin\
    \ team is creating a plugin for Eclipse, but it may be far behind the one for\
    \ Android Studio, and the integration is probably less smooth. You will also discover\
    \ what you are missing as soon you start using it.\n\nI am not covering the use\
    \ of Android Studio or Gradle because this is not the focus of the book. But if\
    \ this is the first time you use these tools, I am sure that you will be able\
    \ to follow the content and learn the basics in the meanwhile.\n\nDownload [Android\
    \ Studio from the official page](https://developer.android.com/sdk/index.html)\
    \ if you do not have it already.\n\n### 2.2 Install Kotlin plugin\n\nSince IntelliJ\
    \ 15 was released, the Kotlin plugin is bundled with the IDE. For Android Studio,\
    \ it depends on the version you are using.\n\nIf you have Android Studio 3.0 or\
    \ above, you already have everything you need. If your Android Studio is 2.3 or\
    \ below, you need to install the Kotlin plugin manually.\n\nSo go to the plugins\
    \ section inside *Android Studio Preferences*, and install the Kotlin plugin.\
    \ Use the search tool if you cannot find it.\n\nNow our environment is ready to\
    \ understand the language, compile it and execute it just as seamlessly as if\
    \ we were using Java.\n\n## 3 Creating a new project\n\nSo now it is time to start\
    \ creating our App. I want to keep the explanation simple on purpose, because\
    \ Android Studio wizard changes from time to time and these lines can become deprecated\
    \ pretty soon.\n\nOur app consists of a simple weather app, such as the one used\
    \ in [Google’s Beginners Course from Udacity](https://www.udacity.com/course/android-development-for-beginners--ud837).\
    \ We will be paying attention to different things, but the idea of the app is\
    \ the same because it includes many of the things you find in a regular app. If\
    \ you are starting with Android development, I recommend you this course.\n\n\
    ### 3.1 Create a new project in Android Studio\n\nAgain, there is a small difference\
    \ depending on the Android Studio version you are using.\n\nFor Android Studio\
    \ 3, the steps are pretty straightforward. Previous versions require a little\
    \ more work, but it is far from complicated too. Even if you are already using\
    \ new versions of Android Studio, I recommend you to take a look to the whole\
    \ process, because it is what you would need to do if you want to start using\
    \ Kotlin on a Java project.\n\nFirst of all, open Android Studio and choose `Create\
    \ New Project`. The first step is to decide a name for your app; you can use the\
    \ name you want: `WeatherApp` for instance. Then the wizard asks for a Company\
    \ Domain. As you are not releasing the app, this field is not very important either,\
    \ but if you own a domain, you can use that one. Also, choose the location where\
    \ you want to save the project.\n\nIn Android Studio 3, at this point, you find\
    \ a checkbox that enables Kotlin support. So select it if that is your case.\n\
    \nFor the next step, the wizard asks for the minimum API version. I selected API\
    \ 15 for the sample app, but Kotlin does not have any restrictions regarding the\
    \ minimum API. Skip any other platform different to `Phone and Tablet` for now.\n\
    \nFinally, we are required to choose an activity template. Select `Empty Activity`.\
    \ This template generates little code, and it is easier for us to add new logic.\n\
    \nKeep the name of the activities or layouts in the next screen. We will change\
    \ them later if we need to. Press `Finish` and let Android Studio do its work.\n\
    \nWith Android Studio 3 you are done, skip to point 3.4\\. The next two steps\
    \ are only required if you had to install the plugin manually.\n\n### 3.2 Convert\
    \ MainActivity to Kotlin code\n\nAn interesting feature that the Kotlin plugin\
    \ includes is the ability to convert from Java to Kotlin code. As an automated\
    \ process, it is not perfect, but it may help a lot during your first days until\
    \ you start getting used to the Kotlin language.\n\nSo we are using this in our\
    \ `MainActivity.java` class. Open the file and select `Code -> Convert Java File\
    \ to Kotlin File`. Take a look at the differences, so that you start becoming\
    \ familiar with the language.\n\nYou can also copy any Java code into a Kotlin\
    \ file, and the plugin also converts it.\n\n### 3.3 Configure Kotlin in project\n\
    \nThe Kotlin plugin also includes a tool that configures the Gradle files for\
    \ us.\n\nJust go to `Tools -> Project -> Configure Kotlin in Project`. Choose\
    \ the latest Kotlin version, and press OK.\n\nReview the changes. There should\
    \ be something like this:\n\n```\n 1 buildscript {\n 2     ext.kotlin_version\
    \ = '1.2.31'\n 3     repositories {\n 4         jcenter()\n 5     }\n 6     dependencies\
    \ {\n 7         classpath 'com.android.tools.build:gradle:3.1.0'\n 8         classpath\
    \ \"org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version\"\n 9     }\n10\
    \ }\n11 \n12 allprojects {\n13     repositories {\n14         jcenter()\n15  \
    \   }\n16 }\n```\n\nbuild.gradle\n\nAs you can see, it is creating a variable\
    \ that saves the current Kotlin version. We need that version number in several\
    \ places, for instance in the new dependency to the Kotlin plugin.\n\nIt will\
    \ be useful again in the module `build.gradle`, where the configuration has also\
    \ added a dependency to the **Kotlin standard library**. Go check it now:\n\n\
    ```\n 1 apply plugin: 'com.android.application'\n 2 apply plugin: 'kotlin-android'\n\
    \ 3 \n 4 android {\n 5     ...\n 6 }\n 7 \n 8 dependencies {\n 9     implementation\
    \ \"org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version\"\n10 }\n```\n\napp/build.gradle\n\
    \n### 3.4 Include some other useful configuration\n\nThere are some other extra\
    \ libraries that we will be using, so take the chance to add them to the `build.gradle`.\n\
    \nAn important one is Anko, a library that uses the power of Kotlin to simplify\
    \ some tasks in Android. We will use more modules of Anko later on, but for now,\
    \ it is enough to add `anko-common`. This library is split into several smaller\
    \ ones so that we include in the project only the parts we require.\n\nLet’s go\
    \ to the main one first, and update the buildscript by adding two new variables\
    \ for the support libraries as well as Anko library (you can also [check the latest\
    \ version here](https://github.com/Kotlin/anko/releases)). This way, it is easier\
    \ to modify all the versions in a row, as well as adding new libraries that use\
    \ the same version without having to change it everywhere:"
