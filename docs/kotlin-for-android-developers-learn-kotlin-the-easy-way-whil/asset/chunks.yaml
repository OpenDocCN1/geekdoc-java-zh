    \n## 22\\. Flow control and ranges\n\nI have been using some conditional expressions\
    \ in our code, so you are not new to some of the concepts of this chapter. But\
    \ now it is time to explain them in more depth. Though in Kotlin we usually need\
    \ fewer mechanisms to control the flow of the code that we would typically use\
    \ in an entirely procedural programming language (some of them even practically\
    \ disappear), they are still useful. There are also new powerful ideas that solve\
    \ some particular problems much easier.\n\n### 22.1 If Expression\n\nAlmost everything\
    \ in Kotlin is an expression, which means it returns a value. `If` conditions\
    \ are not an exception, so though we can use `if` as we are used to doing:\n\n\
    ```\n1 if (x > 0) {\n2     toast(\"x is greater than 0\")\n3 } else if (x == 0)\
    \ {\n4     toast(\"x equals 0\")\n5 } else {\n6     toast(\"x is smaller than\
    \ 0\")\n7 }\n```\n\nWe can also assign its result to a variable. We have used\
    \ it like that several times in our code:\n\n```\n1 val res = if (x != null &&\
    \ x.size() >= days) x else null\n```\n\nThis also implies that we do not need\
    \ a ternary operation similar to the Java one because we can solve it easily with:\n\
    \n```\n1 val z = if (condition) x else y\n```\n\nSo the `if` expression always\
    \ returns a value. If one of the branches returns `Unit`, the whole expression\
    \ returns `Unit`, which can be ignored, and it will behave like a regular Java\
    \ `if` condition in that case.\n\n### 22.2 When expression\n\n`When` expressions\
    \ are similar to `switch/case` in Java, but far more powerful. This expression\
    \ tries to match its argument against all possible branches sequentially until\
    \ it finds one that is satisfied. It then applies the right side of the expression.\
    \ The difference with a `switch/case` in Java is that the argument can be literally\
    \ anything, and the conditions for the branches too.\n\nFor the default option,\
    \ we can add an `else` branch that will be executed if none of the previous conditions\
    \ are satisfied. The code executed when a condition is satisfied can be a block\
    \ too:\n\n```\n1 when (x) {\n2     1 -> println(\"x == 1\")\n3     2 -> println(\"\
    x == 2\")\n4     else -> {\n5         println(\"I'm a block\")\n6         println(\"\
    x is neither 1 nor 2\")\n7     }\n8 }\n```\n\nAs it is an expression, it can return\
    \ a result too. Take into consideration that when it is used as an expression,\
    \ it must cover all the possible cases or implement the `else` branch. It will\
    \ not compile otherwise:\n\n```\n1 val result = when (x) {\n2     0, 1 -> \"binary\"\
    \n3     else -> \"error\"\n4 }\n```\n\nAs you can see, the condition can be a\
    \ set of values separated by commas. However, it can be many more things. We could,\
    \ for instance, check the type of the argument and make decisions based on this:\n\
    \n```\n1 when(view) {\n2     is TextView -> view.text = \"I'm a TextView\"\n3\
    \     is EditText -> toast(\"EditText value: ${view.getText()}\")\n4     is ViewGroup\
    \ -> toast(\"Number of children: ${view.getChildCount()} \")\n5     else -> view.visibility\
    \ = View.GONE\n6 }\n```\n\nThe argument is automatically converted in the right\
    \ part of the condition, so you do not need to do any explicit casting.\n\nIt\
    \ is possible to check whether the argument is inside a range (I will explain\
    \ ranges later in this chapter), or even inside a collection:\n\n```\n1 val cost\
    \ = when(x) {\n2     in 1..10 -> \"cheap\"\n3     in 10..100 -> \"regular\"\n\
    4     in 100..1000 -> \"expensive\"\n5     in specialValues -> \"special value!\"\
    \n6     else -> \"not rated\"\n7 }\n```\n\nAlternatively, you could also get rid\
    \ of the argument and do any crazy checks you may need. It could easily substitute\
    \ an `if / else` chain:\n\n```\n1 val res = when {\n2     x in 1..10 -> \"cheap\"\
    \n3     s.contains(\"hello\") -> \"it's a welcome!\"\n4     v is ViewGroup ->\
    \ \"child count: ${v.getChildCount()}\"\n5     else -> \"\"\n6 }\n```\n\n### 22.3\
    \ For loops\n\nThough you will not use them too much if you make use of functional\
    \ operators in collections, `for` loops can be useful in some situations, so they\
    \ are still available. It works with anything that provides an iterator:\n\n```\n\
    1 for (item in collection) {\n2     print(item)\n3 }\n```\n\nIf we want to achieve\
    \ the regular iteration over indices, we can also do it using ranges:\n\n```\n\
    1 for (index in 0..viewGroup.getChildCount() - 1) {\n2     val view = viewGroup.getChildAt(index)\n\
    3     view.visibility = View.VISIBLE\n4 }\n```\n\nWhen iterating over an array\
    \ or a list, we can make uses of existing properties that return a set of indices,\
    \ so the previous artifact is not necessary:\n\n```\n1 for (i in array.indices)\n\
    2     print(array[i])\n```\n\n### 22.4 While and do/while loops\n\nYou can keep\
    \ using while loops too, though they are not very common in Kotlin either. There\
    \ are usually simpler and more visual ways to resolve this problem. A couple of\
    \ examples:\n\n```\n1 while (x > 0) {\n2     x--\n3 }\n4 \n5 do {\n6     val y\
    \ = retrieveData()\n7 } while (y != null) // y is visible here!\n```\n\n### 22.5\
    \ Ranges\n\nIt is challenging to explain flow control without talking about ranges.\
    \ But their scope is broader. Range expressions make use of an operator in the\
    \ form of “`..`” that is defined implementing a `rangeTo` function.\n\nRanges\
    \ help simplify our code in many creative ways. For instance we can convert this:\n\
    \n```\n1 if (i >= 0 && i <= 10)\n2     println(i)\n```\n\nInto this:\n\n```\n\
    1 if (i in 0..10)\n2     println(i)\n```"
