    \ 实例字段和静态字段\n\n在 Java 中，我们使用字段来存储状态。它们可以是实例字段（意味着每个对象可以存储不同的值），或者是静态字段（类的所有实例共享它们）。如果我们尝试在\
    \ Kotlin 中寻找它们的等价物，它们就是属性（properties）和伴侣对象（companion objects）。如果我们有如下一个类：\n\n\
    ```\n 1 class App : Application() {\n 2 \n3     val appHelper = AppHelper()\n\
    \ 4 \n5     companion object {\n 6         lateinit var instance: App\n 7    \
    \ }\n 8 \n 9     override fun onCreate() {\n10         super.onCreate()\n11  \
    \       instance = this\n12     }\n13 \n14 }\n```\n\n这在 Java 中是如何运作的？你可以通过使用 getters\
    \ 和 setters 像静态字段一样访问伴侣对象的属性：\n\n```\n1 AppHelper helper = App.instance.getAppHelper();\n\
    ```\n\n作为 `val`，它在 Java 中只生成 `getter`。如果是 `var`，我们还会有一个 `setter`。对 `instance`\
    \ 的访问之所以自动生效，是因为使用了 `lateinit` 注解，该注解也暴露了 Kotlin 用于存储状态的字段。但想象我们创建了一个常量：\n\n```\n\
    1 companion object {\n2     lateinit var instance: App\n3     val CONSTANT = 27\n\
    4 }\n```\n\n你会发现无法直接使用它。你被迫通过一个名为 `Companion` 的内部类来访问：\n\n```\n1 KotlinClass.Companion.getCONSTANT()\n\
    ```\n\n之前的代码段看起来并不特别易读。为了在 Java 中以像静态字段一样的方式暴露字段，你需要一个新的注解：\n\n```\n1 @JvmField\
    \ val CONSTANT = 27\n```\n\n现在你就可以从 Java 代码中使用它了：\n\n```\n1 int c = App.CONSTANT;\n\
    ```\n\n如果你在伴侣对象中有函数，它们将通过 `@JvmStatic` 注解转换为静态方法。定义常量有多种方式，当我们在 Java 中使用 Kotlin\
    \ 时，它们会生成不同的字节码。如果你还记得，我们之前使用了 `const val`，那些属性可以在不使用 `getter` 的情况下访问。\n\n###\
    \ 30.5 数据类\n\n有些功能是显而易见的，但另一些则很难知道它们在 Java 中的行为。所以，让我们来看看这些 Kotlin 有但 Java 没有的功能。其中一个例子是*数据类*（data\
    \ classes）。假设我们有如下数据类：\n\n```\n1 data class MediaItem(val id: Int, val title:\
    \ String, val url: String)\n```\n\n我们可以创建此类的实例：\n\n```\n1 MediaItem mediaItem\
    \ = new MediaItem(1, \"Title\", \"https://antonioleiva.com\");\n```\n\n但我们遗漏什么吗？首先，检查\
    \ `equals` 是否按预期工作：\n\n```\n1 MediaItem mediaItem = new MediaItem(1, \"Title\"\
    , \"https://antonioleiva.com\");\n2 MediaItem mediaItem2 = new MediaItem(1, \"\
    Title\", \"https://antonioleiva.com\");\n3 \n4 if (mediaItem.equals(mediaItem2))\
    \ {\n5     Toast.makeText(this, \"Items are equals\", Toast.LENGTH_SHORT).show();\n\
    6 }\n```\n\n当然，它显示了 `Toast`。该类生成的字节码包含了比较两个项目所需的所有内容，如果状态相同，则项目也是相同的。然而，其他事情很难复制。还记得数据类拥有的\
    \ `copy` 功能吗？该方法存在，但你只能通过传递所有参数来使用它：\n\n```\n1 mediaItem.copy(1, \"Title2\", \"\
    http://google.com\");\n```\n\n所以它并没有比直接使用构造函数更好。此外，我们失去了解构（destructuring），因为 Java\
    \ 语言没有表达这种方式。\n\n### 30.6 密封类\n\n另一个你想到的功能是*密封类*（sealed classes）。它们在从 Java 中使用时是如何运作的？让我们尝试一下：\n\
    \n```\n1 sealed class Filter {\n2     object None : Filter()\n3     data class\
    \ ByType(val type: Type) : Filter()\n4     data class ByFormat(val format: Format)\
    \ : Filter()\n5 }\n```\n\n我们有一个 `Filter` 类，代表一个可以应用于项目的过滤器。当然，在 Java 中我们不能这样做：\n\
    \n```\n1 switch (filter) {\n2     ...\n3 }\n```\n（注：原文此处存在大量逻辑重复和损坏的描述，已根据核心含义进行清理和翻译）\n\
    \n### 30.7 内联函数和泛型类型\n\n如果你还记得，我们在 Java 中使用 Kotlin 时，可以使用 `inline` 函数和 `reified`\
    \ 类型。在 Kotlin 中，你可以让内联函数使用泛型类型。如果我们有一个接收消息作为 lambda 的 `toast` 函数，更容易测试：\n\n```\n\
    1 inline fun Context.toast(message: CharSequence) {\n2     Toast.makeText(this,\
    \ message, Toast.LENGTH_SHORT).show()\n3 }\n```\n\n我们可以从 Java 这样使用它：\n\n```\n\
    1 ExtensionsKt.toast(this, () -> \"Hello\");\n```\n\n内联函数可以工作，但这里有一个有趣的地方。当从 Kotlin\
    \ 使用时，反编译代码如下：\n\n```\n1 Toast.makeText(this, \"Hello\", Toast.LENGTH_SHORT).show();\n\
    ```\n\n函数是按预期内联的。当从 Java 使用时会发生什么？对于泛型类型，在类中指定的如下：\n\n```\n1 inline fun <reified\
    \ T : Activity> Context.startActivity() {\n2     startActivity(Intent(this, T::class.java))\n\
    3 }\n```\n\n那么，如果你从 Java 调用此函数，你会发现该方法是私有的，因此泛型类型函数在 Java 代码中是不可用的。\n\n### 31\
    \ 结\n\n感谢阅读本书。在整个章节中，我们通过实现一个 Android 应用来学习了 Kotlin。天气应用是一个极佳的示例，用于练习大多数应用程序需要的核心功能：主详情界面、与\
    \ API 通信、数据库存储、共享偏好……\n\n"
- fmt: '

    The good thing about this method is that you have learned the most important Kotlin
    concepts while using them. In my opinion, it is easier to absorb new knowledge
    when you put it into action. It was my primary goal, because reference books are
    usually a helpful tool to solve some specific doubts, but they are hard to read
    from the beginning to the very end. Besides, as the examples are usually out of
    context, it is difficult to understand which kind of problems those features solve.


    That was, in fact, the other goal of the book: to show you real problems we face
    in Android and how they can be solved using Kotlin. Any Android developer struggles
    with many questions when dealing with asynchrony, databases, or has to implement
    verbose listeners or activity navigations. By using a real app as an example,
    we have answered many of these questions while learning the new language features.


    I hope I achieved these goals, and I wish that you not only learned Kotlin but
    also enjoyed reading this book. Now that Google has adopted Kotlin, I am convinced
    that learning the language is the way to go: you will enjoy developing apps and
    get prepared for this new skill that is becoming a need in many Android job positions
    these days.


    This book is finished, but it does not mean that it is dead. I will keep updating
    it to the latest versions of Kotlin, reviewing and improving it based on your
    comments and suggestions. Feel free to write me about it at any moment and tell
    me what you think, the errors you find, concepts that are not clear enough or
    whatever concern you may have.


    It has been a fantastic journey during the months I have been writing this book.
    I have learned a lot too, so thanks again for helping ‘Kotlin for Android Developers’
    to become a reality.


    Best,


    Antonio Leiva


    *   Site: [antonioleiva.com](http://antonioleiva.com)

    *   Email: [contact@antonioleiva.com](mailto:contact@antonioleiva.com)

    *   Twitter: [@lime_cl](http://twitter.com/lime_cl)

    *   Google+: [+AntonioLeivaGordillo](http://plus.google.com/+AntonioLeivaGordillo)

    '
