    \ (probably a mix of both).\n\n### 20.1 How Null types work\n\nMost modern languages\
    \ solve this issue in some way. Kotlin, the same as other similar languages such\
    \ as Swift, **make use of question marks to identify nullable types**. That way,\
    \ if a variable can be null, the compiler forces to deal with it in some way.\n\
    \nAs everything is an object in Kotlin (even Java primitive types), everything\
    \ can be null. So, of course, we can have a nullable integer:\n\n```\n1 val a:\
    \ Int? = null\n```\n\nYou cannot work directly with a nullable type without doing\
    \ some checks before. This code does not compile:\n\n```\n1 val a: Int? = null\n\
    2 a.toLong()\n```\n\nThat variable could be null and **the compiler is aware of\
    \ that**, so until the nullity is checked, you cannot use it.\n\nHere it is when\
    \ another feature of the Kotlin compiler comes into action: the smart cast. If\
    \ we check the nullity of an object, from that moment the object is automatically\
    \ cast to its non-nullable type. Let’s see an example:\n\n```\n1 val a: Int? =\
    \ null\n2 ...\n3 if (a != null) {\n4     a.toLong()\n5 }\n```\n\nInside the `if`,\
    \ `a` becomes `Int` instead of `Int?`, so we can use it without checking nullity\
    \ anymore or doing any castings. The code outside the `if` context, of course,\
    \ has to deal with it.\n\nThis smart cast only works if a variable cannot be concurrently\
    \ modified because otherwise the value could have been changed from another thread,\
    \ and the previous check would be false at that moment. The compiler supports\
    \ smart casting for `val` properties or local (`val` or `var`) variables.\n\n\
    This can sound like much work. Do we have to fill all our code with nullity checks?\
    \ Of course not. First, because most of the time you will not need null objects.\
    \ Null references are more unused that one could think, you will realize when\
    \ you start figuring out whether a variable should be null or not. But Kotlin\
    \ also has some operators to do this task easier. We can, for instance, simplify\
    \ the previous code to:\n\n```\n1 val a: Int? = null\n2 ...\n3 a?.toLong()\n```\n\
    \nHere we are using the **safe call operator (?.)**. The previous line is only\
    \ executed if the variable is not null. Otherwise, it does nothing. Also, we can\
    \ even provide an alternative for the null case using the **Elvis operator (?:)**:\n\
    \n```\n1 val a: Int? = null\n2 ...\n3 val myLong = a?.toLong() ?: 0L\n```\n\n\
    Since `throw` and `return` are also expressions in Kotlin, they can be used in\
    \ the right side of the Elvis operator:\n\n```\n1 val myLong = a?.toLong() ?:\
    \ return false\n```\n\n```\n1 val myLong = a?.toLong() ?: throw IllegalStateException()\n\
    ```\n\nHowever, there may be situations when we know for sure we are dealing with\
    \ a non-nullable variable, but the type is nullable. We can force the compiler\
    \ to deal with nullable types skipping the restriction by using the **!! operator**:\n\
    \n```\n1 val a: Int? = null\n2 a!!.toLong()\n```\n\nThe previous code compiles,\
    \ but it will crash. So we must make sure we only use it in a reduced number of\
    \ situations. Usually, we can choose alternative solutions. A code full of **!!**\
    \ is a smell, because it brings back the possible exceptions we are trying to\
    \ avoid with nullable types.\n\n### 20.2 Nullity and Java libraries"
