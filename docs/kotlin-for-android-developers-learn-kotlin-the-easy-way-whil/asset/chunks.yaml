  trans: "\n渲染预报列表的主视图将是一个 `RecyclerView`，因此需要一个新的依赖项。修改 `build.gradle` 文件：\n\n```\n\
    1 dependencies {\n2     compile fileTree(dir: 'libs', include: ['*.jar'])\n3 \
    \    compile \"com.android.support:appcompat-v7:$support_version\"\n4     compile\
    \ \"com.android.support:recyclerview-v7:$support_version\"\n5     ...\n6 }\n```\n\
    \n`app/build.gradle`\n\n现在，在 `activity_main.xml` 中：\n\n```\n 1 <FrameLayout xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n 2              android:layout_width=\"\
    match_parent\"\n 3              android:layout_height=\"match_parent\">\n 4 \n\
    5     <android.support.v7.widget.RecyclerView\n 6         android:id=\"@+id/forecast_list\"\
    \n 7         android:layout_width=\"match_parent\"\n 8         android:layout_height=\"\
    match_parent\"/>\n 9 \n10 </FrameLayout>\n```\n\n`activity_main.xml`\n\n在 `MainActivity.kt`\
    \ 中，删除我们为了测试一切运行正常而添加的那行代码（现在它会显示错误）。目前我们将继续使用传统的 `findViewById()`：\n\n```\n1\
    \ val forecastList = findViewById(R.id.forecast_list) as RecyclerView\n2 forecastList.layoutManager\
    \ = LinearLayoutManager(this)\n```\n\n`MainActivity.kt`\n\n如你所见，我们定义了变量并将其强制转换为\
    \ `RecyclerView`。这与 Java 有些不同；我们将在下一章中回顾这些差异。还指定了 `LayoutManager`，使用了属性命名而不是 setter\
    \ 方法。对于这种布局，一个列表就足够了，所以让我们使用 `LinearLayoutManager`吧。\n\n### 5.2 回收适配器 (Recycler\
    \ Adapter)\n\n我们需要为回收器创建一个适配器。我前段时间[在我的博客上讨论过 `RecyclerView`](http://antonioleiva.com/recyclerview/)，如果你不熟悉它，这可能对你有帮助。\n\
    \n目前用于 `RecyclerView` 适配器的视图将只是 `TextView`，以及我们手动创建的简单文本列表。添加名为 `ForecastListAdapter.kt`\
    \ 的新 Kotlin 文件，并包含以下代码：\n\n```\n 1 class ForecastListAdapter(val items: List<String>)\
    \ : \n 2         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 3\
    \ \n 4     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int):\
    \ \n 5             ViewHolder {\n 6         return ViewHolder(TextView(parent.context))\n\
    \ 7     }\n 8 \n 9     override fun onBindViewHolder(holder: ViewHolder, position:\
    \ Int) {\n10         holder.textView.text = items[position]\n11     }\n12 \n13\
    \     override fun getItemCount(): Int = items.size\n14 \n15     class ViewHolder(val\
    \ textView: TextView) : RecyclerView.ViewHolder(textView)\n16 }\n```\n\n`ForecastListAdapter.kt`\n\
    \n同样，我们可以像属性一样访问上下文和文本。你可以照这样做（使用 getter 和 setter），但你会收到编译警告。如果你喜欢继续使用 Java 方法，可以禁用此检查。然而，一旦你习惯了属性，你就永远不会回头了。\n\
    \n如果你检查之前的代码，可能会发现有几处警告。第一个是建议将 `items` 参数设置为私有，因为它只在类内部使用。\n\n```\n1 class ForecastListAdapter(private\
    \ val items: List<String>)\n```\n\n另一个是建议使用表达式体来编写单行函数。在这里也遵循这些建议：\n\n```\n1 override\
    \ fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =\n2         ViewHolder(TextView(parent.context))\n\
    ```\n\n因此，完整的代码如下：\n\n```\n 1 class ForecastListAdapter(private val items: List<String>)\
    \ \n 2     : RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 3 \n 4\
    \     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =\n 5\
    \             ViewHolder(TextView(parent.context))\n 6 \n 7     override fun onBindViewHolder(holder:\
    \ ViewHolder, position: Int) {\n 8         holder.textView.text = items[position]\n\
    \ 9     }\n10 \n11     override fun getItemCount(): Int = items.size\n12 \n13\
    \     class ViewHolder(val textView: TextView) : RecyclerView.ViewHolder(textView)\n\
    14 }\n```\n\n`ForecastListAdapter.kt`\n\n回到 `MainActivity`，让我们创建字符串列表然后创建一个适配器的实例：\n\
    \n```\n 1 private val items = listOf(\n 2     \"Mon 6/23 - Sunny - 31/17\",\n\
    \ 3     \"Tue 6/24 - Foggy - 21/8\",\n 4     \"Wed 6/25 - Cloudy - 22/17\",\n\
    \ 5     \"Thurs 6/26 - Rainy - 18/11\",\n 6     \"Fri 6/27 - Foggy - 21/10\",\n\
    \ 7     \"Sat 6/28 - TRAPPED IN WEATHERSTATION - 23/18\",\n 8     \"Sun 6/29 -\
    \ Sunny - 20/7\"\n 9 )\n10 \n11 override fun onCreate(savedInstanceState: Bundle?)\
    \ {\n12     val forecastList = findViewById(R.id.forecast_list) as RecyclerView\n\
    13     forecastList.layoutManager = LinearLayoutManager(this)\n14     forecastList.adapter\
    \ = ForecastListAdapter(items)\n15 }\n```\n\n`MainActivity.kt`\n\n### 6. 变量与属性\n\
    \n### Kotlin 中，**一切都是对象**。它与 Java 有一些不同：\n\n### 6.1 基本类型\n\n数值类型之间没有自动转换。例如，从\
    \ `Int` 到 `Double`：\n\n```\nval i = 7\nval d = i.toDouble()\n```\n\n*   字符 (`Char`）不能直接作为数字使用。但是，我们可以将其转换为：\n\
    \n```\nval c = 'c'\nval i = c.toInt()\n```\n\n*   位运算 略有不同。在 Android 中，我们使用标志位\
    \ `and` 和 `or` 作为示例：\n\n```\n// Java\nint bitwiseOr = FLAG1 | FLAG2;\nint bitwiseAnd\
    \ = FLAG1 & FLAG2;\n```\n\n```\n// Kotlin\nval bitwiseOr = FLAG1 or FLAG2\nval\
    \ bitwiseAnd = FLAG1 and FLAG2\n```\n\n*   字面量可以提供其类型信息。这不是强制的，但 Kotlin 的常见做法是省略变量类型，让它从字面量推断：\n\
    \n```\nval i = 12 // 一个 Int\nval iHex = 0x0f // 来自十六进制字面量的 Int\nval l = 3L //\
    \ 一个 Long\nval d = 3.5 // 一个 Double\nval f = 3.5F // 一个 Float\n```\n\n*   `String`\
    \ 可以像数组一样被访问并进行遍历：\n\n```\nval s = \"Example\"\nval c = s[2] // 这是字符 'a'\n\n//\
    \ 遍历字符串\nval s = \"Example\"\nfor (c in s) {\n    print(c)\n}\n```\n\n### 6.2\
    \ 不可变性\n\n在 Kotlin 中，变量可以很容易地定义为可变的 (`var`) 或不可变的 (`val`)。这种想法与 Java 变量中使用 `final`\
    \ 非常相似。\n\n不可变对象是在实例化后状态无法更改的对象。如果你需要修改后的版本，你需要创建一个新对象。不可变性使得软件更加健壮且可预测。在 Java\
    \ 中，绝大多数对象都是可变的，这意味着访问该对象的任何部分都可以修改它，从而影响应用程序的其他部分。\n\n不可变对象从定义上就是线程安全的。因为值是常量，所有线程始终获取相同的对象。\n"
- fmt: "\nSo the way we think about coding changes a bit in Kotlin if we want to make\
    \ use of immutability. The key concept: just use `val` as much as possible. There\
    \ are situations (especially in Android, where the constructor is called by the\
    \ system for several classes) where immutability becomes hard to implement, but\
    \ most of the time it will be possible.\n\nAnother thing mentioned before is that\
    \ we can usually avoid specifying object types, the compiler infers them from\
    \ the value, which makes the code cleaner and faster to modify. We already have\
    \ some examples from the section above.\n\n```\n1 val s = \"Example\" // A String\n\
    2 val i = 23 // An Int\n3 val actionBar = supportActionBar // An ActionBar in\
    \ an Activity context\n```\n\nHowever, a type needs to be specified if we want\
    \ to use a more generic type:\n\n```\n1 val a: Any = 23\n2 val c: Context = activity\n\
    ```\n\n### 6.3 Properties\n\nProperties are the equivalent of fields in Java,\
    \ but much more powerful. Properties do the work of a field plus a getter plus\
    \ a setter. Let’s see an example to compare the difference. The following snippet\
    \ shows the code required in Java to access and modify a field safely:\n\n```\n\
    \ 1 public class Person {\n 2 \n 3     private String name;\n 4 \n 5     public\
    \ String getName() {\n 6         return name;\n 7     }\n 8 \n 9     public void\
    \ setName(String name) {\n10         this.name = name;\n11     }\n12 }\n13 \n\
    14 ...\n15 \n16 Person person = new Person();\n17 person.setName(\"name\");\n\
    18 String name = person.getName();\n```\n\nIn Kotlin, you only need a property\
    \ to achieve the same behavior:\n\n```\n 1 class Person {\n 2     \n 3     var\
    \ name: String = \"\"\n 4         \n 5 }\n 6 \n 7 ...\n 8  9 val person = Person()\n\
    10 person.name = \"name\"\n11 val name = person.name\n```\n\nIf nothing is specified,\
    \ the property uses the default getter and setter. It can, of course, be modified\
    \ to run whatever custom behavior you need, without having to change the existing\
    \ code:\n\n```\n1 class Person {\n2 \n3     var name: String = \"\"\n4       \
    \  get() = field.toUpperCase()\n5         set(value) {\n6             field =\
    \ \"Name: $value\"\n7         }\n8 \n9 }\n```\n\nIf the property needs access\
    \ to its value in a custom getter or setter (as in this case), it requires the\
    \ creation of a backing field. It can be accessed by using `field`, a reserved\
    \ word, and it is automatically created when the compiler finds that it is required.\
    \ Take into account that if we used the property directly, we would be using the\
    \ setter and getter, and not doing a direct assignment. You can only use the backing\
    \ field inside the accessors of the property.\n\nAs mentioned in some previous\
    \ chapters, when dealing with code written in Java, Kotlin allows using the property\
    \ syntax where a getter, and optionally a setter, are defined in Java. The compiler\
    \ just links to the original getters and setters, so there are no performance\
    \ penalties when using these mapped properties.\n\n## 7 Anko and Extension Functions\n\
    \nThe Kotlin team has developed some great tools to make Android development more\
    \ accessible. In this chapter, I talk you about them and how you can start using\
    \ them.\n\n### 7.1 What is Anko?\n\n[Anko](https://github.com/JetBrains/anko)\
    \ is a robust library developed by JetBrains. Its primary purpose is the generation\
    \ of UI layouts by using code instead of XML. This feature is interesting; try\
    \ it out if you have the chance, but I will not be using it in this project. To\
    \ me (probably due to years of experience writing user interfaces) using XML is\
    \ more comfortable, but you might think differently.\n\nHowever, this is not the\
    \ only feature we can get from this library. Anko includes many helpful functions\
    \ and properties that avoid lots of boilerplate. There are several examples covered\
    \ in this book, but you will quickly see which kind of problems this library solves.\n\
    \nSince Anko is a library written specifically for Android, understanding what\
    \ it does behind the scenes is a good exercise. You can navigate at any moment\
    \ to Anko’s source code using `ctrl + click` (Windows or Linux) or `cmd + click`\
    \ (Mac). Anko’s implementation is an excellent example to learn useful ways to\
    \ get the most out of Kotlin language.\n\n### 7.2 Start using Anko\n\nBefore going\
    \ any further, let’s use Anko to improve a couple of things. As you will see,\
    \ anytime you use something from Anko, it includes an import with the name of\
    \ the property or function to the file. Anko uses extension functions to add new\
    \ features to the Android framework, and the import links to them. We will see\
    \ right below what an extension function is and how to write it.\n\nIn `MainActivity::onCreate`,\
    \ an Anko extension function can be used instead of `findViewById` to find the\
    \ `RecyclerView`. Since API 26, it is not necessary anymore, as `findViewById`\
    \ is now generic, but it will serve us as an example:\n\n```\n1 val forecastList:\
    \ RecyclerView = find(R.id.forecast_list) \n```\nactivities/MainActivity.kt\n\n\
    Take a look at the imports, and see that the function `find` was added there:\n\
    \n```\n1 import org.jetbrains.anko.find\n```\n\nThis is all we can use from the\
    \ library for now, but Anko can help us simplify, among others, the instantiation\
    \ of intents, the navigation between activities, the creation of fragments, database\
    \ access, or building alerts. We will find several examples while we implement\
    \ the app.\n\n### 7.3 Extension functions\n\nAn extension function is a function\
    \ that adds a new behavior to a class, even if we do not have access to the source\
    \ code. In Java, we usually implement them in utility classes which include a\
    \ set of static methods. The advantage of using extension functions in Kotlin\
    \ is that we don’t need to pass the object as an argument. The extension function\
    \ acts as part of the class, and we can implement it using `this`.\n\nFor instance,\
    \ we can create a `toast` function that could be used by any `Context` and those\
    \ whose type extends `Context`, such as `Activity` or `Service`:\n\n```\n1 fun\
    \ Context.toast(message: CharSequence, duration: Int = Toast.LENGTH_SHORT) {\n\
    2     Toast.makeText(this, message, duration).show()\n3 }\n```\n\nNow you can\
    \ use this extension inside an activity, for instance:\n\n```\n1 toast(\"Hello\
    \ world!\")\n2 toast(\"Hello world!\", Toast.LENGTH_LONG)\n```\n\nOf course, Anko\
    \ already includes its own `toast` extension function, very similar to this one.\
    \ The library provides functions for both `CharSequence` and resources, and different\
    \ names for short and long toasts:\n\n```\n1 toast(\"Hello world!\")\n2 longToast(R.string.hello_world)\n\
    ```\n\nExtensions can also be properties. So you can create extension properties\
    \ in a very similar way. Thanks to this code below, you could add an extra property\
    \ to `ViewGroup` to get a list of its child views:\n\n```\n1 val ViewGroup.childViews:\
    \ List<View>\n2     get() = (0 until childCount).map { getChildAt(it) }\n```\n\
    \nDo not pay much attention to the implementation yet, as we still need to cover\
    \ some of the concepts here. Extension functions do not modify the original class.\
    \ You may find a static import added to the file where you used it. You can declare\
    \ extension functions anywhere, so a common practice is to create files that hold\
    \ a set of related functions.\n\nExtension functions are the magic behind many\
    \ Anko features. From now on, you can create your magic too.\n\nThis chapter has\
    \ little changes; [you can find the source code here](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-7).\n"
  raw: "So the way we think about coding changes a bit in Kotlin if we want to make\
    \ use of immutability. **The key concept: just use `val` as much as possible**.\
    \ There are situations (especially in Android, where the constructor is called\
    \ by the system for several classes) where immutability becomes hard to implement,\
    \ but most of the time it will be possible.\n\nAnother thing mentioned before\
    \ is that we can usually avoid specifying object types, the compiler infers them\
    \ from the value, which makes the code cleaner and faster to modify. We already\
    \ have some examples from the section above.\n\n```\n1 val s = \"Example\" //\
    \ A String\n2 val i = 23 // An Int\n3 val actionBar = supportActionBar // An ActionBar\
    \ in an Activity context\n```\n\nHowever, a type needs to be specified if we want\
    \ to use a more generic type:\n\n```\n1 val a: Any = 23\n2 val c: Context = activity\n\
    ```\n\n### 6.3 Properties\n\nProperties are the equivalent of fields in Java,\
    \ but much more powerful. Properties do the work of a field plus a getter plus\
    \ a setter. Let’s see an example to compare the difference. The following snippet\
    \ shows the code required in Java to access and modify a field safely:\n\n```\n\
    \ 1 public class Person {\n 2 \n 3     private String name;\n 4 \n 5     public\
    \ String getName() {\n 6         return name;\n 7     }\n 8 \n 9     public void\
    \ setName(String name) {\n10         this.name = name;\n11     }\n12 }\n13 \n\
    14 ...\n15 \n16 Person person = new Person();\n17 person.setName(\"name\");\n\
    18 String name = person.getName();\n```\n\nIn Kotlin, you only need a property\
    \ to achieve the same behavior:\n\n```\n 1 class Person {\n 2     \n 3     var\
    \ name: String = \"\"\n 4         \n 5 }\n 6 \n 7 ...\n 8 \n 9 val person = Person()\n\
    10 person.name = \"name\"\n11 val name = person.name\n```\n\nIf nothing is specified,\
    \ the property uses the default getter and setter. It can, of course, be modified\
    \ to run whatever custom behavior you need, without having to change the existing\
    \ code:\n\n```\n1 class Person {\n2 \n3     var name: String = \"\"\n4       \
    \  get() = field.toUpperCase()\n5         set(value) {\n6             field =\
    \ \"Name: $value\"\n7         }\n8 \n9 }\n```\n\nIf the property needs access\
    \ to its value in a custom getter or setter (as in this case), it requires the\
    \ creation of a **backing field**. It can be accessed by using `field`, a reserved\
    \ word, and it is automatically created when the compiler finds that it is required.\
    \ Take into account that if we used the property directly, we would be using the\
    \ setter and getter, and not doing a direct assignment. You can only use the backing\
    \ field inside the accessors of the property.\n\nAs mentioned in some previous\
    \ chapters, when dealing with code written in Java, Kotlin allows using the property\
    \ syntax where a getter, and optionally a setter, are defined in Java. The compiler\
    \ just links to the original getters and setters, so there are no performance\
    \ penalties when using these mapped properties.\n\n## 7 Anko and Extension Functions\n\
    \nThe Kotlin team has developed some great tools to make Android development more\
    \ accessible. In this chapter, I talk you about them and how you can start using\
    \ them.\n\n### 7.1 What is Anko?\n\n[Anko](https://github.com/JetBrains/anko)\
    \ is a robust library developed by JetBrains. Its primary purpose is the generation\
    \ of UI layouts by using code instead of XML. This feature is interesting; try\
    \ it out if you have the chance, but I will not be using it in this project. To\
    \ me (probably due to years of experience writing user interfaces) using XML is\
    \ more comfortable, but you might think differently.\n\nHowever, this is not the\
    \ only feature we can get from this library. Anko includes many helpful functions\
    \ and properties that avoid lots of boilerplate. There are several examples covered\
    \ in this book, but you will quickly see which kind of problems this library solves.\n\
    \nSince Anko is a library written specifically for Android, understanding what\
    \ it does behind the scenes is a good exercise. You can navigate at any moment\
    \ to Anko’s source code using `ctrl + click` (Windows or Linux) or `cmd + click`\
    \ (Mac). Anko’s implementation is an excellent example to learn useful ways to\
    \ get the most out of Kotlin language.\n\n### 7.2 Start using Anko\n\nBefore going\
    \ any further, let’s use Anko to improve a couple of things. As you will see,\
    \ anytime you use something from Anko, it includes an import with the name of\
    \ the property or function to the file. Anko uses **extension functions** to add\
    \ new features to the Android framework, and the import links to them. We will\
    \ see right below what an extension function is and how to write it.\n\nIn `MainActivity::onCreate`,\
    \ an Anko extension function can be used instead of `findViewById` to find the\
    \ `RecyclerView`. Since API 26, it is not necessary anymore, as `findViewById`\
    \ is now generic, but it will serve us as an example:\n\n```\n1 val forecastList:\
    \ RecyclerView = find(R.id.forecast_list) \n```\n\nactivities/MainActivity.kt\n\
    \nTake a look at the imports, and see that the function `find` was added there:\n\
    \n```\n1 import org.jetbrains.anko.find\n```\n\nThis is all we can use from the\
    \ library for now, but Anko can help us simplify, among others, the instantiation\
    \ of intents, the navigation between activities, the creation of fragments, database\
    \ access, or building alerts. We will find several showcase examples while we\
    \ implement the app.\n\n### 7.3 Extension functions\n\nAn extension function is\
    \ a function that adds a new behavior to a class, even if we do not have access\
    \ to the source code of that class. It is a way to extend classes which lack some\
    \ useful functions. In Java, we usually implement them in utility classes which\
    \ include a set of static methods. The advantage of using extension functions\
    \ in Kotlin is that we don’t need to pass the object as an argument. The extension\
    \ function acts as part of the class, and we can implement it using `this` and\
    \ all its public methods.\n\nFor instance, we can create a `toast` function that\
    \ could be used by any `Context` objects and those whose type extends `Context`,\
    \ such as `Activity` or `Service`:\n\n```\n1 fun Context.toast(message: CharSequence,\
    \ duration: Int = Toast.LENGTH_SHORT) {\n2     Toast.makeText(this, message, duration).show()\n\
    3 }\n```\n\nNow you can use this extension inside an activity, for instance:\n\
    \n```\n1 toast(\"Hello world!\")\n2 toast(\"Hello world!\", Toast.LENGTH_LONG)\n\
    ```\n\nOf course, Anko already includes its own `toast` extension function, very\
    \ similar to this one. The library provides functions for both `CharSequence`\
    \ and resources, and different names for short and long toasts:\n\n```\n1 toast(\"\
    Hello world!\")\n2 longToast(R.string.hello_world)\n```\n\nExtensions can also\
    \ be properties. So you can create extension properties in a very similar way.\
    \ Thanks to this code below, you could add an extra property to `ViewGroup` to\
    \ get a list of its child views:\n\n```\n1 val ViewGroup.childViews: List<View>\n\
    2     get() = (0 until childCount).map { getChildAt(it) }\n```\n\nDo not pay much\
    \ attention to the implementation yet, as we still need to cover some of the concepts\
    \ here.\n\nExtension functions do not modify the original class. You may find\
    \ a static import added to the file where you used it. You can declare extension\
    \ functions anywhere, so a common practice is to create files that hold a set\
    \ of related functions.\n\nExtension functions are the magic behind many Anko\
    \ features. From now on, you can create your magic too.\n\nThis chapter has little\
    \ changes; [you can find the source code here](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-7).\n\
    \n## 8 Retrieving data from API\n\n### 8.1 Performing a request"
