    \ we can substitute them by other objects that, for instance, implement the same\
    \ interface, or make use of mocks in tests.\n\nHowever, now those dependencies\
    \ must be provided from somewhere, so the dependency injection consists of providing\
    \ the collaborators required by the classes. Developers usually delegate this\
    \ task to a dependency injector. [Dagger](https://google.github.io/dagger/) is\
    \ probably the most famous dependency injector for Android. It is, of course,\
    \ an excellent alternative when we need some complexity to provide those dependencies.\n\
    \nBut a simpler alternative is to make use of default values in constructors.\
    \ We can provide the dependency by assigning a default value to constructor arguments,\
    \ and then provide a different instance if we need it in other situations. For\
    \ example, in our `ForecastDbHelper` we can provide the context in a smarter way:\n\
    \n```\n1 class ForecastDbHelper(ctx: Context = App.instance) : \n2     ManagedSQLiteOpenHelper(ctx,\
    \ ForecastDbHelper.DB_NAME, null, \n3     ForecastDbHelper.DB_VERSION) {\n4  \
    \   ...\n5 }\n```\n\nNow we have two ways to create this class:\n\n```\n1 val\
    \ dbHelper1 = ForecastDbHelper()  // It will use App.instance\n2 val dbHelper2\
    \ = ForecastDbHelper(mockedContext) // For tests, for example\n```\n\nI will be\
    \ using this mechanism here and there, so I did not want to continue without explaining\
    \ the motivation. We already have created the tables, so it is time to start adding\
    \ and requesting data from them. But before that, I want to talk about collections\
    \ and functional operations. Remember to [check the repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-17)\
    \ to find the latest changes.\n\n## 18 Collections and functional operations"
