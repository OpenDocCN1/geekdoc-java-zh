    \    }\n}\n```\n\n`build.gradle`\n\n如果你正在使用 `Android Studio 2.3`，你还需要如上所示添加 Google\
    \ 仓库。`Android Studio 3` 会自动为你完成这一操作。\n\n接下来，我们在模块文件中添加 `Anko` 库依赖，更新 `AppCompat`\
    \ 以使用我们的变量，并应用 `Kotlin Android Extensions` 插件：\n\n```\napply plugin: 'com.android.application'\n\
    apply plugin: 'kotlin-android'\napply plugin: 'kotlin-android-extensions'\n\n\
    android {\n    ...\n}\n\ndependencies {\n    implementation \"com.android.support:appcompat-v7:$support_version\"\
    \n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version\"\n\
    \    implementation \"org.jetbrains.anko:anko-common:$anko_version\"\n}\n```\n\
    \n`app/build.gradle`\n\n通过这些更改，我们应该已经准备好开始了。\n\n### 3.5 测试一切是否正常工作\n\n我们将添加一些代码来检查\
    \ `Kotlin Android Extensions` 是否功能完整。我暂时还不对其进行详细解释，但我想确保它对你来说是可以工作的。\n\n首先，进入\
    \ `activity_main.xml` 并为 `TextView` 设置一个 id：\n\n```\n<TextView\n    android:id=\"\
    @+id/message\"\n    android:text=\"@string/hello_world\"\n    android:layout_width=\"\
    wrap_content\"\n    android:layout_height=\"wrap_content\"/>\n```\n\n`activity_main.xml`\n\
    \n在 `onCreate` 中，尝试为 `TextView` 编写你之前选择的 id（在本例中为 `message`）：\n\n```\noverride\
    \ fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n\
    \    setContentView(R.layout.activity_main)\n    message.text = \"Hello Kotlin!\"\
    \n}\n```\n\n`MainActivity.kt`\n\n你看到魔法了吗？你不需要查找它或使用第三方库即可访问该视图。`Kotlin Android\
    \ Extensions` 是包含在主 Kotlin 插件中的一个插件，这正是它的主要目的。请耐心等待，很快就会向你展示如何正确使用它。\n\n你还会看到活动中自动添加了一个合成导入（synthetic\
    \ import），但我们还没有介绍这部分：\n\n```\nimport kotlinx.android.synthetic.main.activity_main.*\n\
    ```\n\n`MainActivity.kt`\n\n得益于 Kotlin 与 Java 的互操作性，我们可以将 Java 库的 setter 和 getter\
    \ 方法作为 Kotlin 中的属性使用。我们稍后也会讨论属性，但请注意我们可以免费地使用 `message.text` 而不是 `message.setText`。编译器使用真实的\
    \ Java 方法，因此在使用时没有性能开销。\n\n现在运行应用并检查一切是否运行正常。检查消息的 `TextView` 是否显示了新内容。如果你有任何疑问或想修改某些代码，请查看\
    \ [Kotlin for Android Developers 仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-3)。当新内容涉及代码修改时，我为每个章节创建了一个分支，因此请务必查看以检查所有更改。\n\
    \n接下来的章节将涵盖你在转换后的 `MainActivity` 中看到的一些新内容。一旦你理解了 Java 和 Kotlin 之间的细微差异，你就可以自己编写新代码而不会有任何困扰。\n\
    \n## 4 类和函数\n\nKotlin 中的类遵循直观的结构。然而，在我们继续之前，你可能想了解它与 Java 的的一些细微差异。你可以使用 [try.kotlinlang.org](http://try.kotlinlang.org/)\
    \ 来测试此以及其他一些简单示例，而不需要真实的项目。\n\n你还可以使用 Kotlin 插件附带的 REPL。你可以在 `Tools -> Kotlin\
    \ -> Kotlin REPL` 中找到它。\n\n### 4.1 如何声明一个类\n\n如果你想声明一个类，只需要使用 `class` 关键字：\n\n\
    ```\nclass MainActivity {\n    \n}\n```\n\n类有一个唯一的默认构造函数。我们将看到可以为某些特殊情况创建额外的构造函数，但请记住，大多数情况只需要一个构造函数。参数写在名称之后。如果类是空的，则不需要大括号：\n\
    \n```\nclass Person(name: String, surname: String) \n```\n\n那么构造函数的体在哪里？你可以声明一个\
    \ `init` 块：\n\n```\nclass Person(name: String, surname: String) {\n    init {\n\
    \        ...\n    }\n}\n```\n\n### 4.2 类继承\n\n默认情况下，类总是继承自 `Any`（类似于 Java 的 `Object`），但我们可以扩展任何其他类。\n\
    \n```\nclass Animal {\n    open fun makeSound() {\n        println(\"Animal sound\"\
    )\n    }\n}\n\nclass Dog : Animal() {\n    override fun makeSound() {\n      \
    \  println(\"Bark\")\n    }\n}\n```\n\n### 4.3 函数\n\nKotlin 中的函数使用 `fun` 关键字声明：\n\
    \n```kotlin\nfun sum(a: Int, b: Int): Int {\n    return a + b\n}\n```\n\n`Unit`\
    \ 类似于 Java 中的 `void`，用于不返回值的函数：\n\n```kotlin\nfun greet(): Unit {\n    println(\"\
    Hello, World!\")\n}\n```\n\n你也可以对简单函数使用表达式语法：\n\n```kotlin\nfun multiply(a: Int,\
    \ b: Int) = a * b\n```\n\n### 4.4 构造函数和参数\n\nKotlin 中的参数与 Java 有不同。你可以直接在主构造函数中定义属性：\n\
    \n```kotlin\nclass User(val name: String, var age: Int)\n```\n\n参数的一个方便之处是我们可以通过指定**默认值**让它们变得可选：\n\
    \n```kotlin\nfun toast(message: String, length: Int = Toast.LENGTH_SHORT) {\n\
    \    Toast.makeText(this, message, length).show()\n}\n```\n\n这允许你以不同的方式调用函数：\n\
    \n```\ntoast(\"Hello\")\ntoast(\"Hello\", Toast.LENGTH_LONG)\n```\n\n还有另一种选择，因为你可以使用**命名参数**，这意味着可以在值之前编写参数名称来指定你想要的哪一个：\n\
    \n```\ntoast(message = \"Hello\", length = Toast.LENGTH_SHORT)\n```\n\n## 5 编写你的第一个类\n\
    \n我们已经有了 `MainActivity.kt` 类。此活动将渲染未来七天的每日预报列表，因此布局需要一些更改。\n\n### 5.1 创建布局\n\n"
- fmt: "\nThe main view that will render the forecast list will be a `RecyclerView`,\
    \ so a new dependency is required. Modify the `build.gradle` file:\n\n```\n1 dependencies\
    \ {\n2     compile fileTree(dir: 'libs', include: ['*.jar'])\n3     compile \"\
    com.android.support:appcompat-v7:$support_version\"\n4     compile \"com.android.support:recyclerview-v7:$support_version\"\
    \n5     ...\n6 }\n```\n\n`app/build.gradle`\n\nNow, in `activity_main.xml`:\n\n\
    ```\n 1 <FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n 2              android:layout_width=\"match_parent\"\n 3              android:layout_height=\"\
    match_parent\">\n 4 \n 5     <android.support.v7.widget.RecyclerView\n 6     \
    \    android:id=\"@+id/forecast_list\"\n 7         android:layout_width=\"match_parent\"\
    \n 8         android:layout_height=\"match_parent\"/>\n 9 \n10 </FrameLayout>\n\
    ```\n\n`activity_main.xml`\n\nIn `MainActivity.kt`, remove the line we added to\
    \ test that everything worked (it will be showing an error now). We will continue\
    \ using the good old `findViewById()` for the time being:\n\n```\n1 val forecastList\
    \ = findViewById(R.id.forecast_list) as RecyclerView\n2 forecastList.layoutManager\
    \ = LinearLayoutManager(this)\n```\n\n`MainActivity.kt`\n\nAs you can see, we\
    \ define the variable and cast it to `RecyclerView`. It is a bit different from\
    \ Java; we are reviewing these differences in the next chapter. A `LayoutManager`\
    \ is also specified, using the property naming instead of the setter. A list is\
    \ enough for this layout, so let’s make use of a `LinearLayoutManager`.\n\n###\
    \ 5.2 The Recycler Adapter\n\nWe need an adapter for the recycler too. I [talked\
    \ about `RecyclerView` on my blog](http://antonioleiva.com/recyclerview/) some\
    \ time ago, so it may help you if you are not used to it.\n\nThe views used for\
    \ `RecyclerView` adapter will be just `TextView`s for now, and a simple list of\
    \ texts that we will create manually. Add a new Kotlin file called `ForecastListAdapter.kt`,\
    \ and include this code:\n\n```\n 1 class ForecastListAdapter(val items: List<String>)\
    \ : \n 2         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 3\
    \ \n 4     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int):\
    \ \n 5             ViewHolder {\n 6         return ViewHolder(TextView(parent.context))\n\
    \ 7     }\n 8 \n 9     override fun onBindViewHolder(holder: ViewHolder, position:\
    \ Int) {\n10         holder.textView.text = items[position]\n11     }\n12 \n13\
    \     override fun getItemCount(): Int = items.size\n14 \n15     class ViewHolder(val\
    \ textView: TextView) : RecyclerView.ViewHolder(textView)\n16 }\n```\n\n`ForecastListAdapter.kt`\n\
    \nAgain, we can access the context and the text as properties. You can keep doing\
    \ it as usual (using getters and setters), but you will get a warning from the\
    \ compiler. This check can be disabled if you prefer to keep using the Java way.\
    \ However, once you get used to properties, you will never look back.\n\nIf you\
    \ check the previous code, you may find there are warnings for a couple of things.\
    \ The first one is recommending to set the `items` argument to private, as it\
    \ is being used only inside the class.\n\n```\n1 class ForecastListAdapter(private\
    \ val items: List<String>)\n```\n\nThe other is recommending to write single-lined\
    \ functions using an expression body. Let’s follow the recommendations here too:\n\
    \n```\n1 override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =\n\
    2         ViewHolder(TextView(parent.context))\n```\n\nSo the complete resulting\
    \ code is:\n\n```\n 1 class ForecastListAdapter(private val items: List<String>)\
    \ \n 2     : RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 3 \n 4\
    \     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =\n 5\
    \             ViewHolder(TextView(parent.context))\n 6 \n 7     override fun onBindViewHolder(holder:\
    \ ViewHolder, position: Int) {\n 8         holder.textView.text = items[position]\n\
    \ 9     }\n10 \n11     override fun getItemCount(): Int = items.size\n12 \n13\
    \     class ViewHolder(val textView: TextView) : RecyclerView.ViewHolder(textView)\n\
    14 }\n```\n\n`ForecastListAdapter.kt`\n\nBack to the `MainActivity`, let’s create\
    \ the list of strings and then an instance of the adapter:\n\n```\n 1 private\
    \ val items = listOf(\n 2     \"Mon 6/23 - Sunny - 31/17\",\n 3     \"Tue 6/24\
    \ - Foggy - 21/8\",\n 4     \"Wed 6/25 - Cloudy - 22/17\",\n 5     \"Thurs 6/26\
    \ - Rainy - 18/11\",\n 6     \"Fri 6/27 - Foggy - 21/10\",\n 7     \"Sat 6/28\
    \ - TRAPPED IN WEATHERSTATION - 23/18\",\n 8     \"Sun 6/29 - Sunny - 20/7\"\n\
    \ 9 )\n10 \n11 override fun onCreate(savedInstanceState: Bundle?) {\n12     val\
    \ forecastList = findViewById(R.id.forecast_list) as RecyclerView\n13     forecastList.layoutManager\
    \ = LinearLayoutManager(this)\n14     forecastList.adapter = ForecastListAdapter(items)\n\
    15 }\n```\n\n`MainActivity.kt`\n\n### 6. Variables and properties\n\nIn Kotlin,\
    \ **everything is an object**. There are some differences from Java:\n\n### 6.1\
    \ Basic types\n\nThere are no automatic conversions among numeric types. For instance,\
    \ `Int` to `Double`:\n\n```\nval i = 7\nval d = i.toDouble()\n```\n\n*   Characters\
    \ (`Char`) cannot directly used as numbers. We can, however, convert them to:\n\
    \n```\nval c = 'c'\nval i = c.toInt()\n```\n\n*   Bitwise operations are a bit\
    \ different. In Android, we use flags `and` and `or` as an example:\n\n```\n//\
    \ Java\nint bitwiseOr = FLAG1 | FLAG2;\nint bitwiseAnd = FLAG1 & FLAG2;\n```\n\
    \n```\n// Kotlin\nval bitwiseOr = FLAG1 or FLAG2\nval bitwiseAnd = FLAG1 and FLAG2\n\
    ```\n\n*   Literals can give information about its type. It is not a requirement,\
    \ but a common practice in Kotlin is to omit variable types to let it infer the\
    \ type from the literal:\n\n```\nval i = 12 // An Int\nval iHex = 0x0f // An Int\
    \ from hexadecimal literal\nval l = 3L // A Long\nval d = 3.5 // A Double\nval\
    \ f = 3.5F // A Float\n```\n\n*   A `String` can be accessed as an array and can\
    \ be iterated:\n\n```\nval s = \"Example\"\nval c = s[2] // This is the Char 'a'\n\
    \n// Iterate over String\nval s = \"Example\"\nfor (c in s) {\n    print(c)\n\
    }\n```\n\n### 6.2 Immutability\n\nVariables in Kotlin can be easily defined as\
    \ mutable (`var`) or immutable (`val`). The idea is very similar to using `final`\
    \ in Java variables.\n\nAn immutable object is an object whose state cannot change\
    \ after instantiation. If you need a modified version, you need to create a new\
    \ object. Immutability makes software more robust and predictable. In Java, most\
    \ objects are mutable, which means that any part of the code which has access\
    \ to it can modify it, affecting the rest of the application.\n\nImmutable objects\
    \ are also thread-safe by definition. As the value is constant, all threads always\
    \ get the same object.\n"
  raw: "The main view that will render the forecast list will be a `RecyclerView`,\
    \ so a new dependency is required. Modify the `build.gradle` file:\n\n```\n1 dependencies\
    \ {\n2     compile fileTree(dir: 'libs', include: ['*.jar'])\n3     compile \"\
    com.android.support:appcompat-v7:$support_version\"\n4     compile \"com.android.support:recyclerview-v7:$support_version\"\
    \n5     ...\n6 }\n```\n\napp/build.gradle\n\nNow, in `activity_main.xml` :\n\n\
    ```\n 1 <FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n 2              android:layout_width=\"match_parent\"\n 3              android:layout_height=\"\
    match_parent\">\n 4 \n 5     <android.support.v7.widget.RecyclerView\n 6     \
    \    android:id=\"@+id/forecast_list\"\n 7         android:layout_width=\"match_parent\"\
    \n 8         android:layout_height=\"match_parent\"/>\n 9 \n10 </FrameLayout>\n\
    ```\n\nactivity_main.xml\n\nIn `MainActivity.kt`, remove the line we added to\
    \ test that everything worked (it will be showing an error now). We will continue\
    \ using the good old `findViewById()` for the time being:\n\n```\n1 val forecastList\
    \ = findViewById(R.id.forecast_list) as RecyclerView\n2 forecastList.layoutManager\
    \ = LinearLayoutManager(this)\n```\n\nMainActivity.kt\n\nAs you can see, we define\
    \ the variable and cast it to `RecyclerView`. It is a bit different from Java;\
    \ we are reviewing these differences in the next chapter. A `LayoutManager` is\
    \ also specified, using the property naming instead of the setter. A list is enough\
    \ for this layout, so let’s make use of a `LinearLayoutManager`.\n\n### 5.2 The\
    \ Recycler Adapter\n\nWe need an adapter for the recycler too. I [talked about\
    \ `RecyclerView` on my blog](http://antonioleiva.com/recyclerview/) some time\
    \ ago, so it may help you if you are not used to it.\n\nThe views used for `RecyclerView`\
    \ adapter will be just `TextView`s for now, and a simple list of texts that we\
    \ will create manually. Add a new Kotlin file called `ForecastListAdapter.kt`,\
    \ and include this code:\n\n```\n 1 class ForecastListAdapter(val items: List<String>)\
    \ : \n 2         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 3\
    \ \n 4     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int):\
    \ \n 5             ViewHolder {\n 6         return ViewHolder(TextView(parent.context))\n\
    \ 7     }\n 8 \n 9     override fun onBindViewHolder(holder: ViewHolder, position:\
    \ Int) {\n10         holder.textView.text = items[position]\n11     }\n12 \n13\
    \     override fun getItemCount(): Int = items.size\n14 \n15     class ViewHolder(val\
    \ textView: TextView) : RecyclerView.ViewHolder(textView)\n16 }\n```\n\nForecastListAdapter.kt\n\
    \nAgain, we can access the context and the text as properties. You can keep doing\
    \ it as usual (using getters and setters), but you will get a warning from the\
    \ compiler. This check can be disabled if you prefer to keep using the Java way.\
    \ However, once you get used to properties, you will never look back.\n\nIf you\
    \ check the previous code, you may find there are warnings for a couple of things.\
    \ The first one is recommending to set the `items` argument to private, as it\
    \ is being used only inside the class.\n\n```\n1 class ForecastListAdapter(private\
    \ val items: List<String>)\n```\n\nThe other is recommending to write single-lined\
    \ functions using an expression body. Let’s follow the recommendations here too:\n\
    \n```\n1 override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =\n\
    2         ViewHolder(TextView(parent.context))\n```\n\nSo the complete resulting\
    \ code is:\n\n```\n 1 class ForecastListAdapter(private val items: List<String>)\
    \ \n 2     : RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n 3 \n 4\
    \     override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =\n 5\
    \             ViewHolder(TextView(parent.context))\n 6 \n 7     override fun onBindViewHolder(holder:\
    \ ViewHolder, position: Int) {\n 8         holder.textView.text = items[position]\n\
    \ 9     }\n10 \n11     override fun getItemCount(): Int = items.size\n12 \n13\
    \     class ViewHolder(val textView: TextView) : RecyclerView.ViewHolder(textView)\n\
    14 }\n```\n\nForecastListAdapter.kt\n\nBack to the `MainActivity`, let’s create\
    \ the list of strings and then an instance of the adapter:\n\n```\n 1 private\
    \ val items = listOf(\n 2     \"Mon 6/23 - Sunny - 31/17\",\n 3     \"Tue 6/24\
    \ - Foggy - 21/8\",\n 4     \"Wed 6/25 - Cloudy - 22/17\",\n 5     \"Thurs 6/26\
    \ - Rainy - 18/11\",\n 6     \"Fri 6/27 - Foggy - 21/10\",\n 7     \"Sat 6/28\
    \ - TRAPPED IN WEATHERSTATION - 23/18\",\n 8     \"Sun 6/29 - Sunny - 20/7\"\n\
    \ 9 )\n10 \n11 override fun onCreate(savedInstanceState: Bundle?) {\n12     ...\n\
    13     val forecastList = findViewById<RecyclerView>(R.id.forecast_list)\n14 \
    \    forecastList.layoutManager = LinearLayoutManager(this)\n15     forecastList.adapter\
    \ = ForecastListAdapter(items)\n16 }\n```\n\nMainActivity.kt\n\nI have also moved\
    \ some classes to new packages to achieve a better project structure, so [check\
    \ the corresponding branch](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-5)\
    \ if you want to follow the same organization.\n\nWe examined numerous new ideas\
    \ in such a small amount of code, so let’s cover them in the next chapter. We\
    \ must stop here to learn some crucial concepts regarding basic types, variables,\
    \ and properties.\n\n## 6 Variables and properties\n\nIn Kotlin, **everything\
    \ is an object**. There are no primitive types as the ones we can use in Java.\
    \ That is helpful because we have a uniform way to deal with all the available\
    \ types.\n\n### 6.1 Basic types\n\nOf course, basic types such as integers, floats,\
    \ characters or booleans still exist, but they all act like an object. The name\
    \ of the basic types and the way they work are very similar to Java, but there\
    \ are some differences you might take into account:\n\n*   There are no automatic\
    \ conversions among numeric types. For instance, you cannot assign an `Int` to\
    \ a `Double` variable. An explicit conversion must be done, using one of the many\
    \ functions available:\n\n```\n1 val i: Int = 7\n2 val d: Double = i.toDouble()\n\
    ```\n\n*   Characters (`Char`) cannot directly be used as numbers. We can, however,\
    \ convert them to a number when we need it:\n\n```\n1 val c: Char = 'c'\n2 val\
    \ i: Int = c.toInt()\n```\n\n*   Bitwise arithmetical operations are a bit different.\
    \ In Android, we use bitwise `or` quite often for flags, so I will stick to “`and`”\
    \ and “`or` “ as an example:\n\n```\n1 // Java\n2 int bitwiseOr = FLAG1 | FLAG2;\n\
    3 int bitwiseAnd = FLAG1 & FLAG2;\n```\n\n```\n1 // Kotlin\n2 val bitwiseOr =\
    \ FLAG1 or FLAG2\n3 val bitwiseAnd = FLAG1 and FLAG2\n```\n\n*   Literals can\
    \ give information about its type. It is not a requirement, but a common practice\
    \ in Kotlin is to omit variable types (we will see it soon), so we can give some\
    \ clues to the compiler to let it infer the type from the literal:\n\n```\n1 val\
    \ i = 12 // An Int\n2 val iHex = 0x0f // An Int from hexadecimal literal\n3 val\
    \ l = 3L // A Long\n4 val d = 3.5 // A Double\n5 val f = 3.5F // A Float\n```\n\
    \n*   A `String` can be accessed as an array and can be iterated:\n\n```\n1 val\
    \ s = \"Example\"\n2 val c = s[2] // This is the Char 'a'\n```\n\n```\n1 // Iterate\
    \ over String\n2 val s = \"Example\"\n3 for (c in s) {\n4     print(c)\n5 }\n\
    ```\n\n### 6.2 Variables\n\nVariables in Kotlin can be easily defined as mutable\
    \ (`var`) or immutable (`val`). The idea is very similar to using `final` in Java\
    \ variables. However,**immutability** is a fundamental concept in Kotlin (and\
    \ many other modern languages).\n\nAn immutable object is an object whose state\
    \ cannot change after instantiation. If you need a modified version, you need\
    \ to create a new object. Immutability makes software more robust and predictable.\
    \ In Java, most objects are mutable, which means that any part of the code which\
    \ has access to it can modify it, affecting the rest of the application.\n\nImmutable\
    \ objects are also thread-safe by definition. As the value is constant, you do\
    \ not need to implement any particular synchronized mechanism, because all threads\
    \ always get the same object."
