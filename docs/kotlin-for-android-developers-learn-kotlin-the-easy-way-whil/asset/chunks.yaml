    match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:textAppearance=\"\
    @style/TextAppearance.AppCompat.Medium\"\n    tools:text=\"May 14, 2015\"/>\n\n\
    <TextView\n    android:id=\"@+id/descriptionText\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:textAppearance=\"\
    @style/TextAppearance.AppCompat.Caption\"\n    tools:text=\"Light Rain\"/>\n```\n\
    \n`layout/item_forecast.xml`\n\nOur app is now using Kotlin Android Extensions\
    \ to find the views. Run it and check that everything is working as expected.\n\
    \nKotlin Android Extensions plugin helps us reduce some more boilerplate and minimize\
    \ the code required to access our views. Check the latest changes [in the repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-15).\n\
    \n# 16 Application Singleton and Delegated Properties\n\nWe are implementing a\
    \ database soon and if we want to keep our code simple and our app in independent\
    \ layers (instead of everything added to our activity), we need to have easier\
    \ access to the application context.\n\n## 16.1 Application Singleton\n\nThe simplest\
    \ way is to create a singleton the way we would do in Java:\n\n```\nclass App\
    \ : Application() {\n\n    companion object {\n        private var instance: Application?\
    \ = null\n        fun instance() = instance!!\n    }\n\n    override fun onCreate()\
    \ {\n        super.onCreate()\n        instance = this\n    }\n}\n```\n\n`ui/App.kt`\n\
    \nRemember you need to add this `App` class to the `AndroidManifest.xml` in order\
    \ to be used as the application instance:\n\n```xml\n<application\n    android:allowBackup=\"\
    true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
    \n    android:theme=\"@style/AppTheme\"\n    android:name=\".ui.App\">\n    ...\n\
    </application>\n```\n`AndroidManifest.xml`\n\nThe problem with Android is that\
    \ we do not have control over many class constructors. For instance, we cannot\
    \ initialize a non-nullable property, because its value must be declared in the\
    \ constructor. So we need a nullable variable and then a function that returns\
    \ a non-nullable value. We know we always have an `App` instance, and that the\
    \ first code that executes is application `onCreate`, so we are safe by assuming\
    \ `instance()` function can always return a non-nullable `App` instance.\n\nHowever,\
    \ this solution seems strange. We need to define a property (which already has\
    \ a getter and a setter) and then a function to return that property. Do we have\
    \ another way to get a similar result? Yes, we can delegate the value of a property\
    \ to another class.\n\n## 16.2 Delegated Properties\n\nThere are some typical\
    \ behaviors we may need in a property that would be interesting to be reused,\
    \ such as lazy values or observable properties. Instead of having to declare the\
    \ same code over and over again, Kotlin provides a way to delegate the code that\
    \ a property needs to another class. These members are known as delegated properties.\
    \ \n\nWhen we use `get` or `set` from a property, the delegate calls to its corresponding\
    \ `getValue` and `setValue`, which can decide if, when and how the value is set\
    \ or returned.\n\nThe structure of a property delegate is:\n\n```\nclass Delegate<T>\
    \ {\n    operator fun getValue(thisRef: Any?, property: KProperty<*>): T {\n \
    \       return ...\n    }\n\n    operator fun setValue(thisRef: Any?, property:\
    \ KProperty<*>, value: T) {\n        ...\n    }\n}\n```\n\nThe `T` is the type\
    \ of the property that is delegating its behavior. The `getValue` function receives\
    \ a reference to the class and the metadata of the property. The `setValue` function\
    \ also receives the assigned value. If the property is immutable (`val`), it only\
    \ requires the `getValue` function.\n\nThe snippet below is an example of how\
    \ the property delegate is assigned:\n\n```kotlin\nclass Example {\n  var p: String\
    \ by Delegate()\n}\n```\n\nIt uses `by` reserved word to specify the delegation.\n\
    \n## 16.3 Standard Delegates\n\nYou can find a set of delegates included in the\
    \ Kotlin standard library. These are the most common circumstances where a delegate\
    \ may be useful, but we could also create our own.\n\n### Lazy\n\nIt takes a lambda\
    \ that runs after the first call to `getValue`, so the initialization of the property\
    \ is delayed up to that moment. Subsequent calls return the same value. This delegate\
    \ is very interesting for things that are not always used or require some other\
    \ parts to be ready before this one can be declared. We can save memory and skip\
    \ the initialization until the property is required.\n\n```kotlin\nclass App :\
    \ Application() {\n    val database: SQLiteOpenHelper by lazy {\n        MyDatabaseHelper(applicationContext)\n\
    \    }\n\n    override fun onCreate() {\n        super.onCreate()\n        val\
    \ db = database.writableDatabase\n    }\n}\n```\n\nIn this example, the database\
    \ does not initialize until it is called first time in `onCreate`. At that moment,\
    \ we are sure the application context exists and is ready to be used. The `lazy`\
    \ operation is thread-safe.\n\nYou can also use `lazy(LazyThreadSafetyMode.NONE)\
    \ { ... }` if you are not worried about multi-threading and want to get some extra\
    \ performance.\n\n### Observable\n\nThis delegate helps us detect changes on any\
    \ property we need to observe. It executes the declared lambda expression every\
    \ time the `set` function is called. So after the new value is assigned, we receive\
    \ the delegated property, the old value, and the new one.\n\n```kotlin\nclass\
    \ ViewModel(val db: MyDatabase) {\n\n    var myProperty by Delegates.observable(\"\
    \") {\n        _, _, new ->\n        db.saveChanges(this, new)\n    }\n\n}\n```\n\
    \nThis example represents some `ViewModel` class which is aware of `myProperty`\
    \ changes and saves them to the database every time a new value is assigned.\n\
    \n### Vetoable\n\nThis delegate is similar to observable, with the difference\
    \ that it runs before the value is assigned, and lets you decide whether the value\
    \ must be saved or not. It can be used to check some conditions before saving\
    \ a value.\n\n```kotlin\nvar positiveNumber = Delegates.vetoable(0) {\n    _,\
    \ _, new ->\n    new >= 0\n}\n```\n\nThe former only allows saving the new value\
    \ if it is a positive number. Inside lambdas, the latest line represents the return\
    \ value. You cannot use the `return` word because it will not compile.\n\n###\
    \ lateinit\n\nSometimes we need something else to initialize a property, but we\
    \ lack the necessary state available in the constructor, or we are even not able\
    \ to retrieve it at that point. This second case happens now and then in Android:\
    \ in activities, fragments, services or broadcast receivers for example. However,\
    \ a non-abstract property needs a value before the constructor finishes executing.\
    \ We cannot just wait until we want to assign a value to the property. We have\
    \ at least a couple of options.\n\nThe first one is to use a nullable type and\
    \ set it to null until we have the real value. With this solution, we then need\
    \ to check everywhere throughout the code whether the property is null or not.\
    \ If we are sure that the property will not be null the first time we use it,\
    \ this may make us write some unnecessary code.\n\nThe second alternative is `lateinit`,\
    \ which can be used to identify that the property should have a non-nullable value,\
    \ but we are delaying the assignment. If the value is requested before it is assigned,\
    \ it will throw an exception that identifies the accessed property.\n\n`late`\
    \ is not exactly a delegate, but a property modifier, and that is why it must\
    \ be written before the property.\n\nThis modifier is helpful in the App singleton\
    \ example:\n\n```kotlin\nclass App : Application() {\n\n    companion object {\n\
    \        lateinit var instance: App\n    }\n\n    override fun onCreate() {\n\
    \        super.onCreate()\n        instance = this\n    }\n}\n```\n"
