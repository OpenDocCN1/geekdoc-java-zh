    ```\n\n如果你希望在从 Java 调用 Kotlin 时指定类的名称，可以使用一个注解来修改它。在 `utils.kt` 文件中，在 `package`\
    \ 语句上方添加以下内容：\n\n```\n1 @file:JvmName(\"AndroidUtils\")\n```\n\n现在 Java 中的类名将命名为：\n\
    \n```\n1 AndroidUtils.logD(\"Debug\");\n2 AndroidUtils.logE(\"Error\");\n3 View\
