  trans: "\n你有两种选择来克服这种局面：\n\n*   使用 `open` 关键字，这将允许 Mockito mock 你的类，同时也允许任何其他类继承该类（这可能出于某种原因被设计为闭的）。\n\
    *   提取一个接口并 mock 该接口。这是一种更优雅的解决方案，但如果你没有将该接口用于其他任何地方，它也会有些多余。\n\n然而，还有第三种替代方案：Mockito\
    \ 2 中的一个实验性功能。该功能允许你 mock `final` 类并避免那些额外的产物。可能在你读到这些文字时，该功能已经不再是实验性的了。但如果它仍然是实验性的，你需要添加额外的库来启用该功能：\n\
    \n```\n1 testImplementation \"org.mockito:mockito-inline:$mockito_version\"\n\
    ```\n`app/build.gradle`\n\n即使它是实验性的，它的运行得也很好，所以请放心使用。\n\n现在你可以重新运行测试，看看它是如何神奇地通过的。\n\
    \n### 28.3 仪表测试 (Instrumentation tests)\n\n仪表测试稍有不同。它们通常用于测试 UI 交互，我们需要在测试执行时有一个运行中的\
    \ `Application` 实例。为了做到这一点，我们需要部署应用 并在设备上运行测试。\n\n这类测试位于 `androidTest` 文件夹中，在旧版本的\
    \ Android Studio 中，我们必须在“Build Variants”面板中将“Test Artifact” 更改为“Android Instrumentation\
    \ Tests”。实现仪表测试的官方库是 [Espresso](https://google.github.io/android-testing-support-library/)，它可以帮助我们通过编写\
    \ `Action` 轻松地在 App 中导航，并使用 `ViewMatcher` 和 `Matcher` 过滤和检查结果。\n\n配置起来比之前的要复杂一点。我们需要许多额外的库和\
    \ Gradle 配置。好在是 Kotlin 不会增加任何额外的开销，所以如果你已经知道如何配置 Espresso，这对你来说应该是很容易的。\n\n首先，在\
    \ `defaultConfig` 中指定测试运行：\n\n```\n1 defaultConfig {\n2     ...\n3     testInstrumentationRunner\
    \ \"android.support.test.runner.AndroidJUnitRunner\"\n4 }\n```\n`app/build.gradle`\n\
    \n一旦配置了 runner，就可以添加其余的依赖了，这次使用 `androidTestImplementation`。这样，这些库只会在我们编译运行仪表测试时才被添加：\n\
    \n```\n1 buildscript {\n2     ...\n3     ext.test_support_version = '1.0.1'\n\
    4     ext.espresso_version = '3.0.1'\n5 }\n```\n`build.gradle`\n\n```\n 1 dependencies\
    \ {\n 2     ...\n 3     androidTestImplementation \"com.android.support:support-annotations:$support_versi\\\
    \n 4 on\"\n 5     androidTestImplementation \"com.android.support.test:runner:$test_support_version\"\
    \n 6     androidTestImplementation \"com.android.support.test:rules:$test_support_version\"\
    \n 7     androidTestImplementation \"com.android.support.test.espresso:espresso-core:$espre\\\
    \n 8 sso_version\"\n 9     androidTestImplementation(\"com.android.support.test.espresso:espresso-contrib:$es\\\
    \n10 presso_version\") {\n11         exclude group: 'com.android.support', module:\
    \ 'appcompat-v7'\n12         exclude group: 'com.android.support', module: 'support-v4'\n\
    13         exclude group: 'com.android.support', module: 'design'\n14        \
    \ exclude group: 'com.android.support', module: 'recyclerview-v7'\n15 }\n```\n\
    `app/build.gradle`\n\n我不想花很多时间说这些，但这里是对为什么你需要这些库的简要说明：\n\n*   `runner`：它是测试运行器，我们在\
    \ `defaultConfig` 中指定的那个。\n*   `rules`：包含一些帮助测试加载和启动 activity 的规则。我们将在示例中使用一个规则。\n\
    *   `espresso-core`：Espresso 的基本功能，让仪表测试变得更容易库。\n*   `espresso-contrib`：它添加了一些额外功能，例如\
    \ `RecyclerView` 测试支持。我们必须排除它的某些依赖项，因为项目中已经有了它们，否则测试会崩溃。\n\n现在让我们创建一个简单的示例。测试将点击预报列表的第一行，并检查是否可以找到一个\
    \ id 为 `R.id.weatherDescription` 的视图。此视图位于 `DetailActivity` 中，这意味着我们在点击 `RecyclerView`\
    \ 内部的视图后成功地导航到了详情页。\n\n```\n1 class SimpleInstrumentationTest {\n2 \n3     @get:Rule\n\
    4     val activityRule = ActivityTestRule(MainActivity::class.java)\n5 \n6   \
    \  ...\n7 }\n```\n\n我们需要创建一个 activity 规则，它实例化测试将使用的 activity。在 Java 中，你会使用 `@Rule`\
    \ 对字段进行注解。然而，如你所知，字段和属性是不相同的，所以如果你只使用它，执行将失败，因为对属性内部字段的访问不是公共的。你需要做的是对 getter\
    \ 进行注解。Kotlin 允许通过在规则名称前指定 `get` 或 `set` 来这样做。在这种情况下，写 `@get:Rule`。\n\n之后，我们就可以准备好创建第一个测试了：\n\
    \n```\n1 @Test fun itemClickNavigatesToDetail() {\n2     onView(withId(R.id.forecastList)).perform(\n\
    3             RecyclerViewActions\n4                 .actionOnItemAtPosition<RecyclerView.ViewHolder>(0,\
    \ click()))\n5     onView(withId(R.id.weatherDescription))\n6            .check(matches(isAssignableFrom(TextView::class.java)))\n\
    7 }\n```\n\n由于这些测试运行在设备上，我们不能使用与单元测试相同的命名格式。该函数使用 `@Test` 注解，正如我们在单元测试中所做的那样。我们可以在测试体中使用\
    \ Espresso。它首先点击第一个位置。然后检查是否可以找到一个是 `TextView` 实例的视图。\n\n要运行测试，你可以像运行单元测试那样做：右键点击\
    \ `androidTest` 下的 `java` 文件夹，选择“Run All Tests”。现在，在“Target device”中选择你喜欢的设备。点击“OK”然后运行。你应该看到应用启动，测试点击第一个位置，打开详情页并关闭\
    \ App。\n\n现在我们将做一个更难的。测试将打开 `Toolbar` 的溢出菜单，点击 `Settings` 操作，更改城市代码并检查 Toolbar\
    \ 标题是否已更改相应的内容。\n\n```\n1 @Test fun modifyZipCodeChangesToolbarTitle() {\n2  \
    \   openActionBarOverflowOrOptionsMenu(activityRule.activity)\n3     onView(withText(R.string.settings)).perform(click())\n\
    4     onView(withId(R.id.cityCode)).perform(replaceText(\"94301\"))\n5     pressBack()\n\
    6     onView(isAssignableFrom(Toolbar::class.java))\n7             .check(matches(\n\
    8                 withToolbarTitle(`is(\"Palo Alto (US)\")))))\n9 }\n```\n\n测试确切的操作是：\n\
    \n*   它首先通过 `openActionBarOverflowOptionsMenu` 打开溢出菜单。\n*   然后它找到带有 `Settings`\
    \ 文字的视图并执行点击。\n*   之后，设置 activity 打开了，因此它查找 `EditText` 并替换旧的城市代码为新值。\n*   它按下返回键，这会将新值保存到偏好设置中并关闭\
    \ activity。\n*   由于 `MainActivity` 执行了 `onResume`，请求再次执行。这获取了新城市的预报。\n*   最后一行检查\
    \ Toolbar 标题并查看它是否与正确的值匹配。\n\n这里没有默认的检查 Toolbar 标题的匹配器，但 Espresso 很容易扩展，因此我们可以创建一个实现该检查的新匹配器：\n\
    \n"
- fmt: "\n```\n1 private fun withToolbarTitle(textMatcher: Matcher<CharSequence>):\
    \ Matcher<Any> =\n         object : BoundedMatcher<Any, Toolbar>(Toolbar::class.java)\
    \ {\n\n            override fun matchesSafely(toolbar: Toolbar): Boolean =\n \
    \               textMatcher.matches(toolbar.title)\n\n            override fun\
    \ describeTo(description: Description) {\n                description.appendText(\"\
    with toolbar title: \")\n                textMatcher.describeTo(description)\n\
    \            }\n        }\n```\n\nThe `matchesSafely` function is the place where\
    \ the check happens, while the `describeTo` function adds some information about\
    \ the matcher.\n\nThis chapter has been especially interesting because we have\
    \ seen how Kotlin is entirely compatible with both unit and integration tests\
    \ and can interoperate with the testing libraries. [Take a look at the code](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-28)\
    \ and run the tests by yourself.\n\n# 29 Extra concepts\n\nThroughout this book,\
    \ we have talked about the most important concepts of the Kotlin language. But\
    \ we did not use some of them when implementing the app, and I would not want\
    \ to let them out of these pages. In this chapter, I will review some unrelated\
    \ features that you could be helpful for you when you develop your next Android\
    \ app using Kotlin.\n\n## 29.1 Nested classes\n\nAs in Java, we can define classes\
    \ inside other classes. By default, an inner class will not be able to access\
    \ the members of the outer class (it would behave as a static class in Java):\n\
    \n```\n1 class Outer {\n2   private val bar: Int = 1\n3   class Nested {\n4  \
    \   fun foo() = 2\n5   }\n6 }\n7\n8 val demo = Outer.Nested().foo() // == 2\n\
    ```\n\nThis is what we used for instance for the `ViewHolder` inside the `ForecastListAdapter`.\
    \ If we want to access to the members of the outer class, we need to declare it\
    \ as an `inner` class:\n\n```\n1 class Outer {\n2   private val bar: Int = 1\n\
    3   inner class Inner {\n4     fun foo() = bar\n5   }\n6 }\n8\n8 val demo = Outer().Inner().foo()\
    \ // == 1\n```\n\n## 29.2 Enum classes\n\nKotlin also provides a way to implement\
    \ `enum`:\n\n```\n1 enum class Day {\n2     SUNDAY, MONDAY, TUESDAY, WEDNESDAY,\n\
    3     THURSDAY, FRIDAY, SATURDAY\n4 }\n```\n\nEnums can have parameters, which\
    \ are declared in the constructor:\n\n```\n1 enum class Icon(val res: Int) {\n\
    2     UP(R.drawable.ic_up),\n3     SEARCH(R.drawable.ic_search),\n4     CAST(R.drawable.ic_cast)\n\
    5 }\n6\n7 val searchIconRes = Icon.SEARCH.res\n```\n\nEnums can be requested by\
    \ the `String` that matches the name, and we can also get an `Array` that includes\
    \ all the values of an Enum, so that we can iterate over them.\n\n```\n1 val search:\
    \ Icon = Icon.valueOf(\"SEARCH\")\n2 val iconList: Array<Icon> = Icon.values\n\
    ```\n\nBesides, each Enum constant has functions to obtain its name and the position\
    \ in the declaration:\n\n```\n1 val searchName: String = Icon.SEARCH.name\n2 val\
    \ searchPosition: Int = Icon.SEARCH.ordinal\n```\n\nEnums implement `Comparable`\
    \ based on the ordinal, so it is easy to compare them.\n\n## 29.3 Sealed classes\n\
    \nSealed classes are used to represent restricted class hierarchies, which means\
    \ that the number of classes that extend a sealed class is restricted. It is similar\
    \ to an Enum in the sense that the compiler is aware of the number of subtypes\
    \ a sealed class has. The difference is that enum instances are unique, while\
    \ sealed classes can have multiple instances which can contain different states.\n\
    \nWe could implement, for instance, something similar to the `Option` class: a\
    \ type that prevents the use of `null` by returning a `Some` class when the object\
    \ contains a value or the `None` instance when it is empty:\n\n```\n1 sealed class\
    \ Option<out T>\n2 object None : Option<Nothing>()\n3 data class Just<out T>(val\
    \ value: T) : Option<T>()\n```\n\nThe good thing about sealed classes is that\
    \ when they are used in a `when` expression, we can check all the options and\
    \ will not need to add the `else` clause. Also, if at some point we add a new\
    \ subclass, the compiler will warn us about the places where we should be dealing\
    \ with it.\n\n```\n1 val result = when (option) {\n2     None -> \"Empty\"\n3\
    \     is Just -> \"Contains a value\"\n4 }\n```\n\n## 29.4 Exceptions\n\nIn Kotlin,\
    \ all exceptions implement `Throwable`, have a message and are unchecked. Consequently,\
    \ we are not required to use `try/catch` on any of them. That is not the case\
    \ in Java, where methods that throw `IOException`, for instance, need to be surrounded\
    \ by a `try/catch` block. Time has shown that checked exceptions were not a good\
    \ idea. People like [Bruce Eckel](http://www.mindview.net/Etc/Discussions/CheckedExceptions),\
    \ [Rod Waldhoff](http://radio-weblogs.com/0122027/stories/2003/04/01/JavasCheckedExceptionsWereAMistake.html)\
    \ or [Anders Hejlsberg](http://www.artima.com/intv/handcuffs.html) can give you\
    \ a better perspective on it.\n\nThe way to throw an exception is very similar\
    \ to Java:\n\n```\n1 throw MyException(\"Exception message\")\n```\n\nAnd `try`\
    \ expression is identical too:\n\n```\n1 try {\n2   // some code\n3 }\n4 catch\
    \ (e: SomeException) {\n5   // handler\n6 }\n7 finally {\n8   // optional finally\
    \ block\n9 }\n```\n\nBoth `throw` and `try` are expressions in Kotlin, which allows\
    \ to assign them to a variable. This is useful when dealing with edge cases:\n\
    \n```\n1 val s = when(x){\n2     is Int -> \"Int instance\"\n3     is String ->\
    \ \"String instance\"\n4     else -> throw UnsupportedOperationException(\"Not\
    \ valid type\")\n5 }\n```\n\nor\n\n```\n1 val s = try { x as String } catch(e:\
    \ ClassCastException) { null }\n```\n\n# 30 Java interoperability\n\nSo far, we\
    \ have been talking about creating an app from scratch. However, you probably\
    \ find yourself in a situation where you already have Java. I will cover this\
    \ topic.\n\nOne of the great wonders of Kotlin is that it is entirely interoperable\
    \ with Java. Therefore, although your application code is written Java, you can\
    \ create new code in Kotlin. Calling Kotlin from Java cannot be easier. This potentially\
    \ gives you two advantages:\n\n*   You can use Kotlin in Java: In any project,\
    \ you have already started, you can decide to start writing new code in Kotlin.\n\
    *   If you do not know how to do something in Kotlin, you can do it in Java.\n\
    \n## 30.1 Package-level functions\n\nIn Kotlin, functions do not need to be inside\
    \ a class, but this is not the case in Java. How can we call a function then?\
    \ Imagine that we have a file called `utils.kt` that looks like this:\n\n```\n\
    1 fun logD(message: String) {\n2     Log.d(\"\", message)\n3 }\n4\n5 fun logE(message:\
    \ String) {\n6     Log.e(\"\", message)\n7 }\n```\n\nIn Java we can access them\
    \ through a class that will be called `UtilsKt`, with some static methods:\n\n\
    ```\n1 UtilsKt.logD(\"Debug\");\n2 UtilsKt.logE(\"Error\");\n```\n\n## 30.2 Extension\
    \ functions\n\nWe have been using extension functions a lot throughout this book.\
    \ However, how do they look in Java? If you have the following function:\n\n```\n\
    1 fun ViewGroup.inflate(resId: Int, attachToRoot: Boolean = false): View {\n2\
    \     return LayoutInflater.from(context).inflate(resId, this, attachToRoot)\n\
    3 }\n```\n\nThis is applied to a `ViewGroup`. It receives a layout and inflates\
    \ it using the parent view. What would we get if we want to use it in Java? This\
    \ is the result:\n\n```\n1 View v = UtilsKt.inflate(parent, R.layout.view_item,\
