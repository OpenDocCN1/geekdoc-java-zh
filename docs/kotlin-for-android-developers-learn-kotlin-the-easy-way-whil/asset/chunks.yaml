    \nInterfaces can help us extract common code from classes that share similar behaviors.\
    \ It can be used as an alternative to composition, which keeps our code better\
    \ organized and easier to reuse.\n\nThink where interfaces can help you write\
    \ better code, and check the new one in the [branch of this chapter](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-24).\n\
    \n## 25 Generics\n\nGeneric programming consists of writing algorithms without\
    \ the need of specifying the exact type the code is going to use. That way, we\
    \ can create functions or types that only differ in the set of types they use,\
    \ improving code reusability. These units of code are known as generics, and they\
    \ exist in many languages, including Java and Kotlin.\n\nIn Kotlin, generics are\
    \ even more important, because the high presence of regular and extension functions\
    \ increments the number of times that generics are of some use for us. Though\
    \ we have been using them blindly throughout the book, generics are usually one\
    \ of the trickiest parts of any language, so I am trying to explain it in the\
    \ simplest possible way so that main ideas are clear enough.\n\n### 25.1 Basics\n\
    \nFor instance, we can create a class which specifies a generic type:\n\n```\n\
    1 class TypedClass<T>(parameter: T) {\n2     val value: T = parameter\n3 }\n```\n\
    \nThis class now can be instantiated using any type, and the parameter will use\
    \ the type in the definition. We could do:\n\n```\n1 val t1 = TypedClass<String>(\"\
    Hello World!\")\n2 val t2 = TypedClass<Int>(25)\n```\n\nBut Kotlin is all about\
    \ simplicity and boilerplate reduction, so if the compiler can infer the type\
    \ of the parameter, we do not even need to specify it:\n\n```\n1 val t1 = TypedClass(\"\
    Hello World!\")\n2 val t2 = TypedClass(25)\n3 val t3 = TypedClass<String?>(null)\n\
    ```\n\nAs the third object is receiving a null reference, the type still needs\
    \ to be specified because the compiler cannot infer it.\n\nWe can go beyond and,\
    \ as in Java, reduce the types that can be used in a generic class by setting\
    \ it in the definition. For instance, if we want to restrict the previous class\
    \ to non-nullable types, we do:\n\n```\n1 class TypedClass<T : Any>(parameter:\
    \ T) {\n2     val value: T = parameter\n3 }\n```\n\nIf you compile previous code,\
    \ you will see that `t3` now throws an error. Nullable types are not allowed anymore.\
    \ But restrictions can be obviously more strict. What if we want to accept only\
    \ classes that extend `Context`? Easy:\n\n```\n1 class TypedClass<T : Context>(parameter:\
    \ T) {\n2     val value: T = parameter\n3 }\n4 \n5 val t1 = TypedClass(activity)\n\
    6 val t2 = TypedClass(context)\n7 val t3 = TypedClass(service)\n```"
