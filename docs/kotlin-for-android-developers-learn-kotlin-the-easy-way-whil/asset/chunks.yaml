  trans: "\n\n在使用如 `Dagger` 等依赖注入器时，`lateinit` 也是不可或缺的，而且测试也非常有用。\n\n## 来自 map 的值\n\
    \n委托属性值的另一种方法是从 map 中获取它们，使用属性的名称作为 map 的键。该委托允许从一个动态 map 创建对象的实例。如果我们使用不可变属性，map\
    \ 也可以是不可变的。对于可变属性，该类需要一个 `MutableMap` 作为构造函数参数。\n\n想象我们有一个从 JSON 加载的配置类，并将这些键值对赋值给一个\
    \ map。我们可以通过将此 map 传递给构造函数来创建类的实例：\n\n```\n1 class Configuration(map: Map<String,\
    \ Any?>) {\n2     val width: Int by map\n3     val height: Int by map\n4     val\
    \ dp: Int by map\n5     val deviceName: String by map\n6 }\n```\n\n作为参考，这里是我们可以创建该类所需的\
    \ map：\n\n```\n1 val conf = Configuration(mapOf(\n2         \"width\" to 1080,\n\
    3         \"height\" to 720,\n4         \"dp\" to 240,\n5         \"deviceName\"\
    \ to \"mydevice\"\n6 ))\n```\n\n## 16.4 如何创建自定义委托\n\n假设我们想要创建一个非空且只能赋值一次的委托。当第二次被赋值时，它将抛出异常。\n\
    \n要定义一个委托类，你只需要编写几个运算符函数：`getValue` 和 `setValue`。它们有一组非常特定的参数，如下：\n\n```\n 1 class\
    \ NotNullSingleValueVar<T> {\n 2 \n3     operator fun getValue(thisRef: Any?,\
    \ property: KProperty<*>): T {\n 4         return ...\n 5     }\n 6 \n7     operator\
    \ fun setValue(thisRef: Any?, property: KProperty<*>, value: T) {\n 8        \
    \ ...\n 9     }\n10 }\n```\n\nui/utils/DelegatesExt.kt\n\n此委托适用于任何非空类型。它接收任意类型对象的引用，并使用\
    \ `T` 作为 getter 和 setter 的类型。现在我们需要实现这些方法：\n\n- 如果已赋值，getter 返回该值；否则，它抛出一个异常。\n\
    - 如果仍然为空，setter 赋值该值；否则，它抛出一个异常。\n\n```\n 1 class NotNullSingleValueVar<T> {\n\
    \ 2 \n3     private var value: T? = null\n 4 \n5     operator fun getValue(thisRef:\
    \ Any?, property: KProperty<*>): T =\n 6         value ?: throw IllegalStateException(\"\
    ${property.name} \" +\n 7                 \"not initialized\")\n 8     }\n 9 \n\
    10     operator fun setValue(thisRef: Any?, property: KProperty<*>, value: T)\
    \ {\n11         this.value = if (this.value == null) value\n12         else throw\
    \ IllegalStateException(\"${property.name} already initialized\")\n13     }\n\
    14 }\n```\n\nui/utils/DelegatesExt.kt\n\n现在让我们创建一个提供你新委托函数的对象：\n\n```\n1 object\
    \ DelegatesExt {\n2     fun <T> notNullSingleValue() = NotNullSingleValueVar<T>()\n\
    3 }\n```\n\nui/utils/DelegatesExt.kt\n\n最后部分不是必须的，但它可以帮助你聚合所有你实现的委托。\n\n## 16.5\
    \ 重新实现 App 单例\n\n委托可以在这种情况下对我们的帮助。我们知道单例不会为空，但我们无法使用构造函数来分配属性。因此，我们可以利用 `lateinit`\
    \ 委托：\n\n```\n 1 class App : Application() {\n 2 \n3     companion object {\n\
    \ 4         lateinit var instance: App\n 5     }\n 6 \n7     override fun onCreate()\
    \ {\n 8         super.onCreate()\n9         instance = this\n10     }\n11 }\n\
    ```\n\nui/App.kt\n\n这种解决方案的问题在于我们可以从应用的任何地方更改此实例的值，因为如果我们要使用 `lateinit`，就需要 `var`\
    \ 属性。使用私有的 `set` 可以轻松解决：\n\n```\n1 companion object {\n2     lateinit var instance:\
    \ App\n3         private set\n4 }\n```\n\n现在，实例的值只能在 `App` 类内部修改。\n\n但我们将使用自定义委托：\n\
    \n```\n1 companion object {\n2     var instance: App by DelegatesExt.notNullSingleValue()\n\
    3 }\n```\n\nui/App.kt\n\n尽管在这种情况下，`lateinit` 可能是最简单的选项，但我想向你展示如何创建一个自定义属性委托并在代码中使用它。\n\
    \n如果你有任何疑问，请查看此章节的特定[分支](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-16)。\n\
    \n## 17 创建 SQLiteOpenHelper\n\n如你所知，Android 使用 `SQLite` 作为数据库管理系统。`SQLite` 是一个嵌入应用中的数据库，它是轻量级的。这就是为什么它是移动应用的良好选择。\n\
    \n然而，Android 中用于处理数据库的 API 相当很原始。你将看到需要为数据库编写许多 SQL 语句，并将它们映射到对象或 `Cursor`。幸运亏有\
    \ Kotlin，我们可以简化这一切。\n\n## 17.1 ManagedSQLiteOpenHelper\n\n`SQLiteOpenHelper` 简化了大量工作。在使用它时调用\
    \ `ReadableDatabase()` 或 `WritableDatabase()`，稍后看到：\n\n```\n1 forecastDbHelper.use\
    \ {\n2 ...\n3 }\n```\n\n`use` 接收一个 `SQLiteDatabase` 的扩展函数。在大括号内，`this` 指向 `SQLiteDatabase`。`use`\
    \ 函数可以返回值，稍后看到它的实现：\n\n```kotlin\npublic fun <T> SQLiteOpenHelper.use(f: SQLiteDatabase.()\
    \ -> T): T {\n    try {\n        return openDatabase().f()\n    } finally {\n\
    \        closeDatabase()\n    }\n}\n```\n\n首先，`use` 可以这样使用：\n\n```\n1 result =\
    \ forecastDbHelper.use {\n2 ...\n3 }\n```\n\n记住，在函数内部，最后一行代表返回的值。`T` 没有限制，我们可以返回任何值。甚至是不返回任何内容的\
    \ `Unit`。通过使用 `try-finally`，`use` 函数无论扩展函数成功还是崩溃都会关闭数据库。\n\n此外，我们还有许多实用的 `SQLiteDatabase`\
    \ 扩展函数稍后会用到。现在，让我们定义数据库表并实现 `SQLiteOpenHelper`。\n\n## 17. 表定义\n\n让我们创建几个表示表的对象。这些对象将有助于避免名称拼写错误和重复。我们需要两个表：一个存储城市信息，另一个存储每日的预报。第二个表与第一个表有外键。\n\
    \n`CityForecastTable` 首先提供了表名，然后是它需要的列集：`id`（城市的邮政编码）、城市名称和国家。\n\n```\n1 object\
    \ CityForecastTable {\n2     const val NAME = \"CityForecast\"\n3     const val\
    \ ID = \"_id\"\n4     const val CITY = \"city\"\n5     const val COUNTRY = \"\
    country\"\n6 }\n```\n\ndata/db/Tables.kt\n\n`DayForecast` 有更多信息，因此它需要下面看到的列集。最后一列\
    \ `cityId` 保留了该预报所属的 `CityForecast` 的 id。\n\n```\n1 object DayForecastTable {\n\
    2     const val NAME = \"DayForecast\"\n3     const val ID = \"_id\"\n4     const\
    \ val DATE = \"date\"\n5     const val DESCRIPTION = \"description\"\n6     const\
    \ val HIGH = \"high\"\n7     const val LOW = \"low\"\n8     const val ICON_URL\
    \ = \"iconUrl\"\n9     const val CITY_ID = \"cityId\"\n10 }\n```\n\ndata/db/Tables.kt\n"
- fmt: "\n### 17.3 Implementing SqliteOpenHelper\n\nIf you remember, Anko is divided\
    \ into several libraries to be more lightweight. We already added `anko-common`,\
    \ but we also need `anko-sqlite` if we want to use database features:\n\n```\n\
    1 dependencies {\n2     ...\n3     compile \"org.jetbrains.anko:anko-sqlite:$anko_version\"\
    \n4 }\n```\n\n`app/build.gradle`\n\nOur `SqliteOpenHelper` will basically manage\
    \ the creation and upgrade of our database, and will provide the `SqliteDatabase`\
    \ so that we can work with it. The queries will be extracted to another class:\n\
    \n```\n1 class ForecastDbHelper() : ManagedSQLiteOpenHelper(App.instance,\n2 \
    \        ForecastDbHelper.DB_NAME, null, ForecastDbHelper.DB_VERSION) {\n3   \
    \  ...\n4 }\n```\n\n`data/db/ForecastDbHelper.kt`\n\nWe are using the `App.instance`\
    \ we created in the previous chapter, as well as a database name and version.\
    \ Define these values in the companion object, along with the helper instance:\n\
    \n```\n1 companion object {\n2     const val DB_NAME = \"forecast.db\"\n3    \
    \ const val DB_VERSION = 1\n4     val instance by lazy { ForecastDbHelper() }\n\
    5 }\n```\n\n`data/db/ForecastDbHelper.kt`\n\nThe `instance` property uses a `lazy`\
    \ delegate, which means the object is not created until its first use. That way,\
    \ if the database is never employed, we avoid creating unnecessary objects. The\
    \ regular `lazy` delegate is blocking in order to prevent the creation of several\
    \ instances from different threads. This situation can only happen if two threads\
    \ try to access the `instance` at the same time, which is difficult but it could\
    \ happen depending on the type of app you are implementing.\n\nIn order to create\
    \ the database schema, we are required to provide an implementation of the `onCreate`\
    \ function. When no libraries are used, tables creation is done by writing a raw\
    \ `CREATE TABLE` query where we define all the columns and their types. However,\
    \ Anko provides a simple extension function that receives the name of the table\
    \ and a set of `Pair` objects that identify the name and the type of the column:\n\
    \n```\n1 db.createTable(CityForecastTable.NAME, true,\n2         Pair(CityForecastTable.ID,\
    \ INTEGER + PRIMARY_KEY),\n3         Pair(CityForecastTable.CITY, TEXT),\n4  \
    \       Pair(CityForecastTable.COUNTRY, TEXT))\n```\n\n`data/db/ForecastDbHelper.kt`\n\
    \n*   The first parameter is the name of the table.\n*   The second parameter,\
    \ when set to `true`, checks if the table does not exist before trying to create\
    \ it.\n*   The third parameter is a `vararg` of `Pair`s. The `vararg` type also\
    \ exists in Java, and it is a way to pass a variable number of arguments of the\
    \ same type to a function. The function then receives an array with the objects.\n\
    \nColumn types are using a special Anko class called `SqlType`, which can be used\
    \ together with `SqlTypeModifier`s, such as `PRIMARY_KEY`. The `+` operation is\
    \ overloaded the same way we saw in chapter 11\\. This `plus` function properly\
    \ concatenates both values returning a new special `SqlType`:\n\n```\n1 fun SqlType.plus(m:\
    \ SqlTypeModifier) : SqlType {\n2     return SqlTypeImpl(name, if (modifier ==\
    \ null) m.toString() \n3             else \"$modifier $m\")\n4 }\n```\n\nAs you\
    \ can see, it can also concatenate several modifiers.\n\nComing back to our code,\
    \ we can do it better. Kotlin standard library includes a function called `to`\
    \ which, once more, shows the ability of Kotlin to let us model the language to\
    \ our needs. It acts as an extension function for the first object and receives\
    \ another object as a parameter, returning a `Pair` object with them.\n\n```\n\
    1 infix fun <A, B> A.to(that: B): Pair<A, B> = Pair(this, that)\n```\n\nFunctions\
    \ with one parameter that use the `infix` modifier can be used inline, so the\
    \ result is quite clean:\n\n```\n1 val pair = object1 to object2\n```\n\nAnd this,\
    \ applied to the creation of our tables:\n\n```\n1 db.createTable(CityForecastTable.NAME,\
    \ true,\n2         CityForecastTable.ID to INTEGER + PRIMARY_KEY,\n3         CityForecastTable.CITY\
    \ to TEXT,\n4         CityForecastTable.COUNTRY to TEXT)\n```\n\nThis is how the\
    \ complete method looks:\n\n```\n 1 override fun onCreate(db: SQLiteDatabase)\
    \ {\n 2     db.createTable(CityForecastTable.NAME, true,\n 3             CityForecastTable.ID\
    \ to INTEGER + PRIMARY_KEY,\n 4             CityForecastTable.CITY to TEXT,\n\
    \ 5             CityForecastTable.COUNTRY to TEXT)\n 6 \n 7     db.createTable(DayForecastTable.NAME,\
    \ true,\n 8             DayForecastTable.ID to INTEGER + PRIMARY_KEY + AUTOINCREMENT,\n\
    \ 9             DayForecastTable.DATE to INTEGER,\n10             DayForecastTable.DESCRIPTION\
    \ to TEXT,\n11             DayForecastTable.HIGH to INTEGER,\n12             DayForecastTable.LOW\
    \ to INTEGER,\n13             DayForecastTable.ICON_URL to TEXT,\n14         \
    \    DayForecastTable.CITY_ID to INTEGER)\n15 }\n```\n\n`data/db/ForecastDbHelper.kt`\n\
    \nWe have a similar function to drop a table. `onUpgrade` just deletes the tables\
    \ so that they are recreated. We are using our database just as a cache, so we\
    \ need to improve `onUpgrade` depending on database version.\n\n```\n1 override\
    \ fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {\n2   \
    \  db.dropTable(CityForecastTable.NAME)\n3     db.dropTable(DayForecastTable.NAME)\n\
    4 }\n```\n\n### 17.4 Dependency injection\n\nIf you remember, Anko is divided\
    \ into several libraries to be more lightweight. We already added `anko-common`,\
    \ but we also need `anko-sqlite` if we want to use database features:\n\nTo put\
    \ it simply, if we want to have classes that are independent one another, way\
    \ testable, and write code that is easy to extend, we need to make use of dependency\
    \ inversion. Instead of instantiating the collaborators inside the class, we provide\
    \ them (usually via constructor) and instantiate them else. That way, we can substitute\
    \ them by other objects that, for instance, implement the same interface, or make\
    \ use of mocks in tests.\n\nHowever, now those dependencies must be provided from\
    \ somewhere, so the dependency injection consists of providing the collaborators\
    \ required by the classes. Developers usually delegate this task to a dependency\
    \ injector. [Dagger](https://google.github.io/dagger/) is probably the most famous\
    \ dependency injector for Android. It is, of course, an excellent alternative\
    \ when we need some complexity to provide those dependencies.\n\nBut a simpler\
    \ alternative is to make use of default values in constructors. We can provide\
    \ the dependency by assigning a default value to constructor arguments, and then\
    \ provide a different instance if we need it. For example, in our `ForecastDbHelper`\
    \ we can provide the context in a smarter way:\n\n```\n1 class ForecastDbHelper(ctx:\
    \ Context = App.instance) : \n2     ManagedSQLiteOpenHelper(ctx, ForecastDbHelper.DB_NAME,\
    \ null, \n3     ForecastDbHelper.DB_VERSION) {\n4     ...\n5 }\n```\n\nNow we\
    \ have two ways to create this class:\n\n```\n1 val dbHelper1 = ForecastDbHelper()\
    \  // It will use App.instance\n2 val dbHelper2 = ForecastDbHelper(mockedContext)\
    \ // For tests, for example\n```\n"
