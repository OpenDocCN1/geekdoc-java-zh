    \ this method calls `clearFindViewByIdCache`, so we are safe here.\n\n#### Kotlin\
    \ Android extensions on a Custom View\n\nIt will work very similarly on a custom\
    \ view. Imagine we have a view like this:\n\n```\n 1 <merge xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n 2               android:orientation=\"vertical\"\n 3               android:layout_width=\"\
    match_parent\"\n 4               android:layout_height=\"match_parent\">\n 5 \n\
    \ 6     <ImageView\n 7         android:id=\"@+id/itemImage\"\n 8         android:layout_width=\"\
    match_parent\"\n 9         android:layout_height=\"200dp\"/>\n10 \n11     <TextView\n\
    12         android:id=\"@+id/itemTitle\"\n13         android:layout_width=\"match_parent\"\
    \n14         android:layout_height=\"wrap_content\"/>\n15 \n16 </merge>\n```\n\
    \nI am creating a straightforward custom view and generating the constructors\
    \ with the new intent that uses `@JvmOverloads` annotation. When a class extends\
    \ a `View` or a subclass of it, you can press *Alt + Enter*, where you find the\
    \ option to create a constructor like this:\n\n```\n1 class CustomView @JvmOverloads\
    \ constructor(\n2         context: Context, attrs: AttributeSet? = null, defStyleAttr:\
    \ Int = 0\n3 ) : LinearLayout(context, attrs, defStyleAttr) {\n4 \n5     init\
    \ {\n6         LayoutInflater.from(context).inflate(R.layout.view_custom, this,\
    \ true)\n7         itemTitle.text = \"Hello Kotlin!\"\n8     }\n9 }\n```\n\nAt\
    \ the end of the book, I will tell you more about these annotations and how to\
    \ use them to improve the interoperability with Java code.\n\nIn the example above,\
    \ I am modifying the text of `itemTitle`. The generated code should be trying\
    \ to find the view from the cache. It does not make sense to copy all the same\
    \ decompiled code again, but you can see this in the line that modifies the text:\n\
    \n```\n1 ((TextView)this._$_findCachedViewById(id.itemTitle))\n2     .setText((CharSequence)\"\
    Hello Kotlin!\");\n```\n\nWe are only calling `findViewById` first time in custom\
    \ views too.\n\n#### Recovering views from another view\n\nThe last alternative\
    \ Kotlin Android Extensions provide is to use the properties directly from another\
    \ view. I am using a layout very similar to the one in the previous section. Imagine\
    \ that this is inflated in an adapter for instance. You can also access the subviews\
    \ directly, just by using this plugin:\n\n```\n1 val itemView = ...\n2 itemView.itemImage.setImageResource(R.drawable.image)\n\
    3 itemView.itemTitle.text = \"My Text\"\n```\n\nThe plugin also helps you fill\
    \ the *import*. Check that this one is different:\n\n```\n1 import kotlinx.android.synthetic.main.view_item.view.*\n\
    ```\n\nThere are a couple of things you need to know about this:\n\n*   In compilation\
    \ time, you can reference any views from any other views. This means you could\
    \ be referencing a view that is not a direct child of that one. Of course, this\
    \ crashes in execution time when it tries to recover a view that does not exist.\n\
    \n*   In this case, views are not cached, as opposed to *Activities* and *Fragments*.\n\
    \nWhy is this? Here the plugin does not have a place to generate the required\
    \ code for the cache. If you again review the code that is generated by the plugin\
    \ when calling a property from a view, you will see this:\n\n```\n1 ((TextView)itemView.findViewById(id.itemTitle)).setText((CharSequence)\"\
    My Text\");\n```\n\nAs you can see, there is no call to a cache. Be careful if\
    \ your view is complex and you are using this in an adapter. It might impact the\
    \ performance.\n\nAlternatively, if you are using Kotlin 1.1.4 or newer, you have\
    \ another option.\n\n### 15.2 Kotlin Android Extensions in 1.1.4\n\nFrom this\
    \ version of Kotlin, the Android Extensions have incorporated some new exciting\
    \ features: caches in any classes, and a new annotation called `@Parcelize`. There\
    \ is also a way to customize the generated cache.\n\nAt the moment of writing\
    \ these lines, these features are still experimental, so you need to enable them\
    \ by adding this to the `build.gradle`:\n\n```\n1 androidExtensions {\n2     experimental\
    \ = true\n3 }\n```"
