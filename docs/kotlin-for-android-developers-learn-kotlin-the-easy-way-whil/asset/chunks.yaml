    \ the need of creating an object explicitly. T This conflict can be solved by\
    \ implementing an extension function. I am creating a function that receives a\
    \ lambda and returns a `MapRowParser`. The parser will use that lambda to create\
    \ the object:\n\n```\n1 fun <T : Any> SelectQueryBuilder.parseList(\n2     parser:\
    \ (Map<String, Any?>) -> T): List<T> =\n3         parseList(object : MapRowParser<T>\
    \ {\n4             override fun parseRow(columns: Map<String, Any?>): T = parser(columns)\n\
    5         })\n```\n\nextensions/DatabaseExtensions.kt\n\nIf you do not fully understand\
    \ it yet, you can come back once we dive deep into generics. The previous function\
    \ helps simplify the `parseList` request to:\n\n```\n1 parseList { DayForecast(HashMap(it))\
    \ }\n```\n\nThe immutable map that the parser receives is converted into a mutable\
    \ map (we need it to be mutable in our database model) by using the corresponding\
    \ constructor from the `HashMap`. This `HashMap` is used by the constructor of\
    \ `DayForecast`.\n\nSo, to understand what is happening behind the scenes, the\
    \ request returns a `Cursor`. `parseList` iterates over it and gets the rows from\
    \ the `Cursor` until it reaches the last one. For each row, it creates a map with\
    \ the columns as keys and assigns the value to the corresponding key. The map\
    \ is then returned to the parser.\n\nIf there are no results for the request,\
    \ `parseList` returns an empty list.\n\nNext step will request the city in a similar\
    \ way:\n\n```\n1 val city = select(CityForecastTable.NAME)\n2         .whereSimple(\"\
    ${CityForecastTable.ID} = ?\", zipCode.toString())\n3         .parseOpt { CityForecast(HashMap(it),\
    \ dailyForecast) }\n```\n\ndata/db/ForecastDb.kt\n\nThe difference here: we are\
    \ using `parseOpt` instead. This function returns a nullable object. The result\
    \ can be null or a single object, depending on whether the request finds something\
    \ in the database or not. There is another function called `parseSingle`, which\
    \ does essentially the same but returns a non-nullable object. So if it does not\
    \ find a row in the database, it throws an exception. In our case, the first time\
    \ we query a city, it will not be there, so using `parseOpt` is safer. I also\
    \ created a handy function to prevent the need for object creation:\n\n```\n1\
    \ fun <T : Any> SelectQueryBuilder.parseOpt(\n2     parser: (Map<String, Any?>)\
    \ -> T): T? =\n3         parseOpt(object : MapRowParser<T> {\n4             override\
    \ fun parseRow(columns: Map<String, Any?>): T = parser(columns)\n5         })\n\
    ```\n\nextensions/DatabaseExtensions.kt\n\nFinally, if the returned city is not\
    \ null, we convert it to a domain object and return it, using the `dataMapper`.\
    \ Otherwise, we just return `null`. As you may remember, last line inside a lambda\
    \ represents what the lambda returns. So it will return an object from the type\
    \ `CityForecast?`:\n\n```\n1 if (city != null) dataMapper.convertToDomain(city)\
    \ else null\n```\n\ndata/db/ForecastDb.kt\n\n`DataMapper` function is easy:\n\n\
    ```\n1 fun convertToDomain(forecast: CityForecast) = with(forecast) {\n2     val\
    \ daily = dailyForecast.map { convertDayToDomain(it) }\n3     ForecastList(_id,\
    \ city, country, daily)\n4 }\n5 \n6 private fun convertDayToDomain(dayForecast:\
    \ DayForecast) = with(dayForecast) {\n7     Forecast(date, description, high,\
    \ low, iconUrl)\n8 }\n```\n\ndata/db/DbDataMapper.kt\n\nSo this is how the complete\
    \ function looks like:\n\n```\n 1 fun requestForecastByZipCode(zipCode: Long,\
    \ date: Long) = forecastDbHelper.use {\n 2 \n 3     val dailyRequest = \"${DayForecastTable.CITY_ID}\
    \ = ? AND \" + \n 4         \"${DayForecastTable.DATE} >= ?\"\n 5     val dailyForecast\
    \ = select(DayForecastTable.NAME)\n 6             .whereSimple(dailyRequest, zipCode.toString(),\
    \ date.toString())\n 7             .parseList { DayForecast(HashMap(it)) }\n 8\
    \ \n 9     val city = select(CityForecastTable.NAME)\n10             .whereSimple(\"\
    ${CityForecastTable.ID} = ?\", zipCode.toString())\n11             .parseOpt {\
    \ CityForecast(HashMap(it), dailyForecast) }\n12 \n13     if (city != null) dataMapper.convertToDomain(city)\
    \ else null\n14 }\n```\n\ndata/db/ForecastDb.kt\n\nAnother interesting functionality\
    \ from Anko I am not showing here is that you can make use of a `classParser()`\
    \ instead of the `MapRowParser` we are using, which uses reflection to fill a\
    \ class based on the names of the columns. I prefer the other way because we do\
    \ not need reflection and have more control over the transformations, but it can\
    \ be of use for you at some point.\n\n#### Saving a forecast\n\nThe `saveForecast`\
    \ function clears the data from the database so that we save fresh data, converts\
    \ the domain forecast model to database model, and inserts each daily forecast\
    \ and the city forecast. The structure is similar to the previous one: it returns\
    \ the value from the `use` function from the database helper. In this case, we\
    \ do not need a result, so it will return `Unit`.\n\n```\n1 fun saveForecast(forecast:\
    \ ForecastList) = forecastDbHelper.use {\n2     ...\n3 }\n```\n\ndata/db/ForecastDb.kt"
