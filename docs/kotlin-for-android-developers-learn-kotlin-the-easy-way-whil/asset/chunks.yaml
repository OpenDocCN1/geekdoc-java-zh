  trans: "\n现在每个扩展了 `Context` 的类都可以作为我们类的类型。其他类型是不被允许的。\n\n当然，函数中也允许使用类型。我们可以很容易地构建泛型函数：\n\
    \n```\n1 fun <T> typedFunction(item: T): List<T> {\n2     ...\n3 }\n```\n\n###\
    \ 25.2 变变 (Variance)\n\n这真的是最难理解的部分之一。在 Java 中，使用泛型类型时存在一个问题。逻辑上说，`List<String>`\
    \ 应该能够强制转换为 `List<Object>`，因为它的限制更少。但看这个例子：\n\n```\n1 List<String> strList = new\
    \ ArrayList<>();\n2 List<Object> objList = strList;\n3 objList.add(5);\n4 String\
    \ str = objList.get(0);\n```\n\n如果 Java 编译器允许我们这样做，我们就可以向 `Object` 列表添加一个 `Integer`，这会在某个时刻导致程序崩溃。这就是为什么语言中引入了通配符（wildcards）。通配符在限制这一问题的同时增加了灵活性。\n\
    \n如果我们添加 `? extends Object`，我们就是在使用**协变 (covariance)**，这意味着我们可以处理任何使用比 `Object`\
    \ 限制更大的类型的对象，但我们只能安全地执行 `get` 操作。如果我们想将一个 `String` 集合拷贝到 `Object` 集合中，应该是允许的，对吧？\n\
    \n那么，如果我们有：\n\n```\n1 List<String> strList = ...;\n2 List<Object> objList = ...;\n\
    3 objList.addAll(strList);\n```\n\n这是可能的，因为 `Collection` 接口中 `addAll()` 的定义类似于：\n\
    \n```\n1 List<String> \n2 interface Collection<E> ... {\n3   void addAll(Collection<?\
    \ extends E> items);\n4 }\n```\n\n否则，如果没有通配符，我们将不允许使用此方法配合 `String` 列表。相反的情况自然会失败。我们不能使用\
    \ `addAll()` 将一个 `Object` 列表添加到 `String` 列表中。由于我们只是从在该方法中使用的集合中获取项，因此它是协变的完美范例。\n\
    \n另一方面，我们可以找到**逆变 (contravariance)**，它只是完全相反的情况。接上 `Collection` 的例子，如果我们想向作为参数传递的\
    \ `Collection` 中添加项，我们可以将具有更严格类型的对象添加到更通用的集合中。例如，我们可以将 `String` 添加到 `Object` 列表中：\n\
    \n```\n1 void copyStrings(Collection<? super String> to, Collection<String> from)\
    \ {\n2     to.addAll(from);\n3 }\n```\n\n我们向 `String` 添加到另一个集合的唯一限制是：该集合接受 `String`\
    \ 或其父类的 `Object` 类型。\n\n但通配符有一些局限性。通配符定义了**使用处变性 (use-site variance)**，这意味着我们需要在使用它们的地方声明它们。这意味着每当我们声明一个更通用的变量时都要添加样板代码。\n\
    \n让我们来看一个例子。使用与之前类似的的一个类：\n\n```\n1 public class TypedClass<T> {\n2     public\
    \ T doSomething(){\n3         ...\n4     }\n5 }\n```\n\n这段代码将无法编译：\n\n```\n1 TypedClass<String>\
    \ t1 = new TypedClass<>();\n2 TypedClass<Object> t2 = t1;\n```\n\n尽管这实际上没有意义，因为我们仍然可以调用该类的所有方法，且什么都不会破坏。我们需要指定该类型可以有一个更灵活的定义。\n\
    \n```\n1 TypedClass<String> t1 = new TypedClass<>();\n2 TypedClass<? extends String>\
    \ t2 = t1;\n```\n\n在这种情况下，通配符的使用使得事情更难理解，并增加了一些额外的样板代码。\n\n另一方面，Kotlin 通过使用**声明处变性\
    \ (declaration-site variance)** 更自然地处理这个问题。在 Kotlin 中，我们在定义类或接口时指定我们可以处理限制较少的情况，然后就可以到处随随地使用它。\n\
    \n所以让我们看看它是什么样的。Kotlin 没有使用长通配符，而是使用 `out` 表示协变，使用 `in` 表示逆变。在这种情况下，由于我们的类产生的对象保存到限制较少的变量中，我们正在使用协变。我们可以直接在类声明中定义它：\n\
    \n```\n1 class TypedClass<out T>() {\n2     fun doSomething(): T {\n3        \
    \ ...\n4     }\n5 }\n```\n\n这就是我们需要的全部。现在，Java 中无法编译的相同示例在 Kotlin 中是完全可能的：\n\n\
    ```\n1 val t1 = TypedClass<String>()\n2 val t2: TypedClass<Any> = t1\n```\n\n\
    如果你已经熟悉这些概念，我确定你可以在 Kotlin 中毫无费力地使用 `in` 和 `out`。否则，这需要一些练习和对这些概念的良好理解。\n\n###\
    \ 25.3 泛型示例\n\n在理论之后，让我们转向一些会让我们的生活更简单的实用函数。与其重复发明轮子，我使用了包含在 Kotlin 标准库中的三个函数。这些函数让我们仅通过一个泛型实现就能完成惊不起的事情。它们可能会启发你创建自己的函数。\n\
    \n#### let\n\n`let` 是一个可以被任何对象调用的简单函数。它接收一个以对象作为参数的函数，并返回该函数的值。它对于处理可空对象非常方便。这里是它的定义：\n\
    \n```\ninline inline <T, R> T.let(f: (T) -> R): R = f(this)\n```\n\n它使用了两个泛型类型：`T`\
    \ 和 `R`。第一个类型是调用对象，第二个是结果。我们如何使用它呢？你可能记得，当我们从源获取数据时，结果可能是 null：\n\n```\n1 if (forecast\
    \ != null) dataMapper.convertDayDomain(forecast) else null\n```\n\n这可以被改进。我们不应该那那样处理可空类型。我们可以通过使用\
    \ `let` 来避免它：\n\n```\n1 forecast?.let { dataMapper.convertDayDomain(it) }\n```\n\
    \n#### with\n\n我们在书中多次提到这个函数。`with` 接收一个对象和一个行为得像扩展函数的 lambda 表达式。\n\n```\ninline\
    \ inline <T, R> with(receiver: T, f: T.() -> R): R\n```\n\n泛型在这里的工作原理相同：`T` 代表接收者类型，`R`\
    \ 代表结果。如你所见，lambda 被定义为扩展函数：`f: T.() -> R`。这就是为什么我们随后可以调用 `receiver.f()`。\n\n\
    我们在整个应用程序中有几个例子：\n\n```\n1 fun convertFromDomain(forecast: ForecastList) = with(forecast)\
    \ {\n    val daily = dailyForecast.map { convertDayDomain(id, it) }\n    CityForecast(id,\
    \ city, country, daily)\n}\n```\n\n#### apply\n\n它看起来与 `with` 函数非常相似，但想法有所不同。`apply`\
    \ 可用于避免创建构建器，因为调用函数的对象可以按照它需要的方式进行初始化，而 `apply` 函数返回同一个对象：\n\n```\ninline inline\
    \ <T> T.apply(f: T.() -> Unit): T { f(); return this }\n```\n\n我们在这里只需要一个泛型类型，因为调用函数的对象也是被返回的值。一个很简单的例子将是：\n\
    \n```\n1 val textView = TextView(context).apply {\n    text = \"Hello\"\n    hint\
    \ = \"Hint\"\n    textColor = android.R.color.white\n}\n```\n\n它创建了一个 `TextView`，修改了一些属性，并将其赋值给变量。一切都在简单、易读且紧凑的语法中。让我们在当前代码中使用它。在\
    \ `ToolbarManager` 中，我们之前是这样创建导航绘制内容的：\n\n```\n1 private fun createUpDrawable()\
    \ = with(DrawerArrowDrawable(toolbar.ctx)) {\n    progress = 1f\n    this\n}\n\
    ```\n\n使用 `with` 并返回 `this` 显然是可以通过 `apply` 更容易地完成的：\n\n"
