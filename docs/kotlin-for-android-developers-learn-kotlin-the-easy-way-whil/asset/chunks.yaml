    \nOur layout is pretty simple, and it will not affect performance. In any case,\
    \ remember what we talked in the section above: this is not caching the views,\
    \ which implies that each call to the bind function is doing `findViewById` under\
    \ the hood for all its views.\n\nTo solve it, you can use the new features in\
    \ Kotlin 1.1.4\\. First, enable the *experimental* flag in the `build.gradle`:\n\
    \n```\n1 androidExtensions {\n2     experimental = true\n3 }\n```\n\napp/build.gradle\n\
    \nNow update the `ViewHolder`. You will not need to access the views through the\
    \ `itemView` anymore, as now the views behave as `ViewHolder` properties. Check\
    \ that the import is different too:\n\n```\n 1 import kotlinx.android.synthetic.main.item_forecast.*\n\
    \ 2 \n 3 class ForecastListAdapter(private val weekForecast: ForecastList,\n 4\
    \         private val itemClick: (Forecast) -> Unit) :\n 5         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>()\
