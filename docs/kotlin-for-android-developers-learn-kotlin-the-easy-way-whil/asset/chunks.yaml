  trans: "\n\n```\n1 private fun withToolbarTitle(textMatcher: Matcher<CharSequence>):\
    \ Matcher<Any> =\n         object : BoundedMatcher<Any, Toolbar>(Toolbar::class.java)\
    \ {\n\n            override fun matchesSafely(toolbar: Toolbar): Boolean =\n \
    \               textMatcher.matches(toolbar.title)\n\n            override fun\
    \ describeTo(description: Description) {\n                description.appendText(\"\
    with toolbar title: \")\n                textMatcher.describeTo(description)\n\
    \            }\n        }\n```\n\n`matchesSafely` 函数是执行检查的地方，而 `describeTo` 函数则添加了关于匹配器的信息。\n\
    \n这一章特别有趣，因为我们已经看到 Kotlin 如何完全与单元测试和集成测试兼容，并能与这些测试库进行互操作。[[查看代码](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-28)\
    \ 并尝试自己运行测试。]\n\n# 29 额外概念\n\n在整本书中，我们讨论了 Kotlin 语言中最重要的概念。但在实现 App 时，我们没有使用其中一些概念，我不希望让它们消失在这些书中。在这一章中，我将回顾一些不相关的特性，这些特性在你以后使用\
    \ Kotlin 开发下一个 Android App 时可能会有所帮助。\n\n## 29.1 嵌套类\n\n与 Java 一样，我们可以在类内部定义类。默认情况下，内部类无法访问外部类的成员（它在\
    \ Java 中的行为表现像一个静态类）：\n\n```\n1 class Outer {\n2   private val bar: Int = 1\n\
    3   class Nested {\n4     fun foo() = 2\n5   }\n6 }\n7\n8 val demo = Outer.Nested().foo()\
    \ // == 2\n```\n\n这就是我们用于 `ForecastListAdapter` 内部 `ViewHolder` 的做法。如果我们想访问外部类的成员，需要将其声明为\
    \ `inner`（内部）类：\n\n```\n1 class Outer {\n2   private val bar: Int = 1\n3   inner\
    \ class Inner {\n4     fun foo() = bar\n5   }\n6 }\n8\n8 val demo = Outer().Inner().foo()\
    \ // == 1\n```\n\n## 29.2 枚举类\n\nKotlin 也提供了一种实现 `enum` 的方法：\n\n```\n1 enum class\
    \ Day {\n2     SUNDAY, MONDAY, TUESDAY, WEDNESDAY,\n3     THURSDAY, FRIDAY, SATURDAY\n\
    4 }\n```\n\n枚举可以拥有参数，这些参数在构造函数中声明：\n\n```\n1 enum class Icon(val res: Int) {\n\
    2     UP(R.drawable.ic_up),\n3     SEARCH(R.drawable.ic_search),\n4     CAST(R.drawable.ic_cast)\n\
    5 }\n6\n7 val searchIconRes = Icon.SEARCH.res\n```\n\n可以通过匹配名称的 `String` 请求枚举，我们还可以获取一个包含枚举所有值的\
    \ `Array`，以便对它们进行迭代。\n\n```\n1 val search: Icon = Icon.valueOf(\"SEARCH\")\n2\
    \ val iconList: Array<Icon> = Icon.values\n```\n\n此外，每个枚举常量都有获取其名称和在声明中位置的函数：\n\
    \n```\n1 val searchName: String = Icon.SEARCH.name\n2 val searchPosition: Int\
    \ = Icon.SEARCH.ordinal\n```\n\n枚举根据 `ordinal`（序号）实现 `Comparable`，所以它们很容易进行比较。\n\
    \n## 29.3 密封类 (Sealed classes)\n\n密封类用于表示受限的类层次结构，这意味着扩展密封类的类数量是被限制的。它与枚举的相似之处在于，编译器知道密封类有多少个子类型。区别在于，枚举实例是唯一的，而密封类可以有多个实例，这些实例可以包含不同的状态。\n\
    \n例如，我们可以实现类似于 `Option` 类的东西：这种类型通过在对象包含值时返回 `Some` 类，或在为空时返回 `None` 实例，来防止对 `null`的使用：\n\
    \n```\n1 sealed class Option<out T>\n2 object None : Option<Nothing>()\n3 data\
    \ class Just<out T>(val value: T) : Option<T>()\n```\n\n密封类的好处是，当它们被用于 `when`\
    \ 表达式时，我们可以检查所有选项，而不需要添加 `else` 分句。此外，如果我们在以后某处添加了新的子类，编译器会警告我们应该处理它的地方。\n\n```\n\
    1 val result = when (option) {\n2     None -> \"Empty\"\n3     is Just -> \"Contains\
    \ a value\"\n4 }\n```\n\n## 29.4 异常\n\n在 Kotlin 中，所有异常都实现了 `Throwable`，拥有消息并且是未检查的（unchecked）。因此，我们不需要对其中任何一个异常使用\
    \ `try/catch`。这在 Java 中并非如此，例如抛出 `IOException` 的方法需要被 `try/catch` 块包裹。时间证明检查异常并不是一个好主意。\
    \ [Bruce Eckel](http://www.mindview.net/Etc/Discussions/CheckedExceptions)、[Rod\
    \ Waldhoff](http://radio-weblogs.com/0122027/stories/2003/04/01/JavasCheckedExceptionsWereAMistake.html)\
    \ 或 [Anders Hejlsberg](http://www.artima.com/intv/handcuffs.html) 等人可以给你提供更好的视角。\n\
    \n抛出异常的方法与 Java Java：\n\n```\n1 throw MyException(\"Exception message\")\n```\n\
    \n`try` 表达式也是完全相同的：\n\n```\n1 try {\n2   // some code\n3 }\n4 catch (e: SomeException)\
    \ {\n5   // handler\n6 }\n7 finally {\n8   // optional finally block\n9 }\n```\n\
    \n`throw` 和 `try` 在 Kotlin 中都是表达式，允许将它们赋值给变量。这在处理边界情况时非常有用：\n\n```\n1 val s =\
    \ when(x){\n2     is Int -> \"Int instance\"\n3     is String -> \"String instance\"\
    \n4     else -> throw UnsupportedOperationException(\"Not valid type\")\n5 }\n\
    ```\n\n或者\n\n```\n1 val s = try { x as String } catch(e: ClassCastException) {\
    \ null }\n```\n\n# 30 Java 互操作\n\n到目前，我们一直在讨论从零开始创建一个 App。然而，你可能会发现自己处于已经有 Java\
    \ 代码的情况。我会涵盖这个主题。\n\nKotlin 的伟大之处之一是它可以与 Java 完全互操作。因此，尽管你的应用程序代码是用 Java 编写的，你也可以创建\
    \ Kotlin 代码。从 Java 调用 Kotlin 再不过了。这潜在地为你提供了两个优势：\n\n*   可以在 Java 中使用 Kotlin：在任何已启动的项目中，都可以开始编写新的\
    \ Kotlin 代码。\n*   如果你不知道如何在 Kotlin 中实现某功能，可以在 Java 中实现。\n\n## 30.1 包级函数\n\n在 Kotlin\
    \ 中，函数不需要在类内部，但 Java 不是这样的。那么我们如何调用函数呢？假设我们有一个名为 `utils.kt` 的文件，内容如下：\n\n```\n\
    1 fun logD(message: String) {\n2     Log.d(\"\", message)\n3 }\n4\n5 fun logE(message:\
    \ String) {\n6     Log.e(\"\", message)\n7 }\n```\n\n在 Java 中，我们可以通过名为 `UtilsKt`\
    \ 的类来访问它们，该类包含一些静态方法：\n\n```\n1 UtilsKt.logD(\"Debug\");\n2 UtilsKt.logE(\"Error\"\
    );\n```\n\n## 30.2 扩展函数\n\n我们在书中多次使用了扩展函数。然而，它们在 Java 中是什么样的？如果你有如下函数：\n\n```\n\
    1 fun ViewGroup.inflate(resId: Int, attachToRoot: Boolean = false): View {\n2\
    \     return LayoutInflater.from(context).inflate(resId, this, attachToRoot)\n\
    3 }\n```\n\n应用于 `ViewGroup`。它接收一个布局并使用父视图进行加载。如果我们想在 Java 中使用它，会得到什么？结果如下：\n\n\
    ```\n1 View v = UtilsKt.inflate(parent, R.layout.view_item, false);\n```\n\n正如你所见，应用该函数的对象（接收者）被作为参数添加到函数中。此外，可选参数在\
    \ Java 中变成了强制性的，因为在 Java 中无法使用默认值。\n\n"
- fmt: "\n### 30.3 Function overloads\n\nIf you want to generate the corresponding\
    \ overloads in Java, you can use `@JvmOverloads` annotation for that function.\
    \ In the previous example, you would not need to specify `false` for the second\
    \ argument in Java:\n\n```\n1 @JvmOverloads\n2 fun ViewGroup.inflate(resId: Int,\
    \ attachToRoot: Boolean = false): View {\n3     return LayoutInflater.from(context).inflate(resId,\
    \ this, attachToRoot)\n4 }\n5 \n6 View v = UtilsKt.inflate(parent, R.layout.view_item);\n\
    ```\n\nIf you prefer to specify the name of the class when calling Kotlin from\
    \ Java, you can use an annotation to modify it. In the `utils.kt` file, add this\
    \ above the `package` sentence:\n\n```\n1 @file:JvmName(\"AndroidUtils\")\n```\n\
    \nAnd now the class in Java will be named:\n\n```\n1 AndroidUtils.logD(\"Debug\"\
    );\n2 AndroidUtils.logE(\"Error\");\n3 View v = AndroidUtils.inflate(parent, R.layout.view_item,\
    \ false);\n```\n\n### 30.4 Instance and static fields\n\nIn Java, we use fields\
    \ to store the state. They can be instance fields, which means that each object\
    \ can store a different value, or static (all instances of a class share them).\
    \ If we try to find an equivalent of this in Kotlin, it would be properties and\
    \ companion objects. If we have a class like this:\n\n```\n 1 class App : Application()\
    \ {\n 2 \n 3     val appHelper = AppHelper()\n 4 \n 5     companion object {\n\
    \ 6         lateinit var instance: App\n 7     }\n 8 \n 9     override fun onCreate()\
    \ {\n10         super.onCreate()\n11         instance = this\n12     }\n13 \n\
    14 }\n```\n\nHow does this work in Java? You can simply access the companion object\
    \ properties as static fields, by using `getters` and `setters`:\n\n```\n1 AppHelper\
    \ helper = App.instance.getAppHelper();\n```\n\nAs a `val`, it only generates\
    \ the `getter` in Java. If it were `var`, we would also have a `setter`. The access\
    \ to `instance` has worked automatically because it uses the `lateinit` annotation,\
    \ which also exposes the field that Kotlin uses to store the state. But imagine\
    \ we create a constant:\n\n```\n1 companion object {\n2     lateinit var instance:\
    \ App\n3     val CONSTANT = 27\n4 }\n```\n\nYou find that you cannot use it directly.\
    \ You are forced to access through a `Companion` internal class:\n\n```\n1 KotlinClass.Companion.getCONSTANT()\n\
    ```\n\nThis previous snippet does not look particularly readable. To expose the\
    \ field in Java the same way a static field would look, you need a new annotation:\n\
    \n```\n1 @JvmField val CONSTANT = 27\n```\n\nAnd now you can use it from Java\
    \ code:\n\n```\n1 int c = App.CONSTANT;\n```\n\nIf you have functions in a companion\
    \ object, they are converted to static methods using the `@JvmStatic` annotation.\
    \ There are several ways to define constants that, when we use Kotlin from Java,\
    \ generate different bytecode. If you remember, we used `const val` before, and\
    \ those properties are accessible without using a `getter`.\n\n### 30.5 Data classes\n\
    \nSome features are clear, but some others are more difficult to know how they\
    \ may behave in Java. So let’s take a look at those features that Kotlin has,\
    \ but Java does not. One example is *data classes*. Let’s say we have a data class\
    \ like this:\n\n```\n1 data class MediaItem(val id: Int, val title: String, val\
    \ url: String)\n```\n\nWe can create instances of this class:\n\n```\n1 MediaItem\
    \ mediaItem = new MediaItem(1, \"Title\", \"https://antonioleiva.com\");\n```\n\
    \nBut are we missing something? First, let’s check if `equals` works as expected:\n\
    \n```\n1 MediaItem mediaItem = new MediaItem(1, \"Title\", \"https://antonioleiva.com\"\
    );\n2 MediaItem mediaItem2 = new MediaItem(1, \"Title\", \"https://antonioleiva.com\"\
    );\n3 \n4 if (mediaItem.equals(mediaItem2)) {\n5     Toast.makeText(this, \"Items\
    \ are equals\", Toast.LENGTH_SHORT).show();\n6 }\n```\n\nOf course, it shows the\
    \ `Toast`. The bytecode the class generates has everything it needs to compare\
    \ two items and, if the state is the same, then the items are also the same. However,\
    \ other things are more difficult to replicate. Remember the `copy` feature data\
    \ classes have? The method is there, but you can only use it passing all arguments:\n\
    \n```\n1 mediaItem.copy(1, \"Title2\", \"http://google.com\");\n```\n\nSo it is\
    \ not better than just using the constructor. Also, we lose destructuring, as\
    \ the Java language does not have a way to express that.\n\n### 30.6 Sealed classes\n\
    \nAnother feature that may come to your mind is *sealed classes*. How do they\
    \ work when used from Java? Let’s try it:\n\n```\n1 sealed class Filter {\n2 \
    \    object None : Filter()\n3     data class ByType(val type: Type) : Filter()\n\
    4     data class ByFormat(val format: Format) : Filter()\n5 }\n```\n\nWe have\
    \ a `Filter` class that represents a filter that can be applied to items. Of course,\
    \ in Java we cannot do:\n\n```\n1 switch (filter) {\n2     ...\n3 }\n```\n\nWait,\
