  trans: "\n\n我们可以进一步简化最后一行。在只有一个参数的 lambda 中，我们可以利用 `it` 引用，这避免了我们显式地定义函数的左部分。因此我们可以这样做：\n\
    \n```kotlin\n1 val adapter = ForecastListAdapter(result) { toast(it.date) }\n\
    ```\n\n### 13.3 扩展语言\n\n得益于这些转换，我们可以创建自己的构建器和代码块。我们已经在使用一些像 `with` 这样有趣的函数。虽然标准库中包含的稍微复杂一点，但更简单的实现如下：\n\
    \n```kotlin\n1 inline fun <T> with(t: T, body: T.() -> Unit) { t.body() }\n```\n\
    \n该函数接收一个类型为 `T` 的对象和一个行为类似于扩展函数的 lambda。实现过程接收该对象并允许执行该函数。由于函数的第二个参数是另一个函数，它可以提取到括号之外，因此我们可以创建一个代码块，在其中我们可以直接使用\
    \ `this` 以及该对象的公共属性和方法：\n\n```kotlin\n1 with(forecast) {\n2     Picasso.with(itemView.ctx).load(iconUrl).into(iconView)\n\
    3     dateView.text = date\n4     descriptionView.text = description\n5     maxTemperatureView.text\
    \ = \"$high\"\n6     minTemperatureView.text = \"$low\"\n7     itemView.setOnClickListener\
    \ { itemClick(this) }\n8 }\n```\n\n另一个例子：我们可以创建仅在版本为 Lollipop 或更高版本时才运行的代码块：\n\
    \n```kotlin\n1 inline fun supportsLollipop(code: () -> Unit) {\n2     if (Build.VERSION.SDK_INT\
    \ >= Build.VERSION_CODES.LOLLIPOP) {\n3         code()\n4     }\n5 }\n```\n\n\
    函数体会检查版本，并在满足要求时执行代码。现在我们可以这样做：\n\n```kotlin\n1 supportsLollipop {\n2     window.setStatusBarColor(Color.BLACK)\n\
    3 }\n```\n\n例如，Anko 也是基于这个思想来实现 Android 布局 DSL 的。你也可以查看 Kotlin 参考中的一个示例，它展示了如何从代码中[生成\
    \ HTML](http://kotlinlang.org/docs/reference/type-safe-builders.html) 的 DSL。\n\
    \n本章的更改可以在[对应的分支中](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-13)找到。\n\
    \n## 14 可见性修饰符\n\nKotlin 中修饰符的使用与 Java 有不同。这种语言的默认修饰符是 `public`，这节省了大量的时间字符。这里是详细解释：可见性修饰符在\
    \ Kotlin 中是如何工作的？\n\n### 14.1 修饰符\n\n#### private\n\n`private` 修饰符是我们可以使用的最严格限制。它表示在文件中可见。因此，如果我们将一个类声明为\
    \ `private`，则无法在定义它的文件之外使用它。\n\n另一方面，如果在类内部使用 `private`，则访问被限制在该类内部。即使是扩展它的类也无法使用它。\n\
    \n因此，声明为 `private` 的第一级类、对象、接口……（称为包成员）仅在声明它们所在的文件内部可见，而定义在类或接口内部的所有内容仅对该类或该接口可见。\n\
    \n#### protected\n\n此修饰符仅适用于类或接口的成员。包成员不能是 `protected`。在成员内部，它的工作方式与 Java 相同：它可以被成员本身以及扩展它的成员使用（例如类及其子类）。\n\
    \n#### internal\n\n如果一个内部成员是包成员，则它在整个模块内可见。如果它是另一个作用域的成员，则取决于该作用域的可见性。例如，如果我们写了一个私有类，对\
    \ `internal` 函数的访问将限于该类的可见性。\n\n我们可以从同一模块中的任何其他类使用 `internal` 类，但不能从另一个模块使用。\n\
    \n#### public\n\n正如你所猜的，这是限制最少的修饰符。它是默认修饰符，声明为 `public` 的成员在任何地方可见，仅受其作用域限制。定义在私有类中的公共成员在类可见的作用域之外不可见。\n\
    \n### 14.2 构造函数\n\n默认情况下，所有构造函数都是 `public` 的，这意味着可以在类可见的任何作用域中使用它们。如果我们想限制构造函数的可见性，可以使用这种特定语法对其应用修饰符：\n\
    \n```kotlin\n1 class C private constructor(a: Int) { ... }\n```\n\n### 14.3 复习我们的代码\n\
    \n我们已经使用了默认的 `public` 修饰符，最新版本的 Kotlin 插件也会检测参数何时可以是私有的。例如，在 `RequestForecastCommand`\
    \ 中，我们将 `zipCode` 属性设为了私有。\n\n```kotlin\n1 class RequestForecastCommand(private\
    \ val zipCode: String)\n```\n\n此外，在 Kotlin 中，如果编译器可以推断，我们就不需要指定函数的返回类型。这是一个如何获取返回类型的示例：\n\
    \n```kotlin\n1 data class(...) {\n2     operator fun get(position: Int)\n3 }\n\
    ```\n\n## 15 Kotlin Extensions\n\n**Kotlin Extensions** 是 Kotlin 团队开发的另一个插件，用于使\
    \ Android 开发更加简单。插件会自动创建属性，可以直接访问 XML 中的所有视图。它不需要添加库。\n\n它在底层是如何工作的？这些属性委托给请求视图的函数以及一个防止每次使用属性时都执行\
    \ `findViewById` 的缓存函数。请注意，这种缓存机制在接收者为 Activity 或 Fragment 时有效。\n\n### 15.1 如何使用\
    \ Kotlin Extensions\n\n让我们看看有多简单。虽然该插件是常规的一部分（不需要安装新插件），但如果你想使用它，需要在 Android 模块中添加一个额外的\
    \ `apply`：\n\n```gradle\n1 apply plugin: 'com.android.application'\n2 apply plugin:\
    \ 'kotlin-android'\n3 apply plugin: 'kotlin-android-extensions'\n```\napp/build.gradle\n\
    \n如果你记得的话，我们在书的开头已经这样做。\n\n#### 从 XML 恢复视图\n\n从现在起，恢复视图就像直接在活动中使用你在 XML 中定义的视图\
    \ ID 一样简单。假设你有一个像这样的 XML：\n\n```xml\n 1 <FrameLayout\n2     xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n3     android:layout_width=\"match_parent\"\n4     android:layout_height=\"\
    match_parent\"\n5 \n6     <TextView\n7         android:id=\"@+id/welcomeMessage\"\
    \n8         android:layout_width=\"wrap_content\"\n9         android:layout_height=\"\
    wrap_content\"\n10         android:layout_gravity=\"center\"\n11         android:text=\"\
    Hello World!\"/>\n12 \n13 </FrameLayout>\n```\n\n如你所见，`TextView` 拥有 `welcomeMessage`\
    \ ID。在 `MainActivity` 中，你现在可以写：\n\n```kotlin\n1 override fun onCreate(savedInstanceState:\
    \ Bundle?) {\n2     super.onCreate(savedInstanceState)\n3     setContentView(R.layout.activity_main)\n\
    4 \n5     welcomeMessage.text = \"Hello Kotlin!\"\n6 }\n```\n\n"
- fmt: "\nTo use it, you require a special `import` (the one I write below), but the\
    \ IDE can write the import for you:\n\n```\n1 import kotlinx.android.synthetic.main.activity_main.*\n\
    ```\n\nThe new Android Studio activity templates now include nested layouts, by\
    \ using the `include` tag. It is important to know that you must add a synthetic\
    \ import for each XML you use:\n\n```\n1 import kotlinx.android.synthetic.main.activity_main.*\n\
    2 import kotlinx.android.synthetic.main.content_main.*\n```\n\nAs I mentioned\
    \ above, the generated code includes a view cache. So if you ask for the view\
    \ again, this does not require another `findViewById`. Let’s see what it is doing\
    \ behind the scenes.\n\n### The magic behind Kotlin Android Extensions \n\nWhen\
    \ you start working with Kotlin, it is helpful to understand the bytecode generated\
    \ when you use a new feature. This practice helps you understand the hidden costs\
    \ of your decisions.\n\nThere is an action below `Tools –> Kotlin`, called `Show\
    \ Kotlin Bytecode`. If you click here, you can see the bytecode generated when\
    \ the class file you opened is compiled.\n\nThe bytecode is not helpful for most\
    \ humans, but there is another option here: `Decompile`.\n\nThis section shows\
    \ a Java representation of the bytecode generated by Kotlin. That way, you can\
    \ compare the Java equivalent to the Kotlin code you wrote.\n\nI am going to use\
    \ this on the previous sample activity, and see the code generated by Kotlin Android\
    \ Extensions.\n\nThe interesting part is this one:\n\n```\n 1 ...\n 2 public View\
    \ _$_findCachedViewById(int var1) {\n 3    if(this._$_findViewCache == null) {\n\
    \ 4       this._$_findViewCache = new HashMap();\n 5    }\n 6 \n 7    View var2\
    \ = (View)this._$_findViewCache.get(Integer.valueOf(var1));\n 8    if(var2 ==\
    \ null) {\n 9       var2 = this.findViewById(var1);\n10       this._$_findViewCache.put(Integer.valueOf(var1),\
    \ var2);\n11    }\n12 \n13    return var2;\n14 }\n15 \n16 public void _$_clearFindViewByIdCache()\
    \ {\n17    if(this._$_findViewCache != null) {\n 18       this._$_findViewCache.clear();\n\
    19    }\n20 \n21 }\n```\n\nHere it is the view cache we were talking about. When\
    \ a view is requested, it tries to find it in the cache. If it is not there, it\
    \ uses `findViewById` and adds it to the cache. Pretty simple indeed.\n\nBesides,\
    \ it adds a function to clear the cache: `clearFindViewByIdCache()`. You can use\
    \ it for instance if you rebuild the view, as the old views are not valid anymore.\
    \ Then this line:\n\n```\n1 welcomeMessage.text = \"Hello Kotlin!\"\n```\n\nis\
    \ converted into this:\n\n```\n1 ((TextView)this._$_findCachedViewById(id.welcomeMessage))\n\
    2     .setText((CharSequence)\"Hello Kotlin!\");\n```\n\nSo the properties are\
    \ not real, the plugin is not generating a property per view. It replaces the\
    \ code during compilation to access the view cache, cast it to the proper type\
    \ and call the method.\n\n### Kotlin Android Extensions on fragments\n\nFragments\
    \ can also use this plugin. The problem with fragments is that the view can be\
    \ recreated while the fragment instance keeps alive. What happens then? This means\
    \ that the views inside the cache would no longer be valid.\n\nLet’s see the code\
    \ it generates if we use a fragment. I am creating this simple fragment, that\
    \ uses the same XML I wrote above:\n\n```\n 1 class Fragment : Fragment() {\n\
    \ 2 \n 3     override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?,\
    \ \n 4             savedInstanceState: Bundle?): View? {\n 5         return inflater.inflate(R.layout.fragment,\
    \ container, false)\n 6     }\n 7 \n 8     override fun onViewCreated(view: View?,\
    \ savedInstanceState: Bundle?) {\n 9         super.onViewCreated(view, savedInstanceState)\n\
    10         welcomeMessage.text = \"Hello Kotlin!\"\n11     }\n12 }\n```\n\nIn\
    \ `onViewCreated`, I change the text of the `TextView`. What about the generated\
    \ bytecode? Everything is the same as in the activity, with this slight difference:\n\
    \n```\n1 // $FF: synthetic method\n2 public void onDestroyView() {\n3    super.onDestroyView();\n\
    4    this._$_clearFindViewByIdCache();\n5 }\n```\n\nWhen the view is destroyed,\
    \ this method calls `clearFindViewByIdCache`, so we are safe here.\n\n### Kotlin\
    \ Android extensions on a Custom View\n\nIt will work very similarly on a custom\
    \ view. Imagine we have a view like this:\n\n```\n 1 <merge xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n 2               android:orientation=\"vertical\"\n 3               android:layout_width=\"\
    match_parent\"\n 4               android:layout_height=\"match_parent\">\n 5 \n\
    \ 6     <ImageView\n 7         android:id=\"@+id/itemImage\"\n 8         android:layout_width=\"\
    match_parent\"\n 9         android:layout_height=\"200dp\"/>\n10 \n 11     <TextView\n\
    \ 12         android:id=\"@+id/itemTitle\"\n 13         android:layout_width=\"\
    match_parent\"\n14         android:layout_height=\"wrap_content\"/>\n15 \n16 </merge>\n\
    ```\n\n```\n1 class CustomView @JvmOver constructor(\n2         context: Context,\
    \ attrs: AttributeSet? = null,\n3 defStyleAttr: Int = 0\n4 ) : LinearLayout(context,\
    \ attrs, defStyleAttr) {\n5 \n6     init {\n7         LayoutInflater.from(context).inflate(R.layout.custom,\
    \ this, true)\n8         itemTitle.text = \"Hello Kotlin!\"\n9     }\n10 }\n```\n\
    \n### Recovering views from another view\n\nThe last alternative Kotlin Extensions\
    \ provide is to use the properties directly from another view. I am using a layout\
    \ very similar to the one in the previous section. Imagine that this is inflated\
    \ in an adapter. You can also access the subviews directly, just by using this\
    \ plugin:\n\n```\n1 val itemView = ...\n2 itemView.itemImage.setImageResource(R.drawable.image)\n\
    3 itemView.itemTitle.text = \"My Text\"\n```\n\nThe plugin also helps you fill\
    \ the `import`. Check that this one is different:\n\n```\n1 import kotlinx.android.synthetic.main.view_item.view.*\n\
    ```\n\nThere are a couple of things you need to know about this:\n\n*   In compilation\
    \ time, you can reference any views from any other views. This means you could\
    \ be referencing a view that is not a direct child of that one. Of course, this\
    \ crashes in execution time when it tries to recover a view that does not exist.\n\
    *   In this case, views are not cached, as opposed to `Activities` and `Fragments`.\n\
    \n### 15.2 Kotlin Android Extensions in 1.1.4\n\nFrom this version of Kotlin,\
    \ the Android Extensions have incorporated some new exciting features: caches\
    \ in any classes, and a new annotation called `@Parcelize`. There is also a way\
    \ to customize the generated cache.\n\nAt the moment of writing these lines, these\
    \ features are still experimental, so you need to enable them by adding this to\
    \ the `build.gradle`:\n\n```\n1 androidExtensions {\n2 experimental = true\n3\
    \ }\n```\n"
