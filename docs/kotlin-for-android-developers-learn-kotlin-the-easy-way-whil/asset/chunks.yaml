    \ Int) {\n2     with(weekForecast[position]) {\n3         holder.textView.text\
    \ = \"$date - $description - $high/$low\"\n4     }\n5 }\n```\n\nui/adapters/ForecastListAdapter.kt\n\
    \nAs well as the `getItemCount()` function:\n\n```\n1 override fun getItemCount():\
    \ Int = weekForecast.size\n```\n\nui/adapters/ForecastListAdapter.kt\n\n### 11.3\
    \ Operators in extension functions\n\nApart from using extension functions for\
    \ our classes, we can also extend existing classes to provide new operations to\
    \ third-party libraries. For instance, we could access to `ViewGroup` views the\
    \ same way we do with lists:\n\n```\n1 operator fun ViewGroup.get(position: Int):\
    \ View \n2         = getChildAt(position)\n```\n\nNow it is really simple to get\
    \ a view from a `ViewGroup` by its position:\n\n```\n1 val container: ViewGroup\
    \ = find(R.id.container)\n2 val view = container[2]\n```\n\nTake a look at the\
    \ [branch for this chapter](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-11),\
    \ and then you can go on with the next one.\n\n## 12 Making the forecast list\
    \ clickable\n\nCurrent items layout needs some work to be ready for a real app.\
    \ The first thing is to create a proper XML that can fit our basic needs. We want\
    \ to show an icon, date, description and high and low temperatures. So let’s create\
    \ a layout called `item_forecast.xml`:\n\n```\n 1 <?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n 2 <LinearLayout\n 3     xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n 4     xmlns:tools=\"http://schemas.android.com/tools\"\n 5     android:layout_width=\"\
    match_parent\"\n 6     android:layout_height=\"match_parent\"\n 7     android:padding=\"\
    @dimen/spacing_xlarge\"\n 8     android:background=\"?attr/selectableItemBackground\"\
    \n 9     android:gravity=\"center_vertical\"\n10     android:orientation=\"horizontal\"\
    >\n11 \n12     <ImageView\n13         android:id=\"@+id/icon\"\n14         android:layout_width=\"\
    48dp\"\n15         android:layout_height=\"48dp\"\n16         tools:src=\"@mipmap/ic_launcher\"\
    />\n17 \n18     <LinearLayout\n19         android:layout_width=\"0dp\"\n20   \
    \      android:layout_height=\"wrap_content\"\n21         android:layout_weight=\"\
    1\"\n22         android:layout_marginLeft=\"@dimen/spacing_xlarge\"\n23      \
    \   android:layout_marginRight=\"@dimen/spacing_xlarge\"\n24         android:orientation=\"\
    vertical\">\n25 \n26         <TextView\n27             android:id=\"@+id/date\"\
    \n28             android:layout_width=\"match_parent\"\n29             android:layout_height=\"\
    wrap_content\"\n30             android:textAppearance=\"@style/TextAppearance.AppCompat.Medium\"\
    \n31             tools:text=\"May 14, 2015\"/>\n32 \n33         <TextView\n34\
    \             android:id=\"@+id/description\"\n35             android:layout_width=\"\
    match_parent\"\n36             android:layout_height=\"wrap_content\"\n37    \
    \         android:textAppearance=\"@style/TextAppearance.AppCompat.Caption\"\n\
    38             tools:text=\"Light Rain\"/>\n39 \n40     </LinearLayout>\n41 \n\
    42     <LinearLayout\n43         android:layout_width=\"wrap_content\"\n44   \
    \      android:layout_height=\"wrap_content\"\n45         android:gravity=\"center_horizontal\"\
    \n46         android:orientation=\"vertical\">\n47 \n48         <TextView\n49\
    \             android:id=\"@+id/maxTemperature\"\n50             android:layout_width=\"\
    wrap_content\"\n51             android:layout_height=\"wrap_content\"\n52    \
    \         android:textAppearance=\"@style/TextAppearance.AppCompat.Medium\"\n\
    53             tools:text=\"30\"/>\n54 \n55         <TextView\n56            \
    \ android:id=\"@+id/minTemperature\"\n57             android:layout_width=\"wrap_content\"\
    \n58             android:layout_height=\"wrap_content\"\n59             android:textAppearance=\"\
    @style/TextAppearance.AppCompat.Caption\"\n60             tools:text=\"15\"/>\n\
    61 \n62     </LinearLayout>\n63     \n64 </LinearLayout>\n```\n\nlayout/item_forecast.xml\n\
    \nThe domain model and data mapper must generate the complete icon url, so that\
    \ we can load it:\n\n```\n1 data class Forecast(val date: String, val description:\
    \ String, \n2                     val high: Int, val low: Int, val iconUrl: String)\n\
    ```\n\nmodel/DomainClasses.kt\n\nIn `ForecastDataMapper`:\n\n```\n1 private fun\
    \ convertForecastItemToDomain(forecast: Forecast): ModelForecast {\n2     return\
    \ ModelForecast(convertDate(forecast.dt), \n3             forecast.weather[0].description,\
    \ forecast.temp.max.toInt(), \n4             forecast.temp.min.toInt(), generateIconUrl(forecast.weather[0].icon))\n\
    5 }\n6 \n7 private fun generateIconUrl(iconCode: String): String \n8         =\
    \ \"http://openweathermap.org/img/w/$iconCode.png\"\n```\n\ndomain/mappers/ForecastDataMapper.kt"
