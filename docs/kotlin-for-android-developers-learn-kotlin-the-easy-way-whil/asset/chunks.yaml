    \ of the shortest collection.\n\n```\n1 assertEquals(listOf(Pair(1, 7), Pair(2,\
    \ 8)), list.zip(listOf(7, 8)))\n```\n\n#### unzip\n\nGenerates a `Pair` of `List`s\
    \ from a `List` of `Pair`s\n\n```\n1 assertEquals(Pair(listOf(5, 6), listOf(7,\
    \ 8)), listOf(Pair(5, 7), Pair(6, 8)).unzip())\n```\n\n### 18.6 Ordering operations\n\
    \n#### reverse\n\nReturns a list with elements in reversed order.\n\n```\n1 val\
    \ unsortedList = listOf(3, 2, 7, 5)\n2 assertEquals(listOf(5, 7, 2, 3), unsortedList.reverse())\n\
    ```\n\n#### sort\n\nReturns a sorted list of all elements.\n\n```\n1 assertEquals(listOf(2,\
    \ 3, 5, 7), unsortedList.sort())\n```\n\n#### sortBy\n\nReturns a list of all\
    \ elements, sorted by the specified comparator.\n\n```\n1 assertEquals(listOf(3,\
    \ 7, 2, 5), unsortedList.sortBy { it % 3 })\n```\n\n#### sortDescending\n\nReturns\
    \ a sorted list of all elements, in descending order.\n\n```\n1 assertEquals(listOf(7,\
    \ 5, 3, 2), unsortedList.sortDescending())\n```\n\n#### sortDescendingBy\n\nReturns\
    \ a sorted list of all elements, in descending order by the results of the specified\
    \ order function.\n\n```\n1 assertEquals(listOf(2, 5, 7, 3), unsortedList.sortDescendingBy\
    \ { it % 3 })\n```\n\n## 19 Saving and requesting data from the database\n\nA\
    \ previous chapter covered the creation of an `SQLiteOpenHelper`, but now we need\
    \ a way to use it to persist our data into the database and recover it when necessary.\
    \ Another class, called `ForecastDb`, is making use of it.\n\n### 19.1 Creating\
    \ database model classes\n\nFirst, we are going to create the model classes for\
    \ the database. Do you remember the map delegates we saw? We are using them to\
    \ map those fields directly to the database and vice-versa.\n\nLet’s take a look\
    \ at the `CityForecast` class first:\n\n```\n 1 class CityForecast(val map: MutableMap<String,\
    \ Any?>,\n 2                            val dailyForecast: List<DayForecast>)\
    \ {\n 3     var _id: Long by map\n 4     var city: String by map\n 5     var country:\
    \ String by map\n 6 \n 7     constructor(id: Long, city: String, country: String,\n\
    \ 8                 dailyForecast: List<DayForecast>)\n 9     : this(HashMap(),\
    \ dailyForecast) {\n10         this._id = id\n11         this.city = city\n12\
    \         this.country = country\n13     }\n14 }\n```\n\ndata/db/DbClasses.kt\n\
    \nThe default constructor is getting a map, presumably filled with the values\
    \ of the properties, and a `dailyForecast`. Thanks to the delegates, the values\
    \ are mapped to the corresponding properties based on the name of the key. If\
    \ we want to make the mapping work correctly, the names of the properties must\
    \ be the same as the names of the columns in the database. We will see why later.\n\
    \nBesides, a second constructor is necessary. This is because we are mapping classes\
    \ from the domain back to the database. So instead of using a map, extracting\
    \ the values from the properties is more convenient. We pass an empty map, but\
    \ again, thanks to the delegate, when we set a value to a property, it automatically\
    \ adds a new value to the map. That way, we have our map ready to be added to\
    \ the database. After writing some extra code, you will see that it works like\
    \ magic.\n\nNow we need a second class, `DayForecast`, which corresponds to the\
    \ second table. This one has one property per column, and also uses a secondary\
    \ constructor. The only difference is that we are not assigning an id because\
    \ this one is auto-generated by SQLite.\n\n```\n 1 class DayForecast(var map:\
    \ MutableMap<String, Any?>) {\n 2     var _id: Long by map\n 3     var date: Long\
    \ by map\n 4     var description: String by map\n 5     var high: Int by map\n\
    \ 6     var low: Int by map\n 7     var iconUrl: String by map\n 8     var cityId:\
    \ Long by map\n 9 \n10     constructor(date: Long, description: String, high:\
    \ Int, low: Int, \n11                 iconUrl: String, cityId: Long) : this(HashMap())\
    \ {\n12         this.date = date\n13         this.description = description\n\
    14         this.high = high\n15         this.low = low\n16         this.iconUrl\
    \ = iconUrl\n17         this.cityId = cityId\n18     }\n19 }\n```\n\ndata/db/DbClasses.kt\n\
    \nThese classes helps us map the data between objects and SQLite tables, in both\
    \ directions.\n\n### 19.2 Writing and requesting data"
