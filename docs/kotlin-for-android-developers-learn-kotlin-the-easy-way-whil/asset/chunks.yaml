    \ mapper），即我们创建的第一个，尽管我修改了一些方法的名称，使其与我们用于数据库模型的数据映射相似。你可以查看提供者（provider）以了解细节。\n\
    \n重写后的函数向服务器发送请求，将结果转换为领域对象并将其保存到数据库中。最后它返回数据库中的值，因为我们需要插入查询自动生成的行 ID。\n\n完成这些最后步骤后，提供者已经实现完毕。现在我们需要开始使用它了。`ForecastCommand`\
    \ 不再应该直接与服务器请求交互，也不再将数据转换为领域模型。\n\n```kotlin\n class RequestForecastCommand(private\
    \ val zipCode: Long,\n        private val forecastProvider: ForecastProvider =\
    \ ForecastProvider()) :\n        Command<ForecastList> {\n\n    companion object\
    \ {\n        const val DAYS = 7\n    }\n\n    override fun execute(): ForecastList\
    \ =\n        forecastProvider.requestByZipCode(zipCode, DAYS)\n}\n```\n\n`domain/commands/RequestForecastCommand.kt`\n\
    \n其余的代码修改包括此处的的一些重命名和包结构调整。请查看 [Kotlin for Android Developers 仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-21)\
    \ 中对应的分支。\n\n## 22. 流程控制与范围\n\n我在代码中已经了一些条件表达式，所以你对本章的一些概念并不陌生。但现在是时候更深入地解释它们了。虽然在\
    \ Kotlin 中，我们通常比在完全过程式的编程语言中通常使用的流程控制机制要少（有些甚至几乎消失了），但它们仍然很有用。还有一些新的强大思想可以更轻松地解决某些特定问题。\n\
    \n### 22.1 If 表达式\n\nKotlin 中的几乎所有内容都是表达式，这意味着它们会返回一个值。`If` 条件并不是例外，尽管我们可以像习惯的那样使用\
    \ `if`：\n\n```\nif (x > 0) {\n    toast(\"x is greater than 0\")\n} else if (x\
    \ == 0) {\n    toast(\"x equals 0\")\n} else {\n    toast(\"x is smaller than\
    \ 0\")\n}\n```\n\n我们还可以将它的结果赋值给变量。我们在代码中已经这样用过几次：\n\n```\nval res = if (x != null\
    \ && x.size() >= days) x else null\n```\n\n这同时也意味着我们不需要类似于 Java 的三元运算符，因为我们可以轻松地解决：\n\
    \n```\nval z = if (condition) x else y\n```\n\n因此 `if` 表达式总是返回一个值。如果其中一个分支返回 `Unit`，则整个表达式返回\
    \ `Unit`，该值是可以被忽略的，在这种情况下，它的行为会像普通的 Java `if` 条件一样。\n\n### 22.2 When 表达式\n\n`When`\
    \ 表达式类似于 Java 中的 `switch`，但要强大得多。它将参数与可能的情况进行匹配，直到找到匹配的项为止。\n\n"
- fmt: "\nKotlin defines ranges for any types that can be compared, but for numerical\
    \ types the compiler optimizes it by converting it to simpler analog code in Java,\
    \ to avoid the extra overhead. The numerical ranges are also iterable, and the\
    \ loops are optimized too by converting them to the same bytecode a `for` with\
    \ indices would use in Java:\n\n```\nfor (i in 0..10)\n    println(i)\n```\n\n\
    Ranges are incremental by default, so something like:\n\n```\nfor (i in 10..0)\n\
    \    println(i)\n```\n\nWould do nothing. You can, however, use the function `downTo`:\n\
    \n```\nfor (i in 10 downTo 0)\n    println(i)\n```\n\nWe can define a spacing\
    \ different from 1 among the values in a range by using `step`:\n\n```\nfor (i\
    \ in 1..4 step 2) println(i)\n\nfor (i in 4 downTo 1 step 2) println(i)\n```\n\
    \nIf you want to create an open range (which excludes the last item), you can\
    \ use the function `until`:\n\n```\nfor (i in 0 until 4) println(i)\n```\n\nThis\
    \ previous line prints from 0 to 3, but skips the last value. This means that\
    \ `0 until 4 == 0..3`. For iterations over lists, it could be easier to understand\
    \ if we use `for (i in 0 until list.size)` instead of `for (i in 0..list.size\
    \ - 1)`.\n\nAs mentioned before, there are really creative ways to use ranges.\
    \ For instance, an easy way to get the list of `View`s inside a `ViewGroup` would\
    \ be:\n\n```\nval views = (0 until viewGroup.childCount).map { viewGroup.getChildAt(it)\
    \ }\n```\n\nThe mix of ranges and functional operators prevents from having to\
    \ use an explicit loop to iterate over the collection and the creation of an explicit\
    \ list where we add the views. You can do everything on a single line.\n\nIf you\
    \ want to know more about how to implement ranges and see more examples and useful\
    \ information, you can go to [Kotlin reference](https://kotlinlang.org/docs/reference/ranges.html).\n\
    \n# 23 Creating a Detail Activity\n\nWhen we click on an item from the home screen,\
    \ we would expect to navigate to a detail activity and see some extra info about\
    \ the forecast for that day. We are currently showing a toast after an item click,\
    \ but it is time to change that.\n\n## 23.1 Preparing the request\n\nAs we need\
    \ to know which item we are going to show in the detail activity, logic tells\
    \ we need to send the `id` of the forecast to the detail. So the domain model\
    \ needs a new `id` property:\n\n```\ndata class Forecast(val id: Long, val date:\
    \ Long, val description: String, \n    val high: Int, val low: Int, val iconUrl:\
    \ String)\n```\n\n`domain/model/DomainClasses.kt`\n\nThe `ForecastProvider` also\
    \ needs a new function, which returns the requested forecast by id. The `DetailActivity`\
    \ will use it to recover the forecast based on the id it will receive. As all\
    \ the requests always iterate over the sources and return the first non-null result,\
    \ we can extract that behaviour to another function:\n\n```\nprivate fun <T :\
    \ Any> requestToSources(f: (ForecastDataSource) -> T?): T \n        = sources.firstResult\
    \ { f(it) }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\nThe function is\
    \ generified using a non-nullable type. It will receive a function which uses\
    \ a `ForecastDataSource` to return a nullable object of the generic type, and\
    \ will finally return a non-nullable object. We can rewrite the previous request\
    \ and write the new one this way:\n\n```\nfun requestByZipCode(zipCode: Long,\
    \ days: Int): ForecastList = requestToSources {\n    val res = it.requestForecastByZipCode(zipCode,\
    \ todayTimeSpan())\n    if (res != null && res.size() >= days) res else null\n\
    }\n\nfun requestForecast(id: Long): Forecast = requestToSources { \n    it.requestDayForecast(id)\
    \ \n}\n```\n\n`domain/datasource/ForecastProvider.kt`\n\nNow the data sources\
    \ need to implement the new function:\n\n```\nfun requestDayForecast(id: Long):\
    \ Forecast?\n```\n\n`domain/datasource/ForecastDataSource.kt`\n\nThe `ForecastDb`\
    \ will always have the required value already cached from previous requests, so\
    \ we can get it from there this way:\n\n```\noverride fun requestDayForecast(id:\
    \ Long): Forecast? = forecastDbHelper.use {\n    val forecast = select(DayForecastTable.NAME).byId(id).\n\
    \            parseOpt { DayForecast(HashMap(it)) }\n\n    if (forecast != null)\
    \ dataMapper.convertDayToDomain(forecast) else null\n}\n```\n\n`data/db/ForecastDb.kt`\n\
    \nThe `select` query is very similar to the previous one. I created another utility\
    \ function called `byId`, because a request by `id` is so common that a function\
    \ like that simplifies the process and is easier to read. The implementation of\
    \ the function is quite simple:\n\n```\nfun SelectQueryBuilder.byId(id: Long)\
    \ \n        = whereSimple(\"_id = ?\", id.toString())\n```\n\n`extensions/DatabaseExtensions.kt`\n\
    \nIt makes use of the `whereSimple` function and implements the search over the\
    \ `_id` field. This function is quite generic, but as you can see, you could create\
    \ as many extension functions as you need based on the structure of your database,\
    \ and hugely simplify the readability of your code. The `DbMapper` has some slight\
    \ changes not mentioning. You can check them in the repository.\n\nOn the other\
    \ hand, the `ForecastServer` is never used, because the info is always cached\
    \ in the database. We could implement it to defend our code from edge cases, but\
    \ we are not doing it in this case, so it will just throw an exception:\n\n```\n\
    override fun requestDayForecast(id: Long) \n        = UnsupportedOperationException()\n\
    ```\n\n`data/server/ForecastServer.kt`\n\nThe last thing we need to be able to\
    \ perform the request from the new activity is to create a command. The code is\
    \ really simple:\n\n```\nclass RequestForecastCommand(\n        val id: Long,\n\
    \        private val forecastProvider: ForecastProvider = ForecastProvider())\
    \ :\n        Command<Forecast> {\n\n    override fun execute() = forecastProvider.requestForecast(id)\n\
    }\n```\n\n`domain/commands/RequestForecastCommand.kt`\n\nThe request returns a\
    \ `Forecast` result that is used by the activity to draw its UI.\n\n## 23.2 Providing\
    \ a new activity\n\nWe are now prepared to create the `DetailActivity`.\n\nIn\
    \ Android Studio 2.3 and below, you can select the package where you want to create\
    \ the activity, right click and select `New -> Kotlin Activity`.\n\nFor Android\
    \ Studio 3.0, the wizard already allows selecting the language. Choose `New ->\
    \ Activity` and the type of activity you want to create. There is a `Source Language`\
    \ drop-down at the end of the screen that you can use to change the language to\
    \ Kotlin.\n\nOur detail activity receives a couple of parameters from the main\
    \ one: the forecast id and the name of the city. The first one is used to request\
    \ the data from the database, and the name of the city fills the toolbar. So we\
    \ first need a couple of names to identify the parameters in the bundle:\n\n```kotlin\n\
    public class DetailActivity : AppCompatActivity() {\n\n    companion object {\n\
    \        const val ID = \"DetailActivity:id\"\n        const val CITY_NAME = \"\
    DetailActivity:cityName\"\n    }\n    ...\n}\n```\n\n`ui/activities/DetailActivity.kt`\n\
    \nIn `onCreate` function, the first step is to set the content view. The UI will\
    \ be really simple, but more than enough for this app example:\n"
  raw: "Kotlin defines ranges for any types that can be compared, but for numerical\
    \ types the compiler optimizes it by converting it to simpler analog code in Java,\
    \ to avoid the extra overhead. The numerical ranges are also iterable, and the\
    \ loops are optimized too by converting them to the same bytecode a `for` with\
    \ indices would use in Java:\n\n```\n1 for (i in 0..10)\n2     println(i)\n```\n\
    \nRanges are incremental by default, so something like:\n\n```\n1 for (i in 10..0)\n\
    2     println(i)\n```\n\nWould do nothing. You can, however, use the function\
    \ `downTo`:\n\n```\n1 for (i in 10 downTo 0)\n2     println(i)\n```\n\nWe can\
    \ define a spacing different from 1 among the values in a range by using `step`:\n\
    \n```\n1 for (i in 1..4 step 2) println(i)\n2 \n3 for (i in 4 downTo 1 step 2)\
    \ println(i)\n```\n\nIf you want to create an open range (which excludes the last\
    \ item), you can use the function `until`:\n\n```\n1 for (i in 0 until 4) println(i)\n\
    ```\n\nThis previous line prints from 0 to 3, but skips the last value. This means\
    \ that `0 until 4 == 0..3`. For iterations over lists, it could be easier to understand\
    \ if we use `for (i in 0 until list.size)` instead of `for (i in 0..list.size\
    \ - 1)`.\n\nAs mentioned before, there are really creative ways to use ranges.\
    \ For instance, an easy way to get the list of `View`s inside a `ViewGroup` would\
    \ be:\n\n```\n1 val views = (0 until viewGroup.childCount).map { viewGroup.getChildAt(it)\
    \ }\n```\n\nThe mix of ranges and functional operators prevents from having to\
    \ use an explicit loop to iterate over the collection and the creation of an explicit\
    \ list where we add the views. You can do everything on a single line.\n\nIf you\
    \ want to know more about how to implement ranges and see more examples and useful\
    \ information, you can go to [Kotlin reference](https://kotlinlang.org/docs/reference/ranges.html).\n\
    \n## 23 Creating a Detail Activity\n\nWhen we click on an item from the home screen,\
    \ we would expect to navigate to a detail activity and see some extra info about\
    \ the forecast for that day. We are currently showing a toast after an item click,\
    \ but it is time to change that.\n\n### 23.1 Preparing the request\n\nAs we need\
    \ to know which item we are going to show in the detail activity, logic tells\
    \ we need to send the *id* of the forecast to the detail. So the domain model\
    \ needs a new *id* property:\n\n```\n1 data class Forecast(val id: Long, val date:\
    \ Long, val description: String, \n2     val high: Int, val low: Int, val iconUrl:\
    \ String)\n```\n\ndomain/model/DomainClasses.kt\n\nThe `ForecastProvider` also\
    \ needs a new function, which returns the requested forecast by id. The `DetailActivity`\
    \ will use it to recover the forecast based on the id it will receive. As all\
    \ the requests always iterate over the sources and return the first non-null result,\
    \ we can extract that behaviour to another function:\n\n```\n1 private fun <T\
    \ : Any> requestToSources(f: (ForecastDataSource) -> T?): T \n2         = sources.firstResult\
    \ { f(it) }\n```\n\ndomain/datasource/ForecastProvider.kt\n\nThe function is generified\
    \ using a non-nullable type. It will receive a function which uses a `ForecastDataSource`\
    \ to return a nullable object of the generic type, and will finally return a non-nullable\
    \ object. We can rewrite the previous request and write the new one this way:\n\
    \n```\n1 fun requestByZipCode(zipCode: Long, days: Int): ForecastList = requestToSources\
    \ {\n2     val res = it.requestForecastByZipCode(zipCode, todayTimeSpan())\n3\
    \     if (res != null && res.size() >= days) res else null\n4 }\n5 \n6 fun requestForecast(id:\
    \ Long): Forecast = requestToSources { \n7     it.requestDayForecast(id) \n8 }\n\
    ```\n\ndomain/datasource/ForecastProvider.kt\n\nNow the data sources need to implement\
    \ the new function:\n\n```\n1 fun requestDayForecast(id: Long): Forecast?\n```\n\
    \ndomain/datasource/ForecastDataSource.kt\n\nThe `ForecastDb` will always have\
    \ the required value already cached from previous requests, so we can get it from\
    \ there this way:\n\n```\n1 override fun requestDayForecast(id: Long): Forecast?\
    \ = forecastDbHelper.use {\n2     val forecast = select(DayForecastTable.NAME).byId(id).\n\
    3             parseOpt { DayForecast(HashMap(it)) }\n4 \n5     if (forecast !=\
    \ null) dataMapper.convertDayToDomain(forecast) else null\n6 }\n```\n\ndata/db/ForecastDb.kt\n\
    \nThe `select` query is very similar to the previous one. I created another utility\
    \ function called `byId`, because a request by *id* is so common that a function\
    \ like that simplifies the process and is easier to read. The implementation of\
    \ the function is quite simple:\n\n```\n1 fun SelectQueryBuilder.byId(id: Long)\
    \ \n2         = whereSimple(\"_id = ?\", id.toString())\n```\n\nextensions/DatabaseExtensions.kt\n\
    \nIt makes use of the `whereSimple` function and implements the search over the\
    \ `_id` field. This function is quite generic, but as you can see, you could create\
    \ as many extension functions as you need based on the structure of your database,\
    \ and hugely simplify the readability of your code. The `DbDataMapper` has some\
    \ slight changes not worth mentioning. You can check them in the repository.\n\
    \nOn the other hand, the `ForecastServer` is never used, because the info is always\
    \ cached in the database. We could implement it to defend our code from uncommon\
    \ edge cases, but we are not doing it in this case, so it will just throw an exception\
    \ if the function is called:\n\n```\n1 override fun requestDayForecast(id: Long)\
    \ \n2         = throw UnsupportedOperationException()\n```\n\ndata/server/ForecastServer.kt\n\
    \nThe last thing we need to be able to perform the request from the new activity\
    \ is to create a command. The code is really simple:\n\n```\n1 class RequestDayForecastCommand(\n\
    2         val id: Long,\n3         private val forecastProvider: ForecastProvider\
    \ = ForecastProvider()) :\n4         Command<Forecast> {\n5 \n6     override fun\
    \ execute() = forecastProvider.requestForecast(id)\n7 }\n```\n\ndomain/commands/RequestDayForecastCommand.kt\n\
    \nThe request returns a `Forecast` result that is used by the activity to draw\
    \ its UI.\n\n### 23.2 Providing a new activity\n\nWe are now prepared to create\
    \ the `DetailActivity`.\n\nIn Android Studio 2.3 and below, you can select the\
    \ package where you want to create the activity, right click and select `New ->\
    \ Kotlin Activity`.\n\nFor Android Studio 3.0, the wizard already allows selecting\
    \ the language. Choose `New -> Activity` and the type of activity you want to\
    \ create. There is a `Source Language` drop-down at the end of the screen that\
    \ you can use to change the language to Kotlin.\n\nOur detail activity receives\
    \ a couple of parameters from the main one: the forecast id and the name of the\
    \ city. The first one is used to request the data from the database, and the name\
    \ of the city fills the toolbar. So we first need a couple of names to identify\
    \ the parameters in the bundle:\n\n```\n1 public class DetailActivity : AppCompatActivity()\
    \ {\n2 \n3     companion object {\n4         const val ID = \"DetailActivity:id\"\
    \n5         const val CITY_NAME = \"DetailActivity:cityName\"\n6     }\n7    \
    \ ...\n8 }\n```\n\nui/activities/DetailActivity.kt\n\nIn `onCreate` function,\
    \ the first step is to set the content view. The UI will be really simple, but\
    \ more than enough for this app example:"
