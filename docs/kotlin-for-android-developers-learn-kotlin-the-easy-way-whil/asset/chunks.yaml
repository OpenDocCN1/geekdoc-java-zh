    \ {\n 2     toolbar.inflateMenu(R.menu.menu_main)\n 3     toolbar.setOnMenuItemClickListener\
    \ {\n 4         when (it.itemId) {\n 5             R.id.action_settings -> App.instance.toast(\"\
    Settings\")\n 6             else -> App.instance.toast(\"Unknown option\")\n 7\
    \         }\n 8         true\n 9     }\n10 }\n```\n\n`ui/activities/ToolbarManager.kt`\n\
    \nWe can also add a function that enables the navigation icon in the toolbar,\
    \ sets an arrow icon and a listener that will be fired when the icon is pressed:\n\
    \n```kotlin\n1 fun enableHomeAsUp(up: () -> Unit) {\n2     toolbar.navigationIcon\
    \ = createUpDrawable()\n3     toolbar.setNavigationOnClickListener { up() }\n\
    4 }\n5 \n6 private fun createUpDrawable() = \n7      DrawerArrowDrawable(toolbar.ctx).apply\
    \ { progress = 1f }\n```\n\n`ui/activities/ToolbarManager.kt`\n\nThe function\
    \ receives the listener, creates the up drawable by using the [DrawerArrowDrawable](https://developer.android.com/reference/android/support/v7/graphics/drawable/DrawerArrowDrawable.html)\
    \ on its final state (when the arrow is already showing) and assigns the listener\
