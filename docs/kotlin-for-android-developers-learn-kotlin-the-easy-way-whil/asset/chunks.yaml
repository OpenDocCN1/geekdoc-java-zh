    \n## 26 Settings Screen\n\nUntil now, we have been using a default city to implement\
    \ the app, but it is time add ability to select another city. The app needs a\
    \ settings section where the user can change the city.\n\nWe are going to stick\
    \ to the zip code to identify the city. A real app would probably need more information\
    \ because a zip code by itself does not identify a city in the whole world. But\
    \ we at least will show a city around the world that uses the zip code we are\
    \ defining in settings. This is a good chance to explain a different way to deal\
    \ with preferences.\n\n### 26.1 Creating the settings activity\n\nA new activity\
    \ will be opened when the settings option is selected in the overflow menu in\
    \ the toolbar. So the first thing we need is a new `SettingsActivity`:\n\n```kotlin\n\
    \ 1 class SettingsActivity : AppCompatActivity() {\n 2 \n 3     override fun onCreate(savedInstanceState:\
    \ Bundle?) {\n 4         super.onCreate(savedInstanceState)\n 5         setContentView(R.layout.activity_settings)\n\
    \ 6         setSupportActionBar(toolbar)\n 7         supportActionBar?.setDisplayHomeAsUpEnabled(true)\n\
    \ 8     }\n 9 \n10     override fun onOptionsItemSelected(item: MenuItem) = when\
    \ (item.itemId) {\n11         android.R.id.home -> { \n12             onBackPressed()\
    \ \n13             true \n14         }\n15         else -> false\n16     }\n17\
    \ }\n```\n\n`ui/activities/SettingsActivity.kt`\n\nWe will save the preference\
    \ when the user gets out of the screen activity, so we are going to deal with\
    \ the `Up` action the same way as the `Back` one, by redirecting the action to\
    \ `onBackPressed`. Now, let’s create the XML layout. A simple `EditText` is enough\
    \ for the preference:\n\n```xml\n 1 <FrameLayout\n 2     xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n 3     android:layout_width=\"match_parent\"\n 4     android:layout_height=\"\
    match_parent\">\n 5 \n 6     <include layout=\"@layout/toolbar\"/>\n 7 \n 8  \
    \   <LinearLayout\n 9         android:orientation=\"vertical\"\n10         android:layout_width=\"\
    match_parent\"\n11         android:layout_height=\"match_parent\"\n12        \
    \ android:layout_marginTop=\"?attr/actionBarSize\"\n13         android:padding=\"\
    @dimen/spacing_xlarge\">\n14 \n15         <TextView\n16             android:layout_width=\"\
    wrap_content\"\n17             android:layout_height=\"wrap_content\"\n18    \
    \         android:text=\"@string/city_zipcode\"/>\n19 \n20         <EditText\n\
    21             android:id=\"@+id/cityCode\"\n22             android:layout_width=\"\
    match_parent\"\n23             android:layout_height=\"wrap_content\"\n24    \
    \         android:hint=\"@string/city_zipcode\"\n25             android:inputType=\"\
    number\"/>\n26 \n27     </LinearLayout>\n28 \n29 </FrameLayout>\n```\n\n`layout/activity_settings.xml`\n\
    \nAnd then declare the activity in the `AndroidManifest.xml`:\n\n```xml\n1 <activity\n\
    2     android:name=\".ui.activities.SettingsActivity\"\n3     android:label=\"\
    @string/settings\"/>\n```\n\n`AndroidManifest.xml`\n\n### 26.2 Accessing Shared\
    \ Preferences\n\nYou probably know what Android [Shared Preferences](http://developer.android.com/training/basics/data-storage/shared-preferences.html)\
    \ are. They consist of a set of keys and values that can be easily saved and restored\
    \ by using the Android framework. These preferences are integrated with some parts\
    \ of the SDK to make some tasks easier. Besides, since Android 6.0 (Marshmallow),\
    \ shared preferences can be automatically cloud-saved, so when a user restores\
    \ the app in a new device, these preferences are automatically recovered too.\n\
    \nThanks to the use of property delegation, we can deal with preferences cleverly.\
    \ We can create a delegate that queries the preference when `get` is called and\
    \ saves it when we call to `set`.\n\nAs we want to save the zip code, which is\
    \ a `Long` value, let’s create a delegate for `Long` properties. In `DelegatesExtensions.kt`,\
    \ implement a new `LongPreference` class:\n\n```kotlin\n 1 class LongPreference(\n\
    \ 2         private val context: Context, \n 3         private val name: String,\
    \ val default: Long) {\n 4 \n 5     private val prefs by lazy {\n 6         context.getSharedPreferences(\"\
    default\", Context.MODE_PRIVATE)\n 7     }\n 8 \n 9     operator fun getValue(thisRef:\
    \ Any?, property: KProperty<*>): Long =\n10         prefs.getLong(name, default)\n\
    11 \n12     operator fun setValue(thisRef: Any?, property: KProperty<*>, value:\
    \ Long) {\n13         prefs.edit().putLong(name, value).apply()\n14     }\n15\
    \ }\n```\n\n`extensions/DelegatesExtensions.kt`\n\nFirst, we create a lazy access.\
    \ We can then define the delegate in the `DelegatesExt` object, so that it is\
    \ easier to access when required:\n\n```kotlin\n1 object DelegatesExt {\n2   \
    \  ....\n3     fun longPreference(context: Context, name: String, default: Long)\
    \ =\n4         LongPreference(context, name, default)\n5 }\n```\n\n`DelegatesExtensions.kt`\n\
    \nIn `SettingsActivity`, we can now define a property to deal with preference.\
    \ I am also creating a couple of constants which keep the name and the default\
    \ value of the property. That way they can be used in other sections of the App.\n\
    \n```kotlin\n1 companion object {\n2     const val ZIP_CODE = \"zipCode\"\n3 \
    \    const val DEFAULT_ZIP = 94043L\n4 }\n5 \n6 private var zipCode: Long \n7\
    \         by DelegatesExt.longPreference(this, ZIP_CODE, DEFAULT_ZIP)\n```\n\n\
    `ui/activities/SettingsActivity.kt`\n\nNow it is easy to work with this preference.\
    \ In `onCreate`, we get the value of the property and assign it to the `EditText`:\n\
    \n```kotlin\n1 override fun onCreate(savedInstanceState: Bundle?) {\n2     ...\n\
    3     cityCode.setText(zipCode.toString())\n4 }\n```\n\n`ui/activities/SettingsActivity.kt`\n\
    \nWe cannot use the self-generated property `text` because `EditText` returns\
    \ an `Editable` in `getText`, so the property defaults to that value. If we try\
    \ to assign a `String`, the compiler will complain. Using `setText()` will be\
    \ enough.\n\nNow we have everything we need to implement `onBackPressed`. Here,\
    \ the new value of the property is saved:\n\n```kotlin\n1 override fun onBackPressed()\
    \ {\n2     super.onBackPressed()\n3     zipCode = cityCode.text.toString().toLong()\n\
    4 }\n```\n\n`ui/activities/SettingsActivity.kt`\n\nThe `MainActivity` requires\
    \ some little changes. First, it also needs a `zipCode` property.\n\n```kotlin\n\
    1 private val zipCode: Long by DelegatesExt.longPreference(this, \n         SettingsActivity.ZIP_CODE,\
    \ SettingsActivity.DEFAULT_ZIP)\n```\n\n`ui/activities/MainActivity.kt`\n\nMoreover,\
    \ I am moving the forecast load to `onResume` so that every time the activity\
    \ is resumed, it refreshes the data, just in case the zip code changed. Of course,\
    \ there are more efficient ways to do this, by checking whether the zip code changed\
    \ before requesting the forecast again, for instance. But I want to keep this\
    \ example simple, and the local database already keeps the requested info, so\
    \ this solution is not that bad:\n"
