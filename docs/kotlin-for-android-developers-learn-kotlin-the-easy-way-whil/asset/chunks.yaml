  trans: "\n因此，如果我们想利用不可变性，我们在 Kotlin 中思考代码的方式会发生一些微变化。核心概念是：尽可能多使用 `val`。在某些情况下（特别是在\
    \ Android 中，某些类的构造函数是由系统调用的），不可变性变得很难实现，但大多数情况下它是可以实现的。\n\n之前提到的另一点是，我们通常可以避免指定对象类型，编译器会从值中推断，这使得代码更整洁，修改也更快。我们在上面的章节中已经有了一些示例。\n\
    \n```\n1 val s = \"Example\" // 一个 String\n2 val i = 23 // 一个 Int\n3 val actionBar\
    \ = supportActionBar // Activity 上下文中的一个 ActionBar\n```\n\n然而，如果我们想使用更通用的类型，则需要指定类型：\n\
    \n```\n1 val a: Any = 23\n2 val c: Context = activity\n```\n\n### 6.3 属性 (Properties)\n\
    \n属性等于 Java 中的字段（fields），但要强大得多。属性实现了字段加上 getter（get 器）和 setter（赋值）。让我们来看一个示例来对比差异。以下代码段显示了\
    \ Java 中安全访问和修改字段所需的代码：\n\n```\n 1 public class Person {\n 2 \n3     private String\
    \ name;\n 4 \n 5     public String getName() {\n 6         return name;\n 7  \
    \   }\n 8 \n 9     public void setName(String name) {\n10         this.name =\
    \ name;\n11     }\n12 }\n13 \n14 ...\n15 \n16 Person person = new Person();\n\
    17 person.setName(\"name\");\n18 String name = person.getName();\n```\n\n在 Kotlin\
    \ 中，你只需要一个属性就能实现相同的行为：\n\n```\n 1 class Person {\n 2     \n 3     var name: String\
    \ = \"\"\n 4         \n 5 }\n 6 \n 7 ...\n 8  9 val person = Person()\n10 person.name\
    \ = \"name\"\n11 val name = person.name\n```\n\n如果没有指定，属性将使用默认的 getter 和 setter。当然，可以它可以运行所需的任何自定义行为，而无需更改现有代码：\n\
    \n```\n1 class Person {\n2 \n3     var name: String = \"\"\n4         get() =\
    \ field.toUpperCase()\n5         set(value) {\n6             field = \"Name: $value\"\
    \n7         }\n8 \n9 }\n```\n\n如果属性在自定义 getter 或 setter 中需要访问其值（如本例所示），则需要创建一个后台字段（backing\
    \ field）。可以使用保留字 `field` 来访问它，当编译器发现需要它时，它会自动创建。请注意，如果我们直接使用属性，我们将使用 setter 和\
    \ getter，而不是进行直接赋值。你只能在属性的访问器内部使用后台字段。\n\n正如在之前的某些章节中提到的，当处理用 Java 编写的代码时，Kotlin\
    \ 允许在 Java 定义了 getter 以及可选的 setter 的地方使用属性语法。编译器只需链接到原始的 getter 和 setter，因此在使用这些映射属性时没有性能开销。\n\
    \n## 7 Anko 和扩展函数 (Extension Functions)\n\nKotlin 团队开发了一些很棒的工具来让 Android 开发变得更容易。在本章中，我将向你介绍它们以及你如何开始使用它们。\n\
    \n### 7.1 什么是 Anko？\n\n[Anko](https://github.com/JetBrains/anko) 是由 JetBrains\
    \ 开发的一个健壮的库。它的主要目的是通过使用代码而不是 XML 来生成 UI 布局。这个功能非常有趣；如果有机会，请尝试一下，但我不会在这个项目中使用它。对我来说（可能由于多年编写用户界面的经验）使用\
    \ XML 更加舒服，但你可能会有不同的想法。\n\n然而，这并不是我们从这个库中可以获得的唯一功能。Anko 包含了许多有用的函数和属性，可以避免大量的样板代码。本书中涵盖了几个示例，但你很快就会看到这个库解决了哪种的问题。\n\
    \n由于 Anko 是一个专门为 Android 编写的库，理解它在背后做了什么是一个很好的练习。你可以随时使用 `ctrl + click`（Windows\
    \ 或 Linux）或 `cmd + click`（Mac） 导航到 Anko 的源码。Anko 的实现是学习如何充分利用 Kotlin 语言有用方法的极佳示例。\n\
    \n### 7.2 开始使用 Anko\n\n在继续之前，让我们使用 Anko 来改进几点。正如你将看到的，每当你使用 Anko 的任何东西时，它都会在文件中包含一个带有该属性或函数名称的导入。Anko\
    \ 使用扩展函数为 Android 框架添加新功能，并且导入会链接到它们。我们将在正下方看到扩展函数是什么以及如何编写它。\n\n在 `MainActivity::onCreate`\
    \ 中，可以使用 Anko 扩展函数代替 `findViewById` 来查找 `RecyclerView`。自 API 26 以来，这不再是必要的，因为\
    \ `findViewById` 现在是泛型的，但它仍然可以作为一个示例：\n\n```\n1 val forecastList: RecyclerView\
    \ = find(R.id.forecast_list) \n```\nactivities/MainActivity.kt\n\n看看导入部分，你会发现\
    \ `find` 函数被添加到了那里：\n\n```\n1 import org.jetbrains.anko.find\n```\n\n这些是我们目前能从库库使用的所有内容，但\
    \ Anko 可以帮助我们简化，包括 Intent 的实例化、Activity 之间的导航、Fragment 的创建、数据库访问或警框的构建。我们将在实现应用时看到。\n\
    \n### 7.3 扩展函数\n\n正如在之前的章节中提到的，当处理 Java 编写的代码时，Kotlin 允许在 Java 定义了 getter 以及可选\
    \ setter 的地方使用属性语法。编译器只需链接到原始的 getter 和 setter，因此在使用这些映射属性时没有性能惩罚。扩展函数是为类添加新行为的函数，即使我们无法访问其源代码。在\
    \ Java 中，我们通常在包含静态方法的工具类中实现它们。在 Kotlin 中使用扩展函数的优势是我们不需要将对象作为参数传递。扩展函数就像是类的一部分，我们可以通过\
    \ `this` 来实现它。\n\n例如，我们可以创建一个 `toast` 函数，它可以被任何 `Context` 以及继承自 `Context` 的类型（如\
    \ Activity 或 Service）使用：\n\n```\n1 fun Context.toast(message: CharSequence, duration:\
    \ Int = Toast.LENGTH_SHORT) {\n2     Toast.makeText(this, message, duration).show()\n\
    3 }\n```\n\n现在你可以在 activity 中使用这个扩展，例如：\n\n```\n1 toast(\"Hello world!\")\n2 toast(\"\
    Hello world!\", Toast.LENGTH_LONG)\n```\n\n当然，Anko 已经包含了自己的自己的扩展函数，与这个非常相似。库提供了针对\
    \ `CharSequence` 和资源的函数，以及针对短长 toast 的不同名称：\n\n```\n1 toast(\"Hello world!\")\n\
    2 longToast(R.string.hello_world)\n```\n\n扩展也可以是属性。因此你可以以非常的方式创建扩展属性。得益于下面的代码，你可以为\
    \ `ViewGroup` 添加一个额外的属性来获取其子视图列表：\n\n```\n1 val ViewGroup.childViews: List<View>\n\
    2     get() = (0 until childCount).map { getChildAt(it) }\n```\n\n先不要太关注实现，因为我们仍然需要涵盖这里的一些概念。扩展函数并没有修改原始类。你可能会发现在使用它的文件中添加了静态导入。你可以在任何地方声明扩展函数，因此常见的做法是创建包含一组相关函数的文件。扩展函数是许多\
    \ Anko 功能背后的魔法。从现在起，你也可以创建自己的魔法了。\n\n本章没有太大变化；[你可以在这里找到源码](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-7)。\n\
    \n"
- fmt: "\nOur current placeholder texts are an excellent place to start getting an\
    \ idea of what we want to achieve, but now it is time to request some real data,\
    \ which will be used to populate the `RecyclerView`. We are going to make use\
    \ of the [OpenWeatherMap](http://openweathermap.org/) API to retrieve data and\
    \ some regular classes for the request. As Kotlin interoperability is extremely\
    \ powerful, you could use any library you want, such as [Retrofit](https://github.com/square/retrofit),\
    \ for server requests. However, as we are just performing a simple API request,\
    \ we can achieve our goal much easier without adding another third-party library.\n\
    \nBesides, as you will see, Kotlin provides some extension functions that will\
    \ make requests much simpler. First, we are going to create a new `Request` class:\n\
    \n```\n1 class Request(private val url: String) {\n2 \n3     fun run() {\n4  \
    \       val forecastJsonStr = URL(url).readText()\n5         Log.d(javaClass.simpleName,\
    \ forecastJsonStr)\n6     }\n7 \n8 }\n```\n\n`data/Request.kt`\n\nThe constructor\
    \ receives a URL. Then the `run` function reads the result and outputs the JSON\
    \ in the Logcat.\n\nThe implementation is straightforward when using `readText`,\
    \ an extension function from the Kotlin standard library. This method is not recommended\
    \ for large responses, but it is good enough in our case.\n\nIf you compare this\
    \ code to the one you would need in Java, you will see that we have saved a considerable\
    \ amount of overhead just by using the standard library. An `HttpURLConnection`,\
    \ a `BufferedReader` and an iteration over the result would have been necessary\
    \ to get the same result, apart from having to manage the status of the connection\
    \ and the reader. Obviously, that is what the function is doing behind the scenes,\
    \ but we have it for free.\n\nIn order to be able to perform the request, the\
    \ app must use the Internet permission. So it must be added to the `AndroidManifest.xml`:\n\
    \n```\n1 <uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
    \n`AndroidManifest.xml`\n\n### 8.2 Performing the request out of the main thread\n\
    \nAs you may know, HTTP requests are not allowed in the main thread, or the app\
    \ will throw an exception. This limitation prevents from blocking the UI thread,\
    \ which is a bad practice. The standard solution for Android is to use an `AsyncTask`.\
    \ However, these classes are ugly and difficult to implement without any side\
    \ effects. `AsyncTask`s are dangerous if not used carefully because by the time\
    \ it reaches `postExecute`, the system could have destroyed the activity, and\
    \ the task will crash.\n\nAnko provides a very easy DSL to deal with asynchrony,\
    \ which fits most basic needs. It provides a `doAsync` function that executes\
    \ its code in another thread, with the option to return to the main thread by\
    \ calling `uiThread`. Executing the request in a secondary thread is as easy as\
    \ this:\n\n```\n1 val url = \"http://api.openweathermap.org/data/2.5/forecast/daily?\"\
    \ +\n                 \"APPID=15646a06818f61f7b8d7823ca833e1ce&zip=94043&mode=json&units=met\\\
    \n3 ric&cnt=7\"\n4 \n5 doAsync() {\n6     Request(url).run()\n7     uiThread {\
    \ longToast(\"Request performed\") }\n8 }\n```\n\n`activities/MainActivity.kt`\n\
    \nYou can [get the url from the repository branch](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-8)\
    \ for this lesson.\n\nA beautiful thing about `uiThread` is that it has a different\
    \ implementation depending on the caller object. When an `Activity` uses it, the\
    \ `uiThread` code is not executed if `activity.isFinishing()` returns `true`,\
    \ and it will not crash if the activity is no longer valid.\n\nYou also can use\
    \ your own executor:\n\n```\n1 val executor = Executors.newScheduledThreadPool(4)\n\
    2 doAsync(executor) {\n3     // Some task\n4 }\n```\n\n`doAsync` returns a java\
    \ `Future`, in case you want to work with futures. If you need it to return a\
    \ `Future` with a result, you can use `doAsyncResult`.\n\nIt is simple and more\
    \ straightforward to read than `AsyncTask`s. For now, I am just sending a static\
    \ URL to the request, to test that we receive the content properly and that we\
    \ receive the content properly.\n\n## 9 Data Classes\n\nData classes are a powerful\
    \ kind of classes that usually provide getters and setters. Defining a data class\
    \ is very easy, along with its fields:\n\n```kotlin\n1 data class Forecast(val\
    \ date: Date, val temperature: Float, val details: String)\n```\n\n### 9.1 Extra\
    \ functions\n\nAlong with a data class, we get a handful of new functions for\
    \ free:\n\n*   `equals()`: it compares both objects.\n*   `hashCode()`: we get\
    \ a hash code.\n*   `copy()`: you can copy an object, modifying one or more properties.\n\
    \n### 9.2 Copying a data class\n\nIf we use immutability, as talked some chapters,\
    \ a new instance is required. For instance, if we need to change the temperature,\
    \ we can just do:\n\n```kotlin\n1 val f1 = Forecast(27.5f, \"Shiny day\")\n2 val\
    \ f2 = f1.copy(temperature = 30f)\n```\n\nThis way, we copy the first forecast\
    \ and modify only the temperature.\n\n### 9.3 Mapping an object into variables\n\
    \nThis process is known as destructuring, and consists of mapping each property\
    \ inside an object into a variable. That is the reason why the `componentX` functions\
    \ are automatically created. An example with the previous `Forecast` class:\n\n\
    ```kotlin\n1 val f1 = Forecast(Date(), 27.5f, \"Shiny day\")\n2 val (date, temperature,\
    \ details) = f1\n```\n\nThis multi-declaration is compiled down to the following\
    \ code:\n\n```kotlin\n1 val date = f1.component1()\n2 val temperature = f1.component2()\n\
    3 val details = f1.component3()\n```\n\nThe logic behind this feature is powerful\
    \ and can help simplify the code in many situations. For instance, `Map` class\
    \ has some extension functions implemented that allow recovering its keys and\
    \ values in an iteration:\n\n```kotlin\n1 for ((key, value) in map) {\n2     Log.d(\"\
    map\", \"key:$key, value:$value\")\n3 }\n```\n\n## 10 Parsing data\n\nNow that\
    \ we know how to create data classes, we are ready to start parsing data. In the\
    \ `data` package, create a new file called `ResponseClasses.kt`. If you open in\
    \ a browser the URL we used in chapter 8, you can see the structure of the JSON\
    \ file. It consists of an object which contains a city, and a list of forecast\
    \ predictions. The city has an id, a name, its coordinates and the country where\
    \ it belongs. Each forecast comes with a good set of information such as the date,\
    \ different temperatures, and a weather object with the description and an id\
    \ for an icon, for instance.\n\n### 10.1 Converting JSON to data classes\n\nIn\
    \ our current UI, we are not going to use all this data. However, we will parse\
    \ everything down to classes, in case it is of some use in the future. These are\
    \ the data classes we need:\n"
  raw: "Our current placeholder texts are an excellent place to start getting an idea\
    \ of what we want to achieve, but now it is time to request some real data, which\
    \ will be used to populate the `RecyclerView`. We are going to make use of the\
    \ [OpenWeatherMap](http://openweathermap.org/) API to retrieve data and some regular\
    \ classes for the request. As Kotlin interoperability is extremely powerful, you\
    \ could use any library you want, such as [Retrofit](https://github.com/square/retrofit),\
    \ for server requests. However, as we are just performing a simple API request,\
    \ we can achieve our goal much easier without adding another third-party library.\n\
    \nBesides, as you will see, Kotlin provides some extension functions that will\
    \ make requests much simpler. First, we are going to create a new `Request` class:\n\
    \n```\n1 class Request(private val url: String) {\n2 \n3     fun run() {\n4  \
    \       val forecastJsonStr = URL(url).readText()\n5         Log.d(javaClass.simpleName,\
    \ forecastJsonStr)\n6     }\n7     \n8 }\n```\n\ndata/Request.kt\n\nThe constructor\
    \ receives a URL. Then the `run` function reads the result and outputs the JSON\
    \ in the Logcat.\n\nThe implementation is straightforward when using `readText`,\
    \ an extension function from the Kotlin standard library. This method is not recommended\
    \ for large responses, but it is good enough in our case.\n\nIf you compare this\
    \ code to the one you would need in Java, you will see that we have saved a considerable\
    \ amount of overhead just by using the standard library. An `HttpURLConnection`,\
    \ a `BufferedReader` and an iteration over the result would have been necessary\
    \ to get the same result, apart from having to manage the status of the connection\
    \ and the reader. Obviously, that is what the function is doing behind the scenes,\
    \ but we have it for free.\n\nIn order to be able to perform the request, the\
    \ app must use the Internet permission. So it must be added to the `AndroidManifest.xml`:\n\
    \n```\n1 <uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
    \nAndroidManifest.xml\n\n### 8.2 Performing the request out of the main thread\n\
    \nAs you may know, HTTP requests are not allowed in the main thread, or the app\
    \ will throw an exception. This limitation prevents from blocking the UI thread,\
    \ which is a bad practice. The standard solution for Android is to use an `AsyncTask`.\
    \ However, these classes are ugly and difficult to implement without any side\
    \ effects. `AsyncTask`s are dangerous if not used carefully because by the time\
    \ it reaches `postExecute`, the system could have destroyed the activity, and\
    \ the task will crash.\n\nAnko provides a very easy DSL to deal with asynchrony,\
    \ which fits most basic needs. It provides a `doAsync` function that executes\
    \ its code in another thread, with the option to return to the main thread by\
    \ calling `uiThread`. Executing the request in a secondary thread is as easy as\
    \ this:\n\n```\n1 val url = \"http://api.openweathermap.org/data/2.5/forecast/daily?\"\
    \ +\n2                 \"APPID=15646a06818f61f7b8d7823ca833e1ce&zip=94043&mode=json&units=met\\\
    \n3 ric&cnt=7\"\n4 \n5 doAsync() {\n6     Request(url).run()\n7     uiThread {\
    \ longToast(\"Request performed\") }\n8 }\n```\n\nactivities/MainActivity.kt\n\
    \nYou can [get the url from the repository branch](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-8)\
    \ for this lesson.\n\nA beautiful thing about `uiThread` is that it has a different\
    \ implementation depending on the caller object. When an `Activity` uses it, the\
    \ `uiThread` code is not executed if `activity.isFinishing()` returns `true`,\
    \ and it will not crash if the activity is no longer valid.\n\nYou also can use\
    \ your own executor:\n\n```\n1 val executor = Executors.newScheduledThreadPool(4)\n\
    2 doAsync(executor) {\n3     // Some task\n4 }\n```\n\n`doAsync` returns a java\
    \ `Future`, in case you want to work with futures. If you need it to return a\
    \ `Future` with a result, you can use `doAsyncResult`.\n\nIt is simple and more\
    \ straightforward to read than `AsyncTask`s. For now, I am just sending a static\
    \ URL to the request, to test that we receive the content properly and that we\
    \ can draw it in the activity. I will cover the JSON parsing and conversion to\
    \ app data classes soon, but before we continue, it is essential to learn what\
    \ a data class is.\n\nYou can run the app and check that you can see the JSON\
    \ in the log and the toast when the request finishes.\n\n## 9 Data Classes\n\n\
    Data classes are a powerful kind of classes that avoid the boilerplate we need\
    \ in Java to create POJO: classes which are used to keep state but are elementary\
    \ in the operations they do. They usually only provide plain getters and setters\
    \ to access to their fields. Defining a new data class is very easy:\n\n```\n\
    1 data class Forecast(val date: Date, val temperature: Float, val details: String)\n\
    ```\n\n### 9.1 Extra functions\n\nAlong with a data class, we get a handful of\
    \ new functions for free, apart from the properties we already talked about (which\
    \ prevent us from writing the accessors):\n\n*   `equals()`: it compares the properties\
    \ from both objects to ensure they are identical.\n\n*   `hashCode()`: we get\
    \ a hash code for free, also calculated from the values of the properties.\n\n\
    *   `copy()`: you can copy an object, modifying the properties you need. We will\
    \ see an example later.\n\n*   A set of numbered functions that are used to map\
    \ an object into variables. I will also explain this soon.\n\n### 9.2 Copying\
    \ a data class\n\nIf we use immutability, as talked some chapters ago, we find\
    \ that if we want to change the state of an object, a new instance of the class\
    \ is required, with one or more of its properties modified. This task can be slightly\
    \ repetitive and far from clean. However, data classes include the `copy()` method,\
    \ which makes the process easy and intuitive.\n\nFor instance, if we need to modify\
    \ the temperature of a `Forecast`, we can just do:\n\n```\n1 val f1 = Forecast(Date(),\
    \ 27.5f, \"Shiny day\")\n2 val f2 = f1.copy(temperature = 30f)\n```\n\nThis way,\
    \ we copy the first forecast and modify only the `temperature` property without\
    \ changing the state of the original object.\n\n### 9.3 Mapping an object into\
    \ variables\n\nThis process is known as **declaration destructuring**, and consists\
    \ of mapping each property inside an object into a variable. That is the reason\
    \ why the `componentX` functions are automatically created. An example with the\
    \ previous `Forecast` class:\n\n```\n1 val f1 = Forecast(Date(), 27.5f, \"Shiny\
    \ day\")\n2 val (date, temperature, details) = f1\n```\n\nThis multi-declaration\
    \ is compiled down to the following code:\n\n```\n1 val date = f1.component1()\n\
    2 val temperature = f1.component2()\n3 val details = f1.component3()\n```\n\n\
    The logic behind this feature is powerful and can help simplify the code in many\
    \ situations. For instance, `Map` class has some extension functions implemented\
    \ that allow recovering its keys and values in an iteration:\n\n```\n1 for ((key,\
    \ value) in map) {\n2     Log.d(\"map\", \"key:$key, value:$value\")\n3 }\n```\n\
    \n## 10 Parsing data\n\nNow that we know how to create data classes, we are ready\
    \ to start parsing data. In the `data` package, create a new file called `ResponseClasses.kt`.\
    \ If you open in a browser the URL we used in chapter 8, you can see the structure\
    \ of the JSON file. It consists of an object which contains a city, and a list\
    \ of forecast predictions. The city has an id, a name, its coordinates and the\
    \ country where it belongs. Each forecast comes with a good set of information\
    \ such as the date, different temperatures, and a weather object with the description\
    \ and an id for an icon, for instance.\n\n### 10.1 Converting JSON to data classes\n\
    \nIn our current UI, we are not going to use all this data. However, we will parse\
    \ everything down to classes, in case it is of some use in the future. These are\
    \ the data classes we need:"
