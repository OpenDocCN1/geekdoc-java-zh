    \n返回指定索引处的元素；如果索引超出此集合的范围，则返回默认函数的执行。\n\n```\n1 assertEquals(20, list.elementAtOrElse(10,\
    \ { 2 * it }))\n```\n\n### elementAtOrNull\n\n返回指定索引处的元素；如果索引超出此集合的范围，则返回 `null`。\n\
    \n```\n1 assertNull(list.elementAtOrNull(10))\n```\n\n### first\n\n返回匹配给定谓词的第一个元素。如果没有找到元素，将抛出\
    \ `NoSuchElementException`。\n\n```\n1 assertEquals(2, list.first { it % 2 == 0\
    \ })\n```\n\n### firstOrNull\n\n返回匹配给定谓词的第一个元素；如果没有找到任何元素，则返回 `null`。\n\n```\n\
    1 assertNull(list.firstOrNull { it % 7 == 0 })\n```\n\n### indexOf\n\n返回元素的第一个索引；如果集合不包含该元素，则返回\
    \ -1。\n\n```\n1 assertEquals(3, list.indexOf(4))\n```\n\n### indexOfFirst\n\n\
    返回匹配给定谓词的第一个元素的索引；如果集合不包含此类元素，则返回 -1。\n\n```\n1 assertEquals(1, list.indexOfFirst\
    \ { it % 2 == 0 })\n```\n\n### indexOfLast\n\n返回匹配给定谓词的最后一个元素的索引；如果集合不包含此类元素，则返回\
    \ -1。\n\n```\n1 assertEquals(5, list.indexOfLast { it % 2 == 0 })\n```\n\n###\
    \ last\n\n返回匹配给定谓词的最后一个元素。如果没有找到元素，将抛出 `NoSuchElementException`。\n\n```\n1 assertEquals(6,\
    \ list.last { it % 2 == 0 })\n```\n\n### lastIndexOf\n\n返回元素的最后一个索引；如果集合不包含该元素，则返回\
    \ -1。\n\n```\n1 val listRepeated = listOf(2, 2, 3, 4, 5, 5, 6)\n2 assertEquals(5,\
    \ listRepeated.lastIndexOf(5))\n```\n\n### lastOrNull\n\n返回匹配给定谓词的最后一个元素；如果没有找到此类元素，则返回\
    \ `null`。\n\n```\n1 val list = listOf(1, 2, 3, 4, 5, 6)\n2 assertNull(list.lastOrNull\
    \ { it % 7 == 0 })\n```\n\n### single\n\n返回匹配给定谓词的唯一元素；如果没有元素或有多个匹配元素，则抛出异常。\n\
    \n```\n1 assertEquals(5, list.single { it % 5 == 0 })\n```\n\n### singleOrNull\n\
    \n返回匹配给定谓词的唯一元素；如果未找到元素或找到了多个元素，则返回 `null`。\n\n```\n1 assertNull(list.singleOrNull\
    \ { it % 7 == 0 })\n```\n\n### 18.5 生成操作\n\n### merge\n\n使用提供的转换函数，根据两个集合中具有相同索引的元素构建一个值列表。该列表的长度为最短集合的长度。\n\
    \n```\n1 val list = listOf(1, 2, 3, 4, 5, 6)\n2 val listRepeated = listOf(2, 2,\
    \ 3, 4, 5, 5, 6)\n3 assertEquals(listOf(3, 4, 6, 8, 10, 11), list.merge(listRepeated)\
    \ { it1, it2 -> \n4         it1 + it2 })\n```\n\n### partition\n\n将原始集合拆分为一对集合，其中第一个集合包含谓词返回\
    \ `true` 的元素，而第二个集合包含谓词返回 `false` 的元素。\n\n```\n1 assertEquals(Pair(listOf(2, 4,\
    \ 6), listOf(1, 3, 5)), \n2         list.partition { it % 2 == 0 })\n```\n\n###\
    \ plus\n\n返回一个包含原始集合所有元素以及给定集合所有元素的列表。由于该函数的名称，我们可以对它使用 `+` 运算符。\n\n```\n1 assertEquals(listOf(1,\
    \ 2, 3, 4, 5, 6, 7, 8), list + listOf(7, 8))\n```\n\n### zip\n\n返回一个由两个集合中相同索引元素构建的对列表。该列表的长度为最短集合的长度。\n\
    \n```\n1 assertEquals(listOf(Pair(1, 7), Pair(2, 8)), list.zip(listOf(7, 8)))\n\
    ```\n\n### unzip\n\n从 `Pair` 列表生成 `List` 的 `Pair`。\n\n```\n1 assertEquals(Pair(listOf(5,\
    \ 6), listOf(7, 8)), listOf(Pair(5, 7), Pair(6, 8)).unzip())\n```\n\n### 18.6\
    \ 排序操作\n\n### reverse\n\n返回一个元素反序的列表。\n\n```\n1 val unsortedList = listOf(3, 2,\
    \ 7, 5)\n2 assertEquals(listOf(5, 7, 2, 3), unsortedList.reverse())\n```\n\n###\
    \ sort\n\n返回一个所有元素排序后的列表。\n\n```\n1 assertEquals(listOf(2, 3, 5, 7), unsortedList.sort())\n\
    ```\n\n### sortBy\n\n返回一个按指定比较器排序的所有元素列表。\n\n```\n1 assertEquals(listOf(3, 7),\
    \ unsortedList.sortBy)\n```\n\n### sortDescending\n\n返回一个按降序排序的所有元素列表。\n\n```\n\
    1 assertEquals(listOf(7, 5), unsortedList.sortDescending())\n```\n\n### sortDescendingBy\n\
    \n返回一个按指定比较器降序排序的所有元素列表。\n\n```\n1 assertEquals(listOf(7, 5), unsortedList.sortDescendingBy)\n\
    ```\n\n### 19. 保存和请求数据\n\n上一章节涵盖了 `SQLiteOpenHelper`，但现在我们需要持久化和恢复数据的方法。\n\n###\
    \ 19.1 创建类\n\n首先，我们将为数据库创建模型类。还记得我们看到的 map 委托吗？先看 `CityForecast`：\n\n```\n1 class\
    \ CityForecast(val map: MutableMap<String, Any>) {\n2     var _id: Long by map\n\
    3     var city: String by map\n4     var country: String by map\n5 \n6     constructor(id:\
    \ Long, city: String, country: String)\n7                 : this(HashMap()) {\n\
    8         this._id = id\n9         this.city = city\n10        this.country =\
    \ country\n11    }\n12 }\n```\n\n默认构造函数获取一个填充了属性值的 map。为了让映射正确工作，属性名称必须与数据库列名相同。我们稍后会说明原因。\n\
    \n此外，第二个构造函数是必要的。因为我们正在将类映射到数据库。因此，与其使用 map，直接从属性中提取值更方便。我们传递一个空 map，但再次得益于委托，当我们为属性赋值时，它会自动向\
    \ map 中添加新值。这样，我们的 map 就准备好添加到数据库中了。\n\n现在我们需要第二个类 `DayForecast`，它对应第二个表。这个类每个列有一个属性，并且使用了辅助构造函数。唯一的区别是我们没有分配\
    \ id，因为 id 是由 SQLite 自动生成的。\n\n```\n1 class DayForecast(var map: MutableMap<String,\
    \ Any?>) {\n2     var _id: Long by map\n3     var date: Long by map\n4     var\
    \ description: String by map\n5     var high: Int by map\n6     var low: Int by\
    \ map\n7     var iconUrl: String by map\n8     var cityId: Long by map\n9 \n10\
    \    constructor(date: Long, description: String, high: Int, low: Int, \n11  \
    \              iconUrl: String, cityId: Long) : this(HashMap()) {\n12        this.date\
    \ = date\n13        this.description = description\n14        this.high = high\n\
    15        this.low = low\n16        this.iconUrl = iconUrl\n17        this.cityId\
    \ = cityId\n18    }\n19 }\n```\n\ndata/db/DbClasses.kt\n\n这些类帮助我们在对象和 SQLite 表之间进行双向数据映射。\n\
    \n"
- fmt: "\nThe `SqliteOpenHelper` is just the tool, the channel between object-oriented\
    \ and SQL worlds. We are using it in a new class, to request data already saved\
    \ in the database, and to save fresh data. The definition of the class is using\
    \ a `ForecastDbHelper` and a `DataMapper` that converts classes from database\
    \ to domain models. I am still using default values as an easy way of dependency\
    \ injection:\n\n```\n1 class ForecastDb(\n2     private val forecastDbHelper:\
    \ ForecastDbHelper = ForecastDbHelper.instance,\n3     private val dataMapper:\
    \ DbDataMapper = DbDataMapper()) {\n4          ...\n5 }\n```\n\n`data/db/ForecastDb.kt`\n\
    \nBoth functions will call `use()`, the function we saw in the previous chapter.\
    \ The value that the lambda returns will be used as the result of our function.\
    \ So let’s define a function that requests a forecast based on a zip code and\
    \ a date:\n\n```\n1 fun requestForecastByZipCode(zipCode: Long, date: Long) =\
    \ forecastDbHelper.use {\n2     ....\n3 }\n```\n\n`data/db/ForecastDb.kt`\n\n\
    Not much to explain here: we return the result of the `use` function as the result\
    \ of our function.\n\n### Requesting a forecast\n\nThe first request that needs\
    \ to be done is the daily forecast, because we need the list to create the city\
    \ object. Anko provides a simple request builder, so let’s take advantage of it:\n\
    \n```\n1 val dailyRequest = \"${DayForecastTable.CITY_ID} = ? \" + \n2     \"\
    AND ${DayForecastTable.DATE} >= ?\"\n3     \n4 val dailyForecast = select(DayForecastTable.NAME)\n\
    5         .whereSimple(dailyRequest, zipCode.toString(), date.toString())\n6 \
    \        .parseList { DayForecast(HashMap(it)) }\n```\n\n`data/db/ForecastDb.kt`\n\
    \nThe first line, `dailyRequest`, is the `where` part of the query. This is the\
    \ first parameter the `whereSimple` function needs, and it is very similar to\
    \ what we would do in regular use of the helper. There is another function called\
    \ simply `where`, which takes some tags and values and match them. I do not find\
    \ it very useful because I think it adds more boilerplate, though it has the advantage\
    \ of parsing the values to the `String`s we need. The following snippet shows\
    \ how it would look with it:\n\n```\n1 val dailyRequest = \"${DayForecastTable.CITY_ID}\
    \ = {id}\" + \n2 \"AND ${DayForecastTable.DATE} >= {date}\"\n3 \n4 val dailyForecast\
    \ = select(DayForecastTable.NAME)\n5         .where(dailyRequest, \"id\" to zipCode,\
    \ \"date\" to date)\n6         .parseList { DayForecast(HashMap(it)) }\n```\n\n\
    `data/db/ForecastDb.kt`\n\nYou can choose your preferred one. The `select` function\
    \ is simple, it just asks for the name of the table. The `parse` methods are where\
    \ the magic happens. In this case, we are using the function `parseList`, which\
    \ assumes we are requesting a list of items. It uses a `RowParser` or `MapRowParser`\
    \ to convert the cursor into a list of object. The difference between both is\
    \ that the `RowParser` relies on the order of the columns, while the `MapRowParser`\
    \ uses the name of the column as the key of the map.\n\nThese two overloads conflict\
    \ between them, so we cannot directly use the simplification that prevents from\
    \ the need of creating an object explicitly. This conflict can be solved by implementing\
    \ an extension function. I am creating a function that receives a lambda and returns\
    \ a `MapRowParser`. The parser will use that lambda to create the object:\n\n\
    ```\n1 fun <T : Any> SelectQueryBuilder.parseList(\n2     parser: (Map<String,\
    \ Any?>) -> T): List<T> =\n3         parseList(object : MapRowParser<T> {\n4 \
    \            override fun parseRow(columns: Map<String, Any?>): T = parser(columns)\n\
    5         })\n```\n\n`extensions/DatabaseExtensions.kt`\n\nIf you do not fully\
    \ understand it yet, you can come back once we dive deep into generics. The previous\
    \ function helps simplify the `parseList` request to:\n\n```\n1 parseList { DayForecast(HashMap(it))\
    \ }\n```\n\nThe immutable map that the parser receives is converted into a mutable\
    \ map (we need it to be mutable in our database model) by using the corresponding\
    \ constructor from the `HashMap`. This `HashMap` is used by the constructor of\
    \ `ForecastDb`.\n\nSo, to understand what is happening behind the scenes, the\
    \ request returns a `Cursor`. `parseList` iterates over it and gets the rows from\
    \ the `Cursor` until it reaches the last one. For each row, it creates a map with\
    \ the columns as keys and assigns the value to the corresponding key. The map\
    \ is then returned to the parser.\n\nIf there are no results for the request,\
    \ `parseList` returns an empty list.\n\nNext step will request the city in a similar\
    \ way:\n\n```\n1 val city = select(CityForecastTable.NAME)\n2         .whereSimple(\"\
    ${CityForecastTable.ID} = ?\", zipCode.toString())\n3         .parseOpt { CityForecast(HashMap(it),\
    \ dailyForecast) }\n```\n\n`data/db/ForecastDb.kt`\n\nThe difference here: we\
    \ are using `parseOpt` instead. This function returns a nullable object. The result\
    \ can be null or a single object, depending on whether the request finds something\
    \ in the database or not. There is another function called `parseSingle`, which\
    \ does essentially the same but returns a non-nullable object. So if it does not\
    \ find a row, it throws an exception. In our case, we use `parseOpt` because the\
    \ city might not exist.\n\n```\n1 fun <T : Any> SelectQueryBuilder.parseOpt(\n\
    2     parser: (Map<String, Any?>) -> T): T? =\n3         parseOpt(object : MapRowParser<T>\
    \ {\n4             override fun parseRow(columns: Map<String, Any?>): T = parser(columns)\n\
    5         })\n```\n\n`extensions/DatabaseExtensions.kt`\n\nFinally, if the returned\
    \ city is not null, we convert it to domain object and return it. Otherwise, we\
    \ just return `null`.\n\n```\n1 if (city != null) dataMapper.convertToDomain(city)\
    \ else null\n```\n\n`data/db/ForecastDb.kt`\n\n`DataMapper` function is easy:\n\
    \n```\n1 fun convertToDomain(forecast: CityForecast) = with(forecast) {\n2   \
    \  val daily = daily.map { convertDayDomain(it) }\n3     ForecastList(_id, city,\
    \ daily)\n4 }\n5\n6 private fun convertDayDomain(dayForecast: DayForecast) = with(dayForecast)\
    \ {\n7     Forecast(date, description, high, low, iconUrl)\n8 }\n```\n\n`data/db/DataMapper.kt`\n\
    \nSo this is how the complete function looks:\n\n```\n1 fun requestForecastByZipCode(zipCode:\
    \ Long, date: Long) = forecastDbHelper.use {\n2 \n3     val dailyRequest = \"\
    ${DayForecastTable.CITY_ID} = ? \" + \n4         \"AND ${DayForecastTable.DATE}\
    \ >= ?\"\n5     val dailyForecast = select(DayForecastTable.NAME)\n6         \
    \    .whereSimple(dailyRequest, zipCode.toString(), date.toString())\n7      \
    \       .parseList { DayForecast(HashMap(it)) }\n8 \n9     val city = select(CityForecastTable.NAME)\n\
    10             .whereSimple(\"${CityForecastTable.ID} = ?\", zipCode.toString())\n\
    11             .parseOpt { CityForecast(HashMap(it), dailyForecast) }\n12 \n13\
    \     if (city != null) dataMapper.convertToDomain(city) else null\n14 }\n```\n\
    \n`data/db/ForecastDb.kt`\n\nAnother interesting functionality from Anko I am\
    \ not showing here is that you can make use of a `classParser()` instead of the\
    \ `MapRowParser` we are using, which uses reflection to fill a class based on\
    \ the names of the columns. I prefer the other way because we do not need reflection\
    \ and have more control over the transformations, but it can be of use for you\
    \ at some point.\n\n### Saving a forecast\n\nThe `saveForecast` function clears\
    \ the data from the database so that we save fresh data, converts the domain forecast\
    \ model to database model, and inserts each daily forecast and the city forecast.\
    \ The structure is similar to the previous one: it returns the value from the\
    \ `use` function from the database helper. In this case, we do not need a result,\
    \ so it will return `Unit`.\n\n```\n1 fun saveForecast(forecast: ForecastList)\
    \ = forecastDbHelper.use {\n2     ...\n3 }\n```\n\n`data/db/ForecastDb.kt`\n"
