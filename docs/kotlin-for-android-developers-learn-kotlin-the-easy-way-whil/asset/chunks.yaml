  trans: "\n我们目前的占位符文本是了解我们想要目标的绝佳起点，但现在是时候请求真实数据了，这将用于填充 `RecyclerView`。我们将利用 [OpenWeatherMap](http://openweathermap.org/)\
    \ API 来获取数据，并使用一些普通类处理请求。由于 Kotlin 互操作非常强大，你可以使用任何需要的库，例如 [Retrofit](https://github.com/square/retrofit)\
    \ 来进行服务器请求。然而，由于我们只是执行一个简单的 API 请求，无需添加另一个第三方库就可以更轻松地实现目标。\n\n此外，正如你所看到的，Kotlin\
    \ 提供了了一些扩展函数，让请求变得简单得多。首先，我们将创建一个新的 `Request` 类：\n\n```\n1 class Request(private\
    \ val url: String) {\n2 \n3     fun run() {\n4         val forecastJsonStr = URL(url).readText()\n\
    5         Log.d(javaClass.simpleName, forecastJsonStr)\n6     }\n7 \n8 }\n```\n\
    \n`data/Request.kt`\n\n构造函数接收一个 URL。然后 `run` 函数读取结果并将 JSON 输出到 Logcat 中。\n\n使用\
    \ `readText`（Kotlin 标准库中的一个扩展函数）时实现非常直观。这种方法不建议用于大型响应，但在我们的情况下已经足够了。\n\n如果你将此代码与\
    \ Java 中需要的代码进行比较，你会发现通过使用标准库我们节省了大量的开销。为了获得相同的结果，需要 `HttpURLConnection`、`BufferedReader`\
    \ 以及对结果进行迭代，此外还需要管理连接和读取器的状态。显然，这就是该函数在后台执行的工作，但我们免费获得了。\n\n为了能够执行请求，App 必须使用\
    \ Internet 权限。因此，必须将其添加到 `AndroidManifest.xml` 中：\n\n```\n1 <uses-permission android:name=\"\
    android.permission.INTERNET\" />\n```\n\n`AndroidManifest.xml`\n\n### 8.2 在主线程之外执行请求\n\
    \n正如你所知的，主线程不允许 HTTP 请求，否则 App 将抛出异常。这种限制防止了阻塞 UI 线程，这是一种坏做法。Android 的标准解决方案是使用\
    \ `AsyncTask`。然而，这些类非常糟糕，而且很难在没有副作用的情况下实现。如果不小心使用 `AsyncTask` 是危险的，因为当到达 `postExecute`\
    \ 时，系统可能已经销了 activity，导致任务崩溃。\n\nAnko 提供了一个非常简单的 DSL 来处理异步操作，符合大多数基本需求。它提供了一个\
    \ `doAsync` 函数，在另一个线程中执行其代码，并可以选择调用 `uiThread` 返回主线程。在辅助线程中执行请求就像这样：\n\n```\n\
    1 val url = \"http://api.openweathermap.org/data/2.5/forecast/daily?\" +\n   \
    \              \"APPID=15646a06818f61f7b8d7823ca833e1ce&zip=94043&mode=json&units=met\\\
    \n3 ric&cnt=7\"\n4 \n5 doAsync() {\n6     Request(url).run()\n7     uiThread {\
    \ longToast(\"Request performed\") }\n8 }\n```\n\n`activities/MainActivity.kt`\n\
    \n你可以从[课程的仓库分支](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-8)\
    \ 获取本课程所需的 url。\n\n`uiThread` 的美妙之处在于它根据调用者对象有不同的实现。当 `Activity` 使用它时，如果 `activity.isFinishing()`\
    \ 返回 `true`，则 `uiThread` 代码将不会执行，如果 activity 不再有效，它也不会崩溃。\n\n你也可以使用自己的执行器：\n\n\
    ```\n1 val executor = Executors.newScheduledThreadPool(4)\n2 doAsync(executor)\
    \ {\n3     // Some task\n4 }\n```\n\n`doAsync` 返回一个 Java `Future`，以防你想处理 future。如果你需要它返回一个带有结果的\
    \ `Future`，可以使用 `doAsyncResult`。\n\n它比 `AsyncTask` 简单且易读。目前，我只是向请求发送了一个静态 URL，以测试我们是否能正确接收内容。\n\
    \n## 9 数据类\n\n数据类是一种功能强大的类，通常提供 getter 和 setter。定义数据类非常简单，连同字段也是：\n\n```kotlin\n\
    1 data class Forecast(val date: Date, val temperature: Float, val details: String)\n\
    ```\n\n### 9.1 额外函数\n\n除了数据类，我们还免费获得了一些新函数：\n\n*   `equals()`：它比较两个对象。\n*   `hashCode()`：我们获得一个哈希码。\n\
    *   `copy()`：你可以复制一个对象并修改一个或多个属性。\n\n### 9.2 复制数据类\n\n如果我们像在某些章节中讨论的那样使用不可变性，则需要一个新的实例。例如，如果我们需要更改温度，只需这样做：\n\
    \n```kotlin\n1 val f1 = Forecast(27.5f, \"Shiny day\")\n2 val f2 = f1.copy(temperature\
    \ = 30f)\n```\n\n通过这样，我们复制了第一个预测并仅修改了温度。\n\n### 9.3 将对象映射到变量\n\n这个过程被称为解构（destructuring），由将对象内部每个属性映射到一个变量组成。这就是为什么会自动创建\
    \ `componentX` 函数。使用之前的 `Forecast` 类的示例：\n\n```kotlin\n1 val f1 = Forecast(Date(),\
    \ 27.5f, \"Shiny day\")\n2 val (date, temperature, details) = f1\n```\n\n这种多声明被编译为以下代码：\n\
    \n```kotlin\n1 val date = f1.component1()\n2 val temperature = f1.component2()\n\
    3 val details = f1.component3()\n```\n\n该功能背后的逻辑非常强大，可以在许多情况下帮助简化代码。例如，`Map` 类实现了一些扩展函数，允许在迭代中恢复其键和值：\n\
    \n```\n1 for ((key, value) in map) {\n2     Log.d(\"map\", \"key:$key, value:$value\"\
    )\n3 }\n```\n\n## 10 解析数据\n\n现在我们已经知道如何创建数据类，已经准备好开始解析数据了。在 `data` 包中，创建一个名为 `ResponseClasses.kt`\
    \ 的新文件。如果你在浏览器中打开我们在第 8 章中使用的 URL，就可以看到 JSON 文件的结构。它由一个包含城市和预测列表的对象组成。城市包含 ID、名称、坐标以及它所属的国家。每个预测都带有一组良好的信息，如日期、不同的温度以及一个包含描述和用于图标的\
    \ ID 的天气对象。\n\n### 10.1 将 JSON 转换为数据类\n\n在我们目前的 UI 中，我们不会使用所有这些数据。然而，我们将所有内容都解析为类，以防将来有用。这些是我们需要的数据类：\n\
    \n"
- fmt: "\n```kotlin\ndata class ForecastResult(val city: City, val list: List<Forecast>)\n\
    data class City(val id: Long, val name: String, val coord: Coordinates,\n    \
    \            val country: String, val population: Int)\ndata class Coordinates(val\
    \ lon: Float, val lat: Float)\ndata class Forecast(val dt: Long, val temp: Temperature,\
    \ val pressure: Float,\n                    val humidity: Int, val weather: List<Weather>,\n\
    \                    val speed: Float, val deg: Int, val clouds: Int,\n      \
    \              val rain: Float)\ndata class Temperature(val day: Float, val min:\
    \ Float, val max: Float,\n                       val night: Float, val eve: Float,\
    \ val morn: Float)\ndata class Weather(val id: Long, val main: String, val description:\
    \ String,\n                   icon: String)\n```\n`data/ResponseClasses.kt`\n\n\
    As we are using [Gson](https://github.com/google/gson) to parse the JSON to our\
    \ classes, the properties must have the same name as the ones in the JSON or specify\
    \ a serialized name. A good practice explained in most software architectures\
    \ is to use different models for the different layers in our app to decouple them\
    \ from each other. So I prefer to simplify the declaration of these classes because\
    \ I will convert them before being used in the rest of the app. The names of the\
    \ properties used in this class are the same as the names in the JSON response.\n\
    \nNow, the `Request` class needs some modifications to return the parsed result.\
    \ It also receives only the `zipcode` of the city instead of the complete URL\
    \ so that it becomes more readable. For now, the static URL is declared in a `companion\
    \ object`.\n\nCheck the resulting code:\n\n```kotlin\nclass ForecastRequest(private\
    \ val zipCode: String) {\n    companion object {\n        private const val APP_ID\
    \ = \"15646a06818f61f7b8d7823ca833e1ce\"\n        private const val URL = \"http://api.openweathermap.org/data/2.5/\"\
    \ +\n                \"forecast/daily?mode=json&units=metric&cnt=7\"\n       \
    \ private const val COMPLETE_URL = \"$URL&APPID=$APP_ID&zip=\"\n    }\n\n    fun\
    \ execute(): ForecastResult {\n        val forecastJsonStr = URL(COMPLETE_URL\
    \ + zipCode).readText()\n        return Gson().fromJson(forecastJsonStr, ForecastResult::class.java)\n\
    \    }\n}\n```\n`data/ForecastRequest.kt`\n\nRemember you need to add the Gson\
    \ library to `build.gradle` dependencies:\n\n```gradle\ncompile \"com.google.code.gson:gson:2.8.1\"\
    \n```\n`app/build.gradle`\n\n### 10.2 Shaping the domain layer\n\nNow let’s create\
    \ a new package representing the `domain` layer. It contains some `Command`s in\
    \ charge of performing the use cases of the app.\n\nFirstly, a definition of a\
    \ `Command` is required. There is a generic declaration in the following example.\
    \ We will talk about this topic in next chapters.\n\n```kotlin\npublic interface\
    \ Command<out T> {\n    fun execute(): T\n}\n```\n`domain/commands/Command.kt`\n\
    \nThese commands execute an operation and return an object of the class specified\
    \ in its generic type. Remember that every function in Kotlin returns a value.\
    \ By default, if nothing is specified, it returns an object of the `Unit` class.\
    \ So if we want our `Command` to return nothing, we can specify `Unit` as its\
    \ type.\n\nInterfaces in Kotlin are more potent than Java (before Java 8) because\
    \ they can contain code. However, for now, we do not need that feature.\n\nThe\
    \ first command needs to request the forecast to the API and convert it to domain\
    \ classes. This is the definition of the domain classes:\n\n```kotlin\ndata class\
    \ ForecastList(val city: String, val country: String, \n                     \
    \   val dailyForecast:List<Forecast>)\n\ndata class Forecast(val date: String,\
    \ val description: String, val high: Int, \n                    val low: Int)\n\
    ```\n`domain/model/DomainClasses.kt`\n\nThese classes will probably need to be\
    \ reviewed in the future when we add more features. For now, the data they keep\
    \ is enough.\n\nClasses must be mapped from the data to the domain model, so the\
    \ next task will be to create a `DataMapper`:\n\n```kotlin\nclass ForecastDataMapper\
    \ {\n    fun convertFromDataModel(forecast: ForecastResult): ForecastList =\n\
    \        ForecastList(forecast.city.name, forecast.city.country, \n          \
    \  convertForecastListToDomain(forecast.list))\n\n    private fun convertForecastListToDomain(list:\
    \ List<Forecast>)\n            : List<ModelForecast> {\n        return list.mapIndexed\
    \ { i, forecast ->\n            val dt = Calendar.getInstance().timeInMillis +\
    \ \n                TimeUnit.DAYS.toMillis(i.toLong())\n            convertForecastItemToDomain(forecast.copy(dt\
    \ = dt)) \n        }\n    }\n\n    private fun convertForecastItemToDomain(forecast:\
    \ Forecast): ModelForecast {\n        // Implementation details\n    }\n\n   \
    \ private fun convertDate(date: Long): String {\n        val df = DateFormat.getDateInstance(DateFormat.MEDIUM,\
    \ Locale.getDefault())\n        return df.format(date)\n    }\n}\n```\n`domain/mappers/ForecastDataMapper.kt`\n\
    \n### 10.3 Drawing the data in the UI\n\n`MainActivity` code changes a little,\
    \ because now we have real data to fill the adapter. The asynchronous call needs\
    \ to be rewritten:\n\n```kotlin\ndoAsync() {\n    val result = RequestForecastCommand(\"\
    94043\").execute()\n    uiThread {\n        forecastList.adapter = ForecastListAdapter(result)\n\
    \    }\n}\n```\n`ui/activities/MainActivity.kt`\n\nThe adapter requires some modifications\
    \ too:\n\n```kotlin\nclass ForecastListAdapter(private val weekForecast: ForecastList)\
    \ : \n        RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n\n   \
    \ override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder\
    \ {\n        return ViewHolder(TextView(parent.getContext()))\n    }\n\n    override\
    \ fun onBindViewHolder(holder: ViewHolder, position: Int) {\n        with(weekForecast.dailyForecast[position])\
    \ {\n            holder.textView.text = \"$date - $description - $high/$low\"\n\
    \        }\n    }\n\n    override fun getItemCount(): Int = weekForecast.dailyForecast.size\n\
    \n    class ViewHolder(val textView: TextView) : RecyclerView.ViewHolder(textView)\n\
    }\n```\n"
