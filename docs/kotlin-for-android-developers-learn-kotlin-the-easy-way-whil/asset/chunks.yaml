  raw: "You have two options to overcome this situation:\n\n*   Use the `open` reserved\
    \ word, which would allow Mockito to mock your class, but also any other class\
    \ to extend this one (which was probably closed for a reason).\n\n*   Extract\
    \ an interface, and mock the interface. This one is a cleaner solution, but also\
    \ slightly redundant if you are not using that interface for anything else.\n\n\
    There is, however, a third alternative: an experimental feature in Mockito 2\\\
    . This feature allows you to mock final classes and avoid those extra artifacts.\
    \ It might be that by the time you read these lines, the feature is not experimental\
    \ anymore. But if it still is, you need to add an extra library to opt in for\
    \ the feature:\n\n```\n1 testImplementation \"org.mockito:mockito-inline:$mockito_version\"\
    \n```\n\napp/build.gradle\n\nEven if it is experimental, it works pretty well,\
    \ so feel safe to use it.\n\nNow you can rerun your test, and see how it magically\
    \ passes.\n\n### 28.3 Instrumentation tests\n\nInstrumentation tests are a bit\
    \ different. They are typically used to test UI interactions, where we need an\
    \ Application instance to be running by the time the tests are executed. To do\
    \ this, we need to deploy the app and run the tests on a device.\n\nThis type\
    \ of tests reside in the `androidTest` folder, and we must change ‘Test Artifact’\
    \ to ‘Android Instrumentation Tests’ in ‘Build Variants’ panel on old Android\
    \ Studio versions. The official library to implement instrumentation tests is\
    \ [Espresso](https://google.github.io/android-testing-support-library/), which\
    \ helps us easily navigate through our App by writing `Action`s, and filter and\
    \ check results using `ViewMatcher`s and `Matcher`s.\n\nThe configuration is a\
    \ bit harder than the previous one. We need a bunch of extra libraries and Gradle\
    \ configuration. The good thing is that Kotlin does not add any extra overhead,\
    \ so if you already know how to configure Espresso, it should be easy for you.\n\
    \nFirst, specify the test runner in `defaultConfig`:\n\n```\n1 defaultConfig {\n\
    2     ...\n3     testInstrumentationRunner \"android.support.test.runner.AndroidJUnitRunner\"\
    \n4 }\n```\n\napp/build.gradle\n\nOnce you have configured the runner, it is time\
    \ to add the rest of the dependencies, this time using `androidTestImplementation`.\
    \ That way, these libraries are only added when we compile to run the instrumentation\
    \ tests:\n\n```\n1 buildscript {\n2     ...\n3     ext.test_support_version =\
    \ '1.0.1'\n4     ext.espresso_version = '3.0.1'\n5 }\n```\n\nbuild.gradle\n\n\
    ```\n 1 dependencies {\n 2     ...\n 3     androidTestImplementation \"com.android.support:support-annotations:$support_versi\\\
    \n 4 on\"\n 5     androidTestImplementation \"com.android.support.test:runner:$test_support_version\"\
    \n 6     androidTestImplementation \"com.android.support.test:rules:$test_support_version\"\
    \n 7     androidTestImplementation \"com.android.support.test.espresso:espresso-core:$espre\\\
    \n 8 sso_version\"\n 9     androidTestImplementation(\"com.android.support.test.espresso:espresso-contrib:$es\\\
    \n10 presso_version\") {\n11         exclude group: 'com.android.support', module:\
    \ 'appcompat-v7'\n12         exclude group: 'com.android.support', module: 'support-v4'\n\
    13         exclude group: 'com.android.support', module: 'design'\n14        \
    \ exclude group: 'com.android.support', module: 'recyclerview-v7'\n15 }\n```\n\
    \napp/build.gradle\n\nI do not want to spend much time talking about this, but\
    \ here it is a brief explanation of why you need these libraries:\n\n*   `runner`:\
    \ It is the test runner, the one we specified in `defaultConfig`.\n\n*   `rules`:\
    \ Includes some rules that help tests inflate and launch the activities. We will\
    \ use a rule in our examples.\n\n*   `espresso-core`: the basic features of Espresso,\
    \ the library that makes instrument tests easier.\n\n*   `espresso-contrib`: it\
    \ adds some extra features, such as `RecyclerView` testing support. We have to\
    \ exclude some of its dependencies, because we already have them in the project,\
    \ and tests crash otherwise.\n\nLet’s now create a simple example. The test will\
    \ click on the first row of the forecast list, and check that it can find a view\
    \ with the id `R.id.weatherDescription`. This view is in the `DetailActivity`,\
    \ which implies that we successfully navigated to the detail after clicking on\
    \ a view inside the `RecyclerView`.\n\n```\n1 class SimpleInstrumentationTest\
    \ {\n2 \n3     @get:Rule\n4     val activityRule = ActivityTestRule(MainActivity::class.java)\n\
    5 \n6     ...\n7 }\n```\n\nWe need to create an activity rule, which instantiates\
    \ the activity that the test will use. In Java, you would annotate the field using\
    \ `@Rule`. However, as you know, fields and properties are not the same, so if\
    \ you use just that, the execution will fail because the access to the field inside\
    \ the property is not public. What you need to do is to annotate the getter. Kotlin\
    \ allows doing that by specifying `get` or `set` before the name of the rule.\
    \ In this case, write `@get:Rule`.\n\nAfter that, we are ready to create our first\
    \ test:\n\n```\n1 @Test fun itemClickNavigatesToDetail() {\n2     onView(withId(R.id.forecastList)).perform(\n\
    3             RecyclerViewActions\n4                 .actionOnItemAtPosition<RecyclerView.ViewHolder>(0,\
    \ click()))\n5     onView(withId(R.id.weatherDescription))\n6            .check(matches(isAssignableFrom(TextView::class.java)))\n\
    7 }\n```\n\nAs these tests run on a device, we cannot use the same naming format\
    \ we used for unit tests. Otherwise, it will crash.\n\nThe function is annotated\
    \ with `@Test`, the same way we did with unit tests. We can start using Espresso\
    \ in the body of the test. It first performs a click over the first position of\
    \ the recycler. Then, it checks that it can find a view with a specific id and\
    \ that it is an instance of `TextView`.\n\nTo run the test, you can do the same\
    \ you did for unit tests: right click on the `java` folder below `androidTest`,\
    \ and choose ‘Run All Tests’. Now, in ‘Target device’, choose the target you prefer.\
    \ Click ‘OK’ and then run. You should see how the app starts on your device, and\
    \ the test clicks on the first position, opens the detail activity and closes\
    \ the App again.\n\nNow we are going to do a more difficult one. The test will\
    \ open the overflow from the `Toolbar`, click on `Settings` action, change the\
    \ city code and check that the `Toolbar` title has changed to the corresponding\
    \ one.\n\n```\n1 @Test fun modifyZipCodeChangesToolbarTitle() {\n2     openActionBarOverflowOrOptionsMenu(activityRule.activity)\n\
    3     onView(withText(R.string.settings)).perform(click())\n4     onView(withId(R.id.cityCode)).perform(replaceText(\"\
    94301\"))\n5     pressBack()\n6     onView(isAssignableFrom(Toolbar::class.java))\n\
    7             .check(matches(\n8                 withToolbarTitle(`is`(\"Palo\
    \ Alto (US)\"))))\n9 }\n```\n\nWhat the test exactly does is:\n\n*   It first\
    \ opens the overflow by using `openActionBarOverflowOrOptionsMenu`.\n\n*   It\
    \ then finds a view with the `Settings` text and performs a click on it.\n\n*\
    \   After that, the settings activity opens, so it looks for the `EditText` and\
    \ replaces the old city code with a new one.\n\n*   It presses the back button,\
    \ which saves the new value in the preferences, and closes the activity.\n\n*\
    \   As `onResume` is executed in `MainActivity`, the request is performed again.\
    \ This retrieves the forecast of the new city.\n\n*   The last line checks the\
    \ `Toolbar` title and sees whether it matches with the proper value.\n\nThere\
    \ is not a default matcher to check `Toolbar` title, but Espresso is easy to extend,\
    \ so we can create a new matcher which implements the check:"
