  trans: "\nKotlin 为任何可比较类型定义了范围（ranges），但对于数值类型，编译器通过将其转换为 Java 中更简单的模拟代码来优化，以避免额外的开销。数值范围也是可迭代的，循环也会被优化，转换为与\
    \ Java 中使用的带索引的 `for` 循环相同的相同的字节码：\n\n```\nfor (i in 0..10)\n    println(i)\n\
    ```\n\n范围默认是递增的，所以像：\n\n```\nfor (i in 10..0)\n    println(i)\n```\n\n这样的将什么都不做。不过，你可以使用\
    \ `downTo` 函数：\n\n```\nfor (i in 10 downTo 0)\n    println(i)\n```\n\n我们可以通过 `step`\
    \ 在范围的值之间定义不同于 1 的间距：\n\n```\nfor (i in 1..4 step 2) println(i)\n\nfor (i in 4\
    \ downTo 1 step 2) println(i)\n```\n\n如果你想创建一个开区间范围（排除最后一个元素），可以使用 `until` 函数：\n\
    \n```\nfor (i in 0 until 4) println(i)\n```\n\n上一行代码打印从 0 到 3，但跳过了最后一个值。这意味着 `0\
    \ until 4 == 0..3`。对于列表的迭代，使用 `for (i in 0 until list.size)` 而不是 `for (i in 0..list.size\
    \ - 1)` 可能会更容易理解。\n\n如前所述，使用范围有非常有创意的方法。例如，获取 `ViewGroup` 内部所有 `View` 列表的一种简便方法是：\n\
    \n```\nval views = (0 until viewGroup.childCount).map { viewGroup.getChildAt(it)\
    \ }\n```\n\n范围和函数式操作符的结合避免了必须使用显式循环来遍历集合，也避免了创建一个用于添加视图的显式列表。你可以在单行内完成所有操作。\n\n\
    如果你想了解更多关于如何实现范围的知识，并查看更多示例和有用信息，可以访问 [Kotlin 参考文档](https://kotlinlang.org/docs/reference/ranges.html)。\n\
    \n# 23 创建详情 Activity (Detail Activity)\n\n当我们点击主屏幕上的某个项时，我们期望导航到详情 Activity 并看到关于该天气预报的额外信息。目前我们在点击项后只显示一个\
    \ toast，但是时候改变这一点了。\n\n## 23.1 准备请求\n\n由于我们需要知道要在详情 Activity 中显示哪一个项，逻辑告诉我们需要将预报的\
    \ `id` 发送到详情页。因此，领域模型需要一个新的 `id` 属性：\n\n```\ndata class Forecast(val id: Long,\
    \ val date: Long, val description: String, \n    val high: Int, val low: Int,\
    \ val iconUrl: String)\n```\n\n`domain/model/DomainClasses.kt`\n\n`ForecastProvider`\
    \ 还需要一个新函数，通过 id 返回请求的预报。`DetailActivity` 将使用它根据接收到的 id 恢复预报。由于所有请求总是遍历源并返回第一个非空结果，我们可以将该行为提取到另一个函数：\n\
    \n```\nprivate fun <T : Any> requestToSources(f: (ForecastDataSource) -> T?):\
    \ T \n        = sources.firstResult { f(it) }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\
    \n该函数使用非空类型进行泛型处理。它将接收一个函数，该函数使用 `ForecastDataSource` 返回一个泛型的可空对象，并最终返回一个非空对象。我们可以这样重写之前的请求并编写新的请求：\n\
    \n```\nfun requestByZipCode(zipCode: Long, days: Int): ForecastList = requestToSources\
    \ {\n    val res = it.requestForecastByZipCode(zipCode, todayTimeSpan())\n   \
    \ if (res != null && res.size() >= days) res else null\n}\n\nfun requestForecast(id:\
    \ Long): Forecast = requestToSources { \n    it.requestDayForecast(id) \n}\n```\n\
    \n`domain/datasource/ForecastProvider.kt`\n\n现在数据源需要实现这个新函数：\n\n```\nfun requestDayForecast(id:\
    \ Long): Forecast?\n```\n\n`domain/datasource/ForecastDataSource.kt`\n\n`ForecastDb`\
    \ 将始终从之前的请求中缓存了所需的值，因此我们可以这种方式从那里获取：\n\n```\noverride fun requestDayForecast(id:\
    \ Long): Forecast? = forecastDbHelper.use {\n    val forecast = select(DayForecastTable.NAME).byId(id).\n\
    \            parseOpt { DayForecast(HashMap(it)) }\n\n    if (forecast != null)\
    \ dataMapper.convertDayToDomain(forecast) else null\n}\n```\n\n`data/db/ForecastDb.kt`\n\
    \n```\n\n`select` 查询与之前的非常相似。我创建了另一个工具函数 `byId`，因为通过 `id` 查询非常常见，一个这样的函数可以简化过程并更易读。该函数的实现非常简单：\n\
    \n```\nfun SelectQueryBuilder.byId(id: Long) \n        = whereSimple(\"_id = ?\"\
    , id.toString())\n```\n\n`extensions/DatabaseExtensions.kt`\n\n它使用了 `whereSimple`\
    \ 函数并实现了对 `_id` 字段的搜索。这个函数是非常通用的，但如你所见，你可以根据数据库的结构创建任意需要的扩展函数，并极大简化代码的可读性。`DbMapper`\
    \ 有一些细微的变化，此处未提及。你可以在仓库中检查它们。\n\n另一方面，`ForecastServer` 从未被使用，因为信息始终缓存在数据库中。我们可以实现它来保护代码免受边缘情况的影响，但在本例中没有这样做，所以它只会抛出异常：\n\
    \n```\noverride fun requestDayForecast(id: Long) \n        = UnsupportedOperationException()\n\
    ```\n\n`data/server/ForecastServer.kt`\n\n我们需要完成的最后一件事是从新 activity 执行请求，即创建一个命令。代码非常简单：\n\
    \n```\nclass RequestForecastCommand(\n        val id: Long,\n        private val\
    \ forecastProvider: ForecastProvider = ForecastProvider()) :\n        Command<Forecast>\
    \ {\n\n    override fun execute() = forecastProvider.requestForecast(id)\n}\n\
    ```\n\n`domain/commands/RequestForecastCommand.kt`\n\n请求返回一个 `Forecast` 结果，activity\
    \ 使用它来绘制 UI。\n\n## 23.2 提供一个新的 activity\n\n我们现在准备好创建 `DetailActivity` 了。\n\n在\
    \ Android Studio 2.3 及以下版本中，你可以选择创建 activity 的包，右键并选择 `New -> Kotlin Activity`。\n\
    \n对于 Android Studio 3.0，向导已经允许选择语言。选择 `New -> Activity` 和你想创建的 activity 类型。屏幕底部有一个\
    \ `Source Language` 下菜单，可以使用它切换语言为 Kotlin。\n\n我们的详情 activity 从主 activity 接收两个参数：预报\
    \ id 和城市名称。第一个用于从数据库请求数据，城市名称用于填充工具栏。因此，我们首先需要两个名称来标识 bundle 中的参数：\n\n```kotlin\n\
    public class DetailActivity : AppCompatActivity() {\n\n    companion object {\n\
    \        const val ID = \"DetailActivity:id\"\n        const val CITY_NAME = \"\
    DetailActivity:cityName\"\n    }\n    ...\n}\n```\n\n`ui/activities/DetailActivity.kt`\n\
    \n在 `onCreate` 函数中，第一步是设置内容视图。UI 将非常简单，但对于这个应用示例来说足够了：\n\n"
- fmt: "\n```xml\n<LinearLayout\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"match_parent\"\n    android:orientation=\"\
    vertical\"\n    android:paddingBottom=\"@dimen/activity_vertical_margin\"\n  \
    \  android:paddingLeft=\"@dimen/activity_horizontal_margin\"\n    android:paddingRight=\"\
    @dimen/activity_horizontal_margin\"\n    android:paddingTop=\"@dimen/activity_vertical_margin\"\
    >\n\n    <LinearLayout\n        android:layout_width=\"match_parent\"\n      \
    \  android:layout_height=\"wrap_content\"\n        android:orientation=\"horizontal\"\
    \n        android:gravity=\"center_vertical\"\n        tools:ignore=\"UseCompoundDrawables\"\
    >\n\n        <ImageView\n            android:id=\"@+id/icon\"\n            android:layout_width=\"\
    64dp\"\n            android:layout_height=\"64dp\"\n            tools:src=\"@mipmap/ic_launcher\"\
    \n            tools:ignore=\"ContentDescription\"/>\n\n        <TextView\n   \
    \         android:id=\"@+id/weatherDescription\"\n            android:layout_width=\"\
    wrap_content\"\n            android:layout_height=\"wrap_content\"\n         \
    \   android:layout_margin=\"@dimen/spacing_xlarge\"\n            android:textAppearance=\"\
    @style/TextAppearance.AppCompat.Display1\"\n            tools:text=\"Few clouds\"\
    />\n\n    </LinearLayout>\n\n    <LinearLayout\n        android:layout_width=\"\
    match_parent\"\n        android:layout_height=\"wrap_content\">\n\n        <TextView\n\
    \            android:id=\"@+id/maxTemperature\"\n            android:layout_width=\"\
    0dp\"\n            android:layout_height=\"wrap_content\"\n            android:layout_weight=\"\
    1\"\n            android:layout_margin=\"@dimen/spacing_xlarge\"\n           \
    \ android:gravity=\"center_horizontal\"\n            android:textAppearance=\"\
    @style/TextAppearance.AppCompat.Display3\"\n            tools:text=\"30\"/>\n\n\
    \        <TextView\n            android:id=\"@+id/minTemperature\"\n         \
    \   android:layout_width=\"0dp\"\n            android:layout_height=\"wrap_content\"\
    \n            android:layout_weight=\"1\"\n            android:layout_margin=\"\
    @dimen/spacing_xlarge\"\n            android:gravity=\"center_horizontal\"\n \
    \           android:textAppearance=\"@style/TextAppearance.AppCompat.Display3\"\
    \n            tools:text=\"10\"/>\n\n    </LinearLayout>\n\n</LinearLayout>\n\
    ```\n\n`layout/activity_detail.xml`\n\nThen assign it from `onCreate` code. Use\
    \ the city name to fill the toolbar title. The methods for `intent` and `title`\
    \ are automatically mapped to a property:\n\n```\nsetContentView(R.layout.activity_detail)\n\
    title = intent.getStringExtra(CITY_NAME)\n```\n\n`ui/activities/DetailActivity.kt`\n\
    \nThe other part in `onCreate` implements the call to the command. It is very\
    \ similar to the call we previously did:\n\n```\ndoAsync {\n    val result = RequestDayForecastCommand(intent.getLongExtra(ID,\
    \ -1)).execute()\n    uiThread { bindForecast(result) }\n}\n```\n\n`ui/activities/DetailActivity.kt`\n\
    \nWhen the result is recovered from the database, the `bindForecast` function\
    \ is called in the UI thread. I am using Kotlin Android Extensions plugin again\
    \ in this activity, to get the properties from the XML without using `findViewById`:\n\
    \n```\nimport kotlinx.android.synthetic.main.activity_detail.*\n\n...\n\nprivate\
    \ fun bindForecast(forecast: Forecast) = with(forecast) {\n    Picasso.with(ctx).load(iconUrl).into(icon)\n\
    \    supportActionBar?.subtitle = date.toDateString(DateFormat.FULL)\n    weatherDescription.text\
    \ = description\n    bindWeather(high to maxTemperature, low to minTemperature)\n\
    }\n```\n\n`ui/activities/DetailActivity.kt`\n\nThere are some interesting things\
    \ here. For instance, I am creating another extension function able to convert\
    \ a `Long` object into a visual date string. Remember we were using it in the\
    \ adapter too, so it is a good moment to extract it into a function:\n\n```\n\
    fun Long.toDateString(dateFormat: Int = DateFormat.MEDIUM): String {\n    val\
    \ df = DateFormat.getDateInstance(dateFormat, Locale.getDefault())\n    return\
    \ df.format(this)\n}\n```\n\n`extensions/ExtensionUtils.kt`\n\nIt gets a date\
