    \nThe `private` modifier is the most restrictive we can use. It indicates it is\
    \ visible in its file. So if we declare a class as `private`, we are not able\
    \ to use it outside the file where it was defined.\n\nOn the other hand, if we\
    \ use `private` inside a class, the access is restricted to that class. Even classes\
    \ that extend it cannot use it.\n\nSo first level classes, objects, interfaces…\
    \ (known as package members) declared as `private` are only visible inside the\
    \ file where they are declared, while everything defined inside a class or interface\
    \ is only visible by that class or interface.\n\n#### protected\n\nThis modifier\
    \ only applies to members of a class or an interface. A package member cannot\
    \ be `protected`. Inside a member, it works the same way as in Java: it can be\
    \ used by the member itself and the members that extend it (for instance, a class\
    \ and its subclasses).\n\n#### internal\n\nAn internal member is visible inside\
    \ the whole module if it is a package member. If it is a member of another scope,\
    \ it depends on the visibility of the scope. For instance, if we write a private\
    \ class, the access to an `internal` function is limited to the visibility of\
    \ the class.\n\nWe can use internal classes from any other class in the same module,\
    \ but not from another module.\n\n#### public\n\nAs you may guess, this is the\
    \ less restrictive modifier. ** It is the default modifier**, and a member declared\
    \ as `public` is visible anywhere, only restricted by its scope. A public member\
    \ defined in a private class will not be visible outside the scope where the class\
    \ is visible.\n\n### 14.2 Constructors\n\nBy default, all constructors are `public`,\
    \ which means they can be used from any scope where their class is visible. If\
    \ we want to restrict the visibility of a constructor, we can apply modifiers\
    \ to it with this specific syntax:\n\n```\n1 class C private constructor(a: Int)\
    \ { ... }\n```\n\n### 14.3 Reviewing our code\n\nWe already made use of the `public`\
    \ default modifier, and latest versions of the Kotlin plugin also detect when\
    \ an argument can be private. For instance, in `RequestForecastCommand`, we made\
    \ the `zipCode` property private.\n\n```\n1 class RequestForecastCommand(private\
    \ val zipCode: String)\n```\n\nBesides, in Kotlin we do not need to specify the\
    \ return type of a function if the compiler can infer it. An example of how we\
    \ can get rid of the returning types:\n\n```\n1 data class ForecastList(...) {\n\
    2     operator fun get(position: Int) = dailyForecast[position]\n3 }\n```\n\n\
    The typical situations where we can get rid of the return type are when we assign\
    \ the value to a function or a property using `equals` (=) instead of writing\
    \ a code block.\n\nThe rest of the modifications are pretty straightforward. You\
    \ can review them [in the repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-14).\n\
    \n## 15 Kotlin Android Extensions\n\n**Kotlin Android Extensions** is another\
    \ plugin that the Kotlin team has developed to make Android development simpler.\
    \ The plugin automatically creates a set of properties that give direct access\
    \ to all the views in the XML. This way we do not need to explicitly find all\
    \ the views in the layout before starting using them.\n\nThe names of the properties\
    \ are taken from the ids of the views, so we must be careful when choosing those\
    \ names because they now become a relevant part of our base code. The plugin also\
    \ infers the type of these properties from the XML, so there is no need to do\
    \ any extra castings.\n\nKotlin Android Extensions is that it does not require\
    \ adding libraries to our project. The plugin generates the code it needs to work\
    \ only when it is required.\n\nHow does it work under the hood? These properties\
    \ delegate to functions that request the view, and a caching function that prevents\
    \ from doing a `findViewById` every time a property is used. Be aware that this\
    \ caching mechanism only works if the receiver is an Activity or a Fragment. It\
    \ skips the cache if it is inside an extension function because the plugin is\
    \ not able to add the necessary code.\n\n### 15.1 How to use Kotlin Android Extensions\n\
    \nLet’s see how easy it is. Though the plugin is part of the regular one (it does\
    \ not require to install a new one), if you want to use it you have to add an\
    \ extra *apply* in the Android module:\n\n```\n1 apply plugin: 'com.android.application'\n\
    2 apply plugin: 'kotlin-android'\n3 apply plugin: 'kotlin-android-extensions'\n\
    ```\n\napp/build.gradle\n\nIf you remember, we already did that at the beginning\
    \ of the book.\n\n#### Recovering views from the XML\n\nFrom this moment, recovering\
    \ a view is as easy as **using the view id you defined in the XML directly into\
    \ your activity.** Imagine you have an XML like this one:\n\n```\n 1 <FrameLayout\n\
    \ 2     xmlns:android=\"http://schemas.android.com/apk/res/android\"\n 3     android:layout_width=\"\
    match_parent\"\n 4     android:layout_height=\"match_parent\">\n 5 \n 6     <TextView\n\
    \ 7         android:id=\"@+id/welcomeMessage\"\n 8         android:layout_width=\"\
    wrap_content\"\n 9         android:layout_height=\"wrap_content\"\n10        \
    \ android:layout_gravity=\"center\"\n11         android:text=\"Hello World!\"\
    />\n12 \n13 </FrameLayout>\n```\n\nAs you can see, the `TextView` has `welcomeMessage`\
    \ id. In the `MainActivity` you now could write:\n\n```\n1 override fun onCreate(savedInstanceState:\
    \ Bundle?) {\n2     super.onCreate(savedInstanceState)\n3     setContentView(R.layout.activity_main)\n\
    4 \n5     welcomeMessage.text = \"Hello Kotlin!\"\n6 }\n```"
