    \ it) }\n3     CityForecast(id, city, country, daily)\n4 }\n5 \n6 private fun\
    \ convertDayFromDomain(cityId: Long, forecast: Forecast) = \n7     with(forecast)\
    \ {\n8         DayForecast(date, description, high, low, iconUrl, cityId)\n9 }\n\
    ```\n\n`data/db/DbDataMapper.kt`\n\n在块内部，我们可以直接使用 `dailyForecast` 和 `map` 而无需引用变量，就像在类内部一样。我们使用了另一个\
    \ Anko 函数进行插入，它需要一个表名和一个 `Pair<String, Any>` 的 `vararg` 参数。该函数会将 `vararg` 转换为\
    \ Android SDK 所需的 `ContentValues` 对象。因此，我们的任务是将 `map` 转换为 `vararg` 数组。我们为 `Map`\
    \ 创建了另一个扩展函数来实现这一点：\n\n```\n1 fun <K, V : Any> MutableMap<K, V?>.toVarargArray():\
    \ \n2     Array<out Pair<K, V>> =  map({ Pair(it.key, it.value!!) }).toTypedArray()\n\
    ```\n\n`extensions/CollectionExtensions.kt`\n\n它作用于带有可空值的 `Map`（这是 map 代理的一个条件），并将其转换为带有非空值对数组的\
    \ `Array`（`select` 函数的要求）。另一个复杂的点你现在不需要理解，我很快会讲解空值处理。\n\n所以，有了这个新函数，我们可以这样做：\n\
    \n```\n1 insert(CityForecastTable.NAME, *map.toVarargArray())\n```\n\n`data/db/ForecastDb.kt`\n\
    \n它在 `CityForecast` 表中插入一条新行。在 `toVarargArray` 结果之前使用的 `*` 表示数组被解构为 `vararg` 参数。这在\
    \ Java 中是自动完成的，但在 Kotlin 中我们需要显式指定。\n\n对于每个每日预报也是如此：\n\n```\n1 dailyForecast.forEach\
    \ { insert(DayForecastTable.NAME, *it.map.toVarargArray()) }\n```\n\n`data/db/ForecastDb.kt`\n\
    \n因此，通过使用 map，我们能够轻松地将类转换为数据库记录，反之亦然。一旦准备好了这些扩展函数，我们就可以将它们用于其他项目，所以这种投入是非常的。\n\
    \n该函数的完整代码：\n\n```\n 1 fun saveForecast(forecast: ForecastList) = forecastDbHelper.use\
    \ {\n 2 \n 3     clear(CityForecastTable.NAME)\n 4     clear(DayForecastTable.NAME)\n\
    \ 5 \n 6     with(dataMapper.convertFromDomain(forecast)) {\n 7         insert(CityForecastTable.NAME,\
    \ *map.toVarargArray())\n 8         dailyForecast forEach { \n 9             insert(DayForecastTable.NAME,\
    \ *it.map.toVarargArray()) \n10         }\n11     }\n12 }\n```\n\n`data/db/ForecastDb.kt`\n\
    \n本章涉及许多新代码，你可以查看[仓库](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-19)\
    \ 进行回顾。\n\n# Kotlin 中的空安全\n\n对于来自 Java 7 的开发者来说，空安全是 Kotlin 最令人兴奋的特性之一。然而，正如你在书中看到的，它是如此隐式，以至于在上一章之前，我们几乎不需要担心它。\n\
    \n`null` 被其创建者认为是[价值十的错误](https://en.wikipedia.org/wiki/Tony_Hoare)，事实是，我们有时需要定义一个变量是否包含值。在\
    \ Java 中，尽管如今注解和集成开发环境（IDE）提供了很大帮助，我们仍然可以编写类似下面的代码：\n\n```\n1 Forecast forecast\
    \ = null;\n2 forecast.toString();\n```\n\n这段代码可以正确编译（你可能会收到 IDE 的警告），当它运行时，它自然会抛出\
    \ `NullPointerException`。这是不安全的，即使你认为可以控制一切，随着代码的增长，你将开始失去对那些可能为 null 的对象的追踪。我们最终会导致大量的\
    \ `NullPointerException` 或大量的空值检查（可能是两者的兼顾）。\n\n## 20.1 空类型如何工作\n\n大多数现代语言都以某种方式解决了这个问题。Kotlin\
    \ 与 Swift 等其他类似语言一样使用了可空类型。在 Java 中，我们仍然可以做类似这样的操作：\n\n```\n1 Forecast forecast\
    \ = null;\n2 forecast.toString();\n```\n（注：后续重复内容已根据指令要求删除，保留核心逻辑）\n"
- fmt: "\nOk, so the previous explanation works perfectly well with Kotlin code. But\
    \ what happens with Java libraries in general, and Android SDK in particular?\
    \ In Java, every object can be null by definition. So we would have to deal with\
    \ a lot potentially null variables which in real life are never null. This means\
    \ our code could end up with hundreds of `!!` operators, which is not a good idea\
    \ at all.\n\nWhen you are dealing with the Android SDK, you will probably see\
    \ that some arguments are marked with a single `!` when a Java method is used.\
    \ For instance, something that gets an `Object` in Java is represented as `Any!`\
    \ in Kotlin. This special operator represents that it is up to the developer to\
    \ decide whether that variable should be null or not.\n\nLuckily, latest versions\
    \ of the Android framework and the support library are starting using the `@Nullable`\
    \ and `@NonNull` annotations to identify the parameters that can be null or the\
    \ functions that can return null, and the Kotlin compiler can detect that and\
    \ choose the appropriate translation into Kotlin language.\n\nSaid that, if we\
    \ are for instance overriding `onCreate` for an `Activity`, we need to mark `savedInstanceState`\
    \ as nullable:\n\n```\n1 override fun onCreate(savedInstanceState: Bundle?) {\n\
    2 }\n```\n\nOtherwise it will show an error. We cannot use this implementation:\n\
    \n```\n1 override fun onCreate(savedInstanceState: Bundle) {\n2 }\n```\n\nThis\
    \ is great because an activity can receive a null bundle, and we get the right\
    \ implementation for free. However, there are parts of the SDK that are missing\
    \ annotations yet. So when in doubt, you can just use a nullable object and deal\
    \ with the possible `null`. Remember, if you use `!!` it is because you are sure\
    \ that the object cannot be null, so you can declare it as non-nullable directly.\n\
    \n## 21 Creating the business logic to data access\n\nAfter implementing the access\
    \ to the server and a way to interact with the database, it is time to put things\
    \ together. The logical steps would be:\n\n1. Request the required data from the\
    \ database\n2. Check if there is data for the corresponding week\n3. If it finds\
    \ the required data, it is returned so that the UI can render it\n4. Otherwise,\
    \ it requests the data to the server\n5. The result is saved in the database and\
    \ returned so that the UI can render it\n\nOur commands should not need to deal\
    \ with all this logic. The source of the data is an implementation detail that\
    \ could easily require a logic modification, so adding some extra code that abstracts\
    \ the commands from the access to the data sounds like a good idea. In our implementation,\
    \ it will iterate over a list of sources until it finds a proper result.\n\nSo\
    \ let’s start by specifying the interface any data source that wants to be used\
    \ by our provider should implement:\n\n```\n1 interface ForecastDataSource {\n\
    2     fun requestForecastByZipCode(zipCode: Long, date: Long): ForecastList?\n\
    3 }\n```\n\nThe provider requires a function that receives a zip code and a date,\
    \ and it should return a weekly forecast from that day.\n\n```\n1 class ForecastProvider(private\
    \ val sources: List<ForecastDataSource> =\n2         ForecastProvider.SOURCES)\
    \ {\n3 \n4     companion object {\n5         const val DAY_IN_MILLIS = 1000 *\
    \ 60 * 60 * 24\n6         val SOURCES = listOf(ForecastDb(), ForecastServer())\n\
    7     }\n8 ...\n9 }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\nThe forecast\
    \ provider receives a list of sources, that once again can be specified through\
    \ the constructor (for test purposes for instance), but I am defaulting it to\
    \ a `SOURCES` list defined in the companion object. It will use a database source\
    \ and a server source. The order is essential, because it will iterate over the\
    \ sources, and the search will be stopped when any of the sources returns a valid\
    \ result. The logical order is to search first locally (in the database) and then\
    \ through the API.\n\nSo the main method looks like this:\n\n```\n1 fun requestByZipCode(zipCode:\
    \ Long, days: Int): ForecastList\n2             = sources.firstResult { requestSource(it,\
    \ days, zipCode) }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\nIt gets\
    \ the first result that is not `null`. When searching through the list of functional\
    \ operators explained in chapter 18, I could not find one that did exactly what\
    \ I was looking for. So, as we have access to Kotlin sources, I just copied `first`\
    \ function and modified it to behave as expected:\n\n```\n1 inline fun <T, R :\
    \ Any> Iterable<T>.firstResult(predicate: (T) -> R?): R {\n2     for (element\
    \ in this) {\n3         val result = predicate(element)\n4         if (result\
    \ != null) return result\n5     }\n6     throw NoSuchElementException(\"No element\
    \ matching predicate was found.\")\n7 }\n```\n\n`extensions/CollectionsExtensions.kt`\n\
    \nThe function receives a predicate which gets an object of type `T` and returns\
    \ a value of type `R?`. The generic type specifies that the predicate can return\
    \ null, but our `firstResult` function cannot. That is the reason why it returns\
    \ a value of type `R`.\n\nHow does it work? It iterates and executes the predicate\
    \ over the elements in the `Iterable` collection. When the result of the predicate\
    \ is not null, this result is returned.\n\nIf we wanted to include the case where\
    \ all the sources can return `null`, we could have derived from `firstOrNull`\
    \ function instead. The difference would consist of returning `null` instead of\
    \ throwing an exception in the last line. But I am not dealing with those details\
    \ in this code.\n\nIn our example `T = ForecastDataSource` and `R = ForecastList`.\
    \ But remember the function specified in `ForecastDataSource` returned `ForecastList?`,\
    \ which equals `R?`, so everything matches. The function `requestSource` makes\
    \ the previous function more readable:\n\n```\n1 fun requestSource(source: ForecastDataSource,\
    \ days: Int,\n2         zipCode: Long): ForecastList? {\n3     val res = source.requestForecastByZipCode(zipCode,\
    \ todayTimeSpan())\n4     return if (res != null && res.size >= days) res else\
    \ null\n5 }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\nThe request is\
    \ executed and only returns a value if the result is not null and the number of\
    \ days matches the parameter. Otherwise, the source does not have up-to-date data\
    \ to return a successful result.\n\nThe function `todayTimeSpan()` calculates\
    \ the time in milliseconds for the current day, eliminating the “time” offset,\
    \ and keeping only the day. Some of the sources (in our case the database) may\
    \ need it. The server defaults to today unless we specify it, so it will be ignored\
    \ there.\n\n```\n1 private fun todayTimeSpan() = System.currentTimeMillis() /\n\
    2     DAY_IN_MILLIS * DAY_IN_MILLIS\n```\n\n`domain/datasource/ForecastProvider.kt`\n\
    \nThe complete code of this class would be:\n\n```\n1 class ForecastProvider(private\
    \ val sources: List<ForecastDataSource> = \n2         ForecastProvider.SOURCES)\
    \ {\n3 \n4     companion object {\n5         const val DAY_IN_MILLIS = 1000 *\
    \ 60 * 60 * 24;\n6         val SOURCES = listOf(ForecastDb(), ForecastServer())\n\
    7     }\n8 \n9     fun requestByZipCode(zipCode: Long, days: Int): ForecastList\n\
    10             = sources.firstResult { requestSource(it, days, zipCode) }\n11\
    \ \n12     private fun requestSource(source: ForecastDataSource, days: Int, \n\
    13             zipCode: Long): ForecastList? {\n14         val res = source.requestForecastByZipCode(zipCode,\
    \ todayTimeSpan())\n15         return if (res != null && res.size >= days) res\
    \ else null\n16     }\n17 \n18     private fun todayTimeSpan() = System.currentTimeMillis()\
    \ / \n19             DAY_IN_MILLIS * DAY_IN_MILLIS\n20 }\n```\n\n`domain/datasource/ForecastProvider.kt`\n\
    \nWe already defined `ForecastDb`. It just now needs to implement `ForecastDataSource`.\n"
