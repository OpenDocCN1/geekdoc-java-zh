    Error\");\n3 View v = AndroidUtils.inflate(parent, R.layout.view_item, false);\n\
    ```\n\n### 30.4 Instance and static fields\n\nIn Java, we use fields to store\
    \ the state. They can be instance fields, which means that each object can store\
    \ a different value, or static (all instances of a class share them). If we try\
    \ to find an equivalent of this in Kotlin, it would be properties and companion\
    \ objects. If we have a class like this:\n\n```\n 1 class App : Application()\
    \ {\n 2 \n 3     val appHelper = AppHelper()\n 4 \n 5     companion object {\n\
    \ 6         lateinit var instance: App\n 7     }\n 8 \n 9     override fun onCreate()\
    \ {\n10         super.onCreate()\n11         instance = this\n12     }\n13 \n\
    14 }\n```\n\nHow does this work in Java? You can simply access the companion object\
    \ properties as static fields, by using `getters` and `setters`:\n\n```\n1 AppHelper\
    \ helper = App.instance.getAppHelper();\n```\n\nAs a `val`, it only generates\
    \ the `getter` in Java. If it were `var`, we would also have a `setter`. The access\
    \ to `instance` has worked automatically because it uses the `lateinit` annotation,\
    \ which also exposes the field that Kotlin uses to store the state. But imagine\
    \ we create a constant:\n\n```\n1 companion object {\n2     lateinit var instance:\
    \ App\n3     val CONSTANT = 27\n4 }\n```\n\nYou find that you cannot use it directly.\
    \ You are forced to access through a `Companion` internal class:\n\n```\n1 KotlinClass.Companion.getCONSTANT()\n\
    ```\n\nThis previous snippet does not look particularly readable. To expose the\
    \ field in Java the same way a static field would look, you need a new annotation:\n\
    \n```\n1 @JvmField val CONSTANT = 27\n```\n\nAnd now you can use it from Java\
    \ code:\n\n```\n1 int c = App.CONSTANT;\n```\n\nIf you have functions in a companion\
    \ object, they are converted to static methods using the `@JvmStatic` annotation.\
    \ There are several ways to define constants that, when we use Kotlin from Java,\
    \ generate different bytecode. If you remember, we used `const val` before, and\
    \ those properties are accessible without using a `getter`.\n\n### 30.5 Data classes\n\
    \nSome features are clear, but some others are more difficult to know how they\
    \ may behave in Java. So let’s take a look at those features that Kotlin has,\
    \ but Java does not. One example is *data classes*. Let’s say we have a data class\
    \ like this:\n\n```\n1 data class MediaItem(val id: Int, val title: String, val\
    \ url: String)\n```\n\nWe can create instances of this class:\n\n```\n1 MediaItem\
