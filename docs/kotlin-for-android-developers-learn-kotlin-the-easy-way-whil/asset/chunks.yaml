    \ ForecastServer(\n    private val dataMapper: ServerDataMapper = ServerDataMapper(),\n\
    \    private val forecastDb: ForecastDb = ForecastDb()) \n    : ForecastDataSource\
    \ {\n\n    override fun requestForecastByZipCode(zipCode: Long, date: Long): \n\
