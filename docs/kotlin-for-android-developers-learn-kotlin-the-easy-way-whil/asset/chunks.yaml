    \n## 27 初次接触协程\n\n协程是 Kotlin 1.1 中引入的最重要特性。它们之所以很棒，是因为它们非常强大，而且社区仍在探索如何充分利用它们的特性。\n\
    \n简单来说，协程是一种以顺序方式编写异步代码的方法。与其在回调函数中挣扎，你可以一个接一个地编写代码。其中某些代码可以挂起执行并等待结果可用。\n\n如果你曾是\
    \ C# 开发者，`async/await` 是最接近的概念。然而，Kotlin 中的协程更强大，因为它们不是某个想法的具体实现，而是一项语言特性，开发者可以用不同的方式实现它解决特定问题。\n\
    \n你可以编写自己的解决方案，或者使用 Kotlin 团队和其他独立开发者构建的多个选项之一。\n\n你需要理解，协程是 Kotlin 1.1 中的一个实验性特性。Kotlin\
    \ 团队将此类别用于他们想要尽早发布但在未来可能会更改的功能。在协程的情况下，他们计划支持当前的 API，但你可能希望迁移到新定义。正如我们稍后看到的，你需要手动开启此功能。否则，当你使用它时，IDE\
    \ 会显示警告。\n\n但也意味着，你应该将本章作为你可以所做事情的示例，而不是准则。事情在未来几个月内可能会变化。\n\n### 27.1 理解协程的工作原理\n\
    \n我在这里的目标是让你掌握一些基本概念并使用现有的库之一，而不是构建你自己的实现。但我认为了解内部原理是很重要的，这样你才不会盲目地使用提供的内容。\n\n\
    协程基于“挂起函数”（`suspending functions`）的概念：这种函数在被调用时可以停止执行，并在完成后台任务后继续运行。\n\n挂起函数用保留关键字\
    \ `suspend` 标记，并且只能在其他挂起函数或协程内部调用。\n\n因此，你不能在任何地方调用挂起函数。需要一个周围函数来构建协程并提供所需的上下文。类似于这样：\n\
    \n```kotlin\n1 fun <T> async(block: suspend () -> T)\n```\n\n我不会解释如何实现上面的函数。这是一个复杂的过程，超出了本书的范围，而且对于大多数情况，已经有为你实现的解决方案了。如果你对构建自己的感兴趣，可以阅读[coroutines\
    \ Github](https://github.com/Kotlin/kotlin-coroutines/blob/master/kotlin-coroutines-informal.md)\
    \ 中编写的规范。你需要知道的是，函数可以有任何你想给它的的名字，并且它至少有一个挂起块作为参数。\n\n然后你可以实现一个挂起函数并在该块内部调用它：\n\
    \n```kotlin\n1 suspend fun mySuspendingFun(x: Int) : Result {\n2     ...\n3 }\n\
    4 \n5 async { \n6     val res = mySuspendingFun(20)\n7     print(res)\n8 }\n```\n\
    \n那么协程是线程吗？不完全是。它们的工作原理相似，但要轻量高效得多。你可以在几个线程上运行数百万个协程，这开启了无限可能。\n\n你有三种方法可以使用协程特性：\n\
    \n- 原始实现：这意味着构建你自己的使用协程的方法。这非常复杂，通常完全不需要。\n- 低级实现：Kotlin 提供了一组可以在 [kotlinx.coroutines](https://github.com/Kotlin/kotlinx-coroutines)\
    \ 仓库中找到的库，它解决了一些最困难的部分，并为不同的场景提供了特定的实现。例如，[针对 Android 的](https://github.com/Kotlin/kotlinx-coroutines/tree/master/ui/kotlinx-coroutines-android)。\n\
    \n"
- fmt: "\n- Higher-level implementations: if you want to have a solution that provides\
    \ everything you need to start using coroutines right away, there are several\
    \ libraries out there that do all the hard work for you, and the list keeps growing.\
    \ I am going to stick to Anko, which provides a solution that works well on Android,\
    \ and you are already familiar with the library.\n\n## 27.2 Using Anko for coroutines\n\
    \nSince 0.10 version, `Anko` provides a couple of ways to use coroutines in Android.\n\
    \nThe first one is very similar to what we saw in the example above, and also\
    \ similar to what other libraries do.\n\nFirst, you need to create an `async`\
    \ block where suspension functions can run:\n\n```\n1 async(UI) {\n2     ...\n\
    3 }\n```\n\nThe `UI` argument is the execution context for the `async` block.\n\
    \nThen you can create blocks that are executed in a background thread and return\
    \ the result to the UI thread. Those blocks are defined using the `bg` function:\n\
    \n```\n1 async(UI) {\n2     val r1: Deferred<Result> = bg { fetchResult1() }\n\
    3     val r2: Deferred<Result> = bg { fetchResult2() }\n4     updateUI(r1.await(),\
    \ r2.await())\n5 }\n```\n\n`bg` returns a `Deferred` object, which suspends the\
    \ coroutine when the function `await()` is called, just until it returns the result.\
    \ We will see this option in the example below.\n\nAs you know, as Kotlin compiler\
    \ can infer the type of the variables, this could be simpler:\n\n```\n1 async(UI)\
    \ {\n2     val r1 = bg { fetchResult1() }\n3     val r2 = bg { fetchResult2()\
    \ }\n4     updateUI(r1.await(), r2.await())\n5 }\n```\n\nThe second alternative\
    \ is to make use of the integration with listeners that is provided on specific\
    \ sub-libraries, depending on which listener you are going to use. For instance,\
    \ on `anko-sdk15-coroutines`, there exists an `onClick` listener whose lambda\
    \ is indeed a coroutine. So you can start using suspending functions right away\
    \ inside the listener block:\n\n```\n1 textView.onClick {\n2     val r1 = bg {\
    \ fetchResult1() }\n3     val r2 = bg { fetchResult2() }\n4     updateUI(r1.await(),\
    \ r2.await())\n5 }\n```\n\nAs you can see, the result is very similar to the previous\
    \ one. You are just saving some code.\n\nTo use it, you will need to add some\
    \ of these dependencies, depending on the listeners you want to use:\n\n```\n\
    1 compile \"org.jetbrains.anko:anko-sdk15-coroutines:$anko_version\"\n2 compile\
    \ \"org.jetbrains.anko:anko-appcompat-v7-coroutines:$anko_version\"\n3 compile\
    \ \"org.jetbrains.anko:anko-design-coroutines:$anko_version\"\n```\n\n## 27.3\
    \ Using coroutines in our example\n\nOur current example does not have many complex\
    \ requests, and there is not much value in using coroutines instead of `doAsync`,\
    \ but I want to show you how to configure your project to start using them. It\
    \ is pretty straightforward.\n\nFirst, add the dependency to the `build.gradle`:\n\
    \n```\n1 compile \"org.jetbrains.anko:anko-coroutines:$anko_version\"\n```\napp/build.gradle\n\
    \nNext, if you remember, I told you that you need to opt in for the feature. Otherwise,\
    \ it will show a warning. To do that, simply add to the module `build.gradle`:\n\
    \n```\n1 kotlin {\n2     experimental {\n3         coroutines \"enable\"\n4  \
    \   }\n5 }\n```\napp/build.gradle\n\nNow you are ready to start using coroutines.\
    \ Let’s go first to the detail activity.\n\nYou can change this code:\n\n```\n\
    1 doAsync {\n2     val result = RequestDayForecastCommand(intent.getLongExtra(ID,\
    \ -1)).execute()\n3     uiThread { bindForecast(result) }\n4 }\n```\n\nwith this\
    \ one:\n\n```\n1 async(UI) {\n2     val result = bg { RequestDayForecastCommand(intent.getLongExtra(ID,\
    \ -1))\n3         .execute() }\n4     bindForecast(result.await())\n5 }\n```\n\
    ui/activities/DetailActivity.kt\n\nThe forecast is requested in a background thread\
    \ thanks to the `bg` function, which returns a deferred result. That result is\
    \ awaited in the `bindForecast` call until it is ready to be returned.\n\nThough\
    \ there is a problem here. Coroutines have a problem: they are keeping a reference\
    \ to `DetailActivity`, leaking it if the request never finishes for instance.\n\
    \nNo worries, because Anko has a solution. You can create a weak reference to\
    \ your activity, and use that one instead:\n\n```\n1 val ref = asReference()\n\
    2 val id = intent.getLongExtra(ID, -1)\n3 \n4 async(UI) {\n5     val result =\
    \ bg { RequestDayForecastCommand(id).execute() }\n6     ref().bindForecast(result.await())\n\
    7 }\n```\n\nThis reference allows calling the activity when it is available and\
    \ cancels the coroutine in case the activity has been killed. Be careful to ensure\
    \ that all calls to activity methods or properties are done via this `ref` object.\n\
    \nBut this can get a little complicated if the coroutine interacts several times\
    \ with the activity. In `MainActivity`, for instance, this solution becomes a\
    \ little more convoluted:\n\n```\n 1 private fun loadForecast() {\n 2 \n 3   \
    \  val ref = asReference()\n 4     val id = intent.getLongExtra(ID, -1)\n 5 \n\
    \ 6     async(UI) {\n 7         val result = bg { RequestDayForecastCommand(id).execute()\
    \ }\n 8         ref().bindForecast(result.await())\n 9     }\n10 }\n```\nMainActivity.kt\
    \ \n\n## 28 Testing your App\n\nWe are reaching the end of this trip. You already\
    \ learned most Kotlin features throughout this book, but you are probably wondering\
    \ if you can test your Android Apps using Kotlin. The answer is: of course!\n\n\
    In Android, we have a couple of different tests: unit and instrumentation tests.\
    \ This book is not meant to teach you how to write tests; there are entire books\
    \ dedicated to that matter. My goal in this chapter is to explain how to prepare\
    \ your environment to be able to write some tests and show you that Kotlin also\
    \ works fine.\n\n### 28.1 Unit testing\n\nI will not get into discussions about\
    \ what unit testing means. There are many definitions out there with some slight\
    \ differences. A general idea could be that unit tests are the tests that validate\
    \ an individual unit of source code. What a ‘unit’ involves is left to the reader.\
    \ For the sake of simplicity, I am defining a unit test as a test that does not\
    \ need a device to run. The IDE can run the tests and show a result that identifies\
    \ which tests succeeded and which ones failed.\n\nUnit testing is usually done\
    \ using the `JUnit` library. So let’s add the dependency to the `build.gradle`.\
    \ As this dependency is only used when running tests, we can use `testImplementation`\
    \ instead of `implementation`. This way, the library is left out for regular compilations,\
    \ reducing the size of the APK:\n\n```\n1 dependencies {\n2     ...\n3     testImplementation\
    \ \"junit:junit:4.12\"\n4 }\n```\napp/build.gradle\n"
