    \n## 22. Flow control and ranges\n\nI have been using some conditional expressions\
    \ in our code, so you are not new to some of the concepts of this chapter. But\
    \ now it is time to explain them in more depth. Though in Kotlin we usually need\
    \ fewer mechanisms to control the flow of the code that we would typically use\
    \ in an entirely procedural programming language (some of them even practically\
    \ disappear), they are still useful. There are also new powerful ideas that solve\
    \ some particular problems much easier.\n\n### 22.1 If Expression\n\nAlmost everything\
    \ in Kotlin is an expression, which means it returns a value. `If` conditions\
    \ are not an exception, so though we can use `if` as we are used to doing:\n\n\
    ```\nif (x > 0) {\n    toast(\"x is greater than 0\")\n} else if (x == 0) {\n\
    \    toast(\"x equals 0\")\n} else {\n    toast(\"x is smaller than 0\")\n}\n\
    ```\n\nWe can also assign its result to a variable. We have used it like that\
    \ several times in our code:\n\n```\nval res = if (x != null && x.size() >= days)\
    \ x else null\n```\n\nThis also implies that we do not need a ternary operation\
    \ similar to the Java one because we can solve it easily with:\n\n```\nval z =\
    \ if (condition) x else y\n```\n\nSo the `if` expression always returns a value.\
