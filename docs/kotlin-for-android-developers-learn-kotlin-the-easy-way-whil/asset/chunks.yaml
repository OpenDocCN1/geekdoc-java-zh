    \nWith these changes, we should be ready to start.\n\n### 3.5 Test that everything\
    \ works\n\nWe are going to add some code to check that Kotlin Android Extensions\
    \ are fully functional. I am not explaining much about it yet, but I want to be\
    \ sure this is working for you.\n\nFirst, go to `activity_main.xml` and set an\
    \ id for the `TextView`:\n\n```\n1 <TextView\n2     android:id=\"@+id/message\"\
    \n3     android:text=\"@string/hello_world\"\n4     android:layout_width=\"wrap_content\"\
    \n5     android:layout_height=\"wrap_content\"/>\n```\n\nactivity_main.xml\n\n\
    At `onCreate`, try to write the id you previously chose (`message` in this example)\
    \ for the `TextView`:\n\n```\n1 override fun onCreate(savedInstanceState: Bundle?)\
    \ {\n2     super.onCreate(savedInstanceState)\n3     setContentView(R.layout.activity_main)\n\
    4     message.text = \"Hello Kotlin!\"\n5 }\n```\n\nMainActivity.kt\n\nDo you\
    \ see the magic? You could access the view without finding it or using third-party\
    \ libraries. *Kotlin Android Extensions* is a plugin that comes included in the\
    \ main Kotlin one, and that is its primary purpose. Be patient; I shall show you\
    \ how to use it properly soon.\n\nYou will also see that a synthetic import was\
    \ added automatically to the activity, but we are not covering it yet:\n\n```\n\
    1 import kotlinx.android.synthetic.main.activity_main.*\n```\n\nMainActivity.kt\n\
    \nThanks to Kotlin interoperability with Java, we can use setters and getters\
    \ methods from Java libraries as a property in Kotlin. We will talk about properties\
    \ later too, but just notice that we can use `message.text` instead of `message.setText`\
    \ for free. The compiler uses the real Java methods, so there is no performance\
    \ overhead when using it.\n\nNow run the app and check that everything is working\
    \ fine. Review that the message `TextView` is showing the new content. If you\
    \ have any doubts or want to revise some code, take a look at [Kotlin for Android\
    \ Developers repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-3).\
    \ I created a branch for each chapter when the new content involves modifications\
    \ in code, so be sure to review it to check all the changes.\n\nNext chapters\
    \ cover some of the new things you could see in the converted `MainActivity`.\
    \ Once you understand the slight differences between Java and Kotlin, you will\
    \ be able to write new code by yourself without any hassle.\n\n## 4 Classes and\
    \ functions\n\nClasses in Kotlin follow a straightforward structure. However,\
    \ there are some slight differences from Java that you want to know before we\
    \ continue. You can use [try.kotlinlang.org](http://try.kotlinlang.org/) to test\
    \ this and some other simple examples without the need for a real project.\n\n\
    You could also use the REPL that comes bundled with the Kotlin plugin. You can\
    \ find it in *Tools -> Kotlin -> Kotlin REPL*.\n\n### 4.1 How to declare a class\n\
    \nIf you want to declare a class, you just need to use the keyword `class`:\n\n\
    ```\n1 class MainActivity {\n2     \n3 }\n```\n\nClasses have a unique default\
    \ constructor. We will see that we can create extra constructors for some exceptional\
    \ cases, but keep in mind that most situations only require a single constructor.\
    \ Parameters are written just after the name. Braces are not required if the class\
    \ is empty:\n\n```\n1 class Person(name: String, surname: String) \n```\n\nWhere\
    \ is the body of the constructor then? You can declare an `init` block:\n\n```\n\
    1 class Person(name: String, surname: String) {\n2     init {\n3     ...\n4  \
    \   }\n5 }\n```\n\n### 4.2 Class inheritance\n\nBy default, a class always extends\
    \ from `Any` (similar to Java `Object`), but we can extend any other classes.\
    \ Classes are closed by default (final), so we can only extend a class if it is\
    \ explicitly declared as `open` or `abstract`:\n\n```\n1 open class Animal(name:\
    \ String)\n2 class Person(firstName: String, lastName: String) : Animal(firstName)\n\
    ```\n\nNote that when using the single constructor structure, we need to specify\
    \ the parameters we are using for the parent constructor. That is equivalent to\
    \ calling `super()` in Java.\n\n### 4.3 Functions\n\nFunctions (our methods in\
    \ Java) are declared by using the **`fun`** keyword:\n\n```\n1 fun onCreate(savedInstanceState:\
    \ Bundle?) {\n2 }\n```\n\nFunctions in Kotlin always return a value. If you skip\
    \ the return value, the function is indeed returning `Unit`.\n\n`Unit` is similar\
    \ to `void` in Java, though this is, in fact, an object. You can, of course, specify\
    \ any type as a return value:\n\n```\n1 fun add(x: Int, y: Int): Int {\n2    \
    \ return x + y\n3 }\n```\n\nHowever, if the result can be calculated using a single\
    \ expression, you can get rid of brackets and use equal:\n\n```\n1 fun add(x:\
    \ Int, y: Int) : Int = x + y\n```\n\n### 4.4 Constructor and functions parameters\n\
    \nParameters in Kotlin are a bit different from Java. As you can see, we first\
    \ write the name of the parameter and then its type.\n\n```\n1 fun add(x: Int,\
    \ y: Int) : Int {\n2     return x + y\n3 }\n```\n\nA handy thing about parameters\
    \ is that we can make them optional by specifying a **default value**. Here is\
    \ an example of a function you could create in an activity, which uses a toast\
    \ to show a message:\n\n```\n1 fun toast(message: String, length: Int = Toast.LENGTH_SHORT)\
    \ {\n2     Toast.makeText(this, message, length).show()\n3 }\n```\n\nAs you can\
    \ see, the second parameter (`length`) specifies a default value, which allows\
    \ you to write or omit the second value. This feature prevents the need for function\
    \ overloading:\n\n```\n1 toast(\"Hello\")\n2 toast(\"Hello\", Toast.LENGTH_LONG)\n\
    ```\n\nThe previous function would be equivalent to the next code in Java:\n\n\
    ```\n1 void toast(String message){\n2     toast(message, Toast.LENGTH_SHORT);\n\
    3 }\n4 \n5 void toast(String message, int length){\n6     Toast.makeText(this,\
    \ message, length).show();\n7 }\n```\n\nAnd this can be as complex as you want.\
    \ Check this other example:\n\n```\n1 fun niceToast(message: String,\n2      \
    \         tag: String = MainActivity::class.java.simpleName,\n3              \
    \ length: Int = Toast.LENGTH_SHORT) {\n4     Toast.makeText(this, \"[$tag] $message\"\
    , length).show()\n5 }\n```\n\nI added a third parameter that includes a tag which\
    \ defaults to the class name. The number of overloads we would need in Java grows\
    \ exponentially. You can now write these calls:\n\n```\n1 niceToast(\"Hello\"\
    )\n2 niceToast(\"Hello\", \"MyTag\")\n3 niceToast(\"Hello\", \"MyTag\", Toast.LENGTH_SHORT)\n\
    ```\n\nThere is even another option, because you can use **named arguments**,\
    \ which means you can write the name of the argument preceding the value to specify\
    \ which one you want:\n\n```\n1 niceToast(message = \"Hello\", length = Toast.LENGTH_SHORT)\n\
    ```\n\n## 5 Writing your first class\n\nWe already have our `MainActivity.kt`\
    \ class. This activity will render a list of daily forecasts for the next seven\
    \ days, so the layout requires some changes.\n\n### 5.1 Creating the layout"
