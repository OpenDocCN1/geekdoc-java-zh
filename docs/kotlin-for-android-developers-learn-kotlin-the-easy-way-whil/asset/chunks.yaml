  trans: "\n\n既然你已经了解了一些可以用 Kotlin 实现的简单示例，我相信你想尽快开始付诸实践。别担心；前几个章节将帮助你配置开发环境，让你立即开始编写代码。\n\
    \n## 2.1 Android Studio\n\n你需要的第一件事是安装 Android Studio。如你所知，Android Studio 是 Android\
    \ 的官方 IDE，它于 2013 年作为预览版推出，并于 2014 年正式发布。\n\nAndroid Studio 是 [IntelliJ IDEA](https://www.jetbrains.com/idea)\
    \ 的插件实现的，后者是由 [Jetbrains](https://www.jetbrains.com) 创建的 Java IDE，而这家公司也是 Kotlin\
    \ 的背后主使。所以，正如你看到的，一切都是紧密相连的。\n\nAndroid Studio 的采用是 Android 开发者的一大进步。首先，我们告别了充满\
    \ Bug 的 Eclipse，转而使用了一套专为 Java 开发者设计的工具，这让我们能够与该语言进行深度交互。我们可以享受许多出色的功能，例如快速且令人惊讶的智能代码补全，以及强大的分析和重构工具等。\n\
    \n其次，[Gradle](https://gradle.org/) 成为了 Android 的官方构建系统，这意味着在版本控制、构建和部署方面出现了一系列全新的可能性。两个最令人兴奋的功能是构建类型（build\
    \ types）和变体（flavors），它们让你在使用相同代码库的同时，以一种简单的方式创建无限版本的应用（甚至是不同的应用）。\n\n如果你仍在使用 Eclipse，我恐怕如果你想跟进这本书，就必须切换到\
    \ Android Studio。Kotlin 团队正在为 Eclipse 创建插件，但它可能远落后于 Android Studio 插件，而且集成可能可能没那么顺畅。一旦你开始使用它，你就会发现自己错过了什么。\n\
    \n我没有涵盖 Android Studio 或 Gradle 的使用方法，因为这不是本书的重点。但如果你是第一次使用这些工具，我相信你仍然能够跟上内容，在此期间学习基础知识。\n\
    \n如果你还没有安装，请从[官方页面下载 Android Studio](https://developer.android.com/sdk/index.html)。\n\
    \n## 2.2 安装 Kotlin 插件\n\n自 IntelliJ 15 发布以来，Kotlin 插件已捆绑在 IDE 中。对于 Android Studio，这取决于你使用的版本。\n\
    \n如果你拥有的是 Android Studio 3.0 或更高版本，你已经拥有了所需的一切。如果你的 Android Studio 是 2.3 或更低，你需要手动安装\
    \ Kotlin 插件。\n\n因此，进入 `Android Studio Preferences` 内部插件（plugins）部分，安装 Kotlin 插件。如果找不到，请使用搜索工具。\n\
    \n现在，我们的环境已经准备好理解该语言、编译并执行它，就像我们使用 Java 一样无缝。\n\n## 3 创建新项目\n\n现在是时候开始创建我们的 App\
    \ 了。我特意想让解释保持简单，因为 Android Studio 的向导程序（wizard）会经常变化，这些步骤很快就会过时。\n\n我们的应用由一个简单的天气应用组成，类似于\
    \ [Udacity 上的 Google 初学者课程](https://www.udacity.com/course/android-development-for-beginners--ud837)中使用的那一个。我们将关注不同的点，但该应用的核心思想是相同的，因为它包含了许多你在普通应用中会发现的内容。如果你是刚开始\
    \ Android 开发，我向你推荐这门课程。\n\n### 3.1 在 Android Studio 中创建新项目\n\n同样，根据你所使用的 Android\
    \ Studio 版本，会有细小的差别。\n\n对于 Android Studio 3，步骤非常直观。之前的版本需要多做一点工作，但也远不复杂。即使你已经在使用新版本的\
    \ Android Studio，我也建议你查看一下整个过程，因为如果你想在 Java 项目上开始使用 Kotlin，这就是你需要的操作。\n\n首先，打开\
    \ Android Studio 并选择 `Create New Project`（创建新项目）。第一步是为你的应用确定名称；你可以使用你喜欢的名称：例如\
    \ `WeatherApp`。然后向导程序会询问公司域名（Company Domain）。由于你并不发布该应用，这个字段也不太重要，但如果你拥有域名，可以使用它。此外，选择你想要保存项目的位置。\n\
    \n在 Android Studio 3 中，在此处，你会发现一个启用 Kotlin 支持的复选框。如果是你的情况，请勾选它。\n\n下一步，向导程序询问最小\
    \ API 版本。我为示例应用选择了 API 15，但 Kotlin 对最小 API 没有任何限制。目前请跳过 `Phone and Tablet` 之外的任何平台。\n\
    \n最后，我们被要求选择一个活动模板。选择 `Empty Activity`（空活动）。此模板生成的代码很少，便于我们添加新逻辑。\n\n保留下一个屏幕中活动或布局（布局））的名称。如果需要，我们稍后会更改它们。按下\
    \ `Finish`（完成）并让 Android Studio 完成工作。\n\n使用 Android Studio 3，你就完成了，跳到第 3.4 点。接两个步骤仅在你必须手动安装插件时才需要。\n\
    \n### 3.2 将 MainActivity 转换为 Kotlin 代码\n\nKotlin 插件包含的一个有趣功能是可以将 Java 代码转换为 Kotlin\
    \ 代码。作为一个自动化过程，它并不完美，但在你开始习惯 Kotlin 语言的前几天里，它可能会有很大帮助。\n\n因此，我们在 `MainActivity.java`\
    \ 类中使用此功能。打开文件并选择 `Code -> Convert Java File to Kotlin File`（代码 -> 将 Java 文件转换为\
    \ Kotlin 文件）。查看一下差异，以便你开始熟悉这种语言。\n\n你也可以将任何 Java 代码复制到 Kotlin 文件中，插件也会进行转换。\n\n\
    ### 3.3 在项目中配置 Kotlin\n\nKotlin 插件还包含一个工具，可以为我们配置 Gradle 文件。\n\n进入 `Tools -> Project\
    \ -> Configure Kotlin`。选择最新的 Kotlin 版本，并点击 OK。\n\n检查更改。应该如下所示：\n\n```\nbuildscript\
    \ {\n     ext.kotlin_version = '1.2.31'\n     repositories {\n         jcenter()\n\
    \     }\n     dependencies {\n         classpath 'com.android.tools.build:gradle:3.1.0'\n\
    \         classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version\"\
    \n     }\n}\n\nallprojects {\n    repositories {\n        jcenter()\n    }\n}\n\
    ```\nbuild.gradle\n\n你可以看到，它创建一个保存 Kotlin 版本的变量。我们在许多地方都需要该版本号，例如在 Kotlin 插件的新依赖中。\n\
    \n它在模块 `build.gradle` 中再次有用，该配置也添加了 Kotlin 标准库的依赖。现在去检查一下：\n\n```\napply plugin:\
    \ 'com.android.application'\napply plugin: 'kotlin-android'\n\nandroid {\n   \
    \ ...\n}\n\ndependencies {\n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version\"\
    \n}\n```\napp/build.gradle\n\n### 3.4 引入其他有用配置\n\n我们将使用一些其他额外的库，所以趁此将它们添加到 `build.gradle`\
    \ 中。\n\n一个重要的库是 Anko，它利用 Kotlin 的力量来简化 Android 中的某些任务。我们稍会使用更多 Anko 模块，但目前只需添加\
    \ `anko-common` 即可。该库被拆分为几个较小的库，以便我们只在项目中包含需要的部分。\n\n"
- fmt: "\n```\nbuildscript {\n    ext.support_version = '27.1.0'\n    ext.kotlin_version\
    \ = '1.2.31'\n    ext.anko_version = '0.10.4'\n    repositories {\n        jcenter()\n\
    \    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:3.1.0'\n\
    \        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version\"\
    \n    }\n}\n\nallprojects {\n    repositories {\n        jcenter()\n        google()\n\
    \    }\n}\n```\n\n`build.gradle`\n\nIf you are using `Android Studio 2.3`, you\
    \ also need to add the Google repository as you can see above. `Android Studio\
    \ 3` does it for you.\n\nLet’s then add the `Anko` library dependency to the module\
    \ file, update the `AppCompat` to use our variable, and apply the `Kotlin Android\
    \ Extensions` plugin:\n\n```\napply plugin: 'com.android.application'\napply plugin:\
    \ 'kotlin-android'\napply plugin: 'kotlin-android-extensions'\n\nandroid {\n \
    \   ...\n}\n\ndependencies {\n    implementation \"com.android.support:appcompat-v7:$support_version\"\
    \n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version\"\n\
    \    implementation \"org.jetbrains.anko:anko-common:$anko_version\"\n}\n```\n\
    \n`app/build.gradle`\n\nWith these changes, we should be ready to start.\n\n###\
    \ 3.5 Test that everything works\n\nWe are going to add some code to check that\
    \ `Kotlin Android Extensions` are fully functional. I am not explaining much about\
    \ it yet, but I want to be sure this is working for you.\n\nFirst, go to `activity_main.xml`\
    \ and set an id for the `TextView`:\n\n```\n<TextView\n    android:id=\"@+id/message\"\
    \n    android:text=\"@string/hello_world\"\n    android:layout_width=\"wrap_content\"\
    \n    android:layout_height=\"wrap_content\"/>\n```\n\n`activity_main.xml`\n\n\
    At `onCreate`, try to write the id you previously chose (`message` in this example)\
    \ for the `TextView`:\n\n```\noverrideoverride fun onCreate(savedInstanceState:\
    \ Bundle?) {\n    super.onCreate(savedInstanceState)\n    setContentView(R.layout.activity_main)\n\
    \    message.text = \"Hello Kotlin!\"\n}\n```\n\n`MainActivity.kt`\n\nDo you see\
    \ the magic? You could access the view without finding it or using third-party\
    \ libraries. `Kotlin Android Extensions` is a plugin that comes included in the\
    \ main Kotlin one, and that is its primary purpose. Be patient; I shall show you\
    \ how to use it properly soon.\n\nYou will also see that a synthetic import was\
    \ added automatically to the activity, but we are not covering it yet:\n\n```\n\
    import kotlinx.android.synthetic.main.activity_main.*\n```\n\n`MainActivity.kt`\n\
    \nThanks to Kotlin interoperability with Java, we can use setters and getters\
    \ methods from Java libraries as a property in Kotlin. We will talk about properties\
    \ later too, but just notice that we can use `message.text` instead of `message.setText`\
    \ for free. The compiler uses the real Java methods, so there is no performance\
    \ overhead when using it.\n\nNow run the app and check that everything is working\
    \ fine. Review that the message `TextView` is showing the new content. If you\
    \ have any doubts or want to revise some code, take a look at [Kotlin for Android\
    \ Developers repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-3).\
    \ I created a branch for each chapter when the new content involves modifications\
    \ in code, so be sure to review it to check all the changes.\n\nNext chapters\
    \ cover some of the new things you could see in the converted `MainActivity`.\
    \ Once you understand the slight differences between Java and Kotlin, you will\
    \ be able to write new code by yourself without any hassle.\n\n## 4 Classes and\
    \ functions\n\nClasses in Kotlin follow a straightforward structure. However,\
    \ there are some slight differences from Java that you want to know before we\
    \ continue. You can use [try.kotlinlang.org](http://try.kotlinlang.org/) to test\
    \ this and some other simple examples without the need for a real project.\n\n\
    You could also use the REPL that comes bundled with the Kotlin plugin. You can\
    \ find it in `Tools -> Kotlin -> Kotlin REPL`.\n\n### 4.1 How to declare a class\n\
    \nIf you want to declare a class, you just need to use the keyword `class`:\n\n\
    ```\nclass MainActivity {\n    \n}\n```\n\nClasses have a unique default constructor.\
    \ We will see that we can create extra constructors for some exceptional cases,\
    \ but keep in mind that most situations only require a single constructor. Parameters\
    \ are written just after the name. Braces are not required if the class is empty:\n\
    \n```\nclass Person(name: String, surname: String) \n```\n\nWhere is the body\
    \ of the constructor then? You can declare an `init` block:\n\n```\nclass Person(name:\
    \ String, surname: String) {\n    init {\n        ...\n    }\n}\n```\n\n### 4.2\
    \ Class inheritance\n\nBy default, a class always extends from `Any` (similar\
    \ to Java `Object`), but we can extend any other classes.\n\n```\nclass Animal\
    \ {\n    open fun makeSound() {\n        println(\"Animal sound\")\n    }\n}\n\
    \nclass Dog : Animal() {\n    override fun makeSound() {\n        println(\"Bark\"\
    )\n    }\n}\n```\n\n### 4.3 Functions\n\nFunctions in Kotlin are declared using\
    \ the `fun` keyword:\n\n```kotlin\nfun sum(a: Int, b: Int): Int {\n    return\
    \ a + b\n}\n```\n\n`Unit` is similar to `void` in Java, used when a function does\
    \ not return a value:\n\n```kotlin\nfun greet(): Unit {\n    println(\"Hello,\
    \ World!\")\n}\n```\n\nYou can also use expression syntax for simple functions:\n\
    \n```kotlin\nfun multiply(a: Int, b: Int) = a * b\n```\n\n### 4.4 Constructor\
    \ and parameters\n\nParameters in Kotlin are a bit different from Java. You can\
    \ define properties directly in the primary constructor:\n\n```kotlin\nclass User(val\
    \ name: String, var age: Int)\n```\n\nA handy thing about parameters is that we\
    \ can make them optional by specifying a **default value**. \n\n```kotlin\nfun\
    \ toast(message: String, length: Int = Toast.LENGTH_SHORT) {\n    Toast.makeText(this,\
    \ message, length).show()\n}\n```\n\nThis allows you to call the function in different\
    \ ways:\n\n```kotlin\ntoast(\"Hello\")\ntoast(\"Hello\", Toast.LENGTH_LONG)\n\
    ```\n\nThere is even another option, because you can use **named arguments**,\
    \ which means you can write the name of the argument preceding the value to specify\
    \ which one you want:\n\n```kotlin\ntoast(message = \"Hello\", length = Toast.LENGTH_SHORT)\n\
    ```\n\n## 5 Writing your first class\n\nWe already have our `MainActivity.kt`\
    \ class. This activity will render a list of daily forecasts for the next seven\
    \ days, so the layout requires some changes.\n\n### 5.1 Creating the layout\n"
