    \ which can be ignored, and it will behave like a regular Java `if` condition\
    \ in that case.\n\n### 22.2 When Expression\n\n`When` expressions are similar\
    \ to `switch` in Java, but far more powerful. They match the argument against\
    \ possible cases until it finds one.\n"
