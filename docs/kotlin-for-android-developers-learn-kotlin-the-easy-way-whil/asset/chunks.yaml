  trans: "\n\n```kotlin\ndata class ForecastResult(val city: City, val list: List<Forecast>)\n\
    data class City(val id: Long, val name: String, val coord: Coordinates,\n    \
    \            val country: String, val population: Int)\ndata class Coordinates(val\
    \ lon: Float, val lat: Float)\ndata class Forecast(val dt: Long, val temp: Temperature,\
    \ val pressure: Float,\n                    val humidity: Int, val weather: List<Weather>,\n\
    \                    val speed: Float, val deg: Int, val clouds: Int,\n      \
    \              val rain: Float)\ndata class Temperature(val day: Float, val min:\
    \ Float, val max: Float,\n                       val night: Float, val eve: Float,\
    \ val morn: Float)\ndata class Weather(val id: Long, val main: String, val description:\
    \ String,\n                   icon: String)\n```\n`data/ResponseClasses.kt`\n\n\
    由于我们使用 [Gson](https://github.com/google/gson) 来将 JSON 解析到我们的类中，属性名称必须与 JSON 中的名称一致，或者指定一个序列化名称。大多数软件架构中解释的一种良好实践是为应用的不同层使用不同的模型，以便将它们解耦。因此，我倾向于简化这些类的声明，因为会在它们用于应用的其他部分之前对其进行转换。此类中使用的属性名称与\
    \ JSON 响应中的名称相同。\n\n现在，`Request` 类需要一些修改以返回解析后的结果。它只接收城市的 `zipcode` 而不是完整的 URL，这样更具可读性。目前，静态\
    \ URL 定义在 `companion object` 中。\n\n检查结果生成的代码：\n\n```kotlin\nclass ForecastRequest(private\
    \ val zipCode: String) {\n    companion object {\n        private const val APP_ID\
    \ = \"15646a06818f61f7b8d7823ca833e1ce\"\n        private const val URL = \"http://api.openweathermap.org/data/2.5/\"\
    \ +\n                \"forecast/daily?mode=json&units=metric&cnt=7\"\n       \
    \ private const val COMPLETE_URL = \"$URL&APPID=$APP_ID&zip=\"\n    }\n\n    fun\
    \ execute(): ForecastResult {\n        val forecastJsonStr = URL(COMPLETE_URL\
    \ + zipCode).readText()\n        return Gson().fromJson(forecastJsonStr, ForecastResult::class.java)\n\
    \    }\n}\n```\n`data/ForecastRequest.kt`\n\n记得你需要将 Gson 库添加到 `build.gradle` 依赖中：\n\
    \n```gradle\ncompile \"com.google.code.gson:gson:2.8.1\"\n```\n`app/build.gradle`\n\
    \n### 10.2 构建领域模型层\n\n现在，让我们创建一个代表 `domain` 层的新包。它包含了一些负责执行应用用例的 `Command`。\n\n\
    首先，需要定义 `Command`。在下面的示例中有一个泛型声明。我们将在后续章节中讨论这个主题。\n\n```kotlin\npublic interface\
    \ Command<out T> {\n    fun execute(): T\n}\n```\n`domain/commands/Command.kt`\n\
    \n这些命令执行一个操作并返回其泛型类型中指定的类对象。记住 Kotlin 中的每个函数都会返回一个值。默认情况下，如果没有指定，它将返回 `Unit` 类的对象。因此，如果我们想让\
    \ `Command` 返回任何内容，可以指定 `Unit` 为其类型。\n\nKotlin 中的接口比 Java（Java 8 之前）更强大，因为它们可以包含代码。然而，目前我们不需要该功能。\n\
    \n第一个命令需要向 API 请求天气预报并将其转换为领域类。这是领域类的定义：\n\n```kotlin\ndata class ForecastList(val\
    \ city: String, val country: String, \n                        val dailyForecast:List<Forecast>)\n\
    \ndata class Forecast(val date: String, val description: String, val high: Int,\
    \ \n                    val low: Int)\n```\n`domain/model/DomainClasses.kt`\n\n\
    当我们以后添加更多功能时，这些类可能需要重新进行审查。目前，它们保留的数据已经足够。\n\n类必须从数据层映射到领域模型，因此接下来的任务将是创建一个 `DataMapper`：\n\
    \n```kotlin\nclass ForecastDataMapper {\n    fun convertFromDataModel(forecast:\
    \ ForecastResult): ForecastList =\n        ForecastList(forecast.city.name, forecast.city.country,\
    \ \n            convertForecastListToDomain(forecast.list))\n\n    private fun\
    \ convertForecastListToDomain(list: List<Forecast>)\n            : List<ModelForecast>\
    \ {\n        return list.mapIndexed { i, forecast ->\n            val dt = Calendar.getInstance().timeInMillis\
    \ + \n                TimeUnit.DAYS.toMillis(i.toLong())\n            convertForecastItemToDomain(forecast.copy(dt\
    \ = dt)) \n        }\n    }\n\n    private fun convertForecastItemToDomain(forecast:\
    \ Forecast): ModelForecast {\n        // 实现细节\n    }\n\n    private fun convertDate(date:\
    \ Long): String {\n        val df = DateFormat.getDateInstance(DateFormat.MEDIUM,\
    \ Locale.getDefault())\n        return df.format(date)\n    }\n}\n```\n`domain/mappers/ForecastDataMapper.kt`\n\
    \n### 10.3 在 UI 中绘制数据\n\n`MainActivity` 代码发生了一点变化，因为现在我们有真实数据来填充适配器。异步调用需要重写：\n\
    \n```kotlin\ndoAsync() {\n    val result = RequestForecastCommand(\"94043\").execute()\n\
    \    uiThread {\n        forecastList.adapter = ForecastListAdapter(result)\n\
    \    }\n}\n```\n`ui/activities/MainActivity.kt`\n\n适配器也需要一些修改：\n\n```kotlin\n\
    class ForecastListAdapter(private val weekForecast: ForecastList) : \n       \
    \ RecyclerView.Adapter<ForecastListAdapter.ViewHolder>() {\n\n    override fun\
    \ onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {\n       \
    \ return ViewHolder(TextView(parent.getContext()))\n    }\n\n    override fun\
    \ onBindViewHolder(holder: ViewHolder, position: Int) {\n        with(weekForecast.dailyForecast[position])\
    \ {\n            holder.textView.text = \"$date - $description - $high/$low\"\n\
    \        }\n    }\n\n    override fun getItemCount(): Int = weekForecast.dailyForecast.size\n\
    \n    class ViewHolder(val textView: TextView) : RecyclerView.ViewHolder(textView)\n\
    }\n```\n\n"
- fmt: "\n`ui/adapters/ForecastListAdapter.kt`\n\nThere is some new code in this chapter,\
    \ so feel free to check it out on the [repository](https://github.com/antoniolg/Kotlin-for-Android-Developers/tree/chapter-10).\n\
    \n# 11 Operator overloading\n\nKotlin has a fixed number of symbolic operators\
    \ we can use in any class. These symbols map to a function, which is the one that\
    \ provides the logic that the operator uses. Overloading these operators may increment\
    \ the readability and simplicity of your code.\n\nTo notify the compiler that\
    \ you want to overload an operator, you must annotate the functions with the `operator`\
    \ modifier.\n\n## 11.1 Operators tables\n\nHere you can see a set of tables that\
    \ include an operator and its corresponding function. A function with that name\
    \ must be implemented to enable the possibility of using the operator in a specific\
    \ class.\n\n#### Unary operations\n\n| `+a` | `a.unaryPlus()` |\n| :--- | :---\
    \ |\n| `-a` | `a.unaryMinus()` |\n| `!a` | `a.not()` |\n| `a++` | `a.inc()` |\n\
    | `a–` | `a.dec()` |\n\n#### Binary operations\n\n| `a + b` | `a.plus(b)` |\n\
    | :--- | :--- |\n| `a - b` | `a.minus(b)` |\n| `a * b` | `a.times(b)` |\n| `a\
    \ / b` | `a.div(b)` |\n| `a % b` | `a.mod(b)` |\n| `a..b` | `a.rangeTo(b)` |\n\
    | `a in b` | `b.contains(a)` |\n| `a !in b` | `!b.contains(a)` |\n| `a += b` |\
    \ `a.plusAssign(b)` |\n| `a -= b` | `a.minusAssign(b)` |\n| `a *= b` | `a.timesAssign(b)`\
    \ |\n| `a /= b` | `a.divAssign(b)` |\n| `a %= b` | `a.modAssign(b)` |\n\n####\
    \ Array-like operations\n\n| `a[i]` | `a.get(i)` |\n| :--- | :--- |\n| `a[i, j]`\
    \ | `a.get(i, j)` |\n| `a[i_1, …, i_n]` | `a.get(i_1, …, i_n)` |\n| `a[i] = b`\
    \ | `a.set(i, b)` |\n| `a[i, j] = b` | `a.set(i, j, b)` |\n| `a[i_1, …, i_n] =\
    \ b` | `a.set(i_1, …, i_n, b)` |\n\n#### Equals operation\n\n| `a == b` | `a?.equals(b)\
    \ ?: b === null` |\n| :--- | :--- |\n| `a != b` | `!(a?.equals(b) ?: b === null)`\
    \ |\n\nThe `equals` operations are a bit different, because they use a more complex\
    \ translation to make a proper equals checking, and because they expect an exact\
    \ function specification and not just a specific name. The function must be implemented\
    \ exactly like this:\n\n```\n1 operator fun equals(other: Any?): Boolean\n```\n\
    \nOperators `===` and `!==` do identity checks (they are `==` and `!=` in Java\
    \ respectively) and cannot be overloaded.\n\n#### Function invocation\n\n| `a(i)`\
    \ | `a.invoke(i)` |\n| :--- | :--- |\n| `a(i, j)` | `a.invoke(i, j)` |\n| `a(i_1,\
    \ …, i_n)` | `a.invoke(i_1, …, i_n)` |\n\n## 11.2 An example\n\nAs you can imagine,\
    \ Kotlin lists have the array-like operations implemented in the standard library,\
    \ so we can access the items of the list the same way we would do in Java arrays.\
    \ But it goes beyond: in mutable lists, you can also assign a value to a position\
    \ by using the same operator:\n\n```\n1 val x = myList[2]\n2 myList[2] = 4\n```\n\
    \nIf you remember, we have a data class called `ForecastList`, which consists\
    \ of a list with some extra info. It would be interesting to access its items\
    \ directly instead of having to request its internal list to get an item. On an\
    \ unrelated note, I am also going to implement a `size` property, which simplifies\
    \ the current adapter a little more:\n\n```\n1 data class ForecastList(val city:\
    \ String, val country: String, \n2     private val dailyForecast: List<Forecast>)\
    \ {\n3     \n4     val size: Int\n5     get() = dailyForecast.size\n6 \n7    \
    \ operator fun get(position: Int): Forecast = dailyForecast[position]\n8 }\n```\n\
    \n`domain/model/DomainClasses.kt`\n\nIt makes our `onBindViewHolder` a bit simpler:\n\
    \n```\n1 override fun onBindViewHolder(holder: ViewHolder, position: Int) {\n\
    2     with(weekForecast[position]) {\n3         holder.textView.text = \"$date\
    \ - $description - $high/$low\"\n4     }\n5 }\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\
    \nAs well as the `getItemCount()` function:\n\n```\n1 override fun getItemCount():\
    \ Int = weekForecast.size\n```\n\n`ui/adapters/ForecastListAdapter.kt`\n\n## 11.3\
    \ Operators in extension functions\n\nApart from using extension functions for\
    \ our classes, we can also extend existing classes to provide new operations to\
    \ third-party libraries. For instance, we could access to `ViewGroup` views the\
    \ same way we do with lists:\n\n```\n1 operator fun ViewGroup.get(position: Int):\
    \ View \n2         = getChildAt(position)\n```\n\nNow it is really simple to get\
    \ a view from a `ViewGroup` by its position:\n\n```\n1 val container: ViewGroup\
    \ = find(R.id.container)\n```\n\n## 12 Making the forecast list\n\nCurrent layout\
    \ needs some work to be ready. The first thing is to create a layout that can\
    \ show an icon, date, high and low temperatures. So `item_forecast`:\n\n```xml\n\
    1 <?xml version=\"1.0\" encoding=\"utf-8\"?>\n2 <LinearLayout\n3 xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n4 xmlns:tools=\"http://schemas.android.com/tools\"\
    \n5 android:layout_width=\"match_parent\"\n6 android:layout_height=\"wrap_content\"\
    \n7 android:background=\"?attr/selectableItemBackground\"\n8 android:gravity=\"\
    center_vertical\"\n9 android:orientation=\"horizontal\">\n10    <ImageView\n11\
    \        android:id=\"@+id/icon\"\n12        android:layout_width=\"48dp\"\n13\
    \        android:layout_height=\"48dp\"\n14        tools:src=\"@mipmap/launcher\"\
    />\n15    <LinearLayout\n16        android:layout_width=\"0dp\"\n17        android:layout_height=\"\
    wrap_content\"\n18        android:layout_weight=\"1\"\n19        android:marginLeft=\"\
    @dimen/spacing_xlarge\"\n20        android:marginRight=\"@dimen/spacing_xlarge\"\
    \n21        android:orientation=\"vertical\">\n22        <TextView\n23       \
    \     android:id=\"@+id/date\"\n24            android:layout_width=\"match_parent\"\
    \n25            android:layout_height=\"wrap_content\"\n26            android:textAppearance=\"\
    @style/TextAppearance.Medium\"\n27            tools:text=\"May 14, 2015\"/>\n\
    28\n29        <TextView\n30            android:id=\"@+id/description\"\n31   \
    \         android:layout_width=\"match_parent\"\n32            android:layout_height=\"\
    wrap_content\"\n33            android:textAppearance=\"@style/TextAppearance.Caption\"\
    \n34            tools:text=\"Light Rain\"/>\n35    </LinearLayout>\n36\n37   \
    \ <LinearLayout\n38        android:layout_width=\"wrap_content\"\n39        android:layout_height=\"\
    wrap_content\"\n40        android:gravity=\"center_horizontal\"\n41        android:orientation=\"\
    vertical\">\n42\n43        <TextView\n44            android:id=\"@+id/maxTemperature\"\
    \n45            android:layout_width=\"wrap_content\"\n46            android:layout_height=\"\
    wrap_content\"\n47            android:textAppearance=\"@style/TextAppearance.Medium\"\
    \n48            tools:text=\"30\"/>\n49\n50        <TextView\n51            android:id=\"\
    @+id/minTemperature\"\n52            android:layout_width=\"wrap_content\"\n53\
    \            android:layout_height=\"wrap_content\"\n54            android:textAppearance=\"\
    @style/TextAppearance.Caption\"\n55            tools:text=\"15\"/>\n56    </LinearLayout>\n\
    57 </LinearLayout>\n```\n\n`layout/item_forecast.xml`\n\nThe domain model and\
    \ data mapper must generate the complete icon url, so that we can load it:\n\n\
    ```kotlin\ndata class Forecast(val date: String, val description: String, \n \
    \                   val high: Int, val low: Int, val iconUrl: String)\n```\n\n\
    `model/DomainClasses.kt`\n\nIn `ForecastDataMapper`:\n\n```kotlin\nprivate fun\
    \ convertForecastItemToDomain(forecast: Forecast): ModelForecast {\n    return\
    \ ModelForecast(convertDate(forecast.dt), \n            forecast.weather[0].description,\
    \ forecast.temp.max.toInt(), \n            forecast.temp.min.toInt(), generateIconUrl(forecast.weather[0].icon))\n\
    }\n\nprivate fun generateIconUrl(iconCode: String): String \n        = \"http://openweathermap.org/img/w/$iconCode.png\"\
    \n```\n\n`domain/mappers/ForecastDataMapper.kt`\n"
