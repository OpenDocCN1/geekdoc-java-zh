    \ { dataMapper.convertDayToDomain(it) }\n```\n\ndata/db/ForecastDb.kt\n\n`let`\
    \ function is only executed if `forecast` is not null thanks to ‘`?.`’ operator.\
    \ It returns `null` otherwise. Just what we were trying to achieve.\n\n#### with\n\
    \nWe have talked a lot about this function during the book. `with` receives an\
    \ object and a lambda that behaves as an extension function. So we can use `this`\
    \ inside the lambda to refer to the object. It also returns an object defined\
    \ in the last line of the function.\n\n```\n1 inline fun <T, R> with(receiver:\
    \ T, f: T.() -> R): R = receiver.f()\n```\n\nGenerics work the same way here:\
    \ `T` stands for the receiver type and `R` for the result. As you can see, the\
    \ lambda is defined as an extension function by using this declaration: `f: T.()\
    \ -> R`. That is why we can then call `receiver.f()`.\n\nWe have several examples\
    \ throughout the app:\n\n```\n1 fun convertFromDomain(forecast: ForecastList)\
    \ = with(forecast) {\n2     val daily = dailyForecast.map { convertDayFromDomain(id,\
    \ it) }\n3     CityForecast(id, city, country, daily)\n4 }\n```\n\ndata/db/DbDataMapper.kt\n\
    \n#### apply\n\nIt may look very similar to `with` function, but the idea is a\
    \ bit different. `apply` can be used to avoid the creation of builders, because\
    \ the object that calls the function can initialize itself the way it needs, and\
    \ the `apply` function returns the same object:\n\n```\n1 inline fun <T> T.apply(f:\
    \ T.() -> Unit): T { f(); return this }\n```\n\nWe only need one generic type\
    \ here, because the object that calls the function is also the returned value.\
    \ A nice simple example would be:\n\n```\n1 val textView = TextView(context).apply\
    \ {\n2     text = \"Hello\"\n3     hint = \"Hint\"\n4     textColor = android.R.color.white\n\
    5 }\n```\n\nIt creates a `TextView`, modifies some properties, and assigns it\
    \ to a variable. Everything in a simple, readable and compact syntax. Let’s use\
    \ it in our current code. In `ToolbarManager`, we were doing this to create the\
    \ navigation drawable:\n\n```\n1 private fun createUpDrawable() = with(DrawerArrowDrawable(toolbar.ctx))\
    \ {\n2     progress = 1f\n3     this\n4 }\n```\n\nUsing `with` and returning `this`\
    \ is clearly something that can be done easier by using `apply`:"
