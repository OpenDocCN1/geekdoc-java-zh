- fmt: "\nNow every class which extends `Context` can be used as the type of our class.\
    \ The rest of types are not allowed.\n\nOf course, types are also allowed in functions.\
    \ We can build generic functions quite easily:\n\n```\n1 fun <T> typedFunction(item:\
    \ T): List<T> {\n2     ...\n3 }\n```\n\n### 25.2 Variance\n\nThis is really one\
    \ of the trickiest parts to understand. In Java, there is a problem when we use\
    \ generic types. Logic says that `List<String>` should be able to be casted to\
    \ `List<Object>` because it is less restrictive. But take a look at this example:\n\
    \n```\n1 List<String> strList = new ArrayList<>();\n2 List<Object> objList = strList;\n\
    3 objList.add(5);\n4 String str = objList.get(0);\n```\n\nIf the Java compiler\
    \ allowed us to do this, we could add an `Integer` to an `Object` list, and this\
    \ would crash at some point. That is why wildcards were added to the language.\
    \ Wildcards increase flexibility while limiting this problem.\n\nIf we add `?\
    \ extends Object` we are using `covariance`, which means that we can deal with\
    \ any object that uses a type that is more restrictive than `Object`, but we can\
    \ only do `get` operations safely. If we want to copy a collection of `String`s\
    \ into a collection of `Object`s, we should be allowed, right?\n\nThen, if we\
    \ have:\n\n```\n1 List<String> strList = ...;\n2 List<Object> objList = ...;\n\
    3 objList.addAll(strList);\n```\n\nThis is possible because the definition of\
    \ `addAll()` in `Collection` interface is something like:\n\n```\n1 List<String>\
    \ \n2 interface Collection<E> ... {\n3   void addAll(Collection<? extends E> items);\n\
    4 }\n```\n\nOtherwise, without the wildcard, we would not be allowed to use a\
    \ `String` list with this method. The opposite, of course, would fail. We cannot\
    \ use `addAll()` to add a list of `Object`s to a list of `String`s. As we are\
    \ only getting the items from the collection we use in that method, it is a perfect\
    \ example of covariance.\n\nOn the other hand, we can find `contravariance`, which\
    \ is just the opposite situation. Following with the `Collection` example, if\
    \ we want to add items to a `Collection` we are passing as a parameter, we could\
    \ add objects with a more restrictive type into a more generic collection. For\
    \ instance, we could add `String`s to an `Object` list:\n\n```\n1 void copyStrings(Collection<?\
    \ super String> to, Collection<String> from) {\n2     to.addAll(from);\n3 }\n\
    ```\n\nThe only restriction we have to add `String`s to another collection is\
    \ that the collection accepts `Object`s that are `String`s or parent classes.\n\
    \nBut wildcards have some limitations. Wildcards define `use-site variance`, which\
    \ means we need to declare them where we use them. This implies adding boilerplate\
    \ every time we declare a more generic variable.\n\nLet’s see an example. Using\
    \ a class similar to the one we had before:\n\n```\n1 public class TypedClass<T>\
    \ {\n2     public T doSomething(){\n3         ...\n4     }\n5 }\n```\n\nThis code\
    \ will not compile:\n\n```\n1 TypedClass<String> t1 = new TypedClass<>();\n2 TypedClass<Object>\
    \ t2 = t1;\n```\n\nThough it really does not make sense, because we could still\
    \ keep calling all the methods of the class, and nothing would break. We need\
    \ to specify that the type can have a more flexible definition.\n\n```\n1 TypedClass<String>\
    \ t1 = new TypedClass<>();\n2 TypedClass<? extends String> t2 = t1;\n```\n\nThe\
    \ use of wildcards, in this case, makes things more difficult to understand, and\
    \ adds some extra boilerplate.\n\nOn the other hand, Kotlin deals with it more\
    \ naturally by using `declaration-site variance`. In Kotlin, we specify that we\
    \ can deal with less restrictive situations when defining the class or interface,\
    \ and then we can use it blindly everywhere.\n\nSo let’s see how it looks. Instead\
    \ of long wildcards, Kotlin uses `out` for covariance and `in` for contravariance.\
    \ In this case, as our class is producing objects that can be saved into less\
    \ restrictive variables, we are using covariance. We can define this in the class\
    \ declaration directly:\n\n```\n1 class TypedClass<out T>() {\n2     fun doSomething():\
    \ T {\n3         ...\n4     }\n5 }\n```\n\nAnd that is all we need. Now, the same\
    \ example that would not compile in Java is perfectly possible in Kotlin:\n\n\
    ```\n1 val t1 = TypedClass<String>()\n2 val t2: TypedClass<Any> = t1\n```\n\n\
    If you were already used to these concepts, I am sure you can use `in` and `out`\
    \ in Kotlin without any hassle. Otherwise, it requires a little practice and a\
    \ good understanding of these concepts.\n\n### 25.3 Generics examples\n\nAfter\
    \ the theory, let’s move to some practical functions that will make our lives\
    \ easier. Instead of reinventing the wheel, I am using three functions that are\
    \ included in Kotlin standard library. These functions let us do remarkable things\
    \ with just a generic implementation. They can inspire you to create your own\
    \ functions.\n\n#### let\n\n`let` is a simple function that can be called by any\
    \ object. It receives a function that takes the object as a parameter and returns\
    \ the value that this function returns. It is handy to deal with nullable objects,\
    \ for instance. Here is the definition:\n\n```\ninline inline <T, R> T.let(f:\
    \ (T) -> R): R = f(this)\n```\n\nIt uses two generic types: `T` and `R`. The first\
    \ type is the calling object, and the second one is the result. How can we use\
    \ it? You may remember that, when we were retrieving data from source, the result\
    \ could be null:\n\n```\n1 if (forecast != null) dataMapper.convertDayDomain(forecast)\
    \ else null\n```\n\nThis can be improved. We should not need to deal with nullable\
    \ types that way. We can avoid it by using `let`:\n\n```\n1 forecast?.let { dataMapper.convertDayDomain(it)\
    \ }\n```\n\n#### with\n\nWe have talked a lot about this function during the book.\
    \ `with` receives an object and a lambda that behaves as an extension function.\n\
    \n```\ninline inline <T, R> with(receiver: T, f: T.() -> R): R\n\nGenerics work\
    \ the same way here: `T` stands for the receiver type and `R` for the result.\
    \ As you can see, the lambda is defined as an extension function: `f: T.() ->\
    \ R`. That is why we can then call `receiver.f()`.\n\nWe have several examples\
    \ throughout the app:\n\n```\n1 fun convertFromDomain(forecast: ForecastList)\
    \ = with(forecast) {\n    val daily = dailyForecast.map { convertDayDomain(id,\
    \ it) }\n    CityForecast(id, city, country, daily)\n}\n```\n\n#### apply\n\n\
    It may look very similar to `with` function, but the idea is a bit different.\
    \ `apply` can be used to avoid the creation of builders, because the object that\
    \ calls the function can initialize itself the way it needs, and the `apply` function\
    \ returns the same object:\n\n```\ninline inline <T> T.apply(f: T.() -> Unit):\
    \ T { f(); return this }\n```\n\nWe only need one generic type here, because the\
    \ object that calls the function is also the returned value. A nice simple example\
    \ would be:\n\n```\n1 val textView = TextView(context).apply {\n    text = \"\
    Hello\"\n    hint = \"Hint\"\n    textColor = android.R.color.white\n}\n```\n\n\
    It creates a `TextView`, modifies some properties, and assigns it to a variable.\
    \ Everything in a simple, readable and compact syntax. Let’s use it in our current\
    \ code. In `ToolbarManager`, we were doing this to create the navigation drawable:\n\
    \n```\n1 private fun createUpDrawable() = with(DrawerArrowDrawable(toolbar.ctx))\
    \ {\n    progress = 1f\n    this\n}\n```\n\nUsing `with` and returning `this`\
    \ is clearly something that can be done easier by using `apply`:\n"
