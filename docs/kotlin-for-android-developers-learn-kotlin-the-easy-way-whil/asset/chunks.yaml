    ![](img/title_page.png)


    ![Android 开发者 Kotlin Go](img/title_page.png)


    # Android 开发者 Kotlin Go


    ### 在开发 Android 应用的同时，轻松学习 Kotlin


    #### Antonio Leiva


    本书可在 [`leanpub.com/kotlin-for-android-developers`](http://leanpub.com/kotlin-for-android-developers)
    购买。


    此版本发布于 2018-04-05。


    ![出版者标志](img/leanpub-logo.png)


    这是一本来自 [Leanpub](http://leanpub.com) 的书。Leanpub 通过“精益出版”流程为作者和出版社赋能。[精益出版](http://leanpub.com/manifesto)是指使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在一旦成功后建立影响力。


    © 2015 - 2018 Antonio Leiva


    本书献给 [antonioleiva.com](http://antonioleiva.com) 的所有忠实读者，是你们让我相信编写关于 Android 开发的内容是帮助他人学习的强大工具。我觉得这本书是向前迈的重要一步。


    特别感谢 [Luis Herrero](https://twitter.com/luishj)，他为这本书设计了精美的封面；并感谢 [Gautier Mechling](http://twitter.com/Nilhcem)
    通过审阅这本书为我提供了巨大的帮助。正亏有他，这些页面才没有充满拼写错误和错误。


    当然，这书特别送给你们。在你们的支持和帮助下，这本书正在成长并成为一个参考书。因此，任何改进本书质量的建议都受到欢迎。欢迎随时向 contact@antonioleiva.com
    写信。


    ## 目录


    ## 指南


    1. 开始阅读


    ## I. 关于这本书


    嘿！非常感谢你对这本书的关注，看到你决定成为 Android Kotlin 专家，我感到非常兴奋。


    自从我 2015 年年中开始编写《Android 开发者 Kotlin Go》以来，发生了很多事情。那时，Kotlin 仍然处于早期访问版本。然而，我感受到了这种语言巨大的力量，因此决定在书中解释我所学到的一切。


    从那时起，这种语言不断成长，直到 Google 宣布他们开始支持 Kotlin 作为开发 Android 应用的官方语言。


    这些是令人震惊的消息。但更惊讶的是，Google 和 JetBrains 都向想要学习这种语言的 Android 开发者推荐了这本书。


    如你所知，这是一本精益出版物。这本书的成长和进展感谢读者的评论。因此，我只能感谢你帮助我将这个梦想变为现实。


    ### 《Android 开发者 Kotlin Go》关于什么


    在本书中，我将使用 Kotlin 作为主要语言，从零开始创建一个 Android 应用。其核心思想是通过示例来学习语言，而不是遵循普通的参考书结构。我会停下来解释
    Kotlin 中最有用的概念和主意，并将它们与 `Java 6` 进行比较。这样，你就能看到差异在哪里，以及语言的哪些部分可以帮助你加速工作。


    这本书并不是作为语言参考书，而是 Android 开发者学习 Kotlin 并能够继续进行自己项目的工具。示例旨在解决我们作为应用开发人员在日常生活中面临的最常见问题，方法是利用
    Kotlin 的表达能力以及其他令人兴奋的工具和库。然而，本文涵盖了 Kotlin 的大部分功能，因此在阅读结束时，你将对该语言有深入的了解。


    内容非常实用，所以我建议你在电脑前跟随示例和代码，并尝试它建议的所有内容。不过，你可以先读一遍以获得大致概念，然后投入实践。


    尽管这本书现在已经完成，但我会定期对其进行回顾，以保持与新的 Kotlin 版本同步。因此，欢迎随时写信告诉我对对这本书的看法，或者哪些地方可以改进。我希望这本书成为
    Android 开发者的完美工具，因此欢迎任何帮助和建议。


    如果你正在阅读纸质版并希望接收最新的更新，请随时通过 `contact@antonioleiva.com` 向我发送邮件并附上购买证明，我将给你数字版的访问权限。这样，你将持续收到更新。如果你是从任何书店（Kindle,
    Kobo…）购买的并想获取 PDF 版本，也这样做。


    感谢你加入这个令人兴奋的项目！


    ## II. 这本书适合你吗？


    这本书旨在为对学习 Kotlin 语言感兴趣的 Android 开发者提供帮助。


    如果你处于以下情况，这本书就适合你：


    *   你具有一些 Android 开发、Android SDK 以及 Java 语言的基础知识。

    *   你想通过遵循示例来学习如何使用 Kotlin 开发 Android 应用。

    *   你需要一份指南，关于如何使用更简洁、表达力的语言来解决 Android 开发者每天面临的许多共同挑战。


    另一方面，这本书可能不适合你。以下是你在书中找不到的话题：


    *   这些页面的内容并不是 Kotlin 圣经。我会解释所有基础知识，当复杂想法出现时也会进行解释。所以你可能是通过示例学习，而不是通过方法。

    *   我不会解释如何开发 Android 应用。你不需要对平台有深入理解，但至少需要一些基础知识，如 Android Studio、`Gradle` 和
    `Java` 编程。

    *   这本书不是函数式编程指南。当然，`Java 6` 完全不是函数式的。


    ## III. 关于作者


    Antonio Leiva 是一位 Android 工程师，花费时间学习获取 Android 的新方法并撰写文章。他在 [antonioleiva.com](http://antonioleiva.com)
    编写博客，专注于帮助 Android 开发者学习 Kotlin。


    他还举办密集工作坊，参与者会将书中的内容付诸实践。在 10 小时内，人们可以从无知到能够创建自己的应用。


    Antonio 起初担任 CRM 技术的顾问，但一段时间后，在寻找真正的热情时发现了 Android 平台。在获得一些经验后，他在一家移动公司开启了新的冒险，在那里他为知名公司领导了多个项目。


    他目前在 [Plex](http://plex.tv)  Android 工程师，他在 Android 应用的设计和 UX 上也起着至关重要的作用。


    你可以在 Twitter 上的 [@lime_cl](https://twitter.com/lime_cl) 或 Google+ 上的 +AntonioLeivaGordillo
    找到 Antonio。


    ## 1 引言


    在 Google I/O 2017 上，Android 团队宣布 Kotlin 将成为开发 Android 应用的官方语言。


    这意味着，虽然仍然可以使用 `Java` 开发 Android 应用，但从现在起 Kotlin 得到了完全支持，Google 正在确保新的 Android
    特性、框架、IDE 以及他们所有的库都能与新语言无缝衔接。


    在书中，我将向你展示如何做，因此我希望我帮助你理解 Kotlin 让你领先一步并让你的代码变得更好的各种方式。


    '
- fmt: "\nHowever, before diving into the features of the language, let me tell you\
    \ just a little bit of background.\n\n### 1.1 What is Kotlin?\n\nKotlin is language\
    \ developed by [JetBrains](https://www.jetbrains.com/), a company known for building\
    \ the IntelliJ IDEA, a powerful IDE for Java development. Android Studio, the\
    \ official Android IDE, is based on IntelliJ. It was initially implemented to\
    \ run on the Java Virtual Machine.\n\nJetBrains designed Kotlin with Java developers\
    \ in mind, and with IntelliJ as its primary development IDE. These two factors\
    \ are breaking points that made Android developers quickly adopt the language:\n\
    \n* `Kotlin is very intuitive and easy to learn for Java developers`. Most parts\
    \ of the language are very similar to what we already know, and the differences\
    \ can be mastered in no time.\n\n* `We have total integration with our daily IDE\
    \ for free`. Android Studio can understand, compile and run Kotlin code. Moreover,\
    \ the support for this language comes from the company who develops the IDE, so\
    \ we Android developers are first-class citizens.\n\nHowever, this is only related\
    \ to how the language integrates with our tools. What are the advantages of the\
    \ language when compared to Java 6?\n\n* `It is more expressive`: this is one\
    \ of its main points. You can write more with much less code.\n\n* `It is safer`:\
    \ Kotlin is null safe, which means that we deal with possible null situations\
    \ at compile time, to prevent execution time exceptions. We need to specify that\
    \ an object can be null explicitly, and then check its nullity before using it.\
    \ You can save much time debugging null pointer exceptions and fixing nullity\
    \ bugs.\n\n* `It is functional`: Kotlin is fundamentally an object-oriented language,\
    \ not a pure functional language. However, like many other modern languages, it\
    \ uses many concepts from functional programming, such as lambda expressions,\
    \ to solve some problems more naturally. Another nice feature is the way it deals\
    \ with collections.\n\n* `It makes use of extension functions`: This means we\
    \ can extend any class with new features even if we do not have access to the\
    \ source code.\n\n* `It is highly interoperable`: You can continue using most\
    \ libraries and code written in Java because the interoperability between both\
    \ languages is excellent. It is even possible to create mixed projects, with both\
    \ Kotlin and Java files coexisting.\n\nHowever, this is only the tip of the iceberg:\
    \ - Since Kotlin 1.1, the final version of [Kotlin JS](https://kotlinlang.org/docs/reference/js-overview.html)\
    \ was released. This new variant allows you to develop web apps using Kotlin.\
    \ - Since Kotlin 1.2, you can also create [multiplatform projects](https://kotlinlang.org/docs/reference/whatsnew12.html#multiplatform-projects-experimental).\
    \ With it, you can share code between JVM and Javascript. - As an experimental\
    \ feature, the JetBrains team has also released [Kotlin/Native](https://kotlinlang.org/docs/reference/native-overview.html),\
    \ a project that finally takes Kotlin out of the JVM. In the future, we will be\
    \ able to implement the server, the web and the Android and iOS Apps using Kotlin\
    \ for most of the code base. Also, you can try it today. - Gradle is adding support\
    \ to use Kotlin Script (a simplified version of Kotlin) to write Gradle files\
    \ instead of Groovy. The project is quickly approaching its 1.0 release.\n\nSo\
    \ you can see that the future of Kotlin is pretty promising. Learning Kotlin can\
    \ become the language of reference in many other platforms, and sharing code among\
    \ all them is undoubtedly a high selling point.\n\n### 1.2 What do we get with\
    \ Kotlin?\n\nWithout diving too deep into the Kotlin language (we will learn everything\
    \ about it throughout this book), these are some interesting features we miss\
    \ in Java:\n\n#### Expressiveness\n\nWith Kotlin, it is much easier to avoid boilerplate\
    \ because the language covers the most common patterns by default. For instance,\
    \ in Java, if we want to create a data class, we need to write (or at least generate)\
    \ this code:\n\n```java\n 1 public class Artist {\n 2     private long id;\n 3\
    \     private String name;\n 4     private String url;\n 5     private String\
    \ mbid;\n 6  \n 7     public long getId() {\n 8         return id;\n 9     }\n\
    10  \n 11     public void setId(long id) {\n 12         this.id = id;\n 13   \
    \  }\n 14  \n 15     public String getName() {\n 16         return name;\n 17\
    \     }\n 18  \n 19     public void setName(String name) {\n 20         this.name\
    \ = name;\n 21     }\n 22  \n 23     public String getUrl() {\n 24         return\
    \ url;\n 25     }\n 26  \n 27     public void setUrl(String url) {\n 28      \
    \   this.url = url;\n 29     }\n 30  \n 31     public String getMbid() {\n 32\
    \         return mbid;\n 33     }\n 34  \n 35     public void setMbid(String mbid)\
    \ {\n 36         this.mbid = mbid;\n 37     }\n 38  \n 39     @Override public\
    \ String toString() {\n 40         return \"Artist{\" +\n 41                 \"\
    id=\" + id +\n 42                 \", name='\" + name + '\\'' +\n 43         \
    \        \", url='\" + url + '\\'' +\n 44                 \", mbid='\" + mbid\
    \ + '\\'' +\n 45                 '}';\n 46     }\n 47 }\n```\n\nWith Kotlin, you\
    \ just need to make use of a data class:\n\n```kotlin\n1 data class Artist(\n\
    2     var id: Long,\n3     var name: String,\n4     var url: String,\n5     var\
    \ mbid: String)\n```\n\nThis data class auto-generates all the fields and property\
    \ accessors, as well as some useful methods such as `toString()`.\n\n#### Null\
    \ Safety\n\nWhen we use Java, a significant amount of our code is defensive. We\
    \ need to check once whether something is null before using it to prevent unexpected\
    \ Kotlin, like many other modern languages, is null-safe because the type explicitly\
    \ defines whether an object can be null using the safe call operator (written\
    \ `?`).\n\nWe can do things like this:\n\n```kotlin\n1 // This does not compile.\
    \ Artist cannot be null\n2 var notNullArtist: Artist = null\n3  \n4 // Artist\
    \ can be null\n5 var artist: Artist? = null\n6  \n7 // Will not compile, artist\
    \ could be null\n8 artist.print()\n9  \n10 // Will print only if artist != null\n\
    11 artist?.print()\n12  \n13 // Smart cast. We not need to use safe call operator\
    \ if we previously \n14 // checked nullity\n15 if (artist != null) {\n16     artist.print()\n\
    17 }\n18  \n19 // Only use it when we are sure it is not null. It throws an exception\
    \ otherwise.\n20 artist!!.print()\n21  \n22 // Use Elvis operator to give an alternative\
    \ in case the object is null.\n23 val name = artist?.name ?: \"empty\"\n```\n\n\
    #### Extension functions\n\nThanks to extension functions, you can add new functions\
    \ to any class. It is a cleaner substitute for the common utility classes we all\
    \ have in our projects. You could, for instance, add a new method to fragments\
    \ to show a toast:\n\n```kotlin\n1 fun Fragment.toast(message: CharSequence, duration:\
    \ Int = Toast.LENGTH_SHORT) {\n2     Toast.makeText(getActivity(), message, duration).show()\n\
    3 }\n```\n\nAnd then use it like this:\n\n```kotlin\n1 fragment.toast(\"Hello\
    \ world!\")\n```\n\n#### Functional support (Lambdas)\n\nWhat if, instead of having\
    \ to declare an anonymous class every time we need to implement a click listener,\
    \ we could just define what we want to do? We can indeed do it. This (and many\
    \ other interesting things) is what we get thanks to lambdas:\n\n```kotlin\n1\
    \ view.setOnClickListener { toast(\"Hello world!\") }\n```\n\nThis set of features\
    \ is only a small selection of what Kotlin can do. Now that you know some of the\
    \ many great features of the language, you may decide that this is not for you.\
    \ If you continue, we will start writing some code right away in the next chapter.\n\
    \n## 2 Getting ready\n"
  raw: "However, before diving into the features of the language, let me tell you\
    \ just a little bit of background.\n\n### 1.1 What is Kotlin?\n\nKotlin is language\
    \ developed by [JetBrains](https://www.jetbrains.com/), a company known for building\
    \ the IntelliJ IDEA, a powerful IDE for Java development. Android Studio, the\
    \ official Android IDE, is based on IntelliJ. It was initially implemented to\
    \ run on the Java Virtual Machine.\n\nJetBrains designed Kotlin with Java developers\
    \ in mind, and with IntelliJ as its primary development IDE. These two factors\
    \ are breaking points that made Android developers quickly adopt the language:\n\
    \n*   **Kotlin is very intuitive and easy to learn for Java developers**. Most\
    \ parts of the language are very similar to what we already know, and the differences\
    \ can be mastered in no time.\n\n*   **We have total integration with our daily\
    \ IDE for free**. Android Studio can understand, compile and run Kotlin code.\
    \ Moreover, the support for this language comes from the company who develops\
    \ the IDE, so we Android developers are first-class citizens.\n\nHowever, this\
    \ is only related to how the language integrates with our tools. What are the\
    \ advantages of the language when compared to Java 6?\n\n*   ** It is more expressive**:\
    \ this is one of its main points. You can write more with much less code.\n\n\
    *   ** It is safer**: Kotlin is null safe, which means that we deal with possible\
    \ null situations at compile time, to prevent execution time exceptions. We need\
    \ to specify that an object can be null explicitly, and then check its nullity\
    \ before using it. You can save much time debugging null pointer exceptions and\
    \ fixing nullity bugs.\n\n*   ** It is functional**: Kotlin is fundamentally an\
    \ object-oriented language, not a pure functional language. However, like many\
    \ other modern languages, it uses many concepts from functional programming, such\
    \ as lambda expressions, to solve some problems more naturally. Another nice feature\
    \ is the way it deals with collections.\n\n*   **It makes use of extension functions**:\
    \ This means we can extend any class with new features even if we do not have\
    \ access to the source code.\n\n*   ** It is highly interoperable**: You can continue\
    \ using most libraries and code written in Java because the interoperability between\
    \ both languages is excellent. It is even possible to create mixed projects, with\
    \ both Kotlin and Java files coexisting.\n\nHowever, this is only the tip of the\
    \ iceberg: - Since Kotlin 1.1, the final version of [Kotlin JS](https://kotlinlang.org/docs/reference/js-overview.html)\
    \ was released. This new variant allows you to develop web apps using Kotlin.\
    \ - Since Kotlin 1.2, you can also create [multiplatform projects](https://kotlinlang.org/docs/reference/whatsnew12.html#multiplatform-projects-experimental).\
    \ With it, you can share code between JVM and Javascript. - As an experimental\
    \ feature, the JetBrains team has also released [Kotlin/Native](https://kotlinlang.org/docs/reference/native-overview.html),\
    \ a project that finally takes Kotlin out of the JVM. In the future, we will be\
    \ able to implement the server, the web and the Android and iOS Apps using Kotlin\
    \ for most of the code base. Also, you can try it today. - Gradle is adding support\
    \ to use Kotlin Script (a simplified version of Kotlin) to write Gradle files\
    \ instead of Groovy. The project is quickly approaching its 1.0 release.\n\nSo\
    \ you can see that the future of Kotlin is pretty promising. Learning Kotlin can\
    \ become the language of reference in many other platforms, and sharing code among\
    \ all them is undoubtedly a high selling point.\n\n### 1.2 What do we get with\
    \ Kotlin?\n\nWithout diving too deep into the Kotlin language (we will learn everything\
    \ about it throughout this book), these are some interesting features we miss\
    \ in Java:\n\n#### Expressiveness\n\nWith Kotlin, it is much easier to avoid boilerplate\
    \ because the language covers the most common patterns by default. For instance,\
    \ in Java, if we want to create a data class, we need to write (or at least generate)\
    \ this code:\n\n```\n 1 public class Artist {\n 2     private long id;\n 3   \
    \  private String name;\n 4     private String url;\n 5     private String mbid;\n\
    \ 6  \n 7     public long getId() {\n 8         return id;\n 9     }\n10  \n11\
    \     public void setId(long id) {\n12         this.id = id;\n13     }\n14  \n\
    15     public String getName() {\n16         return name;\n17     }\n18  \n19\
    \     public void setName(String name) {\n20         this.name = name;\n21   \
    \  }\n22  \n23     public String getUrl() {\n24         return url;\n25     }\n\
    26  \n27     public void setUrl(String url) {\n28         this.url = url;\n29\
    \     }\n30  \n31     public String getMbid() {\n32         return mbid;\n33 \
    \    }\n34  \n35     public void setMbid(String mbid) {\n36         this.mbid\
    \ = mbid;\n37     }\n38  \n39     @Override public String toString() {\n40   \
    \      return \"Artist{\" +\n41                 \"id=\" + id +\n42           \
    \      \", name='\" + name + '\\'' +\n43                 \", url='\" + url + '\\\
    '' +\n44                 \", mbid='\" + mbid + '\\'' +\n45                 '}';\n\
    46     }\n47 }\n```\n\nWith Kotlin, you just need to make use of a data class:\n\
    \n```\n1 data class Artist(\n2     var id: Long, \n3     var name: String, \n\
    4     var url: String, \n5     var mbid: String)\n```\n\nThis data class auto-generates\
    \ all the fields and property accessors, as well as some useful methods such as\
    \ `toString()`. You also get `equals()` and `hashCode()` for free, which are very\
    \ verbose and can be dangerous if they are incorrectly implemented.\n\n#### Null\
    \ Safety\n\nWhen we use Java, a significant amount of our code is defensive. We\
    \ need to check once and another whether something is null before using it to\
    \ prevent unexpected *NullPointerException*. Kotlin, like many other modern languages,\
    \ is null-safe because the type explicitly defines whether an object can be null\
    \ by using the safe call operator (written `?`).\n\nWe can do things like this:\n\
    \n```\n 1 // This does not compile. Artist cannot be null\n 2 var notNullArtist:\
    \ Artist = null\n 3  \n 4 // Artist can be null\n 5 var artist: Artist? = null\n\
    \ 6  \n 7 // Will not compile, artist could be null and we need to deal with that\n\
    \ 8 artist.print()\n 9  \n10 // Will print only if artist != null\n11 artist?.print()\n\
    12  \n13 // Smart cast. We don not need to use safe call operator if we previously\
    \ \n14 // checked nullity\n15 if (artist != null) {\n16     artist.print()\n17\
    \ }\n18  \n19 // Only use it when we are sure it is not null. It throws an exception\
    \ otherwise.\n20 artist!!.print()\n21  \n22 // Use Elvis operator to give an alternative\
    \ in case the object is null.\n23 val name = artist?.name ?: \"empty\"\n```\n\n\
    #### Extension functions\n\nThanks to extension functions, you can add new functions\
    \ to any class. It is a cleaner substitute for the common utility classes we all\
    \ have in our projects. You could, for instance, add a new method to fragments\
    \ to show a toast:\n\n```\n1 fun Fragment.toast(message: CharSequence, duration:\
    \ Int = Toast.LENGTH_SHORT) {\n2     Toast.makeText(getActivity(), message, duration).show()\n\
    3 }\n```\n\nAnd then use it like this:\n\n```\n1 fragment.toast(\"Hello world!\"\
    )\n```\n\n#### Functional support (Lambdas)\n\nWhat if, instead of having to declare\
    \ an anonymous class every time we need to implement a click listener, we could\
    \ just define what we want to do? We can indeed do it. This (and many other interesting\
    \ things) is what we get thanks to lambdas:\n\n```\n1 view.setOnClickListener\
    \ { toast(\"Hello world!\") }\n```\n\nThis set of features is only a small selection\
    \ of what Kotlin can do to simplify your code. Now that you know some of the many\
    \ great features of the language, you may decide that this is not for you. If\
    \ you continue, we will start writing some code right away in the next chapter.\n\
    \n## 2 Getting ready"
