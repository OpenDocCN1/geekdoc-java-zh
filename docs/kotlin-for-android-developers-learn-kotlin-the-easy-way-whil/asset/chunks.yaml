  trans: "\n\n要使用它，你需要一个特殊的 `import`（就是我在下面写的这一个），但 IDE 可以为你写好 import：\n\n```\n1 import\
    \ kotlinx.android.synthetic.main.activity_main.*\n```\n\n新的 Android Studio Activity\
    \ 模板现在通过使用 `include` 标签包含了嵌套布局。重要的一点是，你必须为你使用的每个 XML 添加对应的合成导入（synthetic import）：\n\
    \n```\n1 import kotlinx.android.synthetic.main.activity_main.*\n2 import kotlinx.android.synthetic.main.content_main.*\n\
    ```\n\n正如我上面提到的，生成的代码包含一个视图缓存（view cache）。因此，如果你再次请求该视图，就不需要再次调用 `findViewById`。让我们来看看它在后台执行了什么。\n\
    \n### Kotlin Android 扩展背后的魔法\n\n当你开始学习 Kotlin 时，理解在使用新特性时生成的字节码是有帮助的。这种做法有助于你理解所做决策背后的隐藏成本。\n\
    \n在 `Tools –> Kotlin` 下有一个操作叫做 `Show Kotlin Bytecode`（显示 Kotlin 字节码）。点击这里，你可以看到打开的类文件编译时生成的字节码。\n\
    \n字节码对大多数人类来说没有帮助，但这里还有另一个选项：`Decompile`（反编译）。\n\n此部分显示了 Kotlin 生成的字节码的 Java 表示。这样，你就可以将\
    \ Java 等效代码与编写的 Kotlin 代码进行对比。\n\n我将将其此于上一个示例 Activity，看看 Kotlin Android 扩展生成的代码。\n\
    \n有趣的部分是这一个：\n\n```\n 1 ...\n 2 public View _$_findCachedViewById(int var1) {\n\
    \ 3    if(this._$_findViewCache == null) {\n 4       this._$_findViewCache = new\
    \ HashMap();\n 5    }\n 6 \n 7    View var2 = (View)this._$_findViewCache.get(Integer.valueOf(var1));\n\
    \ 8    if(var2 == null) {\n 9       var2 = this.findViewById(var1);\n10      \
    \ this._$_findViewCache.put(Integer.valueOf(var1), var2);\n11    }\n12 \n13  \
    \  return var2;\n14 }\n15 \n16 public void _$_clearFindViewByIdCache() {\n17 \
    \   if(this._$_findViewCache != null) {\n 18       this._$_findViewCache.clear();\n\
    19    }\n20 \n21 }\n```\n\n这就是我们讨论过的视图缓存。当请求一个视图时，它会尝试在缓存中查找。如果那里没有，它会使用 `findViewById`\
    \ 并将其添加到缓存中。确实非常简单。\n\n此外，它还添加了一个清除缓存的函数：`clearFindViewByIdCache()`。你可以在重建视图时使用它，因为旧视图已经不再有效了。那么这一行：\n\
    \n```\n1 welcomeMessage.text = \"Hello Kotlin!\"\n```\n\n被转换为：\n\n```\n1 ((TextView)this._$_findCachedViewById(id.welcomeMessage))\n\
    2     .setText((CharSequence)\"Hello Kotlin!\");\n```\n\n所以属性并不是真实的，插件并没有为每个视图生成属性。它在编译期间替换代码以访问视图缓存，将其转换为正确的类型并调用方法。\n\
    \n### Fragment 中的 Kotlin Android Extensions\n\nFragment 也可以使用这个插件。Fragment 的问题在于，视图可以在\
    \ Fragment 实例存活的同时重建。那时会发生什么？这意味着缓存中的视图将不再有效。\n\n让我们看看使用 Fragment 时生成的代码。我正在创建这个简单的\
    \ Fragment，它使用了我上面写的同一个 XML：\n\n```\n 1 class Fragment : Fragment() {\n 2 \n 3\
    \     override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?,\
    \ \n 4             savedInstanceState: Bundle?): View? {\n 5         return inflater.inflate(R.layout.fragment,\
    \ container, false)\n 6     }\n 7 \n 8     override fun onViewCreated(view: View?,\
    \ savedInstanceState: Bundle?) {\n 9         super.onViewCreated(view, savedInstanceState)\n\
    10         welcomeMessage.text = \"Hello Kotlin!\"\n11     }\n12 }\n```\n\n在 `onViewCreated`\
    \ 中，我更改了 `TextView` 的文本。生成的字节码呢？一切与 Activity 中一样，只有这个细微的区别：\n\n```\n1 // $FF:\
    \ synthetic method\n2 public void onDestroyView() {\n3    super.onDestroyView();\n\
    4    this._$_clearFindViewByIdCache();\n5 }\n```\n\n当视图销毁时，该方法会调用 `clearFindViewByIdCache`，所以在这里是安全的。\n\
    \n### 自定义 View 中的 Kotlin Android extensions\n\n在自定义 View 上的工作方式非常相似。假设我们有这样一个视图：\n\
    \n```\n 1 <merge xmlns:android=\"http://schemas.android.com/apk/res/android\"\n\
    \ 2               android:orientation=\"vertical\"\n 3               android:layout_width=\"\
    match_parent\"\n 4               android:layout_height=\"match_parent\">\n 5 \n\
    \ 6     <ImageView\n 7         android:id=\"@+id/itemImage\"\n 8         android:layout_width=\"\
    match_parent\"\n 9         android:layout_height=\"200dp\"/>\n10 \n 11     <TextView\n\
    \ 12         android:id=\"@+id/itemTitle\"\n 13         android:layout_width=\"\
    match_parent\"\n14         android:layout_height=\"wrap_content\"/>\n15 \n16 </merge>\n\
    ```\n\n```\n1 class CustomView @JvmOver constructor(2         context: Context,\
    \ attrs: AttributeSet? = null,\n3 defStyleAttr: Int = 0\n4 ) : LinearLayout(context,\
    \ attrs, defStyleAttr) {\n 5 \n6     init {\n 7         LayoutInflater.from(context).inflate(R.layout.custom,\
    \ this, true)\n 8         itemTitle.text = \"Hello Kotlin!\"\n9     }\n10 }\n\
    ```\n\n### 从另一个视图恢复视图\n\nKotlin Extensions 提供的另一种方案是从另一个视图使用属性。我正在使用一个与上一节非常相似的布局。假设它在适配器中加载。你也可以通过使用此插件直接访问子视图：\n\
    \n```\n1 val itemView = ...\n2 itemView.itemImage.setImageResource(R.drawable.image)\n\
    3 itemView.itemTitle.text = \"My Text\"\n```\n\n插件还会帮助你填充 `import`。检查这一个不同：\n\n\
    ```\n1 import kotlinx.android.synthetic.main.view_item.view.*\n```\n\n关于这一点你需要了解几点：\n\
    \n*   在编译时，你可以从任何其他视图引用任何视图。这意味着你可能会引用一个并不是它的直接子元素的视图。当然，在运行时尝试恢复不存在的视图时会崩溃。\n\
    *   在这种情况下，视图是不被缓存的，这与 `Activities` 和 `Fragments` 不同。\n\n"
- fmt: "\nThis `experimental` flag means that the API is not final, so it can change\
    \ in the future.\n\n### View cache on a ViewHolder (or any custom classes)\n\n\
    You can now build a cache on any classes in a simple way. The only requisite is\
    \ that your class implements the `LayoutContainer` interface. This interface provides\
    \ the view that the plugin uses to find the subviews. Imagine we have a `ViewHolder`\
    \ that is holding a view with the layout described in the previous examples. The\
    \ required code is:\n\n```\n1 class ViewHolder(override val containerView: View)\
    \ \n2         : RecyclerView.ViewHolder(containerView), LayoutContainer {\n3 \n\
    4     fun bind(title: String) {\n5         itemTitle.text = \"Hello Kotlin!\"\n\
    6     }\n7 }\n```\n\nThe `containerView` is the one we are overriding from the\
    \ `LayoutContainer` interface, and that is all you need. From now on, you can\
    \ access the views directly, no need of prepending `itemView` to get access to\
    \ the subviews.\n\nAgain, if you check the code generation, you will see that\
    \ it is taking the view from the cache:\n\n```\n1 ((TextView)this._$_findCachedViewById(id.itemTitle))\n\
    2     .setText((CharSequence)\"Hello Kotlin!\");\n```\n\nI have used it here on\
    \ a `ViewHolder`, but you can see this is generic enough to be used in any classes.\n\
    \n### Kotlin Android Extensions to implement Parcelable\n\nWith the new `@Parcelize`\
    \ annotation, you can effortlessly implement `Parcelable`. Simply write the annotation,\
    \ and the plugin does all the hard work:\n\n```\n1 @Parcelize\n2 class Model(val\
    \ title: String, val amount: Int) : Parcelable\n```\n\nThen, as you may know,\
    \ you can add the object to an intent:\n\n```\n1 val intent = Intent(this, DetailActivity::class.java)\n\
    2 intent.putExtra(DetailActivity.EXTRA, model)\n3 startActivity(intent)\n```\n\
    \nAnd recover the object from the intent where you need it (in this case, in the\
    \ target activity):\n\n```\n1 val model: Model = intent.getParcelableExtra(EXTRA)\n\
    ```\n\n### Customize the cache build\n\nThe last new feature included in this\
    \ experimental set is a new annotation called `@ContainerOptions`. This one allows\
    \ you to customize the way the cache is built, or even prevent a class from creating\
    \ it.\n\nBy default, it uses a `Hashmap`, as we saw before. This behavior can\
    \ be changed to use a `SparseArray` from the Android framework, which may be more\
    \ efficient under certain situations. Finally, if for some reason you want to\
    \ disable the cache for a specific class, you also have that option.\n\nHere it\
    \ is an example of how to change the cache implementation:\n\n```\n1 @ContainerOptions(CacheImplementation.SPARSE_ARRAY)\n\
    2 class MainActivity : AppCompatActivity() {\n3     ...\n4 }\n```\n\nCurrently,\
    \ the existing options are these:\n\n```\n1 public enum class CacheImplementation\
    \ {\n2     SPARSE_ARRAY,\n3     HASH_MAP,\n4     NO_CACHE;\n5 \n6     ...\n7 }\n\
    ```\n\nNow you know all the features that the Kotlin Android Extensions plugin\
    \ provides. Now, let’s use some of these features in our code.\n\n### 15.3 Refactoring\
    \ our code\n\nThe modifications we are doing to our sample app to start using\
    \ Kotlin Android Extensions are fairly simple.\n\nLet’s start with `MainActivity`.\
    \ We are currently only using a `forecast_list` view, which is an instance of\
    \ a `RecyclerView`. Let’s clean up this code.\n\nAs said before, we use the `id`\
    \ to access the views, so I am changing the `id` of the `RecyclerView` so that\
    \ it does not use underscores, but a more appropriate name for a Kotlin variable.\
    \ The XML now looks like this:\n\n```\n 1 <FrameLayout\n 2     xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n 3     android:layout_width=\"match_parent\"\
    \n 4     android:layout_height=\"match_parent\">\n 5 \n 6     <android.support.v7.widget.RecyclerView\n\
    \ 7         android:id=\"@+id/forecastList\"\n 8         android:layout_width=\"\
    match_parent\"\n 9         android:layout_height=\"match_parent\"/>\n10 \n11 </FrameLayout>\n\
    ```\nlayout/activity_main.xml\n\nAnd now we can just get rid of the `find` line.\
    \ Start writing the id of the view, and the autocomplete should help you add the\
    \ import. Otherwise, you will need to add this:\n\n```\n1 import kotlinx.android.synthetic.main.activity_main.*\n\
    ```\nui/activities/MainActivity.kt\n\nThis is the resulting code:\n\n```\n1 override\
    \ fun onCreate(savedInstanceState: Bundle?) {\n2     super.onCreate(savedInstanceState)\n\
    3     setContentView(R.layout.activity_main)\n4 \n5     forecastList.layoutManager\
    \ = LinearLayoutManager(this)\n6     ...\n7 }\n```\nui/activities/MainActivity.kt\n\
    \nThere is not much improvement because this layout only had one view. But the\
    \ `ForecastListAdapter` can also benefit from the use of this plugin. Here, we\
    \ can use the mechanism to bind the properties into a view, which will help us\
    \ to remove all the `find` code inside the `ViewHolder`.\n\nThis is the synthetic\
    \ import you will need for `item_forecast`:\n\n```\n1 import kotlinx.android.synthetic.main.item_forecast.view.*\n\
    ```\nui/adapters/ForecastListAdapter.kt\n\nNow we can find the views from `itemView`\
    \ property inside the `ViewHolder`. As I mentioned before, you can use the properties\
    \ over `itemView`, but it will crash if the view does not contain the requested\
    \ views.\n\nTo solve it, you can use the new features in Kotlin 1.1.4. First,\
    \ enable the `experimental` flag in the `build.gradle`:\n\n```\n1 androidExtensions\
    \ {\n2     experimental = true\n3 }\n```\napp/build.gradle\n\nNow update the `ViewHolder`.\
    \ You will not need to access the views through `itemView` anymore, as now the\
    \ views behave as `ViewHolder` properties. Check that the import is different:\n\
    \n```\n1 import kotlinx.android.synthetic.main.item_forecast.*\n2 \n3 class ForecastListAdapter(private\
    \ val weekForecast: ForecastList,\n4         private val itemClick: (Forecast)\
    \ -> Unit) :\n5         RecyclerView.Adapter<ForecastListAdapter.ViewHolder>()\
    \ {\n6 \n7     ...\n8 \n9     class ViewHolder(override val containerView: View,\
    \ \n10          private val itemClick: (Forecast) -> Unit)\n11         : RecyclerView.ViewHolder(containerView),\
    \ LayoutContainer {\n12 \n13         fun bindForecast(forecast: Forecast) {\n\
    14             with(forecast) {\n15                 Picasso.with(itemView.ctx).load(iconUrl).into(icon)\n\
    16                 dateText.text = date\n17                 descriptionText.text\
    \ = description\n18                 maxTemperature.text = \"${high}º\"\n19   \
    \              minTemperature.text = \"${low}º\"\n20                 itemView.setOnClickListener\
    \ { itemClick(this) }\n21             }\n22         }\n23     }\n24 }\n```\nui/adapters/ForecastListAdapter.kt\n\
    \nOur layout is pretty simple, and it will not affect performance. In any case,\
    \ remember what we talked in the section above: this is not caching the views,\
    \ which implies that each call to the bind function is doing `findViewById` under\
    \ the hood for its views.\n\nI did a change in the XML too, so that the names\
    \ of the views are different from the properties in `Forecast`. Otherwise you\
    \ will have issues to refer to them.\n"
