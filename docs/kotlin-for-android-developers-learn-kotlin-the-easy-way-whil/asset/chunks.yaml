    \ you can learn a good deal of Kotlin from them:\n\n```\n1 public fun <T> use(f:\
    \ SQLiteDatabase.() -> T): T {\n2     try {\n3         return openDatabase().f()\n\
    4     } finally {\n5         closeDatabase()\n6     }\n7 }\n```\n\nFirst, `use`\
    \ receives a function and uses it as an extension function for `SQLiteDatabase`.\
    \ Thanks to extensions, we can use `this` inside the braces, and this is referring\
    \ to the `SQLiteDatabase` object. This extension function can return a value,\
    \ so we could do something like this:\n\n```\n1 val result = forecastDbHelper.use\
    \ {\n2     val queriedObject = ...\n3     queriedObject\n4 }\n```\n\nKeep in mind\
    \ that, inside a function, the last line represents the returned value. As `T`\
    \ does not have any restrictions, we can return any value. Even `Unit` if we do\
    \ not want to return anything.\n\nBy using a `try-finally`, the `use` function\
    \ makes sure that the database is closed no matter the extended function succeeds\
    \ or crashes.\n\nBesides, we have a lot of other handy extension functions over\
    \ `SqliteDatabase` that we will use later. For now, let’s define the database\
    \ tables and implement the `SqliteOpenHelper`.\n\n### 17.2 Tables definition\n\
    \nLet’s create a couple of objects that represent our tables. These objects will\
    \ be helpful to avoid misspelling table or column names and repetition. We need\
    \ two tables: one that saves the info of the city, and the other one the forecast\
    \ for individual days. This second table has a foreign key to the first one.\n\
    \n`CityForecastTable` first provides the name of the table and then the set of\
    \ columns it needs: an `id` (which is the zip code of the city), the name of the\
    \ city and the country.\n\n```\n1 object CityForecastTable {\n2     const val\
    \ NAME = \"CityForecast\"\n3     const val ID = \"_id\"\n4     const val CITY\
    \ = \"city\"\n5     const val COUNTRY = \"country\"\n6 }\n```\n\ndata/db/Tables.kt\n\
    \n`DayForecast` has some more info, so it requires the set of columns you can\
    \ see below. The last column, `cityId`, keeps the id of the `CityForecast` where\
    \ this forecast belongs.\n\n```\n 1 object DayForecastTable {\n 2     const val\
    \ NAME = \"DayForecast\"\n 3     const val ID = \"_id\"\n 4     const val DATE\
    \ = \"date\"\n 5     const val DESCRIPTION = \"description\"\n 6     const val\
    \ HIGH = \"high\"\n 7     const val LOW = \"low\"\n 8     const val ICON_URL =\
    \ \"iconUrl\"\n 9     const val CITY_ID = \"cityId\"\n10 }\n```\n\ndata/db/Tables.kt"
