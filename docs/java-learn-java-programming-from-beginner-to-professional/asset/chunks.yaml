    Encapsulation in Java


    Encapsulation is a fundamental concept in Object-Oriented Programming (OOP) that
    is used to bundle data (attributes) and methods (functions) that operate on the
    data into a single unit or class. Encapsulation also involves restricting direct
    access to some of the object''s components, which helps in protecting the integrity
    of the data.


    Key Aspects of Encapsulation


    1\. Private Fields: Attributes of a class should be marked as private to restrict
    direct access from outside the class.


    2\. Public Methods: Provide public methods to get (access) and set (modify) the
    private attributes. These methods are known as getters and setters.


    3\. Data Hiding: Prevent direct modification of the fields from outside the class
    to ensure the object''s state is controlled and validated.


    Implementing Encapsulation


    Here’s a step-by-step guide to implementing encapsulation in Java: 1. Define Private
    Fields: Use the private access modifier to define fields within a class.


    This restricts access to these fields from outside the class.


    2\. Provide Public Getter and Setter Methods: Define public methods to provide
    controlled access to the private fields. The getter method allows reading the
    value, and the setter method allows modifying it.


