  trans: "\n\n# HashSet\n\n- **目的**：`HashSet` 是一种 `Set` 的实现，以无序的方式存储唯一元素。\n- **排序**：不维护任何顺序。\n\
    - **空值**：允许存储单个 `null` 元素。\n- **性能**：基本操作提供 `O(1)` 时间复杂度。\n\n## 内部工作原理\n- `HashSet`\
    \ 内部使用 `HashMap`，集合的元素被存储为 `HashMap` 的键（key），而关联的值是一个常量对象。\n\n225\n![](img/image_rsrc3VV.jpg)\n\
    \n### 示例\n226\n![](img/image_rsrc3VW.jpg)![](img/image_rsrc3VX.jpg)\n\n### 输出\n\
    - 实现了 `Set` 接口。\n- 使用哈希表进行存储。\n- 不允许重复元素。\n\n### 示例\n227\n\n### 练习题\n- **任务**：创建一个\
    \ `HashSet` 来存储用户访问过的唯一城市。编写方法来：\n  1. 添加一个城市。\n  2. 检查某个城市是否被访问过。\n  3. 从集合中移除一个城市。\n\
    \  4. 打印所有访问过的城市。\n\n该练习题的解决方案涉及如何使用 `HashSet` 存储用户访问过的唯一城市。该解决方案包含了添加城市、检查城市是否被访问、从集合中移除城市以及打印所有访问过的城市的方法。\n\
    \n228\n![](img/image_rsrc3VY.jpg)\n229\n\n### 解析\n1. `visitedCities HashSet`:\n\
    \   - 使用 `HashSet` 来存储用户访问的城市名称。由于 `HashSet` 只允许唯一元素，它会自动防止重复城市出现。\n2. **方法**：\n\
    \   - `addCity(String city)`：向 `HashSet` 添加一个城市。如果该城市已在集合中，则不会再次添加，并会显示消息指示该城市已被访问。\n\
    \   - `hasVisited(String city)`：检查某个城市是否在 `HashSet` 中，如果是则返回 `true`，否则返回 `false`。\n\
    \   - `removeCity(String city)`：从 `HashSet` 中移除一个城市。如果未找到该城市，则会提示未找到。\n   - `printAllCities()`：打印所有已添加到\
    \ `HashSet` 中的城市。\n3. **主方法 (Main Method)**：\n   - 通过添加城市、检查城市是否访问、移除城市以及打印所有访问过的城市来演示其功能。\n\
    \n230\n![](img/image_rsrc3VZ.jpg)\n\n### 输出\n当运行程序时，输出将是：\n```\n此程序展示了如何使用 HashSet\
    \ 管理唯一城市集合，确保不存储重复项，并提供添加、检查、移除和列出城市等基本操作。\n```\n231\n\n# TreeSet\n\n## 概述\n-\
    \ `TreeSet` 是一种实现了 `NavigableSet` 接口并存储唯一元素的数据结构。\n- 它由 `TreeMap` 支持，这意味着元素被存储在红黑树中。\n\
    - **排序**：保持元素按升序排列。\n\n## 关键特性\n- **重复项**：不允许重复元素。\n- **空值**：不允许 `null` 元素。\n\
    - **性能**：`add()`、`remove()`、`contains()` 等操作的时间复杂度为 `O(log n)`。\n\n## 常用方法\n-\
    \ `add(E e)`：如果指定的元素尚不存在，则将其添加到此集合中。\n- `remove(Object o)`：如果指定的元素存在，则将其从此集合中移除。\n\
    - `contains(Object o)`：如果此集合包含指定的元素，则返回 `true`。\n- `first()`：返回第一个（最低的）元素。\n-\
    \ `last()`：返回最后一个（最高的）元素。\n- `subSet(E fromElement, E toElement)`：返回此集合中元素从 `fromElement`\
    \ 到 `toElement` 之间的部分的视图。\n\n232\n![](img/image_rsrc3W0.jpg)\n\n### 使用 TreeSet\
    \ 的示例\n233\n![](img/image_rsrc3W1.jpg)\n\n### 输出\n\n## 主要区别\n- **排序**：\n  - `HashMap`\
    \ 和 `HashSet` 不保证顺序。\n  - `TreeMap` 和 `TreeSet` 保持元素的排序顺序。\n- **性能**：\n  - `HashMap`\
    \ 和 `HashSet` 的基本操作提供平均 `O(1)` 时间复杂度。\n  - `TreeMap` 和 `TreeSet` 的操作提供 `O(log\
    \ n)` 时间复杂度。\n- **空值处理**：\n  - `HashMap`：允许一个 `null` 键和多个 `null` 值。\n  - `TreeMap`：不允许\
    \ `null` 键。\n  - `HashSet`：允许一个 `null` 元素。\n  - `TreeSet`：不允许 `null` 元素。\n\n234\n\
    \n## 结论\n选择这些数据结构取决于你的应用程序的需求。\n当你需要快速访问元素且不关心顺序时，使用 `HashMap` 或 `HashSet`。当你需要元素排序时，请选择\
    \ `TreeMap` 或 `TreeSet`。理解这些差异对于优化 Java 程序的性能和功能至关重要。\n\n## 概述\n- **目的**：`TreeSet`\
    \ 是一种 `Set` 的实现，以排序的方式存储唯一元素。\n- **排序**：维护自然顺序或由 `Comparator` 指定的自定义顺序。\n- **空值**：不允许\
    \ `null` 元素。\n- **性能**：基本操作提供 `O(log n)` 时间复杂度。\n\n## 内部工作原理\n- `TreeSet` 内部使用\
    \ `TreeMap` 来存储其元素。元素存储在 `TreeMap` 中，以排序的方式存储。\n\n235\n![](img/image_rsrc3W4.jpg)\n\
    \n### 示例\n- 实现了 `Set` 接口。\n- 使用哈希表进行存储。\n- 不允许重复元素。\n\n236\n![](img/image_rsrc3W5.jpg)\n\
    \n### 示例\n237\n![](img/image_rsrc3W6.jpg)\n\n### 输出\n\n### 练习题\n- **任务**：创建一个\
    \ `HashSet` 来存储用户访问过的唯一城市。编写方法来：\n  1. 添加一个城市。\n  2. 检查某个城市是否被访问过。\n  3. 从集合中移除一个城市。\n\
    \  4. 打印所有访问过的城市。\n\n该练习题的解决方案涉及如何使用 `HashSet` 存储用户访问过的唯一城市。该解决方案包含了添加城市、检查城市是否被访问、从集合中移除城市以及打印所有访问过的城市的方法。\n\
    \n238\n![](img/image_rsrc3W7.jpg)\n239\n\n### 解析\n1. `visitedCities HashSet`:\n\
    \   - 使用 `HashSet` 来存储用户访问的城市名称。由于 `HashSet` 只允许唯一元素，它会自动防止重复城市出现。\n2. **方法**：\n\
    \   - `addCity(String city)`：向 `HashSet` 添加一个城市。如果该城市已在集合中，则不会再次添加，并会显示消息指示该城市已被访问。\n\
    \   - `hasVisited(String city)`：检查某个城市是否在 `HashSet` 中，如果是则返回 `true`，否则返回 `false`。\n\
    \   - `removeCity(String city)`：从 `HashSet` 中移除一个城市。如果未找到该城市，则会提示未找到。\n   - `printAllCities()`：打印所有已添加到\
    \ `HashSet` 中的城市。\n3. **主方法 (Main Method)**：\n   - 通过添加城市、检查城市是否访问、移除城市以及打印所有访问过的城市来演示其功能。\n\
    \n240\n![](img/image_rsrc3W8.jpg)\n\n### 输出\n当您运行程序时，输出将是：\n```\n此程序展示了如何使用 HashSet\
    \ 管理唯一城市集合，确保不存储重复项，并提供添加、检查、移除和列出城市等基本操作。\n```\n241\n\n# 第 11 章：Java 中的迭代器和增强\
    \ for 循环\n\n在 Java 中，`Iterator` 和增强 for 循环（也称为 for-each 循环）是用于遍历或迭代集合（如 `List`、`Set`\
    \ 和 `Map`）的工具。理解如何有效地使用这些工具是关键。\n\n## 1. 迭代器 (Iterator)\n\n### 概述\n- `Iterator`\
    \ 是 Java 中的一个接口，提供逐个遍历集合元素的方法。\n- `Iterator` 是集合框架的通用游标。\n- 当你需要在迭代时移除元素时，它特别有用。\n\
    \n### Iterator 接口中的关键方法\n- `hasNext()`：如果还有更多元素可以迭代，则返回 `true`。\n- `next()`：返回迭代的下一个元素。\n\
    - `remove()`：从集合中移除上一次由 `next()` 方法返回的元素。\n\n242\n![](img/image_rsrc9.jpg)\n\n\
    ### 使用 Iterator 的优点\n- **迭代移除**：`Iterator` 允许在迭代时安全地移除元素，这是增强 for 循环无法实现的。\n-\
    \ **通用游标**：`Iterator` 适用于大多数集合类（`List`、`Set`、`Map` 等）。\n\n### 使用 Iterator 的缺点\n\
    - **冗长性**：与增强 for 循环相比，需要的代码更多。\n- **单向遍历**：`Iterator` 只能向前移动。如果需要反向遍历，应该使用 `ListIterator`。\n\
    \n## 2. 增强 for 循环 (Enhanced ForLoop)\n\n### 概述\n- 增强 for 循环是一种用于遍历数组和集合的简化循环。\n\
    - 它是在 Java 5 中引入的，作为一种更具读性且更不易出错的迭代元素的方式。\n\n"
