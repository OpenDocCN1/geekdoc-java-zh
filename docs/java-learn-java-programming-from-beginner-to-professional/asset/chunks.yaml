    ### Constructor Chaining in Java


    Constructor Chaining in `Java` is a process of calling one constructor from another
    constructor within the same class or from a constructor in a subclass. This allows
    for a more efficient way to initialize an object with multiple constructors, reducing
    code duplication and enhancing maintainability.


    #### Types of Constructor Chaining


    1. Within the Same Class: Using `this()`

    2. From a Subclass: Using `super()`


    #### 1 Constructor Chaining Within the Same Class


    When you have multiple constructors in the same class, you can call one constructor
    from another using the `this()` keyword. This approach helps in reusing constructor
    code and keeping initialization logic in one place.


