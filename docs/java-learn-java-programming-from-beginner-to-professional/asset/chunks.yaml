    # Polymorphism in Java


    Polymorphism is one of the four fundamental concepts of Object-Oriented Programming
    (OOP). It allows objects to be treated as instances of their parent class rather
    than their actual class. The two main types of polymorphism in `Java` are:


    1. Compile-Time Polymorphism (Method Overloading)

    2. Run-Time Polymorphism (Method Overriding)


    #### Key Concepts


    1. Method Overloading

    2. Method Overriding

    3. The `instanceof` Keyword

    4. Dynamic Method Dispatch


    #### 1 Method Overloading (Compile-Time Polymorphism)


    Method overloading allows a class to have more than one method with the same name,
    but different parameters. The methods are resolved at compile time.


