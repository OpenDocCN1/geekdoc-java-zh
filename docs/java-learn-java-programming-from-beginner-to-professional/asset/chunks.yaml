    Set Interface


    The Set interface extends the Collection interface and represents a collection
    that cannot contain duplicate elements. It models the mathematical set abstraction.


    Key Implementations:


    • HashSet: Stores elements in a hash table and does not guarantee any specific
    order of elements.


    • LinkedHashSet: Maintains a linked list of the entries in the set, in the order
    in which they were inserted.


    • TreeSet: Implements the NavigableSet interface, using a tree for storage. The
    elements are ordered using their natural ordering or a custom comparator.


    Common Methods in Set:


    • add(E e): Adds the specified element to the set if it is not already present.


    • contains(Object o): Returns true if the set contains the specified element.


    • remove(Object o): Removes the specified element from the set if it is present.


    • size(): Returns the number of elements in the set.


    • isEmpty(): Returns true if the set contains no elements.


    Overview:


    • Unordered Collection: Set does not maintain any order of elements.


    • No Duplicates: Set does not allow duplicate elements.


    Common Implementations:


    • HashSet


    • LinkedHashSet (Maintains insertion order)


