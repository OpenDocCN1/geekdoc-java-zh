  trans: "\n多态允许方法根据其所作用的对象来执行不同的操作。\n\n这可以通过方法重载（编译时多态）和方法重写（运行时多态）来实现。\n\n## Java\
    \ 实现\n\n- **方法重载**：在同一个类中，多个具有相同名称但参数不同的方法。\n- **方法重写**：子类为其父类中已经定义的方法提供特定的实现。\n\
    \n## 示例：\n\n### 方法重载\n116\n![](img/image_rsrc3SP.jpg)\n\n### 方法重写\n117\n![](img/image_rsrc3SR.jpg)\n\
    \n# Java 中的抽象\n\n抽象是面向对象编程 (OOP) 中的一个核心概念，允许你隐藏系统复杂的实现细节，并只暴露本质特征。\n\n抽象的目标是降低复杂性，让程序员能够关注更高层次的交互，而无需理解每个组件的复杂细节。\n\
    \n在 Java 中，抽象通过以下方式实现：\n1. 抽象类\n2. 接口\n\n## 1. 抽象类\n\n**定义**：`abstract class`\
    \ 是一个无法独立实例化的类，它可能包含必须由子类实现的 `abstract methods`。`abstract methods` 是没有方法体的方法，旨在派生类中被重写。\n\
    \n**特征**：\n- 可以拥有 `abstract methods`（没有方法体的方法）。\n- 可以拥有非抽象方法（带有方法体）。\n- 可以拥有字段和构造函数。\n\
    - 可以被其他类扩展。\n\n118\n![](img/image_rsrc3SR.jpg)\n\n## 示例：\n\n### 抽象类\n119\n![](img/image_rsrc3SS.jpg)\n\
    120\n![](img/image_rsrc3ST.jpg)\n\n## 接口\n\nJava 中的 `interface` 是一种引用类型，类似于类，但只能包含常量、方法签名、默认方法、静态方法和嵌套类型。接口不能包含实例字段或构造函数。类\
    \ `implements` 一个 `interface`，从而继承接口的抽象方法。\n\n### 特征\n- 不能包含实例字段或构造函数。\n- 可以包含\
    \ `abstract methods` 以及默认/静态方法。\n- 一个类可以实现多个接口。\n\n### 接口\n121\n![](img/image_rsrc3SU.jpg)\n\
    122\n\n## 抽象的处\n\n1. **简化代码**：抽象通过隐藏实现细节并只显示必要的特征，有助于降低复杂性。\n2. **提高可维护性**：由于实现细节的更改不会影响外部接口，代码变得更容易管理和维护。\n\
    3. **促进代码复用**：通过在 `abstract classes` 或 `interfaces` 中定义通用功能，可以在多个类之间复用代码。\n4.\
    \ **增强灵活性**：允许你在更改实现方式而不影响使用这些抽象组件的代码。\n\n## 在抽象类和接口之间进行选择\n\n- **使用抽象类的情机**：\n\
    \    - 你有一个不应该被实例化的基类。\n    - 你想在相关类之间共享通用代码。\n    - 你需要提供某些方法的实现，但同时也要求某些方法是\
    \ `abstract` 的。\n- **使用接口的情机**：\n    - 你想定义一个可以被任何类实现的合约。\n    - 你需要定义必须由来自不同层次结构的多个类实现的方法。\n\
    \    - 你想支持类型多继承（一个类可以实现多个接口）。\n\nJava 中的抽象有助于管理复杂性，因为它允许你关注高层次的交互，同时隐藏实现细节。你通过\
    \ `abstract classes` 和 `interfaces` 实现抽象。抽象类提供在相关类之间共享代码的方法，并定义了必须由子类实现的 `abstract\
    \ methods`。接口定义了任何选择实现接口的类必须实现的方法，促进了灵活且可用的设计。\n\n123\n第 3 章\n\n# Java 中的方法和构造函数\n\
    \n在 Java 中，方法和构造函数是类的基本组成部分。它们定义了对象的行为以及如何初始化对象。\n\n### 方法\n\n方法是执行特定任务的代码块。它们用于定义从类创建的对象的行为。方法可以有参数、返回值，并可以被调用以对对象执行操作。\n\
    \n### 核心概念\n1. 方法声明\n2. 方法重载\n3. 方法重写\n4. 静态方法\n5. 实例方法\n6. 方法参数和返回值\n\n## 1.\
    \ 方法声明\n\n方法在类内部声明，并由以下组件组成：\n- **访问修饰符**：定义方法的可见性（例如 `public`、`private`）。\n-\
    \ **返回值**：指定方法将返回的值的类型（例如 `int`、`void`）。\n- **方法名**：方法的名称。\n- **参数**：传递给方法的可选值。\n\
    - **方法体**：调用方法时执行的代码块。\n\n124\n![](img/image_rsrc3SV.jpg)\n\n### 示例：\n\n#### 方法：\n\
    125\n![](img/image_rsrc3SW.jpg)![](img/image_rsrc3SX.jpg)\n- 执行特定任务的代码块。\n\n##\
    \ 2. 方法重载\n\n当多个方法具有相同名称但不同的参数（类型、数量或两者兼有）时，发生方法重载。它允许方法根据不同的输入执行相似的功能。\n\n**示例**：\n\
    126\n![](img/image_rsrc3SY.jpg)\n\n## 3. 方法重写\n\n当子类为其父类中已经定义的方法提供特定实现时，发生方法重写。重写的方法必须与父类中的方法具有相同的名称、返回值和参数。\n\
    \n**示例**：\n127\n![](img/image_rsrc3SZ.jpg)\n\n## 4. 静态方法\n\n静态方法属于类而不是任何特定实例。它们可以在不创建类实例的情况下被调用，并且只能访问静态字段和方法。\n\
    \n**示例**：\n128\n![](img/image_rsrc3T0.jpg)\n\n## 5. 实例方法\n\n实例方法作用于类的实例，并可以访问实例字段和方法。它们需要该类的对象才能被调用。\n\
    \n**示例**：\n129\n![](img/image_rsrc3T1.jpg)\n\n## 6. 方法参数和返回值\n\n方法可以接受参数并返回以执行操作并提供结果。\n\
    - **参数**：传入方法以提供输入数据。\n- **返回值**：指定方法将返回值的类型。如果方法没有返回值，其返回类型为 `void`。\n\n**示例**：\n\
    130\n![](img/image_rsrc3T2.jpg)\n\n# 第 4 章\n\n### 构造函数\n\n构造函数是用于创建对象时初始化对象的特殊方法。它们与类名相同，且没有返回值。\n\
    \n### 核心概念\n1. 构造函数声明\n2. 默认构造函数\n3. 参数构造函数\n4. 构造函数重载\n5. 构造函数链\n\n## 1. 构造函数声明\n\
    \n构造函数的声明名称与类名相同，且没有返回值。它在创建对象时初始化对象的状态。\n\n**示例**：\n131\n![](img/image_rsrc3T3.jpg)\n\
    \n## 2. 默认构造函数\n\n如果没有定义任何构造函数，Java 会提供一个默认构造函数，将实例变量初始化为默认值（例如，对象为 `null`，数值类型为\
    \ `0`）。\n\n**示例**：\n132\n![](img/image_rsrc3T4.jpg)\n\n## 3. 参数构造函数\n\n参数构造函数允许你使用特定值初始化对象。\n\
    \n**示例**：\n133\n\n## 4. 构造函数重载\n\n构造函数重载是 Java 中的一种技术，允许类拥有多个具有不同参数列表的构造函数。每个构造函数执行不同的任务，但构建相同类的对象。重载的构造函数通过允许不同的初始化对象的方式提供了对象创建的灵活性。\n\
