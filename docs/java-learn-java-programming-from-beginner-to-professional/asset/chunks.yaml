    ## Encapsulation in Java

    Encapsulation is a fundamental concept in Object-Oriented Programming (OOP) that
    is used to bundle data (attributes) and methods (functions) that operate on the
    data into a single unit or class. Encapsulation also involves restricting direct
    access to some of the object''s components, which helps in protecting the integrity
    of the data.


    ### Key Aspects of Encapsulation

    1. **Private Fields**: Attributes of a class should be marked as `private` to
    restrict direct access from outside the class.

    2. **Public Methods**: Provide public methods to get (access) and set (modify)
    the private attributes. These methods are known as getters and setters.

    3. **Data Hiding**: Prevent direct modification of the fields from outside the
    class to ensure the object''s state is controlled and validated.


    ### Implementing Encapsulation

    Here’s a step-by-step guide to implementing encapsulation in Java:


    1. **Define Private Fields**: Use the `private` access modifier to define fields
    within a class. This restricts access to these fields from outside the class.

    2. **Provide Public Getter and Setter Methods**: Define public methods to provide
    controlled access to the private fields. The getter method allows reading the
    value, and the setter method allows modifying it.


    ![](image_rsrc3RZ.jpg)


    ### Example of Encapsulation

    #### Class Definition with Encapsulation:

    ![](image_rsrc3S0.jpg)


    #### Using the Encapsulated Class:

    ![](image_rsrc3RZ.jpg)


    ### Benefits of Encapsulation

    1. **Control**: Encapsulation allows control over the data by providing methods
    to access and modify it. This ensures that the data is always in a valid state.

    2. **Flexibility**: Internal implementation can be changed without affecting other
    parts of the code that use the class.

    3. **Maintainability**: Encapsulation helps in keeping code organized and makes
    it easier to manage and maintain.

    4. **Increased Security**: By hiding the internal state of the object, encapsulation
    reduces the risk of unintended interference and misuse.


    Encapsulation in Java is implemented by using `private` fields and public getter
    and setter methods. This approach ensures that the internal state of an object
    is protected from unauthorized access and modification. Encapsulation enhances
    the security, maintainability, and flexibility of code by providing controlled
    access to the object''s data and behavior.


    ## Java Implementation

    * **Private Fields**: Use `private` fields to protect data from outside access.

    * **Public Methods**: Use public getter and setter methods to access and update
    the `private` fields.


