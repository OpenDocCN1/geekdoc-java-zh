    ## JavaFX 简介


    JavaFX:


    * 用于构建丰富 GUI 应用的现代 Java 框架。

    * 取代 `Swing` 和 `AWT`。

    * 支持 2D 和 3D 图形、音频和视频。


    ### 使用 JavaFX 构建 GUI


    示例：


