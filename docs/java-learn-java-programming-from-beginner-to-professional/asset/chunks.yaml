    ![](img/image_rsrc3SA.jpg)(image_rsrc3SB.jpg)

    `super` 关键字用于引用直接父类。它可以用于：

    * 调用父类的构造函数。

    * 访问父类的方法和字段。


    **调用父类构造函数：**

