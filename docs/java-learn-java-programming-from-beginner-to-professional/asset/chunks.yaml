    Map Interface


    The Map interface represents a collection of key-value pairs, where each key is
    unique. Maps are not part of the Collection interface.


    Key Implementations:


    • HashMap: A hash table-based implementation that allows null values and keys.


    • LinkedHashMap: Extends HashMap and maintains a linked list of the entries, preserving
    insertion order.


    • TreeMap: Implements the NavigableMap interface and uses a tree to store the
    keys in a sorted order.


    • Hashtable: Similar to HashMap, but synchronized and does not allow null keys
    or values.


    Common Methods in Map:


    • put(K key, V value): Associates the specified value with the specified key in
    this map.


    • get(Object key): Returns the value to which the specified key is mapped, or
    null if this map contains no mapping for the key.


    • remove(Object key): Removes the mapping for a key from this map if it is present.


    • containsKey(Object key): Returns true if this map contains a mapping for the
    specified key.


    • keySet(): Returns a Set view of the keys contained in this map.


    • values(): Returns a Collection view of the values contained in this map.


    Overview:


    • Key-Value Pair Collection: Map stores elements as key-value pairs.


    • No Duplicate Keys: Each key in a Map must be unique.


    • Keys and Values: Values can be duplicated, but keys cannot.


    Common Implementations:


    • HashMap


    • LinkedHashMap (Maintains insertion order)


    • TreeMap (Maintains sorted order by keys)


