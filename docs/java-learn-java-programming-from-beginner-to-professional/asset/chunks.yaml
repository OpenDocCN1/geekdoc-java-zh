    \n## 使用 ArrayList 的示例\n\n输出：\n\n179\n\n`List`、`Set` 和 `Map` 接口是 Java 集合框架（Collections\
    \ Framework）的一部分，它们为处理具有不同行为和特征的对象组（集合）提供了强大的工具。下面，我们将详细探讨这些每个接口，包括它们的关键特征、用法和示例。我们还包括了带有答案的练习题。\n\
    \n## List 接口\n\n### 概述：\n- **有序集合**: `List` 保持元素被插入时的顺序。\n- **允许重复**: `List` 可以包含重复元素。\n\
    - **索引访问**: 可以通过索引位置访问元素。\n\n### 常见实现：\n- `ArrayList`\n- `LinkedList`\n- `Vector`（较少使用）\n\
    \n180\n\n![](img/image_rsrc3US.jpg)\n\n### 示例\n\n181\n\n![](img/image_rsrc3UT.jpg)\n\
    \n输出\n\n### 关键方法：\n- `add(E e)`: 向列表添加一个元素。\n- `get(int index)`: 获取指定索引处的元素。\n\
    - `remove(int index)`: 移除指定索引处的元素。\n- `contains(Object o)`: 检查列表是否包含指定的元素。\n-\
    \ `size()`: 返回列表中元素的数量。\n\n182\n\n![](img/image_rsrc3UU.jpg)\n\n### 示例：\n\n183\n\
    \n## Set 接口\n\n`Set` 接口扩展了 `Collection` 接口，表示一个不能包含重复元素的集合。它模拟了数学中的集合抽象。\n\n###\
    \ 关键实现：\n- `HashSet`: 在哈希表中存储元素，不保证元素的任何特定顺序。\n- `LinkedHashSet`: 维护集合中条目的的链表，按照它们被插入的顺序排列。\n\
    - `TreeSet`: 实现 `NavigableSet` 接口，使用树进行存储。元素使用它们的自然排序或自定义比较器进行排序。\n\n### Set 中的常用方法：\n\
    - `add(E e)`: 如果指定的元素不存在，则将指定的元素添加到集合中。\n- `contains(Object o)`: 如果集合包含指定的元素，则返回\
    \ true。\n- `remove(Object o)`: 如果指定的元素存在，则从集合中移除它。\n- `size()`: 返回集合中元素的数量。\n\
    - `isEmpty()`: 如果集合不包含元素，则返回 true。\n\n### 概述：\n- **无序集合**: `Set` 不维护元素的任何顺序。\n\
    - **无重复**: `Set` 不允许重复元素。\n\n### 常见实现：\n- `HashSet`\n- `LinkedHashSet`（维护插入顺序）\n\
    - `TreeSet`（维护排序顺序）\n\n184\n\n![](img/image_rsrc3UV.jpg)!(image_rsrc3UW.jpg)\n\
    \n### 示例：使用 HashSet\n\n185\n\n![](img/image_rsrc3UX.jpg)\n\n### 示例 1\n\n186\n\n\
    ![](img/image_rsrc3UY.jpg)\n\n### 示例 2\n\n187\n\n![](img/image_rsrc3UZ.jpg)\n\n\
    输出：\n\n### 关键方法：\n- `add(E e)`: 向集合添加一个元素。\n- `remove(Object o)`: 从集合中移除指定的元素。\n\
    - `contains(Object o)`: 检查集合是否包含指定的元素。\n- `size()`: 返回集合中元素的数量。\n- `isEmpty()`:\
    \ 检查集合是否为空。\n\n188\n\n## Map 接口\n\n`Map` 接口表示键值对的集合，其中每个键都是唯一的。Maps 不属于 `Collection`\
    \ 接口。\n\n### 关键实现：\n- `HashMap`: 基于哈希表的实现，允许 null 键和空 值。\n- `LinkedHashMap`: 扩展了\
    \ `HashMap` 并维护条目的链表，保留插入顺序。\n- `TreeMap`: 实现 `NavigableMap` 接口，并使用树按排序顺序存储键。\n\
    - `Hashtable`: 与 `HashMap` 类似，但它是同步的且不允许 null 键或值。\n\n### Map 中的常用方法：\n- `put(K\
    \ key, V value)`: 在映射中将指定的值与指定的键关联。\n- `get(Object key)`: 返回指定键的映射值，如果此映射不包含该键的映射，则返回\
    \ null。\n- `remove(Object key)`: 如果键存在，则从映射中移除该键的映射。\n- `containsKey(Object key)`:\
    \ 如果此映射包含指定键的映射，则返回 true。\n- `keySet()`: 返回包含映射中键的 `Set` 视图。\n- `values()`: 返回包含映射中值的\
    \ `Collection` 视图。\n\n### 概述：\n- **键值对集合**: `Map` 以键值对的形式存储元素。\n- **无重复键**: `Map`\
    \ 中的每个键必须是唯一的。\n- **键值**: 值可以重复，但键不能。\n\n### 常见实现：\n- `HashMap`\n- `LinkedHashMap`（维护插入顺序）\n\
    - `TreeMap`（按键维护排序顺序）\n\n189\n\n![](img/image_rsrc3V0.jpg)\n\n### 使用 HashMap 的示例\n\
    \n190\n\n![](img/image_rsrc3V1.jpg)\n\n输出\n\n### 总结：\n- **List**: 一种可以包含重复元素的有序集合。可以通过索引访问元素。\n\
    - **Set**: 一种不能包含重复元素的集合。默认是无序的（`LinkedHashSet` 除外）。\n- **Map**: 一种键值对的集合，其中每个键都是唯一的。它允许根据键快速检索值。\n\
    \n191\n\n![](img/image_rsrc3V2.jpg)\n\n### 示例 1\n\n192\n\n![](img/image_rsrc3V3.jpg)\n\
    \n输出\n\n### 关键方法：\n- `put(K key, V value)`: 向映射添加一个键值对。\n- `get(Object key)`:\
    \ 获取与键关联的值。\n- `remove(Object key)`: 从映射中移除指定的键。\n- `containsKey(Object key)`:\
    \ 映射是否包含指定的键。\n- `size()`: 返回映射中键值对的数量。\n\n193\n\n![](img/image_rsrc3V4.jpg)\n\
    \n### 示例 2\n\n194\n\n![](img/image_rsrc3V5.jpg)\n\n## 练习示例\n\n### 练习 1：使用 List\n\
    \n任务：创建一个整数列表 `List` 并执行以下操作：\n1. 向列表添加数字。\n2. 移除一个数字。\n3. 检查列表是否包含特定数字。\n4. 打印列表的所有元素。\n\
    \n输出：195\n\n![](img/image_rsrc3V6.jpg)\n\n### 练习 2：使用 Set\n\n任务：创建一个颜色的字符串 `Set`\
    \ 并执行以下操作：\n1. 向集合添加颜色。\n2. 检查集合是否包含特定颜色。\n3. 移除一种颜色。\n4. 打印集合的所有颜色。\n\n输出：196\n\
    \n![](img/image_rsrc3V7.jpg)\n\n### 练习题：\n\n1. **任务**:\n   创建一个学生姓名的 `ArrayList`。添加姓名，移除特定姓名并显示列表。\n\
    \   - 答案：197\n\n![](img/image_rsrc3V8.jpg)\n\n2. **任务**:\n   创建一个书籍标题的 `HashSet`。添加标题，检查特定标题是否存在，并显示所有标题。\n\
    \   - 答案：198\n\n![](img/image_rsrc3V9.jpg)\n\n3. **任务**:\n   创建一个存储产品名称为键、价格为值的\
    \ `HashMap`。添加、更新、移除产品并显示所有条目。\n   - 答案：这些练习有助于巩固你对 `List`、`Set` 和 `Map` 接口及其常见实现的理解。199\n\
    \n## 练习：使用 Map\n\n任务：创建一个员工姓名（键）及其工资（值）的 `Map` 并执行以下操作：\n1. 将员工及其工资添加到映射中。\n2.\
    \ 更新特定员工的工资。\n3. 从映射中移除员工。\n4. 打印所有员工及其工资。\n\n答案：200\n\n![](img/image_rsrc3VA.jpg)\n\
    \n## 总结\n\n- **List**: 允许重复元素的有序集合。常见的实现有 `ArrayList` 和 `LinkedList`。\n- **Set**:\
    \ 不允许元素的无序集合。常见的实现有 `HashSet` 和 `TreeSet`。\n- **Map**: 键值对的集合，键唯一。常见的实现有 `HashMap`\
    \ 和 `TreeMap`。\n\n201\n\n这些接口及其实现为在 Java 中处理集合奠定了基础，使开发者能够根据特定需求选择最合适的数据结构。\n\n\
