    # 第 19 章：Java Web 应用


    ## Java EE 简介


    Java EE (企业版):


    * Java SE 的扩展扩展，包含了用于分布式计算和 Web 服务等企业级功能的规范。


    ### Servlets


    运行在服务器上并处理客户端请求的 Java 程序。

    扩展通过请求-响应模型访问的应用托管服务器的能力。


    示例：


    311


    ![](img/image_rsrc3YK.jpg)


    ### Java Server 页面 (JSP)


    JSP:


    * 一种帮助基于 HTML、`XML` 或其他文档类型创建动态生成网页的技术。

    * 允许在 HTML 中直接嵌入 Java 代码。


