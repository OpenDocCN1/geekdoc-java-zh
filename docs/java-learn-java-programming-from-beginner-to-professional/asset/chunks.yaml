    # 第 20 章：设计模式


    ## 设计模式简介


    设计模式：


    * 设计中常见问题的解决方案。

    * 可以分为创建模式、结构模式和行为模式。


    ### 创建模式 (Creational Patterns)


    单例模式 (Singleton):


    * 确保一个类只有一个实例并提供全局访问点。


    示例：


    314


    ![](img/image_rsrc3YP.jpg)


    工厂模式 (Factory):


    * 定义一个创建对象的接口，但允许子类更改将创建的对象类型。


    示例：构建器模式 (Builder):


    315

    * 将复杂对象的构建与其表示分离。示例：316


    ![](img/image_rsrc3YR.jpg)


    317


    ### 结构模式 (Structural Patterns)


    适配器模式 (Adapter):


    * 允许不兼容的接口协同工作。


    示例：


    318


    ![](img/image_rsrc3YS.jpg)


    319


    组合模式 (Composite):


    * 将对象组合成树结构以表示部分-整体的层次结构。


    示例：


    320


    ![](img/image_rsrc3YT.jpg)


    321


    装饰器模式 (Decorator):


    * 动态地给对象附加职责。


    示例：


    322


    ![](img/image_rsrc3YU.jpg)


    323


    ### 行为模式 (Behavioral Patterns)


    策略模式 (Strategy):


    * 定义一个算法族，封装每一个算法并使它们可以相互替。


    示例：


    324


    ![](img/image_rsrc3YV.jpg)


    325


    ![](img/image_rsrc3YW.jpg)


    观察者模式 (Observer):


    * 定义对象之间一对多的依赖关系，当一个对象的状态发生变化时，所有依赖者都会收到通知。


    示例：

    命令模式 (Command):


    * 将请求封装为对象，从而允许用队列、请求和操作对客户端进行参数化。示例：


    326


    ![](img/image_rsrc3YX.jpg)


    327


    ![](img/image_rsrc3YY.jpg)![](img/image_rsrc3YZ.jpg)


