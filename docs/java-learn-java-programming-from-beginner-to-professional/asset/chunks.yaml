    ## Serialization and Deserialization


    Serialization is the process of converting an object into a byte stream, so it
    can be saved to a file or transmitted over a network. Deserialization is the process
    of converting the byte stream back into an object.


    ### Serialization

    To serialize an object, the class must implement the `Serializable` interface.
    This interface is a marker interface, meaning it doesn’t have any methods to implement
    but indicates that the class can be serialized.


