    # Inheritance in Java

    Inheritance is one of the core principles of Object-Oriented Programming (OOP).
    It allows a new class to inherit the properties and methods of an existing class.
    The new class is known as the subclass or derived class, and the class it inherits
    from is known as the superclass or base class. Inheritance promotes code reuse
    and establishes a natural hierarchy between classes.


    ### Key Concepts of Inheritance

    1. Superclass and Subclass

    2. The `extends` Keyword

    3. Constructor Inheritance

    4. Method Overriding

    5. Accessing Superclass Methods

    6. The `super` Keyword

    7. Type Casting


    ![](image_rsrc3S2.jpg)


    ### Example of Inheritance

    Let''s consider a basic example where a superclass `Animal` is inherited by a
    subclass `Dog`.


    #### Superclass: `Animal`

    ![](image_rsrc3S3.jpg)


    #### Subclass: `Dog`


    ### Detailed Explanation

    #### 1. Superclass and Subclass

    * **Superclass**: The class whose properties and methods are inherited.

    * **Subclass**: The class that inherits the properties and methods from the superclass.

    * Superclass (`Animal` in this case) is the class whose properties and methods
    are inherited.


    ![](image_rsrc3S4.jpg)

    * Subclass (`Dog` in this case) is the class that inherits properties and methods
    from the superclass.


    **Example:**

    ![](image_rsrc3S5.jpg)(image_rsrc3S6.jpg)


    #### 2. The `extends` Keyword

    In Java, inheritance is specified using the `extends` keyword. A subclass inherits
    all accessible properties and methods from its superclass. The `extends` keyword
    is used to establish an inheritance relationship between the superclass and the
    subclass.


