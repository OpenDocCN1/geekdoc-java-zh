  trans: "\n\n# 理解 HashMap, TreeMap, HashSet, TreeSet\n\nJava 集合框架 (JCF) 提供了强大的数据结构来高效地存储和操作数据。该框架中常用的四种数据结构是\
    \ `HashMap`、`TreeMap`、`HashSet` 和 `TreeSet`。这些结构都有独特的特性、优势和权衡，使得它们适用于不同的场景。\n\n\
    ## 1. HashMap\n\n### 概述\n- `HashMap` 是一种实现了 `Map` 接口并存储键值对的数据结构。\n- 它使用哈希表进行存储，提供了快速查找、插入和删除。\n\
    - 键被哈希到桶（buckets）中，桶在哈希表的位置由键的 `hashCode` 决定。\n\n### 主要特性\n- **顺序**：`HashMap`\
    \ 不保证元素的任何特定顺序。\n- **空值**：允许一个 null 键和多个 null 值。\n- **性能**：`get()`、`put()`、`remove()`\
    \ 等操作的平均时间复杂度为 `O(1)`。\n\n### 常用方法\n- `put(K key, V value)`：将指定的值与此映射中的指定键关联。\n\
    - `get(Object key)`：返回指定键的映射值。\n- `remove(Object key)`：移除指定键的映射。\n- `containsKey(Object\
    \ key)`：如果此映射包含到指定键的映射，则返回 true。\n- `keySet()`：返回此映射包含的键的 `Set` 视图。\n- `values()`：返回此映射包含的映射的\
    \ `Collection` 视图。\n\n![](img/image_rsrc3VB.jpg)\n\n### HashMap 使用示例\n![](img/image_rsrc3VC.jpg)\n\
    \n### 输出\n![](img/image_rsrc3VD.jpg)\n\n### 示例：\n![](img/image_rsrc3VE.jpg)\n\n\
    ### 输出\n\n### 练习题 1\n- **任务**：创建一个 `HashMap` 来存储学生姓名及其成绩。编写方法来实现：\n  1. 添加学生及其成绩。\n\
    \  2. 根据学生姓名检索成绩。\n  3. 更新学生的成绩。\n  4. 从 `HashMap` 中删除学生。\n  5. 打印所有学生及其成绩。\n\n\
    ### 答案 1\n该方案包含了添加学生及其成绩、根据学生姓名检索成绩、更新学生成绩、删除学生以及打印所有学生及其成绩的方法。\n\n![](img/image_rsrc3VF.jpg)\n\
    \n### 解释\n1. **studentGrades HashMap**：\n   - 使用 `HashMap` 存储学生姓名（作为键）和成绩（作为值）。\n\
    2. **方法**：\n   - `addStudent(String name, int grade)`：将学生的姓名和成绩添加到 `HashMap` 中。\n\
    \   - `getGrade(String name)`：检索指定姓名学生的成绩。\n   - `updateGrade(String name, int\
    \ newGrade)`：更新指定学生的成绩。\n   - `removeStudent(String name)`：从 `HashMap` 中删除指定的学生。\n\
    \   - `printAllStudents()`：打印所有学生及其成绩。\n3. **Main 方法**：\n   - 通过添加学生、检索成绩、更新成绩、删除学生以及打印所有学生及其成绩来演示该功能。\n\
    \n![](img/image_rsrc3VG.jpg)\n\n### 输出：\n当你运行该程序时，输出将是：\n此程序清晰地演示了如何在 Java 中使用\
    \ `HashMap` 管理学生及其成绩的集合。\n\n![](img/image_rsrc3VH.jpg)\n\n### 示例 2\n- 实现了 `Map`\
    \ 接口。\n- 使用哈希表进行存储。\n- 允许 null 键值。\n\n## 2. TreeMap\n\n### 概述\n- `TreeMap` 是一种实现了\
    \ `NavigableMap` 接口并存储键值对的数据结构。\n- 它使用红黑树来维护键的顺序。\n- 元素根据它们的自然顺序或在创建映射时提供的自定义\
    \ `Comparator` 进行排序。\n\n### 主要特性\n- **顺序**：`TreeMap` 按照键的升序维护元素。\n- **空值**：不允许\
    \ null 键（抛出 `NullPointerException`），但允许多个 null 值。\n- **性能**：由于树形结构，`get()`、`put()`、`remove()`\
    \ 等操作的时间复杂度为 `O(log n)`。\n\n### 常用方法\n- `put(K key, V value)`：将指定的值与指定的键关联。\n\
    - `get(Object key)`：返回与指定键关联的值。\n- `remove(Object key)`：移除键的映射。\n- `firstKey()`：返回第一个（最小的）键。\n\
    - `lastKey()`：返回最后一个（最大的）键。\n- `subMap(K fromKey, K toKey)`：返回此映射中键范围从 `fromKey`\
    \ 到 `toKey` 的部分的视图。\n\n![](img/image_rsrc3VJ.jpg)\n![](img/image_rsrc3VK.jpg)\n\
    \n### 输出\n- **目的**：`TreeMap` 是一个维护键的排序顺序的 `Map` 实现。\n- **排序**：自然顺序（根据键的 `Comparable`\
    \ 实现）或自定义的 `Comparator`。\n- **空值**：`TreeMap` 不允许 null 键，但允许多个 null 值。\n- **性能**：为基本操作提供\
    \ `O(log n)` 时间复杂度。\n\n### 内部工作\n- `TreeMap` 使用红黑树（一种自平衡二叉搜索树）来维护排序顺序。\n- 确保元素根据自然顺序或指定的\
    \ `Comparator` 排序的。\n\n![](img/image_rsrc3VM.jpg)\n\n- 实现了 `Map` 接口。\n- 使用红黑树存储。\n\
    - 不允许 null 键。\n\n### 示例 1\n![](img/image_rsrc3VN.jpg)\n\n### 示例 2\n![](img/image_rsrc3VO.jpg)\n\
    \n### 输出\n![](img/image_rsrc3VP.jpg)\n\n### 练习题\n- **任务**：创建一个 `TreeMap` 来存储产品名称及其价格。编写方法来实现：\n\
    \  1. 添加产品及其价格。\n  2. 根据产品名称检索价格。\n  3. 更新产品的价格。\n  4. 从 `TreeMap` 中删除产品。\n  5.\
    \ 打印所有产品及其价格。\n\n### 答案\n该方案包含了添加产品及其价格、根据产品名称检索价格、更新产品价格、删除产品以及打印所有产品及其价格的方法。\n\
    \n![](img/image_rsrc3VR.jpg)\n\n### 解释\n1. **productPrices TreeMap**：\n   - 使用\
    \ `TreeMap` 存储产品名称（作为键）和价格（作为值）。确保按自然顺序排序。\n2. **方法**：\n   - `addProduct(String\
    \ productName, double price)`：将产品名称和价格添加到 `TreeMap` 中。\n   - `getPrice(String\
    \ productName)`：检索指定名称产品的价格。\n   - `updatePrice(String productName, double newPrice)`：更新指定产品的价格。\n\
    \   - `removeProduct(String productName)`：从 `TreeMap` 中删除指定的产品。\n   - `printAllProducts()`：打印所有产品及其价格。\n\
    3. **Main 方法**：\n   - 通过添加产品、检索产品价格、更新价格、删除产品以及打印所有产品及其价格来演示该功能。\n\n![](img/image_rsrc3VS.jpg)\n\
    \n### 输出：\n当你运行该程序时，输出将是：\n此程序清晰地演示了如何在 Java 中使用 `TreeMap` 管理产品及其价格的集合。\n\n##\
    \ 3. HashSet\n\n### 概述\n- `HashSet` 是一种实现了 `Set` 接口并存储唯一元素的数据结构。\n- 它由 `HashMap`\
    \ 支撑（元素存储在底层 `HashMap` 的键中）。\n- **顺序**：不保证元素的任何特定顺序。\n\n### 主要特性\n- **重复**：不允许重复元素。\n\
    - **空值**：允许一个 null 元素。\n- **性能**：`add()`、`remove()`、`contains()` 等操作的平均时间复杂度为\
    \ `O(1)`。\n\n### 常用方法\n- `add(E e)`：如果元素不存在，则将指定的元素添加到集合中。\n- `remove(Object o)`：如果元素存在，则从集合中移除指定的元素。\n\
    - `contains(Object o)`：如果集合包含指定的元素，则返回 true。\n- `size()`：返回集合中元素的数量。\n- `isEmpty()`：如果集合不包含元素，则返回\
    \ true。\n\n![](img/image_rsrc3VT.jpg)\n![](img/image_rsrc3VU.jpg)\n\n### 输出\n\
    概述:\n\n"
