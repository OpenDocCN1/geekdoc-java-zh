    # Java 中的继承

    继承是面向对象编程（OOP）的核心原理之一。它允许新类继承现有类的属性和方法。新类被称为子类或派生类，而它继承的类被称为父类或基类。继承促进了代码复用，并在类之间建立了自然的层层次结构。


    ### 继承的关键概念

    1. 父类与子类

    2. `extends` 关键字

    3. 构造函数继承

    4. 方法重写

    5. 访问父类方法

    6. `super` 关键字

    7. 类型转换


