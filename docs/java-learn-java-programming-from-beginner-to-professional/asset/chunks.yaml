    ![](img/image_rsrc3YD.jpg)


    ### JavaFX 属性与绑定


    属性与绑定：


    * JavaFX 属性允许观察对象状态的变化。

    * 绑定连接属性，使得一个属性的变化反映在另一个属性上。


    示例：


