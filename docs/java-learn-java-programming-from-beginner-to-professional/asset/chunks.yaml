    in-demand programming languages in the world.


    This book is more than just a learning tool—it''s your blueprint for success in
    the competitive tech industry. With step-by-step instructions, real-world examples,
    and expert insights, you''ll develop the proficiency needed to tackle complex
    projects and create robust, scalable applications. From the basics of syntax and
    structure to advanced concepts like multithreading, networking, and `JavaFX`,
    each chapter builds your confidence and capabilities.


    But this journey isn''t just about learning to code; it''s about transforming
    your skills into lucrative opportunities. As you progress through this book, you''ll
    gain the knowledge and expertise required to land top-tier jobs, secure high-paying
    freelance gigs, or even start your own tech venture. The demand for skilled Java
    developers is soaring, and with the right tools and understanding, you could be
    on your way to earning six or even seven figures in the industry.


    Java is more than just a programming language; it’s a gateway to innovation, and
    I’m thrilled to help you on this exciting journey. So, let’s get started. Your
    path from beginner to professional Java developer begins here!


    With "Java: Learn Java Programming From Beginner to Professional," you''re not
    just investing in a book—you''re investing in your future. Ready to turn your
    passion for coding into a profitable career? Your journey starts here.


    # Chapter 1: Introduction to Java Programming


    ### History of Java

    The Java language project was started in June 1991 by James Gosling, Mike Sheridan,
    and Patrick Naughton, according to google. Although Java was initially intended
    for interactive television, the digital cable television industry at the time
    could not handle its advanced features. Originally named after an oak tree that
    stood outside Gosling''s office, the language was known as `Oak`. Subsequently,
    the project was known as `Green` before being renamed `Java` after Java coffee,
    an Indonesian variety of coffee. Gosling created `Java` with a syntax reminiscent
    of `C/C++` for system and application programmers.


    Midway through the 1990s, Sun Microsystems began developing `Java`. Although it
    was too sophisticated for the digital cable television market at the time, it
    was initially intended for interactive television. Originally named after an oak
    tree that stood outside the developer James Gosling''s office, the language was
    known as `Oak`. The development team drank a lot of Java coffee, which led to
    the name change to `Java` later on.


    `Java` was originally developed by James Gosling at Sun Microsystems. It was released
    in May 1995 as a core component of Sun''s Java platform. The original and reference
    implementation `Java` compilers, virtual machines, and class libraries were originally
    released by Sun under proprietary licenses. As of May 2007, in compliance with
    the specifications of the Java Community Process, Sun had relicensed most of its
    `Java` technologies under the `GPL-2.0-only` license. Oracle offers its own `HotSpot
    Java Virtual Machine`, however the official reference implementation is the `OpenJDK
    JVM` which is free open-source software and used by most developers and is the
    default `JVM` for almost all Linux distributions.


    `Java` is a high-level programming language that is class-based, object-oriented,
    and designed to reduce implementation dependencies. This general-purpose programming
    language allows programmers to write code once and have it run anywhere. Compiled
    Java code can run on any platform that supports `Java` without the need for recompilation.
    `Java 10` programs are typically compiled to bytecode.


    `Java` gained popularity shortly after its release, and has been a very popular
    programming language since then. `Java` was the third most popular programming
    language in 2022 according to GitHub. Although still widely popular, there has
    been a gradual decline in use of `Java` in recent years with other languages using
    `JVM` gaining popularity.


    #### Key Milestones:

    * 1991: Project started by James Gosling, Mike Sheridan, and Patrick Naughton.

    * 1995: `Java 1.0` released by Sun Microsystems.

    * 1996: First version of Java Development Kit (`JDK`) released.

    * 1999: `Java 2` (`J2SE 1.2`) released with significant improvements.

    * 2004: `Java 5` (`J2SE 5.0`) introduced new features like generics, annotations,
    enumerated types, and the enhanced for loop.

    * 2009: Oracle Corporation acquired Sun Microsystems, including `Java`.

    * 2014: `Java 8` released with lambda expressions, the `Stream API`, and the new
    date-time API.


    ### Features of Java


    #### Key Features

    1. **Simple**: `Java`''s syntax is easy to learn and use, with a clean and straightforward
    design because of following reasons:

    * `Java` comprises the same syntax as `C`, and `C++`.

    * It holds automatic garbage collection features.

    * `Java` eliminated its unused features.

    * It keeps bringing regular updates for better performance.

    * `Java` has its own community to make learning and using `Java` easy.


    2. **Object-Oriented**: `Java` is based on the principles of objects and classes,
    which makes it modular, flexible, and scalable.

    Almost everything written in `Java` is object and class, making it a true object-oriented
    programming (OOP) language. The basic concept of OOP is:

    * **Object**: `Object` is a real-world entity in `Java` that encompasses state,
    functionality, and identity.

    * **Class**: `Class` is a logical entity which includes a group of objects with
    common properties. It contains fields, methods, constructors, blocks, nested classes
    and interfaces.

    * **Inheritance**: It’s a concept in `Java` through which developers can create
    new classes built upon existing classes to achieve runtime polymorphism.

    * **Polymorphism**: A Mechanism in `Java` through which you can perform a single
    action in multiple ways. Polymorphism can be of two types- Compile time and runtime.

    * **Abstraction**: It’s a method to hide internal processing and show only essential
    things to the users.


    3. **Platform-Independent**: `Java` programs can run on any device with the Java
    Virtual Machine (`JVM`). This feature is known as "write once, run anywhere."

    Unlike other languages, `Java` is not limited to any specific machine and dependent
    on other factors to run. The Java platform is independent because:

    * It uses a runtime environment of its own, i.e. `JVM`.

    * It is a write-once, run-anywhere language.

    * It is a software-based platform that runs on top of other hardware-based platforms.

    * Its code can be executed on multiple platforms, including Windows, Linux, Sun
    Solaris, and Mac/OS.

    The Java code is compiled by the compiler and converted into bytecode.


    4. **Secure**: `Java` provides a secure environment for developing applications
    by including features like bytecode verification and a security manager.

    `Java` programming language is known for its security. With it, you can create
    virus-free systems because:

    * `Java` programming language runs inside a virtual machine.

    * It uses its own runtime environment- `JVM`.

    * It includes a security manager, which determines what resources a class can
    access, such as reading and writing to the local disk.

    * In Java run time, a class loader separates the package for the classes of the
    local file system from the files imported from network sources.

    `Java` also consists of `Bytecode Verifier`, which checks the code fragments for
    illegal code.


    5. **Robust**: `Java` has strong memory management, exception handling, and type-checking
    mechanisms to create reliable applications.

    Automatic memory management is a crucial feature of Java programming. It helps
    in:

    * Create high-performance system.

    * Automatically allocate and free up space for objects.

    * Eliminating the worries about memory management.

