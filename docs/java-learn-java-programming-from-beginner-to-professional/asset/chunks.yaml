- fmt: "\n# Understanding HashMap, TreeMap, HashSet, TreeSet\n\nThe Java Collections\
    \ Framework (JCF) provides powerful data structures to store and manipulate data\
    \ efficiently. Four commonly used data structures in this framework are `HashMap`,\
    \ `TreeMap`, `HashSet`, and `TreeSet`. Each of these structures has unique characteristics,\
    \ advantages, and trade-offs, which make them suitable for different scenarios.\n\
    \n## 1. HashMap\n\n### Overview\n- `HashMap` is a data structure that implements\
    \ the `Map` interface and stores key-value pairs.\n- It uses a hash table for\
    \ storage, providing fast lookups, insertions, and deletions.\n- The keys are\
    \ hashed into buckets, and the position of the bucket in the hash table is determined\
    \ by the `hashCode` of the key.\n\n### Key Characteristics\n- **Order**: `HashMap`\
    \ does not guarantee any specific order of the elements.\n- **Null Values**: Allows\
    \ one null key and multiple null values.\n- **Performance**: Average time complexity\
    \ for operations like `get()`, `put()`, `remove()` is `O(1)`.\n\n### Common Methods\n\
    - `put(K key, V value)`: Associates the specified value with the specified key\
    \ in this map.\n- `get(Object key)`: Returns the value to which the specified\
    \ key is mapped.\n- `remove(Object key)`: Removes the mapping for the specified\
    \ key.\n- `containsKey(Object key)`: Returns true if this map contains a mapping\
    \ for the specified key.\n- `keySet()`: Returns a `Set` view of the keys contained\
    \ in this map.\n- `values()`: Returns a `Collection` view of the values contained\
    \ in this map.\n\n![](image_rsrc3VB.jpg)\n\n### Example Using Hashmap\n![](image_rsrc3VC.jpg)\n\
    \n### Output\n![](image_rsrc3VD.jpg)\n\n### Example:\n![](image_rsrc3VE.jpg)\n\
    \n### Output\n\n### Practice Exercise 1\n- **Task**: Create a `HashMap` that stores\
    \ the names of students and their grades. Write methods to:\n  1. Add a student\
    \ and their grade.\n  2. Retrieve a grade by the student's name.\n  3. Update\
    \ a student's grade.\n  4. Remove a student from the `HashMap`.\n  5. Print all\
    \ students and their grades.\n\n### Solution 1\nThe solution includes methods\
    \ to add a student and their grade, retrieve a grade by the student's name, update\
    \ a student's grade, remove a student, and print all students and their grades.\n\
    \n![](image_rsrc3VF.jpg)\n\n### Explanation\n1. **studentGrades HashMap**:\n \
    \  - The `HashMap` is used to store the names of students (as keys) and their\
    \ grades (as values).\n2. **Methods**:\n   - `addStudent(String name, int grade)`:\
    \ Adds a student's name and their grade to the `HashMap`.\n   - `getGrade(String\
    \ name)`: Retrieves the grade of the student with the specified name.\n   - `updateGrade(String\
    \ name, int newGrade)`: Updates the grade of the specified student.\n   - `removeStudent(String\
    \ name)`: Removes the specified student from the `HashMap`.\n   - `printAllStudents()`:\
    \ Prints all students and their grades.\n3. **Main Method**:\n   - Demonstrates\
    \ the functionality by adding students, retrieving a grade, updating a grade,\
    \ removing a student, and printing all students and their grades.\n\n![](image_rsrc3VG.jpg)\n\
    \n### Output:\nWhen you run the program, the output will be:\nThis program provides\
    \ a clear demonstration of how to use a `HashMap` for managing a collection of\
    \ students and their grades in Java.\n\n![](image_rsrc3VH.jpg)\n\n### Example\
    \ 2\n- Implements the `Map` interface.\n- Uses a hash table for storage.\n- Allows\
    \ null keys and values.\n\n## 2. TreeMap\n\n### Overview\n- `TreeMap` is a data\
    \ structure that implements the `NavigableMap` interface and stores key-value\
    \ pairs.\n- It uses a Red-Black tree to maintain the order of keys.\n- The elements\
    \ are sorted according to their natural ordering or by a custom `Comparator` provided\
    \ at map creation time.\n\n### Key Characteristics\n- **Order**: `TreeMap` maintains\
    \ the elements in ascending order of the keys.\n- **Null Values**: Does not allow\
    \ null keys (throws `NullPointerException`) but allows multiple null values.\n\
    - **Performance**: Operations like `get()`, `put()`, `remove()` have a time complexity\
    \ of `O(log n)` due to the tree structure.\n\n### Common Methods\n- `put(K key,\
    \ V value)`: Associates the specified value with the specified key.\n- `get(Object\
    \ key)`: Returns the value associated with the specified key.\n- `remove(Object\
    \ key)`: Removes the mapping for a key.\n- `firstKey()`: Returns the first (lowest)\
    \ key.\n- `lastKey()`: Returns the last (highest) key.\n- `subMap(K fromKey, K\
    \ toKey)`: Returns a view of the portion of this map whose keys range from `fromKey`\
    \ to `toKey`.\n\n![](image_rsrc3VJ.jpg)\n![](image_rsrc3VK.jpg)\n\n### Output\n\
    - **Purpose**: `TreeMap` is a `Map` implementation that maintains a sorted order\
    \ of keys.\n- **Ordering**: Natural ordering (according to the keys' `Comparable`\
    \ implementation) or a custom `Comparator`.\n- **Nulls**: `TreeMap` does not allow\
    \ null keys but allows multiple null values.\n- **Performance**: Provides `O(log\
    \ n)` time complexity for basic operations.\n\n### Internal Working\n- `TreeMap`\
    \ uses a Red-Black Tree, a self-balancing binary search tree, to maintain the\
    \ sorted order of the keys.\n- This ensures that the entries are always sorted\
    \ based on the natural ordering of the keys or the order specified by a `Comparator`.\n\
    \n![](image_rsrc3VM.jpg)\n\n- Implements the `Map` interface.\n- Uses a red-black\
    \ tree for storage.\n- Does not allow null keys.\n\n### Example 1\n![](image_rsrc3VN.jpg)\n\
    \n### Example 2\n![](image_rsrc3VP.jpg)\n\n### Output\n![](image_rsrc3VR.jpg)\n\
    \n### Practice Exercise\n- **Task**: Create a `TreeMap` that stores product names\
    \ and their prices. Write methods to:\n  1. Add a product and its price.\n  2.\
    \ Retrieve the price of a product.\n  3. Update a product's price.\n  4. Remove\
    \ a product from the `TreeMap`.\n  5. Print all products and their prices in ascending\
    \ order of product names.\n\n### Solution\nThe solution includes methods to add\
    \ a product and its price, retrieve the price of a product, update a product's\
    \ price, remove a product, and print all products and their prices in ascending\
    \ order of product names.\n\n![](image_rsrc3VR.jpg)\n\n### Explanation\n1. **productPrices\
    \ TreeMap**:\n   - The `TreeMap` is used to store the names of products (as keys)\
    \ and their prices (as values). The `TreeMap` ensures that the products are stored\
    \ in ascending order of their names.\n2. **Methods**:\n   - `addProduct(String\
    \ productName, double price)`: Adds a product and its price to the `TreeMap`.\n\
    \   - `getPrice(String productName)`: Retrieves the price of the product with\
    \ the specified name.\n   - `updatePrice(String productName, double newPrice)`:\
