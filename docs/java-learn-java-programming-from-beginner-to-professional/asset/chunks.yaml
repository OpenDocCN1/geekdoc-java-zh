    ### 详细解释

    #### 1. 父类与子类

    * **父类**：被继承属性和方法的类。

    * **子类**：从父类继承属性和方法的类。

    * 父类（在本例中为 `Animal`）是被继承属性和方法的类。


    ![](img/image_rsrc3S4.jpg)

    * 子类（在本例中为 `Dog`）是自父类继承属性和方法的类。


