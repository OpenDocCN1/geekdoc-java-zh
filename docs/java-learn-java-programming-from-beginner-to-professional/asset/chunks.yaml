    #### 继承的类型

    * **单继承继承**：子类继承自一个父类。

    * **多级继承**：子类继承另一个子类。

    * **层级继承**：多个子类继承自同一个父类。


    Java 中的继承允许基于现有类创建新类。它促进了代码复用、逻辑层次结构和方法重写。通过使用 `extends` 和 `super` 关键字，Java 提供了一种实现继承的清晰且直接的方法。一个类继承另一个类的字段和方法。


