    \n# 面向对象编程 (OOP) 简介\n\n面向对象编程 (OOP) 是一种基于“对象”概念的编程范式。\n\n"
- fmt: "\n\"objects,\" which can contain data in the form of fields (often known as\
    \ attributes or properties) and code in the form of procedures (often known as\
    \ methods). Java is an object-oriented language that leverages this paradigm to\
    \ structure programs in a modular and reusable way.\n\n# Core Concepts of OOP\n\
    \n## Class in Java\nA class in Java is a blueprint or template for creating objects.\
    \ It defines a type of object by specifying its properties (fields) and behaviours\
    \ (methods). Classes encapsulate data for the object and methods to manipulate\
    \ that data.\n\n### Structure of a Class\nA class typically consists of the following\
    \ components:\n\n1. `Fields` (Attributes or Properties): Variables that hold the\
    \ data of the object.\n2. `Methods`: Functions that define the behaviour of the\
    \ object.\n3. `Constructors`: Special methods used to initialize new objects.\n\
    4. `Access Modifiers`: Keywords that control the visibility of the class and its\
    \ members (e.g., `public`, `private`, `protected`).\n\n72\n\n![](image_rsrc3RG.jpg)![](image_rsrc3RH.jpg)\n\
    \n### Syntax of a class\n\n### Example of Creating and Using a Class\n73\n\n**Explanation:**\n\
    \n1. **Class Definition**: `MyClass` defines two fields (`myNumber` and `myString`),\
    \ a constructor, and two methods (`display` and `getNumber`).\n2. **Constructor**:\
    \ Initializes `myNumber` and `myString` with values provided when creating an\
    \ object.\n3. **Methods**: `display` prints the values of `myNumber` and `myString`.\
    \ `getNumber` returns the value of `myNumber`.\n4. **Object Creation**: In the\
    \ `Main` class, `MyClass obj = new MyClass(10, \"Hello World\");` creates a new\
    \ object of `MyClass`, initializing its fields using the constructor.\n5. **Method\
    \ Calls**: `obj.display();` calls the `display` method on the object `obj`. `obj.getNumber();`\
    \ calls the `getNumber` method to retrieve the value of `myNumber`.\n\n74\n\n\
    ![](image_rsrc3RJ.jpg)\n\n## Access Modifiers\nAccess modifiers control the visibility\
    \ and accessibility of classes, fields, constructors, and methods:\n\n* `public`:\
    \ The member is accessible from any other class.\n* `private`: The member is accessible\
    \ only within the class itself.\n* `protected`: The member is accessible within\
    \ the same package and by subclasses.\n* `Default` (no modifier): The member is\
    \ accessible only within the same package.\n\n**Example of Access Modifiers:**\n\
    75\n\n![](image_rsrc3RK.jpg)\n\n### Creating and Using a Class\n1. **Create a\
    \ Class File**: Save the class definition in a `.java` file.\n2. **Compile**:\
    \ Use `javac ClassName.java` to compile the class.\n3. **Run**: Use `java Main`\
    \ to run the `Main` class that utilizes the defined class.\n\nA class in Java\
    \ is a fundamental construct that allows you to create objects with specific attributes\
    \ and behaviors. By defining fields, methods, and constructors, you can model\
    \ real-world entities and organize code in a modular and reusable way. Experiment\
    \ with creating your own classes to gain a deeper understanding of their functionality\
    \ and usage.\n\n### Class\n* A class is a blueprint or template for creating objects.\
    \ It defines a type of object by bundling data and methods that operate on that\
    \ data.\n\n### Syntax\n76\n\n## Practice Examples\n\n### 1. Creating a Person\
    \ Class\n**Objective**: Define a `Person` class with attributes for `name` and\
    \ `age`. Include methods to display person details and check if the person is\
    \ an adult.\n\n77\n\n![](image_rsrc3RM.jpg)\n\n**Solution:**\n\n**Explanation:**\n\
    * **Fields**: `name` and `age`.\n* **Constructor**: Initializes the `name` and\
    \ `age` fields.\n* **Methods**: `displayDetails` prints the person’s name and\
