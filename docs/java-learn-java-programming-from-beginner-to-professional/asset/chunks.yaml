    #### 2 Constructor Chaining from a Subclass


    When you have a subclass that extends a superclass, you can use the `super()`
    keyword to call a constructor from the superclass. This ensures that the superclass
    is properly initialized before the subclass adds its own initialization.


    **Example:**


