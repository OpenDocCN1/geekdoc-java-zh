    2\. Creating Threads in Java


    Java provides two primary ways to create and start a thread:


    2.1\. Extending the Thread Class


    The simplest way to create a thread is by extending the Thread class and overriding
    its run() method.


    270


    ![](image_rsrc3XB.jpg)![](image_rsrc3XC.jpg)


    Implementing the Runnable Interface


    Another common way to create a thread is by implementing the Runnable interface,
    which has a single run() method.


    271


    3\. Thread States and Lifecycle


    A thread in Java can be in one of several states during its lifecycle:


    • New: A thread that has been created but not yet started.


    • Runnable: A thread that is ready to run or currently running.


    • Blocked: A thread that is waiting for a monitor lock to enter a synchronized
    block/method.


    • Waiting: A thread that is waiting indefinitely for another thread to perform
    a particular action.


    • Timed Waiting: A thread that is waiting for another thread to perform a specific
    action within a time limit.


    • Terminated: A thread that has completed its execution.


    4\. Synchronization in Java


    Synchronization is the process of controlling access to shared resources by multiple
    threads to prevent race conditions.


    4.1\. Synchronized Methods


    You can synchronize a method by using the synchronized keyword. When a method
    is synchronized, only one thread can execute it at a time for a given object.


    272


    ![](image_rsrc3XD.jpg)![](image_rsrc3XE.jpg)


    Synchronized Blocks


    For more finegrained control, you can synchronize a specific block of code within
    a method.


    273


    Inter-Thread Communication


    Java provides several ways for threads to communicate with each other: 5.1\. wait(),
    notify(), and notifyAll() Methods


    These methods are used for communication between threads. They must be called
    from within a synchronized block or method.


    • wait(): Causes the current thread to wait until another thread invokes notify()
    or notifyAll() on the same object.


    • notify(): Wakes up a single thread that is waiting on the object''s monitor.


    • notifyAll(): Wakes up all threads that are waiting on the object''s monitor.


    274


    ![](image_rsrc3XF.jpg)


    Example: ProducerConsumer Problem


    275


    ![](image_rsrc3XG.jpg)


    Deadlock


    A deadlock occurs when two or more threads are blocked forever, waiting for each
    other to release resources. To avoid deadlocks:


    • Acquire resources in a consistent order.


    • Use tryLock with a timeout to prevent indefinite waiting.


    276


    ![](image_rsrc3XH.jpg)


    Example of a Deadlock


    277


    ![](image_rsrc3XJ.jpg)


    7\. Concurrency Utilities


    Java provides a java.util.concurrent package that includes high-level concurrency
    utilities, such as:


    7.1\. Executor Framework


    The Executor framework provides a way to manage a pool of threads to execute tasks
    asynchronously.


    • ExecutorService: Interface that provides methods to manage the termination and
    track the progress of asynchronous tasks.


    • Executors: Factory methods for creating thread pools.


    278


    ![](image_rsrc3XK.jpg)


    Future and Callable


    The Callable interface is similar to Runnable, but it can return a result and
    throw checked exceptions.


    The result can be retrieved using a Future.


    279


    ![](image_rsrc3XM.jpg)


    Locks


    ReentrantLock provides explicit lock management, with more advanced features compared
    to synchronized blocks.


    280


    ![](image_rsrc3XN.jpg)


    Atomic Variables


    Atomic variables like AtomicInteger provide a lock-free and thread-safe mechanism
    to perform atomic operations.


    281


    Conclusion


    Understanding multithreading and concurrency in Java is essential for building
