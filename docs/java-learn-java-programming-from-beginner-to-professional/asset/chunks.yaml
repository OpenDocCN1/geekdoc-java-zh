    \ An `abstract class` is a class that cannot be instantiated on its own and may\
    \ contain `abstract methods` that must be implemented by subclasses. `abstract\
    \ methods` are methods without a body, meant to be overridden in derived classes.\n\
    \n**Features**:\n- Can have `abstract methods` (methods without a body).\n- Can\
