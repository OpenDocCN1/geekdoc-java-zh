  raw: 'Understanding HashMap, TreeMap, HashSet, TreeSet


    The Java Collections Framework (JCF) provides powerful data structures to store
    and manipulate data efficiently. Four commonly used data structures in this framework
    are HashMap, TreeMap, HashSet, and TreeSet. Each of these structures has unique
    characteristics, advantages, and trade-offs, which make them suitable for different
    scenarios.


    1\. HashMap


    Overview:


    • HashMap is a data structure that implements the Map interface and stores key-value
    pairs.


    • It uses a hash table for storage, providing fast lookups, insertions, and deletions.


    • The keys are hashed into buckets, and the position of the bucket in the hash
    table is determined by the hash code of the key.


    Key Characteristics:


    • Order: HashMap does not guarantee any specific order of the elements.


    • Null Values: Allows one null key and multiple null values.


    • Performance: Average time complexity for operations like get(), put(), remove()
    is O(1).


    Common Methods:


    • put(K key, V value): Associates the specified value with the specified key in
    this map.


    • get(Object key): Returns the value to which the specified key is mapped.


    • remove(Object key): Removes the mapping for the specified key.


    • containsKey(Object key): Returns true if this map contains a mapping for the
    specified key.


    • keySet(): Returns a Set view of the keys contained in this map.


    • values(): Returns a Collection view of the values contained in this map.


