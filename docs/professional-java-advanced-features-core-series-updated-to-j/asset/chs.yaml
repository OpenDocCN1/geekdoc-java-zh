  Child Thread: 3\nChild Thread: 4\nMain Thread:3\nChild Thread: 5\nExiting Child\
  \ thread\nMain Thread:4\nMain Thread:5\nEnd of Main thread\n```\n\n## 扩展 Thread\
  \ 类\n\n创建线程的第二方法是创建一个扩展 `Thread` 的类，然后创建该类的实例。扩展类必须重写 `run()` 方法，这是新线程的入口点。它还必须调用\
  \ `start()` 来开始新线程的执行。\n\n### 示例 12.4\n\n```java\nclass A extends Thread {\n   \
  \ A( ) {\n        super (\"Test\");\n        System.out.println (\"Child thread:\"\
  \ + this);\n        start();\n    }\n    public void run () {\n        for (int\
  \ i=1; i<=5; i++) {\n            System.out.println(\"Child Thread:\"+i);\n    \
  \        try {\n                Thread.sleep(500);\n            }\n        }\n \
  \   }\n}\n```\n\n\n\n\n\n```java\n        }\n    }\n    System.out.println (\"Exiting\
  \ Child thread\");\n    }\n}\nclass ThreadTest {\n    public static void main(String\
  \ args[]) {\n        new A();\n        for (int i=1; i<=5; i++) {\n            System.out.println(\"\
  Main Thread: \"+i);\n            try {\n                Thread.sleep(1000);\n  \
  \          } catch (InterruptedException e) {\n                System.out.println(\"\
  Main thread interrupted\");\n            }\n        }\n        System.out.println(\"\
  Main thread exiting\");\n    }\n}\n```\n\n输出:\n子线程:Thread[Testing,5,main]\nMain\
  \ Thread: 1\nChild:1\nMain Thread: 2\nChild:2\nMain Thread: 3\nChild:3\n... (其余输出模式相同)\n\
  \n注意：如果 `Thread` 没有被分配任何名称，它将类似于 `Thread-1`、`Thread-2`、`Thread-3` 等。\n\n### 选择方法\n\
  `Thread` 类定义了几个可以被派生类重写的方法。在这些方法中，唯一必须重写的是 `run()`。当然，这在实现 `Runnable` 接口时也是同样的要求。许多\
  \ Java 程序员认为，只有当类被某种程度上进行增强或修改时才应该对其扩展。因此，如果我们不重写 `Thread` 的其他任何方法，最好的可能是实现 `Runnable`\
  \ 接口。\n\n### 创建多个线程：示例 1\n```java\nclass A implements Runnable {\n    String name;\n\
  \    Thread t;\n    A(String threadName) {\n        name=threadName;\n        t=new\
  \ Thread(this, name);\n        System.out.println(\"Child thread:\"+t);\n      \
  \  t.start();\n    }\n    public void run() {\n        for(int i=1; i<=5; i++) {\n\
  \            System.out.println(t.getName()+ \": \" + i);\n            try {\n \
  \               Thread.sleep(1000);\n            } catch (InterruptedException e)\
  \ {\n                System.out.println(e);\n            }\n        }\n        System.out.println(name+\
  \ \"Exiting\");\n    }\n}\n```\n\n### 使用 `isAlive()` 和 `join()` 强制排序\n通常我们希望 `main`\
  \ 线程最后结束。实现这一点的方法之一是在 `main` 中调用 `sleep()`。这相当粗糙（原始）。有两种方法可以判断线程是否已完成。首先，我们可以在线程上调用\
  \ `isAlive()`。该方法由 `Thread` 定义，其通用形式为：\n`boolean isAlive()`\n如果调用该方法的线程仍在运行，则 `isAlive()`\
  \ 方法返回 `true`；否则返回 `false`。虽然 `isAlive()` 有时很有用，但我们通常用于等待线程完成的方法是 `join()`，如下所示：\n\
  `void join() throws InterruptedException`\n该方法会等待，直到调用它的线程终止为止。`join()` 的其他形式允许我们指定等待指定线程终止的最大时间。下面的示例使用了\
  \ `join()` 来确保 `main` 线程是最后一个停止的。它还러演示了 `isAlive()` 方法。\n\n示例 2\n```java\nclass\
  \ A implements Runnable {\n    String name;\n    Thread t;\n    A(String threadName)\
  \ {\n        name=threadName;\n        t=new Thread(this, name);\n        System.out.println(\"\
  Child thread:\"+t);\n        t.start();\n    }\n    public void run() {\n      \
  \  for(int i=1; i<=5; i++) {\n            System.out.println(t.getName()+ \": \"\
  \ + i);\n            try {\n                Thread.sleep(1000);\n            } catch\
  \ (InterruptedException e) {\n                System.out.println(e);\n         \
  \   }\n        }\n        System.out.println(name+ \"Exiting\");\n    }\n}\n\nclass\
  \ MultiThread {\n    public static void main(String args[]) {\n        A a1=new\
  \ A(\"One\");\n        A a2=new A(\"Two\");\n        A a3=new A(\"Three\");\n  \
  \      try {\n            Thread.sleep(10000);\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(\"main thread interrupted\");\n        }\n\
  \        System.out.println(\"Main thread exiting\");\n    }\n}\n```\n\n\n\n\n```java\n\
  \        }\n    }\n    System.out.println(name + \"Exiting\");\n    }\n}\n\nclass\
  \ DemoJoin {\n    public static void main(String args[] ) {\n        A ob1 = new\
  \ A(\"One\");\n        A ob2 = new A(\"Two\");\n        A ob3 = new A(\"Three\"\
  );\n        System.out.println(\"Thread One is alive?:\" + ob1.t.isAlive());\n \
  \       System.out.println(\"Thread Two is alive?:\" + ob2.t.isAlive());\n     \
  \   System.out.println(\"Thread Three is alive?:\" + ob3.t.isAlive());\n       \
  \ try {\n            ob3.t.join();\n            ob2.t.join();\n            ob1.t.join();\n\
  \        } catch (InterruptedException e) {\n            System.out.println(\"main\
  \ interrupted\");\n        }\n        System.out.println(\"Thread One is alive?:\"\
  \ + ob1.t.isAlive());\n        System.out.println(\"Thread Two is alive?:\" + ob2.t.isAlive());\n\
  \        System.out.println(\"Thread Three is alive?:\" + ob3.t.isAlive());\n  \
  \      System.out.println(\"Main thread exiting\");\n    }\n}\n```\n\n输出：\n```text\n\
  Low  : 63660819\nHigh : 2086505403\n```\n\n\n\n\n高优先级线程获取了超过 98% 的 CPU 时间。但尽管线程既没有主动释放\
  \ CPU，也没有因 I/O 而阻塞，它们仍然发生了上下文切换。当同一个程序在非抢占式系统运行时，将获得不同的结果。\n\n注意：变量 `running` 前面带有关键字\
  \ `volatile`，用以确保在每次迭代以下循环时都会检查 `running` 的值。\n\n```java\nwhile (running) {\n  \
  \  click++;\n}\n```\n\n如果不使用 `volatile`，Java 可以自由地对循环进行优化，创建一个 `running` 的本地副本。使用\
  \ `volatile` 可以防止这种优化，告诉 Java `running` 可能会以代码中无法直接看出的方式发生变化。\n\n## 同步\n\n当两个或多个线程需要访问共享资源时，它们需要某种方式来确保资源在同一只有一个线程使用。实现这一目标的过程被称为同步。\n\
  \n同步的关键是监视器（monitor，也称为信号量）的概念。监视器是一个用作互斥锁的对象。在给定时刻，只有一个线程可以拥有监视器。\n\n当线程获取锁时，认为它进入了监视器。所有其他尝试进入被锁监视器的线程都将被挂起，直到第一个线程退出监视器。这些其他线程被称为等待监视器。拥有监视器的线程如果需要，可以重新进入同一个监视器。我们可以通过两种方式对代码进行同步：\n\
  \n(i) 使用 `synchronized` 方法\n(ii) 使用 `synchronized` 语句\n\n## 使用同步方法\n\n在 Java 中同步是非常简单的，因为所有对象都有与其关联的隐式监视器。要进入对象的监视器，只需调用用\
  \ `synchronized` 关键字修改的方法。当线程在同步方法内部时，所有尝试调用该方法（或同一实例上的任何其他同步方法）的线程都必须 `wait()`。要退出监视器并将控制权交给下一个等待的线程，监视器的所有者只需从同步方法返回即可。\n\
  \n### 示例 12.8\n\n下面的程序说明了三个线程在并发运行时，生成的输出会发生混杂。\n\n```java\nclass A {\n    void\
  \ display(String msg) {\n        System.out.print(\"[\" + msg);\n        try {\n\
  \            Thread.sleep(1000);\n        } catch (InterruptedException e) {\n \
  \           System.out.println(e);\n        }\n        System.out.println(\"]\"\
  );\n    }\n}\n\nclass B implements Runnable {\n    A obj;\n    String msg;\n   \
  \ Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch1 {\n    public static void\
  \ main(String args[]) {\n        A a1 = new A();\n        B b1 = new B(a1,\"Hello\"\
  );\n        B b2 = new B(a1,\"World\");\n        B b3 = new B(a1,\"Matrix\");\n\
  \    }\n}\n```\n\n输出：\n```\n[Hello[World[Matrix]\n]\n]\n```\n\n正如我们看到的，通过调用 `sleep()`，`display()`\
  \ 方法允许执行切换到另一个线程。这导致了三个消息字符串的输出混杂。在这个程序中，没有任何机制可以阻止三个线程同时在同一个对象上调用同一个方法。\n\n这被称为竞态条件（race\
  \ condition），因为这三个线程正在竞争以完成该方法。这个示例使用 `sleep()` 来使效果变得可重复且明显。在大多数情况下，竞态条件更加微妙且不可预测，因为我们无法确定上下文切换何时发生。这可能导致程序在一次运行时是正确的，下一次运行时是错误的。\n\
  \n要实现这一点，我们只需要在方法 `display()` 的定义前加上 `synchronized` 关键字。这可以防止一个线程在另一个线程使用 `display()`\
  \ 时进入该方法。\n\n### 示例 12.9\n\n混杂问题通过简单将 `display()` 方法声明为同步方法就得到了解决。\n\n```java\n\
  class A {\n    synchronized void display(String msg) {\n        System.out.print(\"\
  [\" + msg);\n        try {\n            Thread.sleep(100);\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
  ]\");\n    }\n}\n\nclass B implements Runnable {\n    A obj;\n    String msg;\n\
  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch2 {\n    public static void\
  \ main(String args[]) {\n        A a1 = new A();\n        B b1 = new B(a1,\"Hello\"\
  );\n        B b2 = new B(a1,\"World\");\n        B b3 = new B(a1,\"Matrix\");\n\
  \    }\n}\n```\n\n\n\n虽然在我们创建的类中创建同步方法是实现同步的一种简单有效的方法，但它在所有情况下并不适用。为了理解为什么，请考虑以下情况：假设我们想要对一个并非为多线程访问设计的类对象进行同步访问。也就是说，该类没有使用同步方法。此外，该类不是由我们创建的，而是由第三方创建的；我们无法访问源代码。因此，我们无法在该类内部适当的方法上添加\
  \ `synchronized` 修饰符。那么如何通过 `synchronized` 实现对该类对象的访问呢？\n\n解决方案是将对该类定义的方法调用放在 `synchronized`\
  \ 块中。`synchronized` 语句的一般形式如下：\n\n```java\nsynchronized(object)\n{\n    //需要同步的语句\n\
  }\n```\n\n在这里，`object` 是被同步对象的引用。`synchronized` 块确保了对 `object` 成员方法的调用只有在当前线程成功进入\
  \ `object` 的监视器（monitor）才会发生。\n\n### 示例 12.10\n前一个示例的替代版本，在 `run()` 方法中使用 `synchronized`\
  \ 块：\n\n```java\nclass A\n{\n    void display(String msg)\n    {\n        System.out.print(\"\
  [\" + msg);\n        try {\n            Thread.sleep(1000);\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
  ]\");\n    }\n}\n\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n\
  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        synchronized(obj) {\n            obj.display(msg);\n        }\n   \
  \ }\n}\n\nclass Synch3\n{\n    public static void main(String args[]) {\n      \
  \  A a1 = new A();\n        B b1 = new B(a1, \"Hello\");\n        B b2 = new B(a1,\
  \ \"World\");\n        B b3 = new B(a1, \"Matrix\");\n    }\n}\n```\n输出:-\n```\n\
  [Hello]\n[World]\n[Matrix]\n```\n\n### 多线程在不同对象上调用同一方法：示例 12.11\n线程可以并发地在同一类的不同对象上调用同一个\
  \ `synchronized` 实例方法，因为每个对象都有不同的锁。这再次导致输出结果混乱。\n\n```java\nclass A\n{\n    synchronized\
  \ void display(String msg)\n    {\n        System.out.print(\"[\" + msg);\n    \
  \    try {\n            Thread.sleep(100);\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
  ]\");\n    }\n}\n\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n\
  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch4\n{\n    public static void\
  \ main(String args[]) {\n        A a1 = new A();\n        A a2 = new A();\n    \
  \    A a3 = new A();\n        B b1 = new B(a1, \"Hello\");\n        B b2 = new B(a2,\
  \ \"World\");\n        B b3 = new B(a3, \"Matrix\");\n    }\n}\n```\n输出:\n```\n\
  [Hello[World[Matrix]\n```\n\n### 静态同步方法：示例 12.2\n在下面的示例中，尽管我们在不同的对象上调用了 `display()`\
  \ 方法，但输出并没有混乱。原因是 `display()` 是 `static` 的，因此锁是针对整个类 `A` 获得的，而不是针对单个对象。\n\n```java\n\
  class A\n{\n    static synchronized display(String msg)\n    {\n        System.out.print(\"\
  [\" + msg);\n        try {\n            Thread.sleep(1000);\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
  ]\");\n    }\n}\n\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n\
  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch5\n{\n    public static void\
  \ main(String args[]) {\n    }\n}\n```\n\n\n\n\n\n```java\nA a1 = new A();\nA a2\
  \ = new A();\nA a3 = new A();\nB b1 = new B(a1, \"Hello\");\nB b2 = new B(a2, \"\
  World\");\nB b3 = new B(a3, \"Matrix\");\n```\n\nOutput:\n```\n[Hello]\n[World]\n\
  [Matrix]\n```\n\n## 线程间通信\n\n如前所述，多线程通过将我们的任务划分为离散的逻辑单元来取代事件循环编程。线程还证明了次要优势：它们消除了轮询。轮询通常通过循环实现，该循环用于反复检查某些条件。一旦条件成立，就会采取相应的行动。\n\
  \n这浪费了 CPU 周期。例如，考虑经典的队列问题，其中一个线程生产数据，而另一个线程消费这些数据。为了让问题更具交互性，假设生产者必须等待消费者完成后才能生成更多数据。在轮询系统中，消费者在等待生产者生产时会浪费许多\
  \ CPU 周期。一旦生产者完成工作，它就会开始轮询，浪费更多的 CPU 周期来等待消费者完成，以此类推。\n\n为了避免轮询，Java 通过 `wait()`、`notify()`\
  \ 和 `notifyAll()` 方法包含了一种优雅（智能）的进程间通信机制。这些方法在 `Object` 类中被实现为最终方法，因此所有类都拥有它们。这三个方法都只能在同步上下文中调用。使用这些方法有特定的规则。\n\
  \n- `wait()` 告诉调用线程放弃监视器并睡眠，直到其他线程进入同一个监视器并调用 `notify()`。\n- `notify()` 唤醒在同一对象上调用\
  \ `wait` 的一个线程（通常是第一个线程）。\n- `notifyAll()` 唤醒所有在同一对象上调用过 `wait()` 的线程。通常优先级最高的线程将首先运行。\n\
  \n这些方法在 `Object` 类中声明，如下：\n\n```java\nfinal void wait() throws InterruptedException\n\
  final void notify()\nfinal void notifyAll()\n```\n\n### 示例 12.13\n\n下面的示例程序错误地实现了一个简单的生产者/消费者问题。它包含四个类：`Q`，我们正尝试同步的队列；`Producer`，产生队列条目的线程对象；`Consumer`，消费队列条目的线程对象；以及\
  \ `PC`，创建一个单一 `Q`、`Producer` 和 `Consumer` 的微型类。\n\n```java\nclass Q {\n    int n;\n\
  \    synchronized int get() {\n        System.out.println(\"Got:\"+n);\n       \
  \ return n;\n    }\n    synchronized void put(int n) {\n        this.n =n;\n   \
  \     System.out.println(\"Put:\"+n);\n    }\n}\nclass Producer implements Runnable\
  \ {\n    Q q1;\n    Producer(Q q2) {\n        q1 = q2;\n        new Thread(\"Producer\"\
  ).start();\n    }\n    public void run() {\n        int i = 0;\n        while (true)\
  \ {\n            q1.put(++i);\n        }\n    }\n}\nclass Consumer implements Runnable\
  \ {\n    Q q1;\n    Consumer(Q q2) {\n        q1 = q2;\n        new Thread(this,\
  \ \"Consumer\").start();\n    }\n    public void run() {\n        while (true) {\n\
  \            q1.get();\n        }\n    }\n}\nclass PC {\n    public static void\
  \ main(String args[]) {\n        Q q1 = new Q();\n        new Producer(q1);\n  \
  \      new Consumer(q1);\n        System.out.println(\"Press Control-C to stop\"\
  );\n    }\n}\n```\n\n尽管 `Q` 上的 `put()` 和 `get()` 方法是同步的，但没有什么能阻止生产者超过消费者，也没有什么阻止消费者两次消费同一个队列值。因此，我们可能会得到所示的错误输出：\n\
  \nOutput:\nPress Control-C to stop\nPut :1\nPut :2\nPut:3\nPut:4\nPut:5\nPut:6\n\
  Put:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nPut:8\nPut:9\nPut:10\n\
  Put:11\nPut:12\nPut:13\nPut:14\nPut:15\nGot:15\nGot:15\nGot:15\nGot:5\nGot:5\nGot:5\n\
  \n在 Java 中编写此程序的正确方法是使用 `wait()` 和 `notify()` 在两个方向上进行信号，如下：\n\n```java\nclass Q\
  \ {\n    int n;\n    boolean valueSet=false;\n    synchronized int get () {\n  \
  \      if(!valueSet) {\n            try {\n                wait();\n           \
  \ } catch (InterruptedException e) {\n                System.out.println(e);\n \
  \           }\n        }\n        System.out.println(\"Got :\" + n);\n        valueSet\
  \ = false;\n        notify();\n        return n;\n    }\n    synchronized void put\
  \ (int n) {\n        if(valueSet) {\n            try {\n                wait();\n\
  \            } catch (InterruptedException e) {\n                System.out.println(e);\n\
  \            }\n        }\n    }\n}\n```\n\n\n\n\n```java\n        }\n\n       \
  \ this.n=n;\n\n        valueSet =true;\n        System.out.println(\"Put :\" + n);\n\
  \        notify ();\n    }\n}\n\nclass Producer implements Runnable {\n\n    Q q1;\n\
  \n    Producer (Q q2) {\n        q1 = q2;\n        new Thread(this, \"Producer\"\
  ).start ();\n    }\n\n    public void run () {\n        int i = 0;\n        while\
  \ (true) {\n            q1.put (++i);\n        }\n    }\n}\n\nclass Consumer implements\
  \ Runnable {\n    Q q1;\n\n    Consumer (Q q2) {\n        q1 =q2;\n        new Thread\
  \ (this, \"consumer\").start ();\n    }\n\n    public void run () {\n        while\
  \ (true) {\n            q1.get ();\n        }\n    }\n}\n\nclass PC2 {\n    public\
  \ static void main (String args []) {\n        System.out.println(\"Press-C to stop\"\
  );\n        Q q1 = new Q();\n        new Producer(q1);\n        new Consumer(q1);\n\
  \    }\n}\n```\n\n输出:\nPress-C to stop\nPut:1\nGot:1\nPut:2\nGot:2\n...\n\n## 死锁\n\
  \n死锁是一种我们需要避免的特殊类型错误，特别是与多任务相关的。当两个线程对一对同步对象产生循环依赖时，就会发生死锁。例如，假设一个线程进入了对象 `X` 的监视器，另一个线程进入了对象\
  \ `Y` 的监视器。如果 `X` 中的线程尝试调用 `Y` 的任何同步方法，它将如预期地阻塞。然而，如果 `Y` 中的线程反过来尝试调用 `X` 的任何同步方法，该线程将永远等待，因为为了访问\
  \ `X`，它必须释放对 `Y` 的锁，以便第一个线程完成。死锁是一种很难调试的错误，原因如下：\n\n(i) 通常情况下，当两个线程以恰当的方式进行时间分片时，这种情况很少发生。\n\
  (ii) 它可能涉及两个以上的线程和两个同步对象。\n\n#### 示例\n```java\nclass A {\n    synchronized void\
  \ foo(B b1) {\n        System.out.println(\"Method foo called then blocked\");\n\
  \        try {\n            Thread.sleep(1000);\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e.getMessage());\n        }\n        System.out.println(\"\
  Trying to call b1.last()\");\n        b1.last();\n    }\n\n    synchronized void\
  \ last() {\n        System.out.println(\"This not be printed\");\n    }\n}\n\nclass\
  \ B {\n    synchronized void bar(A a1) {\n        System.out.println(\"Method bar\
  \ called then blocked\");\n        try {\n            Thread.sleep(1000);\n    \
  \    } catch(InterruptedException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n        System.out.println(\"Trying to call a1.last()\");\n        a1.last();\n\
  \    }\n\n    synchronized void last() {\n        System.out.println(\"This not\
  \ be printed\");\n    }\n}\n\nclass DeadLock implements Runnable {\n    A a1= new\
  \ A();\n    B b1 = new B();\n\n    DeadLock() {\n        Thread t = new Thread(this);\n\
  \        t.start();\n        a1.foo(b1);\n    }\n\n    public void run() {\n   \
  \     b1.bar(a1);\n    }\n\n    public static void main(String args[]) {\n     \
  \   new DeadLock();\n    }\n}\n```\n输出:\nMethod foo called then blocked\nMethod\
  \ bar called then blocked\nTrying to call b1.last()\nTrying to call a1.last()\n\n\
