  \    }\n}\n```\n输出：\n30\n30\n34432432432\n3.3\n0.33\n注意：如果字符串不包含可解析的数字，所有 `valueOf()`\
  \ 方法都会抛出“NumberFormatException”。\n\n 使用 使用类自身的构造函数将 String 对象（数字字符串）转换为数字对象\n\n\
  #### 示例 14.6\n```java\nclass StringToNumericDemo1 {\n    public static void main(String\
  \ args[]) {\n        String str=new String(\"30\");\n        //String str=\"30\"\
  ;\n        String str2=new String(\"30.33\");\n        Byte bObj = new Byte(str);\n\
  \        System.out.println(bObj);\n        //Byte bObj=new Byte(str2); //NumberFormatException\n\
