  \ 它是一个文件\n- tallylicserver.exe 它是一个文件\n- tallysav.dat 它是一个文件\n- tallywin.dat 它是一个文件\n\
  - tally.imp 它是一个文件\n- Data 它是一个目录\n\n### FileInputStream\n\n`FileInputStream` 是\
  \ `InputStream` 类的直接子类。要打开一个文件进行读取，你只需创建 `FileInputStream` 类的对象，并将文件名（直接或间接）作为构造函数的参数。\n\
  \n| `public FileInputStream(String) throws FileNotFoundException;` | 通过打开到文件系统中实际文件的连接来创建\
  \ `FileInputStream`，该文件由文件系统中的路径名 `filePath` 命名。 |\n| `public FileInputStream(File)\
  \ throws FileNotFoundException;` | 通过打开到文件系统中实际文件的连接来创建 `FileInputStream`，该文件由文件系统中的\
  \ `File` 对象 `file` 命名。 |\n| `public native int read()` throws `IOException` | |\n\
  | `public int read(byte[])` throws `IOException` | |\n| `public int read(byte[],\
  \ int)` throws `IOException` | |\n| `public native long skip(long)` throws `IOException`\
  \ | |\n| `public native int available()` throws `IOException` | |\n| `public void\
  \ close()` throws `IOException` | |\n\n### FileOutputStream\n\n`FileOutputStream`\
  \ 是 `OutputStream` 类的直接子类。要打开一个文件进行写入，我们只需创建 `FileOutputStream` 类的对象，并将文件名（直接或间接）作为构造函数的参数。\n\
  \n| `public FileOutputStream(String) throws FileNotFoundException;` | 创建一个写入到指定名称文件的输出流。\
  \ |\n| `public FileOutputStream(String, boolean) throws java.io.FileNotFoundException;`\
  \ | 创建一个写入到指定名称文件的输出流。 |\n| `public FileOutputStream(File) throws FileNotFoundException;`\
  \ | 创建一个写入到指定的 `File` 对象所代表文件的输出流。 |\n| `public FileOutputStream(File, boolean)\
  \ throws FileNotFoundException;` | 创建一个写入到指定的 `File` 对象所代表文件的输出流。 |\n| `public native\
  \ void write(int)` throws `java.io.IOException` | |\n| `public void write(byte[])`\
  \ throws `java.io.IOException` | |\n| `public void write(byte[], int, int)` throws\
  \ `java.io.IOException` | |\n| `public void close()` throws `java.io.IOException`\
  \ | |\n\n#### 5.2\n\n```java\nimport java.io.*;\nclass FileRead {\n    public static\
  \ void main(String args[]) {\n        FileInputStream fin=null;\n        int a;\n\
  \        try {\n            fin=new FileInputStream(args[0]);\n            System.out.println(\"\
  No. of characters to read=\"+fin.available());\n            fin.skip(3);\n     \
  \       a = fin.read();\n            while(a != -1) {\n                System.out.print((char)a);\n\
  \                a = fin.read();\n            }\n            System.out.println(\"\
  No. of characters to read=\"+fin.available());\n            fin.close();\n     \
  \   } catch(ArrayIndexOutOfBoundsException e) {\n            System.out.println(e);\n\
  \        } catch(FileNotFoundException e) {\n            System.out.println(e);\n\
  \        } catch(IOException e) {\n            System.out.println(e);\n        }\n\
  \    }\n}\n```\n\n输出:\n```text\njava FileRead A.txt\nNo. of characters to read=20\n\
  Matrix Computers\nNo. of characters to read=0\n```\n\n#### 示例 15.3\n\n```java\n\
  import java.io.*;\nclass FileCopy {\n    public static void main(String args[])\
  \ throws IOException {\n        FileInputStream fin=null;\n        FileOutputStream\
  \ fout=null;\n        fin=new FileInputStream(args[0]);\n        fout=new FileOutputStream(args[1]);\n\
  \        int a;\n        a = fin.read();\n        while(a != -1) {\n           \
  \ fout.write(a);\n            a = fin.read();\n        }\n        fin.close();fout.close();\n\
  \    }\n}\n```\n\n#### 示例 15.4\n\n```java\nimport java.io.*;\nclass CopyFile {\n\
  \    public static void main(String args[]) throws IOException {\n        int n;\n\
  \        FileInputStream fin = new FileInputStream(\"A.txt\");\n        FileOutputStream\
  \ fout = new FileOutputStream(\"B.txt\");\n        byte b[]= new byte[10];\n   \
  \     n = fin.read(b);\n        while(n != -1) {\n            fout.write(b,0,n);\n\
  \            n = fin.read(b);\n        }\n        fin.close();\n    }\n}\n```\n\n\
  \n\n\n\n# FileReader\n\n`FileReader` 类创建了一个 `Reader`，你可以使用它来读取文件的内容。它最常用的两个构造函数是：\n\
  \n- `FileReader(File file)` 创建一个 `FileReader` 流，从指定的文件读取内容。\n- `FileReader(String\
  \ fileName)` 创建一个 `FileReader` 流，从指定的文件读取内容。\n\n注意：如果文件不存在、是一个目录而不是普通文件，或者由于其他原因无法打开读取，任一个构造函数都会抛出\
  \ `FileNotFoundException`。\n\n# FileWriter\n\n`FileWriter` 类创建了一个写入器，你可以使用它向文件写入。它最常用的构造函数是：\n\
  \n#### 构造函数\n\n- `FileWriter(File file)`：构造一个 `FileWriter` 对象以写入指定的文件。\n- `FileWriter(String\
  \ fileName)`：构造一个 `FileWriter` 对象以写入指定的文件。\n- `FileWriter(File file, boolean append)`：构造一个\
  \ `FileWriter` 对象，以追加模式写入指定的文件。\n- `FileWriter(String filename, boolean append)`：构造一个\
  \ `FileWriter` 对象，以追加模式写入指定的文件。如果使用前两个构造函数，则总是创建一个新文件。如果存在同名文件，它将被销毁。如果使用后两个构造函数且\
  \ `append` 标志为 false，则它们的行为与前两个构造函数相同。\n\n如果 `append` 标志为 true，则以追加模式打开文件，即如果文件已存在，则文件指针位于文件末尾；如果文件不存在，则创建一个新文件。\n\
  \n### 注意\n\n如果文件存在但是一个目录而不是普通文件、不存在但无法创建，或由于其他原因无法打开，这些构造函数可能会抛出 `IOException`。例如，当你尝试打开一个只读文件时，将抛出\
  \ `IOException`。\n\n### 示例 15.5\n\n```java\nimport java.io.*;\nclass FileCopy {\n\
  \    public static void main(String args[]) throws IOException {\n        FileReader\
  \ fin=null;\n        FileWriter fout=null;\n        fin=new FileReader(args[0]);\n\
  \        fout=new FileWriter(args[1]);\n        int a;\n        a = fin.read();\n\
  \        while(a != -1) {\n            fout.write((char)a);\n            a = fin.read();\n\
  \        }\n        fin.close();\n        fout.close();\n    }\n}\n```\n\n# RandomAccessFile\n\
  \n`RandomAccessFile` 封装了一个随机访问文件。`RandomAccessFile` 允许我们从文件的某个位置读取和写入字节、文本和原始数据类型（在使用适当的访问权限时）。它没有派自\
  \ `InputStream`。相反，它实现了 `DataInput` 和 `DataOutput` 接口，这两个接口定义了基本的 I/O 方法。它还支持定位请求——你可以将文件指针定位到文件中的任何位置。\n\
  \n`mode` 参数指定打开文件的访问模式。允许的值值及其含义如下：\n\n| 值 | 含义 |\n| :--- | :--- |\n| \"r\" | 仅读打开。调用生成对象的任何写入方法将导致抛出\
  \ `IOException`。 |\n| \"rw\" | 读写打开。如果文件不存在，则将尝试创建它。 |\n| \"rws\" | 读写打开，与 \"rw\"\
  \ 相同，但还要求对文件内容或元数据的每次更新都要同步写入底层存储设备。 |\n| \"rwd\" | 读写打开，与 \"rw\" 相同。但还要求对文件内容（数据）的每次更新都要同步写入底层存储设备。\
  \ |\n\n### RandomAccessFile 类的方法\n\n除了 `DataInput` 和 `DataOutput` 接口的方法外，该类的一些常用方法还有：\n\
  \n- `public RandomAccessFile(String, String) throws java.io.FileNotFoundException;`：创建一个随机访问文件流，从指定的文件名读取，并可选写入。\n\
  - `public RandomAccessFile(File, String) throws FileNotFoundException;`：创建一个随机访问文件流，从\
  \ `File` 参数指定的文件读取，并可选写入。\n- `public native int read() throws java.io.IOException;`\n\
  - `public int read(byte[], int);`\n- `public int read(byte[]);`\n- `public int skip(int);`\n\
  - `public native void write(int);`\n- `public void write(byte[]);`\n- `public void\
  \ write(byte[], int);`\n- `public native long getPointer();`\n- `public native void\
  \ seek(long);`\n- `public native long length();`\n- `public void setLength(long);`\n\
  - `public void close();`\n- `public final boolean readBoolean();`\n- `public final\
  \ byte readByte();`\n- `public final int readUnsignedByte();`\n- `public final short\
  \ readShort();`\n- `public final int readUnsignedShort();`\n- `public final char\
  \ readChar();`\n- `public final int readInt();`\n- `public final long readLong();`\n\
  - `public final float readFloat();`\n- `public final double readDouble();`\n- `public\
  \ final String readLine();`\n- `public final String readUTF();`\n- `public final\
  \ void write(boolean);`\n- `public final void writeByte(int);`\n- `public final\
  \ void writeShort(int);`\n- `public final void writeChar(int);`\n- `public final\
  \ void writeInt(int);`\n- `public final void writeLong(long);`\n- `public final\
  \ void writeFloat(float);`\n- `public final void writeDouble(double);`\n- `public\
  \ final void writeBytes(java.lang.String);`\n- `public final void writeChars(java.lang.String);`\n\
  - `public final void writeUTF(java.lang.String);`\n\n### 示例 15.6\n\n```java\nimport\
  \ java.io.*;\nclass RandomIO {\n}\n```\n\n\n\n\n\n```java\npublic static void main(String\
  \ args[]) throws IOException {\n    RandomAccessFile file = null;\n    try {\n \
  \       file = new RandomAccessFile(\"rand.dat\", \"rw\");\n        file.writeChar('X');\n\
  \        file.writeInt(1999);\n        file.writeDouble(222.44);\n        System.out.println(\"\
  File pointer Pos:\"+file.getFilePointer());\n        file.seek(0);\n        System.out.println(file.readChar());\n\
  \        System.out.println(file.readInt());\n        System.out.println(file.readDouble());\n\
  \        System.out.println(\"File pointer Pos:\"+file.getFilePointer());\n    \
  \    file.seek(2);\n        System.out.println(\"File pointer Pos:\"+file.getFilePointer());\n\
  \        System.out.println(file.readInt());\n        file.seek(file.length());\n\
  \        file.writeBoolean(false);\n        file.seek(14);\n        System.out.println(file.readBoolean());\n\
  \        System.out.println(\"File pointer Pos:\"+file.getFilePointer());\n    \
  \    System.out.println(file.readInt());//EOF Exception\n    } catch(EOFException\
  \ e) {\n        System.out.println(\"Trying to after end of file\");\n    } finally\
  \ {\n        file.close();\n    }\n}\n```\n\n输出：\nFile pointer Pos:14\nX\n1999\n\
  222.44\nFile pointer Pos:14\nFile pointer Pos:2\n1999\nfalse\nFile pointer Pos:15\n\
  Trying to after end of file\n\n注意：如果尝试在文件末尾之后进行读取，则会发生 `EOFException`。\n\n### ByteArrayInputStream\n\
  \n`ByteArrayInputStream` 包含一个内部缓冲区，其中包含了可以从流中读取的字节。`ByteArrayInputStream` 是一个使用字节数组作为源的输入流实现。该类有两个构造函数，每个构造函数都需要一个字节数组来提供数据源。\n\
  \n`ByteArrayInputStream` 实现了 `mark()` 和 `reset()` 方法。然而，如果没有调用过 `mark()`，则 `reset()`\
  \ 会将流指针置到流的开头。\n\n| 方法 |\n| :--- |\n| `public ByteArrayInputStream(byte[]);` |\n\
  | `public ByteArrayInputStream(byte[], int, int);` |\n| `public synchronized int\
  \ read();` |\n| `public synchronized int read(byte[], int, int);` |\n| `public synchronized\
  \ long skip(long);` |\n| `public synchronized int available();` |\n| `public boolean\
  \ markSupported();` |\n| `public void mark(int);` |\n| `public synchronized void\
  \ reset();` |\n| `public void close() throws IOException;` |\n\n#### 示例 15.7:\n\n\
  ```java\nimport java.io.*;\nclass ByteArrayInputStreamTest {\n    public static\
  \ void main(String args[]) throws IOException {\n        String s1=\"abcdefghij\"\
  ;\n        byte b[]=s1.getBytes();\n        ByteArrayInputStream b1 = new ByteArrayInputStream(b);\n\
  \        int a;\n        while((a=b1.read())=-1) {\n            System.out.print((char)Character.toUpperCase(a));\n\
  \        }\n        b1.close();\n    }\n}\n```\n输出: ABCDEFGHIJK\n\n### ByteArrayOutputStream\n\
  \n`ByteArrayOutputStream` 实现了一个输出流，其中数据被写入字节数组中。`ByteArrayOutputStream` 是一个使用字节数组作为目的的输出流实现。缓冲区存储在\
  \ `ByteArrayOutputStream` 的保护字段 `buf` 中。如果需要，缓冲区的大小会自动增加。缓冲区所持有的字节数包含在 `ByteArrayOutputStream`\
  \ 的保护字段 `count` 中。\n\n| 方法 |\n| :--- |\n| `public java.io.ByteArrayOutputStream();`创建一个新的字节数组输出流。缓冲区的初始容量为\
  \ 32 字节，如有需要将增大其大小。 |\n| `public java.io.ByteArrayOutputStream(int);`创建一个新的字节数组输出流，具有指定大小（字节）的缓冲区容量。\
  \ |\n| `public synchronized void write(int);` |\n| `public synchronized void write(byte[],\
  \ int, int);` |\n| `public synchronized void writeTo(java.io.OutputStream) throws\
  \ java.io.IOException;` |\n| `public synchronized void reset();` |\n| `public synchronized\
  \ byte[] toByteArray();` |\n| `public synchronized int size();` |\n| `public synchronized\
  \ java.lang.String toString();` |\n| `public synchronized java.lang.String toString(java.lang.String)\
  \ throws java.io.UnsupportedEncodingException;` |\n| `public synchronized java.lang.String\
  \ toString(int);` |\n| `public void close() throws java.io.IOException;` |\n\n####\
  \ 示例 15.8:\n\n```java\nimport java.io.*;\nclass ByteArrayOutputStreamTest {\n  \
  \  public static void main(String args[]) throws IOException {\n        ByteArrayOutputStream\
  \ b1 = new ByteArrayOutputStream();\n        b1.write('a');\n        String s1 =\
  \ \"abcdefghij\";\n        byte arr1[]= s1.getBytes();\n        b1.write(arr1);\n\
  \        System.out.println(b1);  //toString()\n        // 使用 for 循环显示\n       \
  \ byte arr2[] = b1.toByteArray();\n        for(int i=0;i<arr2.length;i++) {\n  \
  \          System.out.print((char)arr2[i]);\n        }\n        System.out.println();\n\
  \        // 使用 for 循环显示\n        for(int i:arr2) {\n            System.out.print((char)i);\n\
  \        }\n        b1.close();\n    }\n}\n```\n输出: aabcdefghij\n\n\n\n\n从指定的字符数组创建一个\
  \ `CharArrayReader`。生成的读取器将从给定的偏移量开始读取。从此读取器可以读取的字符值总数将是 `length` 或 `buf.length`。\n\
  \n#### 示例 15.9\n\n```java\nimport java.io.*;\nclass CharArrayReaderTest {\n    public\
  \ static void main(String args[]) throws IOException {\n        String tmp = \"\
  abcdefghijklmnopqrstuvwxyz\";\n        int length = tmp.length();\n        char\
  \ c[] = new char[length];\n        tmp.getChars(0, length, c, 0);\n        CharArrayReader\
  \ input1 = new CharArrayReader(c);\n        CharArrayReader input2 = new CharArrayReader(c,\
  \ 0, 5);\n        int i;\n        while ((i = input1.read()) != -1) {\n        \
  \    System.out.print((char)i);\n        }\n        System.out.println();\n    \
  \    while ((i = input2.read()) != -1) {\n            System.out.print((char)i);\n\
  \        }\n    }\n}\n```\n**输出：**\nabcdefghijklmnopqrstuvwxyz\nabcde\n\n### CharArrayWriter\n\
  \n`CharArrayWriter` 是一个写入流的实现，它使用字符数组缓冲区作为目标。\n\n#### 构造函数\n- `CharArrayWriter()`\n\
  - `CharArrayWriter(int initialSize)`\n\n在第一种形式中，创建一个具有默认大小的缓冲区。在第二种形式中，创建一个大小由参数\
  \ `initialSize` 指定缓冲区。\n\n缓冲区存储在 `CharArrayWriter` 的 `buf` 字段中。如果需要，缓冲区的大小会自动增大。缓冲区持有的字符数包含在\
  \ `CharArrayWriter` 的 `count` 字段中。`buf` 和 `count` 都是受保护字段。\n\n#### 示例 15.10\n\n\
  ```java\nimport java.io.*;\nclass CharArrayWriterTest {\n    public static void\
  \ main(String args[]) throws IOException {\n        CharArrayWriter f = new CharArrayWriter();\n\
  \        String s = \"This should end up in the array\";\n        char buf[] = new\
  \ char[s.length()];\n        s.getChars(0, s.length(), buf, 0);\n        f.write(buf);\n\
  \        System.out.println(f.toString());\n        char c[] = f.toCharArray();\n\
  \        for (int i = 0; i < c.length; i++) {\n            System.out.print(c[i]);\n\
  \        }\n        FileWriter f2 = new FileWriter(\"test.txt\");\n        f.writeTo(f2);\n\
  \        f2.close();\n        f.reset();\n        System.out.println();\n      \
  \  System.out.println(\"After:\" + f.toString());\n        for (int i = 0; i < 3;\
  \ i++) {\n            f.write('A');\n            System.out.println(f.toString());\n\
  \        }\n    }\n}\n```\n**输出：**\nThis should end up in the array\nThis should\
  \ end up in the array\nAfter:AAA\n\n### Pushback Input Stream\n\n`PushbackInputStream`\
  \ 为另一个输入流增加了功能，即能够“回退”或“取消读取”一个字节。缓冲化的用途之一就是实现回退。`Pushback` 用于输入流，允许读取一个字节后将其返回到流中。除了\
  \ `InputStream` 类中常见的方法外，`PushbackInputStream` 还提供了 `unread()` 方法，此处所示：\n\n| `public\
  \ java.io.PushbackInputStream(java.io.InputStream, int)` | 创建一个具有指定大小回退缓冲区的 `PushbackInputStream`，并保存其参数输入流以备后后用。这允许将多个字节返回到输入流。\
  \ |\n| `public java.io.PushbackInputStream(java.io.InputStream)` | 创建一个 `PushbackInputStream`\
  \ 并保存其参数输入流以备后用。这允许将一个字节返回到输入流。 |\n| `public int read() throws java.io.IOException;`\
  \ | |\n| `public int read(byte[], int, int) throws java.io.IOException;` | |\n|\
  \ `public void unread(int) throws java.io.IOException;` | 通过将字节复制到回退缓冲区的开头来回退一个字节\
  \ |\n| `public void unread(byte[], int, int) throws java.io.IOException;` | 通过将字节数组的一部分复制到回退缓冲区的开头来回退字节数组的一部分。\
  \ |\n| `public void unread(byte[]) throws java.io.IOException;` | 通过将字节数组复制到回退缓冲区的开头来回退字节数组。\
  \ |\n| `public int available() throws java.io.IOException;` | |\n| `public long\
  \ skip(long) throws java.io.IOException;` | |\n| `public boolean markSupported();`\
  \ | `PushbackInputStream` 的副作用是会使创建它的 `InputStream` 的 `mark()` 或 `reset()` 方法失效。使用\
  \ `markSupported()` 方法检查任何你将要使用 `mark()`/`reset()` 的流。 |\n| `public synchronized\
  \ void mark(int);` | |\n| `public synchronized void reset() throws java.io.IOException;`\
  \ | |\n| `public synchronized void close() throws java.io.IOException;` | |\n\n\
  ### 示例 15.11\n\n```java\nimport java.io.*;\nclass PushbackInputStreamTest {\n  \
  \  public static void main(String args[]) throws IOException {\n        FileInputStream\
  \ fin = new FileInputStream(\"A.txt\");\n        PushbackInputStream p1 = new PushbackInputStream(fin);\n\
  \        int ch = p1.read();\n        System.out.println((char)ch);\n        ch\
  \ = p1.read();\n        System.out.println((char)ch);\n        ch = p1.read();\n\
  \        System.out.println((char)ch);\n        p1.unread(ch);\n        ch = p1.read();\n\
  \        System.out.println((char)ch);\n    }\n}\n```\n**输出：**\nA.txt contains “Matrix\
  \ Computers”\nm\na\nt\n\n\n\n\n\n| public int read(char[], int, int) throws java.io.IOException;\
  \ |\n| public void unread(int) throws java.io.IOException;推回单个字符。 |\n| public void\
  \ unread(char[], int, int) throws java.io.IOException;通过将字符数组的一部分拷贝到推回缓冲区开头来推回该部分。\
  \ |\n| public void unread(char[]) throws java.io.IOException;通过将数组拷贝到推回缓冲区开头来推回该数组。\
  \ |\n| public boolean ready() throws java.io.IOException; |\n| public void mark(int)\
  \ throws java.io.IOException; |\n| public void reset() throws java.io.IOException;\
  \ |\n| public boolean markSupported(); |\n| public void close() throws java.io.IOException;\
  \ |\n| public long skip(long) throws java.io.IOException; |\n\n**注意**：当在推回缓冲区满的情况下尝试返回字符时，将抛出\
  \ `IOException`。\n\n#### 示例 15.12:\n\n```java\nimport java.io.*;\nclass PushbackReaderTest\n\
  {\n    public static void main(String args[]) throws IOException\n    {\n      \
  \  FileReader fr = new FileReader(\"A.txt\");\n        PushbackReader pr=new PushbackReader(fr);\n\
  \        int ch=pr.read();\n        System.out.println((char)ch);\n        ch=pr.read();\n\
  \        System.out.println((char)ch);\n        ch=pr.read();\n        System.out.println((char)ch);\n\
  \        pr.unread(ch);\n        ch=pr.read();\n        System.out.println((char)ch);\n\
  \    }\n}\n```\n**输出：**\n```\nm\na\nt\nt\n```\n\n### SequenceInputStream:-\n\n`SequenceInputStream`\
  \ 类是一个字节流，允许你连接多个 `InputStreams`。`SequenceInputStream` 的构造与其他任何 `InputStream` 都不同。\n\
  \n- `SequenceInputStream(InputStream1, InputStream2)`：通过记住两个参数来初始化新创建的 `SequenceInputStream`，这两个将按顺序读取（先\
  \ `InputStream1` 然后是 `InputStream2`），以便为该 `SequenceInputStream` 提供要读取的字节。\n- `SequenceInputStream(Enumeration\
  \ e)`：通过记住参数来初始化新创建的 `SequenceInputStream`，该参数必须是一个运行时类型为 `InputStream` 的 `Enumeration`。在操作上，该类满足第一个\
  \ `InputStream` 的请求直到其耗尽，然后切换到第二个。在 `Enumeration` 的情况下，它将继续遍历所有的 `InputStreams`\
  \ 直到最后一个流的结束。\n\n**示例 15.13 在此处将文件名作为命令行参数给出：**\n\n```java\nimport java.io.*;\n\
  class SequenceInputStreamTest\n{\n    public static void main(String args[]) throws\
  \ IOException\n    {\n        FileInputStream f1 = new FileInputStream(args[0]);\n\
  \        FileInputStream f2 = new FileInputStream(args[1]);\n        FileOutputStream\
  \ f3 = new FileOutputStream(args[2]);\n        SequenceInputStream sis = new SequenceInputStream(f1,f2);\n\
  \        int c;\n        while((c = sis.read()) != -1)\n        {\n            f3.write(c);\n\
  \        }\n        f3.close();f1.close();f2.close();\n    }\n}\n```\n**输出：**\n\
  ```\njava SequenceInputStreamTest A.txt B.txt C.txt\n```\n\n### PrintStream:-\n\n\
  它是一个字节流类，继承自 `FilterOutputStream`。`PrintStream` 为另一个输出流增加了功能，即方便地打印各种数据值表示的能力。\n\
  \n可选地，可以创建一个 `PrintStream` 以实现自动刷新；这意味着在写入字节数组、调用其中一个 `println()` 方法或写入换行符 `\\n`\
  \ 之后会调用 `flush()` 方法。通过 `PrintStream` 打印的所有字符都将使用平台的默认编码转换为字节，然后写入 `OutputStream`。`PrintStream`\
  \ 支持针对所有类型的 `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintStream` 方法将调用对象的 `toString()`\
  \ 方法并打印结果。\n\n**构造函数：**\n\n- `PrintStream(File file)`：使用指定的文件创建一个新的打印流，不带自动刷新。\n\
  - `PrintStream(String fileName)`：使用指定的文件名创建一个新的打印流，不带自动刷新。\n- `PrintStream(OutputStream\
  \ out)`：向指定的 `OutputStream` 创建一个新的打印流。\n- `PrintStream(OutputStream out, boolean\
  \ autoFlush)`：创建一个连接到指定 `OutputStream` 的新打印流。\n\n**示例 15.4：**\n\n```java\nimport\
  \ java.io.*;\nclass PrintStream\n{\n    public static void main(String args[]) throws\
  \ IOException\n    {\n        PrintStream ps = new PrintStream(System.out, true);\n\
  \        ps.println(\"This is a string\");\n        int i = -7;\n        ps.println(i);\n\
  \        double d = 4.5e-7;\n        ps.println(d);\n    }\n}\n```\n**输出：**\n```\n\
  This is a string\n-7\n4.5E-7\n```\n\n### 示例 15.15\n\n```java\nimport java.io.*;\n\
  class PrintStreamTest2\n{\n    public static void main (String argv[]) throws IOException\n\
  \    {\n        FileOutputStream fout = new FileOutputStream(\"test.dat\");\n  \
  \      PrintStream ps = new PrintStream(fout, true);\n        ps.println(\"This\
  \ is a string\");\n        int i = -7;\n        ps.println(i);\n        double d\
  \ = 4.5e-7;\n        ps.println(d);\n        fout.close();\n    }\n}\n```\n\n\n\n\
  \n# PrintWriter 构造函数与用法\n\n创建一个新的 `PrintWriter`，不自动刷新行，用于向指定的 `OutputStream` 写入。\n\
  \n`PrintWriter(OutputStream out, boolean autoFlush)`\n\n创建一个新的 `PrintWriter` 用于向指定的\
  \ `OutputStream` 写入。\n\n`PrintWriter(Writer out)`\n\n创建一个新的 `PrintWriter`，不自动刷新行，用于向指定的\
  \ `Writer` 写入。\n\n`PrintWriter(Writer out, Boolean autoFlush)`\n\n创建一个新的 `PrintWriter`\
  \ 用于向指定的 `Writer` 写入。\n\n常用的构造函数是：\n\n`PrintWriter(OutputStream os, boolean flushOnNewLine)`\n\
  \n在这里，`os` 是 `OutputStream` 类型的对象，`flushOnNewLine` 控制 Java 在每次调用 `println()` 方法时是否冲刷输出流。如果\
  \ `flushOnNewLine` 为 `true`，则会自动进行刷新。如果为 `false`，则不自动刷新。\n\n`PrintWriter` 支持所有类型（包括对象）的\
  \ `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintWriter` 方法会调用对象的 `toString()` 方法并打印结果。\n\
  \n要使用 `PrintWriter` 写入控制台，请为输出流指定 `System.out`，并在每个新行后刷新流。例如，此行代码创建了一个连接到控制台输出的\
  \ `PrintWriter`。\n\n`PrintWriter pw = new PrintWriter(System.out, true)`\n\n###\
  \ 示例 15.16\n```java\nimport java.io.*;\nclass PrintWriterTest {\n    public static\
  \ void main (String argv[]) throws IOException {\n        PrintWriter pw = new PrintWriter(System.out,\
  \ true);\n        pw.println(\"This is a string\");\n        int i = -7;\n     \
  \   pw.println(i);\n        double d = 4.5e-7;\n        pw.println(d);\n    }\n\
  }\n```\n**输出:**\n```\nThis is a string\n-7\n4.5E-7\n```\n\n### 示例 15.17\n```java\n\
  import java.io.*;\nclass PrintWriterTest1 {\n    public static void main (String\
  \ argv[]) throws IOException {\n        FileWriter fout = new FileWriter(\"test.dat\"\
  );\n        PrintWriter pw = new PrintWriter(fout, true);\n        pw.println(\"\
  This is a string\");\n        int i = -7;\n        pw.println(i);\n        double\
  \ d = 4.5e-7;\n        pw.println(d);\n    }\n}\n```\n\n### 示例 15.18\n```java\n\
  import java.io.*;\nclass PrintWriterTest2 {\n    public static void main (String\
  \ argv[]) throws IOException {\n        PrintWriter pw = new PrintWriter(\"test.dat\"\
  );\n        pw.println(\"This is a string\");\n        int i = -7;\n        pw.println(i);\n\
  \        double d = 4.5e-7;\n        pw.println(d);\n        pw.close();\n    }\n\
  }\n```\n\n# PipedInputStream 和 PipedOutputStream\n\n管道输出流可以连接到管道输入流以创建一个通信管道。管道输出流是管道的发送端。管道输入流应该连接到管道输出流；随后，管道输入流提供提供写入管道输出流的字节。通常情况下，数据由一个线程从\
  \ `PipedInputStream` 对象读取，并由另一个线程向对应的 `PipedOutputStream` 写入数据。不建议在单个线程中使用这两个对象，因为这可能会导致线程死锁。\n\
  \n#### 构造函数\n- `PipedInputStream()`: 创建一个 `PipedInputStream` 处于未连接状态。\n- `PipedInputStream(PipedInputStream\
  \ src)`: 创建一个 `PipedInputStream` 使其连接到输出流 `src`。\n- `PipedOutputStream()`: 创建一个\
  \ `PipedOutputStream`，其尚未连接到管道输入流。\n- `PipedOutputStream(PipedInputStream snc)`:\
  \ 创建一个连接到指定管道输入流的 `PipedOutputStream`。\n\n### 示例 15.19\n```java\nimport java.io.*;\n\
  class TextGenerator extends Thread {\n    OutputStream out;\n    TextGenerator(OutputStream\
  \ out) {\n        this.out = out;\n    }\n    public void run() {\n        try {\n\
  \            for(byte b = 65; b<=90; b++)\n                out.write(b);\n     \
  \   } finally {\n            out.close();\n        }\n    } catch(IOException e)\
  \ {\n        System.out.println(e);\n    }\n}\nclass Pipe {\n    public static void\
  \ main(String args[]) throws IOException {\n        PipedOutputStream out = new\
  \ PipedOutputStream();\n        PipedInputStream in = new PipedInputStream(out);\n\
  \        TextGenerator data = new TextGenerator(out);\n        data.start();\n \
  \       int ch;\n        while((ch = in.read()) != -1)\n            System.out.print((char)\
  \ ch);\n    }\n}\n```\n**输出:**\n```\nABCDEFGHIJKLMNOPQRSTUVWXYZ\n```\n\n# PipedReader\
  \ 和 PipedWriter\n\n它们的功能与 `PipedInputStream` 和 `PipedOutputStream` 相同，区别在于它们是字符流。\n\
  \n#### 构造函数\n- `PipedReader()`: 创建一个 `PipedReader` 处于未连接状态。\n- `PipedReader(PipedWriter\
  \ src)`: 创建一个 `PipedReader` 使其连接到管道写入器 `src`。\n- `PipedWriter()`: 创建一个 `PipedWriter`，其尚未连接到管道读取器。\n\
  - `PipedWriter(PipedReader snk)`: 创建一个连接到指定管道读取器的 `PipedWriter`。\n\n### 示例 15.20\n\
  ```java\nimport java.io.*;\nclass TextGenerator extends Thread {\n    Writer out;\n\
  ```\n\n\n\n\n\n#### TextGenerator(Writer out)\n\n```java\nTextGenerator(Writer out)\
  \ {\n    this.out = out;\n}\n\npublic void run() {\n    try {\n        try {\n \
  \           for(char c = 'a'; c <= 'z'; c++) {\n                out.write(c);\n\
  \            }\n        } finally {\n            try {\n                Thread.sleep(200);\n\
  \            } catch (Exception e) {}\n            System.out.println(\"aaaaaaaaa\"\
  );\n            if(true)\n                return; // IOException: pipe Broken\n\
  \            out.close(); //IOException: Write end dead\n        } //OK if thread\
  \ finishes after closing the pipe\n    } catch (IOException e) {\n        System.out.println(e);\n\
  \    }\n}\n```\n\n### Pipe2 类示例\n\n```java\nclass Pipe2 {\n    public static void\
  \ main(String argv[]) throws IOException {\n        PrintStream ps = new PrintStream(System.out);\n\
  \        PipedWriter out = new PipedWriter();\n        PipedReader in = new PipedReader(out);\n\
  \        TextGenerator data = new TextGenerator(out);\n        data.start();\n \
  \       int ch;\n        while((ch = in.read()) != -1) {\n            System.out.print((char)\
  \ ch);\n        }\n    }\n}\n```\n\n**输出：**\n`abcdefghijklmnopqrstuvwxyaaaaaaaaaaaa`\n\
  `Exception in thread \"main\" java.io.IOException: Pipe broken`\n\n---\n\n### 过滤字节流\n\
  \n#### 过滤字节流\n\n过滤流实际上是对底层输入或输出流的封装，能够透明地提供某些扩展级别的功能。典型的扩展包括缓冲、zip 压缩/解压等。过滤字节流包括\
  \ `FilterInputStream` 和 `FilterOutputStream`。它们的构造函数如下：\n\n`FilterInputStream(InputStream\
  \ in)`\n通过将参数 `in` 赋值给字段 `this.in` 来创建一个 `FilterInputStream`，以便稍后备用。\n\n`FilterOutputStream(OutputStream\
  \ out)`\n创建一个构建在指定的底层输出流之上的输出流过滤器。\n\n这些类中提供的方法与 `InputStream` 和 `OutputStream`\
  \ 中的方法相同。\n\n#### 缓冲字节流\n\n对于面向字节的流，缓冲流通过为 I/O 流附加一个内存缓冲区来扩展过滤流类。该缓冲区允许 Java 一次处理多个字节的\
  \ I/O 操作，从而提高性能。\n\n由于缓冲区的可用，流的跳过（skip）、标记（mark）和重置（reset）变得可能。缓冲字节流类是 `BufferedInputStream`\
  \ 和 `BufferedOutputStream`。`PushbackInputStream` 也实现了缓冲流。\n\n#### BufferedInputStream\n\
  \n缓冲 I/O 是一种常见的性能优化。Java 的 `BufferedInputStream` 类允许将任何 `InputStream` “包装”为缓冲流并实现这种性能提升。\n\
  \n`BufferedInputStream` 有两个构造函数：\n\n`BufferedInputStream(InputStream in)`\n创建一个\
  \ `BufferedInputStream` 并保存其参数输入流 `in` 以供后使用。创建一个并存储在 `buf` 中的缓冲区数组。\n\n`BufferedInputStream(InputStream\
  \ in, int size)`\n以指定的缓冲区大小创建，并保存其参数输入流 `in` 以供后使用。缓冲输入流为支持在可用缓冲区中向后移动提供了基础。除了任何\
  \ `InputStream` 都实现的 `read()` 和 `skip()` 方法外，`BufferedInputStream` 还支持 `mark()`\
  \ 和 `reset()` 方法。这种支持体现在 `BufferedInputStream.markSupported()` 返回 true。\n\n**示例\
  \ 5.2**\n\n```java\nimport java.io.*;\nclass BufferedInputStream {\n    public static\
  \ void main(String args[]) throws IOException {\n        FileInputStream fin = new\
  \ FileInputStream(\"A.txt\");\n        BufferedInputStream b1 = new BufferedInputStream(fin);\n\
  \        for(int i=1; i<=10; i++) {\n            System.out.print((char)b1.read());\n\
  \        }\n        System.out.println();\n        if(b1.markSupported()) {\n  \
  \          b1.mark(500);\n            for(int i=1; i<=10; i++) {\n             \
  \   System.out.print((char)b1.read());\n            }\n            System.out.println();\n\
  \            b1.reset();\n            for(int i=1; i<=10; i++) {\n             \
  \   System.out.print((char)b1.read());\n            }\n        }\n    }\n}\n```\n\
  \n\n\n\n\n# BufferedOutputStream\n\n创建一个新的缓冲输出流，用于将数据写入指定的底层输出流。它使用一个大小为 512 字节的缓冲区。\n\
  \n`BufferedOutputStream(OutputStream out, int size)`\n\n创建一个新的缓冲输出流，使用指定的缓冲区大小将数据写入指定的底层输出流。\n\
  \n#### 示例 15.22\n\n```java\nimport java.io.*;\nclass BufferedOutputStreamTest\n\
  {\n    public static void main(String args[ ]) throws IOException\n    {\n     \
  \   BufferedOutputStream f = new BufferedOutputStream (System.out,100);\n      \
  \  byte buf[ ] = \"This will not be displayed without flush()\\n\".getBytes();\n\
  \        f.write(buf);\n        f.write(buf);\n        System.out.println(\"testing...\"\
  );\n        f.write(buf);\n        //f.flush(); or\n        //f.close();\n    }\n\
  }\n```\n\n**输出：**\n```\ntesting...\nThis will not be displayed without flush()\n\
  This will not be displayed without flush()\nThis will not be displayed without flush()\n\
  ```\n\n### BufferedReader\n\n`BufferedReader` 通过缓冲输入来提高性能。它有两个构造函数：\n\n`BufferedReader(Reader\
  \ in)`\n创建一个使用默认大小输入缓冲区的缓冲字符输入流。\n\n`BufferedReader(Reader in, int sz)`\n创建一个使用指定大小输入缓冲区的缓冲字符输入流。\n\
  \n#### 示例 15.23\n\n```java\nimport java.io.*;\nclass BufferedReaderTest\n{\n   \
  \ public static void main(String args[])throws IOException\n    {\n        FileReader\
  \ fr=new FileReader(\"A.txt\");\n        BufferedReader b1 = new BufferedReader(fr);\n\
  \        for(int i=1;i<=10;i++)\n        {\n            System.out.print((char)b1.read());\n\
  \        }\n        System.out.println();\n        if(b1.markSupported())\n    \
  \    {\n            b1.mark(5);\n            for(int i=1;i<=10;i++)\n          \
  \  {\n                System.out.print((char)b1.read());\n            }\n      \
  \      System.out.println();\n            b1.reset();\n            for(int i=1;i<=10;i++)\n\
  \        {\n                System.out.print((char)b1.read());\n            }\n\
  \        }\n        else\n        {\n            System.out.println(\"Marking option\
  \ is availabel\");\n        }\n        b1.close();\n        fr.close();\n    }\n\
  }\n```\n\n### BufferedWriter\n\n使用 `BufferedWriter` 通过减少数据实际写入输出流的次数来提高性能。\n\n####\
  \ 构造函数\n\n`BufferedWriter(Writer out)`\n创建一个使用默认大小输出缓冲区的缓冲字符输出流。\n\n`BufferedWriter(Writer\
  \ out, int sz)`\n创建一个使用给定大小输出缓冲区的缓冲字符输出流。\n\n#### 示例 15.24\n\n```java\nimport java.io.*;\n\
  class BufferedWriterTest\n{\n    public static void main(String args[]) throws IOException\n\
  \    {\n        BufferedWriter f = new BufferedWriter(new PrintWriter(System.out));\n\
  \        String s  = \"This will not be displayed without flush()\\n\";\n      \
  \  char buf[ ] = new char[s.length()];\n        s.getChars(0,s.length(),buf,0);\n\
  \        f.write(buf);\n        f.write(buf);\n        System.out.println(\"testing...\"\
  );\n        f.write(buf);\n        //f.flush();\n        //f.close();\n    }\n}\n\
  ```\n**输出：**\n```\ntesting...\n```\n\n# 使用字节流处理原始数据\n\n基本的输入和输出流提供了 `read/write`\
  \ 方法，但只能用于读取/写入字节或字符。如果我们想读取/写入整数和双精度原始类型，可以使用过滤器类作为现有输入和输出流的包装器，以过滤原始流中的数据。\n\n\
  用于处理原始类型的“数据流”的两个过滤器类是 `DataInputStream` 和 `DataOutputStream`。这些类使用了如下所示的多重继承概念，并实现了父类和接口中包含的所有方法。\n\
  \n从文件输入的数据流可以如下创建：\n`FileInputStream fis = new FileInputStream(infile);`\n`DataInputStream\
  \ dis = new DataInputStream(fis);`\n这些语句基本上包装了 `fis` 并将其用作“过滤器”。同样，以下语句创建了输出数据流\
  \ `dos` 并将其封装在输出流之上。\n`FileOutputStream fos = new FileOutputStream(outfile);`\n\
  `DataOutputStream dos = new DataOutputStream(fos);`\n\n#### 示例 15.25\n\n以下程序演示了原始数据的读取和写入。\n\
  \n```java\nimport java.io.*;\nclass ReadWritePrimitive\n{\n    public static void\
  \ main (String args[]) throws IOException\n    {\n        File primitive = new File(\"\
  prim.dat\");\n        FileOutputStream fos = new FileOutputStream(primitive);\n\
  \        DataOutputStream dos = new DataOutputStream(fos);\n        dos.writeInt(999);\n\
  \        dos.writeDouble(2.4);\n        dos.writeBoolean(false);\n        dos.write('X');\n\
  \        dos.close();\n        fos.close();\n        FileInputStream fis = new FileInputStream(primitive);\n\
  \        DataInputStream dis = new DataInputStream(fis);\n        System.out.println(dis.readInt());\n\
  \        System.out.println(dis.readDouble());\n        System.out.println(dis.readBoolean());\n\
  \        System.out.println(dis.readChar());\n    }\n}\n```\n\n\n\n\n\nfis.close();\n\
  }}\n\n输出:\n1999\n222.44\nfalse\nX\n\n## 预流\n\n`System` 类包含三个预定义的流变量 - `in`、`out`\
  \ 和 `err`。这些字段在 `System` 类中被声明为 `public` 和 `static`。这意味着它们可以被程序的任何部分使用，而无需引用特定的对象。\n\
  \n`System.out` 指向标准输出流。默认情况下，它是控制台。`System.out` 是一个 `PrintStream` 类型的对象。\n\n`System.in`\
  \ 指向标准输入，默认是键盘。`System.in` 是一个 `InputStream` 类型的对象。\n\n`System.err` 指向标准错误流，默认情况下也是控制台。`System.err`\
  \ 是一个 `PrintStream` 类型的对象。\n\n这些都是字节流，尽管它们通常用于从向控制台读取和写入字符。如果需要，你可以将这些封装在基于字符的流中。\n\
  \n### InputStreamReader\n\n`InputStreamReader` 是从字节流到字符流的桥梁；它读取字节并使用指定的 `charset`\
  \ 将其解码为字符。它使用的字符集可以显式指定，也可以接受平台的默认字符集。\n\n#### 构造函数\n\n`InputStreamReader(InputStream\
  \ in)`\n创建一个使用默认字符集的 `InputStreamReader`。\n\n`InputStreamReader(InputStream in,\
  \ String charsetName)`\n创建一个使用指定名称的字符集的 `InputStreamReader`。\n\n#### 示例 15.26\n\n\
  ```java\nimport java.io.*;\nclass InputStreamReaderTest {\n    public static void\
  \ main (String argv[]) throws IOException {\n        char c;\n        InputStreamReader\
  \ is = new InputStreamReader(System.in);\n        System.out.println(\"Enter characters,\
  \ 'q' to quit\");\n        c =(char)is.read();\n        while(c!='q') {\n      \
  \      System.out.print(c);\n            c =(char)is.read();\n        }\n    }\n\
  }\n```\n输出:\n```\nEnter characters, 'q' to quit\nabcd\nabcd\nq\n```\n\n#### 示例 15.27\n\
  \n对上一个示例进行了修改，使用了缓冲区来提高性能。\n\n```java\nimport java.io.*;\nclass BufferedReaderTest\
  \ {\n    public static void main (String args[]) throws IOException {\n        char\
  \ c;\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \        System.out.println(\"Enter characters, 'q' to quit\");\n        c =(char)br.read();\n\
  \        while(c!='q') {\n            System.out.print(c);\n            c = (char)br.read();\n\
  \        }\n    }\n}\n```\n输出:\n```\nEnter characters, 'q' to quit\nabcd\nabcd\n\
  ```\n\n#### 示例 15.28\n\n`InputStreamReader` 不提供 `readLine()` 方法，因此 `InputStreamReader`\
  \ 通常链接到提供了 `readLine()` 方法的 `BufferedReader` 上。\n\n```java\nimport java.io.*;\n\
  class BufferedReaderTest1 {\n    public static void main (String argv[]) throws\
  \ IOException {\n        BufferedReader br = new BufferedReader(new InputStreamReader\
  \ (System.in));\n        System.out.println(\"Enter 'stop' to quit\");\n       \
  \ String str = br.readLine();\n        while(!str.equals(\"stop\")) {\n        \
  \    System.out.println(\"Your Name:\"+str);\n            str = br.readLine();\n\
  \        }\n    }\n}\n```\n输出:\n```\nEnter 'stop' to quit\nHarry Feat\nYour Name:Harry\
  \ Feat\n```\n\n#### 示例 15.29\n\n这演示了我们可以直接从 `System.in` 读取。\n\n```java\nimport java.io.*;\n\
  class ReadFromConsole {\n    public static void main (String arg[]) throws IOException\
  \ {\n        char c;\n        System.out.println(\"Enter characters, 'q' to quit\"\
  );\n        c = (char) System.in.read();\n        while(c!='q') {\n            System.out.print(c);\n\
  \            c = (char) System.in.read();\n        }\n    }\n}\n```\n输出:\n```\n\
  Enter characters, 'q' to quit\nabcd\nabcd\n```\n\n### OutputStream\n\n`OutputStream`\
  \ 是从字符流到字节流的桥梁：写入它的字符将使用指定的 `charset` 编码为字节。它使用的字符集可以显式指定，也可以接受平台的默认字符集。\n\n####\
  \ 构造函数\n\n`OutputStream(OutputStream out)`\n创建一个使用默认编码的 `OutputStream`。\n\n`OutputStream(OutputStream\
  \ out, String charsetName)`\n创建一个使用指定名称的字符集的 `OutputStream`。\n\n## 读取输入\n\n在 Java\
  \ 中，执行控制台输入的唯一方法是使用字节流，这种方法仍然存在于旧代码中。今天使用字节流读取控制台在技术上是可能的，但可能需要使用已弃的方法，且不推荐这种方法。在\
  \ Java 中，控制台输入通过从 `System.in` 读取完成。为了获取到控制台的字符流，我们将 `System.in` 封装在 `InputStreamReader`\
  \ 对象中，进一步封装在 `BufferedReader` 对象中以提高性能。\n\n#### 示例 15.30\n\n```java\nimport java.io.*;\n\
  class WriteTest {\n```\n\n\n\n\n\n```java\npublic static void main(String argv[])\
  \ throws IOException {\n    int b;\n    b = 'A';\n    System.out.write(b);\n   \
  \ // System.out.flush();to flush\n    System.out.write('\\n');//to flush\n}\n```\n\
  \n**输出:**\n`A`\n\n### 注意：\n你通常不会使用 `write()` 来执行控制台输出，因为 `print()` 和 `println()`\
  \ 使用起来方便得多。\n\n#### 序列化\n序列化是将对象的状态写入字节流的过程。当你想要将对象的状态写入字节流时，这种方法非常有用。当你想要将程序的状态保存到持久化存储区域（如文件）时，这同样有用。在之后，你可以通过反序列化过程恢复这些对象。\n\
  \n实现 RMI 也需要序列化。RMI 允许一台机器上的 Java 对象调用另一台机器上 Java 对象的方法。对象可以作为参数传递给远程方法。发送端将对象序列化并翻译。接收端对其进行反序列化。\n\
  \n如果你尝试序列化对象图顶端的对象，所有其他引用的对象都将被递归地找到并序列化。\n\n同样，在反序列化过程中，所有这些对象及其引用都会被正确存储。声明为 `transient`\
  \ 或 `static` 的变量不会被序列化机制保存。\n\n### Externalizable 接口\nJava 的序列化和反序列化机制设计使得大部分保存和恢复对象状态的工作是自动完成的。然而，在某些情况下，程序员可能需要对这些过程进行控制。例如，使用压缩或加密可能是必要的。`Externalizable`\
  \ 接口是为了这些情况设计的。实现 `Externalizable` 的对象也可以序列化和反序列化，但控制权在用户，即用户可以决定序列化和反序列化的部分。序列化代码写在\
  \ `writeExternal()` 方法中，反序列化代码写在 `readExternal()` 方法中。\n\n#### Externalizable 中的方法\n\
  - `void readExternal(ObjectInput in)`：对象实现 `readExternal` 方法，通过调用 `DataInput` 用于基本类型、字符串和数组的方法来恢复其内容。\n\
  - `void writeExternal(ObjectOutput out)`：对象实现 `writeExternal` 方法，通过调用 `DataOutput`\
  \ 用于基本值、字符串和数组的方法来保存其内容。\n\n#### ObjectOutput\n`ObjectOutput` 接口扩展了 `DataOutput`\
  \ 接口并支持序列化。除了 `DataOutput` 中定义的方法外，`ObjectOutput` 接口只定义了一个方法：\n- `void writeObject(Object\
  \ object)`：用于序列化对象。`ObjectOutput` 的所有方法在错误条件下都会抛出 `IOException`。\n\n#### ObjectOutputStream\n\
  `ObjectOutputStream` 类扩展了 `OutputStream` 并实现了 `ObjectOutput` 接口。它负责将对象写入流。\n- **构造函数**：`ObjectOutputStream(OutputStream\
  \ out)` 创建向指定的 `OutputStream` 写入的 `ObjectOutputStream`。参数 `out` 是写入对象的输出流。\n\n####\
  \ ObjectInput\n`ObjectInput` 接口扩展了 `DataInput` 接口。它支持序列化。除了 `DataInput` 中定义的方法外，`ObjectInput`\
  \ 接口定义的方法：\n- `Object readObject()`：用于反序列化对象。\n\n#### ObjectInputStream\n`ObjectInputStream`\
  \ 类扩展了 `InputStream` 并实现了 `ObjectInput` 接口。它负责从流中读取对象。\n- **构造函数**：`ObjectInputStream(InputStream\
  \ in)` 创建从指定的 `InputStream` 读取的 `ObjectInputStream`。参数 `in` 是应该从中读取对象的输入流。反序列化方法是：`readObject()`。\n\
  \n### 示例 5.3\n```java\nimport java.io.*;\n\nclass SerializationTest {\n    public\
  \ static void main(String args[]) throws IOException {\n        try {\n        \
  \    MyClass object1 = new MyClass(\"Hello\", 123, 1.3e3);\n            MyClass\
  \ object2 = new MyClass(\"Hello1\", 1, 2);\n            System.out.println(object1);\n\
  \            System.out.println(object2);\n            FileOutputStream fos = new\
  \ FileOutputStream(\"serial.dat\");\n            ObjectOutputStream os = new ObjectOutputStream(fos);\n\
  \            os.writeObject(object1);\n            os.writeObject(object2);\n  \
  \          os.flush();\n            os.close();\n        } catch (Exception e) {\n\
  \            System.out.println(e);\n        }\n        try {\n            MyClass\
  \ object3, object4;\n            FileInputStream fis = new FileInputStream(\"serial.dat\"\
  );\n            ObjectInputStream is = new ObjectInputStream(fis);\n           \
  \ object3 = (MyClass) is.readObject();\n            object4 = (MyClass) is.readObject();\n\
  \            is.close();\n            System.out.println(\"After deserialization\"\
  );\n            System.out.println(object3);\n            System.out.println(object4);\n\
  \        } catch (Exception e) {\n            System.out.println(e);\n        }\n\
  \    }\n}\n```\n\n\n\n\n\n```java\nreturn \"s = \"+ s +\"; i = \"+ i + \" ; d =\
  \ \" +d;\n```\n\n### 输出:\n```\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1; i =\
  \ 1 ; d = 2.0\n```\n\n### 反序列化后\n```\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1;\
  \ i = 1 ; d = 2.0\n```\n\n注：我们可以在文件中保存多个多个相同类型的对象，也可以在同一个文件中保存不同类型的对象。\n\n#### 示例\
  \ 15.32\n此示例演示了 `transient` 和 `static` 变量在序列化过程中不会持久化。\n\n```java\nimport java.io.*;\n\
  \nclass SerializationTest2 {\n    public static void main (String args[]) throws\
  \ IOException {\n        try {\n            MyClass object1 = new MyClass(\"Hello\"\
  , 123, 1.3e3);\n            MyClass object3 = new MyClass(\"Hello1\", 1, 2);\n \
  \           object3.x = 200;\n            A object5 = new A();\n            System.out.println(object1);\n\
  \            System.out.println(object3);\n            System.out.println(object5);\n\
  \            FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n    \
  \        ObjectOutputStream oos = new ObjectOutputStream(fos);\n            oos.writeObject(object1);\n\
  \            oos.writeObject(object3);\n            oos.writeObject(object5);\n\
  \            object3.x = 400;\n            oos.flush();\n            oos.close();\n\
  \        } catch (Exception e) {\n            System.out.println(e);\n        }\n\
  \        try {\n            MyClass object2, object4;\n            A object6;\n\
  \            FileInputStream fis = new FileInputStream(\"serial.dat\");\n      \
  \      ObjectInputStream ois = new ObjectInputStream(fis);\n            object2\
  \ = (MyClass) ois.readObject();\n            object4 = (MyClass) ois.readObject();\n\
  \            object6 = (A) ois.readObject();\n            ois.close();\n       \
  \     fis.close();\n            System.out.println(\"After deserialization\");\n\
  \            System.out.println(object2);\n            System.out.println(object4);\n\
  \            System.out.println(object6);\n        } catch (Exception e) {\n   \
  \         System.out.println(e);\n        }\n    }\n}\n\nclass MyClass implements\
  \ Serializable {\n    String s;\n    private int i = 100;\n    public int x = 0;\n\
  \    double d;\n    MyClass(String s, int i, double d) {\n        this.s = s;\n\
  \        this.i = i;\n        this.d = d;\n        x = 100;\n    }\n    public String\
  \ toString() {\n        return \"s = \" + s + \"; i = \"+ i + \" ;d = \" + d +\"\
  ; x = \"+ x;\n    }\n}\n\nclass A implements Serializable {\n    public String toString()\
  \ {\n        return \"A\";\n    }\n}\n```\n\n### 示例 5.3 使用 Externalizable\n```java\n\
  import java.io.*;\n\nclass SerializationTest1 {\n    public static void main (String\
  \ args[]) throws IOException {\n        try {\n            MyClass object1 = new\
  \ MyClass(\"Hello\", 99, 123.45);\n            System.out.println(object1);\n  \
  \          FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n      \
  \      ObjectOutputStream oos = new ObjectOutputStream(fos);\n            System.out.println(\"\
  before writing object\");\n            oos.writeObject(object1);\n            System.out.println(\"\
  after writing\");\n            oos.flush();\n            oos.close();\n        }\
  \ catch (Exception e) {\n            System.out.println(e);\n        }\n       \
  \ try {\n            MyClass object2;\n            FileInputStream fis = new FileInputStream(\"\
  serial.dat\");\n            ObjectInputStream ois = new ObjectInputStream(fis);\n\
  \            System.out.println(\"before reading\");\n            object2 = (MyClass)\
  \ ois.readObject();\n            System.out.println(\"after reading\");\n      \
  \      ois.close();\n            System.out.println(object2);\n        } catch (Exception\
  \ e) {\n            System.out.println(e);\n        }\n    }\n}\n\nclass MyClass\
  \ implements Serializable {\n    String s;\n```\n\n\n\n\n```java\nint i=100;\ndouble\
  \ d;\npublic MyClass() {};// 这是必须的\npublic MyClass(String s, int i, double d) {\n\
  \    this.s = s;\n    this.i = i;\n    this.d = d;\n}\npublic String toString()\
  \ {\n    return \"s = \"+ s +\"; i = \"+ i + \" ;d = \" +d;\n}\npublic void writeExternal(ObjectOutput\
  \ oos) throws IOException {\n    System.out.println(\"Inside writeExternal\");\n\
  \    oos.writeObject(s);\n    oos.writeInt(i);\n    oos.writeDouble(d);\n}\npublic\
  \ void readExternal(ObjectInput ois) throws ClassNotFoundException, IOException\
  \ {\n    System.out.println(\"Inside readExternal\");\n    s = (String) ois.readObject();\n\
  \    i = ois.readInt();\n}\n```\n\n输出：\n```text\ns = Hello; i = 99 ;d = 123.45\n\
  before writing object\nafter writing object\nbefore reading object\nafter reading\
  \ object\ns = Hello; i = 99 ;d = 123.45\n```\n\n**注意：**\n在反序列化期间，对象将使用默认构造函数构建（与\
  \ `serializable` 接口不同），然后进行初始化。状态测试应该在 `readExternal()` 中进行。同样，在序列化期间，只保存类标识。任何状态必须在\
  \ `writeExternal()` 中显式保存。\n\n#### Applet\n\n### 介绍\nApplet 是一种设计用于在互联网传输并由 Internet\
  \ Explorer 或 Netscape Navigator 等兼容 Java 的浏览器在客户端机器执行的应用程序。Applet 也是 Java 程序，但它们存储在服务器上。\n\
  \nApplet 不能像独立应用程序那样执行。Applet 只能通过将其嵌入 HTML 页面（类似于图像或声音文件）来执行。运行 applet 需要访问一个嵌入了\
  \ applet 的 HTML 页面。当浏览器下载此类页面时，随后加载包含 applet 代码的可执行文件，然后在本地机器上执行。\n\nApplet 到达客户端后，它对资源的访问有限，这样它就可以产生任意的多媒体用户界面并运行复杂的计算，而不会引入病毒风险或破坏数据完整性。\n\
  \n### Applet 架构\nApplet 与普通的 Java 程序不同。\n\n*   Applet 是基于 GUI（窗口）的程序\n*   Applet\
  \ 是事件驱动的\n\n当一个普通的 Java 程序（非基于 GUI 的）需要输入时，它会提示用户并调用某些输入方法，例如 `readLine()`，即交互是由程序发起的。这并不是基于\
  \ GUI 的程序的行为方式。用户发起与程序的交互，而不是由程序发起动作。例如，在文字处理软件中，用户通过点击按钮发起动作，这产生一个事件并执行一些代码，并相应地发生动作。Applet\
  \ 使用 `awt` 包（抽象窗口工具包）来提供 GUI 并处理事件。之所以被称为 `awt`，是因为它完全依赖于底层操作系统的功能。applet 类似于一组中断例程，等待事件发生。`awt`\
  \ 通过调用 applet 提供的事件处理器来通知 applet 事件。一旦发生这种情况，applet 必须采取适当的行动，然后将控制权交还给 `AWT`。这是一个关键点。在大多数情况下，我们的\
  \ applet 不应该进入长时间保持控制的运行“模式”。相反，它必须响应事件执行特定操作，然后将控制权交还给 `AWT` 运行时系统。在 applet 需要独立执行重复性任务的情况下（例如，跨窗口显示消息），我们必须启动额外的执行线程。\n\
  \n### 编写一个 Applet\n所有的 applet 都是 `Applet` 类的子类。`Applet` 类包含在 `java.applet` 包中。`Applet`\
  \ 类的层次结构如下：\n\n```\njava.lang.Object\n      |\njava.awt.Component\n      |\njava.awt.Container\n\
  \      |\njava.awt.Panel\n      |\njava.applet.Applet\n```\n\n`Applet` 类为 applet\
  \ 执行提供了所有支持，例如启动和停止。它提供了加载和显示图像的方法。它还为基于窗口的操作提供了必要的支持。我们扩展 `Applet` 的子类必须始终声明为 `public`，因为它是由网络浏览器实例化（创建对象）并执行的。浏览器在实例化\
  \ applet 时使用无参构造函数，因此必须提供具有 `public` 可见性的无参构造函数。建议我们不要在 `Applet` 类中提供构造函数，以防编译器提供默认的无参构造函数。我们可以利用\
  \ `init()` 方法进行初始化。在编写 applet 代码时，我们通常重写类的一些方法，这些方法在 applet 执行期间会被自动调用。重写 `paint()`\
  \ 方法非常常见。`paint()` 方法中的代码主要在 applet 窗口中显示输出。\n\n示例 16.1 (App1.java)\n以下程序演示了一个简单的\
  \ applet，它在窗口内显示“Hello World”。在以下示例中，applet 窗口的背景颜色设置为红色，前景颜色设置为绿色，因此背景将为红色，文本“Hello”将以绿色显示。\n\
  \n```java\nimport java.awt.*;\nimport java.applet.Applet;\n/*<applet code=\"App1\"\
  \ width=500 height=100></applet>*/\nclass App1 extends Applet {\n    public void\
  \ init() {\n        setBackground(Color.red);\n        setForeground(Color.green);\n\
  \    }\n    public void paint(Graphics g) {\n        g.drawString(\"Hello World\"\
  ,20,20);\n    }\n}\n```\n\n\n\n\n![](img/image01263.jpeg)\n\n# 执行 Applet\n\nApplet\
  \ 并不是通过基于控制的 Java 运行时解释器执行的。我们可以通过两种方式运行 applet：\n\n1. 在兼容 Java 的网络浏览器中执行 applet。\n\
  2. 使用 appletviewer，例如标准 SDK 工具 `appletviewer`。`appletviewer` 会在一个窗口中执行我们的 applet。这是测试\
  \ applet 最快且最简单的方法。\n\n## 在网络浏览器中执行 Applet\n\n我们需要编写一个简短的 HTML 文本文件，其中包含适当的 `APPLET`\
  \ 标签。`applet` 标签必须包含至少三个属性：\n\n- `Code`\n- `Width`\n- `Height`\n\n属性 `code` 的值指定包含\
  \ applet 代码的类名。`width` 和 `height` 属性分别指定 applet 窗口的宽度和高度。\n\n这里是嵌入了 applet \"App1\"\
  \ 的 HTML 文件 `RunApp.Html`：\n\n```html\n<<html>\n<head>\n<title>Simple Applet</title>\n\
  </head>\n<body>\n<h1>Simple “Hello World” Application </h>\n<applet code= “App1”\
  \ width =500 height=100>\n</applet>\n</body>\n</html>\n```\n\n你可以通过在网络浏览器中打开文件 `RunApp.html`\
  \ 来执行 applet。该文件可以位于本地文件系统上，也可以从网络服务器加载。\n\n## 使用 appletviewer 执行 Applet\n\n然而，存在一种更方便的方法可以用来加速测试。只需在你的\
  \ Java 源代码文件中包含一个带有 `APPLET` 标签的注释即可。通过这样做，我们的代码就包含了必要的 HTML 语句的原型文档，我们只需通过启动 `appletviewer`\
  \ 并传入 Java 源代码文件即可测试编译后的输出。如果我们使用这种方法，在编译后可以按照如下方式执行 applet：\n\n```bash\nappletviewer\
  \ SimpleApplet.Java\n```\n\n# Applet 周期方法\n\nApplet 重写了一组方法，这些方法提供了浏览器或 `appletviewer`\
  \ 与 applet 交互并控制其执行的基本机制。\n\n这些方法也被称为周期方法，因为浏览器或 applet 查看器会在 applet 生命周期的不同阶段自动调用它们。总共有五种周期方法：\n\
  \n- `public void init()`\n- `public void start()`\n- `public void stop()`\n- `public\
  \ void destroy()`\n- `public void paint(Graphics g)`\n\n这五个方法中的：`init()`、`start()`、`stop()`\
  \ 和 `destroy()` 是定义在 `applet` 类中的。\n\n`paint()` 是由 `awt.Component` 类定义的，并提供了所有这些方法的默认实现。Applet\
  \ 不需要重写它们未使用的方法。然而，非常简单的 applet 将不需要定义它们。\n\n## Applet 的初始化与终止\n\n当 applet 开始启动时，将按顺序调用以下方法：\n\
  \n1. `init()`\n2. `start()`\n3. `paint()`\n\n当 applet 终止时，会发生以下顺序的方法调用序列：\n\n4.\
  \ `stop()`\n5. `destroy()`\n\n### `init()` 方法\n\n这是第一个被调用的方法。在这里我们应该初始化变量并为其他初始化活动编写代码。该方法在\
  \ applet 生命周期内仅在调用一次，在实例化后立即调用。\n\n### `start()` 方法\n\n`start()` 方法在 `init()` 之后被调用。它也用于在\
  \ applet 停止后重启它。当 `init()` 在 applet 首次加载时被调用一次，而 `start()` 在每次 applet 的 HTML 文档显示在屏幕上时被调用。因此，如果用户离开网页并返回，applet\
  \ 将从 `start()` 处恢复执行。\n\n### `paint()` 方法\n\n当 applet 开始执行时，`paint()` 在 `init()`\
  \ 和 `start()` 方法之后被调用。当我们的 applet 输出需要重绘时，`paint()` 方法也会调用。这种情况可能由于多种原因发生。例如，运行\
  \ applet 的窗口可能被另一个窗口覆盖然后重新显示，或者 applet 窗口可能被最小化然后恢复。\n\n### `stop()` 方法\n\n当网络浏览器跳转到另一个页面，例如离开包含\
  \ applet 的 HTML 文档时，`stop()` 方法会被调用。当调用 `stop()` 时，applet 可能仍在运行。\n\n我们应该使用 `stop()`\
  \ 来挂起 applet 不可见时不需要运行的线程。如果用户返回页面，我们可以在 `start()` 被调用时重新启动它们。我们还可以释放任何昂贵的资源并在 `start()`\
  \ 方法中重新获取。\n\n### `destroy()` 方法\n\n当环境确定我们的 applet 需要从内存中完全移除时，会调用 `destroy()`\
  \ 方法。此时此时，我们应该释放 applet 可能正在使用的任何资源。`stop()` 方法总会在 `destroy()` 之前被调用。\n\n示例 16.2\
  \ 一个简单的 applet，将背景颜色设置为青色，前景颜色设置为红色，并显示一条消息，说明当 applet 启动时 `init()`、`start()` 和\
  \ `paint()` 方法调用的顺序。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n/*<applet\
  \ code= \"App2\" width =500 height=100></applet>*/\npublic class App2 extends Applet\
  \ {\n    String msg=\"\";\n    public void init() {\n        System.out.println(\"\
  \ init\");\n        setBackground(Color.cyan);\n        setForeground(Color.red);\n\
  \        msg = \" init \";\n    }\n    public void start() {\n        System.out.println(\"\
  Inside start\");\n        msg += \" start\";\n    }\n    public void stop() {\n\
  \        System.out.println(\"Inside Stop\");\n        msg += \" stop ()\";\n  \
  \  }\n    public void paint (Graphics g) {\n        System.out.println(\"Inside\
  \ paint\");\n        msg += \" paint\";\n        g.drawString(msg,0);\n    }\n \
  \   public void destroy() {\n        System.out.println(\" destroy\");\n    }\n\
  }\n```\n\n![](img/image264.jpeg)\n\n# 动态 Applet\n\nApplet 窗口中的输出可以是动态的。例如，我们可以显示一个移动横幅。Applet\
  \ 还可以用于应用程序，例如通过从服务器获取显示板球比赛和其他统计数据；显示股票价格等。\n\n## 示例 16.3\n\n以下示例显示了一个移动横幅。它在 applet\
  \ 窗口中从右向左滚动消息。由于消息滚动是一个重复性任务，它是由 applet 在启动时创建的单独线程执行的。该程序还演示了可以在 `stop()` 方法中释放资源并在\
  \ `start()` 方法中重新资源。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n/*<applet\
  \ code=\"App3\" width=500 height=100></applet>*/\npublic class App3 extends Applet\
  \ implements Runnable {\n    String msg=\"A Simple Moving Banner.\" ;\n    Thread\
  \ t = null;\n    boolean stopFlag;\n    public void init () {\n```\n\n\n\n\n\n```java\n\
  {\n    setBackground(Color.cyan);\n    setForeground(Color.red);\n}\n\npublic void\
  \ start()\n{\n    t = new Thread(this);\n    stopFlag = false;\n    t.start();\n\
  }\n\npublic void stop()\n{\n    stopFlag = true;\n    t = null;\n}\n\npublic void\
  \ paint(Graphics g)\n{\n    g.drawString(msg, 50, 30);\n}\n\npublic void run()\n\
  {\n    for (;;) {\n        repaint();\n        try {\n            Thread.sleep(50);\n\
  \        } catch (InterruptedException e) {\n            System.out.println(e);\n\
  \        }\n        msg = msg.substring(1) + msg.charAt(0);\n        if (stopFlag)\n\
  \            break;\n    }\n}\n```\n\n### 使用状态窗口\n\n除了在窗口中显示信息外，Applet 还可以向运行它的浏览器或\
  \ `appletviewer` 的状态窗口输出消息。要做到这一点，可以调用 `showStatus()` 并传入我们想要显示的字符串。状态窗口是向用户提供 Applet\
  \ 正在发生的操作反馈、建议选项或报告某些类型错误的好地方。状态窗口是一个极好的调试助手，因为它为我们提供了输出 Applet 信息的简单方法。\n\n示例 16.4：下面的示例演示了如何使用状态窗口。\n\
  \n```java\nimport java.awt.*;\nimport java.applet.*;\n/*applet code=\"App4\" width=500\
  \ height=100*/\nclass App4 extends Applet\n{\n    public void init()\n    {\n  \
  \      setBackground(Color.cyan);\n    }\n\n    public void paint(Graphics g)\n\
  \    {\n        g.drawString(\"This is in the applet window\", 10, 20);\n      \
  \  showStatus(\"This is shown in the status window\");\n    }\n}\n```\n输出：image0265.jpeg\n\
  \n### HTML 的 APPLET 标签\n\n`APPLET` 标签用于从 HTML 文档和 `appletviewer` 启动 Applet。`appletviewer`\
  \ 会在单独窗口中执行它找到的每个 `APPLET` 标签；而像 Netscape Navigator 和 Internet Explorer 这样的浏览器允许在单个页面上运行多个\
  \ Applet。\n\n标准 `APPLET` 标签的语法如下：\n\n```html\n< APPLET\n    CODE=applet class name\n\
  \    CODEBASE=codebase URL\n    ALT=alternate Text\n    NAME=appletInstance\n  \
  \  WIDTH=pixels\n    HEIGHT=pixels\n    ALIGN=alignment\n    VSPACE=vertical space\
  \ in pixels\n    HSPACE=horizontal space in pixels\n    <PARAM NAME=attributeName-1\
  \ VALUE=Attribute Value-1>\n    <PARAM NAME=attributeName-2 VALUE=Attribute Value-2>\n\
  \    <PARAM NAME=attributeName-N VALUE=Attribute Value-N>\n</APPLET>\n```\n\n- `CODE`：一个必需属性，提供包含\
  \ Applet 编译类文件的文件名。该文件相对于 Applet 的 `CODEBASE`，`CODEBASE` 是 html 文件所在的目录，或者如果设置了则为指定的目录。\n\
  - `CODEBASE`：一个可选属性，指定 Applet 的基础 URL，即搜索 Applet 可执行类（由 `CODE` 标签指定）的目录。如果未指定此属性，则使用\
  \ HTML 文档的目录作为 `CODEBASE`。\n- `ALT`：一个可选属性，用于指定短文本消息，当浏览器理解 `APPLET` 标签但当前无法运行 Java\
  \ 时应显示该消息。这与为不支持 applet 的浏览器提供的替代文本不同。\n- `NAME`：一个可选属性，用于指定 Applet 实例名称。Applet\
  \ 必须命名，以便同一页面上的其他 Applet 能够通过名称找到并与之通信。要通过名称获取 Applet，请使用 `Context` 接口定义的 `getApplet()`。\n\
  - `WIDTH` 和 `HEIGHT`：Applet 显示区域以像素为单位的大小。\n- `ALIGN`：一个可选属性，指定 Applet 的对齐方式。该属性的处理方式与\
  \ HTML 的 `IMG` 标签相同，可能的值有 `LEFT`、`RIGHT`、`BOTTOM`、`BASELINE`、`TEXTTOP`、`ABSMIDDLE`\
  \ 和 `ABSBOTTOM`。\n- `VSPACE` 和 `HSPACE`：这些属性是可选的。`VSPACE` 指定 Applet 上下的空间（像素为单位）。`HSPACE`\
  \ 指定 Applet 左右的空间（像素为单位）。它们的处理与 `IMG` 标签的 `VSPACE` 和 `HSPACE` 属性相同。\n\n#### PARAM\
  \ 标签\n\n`PARAM` 标签允许我们在 HTML 页面中指定 Applet 特有的参数。Applet 通过 `getParameter()` 方法访问其属性。`PARAM`\
  \ 标签有两个属性：`NAME` 和 `VALUE`。\n\n示例 16.5 此示例演示了如何从 HTML 页面向 Applet 传递参数。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\n/*applet code=\"App5\" width=500 height=100>\n\
  \    <param name=\"fontName\" value=\"Arial\">\n    <param name=\"fontSize\" value=\"\
  30\">\n</applet*/\nclass App5 extends Applet\n{\n    String fName;\n    int fSize;\n\
  \    public void init ()\n    {\n        fName = getParameter(\"fontName\");\n \
  \       if (fName == null)\n            fName = \"Courier\";\n        fSize = Integer.parseInt(getParameter(\"\
  fontSize\"));\n        f1 = new Font(fName, Font.PLAIN, fSize);\n        setFont(f1);\n\
  \    }\n\n    public void paint (Graphics g)\n    {\n        g.drawString(\"Font\
  \ Name : \" + fName, 0, 25 );\n    }\n}\n```\n\n\n\n\n\n```java\ng.drawString (\"\
  Font Size : \" + fSize, 0, 50 );\ng.drawString (\"Hello world\", 0,75);\n```\n\n\
  ![](img/image01267.jpeg)\n\n## 获取 DocumentBase 和 CodeBase\n\n通常，我们会创建需要显式加载媒体和文本的\
  \ applet。Java 允许 applet 从启动它 的 HTML 文件所在的目录（文档基，document base）以及加载 applet 类文件的目录（代码基，code\
  \ base）加载数据。\n\n这些目录以 `URL` 对象的形式返回。它们可以与命名我们要加载的文件的字符串拼接。要实际加载另一个文件，我们将使用由 `Applet`\
  \ 上上下文接口定义的 `showdocument()` 方法。\n\n### 示例 16.6 下面的示例演示了如何在 applet 代码中获取文档基和代码基。\n\
  \n#### App6.java\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n\
  public class App6 extends Applet\n{\n    public void paint (Graphics g)\n    {\n\
  \        URL u1 = getCodeBase( );\n        g.drawString (\"Code base:-\" + u1, 10,20);\n\
  \        URL u2 = getDocumentBase();\n        g.drawString (\"Document base:-\"\
  +u2, 10,40);\n    }\n}\n```\n\n#### App6.html\n```html\n<html>\n<body>\n<applet\
  \ code=\"App6\" width=500 height=200></applet>\n</body>\n</html>\n```\n输出：\n\n##\
  \ appContext 和 Show Document（显示文档）\n\nJava 的应用之一是使用活动图像和动画提供一种图形化的网页导航手段，这比超文本使用的下划线文字更有趣。为了允许我们的\
  \ applet 将控制权转移到另一个 URL，必须使用由 Applet Context 接口定义的 `showDcoument()` 方法。\n\nApplet\
  \ Context 是允许我们从 applet 的执行中获取信息的接口。当前执行的 applet 的上下文通过调用 applet 类定义的 `getAppletContext()`\
  \ 方法获得。在 applet 内部，一旦我们获得了 applet 的上下文，就可以通过调用 `showDocument()` 方法将另一个文档引入视图。此方法没有返回值，如果失败则会抛出异常，因此请谨慎使用。有两个\
  \ `showDocument()` 方法：\n\n- `void ShowDocument(URL url)`：用给定的 URL 替换当前查看的 Web\n\
  - `void ShowDocument (URL url, String where)`：在浏览器窗口内的指定位置显示指定的文档。`where` 的有效参数为：\n\
  \    - `_self`（在当前帧中）\n    - `_parent`（在父帧中）\n    - `_top`（在顶层帧中）\n    - `_blank`（在新浏览器窗口中）\n\
  \n### 示例 16.7 下面的 applet 演示了 Applet Context 和 `showDocument()` 的。执行时，它获取当前的 applet\
  \ 上下文并使用该上下文将控制权转移到一个名为 `A.html` 的文件。该文件必须与 applet 在同一目录下。`Test.html` 可以包含你喜欢的任何有效超文本。\n\
  \n#### App7.java\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport java.net.*;\n\
  public class App7 extends Applet\n{ \n    AppletContext ac;\n    URL u1;\n    public\
  \ void init()\n    {\n        setBackground(Color.cyan);\n    }\n    public void\
  \ start( )\n    {\n        ac = getAppletContext();\n        u1 = getCodeBase();\n\
  \        try\n        {\n            Thread.sleep(300);\n            ac.showDocument(new\
  \ URL(u1 + \"A.html\"),\"_blank\");\n        }\n        catch(MalformedURLException\
  \ e)\n        { \n            showStatus(\"Invalid URL\");\n            e.printStackTrace()\
  \ ;\n        }\n        catch(InterruptedException e)\n        { \n            showStatus(\"\
  Invalid URL\");\n            e.printStackTrace () ;\n        }\n    }\n    public\
  \ paint (Graphics g)\n    {\n        g.drawString(u1+\"A.html\",0,20);\n       \
  \ try\n        {\n            Thread.sleep(300);\n        }\n        catch(InterruptedException\
  \ e)\n        {\n            System.out.println(e);\n        }\n    }\n}\n```\n\n\
  #### App7.html\n```html\n<html>\n<head>\n<Title>Applet Context Demo</Title>\n</head>\n\
  <body>\n<applet code=\"App7\" width=200 height=200></applet>\n</body>\n</html>\n\
  ```\n\n#### A.html\n```html\n<html>\n<head>\n<title>New Page</title>\n</head>\n\
  <body bgcolor=blue text=red>\n<h1>matrix</h1>\n</body>\n</html>\n```\n\n#### 示例\
