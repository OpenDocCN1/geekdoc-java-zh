  ))\n            tf1.setBackground(Color.blue);\n    }\n}\n```\n\n### Label\nLabel\
  \ 是简单的可见 AWT 组件。Label 通常不用于响应用户输入或发送事件。\n\n#### 构造函数：\n- `Label()`: 构造一个空标签。\n-\
  \ `Label(String text)`: 构造一个带有指定文本的新标签，并左对齐。\n- `Label(String text, int alignment)`:\
  \ 构造一个以指定对齐方式显示指定文本的标签。\n\nLabel 的默认对齐方式是左对齐。要设置对齐方式，请使用构造函数的第三个参数并传入以下值：\n- `Label.LEFT`\n\
  - `Label.CENTER`\n- `Label.RIGHT`\n\n#### 方法：\n- `String getText()`: 获取此标签的文本。\n\
  - `void setText(String text)`: 将此标签的文本设置为指定的文本。\n\n\n\n\n```java\nimport java.awt.*;\n\
  \nclass LabelTest {\n    public static void main(String args[]) {\n        Frame\
  \ f = new Frame(\"Testing Label Component\");\n        f.setLayout(new GridLayout(3,3));\n\
  \        f.setFont(new Font(\"Arial\",Font.PLAIN, 20));\n        Label l1 = new\
  \ Label(\"India\",Label.LEFT);\n        Label l2 = new Label(\"Pakistan\",Label.LEFT);\n\
  \        Label l3 = new Label(\"UK\",Label.LEFT);\n        Label l4 = new Label(\"\
  India\",Label.CENTER);\n        Label l5 = new Label(\"Pakistan\",Label.CENTER);\n\
  \        Label l6 = new Label(\"UK\",Label.CENTER);\n        Label l7 = new Label(\"\
  India\",Label.RIGHT);\n        Label l8 = new Label(\"Pakistan\",Label.RIGHT);\n\
  \        Label l9 = new Label(\"UK\",Label.RIGHT);\n        l3.setText(\"USA\");\n\
  \        System.out.println(l1.getText());\n        f.add(l1);f.add(l4);f.add(l7);\n\
  \        f.add(l2);f.add(l5);f.add(l8);\n        f.add(l3);f.add(l6);f.add(l9);\n\
  \        f.setSize(500,200);\n        f.setVisible(true);\n    }\n}\n```\n\n输出：\n\
  ![](img/image01288.jpeg)\n\n### List 列表\n列表是垂直排列的文本项集合。如果列表包含的项超过其显示范围，它会自动获取一个垂直滚动条。\n\
  \n#### 构造函数\n- `List()`：创建一个新的滚动列表。此构造函数未指定行数，但会产生四行的默认优先高度。当然，在许多情况下，列表的实际高度将由管理器决定。\n\
  - `List(int rows)`：创建一个新的滚动列表，初始化指定的可见行数。\n- `List(int rows, boolean multipleMode)`：创建一个新的滚动列表，初始化为显示指定的行数并允许多选。\n\
  \n#### 示例 17.18\n```java\nimport java.awt.*;\nclass ListTest {\n    public static\
  \ void main(String args[]) {\n        Frame f = new Frame() ;\n        f.setLayout\
  \ (new FlowLayout());\n        List l1=new List(3,true);\n        l1.add(\"India\"\
  );\n        l1.add(\"Nepal\");\n        l1.add(\"Shri Lanka\");\n        l1.add(\"\
  USA\");\n        l1.add(\"UK\");\n        f.add(l1);\n        System.out.println(l1.getRows());\n\
  \        f.setSize(300, 300);\n        f.setVisible(true);\n    }\n}\n```\n\n输出：\n\
  ![](img/image01289.jpeg)\nList 有五项内容，但只有 3 行可见，因此提供了一个滚动条以访问底部的行。注意：在列表中选择某项会导致列表发送\
  \ Item 事件；点击某项会发送 Action 事件。\n\n- `void add(String item)`：将指定的项添加到滚动列表的末尾。\n- `void\
  \ add(String item, int index)`：在`index`指定的的位置将指定的项添加到滚动列表中。\n- `void addActionListener(ActionListener\
  \ i)`：添加指定的监听器以接收来自此列表的动作事件。\n- `void addItemListener(ItemListener i)`：添加指定的监听器以接收来自此列表的事件。\n\
  - `String getItem(int index)`：获取与指定的`index`相关的项。\n- `int getItemCount()`：获取列表中的项数。\n\
  - `String[] getItems()`：获取列表中的项。\n- `int getRows()`：获取此列表中可见的行数。\n- `int getSelectedIndex()`：获取列表中选中项的索引。\n\
  - `int[] getSelectedIndexes()`：获取列表中的索引。\n- `String getSelectedItem()`：获取滚动列表中的选中项。\n\
  - `String[] getSelectedItems()`：获取滚动列表中的多个选中项。\n- `void remove(int position)`：从滚动列表中删除指定`position`处的项。\n\
  - `void remove(String item)`：从列表中删除第一次出现的项。\n- `void removeAll()`：从此列表中删除所有项。\n\
  - `void replaceItem(String newValue, int index)`：用新字符串替换滚动列表中指定`index`处的项。\n- `void\
  \ select(int index)`：选中滚动列表中指定`index`处的项。\n- `void setMultipleMode(boolean b)`：设置决定此列表允许多选的标志。\n\
  \n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass ListTest extends\
  \ Frame implements ActionListener {\n    Button b1,b2,b3,b4,b5,b6;\n    List l1,l2;\n\
  \    TextField tf1,tf2;\n    ListTest() {\n        setLayout(new GridLayout(3,3));\n\
  \        l1=new List(3,true);\n        l2=new List(3,true);\n        b1=new Button(\"\
  >\");\n        b2=new Button(\">>\");\n        b3=new Button(\"<\");\n        b4=new\
  \ Button(\"<<\");\n        b5=new Button(\"Add\");\n        b6=new Button(\"Add\"\
  );\n        b1.addActionListener(this);\n        b2.addActionListener(this);\n \
  \       b3.addActionListener(this);\n        b4.addActionListener(this);\n     \
  \   b5.addActionListener(this);\n        b6.addActionListener(this);\n        tf1=new\
  \ TextField();\n        tf2=new TextField();\n    }\n}\n```\n\n\n\n\n```java\nPanel\
  \ p1=new Panel();\np1.setLayout(new GridLayout(4,1));\np1.add(b1);\np1.add(b2);\n\
  p1.add(b3);\np1.add(b4);\nadd(l1); add(p1); add(l2);\nadd(tf1); add(new Label());\
  \ add(tf2);\nadd(b5); add(new Label()); add(b6);\nsetSize(300,300);\nsetVisible(true);\n\
  }\npublic static void main(String args[])\n{\n    new Test();\n}\npublic void actionPerformed(ActionEvent\
  \ ae)\n{\n    Button b=(Button)ae.getSource();\n    if(b==b1) {\n        String\
  \ s[]=l1.getSelectedItems();\n        for(int i=0;i<s.length;i++) {\n          \
  \  l2.add(s[i]);\n            l1.remove(s[i]);\n        }\n    } else if(b==b2)\
  \ {\n        String s[]=l1.getItems();\n        for(int i=0;i<s.length;i++) {\n\
  \            l2.add(s[i]);\n            l1.remove(s[i]);\n        }\n    } else\
  \ if(b==b3) {\n        String s[]=l2.getSelectedItems();\n        for(int i=0;i<s.length;i++)\
  \ {\n            l1.add(s[i]);\n            l2.remove(s[i]);\n        }\n    } else\
  \ if(b==b4) {\n        String s[]=l2.getItems();\n        for(int i=0;i<s.length;i++)\
  \ {\n            l1.add(s[i]);\n            l2.remove(s[i]);\n        }\n    } else\
  \ if(b==b5) {\n        l1.add(tf1.getText());\n    } else if(b==b6) {\n        l2.add(tf2.getText());\n\
  \    }\n}\n```\n\n### TextField 和 TextArea\n\n`TextField` 和 `TextArea` 实现了用于文本输入、显示和编辑的一维和二维组件。这两个类都继承自\
  \ `TextComponent` 类：`Object` -> `Component` -> `TextComponent` -> (`TextField`,\
  \ `TextArea`)。这两个类都拥有多种构造函数，可以选择指定或不指定初始字符串或首选尺寸。不指定尺寸的构造函数最适用于布局管理器将忽略组件首选尺寸的情况。\n\
  \n#### TextField 类的构造函数\n- `TextField()`：构造一个新的文本字段。\n- `TextField(int columns)`：构造一个具有指定数量列数的空文本字段。\n\
  - `TextField(String text)`：构造一个用指定文本初始化的文本字段。\n- `TextField(String text, int columns)`：构造一个用指定文本初始化的文本字段，其宽度足够容纳指定数量的列。\n\
  \n#### TextArea 类的构造函数\n- `TextArea()`：构造一个带有空字符串的新文本区域。\n- `TextArea(int rows,\
  \ int columns)`：构造一个具有指定行数和列以及空字符串的文本区域。\n- `TextArea(String text)`：构造一个带有指定文本的文本区域。\n\
  - `TextArea(String text, int rows, int columns)`：构造一个带有指定文本以及指定行数和列数的文本区域。\n- `TextArea(String\
  \ text, int rows, int columns, ScrollPolicy)`：构造一个带有指定文本、行以及指定滚动条策略的文本区域。\n\n`TextArea`\
  \ 类定义了几个常量，可以作为 `scrollPolicy` 参数的值：\n- `SCROLLBARS_BOTH`\n- `SCROLLBARS_VERTICAL_ONLY`\n\
  - `SCROLLBARS_HORIZONTAL_ONLY`\n- `SCROLLBARS_NONE`\n\n对于这两个类，`columns` 参数都存在一些问题。首先，列数是根据特定字体渲染的文本列数对宽度的度量。一个使用极小字体的\
  \ 25 列文本区域将变得非常窄，而一个使用巨大字体的 5 列文本区域将变得极其宽。其次，是等比例字体的问题。对于固定宽度字体，列宽是显而易见的。对于等比例字体，列宽取该字体所有字符宽度的平均值。这种平均值是所有字符的简单平均值；并没有考虑使用频率。因此在大多数情况下，包含小写字母的文本组件显示的字符数比要求的要。\n\
  \n#### TextComponent 类的方法\n- `selectText()`：从此文本组件显示的文本中返回选中的文本。\n- `getText()`：返回此文本组件显示的文本。\n\
  - `setEditable(Boolean b)`：设置决定此文本组件是否可编辑的标志。\n- `setText(String t)`：将此文本组件显示的文本设置为指定的文本。\n\
  \n示例 17.19\n```java\nimport java.awt.*;\n\nclass TextFieldTest {\n    public static\
  \ void main(String args[]) {\n        Frame f=new Frame();\n        f.setLayout(new\
  \ FlowLayout ());\n        TextField tf1=new TextField();\n    }\n}\n```\n\n\n\n\
  \n```java\nTextField tf2=new TextField(8);\nTextField tf3=new TextField(\"matrix\"\
  );\nTextField tf4=new TextField(\"matrix\",20);\nTextArea ta1=new TextArea();\n\
  TextArea ta2=new TextArea(3,8);\nTextArea ta3=new TextArea(\"abc\\nxyz\\naaa\");\n\
  TextArea ta4=new TextArea(\"abc\\nxyz\\naaa\",2,2);\nTextArea ta5=new TextArea(\"\
  abc\\nxyz\\naaa\",4,20,TextArea.SCROLLBARS_BOTH);\nf.add(tf1);f.add(tf2);f.add(tf3);f.add(tf4);\n\
  f.add(ta1);f.add(ta2);f.add(ta3);f.add(ta4);\nf.add(ta5);\ntf1.setText(\"abc\");\n\
  System.out.println(tf3.getText());\ntf3.setEditable(false);\nf.setSize(800, 400);\n\
  f.setVisible(true);\n```\n\n输出:\n![](img/image1290.jpeg)\n\n### FileDialog\n该类表示一个文件打开或保存对话框。文件对话框是一个模态对话框，这意味着只要对话框可见，来自父框架的输入将专门重定向到对话框。当用户指定文件或点击取消按钮时，对话框将自动移除。最有用的\
  \ `FileDialog` 构造函数具有以下形式：\n\n`FileDialog(Frame parent, String title, int mode)`\n\
  \n对话框的 `parent` 是对话框出现的帧。`title` 字符串显示在对话框的标题栏中。`mode` 应该是以下值之一：\n- `FileDialog.LOAD`\n\
  - `FileDialog.SAVE`\n\n在用户指定文件后，可以使用以下方法获取文件名或其目录：\n- `String getDirectory()` 获取此文件对话框选定的目录。\n\
  - `String getFile()` 获取此文件对话框选择的文件。\n\n#### 示例 17.20\n```java\nimport java.awt.*;\n\
  public class FileDialogTest {\n    public static void main(String args[]) {\n  \
  \      Frame f=new Frame() ;\n        f.setLayout(new FlowLayout() ));\n       \
  \ f.setSize(200, 200);\n        f.setVisible(true);\n        FileDialog fd=new Dialog\
  \ (f, “Load file”, FileDialog.LOAD);\n        fd.setVisible(true);\n        System.out.println(fd.getFile());\n\
  \        System.out.println(fd.getDirectory());\n    }\n}\n```\n\n### ScrollPane\n\
  `ScrollPane` 可以包含一个单一组件，该组件可能比滚动面板本身更高或更宽。如果容器组件大于滚动面板，那么滚动面板的默认行为是根据需要获取水平和/或垂直滚动条。该类有两个构造函数：\n\
  \n- `ScrollPane()` 创建一个滚动条显示方式为“按需”的滚动面板容器。\n- `ScrollPane(int scrollDisplayPolicy)`\
  \ 创建一个具有指定滚动条行为的新滚动面板。滚动面板策略应为以下值之一：\n    - `ScrollPane.SCROLLBARS_AS_NEEDED`（默认值）\n\
  \    - `ScrollPane.SCROLLBARS_ALWAYS`\n    - `ScrollPane.SCROLLBARS_NEVER`\n\n下面列出的代码创建一个具有默认（As_NEEDED）滚动行为的滚动面板。该滚动面板包含一个非常大的按钮；因此肯定需要滚动条。\n\
  \n#### 示例 17.21\n```java\nimport java.awt.*;\nclass SPaneTest {\n    public static\
  \ void main(String args[]) {\n        Frame f=new Frame();\n        f.setLayout(new\
  \ GridLayout(1,2));\n        f.setSize(250, 150);\n        ScrollPane spane=new\
  \ ScrollPane();\n        spane.setBackground(Color.green);\n        f.add(spane);\n\
  \        f.add(new TextArea());\n        Button b1=new Button(\"Push Me !\");\n\
  \        b1.setFont(new Font(\"Serif\", Font.ITALIC, 100));\n        spane.add(b1);\n\
  \        f.setVisible(true);\n    }\n}\n```\n输出:\n![](img/image1291.jpeg)\n\n###\
  \ Scrollbar\n调整列表和滚动面板的 `Scrollbar` 组件作为一个独立的组件存在。它有三个构造函数：\n\n- `Scrollbar()` 构建一个新的垂直滚动条。\n\
  - `Scrollbar(int orientation)` 构建具有指定方向的新滚动条。\n- `Scrollbar(int orientation, int\
  \ initialValue, int sliderSize, int minValue, int maxValue)` 构建具有指定方向、初始值、滑块大小以及最小值和最大值的新滚动条。`sliderSize`\
  \ 参数控制滑块的大小，但不是以像素为单位。\n\n对于接受 `orientation` 参数的构造函数，该值应该是：\n- `Scrollbar.HORIZONTAL`\n\
  - `Scrollbar.VERTICAL`\n\n#### 示例 17.2\n```java\nimport java.applet.*;\nimport java.awt.*;\n\
