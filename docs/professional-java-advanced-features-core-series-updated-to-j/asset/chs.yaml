  \n**答案:** 1(c), 2(e), 3(c), 4(b, c), 5(d)\n\n#### 编程练习\n1. 编写一个程序使用线性查找在数组中搜索元素。\n\
  2. 编写一个程序使用二分查找在数组中搜索元素。\n\n# 第 5 章：类与对象\n\n### 引言\n\n#### 定义类\n类代表一个 ADT（抽象数据类型）。它像一个模板，我们可以通过它创建多个对象（实例）。类的声明仅创建了一个模板，并没有创建实际的对象。类创建了一个新的数据类型，该类型可以用于创建对象。也就是说，类创建了一个定义其成员之间关系的逻辑框架。当我们声明一个类的对象时，我们正在创建该类的实例。因此，类是一个逻辑结构。而对象具有物理现实（也就是说，对象占用内存空间）。\n\
  \n```java\nclass <classname> {\n    修饰符 类型 变量;\n    修饰符 类型 方法名(参数列表) {\n       \
  \ //方法体\n    }\n}\n```\n\n#### 声明对象\n`Student s1;`\n在上面的示例中，`s1` 只是一个引用。在 C++ 中\
  \ `s1` 将是一个对象，但在 Java 中 `s1` 只是一个持有对象引用的变量。\n\n### 分配内存\n在 Java 中通过 `new` 运算符动态分配内存。\n\
  `s1 = new Student();`\n在上面的示例中，`new` 运算符为 `Student` 类分配内存并返回其引用，然后赋值给引用变量 `s1`。它还会调用默认构造函数来初始化成员变量。上述语句可以合并：`s1\
  \ = new Student();`\n\n注意：`new` 在运行时为对象分配内存。如果 `new` 无法分配内存（内存有限），将抛出运行时异常。\n注意：如果我们将一个引用变量赋值给另一个引用变量，传递的是引用（地址）。不会创建对象的副本。例如，如果我们创建另一个引用变量\
  \ `s2` 然后执行 `s1 = s2`，这不会创建重复的对象；`s1` 和 `s2` 指向同一个对象。在 `s2` 中做的任何更改都会反映在 `s1` 中。赋值操作不分配内存。若干步后，如果我们给\
  \ `s1` 赋值 `null`，该对象会被销毁，因为还有 `s2` 引用它。但如果 `s1` 和 `s2` 都被赋值 `null` 值，该对象将被垃圾回收器销毁，其所占用的内存将被释放。\n\
  \n### 示例 5.1 包含成员变量类\n```java\nclass A {\n    int x;\n    int y;\n}\n\nclass ClassTest\
  \ {\n    public static void main(String args[]) {\n        A a1, a2; //引用变量\n  \
  \      a1 = new A(); //对象创建\n        a2 = new A();\n        a1.x = 10;\n       \
  \ a1.y = 20;\n        a2.x = 5;\n        a2.y = 6;\n        System.out.println(a1.x\
  \ + \"\\t\" + a1.y);\n        System.out.println(a2.x + \"\\t\" + a2.y);\n    }\n\
  }\n```\n**输出:**\n```\n10\t20\n5\t6\n```\n\n### 示例 5.2 包含成员变量和方法的类\n```java\nclass\
  \ A {\n    private int x;\n}\n```\n\n\n\n\n\n## 示例 5.3 定义类自身的对象。\n\n```java\nclass\
  \ A {\n    private int x;\n    private int y;\n    void setdata(int x1, int y1)\
  \ {\n        x = x1;\n        y = y1;\n    }\n    void display() {\n        System.out.println(x\
  \ + \"\\t\" + y);\n    }\n}\n\nclass ClassTest2 {\n    public static void main(String\
  \ args[]) {\n        A a1 = new A();\n        A a2 = new A();\n        //a1.x=10;\
  \ error as x is private\n        a1.setdata(10,20);\n        a2.setdata(5,7);\n\
  \        a1.display();\n        a2.display();\n    }\n}\n```\n**输出：**\n```\n10\t\
  20\n5\t7\n```\n注：我们可以在类内部声明该类的对象。\n\n### 类成员的修饰符 / 可见性标签\n可见性修饰符适用于类的成员，而不适用于局部变量。\n\
  \n1. `private`：如果我们在变量或方法上指定修饰符 `private`，那么该成员在声明它的类外部不可见。\n2. `public`：如果我们在变量或方法上指定修饰符\
  \ `public`，那么该成员对所有类可见。该成员可以在包外被访问，因为 `main()` 方法始终由 JVM 访问，而 JVM 位于定义 `main()`\
  \ 方法类的外部。\n3. `protected`：声明为 `protected` 的成员可以被属于同一个包的所有类访问。保护的成员也可以被其他包中的任何类访问。\n\
  4. `default / 无修饰符`：如果在声明之前没有指定可见性修饰符，则该成员可以被同包内的所有类访问。该成员在包外访问。\n\n### 类或接口的可见性修饰符\n\
  1. `public`：如果一个类需要对所有包的类可见，则必须通过指定修饰符 `public` 声明为 `public`。\n2. `default / 无修饰符`：如果类之前没有任何访问/可见性修饰符，其可见性仅限于其定义的包（类组）内。\n\
  \n### this 关键字\n`this` 是一个引用变量，存储了当前用于调用方法的对象的引用。在运行时，`this` 的引用会被调用对象的引用所替换。有时，一个方法需要引用调用它的对象。这可以通过\
  \ `this` 来实现。`this` 可以在任何方法内部使用以引用当前对象。\n\n注：局部变量会隐藏实例变量，因此我们必须显式地使用 `this`。\n\n\
  ### 实例变量隐藏\n正如我们所知，在 Java 中在相同或嵌套的作用域内声明两个同名的局部变量是非合法的。但我们可以让局部变量（成员方法的参数）与类的实例成员变量具有相同的名称。当局部变量与实例变量同名时，局部变量会隐藏实例变量。但\
  \ `this` 关键字允许即使在局部变量隐藏它的情况下，我们依然可以引用实例变量。\n\n#### 示例 5.4 this 关键字的使用\n```java\n\
  class A {\n    private int x;\n    private int y;\n    void setdata(int x, int y)\
  \ {\n        this.x = x;  //this.x 是类成员 & x 是局部变量\n        this.y = y;   \n    }\n\
  \    void display() {\n        System.out.println(x + \"\\t\" + y);\n    }\n}\n\n\
  class ClassTest4 {\n    public static void main(String args[]) {\n        A a1 =\
  \ new A();\n        A a2 = new A();\n        a1.setdata(10,20);\n        a2.setdata(5,7);\n\
  \        a1.display();\n        a2.display();\n    }\n}\n```\n**输出：**\n```\n10\t\
  20\n5\t7\n```\n\n#### 方法重载\n只要方法在参数数量、参数类型或参数顺序上有所不同，我们就可以拥有多个同名方法。这被称为方法重载。\n在调用重载方法时，传递的实际参数的类型可能与任何重载方法的形式参数不完全匹配。在这种情况下，参数将提升到下一个更高的类型，直到找到匹配项为止。如果在提升参数后仍未找到匹配，则会发生编译错误。\n\
  \n#### 示例 5.5 在此示例中有两个同名的 `setdata()` 方法，但参数不同，因此这是方法重载。\n```java\nclass A {\n \
  \   private int x,y;\n    void setdata(int x1) {\n        x = x1;\n    }\n    void\
  \ setdata(int x1, int y1) {\n        x = x1;\n        y = y1;\n    }\n    void display()\
  \ {\n        System.out.println(x + \"\\t\" + y);\n    }\n}\n\nclass ClassTest5\
  \ {\n    public static void main(String args[]) {\n        A a1 = new A();\n   \
  \     a1.setdata(5);\n        a1.display();\n        A a2 = new A();\n        a2.setdata(10,20);\n\
  \        a2.display();\n    }\n}\n```\n**输出：**\n```\n5\t5\n10\t20\n```\n\n### 构造函数-\n\
  在创建后立即初始化对象是一个非常常见的需求。我们可以为此目的定义实例方法，但它们必须显式地调用。\n\n\n\n\nJava 为这一需求提供了解决方案。Java\
  \ 允许对象在通过构造函数创建时进行初始化。它也具有这一特性。\n\n构造函数的语法与实例方法非常相似。它们的名称与类名相同，且没有返回类型。\n\n这是因为类构造函数的隐式返回类型是类本身。构造函数可以像方法一样进行重载。\n\
  \n当使用运算符 `new` 创建一个类的实例/对象时，`JVM` 会为该对象分配内存，然后将实例变量初始化为它们的默认初始值，最后调用相应的构造函数来初始化实例变量。\n\
  \n### 注意\n`constructor`（构造函数）这个名字有点容易误义。看起来似乎构造函数的目的是创建一个对象/实例。实际上，在调用构造函数之前，对象已经创建，且实例变量和静态变量已经初始化为它们的默认初始值。\n\
  \n因此，构造函数的目的是用非默认值来初始化实例变量。\n\n## 构造函数的类型\n\n-   **默认构造函数 (Default Constructor)**：每个类都有一个默认构造函数（如果没有定义显式构造函数），该构造函数不接受任何参数，且体体不包含任何语句。编译器会自动生成默认构造函数。\n\
  \n一旦我们添加了自己的构造函数，编译器就会停止生成默认构造函数。当我们不在类中创建任何构造函数时，`JVM` 将创建默认构造函数，并将实例变量初始化为默认值\
  \ `null` 或 `zero`。\n\n### 示例 5.6 默认构造函数的用法\n```java\nclass A {\n    private int\
  \ x;\n    private int y;\n    void display() {\n        System.out.println(x + \"\
  \\t\" + y);\n    }\n}\nclass ClassTest6 {\n    public static void main(String args[])\
  \ {\n        A a1 = new A();\n        a1.display();\n    }\n}\n```\n**输出:**\n```\n\
  0     0\n```\n**注意**：在这里我们没有创建任何构造函数，`JVM` 在创建对象后会自动创建默认构造函数，并将实例变量初始化为 `0` 或 `null`。\n\
  \n-   **默认零参数构造函数 (Default Zero argument constructors)**：我们可以自己的零参数构造函数替换默认构造函数。这将允许我们将实例变量初始化为任何值。\n\
  -   **参数化构造函数 (Parameterized Constructors)**：接受参数的构造函数称为参数化构造函数。\n-   **注意**：构造函数可以像方法一样重载。这被称为构造函数重载。\n\
  \n### 示例 5.7 构造函数的用法\n```java\nclass A {\n    private int x;\n    private int y;\n\
  \    A() // 零参数构造函数 {\n        x = y = 0;\n    }\n    A(int x1) // 单参数参数化构造函数 {\n\
  \        x = x1;\n    }\n    A(int x1, int y1) // 双参数参数化构造函数 {\n        x = x1;\n\
  \        y = y1;   \n    }\n    void display() {\n        System.out.println(x +\
  \ \"\\t\" + y);\n    }\n}\nclass ClassTest7 {\n    public static void main(String\
  \ args[]) {\n        A a1 = new A();\n        a1.display();\n        A a2 = new\
  \ A(5);\n        a2.display();\n        A a3 = new A(4,7);\n        a3.display();\n\
  \    }\n}\n```\n**输出:**\n```\n0     0\n5     0\n4     7\n```\n\n### 示例 5.8\n```java\n\
  import java.util.Scanner;\nclass Complex {\n    private int real,imag;\n    Complex()//\
  \ 零参数构造函数 {\n        real=imag=0;\n    }\n    Complex(int real, int imag) {\n  \
  \      this.real=real;\n        this.imag=imag;\n    }\n    void getdata() {\n \
  \       Scanner sc=new Scanner(System.in);\n        System.out.print(\"Enter real\"\
  );\n        real=sc.nextInt();\n        System.out.print(\"Enter imag\");\n    \
  \    imag=sc.nextInt();\n    }\n    void display() {\n        if(imag>=0)\n    \
  \        System.out.println(real+\"\"+imag+\"i\");\n        else\n            System.out.println(real+\"\
  \"+imag+\"i\");\n    }\n    Complex(Complex c) {\n        Complex t=new Complex();\n\
  \        t.real=real+c.real;\n        t.imag=imag+c.imag;\n        return t; //\
  \ 或者\n        return new Complex(real+c.real,imag+c.imag);\n    }\n    mult(Complex\
  \ c) {\n        Complex t=new Complex();\n        t.real=real*c.real-imag*c.imag;\n\
  \        t.imag=real*c.imag+imag*c.real;\n        return t;\n    }\n    public static\
  \ void main(String args[]) {\n        Complex c1=new Complex();\n        Complex\
  \ c2=new Complex();\n        Complex c3=null,c4=null;\n        c1.getdata();\n \
  \       c2.getdata();\n        c3=c1.sum(c2);\n        System.out.print(\"Sum is\
  \ \");\n        c3.display();\n        c4=c1.mult(c2);\n        System.out.print(\"\
  Product is \");\n        c4.display();\n    }\n}\n```\n\n## finalize() 方法\n有时对象在被销毁时需要执行某些操作。例如，如果对象持有某些非\
  \ Java 资源（如文件句柄），我们可能希望在对象被销毁之前释放这些资源。\n\n\n\n为了处理此类情况，Java 提供了一种名为最终化（finalization）的机制。通过使用最终化，我们可以定义在对象即将被垃圾回收器回收时执行的特定操作。`finalize()`\
  \ 仅在垃圾回收之前被调用。它不会在对象离开作用范围时被调用。在 C++ 中，使用析构函数的概念来实现最终化，但它与 Java 中的 `finalize()`\
  \ 完全相同。\n\n```java\nprotected void finalize()\n{\n    // 在此处编写最终化代码\n}\n```\n\n\
  **注意**：除了使用 `protected` 修饰符，我们也可以使用 `public`。\n\n## 变量类型\n\nJava 有三种变量：\n\n### 1.\
  \ 实例变量\n在类中声明的、位于所有成员方法之外的变量称为实例变量。该变量的数量将与对象的数量相同。\n\n在 Java 中，不需要初始化实例变量，因为这些变量在对象创建并使用\
  \ `new` 运算符分配内存时就会被初始化。\n\n变量根据其类型进行初始化。所有的数值变量都自动初始化为 `0`，`Boolean` 变量初始化为 `false`，引用变量（对象）初始化为\
  \ `null` 值。\n\n我们可以通过对象名称和点 (`.`) 运算符来访问这些变量（`对象引用变量.实例变量名`）。我们不能像 C/C++ 那样使用 `->`\
  \ 运算符分隔对象引用变量和实例变量。\n\n### 2. 局部变量\n在方法内部声明的变量称为局部变量。它与实例变量不同。局部变量没有自动初始化。\n\n###\
  \ 3. 静态变量\n静态变量像实例变量一样声明在方法/块之外。但静态变量在数据类型之前使用了 `static` 修饰符。静态变量对于类及其所有的实例（对象）来说都是全局的。\n\
  \n它们对于跟踪全局状态非常有用。例如，类中的静态变量 `count` 可以存储程序在任何时刻创建的该类的实例/对象数量。\n\n对象可以使用静态变量进行通信，就像\
  \ C 函数通过全局变量通信一样。对于静态变量，无论程序中创建了多少实例/对象，变量都只有一个拷贝，并且在所有实例之间共享。\n\n点 (`.`) 运算符也用于访问类变量，但我们也可以使用类名或对象名访问静态变量。如果我们在不同的对象上声明它，它们将指向静态变量的同一个拷贝。\n\
  \n静态变量在类加载/使用时会根据其默认值（零、false 或 null）自动初始化。\n\n它们只能调用其他静态方法。它们只能访问静态数据。它们不能以任何方式引用\
  \ `this` 或 `super`。（关键字 `super` 与继承有关，将在稍后描述。）\n\n#### 示例 5.9\n```java\nclass A\
  \ {\n    int x;         //实例变量\n    static int y; //静态变量或类变量\n}\nclass ClassTest8\
  \ {\n    public static void main(String args[]) {\n        A a1 = new A();\n   \
  \     A a2 = new A();\n        A a3 = new A();\n        a1.x = 10;\n        a1.y\
  \ = 20;\n        a2.x = 11;\n        a2.y = 21;\n        a3.x = 12;\n        a3.y\
  \ = 22;\n        System.out.println(a1.x + \"\\t\" + a1.y);\n        System.out.println(a2.x\
  \ + \"\\t\" + a2.y);\n        System.out.println(a2.x + \"\\t\" + a3.y);\n    }\n\
  }\n```\n**输出：**\n```\n10  22\n11  22\n12  22\n```\n\n### 方法类型\n\n1. 实例方法\n2. 静态方法\n\
  \n### 实例方法\n这些方法与 C++ 函数相同。实例方法只能通过对象调用。如果我们在同一类的静态方法内部调用实例方法，则必须使用对象名称。\n\n###\
  \ 静态方法\n静态方法可以使用对象或类名调用。静态方法只能访问静态成员。静态方法可以从同一类的静态方法中直接调用（不需要对象或类名）。\n\n#### 示例\
  \ 5.10\n```java\nclass A {\n    int x;\n    static int y;\n    static int sum(int\
  \ a, int b) {\n        y = 5; // 静态方法可以访问静态变量\n        // x = 0; // 错误：静态方法无法访问实例变量\n\
  \        // A a1 = new A();\n        // a1.x = 10; // 错误：静态方法可以通过对象访问实例变量\n    \
  \    // this.x = 10; // 错误：静态方法无法访问 this 或 super\n        int c;\n        c = a+b;\n\
  \        return(c);\n    }\n    static float avg(int a, int b) {\n        return\
  \ (float)(a+b)/2;\n    }\n}\nclass ClassTest9 {\n    public static void main(String\
  \ args[]) {\n        System.out.println(A.sum(5,6)); // 静态方法可以通过类名调用\n        System.out.println(A.avg(5,6));\n\
  \        A a1 = new A();\n        System.out.println(a1.sum(5,6)); // 静态方法也可以通过对象调用\n\
  \    }\n}\n```\n**输出：**\n```\n1\n5\n```\n\n### 初始化块\n块用于初始化类的实例成员，静态块用于初始化类的静态成员。构造函数会在这些块之后调用。\n\
  \n#### 示例 5.1\n```java\nclass A {\n    int x;\n    static int y;\n    { // 初始化实例变量的块\n\
  \        x = 10;\n    }\n    static { // 初始化静态变量的静态块\n        y = 5;\n    }\n}\n\
  class ClassTest10 {\n    public static void main(String args[]) {\n        A a1\
  \ = new A();\n        System.out.println(a1.x + \"\\t\" + a1.y);\n    }\n}\n```\n\
  **输出：**\n```\n10  5\n```\n\n### 最终变量\n如果变量被声明为 `final`，则不能更改它的值（`final PI=3.14;`）。最终变量按每个实例占用内存。最终变量是常量变量，其值不能改变。最终引用类型不能更改其引用。\n\
  \n#### 示例 5.12\n```java\nclass A {\n    void m1() {\n        System.out.println(\"\
  Inside m1()\");\n    }\n}\nclass ClassTest11 {\n}\n```\n\n\n\n\n```java\npublic\
  \ static void main(String args[])\n{\n    final int x=10; //不可改变\n    final int\
  \ y;    // 变量 y 未初始化，稍后可以初始化 y\n    y=20;           // 现在 y 已初始化，之后我们不能再改变它的值\n\
  \    // y=30;         错误\n    System.out.println(x);\n    System.out.println(y);\n\
  \    final A a1=new A();  // a1 是常量引用，因此我们不能\n    // 将其他对象的引用赋值给 a1。\n    a1.m1();\n\
  \    A a2 = new A();\n    // a1 = a2; error\n}\n```\nOutput: 10\n20\n\n在 `m1()`\
  \ \n\n# 参数传递机制\n\n1. 值传递 (Call by Value)。\n2. 引用传递 (Call by reference)。\n\n当将基本类型（`int`、`float`、`long`\
  \ 等）传递给方法时，使用的是值传递方法。对于对象，实际传递的是对象的引用。\n\n对象的引用也是通过值传递方法传递的。然而，由于所传递的值指向一个对象，因此该值的拷贝仍然指向与其对应参数相同的同一个对象。\n\
  \n例如，如果我们我们将一个存储对象引用的变量 `a1` 传递给函数，而函数中 `a2` 是形式参数，那么 `a1` 和 `a2` 都指向同一个对象。\n\n\
  通过 `a2` 对对象值进行的任何更改都会反映在 `a1` 中。但如果我们为 `a2` 赋值一个新引用，该引用不会自动复制到 `a1` 中。\n\n### 示例\
  \ 5.13\n\n```java\nclass Box {\n    private int feet;\n    private int inches;\n\
  \    Box() {\n        feet = 0;\n    }\n    Box(int feet, int inches) {\n      \
  \  this.feet = feet;\n        this.inches = inches;\n    }\n    void display() {\n\
  \        System.out.println(\"Feet is \" + feet +\"\\n\" + \"Inches is \" + inches);\n\
  \    }\n    void swap(Box obj) {\n        int t;\n        t = feet;\n        feet\
  \ = obj.feet;\n        obj.feet = t;\n\n        t = inches;\n        inches = obj.inches;\n\
  \        obj.inches = t;\n    }\n}\nclass ClassTest12 {\n    public static void\
  \ main(String args[]) {\n        Box b1 = new Box(5,6);\n        Box b2 = new Box(7,4);\n\
  \        b1.swap(b2); // 对象是通过引用传递的\n        b1.display();\n        b2.display();\n\
  \    }\n}\n```\nOutput:\nFeet is 7\nInches is 4\nFeet is 5\nInches is 6\n\n## 嵌套类与内部类\n\
  \n可以在类内部定义另一个类；此类类被称为嵌套类。嵌套类的作用范围被限制在其外部类的作用范围之内。\n\n嵌套类可以访问其所嵌套类中的成员，包括该类的私有成员。然而，外部类无法访问嵌套类的成员。\n\
  \n嵌套类有两种类型：静态嵌套类（static）和非静态嵌套类（non static）。静态嵌套类是指应用了 `static` 修饰符的类。由于它是静态的，它必须通过对象来访问其外部类的成员。也就是说，它不能直接引用其外部类的成员。由于这种限制，静态嵌套类很少被使用。\n\
  \n非静态嵌套类可以访问其外部类的所有变量和方法，并可以像外部类的其他非静态成员一样直接引用它们。\n\n### 示例 5.14\n\n```java\nclass\
  \ Outer {\n    class Inner {\n        int member_inner=7;\n        Inner() {\n \
  \           member_outer = 5;\n            System.out.println(member_outer);\n \
  \       }\n    }\n    private int member_outer;\n    Outer() {\n        // member_inner\
  \ = 9\n        Inner obj = new Inner();\n        System.out.println(obj.member_inner);\n\
  \    }\n}\nclass ClassTest13 {\n    public static void main(String args[]) {\n \
  \       Outer out_obj = new Outer();\n    }\n}\n```\nOutput:\n5\n7\n\n### 示例 5.15\n\
  \n``````\nclass Outer {\n    static class Inner {\n        int member_inner=7;\n\
  \        Inner() {\n            // member_outer = 5\n            // System.out.println(member_outer)\n\
  \            Outer obj = new Outer();\n            obj.member_outer = 5;\n     \
  \       System.out.println(obj.member_outer);\n        }\n    }\n    private int\
  \ member_outer;\n    void prn() {\n        Inner obj = new Inner();\n        System.out.println(obj.member_inner);\n\
  \    }\n}\nclass ClassTest14 {\n    public static void main(String args[]) {\n \
  \       Outer out_obj = new Outer();\n        out_obj.prn();\n    }\n}\n```````\n\
  Output:\n5\n7\n\n### 示例 5.16\n\n```java\nimport java.util.Random;\nclass RandomTest\
  \ {\n    public static void main(String args[]) {\n        Random r1 = new Random();\n\
  \        for(int i=1;i<=10;i++)\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \    }\n}\n```\n\n### 理论题\n\n1. 如果我们希望一个成员变量完全无法在类外访问，在声明它时在变量名前前面应该加上什么关键字？\n2.\
  \ 在 Java 中，对象/值是如何传递的？\n3. 考虑以下代码：\n```java\npublic static void main( String args[]\
  \ )\n{\n    int a = 5;\n    System.out.println( cube( a ) );\n}\n\nint cube( int\
  \ theNum )\n{\n    return theNum * theNum * theNum;\n}\n```\n解释 `static` 关键字的重要性\n\
  \n当我们尝试编译并运行这段代码时会发生什么？\n\n\n\n\n\na) 它无法编译，因为 `cube` 在 `java.lang.Math` 类中已经定义过了。\n\
  \nb) 它无法编译，因为 `cube` 不是静态的。\n\nc) 它可以编译，但会抛出 `arithmetic exception`（算术异常）。\n\nd)\
  \ 它将完美运行并向标准输出打印 \"125\"。\n\n## 4. 什么是静态内部类？它与其他任何静态成员有什么区别？\n\n### 5. 如何在 Java\
  \ 中声明常量值\n\n## 6. \"final\" 关键字含义含义？\n\n## 7. 什么是类变量？\n\n### 答案\n\n当我们创建一个相同类的多个对象时，每个对象将共享变量的公共副本。这意味着无论创建了多少个对象，每个类都只有一份副本。类变量或静态变量是在类中使用\
  \ `static` 关键字声明的。\n\n这些变量存储在静态内存中。类变量主要用于常量，即永远不会改变初始值的变量。静态变量始终通过类名进行调用。\n\n该变量在程序启动时创建（即在通过\
  \ `new` 操作符创建类的实例之前就已经创建），并在程序停止时被销毁。类变量的作用域与实例变量相同。\n\n类变量可以在类层面的任何地方使用 `static`\
  \ 关键字定义。它的初始值与实例变量相同。当类变量定义为 `int` 时，其默认初始值为零；当声明为 `boolean` 时，默认值为 `false`，对象引用为\
  \ `null`。类变量与类相关，而不是与任何对象相关。\n\n## 8. 解释垃圾回收。\n\n### 答案\n\n垃圾回收是 Java 最重要的特性之一。垃圾回收称为自动内存管理，因为\
  \ `JVM` 会自动从内存中移除未使用的变量/对象（值为 `null`）。用户程序无法直接从内存中释放对象，相反，由垃圾回收器自动释放不再被程序引用的对象。\n\
  \n每个类都从 `java.lang.Object` 继承 `finalize()` 方法，当垃圾回收器确定不再有该对象的引用时，就会调用 `finalize()`\
  \ 方法。\n\n在 Java 中，当变量不再使用时，显式地将其赋值 `null` 是一个好习惯。在 Java 中调用 `System.gc()` 和 `Runtime.gc()`\
  \ 时，`JVM` 会尝试回收使用的对象，但无法保证所有对象何时会被垃圾回收。\n\n## 9. 如果一个类有多个构造函数，我们可以从一个构造函数调用另一个的吗？\n\
  \n可以。使用 `this()` 从另一个构造函数调用构造函数。\n\n## 10. 构造函数和普通方法有什么区别？\n\n构造函数的名称必须与类名相同，且不能返回值。它们只会被调用一次，而普通方法可以被调用多次，并且可以返回值或为\
  \ `void`。\n\n## 11. 我们如何强制进行垃圾回收？\n\n垃圾回收是自动过程，无法强制执行。我们可以通过调用 `System.gc()` 来请求它。`JVM`\
  \ 不保证 GC 会立即启动。\n\n## 12. 下列哪一描述是不正确的？\n\n(a) Java 中的局部变量总是由默认值初始化的。\n\n(b) Java\
  \ 中的局部变量在使用之前必须进行初始化。\n\n(c) 内部块中的局部变量不能与外部块中的局部变量同名。\n\n(d) 两个同层块中的局部变量可以有相同的名称。\n\
