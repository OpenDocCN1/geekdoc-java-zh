  Mouse Clicked...\");\n        mouseX = e.getX();\n        mouseY = e.getY();\n \
  \       repaint();\n    }\n\n    public void paint(Graphics g) {\n        g.setColor(Color.white);\n\
  \        g.fillRect(0, 0, getSize().width, getSize().height);\n        g.setColor(Color.gray);\n\
