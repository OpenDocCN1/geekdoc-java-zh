  \ ![11](img/image01214.jpeg)\n\n![STAR-LOGO-2013](img/image01215.jpeg)\n\n# 第 ∞\
  \ 1 章\n## (Java 概述)\n\n### 简介\n`Java` 是由 Sun Microsystems 公司于 1991 年开发的一种强大的面向对象的编程语言。`Java`\
  \ 最初为消费电子设备开发，但后来转向了互联网。现在，`Java` 已成为互联网广泛使用的编程语言。`Java` 是一种平台中立语言（与机器无关）。用 `Java`\
  \ 开发的程序可以在世界上任何硬件或任何操作系统上运行。\n\nSun Microsystems (Oracle) 在 1995 年 5 月的一场大会议上正式宣布了\
  \ `Java`。通常，这样的事件不会引起太大关注。然而，由于商业界对万维网的极大兴趣，`Java` 引起了立即关注。\n\n`Java` 现在用于创建具有动态和交互内容的\
  \ Web 页面，开发大型企业应用，增强万维网的功能。\n\n### Java 的需求\n开发 Java 是因为需要一种语言来创建嵌入各种消费电子设备（如微波炉和遥控器）的软件。用\
  \ `C` 和 `C++` 编写的程序针对特定的硬件进行编译，该程序不会在其他硬件上运行。因此，我们需要平台中立的语言。这种需求导致了 `Java` 的诞生。\n\
  \n### Java 类库\nJava 程序由`类` 组成。`类`由执行任务并在完成后返回信息的的方法组成。在书中，我们讨论了许多库类。类库主要由编译器供应商提供，但许多类库由独立软件供应商\
  \ (ISV) 提供。此外，许多类库可以在互联网和万维网上作为免费或共享软件获取。你可以下载免费产品并免费使用，但受版权所有者指定的任何限制。\n\n### 典型\
  \ Java 环境的基础\nJava 系统通常由几个部分组成：环境、语言、Java 编程接口 (`API`) 和各种类库。接下来的讨论解释了一个典型的 Java\
  \ 开发环境，Java 程序通过五个阶段执行。这些是：编辑、编译、加载、验证和执行。接下来的描述使用了标准的 `Java SE 7` 开发包 (`JDK 7`)，可以从\
  \ Oracle 获取。\n\n如果你使用的是不同的 Java 开发环境，你可能需要遵循不同的程序来编译和执行 Java 程序。在这种情况下，请查阅你的编译器的文档。\n\
  \n注意：如果你使用的不是 UNIX/Linux、Windows 95/98/ME 或 Windows NT/2000，请参考你系统 Java 环境的手册，或询问老师如何在你的环境中完成这些任务（你的环境可能与这些类似）。阶段\
  \ 1 是编辑文件。这是通过编辑器程序（通常称为编辑器）来实现的。程序员使用编辑器编写 Java 程序并在必要时进行修正。当程序员指定保存编辑器中的文件时，程序存储在次级存储设备（如磁盘）上。Java\
  \ 程序文件名以 `.java` 结尾。\n\n在 UNIX/Linux 系统上广泛使用的编辑器是 `vi` 和 `emacs`。在 Windows 95/98/ME\
  \ 和 Windows NT/2000 上，简单的编辑程序如 DOS Edit 命令和 Windows 记事本就足够了。\n\n\n\nJava 集成开发环境（IDE），例如用于\
  \ Java 社区版的 Forte、NetBeans、Borland 的 JBuilder、Symantec 的 Visual Cafe 以及 IBM 的 Visual\
  \ Age，都内置了集成到编程环境中的编辑器。\n\n我们假设读者知道如何编辑文件。`Java` 等语言是面向对象的——在这样的语言上进行编程被称为面向对象编程（OOP），它允许设计人员将面向对象的设计实现为可运行的系统。相反，`C`\
  \ 等语言是过程化编程语言，因此编程倾向于面向动作型。\n\n在 `C` 中，编程的单元是 `function`（函数）。在 `Java` 中，编程的单元是 `class`（类），对象最终从类中实例化（“创建”的专业术语）。`Java`\
  \ 类包含 `methods`（方法，实现类的行为）和 `attributes`（属性，实现类的数据）。\n\n`C` 程序员集中于编写 `functions`。执行某些共同任务的动作组被组合成函数，而函数被组合成程序。数据在\
  \ `C` 中无疑是重要的，但观点是数据主要存在是为了支持函数所执行的动作。系统规范中的动词帮助 `C` 程序员确定实现该系统所需的函数集。\n\n`Java`\
  \ 程序员集中于创建他们自己的名为 `classes`（类）和 `components`（组件）的用户定义类型。每个 `class` 包含数据以及操作这些数据的函数集。`Java`\
  \ 类的数据组件被称为 `attributes`。\n\n`Java` 类的函数组件被称为 `methods`。正如内置类型（如 `int`）的实例被称为 `variable`（变量），而用户定义类型（即\
  \ `class`）的实例被称为 `object`（对象）。程序员使用内置类型作为构建用户定义类型的“构建块”。\n\n`Java` 的重点在于 `classes`（我们通过类创建对象）而不是\
  \ `functions`。系统规范中的名词帮助 `Java` 程序员确定 `classes` 的集合，从这些类中将创建的对象将协同工作以实现系统。\n\n`Classes`\
  \ 之于 `objects` 恰如蓝图之于房屋。我们可以从一张蓝图建造许多房屋，也可以从一个 `class` 实例化许多 `object`。`Classes`\
  \ 也可以与其他 `classes` 建立关系。\n\n例如，在银行的面向对象设计中，“银行柜员”类需要与“客户”类相关联。这些关系被称为 `associations`（关联）。我们将看到，当软件被封装为\
  \ `classes` 时，这些类可以在未来的软件系统中被重用。相关的 `classes` 组通常被封装为可重用的 `components`。\n\n你创建的每个新\
  \ `class` 都有潜力成为一项价值巨大的软件资产，你和其他程序员可以使用它来加速并提高未来软件开发工作的质量——这是一个令人兴奋的可能性。\n\n# Java\
  \ 与 C、C++ 及 C# 的关系\n\n`Java` 从 `C` 处继承了语法，从 `C++` 处继承了面向对象的特性。它不是 `C++` 的增强版本。`Java`\
  \ 与 `C++` 既向上也不向下兼容。我想告诉你们的一个重要点是，`Java` 语言的设计并不是为了取代 `C++` 和 `C#`。由微软开发的用于支持 `.NET\
  \ Framework` 的另一种语言 `C#` 与 `Java` 关系密切，因为它们共享 `C++` 和 `C` 风格的语法，支持分布式编程，并使用相同的对象模型。\n\
  \n# Java 的主要目标是实现 -\n\n### 1. 安全性\n\n当我们使用兼容 `Java` 的 浏览器时，没有病毒感染的威胁。此外，也没有恶意程序从本地机器收集隐私信息（如信用卡号、银行账户余额和密码）的威胁。\n\
  \n`Java` 在网络应用程序和我们的计算机之间提供了一个防火墙。\n\n### 2. 可移植性\n\n`Java` 程序可以从一台计算机迁移到另一台运行不同类型操作系统和不同硬件的计算机。\n\
  \n## Java 字节码\n\n`Java` 程序在运行不同类型操作系统和具有不同硬件的计算机之间是可移植的。\n\n`Java` 的编译输出是 `bytecode`（字节码，`.class`\
  \ 文件）。`JVM`（Java 虚拟机）是解释器，用于执行 `bytecode`。`JVM` 在任何平台上运行 `Java` 程序。\n\n## JIT（即时编译）\n\
  \nJIT（Just In Time）是 `JVM` 按需将 `bytecode` 翻译成实际机器码。\n\n## Java 的各个版本\n\n* **Java\
  \ 1**\n    * `JDK 1.0`\n    * `JDK 1.1`\n* **Java 2**\n    * `JDK 1.2`\n    * `JDK\
  \ 1.3`\n    * `JDK 1.4`\n    * `JDK 1.5` 或 `JDK 5`\n    * `JDK 1.6` 或 `JDK 6`\n\
  \    * `Java 1.7` 或 `SE 7`\n    * `Java 8` (2014 年)\n\n**注 1：** `JDK`（Java 开发包）\n\
  **注 2：** 旧版 `Java` 版本的许多功能已被弃用\n\n# Java 可以开发的应用程序类型\n\n### 1. 独立应用程序\n独立应用程序是运行在本地计算机上的程序，类似于\
  \ `C` 或 `C++` 程序。\n\n### 2. Applet\n`applet` 是一种跨越网络传输并在客户端机器上兼容 Java 的浏览器（如 `Internet\
  \ Explorer` 或 `Netscape Navigator`）执行的小程序。\n\n`applet` 实际上是一个微型 `Java` 程序，通过网络下载。`applet`\
  \ 程序存储在 Web 服务器上，并在客户端请求时传输到客户端机器。\n\n`applet` 不能像独立应用程序那样执行。它只能通过嵌入 HTML 页面（如声音文件、图像文件或视频片段）来执行。现在这种嵌入了\
  \ `applet` 的 HTML 页面在通过浏览器下载后即可运行。\n\n### 3. Web 应用程序\n这些是运行在 Web 服务器上的程序。当我们通过浏览器中指定的\
  \ `URL`（通用资源定位符）访问网站时，浏览器会向特定的 Web 服务器发送请求。接收请求后，服务器运行一个程序，该程序被称为 Web 应用程序。我们使用\
  \ `Java Servlets` 和 `JSP`（Java 页面）来编写此类程序。\n\n这些程序运行在服务器上，并将结果/响应发送给客户端。`JSP` 页面可以被视为\
  \ HTML 和 `Java 代码` 的组合。在执行之前，Web 服务器会将 `JSP` 页面转换为 `Java Servlets`。\n\n### 4. 分布式应用程序\n\
  `Java` 应用程序被分为在单独机器上运行的小程序。这些程序中的对象可以相互通信。这些应用程序被称为分布式应用程序。这允许不同计算机上的对象通过 `RMI`（远程方法调用）远程执行过程。\n\
  \n# Java 的特性:-\n\n\n\n\n\n# Java 特性\n\n## 1. 简单\nJava 的语法与 C 和 C++ 几乎相似，因此熟悉 C/C++\
  \ 的程序员不需要从头开始学习语法。但 Java 删除了 C/C++ 中许多复杂或导致歧义的特性。\n\n1. Java 不支持多继承，因为这个概念有点复杂并可能导致歧义。\n\
  2. Java 不支持全局变量，这也导致了 C/C++ 程序中出现许多 bug。\n3. Java 不使用指针，也不允许指针算术，由于其固有的复杂性，这正是 C/C++\
  \ 程序中绝大多数 bug 的根源。\n4. Java 不支持运算符重载，因为这可能会导致混淆。\n5. Java 中没有垃圾值的概念。我们必须在变量之前对其进行初始化。\n\
  \n## 2. 安全\nJava 程序运行在 `JVM`（Java 虚拟机）内部，其他部分无法访问它们。这极大地提高了安全性。由于这一特性，Java 程序很少发生挂起（hang）。这与频繁挂掉的\
  \ C/C++ 程序大不相同。Java 的安全模型包含三个主要组件：\n\n1. 类加载器 (Class loader)。\n2. 字节码验证器 (Bytecode\
  \ Verifier)。\n3. 安全管理器 (Security Manager)。\n\nJava 使用不同的类加载器从本地机器和远程机器加载类文件（执行文件）。从远程机器加载的类（如\
  \ `Applet` 类）不允许读取或写入本地机器的文件。这防止了恶意程序破坏本地文件系统。字节码验证器在类加载器完成后立即对字节码进行验证。它确保字节码是有效的\
  \ Java 代码。它几乎消除了 Java 程序执行访问 `JVM` 外部内存等恶意活动的可能性。管理器控制许多关键操作，如删除文件、创建线程等。只有当 Java\
  \ 程序具有足够的权限时，这些操作才被允许，否则管理器将不允许这些操作并生成 `Security Exception`。\n\n## 3. 可移植\nJava\
  \ 程序是平台无关的。它们遵循“一次编写，随运行”的策略。为 Windows 平台编写的 Java 程序只需拷贝字节码（`.class` 文件），即可运行在任何其他平台（Unix、Linux、Sun\
  \ Solaris 等）。不需要像 C/C++ 程序那样需要复制源代码并重新编译。这一特性使 Java 成为一种强大的语言。只要机器拥有 `JVM`，我们就可以在任何机器上运行字节码。`JVM`\
  \ 本身是依赖平台的，但它让 Java 代码变得平台无关。实际上是 `JVM` 将字节码转换为机器码并执行它们。\n\n因此我们可以说 Java 是一种可移植的语言。另一个使\
  \ Java 高度可移植的特性是原始数据类型的长度与平台无关，是固定的。例如，Java 中的 `int` 始终是 4 字节。这与 C/C++ 不同，在某些机器上\
  \ `int` 的大小可能是 2 字节，而在另一些机器上可能是 4 字节。\n\n## 4. 面向对象\nJava 几乎是一种纯面向对象的语言，但出于性能考虑，它支持\
  \ `byte`、`short`、`int`、`long`、`float`、`double`、`char`、`boolean` 等原始数据类型。\n\n## 5.\
  \ 健壮\n大多数程序失败有两个原因：\n\n1. 内存管理。\n2. 运行时的异常情况。\n\n设计语言的目标之一确保 Java 程序尽可能健壮，即它们很少失败。因此，Java\
  \ 特别重视上述两个因素。\n\n在 Java 中，内存的分配和释放由语言本身处理，这消除了 C/C++ 中动态内存管理功能引起的许多问题。Java 还支持面向对象的异常处理功能来处理运行时发生的异常情况。这允许\
  \ Java 程序在发生异常情况后能够恢复并继续执行。\n\n## 6. 多线程\nJava 的设计是为了满足创建交互式网络化程序的现实需求。Java 提供了编写多线程程序的支持以实现这一点。这允许程序员编写可以并发执行许多任务的程序。\n\
  \n例如，基于 `GUI`（图形用户界面）的应用程序可能正在监听用户事件并采取相应，另一个线程可能正在打印，第三个线程可能从网络上的某机器下载文件，而这一切都是并发完成的。这带来了更好的性能和更好的\
  \ CPU 利用率。\n\n在其他语言中编写多线程程序也是可能的，但那仅通过使用 `System` 调用实现，而在 Java 中，可以通过语言本身的特性来实现。\n\
  \n## 7. 架构中性\n程序员面临的主要问题之一是，无法保证如果我们今天写了一个程序，明天还能运行——即使在同一台机器上。操作系统的升级、处理器升级以及核心系统资源的变化都可能导致程序故障。但\
  \ Java 程序的目标是“一次编写，随处运行”。\n\n## 8. 解释型与高性能\nJava 程序是被解释执行的，但与其他解释器相比，它们的运行速度很快。\n\
  \n## 9. 分布式\nJava 是为互联网的分布式环境设计的。为了这一目的，Java 内置了对各种基于 `TCP/IP`get 的支持。事实上，使用 `URL`\
  \ 访问资源类似于访问本地上的文件。Java 还具有远程方法调用（Remote Method Invocation）功能，这与远程过程调用 (`RPC`) 某些相似。这允许不同计算机上的对象远程执行过程。Java\
  \ 为此目的提供了内置 API，称为 `RMI`。\n\n## 10. 动态\n每个 Java 类都是一个独立的执行单元。类只有在需要时才在运行时加载。Java\
  \ 中绑定方法的默认机制也是动态的（运行时绑定）。\n\n# 运行独立 Java 程序\n\n当 C 或 C++ 程序被编译时，它被转换为特定处理器的机器码。但运行\
  \ Java 程序是一个两个步骤的过程。在 Java 中，从源代码到执行代码的转换通过两个翻译器：\n\n1. Java 编译器 - 首先将 Java 程序编译成字节码。字节码类似于机器码，但不针对特定的处理器或平台。\n\
  2. Java 解释器 (`JVM`) - Java 解释器通过 `JIT` 将字节码翻译成特定平台的机器码。\n\n注意 1：C 或 C++ 程序只编译一次，但\
  \ Java 字节码每次执行 Java 程序时都会被翻译。因此 Java 程序运行比 C/++ 程序慢。注意 2：运行 Java 程序需要文本编辑器（记事本）、`JDK`（Java\
  \ 开发包）以及 `JVM`（已安装在许多操作系统）。可以使用 `Eclipse` 或 `JCreater` 代替事本。\n\n### 在 win xp 安装\
  \ Java 1.7\n双击我的电脑→双击光驱→双击 JDK1.7 安装文件→点击下一步、下一步\n\n### 设置路径\n如果我们设置了 Java 文件夹的路径，就可以从任何地方运行\
  \ Java 程序，否则我们必须从 Java 的 `bin` 文件夹运行 java 程序。\n\n右键点击我的电脑→属性→高级→环境变量→点击 `Path` 然后点击编辑→点击变量值→按\
  \ `END` 键将光标移动到该行末尾→现在输入 `c:\\program files\\Java\\jdk1.7.0_01\\bin;` 然后点击确定、确定、确定。\n\
  \n### 为 Java 程序创建文件夹\n双击我的电脑→双击 C 盘→右键点击→新建→文件夹→输入 `JAVAPRG`→按回车并关闭我的电脑。\n\n###\
  \ 在命令行提示符运行 Java 程序的步骤\n步骤 1：进入命令行提示符\n开始→运行→输入 `cmd` 并点击确定。\n\n\n\n\n\n### 步骤 2\n\
  输入 `CD \\JAVAPRG` 并按回车\n\n### 步骤 3\n输入 `Edit Sum.Java` 并按回车\n\n### 步骤 4\n输入 Java\
  \ 程序并点击 `File`→`Save`，然后点击 `File`→`Exit`\n\n### 步骤 5\n输入 `javac Sum.Java` 并按回车编译。这将创建一个\
  \ `Sum.class` 文件。该文件被称为字节码。\n\n### 步骤 6\n输入 `java Sum` 并按回车运行。这将调用 `JVM`。\n\n###\
  \ 步骤 7\n输入 `Exit` 然后按回车退出命令提示符。\n\n**注意** - 我们也可以通过上述步骤使用记事本运行 Java 程序，但不再使用 `Edit`\
  \ 命令，而是使用 `Notepad`。在输入 Java 程序后，在另存为对话框中选择“所有文件”，然后将其保存到文件夹 `C:\\JAVAPRG` 中。编译和运行需要遵循上述步骤。\n\
  \n## Java 程序语法\n```java\nclass <class name> {\n    public static void main(String\
  \ args[]) or (String [] args) {\n        // - - - - - - -\n    }\n}\n```\n\n## 第一个\
  \ Java 程序 - 两个数字相加程序 (Sum.Java)\n```java\nclass Sum {\n    public static void main(String\
  \ args[]) {\n        int a, b, sum;\n        a = 5;\n        b = 6;\n        sum\
  \ = a + b;\n        System.out.print(\"Sum is \" + sum); //输出\n    }\n}\n```\n**输出：**\
  \ Sum is 11\n\n## 示例 2：两个数字交换程序 (Swap.Java)\n```java\nclass Swap {\n    public static\
  \ void main(String args[]) {\n        int a=5, b=7;\n        int t = a;\n      \
  \  a = b;\n        b = t;\n        System.out.print(\"After Swap Values are \" +\
  \ a + \",\" + b);\n    }\n}\n```\n**输出：** Swap Values are 7,5\n\n## 注释\n有 3 类型的注释：\n\
  - **单行注释**: `//`\n- **多行注释**: `/* ... */`\n- **文档注释**: `/** ... */`\n\n## Java 规则\n\
  - 每个 Java 程序必须包含一个类。在 Java 中，`main()` 方法只能定义在类内部。\n- 源文件可以有任意数量的类或接口定义，但最多只能有一个公共（public）类或接口。\n\
  - 源文件可能包含也不包含 `main()` 方法 类，但独立的 Java 程序始终从 `main()` 方法开始执行。因此，我们想要开始执行的类必须在其中定义了\
  \ `main()` 方法。\n- `main()` 方法必须具有以下签名：`public static void main(String args[])`\n\
  \n**注意** - 方法原型在 Java 中被称为签名（signature）。\n\n- `public` 关键字表示该方法可以从任何地方访问。`main()`\
  \ 方法必须声明为 `public`，因为它是由 `JVM` 部分的代码调用的，这些代码位于包含 `main()` 方法的类之外。\n- `static` 关键字表示\
  \ `main()` 是类方法，可以在不创建任何对象的情况下调用；这是必须的，因为在调用 `main()` 之前不存在对象，任何对象的创建都发生在 `main()`\
  \ 方法内部。\n- `main()` 方法前的 `void` 关键字表示它不返回任何值。\n- `main()` 方法接收一个参数，即 `String` 数组。数组的每个元素代表一个命令行参数。\n\
  - `System` 是一个预定义的类，提供对系统的访问，`out` 是连接到控制台的输出流。可以使用 `print()` 方法显示任何类型的信息。\n\n##\
  \ Java 程序结构\n所有 Java 源文件必须以 `.Java` 结尾。Java 是一种大小敏感的语言。注意在上面的程序中，类 `Sum`、`String`\
  \ 和 `System` 的第一个字母都是大写的。最好将 Java 程序保存为与类名相同的文件，这不是强制的。如果类被声明为 `public`，则强制将该类保存为与类名相同的文件。一个文件可以只包含一个公共类，但可以包含多个非公共类。如果一个文件包含多个类，那么编译后，每个单独的类都会被放在以类名命名并使用\
  \ `.class` 扩展名的单独输出文件中。\n\n## \n- **文档部分 (Documentation Section)**：文档部分包含一组行，给出程序的名称、作者以及程序员以后想要引用的其他细节。\n\
  - **包语句 (Package Statement)**：源文件最多包含一个包语句。如果存在，它必须是第一个语句。\n- **导入语句 (Import Statements)**：源文件可以有零或多个导入语句。它们出现在包之后。\n\
  - **接口语句 (Interface Statements)**：接口类似于类，但只在我们希望实现继承时使用。\n- **类定义 (Class definition)**：一个\
  \ Java 程序可以包含多个类。\n- **包含 main 方法的类定义**：由于独立程序需要 `main` 方法作为起点，因此该类是核心部分。\n\n##\
  \ 垃圾回收 (Garbage Collection)\nJava 对象的内存分配完全是动态的，但 Java 没有指针算术。每当我们运行 Java 程序时，`JVM`\
  \ 也会后台运行另一个名为“垃圾回收器”（Garbage Collector）的线程。`垃圾回收器` 会检查 Java 对象。当一个 Java 对象不再被使用时，它会被垃圾回收器回收，即为对象分配的内存会被加入池/堆并重用。这在很大程度上简化了程序员的任务。这也消除了许多由于不当使用指针算术（如显式释放内存）导致的错误。\n\
  \n单选题\n1. 下面哪些是应用程序 `main()` 方法的有效定义？\n   - a a `public static void main()`\n  \
  \ - b `public static void main(String args)`\n   - c `public static void main(String\
  \ args[])`\n   - d `public static void main(Graphics g)`\n   - e `public static\
  \ boolean main(String args[])`\n\n2. 哪个组织开发了 Java 语言？\n   - a Microsoft\n   - b\
  \ IBM\n   - c Sun Microsystems Inc.\n   - d AT&T\n\n\n\n\n\n### 3. Java 属于以下哪种语言分类？\n\
  \n(a) 面向对象\n(b) 过程\n(c) (a) 和 (b) 都是\n(d) 以上都不是\n\n### 4. 下面哪项描述是不正确的？\n\n(a) Java\
  \ 的垃圾回收是自动的。\n(b) Java 提供对分布式应用程序的支持。\n(c) 与 C/C++ 相比，Java 效率更高。\n(d) 与 C/C++ 相比，Java\
  \ 更安全。\n\n### 5. 下面哪项描述是正确的？\n\n(a) Java 是一种平台无关语言\n(b) Java 是一种面向对象的语言\n(c) Java\
  \ 支持多线程。\n(d) 以上都是。\n\n**答案：** 1. (c) 2. (c) 3. (a) 4. (c) 5. (d)\n\n### 理论题\n\n\
  1. 解释 Java 虚拟机 (`JVM`) 的工作原理。\n2. `C++` 和 `Java` 之间有什么区别？\n3. \"APPLET（小程序）\" 和\
  \ \"APPLICATION（应用程序）\" 之间的区别。\n4. `Java` 的缺点。\n5. 垃圾回收是如何工作的？\n6. 什么是 `BYTE Code（字节码）`？\n\
  7. `java` 是完全面向对象的编程吗？如果不是，为什么？\n8. Java 应用程序/程序有哪些不同的类型？\n9. Java 可执行文件的扩展名是什么？\n\
  10. Java 源代码/程序文件的扩展名是什么？\n11. 使用什么命令编译 Java 程序？\n12. 哪个组织开发了 `Java` 语言？\n13. 是什么让\
  \ `Java` 具有平台无关性？\n14. 为什么 `Java` 相比 `C/C++` 更安全？\n15. 为什么 `Java` 相比 C 更更加健壮？\n\
  16. 我们如何理解分布式应用程序？\n17. 描述 `Java` 的任意四个特性。\n18. 描述编译和运行程序所需的步骤。\n19. `Java` 流行的主要原因是什么？\n\
  20. 为什么 `Java` 删除了 `C/C++` 的许多特征？列出其中一些特征。\n21. 列出 `Java` 中的三种注释类型。\n22. 列出 `C`\
  \ 和 `Java` 之间的 10 个主要区别。\n23. 描述一个典型 Java 程序的结构。\n\n#### 编程练习\n\n1. 编写程序计算两个整数的平均值。\n\
  2. 编写程序在不使用第三个变量的情况下交换两个数字。\n3. 编写程序将小时、分钟转换为总秒数。\n4. 编写程序计算给定圆的面积和周长。\n\n# Java\
  \ 语言\n\n### 标记\n\n最小的独立单元被称为标记，如 `keywords（关键字）`、`identifiers（标识符）`、`strings（字符串）`\
  \ 和 `Operators（运算符）`。\n\nA. `Keywords` 是语言的保留名称，不能用作变量、函数等的名称。\nB. `Identifier`\
  \ 指变量、数组、类、`Interfaces（接口）` 等名称。\nC. `Constants/Literals（常量/字面量）` 指程序中无法更改的固定值。\n\
  D. `Operators（运算符）` 是作用于变量和常量的特殊符号，并构成一个表达式。\nE. `Separators（分隔符）` 是用于分隔语句的特殊字符，如\
  \ `(` `)` `{` `}` `[` `]` `;` `,` `.`\n\n#### 关键字\n\n`abstract`, `assert`, `boolean`,\
  \ `break`, `byte`, `case`, `catch`, `char`, `class`, `continue`, `default`, `do`,\
  \ `double`, `else`, `extends`, `final`, `finally`, `float`, `goto`, `if`, `implements`,\
  \ `import`, `int`, `long`, `native`, `package`, `private`, `protected`, `public`,\
  \ `return`, `short`, `static`, `strictfp`, `super`, `synchronized`, `this`, `throws`,\
  \ `try`, `transient`, `void`, `volatile`\n\n\n\n\n\nJava 提供了一套丰富的运算符。运算符将常量、变量和子表达式组合成表达式。Java\
  \ 中的绝大多数运算符的行为与 C/C++ 相似，但存在极少数差异，本文将介绍这些差异。\n\n运算符可以分为以下几类：\n\n### 算术运算符 (+, -,\
  \ *, /, %))\n\n- 这些运算符与 C/C++ 中的运算符相同。\n- `%` 运算符也可以作用于浮点数。\n- 当二元运算符应用于两个不同类型的操作数时，低类型的操作数会在评估之前转换为高类型的操作数，结果的类型将与高类型操作数的类型相同。\n\
  - 对于 `int` 类型，除以零或取模会导致 `ArithmeticException`（运行时错误），但对于浮点数则不会。\n- 当我们对 `int` 应用算术运算符且结果超出\
  \ `int` 的取值范围时，额外的高阶位将被截断，此新值将赋值给接收结果的变量；但在浮点类型中，溢出将导致 `Infinity` 或 `–Infinity`，而下溢将导致\
  \ `0`。\n\n### 递增和递减运算符 (++, --)\n\n这些运算符与 C/C++ 中的相同。\n\n```java\nint a=5,b;\nb\
  \ = ++a*++a;\nSystem.out.print(b); //42\na = 5;\nSystem.out.print(++a*++a); //42\n\
  ```\n\n### 关系运算符 (<, >, <=, >=, instanceof)\n\n这些运算符与 C/C++ 相同，但 `<`, `<=`, `>`,\
  \ `>=` 不能作用于布尔类型和引用类型。\n\n### instanceof 运算符\n\n`instanceof` 运算符用于测试对象的类。`instanceof`\
  \ 运算符的通用形式为：\n\n```\nif(object instanceof type)\n```\n\n在这里，`object` 是一个类的实例，`type`\
  \ 是类类型。如果 `object` 是指定类型的实例或该指定类型任何子类的实例，则 `instanceof` 运算符返回 `true`，否则结果为 `false`。\n\
  \n### 赋值运算符 (=, +=, -=, *=, /=, %)\n\n这些运算符与 C/C++ 中的相同。\n\n### 相等运算符 (==, !=)\n\
  \n这些运算符与 C/C++ 中的相同。\n\n### 逻辑运算符 (&&, ||, !)\n\n这些运算符与 C/C++ 中的相同。\n\n### 条件运算符\
  \ (? :)\n\n该运算符与 C/C++ 中的相同。\n\n### 位运算运算符 (&, |, ^, ~, <<, >>, >>>)\n\n这些运算符与 C/C++\
  \ 相同，位移运算符除外。位移运算符仅作用于整数类型。\n\n#### 左移运算符 (<<)\n\n要获得 `<<` 运算符的结果，左侧操作数的位将根据右侧操作数的指定向左移动，右侧的空位用零填充。左移\
  \ 1 位等同于乘以 2。结果的符号可能与左侧操作数的符号不同。这可能是因为符号取决于最高位，而最高位可能会从 0 变为 1 或从 1 变为 0，从而导致符号变化。\n\
  \n示例 `b = a << 2;`。要获得 `b` 的值，将 `a` 中的位左移 2 位，并用零填充右侧 2 位。\n\n#### 右移运算符 (>>)（有符号）\n\
  \n要获得 `>>` 运算符的结果，左侧操作数的位将根据右侧操作数的指定向右移动，左侧的空位用符号位填充。右移 1 位等同于除以 2。该运算符永远不会改变结果的符号，即与左侧操作数的符号相同。\n\
  \n示例 `b = a >> 2;`。要获得 `b` 的值，将 `a` 中的位右移 2 位，并用符号填充右侧 2 位（如果 `a` 为正则填充 0，如果 `a`\
  \ 为负则填充 1）。\n\n#### 零填充右移运算符 (>>>)（无符号）\n\n要获得 `>>>` 运算符的结果，左侧操作数的位将根据右侧操作数的指定向右移动，左侧的空位用\
  \ 0 填充。右移 1 位等同于除以 2。如果发生了位移，结果将始终为正，因为最右侧位将变为零。\n\n示例 `b = a >>> 2;`。要获得 `b` 的值，将\
  \ `a` 中的位右移 2 位，并用 0 填充右侧 2 位。\n\n### 运算符优先级\n\n| 优先级 | 运算符 | 描述 | 结合性 |\n| :---\
  \ | :--- | :--- | :--- |\n| 1 | `[]` | 函数调用、下标 | 从左到右 |\n| 2 | `++--~!` | 递增递减、单目取反\
  \ | 从右到左 |\n| 3 | `*%/` | 乘、取模、除法 | 从左到右 |\n| 4 | `+-` | 加、减法 | 从左到右 |\n| 5 | `>>><<`\
  \ | 位右移、位左移、无符号位右移 | 从左到右 |\n| 6 | `>=instanceof` | 大于等于、小于等于 | 从左到右 |\n| 7 | `=!=`\
