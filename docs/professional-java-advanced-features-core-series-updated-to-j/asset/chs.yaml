  \n| 24 | 使 Java 比其他语言更安全的关键特性 | 579 |\n\n\n\n\n跟随畅销书《Java 编程》作者 Harry H. Chaudhary（书籍销量已超过\
  \ 167,000 本！），在短时间内掌握 Java 编程的所有基础和高级特性。本 Java 指南从基础开始，通过数以千行的 Java 代码详细带你进入 Java\
  \ 的高级特性，我承诺这本书将使你成为 Java 专家级冠军。任何人都可以通过这本书达到专家水平学习 Java。\n\n工程类学生和初级开发者也可以这本书。本书涵盖了所有计算机科学专业专业的通用核心课程大纲。如果你是认真的，请通过这本终极\
  \ Java 书来开启你的一天。\n\n这本 Java 书的主要目标不仅仅是为你提供 Java 编程知识，我遵循了一种模式，即针对每个 Java 主题，通过不同\
  \ Java 复杂度的清晰理论解释来改进数千个代码的解决方案，你将发现复杂的 Java 问题有多种解决方案。\n\n### 特色之处\n\n在书中，我为开发者和初学者详细涵盖并解释了最新的\
  \ Java 8 特性的几个主题，主题如：\n- `Lambdas`\n- `Java 8 函数式接口`\n- `Java 8` 中的 `Stream` 和 `Time\
  \ API`\n\n如果你读过这本书，你就会知道可以期待什么：一种根据你大脑工作方式而设计的视觉丰富的格式。如果你没读过，那将大有收获。你会发现为什么人们说它和你读过的任何其他\
  \ Java 书都不同。\n\n学习一种新语言并非易事，尤其是当它是像 `Java` 这样面向对象的编程语言时。你可能会认为问题出在你的大脑上。它似乎有自己的想法，并不总是想要接受你被迫学习的枯燥技术内容。事实是，你的大脑渴望新奇。它在不断地寻找、扫描，等待着异常事的发生。毕竟，它是为了帮助你生存而设计的。它将所有常规、普通、无味的内容过滤到背景中，以免干扰大脑的真正工作——记录重要的事情。你的大脑如何知道什么是重要的呢？\n\
  \n这本 Java 书不需要之前的编程经验。然而，如果你拥有 `C` 或 `C++` 编程背景，那么你将学得更快。\n\n正因如此，这本 Java 书对 `Java`\
  \ 的几个关键特性进行了快速详细的概述。这里描述的材料将为你提供一个脚点，让你能够编写和理解简单且典型的程序。讨论的大部分主题将在后续章节中通过数千个实时的 Java\
  \ 代码示例进行更详细的检查。\n\n正如我们过去几年所记录的事实：Web 已经不可逆转地重塑了计算的面貌，不愿掌握其环境的程序员将被淘汰。前述是一个强有力的陈述，它也是事实。\n\
  \n越来越多的应用程序必须与 Web 接口对接。应用程序是什么已不再重要，几乎全球通用的 Web 访问正在拉动、推动并诱导程序员为在线世界编写程序，而 `Java`\
  \ 是许多人将用来实现此点的的语言。坦率地说，精通 `Java` 不再是专业程序员的备选项，而是一项硬要求。这本书将帮助你获得这种技能。\n\n![11](img/image01214.jpeg)\
