  \n### 3. GridLayout\n`GridLayout` 管理器的功能封装在 `java.awt.GridLayout` 类中。`GridLayout`\
  \ 以表格格式在行和列中排列组件。我们可以将容器空间视为行和列的网格。在指定布局时，我们需要指定行数和列数。`GridLayout` 会根据行的大小（布局中指定的列数）将尽可能多的组件放入第一行，并将其他组件移动到第二行，依此类推。这类似于电子表格，被分为固定数量的行和列。\n\
  \n流式布局管理器总是尊重组件的首选尺寸。`GridLayout` 管理器则采取相反极端：当它在给定空间内执行布局时，它会忽略组件的首选尺寸。`GridLayout`\
  \ 中的每行每列都具有相同的大小，布局可用的总区域平均分配在行数和列数之间。`gridLayout` 使用“行优先”表示法，即组件按照它们添加的顺序，从左到右、一行一行地出现。当添加较少组件（即显著少于行数乘以列数）或非常多组件（多于行数乘以列数）时，`GridLayout`\
  \ 的行为会很奇怪。如果要在一个更高更窄的框架中放置每个组件将按比例变得更高更窄。\n\n**示例 17.6：**\n```java\nimport java.awt.*;\n\
  public class MyFrame6 extends Frame {\n    public static void main(String args[])\
  \ {\n        Frame f = new MyFrame6();\n        f.setLayout(new GridLayout(5,3));\n\
  \        for(int row=0; row<5; row++) {\n            f.add(new Label(\"Label\" +\
  \ row));\n            f.add(new Button(\"Button\" + row));\n            f.add(new\
  \ TextField(\"TextField\" + row));\n        }\n        f.setSize(500,200);\n   \
  \     f.setVisible(true);\n    }\n}\n```\n**输出：**\n![](img/image01278.jpeg)\n\n\
  ### 4. BorderLayout\n`BorderLayout` 管理器的功能封装在 `java.awt.BorderLayout` 类中。`BorderLayout`\
  \ 管理器是框架的默认管理器，因此应用程序程序员迟早会接触它。\n\n它强制了一种非常有用的布局策略，但可能没有流式布局或网格布局管理器那么直观。流式布局管理器总是尊重组件的首选尺寸；而网格布局管理器从不这样做。`Border\
  \ layout` 管理器介于两者之间。\n\n`Border Layout` 管理器将可用的容器空间分为五个部分：北（North）、南（South）、东（East）、西（West）和中心（Center）。我们可以在每个区域添加一个组件。这五个区域可以是空的，也可以包含一个组件（即任何区域都不强制包含组件，但区域只能包含一个组件）。\n\
  \n`Border layout` 管理器尊重北部和南部组件的首选高度，并强制它们的宽度与容器完全一致。北部和南部区域适用于工具栏、状态栏以及任何应该尽可能宽但高度尽可能不必要的控件。\n\
  \n东部和西部区域与部南部相反。在东部和西部，组件获得其首选宽度，但高度受到限制。在这里，组件垂直延伸到北部组件的底部（如果有的话）或容器的顶部（如果没有北部组件）。\n\
  \n同样，组件垂直向下延伸到南部组件的顶部（如果有的话）或容器的底部（如果没有南部组件）。\n\n\n\n\n\n# BorderLayout 区域\n\n-\
  \ `BorderLayout.SOUTH`\n- `BorderLayout.EAST`\n- `BorderLayout.WEST`\n- `BorderLayout.CENTER`\n\
  \n`Border` 布局管理器控制的第五个区域被称为 `Center`。`Center` 是在分配了 `North`、`South`、`East` 和 `West`\
  \ 之后容器剩余的部分。\n\n向 `center` 添加组件时，省略 `add()` 调用的第二个参数是合法的，但非常不明智。在 Java 平台上，`Border`\
  \ 布局管理器会假设我们的意思是 `center`。\n\n然而，在旧版本中，这种行为是预测的，通常会导致组件完全不可见。\n\n## 示例 17.7\n\n\
  ```java\nimport java.awt.*;\npublic class MyFrame7 {\n    public static void main(String\
  \ args[]) {\n        Frame f=new Frame();\n        Scrollbar sbRight=new Scrollbar(Scrollbar.VERTICAL);\n\
  \        f.add(sbRight, BorderLayout.EAST);\n        Scrollbar sbLeft=new Scrollbar(Scrollbar.VERTICAL);\n\
  \        f.add(sbLeft, BorderLayout.WEST);\n        Label labelTop=new Label(\"\
  This is North\");\n        labelTop.setFont(new Font(\"Serif\", Font.ITALIC, 36));\n\
  \        labelTop.setForeground(Color.white);\n        labelTop.setBackground(Color.black);\n\
  \        f.add(labelTop, BorderLayout.NORTH);\n        Label labelBottom=new Label(\"\
  This is south\");\n        labelBottom.setFont(new Font(\"Monospaced\", Font.BOLD,\
  \ 18));\n        labelBottom.setForeground(Color.white);\n        labelBottom.setBackground(Color.black);\n\
  \        f.add(labelBottom, BorderLayout.SOUTH);\n        f.setSize(50,20);\n  \
