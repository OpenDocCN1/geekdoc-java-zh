  \n# 包介绍\n\n当我们开发一个项目时，必须将程序拆分成若干个类。为了组织这些类，我们使用 `Packages`（包）。包既是一种命名机制，也是一种可见性控制机制。包是相互相关的类和接口的集合。在包的帮助下，只要它们定义在不同的包中，就可以给多个类赋予相同的名称。\n\
  \n单个包不能包含两个同名的类。\n\n`PROGRAMS` 被组织为包的集合。每个包都有自己的一子包集合，这有助于防止名称冲突。顶层包只有在声明为 `public`\
  \ 时才能在包外部访问。包的命名结构是层级化的。包的成员是类、接口类型以及子包。`java` 中的包是一种封装机制，用于将相关的类、接口和子包组合在一起。\n\n\
  对于小型程序，包可以是不命名的或有一个简单的名称，但如果代码要广泛分发，则应该选择唯一的包名。这可以防止当两个开发小组恰好选择了相同的包名，且这些包随后被用在同一个程序中时，本会发生的冲突。如果我们没有为\
  \ `java` 类指定包，那么该类将成为 Java 默认包的一部分，称为“无命名包”。但这要求每个类都必须有唯一的名称以避免冲突。\n\n## 无命名包的示例\n\
  \n```java\nclass A {\n    // ...\n}\nclass A_demo {\n    public static void main(String\
  \ args[]) {\n        // ...\n    }\n}\n```\n\n## 如何定义包\n\n要创建一个包，请在源文件的第一行包含 `package`\
  \ 命令。在该文件中声明的任何类都属于指定的包。如果我们省略了包语句，类将被放入默认包中，该包没有名称，被称为无命名包。Java 使用文件系统目录来存储包。记住大小写敏感，且目录名必须与包名匹配。多个文件可以包含相同的包语句。\n\
  \n### 语法\n```java\npackage package_name;\nclass A {\n    // 类 A 的主体\n}\n```\n`package`\
  \ 是一个关键字。`p1` 是类 `A` 要存储的包名。\n\n### 示例 8.1\n```java\npackage p1;\nclass A {\n  \
  \  System.out.println(\"First Package.\");\n}\n```\n假设当前目录是 `c:\\javrg\\`。\n```bash\n\
  C:\\javrg>javac A.java\nC:\\javrg>java p1.A\n```\n输出：\nFirst Package\n\n注意：如果我们使用\
  \ `-d` 编译上述程序，会自动创建一个 `p1` 文件夹，并将 `.class` 文件保存在该文件夹中。如果不使用 `-d` 参数，我们需要手动创建 `p1`\
  \ 文件夹并在 `c:\\javrg` 下运行。\n\n## 导入包\n\nJava 的所有内置类都存储在命名的包中；由于包内的类必须使用全限定名，因此为每个使用的类输入长长的路径会非常麻烦。因此，Java\
  \ 提供了 `import` 语句将某些类或整个包引入可见范围。一旦导入，就可以直接使用名称引用类。`import` 语句是为了方便程序员，不需要编写完整的路径。如果我们要引用几十个类，`import`\
  \ 语句将节省大量工作。在源文件中，`import` 位于 `package` 语句之后、类定义之前。这是 `import` 语句的通用形式。\n\n```java\n\
  import pkg1.classname;\nimport pkg1.*;\n```\n\n### 示例 8.2\n```java\n// 使用类 类打印 10\
  \ 个随机数\n// 使用 java.util 语句\nimport java.util.*;\nclass RandomTest1 {\n    public\
  \ static void main(String args[]) {\n        java.util.Random r1 = new java.util.Random();\n\
  \        for(int i=1;i<=10;i++) {\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \        }\n    }\n}\n```\n输出：\n1588659525\n481996564\n210875677\n386971039\n360473512\n\
  1922641171\n393055462\n889442536\n1836112189\n320882863\n\n### 示例 8.3\n```java\n\
  // 使用 java.util 语句导入 Random 类\nimport java.util.Random;\nclass RandomTest2 {\n \
  \   public static void main(String args[]) {\n        Random r1 = new Random();\n\
  \        for(int i=1;i<=10;i++) {\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(Math.abs(r1.nextInt()));\n\
  }\n}\n```\n\nOutput:\n```\n686722541\n1154462827\n452959606\n1235134497\n1421490552\n\
  1065881855\n424893046\n731473166\n1217844570\n437181304\n```\n\n### CLASSPATH\n\n\
  如果在当前文件夹之外的任何文件夹运行上述程序，它将无法运行。默认情况下，Java 运行时使用当前工作目录作为起点。\n\n因此，如果我们的包位于当前目录或当前目录的子目录中，它将被找到。但要从任何其他文件夹运行上述程序，我们必须在命令提示符中使用命令\
  \ `SET CLASSPATH=.;C:\\JAVAPRG` 来设置类路径。`CLASSPATH` 是环境变量。我们每次第一次启动计算机时都必须输入此命令。但如果我们将此命令放在\
  \ `MyComputer -> properties -> advanced -> Environment variables` 中，就不再需要反复输入此命令了。\n\
  \n我们也可以在不设置 `CLASSPATH` 环境变量的情况下运行程序。这样做请输入：\n\n```\njava –classpath c:\\javaprg\
  \ p1.A\n```\n\n**Note4**: 我们可以创建包的层级结构。要实现这一点，只需使用点将每个包名与其上方的包隔开。多级包语句的通用形式为：\n\n\
  ```java\npackage package_name1[.package_name2][.package_name3];\n```\n\n包层级结构必须反映在\
  \ Java 开发系统的文件系统中。例如，包 `java.awt.Image` 需要存储在 `java\\awt\\image` (WINDOWS) 或 `java/awt/image`\
  \ (UNIX) 或 `java:swt:image` (MACINTOSH) 文件系统中。\n\n包层级结构代表 Java 类和接口的组织。它并不代表类和接口的源代码组织方式。\n\
  \n每个 Java 源文件（也称为编译单元）可以包含零或多个类和接口的定义，但编译器会为其中的每一个一个生成一个包含 Java 字节码的独立类文件。类或接口可以使用包声明来指示其\
  \ Java 字节码被放在特定的包中。\n\n*   包 `java` 有子包 `awt`、`applet`、`io`、`lang`、`net` 和 `util`，但没有类或接口。\n\
  *   包 `java.awt` 有一个名为 `image` 的子包，以及许多类和接口。\n*   因为包 `java.awt` 有一个子包 `image`，它不能包含名为\
  \ `image` 的类型声明。\n*   如果一个包的全限定名是 `P`，且 `Q` 是 `P` 的子包，那么 `P.Q` 就是该子包的全限定名。\n*  \
  \ 如果存在一个名为 `mouse` 的包，且该包中有一个成员类 `Button`（这可能被称为 `mouse.Button`），那么不能存在任何全限定名为 `mouse.Button`\
  \ 或 `mouse.Button.Click` 的包。\n*   一个源文件中最多只能出现一个包语句，且它必须是 Java 源文件的第一个语句。\n\n###\
  \ 类成员的可见性\n\n类和包都是封装和包含变量及方法命名空间与作用域的手段。包作为类和其他子包的容器。类作为数据和方法代码的容器。\n\n类是 Java 最小的抽象单元。由于类和包之间的相互作用，Java\
  \ 处理类成员的五类可见性。\n\n1. 类内部的可见性。\n2. 同一包内子类中的可见性。\n3. 同一包内非子类的可见性。\n4. 不同包间子类的可见性。\n\
  5. 既不在同一包中也不是子类的子类中的可见性。\n\n**Note1**: 顶层类和接口只有两种可能的访问权限：默认（default）和 `public`。\n\
  \n**Note2**: 如果类被声明为 `public`，则可以通过其他代码进行访问。\n\n**Note3**: 如果类具有默认访问权限，则只能由同一包内的其他代码访问。\n\
  \n**Note4**: 只有当类可见时，成员的可见性才有意义。如果类的可见性修饰符是默认的，那么即使是类的公共成员也只在包内可见。\n\n### 访问修饰符\n\
  \n![](img/image01230.jpeg)\n\n### JAR 文件（Java 归档文件）\n\n为了压缩文件，我们使用某些如 winzip 的程序。JAR\
  \ 文件有以下选项：\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `c` | 创建一个新的归档。 |\n| `C` | 执行期间更改目录。\
  \ |\n| `f` | 列表的第一个元素是待创建的归档名称。 |\n| `i` | 应提供索引信息。 |\n| `m` | 列表的第二个元素是外部清单文件（manifest）名称。\
  \ |\n| `M` | 不创建清单文件。 |\n| `t` | 应列出归档内容。 |\n| `u` | 更新现有文件。 |\n| `v` | 执行时详细输出。\
  \ |\n| `x` | 从归档中提取的文件。 |\n| `o` | 不使用压缩。 |\n\n创建 JAR 文件：\n```\njar -cf Myjar.jar\
  \ pack1\n```\n这将创建一个包含 `pack1` 所有文件的 `Myjar.jar` 文件。\n\n提取 JAR 文件：\n此命令用于提取归档文件（如解压）\n\
  ```\njar -xf Myjar.jar\n```\n\n列出 JAR 文件内容：\n以下命令列出 `Myjar.jar` 的内容。\n```\njar -tf\
  \ Myjar.jar\n```\n\n更新现有 JAR 文件：\n以下命令用于更新文件。\n```\njar -uf Myjar.jar pack1\n```\n\
  \n创建可执行 JAR 文件：\n```\njar -cmf mainClass Myjar.jar pack1\n```\n其中 `mainClass` 是一个保存在\
  \ `javaprg` 文件夹中的文本文件，包含 `Main-Class: pack1.pack2.pack3.A`。\n\n执行 JAR 文件：\n```\n\
  java –jar Myjar.jar\n```\n\n### 题\n\n1. 什么是包？\n2. 解释所有的修饰符及其在不同包、子包、子类及其他类中的作用域。\n\
  3. JAR 文件有什么用？\n4. `import` 语句的作用是什么？\n\n# 第 9 章（接口）\n\n### 简介\n\n接口基本上是类的一种。和类一样，接口包含方法和变量，但有一个主要的区别。区别在于接口只定义抽象方法和\
  \ final 变量（常量）。这意味着接口不编写任何代码来这些这些方法，且字段只包含常量。\n\n\n\n\n因此，类的职责是实现一个接口，以定义这些方法的实现代码。接口在语法上与类相似，但它们缺少实例变量，且其方法在声明时不包含方法体。在实践中，这意味着我们可以定义接口，而不对它们的实现方式做任何假设。接口的目的是将类的接口与它的实现分开。接口仅仅定义了类必须做什么，而没有对实现进行任何说明。接口只定义方法签名，不包含任何实例变量。\n\
  \n嵌套接口是指任何声明出现在另一个类或接口体内的接口。顶层接口是指不是嵌套接口的接口。定义接口的语法与定义类非常相似。接口定义的通用形式如下：\n\n```java\n\
  interface interface_name {\n    variable declarations;\n    methods declarations;\n\
  }\n```\n\n在这里，`interface` 是关键字，`interface_name` 是任何有效的 Java 标识符（就像类名一样）。\n\n**注意：**\
  \ 当我们定义一个接口时，默认情况下它是 `public` 且 `abstract` 的。\n\n### 接口修饰符\n用于顶层接口的唯一修饰符是 `abstract`\
  \ 和 `public`。即使我们不使用 `abstract` 修饰符，接口也会隐式地声明为 `abstract`，因此不需要使用 `abstract` 修饰符。顶层接口的可见性可以是\
  \ `package` 或 `public`，就像顶层类一样。如果没有使用可见性修饰符，则接口的可见性被假设为 `package`。\n\n### 数据变量成员声明\n\
  接口中只能定义常量。接口中的所有变量都隐式地为 `public`、`final` 和 `static`，这意味着它们不能被实现类修改。它们还必须用常量值初始化。\n\
  \n```java\npublic static final type variable_name=value;\n```\n\n在接口中声明的变量是 `public`、`static`\
  \  `final`。这意味着它是一个具有公共访问权限的静态变量。该变量也被声明为 `final`，这意味着它必须在声明时赋值，并且之后不能再修改。关键字 `final`\
  \ 类似于 C/C++ 中的 `const`。\n\n### 方法声明\n方法声明将仅包含方法列表，而不包含任何方法语句。它们在参数列表后以分号结束。它们本质上是抽象方法，接口中指定的任何方法都不能有默认实现。\n\
  \n接口中的所有方法默认始终是 `public` 和 `abstract` 修饰符。我们不能在接口中声明静态方法。\n\n```java\npublic abstract\
  \ return_type method_name(parameter_list);\n```\n\n这是一个包含两个变量和一个方法的接口定义示例。\n\n```java\n\
  interface item {\n    static final int code = 1001;\n    static final String name\
  \ = \"Matrix\";\n    abstract void display();\n}\n```\n\n**注意：** 方法代码不包含在接口中，方法声明简单地以分号结束。\n\
  \n另一个接口的示例：\n\n```java\ninterface area {\n    float pi = 3.14f;\n    float compute(float\
  \ x, float y);\n    void show();\n}\n```\n\n#### 扩展接口\n像类一样，接口也可以被扩展，即一个接口可以从其他接口派生。新接口将以类似于子类的方式继承子接口的所有成员。这通过使用\
  \ `extends` 关键字来实现，如下所示：\n\n```java\ninterface interface_1 {\n    int code = 1001;\n\
  \    String name = \"Matrix\";\n}\n\ninterface interface_2 extends interface_1 {\n\
  \    void display();\n}\n```\n\n`interface_2` 将继承其中的常量 `code` 和 `name`。\n\n**注意：**\
  \ 变量 `name` 和 `code` 是像普通变量一样声明的。这在这里是允许的，但接口中的所有变量都被视为常量。接口中的变量默认是 `public` & `static`，尽管这里没有\
  \ `public`、`static` 和 `final` 关键字。\n\n我们可以在单个接口中组合多个接口。以下声明是有效的：\n\n```java\ninterface\
  \ interface_1 {\n    int code = 1001;\n    String name = \"Matrix\";\n}\n\ninterface\
  \ interface_2 {\n    void display();\n}\n\ninterface interface_3 extends interface_1,\
  \ interface_2 {\n}\n```\n\n**注意：** 始终记住接口不能扩展类。这将违反接口只能有抽象方法和常量的规则。\n\n### 实现接口\n\
  接口作为“超类”，其属性被类继承。因此，必须创建一个继承给定接口的类。一旦定义了接口，一个或多个类就可以该接口。\n\n要实现接口，需要在类定义中包含 `implements`\
  \ 子句，然后创建接口声明的方法。实现类必须为所有接口中的所有方法提供主体，否则它必须被声明为抽象类。实现类也可以扩展类并实现多个接口。\n\n```java\n\
  class class-name implements interface-name {\n    // body\n}\n```\n\nJava 不支持多继承继承，但支持多接口继承，即一个类可以实现多个接口，如下所示：\n\
  \n```java\nclass class-name implements interface-1, interface-2, .... interface-n\
  \ {\n    // body\n}\n```\n\n**注意：** 当我们实现接口方法时，必须将其声明为 `public`。实现接口方法类似于重写，因此我们不能降低可见性。\n\
  \n**示例 9.1**\n```java\ninterface interface_1 {\n    void show(int x);\n}\n\nclass\
  \ class_1 implements interface_1 {\n    public void show(int x) {\n    }\n}\n```\n\
  \n**抽象类的示例 9.2**\n```java\ninterface common {\n    void push(int x);\n    int pop();\n\
  }\n\nabstract class stack implements common {\n    abstract void disp();\n}\n```\n\
  \n\n\n\n在这里，`stack` 类没有实现 `push()` 和 `pop()` 方法。因此，我们必须将 `stack` 类声明为抽象类，这种技术被称为部分实现。\n\
  \n## 接口继承的不同形式：\n\n(a)\n![](img/image01232.jpeg)\n(单级接口继承)\n\n(b)\n![](img/image01233.jpeg)\n\
  (多级接口继承)\n\n(c)\n![](img/image01234.jpeg)\n(层级接口继承)\n\n(d)\n![](img/image01235.jpeg)\n\
  (混合接口继承)\n\n## 通过接口引用访问实现类对象\n\n我们可以将变量声明为使用接口而非类类型的对象引用。任何实现所声明接口的类的实例都可以通过此类变量进行引用。当我们通过这些引用之一调用方法时，将根据所引用的接口的实际实例来调用正确的版本。\n\
  \n这是接口的重要特性之一。要执行的方法将在运行时动态查找，这允许类在调用其方法的代码之后再创建。调用代码可以通过接口进行分发，而无需了解任何“被调用者”的细节。这一过程类似于使用父类引用来访问子类对象。\n\
  \n由于运行时动态查找方法与 Java 中的普通方法调用相比会产生巨大的开销，因此在性能关键的代码中，我们注意不要随意使用接口。\n\n### 示例 9.3\n\
  \n```java\ninterface Math_function {\n    void display(int x);\n}\n\nclass Sqrt\
  \ implements Math_function {\n    public void display(int x) {\n        System.out.println(\"\
  sqrt of x =\"+Math.sqrt(x));\n    }\n}\n\nclass Log implements Math_function {\n\
  \    public void display(int x) {\n        System.out.println(\"log of x \"+Math.log(x));\n\
  \    }\n}\n\nclass Math_Demo {\n    public static void main(String args[]) {\n \
  \       Math_function f1 = new Sqrt();\n        Math_function f2 = new Log();\n\
  \        f1.display(27);\n        f2.display(3);\n        Math_function f3;\n  \
  \      f3 = f1; // 多态（赋值引用）\n        f3.display(30);\n        f3 = f2; // 多态（赋值引用）\n\
  \        f3.display(5);\n    }\n}\n```\n输出：![](img/image01236.jpeg)\n\n### 接口的特点\n\
  \n- Interface 是一个关键字。\n- 接口可以声明为抽象的，但它默认就是抽象的，因此无需添加 abstract 关键字。\n- 所有变量始终是 static\
  \ 且 final 的。\n- 接口的所有方法必须在类中实现。\n- 实现类实现的所有方法必须是 public 的。\n- 接口仅包含方法的声明。\n- 接口方法不能声明为\
  \ static。它们始终被声明为实例方法。\n- 类既不能收窄接口方法的访问权限，也不能在方法子句中指定新的异常；因为尝试这样做等同于更改了接口，这是非法的。重写方法的标准也适用于实现接口方法。\n\
  - 所有方法在实现类中均需要定义为 public。\n- 这里通过 abstract 关键字允许部分实现。\n- 无论类直接或间接实现了多少接口，对于可能在接口中有多个声明的方法，它只提供一个单一的实现。\n\
  - 方法原型声明也可以像类一样进行重载。\n- 接口常量可以通过任何客户端（类或接口）使用其完全限定名来访问，无论客户端是否扩展或实现了该接口。然而，如果客户端是实现此接口的类或扩展此接口的接口，则客户端也可以直接访问此类常量，而无需使用完全限定名。此类客户端继承了接口常量。\n\
  - 在接口常量多重继承的情况下，任何名称冲突都可以使用相关常量的完全限定名来解决。\n\n### 接口变量\n\n接口中的所有变量始终是 public static\
  \  final 的，因为它们是实现类访问数据类型和方法的公共部分。\n\n### 接口变量的内存管理\n\n静态变量在程序加载时总是获取内存，它们占用独立的内存，不与任何对象的内存共享。它们也被称为常量变量。可以使用接口名和\
  \ `.` 运算符直接访问。\n\n### 示例 9.4\n\n```java\ninterface Static_Var {\n    int sun=1;\n\
  \    int mon=2;\n    int tues=3;\n    int wed=4;\n    int thurs=5;\n    int fri=6;\n\
  \    int sat=7;\n}\n\nclass Week_Day implements Static_Var {\n    public static\
  \ void main(String args[]) {\n        System.out.println(sun);\n        System.out.println(mon);\n\
  \        System.out.println(tues);\n        System.out.println(wed);\n        System.out.println(thurs);\n\
  \        System.out.println(fri);\n        System.out.println(sat);\n    }\n}\n\
  ```\n\n\n\n\n\n```java\nSystem.out.println(Static_Var.thurs);\nSystem.out.println(Static_Var.fri);\n\
  System.out.println(Static_Var.sat);\n```\n\n输出: 1\n2\n3\n4\n5\n6\n7\n\n### 示例 9.5\n\
  \n```java\ninterface Two_Methods {\n    void m1();\n    void m2();\n}\n\nclass Three_Methods\
  \ implements Two_methods {\n    public void m1() {\n        // body of the m1;\n\
  \    }\n    public void m2() {\n        // body of the m2;\n    }\n    public void\
  \ m3() {\n        // body of the m3;\n    }\n}\n\nclass Methods_Demo {\n    public\
  \ static void main(String args[]) {\n        Two_methods tm1 = new Three_methods();\n\
  \        tm1.m1();\n        tm1.m2();\n        // tm1.m3(); error\n        Three_Methods\
  \ tm2 = new Three_Methods();\n        tm3.m3(); // 注意：原文写的是 tm3，但根据上下文推断应该是 tm2\n\
  \    }\n}\n```\n\n注意：在这里我们无法使用接口引用调用 `m3()`，因为该方法没有在接口中声明。因此，接口引用只能访问在类块中声明的方法。否则，我们可以调用相同对象或扩展对象。\n\
  \n### 示例 9.6\n\n```java\ninterface Two_Methods {\n    void m1();\n    void m2();\n\
  }\n\ninterface One_Method extends Two_Methods {\n    void m3();\n}\n\nclass Three_Methods\
  \ implements One_methods {\n    public void m1() {\n        // body of the m1;\n\
  \    }\n    public void m2() {\n        // body of the m2;\n    }\n    public void\
  \ m3() {\n        // body of the m3;\n    }\n}\n\nclass Methods_Demo {\n    public\
  \ static void main(String args[]) {\n        Three_methods tm1 = new Three_methods();\n\
  \        tm1.m1();\n        tm1.m2();\n        tm1.m3();\n    }\n}\n```\n\n### 接口方法\n\
  \n当任何类实现接口，并在类中定义了接口中未声明的方法时，我们可以说这些额外方法是非接口方法。\n\n```java\ninterface Two_Methods\
  \ {\n    void push(int x);\n    int pop();\n}\n\nclass Stack implements Two_Methods\
  \ {\n    int arr[] = new int[5];\n    int top = -1;\n\n    public void push(int\
  \ item) {\n        if (top == 4) {\n            System.out.println(\"Overflow\"\
  );\n            return;\n        }\n        top++;\n        arr[top] = item;\n \
  \   }\n\n    public int pop() {\n        if (top == -1) {\n            System.out.println(\"\
  Underflow\");\n            return -1;\n        }\n        int item = arr[top];\n\
  \        top--;\n        return (item);\n    }\n\n    void disp() {\n        for\
  \ (int i = top; i >= 0; i--) {\n            System.out.println(arr[i]);\n      \
  \  }\n    }\n}\n\nclass Stack_Demo {\n    public static void main(String args[])\
  \ {\n        Stack s1 = new Stack();\n        s1.pop();\n        for (int i = 0;\
  \ i < 5; i++) {\n            s1.push(i + 100);\n        }\n        s1.push(60);\n\
  \        System.out.println(\"----Display Item----\");\n        s1.disp();\n   \
  \     System.out.println(\"----Removing Items----\");\n        for (int i = 0; i\
  \ < 5; i++) {\n            System.out.println(s1.pop());\n        }\n    }\n}\n\
  ```\n\n\n\n\n\n![STAR-LOGO-2013](img/image01215.jpeg)\n\n# 第 ∞ 10 章\n## String 和\
  \ StringBuffer\n\n### 简介\n在 Java 中，`String` 是类对象，通过两个类来实现的，即 `String` 和 `StringBuffer`。与\
  \ C 语言字符串相比，Java 的 `String` 更可靠且可预测。这基本上是因为 C 语言缺乏边界检查。Java 的 `String` 并不是字符数组，也不是以\
  \ NULL 结尾的。通常情况下，Java 不允许将运算符应用到 `String` 对象上。\n\n该规则的唯一例外是 `+` 和 `+=` 运算符，它们会连接两个字符串并产生一个\
  \ `String` 对象。在 Java 中，字符数组不被视为字符串。Java 的 `String` 类用于执行所有的字符串操作。`String` 类和 `StringBuffer`\
  \ 类是 `java.lang` 包的一部分。\n\n### String 类\n```java\nString s1 = new String(\"matrix\"\
  );\nString s2 = \"matrix\";\nSystem.out.println(s1);\nSystem.out.println(s1.length);\n\
  System.out.println(\"matrix\".length);\n```\n\n`String` 在 Java 中具有以下特性：\n\n####\
  \ [i] String 在 Java 中是一个对象\n`String` 代表一个字符序列，但与许多将 String 实现为字符数组的语言不同，Java 将字符串实现为\
  \ `string` 类型的对象。\n\n字符串操作是许多 Java 程序中常见的常见的部分。将字符串实现为内置对象允许 Java 提供全套的特性，使字符串处理变得非常方便。此外，字符串对象可以通过多种方式构造，以便在需要时轻松地获取字符串。\n\
  \n#### [ii] String 是不可变的\n`String` 是不可变的，也就是说我们不能在创建后更改字符串。但是，声明为 `String` 引用的变量可以随时更改指向其他字符串对象。\n\
  \n我们仍然可以执行所有类型的字符串操作。每当我们需要一个现有字符串的修改版本时，都会创建一个新的字符串对象，其中包含了修改内容。\n\n原始字符串保持不变。使用这种方法是因为固定的、不可变的字符串比可更改的字符串实现得更高效。\n\
  \n对于那些需要修改字符串的情况，有一个名为 `StringBuffer` 的伴生类，其对象包含的字符串在创建后是可以被修改的。\n\n#### [iii] String\
  \ 类是 final 的\n`String` 和 `StringBuffer` 类都是 `final` 的。这意味着我们不能在任何类中扩展 `String` 类。这允许某些优化来提高常用字符串操作的性能。\n\
  \n### String 类的构造函数与方法\n\n| # | 方法 |  |\n| :--- | :--- | :--- |\n| 1 | `public String()`\
  \ | 初始化新创建的 `String` 对象，使其表示空字符序列。`String s1 = new String();` |\n| 2 | `public String(String\
  \ str)` | 初始化新创建的 `String` 对象，使其与参数相同的相同的序列；换句话说，新创建的字符串是参数字符串的拷贝。`String s1 = new\
  \ String(\"Matrix\"); String s2 = new String(s1);` 字符串 `s2` 是字符串 `s1` 的拷贝。虽然内容相同，但\
