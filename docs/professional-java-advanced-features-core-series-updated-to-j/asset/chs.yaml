  \n### 示例 6.2\n```java\nclass A {\n    int x;\n    void set(int x1) {\n        x\
  \ = x1;\n    }\n    void display() {\n        System.out.println(x);\n    }\n}\n\
  class B extends A {\n    int y;\n    void set(int x1,int y1) //类 B 的 set 方法没有重写类\
  \ A 的 set 方法\n    // 因为参数不同\n    {\n        set(x1);  //将调用类 A 的 set()\n       \
  \ y = y1;\n    }\n    void display() //类 B 的 display 方法重写了类 A 的方法\n    {\n     \
  \   display();  这将调用 B 的 display\n        super.display(); //这将显示类 A 的 display\n\
  \        System.out.println(y);\n    }\n}\nclass Inherit2 {\n    public static void\
  \ main(String args[]) {\n        B b1 = new B();\n        b1.set(10,20);\n     \
  \   b1.display();\n    }\n}\n```\n输出:\n```\n10\n20\n```\n\nJava 支持以下继承形式：\n[1] 单继承继承。\n\
  [2] 多级继承。\n[3] 层级继承。\n\n![](img/image0125.jpeg)\n\n### 示例 6.3\n```java\nclass A\
  \ {\n    private int x;\n    A() {\n        x = 0;\n    }\n    A(int x1) {\n   \
  \     x = x1;\n    }\n    void display() {\n        System.out.print(x);\n    }\n\
  }\nclass B extends A {\n    private int y;\n    B() {\n        super();\n      \
  \  //x=0;  错误，因为 x 是私有的\n        y=0;\n    }\n    B(int x1, int y1) {\n        super(x1);\n\
  \        // x = x1; 错误，因为 x 是私有的\n        y = y1;\n    }\n    void display() {\n\
  \        super.display();\n        System.out.print(y);\n    }\n}\nclass Inherit3\
  \ {\n    public static void main(String args[]) {\n        B b1 = new B();\n   \
  \     b1.display();\n        B b2 = new B(10,20);\n        b2.display();\n    }\n\
  }\n```\n输出:\n```\n001020\n```\n\n[2] 多级继承。\n\n![](img/image0126.jpeg)\n\n![C:\\\
