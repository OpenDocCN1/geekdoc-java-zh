  \ Short.parseShort(str);\n        System.out.println(s);\n        int i = Integer.parseInt(str);\n\
  \        System.out.println(i);\n        long l = Long.parseLong(str);\n       \
  \ System.out.println(l);\n        float f = Float.parseFloat(str2);\n        System.out.println(f);\n\
  \        double d = Double.parseDouble(str2);\n        System.out.println(d);\n\
  \    }\n}\n```\n\n\n\n\n\n# Byte 类\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `static Byte\
  \ decode(String nm)` | 返回一个包含字符串 `nm` 所指定值的 `Byte` 对象。接受由以下语法给出的十进制、十六进制和八进制数：`DecodableString:[-]\
  \ DecimalNumerical[-] 0x HexDigits[-] 0X HexDigits[-] # HexDigits[-] 0 OctalDigits`\
  \ |\n| `boolean equals(Object obj)` | 将此（this）对象与指定的指定的 `obj` 对象进行比较。 |\n| `int\
  \ hashCode()` | 返回此 `Byte` 的哈希码。 |\n\n## Short 类中的其他方法\n\n`Short` 类中的方法与 `Byte`\
  \ 类的方法相同，只是在上述表格中使用 `short` 和 `Short` 单词代替了 `byte` 和 `Byte` 单词。\n\n## Integer 类中的其他方法\n\
  \n某些方法与 `Byte` 或 `Short` 类的方法相同。其他方法描述如下：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `static\
  \ String toBinaryString(int i)` | 返回整数参数 `i` 作为无符号 2 进制整数的字符串表示。 |\n| `static String\
  \ toHexString(int i)` | 返回整数参数 `i` 作为无符号 16 进制整数的字符串表示。 |\n| `static String toOctalString(int\
  \ i)` | 返回整数参数 `i` 作为无符号 8 进制整数的字符串表示。 |\n\n## Long 类中的其他方法\n\n`Long` 类中的方法几乎与 `Integer`\
  \ 类的方法相同。\n\n# Character 类\n\n字符类将原始类型 `char` 的值封装在对象中。\n\n#### 构造函数\n\n```\nCharacter(char\
  \ value)\n```\n\n构造一个表示指定 `char` 值的新分配 `Character` 对象。\n\n示例：`Character chObj =\
  \ new Character('A');`\n\n#### 方法\n\n`Character` 类的一些方法描述在下表中：\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `char charValue()` | 返回此 `Character` 对象的值。 |\n| `static boolean\
  \ isDefined(char ch)` | 判断指定的字符是否在 Unicode 中定义。 |\n| `static boolean isDigit(char\
  \ ch)` | 判断指定的字符是否为数字。 |\n| `static boolean isJavaIdentifierPart(char ch)` | 判断指定的字符可以作为\
  \ Java 标识符的一部分（首字符外）。 |\n| `static boolean isJavaIdentifierStart(char ch)` | 判断指定的字符是否允许作为\
  \ Java 标识符的首字符。 |\n| `static boolean isLetter(char ch)` | 判断指定的字符是否为字母。 |\n| `static\
  \ boolean isLetterorDigit(char ch)` | 判断指定的字符是否为字母或数字。 |\n| `static boolean isLowerCase(char\
  \ ch)` | 判断指定的字符是否为小写字母。 |\n| `static boolean isSpaceChar(char ch)` | 判断指定的字符是否为\
  \ Unicode 空格字符。 |\n| `static boolean isTitleCase(char ch)` | 判断指定的字符是否为标题大小字母。 |\n\
  | `static boolean isUpperCase(char ch)` | 判断指定的字符是否为大写字母。 |\n| `static boolean isWhitespace(char\
  \ ch)` | 根据 Java 判断指定的字符是否为空白字符。 |\n| `static char toLowerCase(char ch)` | 将字符参数转换为小写。\
  \ |\n| `static char toUpperCase(char ch)` | 将字符参数转换为大写。 |\n| `static char toTitleCase(char\
  \ ch)` | 将字符参数转换为标题大小。 |\n| `int compareTo(Character anotherCharacter)` | 数值上比较两个\
  \ `Character` 对象。 |\n| `int hashcode()` | 返回此 `Character` 的哈希码。 |\n| `boolean equals(Object\
  \ obj)` | 将此（this）对象与指定的 `obj` 进行比较。 |\n\n# Boolean 类\n\n`Boolean` 类将原始类型 `Boolean`\
  \ 的值封装在对象中。\n\n#### 构造函数\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n| `Boolean(Boolean value)`\
  \ | 分配一个表示值参数的 `Boolean` 对象。 |\n| `Boolean(String s)` | 如果字符串参数 `s` 不且忽略大小写等于字符串“true”，则分配一个表示值\
  \ `true` 的 `Boolean` 对象。 |\n\n## Boolean 类的方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n\
  | `boolean booleanValue()` | 返回此 `Boolean` 对象的 `Boolean` 原始类型值。 |\n| `int compareTo(Boolean\
  \ b)` | 比较此 Boolean 实例与另一个。 |\n| `boolean equals(Object obj)` | 当且仅当参数不空且是一个与此表示相同布尔值的\
  \ `Boolean` 对象时，返回 `true`。 |\n| `static Boolean getBoolean(String name)` | 当且仅当由参数\
  \ `name` 命名的系统属性存在且等于字符串“true”时，返回 `true`。 |\n| `int hashCode()` | 返回此 `Boolean`\
  \ 对象的哈希码。 |\n| `static boolean parseBoolean(String s)` | 将字符串参数 `s` 解析为布尔。 |\n|\
  \ `String toString()` | 返回表示此 `Boolean` 值的 `String` 对象。 |\n| `static String toString(boolean\
  \ b)` | 返回表示指定布值的 `String` 对象。 |\n| `static Boolean valueOf(boolean b)` | 返回表示指定布尔值的\
  \ `Boolean` 实例。 |\n| `static Boolean valueOf(String s)` | 返回表示指定布尔值的 `Boolean`。\
