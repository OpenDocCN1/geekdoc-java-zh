  \ |\n\n### 数据类型\n\nJava 中的数据类型可以大致分为两类：\n\n1. 基本数据类型/ 简单类型\n\nJava 是一门面向对象的语言，但基本数据类型不是对象。出于性能考虑被保留了下来。它们是我们定义的其他类型的基础。Java\
