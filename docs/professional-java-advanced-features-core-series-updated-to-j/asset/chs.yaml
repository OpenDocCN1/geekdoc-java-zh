  display() of Circle\ngetdata() of Rectangle\narea() of Rectangle\ndisplay() of Rectangle\n\
  ```\n\n## 抽象类与抽象方法\n\n我们已经看到，通过将方法标记为 `final`，我们可以确保该方法在子类中不被重定义。Java 允许我们做与其完全相反的操作。即，我们可以指示某个方法必须在子类中被重定义，从而使重写成为强制性。这是通过在方法定义中使用关键字\
  \ `abstract` 实现的。\n\n在某些情况下，我们希望定义一个只声明结构而不提供完整实现的父类。也就是说，有时我们希望创建一个仅定义所有子类共享的通用形式的父类。这种类决定了子类的性质。这种情况可能发生在父类无法创建有意义的实现时。要声明一个抽象方法，请使用这种通用形式：`abstract\
  \ return_type name(parameter-list)`；包含一个或多个抽象方法的类也必须是抽象类。要声明抽象类，只需在类名前使用 `abstract`\
  \ 关键字。抽象类不能有对象。也就是说，不能使用 `new` 操作符直接实例化抽象类。这样的对象是无用的，因为抽象类没有被完全定义。此外，我们不能声明抽象构造函数。抽象类的任何子类必须实现所有的抽象方法，或者被声明为抽象类。\n\
  \n**Example 6.6**\n\n```java\nabstract class Shape {\n    abstract void getdata();\n\
  \    abstract void area();\n    abstract void display();\n}\n\nclass Circle extends\
  \ Shape {\n    void getdata() {\n        System.out.println(\"getdata() of Circle\"\
  );\n    }\n    void area() {\n        System.out.println(\"area() of Circle\");\n\
  \    }\n}\n```\n\n\n\n\n\n```java\n    void display() {\n        System.out.println(\"\
  display() of Circle\");\n    }\n}\n\nclass Rectangle extends Shape {\n    void getdata()\
  \ {\n        System.out.println(\"getdata() of Rectangle\");\n    }\n    void area()\
  \ {\n        System.out.println(\"area() of Rectangle\");\n    }\n    void display()\
  \ {\n        System.out.println(\"display() of Rectangle\");\n    }\n}\n\nclass\
  \ InheritTest6 {\n    public static void main(String args[]) {\n        //父引用变量接受子类对象\n\
  \        //动态绑定\n        Shape s[]={new Circle(), new Rectangle()};\n        for(int\
  \ i=0; i<s.length; i++) {\n            s[i].getdata();\n            s[i].area();\n\
  \            s[i].display();\n        }\n    }\n}\n```\nOutput:\n```\ngetdata()\
  \ of Circle\narea() of Circle\ndisplay() of Circle\ngetdata() of Rectangle\narea()\
  \ of Rectangle\ndisplay() of Rectangle\n```\n\n### Final 方法 (Final method)\n如果我们不希望一个方法被派生类重写，可以将基类方法定义为\
  \ `final`。任何重写该方法的尝试都会导致编译错误。\n\n```java\nclass A {\n    final void method1() {\n\
  \    }\n}\n\nclass B extends A {\n    void method1() // 错误\n}\n```\n\n### Final\
  \ 类 (Final class)\n有时出于安全考虑，我们希望防止一个类被进一步子类。不能被子类的类被称为 `final` 类。在 Java 中通过使用 `final`\
  \ 关键字来实现：\n\n```java\nfinal class A1 {\n}\n```\n任何继承 `A` 的尝试都会导致错误，编译器将不允许这样做。\n\
  \n### 理论题 (Theory Questions)\n1. 什么是继承？\n2. Java 中有多少种继承类型？\n3. 默认构造函数和参数化构造函数有什么区别？\n\
  4. `final` 类和 `final` 方法有什么区别？\n5. 什么是超类？\n6. 什么是抽象类？\n7. 编译时绑定和运行时绑定有什么区别？\n8.\
  \ 方法重载和方法重写有什么区别？\n\n### 绪言 (Introduction)\n#### 面向对象编程 vs 过程化编程\n所有程序由两个元素组成：过程（逻辑）和数据。取决于主要关注点是处理还是数据，可以有两种不同的方法。过程化语言（`c`、`FORTRAN`、`PASCAL`、`COBOL`\
  \ 等）侧重于处理部分，即它们更重视“发生了什么”（过程），而较少重视“谁受到了影响”（数据）。\n\n随着程序变得庞大且复杂，过程化方法变得越来越不再适用。面向对象的编程语言的开发是为了克服过程化编程语言的局限性。与过程化语言中的类似程序相比，面向对象的编程语言的复杂度相对低得多。面向对象的程序围绕数据（即对象）以及一组针对该数据的定义接口组织。\n\
  \nJava 是基于面向对象范式的。Java 几乎是一门面向对象的语言。我们使用“几乎”一词是因为出于性能考虑，Java 也支持基本数据数据类型。`C++` 不是纯的面向对象语言。`C++`\
  \ 是 `C` 的扩展，因此它使用了一种混合了面向过程方法和面向对象方法的方法。\n\n这两种方法的基本区别总结如下：\n(i) 面向对象的程序是以数据为中心的，而过程化语言编写的程序是以过程为中心的。\n\
  (ii) 面向对象的程序围绕数据（对象）组织，因此它们能更好地模拟现实世界中的对象。\n(iii) 与过程化方法相比，面向对象方法的代码重用性和扩展性非常高。因此代码量更小。\n\
  (iv) 面向对象的程序更容易维护，因为它们的相对复杂度较低，且尺寸较小。\n(v) 面向对象的程序基于自底向上的设计方法，而过程化程序基于自顶向下的设计方法。\n\
  \n### OOP（面向对象编程）的基本概念\n下面提了面向对象编程的一些基本元素：\n- 抽象 (Abstraction)\n- 对象和类 (Objects\
  \ and classes)\n- 三大 OOP 原则\n    - 封装 (Encapsulation)\n    - 继承 (Inheritance)\n\
  \    - 多态 (Polymorphism)\n- 持久化 (Persistence)\n- 通用性 (Genericity)\n- 组合 / 聚合 (Composition\
  \ / Aggregation)\n\n#### 1. 抽象 (Abstraction)\n抽象包括过程化语言在内的任何编程语言的基本元素之一。内置数据类型的概念也是一种抽象。在\
  \ `C` 语言中使用 `struct` 定义自定义数据类型的特征进一步扩展了这种抽象。\n\n抽象的主要目的是通过隐藏细节来降低复杂性。例如，一个建筑不被认为是建筑材料的集合，而是一个具有独特特征和属性的定义良好的对象。\n\
  \n抽象可以定义为识别对象的本质属性和行为，而不涉及细节。对象的属性和行为将其与其他相似的对象区分开来，并有助于对对象进行分类/分组。面向对象的编程语言使用类和对象来建模抽象。\n\
  \n#### 2. 对象和类 (Object and Classes)\n**对象 (Object)**：对象是一个物理或抽象实体或事物，可以与其他相似的对象区分开来。对象具有三个特征：\n\
  (i) 标识性 (Identification)。\n(ii) 属性 (Properties)。\n(iii) 行为 (Beiors / Operations\
  \ / Functions)。\n对象也可以被视为类的实例，其中 `class` 类似于内置数据类型，而对象是变量。\n\n**类 (Class)**：类通过抽象化对象的属性和行为来表示一类对象。类可以被视为创建对象的蓝图。对象具有由其类定义的属性和行为。类可以被视为用户定义的数据类型，而对象是该类所表示数据类型的变量/实例。\n\
  \n\n\n\n\n类也可以被视为一种用户定义的数据类型，而对象是该数据类型的一个变量。一旦定义了类，我们就可以创建任意数量属于该类的对象。\n\n## 3.\
  \ 三大 OOP 原则\n\n### 封装 (Encapsulation)\n封装是将代码及其所操作的数据绑定在一起的机制。`Java` 类支持这种机制，因为它们允许我们将代码和数据定义在一起。封装还通过将某些类成员声明为\
  \ `private` 来帮助实现数据隐藏，使得不属于该类的代码无法访问这些成员。\n\n### 继承 (Inheritance)\n在面向对象编程中，继承指的是一个类的属性可以被被称为子类或派生类的类使用。子类或派生类是从现有类派生出来的类。它继承了现有类的所有特征，现有类也被称为基类或超类。因此，继承可以定义为从超类或基类派生类的过程。继承一个类不会给基类/超类引入任何变化。与基类相比，派生类/子类具有更多的属性和行为。\n\
  \n继承的主要优势是代码重用。如果基类已经使用了长时间，并且需要添加一些额外的属性和方法，我们可以通过派生另一个类来实现。派生类将可以使用基类的代码而无需重新调试，因为它已经使用了很长时间。\n\
  \n### 类层次结构 (Class Hierarchy)\n所有派生自同一个基类的类都属于一个家族并形成一个类层次结构。类层次结构可以与树形结构相比，其中一个基类位于根节点且没有超类。\n\
  \n所有其他类要么派生自层次结构根节点的类，要么派生自另一个直接或间接派生自根类的类。随着树向下移动，的功能越来越多。叶节点表示的类没有子类。下面的示例展示了一些类层次结构。\n\
  \n![](img/image01229.jpeg)\n\n### 多态 (Polymorphism)\n多态是一种允许同一接口用于一组通用动作的功能。大多数面向对象的语言在以下情况使用多态：\n\
  * 运算符重载 (Operator Overloading)。\n* 方法重载 (Method Overloading)。\n* 方法重写 (Method Overriding)。\n\
  \n#### 运算符重载\n大多数语言对内置操作使用这种形式的多态。例如，`C/C++` 或 `Java` 中的所有算术运算符都可以用于许多类型的操作数（`int`、`long`、`float`、`double`\
  \ 等）。因此，相同的加法运算符可以用于加两个整数以及加两个浮点数。\n\n`C++` 允许用户重载内置运算符。例如，我们可以重载算术运算符来处理复数。虽然 `Java`\
  \ 对内置运算符使用了运算符重载，但它不允许用户重载运算符。\n\n#### 方法重载\n此功能允许我们编写多个具有相同名称的方法。`C++` 和 `Java`\
  \ 都具有这一特征。同名的方法（`C++` 中的函数）根据参数（参数列表）进行区分。重载的方法必须具有不同的参数数量，或者如果参数数量相同，参数类型必须不同。\n\
  \n如果对重载方法的调用可以在编译时解析，即如果编译器可以决定调用哪一个重载方法，则被称为静态绑定，这是编译时多态的示例。\n\n如果对重载方法的调用在编译时无法解析，即如果编译器无法决定调用哪一个重载方法，则被称为动态绑定，这是运行时多态的示例。\n\
  \n通常，`Java` 在运行时解析对重载方法的调用，但在许多情况下，对重载方法的调用是在编译时解析的。\n\n#### 方法重写\nMethod Overriding\n\
  子类可以重写具有相同名称的方法。`Java` 通常使用动态绑定来解析重写方法。\n\n## 4. 持久化 (Persistence)\n某些面向对象的语言允许从持久化介质存储/检索对象，即像持久化介质这样的持久化介质。这被称为持久化。\n\
  \n`Java` 允许在运行时解析重写方法，但在许多情况下，重写方法的调用是在编译时解析的。\n\n如果基类已经使用了长时间，长时间类，由于基类已经使用了很长时间，at\
  \ the root of the tree，通过仅仅派生根节点来创建整个树结构。\n\n例如，使用此功能，通过仅仅派生根节点来创建整个树结构。在后续阶段，通过仅仅派生根节点来创建整个树结构。`C++`\
  \ 不支持这一功能。\n\n## 5. 泛型 (Genericity)\n独立于任何特定数据类型定义算法，然后将其应用于各种数据类型的概念被称为泛型。`C++`\
  \ 通过模板支持这一功能。`Java` 也通过位于类层次结构顶部的 `Object` 类支持这一功能。\n\n例如，使用此功能，我们可以实现一个泛型数据类型 `stack`，以便在栈中存储任何类型的元素。这一功能极大地提高了重用性。\n\
  \n## 6. 组合/聚合 (Composition / Aggregation)\n对象可能由其他对象组成。这样的对象被称为组合对象或聚合对象。例如，如果 `vehicle`\
  \ 类的对象被定义为由 `Engine`、`Body`、`Axle`、`Seats` 等对象组成的组合对象，将是合适的。\n\n从现有类派生新类有两种基本机制：继承和组合。`Bus`\
  \ 类可以通过继承 `vehicle` 属性来派生。在这里，`Bus` 是一种车辆，具有所有车辆共有的属性和行为。\n\n换句话说，`Bus` 类与 `vehicle`\
  \ 类之间存在 is 的关系，因为我们可以说 `Bus` 是一种车辆。\n\n`vehicle` 类本身可能通过组合派自许多其他类。例如，`vehicle` 类的对象可能由属于\
  \ `Engine`、`Gear Box`、`Seats`、`Driver’s Seat Body` 和 `Steering Wheel` 等类的对象组成。在这种情况下，派生类与代表组合对象的类之间存在整体与部分的关系。我们不能说车辆是一个\
  \ `Engine` 或车辆是一个 `Gear Box`，因为车辆是由许多部分组成的。\n\n# 超类与子类 (Super classes and Subclasses)\n\
  通常，一个类的对象也是另一个类的对象。矩形显然是四边形（正方形、平行四边形和梯形也是如此）。因此，`Rectangle` 类可以说继承自 `Quadrilateral`\
  \ 类。在这种语境下，`Quadrilateral` 是超类，而 `Rectangle` 是子类。\n\n矩形是四边形的一种类型，但声称四边形是矩形是错误的（四边形可能是平行四边形）。图展示了几个超类和潜在子类的简单继承示例。\n\
  \n\n\n\n\n# 继承与类层次结构\n\n然而，还有另一种看待这些术语的方式，这非常合理。因为每个子类对象“都是”其父类的对象，而且一个父类可以有多个子类，所以一个父类所代表的对象集合通常比该父类的任何子类所代表的对象集合要大。\n\
  \n例如，父类 `Vehicle` 以通用的方式表示所有车辆，如汽车、卡车、船只、自行车等。然而，子类 `Car` 仅代表了世界上所有 `Vehicles` 中的一小部分。继承关系形成了树状的层级结构。\n\
  \n父类与其子类之间存在层级关系。一个类完全可以独立存在，但只有当类配合继承机制使用时，它才会成为为其他类提供属性和行为的父类，或者成为继承这些属性和行为的子类。通常，一个类既是子类也是父类。\n\
  \n| 父类 | 子类 |\n| :--- | :--- |\n| Student | 研究生、本科生 |\n| Shape | 圆形、三角形、矩形 |\n|\
  \ Loan | 汽车贷款、住房贷款、教育贷款 |\n| Employee | 教职人员、行政人员 |\n| Account | 期账户、储蓄账户 |\n\n\
