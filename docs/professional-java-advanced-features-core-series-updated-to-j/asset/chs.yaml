  \ {\n        System.out.println(\"display() of Circle\");\n    }\n}\n\nclass Rectangle\
  \ extends Shape {\n    void getdata() {\n        System.out.println(\"getdata()\
  \ of Rectangle\");\n    }\n    void area() {\n        System.out.println(\"area()\
  \ of Rectangle\");\n    }\n    void display() {\n        System.out.println(\"display()\
  \ of Rectangle\");\n    }\n}\n\nclass InheritTest {\n    public static void main(String\
  \ args[]) {\n        //super 引用变量可以接受子类对象\n        //动态绑定\n        Shape s[]={new\
  \ Circle(), new Rectangle()};\n        for(int i=0;i<s.length;i++) {\n         \
