  ```\n输出: No. of Words=5\n\n![Images/image01215.jpeg)# 第 11 章：异常处理## 引言异常（Exception）是由程序中的运行时错误引起的条件，它会破坏程序的正常执行流。当\
  \ Java 解释器遇到如整数除以零之类的错误时，它会创建一个 `Exception` 对象并将其抛出（即通知我们发生了错误）。每当运行时发生异常时，Java\
  \ 异常/错误都是 `Exception` 类的对象或其子类之一。异常对象包含了有关异常的详细信息，可以使用为此目的提供的公共方法来访问这些信息。在某些旧语言中，我们必须使用\
  \ `if`、`goto` 和返回值来进行错误处理。异常是代码序列在运行时出现的一种异常状态。换句话说，异常就是运行时错误。在不支持异常处理的计算机语言中，必须手动检查并处理错误——通常通过使用错误代码等。这种方法既繁琐又麻烦。Java\
  \ 的异常处理避免了这些问题，并在过程中将运行时错误管理引入了面向对象的世界。## 异常处理基础 Java 异常是一个对象，描述了代码段中发生的异常（即错误）状态。当出现异常状态时，会产生一个代表该异常的对象，并在导致错误的方法中抛出它。该方法可以选择自己处理该异常，也可以将其传递下去。无论哪种方式，异常在某一点被捕获并处理。异常可以由\
  \ Java 运行时系统生成，也可以由你的代码手动生成。Java 抛出的异常与违反 Java 语言规则或 Java 执行环境限制的根本错误有关。手动生成的异常通常用于向方法的调用者报告某些错误状态。Java\
  \ 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws` 和 `finally`。简而言，它们的工作原理如下：你想要监控异常的程序语句包含在\
  \ `try` 块中。如果在 `try` 块内发生异常，异常就会被抛出。你的代码可以捕获此异常（使用 `catch`）并以某种方式处理它。系统生成的异常由 Java\
  \ 运行时自动抛出。要手动抛出异常，请使用关键字 `throw`。任何抛出方法的异常都必须由 `throws` 子句指定。任何在 `try` 完成后绝对必须执行的代码都放在\
  \ `finally` 块中。这是异常处理块的通用形式：```javatry {    // 待监控错误的代码块} catch (Exception ex) {\
  \    // 异常处理器} .........finally {    // 在 try 结束后要执行的代码块}```## 异常类型所有异常类型都是内置类 `Throwable`\
  \ 的子类。因此，`Throwable` 处于异常层次结构的顶端。紧邻 `Throwable` 之下有两个子类，它们将异常分为两个不同的分支。其中一个分支由 `Exception`\
  \ 引导。该类用于用户程序应该捕获的异常状态。你也将通过派生该类来创建自己的异常类型。`Exception` 有一个重要的子类，称为 `RuntimeException`。这种类型的异常会为你编写的程序自动定义，包括除以零和无效索引等情况。另一个分支由\
  \ `Error` 引导，它定义了在正常情况下预计不会被你的程序捕获的异常。`Error` 的异常用于 Java 运行时系统来表示与运行时环境本身相关的错误。`Stack\
  \ overflow` 是此类错误的一个示例。本章将不会处理 `Error` 类型的异常，因为这些通常是响应灾难性故障的，你的程序通常无法处理。顶层异常层次结构所示：![](img/image01237.jpeg)\n\
  \n### 示例 11.1\n```java\nclass ErrorTest1 {\n    public static void main(String args[])\
  \ {\n        int a=5, b=2, c=2, d;\n        d=a/(b-c); // 发生了 ArithmeticException(Divide\
  \ by zero)\n        System.out.println(d);\n        System.out.println(\"This not\
  \ be printed\");\n    }\n}\n```\n程序将终止除法且不再运行剩余语句。\n\n### 示例 1.2\n```java\nclass\
  \ A {\n    void display() {\n    }\n}\nclass ErrorTest2 {\n    public static void\
  \ main(String args[]) {\n        A a1=null;\n        a1.display(); // 发生了 NullPointerException\n\
  \    }\n}\n```\n在上面的程序中会发生 `NullPointerException`。引用变量没有用 `new` 初始化。在这种情况下程序也会终止。\n\
  \n### 示例 11.3\n```java\nclass ErrorTest3 {\n    public static void main(String args[])\
  \ {\n        int a[] = {10,20,30};\n        System.out.println(a[3]); // 发生了 ArrayIndexException\n\
  \    }\n}\n```\n在上述情况下，数组的长度为 3，索引从 0 到 2，所以如果我们打印 `a[3]`，那么这就是第 4 个元素，它不是有效的索引。这将产生一个异常错误。在\
  \ C/C++ 中这是允许的，但在 Java 中不允许。\n\n 注意\n\nJDK 7 增加了一种 `try` 语句的新形式，支持自动资源管理。这种新的 `try`\
  \ 形式称为 `try-with-resources`，在第 章结合管理文件的背景进行了描述，因为文件是最常用的资源之一。\n\n## 异常的其他情况\n\n\
  1. 我们尝试打开的文件可能不存在。\n2. 我们想要创建一个新对象但没有可用内存。\n3. 我们想要加载的类文件可能缺失或格式错误。\n4. 我们想要转换为数字的\
  \ `String` 包含无效字符，导致其无法转换为数字。\n\n如果异常对象没有被正确地捕获和处理，解释器将显示错误消息并终止程序。如果我们想继续执行剩余代码，那么我们应该尝试捕获由错误条件抛出的异常对象。\n\
  \n\n\n\n\n此任务被称为异常处理。异常处理机制的目的是提供一种检测和报告“异常情况”的手段，以便采取适当的。该机制建议引入一套独立的错误处理代码，用于执行以下任务：\n\
  \n1. 发现问题。（发生异常）\n2. 通知错误已发生。（抛出异常）\n3. 接收错误信息。（捕获异常）\n4. 采取修正措施。（处理异常）\n\nJava\
  \ 异常处理通过五个关键字管理：\n\n`try`、`catch`、`throw`、`throws` 和 `finally`。\n\n我们想要监控异常的程序语句包含在\
  \ `try` 块中，每当发生错误时，它就会被抛到 `catch` 块。我们的代码可以捕获此异常（使用 `catch`）并以某种合理的方式对其处理。系统生成的异常由\
  \ Java 运行时系统自动抛出。\n\n要手动抛出异常，请使用 `throw` 关键字。任何抛出方法的异常都必须通过 `throws` 子句进行说明。在方法返回之前必须执行的代码放在\
  \ `finally` 块中。\n\n即使 `try` 块中只有一个语句，也必须用大括号括起来。可以有一个或多个 `catch` 语句，以及零或一个 `finally`\
  \ 语句。`catch` 和 `finally` 块都是可选的，但一个 `catch` 块或一个 `finally` 块是必须的。\n\n`try` 块中的代码执行方式与其他任何\
  \ Java 代码相同。如果 `try` 块中的代码执行成功，控制将转移到存在的 `finally` 块，然后从 `finally` 块结束后的语句继续执行（即\
  \ `try` 语句结束之后）。如果不存在 `finally` 块，执行将从上一个 `catch` 块之后的语句继续（即 `try` 语句结束之后）。\n\n\
  如果在执行 `try` 块中的代码时发生某些运行时错误，JVM 会抛出一个 `Exception Error`。这意味着将根据运行时错误的类型，创建一个 `Exception\
  \ Error` 类型的对象或其子类之一。然后，将按照从上到下的顺序与 `catch` 块中的 `Exception`/`Error` 类型进行比较。\n\n\
  如果找到匹配的 `catch` 块，则处理该异常/错误，即程序不会终止。执行将从 `catch` 块中的第一个语句继续。在 `catch` 块完成后，执行将从\
  \ `try` 和 `catch` 语句结束后的语句继续。\n\n无论有多少个 `catch` 块，最多执行一个 `catch` 块。如果异常/错误与任何 `catch`\
  \ 块的异常/错误类型都不匹配，我们称其未被处理。\n\n执行将立即从 `try` 块返回。即使异常/错误未被处理，`finally` 块中的代码也将被执行。\n\
  \n如果有外层的 `try` 块，异常/错误将由外层处理，否则必须在调用当前方法的方法中进行处理。\n\n异常/错误将向上层级结构移动，直到被处理，或者如果即使在\
  \ `main()` 方法（执行开始的第一个方法）中未被处理，它将作为未处理状态传递给 JVM。\n\nJVM 然后简单地终止程序并在监视器/控制台上显示异常/错误的详情。\n\
  \n在这里我们表示了程序在执行时可能发生的某些异常。\n\n### 使用 try 和 catch\n\n虽然 Java 运行时系统提供的默认异常处理程序对于调试很有用，但你通常可能自己自己处理异常。这样做有两个好处。首先，它允许你修复错误。\n\
  \n其次，它防止程序自动终止。如果你的程序每次发生错误就停止运行并打印堆栈跟踪，大多数用户会感到困惑（至少是这样说）！幸运的是，防止这一点很容易。\n\n为了防止和处理运行时错误，只需将你想监控的代码包含在\
  \ `try` 块中。紧随 `try` 块之后，包含一个 `catch` 子句，其中指定你想要捕获的异常类型。\n\n为了说明如何可以轻松地完成这一点，以下程序包含一个\
  \ `try` 块和一个 `catch` 子句，用于处理由除零错误产生的 `ArithmeticException`：\n\n```java\nclass Exc2\
  \ {\n    public static void main(String args[]) {\n        int d, a;\n        try\
  \ {\n            // monitor a block of code.\n            d = 0;\n            a\
  \ = 42 / d;\n            System.out.println(\"This will not be printed.\");\n  \
  \      } catch (ArithmeticException e) {\n            // catch divide-by-zero error\n\
  \            System.out.println(\"Division by zero.\");\n        }\n        System.out.println(\"\
  After catch statement.\");\n    }\n}\n```\n\n此程序产生以下输出：\nDivision by zero.\nAfter\
  \ catch statement.\n\n注意 `try` 块内部的 `println()` 调用从未执行过。一旦抛出异常，控制权就会离开 `try` 块转移到\
  \ `catch` 块。因此，`try` 块内部的 `println()` 调用不会显示。`catch` 的范围限制在 `try` 指定的那些范围内。\n\n\
  构建良好的 `catch` 子句的目标应该是解决异常情况然后继续执行。例如，在下一个程序中，循环的每次迭代获取两个整数。这些整数相互相除，结果被用于除以 12345。如果除法操作导致除以零错误，它会被捕获，`a`\
  \ 的值被设置为零，程序继续运行。\n\n```java\nimport java.util.Random;\n\n// Handle an exception\
  \ and move on.\nclass HandleError {\n    public static void main(String args[])\
  \ {\n        int a=0, b=0, c=0;\n        Random r = new Random();\n        for(int\
  \ i=0; i<3000; i++) {\n            try {\n                b = r.nextInt();\n   \
  \             c = r.nextInt();\n                a = 12345 / (b/c);\n           \
  \ } catch (ArithmeticException e) {\n                System.out.println(\"Division\
  \ by zero.\");\n                a = 0; // set a to zero and continue\n         \
  \   }\n            System.out.println(\"a: \" + a);\n        }\n    }\n}\n```\n\n\
  ### 显示异常的描述\n\n`Throwable` 重写了 `toString()` 方法（由 `Object` 定义），使其返回一个包含异常描述的字符串。你可以通过简单地将异常作为参数传递\
  \ `println()` 语句来显示此描述。例如，前一个程序中的 `catch` 块可以重写为：\n\n```java\ncatch (ArithmeticException\
  \ e) {\n    System.out.println(\"Exception: \" + e);\n    a = 0; // set a to zero\
  \ and continue\n}\n```\n\n当用此版本替换程序并运行程序时，每个除零错误都会显示以下消息：\n\nException: java.lang.ArithmeticException:\
  \ / by zero\n\n虽然在这一语境下没有特别价值，但显示异常描述的能力在其他情况下非常有价值——特别是在你实验异常或进行调试时。\n\n| 异常类型\
  \ | 异常产生的原因 |\n| :--- | :--- |\n| ArithmeticException | 算术错误，例如 - 除以 0 |\n\n\n\n\
  \n\n| ArrayIndexOutOfBoundsException | 数组索引越界 |\n| :--- | :--- |\n| `ArrayStoreException`\
  \ | 在数组中存储了错误类型的数据 |\n| `FileNotFoundException` | 访问不存在的文件 |\n| `IOException` |\
  \ 无法从文件中读取 |\n| `NullPointerException` | 由引用空对象引起 |\n| `NumberFormatException` |\
  \ 与数字之间的转换失败 |\n| `OutOfMemoryException` | 没有足够的内存来分配新对象 |\n| `SecurityException`\
  \ | Applet 尝试执行浏览器安全设置不允许的操作 |\n| `StackOverflowException` | 系统耗尽了栈空间 |\n| `StringIndexOutOfBoundsException`\
  \ | 程序尝试访问字符串中不存在的字符位置 | \n\n## Java 的内置异常\n\n在标准包 `java.lang` 中，Java 定义了多个异常类。之前的示例已经使用了其中几个。这些异常中最通用的是标准类型\
  \ `RuntimeException` 的子类。\n\n正如之前之前解释的，这些异常不需要包含在任何方法的 `throws` 列表中。在 Java 语言中，这些被称为**未检查异常**（unchecked\
  \ exceptions），因为编译器不会检查方法是否处理或抛出了这些异常。`java.lang` 中定义的未检查异常列在表 -1 中。表 -2 列出了由 `java.lang`\
  \ 定义的如果该方法可能产生这些异常之一且没有对其进行处理，则必须包含在方法的 `throws` 列表中。这些被称为**已检查异常**（checked exceptions）。Java\
  \ 还定义了其他几种与其各种类库相关的异常类型。\n\n![ss](img/image01238.jpeg)\n\n## 异常处理的一般形式\n\n![](img/image01239.jpeg)\n\
  （异常处理机制）\n\n### 语法：\n\n```java\ntry\n{\n    statement; // 生成异常\n}\ncatch (Exception-type\
  \ e)\n{\n    statement; // 处理异常\n}\n```\n\n## 多个 catch 子句\n\n在某些情况下，一段代码可能会抛出多个异常。为了处理这种情况，你可以指定两个或多个\
  \ catch 子句，每个子句捕获不同类型的异常。\n\n当异常被抛出时，会顺序检查每个 catch 语句，并执行第一个与异常类型匹配的语句。在一个 catch\
  \ 语句执行后，其他语句将被跳过，并继续执行 `try / catch` 块之后。下面的示例捕获了两种不同的异常类型：\n\n```java\n// 多个 catch\
  \ 语句。\nclass MultipleCatches {\n    public static void main(String args[]) {\n \
  \       try {\n            int a = args.length;\n            System.out.println(\"\
  a = \" + a);\n            int b = 42 / a;\n            int c[] = { 1 };\n      \
  \      c[2] = 99;\n        } catch (ArithmeticException e) {\n            System.out.println(\"\
  Divide by 0: \" + e);\n        } catch (ArrayIndexOutOfBoundsException e) {\n  \
  \          System.out.println(\"Array index oob: \" + e);\n        }\n        System.out.println(\"\
  After try/catch blocks.\");\n    }\n}\n```\n\n如果在不带命令行参数的情况下启动此程序，将会导致除以零异常，因为 `a`\
  \ 将等于 0。如果你提供了命令行参数并将 `a` 设置为大于 0 的值，它将跳过除法操作。但它会导致 `ArrayIndexOutOfBoundsException`，因为数组\
  \ `c` 的长度为 1，但程序尝试给 `c[2]` 赋值。\n\n以下是两种方式生成的输出：\n```text\nC:\\>java MultipleCatches\n\
  a = 0\nDivide by 0: java.lang.ArithmeticException\nAfter try/catch blocks.\n\nC:\\\
  >java MultipleCatches Arg\na = 1\nArray index oob: java.lang.ArrayIndexOutOfBoundsException\
  \ After try/catch blocks.\n```\n\n当你使用多个 catch 语句时，重要的是记住**异常子类必须在它们的任何父类之前**。这是因为使用父类的\
  \ catch 语句将捕获该类型的异常以及其任何子类异常。因此，如果子类出现在父类之后，它将永远无法被访问。此外，在 Java 中，不可达的代码是一个错误。例如，考虑以下程序：\n\
  \n```java\n/* 此程序包含一个错误。\n在系列 catch catch 语句中，子类必须在其父类之前。否则，将创建不可达代码并导致编译时错误。 */\n\
  class SuperCatch {\n    public static void main(String args[]) {\n        try {\n\
  \            int a = 0;\n            int b = 42 / a;\n        } catch (Exception\
  \ e) {\n            System.out.println(\"Generic catch.\");\n        } /* 这个 catch\
  \ 永远不会到达，因为 ArithmeticException 是 Exception 的子类。 */\n        catch (ArithmeticException\
  \ e) { // 错误 – 不可用\n            System.out.println(\"This is never reached.\");\n\
  \        }\n    }\n}\n```\n\n如果你尝试编译此程序，将收到一条错误消息，说明第二个 catch 语句是不可达的，因为异常已经被捕获。由于\
  \ `ArithmeticException` 是 `Exception` 的子类，第一个 catch 语句将处理所有基于 Exception 的错误，包括 `ArithmeticException`。这意味着第二个\
  \ catch 语句将永远不会执行。要解决这个问题，请反转 catch 语句的顺序。\n\n## 嵌套 try\n\n`try` 语句可以嵌套。也就是说，`try`\
  \ 语句可以位于另一个 `try` 块内部。每当进入 `try` 语句时，该异常的上下文就会推入栈。\n\n如果内部 `try` 语句没有针对特定异常的 catch\
  \ 处理器，栈将回退并检查下一个 `try` 语句的 catch 处理器。这将继续进行，直到某个 catch 语句执行成功，或者直到所有嵌套的 `try` 语句耗尽。如果没有\
  \ catch 语句匹配，则 Java 运行时系统将处理该异常。\n\n这里是一个使用嵌套 try 语句的示例：\n\n### 多个 catch 语句\n\n\
  当有多个 catch 语句时，它被称为多个 catch 语句。\n\n多个 catch 语句示例\n```java\ntry\n{\n    statement;\
  \ // 生成异常\n}\ncatch (Exception-type-1 e)\n{\n    statement 1; // 处理类型 1\n}\ncatch\
  \ (Exception-type-2 e)\n{\n    statement 2; // 处理类型 2\n}\ncatch (Exception-type-n\
  \ e)\n{\n    statement n; // 处理类型 n\n}\n```\n\n### 示例 1.4\n\n```java\nclass ErrorTest\
  \ {\n    public static void main(String args[]) {\n        int a=10,b=2,c=2,d;\n\
  \        System.out.println(\"Before Exception \");\n        d=a/(b-c);\n      \
  \  System.out.println(\"After Exception \");\n    }\n}\n```\n\n输出：\n![](img/image1240.jpeg)\n\
  \n在这里我们没有捕获异常，所以程序在显示消息“Before Exception” 之后将终止。现在我们使用异常处理来解决这个问题。\n\n### 示例 11.5\n\
  \n```java\nclass ErrorTest5 {\n    public static void main(String args[]) {\n  \
  \  }\n}\n```\n\n\n\n\n\n![](img/image01241.jpeg)\n\n## 异常处理的优势\n\n- 我们可以很容易地确定异常/错误在哪里被处理。异常/错误在运行时沿调用堆栈向上传播——首先到达外层的\
  \ `try` 块，然后返回到调用方法——直到被异常处理器 `catch` 捕获。\n- 异常/错误的位置是确切的，因为用户可以获取完整的堆栈跟踪（stack\
  \ trace）。这对于调试非常有帮助。\n- 程序员有机会从错误/异常状态中恢复。\n- 错误处理代码与正常程序流分离，以提高代码的可读性和可维护性。\n-\
  \ 在 `java` 中，无需测试是否发生了异常/错误情况。添加更多的错误/异常处理器只需要添加更多的 `catch` 子句，而不需要触动原始程序流。\n\n\
  ## 异常类的层级结构\n\n所有 `Exception` / `Error` 类的根类是 `throwable` 类，它是 `object` 类的直接子类。在\
  \ Java 中，异常/错误也是对象。`Exception` 的子类带有 `Exception` 后缀。`throwable` 类有两个直接子类：\n\n- **Error**：`Error`\
  \ 类的子类主要用于信号异常状态，例如：\n    1. `OutOfMemoryError` 信号 Java 虚拟机内存耗尽，垃圾回收器无法回收任何可用内存。\n\
  \    2. `StackOverflowError` 信号解释器发生堆栈溢出。这些错误通常是不可恢复的，不应该被处理。\n- **Exception**：`Exception`\
  \ 类的子类通常是可恢复的。例如，`EOFException` 信号打开的文件没有更多数据可读。`FileNotFoundException` 信号我们要打开的文件不存在。\n\
  \n层级结构示例：![](img/image0242.jpeg)\n\n异常分为两种类型：\n\n- **检异异常 (Checked Exception)**：如果必须\
  \ `catch` 某个异常，则它被称为检异异常。编译器确保了如果一个方法可以直接或间接地 `throw` 检异异常，那么该方法必须显式地处理它。该方法要么 `catch`\
  \ 异常并采取适当措施，要么将异常传递给其调用者。`Exception` 及其所有子类（运行时异常及其子类除外）都是检异。\n- **未检异异常 (Unchecked\
  \ Exception)**：如果不必 `catch` 某个异常，则它被称为未检异异常。即使未处理未检异异常，程序也可以编译。如果程序中发生了任何未处理的未检异异常，程序将在该点终止。但如果异常被处理了，程序就不会因为异常而终止。`Error`\
  \ 及其所有子类都是未检异异常，不需要捕获。所有用户定义的 `Exception` 都是检异的。\n\n### Exception 类可用方法\n\n| 方法\
  \ | 描述 |\n|---|---|\n| `getMessage()` | 获取与异常或错误相关的消息。 |\n| `printStackTrace()`\
  \ | 打印堆栈跟踪，显示异常/错误发生的位置。 |\n| `toString()` | 结合 `getMessage()` 显示异常/错误名称及消息。 |\n\
  \n#### 示例 1\n\n```java\nclass ErrorTest6 {\n    public static void main(String[]\
  \ arr) {\n        try {\n            int a=10,b=2,c=2,d;\n            System.out.println(\"\
  Before Exception\");\n            d=a/(b-c);\n            System.out.println(\"\
  This Will Not Print\");\n        } catch(ArithmeticException e) {\n            System.out.println(\"\
  After Exception\");\n            System.out.println(\"error : Division by zero\"\
  );\n            System.out.println(e.getMessage());\n            System.out.println(e);\
  \ // 调用了 toString()。\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
  \n**输出：**\n```\nBefore Exception\nAfter Exception\nerror : Division by zero\nby\
  \ Zero\njava.lang.ArithmeticException: / by zero\njava.lang.ArithmeticException:\
  \ / by zero\nat ErrorTest6.main(ErrorTest6.java:10)\n```\n\n### 示例 1. 多 catch\n\n\
  ```java\nclass ErrorTest7 {\n    public static void main(String args[ ]) {\n   \
  \     try {\n            int a=args.length;\n            System.out.println(\"Before\
  \ Exception\");\n            int b=58/a;\n            int c[] = {};\n          \
  \  c[4]=10;\n            System.out.println(\"After Exception\");\n        } catch(ArithmeticException\
  \ e) {\n            System.out.println(\"Divide by zero :\"+e);\n        } catch(ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Array Index oob :\"+e);\n        }\n  \
  \      System.out.println(\"After try/catch block\");\n    }\n}\n```\n\n**输出 1：**\
  \ 当我们运行上述程序 `java ErrorTest7` 时\n```\nBefore Exception\nDivide by zero :java.lang.ArithmeticException:\
  \ / by zero\nAfter try/catch block\n```\n\n**输出 2：** 当我们运行上述程序 `java ErrorTest7\
  \ 45` 时\n```\nBefore Exception\nArray Index oob :java.lang.ArrayIndexOutOfBoundsException:\
  \ 47\nAfter try/catch block\n```\n\n\n\n\n\n# 嵌套 try catch\n\n如果我们在另一个 `try` 块中使用\
  \ `try` 和 `catch` 语句，则称为嵌套 try catch。\n\n### 语法\n\n```java\ntry //外层 try\n{\n  \
  \  try //内层 try\n    {\n        statement ;\n    }\n    catch1() //内层 catch\n  \
  \  {\n        statement ;\n    }\n    catch2() //内层 catch\n    {\n        statement\
  \ ;\n    }\n}\ncatch() //外层 catch\n{\n    statement ;\n}\n```\n\n## 示例 11.8 嵌套 try\
  \ 和 catch-\n\n```java\nclass Nested {\n    public static void main(String args[])\
  \ {\n        try {\n            int a=args.length;\n            int b=58/a;\n  \
  \          System.out.println(\"a= \"+a);\n            try {\n                if(a==1)\n\
  \                    a=a/(a);\n                if(a==2) {\n                    int\
  \ c[]={};\n                    c[4]=100;\n                }\n            } catch(ArrayIndexOutOfBoundsException\
  \ e) {\n                System.out.println(\"ArrayIndex oob \"+e);\n           \
  \ }\n        } catch(ArithmeticException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n输出 I: 当我们以 `java Error8` 运行上述程序时除以零\n输出 II: 当我们以 `java\
  \ Error8 0` 运行上述程序时\n输出 III: 当我们以 `java Error8 0 2` 运行上述程序时 a=2 java.lang.ArrayIndexOutOfBoundsException:\
  \ 4\n\n## finally\n\nJava 支持另一种语句 `finally`，用于处理未被任何之前的 `catch` 语句捕获的异常。`finally`\
  \ 块可以用于处理 `try` 块中生成的任何异常。无论是否发生错误，它都会执行。它可以添加到 `try` 块之后或最后一个 `catch` 块之后，如下所示：\n\
  \n### 语法\n\n```java\ntry\n{\n}\ncatch(...)\n{\n}\ncatch(...)\n{\n}\nfinally\n{\n\
  }\n```\n\n## 示例 11.9 finally 语句\n\n```java\nclass ErrorTest9 {\n    public static\
  \ void main(String args[]) {\n        int a[] = {5,0};\n        int b=5;\n     \
  \   try {\n            int x=a[2]/b-a[1];\n        } catch(ArithmeticException e)\
  \ {\n            System.out.println(\"Division By Zero\");\n        } catch(ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Array Index error\");\n        } catch(ArrayStoreException\
  \ e) {\n            System.out.println(\"Wrong Data Type\");\n        } finally\
  \ { //始终执行\n            System.out.println(\"Always Execute\");\n        }\n   \
  \     int y=a[1]/a[0];\n        System.out.println(\"y = \"+y);\n    }\n}\n```\n\
  输出: Array Index error Always Execute\n\n## throw\n\n到目前为止，我们只捕获由运行时系统抛出的异常。然而，我们的程序可以使用\
  \ `throw` 语句显式地抛出异常，`throw` 的通用形式所示：`instance` 必须是 `Throwable` 类型的对象或 `Throwable`\
  \ 的子类。简单类型（如 `int` 或 `char`）以及非 `Throwable` 类（如 `String`）不能用作异常。我们有两种方式可以获取 `Throwable`\
  \ 对象：使用 `catch` 子句中的参数，或者使用 `new` 算符创建一个。执行流在 `throw` 语句之后立即停止；任何后续语句都不会被执行。将检查最近的\
  \ `try` 块，查看它是否有与异常类型匹配的 `catch` 语句。如果找到匹配，控制将转移到该语句。如果没有，则检查下一个 `try` 语句，以此此类推。如果未找到匹配的\
  \ `catch`，默认异常处理器将停止程序并打印堆栈跟踪。这里我们有一个创建并抛出异常的程序。捕获异常的处理器将其重新抛给外层处理器。\n\n### 示例 11.10\n\
  \n```java\nclass ErrorTest10 {\n    int age;\n    void setAge(int a) {\n       \
  \ if(a>0)\n            age = a;\n        else\n            throw new NullPointerException(\"\
  Invalid\");\n    }\n    public static void main(String args[]) {\n        ErrorTest10\
  \ a1 = new ErrorTest10();\n        try {\n            a1.setAge(20);\n         \
  \   a1.setAge(-10);\n        } catch(NullPointerException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n## throws\n\n如果一个方法可能会抛出一个它未处理的异常，它就必须指定这种行为，以便该方法的调用者能够针对该异常进行防护。我们通过在方法的声明中包含\
  \ `throws` 子句来实现这一点。`throws` 子句列出了方法可能抛出的异常类型。\n\n这对于所有检查异常（checked exceptions）来说都是必要的。方法可以抛出的所有异常都必须在\
  \ `throws` 子句中声明。如果没有，将会导致编译错误。以下是包含 `throws` 子句的方法声明的通用形式：\n\n### 语法\n\n```java\n\
  type method-name(parameter list)throws exception-list\n{\n    //方法体\n}\n```\n\n\
  在这里，`exception list` 是方法可以抛出的异常的逗号分隔列表。\n\n### 示例 11.11\n```java\nimport java.io.*;\n\
  class ErrorTest11 {\n    int age;\n    void setAge(int a) throws IOException {\n\
  \        if(a>0)\n            age = a;\n        else {\n            IOException\
  \ e = new IOException(\"Invalid Age\");\n            throw e;\n        }\n    }\n\
  \    public static main(String args[]) {\n        ErrorTest11 a1 = new ErrorTest11();\n\
  \        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n      \
  \  } catch(IOException e) {\n            System.out.println(e.getMessage());\n \
  \       }\n    }\n}\n```\n输出:\n```\nInvalid Age\n```\n\n# 创建自定义异常子类\n\n这非常简单，只需定义\
  \ `Exception` 的子类即可。我们的子类不需要实际实现任何内容。`Exception` 类本身没有定义任何方法。当然，它继承了由 `Throwable`\
  \ 提供的方法。\n\n尽管 Java 的内置异常处理了大多数错误，但你可能想要创建自己的异常类型，以处理特定于你应用程序的情况。这非常简单：只需定义 `Exception`\
  \ 的子类（它当然也是是 `Throwable` 的子类）。它们在类型系统中的存在让你能够将它们作为异常使用。\n\n`Exception` 类本身没有定义任何方法。它当然继承了由\
  \ `Throwable` 提供的那些方法。因此，所有异常（包括你创建的异常）都可以使用 `Throwable` 定义的方法。\n\n`Exception` 定义了四个构造函数。其中两个支持链式异常，将在下一节中描述。另外两个所示：\n\
  `Exception()`\n`Exception(String msg)`\n\n第一种形式创建一个一个没有描述的异常。第二种形式允许你指定异常的描述。\n\n\
  虽然在创建异常时指定描述通常很有用，但有时重写 `toString()` 更好。原因如下：由 `Throwable` 定义并由 `Exception` 继承的\
  \ `toString()` 版本显示异常名称，后面跟着一个冒号，然后是你的描述。通过重写 `toString()`，你可以防止显示异常名称和冒号。这使得输出更加整洁，在某些情况下是需要的。\n\
  \n### 示例 11.12\n```java\nclass AgeException extends Exception {\n    AgeException(String\
  \ msg) {\n        super(msg);\n    }\n}\nclass ErrorTest12 {\n    int age;\n   \
  \ void setAge(int a) throws AgeException {\n        if(a>0)\n            age = a;\n\
  \        else {\n            AgeException e = new AgeException(\"Invalid Age\");\n\
  \            throw e;\n        }\n    }\n    public static void main(String args[])\
  \ {\n        ErrorTest12 a1 = new ErrorTest12();\n        try {\n            a1.setAge(20);\n\
  \            a1.setAge(-10);\n        } catch(AgeException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n输出:\n```\nInvalid Age\n```\n\n下面的示例声明了一个 `Exception`\
  \ 的新子类，然后使用该子类在方法中信号一个错误条件。它重写了 `toString()` 方法，允许显示精心定制的异常描述。\n\n![sss](img/image01243.jpeg)\n\
  \n此示例定义了一个名为 `MyException` 的 `Exception` 子类。该子类非常简单：它只有一个构造函数加上重写的 `toString()`\
  \ 方法，用于显示异常的值。\n\n`ExceptionDemo` 类定义了一个名为 `compute()` 的方法，该方法会抛出一个 `MyException`\
  \ 对象。当 `compute()` 的整数参数大于 10 时，会抛出该异常。`main()` 方法为 `MyException` 设置了异常处理器，然后用合法值（小于\
  \ 10）和非法值调用 `compute()`，以展示代码的两种路径。\n\n以下是结果：\n```\nCalled compute(1)\nNormal exit\n\
  Called compute(20)\nCaught MyException[20]\n```\n\n## 链式异常\n\n链式异常功能允许我们将另一个异常与异常关联。。第二个异常描述了第一个异常产生。例如，想象一种情况，方法由于尝试除以零而抛出\
  \ `ArithmeticException`。然而，问题的实际原因是发生了 I/O 错误，导致除数被设置不当。\n\n尽管方法必须抛出 `ArithmeticException`（因为这是发生的错误），但我们可能还想让调用代码知道底层原因是\
  \ I/O 错误。\n\n为了允许链式异常，Java 2 1.4 版本为 `Throwable` 类增加了两个构造函数和两个方法。\n\n\n\n\n\n```\n\
  Throwable(Throwable causeExc)\nThrowable(String msg, Throwable causeExc)\n```\n\n\
  在第一种形式中，`causeExc` 是发生的异常。第二种形式允许我们在指定原因异常的同时，指定一个描述信息。这两个构造函数也被添加到了 `Error`、`Exception`\
  \ 和 `RuntimeException` 类中。\n\n添加到 `Throwable` 类的链式异常方法是 `getCause()` 和 `initCause()`。\n\
  \n```\nThrowable getCause()\nThrowable initCause(Throwable causeExc)\n```\n\n`getCause()`\
  \ 方法返回当前异常的底层异常。如果没有底层异常，则返回 `null`。`initCause()` 方法将 `causeExc` 与调用的异常关联起来，并返回该异常的引用。因此，我们可以在异常创建后为其关联一个原因。然而，原因异常只能被设置一次。\n\
  \n因此，我们对每个异常对象只能调用一次 `initCause()`。此外，如果原因异常是通过构造函数设置的，那么我们无法再次使用 `initCause()`\
  \ 方法设置它。通常情况下，`initCause()` 用于为那些不支持前述两个额外构造函数的遗留异常类设置原因。Java 大多数内置异常都没有定义这些额外的构造函数。因此，如果我们需要为这些异常添加异常链，将使用\
  \ `initCause()`。\n\n链式异常并不是每个程序都需要的。然而，在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\n### 示例 11.13\n\
  \n```java\nclass ErrorTest13 {\n    int age;\n    void setAge(int a) {\n       \
  \ if(a > 0)\n            age = a;\n        else {\n            NullPointerException\
  \ e = new NullPointerException(\"Admission Failed\");\n            e.initCause(new\
  \ ArithmeticException(\"Age is invalid\"));\n            throw e;\n        }\n \
  \   }\n    public static void main(String args[]) {\n        ErrorTest13 a1 = new\
  \ ErrorTest13();\n        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n\
  \        } catch(NullPointerException e) {\n            System.out.println(e.getMessage());\n\
  \            System.out.println(e.getCause());\n        }\n    }\n}\n```\n\n**输出：**\n\
  ```\nAdmission Failed\nAge is Invalid\n```\n\n在这个示例中，顶层异常是 `NullPointerException`。它被添加了一个原因异常\
  \ `ArithmeticException`。当异常从 `setAge()` 抛出时，它被 `main()` 捕获。在那里，显示了顶层异常，随后是通过调用 `getCause()`\
  \ 获取的底层异常。链式异常可以根据需要延伸到任何深度。因此，原因异常本身也可以有自己的原因。请注意，过长的异常链可能意味着设计不当。链式异常并不是每个程序都需要的。然而，在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\
  \n### 三个新的 JDK 7 异常特性（已更新）\n\nJDK 7 为异常系统增加了三个有趣且实用的特性。第一个功能自动化了在不再需要时释放资源（如文件）的过程。它基于\
  \ `try` 语句的扩展形式，称为 `try-with-resources`，将在后续介绍文件的章节中进行描述。\n\n第二个新功能称为 `multi-catch`，第三个功能有时被称为最终重新抛出（final\
  \ rethrow）或更精确的重新抛出（more precise rethrow）。这两个特性在这里进行了描述。\n\n`multi-catch` 功能允许用同一个\
  \ `catch` 语句捕获两个或多个异常。两个或多个异常处理程序使用相同的代码序列并不罕见，尽管它们响应的是不同的异常。现在不再需要逐个捕获每种异常类型，而是可以使用单个\
  \ `catch` 语句来处理所有异常，而避免代码重复。\n\n要使用 `multi-catch`，在 `catch` 语句中用或运算符（|）分隔每个异常类型。每个\
  \ `multi-catch` 参数都是隐式 `final` 的（如果需要，可以显式指定 `final`，但没有必要）。因为每个 `multi-catch` 参数都是隐式\
  \ `final` 的，所以它们不能被赋予新值。\n\n这是一个使用 `multi-catch` 特性同时捕获 `ArithmeticException` 和\
  \ `ArrayIndexOutOfBoundsException` 的 `catch` 语句：\n\n```java\ncatch(ArithmeticException\
  \ | ArrayIndexOutOfBoundsException e) {\n```\n\n以下程序展示了 `multi-catch` 特性的用法：\n\n\
  ```java\n// 展示 JDK 7 的多-catch 特性。\nclass MultiCatch {\n    public static void main(String\
  \ args[]) {\n        int a=10, b=0;\n        int vals[] = { 1, 2, 3 };\n       \
  \ try {\n            int result = a / b; // 生成一个 ArithmeticException\n         \
  \   // vals[10] = 19; // 生成一个 ArrayIndexOutOfBoundsException\n            // 此 catch\
  \ 语句捕获了这两个异常。\n        } catch(ArithmeticException | ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Exception caught: \" + e);\n        }\n\
  \        System.out.println(\"After multi-catch.\");\n    }\n}\n```\n\n当尝试除零时，程序将生成一个\
  \ `ArithmeticException`。如果你注释掉除法语句并移除下一行的注释符号，就会生成 `ArrayIndexOutOfBoundsException`。这两个异常都被同一个\
  \ catch catch 语句捕获。\n\n更精确的重新抛出功能限制了可以重新抛出的异常类型，仅限于关联 `try` 块抛出的检查异常（checked exceptions），且未被之前的\
  \ `catch` 语句处理，并是参数的子类型或超类型。\n\n虽然这种能力可能并不经常需要，但现在已经可以使用。为了使更精确的重新抛出生效，`catch` 参数必须是有效最终的（effectively\
  \ final），这意味着它在 catch 块内部不能被赋予新值，或者显式声明为 `final`。\n\n### 使用异常\n\n异常处理为控制具有许多运行时特征的复杂程序提供了一种强大的机制。将\
  \ `try`、`throw` 和 `catch` 视为处理程序逻辑中错误和异常边界条件的清洁方法是非常重要的。与其他某些使用错误返回码指示失败的语言不同，Java\
  \ 使用异常。因此，当一个方法可能会失败时，让它抛出一个异常。\n\n这是一种处理失败模式更清洁的方法。最后一点：Java 的异常处理语句不应被视为非局部跳转的通用机制。如果你这样做，只会混乱你的代码并使其难以维护。\n\
  \n理论问题\n1. 什么是异常？\n2. 我们如何定义 `try` 块？\n3. 我们如何定义 `catch` 块？\n\n\n\n\n\n## Java 中的异常处理\n\
  \n4. 列举 Java 中可能发生的一些常见异常类型。给出示例。\n5. 捕获所有类型的异常都是必要的吗？\n6. 一个 `try` 块可以使用多少个 `catch`\
  \ 块。\n7. 创建可能产生三种异常的 `try` 块，并结合必要的 `catch` 块来适当捕获并处理它们。\n8. 什么是 `finally` 块？什么时候以及使用？给出一个合适的示例。\n\
  9. 解释异常处理机制如何用于程序调试。\n\n![11](img/image01214.jpeg) ![11](img/image01214.jpeg) ![11](img/image01214.jpeg)\
  \ ![11](img/image01214.jpeg) ![11](img/image01214.jpeg)\n\n![STAR-LOGO-2013](img/image01215.jpeg)\n\
  \n# 章节：多线程编程\n\n### 引言\n线程是程序内部的控制流。线程与进程非常相似。事实上，线程也被称为轻量级进程。\n\n### 线程对比 进程\n\
  通常，不同的进程占用不同的内存空间。当 CPU 从一个进程切换到另一个进程时，当前运行进程的状态会被保存，另一个进程的状态会被恢复。在状态切换期间没有进行任何有用工作。为了最大化\
  \ CPU 利用率，状态切换的时间越短越好。\n\n线程也像独立的进程，但它们共享相同的内存和状态。各个线程也有独立的状态，但与进程状态相比，状态非常小。状态可能只包含程序计数器和栈指针。因此，从一个线程切换到另一个线程所需的时间非常短。因此，与进程相比，线程的上下文切换时间非常小。因此在多线程的情况下，CPU\
  \ 的利用率高于多进程的情况下。\n\n### 多线程程序\n多线程程序包含两个或多个可以并发运行的部分。此类程序的每个部分被称为线程，每个线程都定义了一条独立的执行路径。因此，多线程是多任务处理的一种特殊形式。\n\
  \n例如，一个程序可能有三个线程：\n* 一个处理打印。\n* 一个处理编辑。\n* 一个从互联网下载文件。\n\n所有这些线程可能并发运行，从而最大化 CPU\
  \ 的利用率。\n\n### 基于进程的多任务处理\n大多数操作系统允许我们同时运行两个或多个程序。这被称为基于进程的多任务处理。例如，我们可以运行一个 Java\
  \ 程序并同时编辑一个 Word 文档。基于进程的多任务处理确保在大多数时间内会有程序被执行，从而增加了 CPU 的利用率。\n\n在基于进程的多任务处理中，程序是进程调度器可以派发的代码最小单位。\n\
  \n### 基于线程的多任务处理\n线程是基于线程的多任务环境中的执行最小单元单位。一个进程可以被分为若干个并发执行的线程。这允许我们在单个程序中并发处理多个任务。\n\
  \n例如，我们可以编辑一个 Word 文档同时打印另一个文档。基于线程的多任务处理像基于进程的多任务处理一样提高了 CPU 利用率。但同时，它通过在单独线程中并发执行程序的不同部分，有效地加快了单个程序的执行速度。\n\
  \n因此，基于进程的多任务处理处理“大局”，而基于线程的多任务处理处理细节。\n\n### Java 线程模型\nJava 运行时系统许多方面依赖线程，所有的类库在设计时都考虑了多线程。事实上，Java\
  \ 使用线程使整个环境能够异步化。这有助于通过防止 CPU 周期浪费来降低效率。\n\n单线程系统使用一种名为“事件循环+轮询”的方法。在这种模型中，单个控制线程在无限循环中运行，轮询单个事件队列以决定下一步做什么。在单线程环境中，当线程因为等待某些资源而阻塞（即暂停执行）时，整个程序都会停止运行。\n\
  \nJava 多线程的优势是消除了主循环/轮询机制。当 Java 程序中的线程阻塞时，只有被阻塞的那个线程会暂停，所有其他线程继续运行。\n\n### 线程生命周期（线程状态）\n\
  线程存在于几种状态。线程可以是运行状态。它一旦获得 CPU 时间就可以进入就绪状态。运行中的线程可以被挂起，从而暂时停止其活动。挂起的线程随后可以恢复，允许它从上次停止的地方继续。线程在等待资源时可能会被阻塞。在任何时候，线程都可以被终止，这将立即停止其执行。一旦终止，线程将无法恢复。\n\
  \n#### 1. 新生状态 (Newborn State)\n当我们创建一个线程时，线程就出生了，被称为新生状态。该线程尚未被调度运行。在此状态下，我们只能对它执行以下操作之一：\n\
  1. 使用 `start()` 将其调度以运行。\n2. 使用 `stop()` 将其杀死。\n\n如果被调度，它将移动到可运行状态。如果我们在此状态下尝试使用任何方法，将会抛出异常。\n\
  \n#### 2. 可运行状态 (Runnable State)\n可运行状态意味着线程已准备好执行，并等待处理器的可用性。也就是说，线程已加入等待执行的线程队列。如果所有线程的优先级相同，则它们将以轮询方式被赋予执行时间片。放弃控制权的线程将加入队列末尾并再次等待轮到。然而，如果我们想让一个线程在轮到它之前放弃控制权给另一个同等优先级的线程，可以通过调用\
  \ `yield()` 实现。\n\n#### 3. 运行状态 (Running State)\n运行意味着处理器已经为线程分配了执行时间。运行线程在以下情况下可能会放弃控制权：\n\
  * 时间片结束。\n* 被高优先级线程抢占。\n* 它让出（即自愿放弃控制权）。\n* 它完成了执行。\n* 被其他线程停止。\n* 它被 `suspend()`\
  \ 挂起。挂起的线程可以通过 `resume()` 恢复。这种方法在我们想要由于某些原因暂时停止某个线程但不想杀死它时非常有用。\n* 它被告知等待某个事件发生。这是通过\
  \ `wait()` 完成的。线程可以使用 `notify()` 调度再次运行。\n* 它正在执行某些 I/O 操作。\n\n#### 4. 阻塞状态 (Blocked\
  \ State)\n当线程被阻止进入可运行状态以及后续运行状态时，被称为被阻塞。这发生在线程为了满足某些要求而挂起、睡眠或等待时。阻塞线程被认为“不可运行”但未死亡，因此完全有再次运行。\n\
  \n#### 5. 死亡状态 (Dead State)\n每个线程都有生命周期。运行线程在执行完其 `run()` 方法后结束生命。它有自然死亡。然而，我们在任何状态下向其发送停止消息来杀死它，从而导致提前死亡。\n\
  \n### 线程优先级\nJava 为每个线程分配一个优先级，以决定相对于其他线程如何处理该线程。线程优先级是指定一个线程相对于另一个线程的相对优先级的整数。\n\
  \n\n\n\n作为一个绝对值，优先级是没有意义的；如果只有一个线程在运行，那么高优先线程的运行速度绝不会比低优先线程快。相反，线程的优先级被用来决定何时从一个当前正在运行的线程切换到下一个线程。这被称为上下文切换。决定何时发生上下文切换的规则非常简单：\n\
  \n*   线程可以自愿（自主地）放弃控制权。这是通过显式让出（yield）、睡眠（sleep）、阻塞（blocking）或等待 I/O 完成的。在这种情况下，系统会检查所有其他线程，通常会将\
  \ CPU 分配给就绪状态的高优先级线程。\n*   线程可以被高优先级线程抢占。在这种情况下，一个不让出处理器的低优先级线程无论无论正在做什么，都会被高优先级线程简单地抢占。基本上，只要高优先级线程想要运行，它就会运行。这被称为抢占式多任务处理。\n\
  *   某些操作系统（OS）支持非抢占式优先级调度。在在这种情况下，只有当低优先级线程完成时，高优先级线程才能获得机会。\n*   当两个优先级相同的线程竞争\
  \ CPU 周期时，情况会变得复杂一些。对于像 `windows98` 这样的操作系统，等优先级的线程必须自愿（自主地）向同级线程让出（放弃）控制权。如果不这样做，其他线程将不会运行。\n\
  \n**注意**：操作系统处理等优先级线程上下文切换的方式可能会产生问题。\n\n## 同步\n\n由于多线程为我们的程序引入了异步行为，因此当我们需要时必须有一种方法来强制同步。例如，如果我们想让两个线程通信并共享一个复杂的数据结构（如链表），我们需要某种方法来确保它们互不冲突。\n\
  \n也就是说，我们必须防止一个线程在另一个线程正在读取数据时进行写入操作。Java 使用 `monitor`（监视器）进行线程间同步。我们可以将 `monitor`\
  \ 视为一个非常小的盒子，只能容一个线程。一旦线程进入监视器，它就可以被用来保护共享资源不被多个线程同时操作。\n\n大多数多线程系统将同步暴露为对象，我们的程序必须显式地获取并锁定。Java\
  \ 提供了一个更简洁的解决方案。\n\n并没有 `monitor` 类，相反，每个对象都有它们自己的隐式监视器，当调用对象的某个 `synchronized`\
  \ 方法时，监视器会自动进入。一旦线程进入 `synchronized` 方法，其他线程就无法调用该对象上的任何其他 `synchronized` 方法。这使我们能够编写非常清晰且简洁的多线程代码，因为同步支持内置在语言中。\n\
  \n## 消息传递\n\n在使用大多数其他语言进行编程时，我们必须依赖操作系统来建立线程之间的通信。这无疑增加了开销。相比之下，Java 提供了一种简洁、低成本的方法，让两个或多个线程通过所有对象都具有的预定义方法调用相互通信。Java\
  \ 的消息传递系统允许线程进入对象的同步方法，并在那里等待，直到其他某个线程显式通知其退出。\n\n## Thread 类和 Runnable 接口\n\nJava\
  \ 的多线程系统构建在 `Thread` 类、其方法及其伴侣接口 `Runnable` 之上。该类属于 `java.lang` 包，因此不需要显式导入。\n\n\
  `Thread` 封装了一个执行线程，由于我们无法直接引用运行中线程的内部状态，我们将通过它的代理（即产生它的 `Thread` 实例）来处理它。要创建一个新线程，我们的程序要么扩展\
  \ `Thread` 类，要么实现 `Runnable` 接口。`Thread` 类定义了几个帮助管理线程的方法：\n\n| 方法 | 说明 |\n| :---\
  \ | :--- |\n| `String getName()` | 返回此线程的名称 |\n| `int getPriority()` | 返回此线程的优先级\
  \ |\n| `boolean isAlive()` | 测试此线程是否仍在运行 |\n| `void join()` | 等待此线程死亡（终止） |\n| `void\
  \ run()` | 如果此线程是使用单独 `Runnable` 对象构造的，则调用该 `Runnable` 对象的 `run` 方法；否则，此方法什么都不做并返回；如果扩展了线程类并在子类中重写了\
  \ `run()` 方法，则调用重写的 `run()` 方法。 |\n| `void setName(String name)` | 将此线程的名称更改为参数\
  \ name |\n| `static void sleep(long millis) throws InterruptedException` | 使当前执行的线程睡眠指定的毫秒数（临时停止执行）。1\
  \ sec = 1000ms |\n| `static void sleep(long millis, int nanos) throws InterruptedException`\
  \ | 使当前执行的线程睡眠指定的毫秒数加上指定的纳秒数。 |\n| `void start()` | 使此线程开始执行，Java 虚拟机会调用此线程的 `run`\
  \ 方法。 |\n| `static void yield()` | 使当前执行的线程对象临时暂停并允许其他线程执行。 |\n| `static Thread\
  \ currentThread()` | 返回当前执行的线程对象的引用。 |\n\n### 主线程\n\n当一个 Java 程序启动时，一个线程会立即开始。这通常被称为我们程序的主线程（main\
  \ thread），因为它是程序启动时执行的那个线程。主线程是创建“子”线程的线程。虽然主线程是在程序启动时创建的，但可以通过 `Thread` 对象对其进行控制。要这样做，我们必须调用\
  \ `currentThread()` 获取它的引用，它是 `Thread` 类的 `public static` 成员。该方法返回调用它的所在线程的引用。一旦我们有了主方法的引用，就可以像控制任何其他线程一样控制它。\n\
  \n**示例 1**：下面的示例演示了我们如何获取主线程的引用，然后使用 `Thread` 类的方法访问其属性。\n\n```java\nclass CurrentTest\
  \ {\n    public static void main(String args[]) {\n        Thread t = Thread.currentThread();\n\
  \        System.out.println(\"Current thread:\" + t);\n        System.out.println(\"\
  Name:\"+ t.getName());\n        System.out.println(\"Priority:\"+ t.getPriority());\n\
  \        t.setName(\"MyThread\");\n        t.setPriority(Thread.MAX_PRIORITY);\n\
  \        System.out.println(\"After name and priority change :\" + t);\n       \
  \ System.out.println(\"Name:\" + t.getName());\n        System.out.println(\"Priority:\"\
  \ + t.getPriority());\n        for (int n=1; n<=5; n++) {\n            System.out.println(n);\n\
  \            try {\n                Thread.sleep(1000);\n            } catch (InterruptedException\
  \ e) {\n                System.out.println(\"Main interrupted\");\n            }\n\
  \        }\n    }\n}\n```\n\n\n\n\n## 线程笔记\n\n注意 1：`Thread` 类中的 `sleep()` 方法可能会抛出\
  \ `InterruptedException`，这是一个检查异常。当其他线程想要中断这个正在睡眠的线程时，就会发生这种情况。\n\n注意 2：注意当 `t`（线程引用）作为\
  \ `println()` 的参数时产生的输出。它将按顺序显示：线程名称、其优先级以及线程组名称。它的优先级是 5，这是默认值，而 `main` 也是该线程所属线程组的。线程组是一个控制整个线程集合状态的数据结构。\n\
  \n## 创建线程\n\n从最通用的意义上，我们通过实例化 `Thread` 类型的对象来创建线程。Java 识别了两种实现目标的方法：\n\n1. 我们可以实现\
  \ `Runnable` 接口。\n2. 我们可以扩展 `Thread` 类本身。\n\n### 实现 Runnable\n\n创建线程最简单的方法是创建一个实现\
  \ `Runnable` 接口的类。要实现 `Runnable`，类只需要实现一个名为 `run()` 的方法。\n\n```java\npublic void\
  \ run()\n```\n\n在 `run()` 方法内部，我们将定义构成新线程的代码。`run()` 可以像主线程一样调用其他方法、使用其他类并声明变量。\n\
  \n唯一的区别是，`run()` 为程序中另一个并发执行的线程建立了入口点。该线程将在 `run()` 返回时结束。\n\n在我们创建一个实现 `Runnable`\
  \ 的类后，我们将在该类内部使用以下构造函数之一实例化 `Thread` 类型的对象：\n\n- `Thread(Runnable threadObj)`\n\
  - `Thread(Runnable threadObj, String threadName)`\n\n在这里，`threadObj` 是被调用 `run`\
  \ 方法的对象，`threadName` 是新线程的名称。在新线程创建后，在我们调用 `start()` 方法之前，它将不会开始运行。\n\n`start()`\
  \ 方法将线程放入就绪队列（可运行状态）。每当线程被调度，其执行将从 `run()` 方法开始。\n\n### 示例 12.2\n\n```java\nclass\
  \ A implements Runnable {\n    public void run() {\n        for(int i=1;i<=5;i++)\
  \ {\n            System.out.println(\"Child Thread:\" + i);\n        }\n       \
  \ System.out.println(\"Exiting child thread\");\n    }\n}\n\nclass RunnableTest\
  \ {\n    public static void main(String args[]) {\n        A a1=new A();\n     \
  \   Thread t1 = new Thread(a1,\"Demo Thread\");\n        t1.start();\n        System.out.println(\"\
  Main thread exiting\");\n    }\n}\n```\n\n**输出：**\n```\nMain thread exiting\nChild\
  \ Thread:1\nChild Thread:2\nChild Thread:3\nChild Thread:4\nChild Thread:5\nExiting\
  \ child thread\n```\n\n### 示例 12.3\n\n```java\nclass A implements Runnable {\n \
  \   Thread t;\n    A() {\n        t= new Thread(this, \"Demo Thread\");\n      \
  \  System.out.println(\"Child thread: \"+ t);\n        t.start();\n    }\n    public\
  \ void run() {\n        for (int i=1; i<=5; i++) {\n            System.out.println(\"\
  Child Thread: \"+ i );\n            try {\n                Thread.sleep(500);\n\
  \            } catch (InterruptedException e) {\n                System.out.println(e);\n\
