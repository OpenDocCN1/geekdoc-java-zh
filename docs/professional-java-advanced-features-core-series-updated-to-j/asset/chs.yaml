  }\nif(b == b2)\n{\n    f.dispose();\n}\n```\n\n### 示例 18.19 在 Applet 上显示图像\n\n####\
  \ 示例 18.19 代码：\n\n```java\nimport java.awt.*;\nimport java.net.*;\nimport java.applet.*;\n\
  /*<Applet code=\"ScrollPane1\" width=200 height=200></applet>*/\npublic class ScrollPane1\
  \ extends Applet\n{\n    Image img1;\n    URL file1;\n    public void init()\n \
