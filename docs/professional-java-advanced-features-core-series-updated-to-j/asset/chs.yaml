  \" + (a+b)/2);\n    }\n}\n```\n注：一个组件可以关联多个监听器，不能保证监听器会按照添加的顺序被通知。同样不能保证所有的监听器都会在同一个线程中执行，因此，监听器必须防范数据损坏。可以通过调用\
  \ `XXXListener()` 方法并传入要移除的监听器，从组件的监听器列表中移除监听器。例如，代码从 `btn` 中移除监听器 `al`：`btn.removeActionListener(al);`。\n\
  \n 处理窗口\n\n### 示例 18.5\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  class A5\n{\n    public static void main(String args[])\n    {\n        Frame f=\
  \ new Frame();\n        f.setLayout(new FlowLayout());\n        f.setSize(300,300);\n\
  \        f.addWindowListener(new B( ));\n        f.setVisible(true);\n    }\n}\n\
  class B implements WindowListener\n{\n    public void windowOpened (WindowEvent\
  \ we)\n    {\n        System.out.println(\"Window Opened\");\n    }\n    public\
  \ void windowActivated(WindowEvent we)\n    {\n        System.out.println(\"Window\
  \ Activated\");\n    }\n    public void windowDeactivated(WindowEvent we)\n    {\n\
  \        System.out.println(\"window Deactivated\");\n    }\n    public void windowClosing(WindowEvent\
  \ we)\n    {\n        System.out.println(\"Window Closing\");\n        Frame f =\
  \ (Frame) we.getWindow( );\n        f.dispose();\n    }\n    public void windowClosed(WindowEvent\
  \ we)\n    {\n        System.out.println(\"Window Closed\");\n    }\n    public\
  \ void windowIconified(WindowEvent we)\n    {\n        System.out.println(\"Window\
  \ Iconified\");\n    }\n    public void windowDeiconified(WindowEvent we)\n    {\n\
  \        System.out.println(\"Window Deiconified\");\n    }\n}\n```\n\n### 适配器\n\
  \n某些事件监听器接口具有多个方法。最大的接口 `WindowListener` 拥有七个方法。假设我们想要捕获 `windowClosing(WindowEvent)`\
  \ 事件，以便执行关闭窗口的代码。虽然我们在实现 `WindowListener` 的类中只需要 `windowClosing(WindowEvent)` 这一个方法，但我们必须为所有方法提供空位实现。\n\
  \n\n\n\n\n`java.awt.event` 包提供了几个适配器类，每个类都对应一个定义了多个方法的监听器接口。\n\n适配器（Adapter）简单来说就是一个通过提供“空实现”方法来实现接口的类。例如，`WindowAdapter`\
  \ 类实现了 `WindowListener` 接口，其中包含了七个空实现的方法。\n\n### 适配器类及其接口\n\n| 适配器类 | 监听器接口 |\n\
  | :--- | :--- |\n| `ContainerAdapter` | `ContainerListener` |\n| `FocusAdapter`\
  \ | `FocusListener` |\n| `KeyAdapter` | `KeyListener` |\n| `MouseAdapter` | `MouseListener`\
  \ |\n| `MouseMotionAdapter` | `MouseMotionListener` |\n| `WindowAdapter` | `WindowListener`\
  \ |\n\n### 示例 18.6 `WindowAdapter` 类的用法。\n\n```java\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\nclass A6 {\n    public static void main (String args[]) {\n\
  \        Frame f = new Frame();\n        f.setLayout(new FlowLayout());\n      \
  \  f.setSize(30,30);\n        f.addWindowListener(new B());\n        f.setVisible(true);\n\
  \    }\n}\nclass B extends WindowAdapter {\n    public void windowClosing(WindowEvent\
  \ we) {\n        System.out.print(\"Closing\");\n        Frame f = (Frame) we.getWindow();\n\
  \        f.dispose();\n    }\n}\n```\n\n### Input 类\n\n这是所有组件级输入事件的根事件类。输入事件在被源组件正常处理之前，会先传递给监听器。这允许监听器和子类“消耗”事件，从而使源组件不会以默认方式处理它们。例如，在\
  \ `Button` 组件上消耗鼠标按下事件将防止 `Button` 被激活。\n\n#### 方法\n- `void consume()`: 消耗此事件，使其由产生它的事件源按默认方式进行处理。\n\
  - `int getModifiers()`: 返回此事件的修饰符掩码（Modifier mask）。\n- `int getModifiersEx()`: 返回此事件的扩展修饰符掩码。\n\
  - `static String getModifiersExText(int modifiers)`: 返回描述扩展修饰符的 `String`，如“shift”、“Ctrl\
  \ + Shift”等。\n- `long getWhen()`: 返回事件发生的时间戳。\n- `boolean isAltDown()`: 返回此事件中 `Alt`\
  \ 修饰符是否被按下。\n- `boolean isConsumed()`: 返回事件是否已被消耗。\n- `boolean isControlDown()`:\
  \ 返回此事件中 `Control` 修饰符是否被按下。\n- `boolean isShiftDown()`: 返回此事件中 shift 修饰符是否被按下。\n\
  \n### Mouse Event 类\n\n这是 `Input` 事件类的子类。该事件表示组件中发生了鼠标操作。当且仅当光标位于组件子元素的的未遮挡部分或顶层窗口上时，才认为鼠标操作发生在该特定组件中。此事件用于鼠标事件（点击、按下、释放）和移动事件（移动和拖动）。\n\
  \n#### 方法\n- `int getButton()`: 返回哪个鼠标按钮状态发生了变化（如果有）。\n- `int getClickCount()`:\
  \ 返回与此事件相关的鼠标点击次数。\n- `static String getModifiersText(int modifiers)`: 返回描述事件发生期间按下的修饰符的\
  \ `String`，如“Shift”或“Ctrl + shift”。\n- `Point getPoint()`: 返回事件相对于源组件的 `x, y` 位置。\n\
  - `int getX()`: 返回事件相对于源组件的水平 `x` 位置。\n- `int getY()`: 返回事件相对于源组件的垂直 `y` 位置。\n-\
  \ `boolean isPopupTrigger()`: 返回此鼠标事件是否为该平台的弹出菜单触发事件。\n\n**注意**：不同系统上弹出菜单的触发方式有所不同。因此，在\
  \ `mousePressed` 和 `mouseReleased` 中都应该检查 `isPopupTrigger()`。\n\n### 处理鼠标事件：示例 18.7\n\
  \n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass A7 {\n    public\
  \ static void main(String args[]) {\n        Frame f = new Frame();\n        f.setLayout(new\
  \ FlowLayout());\n        f.setSize(30,30);\n        Button b1 = new Button(\"Push\
  \ Me\");\n        b1.addMouseListener(new B());\n        b1.addMouseMotionListener(new\
  \ C());\n        b1.addActionListener(new D());\n        f.add(b1);\n        f.setVisible(true);\n\
  \    }\n}\nclass B implements MouseListener {\n    public void mouseEntered(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse Entered...\");\n        System.out.println(me.getX());\n\
  \        System.out.println(me.getY());\n    }\n    public void mouseExited(MouseEvent\
  \ me) {\n        System.out.println(\"Exited\");\n        Point f1 = me.getPoint();\n\
  \        System.out.println(f1.x);\n        System.out.println(f1.y);\n    }\n \
  \   public void mousePressed(MouseEvent me) {\n        System.out.println(\"pressed...\"\
  );\n        int ms = me.getModifiersEx();\n        String s = me.getModifiersText(ms);\n\
  \        System.out.println(s);\n    }\n    public void mouseReleased(MouseEvent\
  \ me) {\n        System.out.println(\"Released...\");\n        System.out.println(\"\
  ClickCount-->\" + me.getClickCount());\n    }\n}\n```\n\n\n\n\n\n```java\npublic\
  \ void mouseClicked(MouseEvent me) {\n    System.out.println(\"Mouse Clicked...\"\
  );\n    System.out.println(\"Button-->\"+me.getButton());\n}\n```\n\n```java\nclass\
  \ C implements MouseMotionListener {\n    public void mouseMoved(MouseEvent me)\
  \ {\n        System.out.println(\"Mouse Moved...\");\n    }\n    public void mouseDragged(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse Dragged...\");\n    }\n}\n\nclass D\
  \ implements ActionListener {\n    public void actionPerformed(ActionEvent ae) {\n\
  \        System.out.println (\"Button...\");\n    }\n}\n```\n\n### ActionEvent 类\n\
  这是一种语义事件，表示发生了组件动作。这种高层层事件由组件（如 `Button`）在特定动作发生（如被按下）时产生。该事件会通过组件的 `addActionListener`\
  \ 方法传递给每个注册用于接收此类事件的 `ActionListener`。当事件发生时，实现 `ActionListener` 接口的对象将获取此 `ActionEvent`。监听器可以被免于处理单个移动和点击细节的烦恼，转而处理诸如“按钮”这样“有意义”的（语义化的）事件。\n\
  \n要在 `Button` 上触发 `ActionEvent`，请使用空格键。\n\n#### 方法：\n- `getAction()`：返回与此动作关联的命令字符串。\n\
  - `getModifiers()`：返回动作事件期间按住的修饰键（Keys）。\n- `getWhen()`：返回事件发生的时间戳。\n\n### 示例 18.8\n\
  此示例说明了我们如何识别在 `ActionEvent` 发生时有效的修饰键。\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  public class KeyModifierDemo extends Frame implements ActionListener {\n    Button\
  \ b;\n    KeyModifierDemo () {\n        b = new Button (“Button”);\n        b.addActionListener\
  \ (this);\n        setLayout (new FlowLayout ( ) );\n        add (b);\n        setBounds(0,0,200,20);\n\
  \        setVisible(true);\n    }\n    public static void main (String args[]) {\n\
  \        new KeyModifierDemo ( );\n    }\n    public void actionPerformed (ActionEvent\
  \ ae ) {\n        System.out.println (“Button Pressed”);\n        int ms = ae.getModifiers\
  \ ( );\n        if (ms & InputEvent.CTRL_DOWN_MASK)!=0) {\n            System.out.println\
  \ (“CTRL key was pressed”);\n        }\n        if (ms & InputEvent.SHIFT_DOWN_MASK)!=0)\
  \ {\n            System.out.println (“Shift Key was pressed”);\n        }\n    \
  \    if (ms & InputEvent.ALT_DOWN_MASK)!=0) {\n            System.out.println (“ALT\
  \ key was pressed”);\n        }\n    }\n}\n```\n\n### 处理动作命令（Action Commands）\n\
  动作事件是最简单的。当我们发现滚动条发送了调整事件时，显而易见的问题是：“现在滚动条的值是多少？”当我们发现鼠标被点击时，自然会想：“鼠标的 x 和 y 坐标是多少？”但当我们发现一个按钮发送了\
  \ `ActionEvent` 时，似乎没有任何额外的信息需要寻找；按钮已被点击，这似乎就是全部需要知道的。\n\n然而，`ActionEvent` 关联关联了一个额外信息。这条信息是一个字符串，被称为动作命令（Action\
  \ command）。我们可以通过 `getActionCommand()` 方法提取 `ActionEvent` 的动作命令。如果 `ActionEvent`\
  \ 是由文本字段发送的，`getActionCommand()` 返回文本字段的当前内容（用户输入回车键时文本字段会发送 `ActionEvent`）。如果 `ActionEvent`\
  \ 是由按钮发送的，默认行为是 `getActionCommand()` 返回按钮的标签字符串。然而，我们可以通过调用 `setActionCommand(String)`\
  \ 方法显式地设置按钮的 `ActionCommand`。\n\n```java\nButton btn = new Button (“Hello”);\nbtn.setActionCommand\
  \ (“Hello”);\n```\n\n当按钮的 `ActionListener` 需要决定如何响应 `ActionEvent` 时，动作命令对按钮优势是显而易见的。单个监听器作为多个组件的监听器是常见的；在我们的上下文中，单个对象可能是多个或许多按钮的\
  \ `ActionListener`。在这种情况下，对象的 `actionPerformed()` 方法必须判断是哪个按钮被点击了。下面的示例演示了这一点：\n\
  \n### 示例 18.9\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass ButtonTest\
  \ {\n    Button b1,b2,b3;\n    ButtonTest() {\n        Frame f=new Frame();\n  \
  \      f.setLayout(new FlowLayout ( ) );\n        f.setSize(300,300);\n        b1=new\
  \ Button(\"Push Me\");\n        b2=new Button(\"Click Me\");\n        b3=new Button(\"\
  Hit Me\");\n        f.add(b1); f.add(b2); f.add(b3);\n        B obj= new B(b1,b2,b3);\n\
  \        b1.addActionListener(obj);\n        b2.addActionListener(obj);\n      \
  \  b3.addActionListener(obj);\n        f.setVisible(true);\n    }\n    public static\
  \ void main (String args[]) {\n        new ButtonTest ( );\n    }\n}\nclass B implements\
  \ ActionListener {\n    Button b4,b5,b6;\n    B(Button b1, Button b2, Button b3)\n\
  }\n```\n\n\n\n\n\n```java\n{\n    b4 = b1;\n    b5 = b2;\n    b6 = b3;\n}\npublic\
  \ void actionPerformed(ActionEvent ae)\n{\n    Button b = (Button)ae.getSource();\n\
  \    if (b == b4)\n        System.out.println(\"First Button was pressed\");\n \
  \   else if (b == b5)\n        System.out.println(\"Second Button was pressed\"\
  );\n    else if (b == b6)\n        System.out.println(\"Third Button  was pressed\"\
  );\n}\n```\n\n#### 示例 18.10:\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  \nclass GetLabelTest {\n    Button b1, b2, b3;\n\n    GetLabelTest() {\n       \
