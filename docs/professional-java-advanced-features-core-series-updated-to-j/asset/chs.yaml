  \n### 引言\n修饰符是 Java 关键字，用于向编译器提供有关代码、数据、类或接口性质。例如，我们使用可见性修饰符 `public`、`private`、`protected`、`package\
  \ public` 等来指定类成员可见性。除了可见性，我们还使用了修饰符 `static`、`final` 和 `abstract`。\n\n为了便于理解，修饰符可以分为：\n\
  \n1. 顶层类和接口的访问权限修饰符。\n2. 类的成员访问/可见性修饰符。\n3. 接口的成员访问/可见性修饰符。\n4. 顶层类的其他修饰符。\n5. 顶层接口的其他修饰符。\n\
  6. 接口成员的其他修饰符。\n7. 类成员的其他修饰符。\n\n### 1. 顶层类和接口的访问权限修饰符：\n* `public`\n* `default`\
  \ (包级) 访问\n\n### 2. 类的成员访问/可见性修饰符：\n通过指定成员访问权限修饰符，类可以控制哪些信息对客户端（即其他类）可见。这些修饰符帮助类定义合约，让客户端确切类提供了哪些服务。\n\
  \n成员的访问权限/可见性可以是以下之一：\n* `public`\n* `protected`\n* `default`（也称为包级访问权限）\n* `private`\n\
  \n注意：成员访问权限修饰符仅在类（或其任意一个子类）对客户端可见时才有意义。另请注意，一个成员只能指定一个访问权限修饰符。\n\n此讨论同时适用于类的实例成员和静态成员。\n\
  \n### 3. 接口的成员访问/可见性修饰符：\n可以与接口数据成员和方法使用的唯一成员访问/可见性修饰符是 `public`。\n\n`public` 也是接口成员的隐式访问权限/可见性修饰符，也就是说，即使我们不使用\
  \ `public` 修饰符，成员也被隐式地认为是 `public`。\n\n### 4. 顶层类的其他修饰符：\n除了可见性修饰符，我们还可以在顶层类之前使用以下修饰符：\n\
  \n(a) `abstract`\n可以使用 `abstract` 关键字指定类，表示其不可实例化。包含 `abstract` 方法的类必须是 `abstract`\
  \ 的。\n\n(b) `final`\n可以使用 `final` 关键字指定类，表示其不能被扩展。\n\n### 5. 顶层接口的其他修饰符：\n(a) `abstract`\n\
  这是除可见性修饰符外唯一可用于接口的修饰符。\n\n### 6. 接口成员的其他修饰符：\n数据成员：\n除了可见性修饰符 `public`，我们还可以使用修饰符\
  \ `static` 和 `final`。\n\n方法：\n除了可见性修饰符 `public`，我们还可以使用修饰符 `abstract`。\n\n### 7.\
  \ 类成员的其他修饰符：\n以下关键字可以在声明中指定字段和/或方法的某些特性：\n1. `static`\n2. `final`\n3. `abstract`\n\
  4. `synchronized`\n5. `native`\n6. `transient`\n7. `volatile`\n\n#### A. static\
  \ 修饰符：\n`static` 成员属于它们声明所在的类，而不是类的任何实例的一部分。根据类中静态成员的访问权限修饰符，客户端可以使用类名或类的对象引用来访问这些成员。\n\
  \nstatic 变量（也称为类变量）：\n这些变量仅存在于它们定义的类中。当类加载时，如果没有显式的初始化表达式，静态变量将初始化为它们的默认值。\n\nstatic\
  \ 方法：\n这些也被称为类方法。类中的 `static` 方法可以直接访问该类中的其他 `static` 成员。它无法访问类的实例（即非静态）成员，因为 `static`\
  \ 方法没有关联对象的概念。\n\n\n\n\n\n* 它们只能调用其他静态方法。\n* 它们只能访问静态数据成员。\n* 它们不能以任何方式引用 `this`\
  \ 或 `super`。\n\n## 静态初始化块\n\n一个 Java 类可以拥有一个或多个静态初始化块。静态初始化块的语法如下：\n\n`static {\
  \ code }`\n\n静态初始化块可以被视为一个静态方法，它在类加载时会被隐式地/自动调用。静态块在以下情况下非常有用：\n\n* 静态变量的动态初始化。\n\
  * 在类加载时执行一次性活动。例如，加载 jdbc 驱动类。\n* 在 `Hashtable`、`HashMap`、`Properties` 等中加载小型数据库/配置文件。\n\
  \n## final 修饰符\n\n修饰符 `final` 用于：\n\n*局部变量\n* 实例变量/数据成员\n* 静态变量/数据成员\n* 实例方法\n\n\
  ### final 变量\n\n`final` 变量通常在声明时初始化，一旦赋值，其值就不能修改。以下是关于 `final` 变量的一些重要点：\n\n* `final`\
  \ 变量是一个常量，尽管它被称为变量。一旦初始化，它的值就不能改变。这适用于实例、静态和局部变量，包括声明为 `final` 的参数。\n* `final` 是唯一适用于局部变量或形式参数的修饰符。\n\
  * 原始数据类型的 `final` 变量一旦初始化，其值就不能改变。\n* 引用类型的 `final` 变量一旦初始化，其引用值就不能改变，但它所指向的对象的状态仍然可以更改。\n\
  * 通常 `final` 变量在声明时初始化，但并非必须如此。这样的 `final` 变量也称为空白 final 变量（blank final variable），在在使用之前必须初始化一次。\n\
  * `final static` 变量通常用于定义命名常量，例如 `Integer.MAX_VALUE`，它是 int 的最大值。\n\n#### 局部 final\
  \ 变量\n\n#### 示例 13.1\n以下示例说明了局部 `final` 变量可以如上所述留空，但在首次使用之前必须初始化。变量 `x` 在在显示器上显示其值之前进行初始化。\n\
  \n```java\nclass FinalTest1 // 使用了 blank final\n{\n    public static void main(String\
  \ args[]) {\n        final int x; // 声明时不必初始化\n        x = 50;\n        System.out.println(x);\n\
  \    }\n}\n```\n**输出: 50**\n\n#### 示例 13.2\n由于 `final` 变量被初始化两次，以下代码无法编译。\n\n```java\n\
  class FinalTest2 // 使用了 blank final\n{\n    public static void main(String args[])\
  \ {\n        final int x;\n        x = 0;\n        System.out.println(x);\n    \
  \    x = 60;\n    }\n}\n```\n\n### 实例 final 变量\n\n实例 `final` 变量可以留空，但在获取该类对象的引用之前必须初始化。因此，如果我们不在声明时初始化，`final`\
  \ 变量可以初始化的其他地方是：\n\n* 构造函数\n* 初始化块\n\n#### 示例 13.3\n以下程序将无法编译，因为 `final` 变量没有初始化。默认初始化的概念不适用于\
  \ `final` 变量，因为它们在初始化后无法被修改。\n\n```java\nclass FinalTest3 // 使用了 blank final\n{\n\
  \    final int x; // final 实例变量没有初始化\n}\n class MyClass\n{\n    public static void\
  \ main(String args[]) {\n        FinalTest3 f = new FinalTest3();\n        System.out.println(f.x);\n\
  \    }\n}\n```\n**输出: (编译错误): x might not have been initialized.**\n\n#### 示例 13.4\n\
  以下程序也将无法编译，因为 `final` 变量在获取引用后才被初始化。\n\n```java\nclass FinalTest4\n{\n    final\
  \ int x;\n}\nclass MyClass\n{\n    public static void main(String args[]) {\n  \
  \      FinalTest4 f = new FinalTest4();\n        f.x = 10;\n        System.out.println(f.x);\n\
  \    }\n}\n```\n\n#### 示例 13.5\n以下示例说明了空白 `final` 实例变量可以在构造函数中初始化。\n\n```java\n\
  class FinalTest5\n{\n    final int x;\n    public static void main(String args[])\
  \ {\n        FinalTest5 f = new FinalTest5();\n        System.out.println(f.x);\n\
  \    }\n    FinalTest5()\n    {\n        x = 10;\n    }\n}\n```\n**输出: 10**\n\n\
  #### 示例 13.6\n以下程序说明了空白 `final` 变量可以使用动态值初始化，并通过 `this` 关键字引用。因此，同一类的不同对象可以拥有不同的\
  \ `final` 变量值。\n\n```java\nclass FinalTest6\n{\n    final int x;\n    FinalTest6(int\
  \ x1) {\n        x = x1;\n    }\n    public static void main(String args[]) {\n\
  \        FinalTest6 f1 = new FinalTest6(10);\n        FinalTest6 f2 = new FinalTest6(20);\n\
  \        System.out.println(f1.x);\n        System.out.println(f2.x);\n    }\n}\n\
  ```\n**输出: 10, 20**\n\n\n\n\n初始化块可以被视为构造函数，它在对象创建时就会被隐式/自动调用。事实上，如果一个类包含初始化块，它们会在任何构造函数执行之前，按照定义的从上到下的顺序执行。\n\
  \n### 示例 13.7:\n\n```java\nclass FinalTest7\n{\n    final int x;\n    public static\
  \ void main(String args[])\n    {\n        FinalTest7 f=new FinalTest7();\n    \
  \    System.out.println(f.x);\n    }\n    {\n        x=20;\n    }\n}\n```\n\n初始化块在以下情况下有用：\n\
  * 实例变量的动态初始化。\n* 定义所有构造函数通用的代码。这会增加代码的可用性并减少维护工作。\n\n### static final 变量\n\n`static\
  \ final` 变量可以留空，但必须在类对程序可用之前完成初始化。因此，如果我们不在声明时对其进行初始化，那么 `static final` 变量唯一初始化的地方是：\n\
  * `static` 初始化块\n\n### 示例 13.8\n\n下面的示例说明了空白的 `static final` 变量可以在 `static` 块中初始化。\n\
  \n```java\nclass FinalTest8\n{\n    static final int x;\n    public static void\
  \ main(String args[])\n    {\n        System.out.println(FinalTest8.x);\n    }\n\
  \    static\n    {\n        x=20;\n    }\n}\n```\n输出: `20`\n\n### final 方法\n\n*\
  \ 类中的 `final` 方法是完整的（即有实现），并且不能在任何子类中被重写。\n* 编译器能够对 `final` 方法执行某些优化，因为可以对此类成员做出某些假设。当调用非静态方法时，运行时系统会确定对象的实际类，将方法调用绑定到该类型对应的正确方法实现上，然后调用它。\n\
  * 对于 `final` 方法，我们确定子类不能重写该方法，因此绑定是在编译时完成的，与 `private` 和 `static` 方法的情况一样，这绝对提高了了性能。\n\
  * 对于 `final` 方法，编译器可能会将调用替换为方法的实际体，就像宏一样。在 C++ 中，我们可以选择将函数声明为 `inline`（尽管这一决定由编译器做出），但在\
  \ Java 中，由编译器做决定。\n\n### abstract 修饰符\n\n`abstract` 修饰符只能用于实例方法。`abstract` 方法没有实现，也就是说，`abstract`\
  \ 方法没有定义方法体，类中仅提供方法原型。它的类也必须是 `abstract` 的（即不完整的），并且必须显式声明为 `abstract`。`abstract`\
  \ 类的子类必须提供方法的实现；否则它们也是抽象的。\n\n以下是与抽象方法相关的一些点：\n* `abstract` 方法不能被声明为 `private`。这是显而易见的，因为我们无法重写\
  \ `private` 方法，而在 `abstract` 方法的情况下，方法体始终通过重写抽象方法在子类中提供。\n* 只有实例方法可以声明为 `abstract`，因为\
  \ `static` 方法不能被重写，声明一个 `abstract static` 方法没有意义并将导致编译错误。\n* `final` 方法不能是 `abstract`\
  \ 的，反之亦然。\n* 关键字 `abstract` 不能与方法的任何访问修饰符结合。\n* 接口中指定的方法隐式是 `abstract` 的，因为接口中只定义了方法原型。\n\
  \n### synchronized 修饰符\n\n`synchronized` 关键字可以用于方法和代码块。程序中可以多个线程同时执行。它们可能会尝试同时在同一个对象上执行多个方法。如果要求一次只有一个线程可以执行对象中的某个方法，可以将这些方法声明为\
  \ `synchronized`。它们的执行在所有线程之间是互斥的。\n\n在任何给定时刻，最多有一个线程可以执行对象上的某个 `synchronized` 方法。此讨论也适用于类的\
  \ `static synchronized` 方法。\n\n注意：`synchronized` 修饰符不适用于类或成员变量。\n\n### native 修饰符\n\
  \n`native` 修饰符只能引用方法。与 `abstract` 关键字一样，`native` 表示方法体将在其他处找到。`native` 方法体完全位于 JVM\
  \ 之外，位于库中。原生代码是用非 Java 语言（通常是 `C` 或 `C++`）编写的，并针对单一目标机器类型编译。因此，破坏了 Java 的平台无关性。将\
  \ Java 移植到新平台的人实现了大量的原生代码，以支持 GUI 组件、网络通信以及许多其他平台特定的功能。然而，应用程序和 Applet 程序员编写原生代码的情况很少见。\n\
  \n### transient 修饰符\n\n对象可以使用序列化进行存储。序列化将对象转换为有利于存储对象的输出格式。稍后可以以序列化时的相同状态检索对象，这意味着包含在序列化中的所有字段将具有与序列化时相同的值。此类对象被称为持久化对象。\n\
  \n在类声明中，可以将某个字段指定为 `transient`，表示当类的对象被写入持久化存储时，不应保存其值。\n\n```java\nclass Experiment\
  \ implements Serializable\n{\n    transient int currentTemperature; // transient\n\
  \    double mass; // 持久化值\n}\n```\n对 `static` 变量指定 `transient` 修饰符是冗余的，因此不建议这样做。静态变量不是序列化对象持久化状态的一部分。\n\
  \n### volatile 修饰符\n\n在执行期间，编译后的代码可能出于效率考虑缓存字段的值。由于多个线程可以访问同一个字段，因此确保缓存不会在读取和写入字段值时导致不一致至关重要。使用\
  \ `volatile` 修饰符可以告知编译器不要尝试对该字段进行优化。\n\n---\n\n# (包装类)\n\n### 简介\n\nJava 中的原始数据类型不是对象。如果我们想将这些数据类型作为对象使用，我们必须使用\
  \ `java.lang` 包中为每个原始数据类型提供的包装类。\n\n\n\n\n\nJava 为每个基本数据类型都提供了对应的包装类，如下表所示：\n\n\
  | 原始数据类型 | 包装类 |\n| :--- | :--- |\n| boolean | Boolean |\n| char | Character |\n\
  | byte | Byte |\n| short | Short |\n| int | Integer |\n| long | Long |\n| float\
  \ | Float |\n| double | Double |\n\n## Number 类\n\n抽象类 `Number` 定义了一个父类，由包装数值类型\
  \ `byte`、`short`、`int`、`long`、`float` 和 `double` 的类实现。`Number` 类具有抽象方法，用于返回对象在不同数字格式的值。这些方法是：\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `byte byteValue()` | 返回指定数字的 `byte` 类型值。 |\n|\
  \ `short shortValue()` | 返回指定数字的 `short` 类型值。 |\n| `abstract int intValue()` | 返回指定数字的\
  \ `int` 类型值。 |\n| `abstract long longValue()` | 返回指定数字的 `long` 类型值。 |\n| `abstract\
  \ float floatValue()` | 返回指定数字的 `float` 类型值。 |\n| `abstract double doubleValue()`\
  \ | 返回指定数字的 `double` 类型值。 |\n\n**注意**：由 `byteValue()`、`shortValue()`、`intValue()`、`longValue()`、`floatValue()`\
  \ 和 `doubleValue()` 方法返回可能涉及舍入或截断。\n\n### 示例 14.1\n\n下面的示例演示了调用 `Number` 类的方法时如何发生舍入和截断。\n\
  \n```java\nclass Wrapper {\n    public static void main(String args[ ]) {\n    \
  \    Integer iObj = new Integer(128);\n        System.out.println(iObj.byteValue());\
  \ // truncation\n        Long lObj = new Long(123456789123456789L);\n        System.out.println(lObj);\n\
  \        System.out.println(lObj.doubleValue());\n        Float fObj = new Float(3.99f);\n\
  \        System.out.println(fObj.intValue()); // truncation\n    }\n}\n```\n\n**输出：**\n\
  ```\n-128\n123456789123456789\n1.23456789123456784E17\n3\n```\n\n### 使用包装类的构造函数将基本类型转换为对象，并将数值对象转换回基本类型\n\
  \n#### 示例 14.2\n\n下面的示例演示了如何将基本类型封装成对象，以及如何将它们转换回基本类型。\n\n```java\nclass Convert\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  Converting primitive numbers to objects \" + \"using constructors\");\n        byte\
  \ b = 105;\n        Byte bObj = new Byte(b);\n        System.out.println(bObj);\
  \ // toString()\n        short s = 205;\n        Short sObj = new Short(s);\n  \
  \      System.out.println(sObj);\n        int i = 277;\n        Integer iObj = new\
  \ Integer(i);\n        System.out.println(iObj);\n        long l = 23454335565675L;\n\
  \        Long lObj = new Long(l);\n        System.out.println(lObj);\n        float\
  \ f = 3.1415f;\n        Float fObj = new Float(f);\n        System.out.println(fObj);\n\
  \        double d = 3.1415;\n        Double dObj = new Double(d);\n        System.out.println(dObj);\n\
  \n        System.out.println(\"Converting numeric objects to primitive numbers\"\
  );\n        byte b1 = bObj.byteValue();\n        short s1 = sObj.shortValue();\n\
  \        int i1 = iObj.intValue();\n        long l1 = lObj.longValue();\n      \
  \  float f1 = fObj.floatValue();\n        double d1 = dObj.doubleValue();\n    \
  \    System.out.println(b1);\n        System.out.println(s1);\n        System.out.println(i1);\n\
  \        System.out.println(l1);\n        System.out.println(f1);\n        System.out.println(d1);\n\
  \    }\n}\n```\n\n**输出：**\n```\nConverting primitive numbers to objects\n105\n205\n\
  277\n23454335565675\n3.1415\n3.1415\nConverting object to primitive numbers\n105\n\
  205\n277\n23454335565675\n3.1415\n3.1415\n```\n\n### 使用对应包装类的 toString() 静态方法将基本类型转换为字符串\n\
  \n#### 示例 14.3：\n\n```java\nclass ConvertPrimitiveToString {\n    public static\
