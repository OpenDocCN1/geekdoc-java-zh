  \ 将导致 4321）。\n7. 编写一个程序找到给定三个数字中的最大值。\n8. 使用 `jump` 语句打印前 10 个偶数。\n\n![O:\\Amazon\\\
  1\\. PROJECT A- PDF & PAPER\\6\\. Cracking The Coding Interview\\8 DONE\\9 copy.jpg](img/image01219.jpeg)\
  \ ISBN 13: 978-1500730413.\n\n![STAR-LOGO-2013](img/image01215.jpeg)\n\n# 第 4 章：（Scanner\
  \ 类与数组)\n(命令行参数)\n\n### 引言\n\n### Scanner 类\n\n`Scanner` 类是 Java 在 JDK 1.5-6-7 版本中引入的新类，用于从用户处获取基本数据类型的输入。使用该类获取输入非常简单，因为我们只需要创建该类的对象并调用特定方法即可。该类位于\
  \ `java.util` 包中。\n\n```java\npublic java.util.Scanner(java.io.InputStream);\npublic\
  \ java.util.Scanner(java.io.File) throws java.io.FileNotFoundException;\npublic\
  \ java.util.Scanner(java.lang.String);\npublic void close();\npublic boolean hasNext();\n\
  public java.lang.String next(); // 输入不包含任何空格的字符串。\npublic java.lang.String nextLine();\
  \ // 输入可能包含空格的字符串。\npublic boolean hasNextBoolean();\npublic boolean nextBoolean();\n\
  public boolean hasNextByte();\npublic byte nextByte();\npublic boolean hasNextShort();\n\
  public short nextShort();\npublic boolean hasNextInt(); // 检查输入缓冲区中的下一个值是否为 int。\n\
  public int nextInt(); // 输入整数值。\npublic boolean hasNextLong();\npublic long nextLong();\n\
  public boolean hasNextFloat();\npublic float nextFloat();\npublic boolean hasNextDouble();\n\
  public double nextDouble();\n```\n\n#### 示例 4.1\n\n```java\nimport java.util.*;\n\
  class SumInput {\n    public static void main(String args[]) {\n        Scanner\
  \ sc = new Scanner(System.in);\n        int a, b, sum;\n        System.out.print(\"\
  Enter Ist number\");\n        a = sc.nextInt();\n        System.out.print(\"Enter\
  \ 2nd number\");\n        b = sc.nextInt();\n        sum = a + b;\n        System.out.println(\"\
  Sum is \" + sum);\n    }\n}\n```\n**输出：**\n```\nEnter Ist number 45\nEnter 2nd number\
  \ 55\nSum is 100\n```\n\n# 数组\n\nJava 数组是相同类型变量或数据的有序集合。Java 允许任意维度的数组。Java 数组与\
  \ C/C++ 有不同，我们不能在声明时指定数组的大小。内存分配始终是动态的。Java 中的每个数组都被视为一个对象，并有一个特殊的属性 `length`，该属性指定数组中元素的数量。\n\
  \n### 一维数组\n\n**声明：**\n`type array_name[];` // 声明时不进行内存分配。\n或\n`type[] array_name;`\n\
  \n需要注意的是，声明并没有实际创建数组。它只是声明了一个可以指向数组对象的引用。\n\n`int a1[], a2;`\n`int[] a3, a4;`\n\n\
  这两个声明将 `a1`、`a3` 和 `a4` 声明为可以指向 `int` 数组的引用变量，但变量 `a2` 不能指向 `int` 数组。它仅仅是一个 `int`\
  \ 变量。当 `[]` 符号跟随类型时，声明中的所有变量都是数组。否则，`[]` 符号必须跟随声明中的每个数组名。\n\n**使用 `new` 操作符进行内存分配：**\n\
  `array_name = new type[SIZE];` // `SIZE` 可以是常量或变量。\n\n![](img/image01220.jpeg)\n\
  \n**注意 1：** 数组的所有元素将自动初始化为零，但要用不同的值初始化数组，我们可以在声明时初始化。声明、内存分配和初始化步骤可以合并为：\n`int a[]={5,7};`\n\
  \n**注意 2：** 数组索引从 0 开始。\n\n**注意 3：** 在 Java 中，所有数组都存储在一个名为 `length` 的变量中。我们可以使用属性\
  \ `length` 访问数组的长度：`array_name.length`。\n\n**注意 4：** `int a[], b[];`\n`a = b = new\
  \ int[5];`\n在上述步骤中，通过 `new` 创建了一个数组，该数组的引用首先存储在 `b` 中，然后是 `a`。因此两个都都向同一个数组。赋值引用不会创建对象的副本。\n\
  \n#### 示例 4.2 数组所有数字的和\n\n```java\nclass SumArr {\n    public static void main(String\
  \ args[]) {\n        int a[]={10,50,20,40,3};\n        int n=a.length,sum=0;\n \
  \       for(int i=0; i<n; i++) {\n            sum+=a[i];\n        }\n        System.out.println(\"\
  Sum of numbers is \" + sum);\n    }\n}\n```\n**输出：** `Sum of numbers is 150`\n\n\
  #### 示例 4.3 使用选择排序技术对数组排序的程序\n\n```java\nimport java.util.Scanner;\nclass Sort {\n\
  \    public static void main(String args[]) {\n        int n;\n        Scanner sc\
  \ = new Scanner(System.in);\n        System.out.println(\"Enter how many elements\"\
  );\n        n = sc.nextInt();\n        int a[] = new int[n];\n        // 输入数组\n\
  \        for(int i=0; i<n; i++) {\n            System.out.print(\"Enter \" + (i+1)\
  \ + \" \");\n            a[i] = sc.nextInt();\n        }\n        // 排序\n      \
  \  for(int i=0; i<n-1; i++) {\n            for(int j=i+1; j<n; j++) {\n        \
  \        if(a[i] > a[j]) {\n                    int t=a[i];\n                  \
  \  a[i] = a[j];\n                    a[j] = t;\n                }\n            }\n\
  \        }\n        // 输出\n        for(int i=0; i<n; i++) {\n            System.out.println(a[i]);\n\
  \        }\n    }\n}\n```\n\n\n\n\n# 内存分配\n\n```java\narray_name = new type[ROWS][COLUMNS];\n\
  ```\n`ROWS` & `COLUMNS` 可以是常量或变量\n\n到为止，我们讨论了可以存储数值列表的数组变量。在某些情况下，我们需要存储一个数值表格。考虑下面的数据表，它显示了三名销售人员三种商品的销售额。\n\
  \n该表总包含 12 个值，每行三个。我们可以将此表看作由四行三列组成的矩阵。每一行代表特定销售人员的销售额，每一列代表特定商品的销售额。\n\n## 示例 4.4\
  \ 打印矩阵转置的程序\n\n```java\nimport java.util.*;\n\nclass Transpose {\n    public static\
  \ void main(String args[]) {\n        Scanner sc=new Scanner(System.in);\n     \
  \   int r,c;\n        System.out.print(\"Enter how many rows\");\n        r=sc.nextInt();\n\
  \        System.out.print(\"Enter how many cols.\");\n        c=sc.nextInt();\n\n\
  \        int m[][]=new int[r][c];\n        //input\n        for(int i=0;i<r;i++)\
  \ {\n            for(int j=0;j<c;j++) {\n                System.out.print(\"Enter\"\
  \ + (i+1) + \",\" +(j+1));\n                m[i][j]=sc.nextInt();\n            }\n\
  \        }\n        //transpose\n        for(int i=0;i<c;i++) {\n            for(int\
  \ j=0;j<r;j++) {\n                System.out.print(m[j][i]+\"\\t\");\n         \
  \   }\n            System.out.println();\n        }\n    }\n}\n```\n\n## 示例 4.5\
  \ 将两个矩阵相乘得到第三个矩阵的程序\n\n```java\nimport java.util.*;\nclass MatrixMult {\n    public\
  \ static void main(String args[]) {\n        Scanner sc=new Scanner(System.in);\n\
  \        int r1,c1;\n        System.out.print(\"Enter how many rows\");\n      \
  \  r1=sc.nextInt();\n        System.out.print(\"Enter how many cols.\");\n     \
  \   c1=sc.nextInt();\n        int r2,c2;\n        System.out.print(\"Enter how many\
  \ rows\");\n        r2=sc.nextInt();\n        System.out.print(\"Enter how many\
  \ cols.\");\n        c2=sc.nextInt();\n        if(c1 != r2) {\n            System.out.println(\"\
  Can't mult\");\n            System.exit(1);\n        }\n        int m1[][]=new int[r1][c1];\n\
  \        //input m1\n        for(int i=0;i<r1;i++) {\n            for(int j=0;j<c1;j++)\
  \ {\n                System.out.print(\"Enter\" + \"element \" + (i+1) + \",\" +\
  \ (j+1));\n                m1[i][j]=sc.nextInt();\n            }\n        }\n  \
  \      int m2[][]=new int[r2][c2];\n        //input m2\n        for(int i=0;i<r2;i++)\
  \ {\n            for(int j=0;j<c2;j++) {\n                System.out.print(\"Enter\"\
  \ + \"element \" + (i+1) + \",\" +(j+1));\n                m2[i][j]=sc.nextInt();\n\
  \            }\n        }\n        int m3[][]=new int[r1][c2];\n        //matrix\
  \ mult\n        for(int i=0;i<r1;i++) {\n            for(int j=0;j<c2;j++) {\n \
  \               for(int k=0;k<c1;k++) {\n                    m3[i][j]+=m1[i][k]*m2[k][j];\n\
  \                }\n            }\n        }\n        //Output m3\n        for(int\
  \ i=0;i<r1;i++) {\n            for(int j=0;j<c2;j++) {\n                System.out.print(m3[i][j]+\"\
  \\t\");\n            }\n            System.out.println();\n        }\n    }\n}\n\
  ```\n\n## 3. 变长数组\n\n数组将多维数组视为“数组的数组”，可以按照如下方式声明一个二维数组：\n\n```java\nint arr[ ] [\
