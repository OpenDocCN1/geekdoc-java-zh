  \n(Java 流类的分类)\n\n## 字节流类概述：-\n\n字节流类通过使用两个类层次结构定义。顶端是两个抽象类：\n\n(1) `InputStream`\
  \ 和 (2) `OutputStream`\n\n这些抽象类中的每一个都有几个具体的子类，它们用于处理不同设备之间的差异，例如磁盘文件、网络连接甚至内存缓冲区。\n\
  \n### InputStream 类\n\n用于读取 8 位字节的 `InputStream` 类包括一个名为 `InputStream` 的超类（类）以及若干个支持各种输入相关函数的子类。\n\
  \n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image01249.jpeg)\n\
  \n![abc](img/image01250.jpeg)\n\n输入流类的层次结构。\n\n![ab](img/image01251.jpeg)\n\n输入流类的层次结构。\n\
  \n### InputStream 类：-\n\n超类 `InputStream` 是一个抽象类，它定义了执行输入功能的方法，例如：\n\n*   读取字节。\n\
  *   关闭流。\n*   在流中标记位置。\n*   在流中向前跳过。\n*   查找流中的字节数。\n\n#### InputStream 类的方法：\n\n\
  | 方法 | 描述 |\n| :--- | :--- |\n| `int available()` | 提供输入中可用的字节数（必须由子类重写）。`InputStream`\
  \ 类的 `available` 方法始终返回 0。 |\n| `void close()` | 关闭此输入流并释放与流相关的任何系统资源。`InputStream`\
  \ 的 `close` 方法不执行任何操作。 |\n| `void mark(int readlimit)` | 标记此输入流中的当前位置。`InputStream`\
  \ 的 `mark` 方法不执行任何操作。 |\n| `boolean markSupported()` | 测试此输入流是否支持 `mark` 和 `reset`\
  \ 方法。`InputStream` 的 `markSupported` 方法返回 false。 |\n| `abstract int read()` | 从输入流中读取下一个字节数据。子类必须提供此方法的实现。\
  \ |\n| `int read(byte[] b)` | 从输入流中读取若干字节并将其存储在缓冲区数组 `b` 中。实际读取的字节数作为整数返回。 |\n|\
  \ `int read(byte[] b, int offset, int len)` | 从输入流中读取若干字节，并从参数 `off` 指定的位置开始将其存储在缓冲区数组\
  \ `b` 中。实际读取的字节数作为整数返回。 |\n| `void reset()` | 将此流重新定位到上次在此输入流上调用 `mark` 方法时所在的位置。`InputStream`\
  \ 的 `reset` 方法不执行任何操作并始终抛出 `IOException`。 |\n| `long skip(long n)` | 跳过并丢弃此输入流中的最多\
  \ `n` 个字节的数据，并返回实际跳过的字节数。 |\n\n### DataInput 接口：-\n\n`DataInput` 是一个接口，定义了从 `InputStream`\
  \ 读取原始数据类型的方法。\n\n#### DataInput 接口的方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean\
  \ readBoolean()` | 读取一个输入字节，如果该字节非零则返回 true，如果字节为零则返回 false。 |\n| `byte readByte()`\
  \ | 读取并返回一个字节输入。 |\n| `char readChar()` | 读取一个输入字符并返回其值。 |\n| `double readDouble()`\
  \ | 读取八个输入字节并返回一个 double 值。 |\n| `float readfloat()` | 读取四个输入字节并返回一个 float 值。 |\n\
  | `void readFully(byte[] b)` | 从输入流读取若干字节并将其存储在缓冲区数组 `b` 中。如果流在读取所有字节之前到达末尾，此方法将抛出\
  \ `EOFException`。 |\n| `void readFully(byte[] b, int off, int len)` | 从输入流读取 `len`\
  \ 个字节，并从 `off` 指定的位置开始将其存储在缓冲区数组 `b` 中。如果流在读取所有字节之前到达末尾，此方法将抛出 `EOFException`。 |\n\
  | `int readInt()` | 读取四个输入字节并返回一个 `int` 值。 |\n| `String readLine()` | 从输入流中读取下一行。\
  \ |\n| `long readLong()` | 读取八个输入字节并返回一个 long 值。 |\n| `short readShort()` | 读取两个输入字节并返回一个\
  \ short 值 |\n| `Strig readUTF( )` | 读取一个使用修改后的 UTF-8 格式编码的字符串。 |\n| `int skipBytes(int\
  \ n)` | 尝试从输入流中跳过 `n` 个字节，丢弃跳过的字节。返回实际跳过的字节数。 |\n\n### InputStream 类总结：-\n\n| 类\
  \ | 描述 |\n| :--- | :--- |\n| `InputStream` | 此抽象类是所有表示字节输入流的类的超类。 |\n| `BufferedInputStream`\
  \ | `BufferedInputStream` 为另一个输入流增加了功能——即缓冲输入的能力并支持 `mark` 和 `reset` 方法。 |\n| `ByteArrayInputStream`\
  \ | `ByteArrayInputStream` 包含一个包含字节的内部缓冲区。 |\n| `DataInputStream` | `DataInputStream`\
  \ 允许应用程序从流读取原始数据类型。 |\n| `FileInputStream` | `FileInputStream` 包含来自文件的输入字节。 |\n\
  | `FilterInputStream` | `FilterInputStream` 包含另一个输入流，将其作为基本数据源并可能在传递过程中对数据进行额外处理。\
  \ |\n| `PipedInputStream` | `PipedInputStream` 连接到管道输出流，管道输入流提供写入管道输出流的任何数据。 |\n\
  | `PushbackInputStream` | `PushbackInputStream` 为另一个输入流增加了功能，即“回退”或未读读一个字节。 |\n\
  | `SequenceInputStream` | `SequenceInputStream` 代表流的逻辑连接。 |\n| `ObjectInputStream`\
  \ | `ObjectInputStream` 反序列化之前使用 `ObjectOutputStream` 写入原始数据和对象。 |\n\n注意 `DataInputStream`\
  \ 类继承自 `FilterInputStream` 并实现了 `DataInput` 接口。因此，`DataInputStream` 继承自 `FilterInputStream`\
  \ 并使用了 `DataInput` 中的方法，还使用了 `InputStream` 类的方法。\n\n### OutputStream 类\n\n输出流类派生自抽象类\
  \ `OutputStream`，并拥有支持各种输出功能的子类。\n\n#### OutputStream 类：-\n\nOutputStream 类的方法：-\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `void close()` | 关闭此输出流并释放与流相关的任何流资源。 |\n| `void\
  \ flush()` | 刷新此输出流并强制将缓冲的输出字节写入。 |\n| `void write(byte[] b)` | 将指定字节数组的 `b.length`\
  \ 个字节写入其输出流。 |\n| `void write(byte[] b, int off, int len)` | 从指定字节数组的偏移量 `off` 开始将\
  \ `len` 个字节写入其输出流。 |\n| `abstract void write( int b)` | 将指定的字节写入其输出流。 |\n\n### DataOutput\
  \ 接口：-\n\n`DataOutput` 是一个接口，定义了向 `OutputStream` 写入原始数据类型的方法。\n\n![IO_LayeredInput](img/image01254.jpeg)\n\
  \n\n\n\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image01255.jpeg)\n\
  \n# `DataOutput` 接口方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void writeBoolean(boolean\
  \ v)` | 向输出流写入一个布尔值。 |\n| `void writeByte(int v)` | 向输出流写入参数 `v` 的八个低位。 |\n| `void\
  \ writeBytes(string s)` | 将字符串写入输出流。对于字符串 `s` 中的每个字符（按顺序），都会向输出流写入一个字节。 |\n| `void\
  \ writeChar(int v)` | 向输出流写入一个由两个字节组成的字符值。 |\n| `void writeChars(string s)` | 将字符串\
  \ `s` 中的每个字符按每两个字节的顺序写入输出流。 |\n| `void writeDouble(double v)` | 向输出流写入一个由八字节组成的\
  \ double 值。 |\n| `void writeFloat(float v)` | 向输出流写入一个由四个字节组成的 float 值。 |\n| `void\
  \ writeInt(int v)` | 向输出流写入一个由四个字节组成的 int 值。 |\n| `void writeLong(long v)` | 向输出流写入一个由八字节组成的\
  \ long 值。 |\n| `void writeShort(int v)` | 向输出流写入一个由两个字节组成的 short 值。 |\n| `void writeUTF(String\
  \ str)` | 向输出流写入两个字节的长度信息，随后是字符串 `s` 中每个字符的修改后的 UTF-8 表示。 |\n\n### `OutputStream`\
  \ 类总结\n\n`DataOutputStream` 是 `DataInputStream` 的对应类。`DataOutputStream` 类除了使用 `OutputStream`\
  \ 类的方法外，还实现了 `DataOutput` 接口中描述的方法。\n\n### `OutputStream` 类总结\n\n| 类 | 描述 |\n| :---\
  \ | :--- |\n| `OutputStream` | 这一抽象类是所有表示字节输出流的类的父类。 |\n| `BufferedOutputStream`\
  \ | 该类实现了一个缓冲的输出流。 |\n| `ByteArrayOutputStream` | 该类实现了一个将数据写入字节数组的输出流。 |\n| `DataOutputStream`\
  \ | 数据输出流允许应用程序以可移植的方式向输出流写入 Java 原始数据类型。 |\n| `FileOutputStream` | 文件输出流是用于向 `File`\
  \ 写入数据的输出流。 |\n| `PipedOutputStream` | 管道输出流可以连接到管道输入流以创建一个通信管道。 |\n| `FilterOutputStream`\
  \ | `FilterOutputStream` 包含一些其他输出流，并将其作为目标，可能在传输过程中转换数据或提供额外功能。 |\n| `PrintStream`\
  \ | `PrintStream` 为另一个输出流增加了功能，即方便地打印各种数据值表示的能力。 |\n\n# 字符流类概览\n\n字符流通过两个类层次结构定义。顶端是两个抽象类：`Reader`\
  \ 和 `Writer`。这些抽象类处理 Unicode 字符流。\n\nJava 拥有这些每个抽象类的几个具体子类。抽象的 `Reader` 和 `Writer`\
  \ 类定义了其他流类实现的几个关键方法。其中最重要的两个方法是 `read()` 和 `write()`，它们分别读取和写入字符。这些方法被派生流类重写。\n\n\
  ## `Reader` 流类\n\n`Reader` 流类设计用于从文件中读取字符。`Reader` 类是该组中所有其他类的基类。这些类在功能上与输入流类非常相似，但输入流使用字节作为基本信息单位，而读取流使用字符。\n\
  \n`Reader` 类包含了与 `InputStream` 类中提供的相同的方法。因此，`Reader` 类可以执行输入流类实现的所有的所有功能。\n\n![](img/image01256.jpeg)\n\
  \n*（Reader 流类的层次结构）*\n\n## `Reader` 类\n\n`Reader` 是一个抽象类，定义了 Java 的字符输入流模型。该类中的所有方法都会抛出\
  \ `IOException`。\n\n### `Reader` 类方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `abstract\
  \ void close()` | 关闭流。一旦流被关闭，进一步的 `read()`、`ready()`、`mark()` 或 `reset()` 调用将抛出\
  \ `IOException`。然而，关闭一个之前关闭的流不会产生任何影响。 |\n| `void mark()` | 标记流中的当前位置。随后的 `reset()`\
  \ 调用将尝试将流重置到此点。并不是所有的字符输入流都支持 `mark()` 操作。 |\n| `boolean markSupported()` | 告知此流是否支持\
  \ `mark()` 操作。 |\n| `int read()` | 读取单个字符并返回来自调用输入流的下一个可用字符的整数表示。当遇到文件末尾时返回 -1。\
  \ |\n| `int read(char[] buffer)` | 尝试读取最多 `buffer` 长度的内容到 `buffer` 中，并返回成功读取的字符数。当遇到文件末尾时返回\
  \ -1。 |\n| `abstract int read(char[] buffer, int offset, int len)` | 尝试从 `buffer[offset]`\
  \ 开始读取多达 `len` 个字符，返回成功读取的字符数。子类必须实现此方法。 |\n| `boolean ready()` | 告知此流已准备好读取。如果下一次输入请求不会等待，则返回\
  \ true。 |\n| `void reset()` | 重置流。并不是所有字符输入流都支持此方法。 |\n| `long skip(long n)` | 跳过\
  \ `n` 个字符并返回跳过的字符数。如果 `n` 为负数则抛出 `IllegalArgumentException`。 |\n\n## `Reader` 类总结\n\
  \n| 类 | 描述 |\n| :--- | :--- |\n| `Reader` | 读取字符的抽象类 |\n| `BufferedReader` | 从字符流读取文本，缓冲字符以便高效读取字符和行。\
  \ |\n| `CharArrayReader` | 实现一个作为字符输入流的缓冲区。 |\n| `FileReader` | 读取字符文件的便利类。 |\n\
  | `FilterReader` | 读取字符流的抽象类。 |\n| `InputStreamReader` | 从字节流到字符流的桥梁：使用指定的字符集解码字节为字符。\
  \ |\n| `PipedReader` | 管道字符输入流。 |\n| `PushbackReader` | 允许将字符推回流的字符读取器。 |\n| `StringReader`\
  \ | 源自字符串的字符流。 |\n\n## `Writer` 类\n\n`Writer` 流类设计用于向文件/输出设备写入字符。`Writer` 类是一个抽象类，作为写入流类的基类。\n\
  \n基类通过定义与 `OutputStream` 类相同的方法为所有输出操作提供支持。\n\n`Writer` 类包含了与 `OutputStream` 类提供的相同的方法。因此，`Writer`\
  \ 类可以执行输出流类实现的所有功能。\n\n![](img/image01257.jpeg)\n\n*（Writer 流类的层次结构）*\n\n## `Writer`\
  \ 类\n\n`Writer` 是一个定义字符输出流的抽象类。该类中的所有方法返回空值，并在出错时抛出 `IOException`。\n\n### `Writer`\
  \ 类方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `abstract void close()` | 关闭流并先进行刷新。 |\n\
  | `abstract void flush()` | 刷新流。 |\n| `void write(char[] cbuf)` | 写入字符数组。 |\n| `abstract\
  \ void write(char[] cbuf, int off, int len)` | 从指定的偏移量开始写入字符数组的一部分。子类必须实现此方法。 |\n\
  \n\n\n\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `void write(int c)` | 向调用的输出流写入单个字符。注意该参数类型为\
  \ `int`，这允许你直接对表达式调用 `write` 而无需将它们强制转换回 `char`。 |\n| `void write(String str)` |\
  \ 写入字符串。 |\n| `void write(String str, int off, int len)` | 写入字符串从指定偏移量开始的部分。 |\n\
  \n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\Star_logo_yellow.jpg](img/image01259.jpeg)\n\
  \n## Writer 类总结-\n\n| 类 | 说明 |\n| :--- | :--- |\n| `Writer` | 用于向字符流写入数据的抽象类。 |\n\
  | `BufferedWriter` | 向字符输出流写入文本，通过缓冲字符来提供高效写入单个字符、数组和字符串的功能。 |\n| `CharArrayWriter`\
  \ | 此类实现了一个可以作为 `Writer` 使用的字符缓冲区。 |\n| `FileWriter` | 用于写入字符文件的便利类。 |\n| `FilterWriter`\
  \ | 用于写入过滤字符流的抽象类。 |\n| `OutputStreamWriter` | `OutputStreamWriter` 是字符流到字节流的桥梁：写入它的字符将使用指定的\
  \ `charset` 编码为字节。 |\n| `PipedWriter` | 管道字符输出流。 |\n| `PrintWriter` | 将对象的格式化表示打印到文本输出流。\
  \ |\n| `StringWriter` | 一种字符流，其输出收集在字符串缓冲区中，该缓冲区可以用于构造字符串。 |\n\n## File 类-\n\n尽管\
  \ `java.io` 中定义的大多数类都操作流，但 `File` 类并不如此。它直接处理文件和文件系统。也就是说，`file` 类没有指定如何从文件中检索信息或将信息存储文件中。它描述的是自身的属性。\n\
  \n文件对象用于获取或操作与磁盘文件相关的信息（例如权限、时间、日期和目录路径），以及导航子目录层级结构。\n\n尽管出于安全考虑，文件在 applet 中的用法受到严格限制，但文件仍然是存储持久性和共享信息的核心资源。\n\
  \nJava 中的目录被简单地视为一个文件，多了一个额外的属性——文件名列表，可以通过 `list()` 方法进行检查。\n\n| 构造函数 / 方法 | 说明\
  \ |\n| :--- | :--- |\n| `public File(String)` | |\n| `public File(String, String)`\
  \ | |\n| `public File(File, String)` | |\n| `public File(URI)` | 此构造函数由 Java2，版本\
  \ 1.4 添加。 |\n| `public String getName()` | 返回文件或目录的。 |\n| `public String getParent()`\
  \ | 返回从对象创建期间指定的 `path` 获取的文件的父目录；如果此 `pathname` 未命名父目录，则返回 null。 |\n| `public String\
  \ getPath()` | 返回相对路径。 |\n| `public boolean isAbsolute()` | 测试此抽象路径是否为绝对路径。 |\n\
  | `public String getAbsolutePath()` | 返回从根目录开始的绝对（完整）路径。 |\n| `public boolean canRead()`\
  \ | 测试应用程序是否可以读取此抽象路径所指的文件。 |\n| `public boolean canWrite()` | 测试应用程序是否可以修改此抽象路径所的文件。\
  \ |\n| `public boolean exists()` | 测试此抽象路径所指的文件或目录是否存在。 |\n| `public boolean isDirectory()`\
  \ | 测试此抽象路径所指的文件是否为目录。 |\n| `public boolean isFile()` | 测试此抽象路径所的文件是否为普通文件。 |\n\
  | `public boolean isHidden()` | 测试此抽象路径命名的文件是否为隐藏文件。 |\n| `public long lastModified()`\
  \ | 返回此抽象路径所指的文件最后修改的时间。 |\n| `public long length()` | 返回此抽象路径所指的文件长度。 |\n| `public\
  \ boolean createNewFile() throws java.io.IOException` | 当且仅当不存在此名称的文件时，自动创建一个由此抽象路径命名的新空文件。\
  \ |\n| `public boolean delete()` | 删除此抽象路径所指的文件或目录。 |\n| `public String[] list()`\
  \ | 返回一个包含此抽象路径所指目录的文件和目录名的字符串数组。如果 `File` 对象对应于文件，则返回 null。 |\n| `public boolean\
  \ mkdir()` | 创建此抽象路径命名的目录。 |\n| `public boolean mkdirs()` | 创建由此抽象路径命名的目录，包括任何必要的但不存在的父目录。\
  \ |\n| `public boolean setLastModified(long)` | 设置此抽象路径命名的文件或目录的修改时间。 |\n| `public\
  \ boolean setReadOnly()` | 标记此抽象路径命名的文件或目录，使其只允许读操作。 |\n| `public boolean setWritable(boolean)`\
  \ | |\n| `public boolean setReadable(boolean)` | |\n| `public boolean canExecute()`\
  \ | |\n| `public long getTotalSpace()` | |\n| `public long getFreeSpace()` | |\n\
  | `public long getUsableSpace()` | |\n| `boolean renameTo(File)` | 重命名此抽象路径所指的文件。\
  \ |\n\n## 示例-\n\n```java\nFile f1 = new File(\"/\");\nFile f2 = new File(\"/\",\
  \ \"autoexec.bat\");\nFile f3 = new File(f1, \"autoexec.bat\");\n```\n\n**注意：**\n\
  Java 在处理 UNIX 和 Windows 惯例之间的路径分隔符时处理得很好。在 Windows 版本中使用正斜杠 `/` 路径也能正确解析。记住，在使用反斜杠\
  \ `\\\\` 字符串时，Java 惯例是使用正斜杠。\n\n**示例 15.1: 演示了类的若干方法**\n\n```java\nimport java.io.*;\n\
