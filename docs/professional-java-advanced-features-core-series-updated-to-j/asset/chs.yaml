  \ String valueOf(Object)` | 为参数 `p`（简单类型或对象）创建一个字符串对象 |\n\n## 字符串数组\n\n我们也可以创建并使用包含字符串的数组。\n\
  \n### 示例 10.1\n\n```java\nimport java.util.Scanner;\n\nclass StringArrSort {\n \
  \   public static void main(String args[]) {\n        Scanner sc=new Scanner(System.in);\n\
  \        System.out.print(\"Enter how many names \");\n        int n=sc.nextInt();\n\
  \        String s[]=new String[n];\n        // input\n        for(int i=0;i<n;i++)\
  \ {\n            System.out.println(\"Enter name \" + (i+1));\n            s[i]=sc.next();\n\
  \        }\n        // sorting\n        for(int i=0;i<n-1;i++) {\n            for(int\
  \ j=i+1;j<n;j++) {\n                if(s[i].compareTo(s[j]) > 0) {\n           \
  \         String t=s[i];\n                    s[i]=s[j];\n                    s[j]=t;\n\
  \                }\n            }\n        }\n        //output\n        for(int\
  \ i=0;i<n;i++) {\n            System.out.println(s[i]);\n        }\n    }\n}\n```\n\
  \n## 字符串转换与 toString()\n\n当 Java 在拼接过程中将数据转换为其字符串表示时，它是通过调用 `String` 类定义的重载字符串转换方法\
  \ `valueOf()` 来完成的。`valueOf()` 是一个针对所有简单类型和 `Object` 类型重载的静态方法。\n\n对于简单类型，`valueOf()`\
  \ 返回一个包含调用时值的人类可读等价值的字符串。对于对象，`valueOf()` 调用对象上的 `toString()` 方法。\n\n每个类都继承了 `toString()`，因为它是由\
  \ `Object` 类定义的。然而，`toString()` 的默认实现通常是不够的。它显示类名，后跟符号“@”，然后是对象 ID（例如 `Box@ab1342`），这通常没有用。对于我们创建的大多数重要类，我们希望重写\
  \ `toString()` 并提供自己的字符串表示。\n\n### 示例 10.2\n\n```java\nclass A {\n    private int\
  \ x,y;\n    A() {\n        x = y = 0;\n    }\n    A(int x1, int y1) {\n        x\
  \ = x1;\n        y = y1;\n    }\n}\nclass ToStringTest {\n    public static void\
  \ main(String args[]) {\n        A a1 = new A(5,6);\n        System.out.println(a1);\
  \ // 调用了 Object 类的 toString()\n        String s1=\"Object a1 is \" + a1; // 与字符串拼接\n\
  \        //再次调用了 Object 的 toString()\n        System.out.println(s1);\n    }\n}\n\
  ```\n**输出：**\nA@3e25a5\nObject a1 is A@3e25a5\n\n### 示例 10.3\n\n```java\nclass A\
  \ {\n    private int x,y;\n    A() {\n        x = y = 0;\n    }\n    A(int x1, int\
  \ y1) {\n        x = x1;\n        y = y1;\n    }\n    public String toString() {\n\
  \        return (x + \",\" + y);\n    }\n}\nclass ToStringTest2 {\n    public static\
  \ void main(String args[]) {\n        A a1 = new A(5,6);\n        System.out.println(a1);\
  \ // 调用了 A 类的 toString()\n        String s1=\"Object a1 is \" + a1; // 与字符串拼接\n\
  \        //再次调用了 A 的 toString()\n        System.out.println(s1);\n    }\n}\n```\n\
  **输出：**\n5,6\nObject a1 is 5,6\n\n### 示例 10.4\n\n```java\nimport java.util.*;\n\n\
  class FindTest {\n    public static void main(String args[]) {\n        Scanner\
  \ sc=new Scanner(System.in);\n        String s1,s2;\n        System.out.print(\"\
  Enter a string\");\n    }\n}\n```\n\n\n\n\n\n```\ns1=sc.next();\nSystem.out.print(\"\
  Enter string to search\");\ns2=sc.next();\nint ans = s1.indexOf(s2);\nif(ans ==\
  \ -1)\n    System.out.println(\"Not Found\");\nelse\n    System.out.println(\"found\
  \ at pos \" + ans);\n```\n\n## StringBuffer\n\n### 简介\n`StringBuffer` 是 `String`\
  \ 的对等类，提供了 `String` 的大部分功能。众所周知，`String` 代表固定长度且不可变的字符序列。与 `String` 不同，`StringBuffer`\
  \ 代表可增长和可写的字符序列。`StringBuffer` 可以在中间插入字符或在末尾追加字符和子字符串。\n\n`StringBuffer` 会自动扩展以为这些添加留出空间，通常预分配的字符比实际需要的更多，以便留出增长空间。Java\
  \ 频繁使用这两个类，但许多程序员只处理 `String`，而 Java 通过使用重载的 `+` 运算符在后台操作 `StringBuffer`。\n\n###\
  \ 与 StringBuffer 类相关的几个重要点点\n- `StringBuffer` 像 `String` 一样是一个 `Object`。\n- `StringBuffer`\
  \ 类也像 `String` 类一样是 `final` 的。\n- 与 `String` 对象不同，`StringBuffer` 对象是可变的（可以修改）。\n\
  \n## StringBuffer 类的构造函数和方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `public StringBuffer()`\
  \ | 默认构造函数为 16 个字符留出空间，无需重新分配。 |\n| `public StringBuffer(int)` | 此构造函数接受一个整数参数，显式设置缓冲区的大小。\
  \ |\n| `public StringBuffer(String)` | 此构造函数接受一个 `String`，设置 `StringBuffer` 对象的初始内容，并为额外的\
  \ 16 个字符留出空间，无需重新分配。 |\n| `public synchronized int length()` | 返回 `StringBuffer`\
  \ 的当前长度。 |\n| `public synchronized int capacity()` | 返回当前容量。容量是为新插入字符提供的可用存储空间，超过该空间将发生分配。\
  \ |\n| `public synchronized void ensureCapacity(int)` | 确保容量至少等于指定的最小容量。如果我们想在 `StringBuffer`\
  \ 构造后为特定数量的字符预留空间，可以使用 `ensureCapacity()` 方法设置缓冲区的大小。如果我们提前知道将向 `StringBuffer` 追加大量短字符串，这种方法非常有用。\
  \ |\n| `public synchronized void trimToSize()` | 删除多余的空空间。现在 `Capacity` 将等于 `length`。\
  \ |\n| `public synchronized void setLength(int newLength)` | 设置字符序列的长度。`newLength`\
  \ 必须是非负数。当我们增加缓冲区大时，空字符会被添加到现有缓冲区的末尾。如果调用 `setLength()` 的值小于 `length()` 返回的当前值，则存储在新长度之外的字符将丢失。\
  \ |\n| `public synchronized char charAt(int index)` | 返回此序列中指定索引处的 `char` 值。 |\n\
  | `public synchronized void getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)`\
  \ | 将字符从此序列复制到目标字符数组 `dst`。要拷贝的第一个字符位于索引 `srcBegin`；最后一个字符位于索引 `srcEnd-1`。要拷贝的字符总数为\
  \ `srcEnd-srcBegin`。字符被复制到 `dst` 中从 `dstBegin` 开始的子数组。注意：确保目标或目标数组足够大，以容纳指定子字符串中的字符数。\
  \ |\n| `public synchronized void setCharAt(int index, char ch)` | 将指定索引处的字符设置为 `ch`。如果索引为负或大于或等于\
  \ `length()`，则发生 `IndexOutOfBoundsException`。 |\n| `public synchronized StringBuffer\
  \ append(Object)` | `append` 方法将任何其他类型数据的字符串表示连接到调用 `StringBuffer` 对象的末尾。 |\n| `public\
  \ synchronized StringBuffer delete(int start, int end)` | 从 `start` 到 `end-1` 的字符。\
  \ |\n| `public synchronized StringBuffer deleteCharAt(int index)` | 删除指定位置的 `char`。\
  \ |\n| `public synchronized StringBuffer replace(int start, int end, String str)`\
  \ | 将 `start` 到 `end-1` 的字符替换为指定 `String` 中的字符。 |\n| `public synchronized String\
  \ substring(int)` | 返回一个新的 `String`，包含当前包含在此字符序列中的字符子序列。子字符串从指定的 `index` 开始并延伸到此序列的末尾。\
  \ |\n| `public synchronized String substring(int start, int end)` | 返回一个新的 `String`，包含当前包含在此字符序列中的字符子序列。子字符串从指定的\
  \ `start` 开始并延伸到字符 `end-1`。 | |\n| `public synchronized StringBuffer insert(int,\
  \ Object)` | 将一个 `String` 插入另一个 `String` 中。它被重载以接受所有简单类型和 `Objects` 的值。 |\n| `public\
  \ int indexOf(String)` | |\n| `public int indexOf(String, int)` | |\n| `public int\
  \ lastIndexOf(String)` | |\n| `public int lastIndexOf(String, int)` | |\n| `public\
  \ synchronized StringBuffer reverse()` | 反转 `StringBuffer` 的内容。 |\n\n### 示例 1.5:\n\
