  尝试绘制的前台线程与 GUI 线程之间的线程交互是受控且可的。\n\n虚拟机永远不会被绘图任务压垮。\n\n当所有代码都以此方式编写时，对于其他尝试调试代码的程序员来说，就不会有意外情况。\n\
  \n尽管这种方法效果良好，但在某些情况下仍然需要进一步改进：动画。如果我们完全按照描述的方法来操作，可能会注意到动画在运行时会产生令人不快的闪烁。\n\n###\
  \ 平滑动画\n\n重绘机制的默认行为有一个特性我们可能并不总是想要的，即系统在响应我们对 `repaint()` 调用的准备过程中，会清除我们的绘制区域。这会导致动画和其他实时绘制出现不快的闪烁。事实证明，当我们调用\
  \ `repaint()` 时，GUI 线程并没有调用 `paint()`，而是调用 `update()` 方法。`update()` 的默认行为是做两件事：清除背景，然后调用\
  \ `paint`。如下：\n\n```java\npublic void update (Graphics g) {\n    g.clearRect (0,0,width,\
  \ height);\n    paint(g);\n}\n```\n\n我们可能会合理地问为什么 `repaint()` 一开始就清除窗口，如果这会导致闪烁的话。嗯，在很多情况下，绘图是使用在背景上绘制的线条、矩形、圆形等完成的。\n\
  \n如果我们尝试制作一个旋转的棒子，我们需要在绘制新线之前移除旧线。考虑此问题的另一种方式是：如果我们尝试绘制一张新图，应该先擦除旧的。\n\n那么，我们如何安排让新图出现而不必先清除整个显示器呢？我们只需要找到另一种移除旧图的方法。通用的方法是确保我们每次绘制帧时都绘制整个图形——包括背景和前景。如果我们能做到，就不需要清除组件，闪烁就会消失。\n\
  \n为了防止组件在 `paint()` 被调用之前被清除，我们只需要重写 `update()` 方法，使其直接调用 `paint()`，如下：\n\n```java\n\
  public void update (Graphics g) {\n    paint (g);\n}\n```\n\n这是一项标准技术且运行完美，前提是我们的\
  \ `paint()` 方法确实刷新了显示器的所有像素。处理此问题的特别简单的方法是使用离屏图像来存储应该在显示器上显示的绘制内容。\n\n这种技术在速度或内存方面并不总是最高效，但它简单易于实现，且\
  \ Java 程序员通常都能很好理解。\n\n![11](img/image01214.jpeg) ![11](img/image01214.jpeg) ![11](img/image01214.jpeg)\
  \ ![11](img/image01214.jpeg) ![11](img/image01214.jpeg)\n\n![STAR-LOGO-2013](img/image01215.jpeg)\n\
  \n# 第 ∞ 20 章 ∞\n\n## Java.Lang.Object 类\n\n### 简介\n`java.lang` 包中的 `Object` 类是 Java\
  \ 中所有层次结构的根。所有类都直接或间接地继承自 `Object` 类。\n\n即使你写了一个简单的类（即它没有继承任何基类），它也隐式地继承了内置的 `Object`\
  \ 类。因此，该类的特征在所有类中可用。\n\n### Object 类的方法：\nObject 类定义了以下方法，所有类都继承了它们：\n\n1. `public\
  \ int hashCode()`\n2. `public boolean equals(Object obj)`\n3. `public final Class\
  \ getClass()`\n4. `public String toString()`\n5. `protected void finalize() throws\
  \ Throwable`\n6. `protected Object clone() throws CloneNotSupportedException`\n\
  7. `public final void wait(long timeout) throws InterrputedException`\n8. `public\
  \ final void wait(long timeout, int nanos) throws InterrputedException`\n9. `public\
  \ final void wait() throws InterrputedException`\n10. `public final void notify()`\n\
  11. `public final void notifyAll()`\n\n#### 1. `public int hashCode()`\n在哈希表中存储对象时，可以使用此方法获取对象的哈希值。该值在程序执行期间保证是一致的。\n\
  \n#### 2. `boolean equals(Object obj)`\n如果每个对象都被视为唯一的，那么没有必要重写 `Object` 类的 `equals()`\
  \ 方法。该方法比较对象的引用是否相等。\n\n#### 3. `final Class getClass()`\n返回对象的运行时类，该类在运行时由 `java.lang.Class`\
  \ 类的对象表示。\n\n**示例 20.1：** 下例说明了该方法可以用于获取与任何 Java 对象对应的 `Class` 对象。然后我们可以使用 `Class`\
  \ 类的方法通过反射/内省来获取有关对象类的信息。`getMethods()` 和 `getFields()` 将仅显示所有公共成员，而 `getDeclaredMethods()`\
  \ 和 `getDeclaredFields()` 将显示所有成员。\n\n```java\nimport java.lang.reflect.Method;\n\
  import java.lang.reflect.Field;\nclass DispClassMembers1 {\n    public static void\
  \ main(String args[]) {\n        String s = new String(\"Hello\");\n        Class\
  \ c = s.getClass();\n        Method[] m = c.getMethods();\n        System.out.println(\"\
  …… Methods (\" + m.length + \")\");\n        for(int i=0; i < m.length; i++)\n \
  \           System.out.println(m[i]);\n        Field[] f = c.getFields();\n    \
  \    System.out.println(\"…… Fields (\" + f.length + \")\");\n        for(int i=0;\
  \ i< f.length; i++)\n            System.out.println(f[i]);\n        m = c.getDeclaredMethods();\n\
  \        System.out.println(\"……Declared Methods (\" + m.length + \")\");\n    \
  \    for(int i=0; i< m.length; i++)\n            System.out.println(m[i]);\n   \
  \     f = c.getDeclaredFields();\n        System.out.println(\"……Declared Fields\
  \ (\" + f.length + \")\");\n        for(int i=0; i< f.length; i++)\n           \
  \ System.out.println(f[i]);\n    }\n}\n```\n输出:\n……Public Methods (72)……\n\n\n\n\
