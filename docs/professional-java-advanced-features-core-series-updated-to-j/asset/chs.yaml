  \        System.out.println(c1.getItemCount());\n        System.out.println(c1.getItem(0));\n\
  \        c1.insert(\"Brunch\",1);\n        c1.remove(2); // c1.remove(\"Lunch\"\
  );\n    }\n}\n```\n输出: ![](img/image0287.jpeg)\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\nclass CheckboxItem extends Frame implements ItemListener\n\
