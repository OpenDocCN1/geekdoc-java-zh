  for(int i=0; i<4; i++)\n    System.out.println(“tc1.c[”+ i +”]=” + tc1.c[i]);\n\
  tc2 = (TestDeepClone) tc1.clone();\nSystem.out.println(“tc2.a”+tc2.a);\nSystem.out.println(“tc2.b”+tc2.b);\n\
  for(int i=0; i<4; i++)\n    System.out.println(“tc2.c[” + i + “]=” + tc2.c[i]);\n\
  for(int i=0; i<4; i++)\n    tc2.c[i] = i+4;\nfor(int i=0; i<4; i++)\n    System.out.println(“tc2.c[”\
  \ + i + “]=” + tc2.c[i]);\nfor(int i=0; i<4; i++)\n    System.out.println(“tc2.c[”\
  \ + i + “]=” + tc2.c[i]);\nfor(int i=0; i<4; i++)\n    System.out.println(“tc1.c[”\
  \ + i + “]=” + tc1.c[i]);\n```\n\n输出：\n```\ntc1.c[0]=0\ntc1.c[1]=1\ntc1.c[2]=2\n\
  tc1.c[3]=3\ntc2.a=8\ntc2.b=4.5\ntc2.c[0]=0\ntc2.c[1]=1\ntc2.c[2]=2\ntc2.c[3]=3\n\
  tc2.c[0]=4\ntc2.c[1]=5\ntc2.c[2]=6\ntc2.c[3]=7\ntc1.c[0]=0\ntc1.c[1]=1\n```\n\n\
  ### 在多线程环境下有方法\n\n除了上述讨论的方法外，`object` 类通过以下方法为同步代码中的线程通信提供了支持：\n\n8. `final void\
  \ wait(long timeout) throws InterruptedException`\n导致当前线程等待，直到另一个线程对该对象调用 `notify()`\
  \ 或 `notifyAll()` 方法。\n\n9. `final void wait(long timeout, long nanos) throws InterruptedException`\n\
  导致当前线程等待，直到另一个线程对该对象调用 `notify()` 或 `notifyAll()` 方法，或者其他线程中断了当前线程，或者指定的时间已过。\n\n\
  10. `final void notify()`\n唤醒在该对象监视器上等待的一个线程。\n\n11. `final void notifyAll()`\n\
  唤醒所有等待在该对象监视器上的线程。线程通过调用其中一个 `wait` 方法在对象的监视器上等待。线程在持有锁的对象上调用这些方法。线程等待另一个线程的通知。\n\
  \n# 集合框架\n\n### 介绍\n\nJava 集合框架标准化了程序处理对象组的方式。在 Java2 2 之前，Java 提供了诸如 `Vector`、`Stack`、`Dictionary`、`Hashtable`\
  \ 和 `Properties` 等临时类来存储和操作对象组。\n\n尽管这些类非常有用，但它们缺乏一个中央的统一的主题。我们使用 `Vector` 的方式与使用\
  \ `properties` 类的方式不同。而且，之前的临时方法设计并不是为了易于扩展或适应。集合（Collections）是对这些（以及其他）问题的回答。\n\
  \n集合框架的设计考虑了以下目标：\n\n*   框架必须是高性能的。基础集合（动态数组、链表、树和哈希表）的实现是高效高效的。\n*   框架必须允许不同类型的集合以类似的方式工作，并具有高度的互操作性。\n\
  *   易于扩展和/或适应集合。\n\n为了实现上述目标，集合框架设计了以下特性：\n\n*   整个集合框架围绕一组标准接口设计。并提供了这些接口的若干种标准实现。我们也可以实现自己的集合。\n\
  *   集合框架创建的另一个项目是 `Iterator` 接口。`Iterator` 提供了一种通用的、标准化的方式，用于逐个访问集合中的元素。\n*   因此，`Iterator`\
  \ 提供了一种遍历集合内容的方法。由于每个集合都实现了 `Iterator`，因此任何集合类中的元素都可以通过 `Iterator` 定义的方法来访问。这使得只需较小的更改，遍历\
  \ `set` 的代码也可以用于遍历 `list`，例如。\n*   除了集合之外，框架还定义了几个 map 接口和类。Maps 存储键值对（key/value\
  \ pairs）。\n*   重要的一是，尽管集合的引入改变了许多原始类的架构，但并没有导致任何一个类的废弃。\n\n### 集合接口\n\n集合定义了几个接口。具体类仅提供不同的实现。支撑集合的接口是：\n\
  \n*   `Collection`：允许你处理对象组；它位于集合层次结构的顶端。\n*   `List`：扩展了集合以处理序列（对象列表）。\n*   `Set`：扩展了集合以处理包含唯一元素的集合。\n\
  *   `SortedSet`：扩展了集合以处理排序集合。\n\n除了集合接口外，集合还使用了 `Comparator`、`Iterator` 和 `RandomAccess`\
  \ 接口。`Comparator` 定义了如何比较两个对象；`Iterator` 和 `ListIterator` 用于列举集合中的对象。\n\n通过实现 `RandomAccess`，列表表示它支持对其元素进行高效的随机访问。为了在使用时提供最大的灵活性，集合接口允许某些方法是可选的。\n\
  \n可选方法允许你修改集合的内容。支持这些方法的集合被称为可修改的（modifiable）。不允许更改其内容的的集合被称为不可修改的（unmodifiable）。\n\
  \n如果尝试在不可修改的集合上使用这些方法之一，将抛出 `UnsupportedOperationException`。所有内置集合都是可修改的。\n\n\n\n\
  \n它是列表的迭代器，允许程序员以正向或反向遍历列表，在迭代过程中修改列表，并获取迭代器在列表中的当前位置。\n\n### 方法总结\n\n| 方法 | 描述\
  \ |\n| :--- | :--- |\n| `void add(Object obj)` | 将指定的元素插入列表中（可选操作）。 |\n| `boolean\
  \ hasNext()` | 如果在正向遍历列表时，此列表迭代器还有更多元素，则返回 true。 |\n| `boolean hasPrevious()` |\
  \ 如果在反向遍历列表时，此列表迭代器还有更多元素，则返回 true。 |\n| `Object next()` | 返回列表中的下一个元素。 |\n| `int\
  \ nextIndex()` | 返回后续调用 `next` 将返回的元素的索引。 |\n| `Object previous()` | 返回列表中的上一个元素。\
  \ |\n| `int previousIndex()` | 返回后续调用 `previous` 将返回的元素的索引。 |\n| `void remove()`\
  \ | 从列表中移除上一次由 `next` 或 `previous` 返回的元素（可选操作）。 |\n| `void set(Object obj)` | 用指定的元素替换上一次由\
  \ `next` 或 `previous` 返回的元素（可选操作）。 |\n\n### RandomAccess 接口\n\n这是一个标记接口，由 `List`\
  \ 实现类使用，指示它们支持随机访问。`ArrayList` 和 `Vector` 实现了此接口。\n\n### Comparator 接口\n\n比较器用于控制某些数据结构（如\
  \ `TreeSet` 或 `TreeMap`）的顺序。\n\n#### 方法\n\n| 返回值 | 描述 |\n| :--- | :--- |\n| `Int\
  \ compare(Object o1,Object o2)` | 比较两个参数的顺序。 |\n| `Boolean equal(Object obj)` |\
  \ 表示其他某个对象是否“等于”此 `Comparator`。 |\n\n### Collection 接口\n\n集合接口是构建集合框架的基础。它声明了所有集合将拥的核心方法。因为所有集合都实现了\
  \ collection 接口，因此熟悉它的方法对于清晰理解该框架是必要的。其中几个方法可能会抛出 `UnsupportedOperationException`。当一个对象与另一个对象不兼容时（例如尝试向集合添加不兼容的对象时），会产生\
  \ `ClassCastException`。\n\n#### Collection 接口中的方法\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `boolean add(Object obj)` | 确保此集合包含指定的元素（可选操作）。将对象添加到调用的集合中。如果元素 obj 已添加到集合中，则返回\
  \ true。如果元素 obj 已经是集合的成员且集合不允许重复，则返回 false。 |\n| `boolean addAll(Collection c)`\
  \ | 将指定集合中的所有元素添加到此集合中（可选操作）。 |\n| `void clear( )` | 从此集合中移除所有元素（可选操作）。 |\n| `boolean\
  \ contain(Object o)` | 如果此集合包含指定的元素，则返回 true。 |\n| `boolean containAll(Collection\
  \ c)` | 如果此集合包含指定集合中的所有元素，则返回 true。 |\n| `boolean equal(Object o)` | 将指定的对象与此集合进行相等性比较。\
  \ |\n| `int hashCode( )` | 返回此集合的哈希值。 |\n| `boolean isEmpty( )` | 如果此集合不包含任何元素，则返回\
  \ true。 |\n| `Iterator iterator( )` | 返回一个用于遍历集合中元素的迭代器。 |\n| `boolean remove(Object\
  \ o)` | 如果集合中存在指定的元素，则从集合中移除该元素的单个实例（可选操作）。 |\n| `boolean removeAll(Collection c)`\
  \ | 移除所有包含在指定集合中的元素（可选操作）。 |\n| `boolean retainAll(Collection c)` | 保留此集合中包含在指定集合中的元素（可选操作）。\
  \ |\n| `int size( )` | 返回集合中的数量。 |\n| `Object[ ] toArray( )` | 返回一个包含此集合中所有元素的数组。\
  \ |\n\n可以通过调用 `equals()` 方法来比较两个集合的相等性。“相等性”的精确含义可能随集合的不同而异。\n\n例如，你可以实现 `equals()`\
  \ 使其比较集合中存储的元素的值。或者，`equals()` 可以比较这些元素的引用。\n\n### List 接口\n\n列表是一种有序的集合，称为序列。`List`\
  \ 接口扩展了 `Collection` 并声明了存储元素序列的集合的行为。\n\n元素可以通过它们在列表中的位置（使用从 0 开始的索引）进行插入或访问。列表可以包含重复元素。除了\
  \ collection 定义的方法外，`List` 还定义了一些它自己的方法。\n\n#### List 接口中的方法\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `boolean add(Object o)` | 将指定的元素添加到列表的末尾（可选操作）。该方法在 `Collection` 接口中定义，但作为\
  \ `List` 接口的一部分，它应该实现为始终将元素添加到列表末尾。 |\n| `void add(int index, Object element)` |\
  \ 将指定的元素插入列表的指定位置（可选操作）。插入点处或该位置之后的任何现有元素都会后移。因此，没有元素被覆盖。 |\n| `boolean addAll(Collection\
  \ c)` | 将指定集合中的所有元素添加到此列表的末尾，顺序按照指定集合迭代器返回的顺序（可选操作）。该方法在 `Collection` 接口中定义，但作为\
  \ `List` 接口的一部分，它应该实现为始终将元素添加到列表末尾。 |\n| `boolean addAll(int index, Collection c)`\
  \ | 将指定集合中的所有元素插入此列表的指定位置（可选操作）。如果调用的列表发生变化，则返回 true，否则返回 false。 |\n| `boolean addAll(int\
  \ index, Collection c)` | 将指定集合中的所有元素插入此列表的指定位置（可选操作）。如果调用的列表发生变化，则返回 true，否则返回\
  \ false。 |\n| `Object get(int index)` | 返回列表中指定位置的元素。 |\n| `int indexOf(Object o)`\
  \ | 返回指定元素在列表中第一次出现处的索引，如果列表不包含该元素，则返回 -1。 |\n| `int lastIndexOf(Object o)` | 返回指定元素在列表中最后一次出现处的索引，如果列表不包含该元素，则返回\
  \ -1。 |\n| `ListIterator iterator( )` | 返回一个此列表元素的列表迭代器（按正确顺序）。 |\n| `ListIterator\
  \ iterator(int index)` | 返回一个此列表元素的列表迭代器（按正确顺序），从列表的指定位置开始。 |\n| `Object remove(int\
  \ index)` | 移除指定位置的元素（可选操作）并返回被删除的元素。结果列表会压缩。也就是说，后续元素的索引减 1。 |\n| `Object set(int\
  \ index, Object element)` | 用指定的元素替换列表中指定位置的元素（可选操作）。 |\n| `List subList(int fromIndex,\
  \ int toIndex)` | 返回一个包含调用列表从 start 到 end-1 元素的列表。返回列表中的元素也被调用对象所引用。 |\n\n\n\n\n\
  \n`SortedSet` 接口扩展了 `Set`，并声明了按升序排序的集合的行为。\n\n| `Comparator comparator() ` | 返回与此排序集合关联的比较器，如果使用其元素的自然排序，则返回\
  \ null。 |\n| `Object first() ` | 返回此排序集合中的第一个元素。 |\n| `SortedSet headSet(Object\
  \ toElement)` | 返回此排序集合的一个部分视图，其元素严格小于 `toElement`。 |\n| `Object last() ` | 返回此排序集合中的最后一个元素。\
  \ |\n| `SortedSet subSet(Object fromElement, Object toElement)` | 返回此排序集合的一个部分视图，其元素范围从\
  \ `fromElement`（包含）到 `toElement`（不包含）。 |\n| `SortedSet tailSet(Object fromElement)`\
  \ | 返回此排序集合的一个部分视图，其元素大于或等于 `fromElement`。 |\n\n当被调用的集合中不包含任何项时，有几个方法会抛出 `NoSuchElementException`。当对象与集合中的元素不兼容时，会抛出\
  \ `ClassCastException`。如果尝试使用 null 对象且集合中不允许 null，则会抛出 `NullPointerException`。\n\
  \n### 集合类\n\n某些集合类提供了完整的实现，可以直接使用。另一些类是抽象的，提供了骨架实现，作为创建具体集合的起点。\n\n没有任何一个集合类是同步版本。\n\
  \n标准集合类有：\n\n| `AbstractCollection` | 实现了 `Collection` 接口的大部分方法。 |\n| `AbstractList`\
  \ | 扩展 `AbstractCollection` 并实现了 `List` 接口的大部分方法。 |\n| `AbstractSequenceList` |\
  \ 扩展 `AbstractList`，用于对元素使用顺序而非随机访问的集合。 |\n| `AbstractSet` | 扩展 `AbstractCollection`\
  \ 并实现了 `Set` 接口。 |\n| `LinkedList` | 通过扩展 `AbstractSequentialList` 实现链表列表。 |\n|\
  \ `ArrayList` | 通过扩展 `AbstractList` 实现动态数组。它使用对元素的随机访问。 |\n| `HashSet` | 扩展 `AbstractSet`\
  \ 用于哈希表。 |\n| `LinkedHashSet` | 扩展 `HashSet` 以允许按插入顺序进行迭代。 |\n| `TreeSet` | 扩展 `AbstractSet`\
  \ 并实现 `SortedSet` 接口。它使用二叉搜索树按排序存储元素。 |\n\n**注意**：除了集合类外，某些旧类（如 `Vector`、`Stack`、`Hashtable`）已重构以支持集合。\n\
  \n### 通过 Iterator 和 ListIterator 访问集合\n\n通常你需要遍历集合中的元素。目前，最简单的方法是使用迭代器，即实现了 `Iterator`\
  \ 或 `ListIterator` 接口的对象。\n\n`Iterator` 允许你遍历集合以获取或移除元素。`ListIterator` 扩展了 `Iterator`，允许对列表进行双向遍历并对元素进行修改。\n\
  \n在通过迭代器访问集合之前，你必须先获取一个。每个集合类都提供一个 `iterator()` 方法，返回一个指向集合起始位置迭代器。通过使用该迭代器对象，你可以一次访问集合中的每个元素。\n\
  \n对于实现 `List` 的集合，你还可以通过调用 `ListIterator` 获取迭代器。列表迭代器让你能够以正向或反向方向访问集合，并且你可以修改元素。否则，`ListIterator`\
  \ 的用法与 `Iterator` 相同。\n\n### ArrayList 类\n\n`ArrayList` 类扩展了 `AbstractList` 并实现了\
  \ `List` 接口。`ArrayList` 支持可以根据需要增长的动态数组。在 Java 中，标准数组是固定长度的。\n\n数组创建后就不能增长或缩小，这意味着我们必须预先知道数组将包含多少个元素。但有时，我们在运行时之前不知道数组的大小。为了处理这种情况，集合\
  \ 框架定义了 `ArrayList`。\n\n`ArrayList` 是一个对象引用的变长数组，也就是说 `ArrayList` 的大小可以动态增加或减少。数组列表带有初始大小进行创建。\n\
  \n当超过容量时，集合会自动扩大；当移除对象时，数组可能会缩小。使用 J2SE 5 引入的泛型特性，可以限制添加到 `ArrayList` 中的元素类型。\n\n\
  **注意**：旧类 `Vector` 也支持动态数组。\n\n### ArrayList 类的构造函数与方法\n\n| `public ArrayList(int)`\
  \ | 构建一个具有指定初始容量的空列表。当元素被添加到数组列表中时，容量会自动增长。 |\n| `public ArrayList()` ` | 构建一个初始容量为\
  \ 10 的空列表。 |\n| `public ArrayList(Collection)` | 构建一个包含指定集合元素的列表。元素按照集合的 `Iterator`\
  \ 返回的顺序排列。 |\n| `public void trimToSize()` ` | 反之，如果我们想减少 `ArrayList` 对象底层数组的大小，使其恰好等于当前持有的项数，可以调用\
  \ `trimToSize()` 方法。 |\n| `public void ensureCapacity(int)` | 虽然 `ArrayList` 对象的容量在存储对象时会自动增加，但我们可以通过调用\
  \ `ensureCapacity()` 方法手动增加 `ArrayList` 对象的容量。通过在开始时一次增加其容量，可以防止后续多次重新分配。因为重新分配在时间上是昂贵的，防止不必要的重新分配可以提高性能。\
  \ |\n| `public int size() ` | |\n| `public Boolean isEmpty() ` | |\n| `public Object\
  \ clone() ` | |\n| `public Object[] toArray()` ` | 在与 `ArrayList` 工作时，我们有时需要获取一个包含列表内容的实际数组。可以通过调用\
  \ `toArray()` 方法来实现。某些原因导致我们需要将集合转换为数组，例如：<br>* 某些操作处理更快。<br>* 将数组传递给不支持集合的方法。<br>*\
  \ 将我们的集合代码与旧代码集成。 |\n| `public Object[] toArray(Object[])` | |\n| `public Object\
  \ get(int)` | |\n| `public Object set(int index, Object element)` | |\n| `public\
  \ boolean add(Object o)` | |\n| `public void add(int index, Object o)` | |\n| `public\
  \ Object remove(int index)` | |\n| `public boolean remove(Object o)` | |\n| `public\
  \ void clear()` ` | |\n| `public boolean addAll(Collection c)` | |\n| `public boolean\
  \ addAll(int index, Collection c c)` | |\n| `public boolean contains(Object o)`\
  \ | |\n| `public int indexOf(Object o)` | |\n| `public int lastIndexOf(Object o)`\
  \ | |\n\n#### 示例 1\n\n```java\nimport java.util.*;\nclass ArrayListTest {\n    public\
  \ static void main(String args[]) {\n        ArrayList a1 = new ArrayList();//存储不同类型的对象，容量为\
  \ 10\n        System.out.println(\"a1 的初始大小：\"+ a1.size());\n        a1.add(\"A\"\
  );\n        a1.add(\"C\");\n        a1.add(new Integer(56));\n        a1.add(\"\
