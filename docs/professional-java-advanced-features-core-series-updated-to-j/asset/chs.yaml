  \ Integer iObj=new Integer(str);\n        System.out.println(iObj);\n        Long\
  \ lObj=new Long(str);\n        System.out.println(lObj);\n        Float fObj=new\
  \ Float(str2);\n        System.out.println(fObj);\n        Double dObj=new Double(str);\n\
