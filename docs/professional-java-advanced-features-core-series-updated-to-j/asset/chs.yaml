  \n# 第 17 章\n## (抽象窗口工具包 - AWT)\n\n### 简介\nJava 提供了大量的内置类，帮助我们设计图形用户界面（GUI）。这些类中的大部分属于\
  \ `java.awt` 包，统称为抽象窗口工具包（Abstract Windows Toolkit，AWT）。\n\n我们熟悉 `MS-WORD`、`MS-EXCEL`\
  \ 等软件。这些软件都具有 GUI，即当我们运行这些软件时，可以看到图形用户界面。\n\n我们通过键盘或鼠标选择不同的选项来访问这些软件的各种功能。显示用户界面需要大量的编程工作。\n\
  \nAWT 中有助于设计图形界面的三个重要部分是：\n* 组件 (Components)\n* 容器 (Containers)\n* 布局管理器 (Layout\
  \ Managers)\n\n上述所有内容在设计 GUI 时都起着至关的作用。\n\n### 组件\n组件是 Java 创建 GUI 的构建块。组件是具有图形表示的对象，可以显示在屏幕上并与用户交互。组件的示例包括典型图形用户界面中的按钮、复选框和滚动条。`java.awt.Component`\
  \ 类是非菜单相关 AWT 组件的抽象父类。`Component` 类也可以直接扩展以创建轻量级组件。轻量级组件是不与原生不透明窗口相关的组件。\n\n某些组件类型（如按钮和滚动条）直接用于\
  \ GUI 控制。其他类型的组件（继承自 `Container` 类的）提供了特殊的组织方式。而 `TextField`、`TextArea`、`List` 等组件用于接受用户输入。`label`\
  \ 是另一种类型的组件，其目的是简单显示合适的标签以识别其他组件。\n\nJava 的组件通过 `java.awt.Component` 和 `java.awt.Menu`\
  \ 组件父类的许多子类来实现。\n\n组织这些大量类的一种方法是将它们分为以下几类：\n* 视觉组件\n* 容器组件\n* 菜单组件\n\n**组件层次结构：**\
  \ 下图显示了 AWT 的组件层次结构。\n![](img/image01269.jpeg)\n\n### 容器\n下图描述了容器层次结构\n![](img/image01270.jpeg)\n\
  \n所有基于窗口的应用程序都从屏幕可见的顶级窗口开始。同样，所有基于 GUI 的 Java 应用程序也从顶级窗口开始，在 Java 术语中被称为顶层容器（top-level\
  \ container）。\n\n容器也是可以包含其他组件的 Java 组件。组件只有通过将其添加到容器或将其放入容器内部，才能变得可见。\n\n所有的 Java\
  \ GUI 都存在于 `applet` 或 `Frame` 中。`applets` 和 `frames` 是 Java 中的两个顶层容器。\n\n\n\n\n\n\
  在 Java 中，可以使用绝对定位，但并不建议这样做。`AWT` 设计为使用相对定位。我们可以通过相对规范来指定组件布局，例如：组件将添加到上一个组件的右侧、组件将添加到其他组件的下方、组件将出现在顶部、组件的大小将是容器宽度的\
  \ 1/4 等等。即使在不知道组件尺寸的情况下，这些规范也非常有用。\n\nJava 鼓励相对定位，因为它是平台无关的，相同的 GUI 应该可以在不经修改的情况下在各种平台上运行。\n\
  \n称为布局管理器（layout managers）的内置 Java 类负责将相对位置映射到实际/物理位置的任务。Java 支持许多类型的布局管理器，我们将讨论以下布局管理器：\n\
  \n1. `FlowLayout`（流布局）\n2. `GridLayout`（网格布局）\n3. `BorderLayout`（边界布局）\n4. `CardLayout`（卡片布局）\n\
  \n### 使用布局管理器工作时的两个观察：\n\n- 我们不需要承担指定每个组件精确位置和尺寸的负担。\n- 我们不再拥有指定每个组件精确位置和尺寸的权力。\n\
  \n### 为什么 Java 使用布局管理器？\n\n原因有两个：\n\n1. 理论上在于，精确布局（即以像素指定每个组件的尺寸和位置）是一项重复且经常的任务；因此，根据面向对象编程（OOP），布局功能应该被封装在一个或多个类中以自动化该任务。显然，布局管理器消除了大量的开发繁琐工作。许多程序员起初不喜欢布局管理器，但随着繁琐选择的消除，他们变得越来越欣赏它们。\n\
  \n2. 使用布局管理器的实际原因源于 Java 的平台无关性。在 Java 中，`AWT` 组件的行为借自运行 `JVM` 的底层硬件的窗口系统。因此，在 Macintosh\
  \ 上，`AWT` 按钮就像任何其他 Mac 按钮；在 Motif 平台上，Java 按钮看起来就像任何其他 Motif 按钮，以此此类推。这里的问题是，按钮和其他组件在不同平台上实例化时，其尺寸是不同的。如果\
  \ Java 鼓励精确的像素级尺寸和定位，那么会有很多 Java GUI 在其源平台上看起来精美，但在其他平台上看起来很糟糕甚至无法使用。\n\n如上所述，布局管理器通过使用相对定位解决了这个问题。\n\
  \n### 布局策略：\n\n每个 Java 组件都有一个首选尺寸（preferred size）。首选尺寸表示在不与布局管理器冲突的情况下，组件希望有多大。首选尺寸通常是为以视觉上有意义的方式渲染组件所需的最小尺寸，例如，一个按钮的首选尺寸是其标签文本的大小，加上文本周围的一小圈空白边框，再加上标记按钮边界的阴影装饰，因此按钮的首选尺寸是“恰好足够”。首选尺寸是取决于平台的，因为组件的边界装饰随系统而异。\n\
  \n当布局管理器对其容器的子组件进行布局时，它必须平衡两项考量：\n(i) 布局策略和\n(ii) 每个组件的首选尺寸\n\n首要任务是强制执行布局策略。如果尊重组件的首选尺寸意味着违反布局策略，那么布局管理器将覆盖组件的首选尺寸。理解布局管理器意味着理解它将把组件放在哪里，以及它将如何处理组件的首选尺寸。\n\
  \n### 1. FlowLayout（流布局）：\n\n流布局管理器的功能封装在 `java.awt.FlowLayout` 类中。\n\n流布局管理器将组件排列成水平行。它是面板（panel）和应用小程序（applet）的默认布局管理器类型。\n\
  \n流布局管理器尽可能将多个组件放入第一行，并将其他组件移动到第二行。如果第二行没有空间，组件将移动到第三行，以此此类推。这与在文档中输入文本非常相似。\n\n\
  当我们到达当前行的末尾时，下一个单词将移动到下一行，以此此类推。如果我们更改了文档的宽度或高度，整个文档将重新进行格式化。\n\n组件始终从左到右，按照它们被添加到容器的顺序出现。\n\
  \n默认情况下，流布局管理器在组件之间的水平和垂直方向上都会留有五个像素的间隙。这种默认值可以通过调用 `FlowLayout` 构造函数的重载版本并传入所需的水平和垂直间隙来更改。\n\
  \n在每一行中，组件是等距分布的，组件簇是居中的。组件簇的对齐方式（有时称为“对齐”）可以通过向流布局构造函数传递参数来控制。可能的值有：\n\n- `FlowLayout.LEFT`\n\
  - `FlowLayout.CENTER`\n- `FlowLayout.RIGHT`\n\n#### 示例 17.1:\n\n```java\nimport\
  \ java.awt.*;\n\nclass MyFrame1 {\n    public static void main(String args[ ) {\n\
  \        Frame f=new Frame( );\n        FlowLayout flow=new FlowLayout();\n    \
  \    f.setLayout(flow);\n        Label l1 = new Label(\"Name \");\n        f.add(l1);\n\
  \        TextField tf1=new TextField(\"Matrix\");\n        f.add(tf1);\n       \
  \ tf1.setBackground(Color.green);\n        tf1.setForeground(Color.red);\n     \
  \   Button b1 = new Button(\"ok\");\n        Font f1 = new Font(\"Arial\", Font.BOLD,\
  \ 24);\n        b1.setFont(f1);\n        f.add(b1);\n        f.setSize(500,100);\n\
  \        f.setVisible(true);\n    }\n}\n```\n*注意：如果我们减小了上述窗口的大小且三个组件无法放入单行内，那么组件将从最后一个组件开始移动到下一行。*\n\
