  \ 示例 18.20 代码：\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass Circle1\
  \ extends Frame implements MouseListener,Runnable\n{\n    int x,y,w,h;\n    static\
  \ Circle1 f;\n    public void run()\n    {\n        y=0;\n        w=0;\n       \
  \ h=0;\n        for(x=0;x<50 ;x+=1)\n        {\n            try {\n            \
  \    Thread.sleep(500);\n            } catch (InterruptedException e) {\n      \
  \          System.out.println(e);\n            }\n            repaint();\n     \
  \   }\n    }\n    public static void main(String args[])\n    {\n        f = new\
  \ Circle1();\n        Thread t=new Thread(f);\n        t.start();\n        f.addMouseListener(f);\n\
  \        f.setSize(50,50);\n        f.setVisible(true);\n    }\n    public void\
  \ paint(Graphics g)\n    {\n        g.setColor(Color.RED);\n        g.drawOval(x,y,w,h);\n\
  \        g.setColor(Color.BLUE);\n        g.fillOval(x+1,y+1,w-1,h-1);\n    }\n\
  \    public void mousePressed(MouseEvent me)\n    {\n        x = me.getX();\n  \
  \      y = me.getY();\n        w=50;\n        h=50;\n        Graphics g=f.getGraphics();\n\
  \        g.clearRect(0,0,200,200);\n}\n```\n\n许多类型的 AWT 组件的外观由窗口系统决定。其他组件类型（特别是\
  \ applet、frame 和画布）没有内在的外观。如果我们不仅仅将这些类用作容器使用其中任何一类，并希望我们的组件看起来有用，那么我们必须提供提供实现组件外观的代码。\n\
  \n每个组件都关联着一个图形上下文（graphics context）。该图形上下文与组件相关的帧缓冲区相对应。\n\n我们可以使用图形上下文支持的方法在组件上进行图。绘制在图形上下文上的任何内容都会显示在组件上。\n\
  \n在任何组件上绘图的正确方法是重写它的 `paint()` 方法并提供适当的代码。`paint()` 方法有一个类型为 `Graphics` 的参数，代表组件的图形上下文。也可以在不使用\
  \ `paint()` 方法的情况下在组件上进行绘图，尽管这种方法并不推荐。\n\n# 第 19 章\n## AWT 中的绘图\n\n### 绪言\n\n许多类型的\
  \ AWT 组件（例如按钮和滚动条）的外观由窗口系统决定。其他组件类型（特别是 applet、frame 和画布）没有内在的外观。如果我们不仅仅将这些类用作容器使用其中任何一类，并希望我们的组件看起来有用，那么我们必须提供实现组件外观的代码。\n\
  \n每个组件都关联着一个图形上下文。该图形上下文与组件相关的帧缓冲区相对应。\n\n我们可以使用图形上下文支持的方法在组件上进行图。绘制在图形上下文上的任何内容都会显示在组件上。\n\
  \n在任何组件上绘图的正确方法是重写它的 `paint()` 方法并提供适当的代码。`paint()` 方法有一个类型为 `Graphics` 的参数，代表组件的图形上下文。也可以在不使用\
  \ `paint()` 方法的情况下在组件上进行绘图，尽管这种方法并不推荐。\n\n\n\n\n\n这四个组件类是：\n\n* `Applet`\n* `Canvas`\n\
  * `Frame`\n* `Panel`\n\n### 示例 19.1 扩展 `Frame` 类并重写了 `paint()` 方法以改变框架的外观。\n\n```java\n\
  import java.awt.*;\n\npublic class SimplePaint extends Frame {\n    public static\
  \ void main (String args[]) {\n        Frame f=new SimplePaint();\n        f.setSize(200,200);\n\
  \        f.setVisible(true);\n    }\n    public void paint (Graphics g) {\n    \
  \    g.setColor(Color.white);\n        g.fillRect(0,0,300,300);\n        g.setColor(Color.grey);\n\
  \        g.fillOval(30,30,50,50);\n    }\n}\n```\n\n输出：\n![](img/image0295.jpeg)\n\
  \n当我们对组件类进行子类化并赋予子类自己的 `paint()` 方法时，环境会在适当的时间调用该方法，并传入合适的 `Graphics` 实例。\n\n###\
  \ graphics 类支持的操作\n\n`graphics`（图形上下文）提供的四大类操作是：\n\n* 选择颜色。\n* 选择字体。\n* 绘制和填充。\n\
  * 裁剪（Clipping）。\n\n#### 选择颜色\n\n通过调用 `setColor()` 方法选择颜色。所需的参数是 `color` 类的实例。有 13\
  \ 种预定义的颜色，可以通过 `color` 类的 `static final` 变量访问。（这些变量本身就是 `color` 类的实例。这让某些人感到不安，但\
  \ Java 处理这些事情没有问题）。预定义的颜色有：\n\n1. `Color.black`\n2. `Color.blue`\n3. `Color.cyan`\n\
  4. `Color.darkGray`\n5. `Color.gray`\n6. `Color.green`\n7. `Color.lightGray`\n8.\
  \ `Color.magenta`\n9. `Color.orange`\n10. `Color.pink`\n11. `Color.red`\n12. `Color.white`\n\
  13. `Color.yellow`\n\n如果我们需要一个不在列表中的颜色，可以自己构造。`color` 构造函数有几个版本，最简单的是：`Color(int\
  \ redLevel, int greenLevel, int blueLevel)`。这三个参数是主色在 0 到 255 范围内的强度级。颜色是加色的，这意味着它们像光一样混合，而不是像颜料。\n\
  \n* `new Color(0,0,0)` 黑色（无光）\n* `new Color(255,0,0)` 红色（仅包含红色色调）\n* `new Color(255,255,255)`\
  \ 白色（所有颜色同时亮）\n\n下方的代码片段列出了 `paint()` 方法的第一部分，它将其图形上下文的颜色设置为浅色：\n\n```java\npublic\
  \ void paint(Graphics g) {\n    Color c= new Color(170,255,170);\n    g.setColor(c);\n\
  }\n```\n在调用上述代码中的 `setColor()` 后，所有的图形都将绘制成浅绿色，直到下一次调用 `setColor()` 为止。调用 `setColor()`\
  \ 不改变已经绘制的图形的颜色；它只影响后续操作。\n\n#### 选择字体\n\n设置图形上下文的字体就像设置后续绘制操作将使用的新字体，而之前绘制的图形不受影响。在设置字体之前，我们必须先创建一个。字体的构造函数看起来如下：`Font(string\
  \ fontName, int style, int size)`。第一个参数是字体名称。字体的可用性取决于平台。我们可以通过像这样调用工具包上的 `getFontList()`\
  \ 来获取可用字体名称列表，返回为字符串数组：`String fontNames[]= Toolkit.getDefaultToolkit().getFontList()`\n\
  \n有三个与平台无关且我们鼓励使用的字体名称，分别为：“Serif”、“Sansserif”, “Monospaced”。`style` 参数可以传递给以下任何一个\
  \ `int` 常量：\n\n1. `Font.PLAIN`\n2. `Font.BOLD`\n3. `Font.ITALIC`\n\n下方的代码片段将图形上下文的字体设置为\
  \ 24 点加粗衬线字体：\n\n```java\nFont f =new Font(\"Sansserif\",Font.BOLD,24);\ngc.setFont(f);\n\
  ```\n我们可以指定样式的组合，例如加粗斜体字体，通过这样传递样式的和来实现：`Font.BOLD + Font.ITALIC`。\n\n#### 绘制和填充\n\
  \n`graphics` 类的所有渲染方法都为它们渲染的形状指定了坐标位置。每个组件都有自己的空间，原点位于组件的左上角，x 轴向右增加，y 轴向下增加。下图显示了坐标系：\n\
  \n![](img/image0296.jpeg)\n\n图形上下文类没有广泛的绘制方法。（复杂的渲染由扩展的 API 如 `2d`、`3d` 和动画处理）。图形类中我们需要了解的方法有：\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `void drawLine(int x1,int y1, int x2, int y2)`\
  \ | 在此图形上下文坐标系，使用当前颜色在点 `(x1,y1)` 和 `(x2, y2)` 之间绘制一条线。 |\n| `void drawRect(int\
  \ x, int y, int width, int height)` | 绘制指定矩形的轮廓。 |\n| `void fillRect(int x, int\
  \ y, int width, int height)` | 填充指定的矩形。 |\n| `void drawOval(int x, int y, int width,\
  \ int height)` | 绘制由指定矩形边界的椭圆轮廓。 |\n| `void fillOval(int x,int y, int width, int\
  \ height)` | 用当前颜色填充由指定矩形边界的椭圆。椭圆由矩形边界框指定。椭圆位于边界框内，并如下所示与框的每个边的中点相切：要绘制圆形，请使用正方形边界框。注意绘制只绘制前景像素，不绘制背景，因此边界框内但椭圆外的空间保持不变。这里\
  \ `x` 和 `y` 是边界框左上角的坐标，`width` 和 `height` 是框的宽度和高度。 |\n| `void drawArc(int x, int\
  \ y, int width, int height, int startAngle, int arcAngle)` | 绘制覆盖指定矩形的圆形或椭圆弧的轮廓。\
  \ |\n| `void fillArc(int x, int y, int width, int height, int startangle, int arcangle)`\
  \ | 填充指定矩形的圆形或椭圆弧。弧是椭圆的一部分。指定弧，我们首先指定椭圆的边界框，就像使用 `drawOval()` 和 `fillOval()` 那样。我们还需要指定弧的起点和终点，通过指定起始角度和弧扫过的角度来实现。填充弧是由弧本身以及从椭圆中心到弧端点的两个半径围成的区域。\
  \ |\n| `void drawPolygon(int[]xPoints, int[]yPoints int nPoints)` | 绘制由 x y 坐标数组定义的闭合多形。\
  \ |\n| `void fillPolygon (int[] xPoints , int[] yPoints, int nPoints)` | 填充由 x y\
  \ 坐标数组定义的闭合多形。多形是具有任意数量顶点的闭合图形。顶点通过两个 int 数组传递给 `drawPolygon()` 和 `fillPolygon()`\
  \ 方法。第一个数组包含顶点的 x 坐标，第二个数组包含 y 坐标。第三个参数指定顶点数量。注意：终点会与第一个点连接。 |\n| `void drawPolyLine(int[]\
  \ xPoints, int[] yPoints , int nPoints)` | 绘制由 x y 坐标数组定义的连接线序列。折线与多形相似，但它是开放的而不是闭合的。最后一个顶点和第一个顶点之间没有线段连接。\
  \ |\n\n\n\n\n\n## 图形方法\n\n| `void drawString(String str, int x, int y)` | 使用当前图形上下文的字体和颜色绘制指定字符串的文本。`x`、`y`\
  \ 参数指定字符串基线的左边缘。带有下伸部部的字符（在大多数字体中为 g, j, p, q 和 y）会延伸到基线以下。文本坐标是相对于基线的，这一点非常重要。例如，在一段简单的文本中，我们可能会尝试在\
  \ `(0,0)` 处绘制字符串，期望它出现在区域的左上角。然而，由于基线的存在，我们只能看到字符串的下延伸部，这可能意味着我们什么也看不见。默认情况下，图形上下文使用关联组件的字体；但我们可以通过调用图形上下文的\
  \ `setFont()` 方法设置不同的字体。 |\n| `boolean drawImage(Image img, int x, int y, ImageObserver\
  \ observer)` | 绘制当前可用的尽可能指定的图像。这里，`img` 是要渲染的图像，`x` 和 `y` 是目标组件内图像左上角的坐标。图像观察者必须是一个实现了\
  \ `ImageObserver` 接口的对象。图像是矩形像素值集合的离屏表示。Java 的图像支持非常复杂。现在，假设我们通过某种方式获取了图像（即 `java.awt.Image`\
  \ 类的实例），并想要使用特定的图形上下文将其渲染到屏幕上。实现的方法是调用图形上下文的 `drawImage()` 方法。 |\n\n### 示例 19.2\n\
  \n此示例说明了如何创建一个图像并使用其图形上下文在其上绘制。然后可以使用 `drawImage()` 方法在 applet 窗口中显示图像。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n/*<applet code=\"\
  PaintImage\" width=200 height=100></applet>*/\npublic class PaintImage extends Applet\
  \ {\n    private Image im;\n    public void init() {\n        im = createImage(100,50);\n\
  \        Graphics imgc=im.getGraphics();\n        imgc.setColor(Color.gray);\n \
  \       imgc.fillRect(0,0,100,50);\n        imgc.setColor(Color.black);\n      \
  \  imgc.fillOval(0,0,5,0);\n    }\n    public void paint(Graphics g) {\n       \
  \ g.drawImage(im,10,10,this);\n    }\n}\n```\n输出：(Images/image0297.jpeg)\n\n###\
  \ 示例 19.3\n\n此示例说明了如何从现有图像创建图像对象。然后可以使用 `drawImage()` 方法在 applet 窗口中显示图像。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.*;\n/*\n<applet code=\"\
  PaintImage\" width=500 height=500>\n</applet>\n*/\npublic class PaintImage extends\
  \ Applet {\n    private Image im;\n    public void init() {\n        try {\n   \
  \         im=getImage(new URL(\"file:///c:/matrix/logo.gif\"));\n            //im=getImage(new\
  \ URL(\"http://127.0.0.1/logo.gif\"));\n        } catch (MalformedURLException e)\
  \ {\n            System.out.println(e);\n        }\n    }\n    public void paint(Graphics\
  \ g) {\n        g.drawImage(im,10,10,this);\n    }\n}\n```\n\n### 裁剪 (Clipping)\n\
  \n程序员对图形上下文进行的大多数调用涉及颜色选择或绘制和填充。一种不常见的操作是裁剪。裁剪简单就是限制图形上下文可以修改的区域。\n\n每个图形上下文，即每个\
  \ `Graphics` 类的实例都有一个裁剪区域，该区域定义了关联组件的所有或部分。当我们调用图形类的其中一个 `drawXXX()` 或 `fillXXX()`\
  \ 方法时，只有位于图形上下文裁剪区域内的像素会被修改。\n\n图形上下文的默认裁剪区域是关联组件的整个可见区域。有方法可以获取和修改裁剪区域。考虑下面的 `paint`\
  \ 方法。\n\n### 示例 19.4\n\n```java\nimport java.awt.*;\nclass Clip extends Frame {\n\
  \    public static void main(String args[]) {\n        Frame f=new Clip();\n   \
  \     f.setSize(300,330);\n        f.setVisible(true);\n    }\n    public void paint(Graphics\
  \ g) {\n        for(int i=0; i<300; i=i+100) {\n            for(int j=30; j<330;\
  \ j=j+100) {\n                g.fillOval(i,j,100,100);\n            }\n        }\n\
  \    }\n}\n```\n输出：(Images/image0299.jpeg) 上述 `paint()` 方法绘制了一个点状图案。考虑当这是一个 200*200\
  \ 像素的 applet frame 的 `paint()` 方法时会发生什么。由于计数器一直到 500，该方法尝试在 applet frame 的边界之外绘制。这不是一个问题，因为图形上下文默认的裁剪区域与\
  \ applet 自身重合。\n\n要为图形上下文设置矩形裁剪区域，我们可以调用 `setClip(x,y, width, height)` 方法，传入描述所需矩形位置和大小的四个整数。例如，上面的代码可以修改如下：\n\
  \n### 示例 19.5\n\n```java\nimport java.awt.*;\nclass Clip2 extends Frame {\n    public\
  \ static void main(String args[]) {\n        Frame f=new Clip2();\n        f.setSize(300,330);\n\
  \        f.setVisible(true);\n    }\n    public void paint(Graphics g) {\n     \
  \   g.setClip(50,80,200,200);\n        for(int i=0; i<300; i=i+100) {\n        \
  \    for(int j=30; j<330; j=j+100) {\n                g.fillOval(i,j,100,100);\n\
  \            }\n        }\n        g.drawString (\"Hello! Kamal\", 50,50);\n   \
  \     g.drawString (\"Bye! Kamal\", 120,150);\n    }\n}\n```\n\n\n\n\n\n22. } }\n\
  \n输出：\n\n![](img/image01300.jpeg)\n\n如上所示，现在绘画被裁剪到 300 * 300 Applet 框架中心的一个 200\
  \ * 200 矩形内。\n\n裁剪（Clipping）本身是一项值得了解的知识。当环境需要修复组件的暴露部分时，裁剪也会派上用。\n\n### 关于 `paint()`\
  \ 方法和图形上下文的总结\n\n`Graphics` 上下文专门供单个组件使用。要在组件上进行绘制，我们调用图形上下文的 `drawXXXX()` 和 `fillXXXX()`\
  \ 方法。要更改图形操作的颜色或字体，分别调用图形上下文的 `setColor()` 或 `setFont()` 方法。\n\n### GUI 线程与绘画\n\n\
  Java 运行时环境会创建并控制其在后台运行的各个线程，其中一个线程负责 GUI 管理。\n\nGUI 线程是环境用于接收用户输入事件以及调用需要绘制的组件的\
  \ `paint()` 方法的工具。\n\n对 `paint()` 的调用并非都由环境生成。当然，Java 程序可以自己进行调用，可以直接直接调用，也可以通过\
  \ `repaint()` 方法间接调用。\n\n也可以使用其图形上下文在组件上进行绘制。在这种方法下，无需调用 `paint()` 或 `repaint()`\
  \ 方法。\n\n在组件上绘制的不同方法如下：\n\n(i) 在获取组件的 `Graphics` 上下文后直接绘制。\n\n(ii) 自发绘画（由 GUI 线程隐式/自动调用\
  \ `paint()` 方法）。\n\n(iii) 显式调用 `paint()` 方法。\n\n(iv) 显式调用 `repaint()` 方法，随后间接调用\
  \ `paint()` 方法。\n\n### 在获取组件图形上下文后直接绘制\n\n由于可以使用 `getGraphics()` 方法获取组件 `Graphics`\
  \ 上下文的引用，人们很容易认为可以从任何方便的方法直接在组件上绘制。通常，这种方法有严重的缺陷。\n\n假设我们有一个 Applet，想要在最近鼠标点击的位置画一个红点。Applet\
  \ 的其余部分应为黄色。假设该 Applet 正在处理自己的鼠标事件。我们可能会考虑创建这样的事件处理器：\n\n**示例 19.6：**\n\n```java\n\
  1. import java.awt.*;\n2. import java.awt.event.*;\n3. class PaintApproach extends\
  \ Frame implements MouseListener\n4. {\n5. public static void main (String args\
  \ [])\n6. {\n7. PaintApproach f = new PaintApproach();\n8. f.setSize(300,300);\n\
  9. f.addMouseListener(f);\n10. f.setVisible(true);\n11. }\n12. public void mouseEntered(MouseEvent\
  \ e) { }\n13. public void mouseExited(MouseEvent e) { }\n14. public void mousePressed(MouseEvent\
  \ e) { }\n15. public void mouseReleased(MouseEvent e) { }\n16. public void mouseClicked(MouseEvent\
  \ e) {\n17. \n18. System.out.println(\"Clicked...\");\n19. Graphics g = getGraphics();\n\
  20. g.setColor(Color.yellow);\n21. g.fillRect(0,0, getSize().width, getSize().height);\n\
  22. g.setColor(Color.Red);\n23. g.fillOval(e.getX()-10, e.getY()-10,20,20);\n24.\
  \ }\n```\n\n\n\n\n\n```java\npublic class PaintApproach1 extends Frame implements\
  \ MouseListener {\n    int mouseX, mouseY;\n\n    public static void main(String\
  \ arg[]) {\n        PaintApproach1 f = new PaintApproach2();\n        f.setSize(300,\
