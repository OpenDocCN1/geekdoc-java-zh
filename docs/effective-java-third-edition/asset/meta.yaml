- - '##'
  - 序列化
- - '###'
  - 事项 86:极其谨慎地实现 `Serializable`
- - '##'
  - 实现 `Serializable` 的第三个代价是增加了发布负担。当序列化类被修改时，检查是否在新版本中序列化并在旧版本中反序列化（反之然）是非常重要的。因此，所需的测试量与序列化的数量和发布次数乘积，这可能会很大。当你设计一个类时，都要权衡成本与收益。从历史上看，像
    `BigInteger` 和 `Instant` 这样的类实现了 `Serializable`，集合类也是如此。代表实体的类（如线程池）很少实现 `Serializable`。
- - '###'
  - Item 87：考虑使用自定义序列化
- - '##'
  - 在考虑是否合适之前，不要接受默认序列化。接受默认序列化应该是一个有意识的决定，从灵活性、性能和正确性的角度来看这种编码是合理的。通常情况下，只有当默认序列化与在你设计自定义序列化时选择的编码同时，你才接受默认序列化。
- - '##'
  - 如果一个对象的物理表示与其逻辑相同，那么默认序列化可能是合适的。例如，对于下面简单表示人姓名的类，默认序列化将是合理的：
- - '##'
  - 即使你决定默认序列化是合适的，你也必须提供一个 `readObject` 方法来确保不变性和安全性。在 `Name` 的情况下，`readObject` 方法必须确保
    `lastName` 和 `firstName` 字段不为空。这个问题在 Item 88 和 90 中进行了详细讨论。
