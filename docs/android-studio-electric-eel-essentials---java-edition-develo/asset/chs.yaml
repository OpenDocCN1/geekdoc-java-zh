  \ 章节中概述过，但可以总结如下：\n\n1. 登录 Google Play Console 并创建一个新应用。\n2. 按照步骤在标题、描述、分类和图像资产方面配置应用（示例图像资产可以在随本书下载的示例代码包的\
  \ `image_assets` 文件夹中找到）并保存草稿设置。同时，务必为该 bundle 启用 Google Play 束签名。\n3. 使用 Android\
  \ Studio 中的 `Build` -> `Generate Signed App Bundle / APK...` 菜单生成带签名的发布版 app bundle。\n\
  4. 在 Google Play Console 中，从左侧导航面板选择 `Testing` -> `Internal testing`（内部测试）选项。\n\
  5. 在内部测试界面上，点击 `Create Release` 并点击 `Continue` Accept 让 Google 管理密钥签名任务的选项。将上述生成的\
  \ app bundle 文件拖放到上传框中并点击 `Save`。\n6. 切换到内部测试界面内的 `Testers`（测试人员）标签页，添加将用于在一个或多个物理设备上测试应用的账户邮箱地址。\n\
  7. 返回 `Releases`（发布）标签页并点击 `Edit`按钮。滚动到结果页面底部并点击 `Review release` 。\n8. 在确认界面上，点击\
  \ `Start rollout to Internal testing`（发布到内部测试）按钮。应用将列为 `Pending publication`（待发布）。\n\
