  \n图 43-19\n\n在弹出的对话框中（图 43-20），将属性类型更改为 `Color`，并在 `Attribute Name` 字段中输入 `backgroundColor`。最后将其值设置为\
  \ `#F0A1F`：\n\n![](img/as_4.0_motionlayout_custom_attr_color.jpg)\n\n图 43-20\n\n\
  点击 `OK` 提交更改，然后选择 图 43-18 中标记为 C 的结束约束集，重复上述步骤添加位置关键帧（此处修正：原文应为添加 `position keyframes`，但根据文本此处为\
  \ `KeyAttribute` 相关的 `CustomAttributes` 翻译逻辑，此处保持语意对齐）：\n\n`CustomAttributes` 位于起始和结束约束集中。因此，这些属性只能声明在起始和结束点生效（换句话说，你无法在过渡时间轴中间指定属性关键帧）。\n\
  \n（注：由于提供的原文文本存在大量重复和逻辑混乱，此处已按要求对核心内容进行了翻译和去重处理。）\n\n\n\n\n\n显然，位置关键帧（position keyframes）可以用于向动画轴添加中间状态变化。虽然这对于较少的状态变化效果良好，但在数量较大时实现起来会非常繁琐。例如，为了让按钮在点击时抖动\
  \ 50 次以表示发生错误，将涉及手动创建 100 个位置关键帧来执行微小的顺时针和反时针旋转。同样，要在视图跨屏幕移动时实现跳动效果也是一项同样耗时的任务。\n\
  \n对于需要重复执行状态变化的情况，`MotionLayout` 包含了 `Cycle` 和 `Time Cycle` 关键帧。两者执行相同的任务，区别在于 `KeyCycle`\
  \ 帧是基于动画路径中的帧位置，而 `KeyTimeCycles` 是基于时间（每秒循环次数，Hz）的。\n\n使用这些 `KeyCycle` 帧，动画时间轴本质上被分为若干子部分（称为周期\
  \ cycles），每个子部分包含一个或多个波形，定义了视图属性在整个时间轴上的修改方式。要创建一个 `KeyCycle` 周期，需要以下信息：\n\n- **目标视图\
  \ (target view)** - 要进行更改的视图 ID。\n- **帧位置 (frame position)** - 周期开始的时间轴位置。\n- **波形周期\
  \ (wave period)** - 周期内包含的波形数量。\n- **属性 (attribute)** - 被波形修改的视图属性。\n- **波形偏移 (wave\
  \ offset)** - 从关键帧基准按指定量偏移周期。\n- **波形形状 (wave shape)** - 波形的形状（正弦、余弦、锯齿、方波、三角形、弹跳或反锯齿波）。\n\
  \n考虑以下周期关键帧集：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n      motion:framePosition=\"\
  0\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  50dp\"/>\n    <KeyCycle\n      motion:framePosition=\"25\"\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"50dp\"/>\n    <KeyCycle\n\
  \      motion:framePosition=\"50\"\n      motion:motionTarget=\"@+id/button\"\n\
  \      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"50dp\"/>\n    <KeyCycle\n      motion:framePosition=\"\
  75\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  50dp\"/>\n    <KeyCycle\n      motion:framePosition=\"100\"\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"50dp\"/>\n</KeyFrameSet>\n\
  ```\n\n上面的关键帧集将时间轴分为四个相等的周期。每个周期都配置为包含一个正弦波（sin）形状，该形状调整按钮的 `translationY` 属性 50dp。执行时，此动画将导致按钮在指定范围内垂直振荡多次。此关键帧集可以可视化，如如图\
  \ 44-1 所示，其中五个点代表关键帧位置：\n\n![](img/as_4.0_keycycle_simple_sin.jpg)\n图 44-1\n\n按照目前的实现方式，每个周期包含单个波形。假设我们需要的不是均匀分布的波形，而是在最后一个周期内需要四个波形。可以通过增加最后一个\
  \ `KeyCycle` 元素的 `wavePeriod` 属性来轻松实现：\n\n```xml\n<KeyCycle\n  motion:framePosition=\"\
  75\"\n  motion:motionTarget=\"@+id/button\"\n  motion:wavePeriod=\"4\"\n  motion:waveOffset=\"\
  0dp\"\n  motion:waveShape=\"sin\"\n  android:translationY=\"50dp\"/>\n```\n\n做出此更改后，帧集可以以后述波形形式渲染：\n\
  \n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n图 44-2\n\n到为止，本章的示例一直使用正弦波。事实上，在\
  \ `MotionLayout` 中使用周期关键帧时，有多种不同的波形形状可用。图 44-3 展示了将所有周期关键帧的 `waveShape` 属性更改为锯齿波的效果：\n\
  \n![](img/as_4.0_keycycle_sawtooth.jpg)\n图 44-3\n\n除了正弦波和锯齿波，`MotionLayout` 还支持三角形、方波、弹跳和反锯齿波形状。在上面的示例中，每个周期都在\
  \ Y 轴上以相同的范围移动按钮。然而，假设我们需要第二个周期沿 Y 轴正方向移动按钮更远的距离。这涉及对第二个周期的 `waveOffset` 属性进行如下调整：\n\
  \n```xml\n<KeyCycle\n  motion:framePosition=\"25\"\n  motion:target=\"@+id/button\"\
  \n  motion:wavePeriod=\"1\"\n  motion:waveOffset=\"100dp\"\n  motion:waveShape=\"\
  sin\"\n  android:translationY=\"50dp\"/>\n```\n\n通过此更改，我们得到了一个类似于图 44-4 的时间轴：\n\n\
  ![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n图 44-4\n\n现在在第二个周期期间，按钮的移动范围将在 Y 轴上的大约\
  \ 0 到 150dp 之间。如果仍然需要范围的低端与其他波形匹配，我们当然可以为 `translationY` 值增加 100dp：\n\n```xml\n\
  <KeyCycle\n  motion:framePosition=\"25\"\n  motion:target=\"@+id/button\"\n  motion:wavePeriod=\"\
  1\"\n  motion:waveOffset=\"100dp\"\n  motion:waveShape=\"sin\"\n  android:translationY=\"\
  150dp\"/>\n```\n\n此更改现在为我们提供了如下的波形：\n\n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n\
  图 44-5\n\n## 44.2 使用周期编辑器\n\n尽管并不特别复杂，但通过直接编辑 `MotionScene` 文件中的 XML `KeyCycle`\
  \ 条目来获取你所需的精确周期配置可能花费一些时间。考虑到这一点，Google 的 Android 工程师开发了周期编辑器（Cycle Editor）。这是一个独立的\
  \ Java 工具，尚未集成到 Android Studio 中。周期编辑器允许你可视化地设计和测试周期关键帧集。\n\n周期编辑器以 Java 归档（jar）文件的形式提供，需要在开发系统中安装\
  \ Java 运行时。安装 Java 的步骤取决于你的操作系统。\n\n一旦安装了 Java，可以从以下 URL 下载 `CycleEditor.jar` 文件：\n\
  \nhttps://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar\n\
  \n完成后，打开命令提示符或终端窗口，切换到 jar 文件所在的目录并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n工具加载后，将显示如图 44-6 所示的界面：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n图 44-6\n\
  \n图中标记为 A 的面板显示关键帧集的 XML，可以直接编辑，也可以通过面板 B 中的控制控件进行编辑。面板 C 显示周期的波形渲染。遗憾的是，它在进行更改时不会实时重绘。相反，必须通过选择\
  \ File -> parse xml 选项来刷新。当点击面板 B 中的播放按钮时，标记为 D 的面板将显示周期动画的实时渲染。\n\n\n\n\n\n# 44.3\
  \ 创建 KeyCycleDemo 项目\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击 Next（下一步）按钮之前选择\
  \ Empty Activity（空活动）模板。\n\n在 Name 字段中输入 `KeyCycleDemo`，并指定 `com.ebookfrenzy.keycycledemo`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低 API 级别）设置为 `API 26: Android 8.0\
  \ (Oreo)`，并将 Language（语言）菜单更改为 `Java`。\n\n布局编辑器处于 Design（设计）模式且打开了 `activity_main.xml`\
  \ 文件的情况下，右键点击 `ConstraintLayout` 项并选择 Convert to MotionLayout（转换为 MotionLayout）菜单选项：\n\
  \n![](img/as_4.0_motionlayout_conversion1.jpg)\n\n图 44-7\n\n做出选择后，在确认对话框中点击 Convert（转换）按钮。\n\
  \n# 44.4 配置起始和结束约束\n\n本教程的目标是让按钮从设备屏幕的一侧移动到另一侧，并包含 KeyCycle 效果，该效果会使视图沿 Y 轴上下移动。第一步是配置起始和结束约束。\n\
  \n将 `activity_main.xml` 文件加载到 MotionLayout 编辑器中，选择并删除默认的 `TextView` 小部件。在从调色板拖放\
  \ `Button` 视图之前，确保已选中 Motion Layout 框（在 图 44-9 中标记为 E），以便该视图在垂直方向上居中，并放置在布局画布的左侧边缘：\n\
  \n![](img/as_4.1_keycycledemo_button_added.jpg)\n\n图 44-8\n\n要配置起始点的约束，请在编辑器窗口中选择起始约束集项（在\
  \ 图 44-9 中标记为 A）：\n\n![](img/as_4.0_keycycle_motionlayout_editor_labelled.jpg)\n\
  \n图 44-9\n\n接下来，在 `ConstraintSet` 列表中选择按钮项 (B)。在按钮项仍被选中的情况下，点击编辑按钮 (C) 并从菜单中选择 Create\
  \ Constraint（创建约束）。\n\n在按钮仍被选中的情况下，使用 Attributes（属性）工具窗口为视图顶部、左侧和底部设置约束，如下：\n\n\
  ![](img/as_4.0_keycycle_start_constraint.jpg)\n\n图 44-10\n\n选择上方的结束约束集项（在 图 44-9\
  \ 中标记为 D），并重复步骤以创建一个新约束，这次是对按钮的顶部、底部和右侧边缘设置约束：\n\n![](img/as_4.0_keycycle_end_constraint.jpg)\n\
  \n图 44-11\n\n# 44.5 创建循环\n\n下一步是使用 Cycle Editor（循环编辑器）为动画生成循环关键帧。在 Cycle Editor\
  \ 运行期间，请参考下方的 图 44-12 所示的控制面板：\n\n![](img/as_4.0_keycycle_control_panel_labelled.jpg)\n\
  \n图 44-12\n\n使用标记为 A 的菜单，将要修改的属性从 rotation（旋转）更改为 `translationY`。\n\n接下来，使用 Cycle\
  \ 控制 (B) 选择 cycle 0，这样在面板其他地方进行的更改将应用于第一个循环。将 Period（周期）滑动块移动到 1，并将 `translationY`\
  \ 滑动块移动到 60，如图 图 44-13 所示（滑动时参考 XML 面板查看 `translationY` 值的精确设置）：\n\n![](img/as_4.0_keycycle_editor_cyclekey_0.jpg)\n\
  \n图 44-13\n\n要在图中查看目前为止的更改，选择 File -> Parse XML（解析 XML）菜单选项。使用 表 44-1 中列出的值配置 KeyFrames\
  \ 1 到 4 的设置（请注意你已经配置了 KeyCycle 0 列中的设置）：\n\n| | KeyCycle 0 | KeyCycle 1 | KeyCycle\
  \ 2 | KeyCycle 3 | KeyCycle 4 |\n| --- | --- | --- | --- | --- | --- |\n| Position\
  \ | 0 | 25 | 50 | 75 | 100 |\n| Period | 1 | 2 | 3 | 2 | 1 |\n| translationY | 60\
  \ | 60 | 150 | 60 | 60 |\n\n表 44-1\n\n完成这些更改后，关键帧集 XML 的内容如下：\n\n```xml\n<KeyFrameSet>\n\
  \    <KeyCycle\n      motion:framePosition=\"0\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"/>\n    <KeyCycle\n      motion:framePosition=\"\
  25\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"2\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  60dp\"/>\n    <KeyCycle\n      motion:framePosition=\"50\"\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:wavePeriod=\"3\"\n      motion:waveOffset=\"0dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"150dp\"/>\n    <KeyCycle\n\
  \      motion:framePosition=\"75\"\n      motion:motionTarget=\"@+id/button\"\n\
  \      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"/>\n    <KeyCycle\n      motion:framePosition=\"\
  100\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  60dp\"/>\n</KeyFrameSet>\n```\n\n要查看带有新循环的图形，选择 File -> parse xml 选项以刷新波形，波形现在应该如\
  \ 图 44-14 所示：\n\n![](img/as_4.0_keycycle_editor_cyclekeys_complete.jpg)\n\n图 44-14\n\
  \n# 44.6 预览动画\n\n现在可以在 Cycle Editor 中预览基于循环的动画。点击在 图 44-15 中标记为 A 的按钮启动动画。要将循环与移动结合，将第二个菜单\
  \ (B) 从 Stationary（静态）更改为 East。此外，花时间尝试 C 和 D。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n\
  \n图 44-15\n\n# 44.7 为 MotionScene 添加 KeyFrameSet\n\n在 Cycle Editor 中，选中并复制 KeyCycle\
  \ 元素，并将它们粘贴到 Android Studio 中 `res -> xml -> activity_scene.xml` 文件的 Transition\
  \ 部分，使其位于现有的 `FrameSet` 标记之间。同时注意增加的时间设置以及用于初始化动画的 `OnClick` 处理器：\n\n```xml\n<Transition\n\
  \    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"@id/start\"\
  \n    motion:duration=\"7000\">\n    <KeyFrameSet>\n        <KeyCycle\n        \
  \    motion:framePosition=\"0\"\n        .\n        .\n    </KeyFrameSet>\n    <OnClick\
  \ motion:targetId=\"@id/button\"\n        motion:clickAction=\"toggle\" />\n```\n\
  \n在继续之前，检查每个目标属性是否正确声明。在编写时，Cycle Editor 使用的是过时的 `motion:target` 标签。例如：\n\n`motion:target=\"\
  @+id/button\"`\n\n需要将这五个 `KeyCycle` 项中的每一个更改为：\n\n`motion:motionTarget=\"@+id/button\"\
  `\n\n完成这些更改后，在设备或模拟器上编译并运行应用，点击按钮查看动画。\n\n注意可以在 Android Studio MotionLayout 编辑器中查看\
  \ KeyCycle 波形形成，如下方的 图 44-16 所示：\n\n![](img/as_4.0_keycycle_motionlayout_timeline_waves.jpg)\n\
  \n图 44-16\n\nKeyCycle 关键帧集不仅限于每个动画一个。例如，将以下 KeyFrameSet 添加到 `activity_main_scene.xml`\
  \ 文件的 Transition 部分，以便为按钮移动时添加一些旋转效果：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n\
  \      motion:framePosition=\"0\"\n```\n\n\n\n\n\n```xml\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"60dp\"\nandroid:rotation=\"45\"/>\n<KeyCycle\n   \
  \ motion:framePosition=\"25\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"\
  2\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  60dp\"\n    android:rotation=\"80\"/>\n<KeyCycle\n    motion:framePosition=\"50\"\
  \n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"3\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"150dp\"\n    android:rotation=\"\
  45\"/>\n<KeyCycle\n    motion:framePosition=\"75\"\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:wavePeriod=\"2\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"\n    android:rotation=\"80\"/>\n<KeyCycle\n\
  \    motion:framePosition=\"100\"\n    motion:motionTarget=\"@+id/button\"\n   \
  \ motion:wavePeriod=\"1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"\n    android:rotation=\"45\"/>\n</KeyFrameSet>\n\
  ```\n\n## 44.8 总结\n\n循环关键帧提供了一种构建帧动画的实用方法，适用于处理涉及匹配波形的大量状态变化。如本章所述，通过使用循环编辑器（Cycle\
  \ Editor）应用程序可以显著简化生成这些循环关键帧的过程。\n\n## 45. 使用悬浮操作按钮和 Snackbar\n\n本章的目标之一是概述材料设计（Material\
  \ Design）的概念。材料设计最初作为 Android 5.0 的一部分被引入，它是一套设计指南，规定了 Android 用户界面以及运行在 Android\
  \ 上的应用的外观和行为。\n\n作为材料设计概念实现的一部分，Google 还引入了 Android 设计支持库（Android Design Support\
  \ Library）。该库包含许多不同的组件，允许将材料设计的许多关键功能构建到 Android 应用程序中。这些组件中的悬浮操作按钮（Floating Action\
  \ Button）和 Snackbar 将在本章中进行介绍，并在随后的章节中介绍许多其他组件。\n\n### 45.1 材料设计\n\nAndroid 环境的整体外观由材料设计的原则定义。材料设计由\
  \ Google 的 Android 团队创建，规定了构成 Android 用户界面及其上运行应用的元素在行为、阴影、动画和样式方面以特定方式显示和运行。材料设计的核心原则之一是，用户界面的元素看起来具有物理深度，并且感觉物品是由物理材料层构建而成的。例如，按钮通过使用阴影效果，看起来悬浮于其所在布局表面之上。按下按钮时，按钮会发生弯曲并抬起。\n\
  \n（注：原文包含大量重复句子，已保留核心信息。）\n\n\n\n\n\n```xml\n    android:layout_marginEnd=\"@dimen/fab_margin\"\
  \n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"@android:drawable/ic_dialog_email\"\
  \ />\n```\n这声明了按钮将出现在屏幕的右下角，边距由 `values/dimens.xml` 文件中的 `fab_margin` 标识符表示（在此情况下设置为\
  \ 16dp）。XML 进一步声明了按钮的内部图标将采用标准的内置邮件图标 drawable 形式。\n\n空白模板还配置了悬浮操作按钮，使其在用户点击时显示一个\
  \ `Snackbar` 实例。实现此功能的代码可以在 `MainActivity.java` 文件的 `onCreate()` 方法中找到，内容如下：\n\n\
  ```java\nbinding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n\
  \    public void onClick(View view) {\n        Snackbar.make(view, \"Replace with\
  \ your own action\", Snackbar.LENGTH_LONG)\n                 .setAction(\"Action\"\
  , null).show();\n    }\n});\n```\n\n该代码通过视图绑定访问悬浮操作按钮，并为其添加了一个 `onClickListener`\
  \ 处理器，以便在按钮被点击时调用。此方法简单地显示了一个配置了消息但没有动作的 `Snackbar` 实例。\n\n当项目编译并运行时，悬浮操作按钮将出现在屏幕底部，如图图\
  \ 45-3 所示：\n\n![](img/fab_button.jpg)\n\n图 45-3\n\n点击悬浮操作按钮将触发 `onClickListener`\
  \ 处理器方法，导致 `Snackbar` 显示在屏幕底部：\n\n![](img/fab_snackbar.jpg)\n\n图 45-4\n\n## 45.7\
  \ 移除导航功能\n\n如“Android Studio 布局编辑器工具指南”所示，Basic Activity 模板包含多个片段（fragments）和按钮，用于在片段之间进行导航。对于本教程而言，这些功能是不必要的，如果不移除它们，稍后会引起问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1. 在 Project 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，在 Component Tree 面板中选择 `SecondFragment` 项，并按下键盘上的删除键将其从图中移除。\n3. 找到并删除\
  \ `SecondFragment.java` (`app -> java -> <package name> -> SecondFragment`) 和 `fragment_second.xml`\
