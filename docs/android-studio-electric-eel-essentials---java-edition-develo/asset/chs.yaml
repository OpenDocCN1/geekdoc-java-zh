  \n### 25.9 总结\n\nApply Changes（应用更改）是 Android Studio 的一项功能，旨在显著加速开发应用时的代码、构建和运行周期。Apply\
  \ Changes 功能可以将更新推送到运行中的应用程序，在许多情况下无需重新安装甚至无需重启应用。根据对项目应用的修改性质，Apply Changes 提供了不同层次的支持。\n\
  \n# 26. Android 事件处理概述与示例\n\n在之前的章节中已经涵盖了许多关于 Android 应用用户界面设计的内容。然而，一个尚未涵盖的领域涉及用户与用户界面的交互如何触发底层活动执行任务的方式。换句话说，从之前的章节中我们知道如何创建一个包含用户界面的界面，但不知道当用户点击界面时如何让应用发生变化。\n\
  \n因此，本章的主要目标是提供 Android 事件处理的概述，并带有一个 Android Studio 示例项目。\n\n### 26.1 理解事件\n\n\
  Android 事件可以采取多种形式，但通常是响应外部操作生成的。对于平板电脑和智能手机等设备，最常见的事件形式涉及与屏幕的某种交互。此类事件属于输入事件的类别。\n\
  \nAndroid 框架维护一个事件队列，事件发生时会被放入队列。事件按照先进先出（FIFO）原则从队列中移除。对于触摸屏幕等输入事件，事件将传递到屏幕上相应的视图。除了事件通知外，视图还会接收到有关事件性质的各种信息（取决于事件类型），例如手指与屏幕接触点的坐标。\n\
  \n为了能够处理传递过的事件，视图必须配备事件监听器。Android `View` 类（所有用户界面组件均派生自它）包含一系列事件监听接口，每个接口包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的回调。例如，如果按钮要响应点击事件（相当于用户触摸并释放按钮如同点击物理按钮），它必须同时注册`View.onClickListener`\
  \ 事件监听器并实现相应的`onClick()` 回调方法。\n\n### 26.2 使用 android:onClick 资源\n\n\n\n\n在详细探索事件监听器之前，值得注意的是，当只需要在用户“点击”用户界面中的按钮视图时调用回调方法，可以使用一种快捷方式。考虑一个包含用户界面布局，其中包含一个名为\
  \ `button1` 的按钮视图，其要求是当用户触摸该按钮时，调用在 `activity` 类中声明的名为 `buttonClick()` 方法。实现此行为仅需编写\
  \ `buttonClick()` 方法（该方法接收一个触发点击事件的视图引用作为参数），并在 XML 文件中的按钮视图声明中添加一行即可。例如：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:onClick=\"buttonClick\"\
  \n    android:text=\"Click me\" />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它并没有提供事件处理器提供的范围选项，而事件处理器是本章其余部分的主题。正如后续章节将概述的，`onClick`\
  \ 属性在涉及 fragment 的布局中也有局限性。在 Android Studio 布局编辑器中工作时，当在设备屏幕布局中选择适当的视图类型时，可以在属性面板（Attributes\
  \ panel）找到并配置 `onClick` 属性。\n\n### 26.3 事件监听器和回调方法\n\n在本章后面概述的示例活动中，将详细介绍注册事件监听器和实现回调方法的步骤。但在在此之前，值得花时间概述\
  \ Android 框架中可用的事件监听器以及与每个相关的回调方法。\n\n* `onClickListener` – 用于检测点击样式事件，即用户触摸并释放设备显示器上视图占据的区域。对应于\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n* `onLongClickListener` – 用于检测用户是否在视图上长时间保持触摸。对应于\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n* `onTouchListener` – 用于检测与触摸屏的任何形式的接触，包括单个或多次触摸以及手势动作。对应\
  \ `onTouch()` 回调，此主题将在[Android 触摸和多点事件处理]章节中进行详细介绍。回调方法将接收事件的视图和一个 `MotionEvent`\
  \ 对象作为参数传递。\n* `onCreateContextMenuListener` – 监听由于长按而创建上下文菜单的事件。对应于 `onCreateContextMenu()`\
  \ 回调方法。回调将接收菜单、接收事件的视图和一个菜单上下文对象。\n* `onFocusChangeListener` – 检测由于与滚轮或导航键交互导致焦点移出当前视图的情况。对应于\
  \ `onFocusChange()` 回调方法，该方法将接收事件的视图和一个指示是否获得或丢失焦点的 `Boolean` 值传递进去。\n* `onKeyListener`\
  \ – 用于检测当视图拥有焦点时按了设备上的按键。对应于 `onKey()` 回调方法。作为参数传递的是接收事件的视图、所按物理键的 `KeyCode` 以及一个\
  \ `KeyEvent` 对象。\n\n### 26.4 事件处理示例\n\n在本章的剩余部分中，我们将完成一个 Android Studio 项目的创建，旨在演示事件监听器和相应回调方法的实现，以检测用户何时点击了按钮。回调方法中的代码将更新文本视图，以指示事件已处理。\n\
  \n从欢迎屏幕选择 `New Project` 选项，在弹出的新项目对话框中，选择 `Empty Activity` 模板，然后点击 `Next` 按钮。\n\n\
  在 `Name` 字段中输入 `EventExample`，并指定 `com.ebookfrenzy.eventexample` 为包名。在点击 `Finish`\
  \ 按钮之前，将最低 API 设置为 API 26: Android 8.0 (Oreo)，并将语言菜单设置为 `Java`。按照节[11.8 将项目迁移到 View\
  \ Binding]中概述的步骤，将项目转换为使用 view binding。\n\n### 26.5 设计用户界面\n\n此示例中 `MainActivity`\
  \ 类的用户界面布局由一个 `ConstraintLayout`、一个 `Button` 和一个 `TextView` 组成，如图 26-1 所示。\n\n![](img/as_4.1_event_example_ui.jpg)\n\
  \n图 26-1\n\n找到并选择 Android Studio 创建的 `activity_main.xml` 文件（位于 Project 工具窗口的 `app\
  \ -> res -> layouts` 下），并双击它将其加载到布局编辑器工具中。\n\n确保启用了 `Autoconnect`（自动连接），然后从调色板中拖出一个\
  \ `Button` 组件，并移动它使其位于布局的水平中心且位于现有 `TextView` 组件的下方。当位置正确时，将组件释放到相应位置，以便自动连接系统添加适当的约束。\n\
  \n选择“Hello World!” `TextView` 组件，并使用属性面板将 ID 设置为 `statusText`。重复此步骤将 `Button` 组件的\
  \ ID 改为 `myButton`。\n\n点击布局编辑器工具栏上的 `Infer Constraints`（推断约束）按钮添加任何缺失的约束。\n\n选中\
  \ `Button` 组件后，使用属性面板将文本设置为 `Press`。将按钮上的文本提取到名为 `press_me` 的资源中。\n\n完成用户界面布局后，下一步是注册事件监听器和回调方法。\n\
  \n### 26.6 事件监听器和回调方法\n\n就本示例而言，需要为 `myButton` 视图注册 `onClickListener`。这通过调用按钮视图的\
  \ `setOnClickListener()` 方法来实现，并将一个新的 `OnClickListener` 对象作为参数传递并实现 `onClick()`\
  \ 回调方法。由于这是在活动创建时需要执行的任务，良好的位置是 `MainActivity` 类的 `onCreate()` 方法。\n\n如果 `MainActivity.java`\
  \ 文件已在编辑器会话中打开，可以通过点击面板中的标签页来选择它。或者，在 Project 工具窗口中导航到 `app -> java -> com.ebookfrenzy.eventexample\
  \ -> MainActivity` 并双击它将其加载到代码编辑器中。加载后，找到 `onCreate()` 方法并修改它以获取按钮视图的引用，注册事件监听器并实现\
  \ `onClick()` 方法：\n\n\n\n上述代码现在已经在按钮上注册了事件监听器，并实现了 `onClick()` 方法。然而，如果此时运行应用程序，将没有任何迹象表明安装在按钮上的事件监听器正在工作，因为目前\
  \ `onClick()` 回调方法的体内尚未实现任何代码。本示例的目标是在点击按钮时在 `TextView` 上显示一条消息，因此需要对代码进行一些进一步的改更改：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                public void onClick(View\
  \ v) {\n                    binding.statusText.setText(\"Button clicked\");\n  \
  \              }\n            }\n    );\n}\n```\n\n在 AVD 模拟器或物理 Android 设备上编译并运行应用程序，以完成教程的这一阶段。在触摸并松开按钮视图（也所谓的“点击”）时，文本视图应该发生变化并显示“Button\
  \ clicked”文本。\n\n### 26.7 消费事件\n\n对视图上标准点击（相对于长按）的检测是事件处理中非常简单的情况。现在示例将扩展为包含对长按事件的检测，长按事件发生在用户点击并按住屏幕上的视图时，并借此涵盖事件消费的主题。\n\
  \n考虑本章上一部分中 `onClick()` 方法的代码。该回调被声明为 `void`，因此在执行完毕后，它不会向 Android 框架返回值。\n\n相反，分配给\
  \ `onLongClickListener` 的代码需要向 Android 框架返回一个 `Boolean` 值。此返回值的目的是告诉 Android 运行时回调是否已经消费了该事件。如果回调返回\
  \ `true` 值，则该事件被框架丢弃。相反，如果回调返回 `false` 值，Android 框架将认为该事件仍处于激活状态，并因此将其传递给在同一视图上注册的下一个匹配的事件监听器。\n\
  \n与许多许多编程概念一样，这可能通过示例来演示得最好。第一步是为示例活动类中的按钮视图添加一个用于长按的事件监听器和回调方法：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n. ...\n.\n    binding.myButton.setOnLongClickListener(\n\
  \            new Button.OnLongClickListener() {\n                public boolean\
  \ onLongClick(View v) {\n                    binding.statusText.setText(\"Long button\
  \ click\");\n                    return true;\n                }\n            }\n\
  \    );\n}\n```\n\n显然，当检测到长按时，`onLongClick()` 回调方法将在文本视图上显示“Long button click”。但请注意，该回调方法还返回了\
  \ `true` 值，表示它已经消费了该事件。运行应用程序并按住 `Button` 视图，直到文本视图中出现“Long button click”文本。释放按钮时，文本视图继续显示“Long\
  \ button click”文本，表明 `onClick` 监听器代码没有被调用。\n\n接下来，修改代码使得 `onClick` 监听器代码被调用：\n\n\
  ```java\nbinding.myButton.setOnLongClickListener(\n    new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            binding.statusText.setText(\"\
  Long button click\");\n            return true;\n        }\n    }\n);\n```\n等一下，让我重新正确格式化文中请求的特定块：\n\
  \n```java\nbinding.myButton.setOnLongClickListener(\n    new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            binding.statusText.setText(\"\
  Long button click\");\n            return true;\n        }\n    }\n);\n```\n实际上，查看文本中特定的修改请求：\n\
  \n```java\nbinding.myButton.setOnLongClickListener(\n    new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            TextView myTextView\
  \ = findViewById(R.id.statusText);\n            myTextView.setText(\"Long button\
  \ click\");\n            return false;\n        }\n    }\n);\n```\n等等，源文本在末尾是乱码的。我将在保持逻辑的同时清理它：\n\
  \n```java\nbinding.myButton.setOnLongClickListener(\n    new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            TextView myTextView\
  \ = findViewById(R.id.statusText);\n            myTextView.setText(\"Long button\
  \ click\");\n            return false;\n        }\n    }\n);\n```\n实际上，我将严格遵循提供文本的内容，但对其进行正确的格式化：\n\
  \n```java\nbinding.myButton.setOnLongClickListener(\n    new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            TextView myTextView\
  \ = findViewById(R.id.statusText);\n            myTextView.setText(\"Long button\
  \ click\");\n            return false;\n        }\n    }\n);\n```\n源文本确实说是：`TextView\
  \ myTextView = findViewById(R.id.statusText); myTextView.setText(\"Long button click\"\
  ); return false;`。我将使用它。\n\n### 26.8 总结\n\n如果用户界面包含的视图不对用户的操作做出任何响应，那么该用户界面就没什么用处。Android\
  \ 类定义了一组可以注册的事件监听器。当事件在视图上发生时，它会被放入事件队列并由运行时处理。如果视图注册了匹配监听器，就会调用相应的回调方法。某些回调方法需要返回一个值以指示是否需要传递事件。在涵盖事件处理的基础上，下一章将深入探讨触摸事件。\n\
  \n## 27 Android 触摸与多点触摸\n\n大多数 Android 设备使用触摸屏作为主要界面。上一章介绍了触摸转换为动作的机制。然而，触摸处理远比响应视图上的单个点击复杂得多。例如，大多数\
  \ Android 设备可以同时检测多个触摸。触摸也不局限于设备上的单点。当然，当用户在表面滑动一个或多个接触点时，触摸可以是动态的。\n\n触摸也可以被应用程序解释为手势。考虑例如，水平滑动通常用于翻页电子书的页面，或者捏合动作如何用于缩放图像。\n\
  \n本章将解释涉及运动的触摸处理，并探索拦截触摸的概念。识别特定手势的主将在下一章中涵盖。\n\n### 27.1 拦截触摸事件\n\n视图可以通过注册 `onTouchListener`\
  \ 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。以下代码确保了名为 `myLayout` 的 `ConstraintLayout`\
  \ 视图上的任何触摸都会调用 `onTouch()` 方法：\n\n```java\nbinding.myLayout.setOnTouchListener(\n\
  \    new ConstraintLayout.OnTouchListener() {\n        public boolean onTouch(View\
  \ v, MotionEvent m) {\n            // 在此处执行任务\n            return true;\n      \
  \  }\n    }\n);\n```\n\n正如代码示例所示，`onTouch()` 回调需要返回一个 `Boolean` 值，告诉 Android 运行时系统是否将事件传递给同一视图上注册的其他事件监听器或将其丢弃。该方法接收了触发事件的视图引用以及一个\
  \ `MotionEvent` 类型的对象。\n\n### 27.2 MotionEvent 对象\n\n\n\n\n\n传递到 `onTouch()` 回调方法的\
  \ `MotionEvent` 对象是获取事件信息的关键。该对象中包含的信息包括触摸在视图中的位置以及所执行的操作类型。`MotionEvent` 对象也是处理多点触控的关键。\n\
  \n### 27.3 理解触摸操作\n\n触摸事件处理的一个重要方面是能够识别用户执行的操作类型。通过通过调用传递到 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象的 `getActionMasked()` 方法，可以获取与事件关联的操作类型。当在视图上发生第一次触摸时，`MotionEvent` 对象将包含一个类型为\
  \ `ACTION_DOWN` 的动作类型以及触摸坐标。当该触摸从屏幕上抬起时，会产生一个 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP`\
  \ 事件之间的任何触摸移动将由 `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多一次触摸时，这些触摸被称为指针（pointers）。在多点触控情景下，指针分别以类型为\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 的事件动作开始和结束。要标识触发事件的指针索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 回调方法。\n\n### 27.4 处理多点触控\n\n标题为 “Android 事件处理概述与示例” 的章节开始在单次触摸事件的狭窄范围内探索事件处理。在实践中，绝大多数\
  \ Android 设备都具有响应多个连续触摸的能力（尽管需要注意的是，可以检测到的同时触摸数量取决于设备）。\n\n正如之前讨论过的，在多触触情况下，每次触摸被\
  \ Android 框架认为都是一个指针。每个指针又反过来通过一个索引值引用并分配一个 ID。可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()`\
  \ 方法获取当前指针的数量。当前指针列表中特定索引处的指针 ID 可以通过调用 `MotionEvent.getPointerId()` 方法获取。例如，以下代码段获取了指针计数以及索引为\
  \ 0 的指针的 ID：\n\n```java\npublic boolean onTouch(View v, MotionEvent m) {\n    int\
  \ pointerCount = m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n\
  \    return true;\n}\n```\n\n注意，当 `onTouch` 监听器被触发时，指针计数将始终大于或等于 1（因为回调的触发意味着至少发生过一次触摸）。\n\
  \n对视图的触摸，特别是涉及跨屏幕移动的触摸，会在与屏幕接触点抬起之前产生一系列事件。因此，应用程序可能需要在多个触摸事件期间跟踪单个触摸。虽然特定触摸手势的\
  \ ID 不会从一个事件变化到另一个事件，但重要的是，随着其他触摸事件的到来和离开，索引值会发生。因此，在跨越多个事件处理触摸手势时，必须使用 ID 值作为触摸引用，以确保跟踪的是同一次触摸。在调用需要索引值的方法时，应通过调用\
  \ `MotionEvent` 对象的 `findPointerIndex()` 方法将触摸的 ID 转换为相应的索引值。\n\n### 27.5 多点触控应用示例\n\
  \n在本章剩余部分创建的示例应用程序将跟踪在布局视图上移动的最多两个触摸手势。当每个触摸的事件触发时，每个触摸的坐标、索引和 ID 将显示在屏幕上。\n\n1.\
  \ 从欢迎屏幕上选择 New Project（新建项目）选项，在生成的新项目对话框中，点击 Next（下一步）按钮之前选择 Empty Activity（空活动）模板。\n\
  2. 在 Name（名称）字段中输入 `MotionEvent` 并指定 `com.ebookfrenzy.motionevent` 为包名。在点击 Finish（完成）按钮之前，将\
  \ Minimum API level（最低 API 级别）设置为 API 26：Android 8.0 (Oreo)，并将 Language（语言）菜单设置为\
  \ Java。\n3. 按照 11.8 将项目迁移到 View Binding 节所述调整项目以使用 view binding。\n\n### 27.6 设计\
  \ Activity 用户界面\n\n应用程序唯一 Activity 的界面由一个包含两个 `TextView` 对象的 `ConstraintLayout`\
  \ 视图组成。在 Project 工具窗口中，导航到 `app -> res -> layout` 并双击 `activity_main.xml` 布局资源文件将其加载到\
  \ Android Studio Layout Editor 工具中。\n\n选择并删除默认的“Hello World!” `TextView` 小部件，然后在启用自动连接（autoconnect）的情况下，拖放一个新的\
  \ `TextView` 小部件，使其水平居中，并放置在布局顶部边缘的 16dp 边距线上：\n\n![](img/as_4.1_motion_event_one_textview.jpg)\n\
  图 27-1\n\n拖入第二个 `TextView` 小部件并对其进行定位和约束，使其与第一个小部件的底部保持 32dp 的间距：\n\n![](img/as_4.1_motion_event_two_textviews.jpg)\n\
  图 27-2\n\n使用 Attributes 工具窗口，将 `TextView` 小部件的 ID 分别更改为 `textView1` 和 `textView2`。将小部件上显示的文本改为“Touch\
  \ One Status”和“Touch Two Status”，并使用警告按钮将字符串提取到资源中。\n\n### 27.7 实现触摸监听器\n\n为了接收事件通知，需要在\
  \ `MainActivity` 类的 `onCreate()` 方法中布局注册触摸监听器。从 Android Studio 面选择 `MainActivity.java`\
  \ 标签页显示源码。在 `onCreate()` 方法中添加代码注册监听器，在这种情况下是调用一个名为 `handleTouch()` 的方法并传递 `MotionEvent`\
  \ 对象：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.constraintlayout.widget.ConstraintLayout;\nimport android.os.Bundle;\n\
  import android.view.MotionEvent;\nimport android.view.View;\nimport com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ binding.activityMain.setOnTouchListener(\n            new ConstraintLayout.OnTouchListener()\
  \ {\n                public boolean onTouch(View v, MotionEvent m) {\n         \
  \           handleTouch(m);\n                    return true;\n                }\n\
  \            }\n        );\n    }\n}\n```\n\n当我们设计用户界面时，父级 `ConstraintLayout` 没有分配可以通过\
  \ view binding 机制访问的 ID。由于该布局组件是 UI 布局层次结构中的顶层组件，我们能够在上面的代码中使用 `root` 属性引用它。\n\n\
  在测试应用程序之前的最后一个任务是实现监听器调用的 `handleTouch()` 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent\
  \ m) {\n    int pointerCount = m.getPointerCount();\n    for (int i = 0; i < pointerCount;\
  \ i++) {\n        int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n \
  \       int id = m.getPointerId(i);\n        int action = m.getActionMasked();\n\
  \        int actionIndex = m.getActionIndex();\n        String actionString;\n \
  \   }\n}\n```\n\n\n\n\n```java\nswitch (action)\n{\n    case MotionEvent.ACTION_DOWN:\n\
  \        actionString = \"DOWN\";\n        break;\n    case MotionEvent.ACTION_UP:\n\
  \        actionString = \"UP\";\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n\
  \        actionString = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n\
  \        actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\nString touchStatus = \"Action: \" + actionString + \" Index: \" +\
  \ actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\nif (id == 0)\n  \
  \  binding.textView1.setText(touchStatus);\nelse\n    binding.textView2.setText(touchStatus);\n\
  }\n```\n\n在编译和运行应用程序之前，值得花时间系统地梳理这段代码，以突出显示正在执行的任务。\n\n代码首先获取用户界面中两个 `TextView`\
  \ 对象的引用，并识别当前视图上有多少个活跃指针：\n\n```java\nTextView textView1 = findViewById(R.id.textView1);\n\
  TextView textView2 = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n\
  ```\n\n接下来，使用 `pointerCount` 变量启动一个 `for` 循环，为每个活跃指针执行一组任务。循环的前几行获取了触控事件的 `X` 和\
  \ `Y` 坐标，以及相应的事件 ID、动作类型和动作索引。最后，声明了一个字符串变量：\n\n```java\nfor (int i = 0; i < pointerCount;\
  \ i++)\n{\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n    int id\
  \ = m.getPointerId(i);\n    int action = m.getActionMasked();\n    int actionIndex\
  \ = m.getActionIndex();\n    String actionString;\n```\n\n由于 `action` 等于整数值，因此使用\
  \ `switch` 语句将动作类型转换为更有意义的字符串值，并将其存储在之前声明的 `actionString` 变量中：\n\n```java\nswitch\
  \ (action)\n{\n    case MotionEvent.ACTION_DOWN:\n        actionString = \"DOWN\"\
  ;\n        break;\n    case MotionEvent.ACTION_UP:\n        actionString = \"UP\"\
  ;\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n        actionString\
  \ = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n  \
  \      actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，使用 `actionString`、`actionIndex`、`id`、`x` 和 `y` 构建了字符串 `touchStatus`。使用\
  \ `id` 来决定将消息显示在第一个还是第二个 `TextView` 上：\n\n`String touchStatus = \"Action: \" + actionString\
  \ + \" Index: \" + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;`\n\
  \n`if (id == 0)`\n    `binding.textView1.setText(touchStatus);`\n`else`\n    `binding.textView2.setText(touchStatus);`\n\
  \n\n\n\n一旦实现，结果是在应用程序代码中包含一组方法，当检测到特定类型的手势时，这些方法将被调用。这些方法中的代码随后可以被实现，以执行响应相应手势需要完成的任何任务。\n\
  \n在本章的剩余部分，我们将通过创建一个示例项目，来将上述步骤付诸实践。\n\n## 28.2 创建示例手势检测项目\n\n该项目的目标是检测 `GestureDetectorCompat`\
  \ 类支持的所有常见手势，并向用户显示状态信息以指示检测到的手势类型。\n\n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中选择 `Empty\
  \ Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段输入 `CommonGestures`，并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n按照 11.8 将项目迁移到 View Binding 节所述调整项目以使用 view binding。\n\
  \n创建新项目后，在 Project 工具窗口中导航到 `app -> res -> layout -> activity_main.xml` 文件并双击它将其加载到\
  \ Layout Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!” `TextView` 组件，并在 `Attributes`\
  \ 工具窗口中输入 `gestureStatusText` 作为 `ID`。\n\n## 28.3 实现监听器类\n\n如前所述，有创建一个实现 `GestureDetector.OnGestureListener`\
  \ 接口的类，如果需要检测双击，则还需实现 `GestureDetector.OnDoubleTapListener` 接口。虽然这可以是一个全新的类，但在当前的\
  \ activity 类中实现它也是完全有效的。因此，为了本示例的，我们将修改 `MainActivity` 类以实现这些监听器接口。编辑 `MainActivity.java`\
  \ 文件使其内容如下：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n.\n\nimport\
  \ android.view.GestureDetector;\n\npublic class MainActivity extends AppCompatActivity\n\
  \        implements GestureDetector.OnGestureListener,\n        GestureDetector.OnDoubleTapListener\n\
  {\n.\n\n.\n}\n```\n\n声明该类实现了监听器接口强制要求在类中也实现相应的方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \n.\n.\n\nimport android.view.MotionEvent;\n\npublic class MainActivity extends\
  \ AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n   \
  \     GestureDetector.OnDoubleTapListener {\n.\n\n.\n\n    @Override\n    public\
  \ boolean onDown(MotionEvent event) {\n        binding.gestureStatusText.setText\
  \ (\"onDown\");\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ onFling(MotionEvent event1, MotionEvent event2,\n                            \
  \ float velocityX, float velocityY) {\n        binding.gestureStatusText.setText(\"\
  onFling\");\n        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2,\n \
  \                            float distanceX, float distanceY) {\n        binding.gestureStatusText.setText(\"\
  onScroll\");\n        return true;\n    }\n\n    @Override\n    public void onShowPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onShowPress\");\n    }\n\
  \n    @Override\n    public boolean onSingleTapUp(MotionEvent event) {\n       \
  \ binding.gestureStatusText.setText(\"onSingleTapUp\");\n        return true;\n\
  \    }\n\n    @Override\n    public boolean onDoubleTap(MotionEvent event) {\n \
  \       binding.gestureStatusText.setText(\"onTap\");\n        return true;\n  \
  \  }\n\n    @Override\n    public boolean onDoubleEvent(MotionEvent event) {\n \
  \       binding.gestureStatusText.setText(\"DoubleEvent\");\n        return true;\n\
  \    }\n\n    @Override\n    public boolean onSinglePress(MotionEvent event) {\n\
  \        binding.gestureStatusText.setText(\"onSingleConfirmed\");\n        return\
  \ true;\n    }\n}\n```\n\n### 28.4 创建 GestureDetector 实例\n\n有了 activity 类实现了监听器接口，下一步是创建\
  \ `GestureDetectorCompat` 的实例。由于这只需要在 activity 创建后执行一次，因此最佳位置是 `onCreate()` 方法：\n\
  \n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n.\n\nimport android.view.GestureDetector;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n\n    private ActivityMainBinding\
  \ binding;\n    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\n       \
  \ View view = binding.getRoot();\n        setContentView(view);\n\n        this.gDetector\
  \ = new GestureDetectorCompat(this,this);\n\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n```\n\n##.\n\n如果此时编译并运行应用程序，即使在设备上执行手势，也不会发生任何事情。这是因为还没有添加代码来拦截触摸事件并传递给\
  \ `GestureDetectorCompat` 实例。要实现这一点，需要在 activity 类中重写 `onTouchEvent()` 方法并对其实现，使其调用\
  \ `GestureDetectorCompat` 的 `onTouchEvent()` 方法。因此，留在 `MainActivity.java` 文件中，实现此方法使其内容如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用父类实现\n    return super.onTouchEvent(event);\n}\n```\n\n### 28.6 测试应用程序\n\
  \n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按、滚动动作以及双击和单击。注意，如 图 28-1\n\n图 28-1\n\
  \n### 28.7 总结\n\n用户与设备触摸屏显示之间的任何物理接触都可以视为“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间交互的方法。虽然手势可以由任何动作序列组成，但有一套触摸屏设备用户已经熟悉的常用手势。通过使用\
  \ Android 手势检测类，可以在应用程序中轻松检测到许多所谓的“常见手势”。\n\n\n\n\n上一章涵盖了如何从 Android 内部检测所谓的“常用手势”。然而在实践中，一个手势理论上可以涉及\
  \ Android 设备屏幕上几乎任何序列的触摸动作。由于这一事实，Android SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行这些手势时触发事件。这是一个多阶段的过程，其细节将是本章的主题。\n\
  \n## 29.1 Android Gesture Builder 应用\n\nAndroid SDK 允许开发者设计自定义手势，这些手势随后被存储在与 Android\
  \ 应用包（APK）捆绑的手势文件中。这些自定义手势文件最简单的创建方法是使用 `Gesture Builder` 应用，该应用作为 Android SDK 提供的一部分包含在示例包中。创建手势文件涉及在物理设备或模拟器上启动\
  \ `Gesture Builder` 应用，并在屏幕上“画出”应用程序需要检测的手势。一旦设计好这些手势，就可以将包含手势数据的文件从设备或模拟器的 SD 卡中提取，并添加到应用程序项目中。在应用程序代码中，该文件会被加载到\
  \ `GestureLibrary` 类的实例中，在该处可以使用它来搜索用户在设备屏幕上执行的任何手势的匹配项。\n\n## 29.2 GestureOverlayView\
  \ 类\n\n为了方便在应用程序内检测手势，Android SDK 提供了 `GestureOverlayView` 类。这是一个透明视图，可以放置在用户界面其他视图之上，其唯一目的是检测手势。\n\
  \n### 29.3 检测手势\n\n手势的检测是通过加载使用 `Gesture Builder` 应用创建的手势文件，然后在 `GestureOverlayView`\
  \ 类的实例上注册 `GesturePerformedListener` 事件监听器来实现的。随后声明外围类实现 `OnGesturePerformedListener`\
  \ 接口以及该接口所需的 `onGesturePerformed` 回调方法。如果监听器检测到手势，Android 运行时系统将触发对 `onGesturePerformed`\
  \ 回调方法的调用。\n\n### 29.4 识别特定手势\n\n当检测到手势时，`onGesturePerformed` 回调方法会被调用，并作为参数传递检测手势的\
  \ `GestureOverlayView` 对象的引用，以及一个包含手势信息的 `Gesture` 对象。\n\n通过访问 `Gesture` 对象，可以使用\
  \ `GestureLibrary` 将检测到的手势与之前加载到应用程序的手势文件中包含的手势进行比较。`GestureLibrary` 通过为每个手势计算预测分数，报告用户执行的手势与手势文件条目匹配的概率。通常，预测分数为\
  \ 1.0 或更高被认为文件中存储的手势与用户在设备屏幕上执行的手势之间良好匹配。\n\n### 29.5 安装和运行 Gesture Builder 应用\n\
  \n创建手势文件最简单的方法是使用一个可以捕捉并保存手势动作的程序。虽然 Google 最初提供了一个用于此目的的程序，但它在较新版本的 Android 上已不再得到充分维护。幸运的是，可以通过\
  \ `Gesture Builder Tool` 应用作为替代方案，该应用可以通过以下 URL 从 Google Play Store 获取：\n\nhttps://play.google.com/store/apps/details?id=migueldp.runeforge\n\
  \n### 29.6 创建手势文件\n\n一旦 `Gesture Builder Tool` 加载，点击设备屏幕底部的 `Create New Gesture`\
  \ 按钮，并在灰色画布上使用圆周运动“画出”手势，如图 29-1 所示。假设手势显示符合预期（由设备屏幕上的黄色线条表示），点击 `save` 按钮将手势添加到手势文件中，并在提示输入名称时输入“Circle\
  \ Gesture”：\n\n![](img/as_gesture_builder_app.jpg)\n\n图 29-1\n\n手势保存后，`Gesture Builder\
  \ Tool` 将显示当前定义的手势列表，此时该列表将仅包含新的 Circle Gesture。\n\n### 29.7 创建示例项目\n\n从欢迎界面选择 `New\
  \ Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `CustomGestures`，并指定 `com.ebookfrenzy.customgestures` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level`（最低 API 级别）设置改为 `API 26`：`Android 8.0 (Oreo)`，并将 `Language`（语言）菜单更改为\
  \ `Java`。调整项目以使用视图绑定，如第 11.8 将项目迁移到视图绑定 节所述。\n\n### 29.8 从 SD 卡中提取手势文件\n\n由于每个手势都是在\
  \ `Gesture Builder` 应用中创建的，它们被添加到运行应用程序的模拟器或设备存储中名为 `gesture.txt` 的文件中。然而，在该文件添加到\
  \ Android Studio 项目之前，必须先将其从设备存储中复制并保存到本地文件系统。最简单的方法是使用 Android Studio 的 `Device\
  \ File Explorer` 工具窗口。使用 `View -> Tool Windows -> Device File Explorer` 菜单选项显示此工具。显示后，从下拉菜单选择创建手势文件的设备或模拟器，然后导航文件系统到以下文件夹：\n\
  \n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\n在此文件夹中找到\
  \ `gesture.txt` 文件，右键点击它，选择 `Save As…` 选项并将文件保存为 `gestures` 到临时位置。\n\n![](img/as_gesture_file_in_explorer.jpg)\n\
  \n图 29-2\n\n一旦从设备提取 `gestures` 文件，就可以作为资源文件添加到 Android Studio 项目中。\n\n## 29.9 将手势文件项目\n\
  \n在 Android Studio 项目窗口中，找到并右键点击 `app` 下的 `res` 文件夹，选择 `New -> Directory`。在 `New\
  \ Directory` 对话框中输入 `raw` 作为文件夹名并按回车。使用适用于您的操作系统的文件管理器，找到之前从设备提取的 `gestures` 文件，将其复制并粘贴到项目中的新\
  \ `raw` 文件夹中。\n\n### 29.10 设计用户界面\n\n示例应用程序需要一个 `ConstraintLayout` 视图，上方叠加 `GestureOverlayView`\
  \ 以拦截用户执行的任何手势。找到 `app -> res -> layout -> activity_main.xml` 文件，双击将其加载到布局编辑器工具，并选择删除默认的\
  \ `TextView` 组件。\n\n切换到布局器的 Code 模式并修改 XML 如下：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n\n    <android.gesture.GestureOverlayView\n\
  \        android:id=\"@+id/gOverlay\"\n        android:layout_width=\"0dp\"\n  \
  \      android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n\n\n\n`</androidx.constraintlayout.widget.ConstraintLayout>`\n\n### 29.11\
  \ 加载手势文件\n\n手势文件已经添加到项目中，下一步是编写一些代码以便在 Activity 启动时加载该文件。为了本项目的目的，实现此功能的代码将添加到位于\
  \ `MainActivity.java` 源文件中的 `MainActivity` 类中，如下：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \n.\n\n.\n\nimport android.gesture.GestureLibraries;\n\nimport android.gesture.GestureLibrary;\n\
  \nimport android.gesture.GestureOverlayView;\n\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements OnGesturePerformedListener\
  \ {\n\n    private ActivityMainBinding binding;\n\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ gestureSetup();\n    }\n\n    private void gestureSetup() {\n        gLibrary\
  \ =\n                GestureLibraries.fromRawResource(this,\n                  \
  \      R.raw.gestures);\n        if (!gLibrary.load()) {\n            finish();\n\
  \        }\n    }\n.\n\n.\n\n}\n```\n\n除了一些必要的导入指令外，上述代码还创建了一个名为 `gLibrary` 的 `GestureLibrary`\
  \ 实例，并将位于 raw 资源文件夹的手势文件内容加载到其中。Activity 类还被修改以实现 `OnGesturePerformedListener` 接口，这需要实现\
  \ `onGesturePerformed` 回调方法（该方法将在本章后面的章节中创建）。\n\n### 29.12 注册事件监听器\n\n为了让 Activity\
  \ 接收到用户在屏幕上执行手势的通知，需要在 `gLayout` 视图上注册 `OnGesturePerformedListener` 事件监听器。如下面的代码片段所示，可以使用\
  \ `findViewById` 方法获取其引用：\n\n```java\nprivate void gestureSetup() {\n    gLibrary\
  \ =\n            GestureLibraries.fromRawResource(this,\n                    R.raw.gestures);\n\
  \    if (!gLibrary.load()) {\n        finish();\n    }\n    GestureOverlayView gOverlay\
  \ = findViewById(R.id.gOverlay);\n    gOverlay.addOnGesturePerformedListener(this);\n\
  }\n```\n\n# 29.13 实现 onGesturePerformed 方法\n\n在对应用程序进行首次测试运行之前，只需实现 `onGesturePerformed`\
  \ 回调方法。当在 `GestureOverlayView` 实例上执行手势时，就会调用此方法：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \n.\n\n.\n\nimport android.gesture.Prediction;\n\nimport android.widget.Toast;\n\
  \nimport android.gesture.Gesture;\nimport java.util.ArrayList;\n\npublic class MainActivity\
  \ extends AppCompatActivity implements OnGesturePerformedListener {\n\n    private\
  \ GestureLibrary gLibrary;\n.\n\n.\n\n    public void onGesturePerformed(GestureOverlayView\
  \ overlay, Gesture gesture) {\n        ArrayList<Prediction> predictions =\n   \
  \             gLibrary.recognize(gesture);\n        if (predictions.size() > 0 &&\
  \ predictions.get(0).score > 1.0)\n        {\n            String action = predictions.get(0).name;\n\
  \            Toast.makeText(this, action, Toast.LENGTH_SHORT).show();\n        }\n\
  \    }\n.\n.\n}\n```\n\n### 29.14 测试应用程序\n\n在模拟器或物理设备上构建并运行应用程序，然后执行手势。注意，当手势被识别时，应该出现\
  \ Toast 通知。而覆盖层不确定的手势将以黄色线条显示。\n\n# 29.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView`\
  \ 配置为在手势期间显示黄色线条。用于绘制识别和不确定手势的颜色可以通过 `gestureColor` 和 `uncertainGestureColor` 属性定义。例如，要隐藏手势线，请按如下修改\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#000000\"\n    android:uncertainGestureColor=\"\
  #000000\" />\n```\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们在 `ConstraintLayout` 视图的白色背景上被绘制为白色的）。\n\
  \n### 29.16 拦截手势\n\n如前所述，`GestureOverlayView` 是一个透明覆盖层，可以放置在其他视图之上。这引出了问题：当手势被识别时，手势拦截的事件是否应该传递给底层视图？这通过\
  \ `GestureOverlayView` 实例的 `eventsInterceptionEnabled` 属性控制。当设置为 `true` 时，识别出手势后手势事件不会传递给底层视图。当在可能配置为滚动的视图上执行手势时，此设置特别有用。\n\
  \n### 29.17 检测缩放手势\n\n在介绍一般的触摸处理和特定的手势识别之前，本章的最后一个主题是处理缩放手势。虽然可以使用本章之前节概述的步骤来创建和检测各种手势，但实际上，使用目前讨论的技术无法检测缩放手势（即使用两个手指进行拉伸和收缩动作，通常用于放大或缩小视图或图像）。\n\
  \n\n\n\n\n# 实现概述\n\n1. 声明一个实现 `SimpleOnScaleGestureListener` 接口的新类，包括必需的 `onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()` 回调方法。\n2. 创建 `ScaleGestureDetector` 类的实例，并将步骤 1 中创建的类实例作为参数传递。。\n\
  3. 在外层 activity 中实现 `onTouchEvent()` 回调方法，该方法反过来会调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n在本章的剩余部分，我们将创建一个示例，用于演示缩合手势识别的实现。\n\n## 29.18 缩合手势示例项目\n\n从欢迎界面选择 `New\
  \ Project` 选项，在弹出的新项目对话中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `PinchExample`，并指定 `com.ebookfrenzy.pinchexample` 为包名。在点击 `Finish` 按钮之前，将 `Minimum\
  \ API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。按照 11.8\
  \ Migrating a Project to View Binding 中的步骤将项目转换为使用 `view binding`。\n\n在 `activity_main.xml`\
  \ 文件中，选择默认的 `TextView` 对象并使用 `Attributes` 工具窗口将 `ID` 设置为 `myTextView`。\n\n找到并加载\
  \ `MainActivity.java` 文件到 Android Studio 编辑器中，并如下修改文件：\n\n```java\npackage com.ebookfrenzy.pinchexample;\n\
  \nimport android.view.MotionEvent;\nimport android.view.ScaleGestureDetector;\n\
  import android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        scaleGestureDetector\
  \ =\n                new ScaleGestureDetector(this,\n                        new\
  \ MyOnScaleGestureListener());\n    }\n\n    @Override\n    public boolean onTouchEvent(MotionEvent\
  \ event) {\n        scaleGestureDetector.onTouchEvent(event);\n        return true;\n\
  \    }\n\n    public class MyOnScaleGestureListener extends\n            SimpleOnScaleGestureListener\
  \ {\n        @Override\n        public boolean onScale(ScaleGestureDetector detector)\
  \ {\n            float scaleFactor = detector.getScaleFactor();\n            if\
  \ (scaleFactor > 1) {\n                binding.myTextView.setText(\"Zooming Out\"\
  );\n            } else {\n                binding.myTextView.setText(\"Zooming In\"\
  );\n            }\n            return true;\n        }\n\n        @Override\n  \
  \      public boolean onScaleBegin(ScaleGestureDetector detector) {\n          \
  \  return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n```\n\n### 29.1 总结\n\n手势本质上是一种基于触摸的交互，可以在应用设计阶段进行组合。在本章中，我们探索了如何使用\
  \ `ScaleGestureDetector` 和 `SimpleOnScaleGestureListener` 来处理缩合手势。我们实现了 `onTouchEvent()`、`onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()` 方法来响应用户输入。\n\n# 30. Android Fragments 简介\n\n随着章节的进行，你会越来越明显，Android\
  \ 系统背后的许多设计概念其初衷都是促进元素之间的复用和交互。本章将探讨的一个领域涉及 fragments。本章将从 fragment 的定义及其如何创建方面提供基础概述。\n\
  \n### 30.1 什么是 Fragment？\n\nfragment 是应用程序用户界面中自包含的、模块化的部分以及相应的行为，可以嵌入到 activity\
  \ 中。Fragments 可以在应用设计阶段组合以创建一个 activity，并在运行时添加到或从 activity 中移除，以创建动态变化的用户界面。\n\n\
  Fragments 只能作为 activity 的一部分使用，不能独立实例化。尽管如此，fragment 可以被认为是一个功能性的“子活动”，其生命周期与完整\
  \ activity 的周期相似。Fragments 以 XML 布局文件的形式存储，可以通过在 activity 的布局文件中放置适当的 `<fragment>`\
  \ 元素，或者通过 activity 类中的代码直接添加到 activity 中。\n\n### 30.2 创建 Fragment\n\n构成 fragment\
  \ 的两个组件是 XML 布局文件和一个对应的 Java 类。fragment 的 XML 布局文件格式与任何其他 activity 布局文件相同，可以包含布局管理器和视图的任何组合和复杂度。例如，下面的\
  \ XML 布局用于一个由带有红色背景的 `ConstraintLayout` 组成的 fragment，其中包含单个的 `TextView`：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\
  \n\n\n\n\n```xml\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"My First Fragment\"\n        android:textAppearance=\"\
  @style/TextAppearance.AppCompat.Large\"\n        android:textColor=\"@color/white\"\
  \n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n与布局对应的类必须是\
  \ Android `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 fragment 布局。例如：\n\
  \n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport\
  \ android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import androidx.fragment.app.Fragment;\n\npublic class FragmentOne extends Fragment\
  \ {\n\n    @Override\n    public View onCreateView(LayoutInflater inflater,\n  \
  \                          ViewGroup container,\n                            Bundle\
  \ savedInstanceState) {\n        // 加载此 fragment 的布局\n        binding = FragmentTextBinding.inflate(inflater,\
  \ container, false);\n        return binding.getRoot();\n    }\n}\n```\n\n除了 `onCreateView()`\
  \ 方法外，该类还可以重写标准的生命周期方法。一旦 fragment 布局和类被创建，该 fragment 就可以在应用程序的 activity 中使用了。\n\
  \n### 30.3 使用布局 XML 文件向 Activity 添加 Fragment\n\n可以通过编写 Java 代码或将 fragment 嵌入到 activity\
  \ 的 XML 布局文件中将其纳入 activity 中。无论使用哪种方法，需要注意的关键点是，当使用支持库（support library）兼容旧版本的 Android\
  \ 时，任何使用 fragment 的 activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity`\
  \ 类：\n\n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\n\
  import androidx.fragment.app.FragmentActivity;\nimport android.view.Menu;\n\npublic\
  \ class MainActivity extends FragmentActivity {\n.\n.\n```\n\nfragment 使用 `FragmentContainerView`\
  \ 类嵌入到 activity 布局文件中。接下来的示例布局将本章上一节创建的 fragment 嵌入到 activity 布局中：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <androidx.fragment.app.FragmentContainerView\n\
  \        android:id=\"@+id/fragment2\"\n        android:name=\"com.ebookfrenzy.myfragmentdemo.FragmentOne\"\
  \n        android:layout_width=\"0dp\"\n        android:layout_height=\"wrap_content\"\
  \n        android:layout_marginStart=\"32dp\"\n        android:layout_marginEnd=\"\
  32dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n`androidx.constraintlayout.widget.ConstraintLayout`\
  \ 中的关键属性是 `android:name`（它必须引用类）和 `tools:context`（它必须引用 activity）。一旦添加到布局，就可以在 Android\
  \ Studio 中查看 fragment（图 30-1）。\n\n### 30.4 在代码中添加和管理 Fragment\n\n使用代码向 activity\
  \ 添加 fragment 非常方便。为了在运行时实现动态控制，可以对它们进行添加、移除甚至替换。在使用代码管理 activity 内的 fragment 时，有一套标准的步骤：\n\
  \n1. 创建 fragment 实例。\n2. 传递任何参数。\n3. 获取管理器的引用。\n4. 在 manager 上调用 `beginTransaction()`。这会返回一个\
  \ `FragmentTransaction` 实例。\n5. 调用 `FragmentTransaction` 的 `add()` 方法，将视图 ID 和 fragment\
  \ 实例作为参数传递。\n6. 调用 `commit()`。\n\n例如，下面的代码通过 `FragmentOne` 添加 fragment 使其显示在容器中：\n\
  \n```java\nFragmentOne firstFragment = new FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\n\
  FragmentManager fragManager = getSupportFragmentManager();\nFragmentTransaction\
  \ transaction = fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1,\
  \ firstFragment);\ntransaction.commit();\n```\n\n然而，上面的代码可以简化为一行：\n\n```java\ngetFragmentManager().beginTransaction().add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n一旦添加到容器，随后可以通过调用 `FragmentTransaction` 实例的 `remove()`\
  \ 方法来移除 fragment，传递要移除的 fragment 实例：\n\n```java\ntransaction.remove(firstFragment);\n\
  ```\n\n同样，可以通过调用 `FragmentTransaction` 实例的 `replace()` 方法用一个 fragment 替换另一个。该方法的参数为包含\
  \ fragment 的视图 ID 和新 fragment 的实例。被替换的 fragment 也可以放在所谓的返回栈（back stack）中，以便在用户返回时可以快速恢复。这通过在调用\
  \ `commit()` 方法之前调用 `FragmentTransaction` 的 `addToStack()` 方法来实现：\n\n```java\nFragmentTwo\
  \ secondFragment = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1, secondFragment);\n\
  transaction.addToStack(null);\ntransaction.commit();\n```\n\n### 30.5 处理 fragment\
  \ 事件\n\n正如之前讨论过的，fragment 非常像一个拥有自己的布局、类和生命周期的子 activity。fragment 内的视图组件（如按钮和文本视图）像普通\
  \ activity 一样生成事件。这产生了一个问题：哪个类接收来自 fragment 视图的事件？是 fragment 本身还是嵌入它的 activity？问题的答案取决于如何声明事件处理程序。\n\
  \n在“Android 事件处理概述与示例”章节中讨论了两种处理事件的方法。第一种方法是在 activity 代码中配置事件监听器和回调方法。例如：\n\n```java\n\
  binding.button.setOnClickListener(\n    new Button.OnClickListener() {\n       \
  \ public void onClick(View v) {\n            // 点击时执行的代码\n        }\n    }\n);\n\
  ```\n\n\n\n\n\n```java\n// the button is clicked\n    }\n    }\n);\n```\n\n在拦截点击事件时，第二种方法涉及在\
  \ XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n```\n\nFragment\
  \ 中视图生成的事件，其通用规则是：如果事件监听器是在 Fragment 类中通过事件监听器和回调方法声明的，那么该事件将首先由 Fragment 处理。然而，如果使用了\
  \ `android:onClick` 资源，则事件将直接传递给包含该 Fragment 的 Activity。\n\n### 30.6 实现 Fragment\
  \ 之间的通信\n\n一旦一个或多个 Fragment 被嵌入到 Activity 中，很可能需要在 Fragment 与 Activity 之间、以及两个 Fragment\
  \ 之间进行某种形式的通信。事实上，良好的实践要求 Fragment 之间不进行直接通信。所有通信都应该通过封装它们的 Activity 进行。\n\n为了让\
  \ Activity 与 Fragment 通信，Activity 必须通过分配给它的 ID 来识别 Fragment 对象。一旦获取此引用，Activity\
  \ 就可以简单地调用 Fragment 对象的公共方法。\n\n反方向的通信（从 Fragment 到 Activity）稍微复杂一些。首先，Fragment\
  \ 必须定义一个监听器接口，然后在 Activity 类中实现该接口。例如，以下代码在名为 `ToolbarFragment` 的 Fragment 类上声明了一个名为\
  \ `ToolbarListener` 的接口。代码还声明了一个变量，稍后将存储对 Activity 的引用：\n\n```java\npublic class\
  \ ToolbarFragment extends Fragment {\n    ToolbarListener activityCallback;\n  \
  \  public interface ToolbarListener {\n        public void onButtonClick(int position,\
  \ String text);\n    }\n.\n.\n}\n```\n\n上述代码规定，任何实现 `ToolbarListener` 接口的类都必须实现一个名为\
  \ `onButtonClick` 的回调方法，该方法接受一个整数和一个 `String` 作为参数。\n\n接下来，需要重写并实现 Fragment 类的 `onAttach()`\
  \ 方法。当 Fragment 初始化并与 Activity 关联时，Android 系统会自动调用此方法。该方法接收包含该 Fragment 的 Activity\
  \ 引用。该方法必须存储该 Activity 的本地引用，并验证它是否实现了 `ToolbarListener` 接口：\n\n```java\n@Override\n\
  public void onAttach(Context context) {\n    super.onAttach(context);\n    try {\n\
  \        activityCallback = (ToolbarListener) activity;\n    } catch (ClassCastException\
  \ e) {\n        throw new ClassCastException(activity.toString() + \" must implement\
  \ ToolbarListener\");\n    }\n}\n```\n\n执行此示例后，Activity 的引用将存储在本地变量 `activityCallback`\
  \ 中，如果该 Activity 没有实现 `ToolbarListener` 接口，则会抛出异常。\n\n下一步是从 Fragment 内部调用 Activity\
  \ 的回调方法。这何时以及如何发生，完全取决于 Fragment 需要联系 Activity 的情况。例如，以下代码在点击按钮时调用 Activity 的回调方法：\n\
  \n```java\npublic void buttonClicked (View view) {\n    activityCallback.onButtonClick(arg1,\
  \ arg2);\n}\n```\n\n剩下的工作就是修改 Activity 类，使其实现 `ToolbarListener` 接口。例如：\n\n```java\n\
  public class MainActivity extends FragmentActivity\n        implements ToolbarFragment.ToolbarListener\
  \ {\n    public void onButtonClick(String arg1, int arg2) {\n        // 实现回调方法的代码\n\
  \    }\n.\n.\n}\n```\n\n从上述代码中可以看到，Activity 声明它实现了 `ToolbarFragment` 类的 `ToolbarListener`\
  \ 接口，然后按照接口要求实现了 `onButtonClick()` 方法。\n\n### 30.7 总结\n\nFragment 提供了一种强大的机制，用于创建可重用的用户界面布局和应用程序行为模块，这些模块一旦创建，就可以嵌入\
  \ Activity 中。一个 Fragment 由一个用户界面布局文件和一个类组成。可以通过将 Fragment 添加到布局中或编写代码在运行时管理 Fragment\
  \ 来在 Activity 中利用 Fragment。代码中的 Fragment 可以被动态移除。\n\n# 31. 在 Android Studio 中使用\
  \ Fragment 示例\n\n如上一章所述，Fragment 提供了一种创建可重用用户界面布局和应用程序行为模块的方便机制。一旦创建，它们就可以嵌入 Activity\
  \ 中。在上一章探索了 Fragment 的整体理论后，本章的目标是使用 Android Studio 创建一个示例应用程序，演示创建和使用 Fragment\
  \ 的实际步骤，并实现两个 Fragment 之间的通信。\n\n### 31.1 关于示例 Fragment\n\n在本章创建的应用程序将由单个 Activity\
  \ 和两个 Fragment 组成。第一个 Fragment 的用户界面将包含某种工具栏，由 `EditText` 视图、一个 `SeekBar` 和一个 `Button`\
  \ 组成，所有内容包含在 `ConstraintLayout` 中。第二个 Fragment 将仅包含一个 `TextView`，同样包含在 `ConstraintLayout`\
  \ 中。\n\n这两个 Fragment 将嵌入应用程序的主 Activity 中，并实现如下通信逻辑：当第一个 Fragment 中的按钮被按下时，输入到 `EditText`\
  \ 中的文本将出现在第二个 Fragment 的 `TextView` 上，其字体大小由第一个 Fragment 中 `SeekBar` 的位置决定。\n\n\
  由于此应用程序旨在在较早版本的 Android 上运行，因此还需要使用适当的支持库。\n\n### 31.2 创建示例项目\n\n从欢迎屏幕选择 New Projectget，并在弹出的新项目对话框中选择\
  \ Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `FragmentExample` 并指定 `com.ebookfrenzy.fragmentexample`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
