  \n### 31.7 让 Toolbar Fragment 与 Activity 通信\n\n\n\n\n\n当用户点击工具栏片段中的按钮时，`fragment`\
  \ 类需要从 `EditText` 视图获取文本以及 `SeekBar` 的当前值，并将它们发送到文本片段。正如“Android Fragments 介绍” 中概述，片段之间不应该直接通信，而应该使用嵌入它们的活动（activity）作为中间媒介。\n\
  \n此过程的第一步是确保工具栏片段对按钮的点击事件做出响应。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。出于本示例的考虑，我们将在 `ToolbarFragment`\
  \ 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并进行修改，使其读取如下列表所示：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \n.\n\n.\n\nimport androidx.annotation.NonNull;\n\nimport androidx.annotation.Nullable;\n\
  \nimport android.content.Context;\n\nimport android.widget.SeekBar;\n\npublic class\
  \ ToolbarFragment extends Fragment  implements\n                               SeekBar.OnSeekBarChangeListener\
  \ {\n\n    private static int seekvalue = 10;\n\n.\n\n.\n\n@Override\n    public\
  \ void onViewCreated(@NonNull View view,\n                             @Nullable\
  \ Bundle savedInstanceState) {\n\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.seekBar1.setOnSeekBarChangeListener(this);\n        binding.button1.setOnClickListener(new\
  \ View.OnClickListener() {\n            public void onClick(View v) {\n        \
  \        buttonClicked(v);\n            }\n        });\n    }\n\n    public void\
  \ buttonClicked (View view) {\n\n    }\n\n    @Override\n    public void onProgressChanged(SeekBar\
  \ seekBar, int progress,\n                                     boolean fromUser)\
  \ {\n        seekvalue = progress;\n    }\n\n    @Override\n    public void onStartTrackingTouch(SeekBar\
  \ arg0) {\n    }\n\n    @Override\n    public void onStopTrackingTouch(SeekBar arg0)\
  \ {\n    }\n}\n```\n\n在继续之前，我们需要花一些时间来解释上述代码更改。首先，该类声明为实现了 `OnSeekBarChangeListener`\
  \ 接口。这是因为用户界面包含一个 `SeekBar` 实例，片段在用户滑动滑条以更改字体大小时需要接收通知。实现 `OnSeekBarChangeListener`\
  \ 接口要求实现 `onProgressChanged()`、`onStartTrackingTouch()` 和 `onStopTrackingTouch()`\
  \ 方法。这些方法已经实现，但实际执行任务时只需要 `onProgressChanged()` 方法，在本例中，该任务是将新值存储在名为 `seekvalue`\
  \ 的变量中，该变量在类的开头已声明。此外还声明了一个变量，用于存储对 `EditText` 对象的引用。\n\n添加了 `onViewCreated()` 方法来在按钮上设置\
  \ `OnClickListener`，其配置为在检测到点击事件时调用名为 `buttonClicked()` 的方法。随后也实现了该方法，尽管在此时它什么都还没做。\n\
  \n此过程的下一阶段是设置监听器，允许片段在按钮被点击时调用活动。这遵循了上一章中概述的机制：\n\n```java\npublic class ToolbarFragment\
  \ extends Fragment\n    implements SeekBar.OnSeekBarChangeListener {\n\n       \
  \ private static int seekvalue = 10;\n        private FragmentToolbarBinding binding;\n\
  ToolbarListener activityCallback;\n\n        public interface ToolbarListener {\n\
  \            public void onButtonClick(int position, String text);\n        }\n\
  \        @Override\n        public void onAttach(Context context) {\n          \
  \  super.onAttach(context);\n            try {\n                activityCallback\
  \ = (ToolbarListener) context;\n            } catch (ClassCastException e) {\n \
  \               throw new ClassCastException(context + \" must implement ToolbarListener\"\
  );\n            }\n        }\n```\n\n\n\n\n\n本章的目标是通过创建一个示例项目，专门用于演示在 Android 应用中使用片段（fragments）的步骤。涵盖的主题包括：使用\
  \ `Android Support Library` 以兼容引入片段功能之前的 Android 版本、在 Activity 布局中包含片段，以及片段间通信的实现。\n\
  \n# 32. 使用 Jetpack 的现代 Android 应用架构\n\n多年来，Google 并没有推荐一种特定的方法来构建 Android 应用，它所做的仅仅是提供工具和开发套件，让开发者自行决定哪种方法对特定项目或个人编程风格有效。这种情况在\
  \ 2017 年随着 `Android Architecture Components`（Android 架构组件）的引入而发生了改变，该组件在 2018 年发布时成为了\
  \ `Android Jetpack` 的一部分。\n\n本章的目的是提供 `Jetpack` 概念、Android 应用架构建议以及一些关键架构组件的概述。在介绍基础知识后，这些主题将在后面的章节中进行详细介绍，并通过实际示例进行演示。\n\
  \n### 32.1 什么是 Android Jetpack？\n\n`Android Jetpack` 由 `Android Studio`、`Android\
  \ Architecture Components` 和 `Android Support Library`，以及一组建议 Android 应用应该如何构建的指南组成。`Android\
  \ Architecture Components` 的设计旨在让开发 Android 应用时执行常用任务变得更快、更方便，同时符合架构指南的核心原则。\n\n\
  虽然本书将涵盖所有的 `Android Architecture Components`，但本章的目标是介绍关键的架构指南，以及 `ViewModel`、`LiveData`、`Lifecycle`\
  \ 组件，同时介绍 `Data Binding` 和 `Repositories`（仓库）的使用。\n\n在继续之前，理解 `Jetpack` 应用开发方法并非强制性的是非常重要的。虽然文中强调了一些年来盛行的其他技术的缺点，但\
  \ Google 并没有完全谴责那些应用开发方法。Google 似乎采取的是：虽然开发应用没有对错之分，但有一种推荐的方法。\n\n### 32.2 “旧”架构\n\
  \n在标题为 在 Android Studio 中创建示例 Android 应用 的章节中，创建了一个由单个 Activity 组成的 Android 项目，该\
  \ Activity 包含了显示和管理用户界面的所有代码，以及应用的的后端逻辑。在 `Jetpack` 引入之前，最常见的架构遵循这种范式，即应用由多个 Activity\
  \ 组成（应用中的每个屏幕对应一个 Activity），每个 Activity 类在某种程度上混合了用户界面和后端代码。\n\n这种方法导致了一系列与应用生命周期相关的问题（例如，用户每次旋转设备时\
  \ Activity 都会被销毁并重建，导致任何未保存到持久化存储形式的应用数据丢失），以及诸如导航效率低下等问题（为用户访问的每个应用屏幕都要启动一个新的 Activity）。\n\
  \n### 32.3 现代 Android 架构\n\n在最基础的层，Google 现在提倡“单 Activity”应用，将不同的屏幕作为内容加载到同一个 Activity\
  \ 内部。\n\n现代架构指南还建议将应用中不同的责任区域划分到完全独立的模块中（Google 将此概念称为“关注点分离”）。这种方法的关键之一是 `ViewModel`\
  \ 组件。\n\n### 32.4 ViewModel 组件\n\n`ViewModel` 的目的是将应用中用户界面相关的数据模型和逻辑与负责实际显示、管理用户界面以及与操作系统交互的代码分离开。当以这种方式设计时，应用将由一个或多个\
  \ UI 控制器（如 Activity）以及 `ViewModel` 组成。实际上，`ViewModel` 只知道数据模型和相应的逻辑，它对用户界面一无所知。当\
  \ UI 控制器需要数据进行显示时，它只需请求 `ViewModel` 提供。同样，当用户在用户界面中输入数据时，UI 控制器将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种责任分离解决了与 UI 生命周期相关的问题。无论 UI 控制器在应用生命周期内被重建多少次，`ViewModel` 实例都会一直留在内存中，直到应用退出。\n\
  \n![jetpack_diagram_1]\n图 32-1\n\n### 32.5 LiveData 组件\n\n考虑一个显示实时数据的应用，例如金融股票的当前价格。应用可能会使用某种形式的股票价格\
  \ Web 服务来持续更新 `ViewModel` 内部的数据模型。显然，除非及时显示给用户，否则这些实时数据几乎无用。UI 控制器只有两种方式可以确保在用户界面上显示最新数据。一种方案是控制器持续检查\
  \ `ViewModel`，以发现数据自上次显示以来是否发生了变化。然而，这种方法的问题是效率低下。为了保持数据馈送的实时性，UI 控制器必须在循环中运行，持续检查数据是否变化。\n\
  \n更好的解决方案是当 `ViewModel` 中的特定数据项发生变化时，UI 控制器接收通知。这是通过使用 `LiveData` 组件实现的。`LiveData`\
  \ 是一个数据持有者，允许值变为可观测的。简单来说，可观测对象具有在数据发生变化时通知其他对象的能力，从而解决了确保用户界面始终与 `ViewModel` 中的数据匹配的问题。\n\
  \n这意味着，例如，对 `ViewModel` 值感兴趣的 UI 控制器可以设置一个观察者，该观察者会在值变化时收到通知。在我们假设的应用中，例如，股票价格将被封装在\
  \ `ViewModel` 中的 `LiveData` 对象中，UI 控制器将为该值分配一个观察者，声明在值变化时调用的方法。当该方法被数据变化触发时，将从 `ViewModel`\
  \ 读取更新后的值并用其更新用户界面。\n\n![jetpack_diagram_2]\n图 32-2\n\n`LiveData` 实例也可以被声明为可变体，允许观察实体更新\
  \ `LiveData` 对象持有的底层值。\n\n\n\n\n使用 `LiveData` 的另一个关键优势是它能够感知观察者的生命周期状态。例如，如果一个 activity\
  \ 包含一个 `LiveData` 观察者，相应的 `LiveData` 对象就会知道 activity 生命周期状态何时的变化，并做出相应的响应。如果 activity\
  \ 处于暂停状态（可能是应用被置于后台），`LiveData` 对象将停止向观察者发送事件。如果 activity 刚刚启动或在暂停后恢复，`LiveData`\
  \ 对象将向观察者发送一个 `LiveData` 事件，以确保 activity 拥有最新的值。同样，`LiveData` 实例会在 activity 被销毁时知晓此情况，并移除观察者以释放资源。\n\
  \n到目前为止，我们只讨论了 UI 控制器使用观察者的情况。但在实践中，观察者可以用于任何符合 Jetpack 生命周期周期管理方法的方法的对象内部。\n\n\
  ### 32.6 ViewModel 状态保存\n\nAndroid 允许用户将运行中的应用置于后台，并在在设备上执行其他任务（包括运行其他应用）后返回该应用。当设备资源不足时，操作系统将通过终止后台应用进程来解决此问题，从最久未使用的应用开始。然而，当用户返回被终止的后台应用时，它应该显示为与进入后台时相同的状态，无论它之前是否被终止。在与\
  \ `ViewModel` 关联的数据方面，可以通过利用 `ViewModel Saved State` 模块来实现。该模块允许值存储在应用的保存状态中，并在系统发起的进程终止时恢复这些值，这一主题将在本章后续标题为\
  \ Android ViewModel 状态保存教程的章节中进行介绍。\n\n### 32.7 LiveData 与数据绑定\n\nAndroid Jetpack\
  \ 包含了数据绑定库（Data Binding Library），它允许将 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的\
  \ `AndroidSample` 项目中，既需要编写代码来获取 `EditText` 和 `TextView` 视图的引用，也需要设置和获取文本属性以反映数据变化。数据绑定允许存储在\
  \ `ViewModel` 中的 `LiveData` 值直接在 XML 布局文件中被被引用，从而避免了编写代码来更新布局视图的需要。\n\n![](img/Jetpack_diagram_3.jpg)\n\
  \n图 32-3\n\n数据绑定将从标题为 Android Jetpack 数据绑定概述的章节开始进行更详细的介绍。\n\n### 32.8 Android 生命周期\n\
  \n从 Android 组件创建到它被销毁的时间持续被称为生命周期。在生命周期期间，组件会在不同的生命周期状态之间切换，通常受操作系统的控制并响应用户操作。例如，一个\
  \ activity 将从初始化状态开始，然后过渡到创建状态。一旦 activity 开始运行，它将切换到启动状态，并从该状态循环包括创建、启动、恢复和销毁在内的各种状态。\n\
  \n许多 Android 框架类和组件允许其他对象访问它们的当前状态。也可以使用生命周期观察者（Lifecycle observers），以便对象在另一个对象的生命周期状态发生变化时接收通知。这是\
  \ `ViewModel` 组件在背后使用的技术，用于识别观察者何时重启或被销毁。此功能不仅限于 Android 框架和架构组件，也可以构建在任何使用架构组件包含的一组生命周期组件的类中。\n\
  \n能够检测并响应其他对象生命周期状态变化的对象被称为生命周期感知（lifecycle-aware），而提供其生命周期状态访问的则被称为生命周期所有者（lifecycle-owners）。生命周期将在标题为使用\
  \ Android 生命周期周期感知组件的章节中进行更详细的介绍。\n\n### 32.9 Repository 模块\n\n如果 `ViewModel` 从一个或多个外部源（如数据库或网络服务）获取数据，那么将处理这些数据源的代码与\
  \ `ViewModel` 类分离是非常重要的。毕竟，这样做会违反关注点分离（separation of concerns）的指南。为了避免将此功能与 `ViewModel`\
  \ 混合，Google 的架构指南建议将此代码放在单独的 `Repository` 模块中。\n\n仓库不是一个 Android 架构组件，而是由应用开发者创建的\
  \ `Java` 类，负责与各种数据源建立接口。该类为 `ViewModel` 提供一个接口，允许数据存储在模型中。\n\n![](img/Jetpack_diagram_4.jpg)\n\
  \n图 32-4\n\n### 32.10 总结\n\n最近，Google 倾向于不推荐任何特定的 Android 应用结构化方法。随着 Android Jetpack\
  \ 的引入，这种情况现在发生了变化，Jetpack 由了一套工具、组件、库和架构指南组成。Google 现在建议将应用项目分为不同的模块，每个模块负责特定的功能区域，即所谓的“关注点分离”。\n\
  \n特别是，指南建议将应用的视图数据模型与处理用户界面的代码分离。此外，负责从网络服务或数据库等数据源收集数据的代码应该构建在单独的 `repository`\
  \ 模块中，而不是与视图模型绑定。\n\nAndroid Jetpack 包含了 Android 架构组件（Android Architecture Components），这些组件专门设计用于以便更容易开发符合推荐指南的应用程序。本章介绍了\
  \ `ViewModel`、`LiveData` 和 `Lifecycle` 组件。这些将从下一章开始进行更详细的介绍。本章未提到的其他架构组件将在书的后后部分介绍。\n\
  \n# 33. Android Jetpack ViewModel 教程\n\n上一章介绍了 Android Jetpack 的核心概念，并概述了现代 Android\
  \ 应用架构的基础。Jetpack 本质上定义了一套建议，描述了 Android 应用项目应该结构，同时提供了一套库和组件，使其更容易符合这些指南，目标是用更代码开发更可靠的应用。\n\
  \n为了帮助强化和澄清上一章提供的信息，本章将逐步创建一个使用 `ViewModel` 组件的示例应用。该示例将在下一章通过引入 `LiveData` 和数据绑定支持得到进一步增强。\n\
  \n### 33.1 关于项目\n\n在标题为在 Android Studio 中创建 Android 应用的章节中，创建了一个名为 `AndroidSample`\
  \ 的项目，其中应用的所有代码都位于主 `Activity` 类文件中。在随后的章节中，创建并使用了 AVD 模拟器来运行该应用。\n\n\n\n\n\n在创建\
  \ `AndroidSample` 项目时，选择了 `Empty Activity` 模板作为项目的基础。然而，对于本项目，将使用 `Fragment + ViewModel`\
  \ 模板。这将生成一个结构符合架构指南的 `Android Studio` 项目。\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Fragment + ViewModel` 模板。\n\n在 `Name` 字段中输入 `ViewModelDemo`，并指定\
  \ `com.ebookfrenzy.viewmodeldemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为\
  \ `API 26`：`Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。编辑 `build.gradle` (`Module\
  \ :app`) 文件，启用 `viewBinding` 并点击编辑器面板顶部的 `Sync Now` 链接：\n\n```gradle\nandroid {\n\
  \    buildFeatures {\n        viewBinding true\n    }\n}\n```\n\n### 33.3 审查项目\n\
  \n使用 `Fragment + ViewModel` 模板创建项目时，其结构在许多方面与创建 `AndroidSample` 项目时使用的 `Empty Activity`\
  \ 有何。项目的关键组件如下：\n\n#### 33.3.1 主 Activity\n\n要说明的是，主运行的用户界面已经过结构化，允许单个活动作为最终完成的应用程序所需的所有屏幕的容器。该活动的主用户界面布局包含在\
  \ `app -> res -> layout -> activity_main.xml` 文件中，并以 `FrameLayout` 的形式提供空容器空间（在图\
  \ 33-1 中显示），屏幕内容将出现在其中：\n\n![](img/android_studio_view_model_container_area.jpg)\n\
  \n图 33-1\n\n#### 33.3.2 内容 Fragment\n\n`FrameLayout` 容器只是一个占位符，在运行时将被应用启动时显示的第一个屏幕的内容替换。此内容通常以\
  \ `Fragment` 的形式存在，由一个 XML 布局资源文件和相应的类文件组成。事实上，在创建项目时，`Android Studio` 为此目的创建了一个初始\
  \ fragment。该 fragment 的布局资源文件可以在 `app -> res -> layout -> fragment_main.xml` 找到，当加载到布局编辑器时，显示将如图\
  \ 33-2 所示：\n\n![](img/as_3.5_viewmodel_main_fragment.jpg)\n\n图 33-2\n\n默认情况下，该 fragment\
  \ 包含一个显示文本“MainFragment”的 `TextView`，但其他已准备好修改以包含第一个应用屏幕的布局。此时值得花时间查看 `Android Studio`\
  \ 已经生成的在活动容器区域内显示此 fragment 的代码。\n\n将 `FrameLayout` 占位符替换为 fragment 的从 `MainActivity`\
  \ 类文件（`app -> java -> <package name> -> MainActivity`）开始。关键代码出现在该类的 `onCreate()`\
  \ 方法中，并将容器 id（已分配给 `FrameLayout` 占位符视图）替换为 `MainFragment` 类：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    if (savedInstanceState == null)\
  \ {\n        getSupportFragmentManager().beginTransaction()\n                  \
  \  .replace(R.id.container, MainFragment.newInstance())\n                    .commitNow();\n\
  \    }\n}\n```\n\n伴随 fragment 的代码可以在 `MainFragment.java` 文件中（`app -> <package name>\
  \ -> ui.main -> MainFragment`）。在该类文件中是 `onCreateView()` 方法，该方法在 fragment 创建时被调用。此方法加载\
  \ `fragment_main.xml` 布局文件，以便在主活动布局的容器区域内显示：\n\n```java\n@Override\npublic View\
  \ onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup container,\
  \ @Nullable Bundle savedInstanceState) {\n    return inflater.inflate(R.layout.fragment_main,\
  \ container, false);\n}\n```\n\n#### 33.3.3 ViewModel\n\n该活动的 `ViewModel` 包含位于 `app\
  \ -> java -> ui.main -> MainViewModel` 的 `MainViewModel.java` 类文件中。它被声明为 `ViewModel`\
  \ 架构组件类的子类，并准备好修改以存储应用的数据模型：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    // TODO: Implement the ViewModel\n}\n```\n\n### 33.4 设计 Fragment 布局\n\n\
  下一步是设计 fragment 的布局。在 Project 工具窗口中找到 `fragment_main.xml` 文件并双击它将其加载到布局编辑器中。一旦布局加载，选择现有的\
  \ `TextView` 小部件并使用 `Attributes` 工具窗口将 `id` 属性更改为 `resultText`。\n\n从调色板拖入一个 `Number\
  \ (Decimal)` 视图并将其置在现有 `TextView` 之上。选中该视图后，使用 `Attributes` 工具窗口将 `id` 更改为 `dollarText`。\n\
  \n将一个 `Button` 小部件拖到布局上，使其位于 `TextView` 下方。在按钮仍被选中的情况下，将 `id` 更改为 `convertButton`。此时，布局应该看起来像图\
  \ 33-3 所示（注意这三个视图已使用垂直链进行了约束）：\n\n![](img/as_4.2_viewmodel_ui.jpg)\n\n图 33-3\n\n\
  最后，点击布局编辑器右上角的警告图标，并将硬编码字符串转换为资源。\n\n### 33.5 实现 View Model\n\n完成用户界面布局后，需要在 view\
  \ model 中创建应用的数据模型。在 Project 窗口中找到 `MainViewModel.java` 文件，双击它将其加载到代码编辑器并修改类如下所示：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText =\
  \ value;\n        result = Float.parseFloat(dollarText) * rate;\n    }\n\n    public\
  \ Float getResult() {\n        return result;\n    }\n}\n```\n\n该类声明了变量来存储当前的美元字符串值和转换后的金额，并带有用于访问这些数据的\
  \ getter 和 setter 方法。调用时，`setAmount()` 方法接收当前的美元金额并存储在本地 `dollarText` 变量中。美元字符串值转换为浮点数，乘以虚拟的汇率，并将产生的欧元值存储在\
  \ `result` 变量中。另一方面，`getResult()` 方法简单返回赋值给 `result` 变量的当前值。\n\n# 33.6 将 Fragment\
  \ 与 View Model 关联\n\n显然，需要某种方法让 fragment 获取 `ViewModel` 的引用，以便访问模型并观察数据变化。`Fragment`\
  \ 或 `Activity` 使用 `ViewModelProvider` 类的实例维护它们所赖的 `ViewModels`。\n\n在 `Fragment`\
  \ 内部使用 `ViewModelProvider` 类创建 `ViewModelProvider` 实例，如下：\n\n```java\nViewModelProvider\
  \ viewModelProvider = new ViewModelProvider(this);\n```\n\n\n\n\n一旦创建了 `ViewModelProvider`\
  \ 实例，就可以在该实例上调用 `get()` 方法，并传递所需的特定 `ViewModel` 类。该提供程序将创建该 `ViewModel` 类的一个新实例，或者返回一个已存在的实例：\n\
  \n```\nViewModel mviewModel = viewModelProvider.get(MainViewModel.class);\n```\n\
  \n编辑 `MainFragment.java` 文件并验证 Android Studio 是否已经在 `onCreate()` 方法中包含了这一步（尽管为了简洁，该操作是在单行代码中完成的）：\n\
  \n```java\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n获取对模型视图的访问权限后，现在可以向 `Fragment` 中添加代码以开始处理数据模型。\n\n### 33.7 修改 Fragment\n\n\
  现在需要更新 fragment 类以响应按钮点击，并与存储在 `ViewModel` 中的数据值进行交互。该类还需要对用户界面布局中三个视图的引用，以便响应按钮点击、提取当前的美元值并显示转换后的货币金额。\n\
  \n在标题为 \"在 Android Studio 中创建示例 Android 应用\"的章节中，使用了 `Button` 控件的 `onClick` 属性来指定用户点击按钮时要调用的方法。遗憾的是，此属性只能调用\
  \ `Activity` 上的方法，不能用于调用 `Fragment` 中的方法。为了绕过这一局限，我们需要在 `Fragment` 类中添加一些代码，在按钮上设置\
  \ `onClick` 监听器。这可以通过在 `MainFragment.java` 文件中重写 `onViewCreated()` 周期方法来实现，如下所示。在进行这些更改的同时，我们还将转换\
  \ fragment 以使用视图绑定（view binding）：\n\n```java\nimport com.ebookfrenzy.viewmodeldemo.databinding.FragmentMainBinding;\n\
  \npublic class MainFragment extends Fragment {\n\n    private MainViewModel mViewModel;\n\
  \n    private FragmentMainBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n\n    @Nullable\n    @Override\n\
  \    public View onCreateView(@NonNull LayoutInflater inflater,\n              \
  \                 @Nullable ViewGroup container,\n                             \
  \  @Nullable Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.fragment_main,\
  \ container, false);\n        binding = FragmentMainBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n    }\n\n    @Override\n    public\
  \ void onDestroyView() {\n        super.onDestroyView();\n        binding = null;\n\
  \    }\n\n    @Override\n    public void onViewCreated(@NonNull View view, @Nullable\
  \ Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n        });\n    }\n}\n\
  ```\n\n添加监听器后，放置在 `onClick()` 方法中的任何代码都会用户每次点击按钮时被调用。\n\n### 33.8 访问 ViewModel 数据\n\
  \n当点击按钮时，`onClick()` 方法需要从 `EditText` 视图读取当前值，确认该字段为空，然后调用 `ViewModel` 实例的 `setAmount()`\
  \ 方法。随后，该方法需要调用 `ViewModel` 的 `getResult()` 方法并将转换后的值显示在 `TextView` 控件上。\n\n由于项目尚未使用\
  \ `LiveData`，因此在每次创建 `Fragment` 时，也有必要从 `ViewModel` 获取最新的结果值。\n\n在 `MainFragment.java`\
  \ 文件中，在 `onViewCreated()` 方法按如下方式实现这些需求：\n\n```java\nimport java.util.Locale;\n\n\
  @Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            mViewModel.getResult()));\n    binding.convertButton.setOnClickListener(v\
  \ -> {\n        if (!binding.editText.getText().toString().isEmpty()) {\n      \
  \      mViewModel.setAmount(Double.parseDouble(binding.editText.getText().toString()));\n\
  \            binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\",\n\
  \                mViewModel.getResult()));\n        } else {\n            binding.resultText.setText(\"\
  No Value\");\n        }\n    });\n}\n```\n\n### 33.9 测试项目\n\n完成项目的阶段后，在模拟器或物理设备上构建并运行应用，输入美元值并点击\
  \ Convert（转换）按钮。转换后的金额应出现在 `TextView` 上，这表明它正在正常工作。\n\n当运行原始的 AndroidSample 应用时，旋转设备会导致\
  \ `TextView` 上显示的值丢失。现在用 `ViewModelDemo` 应用重此此测试，并注意欧元值被保留了。这是因为当 `Fragment` 被销毁和重建时，`ViewModel`\
  \ 仍然留在内存中。\n\n虽然这是对原始 AndroidSample 的改进，但还有许多可以通过利用其他功能来进一步简化项目。\n\n### 33.10 总结\n\
  \n在本章节中，我们重新回顾了书中之前创建的 `AndroidSample` 项目，并创建了项目的新版本，以符合 Android Jetpack 架构指南。本章节概述了\
  \ `Fragment+ViewModel` 项目模板的结构，并解释了基于单个 Activity 使用 Fragments 来构建应用的概念。示例项目还演示了如何使用\
  \ ViewModel 将数据处理与用户界面代码分离来。最后，本章节展示了 ViewModel 方法如何避免 Fragment 和 Activity 生命周期中的某些问题。\n\
  \n### 34 一个 Android Jetpack LiveData 教程\n\n上一章开始了设计符合 Jetpack 架构指南的应用的过程。这些初始步骤包括选择\
  \ `Fragment+ViewModel` 项目模板，并在 `ViewModel` 实例中实现应用界面的数据模型。\n\n本章将通过使用 `LiveData`\
  \ 架构组件进一步增强应用设计。在本章为项目添加 `LiveData` 支持后，接下来的章节（从 Android Jetpack Data Binding 概览\
  \ 开始）将使用 Jetpack Data Binding 库。\n\n### 34.1 LiveData - 回顾\n\n`LiveData` 在之前标题为\
  \ 使用 Jetpack 构建现代 Android 应用架构 的章节中介绍。如前所述，`LiveData` 组件可以作为视图模型数据值的封装器。一旦包含在 `LiveData`\
  \ 实例中，这些变量对应用内的其他对象变得可见（通常是 UI 控制器，如 `Activity` 和 `Fragment`）。这允许 UI 控制器在底层 LiveData\
  \ 值发生变化时接收通知。通过创建 `Observer` 类的实例并定义在 LiveData 值变化时要调用的 `onChange()` 方法可以设置观察者。\n\
  \n`LiveData` 实例可以使用 `MutableLiveData` 类声明为可变的，从而允许 `ViewModel` 和 UI 控制器对底层值进行修改。\n\
  \n#### 34.2 为 ViewModel 添加 LiveData\n\n\n\n\n\n启动 Android Studio，打开上一章创建的 `ViewModelDemo`\
  \ 项目，并打开 `MainViewModel.java` 文件，其目前的内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult()\n    {\n        return result;\n    }\n}\n\
  ```\n\n本章此的目标是将 `result` 变量封装在一个 `MutableLiveData` 实例中（该对象需要是可变的，以便在用户每次请求货币转换时都能更改值）。首先修改该类，使其内容如下所示，请注意在使用\
  \ `LiveData` 时需要导入额外的包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \    public void setAmount(String value) {\n        this.dollarText = value;\n \
  \       result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public Float getResult()\n\
  \    {\n        return result;\n    }\n}\n```\n\n既然 `result` 变量已包含在可变的 `LiveData`\
  \ 实例中，`setAmount()` 和 `getResult()` 方法都需要修改。对于 `setAmount()` 方法，不能再使用赋值运算符 (`=`)\
  \ 为 `result` 变量赋值。相反，必须调用 `LiveData.setValue()` 方法并将新值作为参数传递。按照目前的实现，`getResult()`\
  \ 方法声明为返回 `Float` 值，现在需要更改为返回 `MutableLiveData` 对象。完成这些剩余更改后将得到如下类文件：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \    public void setAmount(String value) {\n        this.dollarText = value;\n \
  \       result = Float.parseFloat(dollarText)*rate;\n        result.setValue(Float.parseFloat(dollarText)*rate);\n\
  \    }\n\n    public Float getResult()\n    public MutableLiveData<Float> getResult()\n\
  \    {\n        return result;\n    }\n}\n```\n\n### 34.3 实现观察者\n\n现在转换结果已包含在 `LiveData`\
  \ 实例中，下一步是在 UI 控制器中配置一个观察者，在本例中，它是 `MainFragment` 类。找到 `MainFragment.java` 类 (`app\
  \ -> java -> <package name>` -> `MainFragment`)，双击它将其加载到编辑器中，并修改 `onViewCreated()`\
  \ 方法以创建一个名为 `resultObserver` 的新 `Observer` 实例：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.Observer;\n.\n.\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            mViewModel.getResult()));\n    final Observer<Float> resultObserver\
  \ = new Observer<Float>() {\n        @Override\n        public void onChanged(Float\
  \ result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                result));\n        }\n    };\n.\n```\n\n`resultObserver`\
  \ 实例声明了 `onChanged()` 方法，该方法被调用时会传入当前值，并将其显示在 `TextView` 上。下一步是将观察者添加到 `LiveData`\
  \ 对象中，可以通过调用 `getResult()` 获取其引用。由于更新 `TextView` 现在是 `onChanged()` 回调的责任，因此现在可以删除执行此任务的现有代码行：\n\
  \n```java\n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\",\n         \
  \   mViewModel.getResult()));\n    final Observer<Float> resultObserver = new Observer<Float>()\
  \ {\n        @Override\n        public void onChanged(Float result) {\n        \
  \    binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\",\n       \
  \         result));\n        }\n    };\n\n    mViewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n\n    binding.convertButton.setOnClickListener(v -> {\n    \
  \    if (!binding.dollarText.toString().equals(\"\")) {\n            mViewModel.setAmount(String.format(Locale.ENGLISH,\"\
  %s\",\n                binding.dollarText.getText()));\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                mViewModel.getResult()));\n        } else {\n         \
  \   binding.resultText.setText(\"No Value\");\n        }\n    });\n}\n```\n\n编译并运行应用，在美元字段中输入一个值，点击转换按钮并验证转换后的欧元金额是否显示在\
  \ `TextView` 上。这证实了观察者收到了结果已更改的通知，并调用了 `onChanged()` 方法来显示最新数据。\n\n\n\n\n\n在标题为“使用\
  \ Jetpack 构建现代 Android 应用架构”的章节中，我们介绍了 Android 数据绑定（Data Binding）的概念，并简要解释了如何使用它直接将用户界面布局中的视图连接到应用中其他对象内定义的方法和数据，而无需编写代码。本章将提供关于数据绑定的更多细节，并重点解释数据绑定如何在\
  \ Android Studio 项目中实现。下一章的教程“Android Jetpack 数据绑定教程”将提供一个数据绑定实际运行的实用示例。\n\n# 35.1\
  \ 数据绑定概览\n\n数据绑定支持由 Android Jetpack Data Binding 库提供，其主要目的是提供一种简单的方法，将用户界面布局中的视图与存储在应用代码中的数据（通常位于\
  \ `ViewModel` 实例中）连接。数据绑定还提供了一种方便的方法，可以将用户界面控件（如 `Button` 控件）映射到其他对象（如 UI 控制器和 `ViewModel`\
  \ 实例）中的事件和监听方法。\n\n当数据绑定与 `LiveData` 组件结合使用时，它会变得特别强大。例如，考虑使用数据绑定将 `EditText` 视图绑定到\
  \ `ViewModel` 中的 `LiveData` 变量。这样连接后，`ViewModel` 中数据值的任何更改将自动显示在 `EditText` 视图中；当使用双向绑定时，输入到\
  \ `EditText` 中的任何数据将自动用于更新 `LiveData` 的值。最令人印象深刻的可能是这可以在初始化绑定所需的代码之外无需额外代码实现。\n\n\
  传统上，将 `Button` 控件等交互式视图连接到 UI 控制器中的方法需要开发人员编写代码来实现一个监听方法，并在点击按钮时调用。数据绑定使得这变得像在布局\
  \ XML 文件的 `Button` 元素中引用要调用的方法一样简单。\n\n### 35.2 数据绑定的关键组件\n\n默认情况下，Android Studio\
  \ 项目未配置数据绑定支持。事实上，在应用开始使用数据绑定之前，需要组合多个不同的元素。这些涉及项目构建配置、布局 XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然初看起来看起来可能有些让人无从从，但分开来看，这些实际上是相当简单的步骤，一旦完成，在节省编码工作方面是非常值得的。在本章的剩余部分，将详细介绍这些每一个元素。在介绍这些基础之后，下一章将通过详细教程实际演示这些步骤。\n\
  \n## 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须首先配置以使用 Android Data Binding 库，并启用对数据绑定类和绑定表达式语法的支持。幸运的是，这只需要在模块级\
  \ `build.gradle` 文件中添加几行即可（即项目工具窗口 Gradle Scripts 下列出的 `build.gradle (Module: app)`\
  \ 对应的文件）。以下列出了启用了数据绑定的部分构建文件：\n\n```gradle\nandroid {\n    buildFeatures {\n   \
  \     dataBinding = true\n    }\n}\n```\n\n### 35.2.2 数据绑定布局文件\n\n正如我们在之前的章节中看到的，应用的用户界面通常包含在\
  \ XML 布局文件中。在其中一个布局文件中的视图利用数据绑定之前，必须先将布局文件转换为数据绑定布局文件。\n\n正如书中前面提到的，XML 布局文件定义了布局中组件的层次结构，从一个顶层或根视图开始。通常，此根视图采用布局容器的形式，例如\
  \ `ConstraintLayout`、`FrameLayout` 或 `LinearLayout` 实例，就像 `ViewModelDemo` 项目中 `fragment_main.xml`\
  \ 文件中的所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n为了能够使用数据绑定，布局层次必须有一个布局组件作为根视图，该组件反过来成为当前根视图的父级。\n\n在上面的示例中这将要求对现有布局文件进行以下更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n### 35.2.3 布局文件数据\n\n数据绑定布局文件需要一种方法来声明要绑定的项目类（例如 ViewModel 或控制器）。声明这些类后，布局文件还需要一个变量来引用这些实例。\n\
  \n这是通过使用 `data` 元素实现的，示例所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\" />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n\n</layout>\n```\n\n上面的 `data` 元素声明了一个名为 `myViewModel` 类型为 `MainViewModel` 的新变量（注意在声明变量时需要声明\
  \ `MainViewModel` 类的完整包名）。\n\n`data` 元素还可以导入其他类，这些类可以在布局文件的其他地方被引用。例如，如果你有一个类，在显示给用户之前需要对其调用某个方法，可以这样导入该类：\n\
  \n```xml\n<data>\n    <import type=\"com.ebookfrenzy.MyFormattingTools\" />\n  \
  \  <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n</data>\n```\n\n### 35.2.4 绑定类\n\n\n\n\n\n对于绑定布局文件中数据元素中引用的每个类，Android Studio\
  \ 将自动生成对应的绑定类。该类是 `AndroidDataBinding` 类的子类，并将根据布局文件名使用首字母大写规则和 `Binding` 后缀进行命名。因此，对于名为\
  \ `fragment_main.xml` 的布局文件的绑定类将命名为 `FragmentMainBinding`。该绑定类包含布局文件中指定的绑定，并将它们映射到绑定对象中的变量和方法。\n\
  \n尽管绑定类是自动生成的，但仍需要编写代码来根据对应的数据绑定布局文件创建该类的实例。幸运的是，这可以通过使用 `DataBindingUtil` 类来实现。\n\
  \n`Activity` 或 `Fragment` 的初始化代码通常会设置内容视图或“膨胀”（inflate）用户界面布局文件。这仅意味着代码打开了布局文件、解析\
  \ XML 并在内存中创建并配置所有的视图对象。对于现有的 `Activity` 类，实现此目的的代码可以在 `onCreate()` 方法中找到，读取如下：\n\
  \n```\nsetContentView(R.layout.activity_main);\n```\n\n对于 `Fragment`，这一操作发生在 `onCreateView()`\
  \ 方法中：\n\n```\nreturn inflater.inflate(R.layout.fragment_main, container, false);\n\
  ```\n\n在 `Activity` 类中创建绑定类实例只需按照如下方式修改此初始化代码：\n\n```\nActivityMainBinding binding;\n\
  \nbinding = DataBindingUtil.setContentView(this, R.layout.activity_main, false);\n\
  ```\n\n对于 `Fragment`，代码读取如下：\n\n```\nFragmentMainBinding binding;\n\nbinding = DataBindingUtil.inflate(\n\
  \      inflater, R.layout.fragment_main, container, false);\n\nbinding.setLifecycleOwner(this);\n\
  \nView view = binding.getRoot();\n\nreturn view;\n```\n\n### 35.2.5 数据绑定变量配置\n\n\
  如上所述，数据绑定布局文件包含数据元素，该元素包含变量元素，其中包含变量名和要建立绑定的类类型。例如：\n\n```xml\n<data>\n    <variable\n\
  \        name=\"viewModel\"\n        type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 `ViewModel` 类实例，但尚未连接到实际\
  \ `MainViewModel` 对象实例。这需要额外的步骤，将应用内部使用的 `MainViewModel` 实例赋值给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法实现的，在上一章中已经获取了该实例的引用：\n\n```\nMainViewModel mViewModel = new\
  \ ViewModelProvider(this).get(MainViewModel.class);\n\nbinding.setVariable(viewModel,\
  \ mViewModel);\n```\n\n上述数据元素中的第二个变量引用了名为 `MainFragment` 的 `Fragment` UI 控制器类。在这种情况下，UI\
  \ 控制器（无论是 `Activity` 还是 `Fragment`）中的代码只需要按照如下方式将自己赋值给变量：\n\n```\nbinding.setVariable(uiController,\
  \ this);\n```\n\n### 35.2.6 绑定表达式（单向）\n\n绑定表达式定义了特定视图如何与绑定对象交互。例如，`Button` 上的绑定表达式可能会声明在响应点击时调用对象上的哪个方法。或者，绑定表达式可能会定义存储在\
  \ `ViewModel` 中的哪个数据值显示在 `TextView` 中，以及如何进行呈现和格式化。\n\n绑定表达式使用声明式语言，允许将逻辑以及对其他类和方法的访问用于决定如何使用绑定数据。例如，表达式可以包含数学表达式、方法调用、字符串拼接、对数组元素的访问以及比较操作。此外，系统默认导入了所有标准的\
  \ Java 语言库，因此在 Java 中可以实现的许多功能在绑定表达式中也可以执行。正如已经讨论过的，数据元素还可以用于导入自定义类，以为表达式添加更多功能。\n\
  \n绑定表达式以 `@` 符号开头，后跟括在花括号 `{}` 中的表达式。\n\n例如，考虑一个包含一个名为 `result` 变量的 `ViewModel`\
  \ 实例。假设该类已分配给数据绑定布局文件中名为 `viewModel` 的变量，并需要绑定到 `TextView` 对象，以便视图始终显示最新的结果值。如果此值是以\
  \ `String` 对象形式存储的，则在布局文件中的声明如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@{viewModel.result}\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n在上面的 XML 中，`text`\
  \ 属性被设置为存储在 `viewModel` 对象中的值。\n\n然而，考虑结果在模型中是以 `Float` 值而不是 `String` 存储的。如果是这样，上面的表达式会导致编译错误。显然，在\
  \ `TextView` 显示它之前，需要将 `Float` 值转换为字符串。为了解决此类问题，绑定表达式可以包含使用标准 Java 类完成转换的必要步骤：\n\
  \n```xml\nandroid:text=\"@{String.valueOf(viewModel.result)}\"\n```\n\n在 Java 中，值可以以原始类型的形式存在，例如\
  \ `boolean` 类型（称为未拆箱），或者包装在对象中，例如 `Boolean` 类型并通过引用该对象进行访问（即装箱）。拆箱过程涉及从对象中拆出原始值。\n\
  \n为了避免此消息，请按照如下方式将错误的操作封装在 `safeUnbox()` 调用中：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(viewModel.result))}\"\
  \n```\n\n也可以使用字符串拼接。例如，为了在结果字符串值后包含“dollars”单词，将以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(safeUnbox(viewModel.result))\
  \ + \" dollars\"}'\n```\n\n注意，由于附加的结果字符串被双引号包裹，因此表达式现在使用单引号封装以避免语法错误。\n\n表达式语法还允许声明三元语句。在下面的表达式中，视图将根据结果值是否大于\
  \ 10 显示不同的文本：\n\n```xml\n@{myViewModel.result > 10 ? \"Out of range\" : \"In range\"\
  }\n```\n\n表达式还可以构造以访问数据数组中的特定元素：\n\n```xml\n@{myViewModel.resultsArray[3]}\n```\n\
  \n### 35.2.7 绑定表达式（双向）\n\n到为止涵盖的表达式类型被称为单向绑定。换句话说，随着相应值的变化，布局会不断更新，但布局内部对值的更改不会更新存储的值。\n\
  \n\n\n\n\n另一方面，双向绑定允许数据模型响应布局的变化而进行更新。例如，可以为 `EditText` 视图配置双向绑定，这样当用户输入不同的值时，该值将被用于更新对应的数据模型值。在声明双向表达式时，其语法与单向表达式相似，不同之处它以\
  \ `@=` 开头。例如：\n\n```xml\nandroid:text=\"@={myViewModel.result}\"\n```\n\n### 35.2.8\
  \ 事件与监听器绑定\n\n绑定表达式也可以用于响应视图上的事件以触发方法调用。例如，可以配置 `Button` 视图在被点击时调用某个方法。在标题为在 Android\
  \ Studio 中创建一个 Android 示例应用的章节中，例如按钮的 `onClick` 属性被配置为调用应用主 Activity 中名为 `convertCurrency()`\
  \ 的方法。在 XML 文件中，其表示如下：\n\n```xml\nandroid:onClick=\"convertCurrency\"\n```\n\n`convertCurrency()`\
  \ 方法在以下行中声明：\n\n```java\npublic void convertCurrency(View view) {\n.\n.\n}\n```\n\
  \n请注意，这种类型的方法调用总是会传递一个发生事件的视图引用。在数据绑定中，可以使用以下表达式实现相同的效果（假设布局已绑定到一个变量名为 `uiController`\
  \ 的类）：\n\n```xml\nandroid:onClick=\"@{uiController::convertCurrency}\"\n```\n\n\
  另一个选项（并且提供了向方法传递参数的能力）被称为监听器绑定。以下表达式使用这种方法在同一个 `viewModel` 实例上调用无参数的方法：\n\n```xml\n\
  android:onClick='@{() -> myViewModel.methodOne()}'\n```\n\n以下表达式调用了一个需要三个参数的方法：\n\
  \n```xml\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result, 10, \"\
  A String\")}'\n```\n\n绑定表达式提供了一种丰富且灵活的语言，可以将用户界面视图绑定到其他对象的数据和方法，本章仅涵盖了最常见的用例。要了解更多关于绑定表达式的信息，请查看\
  \ Android 在线官方文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n### 35.3 总结\n\nAndroid 数据绑定提供了一种系统，可以在用户界面布局中的视图与应用架构中其他对象的数据和方法之间建立连接，而无需编写代码。一旦完成了一些初始配置步骤，数据绑定只需涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的，也可以是双向的，还可以用于绑定在响应用户界面内按钮点击等事件时执行的方法。\n\
  \n# 36. Android Jetpack 数据绑定教程\n\n到目前为止，我们在书中已经涵盖了现代 Android 应用架构的基础概念，并详细查看了 `ViewModel`\
  \ 和 `LiveData` 组件。数据绑定的概念在上一章中也有涉及，现在将在本章中使用它来进一步修改 `ViewModelDemo` 应用。\n\n## 36.1\
  \ 冗余代码\n\n如果你还没有这样做，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便在下一章中再次使用。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目中到本章结束时不再需要的全部代码来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `MainFragment.java` 文件并按如下修改代码：\n\n\
  ```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n.\n.\nimport android.arch.lifecycle.Observer;\n\
  .\n.\npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  .\n.\n    @Override\n    public void onViewCreated(@NonNull View view,\n       \
  \                      @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        final Observer<Float> resultObserver = new Observer<Float>()\
  \ {\n            @Override\n            public void onChanged(@Nullable final Float\
  \ result) {\n                binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                    \"%.2f\", result));\n            }\n        };\n        mViewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n        binding.convertButton.setOnClickListener(v -> {\n  \
  \          if (!binding.dollarText.toString().equals(\"\")) {\n                mViewModel.setAmount(String.format(Locale.ENGLISH,\"\
  %s\",\n                    binding.dollarText.getText()));\n            } else {\n\
  \                binding.resultText.setText(\"No Value\");\n            }\n    \
  \    });\n    }\n.\n.\n```\n\n接下来，编辑 `MainViewModel.java` 文件并继续按如下删除代码（同样注意 `dollarText`\
  \ 转换为 `LiveData`）：\n\n```java\npackage com.ebookrenzy.viewmodeldemo.ui.main;\nimport\
  \ android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  public class MainViewModel extends ViewModel {\n    private static final Float rate\
  \ = .7F;\n    final MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\n    final MutableLiveData<Float> result\
  \ = new MutableLiveData<>();\n    public void setAmount(String value) {\n      \
  \  this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText));\n\
  \    }\n    public MutableLiveData<Float> getResult() {\n        return result;\n\
  \    }\n}\n```\n\n虽然我们在实现数据绑定过程中会添加额外的代码，但显然数据绑定显著减少了需要编写的代码。\n\n## 36.2 启用数据绑定\n\
  \n使用数据绑定的第一步 Android Studio 项目中启用它。这需要在 `Gradle Scripts -> build.gradle (:app)`\
  \ 文件中添加一个新属性。在 `build.gradle` 文件中，添加以下元素以在项目中启用数据绑定：\n\n```gradle\nplugins {\n \
  \   id 'com.android.application'\n}\nandroid {\n    buildFeatures {\n        viewBinding\
  \ true\n        dataBinding true\n    }\n}\n```\n\n一旦添加了项，编辑器顶部会出现一个包含 `Sync Now`\
  \ 链接的栏。点击该链接根据新的构建设置同步项目。\n\n## 36.3 添加布局元素\n\n正如 Android Jetpack 数据绑定概述所示，为了能够使用绑定，布局层次必须有一个布局组件作为根视图。这需要对\
  \ `fragment_main.xml` 布局文件（app -> res -> layout -> fragment_main.xml）进行以下更改。在布局编辑器中打开此文件，切换到\
  \ Code 模式并进行这些更改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n        xmlns:tools=\"http://schemas.android.com/tools\"\
  \n        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n\n.\n.\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n\
  ```\n\n\n\n\n\n完成这些更改后，切换回设计模式，并注意新的根视图虽然在布局画布上不可见，但现在已列在组件树中，如图 36-1 所示：\n\n![](img/as_3.5_databinding_layout.jpg)\n\
  \n图 36-1\n\n构建并运行应用，以验证布局元素的添加没有以任何方式更改用户界外观。\n\n## 36.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加数据元素。在本例中，布局将绑定到\
  \ `MainViewModel`，因此编辑 `fragment_main.xml` 文件，按如下所示添加数据元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\" />\n    </data>\n\
  \    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"@+id/main\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n    ...\n</layout>\n\
  ```\n\n再次构建并运行应用，以确保这些更改生效。\n\n## 36.5 使用绑定类\n\n下一步是修改 `MainFragment.java` 文件中的代码以膨胀数据绑定。实现此的方法是重写\
  \ `onCreateView()` 方法：\n\n```java\nimport androidx.databinding.DataBindingUtil;\n\
  import com.ebookfrenzy.viewmodeldemo.R;\n\npublic class MainFragment extends Fragment\
  \ {\n    public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        binding = FragmentMainBinding.inflate(inflater, container, false);\n\
  \        binding = DataBindingUtil.inflate(\n                inflater, R.layout.fragment_main,\
  \ container, false);\n        binding.setLifecycleOwner(this);\n        return binding.getRoot();\n\
  \    }\n}\n```\n\n旧代码只是膨胀了 `fragment_main.xml` 布局文件（换句话说，创建了包含所有视图对象的布局），并返回根视图（顶层布局容器）的引用。数据绑定库包含一个实用类，提供了一个特殊的膨胀方法，该方法在构建\
  \ UI 的同时还会初始化并返回布局数据绑定类的实例。新代码调用此方法并将绑定类实例的引用存储在变量中：\n\n```java\nbinding = DataBindingUtil.inflate(\n\
  \    inflater, R.layout.fragment_main, container, false);\n```\n\n绑定对象只需要在 fragment\
  \ 存在期间保留在内存中。为了确保 fragment 消失时销毁实例，将当前 fragment 声明为绑定对象的生命周期所有者。\n\n```java\nbinding.lifecycleOwner\
  \ = this;\nreturn binding.getRoot();\n```\n\n## 36.6 将 ViewModel 实例分配给数据绑定变量\n\n\
  此时，数据绑定知道它将绑定到类型为 `MainViewModel` 的类实例，尚未连接到实际的 `MainViewModel` 对象。这需要额外的步骤，将应用内部使用的\
  \ `MainViewModel` 实例分配给布局文件中声明的 `viewModel` 变量。在 `MainFragment.java` 文件的 `onViewCreated()`\
  \ 方法中添加代码：\n\n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\
  \n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.setViewModel(viewModel);\n\
  }\n```\n\n如果 Android Studio 报告 `myViewModel` 未定义，请使用 `Build` 菜单重新构建项目以强制生成类。完成这些更改后，下一步是开始在数据绑定文件的视图中插入表达式。\n\
  \n## 36.7 添加表达式\n\n第一个绑定将 `resultText` TextView 绑定到模型中的结果值。编辑 `fragment_main.xml`\
  \ 文件，找到 `resultText` 元素并修改属性如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@{myViewModel.result == 0 ? \\\"Enter value\\\" : String.valueOf(myViewModel.result)\
  \ + \\\" euros\\\"}\"\n    app:layout_constraint_toBottomOf=\"@id/dollarText\"\n\
  \    ... />\n```\n\n该表达式首先检查结果是否为零，如果是，则显示一条指示用户输入值的消息。然而，如果结果不为零，则将值转换为字符串并与单词“euros”拼接，然后显示给用户。结果只需要单向绑定，不需要更新模型。另一方面，`EditText`\
  \ 视图需要双向绑定，以便可以使用用户输入的最新值来更新模型。该元素现在应声明如下：\n\n```xml\n<EditText\n    android:id=\"\
  @+id/dollarText\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginTop=\"96dp\"\n    android:ems=\"10\"\n\
  \    android:inputType=\"number\"\n    android:text=\"@={myViewModel.dollarValue}\"\
  \n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraint_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop=\"\
  @id/resultText\" />\n```\n\n## 36.8 添加转换方法\n\n当点击 Convert 按钮时，它将调用 ViewModel 上的方法进行计算并将欧元值放入\
  \ `result` 变量中。现在在 `MainViewModel.java` 文件添加此方法：\n\n```java\npublic class MainViewModel\
  \ extends ViewModel {\n    private final Float usd_to_eu_rate = 0.74F;\n    final\
  \ MutableLiveData<String> dollarValue = new MutableLiveData<>();\n    final MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n\n    public void convertValue() {\n      \
  \  if ((dollarValue.getValue() != null) && (!dollarValue.getValue().equals(\"\"\
  )) {\n            result.setValue(Float.parseFloat(dollarValue.getValue()) * usd_to_eu_rate);\n\
  \        } else {\n            result.setValue(0F);\n        }\n    }\n}\n```\n\n\
  注意，在没有有效的美元值的情况下，会被赋予 `result` LiveData。这确保了如果用户没有输入值，分配 `resultText` TextView 的绑定表达式将显示“Enter\
  \ value”消息。\n\n## 36.9 添加监听器绑定\n\n在测试项目之前的最后一步是对布局文件中的 Button 元素添加监听器绑定表达式，以便在点击按钮时调用\
  \ `convertValue()` 方法。再次以代码模式编辑 `fragment_main.xml` 文件，找到 `convertButton` 元素并添加\
  \ `onClick` 条目：\n\n```xml\n<Button\n    android:id=\"@+id/convertButton\"\n    android:layout_width=\"\
  wrap_content\"\n    android:onClick=\"@() -> myViewModel.convertValue()\"/>\n```\n\
  \n\n\n\n\n```xml\n    android:layout_height=\"wrap_content\"\n    android:onClick=\"\
  @{() -> myViewModel.convertValue()}\"\n    android:text=\"@string/convert_text\"\
  \n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toBottomOf=\"@+id/resultText\" />\n```\n\n\
  # 36.10 测试应用\n\n编译并运行应用，测试在美元字段中输入一个值并点击“Convert”（转换）按钮，是否会在 `TextView` 上显示正确的结果（以及带有“euros”（欧元）后缀），以及当在美元字段为空时尝试转换，是否会显示“Enter\
  \ value”（输入值）提示。此外，还要验证用户界面中显示的信息在设备旋转后是否仍然保留。\n\n# 36.11 总结\n\n本章的主要目标是完成设置项目以使用数据所需的步骤，并演示单向、双向和监听器绑定表达式的使用。本章还提供了一个实际示例，展示了通过将数据绑定结合\
  \ `LiveData` 连接用户界面视图与应用的后端数据和逻辑，可以节省多少代码编写。\n\n# 37. Android ViewModel 状态保存教程\n\
  \n应用状态的保存和恢复关键在于在应用被置于后台后，从外观和行为上为用户提供连续性。用户已经习惯了在不同应用之间切换，并在返回原始应用时，发现它处于切换发生之前的完全相同的状态。\n\
  \n正如标题为“理解 Android 应用程序和 Activity 生命周期”的章节，了解设置 Android Studio 环境的步骤。\n\n一旦应用被终止，返回设备或模拟器并从启动器中选择该应用（不要仅从\
  \ Android Studio 内部重新运行应用）。一旦应用出现，它看起来就像刚刚启动的一样，之前的美元和欧元值都丢失了。然而，从用户的角度来看，应用只是从后台恢复的，应该仍然包含原始数据。在这种情况下，应用未能提供用户对\
  \ Android 应用所期待连续性。\n\n## 37.2 实现 ViewModel 状态保存\n\n基础的 ViewModel 状态保存通过引入 ViewModel\
  \ Saved State 库得以实现。该库本质上扩展了 `ViewModel` 类，以支持在后台进程终止及随后的重新启动期间维护状态。\n\n保存状态的关键是\
  \ `SavedStateHandle` 类，它用于保存和恢复 view model 实例的状态。`SavedStateHandle` 对象包含一个键值映射，允许通过引用相应的键来保存和恢复数据值。\n\
  \n为了支持保存状态，需要声明一种不同的 ViewModel 子类，在这种情况下，它包含一个可以接收 `SavedStateHandle` 实例的构造函数。一旦声明，就可以在创建时包含一个\
  \ `SavedStateViewModelFactory` 对象来创建此类类型的 `ViewModel` 实例。考虑来自标准 ViewModel 声明的代码片段：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n.\n\n.\n\n}\n```\n\n创建此类类实例的代码可能类似于以下：\n\n```java\nprivate MainViewModel\
  \ mViewModel;\n\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n另一方面，设计用于支持保存状态的 ViewModel 子类需要如下所示声明：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  \n.\n\n.\n}\n```\n\n在创建上述 ViewModel 的实例时，必须向 `ViewModelProvider` 类初始化器传递 `SavedStateViewModelFactory`\
  \ 实例，如下：\n\n```java\nSavedStateViewModelFactory factory = new SavedStateViewModelFactory(getActivity().getApplication());\n\
  \nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n##\
  \ 37.3 保存和恢复状态\n\n在 ViewModel 内部可以通过将其传递给 `SavedStateHandle` 实例的 `set()` 方法来保存对象或值，提供检索时引用的键字符串：\n\
  \n```java\nprivate static final String NAME_KEY = \"Customer Name\";\n\nsavedStateHandle.set(NAME_KEY,\
  \ customerName);\n```\n\n配合 `LiveData` 对象使用时，可以使用 `SavedStateHandle` 实例的 `getLiveData()`\
  \ 方法恢复之前的值，再次引用相应的键如下：\n\n```java\nMutableLiveData<String> restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n恢复普通（非 LiveData）对象，只需使用 `SavedStateHandle` 的 `get()` 方法：\n\n```java\nString\
  \ restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n其他 `SavedStateHandle` 方法包括：\n\
  \n- `contains(String key)` - 返回布尔值，指示保存状态是否包含指定键的值。\n- `remove(String key)` - 从保存状态中移除值和键。返回被移除的值。\n\
  - `keys()` - 返回包含保存状态中所有键的字符串集合。\n\n# 37.4 为 ViewModelDemo 项目添加状态保存支持\n\n\n\n\n\n\
  在涵盖了 ViewModel Saved State 的基础知识后，可以扩展 `ViewModelDemo` 应用以包含此项支持。首先，将“Android Jetpack\
  \ LiveData 教程”中创建的 `ViewModelDemo_LiveData` 项目导入 Android Studio（示例代码下载中也有项目的副本），打开\
  \ `build.gradle` (Module :app) 文件并添加 Saved State 库依赖（像往常一样检查是否有更新的库版本）：\n\n```gradle\n\
  dependencies {\n    implementation \"androidx.savedstate:savedstate:1.2.0\"\n  \
  \  implementation \"androidx.lifecycle:lifecycle-viewmodel-savedstate:2.5.1\"\n\
  }\n```\n\n接下来，修改 `MainViewModel.java` 文件，使构造函数接受并存储 `SavedStateHandle` 实例。同时导入 `androidx.lifecycle.SavedStateHandle`，声明一个键常量，并修改结果\
  \ `LiveData` 变量，以便现在从构造函数中的保存状态中获取值：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private static final String RESULT_KEY = \"Euro Value\";\n  \
  \  private static final Float rate = 0.74F;\n    private String dollarText = \"\"\
  ;\n\n    final private SavedStateHandle savedStateHandle;\n    final private MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n     \
  \   result = savedStateHandle.getLiveData(RESULT_KEY);\n    }\n}\n```\n\n继续留在 `MainViewModel.java`\
  \ 文件中，修改 `setAmount()` 方法，包含代码以在每次计算新的欧元金额时保存结果值：\n\n```java\npublic void setAmount(String\
  \ value) {\n    this.dollarText = value;\n    result.setValue(Float.valueOf(dollarText)*\
  \ rate);\n    Float convertedValue = Float.parseFloat(dollarText)* rate;\n    result.setValue(convertedValue);\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n完成对 `ViewModel`\
  \ 的更改后，打开 `MainFragment.java` 文件并进行以下更改，以便在 ViewModel 创建过程中包含一个 Saved State 工厂实例：\n\
  \n```java\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\n@Override\n\
  public void onCreate(@Nullable Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory =\n            new SavedStateViewModelFactory(\n\
  \                getActivity().getApplication(),this);\n    mViewModel = new ViewModelProvider(this,\
  \ factory).get(MainViewModel.class);\n    // TODO: Use the ViewModel\n}\n```\n\n\
  注意，上述代码中对 `ViewModelProvider` 的更改可能会导致 Android Studio 生成以下语法错误：\n\n`Cannot resolve\
  \ constructor ‘ViewModelProvider(MainFragment, SavedStateViewModelFactory)’`\n\n\
  此语法错误是错误的，可以忽略。应用程序仍然可以成功编译并运行。\n\n完成更改后，构建并运行应用，进行货币转换。当屏幕 UI 填充了美元和欧元值时，将应用置于后台，使用\
  \ `adb` 工具终止它，然后从设备或模拟器屏幕上重新启动。重启后，之前的货币金额应该仍然显示在 `TextView` 和 `EditText` 组件中，这证明状态已成功保存并恢复。\n\
  \n### 37. 总结\n\n一个设计良好的应用程序在从后台恢复时，应该始终向用户呈现相同的状态，无论期间包含应用程序的进程是否被操作系统终止。在与 `ViewModels`\
  \ 工作时，可以通过利用 `ViewModel Saved State` 模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接受 `SavedStateHandle`\
  \ 实例，该实例反可以通过一系列方法调用来保存和恢复数据值。在创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用程序将在后台终止期间自动保存和恢复状态。\n\n### 38. 与 Android 生命周期感知组件一起工作\n\n之前的章节“理解\
  \ Android 应用和 Activity 生命周期” 描述了如何使用生命周期方法来跟踪 UI 控制器（如 activity 或 fragment）内部生命周期状态的变化。这些方法的主要问题之一是，它们将处理生命周期变化的负担交给了\
  \ UI 控制器。从表面上看，这似乎是合逻辑的方法，因为 UI 控制器毕竟是经历状态变化的对象。然而事实是，通常受状态变化影响的代码始终位于应用中的其他类中。这导致\
  \ UI 控制器中出现了需要管理和操作对象的复杂代码。\n\n本章将引入使生命感知能够构建到 Android 应用中的术语和关键组件。\n\n#### 38.1.\
  \ 生命周期感知\n\n如果一个对象能够检测并响应其他对象生命周期状态的变化，则认为对象是生命感知的。某些 Android 组件（`LiveData` 是一个很好的例子）已经是生命感知的。通过实现\
  \ `LifecycleObserver` 接口，也可以配置任何类为生命感知。\n\n#### 38.2. 生命周期所有者 (Lifecycle Owners)\n\
  \n生命感知组件只能观察作为生命所有者的对象的状态。生命所有者实现 `LifecycleOwner` 接口，并分配一个辅助 `Lifecycle` 对象，该对象负责存储组件的当前状态并向生命观察者提供状态信息。大多数标准\
  \ Android 组件（如 activity 和 fragment 类）都是生命所有者。自定义类也可以通过使用 `LifecycleRegistry` 类实现\
  \ `LifecycleOwner` 接口来配置为生命所有者。例如：\n\n```java\npublic class SampleOwner implements\
  \ LifecycleOwner {\n    private LifecycleRegistry lifecycleRegistry;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        lifecycleRegistry = new LifecycleRegistry(this);\n    }\n\n    @NonNull\n\
  \    @Override\n    public Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n\
  \    }\n}\n```\n\n除非生命所有者是另一个生命感知组件的子类，否则该类将需要通过调用 `LifecycleRegistry` 类的方法自己触发生命周期状态变化。`markState()`\
  \ 方法可以用于触发生命周期状态变化并传递新的状态值：\n\n```java\npublic void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n\n\n\n上述调用将导致对相应事件处理程序的调用。或者，调用 `LifecycleRegistry.handleLifecycleEvent()`\
  \ 方法并传递要触发的生命周期事件（这将导致生命周期状态改变）。例如：\n\n```java\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  ```\n\n## 38.3 生命周期周期观察者 (Lifecycle Observers)\n\n为了让生命周期感知组件能够观察生命周期所有者（lifecycle\
  \ owner）的状态，它必须实现 `DefaultLifecycleObserver` 接口，并重写它需要观察的任何生命周期变化事件的方法。\n\n```java\n\
  public class SampleObserver implements DefaultLifecycleObserver {\n    // 在此处重写生命周期事件方法\n\
  }\n```\n\n然后创建此观察者类的实例并添加到 `Lifecycle` 对象维护的观察者列表中。\n\n```java\ngetLifecycle().addObserver(new\
  \ SampleObserver());\n```\n\n如果观察者不再需要跟踪生命周期状态，也可以随时从 `Lifecycle` 对象中移除。\n\n图 38-1\
  \ 阐述了提供生命周期感知能力的关键元素之间的关系：\n\n![](img/lifecycle_component_diagram.jpg)\n\n图 38-1\n\
  \n## 38.4 生命周期状态与事件\n\n当生命周期所有者的状态发生变化时，对应的 `Lifecycle` 对象将更新为新状态。在任何给定时刻，生命周期所有者将处于以下五个状态之一：\n\
  \n- `Lifecycle.State.INITIALIZED`（初始化）\n- `Lifecycle.State.CREATED`（已创建）\n- `Lifecycle.State.STARTED`（已启动）\n\
  - `Lifecycle.State.RESUMED`（已恢复）\n- `Lifecycle.State.DESTROYED`（已销毁）\n\n随着组件转换不同的状态，`Lifecycle`\
  \ 对象将对已列表列表任何观察者触发事件。在生命周期观察者中，可以重写以下事件方法：\n\n- `onCreate()`\n- `onResume()`\n-\
  \ `onPause()`\n- `onStop()`\n- `onStart()`\n- `onDestroy()`\n\n例如，以下代码重写了 `DefaultLifecycleObserver.onResume()`\
  \ 方法：\n\n```java\n@Override\npublic void onResume(@NonNull LifecycleOwner owner)\
  \ {\n    // 响应 Resume 状态事件执行任务\n}\n```\n\n图 38-2 中的流程图说明了生命周期所有者的状态变化顺序，以及在每次状态转换之间触发在观察者的生命周期事件：\n\
  \n![](img/android_lifecycle_states_diagram.jpg)\n\n图 38-2\n\n## 38.5 总结\n\n本章介绍了生命周期感知的基础，以及\
  \ Android Jetpack 中的 Android Lifecycle 包类和接口。该包包含了许多用于创建生命周期所有者、生命周期观察者和感知感知组件的类和接口。生命周期所有者被分配了一个\
  \ `Lifecycle` 对象，该对象维护所有者状态的记录以及订阅观察者的列表。当所有者的状态发生变化时，会通过生命周期事件方法通知观察者，以便响应变化。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何使用和创建生命周期感知组件，包括创建生命周期观察者和所有者，以及对生命周期状态变化和事件的处理。\n\
  \n## 39. Android Jetpack 生命周期感知感知教程\n\n上一章提供了生命周期感知的概述，并概述了在 Android 应用项目中实现此点的关键类和接口。本章将在这些知识的基础上，通过构建一个旨在突出实际生命周期感知的\
  \ Android Studio 项目来深入。\n\n### 39.1 创建示例生命周期项目\n\n从欢迎界面选择“New Project”（新建项目）快速启动选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前选择\
  \ Fragment + ViewModel 模板。\n\n在 `Name` 字段输入 `LifecycleDemo` 并指定 `com.ebookfrenzy.lifecycledemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将最低 API 级别设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 Java。\n\
  \n### 39.2 创建生命周期观察者\n\n正如之前讨论的，activity 和 fragment 已经实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中看到这一点，教程的下一步是在项目中添加一个新类，该类能够观察\
  \ `MainFragment` 实例。\n\n要添加新类，在 Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo`，并在生成的菜单中选择\
  \ `New` -> `Java Class...`。在新类对话框中，将类命名为 `DemoObserver` 并按下键盘 Return 键创建 `DemoObserver.java`\
  \ 文件。新文件应自动在编辑器中打开，其内容如下：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\n\
  public class DemoObserver {\n\n}\n```\n\n留在编辑器中，修改类文件以声明它将实现 `DefaultLifecycleObserver`\
  \ 接口：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n}\n```\n\n下一步是重写\
  \ `DefaultLifecycleObserver` 类的生命周期方法。为了本示例，，所有事件将将被处理，每个事件都会向 Logcat 面板输出一条显示事件类型的消息。按照以下列表所示更新观察者类：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport android.util.Log;\n\
  import androidx.annotation.NonNull;\nimport androidx.lifecycle.LifecycleOwner;\n\
  // ...\n\npublic class DemoObserver implements DefaultLifecycleObserver {\n    private\
  \ String LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void onCreate(@NonNull\
  \ LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\");\n    }\n\n    @Override\n\
  \    public void onResume(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG,\
  \ \"onResume\");\n    }\n\n    @Override\n    public void onPause(@NonNull LifecycleOwner\
  \ owner) {\n        Log.i(LOG_TAG, \"onPause\");\n    }\n\n    @Override\n    public\
  \ void onStart(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onStart\"\
  );\n    }\n\n    @Override\n    public void onStop(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStop\");\n    }\n\n    @Override\n    public void\
  \ onDestroy(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onDestroy\"\
  );\n    }\n}\n```\n\n### 39.3 添加观察者\n\n通过调用 `getLifecycle()` 方法获取 `Lifecycle` 对象的引用，并通过调用该\
  \ `Lifecycle` 对象的 `addObserver()` 方法将观察者添加到生命周期所有者中。\n\n```java\n// ...\nimport\
  \ com.ebookfrenzy.lifecycledemo.DemoObserver;\n// ...\n\n@Override\npublic void\
  \ onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState) {\n   \
  \ super.onViewCreated(view, savedInstanceState);\n    getLifecycle().addObserver(new\
  \ DemoObserver());\n}\n```\n\n在完成观察者类并将其添加到生命周期所有者对象后，应用就可以进行测试了。\n\n### 39.4 测试观察者\n\
  \n由于 DemoObserver 类将诊断信息输出到 Logcat 控制台，如果配置了过滤器只显示 DemoObserver 消息，将更容易看到输出。按照之前在“Android\
  \ Activity 状态示例”中概述的步骤，显示 Logcat 面板并在字段中输入以下键：\n\n`package:mine tag:DemoObserver`\n\
  \n在成功启动应用后，Logcat 输出应指示以下生命周期状态变化和事件：\n\nonCreate\n\nonStart\n\nonResume\n\n在应用运行期间，执行设备旋转以触发\
  \ fragment 的销毁和重建，产生以下额外的输出：\n\nonPause\n\nonStop\n\n\n\n\n`onDestroy`\n`onCreate`\n\
  `onStart`\n`onResume`\n\n在进入本章的下一节之前，请花些时间将应用的输出结果与上一章中 图 38-2 的流程图进行对比。\n\n## 39.5\
  \ 创建 Lifecycle Owner\n\n本章的最后一个任务是创建一个自定义的生命周期所有者类，并演示如何从该类内部触发事件并修改生命周期状态。\n\n\
  在 Project 工具窗口中右键点击 app -> `java` -> `com.ebookfrenzy.lifecycledemo` 项，选择 `New`\
  \ -> `Java Class...` 菜单选项添加新类。在 Create Class 对话中将类命名为 `DemoOwner`，然后按回车键。在代码编辑器加载新的\
  \ `DemoOwner.java` 文件后，对其进行如下修改：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \nimport androidx.lifecycle.Lifecycle;\n\nimport androidx.lifecycle.LifecycleOwner;\n\
  import androidx.lifecycle.LifecycleRegistry;\n\nimport androidx.annotation.NonNull;\n\
  \npublic class DemoOwner implements LifecycleOwner {\n\n}\n```\n\n该类需要一个用自身引用初始化的\
  \ `LifecycleRegistry` 实例，以及一个配置为返回该 `LifecycleRegistry` 实例的 `getLifecycle()` 方法。声明一个变量存储\
  \ `LifecycleRegistry` 引用，一个初始化 `LifecycleRegistry` 实例的构造函数并添加 `getLifecycle()` 方法：\n\
  \n```java\npublic class DemoOwner implements LifecycleOwner {\n\n    private final\
  \ LifecycleRegistry lifecycleRegistry;\n\n    public DemoOwner() {\n        lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    }\n\n    @NonNull\n    @Override\n    public\
  \ Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\
  \n接下来，该类需要通知注册表生命周期状态的变化。可以通过 `LifecycleRegistry` 对象的 `markState()` 方法标记状态，也可以通过\
  \ `handleLifecycleEvent()` 方法触发生命周期事件。自定义类中什么构成状态变化取决于类的目的。在本示例中，我们将添加一些方法，在调用时简单地触发生命周期事件：\n\
  \n```java\nprivate final LifecycleRegistry lifecycleRegistry;\n\n    public void\
  \ startOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  \    }\n\n    public void stopOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  \    }\n\n    @NonNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n```\n\n`DemoOwner` 类中的最后一次更改是将 `DemoObserver`\
  \ 类作为观察者添加。此调用通过向类中添加以下构造函数来实现：\n\n```java\npublic DemoOwner() {\n    lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n将 `MainFragment.java` 文件加载到代码编辑器，找到 `onViewCreated()` 方法并添加代码创建 `DemoOwner`\
  \ 类的实例并调用 `startOwner()` 和 `stopOwner()` 方法。请注意，添加 `DemoObserver` 作为观察者的调用已被移除。虽然单个观察者可以与多个所有者配合使用，但在情况下将其移除是为了避免在\
  \ Logcat 工具窗口中产生重复且混淆的输出：\n\n:java\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\
  \nprivate DemoOwner demoOwner;\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    demoOwner = new DemoOwner();\n    demoOwner.startOwner();\n\
  \    demoOwner.stopOwner();\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n## 39.6 测试自定义 Lifecycle Owner\n\n最后一次构建并运行应用，参考 Logcat 工具窗口并确认观察者按照以下顺序检测到创建、启动和停止生命周期事件：\n\
  \n`onCreate`\n`onStart`\n`onStop`\n\n注意，尽管没有在 `DemoOwner` 类中添加代码来手动执行此操作，“已创建”状态的变化仍被触发了。事实上，这些变化是在所有者实例首次创建时以及随后的处理\
  \ `ON_STOP` 事件时自动触发的。\n\n## 39.7 总结\n\n本章实际演示了在 Android 应用中实现生命周期感知所需的步骤。这包括创建生命周期观察者，以及设计和实现一个基础生命周期所有者类。\n\
  \n# 40. 导航架构组件概述\n\n如今很少有 Android 应用是仅由单个屏幕组成的。事实上，大多数应用由多个屏幕组成，用户通过屏幕手势、按钮点击和菜单选择在这些屏幕之间导航。在\
  \ Android Jetpack 引入之前，应用内的导航很大程度上是一个手动编码过程。然而，随着导航图的引入，这种情况得到了显著改善。\n\n## 40.1\
  \ 理解导航\n\n每个应用都有一个在应用启动和启动屏之后出现的主屏幕（启动屏是应用加载时显示的屏幕）。从这个主屏幕，用户通常会执行会导致其他屏幕出现的任务。这些屏幕通常以\
  \ Activity 和 Fragment 的形式存在。例如，消息应用可能有一个列出当前消息的主屏幕，用户从那里导航到联系人列表或设置屏幕。联系人列表屏幕可能会允许用户导航到其他屏幕，在其中可以添加新用户或更新现有联系人。在图形上，应用的导航可以如图\
  \ 40-1 所示：\n\n(image/jetpack_navigation_graph.jpg)\n\n图 40-1\n\n构成应用的每个屏幕（包括主屏幕）统称为目的地（destination），通常是一个\
  \ Fragment 或 Activity。导航架构使用导航栈来跟踪用户通过目的地的路径。当应用首次启动时，主屏幕是第一个被放入栈中的目的地并成为当前目的地。当用户导航到另一个目的地时，该屏幕将成为当前目的地并推入栈中。例如图\
  \ 40-2 显示了假设的消息应用在用户启动并导航到“添加联系人”屏幕后的导航栈当前状态：\n\n(image/jetpack_navigation_stack_diagram.jpg)\n\
  \n图 40-2\n\n当用户使用系统返回键返回屏幕返回时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上的唯一目的地。在图 40-3 中，用户已从添加联系人屏幕返回，将其从栈中弹出，并使联系人列表屏幕成为当前目的地：\n\
  \n(image/jetpack_navigation_stack_pop_diagram.jpg)\n\n图 40-3\n\n目的地之间导航和管理导航栈的所有工作由导航控制器处理，它由\
  \ `NavController` 类表示。\n\n## 40.2 声明导航主机\n\n\n\n\n导航宿（Navigation host）仅仅是一个特殊的片段（`NavHostFragment`），它嵌入到\
  \ activity 的用户界面布局中，作为用户导航的目的地的占位符。例如，图 40-4 显示了一个典型的 activity 屏幕，并突出了由导航宿片段表示的区域：\n\
  \n![](img/jetpack_navigation_navhost.jpg)\n\n图 40-4\n\n在 Android Studio 布局编辑器中，可以通过从调色板的\
  \ Containers 部分拖放实例，或者通过如下手动编辑 XML，将 `NavHostFragment` 放入 activity 布局中：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n上述导航宿片段元素中的重点是：`name` 属性对 `NavHostFragment` 的引用、将 `defaultNavHost`\
  \ 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 activity 启动时，此导航宿片段将被导航图中指定的首页目的地替换。当用户在应用屏幕之间导航时，宿片段将被对应目的地的适当片段所替换。\n\
  \n## 40.3 导航图\n\n导航图（Navigation graph）是一个 XML 文件，包含了应用导航中包含的目的地。除了这些目的地之外，文件还包含了定义目的地之间导航的导航动作，以及从一个目的地传递数据到另一个目的地的可选参数。Android\
  \ Studio 包含了一个导航图编辑器，可用于设计图表并通过可视化方式或手动编辑 XML 来实现动作。\n\n图 40-5 显示了设计模式下的 Android\
  \ Studio 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 40-5\n\n目的地列表\
  \ (A) 提供了图中当前包含的所有目的地的列表。从列表中选择一个目的地将定位并选中图中对应的目的地（这对于在大型图中定位特定目的地特别有用）。导航图面板 (B)\
  \ 包含每个目的地的对话框，显示了用户界面布局的表示。在此示例中，此图包含两个命名为 `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头\
  \ (C) 代表导航动作连接。可以通过将鼠标指针悬停在源地边缘直到出现一个圆圈，然后从圆圈点击并拖动到目的地来添加动作。属性面板 (D) 允许查看和修改当前所选目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为\
  \ E 的按钮并从菜单中选择选项可以添加新目的地。可以选择将现有的片段或 activity 作为目的地，或者创建新的空白片段目的地。组件树面板 (F) 提供了导航图的层级概览。\n\
  \n可以通过将编辑器切换到代码模式来查看和修改导航图的底层 XML。以下 XML 列表代表了上方 图 40-5 所示目的地和动作连接的导航图：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"fragment_main\"\n        tools:layout=\"@layout/fragment_main\"\
  >\n        <action\n            android:id=\"@+id/actionToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.second.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n## 40.4 访问导航控制器\n\n从一个目的地到另一个目的地的导航通常是响应应用内的某种事件触发的，例如按钮点击或菜单选择。在触发导航动作之前，代码必须先获取导航控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()`。例如，以下代码可访问 activity\
  \ 的导航控制器。注意，为了使代码运行，activity 必须包含一个导航宿：\n\n```java\nNavController controller = Navigation.findNavController(activity,\
  \ R.id.demo_nav_host_fragment);\n```\n\n在这种，方法调用传递了 activity 的引用以及嵌入 activity 布局的\
  \ `NavHostFragment` 的 ID。\n\n或者，可以通过简单地将视图传递给方法来识别与视图关联的导航控制器：\n\n```java\nNavController\
  \ controller = Navigation.findNavController(binding.button);\n```\n\n最后一种选项通过调用\
  \ `NavHostFragment` 类的 `findNavController()` 方法并传递片段引用片段查找导航控制器：\n\n```java\nNavController\
  \ controller = NavHostFragment.findNavController(fragment);\n```\n\n## 40.5 触发导航动作\n\
  \n一旦找到导航控制器，就可以调用控制器的 `navigate()` 方法并传递要执行动作的资源 ID 来触发导航动作。例如：\n\n```java\ncontroller.navigate(R.id.goToContactsList);\n\
  ```\n\n动作的 ID 在选择动作连接时在导航图编辑器的属性面板中定义。\n\n## 40.6 传递参数\n\n在导航过程中，可以使用导航图文件中定义的参数将数据从一个目的地传递到另一个目的地。参数由名称、类型和可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在图中选择动作箭头或目的地时使用属性面板添加。例如在图 40-6 中，声明了一个名为 `contactsCount` 的整数参数，其默认值为\
  \ 0：\n\n![](img/jetpack_navigation_action.jpg)\n\n图 40-6\n\n\n\n\n一旦添加，参数将放置在接收目的地的\
  \ XML 元素中，例如：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n   \
  \ android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"\
  fragment_second\"\n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n\
  \        android:name=\"contactsCount\"\n        android:defaultValue=0\n      \
  \  app:type=\"integer\" />\n</fragment>\n```\n\n导航架构组件（Navigation Architecture Component）提供了两种在目的地之间传递数据的技术。一种方法是将数据放入一个\
  \ `Bundle` 对象中，并在动作（action）期间将其传递给目的地，然后在目的地处对其进行解包并提取参数。\n\n这种特定方法的主要缺点是它不是“类型安全的（type\
  \ safe）”。换句话说，如果接收端将参数处理为与声明时不同的类型（例如，将字符串处理为整数），该错误不会被编译器捕获，并可能在运行时引起问题。\n\n更好的选项（也是本书中所采用的方法）是使用\
  \ `safeargs`。`safeargs` 是 Android Studio Gradle 构建系统的一个插件，它会自动生成特殊的类，允许以类型安全的方式传递参数。`safeargs`\
  \ 的参数传递方法将在下一章中描述和演示（“Android Jetpack 导航组件教程”）。\n\n## 40.7 总结\n\n在 Android 应用用户界面的上下文中，`Navigation`（导航）指的是用户在不同屏幕之间来回移动的能力。曾经实现导航非常耗时且难以组织，而现在\
  \ Android Studio 和导航架构组件使得在 Android 应用项目内实现和管理导航变得更加容易。\n\n应用中的不同屏幕被称为 `destinations`（目的地），通常由碎片（fragments）或活动（activities）表示。所有应用都有一个主页，包含应用首次加载时显示的屏幕。该布局的内容区域被一个导航宿主碎片（navigation\
  \ host fragment）取代，当用户导航应用时，该碎片会被切换为其他目的地碎片。导航路径由导航图文件定义，该文件由目的地以及将它们连接在一起的动作，以及在目的地之间传递的任何参数组成。导航由\
  \ `navigation controllers`（导航控制器）处理，它们除了管理导航栈外，还提供了从应用代码内部启动导航动作的方法。\n\n## 41. 一个\
  \ Android Jetpack 导航组件教程\n\n上一章描述了 Android Jetpack 导航组件以及它如何与 Android Studio 的导航图功能集成，以提供实现\
  \ Android 应用屏幕之间导航的简易方法。在本章中，将创建一个新的 Android Studio 项目，利用这些导航功能实现一个包含多个屏幕的示例应用。除了演示\
  \ Android Studio 导航图编辑器的用法外，该示例项目还将实现使用类型安全参数在源屏幕和目的地屏幕之间传递数据。\n\n### 41.1 创建 NavigationDemo\
  \ 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前，选择 `Fragment\
  \ + ViewModel` 模板。\n\n在 `Name` 字段输入 `NavigationDemo` 并指定 `com.ebookfrenzy.navigationdemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`菜单设置为 `Java`。\n\n### 41.2 向构建配置中添加导航\n\n新的 Android Studio\
  \ 项目默认不会在构建文件中包含导航组件库。因此，在执行任何其他任务之前，第一步是修改应用 级的 `build.gradle` 文件。在项目工具窗口中找到该文件（Gradle\
  \ Scripts -> `build.gradle (Module :app)`），双击将其加载到代码编辑器中，并修改 `dependencies` 部分以添加导航库。同时利用此机会为此模块启用\
  \ `view binding`（视图绑定）：\n\n```gradle\nandroid {\n    buildFeatures {\n        viewBinding\
  \ true\n    }\n}\n\n.\ndependencies {\n    implementation 'androidx.navigation:navigation-fragment:2.5.3'\n\
  \    implementation 'androidx.navigation:navigation-ui:2.5.3'\n.\n}\n```\n\n注意，自本书出版以来，这些库可能已经发布了更新版本。在文件中添加导航依赖项后，点击\
  \ `Sync Now`（立即同步）链接重新同步项目的构建配置。\n\n### 41.3 创建导航图资源文件\n\n在构建配置中添加导航库后，现在可以向项目中添加导航图资源文件了。正如“导航架构组件概述”所述，这是一个\
  \ XML 文件，其中包含了用户能够导航的碎片和活动，以及用于执行转换的动作和在目的地之间传递的任何数据。\n\n在 Project 工具窗口中，找到 `res`\
  \ 文件夹（app -> res），右键点击它并选择 `New ->Android Resource File`（新建 Android 资源文件）菜单选项：\n\
  \n![](img/as_3.2_navigation_new_resource_menu.jpg)\n\n图 41-1\n\n选择菜单项后，会出现 `New\
  \ Resource File`（新建资源文件）对话框。在此对话框中，将文件命名为 `navigation_graph`，并将 `Resource type`（资源类型）菜单更改为\
  \ `Navigation`，如图 41-2 所示，然后点击 `OK` 创建文件。\n\n![](img/as_3.2_navigation_resource_file.jpg)\n\
  \n图 41-2\n\n导航图资源文件添加到项目后，它将出现在主面板中，准备好添加目的地。将编辑器切换到代码模式，并在添加任何目的地之前查看表的 XML：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/navigation_graph\">\n\n</navigation>\n```\n\n将编辑器切换回 Design\
  \ 模式，注意 `Destinations`面板的 `Host` 部分显示未检测到宿主碎片：\n\n![](img/as_4.1_navigation_hosts.jpg)\n\
  \n图 41-3\n\n在任何目的地之前，下一步是在项目中添加导航宿主碎片。\n\n### 41.4 声明导航宿主\n\n对于本项目，导航宿主碎片将包含在主活动的用户界面布局中。这意味着导航图中的目的地碎片将出现在当前由\
  \ `fragment_main.xml` 布局占据活动的内容区域。在 Project 工具窗口中找到主活动布局文件（app -> res -> layout\
  \ -> `activity_main.xml`）并将其加载到布局编辑器中。\n\n在 Design 模式下，从 `Palette`（调板）的 `Containers`\
  \ 部分拖出一个 `NavHostFragment` 元素，并将其放置到活动布局的容器区域，如图 41-4 中的箭头所示：\n\n![](img/as_3.6_add_navhostfragment.jpg)\n\
  \n图 41-4\n\n在弹出的 `Navigation Graphs` 对话中，选择上一节创建的 `navigation_graph.xml` 文件并点击 `OK`\
  \ 按钮。\n\n选中布局中新添加的 `NavHostFragment` 实例，使用 `Attributes` 工具窗口将元素的 `ID` 更改为 `demo_nav_host_fragment`。\n\
  \n将布局编辑器切换到代码模式并查看 XML 文件。注意编辑器已正确配置 `navigationGraph` 属性以引用 `navigation_graph.xml`\
  \ 文件，并且 `defaultNavHost` 属性已设置为 `true`：\n\n\n\n\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n在主 Activity 布局文件中配置了 `NavHostFragment` 后，需要从 `MainActivity.java`\
  \ 类文件中移除一些代码，以防止 Activity 在运行时加载 `fragment_main.xml` 文件。将此文件加载到编辑器中，找到 `onCreate()`\
  \ 方法并移除负责显示主 fragment 代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    if (savedInstanceState == null) {\n        getSupportFragmentManager().beginTransaction()\n\
  \                    .replace(R.id.container, MainFragment.newInstance())\n    \
  \                .commitNow();\n    }\n}\n```\n\n返回 `navigation_graph.xml` 文件并确认已检测到\
  \ `NavHostFragment` 实例（如果更改未显示，可能需要先关闭并重新打开文件）：\n\n![](img/as_navigation_host_added.jpg)\n\
  \n图 41-5\n\n### 41.5 添加导航目的地\n\n留在导航图中，现在是添加第一个目的地的时间了。由于项目已经有了一个第一个屏幕的 fragment（`fragment_main.xml`），它将是添加到图中的第一个目的地。点击如图\
  \ 41-6 所示的新目的地按钮，以选择或创建目的地：\n\n![](img/as_navigation_add_destination.jpg)\n\n图 41-6\n\
  \n选择 `fragment_main` 作为目的地，以便它出现在导航图中：\n\n![](img/as_navigation_destination_added.jpg)\n\
  \n图 41-7\n\n位于目的地节点上方的主页图标表示这是起始目的地。这意味着当包含 `NavHostFragment` 的 Activity 创建时，该目的地将是第一个显示的内容。要将起始目的地更改另一个目的地，请选择图中的该节点并点击工具栏上的主页按钮。\n\
  \n通过将编辑器切换到代码（Code）模式查看导航图的 XML 内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"fragment_main\"\n        tools:layout=\"@layout/fragment_main\"\
  \ />\n</navigation>\n```\n\n在执行任何导航之前，图至少还需要一个目的地。这次，将使用导航图编辑器创建一个新的空白目的地。切换回设计（Design）模式，并再次点击新目的地（New\
  \ Destination）按钮，这次从菜单中选择“创建新目的地”（Create new destination）选项。在弹出的对话框中，选择 Fragment（空白）模板，将新\
  \ fragment 命名为 `SecondFragment`，布局命名为 `fragment_second`，然后点击完成（Finish）按钮。在项目重新构建的简短延迟后，新\
  \ fragment 将作为另一个目的地出现在图中，如图 41-8 所示：\n\n![](img/as_3.2_navigation_second_destination.jpg)\n\
  \n图 41-8\n\n### 41.6 设计目的地 fragment 布局\n\n在添加用于在目的地之间跳转的动作之前，现在是为图中两个目的地 fragment\
  \ 添加一些用户界面组件的好时机。首先，双击 `mainFragment` 目的地，使 `fragment_main.xml` 文件加载到布局编辑器中。选择并删除当前的\
  \ `TextView` 小控件，然后将 `Button` 和 `Plain Text EditText` 小控件拖到布局中，使其类似于下方图 41-9 所示：\n\
  \n![](img/as_4.1_navigation_demo_ui.jpg)\n\n图 41-9\n\n一旦视图位置正确，点击工具栏上的“推断约束”（Infer\
  \ constraints）按钮以为布局添加任何缺少的约束。选择 `EditText` 视图，并使用属性（Attributes）工具窗口删除默认的“Name”文本，并将控件的\
  \ ID 更改为 `userText`。\n\n返回 `navigation_graph.xml` 文件并双击 `secondFragment` 目的地将 `fragment_second.xml`\
  \ 文件加载到布局编辑器，然后选择并删除默认的 `TextView`。在组件树（Component Tree）面板中，右键点击 `FrameLayout` 并选择“从\
  \ FrameLayout 转换”（Convert from FrameLayout）菜单，接受默认设置：\n\n![](img/as_3.2_navigation_destination.jpg)\n\
  \n图 41-10\n\n使用属性窗口，将 `FrameLayout` 的 ID 更改为 `constraintLayout`。在 fragment 的父布局已转换为\
  \ `ConstraintLayout` 的情况下，拖入一个新的 `TextView` 小控件使其位于布局中心，并点击 `Infer` 添加约束。将其 ID 更改为\
  \ `arg`。\n\n41.7 为导航图添加动作\n\n现在两个目的地已添加到图中并设计了相应的界面，项目现在需要一种从主 fragment 导航到第二个 fragment\
  \ 的方法。这将通过图中添加动作来实现，然后在代码中引用它。\n\n要建立以主 fragment 为起点、第二个 fragment 为目的地的动作，打开导航图，并将鼠标指针悬停在\
  \ `mainFragment` 目的地的右边缘中心，如图 41-11 所示会出现圆形：\n\n![](img/as_4.1_connection.jpg)\n\
  \n图 41-11\n\n点击圆形内部并将生成的线条拖到 `secondFragment` 目的地：\n\n![](img/as_4.1_connecting.jpg)\n\
  \n图 41-12\n\n释放线条以建立起点和目的地之间的动作连接，此时线条将变为如图 41-13 所示的箭头：\n\n![](img/as_4.1_connected.jpg)\n\
  \n图 41-13\n\n动作连接可以随时通过选择并按 Delete 键删除。选中箭头后，查看属性窗口中的可用属性并将 ID 更改为 `mainToSecond`。这就是代码中引用该动作的\
  \ ID。将编辑器切换到代码模式，注意动作已包含在 XML 中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/navigation_graph\"\n    app:startDestination=\"@id/mainFragment\"\
  >\n    <fragment\n        android:id=\"@+id/mainFragment\"\n        android:name=\"\
  com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\n        android:label=\"\
  fragment_main\"\n        tools:layout=\"@layout/fragment_main\" >\n        <action\n\
  \            android:id=\"@+id/mainToSecond\"\n            app:destination=\"@id/secondFragment\"\
  \ />\n    </fragment>\n</navigation>\n```\n\n\n\n\n\n```xml\n            android:id=\"\
  @+id/mainToSecond\"\n            app:destination=\"@id/secondFragment\" />\n\n \
  \   </fragment>\n\n    <fragment\n        android:id=\"@+id/secondFragment\"\n \
  \       android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n       \
  \ android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n```\n\n41.8 实现 OnFragmentInteractionListener\n\n在添加触发动作的代码之前，需要修改 `MainActivity`\
  \ 类以实现 `OnFragmentInteractionListener` 接口。该接口是在导航图编辑器中创建空白 fragment 时，在 `SecondFragment`\
  \ 类内部自动生成的。为了符合该接口，activity 需要实现一个名为 `onFragmentInteraction()` 的单一方法，该方法用于实现 fragment\
  \ 与 activity 之间的通信。\n\n编辑 `MainActivity.java` 文件并进行修改如下：\n\n```java\nimport android.net.Uri;\n\
  \npublic class MainActivity extends AppCompatActivity implements SecondFragment.OnFragmentInteractionListener\
  \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n如果 Android Studio 报告 `OnFragmentInteractionListener` 未定义（某些版本的 Android\
  \ Studio 会自动添加，而另一些则不会），请编辑 `SecondFragment.java` 文件并添加以下内容：\n\n```java\nimport\
  \ android.net.Uri;\n\npublic interface OnFragmentInteractionListener {\n    // TODO:\
  \ 更新参数类型和名称\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n41.9 为目标 Fragment\
  \ 添加 View Binding 支持\n\n由于我们需要访问 fragment 布局中的某些视图，因此需要修改当前代码以启用 view binding 支持。首先编辑\
  \ `MainFragment.java` 文件并进行以下更改：\n\n```java\nimport com.ebookfrenzy.navigationdemo.databinding.FragmentMainBinding;\n\
  \npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private FragmentMainBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n\n    @Nullable\n    @Override\n\
  \    public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        return inflater.inflate(R.layout.fragment_main, container, false);\n\
  \        binding = FragmentMainBinding.inflate(inflater, container, false);\n  \
  \      return binding.getRoot();\n    }\n\n    @Override\n    public void onDestroyView()\
  \ {\n        super.onDestroyView();\n        binding = null;\n    }\n}\n```\n\n\
  对 `SecondFragment.java` 文件重复上述步骤，这次引用 `FragmentSecondBinding`。\n\n41.10 触发动作\n\n\
  现在动作已添加到导航图中，下一步是在主 fragment 中添加一些代码，以便在点击 `Button` 控件时触发该动作。找到 `MainFragment.java`\
  \ 文件，将其加载到代码编辑器并重写 `onViewCreated()` 方法，以获取按钮实例的引用并配置 `OnClickListener` 实例，以便在用户点击按钮时调用：\n\
  \n```java\nimport android.widget.Button;\nimport androidx.navigation.Navigation;\n\
  \npublic class MainFragment extends Fragment {\n\n    @Override\n    public void\
  \ onViewCreated(@NonNull View view,\n                             @Nullable Bundle\
  \ savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.button.setOnClickListener(new View.OnClickListener() {\n      \
  \      @Override\n            public void onClick(View view) {\n               \
  \ Navigation.findNavController(view).navigate(R.id.mainToSecond);\n            }\n\
  \        });\n    }\n}\n```\n\n上述代码获取了导航控制器的引用并在该实例上调用 `navigate()` 方法，将动作的资源 ID\
  \ 作为参数传递。编译并运行应用，验证点击主 fragment 中的按钮跳转到第二个 fragment。\n\n作为设置监听器方法的替代方案，`Navigation`\
  \ 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目标。因此，可以使用以下单行代码启动跳转：\n\
  \n```java\nbinding.button.setOnClickListener(Navigation.createNavigateOnClickListener(R.id.mainToSecond,\
  \ null));\n```\n\n41.11 使用 Safeargs 传递数据\n\n下一个目标是将主 fragment 中 `EditText` 视图中输入的文本传递到第二个\
  \ fragment，并在那里通过 `TextView` 控件进行显示。如上一章所述，Android Navigation 组件支持两种传递数据的方法。本章将使用类型安全的传递。\n\
  \n使用 `safeargs` 的第一步是在 Gradle 配置中添加 `safeargs` 插件。使用 Project 窗口，找到并编辑项目级的 `build.gradle`\
  \ 文件（`Gradle Scripts` -> `build.gradle` (Project: `NavigationDemo`），如下所示添加插件依赖（再次提醒，可能有更新的版本）：\n\
  \n```gradle\n// 顶层构建文件，可以在其中添加适用于所有子项目/模块的配置。\nbuildscript {\n    dependencies {\n\
  \        classpath(\"androidx.navigation:navigation-safe-args-gradle-plugin:2.5.3\"\
  )\n    }\n}\n\nplugins {\n//\n}\n```\n\n接下来，编辑模块级的 `build.gradle` 文件（`Gradle Scripts`\
  \ -> `build.gradle` (Module :app)），如下所示应用插件并重新同步项目：\n\n```gradle\nplugins {\n  \
  \  id 'com.android.application'\n    id 'androidx.navigation.safeargs'\n}\n\nandroid\
  \ {\n//\n}\n```\n\n下一步是定义目标接收的任何参数，在本例中，目标是第二个 fragment。编辑导航图，选择 `secondFragment`\
  \ 目标，并在 Attributes 工具窗口中找到 `Arguments` 部分。点击 `+` 按钮（如图 41-14 所示）为目标添加新参数：\n\n![](img/as_3.6_nav_graph_add_argument.jpg)\n\
  图 41-14\n\n点击 `+` 按钮后，会弹对话框，需要在其中输入参数名称、类型和默认值。将参数命名为 `message`，将类型设置为 `String`，在默认值字段输入\
  \ `No Message`，并点击 `Add` 按钮：\n\n![](img/as_3.6_nav_graph_add_argument_dialog.jpg)\n\
  图 41-15\n\n新配置的参数将出现在 `navigation_graph.xml` 文件的 `secondFragment`元素中：\n\n```xml\n\
  <fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"message\"\n        app:argType=\"string\"\
  \ />\n        android:defaultValue=\"No Message\"\n</fragment>\n```\n\n下一步是在 `MainFragment.java`\
  \ 文件中添加代码，从 `EditText` 视图提取文本并在导航动作期间将其传递给第二个 fragment。这将涉及使用由 `safeargs` 插件自动生成的特殊导航类。目前导航涉及\
  \ `MainFragment` 类、`SecondFragment` 类、名为 `mainToSecond` 的动作以及名为 `message` 的参数。\n\
  \n当项目构建时，`safeargs` 插件将生成以下额外类，用于在导航期间传递和接收参数。\n\n\n\n\n\n- `MainFragmentDirections`\
  \ - 此类表示导航动作的起点（使用导航起点的类名，并在末尾添加“Directions”来命名），并提供对动作对象的访问。\n\n- `ActionMainToSecond`\
  \ - 此类表示执行转换的动作（根据导航图文件中分配给动作的 ID 命名，并在开头带有“Action”前缀）。该类为目标地上配置的每个参数提供了一个设置方法（setter）。例如，由于第二个片段目标地（second\
  \ fragment destination）包含一个名为 `message` 的参数，该类包含一个名为 `setMessage()` 的方法。配置完成后，该类的实例将传递给导航控制器的\
  \ `navigate()` 方法，以导航到目的地。\n\n- `SecondFragmentArgs` - 在目标片段中用于访问从起点传递的参数的类（使用导航目的地的类名，并在末尾添加“Args”来命名）。该类为传递到目的地的每个参数提供了一个获取方法（getter），例如\
  \ `getMessage()`。\n\n使用这些类，可以对 `MainFragment.java` 文件中 `onViewCreated()` 方法内的 `onClickListener`\
  \ 代码进行如下修改，以从 `EditText` 组件中提取当前文本，将其应用于动作，并启动到第二个片段的转换：\n\n```java\nbinding.button.setOnClickListener(view1\
  \ -> {\n    MainFragmentDirections.MainToSecond action =\n            MainFragmentDirections.mainToSecond();\n\
  \n    action.setMessage(binding.userText.getText().toString());\n\n    Navigation.findNavController(view1).navigate(action);\n\
  });\n```\n\n上述代码获取了动作对象的引用，使用 `setMessage()` 方法设置参数字符串，然后调用导航控制器的 `navigate()` 方法并传递动作对象。如果\
  \ Android Studio 报告 `MainFragmentDirections` 未定义，请使用 `Build -> Make Project` 选项重新构建项目以生成该类。\n\
  \n剩下的工作是修改 `SecondFragment.java` 类文件，在导航执行后接收参数并将其显示在 `TextView` 组件上。在本示例中，实现这些任务的代码将使用\
  \ `onStart()` 周期方法添加。编辑 `SecondFragment.java` 文件并添加此方法，使其内容如下：\n\n```java\n@Override\n\
  public void onStart() {\n    super.onStart();\n    SecondFragmentArgs args = SecondFragmentArgs.fromBundle(getArguments());\n\
  \    String message = args.getMessage();\n    binding.argText.setText(message);\n\
  }\n```\n\n上述方法中的代码首先获取 `TextView` 组件的引用。接下来，调用 `SecondFragmentArgs` 类的 `fromBundle()`\
  \ 方法提取从起点到的 `SecondFragmentArgs` 对象。由于示例中的参数在 `navigation_graph.xml` 文件名为 `message`，因此在\
  \ `args` 对象上调用相应的 `getMessage()` 方法来获取字符串值。然后将该字符串显示在 `TextView` 组件上。\n\n编译并运行应用，并在点击\
  \ `Button` 组件之前输入一些文本。当第二个片段目的地出现，`TextView` 现在应该显示在主片段中输入的文本，这表明数据已在导航目的地之间成功传递。\n\
  \n## 41.12 总结\n\n本章提供了如何结合使用导航架构组件（Navigation Architecture Component）和 Android Studio\
  \ 导航图编辑器实现 Android 应用导航的示例。涵盖的主题包括创建包含现有和新目标片段的导航图、在 Activity 布局中嵌入导航宿主片段、编写触发导航事件的代码，以及使用\
  \ Gradle `safeargs` 插件在目的地之间传递参数。\n\n## 42. MotionLayout 简介\n\n`MotionLayout` 类为用户界面布局中的视图添加动画效果提供了一种简单的方法。本章将首先提供\
  \ MotionLayout 的概述，并介绍 `MotionScenes`（场景）、`Transitions`（过渡）和 `Keyframes`（关键帧）的概念。在涵盖这些基础之后，接下来两章（标题为“Android\
  \ MotionLayout 编辑教程”和“MotionLayout Cycle 教程”）将通过创建示例项目提供 MotionLayout 动画的更多细节和示例。\n\
  \n### 42.1 MotionLayout 概述\n\n`MotionLayout` 是一种布局容器，其主要目的是对布局内视图从一个状态到另一个状态的转换执行动画。例如，`MotionLayout`\
  \ 可以使 `ImageView` 实例在指定时间内从屏幕左上角移动到右下角。除了位置，其他属性的变化也可以动画化，例如颜色、大小或旋转角度。这些状态变化还可以插值（使得视图在整个动画过程中移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间沿直线执行，也可以实现为遵循由起点和终点之间不同位置中间点的路径。`MotionLayout`\
  \ 还支持使用触摸和滑动来启动并控制动画。\n\n`MotionLayout` 动画完全在 XML 中声明，通常不需要编写任何代码。这些 XML 声明可以在 Android\
  \ Studio 代码编辑器中手动实现、使用 `MotionLayout` 编辑器视觉化实现，或结合使用两种方法。\n\n### 42.2 MotionLayout\n\
  \n在实现动画时，必须首先将用户界面中常用的 `ConstraintLayout` 容器转换为 `MotionLayout` 实例（此任务可以通过在布局编辑器中右键点击\
  \ `ConstraintLayout` 并选择 `Convert to MotionLayout` 选项来实现）。`MotionLayout` 还需要至少 2.0.0\
  \ 的 `ConstraintLayout` 库。\n\n意外，由于它是 `ConstraintLayout` 的子类，`MotionLayout` 支持 `ConstraintLayout`\
  \ 的所有布局功能。因此，当使用 `MotionLayout` 处理不需要动画的视图时，用户界面布局可以用完全相同的方式设计。\n\n对于需要动画的视图，会声明两个\
  \ `ConstraintSet` 来定义视图在动画开始和结束时的外观和位置。`transition` 声明定义了关键帧，用于在开始和结束状态之间对目标视图应用额外效果，以及用于启动和控制动画的点击和滑动处理器。\n\
  \n开始和结束的 `ConstraintSet` 以及过渡都在 `MotionScene` XML 文件中声明。\n\n### 42.3 MotionScene\n\
  \n正如我们在前面的章节中看到的，XML 布局文件包含配置呈现给用户的静态视图的外观和布局所需的信息，在使用 `MotionLayout` 时也是如此。对于非静态视图（即将进行动画的视图），这些视图仍然声明在布局文件中，但与这些视图相关的开始、结束和过渡声明存储在单独的\
  \ XML 文件中，称为 `MotionScene` 文件（这样命名是因为所有声明都定义在 `MotionScene` 元素内）。该文件被导入布局 XML 文件，并包含开始和结束的\
  \ `ConstraintSet` 对以及 `Transition` 声明（单个文件可以包含多个 `ConstraintSet` 组合和 `Transition`\
  \ 声明，允许对用户界面布局中的特定视图实现不同的动画）。\n\n以下显示了 `MotionScene` 文件的模板：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n```\n\n\n\n\n\n```xml\n<xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上述 XML 中，声明了名为 `start` 和 `end` 的 `ConstraintSets`（尽管可以使用任何名称），在此时，它们尚未包含任何约束元素。`Transition`\
  \ 元素定义了这些 `ConstraintSets` 代表动画的起始点和结束点，并包含一个空的 `KeyFrameSet` 元素，准备好填充额外的动画关键帧项。`Transition`\
  \ 元素还包含一个毫秒级的持续时间属性（duration），用于控制动画的运行时间。\n\n`ConstraintSets` 并不意味着视图的移动。例如，可以让起始集和结束集声明屏幕上的相同位置，然后使用过渡来动画其他属性的变化，如\
  \ `scale` 和旋转角度。\n\n## 42.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets`\
  \ 允许将全套 `ConstraintLayout` 设置在定位、尺寸以及与父视图和其他其他视图的关系方面应用于视图上。此外，以下属性也可以包含在 `ConstraintSet`\
  \ 声明中：\n\n- `alpha`\n- `visibility`\n- `elevation`\n- `rotation`\n- `rotationX`\n\
  - `rotationY`\n- `translationX`\n- `translationY`\n- `translationZ`\n- `scaleX`\n\
  - `scaleY`\n\n例如，为了在动画期间将视图旋转 180°，可以在起始和结束约束中声明如下：\n\n```xml\n<ConstraintSet android:id=\"\
  @+id/start\">\n    <Constraint\n        .\n        .\n        motion:layout_constraintStart_toStartOf=\"\
  parent\"\n        android:rotation=\"0\">\n    </Constraint>\n</ConstraintSet>\n\
  \n<ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        .\n        .\n\
  \        motion:layout_constraintBottom_toBottomOf=\"parent\"\n        android:rotation=\"\
  180\">\n    </Constraint>\n</ConstraintSet>\n```\n\n上述更改告诉 `MotionLayout` 视图将从 0°\
  \ 开始，然后在动画期间旋转完整的 180°，最后以倒置的姿态停止。\n\n## 42.5 自定义属性\n\n除了上述列出的标准属性外，还可以指定范围内的自定义属性（使用\
  \ `CustomAttribute` 声明）。事实上，视图类型上可用的任何属性都可以指定为自定义属性以包含在动画中。要识别属性名称，请从目标视图类的文档中找到\
  \ getter/setter 名称，删除 `get`/`set` 前缀并将剩余的第一个字符的大字母转为小写。例如，为了在代码中更改 `Button` 视图的背景颜色，我们可能如下所示调用\
  \ `setBackgroundColor()` setter 方法：\n\n```\nmyButton.setBackgroundColor(Color.RED)\n\
  ```\n\n在约束集或关键帧中设置此属性时，属性名称将为 `backgroundColor`。除了属性名称外，值还必须使用以下选项列表中的相应类型声明：\n\n\
  - `motion:customBoolean` - 布尔属性值。\n- `motion:customColorValue` - 颜色属性值。\n- `motion:customDimension`\
  \ - 维度属性值。\n- `motion:customFloatValue` - 浮点属性值。\n- `motion:customIntegerValue`\
  \ - 整数属性值。\n- `motion:customStringValue` - 字符串属性值。\n\n例如，颜色设置需要使用 `customColorValue`\
  \ 类型赋值：\n\n```xml\n<CustomAttribute\n    motion:attributeName=\"backgroundColor\"\
  \n    motion:customColorValue=\"#43CC76\" />\n```\n\n例如，以下摘自 `MotionScene` 文件的片段除了为视图声明了起始和结束约束外，还将背景颜色从绿色改为红色：\n\
  \n```xml\n.\n.\n    <ConstraintSet android:id=\"@+id/start\">\n        <Constraint\n\
  \            android:layout_width=\"wrap_content\"\n            android:layout_height=\"\
  wrap_content\"\n            motion:layout_editor_absoluteX=\"21dp\"\n          \
  \  android:id=\"@+id/button\"\n            motion:layout_constraintTop_toTopOf=\"\
  parent\"\n            motion:layout_constraintStart_toStartOf=\"parent\" >\n   \
  \         <CustomAttribute\n                motion:attributeName=\"backgroundColor\"\
  \n                motion:customColorValue=\"#33CC33\" />\n        </Constraint>\n\
  \    </ConstraintSet>\n    <ConstraintSet android:id=\"@+id/end\">\n        <Constraint\n\
  \            android:layout_width=\"wrap_content\"\n            android:layout_height=\"\
  wrap_content\"\n            motion:layout_editor_absoluteX=\"21dp\"\n          \
  \  android:id=\"@+id/button\"\n            motion:layout_constraintTop_toTopOf=\"\
  parent\"\n            motion:layout_constraintStart_toStartOf=\"parent\" >\n   \
  \         <CustomAttribute\n                motion:attributeName=\"backgroundColor\"\
  \n                motion:customColorValue=\"#FF0000\" />\n        </Constraint>\n\
  \    </ConstraintSet>\n```\n\n## 42.6 触发动画\n\n如果没有某种形式的事件来告诉 `MotionLayout` 启动动画，`MotionScene`\
  \ 中的某些设置将不会产生效果（视图将保持定位）。\n\n动画可以配置为响应点击（OnClick）或滑动（OnSwipe）而启动。`OnClick` 处理器会导致动画开始运行直到完成，而\
  \ `OnSwipe` 将沿时间线同步来回。`OnSwipe` 还会响应屏幕上的“甩动”动作。`OnSwipe` 处理器还提供了配置动画如何响应不同方向以及锚定边的选项。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 的 `Transition` 元素中。两种情况下都必须指定视图 ID。例如，为了实现一个锚定在名为\
  \ `button` 的视图底部的向下滑动 `OnSwipe` 处理器，可以将以下 放在 `Transition` 中：\n\n```xml\n.\n.\n<Transition\n\
  \    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"@id/start\"\
  \n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n    <OnSwipe\n\
  \        motion:touchAnchorId=\"@+id/button\"\n        motion:dragDirection=\"dragDown\"\
  \n        motion:touchAnchorSide=\"bottom\" />\n</Transition>\n```\n\n或者，为同一个按钮添加\
  \ `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@id/button\"\n    motion:clickAction=\"\
  toggle\" />\n```\n\n在示例中，动作已设置为 `toggle` 模式。该模式以及其他可用选项总结如下：\n\n- `toggle`: 动画到相反状态。例如，如果视图当前处于过渡起点，它将过渡到终点，反之亦然。\n\
  - `jumpToStart`: 立即跳转到起始状态，没有动画。\n- `jumpToEnd`: 立即跳转到结束状态，没有动画。\n- `transitionToStart`:\
  \ 动画过渡到起始状态。\n- `transitionToEnd`: 动画过渡到结束状态。\n\n## 42.7 弧线运动\n\n默认情况下，视图位置的移动将在起点和终点之间直线旅行。要将运动更改为弧线路径，只需在起始约束中使用如下的\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 设置来定义弧线是凹形还是凸形：\n\n\
  ```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n```\n\n\n\n\n\n\
  ```xml\nmotion:layout_editor_absoluteX=\"21dp\"\nandroid:id=\"@+id/button\"\nmotion:layout_constraintTop_toTopOf=\"\
  parent\"\nmotion:layout_constraintStart_toStartOf=\"parent\"\nmotion:pathMotionArc=\"\
  startVertical\" >\n```\n\n图 42-1 展示了 `startVertical` 和 `startHorizontal` 弧线运动与默认直线运动的对比：\n\
  \n![](img/motionlayout_arcMotion_three.jpg)\n\n图 42-1\n\n## 42.8 关键帧 (Keyframes)\n\
  \n到目前为止概述的所有 `ConstraintSet` 属性仅适用于动画的起点和终点。换句话说，如果在终点将 `rotation` 属性设置为 180°，那么\
  \ `rotation` 将在动画开始时启动并在到达终点时完成。因此，无法配置 `rotation` 在动画进行到 50% 处达到完全 180°，然后在动画结束时旋转回原始方向。幸运的是，使用\
  \ `Keyframes` 可以实现这种效果。\n\n关键帧用于定义动画过程中的中间点，并在这些点发生状态变化。例如，可以声明关键帧，使得视图的背景颜色在动画进行\
  \ 50% 处过渡到蓝色，在 75% 处变为绿色，并在动画结束时恢复原始颜色。关键帧实现在 `MotionScene` 文件的 `Transition`元素中，并嵌入在\
  \ `KeyFrameSet` 元素。\n\nMotionLayout 支持多种类型的关键帧，总结如下：\n\n### 42.8.1 属性关键帧 (Attribute\
  \ Keyframes)\n\n属性关键帧（使用 `KeyAttribute` ）允许在动画时间轴的中间点更改视图属性。`KeyAttribute` 支持上述为\
  \ `ConstraintSets` 列出的相同属性集，并结合了指定更改在动画时间轴何处生效的能力。例如，以下关键帧声明将导致 `button` 视图在水平（`scaleX`）和垂直（`scaleY`）方向上逐渐增大倍数，在时间轴\
  \ 50% 处达到完全尺寸。在时间轴的剩余时间内，视图尺寸将缩小到原始尺寸：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n            motion:motionTarget=\"\
  @+id/button\"\n            motion:framePosition=\"50\"\n            android:scaleX=\"\
  2.0\" />\n        <KeyAttribute\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:framePosition=\"50\"\n            android:scaleY=\"2.0\" />\n\
  \    </KeyFrameSet>\n```\n\n### 42.8.2 位置关键帧 (Position Keyframes)\n\n位置关键帧（`KeyPosition`）用于修改视图在起点和终点之间移动时遵循的路径。通过在时间轴上的不同点放置关键位置，可以为动画应用任何复杂程度路径。位置使用\
  \ `x` 和 `y` 坐标结合过渡时间轴中的对应点进行声明。这些坐标相对于以下坐标系之一声明：\n\n- `parentRelative` - `x` 和 `y`\
  \ 坐标相对于父容器，以百分比表示（表示为 0.0 到 1.0 之间的值）：\n\n![](img/motionlayout_parentRelative.jpg)\n\
  \n图 42-2\n\n- `deltaRelative` - `x` 和 `y` 坐标不是相对于父容器，而是相对于起点和终点。例如，起点为 (0, 0)，终点为\
  \ (1, 1)。记住 `x` 和 `y` 坐标可以是负值：\n\n![](img/motionlayout_deltaRelative.jpg)\n\n图 42-3\n\
  \n- `pathRelative` - `x` 和 `y` 坐标相对于路径，其中起点和终点之间的直线作为图表的 X 轴。再次，坐标以百分比表示（0.0 到 1.0）。这与\
  \ `deltaRelative` 坐标空间相似，但考虑了路径的角。同样，坐标可能为负的：\n\n![](img/motionlayout_pathRelative.jpg)\n\
  \n图 42-4\n\n例如，以下 `ConstraintSets` 声明了设备屏幕两侧的起点和终点。默认情况下，使用这些点的视图过渡将如 图 42-5 所示，跨越屏幕沿一条直线移动：\n\
  \n![](img/motionlayout_path.jpg)\n\n图 42-5\n\n然而，假设视图需要遵循类似于 图 42-6 中的路径：\n\n![](img/motionlayout_path.jpg)\n\
  \n图 42-6\n\n为了实现这一点，可以在过渡中如下声明关键帧点：\n\n```xml\n<KeyPosition\n    motion:motionTarget=\"\
  @+id/button\"\n    motion:framePosition=\"25\"\n    motion:keyPositionType=\"pathRelative\"\
  \n    motion:percentY=\"0.3\"\n    motion:percentX=\"25\"/>\n<KeyPosition\n    motion:motionTarget=\"\
  @+id/button\"\n    motion:framePosition=\"75\"\n    motion:keyPositionType=\"pathRelative\"\
  \n    motion:percentY=\"-0.3\"\n    motion:percentX=\"75\"/>\n```\n\n上述 `KeyPosition`\
  \ 元素使用路径坐标系在路径的 25% 和 75% 处创建了帧点。第一个位置在 (25, 0.3)，第二个位置在 (75, -0.3)。\n\n![](img/motionlayout_path.jpg)\n\
  \n## 42.9 线性度 (Linearity)\n\n在没有任何设置的情况下，上述动画将以恒定速度执行。要改变动画速度（例如，使其加速后减速），可以在 `ConstraintSet`\
  \ 内使用 `easing` 属性。对于复杂的缓动，可以通过在贝塞尔曲线上绘制点来定义线性度，例如：\n\n```xml\nmotion:easing=\"cubic(0.2,\
  \ 0.7, 0.3, 1)\"\n```\n\n如果你不熟悉贝塞尔曲线，可以考虑使用此处的曲线生成器：[`cubic-bezier.com/`](https://cubic-bezier.com/)\n\
  \n然而，对于大多数需求，可以使用内置的 `accelerate` 和 `decelerate` 值来指定缓动。\n\n## 42.10 触发器 (KeyTrigger)\n\
  \n触发关键帧（`KeyTrigger`）允许在动画到达时间轴内的指定帧位置时调用视图上的方法。这还考虑了动画的方向。例如，可以根据动画是向前运行还是反向运行调用不同的方法。考虑一个在动画移动超过时间轴\
  \ 20% 时显示的按钮。`KeyTrigger` 将通过如下方式在 `Transition` 元素的 `KeyFrameSet` 中实现，使用 `onPositiveCross`\
  \ 属性：\n\n```xml\n<KeyFrameSet>\n    <KeyTrigger\n        motion:framePosition=\"\
  20\"\n        motion:onPositiveCross=\"show\"\n        motion:motionTarget=\"@+id/button\"\
  />\n</KeyFrameSet>\n```\n\n同样，如果动画反向并掉到 10% 以下时隐藏同一个按钮，可以使用 `onNegativeCross` 属性添加第二个关键触发器：\n\
  \n```xml\n<KeyTrigger\n    motion:framePosition=\"10\"\n    motion:onNegativeCross=\"\
  show\"\n    motion:motionTarget=\"@+id/button2\"/>\n```\n\n如果动画使用切换（toggle）动作，只需使用\
  \ `onCross` 属性：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"10\"\n    motion:onCross=\"\
  show\"\n    motion:motionTarget=\"@+id/button2\"/>\n```\n\n\n\n\n虽然位置关键帧（position\
  \ keyframes）可以用于向动画添加中间状态变化但如果需要实现大量重复的位置和变化，这很快就会变得繁琐。对于需要对预测变化执行重复状态变化的情况，MotionLayout\
  \ 包含了 `Cycle`（循环）和 `Time Cycle`（时间循环）关键帧，这一主题将在名为 MotionLayout KeyCycle 教程的章节中详细介绍。\n\
  \n## 42.12 从代码启动动画\n\n到在本章为止，我们只查看了如何使用 `OnSwipe` 和 `OnClick` 处理器来控制动画。也可以通过调用 `MotionLayout`\
  \ 实例上的方法从代码内部启动动画。例如，以下代码将为名为 `motionLayout` 的布局运行耗时为 2000ms 的从开始（start）到结束（end）的过渡：\n\
  \n```java\nmotionLayout.setTransitionDuration(2000);\nmotionLayout.transitionToEnd();\n\
  ```\n\n在没有额外设置的情况下，用于动画的开始和结束状态将是 `MotionScene` 文件中 `Transition` 声明里定义的状态。要使用特定的开始和结束约束集，只需在调用\
  \ `MotionLayout` 实例的 `setTransition()` 方法时通过 id 引用它们：\n\n```java\nmotionLayout.setTransition(R.id.myStart,\
  \ R.id.myEnd);\nmotionLayout.transitionToEnd();\n```\n\n若要在动画运行时监控其状态，请如下所示为 `MotionLayout`\
  \ 实例添加一个过渡监听器：\n\n```java\nmotionLayout.setTransitionListener(transitionListener);\n\
  \nMotionLayout.TransitionListener transitionListener =\n    new MotionLayout.TransitionListener()\
  \ {\n        @Override\n        public void onTransitionStarted(MotionLayout motionLayout,\
  \ int startId, int endId) {\n            // 在过渡开始时调用\n        }\n\n        @Override\n\
  \        public void onTransitionChange(MotionLayout motionLayout, int startId,\
  \ int endId, float progress) {\n            // 每次属性变化时调用。跟踪进度值以查找\n            //\
  \ 当前位置\n        }\n\n        @Override\n        public void onTransitionCompleted(MotionLayout\
  \ motionLayout, int currentId) {\n            // 在过渡完成时调用\n        }\n\n       \
  \ @Override\n        public void onTransitionTrigger(MotionLayout motionLayout,\
  \ int triggerId, boolean positive, float progress) {\n            // 在交叉触发关键帧阈值时调用\n\
  \        }\n    };\n```\n\n## 42.13 总结\n\n`MotionLayout` 是 `ConstraintLayout` 的子类，专门设计用于用户界面布局中的视图添加动画效果。`MotionLayout`\
  \ 的工作原理是通过对视图在开始和结束约束集定义的两个状态之间的过渡来实现。可以使用关键帧在这些开始和结束点之间添加额外的动画效果。\n\n动画可以通过 `OnClick`\
  \ 或 `OnSwipe` 处理器触发，也可以通过调用 `MotionLayout` 实例的方法以编程方式触发。\n\n## 43. Android MotionLayout\
  \ 编辑器教程\n\n既然已经涵盖了 `MotionLayout` 的基础，本章将提供在示例项目中尝试 `MotionLayout` 的机会。除了继续探索 `MotionLayout`\
  \ 的主要功能外，本章还将介绍 `MotionLayout` 编辑器，并探索如何使用它来可视化构建和修改 MotionLayout 动画。\n\n在本章创建的项目将使用开始和结束\
  \ `ConstraintSets`（约束集）、手势处理器以及 `Attribute`（属性）和 `Position`（位置）关键帧。\n\n### 43.1\
  \ 创建 MotionLayoutDemo 项目\n\n点击欢迎屏幕上的 `New Project` 按钮，在出现的新项目对话框中，选择 `Empty Activity`\
  \ 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `MotionLayoutDemo` 并指定 `com.ebookfrenzy.motionlayoutdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级别设置为 `API 26`：Android 8.0 (Oreo)，并将语言菜单更改为\
  \ `Java`。\n\n### 43.2 ConstraintLayout 到 MotionLayout 的转换\n\n按照常例，Android Studio\
  \ 会 `activity_main.xml` 布局文件中放置一个 `ConstraintLayout` 容器作为父视图。下一步是将此容器转换为 `MotionLayout`\
  \ 实例。在 `Component Tree`（组件树）中，右键点击 `ConstraintLayout` 并选择 `Convert to MotionLayout`\
  \ 。\n\n做出选择后，点击 `Convert` 按钮。一旦转换完成，`MotionLayout` 编辑器将出现在主窗口中。\n\n作为转换过程的一部分，Android\
  \ Studio 还会创建一个名为 `xml` 的新文件夹，并在其中放置名为 `activity_main_scene.xml` 的 MotionLayout\
  \ 场景文件。该文件由一个顶层 `MotionScene` 元素组成，包含定义动画的 `ConstraintSet` 和 `Transition` 条。默认情况下，该文件将包含开始和结束的空元素以及初始过渡：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet />\n    </Transition>\n\
  \    <ConstraintSet android:id=\"@+id/start\" />\n    <ConstraintSet android:id=\"\
  @+id/end\" />\n</MotionScene>\n```\n\n在 MotionLayout 编辑器中进行的任何更改将存储在此文件中。同样，也可以直接编辑此文件在\
  \ MotionLayout 编辑器之外实现和修改动画。在本教程中，动画将主要使用 MotionLayout 编辑器实现。然而，在每个阶段，我们都会花时间查看这些更改如何反映在底层\
  \ MotionScene 文件中。随着章节进行，你会发现 MotionScene XML 语法实际上简单且易于学习。\n\n本教程的第一阶段将演示使用 MotionLayout\
  \ 对 `Button` 对象制作动画，包括运动（遵循路径）、旋转和尺寸缩放。\n\n### 43.3 配置开始和结束约束\n\n将 `activity_main.xml`\
  \ 文件加载到 MotionLayout 编辑器后，确保选中下方的 Motion Layout 框（如图 43-5 (#MotionLayout_Editor_Tutorial.xhtml__idTextAnchor885)所示），然后删除默认的\
  \ `TextView`，最后从调色板拖放 `Button` 视图到布局画布的左上角，如图 43-4 (#MotionLayout_Editor_Tutorial.xhtml__idTextAnchor884)\
  \ 所示：\n\n在选中按钮后，使用 `Attributes` 工具窗口将 `id` 更改为 `myButton`。\n\n正如上一章概述，MotionLayout\
  \ 动画主要是一个指定视图如何在两个状态之间转换的案例。因此，实现动画的第一步是指定定义这些状态的约束。对于此示例，起点将是布局视图的顶部中心。要配置这些约束，请选择编辑器窗口中的开始约束集项（如图\
  \ 43-5 (#MotionLayout_Editor_Tutorial.xhtml__idTextAnchor885) 所示的 A 处）：\n\n\n\n\n\
  当选中起始框（start box）时，所有的约束和布局更改都将应用于起始点约束集。要返回针对整个布局的标准约束和属性，请点击 `Motion Layout` 框\
  \ (E)。\n\n接下来，在 `ConstraintSet` 列表中选择 `myButton` 项 (B)。注意，`Source` 列显示该按钮是根据布局文件中的约束进行定位的。相反，我们希望按钮根据起始约束集进行定位。在仍选中\
  \ `myButton` 的的情况下，点击 `Edit`（编辑）按钮 (C) 并从菜单中选择 `Create Constraint`（创建约束），之后，按钮项将指示该视图是根据起始约束集进行定位的：\n\
  \n![](img/as_4.0_motionlayout_editor_start_set.jpg)\n图 43-6\n\n起始约束集需要将按钮置在布局的顶部，带有\
  \ `8dp` 的偏移且水平居中。在 `myButton` 仍被选中的情况下，使用 `Attributes`（属性）工具窗口对视图的顶部、左侧和右侧设置约束如下：\n\
  \n![](img/as_4.0_motionlayout_start_constraints.jpg)\n图 43-7\n\n选择结束约束集项（如上方 图 43-5\
  \ 中标记为 D 的），并重复这些步骤创建一个新约束，这次将按钮放置在布局的水平中心，但距离布局底部有 `8p` 的偏移：\n\n![](img/as_4.0_motionlayout_end_constraints.jpg)\n\
  图 43-8\n\n配置好起始和结束约束后，打开 `activity_main_scene.xml` 文件，并注意约束已添加到文件中：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <ConstraintSet\
  \ android:id=\"@+id/start\">\n        <Constraint\n            android:id=\"@+id/myButton\"\
  \n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"\
  wrap_content\"\n            motion:layout_constraintTop_toTopOf=\"parent\"\n   \
  \         android:layout_marginTop=\"8dp\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_toEndOf=\"parent\" />\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n        <Constraint\n            android:id=\"\
  @+id/myButton\"\n            android:layout_width=\"wrap_content\"\n           \
  \ android:layout_height=\"wrap_content\"\n            motion:layout_editor_absoluteY=\"\
  6dp\"\n            motion:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    motion:layout_constraintEnd_toEndOf=\"parent\"\n            motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n            android:layout_marginBottom=\"8dp\" />\n    </ConstraintSet>\n\
  </MotionScene>\n```\n\n同样注意，`Transition` 元素已经预配置，用于在 `1000` 毫秒内实现起始点和结束点之间的过渡动画。尽管我们尚未添加操作来启动过渡，但仍然可以在\
  \ `MotionLayout` 编辑器中预览动画。\n\n### 43.4 预览 MotionLayout 动画\n\n若要在不构建和运行应用的情况下预览动画，请选择\
  \ `MotionLayout` 编辑器中如下方 图 43-9 中标记为 A 的过渡箭头。这将显示动画时间线面板（标记为 B）：\n\n![](img/as_4.0_motionlayout_labeled_timeline.jpg)\n\
  图 43-9\n\n要测试动画，点击滑块 (C) 并拖动它。随着滑块沿画布 (D) 移动，动画将向前或向后移动。\n\n### 43.5 添加 OnClick\
  \ 手势\n\n虽然创建了一个简单的 `MotionLayout` 动画，但我们仍然需要一种方式来启动。这可以在 `MotionLayout` 编辑器中实现：选择上方\
  \ 图 43-9 中标记为 A 的过渡，在 `Attributes` 窗口中找到 `OnClick` 部分并点击 `+` 按钮：\n\n![](img/as_4.0_motionlayout_add.jpg)\n\
  图 43-10\n\n一旦选中，时间轴上将出现一个空的 `OnClick` 行。对于属性名称，输入 `targetId`，对于值字段，输入按钮的 id（`@id/myButton`）：\n\
  \n![](img/as_4.0_motionlayout_actions.jpg)\n图 43-11\n\n再次打开 `activity_main_scene.xml`\
  \ 文件并检查 `Transition` 中定义的 `OnClick`：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@+id/start\"\n    motion:duration=\"\
  1000\">\n    <FrameSet>\n        <OnClick targetId=\"@+id/myButton\" clickAction=\"\
  toggle\" />\n    </FrameSet>\n</Transition>\n```\n\n在设备或模拟器上编译并运行应用，确认点击按钮会导致它像\
  \ `MotionScene` 中定义的那样在起始点和结束点之间来回过渡。\n\n### 43.6 为过渡添加属性关键帧（Attribute Keyframe）\n\
  \n到目前为止，示例项目仅对按钮视图从屏幕上一个位置到另一个位置的运动进行了动画处理。属性关键帧（KeyAttribute）提供了一种在过渡过程中指定属性生效点的方法。例如，可以定义一个\
  \ `KeyAttribute`，使得当视图移动通过时间线的 30% 时，其尺寸已经增加了 50%。\n\n首先在 MotionLayout 编辑器中打开 `activity_main.xml`\
  \ 文件，选择过渡箭头以显示时间线，然后点击 图 43-13 中高亮的按钮：\n\n![](img/as_4.0_motionlayout_timeline_add_key_button.jpg)\n\
  图 43-13\n\n从菜单中选择 `KeyAttribute` 选项：\n\n![](img/as_4.0_motionlayout_timeline_add_key_attribute_menu.jpg)\n\
  图 43-14\n\n一旦选中，将出现如 图 43-15 所示的对话框。在对话框中，确保选中了 ID 并引用了 `myButton`。在位置字段中，输入 `50`（以百分比指定，0\
  \ 是起始点，100 是结束点）。最后在 Attribute 下拉菜单中选择 `rotation` 项，然后点击 `Add` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_dialog.jpg)\n\
  图 43-15\n\n\n\n一旦添加了 `KeyAttribute`，时间轴上就会出现该属性的行。点击该行将其高亮显示，然后点击行最左侧的展开箭头以展开属性过渡图。请注意，时间轴上会出现一个小小的菱形标记（如下方的\
  \ 图 43-16 所示），表示关键帧（key）的位置。图表表示了效果的线性程度。在这种情况下，按钮将稳定地旋转到指定的度数，并在关键帧位置达到最大旋转角度。随后，当到达终点时，按钮将旋转回\
  \ 0 度：\n\n![](img/as_motionlayout_attribute_timeline.jpg)\n\n图 43-16\n\n要更改 `KeyAttribute`\
  \ 的属性，请在时间轴上选择它，然后参考“属性”（Attributes）工具窗口。在 `KeyAttribute` 面板中，将旋转（rotation）属性更改为\
  \ 360 度：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_rotation_angle.jpg)\n\n\
  图 43-17\n\n通过来移动滑动块并观察按钮在布局画布上遍历动画路径时的旋转情况，来检查属性是否正常工作。参考 `activity_main_scene.xml`\
  \ 文件，它现在应该如下：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n\
  \    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"1000\">\n  \
  \  <KeyFrameSet>\n        <KeyAttribute\n            motion:motionTarget=\"@+id/myButton\"\
  \n            motion:framePosition=\"50\"\n            android:rotation=\"360\"\
  \ />\n    </KeyFrameSet>\n    <OnClick motion:targetId=\"@id/myButton\"\n      \
  \  motion:clickAction=\"toggle\" />\n</Transition>\n```\n\n使用过渡滑动块，或通过编译并运行应用来测试动画，验证按钮现在在动画过程中会旋转。\n\
  \n## 43.7 在 Transition 中添加自定义 CustomAttribute\n\n`KeyAttribute` 属性限于缩放大小和旋转等内置效果。通过声明\
  \ `CustomAttributes` 也可以实现额外的更改。与存储在 `Transition` 元素中的 `KeyAttributes` 不同，`CustomAttributes`\
  \ 位于起始和结束约束集中。因此，这些属性只能声明在起始和结束点生效（换句话说，你无法在过渡时间轴中间指定属性关键帧）。\n\n在本示例中，我们将配置按钮将颜色从红色逐渐变为绿色。首先选择\
  \ 图 43-18 中标记为 A 的起始框，然后选择 `myButton` 视图约束集 (B)：\n\n![](img/as_4.0_motionlayout_start_and_view.jpg)\n\
  \n图 43-18\n\n参考“属性”（Attributes）工具窗口，点击如下所示的 `CustomAttributes` 部分的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_custom_attr_add.jpg)\n\
  \n图 43-19\n\n在弹出的对话框中（图 43-20），将属性类型更改为 `Color`，并在 `Attribute Name` 字段中输入 `backgroundColor`。最后将其值设置为\
  \ `#F0A1F`：\n\n![](img/as_4.0_motionlayout_custom_attr_color.jpg)\n\n图 43-20\n\n\
  点击 `OK` 提交更改，然后选择 图 43-18 中标记为 C 的结束约束集，重复上述步骤添加自定义属性，这次指定值为 `#33CC`。使用时间轴滑动块或运行应用，确保颜色在动画期间发生变化。`CustomAttributes`\
  \ 的添加将反映在 `activity_main_scene.xml` 文件中如下：\n\n```xml\n<ConstraintSet android:id=\"\
  @+start\">\n    <CustomAttribute motion:attributeName=\"backgroundColor\" android:color=\"\
  #F0A1F\" />\n</ConstraintSet>\n<ConstraintSet android:id=\"@+end\">\n    <CustomAttribute\
