  # 索引\n\n目录\n\n1. 简介\n\n本书已针对 Android Studio Electric Eel 版本进行了完全更新，旨在教你如何使用 Java\
  \ 编程语言开发 Android 应用。\n\n\n\n\n本书从基础知识开始，概述了如何搭建 Android 开发和测试环境。书中包含了对 `Android\
  \ Studio` 的概述，涵盖了工具窗口、代码编辑器和 `Layout Editor`（布局编辑器）工具等领域。介绍 Android 架构之后，将深入探讨如何使用\
  \ `Android Studio` 环境设计 Android 应用和用户界面。\n\n书中还包含了 Android 架构组件的章节，包括视图模型（view models）、生命周期管理、`Room`\
  \ 数据库访问、`Database Inspector`数据库检查器、应用导航、活动数据（live data）以及数据绑定（data binding）。\n\n\
  同时也涵盖了如 `intents`（意图）等高级主题，触摸屏幕处理、手势识别以及音频的录制和播放。本书还涵盖了打印、过渡效果以及对折叠设备的支持。\n\n书中还详细介绍了材料设计（material\
  \ design）的概念，包括悬浮操作按钮、`Snackbars`、标签界面、卡片视图（card views）、导航抽屉和收叠式工具栏。\n\n书中还详细介绍了\
  \ `Android Studio` 和 Android 的其他关键特性，包括 `Layout Editor`、`ConstraintLayout` 和 `ConstraintSet`\
  \ 类、`MotionLayout Editor`、视图绑定（view binding）、约束链（constraint chains）、栅栏（barriers）以及直接回复通知。\n\
  \n章节还涵盖了 `Android Studio` 的高级功能，如 `App Links`、动态交付（Dynamic Delivery）、`Gradle` 构建配置、应用内以及将应用提交到\
  \ Google Play 开发者中心。\n\n假设你已经有一定的 `Java` 编程经验，准备好下载 `Android Studio` 和 Android `SDK`，可以访问\
  \ Windows、Mac 或 Linux 系统，并且对要开发的一些应用有了想法，你就可以开始了。\n\n### 1.1 下载代码示例\n\n书中示例的源代码和\
  \ `Android Studio` 项目文件可以在以下地址下载：\n\n[`www.ebookfrenzy.com/retail/eeljava/index.php`](https://www.ebookfrenzy.com/retail/eeljava/index.php)\n\
  \n从代码示例将项目加载到 `Android Studio` 的步骤如下：\n\n1. 在 `Welcome to Android Studio` 对话框中，点击\
  \ `Open`（打开）按钮选项。\n2. 在项目选择对话框中，导航并选择包含要导入项目的文件夹，然后点击 `OK`。\n\n### 1.2 反馈\n\n我们希望你对本书的购买满意。如果你在书中发现任何错误，或有任何意见、问题或建议，请通过\
  \ feedback@ebookfrenzy.com 与我们联系。\n\n### 1.3 勘误\n\n虽然我们努力确保书籍内容的准确性，但涵盖如此规模和复杂领域的书籍，难免会包含一些错误和疏忽。书中任何已知问题将在以下\
  \ URL 列出并提供解决方案：\n\n[`www.ebookfrenzy.com/errata/eeljava.html`](https://www.ebookfrenzy.com/errata/eeljava.html)\n\
  \n如果你发现勘误列表中列出的错误，请通过电子邮件向我们的技术支持团队 feedback@ebookfrenzy.com 通知我们。他们将为你提供帮助，并努力解决你可能遇到的任何问题。\n\
  \n# 2. 设置 Android Studio 开发环境\n\n在开始开发 Android 应用之前，第一步是配置计算机系统作为开发平台。这涉及几个步骤，包括安装\
  \ `Android Studio` 集成开发环境 (`IDE`)，该环境还包含 Android 软件包 (`SDK`) 和 `OpenJDK` Java 开发环境。\n\
  \n本章将涵盖在 Windows、macOS 和基于 Linux 的系统中安装 Android 应用开发所需组件的步骤。\n\n### 2.1 系统要求\n\n\
  Android 应用开发可以在以下类型的系统上进行：\n\n* Windows 8/10/11 64 位\n* 运行 Intel 或 Apple 芯片的 macOS\
  \ 10.14 或更高版本\n* 使用 Intel i5 或更高处理器的 Chrome OS 设备\n* 版本为 2.31 或更高的 GNU C Library\
  \ (`glibc`) 的 Linux 系统\n* 至少 8GB \n* 约 8GB 可用磁盘空间\n* 最低分辨率 1280 x 800\n\n### 2.\
  \ 下载 Android Studio 包\n\n开发 Android 应用的大部分工作将使用 `Android Studio` 环境完成。书中的内容和示例是基于\
  \ `Android Studio Electric Eel 2022.1.1` 创建，使用了 Android API 33 `SDK` (`Tiramisu`)，这些在编写时是最新版本。\n\
  \n然而，`Android Studio` 频繁更新，因此自本书出版以来可能已经发布了更新版本。\n\n可以从主下载页面下载最新的 `Android Studio`，该页面\
  \ URL 为：\n\n[`developer.android.com/studio/index.html`](https://developer.android.com/studio/index.html)\n\
  \n如果此页面提供了下载新版本 `Android Studio` 的说明，请注意本书与软件之间可能存在某些细微差异。如果这些差异成为问题，在网络上搜索“Android\
  \ Studio Electric Eel”应该会提供下载旧版本的选项。或者，访问以下网页在存档中找到 `Android Studio Electric Eel\
  \ 2022.1.1`：\n\n[`developer.android.com/studio/archive`](https://developer.android.com/studio/archive)\n\
  \n### 2.3 安装 Android Studio\n\n下载完成后，安装 `Android Studio` 的具体步骤取决于执行安装的操作系统。\n\n\
  #### 2.3.1 在 Windows 上安装\n\n在 Windows 资源管理器中找到下载的 `Android Studio` 安装执行文件（命名为 `android-studio-<version>-windows.exe`），双击它开始安装过程，如果出现用户账户控制对话框，点击“是”。\n\
  \n一旦 `Android Studio` 安装向导出现，按照各个屏幕配置安装，满足你对 Android Studio 文件系统位置的要求以及是否为其他用户提供。当提示选择安装的组件时，确保选中了\
  \ `Android Studio` 和 `Android Virtual Device`。\n\n虽然 `Android Studio` 的安装位置没有严格规定，本书的其余部分将假设安装在\
  \ `C:\\Program Files\\Android\\Android Studio`，且 `SDK` 包安装在用户的 `AppData\\Local\\\
  Android\\sdk` 子文件夹中。配置好选项后，点击 `Install`（安装）按钮开始安装过程。\n\n在带有开始菜单的 Windows 版本中，可以从安装期间添加的项目启动新安装的\
  \ Android Studio。可以通过进入 `Android Studio\\bin` 目录、右键点击 `studio64` 执行文件并选择“固定到任务栏”菜单选项来快速访问。\n\
  \n#### 2.3.2 在 macOS 上安装\n\nmacOS 版的 `Android Studio` 以磁盘映像 (`.dmg`) 文件的形式下载。下载\
  \ `android-studio-<version>-mac.dmg` 文件后，在 Finder 窗口中找到它并双击打开，如图 2-1 所示：\n\n![](img/as_dmg_drag_to_applications.jpg)\n\
  \n图 2-1\n\n要安装包，只需将 `Android Studio` 图标拖动到 `Applications`（应用程序）文件夹。随后 `Android Studio`\
  \ 将安装到系统的 `Applications` 文件夹中，该过程通常几秒钟即可。\n\n要启动 `Android Studio`，请在 Finder 窗口的\
  \ `Applications` 文件夹中找到执行文件并双击。\n\n\n\n\n\n为了方便以后访问该工具，请从 Finder 窗口将 Android Studio\
  \ 图标拖动到 dock（程序坞）上。\n\n#### 2.3.3 在 Linux 上安装\n\n下载好 Linux 版 Android Studio 安装包后，打开终端窗口，切换到准备安装\
  \ Android Studio 的目录，并执行以下命令：\n\n```bash\nunzip /<path to package>/android-studio-ide-<version>-linux.zip\n\
  ```\n\n请注意，Android Studio 安装包将安装到名为 `android-studio` 的子目录中。因此，假设上述命令是在 `/home/demo`\
  \ 中执行的，软件软件包将解压到 `/home/demo/android-studio`。\n\n要启动 Android Studio，请打开终端窗口，切换到\
  \ `android-studio/bin` 子目录，并执行以下命令：\n\n```bash\n./studio.sh\n```\n\n在 64 位 Linux\
  \ 系统上运行时，可能需要在在 Android Studio 运行之前先安装一些 32 位的支持库。在 Ubuntu 上，可以使用以下命令安装这些库：\n\n\
  ```bash\nsudo apt-get install libc6:i386 libncurses5:i386 libstdc++6:i386 lib32z1\
  \ libbz2-1.0:i386\n```\n\n基于 Red Hat 和 Fedora 的 64 位系统，请使用以下命令：\n\n```bash\nsudo\
  \ yum install zlib.i686 ncurses-libs.i686 bzip2-libs.i686\n```\n\n### 2.4 Android\
  \ Studio 设置向导\n\n如果您之前安装过旧版本的 Android Studio，在首次启动此新版本时，可能会弹出一个对话框，提供从之前的 Android\
  \ Studio 版本导入设置的选项。如果您有之前的设置并希望将其导入到最新安装中，请选择相应的选项和位置。或者，指示您不需要导入任何之前的设置并点击 OK 按钮继续。\n\
  \n如果您是第一次安装 Android Studio，在设置过程开始后出现的初始对话框可能如下方的 图 2-2 所示：\n\n![](img/as_setup_wizard.jpg)\n\
  \n图 2-2\n\n如果出现此对话框，点击 Next（下一步）按钮显示安装类型屏幕（图 2-3）。在此屏幕上，在点击 Next 之前选择 Standard（标准）安装选项。\n\
  \n![](img/as_setup_wizard_install_type.jpg)\n\n图 2-3\n\n在 Select UI Theme（选择 UI\
  \ 主题）屏幕上，根据您的喜好选择 Darcula 或 Light 主题。做出选择后，点击 Next，并在 Verify Settings（验证设置）屏幕上检查选项，然后进入\
  \ License Agreement（许可协议）屏幕。选择每个许可类别并启用 Accept（接受）复选框。最后，点击 Finish（完成）按钮开始安装。\n\n\
  完成这些初始设置步骤后，点击 Finish 按钮显示使用您所选 UI 主题的欢迎 Android Studio 屏幕：\n\n![](img/as_eel_welcome_screen.jpg)\n\
  \n图 2-4\n\n### 2.5 安装额外的 Android SDK 软件包\n\n到目前为止的操作已安装 Android Studio IDE 和当前的默认\
  \ Android SDK 软件包集。在继续之前，值得花些时间验证安装了哪些软件包，并安装任何缺失或更新的软件包。\n\n您可以通过点击欢迎对话框中的 More\
  \ Actions（更多操作）链接并在下拉菜单中选择 SDK Manager（SDK 管理器）选项来执行此任务。一旦调用，Preferences（设置）对话框中的\
  \ Android SDK 屏幕将如 图 2-5 所示：\n\n![](img/as_sdk_manager.jpg)\n\n图 2-5\n\n在首次安装 Android\
  \ Studio 之后，很可能只安装了最新版本的 Android SDK。要安装旧版本的 Android SDK，只需勾选对应版本的复选框并点击 Apply（应用）按钮。本书的其余部分假设已安装了\
  \ Android Tiramisu (API Level 33) SDK。\n\n书中的大多数示例将支持远溯至 Android 8.0 (Oreo) 的更旧版本\
  \ Android。这是为了确保应用可以在广泛的 Android 设备上运行。在 SDK 版本列表中，启用 Android 8.0 (Oreo) 旁的复选框并点击\
  \ Apply 按钮。在弹出的确认对话框中，点击 OK 按钮安装 SDK。随后的对话框将在执行安装前寻求接受许可和条款。安装完成后，点击 Finish。\n\n\
  可能还会列出最新 SDK 有可用更新。要访问有关准备好更新的软件包的详细信息，请启用屏幕右下角的 Show Package Details（显示包详细）选项。这将显示类似于\
  \ 图 2-6 所示的信息：\n\n![](img/Image2471.jpg)\n\n图 2-6\n\n上面的图突出了可用更新。要安装更新，请启用项目名称左侧的复选框并点击\
  \ Apply 按钮。\n\n除了 Android SDK 软件包外，还安装了几个用于构建 Android 应用程序的工具。要查看当前安装的软件包并检查更新，请留在\
  \ SDK 设置屏幕，并如 图 2-7 所示选择 SDK Tools 选项卡：\n\n![](img/as_sdk_tools.jpg)\n\n图 2-7\n\n\
  在 Android SDK Tools 屏幕中，确保以下软件包在 Status（状态）列中显示为 Installed（已安装）：\n\n* Android SDK\
  \ Build-tools\n* Android Emulator\n* Android SDK Platform-tools\n* Google Play Services\n\
  * x86 Emulator Accelerator (HAXM)\n* Google USB Driver（仅限 Windows）\n* Layout Inspector\
  \ image for API 31\n\n注意 x86 Emulator Accelerator (HAXM) 无法在基于 Apple 芯片的 Mac 上安装。\n\
  \n如果上述任何软件包显示为 Not Installed（未安装）或需要更新，只需选择软件包并点击 Apply 按钮启动安装。如果出现 HAXM 对话框，选择推荐的内存分配：\n\
  \n![](img/as_haxm_memory.jpg)\n\n图 2-8\n\n安装完成后，检查软件包列表并确保所选软件包现在显示为 Installed。如果有未安装，再次点击\
  \ Apply。\n\n### 2.6 安装 Android SDK 命令行工具\n\nAndroid Studio 包含一组工具允许从操作系统命令行执行某些任务。要在您的系统中安装这些工具，请打开\
  \ SDK Manager，选择 SDK Tools 选项卡，并启用窗口左下角的 Show Package Details（显示包详细）选项。接下来，向下滚动软件包列表，当\
  \ Android SDK Command-line Tools (latest) 软件包出现时，如 图 2-9 所示启用它：\n\n![](img/as_install_cmdline_tools.jpg)\n\
  \n图 2-9\n\n选择命令行工具软件包后，点击 Apply 然后点击 OK 完成安装。安装完成后点击 Finish。为了让您开发的操作系统能够找到这些工具，有必要将它们添加到系统的\
  \ PATH 环境变量中。\n\n无论您的操作系统是什么，您都需要配置 PATH 环境变量以包含以下路径（其中 `<path_to_android_sdk_installation>`\
  \ 代表您安装 Android SDK 的文件系统位置）：\n\n`<path_to_android_sdk_installation>/sdk/cmdline-tools/latest/bin`\n\
  \n`<path_to_android_sdk_installation>/sdk/platform-tools`\n\n可以通过启动 SDK Manager\
  \ 并参考设置面板顶部的 Android SDK Location: 字段来识别系统上 SDK 的位置，如 图 2-10 中高亮所示：\n\n![](img/as_sdk_location.jpg)\n\
  \n图 2-10\n\n\n\n\n\n一旦确定了 SDK 的位置，将其添加到 `PATH` 变量的步骤取决于具体的操作系统：\n\n#### 2.6.1 Windows\
  \ 8.1\n\n1. 在开始屏幕上，将鼠标移动到屏幕右下角，从弹出菜单中选择`搜索`。在搜索框中输入`控制面板`。当`控制面板`图标出现在结果区域时，点击该它以在桌面上启动该工具。\n\
  2. 在`控制面板`中，使用`类别`菜单将显示方式更改为`大图标`。从图标列表中选择标记为`系统`的项。\n3. 在`环境变量`对话框中，在系统变量列表中找到\
  \ `Path` 变量，选中它并点击`编辑…` 按钮。在编辑对话框中使用`新建` 按钮向路径中添加三个新条目。例如，假设 Android SDK 安装在 `C:\\\
  Users\\demo\\AppData\\Local\\Android\\Sdk`，则需要添加以下条目：\n\n```\nC:\\Users\\demo\\\
  AppData\\Local\\Android\\Sdk\\cmdline-tools\\latest\\bin\nC:\\Users\\demo\\AppData\\\
  Local\\Android\\Sdk\\platform-tools\n```\n\n4. 点击每个对话框中的`确定`并关闭系统属性控制面板。\n\n通过按下键盘上的\
  \ `Windows + R` 并在运行对话框中输入 `cmd` 打开命令提示符窗口。在命令提示符窗口中输入：\n\n```cmd\necho %Path%\n\
  ```\n\n返回的路径变量值应包含 Android SDK 平台工具文件夹的路径。通过尝试如下所示运行 `adb` 工具来验证 `platform-tools`\
  \ 值是否正确：\n\n```\nadb\n```\n\n执行该工具时，它应该输出一个命令行选项的列表。\n\n同样，通过尝试运行 `AVD Manager`\
  \ 命令行工具来检查工具路径设置（如果 `avdmanager` 工具报告 Java 问题请不要担心——这稍后会解决）：\n\n```\navdmanager\n\
  ```\n\n如果其中一个或两个命令出现了类似下面的提示信息，那么很可能是向 `Path` 环境变量中添加了错误的路径：\n\n`'adb'不是内部或外部命令，可运行的程序或批处理文件。`\n\
  \n#### 2.6.2 Windows 10\n\n右键点击开始菜单，从弹出菜单中选择`设置`，并在“查找设置”文本框中输入“编辑系统环境变量”。在系统属性对话框中，点击`环境变量...`\
  \ 按钮。按照 Windows 8.1 列出的步骤从第 3 步开始操作。\n\n#### 2.6.3 Windows 11\n\n右键点击任务栏上的开始图标，从弹出菜单中选择`设置`。当设置对话框出现时，向下滚动类别列表并选择“关于”选项。在“关于”屏幕中，从“相关链接”部分选择`高级系统设置`。当系统属性窗口出现时，点击`环境变量...`\
  \ 按钮。按照 Windows 8.1 列出的步骤从第 3 步开始操作。\n\n#### 2.6.4 Linux\n\n在 Linux 上，此配置通常可以通过向用户家目录下的\
  \ `.bashrc` 文件中添加命令来实现（具体取决于取决于使用的特定 Linux 发行版）。假设 Android SDK 压缩包安装在 `/home/demo/Android/sdk`，则\
  \ `.bashrc` 文件中的 `export` 行内容如下：\n\n```bash\nexport PATH=/home/demo/Android/sdk/platform-tools:/home/demo/Android/sdk/cmdline-tools/latest/bin:/home/demo/android-studio/bin:$PATH\n\
  ```\n\n另注意，上述命令将 `android-studio/bin` 目录添加到 `PATH` 变量中。这将允许在终端窗口的任何当前目录下都执行 `studio.sh`\
  \ 脚本。\n\n#### 2.6.5 macOS\n\n可以使用多种技术来修改 macOS 上的 `$PATH` 环境变量。最干净的方法是在 `/etc/paths.d`\
  \ 目录下创建一个新文件，其中包含要添加到 `$PATH` 的路径。假设 Android SDK 安装位置为 `/Users/demo/Library/Android/sdk`，可以通过在\
  \ `/etc/paths.d` 目录下创建一个名为 `android-sdk` 的新文件，并包含以下行来配置路径：\n\n```\n/Users/demo/Library/Android/sdk/cmdline-tools/latest/bin\n\
  /Users/demo/Library/Android/sdk/platform-tools\n```\n\n注意，由于这是一个系统目录，创建文件时必须使用 `sudo`\
  \ 命令。例如：\n\n```\nsudo vi /etc/paths.d/android-sdk\n```\n\n### 2.7 Android Studio\
  \ 内存管理\n\nAndroid Studio 是一个大型复杂的软件应用程序，由许多后台进程组成。尽管 Android Studio 过去曾因性能欠佳而受到批评，但谷歌在最近的发布中进行了重大的性能改进，并在每个新版本中持续改进。这些改进包括允许用户配置\
  \ Android Studio IDE 以及构建和运行应用所需的后台进程所使用的内存。这使得软件能够利用内存内存的系统。\n\n如果你在具有足够空闲内存来增加这些值的系统上运行\
  \ Android Studio（此功能仅适用于具有 5GB 或更多内存的 64 位系统），并且发现 Android Studio 性能似乎有所下降，那么尝试这些内存设置可能是值得的。Android\
  \ Studio 还可能通过类似下面所示的对话框通知你可以提高性能：\n\n![](img/as_3.5_increase_memory)\n\n\n\n\n\
  本书的前几个章节涵盖了配置适用于使用 Android Studio `IDE` 开发 Android 应用程序的环境所需的步骤。在进入稍为高级的话题之前，现在是验证所有所需的开发包已安装并正常运行的好时机。实现这一目标的最好方法是创建一个\
  \ Android 应用程序并进行编译和运行。本章将介绍如何使用 `Android Studio` 创建 Android 应用程序项目。项目创建完成后，稍后的某个章节将探索如何使用\
  \ Android 模拟器环境对应用程序进行测试运行。\n\n### 3.1 关于项目\n\n在本章中创建的项目是一个初级的货币汇率转换器（事实上，它非常简单，只支持从美元转换为欧元，并使用估算的汇率进行转换）。该项目还动用了\
  \ `Android Studio` 最基础的项目模板之一。这种简单性允许我们介绍 Android 应用开发的一些关键方面，而不会因为一次性引入过多的概念（例如推荐的\
  \ App 架构和 Android 架构组件）让初学者无所适从。在遵循本章教程时，请放心，在这个初始示例项目中使用的所有技术和代码将在后续章节中进行更详细的介绍。\n\
  \n### 3.2 创建新的 Android 项目\n\n应用程序开发过程的第一步是在 `Android Studio` 环境中创建一个新项目。因此，首先启动\
  \ `Android Studio`，直到出现如图 3-1 所示的“Welcome to Android Studio”欢迎界面：\n\n![](img/as_eel_welcome_screen1.jpg)\n\
  \n图 3-1\n\n一旦出现此窗口，`Android Studio` 就准备好创建新项目。要创建新项目，只需点击 `New Project`（新项目）选项即可显示\
  \ `New Project` 向向的第一个屏幕。\n\n### 3.3 创建 Activity\n\n第一步是定义为应用程序创建的初始 Activity 类型。可以选择为\
  \ `Phone`（手机）、`Tablet`（平板电脑）、`Wear OS`、`TV`、`Android Audio` 或 `Android Things` 创建项目。开发\
  \ Android 应用程序时有多种不同的 Activity 类型，其中许多将在后面的章节中详细介绍。然而，为了本示例，只需从 `Templates`（模板）面板中选择\
  \ `Phone and Tablet` 选项，然后选择创建 `Empty Activity`（空 Activity）选项。`Empty Activity` 选项会创建一个由单个\
  \ `TextView` 对象组成的模板用户界面。\n\n![](img/as_template_dialog.jpg)\n\n图 3-2\n\n选中 `Empty\
  \ Activity` 选项后，点击 `Next`（下一步）继续项目配置。\n\n### 3.4 定义项目和 SDK 设置\n\n在项目配置窗口 `()` 中，将\
  \ `Name`（名称）字段设置为 `AndroidSample`。应用程序名称是在 `Android Studio` 中引用和标识应用程序的名称，也是如果完成的应用程序要在\
  \ Google Play 商店销售时将使用的名称。\n\n`Package name`（包名）用于在 Android 应用程序生态系统中唯一标识应用程序。虽然可以设置为任何唯一标识您的应用的的字符串，但传统上，它是基于您的域名的反转\
  \ URL，后加上应用程序名称。例如，如果您的域名是 `www.mycompany.com`，且应用程序命名为 `AndroidSample`，那么包名可以指定如下：\n\
  \n`com.mycompany.androidsample`\n\n如果没有域名，可以在 `Company Domain`（公司域名）字段中输入任何其他字符串，或者出于测试目的可以使用\
  \ `example.com`，但在发布应用程序之前需要更改它：\n\n`com.example.androidsample`\n\n`Save location`（保存位置）设置将默认到位于主目录中名为\
  \ `AndroidStudioProjects` 的文件夹，可以通过点击包含当前路径设置文本字段右侧的文件夹图标进行更改。\n\n将 `minimum SDK`（最小\
  \ SDK）设置为 `API 26: Android 8.0 (Oreo)`。这是书中创建大多数项目使用的最小 SDK，除非某个必要功能仅在更高版本中可用。这里的目标是使用最新的\
  \ Android SDK 构建应用，同时保留与运行旧版本 Android 的设备（在此情况下远至 Android 8.0）的兼容性。`Minimum SDK`\
  \ 设置下方的文本将概述目前运行该应用的 Android 设备百分比。点击 `Help me choose`（帮助我选择）按钮（在图 3-3 中突出）查看仍在使用的各种\
  \ Android 版本的分类：\n\n![](img/as_new_project_settings.jpg)\n\n图 3-3\n\n最后，将 `Language`（语言）菜单更改为\
  \ `Java` 并点击 `Finish`（完成）启动项目创建。\n\n### 3.5 修改示例应用程序\n\n此时，`Android Studio` 已创建了一个最小的示例应用程序项目并打开了主窗口。\n\
  \n![](img/as_4.1_main_window.jpg)\n\n图 3-4\n\n新创建的项目以及关联文件的引用列位于主项目窗口左侧的 `Project`（项目）工具窗口中。`Project`\
  \ 工具窗口有多种显示信息的模式。默认情况下，此面板应处于 `Android` 模式。此设置由面板顶部菜单控制，如图 3-5 所示。如果面板当前不是 `Android`\
  \ 模式，请使用菜单切换模式：\n\n![](img/as_project_tool_window.jpg)\n\n图 3-5\n\n### 3.6 修改用户界面\n\
  \n我们 Activity 的用户界面设计存储在名为 `activity_main.xml` 的文件中，该文件位于项目文件层级结构的 `app -> res ->\
  \ layout` 下。在 `Project` 工具窗口中找到后，双击 `()` 文件将其加载到用户界面 `Layout Editor` 工具中，该工具将出现在\
  \ `Android Studio` 主窗口的中间面板：\n\n![](img/as_4.1_layout_editor.jpg)\n\n图 3-6\n\n`Layout\
  \ Editor` 窗口顶部工具栏上有一个菜单（在上述图中设置为 `Pixel`），它反映在 `Layout Editor` 面板中设备的视觉表示上。通过点击此菜单可以选择广泛的其他设备选项。\n\
  \n要在设备表示的横屏和竖屏之间更改方向，只需使用设备选择菜单左侧的下拉菜单，显示 `![](img/as_4.1_orientation.jpg)` 图标。使用\
  \ `night mode`（夜间模式）按钮 `![](img/as_night_mode.jpg)` 开启或关闭夜间模式。\n\n正如我们在屏幕所示，内容布局已经包含了一个显示“Hello\
  \ World!”消息的标签。面板左侧运行包含了用于构建用户界面的不同用户界面组件，例如按钮、标签和文本字段。然而需要注意，并不是所有的用户界面组件对用户都是可见的。其中一个类别是布局。Android\
  \ 支持多种布局，为视觉用户界面组件在屏幕上的定位和管理提供不同程度的控制。虽然从用户界面的视觉上很难判断，但当前的设计是使用 `ConstraintLayout`\
  \ 创建的。这可以通过查看 `Component Tree`（组件树）面板中的信息来确认，该面板默认位于 `Layout Editor` 面板的左下角，如图 3-7\
  \ 所示：\n\n![](img/as_4.1_component_tree.jpg)\n\n图 3-7\n\n\n\n\n从组件树的层次结构可以看出，用户界面布局由一个\
  \ `ConstraintLayout` 父对象和一个 `TextView` 子对象组成。\n\n在继续之前，还要检查 Layout 编辑器的 `Autoconnect`（自动连接）模式已启用。这意味着当组件被添加到布局中时，布局\
  \ 编辑器会自动添加约束条件，以确保组件在不同的屏幕尺寸和设备方向上都能正确定位（该主题将在后续章节中进行更详细的介绍）。`Autoconnect` 按钮出现在布局\
  \ 编辑器的工具栏上，用磁铁图标表示。当它被禁用时，磁铁图标上会出现一条斜线（见图 3-8）。如有必要，点击此按钮重新启用 `Autoconnect` 模式。\n\
  \n![](img/as_autoconnect_button.jpg)\n\n图 3-8\n\n修改应用程序的下一步是向布局中添加一些额外的组件，第一个是 `Button`，供用户点击以启动货币转换。\n\
  \n`Palette`（调色板）面板由两列组成，左列包含视图组件类别列表。右列列出当前选择类别中包含的组件。例如，在图 3-9 中，在 `Buttons` 类别中选择了\
  \ `Button` 视图：\n\n![](img/as_4.1_palette.jpg)\n\n图 3-9\n\n从 `Buttons` 列表中点击并拖动 `Button`\
  \ 对象，将其释放到用户界面设计的水平中心位置，使其位于现有 `TextView` 小部件的下方：\n\n![](img/as_4.1_androidsample_button_added.jpg)\n\
  \n图 3-10\n\n下一步是更改 `Button` 组件当前显示的文本。位于设计区域右侧的面板是 `Attributes`（属性）面板。该面板显示分配给布局中当前选择组件的属性。在此面板中，在\
  \ `Common Attributes`（常用属性）部分找到 `text` 属性，并将当前值从“Button”更改为“Convert”，如图图 3-11 所示：\n\
  \n![](img/as_4.1_text_attribute.jpg)\n\n图 3-11\n\n第二个文本属性旁边有一个扳手图标，允许设置一个文本属性，该属性仅在布局编辑器工具中显示，而在运行时不会显示。这对于测试视觉组件和布局在不同设置下的行为非常有用，而无需反复运行应用。\n\
  \n为了以防 `Autoconnect` 系统未能设置所有布局连接，点击 `Infer constraints`（推断约束）按钮（见图 3-12）来为布局添加任何缺失的约束：\n\
  \n![](img/as_layout_editor_toolbar.jpg)\n\n图 3-12\n\n此时，重要的是解释位于布局编辑器工具右上角的警告按钮，如图图\
  \ 3-13 所示。显然，这表示布局可能存在潜在问题。要了解任何问题的详细信息，请点击该按钮：\n\n![](img/as_3.6_layout_warnings.jpg)\n\
  \n图 3-13\n\n点击后，将出现 `Problems`（问题）工具窗口（见图 3-14），它描述了问题的性质：\n\n![](img/as_layout_and_qualifiers.jpg)\n\
  \n图 3-14\n\n此工具窗口分为两个面板。左侧面板（上图标记为 A）列出了在布局文件中检测到的问题。在我们的示例中，仅列出了以下问题：\n\n```\n\
  button <Button>: Hardcoded text\n```\n\n当列表中列表中一个项目 (B) 时，右侧面板将更新以提供有关问题的额外细节 (C)。在这种情况下，解释如下：\n\
  \n```\nHardcoded string \"Convert\", should use @string resource\n```\n\n工具窗口还包含一个预览编辑器\
  \ (D)，允许对布局文件进行手动更正。\n\n此 I18N 消息是在告诉我们项目未来的国际化方面存在一个潜在问题（“I18N”源于“internationalization”一词以“I”开头，以“N”结尾，中间有\
  \ 18 个字母）。该警告是在提醒我们，在开发 Android 应用时，应尽可能将文本字符串等属性和值以资源的形式存储。这样做允许通过修改资源文件来更改应用程序的外观，而不是更改应用程序源代码。这在将用户界面翻译成不同的口语时可能特别有价值。如果用户界面中的所有文本都包含在单个资源文件中，例如，该文件可以交给翻译人员，他们将执行翻译工作并返回翻译后的文件包含在应用程序中。这使得可以针对多种语言，而无需进行任何代码更改。在这种情况下，我们将创建一个名为\
  \ `convert_string` 的新资源，并为其分配字符串“Convert”。\n\n点击 `Show Quick Fixes`（显示快速修复）按钮 (E)\
  \ 并从菜单选择 `Extract string resource`（提取字符串资源）选项，如图图 3-15 所示：\n\n![](img/as_quick_fix_menu.jpg)\n\
  \n图 3-15\n\n选择此选项后，将出现 `Extract Resource`（提取资源）面板（见图 3-16）。在此面板中，将资源名称更改为 `convert_string`，并将资源设置为\
  \ Convert，然后点击按钮。\n\n![](img/as_4.1_extract_resource.jpg)\n\n图 3-16\n\n下一个添加的小部件是\
  \ `EditText` 小部件，用户将在其中输入要转换的金额。从 `Palette` 面板选择 `Text` 类别，点击并拖动 `Number (Decimal)`\
  \ 组件到布局中，使其位于现有 `TextView` 小部件上方。选中小部件后，使用 `Attributes` 工具将 `hint` 属性设置为“dollars”。点击图标并将字符串提取为资源。\n\
  \n稍后编写的代码需要访问用户输入 `EditText` 字段的美元金额。它将通过引用布局中分配的小部件的 `id` 来实现。Android Studio 分配给小部件的默认\
  \ `id` 可以在选择小部件时在 `Attributes` 窗口中查看和更改，如图图 3-17 所示：（注：原文无链接跳转，此处逻辑对应）\n\n将 `id`\
  \ 更改为 `dollarText`，并在命名对话框中点击 `Refactor`（重构）按钮。这将确保项目其他地方对旧 `id` 的任何引用都更新为新的 `id`。\n\
  \n![](img/as_4.1_rename_dialog.jpg)\n\n图 3-18\n\n重复步骤将 `TextView` 小部件的 `id` 设置为\
  \ `textView`。\n\n通过点击 `Infer constraints` 按钮添加任何缺失的布局约束。此时，布局应类似于图 3-19 所示：\n\n\
  ![](img/as_4.1_androidsample_ui.jpg)\n\n图 3-19\n\n### 3.7 审查布局和资源文件\n\n在进入下一步之前，我们将查看用户界面设计和资源处理的一些内部方面。在上一节中，我们通过使用\
  \ `Layout Editor` 工具修改 `activity_main.xml` 文件对用户界面进行了一些更改。实际上，`Layout Editor` 所做的只是为编辑文件的底层\
  \ XML 内容提供了一种易于使用的方法。在实践中，没有理由直接修改 XML 来进行用户界面更改，在某些情况下，这实际上比使用 `Layout Editor`\
  \ 工具更快。在 `Layout Editor` 面板的右上角有三个按钮，如下图 3-20 所示：\n\n![](img/as_4.0_layout_editor_buttons.jpg)\n\
  \n图 3-20\n\n\n\n\n\n默认情况下，编辑器将处于设计模式（Design mode），此时仅显示布局的视觉呈现。最左侧的按钮将切换到代码模式（Code\
  \ mode），显示布局的 XML；中间的按钮将进入拆模式（Split mode），同时显示布局和 XML，如图图 3-21 所示：\n\n![](img/as_4.1_split_mode.jpg)\n\
  \n图 3-21\n\n从 XML 文件的结构中可以看出，用户界面由 `ConstraintLayout` 组件组成，它又是 `TextView`、`Button`\
  \ 和 `EditText` 对象的父级。我们还可以看到，例如，`Button` 的 text 属性被设置为我们的 `convert_string` 资源。尽管复杂性和内容各异，但所有用户界面布局都是以这种层次、基于\
  \ XML 的方式组织的。\n\n当 XML 布局发生更改时，这些更改将反映在画布上。也可以在布局画布面板中对布局进行视觉化修改，更改将出现在 XML 列表中。要查看此操作，请切换到拆模式并修改\
  \ XML 布局，将 `ConstraintLayout` 的背景颜色更改为红色调，如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  \n    android:background=\"#ff2438\" >\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意，布局的颜色会实时更改以匹配 XML 文件中的新设置。还要注意，在 XML 编辑器左侧边缘（也称为行槽）中，包含颜色设置的行旁边会出现一个小红色小方块。这是属性上已设置红色的视觉提示。点击红色小方块将显示颜色选择器，允许选择不同的颜色：\n\
  \n![](img/as_4.1_gutter_color_chooser.jpg)\n\n图 3-22\n\n在继续之前，从布局文件中删除 background\
  \ 属性，使背景恢复默认设置。\n\n最后，使用 Project 面板找到 `app -> res -> values -> strings.xml` 文件并双击它将其加载到编辑器中。目前\
  \ XML 的内容如下：\n\n```xml\n<resources>\n    <string name=\"app_name\">AndroidSample</string>\n\
  \    <string name=\"convert_string\">Convert</string>\n    <string name=\"dollars_hint\"\
  >dollars</string>\n</resources>\n```\n\n作为资源实际应用的演示，将当前分配给 `convert_string` 资源的字符串值更改为\
  \ \"Convert to Euros\"，然后通过选择编辑器面板中布局文件的标签页返回布局编辑器工具。请注意，布局已经获取了该字符串的新资源值。\n\n还有一种快速方法可以访问\
  \ XML 文件中引用的资源值。在拆模式或代码模式下使用布局编辑器工具时，点击 `@string/convert_string` 属性设置使其高亮显示，然后在键盘上按\
  \ `Ctrl-B`（macOS 上为 `Cmd-B`）。Android Studio 随后会打开 `strings.xml` 文件，并将你带到该文件中声明此资源的位置所在行。利用此机会将字符串资源恢复为原始的\
  \ \"Convert\" ，并为稍后在应用代码中使用的字符串资源添加以下附加条目：\n\n```xml\n<resources>\n    <string name=\"\
  convert_string\">Convert</string>\n    <string name=\"dollars_hint\">dollars</string>\n\
  \    <string name=\"no_value_string\">No Value</string>\n</resources>\n```\n\n也可以通过点击编辑器窗口左上角的\
  \ `Open editor` 链接，使用 Android Studio 的翻译编辑器（Translations Editor）编辑资源字符串。将在 Android\
  \ Studio 窗口的主面板中显示翻译编辑器：\n\n![](img/as_translations_editor.jpg)\n\n图 3-23\n\n此编辑器允许编辑分配给资源键的字符串，并管理多种语言的翻译。\n\
  \n### 3.8 添加交互\n\n此示例项目的最后一步是让应用程序具有交互性，这样当用户在 `EditText` 字段中输入美元金额并点击转换按钮时，转换后的欧元数值将显示在\
  \ `TextView` 上。这涉及在 `Button` 小部件上实现一些事件处理。具体来说，需要配置 `Button`，以便在触发 `onClick` 事件时调用应用代码中的一个方法。事件处理可以通过多种不同的方式实现，并在后续章节\"\
  Android 事件处理的概述与示例”中进行详细介绍。将布局编辑器返回设计模式，在布局编辑器中选择 `Button` 小部件，参考 Attributes（属性）窗口并指定一个名为\
  \ `convertCurrency` 的方法，如下所示：\n\n![](img/as_3.6_set_onclick.jpg)\n\n图 3-24\n\n注意\
  \ `onClick` 属性的文本字段现在用红色边框高亮，警告我们该按钮已配置为调用一个不存在的方法。为了解决这个问题，双击 `MainActivity.java`\
  \ 文件（app -> java -> <package name> -> MainActivity）将其加载到编辑器，并在类中添加 `convertCurrency`\
  \ 代码，使其内容如下：\n\n```java\npackage com.ebookzy.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.view.View;\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport java.util.Locale;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void convertCurrency(View view) {\n        EditText dollarText\
  \ = findViewById(R.id.dollarText);\n        TextView textView = findViewById(R.id.textView);\n\
  \        if (!dollarText.getText().toString().equals(\"\")) {\n            float\
  \ dollarValue = Float.parseFloat(dollarText.getText().toString());\n           \
  \ float euroValue = dollarValue * 0.85F;\n            textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n        } else {\n            textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n### 3.9 总结\n\n设置 Android 开发环境并不复杂，但涉及许多步骤。完成这些步骤后，值得运行一个示例以确保环境安装和配置正确。在本章中，我们创建了一个示例应用程序，并使用\
  \ Android Studio 布局编辑器工具修改了用户界面布局。在此过程中，我们探索了尽可能使用资源的重要性，特别是字符串值的情况下，并简要地讨论了布局的主题。\n\
  \n\n\n\n最后，在 `Button` 上添加了一个 `onClick` 事件，连接到一个已实现的方法，该方法用于从 `EditText` 组件中提取用户输入，将美元转换为欧元，然后将结果显示在\
  \ `TextView` 上。由于应用程序已准备好进行测试，下一章将详细介绍为测试之目的设置模拟器的必要步骤。\n\n# 4. 在 Android Studio\
  \ 中创建 Android 虚拟设备 (AVD)\n\n尽管 Android Studio 的预览面板（Preview panel）允许我们看到正在设计的布局并使用交互模式测试基本功能，但为了完全测试其运行情况，仍然需要编译并运行整个应用程序。Android\
  \ 应用可以通过在物理设备上安装运行，或在 Android 虚拟设备 (AVD) 模拟器环境中安装运行来进行测试。在使用 AVD 之前，必须先创建并配置它以匹配特定设备模型的规格。在本章中，我们将以\
  \ Pixel 4 手机为示例，完成此类虚拟创建。\n\n### 4.1 关于 Android 虚拟设备\n\nAVD 本质上是模拟器，它们允许在无需将应用程序安装到物理\
  \ Android 设备上的情况下测试 Android 应用程序。AVD 可以配置为模拟各种硬件特性，包括屏幕大小、内存容量，以及是否存在摄像头、GPS 导航支持或加速度计等功能。作为\
  \ Android Studio 标准安装的一部分，系统安装了几个模拟器模板，允许为一系列不同的设备配置 AVD。通过指定处理器类型、内存容量以及屏幕尺寸和像素密度等属性，可以创建自定义配置以匹配任何物理\
  \ Android 设备。\n\nAVD 会话可以以独立窗口的形式出现，也可以嵌入在 Android Studio 窗口中。\n\n新的 AVD 使用 Android\
  \ 虚拟设备管理器（Android Virtual Device Manager）创建和管理，该管理器可以使用命令行模式或更易于用户的图形用户界面。要创建新的\
  \ AVD，第一步是启动 AVD 管理器。可以在 Android Studio 环境内通过从主窗口中选择 `Tools -> Device Manager` 菜单选项来实现。\n\
  \n一旦启动，该管理器将以工具窗口的形式出现，如图 4-1 所示：\n\n![](img/as_avd_manager.jpg)\n\n图 4-1\n\n如果您是在计算机上首次安装\
  \ Android Studio（而不是升级现有的 Android Studio 安装），安装程序可能已经创建了一个可用的初始 AVD 实例，如图 4-2 所示：\n\
  \n![](img/as_default_avd.jpg)\n\n图 4-2\n\n如果您的系统上存在此 AVD，您可以使用它来测试应用。如果没有创建 AVD，或者您想为不同类型的设备创建\
  \ AVD，请按照本章其余部分的步骤操作。\n\n要添加新的 AVD，首先确保在点击 `Create device` 按钮之前选择了 `Virtual` 标签，以打开虚拟设备配置对话框：\n\
  \n![](img/as_avd_manager_select_hardware.jpg)\n\n图 4-3\n\n在对话框中，执行以下步骤创建一个兼容 Pixel\
  \ 4 的模拟器：\n\n1. 从 Category（类别）面板选择 `Phone` 选项，显示可用的 Android 手机 AVD 模板列表。\n2. 选择\
  \ `Pixel 4` 设备选项并点击 `Next`。\n3. 在 System Image（系统映像）屏幕上，选择最新版本的 Android。注意，如果尚未安装系统映像，则\
  \ `Release Name`（发布名称）旁边将提供 `Download` 链接。在选择它之前，点击此链接下载并安装系统映像。如果列表中没有您需要的映像，点击\
  \ `x86 Images`（如果您运行带有 Apple 芯片的 Mac，请点击 `ARM images`）和 `Other images` 标签查看替代列表。\n\
  4. 点击 `Next` 继续，并在 name 字段中输入描述性名称（例如 `Pixel 4 API 33`），或直接接受默认名称。\n5. 点击 `Finish`\
  \ 创建 AVD。\n6. AVD 创建后，现在可以关闭 `Device Manager`。如果以后需要对 AVD 进行修改，只需重新打开 `Device Manager`，从列表中选择\
  \ AVD，并点击 Actions（操作）列中的笔图标来编辑设置。\n\n### 4.2 启动模拟器\n\n要对新创建的 AVD 模拟器进行测试运行，只需从 `Device\
  \ Manager` 中选择模拟器并点击启动按钮（Actions 列中的三角形）。模拟器将嵌入到 Android Studio 主窗口中并开始启动过程。模拟器启动所需的时间取决于\
  \ AVD 及其运行系统的配置：\n\n![](img/as_emulator_tool_window.jpg)\n\n图 4-4\n\n要隐藏和显示模拟器工具窗口，点击\
  \ `Emulator` 工具窗口按钮（如上方 A 标记所示）。点击标签旁边的“x”关闭按钮 (B) 退出模拟器。模拟器工具窗口可以容纳多个模拟器会话，每个会话由一个标签表示。例如，图\
  \ 4-5 显示了一个具有两个模拟器会话的工具窗口：\n\n![](img/as_4.1_emulator_tool_window_two_sessions.jpg)\n\
  \n图 4-5\n\n若要在会话之间切换，只需点击相应的标签。\n\n尽管模拟器可能默认为以竖向方向显示，但此和其他默认选项可以更改。在 `Device Manager`\
  \ 中，选择新的 `Pixel 4` 条目并点击设备行 Actions 中的笔图标。在配置屏幕中，找到 `Startup orientation`（启动方向）部分并更改设置。退出并重启模拟器以使更改生效。关于模拟器的更多细节将在下一章介绍(使用和配置\
  \ Android Studio AVD）。为了节省本节时间，请保持模拟器运行。\n\n### 4.3 在 AVD 中运行应用程序\n\n配置好 AVD 后，在前章节创建的\
  \ `AndroidSample` 应用程序现在可以编译并运行。在 `AndroidSample` 项目加载到 Android Studio 后，确保新创建的\
  \ `Pixel 4` AVD 显示在设备菜单中（如下图 4-6 所示），然后点击由绿色三角形表示的运行按钮 (B)、选择 `Run -> Run ‘app’`\
  \ 菜单选项或使用快捷键 `Ctrl-R`：\n\n![](img/as_run_button.jpg)\n\n图 4-6\n\n设备菜单 (A) 可选择不同的\
  \ AVD 实例或物理设备作为目标，并可以在多个设备上运行应用。该菜单还可以访问 `Device Manager` 以及设备配置和故障排除选项：\n\n![](img/as_run_target_menu.jpg)\n\
  \n图 4-7\n\n一旦应用程序安装并运行，第一个 fragment 用户界面将在模拟器中显示（fragment 是 Android 项目的可重用部分，通常由用户界面布局和代码组成，该主题将在名为\
  \ Android Fragment 简介 的章节中介绍）：\n\n![](img/as_eandroid_sample_running.jpg)\n\n图 4-8\n\
  \n如果活动没有自动启动，请检查模拟器应用列表中是否出现了启动图标。如果是的话，只需点击它来启动应用程序。一旦运行过程开始，`Run` 工具窗口将可用。`Run`\
  \ 工具窗口将在应用程序包安装和启动时显示诊断信息。图 4-9 显示了典型成功启动时的 `Run` 工具窗口输出：\n\n![](img/as_4.1_run_tool_window.jpg)\n\
  \n图 4-9\n\n\n\n\n如果在启动过程中遇到问题，`Run` 工具窗口将提供相关信息，这些信息有望帮助你定位问题所在。\n\n假设应用程序已加载到模拟器并按预期运行，我们已经安全地验证了\
  \ Android 开发环境已正确安装和配置。现在应用正在运行，请尝试进行货币转换以验证应用是否按预期工作。\n\n### 4.4 在多个设备上运行\n\n图\
  \ 4-7 所示的运行（run）菜单包含一个在多个模拟器和设备上并行运行应用的选项。选择该选项后，将显示如图 4-10 所示的对话框，其中列出系统上配置的所有\
  \ AVD 以及任何连接的物理设备。在点击 `Run` 按钮之前，勾选目标模拟器或设备旁边的复选框：\n\n![](img/as_4.1_multiple_devices.jpg)\n\
  \n图 4-10\n\n点击 `Run` 按钮后，Android Studio 将会在选定的模拟器和设备上启动该应用。\n\n### 4.5 停止运行的应用程序\n\
  \n要停止运行的应用程序，只需点击位于主工具栏上的停止按钮，如图 4-11 所示：\n\n![](img/as_stop_button.jpg)\n\n图 4-11\n\
  \n也可以使用 `Run` 工具窗口终止应用。首先，通过在应用运行时变为可窗口栏（window bar）按钮显示 `Run` 工具窗口。一旦 `Run` 工具窗口出现，点击下方如图\
  \ 4-12 中高亮显示的停止按钮：\n\n![](img/as_4.1_stop_button_run_window.jpg)\n\n图 4-12\n\n###\
  \ 4.6 支持深色主题\n\nAndroid 10 引入了备受期待的深色主题，Android Studio 项目默认启用了该功能的支持。要在 AVD 模拟器中测试深色主题，请在模拟器中运行的\
  \ Android 实例内打开 `Settings` 应用。在 `Settings` 应用中，选择 `Display` 类别并启用如图 4-13 所示的 `Dark\
  \ theme` ，使屏幕背景变为黑色：\n\n![](img/as_avd_dark_theme_setting.jpg)\n\n图 4-13\n\n启用深色主题后，运行\
  \ `AndroidSample` 应用，你会注意到它以深色主题显示，包括黑色背景和按钮上的紫色背景色，如图 4-14 所示：\n\n![](img/as_eandroid_sample_running_dark.jpg)\n\
  \n图 4-14\n\n在继续之前，返回 `Settings` 应用并关闭 `Dark theme` 模式。\n\n### 4.7 在独立窗口中运行模拟器\n\n\
  到本章为止，我们仅将模拟器作为嵌入在 Android Studio 主窗口内的工具窗口使用的。要在独立窗口中运行模拟器，请选择 `File -> Settings...`\
  \ 菜单（macOS 上为 `Android Studio -> Preferences...`），在偏好对话框的左侧导航面板中导航到 `Tools -> Emulator`，并禁用\
  \ `Launch in a tool window` 选项：\n\n![](img/as_avd_separate_window_setting.jpg)\n\
  \n图 4-15\n\n禁用该选项后，点击 `Apply` 按钮随后点击 `OK` 以提交更改，然后点击上方图 4-4 中标记为 B 的标签上的关闭按钮退出当前的模拟器会。\n\
  \n再次运行示例应用，此时模拟器将作为一个独立窗口显示如下：\n\n![](img/as_android_emulator_standalone.jpg)\n\n\
  图 4-16\n\n选择独立模式还是工具窗口取决于个人偏好。如果你倾向于让模拟器在工具窗口中运行，请返回设置界面并重新启用 `Launch in a tool\
  \ window` 选项。在提交到独立模式之前，请记住，可以通过点击模拟器工具栏中的设置按钮（由齿轮图标表示）并选择 `View Mode -> Float`\
  \ 菜单选项，将模拟器工具窗口从 Android Studio 主窗口中分离：\n\n![](img/as_avd_float.jpg)\n\n图 4-17\n\
  \n### 4.8 启用设备框架\n\n模拟器可以配置为带有（图 4-18）或不带设备框架（图 4-16）运行。\n\n![](img/as_eandroid_sample_running_device_frame.jpg)\n\
  \n图 4-18\n\n要更改设置，请打开 `Device Manager`，从列表中选择 AVD，并点击 Actions 列中的铅笔图标以编辑设置。在设置界面中，找到并更改\
  \ `Enable Device Frame` 选项：\n\n![](img/as_avd_enable_device_frame.jpg)\n\n图 4-19\n\
  \n### 4.9 AVD 命令行创建\n\n如前所述，除了图形用户界面外，还可以直接从命令行创建新的 AVD。这是通过使用 `avdmanager` 工具结合某些命令行选项实现的。一旦启动，该工具将在创建新\
  \ AVD 之前提示额外信息。\n\n`avdmanager` 工具需要 Java 运行时环境 (JRE) 才能运行。如果在尝试运行 `avdmanager`\
  \ 时出现错误消息显示找不到 `java` 命令，则可以配置你运行的命令提示符或终端窗口以使用 Android Studio 捆的 OpenJDK。按照以下步骤识别\
  \ OpenJDK 的位置：\n\n1. 启动 Android Studio 并打开之前创建的 `ComposeDemo` 项目。\n2. 选择 `File ->\
  \ Settings...` 菜单（macOS 上为 `Android Studio -> Preferences...`）。\n3. 导航到 `Build,\
  \ Execution, Deployment` 部分并选择 `Gradle` 选项。\n4. 点击 `JDK` 设置并记录 Android Studio 目录的路径：\n\
  \n![](img/as_grade_path.jpg)\n\n图 4-20\n\n在 Windows 上，在运行 `avdmanager` 的命令提示符中执行以下命令（将\
  \ `<path to jre>` 替换为从对话框复制的路径）：\n\n```cmd\nset JAVA_HOME=<path to jre>\n```\n\n\
  在 macOS 或 Linux 上，执行以下命令：\n\n```bash\nexport JAVA_HOME=\"<path to jre>\"\n```\n\n\
  如果你预计频繁使用 `avdmanager` 工具，请参考配置 Android 开发环境章节中列出的操作系统步骤在系统范围内配置 `JAVA_HOME`。\n\n\
  假设系统已配置好环境变量包含了 Android SDK 目录，可以通过在终端窗口中发布以下命令获取可用 AVD 列表：\n\n```\navdmanager list\
  \ targets\n```\n\n上述命令的输出将包含系统上可用的 Android SDK 版本列表。例如：\n\nAvailable targets:\n\n\
  ----------\n\nid: 1 or \"android-29\"\n    Name: Android API 29\n    Type: Platform\n\
      API level: 29\n    Revision: 1\n\n----------\n\nid: 2 or \"android-26\"\n    Name:\
  \ Android API 26\n    Type: Platform\n    API level: 26\n    Revision: 1\n\n`avdmanager`\
  \ 工具还允许从命令行创建新的 AVD 实例。例如，要使用用于 Android API 级别 29 设备的目标 ID 并使用 `x86` ABI 创建名为 `myAVD`\
  \ 的新 AVD，可以使用以下命令：\n\n```bash\navdmanager create avd -n myAVD -k \"system-images;android-29;google_apis_playstore;x86\"\
  \n```\n\n`avdmanager` 工具将根据基础 Android 8 设备的规范创建新 AVD，并在需要时提供创建匹配特定设备规范的自定义配置选项。一旦从命令行创建了新的\
  \ AVD，在点击 `Refresh` 按钮之前，它可能不会在 Android Device Manager 工具中显示。\n\n\n\n\n\n除了创建新的\
  \ AVD 之外，还可以从命令行执行其他若干任务。例如，可以使用 `list avd` 命令行参数获取当前可用的 AVD 列表：\n\n```\navdmanager\
  \ list avd\n```\n\n可用的 Android 虚拟设备：\n\n  Name: Pixel_XL_API_28_No_Play\n  Device:\
  \ pixel_xl (Google)\n    Path: /Users/neilsmyth/.android/avd/Pixel_XL_API_28_No_Play.avd\n\
  \  Target: Google APIs (Google Inc.)\n          Based on: Android API 28 Tag/ABI:\
  \ google_apis/x86\n  Skin: pixel_xl_silver\n  Sdcard: 512M\n\n同样，要删除现有的 AVD，只需按照所示使用\
  \ `delete` 选项：\n\n```\navdmanager delete avd –n <avd name>\n```\n\n### 4.10 Android\
  \ 虚拟设备配置文件\n\n默认情况下，与 AVD 关联的文件存储在用户主目录的 `.android/avd` 子目录下，其结构如下（其中 `<avd name>`\
  \ 被替换为分配给 AVD 的名称）：\n\n`<avd name>.avd/config.ini`\n`<avd name>.avd/userdata.img`\n\
  `<avd name>.ini`\n\n`config.ini` 文件包含了在 AVD 创建过程中指定的设备配置设置，如显示尺寸和内存。这些设置可以直接在配置中中进行更改，并在\
  \ AVD 下次被调用时被采纳。\n\n`<avd name>.ini` 文件包含了对目标 Android SDK 的引用以及 AVD 文件的路径。请注意，`config.ini`\
  \ 文件中 `image.sysdir` 值的更改也需要反映在该文件的 `target` 值中。\n\n### 4.11 移动和重命名 Android 虚拟设备\n\
  \n可以使用 `avdmanager` 工具的 `move avd` 参数从命令行更改 AVD 的当前名称或文件位置。例如，要将名为 `Pixel4` 的 AVD\
  \ 重命名为 `Pixel4a`，可以执行以下命令：\n\n```\navdmanager move avd -n Pixel4 -r Pixel4a\n```\n\
  \n要物理移动与 AVD 关联的文件，应使用以下命令语法：\n\n```\navdmanager move avd -n <avd name> -p <path\
  \ to new location>\n```\n\n例如，将 AVD 从其当前的文件系统位置移动到 `/tmp/Pixel4Test`：\n\n```\navdmanager\
  \ move avd -n Pixel4 -p /tmp/Pixel4Test\n```\n\n注意，在执行移动 AVD 的命令之前，目标目录不能已经存在。\n\
  \n### 4.12 总结\n\n典型的应用开发过程遵循编码、编译和在测试环境中运行的循环。Android 应用可以在物理 Android 设备上测试，也可以使用\
  \ Android 虚拟设备 (AVD) 模拟器测试。AVD 使用 Android Studio Device Manager 工具创建和管理，该工具可以作为命令行工具，也可以通过图形用户界面使用。在创建\
  \ AVD 以模拟特定的 Android 设备型号时，虚拟设备应配置与物理设备匹配的硬件规格。\n\nAVD 模拟器会可以以独立窗口的形式显示，也可以嵌入到 Android\
  \ Studio 主用户界面。\n\n# 5. 使用和配置 Android Studio AVD 模拟器\n\n在下一章探索在物理 Android 设备上测试之前，本章将花费一些时间提供\
  \ Android Studio AVD 模拟器的概述，并突出许多可以在独立模式和工具窗口模式下自定义环境的配置功能。\n\n### 5.1 模拟器环境\n\n\
  当在独立模式下启动时，模拟器会在加载过程中显示初始启动屏幕。加载完成后，将出现主模拟器窗口，其中包含所选设备类型的表示（对于图 5-1，这是一个 Pixel 4\
  \ 设备）：\n\n![](img/android_12_avd_running_standalone.jpg)\n\n图 5-1\n\n窗口右侧边缘放置着工具栏，提供了快速访问模拟器控件和配置选项的通道。\n\
  \n### 5.2 模拟器工具栏选项\n\n模拟器工具栏（图 5-2）提供了与模拟器环境外观和行为的一系列选项的访问。\n\n![](img/as_3.5_avd_toolbar.jpg)\n\
  \n图 5-2\n\n工具栏中的每个按钮都关联有一个键盘快捷键，可以通过将鼠标指针悬停在按钮上等待工具提示出现，或者通过扩展控制面板的帮助选项来识别。\n\n\
  尽管工具栏中包含的许多选项是不言易懂的，但为了完整起见，每个选项都将被涵盖：\n\n- **退出 / 最小化** – 工具栏顶部的“x”按钮在选中时会退出模拟器会话，而“－”选项会最小化整个窗口。\n\
  - **电源** – `Power` 按钮模拟物理 Android 设备上的硬件电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。长按此按钮将启动设备的“关机”请求序列。\n\
  - **音量增大/减小** – 两个控制模拟器环境中播放音频音量的按钮。\n- **向左/向右旋转** – 在模拟设备的纵屏和横屏方向之间旋转设备。\n- **截图**\
  \ – 对设备屏幕上当前显示的内容截图。捕获的图像存储在本章稍后介绍的扩展控制面板指定的 location。\n- **缩放模式** – 此按钮在缩放模式之间切换，其细节将在本章中介绍。\n\
  - **返回** – 执行标准的 Android“返回”导航以返回上一个屏幕。\n- **主页** – 显示设备主屏幕。\n- **概览** – 模拟选择标准的“概览”导航，显示设备上当前运行的应用。\n\
  - **折叠设备** – 模拟折叠设备的折叠和展开。此选项仅在模拟器运行折叠设备系统镜像时可用。\n- **扩展控制** – 显示扩展控制面板，允许配置如模拟位置和电话活动、电池强度、蜂窝网络类型和指纹识别等选项。\n\
  \n### 5.3 在缩放模式下工作\n\n位于模拟器工具栏中的缩放按钮用于在缩放模式之间切换。当缩放模式激活时，工具栏按钮被按下，且当鼠标指针悬停在设备屏幕上时将显示为放大镜。点击左鼠标键将导致显示相对于屏幕上的选定点进行放大，重复点击将增加缩放级别。相反，点击右鼠标键将减少缩放级别。关闭缩放按钮将显示恢复到默认大小。\n\
  \n在缩放模式下点击并拖动将定义一个矩形区域，释放鼠标按钮后视图将缩放到该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条移动可视区域。\n\n\
  ### 5.4 调整模拟器窗口大小\n\n可以通过点击并拖动窗口的任何角或边来随时更改模拟器窗口（以及相应的设备表示）的大小。\n\n### 5.5 扩展控制选项\n\
  \n扩展控制工具栏按钮显示图 5-3 所示的面板。默认情况下将显示位置设置。\n\n![](img/as_avd_location.jpg)\n\n图 5-3\n\
  \n#### 5.5.1 位置\n\n\n\n\n位置控制允许以十进制或六十进制制坐标的形式将模拟的位置信息发送到模拟器中。位置信息可以以单个位置的形式存在，也可以以代表设备移动的一系列点的形式存在，后者通过\
  \ GPS 交换 (`GPX`) 或 Keyhole 标记语言 (`KML`) 格式的文件提供。或者，也可以使用集成的 Google Maps 面板视觉化地选择单点或旅行路线。\n\
  \n### 5.5.2 显示 (Displays)\n除了模拟器屏幕内显示的主显示外，`Displays` 选项允许添加在同一个 Android 实例中运行的额外显示器。这对于测试如\
  \ Microsoft Surface Duo 等双屏设备的应用非常有用。这些额外的屏幕可以配置为任何所需的尺寸，并显示在与主屏幕相同的模拟器窗口中。\n\n\
  ### 5.5.3 蜂窝 (Cellular)\n可以在蜂窝设置屏幕中更改模拟的蜂窝连接类型。提供的选项可以模拟不同的网络类型（`CSM`、`EDGE`、`HSDPA`\
  \ 等），以及漫游和拒绝访问等一系列语音和数据场景。\n\n### 5.5.4 电池 (Battery)\n在扩展控制屏幕的此面板上，可以模拟各种电池状态和充电条件，包括电池电量水平、电池健康以及\
  \ AC 充电器当前是否连接。\n\n### 5.5.5 相机 (Camera)\n当相机激活时，模拟器会模拟 3D 场景。这表现为虚拟建筑的内部，在模拟器内录制视频或拍摄照片之前，你可以通过按住\
  \ `Option` 键（Windows 上的 `Alt`）同时使用鼠标指针和键盘按键进行导航。此扩展配置选项允许上传不同的图像以显示在虚拟环境中。\n\n###\
  \ 5.5.6 电话 (Phone)\n手机扩展控制在模拟器中提供了两个非常简单但实用的模拟。第一个选项允许模拟来自来自指定电话号码的入电电话。这在测试应用如何处理此类高级中断时特别有用。\n\
  \n第二个选项允许在模拟器会话中模拟接收文本消息。与现实世界一样，这些消息显示在 `Message` 应用中，并触发模拟器内的标准通知。\n\n### 5.5.7\
  \ 方向键 (Directional Pad)\n方向键（`D-Pad`）是一组额外的控制控件，内置于 Android 设备或外部连接（如游戏控制器），提供方向控制（左、右、上、下）。方向键设置允许在模拟器内模拟\
  \ `D-Pad` 交互。\n\n### 5.5.8 麦克风 (Microphone)\n麦克风设置允许启用麦克风并模拟虚拟耳机和麦克风连接。还提供了一个启动模拟器上\
  \ `Voice Assistant` 的按钮。\n\n### 5.5.9 指纹 (Fingerprint)\n许多 Android 设备现在都配备了内置指纹检测硬件。`AVD`\
  \ 模拟器使得测试指纹认证成为可能，而无需包含指纹传感器的物理设备上测试应用。关于如何在模拟器内配置指纹测试的细节将在本章后部分详细介绍。\n\n### 5.5.10\
  \ 虚拟传感器 (Virtual Sensors)\n虚拟传感器选项允许模拟加速度计和磁力计，通过偏航（yaw）、俯仰（pitch）和横滚（roll）设置来模拟设备的物理运动效果，如旋转、移动和倾斜。\n\
  \n### 5.5.11 快照 (Snapshots)\n快照包含当前运行 `AVD` 会话的状态，可以保存并快速恢复，从而轻松将模拟器回到精确状态。快照将在本章后面介绍。\n\
  \n### 5.5.12 录制与播放 (Record and Playback)\n允许以 `WebM` 或动图 GIF 格式录制并保存模拟器屏幕和音频。\n\n\
  ### 5.5.13 Google Play\n如果模拟器运行了安装了 `Google Play Services` 的 Android 版本，此选项将显示当前的\
  \ `Google Play` 版本，并提供更新模拟器到最新版本的选项。\n\n### 5.5.14 设置 (Settings)\n设置面板提供了一小组配置选项。使用此面板为工具栏和扩展控制面板选择较深的主题，指定保存截图的文件系统位置，配置\
  \ `OpenGL` 支持级别，并配置模拟器窗口显示在桌面上其他窗口之上。\n\n### 5.5.15 帮助 (Help)\n`Help` 屏幕包含三个子面板，包含键盘快捷键列表、访问模拟器在线文档、报告\
  \ Bug 和发送反馈的链接，以及模拟器版本信息。\n\n### 5.6 使用快照 (Working with Snapshots)\n当模拟器首次启动时，它会执行冷启动，就像物理\
  \ Android 设备开机一样。由于操作系统加载并启动所有后台进程，此冷启动过程可能需要一些时间才能完成。为了避免每次启动模拟器都必须经过此过程，系统配置为每次退出时自动保存模拟器当前状态的快照（称为快速启动快照）。下次启动模拟器时，快速启动快照将加载到内存中，并从上次停止的地方继续执行，允许模拟器重启的时间仅为冷启动完成所需时间的一部分。\n\
  \n扩展控制面板的 `Snapshots` 屏幕可以在模拟器执行期间的任何点存储额外的快照。这保存了整个模拟器的精确状态，允许模拟器恢复到拍摄快照时的精确时间点。从屏幕内部，可以使用\
  \ `Take Snapshot` 按钮（在 `Figure 5-4` 中标记为 A）拍摄快照。要恢复现有的快照，从列表中选择 (B) 并点击屏幕底部的 `run`\
  \ 按钮 (C)。还提供了编辑 (D) 快照名称和描述以及删除 (E) 当前所选快照的选项：\n\n![](img/as_emulator_snapshot.jpg)\n\
  \nFigure 5-4\n\n`Settings` 选项 (F) 提供了配置自动保存快速启动快照（默认情况下，模拟器每次退出都会询问是否保存快速启动快照）以及加载最新快照的选项。要强制模拟会话执行冷启动而不是使用之前的快速启动快照，打开\
  \ `AVD Manager`（Tools -> AVD Manager），点击模拟器 Actions 列中的向下箭头，然后选择 `Cold Boot Now`\
  \ 菜单选项。\n\n![](img/as_avd_cold_boot.jpg)\n\nFigure 5-5\n\n### 5.7 配置指纹模拟 (Configuring\
  \ Fingerprint Emulation)\n模拟器允许配置最多 10 个模拟指纹用于测试 Android 应用内的指纹认证。要配置模拟指纹，启动模拟器，打开\
  \ `Settings` 应用并选择 `Security & Location` 选项。\n\n在 `Security` 设置屏幕中，选择 `Use fingerprint`\
  \ 选项。在生成的屏幕上点击 `Next` 按钮进入 `Fingerprint` 设置屏幕。在启用指纹安全之前，必须配置备用的屏幕锁定方法（如 `PIN`）。点击\
  \ `Fingerprint + PIN` 按钮，并在提示时选择在设备启动时不需要 `PIN`。\n\n输入并确认一个合适的 `PIN`，并通过接受默认通知选项完成\
  \ PIN 输入过程。继续后续剩余屏幕，直到设置应用请求在传感器上指纹。此时，显示扩展控制对话框，在左侧面板中选择 `Fingerprint` 类别，并确保主设置面板中选择了\
  \ `Finger 1`：\n\n![](img/Image2468.jpg)\n\nFigure 5-6\n\n\n\n\n点击 `Touch the Sensor`\
  \ 按钮以模拟 `Finger 1` 触摸指纹传感器。模拟器将报告指纹添加成功：\n\n![](img/Image2478.jpg)\n\n图 5-7\n\n\
  要添加额外的指纹，点击 `Add Another` 按钮，并在再次点击 `Touch the Sensor` 按钮之前，从扩展控制面板菜单中选择另一个手指。\n\
  \n### 5.8 工具窗口模式下的模拟器\n\n正如前一节概述（“在 Android Studio 中创建 Android 虚拟设备 (AVD)”），`Android\
  \ Studio` 可以配置为将 `emulator` 启动为嵌入式 `tool-window`（工具窗口），这样就不会出现在独立的窗口中。当在此模式下运行时，工具栏中将提供与独立模式下相同的控制控件，如图\
  \ 5-8 所示：\n\n![](img/as_avd_tool_window_toolbar.jpg)\n\n图 5-8\n\n从左到右，这些按钮执行以下任务（详情与独立模式一致）：\n\
  \n- `Power`（电源）\n- `Volume Up`（音增大）\n- `Volume Down`（音缩小）\n- `Rotate Left`（左旋转）\n\
  - `Rotate Right`（右旋转）\n- `Back`（返回）\n- `Home`（首页）\n- `Overview`（概览）\n- `Screenshot`（截图）\n\
  - `Snapshots`（快照）\n- `Extended Controls`（扩展控制）\n\n### 5.9 创建可调整的模拟器\n\n除了配置特定 Android\
  \ 设备模型的模拟器外，`Android Studio` 还提供了一个可调整大小的 `AVD`，允许你在手机、平板和折叠设备尺寸之间切换。要创建一个可调整的 `emulator`，打开\
  \ `Device Manager` 并点击 `Create device` 按钮。接下来，选择图 5-9 所示的 `Resizable` 设备定义，并按照通常步骤创建新的\
  \ `AVD`：\n\n![](img/as_avd_resizable.jpg)\n\n图 5-9\n\n当你在 `tool-window` 内在新的 `emulator`\
  \ 上运行应用时，工具栏中会出现 `Display mode` 选项，允许你切换模拟器配置，如图 5-10 所示：\n\n![](img/as_avd_display_mode.jpg)\n\
  \n图 5-10\n\n如果 `emulator` 在独立模式下运行，则可以在侧边工具栏中找到 `Display mode` 选项，如下所示：\n\n![](img/as_avd_standalone_display_mode.jpg)\n\
  \n图 5-11\n\n### 5.10 总结\n\n`Android Studio` 包含一个 `Android Virtual Device` 模拟器环境，旨在使其更容易测试应用程序，而无需在物理\
  \ Android 设备上运行。本章对 `emulator` 进行了简要介绍，并突出了关键功能，这些用于配置和自定义环境以模拟不同的测试条件。\n\n# 6.\
  \ Android Studio 用户界面概览\n\n虽然人们急于运行在前一节中创建的示例应用程序，但这样做涉及使用 `Android Studio` 用户界面的某些方面，而这些内容最好先进行描述。\n\
  \n`Android Studio` 是一个强大且功能丰富的开发环境，在很大程度上是直观易用的。尽管如此，现在花时间来熟悉 `Android Studio` 用户界面的布局和组织，将大大缩短书中后续章节的学习曲线。基于此考虑，本章将对构成\
  \ `Android Studio` 环境的各种区域和组件提供初始概览。\n\n### 6.1 欢迎界面\n\n欢迎界面（图 6-1）在 `Android Studio`\
  \ 运行且当前没有打开任何项目时随时显示（可以通过选择 `File -> Close Project` 菜单选项随时关闭已打开的项目）。当 `Android Studio`\
  \ 运行且没有打开任何项目时，欢迎界面会显示，其工具栏如下所示：\n\n![](img/as_welcome_screen.jpg)\n\n图 6-1\n\n\
  除了提供了最近项目列表，欢迎界面还提供了创建项目，并提供了更改主题和字体设置的选项。`Android Studio` 插件可以查看、安装和管理。通过显示插件，如图\
  \ 6-2 所示：\n\n![](img/as_welcome_menu.jpg)\n\n图 6-2\n\n### 6.2 主窗口\n\n当创建一个新项目或打开现有项目时，`emulator`\
  \ 主窗口将出现。当同时打开多个项目时，窗口的精确配置取决于上次显示的工具和面板，但通常如图 6-3 所示：\n\n![](img/as_main_window.jpg)\n\
  \n图 6-3\n\n主窗口的各种元素总结如下：\n\n- **A – Menu Bar**（菜单栏）：包含在 `Android Studio` 环境中执行任务的系列菜单。\n\
  - **B – Toolbar**（工具栏）：常用操作的快捷键选择。可以通过右键点击工具栏并选择 `Customize Menus and Toolbars...`\
  \ 选项进行自定义。如果工具栏不可见，可以使用 `View -> Appearance -> Toolbar` 进行显示。\n- **C – Navigation\
  \ Bar**（导航栏）：提供了在项目文件中移动的便捷方式。点击导航栏中的元素将下拉显示该位置的文件夹和文件。同样，点击类名将显示包含该类的方法列表。从列表中选择方法将跳转到编辑器的相应位置。使用\
  \ `View -> Appearance -> Navigation Bar` 隐藏或显示此栏。\n- **D – Editor Window**（编辑器窗口）：`editor\
  \ window` 显示您正在编写的文件内容。当打开多个文件时，每个文件由编辑器顶部的标签表示，如图 6-4 所示：\n\n![](img/as_editor_tabs.jpg)\n\
  \n图 6-4\n- **E – Status Bar**（状态栏）：`status bar` 显示有关项目和 `Android Studio` 活动的信息消息，以及位于最左角的工具菜单按钮。悬停在状态栏项目上将显示该字段的描述。许多字段是交互式的，允许用户点击执行任务或获取更详细的状态信息。\n\
  - **F – Project Tool Window**（项目工具窗口）：项目工具窗口提供了项目文件结构的层次概述，允许导航到特定的文件和文件夹。工具栏可以使用不同的方式显示项目。默认设置是\
  \ `Android` 视图，这是本书中主要使用的模式。\n\n项目工具窗口只是 `Android Studio` 环境中许多工具窗口之一。\n\n### 6.3\
  \ 工具窗口\n\n除了项目视图工具窗口外，`Android Studio` 还包含许多其他窗口，启用后它们将显示在主窗口的底部和侧面。通过将鼠标指针悬停在位于\
  \ `status bar` 最左角的按钮上（图 6-5）而不点击鼠标按钮，可以显示 `tool window` 快速访问菜单。\n\n![](img/as_tool_window_menu.jpg)\n\
  \n图 6-5\n\n从快速访问菜单中选择项目将导致相应的工具窗口出现在主窗口中。\n\n\n\n\n或者，可以通过点击状态栏中的快速访问菜单图标来显示一组工具窗口栏。这些工具栏出现在主窗口的左侧、右侧和底部边缘（如图\
  \ 6-6 中箭头所示），并包含一个用于显示和隐藏每个工具窗口的按钮。当工具窗口栏显示时，再次点击状态栏中的按钮将把它们隐藏。\n\n![](img/as_4.1_tool_window_bars.jpg)\n\
  \n图 6-6\n\n点击按钮将显示相应的工具窗口，再次点击将隐藏该窗口。带有数字前缀的按钮（例如 1: Project/项目）表示，可以通过按下键盘上的 `Alt`\
  \ 键（macOS 上为 `Command` 键）配合相应的数字来显示该工具窗口。\n\n按钮在工具窗口栏中的位置表示该窗口在显示时将位于窗口的哪侧。可以通过点击并拖拽按钮到其他窗口工具栏的不同位置来更改这些位置。\n\
  \n每个工具窗口在顶部边缘都有其自己的工具栏。这些工具栏中的按钮会随工具而异，但所有工具窗口都包含一个由齿轮图标表示的设置选项，允许更改窗口的各个方面。图 6-7\
  \ 显示了 Project（项目）工具窗口的设置菜单。提供了可用选项，例如取消固定窗口并允许其浮动在 Android Studio 主窗口边界之外，以及移动和调整工具面板的大小。\n\
  \n![](img/android_studio_tool_window_options.jpg)\n\n图 6-7\n\n所有窗口在工具栏的最右侧还包含一个按钮，提供了隐藏工具窗口以视的额外方法。只需通过点击该窗口使其获得焦点，然后输入搜索词，即可对工具窗口内的项目进行搜索（例如\
  \ Project 工具窗口中的文件名称）。搜索框将出现在窗口的工具栏中，与搜索结果匹配的项将高亮显示。\n\nAndroid Studio 提供了各种工具窗口，最常用的包括：\n\
  \n- **App Inspection（应用检查）** - 提供对 `Database`（数据库）和 `Background Task`（后台任务）检查器的访问。`Database\
  \ Inspector`（数据库检查器）允许你在应用运行时检查、查询和修改你的应用数据库。`Background Task Inspector`（后台任务检查器）允许监控和管理使用\
  \ `WorkManager` 创建的后台工作任务。\n- **Build（构建）** - 提供了构建过程的视图，并显示错误。\n- **Build Variants（构建变体）**\
  \ - 提供了查看不同构建变体的可用选项。\n- **Device File Explorer（设备文件浏览器）** - 通过 `View -> Tool Windows`\
  \ 访问设备文件系统。\n- **Device Manager（设备管理器）** - 用于管理连接的设备和模拟器。\n- **Emulator（模拟器）** -\
  \ 在创建 模拟器章节中详细介绍。\n- **Bookmarks（书签）** - 提供对项目书签的访问。\n- **Gradle** - 显示在应用编译和打包时的构建任务信息。\n\
  - **Layout Inspector（布局检查器）** - 提供用户界面组件层级的可视化渲染。\n- **Logcat（日志分类）** - 提供运行应用的日志输出。\n\
  - **Problems（问题）** - 查看项目中所有错误或警告的集中位置。\n- **Profiler（性能分析器）** - 提供识别性能问题的分析工具，包括\
  \ CPU、内存和网络使用。\n- **Project（项目）** - 提供项目文件的概述，允许在文件之间快速导航。\n- **Resource Manager（资源管理器）**\
  \ - 用于添加和管理图像、颜色和布局文件等资源。\n- **Run（运行）** - 提供运行结果以及停止或重启运行进程的选项。\n- **Structure（结构）**\
  \ - 提供当前显示的文件结构的高级视图。\n- **Terminal（终端）** - 提供运行 Android Studio 的系统上的终端窗口。\n- **TODO**\
  \ - 提供查看项目待待完成事项的地方。\n- **Version Control（版本控制）** - 当项目文件处于源码版本控制下时，允许访问 `Git` 仓库和代码更改历史。\n\
  \n\n\n\n另一种在 Android Studio 主窗口内进行导航的实用机制是使用切换器（Switcher）。通过 `Ctrl-Tab` 快捷键访问，切换器会以面板的形式出现，列出所有工具窗口和当前打开的文件（图\
  \ 6-9）。\n\n![](img/as_switcher.jpg)\n\n图 6-9\n\n一旦显示，只要 `Ctrl` 键保持按下状态，切换器就会保持可见。在按住\
  \ `Ctrl` 键的同时反复点击 `Tab` 键可以在各种选择选项之间循环，而释放 `Ctrl` 键将选中当前高亮的项并将其显示在主窗口中。\n\n除了切换器，最近文件（Recent\
  \ Files）面板还提供了到最近打开文件的导航（图 6-10）。可以使用 `Ctrl-E` 快捷键（macOS 上为 `Cmd-E`）访问它。一旦显示，可以使用鼠标指针选择选项，或使用键盘方向键在文件名和工具窗口选项之间滚动选择。按下\
  \ `Enter` 键将选中当前高亮的项。\n\n![](img/android_studio_recent_files.jpg)\n\n图 6-10\n\n\
  ## 6.6 更改 Android Studio 主题\n\nAndroid Studio 环境的整体主题可以通过欢迎界面上的 `Configure -> Settings`（配置\
  \ -> 设置）选项，或者通过主窗口的 `File -> Settings…`（macOS 上为 `Android Studio -> Preferences…`）菜单选项进行更改。\n\
  \n一旦显示设置对话，在左侧面板中选择 `Appearance & Behavior`（外观与行为），然后选择 `Appearance`（外观），在点击 `Apply`（应用）按钮之前更改\
  \ `Theme`菜单设置。可用主题取决于平台，但通常包括 `Light`（浅色）、`IntelliJ`、`Windows`、`High Contrast`（高对比度）和\
  \ `Darcula` 等选项。图 6-11 显示了选择了 `Darcula` 主题的主窗口示例：\n\n![](img/as_3.6_darcula.jpg)\n\
  \n图 6-11\n\n要将 Android Studio 主题与操作系统的亮/色模式设置同步，请启用 `Sync with OS`（与操作系统同步）选项，并使用下拉菜单控制每个模式下使用的主题：\n\
  \n![](img/as_theme_configuration.jpg)\n\n图 6-12\n\n## 6.7 总结\n\nAndroid Studio 环境的主要元素包括欢迎界面和主窗口。每个打开的项目都分配有自己的主窗口，主窗口反过来由菜单栏、工具栏、编辑和设计区域、状态栏以及一组工具窗口组成。工具窗口显示在主窗口的侧边和底部，可以通过状态栏中的快速访问菜单或可选的工具窗口栏进行访问。\n\
  \nAndroid Studio 内部有极少的操作是无法通过快捷键触发的。可以随时从 Android Studio 主窗口内访问默认快捷键的键位映射（keymap）。\n\
  \n## 7. 在物理 Android 设备上测试 Android Studio 应用\n\n虽然使用 Android 虚拟设备 (`AVD`) 测试应用程序可以实现许多目标，但在物理\
  \ Android 设备上进行真实的应用测试是不可替代的，而且由于某些 Android 功能仅在物理 Android 设备上可用。\n\n与 `AVD` 实例和已连接的\
  \ Android 设备的通信都由 Android 调试桥 (`ADB`）处理。在本章中，我们将解释如何配置 `adb` 环境，以便在基于 macOS、Windows\
  \ 和 Linux 的系统上对 Android 设备进行应用测试。\n\n### 7.1 Android 调试桥 (ADB) 概述\n\n`ADB` 的主要目的是方便开发系统（在此例中为\
  \ Android Studio）与 `AVD 模拟器以及 Android 设备之间的交互，以便运行和调试应用程序。`ADB` 允许你通过 WiFi 网络或直接使用\
  \ USB 线连接到设备。\n\n`ADB` 由一个客户端、一个在开发系统后台运行的服务器进程以及运行在 `AVDs` 或真实 Android 设备（如手机和平板）上的守护进程后台进程组成。\n\
  \n`ADB` 客户端有多种形式。例如，提供了一个名为 `adb` 的命令行工具作为客户端，位于 `Android SDK/platform-tools` 子目录中。同样，Android\
  \ Studio 也有一个内置的客户端。\n\n可以使用 `adb` 命令行工具执行多种任务。例如，可以使用 `devices` 命令行参数获取当前激活的虚拟或物理设备列表。以下命令输出表示系统上存在\
  \ `AVD` 但没有物理设备：\n\n```bash\n$ adb devices\nList of devices attached\nemulator-5554\
  \ device\n```\n\n### 7.2 在 Android 设备上启用 USB 调试 ADB\n\n在 `ADB` 连接到 Android 设备之前，必须先配置该设备允许连接。在运行\
  \ Android 6.0 或更高版本的手机和平板设备上，实现此点的步骤如下：\n\n1. 打开设备上的 `Settings`（设置）应用并选择 `About\
  \ tablet` 或 `About phone`（在某些 Android 版本中，可以在 `Settings` 应用的 `System` 页面找到）。\n2.\
  \ 在 `About` 屏幕上滚动到 `Build number`（版本号）字段（图 7-1）并连续点击七次，直到出现指示开发者模式已开启的消息。如果 `About`\
  \ 屏幕上列出 `Build number`，则可以通过 `Software information`（软件信息）选项可用。或者，展开 `Advanced`（高级）部分（如果可用）。\n\
  \n![](img/as_3.2_build_number.jpg)\n\n图 7-1\n\n3. 返回主设置屏幕，注意出现了 `Developer options`（开发者选项）选项（在较新的\
  \ Android 版本中，该选项位于 `System` 设置屏幕）。选择此选项，并在生成的屏幕上找到 `USB debugging`（USB 调试）选项，如图\
  \ 7-2 所示：\n\n![](img/android_12_debugging.jpg)\n\n图 7-2\n\n4. 启用 `USB debugging`\
  \ 选项并在请求确认时点击 `Allow`（允许）。\n\n此时，设备已配置为接受来自开发系统的 `adb` 连接。剩下的工作是配置开发系统在设备连接时检测它。虽然这是一个相对简单的过程，但具体步骤取决于开发系统运行\
  \ Windows、macOS 还是 Linux。以下步骤假设 `SDK platform-tools` 目录已包含在操作系统的 PATH 环境变量中，如“设置\
  \ Android Studio 开发环境”](#Installation.xhtml__idTextAnchor009)章节所示。\n\n#### 7.2.1\
  \ macOS ADB 配置\n\n要在 macOS 系统上配置 `ADB` 环境，使用 USB 线将设备连接到计算机，打开终端窗口并执行以下命令重启 `adb`\
  \ 服务器：\n\n```bash\n$ adb kill-server\n$ adb start-server\n* daemon not running.\
  \ starting it now on port 5037\n* daemon started successfully *\n```\n\n一旦服务器成功运行，执行以下命令验证设备是否已被检测：\n\
  \n```bash\n$ adb devices\nList of devices attached\n74CE00060000001 offline\n```\n\
  \n如果设备被列为 `offline`（离线），回到 Android 设备并检查是否存在图 7-3 所示的对话框，请求允许 `Allow USB debugging`。勾选“Always\
  \ allow from this computer”（始终允许来自此计算机）旁边的复框，然后点击 `OK`。\n\n![](img/Image2856.jpg)\n\
  \n图 7-3\n\n再次执行 `adb devices` 命令现在应该列出可用设备：\n\n```bash\n$ adb devices\nList of devices\
  \ attached\n015d41d4454bf80c device\n```\n\n如果没有设备设备，尝试注销并重新登录 macOS 桌面，如果问题仍然存在，请重启系统。\n\
  \n#### 7.2.2 Windows ADB 配置\n\n\n\n\n\n配置基于 Windows 的开发系统通过 `ADB` 连接到 Android 设备的第一步，是在系统上安装相应的\
  \ USB 驱动程序。需要安装的 USB 驱动程序取决于 Android 设备的型号。如果你拥有 Google 设备（例如 Pixel 手机），则必须在 Windows\
  \ 系统上安装并配置 Google USB 驱动程序包。实现此操作的详细步骤请参见以下网页：\n\n[`developer.android.com/sdk/win-usb.html`](https://developer.android.com/sdk/win-usb.html)\n\
  \n对于 Google USB 驱动程序不支持的 Android 设备，需要下载由设备制造商提供的驱动程序。你可以在此处获取驱动程序列表以及相关的下载和安装信息：\n\
  \n[`developer.android.com/tools/extras/oem-usb.html`](https://developer.android.com/tools/extras/oem-usb.html)\n\
  \n安装驱动程序且设备已识别识别为正确的设备类型后，打开命令提示符窗口并执行以下命令：\n\n```bash\nadb devices\n```\n\n该命令应输出关于已连接设备的信息，如下所示：\n\
  \n```\nList of devices attached\nHT4CTJT01906 offline\n```\n\n如果设备被列为 `offline`（离线）或\
  \ `unauthorized`（未授权），请检查设备屏幕上[图 7-3]所示请求 USB 调试权限的对话框。在点击确定之前，勾选“始终允许来自此计算机”选项旁的复选框。再次执行\
  \ `adb devices` 命令，现在应该会将设备列为已就绪：\n\n```\nList of devices attached\nHT4CTJT01906\
  \ device\n```\n\n如果设备未列在列表中，请执行以下命令重启 ADB 服务：\n\n```bash\nadb kill-server\nadb start-server\n\
  ```\n\n如果设备仍然未列在列表中，尝试执行以下命令：\n\n```bash\nandroid update adb\n```\n\n请注意，可能还需要重启系统。\n\
  \n## 7.2.3 Linux adb 配置\n\n在本章中，我们将再次使用 Ubuntu Linux 作为参考示例，介绍如何在 Linux 上配置 `adb`\
  \ 以连接物理 Android 设备进行应用测试。\n\n在 Ubuntu Linux 上进行物理设备测试需要安装名为 `android-tools-adb`\
  \ 的包，这又要求 Android Studio 用户是 `plugdev` 组的成员。这是大多数 Ubuntu 版本用户账户的默认设置，可以通过运行 `id`\
  \ 命令进行验证。如果没有列出 `plugdev` 组，请运行以下命令将你的账户添加到该组：\n\n```bash\nsudo usermod -aG plugdev\
  \ $LOGNAME\n```\n\n满足用户组身份要求后，可以通过执行以下命令安装 `android-tools-adb` 包：\n\n```bash\nsudo\
  \ apt-get install android-tools-adb\n```\n\n完成上述更改后，重启 Ubuntu 系统。系统重启后，打开终端窗口，启动\
  \ `adb` 服务并检查已连接设备列表：\n\n```bash\n$ adb start-server\n* daemon not running. starting\
  \ it now on port 5037 *\n* daemon started successfully *\n\n$ adb devices\nList\
  \ of devices attached\n015d41d4454bf80c offline\n```\n\n如果设备被列为 `offline` 或 `unauthorized`，请检查\
  \ Android 设备并查看[图 7-3]所示请求允许 USB 调试权限的对话框。\n\n## 7.3 解决 USB 连接问题\n\n如果你无法通过上述步骤成功连接到设备，请显示运行目标菜单（[图\
  \ 7-4]）并选择“排除设备故障”（Troubleshoot Device Connections）选项：\n\n![](img/as_pair_devices_troubleshooting.jpg)\n\
  \n图 7-4\n\n连接助手将扫描设备并报告问题及可能的解决方案。\n\n## 7.4 在 Android 设备上启用无线调试\n\n按照上述第 [7.2]\
  \ 节的第 1 到 3 步操作，这次启用[图 7-5]所示的“无线调试”选项：\n\n![](img/android_12_enable_wifi_debugging.jpg)\n\
  图 7-5\n\n接下来，点击上述“无线调试”项以显示[图 7-6]所示的屏幕：\n\n![](img/android_12_enable_wifi_debugging_settings.jpg)\n\
  图 7-6\n\n如果你使用的设备带有摄像头，选择“通过二维码 代码配对设备”，否则选择“通过配对码配对设备”。根据你的选择，设置应用将启动摄像头会话或如[图\
  \ 7-7]所示显示配对码：\n\n![](img/as_pair_devices_code.jpg)\n图 7-7\n\n选择好选项后，返回 Android\
  \ Studio，从运行目标菜单中选择[图 7-8]所示的“通过 WiFi 配对设备”选项：\n\n![](img/as_pair_devices_wifi_menu.jpg)\n\
  图 7-8\n\n在配对对话框中，根据你之前在设备设置应用中的选择，选择“通过二维码 代码配对”或“通过配对码配对”：\n\n![](img/as_pair_devices_qr_code.jpg)\n\
  图 7-9\n\n使用 Android 设备扫描二维码，或将设备屏幕上显示的配对码输入到 Android Studio 对话框（[图 7-10]）中以完成配对过程：\n\
  \n![](img/as_pair_devices_enter_code.jpg)\n图 7-10\n\n如果配对过程失败，尝试重启开发系统和 Android\
  \ 设备并重试。\n\n## 7.5 测试 adb 连接\n\n假设在所选开发平台上已成功配置 `adb`，下一步是在设备上运行“在 Android Studio\
  \ 中创建示例应用”章节创建的应用程序。启动 Android Studio，打开 Android 项目，并验证设备是否如[图 7-11]所示出现在设备菜单中：\n\
  \n![](img/android_12_device_in_menu_scaled.jpg)\n图 7-11\n\n从列表中选择设备并点击运行按钮（设备菜单右侧的绿色箭头）安装并运行应用。\n\
  \n### 7.6 设备镜像\n\n设备镜像允许你在物理设备上运行应用的同时，在 Android Studio 的“运行设备”工具窗口查看设备显示。也就是说，尽管你的应用在物理设备上运行，但它以类似于\
  \ AVD 实例的方式显示在 Android Studio 中。\n\n设备镜像是 Android Studio Eel 中的实验性功能，必须手动启用。要启用设备镜像，选择\
  \ `File -> Settings...`（macOS 为 `Android Studio -> Preferences...`），在左侧面板中选择 `Experimental`\
  \ 项，并开启[图 7-12]所示的“启用物理 Android 设备镜像”：\n\n![](img/as_enable_device_mirroring.jpg)\n\
  图 7-12\n\n启用设备镜像并将设备连接到 Android Studio 后，显示“运行设备”工具窗口（`View -> Tool Windows -> Running\
  \ Devices`）。Android Studio 将设备的显示镜像到工具窗口中。\n\n### 7.7 总结\n\n虽然 Android 虚拟机模拟器提供了一个极佳的测试环境，但请记住，确保应用程序在物理\
  \ Android 设备上正常运行是任何方法都无法替代的。毕竟，这才是应用程序在现实世界中被使用的的地方。\n\n\n\n\n默认情况下，Android Studio\
  \ 环境并未配置为将 Android 设备识别为目标测试设备。因此，必须执行某些步骤，以便能够在 Android Studio 开发环境中，通过 USB 线缆或\
  \ WiFi 网络直接将应用程序加载到 Android 设备上。实现这一目标的具体步骤取决于你所使用的开发平台。在本章中，我们已经涵盖了针对 Linux、macOS\
  \ 和基于 Windows 平台的这些步骤。\n\n# 8. Android Studio 代码编辑器基础\n\n为 Android 开发应用程序涉及大量的编程工作，根据定义，这涉及到代码行的的输入、审查和修改。令人并不意外的是，开发者在使用\
  \ Android Studio 时花费的大部分时间通常是在编辑器窗口内编辑代码。\n\n现代代码编辑器的需求远超最初的输入、删除、剪切和粘贴等基本功能。如今，代码编辑器的实用性通常由多种因素衡量，例如它在减少程序员输入量方面的程度、在大型源文件中导航的易用性，以及编辑器在编写代码时实时检测并高亮编程错误的能力。正如本章将所示，这些只是\
  \ Android Studio 编辑器出色的少数领域。\n\n虽然本章并不是 Android Studio 编辑器功能的详尽概述，但其目的是提供该工具关键功能的指南。经验丰富的程序员会发现，其中某些功能是目前大多数代码编辑器共有的，而许多功能是这一特定编辑环境独有的。\n\
  \n### 8.1 Android Studio 编辑器\n\n当选择 Java、Kotlin、XML 或其他基于文本的文件进行编辑时，Android Studio\
  \ 编辑器出现在主窗口中央。例如，图 8-1 显示了一个加载了 Java 源代码文件的典型编辑器会话：\n\n![](img/as_code_editor_labelled.jpg)\n\
  \n图 8-1\n\n构成编辑器窗口的元素可以总结如下：\n\n- **A – 文档标签页 (Document Tabs)** – Android Studio\
  \ 能够同时打开多个文件进行编辑。每打开一个文件时，它都会被分配一个文档标签，在位于编辑器窗口顶部边缘的标签栏中显示文件名。当空间不足以显示所有标签页时，标签栏的最右侧会出现一个小小的下拉菜单。点击此菜单将弹出其他已打开的文件列表。标签页中文件名下方的红色波浪线表示该文件中的代码包含一个或多个错误，这些错误在项目编译和运行之前需要解决。\n\
  \n在文件之间切换只需点击相应的标签或使用 `Alt-Left` 和 `Alt-Right` 快捷键。也可以使用切换器机制（通过 `Ctrl-Tab` 快捷键访问）进行文件间的导航。\n\
  \n要将编辑器面板从 Android Studio 主窗口分离以便在单独的窗口中显示，请点击标签并将其拖到主窗口之外的桌面某个区域。要将编辑器返回主窗口，请点击分离的编辑器窗口中的文件标签，并将其拖放到主窗口中原始的编辑器标签栏上。\n\
  \n- **B – 编辑器标格区域 (The Editor Gutter Area)** - 标格区域被编辑器用于显示信息图标和控件。出现在此标格区域的典型项目包括：调试断点标记、折叠和展开代码块的控件、书签、更改标记和行号。行号默认开启的，但可以通过在标格中点击单击右键并选择\
  \ `Show Line Numbers`（显示行号）菜单选项来将其禁用。\n\n- **C – 代码结构位置 (Code Structure Location)**\
  \ - 编辑器顶部的此栏显示了光标相对于代码整体结构的位置。例如，在后续图中，该栏指示当前正在编辑 `convertCurrency` 方法，且该方法包含在 `MainActivity`\
  \ 类中。\n\n![](img/as_4.2_code_location.jpg)\n\n图 8-2\n\n双击栏内的某个元素会将光标移动到代码文件中的相应位置。例如，双击\
  \ `convertCurrency` 条目将把光标移动到源码中 `convertCurrency` 方法的顶部。同样，点击 `MainActivity` 条目将弹出一个可用的代码导航点列表供选择：\n\
  \n![](img/as_4.2_code_location_menu.jpg)\n\n图 8-3\n\n- **D – 编辑器区域 (The Editor Area)**\
  \ – 这是用户显示、输入和编辑代码的主区域。本章随后的章节将详细介绍编辑区域的关键功能。\n\n- **E – 验证和标记侧边栏 (The Validation\
  \ and Marker Sidebar)** – Android Studio 整合了一项名为“即时代码分析”（on-the-fly code analysis）的功能。这本质意味着当你编写代码时，编辑器正在分析代码以检查警告和语法错误。验证侧边栏顶部的指示器会随着代码的添加实时更新，指示发现的错误和警告数量。点击此指示器将显示弹出窗口，其中包含编辑器代码中发现的问题摘要，如\
  \ 图 8-4 所示：\n\n![](img/as_4.2_code_editor_warning_errors.jpg)\n\n图 8-4\n\n可以使用向上和向下箭头在代码中的错误位置之间移动。绿色勾选标记表示未检测到警告或错误。\n\
  \n侧边栏还使用相同的颜色编码在检测到问题的位置显示标记。当代码行在编辑器区域中可见时，将鼠标指针悬停在标记上，将显示一个包含该问题描述的弹出窗口：\n\n![](img/as_warning_box.jpg)\n\
  \n图 8-5\n\n当代码行滚动到编辑器可视区域之外时，将鼠标指针悬停在标记上，将显示一个“透镜”（lens）覆盖，包含问题所在的代码块（参见图 8-6），无需滚动到编辑器中的该位置：\n\
  \n![](img/Image2460.jpg)\n\n图 8-6\n\n值得注意的是，透镜覆盖不仅限于侧边栏中的警告和错误。悬停在侧边栏的任何部分都会显示一个透镜，其中包含源文件中对应位置的代码。\n\
  \n- **F – 状态栏 (The Status Bar)** – 虽然状态栏实际上属于主窗口而非编辑器，但它确实包含有关当前活动编辑会话的信息。这些信息包括光标在行和字符方面的当前位置以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号将显示“转到行：列”对话框。使用 `View -> Appearance -> Status Bar\
  \ Widgets` 菜单选项添加或删除部件。例如，如果你遇到 Android Studio 的性能问题，内存指示器（Memory Indicator）是一个非常有用的部件。\n\
  \n在概述构成 Android Studio 编辑器的元素后，本章的剩余部分将详细介绍编辑环境的关键功能。\n\n## 8.2 分割编辑器窗口\n\n\n\n\n\
  \n默认情况下，编辑器将显示单个面板，用于显示当前选中文件的内容。在同时处理多个源代码文件时，一个特别实用的功能是将编辑器拆分为多个窗格。要拆分编辑器，可以在编辑器窗口内右键点击文件标签，然后选择\
  \ `Split Vertically`（垂直拆分）或 `Split Horizontally`（水平拆分）菜单选项。例如图 8-7 展示了拆分器的用法，编辑器被拆分为三个面板：\n\
  \n![](img/Image2467.jpg)\n图 8-7\n\n拆分面板的方向可以随时通过右键点击相应的标签并选择 `Change Splitter Orientation`（更改拆分方向）菜单选项来更改。重复这些步骤可以取消单个面板的分拆，此时选择菜单中的\
  \ `Unsplit`（取消拆分）选项。可以通过右键点击任何标签并选择 `Unsplit All`（取消所有拆分）移除所有的拆分面板。\n\n窗口拆分可以显示不同的文件，也可以为同一个文件提供多个窗口，允许同时查看和编辑同一文件的不同区域。\n\
  \n### 8.3 代码补全\n\nAndroid Studio 编辑器对 Java 编程语法以及构成 Android SDK 的类和方法有大量的内置知识，同时也也对你自己的代码库有了解。随着代码的输入，编辑器会扫描输入内容，并在适当的情况下就完成一个语句或引用可能所需的内容提供建议。当编辑器检测到代码补全建议时，将出现一个包含建议列表的面板。例如图\
  \ 8-8 所示，编辑器正在为 `String` 声明的开头提供可能的选项建议：\n\n![](img/Image2477.jpg)\n图 8-8\n\n如果没有任何一个自动补全建议是正确的，只需继续输入，编辑器将在适宜的情况下继续完善建议。要采纳最顶部的建议，只需按下键盘上的\
  \ `Enter` 或 `Tab` 键。要选择不同的建议，请使用方向键在列表中上下移动，并再次使用 `Enter` 或 `Tab` 键选中高亮项。\n\n可以使用\
  \ `Ctrl-Space` 组合键手动调用代码补全建议。这在更改编辑器中的单词或声明时非常有用。当光标置于编辑器中的某个单词上时，该单词将自动高亮。按下 `Ctrl-Space`\
  \ 将显示一组备选建议。要将当前单词替换为建议列表中当前高亮的项，只需按下 `Tab` 键即可。\n\n除了实时自动补全功能外，Android Studio 编辑器还提供了一种称为智能补全（Smart\
  \ Completion）系统。智能补全通过 `Shift-Ctrl-Space` 组合键调用，选中后将根据代码当前的上下文提供更详细的建议。再次按下 `Shift-Ctrl-Space`\
  \ 快捷键将从更广泛的可能性提供更多建议。\n\n代码补全对许多程序员来说可能取决于个人喜好。考虑到这一事实，Android Studio 对自动补全设置提供了高层级的控制。可以通过选择\
  \ `File -> Settings…` 菜单选项（macOS 上为 `Android Studio -> Preferences…`）并在设置面板中选择 `Editor\
  \ -> General -> Code Completion` 来查看和修改这些设置，如图 8-9 所示：\n\n![](img/as_code_completion_preferences.jpg)\n\
  图 8-9\n\n### 8.4 语句补全\n\nAndroid Studio 编辑器提供的另一种自动补全形式是语句补全。它可以用于自动填充方法和循环语句等项的括号和大括号。语句补全通过\
  \ `Shift-Ctrl-Enter`（macOS 上为 `Shift-Cmd-Enter`）组合键调用。例如，考虑以下代码：\n\n```\nmyMethod()\n\
  ```\n\n在编辑器中输入此代码后，触发语句补全会导致编辑器自动为该方法添加大括号：\n\n```\nmyMethod() {\n\n}\n```\n\n###\
  \ 8.5 参数信息\n\n还可以请求编辑器提供关于方法接受的参数参数的信息。当光标置于方法调用的括号之间时，使用 `Ctrl-P`（macOS 上为 `Cmd-P`）组合键将显示该方法已知接受的参数，其中最可能的建议将以加粗形式显示：\n\
  \n![](img/Image2491.jpg)\n图 8-10\n\n### 8.6 参数名称提示\n\n代码编辑器可以配置为在方法调用中显示参数名称提示。例如图\
  \ 8-11 高亮了 `Snackbar` 类的 `make()` 和 `setAction()` 方法调用中的参数名称提示：\n\n![](img/Image2499.jpg)\n\
  图 8-11\n\n此模式的设置可以通过选择菜单 `File -> Settings`（macOS 上为 `Android Studio -> Preferences`）然后在左侧面板中选择\
  \ `Editor -> Inlay Hints -> Java` 来配置。在结果屏幕上，从列表中选择 `Parameter Hints` 项并启用或禁用 `Show\
  \ parameter hints` 。要调整提示设置，点击 `Exclude list...` 链接并进行任何调整。\n\n### 8.7 代码生成\n\n\
  除了在输入时补全代码外，编辑器在某些条件下还可以为你生成代码。当光标位于文件内需要生成代码的位置时，可以使用 `Alt-Insert`（macOS 上为 `Cmd-N`）快捷键访问图\
  \ 8-12 所示的可用代码生成选项列表：\n\n![](img/as_3.4_code_editor_generate.jpg)\n图 8-12\n\n为了示例，请考虑一种情况：我们希望在项目中的\
  \ `Activity` 即将被操作系统销毁时收到通知。正如本书稍后章节将概述的，这可以通过重写 `Activity` 超类的 `onStop()` 生命周期方法来实现。要让\
  \ Android Studio 为此生成存根方法（stub method），只需从代码列表中选择 `Override Methods…`，并从生成的列表中选择\
  \ `onStop()` 方法：\n\n![](img/as_3.6_override_methods.jpg)\n图 8-13\n\n选中要重写的方法后，点击\
  \ OK 将在 Java 源文件的当前位置生成存根方法，如下所示：\n\n```java\n@Override\nprotected void onStop()\
  \ {\n    super.onStop();\n}\n```\n\n### 8.8 代码折叠\n\n一旦源代码文件达到特定大小，即使是格式化最整齐、组织最好的代码也可能变得难以应付且难以导航。Android\
  \ Studio 认为，并不总是需要让每个代码块的内容可见。通过使用 Android Studio 编辑器的代码折叠功能，可以更容易进行导航。代码折叠通过位于源文件每个代码块开始和结束处的边缘标记来控制。例如图\
  \ 8-14 高亮了当前未折叠的方法声明的起始和结束标记：\n\n![](img/as3.2_java_code_folding.jpg)\n图 8-14\n\n\
  点击这些标记中的任意一个将折叠语句，只显示签名行，如图 8-15 所示：\n\n![](img/Image2533.jpg)\n图 8-15\n\n要展开折叠的代码段，只需点击编辑器边缘的\
  \ `+` 标记。若要在不折叠的情况下查看隐藏代码，请将鼠标指针悬停在 `{…}` 指示器上，如图 8-16 所示。编辑器随后将显示包含折叠代码块的透镜层：\n\
  \n![](img/Image2540.jpg)\n图 8-16\n\n\n\n\n\n可以使用 `Ctrl-Shift-Plus` 和 `Ctrl-Shift-Minus`\
  \ 键序列折叠或展开文件中的所有代码块。\n\n默认情况下，Android Studio 编辑器在打开源文件时会自动折叠某些代码。要配置发生此情况条件，请选择\
  \ `File` -> `Settings…`（macOS 上为 `Android Studio` -> `Preferences…`），并在生成的设置面板中选择\
  \ `Editor` -> `General` -> `Code Folding` 项（图 8-17）：\n\n![](img/as_code_folding_preferences.jpg)\n\
  \n图 8-17\n\n## 8.9 快速文档查询\n\n将光标置于需要文档的声明上，并按下 `Ctrl-Q` 快捷键（macOS 上为 `Ctrl-J`），即可访问上下文敏感的\
  \ Java 和 Android 文档。这将显示包含该项目相关参考文档的弹出窗口。例如，图 8-18 显示了 `AndroidFloatingActionButton`\
  \ 类的文档。\n\n![](img/as_documentation.jpg)\n\n图 8-18\n\n### 8.10 代码重格式\n\n通常情况下，Android\
  \ Studio 编辑器会在添加语句和代码块时，根据缩进、间距以及语句和代码块的嵌套自动对代码进行格式化。在需要重新格式化代码的情况下（这是常见的情况，例如从网站复制并粘贴示例代码时），编辑器提供了源代码重格式功能，选中后将自动重格式代码以匹配主流的代码风格。\n\
  \n要重格式化源代码，请按 `Ctrl-Alt-L`（macOS 上为 `Cmd-Opt-L`）快捷键序列。要显示 `Reformat Code` 对话框（图\
  \ 8-19），请使用 `Ctrl-Alt-Shift-L`（macOS 上为 `Cmd-Opt-Shift-L`）。此对话框提供了仅重格式当前选中代码、编辑器中当前活动的整个源文件或仅由于源码控制更新而更改的代码选项。\n\
  \n![](img/as_reformat_code.jpg)\n\n图 8-19\n\n全范围的代码风格偏好可以在项目设置对话框中更改。选择 `File` ->\
  \ `Settings` 菜单选项（macOS 上为 `Android Studio` -> `Preferences…`），并在左侧面板中选择 `Code Style`\
  \ 以访问支持的编程和标记语言列表。选择一种语言将提供大量的格式样式选项，所有选项都可以从 Android Studio 默认值修改以匹配您喜的代码风格。例如，要配置上述对话框中\
  \ `Rearrange` 代码选项的设置，展开 `Code Style` 部分，选择 `Java`，并在 `Java` 设置中选择 `Arrangement`\
  \ 标签。\n\n## 8.11 查找示例代码\n\nAndroid Studio 编辑器提供了一种访问与代码列表中当前高亮项相关的示例代码的方法。此功能对于学习如何使用特定的\
  \ Android 类或方法非常有用。要查找示例代码，在编辑器中高亮方法或类名，右键点击它并选择 `Find Sample Code` 菜单选项。`Find Sample\
  \ Code` 面板（图 8-20）将出现在编辑器下方，列出匹配的示例列表。从列表中选择一个示例会将相应的代码加载到右侧面板：\n\n![](img/Image2571.jpg)\n\
  \n图 8-20\n\n## 8.12 Live 模板\n\n在编写 Android 代码时，你会发现有一些经常使用的常用结构。例如，一个常见的需求是使用 `Android\
  \ Toast` 类向用户显示弹出消息。Live Templates 是常用代码结构的集合，可以通过在编辑器中输入初始字符后跟一个特殊键（默认设置为 `Tab`\
  \ 键）来插入模板代码。要体验这一操作，在代码编辑器中输入 `toast` 然后按 `Tab` 键，Android Studio 将在光标位置插入以下代码并准备好编辑：\n\
  \n```\nToast.makeText(, \"\", Toast.LENGTH_SHORT).show();\n```\n\n要列出并编辑现有模板、更改特殊键或添加您自己的模板，请打开\
  \ `Preferences` 对话框，并从左侧导航面板的 `Editor` 部分选择 `Live Templates`：\n\n![](img/as_4.0_live_templates.jpg)\n\
  \n图 8-21\n\n使用上方 图 8-21 中标记为 `A` 的按钮来添加、删除、复制或重置模板。要修改模板，从列表中选择它（`B`）并更改标记为 `C`\
  \ 的面板中的设置。\n\n### 8.13 总结\n\nAndroid Studio 编辑器尽力减少编写代码所需的打字量，并使代码更容易阅读和导航。在本章中，我们涵盖了许多关键编辑器功能，包括代码补全、代码生成、编辑器窗口拆、代码折叠、重格式、文档查询和\
  \ Live 模板。\n\n# 9. Android 架构概述\n\n到目前为止，本书已经采取步骤建立了一个适用于使用 Android Studio 开发 Android\
  \ 应用的环境。通过创建 Android Studio 应用项目，也迈出了应用开发的第一步。\n\n然而，在进一步研究 Android 应用开发的实际问题之前，了解\
  \ Android SDK 以及通用的 Android 开发的一些抽象概念是非常关重要的。清晰地理解这些概念将为后续知识奠定坚实的基础。\n\n从本章对 Android\
  \ 架构的概述开始，并在接下来的章节中继续，目标是提供 Android 开发的详细概述。\n\n### 9.1 Android 软件栈\n\nAndroid 以软件栈的形式结构，由应用程序、操作系统、运行时环境、中间件、服务和库组成。这种架构或许可以通过图\
  \ 9-1 所示的方式进行视觉表示。栈的每一层及其内部相应的元素都紧密集成并经过仔细调整，以为移动设备提供最优的开发和执行环境。本章剩余部分将介绍不同的层，从底部的\
  \ Linux 内核开始。\n\nLinux 内核位于栈底部，在设备硬件和 Android 软件栈上层之间提供了抽象层。基于 Linux `2.6` 版本，内核提供了抢占式多任务、底层核心系统服务（如内存、进程和电源管理），以及网络栈和显示、WiFi、音频设备驱动。\n\
  \n原始 Linux 内核由 Linus Torvalds 于 1991 年开发，并与 Richard Stallman 在自由软件基金开发的系列工具、实用程序和编译器结合，形成了名为\
  \ GNU/Linux 的完整操作系统。从这些基础衍生出了各种 Linux 发行版，如 `Ubuntu` 和 `Red Hat Enterprise Linux`。\n\
  \n然而，重要的是，Android 仅使用 Linux 内核。尽管如此，值得注意的是，Linux 内核最初是为台式机和服务器等传统计算机设计的。事实上，Linux\
  \ 现在最广泛部署在任务关键的企业服务器环境中。这种软件位于 Android 软件栈的核心，这证明了当今移动设备的强大，也证明了 Linux 内核的效率和性能。\n\
  \n![](img/Image2438.jpg)\n\n图 9-1\n\n### 9.3 Android Runtime – ART\n\n\n\n\n\n当\
  \ Android 应用在 Android Studio 中构建时，它会被编译为一种中间字节码格式（称为 `DEX` 格式）。当应用程序随后加载到设备上时，Android\
  \ 运行时（`ART`）使用一种称为提前编译（Ahead-of-Time，简称 `AOT`）的过程将字节码翻译为设备处理器所需的原生指令。这种格式被称为可执行和链接格式（`ELF`）。\n\
  \n此后每次启动应用程序时，都会运行 `ELF` 可执行版本，从而获得更快的应用程序性能和更好的电池续航能力。\n\n这与旧版 Android 实现使用的即时编译（Just-in-Time，简称\
  \ `JIT`）方法形成对比，在那种方法中，字节码每次启动应用程序时都在虚拟机（`VM`）内部翻译。\n\n### 9.4 Android Libraries\n\
  \n除了一组标准的 Java 开发库（提供字符串处理、网络连接和文件操作等通用任务的支持）外，Android 开发环境还包含 `Android Libraries`。这些是专门用于\
  \ Android 开发的 Java 库。此类库的示例包括应用框架库，以及便于用户界面构建、图形绘制和数据库访问的库。\n\n以下是 Android 开发者可用的一些核心\
  \ Android 库摘要：\n\n- `android.app` – 提供对应用模型的访问，是所有 Android 程序的基石。\n- `android.content`\
  \ – 便于应用程序与应用程序组件之间的内容访问、发布和消息传递。\n- `android.database` – 用于访问内容提供者发布的数据，包含 `SQLite`\
  \ 数据库管理类。\n- `android.graphics` – 一个底层 2D 图形绘制 API，包括颜色、点、过滤器、矩形和画布。\n- `android.hardware`\
  \ – 提供一个访问加速度计和光线传感器等硬件的 API。\n- `android.opengl` – 指向 `OpenGL ES` 3D 图形渲染 API 的\
  \ Java 接口。\n- `android.os` – 为应用程序提供对标准操作系统服务的访问，包括消息、系统服务和进程间通信。\n- `android.media`\
  \ – 提供启用音频和视频播放的类。\n- `android.net` – 一组提供访问网络栈的 API。包括 `android.net.wifi`，它提供对设备无线栈的访问。\n\
  - `android.print` – 包含允许从 Android 应用程序内部将内容发送到已配置打印机的类 set。\n- `android.provider`\
  \ – 一组便利类，提供对标准 Android 内容提供者数据库的访问，例如日历和联系人应用程序维护的数据库。\n- `android.text` – 用于设备显示上渲染和操作文本。\n\
  - `android.util` – 一组工具类，用于执行字符串和数字转换、XML 处理以及日期时间操作等任务。\n- `android.view` – 应用程序用户界面的基础构建模块。\n\
  - `android.widget` – 丰富的预构建用户界面组件集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n- `android.webkit`\
  \ – 一组旨在允许在应用程序构建网络浏览功能的类。\n\n在涵盖了 Android 运行时中基于 Java 的库之后，现在是将注意力转向 Android 软件栈这一层包含的基于\
  \ C/C++ 的库了。\n\n#### 9.4.1 C/C++ Libraries\n\n前一节概述的 Android 运行时核心库是基于 Java 的，为编写\
  \ Android 应用程序的开发者提供了主要的 API。然而，重要的是，核心库并没有执行大量的实际工作，事实上，它们本质上是对基于 C/C++ 的库集的 Java\
  \ “封装”（wrappers）。例如，当调用 `android.opengl` 库在设备显示上绘制 3D 图形时，该库最终会调用 `OpenGL ES` C++\
  \ 库，而该库又与底层 `Linux` 内核协作以执行绘制任务。\n\n包含 C/C++ 库是为了满足广泛多样的功能，包括 2D 和 3D 图形绘制、安全套字层（`SSL`）通信、`SQLite`\
  \ 数据库管理、音频视频播放、位图和矢量字体渲染、显示子系统和图形层管理以及标准 C 系统库（`libc`）的实现。\n\n在实践中，典型的 Android 开发者将仅通过\
  \ Java 的 Android 核心库 API 访问这些库。如果需要直接访问这些库，可以使用 Android Native Development Kit（`NDK`），其目的是通过\
  \ Java Native Interface（`JNI`）从 Java 代码内部调用非 Java 或 Kotlin 编程语言（如 `C` 和 `C++`）的原生方法。\n\
  \n### 9.5 Application Framework\n\n应用程序框架是一组服务，共同组 Android 应用程序运行和管理的环境。该框架实现了这样一个概念：Android\
  \ 应用程序是由可重用、可交换和可替换的组件构建的。这一概念更进一步，应用程序还可以发布其功能以及任何相关数据，以便其他应用程序可以发现并重用它们。\n\nAndroid\
  \ 框架包含以下关键服务：\n\n- `Activity Manager` – 控制应用程序生命周期的所有方面和活动栈。\n- `Content Providers`\
  \ – 允许应用程序与其他应用程序发布并共享数据。\n- `Resource Manager` – 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n\
  - `Notifications Manager` – 允许应用程序向用户显示警报和通知。\n- `View System` – 一组用于创建应用程序用户界面的可扩展视图。\n\
  - `Package Manager` – 应用程序借此获取设备上当前安装的其他应用程序信息的系统。\n- `Telephony Manager` – 为应用程序提供有关设备上可用电话服务的信息，例如状态和订阅者信息。\n\
  - `Location Manager` – 提供对位置服务的访问，允许应用程序接收位置更改的更新。\n\n### 9.6 Applications\n\n位于\
  \ Android 软件栈顶端的是应用程序。这些包含了特定 Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用程序）以及用户在购买设备后安装的第三方应用程序。\n\
  \n### 9.7 Summary\n\n良好的 Android 开发知识基础需要理解 Android 的整体架构。Android 以软件栈架构的形式实现，由\
  \ `Linux` 内核、运行时环境及相应的库、应用程序框架以及一组应用程序组成。\n\n# 10. The Anatomy of an Android Application\n\
  \n无论你之前的编程经验是基于 Windows、macOS、Linux 还是基于 iOS 的，都很有可能 Android 开发与你遇到过的任何事物都不同。\n\n\
  \n\n\n\n因此，本章目的是让读者理解 Android 架构背后的高层概念。在此过程中，我们将详细探索用于构建应用程序的各种组件，以及允许这些组件协作以创建一个连贯应用程序的机制。\n\
  \n### 10.1 Android Activities（活动）\n\n熟悉 `Java`、`Kotlin`、`C++` 或 `C#` 等面向对象编程语言的人都会熟悉将应用程序功能元素封装在类中，然后将其实例化为对象并进行操作以创建应用程序的概念。由于\
  \ Android 应用程序是用 `Java` 和 `Kotlin` 编写的，这一点仍然适用。然而，Android 将可重用组件的概念提升到了更高的水平。\n\n\
  Android 应用程序通过汇集一个或多个被称为 `Activities` 的组件来创建。`activity` 是应用程序功能的单个、独立模块，通常直接对应于单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能会有一个\
  \ `activity` 屏幕用于显示当天设置的预约。该应用程序还可能使用第二个 `activity`，该屏幕包含一个允许用户输入新预约的界面面。\n\n`Activities`\
  \ 被设计为完全可重用且可交换的构建块，可以在不同的应用程序之间共享。例如，一个现有的电子邮件应用程序可能包含一个专门用于编写和发送电子邮件消息的 `activity`。开发者可能正在编写一个同样具有发送电子邮件消息请求的应用程序。开发者无需为新应用程序专门开发一个邮件编写\
  \ `activity`，而可以直接使用现有电子邮件应用程序中的 `activity`。\n\n`Activities` 是作为 Android `Activity`\
  \ 类的子类创建的，并且必须实现为能够完全独立于应用程序中的其他 `activity`。换句话说，共享的 `activity` 不能依赖于在程序流的已知点被调用（因为其他应用程序可能会以意想不到的方式使用该\
  \ `activity`），而且一个 `activity` 不能直接调用另一个 `activity` 的方法或访问其实例数据。相反，这是通过 `Intents`\
  \ 和 `Content Providers` 实现的。\n\n默认情况下，`activity` 不能向调用它的 `activity` 返回结果。如果需要此功能，必须将该\
  \ `activity` 作为源 `activity` 的子活动特殊启动。\n\n### 10.2 Android Fragments（片段）\n\n如上述，`activity`\
  \ 通常代表应用中的单个用户界面屏幕。一种方案是使用单个用户界面布局和一个对应的活动类文件来构建 `activity`。然而，更好的替代方案是将 `activity`\
  \ 拆分为不同的部分。这些部分中的每一个都被称为一个 `fragment`，每个片段由用户界面布局的一部分和一个匹配的类文件（声明为 Android `Fragment`\
  \ 类的子类）组成。在这种情况下，`activity` 变成一个容器，在其中嵌入一个或多个 `fragments`。\n\n事实上，`fragments` 为每个用户界面屏幕由单独的\
  \ `activity` 表示提供高效的替代方案。相反，一个应用可以包含一个 `activity`，在不同的 `fragments` 之间切换，每个 `fragment`\
  \ 代表不同的应用屏幕。\n\n### 10.3 Android Intents（意图）\n\n`Intents` 是一个 `activity` 启动另一个 `activity`\
  \ 并实现组成应用程序的 `activities` 之间的的机制。`Intents` 由要执行的操作描述以及可选的执行操作的数据组成。\n\n`Intents`\
  \ 可以是显式的（explicit），即通过通过类名引用活动来请求启动特定的 `activity`；也可以是隐式的（implicit），即指明要执行的操作类型，或提供执行该操作的特定类型的数据。在隐式意图的情况下，Android\
  \ 运行时将使用一种称为“意图解析”（`Intent Resolution`）的过程，选择与 `Intent` 指定的标准最匹配的 `activity` 进行启动。\n\
  \n### 10.4 Broadcast Intents（广播意图）\n\n另一种类型的 `Intent` 是 `Broadcast Intent`（广播意图），它是系统级的意图，发送给所有注册了“感兴趣”`Broadcast\
  \ Receiver` 的应用程序。例如，Android 系统通常会发送 `Broadcast Intents` 来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕开启或关闭。\n\
  \n`Broadcast Intent` 可以是普通的（异步的），因为它在基本相同的时间内发送给所有感兴趣的 `Broadcast Receivers`；也可以是有序的（ordered），因为它一次一次发送给一个接收器，接收器对其进行处理，然后将其中止或允许传递给下一个\
  \ `Broadcast Receiver`。\n\n### 10.5 Broadcast Receivers（广播接收器）\n\n`Broadcast Receivers`\
  \ 是应用程序响应 `Broadcast Intents` 的机制。`Broadcast Receiver` 必须由应用程序注册，并配置 `Intent Filter`（意图过滤器）以指示其感兴趣的广播类型。当广播一个匹配的意图时，无论注册该接收器的应用程序当前是否运行，Android\
  \ 运行时都会调用该接收器。接收器有 5 秒钟时间来完成其所需的任何任务（例如启动 `Service`、更新数据或向用户发出通知），然后返回。`Broadcast\
  \ Receivers` 在后台运行，并且没有用户界面。\n\n### 10.6 Android Services（Android 服务）\n\n`Android\
  \ Services` 是在后台运行且没有用户界面的进程。它们可以从 `activities`、`Broadcast Receivers` 或其他 `Services`\
  \ 启动并随后管理。`Android Services` 适用于应用程序需要继续执行任务但并不一定需要用户可见用户界面的情况。虽然 `Services` 缺乏用户界面，但它们仍然可以使用通知（notifications）和吐司（toast，屏幕上出现但不中断当前可见活动的小型通知消息）来通知用户事件，并能够发布\
  \ `Intents`。\n\nAndroid 运行时赋予 `Services` 的优先级高于许多其他进程，系统只有在释放资源的最后情况下才会作为最后手段将其终止。然而，如果运行时确实需要杀死一个\
  \ `Service`，一旦资源再次可用，它将自动重启。`Service` 可以通过声明自己需要在前台运行来降低被终止的风险。这是通过调用 `startForeground()`\
  \ 实现的。这仅建议用于会对用户体验产生不利的情况（例如，如果用户正在听由 `Service` 流传输的音频）。\n\n`Service` 可能作为实际解决方案的示例情况包括如之前提到的，当应用程序不再活动时继续流传输音频，或者在股票达到指定价格时通知用户的股票跟踪应用程序。\n\
  \n### 10.7 Content Providers（内容提供者）\n\n`Content Providers` 实现了应用程序之间共享数据的机制。任何应用程序都可以通过实现\
  \ `Content Provider` 为其他应用程序提供对其底层数据的访问，包括添加、删除和查询数据（受权限限制）。数据的访问通过 `Content Provider`\
  \ 定义的通用资源标识符（`URI`）提供。数据可以以文件或整个 SQLite 数据库的形式进行共享。\n\n\n\n\n\n原生 Android 应用包含许多标准的内容提供者（Content\
  \ Providers），允许应用程序访问联系人和媒体文件等数据。Android 系统上当前可用的内容提供者可以通过 `Content Resolver` 进行定位。\n\
  \n### 10.8 应用程序清单 (Application Manifest)\n\n将组成应用程序的各种元素结合在一起的胶水是应用程序清单文件。在这个 XML\
  \ 文件中，概述了构成完整应用程序的活动、服务、广播接收器、数据提供者和权限。\n\n### 10.9 应用程序资源 (Application Resources)\n\
  \n除了清单文件和包含字节码的 Dex 文件外，Android 应用包通常还包含一组资源文件。这些文件包含了出现在用户界面上的字符串、图像、字体和颜色等资源，以及用户界面布局的\
  \ XML 表示。默认情况下，这些文件存储在应用程序项目层次结构的 `/res` 子目录中。\n\n### 10.10 应用程序上下文 (Application\
  \ Context)\n\n当应用程序被编译时，会创建一个名为 `R` 的类，其中包含对应用程序资源的引用。应用程序清单文件和这些资源结合在一起创建了所谓的应用程序上下文（Application\
  \ Context）。该上下文由 Android `Context` 类表示，可以在应用程序代码中使用它在运行时访问应用程序资源。此外，可以在应用程序上下文上调用广泛的方法来收集信息并在运行时更改应用程序的环境。\n\
  \n### 10.11 总结\n\n许多不同的元素可以被组合成一个 Android 应用。在本章中，我们提供了活动（Activities）、片段（Fragments）、服务（Services）、意图（Intents）和广播接收器（Broadcast\
  \ Receivers）的高级概述，以及清单文件和应用程序资源的概述。\n\n通过创建活动和意图形式的独立功能模块，可以促进最大重用和操作性，而应用程序之间的数据共享通过实现内容提供者来实现。活动专注于用户与应用程序交互的区域（活动本质等同于单个用户界面屏幕，通常由一个或多个片段组成），而后台处理通常由服务广播接收器处理。\n\
  \n构成应用程序的组件在清单文件中为 Android 运行时系统进行了概述，该文件结合应用程序资源，代表了应用程序的上下文。\n\n本章涵盖了许多对普通开发者来说可能是新的内容。不过，请放心，在后续章节中将对这些概念进行深入探索和实际应用，以确保为构建自己的应用程序打下坚实的知识基础。\n\
  \n# 11. Android 视图绑定 (View Binding) 概述\n\n开发 Android 应用的一个重要部分涉及代码与构成用户界面布局的视图之间的交互。本章将介绍在代码中访问布局视图的选项，特别强调一种被称为视图绑定（view\
  \ binding）的选项。在涵盖视图绑定的基础之后，本章将概述将 AndroidSample 项目转换为使用此方法所需的更改。\n\n### 11.1 通过\
  \ ID 查找视图 (Find View by Id)\n\n正如“Android 应用程序的剖析”章节概述的，构成应用程序的所有资源都被编译成名为 `R` 的类。这些资源中包含了定义布局的资源。`R`\
  \ 类中有一个名为 `layout` 的子类，它包含布局资源，包括构成用户界面的视图。大多数应用程序都需要代码与这些视图之间的交互，例如在读取输入 `EditText`\
  \ 视图的值或更改 `TextView` 显示的内容时。\n\n在 Android Studio 3.6 之前，从应用代码内部访问视图的唯一选项是编写代码通过\
  \ `findViewById()` 方法根据其 ID 手动查找视图。例如：\n\n```\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问视图的属性了。例如：\n\n```\nexampleView.setText(\"Hello\");\n```\n\n虽然通过\
  \ ID 查找视图仍然是一个可行选项，但它具有一些局限性，`findViewById()` 最大的缺点可能会获取到尚未在布局中创建的视图引用，导致在尝试访问视图属性时抛出空指针异常（null\
  \ pointer exception）。\n\n从 Android Studio 3.6 开始，可以通过视图绑定的形式提供从应用代码访问视图的替代方法。\n\n\
  ### 11.2 视图绑定 (View Binding)\n\n当应用模块中启用视图绑定时，Android Studio 会为模块内的每个布局文件自动生成绑定类（binding\
  \ class）。使用此绑定类，可以从代码内部访问布局视图，而无需使用 `findViewById()`。\n\nAndroid Studio 生成的绑定类名称基于布局文件名转换为所谓的“驼峰命名法”（camel\
  \ case），并在末尾附加“Binding”一词。例如，在 `activity_main.xml` 文件的情况下，绑定类将命名为 `ActivityMainBinding`。\n\
  \nAndroid Studio Electric Eel 在项目模板中使用视图绑定方面是不一致的。例如，我们在创建 AndroidSample 项目时使用的\
  \ Empty Activity 模板没有使用视图绑定。另一方面，Basic Activity 模板是使用视图绑定实现的。如果你使用不使用视图绑定的模板，了解如何将该项目迁移并不再使用合成属性（synthetic\
  \ properties）是非常重要的。\n\n### 11.3 转换 AndroidSample 项目\n\n在本章的剩余部分中，我们将通过将 AndroidSample\
  \ 项目转换为使用视图绑定代替使用 `findViewById()` 来练习迁移到视图绑定。\n\n首先启动 Android Studio 并打开“在 Android\
  \ Studio 中创建示例 Android 应用”章节中创建的 AndroidSample 项目。\n\n### 11.4 启用视图绑定 (Enabling\
  \ View Binding)\n\n使用视图绑定，必须对需要视图绑定的每个模块的 `build.gradle` 文件进行更改。在 AndroidSample\
  \ 项目中，这将对 `Gradle Scripts -> build.gradle (Module: AndroidSample.app)` 文件进行一个小更改。将此文件加载到编辑器，找到\
  \ `android` 部分并添加如下项以启用 `viewBinding` 属性：\n\n```\nplugins {\n  id 'com.android.application'\n\
  }\n\nandroid {\n  buildFeatures {\n    viewBinding true\n  }\n}\n```\n\n完成此更改后，点击编辑器顶部的\
  \ Sync Now 链接，然后使用 Build 菜单清理并重新构建项目，以确保生成绑定类。下一步是在代码中使用绑定类。\n\n### 11.5 使用视图绑定\
  \ (Using View Binding)\n\n此过程的第一步是“实例化”（inflate）视图绑定类，以便我们可以访问布局中的根视图。然后，该根视图将作为布局的内容视图。\n\
  \n执行这些任务的逻辑位置是在与布局关联的活动的 `onCreate()` 方法中。典型的 `onCreate()` 方法读取如下：\n\n```\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n\n\n\n要切换到视图绑定（view binding），需要导入视图绑定类并按照如下方式修改类。注意，由于布局文件名为\
  \ `activity_main.xml`，我们可以推断 Android Studio 生成的绑定类将名为 `ActivityMainBinding`。请注意，如果你在创建项目时使用了\
  \ `com.example`以外的域名，则需要更改下方的导入语句以反映这一点：\n\n```java\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n现在我们已经有了\
  \ `binding` 的引用，可以如下所示通过名称访问视图：\n\n```java\npublic void convertCurrency(View view)\
  \ {\n    EditText dollarText = findViewById(R.id.dollarText);\n    TextView textView\
  \ = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n        Float dollarValue = Float.valueOf(\n            binding.dollarText.getText().toString());\n\
  \        Float euroValue = dollarValue * 0.85F;\n        binding.textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n    } else {\n        binding.textView.setText(R.string.no_value_string);\n\
  \    }\n}\n```\n\n编译并运行应用，并验证货币转换过程是否如以前一样正常工作。\n\n### 11.6 选择选项\n\n尽管在 `Empty Activity`\
  \ 项目模板中没有采用视图绑定，但 Google 仍强烈建议尽可能使用视图绑定。事实上，对合成属性（synthetic properties）的支持现在已经被弃用，并且可能会在\
  \ Android Studio 的未来版本中被移除。因此，在开发自己的项目时，应该使用视图绑定。\n\n### 11.7 书中示例中的视图绑定\n\n书中任何依赖未实现视图绑定的项目模板的章节将首先进行迁移。然而，与其在每次需要迁移时都重复这些步骤，这些章节将引导你回到此处以重温记忆（别担心，在几个章节之后，必要的更改将变成本能）。为了帮助这一过程，接下来的部分更简洁地总结了迁移步骤。\n\
  \n### 11.8 将项目迁移到视图绑定\n\n将项目模块转换为使用视图绑定的过程涉及以下步骤：\n\n1. 在项目工具窗口中列出的 `Gradle Scripts`\
  \ -> `build.gradle (Module :app)`，编辑模块级 Gradle 构建脚本文件，其中 `<project name>` 是项目名称（例如\
  \ `AndroidSample`）。\n2. 找到文件的 `android` 部分，并添加如下条目以启用 `viewBinding` 属性：\n```gradle\n\
  android {\n    buildFeatures {\n        viewBinding true\n    }\n}\n```\n3. 点击编辑器顶部的\
  \ `Sync Now` 链接，使用这些新的构建设置重新同步项目。\n4. 编辑 `MainActivity.java` 文件并将其修改为如下内容（其中 `<reverse\
  \ domain>` 代表创建项目时使用的域名，`<project name>` 替换为项目的小写名称，例如 `androidsample`），`<binding\
  \ name>` 是对应布局资源文件的绑定类名称（例如，`activity_main.xml` 的绑定为 `ActivityMainBinding`）：\n```java\n\
  import android.view.View;\nimport com.<reverse domain>.<project name>.databinding.<binding\
  \ name>;\n\npublic class MainActivity extends AppCompatActivity {\n    private <binding\
  \ name> binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = <binding name>.inflate(getLayoutInflater());\n        View view\
  \ = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n5. 通过 `binding`\
  \ 对象的属性按名称访问视图。\n\n### 11.9 总结\n\n在 Android Studio 3.6 之前，从应用代码内部访问布局视图需要使用 `findViewById()`\
  \ 方法。现在有了视图绑定这种替代方案。视图绑定由 Android Studio 为每个 XML 布局文件自动生成的类组成。这些类包含对对应布局中每个视图的绑定，提供了比\
  \ `findViewById()` 方法更安全的选项。然而，从 Android Studio Electric Eel 版本开始，某些项目模板中默认未启用视图绑定，需要额外的步骤来在每个项目模块中手动启用并配置支持。\n\
  \n## 12. 理解 Android 应用和 Activity 生命周期周期\n\n在前面的章节中，我们已经学习了 Android 应用运行在进程中，并且它们由活动、服务和广播接收器形式的多个组件组成。本章的目标是通过查看\
  \ Android 运行时系统中应用和 Activity 的生命周期来扩展这些知识。\n\n无论对于当今移动设备与过去桌面系统相比所拥有的内存和计算能力有多么巨大的渲染，请记住，按照标准，这些设备仍然被认为是“资源受限的”。因此，系统的一项关键职责是确保有效地管理这些有限资源，并确保运行在上面的上的应用对用户保持响应。为了实现这一点，Android\
  \ 对运行应用程序的进程以及组成这些应用的单个组件的生命周期和状态具有完全控制权。\n\n因此，开发 Android 应用的一个重要因素是理解 Android\
  \ 的应用和 Activity 生命周期模型，以及应用如何应对在其执行寿命期间可能被施加的状态变化。\n\n### 12.1 Android 应用与资源管理\n\
  \n每个运行的 Android 应用都被操作系统视为一个独立的进程。如果系统识别到设备上的资源达到容量，它将采取措施终止进程以释放内存。\n\n在决定终止哪个进程以释放内存时，系统会同时考虑所有当前运行进程的优先级和状态，结合这些因素创建\
  \ Google 所述的“重要性层次”。进程将从最低优先级开始终止，并按层次向上，直到系统释放了足够的资源供其运行。\n\n### 12.2 Android 进程状态\n\
  \n进程承载应用，而应用由组件组成。在 Android 系统中，进程的当前状态由其承载应用内排名最高的活动组件定义。如图 12-1 (#Activity_Lifecycle.xhtml__idTextAnchor291)\
  \ 所示，进程在任何时刻都可以处于以下五种状态之一：\n\n#### 12.2.1 前台进程\n\n这些进程被分配了最高优先级。在任何时刻，可能只有一个或两个活跃的前台进程，这些进程通常是最后被终止的。进程必须满足以下一个或多个标准才能获得前台状态：\n\
  \n\n\n\n\n* 托管一个用户当前正在与之交互的 Activity。\n* 托管一个与用户正在交互的 Activity 连接的 Service。\n* 托管一个通过调用\
  \ `startForeground()` 表明终止将破坏用户体验的 Service。\n* 托管一个正在执行其 `onCreate()`、`onResume()`\
  \ 或 `onStart()` 回调的 Service。\n* 托管一个正在执行其 `onReceive()` 方法的广播接收器（Broadcast Receiver）。\n\
  \n#### 12.2.2 可见进程 (Visible Process)\n\n包含一个对用户可见但并非用户正在交互的 Activity 的进程被归类为“可见进程”。这通常发生在进程中的某个\
  \ Activity 对用户可见，但由于另一个 Activity（例如部分屏幕或对话框）处于前台时。如果一个进程托管了一个 `Service`，且该 `Service`\
  \ 本身绑定到一个可见或前台 Activity，那么该进程也具备可见状态。\n\n#### 12.2.3 服务进程 (Service Process)\n\n\
  包含已经启动并正在执行的 `Service` 的进程。\n\n#### 12.2.4 后台进程 (Background Process)\n\n包含一个或多个当前对用户不可见的\
  \ Activity，且不托管任何符合服务进程状态的 Service 的进程。属于此类别的进程在需要为高优先级进程释放额外内存时，极高概率会被终止。Android\
  \ 维护着后台进程的动态列表，按照时间顺序终止进程，因此最久处于前台的进程会被首先杀掉。\n\n#### 12.2.5 空进程 (Empty Process)\n\
  \n空进程不再包含任何活跃的应用程序，并保留在内存中，准备好作为新启动应用程序的托管者。这在某种程度上类似于为了等乘客到达而保持巴士车门开启并引擎运行。此类进程显然被认为优先级最低，是释放资源时第一个被杀掉的进程。\n\
  \n### 12.3 进程间依赖 (Inter-Process Dependencies)\n\n确定最高优先级进程的情况比前节概述的要稍微复杂，简单原因在于进程之间往往是相互依赖的。因此，在判定进程的优先级时，Android\
  \ 系统还会考虑该进程是否以某种方式为另一个更高优先级的进程提供服务（例如，服务进程作为前台进程的内容提供者运行）。根据基本规则，Android 文档指出，一个进程的排名永远不会低于它当前正在服务的另一个进程。\n\
  \n### 12.4 Activity 生命周期 (The Activity Lifecycle)\n\n正如我们之前确定的，Android 进程的状态很大程度上取决于它所托管的应用程序中\
  \ Activity 和组件的状态。因此，理解这些 Activity 在应用程序的执行生命周期内也会经历不同的状态非常重要。Activity 的当前状态部分取决于它在所谓的“Activity\
  \ 栈”（Activity Stack）中的位置。\n\n### 12.5 Activity 栈 (The Activity Stack)\n\n对于运行在 Android\
  \ 设备上的每个应用程序，运行时系统都维护着一个 `Activity Stack`。当应用程序启动时，第一个启动的应用程序 Activity 会被放入栈中。当启动第二个\
  \ Activity 时，它会被放置在栈顶，而上一个 Activity 则被向下推。栈顶的 Activity 被称为活跃（或运行中） Activity。当活跃\
  \ Activity 退出时，它会被运行时系统从栈中弹出，栈中紧邻其下方的 Activity 变成当前活跃 Activity。例如，栈顶的 Activity 可能会因为其负责的任务已完成而直接退出。或者，用户可能选择了屏幕上的“返回”按钮以回到到上一个\
  \ Activity，导致当前 Activity 被运行时系统从栈中弹出并被销毁。Android Activity 栈的视觉化表示见图 12-2。\n\n如图所示，新\
  \ Activity 在启动时会被推入栈顶。当前活跃 Activity 位于栈顶，直到它被新 Activity 推下移动，或者在它退出或用户导航到上一个 Activity\
  \ 时从栈中弹出。如果资源变得受限，运行时将杀死 Activity，从栈底的 Activity 开始。\n\nActivity 栈就是编程术语中所说的“后进先出”（LIFO）栈，因为最后一个推入栈的项是第一个被弹出的项。\n\
  \n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\n图 12-2\n\n###\
  \ 12.6 Activity 状态 (Activity States)\n\n在应用程序内部的执行过程中，Activity 可以处于若干不同状态之一：\n\n\
  * **活跃 / 运行中 (Active / Running)** – 该 Activity 位于 Activity 栈顶端，是设备屏幕上可见的前台任务，拥有焦点且当前正与用户交互。在资源短缺的情况下，这种\
  \ Activity 被终止的概率最低。\n* **已暂停 (Paused)** – 该 Activity 对用户可见但当前没有焦点（通常是因为该 Activity\
  \ 被当前活跃的 Activity 部分遮挡）。已暂停的 Activity 保留在内存中，保持连接到窗口管理器，保留所有状态信息，并在移动到 Activity\
  \ 栈顶端时可以快速恢复到活跃状态。\n* **已停止 (Stopped)** – 该 Activity 当前对用户不可见（换句话说，它在设备显示上被其他 Activity\
  \ 完全遮挡）。与已暂停的 Activity 一样，它保留了所有状态和成员信息，但在低内存情况下被终止的风险更高。\n* **已杀死 (Killed)** –\
  \ 该 Activity 被运行时系统终止以释放内存，不再存在于 Activity 栈中。如果应用程序需要，必须重启此类 Activity。\n\n### 12.7\
  \ 配置更改 (Configuration Changes)\n\n到本章为止，我们已经审视了导致 Android Activity 状态改变的两种原因，即 Activity\
  \ 在前台和后台之间的移动，以及运行时系统终止 Activity 以释放内存。事实上，还有第三种 Activity 状态可能发生剧变的情况，涉及设备配置的更改。\n\
  \n默认情况下，任何影响 Activity 外观的配置更改（例如在竖屏和横屏之间旋转设备，或更改系统字体设置）都会导致 Activity 被销毁并重建。这种设计的背后的逻辑是，此类更改影响了用户界面等资源，而简单地销毁并重建受影响的\
  \ Activity 是响应配置更改的最的方法。然而，也可以配置 Activity 使在响应特定配置更改时不被重启。\n\n### 12.8 处理状态更改 (Handling\
  \ State Change)\n\n即便没有其他，本章内容也应该让人明确：应用程序以及根据定义包含在其中的组件，在其生命周期内会经历许多状态。尤为重要的一点是，这些状态更改（包括完全终止）是\
  \ Android 运行时根据用户操作和设备可用资源而施加给应用程序的。\n\n\n\n\n\n在实践中，这些状态的变化并非完全在无人知情的情况下发生的。在大多数情况下，运行时系统会通知应用程序状态的变化，并为其机会做出相应的反应。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个应用程序并发运行的假象。\n\
  \nAndroid 提供了两种处理应用内对象生命周期状态变化的方法。一种方法是响应操作系统的状态更改方法调用，这将在标题为“处理 Android 状态更改”的章节中详细介绍。\n\
  \n另一种新方法（也是 Google 推荐的方法）涉及使用 Jetpack Android 架构组件包含的生命周期类，这些类在“使用 Jetpack 构建现代\
  \ Android 应用”中介绍，并在标题为“使用 Android 生命周期感知组件”的章节中进行了更详细的解释。\n\n### 12.9 总结\n\n移动设备通常被认为是资源受限的，特别是在内置内存容量方面。因此，Android\
  \ 操作系统的一个主要职责是确保应用程序以及整个操作系统对用户保持响应能力。\n\n应用程序托管在 Android 的进程中。每个应用程序反过来是由活动（activities）和`Services`形式的组件组成的。\n\
  \nAndroid 运行时系统有权终止进程和单个活动以释放内存。运行时系统在决定一个进程是否是终止的合适候选者时，会考虑进程状态。进程的状态在很大程度上取决于该进程托管的活动的状态。\n\
  \n本章的核心信息是，应用程序在它的执行生命周期内会经历各种状态，并且对其在 Android 运行时环境中的命运控制力微乎其微。那些不直接与用户交互的进程和活动被运行时系统终止的风险更高。因此，Android\
  \ 应用开发的一个要素要素是应用程序具备响应操作系统状态更改通知的能力。\n\n# 13 处理 Android 活动状态更改\n\n根据标题为“理解 Android\
  \ 应用和活动生命周期”的章节概述的信息，显而易见，构成应用程序的活动和片段（fragments）在应用程序生命周期期间会经历各种不同的状态。从一个状态到另一个状态的变化是由\
  \ Android 运行时系统强制的，因此在很大程度上超出了活动本身的控制。然而，这并不意味着应用无法对这些变化做出反应并采取适当行动。\n\n本章的主要目的是提供关于活动如何被通知状态更改的高级概述，并概述建议保存或恢复状态信息的区域。在涵盖这些信息后，本章将简要触及活动生命周期的话题。\n\
  \n### 13.1 新旧生命周期技术\n\n直到最近，有一种标准方法可以在应用中构建生命周期感知能力。这就是本章所涵盖的方法，它涉及在活动或片段实例内部实现一组方法（每个生命周期状态对应一个），这些方法会在该对象的生命周期状态更改时由操作系统调用。自\
  \ Android 操作系统的早期以来，这种方法一直没有发生变化，虽然它在今天仍然是一个可行的选项，但它确实有一些局限性，这些局限将在本章的稍后部分进行解释。\n\
  \n随着 Jetpack Android 架构组件引入了生命周期类，现在有了了更好的生命周期处理方法。这种现代的生命周期管理方法（结合 Jetpack 组件和架构指南）将在随后的章节中详细介绍。然而，出于几个原因，理解传统的生命周期方法仍然很重要。首先，作为一名\
  \ Android 开发者，你无法完全隔绝于传统的生命周期方法之外，并且仍然会使用其中一些。更重要的是，理解处理生命周期的旧方法将为在书后部分开始学习新方法提供良好的知识基础。\n\
  \n### 13.2 Activity 和 Fragment 类\n\n在极少数例外，应用程序中的活动和片段分别被创建为 Android `AppCompatActivity`\
  \ 类和 `Fragment` 类的子类。\n\n例如，考虑在“在 Android Studio 中创建 Android 示例应用”中创建并随后转换为使用视图绑定（view\
  \ binding）的 AndroidSample 项目。将此项目加载到 Android Studio 环境中，并找到 `MainActivity.java`\
  \ 文件（位于 `app -> java -> <your domain> -> androidsample`）。找到文件后，双击它将其加载到编辑器中，其内容应如下所示：\n\
  \n```java\npackage com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.view.View;\n\nimport android.os.Bundle;\n\nimport java.util.Locale;\n\
  \nimport com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
  \    public void convertCurrency(View view) {\n        if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n            float dollarValue = Float.parseFloat(\n                    binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(\n\
  \                    String.format(Locale.ENGLISH,\"%f\", euroValue));\n       \
  \ } else {\n            binding.textView.setText(R.string.no_value);\n        }\n\
  \    }\n}\n```\n\n当创建项目时，我们指示 Android Studio 创建了一个名为 `MainActivity` 的初始活动。从上述代码可以看出，`MainActivity`\
  \ 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity` 类的参考文档发现它本身是 `FragmentActivity`\
  \ 类的子类，而后者最终是 `Activity` 类的子类。你可以在 Android Studio 编辑器中使用层次结构窗口（Hierarchy window）验证这一点。将\
  \ `MainActivity.java` 文件加载到编辑器后，点击类声明行中的 `AppCompatActivity` 并按下快捷键 `Ctrl-H`。层次结构窗口随后出现，显示所选类的层次结构。如图\
  \ 13-1](#Activity_State_Changes.xhtml__idTextAnchor308）所示，`AppCompatActivity` 显然继承自\
  \ `FragmentActivity` 类，而后者最终继承自 `Activity` 类：\n\n![](img/as_3.6_class_heirachy.jpg)\n\
  \n图 13-1\n\n```\n\n    `Activity` 和 `Fragment` 类包含一系列方法，旨在由 Android 运行时在对象状态更改时调用以通知对象。在本章中，我们将这些方法称为生命周期方法。活动或片段类只需要重写这些方法并在其内部实现必要的功能，以便对状态更改做出相应反应。\n\
  \n\n\n\n\n其中一种方法命名为 `onCreate()`，再次回到上面的代码段，我们可以看到该方法已经在 `MainActivity` 类中为我们重写并实现。。在随后的章节中，我们将详细探索\
  \ `onCreate()` 以及 `Activity` 和 `Fragment` 类中其他相关的生命周期方法。\n\n### 13.3 动态状态与 持久化状态\n\
  \n生命周期管理的核心目标之一是确保 activity 的状态在适当的时间保存并恢复。在此语境下，我们所说的状态是指当前在 activity 中保存的数据以及用户界面的外观。例如，activity\
  \ 可能在内存中维护一个数据模型，该模型需要被保存到数据库、内容提供程序或文件中。这种状态信息由于它从一次应用程序调用到另一次调用都持续存在，因此被称为**持久化状态**（persistent\
  \ state）。\n\n用户界面的外观（例如输入到文本框但尚未提交到应用程序内部数据模型的文本）被称为**动态状态**（dynamic state），因为它通常只在应用程序的单次调用期间保留（也称为用户界面状态或实例状态）。\n\
  \n理解这两种状态之间的区别非常重要，因为它们的保存方式以及保存的原因都是不同的。\n\n保存持久化状态的目的是避免由于 activity 在后台被运行时系统杀死而导致的数据丢失。另一方面，动态状态的保存和恢复的原因稍微复杂一些。\n\
  \n例如，假设应用程序包含一个 activity（我们将其称为 `Activity A`），其中包含一个文本框和一些单选按钮。在使用应用程序的过程中，用户在文本框中输入了某些文本并从单选按钮中进行了选择。但在执行保存这些更改的操作之前，用户切换到了另一个\
  \ activity，导致 `Activity A` 被推入 Activity 栈并置于后台。一段时间后，运行时系统确定内存不足，因此杀杀了 `Activity\
  \ A` 以释放资源。然而，对于用户来说，`Activity A` 仅仅是停放在了后台，并准备好随时移动到前台。当 `Activity A` 回到前台时，用户会理所当然地期望输入的文本和单选按钮的选择已被保留。然而在这种情况下，将创建一个新的\
  \ `Activity A` 实例，如果动态状态没有被保存和恢复，之前的用户输入就会丢失。\n\n因此，保存动态状态的主要目的是提供一种在在前台和后台 activity\
  \ 之间无缝切换的感知，无论活动实际上可能在用户不知情的情况下被杀死并重启。\n\n保存持久化状态和动态状态的机制将在本章的后续章节中变得更加清晰。\n\n###\
  \ 13.4 Android 生命周期周期方法\n\n如之前所述，`Activity` 和 `Fragment` 类包含许多生命周期方法，这些方法在实例状态发生时充当事件处理器。Android\
  \ `Activity` 和 `Fragment` 类支持的主要方法如下：\n\n- `onCreate(Bundle savedInstanceState)`\
  \ – 当 activity 首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个 `Bundle` 对象形式的参数，该对象可能包含来自 activity\
  \ 之前调用的动态状态信息（通常与用户界面的状态有关）。\n- `onRestart()` – 当 activity 在之前被运行时系统停止后准备重启时调用。\n\
  - `onStart()` – 始终在调用 `onCreate()` 或 `onRestart()` 方法后立即调用，此方法指示 activity 它即将对用户可见。如果\
  \ activity 移动到 activity 栈的顶端，此调用之后将调用 `onResume()`；如果被另一个 activity 推入栈中，则调用 `onStop()`。\n\
  - `onResume()` – 表示 activity 现在处于 activity 栈的顶端，并且是用户当前正在交互的 activity。\n- `onPause()`\
  \ – 表示上一个 activity 即将成为前台 activity。取决于 activity 是移回前台还是对用户不可，此调用之后将调用 `onResume()`\
  \ 或 `onStop()` 方法。在此方法中可以采取措施存储应用尚未保存的持久化状态信息。为了避免切换 activity 时的延迟，应避免在此方法中执行耗时操作，如将数据存储到数据库或执行网络操作。此方法还应确保停止任何动画密集型任务。\n\
  - `onStop()` – activity 现在对用户不再可见。此调用之后可能出现两种场景：如果 activity 再次移动到前台，则调用 `onRestart()`；如果\
  \ activity 正被终止，则调用 `onDestroy()`。\n- `onDestroy()` – activity 即将被销毁，可能是因为 activity\
  \ 完成了任务并调用了 `finish()` 方法（主动），也因为运行时为了释放内存或由于配置更改（如设备方向改变）而终止它。需要注意的是，当 activity\
  \ 终止时并不总是会调用 `onDestroy()`。\n- `onConfigurationChanged()` – 当发生配置更改且该 activity 已指示不重启时调用。该方法传递一个\
  \ `Configuration` 对象，概述了新的设备配置，然后由 activity 负责对更改做出反应。\n\n以下生命周期方法仅适用于 `Fragment`\
  \ 类：\n\n- `onAttach()` - 当 fragment 分配给一个 activity 时调用。\n- `onCreateView()` - 用于创建并返回\
  \ fragment 的用户界面布局视图层级。\n- `onViewCreated()` - 在 `onCreateView()` 返回后调用。\n- `onViewRestored()`\
  \ - fragment 已保存的视图层级已恢复。\n\n除了上述生命周期方法外，还有两个专门用于保存和恢复 activity 动态状态的方法：\n\n- `onRestoreInstanceState(Bundle\
  \ savedInstanceState)` – 当 activity 从之前保存状态的调用重启时，在调用 `onStart()` 方法之后立即调用。与 `onCreate()`一样，该方法接收一个包含之前数据的\
  \ `Bundle` 对象。此方法通常用于在 `onCreate()` 和 `onStart()` 完成 activity 初始化后恢复之前的状态的情况。\n\
  - `onSaveInstanceState(Bundle outState)` – 在 activity 销毁之前调用，以便保存当前的动态状态（通常与用户界面有关）。该方法接收一个应将状态保存的\
  \ `Bundle` 对象，并在 activity 重启时将该状态传递给 `onCreate()` 和 `onRestoreInstanceState()` 方法。请注意，只有在运行时确定需要保存动态状态时，才会调用此方法。\n\
  \n在重写上述方法时，必须记住，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法实现必须包含对父类对应方法的调用。例如，以下方法重写了\
  \ `onRestart()` 方法，但也包含了对父类实例方法的调用：\n\n```java\nprotected void onRestart() {\n \
  \   super.onRestart();\n}\n```\n\n\n\n\n\n```java\nLog.i(TAG, \"onRestart\");\n\n\
  }\n```\n\n如果在重写的方法中未能调用此父类方法，会导致运行时在执行期间抛出异常。虽然在 `onRestoreInstanceState()` 和 `onSaveInstanceState()`\
  \ 方法中调用父类是可选的（例如，在实现自定义的保存和恢复行为时可以省略它们），但使用这些方法有许多益处，这一主题将在名为保存和恢复 Android Activity\
  \ 状态的章节中介绍。\n\n### 13.5 生命周期 (Lifetimes)\n\n最后一个要涵盖的主题是涉及活动或片段（fragment）在执行过程中经历的整个、可见和前台生命周期概述：\n\
  \n*   **整个生命周期 (Entire Lifetime)**：“整个生命周期”一词用于描述从初始调用 `onCreate()` 方法到对象终止前调用 `onDestroy()`\
  \ 之间发生的所有活动。\n*   **可见生命周期 (Visible Lifetime)** 涵盖了从调用 `onStart()` 到 `onStop()`\
  \ 之间的执行期间。在此期间，活动或片段对用户是可见的，但可能不是用户正在交互的对象。\n*   **前台生命周期 (Foreground Lifetime)**\
  \ 指调用 `onResume()` 和 `onPause()` 方法之间的执行期间。\n\n需要注意的是，活动或片段在整个生命周期期间可能会多次通过前台和可见生命周期。\n\
  \n生命周期和生命周期方法的概念在图 13-2 中所示：\n\n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\
  \n图 13-2\n\n## 13.6 折叠屏设备与多恢复 (Foldable Devices and Multi-Resume)\n\n如前所述，当活动移动到前台并成为用户当前正在交互的活动时，该活动被认为处于恢复状态。在标准设备上，应用程序在任何时间只能有一个活动处于恢复状态，所有其他活动都可能处于暂停或停止状态。\n\
  \n一段时间以来，Android 一直包含了多窗口支持，允许多个活动同时在分屏或自由窗口配置中出现。虽然此功能最初主要用于大屏幕平板设备，但随着折叠屏设备的引入，这一功能可能会变得更加流行。\n\
  \n在运行 Android 10 且启用了多窗口支持的设备上（大多数折叠屏设备也是如此），多个应用活动可能同时处于恢复状态（这种概念被称为“多恢复”），允许这些可见的活动继续运行（例如流流媒体内容或更新视觉数据），即使当前另一个活动拥有焦点。尽管多个活动可以处于恢复状态，但这些活动中只有一个会被视为**最顶层恢复活动**（换句话说，就是用户最近交互的活动）。\n\
  \n活动可以通过实现 `onTopResumedActivityChanged()` 回调方法来接收获得或丢失顶层恢复状态的通知。\n\n## 13.7 禁用配置更改重启\
  \ (Disabling Configuration Change Restarts)\n\n如之前概述，活动可以指示在发生某些配置更改时不重新启动。这是通过在项目清单文件（manifest\
  \ file）的活动元素中添加 `android:configChanges` 指令实现的。例如，下面的清单文件片段表明在发生方向或设备全局字体大小相关的配置更改时，不应重启活动：\n\
  \n```xml\n<activity android:name=\".MainActivity\"\n          android:configChanges=\"\
  orientation|fontScale\"\n          android:label=\"@string/app_name\">\n```\n\n\
  ## 13.8 生命周期方法的局限性 (Lifecycle Method Limitations)\n\n如本章开头所述，生命周期方法已经使用了多年，直到最近，它们仍然处理活动和片段生命周期状态变化的唯一机制。然而，这种方法也存在缺点。\n\
  \n生命周期方法的一个问题是，它们没有为活动或片段提供一种在应用执行期间任何一点轻松发现其当前生命周期状态的方法。相反，对象需要在内部跟踪状态，或者等待下一次生命周期方法的调用。\n\
  \n此外，方法没有提供一种简单的方法让一个对象观察应用内其他对象的生命周期状态变化。这是一个严重的考虑因素，因为应用中的许多其他对象都可能受到特定活动或片段中生命周期状态变化的影响。\n\
  \n生命周期方法仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建真正感知生命（lifecycle aware）的自定义类。\n\
  \n最后，生命周期方法导致大多数生命周期处理代码被写在活动或片段内部，这可能导致代码复杂且易出错。理想情况下，这些代码的大部分应该位于受状态变化影响的其他类中。例如，一个流媒体视频的应用可能会包含一个专门用于管理输入流的类。如果应用需要在主活动停止时暂停流，那么执行该操作的代码应该位于流类中，而不是主活动中。\n\
  \n所有这些问题以及更多问题通过使用感知生命组件（lifecycle-aware components）得到了解决，该主题将在名为 Jetpack 现代 Android\
  \ 应用架构的章节开始介绍。\n\n## 13.9 总结 (Summary)\n\n所有活动都派自 `Android Activity` 类，该类包含许多生命周期方法，这些方法旨在运行时系统在活动状态更改时调用。同样，`Fragment`\
  \ 类包含许多类似的方法。通过重写这些方法，活动和片段可以响应状态变化，并在必要时采取措施保存并恢复活动以及应用程序的当前状态。生命周期状态可以被认为有两种形式。持久状态是指在应用程序调用之间需要存储的数据（例如存储到文件或数据库）。而动态状态则与用户界面的当前外观有关。\n\
  \n尽管生命周期方法有很多局限性，通过使用感知生命周期组件可以避免，但理解这些方法对于充分理解书中后面介绍的生命周期管理新方法非常重要。\n\n## 14. 示例\
  \ Android Activity 状态变化 (Android Activity State Changes by Example)\n\n前面的章节详细讨论了构成\
  \ Android 应用程序的活动的不同状态和生命周期。在本章中，我们将通过创建一个示例应用程序，将处理活动状态变化的理论付诸实践。该示例应用程序的目的是为活动在\
  \ Android 运行时通过各种不同状态的过程提供真实世界的演示。在下一章（名为保存和恢复 Android Activity 状态的章节中，在本章构建的示例项目将得到扩展，以演示动态活动状态的保存和恢复。\n\
  \n### 14.1 创建状态变化示例项目\n\n\n\n\n\n本次练习的第一步是创建一个新项目。首先启动 Android Studio，如有必要，使用 `File\
  \ -> Close Project` 菜单选项关闭任何当前打开的项目，以便显示欢迎界面。\n\n在欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前，选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `StateChange`，并指定 `com.ebookfrenzy.statechange`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。项目创建完成后，`StateChange` 项目将列在位于 Android Studio 主窗口左侧的 `Project`\
  \ 工具窗口中。请按照第 11.8 迁移项目到 View Binding 节概述的步骤将项目转换为使用 view binding。\n\n接下来的操作涉及设计\
  \ activity 的用户界面。该界面存储在名为 `activity_main.xml` 的文件中，该文件应该已经加载到 `Layout Editor` 工具中。如果没有加载，请在\
  \ `Project` 工具窗口中导航到它，可以在 `app -> res -> layout` 文件夹找到它。找到后，双击该文件即可将其加载到 Android\
  \ Studio 的 `Layout Editor` 工具。\n\n![](img/as_4.2_statechange_layout_editor.jpg)\n\
  \n图 14-1\n\n### 14.2 设计用户界面\n\n当用户界面布局加载到 `Layout Editor` 工具后，现在是时候为示例应用程序设计用户界面了。用户界面设计中目前有一个“Hello\
  \ World!” `TextView`，但 activity 实际上需要一个 `EditText` 视图。在 Layout Editor 画布上选择 `TextView`\
  \ 对象，按下键盘上的 `Delete` 键将其从设计中删除。\n\n从 `Layout Editor` 左侧的 `Palette` 中，选择 `Text` 类别，从文本组件列表中点击并拖动\
  \ `Plain Text` 组件到设备屏幕的视觉表示上。将组件移动到显示中心，直到出现中心引导线，然后将其放置就位，使布局类似于图 14-2。\n\n![](img/as_3.6_state_change_ui.jpg)\n\
  \n图 14-2\n\n使用 `EditText` 小部件时，有必要为视图指定 `input type`。这简单地定义了用户输入的文本或数据类型。例如，如果 input\
  \ type 设置为 `Phone`，用户将仅限制在视图中输入数字。或者，如果 input type 设置为 `TextCapCharacters`，输入将默认为大写字母。input\
  \ type 设置也可以组合使用。\n\n出于本示例的考虑，我们将 input type 设置为支持普通文本输入。为此，选择布局中的 `EditText` 小部件，并在\
  \ `Attributes` 工具窗口中找到 `inputType` 条目。点击当前设置左侧的标志图标以打开选项列表，在列表中关闭 `textPersonName`\
  \ 并启用 `text`，然后点击 `Apply` 按钮。继续留在 `Attributes` 工具窗口中，将视图的 `id` 更改为 `editText`，并点击弹出对话框中的\
  \ `Refactor` 按钮。\n\n默认情况下，`EditText` 显示内容为“Name”的文本。留在 `Attributes` 面板中，从 `text`\
  \ 属性字段中删除此内容，使视图在布局中保持空白。\n\n在继续之前，点击布局编辑器工具栏上的 `Infer Constraints` 按钮以添加任何缺失的约束。\n\
  \n## 14.3 重写 Activity 生命周期周期方法\n\n此时，项目包含一个名为 `MainActivity` 的单一 activity，它派自 `AppCompatActivity`\
  \ 类。该 activity 的源代码包含在 `MainActivity.java` 文件中，该文件已经在编辑器会话中打开，并在编辑器标签栏中由标签页表示。如果文件不再打开，请在\
  \ `Project` 工具窗口面板中导航到它（`app -> java -> com.ebookfrenzy.statechange -> MainActivity`）并双击它将文件加载到编辑器。\n\
  \n到为止，activity 重写的唯一周期方法是 `onCreate()` 方法，该方法已实现为在设置 activity 的用户界面之前调用 `super`\
  \ 类实例的方法。现在我们将修改此方法，使其在每次执行时都能在 Android Studio 的 `Logcat` 面板中输出一条诊断消息。为此，我们将使用 `Log`\
  \ 类，这要求导入 `android.util.Log` 并声明一个 `tag`，以便我们能够在日志输出中过滤这些消息：\n\n```java\npackage\
  \ com.ebookfrenzy.statechange;\n\nimport android.util.Log;\nimport androidx.annotation.NonNull;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private static final String TAG\
  \ = \"StateChange\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Log.i(TAG, \"onCreate\");\n    }\n}\n```\n\n下一个任务是重写一些方法，每个方法都有相应的日志调用。这些重写方法可以手动添加，也可以使用\
  \ Android 代码编辑器 {\n    super.onStart();\n    Log.i(TAG, \"onStart\");\n}\n\n@Override\n\
  protected void onResume() {\n    super.onResume();\n    Log.i(TAG, \"onResume\"\
  );\n}\n\n@Override\nprotected void onPause() {\n    super.onPause();\n    Log.i(TAG,\
  \ \"onPause\");\n}\n\n@Override\nprotected void onStop() {\n    super.onStop();\n\
  \    Log.i(TAG, \"onStop\");\n}\n\n@Override\nprotected void onRestart() {\n   \
  \ super.onRestart();\n    Log.i(TAG, \"onRestart\");\n}\n\n@Override\nprotected\
  \ void onDestroy() {\n    super.onDestroy();\n    Log.i(TAG, \"onDestroy\");\n}\n\
  \n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState) {\n  \
  \  super.onSaveInstanceState(outState);\n    Log.i(TAG, \"onSaveInstanceState\"\
  );\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n}\n```\n\n## 14.4 过滤 Logcat 面板\n\n添加到 `MainActivity.java` 重写方法中的代码目的是将日志信息输出到\
  \ `Logcat` 工具窗口。此输出可以配置显示与设备或模拟器会话相关的所有事件，也可以限制为仅显示与当前选择的应用相关的事件。输出还可以进一步限制为仅匹配指定过滤器的日志事件。\n\
  \n当在当前应用程序运行时显示，`Logcat` 工具窗口将如下方的图 14-3 所示：\n\n![](img/as_logcat_tool_window.jpg)\n\
  \n图 14-3\n\n\n\n\n上图中标记为 A 的菜单允许你选择显示日志输出的设备或模拟器。此输出出现在标记为 C 的输出面板中。通过在标记为 B 的字段中输入选项可以对日志输出进行过滤。默认设置\
  \ `package:mine` 将输出限制为由当前应用包生成的日志消息（在此例中 `com.ebookfrenzy.statechange`）。将此字段留空将允许显示所选设备或模拟器的日志输出，包括操作系统生成的诊断消息。也可以组合多个键来进一步过滤输出。例如，我们可以如下配置\
  \ Logcat 面板，仅显示与我们的 StateChange 标签相关的消息：\n\n```\npackage:mine tag:StateChange\n\
  ```\n\n我们还可以通过在键前加一个负号（-）来排除输出。除了 StateChange 标签外，我们可能还有使用名为“OtherTag”的不同标签的诊断消息。为了过滤日志以排除第二个标签的输出，我们可以输入以下键选项：\n\
  \n```\npackage:mine tag:StateChange -tag:OtherTag\n```\n\n除了你自己的标签值外，还可以从 Android\
  \ 内置的一系列预定义诊断标签中进行选择。当你向过滤器字段输入内容时，Logcat 将显示匹配的标签列表，如图 14-4 所示：\n\n![](img/as_logcat_tool_window_tags.jpg)\n\
  \n图 14-4\n\nlevel 键可用于根据严重程度控制显示哪些消息。要过滤掉错误消息以外的所有消息，将使用以下键：\n\n```\nlevel:error\n\
  ```\n\n除了 error 外，Logcat 面板还支持 verbose、info、warn 和 assert 级别设置。\n\nLogcat 还支持多个日志面板，每个面板都有自己的过滤设置。要添加另一个面板，请点击上方图\
  \ 14-3 中标记为 D 的 + 按钮。使用相应的标签在不同面板之间切换，或通过右键点击当前显示的面板并选择 `Split-Right`（向右拆分）或 `Split-Down`（向下拆分）菜单选项来水平或垂直排列面板。要重命名面板，右键点击标签并选择\
  \ `Rename Tab`（重命名标签）选项。在继续之前，关闭除一个以外的所有 Logcat 面板并按如下配置过滤器：\n\n```\npackage:mine\
  \ tag:StateChange\n```\n\n## 14.5 运行应用程序\n\n为了获得最佳结果，应在物理 Android 设备或模拟器上运行应用程序。在设备配置并连接到开发计算机后，点击\
  \ Android Studio 工具栏中绿色三角形所示的运行按钮，如下方的图 14-5 所示，选择 `Run -> Run…` 菜单选项或使用快捷键 `Shift+F10`：\n\
  \n![](img/as_run_button1.jpg)\n\n图 14-5\n\n如果出现 `Choose Device` 对话框，请从中选择物理 Android\
  \ 设备或模拟器（假设你尚未将其配置为默认目标）。在 Android Studio 构建应用并将其安装到设备上后，它应该启动并在前台运行。\n\n查看 Logcat\
  \ 面板可以指示哪些方法到目前已被触发：\n\n![](img/as_logcat_statechange_output.jpg)\n\n图 14-6\n\n\
  ## 14.6 实验 Activity\n\n随着诊断功能正常工作，现在是时候通过运行应用程序来理解活动生命周期状态的变化了。首先，考虑 Logcat 面板中的初始日志事件序列：\n\
  \n```\nonCreate\nonStart\nonResume\n```\n\n显然，初始状态的变化与“理解 Android 应用程序和 Activity\
  \ 生命周期”中概述的完全一致。但请注意，并没有调用 `onRestoreInstanceState()`，因为 Android 运行时检测到在这种情况下没有可以恢复的状态。\n\
  \n点击设备显示器底部状态栏上的 Home 图标，并注意日志中报告的方法调用序列如下：\n\n```\nonPause\nonStop\nonSaveInstanceState\n\
  ```\n\n在这种情况下，运行时注意到活动已不再处于前台，对用户不可见并且已停止该活动，但并不是没有为活动提供保存动态状态的机会。取决于运行时最终是销毁了活动还是简单地重新启动了它，活动将将通过调用\
  \ `onRestart()` 被通知其已重启，或者当用户返回活动时将再次经历创建序列。\n\n如“理解 Android 应用程序和 Activity 生命周期”中概述的，活动的销毁和重建可以通过对设备进行配置更改来触发，例如从竖屏旋转到横屏。要看到这一操作，只需在\
  \ StateChange 处于前台时旋转设备即可。使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。这显示在设备或模拟器的屏幕底部，如图\
  \ 14-7 所示：\n\n![](img/as_4.1_rotate_screen_button.jpg)\n\n图 14-7\n\n日志中产生的方法调用序列应如下：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统在活动被销毁和重启之前给了它保存状态的机会。\n\n## 14.7 总结\n\n“一画胜千言”的古语在学习新范式的示例中同样适用。在本章中，我们创建了一个示例应用程序，旨在演示不同的生命周期状态。在本章的开发过程中，我们还查看了从活动内部生成诊断信息的机制。\n\
  \n## 15. 保存和恢复 Android Activity 的状态\n\n如果之前的几个章节已经实现了目标，现在对于保存和恢复用户界面状态的重要性应该更清晰了。在本章中，我们将扩展在通过示例活动状态变化中创建的应用程序，以演示活动被运行时系统销毁和重建时涉及的步骤。\n\
  \n保存和恢复动态状态的关键部分是使用 Android SDK 中的 `Bundle` 类，该主题在本章中也会涉及。\n\n### 15.1 保存动态状态\n\n\
  正如我们已经学的，活动通过运行时系统调用活动实现的 `onSaveInstanceState()` 方法获得了保存动态状态信息的机会。作为参数传递给方法的是一个\
  \ `Bundle` 对象的引用，该方法需要向该对象存储需要保存的任何动态数据。该 `Bundle` 对象由运行时代表活动进行存储，并在当调用 `onCreate()`\
  \ 和 `onRestoreInstanceState()` 方法时，作为参数传递给这些方法。随后，可以在这些方法中从 `Bundle` 对象中检索数据并用于恢复活动的状态。\n\
  \n### 15.2 用户界面状态的默认保存\n\n\n\n\n在上一章中，`StateChange` 示例程序的诊断输出显示，当运行该程序的设备旋转足够角度以触发方向变化时，一个\
  \ activity 会经历多次状态更改。\n\n再次启动 `StateChange` 应用程序，并在执行设备旋转之前向 `EditText` 字段中输入一些文本（在运行\
  \ Android 9 或更高版本的设备或模拟器上，可能需要点击状态栏中的旋转按钮来完成旋转）。旋转设备后，`Logcat` 窗口中将出现以下状态更改序列：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，这导致了 activity 的销毁和重建。然而，通过检查运行中应用程序的用户界面，可以发现输入到 `EditText`\
  \ 字段中的文本被保留了。鉴于 activity 被销毁并重建了，而且我们没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\n事实上，Android\
  \ SDK 包含的大多数视图控件（view widgets）已经实现了在 activity 重启时自动保存和恢复状态所需的行为。启用此行为的唯一要求是：activity\
  \ 中的 `onSaveInstanceState()` 和 `onRestoreInstanceState()` 覆盖方法必须包含对父类等效方法的调用：\n\n\
  ```java\n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState)\
  \ {\n    super.onSaveInstanceState(outState);\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  }\n```\n\n在 XML 布局文件中，通过将 `android:saveEnabled` 属性设置为 `false` 可以禁用用户界面视图的自动状态保存。为了示例，我们将禁用用户界面布局中\
  \ `EditText` 视图的自动状态保存机制，然后向应用程序添加代码以手动保存和恢复视图的状态。\n\n要配置 `EditText` 视图，使其在 activity\
  \ 重启时不保存和恢复状态，请编辑 `activity_main.xml` 文件，使该视图的条目如下（注意，可以通过点击 Layout Editor 面板底部的\
  \ Text 标签页直接编辑 XML）：\n\n```xml\n<EditText\n    android:id=\"@+id/editText\"\n  \
  \  android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:ems=\"10\"\n    android:inputType=\"text\"\n    android:saveEnabled=\"\
  false\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n做出更改后，运行应用程序，输入文本并旋转设备，以验证文本不再被保存和恢复。\n\n### 15.3 Bundle 类\n\
  \n对于需要超出用户界面视图组件提供的默认功能保存状态的情况，`Bundle` 类提供了一个容器，使用键值对（key-value pair）机制存储数据。键的形式为字符串值，而与键关联的值可以是原始类型值，也可以实现\
  \ `Android Parcelable` 接口的任何对象。已经有大量类实现了 `Parcelable` 接口。通过实现 `Parcelable` 接口中定义的一组方法，可以将自定义类变为“可序列化的”（parcelable），详情可以在\
  \ Android 文档中找到：`https://developer.android.com/reference/android/os/Parcelable.html`\n\
  \n`Bundle` 类还包含一组方法，用于获取和设置各种数据类型的键值对，包括原始类型（包括 `Boolean`、`char`、`double` 和 `float`\
  \ 值）和对象（如 `Strings` 和 `CharSequence`）。\n\n为了本示例，并且已经禁用了 `EditText` 视图的文本自动保存，我们需要确保用户输入到\
  \ `EditText` 字段的文本被保存到 `Bundle` 对象中并随后恢复。这将演示如何在 Android 应用程序中手动保存和恢复状态，并将分别使用 `Bundle`\
  \ 类的 `putCharSequence()` 和 `getCharSequence()` 方法来实现。\n\n### 15.4 保存状态\n\n扩展 `StateChange`\
  \ 应用程序的第一步是确保在 `MainActivity` activity 的 `onSaveInstanceState()` 方法中从 `EditText`\
  \ 组件中提取用户输入的文本，然后将其作为键值对保存到 `Bundle` 对象中。\n\n要从 `EditText` 对象中提取文本，我们首先需要在用户界面中识别该对象。显然，这涉及到连接\
  \ activity 的 Java 代码（包含在 `MainActivity.java` 源代码文件中）与用户界面的 XML 表示（包含在 `activity_main.xml`\
  \ 资源文件中）之间的鸿沟。为了提取输入到 `EditText` 组件的文本，我们需要访问该用户界面对象的权限。\n\n用户界面中的每个组件都关联有一个唯一的标识符。默认情况下，Layout\
  \ Editor 工具根据对象类型为新添加的组件构建 `id`。如果布局中包含多个相同类型的视图，则类型名称后面会跟一个顺序数字（尽管开发者可以且应该将其更改为更有意义的内容）。正如在\
  \ Android Studio 主窗口中选择 `activity_main.xml` 时检查 Component Tree 面板所示，`EditText` 组件已被分配了\
  \ `id`：\n\n（image/as_4.1_state_change）图 15-1\n\n现在我们可以通过对象的 `getText()` 方法获取 `editText`\
  \ 包含的文本：\n\n```java\nCharSequence userText = binding.editText.getText();\n```\n\n\
  最后，我们使用 `Bundle` 对象的 `putCharSequence()` 方法保存文本，传递键（可以是字符串，在本例中我们定义为 `savedText`）和\
  \ `userText` 对象作为参数：\n\n```java\noutState.putCharSequence(\"savedText\", userText);\n\
  ```\n\n将这一切整合在一起，我们在 `MainActivity.java` 文件中的 `onSaveInstanceState()` 方法如下：\n\n\
  ```java\npackage com.ebookrenzy.statechange;\n\n...\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n...\n    @Override\n    protected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n        super.onSaveInstanceState(outState);\n        Log.i(TAG,\
  \ \"onSaveInstanceState\");\n        CharSequence userText = binding.editText.getText();\n\
  \        outState.putCharSequence(\"savedText\", userText);\n    }\n...\n}\n```\n\
  \n### 15.5 恢复状态\n\n保存的动态状态可以在传递 `Bundle` 对象作为参数的生命周期方法中恢复。这让开发者可以选择 `onCreate()`\
  \ 或 `onRestoreInstanceState()`。使用哪种方法取决于 activity 的性质。在 activity 初始化任务完成后最好恢复状态的情况下，`onRestoreInstanceState()`\
  \ 方法通常更合适。为了示例，我们将在 `onRestoreInstanceState()` 方法中添加代码，使用 `savedText` 键从 `Bundle`\
  \ 中提取保存的状态。然后可以使用对象的 `setText()` 方法将文本显示在 `editText` 组件上：\n\n```java\n@Override\n\
  protected void onRestoreInstanceState(@NonNull Bundle savedInstanceState) {\n  \
  \  super.onRestoreInstanceState(savedInstanceState);\n}\n```\n\n\n\n\n```java\n\
  Log.i(TAG, \"onRestoreInstanceState\");\n\nCharSequence userText =\n    savedInstanceState.getCharSequence(\"\
  savedText\");\n\nbinding.editText.setText(userText);\n}\n```\n\n## 15.6 测试应用\n\n\
  剩下的工作就是再次构建并运行 `StateChange` 应用。在运行并处于前台状态时，触摸 `EditText` 组件，并在旋转设备到另一个方向之前输入一些文本。之前文本的更改会丢失，但现在得益于我们在本章中为\
  \ activity 添加了代码，新文本将保留在 `editText` 组件中。\n\n在验证代码执行符合预期后，注释掉这两个方法中的 `super.onSaveInstanceState()`\
  \ 和 `super.onRestoreInstanceState()` 调用，重新启动应用，你会发现设备旋转设备后文本仍然被保留。默认的保存和恢复系统本质上被自定义实现所取代，从而提供了一种在\
  \ activity 内部动态且选择性保存和恢复状态的方法。\n\n## 15.7 总结\n\n在 Android 应用中保存和恢复动态状态，只需在适当的生命周期方法中实现适当的代码。对于大多数用户界面视图，这由\
  \ `Activity` 超类自动处理。在其他情况下，这通常包括在 `onSaveInstanceState()` 方法中提取值和设置，并将数据以键值对的形式保存在运行时传递给\
  \ activity 的 `Bundle` 对象中。\n\n可以在 activity 的 `onCreate()` 或 `onRestoreInstanceState()`\
  \ 方法中通过从 `Bundle` 对象提取值并根据存储的值更新 activity 来恢复状态。\n\n在本章中，我们使用了这些技术更新了 `StateChange`\
  \ 项目，使 `Activity` 能够在销毁及随后的重建过程中保留更改。\n\n## 16 理解 Android Views、View Groups 和 Layouts\n\
  \n除了听流媒体音频外，用户与 Android 设备的交互本质上主要是视觉和触觉性质的。所有这些交互都通过设备上安装的应用的用户界面进行，包括内置应用和用户安装的任何第三方应用。因此，开发\
  \ Android 应用的一个关键要素涉及用户界面的设计和创建，这并不令人意外。\n\n在本章中，将涵盖 Android 用户界面结构的主题，并概述用于组成用户界面的不同元素；即\
  \ `Views`、`View Groups` 和 `Layouts`。\n\n### 16.1 为不同的 Android 设备进行设计\n\n“Android\
  \ 设备”一词涵盖了大量具有不同屏幕尺寸和分辨率的平板电脑和智能手机产品。因此，应用程序界面现在必须经过仔细设计，以确保在尽可能广泛的显示范围内正确显示。其关键部分之一是确保用户界面布局在不同设备上运行时能够正确调整大小。这在很大程度上可以通过仔细的规划以及使用本章概述的布局管理器来实现。\n\
  \n同样重要的是，大多数基于 Android 的智能手机和平板电脑都可以以竖屏和横屏模式用户持有。良好的用户界面应该能够适应这些变化，并进行合理的布局调整，以利用每个方向上的可用屏幕空间。\n\
  \n### 16.2 Views 和 View Groups\n\n用户界面中的每一项都是 Android `View` 类的子类（准确来说是 `android.view.View`）。Android\
  \ SDK 提供了一组预构建的视图可用于构建用户界面。典型示例包括标准项，如 `Button`、`CheckBox`、`ProgressBar` 和 `TextView`\
  \ 类。此类视图也被称为控件（widgets）或组件。对于 SDK 提供的控件无法满足的需求，可以通过子类并扩展现有类来创建新视图，或者通过直接在 `View`\
  \ 类之上构建创建一个全新的组件。\n\n一个视图还可以由多个其他视图组成（作为复合视图/composite view）。此类视图派自 Android `ViewGroup`\
  \ 类（`android.view.ViewGroup`），该类本身也是 `View` 的子类。此类视图的一个示例是 `RadioGroup`，它旨在包含多个\
  \ `RadioButton` 对象，以便在任何时间只有一个对象可以处于“开启”位置。在结构上，复合视图由单个父视图（派自 `ViewGroup` 类，也被称为容器视图或根元素）组成，该视图能够包含其他视图（称为子视图）。\n\
  \n另一类基于 `ViewGroup` 的容器视图是布局管理器（layout manager）。\n\n### 16.3 Android 布局管理器\n\n除了上一节讨论的控件样式视图外，SDK\
  \ 还包含了一组被称为布局（layouts）的视图。布局是容器视图（因此派自 `ViewGroup`），其设计的唯一目的是控制子视图在屏幕上的对齐方式。\n\n\
  Android SDK 包含了以下可能在 Android 用户界面设计中使用的布局视图：\n\n- `ConstraintLayout` – 在 Android\
  \ 7 中引入，建议在大多数布局需求下使用此布局管理器。`ConstraintLayout` 允许通过分配给每个子视图的简单约束设置来定义定义布局中视图的位置和行为。这种布局的灵活性允许快速轻松地创建复杂布局，而无需在内部嵌套其他布局类型，从而提高了布局性能。`ConstraintLayout`\
  \ 也紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，否则它是书中大多数示例的首选布局。\n- `LinearLayout` – 根据所选的方向将子视图放置在单行或单列中。可以在每个子视图上设置权重（weight）值，以指定该视图相对于其他子视图占据布局空间的多少比例。\n\
  - `TableLayout` – 将子视图按行和列的网格格式排列。表格中的每一行由一个 `TableRow` 对象对象表示，该对象为每个单元格包含一个视图对象。\n\
  - `FrameLayout` – `FrameLayout` 的目的是分配一个屏幕区域，通常用于显示单个视图。如果添加了多个子视图，它们默认将堆叠在一起并位于布局区域的左上角。通过为每个子视图设置重力（gravity）值来实现单个子视图的交定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将其置于容器 `FrameLayout` 视图的垂直居中。\n- `RelativeLayout` – `RelativeLayout`\
  \ 允许通过指定子视图的对齐方式和间距，使其相对于彼此以及容器布局视图进行定位。例如，可以将子视图 `View A` 配置为位于容器 `RelativeLayout`\
  \ 视图的垂直和水平方向居中。另一方面，`View B` 也可以被配置为在布局视图内水平居中，但位于 `View A` 顶部上方 30 像素处，从而使其垂直位置相对于\
  \ `View A`。`RelativeLayout` 管理器在设计必须适用于各种屏幕尺寸和方向的用户界面时可能特别有用。\n- `AbsoluteLayout`\
  \ – 允许在容器布局视图内通过特定的 X 和 Y 坐标对子视图进行定位。不建议使用这种布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n\n\n\n\n\n\
  * `GridLayout` – `GridLayout` 实例由不可见的线条划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为在水平和垂直方向上覆盖多个单元格，从而快速轻松地实现各种布局选项。`GridLayout`\
  \ 中组件之间的间隙可以通过在相邻单元格中放置名为 `Space` 的特殊类型视图，或者通过设置外边距参数来实现。\n\n* `CoordinatorLayout`\
  \ – `CoordinatorLayout` 随着 Android 5.0 作为 Android Design Support Library 的一部分引入，专门用于协调应用程序屏幕顶部应用栏（app\
  \ bar）与其他视图元素之间的外观和行为。当使用 Basic Activity 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout`\
  \ 实例来实现。该布局布局器将从标题为 “与浮动操作按钮和 Snackbar 使用” 的章节开始进行更详细的介绍。\n\n在考虑在 Android 应用程序的用户界面中使用布局时，值得注意的是，正如下一节将概述的那样，这些布局可以相互嵌套，以创建几乎任何所需复杂程度的用户界面设计。\n\
  \n## 16.4 视图层次结构\n\n用户界面中的每个视图都代表显示器上的矩形区域。视图负责在该矩形内绘制的内容，并响应发生在屏幕该部分的事件（例如触控事件）。\n\
  \n用户界面屏幕由视图层次结构组成，其中根视图位于树的顶部，子视图位于下方的分支上。容器视图的子视图显示在其父视图之上，并被限制在父视图显示区域的边界内。例如，考虑\
  \ 图 16-1 所示的用户界面：\n\n![](img/Image2798.jpg)\n\n图 16-1\n\n除了可见的按钮和复选框视图外，用户界面实际上还包含许多布局视图，这些视图控制可见视图的定位。图\
  \ 16-2 显示了用户界面的另一种视图，这次突出了布局视图与子视图之间的关系：\n\n![](img/Image2808.jpg)\n\n图 16-2\n\n\
  正如之前讨论过的，用户界面是以视图层次结构的形式构建的，根视图位于顶部。既然如此，我们也可以以 图 16-3 所示的视图树的形式来视觉化上述用户界面示例：\n\n\
  ![](img/Image2815.jpg)\n\n图 16-3\n\n视图层次结构图可能对 图 16-1 所示的用户界面所构成的各种视图之间的关系提供了最清晰的概览。当用户界面显示给用户时，Android\
  \ 运行时会遍历视图层次结构，从根视图开始沿树向下移动，并渲染每个视图。\n\n## 16.5 创建用户界面\n\n在对视图、布局和视图层次结构概念有了更清晰的理解后，接下来的几章将重点介绍为\
  \ Android 活动创建用户界面的步骤。事实上，用户界面设计有三种不同的方法：使用 Android Studio 布局编辑器工具、手动编写 XML 布局资源文件或编写\
  \ Java 代码，每种方法都将被涵盖。\n\n## 16.6 总结\n\nAndroid 应用程序用户界面屏幕中的每个元素都是一个视图，它最终派自 `android.view.View`\
  \ 类。每个视图代表设备显示器上的矩形区域，并负责在该矩形内显示的内容，以及处理发生在视图边界内的事件。多个视图可以组合成单个复合视图。复合视图中的视图是容器视图的子视图，容器视图通常是\
  \ `android.view.ViewGroup` 的子类（其本身又是 `android.view.View` 的子类）。用户界面由以层次结构形式构建的视图组成。\n\
  \nAndroid SDK 包含一系列预构建视图，可用于创建用户界面。这些包括文本字段和按钮等基本组件，以及一组可用于控制子视图定位的布局管理器。如果提供的视图不能特定特定，可以通过扩展或组合现有视图，或者通过派生\
  \ `android.view.View` 并创建一个全新的视图类来创建自定义视图。\n\n可以使用 Android Studio 布局编辑器工具、手动编写 XML\
  \ 布局资源文件或编写 Java 代码来创建用户界面。这些方法都将在后续章节中介绍。\n\n## 17. Android Studio 布局编辑器工具指南\n\n\
  很难想象没有某种形式用户界面的 Android 应用程序概念。大多数 Android 设备都配备了触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间交互的主要形式。这些交互不可避免地通过应用程序的用户界面发生。\n\
  \n设计良好的良好的用户界面是创建成功且流行的 Android 应用程序的重要因素，它取决于单个应用程序的设计需求，从简单到极其复杂不等。无论复杂程度如何，Android\
  \ Studio 布局编辑器工具都显著简化了设计和实现 Android 用户界面的任务。\n\n## 17.1 基础活动与空活动模板\n\n正如标题为 “Android\
  \ 应用程序剖析” 的章节所述，Android 应用程序由一个或多个活动组成。活动是一个独立的应用程序功能模块，通常直接对应单个用户界面屏幕。因此，当使用 Android\
  \ Studio 编辑器工作时，我们总是在处理活动的布局。\n\n在创建新的 Android Studio 项目时，有许多不同的模板可以作为主活动用户界面的起点。这些模板中最基础的是\
  \ Basic Activity 模板和 Empty Activity 模板。虽然这些模板看起来相似，但这两个选项之间实际上存在显著差异。要在布局编辑器中查看这些差异，请使用“视图”菜单启用“显示系统\
  \ UI”，如下 图 17-1 所示：\n\n![](img/as_layout_editor_system_ui.jpg)\n\n图 17-1\n\nEmpty\
  \ Activity 模板创建一个单一布局文件，由一个 `ConstraintLayout` 管理器实例包含一个 `TextView` 对象组成，如 图 17-2\
  \ 所示：\n\n![](img/as_4.1_empty_activity_ui.jpg)\n\n图 17-2\n\n另一方面，Basic Activity\
  \ 由多个布局文件组成。顶层布局文件具有 `CoordinatorLayout` 根视图、一个跨设备屏幕顶部的配置应用栏（包含工具栏，如 图 17-3 中的标记\
  \ A 所示）和一个浮动操作按钮（标记为 B 的电子邮件按钮）。除了这些项目，`activity_main.xml` 布局文件引用了名为 `content_main.xml`\
  \ 的第二个文件，该文件包含内容布局（标记为 C）：\n\n![](img/as_basic_activity_layout.jpg)\n\n图 17-3\n\n\
  \n\n\n基础 Activity（Basic Activity）包含两个屏幕的布局，每个屏幕都包含一个按钮和一个文本视图（text view）。此模板旨在演示如何在\
  \ App 中实现多个屏幕之间的导航。如果运行使用基础 Activity 模板的未修改的 App，将显示这两个屏幕中的第一个（在图 17-4 中标记为 A）。点击\
  \ `Next` 按钮将导航到第二个屏幕 (B)，该屏幕反过来包含一个返回第一个屏幕的按钮：\n\n![](img/as_basic_activity_layout_1.jpg)\n\
  \n图 17-4\n\n此 App 行为使用了两个 Android 功能，称为片段（fragments）和导航（navigation），这两个功能将将从标题为\
  \ “Android 片段简介” 和 “导航架构组件概述” 的章节开始介绍。\n\n`content_main.xml` 文件包含一种名为导航宿主片段（Navigation\
  \ Host Fragment）的特殊片段，它允许根据 `res -> layout -> nav_graph.xml` 文件中配置的设置，将不同的内容在视图中切换出入。对于基础\
  \ Activity 模板，`nav_graph.xml` 文件配置为根据用户对 `Next` 和 `Previous` 按钮的选择，在 `fragment_first.xml`\
  \ 和 `fragment_second.xml` 文件定义的用户界面布局之间进行切换。\n\n显然，如果你在 Activity 中既不需要悬浮按钮（floating\
  \ action button）也不需要菜单，并且不需要 `CoordinatorLayout` 提供的特殊 App 栏行为（例如，使 App 栏和工具栏在某些滚动操作期间从视图中折叠的选项——该主题在标题为\
  \ “使用 AppBar 和折叠工具栏布局” 的章节中有所介绍），那么空 Activity（Empty Activity）模板将是有用的。然而，基础 Activity\
  \ 的用处在于它默认提供了这些元素。事实上，使用基础 Activity 模板创建一个新 Activity 并删除不需要的元素，比使用空 Activity 模板并手动实现折叠工具栏、菜单或悬浮按钮等行为要快得多。\n\
  \n尽管书中的并非所有示例都需要基础 Activity 模板的功能，但本章的大多数示例将使用空 Activity 模板，除非示例需要基础 Activity 模板提供的某项功能。\n\
  \n### 自定义基础 Activity\n\n为了以后参考，如果你需要一个菜单但不需要悬浮按钮，请使用基础 Activity 并按照以下步骤删除悬浮按钮：\n\
  \n1. 在项目（Project）工具窗口中，双击位于 `app -> res -> layout` 下的主 `activity_main.xml` 布局文件，以将其加载到布局编辑器（Layout\
  \ Editor）中。当布局加载到布局编辑器工具中后，选择悬浮按钮并按下键盘上的 `Delete` 键从布局中删除该对象。\n2. 找到并编辑 Activity\
  \ 的 Java 代码（位于 `app -> java -> <package name> -> <activity class name>`），并如下所示从\
  \ `onCreate` 方法中移除悬浮按钮代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                    .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n如果你需要悬浮按钮不需要菜单，请使用基础 Activity\
  \ 模板并遵循以下步骤：\n\n1. 编辑 Activity 类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected`\
  \ 方法。\n2. 在项目工具窗口中选择 `res -> menu` 项并按下键盘上的 `Delete` 键从项目中删除文件夹和相应的菜单资源文件。\n\n如果你需要使用基础\
  \ Activity 模板但既不需要导航功能也不需要第二个内容片段，请遵循以下步骤：\n\n1. 在项目工具窗口中，导航并双击 `app -> res -> navigation\
  \ -> nav_graph.xml` 文件将其加载到导航编辑器中。\n2. 在编辑器中，选择图面板中的 `SecondFragment` 条目并按下键盘 delete\
  \ 键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`（`app -> java -> <package name> -> SecondFragment`）和\
  \ `fragment_second.xml`（`app -> res -> layout -> fragment_second.xml`）文件。\n4. 最后的任务是从\
  \ `FirstFragment` 类中移除一些代码，以便 `Button` 视图不再导航到已不存在的第二个片段。找到 `FirstFragment.java`\
  \ 并双击它，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull View view, Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n       \
  \ @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n### Android Studio 布局编辑器\n\n如前面的章节所示，布局编辑器工具提供了一个“所见即所得”（WYSIWYG）环境，在该环境中可以从调板中选择视图并将其放置在代表\
  \ Android 画布上。一旦视图放置在画布上，就可以对其进行移动、删除和调整大小（受父视图的限制）。此外，可以使用属性（Attributes）工具窗口修改与选定视图相关的属性。\n\
  \n在底层，布局编辑器工具实际上构建了一个包含正在设计的用户界面定义的 XML 资源文件。因此，布局编辑器以三种不同的模式运行，称为设计（Design）、代码（Code）和拆（Split）模式。\n\
  \n#### 设计模式\n\n在设计模式下，可以通过直接操作视图面板和布局的图形表示来可视化地操作用户界面。图 17-5 突出了 Android Studio\
  \ 布局编辑器在设计模式下的关键区域：\n\n![](img/as_labeled_layout_editor.jpg)\n\n图 17-5\n\nA – 调板（Palette）——调板提供了\
  \ Android SDK 提供的视图组件。这些组件被分组以便导航。可以通过从调板中拖拽视图组件并将其在布局上所需的位置向布局中添加项。\n\nB – 设备屏幕（Device\
  \ Screen）——设备屏幕提供了正在设计的界面布局的视觉“所见即所得”表示。此布局允许对设计进行直接操作，允许选择、删除、移动和调整视图的大小。可以使用工具栏中位置的菜单随时更改布局所代表的设备模型。\n\
  \n\n\n\n### C – 组件树\n如上一章（“理解 Android View、ViewGroup 和 Layout”）所示，用户界面是通过分层结构构建的。组件树提供了用户界面设计层级的视觉概览。在组件树中选择一个元素将选中布局中对应的视图。同样，在设备屏幕布局中选择一个视图将选中组件树层级中的该视图。\n\
  \n### D – 属性\n调面板中列出的所有组件视图都关联有一组属性，这些属性可以用于调整视图的行为和外观。布局编辑器的属性面板提供了对布局中当前选中视图属性的访问，从而允许进行更改。\n\
  \n### E – 工具栏\n布局编辑器工具栏提供了对广泛选项的快速访问，包括但不限于：放大和缩小设备屏幕布局、更改当前显示的设备模型、在竖屏和横屏之间旋转布局，以及切换到不同的\
  \ Android SDK API 级别。工具栏还有一组上下文相关按钮，当在设备屏幕布局中选择相关的视图类型时，这些按钮将会显示。\n\n### F – 模式切换控件\n\
  这三个按钮提供了在布局编辑器工具的设计（Design）、代码（Code）和拆分（Split）模式之间来回切换。\n\n### G - 缩放和平移控件\n此控制面板允许你对设计画布进行放大和缩小，并抓取画布进行移动以寻找放大时被遮挡的区域。\n\
  \n## 17.4 调面板\n布局编辑器调面板由两个面板组成，旨在方便查找和预览要添加到布局设计中的视图组件。类别面板（在图 17-6 中标记为 A）列出了 Android\
  \ SDK 支持的不同类别的视图组件。当从列表中选择一个类别时，第二个面板（B）将更新以并显示属于该类别的组件列表：\n\n![](img/as_4.1_layout_editor_palette.jpg)\n\
  \n图 17-6\n\n要将组件从调色板中添加到布局画布上，只需从组件列表或预览面板中选择该项，将其拖动到画布上的所需位置并放开即可。\n\n要在当前选定的类别中搜索特定组件，可以点击调面板工具栏中的搜索按钮（在上方图\
  \ 17-6 中标记为 C）并输入组件名称。随着字符的输入，匹配的结果将在组件列表面板中实时显示。如果你不确定组件所在的类别，只需在搜索操作之前或期间选择“所有结果”（All\
  \ Results）类别即可。\n\n## 17.5 设计模式和布局视图\n默认情况下，布局编辑器将以设计（Design）模式出现，如上方图 17-5 所示。此模式提供了用户界面的视觉表示。可以通过点击如图\
  \ 17-7 所示的最右侧的模式切换控件来随时选择设计模式：\n\n![](img/as_4.0_layout_editor_design_button.jpg)\n\
  \n图 17-7\n\n当布局编辑器工具处于设计模式时，可以用两种不同的方式查看布局。上方图 17-5 所示的视图是设计视图（Design view），显示了布局和小部件在运行的程序中的样式。第二种模式被称为蓝图视图（Blueprint\
  \ view），可以替换设计视图显示，也可以与设计视图同时显示。图 17-8 所示的工具栏菜单提供了显示设计、蓝图或两种视图的选项。还有用于调整色盲的设置。第五种选项“强制刷新布局”（Force\
  \ Refresh Layout）会导致布局重建并重绘。当布局进入意外状态或未能准确反映当前设计设置时，这非常有用：\n\n![](img/as_layout_editor_select_design_surface.jpg)\n\
  \n图 17-8\n\n显示布局视图、设计视图还是两者取决于个人喜好。一种好的方法是如图 17-9 所示，从显示两者开始：\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n\
  \n图 17-9\n\n## 17.6 夜间模式\n在设计工作期间以夜间模式查看布局，请选择下方图 17-10 所示的菜单并将设置更改“夜间”（Night）：\n\
  \n![](img/as_layout_editor_night_mode.jpg)\n\n图 17-10\n\n## 17.7 代码模式\n在使用 Android\
  \ Studio 布局编辑器工具时，请记住它实际上只是提供了一种创建 XML 布局资源文件的易于用户操作的方法。在设计过程的任何时候，只需点击布局编辑器工具面板右上角的“代码”（Code）按钮（如图\
  \ 17-11 所示），即可查看并直接编辑底层 XML：\n\n![](img/as_4.0_layout_editor_code_button.jpg)\n\n\
  图 17-11\n\n图 17-12 显示了代码模式下的 Android Studio 布局编辑器，允许通过修改 XML 来更改界面：\n\n![](img/as_3.6_layout_editor_mode.jpg)\n\
  \n图 17-12\n\n## 17.8 拆分模式\n在拆分（Split）模式下，编辑器并排显示设计和代码视图，允许通过使用设计画布或修改 XML 来修改用户界面。要进入拆分模式，点击下方图\
  \ 17-13 所示的中间按钮：\n\n![](img/as_4.1_layout_split_button.jpg)\n\n图 17-13\n\nXML 的任何更改都会反映在设计画布上，反之亦然。图\
  \ 17-14 显示了拆分模式下的编辑器：\n\n![](img/as_4.1_layout_split_mode.jpg)\n\n图 17-14\n\n##\
  \ 17.9 设置属性\n属性面板提供了对当前选中组件可用设置的访问。例如，图 17-15 显示了 `TextView` 小部件的属性：\n\n![](img/as_attributes_panel.jpg)\n\
  \n图 17-15\n\n属性窗口分为以下部分：\n\n- id：包含 id 属性，定义了当前选中对象在应用程序源码中引用的名称。\n- 已声明属性（Declared\
  \ Attributes）：包含所有已赋值的属性。\n- 布局（Layout）：定义当前选中视图对象相对于屏幕以及布局中其他对象如何定位和调整大小的设置。\n\
  - 变换（Transforms）：包含允许当前选中对象进行旋转、缩放和偏移的控件。\n- 常用属性（Common Attributes）：对于当前选中视图对象经常需要更改的属性列表。\n\
  - 所有属性（All Attributes）：当前选中对象可用属性的完整列表。\n\n也可以通过选择属性窗口工具栏中的搜索按钮并输入属性名称来搜索特定属性。\n\
  \n\n\n\n\n某些属性在值字段的右侧有一个窄按钮。这表示可以使用 `Resources`（资源）对话框辅助选择合适的属性值。只需点击该按钮即可显示对话框。此按钮的外观会变化，以反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，文本属性字段右侧的按钮将变为填充状态，如下方的图\
  \ 17-16 所示，表示该值不是硬编码的：\n\n![](img/as_3.4_resource_extracted.jpg)\n\n图 17-16\n\n\
  具有有限数量有效选项的属性将显示一个下拉菜单（图 17-17），可以从菜单中进行选择。\n\n![](img/as_4.0_type_face_menu.jpg)\n\
  \n图 17-17\n\n可以点击吸管图标（如上方图 17-16 中 `backgroundTint` 字段所示）来显示颜色选择调色板。同样，当此位置出现旗帜图标时，点击它可以显示该属性的可用选项列表；而图像图标会打开资源管理器面板，允许为属性选择图像和其他资源类型。\n\
  \n### 17.10 变换 (Transforms)\n\nAttributes（属性）工具窗口中的变换面板（图 17-18）提供了一组控件和属性，用于控制当前选中对象在旋转、alpha（用于视图的淡入淡出）、缩放（大小）和平移（当前位置的偏移）方面的视觉效果：\n\
  \n![](img/as_4.1_layout_editor_transforms.jpg)\n\n图 17-18\n\n该面板包含视图的视觉表示，并随着属性的更改而更新。这些更改也会反映在布局画布的视图上。\n\
  \n### 17.11 工具可见性切换 (Tools Visibility Toggles)\n\n在代码模式下查看 Android Studio XML 布局文件的内容时，你会发现许多定义视图外观和行为的属性以\
  \ `android:` 前缀开头。这表示这些属性是在 `android` 命名空间设置的，并在应用运行时生效。例如，以下布局文件的节选在 `Button` 视图上设置了多种属性：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n```\n\
  \n除了 `android` 命名空间外，Android Studio 还提供了 `tools` 命名空间。当在此命名空间内设置属性时，它们仅在布局编辑器的预览中生效。在设计布局时，你可能会发现让\
  \ `EditText` 视图显示某些文本很有帮助但在应用运行时需要视图为空。为了实现这一点，你可以如下所示使用 `tools` 命名空间设置视图的 `text`\
  \ 属性：\n\n```xml\n<EditText\n    android:id=\"@+id/editTextTextPersonName\"\n   \
  \ android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:ems=\"10\"\n    android:inputType=\"textPersonName\"\n    tools:text=\"\
  Sample Text\"\n```\n\n此类工具属性在 Attributes 工具窗口中设置，通过在带有扳手图标的属性字段中输入值来完成，如图 17-19\
  \ 所示：\n\n![](img/as_4.1_text_tools_property.jpg)\n\n图 17-19\n\n工具属性对于在设计过程中更改视图的可见性特别有用。布局中可能包含一个视图，在应用运行时根据用户操作程序化地显示和隐藏。为了模拟视图的隐藏，可以在视图的\
  \ XML 声明中添加以下工具属性：\n\n```xml\ntools:visibility=\"invisible\"\n```\n\n使用 `invisible`\
  \ 设置时，尽管视图不再可见，但它仍然存在于布局中，并占据其可见时占据相同的空间。要让布局表现得像该视图不再存在一样，应将 `visibility` 属性设置为\
  \ `gone`，如下所示：\n\n```xml\ntools:visibility=\"gone\"\n```\n\n在上述两个示例中，可见性设置仅适用于布局编辑器，对运行中的应用没有影响。要同时控制布局编辑器和运行中应用中的可见性，应使用\
  \ `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"gone\"\n```\n\n虽然这些可见性工具属性很有用，但手动编辑\
  \ XML 布局文件是一个繁琐的过程。为了方便更改这些设置，Android Studio 在布局编辑器的 Component Tree（组件树）面板中提供了一组切换。要访问这些控件，点击面板中对应视图右侧的边距。例如，图\
  \ 17-20 显示了名为 `myButton` 的 `Button` 视图的工具可见性切换控件：\n\n![](img/as_4.2_layout_tools_visibility.jpg)\n\
  \n图 17-20\n\n这些切换控制 `android` 和 `tools` 命名空间对应视图的可见性，并提供未设置（not set）、可见（visible）、不可见（invisible）和隐藏不占空间（gone）选项。当设置了冲突的属性时（例如\
  \ `android` 命名空间切换设置为 `visible`，而 `tools` 设置为 `invisible`），`tools` 命名空间在布局预览中具有优先级。当做出切换选择时，Android\
  \ Studio 会自动为视图添加相应的属性。\n\n除了组件树面板中的可见性切换外，布局编辑器还包含下方图 17-21 所示的工具可见性切换按钮：\n\n![](img/as_4.1_layout_editor_tools_toggle.jpg)\n\
  \n图 17-21\n\n此按钮切换当前的工具可见性设置。例如，如果上方所示的 `Button` 视图设置为 `gone`，切换此按钮将使其可见。这便于快速检查视图在布局中添加或移除时的行为。此切换对于检查布局中的视图是否正确约束也非常有用，该主题将在“Android\
  \ Studio 中使用 ConstraintLayout 的指南”章节中介绍。\n\n### 17.12 转换视图 (Converting Views)\n\n\
  在布局中将视图从一种类型转换为另一种（例如将 `TextView` 转换为 `EditText`）可以在 Android Studio 布局编辑器中轻松完成，只需在屏幕布局或组件树窗口中右键点击视图，并选择转换视图...（Convert\
  \ view...）菜单选项（图 17-22）：\n\n![](img/as_layout_convert_view.jpg)\n\n图 17-22\n\n选中后，将出现一个对话框，包含所选对象可以转换的兼容视图类型列表。例如，图\
  \ 17-23 显示了现有 `TextView` 视图可以转换的类型：\n\n![](img/as_3.2_convert_layout_textview.jpg)\n\
  \n图 17-23\n\n这种技术也用于将布局从一种类型转换为另一种（例如将 `ConstraintLayout` 转换为 `LinearLayout`）。\n\
  \n### 17.13 显示示例数据\n\n\n\n\n在 `Android Studio` 中设计布局时，可能会出现一种情况：用户界面中要显示的内容直到 App\
  \ 完成并运行后才能可用。这有时会导致人们很难在布局编辑器内部评估布局在 App 运行时的外观。为了解决这个问题，布局编辑器允许指定示例数据，用以示例图像和数据填充布局编辑器中的视图（views）。这些示例数据只会在布局编辑器中显示，在\
  \ App 运行时不会显示。可以通过直接编辑布局的 XML，或者通过使用设计时辅助工具（design-time helper）——即在设计区域右键点击组件并选择\
  \ `Set Sample Data`（设置示例数据）菜单选项来配置示例数据。设计时辅助工具面板将为选定的视图项显示一系列预配置的示例数据选项，包括各种配置的文本和图像组合。例如，图\
  \ 17-24 显示了在 `RecyclerView` 列表中选择显示示例数据时显示的示例数据选项：\n\n![](img/as_3.4_sample_data_menu.jpg)\n\
  \n图 17-24\n\n或者，也可以在布局设计过程中提供自定义文本和图像进行显示。在布局编辑器中使用示例数据的示例包含在后后标题为 “布局编辑器示例数据教程”\
  \ 的章节中。由于示例数据是通过 `tools` 属性实现的，预览中数据的可见性可以使用上方 图 17-21 中高亮显示的的切换按钮进行控制。\n\n### 17.14\
  \ 创建自定义设备定义\n\n`Layout Editor` 工具栏中的设备菜单（图 17-25）提供了一系列预配置的设备类型列表，选择后，它们将作为设备屏幕画布出现。除了预配置的设备类型外，任何在\
  \ `Android Studio` 环境中之前配置过的 `AVD` 实例也会列在菜单中。要添加额外的设备配置，显示设备菜单，选择 `Add Device Definition`（添加设备定义）选项，并按照\
  \ “在 Android Studio 中创建 Android 虚拟设备 (AVD)” 章节中概述的步骤进行操作。\n\n![](img/as_3.6_layout_editor_select_device.jpg)\n\
  \n图 17-25\n\n### 17.15 修改当前设备\n\n作为设备选择菜单的替代方案，可以通过从设备菜单选择 `Custom`（自定义）选项，点击设备屏幕右下角的缩放句柄（图\
  \ 17-26）并拖动以选择备用的设备显示格式。随着屏幕缩放，将出现标记，指示可选的各种尺寸选项和方向：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-26\n\n### 17.16 布局验证\n\n布局验证（Layout Validation）选项允许在一系列 `Pixel` 尺寸的屏幕上同时预览用户界面布局。要访问布局验证工具窗口，可以点击\
  \ `Android Studio` 主窗口右侧边缘的标签，或使用窗口左下角的 `Tool Window`（工具窗口）菜单。如果没有显示 `Layout Validation`\
  \ 工具窗口，你可能需要创建一个键映射快捷键来显示它。要添加键映射快捷键，选择 `File`（文件） -> `Settings...`（设置...）（macOS\
  \ 上为 `Android Studio` -> `Preferences...`），并选择左侧导航面板中的 `Keymap`（键映射）项。在 `Keymap`\
  \ 列表中，找到 `Tool Windows` 下的 `Layout Validation` 条目，右键点击并选择 `Add Keyboard Shortcut`（添加键盘快捷键）菜单选项：\n\
  \n![](img/as_add_keyboard_shortcut.jpg)\n\n图 17-27\n\n在键盘快捷键对话框中，尝试各种组合组合直到找到一个未被使用的，然后点击\
  \ `OK` 按钮。接下来，在 `Preferences` 对话框中点击 `Apply`（应用）后点击 `OK`，返回布局编辑器并使用快捷键显示 `Layout\
  \ Validation` 工具窗口。加载后，该面板将如 图 17-28 所示，在多个设备屏幕配置上渲染布局：\n\n![](img/as_layout_validation.jpg)\n\
  \n图 17-28\n\n### 17.17 总结\n\n开发 Android 应用的一个关键部分是创建用户界面。在 `Android Studio` 环境中，这是通过\
  \ `Layout Editor` 工具完成的，它以三种模式运行。在 `Design`（设计）模式下，从调色板选择视图组件并放置在代表 Android 设备屏幕的布局上，使用属性列表进行配置。在\
  \ `Code`（代码）模式下，可以直接编辑表示用户界面布局的底层 `XML`。而 `Split`（分割）模式则允许通过视觉化和直接编辑 `XML` 来创建和修改布局。这些模式结合提供了一个丰富且直观的用户界面设计环境。\n\
  \n布局验证面板允许在各种设备屏幕尺寸上快速预览用户界面布局。\n\n# 18. Android ConstraintLayout 指南\n\n正如在理解 Android\
  \ 视图、视图组和布局 章节中讨论的那样，Android 提供了许多布局管理器用于设计用户界面。从 Android 7 开始，Google 引入了一种新的布局，旨在解决旧布局管理器的许多缺点。这种名为\
  \ `ConstraintLayout` 的新布局将简单、灵活且灵活的布局系统与 `Android Studio Layout Editor` 工具中的强大功能相结合，以便创建适应不同屏幕尺寸的响应式用户界面布局。\n\
  \n本章将概述 `ConstraintLayout` 的基本概念，下一章将详细介绍如何在 `Android Studio Layout Editor` 中使用\
  \ `ConstraintLayout` 创建约束布局。\n\n## 18.1 ConstraintLayout 工作原理\n\n与其他所有布局一样，`ConstraintLayout`\
  \ 负责管理它包含的视觉组件（也称为组件）的位置和尺寸行为。它是基于设置在每个子组件上的约束连接来实现的。\n\n为了充分理解并使用 `ConstraintLayout`，理解以下关键概念非常重要：\n\
  \n• 约束（Constraints）\n• 间距（Margins）\n• 相约束（Opposing Constraints）\n• 约束偏移（Constraint\
  \ Bias）\n• 链（Chains）\n• 链样式（Chain Styles）\n• 引导（Guidelines）\n• 组（Groups）\n• 屏（Barriers）\n\
  • 流（Flow）\n\n### 18.1.1 约束\n\n约束是决定组件相对于其他组件、容器 `ConstraintLayout` 侧以及称为引导的特殊元素的对齐和距离规则集。约束还决定了\
  \ Activity 用户界面布局在设备方向变化或在不同尺寸的设备上显示时如何响应。为了充分配置，组件必须具有足够的约束连接，以便 `ConstraintLayout`\
  \ 布局引擎能够在水平和垂直平面上解析其位置。\n\n### 18.1.2 间距\n\n间距是一种指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的 `Button`\
  \ 对象。这可以通过实现 `Button` 顶部和右边缘的间距约束，将其连接到父级 `ConstraintLayout` 的相应边来实现，如图 18-1 所示：\n\
  \n![](img/Image2437.jpg)\n\n图 18-1\n\n\n\n\n如上图所示，这些约束连接中的每一个都关联了一个边距值，该值决定了 `widget`\
  \ 距离父布局两侧的固定距离。在这种配置下，无论屏幕大小或设备方向如何，`Button` 对象将始终根据两个约束连接的指定，分别距离父 `ConstraintLayout`\
  \ 的顶部和右侧边缘 20 和 15 个设备无关像素 (dp)。\n\n虽然上述配置在某些情况下是可以接受的，但它并没有在允许 `ConstraintLayout`\
  \ 布局引擎通过调整 widget 的位置来响应设备旋转并支持不同尺寸的屏幕提供任何灵活性。要为布局添加这种响应性，有必要实现对立约束（opposing constraints）。\n\
  \n### 18.1.3 对立约束 (Opposing Constraints)\n\n在单个 widget 上沿同一轴线运行的两个约束被称为对立约束。换句话说，左侧和右侧都具有约束的\
  \ widget 被认为具有水平对立约束。例如，图 18-2 展示了在之前的布局中同时添加水平和垂直对立约束：\n\n![](img/Image24461.jpg)\n\
  \n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了对立约束，widget 的定位将基于百分比而不是坐标。例如，widget 不再被固定在布局顶部的\
  \ 20dp 处，而是位于距离布局顶部 30% 的位置。在不同的方向以及在更大或更小的屏幕上运行时，`Button` 将始终相对于父布局的尺寸处于相同的位置。\n\
  \n现在重要的是要理解，图 18-2 中概述的布局不仅是通过对立约束实现的，还通过应用了约束偏置（constraint bias）。\n\n### 18.1.4\
  \ 约束偏置 (Constraint Bias)\n\n现在已经确定，`ConstraintLayout` 中的 widget 可能会受到对立约束连接的影响。默认情况下，对立约束是相等的，这导致相应的\
  \ widget 在对立轴上居中。例如，图 18-3 显示了一个在包含它的 `ConstraintLayout` 中通过对立水平和垂直约束实现居中的 widget：\n\
  \n![](img/Image2453.jpg)\n\n图 18-3\n\n为了在存在对立约束的情况下调整 widget 的位置，`ConstraintLayout`\
  \ 实现了一种名为约束偏置的功能。约束偏置允许 widget 在对立轴上的定位根据指定的百分比偏向其中一个约束倾斜（偏置）。例如，图 18-4 显示了具有 75%\
  \ 水平偏置和 10% 垂直偏置的之前的约束布局：\n\n![](img/Image2461.jpg)\n\n图 18-4\n\n下一章标题为在 Android\
  \ Studio 中使用 ConstraintLayout 的指南，将更详细地涵盖这些概念，并解释这些功能是如何集成到 Android Studio 布局编辑器工具中的。然而，在此还需要涵盖\
  \ `ConstraintLayout` 类的另外几个领域。\n\n### 18.1.5 链 (Chains)\n\n`ConstraintLayout` 链（chains）提供了一种将两个或多个\
  \ widget 的布局行为定义为组的方法。链可以在垂直或水平轴上声明，并配置以定义链中的 widget 的间距和大小。\n\n当 widget 通过双向约束连接在一起时，它们就形成了链。例如，图\
  \ 18-5 展示了三个以这种方式链联的 widget：\n\n![](img/Image24681.jpg)\n\n图 18-5\n\n链中的第一个元素是链头（chain\
  \ head），它在垂直链中翻译为顶部 widget，或者在水平链的情况下翻译为最左侧的 widget。整个链的布局行为主要通过在链头 widget 上设置属性来配置。\n\
  \n### 18.1.6 链样式 (Chain Styles)\n\n`ConstraintLayout` 链的布局行为由应用于链头 widget 的链样式设置决定。`ConstraintLayout`\
  \ 类目前支持以下链布局样式：\n\n- **散布链 (Spread Chain)** – 链中包含的 widget 均匀分布在可用空间内。这是链的默认行为。\n\
  \n![](img/Image24781.jpg)\n\n图 18-6\n\n- **内散布链 (Spread Inside Chain)** – 链中包含的\
  \ widget 均匀分布在链头和链中的最后一个 widget 之间。头部和最后一个 widget 不包含在间距分布中。\n\n![](img/Image24853.jpg)\n\
  \n图 18-7\n\n- **加权链 (Weighted Chain)** – 允许通过权重属性定义链中每个 widget 占据的空间。\n\n![](img/Image24922.jpg)\n\
  \n图 18-8\n\n- **紧凑链 (Packed Chain)** – 构成链的 widget 没有任何间距地堆在一起。可以应用偏置来控制链相对于父容器的水平或垂直位置。\n\
  \n![](img/Image2500.jpg)\n\n图 18-9\n\n### 18.2 基线对齐 (Baseline Alignment)\n\n到目前为止，本章仅提到了相对于\
  \ widget 侧边对齐的约束（通常称为侧边约束）。然而，一个常见的需求是让 widget 对于对于显示的内容对齐，而不是相对于 widget 自身的边界。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐支持。作为一个示例，假设图 18-1 之前的布局需要一个 `TextView` widget 位于 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 进行基线对齐。这意味着 `Button` 内的文本需要与 `TextView` 内的文本垂直对齐。该布局的额外约束需要如图 18-10\
  \ 所示连接：\n\n![](img/Image2508.jpg)\n\n图 18-10\n\n`TextView` 现在沿 `Button` 的基线垂直对齐，并在水平上距离\
  \ `Button` 对象左边缘 40dp。\n\n### 18.3 配置 widget 尺寸\n\n控制 widget 的尺寸是用户界面设计的关键元素。`ConstraintLayout`\
  \ 提供了三个选项，用于管理尺寸行为。这些设置针对高度和宽度单独配置：\n\n- **固定 (Fixed)** – widget 固定为指定的尺寸。\n- **匹配约束\
  \ (Match Constraint)** – 允许布局引擎调整 widget 大小以满足现有约束。也称为 `AnySize` 或 `MATCH_CONSTRAINT`\
  \ 。\n- **包裹内容 (Wrap Content)** – widget 的大小由其包含的内容（即文本或图形）决定。\n\n### 18.4 辅助线助手\
  \ (Guideline)\n\n辅助线是 `ConstraintLayout` 中提供的特殊元素，提供了一个可以连接约束的额外目标。可以向 `ConstraintLayout`\
  \ 实例添加多个辅助线，这些线可以配置为水平或垂直方向。添加后，可以从布局中的 widget 到辅助线建立约束连接。当多个 widget 需要沿某个轴对齐时，这特别有用。例如，在图\
  \ 18-11 中，包含在 `ConstraintLayout` 中的三个 `Button` 对象沿垂直辅助线约束：\n\n![](img/Image2519.jpg)\n\
  \n图 18-11\n\n### 18.5 组助手 (Group)\n\n\n\n\n\n`ConstraintLayout` 的这一功能允许将组件放置在逻辑组中，并将这些组件的可见性作为一个单一实体进行控制。`Group`\
  \ 本质上是布局中其他组件的引用列表。一旦定义，更改 `group` 实例的可见性属性（`visible`、`invisible` 或 `gone`）将此更改应用到所有组内成员。这使得通过单个属性更改即可轻松隐藏和显示多个组件。单个布局可以包含多个组，而一个组件可以属于多个组。如果组之间发生冲突，则\
  \ XML 文件中最后声明的组具有优先级。\n\n### 18.6 Barrier Helper（屏障助手）\n\n与指南线（guidelines）类似，`barriers`（屏障）是虚拟视图，可用于约束布局内的视图。与指南线一样，`barrier`\
  \ 可以是垂直的，也可以是水平的，并且可以有一个或多个视图被约束在它上（为了避免混淆，这些将被称为约束视图）。然而，与指南线在布局中保持固定位置不同，`barrier`\
  \ 的位置是由一组所谓的参考视图（reference views）定义的。引入 `Barriers` 是为了解决经常发生的视图重叠问题。例如，考虑下方图 18-12\
  \ 所示的布局：\n\n![](img/Image2526.jpg)\n\n图 18-12\n\n关于上述布局需要注意的关键点是：`View 3` 的宽度设置为匹配约束模式（constraint\
  \ mode），且该视图的左边缘连接到 `View 1` 的右边缘。按照目前的实现方式，增加 `View 1` 的宽度将产生预期效果，即缩小 `View 3`\
  \ 的宽度：\n\n![](img/Image25331.jpg)\n\n图 18-13\n\n但是，如果增加的是 `View 2` 而不是 `View 1`，就会出现问题：\n\
  \n![](img/Image25401.jpg)\n\n图 18-14\n\n显然，由于 `View 3` 仅受到 `View 1` 的约束，它不会调整大小以适应\
  \ `View 2` 宽度的增加，导致视图重叠。\n\n解决此问题的办法是添加一个垂直屏障，并将 `Views 1` 和 `View 2` 分配为屏障的参考视图，以便它们控制屏障的位置。这样，`View\
  \ 3` 的左边缘将相对于屏障进行约束，使其成为约束视图。\n\n现在，当 `View 1` 或 `View 2` 的任一宽度增加时，屏障将移动以适应两个中最宽的一个，从而导致\
  \ `View 3` 的宽度相对于新的屏障位置发生变化：\n\n![](img/Image2548.jpg)\n\n图 18-15\n\n在使用屏障时，与单个屏障关联的参考视图和约束视图的数量没有限制。\n\
  \n### 18.7 Flow Helper（流助手）\n\n`ConstraintLayout Flow` 助手允许视图组以流式网格样式布局进行显示。与 `Group`\
  \ 助手一样，`Flow` 包含了对其负责定位的视图的引用，并提供了多种配置选项，包括垂直和水平方向、换行行为（包括换行之前的最大数量）、间隙和对齐属性。链（Chain）行为也可以应用于\
  \ `Flow` 布局，包括散布（spread）、内部扩散（spread inside）和紧凑（packed）选项。\n\n图 18-16 表示了使用 `Flow`\
  \ 助手实例在水平模式且无换行设置的情况下，五个大小相同的按钮的布局：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n\n图 18-16\n\
  \n图 18-17 显示了相同的按钮在水平流配置中的情况，换行设置为每第三个组件后换行：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n\
  \n图 18-17\n\n另一方面，图 18-18 显示了按钮的换行设置为使用“内部扩散”的“链”模式（其效果仅在第二行可见，因为第一行是满的）。该配置还设置了\
  \ `gap` 属性以在按钮之间添加间距：\n\n![](img/as_4.1_flow_chain_spread_inside.jpg)\n\n图 18-18\n\
  \n作为 `Flow` 助手灵活性的最后一个演示，图 18-19 显示了五个大小不一的按钮，配置为水平紧凑链模式，并在每第三个组件后换行。此外，网格内容设置了右对齐：\n\
  \n![](img/as_4.1_flow_align.jpg)\n\n图 18-19\n\n### 18.8 Ratios（比例）\n\n组件的尺寸可以使用比例设置来定义。例如，可以使用比例对组件进行约束，使得无论发生何种缩放行为，其宽度都是高度的两倍。\n\
  \n### 18.9 ConstraintLayout 优势\n\n`ConstraintLayout` 提供的灵活性使得许多人能够在单个布局中实现许多旧布局的功能，而以前可能需要嵌套多个布局。这样做的好处是实现了“扁平”或“浅层”的布局层级，从而提高了用户界面的性能。\n\
  \n`ConstraintLayout` 的实现也考虑了广泛的 Android 屏幕尺寸。最后，正如名为“使用 ConstraintLayout`的章节中将演示的那样，Android\
  \ Studio 布局编辑器已针对基于 `ConstraintLayout` 的用户界面设计进行了增强。\n\n### 18.10 ConstraintLayout\
  \ 的可用性\n\n虽然 `ConstraintLayout` 是随 Android 7 引入的，但它是作为独立的支持库从主 SDK 中提供的，并兼容 API\
  \ 9 (Android Gingerbread)。这使得使用此布局的应用运行在更旧的 Android 版本上。\n\n### 18.11 总结\n\n`ConstraintLayout`\
  \ 是随 Android 7 引入的布局管理器。它旨在便于创建适用于许多设备尺寸和方向的灵活布局。`ConstraintLayout` 使用约束来控制组件相对于父\
  \ `ConstraintLayout` 实例、指南、屏障以及布局中其他组件的对齐和定位。`ConstraintLayout` 是新创建 Android Studio\
  \ 项目的默认布局，也是设计用户界面布局时的推荐选择。\n\n# 19. 在 Android Studio 中使用 ConstraintLayout\n\n正如前面的章节多次提到的，Google\
  \ 对 Android Studio 布局编辑器工具进行了重大改进，其中许多完全是为了支持使用 `ConstraintLayout` 进行用户界面设计。既然上一章概述了\
  \ `ConstraintLayout` 的基本概念，本章将详细探讨这些概念，同时概述布局编辑器允许设计和实现基于 `ConstraintLayout` 的用户界面的方法。\n\
  \n### 19.1 设计视图和布局视图\n\n名为“Android Studio 布局编辑器指南`的章节解释了，Android Studio 布局编辑器工具提供了两种查看活动用户界面布局的方式，即设计（Design）和布局（Layout，也称为蓝图）视图。这些布局视图可以单独显示，也可以像图\
  \ 19-1 所示并排显示：\n\n![](img/as_4.1_layout_editor_previews.jpg)\n\n图 19-1\n\n\n\n\n\
  \n设计视图（位于上图左侧）提供了布局的“所见即所得”表示，其中布局的外观与其在运行应用程序中的显示完全一致。相反，布局视图（Layout view）显示的是蓝图风格的视图，其中组件由阴影轮廓表示。如上方的图\
  \ 19-1 所示，布局视图还会显示约束连接（在本例中，使用了用于将按钮居中布局的对立约束）。当选中布局中的特定小组件或鼠标指针悬停在设计区域上时，这些约束也会叠加在设计视图上，如图图\
  \ 19-2 所示：\n\n![](img/as_4.1_layout_editor_design_view.jpg)\n\nFigure 19-2\n\n两种视图中约束连接的显示都可以通过图\
  \ 19-3 所示的“视图选项”（View Options）菜单进行更改：\n\n![](img/as_show_constraints.jpg)\n\nFigure\
  \ 19-3\n\n除了显示用户界面布局两种模式外，布局编辑器工具还提供了三种建立特定布局设计所需约束的不同方法。\n\n### 19.2 自动连接模式 (Autoconnect\
  \ Mode)\n\n顾如其名，“自动连接”在项目被添加到布局中时会自动建立约束连接。可以使用图 19-4 所示的工具栏按钮来启用或禁用自动连接模式：\n\n\
  ![](img/as_autoconnect.jpg)\n\nFigure 19-4\n\n自动连接模式使用算法根据组件的位置以及该组件与父布局边界及布局中其他元素的接近程度，来决定建立的最佳约束。如果任何自动约束连接未能提供预期的行为，可以像本章稍后概述那样进行手动更改。\n\
  \n### 19.3 推断模式 (Inference Mode)\n\n推断模式使用涉及算法和概率的启发式方法，在组件已添加到布局后自动实现约束连接。这种模式通常用于关闭了自动连接功能且在没有任何约束连接的情况下将对象添加到布局时。这允许通过从调色板将对象拖放到布局画布上，并更改尺寸和位置，直到布局符合要求，从而简单地设计布局。本质上，这涉及到在不担心约束的情况下“绘制”布局。推断模式也可以在设计过程任何时候使用，以填充布局中缺失的约束。\n\
  \n当点击推断约束（Infer constraints）按钮（图 19-5）时，约束会自动添加到到布局中：\n\n![](img/as_inference_mode.jpg)\n\
  \nFigure 19-5\n\n与自动连接模式一样，布局编辑器工具始终存在推断出错误约束的可能，尽管这些约束可以手动进行修改和纠正。\n\n### 19.4\
  \ 手动操作约束 (Manipulating Constraints Manually)\n\n实现约束连接的第三种方法是手动操作。在此操作时，理解布局编辑器工具中组件周围出现的各种句柄将非常有帮助。例如，考虑图\
  \ 19-6 所示的组件：\n\n![](img/as_4.1_constraint_handles.jpg)\n\nFigure 19-6\n\n显然，弹簧状的线条\
  \ (A) 代表从组件侧边到目标已建立的约束连接。对象每个角上的小正方形标记 (B) 是缩放句柄，点击并拖动它们可用于调整组件尺寸。位于组件每侧的小圆圈句柄 (C)\
  \ 是侧边约束锚点。要创建约束连接，点击句柄并将生成的线条拖到要连接约束的元素（例如引导线或父布局侧边或另一个组件的侧边），如图图 19-7 所示。当连接到另一个组件的侧边时，只需将线条拖到该组件的侧边约束句柄并在组件和句柄高亮时释放线条。\n\
  \n![](img/as_4.1_constraint_drag_line.jpg)\n\nFigure 19-7\n\n如果将约束线拖到组件上并释放但未附加到约束句柄，则布局编辑器将显示一个菜单，其中列出了约束可以附加的侧边列表。在图\
  \ 19-8 中，约束可以附加到目标按钮组件的顶部或底部边缘：\n\n![](img/as_4.1_constraint_between_widgets.jpg)\n\
  \nFigure 19-8\n\n额外的标记指示了基线约束（baseline constraints）的锚点，其中组件内部的内容（而非外部边缘）用作对齐点。要显示此标记，只需右键点击组件并选择\
  \ `Show Baseline`（显示基线）菜单选项。要从基线约束句柄建立约束连接，只需将鼠标指针悬停在句柄上直到其高亮，然后点击并拖动到目标（例如另一个组件的基线锚点，如图图\
  \ 19-9 所示）。\n\n![](img/as_baseline_constraint.jpg)\n\nFigure 19-9\n\n要隐藏基线锚点，再次右键点击组件并选择\
  \ `Hide Baseline`（隐藏基线）选项。\n\n### 19.5 在检查器中添加约束 (Adding Constraints in Inspector)\n\
  \n还可以使用图 19-10 所示的属性窗口中的检查器（Inspector）面板，向视图添加约束。正中间的正方形代表当前选中的视图，周围的区域表示应用于视图侧边的约束（如果有）：\n\
  \n![](img/as_3.5_attributes.jpg)\n\nFigure 19-10\n\n视图侧边缺失约束由指向带有加号的蓝色圆圈的虚线表示（图中视图底部所示）。要添加约束，只需点击此蓝色圆圈，布局编辑器将向它认为最合适的目标添加约束。\n\
  \n### 19.6 在属性窗口中查看约束 (Viewing Constraints in Attributes Window)\n\n可以通过显示下方图 19-11\
  \ 所示的属性窗口中的约束部分来查看当前组件配置的约束列表：\n\n![](img/as_3.5_constraints_list.jpg)\n\nFigure\
  \ 19-11\n\n点击列表中的约束将选中设计布局中的该约束。\n\n### 19.7 删除约束 (Deleting Constraints)\n\n要删除单个约束，只需在设计布局或属性窗口中选中该约束使其高亮（例如在图\
  \ 19-12 中，选中了最右侧的约束），然后按下键盘上的删除键。该约束将从布局中移除。\n\n另一种选项是在按住 `Ctrl`（macOS 上为 `Cmd`）键的同时将鼠标指针悬停在约束锚点上，并在变为红色后点击它：\n\
  \n![](img/as_4.1_constraint_delete.jpg)\n\nFigure 19-13\n\n或者，通过右键点击组件并选择 `Clear\
  \ Constraints of Selection`（清除选择约束）菜单选项移除移除组件上的所有约束。\n\n要从布局中的每个组件删除所有约束，请使用图 19-14\
  \ 所示的高亮工具栏按钮：\n\n![](img/as_clear_constraints.jpg)\n\nFigure 19-14\n\n\n\n\n\n#\
  \ 19.8 调整约束偏置 (Bias)\n\n在上一节中，概述了使用偏置设置来偏向一个对立约束而非另一个的概念。Android Studio 布局编辑器工具中的偏置通过位于\
  \ `Attributes` 工具窗口中的 `Inspector` 检查器进行调整，如图 19-15 所示。图中由箭头指示的两个滑块用于控制当前选中组件的垂直和水平对立约束的偏置。\n\
  \n![](img/as_3.2_constraint_bias_sliders.jpg)\n\n图 19-15\n\n# 19.9 理解 ConstraintLayout\
  \ 边\n\n约束可以与边距（margins）结合使用，在组件与另一个元素（如另一个组件、辅助线或父布局侧边）之间实现固定间隙。例如，考虑应用于图 19-16\
  \ 中 `Button` 对象的水平约束：\n\n![](img/as_4.1_constraint_no_margins.jpg)\n\n图 19-16\n\n\
  按照当前配置，水平约束延伸到父 `ConstraintLayout` 的左右边缘。因此，该组件具有相互对立的水平约束，这意味着 `ConstraintLayout`\
  \ 布局引擎在运行时对组件的实际位置有一定的裁量权。这使得布局具有一定的活性，以适应不同的屏幕尺寸和设备方向。水平偏置设置还能控制组件的位置一直到布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏置的同一个按钮：\n\n![](img/as_4.1_constraint_bias_100.jpg)\n\n图\
  \ 19-17\n\n`ConstraintLayout` 边可以出现在约束连接的末端，代表一个固定间隙，即使在调整偏置或响应活动其他部分的布局变化时，组件也无法移动到该间隙内。在图\
  \ 19-18 中，右侧约束现在包含一个 `50dp` 的边，即使偏置仍设置为 100%，组件也无法移动到该边内。\n\n![](img/as_4.1_constraint_margin_50.jpg)\n\
  \n图 19-18\n\n组件上现有的边值可以在 `Inspector` 中进行修改。如图 19-19 所示，正在使用下拉菜单将当前选中组件的右侧边更改为 `16dp`。或者，点击当前值也可以在字段中输入数字。\n\
  \n![](img/as_3.2_constraint_set_margins.jpg)\n\n图 19-19\n\n新约束的默认边距可以随时使用图 19-20\
  \ 所示工具栏中高亮显示的选项进行更改：\n\n![](img/as_constraints_margins.jpg)\n\n图 19-20\n\n# 19.10\
  \ 对立约束和偏置的重要性\n\n正如在上一节中讨论的，当使用 `ConstraintLayout` 进行响应式布局时，对立约束、边和偏置构成了 Android\
  \ 响应式布局设计的基石。当组件被约束而没有对立的约束连接时，这些约束本质上是边约束。这在布局编辑器工具中通过带有边距测量的实线直线在视觉上给出了此示，如图 19-21\
  \ 所示。\n\n![](img/as_4.1_constraints_opposing.jpg)\n\n图 19-21\n\n上述约束本质上将组件固定在那个位置。结果是，如果设备旋转到横屏方向，组件将不再可见，因为垂直约束将其推出了设备屏幕的顶部边缘（如图\
  \ 19-22 所示）。如果应用程序在屏幕比设计过程中使用的更小的设备上运行，也会出现类似的问题。\n\n![](img/as_4.1_constraints_opposing_landscape.jpg)\n\
  \n图 19-22\n\n当实现对立约束时，约束连接由像弹簧一样的锯齿线表示（弹簧的比喻旨在表示组件的位置不是固定在绝对的 X 和 Y 坐标上的）：\n\n![](img/as_4.1_constraints_opposing_constrained.jpg)\n\
  \n图 19-23\n\n在上述布局中，垂直和水平偏置设置已配置妥，使得组件将始终位于距离父布局底部 90% 的距离以及距离左边缘 35% 的位置。因此，当旋转时，组件仍然可见，并且相对于屏幕尺寸处于相同的位置：\n\
  \n![](img/as_4.1_constraints_opposing_constrained_landscape.jpg)\n\n图 19-24\n\n\
  在设计响应式且自适应的用户界面布局时，在手动设计用户界面布局和对自动创建的约束进行修正时，同时考虑偏置和对立约束是非常重要的。\n\n# 19.11 配置组件维度\n\
  \n`ConstraintLayout` 中组件的内部维度也可以使用 `Inspector` 进行配置。正如上一节概述的，组件维度可以设置为 `wrap content`、固定或\
  \ `match constraint` 模式。如图 19-25 所示，当前选中组件的每个维度设置显示在代表组件的正方形内的 `Inspector` 中：\n\n\
  ![](img/as_3.2_constraint_dimensions.jpg)\n\n图 19-25\n\n在上述图中，水平和垂直维度均设置为 `wrap\
  \ content`（由向内箭头指示）。检查器使用以下视觉指示表示三种维度模式：\n\n| 固定尺寸 | `Image2826.jpg` |\n| --- |\
  \ --- |\n| 匹配约束 | `Image2834.jpg` |\n| 内容内容 | `Image2844.jpg` |\n\n表 1\n\n要更改当前设置，只需点击指示即可循环。当布局编辑器内视图的维度设置为匹配约束时，相应的边将用弹簧线而不是普通的直线绘制。例如，在图\
  \ 19-26 中，仅视图的宽度设置为匹配约束：\n\n![](img/Image2855.jpg)\n\n图 19-26\n\n此外，可以使用 `Expand\
  \ horizontally` 和 `Expand vertically` 选项根据布局中的约束和其他组件允许的最大量在水平或垂直方向上扩展组件的大小。可以通过右键点击布局中的组件并从生成的菜单中选择\
  \ `Organize` 选项来访问（图 19-27）。使用时，当前选中的组件将在水平或垂直方向上增大尺寸，以填充其周围的空间。\n\n![](img/as_4.1_constraint_organize_menu.jpg)\n\
  \n图 19-27\n\n# 19.12 设计时工具定位\n\nAndroid Studio 布局编辑器指南章节引入了 `tools` 命名空间的概念，并解释了如何使用它设置仅在布局编辑器中有效的可见性属性。在后台，Android\
  \ Studio 还使用 `tools` 属性在无约束放置在布局上时将组件保持在位置。例如，想象在禁用自动连接模式时将 `Button` 放置在布局上。虽然组件在预览画布上看起来位置正确，但在运行应用程序时，它将出现在屏幕的左上角。这是因为组件没有约束来告诉父级\
  \ `ConstraintLayout` 将其放置在哪里。\n\n\n\n\n小组件在布局编辑器中似乎位于正确位置，是因为 Android Studio 设置了绝对的\
  \ X 和 Y 定位工具属性，以便在添加约束条件之前将其保持在正确位置。在 XML 布局文件中，这些内容可能显示如下：\n\n```xml\n<Button\n\
  \    android:id=\"@+id/button4\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为小组件添加了足够的约束条件，布局编辑器就会移除这些工具属性。一种在无需等待应用运行即可快速识别哪些小组件缺少约束项的实用技巧，是点击图\
  \ 19-28 中高亮的按钮，以切换工具位置的可见性。任何跳转到左上角的**组件都是未完全约束的，它们正通过临时的工具绝对 X 和 Y 定位属性固定在位置。\n\
  \n![](img/as_4.1_toggle_tools_positions.jpg)\n\n图 19-28\n\n### 19.13 添加辅助线\n\n辅助线提供了可以锚定约束的额外元素。可以通过在布局上点击右键并选择\
  \ `Vertical Guideline`（垂直辅助线）或 `Horizontal Guideline`（水平辅助线）菜单选项，或者使用工具栏菜单选项如图 19-29\
  \ 所示来添加辅助线：\n\n![](img/as_guidelines_menu.jpg)\n\n图 19-29\n\n或者，也可以从 `Palette`（调色板）的\
  \ `Helpers`（助手）部分拖动水平和垂直 `Guidelines`，并放置在布局画布或 `Component Tree`（组件树）面板上，如图 19-30\
  \ 中的箭头所示：\n\n![](img/as_4.1_add_guideline_from_palette.jpg)\n\n图 19-30\n\n添加后，辅助线将以虚线的形式出现在布局中，可以通过简单的点击并拖动线条来移动。要建立到辅助线的约束连接，请点击小组件的约束处理器，并在释放前拖动到辅助线。在图\
  \ 19-31 中，两个 `Buttons`（按钮）的左侧通过约束连接到垂直辅助线。\n\n垂直辅助线的位置可以指定为距离父布局左侧或右侧的绝对距离（水平辅助线则为顶部或底部）。例如，上图中的垂直辅助线位于父布局左边缘\
  \ 96dp 处。\n\n![](img/as_4.1_constraint_guidline.jpg)\n\n图 19-31\n\n或者，辅助线也可以相对于父布局总宽度或高度的百分比进行定位。要在这这三种模式之间切换，选择辅助线并点击辅助线顶部或起始处的圆形（取决于辅助线是垂直还是水平的）。例如，图\
  \ 19-32 显示了基于百分比定位的辅助线：\n\n![](img/as_4.1_constraint_guideline_percentage.jpg)\n\
  \n图 19-32\n\n### 19.14 添加屏障\n\n通过在布局上点击右键并在 `Add helpers...` 菜单中选择 `Vertical Barrier`（垂直屏障）或\
  \ `Horizontal Barrier`（水平屏障）选项，或者像图 19-29 所示使用工具栏菜单选项可以添加屏障。或者，在 `Palette` 的 `Helpers`\
  \ 部分找到 `Barrier` 类型，并将其拖放到布局画布或 `Component Tree` 面板上。\n\n一旦在布局中添加了屏障，它将作为 `Component\
  \ Tree` 面板中的一个项出现：\n\n![](img/as_4.2_barrier_added.jpg)\n\n图 19-33\n\n要将视图作为引用视图（即控制屏障位置的视图），只需将组件从\
  \ `Component Tree` 内部拖动到屏障项上。例如，在图 19-34 中，名为 `textView1` 和 `textView2` 的组件已被分配为\
  \ `barrier1` 的引用组件：\n\n![](img/as_4.2_barrier_children.jpg)\n\n图 19-34\n\n添加引用视图后，需要配置屏障以指定屏障相对于这些视图的方向。这是屏障方向设置，当在\
  \ `Component Tree` 面板中选择屏障时，它在 `Attributes`（属性）工具窗口中定义：\n\n![](img/as_4.1_layout_barrier_direction.jpg)\n\
  \n图 19-35\n\n下图显示了一个包含屏障的布局，其中 `textView1` 和 `textView2` 作为引用视图，`textview3` 作为受约束视图。由于屏障是从引用视图的末端向受约束视图推挤，因此屏障方向已设置为\
  \ `end`（末端）：\n\n![](img/as_3.5_constraints_barrier.jpg)\n\n图 19-36\n\n### 19.15\
  \ 添加组\n\n要向布局中添加 `Group`（组），在布局上点击右键并在 `Add helpers...` 菜单中选择 `Group` 选项，或者使用如图\
  \ 19-29 所示的工具栏菜单选项。或者，在 `Palette` 的 `Helpers` 部分找到 `Group` 项并将其拖放到布局画布或 `Component\
  \ Tree` 面板上。\n\n要向组添加组件，在 `Component Tree` 中选择它们并拖到组项上。例如，图 19-37 显示了将三个三个组件添加到组中：\n\
  \n![](img/as_4.1_add_widgets_to_group.jpg)\n\n图 19-37\n\n组引用的任何组件将以斜体显示在 `Component\
  \ Tree` 中的组项下方，如图 19-38 所示。要从组中移除组件，只需选择它并点击删除：\n\n![](img/as_4.1_group_list.jpg)\n\
  \n图 19-38\n\n一旦组件被分配给组，使用 `Attributes` 工具窗口的 `Constraints`（约束）部分来修改可见性：\n\n![](img/as_4.1_group_visibility.jpg)\n\
  \n图 19-39\n\n### 19.16 使用 Flow 辅助器\n\n可以像之前概述其他辅助器一样使用菜单或 `Palette` 添加 Flow 辅助器。与\
  \ `Group` 辅助器一样（如图 19-37 所示），可以通过将组件从 `Component Tree` 拖动到 Flow 项来添加。添加辅助器并为其分配组件后，在\
  \ `Component Tree` 中选择它并使用 `Attribute` 工具窗口的 `Common Attributes`（常用属性）部分来配置布局行为：\n\
  \n![](img/as_4.1_flow_attributes.jpg)\n\n图 19-40\n\n### 19.17 组件组对齐与分布\n\n当在布局中选择两个或多个组件时，Android\
  \ Studio 布局编辑器工具提供了系列对齐和分布操作。只需 Shift 点击要包含的操作的每个组件，在布局上点击右键并从 `Align` 菜单显示的许多选项中进行选择：\n\
  \n![](img/as_layout_align_menu.jpg)\n\n图 19-41\n\n如下方的图 19-42 所示，这些选项也可以通过布局编辑器工具栏上的\
  \ `Align` 按钮访问：\n\n![](img/as_align_menu.jpg)\n\n图 19-42\n\n同样，`Pack` 菜单（图 19-43）可用于集体重新定位所选组件，使其在垂直或水平方向上紧凑在一起。它通过更改组件的绝对\
  \ X 和 Y 来实现，但不会应用任何约束。另一方面，`Pack` 菜单中的两个分布选项会移动所选组件，使其在垂直或水平轴上均匀间距，并在视图之间应用约束以保持这种间距。\n\
  \n![](img/as_3.2_constraints_pack_menu.jpg)\n\n图 19-43\n\n\n\n# 19.18 将其他布局转换为 ConstraintLayout\n\
  \n对于使用一个或多个其他 Android 布局类（如 `RelativeLayout` 或 `LinearLayout`）的现有用户界面布局，`Layout\
  \ Editor（布局编辑器）`工具提供了将用户界面转换为 `ConstraintLayout` 的选项。\n\n当打开 `Layout Editor`工具并处于\
  \ Design（设计）模式时，`Component Tree（组件树）`面板会在`Palette（调色板）`下方。要把布局转换为 `ConstraintLayout`，可以在`Component\
  \ Tree`中找到它，右键点击它并选择`Convert <current layout> to Constraint Layout（将当前布局转换为 Constraint\
  \ Layout）`菜单选项：\n\n![](img/as_3.4_convert_to_constraintlayout.jpg)\n\n图 19-44\n\n\
  选择此菜单选项后，`Android Studio` 将将定的布局转换为 `ConstraintLayout`，并使用推理建立旨在匹配原始布局类型行为的约束。\n\
  \n### 19.19 总结\n\n重新设计的 `Layout Editor`工具结合 `ConstraintLayout`使得使用 `Android Studio`\
  \ 设计复杂的用户界面布局变成一个相对快速且直观的过程。本章详细介绍了约束、外边距（margins）和偏置（bias）的概念，同时也探索了基于 `ConstraintLayout`的设计是如何集成到\
  \ `Layout Editor`工具中的。\n\n# 20 在 Android Studio 中使用 ConstraintLayout 链和比例\n\n之前的章节介绍了\
  \ `ConstraintLayout` 类的关键特性，并概述了在 `Android Studio Layout Editor` 中基于 `ConstraintLayout`\
  \ 的用户界面设计的最佳实践。尽管 `ConstraintLayout` 链（chains）和比例的概念在“Android ConstraintLayout 指南”\
  \ 章节中已经过概述，但我们尚未讨论如何在 `Layout Editor` 中利用这些功能。因此，本章的重点是提供在使用 `ConstraintLayout`\
  \ 类时创建和管理链与比例的实用步骤。\n\n### 20.1 创建链（Chain）\n\n链可以通过向 Activity 的 XML 布局资源文件添加几行代码，或者使用\
  \ `Layout Editor` 的某些链特有特性来实现。\n\n考虑一个包含三个 `Button` 控件的布局，这些控件被约束为位于 `ConstraintLayout`\
  \ 父布局的左上角、顶部中央和右上角，如图图 20-1 所示：\n\n![](img/as_4.1_layout_buttons_no_chain.jpg)\n\
  \n图 20-1\n\n为了表示此类布局，XML 资源布局文件可能包含以下按钮控件条目：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n按照目前的配置，没有双向约束将这些控件分组成一条链。为了解决这个问题，需要从 `button1` 的右侧到 `button2`\
  \ 的左侧添加额外的约束，并从 `button3` 的左侧到 `button2` 的右侧添加约束，如下：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n通过这些更改，控件现在具有了双向约束。\n\n### 20.2 链样式（Chain Style）\n\n如果没有配置链样式，`ConstraintLayout`\
  \ 将默认使用散布（spread）链样式。可以通过右键点击链中的任何控件并选择`Cycle Chain（循环链）`菜单选项来更改链样式。每次点击菜单选项，样式都会在`spread`、`spread\
  \ inside（内部散布）`和`packed（打包）`之间切换。\n\n或者，可以在 `Attributes` 窗口中展开 `layout_constraints`\
  \ 属性，并根据链的方向更改 `horizontal_chainStyle` 或 `vertical_chainStyle` 属性：\n\n```image\n\
  image/as_4.1_chain_style.jpg\n```\n\n图 20-3\n\n### 20.3 内部散布链样式\n\n图 20-4 展示了使用上述技术将链样式更改为内部散布链式的效果：\n\
  \n```image\nimage/as_4.1_layout_horizontal_chain_spread_inside.jpg\n```\n\n图 20-4\n\
  \n### 20.4 打包链样式\n\n使用相同的技术，将链样式属性更改为 `packed`，布局的变化将如图 20-5 所示：\n\n```image\nimage/as_4.1_layout_horizontal_chain_packed.jpg\n\
  ```\n\n图 20-5\n\n### 20.5 带偏置的打包链样式\n\n打包链的位置受到应用偏置值的影响。偏置可以是 `0.0` 到 `1.0` 之间的任何值，`0.5`\
  \ 代表父布局的中心。偏置通过选择链头控件并在 `Attributes` 面板中为 `layout_constraintHorizontal_bias` 或 `layout_constraintVertical_bias`\
  \ 属性赋值来控制。图 20-6 显示了一个水平偏置设置为 `0.2` 的打包链：\n\n```image\nimage/as_4.1_layout_horizontal_chain_packed_bias.jpg\n\
  ```\n\n图 20-6\n\n### 20.6 加权链（Weighted Chain）\n\n\n\n\n链的探索的最后一个区域涉及对单个控件进行加权，以控制链中每个控件在可用空间中所占的比例。加权链仅可以使用散布链（spread\
  \ chain）样式实现，并且链中任何需要响应权重属性的控件都必须将其相应的尺寸属性（垂直链为 `height`，水平链为 `width`）配置为匹配约束（match\
  \ constraint）模式。控件尺寸的匹配约束模式可以通过选择该控件、显示“属性”（Attributes）面板并将尺寸更改为 `match_constraint`（等同于\
  \ `0dp`）来配置。例如，在图 20-7 中，按钮的 `layout_width` 约束已设置为 `match_constraint`（`0dp`），表示该控件的宽度将根据现有的约束设置来确定：\n\
  \n![](img/as_3.5_chain_match_constraints.jpg)\n\n图 20-7\n\n假设已选择散布链样式，并且三个按钮都已配置为宽度维度设置为匹配约束，则链中的控件将等比例扩展以填充可用空间：\n\
  \n![](img/as_4.1_layout_horizontal_chain_match_constraints.jpg)\n\n图 20-8\n\n每个控件相对于链中其他控件的占空间大小可以通过向控件添加权重属性来控制。图\
  \ 20-9 显示了了将 `button1` 的 `layout_constraintHorizontal_weight` 属性设置为 `4`，将 `button2`\
  \ 和 `button3` 设置为 `2` 的效果：\n\n![](img/as_4.1_layout_horizontal_chain_weight.jpg)\n\
  \n图 20-9\n\n由于这些权重值，`button1` 占据了空间的一半 (4/8)，而 `button2` 和 `button3` 各占据了空间的四分之一\
  \ (2/8)。\n\n### 20.7 使用比例\n\n`ConstraintLayout` 比例允许控件的一个维度相对于控件的另一个维度（也称为纵横比）进行尺寸调整。例如，可以将宽高比例设置应用到\
  \ `ImageView`，以确保其宽度始终是其高度的两倍。\n\n尺寸比例约束是通过将受约束的维度设置为匹配约束模式，并将该控件上的 `layout_constraintDimensionRatio`\
  \ 属性配置为所需的比例来实现的。该比例值可以指定为浮点值或 `width:height` 比例设置。例如，接下来的 XML 代码段为 `ImageView`\
  \ 控件配置了 2:1 的比例：\n\n```xml\n<ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  100dp\"\n    android:id=\"@+id/imageView\"\n    app:layout_constraintDimensionRatio=\"\
  2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为匹配约束时如何配置比例。当两个维度都设置为匹配约束模式时，也可以应用比例。这涉及到指定比例并在前面加上\
  \ `H` 或 `W`，以指示哪一个维度是相对于另一个维度进行受约束的。\n\n例如，考虑以下针对 `ImageView` 对象的 XML 代码段：\n\n```xml\n\
  <ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n\
  \    android:id=\"@+id/imageView\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintRight_toRightOf=\"parent\"\n    app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    app:layout_constraintDimensionRatio=\"\
  W,1:3\" />\n```\n\n在上面的示例中，高度将根据应用于它的约束来定义。在这种情况下，约束已配置为使其连接到父视图的顶部和底部，实质上是拉伸控件以填充父视图的的高度。另一方面，宽度维度被约束为\
  \ `ImageView` 高度的三分之一。因此，无论布局显示在什么尺寸的屏幕或方向上，`ImageView` 的高度始终与父视图相同，宽度为该高度的三分之一。\n\
  \n在不需要手动编辑 XML 资源文件的情况下也可以相同的结果。每当控件维度设置为匹配约束模式时，属性面板的检查器（Inspector）区域就会出现比例控制开关。例如，图\
  \ 20-10 显示了按钮控件的布局宽度和高度属性分别设置为匹配约束模式和 `100dp`，并高亮了控件尺寸预览中的比例控制开关：\n\n![](img/as_3.2_toggle_aspect_ratio_constraint.jpg)\n\
  \n图 20-10\n\n默认情况下，比例尺寸控制是关闭的。点击该控件可以启用比例约束并显示一个额外的字段，可以在该字段更改比例：\n\n![](img/as_3.2_toggle_aspect_ratio_settings.jpg)\n\
  \n图 20-11\n\n### 20.8 总结\n\n链和比例都是 `ConstraintLayout`类的强大功能，旨在为设计灵活的响应式用户界面布局提供额外的选项。正如本章所述，Android\
  \ 布局编辑器已经过增强，使得使用这些功能更加容易。\n\n# 21. Android Studio 布局编辑器 ConstraintLayout 教程\n\n\
  到为止，为 Android 应用设计用户界面最简单且最高效的方法是利用布局编辑器。本章将提供如何使用这种方法创建基于 ConstraintLayout 的用户界面概述。本章包含的练习也将作为从“空白骨架”Android\
  \ Studio 项目创建活动的机会。\n\n### 21.1 Studio 编辑器工具示例\n\n目前，为 Android 应用设计用户界面最简单且最高效的方法是利用布局编辑器。本章将提供如何使用这种方法创建基于\
  \ ConstraintLayout 的用户界面概述。本章包含的练习也将作为从“空白骨架”Android Studio 项目创建活动的机会。\n\n21.1 创建新项目\n\
  \n此示例阶段的第一步是创建一个 Android Studio 项目。首先启动 Android Studio 并通过选择 `File -> Close Project`\
  \ 菜单选项关闭已打开的项目。\n\n在欢迎屏幕上选择 `New Project` 。在之前的示例中，我们要求 Android Studio 为项目创建一个模板活动。然而，我们将使用本教程学习手动创建一个活动以及相应的布局文件，因此在点击\
  \ `Next` 按钮之前，请确保选择了 `No Activity` 选项。\n\n在 `Name` 字段中输入 `LayoutSample` 并指定包名为 `com.ebookrenzy.layoutsample`。在点击\
  \ `Finish` 按钮之前，将 `Minimum API` 级别更改为 `API 26: Android 8.0 (Oreo)`并将 `Language`\
  \ 菜单更改为 `Java`。\n\n21.2 创建新活动\n\n一旦项目创建完成，Android Studio 主窗口将出现，我们准备好创建一个新活动。这将是一个非常有价值的学习练习，因为在开发\
  \ Android 应用的过程中有很多情况需要从头开始创建活动。\n\n如果 `Project` 工具窗口尚未显示，请使用 `Alt-1/Cmd-1` 快捷键显示它。一旦显示了\
  \ Android 层次结构，点击 Project 窗口项目旁边的右箭头展开它。这里的目标是访问项目层次结构中的 `app -> java -> com.ebookrenzy.layoutsample`\
  \ 文件夹。一旦包名可见，右键点击它并选择 `New -> Activity -> Empty Activity` 菜单选项，如图 21-1 所示。\n\n![](img/Image2435.jpg)\n\
  \n图 21-1\n\n\n\n\n在生成的 New Android Activity 对话框中，将新活动命名为 `MainActivity`，并将布局命名为\
  \ `activity_main`。当然，活动需要一个布局资源文件，因此请确保启用了 `Generate a Layout File` 选项。\n\n为了让应用程序能够在设备上运行，它需要一个指定为启动活动（launcher\
  \ activity）的活动。如果没有启动活动，操作系统在应用程序首次启动时将不知道启动哪个活动，导致应用程序无法启动。由于此示例只有一个活动，因此它需要被指定为应用程序的启动活动，所以在在点击\
  \ `Finish` 按钮之前，请确保启用了 `Launcher Activity` 选项。\n\n此时，Android Studio 应该已经向项目添加了两个文件。该活动的\
  \ Java 源代码文件位于 `app -> java -> com.ebookfrenzy.layoutsample` 文件夹中。\n\n此外，用户界面的 XML\
  \ 布局文件应该已在 `app -> res -> layout` 文件夹中创建。请注意，此活动选择了 `Empty Activity` 模板，因此布局完全包含在\
  \ `activity_main.xml` 文件中，没有单独的内容布局文件。此外，由于我们不会编写任何代码来访问用户界面布局中的视图，因此没有必要将项目转换为支持视图绑定（view\
  \ binding）。\n\n最后，新活动应该已添加到 `AndroidManifest.xml` 文件中并指定为启动活动。可以在项目窗口的 `app -> manifests`\
  \ 文件夹下找到清单文件，它应该包含以下 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    package=\"com.ebookfrenzy.layoutsample\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:dataExtractionRules=\"\
  @xml/data_extraction_rules\"\n        android:fullBackupContent=\"@xml/backup_rules\"\
  \n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.LayoutSample\"\n        tools:targetApi=\"\
  31\">\n        <activity\n            android:name=\".MainActivity\"\n         \
  \   android:exported=\"true\" >\n            <intent-filter>\n                <action\
  \ android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n\
  \    </application>\n</manifest>\n```\n\n### 21.3 准备布局编辑器环境\n\n找到并双击 `app -> res\
  \ -> layout` 文件夹中的 `activity_main.xml` 布局文件，将其加载到 `Layout Editor` 工具中。由于本教程的目的是获得使用约束（constraints）的经验，请使用\
  \ `Layout Editor` 工具栏上的按钮关闭 `Autoconnect` 功能。禁用后，该按钮将显示带一条划线，如图 21-2 所示：\n\n![](img/as_autoconnect_off.jpg)\n\
  图 21-2\n\n如果 `Autoconnect` 按钮右侧的默认边距值未设置为 `8dp`，请点击它并在弹出的面板中选择 `8dp`。\n\n用户界面设计还将使用\
  \ `ImageView` 对象来显示图像。在继续之前，应将此图像添加到项目中，以便在随后的章节中使用。该文件名为 `galaxysys6.png`，可以在以下\
  \ URL 下载的示例代码的 `project_icons` 文件夹中找到：[`www.ebookfrenzy.com/retail/eeljava/index.php`](https://www.ebookfrenzy.com/retail/eeljava/index.php)。\n\
  \n### 21.4 向用户界面添加小部件\n\n在项目的 `res -> drawables` 部分，导入 `galaxys6.png` 图像。使用 `Resource\
  \ Manager` 工具（`View -> Resource Manager`），找到 `galaxys6.png` 文件并点击 `Import` 按钮将图像添加到项目中。现在图像应该会显示在布局中，如图\
  \ 21-3 所示：\n\n![](img/as_layout_editor.jpg)\n图 21-3\n\n从 `Common` 类别中拖入 `ImageView`\
  \ 对象到布局中心。放置后，使用缩放句柄调整 `ImageView` 的大小，并如图 21-5 所示重新调整位置：\n\n![](img/as_layout_editor.jpg)\n\
  图 21-5\n\n从 `Common` 部分点击并拖动 `TextView` 对象，并将其放置在 `ImageView` 之上。使用 `Attributes`\
  \ 面板，展开 `Common` 部分中的 `textAppearance` 条目，将 `textSize` 属性更改为 `24sp`，将 `textAlignment`\
  \ 设置为 `center`，并将文本更改为 `Samsung Galaxy S6`。\n\n![](img/as_layout_editor.jpg)\n图\
  \ 21-\n\n接下来，在布局底部添加三个 `Button` 小部件，并将这些视图的 `text` 属性设置为 `Buy Now`、`Pricing` 和 `Details`。完成后的布局现在应该与图\
  \ 21-8 所示：\n\n![](img/as_layout_editor.jpg)\n图 21-8\n\n### 21.5 添加约束\n\n约束是创建能够适应设备方向变化和不同屏幕尺寸布局的关键。首先将布局旋转回竖屏方向，并选择位于\
  \ `ImageView` 之方的 `TextView` 小部件。选中该部件后，将 `TextView` 的 `left`、`right` 和 `top` 侧约束到父级\
  \ `ConstraintLayout` 的相应侧，如图 21-10 所示：\n\n![](img/as_layout_editor.jpg)\n图 21-10\n\
  \n\n\n\n在约束好 `TextView` 小部件后，选择 `ImageView` 实例并在左侧和右侧建立相对的约束，每个侧都连接到父布局的对应侧。接下来，建立从\
  \ `ImageView` 顶部到 `TextView` 底部的约束连接，以及从 `ImageView` 底部到中间 `Button` 小部件顶部的约束连接。如有必要，点击并拖动\
  \ `ImageView`，使其保持在布局的垂直居中位置。\n\n在 `ImageView` 仍被选中的状态下，使用属性面板中的 `Inspector` 将 `ImageView`\
  \ 的顶部和底部外边距分别更改为 `24` 和 `8`，并将控件的高度和宽度维度属性均更改为 `match_constraint`，这样控件将能够调整大小以匹配约束。这些设置将允许布局引擎在需要时放大或缩小\
  \ `ImageView` 的尺寸以适应布局变化：\n\n![](img/as_33_layout_attributes.jpg)\n\n图 21-11\n\n\
  图 21-12 显示了 `ImageView` 相对于布局中其他元素的当前实现的约束：\n\n![](img/as_4.1_layout_sample_ui_constrained.jpg)\n\
  \n图 21-12\n\n最后一个任务是对三个 `Button` 小部件添加约束。在本示例中，按钮将放置在一个链中。首先，在 `Layout Editor` 中开启\
  \ `Autoconnect`，方法是点击图 21-2 中亮的工具栏按钮。\n\n接下来，点击 `Buy Now` 按钮，然后按住 Shift 并点击另外两个按钮，使三个按钮都被选中。右键点击\
  \ `Buy Now` 按钮，并在弹出的菜单中选择 `Chains` -> `Create Horizontal Chain` 选项。默认情况下，链将使用 `spread`\
  \ 样式显示，这是本示例的正确行为。\n\n最后，在 `Buy Now` 按钮与布局底部之间建立约束。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应按照图\
  \ 21-13 所示的方案进行约束：\n\n![](img/as_4.1_layout_sample_chain.jpg)\n\n图 21-13\n\n###\
  \ 21.6 测试布局\n\n在布局中添加约束后，将屏幕旋转到横屏模式，并验证布局是否适应新的屏幕尺寸。\n\n虽然 `Layout Editor` 工具提供了一个实用的视觉环境来设计用户界面布局，但在测试方面，运行中的应用测试是不可替代的。在物理\
  \ Android 设备或模拟器会话上启动应用，验证用户界面是否反映了在 `Layout Editor` 中创建的布局。例如，图 21-14 显示了横屏模式下运行的应用：\n\
  \n![](img/as_4.1_layout_sample_completed.jpg)\n\n图 21-14\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。只需将视图拖放到显示器上，并根据需要进行定位、约束和设置属性即可。\n\
  \n## 21.7 使用布局检查器 (Layout Inspector)\n\n可以随时使用 `Layout Inspector` 工具查看构成用户界面布局的组件层级结构。要访问这些信息，应用必须在运行\
  \ `Android API 29` 或更高版本的设备或模拟器上运行。一旦应用运行，选择 `Tools` -> `Layout Inspector` 菜单选项，然后使用下方图\
  \ 21-15 中标记为 `A` 的菜单选择要检查的进程。\n\n一旦检查器加载，最左侧的面板 (B) 显示构成用户界面布局的组件层级结构。中间面板 (C) 显示布局设计的视觉表示。点击视觉布局中的小部件将导致该项在层级列表中高亮显示，从而轻松找到视觉组件相对于整体布局层级结构的位置。\n\
  \n最后，最右侧的面板（在图 21-15 中标记为 `D`）包含当前所选组件的所有属性设置，允许对组件的内部配置进行深入分析。在适当的情况下，值单元格将包含一个指向项目源代码中该属性设置位置的链接。\n\
  \n![](img/as_layout_inspector.jpg)\n\n图 21-15\n\n要以 3D 视图查看布局，点击标记为 `E` 的按钮。这将显示层级的“爆炸”表示，以便对其进行旋转和检查。这对于识别被遮的视图等任务非常有用：\n\
  \n![](img/as_layout_inspector_3D.jpg)\n\n图 21-16\n\n点击并拖动渲染图以进行三维空间旋转，使用上图中箭头指示的滑块增加层之间的间距。再次点击标记为\
  \ `E` 的按钮返回 2D 视图。\n\n### 21.8 总结\n\nAndroid Studio 中的 `Layout Editor` 工具与 `ConstraintLayout`\
  \ 类紧密集成。本章通过创建一个示例用户界面的过程，概述了如何使用 `Layout Editor` 工具在添加小部件和设置约束方面实现基于 `ConstraintLayout`\
  \ 的用户界面。本章还引入了 `Live Layout Inspector` 工具，它对于分析用户界面布局的结构组成非常有帮助。\n\n## 22. 在 Android\
  \ Studio 中使用手动 XML 设计布局\n\n虽然使用 Android Studio 布局工具设计布局极大地提高了生产力，但仍然可以通过手动编辑 XML\
  \ 来创建布局。本章将介绍 XML 布局文件的基础。\n\n### 22.1 手动创建 XML 布局\n\nXML 布局的结构实际上简单，遵循视图树的分层方法。\
  \ XML 文件的第一行应包含以下声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n```\n\
  \n该声明之后应该是布局的根元素，通常是一个容器视图。它由起始标签、结束标签以及需要设置在视图上的任何属性组成。例如，以下 XML 定义了一个 `ConstraintLayout`\
  \ 作为根元素，并设置了 `match_parent` 属性以填充设备的可用空间：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"\
  16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n   \
  \ android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意，在上面的示例中，布局元素还配置了四周 `16dp` 的内边距。Android 布局中的任何间距规范都必须使用测量单位之一：\n\n- `in`\
  \ – 英寸。\n- `mm` – 毫米。\n- `pt` – 磅（1/72 英寸）。\n- `dp` – 密度独立像素。基于设备显示密度相对于 160dpi\
  \ 基准的抽象测量单位。\n- `sp` – 缩放像素。与 dp 相似，但会根据用户的字体偏好进行缩放。\n- `px` – 实际像素。不建议使用，因为不同显示器的像素不同。优先使用\
  \ `dp`。\n\n\n\n\n任何添加到 `ConstraintLayout` 父布局的元素都必须嵌套在起始和结束标签之间。在以下示例中，一个 `Button`\
  \ 控件已作为 `ConstraintLayout` 的子元素添加：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <Button\n        android:text=\"My Button\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/button\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\
  按照目前的实现，按钮没有任何约束连接。因此，在运行时，按钮将出现在屏幕的左上角（尽管由于父布局分配的内边距，它缩进了 16dp）。然而，如果在按钮两侧添加了相对的约束，它将显示在布局的中央：\n\
  \n```xml\n<Button\n    android:text=\"My Button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/button\"\n \
  \   app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n要向布局中添加第二个控件，只需将其嵌入 `ConstraintLayout` 元素的正文中即可。例如，以下修改向布局中添加了一个\
  \ `TextView` 控件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingRight=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        android:text=\"@string/button_string\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/button\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n     \
  \   app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n    <TextView\n\
  \        android:text=\"My Text\"\n        android:layout_width=\"wrap_content\"\
  \n        android:layout_height=\"wrap_content\"\n        android:id=\"@+id/textView\"\
  \ />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n再次，由于新添加的 `TextView`\
  \ 缺少约束，它在运行时将出现在布局的左上角。以下修改添加了与父布局连接的相对约束，以使控件水平居中，同时还添加了一个将 `TextView` 底部连接到 `button`\
  \ 顶部的约束：\n\n```xml\n<TextView\n    android:text=\"My Text\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/textView\"\
  \n    app:layout_constraintBottom_toTopOf=\"@+id/button\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n\n\n\n\n与编写 Java 代码相比，使用 XML 资源文件设计用户界面具有许多关键优势。事实上，Google 在\
  \ Android 文档中花费了大量精力赞扬 XML 资源优于 Java 代码的优点。正如前一节讨论的，XML 方案的一个关键优势包括可以使用 Android\
  \ Studio 布局编辑器（Layout Editor）工具，该工具本身可以生成 XML 资源。另一个优势是，一旦创建了应用程序，只需修改 XML 文件即可对用户界面进行更改，从而避免了重新编译应用程序的必要性。此外，即使手动编写\
  \ XML 布局，也可以通过 Android Studio 布局编辑器的预览功能获取用户界面外观的即时反馈。而要测试通过 Java 创建的用户界面，开发者不可避免地需要反复循环“编写代码、编译和测试”的步骤来完成设计工作。\n\
  \n在 Java 编码创建布局的优势方面，Java 优于 XML 资源文件最显著的优势可能在处理动态用户界面时发挥作用。XML 资源文件在定义静态布局时本质上最有用，换句话说，就是从每次\
  \ Activity 调用到下一次调用之间不太发生显著变化的布局。另一方面，Java 代码非常适合在运行时动态创建用户界面。当用户界面可能受外部因素影响而在每次执行\
  \ Activity 时显示不同时，这种方法尤为有用。\n\n当需要在 Activity 运行期间实时对基于静态 XML 资源文件的布局进行动态更改时，在 Java\
  \ 代码中处理用户界面组件的知识也会有用。\n\n最后，一些开发者简单地倾向于编写 Java 代码而不是使用布局工具和 XML，无论后者的方法提供了哪些优势。\n\
  \n## 23.2 创建视图\n\n如前所述，Android SDK 包含了一个视图类工具箱，旨在满足大多数基本用户界面设计需求。在 Java 中创建视图简单来说就是创建这些类的实例，并将与该视图要关联的\
  \ Activity 引用作为参数传递。\n\n第一个视图（通常是一个可以添加额外子视图的容器视图）通过调用 Activity 的 `setContentView()`\
  \ 方法向用户显示。可以通过调用对象的 `addView()` 方法向根视图添加额外的视图。\n\n当使用 Java 代码操作位于 XML 布局资源文件中的包含的视图时，必须获取视图的\
  \ ID。在 Java 中创建的视图也遵循相同的规则。因此，对于后续 Java 代码中需要某些类型访问的任何视图，必须为其分配一个 ID。这是通过调用相关视图对象的\
  \ `setId()` 方法实现的。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n## 23.3 视图属性\n\n每个视图类都关联有一系列属性。这些属性设置直接设置在视图实例上，通常定义了视图对象的外观或行为。属性的示例包括在\
  \ `Button` 对象上显示的文本，或 `ConstraintLayout` 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码内部调用该方法以将按钮上显示的文本设置为特定的字符串值。另一方面，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackgroundColor()` 方法设置。\n\n## 23.4 约束集\n\n虽然属性设置是视图对象内部的，并决定了视图的外观和行为，但约束集（constraint\
  \ sets）被用于控制视图相对于其父视图和其他兄弟视图显示方式。每个 `ConstraintLayout` 实例都关联有一组约束，定义了其子视图是如何定位和约束的。\n\
  \n在 Java 代码中处理约束集的关键是 `ConstraintSet` 类。该类包含一系列方法，允许执行诸如创建、配置和将约束应用到 `ConstraintLayout`\
  \ 实例等任务。此外，`ConstraintLayout` 实例的当前约束可以复制到 `ConstraintSet` 对象中，并用于将相同的约束应用于其他布局（带有或不带修改）。\n\
  \n`ConstraintSet` 实例的创建就像任何其他 Java 对象一样：\n\n```java\nConstraintSet set = new ConstraintSet();\n\
  ```\n\n一旦创建了约束集，就可以在该实例上调用方法来执行广泛的任务。\n\n### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()`\
  \ 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中 `Button` 视图的左侧连接到 `EditText` 视图的右侧，并留有 70dp 的间距：\n\
  \n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n              editText1.getId(),\
  \ ConstraintSet.RIGHT, 70);\n```\n\n### 23.4.2 应用布局应用\n\n一旦配置了约束集，必须将其应用到 `ConstraintLayout`\
  \ 实例才能生效。通过调用 `applyTo()` 方法应用约束集，并传递要应用设置的布局对象的引用：\n\n```java\nset.applyTo(myLayout);\n\
  ```\n\n### 23.4.3 父级约束连接\n\n也可以通过 `ConstraintSet.PARENT_ID` 常量在子视图与其父 `ConstraintLayout`\
  \ 之间建立连接。在下面的示例中，约束集被配置为将 `Button` 视图的顶部连接到父布局的顶部，留有 100dp 的间距：\n\n```java\nset.connect(button1.getId(),\
  \ ConstraintSet.TOP,\n            ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n\
  ```\n\n### 23.4.4 尺寸约束\n\n有很多方法可以控制视图的尺寸行为。以下代码将 `Button` 视图的水平尺寸设置为 `wrap_content`，并将\
  \ `ImageView` 实例的垂直尺寸最大为 250dp：\n\n```java\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainMaxHeight(imageView1.getId(), 250);\n\
  ```\n\n### 23.4.5 约束偏移\n\n正如在 Android Studio 中使用 ConstraintLayout 的指南 章节所述，当一个视图具有相反的约束时，它会在约束轴上居中（即水平或垂直）。可以通过在特定的约束轴上应用偏移（bias）来调整这种居中。在使用\
  \ Android Studio 布局编辑器时，这是通过工具窗口中的控件实现的。然而，在使用约束集时，可以使用 `setHorizontalBias()` 和\
  \ `setVerticalBias()` 方法添加偏移，引用视图 ID 和 0 到 1 之间的浮点值作为偏移量。\n\n以下代码例如，先将 `Button`\
  \ 的左侧和右侧约束到父布局的相应侧边，然后应用 25% 的水平偏移：\n\n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n\
  \            ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT,\n            ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\n### 23.4.6 对齐约束\n\n\
  \n\n\n也可以使用约束集（constraint set）应用对齐方式。Android Studio 布局编辑器提供的完整对齐选项也可以通过 `centerVertically()`\
  \ 和 `centerHorizontally()` 方法使用约束集进行配置，这两个方法都会根据正在配置的对齐方式接收不同的参数。此外，可以使用 `center()`\
  \ 方法将视图在两个其他视图之间居中。\n\n在下面的代码中，`button2` 的位置设置使其与 `button1` 水平对齐：\n\n```java\nset.centerHorizontally(button2.getId(),\
  \ button1.getId());\n```\n\n### 23.4.7 复制和应用约束集\n\n可以使用 `clone()` 方法将 `ConstraintLayout`\
  \ 实例的当前约束集复制到约束集对象中。例如，下行代码将从名为 `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到一个约束集对象中：\n\
  \n```java\nset.clone(myLayout);\n```\n\n复制完成后，可以将约束集直接应用到另一个布局，或者像下面的示例所示，在应用到第二个布局之前进行修改：\n\
  \n```java\nConstraintSet set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链（Chains）\n\n可以使用 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 方法在约束集中创建垂直和水平链。这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int leftId, int leftSide,\
  \ int rightId, int rightSide, int[] chainIds, float[] weights, int style);\n```\n\
  \n根据上述语法，下面的示例创建了一个从 `button1` 开始到 `button4` 结束的水平分布链。在这些视图之间是 `button2` 和 `button3`，它们的权重均设置为零：\n\
  \n```java\nint[] chainViews = {button2.getId(), button3.getId()};\nfloat[] chainWeights\
  \ = {0, 0};\nset.createHorizontalChain(button1.getId(), ConstraintSet.LEFT, button4.getId(),\
  \ ConstraintSet.RIGHT, chainViews, chainWeights, ConstraintSet.CHAIN_SPREAD);\n\
  ```\n\n可以通过将要删除视图的 ID 传递给 `removeFromHorizontalChain()` 或 `removeFromVerticalChain()`\
  \ 方法来从链中移除视图。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()` 方法将视图添加到现有链中。在这两种情况下，方法接收的参数是新视图要插入的视图之间的\
  \ ID，如下：\n\n```java\nset.addToHorizontalChain(newViewId, leftViewId, rightViewId);\n\
  ```\n\n### 23.4.9 指南（Guidelines）\n\n使用 `create()` 方法向约束集添加指南，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法进行定位。在下面的代码中，创建了一个垂直指南，并将其定位在父布局宽度的 50% 处。然后将按钮视图的左侧无边距连接到该指南：\n\
  \n```java\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT, R.id.myGuideline, ConstraintSet.RIGHT,\
  \ 0);\nset.applyTo(layout);\n```\n\n### 23.4.10 移除约束\n\n可以使用 `clear()` 方法从约束集中的视图移除约束，传递的参数为视图\
  \ ID 和要移除约束的锚点点：\n\n```java\nset.clear(button.getId(), ConstraintSet.LEFT);\n```\n\
  \n同样，通过仅在 `clear()` 方法调用中引用视图，可以一步性移除视图上的所有约束：\n\n```java\nset.clear(button.getId());\n\
  ```\n\n### 23.4.11 缩放\n\n可以使用 `ConstraintSet` 的 `setScaleX()` 和 `setScaleY()` 方法调整布局内视图的缩放，这些方法接收执行操作的视图以及一个表示缩放比例的浮点值作为参数。在下面的代码中，按钮对象被缩放为原始宽度的两倍和高度的一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n```\n\n### 23.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 方法分别在\
  \ X 轴或 Y 轴上旋转视图，这两个方法都必须传递旋转视图的 ID 以及表示旋转角度的浮点值。发生旋转的中心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()`\
  \ 和 `setTransformPivotY()` 方法定义。下面的代码使用 500, 500 处的中心点在 Y 轴上旋转按钮 30 度：\n\n```java\n\
  set.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\nset.applyTo(layout);\n```\n\n### 23.5 总结\n\n除了编写 XML 布局文件或使用 Android Studio\
  \ 编辑器工具，Android 用户界面也可以在 Java 代码中动态创建。在 Java 代码中创建布局包括创建视图类的实例并设置属性。\n\n视图相对于其 `ConstraintLayout`\
  \ 父布局和其他兄弟视图的定位是通过使用约束集来定义的。约束集由 `ConstraintSet` 实例表示，创建后可以使用各种方法调用进行配置。\n\n# 24\
  \ Android ConstraintSet 教程\n\n作为编写 XML 布局文件或使用 Android Studio 编辑器工具的替代方案，Android\
  \ 用户界面也可以在 Java 代码中动态创建。在 Java 代码中创建布局包括创建视图类的实例并设置属性以定义外观。\n\n视图相对于其 `ConstraintLayout`\
  \ 父布局和其他兄弟视图的定位和大小是通过使用约束集来定义的。约束集由 `ConstraintSet` 实例表示，创建后可以使用各种方法调用进行配置，以执行建立约束连接、控制大小等任务。\n\
  \n在本章介绍 `ConstraintSet` 类的基础知识后，下一章将通过教程把这些功能付诸实践。\n\n## 24.1 在 Android Studio 中创建示例项目\n\
  \n启动 Android Studio，从欢迎屏幕选择 New Project，在出现的新项目对话框中选择 Empty Activity 模板，然后点击 Next\
  \ 按钮。\n\n在 Name 字段输入 `JavaLayout` 并指定 `com.ebookfrenzy.javalayout` 为包名。在点击 Finish\
  \ 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。\n\
  \n项目创建后，`MainActivity.java` 文件应该自动加载到编辑面板。正如我们预期的，Android Studio 创建了一个模板 Activity\
  \ 并重写了 `onCreate()` 方法，为添加 Java 代码以创建用户界面提供了理想位置。\n\n### 24.2 向 Activity 添加视图\n\n\
  `onCreate()` 方法目前被设计为使用资源布局文件作为界面。因此，首先从该方法中删除此行：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n\n\n下一次修改是向 activity 添加一个包含单个\
  \ `Button` 视图子元素的 `ConstraintLayout` 对象。这涉及创建 `ConstraintLayout` 和 `Button` 类的的新实例。然后，需要将\
  \ `Button` 视图作为子视图添加到 `ConstraintLayout` 视图中，后者通过调用 activity 实例的 `setContentView()`\
  \ 方法显示：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  \nimport android.widget.Button;\nimport android.widget.EditText;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        configureLayout();\n\
  \    }\n\n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以这种方式创建用户界面对象的新实例时，必须向构造方法传递创建该对象时所在的上下文，在本例中，即为当前\
  \ activity。由于上述代码位于 activity 类内部，因此直接通过标准的 `this` 关键字引用上下文：\n\n`Button myButton\
  \ = new Button(this);`\n\n完成上述添加后，编译并运行应用程序（在物理设备或模拟器上均可）。启动后，可见结果是在 `ConstraintLayout`\
  \ 视图的左上角出现一个没有任何文本的按钮，如图 24-1 所示：\n\n![](img/Image24351.jpg)\n\n图 24-1\n\n## 24.3\
  \ 设置视图属性\n\n为了本次练习，我们需要将 `ConstraintLayout` 视图的背景设置为蓝色，并让 `Button` 视图在黄色背景上显示“Press\
  \ Me”的文本。这两项任务都可以通过如下代码片段所示，在 Java 代码中设置视图的属性来实现。为了让按钮上的文本能够轻松翻译成其他语言，将将其作为 String\
  \ 资源添加。在 Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件并修改它以为“Press Me”字符串添加资源值：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n    <string\
  \ name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理代码中直接引用字符串的推荐方法，但为了避免在书其余部分重复此步骤，许多后续代码示例将直接在代码中输入字符串。\n\
  \n一旦字符串作为资源存储，可以通过以下方式从代码内部访问：\n\n`getString(R.string.press_me);`\n\n创建字符串资源后，向\
  \ `configureLayout()` 方法添加代码以设置按钮的文本和颜色属性：\n\n.\n.\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n现在编译并运行应用程序时，布局将反映属性设置，使得布局将呈现蓝色背景，并且按钮将在黄色背景上显示指定的文本。\n\n## 24.4 创建视图\
  \ ID\n\n当布局完成后后，它将包含一个 `Button` 和一个 `EditText` 视图。在 `ConstraintSet` 类的方法中引用这些视图之前，必须为它们分配唯一的视图\
  \ ID。此过程的第一步是创建一个包含这些 ID 值的新型资源文件。\n\n右键点击 `app -> res -> values` 文件夹，选择 `New ->\
  \ Values Resource File` 菜单选项并将新资源文件命名为 `id.xml`。创建资源文件后，对其进行编辑使其如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <item name=\"myButton\"\
  \ type=\"id\" />\n    <item name=\"myEditText\" type=\"id\" />\n</resources>\n```\n\
  \n在教程的此阶段，只创建了 `Button`，因此编辑 `configureLayout()` 方法来分配相应的 ID：\n\n```java\nprivate\
  \ void configureLayout() {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n### 24.5 配置约束\n\n在没有任何约束的情况下，`ConstraintLayout` 视图将按钮放置在左上角。要指示布局将按钮放在不同的位置（在本例中为水平和垂直居中），需要创建一个\
  \ `ConstraintSet` 实例，使用适当设置对其进行初始化并应用于父布局。对于此示例，需要配置按钮使其宽度和高度限制为其显示的大小，并在父布局中居中。再次编辑\
  \ `configureLayout()` 方法以做出这些更改：\n\n.\n.\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n  \
  \  myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n\n    ConstraintSet set = new ConstraintSet();\n\
  \    set.clone(myLayout);\n    set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n\
  \    set.constrainWidth(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\n   \
  \ set.applyTo(myLayout);\n}\n```\n\n带有初始约束，编译并运行应用程序，并验证按钮视图现在位于布局中心：\n\n![](img/Image244.jpg)\n\
  \n图 24-2\n\n## 24.6 添加 EditText 视图\n\n下一个要添加到布局的项目是 `EditText` 视图。第一步是创建 `EditText`\
  \ 对象，为其分配在 `id.xml` 资源文件中声明的 ID 并将其添加到布局中。实现这些步骤的代码更改现在需要对 `configureLayout()` 方法进行：\n\
  \n```java\nprivate void configureLayout() {\n    Button myButton = new Button(this);\n\
  \    myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    EditText myEditText = new EditText(this);\n\
  \    myEditText.setId(R.id.myEditText);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    myLayout.addView(myEditText);\n    setContentView(myLayout);\n}\n```\n\n`EditText`\
  \ 小组件旨在根据其显示的内容调整大小，在布局中水平居中，并位于现有 `Button` 视图上方 70dp 处。向 `configureLayout()` 方法添加代码使其如下所示：\n\
  \n.\n.\n\n`set.connect(myButton.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.START, 0);`\n\n\n\n\n\n```\nset.connect(myButton.getId(), ConstraintSet.END,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.connect(myEditText.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myEditText.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myEditText.getId(), ConstraintSet.BOTTOM,\
  \ myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n```\n\n运行应用程序测试，应显示\
  \ `EditText` 字段位于按钮正上方，并有 70dp 的边距。\n\n## 24.7 将密度独立像素 (dp) 转换为像素 (px)\n\n本次练习的下一个任务是将\
  \ `EditText` 视图的宽度设置为 200dp。正如名为 Android Studio 布局编辑器 ConstraintLayout 教程的章节所述，在用户界面布局中设置尺寸和位置时，使用密度独立像素（`dp`）比像素（`px`）更好。要使用\
  \ `dp` 设置位置，需要在运行时将 `dp` 值转换为 `px` 值，并考虑设备显示器的密度。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要在类中添加以下代码：\n\
  \n```java\npackage com.ebookfrenzy.javalayout;\n\nimport android.content.res.Resources;\n\
  import android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        return (int) TypedValue.applyDimension(\n            TypedValue.COMPLEX_UNIT_DIP,\
  \ value,\n            r.getDisplayMetrics());\n    }\n\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        int px = convertToPx(200);\n        myEditText.setWidth(px);\n    }\n}\n\
  ```\n\n再次编译并运行应用程序，注意 `EditText` 视图的宽度已经发生变化，如图 24-3\n\n图 24-3\n\n## 24.8 总结\n\n\
