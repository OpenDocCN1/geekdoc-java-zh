  \ Play Store 应用并打开如图 85-7 所示的 DynamicFeature 应用下载页：\n\n![](img/as_3.6_install_dynamic_feature_app.jpg)\n\
  \n图 85-7\n\n点击按钮安装应用，然后打开它并点击 `Launch Feature`（启动功能）按钮。动态功能尚未安装的情况应反映在状态文本中。\n\n\
  # 85.9 实现 installFeature() 方法\n\n`installFeature()` 方法将为 `my_dynamic_feature` 模块创建一个\
  \ `SplitInstallRequest` 对象，然后使用 `SplitInstallManager` 启动安装过程。还将实现监听器以显示 `Toast`\
  \ 消息，指示安装请求的状态。留在 `MainActivity.java` 文件中，按照如下所示添加 `installFeature()` 方法：\n\n```java\n\
  import android.widget.Toast;\nimport com.google.android.play.core.splitinstall.SplitInstallRequest;\n\
  import com.google.android.play.core.tasks.OnFailureListener;\nimport com.google.android.play.core.tasks.OnSuccessListener;\n\
  \npublic void installFeature(View view) {\n    SplitInstallRequest request =\n \
  \           SplitInstallRequest\n                    .newBuilder()\n           \
  \         .addModule(\"my_dynamic_feature\")\n                    .build();\n  \
  \  manager.startInstall(request)\n        .addOnSuccessListener(new OnSuccessListener<Integer>()\
  \ {\n            @Override\n            public void onSuccess(Integer sessionId)\
  \ {\n                Toast.makeText(MainActivity.this,\n                       \
  \ \"Module installation started\",\n                        Toast.LENGTH_SHORT).show();\n\
  \            }\n        })\n        .addOnFailureListener(new OnFailureListener()\
  \ {\n            @Override\n            public void onFailure(Exception exception)\
  \ {\n                Toast.makeText(MainActivity.this,\n                       \
  \ \"Module installation failed\" + exception.toString(),\n                     \
  \   Toast.LENGTH_SHORT).show();\n            }\n        });\n}\n```\n\n编辑 `Gradle\
  \ Scripts` -> `build.gradle (Module: `DynamicFeature.app)` 文件并增加 `versionCode` 和\
  \ `versionName` 的值，以便可以将新版本的应用 bundle 上传进行测试：\n\n```gradle\nandroid {\n    versionCode\
  \ 2\n    versionName \"2.0\"\n}\n```\n\n重复此步骤，在 `Gradle Scripts` -> `build.gradle\
  \ (Module: `DynamicFeature.my_dynamic_feature)` 文件中声明匹配的版本号。\n\n生成一个包含更改的新 app bundle，然后返回\
  \ Google Play Console 中应用的 `Testing` -> `Internal testing` 页面，并点击下方图 85-8 所示的高亮\
  \ `Create new release` 按钮：\n\n![](img/as_4.1_dynamic_feature_new_release.jpg)\n\n\
  图 85-8\n\n按照步骤上传新的 app bundle 并将其发布到内部测试。在测试设备上，打开 Google Play Store 应用并确保 `Install`\
  \ 按钮已变为 `Update` 按钮（如果没有，请关闭 App Store 应用并在几分钟后重试）并更新到新版本。一旦更新完成，运行应用，点击 `Install`\
  \ 按钮并检查 `Toast` 消息以确保启动成功。在下载功能时，屏幕状态栏顶部应会出现下载图标。\n\n如果安装失败或应用崩溃，可以通过连接设备到开发计算机，打开终端或命令行窗口并执行以下命令从\
  \ `LogCat` 输出中识别原因：\n\n`adb` 命令将实时显示 `LogCat` 输出，包括应用遇到问题或崩溃时生成的任何异常或诊断错误。\n\n#\
  \ 85.10 添加更新监听器\n\n为了更详细地跟踪动态模块的安装进度，可以为应用添加 `SplitInstallListener` 实例。由于可能同时安装多个功能模块，需要添加代码来跟踪分配给安装过程的\
  \ `session IDs`。首先添加导入，在 `MainActivity.java` 文件中声明一个包含当前会话 ID 的变量，并修改 `installFeature()`\
  \ 方法以便每次启动安装时存储会话 ID 并注册监听器：\n\n```java\nimport com.google.android.play.core.splitinstall.SplitInstallSessionState;\n\
  import com.google.android.play.core.splitinstall.SplitInstallUpdatedListener;\n\
  import com.google.android.play.core.splitinstall.model.SplitInstallStatus;\nimport\
  \ java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity {\n \
  \   MainBinding binding;\n    private SplitInstallManager manager;\n    private\
  \ int mySessionId = 0;\n\n    public void installFeature(View view) {\n        manager.registerListener(listener);\n\
  \        manager.startInstall(request)\n            .addOnSuccessListener(new OnSuccessListener<Integer>()\
  \ {\n                @Override\n                public void onSuccess(Integer sessionId)\
  \ {\n                    mySessionId = sessionId;\n                    Toast.makeText(MainActivity.this,\n\
  \                            \"Module installation started\",\n                \
  \            Toast.LENGTH_SHORT).show();\n                }\n            });\n \
  \   }\n}\n```\n\n\n\n\n接下来，实现监听器代码，其内容如下：\n\n```java\nSplitInstallStateUpdatedListener\
  \ listener =\n    new SplitInstallStateUpdatedListener() {\n        @Override\n\
  \        public void onStateUpdate(SplitInstallSessionState state) {\n         \
  \   if (state.sessionId() == mySessionId) {\n                switch (state.status())\
  \ {\n                    case SplitInstallSessionStatus.DOWNLOADING:\n         \
  \               long size = state.totalBytesToDownload();\n                    \
  \    long downloaded = state.bytesDownloaded();\n                        binding.statusText.setText(String.format(Locale.getDefault(),\n\
  \                               \"%d of %d bytes downloaded.\", downloaded, size));\n\
  \                        break;\n                    case SplitInstallSessionStatus.INSTALLING:\n\
  \                        binding.statusText.setText(\"Installing feature\");\n \
  \                       break;\n                    case SplitInstallSessionStatus.DOWNLOADED:\n\
  \                        binding.statusText.setText(\"Download Complete\");\n  \
  \                      break;\n                    case SplitInstallSessionStatus.INSTALLED:\n\
  \                        binding.statusText.setText(\"Installed - Feature is ready\"\
  );\n                        break;\n                    case SplitInstallSessionStatus.CANCELED:\n\
  \                        binding.statusText.setText(\"Installation cancelled\");\n\
  \                        break;\n                    case SplitInstallSessionStatus.PENDING:\n\
  \                        binding.statusText.setText(\"Installation pending\");\n\
  \                        break;\n                    case SplitInstallSessionStatus.FAILED:\n\
  \                        binding.statusText.setText(\n                         \
  \       \"Installation Failed. Error code: \" + state.errorCode());\n          \
  \          case SplitInstallSessionStatus.CANCELING:\n                        binding.statusText.setText(\"\
  Installation canceling\");\n                        break;\n                   \
  \ case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n                 \
  \       binding.statusText.setText(\"User Confirmation Required\");\n          \
  \              break;\n                    case SplitInstallSessionStatus.UNKNOWN:\n\
  \                        binding.statusText.setText(\"Unknown Status\");\n     \
  \                   break;\n                }\n            }\n        }\n    };\n\
  ```\n\n`listener` 捕获许多常见的安装状态并相应更新状态文本，包括下载大小信息以及目前已下载字节数的总和。在继续操作之前，添加 `onPause()`\
  \ 和 `onResume()` 周期方法，以确保在应用未激活时注销监听器：\n\n```java\n@Override\npublic void onResume()\
  \ {\n    manager.registerListener(listener);\n    super.onResume();\n}\n\n@Override\n\
  public void onPause() {\n    manager.unregisterListener(listener);\n    super.onPause();\n\
  }\n```\n\n通过增加两个模块级 `build.gradle` 文件中的版本号、生成并上传新的发布版应用包并将其推出测试，验证监听器代码运行工作。如果设备上已安装动态功能模块，Play\
  \ Core Library 类将忽略再次下载该模块的尝试。因此，为了充分测试监听器，必须在安装更新的发布版本之前，从 Play Store 应用中卸载应用。当然，在移除应用后，将没有\
  \ `Update` 按钮让我们知道新版本已准备好安装。要查看 Play Store 应用将安装哪个发布版本，请向下滚动应用页面到 `About this app`\
  \ 按钮，选择它并检查下方 图 85-9 所示的 App Info 部分中的 `Version` 字段：\n\n![](img/as_dynamic_feature_version.jpg)\n\
  \n图 85-9\n\n如果之前的版本仍在列表中，请退出 Play 应用并等待几分钟再次检查。一旦新版本列在列表中，完成安装，打开应用并检查在动态功能模块下载时状态文本是否相应更新。\n\
  \n### 85.11 使用延迟安装\n\n延迟安装会导致动态功能模块在后台下载，并将由操作系统的决定何时完成。当启动延迟安装时，监听器将带有 `pending`\
  \ 状态被调用，但除了检查模块是否已安装外，没有其他方法跟踪安装进度。\n\n要尝试延迟安装，修改 `installFeature()` 方法使其内容如下：\n\
  \n```java\npublic void installFeature(View view) {\n    manager.deferredInstall(Arrays.asList(\"\
  my_dynamic_feature\"));\n}\n```\n\n注意，`deferredInstall()` 方法传递了一个数组，允许对多个模块进行延迟安装。\n\
  \n### 85.12 移除动态模块\n\n该项目的最后一个任务是在 `MainActivity.java` 文件中按如下实现 `deleteFeature()`\
  \ 方法：\n\n```java\nimport java.util.Collections;\n\npublic void deleteFeature(View\
  \ view) {\n    manager.deferredUninstall(Collections.singletonList(\"my_dynamic_feature\"\
  ));\n}\n```\n\n功能的移除将由操作系统在需要额外存储空间时在后台执行。与 `deferredInstall()` 方法一样，可以在单次调用中调度多个功能的移除。\n\
  \n### 85.13 总结\n\n本章完成了一个示例应用的创建，旨在演示如何在 Android 应用中使用动态功能模块。所涵盖的话题包括动态功能模块的创建，以及使用\
  \ Play Core Library 的类和方法来安装和管理动态功能模块。\n\n\n\n\n\n我们当然知道，Android 应用的用户界面是通过组装布局、文本字段和按钮等组件创建的。所有这些组件都使用默认颜色，除非我们专门在\
  \ `XML` 布局资源文件中或通过编写代码显式覆盖颜色属性。这些默认颜色由项目主题（theme）定义。主题由一组颜色槽位（在 `themes.xml` 文件中声明）组成，并为其分配了颜色值（在\
  \ `colors.xml` 文件中声明）。每个 UI 组件在内部都被程序化为使用主题颜色槽作为特定属性的默认颜色（例如 `Text` 控件的前颜色和背景颜色）。因此，我们可以仅通过更改分配给特定主题槽位的颜色，就能轻松地更改整个应用程序的主题。当应用运行时，在渲染用户界面时，新的默认颜色将作为所有组件的默认值。\n\
  \n## 86.3 Material Design 2 主题设计\n\n在探索 Material Design 3 之前，我们首先需要查看 Material Design\
  \ 2 如何在 Android Studio 项目中使用。应用程序项目使用的主题被声明为 `AndroidManifest.xml` 文件中 `application`\
  \ 元素的一个属性，例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.themedemo\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        .\n.\n.\n   \
  \     android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.MyDemoApp\"\
  \n        tools:targetApi=\"31\">\n        <activity\n.\n.\n.\n```\n\n正如之前讨论过的，所有与项目主题相关的文件都包含在\
  \ `res -> values` 文件夹下的 `colors.xml` 和 `themes.xml` 文件中如图 86-1 所示：\n\n![](img/as_theme_files_in_project_tool_window.jpg)\n\
  \n图 86-1\n\n主题本身声明在位于 `themes` 文件夹的两个 `themes.xml` 文件中。这些资源文件声明了不同的调色板，其中包含了 Material\
  \ 主题颜色槽，供设备处于亮色模式或深色模式时使用。请注意，每个文件中的 `style` 名称属性必须与 `AndroidManifest.xml` 文件中引用的匹配：\n\
  \n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n    <!--\
  \ Base application theme. -->\n    <style name=\"Theme.MyDemoApp\" parent=\"Theme.MaterialComponents.DayNight.DarkActionBar\"\
  >\n        <!-- Primary brand color. -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n\
  \        <item name=\"colorPrimaryVariant\">@color/purple_700</item>\n        <item\
  \ name=\"colorOnPrimary\">@color/white</item>\n        <!-- Secondary brand color.\
  \ -->\n        <item name=\"colorSecondary\">@color/teal_200</item>\n.\n.\n.\n```\n\
  \n这些颜色槽位（也称为颜色属性）被 Material 组件用于在在屏幕上渲染时设置颜色。例如，`colorPrimary` 颜色槽被用作 `Material\
  \ Button` 组件的背景颜色。分配给槽位的实际颜色在 `colors.xml` 资源文件中声明如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"purple_200\">#FFBB86FC</color>\n\
  \    <color name=\"purple_500\">#FF6200EE</color>\n    <color name=\"purple_700\"\
  >#FF3700B3</color>\n    <color name=\"teal_200\">#FF03DAC5</color>\n    <color name=\"\
  teal_700\">#FF018786</color>\n    <color name=\"black\">#FF000000</color>\n    <color\
  \ name=\"white\">#FFFFFFFF</color>\n</resources>\n```\n\n例如，`colorPrimary` 槽被分配了颜色\
  \ `purple_500`，而该颜色反过来分配了 `FF6200EE` 的 RGB 颜色值。\n\n创建自定义主题只需编辑这些文件以使用不同的颜色设置。这些更改将作为\
  \ Material 组件的默认颜色使用。\n\n## 86.4 Material Design 3 主题设计\n\nMaterial Design 3 (MD3)\
  \ 仍然使用 `colors.xml` 和 `themes.xml` 文件，但为 MD3 组件提供了更广泛的颜色槽位。事实上，MD3 为自定义应用主题提供了 25\
  \ 种以上的颜色槽位。颜色名称也不同，因为它们描述的是颜色的用途而非颜色本身。在 Material Design 2 中，例如我们有一个命名为 `purple_500`\
  \ 的颜色：\n\n```xml\n<color name=\"purple_500\">#FF6200EE</color>\n```\n\n这反过来被用于亮色模式\
  \ `themes.xml` 文件中的 `colorPrimary` 主题槽位：\n\n```xml\n<item name=\"colorPrimary\"\
  >@color/purple_500</item>\n```\n\n假设我们需要将 `colorPrimary` 从紫色改为红色。当然，我们只需要将一种红色的\
  \ RGB 值分配给 `purple_500` 颜色声明。遗憾的是，我们现在有了一个名称暗示它是紫色的红色颜色声明。唯一的选择是在 `colors.xml` 文件中为红色添加一个新条目，然后将其分配给\
  \ `themes.xml` 文件中的 `colorPrimary` 槽位。这种方法虽然可行，但为了实现这一点，我们必须同时编辑颜色和主题文件。在 MD3 中，颜色名称不再引用它们所代表的实际颜色。MD3\
  \ 主题文件中的 `colorPrimary` 槽被声明如下：\n\n```xml\n<item name=\"colorPrimary\">@color/md_theme_primary</item>\n\
  ```\n\n该颜色随后在 `colors.xml` 文件中：\n\n```xml\n<color name=\"md_theme_primary\">#B82000</color>\n\
  ```\n\n现在我们 own 更改此颜色的 RGB 值，同时保持 `themes.xml` 文件不变，且无需在 `colors.xml` 文件中创建新元素。\n\
  \n此外，`themes.xml` 文件中的元素基于 `Theme.Material3.*` 而不是 `Theme.MaterialComponents.*`。例如，以下是\
  \ MD3 `themes.xml` 文件的片段：\n\n```xml\n<resources>\n    <style name=\"Base.Theme.MyAppDemo\"\
  \ parent=\"Theme.Material3.DayNight.NoActionBar\">\n.\n.\n    </style>\n    <style\
  \ name=\"Theme.MyAppDemo\" parent=\"Base.Theme.MyAppDemo\" />\n</resources>\n```\n\
  \n\n\n\n在自定义屏幕（图 86-2）上，点击颜色圆显示颜色选择对话框，为主色色键 (A) 进行颜色选择。一旦选择了颜色，预览 (B) 将发生变化，以反映所有\
  \ MD3 颜色槽的推荐颜色，并附带示例应用界面和控件。此外，您可以通过点击相应的颜色圆显示颜色选择对话框，来覆盖 `Secondary, Tertiary,\
  \ and Neutral slots` 中生成的颜色。\n\n标记为 B 的区域显示了示例应用界面、浅色和深色配色方案图表，以及更新以预览您的颜色选择的控件。由于该面板比典型的浏览器窗口长，您必须向下滚动以查看所有信息。\n\
  \n要将主题整合到您的设计中，点击导出按钮 (C) 并选择 Android View (XML) 选项。下载后，可以使用 `colors.xml` 和 `themes.xml`\
  \ 文件替换项目中的现有文件。请注意，导出的两个 `themes.xml` 文件中的主题名称需要更改以匹配您的项目。\n\n![](img/theme_builder_custom.jpg)\n\
  \n图 86-2\n\n### 86.6 总结\n\nMaterial Design 提供了指南和组件，定义了 Android 应用的外观和外观。可以通过设计主题为应用应用个人品牌设计，这些主题指定了显示应用时应使用的颜色、字体和形状。Google\
  \ 目前正在引入 Material Design 3，它取代了 Material Design 2 并支持包括动态颜色在内的 Material You 新功能。为了设计您自己的主题，Google\
  \ 还提供了 Material Theme Builder，它减轻了选择互补主题颜色的任务复杂性。一旦使用此工具设计了主题，就可以导出相应的文件并在 Android\
  \ Studio 项目中使用。\n\n### 87 从 Material Design 2 迁移到 Material Design 3\n\n本章将演示如何将\
  \ Android Studio 项目从 Material Design 2 迁移到 Material Design 3，并集成使用 Material Theme\
  \ Builder 工具生成的自定义主题。该教程还将演示如何添加对动态主题颜的支持并对其进行测试。\n\n#### 87.1 创建 ThemeMigration\
  \ 项目\n\n在欢迎界面上选择 New Project（新建项目）选项，在出现的新项目对话框中，点击 Next 按钮之前选择 Empty Activity 模板。\n\
  \n在 Name 字段中输入 `ThemeMigration`，并指定 `com.ebookfrenzy.thememigration` 为包名。在点击 Finish\
  \ 按钮之前，将 Minimum API level 设置更改为 API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。\n\
  \n### 87.2 设计用户界面\n\n主活动将由一个简单的布局组成，包含一些用户界面组件，这些组件使我们能够看到切换到 Material Design 3\
  \ 的效果以及本章稍后执行的主题工作的结果。有关 MD3 组件的信息，请参考以下网页：\n\n[`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\
  \ [`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\n\
  \n布局将在 `activity_main.xml` 文件中设计，该文件目前包含单个 Text view。在布局编辑器中打开此文件，删除 Text view，禁用自动连接\
  \ 模式（在 图 87-1 中标记为 A），并点击按钮清除布局中的所有约束 (B)。\n\n![](img/as_theme_demo_disable_autoconnect.jpg)\n\
  \n图 87-1\n\n从调色板的 Buttons 部分，将 Chip、CheckBox、Switch 和 Button 视图拖到布局画布上。接下来，将一个 FloatingActionButton\
  \ 拖到布局画布上，使其位于 Button 组件下方。当提示选择一个出现在 FloatingActionButton 上的图标时，从资源工具窗口内选择 `ic_lock_power_off`\
  \ 图标，如 图 87-2 所示：\n\n![](img/as_theme_demo_select_icon.jpg)\n\n图 87-2\n\n将 Chip\
  \ 组件的文本属性更改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，以便布局看起来像\
  \ 图 87-3 左侧所示的那：\n\n![](img/as_theme_demo_layout.jpg)\n\n图 87-3\n\n要设置上图中蓝图视图所示的约束，选择所有组件，右键点击\
  \ Chip 视图，并从结果菜单中选择 `Chains -> Create Vertical Chain`。重复此步骤，这次选择 `Center -> Horizontally\
  \ in Parent` 菜单选项。\n\n在设备或模拟器上编译并运行应用，验证用户界面是否与上方 图 87-3 所示。该布局使用了 Material Design\
  \ 2 组件。下一步是将主题迁移到 Material Design 3。\n\n### 87.3 迁移到 Material Design 3\n\n要切换到 Material\
  \ Design 3 组件，我们做的的是编辑位于 `app -> res -> values -> themes` 下的两个 `themes.xml` 文件。第一个\
  \ `themes.xml` 中 style 元素的 `name` 属性需要更改如下：\n\n```xml\n<resources xmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <!-- Base application theme. -->\n    <style\
  \ name=\"Theme.ThemeMigration\" parent=\"Theme.Material3.Light\">\n```\n\n同样，对 `themes.xml\
  \ (night)` 文件进行以下更改以迁移到 MD3：\n\n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <!-- Base application theme. -->\n    <style name=\"Theme.ThemeMigration\"\
  \ parent=\"Theme.Material3.Dark\">\n```\n\n进行更改后，再次运行应用，注意下方 图 87-4 所示的 MD2 和 MD3\
  \ 外观差异：\n\n![](img/as_theme_demo_md2_vs_md3.jpg)\n\n图 87-4\n\n现在已将项目迁移到 MD3，下一步是创建并应用自定义主题。\n\
  \n### 87.4 构建新主题\n\n如果您完成了上一章节（Material Design 3 主题与动态颜色”），可以使用该章节创建的自定义主题。如果您还没有自定义主题，打开浏览器窗口并导航到以下\
  \ URL 以访问构建工具：\n\n[`m3.material.io/theme-builder#/custom`](https://m3.material.io/theme-builder#/custom)\n\
  \n加载构建器后，选择壁纸，然后点击屏幕顶部的 Custom 按钮，点击 Core Colors 部分的 Primary 颜色圆以显示颜色选择器。从颜色选择器中选择任一颜色作为主题基础：\n\
  \n![](img/theme_builder_color_dialog.jpg)\n\n图 87-5\n\n在 Your Theme 面板中查看配色，并使用\
  \ Core colors 设置进行必要的颜色调整，直到对颜色槽满意。一旦主题准备绪，点击右上角的导出按钮并选择 Android Views (XML) 选项。提示时，将文件保存到计算机文件系统的合适位置。主题将保存为名为\
  \ `material-theme.zip` 的压缩文件。\n\n使用适用于您的操作系统的工具解压主题文件，应在名为 `material-theme` 的文件夹中包含以下文件夹和文件：\n\
  \n- `values/colors.xml` - 颜色定义。\n- `values/themes.xml` - 浅色模式主题。\n- `values-night/themes.xml`\
  \ - 暗色模式主题。\n\n主题文件已经生成，需要将其集成到 Android Studio 项目中。\n\n### 87.5 将主题添加到项目\n\n在向项目添加新主题之前，我们首先需要删除旧的\
  \ MD2 主题文件。如果 Project 工具窗口处于 Project Files 模式，这样做更容易。要切换模式，使用下方 Project 工具窗口顶部的菜单并选择\
  \ Project Files 选项：\n\n\n\n\n\n![](img/as_theme_demo_project_files.jpg)\n图 87-6\n\
  \n选中 **Project** 模式后，导航到 `app` -> `src` -> `res` -> `values` 文件夹，选择并删除 `colors.xml`\
  \ 和 `themes.xml`。同时删除位于 `values-night` 中的 `themes.xml` 文件。\n\n打开你操作系统的文件管理器，在新主题的\
  \ `values` 文件夹中找到 `colors.xml` 和 `themes.xml` 文件，并将其复制粘贴到 `values` 文件夹中。对 `values-night`\
  \ 文件夹中的 `themes.xml` 文件重复此步骤。\n\n将 Project 窗口切换回 Android 模式，此时值资源部分应与图 87-7 一致：\n\
  \n![](img/as_new_theme_files.jpg)\n图 87-7\n\n接下来，修改 `themes.xml` 文件以匹配当前项目，如下：\n\
  \n```xml\n<resources>\n    <style name=\"Theme.ThemeMigration\" parent=\"Theme.Material3.LightActionBar\"\
  >\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n  \
  \      <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n  \
  \  </style>\n    <style name=\"Theme.ThemeMigration\" parent=\"Base.ThemeMigration\"\
  \ />\n</resources>\n```\n\n重复这些步骤对 `themes.xml (night)` 文件进行相同的修改。返回 `activity_main.xml`\
  \ 文件或再次运行应用，以确认用户界面现在已使用自定义主题进行渲染。\n\n### 87.6 启用动态支持\n\n为了测试动态颜色，应用需要在运行 Android\
  \ 12 或更高版本且具有正确壁纸的设备或模拟器上运行。在设备或模拟器上，启动 **Settings**（设置）应用并从列表中选择 **Wallpaper &\
  \ style**（壁纸与样式）。在壁纸设置中，点击更改壁纸的选项（图 87-8 中标记为 A），并选择一张与你的主题颜色有显著不同的壁纸图像。一旦选择，将该壁纸设置为主屏幕。\n\
  \n返回 **Wallpaper & styles** 屏幕，在尝试不同的颜色方案（C）之前，确保选中了 **Wallpaper colors**（壁纸颜色）选项（B）。每点击一个选项，壁纸示例都会变化以反映选择：\n\
  \n![](img/compose_theme_wallpaper_and_styles.jpg)\n图 87-8\n\n要启用动态颜色，我们需要调用 `DynamicColors`\
  \ 类的 `applyToActivitiesAvailable()` 方法。为了为整个应用启用动态颜色支持，这需要在自定义 `Application` 实例的\
  \ `onCreate()` 方法内部调用。首先，在项目的 `app` -> `java` -> `com.ebookfrenzy.themedemo` 下添加一个名为\
  \ `ThemeDemoApplication.java` 的新 Java 类，并将其修改如下：\n\n```java\npackage com.ebookfrenzy.themedemo;\n\
  \nimport android.app.Application;\nimport com.google.android.material.color.DynamicColors;\n\
  \npublic class ThemeDemoApplication extends Application {\n    @Override\n    public\
  \ void onCreate() {\n        super.onCreate();\n        DynamicColors.applyToActivitiesAvailable(this);\n\
  \    }\n}\n```\n\n创建自定义的 `Application` 类后，我们现在需要配置项目使用此类类默认的 `Application` 实例。执行此操作，编辑\
  \ `AndroidManifest.xml` 文件并添加引用新类的 `android:name` 元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.themedemo\">\n    <application\n        android:name=\"\
  .ThemeDemoApplication\"\n        android:allowBackup=\"true\">\n</manifest>\n```\n\
  \n构建并运行应用，注意布局现在使用了与壁纸颜色匹配的主题。将 **ThemeDemo** 应用放入后台，返回 **Wallpaper & styles** 设置屏幕并选择不同的壁纸。再次将\
  \ **ThemeDemo** 应用带到前台，此时它将动态调整以匹配新的壁纸。\n\n### 87.7 总结\n\n在本章中，我们演示了如何将 Android\
  \ Studio 项目从 Material Design 2 迁移到 Material Design 3。项目还利用了 **Material Theme Builder**\
  \ 设计了自定义主题，并解释了将生成的主文件集成到旧项目中的步骤。\n\n# 88. Android Studio 中的 Gradle 概述\n\n到为止，人们在很大程度上认为\
  \ Android Studio 会采取必要的步骤来编译和运行已创建的应用项目。Android Studio 一直在后台使用一个名为 **Gradle** 的系统来实现这一点。\n\
  \n现在是时候查看 **Gradle** 如何用于编译和打包应用项目中的各种元素，并开始探索在有更高级需求时如何配置此系统。\n\n### 88.1 Gradle\
  \ 概述\n\n到为止，人们在很大程度上认为 Android Studio 会采取必要的步骤来编译和运行已创建的应用项目。Android Studio 一直在后台使用一个名为\
  \ **Gradle** 的系统来实现这一点。\n\nGradle 是一个自动化构建工具包，允许通过一组构建文件来配置项目的构建方式。这包括定义如何构建项目、项目成功构建需要满足哪些依赖项，以及最终结果或结果应该是什么。\n\
  \nGradle 的优势在于它提供的灵活性。Gradle 系统是一个自包含的命令行环境，可以通过插件集成到其他环境中。在 Android Studio 的情况下，通过相应命名的插件提供了\
  \ Gradle 集成。\n\n尽管 Android Studio 插件允许在 Android Studio 内部启动和管理 Gradle 任务，但在没有安装\
  \ Android Studio 的系统上仍然可以使用 Gradle 命令行封装来构建项目。构建配置规则声明在基于 Groovy 的 Gradle 构建文件和脚本中。\n\
  \n### 88.2 Gradle 与 Android Studio\n\nGradle 为构建 Android 项目带来了许多强大的功能。其中一些关键功能如下：\n\
  \n###### 88.2.1 合理默认\n\nGradle 实现了被称为“约定优于配置”的概念。这简单意味着 Gradle 有一组组预定义的合理默认配置设置，除非被构建文件中的设置覆盖否则将被使用。这意味着可以使用最少的配置进行构建。\n\
  \n###### 88.2.2 依赖项\n\nGradle 的另一个关键领域是依赖项。考虑，Android Studio 项目中的一个模块触发了加载项目中另一个模块的意图。第一个模块实际上对第二个模块有依赖关系，因为如果运行时无法找到并启动第二个模块，应用程序将无法构建。这种依赖关系可以在第一个模块的\
  \ Gradle 构建文件中声明，以便将第二个模块包含在应用构建中，或者在无法找到或构建第二个模块时标记错误。依赖项的其他示例是项目编译运行所需的库和 JAR\
  \ 文件。\n\nGradle 依赖项可以分为本地和远程。本地依赖项引用位于执行构建的计算机本地文件系统上的项。远程依赖项引用位于远程服务器（通常称为仓库）上的项。\n\
  \n\n\n\n\nAndroid Studio 项目通过另一个名为 `Maven` 的项目管理工具来处理远程依赖。如果在 `Gradle` 构建文件中使用 `Maven`\
  \ 语法声明了远程依赖，则该依赖将自动从指定的仓库下载并包含在构建过程中。例如，下面的依赖声明将导致 `AppCompat` 库从 Google 仓库添加到项目中：\n\
  \n```\nimplementation 'androidx.appcompat:appcompat:1.6.0'\n```\n\n## 88.2.3 构建变体\
  \ (Build Variants)\n\n除了依赖项外，`Gradle` 还为 Android Studio 项目提供了构建变体支持。这允许从单个项目构建应用程序的多个变体。Android\
  \ 运行在许多不同的设备上，涵盖了各种处理器类型和屏幕尺寸。为了尽可能覆盖广泛的设备类型和尺寸，通常需要构建应用程序的多个不同变体（例如，一个适用于手机的用户界面，另一个适用于平板电脑大小的屏幕）。通过使用\
  \ `Gradle`，这在 Android Studio 中成为。\n\n## 88.2.4 Manifest 条目 (Manifest Entries)\n\n\
  每个 Android Studio 项目都关联有一个 `AndroidManifest.xml` 文件，其中包含了有关应用程序的配置细节。在 `Gradle`\
  \ 构建文件中可以指定许多 manifest 条目，这些条目在项目构建时会自动生成到 manifest 文件中。这种功能与构建变体功能互为补充，允许为每个构建变体配置不同的应用程序版本号、应用\
  \ ID 和 SDK 版本信息等元素。\n\n## 88.2.5 APK 签名 (APK Signing)\n\n标题为 “创建、测试和上传 Android App\
  \ Bundle” 的章节涵盖了如何使用 Android Studio 环境创建签名的发布版 APK 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在\
  \ `Gradle` 构建文件中，以便能够从命令行生成已签名的 APK 文件。\n\n#### 88.2.6 ProGuard 支持\n\nProGuard 是\
  \ Android Studio 自带的一个工具，它可以优化、压缩和混淆 Java 字节码，使其更高效且更难被反向工程（反向工程是通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。`Gradle`\
  \ 构建文件提供了控制在构建应用程序时是否在你的程序上运行 `ProGuard` 的能力。\n\n### 88.3 属性与设置 Gradle 构建文件\n\n\
  gradle 构建配置由一组配置、属性和设置文件组成。例如，`gradle.properties` 文件主要包含与 Java 虚拟机 (`JVM`) 使用的命令行标志相关的特殊设置、项目是否使用\
  \ `AndroidX` 库以及 Kotlin 编码风格支持。作为典型用户，你可能不需要更改此文件中的任何任何设置。\n\n另一方面，`settings.gradle`\
  \ 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时，应该搜索哪些在线仓库，以及项目名称。一个典型的 `settings.gradle` 文件内容如下：\n\
  \n```\npluginManagement {\n    repositories {\n        gradlePluginPortal()\n  \
  \      google()\n        mavenCentral()\n    }\n}\n\ndependencyResolutionManagement\
  \ {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories\
  \ {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name = \"\
  AndroidSample\"\n\ninclude ':app'\n```\n\n与 `gradle.properties` 文件一样，不太可能需要对此文件进行更改。\n\
  \n### 88.4 根级 Gradle 构建文件\n\n一个完整的 Android Studio 项目包含了构建 Android 应用程序所需的所有内容，由模块、库、manifest\
  \ 文件和 `Gradle` 构建文件组成。\n\n每个项目包含一个根级 `Gradle` 构建文件。该文件列为 `build.gradle` (Project:\
  \ <project name>)，可以在项目工具窗口中找到，如图 88-1 所示：\n\n![](img/as_4.1_project_gradle_file.jpg)\n\
  \n图 88-1\n\n默认情况下，根级 `Gradle` 构建文件的内容如下：\n\n```\n// 根构建文件，你可以在此处添加适用于所有子项目/模块的配置选项。\n\
  plugins {\n    id 'com.android.application' version '7.3.0' apply false\n    id\
  \ 'com.android.library' version '7.3.0' apply false\n}\n\ntask clean(type: Delete)\
  \ {\n    delete rootProject.buildDir\n}\n```\n\n目前，该文件的作用只是声明使用 `jcenter` 仓库获取远程库，并且构建依赖于\
  \ Gradle 的 Android 插件。在大多数情况下，没有对此构建文件进行任何更改。\n\n### 88.5 模块级 Gradle 构建文件\n\n一个\
  \ Android Studio 应用程序项目由一个或多个模块组成。例如，有一个名为 `GradleDemo` 的假设应用程序项目，它包含两个名为 `Module1`\
  \ 和 `Module2` 的模块。在这种情况下，每个模块都需要自己的 `Gradle` 构建文件。在项目结构方面，这些文件的位置如下：\n\n- `Module1/build.gradle`\n\
  - `Module2/build.gradle`\n\n默认情况下，`Module1` 的 `build.gradle` 文件将类似于以下：\n\n```\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures {\n\
  \        viewBinding true\n    }\n    namespace 'com.ebookrenzy.example'\n    compileSdk\
  \ 33\n    defaultConfig {\n        applicationId \"com.ebookrenzy.fragmentexample\"\
  \n        minSdk 26\n        targetSdk 33\n        versionCode 1\n        versionName\
  \ \"1.0\"\n        testInstrumentationRunner \"androidx.test.runner.AndroidJUnit\"\
  \n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n\
  \            proguardFiles getDefault('proguard-android-optimize.txt'), 'proguard-rules.pro'\n\
  \        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_8\n\
  \        targetCompatibility JavaVersion.VERSION_8\n    }\n}\n\ndependencies {\n\
  \    implementation 'androidx.appcompat:appcompat:1.6.0'\n    implementation 'com.google.android.material:material:1.7.0'\n\
  \    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n    testImplementation\
  \ 'junit:junit:4.13.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.3'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'\n}\n\
  ```\n\n从文件内容，构建文件首先声明使用 Android 插件：\n\n```\nplugins {\n    id 'com.android.application'\n\
  }\n```\n\n文件的 `android` 部分随后指定了构建 `Module1` 时使用的 SDK 版本。\n\n```\nandroid {\n   \
  \ compileSdk 33\n```\n\n`defaultConfig` 部分声明的项定义了在构建期间生成到模块 `AndroidManifest.xml`\
  \ 文件中的元素。这些设置可以在构建文件中修改，它们取自最初创建模块时在 Android Studio 中输入的设置：\n\n```\ndefaultConfig\
  \ {\n    applicationId \"com.ebookrenzy.fragmentexample\"\n    minSdk 26\n    targetSdk\
  \ 33\n    versionCode 1\n    versionName \"1.0\"\n    testInstrumentationRunner\
  \ \"androidx.test.runner.AndroidJUnit\"\n}\n```\n\n`buildTypes` 部分包含了在构建应用程序发布版\
  \ APK 文件时是否以及如何运行 `ProGuard` 的指令：\n\n```\nbuildTypes {\n    release {\n        minifyEnabled\
  \ false\n        proguardFiles getDefault('proguard-android-optimize.txt'), 'proguard-rules.pro'\n\
  \    }\n}\n```\n\n\n\n\n按照当前的配置，构建 `Module1` 时不会运行 ProGuard。要启用 ProGuard，需要将 `minify`\
  \ 条目从 `false` 改为 `true`。`proguard-rules.pro` 文件可以在项目的模块目录中找到。对该文件进行的更改将覆盖 `proguard-android.txt`\
  \ 文件中的默认设置，该文件位于 Android SDK 安装目录的 `sdk/tools/proguard` 之下。\n\n由于此文件中没有声明调试 `buildType`，将使用默认设置（即不带\
  \ ProGuard 的构建，使用调试密钥进行签名，并启用调试符号）。\n\n此外，在模块构建文件中还可能包含一个名为 `productFlavors` 的额外部分，以便创建多个构建变体。\n\
  \n接下来，包含了一些指令，用于指定构建项目时使用的 Java 编译器的版本：\n\n```\ncompileOptions {\n    sourceCompatibility\
  \ JavaVersion.VERSION_1_8\n    targetCompatibility JavaVersion.VERSION_1_8\n}\n\
  ```\n\n最后，`dependencies` 部分列出了模块所依赖的任何本地和远程依赖。上述示例文件中的依赖行指定了需要从 Android 仓库中包含的 Android\
  \ 库：\n\n```\nimplementation 'androidx.appcompat:appcompat:1.6.0'\n```\n\n请注意，依赖声明包含了版本号，用于指示应该包含哪个版本的库。\n\
  \n### 88.6 在构建文件中配置签名设置\n\n本书的“创建、测试和上传 Android App Bundle”章节涵盖了使用 Android Studio\
  \ 用户界面设置密钥和生成签名发布版 APK 文件的相关步骤。这些设置也可以在 `build.gradle` 文件的 `signingConfigs` 部分中声明。例如：\n\
  \n```\ndefaultConfig {\n\n}\nsigningConfigs {\n    release {\n        storeFile\
  \ file(\"keystore.release\")\n        storePassword \"your keystore password here\"\
  \n        keyAlias \"your key alias here\"\n        keyPassword \"your key password\
  \ here\"\n    }\n}\nbuildTypes {\n\n}\n```\n\n上面的示例将密钥密码信息直接嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\
  \n```\nsigningConfigs {\n    release {\n        storeFile file(\"keystore.release\"\
  )\n        storePassword System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"\
  your key alias here\"\n        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n\
  }\n```\n\n还有一种方法是配置构建文件，让 Gradle 在构建过程中提示输入密码：\n\n```\nsigningConfigs {\n    release\
  \ {\n        storeFile file(\"keystore.release\")\n        storePassword System.console().readLine(\"\
  \\nEnter Keystore password: \")\n        keyAlias \"your key alias here\"\n    \
  \    keyPassword System.console().readLIne(\"\\nEnter Key password: \")\n    }\n\
  }\n```\n\n## 88.7 从命令行运行 Gradle \n\n每个 Android Studio 项目都包含一个 Gradle wrapper 工具，用于从命令行调用\
  \ Gradle 任务。该工具位于每个项目文件夹的根目录下。虽然该 wrapper 在 Windows 系统上可以执行，但在 Linux 和 macOS 上使用之前可能需要启用执行权限。要启用执行权限，打开终端窗口，切换到需要\
  \ wrapper 的项目文件夹并执行以下命令：\n\n```\nchmod +x gradlew\n```\n\n一旦文件具有执行权限，则需要将文件位置添加到\
  \ `$PATH` 环境变量中，或者在名称名前加上 `./` 来运行。例如：\n\n```\n./gradlew tasks\n```\n\nGradle 将项目构建视为一系列不同的任务。通过在项目目录下运行以下命令可以获取当前项目可用任务的完整列表（在\
  \ macOS 或 Linux 上运行时，请记住在命令前加上 `./`）：\n\n```\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的项目调试发布版本，请使用\
  \ `assembleDebug` 选项：\n\n```\ngradlew assembleDebug\n```\n\n或者，构建应用程序的发布版本：\n\n\
  ```\ngradlew assembleRelease\n```\n\n### 88.8 总结\n\n在大多数情况下，Android Studio 在后台执行应用程序，无需任何干预。生命周期系统对于项目配置的许多基本方式来说已经了。\n\
