  \ 总结\n\n本章对材料设计、悬浮操作按钮和 Snackbar 进行了概述，并通过了一个使用这些功能的示例。\n\n悬浮操作按钮和 Snackbar 都是 Android\
  \ 材料设计界面实现方法的一部分。悬浮操作按钮提供了一种推广特定屏幕内最常用操作的方式。Snackbar 为应用程序提供了一种既能向用户展示信息，又能允许用户对其采取行动的方式。\n\
  \n## 46 使用 TabLayout 组件创建标签页界面\n\n上一章概述了 Android 中的材料设计概念，并介绍了设计支持库提供的两个组件：悬浮操作按钮和\
  \ Snackbar。本章将演示如何使用设计库的另一个组件 `TabLayout`它可以与 `ViewPager` 类结合，在 Android Activity\
  \ 中创建基于标签的界面。\n\n### 46.1 ViewPager2 简介\n\n\n\n\n\n虽然 `ViewPager2` 并不是设计支持库的一部分，但它与\
  \ `TabLayout` 组件配合使用时，是一个非常实用的伴侣类，用于实现标签页用户界面。`ViewPager2` 的主要作用是允许用户翻阅不同的信息页面，每个页面通常由一个布局片段（fragment）表示。与\
  \ `ViewPager2` 关联的片段由 `FragmentStateAdapter` 类的实例管理。\n\n至少，分配给 `ViewPager2` 的分页适配器必须实现两个方法。第一个方法命名为\
  \ `getItemCount()`，它必须返回可供用户显示的页面片段总数。第二个方法 `createFragment()` 接收一个页码，并必须返回相应的、已准备好展示给用户的分段对象。\n\
  \n## 46.2 TabLayout 组件概述\n\n如前所述，`TabLayout` 是物料设计（material design）作为一部分引入的组件之一，并包含在设计支持库中。`TabLayout`\
  \ 的目的是为用户提供行标签，可以通过选择标签来向用户显示不同的页面。标签可以是固定的也可以是可滚动的，用户可以通过向左或向右滑动查看比当前屏幕显示容量更多的标签。标签上显示的信息可以是文本、图像或文本与图像的组合。例如，图\
  \ 46-1 显示了一个包含四个显示图像标签的 App 标签栏：\n\n![](img/Image24251.jpg)\n\n图 46-1\n\n另一方面，图\
  \ 46-2 显示了一个 `TabLayout` 配置，其包含四个以可滚动配置显示文本的标签：\n\n![](img/Image24341.jpg)\n\n图\
  \ 46-2\n\n本章的剩余部分将通过创建一个示例项目，该项目将演示如何将 `TabLayout` 组件与 `ViewPager2` 以及四个片段一起使用。\n\
  \n## 46.3 创建 TabLayoutDemo 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Basic Activity` 模板。\n\n在 `Name`（名称）字段中输入 `TabLayoutDemo` 并指定 `com.ebookfrenzy.tablayoutdemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API` 级别设置改为 `API 26`：`Android 8.0 (Oreo)`，并将\
  \ `Language`（语言）菜单改为 `Java`。\n\n项目创建完成后，在 `Layout Editor`（布局编辑器）工具加载 `content_main.xml`\
  \ 文件，选择 `NavHostFragment` 对象并将其删除。由于我们不会使用 `Basic Activity` 模板的导航功能，请编辑 `MainActivity.java`\
  \ 文件并修改 `onCreate()` 方法以移除导航代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController =\n\
  \        Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration =\n        new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n}\n```\n\n最后，删除 `onSupportNavigateUp()` 方法：\n\
  \n```java\n@Override\npublic boolean onSupportNavigateUp() {\n    NavController\
  \ navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    return NavigationUI.navigateUp(navController, appBarConfiguration)\n      \
  \     || super.onSupportNavigateUp();\n}\n```\n\n## 46.4 创建第一个 Fragment\n\n`TabLayout`\
  \ 上的每个标签在选中时都会显示不同的片段。通过在 `Project` 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.tablayoutdemo`\
  \ 条目并选择 `New` -> `Fragment` -> `Fragment (Blank)` 选项来创建第一个片段。在出现的对话框中，在 `Fragment\
  \ Name:` 字段中输入 `Tab1Fragment`，并在 `Fragment Layout Name:` 字段中输入 `fragment_tab1`。点击\
  \ `Finish` 按钮创建新片段：\n\n![](img/as_4.2_new_fragment_java1.jpg)\n\n图 46-3\n\n编辑 `Tab1Fragment.java`\
  \ 文件，如果 Android Studio 没有自动添加，请按如下所示添加 `OnFragmentInteractionListener` 接口声明：\n\n\
  ```java\nimport android.net.Uri;\n\npublic interface OnFragmentInteractionListener\
  \ {\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n在 `Layout Editor` 工具加载\
  \ `fragment_tab1.xml`（位于 `res` -> `layout` 下），右键点击 `FrameLayout` 条目并选择 `Convert\
  \ to ConstraintLayout` 菜单。在出现的对话框中，点击 OK 之前验证所有选项均已选中。将布局的 ID 更改为 `constraintLayout`。\n\
  \n一旦布局转换为 `ConstraintLayout`，删除 `TextView`。从 `Palette`（调色板）中找到 `TextView` 组件并将其拖放使其位于布局中心。修改对象的属性使其显示“Tab\
  \ 1”，将字符串提取为资源 `tab_1`，然后点击 `Infer Constraints`（推断约束）按钮。此时布局应图 46-4：\n\n![](img/as_3.5_layout_ui.jpg)\n\
  \n图 46-4\n\n## 46.5 复制片段\n\n到目前为止项目包含一个片段。与其使用之前的步骤创建其余三个片段，不如复制第一个片段快。每个片段由一个布局\
  \ XML 文件和一个 Java 类文件组成，两者都需要复制。\n\n在 `Project` 工具窗口中右键点击 `fragment_tab1.xml` 文件并选择菜单中的\
  \ `Copy` 选项。右键点击布局条目，这次选择 `Paste` 选项。在出现的对话框中，点击 `OK` 之前将新布局文件命名为 `fragment_tab2.xml`。编辑\
