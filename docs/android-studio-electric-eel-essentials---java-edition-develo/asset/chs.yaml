  \   .navigate(R.id.action_FirstFragment_to_SecondFragment);\n    }\n});\n```\n\n\
  ## 45.8 更改悬浮操作按钮\n\n由于此示例的目标是配置悬浮操作按钮向列表添加条目，因此目前按钮上显示的邮件图标需要更改为更能指示所执行操作的内容。用于按钮的图标名为\
