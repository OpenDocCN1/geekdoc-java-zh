  \        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ manager = SplitInstallManagerFactory.create(this);\n    }\n\n    public void launchFeature(View\
  \ view) {\n        if (manager.getInstalledModules().contains(\"my_dynamic_feature\"\
  )) {\n```\n\n\n\n\n\n```java\nIntent i = new Intent(\"<com.yourcompany>.my_dynamic_feature.MyFeatureActivity\"\
  );\nstartActivity(i);\n} else {\n    binding.statusText.setText(\"Feature not yet\
  \ installed\");\n}\n}\n.\n}\n```\n\n# 85.8 上传 App Bundle 进行测试\n\n项目现在已准备好进行第一阶段测试。这涉及生成一个发布版本的\
